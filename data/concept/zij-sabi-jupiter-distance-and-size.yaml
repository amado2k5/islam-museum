label: { ar: "بُعد المشتري وعظم جرمه وقطره الظاهر", en: "The distance, size and apparent diameter of Jupiter", ur: "مشتری کا بُعد، جرم اور ظاہری قطر", es: "La distancia, el tamaño y el diámetro aparente de Júpiter", fr: "La distance, la taille et le diamètre apparent de Jupiter" }
summary:
  ar: "يذكر النص أن عظم المشتري في بعده الأقرب إلى عظمه في بعده الأبعد يقارب الواحد والنصف والتسع، وأن بعده الأبعد اثنا عشر ألفاً وثمانمائة وأربعة وعشرون بالتقريب، وأن قطره في بعده الأوسط جزء من اثني عشر من قطر الشمس. وأن قطره مثل قطر الأرض أربع مرات وزائد يسير، وأن عظم جرمه مثل عظم الأرض قريباً من إحدى وثمانين مرة. {cite:zij-sabi-nallino-byblion p.188}"
  en: "The text says Jupiter's size at its nearest distance is about one and a ninth times its size at its farthest. Its farthest distance is given as about twelve thousand, eight hundred and twenty-four, and its mean diameter as one twelfth of the Sun's diameter. Its diameter is about four times the Earth's diameter and a little more, and its bulk about eighty-one times the Earth's. {cite:zij-sabi-nallino-byblion p.188}"
  ur: "متن کہتا ہے کہ مشتری کا جسم اس کے قریب ترین بُعد پر اس کے دور ترین بُعد کے جسم سے تقریباً ایک اور نواں حصہ زیادہ ہے۔ اس کا دور ترین بُعد تقریباً بارہ ہزار آٹھ سو چوبیس بتایا گیا ہے، اور اس کا وسطی قطر سورج کے قطر کا بارہواں حصہ۔ اس کا قطر زمین کے قطر سے تقریباً چار گنا اور کچھ زیادہ، اور جرم زمین کے جرم سے تقریباً اکیاسی گنا۔ {cite:zij-sabi-nallino-byblion p.188}"
  es: "El texto indica que el tamaño de Júpiter en su punto más cercano es aproximadamente una vez y novena vez su tamaño en su punto más lejano. Su distancia más lejana se estima en unos doce mil ochocientos veinticuatro kilómetros, y su diámetro medio en una doceava parte del diámetro del Sol. Su diámetro es aproximadamente cuatro veces mayor que el de la Tierra, y su volumen es aproximadamente ochenta y una veces mayor que el de la Tierra. {cite:zij-sabi-nallino-byblion p.188}"
  fr: "Le texte indique que la taille de Jupiter à sa distance minimale est environ une fois et neuvième fois sa taille à sa distance maximale. Cette dernière est d'environ 12 824 kilomètres, et son diamètre moyen est un douzième du diamètre du Soleil. Son diamètre est environ quatre fois supérieur à celui de la Terre, et sa masse environ quatre-vingt-une fois supérieure à celle de la Terre. {cite:zij-sabi-nallino-byblion p.188}"
