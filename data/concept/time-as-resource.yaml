label:
  ar: "الزمن مورد اقتصادي"
  en: "Time as an economic resource"
summary:
  ar: "يعدّ المؤلف الزمن عنصرًا مهمًا من عناصر الإنتاج، وكل عمل يحتاج إلى زمن فلا يجوز إضاعته، وهو في حكم المال {cite:usul-iqtisad-islami-0660 p. 112}. ويستشهد بحديث المساءلة عن العمر والمال {cite:usul-iqtisad-islami-0660 p. 113}، ويقرر أن للزمن قيمة مالية في البيوع المؤجلة، ولا تطبق في القرض إلا صورة الثواب {cite:usul-iqtisad-islami-0660 p. 159}. ولا يُباع الزمن منفصلًا، لكنه يدخل في الثمن إذا تجسّد في عمل أو مال {cite:usul-iqtisad-islami-0660 p. 119}."
