id: concept/time-as-resource
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "الزمن مورد اقتصادي"
  en: "Time as an economic resource"
  es: "El tiempo como recurso económico"
  fr: "Le temps comme ressource économique"
  ur: "ایک اقتصادی وسائل کے طور پر وقت"
  tr: "Zaman ekonomik bir kaynaktır"
  id: "Waktu adalah sumber daya ekonomi"
summary:
  ar: "يعدّ المؤلف الزمن عنصرًا مهمًا من عناصر الإنتاج، وكل عمل يحتاج إلى زمن فلا يجوز إضاعته، وهو في حكم المال {cite:usul-iqtisad-islami-0660 p. 112}. ويستشهد بحديث المساءلة عن العمر والمال {cite:usul-iqtisad-islami-0660 p. 113}، ويقرر أن للزمن قيمة مالية في البيوع المؤجلة، ولا تطبق في القرض إلا صورة الثواب {cite:usul-iqtisad-islami-0660 p. 159}. ولا يُباع الزمن منفصلًا، لكنه يدخل في الثمن إذا تجسّد في عمل أو مال {cite:usul-iqtisad-islami-0660 p. 119}."
  tr: "Yazar, zamanı üretimin önemli bir unsuru olarak görür ve her eser zaman gerektirir, boşa harcanmamalıdır. Para olarak kabul edilir {cite:usul-iqtisad-islami-0660 s. 112}. Yaş ve servetle ilgili hesap verebilirlik hadisini atıfta bulunur {cite:usul-iqtisad-islami-0660 s. 113} ve zamanın ertelenmiş satışlarda finansal değeri olduğunu, krediler için ise sadece ödül biçiminin geçerli olduğunu belirtir {cite:usul-iqtisad-islami-0660 s. 159}. Zaman ayrı olarak satılmaz, ancak iş veya para içinde somutlaşmışsa fiyata dahil edilir {cite:usul-iqtisad-islami-0660 s. 119}."
  id: "Penulis menganggap waktu sebagai elemen penting dalam produksi, dan setiap pekerjaan membutuhkan waktu dan tidak boleh disia-siakan. Waktu dianggap sebagai uang {cite:usul-iqtisad-islami-0660 hlm. 112}. Ia mengutip hadits tentang akuntabilitas terkait usia dan kekayaan {cite:usul-iqtisad-islami-0660 hlm. 113}, dan menyatakan bahwa waktu memiliki nilai finansial dalam penjualan tertunda, dan hanya bentuk imbalan yang berlaku untuk pinjaman {cite:usul-iqtisad-islami-0660 hlm. 159}. Waktu tidak dijual secara terpisah, tetapi sudah termasuk dalam harga jika terkandung dalam pekerjaan atau uang {cite:usul-iqtisad-islami-0660 hlm. 119}."
