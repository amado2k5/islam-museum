summary:
  ar: "القبج في الكتاب معروف ويشاركه الطيهوج في صفاته، ولحمه ألطف اللحمان ويسمّن، ويجلو الفؤاد وينفع المعدة، ويذكر الكتاب أن لحمه يعقل وأنه يزيد في الباه نقلا موسوما {cite:canon-ibn-sina-print-v1 pp.659-660}"
  en: "Qabaj is in the book well known, and tayhuj shares its attributes; its flesh is the most subtle of meats and fattens, cleanses the heart and benefits the stomach; the book also lists, as a labelled report, that its flesh binds and adds to desire {cite:canon-ibn-sina-print-v1 pp.659-660}"
  ur: "قبج کتاب میں معروف ہے اور طیہوج اس کی صفات میں شریک ہے؛ اس کا گوشت گوشتوں میں سب سے لطیف ہے اور موٹا کرتا ہے، دل کو جلا دیتا ہے اور معدے کو نفع دیتا ہے؛ کتاب منقول فہرست کے طور پر یہ بھی درج کرتی ہے کہ اس کا گوشت قبض کرتا ہے اور باہ بڑھاتا ہے {cite:canon-ibn-sina-print-v1 pp.659-660}۔"
  es: "Qabaj es bien conocido en el libro, y tayhuj comparte sus atributos; su carne es la más sutil de las carnes y engorda, limpia el corazón y beneficia el estómago; el libro también enumera, como un informe etiquetado, que su carne ata y aumenta el deseo {cite:canon-ibn-sina-print-v1 pp.659-660}"
  fr: "Le cachou est bien connu dans le livre, et le tayhuj partage ses attributs; sa chair est la plus subtile des viandes et elle engraisse, purifie le cœur et est bénéfique pour l’estomac; le livre mentionne également, sous forme de rapport, que sa chair lie et accroît le désir {cite:canon-ibn-sina-print-v1 pp.659-660}"
  tr: "Kitaptaki 'Kabbaq' iyi bilinir ve Hyenalar tarafından paylaşılır. Eti iki etten en yumuşak olanıdır, kalbi şişirtir ve mideye fayda sağlar. Kitapta etinin mantıklı olduğu ve yağda arttığı belirtilir (atıf:kanon-ibn-sina-print-v1 s.659-660}"
  id: "'Qabbaq' dalam buku ini dikenal luas dan dibagikan oleh para Hyena. Dagingnya adalah yang paling lembut dari dua daging, menggemukkan hati, dan bermanfaat bagi perut. Buku menyebutkan bahwa dagingnya rasional dan bertambah dalam lemak (kutip: canon-ibn-sina-print-v1 hlm.659-660}"
