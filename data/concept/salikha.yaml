summary:
  ar: "السليخة في الكتاب أصناف، والجيد منها قشر شجرة شبيهة بشجرة الدارصيني تجلب من ناحية الصين وقوته قوة دارصيني ضعيف، حارة يابسة في الثالثة، تحلل الرياح الغليظة والأورام في الأحشاء وتقوي الأعضاء، وفي الكتاب نقل موسوم في الرحم {cite:canon-ibn-sina-print-v1 p.604}"
  en: "Salikha is in the book of many kinds, the good one being the bark of a tree like the cinnamon tree brought from the direction of China, with the power of a weak cinnamon; hot and dry in the third degree, it dissolves thick winds and swellings in the viscera and strengthens the organs, and the book gives a labelled listing on the womb {cite:canon-ibn-sina-print-v1 p.604}"
  ur: "سلیخہ کتاب میں کئی قسموں کی ہے اور اچھی قسم دارچینی کے درخت جیسے درخت کی چھال ہے جو چین کی طرف سے لائی جاتی ہے اور اس کی قوت کمزور دارچینی جیسی ہے؛ تیسرے درجے میں گرم خشک ہے، موٹی ہواؤں اور انتڑیوں کے ورموں کو گھلاتی اور اعضاء کو قوت دیتی ہے، اور کتاب میں رحم کے بارے میں ایک موسوم نقل ہے {cite:canon-ibn-sina-print-v1 p.604}۔"
  es: "Salikha se menciona en el libro como una variedad de hierbas, siendo la buena la corteza de un árbol similar al canelo traído de China, con el poder de una canela suave; caliente y seca en tercer grado, disuelve los vientos densos y las hinchazones en las vísceras y fortalece los órganos. El libro ofrece una lista detallada sobre el útero {cite:canon-ibn-sina-print-v1 p.604}."
  fr: "Le livre mentionne plusieurs sortes de Salikha, la meilleure étant l'écorce d'un arbre semblable au cannelier, importée de Chine, ayant la puissance d'une cannelle légère; chaude et sèche au troisième degré, elle dissout les vents épais et les gonflements des viscères et fortifie les organes. Le livre en donne une liste commentée concernant l'utérus {cite:canon-ibn-sina-print-v1 p.604}"
  tr: "Kitaptaki Sulaykhalar çeşitli türlerdendir; en iyisi, Çin'den güç getiren Darsini ağacına benzer bir ağacın kabuğudur ve güç, üçüncü tipte zayıf Darsini ise sıcak ve kurudur, iç organlardaki güçlü rüzgarları ve tümörleri çözer ve organları güçlendirir. Kitapta 'Rahimde' başlıklı bir alıntı yer alır {atıf:kanon-ibn-sina-print-v1 s.604}"
  id: "Sulaykha dalam buku ini terdiri dari berbagai jenis, yang terbaik adalah kulit pohon mirip pohon Darsini, yang membawa kekuatan dari Tiongkok dan kekuatan, Darsini lemah pada tipe ketiga, panas dan kering, melarutkan angin kencang dan tumor di isi perut, serta memperkuat organ-organ tersebut. Buku ini memuat kutipan berjudul 'In the Womb' {cite:canon-ibn-sina-print-v1 hlm.604}"
