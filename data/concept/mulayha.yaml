label:
  ar: "مليحة"
  en: "Mulayha (a boxthorn-like shrub)"
  ur: "ملیحہ"
  es: "Mulayha (un arbusto parecido al espino blanco)"
  fr: "Mulayha (un arbuste ressemblant à un épine-buis)"
summary:
  ar: "المليحة كالعوسج، ورقها كورق الزيتون وأعرض، وتؤكل كالبقول، فيها ملوحة وقبض ورطوبة فجة ينفخ بها، وتذكر للبن وللمغص {cite:canon-ibn-sina-print-v1 p.569}."
  en: "Mulayha is like the boxthorn, its leaf like an olive leaf but broader, and it is eaten as a vegetable; it has saltiness, astringency and a raw moisture that bloats, and is listed for milk and for colic {cite:canon-ibn-sina-print-v1 p.569}."
  ur: "ملیحہ عوسج جیسی ہے، اس کا پتا زیتون کے پتے جیسا مگر زیادہ چوڑا ہے، اور اسے ترکاریوں کی طرح کھایا جاتا ہے؛ اس میں نمکینی، قبض اور کچی نمی ہے جس سے پیٹ پھولتا ہے، اور دودھ اور مروڑ کے لیے مذکور ہے {cite:canon-ibn-sina-print-v1 p.569}۔"
  es: "La mulayha es parecida al espino de caja, su hoja es como la de olivo pero más ancha, y se come como verdura; tiene un sabor salado, astringente y una humedad cruda que provoca hinchazón, y se menciona para la leche y para los cólicos {cite:canon-ibn-sina-print-v1 p.569}."
  fr: "Mulayha ressemble à l'épine-vinette, sa feuille ressemble à une feuille d'olivier mais est plus large, et elle est consommée comme légume; elle a du sel, de l'astringence et une humidité crue qui provoque des ballonnements, et est mentionnée pour le lait et pour les coliques {cite:canon-ibn-sina-print-v1 p.569}."
