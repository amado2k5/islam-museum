id: concept/wujub-fiqh
class: concept
kind: legal
label: { ar: "وُجُوب", en: "Wujub (obligation as a state of the duty-bearer, and the difference from performance)" }
summary:
  ar: "الوجوب في اللغة الثبوت واللزوم، والسقوط إلى الأرض، والموت، وعند الفقهاء شغل الذمة بالواجب، وعند الأصوليين تعلق الإيجاب بأفعال المكلفين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} والإيجاب طلب الفعل مع المنع من الترك، والواجب فعل المكلف نفسه، وقد يُنسب الحكم إلى الحاكم فيُسمى إيجاباً، ويُنسب إلى المكلف فيُسمى وجوباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624} وقال الزركشي لا فرق عند الشافعية بين الوجوب ووجوب الأداء، أما جمهور الحنفية فيفرّقون: الوجوب شغل الذمة، ووجوب الأداء طلب تفريغها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624}"
  en: "Wujub in the lexical sense is affirmation and binding, a falling to the ground, and death; for the jurists it is the occupation of the duty-bearer's obligation by the duty, and for the usuli scholars it is the link of the command to the acts of the responsible person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} Command (iljab) is the demand of an act with a prohibition of leaving it, and the obligatory is the act of the person himself; when a ruling is attributed to the lawgiver it is called iljab, and when attributed to the person it is called wujub. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624} The Shafi'i Zarkashi holds no difference between wujub and wujub al-ada (obligation to perform), while most Hanafis distinguish them: wujub is the debt laid on the person, and wujub al-ada is the demand to discharge it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624}"
