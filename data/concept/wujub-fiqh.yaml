label: { ar: "وُجُوب", en: "Wujub (obligation as a state of the duty-bearer, and the difference from performance)", es: "Wujub (la obligación como estado del deberante y la diferencia con el desempeño)", fr: "Wujub (l'obligation en tant qu'état du porteur de devoir, et la différence avec l'exécution)", ur: "وضوء ⁦( فرض شناسی کی حالت کے طور پر، اور کارکردگی سے فرق)⁩", tr: "Yükümlülük", id: "Kewajiban" }
summary:
  ar: "الوجوب في اللغة الثبوت واللزوم، والسقوط إلى الأرض، والموت، وعند الفقهاء شغل الذمة بالواجب، وعند الأصوليين تعلق الإيجاب بأفعال المكلفين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} والإيجاب طلب الفعل مع المنع من الترك، والواجب فعل المكلف نفسه، وقد يُنسب الحكم إلى الحاكم فيُسمى إيجاباً، ويُنسب إلى المكلف فيُسمى وجوباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624} وقال الزركشي لا فرق عند الشافعية بين الوجوب ووجوب الأداء، أما جمهور الحنفية فيفرّقون: الوجوب شغل الذمة، ووجوب الأداء طلب تفريغها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624}"
  en: "Wujub in the lexical sense is affirmation and binding, a falling to the ground, and death; for the jurists it is the occupation of the duty-bearer's obligation by the duty, and for the usuli scholars it is the link of the command to the acts of the responsible person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} Command (iljab) is the demand of an act with a prohibition of leaving it, and the obligatory is the act of the person himself; when a ruling is attributed to the lawgiver it is called iljab, and when attributed to the person it is called wujub. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624} The Shafi'i Zarkashi holds no difference between wujub and wujub al-ada (obligation to perform), while most Hanafis distinguish them: wujub is the debt laid on the person, and wujub al-ada is the demand to discharge it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624}"
  es: "Wujub en sentido léxico es afirmación y vinculación, una caída al suelo y la muerte; para los juristas es la ocupación de la obligación del deber por el deber, y para los eruditos usuli es el vínculo del mandato con los actos de la persona responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} El mandato (iljab) es la exigencia de un acto con la prohibición de abandonarlo, y lo obligatorio es el acto de la persona misma; cuando una norma se atribuye al legislador se llama iljab, y cuando se atribuye a la persona se llama wujub. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624} El Shafi'i Zarkashi no establece ninguna diferencia entre wujub y wujub al-ada (obligación de realizar), mientras que la mayoría de los hanafis los distinguen: wujub es la deuda impuesta a la persona, y wujub al-ada es la exigencia de cumplirlo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624}"
  fr: "Le terme « wujub », au sens littéral, désigne l’affirmation et l’engagement, la chute au sol et la mort. Pour les juristes, il s’agit de l’accomplissement de l’obligation par le titulaire du devoir, tandis que pour les savants usuli, il représente le lien entre le commandement et les actes de la personne responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} Le commandement (iljab) est l’injonction d’accomplir un acte, assortie d’une interdiction de s’y soustraire; l’obligation, quant à elle, est l’acte accompli par la personne elle-même. Lorsqu’une règle est attribuée au législateur, on parle d’iljab; lorsqu’elle est attribuée à la personne, on parle de wujub. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624} Le Shafi'i Zarkashi ne fait aucune différence entre wujub et wujub al-ada (obligation d'accomplir), alors que la plupart des Hanafis les distinguent: wujub est la dette imposée à la personne, et wujub al-ada est la exiger de le libérer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16624}"
  ur: "لغوی معنوں میں وجوب اثبات اور پابند، زمین پر گرنا اور موت ہے۔ فقہاء کے نزدیک یہ فرض کے اعتبار سے ذمہ دار کی ذمہ داری ہے اور اہل علم کے نزدیک یہ ذمہ دار کے اعمال سے حکم کی کڑی ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16623} حکم ⁦(الجاب)⁩ کسی عمل کا مطالبہ ہے جس میں اسے چھوڑنے کی ممانعت ہو، اور واجب خود انسان کا عمل ہے۔ جب کوئی حکم قانون دینے والے کی طرف منسوب کیا جائے تو اسے الجاب کہتے ہیں اور جب اس شخص کی طرف منسوب کیا جائے تو اسے وجوب کہتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16623} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16624} شافعی زرکشی وضوب اور وجوب العادۃ میں کوئی فرق نہیں رکھتے۔ شخص، اور وجوب العادۃ اس کو خارج کرنے کا مطالبہ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16624}"
  tr: "Arapçada yükümlülük (vacip) kelimesi, kuruluş, zorunluluk, yere düşme ve ölüm anlamlarını taşır. İslam hukukunda (fıkıh) ise bir görevi yerine getirme yükümlülüğünü ifade eder. Hukuk teorisinde (usul al-fiqh) ise yükümlülüğün, hukuken sorumlu kişilerin (mukallaf) eylemleriyle bağlantısıdır. Yükümlülük (icab), bir eylemin talep edilmesi ve ihmal edilmesinin yasaklanmasıdır. Zorunlu fiil (vacip), hukuken sorumlu kişinin eylemidir. Bir hüküm, yöneticiye (hakim) atfedilebilir; bu durumda yükümlülük (icab) olarak adlandırılır; veya hukuken sorumlu kişiye (mukallaf) atfedilebilir; bu durumda yükümlülük (vujub) olarak adlandırılır. El-Zarkashi, Şafiî mezhebinin yükümlülük (vacip) ile yerine getirme yükümlülüğü (vujub al-ada') arasında bir ayrım yapmadığını belirtmiştir. Ancak Hanefi âlimlerinin çoğunluğu şu ayrımı yapar: Vacip, bir görevi yerine getirme yükümlülüğüdür; edim yükümlülüğü ise o görevi yerine getirme talebidir."
  id: "Kewajiban (wajib) dalam bahasa Arab berarti penetapan, kebutuhan, jatuh ke tanah, dan kematian. Dalam yurisprudensi Islam (fiqh), ia merujuk pada kewajiban untuk memenuhi suatu tugas. Dalam teori hukum (usul al-fiqh), ia adalah hubungan kewajiban dengan tindakan orang-orang yang bertanggung jawab secara hukum (mukallaf). Kewajiban (ijab) adalah tuntutan untuk suatu tindakan yang disertai dengan larangan untuk tidak melakukannya. Tindakan yang wajib (wajib) adalah tindakan orang yang bertanggung jawab secara hukum. Suatu hukum dapat dikaitkan dengan penguasa (hakim), dalam hal ini disebut kewajiban (ijab), atau dengan orang yang bertanggung jawab secara hukum (mukallaf), dalam hal ini disebut kewajiban (wujub). Al-Zarkashi menyatakan bahwa mazhab Syafi'i tidak membedakan antara kewajiban (wajib) dan kewajiban pelaksanaan (wujub al-ada'). Namun, mayoritas ulama Hanafi membedakan: kewajiban (wajib) adalah kewajiban untuk memenuhi suatu tugas, sedangkan kewajiban pelaksanaan (wujub al-ada') adalah tuntutan untuk melaksanakan tugas tersebut."
