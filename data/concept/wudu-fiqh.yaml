id: concept/wudu-fiqh
class: concept
kind: legal
label:
  ar: "وُضوء"
  en: "Wudu' (ablution, fiqh)"
summary:
  ar: "الوضوء في اللغة من الوَضاءة، أي الحسن والنظافة. والوُضوء بالضم الفعل، وبالفتح الماء الذي يُتوضأ به، وقيل هما لغتان أو مصدران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364} وعرّفه الفقهاء: الحنفية بأنه الغسل والمسح على أعضاء مخصوصة؛ والمالكية بأنه طهارة مائية تتعلق بأعضاء مخصوصة على وجه مخصوص؛ والشافعية بأنه أفعال مخصوصة مفتتحة بالنية؛ والحنابلة بأنه استعمال ماء طهور في الأعضاء الأربعة على صفة مخصوصة في الشرع، مرتبة متوالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}\n\nوالغُسل استعمال الماء في جميع البدن على وجه مخصوص، والوضوء والغسل كلاهما يرفع الحدث، فيرفع الوضوء الحدث الأصغر والغسل الأكبر. والطهارة أعم من الوضوء، وهي ارتفاع الحدث وزوال النجس. والتيمم في اللغة التوخي والقصد، وفي الاصطلاح مسح الوجه واليدين بصعيد طاهر على وجه مخصوص، ويكون من الحدث الأصغر أو الأكبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}\n\nوذهب جمهور الفقهاء إلى أن الوضوء من الشرائع القديمة، وأن الذي خُصّت به هذه الأمة هو الكيفية المخصوصة أو أثر الوضوء، وهو الغرّة والتحجيل، واستدلوا بأحاديث وضوء الأنبياء وسارة وجريج. وذهب المالكية في قول، والشافعية في مقابل الأصح، وبعض الحنفية، إلى أن الوضوء نفسه من خصائص هذه الأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367}\n\nوقد فُرض الوضوء بمكة مع الصلاة، والمعيّة هنا للمكان لا للزمان، وكان النبي لا يصلي إلا بوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} ومشروعيته بالكتاب والسنة والإجماع، ومن الكتاب آية المائدة، وقد عدّها بعض الفقهاء دليل الفرضية، وذهب الجمهور إلى أن المقصود إذا قمتم إلى الصلاة وأنتم محدِثون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} ومن السنة قوله: لا تُقبل صلاة بغير طهور. وأجمع أهل السير أن الوضوء فُرض بمكة بتعليم جبريل ، وأجمعت الأمة على مشروعيته ووجوبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} ونص الفقهاء على أن من أنكر وجوب الوضوء للصلاة يكفر؛ وقال الحنفية إن إنكار وجوبه لغير الصلاة، كمس المصحف، لا يُكفِّر لوقوع الخلاف في تفسير آيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nأما من ترك الوضوء عمداً ثم صلى محدثاً: فعند الحنفية يكفر من استخف بالدين كالصلاة بلا وضوء عمداً؛ وعند المالكية يُقتل بترك الطهارة كالصلاة؛ وعند الشافعية يُستتاب، فإن لم يتب قُتل حداً لا كفراً؛ وعند الحنابلة من ترك شرطاً مجمعاً عليه كالطهارة فحكمه حكم تاركها، ومن ترك الصلاة جاحداً أو غير جاحد دُعي إليها ثلاثة أيام فإن لم يصلِّ قُتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nالحكم التكليفي للوضوء يختلف باختلاف ما يُتوضأ له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nأولاً: ما يكون الوضوء له فرضاً. الصلاة: اتفق الفقهاء على أنه فرض على المحدث إذا أراد القيام لصلاة فرض أو نفل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} والحنفية يوجبونه لصلاة الجنازة لأنها صلاة، ويشترط لها ما يشترط لبقية الصلوات، وجمهور الفقهاء يوجبونه لسجدة التلاوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} والطواف: الجمهور من المالكية والشافعية والحنابلة يوجبونه للطواف فرضه ونفله، والحنفية يرونه واجباً، ويترتب على ذلك أن من طاف الفرض محدثاً لزمه دم، ومن طاف جنباً لزمته بدنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} ومس المصحف: الجمهور على أنه فرض لمسه، والدليل آية الواقعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}\n\nثانياً: ما يكون الوضوء له سنة. قال الحنفية والحنابلة والشافعية غير البغوي إن الوضوء للنوم سنة، واستدلوا بحديث الاضطجاع على الشق الأيمن بعد الوضوء، المروي في الصحيحين. وقال المالكية إنه مستحب، وفي قول لهم أن وضوء الجنب للنوم سنة، وفي قول واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}\n\nثالثاً: ما يكون الوضوء له مندوباً. ضابطه كل وضوء ليس شرطاً في صحة ما يُفعل به بل من كماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} ومن ذلك: قراءة القرآن وقراءة الحديث وروايته، وذكر الله، والأذان، والإقامة على خلاف بين الفقهاء، والخطبة، ودراسة العلم الشرعي، والوقوف بعرفة والسعي بين الصفا والمروة، وزيارة النبي  ودخول مسجده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} وفي تجديد الوضوء اختلف الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} ويستحب للجنب الوضوء عند إرادة الأكل والشرب ومعاودة الوطء والنوم عند جمهور الحنفية والشافعية والحنابلة، والمالكية يرون أن الوضوء للأكل والشرب والجماع ليس على الجنب، وإنما يُستحب غسل اليدين والفرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} ويندب عند الحنفية المحافظة على الوضوء بتجديده كلما أحدث، والوضوء للخروج من خلاف العلماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}\n\nرابعاً: ما يباح له الوضوء. عند المالكية الوضوء للتنظيف والتبرد؛ وذكر القاضي عياض أن الوضوء المباح للدخول على الأمراء وركوب البحر ونحوه من المخاوف، وأنه قد يكون مستحباً، واستظهر الحطاب الاستحباب فيها ما عدا التنظيف والتبرد. وهذا الوضوء لا يرفع الحدث ما لم يُنوَ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nخامساً: الوضوء الممنوع، وعند المالكية هو المجدَّد قبل أن تُفعل به عبادة، أو الوضوء لغير ما شُرع له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nوفضيلة الوضوء: وردت أحاديث في سقوط الخطايا به، منها أن الطهور شطر الإيمان، وما رُوي عن عثمان في وضوء النبي  وأن من توضأ هكذا غُفر له ما تقدم من ذنبه، وحديث عمر في أبواب الجنة الثمانية، وحديث أبي هريرة في الغُرّ المحجّلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nشروط الوضوء: منها شروط الوجوب، ومنها شروط الصحة، ومنها ما هو للوجوب والصحة معاً؛ وأول شروط الوجوب العقل، إذ لا خطاب على غير العاقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nالواجب في غسل الأعضاء في الوضوء: يكفي عند الجمهور (الحنفية والشافعية والحنابلة) جريان الماء على العضو دون دَلك، وانفرد المالكية والمزني بشرط الدلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} وعند الحنفية يكون الغسل بإسالة الماء مع التقاطر ولو قطرة، وعن أبي يوسف يكفي مجرد بلّ المحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} وعند الشافعية المراد بالغسل الانغسال، سواء بفعل المتوضئ أو بفعل غيره أو بلا فعل كنزول المطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}\n\nالوجه: ما تحصل به المواجهة، فيُغسل ظاهره كله. وحدّه عرضاً ما بين الأذنين، وطولاً من منابت الشعر في الرأس إلى أسفل الذقن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} وعند المالكية والحنابلة يكون الطول في من لا لحية له إلى منابت الشعر، وفي من له لحية إلى منتهى اللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} والشعر المسترسل خارج دائرة الوجه: عند الحنفية لا يجب غسله، والشافعية يوجبونه إن كان خفيفاً ظاهراً وباطناً، وإن كان كثيفاً فظاهره فقط، وفي قول لهم لا يجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383}\n\nغسل الشعر النابت على الوجه: عند الحنفية لا يجب غسل أصول الشعر الكثيف للحرج، ويجب غسل الخفيف ظاهراً وباطناً إلى البشرة. وعند المالكية يجب تخليل الخفيف وإيصال الماء إلى البشرة، ولا يُخلَّل الكثيف بل يكفي إمرار الماء على ظاهره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384} وعند الشافعية تُغسل شعور الهدب والحاجب والشارب والعذار والعنفقة ظاهراً وباطناً، وقد تُغسل لحية المرأة والخنثى كذلك؛ وفي لحية الرجل يُغسل الخفيف ظاهراً وباطناً، ويُغسل الكثيف ظاهره فقط، والمعتمد عندهم أنه إن تميّز الخفيف عن الكثيف فلكل حكمه، وإن اختلطا غُسل الكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} وعند الحنابلة يجب غسل اللحية وما خرج عن حد الوجه من الشعر المسترسل، ويجب غسل الكثيف من الشعور في الوجه كالعنفقة والشارب والحاجب ولحية المرأة والخنثى، ويُسنّ تخليل اللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}\n\nغسل ماق العين وداخلها: يُغسل مع الوجه ماق العين، فإن كان عليها رمص وجبت إزالته. أما داخل العين فالجمهور على أنه لا يُغسل مع الوجه في الوضوء، لأن النبي لم يفعله ولا أمر به، ولأنه يضره الماء الحار والبارد؛ وروي عن أحمد وجوب غسله بشرط أمن الضرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} وإن تنجس داخل العين أوجب المالكية والشافعية وأحمد في قول غسله، وعند الحنفية والحنابلة في المذهب يُعفى عنه في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}\n\nغسل موضع الغمم، وهو ما نزل من الشعر عن المعتاد من حد منبته في الرأس إلى حد ينتهي إلى المعتاد وقدر ما يتم به الواجب، فيُغسل مع الوجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} وموضع التحذيف، وهو ما نبت عليه الشعر الخفيف بين العذار والنزعة، فيه خلاف: عند جمهور الشافعية والمالكية في رأي والحنابلة في الصحيح أنه من الرأس فلا يُغسل مع الوجه؛ وعند الحنفية والمالكية في رأي والحنابلة في قول والشافعية في قول، وهو الأصح عند الغزالي والرافعي، أنه من الوجه فيُغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالبياض بين العذار والأذن: عند الشافعية والحنابلة وظاهر المذهب عند الحنفية وبه يُفتى أنه من الوجه، وعن أبي يوسف رواية أنه ليس منه؛ وعند المالكية يُغسل البياض المحاذي لوتد الأذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالشفتان: يجب غسل ما يظهر من حمرتهما عند انضمامهما الطبيعي، وقيل عند الحنفية في وجه إن الشفة تبع للفم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} وغسل جزء من الرأس عند غسل الوجه واجب عند الفقهاء، وزاد الشافعية غسل جزء من الحلق وما تحت الحنك والأذنين، لأن ما لا يتم الواجب إلا به واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالعذار يُغسل مع الوجه، ويُغسل ما ظهر من الأنف بالجدع عند الشافعية، والوترة (الحاجز بين المنخرين) عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388} وعند جمهور الفقهاء داخل الفم والأنف ليسا من الوجه، فلا يجب غسلهما فيه؛ وعند الحنابلة الفم والأنف من الوجه، فتجب المضمضة والاستنشاق في الطهارتين، واستندوا إلى حديث عائشة في أنهما من الوضوء الذي لابد منه، وقد أعلّه الدارقطني بالإرسال عند بعض الرواة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nالصدغ وموضع الصلع والنزعتين: جمهور الفقهاء على أنها من الرأس لا من الوجه؛ وعند الحنابلة في قول أن الصدغ من الوجه؛ وقال الشربيني يُسنّ غسل موضع الصلع والتحذيف والنزعتين والصدغين مع الوجه للخلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} والمالكية يغسلون أسارير الجبهة وما غار من جفن ونحوه إن أمكن إيصال الماء إليه بدلك، فإن لم يمكن سقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nالأذنان: خالف الزهري الجمهور فجعلهما من الوجه يُغسلان معه، واستدل بحديث في سجود الوجه، والجمهور أجابوا بأن الأذنين من الرأس، واستشهدوا بمسح النبي أذنيه مع رأسه، وأن إضافتهما إلى الوجه لمجاورتهما له، والشيء يُسمى باسم ما جاوره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nمن غسل ظاهر شعر اللحية ثم زال الشعر أو انقلعت جلدة من وجهه بعد غسلها: فعند الحنفية والمالكية في الراجح والحنابلة والشافعية في أحد الوجهين لا يلزمه غسل ما ظهر ولا إعادة وضوئه، لأن الفرض انتقل إلى الشعر، وعند الشافعية في الأصح والمالكية في قول وابن جرير يجب غسل البشرة إذا ظهرت، قياساً على ظهور قدم الماسح على الخف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nالفرض الثاني: غسل اليدين إلى المرفقين، وهو ركن من أركان الوضوء وفرض باتفاق، بالكتاب، وبحديث أبي هريرة في صفة وضوء النبي، وبالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وجمهور الفقهاء (المالكية والشافعية والحنابلة في المذهب والحنفية ما عدا زفر) يوجبون غسل المرفقين مع اليدين، لأن «إلى» في الآية إن كانت بمعنى «مع» فالدخول ظاهر، وإن كانت للغاية فالحد إذا كان من جنس المحدود دخل فيه، ولحديث عباد العبدي في صفة الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وقال زفر وأحمد في قول والمالكية في قول بعدم دخول المرفق، قياساً على الليل في آية الصوم؛ وفي قول آخر للمالكية يدخل احتياطاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391}\n\nقطع بعض ما يجب غسله من اليد: يجب غسل ما بقي منه بالاتفاق، لحديث «إذا أمرتكم بأمر فأتوا منه ما استطعتم»، ولأن الميسور لا يسقط بالمعسور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وحكم قطع اليد من المرفق ينظر فيه الحنفية وغيرهم، ويتصل بالصفحة التالية (ص 17392 فما بعد)، وقد بقي هذا الجزء من المدخل غير مكتمل.\n\nقطع اليد من المرفق: عند الجمهور القائلين بوجوب غسل المرفق يُغسل موضع القطع، والحنفية والحنابلة في المذهب والشافعية في المشهور والمالكية في قول يوجبون غسل العظم الذي هو طرف العضد، لأن غسل العظمين المتلاقيين من الذراع والعضد واجب فإذا زال أحدهما غسل الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} وعند المالكية والشافعية في مقابل المشهور لا يجب غسل موضع القطع، لأن المرفق في الذراع وقد وقع عليه القطع، إلا أن يُعرف بقاء شيء من المرفق في العضد فيُغسل موضع القطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nقطع اليد من فوق المرفق: يسقط وجوب الغسل لعدم محله، لكن الشافعية نصوا على ندب غسل باقي العضد لئلا يخلو العضو من طهارة، وقالوا إن قُطع من المنكب ندب غسل محل القطع بالماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nغسل ما زاد من أصبع أو كف أو يد: الحنفية والمالكية والشافعية والقاضي من الحنابلة يوجبون غسل الإصبع أو الكف الزائدة إن نبتت في محل الفرض مع الأصلية. وإن نبتت في غير محل الفرض كالمنكب أو العضد، فجمهور الفقهاء يوجبون غسل ما حاذى منها محل الفرض، والحنابلة في الأصح لا يوجبون غسل المتميزة منها في غير محل الفرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nغسل ظفر اليد أو ما تحته: الحنفية والشافعية والحنابلة يوجبون غسل الظفر وإن طال لأنه متصل باليد اتصال خلقة فيدخل في مسمى اليد. وعند المالكية والحنابلة في قول لا يضر الوسخ اليسير تحت الظفر ولو منع وصول الماء، واحتج المرداوي بأنه مما يكثر وقوعه، فلو اشترط زواله لبيّنه النبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393} وعند الحنفية، بحسب الفتاوى، إن بقي من موضع الوضوء قدر رأس إبرة أو لزق بأصل الظفر طين يابس أو رطب لم يجز، وإن تلطخت اليد بخميرة أو حناء جاز؛ وإذا طال الظفر وجب إيصال الماء إلى ما تحته، وإذا قصر فلا يجب؛ وإذا طالت الأظفار حتى خرجت عن رؤوس الأصابع وجب غسلها بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} ونقل الكتاب عن بعض الحنفية التفريق بين أهل المدن وأهل القرى، ونقل الدبوسي الفتوى بالجواز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} والشافعية يوجبون غسل الشعر الظاهر على اليد ظاهراً وباطناً وإن كثف، وإلا غسلوا ما ظهر منه فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} والمالكية على المشهور يوجبون تخليل أصابع اليدين، ويجب عندهم معاهدة عقد الأصابع ورؤوسها وتكاميش الأنامل؛ ولا يجب تحريك الخاتم المأذون فيه لرجل أو امرأة، ويجب نزع الخاتم غير المأذون فيه إلا أن يكون واسعاً يدخل الماء تحته فيكفي تحريكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}\n\nغسل اليد الزائدة: الحنفية والمالكية والشافعية والحنابلة يوجبون غسل يد زائدة نبتت في محل الفرض. وإن نبتت في غير محل الفرض، فعند الحنفية والشافعية والحنابلة في قول يجب غسل ما حاذى منها محل الفرض، وعند المالكية إن لم يكن لها مرفق، فإن كان لها مرفق غُسلت كلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} وعند الحنفية، إن خُلق له يدان، فالتي يبطش بها هي الأصلية تُغسل، والأخرى زائدة؛ وعند الشافعية يجب غسل الزائدة التي لم تتميز عن الأصلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nغسل الجلد المتدلي من العضد: الحنفية والشافعية يوجبون غسل ما حاذى محل الفرض منه فقط، والحنابلة يوجبون غسل الجلدة المتقلعة من العضد إذا تدلت من الذراع كالإصبع الزائدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} وغسل الجلد المتدلي من الذراع واجب عند الفقهاء؛ وإن التحم رأسه بالعضد غُسل ما حاذى محل الفرض، ثم إن تجافى عنه غُسل ما تحته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nالفرض الثالث: مسح الرأس، وهو باتفاق الفقهاء من أركان الوضوء أو فروضه، بالكتاب، وبالأحاديث في وصف وضوء النبي، ومنها حديث عثمان. والمسح إمرار اليد المبتلة بالماء على الرأس بلا تسييل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} وتبدأ مسائل مسح الرأس، ومنها القدر المجزئ فيه، ويُختلف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nمسح الرأس: قال المالكية على المشهور والحنابلة على الصحيح في المذهب بوجوب مسح الرأس كله، ويدخل فيه الجلد والشعر من منابت الشعر المعتادة من مقدم الرأس إلى نقرة القفا، مع مسح شعر الصدغين، ولا يُمسح العظم الناتئ الذي هو من الوجه بل يُغسل معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} وفي الأقوال عند المالكية: أشهب يكفي عنده مسح النصف، وعنه أن مسح الناصية يجزئ، ومحمد بن مسلمة يجزئ مسح الثلثين، وأبو الفرج يجزئ مسح الثلث، ويُرد اليد تحت الشعر ليحصل التعميم، والرد سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} وعند الحنابلة يجب مسح ظاهر الرأس كله، وعن أحمد يجزئ أكثره، واختلفوا في تحديد الأكثر، وعن أحمد يجزئ قدر الناصية، وعنه يجزئ بعضه دون تحديد؛ ولو مسح البشرة فقط لم يجزئه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}\n\nوعند الحنفية ركن الوضوء مسح الرأس مرة فوق الأذنين، والمقدار المفروض في أشهر الروايات ربع الرأس وهو المعتمد في المذهب، وفي رواية أنه قدر الناصية، وفي رواية ثالثة قدر ثلاث أصابع، وفي البدائع أنها رواية الأصول، وفي الظهيرية عليها الفتوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} وعند الشافعية يجزئ مسمى المسح على بعض بشرة الرأس أو بعض شعره داخل حد الرأس، ويصدق المسح على البشرة أو الشعر، لأن الرأس اسم لما رأس وعلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nكيفية المسح: عند الحنفية على الأصح يُمسح بثلاث أصابع من اليد، فلو مسح بإصبع أو إصبعين لم يجز في ظاهر الرواية، ويجوز بالسبابة والإبهام مفتوحتين مع ما بينهما من الكف لأنها تعادل ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} وعند الحنابلة يجزئ المسح على أي كيفية، باليد أو بحائل، على الصحيح في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nما نزل عن الرأس من الشعر: الحنفية والشافعية والحنابلة لا يجب مسحه، والمالكية يوجبون مسح ما استرخى منه ولو طال جداً لأنه من شعر الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nغسل الرأس بدل مسحه: جمهور الفقهاء يجزئ، لأنه مسح وزيادة، واشترط الحنابلة في الصحيح أن يمرّ يده على الرأس، وعن أحمد يجزئ غسله دون إمرار اليد؛ ويُكره عند الحنفية والمالكية في الأظهر والحنابلة غسل الرأس ابتداءً بدل مسحه، لأنه خلاف المأمور به، وقال بعض المالكية والشافعية وأحمد في قول إنه لا يجزئ لأنه لا يُسمى مسحاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nحلق شعر الرأس بعد الوضوء: جمهور الفقهاء يرون أنه لا يؤثر، وقال الحنفية لا يُعاد الوضوء، لأن المسح على الشعر ليس بدلاً عن البشرة. وعند المالكية في رأي تجب إعادة مسح الرأس بعد الحلق، والدسوقي يرى هذا الرأي ضعيفاً؛ وعن ابن جرير الطبري الإعادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} وعن ابن رجب أن أحمد استحب أن يمس الرأس بالماء بعد الحلق ولم يوجبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nتكرار المسح: الحنفية والمالكية والحنابلة على أن المسح مرة واحدة، لأن التكرار يصير غسلاً، واستدل الحنابلة بأن أكثر من وصف الوضوء ذكر مسح الرأس مرة، وقال أبو داود إن أحاديث عثمان كلها تدل على ذلك؛ والشافعية يسنّون تثليث مسح الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالشعور المضفورة: عند المالكية ما ضُفر بنفسه لا يُنقض مطلقاً، وما ضُفر بثلاثة خيوط يجب نقضه، وما ضُفر بأقل منها يُنقض إن اشتد، والصاوي يرى أن النساء ينفعهن تقليد الشافعي أو أبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالمسح على العمامة: تفصيله في باب المسح، ويُحال إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالفرض الرابع، غسل الرجلين إلى الكعبين، وفيه أربعة أقوال. القول الأول، وهو مذهب الجمهور، أنه من أركان الوضوء غسل الرجلين، ويثبت ذلك بالإجماع، وقد نقل عبد الرحمن بن أبي ليلى أن أصحاب النبي أجمعوا على غسل القدمين، وقال الماوردي إن فرضهما عند كافة الفقهاء الغسل دون المسح، ونقل النووي عن أبي حامد وغيره إجماع المسلمين على وجوب غسلهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}\n\nالقول الثاني: أن فرض الرجلين المسح دون الغسل، وروي ذلك عن علي وابن عباس وأنس والشعبي وغيرهم، واستدلوا بقراءة الجر في آية المائدة، وقد ثبت رجوع علي عنه بأمره بغسل الأقدام، وقال ابن قدامة إنه لم يعلم من فقهاء المسلمين من يقول بالمسح غير من ذُكروا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nالقول الثالث: الحسن البصري والجبائي وابن جرير الطبري في إحدى الروايات أن المتوضئ مخيّر بين غسل الرجلين ومسحهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} القول الرابع: لبعض أهل الظاهر وجوب الجمع بين الغسل والمسح، لأن القراءتين في آية واحدة بمنزلة آيتين، ولا تنافي بين الغسل والمسح في محل واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nويجب عند جمهور الفقهاء إدخال الكعبين في الغسل، ولم يخالف إلا زفر. والكعبان العظمان الناتئان في أسفل الساق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nثانياً: الفرائض المختلف فيها في الوضوء.\n\nأولاً: النية، فالجمهور على أنها شرط لا يصح الوضوء إلا بها، وقال بعضهم إنها سنة، وقال آخرون إنها فرض، وتفصيلها في باب النية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nرفض النية: إذا رفض المتوضئ النية بعد كمال الوضوء لم يؤثر ذلك عند المالكية والشافعية على الصحيح والحنابلة على الصحيح؛ ومقابل الصحيح عند الحنابلة أنه يبطل. أما إذا رفضها أثناء الوضوء، فالشافعية في الأصح لا يبطل ويُستأنف النية لما بقي، والحنابلة في الصحيح يبطل ما مضى، والمالكية على الراجح لا يغتفر الرفض فيبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nثانياً: الموالاة، وهي غسل الأعضاء على التعاقب بحيث لا يجف الأول قبل الشروع في الثاني؛ فالحنفية والشافعية في القول الجديد الصحيح والمالكية في قول والحنابلة في رواية يرونها سنة، ومنها قول ابن عمر وقول الحسن وسعيد بن المسيب والثوري. وعند المالكية على المشهور والشافعية في القديم والحنابلة في المذهب أنها واجبة، وبه قال عمر بن الخطاب والأوزاعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nثالثاً: الترتيب، أي أن يأتي بالأعضاء على الترتيب في الغسل والمسح. فالشافعية والحنابلة في المذهب والمالكية في قول يرونه ركناً، وهو قول عثمان وابن عباس وقتادة وأبي ثور وأبي عبيد وإسحاق، واستدلوا بآية المائدة لأن المسح دخل بين الغسلين، وبأن كل من حكى وضوء النبي حكاه مرتباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405} وعند الحنفية والمالكية على المشهور وبعض الشافعية ورواية عن أحمد أن الترتيب سنة، وهو قول ابن مسعود وغيره، واستدلوا بأن الآية عطفت بالواو، وهي لا تقتضي ترتيباً، وبأن الغسل دفعة واحدة يرفع الحدث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nرابعاً: الدلك، وهو إمرار اليد على العضو إمراراً متوسطاً، ولو لم تزل الأوساخ، ولو بعد صب الماء قبل جفافه، عند المالكية. فجمهور الحنفية والشافعية والحنابلة وقول عند المالكية يرونه سنة، ويزيد الشافعية أن يبالغ في العقب خصوصاً في الشتاء؛ والمالكية في المشهور يرونه فرضاً، واستدلوا بأمر النبي عائشة أن تدلك جسدها، وهو حديث لم يُسند عند التعليق في الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nالدلك، وفيه ثلاثة أقوال عند المالكية: المشهور الوجوب، لأنه شرط في حصول مسمى الغسل، ومن قال به استدل بأمر عائشة بدلك جسدها؛ والثاني، وهو لابن عبد الحكم، أنه لا يجب لصدق اسم الغسل بدونه؛ والثالث أنه واجب لا لنفسه بل لتحقق إيصال الماء، فمن تحقق إيصاله بطول مكث أجزأه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}\n\nسنن الوضوء.\n\nأولاً: التسمية في أول الوضوء. فجمهور الحنفية والشافعية وأحمد في رواية على أنها سنة، والمالكية في المشهور على أنها مستحبة، وقيل مكروهة، والحنابلة على أنها واجبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وعند الحنفية تحصل التسمية بكل ذكر، والوارد عن النبي والمنقول عن السلف «بسم الله العظيم والحمد لله على الإسلام»، وقيل الأفضل «بسم الله الرحمن الرحيم»؛ وعند الشافعية أقلها «بسم الله» وأكملها بكمالها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وعند الحنابلة يجب أن تكون بلفظ «بسم الله» ولا يقوم غيره مقامه على الأشهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وأما التسمية عند غسل كل عضو، فعند الحنفية من الآداب، وذكروا فيها حديث البراء بن عازب في ذكر الشهادتين عند كل عضو، وقال العيني إن إسناده واه. وظاهر كلام الحنابلة أنها لا تستحب عند كل عضو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nثانياً: غسل اليدين إلى الرسغين، ويُسن في ابتداء الوضوء اتباعاً لفعل النبي، ويجب غسلهما اتفاقاً إن كانتا نجستين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nثالثاً: المضمضة، فجمهور الفقهاء على أنها سنة، والحنابلة على أنها واجبة. ويُحال في تفصيلها إلى بابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nرابعاً: الاستنشاق، فجمهور الفقهاء على أنه سنة، والحنابلة على أنه فرض أو واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nخامساً: الاستنثار، وهو سنة عند الحنفية والمالكية والشافعية والحنابلة، لحديث «إذا استنشقت فانتثر»؛ وعند المالكية طرح الماء من الأنف بالنَّفَس مع وضع السبابة والإبهام من اليسرى عليه، وعند الشافعية إخراج ما في الأنف بخنصر اليسرى، وعند الحنابلة يُسنّ الاستنثار باليسار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nسادساً: مسح كل الرأس. وقد سبق أن المالكية في المشهور والحنابلة يوجبونه، والحنفية والشافعية يرونه سنة. واستدل الحنفية بحديث مسح كل الرأس، وبحديث مسح النبي بناصيته، فيكون مسح الربع فرضاً ومسح الجميع سنة؛ وقالوا إن من داوم على ترك استيعاب الرأس بلا عذر يأثم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} وعند الشافعية يُسنّ مسح كل الرأس اتباعاً وخروجاً من خلاف من أوجبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nمسائل تتعلق بمسح الرأس:\n\nأ- تكرار المسح: الحنفية يرون أن يُمسح الرأس كله مرة بماء واحد، ومن روى التثليث فهو محمول على مسح بماء واحد، وعن الحسن عن أبي حنيفة أن المسح ثلاثاً بماء واحد مسنون؛ وأما المسح ثلاثاً بماء متجدد ففيه ثلاثة أقوال: يُكره، أو بدعة، أو لا بأس به، والكتاب ينقل ترجيح ابن عابدين للكراهة. وعند الشافعية يُسنّ تثليث الممسوح؛ ولو مسح بعض الرأس ثلاثاً حصل التثليث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nب- كيفية المسح المسنون: عند الحنفية الأظهر أن يضع كفيه وأصابعه على مقدم الرأس ويمدهما إلى القفا، ثم يمسح أذنيه بإصبعيه. وعند الشافعية أن يضع يديه على مقدم الرأس ويلصق السبابة بالأخرى، ويُمرّ إبهاميه على الصدغين، ثم يذهب بهما إلى القفا ويردّهما إلى المكان الذي ذهب منه إن كان له شعر ينقلب؛ ومن لا شعر له يقتصر على الذهاب، ويُنظر في المسح كله بالفرض والسنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nوصرّح الحنابلة بأنه لا يُستحب تكرار مسح الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nيذكر الكتاب من السنن في مسح الرأس: أن يُعاد المسح إلى حيث بدأ، وذكر الترمذي حديث أبي حية في وضوء علي وفيه مسح الرأس مرة، وروى أبو داود حديث ابن عباس أن النبي مسح برأسه وأذنيه مسحة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} وعن أحمد يُستحب تكرار المسح بماء جديد، نصره أبو الخطاب وابن الجوزي، وكذا الأذنان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} وعدّ المالكية من السنن رد المتوضئ مسح رأسه إلى حيث بدأ، لأن الشعر الطويل لا يحصل تعميمه إلا بالرد، ويكون الرد سنة إن بقي في اليد بلل من المسح الواجب، ويُكره تجديد الماء له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}\n\nصفة مسح الرأس: عند المالكية والشافعية أن يأخذ الماء بيده اليمنى ويفرغه على باطن اليسرى ثم يمسح، يبدأ بمقدم الرأس ويضم أطراف أصابعه ويجعل إبهاميه على صدغيه، ثم يذهب بيديه إلى طرف الشعر مما يلي القفا ثم يردهما إلى حيث بدأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} وعند الحنابلة الصفة المسنونة أن يمرّ يديه من المقدم إلى القفا ثم يردهما إلى الموضع الذي بدأ منه، لحديث عبد الله بن زيد، ثم يدخل سبابتيه في الصماخين ويمسح بإبهاميه ظاهرهما؛ وإن كان ذا شعر يخاف انتفاشه بالرد لم يردّ، لحديث الربيع بنت معوذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} وسئل أحمد عن مسح المرأة فوصف مسح الرأس مع الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}\n\nسابعاً: مسح الأذنين. عند الحنفية والمالكية على المشهور والشافعية أنه من سنن الوضوء مسح الأذنين ظاهرهما وباطنهما، استناداً إلى حديث المقدام بن معدي كرب في مسح الأذنين وإدخال الأصابع في الصماخين، وعند جمهور الفقهاء ظاهر الأذنين ما يلي الرأس وباطنهما ما كان مواجهاً؛ وقال المالكية في رأي إن الظاهر هو المواجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} وعن المالكية أن السنن المتعلقة بالأذنين ثلاث: مسح ظاهرهما وباطنهما، ومسح الصماخين، وتجديد الماء لهما. وعند الشافعية يُسنّ مسح الأذنين بماء جديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} وعند الحنابلة وبعض المالكية يجب مسح الأذنين ظاهرهما وباطنهما، لأنهما من الرأس، ويُسنّ مسحهما بماء جديد بعد مسح الرأس، والبياض فوق الأذنين من الرأس فيجب مسحه معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} والمسنون عند الحنابلة أن يدخل سبابتيه في صماخيهما ويمسح بإبهاميه ظاهرهما، ولا يجب مسح ما استتر من الأذن بالغضاريف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} وعند الحنفية يكفي مسح جميع الرأس والأذنين بماء واحد، لأنهما من الرأس، وأظهر الصفات عندهم أن يضع كفيه وأصابعه على مقدم الرأس ويمدهما إلى القفا، ثم يمسح أذنيه بإصبعيه، وإن مسحهما بالبلة الباقية كفى، ومسحهما بماء جديد أولى مراعاة للخلاف؛ وعند الحنفية يندب إدخال الخنصر المبلولة في الصماخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nثامناً: تخليل اللحية وشعور الوجه، وهو سنة في الجملة، وتفصيله في غسل الوجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nتاسعاً: تخليل أصابع اليدين والرجلين، ويُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nعاشراً: التثليث، وهو سنة عند الفقهاء في غسل الأعضاء، وفي حديث النبي إنه توضأ مرة وقال إنها الوضوء الذي لا تُقبل الصلاة إلا به، ومرتين وقال إنه يُضاعف الأجر، وثلاثاً وقال إنه وضوؤه ووضوء الأنبياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالحادي عشر: الاستياك. جمهور الفقهاء على أنه سنة عند الوضوء، لحديث «لولا أن أشق على أمتي لأمرتهم بالسواك مع كل وضوء»؛ وعند الحنفية سنة مؤكدة، وعند المالكية في المشهور مستحب، ويرى الدسوقي أن ظاهر الحديث يقتضي السنة وإن خالف المشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} وتفصيل السواك في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالثاني عشر: المسح على العمامة، وفيه خلاف يُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالثالث عشر: عدم الإسراف في الماء، ويُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}\n\nالرابع عشر: التيامن في اليدين والرجلين. فالحنفية والمالكية والحنابلة في الصحيح من المذهب يرونه مستحباً، استناداً إلى حديث عائشة في تيمّن النبي في شأنه كله، وإلى وصف عثمان وعلي لوضوء النبي بأنه بدأ باليمنى قبل اليسرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417} والشافعية وبعض الحنفية يرونه سنة لحديث «إذا توضأتم فابدؤوا بميامنكم»، وقال ابن الهمام إنه سنة لثبوت مواظبته. وفي رواية عن أحمد أنه واجب، حكاها الفخر الرازي وشذّذه الزركشي، وقيل يُكره تركه؛ ونقل ابن قدامة الإجماع على أن من بدأ بيساره قبل يمينه لا إعادة عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}\n\nالخامس عشر: إطالة الغرة والتحجيل، وهي تجاوز موضع الفرض في غسل الوجه واليدين والرجلين. فالشافعية والحنابلة في الصحيح يرونها سنة؛ والحنفية يرونها من آداب الوضوء، وغايتها في الوجه غسل صفحة العنق مع مقدمات الرأس، وفي اليدين والرجلين استيعاب العضدين والساقين. والأصل حديث «غراً محجلين»، وهو عند الشافعية والحنابلة من خصائص هذه الأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} ومذهب المالكية ورواية عن أحمد أنها لا تندب، بل تُكره عند مالك لأنها من الغلو في الدين، وحملوا الإطالة في الحديث على إدامة الطهارة لا على زيادة الغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالسادس عشر: استقبال القبلة في الوضوء، فالحنفية والمالكية يرونه من آدابه ويقيدونه بالإمكان من غير مشقة، والشافعية والحنابلة يرونه من سننه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالسابع عشر: الجلوس في مكان مرتفع، وهو من آداب الوضوء عند الحنفية والمالكية، تحرّزاً عن الماء المستعمل وصونا للثياب من المتقاطر؛ ويسنّ عند الشافعية أن يتوقّى المتوضئ الرشاش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالثامن عشر: التوضؤ في مكان طاهر، وهو من المستحبات عند الحنفية والمالكية، ويكره عند المالكية الوضوء في بيت الخلاء لأنه ليس شأنه الطهارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}\n\nالتاسع عشر: ترك الاستعانة. الشافعية والحنابلة يرونه سنة، والحنفية من آداب الوضوء؛ واستعان النبي بالمغيرة بن شعبة في الصب، وصبّ صفوان بن عسال عليه الماء، وكان ترك الاستعانة أفضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} وفرّق الشافعية بين الاستعانة بالصب والاستعانة بإحضار الماء، فالثانية لا بأس بها، وتجب إذا لم يمكن التطهر إلا بها لعذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} وقال ابن مودود إن الاستعانة تكره إلا عند العجز، وفصّل ابن عابدين: الاستعانة بالصب أو الاستقاء أو الإحضار لا كراهة فيها، والاستعانة بالغسل والمسح مكروهة بلا عذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nالعشرون: مسح الرقبة، فالحنفية وأحمد في رواية يرونه من مستحبات الوضوء، وقيل سنة؛ والمالكية والشافعية والحنابلة في الصحيح لا يسنّونه لأنه لم يثبت فيه شيء، والنووي يرى أنه بدعة، والمالكية يرون أنه يُكره لأنه من الغلو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nالحادي والعشرون: تحريك الخاتم في الوضوء. الحنفية والشافعية يرونه من مستحبات الوضوء في الخاتم الواسع، وكذلك القرط، وفي الضيق إن علم وصول الماء، وإلا فهو فرض؛ وقال أحمد بن حنبل إن كان الخاتم ضيقاً فلا بد من تحريكه، وقد تُكمل تفاصيله في الصفحة التالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}"
  en: "Wudu' (from wada'a, to be fair and clean) is the act, and the water used for it, in the lexical sense. The jurists define it: the Hanafis as washing and wiping specified members; the Malikis as a water purification of four members in a specific way; the Shafi'is as specific acts opened by intention; and the Hanbalis as using pure water on the four members in the prescribed way, in order and in succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}\n\nGhusl is washing the whole body in a specific way. Both wudu' and ghusl remove a ritual impurity, the minor and the major. Tahara is the wider term for removing impurity and removing its effect. Tayammum is wiping the face and hands with clean earth or sand in a specific way, and it serves for either impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}\n\nMost jurists hold that wudu' belongs to earlier revelations, and that what is peculiar to this community is its specific manner or the mark of wudu', the white marks on the limbs on the Day of Resurrection, citing accounts of the prophets and of Sarah and Jurayj. A Maliki view, the opposite of the sounder Shafi'i view, and some Hanafis hold that wudu' itself is peculiar to this community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367}\n\nWudu' was made obligatory in Mecca along with prayer; the preposition 'with' refers to place, not time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} Its legal basis is the Qur'an, the sunna and consensus. The verse of sura al-Ma'ida (cited by sura and aya) is taken by some as the proof of obligation, while most read it as addressed to those who are in a state of impurity when they rise to pray. The sunna includes the saying that no prayer is accepted without purity. The people of biography agree that it was made obligatory in Mecca through Gabriel's teaching, and the community agrees on its legality and obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} Denial of its obligation for prayer is disbelief; for other purposes, such as touching the mushaf, the Hanafis do not count it as disbelief, because the verse is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nWhoever deliberately leaves wudu' and prays in a state of impurity: the Hanafis say one who makes light of religion is a disbeliever, as in deliberately praying without wudu'; the Malikis say he is killed for abandoning purity like prayer; the Shafi'is say he is asked to repent and killed as a hadd punishment, not as disbelief; the Hanbalis say one who abandons an agreed condition or pillar is treated as one who abandons the act, and one who leaves prayer is called to it for three days and killed if he does not pray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nThe legal ruling varies with the purpose of wudu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nFirst, where wudu' is obligatory: for prayer, the jurists agree it is obligatory for one in a minor impurity who wishes to stand for an obligatory or a voluntary prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} The Hanafis require it for the funeral prayer, which they count as a prayer; the majority also require it for the prostration of recitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} For tawaf, the Malikis, Shafi'is and Hanbalis hold that it is obligatory for obligatory and voluntary tawaf; the Hanafis count it as necessary (wajib) and penalise: an obligatory tawaf in a minor impurity requires a sacrifice, and in a major impurity a camel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} For touching the mushaf, the majority hold it obligatory, citing the verse of sura al-Waqi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}\n\nSecond, where it is sunna: the Hanafis, Hanbalis and Shafi'is, other than al-Baghawi, hold that wudu' before sleep is sunna, on the hadith about lying down on the right side after wudu', reported in the two Sahihs as cited in the book's footnote. The Malikis call it recommended; one Maliki view is that for a junub before sleep it is sunna; another that it is obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}\n\nThird, where it is recommended: a wudu' that is not a condition for the validity of the act but part of its perfection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} It is recommended for reciting the Qur'an and reading hadith, for remembrance of God, for the call to prayer, and for the iqama (on which the jurists differ), for the sermon, for studying religious knowledge, for standing at 'Arafat and for the sa'y between Safa and Marwa, and for visiting the Prophet's mosque and his tomb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} The renewal of wudu' is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} For a junub, the Hanafis, Shafi'is and Hanbalis (the majority) recommend wudu' before eating, drinking, resuming intercourse and sleeping; the Malikis hold that the junub has no wudu' for eating, drinking or resuming intercourse, but washes his hands and his private parts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} The Hanafis also recommend keeping wudu' constant by renewing it whenever it is broken, and recommend it to leave a legal difference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}\n\nFourth, where it is permitted: the Malikis hold that the permitted wudu' is for cleanliness and cooling; Qadi Iyad mentions wudu' before entering rulers' presence or boarding a ship in danger, and says that it may be recommended; al-Hattab leans towards recommendation for all except cleanliness and cooling. Such a wudu' does not remove the impurity unless it is intended to. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nFifth, forbidden wudu': for the Malikis, renewing wudu' before an act of worship has been performed with it, or wudu' for a purpose for which it was not prescribed or permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nMerit of wudu': many hadiths on the removal of sins by it: purity is half of faith; the report from 'Uthman that whoever performs wudu' as the Prophet did has his earlier sins forgiven; the hadith of 'Umar on the eight gates of Paradise; and the hadith of Abu Hurayra on the radiant marks of the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376} The conditions of wudu' are of three kinds: conditions of obligation, of validity, and of both; the first of the conditions of obligation is intellect, since no address is made to one who lacks it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nThe required washing: the majority (Hanafis, Shafi'is and Hanbalis) hold that it is enough for water to flow over a limb, without rubbing; the Malikis and al-Muzani require rubbing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} For the Hanafis washing means pouring water so that it drips, even a single drop; Abu Yusuf accepts merely wetting the place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} For the Shafi'is washing means the limb being washed, whether by the worshipper, another person or no act at all, such as rain falling on it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}\n\nThe face is what is faced; its whole outer surface is washed. Its width runs between the ears, and its length from the hairline at the top of the head to the lower chin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} The Malikis and Hanbalis measure the length for a beardless man to the hairline and for a bearded man to the end of the beard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Hanging hair beyond the outline of the face: the Hanafis do not require it to be washed; the Shafi'is require the outer and inner surfaces to be washed if it is thin, and only the outer surface if it is thick, with one view requiring nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383}\n\nHair on the face: the Hanafis do not require washing the roots of thick eyebrow, moustache and beard hair because of hardship, but thin hair must be washed outside and inside to the skin. The Malikis require combing thin hair so that water reaches the skin, and say thick hair needs only outer washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384} The Shafi'is wash the eyelashes, eyebrows, moustache, sideburns and the hair of the lower lip outside and inside, and the same for a woman's or intersex person's facial hair; for a man's beard, thin hair is washed both sides and thick hair only outside, and where thin and thick hair are mixed the whole is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} The Hanbalis require washing the beard and any hair hanging beyond the outline of the face, and the thick hair of the moustache, eyebrows, lower lip and of a woman or intersex person; combing the beard is recommended, the hadith on the handful of water under the chin being cited in the book's footnote. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}\n\nThe eye: the lid margin is washed with the face; crust on the lid must be removed. The majority do not wash the inside of the eye with the face, because the Prophet did not do so and because hot or cold water may harm it; a report from Ahmad requires it when there is no harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} If the inside of the eye is soiled with impurity, the Malikis, Shafi'is and one Ahmad view require washing it, while the Hanafis and the Hanbali school excuse it in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}\n\nThe hairline growth (ghumum), the hair that falls below its usual place, is washed with the face up to the usual limit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} The temples (tahdhif), the thin hair between the sideburn and the receding hairline, are disputed: the majority of Shafi'is, a Maliki view and the Hanbali sounder view treat them as part of the head and not washed with the face; the Hanafis, another Maliki view, a Hanbali view and a Shafi'i view, which Ghazali and Rafi'i call the sounder, treat them as part of the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe white skin between the sideburn and the ear: the Shafi'is, the Hanbalis and the Hanafi view on which fatwas are given hold it is part of the face; a report from Abu Yusuf excludes it; the Malikis wash the skin level with the earlobe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe lips: the red part visible when the lips close naturally is washed; one Hanafi view says the lip follows the mouth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} Washing part of the head with the face is obligatory in the majority view, and the Shafi'is add part of the throat, the area under the chin and the ears, since what the obligation cannot be completed without is itself obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe sideburn is washed with the face. The Shafi'is wash the part of the nose exposed by an amputation; the Malikis wash the septum between the nostrils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388} The majority hold that the inside of the mouth and nose are not part of the face and need not be washed in wudu'; the Hanbalis hold that the mouth and nose are part of the face, so rinsing and snuffing water are required in both minor and major purification, citing a hadith in which the book notes al-Daraqutni judged the connection to be a mursal narration. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nThe temple (sudgh), the bald part and the receding hairlines: the majority hold these are part of the head, not the face; one Hanbali view holds the temple is part of the face. Al-Shirbini says it is recommended to wash them with the face because of the disagreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} The Malikis wash the folds of the forehead and any hollow of the eyelid if water can reach it by rubbing, and the rest falls away. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nThe ears: al-Zuhri included the ears in the face, citing a hadith about the face's creation. The majority reply that the ears are part of the head, citing the saying that the two ears belong to the head and the report that the Prophet wiped his ears with his head, and that the ears were attached to the face only because they neighbour it, as a thing takes the name of what adjoins it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nIf the hair is washed and the skin below it becomes visible afterwards, the Hanafis, the Maliki preferred view and the Hanbalis hold that nothing more is required and wudu' is not repeated, because the duty passed to the hair; the Shafi'is in the sounder view, one Maliki view and Ibn Jarir require washing the newly visible skin, by analogy with a foot showing above a wiped sock. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nThe second obligation: washing the hands to the elbows. It is a pillar and an obligation agreed by the Qur'an, by the report of Abu Hurayra describing the Prophet's wudu', and by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} The majority (the Malikis, Shafi'is, Hanbalis in the school view and the Hanafis except Zufar) hold that the elbows must be washed with the hands, whether 'to' in the verse means 'with' or marks a limit that is of the same kind as what it limits; they cite the hadith of 'Abbad al-Abdi describing the water running over the elbows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} Zufar, a Maliki view and a view of Ahmad hold that the elbow is not included, by analogy with night in the verse on the fast; a further Maliki view includes it as a precaution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391}\n\nIf part of the limb to be washed is cut off, the rest must be washed by agreement, on the hadith 'do what you can of what I order you' and because the easier is not dropped for the harder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} The rule for an arm cut at the elbow continues beyond p.17391 and is not yet read; this part of the headword is not complete.\n\nAmputation at the elbow: the jurists who require the elbow to be washed wash the place of the cut. The Hanafis, the Hanbali school, the Shafi'i sounder view and one Maliki view require washing the bone that is the upper end of the arm, because the two adjoining bones must be washed, and if one is absent the other is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} The Malikis and a Shafi'i view against the sounder require nothing at the cut, since the elbow belongs to the forearm and the cut has taken it; unless a part of the elbow is known to remain in the upper arm, in which case the place of the cut is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nAmputation above the elbow: the duty falls away because its place is gone, but the Shafis recommend washing what remains of the upper arm so the limb does not lack purity; if cut at the shoulder, washing the place of the cut with water is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nAn extra finger, hand or arm: the Hanafis, Malikis, Shafi'is and the Hanbali judge al-Qadi wash an extra finger or hand that grows in the place of obligation alongside the original. If it grows outside the place of obligation, such as at the shoulder or upper arm, most jurists wash the part that lies opposite the place of obligation, while the sounder Hanbali view requires nothing for a distinct extra growth outside that place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nNails and what is under them: the Hanafis, Shafi'is and Hanbalis require washing the nail even when long, because it is joined to the hand by creation and so falls within the name of the hand. The Malikis and one Hanbali view hold that a small dirt under the nail does not harm the wudu' even if it blocks the water, and al-Mardawi calls this the sounder view, because it is common, so the Prophet would have had to explain it if it were a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393} The Hanafi fatwas state that a remaining dot of dough or dry or wet clay at the root of the nail prevents validity, while dye from henna or dough does not; a long nail requires water to reach under it and a short one does not; nails that go beyond the fingertips must be washed by agreement. The book reports that some Hanafis distinguish town dwellers from villagers, and that al-Dabusi gave a fatwa of validity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} The Shafi'is require washing the hair on the hand, outside and inside, even if it is thick, and if it is so thick that the skin is not reached, the visible part only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} The Malikis, in their preferred view, require the washing of the spaces between the fingers, the joints and the fold of the fingertips; a ring that is permitted to a man or a woman need not be moved, though a forbidden ring must be removed, and a loose ring is moved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}\n\nAn extra hand: the Hanafis, Malikis, Shafi'is and Hanbalis require washing an extra hand that grows in the place of obligation. If it grows outside the place, the Hanafis, Shafi'is and a Hanbali view require washing what lies opposite the place of obligation; the Malikis require the whole if it has an elbow of its own. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} For the Hanafis, if a person has two hands, the one he uses to grasp is the original and is washed, while the other is extra; the Shafi'is require washing an extra hand that is not distinct from the original. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nA hanging fold of skin on the upper arm: the Hanafis and Shafi'is require washing only the part opposite the place of obligation, while the Hanbalis require washing a fold torn from the upper arm that hangs down the forearm, like an extra finger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} A fold of the forearm is washed in full by the jurists; if its head is joined to the upper arm, the part opposite the place of obligation is washed, and the part that moves away from the limb is washed on its underside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nThe third obligation: wiping the head. It is agreed to be a pillar or obligation, by the Qur'an, by the descriptions of the Prophet's wudu' including the report of 'Uthman, and by consensus. Wiping is passing a wet hand over the head without running water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} The questions about wiping the head begin here, starting with the amount that suffices, on which the jurists differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nWiping the head: the Malikis in their preferred view and the Hanbalis in the sounder view require wiping the whole head, skin and hair, from the usual hairline at the front to the nape's hollow, together with the hair of the temples; the bone that projects and belongs to the face is not wiped but washed with the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} Other Maliki views: Ashhab requires only half, one report has the forelock enough, Muhammad ibn Maslama requires two-thirds, and Abu al-Faraj a third, with the hand passed back under the hair for full coverage, the return being recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} The Hanbalis require wiping the whole outer head in the sounder view; a report from Ahmad allows most of it, the jurists disagreeing on how much is most; another allows the forelock, another any part without limit. Wiping the skin alone does not suffice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}\n\nThe Hanafis hold that wiping the head once above the ears is a pillar; the amount in the most famous view is a quarter of the head, which is the school's preferred view, with a report of the forelock and a third of three fingers' breadth, the last, which the Badai' calls the report of the principal books, and on which the Zahiriyya says fatwas are given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} The Shafi'is require any wiping of part of the skin or part of the hair within the outline of the head, and allow either skin or hair as the part; the head is what is raised and rises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nMethod: the Hanafi sounder view requires three fingers to wipe; one or two fingers do not suffice in the apparent view, while the index and thumb spread with the palm between them count as three. The Hanbalis allow any manner, with the hand or with an intervening cloth, in the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nHair that falls below the head: the Hanafis, Shafis and Hanbalis do not require wiping it; the Malikis require wiping the hair that hangs down, however long, as it is hair of the head. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nWashing the head instead of wiping: the majority allow it, as it is wiping and more; the Hanbalis in the sounder view require the hand to be passed over the head, while a report from Ahmad allows washing without passing the hand. The Hanafis, the sounder Maliki view and the Hanbalis hold that washing the head at the outset in place of wiping is disliked, since it contradicts what is commanded; some Malikis, a Shafi'i view and a Hanbali view deny that it suffices, since it is not called wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nShaving the hair after wudu': the majority hold that this does not affect it. The Hanafis hold that wudu' is not repeated, since wiping hair is not a substitute for wiping the skin. A Maliki view requires repeating the wiping after shaving, which al-Dasuqi calls weak; al-Tabari requires repetition too. Ibn Rajab reports that Ahmad recommended wetting the head with water after shaving without requiring it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nRepeating the wiping: the Hanafis, Malikis and Hanbalis hold it is done once, since repetition becomes washing, and the Hanbalis cite that most who described the Prophet's wudu' mention one wiping, a view Abu Dawud supports; the Shafi'is recommend three wipings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nBraided hair: for the Malikis, hair that is braided by itself need not be unbraided, however firm; hair braided with three threads must be unbraided, whatever its firmness; hair braided with fewer threads must be unbraided if firm. Al-Sawi notes that women may follow the Shafi'i or Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nWiping over a turban is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nThe fourth obligation: washing the feet to the ankles. There are four views. The first, held by the majority, is that washing the two feet is a pillar of wudu'. The jurists report consensus: Abd al-Rahman ibn Abi Layla reports that the Companions agreed on washing the feet, al-Mawardi says the majority of jurists hold washing and not wiping, and al-Nawawi reports that Muslims agreed on the obligation to wash the feet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}\n\nThe second view is that the obligation is wiping and not washing, attributed to 'Ali, Ibn 'Abbas, Anas and al-Sha'bi, who relied on the genitive reading of the word for feet in the verse of sura al-Ma'ida. It is recorded that 'Ali retracted this, ordering the feet washed; Ibn Qudama says no jurist, other than those named, held the view of wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nThe third view, of al-Hasan al-Basri, al-Jubba'i and one report from al-Tabari, is that the worshipper may choose between washing and wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} The fourth, held by some Zahiris, is that washing and wiping must both be done, since the two readings in one verse count as two verses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nThe majority require the ankles to be included in the washing; only Zufar disagreed. The ankles are the two bones that project at the foot of the leg. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nSecond, the disputed obligations of wudu'.\n\nFirst, intention: the majority hold it is a condition without which wudu' is not valid; some hold it a recommendation and others a pillar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nAbandoning the intention: if the worshipper abandons the intention after finishing wudu', the Malikis, the sounder Shafi'i view and the sounder Hanbali view hold that it does not affect the wudu'; the other Hanbali view holds that it is void. If he abandons it during wudu', the Shafi'is in the sounder view say it is not void and he renews the intention for the rest, the Hanbalis in the sounder view say what has passed is void and he must begin again, and the Malikis in the preferred view do not excuse the abandonment, so it is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nSecond, continuity (muwala): washing the limbs in succession, so that the first does not dry before the next is begun. The Hanafis, the new Shafi'i view, one Maliki view and a Hanbali report hold it recommended, a view of Ibn 'Umar, al-Hasan, Sa'id ibn al-Musayyab and al-Thawri. The Malikis in the preferred view, the old Shafi'i view and the Hanbali school hold it obligatory, a view of 'Umar ibn al-Khattab and al-Awza'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nThird, order (tartib) in washing and wiping: the Shafi'is, the Hanbali school and one Maliki view hold it a pillar, a view of 'Uthman, Ibn 'Abbas, Qatada, Abu Thawr, Abu 'Ubayd and Ishaq. They argue from the verse, in which the wiping lies between the two washings, and that every account of the Prophet's wudu' gives the order. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405} The Hanafis, the preferred Maliki view, some Shafi'is and one Ahmad report hold the order is a sunna, a view of Ibn Mas'ud and others, arguing that the verse uses 'and' which does not imply order and that a single immersion lifts the impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nFourth, rubbing (dalk): for the Malikis it is passing the hand over the limb moderately, whether or not dirt is removed, even after water is poured and before it dries. The majority of Hanafis, Shafi'is and Hanbalis, and one Maliki view, hold it a sunna, and the Shafi'is add that one should be thorough with the heels, especially in winter, citing the saying woe to the heels from the Fire. The preferred Maliki view makes it an obligation, citing a saying to Aisha to rub her body with her hand, a report which the book notes is not traced to a source.\n\nRubbing (dalk): the Malikis hold three views. The preferred view makes it obligatory, because it is a condition of the name of washing, and its advocates cite the instruction to 'A'isha to rub her body; the second, from Ibn 'Abd al-Hakam, holds it is not obligatory, since the name of washing is met without it; the third holds it obligatory not in itself but to make sure the water reaches the skin, so that one who is sure the water has reached it after a long stay is excused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}\n\nThe sunnas of wudu'.\n\nFirst, the basmala at the beginning. The majority of Hanafis and Shafi'is, and one Ahmad report, make it a sunna; the preferred Maliki view makes it recommended, another Maliki view disapproves; the Hanbalis make it obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} For the Hanafis any remembrance of God suffices, but the words reported from the Prophet and the Salaf are 'In the name of God the Mighty, and praise belongs to God for Islam', while some prefer the full basmala; the Shafi'is say the least is 'In the name of God' and the most complete is the full formula with praise for Islam and for the water being pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} The Hanbalis require the words 'In the name of God' and no other phrase suffices, in the most common view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} The Hanafis count the basmala at each limb as a courtesy, and cite a report from al-Bara' ibn 'Azib about the two testimonies at each limb; al-Ayni calls its chain weak. The Hanbali school view does not recommend it at each limb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nSecond, washing the hands to the wrists at the beginning, which is a sunna following the Prophet's practice; if the hands are impure, washing them is obligatory by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nThird, rinsing the mouth: the majority hold it a sunna, and the Hanbalis obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nFourth, snuffing water into the nose: the majority hold it a sunna, and the Hanbalis a pillar or an obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nFifth, blowing the nose out, a sunna for the four schools, on the hadith 'when you snuff, blow'. For the Malikis it is expelling water from the nose by breath with the index and thumb of the left hand placed on it; for the Shafi'is it is removing what is in the nose with the little finger of the left hand; the Hanbalis recommend doing it with the left hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nSixth, wiping the whole head. The Malikis in the preferred view and the Hanbalis make it obligatory, as already stated, while the Hanafis and Shafi'is make it a sunna. The Hanafis cite a report of wiping the whole head and the report of the Prophet wiping the forelock, so wiping a quarter is the obligation and wiping the whole is the sunna; they say that one who persistently leaves out wiping the whole head without excuse sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} The Shafi'is recommend wiping the whole head to follow the practice and to leave the disagreement of those who require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nQuestions on wiping the head: first, repetition. The Hanafis hold that the whole head is wiped once with one water, and the reports of three wipings are taken to mean wiping with one water; al-Hasan reports from Abu Hanifa that three wipings with one water are sunna. Three wipings with fresh water are, in the Hanafi views, disliked, a bid'a, or permitted; the book quotes Ibn 'Abidin's preference for disliking it. The Shafi'is recommend wiping the whole head three times, one wiping after another, and a wiping of part of the head three times counts as three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nSecond, the recommended manner. The Hanafi preferred view is to place both palms and the fingers at the front of the head and draw them back to the nape, wiping the whole head, and then to wipe the ears with two fingers, the ears being part of the head. The Shafi'is say the sunna is to place the hands on the front of the head with the index finger joined to the other, the thumbs on the temples, to draw them back to the nape and bring them back to the place they started, where there is hair that turns; a person with no such hair only draws them back. The Hanbalis say repeating the wiping of the head is not recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nThe sunnas of wiping the head: the wiper returns the hands to where he began. al-Tirmidhi reports the account of Abu Hayya of 'Ali's wudu', in which the head is wiped once, and Abu Dawud reports that Ibn 'Abbas saw the Prophet wipe his head and ears with one wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} Ahmad recommends repeating the wiping with fresh water, a view supported by Abu al-Khattab and Ibn al-Jawzi, and the same for the ears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} The Malikis count as a sunna the return of the hand over the head to its starting point, since long hair cannot be covered without it. The return is a sunna only if wetness from the obligatory wiping remains on the hand, and renewing the water for it is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}\n\nThe manner of wiping the head: the Malikis and Shafi'is take water in the right hand and pour it on the left palm, begin at the front, join the fingertips and place the thumbs at the temples, draw the hands back to the nape and return them to the start. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} For the Hanbalis the recommended manner is to draw the hands from front to back and return them to the start, following the report of 'Abd Allah ibn Zayd; then the index fingers enter the ear openings and the thumbs wipe the outer ears. A man with hair that would be ruffled by the return does not return, following the report of al-Rubay' bint Mu'awwidh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Ahmad, asked how a woman wipes, described the same motion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}\n\nSeventh, wiping the ears. The Hanafis, the preferred Maliki view and the Shafi'is hold that wiping both the outer and inner ear is a sunna, on the hadith of al-Miqdam ibn Ma'di Karib describing the wiping of the ears and the insertion of the fingers into the ear openings. The majority take the outer ear as the part next to the head and the inner ear as the part facing outwards; a Maliki view reverses this, and the Malikis say the ear is made like a rose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} The Malikis count three sunnas for the ears: wiping the outer and inner parts, wiping the openings, and renewing the water for them. The Shafi'is recommend fresh water for the ears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} The Hanbalis and some Malikis make the wiping of the ears obligatory, because they belong to the head; they recommend fresh water for them after wiping the head, and the white skin above the ears is part of the head and is wiped with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} The Hanbali recommended method is to put the index fingers in the openings and wipe the outer ears with the thumbs, and the cartilaginous parts within are not required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} The Hanafis hold that wiping the whole head and both ears with one water suffices, since they are part of the head; their preferred manner is the one described above, and wiping the ears with the damp remains is enough, while fresh water is better to satisfy the disagreement; they recommend putting the wet little finger into the ear opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nEighth, combing the beard and the hair of the face is recommended in the main, with the disagreement treated under washing the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nNinth, passing the fingers between the fingers of the hands and feet is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nTenth, repeating each washing three times is a sunna among the jurists; the hadiths vary: once, with the statement that this is the wudu' without which prayer is not accepted; twice, with the statement that it doubles the reward; and three times, with the statement that it is his wudu' and that of the prophets. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nEleventh, the miswak. The majority hold that using the miswak is a sunna in wudu', citing the saying that had it not been a hardship on his community he would have ordered the miswak with every wudu'. The Hanafis call it a strongly confirmed sunna; the Malikis, in their preferred view, a recommendation; al-Dasuqi notes that the hadith suggests a sunna even against the preferred view. Its detailed rules are under their own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nTwelfth, the wiping over the turban is disputed and is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nThirteenth, not wasting water, which is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}\n\nFourteenth, starting with the right side of the hands and feet. The Hanafis, Malikis and the sounder Hanbali view hold it recommended, citing the report of 'A'isha that the Prophet liked to start on the right in all his affairs, and the accounts of 'Uthman and 'Ali describing that he began with the right before the left. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417} The Shafi'is and some Hanafis hold it a sunna, on the saying that when you perform wudu' you begin with your right sides; Ibn al-Hammam says it is a sunna because of his constant practice. One Hanbali report, cited by al-Razi and rejected by al-Zarkashi, makes it obligatory; another says leaving it is disliked. Ibn Qudama reports consensus that one who begins with the left need not repeat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}\n\nFifteenth, prolonging the bright marks (ghurra and tahjil): the Shafi'is and the sounder Hanbali view hold it a sunna, meaning washing beyond the obligatory place of the face, hands and feet. The Hanafis count it as a courtesy: for the face it reaches the side of the neck with the front of the head, and for the arms and legs it reaches the upper arm and the shin. The basis is the saying about the community being called radiant with white marks from the wudu'; the Shafis and Hanbalis hold this to be a feature peculiar to this community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} The Malikis and one Hanbali report do not recommend it, and Malik regards it as disliked, as an excess in religion; they read the 'prolonging' in the saying as continuing the state of purity, not as extra washing. Al-Dasuqi distinguishes the two senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nSixteenth, facing the qibla while performing wudu': the Hanafis and Malikis hold it a courtesy, limited by what is possible without hardship; the Shafi'is and Hanbalis hold it a sunna, as it is suitable for every act of worship unless there is a reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nSeventeenth, sitting in a raised place, a courtesy for the Hanafis and Malikis, to keep clear of the water used in wudu' and to protect clothes from dripping; the Shafi'is recommend avoiding the spray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nEighteenth, performing wudu' in a clean place, a recommendation for the Hanafis and Malikis. The Malikis dislike wudu' in a lavatory, because such a place is not for purity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}\n\nNineteenth, not seeking help. The Shafi'is and Hanbalis hold it a sunna; the Hanafis count it a courtesy. The Prophet was helped by al-Mughira ibn Shu'ba in pouring water, and Safwan ibn 'Assal poured water on him, but not seeking help is better. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} The Shafi'is distinguish helping with the pouring, which is disliked but not sinful, from helping by bringing water, which is allowed, and it is obligatory when the person cannot purify himself otherwise, for a reason such as illness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} Ibn Mawdud says help is disliked except when one is unable; Ibn 'Abidin says help in pouring, drawing or fetching water is not disliked at all, while help in washing or wiping is disliked without a reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nTwentieth, wiping the neck: the Hanafis and one Ahmad report count it a recommendation, and some say it is a sunna. The Malikis, Shafi'is and the sounder Hanbali view do not recommend it, since nothing is reported for it; al-Nawawi calls it an innovation, and the Malikis say it is disliked as an excess in religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nTwenty-first, moving the ring in wudu': the Hanafis and Shafis recommend moving a loose ring, and likewise an earring; for a tight ring it is recommended if water is known to reach, and obligatory if not. Ahmad ibn Hanbal says a tight ring must be moved, and the details continue on the next page. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}"
