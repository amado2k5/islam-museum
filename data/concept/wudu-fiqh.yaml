id: concept/wudu-fiqh
class: concept
kind: legal
label:
  ar: "وُضوء"
  en: "Wudu' (ablution, fiqh)"
summary:
  ar: "الوضوء في اللغة من الوَضاءة، أي الحسن والنظافة. والوُضوء بالضم الفعل، وبالفتح الماء الذي يُتوضأ به، وقيل هما لغتان أو مصدران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364} وعرّفه الفقهاء: الحنفية بأنه الغسل والمسح على أعضاء مخصوصة؛ والمالكية بأنه طهارة مائية تتعلق بأعضاء مخصوصة على وجه مخصوص؛ والشافعية بأنه أفعال مخصوصة مفتتحة بالنية؛ والحنابلة بأنه استعمال ماء طهور في الأعضاء الأربعة على صفة مخصوصة في الشرع، مرتبة متوالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}\n\nوالغُسل استعمال الماء في جميع البدن على وجه مخصوص، والوضوء والغسل كلاهما يرفع الحدث، فيرفع الوضوء الحدث الأصغر والغسل الأكبر. والطهارة أعم من الوضوء، وهي ارتفاع الحدث وزوال النجس. والتيمم في اللغة التوخي والقصد، وفي الاصطلاح مسح الوجه واليدين بصعيد طاهر على وجه مخصوص، ويكون من الحدث الأصغر أو الأكبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}\n\nوذهب جمهور الفقهاء إلى أن الوضوء من الشرائع القديمة، وأن الذي خُصّت به هذه الأمة هو الكيفية المخصوصة أو أثر الوضوء، وهو الغرّة والتحجيل، واستدلوا بأحاديث وضوء الأنبياء وسارة وجريج. وذهب المالكية في قول، والشافعية في مقابل الأصح، وبعض الحنفية، إلى أن الوضوء نفسه من خصائص هذه الأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367}\n\nوقد فُرض الوضوء بمكة مع الصلاة، والمعيّة هنا للمكان لا للزمان، وكان النبي لا يصلي إلا بوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} ومشروعيته بالكتاب والسنة والإجماع، ومن الكتاب آية المائدة، وقد عدّها بعض الفقهاء دليل الفرضية، وذهب الجمهور إلى أن المقصود إذا قمتم إلى الصلاة وأنتم محدِثون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} ومن السنة قوله: لا تُقبل صلاة بغير طهور. وأجمع أهل السير أن الوضوء فُرض بمكة بتعليم جبريل ، وأجمعت الأمة على مشروعيته ووجوبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} ونص الفقهاء على أن من أنكر وجوب الوضوء للصلاة يكفر؛ وقال الحنفية إن إنكار وجوبه لغير الصلاة، كمس المصحف، لا يُكفِّر لوقوع الخلاف في تفسير آيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nأما من ترك الوضوء عمداً ثم صلى محدثاً: فعند الحنفية يكفر من استخف بالدين كالصلاة بلا وضوء عمداً؛ وعند المالكية يُقتل بترك الطهارة كالصلاة؛ وعند الشافعية يُستتاب، فإن لم يتب قُتل حداً لا كفراً؛ وعند الحنابلة من ترك شرطاً مجمعاً عليه كالطهارة فحكمه حكم تاركها، ومن ترك الصلاة جاحداً أو غير جاحد دُعي إليها ثلاثة أيام فإن لم يصلِّ قُتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nالحكم التكليفي للوضوء يختلف باختلاف ما يُتوضأ له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nأولاً: ما يكون الوضوء له فرضاً. الصلاة: اتفق الفقهاء على أنه فرض على المحدث إذا أراد القيام لصلاة فرض أو نفل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} والحنفية يوجبونه لصلاة الجنازة لأنها صلاة، ويشترط لها ما يشترط لبقية الصلوات، وجمهور الفقهاء يوجبونه لسجدة التلاوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} والطواف: الجمهور من المالكية والشافعية والحنابلة يوجبونه للطواف فرضه ونفله، والحنفية يرونه واجباً، ويترتب على ذلك أن من طاف الفرض محدثاً لزمه دم، ومن طاف جنباً لزمته بدنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} ومس المصحف: الجمهور على أنه فرض لمسه، والدليل آية الواقعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}\n\nثانياً: ما يكون الوضوء له سنة. قال الحنفية والحنابلة والشافعية غير البغوي إن الوضوء للنوم سنة، واستدلوا بحديث الاضطجاع على الشق الأيمن بعد الوضوء، المروي في الصحيحين. وقال المالكية إنه مستحب، وفي قول لهم أن وضوء الجنب للنوم سنة، وفي قول واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}\n\nثالثاً: ما يكون الوضوء له مندوباً. ضابطه كل وضوء ليس شرطاً في صحة ما يُفعل به بل من كماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} ومن ذلك: قراءة القرآن وقراءة الحديث وروايته، وذكر الله، والأذان، والإقامة على خلاف بين الفقهاء، والخطبة، ودراسة العلم الشرعي، والوقوف بعرفة والسعي بين الصفا والمروة، وزيارة النبي  ودخول مسجده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} وفي تجديد الوضوء اختلف الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} ويستحب للجنب الوضوء عند إرادة الأكل والشرب ومعاودة الوطء والنوم عند جمهور الحنفية والشافعية والحنابلة، والمالكية يرون أن الوضوء للأكل والشرب والجماع ليس على الجنب، وإنما يُستحب غسل اليدين والفرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} ويندب عند الحنفية المحافظة على الوضوء بتجديده كلما أحدث، والوضوء للخروج من خلاف العلماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}\n\nرابعاً: ما يباح له الوضوء. عند المالكية الوضوء للتنظيف والتبرد؛ وذكر القاضي عياض أن الوضوء المباح للدخول على الأمراء وركوب البحر ونحوه من المخاوف، وأنه قد يكون مستحباً، واستظهر الحطاب الاستحباب فيها ما عدا التنظيف والتبرد. وهذا الوضوء لا يرفع الحدث ما لم يُنوَ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nخامساً: الوضوء الممنوع، وعند المالكية هو المجدَّد قبل أن تُفعل به عبادة، أو الوضوء لغير ما شُرع له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nوفضيلة الوضوء: وردت أحاديث في سقوط الخطايا به، منها أن الطهور شطر الإيمان، وما رُوي عن عثمان في وضوء النبي  وأن من توضأ هكذا غُفر له ما تقدم من ذنبه، وحديث عمر في أبواب الجنة الثمانية، وحديث أبي هريرة في الغُرّ المحجّلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nشروط الوضوء: منها شروط الوجوب، ومنها شروط الصحة، ومنها ما هو للوجوب والصحة معاً؛ وأول شروط الوجوب العقل، إذ لا خطاب على غير العاقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nشروط وجوب الوضوء، وهي ما إذا اجتمعت وجبت الطهارة على الشخص:\n\nأولاً: العقل. الفقهاء على أنه شرط في الوجوب، فلا خطاب على غير العاقل؛ وعند المالكية هو شرط في الوجوب والصحة معاً، وعند الحنابلة شرط للصحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nثانياً: البلوغ شرط للوجوب، فلا يجب الوضوء على الصبي لعدم تكليفه، أما المميز فيصح وضوؤه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nثالثاً: الإسلام؛ الحنفية في الصحيح يجعلونه شرطاً للوجوب، والمالكية في مقابل المشهور شرط للوجوب والصحة، والشافعية والحنابلة والمالكية في المشهور شرط للصحة، لأن الكفار مخاطبون بفروع الشريعة عندهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nرابعاً: انقطاع الحيض والنفاس شرط للوجوب والصحة معاً، عند الحنفية والمالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nخامساً: وجود الماء المطلق الطهور الكافي، فلا يجب الوضوء على من عدم الماء؛ واشترط الشافعية العلم بأنه مطلق ولو ظناً عند الاشتباه، واشترط الحنابلة طهوريته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17377} وأما القدرة على استعمال الماء فشرط عند الحنفية والمالكية، فلا يجب على العاجز عنه، ولا على من قُطعت يداه من المرفقين ورجلاه من الكعبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17377}\n\nسادساً: وجود الحدث الموجب، شرط لوجوب الوضوء عند الحنفية والمالكية والشافعية والحنابلة، وفي موجبه عند الشافعية أوجه: الحدث مع الانقطاع، أو القيام إلى الصلاة، أو هما معاً وهو الأصح تحقيقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17377}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17378} ومن شك في الحدث وتيقن الطهارة فلا وضوء عليه عند الجمهور، وعلى المشهور عند المالكية يجب عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17377}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17378}\n\nسابعاً: ضيق الوقت شرط للوجوب المضيق عند الحنفية، وعند المالكية دخول وقت الصلاة الحاضرة وتذكر الفائتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17378} وذكر المالكية أن من شرط الوجوب والصحة بلوغ دعوة النبي إلى المكلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17378}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}\n\nشروط صحة الوضوء، وهي ما لا يصح الوضوء إلا بها:\n\nأولاً: عموم البشرة بالماء الطهور، فلو بقي مقدار مغرز إبرة من المفروض غسله لم يُصب بالماء لم يصح الوضوء عند الحنفية؛ وعند الشافعية يغسل المتوضئ مع المغسول جزءاً متصلاً به محيطاً به ليتحقق الاستيعاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}\n\nثانياً: زوال ما يمنع وصول الماء إلى الجسد، كالشمع والشحم والعجين والطين، عند الحنفية والمالكية؛ والشافعية والحنابلة يعتبرونه شرطاً، وزاد الشافعية ألا يكون على العضو ما يغيّر الماء تغييراً مضراً، وقال صاحب الإمداد، وهو المرجَّح، إن الطيب الذي يُحسَّن به الشعر يجب إزالته لأنه قد ينشف فيمنع وصول الماء إلى الباطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}\n\nثالثاً: انقطاع الحدث حال الوضوء، لأن ظهور بول أو سيلان ناقض يمنع صحته، عند الحنفية والمالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}\n\nرابعاً: العلم بكيفية الوضوء عند الشافعية، بأن يميّز المتوضئ فرائضه من سننه أو يعتقد وجود الفرض والسنة، وهذا في حق العامي، أما العالم فلابد له من التمييز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nخامساً: عدم الصارف عن الوضوء، أي دوام النية حكماً، فلا يأتي المتوضئ بمنافٍ لها كالردة أو قول إن شاء الله على وجه غير التبرك أو قطع النية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nسادساً: جري الماء على العضو عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nسابعاً: النية، عدّها الحنابلة شرطاً للوضوء استناداً إلى حديث «إنما الأعمال بالنيات»، ولأن الوضوء عبادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nثامناً: إباحة الماء عند الحنابلة على الصحيح، فلا يصح الوضوء بماء محرم الاستعمال كالمغصوب، وعن أحمد تصح الطهارة بالماء المغصوب مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nشروط الوضوء في حق صاحب الضرورة، وهو من حدثه دائم كالسلس والاستحاضة: يشترط الشافعية والحنابلة دخول الوقت ولو ظناً، وتقديم الاستنجاء أو الاستجمار؛ وزاد الشافعية التحفظ حيث احتيج إليه، والموالاة بين أفعال الوضوء، وبينه وبين الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381}\n\nأسباب الوضوء: اختلف الفقهاء في سببه. فجمهور الحنفية والمالكية والشافعية على الصحيح ورأي عند الحنابلة يرون أن سبب فرضيته إرادة الصلاة مع وجود الحدث، واستدلوا بآية المائدة وبتفسير ابن عباس لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381} وقال الشافعية في وجه والحنابلة على الصحيح إن السبب هو الحدث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381} وقال الشافعية في وجه والحنابلة في رأي إن موجبه القيام إلى الصلاة أو نحوها، فلا يتعين الوضوء قبله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381}\n\nفروض الوضوء: اتفق الفقهاء على أن غسل الوجه، وغسل اليدين إلى المرفقين، ومسح الرأس، وغسل الرجلين إلى الكعبين من فرائضه. واختلفوا في عد النية والموالاة والترتيب والدلك من فرائضه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381}\n\nالفرض الأول: غسل الوجه، وهو متفق عليه بالكتاب، وفي وصف وضوء عثمان بن عفان من رواية حمران مولاه، وقد غسل كفيه وتمضمض واستنثر، ثم وجهه وذراعيه ومسح رأسه وغسل رجليه ثلاثاً، وقال إنه رأى النبي يتوضأ كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}"
  en: "Wudu' (from wada'a, to be fair and clean) is the act, and the water used for it, in the lexical sense. The jurists define it: the Hanafis as washing and wiping specified members; the Malikis as a water purification of four members in a specific way; the Shafi'is as specific acts opened by intention; and the Hanbalis as using pure water on the four members in the prescribed way, in order and in succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}\n\nGhusl is washing the whole body in a specific way. Both wudu' and ghusl remove a ritual impurity, the minor and the major. Tahara is the wider term for removing impurity and removing its effect. Tayammum is wiping the face and hands with clean earth or sand in a specific way, and it serves for either impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}\n\nMost jurists hold that wudu' belongs to earlier revelations, and that what is peculiar to this community is its specific manner or the mark of wudu', the white marks on the limbs on the Day of Resurrection, citing accounts of the prophets and of Sarah and Jurayj. A Maliki view, the opposite of the sounder Shafi'i view, and some Hanafis hold that wudu' itself is peculiar to this community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367}\n\nWudu' was made obligatory in Mecca along with prayer; the preposition 'with' refers to place, not time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} Its legal basis is the Qur'an, the sunna and consensus. The verse of sura al-Ma'ida (cited by sura and aya) is taken by some as the proof of obligation, while most read it as addressed to those who are in a state of impurity when they rise to pray. The sunna includes the saying that no prayer is accepted without purity. The people of biography agree that it was made obligatory in Mecca through Gabriel's teaching, and the community agrees on its legality and obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} Denial of its obligation for prayer is disbelief; for other purposes, such as touching the mushaf, the Hanafis do not count it as disbelief, because the verse is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nWhoever deliberately leaves wudu' and prays in a state of impurity: the Hanafis say one who makes light of religion is a disbeliever, as in deliberately praying without wudu'; the Malikis say he is killed for abandoning purity like prayer; the Shafi'is say he is asked to repent and killed as a hadd punishment, not as disbelief; the Hanbalis say one who abandons an agreed condition or pillar is treated as one who abandons the act, and one who leaves prayer is called to it for three days and killed if he does not pray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nThe legal ruling varies with the purpose of wudu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nFirst, where wudu' is obligatory: for prayer, the jurists agree it is obligatory for one in a minor impurity who wishes to stand for an obligatory or a voluntary prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} The Hanafis require it for the funeral prayer, which they count as a prayer; the majority also require it for the prostration of recitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} For tawaf, the Malikis, Shafi'is and Hanbalis hold that it is obligatory for obligatory and voluntary tawaf; the Hanafis count it as necessary (wajib) and penalise: an obligatory tawaf in a minor impurity requires a sacrifice, and in a major impurity a camel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} For touching the mushaf, the majority hold it obligatory, citing the verse of sura al-Waqi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}\n\nSecond, where it is sunna: the Hanafis, Hanbalis and Shafi'is, other than al-Baghawi, hold that wudu' before sleep is sunna, on the hadith about lying down on the right side after wudu', reported in the two Sahihs as cited in the book's footnote. The Malikis call it recommended; one Maliki view is that for a junub before sleep it is sunna; another that it is obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}\n\nThird, where it is recommended: a wudu' that is not a condition for the validity of the act but part of its perfection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} It is recommended for reciting the Qur'an and reading hadith, for remembrance of God, for the call to prayer, and for the iqama (on which the jurists differ), for the sermon, for studying religious knowledge, for standing at 'Arafat and for the sa'y between Safa and Marwa, and for visiting the Prophet's mosque and his tomb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} The renewal of wudu' is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} For a junub, the Hanafis, Shafi'is and Hanbalis (the majority) recommend wudu' before eating, drinking, resuming intercourse and sleeping; the Malikis hold that the junub has no wudu' for eating, drinking or resuming intercourse, but washes his hands and his private parts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} The Hanafis also recommend keeping wudu' constant by renewing it whenever it is broken, and recommend it to leave a legal difference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}\n\nFourth, where it is permitted: the Malikis hold that the permitted wudu' is for cleanliness and cooling; Qadi Iyad mentions wudu' before entering rulers' presence or boarding a ship in danger, and says that it may be recommended; al-Hattab leans towards recommendation for all except cleanliness and cooling. Such a wudu' does not remove the impurity unless it is intended to. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nFifth, forbidden wudu': for the Malikis, renewing wudu' before an act of worship has been performed with it, or wudu' for a purpose for which it was not prescribed or permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nMerit of wudu': many hadiths on the removal of sins by it: purity is half of faith; the report from 'Uthman that whoever performs wudu' as the Prophet did has his earlier sins forgiven; the hadith of 'Umar on the eight gates of Paradise; and the hadith of Abu Hurayra on the radiant marks of the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376} The conditions of wudu' are of three kinds: conditions of obligation, of validity, and of both; the first of the conditions of obligation is intellect, since no address is made to one who lacks it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nConditions of obligation, which when all are present make purification binding on the person:\n\nFirst, intellect. The jurists hold it is a condition of obligation, since no address is made to one without it; the Malikis make it a condition of both obligation and validity, and the Hanbalis a condition of validity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nSecond, puberty is a condition of obligation: a child is not obliged, since he is not addressed; a discerning child's wudu' is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nThird, Islam: the Hanafis in the sounder view make it a condition of obligation; one Maliki view makes it a condition of obligation and validity; the Shafi'is, Hanbalis and the Maliki majority make it a condition of validity, since unbelievers are addressed by the branches of the law in their view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nFourth, the cessation of menses and post-natal bleeding is a condition of both obligation and validity for the four schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nFifth, the presence of sufficient pure water: no wudu' is obligatory without water. The Shafi'is require knowing that the water is unmixed, even by assumption where doubt arises; the Hanbalis require its purity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17377} The ability to use water is a condition for the Hanafis and the Malikis, so the incapable are exempt, and so is one whose hands are cut off at the elbows and feet at the ankles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17377}\n\nSixth, the presence of a cause of impurity is a condition of obligation for the four schools; the Shafi'is have three views on what makes it obligatory: the impurity together with cessation, the rising to prayer, or both, the last being the most accurate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17377}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17378} The one who doubts whether he is impure but is certain he is pure need not renew wudu' according to the majority; the Maliki preferred view is that he must. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17377}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17378}\n\nSeventh, the Hanafis make the narrowing of time a condition of the narrow obligation; the Malikis make the entry of the time of the present prayer, and recalling a missed prayer, a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17378} The Malikis also make the reaching of the Prophet's call to the person a condition of both obligation and validity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17378}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}\n\nConditions of validity, which the wudu' cannot be valid without:\n\nFirst, the whole skin must be wetted with pure water. The Hanafis hold that if a needle's point remains dry of the required washing, the wudu' is not valid. The Shafi'is require the washing of a part adjoining and surrounding the washed part so that the whole member is covered. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}\n\nSecond, the removal of what blocks water from reaching the body, such as wax, grease, dough or mud, is a condition in the Hanafi and Maliki schools; the Shafi'is and Hanbalis also count it; the Shafi'is add that nothing on the limb may change the water in a harmful way. The preferred view, as stated in the Imdad, is that perfume used to beautify the hair must be removed, because it may dry and block the water from reaching the skin beneath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}\n\nThird, the cessation of the impurity during wudu': if urine or a discharge that breaks wudu' appears during it, it is not valid, in the four schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}\n\nFourth, the Shafi'is require knowledge of how to perform wudu': the one who performs it must tell its obligatory acts from its recommended ones, or believe that it has obligatory and recommended parts; this applies to the lay person, while the learned must distinguish. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17379}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nFifth, no diverting of the intention: the intention must continue in effect, so the one who performs wudu' must not do something contrary to it, such as apostasy, or saying if God wills in a way other than blessing, or breaking the intention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nSixth, the Shafi'is require that water flow over the limb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nSeventh, intention: the Hanbalis count it as a condition, citing the saying that actions are by intentions, and because wudu' is an act of worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nEighth, the Hanbalis in the sounder school view require that the water be permitted; wudu' with water forbidden to use, like usurped water, is not valid; a report from Ahmad allows purification with usurped water but disapproves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}\n\nThe conditions for one with a continuing impurity, such as incontinence or istihada: the Shafi'is and Hanbalis require the entry of the time, even by assumption, and the prior cleaning of the private parts or the istijmar. The Shafi'is add the precaution where needed, continuity between the acts of wudu', and continuity between wudu' and prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17380}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381}\n\nCauses of wudu': the jurists differ. The majority of Hanafis, Malikis, the sounder Shafi'i view and one Hanbali view hold that the cause of its obligation is the intention to pray while impure, citing the verse of sura al-Ma'ida and Ibn 'Abbas's reading of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381} The Shafi'i view in one form and the sounder Hanbali school view hold the cause to be the impurity itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381} The Shafi'i view in one form and a Hanbali opinion hold that the cause is the rising to prayer or the like, so wudu' is not fixed before it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381}\n\nThe obligatory parts of wudu': the jurists agree that washing the face, washing the hands to the elbows, wiping the head and washing the feet to the ankles are obligatory. They differ on whether the intention, continuity, order and rubbing are obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381}\n\nFirst obligatory part, washing the face, which is agreed by the verse, and by a report from Humran, freedman of 'Uthman, describing 'Uthman's wudu': he washed his hands three times, rinsed and cleaned the nose, washed his face, arms, and feet three times each, wiped his head, and said he had seen the Prophet perform it so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17381}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}"
