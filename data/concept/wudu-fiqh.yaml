id: concept/wudu-fiqh
class: concept
kind: legal
label:
  ar: "وُضوء"
  en: "Wudu' (ablution, fiqh)"
summary:
  ar: "الوضوء في اللغة من الوَضاءة، أي الحسن والنظافة. والوُضوء بالضم الفعل، وبالفتح الماء الذي يُتوضأ به، وقيل هما لغتان أو مصدران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364} وعرّفه الفقهاء: الحنفية بأنه الغسل والمسح على أعضاء مخصوصة؛ والمالكية بأنه طهارة مائية تتعلق بأعضاء مخصوصة على وجه مخصوص؛ والشافعية بأنه أفعال مخصوصة مفتتحة بالنية؛ والحنابلة بأنه استعمال ماء طهور في الأعضاء الأربعة على صفة مخصوصة في الشرع، مرتبة متوالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}\n\nوالغُسل استعمال الماء في جميع البدن على وجه مخصوص، والوضوء والغسل كلاهما يرفع الحدث، فيرفع الوضوء الحدث الأصغر والغسل الأكبر. والطهارة أعم من الوضوء، وهي ارتفاع الحدث وزوال النجس. والتيمم في اللغة التوخي والقصد، وفي الاصطلاح مسح الوجه واليدين بصعيد طاهر على وجه مخصوص، ويكون من الحدث الأصغر أو الأكبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}\n\nوذهب جمهور الفقهاء إلى أن الوضوء من الشرائع القديمة، وأن الذي خُصّت به هذه الأمة هو الكيفية المخصوصة أو أثر الوضوء، وهو الغرّة والتحجيل، واستدلوا بأحاديث وضوء الأنبياء وسارة وجريج. وذهب المالكية في قول، والشافعية في مقابل الأصح، وبعض الحنفية، إلى أن الوضوء نفسه من خصائص هذه الأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367}\n\nوقد فُرض الوضوء بمكة مع الصلاة، والمعيّة هنا للمكان لا للزمان، وكان النبي لا يصلي إلا بوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} ومشروعيته بالكتاب والسنة والإجماع، ومن الكتاب آية المائدة، وقد عدّها بعض الفقهاء دليل الفرضية، وذهب الجمهور إلى أن المقصود إذا قمتم إلى الصلاة وأنتم محدِثون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} ومن السنة قوله: لا تُقبل صلاة بغير طهور. وأجمع أهل السير أن الوضوء فُرض بمكة بتعليم جبريل ، وأجمعت الأمة على مشروعيته ووجوبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} ونص الفقهاء على أن من أنكر وجوب الوضوء للصلاة يكفر؛ وقال الحنفية إن إنكار وجوبه لغير الصلاة، كمس المصحف، لا يُكفِّر لوقوع الخلاف في تفسير آيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nأما من ترك الوضوء عمداً ثم صلى محدثاً: فعند الحنفية يكفر من استخف بالدين كالصلاة بلا وضوء عمداً؛ وعند المالكية يُقتل بترك الطهارة كالصلاة؛ وعند الشافعية يُستتاب، فإن لم يتب قُتل حداً لا كفراً؛ وعند الحنابلة من ترك شرطاً مجمعاً عليه كالطهارة فحكمه حكم تاركها، ومن ترك الصلاة جاحداً أو غير جاحد دُعي إليها ثلاثة أيام فإن لم يصلِّ قُتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nالحكم التكليفي للوضوء يختلف باختلاف ما يُتوضأ له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nأولاً: ما يكون الوضوء له فرضاً. الصلاة: اتفق الفقهاء على أنه فرض على المحدث إذا أراد القيام لصلاة فرض أو نفل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} والحنفية يوجبونه لصلاة الجنازة لأنها صلاة، ويشترط لها ما يشترط لبقية الصلوات، وجمهور الفقهاء يوجبونه لسجدة التلاوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} والطواف: الجمهور من المالكية والشافعية والحنابلة يوجبونه للطواف فرضه ونفله، والحنفية يرونه واجباً، ويترتب على ذلك أن من طاف الفرض محدثاً لزمه دم، ومن طاف جنباً لزمته بدنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} ومس المصحف: الجمهور على أنه فرض لمسه، والدليل آية الواقعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}\n\nثانياً: ما يكون الوضوء له سنة. قال الحنفية والحنابلة والشافعية غير البغوي إن الوضوء للنوم سنة، واستدلوا بحديث الاضطجاع على الشق الأيمن بعد الوضوء، المروي في الصحيحين. وقال المالكية إنه مستحب، وفي قول لهم أن وضوء الجنب للنوم سنة، وفي قول واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}\n\nثالثاً: ما يكون الوضوء له مندوباً. ضابطه كل وضوء ليس شرطاً في صحة ما يُفعل به بل من كماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} ومن ذلك: قراءة القرآن وقراءة الحديث وروايته، وذكر الله، والأذان، والإقامة على خلاف بين الفقهاء، والخطبة، ودراسة العلم الشرعي، والوقوف بعرفة والسعي بين الصفا والمروة، وزيارة النبي  ودخول مسجده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} وفي تجديد الوضوء اختلف الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} ويستحب للجنب الوضوء عند إرادة الأكل والشرب ومعاودة الوطء والنوم عند جمهور الحنفية والشافعية والحنابلة، والمالكية يرون أن الوضوء للأكل والشرب والجماع ليس على الجنب، وإنما يُستحب غسل اليدين والفرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} ويندب عند الحنفية المحافظة على الوضوء بتجديده كلما أحدث، والوضوء للخروج من خلاف العلماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}\n\nرابعاً: ما يباح له الوضوء. عند المالكية الوضوء للتنظيف والتبرد؛ وذكر القاضي عياض أن الوضوء المباح للدخول على الأمراء وركوب البحر ونحوه من المخاوف، وأنه قد يكون مستحباً، واستظهر الحطاب الاستحباب فيها ما عدا التنظيف والتبرد. وهذا الوضوء لا يرفع الحدث ما لم يُنوَ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nخامساً: الوضوء الممنوع، وعند المالكية هو المجدَّد قبل أن تُفعل به عبادة، أو الوضوء لغير ما شُرع له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nوفضيلة الوضوء: وردت أحاديث في سقوط الخطايا به، منها أن الطهور شطر الإيمان، وما رُوي عن عثمان في وضوء النبي  وأن من توضأ هكذا غُفر له ما تقدم من ذنبه، وحديث عمر في أبواب الجنة الثمانية، وحديث أبي هريرة في الغُرّ المحجّلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nشروط الوضوء: منها شروط الوجوب، ومنها شروط الصحة، ومنها ما هو للوجوب والصحة معاً؛ وأول شروط الوجوب العقل، إذ لا خطاب على غير العاقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nالواجب في غسل الأعضاء في الوضوء: يكفي عند الجمهور (الحنفية والشافعية والحنابلة) جريان الماء على العضو دون دَلك، وانفرد المالكية والمزني بشرط الدلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} وعند الحنفية يكون الغسل بإسالة الماء مع التقاطر ولو قطرة، وعن أبي يوسف يكفي مجرد بلّ المحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} وعند الشافعية المراد بالغسل الانغسال، سواء بفعل المتوضئ أو بفعل غيره أو بلا فعل كنزول المطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}\n\nالوجه: ما تحصل به المواجهة، فيُغسل ظاهره كله. وحدّه عرضاً ما بين الأذنين، وطولاً من منابت الشعر في الرأس إلى أسفل الذقن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} وعند المالكية والحنابلة يكون الطول في من لا لحية له إلى منابت الشعر، وفي من له لحية إلى منتهى اللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} والشعر المسترسل خارج دائرة الوجه: عند الحنفية لا يجب غسله، والشافعية يوجبونه إن كان خفيفاً ظاهراً وباطناً، وإن كان كثيفاً فظاهره فقط، وفي قول لهم لا يجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383}\n\nغسل الشعر النابت على الوجه: عند الحنفية لا يجب غسل أصول الشعر الكثيف للحرج، ويجب غسل الخفيف ظاهراً وباطناً إلى البشرة. وعند المالكية يجب تخليل الخفيف وإيصال الماء إلى البشرة، ولا يُخلَّل الكثيف بل يكفي إمرار الماء على ظاهره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384} وعند الشافعية تُغسل شعور الهدب والحاجب والشارب والعذار والعنفقة ظاهراً وباطناً، وقد تُغسل لحية المرأة والخنثى كذلك؛ وفي لحية الرجل يُغسل الخفيف ظاهراً وباطناً، ويُغسل الكثيف ظاهره فقط، والمعتمد عندهم أنه إن تميّز الخفيف عن الكثيف فلكل حكمه، وإن اختلطا غُسل الكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} وعند الحنابلة يجب غسل اللحية وما خرج عن حد الوجه من الشعر المسترسل، ويجب غسل الكثيف من الشعور في الوجه كالعنفقة والشارب والحاجب ولحية المرأة والخنثى، ويُسنّ تخليل اللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}\n\nغسل ماق العين وداخلها: يُغسل مع الوجه ماق العين، فإن كان عليها رمص وجبت إزالته. أما داخل العين فالجمهور على أنه لا يُغسل مع الوجه في الوضوء، لأن النبي لم يفعله ولا أمر به، ولأنه يضره الماء الحار والبارد؛ وروي عن أحمد وجوب غسله بشرط أمن الضرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} وإن تنجس داخل العين أوجب المالكية والشافعية وأحمد في قول غسله، وعند الحنفية والحنابلة في المذهب يُعفى عنه في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}\n\nغسل موضع الغمم، وهو ما نزل من الشعر عن المعتاد من حد منبته في الرأس إلى حد ينتهي إلى المعتاد وقدر ما يتم به الواجب، فيُغسل مع الوجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} وموضع التحذيف، وهو ما نبت عليه الشعر الخفيف بين العذار والنزعة، فيه خلاف: عند جمهور الشافعية والمالكية في رأي والحنابلة في الصحيح أنه من الرأس فلا يُغسل مع الوجه؛ وعند الحنفية والمالكية في رأي والحنابلة في قول والشافعية في قول، وهو الأصح عند الغزالي والرافعي، أنه من الوجه فيُغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالبياض بين العذار والأذن: عند الشافعية والحنابلة وظاهر المذهب عند الحنفية وبه يُفتى أنه من الوجه، وعن أبي يوسف رواية أنه ليس منه؛ وعند المالكية يُغسل البياض المحاذي لوتد الأذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالشفتان: يجب غسل ما يظهر من حمرتهما عند انضمامهما الطبيعي، وقيل عند الحنفية في وجه إن الشفة تبع للفم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} وغسل جزء من الرأس عند غسل الوجه واجب عند الفقهاء، وزاد الشافعية غسل جزء من الحلق وما تحت الحنك والأذنين، لأن ما لا يتم الواجب إلا به واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالعذار يُغسل مع الوجه، ويُغسل ما ظهر من الأنف بالجدع عند الشافعية، والوترة (الحاجز بين المنخرين) عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388} وعند جمهور الفقهاء داخل الفم والأنف ليسا من الوجه، فلا يجب غسلهما فيه؛ وعند الحنابلة الفم والأنف من الوجه، فتجب المضمضة والاستنشاق في الطهارتين، واستندوا إلى حديث عائشة في أنهما من الوضوء الذي لابد منه، وقد أعلّه الدارقطني بالإرسال عند بعض الرواة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nالصدغ وموضع الصلع والنزعتين: جمهور الفقهاء على أنها من الرأس لا من الوجه؛ وعند الحنابلة في قول أن الصدغ من الوجه؛ وقال الشربيني يُسنّ غسل موضع الصلع والتحذيف والنزعتين والصدغين مع الوجه للخلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} والمالكية يغسلون أسارير الجبهة وما غار من جفن ونحوه إن أمكن إيصال الماء إليه بدلك، فإن لم يمكن سقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nالأذنان: خالف الزهري الجمهور فجعلهما من الوجه يُغسلان معه، واستدل بحديث في سجود الوجه، والجمهور أجابوا بأن الأذنين من الرأس، واستشهدوا بمسح النبي أذنيه مع رأسه، وأن إضافتهما إلى الوجه لمجاورتهما له، والشيء يُسمى باسم ما جاوره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nمن غسل ظاهر شعر اللحية ثم زال الشعر أو انقلعت جلدة من وجهه بعد غسلها: فعند الحنفية والمالكية في الراجح والحنابلة والشافعية في أحد الوجهين لا يلزمه غسل ما ظهر ولا إعادة وضوئه، لأن الفرض انتقل إلى الشعر، وعند الشافعية في الأصح والمالكية في قول وابن جرير يجب غسل البشرة إذا ظهرت، قياساً على ظهور قدم الماسح على الخف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nالفرض الثاني: غسل اليدين إلى المرفقين، وهو ركن من أركان الوضوء وفرض باتفاق، بالكتاب، وبحديث أبي هريرة في صفة وضوء النبي، وبالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وجمهور الفقهاء (المالكية والشافعية والحنابلة في المذهب والحنفية ما عدا زفر) يوجبون غسل المرفقين مع اليدين، لأن «إلى» في الآية إن كانت بمعنى «مع» فالدخول ظاهر، وإن كانت للغاية فالحد إذا كان من جنس المحدود دخل فيه، ولحديث عباد العبدي في صفة الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وقال زفر وأحمد في قول والمالكية في قول بعدم دخول المرفق، قياساً على الليل في آية الصوم؛ وفي قول آخر للمالكية يدخل احتياطاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391}\n\nقطع بعض ما يجب غسله من اليد: يجب غسل ما بقي منه بالاتفاق، لحديث «إذا أمرتكم بأمر فأتوا منه ما استطعتم»، ولأن الميسور لا يسقط بالمعسور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وحكم قطع اليد من المرفق ينظر فيه الحنفية وغيرهم، ويتصل بالصفحة التالية (ص 17392 فما بعد)، وقد بقي هذا الجزء من المدخل غير مكتمل.\n\nقطع اليد من المرفق: عند الجمهور القائلين بوجوب غسل المرفق يُغسل موضع القطع، والحنفية والحنابلة في المذهب والشافعية في المشهور والمالكية في قول يوجبون غسل العظم الذي هو طرف العضد، لأن غسل العظمين المتلاقيين من الذراع والعضد واجب فإذا زال أحدهما غسل الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} وعند المالكية والشافعية في مقابل المشهور لا يجب غسل موضع القطع، لأن المرفق في الذراع وقد وقع عليه القطع، إلا أن يُعرف بقاء شيء من المرفق في العضد فيُغسل موضع القطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nقطع اليد من فوق المرفق: يسقط وجوب الغسل لعدم محله، لكن الشافعية نصوا على ندب غسل باقي العضد لئلا يخلو العضو من طهارة، وقالوا إن قُطع من المنكب ندب غسل محل القطع بالماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nغسل ما زاد من أصبع أو كف أو يد: الحنفية والمالكية والشافعية والقاضي من الحنابلة يوجبون غسل الإصبع أو الكف الزائدة إن نبتت في محل الفرض مع الأصلية. وإن نبتت في غير محل الفرض كالمنكب أو العضد، فجمهور الفقهاء يوجبون غسل ما حاذى منها محل الفرض، والحنابلة في الأصح لا يوجبون غسل المتميزة منها في غير محل الفرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nغسل ظفر اليد أو ما تحته: الحنفية والشافعية والحنابلة يوجبون غسل الظفر وإن طال لأنه متصل باليد اتصال خلقة فيدخل في مسمى اليد. وعند المالكية والحنابلة في قول لا يضر الوسخ اليسير تحت الظفر ولو منع وصول الماء، واحتج المرداوي بأنه مما يكثر وقوعه، فلو اشترط زواله لبيّنه النبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393} وعند الحنفية، بحسب الفتاوى، إن بقي من موضع الوضوء قدر رأس إبرة أو لزق بأصل الظفر طين يابس أو رطب لم يجز، وإن تلطخت اليد بخميرة أو حناء جاز؛ وإذا طال الظفر وجب إيصال الماء إلى ما تحته، وإذا قصر فلا يجب؛ وإذا طالت الأظفار حتى خرجت عن رؤوس الأصابع وجب غسلها بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} ونقل الكتاب عن بعض الحنفية التفريق بين أهل المدن وأهل القرى، ونقل الدبوسي الفتوى بالجواز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} والشافعية يوجبون غسل الشعر الظاهر على اليد ظاهراً وباطناً وإن كثف، وإلا غسلوا ما ظهر منه فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} والمالكية على المشهور يوجبون تخليل أصابع اليدين، ويجب عندهم معاهدة عقد الأصابع ورؤوسها وتكاميش الأنامل؛ ولا يجب تحريك الخاتم المأذون فيه لرجل أو امرأة، ويجب نزع الخاتم غير المأذون فيه إلا أن يكون واسعاً يدخل الماء تحته فيكفي تحريكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}\n\nغسل اليد الزائدة: الحنفية والمالكية والشافعية والحنابلة يوجبون غسل يد زائدة نبتت في محل الفرض. وإن نبتت في غير محل الفرض، فعند الحنفية والشافعية والحنابلة في قول يجب غسل ما حاذى منها محل الفرض، وعند المالكية إن لم يكن لها مرفق، فإن كان لها مرفق غُسلت كلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} وعند الحنفية، إن خُلق له يدان، فالتي يبطش بها هي الأصلية تُغسل، والأخرى زائدة؛ وعند الشافعية يجب غسل الزائدة التي لم تتميز عن الأصلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nغسل الجلد المتدلي من العضد: الحنفية والشافعية يوجبون غسل ما حاذى محل الفرض منه فقط، والحنابلة يوجبون غسل الجلدة المتقلعة من العضد إذا تدلت من الذراع كالإصبع الزائدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} وغسل الجلد المتدلي من الذراع واجب عند الفقهاء؛ وإن التحم رأسه بالعضد غُسل ما حاذى محل الفرض، ثم إن تجافى عنه غُسل ما تحته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nالفرض الثالث: مسح الرأس، وهو باتفاق الفقهاء من أركان الوضوء أو فروضه، بالكتاب، وبالأحاديث في وصف وضوء النبي، ومنها حديث عثمان. والمسح إمرار اليد المبتلة بالماء على الرأس بلا تسييل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} وتبدأ مسائل مسح الرأس، ومنها القدر المجزئ فيه، ويُختلف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nمسح الرأس: قال المالكية على المشهور والحنابلة على الصحيح في المذهب بوجوب مسح الرأس كله، ويدخل فيه الجلد والشعر من منابت الشعر المعتادة من مقدم الرأس إلى نقرة القفا، مع مسح شعر الصدغين، ولا يُمسح العظم الناتئ الذي هو من الوجه بل يُغسل معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} وفي الأقوال عند المالكية: أشهب يكفي عنده مسح النصف، وعنه أن مسح الناصية يجزئ، ومحمد بن مسلمة يجزئ مسح الثلثين، وأبو الفرج يجزئ مسح الثلث، ويُرد اليد تحت الشعر ليحصل التعميم، والرد سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} وعند الحنابلة يجب مسح ظاهر الرأس كله، وعن أحمد يجزئ أكثره، واختلفوا في تحديد الأكثر، وعن أحمد يجزئ قدر الناصية، وعنه يجزئ بعضه دون تحديد؛ ولو مسح البشرة فقط لم يجزئه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}\n\nوعند الحنفية ركن الوضوء مسح الرأس مرة فوق الأذنين، والمقدار المفروض في أشهر الروايات ربع الرأس وهو المعتمد في المذهب، وفي رواية أنه قدر الناصية، وفي رواية ثالثة قدر ثلاث أصابع، وفي البدائع أنها رواية الأصول، وفي الظهيرية عليها الفتوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} وعند الشافعية يجزئ مسمى المسح على بعض بشرة الرأس أو بعض شعره داخل حد الرأس، ويصدق المسح على البشرة أو الشعر، لأن الرأس اسم لما رأس وعلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nكيفية المسح: عند الحنفية على الأصح يُمسح بثلاث أصابع من اليد، فلو مسح بإصبع أو إصبعين لم يجز في ظاهر الرواية، ويجوز بالسبابة والإبهام مفتوحتين مع ما بينهما من الكف لأنها تعادل ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} وعند الحنابلة يجزئ المسح على أي كيفية، باليد أو بحائل، على الصحيح في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nما نزل عن الرأس من الشعر: الحنفية والشافعية والحنابلة لا يجب مسحه، والمالكية يوجبون مسح ما استرخى منه ولو طال جداً لأنه من شعر الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nغسل الرأس بدل مسحه: جمهور الفقهاء يجزئ، لأنه مسح وزيادة، واشترط الحنابلة في الصحيح أن يمرّ يده على الرأس، وعن أحمد يجزئ غسله دون إمرار اليد؛ ويُكره عند الحنفية والمالكية في الأظهر والحنابلة غسل الرأس ابتداءً بدل مسحه، لأنه خلاف المأمور به، وقال بعض المالكية والشافعية وأحمد في قول إنه لا يجزئ لأنه لا يُسمى مسحاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nحلق شعر الرأس بعد الوضوء: جمهور الفقهاء يرون أنه لا يؤثر، وقال الحنفية لا يُعاد الوضوء، لأن المسح على الشعر ليس بدلاً عن البشرة. وعند المالكية في رأي تجب إعادة مسح الرأس بعد الحلق، والدسوقي يرى هذا الرأي ضعيفاً؛ وعن ابن جرير الطبري الإعادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} وعن ابن رجب أن أحمد استحب أن يمس الرأس بالماء بعد الحلق ولم يوجبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nتكرار المسح: الحنفية والمالكية والحنابلة على أن المسح مرة واحدة، لأن التكرار يصير غسلاً، واستدل الحنابلة بأن أكثر من وصف الوضوء ذكر مسح الرأس مرة، وقال أبو داود إن أحاديث عثمان كلها تدل على ذلك؛ والشافعية يسنّون تثليث مسح الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالشعور المضفورة: عند المالكية ما ضُفر بنفسه لا يُنقض مطلقاً، وما ضُفر بثلاثة خيوط يجب نقضه، وما ضُفر بأقل منها يُنقض إن اشتد، والصاوي يرى أن النساء ينفعهن تقليد الشافعي أو أبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالمسح على العمامة: تفصيله في باب المسح، ويُحال إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالفرض الرابع، غسل الرجلين إلى الكعبين، وفيه أربعة أقوال. القول الأول، وهو مذهب الجمهور، أنه من أركان الوضوء غسل الرجلين، ويثبت ذلك بالإجماع، وقد نقل عبد الرحمن بن أبي ليلى أن أصحاب النبي أجمعوا على غسل القدمين، وقال الماوردي إن فرضهما عند كافة الفقهاء الغسل دون المسح، ونقل النووي عن أبي حامد وغيره إجماع المسلمين على وجوب غسلهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}\n\nالقول الثاني: أن فرض الرجلين المسح دون الغسل، وروي ذلك عن علي وابن عباس وأنس والشعبي وغيرهم، واستدلوا بقراءة الجر في آية المائدة، وقد ثبت رجوع علي عنه بأمره بغسل الأقدام، وقال ابن قدامة إنه لم يعلم من فقهاء المسلمين من يقول بالمسح غير من ذُكروا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nالقول الثالث: الحسن البصري والجبائي وابن جرير الطبري في إحدى الروايات أن المتوضئ مخيّر بين غسل الرجلين ومسحهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} القول الرابع: لبعض أهل الظاهر وجوب الجمع بين الغسل والمسح، لأن القراءتين في آية واحدة بمنزلة آيتين، ولا تنافي بين الغسل والمسح في محل واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nويجب عند جمهور الفقهاء إدخال الكعبين في الغسل، ولم يخالف إلا زفر. والكعبان العظمان الناتئان في أسفل الساق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nثانياً: الفرائض المختلف فيها في الوضوء.\n\nأولاً: النية، فالجمهور على أنها شرط لا يصح الوضوء إلا بها، وقال بعضهم إنها سنة، وقال آخرون إنها فرض، وتفصيلها في باب النية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nرفض النية: إذا رفض المتوضئ النية بعد كمال الوضوء لم يؤثر ذلك عند المالكية والشافعية على الصحيح والحنابلة على الصحيح؛ ومقابل الصحيح عند الحنابلة أنه يبطل. أما إذا رفضها أثناء الوضوء، فالشافعية في الأصح لا يبطل ويُستأنف النية لما بقي، والحنابلة في الصحيح يبطل ما مضى، والمالكية على الراجح لا يغتفر الرفض فيبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nثانياً: الموالاة، وهي غسل الأعضاء على التعاقب بحيث لا يجف الأول قبل الشروع في الثاني؛ فالحنفية والشافعية في القول الجديد الصحيح والمالكية في قول والحنابلة في رواية يرونها سنة، ومنها قول ابن عمر وقول الحسن وسعيد بن المسيب والثوري. وعند المالكية على المشهور والشافعية في القديم والحنابلة في المذهب أنها واجبة، وبه قال عمر بن الخطاب والأوزاعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nثالثاً: الترتيب، أي أن يأتي بالأعضاء على الترتيب في الغسل والمسح. فالشافعية والحنابلة في المذهب والمالكية في قول يرونه ركناً، وهو قول عثمان وابن عباس وقتادة وأبي ثور وأبي عبيد وإسحاق، واستدلوا بآية المائدة لأن المسح دخل بين الغسلين، وبأن كل من حكى وضوء النبي حكاه مرتباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405} وعند الحنفية والمالكية على المشهور وبعض الشافعية ورواية عن أحمد أن الترتيب سنة، وهو قول ابن مسعود وغيره، واستدلوا بأن الآية عطفت بالواو، وهي لا تقتضي ترتيباً، وبأن الغسل دفعة واحدة يرفع الحدث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nرابعاً: الدلك، وهو إمرار اليد على العضو إمراراً متوسطاً، ولو لم تزل الأوساخ، ولو بعد صب الماء قبل جفافه، عند المالكية. فجمهور الحنفية والشافعية والحنابلة وقول عند المالكية يرونه سنة، ويزيد الشافعية أن يبالغ في العقب خصوصاً في الشتاء؛ والمالكية في المشهور يرونه فرضاً، واستدلوا بأمر النبي عائشة أن تدلك جسدها، وهو حديث لم يُسند عند التعليق في الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nالدلك، وفيه ثلاثة أقوال عند المالكية: المشهور الوجوب، لأنه شرط في حصول مسمى الغسل، ومن قال به استدل بأمر عائشة بدلك جسدها؛ والثاني، وهو لابن عبد الحكم، أنه لا يجب لصدق اسم الغسل بدونه؛ والثالث أنه واجب لا لنفسه بل لتحقق إيصال الماء، فمن تحقق إيصاله بطول مكث أجزأه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}\n\nسنن الوضوء.\n\nأولاً: التسمية في أول الوضوء. فجمهور الحنفية والشافعية وأحمد في رواية على أنها سنة، والمالكية في المشهور على أنها مستحبة، وقيل مكروهة، والحنابلة على أنها واجبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وعند الحنفية تحصل التسمية بكل ذكر، والوارد عن النبي والمنقول عن السلف «بسم الله العظيم والحمد لله على الإسلام»، وقيل الأفضل «بسم الله الرحمن الرحيم»؛ وعند الشافعية أقلها «بسم الله» وأكملها بكمالها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وعند الحنابلة يجب أن تكون بلفظ «بسم الله» ولا يقوم غيره مقامه على الأشهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وأما التسمية عند غسل كل عضو، فعند الحنفية من الآداب، وذكروا فيها حديث البراء بن عازب في ذكر الشهادتين عند كل عضو، وقال العيني إن إسناده واه. وظاهر كلام الحنابلة أنها لا تستحب عند كل عضو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nثانياً: غسل اليدين إلى الرسغين، ويُسن في ابتداء الوضوء اتباعاً لفعل النبي، ويجب غسلهما اتفاقاً إن كانتا نجستين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nثالثاً: المضمضة، فجمهور الفقهاء على أنها سنة، والحنابلة على أنها واجبة. ويُحال في تفصيلها إلى بابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nرابعاً: الاستنشاق، فجمهور الفقهاء على أنه سنة، والحنابلة على أنه فرض أو واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nخامساً: الاستنثار، وهو سنة عند الحنفية والمالكية والشافعية والحنابلة، لحديث «إذا استنشقت فانتثر»؛ وعند المالكية طرح الماء من الأنف بالنَّفَس مع وضع السبابة والإبهام من اليسرى عليه، وعند الشافعية إخراج ما في الأنف بخنصر اليسرى، وعند الحنابلة يُسنّ الاستنثار باليسار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nسادساً: مسح كل الرأس. وقد سبق أن المالكية في المشهور والحنابلة يوجبونه، والحنفية والشافعية يرونه سنة. واستدل الحنفية بحديث مسح كل الرأس، وبحديث مسح النبي بناصيته، فيكون مسح الربع فرضاً ومسح الجميع سنة؛ وقالوا إن من داوم على ترك استيعاب الرأس بلا عذر يأثم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} وعند الشافعية يُسنّ مسح كل الرأس اتباعاً وخروجاً من خلاف من أوجبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nمسائل تتعلق بمسح الرأس:\n\nأ- تكرار المسح: الحنفية يرون أن يُمسح الرأس كله مرة بماء واحد، ومن روى التثليث فهو محمول على مسح بماء واحد، وعن الحسن عن أبي حنيفة أن المسح ثلاثاً بماء واحد مسنون؛ وأما المسح ثلاثاً بماء متجدد ففيه ثلاثة أقوال: يُكره، أو بدعة، أو لا بأس به، والكتاب ينقل ترجيح ابن عابدين للكراهة. وعند الشافعية يُسنّ تثليث الممسوح؛ ولو مسح بعض الرأس ثلاثاً حصل التثليث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nب- كيفية المسح المسنون: عند الحنفية الأظهر أن يضع كفيه وأصابعه على مقدم الرأس ويمدهما إلى القفا، ثم يمسح أذنيه بإصبعيه. وعند الشافعية أن يضع يديه على مقدم الرأس ويلصق السبابة بالأخرى، ويُمرّ إبهاميه على الصدغين، ثم يذهب بهما إلى القفا ويردّهما إلى المكان الذي ذهب منه إن كان له شعر ينقلب؛ ومن لا شعر له يقتصر على الذهاب، ويُنظر في المسح كله بالفرض والسنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nوصرّح الحنابلة بأنه لا يُستحب تكرار مسح الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nيذكر الكتاب من السنن في مسح الرأس: أن يُعاد المسح إلى حيث بدأ، وذكر الترمذي حديث أبي حية في وضوء علي وفيه مسح الرأس مرة، وروى أبو داود حديث ابن عباس أن النبي مسح برأسه وأذنيه مسحة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} وعن أحمد يُستحب تكرار المسح بماء جديد، نصره أبو الخطاب وابن الجوزي، وكذا الأذنان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} وعدّ المالكية من السنن رد المتوضئ مسح رأسه إلى حيث بدأ، لأن الشعر الطويل لا يحصل تعميمه إلا بالرد، ويكون الرد سنة إن بقي في اليد بلل من المسح الواجب، ويُكره تجديد الماء له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}\n\nصفة مسح الرأس: عند المالكية والشافعية أن يأخذ الماء بيده اليمنى ويفرغه على باطن اليسرى ثم يمسح، يبدأ بمقدم الرأس ويضم أطراف أصابعه ويجعل إبهاميه على صدغيه، ثم يذهب بيديه إلى طرف الشعر مما يلي القفا ثم يردهما إلى حيث بدأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} وعند الحنابلة الصفة المسنونة أن يمرّ يديه من المقدم إلى القفا ثم يردهما إلى الموضع الذي بدأ منه، لحديث عبد الله بن زيد، ثم يدخل سبابتيه في الصماخين ويمسح بإبهاميه ظاهرهما؛ وإن كان ذا شعر يخاف انتفاشه بالرد لم يردّ، لحديث الربيع بنت معوذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} وسئل أحمد عن مسح المرأة فوصف مسح الرأس مع الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}\n\nسابعاً: مسح الأذنين. عند الحنفية والمالكية على المشهور والشافعية أنه من سنن الوضوء مسح الأذنين ظاهرهما وباطنهما، استناداً إلى حديث المقدام بن معدي كرب في مسح الأذنين وإدخال الأصابع في الصماخين، وعند جمهور الفقهاء ظاهر الأذنين ما يلي الرأس وباطنهما ما كان مواجهاً؛ وقال المالكية في رأي إن الظاهر هو المواجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} وعن المالكية أن السنن المتعلقة بالأذنين ثلاث: مسح ظاهرهما وباطنهما، ومسح الصماخين، وتجديد الماء لهما. وعند الشافعية يُسنّ مسح الأذنين بماء جديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} وعند الحنابلة وبعض المالكية يجب مسح الأذنين ظاهرهما وباطنهما، لأنهما من الرأس، ويُسنّ مسحهما بماء جديد بعد مسح الرأس، والبياض فوق الأذنين من الرأس فيجب مسحه معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} والمسنون عند الحنابلة أن يدخل سبابتيه في صماخيهما ويمسح بإبهاميه ظاهرهما، ولا يجب مسح ما استتر من الأذن بالغضاريف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} وعند الحنفية يكفي مسح جميع الرأس والأذنين بماء واحد، لأنهما من الرأس، وأظهر الصفات عندهم أن يضع كفيه وأصابعه على مقدم الرأس ويمدهما إلى القفا، ثم يمسح أذنيه بإصبعيه، وإن مسحهما بالبلة الباقية كفى، ومسحهما بماء جديد أولى مراعاة للخلاف؛ وعند الحنفية يندب إدخال الخنصر المبلولة في الصماخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nثامناً: تخليل اللحية وشعور الوجه، وهو سنة في الجملة، وتفصيله في غسل الوجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nتاسعاً: تخليل أصابع اليدين والرجلين، ويُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nعاشراً: التثليث، وهو سنة عند الفقهاء في غسل الأعضاء، وفي حديث النبي إنه توضأ مرة وقال إنها الوضوء الذي لا تُقبل الصلاة إلا به، ومرتين وقال إنه يُضاعف الأجر، وثلاثاً وقال إنه وضوؤه ووضوء الأنبياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالحادي عشر: الاستياك. جمهور الفقهاء على أنه سنة عند الوضوء، لحديث «لولا أن أشق على أمتي لأمرتهم بالسواك مع كل وضوء»؛ وعند الحنفية سنة مؤكدة، وعند المالكية في المشهور مستحب، ويرى الدسوقي أن ظاهر الحديث يقتضي السنة وإن خالف المشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} وتفصيل السواك في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالثاني عشر: المسح على العمامة، وفيه خلاف يُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالثالث عشر: عدم الإسراف في الماء، ويُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}\n\nالرابع عشر: التيامن في اليدين والرجلين. فالحنفية والمالكية والحنابلة في الصحيح من المذهب يرونه مستحباً، استناداً إلى حديث عائشة في تيمّن النبي في شأنه كله، وإلى وصف عثمان وعلي لوضوء النبي بأنه بدأ باليمنى قبل اليسرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417} والشافعية وبعض الحنفية يرونه سنة لحديث «إذا توضأتم فابدؤوا بميامنكم»، وقال ابن الهمام إنه سنة لثبوت مواظبته. وفي رواية عن أحمد أنه واجب، حكاها الفخر الرازي وشذّذه الزركشي، وقيل يُكره تركه؛ ونقل ابن قدامة الإجماع على أن من بدأ بيساره قبل يمينه لا إعادة عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}\n\nالخامس عشر: إطالة الغرة والتحجيل، وهي تجاوز موضع الفرض في غسل الوجه واليدين والرجلين. فالشافعية والحنابلة في الصحيح يرونها سنة؛ والحنفية يرونها من آداب الوضوء، وغايتها في الوجه غسل صفحة العنق مع مقدمات الرأس، وفي اليدين والرجلين استيعاب العضدين والساقين. والأصل حديث «غراً محجلين»، وهو عند الشافعية والحنابلة من خصائص هذه الأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} ومذهب المالكية ورواية عن أحمد أنها لا تندب، بل تُكره عند مالك لأنها من الغلو في الدين، وحملوا الإطالة في الحديث على إدامة الطهارة لا على زيادة الغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالسادس عشر: استقبال القبلة في الوضوء، فالحنفية والمالكية يرونه من آدابه ويقيدونه بالإمكان من غير مشقة، والشافعية والحنابلة يرونه من سننه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالسابع عشر: الجلوس في مكان مرتفع، وهو من آداب الوضوء عند الحنفية والمالكية، تحرّزاً عن الماء المستعمل وصونا للثياب من المتقاطر؛ ويسنّ عند الشافعية أن يتوقّى المتوضئ الرشاش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالثامن عشر: التوضؤ في مكان طاهر، وهو من المستحبات عند الحنفية والمالكية، ويكره عند المالكية الوضوء في بيت الخلاء لأنه ليس شأنه الطهارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}\n\nالتاسع عشر: ترك الاستعانة. الشافعية والحنابلة يرونه سنة، والحنفية من آداب الوضوء؛ واستعان النبي بالمغيرة بن شعبة في الصب، وصبّ صفوان بن عسال عليه الماء، وكان ترك الاستعانة أفضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} وفرّق الشافعية بين الاستعانة بالصب والاستعانة بإحضار الماء، فالثانية لا بأس بها، وتجب إذا لم يمكن التطهر إلا بها لعذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} وقال ابن مودود إن الاستعانة تكره إلا عند العجز، وفصّل ابن عابدين: الاستعانة بالصب أو الاستقاء أو الإحضار لا كراهة فيها، والاستعانة بالغسل والمسح مكروهة بلا عذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nالعشرون: مسح الرقبة، فالحنفية وأحمد في رواية يرونه من مستحبات الوضوء، وقيل سنة؛ والمالكية والشافعية والحنابلة في الصحيح لا يسنّونه لأنه لم يثبت فيه شيء، والنووي يرى أنه بدعة، والمالكية يرون أنه يُكره لأنه من الغلو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nالحادي والعشرون: تحريك الخاتم في الوضوء. الحنفية والشافعية يرونه من مستحبات الوضوء في الخاتم الواسع، وكذلك القرط، وفي الضيق إن علم وصول الماء، وإلا فهو فرض؛ وقال أحمد بن حنبل إن كان الخاتم ضيقاً فلا بد من تحريكه، وقد تُكمل تفاصيله في الصفحة التالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nالخاتم: إن وصل الماء تحته أجزأه، وروي أن النبي كان يحرّك خاتمه في الوضوء، ومن شك في وصول الماء وجب التحريك، لأن الأصل عدمه. وعند المالكية الخاتم المأذون فيه لا يجب نزعه أو تحريكه ولو كان ضيقاً، وغير المأذون فيه يجب نزعه إن كان حراماً، ويجزئ تحريكه إن كان واسعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nالثاني والعشرون: البدء بمقدم الأعضاء. يُسنّ عند الشافعية البدء بأعلى الوجه وأطراف الأصابع ومقدم الرأس، وعند الحنفية والمالكية يُستحب البدء في كل عضو بمقدمه، من منابت الشعر في الوجه، ومن أطراف الأصابع إلى المرفقين، ومن منابت الشعر إلى نقرة القفا، ومن الأصابع إلى الكعبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nالثالث والعشرون: عدم الكلام. يستحب عند الحنفية والشافعية ترك الكلام لغير حاجة، ويكره عند المالكية والحنابلة في الصحيح، وقال المالكية وابن مفلح إن الكراهة تكون بغير ذكر الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nالرابع والعشرون: السلام على المتوضئ وردّه. ذهب المالكية وبعض الشافعية وبعض الحنابلة إلى أنه يُشرع السلام على المتوضئ ويُشرع رده، وقال شيخ الإسلام من الشافعية إن الرد واجب. وقال الفروع إن ظاهر كلام أكثر الحنابلة لا يكره السلام ولا رده، وقال أبو الفرج وغيره من الحنابلة إنه يكره، وروى الكتاب حديث أم هانئ في سلامها على النبي وهو يغتسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}\n\nالخامس والعشرون: الدعاء عند كل عضو. ذهب الحنفية والمالكية وأكثر الشافعية وجماعة من الحنابلة إلى استحبابه، وذكر الكتاب الأدعية المأثورة عند كل عضو وهي معروفة عند القائلين بها، وأن ابن عابدين رأى أن الحديث الوارد فيها بلغ مرتبة الحسن بتعدد طرقه، والضعيف يُعمل به في فضائل الأعمال بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424} وذهب الشافعية في رأي والحنابلة على الأصح إلى أنه لا يُستحب، ونص الحنابلة على كراهته بمعنى ترك الأولى؛ وقال النووي إن دعاء الأعضاء لا أصل له، وقال ابن القيم إن الأذكار التي يقولها العامة عند كل عضو لا أصل لها عنه عليه الصلاة والسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}\n\nالسادس والعشرون: الدعاء بعد الوضوء. الشافعية والحنابلة يسنّون أن يقول المتوضئ بعد فراغه، مستقبلاً القبلة رافعاً يديه وبصره إلى السماء، الشهادتين، لحديث عمر بن الخطاب في أبواب الجنة الثمانية، ثم الدعاء المأثور بالتوبة والتطهر، ثم «سبحانك اللهم وبحمدك» لحديث أبي سعيد عند النسائي الموقوف عليه، والحنابلة والشافعية يقرأون سورة القدر ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} والحنفية والمالكية والشافعية يسنّون الصلاة على النبي بعد الوضوء، والحنفية والمالكية يزيدون الدعاء المأثور بعدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} وقال البهوتي إن الحكمة في ختم الوضوء بالاستغفار أن العباد مقصرون عن حقوق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426}\n\nالسابع والعشرون: تنشيف الأعضاء من بلل الوضوء. ذهب المالكية والحنابلة والشافعية في مقابل الأصح إلى الجواز، وعند الحنابلة ترك التنشيف أفضل، وعند الحنفية من آداب الوضوء التنشيف، وعند الشافعية في الأصح المسنون تركه إلا لعذر، والكراهة في قول عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426}\n\nالسابع والعشرون: ترك نفض اليد أو الماء. فالحنفية والشافعية في الأصح يستحبون ألا ينفض المتوضئ يده، لحديث «إذا توضأتم فلا تنفضوا أيديكم فإنها مراوح الشيطان»، وقال ابن حبان فيه إنه منكر؛ والحنابلة في الصحيح والشافعية في رأي يكرهون نفض الماء. وقال ابن قدامة إن نفض الماء عن البدن لا يُكره، ويُكره نفض اليد، وقال صاحب غاية المطلب إن الأصح عدم الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}\n\nالثامن والعشرون: الشرب من فضل ماء الوضوء. نص الحنفية والشافعية على استحبابه عقب الوضوء، لحديث علي في شرب النبي من فضل وضوئه، ويستحب أن يكون قائماً مستقبلاً عند الكمال، وقيل قاعداً، ويقال عقب الشرب دعاء مرويّ عن الفقهاء لم يقف عليه الكتاب مأثوراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nالتاسع: صلاة ركعتين عقب الوضوء. يستحبها الحنفية والشافعية والحنابلة، لحديث عقبة بن عامر في الجنة، والحنفية والحنابلة يصلونها في غير أوقات الكراهة، والشافعية يصلونها في الأوقات كلها لأن لها سبباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nالثلاثون: تجديد الوضوء، أي التوضؤ على وضوء قائم لم ينتقض. فقال بعض الفقهاء إنه سنة، وقال بعضهم مستحب، وقال بعضهم ممنوع قبل أن تُفعل به عبادة، وفي رواية عن أحمد لا فضل فيه؛ ويُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nالحادي والثلاثون: عدم نقص ماء الوضوء عن مُدّ. فالجمهور يستحبون ألا ينقص عن مد، لحديث أنس في وضوء النبي بالمد، والمالكية في المشهور والحنفية في قول يرون أن الماء لا يُحدّ بحد، وأن المقصود فضيلة الاقتصاد؛ ونقل ابن عابدين عن الحلية إجماعاً بأن ما يجزئ غير مقدّر، وقال ابن شعبان من المالكية إنه لا يجزئ أقل من مد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}\n\nالثاني والثلاثون: عدم النفخ في الماء حال غسل الوجه، وهو من آداب الوضوء عند الحنفية، وأن يتوضأ من متوضأ العامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}\n\nالثالث والثلاثون: الترتيب بين السنن. يُسنّ عند الحنفية والشافعية في المذهب ترتيب السنن فيما بينها، ويندب عند المالكية والحنفية في قول ترتيبها في أنفسها؛ ولو حصل تنكيس بين السنن أو بين السنن والفرائض لم تُطلب الإعادة، لأن المندوب إذا فات لا يؤمر بفعله. والشافعية في أحد الوجهين يوجبون الترتيب في المسنون قياساً على أركان الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}\n\nالرابع والثلاثون: أخذ الماء بيديه جميعاً عند غسل الوجه. فالشافعية في الصحيح يستحبون أن يأخذ الماء بيديه جميعاً، لحديث عبد الله بن زيد في إدخال اليدين، وفي قول لهم يأخذه بيده، وفي وجه ثالث لزاهر السرخسي يغرف بكفه اليمنى ويضع ظهرها على بطن اليسرى، لحديث ابن عباس؛ والحنابلة يذكرون أن الغرف بيديه جميعاً أو اليمنى مضمومة إليها الأخرى هو السنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nالمكروهات. عدّ الفقهاء أموراً من مكروهات الوضوء:\n\nأولاً: لطم الوجه وأعضاء الوضوء بالماء، وخص الوجه لشرفه، كراهة عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nثانياً: التقتير، أي أن يقتصر على ما يدهن الأعضاء بالماء دون أن يظهر التقاطر، وينبغي أن يكون التقاطر ظاهراً ليكون الغسل يقيناً في كل مرة من الثلاث، وهو مكروه عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nثالثاً: الإسراف في الماء، بأن يستعمل فوق الحاجة الشرعية، لحديث سعد مع عبد الله بن عمرو في أن الإسراف يكون في الوضوء ولو على نهر جارٍ، ولأنه من الغلو المفضي إلى الوسوسة، وحديث «لن يشادّ الدين أحد إلا غلبه»، ونص على كراهته الحنفية والمالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nوزاد الحنفية والشافعية أن الماء الموقوف على من يتطهر به، كماء المدارس، يحرم الإسراف فيه، لأن الزيادة غير مأذون فيها، وقيّده ابن عابدين بما ليس بجارٍ، أما الجاري فهو مباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}\n\nرابعاً: التوضؤ بفضل ماء المرأة، أي ما فضل عن طهارتها ولم تمسّه بشرب أو تُدخل يدها فيه بلا نية. فذهب بعض الحنفية وبعض الشافعية ورواية عن أحمد إلى كراهته مراعاةً للخلاف؛ وذهب بعض الحنفية ورواية عن أحمد والمالكية في المذهب وبعض الشافعية كالبغوي إلى أنه طاهر مطهّر لا يُكره، واستدلوا بحديث ابن عباس في غسل بعض أزواج النبي من جفنة، وأن الماء لا يجنب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432} وظاهر مذهب الحنابلة أنه لا يجوز للرجل التطهر بفضل طهور المرأة، لحديث الحكم بن عمرو الغفاري في نهي الرجل عن ذلك؛ وقال المرداوي إن المنع تعبدي لا يُعقل معناه، فيباح للمرأة وحدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nخامساً: تثليث المسح بماء جديد. الحنفية والمالكية يكرهونه، والحنابلة لا يستحبون تكرار مسح الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nسادساً: الوضوء في مكان نجس، فيكره، لأن للماء حرمة ولئلا يتطاير عليه شيء مما يتقاطر من الأعضاء؛ ونص الحنفية على كراهة إلقاء النخامة والامتخاط في الماء تنزيهاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nسابعاً: التوضؤ في المسجد. يكره إلا في إناء أو في موضع أعد لذلك عند الحنفية وأحمد في رواية ومالك؛ وقال الشافعية والحنابلة في الصحيح إنه يباح إذا لم يؤذ به أحداً ولم يؤذ المسجد؛ وقال سحنون لا يجوز التوضؤ بصحن المسجد، وروى الكتاب حديثاً في جعل المطاهر على أبواب المساجد، وأشار الهيثمي إلى انقطاع في سنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}\n\nثامناً: إراقة ماء الوضوء في المسجد. الحنابلة يكرهونها، ويكرهونها كذلك في موضع يُداس كالطريق، وقال الشافعية يجوز إسقاطه في أرض المسجد إذا لم يتأذَّ به الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}\n\nتاسعاً: الوضوء بالماء المشمس. فالمالكية في المعتمد والشافعية في المذهب وبعض الحنفية يكرهونه، وجمهور الحنفية والحنابلة والمالكية في قول وبعض الشافعية يجيزونه مطلقاً بلا كراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nعاشراً: ترك سنة من سنن الوضوء. نص المالكية على كراهة تركها عمداً مع عدم بطلان الصلاة بتركها، ويُسنّ فعلها لما يُستقبل من الصلاة بذلك الوضوء؛ والحنفية يرون ترك المندوب خلاف الأولى، ويعبّرون عنه بأنه مكروه تنزيهاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nنواقض الوضوء. عند الحنفية نقض الوضوء إخراجه عن إفادة المقصود منه كاستباحة الصلاة، وعند المالكية انتهاء حكمه أو رفع استمراره فيما كان يُباح به؛ وقد اختلف الفقهاء في بعضها واتفقوا على بعضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nأولاً: الخارج من السبيلين، وهو متفق عليه في الجملة، لقوله تعالى في آية المائدة وآية النساء، والغائط مجاز عن الحاجة التي تُقضى في المكان المطمئن، فلو جاء أحد من الغائط من غير حاجة لم يجب عليه الوضوء إجماعاً. وفصّل الفقهاء في المعتاد والنادر، وفي المخرج من الدبر أو الذكر أو الفرج أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nثانياً: خروج النجاسات من غير السبيلين. المالكية والشافعية يرون أنه غير ناقض، ويلزم تطهير موضع النجاسة ويبقى الوضوء؛ والحنفية والحنابلة يرون أن النجاسات الخارجة من سائر البدن كالقيء والدم ناقضة في الجملة مع اختلاف بينهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436}\n\nثالثاً: زوال العقل، بالنوم أو الجنون أو السكر أو الإغماء. أما النوم فجمهور الحنفية والمالكية والشافعية والحنابلة يرونه ناقضاً في الجملة، استناداً إلى حديث «العين وكاء السه، فمن نام فليتوضأ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} وتفصيل الحنفية في النائم: إن كان مضطجعاً أو متوركاً نقض، لاسترخاء المفاصل، وإن كان مستنداً إلى شيء لو أزيل عنه لسقط فيُنظر في حاله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436}\n\nالنوم حالاً حالاً عند الحنفية: إن كان النائم قائماً أو راكعاً أو ساجداً وكان مقعدته لا تزال عن الأرض لم ينتقض، وإن زالت مقعدته عن الأرض فينتقض بالإجماع إن كانت زائلة، وإن لم تزل ففيه روايتان: القدوري بالنقض، والزيلعي بعدم النقض وهو رواية أبي يوسف، والنائم في الصلاة لا ينتقض وضوؤه إذا كان كذلك، ومن نام خارج الصلاة على هيئة السجود ينقض إن لم يكن على هذه الهيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} والمريض إذا صلى مضطجعاً فنام ينتقض وضوؤه عند الزيلعي للحديث. ومن نام قاعداً فسقط على وجهه أو جنبه ينظر: إن انتبه قبل السقوط أو عند السقوط أو سقط نائماً فانتبه من ساعته لم ينتقض، وإن استقر بعد السقوط نائماً ثم انتبه انتقض؛ وعن أبي يوسف ينتقض بالسقوط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} وقال الحنفية إن النوم نفسه ليس حدثاً، وإنما الحدث ما لا يخلو عنه النائم، فأُقيم السبب الظاهر وهو النوم مقامه، كالسفر ونحوه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}\n\nالمالكية لهم طريقتان في اعتبار النوم ناقضاً: الأولى، طريقة اللخمي، وهي أن المعتبر صفة النوم لا هيئة النائم، فالنوم الثقيل ينقض أياً كانت الهيئة، وعلامته أن لا يشعر صاحبه بصوت مرتفع أو بسقوط مروحة من يده؛ والنوم غير الثقيل لا ينقض. والثانية أن النوم الثقيل ينقض على كل حال، وغير الثقيل ينقض في الاضطجاع والسجود دون القيام والجلوس، ونُسبت إلى عبد الحق، والأولى هي الأشهر عندهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}\n\nالشافعية يرون أن النوم ينقض كيفما كان إلا نوم المتمكن مقعدته من الأرض أو غيرها، فلا ينقض وإن استند إلى ما لو زال لسقط، لأمن خروج شيء من الدبر؛ ولا عبرة باحتمال خروج شيء من القبل لأنه نادر، واحتجوا بأثر أنس أن أصحاب النبي كانوا ينامون ثم يصلون ولا يتوضؤون، وحُمل على نوم المتمكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439} وذكر النووي فروعاً: يُستحب للنائم المتمكن أن يتوضأ احتياطاً؛ ولو تيقن النوم وشك هل كان متمكناً لم يجب الوضوء؛ ولو نام جالساً فزالت أليته قبل الانتباه انتقض، وإن زالت بعد الانتباه أو مع الانتباه أو لم يدر لم ينتقض، لأن الأصل الطهارة؛ ولا فرق بين القليل والكثير من النوم عندهم؛ والمحتبي فيه ثلاثة أوجه، والمختار أنه لا ينقض؛ والمضطجع على قفاه ينقض عند الأصحاب، ولو استثفر وتلجم فالمشهور النقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}\n\nالحنابلة يقسمون النوم إلى ثلاثة أقسام: نوم المضطجع، وهو ناقض يسيره وكثيره، ونوم القاعد، فإن كان كثيراً نقض وإن كان يسيراً لم ينقض، ونوم القائم والراكع والساجد؛ واستدلوا بعموم حديث «فإذا نامت العينان استطلق الوكاء» وبحديث صفوان بن عسال في الخفين. وعند أحمد روايات: في القائم والراكع والساجد المذهب النقض، والثانية لا ينقض إلا إذا كثر، والثالثة لا ينقض نوم الراكع وينقض نوم الساجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} أما القاعد المستند والمحتبي فهو كالمضطجع عند بعضهم، وعن أحمد أنه لا ينقض يسيره، ورأى الوضوء في الاحتباء والاتكاء والاستناد إلا أن يغفو قليلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} وقال ابن قدامة إن الأولى أن من كان معتمداً بمحل الحدث على الأرض لا ينقض منه إلا الكثير، لأن دليل انتفاء النقض في القاعد لا تفريق فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} واختلف الحنابلة في حد الكثير: فقال أبو يعلى لا حد له، وقيل هو ما يتغير به النائم عن هيئته كأن يسقط على الأرض أو يرى حلماً؛ وقال ابن قدامة إنه لا حد له لأن التحديد يُعرف بالتوقيف، فمتى وُجد ما يدل على الكثرة كسقوط المتمكن انتقض، وإن شك في كثرته لم ينتقض لأن الطهارة متيقنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} وقال ابن قدامة إن النوم غلبة على العقل، فمن لم تُغلب على عقله فلا وضوء عليه، ومن شك هل نام أو خطر بباله شيء لا يدري أرؤيا هو أم حديث نفس فلا وضوء عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441}\n\nالرأي الثاني: حُكي عن أبي موسى الأشعري وأبي مجلز وحميد الأعرج وعمرو بن دينار أن النوم لا ينقض الوضوء، واستدلوا بأثر أنس في انتظار العشاء حتى تخفق الرؤوس؛ ونقل المرداوي عن الميموني أنه لا ينقض. وكان سعيد بن المسيب ينام مراراً مضطجعاً ثم يصلي ولا يعيد الوضوء، ولعلهم ذهبوا إلى أن النوم ليس حدثاً في نفسه، والحدث مشكوك فيه، فلا يزول اليقين بالشك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441}\n\nالحنابلة في النوم: إن نام المتوضئ وهو يظن بقاء طهره لم ينتقض وضوؤه، وهو اختيار ابن تيمية؛ وقال الخلال إن هذه الرواية خطأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nثانياً: الإغماء والغشي ينقضان الوضوء باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} ثالثاً: الجنون، قليله وكثيره، ينقض باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} رابعاً: السكر ناقض باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nخامساً: مس فرج الآدمي، ذكراً كان أو أنثى أو خنثى، مختلف في نقض الوضوء به، وتفصيله في أبوابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} سادساً: التقاء بشرة الرجل والمرأة، مختلف فيه، وتفصيله في أبوابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nسابعاً: الردة. فالحنفية والشافعية في الأصح وجماعة من المالكية والحنابلة في رواية يرون الردة في ذاتها ليست من نواقض الوضوء، وإنما تحبط العمل إذا اتصلت بالموت، فمن ارتد وهو متوضئ ثم عاد إلى الإسلام لم ينتقض وضوؤه بالردة ذاتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} وقال المالكية في المعتمد والحنابلة في الصحيح والشافعية في وجه إن الردة تنقض الوضوء، واستدلوا بآية الزمر، وقالوا إن الخطاب للأمة لا للنبي، وروى موسى بن معاوية عن ابن القاسم ندب الوضوء من الردة. ومعنى الإحباط عند الصاوي في الثواب، وإنما وجب الوضوء على القول المعتمد لأن المرتد بعد توبته بمنزلة من بلغ حينئذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443}\n\nثامناً: القهقهة في الصلاة. فجمهور الفقهاء (المالكية والشافعية والحنابلة) يرون أنها لا تنقض الوضوء وتفسد الصلاة، واستحب الشافعية الوضوء منها؛ والحنفية، وهو ما روي عن الحسن والنخعي والثوري، يرون أن القهقهة في صلاة كاملة، وهي ما لها ركوع وسجود، تنقض الوضوء وتفسد الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443}\n\nتاسعاً: أكل ما مسته النار. قولان: الأول، وعليه جمهور العلماء وهو محكي عن أبي بكر وعمر وعثمان وعلي وابن مسعود وغيرهم، أنه لا يجب الوضوء منه، واحتجوا بحديث ابن عباس في أكل النبي كتف شاة ثم صلى ولم يتوضأ، وبحديث جابر أن آخر الأمرين ترك الوضوء مما غيرت النار، وبحديث «الوضوء مما يخرج وليس مما يدخل» وأعله ابن حجر بضعف رواته. والثاني، وعليه عمر بن عبد العزيز والحسن والزهري وأبو قلابة وأبو مجلز، أنه يجب، واستدلوا بحديث «توضأوا مما مست النار» في مسلم عن أبي هريرة وعائشة وزيد بن ثابت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17444}\n\nعاشراً: أكل لحم الجزور (الإبل). قولان، الأول: جمهور الفقهاء (الحنفية والمالكية والشافعية في الجديد والحنابلة في قول) أنه لا ينقض كسائر الأطعمة، وحكي عن جماعة من الصحابة، والمعنى عند الكاساني أن الحدث خروج النجس أو ما هو سبب خروجه ولم يوجد. والثاني، أنه يجب الوضوء من لحم الإبل خاصة سواء كان قليلاً أو كثيراً، نيئاً أو مطبوخاً، وهو قول الشافعي في القديم وإسحاق وابن خزيمة وابن المنذر وغيرهم، واحتجوا بحديث جابر بن سمرة في سؤال الرجل عن لحم الإبل وأن النبي أمره بالوضوء منه، وحديث البراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445} وللحنابلة تفصيل: فالمذهب أنه ينقض لحم الجزور سواء علمه أم جهله، نيئاً أو مطبوخاً؛ وعن أحمد ينقض نيئه دون مطبوخه، وعنه لا ينقض مطلقاً اختاره يوسف الجوزي وابن تيمية، وعنه إن علم النهي نقض وإلا فلا، اختاره الخلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} وبقية أجزاء الإبل كالسنام والدهن والكبد وغيرها لا تنقض على المذهب، وشرب لبن الإبل ومرق لحمها لا ينقض، وعن أحمد ينقض شرب لبنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nحادي عشر: أكل الطعام المحرم. عن أحمد روايات: ينقض الطعام المحرم، أو اللحم المحرم مطلقاً، أو لحم الخنزير فقط؛ والمذهب عند الحنابلة أنه لا ينقض أكل ما سوى لحم الإبل من اللحوم، لأن النقض بلحم الإبل تعبدي فلا يتعدى إلى غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nثاني عشر: غسل الميت. لم يذكره الجمهور في نواقض الوضوء، وقال الحنفية يستحب الوضوء بعد غسل الميت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}"
  en: "Wudu' (from wada'a, to be fair and clean) is the act, and the water used for it, in the lexical sense. The jurists define it: the Hanafis as washing and wiping specified members; the Malikis as a water purification of four members in a specific way; the Shafi'is as specific acts opened by intention; and the Hanbalis as using pure water on the four members in the prescribed way, in order and in succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}\n\nGhusl is washing the whole body in a specific way. Both wudu' and ghusl remove a ritual impurity, the minor and the major. Tahara is the wider term for removing impurity and removing its effect. Tayammum is wiping the face and hands with clean earth or sand in a specific way, and it serves for either impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}\n\nMost jurists hold that wudu' belongs to earlier revelations, and that what is peculiar to this community is its specific manner or the mark of wudu', the white marks on the limbs on the Day of Resurrection, citing accounts of the prophets and of Sarah and Jurayj. A Maliki view, the opposite of the sounder Shafi'i view, and some Hanafis hold that wudu' itself is peculiar to this community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367}\n\nWudu' was made obligatory in Mecca along with prayer; the preposition 'with' refers to place, not time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} Its legal basis is the Qur'an, the sunna and consensus. The verse of sura al-Ma'ida (cited by sura and aya) is taken by some as the proof of obligation, while most read it as addressed to those who are in a state of impurity when they rise to pray. The sunna includes the saying that no prayer is accepted without purity. The people of biography agree that it was made obligatory in Mecca through Gabriel's teaching, and the community agrees on its legality and obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} Denial of its obligation for prayer is disbelief; for other purposes, such as touching the mushaf, the Hanafis do not count it as disbelief, because the verse is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nWhoever deliberately leaves wudu' and prays in a state of impurity: the Hanafis say one who makes light of religion is a disbeliever, as in deliberately praying without wudu'; the Malikis say he is killed for abandoning purity like prayer; the Shafi'is say he is asked to repent and killed as a hadd punishment, not as disbelief; the Hanbalis say one who abandons an agreed condition or pillar is treated as one who abandons the act, and one who leaves prayer is called to it for three days and killed if he does not pray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nThe legal ruling varies with the purpose of wudu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nFirst, where wudu' is obligatory: for prayer, the jurists agree it is obligatory for one in a minor impurity who wishes to stand for an obligatory or a voluntary prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} The Hanafis require it for the funeral prayer, which they count as a prayer; the majority also require it for the prostration of recitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} For tawaf, the Malikis, Shafi'is and Hanbalis hold that it is obligatory for obligatory and voluntary tawaf; the Hanafis count it as necessary (wajib) and penalise: an obligatory tawaf in a minor impurity requires a sacrifice, and in a major impurity a camel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} For touching the mushaf, the majority hold it obligatory, citing the verse of sura al-Waqi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}\n\nSecond, where it is sunna: the Hanafis, Hanbalis and Shafi'is, other than al-Baghawi, hold that wudu' before sleep is sunna, on the hadith about lying down on the right side after wudu', reported in the two Sahihs as cited in the book's footnote. The Malikis call it recommended; one Maliki view is that for a junub before sleep it is sunna; another that it is obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}\n\nThird, where it is recommended: a wudu' that is not a condition for the validity of the act but part of its perfection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} It is recommended for reciting the Qur'an and reading hadith, for remembrance of God, for the call to prayer, and for the iqama (on which the jurists differ), for the sermon, for studying religious knowledge, for standing at 'Arafat and for the sa'y between Safa and Marwa, and for visiting the Prophet's mosque and his tomb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} The renewal of wudu' is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} For a junub, the Hanafis, Shafi'is and Hanbalis (the majority) recommend wudu' before eating, drinking, resuming intercourse and sleeping; the Malikis hold that the junub has no wudu' for eating, drinking or resuming intercourse, but washes his hands and his private parts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} The Hanafis also recommend keeping wudu' constant by renewing it whenever it is broken, and recommend it to leave a legal difference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}\n\nFourth, where it is permitted: the Malikis hold that the permitted wudu' is for cleanliness and cooling; Qadi Iyad mentions wudu' before entering rulers' presence or boarding a ship in danger, and says that it may be recommended; al-Hattab leans towards recommendation for all except cleanliness and cooling. Such a wudu' does not remove the impurity unless it is intended to. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nFifth, forbidden wudu': for the Malikis, renewing wudu' before an act of worship has been performed with it, or wudu' for a purpose for which it was not prescribed or permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nMerit of wudu': many hadiths on the removal of sins by it: purity is half of faith; the report from 'Uthman that whoever performs wudu' as the Prophet did has his earlier sins forgiven; the hadith of 'Umar on the eight gates of Paradise; and the hadith of Abu Hurayra on the radiant marks of the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376} The conditions of wudu' are of three kinds: conditions of obligation, of validity, and of both; the first of the conditions of obligation is intellect, since no address is made to one who lacks it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nThe required washing: the majority (Hanafis, Shafi'is and Hanbalis) hold that it is enough for water to flow over a limb, without rubbing; the Malikis and al-Muzani require rubbing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} For the Hanafis washing means pouring water so that it drips, even a single drop; Abu Yusuf accepts merely wetting the place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} For the Shafi'is washing means the limb being washed, whether by the worshipper, another person or no act at all, such as rain falling on it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}\n\nThe face is what is faced; its whole outer surface is washed. Its width runs between the ears, and its length from the hairline at the top of the head to the lower chin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} The Malikis and Hanbalis measure the length for a beardless man to the hairline and for a bearded man to the end of the beard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Hanging hair beyond the outline of the face: the Hanafis do not require it to be washed; the Shafi'is require the outer and inner surfaces to be washed if it is thin, and only the outer surface if it is thick, with one view requiring nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383}\n\nHair on the face: the Hanafis do not require washing the roots of thick eyebrow, moustache and beard hair because of hardship, but thin hair must be washed outside and inside to the skin. The Malikis require combing thin hair so that water reaches the skin, and say thick hair needs only outer washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384} The Shafi'is wash the eyelashes, eyebrows, moustache, sideburns and the hair of the lower lip outside and inside, and the same for a woman's or intersex person's facial hair; for a man's beard, thin hair is washed both sides and thick hair only outside, and where thin and thick hair are mixed the whole is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} The Hanbalis require washing the beard and any hair hanging beyond the outline of the face, and the thick hair of the moustache, eyebrows, lower lip and of a woman or intersex person; combing the beard is recommended, the hadith on the handful of water under the chin being cited in the book's footnote. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}\n\nThe eye: the lid margin is washed with the face; crust on the lid must be removed. The majority do not wash the inside of the eye with the face, because the Prophet did not do so and because hot or cold water may harm it; a report from Ahmad requires it when there is no harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} If the inside of the eye is soiled with impurity, the Malikis, Shafi'is and one Ahmad view require washing it, while the Hanafis and the Hanbali school excuse it in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}\n\nThe hairline growth (ghumum), the hair that falls below its usual place, is washed with the face up to the usual limit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} The temples (tahdhif), the thin hair between the sideburn and the receding hairline, are disputed: the majority of Shafi'is, a Maliki view and the Hanbali sounder view treat them as part of the head and not washed with the face; the Hanafis, another Maliki view, a Hanbali view and a Shafi'i view, which Ghazali and Rafi'i call the sounder, treat them as part of the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe white skin between the sideburn and the ear: the Shafi'is, the Hanbalis and the Hanafi view on which fatwas are given hold it is part of the face; a report from Abu Yusuf excludes it; the Malikis wash the skin level with the earlobe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe lips: the red part visible when the lips close naturally is washed; one Hanafi view says the lip follows the mouth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} Washing part of the head with the face is obligatory in the majority view, and the Shafi'is add part of the throat, the area under the chin and the ears, since what the obligation cannot be completed without is itself obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe sideburn is washed with the face. The Shafi'is wash the part of the nose exposed by an amputation; the Malikis wash the septum between the nostrils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388} The majority hold that the inside of the mouth and nose are not part of the face and need not be washed in wudu'; the Hanbalis hold that the mouth and nose are part of the face, so rinsing and snuffing water are required in both minor and major purification, citing a hadith in which the book notes al-Daraqutni judged the connection to be a mursal narration. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nThe temple (sudgh), the bald part and the receding hairlines: the majority hold these are part of the head, not the face; one Hanbali view holds the temple is part of the face. Al-Shirbini says it is recommended to wash them with the face because of the disagreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} The Malikis wash the folds of the forehead and any hollow of the eyelid if water can reach it by rubbing, and the rest falls away. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nThe ears: al-Zuhri included the ears in the face, citing a hadith about the face's creation. The majority reply that the ears are part of the head, citing the saying that the two ears belong to the head and the report that the Prophet wiped his ears with his head, and that the ears were attached to the face only because they neighbour it, as a thing takes the name of what adjoins it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nIf the hair is washed and the skin below it becomes visible afterwards, the Hanafis, the Maliki preferred view and the Hanbalis hold that nothing more is required and wudu' is not repeated, because the duty passed to the hair; the Shafi'is in the sounder view, one Maliki view and Ibn Jarir require washing the newly visible skin, by analogy with a foot showing above a wiped sock. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nThe second obligation: washing the hands to the elbows. It is a pillar and an obligation agreed by the Qur'an, by the report of Abu Hurayra describing the Prophet's wudu', and by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} The majority (the Malikis, Shafi'is, Hanbalis in the school view and the Hanafis except Zufar) hold that the elbows must be washed with the hands, whether 'to' in the verse means 'with' or marks a limit that is of the same kind as what it limits; they cite the hadith of 'Abbad al-Abdi describing the water running over the elbows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} Zufar, a Maliki view and a view of Ahmad hold that the elbow is not included, by analogy with night in the verse on the fast; a further Maliki view includes it as a precaution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391}\n\nIf part of the limb to be washed is cut off, the rest must be washed by agreement, on the hadith 'do what you can of what I order you' and because the easier is not dropped for the harder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} The rule for an arm cut at the elbow continues beyond p.17391 and is not yet read; this part of the headword is not complete.\n\nAmputation at the elbow: the jurists who require the elbow to be washed wash the place of the cut. The Hanafis, the Hanbali school, the Shafi'i sounder view and one Maliki view require washing the bone that is the upper end of the arm, because the two adjoining bones must be washed, and if one is absent the other is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} The Malikis and a Shafi'i view against the sounder require nothing at the cut, since the elbow belongs to the forearm and the cut has taken it; unless a part of the elbow is known to remain in the upper arm, in which case the place of the cut is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nAmputation above the elbow: the duty falls away because its place is gone, but the Shafis recommend washing what remains of the upper arm so the limb does not lack purity; if cut at the shoulder, washing the place of the cut with water is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nAn extra finger, hand or arm: the Hanafis, Malikis, Shafi'is and the Hanbali judge al-Qadi wash an extra finger or hand that grows in the place of obligation alongside the original. If it grows outside the place of obligation, such as at the shoulder or upper arm, most jurists wash the part that lies opposite the place of obligation, while the sounder Hanbali view requires nothing for a distinct extra growth outside that place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nNails and what is under them: the Hanafis, Shafi'is and Hanbalis require washing the nail even when long, because it is joined to the hand by creation and so falls within the name of the hand. The Malikis and one Hanbali view hold that a small dirt under the nail does not harm the wudu' even if it blocks the water, and al-Mardawi calls this the sounder view, because it is common, so the Prophet would have had to explain it if it were a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393} The Hanafi fatwas state that a remaining dot of dough or dry or wet clay at the root of the nail prevents validity, while dye from henna or dough does not; a long nail requires water to reach under it and a short one does not; nails that go beyond the fingertips must be washed by agreement. The book reports that some Hanafis distinguish town dwellers from villagers, and that al-Dabusi gave a fatwa of validity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} The Shafi'is require washing the hair on the hand, outside and inside, even if it is thick, and if it is so thick that the skin is not reached, the visible part only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} The Malikis, in their preferred view, require the washing of the spaces between the fingers, the joints and the fold of the fingertips; a ring that is permitted to a man or a woman need not be moved, though a forbidden ring must be removed, and a loose ring is moved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}\n\nAn extra hand: the Hanafis, Malikis, Shafi'is and Hanbalis require washing an extra hand that grows in the place of obligation. If it grows outside the place, the Hanafis, Shafi'is and a Hanbali view require washing what lies opposite the place of obligation; the Malikis require the whole if it has an elbow of its own. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} For the Hanafis, if a person has two hands, the one he uses to grasp is the original and is washed, while the other is extra; the Shafi'is require washing an extra hand that is not distinct from the original. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nA hanging fold of skin on the upper arm: the Hanafis and Shafi'is require washing only the part opposite the place of obligation, while the Hanbalis require washing a fold torn from the upper arm that hangs down the forearm, like an extra finger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} A fold of the forearm is washed in full by the jurists; if its head is joined to the upper arm, the part opposite the place of obligation is washed, and the part that moves away from the limb is washed on its underside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nThe third obligation: wiping the head. It is agreed to be a pillar or obligation, by the Qur'an, by the descriptions of the Prophet's wudu' including the report of 'Uthman, and by consensus. Wiping is passing a wet hand over the head without running water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} The questions about wiping the head begin here, starting with the amount that suffices, on which the jurists differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nWiping the head: the Malikis in their preferred view and the Hanbalis in the sounder view require wiping the whole head, skin and hair, from the usual hairline at the front to the nape's hollow, together with the hair of the temples; the bone that projects and belongs to the face is not wiped but washed with the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} Other Maliki views: Ashhab requires only half, one report has the forelock enough, Muhammad ibn Maslama requires two-thirds, and Abu al-Faraj a third, with the hand passed back under the hair for full coverage, the return being recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} The Hanbalis require wiping the whole outer head in the sounder view; a report from Ahmad allows most of it, the jurists disagreeing on how much is most; another allows the forelock, another any part without limit. Wiping the skin alone does not suffice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}\n\nThe Hanafis hold that wiping the head once above the ears is a pillar; the amount in the most famous view is a quarter of the head, which is the school's preferred view, with a report of the forelock and a third of three fingers' breadth, the last, which the Badai' calls the report of the principal books, and on which the Zahiriyya says fatwas are given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} The Shafi'is require any wiping of part of the skin or part of the hair within the outline of the head, and allow either skin or hair as the part; the head is what is raised and rises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nMethod: the Hanafi sounder view requires three fingers to wipe; one or two fingers do not suffice in the apparent view, while the index and thumb spread with the palm between them count as three. The Hanbalis allow any manner, with the hand or with an intervening cloth, in the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nHair that falls below the head: the Hanafis, Shafis and Hanbalis do not require wiping it; the Malikis require wiping the hair that hangs down, however long, as it is hair of the head. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nWashing the head instead of wiping: the majority allow it, as it is wiping and more; the Hanbalis in the sounder view require the hand to be passed over the head, while a report from Ahmad allows washing without passing the hand. The Hanafis, the sounder Maliki view and the Hanbalis hold that washing the head at the outset in place of wiping is disliked, since it contradicts what is commanded; some Malikis, a Shafi'i view and a Hanbali view deny that it suffices, since it is not called wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nShaving the hair after wudu': the majority hold that this does not affect it. The Hanafis hold that wudu' is not repeated, since wiping hair is not a substitute for wiping the skin. A Maliki view requires repeating the wiping after shaving, which al-Dasuqi calls weak; al-Tabari requires repetition too. Ibn Rajab reports that Ahmad recommended wetting the head with water after shaving without requiring it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nRepeating the wiping: the Hanafis, Malikis and Hanbalis hold it is done once, since repetition becomes washing, and the Hanbalis cite that most who described the Prophet's wudu' mention one wiping, a view Abu Dawud supports; the Shafi'is recommend three wipings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nBraided hair: for the Malikis, hair that is braided by itself need not be unbraided, however firm; hair braided with three threads must be unbraided, whatever its firmness; hair braided with fewer threads must be unbraided if firm. Al-Sawi notes that women may follow the Shafi'i or Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nWiping over a turban is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nThe fourth obligation: washing the feet to the ankles. There are four views. The first, held by the majority, is that washing the two feet is a pillar of wudu'. The jurists report consensus: Abd al-Rahman ibn Abi Layla reports that the Companions agreed on washing the feet, al-Mawardi says the majority of jurists hold washing and not wiping, and al-Nawawi reports that Muslims agreed on the obligation to wash the feet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}\n\nThe second view is that the obligation is wiping and not washing, attributed to 'Ali, Ibn 'Abbas, Anas and al-Sha'bi, who relied on the genitive reading of the word for feet in the verse of sura al-Ma'ida. It is recorded that 'Ali retracted this, ordering the feet washed; Ibn Qudama says no jurist, other than those named, held the view of wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nThe third view, of al-Hasan al-Basri, al-Jubba'i and one report from al-Tabari, is that the worshipper may choose between washing and wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} The fourth, held by some Zahiris, is that washing and wiping must both be done, since the two readings in one verse count as two verses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nThe majority require the ankles to be included in the washing; only Zufar disagreed. The ankles are the two bones that project at the foot of the leg. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nSecond, the disputed obligations of wudu'.\n\nFirst, intention: the majority hold it is a condition without which wudu' is not valid; some hold it a recommendation and others a pillar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nAbandoning the intention: if the worshipper abandons the intention after finishing wudu', the Malikis, the sounder Shafi'i view and the sounder Hanbali view hold that it does not affect the wudu'; the other Hanbali view holds that it is void. If he abandons it during wudu', the Shafi'is in the sounder view say it is not void and he renews the intention for the rest, the Hanbalis in the sounder view say what has passed is void and he must begin again, and the Malikis in the preferred view do not excuse the abandonment, so it is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nSecond, continuity (muwala): washing the limbs in succession, so that the first does not dry before the next is begun. The Hanafis, the new Shafi'i view, one Maliki view and a Hanbali report hold it recommended, a view of Ibn 'Umar, al-Hasan, Sa'id ibn al-Musayyab and al-Thawri. The Malikis in the preferred view, the old Shafi'i view and the Hanbali school hold it obligatory, a view of 'Umar ibn al-Khattab and al-Awza'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nThird, order (tartib) in washing and wiping: the Shafi'is, the Hanbali school and one Maliki view hold it a pillar, a view of 'Uthman, Ibn 'Abbas, Qatada, Abu Thawr, Abu 'Ubayd and Ishaq. They argue from the verse, in which the wiping lies between the two washings, and that every account of the Prophet's wudu' gives the order. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405} The Hanafis, the preferred Maliki view, some Shafi'is and one Ahmad report hold the order is a sunna, a view of Ibn Mas'ud and others, arguing that the verse uses 'and' which does not imply order and that a single immersion lifts the impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nFourth, rubbing (dalk): for the Malikis it is passing the hand over the limb moderately, whether or not dirt is removed, even after water is poured and before it dries. The majority of Hanafis, Shafi'is and Hanbalis, and one Maliki view, hold it a sunna, and the Shafi'is add that one should be thorough with the heels, especially in winter, citing the saying woe to the heels from the Fire. The preferred Maliki view makes it an obligation, citing a saying to Aisha to rub her body with her hand, a report which the book notes is not traced to a source.\n\nRubbing (dalk): the Malikis hold three views. The preferred view makes it obligatory, because it is a condition of the name of washing, and its advocates cite the instruction to 'A'isha to rub her body; the second, from Ibn 'Abd al-Hakam, holds it is not obligatory, since the name of washing is met without it; the third holds it obligatory not in itself but to make sure the water reaches the skin, so that one who is sure the water has reached it after a long stay is excused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}\n\nThe sunnas of wudu'.\n\nFirst, the basmala at the beginning. The majority of Hanafis and Shafi'is, and one Ahmad report, make it a sunna; the preferred Maliki view makes it recommended, another Maliki view disapproves; the Hanbalis make it obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} For the Hanafis any remembrance of God suffices, but the words reported from the Prophet and the Salaf are 'In the name of God the Mighty, and praise belongs to God for Islam', while some prefer the full basmala; the Shafi'is say the least is 'In the name of God' and the most complete is the full formula with praise for Islam and for the water being pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} The Hanbalis require the words 'In the name of God' and no other phrase suffices, in the most common view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} The Hanafis count the basmala at each limb as a courtesy, and cite a report from al-Bara' ibn 'Azib about the two testimonies at each limb; al-Ayni calls its chain weak. The Hanbali school view does not recommend it at each limb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nSecond, washing the hands to the wrists at the beginning, which is a sunna following the Prophet's practice; if the hands are impure, washing them is obligatory by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nThird, rinsing the mouth: the majority hold it a sunna, and the Hanbalis obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nFourth, snuffing water into the nose: the majority hold it a sunna, and the Hanbalis a pillar or an obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nFifth, blowing the nose out, a sunna for the four schools, on the hadith 'when you snuff, blow'. For the Malikis it is expelling water from the nose by breath with the index and thumb of the left hand placed on it; for the Shafi'is it is removing what is in the nose with the little finger of the left hand; the Hanbalis recommend doing it with the left hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nSixth, wiping the whole head. The Malikis in the preferred view and the Hanbalis make it obligatory, as already stated, while the Hanafis and Shafi'is make it a sunna. The Hanafis cite a report of wiping the whole head and the report of the Prophet wiping the forelock, so wiping a quarter is the obligation and wiping the whole is the sunna; they say that one who persistently leaves out wiping the whole head without excuse sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} The Shafi'is recommend wiping the whole head to follow the practice and to leave the disagreement of those who require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nQuestions on wiping the head: first, repetition. The Hanafis hold that the whole head is wiped once with one water, and the reports of three wipings are taken to mean wiping with one water; al-Hasan reports from Abu Hanifa that three wipings with one water are sunna. Three wipings with fresh water are, in the Hanafi views, disliked, a bid'a, or permitted; the book quotes Ibn 'Abidin's preference for disliking it. The Shafi'is recommend wiping the whole head three times, one wiping after another, and a wiping of part of the head three times counts as three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nSecond, the recommended manner. The Hanafi preferred view is to place both palms and the fingers at the front of the head and draw them back to the nape, wiping the whole head, and then to wipe the ears with two fingers, the ears being part of the head. The Shafi'is say the sunna is to place the hands on the front of the head with the index finger joined to the other, the thumbs on the temples, to draw them back to the nape and bring them back to the place they started, where there is hair that turns; a person with no such hair only draws them back. The Hanbalis say repeating the wiping of the head is not recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nThe sunnas of wiping the head: the wiper returns the hands to where he began. al-Tirmidhi reports the account of Abu Hayya of 'Ali's wudu', in which the head is wiped once, and Abu Dawud reports that Ibn 'Abbas saw the Prophet wipe his head and ears with one wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} Ahmad recommends repeating the wiping with fresh water, a view supported by Abu al-Khattab and Ibn al-Jawzi, and the same for the ears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} The Malikis count as a sunna the return of the hand over the head to its starting point, since long hair cannot be covered without it. The return is a sunna only if wetness from the obligatory wiping remains on the hand, and renewing the water for it is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}\n\nThe manner of wiping the head: the Malikis and Shafi'is take water in the right hand and pour it on the left palm, begin at the front, join the fingertips and place the thumbs at the temples, draw the hands back to the nape and return them to the start. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} For the Hanbalis the recommended manner is to draw the hands from front to back and return them to the start, following the report of 'Abd Allah ibn Zayd; then the index fingers enter the ear openings and the thumbs wipe the outer ears. A man with hair that would be ruffled by the return does not return, following the report of al-Rubay' bint Mu'awwidh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Ahmad, asked how a woman wipes, described the same motion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}\n\nSeventh, wiping the ears. The Hanafis, the preferred Maliki view and the Shafi'is hold that wiping both the outer and inner ear is a sunna, on the hadith of al-Miqdam ibn Ma'di Karib describing the wiping of the ears and the insertion of the fingers into the ear openings. The majority take the outer ear as the part next to the head and the inner ear as the part facing outwards; a Maliki view reverses this, and the Malikis say the ear is made like a rose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} The Malikis count three sunnas for the ears: wiping the outer and inner parts, wiping the openings, and renewing the water for them. The Shafi'is recommend fresh water for the ears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} The Hanbalis and some Malikis make the wiping of the ears obligatory, because they belong to the head; they recommend fresh water for them after wiping the head, and the white skin above the ears is part of the head and is wiped with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} The Hanbali recommended method is to put the index fingers in the openings and wipe the outer ears with the thumbs, and the cartilaginous parts within are not required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} The Hanafis hold that wiping the whole head and both ears with one water suffices, since they are part of the head; their preferred manner is the one described above, and wiping the ears with the damp remains is enough, while fresh water is better to satisfy the disagreement; they recommend putting the wet little finger into the ear opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nEighth, combing the beard and the hair of the face is recommended in the main, with the disagreement treated under washing the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nNinth, passing the fingers between the fingers of the hands and feet is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nTenth, repeating each washing three times is a sunna among the jurists; the hadiths vary: once, with the statement that this is the wudu' without which prayer is not accepted; twice, with the statement that it doubles the reward; and three times, with the statement that it is his wudu' and that of the prophets. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nEleventh, the miswak. The majority hold that using the miswak is a sunna in wudu', citing the saying that had it not been a hardship on his community he would have ordered the miswak with every wudu'. The Hanafis call it a strongly confirmed sunna; the Malikis, in their preferred view, a recommendation; al-Dasuqi notes that the hadith suggests a sunna even against the preferred view. Its detailed rules are under their own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nTwelfth, the wiping over the turban is disputed and is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nThirteenth, not wasting water, which is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}\n\nFourteenth, starting with the right side of the hands and feet. The Hanafis, Malikis and the sounder Hanbali view hold it recommended, citing the report of 'A'isha that the Prophet liked to start on the right in all his affairs, and the accounts of 'Uthman and 'Ali describing that he began with the right before the left. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417} The Shafi'is and some Hanafis hold it a sunna, on the saying that when you perform wudu' you begin with your right sides; Ibn al-Hammam says it is a sunna because of his constant practice. One Hanbali report, cited by al-Razi and rejected by al-Zarkashi, makes it obligatory; another says leaving it is disliked. Ibn Qudama reports consensus that one who begins with the left need not repeat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}\n\nFifteenth, prolonging the bright marks (ghurra and tahjil): the Shafi'is and the sounder Hanbali view hold it a sunna, meaning washing beyond the obligatory place of the face, hands and feet. The Hanafis count it as a courtesy: for the face it reaches the side of the neck with the front of the head, and for the arms and legs it reaches the upper arm and the shin. The basis is the saying about the community being called radiant with white marks from the wudu'; the Shafis and Hanbalis hold this to be a feature peculiar to this community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} The Malikis and one Hanbali report do not recommend it, and Malik regards it as disliked, as an excess in religion; they read the 'prolonging' in the saying as continuing the state of purity, not as extra washing. Al-Dasuqi distinguishes the two senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nSixteenth, facing the qibla while performing wudu': the Hanafis and Malikis hold it a courtesy, limited by what is possible without hardship; the Shafi'is and Hanbalis hold it a sunna, as it is suitable for every act of worship unless there is a reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nSeventeenth, sitting in a raised place, a courtesy for the Hanafis and Malikis, to keep clear of the water used in wudu' and to protect clothes from dripping; the Shafi'is recommend avoiding the spray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nEighteenth, performing wudu' in a clean place, a recommendation for the Hanafis and Malikis. The Malikis dislike wudu' in a lavatory, because such a place is not for purity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}\n\nNineteenth, not seeking help. The Shafi'is and Hanbalis hold it a sunna; the Hanafis count it a courtesy. The Prophet was helped by al-Mughira ibn Shu'ba in pouring water, and Safwan ibn 'Assal poured water on him, but not seeking help is better. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} The Shafi'is distinguish helping with the pouring, which is disliked but not sinful, from helping by bringing water, which is allowed, and it is obligatory when the person cannot purify himself otherwise, for a reason such as illness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} Ibn Mawdud says help is disliked except when one is unable; Ibn 'Abidin says help in pouring, drawing or fetching water is not disliked at all, while help in washing or wiping is disliked without a reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nTwentieth, wiping the neck: the Hanafis and one Ahmad report count it a recommendation, and some say it is a sunna. The Malikis, Shafi'is and the sounder Hanbali view do not recommend it, since nothing is reported for it; al-Nawawi calls it an innovation, and the Malikis say it is disliked as an excess in religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nTwenty-first, moving the ring in wudu': the Hanafis and Shafis recommend moving a loose ring, and likewise an earring; for a tight ring it is recommended if water is known to reach, and obligatory if not. Ahmad ibn Hanbal says a tight ring must be moved, and the details continue on the next page. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nThe ring: if water reaches beneath it the wudu' is valid; the Prophet is reported to have turned his ring in wudu', and if one doubts whether water reaches under it, moving it is required, since the default is that it does not. For the Malikis a permitted ring need not be removed or moved even if tight; a forbidden ring must be removed if it is forbidden to wear, and moving it is enough if it is loose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nTwenty-second, starting with the front of each limb. The Shafi'is recommend beginning with the top of the face, the fingertips and the front of the head. The Hanafis and Malikis recommend beginning each limb at its front: the face at the hairline, the hands at the fingertips up to the elbows, the head at the hairline to the hollow of the nape, and the foot at the toes to the ankles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nTwenty-third, not speaking. The Hanafis and Shafi'is recommend silence without need; the Malikis and the sounder Hanbali view call speech disliked, and the Malikis and Ibn Muflih say the dislike applies to speech other than the remembrance of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nTwenty-fourth, greeting the one performing wudu' and returning the greeting. The Malikis, some Shafi'is and some Hanbalis hold that greeting him is prescribed and that the reply is prescribed too; the Shafi'i Shaykh al-Islam says the reply is obligatory. The Furu' says most Hanbali texts do not dislike either greeting or reply, while Abu al-Faraj and others say greeting is disliked. The book cites the report of Umm Hani, who greeted the Prophet while he was washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}\n\nTwenty-fifth, supplication at each limb. The Hanafis, Malikis, most Shafi'is and some Hanbalis recommend it. The book lists the traditional formulae for each limb; al-Ayni's view, cited with Ibn 'Abidin, is that the report reached the grade of good through its several chains, and that a weak report may be acted on in matters of virtue on conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424} The Shafi'i view in one form and the sounder Hanbali view deny that it is recommended; the Hanbalis call it disliked in the sense of leaving the better; al-Nawawi says supplication at each limb has no basis, and Ibn al-Qayyim says the formulae popular with the common people for each limb have no origin in the Prophet's practice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}\n\nTwenty-sixth, supplication after wudu'. The Shafi'is and Hanbalis recommend that the performer, facing the qibla with his hands and eyes raised to the sky, says the testimony of faith, then the words from the report of 'Umar about the eight gates of Paradise, then the words that Tirmidhi adds to Muslim's report, then 'Glory be to You, O God, and praise, I testify there is no god but You, I ask Your forgiveness and turn to You', from the report of Abu Sa'id in al-Nasa'i which al-Nasa'i judged to be an account of Abu Sa'id's own words. The Shafi'is and Hanbalis also recite the surah of Power three times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} The Hanafis, Malikis and Shafi'is recommend blessing the Prophet after wudu', and the Hanafis and Malikis add a formula about being among the penitent and the purified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} Al-Buhuti explains that ending wudu' and prayer with seeking forgiveness recognises that people fall short of God's due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426}\n\nTwenty-seventh, drying the limbs. The Malikis, Hanbalis and the older Shafi'i view allow drying or leaving it. The Hanbalis say leaving it is better; the Hanafis count drying as a courtesy; the sounder Shafi'i view makes leaving it the sunna unless there is an excuse, since drying removes the trace of worship. The Hanafis and a Shafi'i view hold that drying is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426}\n\nTwenty-seventh, not shaking off the hand or the water. The Hanafis and the sounder Shafi'i view recommend not shaking the hand, on the hadith 'when you perform wudu' do not shake your hands, for they are the fans of Satan', which Ibn Hibban judged a rejected report. The sounder Hanbali view and one Shafi'i view dislike shaking off water. Ibn Qudama says that shaking water off the body is not disliked, though shaking the hand is; the author of Ghayat al-Matlab holds the sounder view is that it is not disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}\n\nTwenty-eighth, drinking the water left over from wudu'. The Hanafis and Shafi'is recommend it straight after the wudu', on the report from 'Ali that the Prophet drank from his leftover wudu' water; the perfect form is to drink standing, facing the qibla, and some say sitting is allowed. A supplication for health is said after drinking, which the book notes is not traced as transmitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nTwenty-ninth, two rak'as after wudu'. The Hanafis, Shafi'is and Hanbalis recommend them, on the saying of 'Uqba ibn 'Amir about the Garden for one who performs wudu' well and then prays two rak'as with heart and face attending. The Hanafis and Hanbalis pray them outside the times of disliked prayer; the Shafi'is hold they may be prayed at any time, since they have a cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nThirtieth, renewing wudu', that is, performing wudu' over a wudu' that has not been broken. Some jurists call it a sunna, some a recommendation, some forbid it before an act of worship is done with it, and one report from Ahmad says it has no merit; the details are under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nThirty-first, not using less than a mudd of water. The majority recommend not going below a mudd, on the report of Anas that the Prophet performed wudu' with a mudd. The Malikis in their most common view and a Hanafi view hold that no fixed measure applies, the aim being the virtue of moderation; Ibn 'Abidin reports from al-Hilya that several scholars report consensus that the amount needed is not fixed. Ibn Shaban of the Malikis says less than a mudd does not suffice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}\n\nThirty-second, not blowing into the water while washing the face, which the Hanafis count among the courtesies of wudu', and performing wudu' from the water of the common people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}\n\nThirty-third, the order among the sunnas. The Hanafi and Shafi'i school views make the order among the sunnas a sunna, while the Malikis and a Hanafi view make the order within each sunna recommended. If the order is reversed among sunnas, or between sunnas and obligations, no repetition is required, since a missed recommended act is not commanded again. One Shafi'i view makes the order of the recommended parts obligatory, by analogy with the pillars of prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}\n\nThirty-fourth, taking water in both hands for washing the face. The sounder Shafi'i view, stated in al-Muzani's Mukhtasar and held by most Shafi'is, is that the recommended manner is to take water in both hands, on the report of 'Abd Allah ibn Zayd that the Prophet put his hands in and washed his face three times, and because it is more complete. A Shafi'i view says one hand; a third view of Zahir al-Sarakhsi says to scoop with the right hand, placing its back on the palm of the left, on the report of Ibn 'Abbas. The Hanbalis say that scooping with both hands, or with the right hand joined to the left, is the established sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nThe disliked acts (makruhat). The jurists list several things as disliked in wudu'.\n\nFirst, striking the face or the other limbs with water, the face being singled out for its honour; disliked for the Hanafis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nSecond, stinginess, that is, using only enough water to moisten the limbs without visible dripping; the water should drip so that each of the three washings is certain; disliked for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nThird, extravagance, using more water than the legal need, on the report of Sa'd, whom the Prophet passed while he was performing wudu' and asked whether there was extravagance in wudu'; the reply was yes, even by a flowing river; and because it is the excess that leads to scrupulosity, and the saying that no one overdoes religion without being overcome by it. The Hanafis, Malikis, Shafi'is and Hanbalis all dislike it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nAmong the disliked acts, the Hanafis and Shafi'is add that water endowed for those who purify with it, such as the water of a madrasa, is forbidden to waste, since the excess is not permitted, the endowment being for the proper wudu'. Ibn 'Abidin limits this to still water; running water is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}\n\nFourth, performing wudu' with the water left by a woman, meaning the water left after her purification, without her having drunk from it or put her hand in it without intention. Some Hanafis, some Shafi'is and one report of Ahmad dislike it out of regard for the disagreement. Some Hanafis, one report of Ahmad, the Maliki school view and some Shafi'is, including al-Baghawi, hold that it is pure and purifying, and that using it is not disliked; they cite the report of Ibn 'Abbas about a wife of the Prophet washing from a basin, and the saying that water does not become impure by a state of major impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432} The apparent Hanbali school view forbids a man to purify with the leftover water of a woman, on the hadith of al-Hakam ibn 'Amr al-Ghifari; al-Mardawi says this prohibition is an act of worship whose meaning is not understood, so it is permitted to the woman herself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nFifth, wiping the head three times with fresh water: the Hanafis and Malikis dislike it, and the Hanbali school does not recommend repeating the wiping of the head. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nSixth, performing wudu' in an impure place, which is disliked because water used in wudu' is to be respected, and so that nothing dripping from the limbs falls on what is impure. The Hanafis add that throwing phlegm into the water or blowing the nose into it is disliked for purity's sake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nSeventh, wudu' in the mosque. It is disliked except in a vessel or a place prepared for it, according to the Hanafis, a report of Ahmad and Malik; the Shafi'is and the sounder Hanbali view allow it provided no one is harmed and the mosque is not harmed. Sahnun says wudu' in the courtyard of a mosque is not allowed. The book cites the hadith to place purification places at the mosque doors, and al-Haythami notes a break in its chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}\n\nEighth, pouring out the water of wudu' in the mosque. The Hanbalis dislike it, and dislike it in a place trodden on, such as the road. The Shafi'is allow letting it fall on the mosque floor if no one is harmed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}\n\nNinth, wudu' with water heated by the sun. The preferred Maliki view, the Shafi'i school view and some Hanafis dislike it; the majority of Hanafis, the Hanbalis, one Maliki view and some Shafi'is allow it without dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nTenth, leaving one of the sunnas of wudu'. The Malikis say it is disliked to leave one deliberately, though prayer is not invalidated by leaving it; if it is left deliberately or forgetfully, it is recommended to perform it for the prayers that follow with that wudu'. The Hanafis regard leaving a recommended act as contrary to the better course, and some call it disliked for purity's sake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nThe things that break wudu'. For the Hanafis, breaking wudu' means taking it out of its purpose, such as permission to pray; for the Malikis, it is the ending of its ruling or the lifting of its continuance for what it permitted, such as prayer. The jurists differ on some of these and agree on others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nFirst, what comes out of the two passages, agreed in general, citing the verses of sura al-Ma'ida and sura al-Nisa'. The word 'gha'it' is a figure for the need to relieve oneself in a sunken place. If someone comes from the place without need, wudu' is not obligatory, by consensus. The jurists distinguish customary from rare emissions, and emissions from the rear passage, the front passage, the wife's passage, or other places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nSecond, impurities leaving other parts of the body. The Malikis and Shafi'is hold that these do not break wudu'; only the place they touch is cleansed. The Hanafis and Hanbalis hold that such impurities, like vomit and blood, break wudu' in general, with differences among them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436}\n\nThird, loss of the mind, through sleep, madness, intoxication or fainting. Sleep is held by the majority of Hanafis, Malikis, Shafi'is and Hanbalis to break wudu' in general, on the hadith that the eyes are the binding of the buttocks, so whoever sleeps must perform wudu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} The Hanafi distinction: a sleeper who lies down or leans on his side breaks it, because the joints go loose, while one who leans on something that would fall if it were removed is to be examined. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436}\n\nSleep, in the Hanafi analysis. If the sleeper is standing, bowing or prostrating and his seat is not off the ground, wudu' is not broken; if his seat has left the ground, it is broken by consensus. If the seat is off the ground but the sleeper has not left it entirely, al-Qaduri says it breaks, the Hanafi view attributed to al-Tahawi, while al-Zayla'i says the sounder view is that it does not, a report of Abu Yusuf from Abu Hanifa. A sleeper in prayer does not lose his wudu' in these cases; one who sleeps outside prayer in the posture of prostration breaks it unless he is in that posture as described. A sick person who prays lying down and falls asleep breaks his wudu', on al-Zayla'i's view, by the hadith on lying down. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} If one sleeps sitting and falls over onto his face or side: if he wakes before falling, or wakes at the moment of the fall, or fell asleep and awoke at once, wudu' is not broken; if he settled after the fall and then woke, it is broken, for he slept reclining; Abu Yusuf says the fall itself breaks it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} The Hanafis say sleep is not itself a cause of impurity; the cause is what the sleeper does not avoid, and the apparent sign, sleep, stands in its place, as travel does in another rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}\n\nThe Malikis have two methods. The first, that of al-Lakhmi, is that the quality of the sleep counts and not the posture: heavy sleep breaks wudu' in any posture, and its sign is that the sleeper is not roused by a loud sound or by a fan falling from his hand; sleep that is not heavy does not break it. The second method makes heavy sleep break in all cases and light sleep break only when lying or prostrate, not standing or sitting; it is attributed to 'Abd al-Haqq. The first is the better-known Maliki view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}\n\nThe Shafi'is hold that sleep breaks wudu' in any form except the sleep of one who is firmly seated on the ground or another firm seat, even if he leans on something that would fall if it were removed, because no emission from the rear passage is then likely. The emission from the front passage is not considered, as it is rare, and the report of Anas that the Companions slept and then prayed without renewing wudu' is read as the sleep of the firmly seated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439} Al-Nawawi gives rules: it is recommended for a firmly seated sleeper to renew his wudu' as a precaution; if one is sure he slept but unsure whether he was seated firmly, no wudu' is due; if one slept sitting and his buttocks left the ground before waking, wudu' is broken, but if they left after he woke or at the same time, or it is not known which came first, it is not broken, since the default is purity. There is no difference between little and much sleep. A sleeper crouched with knees raised has three views, and the preferred is that it does not break. One who sleeps on his back with his buttocks flat is held to break wudu', and if he is strapped in place the well-known view is that it still breaks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}\n\nThe Hanbalis divide sleep into three kinds. The sleep of one who lies down breaks wudu', little or much, on the view of all who hold sleep breaks it. The sleep of one who sits breaks it if much, not if little. The sleep of one standing, bowing or prostrating: Ahmad has three reports, the school view being that it breaks, the second that it breaks only if much, and the third that the bowing does not break while the prostration does. They cite the general wording of the hadith on the eyes as the binding of the buttocks and the hadith 'whoever sleeps should perform wudu''; and for the sitter they cite Safwan ibn 'Assal on not removing socks during travel except after impurity, excrement, urine or sleep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} The seated sitter who leans, or sits crouched, is treated as one who lies down in one view, while Ahmad says light sleep does not break it, and he regards leaning and reclining as more severe than crouching. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} Ibn Qudama holds that a sitter whose seat is firmly on the ground breaks wudu' only through much sleep, since the evidence for the sitter makes no distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} The Hanbalis differ on how much sleep counts. Abu Ya'la says there is no fixed measure and it is what custom reckons. Another view makes it what changes the sleeper from his posture, as when he falls or dreams. Ibn Qudama says there is no fixed measure, since measures are known only from revelation; so whatever shows much sleep, such as the fall of a firmly seated sleeper, breaks wudu', and if one is in doubt whether it was much, it does not break, since purity is certain. He adds that sleep is an overcoming of the mind, so one whose mind is not overcome needs no wudu', and one who doubts whether he slept, or has a thought of uncertain origin, a dream or a passing thought, needs none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441}\n\nSecond view: Abu Musa al-Ash'ari, Abu Mijlaz, Humayd al-A'raj and 'Amr ibn Dinar are reported to hold that sleep does not break wudu' at all, citing the report of Anas about the Companions waiting for the late evening prayer until their heads nodded. Al-Mardawi cites al-Maymuni that it does not break. Sa'id ibn al-Musayyab used to sleep lying down several times while waiting for prayer and then pray without renewing his wudu'. Ibn Qudama suggests they held that sleep is not itself an impurity and that the impurity is doubtful, so certainty is not removed by doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441}\n\nThe Hanbalis on sleep: one who sleeps while he believes his purity remains does not lose it; Ibn Taymiyya chose this view, while al-Khallal called that report an error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nSecond, fainting and swooning break wudu' by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Third, madness, little or much, breaks it by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Fourth, intoxication breaks it by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nFifth, touching the private part of an adult, male, female or intersex, is disputed as a breaker; its detail is under its own headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Sixth, the touching of the skin of a man and a woman is disputed; its detail is under its own headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nSeventh, apostasy. The Hanafis, the sounder Shafi'i view, a group of Malikis and a Hanbali report hold that apostasy in itself does not break wudu', but nullifies deeds if it is joined to death; so one who apostatised while in wudu' and then returned to Islam keeps his wudu' if nothing else broke it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} The preferred Maliki view, the sounder Hanbali view and a Shafi'i view hold that apostasy breaks wudu', citing the verse of sura al-Zumar on the nullification of works, and holding that the address is to the community and not to the Prophet, while a report from Musa ibn Mu'awiya from Ibn al-Qasim recommends wudu' after apostasy. Al-Sawi explains that the nullification is of the reward, and that wudu' becomes due on the preferred view because the returning apostate is in the position of one who has just reached maturity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443}\n\nEighth, laughing aloud in prayer. The majority (Malikis, Shafi'is and Hanbalis) hold that it does not break wudu' but invalidates the prayer; the Shafi'is recommend wudu' after it. The Hanafis, and what is reported from al-Hasan, al-Nakha'i and al-Thawri, hold that laughing aloud in a full prayer, meaning one with bowing and prostration, breaks wudu' and invalidates the prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443}\n\nNinth, eating what fire has touched. There are two views. The first, held by the majority and reported from Abu Bakr, 'Umar, 'Uthman, 'Ali, Ibn Mas'ud and others, is that it does not require wudu'. They cite the report of Ibn 'Abbas that the Prophet ate a shoulder of mutton and prayed without wudu', the report of Jabir that the last of the two matters was leaving wudu' after what fire had changed, and the saying that wudu' is for what comes out and not for what goes in, which Ibn Hajar judges weak in its chains. The second, held by 'Umar ibn 'Abd al-Aziz, al-Hasan, al-Zuhri, Abu Qilaba and Abu Mijlaz, is that wudu' is required; they cite the hadith 'perform wudu' from what fire has touched' in Muslim from Abu Hurayra, 'A'isha and Zayd ibn Thabit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17444}\n\nTenth, eating camel meat. There are two views. The first, held by the Hanafis, Malikis, the newer Shafi'i view and a Hanbali view, is that it does not break wudu', like other food; the reason given by al-Kasani is that the breaker is the emission of an impurity or what causes it, and that did not occur. The second, held by the old Shafi'i view, Ishaq, Yahya ibn Yahya, Ibn Khuzayma and Ibn al-Mundhir, is that wudu' is required for camel meat alone, little or much, raw or cooked; they cite the report of Jabir ibn Samura about the man who asked whether to perform wudu' after mutton and camel, and the Prophet's answer to perform it after camel, and the report of al-Bara'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445} The Hanbali detail: the school view is that camel meat breaks wudu' whether eaten knowingly or not, raw or cooked; Ahmad has a report that raw meat breaks it but cooked does not; another that it breaks in no case, chosen by Yusuf al-Jawzi and Ibn Taymiyya; and a third that it breaks only if the prohibition was known, chosen by al-Khallal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} The other parts of the camel, such as the hump, fat, liver and paunch, do not break it on the school view; drinking camel's milk or the broth of its meat does not, and one report from Ahmad says drinking its milk does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nEleventh, eating forbidden food. The Hanbali reports differ: forbidden food breaks wudu', or forbidden meat in every case, or only pork. The school view is that eating meat other than camel meat does not break it, whether lawful or forbidden, since the rule for camel meat is one that is not understood by its meaning and so is not extended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nTwelfth, washing the dead. The majority do not count it among the breakers; the Hanafis say wudu' is recommended after washing the dead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}"
