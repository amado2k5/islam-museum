id: concept/wudu-fiqh
class: concept
kind: legal
label:
  ar: "وُضوء"
  en: "Wudu' (ablution, fiqh)"
  es: "Wudu' (ablución, fiqh)"
  fr: "Wudu' (ablution, fiqh)"
summary:
  ar: "الوضوء في اللغة من الوَضاءة، أي الحسن والنظافة. والوُضوء بالضم الفعل، وبالفتح الماء الذي يُتوضأ به، وقيل هما لغتان أو مصدران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364} وعرّفه الفقهاء: الحنفية بأنه الغسل والمسح على أعضاء مخصوصة؛ والمالكية بأنه طهارة مائية تتعلق بأعضاء مخصوصة على وجه مخصوص؛ والشافعية بأنه أفعال مخصوصة مفتتحة بالنية؛ والحنابلة بأنه استعمال ماء طهور في الأعضاء الأربعة على صفة مخصوصة في الشرع، مرتبة متوالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}\n\nوالغُسل استعمال الماء في جميع البدن على وجه مخصوص، والوضوء والغسل كلاهما يرفع الحدث، فيرفع الوضوء الحدث الأصغر والغسل الأكبر. والطهارة أعم من الوضوء، وهي ارتفاع الحدث وزوال النجس. والتيمم في اللغة التوخي والقصد، وفي الاصطلاح مسح الوجه واليدين بصعيد طاهر على وجه مخصوص، ويكون من الحدث الأصغر أو الأكبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}\n\nوذهب جمهور الفقهاء إلى أن الوضوء من الشرائع القديمة، وأن الذي خُصّت به هذه الأمة هو الكيفية المخصوصة أو أثر الوضوء، وهو الغرّة والتحجيل، واستدلوا بأحاديث وضوء الأنبياء وسارة وجريج. وذهب المالكية في قول، والشافعية في مقابل الأصح، وبعض الحنفية، إلى أن الوضوء نفسه من خصائص هذه الأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367}\n\nوقد فُرض الوضوء بمكة مع الصلاة، والمعيّة هنا للمكان لا للزمان، وكان النبي لا يصلي إلا بوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} ومشروعيته بالكتاب والسنة والإجماع، ومن الكتاب آية المائدة، وقد عدّها بعض الفقهاء دليل الفرضية، وذهب الجمهور إلى أن المقصود إذا قمتم إلى الصلاة وأنتم محدِثون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} ومن السنة قوله: لا تُقبل صلاة بغير طهور. وأجمع أهل السير أن الوضوء فُرض بمكة بتعليم جبريل ، وأجمعت الأمة على مشروعيته ووجوبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} ونص الفقهاء على أن من أنكر وجوب الوضوء للصلاة يكفر؛ وقال الحنفية إن إنكار وجوبه لغير الصلاة، كمس المصحف، لا يُكفِّر لوقوع الخلاف في تفسير آيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nأما من ترك الوضوء عمداً ثم صلى محدثاً: فعند الحنفية يكفر من استخف بالدين كالصلاة بلا وضوء عمداً؛ وعند المالكية يُقتل بترك الطهارة كالصلاة؛ وعند الشافعية يُستتاب، فإن لم يتب قُتل حداً لا كفراً؛ وعند الحنابلة من ترك شرطاً مجمعاً عليه كالطهارة فحكمه حكم تاركها، ومن ترك الصلاة جاحداً أو غير جاحد دُعي إليها ثلاثة أيام فإن لم يصلِّ قُتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nالحكم التكليفي للوضوء يختلف باختلاف ما يُتوضأ له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nأولاً: ما يكون الوضوء له فرضاً. الصلاة: اتفق الفقهاء على أنه فرض على المحدث إذا أراد القيام لصلاة فرض أو نفل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} والحنفية يوجبونه لصلاة الجنازة لأنها صلاة، ويشترط لها ما يشترط لبقية الصلوات، وجمهور الفقهاء يوجبونه لسجدة التلاوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} والطواف: الجمهور من المالكية والشافعية والحنابلة يوجبونه للطواف فرضه ونفله، والحنفية يرونه واجباً، ويترتب على ذلك أن من طاف الفرض محدثاً لزمه دم، ومن طاف جنباً لزمته بدنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} ومس المصحف: الجمهور على أنه فرض لمسه، والدليل آية الواقعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}\n\nثانياً: ما يكون الوضوء له سنة. قال الحنفية والحنابلة والشافعية غير البغوي إن الوضوء للنوم سنة، واستدلوا بحديث الاضطجاع على الشق الأيمن بعد الوضوء، المروي في الصحيحين. وقال المالكية إنه مستحب، وفي قول لهم أن وضوء الجنب للنوم سنة، وفي قول واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}\n\nثالثاً: ما يكون الوضوء له مندوباً. ضابطه كل وضوء ليس شرطاً في صحة ما يُفعل به بل من كماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} ومن ذلك: قراءة القرآن وقراءة الحديث وروايته، وذكر الله، والأذان، والإقامة على خلاف بين الفقهاء، والخطبة، ودراسة العلم الشرعي، والوقوف بعرفة والسعي بين الصفا والمروة، وزيارة النبي  ودخول مسجده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} وفي تجديد الوضوء اختلف الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} ويستحب للجنب الوضوء عند إرادة الأكل والشرب ومعاودة الوطء والنوم عند جمهور الحنفية والشافعية والحنابلة، والمالكية يرون أن الوضوء للأكل والشرب والجماع ليس على الجنب، وإنما يُستحب غسل اليدين والفرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} ويندب عند الحنفية المحافظة على الوضوء بتجديده كلما أحدث، والوضوء للخروج من خلاف العلماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}\n\nرابعاً: ما يباح له الوضوء. عند المالكية الوضوء للتنظيف والتبرد؛ وذكر القاضي عياض أن الوضوء المباح للدخول على الأمراء وركوب البحر ونحوه من المخاوف، وأنه قد يكون مستحباً، واستظهر الحطاب الاستحباب فيها ما عدا التنظيف والتبرد. وهذا الوضوء لا يرفع الحدث ما لم يُنوَ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nخامساً: الوضوء الممنوع، وعند المالكية هو المجدَّد قبل أن تُفعل به عبادة، أو الوضوء لغير ما شُرع له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nوفضيلة الوضوء: وردت أحاديث في سقوط الخطايا به، منها أن الطهور شطر الإيمان، وما رُوي عن عثمان في وضوء النبي  وأن من توضأ هكذا غُفر له ما تقدم من ذنبه، وحديث عمر في أبواب الجنة الثمانية، وحديث أبي هريرة في الغُرّ المحجّلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nشروط الوضوء: منها شروط الوجوب، ومنها شروط الصحة، ومنها ما هو للوجوب والصحة معاً؛ وأول شروط الوجوب العقل، إذ لا خطاب على غير العاقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nالواجب في غسل الأعضاء في الوضوء: يكفي عند الجمهور ⁦(الحنفية والشافعية والحنابلة)⁩ جريان الماء على العضو دون دَلك، وانفرد المالكية والمزني بشرط الدلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} وعند الحنفية يكون الغسل بإسالة الماء مع التقاطر ولو قطرة، وعن أبي يوسف يكفي مجرد بلّ المحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} وعند الشافعية المراد بالغسل الانغسال، سواء بفعل المتوضئ أو بفعل غيره أو بلا فعل كنزول المطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}\n\nالوجه: ما تحصل به المواجهة، فيُغسل ظاهره كله. وحدّه عرضاً ما بين الأذنين، وطولاً من منابت الشعر في الرأس إلى أسفل الذقن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} وعند المالكية والحنابلة يكون الطول في من لا لحية له إلى منابت الشعر، وفي من له لحية إلى منتهى اللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} والشعر المسترسل خارج دائرة الوجه: عند الحنفية لا يجب غسله، والشافعية يوجبونه إن كان خفيفاً ظاهراً وباطناً، وإن كان كثيفاً فظاهره فقط، وفي قول لهم لا يجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383}\n\nغسل الشعر النابت على الوجه: عند الحنفية لا يجب غسل أصول الشعر الكثيف للحرج، ويجب غسل الخفيف ظاهراً وباطناً إلى البشرة. وعند المالكية يجب تخليل الخفيف وإيصال الماء إلى البشرة، ولا يُخلَّل الكثيف بل يكفي إمرار الماء على ظاهره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384} وعند الشافعية تُغسل شعور الهدب والحاجب والشارب والعذار والعنفقة ظاهراً وباطناً، وقد تُغسل لحية المرأة والخنثى كذلك؛ وفي لحية الرجل يُغسل الخفيف ظاهراً وباطناً، ويُغسل الكثيف ظاهره فقط، والمعتمد عندهم أنه إن تميّز الخفيف عن الكثيف فلكل حكمه، وإن اختلطا غُسل الكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} وعند الحنابلة يجب غسل اللحية وما خرج عن حد الوجه من الشعر المسترسل، ويجب غسل الكثيف من الشعور في الوجه كالعنفقة والشارب والحاجب ولحية المرأة والخنثى، ويُسنّ تخليل اللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}\n\nغسل ماق العين وداخلها: يُغسل مع الوجه ماق العين، فإن كان عليها رمص وجبت إزالته. أما داخل العين فالجمهور على أنه لا يُغسل مع الوجه في الوضوء، لأن النبي لم يفعله ولا أمر به، ولأنه يضره الماء الحار والبارد؛ وروي عن أحمد وجوب غسله بشرط أمن الضرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} وإن تنجس داخل العين أوجب المالكية والشافعية وأحمد في قول غسله، وعند الحنفية والحنابلة في المذهب يُعفى عنه في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}\n\nغسل موضع الغمم، وهو ما نزل من الشعر عن المعتاد من حد منبته في الرأس إلى حد ينتهي إلى المعتاد وقدر ما يتم به الواجب، فيُغسل مع الوجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} وموضع التحذيف، وهو ما نبت عليه الشعر الخفيف بين العذار والنزعة، فيه خلاف: عند جمهور الشافعية والمالكية في رأي والحنابلة في الصحيح أنه من الرأس فلا يُغسل مع الوجه؛ وعند الحنفية والمالكية في رأي والحنابلة في قول والشافعية في قول، وهو الأصح عند الغزالي والرافعي، أنه من الوجه فيُغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالبياض بين العذار والأذن: عند الشافعية والحنابلة وظاهر المذهب عند الحنفية وبه يُفتى أنه من الوجه، وعن أبي يوسف رواية أنه ليس منه؛ وعند المالكية يُغسل البياض المحاذي لوتد الأذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالشفتان: يجب غسل ما يظهر من حمرتهما عند انضمامهما الطبيعي، وقيل عند الحنفية في وجه إن الشفة تبع للفم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} وغسل جزء من الرأس عند غسل الوجه واجب عند الفقهاء، وزاد الشافعية غسل جزء من الحلق وما تحت الحنك والأذنين، لأن ما لا يتم الواجب إلا به واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nالعذار يُغسل مع الوجه، ويُغسل ما ظهر من الأنف بالجدع عند الشافعية، والوترة ⁦(الحاجز بين المنخرين)⁩ عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388} وعند جمهور الفقهاء داخل الفم والأنف ليسا من الوجه، فلا يجب غسلهما فيه؛ وعند الحنابلة الفم والأنف من الوجه، فتجب المضمضة والاستنشاق في الطهارتين، واستندوا إلى حديث عائشة في أنهما من الوضوء الذي لابد منه، وقد أعلّه الدارقطني بالإرسال عند بعض الرواة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nالصدغ وموضع الصلع والنزعتين: جمهور الفقهاء على أنها من الرأس لا من الوجه؛ وعند الحنابلة في قول أن الصدغ من الوجه؛ وقال الشربيني يُسنّ غسل موضع الصلع والتحذيف والنزعتين والصدغين مع الوجه للخلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} والمالكية يغسلون أسارير الجبهة وما غار من جفن ونحوه إن أمكن إيصال الماء إليه بدلك، فإن لم يمكن سقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nالأذنان: خالف الزهري الجمهور فجعلهما من الوجه يُغسلان معه، واستدل بحديث في سجود الوجه، والجمهور أجابوا بأن الأذنين من الرأس، واستشهدوا بمسح النبي أذنيه مع رأسه، وأن إضافتهما إلى الوجه لمجاورتهما له، والشيء يُسمى باسم ما جاوره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nمن غسل ظاهر شعر اللحية ثم زال الشعر أو انقلعت جلدة من وجهه بعد غسلها: فعند الحنفية والمالكية في الراجح والحنابلة والشافعية في أحد الوجهين لا يلزمه غسل ما ظهر ولا إعادة وضوئه، لأن الفرض انتقل إلى الشعر، وعند الشافعية في الأصح والمالكية في قول وابن جرير يجب غسل البشرة إذا ظهرت، قياساً على ظهور قدم الماسح على الخف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nالفرض الثاني: غسل اليدين إلى المرفقين، وهو ركن من أركان الوضوء وفرض باتفاق، بالكتاب، وبحديث أبي هريرة في صفة وضوء النبي، وبالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وجمهور الفقهاء ⁦(المالكية والشافعية والحنابلة في المذهب والحنفية ما عدا زفر)⁩ يوجبون غسل المرفقين مع اليدين، لأن «إلى» في الآية إن كانت بمعنى «مع» فالدخول ظاهر، وإن كانت للغاية فالحد إذا كان من جنس المحدود دخل فيه، ولحديث عباد العبدي في صفة الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وقال زفر وأحمد في قول والمالكية في قول بعدم دخول المرفق، قياساً على الليل في آية الصوم؛ وفي قول آخر للمالكية يدخل احتياطاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391}\n\nقطع بعض ما يجب غسله من اليد: يجب غسل ما بقي منه بالاتفاق، لحديث «إذا أمرتكم بأمر فأتوا منه ما استطعتم»، ولأن الميسور لا يسقط بالمعسور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} وحكم قطع اليد من المرفق ينظر فيه الحنفية وغيرهم، ويتصل بالصفحة التالية ⁦(ص 17392 فما بعد)⁩، وقد بقي هذا الجزء من المدخل غير مكتمل.\n\nقطع اليد من المرفق: عند الجمهور القائلين بوجوب غسل المرفق يُغسل موضع القطع، والحنفية والحنابلة في المذهب والشافعية في المشهور والمالكية في قول يوجبون غسل العظم الذي هو طرف العضد، لأن غسل العظمين المتلاقيين من الذراع والعضد واجب فإذا زال أحدهما غسل الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} وعند المالكية والشافعية في مقابل المشهور لا يجب غسل موضع القطع، لأن المرفق في الذراع وقد وقع عليه القطع، إلا أن يُعرف بقاء شيء من المرفق في العضد فيُغسل موضع القطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nقطع اليد من فوق المرفق: يسقط وجوب الغسل لعدم محله، لكن الشافعية نصوا على ندب غسل باقي العضد لئلا يخلو العضو من طهارة، وقالوا إن قُطع من المنكب ندب غسل محل القطع بالماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nغسل ما زاد من أصبع أو كف أو يد: الحنفية والمالكية والشافعية والقاضي من الحنابلة يوجبون غسل الإصبع أو الكف الزائدة إن نبتت في محل الفرض مع الأصلية. وإن نبتت في غير محل الفرض كالمنكب أو العضد، فجمهور الفقهاء يوجبون غسل ما حاذى منها محل الفرض، والحنابلة في الأصح لا يوجبون غسل المتميزة منها في غير محل الفرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nغسل ظفر اليد أو ما تحته: الحنفية والشافعية والحنابلة يوجبون غسل الظفر وإن طال لأنه متصل باليد اتصال خلقة فيدخل في مسمى اليد. وعند المالكية والحنابلة في قول لا يضر الوسخ اليسير تحت الظفر ولو منع وصول الماء، واحتج المرداوي بأنه مما يكثر وقوعه، فلو اشترط زواله لبيّنه النبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393} وعند الحنفية، بحسب الفتاوى، إن بقي من موضع الوضوء قدر رأس إبرة أو لزق بأصل الظفر طين يابس أو رطب لم يجز، وإن تلطخت اليد بخميرة أو حناء جاز؛ وإذا طال الظفر وجب إيصال الماء إلى ما تحته، وإذا قصر فلا يجب؛ وإذا طالت الأظفار حتى خرجت عن رؤوس الأصابع وجب غسلها بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} ونقل الكتاب عن بعض الحنفية التفريق بين أهل المدن وأهل القرى، ونقل الدبوسي الفتوى بالجواز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} والشافعية يوجبون غسل الشعر الظاهر على اليد ظاهراً وباطناً وإن كثف، وإلا غسلوا ما ظهر منه فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} والمالكية على المشهور يوجبون تخليل أصابع اليدين، ويجب عندهم معاهدة عقد الأصابع ورؤوسها وتكاميش الأنامل؛ ولا يجب تحريك الخاتم المأذون فيه لرجل أو امرأة، ويجب نزع الخاتم غير المأذون فيه إلا أن يكون واسعاً يدخل الماء تحته فيكفي تحريكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}\n\nغسل اليد الزائدة: الحنفية والمالكية والشافعية والحنابلة يوجبون غسل يد زائدة نبتت في محل الفرض. وإن نبتت في غير محل الفرض، فعند الحنفية والشافعية والحنابلة في قول يجب غسل ما حاذى منها محل الفرض، وعند المالكية إن لم يكن لها مرفق، فإن كان لها مرفق غُسلت كلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} وعند الحنفية، إن خُلق له يدان، فالتي يبطش بها هي الأصلية تُغسل، والأخرى زائدة؛ وعند الشافعية يجب غسل الزائدة التي لم تتميز عن الأصلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nغسل الجلد المتدلي من العضد: الحنفية والشافعية يوجبون غسل ما حاذى محل الفرض منه فقط، والحنابلة يوجبون غسل الجلدة المتقلعة من العضد إذا تدلت من الذراع كالإصبع الزائدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} وغسل الجلد المتدلي من الذراع واجب عند الفقهاء؛ وإن التحم رأسه بالعضد غُسل ما حاذى محل الفرض، ثم إن تجافى عنه غُسل ما تحته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nالفرض الثالث: مسح الرأس، وهو باتفاق الفقهاء من أركان الوضوء أو فروضه، بالكتاب، وبالأحاديث في وصف وضوء النبي، ومنها حديث عثمان. والمسح إمرار اليد المبتلة بالماء على الرأس بلا تسييل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} وتبدأ مسائل مسح الرأس، ومنها القدر المجزئ فيه، ويُختلف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nمسح الرأس: قال المالكية على المشهور والحنابلة على الصحيح في المذهب بوجوب مسح الرأس كله، ويدخل فيه الجلد والشعر من منابت الشعر المعتادة من مقدم الرأس إلى نقرة القفا، مع مسح شعر الصدغين، ولا يُمسح العظم الناتئ الذي هو من الوجه بل يُغسل معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} وفي الأقوال عند المالكية: أشهب يكفي عنده مسح النصف، وعنه أن مسح الناصية يجزئ، ومحمد بن مسلمة يجزئ مسح الثلثين، وأبو الفرج يجزئ مسح الثلث، ويُرد اليد تحت الشعر ليحصل التعميم، والرد سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} وعند الحنابلة يجب مسح ظاهر الرأس كله، وعن أحمد يجزئ أكثره، واختلفوا في تحديد الأكثر، وعن أحمد يجزئ قدر الناصية، وعنه يجزئ بعضه دون تحديد؛ ولو مسح البشرة فقط لم يجزئه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}\n\nوعند الحنفية ركن الوضوء مسح الرأس مرة فوق الأذنين، والمقدار المفروض في أشهر الروايات ربع الرأس وهو المعتمد في المذهب، وفي رواية أنه قدر الناصية، وفي رواية ثالثة قدر ثلاث أصابع، وفي البدائع أنها رواية الأصول، وفي الظهيرية عليها الفتوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} وعند الشافعية يجزئ مسمى المسح على بعض بشرة الرأس أو بعض شعره داخل حد الرأس، ويصدق المسح على البشرة أو الشعر، لأن الرأس اسم لما رأس وعلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nكيفية المسح: عند الحنفية على الأصح يُمسح بثلاث أصابع من اليد، فلو مسح بإصبع أو إصبعين لم يجز في ظاهر الرواية، ويجوز بالسبابة والإبهام مفتوحتين مع ما بينهما من الكف لأنها تعادل ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} وعند الحنابلة يجزئ المسح على أي كيفية، باليد أو بحائل، على الصحيح في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nما نزل عن الرأس من الشعر: الحنفية والشافعية والحنابلة لا يجب مسحه، والمالكية يوجبون مسح ما استرخى منه ولو طال جداً لأنه من شعر الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nغسل الرأس بدل مسحه: جمهور الفقهاء يجزئ، لأنه مسح وزيادة، واشترط الحنابلة في الصحيح أن يمرّ يده على الرأس، وعن أحمد يجزئ غسله دون إمرار اليد؛ ويُكره عند الحنفية والمالكية في الأظهر والحنابلة غسل الرأس ابتداءً بدل مسحه، لأنه خلاف المأمور به، وقال بعض المالكية والشافعية وأحمد في قول إنه لا يجزئ لأنه لا يُسمى مسحاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nحلق شعر الرأس بعد الوضوء: جمهور الفقهاء يرون أنه لا يؤثر، وقال الحنفية لا يُعاد الوضوء، لأن المسح على الشعر ليس بدلاً عن البشرة. وعند المالكية في رأي تجب إعادة مسح الرأس بعد الحلق، والدسوقي يرى هذا الرأي ضعيفاً؛ وعن ابن جرير الطبري الإعادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} وعن ابن رجب أن أحمد استحب أن يمس الرأس بالماء بعد الحلق ولم يوجبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nتكرار المسح: الحنفية والمالكية والحنابلة على أن المسح مرة واحدة، لأن التكرار يصير غسلاً، واستدل الحنابلة بأن أكثر من وصف الوضوء ذكر مسح الرأس مرة، وقال أبو داود إن أحاديث عثمان كلها تدل على ذلك؛ والشافعية يسنّون تثليث مسح الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالشعور المضفورة: عند المالكية ما ضُفر بنفسه لا يُنقض مطلقاً، وما ضُفر بثلاثة خيوط يجب نقضه، وما ضُفر بأقل منها يُنقض إن اشتد، والصاوي يرى أن النساء ينفعهن تقليد الشافعي أو أبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالمسح على العمامة: تفصيله في باب المسح، ويُحال إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nالفرض الرابع، غسل الرجلين إلى الكعبين، وفيه أربعة أقوال. القول الأول، وهو مذهب الجمهور، أنه من أركان الوضوء غسل الرجلين، ويثبت ذلك بالإجماع، وقد نقل عبد الرحمن بن أبي ليلى أن أصحاب النبي أجمعوا على غسل القدمين، وقال الماوردي إن فرضهما عند كافة الفقهاء الغسل دون المسح، ونقل النووي عن أبي حامد وغيره إجماع المسلمين على وجوب غسلهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}\n\nالقول الثاني: أن فرض الرجلين المسح دون الغسل، وروي ذلك عن علي وابن عباس وأنس والشعبي وغيرهم، واستدلوا بقراءة الجر في آية المائدة، وقد ثبت رجوع علي عنه بأمره بغسل الأقدام، وقال ابن قدامة إنه لم يعلم من فقهاء المسلمين من يقول بالمسح غير من ذُكروا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nالقول الثالث: الحسن البصري والجبائي وابن جرير الطبري في إحدى الروايات أن المتوضئ مخيّر بين غسل الرجلين ومسحهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} القول الرابع: لبعض أهل الظاهر وجوب الجمع بين الغسل والمسح، لأن القراءتين في آية واحدة بمنزلة آيتين، ولا تنافي بين الغسل والمسح في محل واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nويجب عند جمهور الفقهاء إدخال الكعبين في الغسل، ولم يخالف إلا زفر. والكعبان العظمان الناتئان في أسفل الساق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nثانياً: الفرائض المختلف فيها في الوضوء.\n\nأولاً: النية، فالجمهور على أنها شرط لا يصح الوضوء إلا بها، وقال بعضهم إنها سنة، وقال آخرون إنها فرض، وتفصيلها في باب النية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nرفض النية: إذا رفض المتوضئ النية بعد كمال الوضوء لم يؤثر ذلك عند المالكية والشافعية على الصحيح والحنابلة على الصحيح؛ ومقابل الصحيح عند الحنابلة أنه يبطل. أما إذا رفضها أثناء الوضوء، فالشافعية في الأصح لا يبطل ويُستأنف النية لما بقي، والحنابلة في الصحيح يبطل ما مضى، والمالكية على الراجح لا يغتفر الرفض فيبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nثانياً: الموالاة، وهي غسل الأعضاء على التعاقب بحيث لا يجف الأول قبل الشروع في الثاني؛ فالحنفية والشافعية في القول الجديد الصحيح والمالكية في قول والحنابلة في رواية يرونها سنة، ومنها قول ابن عمر وقول الحسن وسعيد بن المسيب والثوري. وعند المالكية على المشهور والشافعية في القديم والحنابلة في المذهب أنها واجبة، وبه قال عمر بن الخطاب والأوزاعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nثالثاً: الترتيب، أي أن يأتي بالأعضاء على الترتيب في الغسل والمسح. فالشافعية والحنابلة في المذهب والمالكية في قول يرونه ركناً، وهو قول عثمان وابن عباس وقتادة وأبي ثور وأبي عبيد وإسحاق، واستدلوا بآية المائدة لأن المسح دخل بين الغسلين، وبأن كل من حكى وضوء النبي حكاه مرتباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405} وعند الحنفية والمالكية على المشهور وبعض الشافعية ورواية عن أحمد أن الترتيب سنة، وهو قول ابن مسعود وغيره، واستدلوا بأن الآية عطفت بالواو، وهي لا تقتضي ترتيباً، وبأن الغسل دفعة واحدة يرفع الحدث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nرابعاً: الدلك، وهو إمرار اليد على العضو إمراراً متوسطاً، ولو لم تزل الأوساخ، ولو بعد صب الماء قبل جفافه، عند المالكية. فجمهور الحنفية والشافعية والحنابلة وقول عند المالكية يرونه سنة، ويزيد الشافعية أن يبالغ في العقب خصوصاً في الشتاء؛ والمالكية في المشهور يرونه فرضاً، واستدلوا بأمر النبي عائشة أن تدلك جسدها، وهو حديث لم يُسند عند التعليق في الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nالدلك، وفيه ثلاثة أقوال عند المالكية: المشهور الوجوب، لأنه شرط في حصول مسمى الغسل، ومن قال به استدل بأمر عائشة بدلك جسدها؛ والثاني، وهو لابن عبد الحكم، أنه لا يجب لصدق اسم الغسل بدونه؛ والثالث أنه واجب لا لنفسه بل لتحقق إيصال الماء، فمن تحقق إيصاله بطول مكث أجزأه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}\n\nسنن الوضوء.\n\nأولاً: التسمية في أول الوضوء. فجمهور الحنفية والشافعية وأحمد في رواية على أنها سنة، والمالكية في المشهور على أنها مستحبة، وقيل مكروهة، والحنابلة على أنها واجبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وعند الحنفية تحصل التسمية بكل ذكر، والوارد عن النبي والمنقول عن السلف «بسم الله العظيم والحمد لله على الإسلام»، وقيل الأفضل «بسم الله الرحمن الرحيم»؛ وعند الشافعية أقلها «بسم الله» وأكملها بكمالها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وعند الحنابلة يجب أن تكون بلفظ «بسم الله» ولا يقوم غيره مقامه على الأشهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} وأما التسمية عند غسل كل عضو، فعند الحنفية من الآداب، وذكروا فيها حديث البراء بن عازب في ذكر الشهادتين عند كل عضو، وقال العيني إن إسناده واه. وظاهر كلام الحنابلة أنها لا تستحب عند كل عضو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nثانياً: غسل اليدين إلى الرسغين، ويُسن في ابتداء الوضوء اتباعاً لفعل النبي، ويجب غسلهما اتفاقاً إن كانتا نجستين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nثالثاً: المضمضة، فجمهور الفقهاء على أنها سنة، والحنابلة على أنها واجبة. ويُحال في تفصيلها إلى بابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nرابعاً: الاستنشاق، فجمهور الفقهاء على أنه سنة، والحنابلة على أنه فرض أو واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nخامساً: الاستنثار، وهو سنة عند الحنفية والمالكية والشافعية والحنابلة، لحديث «إذا استنشقت فانتثر»؛ وعند المالكية طرح الماء من الأنف بالنَّفَس مع وضع السبابة والإبهام من اليسرى عليه، وعند الشافعية إخراج ما في الأنف بخنصر اليسرى، وعند الحنابلة يُسنّ الاستنثار باليسار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nسادساً: مسح كل الرأس. وقد سبق أن المالكية في المشهور والحنابلة يوجبونه، والحنفية والشافعية يرونه سنة. واستدل الحنفية بحديث مسح كل الرأس، وبحديث مسح النبي بناصيته، فيكون مسح الربع فرضاً ومسح الجميع سنة؛ وقالوا إن من داوم على ترك استيعاب الرأس بلا عذر يأثم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} وعند الشافعية يُسنّ مسح كل الرأس اتباعاً وخروجاً من خلاف من أوجبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nمسائل تتعلق بمسح الرأس:\n\nأ- تكرار المسح: الحنفية يرون أن يُمسح الرأس كله مرة بماء واحد، ومن روى التثليث فهو محمول على مسح بماء واحد، وعن الحسن عن أبي حنيفة أن المسح ثلاثاً بماء واحد مسنون؛ وأما المسح ثلاثاً بماء متجدد ففيه ثلاثة أقوال: يُكره، أو بدعة، أو لا بأس به، والكتاب ينقل ترجيح ابن عابدين للكراهة. وعند الشافعية يُسنّ تثليث الممسوح؛ ولو مسح بعض الرأس ثلاثاً حصل التثليث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nب- كيفية المسح المسنون: عند الحنفية الأظهر أن يضع كفيه وأصابعه على مقدم الرأس ويمدهما إلى القفا، ثم يمسح أذنيه بإصبعيه. وعند الشافعية أن يضع يديه على مقدم الرأس ويلصق السبابة بالأخرى، ويُمرّ إبهاميه على الصدغين، ثم يذهب بهما إلى القفا ويردّهما إلى المكان الذي ذهب منه إن كان له شعر ينقلب؛ ومن لا شعر له يقتصر على الذهاب، ويُنظر في المسح كله بالفرض والسنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nوصرّح الحنابلة بأنه لا يُستحب تكرار مسح الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nيذكر الكتاب من السنن في مسح الرأس: أن يُعاد المسح إلى حيث بدأ، وذكر الترمذي حديث أبي حية في وضوء علي وفيه مسح الرأس مرة، وروى أبو داود حديث ابن عباس أن النبي مسح برأسه وأذنيه مسحة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} وعن أحمد يُستحب تكرار المسح بماء جديد، نصره أبو الخطاب وابن الجوزي، وكذا الأذنان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} وعدّ المالكية من السنن رد المتوضئ مسح رأسه إلى حيث بدأ، لأن الشعر الطويل لا يحصل تعميمه إلا بالرد، ويكون الرد سنة إن بقي في اليد بلل من المسح الواجب، ويُكره تجديد الماء له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}\n\nصفة مسح الرأس: عند المالكية والشافعية أن يأخذ الماء بيده اليمنى ويفرغه على باطن اليسرى ثم يمسح، يبدأ بمقدم الرأس ويضم أطراف أصابعه ويجعل إبهاميه على صدغيه، ثم يذهب بيديه إلى طرف الشعر مما يلي القفا ثم يردهما إلى حيث بدأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} وعند الحنابلة الصفة المسنونة أن يمرّ يديه من المقدم إلى القفا ثم يردهما إلى الموضع الذي بدأ منه، لحديث عبد الله بن زيد، ثم يدخل سبابتيه في الصماخين ويمسح بإبهاميه ظاهرهما؛ وإن كان ذا شعر يخاف انتفاشه بالرد لم يردّ، لحديث الربيع بنت معوذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} وسئل أحمد عن مسح المرأة فوصف مسح الرأس مع الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}\n\nسابعاً: مسح الأذنين. عند الحنفية والمالكية على المشهور والشافعية أنه من سنن الوضوء مسح الأذنين ظاهرهما وباطنهما، استناداً إلى حديث المقدام بن معدي كرب في مسح الأذنين وإدخال الأصابع في الصماخين، وعند جمهور الفقهاء ظاهر الأذنين ما يلي الرأس وباطنهما ما كان مواجهاً؛ وقال المالكية في رأي إن الظاهر هو المواجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} وعن المالكية أن السنن المتعلقة بالأذنين ثلاث: مسح ظاهرهما وباطنهما، ومسح الصماخين، وتجديد الماء لهما. وعند الشافعية يُسنّ مسح الأذنين بماء جديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} وعند الحنابلة وبعض المالكية يجب مسح الأذنين ظاهرهما وباطنهما، لأنهما من الرأس، ويُسنّ مسحهما بماء جديد بعد مسح الرأس، والبياض فوق الأذنين من الرأس فيجب مسحه معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} والمسنون عند الحنابلة أن يدخل سبابتيه في صماخيهما ويمسح بإبهاميه ظاهرهما، ولا يجب مسح ما استتر من الأذن بالغضاريف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} وعند الحنفية يكفي مسح جميع الرأس والأذنين بماء واحد، لأنهما من الرأس، وأظهر الصفات عندهم أن يضع كفيه وأصابعه على مقدم الرأس ويمدهما إلى القفا، ثم يمسح أذنيه بإصبعيه، وإن مسحهما بالبلة الباقية كفى، ومسحهما بماء جديد أولى مراعاة للخلاف؛ وعند الحنفية يندب إدخال الخنصر المبلولة في الصماخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nثامناً: تخليل اللحية وشعور الوجه، وهو سنة في الجملة، وتفصيله في غسل الوجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nتاسعاً: تخليل أصابع اليدين والرجلين، ويُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nعاشراً: التثليث، وهو سنة عند الفقهاء في غسل الأعضاء، وفي حديث النبي إنه توضأ مرة وقال إنها الوضوء الذي لا تُقبل الصلاة إلا به، ومرتين وقال إنه يُضاعف الأجر، وثلاثاً وقال إنه وضوؤه ووضوء الأنبياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالحادي عشر: الاستياك. جمهور الفقهاء على أنه سنة عند الوضوء، لحديث «لولا أن أشق على أمتي لأمرتهم بالسواك مع كل وضوء»؛ وعند الحنفية سنة مؤكدة، وعند المالكية في المشهور مستحب، ويرى الدسوقي أن ظاهر الحديث يقتضي السنة وإن خالف المشهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} وتفصيل السواك في بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالثاني عشر: المسح على العمامة، وفيه خلاف يُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nالثالث عشر: عدم الإسراف في الماء، ويُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}\n\nالرابع عشر: التيامن في اليدين والرجلين. فالحنفية والمالكية والحنابلة في الصحيح من المذهب يرونه مستحباً، استناداً إلى حديث عائشة في تيمّن النبي في شأنه كله، وإلى وصف عثمان وعلي لوضوء النبي بأنه بدأ باليمنى قبل اليسرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417} والشافعية وبعض الحنفية يرونه سنة لحديث «إذا توضأتم فابدؤوا بميامنكم»، وقال ابن الهمام إنه سنة لثبوت مواظبته. وفي رواية عن أحمد أنه واجب، حكاها الفخر الرازي وشذّذه الزركشي، وقيل يُكره تركه؛ ونقل ابن قدامة الإجماع على أن من بدأ بيساره قبل يمينه لا إعادة عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}\n\nالخامس عشر: إطالة الغرة والتحجيل، وهي تجاوز موضع الفرض في غسل الوجه واليدين والرجلين. فالشافعية والحنابلة في الصحيح يرونها سنة؛ والحنفية يرونها من آداب الوضوء، وغايتها في الوجه غسل صفحة العنق مع مقدمات الرأس، وفي اليدين والرجلين استيعاب العضدين والساقين. والأصل حديث «غراً محجلين»، وهو عند الشافعية والحنابلة من خصائص هذه الأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} ومذهب المالكية ورواية عن أحمد أنها لا تندب، بل تُكره عند مالك لأنها من الغلو في الدين، وحملوا الإطالة في الحديث على إدامة الطهارة لا على زيادة الغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالسادس عشر: استقبال القبلة في الوضوء، فالحنفية والمالكية يرونه من آدابه ويقيدونه بالإمكان من غير مشقة، والشافعية والحنابلة يرونه من سننه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالسابع عشر: الجلوس في مكان مرتفع، وهو من آداب الوضوء عند الحنفية والمالكية، تحرّزاً عن الماء المستعمل وصونا للثياب من المتقاطر؛ ويسنّ عند الشافعية أن يتوقّى المتوضئ الرشاش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nالثامن عشر: التوضؤ في مكان طاهر، وهو من المستحبات عند الحنفية والمالكية، ويكره عند المالكية الوضوء في بيت الخلاء لأنه ليس شأنه الطهارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}\n\nالتاسع عشر: ترك الاستعانة. الشافعية والحنابلة يرونه سنة، والحنفية من آداب الوضوء؛ واستعان النبي بالمغيرة بن شعبة في الصب، وصبّ صفوان بن عسال عليه الماء، وكان ترك الاستعانة أفضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} وفرّق الشافعية بين الاستعانة بالصب والاستعانة بإحضار الماء، فالثانية لا بأس بها، وتجب إذا لم يمكن التطهر إلا بها لعذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} وقال ابن مودود إن الاستعانة تكره إلا عند العجز، وفصّل ابن عابدين: الاستعانة بالصب أو الاستقاء أو الإحضار لا كراهة فيها، والاستعانة بالغسل والمسح مكروهة بلا عذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nالعشرون: مسح الرقبة، فالحنفية وأحمد في رواية يرونه من مستحبات الوضوء، وقيل سنة؛ والمالكية والشافعية والحنابلة في الصحيح لا يسنّونه لأنه لم يثبت فيه شيء، والنووي يرى أنه بدعة، والمالكية يرون أنه يُكره لأنه من الغلو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nالحادي والعشرون: تحريك الخاتم في الوضوء. الحنفية والشافعية يرونه من مستحبات الوضوء في الخاتم الواسع، وكذلك القرط، وفي الضيق إن علم وصول الماء، وإلا فهو فرض؛ وقال أحمد بن حنبل إن كان الخاتم ضيقاً فلا بد من تحريكه، وقد تُكمل تفاصيله في الصفحة التالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nالخاتم: إن وصل الماء تحته أجزأه، وروي أن النبي كان يحرّك خاتمه في الوضوء، ومن شك في وصول الماء وجب التحريك، لأن الأصل عدمه. وعند المالكية الخاتم المأذون فيه لا يجب نزعه أو تحريكه ولو كان ضيقاً، وغير المأذون فيه يجب نزعه إن كان حراماً، ويجزئ تحريكه إن كان واسعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nالثاني والعشرون: البدء بمقدم الأعضاء. يُسنّ عند الشافعية البدء بأعلى الوجه وأطراف الأصابع ومقدم الرأس، وعند الحنفية والمالكية يُستحب البدء في كل عضو بمقدمه، من منابت الشعر في الوجه، ومن أطراف الأصابع إلى المرفقين، ومن منابت الشعر إلى نقرة القفا، ومن الأصابع إلى الكعبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nالثالث والعشرون: عدم الكلام. يستحب عند الحنفية والشافعية ترك الكلام لغير حاجة، ويكره عند المالكية والحنابلة في الصحيح، وقال المالكية وابن مفلح إن الكراهة تكون بغير ذكر الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nالرابع والعشرون: السلام على المتوضئ وردّه. ذهب المالكية وبعض الشافعية وبعض الحنابلة إلى أنه يُشرع السلام على المتوضئ ويُشرع رده، وقال شيخ الإسلام من الشافعية إن الرد واجب. وقال الفروع إن ظاهر كلام أكثر الحنابلة لا يكره السلام ولا رده، وقال أبو الفرج وغيره من الحنابلة إنه يكره، وروى الكتاب حديث أم هانئ في سلامها على النبي وهو يغتسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}\n\nالخامس والعشرون: الدعاء عند كل عضو. ذهب الحنفية والمالكية وأكثر الشافعية وجماعة من الحنابلة إلى استحبابه، وذكر الكتاب الأدعية المأثورة عند كل عضو وهي معروفة عند القائلين بها، وأن ابن عابدين رأى أن الحديث الوارد فيها بلغ مرتبة الحسن بتعدد طرقه، والضعيف يُعمل به في فضائل الأعمال بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424} وذهب الشافعية في رأي والحنابلة على الأصح إلى أنه لا يُستحب، ونص الحنابلة على كراهته بمعنى ترك الأولى؛ وقال النووي إن دعاء الأعضاء لا أصل له، وقال ابن القيم إن الأذكار التي يقولها العامة عند كل عضو لا أصل لها عنه عليه الصلاة والسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}\n\nالسادس والعشرون: الدعاء بعد الوضوء. الشافعية والحنابلة يسنّون أن يقول المتوضئ بعد فراغه، مستقبلاً القبلة رافعاً يديه وبصره إلى السماء، الشهادتين، لحديث عمر بن الخطاب في أبواب الجنة الثمانية، ثم الدعاء المأثور بالتوبة والتطهر، ثم «سبحانك اللهم وبحمدك» لحديث أبي سعيد عند النسائي الموقوف عليه، والحنابلة والشافعية يقرأون سورة القدر ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} والحنفية والمالكية والشافعية يسنّون الصلاة على النبي بعد الوضوء، والحنفية والمالكية يزيدون الدعاء المأثور بعدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} وقال البهوتي إن الحكمة في ختم الوضوء بالاستغفار أن العباد مقصرون عن حقوق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426}\n\nالسابع والعشرون: تنشيف الأعضاء من بلل الوضوء. ذهب المالكية والحنابلة والشافعية في مقابل الأصح إلى الجواز، وعند الحنابلة ترك التنشيف أفضل، وعند الحنفية من آداب الوضوء التنشيف، وعند الشافعية في الأصح المسنون تركه إلا لعذر، والكراهة في قول عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426}\n\nالسابع والعشرون: ترك نفض اليد أو الماء. فالحنفية والشافعية في الأصح يستحبون ألا ينفض المتوضئ يده، لحديث «إذا توضأتم فلا تنفضوا أيديكم فإنها مراوح الشيطان»، وقال ابن حبان فيه إنه منكر؛ والحنابلة في الصحيح والشافعية في رأي يكرهون نفض الماء. وقال ابن قدامة إن نفض الماء عن البدن لا يُكره، ويُكره نفض اليد، وقال صاحب غاية المطلب إن الأصح عدم الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}\n\nالثامن والعشرون: الشرب من فضل ماء الوضوء. نص الحنفية والشافعية على استحبابه عقب الوضوء، لحديث علي في شرب النبي من فضل وضوئه، ويستحب أن يكون قائماً مستقبلاً عند الكمال، وقيل قاعداً، ويقال عقب الشرب دعاء مرويّ عن الفقهاء لم يقف عليه الكتاب مأثوراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nالتاسع: صلاة ركعتين عقب الوضوء. يستحبها الحنفية والشافعية والحنابلة، لحديث عقبة بن عامر في الجنة، والحنفية والحنابلة يصلونها في غير أوقات الكراهة، والشافعية يصلونها في الأوقات كلها لأن لها سبباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nالثلاثون: تجديد الوضوء، أي التوضؤ على وضوء قائم لم ينتقض. فقال بعض الفقهاء إنه سنة، وقال بعضهم مستحب، وقال بعضهم ممنوع قبل أن تُفعل به عبادة، وفي رواية عن أحمد لا فضل فيه؛ ويُحال إلى بابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nالحادي والثلاثون: عدم نقص ماء الوضوء عن مُدّ. فالجمهور يستحبون ألا ينقص عن مد، لحديث أنس في وضوء النبي بالمد، والمالكية في المشهور والحنفية في قول يرون أن الماء لا يُحدّ بحد، وأن المقصود فضيلة الاقتصاد؛ ونقل ابن عابدين عن الحلية إجماعاً بأن ما يجزئ غير مقدّر، وقال ابن شعبان من المالكية إنه لا يجزئ أقل من مد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}\n\nالثاني والثلاثون: عدم النفخ في الماء حال غسل الوجه، وهو من آداب الوضوء عند الحنفية، وأن يتوضأ من متوضأ العامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}\n\nالثالث والثلاثون: الترتيب بين السنن. يُسنّ عند الحنفية والشافعية في المذهب ترتيب السنن فيما بينها، ويندب عند المالكية والحنفية في قول ترتيبها في أنفسها؛ ولو حصل تنكيس بين السنن أو بين السنن والفرائض لم تُطلب الإعادة، لأن المندوب إذا فات لا يؤمر بفعله. والشافعية في أحد الوجهين يوجبون الترتيب في المسنون قياساً على أركان الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}\n\nالرابع والثلاثون: أخذ الماء بيديه جميعاً عند غسل الوجه. فالشافعية في الصحيح يستحبون أن يأخذ الماء بيديه جميعاً، لحديث عبد الله بن زيد في إدخال اليدين، وفي قول لهم يأخذه بيده، وفي وجه ثالث لزاهر السرخسي يغرف بكفه اليمنى ويضع ظهرها على بطن اليسرى، لحديث ابن عباس؛ والحنابلة يذكرون أن الغرف بيديه جميعاً أو اليمنى مضمومة إليها الأخرى هو السنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nالمكروهات. عدّ الفقهاء أموراً من مكروهات الوضوء:\n\nأولاً: لطم الوجه وأعضاء الوضوء بالماء، وخص الوجه لشرفه، كراهة عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nثانياً: التقتير، أي أن يقتصر على ما يدهن الأعضاء بالماء دون أن يظهر التقاطر، وينبغي أن يكون التقاطر ظاهراً ليكون الغسل يقيناً في كل مرة من الثلاث، وهو مكروه عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nثالثاً: الإسراف في الماء، بأن يستعمل فوق الحاجة الشرعية، لحديث سعد مع عبد الله بن عمرو في أن الإسراف يكون في الوضوء ولو على نهر جارٍ، ولأنه من الغلو المفضي إلى الوسوسة، وحديث «لن يشادّ الدين أحد إلا غلبه»، ونص على كراهته الحنفية والمالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nوزاد الحنفية والشافعية أن الماء الموقوف على من يتطهر به، كماء المدارس، يحرم الإسراف فيه، لأن الزيادة غير مأذون فيها، وقيّده ابن عابدين بما ليس بجارٍ، أما الجاري فهو مباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}\n\nرابعاً: التوضؤ بفضل ماء المرأة، أي ما فضل عن طهارتها ولم تمسّه بشرب أو تُدخل يدها فيه بلا نية. فذهب بعض الحنفية وبعض الشافعية ورواية عن أحمد إلى كراهته مراعاةً للخلاف؛ وذهب بعض الحنفية ورواية عن أحمد والمالكية في المذهب وبعض الشافعية كالبغوي إلى أنه طاهر مطهّر لا يُكره، واستدلوا بحديث ابن عباس في غسل بعض أزواج النبي من جفنة، وأن الماء لا يجنب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432} وظاهر مذهب الحنابلة أنه لا يجوز للرجل التطهر بفضل طهور المرأة، لحديث الحكم بن عمرو الغفاري في نهي الرجل عن ذلك؛ وقال المرداوي إن المنع تعبدي لا يُعقل معناه، فيباح للمرأة وحدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nخامساً: تثليث المسح بماء جديد. الحنفية والمالكية يكرهونه، والحنابلة لا يستحبون تكرار مسح الرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nسادساً: الوضوء في مكان نجس، فيكره، لأن للماء حرمة ولئلا يتطاير عليه شيء مما يتقاطر من الأعضاء؛ ونص الحنفية على كراهة إلقاء النخامة والامتخاط في الماء تنزيهاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nسابعاً: التوضؤ في المسجد. يكره إلا في إناء أو في موضع أعد لذلك عند الحنفية وأحمد في رواية ومالك؛ وقال الشافعية والحنابلة في الصحيح إنه يباح إذا لم يؤذ به أحداً ولم يؤذ المسجد؛ وقال سحنون لا يجوز التوضؤ بصحن المسجد، وروى الكتاب حديثاً في جعل المطاهر على أبواب المساجد، وأشار الهيثمي إلى انقطاع في سنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}\n\nثامناً: إراقة ماء الوضوء في المسجد. الحنابلة يكرهونها، ويكرهونها كذلك في موضع يُداس كالطريق، وقال الشافعية يجوز إسقاطه في أرض المسجد إذا لم يتأذَّ به الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}\n\nتاسعاً: الوضوء بالماء المشمس. فالمالكية في المعتمد والشافعية في المذهب وبعض الحنفية يكرهونه، وجمهور الحنفية والحنابلة والمالكية في قول وبعض الشافعية يجيزونه مطلقاً بلا كراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nعاشراً: ترك سنة من سنن الوضوء. نص المالكية على كراهة تركها عمداً مع عدم بطلان الصلاة بتركها، ويُسنّ فعلها لما يُستقبل من الصلاة بذلك الوضوء؛ والحنفية يرون ترك المندوب خلاف الأولى، ويعبّرون عنه بأنه مكروه تنزيهاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nنواقض الوضوء. عند الحنفية نقض الوضوء إخراجه عن إفادة المقصود منه كاستباحة الصلاة، وعند المالكية انتهاء حكمه أو رفع استمراره فيما كان يُباح به؛ وقد اختلف الفقهاء في بعضها واتفقوا على بعضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nأولاً: الخارج من السبيلين، وهو متفق عليه في الجملة، لقوله تعالى في آية المائدة وآية النساء، والغائط مجاز عن الحاجة التي تُقضى في المكان المطمئن، فلو جاء أحد من الغائط من غير حاجة لم يجب عليه الوضوء إجماعاً. وفصّل الفقهاء في المعتاد والنادر، وفي المخرج من الدبر أو الذكر أو الفرج أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nثانياً: خروج النجاسات من غير السبيلين. المالكية والشافعية يرون أنه غير ناقض، ويلزم تطهير موضع النجاسة ويبقى الوضوء؛ والحنفية والحنابلة يرون أن النجاسات الخارجة من سائر البدن كالقيء والدم ناقضة في الجملة مع اختلاف بينهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436}\n\nثالثاً: زوال العقل، بالنوم أو الجنون أو السكر أو الإغماء. أما النوم فجمهور الحنفية والمالكية والشافعية والحنابلة يرونه ناقضاً في الجملة، استناداً إلى حديث «العين وكاء السه، فمن نام فليتوضأ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} وتفصيل الحنفية في النائم: إن كان مضطجعاً أو متوركاً نقض، لاسترخاء المفاصل، وإن كان مستنداً إلى شيء لو أزيل عنه لسقط فيُنظر في حاله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436}\n\nالنوم حالاً حالاً عند الحنفية: إن كان النائم قائماً أو راكعاً أو ساجداً وكان مقعدته لا تزال عن الأرض لم ينتقض، وإن زالت مقعدته عن الأرض فينتقض بالإجماع إن كانت زائلة، وإن لم تزل ففيه روايتان: القدوري بالنقض، والزيلعي بعدم النقض وهو رواية أبي يوسف، والنائم في الصلاة لا ينتقض وضوؤه إذا كان كذلك، ومن نام خارج الصلاة على هيئة السجود ينقض إن لم يكن على هذه الهيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} والمريض إذا صلى مضطجعاً فنام ينتقض وضوؤه عند الزيلعي للحديث. ومن نام قاعداً فسقط على وجهه أو جنبه ينظر: إن انتبه قبل السقوط أو عند السقوط أو سقط نائماً فانتبه من ساعته لم ينتقض، وإن استقر بعد السقوط نائماً ثم انتبه انتقض؛ وعن أبي يوسف ينتقض بالسقوط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} وقال الحنفية إن النوم نفسه ليس حدثاً، وإنما الحدث ما لا يخلو عنه النائم، فأُقيم السبب الظاهر وهو النوم مقامه، كالسفر ونحوه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}\n\nالمالكية لهم طريقتان في اعتبار النوم ناقضاً: الأولى، طريقة اللخمي، وهي أن المعتبر صفة النوم لا هيئة النائم، فالنوم الثقيل ينقض أياً كانت الهيئة، وعلامته أن لا يشعر صاحبه بصوت مرتفع أو بسقوط مروحة من يده؛ والنوم غير الثقيل لا ينقض. والثانية أن النوم الثقيل ينقض على كل حال، وغير الثقيل ينقض في الاضطجاع والسجود دون القيام والجلوس، ونُسبت إلى عبد الحق، والأولى هي الأشهر عندهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}\n\nالشافعية يرون أن النوم ينقض كيفما كان إلا نوم المتمكن مقعدته من الأرض أو غيرها، فلا ينقض وإن استند إلى ما لو زال لسقط، لأمن خروج شيء من الدبر؛ ولا عبرة باحتمال خروج شيء من القبل لأنه نادر، واحتجوا بأثر أنس أن أصحاب النبي كانوا ينامون ثم يصلون ولا يتوضؤون، وحُمل على نوم المتمكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439} وذكر النووي فروعاً: يُستحب للنائم المتمكن أن يتوضأ احتياطاً؛ ولو تيقن النوم وشك هل كان متمكناً لم يجب الوضوء؛ ولو نام جالساً فزالت أليته قبل الانتباه انتقض، وإن زالت بعد الانتباه أو مع الانتباه أو لم يدر لم ينتقض، لأن الأصل الطهارة؛ ولا فرق بين القليل والكثير من النوم عندهم؛ والمحتبي فيه ثلاثة أوجه، والمختار أنه لا ينقض؛ والمضطجع على قفاه ينقض عند الأصحاب، ولو استثفر وتلجم فالمشهور النقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}\n\nالحنابلة يقسمون النوم إلى ثلاثة أقسام: نوم المضطجع، وهو ناقض يسيره وكثيره، ونوم القاعد، فإن كان كثيراً نقض وإن كان يسيراً لم ينقض، ونوم القائم والراكع والساجد؛ واستدلوا بعموم حديث «فإذا نامت العينان استطلق الوكاء» وبحديث صفوان بن عسال في الخفين. وعند أحمد روايات: في القائم والراكع والساجد المذهب النقض، والثانية لا ينقض إلا إذا كثر، والثالثة لا ينقض نوم الراكع وينقض نوم الساجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} أما القاعد المستند والمحتبي فهو كالمضطجع عند بعضهم، وعن أحمد أنه لا ينقض يسيره، ورأى الوضوء في الاحتباء والاتكاء والاستناد إلا أن يغفو قليلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} وقال ابن قدامة إن الأولى أن من كان معتمداً بمحل الحدث على الأرض لا ينقض منه إلا الكثير، لأن دليل انتفاء النقض في القاعد لا تفريق فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} واختلف الحنابلة في حد الكثير: فقال أبو يعلى لا حد له، وقيل هو ما يتغير به النائم عن هيئته كأن يسقط على الأرض أو يرى حلماً؛ وقال ابن قدامة إنه لا حد له لأن التحديد يُعرف بالتوقيف، فمتى وُجد ما يدل على الكثرة كسقوط المتمكن انتقض، وإن شك في كثرته لم ينتقض لأن الطهارة متيقنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} وقال ابن قدامة إن النوم غلبة على العقل، فمن لم تُغلب على عقله فلا وضوء عليه، ومن شك هل نام أو خطر بباله شيء لا يدري أرؤيا هو أم حديث نفس فلا وضوء عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441}\n\nالرأي الثاني: حُكي عن أبي موسى الأشعري وأبي مجلز وحميد الأعرج وعمرو بن دينار أن النوم لا ينقض الوضوء، واستدلوا بأثر أنس في انتظار العشاء حتى تخفق الرؤوس؛ ونقل المرداوي عن الميموني أنه لا ينقض. وكان سعيد بن المسيب ينام مراراً مضطجعاً ثم يصلي ولا يعيد الوضوء، ولعلهم ذهبوا إلى أن النوم ليس حدثاً في نفسه، والحدث مشكوك فيه، فلا يزول اليقين بالشك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441}\n\nالحنابلة في النوم: إن نام المتوضئ وهو يظن بقاء طهره لم ينتقض وضوؤه، وهو اختيار ابن تيمية؛ وقال الخلال إن هذه الرواية خطأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nثانياً: الإغماء والغشي ينقضان الوضوء باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} ثالثاً: الجنون، قليله وكثيره، ينقض باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} رابعاً: السكر ناقض باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nخامساً: مس فرج الآدمي، ذكراً كان أو أنثى أو خنثى، مختلف في نقض الوضوء به، وتفصيله في أبوابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} سادساً: التقاء بشرة الرجل والمرأة، مختلف فيه، وتفصيله في أبوابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nسابعاً: الردة. فالحنفية والشافعية في الأصح وجماعة من المالكية والحنابلة في رواية يرون الردة في ذاتها ليست من نواقض الوضوء، وإنما تحبط العمل إذا اتصلت بالموت، فمن ارتد وهو متوضئ ثم عاد إلى الإسلام لم ينتقض وضوؤه بالردة ذاتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} وقال المالكية في المعتمد والحنابلة في الصحيح والشافعية في وجه إن الردة تنقض الوضوء، واستدلوا بآية الزمر، وقالوا إن الخطاب للأمة لا للنبي، وروى موسى بن معاوية عن ابن القاسم ندب الوضوء من الردة. ومعنى الإحباط عند الصاوي في الثواب، وإنما وجب الوضوء على القول المعتمد لأن المرتد بعد توبته بمنزلة من بلغ حينئذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443}\n\nثامناً: القهقهة في الصلاة. فجمهور الفقهاء ⁦(المالكية والشافعية والحنابلة)⁩ يرون أنها لا تنقض الوضوء وتفسد الصلاة، واستحب الشافعية الوضوء منها؛ والحنفية، وهو ما روي عن الحسن والنخعي والثوري، يرون أن القهقهة في صلاة كاملة، وهي ما لها ركوع وسجود، تنقض الوضوء وتفسد الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443}\n\nتاسعاً: أكل ما مسته النار. قولان: الأول، وعليه جمهور العلماء وهو محكي عن أبي بكر وعمر وعثمان وعلي وابن مسعود وغيرهم، أنه لا يجب الوضوء منه، واحتجوا بحديث ابن عباس في أكل النبي كتف شاة ثم صلى ولم يتوضأ، وبحديث جابر أن آخر الأمرين ترك الوضوء مما غيرت النار، وبحديث «الوضوء مما يخرج وليس مما يدخل» وأعله ابن حجر بضعف رواته. والثاني، وعليه عمر بن عبد العزيز والحسن والزهري وأبو قلابة وأبو مجلز، أنه يجب، واستدلوا بحديث «توضأوا مما مست النار» في مسلم عن أبي هريرة وعائشة وزيد بن ثابت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17444}\n\nعاشراً: أكل لحم الجزور ⁦(الإبل)⁩. قولان، الأول: جمهور الفقهاء ⁦(الحنفية والمالكية والشافعية في الجديد والحنابلة في قول)⁩ أنه لا ينقض كسائر الأطعمة، وحكي عن جماعة من الصحابة، والمعنى عند الكاساني أن الحدث خروج النجس أو ما هو سبب خروجه ولم يوجد. والثاني، أنه يجب الوضوء من لحم الإبل خاصة سواء كان قليلاً أو كثيراً، نيئاً أو مطبوخاً، وهو قول الشافعي في القديم وإسحاق وابن خزيمة وابن المنذر وغيرهم، واحتجوا بحديث جابر بن سمرة في سؤال الرجل عن لحم الإبل وأن النبي أمره بالوضوء منه، وحديث البراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445} وللحنابلة تفصيل: فالمذهب أنه ينقض لحم الجزور سواء علمه أم جهله، نيئاً أو مطبوخاً؛ وعن أحمد ينقض نيئه دون مطبوخه، وعنه لا ينقض مطلقاً اختاره يوسف الجوزي وابن تيمية، وعنه إن علم النهي نقض وإلا فلا، اختاره الخلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} وبقية أجزاء الإبل كالسنام والدهن والكبد وغيرها لا تنقض على المذهب، وشرب لبن الإبل ومرق لحمها لا ينقض، وعن أحمد ينقض شرب لبنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nحادي عشر: أكل الطعام المحرم. عن أحمد روايات: ينقض الطعام المحرم، أو اللحم المحرم مطلقاً، أو لحم الخنزير فقط؛ والمذهب عند الحنابلة أنه لا ينقض أكل ما سوى لحم الإبل من اللحوم، لأن النقض بلحم الإبل تعبدي فلا يتعدى إلى غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nثاني عشر: غسل الميت. لم يذكره الجمهور في نواقض الوضوء، وقال الحنفية يستحب الوضوء بعد غسل الميت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nالصحيح من مذهب الحنابلة أن غسل الميت ينقض الوضوء، ولبعضهم احتمال بعدم النقض إذا غسله الغاسل في قميص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447}\n\nثاني عشر: الشك في الوضوء أو عدمه. ذهب المالكية إلى أن الشك من نواقض الوضوء، لأن الذمة لا تبرأ مما طُلب منها إلا بيقين، وصوره عندهم: أن يشك بعد علمه بتقدم طهره هل حصل ناقض، أو يشك بعد علم حدثه هل حصل وضوء، أو يعلم الطهر والحدث ويشك في السابق منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447} وذهب جمهور الفقهاء إلى أن الشك في بقاء الوضوء أو عدمه ليس من نواقضه، فمن أيقن بالطهارة وشك في حدوث الناقض، أو أيقن بالحدث وشك في طروء الوضوء، عمل بما سبق يقينه؛ واستدلوا بحديث مسلم في من وجد في بطنه شيئاً فأشكل عليه، فلا يخرج من المسجد حتى يسمع صوتاً أو يجد ريحاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17448}\n\nثالث عشر: الغيبة والكلام القبيح. حُكيت عن أحمد رواية بأن الغيبة والفحش ونحوهما من النميمة والكذب والقذف وقول الزور تنقض الوضوء، ونُقل عن عائشة قولها إن أحدهم يتوضأ من الطعام الطيب ولا يتوضأ من الكلمة العوراء يقولها. وذهب الحنفية والشافعية إلى استحباب الوضوء الشرعي من الكلام القبيح كالغيبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17448}"
  en: "Wudu' (from wada'a, to be fair and clean) is the act, and the water used for it, in the lexical sense. The jurists define it: the Hanafis as washing and wiping specified members; the Malikis as a water purification of four members in a specific way; the Shafi'is as specific acts opened by intention; and the Hanbalis as using pure water on the four members in the prescribed way, in order and in succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}\n\nGhusl is washing the whole body in a specific way. Both wudu' and ghusl remove a ritual impurity, the minor and the major. Tahara is the wider term for removing impurity and removing its effect. Tayammum is wiping the face and hands with clean earth or sand in a specific way, and it serves for either impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}\n\nMost jurists hold that wudu' belongs to earlier revelations, and that what is peculiar to this community is its specific manner or the mark of wudu', the white marks on the limbs on the Day of Resurrection, citing accounts of the prophets and of Sarah and Jurayj. A Maliki view, the opposite of the sounder Shafi'i view, and some Hanafis hold that wudu' itself is peculiar to this community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367}\n\nWudu' was made obligatory in Mecca along with prayer; the preposition 'with' refers to place, not time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} Its legal basis is the Qur'an, the sunna and consensus. The verse of sura al-Ma'ida (cited by sura and aya) is taken by some as the proof of obligation, while most read it as addressed to those who are in a state of impurity when they rise to pray. The sunna includes the saying that no prayer is accepted without purity. The people of biography agree that it was made obligatory in Mecca through Gabriel's teaching, and the community agrees on its legality and obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} Denial of its obligation for prayer is disbelief; for other purposes, such as touching the mushaf, the Hanafis do not count it as disbelief, because the verse is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nWhoever deliberately leaves wudu' and prays in a state of impurity: the Hanafis say one who makes light of religion is a disbeliever, as in deliberately praying without wudu'; the Malikis say he is killed for abandoning purity like prayer; the Shafi'is say he is asked to repent and killed as a hadd punishment, not as disbelief; the Hanbalis say one who abandons an agreed condition or pillar is treated as one who abandons the act, and one who leaves prayer is called to it for three days and killed if he does not pray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nThe legal ruling varies with the purpose of wudu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}\n\nFirst, where wudu' is obligatory: for prayer, the jurists agree it is obligatory for one in a minor impurity who wishes to stand for an obligatory or a voluntary prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} The Hanafis require it for the funeral prayer, which they count as a prayer; the majority also require it for the prostration of recitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} For tawaf, the Malikis, Shafi'is and Hanbalis hold that it is obligatory for obligatory and voluntary tawaf; the Hanafis count it as necessary (wajib) and penalise: an obligatory tawaf in a minor impurity requires a sacrifice, and in a major impurity a camel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} For touching the mushaf, the majority hold it obligatory, citing the verse of sura al-Waqi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}\n\nSecond, where it is sunna: the Hanafis, Hanbalis and Shafi'is, other than al-Baghawi, hold that wudu' before sleep is sunna, on the hadith about lying down on the right side after wudu', reported in the two Sahihs as cited in the book's footnote. The Malikis call it recommended; one Maliki view is that for a junub before sleep it is sunna; another that it is obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}\n\nThird, where it is recommended: a wudu' that is not a condition for the validity of the act but part of its perfection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} It is recommended for reciting the Qur'an and reading hadith, for remembrance of God, for the call to prayer, and for the iqama (on which the jurists differ), for the sermon, for studying religious knowledge, for standing at 'Arafat and for the sa'y between Safa and Marwa, and for visiting the Prophet's mosque and his tomb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} The renewal of wudu' is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} For a junub, the Hanafis, Shafi'is and Hanbalis (the majority) recommend wudu' before eating, drinking, resuming intercourse and sleeping; the Malikis hold that the junub has no wudu' for eating, drinking or resuming intercourse, but washes his hands and his private parts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} The Hanafis also recommend keeping wudu' constant by renewing it whenever it is broken, and recommend it to leave a legal difference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}\n\nFourth, where it is permitted: the Malikis hold that the permitted wudu' is for cleanliness and cooling; Qadi Iyad mentions wudu' before entering rulers' presence or boarding a ship in danger, and says that it may be recommended; al-Hattab leans towards recommendation for all except cleanliness and cooling. Such a wudu' does not remove the impurity unless it is intended to. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nFifth, forbidden wudu': for the Malikis, renewing wudu' before an act of worship has been performed with it, or wudu' for a purpose for which it was not prescribed or permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}\n\nMerit of wudu': many hadiths on the removal of sins by it: purity is half of faith; the report from 'Uthman that whoever performs wudu' as the Prophet did has his earlier sins forgiven; the hadith of 'Umar on the eight gates of Paradise; and the hadith of Abu Hurayra on the radiant marks of the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376} The conditions of wudu' are of three kinds: conditions of obligation, of validity, and of both; the first of the conditions of obligation is intellect, since no address is made to one who lacks it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376}\n\nThe required washing: the majority (Hanafis, Shafi'is and Hanbalis) hold that it is enough for water to flow over a limb, without rubbing; the Malikis and al-Muzani require rubbing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} For the Hanafis washing means pouring water so that it drips, even a single drop; Abu Yusuf accepts merely wetting the place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} For the Shafi'is washing means the limb being washed, whether by the worshipper, another person or no act at all, such as rain falling on it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}\n\nThe face is what is faced; its whole outer surface is washed. Its width runs between the ears, and its length from the hairline at the top of the head to the lower chin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} The Malikis and Hanbalis measure the length for a beardless man to the hairline and for a bearded man to the end of the beard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Hanging hair beyond the outline of the face: the Hanafis do not require it to be washed; the Shafi'is require the outer and inner surfaces to be washed if it is thin, and only the outer surface if it is thick, with one view requiring nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383}\n\nHair on the face: the Hanafis do not require washing the roots of thick eyebrow, moustache and beard hair because of hardship, but thin hair must be washed outside and inside to the skin. The Malikis require combing thin hair so that water reaches the skin, and say thick hair needs only outer washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384} The Shafi'is wash the eyelashes, eyebrows, moustache, sideburns and the hair of the lower lip outside and inside, and the same for a woman's or intersex person's facial hair; for a man's beard, thin hair is washed both sides and thick hair only outside, and where thin and thick hair are mixed the whole is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} The Hanbalis require washing the beard and any hair hanging beyond the outline of the face, and the thick hair of the moustache, eyebrows, lower lip and of a woman or intersex person; combing the beard is recommended, the hadith on the handful of water under the chin being cited in the book's footnote. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}\n\nThe eye: the lid margin is washed with the face; crust on the lid must be removed. The majority do not wash the inside of the eye with the face, because the Prophet did not do so and because hot or cold water may harm it; a report from Ahmad requires it when there is no harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} If the inside of the eye is soiled with impurity, the Malikis, Shafi'is and one Ahmad view require washing it, while the Hanafis and the Hanbali school excuse it in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}\n\nThe hairline growth (ghumum), the hair that falls below its usual place, is washed with the face up to the usual limit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} The temples (tahdhif), the thin hair between the sideburn and the receding hairline, are disputed: the majority of Shafi'is, a Maliki view and the Hanbali sounder view treat them as part of the head and not washed with the face; the Hanafis, another Maliki view, a Hanbali view and a Shafi'i view, which Ghazali and Rafi'i call the sounder, treat them as part of the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe white skin between the sideburn and the ear: the Shafi'is, the Hanbalis and the Hanafi view on which fatwas are given hold it is part of the face; a report from Abu Yusuf excludes it; the Malikis wash the skin level with the earlobe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe lips: the red part visible when the lips close naturally is washed; one Hanafi view says the lip follows the mouth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} Washing part of the head with the face is obligatory in the majority view, and the Shafi'is add part of the throat, the area under the chin and the ears, since what the obligation cannot be completed without is itself obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387}\n\nThe sideburn is washed with the face. The Shafi'is wash the part of the nose exposed by an amputation; the Malikis wash the septum between the nostrils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388} The majority hold that the inside of the mouth and nose are not part of the face and need not be washed in wudu'; the Hanbalis hold that the mouth and nose are part of the face, so rinsing and snuffing water are required in both minor and major purification, citing a hadith in which the book notes al-Daraqutni judged the connection to be a mursal narration. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nThe temple (sudgh), the bald part and the receding hairlines: the majority hold these are part of the head, not the face; one Hanbali view holds the temple is part of the face. Al-Shirbini says it is recommended to wash them with the face because of the disagreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} The Malikis wash the folds of the forehead and any hollow of the eyelid if water can reach it by rubbing, and the rest falls away. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}\n\nThe ears: al-Zuhri included the ears in the face, citing a hadith about the face's creation. The majority reply that the ears are part of the head, citing the saying that the two ears belong to the head and the report that the Prophet wiped his ears with his head, and that the ears were attached to the face only because they neighbour it, as a thing takes the name of what adjoins it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nIf the hair is washed and the skin below it becomes visible afterwards, the Hanafis, the Maliki preferred view and the Hanbalis hold that nothing more is required and wudu' is not repeated, because the duty passed to the hair; the Shafi'is in the sounder view, one Maliki view and Ibn Jarir require washing the newly visible skin, by analogy with a foot showing above a wiped sock. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}\n\nThe second obligation: washing the hands to the elbows. It is a pillar and an obligation agreed by the Qur'an, by the report of Abu Hurayra describing the Prophet's wudu', and by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} The majority (the Malikis, Shafi'is, Hanbalis in the school view and the Hanafis except Zufar) hold that the elbows must be washed with the hands, whether 'to' in the verse means 'with' or marks a limit that is of the same kind as what it limits; they cite the hadith of 'Abbad al-Abdi describing the water running over the elbows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} Zufar, a Maliki view and a view of Ahmad hold that the elbow is not included, by analogy with night in the verse on the fast; a further Maliki view includes it as a precaution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391}\n\nIf part of the limb to be washed is cut off, the rest must be washed by agreement, on the hadith 'do what you can of what I order you' and because the easier is not dropped for the harder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} The rule for an arm cut at the elbow continues beyond p.17391 and is not yet read; this part of the headword is not complete.\n\nAmputation at the elbow: the jurists who require the elbow to be washed wash the place of the cut. The Hanafis, the Hanbali school, the Shafi'i sounder view and one Maliki view require washing the bone that is the upper end of the arm, because the two adjoining bones must be washed, and if one is absent the other is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} The Malikis and a Shafi'i view against the sounder require nothing at the cut, since the elbow belongs to the forearm and the cut has taken it; unless a part of the elbow is known to remain in the upper arm, in which case the place of the cut is washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nAmputation above the elbow: the duty falls away because its place is gone, but the Shafis recommend washing what remains of the upper arm so the limb does not lack purity; if cut at the shoulder, washing the place of the cut with water is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nAn extra finger, hand or arm: the Hanafis, Malikis, Shafi'is and the Hanbali judge al-Qadi wash an extra finger or hand that grows in the place of obligation alongside the original. If it grows outside the place of obligation, such as at the shoulder or upper arm, most jurists wash the part that lies opposite the place of obligation, while the sounder Hanbali view requires nothing for a distinct extra growth outside that place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392}\n\nNails and what is under them: the Hanafis, Shafi'is and Hanbalis require washing the nail even when long, because it is joined to the hand by creation and so falls within the name of the hand. The Malikis and one Hanbali view hold that a small dirt under the nail does not harm the wudu' even if it blocks the water, and al-Mardawi calls this the sounder view, because it is common, so the Prophet would have had to explain it if it were a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393} The Hanafi fatwas state that a remaining dot of dough or dry or wet clay at the root of the nail prevents validity, while dye from henna or dough does not; a long nail requires water to reach under it and a short one does not; nails that go beyond the fingertips must be washed by agreement. The book reports that some Hanafis distinguish town dwellers from villagers, and that al-Dabusi gave a fatwa of validity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} The Shafi'is require washing the hair on the hand, outside and inside, even if it is thick, and if it is so thick that the skin is not reached, the visible part only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} The Malikis, in their preferred view, require the washing of the spaces between the fingers, the joints and the fold of the fingertips; a ring that is permitted to a man or a woman need not be moved, though a forbidden ring must be removed, and a loose ring is moved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}\n\nAn extra hand: the Hanafis, Malikis, Shafi'is and Hanbalis require washing an extra hand that grows in the place of obligation. If it grows outside the place, the Hanafis, Shafi'is and a Hanbali view require washing what lies opposite the place of obligation; the Malikis require the whole if it has an elbow of its own. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} For the Hanafis, if a person has two hands, the one he uses to grasp is the original and is washed, while the other is extra; the Shafi'is require washing an extra hand that is not distinct from the original. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nA hanging fold of skin on the upper arm: the Hanafis and Shafi'is require washing only the part opposite the place of obligation, while the Hanbalis require washing a fold torn from the upper arm that hangs down the forearm, like an extra finger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} A fold of the forearm is washed in full by the jurists; if its head is joined to the upper arm, the part opposite the place of obligation is washed, and the part that moves away from the limb is washed on its underside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nThe third obligation: wiping the head. It is agreed to be a pillar or obligation, by the Qur'an, by the descriptions of the Prophet's wudu' including the report of 'Uthman, and by consensus. Wiping is passing a wet hand over the head without running water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} The questions about wiping the head begin here, starting with the amount that suffices, on which the jurists differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396}\n\nWiping the head: the Malikis in their preferred view and the Hanbalis in the sounder view require wiping the whole head, skin and hair, from the usual hairline at the front to the nape's hollow, together with the hair of the temples; the bone that projects and belongs to the face is not wiped but washed with the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} Other Maliki views: Ashhab requires only half, one report has the forelock enough, Muhammad ibn Maslama requires two-thirds, and Abu al-Faraj a third, with the hand passed back under the hair for full coverage, the return being recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} The Hanbalis require wiping the whole outer head in the sounder view; a report from Ahmad allows most of it, the jurists disagreeing on how much is most; another allows the forelock, another any part without limit. Wiping the skin alone does not suffice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}\n\nThe Hanafis hold that wiping the head once above the ears is a pillar; the amount in the most famous view is a quarter of the head, which is the school's preferred view, with a report of the forelock and a third of three fingers' breadth, the last, which the Badai' calls the report of the principal books, and on which the Zahiriyya says fatwas are given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} The Shafi'is require any wiping of part of the skin or part of the hair within the outline of the head, and allow either skin or hair as the part; the head is what is raised and rises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nMethod: the Hanafi sounder view requires three fingers to wipe; one or two fingers do not suffice in the apparent view, while the index and thumb spread with the palm between them count as three. The Hanbalis allow any manner, with the hand or with an intervening cloth, in the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}\n\nHair that falls below the head: the Hanafis, Shafis and Hanbalis do not require wiping it; the Malikis require wiping the hair that hangs down, however long, as it is hair of the head. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nWashing the head instead of wiping: the majority allow it, as it is wiping and more; the Hanbalis in the sounder view require the hand to be passed over the head, while a report from Ahmad allows washing without passing the hand. The Hanafis, the sounder Maliki view and the Hanbalis hold that washing the head at the outset in place of wiping is disliked, since it contradicts what is commanded; some Malikis, a Shafi'i view and a Hanbali view deny that it suffices, since it is not called wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}\n\nShaving the hair after wudu': the majority hold that this does not affect it. The Hanafis hold that wudu' is not repeated, since wiping hair is not a substitute for wiping the skin. A Maliki view requires repeating the wiping after shaving, which al-Dasuqi calls weak; al-Tabari requires repetition too. Ibn Rajab reports that Ahmad recommended wetting the head with water after shaving without requiring it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nRepeating the wiping: the Hanafis, Malikis and Hanbalis hold it is done once, since repetition becomes washing, and the Hanbalis cite that most who described the Prophet's wudu' mention one wiping, a view Abu Dawud supports; the Shafi'is recommend three wipings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nBraided hair: for the Malikis, hair that is braided by itself need not be unbraided, however firm; hair braided with three threads must be unbraided, whatever its firmness; hair braided with fewer threads must be unbraided if firm. Al-Sawi notes that women may follow the Shafi'i or Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nWiping over a turban is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400}\n\nThe fourth obligation: washing the feet to the ankles. There are four views. The first, held by the majority, is that washing the two feet is a pillar of wudu'. The jurists report consensus: Abd al-Rahman ibn Abi Layla reports that the Companions agreed on washing the feet, al-Mawardi says the majority of jurists hold washing and not wiping, and al-Nawawi reports that Muslims agreed on the obligation to wash the feet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}\n\nThe second view is that the obligation is wiping and not washing, attributed to 'Ali, Ibn 'Abbas, Anas and al-Sha'bi, who relied on the genitive reading of the word for feet in the verse of sura al-Ma'ida. It is recorded that 'Ali retracted this, ordering the feet washed; Ibn Qudama says no jurist, other than those named, held the view of wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nThe third view, of al-Hasan al-Basri, al-Jubba'i and one report from al-Tabari, is that the worshipper may choose between washing and wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} The fourth, held by some Zahiris, is that washing and wiping must both be done, since the two readings in one verse count as two verses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nThe majority require the ankles to be included in the washing; only Zufar disagreed. The ankles are the two bones that project at the foot of the leg. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nSecond, the disputed obligations of wudu'.\n\nFirst, intention: the majority hold it is a condition without which wudu' is not valid; some hold it a recommendation and others a pillar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403}\n\nAbandoning the intention: if the worshipper abandons the intention after finishing wudu', the Malikis, the sounder Shafi'i view and the sounder Hanbali view hold that it does not affect the wudu'; the other Hanbali view holds that it is void. If he abandons it during wudu', the Shafi'is in the sounder view say it is not void and he renews the intention for the rest, the Hanbalis in the sounder view say what has passed is void and he must begin again, and the Malikis in the preferred view do not excuse the abandonment, so it is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nSecond, continuity (muwala): washing the limbs in succession, so that the first does not dry before the next is begun. The Hanafis, the new Shafi'i view, one Maliki view and a Hanbali report hold it recommended, a view of Ibn 'Umar, al-Hasan, Sa'id ibn al-Musayyab and al-Thawri. The Malikis in the preferred view, the old Shafi'i view and the Hanbali school hold it obligatory, a view of 'Umar ibn al-Khattab and al-Awza'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}\n\nThird, order (tartib) in washing and wiping: the Shafi'is, the Hanbali school and one Maliki view hold it a pillar, a view of 'Uthman, Ibn 'Abbas, Qatada, Abu Thawr, Abu 'Ubayd and Ishaq. They argue from the verse, in which the wiping lies between the two washings, and that every account of the Prophet's wudu' gives the order. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405} The Hanafis, the preferred Maliki view, some Shafi'is and one Ahmad report hold the order is a sunna, a view of Ibn Mas'ud and others, arguing that the verse uses 'and' which does not imply order and that a single immersion lifts the impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406}\n\nFourth, rubbing (dalk): for the Malikis it is passing the hand over the limb moderately, whether or not dirt is removed, even after water is poured and before it dries. The majority of Hanafis, Shafi'is and Hanbalis, and one Maliki view, hold it a sunna, and the Shafi'is add that one should be thorough with the heels, especially in winter, citing the saying woe to the heels from the Fire. The preferred Maliki view makes it an obligation, citing a saying to Aisha to rub her body with her hand, a report which the book notes is not traced to a source.\n\nRubbing (dalk): the Malikis hold three views. The preferred view makes it obligatory, because it is a condition of the name of washing, and its advocates cite the instruction to 'A'isha to rub her body; the second, from Ibn 'Abd al-Hakam, holds it is not obligatory, since the name of washing is met without it; the third holds it obligatory not in itself but to make sure the water reaches the skin, so that one who is sure the water has reached it after a long stay is excused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}\n\nThe sunnas of wudu'.\n\nFirst, the basmala at the beginning. The majority of Hanafis and Shafi'is, and one Ahmad report, make it a sunna; the preferred Maliki view makes it recommended, another Maliki view disapproves; the Hanbalis make it obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} For the Hanafis any remembrance of God suffices, but the words reported from the Prophet and the Salaf are 'In the name of God the Mighty, and praise belongs to God for Islam', while some prefer the full basmala; the Shafi'is say the least is 'In the name of God' and the most complete is the full formula with praise for Islam and for the water being pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} The Hanbalis require the words 'In the name of God' and no other phrase suffices, in the most common view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} The Hanafis count the basmala at each limb as a courtesy, and cite a report from al-Bara' ibn 'Azib about the two testimonies at each limb; al-Ayni calls its chain weak. The Hanbali school view does not recommend it at each limb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nSecond, washing the hands to the wrists at the beginning, which is a sunna following the Prophet's practice; if the hands are impure, washing them is obligatory by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nThird, rinsing the mouth: the majority hold it a sunna, and the Hanbalis obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nFourth, snuffing water into the nose: the majority hold it a sunna, and the Hanbalis a pillar or an obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}\n\nFifth, blowing the nose out, a sunna for the four schools, on the hadith 'when you snuff, blow'. For the Malikis it is expelling water from the nose by breath with the index and thumb of the left hand placed on it; for the Shafi'is it is removing what is in the nose with the little finger of the left hand; the Hanbalis recommend doing it with the left hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nSixth, wiping the whole head. The Malikis in the preferred view and the Hanbalis make it obligatory, as already stated, while the Hanafis and Shafi'is make it a sunna. The Hanafis cite a report of wiping the whole head and the report of the Prophet wiping the forelock, so wiping a quarter is the obligation and wiping the whole is the sunna; they say that one who persistently leaves out wiping the whole head without excuse sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} The Shafi'is recommend wiping the whole head to follow the practice and to leave the disagreement of those who require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410}\n\nQuestions on wiping the head: first, repetition. The Hanafis hold that the whole head is wiped once with one water, and the reports of three wipings are taken to mean wiping with one water; al-Hasan reports from Abu Hanifa that three wipings with one water are sunna. Three wipings with fresh water are, in the Hanafi views, disliked, a bid'a, or permitted; the book quotes Ibn 'Abidin's preference for disliking it. The Shafi'is recommend wiping the whole head three times, one wiping after another, and a wiping of part of the head three times counts as three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nSecond, the recommended manner. The Hanafi preferred view is to place both palms and the fingers at the front of the head and draw them back to the nape, wiping the whole head, and then to wipe the ears with two fingers, the ears being part of the head. The Shafi'is say the sunna is to place the hands on the front of the head with the index finger joined to the other, the thumbs on the temples, to draw them back to the nape and bring them back to the place they started, where there is hair that turns; a person with no such hair only draws them back. The Hanbalis say repeating the wiping of the head is not recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411}\n\nThe sunnas of wiping the head: the wiper returns the hands to where he began. al-Tirmidhi reports the account of Abu Hayya of 'Ali's wudu', in which the head is wiped once, and Abu Dawud reports that Ibn 'Abbas saw the Prophet wipe his head and ears with one wiping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} Ahmad recommends repeating the wiping with fresh water, a view supported by Abu al-Khattab and Ibn al-Jawzi, and the same for the ears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} The Malikis count as a sunna the return of the hand over the head to its starting point, since long hair cannot be covered without it. The return is a sunna only if wetness from the obligatory wiping remains on the hand, and renewing the water for it is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}\n\nThe manner of wiping the head: the Malikis and Shafi'is take water in the right hand and pour it on the left palm, begin at the front, join the fingertips and place the thumbs at the temples, draw the hands back to the nape and return them to the start. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} For the Hanbalis the recommended manner is to draw the hands from front to back and return them to the start, following the report of 'Abd Allah ibn Zayd; then the index fingers enter the ear openings and the thumbs wipe the outer ears. A man with hair that would be ruffled by the return does not return, following the report of al-Rubay' bint Mu'awwidh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Ahmad, asked how a woman wipes, described the same motion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}\n\nSeventh, wiping the ears. The Hanafis, the preferred Maliki view and the Shafi'is hold that wiping both the outer and inner ear is a sunna, on the hadith of al-Miqdam ibn Ma'di Karib describing the wiping of the ears and the insertion of the fingers into the ear openings. The majority take the outer ear as the part next to the head and the inner ear as the part facing outwards; a Maliki view reverses this, and the Malikis say the ear is made like a rose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} The Malikis count three sunnas for the ears: wiping the outer and inner parts, wiping the openings, and renewing the water for them. The Shafi'is recommend fresh water for the ears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} The Hanbalis and some Malikis make the wiping of the ears obligatory, because they belong to the head; they recommend fresh water for them after wiping the head, and the white skin above the ears is part of the head and is wiped with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} The Hanbali recommended method is to put the index fingers in the openings and wipe the outer ears with the thumbs, and the cartilaginous parts within are not required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} The Hanafis hold that wiping the whole head and both ears with one water suffices, since they are part of the head; their preferred manner is the one described above, and wiping the ears with the damp remains is enough, while fresh water is better to satisfy the disagreement; they recommend putting the wet little finger into the ear opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nEighth, combing the beard and the hair of the face is recommended in the main, with the disagreement treated under washing the face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}\n\nNinth, passing the fingers between the fingers of the hands and feet is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nTenth, repeating each washing three times is a sunna among the jurists; the hadiths vary: once, with the statement that this is the wudu' without which prayer is not accepted; twice, with the statement that it doubles the reward; and three times, with the statement that it is his wudu' and that of the prophets. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nEleventh, the miswak. The majority hold that using the miswak is a sunna in wudu', citing the saying that had it not been a hardship on his community he would have ordered the miswak with every wudu'. The Hanafis call it a strongly confirmed sunna; the Malikis, in their preferred view, a recommendation; al-Dasuqi notes that the hadith suggests a sunna even against the preferred view. Its detailed rules are under their own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nTwelfth, the wiping over the turban is disputed and is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416}\n\nThirteenth, not wasting water, which is treated under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}\n\nFourteenth, starting with the right side of the hands and feet. The Hanafis, Malikis and the sounder Hanbali view hold it recommended, citing the report of 'A'isha that the Prophet liked to start on the right in all his affairs, and the accounts of 'Uthman and 'Ali describing that he began with the right before the left. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417} The Shafi'is and some Hanafis hold it a sunna, on the saying that when you perform wudu' you begin with your right sides; Ibn al-Hammam says it is a sunna because of his constant practice. One Hanbali report, cited by al-Razi and rejected by al-Zarkashi, makes it obligatory; another says leaving it is disliked. Ibn Qudama reports consensus that one who begins with the left need not repeat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}\n\nFifteenth, prolonging the bright marks (ghurra and tahjil): the Shafi'is and the sounder Hanbali view hold it a sunna, meaning washing beyond the obligatory place of the face, hands and feet. The Hanafis count it as a courtesy: for the face it reaches the side of the neck with the front of the head, and for the arms and legs it reaches the upper arm and the shin. The basis is the saying about the community being called radiant with white marks from the wudu'; the Shafis and Hanbalis hold this to be a feature peculiar to this community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} The Malikis and one Hanbali report do not recommend it, and Malik regards it as disliked, as an excess in religion; they read the 'prolonging' in the saying as continuing the state of purity, not as extra washing. Al-Dasuqi distinguishes the two senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nSixteenth, facing the qibla while performing wudu': the Hanafis and Malikis hold it a courtesy, limited by what is possible without hardship; the Shafi'is and Hanbalis hold it a sunna, as it is suitable for every act of worship unless there is a reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nSeventeenth, sitting in a raised place, a courtesy for the Hanafis and Malikis, to keep clear of the water used in wudu' and to protect clothes from dripping; the Shafi'is recommend avoiding the spray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}\n\nEighteenth, performing wudu' in a clean place, a recommendation for the Hanafis and Malikis. The Malikis dislike wudu' in a lavatory, because such a place is not for purity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}\n\nNineteenth, not seeking help. The Shafi'is and Hanbalis hold it a sunna; the Hanafis count it a courtesy. The Prophet was helped by al-Mughira ibn Shu'ba in pouring water, and Safwan ibn 'Assal poured water on him, but not seeking help is better. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} The Shafi'is distinguish helping with the pouring, which is disliked but not sinful, from helping by bringing water, which is allowed, and it is obligatory when the person cannot purify himself otherwise, for a reason such as illness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} Ibn Mawdud says help is disliked except when one is unable; Ibn 'Abidin says help in pouring, drawing or fetching water is not disliked at all, while help in washing or wiping is disliked without a reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nTwentieth, wiping the neck: the Hanafis and one Ahmad report count it a recommendation, and some say it is a sunna. The Malikis, Shafi'is and the sounder Hanbali view do not recommend it, since nothing is reported for it; al-Nawawi calls it an innovation, and the Malikis say it is disliked as an excess in religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nTwenty-first, moving the ring in wudu': the Hanafis and Shafis recommend moving a loose ring, and likewise an earring; for a tight ring it is recommended if water is known to reach, and obligatory if not. Ahmad ibn Hanbal says a tight ring must be moved, and the details continue on the next page. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}\n\nThe ring: if water reaches beneath it the wudu' is valid; the Prophet is reported to have turned his ring in wudu', and if one doubts whether water reaches under it, moving it is required, since the default is that it does not. For the Malikis a permitted ring need not be removed or moved even if tight; a forbidden ring must be removed if it is forbidden to wear, and moving it is enough if it is loose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nTwenty-second, starting with the front of each limb. The Shafi'is recommend beginning with the top of the face, the fingertips and the front of the head. The Hanafis and Malikis recommend beginning each limb at its front: the face at the hairline, the hands at the fingertips up to the elbows, the head at the hairline to the hollow of the nape, and the foot at the toes to the ankles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nTwenty-third, not speaking. The Hanafis and Shafi'is recommend silence without need; the Malikis and the sounder Hanbali view call speech disliked, and the Malikis and Ibn Muflih say the dislike applies to speech other than the remembrance of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422}\n\nTwenty-fourth, greeting the one performing wudu' and returning the greeting. The Malikis, some Shafi'is and some Hanbalis hold that greeting him is prescribed and that the reply is prescribed too; the Shafi'i Shaykh al-Islam says the reply is obligatory. The Furu' says most Hanbali texts do not dislike either greeting or reply, while Abu al-Faraj and others say greeting is disliked. The book cites the report of Umm Hani, who greeted the Prophet while he was washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}\n\nTwenty-fifth, supplication at each limb. The Hanafis, Malikis, most Shafi'is and some Hanbalis recommend it. The book lists the traditional formulae for each limb; al-Ayni's view, cited with Ibn 'Abidin, is that the report reached the grade of good through its several chains, and that a weak report may be acted on in matters of virtue on conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424} The Shafi'i view in one form and the sounder Hanbali view deny that it is recommended; the Hanbalis call it disliked in the sense of leaving the better; al-Nawawi says supplication at each limb has no basis, and Ibn al-Qayyim says the formulae popular with the common people for each limb have no origin in the Prophet's practice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}\n\nTwenty-sixth, supplication after wudu'. The Shafi'is and Hanbalis recommend that the performer, facing the qibla with his hands and eyes raised to the sky, says the testimony of faith, then the words from the report of 'Umar about the eight gates of Paradise, then the words that Tirmidhi adds to Muslim's report, then 'Glory be to You, O God, and praise, I testify there is no god but You, I ask Your forgiveness and turn to You', from the report of Abu Sa'id in al-Nasa'i which al-Nasa'i judged to be an account of Abu Sa'id's own words. The Shafi'is and Hanbalis also recite the surah of Power three times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} The Hanafis, Malikis and Shafi'is recommend blessing the Prophet after wudu', and the Hanafis and Malikis add a formula about being among the penitent and the purified. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} Al-Buhuti explains that ending wudu' and prayer with seeking forgiveness recognises that people fall short of God's due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426}\n\nTwenty-seventh, drying the limbs. The Malikis, Hanbalis and the older Shafi'i view allow drying or leaving it. The Hanbalis say leaving it is better; the Hanafis count drying as a courtesy; the sounder Shafi'i view makes leaving it the sunna unless there is an excuse, since drying removes the trace of worship. The Hanafis and a Shafi'i view hold that drying is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426}\n\nTwenty-seventh, not shaking off the hand or the water. The Hanafis and the sounder Shafi'i view recommend not shaking the hand, on the hadith 'when you perform wudu' do not shake your hands, for they are the fans of Satan', which Ibn Hibban judged a rejected report. The sounder Hanbali view and one Shafi'i view dislike shaking off water. Ibn Qudama says that shaking water off the body is not disliked, though shaking the hand is; the author of Ghayat al-Matlab holds the sounder view is that it is not disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}\n\nTwenty-eighth, drinking the water left over from wudu'. The Hanafis and Shafi'is recommend it straight after the wudu', on the report from 'Ali that the Prophet drank from his leftover wudu' water; the perfect form is to drink standing, facing the qibla, and some say sitting is allowed. A supplication for health is said after drinking, which the book notes is not traced as transmitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nTwenty-ninth, two rak'as after wudu'. The Hanafis, Shafi'is and Hanbalis recommend them, on the saying of 'Uqba ibn 'Amir about the Garden for one who performs wudu' well and then prays two rak'as with heart and face attending. The Hanafis and Hanbalis pray them outside the times of disliked prayer; the Shafi'is hold they may be prayed at any time, since they have a cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nThirtieth, renewing wudu', that is, performing wudu' over a wudu' that has not been broken. Some jurists call it a sunna, some a recommendation, some forbid it before an act of worship is done with it, and one report from Ahmad says it has no merit; the details are under its own heading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428}\n\nThirty-first, not using less than a mudd of water. The majority recommend not going below a mudd, on the report of Anas that the Prophet performed wudu' with a mudd. The Malikis in their most common view and a Hanafi view hold that no fixed measure applies, the aim being the virtue of moderation; Ibn 'Abidin reports from al-Hilya that several scholars report consensus that the amount needed is not fixed. Ibn Shaban of the Malikis says less than a mudd does not suffice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}\n\nThirty-second, not blowing into the water while washing the face, which the Hanafis count among the courtesies of wudu', and performing wudu' from the water of the common people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}\n\nThirty-third, the order among the sunnas. The Hanafi and Shafi'i school views make the order among the sunnas a sunna, while the Malikis and a Hanafi view make the order within each sunna recommended. If the order is reversed among sunnas, or between sunnas and obligations, no repetition is required, since a missed recommended act is not commanded again. One Shafi'i view makes the order of the recommended parts obligatory, by analogy with the pillars of prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}\n\nThirty-fourth, taking water in both hands for washing the face. The sounder Shafi'i view, stated in al-Muzani's Mukhtasar and held by most Shafi'is, is that the recommended manner is to take water in both hands, on the report of 'Abd Allah ibn Zayd that the Prophet put his hands in and washed his face three times, and because it is more complete. A Shafi'i view says one hand; a third view of Zahir al-Sarakhsi says to scoop with the right hand, placing its back on the palm of the left, on the report of Ibn 'Abbas. The Hanbalis say that scooping with both hands, or with the right hand joined to the left, is the established sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nThe disliked acts (makruhat). The jurists list several things as disliked in wudu'.\n\nFirst, striking the face or the other limbs with water, the face being singled out for its honour; disliked for the Hanafis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nSecond, stinginess, that is, using only enough water to moisten the limbs without visible dripping; the water should drip so that each of the three washings is certain; disliked for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nThird, extravagance, using more water than the legal need, on the report of Sa'd, whom the Prophet passed while he was performing wudu' and asked whether there was extravagance in wudu'; the reply was yes, even by a flowing river; and because it is the excess that leads to scrupulosity, and the saying that no one overdoes religion without being overcome by it. The Hanafis, Malikis, Shafi'is and Hanbalis all dislike it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}\n\nAmong the disliked acts, the Hanafis and Shafi'is add that water endowed for those who purify with it, such as the water of a madrasa, is forbidden to waste, since the excess is not permitted, the endowment being for the proper wudu'. Ibn 'Abidin limits this to still water; running water is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}\n\nFourth, performing wudu' with the water left by a woman, meaning the water left after her purification, without her having drunk from it or put her hand in it without intention. Some Hanafis, some Shafi'is and one report of Ahmad dislike it out of regard for the disagreement. Some Hanafis, one report of Ahmad, the Maliki school view and some Shafi'is, including al-Baghawi, hold that it is pure and purifying, and that using it is not disliked; they cite the report of Ibn 'Abbas about a wife of the Prophet washing from a basin, and the saying that water does not become impure by a state of major impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432} The apparent Hanbali school view forbids a man to purify with the leftover water of a woman, on the hadith of al-Hakam ibn 'Amr al-Ghifari; al-Mardawi says this prohibition is an act of worship whose meaning is not understood, so it is permitted to the woman herself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nFifth, wiping the head three times with fresh water: the Hanafis and Malikis dislike it, and the Hanbali school does not recommend repeating the wiping of the head. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nSixth, performing wudu' in an impure place, which is disliked because water used in wudu' is to be respected, and so that nothing dripping from the limbs falls on what is impure. The Hanafis add that throwing phlegm into the water or blowing the nose into it is disliked for purity's sake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}\n\nSeventh, wudu' in the mosque. It is disliked except in a vessel or a place prepared for it, according to the Hanafis, a report of Ahmad and Malik; the Shafi'is and the sounder Hanbali view allow it provided no one is harmed and the mosque is not harmed. Sahnun says wudu' in the courtyard of a mosque is not allowed. The book cites the hadith to place purification places at the mosque doors, and al-Haythami notes a break in its chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}\n\nEighth, pouring out the water of wudu' in the mosque. The Hanbalis dislike it, and dislike it in a place trodden on, such as the road. The Shafi'is allow letting it fall on the mosque floor if no one is harmed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}\n\nNinth, wudu' with water heated by the sun. The preferred Maliki view, the Shafi'i school view and some Hanafis dislike it; the majority of Hanafis, the Hanbalis, one Maliki view and some Shafi'is allow it without dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nTenth, leaving one of the sunnas of wudu'. The Malikis say it is disliked to leave one deliberately, though prayer is not invalidated by leaving it; if it is left deliberately or forgetfully, it is recommended to perform it for the prayers that follow with that wudu'. The Hanafis regard leaving a recommended act as contrary to the better course, and some call it disliked for purity's sake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nThe things that break wudu'. For the Hanafis, breaking wudu' means taking it out of its purpose, such as permission to pray; for the Malikis, it is the ending of its ruling or the lifting of its continuance for what it permitted, such as prayer. The jurists differ on some of these and agree on others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nFirst, what comes out of the two passages, agreed in general, citing the verses of sura al-Ma'ida and sura al-Nisa'. The word 'gha'it' is a figure for the need to relieve oneself in a sunken place. If someone comes from the place without need, wudu' is not obligatory, by consensus. The jurists distinguish customary from rare emissions, and emissions from the rear passage, the front passage, the wife's passage, or other places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}\n\nSecond, impurities leaving other parts of the body. The Malikis and Shafi'is hold that these do not break wudu'; only the place they touch is cleansed. The Hanafis and Hanbalis hold that such impurities, like vomit and blood, break wudu' in general, with differences among them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436}\n\nThird, loss of the mind, through sleep, madness, intoxication or fainting. Sleep is held by the majority of Hanafis, Malikis, Shafi'is and Hanbalis to break wudu' in general, on the hadith that the eyes are the binding of the buttocks, so whoever sleeps must perform wudu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} The Hanafi distinction: a sleeper who lies down or leans on his side breaks it, because the joints go loose, while one who leans on something that would fall if it were removed is to be examined. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436}\n\nSleep, in the Hanafi analysis. If the sleeper is standing, bowing or prostrating and his seat is not off the ground, wudu' is not broken; if his seat has left the ground, it is broken by consensus. If the seat is off the ground but the sleeper has not left it entirely, al-Qaduri says it breaks, the Hanafi view attributed to al-Tahawi, while al-Zayla'i says the sounder view is that it does not, a report of Abu Yusuf from Abu Hanifa. A sleeper in prayer does not lose his wudu' in these cases; one who sleeps outside prayer in the posture of prostration breaks it unless he is in that posture as described. A sick person who prays lying down and falls asleep breaks his wudu', on al-Zayla'i's view, by the hadith on lying down. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} If one sleeps sitting and falls over onto his face or side: if he wakes before falling, or wakes at the moment of the fall, or fell asleep and awoke at once, wudu' is not broken; if he settled after the fall and then woke, it is broken, for he slept reclining; Abu Yusuf says the fall itself breaks it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} The Hanafis say sleep is not itself a cause of impurity; the cause is what the sleeper does not avoid, and the apparent sign, sleep, stands in its place, as travel does in another rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}\n\nThe Malikis have two methods. The first, that of al-Lakhmi, is that the quality of the sleep counts and not the posture: heavy sleep breaks wudu' in any posture, and its sign is that the sleeper is not roused by a loud sound or by a fan falling from his hand; sleep that is not heavy does not break it. The second method makes heavy sleep break in all cases and light sleep break only when lying or prostrate, not standing or sitting; it is attributed to 'Abd al-Haqq. The first is the better-known Maliki view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}\n\nThe Shafi'is hold that sleep breaks wudu' in any form except the sleep of one who is firmly seated on the ground or another firm seat, even if he leans on something that would fall if it were removed, because no emission from the rear passage is then likely. The emission from the front passage is not considered, as it is rare, and the report of Anas that the Companions slept and then prayed without renewing wudu' is read as the sleep of the firmly seated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439} Al-Nawawi gives rules: it is recommended for a firmly seated sleeper to renew his wudu' as a precaution; if one is sure he slept but unsure whether he was seated firmly, no wudu' is due; if one slept sitting and his buttocks left the ground before waking, wudu' is broken, but if they left after he woke or at the same time, or it is not known which came first, it is not broken, since the default is purity. There is no difference between little and much sleep. A sleeper crouched with knees raised has three views, and the preferred is that it does not break. One who sleeps on his back with his buttocks flat is held to break wudu', and if he is strapped in place the well-known view is that it still breaks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}\n\nThe Hanbalis divide sleep into three kinds. The sleep of one who lies down breaks wudu', little or much, on the view of all who hold sleep breaks it. The sleep of one who sits breaks it if much, not if little. The sleep of one standing, bowing or prostrating: Ahmad has three reports, the school view being that it breaks, the second that it breaks only if much, and the third that the bowing does not break while the prostration does. They cite the general wording of the hadith on the eyes as the binding of the buttocks and the hadith 'whoever sleeps should perform wudu''; and for the sitter they cite Safwan ibn 'Assal on not removing socks during travel except after impurity, excrement, urine or sleep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} The seated sitter who leans, or sits crouched, is treated as one who lies down in one view, while Ahmad says light sleep does not break it, and he regards leaning and reclining as more severe than crouching. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} Ibn Qudama holds that a sitter whose seat is firmly on the ground breaks wudu' only through much sleep, since the evidence for the sitter makes no distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} The Hanbalis differ on how much sleep counts. Abu Ya'la says there is no fixed measure and it is what custom reckons. Another view makes it what changes the sleeper from his posture, as when he falls or dreams. Ibn Qudama says there is no fixed measure, since measures are known only from revelation; so whatever shows much sleep, such as the fall of a firmly seated sleeper, breaks wudu', and if one is in doubt whether it was much, it does not break, since purity is certain. He adds that sleep is an overcoming of the mind, so one whose mind is not overcome needs no wudu', and one who doubts whether he slept, or has a thought of uncertain origin, a dream or a passing thought, needs none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441}\n\nSecond view: Abu Musa al-Ash'ari, Abu Mijlaz, Humayd al-A'raj and 'Amr ibn Dinar are reported to hold that sleep does not break wudu' at all, citing the report of Anas about the Companions waiting for the late evening prayer until their heads nodded. Al-Mardawi cites al-Maymuni that it does not break. Sa'id ibn al-Musayyab used to sleep lying down several times while waiting for prayer and then pray without renewing his wudu'. Ibn Qudama suggests they held that sleep is not itself an impurity and that the impurity is doubtful, so certainty is not removed by doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441}\n\nThe Hanbalis on sleep: one who sleeps while he believes his purity remains does not lose it; Ibn Taymiyya chose this view, while al-Khallal called that report an error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nSecond, fainting and swooning break wudu' by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Third, madness, little or much, breaks it by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Fourth, intoxication breaks it by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nFifth, touching the private part of an adult, male, female or intersex, is disputed as a breaker; its detail is under its own headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Sixth, the touching of the skin of a man and a woman is disputed; its detail is under its own headings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}\n\nSeventh, apostasy. The Hanafis, the sounder Shafi'i view, a group of Malikis and a Hanbali report hold that apostasy in itself does not break wudu', but nullifies deeds if it is joined to death; so one who apostatised while in wudu' and then returned to Islam keeps his wudu' if nothing else broke it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} The preferred Maliki view, the sounder Hanbali view and a Shafi'i view hold that apostasy breaks wudu', citing the verse of sura al-Zumar on the nullification of works, and holding that the address is to the community and not to the Prophet, while a report from Musa ibn Mu'awiya from Ibn al-Qasim recommends wudu' after apostasy. Al-Sawi explains that the nullification is of the reward, and that wudu' becomes due on the preferred view because the returning apostate is in the position of one who has just reached maturity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443}\n\nEighth, laughing aloud in prayer. The majority (Malikis, Shafi'is and Hanbalis) hold that it does not break wudu' but invalidates the prayer; the Shafi'is recommend wudu' after it. The Hanafis, and what is reported from al-Hasan, al-Nakha'i and al-Thawri, hold that laughing aloud in a full prayer, meaning one with bowing and prostration, breaks wudu' and invalidates the prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443}\n\nNinth, eating what fire has touched. There are two views. The first, held by the majority and reported from Abu Bakr, 'Umar, 'Uthman, 'Ali, Ibn Mas'ud and others, is that it does not require wudu'. They cite the report of Ibn 'Abbas that the Prophet ate a shoulder of mutton and prayed without wudu', the report of Jabir that the last of the two matters was leaving wudu' after what fire had changed, and the saying that wudu' is for what comes out and not for what goes in, which Ibn Hajar judges weak in its chains. The second, held by 'Umar ibn 'Abd al-Aziz, al-Hasan, al-Zuhri, Abu Qilaba and Abu Mijlaz, is that wudu' is required; they cite the hadith 'perform wudu' from what fire has touched' in Muslim from Abu Hurayra, 'A'isha and Zayd ibn Thabit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17444}\n\nTenth, eating camel meat. There are two views. The first, held by the Hanafis, Malikis, the newer Shafi'i view and a Hanbali view, is that it does not break wudu', like other food; the reason given by al-Kasani is that the breaker is the emission of an impurity or what causes it, and that did not occur. The second, held by the old Shafi'i view, Ishaq, Yahya ibn Yahya, Ibn Khuzayma and Ibn al-Mundhir, is that wudu' is required for camel meat alone, little or much, raw or cooked; they cite the report of Jabir ibn Samura about the man who asked whether to perform wudu' after mutton and camel, and the Prophet's answer to perform it after camel, and the report of al-Bara'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445} The Hanbali detail: the school view is that camel meat breaks wudu' whether eaten knowingly or not, raw or cooked; Ahmad has a report that raw meat breaks it but cooked does not; another that it breaks in no case, chosen by Yusuf al-Jawzi and Ibn Taymiyya; and a third that it breaks only if the prohibition was known, chosen by al-Khallal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} The other parts of the camel, such as the hump, fat, liver and paunch, do not break it on the school view; drinking camel's milk or the broth of its meat does not, and one report from Ahmad says drinking its milk does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nEleventh, eating forbidden food. The Hanbali reports differ: forbidden food breaks wudu', or forbidden meat in every case, or only pork. The school view is that eating meat other than camel meat does not break it, whether lawful or forbidden, since the rule for camel meat is one that is not understood by its meaning and so is not extended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nTwelfth, washing the dead. The majority do not count it among the breakers; the Hanafis say wudu' is recommended after washing the dead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446}\n\nThe sounder Hanbali school view is that washing the dead breaks wudu'; some Hanbalis allow that it does not, when the dead person was washed in a shirt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447}\n\nTwelfth, doubt about whether one has wudu' or not. The Malikis hold that doubt is a breaker, since the duty is not discharged without certainty; their three cases are: one who doubts, after knowing his earlier purity, whether a breaker occurred; one who doubts, after knowing his impurity, whether wudu' occurred; and one who knows both purity and impurity and doubts which came first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447} The majority hold that doubt about whether wudu' remains or has ended is not a breaker: one who is certain he was pure and doubts whether a breaker occurred, or the reverse, acts on the earlier certainty. They cite the hadith in Muslim about a man who feels something in his belly and does not know whether anything came out, who is not to leave the mosque until he hears a sound or smells something. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17448}\n\nThirteenth, backbiting and foul speech. A report from Ahmad holds that backbiting, obscenity and the like, including tale-bearing, lying, slander and false witness, break wudu'; 'A'isha is reported to have said that one performs wudu' after good food but not after a foul word that he utters. The Hanafis and Shafi'is recommend the proper wudu' after foul speech such as backbiting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17448}"
  es: "Wudu' (de wada'a, ser justo y limpio) es el acto, y el agua utilizada para él, en el sentido léxico. Los juristas lo definen: los Hanafi como lavar y limpiar miembros específicos; los Malikis como una purificación con agua de cuatro miembros de una manera específica; los Shafi'is como actos específicos iniciados por la intención; y los Hanbalis como usar agua pura en los cuatro miembros de la manera prescrita, en orden y en sucesión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365} Ghusl es lavar todo el cuerpo de una manera específica. Tanto wudu' como ghusl eliminan una impureza ritual, la menor y la mayor. Tahara es el término más amplio para eliminar la impureza y eliminar su efecto. Tayammum es limpiarse la cara y las manos con tierra o arena limpia de una manera específica, y sirve para ambas impurezas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} La mayoría de los juristas sostienen que el wudu' pertenece a revelaciones anteriores, y que lo que es peculiar de esta comunidad es su manera específica o la marca del wudu', las marcas blancas en las extremidades en el Día de la Resurrección, citando relatos de los profetas y de Sara y Jurayj. Una visión malikí, opuesta a la visión shafi'í más sólida, y algunos hanafíes sostienen que el wudu' en sí es peculiar de esta comunidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367} El Wudu' se hizo obligatorio en La Meca junto con la oración; la preposición 'con' se refiere al lugar, no al tiempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} Su base legal es el Corán, la sunna y el consenso. El versículo de la sura al-Ma'ida (citado por sura y aya) es tomado por algunos como prueba de la obligación, mientras que la mayoría lo interpreta como dirigido a aquellos que están en estado de impureza cuando se levantan para orar. La sunna incluye el dicho de que ninguna oración es aceptada sin pureza. La gente de la biografía está de acuerdo en que se hizo obligatorio en La Meca a través de la enseñanza de Gabriel, y la comunidad está de acuerdo en su legalidad y obligación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} La negación de su obligación para la oración es incredulidad; para otros propósitos, como tocar el mushaf, los hanafíes no lo cuentan como incredulidad, porque el versículo es disputado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} Quien deliberadamente deja el wudu' y ora en estado de impureza: los hanafíes dicen que quien toma a la ligera la religión es un incrédulo, como cuando ora deliberadamente sin wudu'; los malikíes dicen que es asesinado por abandonar la pureza como la oración; Los shafi'ís dicen que se le pide que se arrepienta y se le mata como castigo hadd, no como incredulidad; los hanbalíes dicen que quien abandona una condición o pilar acordado es tratado como quien abandona el acto, y quien deja la oración es llamado a ella durante tres días y se le mata si no reza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} La decisión legal varía según el propósito del wudu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} Primero, cuando el wudu' es obligatorio: para la oración, los juristas concuerdan en que es obligatorio para quien se encuentra en una impureza menor y desea ponerse de pie para una oración obligatoria o voluntaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} Los hanafíes lo requieren para la oración fúnebre, que cuentan como una oración; la mayoría también lo exige para la postración de la recitación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} Para el tawaf, los Malikis, Shafi'is y Hanbalis sostienen que es obligatorio para el tawaf obligatorio y voluntario; los hanafis lo consideran necesario (wajib) y lo penalizan: un tawaf obligatorio en una impureza menor requiere un sacrificio, y en una impureza mayor, un camello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} Para tocar el mushaf, la mayoría lo considera obligatorio, citando el verso de la sura al-Waqi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} Segundo, donde es sunna: los hanafíes, hanbalíes y shafiíes, excepto al-Baghawi, sostienen que el wudu' antes de dormir es sunna, en el hadiz sobre acostarse sobre el lado derecho después del wudu', reportado en los dos Sahihs como se cita en la nota al pie del libro. Los malikíes lo llaman recomendado; una opinión malikí es que para un junub antes de dormir es sunna; otra que es obligatorio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} Tercero, donde es recomendado: un wudu' que no es una condición para la validez del acto sino parte de su perfección. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} Se recomienda para recitar el Corán y leer hadices, para el recuerdo de Dios, para la llamada a la oración y para el iqama (sobre el cual los juristas difieren), para el sermón, para estudiar conocimiento religioso, para estar en 'Arafat y para el sa'y entre Safa y Marwa, y para visitar la mezquita del Profeta y su tumba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} La renovación del wudu' es objeto de controversia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} Para un junub, los hanafíes, shafi'ís y hanbalíes (la mayoría) recomiendan el wudu' antes de comer, beber, reanudar el coito y dormir; los malikíes sostienen que el junub no tiene wudu' para comer, beber o reanudar el coito, pero se lava las manos y sus partes íntimas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} Los hanafíes también recomiendan mantener el wudu' constante renovándolo cada vez que se rompe, y recomiendan que deje una diferencia legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} Cuarto, dónde está permitido: los malikíes sostienen que el wudu' permitido es para limpieza y enfriamiento; Qadi Iyad menciona el wudu' antes de entrar en presencia de gobernantes o abordar un barco en peligro, y dice que puede ser recomendable; al-Hattab se inclina por la recomendación para todo excepto limpieza y enfriamiento. Tal wudu' no elimina la impureza a menos que se pretenda hacerlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375} Quinto, wudu' prohibido: para los malikíes, renovar el wudu' antes de que se haya realizado un acto de adoración con él, o wudu' para un propósito para el cual no fue prescrito o permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375} Mérito del wudu': muchos hadices sobre la eliminación de los pecados por medio de él: la pureza es la mitad de la fe; el informe de 'Uthman de que quien realiza el wudu' como lo hizo el Profeta tiene perdonados sus pecados anteriores; el hadiz de 'Umar sobre las ocho puertas del Paraíso; y el hadiz de Abu Hurayra sobre las marcas radiantes de la comunidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376} Las condiciones del wudu' son de tres tipos: condiciones de obligación, de validez y de ambas; la primera de las condiciones de obligación es el intelecto, ya que no se dirige a quien carece de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376} El lavado requerido: la mayoría (Hanafis, Shafi'is y Hanbalis) sostienen que es suficiente que el agua fluya sobre una extremidad, sin frotar; los Malikis y al-Muzani requieren frotar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} Para los Hanafis, lavar significa verter agua de manera que gotee, incluso una sola gota; Abu Yusuf acepta simplemente mojar el lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} Para los Shafi'is, lavar significa que la extremidad sea lavada, ya sea por el adorador, otra persona o ningún acto en absoluto, como la lluvia cayendo sobre ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} El rostro es lo que está cubierto; toda su superficie exterior se lava. Su ancho corre entre las orejas, y su longitud desde la línea del cabello en la parte superior de la cabeza hasta la barbilla inferior. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Los malikíes y hanbalíes miden la longitud para un hombre sin barba hasta la línea del cabello y para un hombre barbudo hasta el final de la barba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Cabello colgante más allá del contorno del rostro: los hanafíes no requieren que se lave; Los shafi'ís requieren que se laven las superficies externas e internas si es fino, y solo la superficie externa si es grueso, con una opinión que no requiere nada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Vello facial: los hanafíes no requieren lavar las raíces del vello grueso de las cejas, el bigote y la barba debido a la dificultad, pero el vello fino debe lavarse por fuera y por dentro hasta la piel. Los malikíes requieren peinar el vello fino para que el agua llegue a la piel, y dicen que el vello grueso solo necesita lavado externo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384} Los shafi'ís lavan las pestañas, las cejas, el bigote, las patillas y el vello del labio inferior por fuera y por dentro, y lo mismo para el vello facial de una mujer o persona intersexual; Para la barba de un hombre, el pelo fino se lava por ambos lados y el pelo grueso solo por fuera, y donde se mezclan pelo fino y grueso se lava todo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} Los hanbalíes requieren lavar la barba y cualquier pelo que cuelgue más allá del contorno de la cara, y el pelo grueso del bigote, las cejas, el labio inferior y de una mujer o persona intersexual; se recomienda peinar la barba, el hadiz sobre el puñado de agua debajo de la barbilla se cita en la nota al pie del libro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} El ojo: el borde del párpado se lava con la cara; se debe quitar la costra del párpado. La mayoría no lava el interior del ojo con la cara, porque el Profeta no lo hizo y porque el agua caliente o fría puede dañarlo; un informe de Ahmad lo requiere cuando no hay daño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} Si el interior del ojo está sucio con impurezas, los Malikis, Shafi'is y una opinión de Ahmad requieren lavarlo, mientras que los Hanafis y la escuela Hanbali lo excusan en la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} El crecimiento de la línea del cabello (ghumum), el cabello que cae por debajo de su lugar habitual, se lava con la cara hasta el límite habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} Las sienes (tahdhif), el cabello fino entre la patilla y la línea del cabello que retrocede, son objeto de controversia: la mayoría de los shafi'is, una visión malikí y la visión hanbalí sounder las tratan como parte de la cabeza y no se lavan con la cara; los hanafíes, otra visión malikí, una visión hanbalí y una visión shafi'í, que Ghazali y Rafi'i llaman sounder, las tratan como parte de la cara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} La piel blanca entre la patilla y la oreja: los shafi'is, los hanbalíes y la visión hanafí sobre la que se emiten fatwas sostienen que es parte de la cara; Un informe de Abu Yusuf lo excluye; los malikíes lavan la piel al nivel del lóbulo de la oreja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} Los labios: se lava la parte roja visible cuando los labios se cierran naturalmente; una opinión hanafí dice que el labio sigue a la boca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} Lavar parte de la cabeza con la cara es obligatorio en la opinión mayoritaria, y los shafi'íes añaden parte de la garganta, el área debajo de la barbilla y las orejas, ya que lo que no se puede completar sin la obligación es en sí mismo obligatorio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} La patilla se lava con la cara. Los shafi'íes lavan la parte de la nariz expuesta por una amputación; los malikíes lavan el tabique entre las fosas nasales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388} La mayoría sostiene que el interior de la boca y la nariz no son parte de la cara y no necesitan lavarse en el wudu'; los hanbalíes sostienen que la boca y la nariz son parte de la cara, por lo que el enjuague y el agua de inhalación son necesarios tanto en la purificación menor como en la mayor, citando un hadiz en el que el libro señala que al-Daraqutni juzgó la conexión como una narración mursal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} El templo (sudgh), la parte calva y las líneas de cabello que retroceden: la mayoría sostiene que estos son parte de la cabeza, no de la cara; una visión hanbalí sostiene que el templo es parte de la cara. Al-Shirbini dice que se recomienda lavarlas con la cara debido al desacuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} Los malikíes lavan los pliegues de la frente y cualquier hueco del párpado si el agua puede llegar a él frotando, y el resto se cae. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} Las orejas: al-Zuhri incluyó las orejas en la cara, citando un hadiz sobre la creación de la cara. La mayoría responde que las orejas son parte de la cabeza, citando el dicho de que las dos orejas pertenecen a la cabeza y el relato de que el Profeta se limpió las orejas con la cabeza, y que las orejas estaban unidas a la cara solo porque la ven, como una cosa toma el nombre de lo que la une. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390} Si el cabello se lava y la piel debajo se vuelve visible después, los Hanafi, la opinión preferida de Maliki y los Hanbalis sostienen que no se requiere nada más y no se repite el wudu', porque el deber pasó al cabello; los Shafi'is en la opinión más sólida, una opinión Maliki e Ibn Jarir requieren lavar la piel recién visible, por analogía con un pie que se muestra por encima de un calcetín limpio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390} La segunda obligación: lavarse las manos hasta los codos. Es un pilar y una obligación acordada por el Corán, por el relato de Abu Hurayra que describe el wudu' del Profeta, y por consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} La mayoría (los malikíes, shafi'ís, hanbalíes en la visión de la escuela y los hanafíes excepto Zufar) sostienen que los codos deben lavarse con las manos, ya sea que 'to' en el versículo signifique 'con' o marque un límite que sea del mismo tipo que lo que limita; citan el hadiz de 'Abbad al-Abdi que describe el agua corriendo sobre los codos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} Zufar, una visión malikí y una visión de Ahmad sostienen que el codo no está incluido, por analogía con la noche en el versículo sobre el ayuno; otra visión malikí lo incluye como precaución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} Si parte de la extremidad que se va a lavar está cortada, el resto debe lavarse por acuerdo, en el hadiz 'haz lo que puedas de lo que te ordeno' y porque lo más fácil no se deja de lado por lo más difícil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} La regla para un brazo cortado en el codo continúa más allá de la p.17391 y aún no se lee; esta parte del encabezado no está completa. Amputación en el codo: los juristas que requieren que el codo se lave lavan el lugar del corte. Los Hanafis, la escuela Hanbali, la opinión más sólida de Shafi'i y una opinión Maliki requieren lavar el hueso que es el extremo superior del brazo, porque los dos huesos adyacentes deben lavarse, y si uno está ausente se lava el otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} Los malikíes y una opinión shafi'í contra el sounder no requieren nada en el corte, ya que el codo pertenece al antebrazo y el corte lo ha tomado; a menos que se sepa que una parte del codo permanece en la parte superior del brazo, en cuyo caso se lava el lugar del corte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} Amputación por encima del codo: el deber desaparece porque su lugar ha sido eliminado, pero los shafis recomiendan lavar lo que queda de la parte superior del brazo para que la extremidad no carezca de pureza; si el corte está en el hombro, se recomienda lavar el lugar del corte con agua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} Un dedo, mano o brazo extra: los hanafíes, malikíes, shafi'ís y el juez hanbalí al-Qadi lavan un dedo o mano extra que crece en el lugar de obligación junto con el original. Si crece fuera del lugar de obligación, como en el hombro o la parte superior del brazo, la mayoría de los juristas lavan la parte que se encuentra frente al lugar de obligación, mientras que la opinión más sólida de Hanbali no requiere nada para un crecimiento adicional distinto fuera de ese lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} Uñas y lo que hay debajo de ellas: los Hanafis, Shafi'is y Hanbalis requieren lavar la uña incluso cuando es larga, porque está unida a la mano por creación y por lo tanto cae dentro del nombre de la mano. Los Malikis y una opinión Hanbali sostienen que una pequeña suciedad debajo de la uña no daña el wudu' incluso si bloquea el agua, y al-Mardawi llama a esta la opinión más sólida, porque es común, por lo que el Profeta habría tenido que explicarlo si fuera una condición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393} Las fatwas hanafíes afirman que un punto restante de masa o arcilla seca o húmeda en la raíz de la uña impide su validez, mientras que el tinte de henna o masa no lo hace; una uña larga requiere que el agua llegue debajo de ella y una corta no; las uñas que van más allá de las puntas de los dedos deben lavarse por acuerdo. El libro informa que algunos hanafíes distinguen a los habitantes de la ciudad de los aldeanos, y que al-Dabusi dio una fatwa de validez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} Los shafi'ís requieren lavar el vello de la mano, por fuera y por dentro, incluso si es grueso, y si es tan grueso que no llega a la piel, solo la parte visible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} Los malikíes, en su opinión preferida, requieren el lavado de los espacios entre los dedos, las articulaciones y el pliegue de las yemas de los dedos; un anillo que está permitido a un hombre o una mujer no necesita ser movido, aunque un anillo prohibido debe ser retirado, y un anillo suelto debe ser movido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} Una mano extra: los hanafíes, malikíes, shafiíes y hanbalíes requieren lavar una mano extra que crece en el lugar de obligación. Si crece fuera del lugar, los hanafíes, shafiíes y una opinión hanbalí requieren lavar lo que se encuentra frente al lugar de obligación; los malikíes requieren todo si tiene su propio codo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} Para los Hanafis, si una persona tiene dos manos, la que usa para agarrar es la original y se lava, mientras que la otra es adicional; los Shafi'is requieren lavar una mano adicional que no se distingue de la original. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} Un pliegue de piel colgante en la parte superior del brazo: los Hanafis y los Shafi'is requieren lavar solo la parte opuesta al lugar de obligación, mientras que los Hanbalis requieren lavar un pliegue arrancado de la parte superior del brazo que cuelga por el antebrazo, como un dedo adicional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} Los juristas lavan completamente el pliegue del antebrazo; si su cabeza está unida a la parte superior del brazo, se lava la parte opuesta al lugar de obligación, y la parte que se separa de la extremidad se lava por su parte inferior. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} La tercera obligación: limpiarse la cabeza. Se acepta como un pilar u obligación, por el Corán, por las descripciones del wudu' del Profeta, incluyendo el relato de 'Uthman, y por consenso. Limpiarse es pasar una mano mojada sobre la cabeza sin agua corriente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} Las preguntas sobre limpiarse la cabeza comienzan aquí, empezando por la cantidad que es suficiente, sobre la cual los juristas difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} Limpiarse la cabeza: los malikíes en su opinión preferida y los hanbalíes en la opinión más sólida requieren limpiar toda la cabeza, piel y cabello, desde la línea del cabello habitual en la parte frontal hasta la concavidad de la nuca, junto con el cabello de las sienes; el hueso que sobresale y pertenece a la cara no se limpia sino que se lava con la cara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} Otras opiniones malikíes: Ashhab requiere solo la mitad, un informe dice que el flequillo es suficiente, Muhammad ibn Maslama requiere dos tercios, y Abu al-Faraj un tercio, con la mano pasada hacia atrás por debajo del cabello para una cobertura completa, siendo el regreso recomendado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} Los hanbalíes requieren limpiar toda la parte exterior de la cabeza en la opinión más sólida; un informe de Ahmad permite la mayor parte de ella, los juristas discrepan sobre cuánto es la mayor parte; otro permite el flequillo, otro cualquier parte sin límite. Limpiar solo la piel no es suficiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} Los hanafíes sostienen que limpiar la cabeza una vez por encima de las orejas es un pilar; la cantidad en la opinión más famosa es un cuarto de la cabeza, que es la opinión preferida de la escuela, con un informe del flequillo y un tercio de tres dedos de ancho, el último, que el Badai' llama el informe de los libros principales, y sobre el cual el Zahiriyya dice que se dan fatwas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} Los shafi'íes requieren cualquier limpieza de parte de la piel o parte del cabello dentro del contorno de la cabeza, y permiten tanto la piel como el cabello como la parte; la cabeza es lo que se levanta y se eleva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} Método: la visión sonora de los hanafíes requiere tres dedos para limpiar; uno o dos dedos no son suficientes en la visión aparente, mientras que el índice y el pulgar extendidos con la palma entre ellos cuentan como tres. Los hanbalíes permiten cualquier manera, con la mano o con un paño intermedio, en la visión sonora. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} Cabello que cae por debajo de la cabeza: los hanafíes, shafiíes y hanbalíes no requieren limpiarlo; los malikíes requieren limpiar el cabello que cuelga, por muy largo que sea, ya que es cabello de la cabeza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399} Lavar la cabeza en lugar de limpiarla: la mayoría lo permite, ya que es limpiar y más; los hanbalíes en la opinión más sólida requieren que se pase la mano por encima de la cabeza, mientras que un informe de Ahmad permite lavar sin pasar la mano. Los hanafíes, la opinión malikí más sólida y los hanbalíes sostienen que lavar la cabeza al principio en lugar de limpiarla es desaconsejable, ya que contradice lo que se ordena; Algunos malikíes, una visión shafi'í y una visión hanbalí niegan que sea suficiente, ya que no se llama frotar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399} Afeitarse el cabello después del wudu': la mayoría sostiene que esto no lo afecta. Los hanafíes sostienen que el wudu' no se repite, ya que frotar el cabello no es un sustituto de frotar la piel. Una visión malikí requiere repetir el frotamiento después del afeitado, lo que al-Dasuqi llama débil; al-Tabari también requiere repetición. Ibn Rajab informa que Ahmad recomendó mojar la cabeza con agua después del afeitado sin requerirlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} Repetición de la limpieza: los hanafíes, malikíes y hanbalíes sostienen que se hace una sola vez, ya que la repetición se convierte en lavado, y los hanbalíes citan que la mayoría de los que describieron el wudu' del Profeta mencionan una limpieza, una opinión que apoya Abu Dawud; los shafi'ís recomiendan tres limpiezas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} Cabello trenzado: para los malikíes, el cabello que está trenzado por sí mismo no necesita deshacerse, por muy firme que sea; el cabello trenzado con tres hilos debe deshacerse, sea cual sea su firmeza; el cabello trenzado con menos hilos debe deshacerse si es firme. Al-Sawi señala que las mujeres pueden seguir la visión Shafi'i o Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} El frotamiento sobre un turbante se trata bajo su propio epígrafe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} La cuarta obligación: lavar los pies hasta los tobillos. Hay cuatro opiniones. La primera, sostenida por la mayoría, es que lavar los dos pies es un pilar del wudu'. Los juristas informan consenso: Abd al-Rahman ibn Abi Layla informa que los Compañeros acordaron lavar los pies, al-Mawardi dice que la mayoría de los juristas sostienen lavar y no frotar, y al-Nawawi informa que los musulmanes acordaron la obligación de lavar los pies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402} La segunda opinión es que la obligación es frotar y no lavar, atribuida a 'Ali, Ibn 'Abbas, Anas y al-Sha'bi, quienes se basaron en la lectura genitiva de la palabra para pies en el versículo de la sura al-Ma'ida. Se registra que 'Ali se retractó de esto, ordenando lavar los pies; Ibn Qudama dice que ningún jurista, aparte de los mencionados, sostuvo la opinión de frotar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} La tercera opinión, de al-Hasan al-Basri, al-Jubba'i y un informe de al-Tabari, es que el adorador puede elegir entre lavar y frotar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} La cuarta, sostenida por algunos zahiríes, es que tanto el lavado como la limpieza deben realizarse, ya que las dos lecturas en un versículo cuentan como dos versículos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} La mayoría requiere que los tobillos se incluyan en el lavado; solo Zufar no estuvo de acuerdo. Los tobillos son los dos huesos que sobresalen en el pie de la pierna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} Segundo, las obligaciones disputadas del wudu'. Primero, la intención: la mayoría sostiene que es una condición sin la cual el wudu' no es válido; algunos lo consideran una recomendación y otros un pilar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} Abandonar la intención: si el adorador abandona la intención después de terminar el wudu', los malikíes, la opinión shafi'í más sólida y la opinión hanbalí más sólida sostienen que no afecta al wudu'; la otra opinión hanbalí sostiene que es nulo. Si la abandona durante el wudu', los shafi'íes en la opinión más sólida dicen que no es nulo y renueva la intención para el resto, los hanbalíes en la opinión más sólida dicen que lo que ha pasado es nulo y debe comenzar de nuevo, y los malikíes en la opinión preferida no excusan el abandono, por lo que es nulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404} Segundo, continuidad (muwala): lavar los miembros en sucesión, de modo que el primero no se seque antes de que se comience el siguiente. Los hanafíes, la nueva visión shafi'í, una visión malikí y un informe hanbalí lo consideran recomendable, una visión de Ibn 'Umar, al-Hasan, Sa'id ibn al-Musayyab y al-Thawri. Los malikíes en la visión preferida, la antigua visión shafi'í y la escuela hanbalí lo consideran obligatorio, una visión de 'Umar ibn al-Khattab y al-Awza'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404} Tercero, orden (tartib) en el lavado y secado: los shafi'ís, la escuela hanbalí y una visión malikí lo consideran un pilar, una visión de 'Uthman, Ibn 'Abbas, Qatada, Abu Thawr, Abu 'Ubayd e Ishaq. Argumentan a partir del versículo, en el que la limpieza se encuentra entre los dos lavados, y que cada relato del wudu' del Profeta da la orden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405} Los hanafíes, la opinión malikí preferida, algunos shafi'ís y un informe de Ahmad sostienen que la orden es una sunna, una opinión de Ibn Mas'ud y otros, argumentando que el versículo usa 'y' que no implica orden y que una sola inmersión elimina la impureza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406} Cuarto, frotar (dalk): para los malikíes es pasar la mano sobre la extremidad moderadamente, ya sea que se haya quitado la suciedad o no, incluso después de verter agua y antes de que se seque. La mayoría de los hanafíes, shafi'ís y hanbalíes, y una opinión malikí, lo consideran una sunna, y los shafi'ís añaden que uno debe ser minucioso con los talones, especialmente en invierno, citando el dicho ¡Ay de los talones del Fuego! La opinión malikí preferida lo convierte en una obligación, citando un dicho a Aisha de frotar su cuerpo con su mano, un informe que el libro señala que no se puede rastrear hasta una fuente. Frotar (dalk): los malikíes tienen tres opiniones. La opinión preferida lo hace obligatorio, porque es una condición del nombre del lavado, y sus defensores citan la instrucción a 'A'isha de frotar su cuerpo; la segunda, de Ibn 'Abd al-Hakam, sostiene que no es obligatorio, ya que el nombre del lavado se cumple sin él; la tercera lo sostiene obligatorio no en sí mismo sino para asegurar que el agua llegue a la piel, de modo que quien esté seguro de que el agua ha llegado a ella después de una larga estancia queda eximido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407} Las sunnas del wudu'. Primero, la basmala al principio. La mayoría de los hanafíes y shafi'ís, y un informe de Ahmad, lo hacen una sunna; la opinión preferida de Maliki lo hace recomendable, otra opinión de Maliki lo desaprueba; los hanbalíes lo hacen obligatorio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} Para los Hanafi, cualquier recuerdo de Dios es suficiente, pero las palabras transmitidas del Profeta y los Salaf son 'En el nombre de Dios Todopoderoso, y alabanza pertenece a Dios por el Islam', mientras que algunos prefieren la basmala completa; los Shafi'is dicen que lo mínimo es 'En el nombre de Dios' y lo más completo es la fórmula completa con alabanza por el Islam y por la pureza del agua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} Los Hanbalis requieren las palabras 'En el nombre de Dios' y ninguna otra frase es suficiente, en la opinión más común. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} Los hanafíes cuentan la basmala en cada miembro como una cortesía, y citan un informe de al-Bara' ibn 'Azib acerca de los dos testimonios en cada miembro; al-Ayni llama a su cadena débil. La opinión de la escuela hanbalí no la recomienda en cada miembro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409} Segundo, lavarse las manos hasta las muñecas al principio, que es una sunna siguiendo la práctica del Profeta; si las manos están impuras, lavarlas es obligatorio por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409} Tercero, enjuagarse la boca: la mayoría lo considera una sunna, y los hanbalíes una obligación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409} Cuarto, aspirar agua por la nariz: la mayoría lo considera una sunna, y los hanbalíes un pilar o una obligación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409} Quinto, sonarse la nariz, una sunna para las cuatro escuelas, sobre el hadiz 'cuando aspires, sopla'. Para los malikíes es expulsar el agua de la nariz con el aliento con el índice y el pulgar de la mano izquierda colocados sobre ella; para los shafi'íes es eliminar lo que hay en la nariz con el dedo meñique de la mano izquierda; los hanbalíes recomiendan hacerlo con la mano izquierda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} Sexto, limpiarse toda la cabeza. Los malikíes en la opinión preferida y los hanbalíes lo hacen obligatorio, como ya se ha dicho, mientras que los hanafíes y los shafi'ís lo hacen una sunna. Los hanafíes citan un relato de limpiarse toda la cabeza y el relato del Profeta limpiándose el flequillo, por lo que limpiarse un cuarto es la obligación y limpiarse toda es la sunna; dicen que quien persistentemente omite limpiarse toda la cabeza sin excusa peca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} Los shafi'ís recomiendan limpiarse toda la cabeza para seguir la práctica y dejar el desacuerdo de aquellos que lo requieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} Preguntas sobre el lavado de la cabeza: primero, la repetición. Los hanafíes sostienen que toda la cabeza se lava una vez con una sola agua, y los informes de tres lavados se toman como lavarse con una sola agua; al-Hasan informa de Abu Hanifa que tres lavados con una sola agua son sunna. Tres lavados con agua fresca son, en las opiniones hanafíes, desaconsejados, una bid'a, o permitidos; el libro cita la preferencia de Ibn 'Abidin por desaconsejarlo. Los shafi'íes recomiendan lavarse toda la cabeza tres veces, un lavado tras otro, y lavarse parte de la cabeza tres veces cuenta como tres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411} Segundo, la manera recomendada. La opinión preferida de la escuela Hanafi es colocar ambas palmas y los dedos en la parte delantera de la cabeza y llevarlos hacia la nuca, limpiando toda la cabeza, y luego limpiar las orejas con dos dedos, ya que las orejas forman parte de la cabeza. Los shafi'is dicen que la sunna es colocar las manos en la parte frontal de la cabeza con el dedo índice unido al otro, los pulgares en las sienes, para tirar de ellas hacia atrás hasta la nuca y traerlas de vuelta al lugar donde comenzaron, donde hay cabello que se gira; una persona sin ese cabello solo las tira hacia atrás. Los hanbalis dicen que repetir el frotamiento de la cabeza no es recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411} Las sunnas de frotar la cabeza: quien frota regresa las manos a donde comenzó. al-Tirmidhi informa el relato de Abu Hayya del wudu' de 'Ali, en el cual la cabeza se frota una vez, y Abu Dawud informa que Ibn 'Abbas vio al Profeta frotarse la cabeza y las orejas con un solo frotamiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} Ahmad recomienda repetir la limpieza con agua fresca, una opinión apoyada por Abu al-Khattab e Ibn al-Jawzi, y lo mismo para las orejas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} Los malikíes consideran una sunna el regreso de la mano sobre la cabeza a su punto de partida, ya que el cabello largo no puede cubrirse sin ella. El regreso es una sunna solo si la humedad de la limpieza obligatoria permanece en la mano, y renovar el agua para ello es desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} La manera de limpiarse la cabeza: los malikíes y shafiíes toman agua en la mano derecha y la vierten en la palma izquierda, comienzan por el frente, juntan las puntas de los dedos y colocan los pulgares en las sienes, tiran de las manos hacia atrás hasta la nuca y las regresan al punto de partida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Para los hanbalíes, la manera recomendada es tirar de las manos de adelante hacia atrás y regresarlas al punto de partida, siguiendo el relato de 'Abd Allah ibn Zayd; luego los dedos índices entran en las aberturas de las orejas y los pulgares limpian las orejas externas. Un hombre con cabello que se despeinaría al regresar no regresa, según el informe de al-Rubay' bint Mu'awwidh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Ahmad, al ser preguntado sobre cómo se limpia una mujer, describió el mismo movimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Séptimo, limpiarse las orejas. Los hanafíes, la opinión preferida malikí y los shafi'ís sostienen que limpiarse tanto la oreja externa como la interna es una sunna, en el hadiz de al-Miqdam ibn Ma'di Karib que describe la limpieza de las orejas y la inserción de los dedos en las aberturas de las orejas. La mayoría considera la oreja externa como la parte junto a la cabeza y la oreja interna como la parte que mira hacia afuera; una opinión malikí invierte esto, y los malikíes dicen que la oreja está hecha como una rosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} Los malikíes cuentan tres sunnas para los oídos: limpiar las partes externas e internas, limpiar las aberturas y renovar el agua para ellos. Los shafi'íes recomiendan agua fresca para los oídos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} Los hanbalíes y algunos malikíes hacen obligatorio limpiar los oídos, porque pertenecen a la cabeza; recomiendan agua fresca para ellos después de limpiar la cabeza, y la piel blanca sobre las orejas es parte de la cabeza y se limpia con ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} El método recomendado por los Hanbali es colocar los dedos índices en las aberturas y limpiar las orejas externas con los pulgares, y las partes cartilaginosas internas no son necesarias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} Los Hanafis sostienen que limpiar toda la cabeza y ambas orejas con agua es suficiente, ya que son parte de la cabeza; su manera preferida es la descrita anteriormente, y limpiar las orejas con los restos húmedos es suficiente, mientras que el agua fresca es mejor para resolver la discrepancia; recomiendan colocar el dedo meñique húmedo en la abertura de la oreja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} Octavo, peinar la barba y el cabello de la cara se recomienda en general, y el desacuerdo se trata en el lavado de la cara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} Noveno, pasar los dedos entre los dedos de las manos y los pies se trata en su propio encabezado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} Décimo, repetir cada lavado tres veces es una sunna entre los juristas; los hadices varían: una vez, con la afirmación de que este es el wudu' sin el cual la oración no es aceptada; dos veces, con la afirmación de que duplica la recompensa; y tres veces, con la declaración de que es su wudu' y el de los profetas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} Undécimo, el miswak. La mayoría sostiene que usar el miswak es una sunna en el wudu', citando el dicho de que si no hubiera sido una dificultad para su comunidad, habría ordenado el miswak con cada wudu'. Los hanafíes lo llaman una sunna fuertemente confirmada; los malikíes, en su opinión preferida, una recomendación; al-Dasuqi señala que el hadiz sugiere una sunna incluso en contra de la opinión preferida. Sus reglas detalladas están bajo su propio encabezado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} Duodécimo, el frotamiento sobre el turbante es disputado y se trata bajo su propio encabezado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} Decimotercero, no desperdiciar agua, que se trata bajo su propio encabezado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417} Decimocuarto, comenzar con el lado derecho de las manos y los pies. Los Hanafis, Malikis y la visión Hanbali más sólida lo consideran recomendado, citando el informe de 'Aisha de que al Profeta le gustaba comenzar por la derecha en todos sus asuntos, y los relatos de 'Uthman y 'Ali que describen que comenzó con la derecha antes que la izquierda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417} Los Shafi'is y algunos Hanafis lo consideran una sunna, en el dicho de que cuando realizas el wudu' comienzas con tus lados derechos; Ibn al-Hammam dice que es una sunna debido a su práctica constante. Un informe hanbalí, citado por al-Razi y rechazado por al-Zarkashi, lo hace obligatorio; otro dice que omitirlo es desaconsejable. Ibn Qudama informa consenso de que quien comienza con la izquierda no necesita repetir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} Decimoquinto, prolongar las marcas brillantes (ghurra y tahjil): los shafi'ís y la visión hanbalí más sólida lo consideran una sunna, es decir, lavar más allá del lugar obligatorio de la cara, las manos y los pies. Los hanafíes lo consideran una cortesía: para la cara llega al costado del cuello con la parte frontal de la cabeza, y para los brazos y las piernas llega a la parte superior del brazo y la espinilla. La base es el dicho sobre la comunidad que es llamada radiante con marcas blancas del wudu'; los shafis y hanbalis sostienen que esta es una característica peculiar de esta comunidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} Los malikíes y un informe hanbalí no lo recomiendan, y Malik lo considera desaconsejable, como un exceso en la religión; interpretan la 'prolongación' en el dicho como continuar el estado de pureza, no como un lavado adicional. Al-Dasuqi distingue los dos sentidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419} Decimosexto, mirar hacia la qibla mientras se realiza el wudu': los hanafíes y malikíes lo consideran una cortesía, limitada por lo que es posible sin dificultad; Los shafi'ís y los hanbalíes lo consideran una sunna, ya que es apropiado para todo acto de adoración a menos que haya una razón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419} Decimoséptimo, sentarse en un lugar elevado, una cortesía para los hanafíes y los malikíes, para mantenerse alejado del agua utilizada en el wudu' y para proteger la ropa de las gotas; los shafi'ís recomiendan evitar el rocío. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419} Decimoctavo, realizar el wudu' en un lugar limpio, una recomendación para los hanafíes y los malikíes. A los malikíes no les gusta el wudu' en un retrete, porque tal lugar no es para la pureza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} Decimonoveno, no buscar ayuda. Los shafi'ís y los hanbalíes lo consideran una sunna; los hanafíes lo consideran una cortesía. El Profeta fue ayudado por al-Mughira ibn Shu'ba para verter agua, y Safwan ibn 'Assal vertió agua sobre él, pero no buscar ayuda es mejor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} Los shafi'ís distinguen ayudar con el vertido, que es desaconsejable pero no pecaminoso, de ayudar trayendo agua, que está permitido, y es obligatorio cuando la persona no puede purificarse de otra manera, por una razón como una enfermedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420} Ibn Mawdud dice que la ayuda es desaconsejable excepto cuando uno no puede; Ibn 'Abidin dice que la ayuda para verter, sacar o traer agua no es desaconsejable en absoluto, mientras que la ayuda para lavar o secar es desaconsejable sin razón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17420}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421} Vigésimo, secarse el cuello: los Hanafis y un Ahmad informan que es una recomendación, y algunos dicen que es una sunna. Los Malikis, Shafi'is y la visión Hanbali más sólida no lo recomiendan, ya que no hay nada informado al respecto; al-Nawawi lo llama una innovación, y los Malikis dicen que es desaconsejable como un exceso en la religión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421} Vigésimo primero, mover el anillo en el wudu': los hanafíes y shafis recomiendan mover un anillo suelto, y también un pendiente; para un anillo ajustado se recomienda si se sabe que el agua llega, y es obligatorio si no. Ahmad ibn Hanbal dice que un anillo ajustado debe moverse, y los detalles continúan en la página siguiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421} El anillo: si el agua llega debajo de él, el wudu' es válido; se informa que el Profeta giró su anillo en el wudu', y si uno duda de si el agua llega debajo de él, se requiere moverlo, ya que por defecto no lo hace. Para los malikíes, un anillo permitido no necesita ser quitado o movido incluso si está ajustado; un anillo prohibido debe ser quitado si está prohibido usarlo, y moverlo es suficiente si está suelto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422} Vigésimo segundo, comenzando por la parte frontal de cada extremidad. Los shafi'is recomiendan comenzar por la parte superior de la cara, las puntas de los dedos y la parte frontal de la cabeza. Los hanafíes y malikíes recomiendan comenzar cada extremidad por su parte frontal: la cara en la línea del cabello, las manos en las puntas de los dedos hasta los codos, la cabeza en la línea del cabello hasta el hueco de la nuca y el pie en los dedos hasta los tobillos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422} Vigésimo tercero, no hablar. Los hanafíes y shafi'is recomiendan el silencio sin necesidad; Los malikíes y la visión hanbalí más sólida consideran que hablar es desaconsejable, y los malikíes e Ibn Muflih dicen que el desagrado se aplica a hablar que no sea el recuerdo de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422} Vigésimo cuarto, saludar a quien realiza el wudu' y devolver el saludo. Los malikíes, algunos shafi'ís y algunos hanbalíes sostienen que saludarlo es prescrito y que la respuesta también lo es; el shafi'í Shaykh al-Islam dice que la respuesta es obligatoria. El Furu' dice que la mayoría de los textos hanbalíes no desaprueban ni el saludo ni la respuesta, mientras que Abu al-Faraj y otros dicen que el saludo es desaconsejable. El libro cita el relato de Umm Hani, quien saludó al Profeta mientras se lavaba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423} Vigésimo quinto, súplica en cada miembro. Los hanafíes, malikíes, la mayoría de los shafi'ís y algunos hanbalíes lo recomiendan. El libro enumera las fórmulas tradicionales para cada miembro; la opinión de al-Ayni, citada con Ibn 'Abidin, es que el informe alcanzó el grado de bueno a través de sus varias cadenas, y que un informe débil puede ser actuado en asuntos de virtud bajo condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424} La opinión shafi'í en una forma y la opinión hanbalí más sólida niegan que sea recomendable; los hanbalíes lo llaman desaconsejable en el sentido de dejar lo mejor; al-Nawawi dice que la súplica en cada miembro no tiene fundamento, e Ibn al-Qayyim dice que las fórmulas populares entre la gente común para cada miembro no tienen origen en la práctica del Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424} Vigésimo sexto, súplica después del wudu'. Los shafi'is y hanbalis recomiendan que el que realiza, mirando hacia la qibla con las manos y los ojos elevados al cielo, diga el testimonio de fe, luego las palabras del relato de 'Umar sobre las ocho puertas del Paraíso, luego las palabras que Tirmidhi agrega al relato de Muslim, luego 'Gloria sea a Ti, oh Dios, y alabado sea, testifico que no hay más dios que Tú, pido Tu perdón y me vuelvo a Ti', del relato de Abu Sa'id en al-Nasa'i que al-Nasa'i juzgó como un relato de las propias palabras de Abu Sa'id. Los shafi'ís y hanbalíes también recitan la sura del Poder tres veces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} Los hanafíes, malikíes y shafi'ís recomiendan bendecir al Profeta después del wudu', y los hanafíes y malikíes añaden una fórmula sobre estar entre los penitentes y los purificados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} Al-Buhuti explica que terminar el wudu' y la oración con la búsqueda del perdón reconoce que las personas no cumplen con lo que Dios les debe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426} Vigésimo séptimo, secar las extremidades. Los malikíes, hanbalíes y la visión shafi'í más antigua permiten secarlas o dejarlas. Los hanbalíes dicen que dejarlas es mejor; los hanafíes consideran el secado como una cortesía; la visión shafi'í más sólida hace que dejarlas sea la sunna a menos que haya una excusa, ya que el secado elimina el rastro de la adoración. Los hanafíes y una visión shafi'í sostienen que el secado es desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426} Vigésimo séptimo, no sacudir la mano ni el agua. Los hanafíes y la opinión shafi'í más sólida recomiendan no estrechar la mano, en el hadiz 'cuando realices el wudu' no estreches las manos, pues son los abanicos de Satanás', que Ibn Hibban consideró un informe rechazado. La opinión hanbalí más sólida y una opinión shafi'í desaprueban sacudirse el agua. Ibn Qudama dice que sacudirse el agua del cuerpo no es desaconsejable, aunque sí lo es sacudir la mano; el autor de Ghayat al-Matlab sostiene que la opinión más sólida es que no es desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427} Vigésimo octavo, beber el agua que queda del wudu'. Los hanafíes y los shafi'íes recomiendan hacerlo inmediatamente después del wudu', en el informe de 'Ali de que el Profeta bebió del agua que le sobró del wudu'; la forma perfecta es beber de pie, mirando hacia la qibla, y algunos dicen que sentarse está permitido. Se dice una súplica por la salud después de beber, que el libro señala que no se ha transmitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428} Vigésimo noveno, dos rak'as después del wudu'. Los hanafíes, shafi'ís y hanbalíes los recomiendan, en el dicho de 'Uqba ibn 'Amir sobre el Jardín para quien realiza bien el wudu' y luego reza dos rak'as con el corazón y el rostro atentos. Los hanafíes y hanbalíes los rezan fuera de los momentos de oración desaconsejada; los shafi'ís sostienen que se pueden rezar en cualquier momento, ya que tienen una causa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428} Trigésimo, renovar el wudu', es decir, realizar el wudu' sobre un wudu' que no se ha roto. Algunos juristas lo llaman una sunna, otros una recomendación, otros lo prohíben antes de que se haga un acto de adoración con él, y un informe de Ahmad dice que no tiene mérito; los detalles están bajo su propio encabezado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428} Trigésimo primero, no usar menos de un mudd de agua. La mayoría recomienda no ir por debajo de un mudd, en el informe de Anas de que el Profeta realizó el wudu' con un mudd. Los Malikis en su opinión más común y una opinión Hanafi sostienen que no se aplica ninguna medida fija, el objetivo es la virtud de la moderación; Ibn 'Abidin relata, citando a al-Hilya, que varios eruditos coinciden en que la cantidad necesaria no es fija. Ibn Shaban de los Malikis dice que menos de un mudd no basta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429} Trigésimo segundo, no soplar en el agua al lavarse la cara, lo cual los Hanafi cuentan entre las cortesías del wudu', y realizar el wudu' con el agua de la gente común. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429} Trigésimo tercero, el orden entre las sunnas. Las escuelas Hanafi y Shafi'i hacen que el orden entre las sunnas sea una sunna, mientras que los Malikis y una visión Hanafi hacen que el orden dentro de cada sunna sea recomendado. Si el orden se invierte entre las sunnas, o entre las sunnas y las obligaciones, no se requiere repetición, ya que un acto recomendado omitido no se ordena de nuevo. Una opinión shafi'í hace obligatorio el orden de las partes recomendadas, por analogía con los pilares de la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430} Trigésimo cuarto, tomar agua en ambas manos para lavarse la cara. La opinión shafi'í más sólida, expuesta en el Mukhtasar de al-Muzani y sostenida por la mayoría de los shafi'ís, es que la manera recomendada es tomar agua en ambas manos, en el relato de 'Abd Allah ibn Zayd de que el Profeta puso sus manos y se lavó la cara tres veces, y porque es más completo. Una opinión shafi'í dice una mano; una tercera opinión de Zahir al-Sarakhsi dice que se recoja con la mano derecha, colocando su dorso en la palma de la izquierda, en el relato de Ibn 'Abbas. Los hanbalíes dicen que recoger con ambas manos, o con la mano derecha unida a la izquierda, es la sunna establecida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431} Los actos desaconsejados (makruhat). Los juristas enumeran varias cosas como desaconsejadas en el wudu'. Primero, golpear la cara u otras extremidades con agua, siendo la cara escogida por su honor; desaconsejado para los hanafíes y shafi'ís. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431} Segundo, la tacañería, es decir, usar solo la cantidad de agua suficiente para humedecer las extremidades sin goteo visible; el agua debe gotear de manera que cada uno de los tres lavados sea seguro; desaconsejado para los hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431} Tercero, la extravagancia, usar más agua de la necesaria legalmente, en el informe de Sa'd, a quien el Profeta pasó mientras realizaba el wudu' y le preguntó si había extravagancia en el wudu'; la respuesta fue sí, incluso por un río caudaloso; y porque es el exceso lo que lleva a la escrupulosidad, y el dicho de que nadie exagera la religión sin ser vencido por ella. Los Hanafis, Malikis, Shafi'is y Hanbalis lo desaprueban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431} Entre los actos desaprobados, los Hanafis y Shafi'is agregan que el agua destinada a quienes se purifican con ella, como el agua de una madrasa, está prohibido desperdiciar, ya que el exceso no está permitido, pues la provisión es para el wudu' adecuado. Ibn 'Abidin limita esto al agua estancada; el agua corriente está permitida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432} Cuarto, realizar el wudu' con el agua que queda de una mujer, es decir, el agua que queda después de su purificación, sin que ella haya bebido de ella ni haya puesto la mano en ella sin intención. Algunos hanafíes, algunos shafi'ís y un relato de Ahmad lo desaprueban por respeto al desacuerdo. Algunos hanafíes, un relato de Ahmad, la visión de la escuela malikí y algunos shafi'ís, incluido al-Baghawi, sostienen que es pura y purificadora, y que usarla no es desaconsejable; citan el relato de Ibn 'Abbas sobre una esposa del Profeta lavándose de una palangana, y el dicho de que el agua no se vuelve impura por un estado de impureza mayor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432} La aparente visión de la escuela Hanbali prohíbe que un hombre se purifique con el agua sobrante de una mujer, en el hadiz de al-Hakam ibn 'Amr al-Ghifari; al-Mardawi dice que esta prohibición es un acto de adoración cuyo significado no se entiende, por lo que está permitido a la mujer misma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433} Quinto, limpiar la cabeza tres veces con agua fresca: los Hanafis y Malikis lo desaprueban, y la escuela Hanbali no recomienda repetir la limpieza de la cabeza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433} Sexto, realizar el wudu' en un lugar impuro, lo cual es desaconsejable porque el agua utilizada en el wudu' debe ser respetada, y para que nada que gotee de las extremidades caiga sobre lo que es impuro. Los hanafíes añaden que arrojar flema al agua o sonarse la nariz en ella es desaconsejable por el bien de la pureza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433} Séptimo, el wudu' en la mezquita. Es desaconsejable excepto en un recipiente o lugar preparado para ello, según los hanafíes, un informe de Ahmad y Malik; los shafi'ís y la opinión hanbalí más sólida lo permiten siempre que no se dañe a nadie ni a la mezquita. Sahnun dice que el wudu' en el patio de una mezquita no está permitido. El libro cita el hadiz de colocar lugares de purificación en las puertas de la mezquita, y al-Haythami señala una ruptura en su cadena. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434} Octavo, verter el agua del wudu' en la mezquita. A los hanbalíes no les gusta, y no les gusta en un lugar pisoteado, como el camino. Los shafi'íes permiten dejar que caiga en el suelo de la mezquita si nadie resulta perjudicado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434} Noveno, wudu' con agua calentada por el sol. La opinión preferida de los malikíes, la opinión de la escuela shafi'í y algunos hanafíes no les gusta; La mayoría de los hanafíes, los hanbalíes, una visión malikí y algunos shafi'ís lo permiten sin desagrado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435} Décimo, dejar de hacer una de las sunnas del wudu'. Los malikíes dicen que es desaconsejable dejar de hacer una deliberadamente, aunque la oración no se invalida al dejarla de hacer; si se deja de hacer deliberadamente o por olvido, se recomienda realizarla para las oraciones que siguen con ese wudu'. Los hanafíes consideran que dejar de hacer un acto recomendado es contrario al mejor curso, y algunos lo llaman desaconsejable por el bien de la pureza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435} Las cosas que rompen el wudu'. Para los hanafíes, romper el wudu' significa sacarlo de su propósito, como el permiso para orar; para los malikíes, es el fin de su norma o el levantamiento de su continuidad para lo que permitía, como la oración. Los juristas difieren en algunos de estos y coinciden en otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435} Primero, lo que se desprende de los dos pasajes, acordados en general, citando los versículos de la sura al-Ma'ida y la sura al-Nisa'. La palabra 'gha'it' es una figura para la necesidad de aliviarse en un lugar hundido. Si alguien viene del lugar sin necesidad, el wudu' no es obligatorio, por consenso. Los juristas distinguen emisiones habituales de raras, y emisiones del pasaje trasero, el pasaje delantero, el pasaje de la esposa u otros lugares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435} Segundo, impurezas que salen de otras partes del cuerpo. Los malikíes y shafi'ís sostienen que estas no rompen el wudu'; solo el lugar que tocan se limpia. Los hanafíes y hanbalíes sostienen que tales impurezas, como el vómito y la sangre, rompen el wudu' en general, con diferencias entre ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} Tercero, pérdida de la mente, por sueño, locura, intoxicación o desmayo. La mayoría de los hanafíes, malikíes, shafiíes y hanbalíes sostienen que dormir rompe el wudu' en general, según el hadiz de que los ojos son la atadura de las nalgas, por lo que quien duerme debe realizar el wudu'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} La distinción hanafí: quien duerme y se acuesta o se apoya de lado lo rompe, porque las articulaciones se aflojan, mientras que quien se apoya en algo que se caería si se quitara debe ser examinado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} El sueño, en el análisis hanafí. Si quien duerme está de pie, inclinado o postrado y su asiento no está separado del suelo, el wudu' no se rompe; si su asiento se ha separado del suelo, se rompe por consenso. Si el asiento está levantado del suelo pero el durmiente no lo ha abandonado por completo, al-Qaduri dice que se rompe, la opinión hanafi atribuida a al-Tahawi, mientras que al-Zayla'i dice que la opinión más sólida es que no se rompe, un informe de Abu Yusuf de Abu Hanifa. Un durmiente en oración no pierde su wudu' en estos casos; uno que duerme fuera de la oración en la postura de postración la rompe a menos que esté en esa postura como se describe. Una persona enferma que reza acostada y se queda dormida rompe su wudu', según la opinión de al-Zayla'i, por el hadiz sobre acostarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} Si uno duerme sentado y se cae de cara o de lado: si se despierta antes de caer, o se despierta en el momento de la caída, o se quedó dormido y se despertó de inmediato, el wudu' no se rompe; si se sentó después de la caída y luego despertó, se rompe, porque durmió reclinado; Abu Yusuf dice que la caída misma la rompe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} Los hanafíes dicen que el sueño no es en sí mismo una causa de impureza; la causa es lo que el durmiente no evita, y el signo aparente, el sueño, está en su lugar, como lo hace el viaje en otra regla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438} Los malikíes tienen dos métodos. El primero, el de al-Lakhmi, es que la calidad del sueño cuenta y no la postura: el sueño profundo rompe el wudu' en cualquier postura, y su señal es que el durmiente no se despierta por un sonido fuerte o por un abanico que se le cae de la mano; El sueño que no es profundo no lo rompe. El segundo método hace que el sueño profundo se rompa en todos los casos y el sueño ligero se rompa solo cuando se está acostado o postrado, no de pie o sentado; se atribuye a 'Abd al-Haqq. El primero es la opinión más conocida de Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438} Los Shafi'is sostienen que el sueño rompe el wudu' en cualquier forma excepto el sueño de quien está firmemente sentado en el suelo u otro asiento firme, incluso si se apoya en algo que se caería si se quitara, porque entonces no es probable que haya emisión por el ano. La emisión por el ano no se considera, ya que es rara, y el relato de Anas de que los Compañeros durmieron y luego oraron sin renovar el wudu' se interpreta como el sueño de los firmemente sentados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439} Al-Nawawi da reglas: se recomienda que un durmiente firmemente sentado renueve su wudu' como precaución; si uno está seguro de que durmió pero no está seguro de si estaba firmemente sentado, no se debe wudu'; si uno durmió sentado y sus nalgas se separaron del suelo antes de despertar, el wudu' se rompe, pero si se separaron después de que despertó o al mismo tiempo, o no se sabe qué ocurrió primero, no se rompe, ya que el defecto es la pureza. No hay diferencia entre poco y mucho sueño. Un durmiente en cuclillas con las rodillas levantadas tiene tres vistas, y la preferida es que no se rompe. Quien duerme boca arriba con las nalgas planas se considera que rompe el wudu', y si está sujeto, la opinión más conocida es que aún así se rompe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} Los hanbalíes dividen el sueño en tres tipos. El sueño de quien se acuesta rompe el wudu', poco o mucho, según la opinión de todos los que sostienen que el sueño lo rompe. El sueño de quien se sienta lo rompe si es mucho, no si es poco. El sueño de quien está de pie, inclinado o postrado: Ahmad tiene tres informes, la opinión de la escuela es que se rompe, la segunda que se rompe solo si es mucho, y la tercera que la inclinación no lo rompe mientras que la postración sí. Citan la redacción general del hadiz sobre los ojos como la atadura de las nalgas y el hadiz 'quien duerme debe realizar el wudu''; y para el sentado citan a Safwan ibn 'Assal sobre no quitarse los calcetines durante el viaje excepto después de impureza, excremento, orina o sueño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} El sentado que se inclina, o se sienta en cuclillas, es tratado como alguien que se acuesta en una vista, mientras que Ahmad dice que el sueño ligero no lo rompe, y él considera que inclinarse y reclinarse es más severo que ponerse en cuclillas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} Ibn Qudama sostiene que un sentado cuyo asiento está firmemente en el suelo rompe el wudu' solo por mucho sueño, ya que la evidencia para el sentado no hace distinción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} Los hanbalíes difieren en cuanto a la cantidad de sueño que cuenta. Abu Ya'la dice que no hay una medida fija y que es lo que la costumbre considera. Otra opinión considera lo que cambia al durmiente de su postura, como cuando se cae o sueña. Ibn Qudama dice que no hay una medida fija, ya que las medidas se conocen solo por revelación; por lo tanto, cualquier cosa que muestre mucho sueño, como la caída de un durmiente firmemente sentado, rompe la ablución, y si uno está en duda si fue mucho, no se rompe, ya que la pureza es cierta. Agrega que el sueño es una victoria de la mente, por lo que quien cuya mente no está vencida no necesita ablución, y quien duda si durmió, o tiene un pensamiento de origen incierto, un sueño o un pensamiento pasajero, no la necesita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} Segunda opinión: Abu Musa al-Ash'ari, Abu Mijlaz, Humayd al-A'raj y 'Amr ibn Dinar sostienen que dormir no anula la ablución en absoluto, citando el relato de Anas sobre los Compañeros esperando la oración vespertina hasta que sus cabezas cabeceaban. Al-Mardawi cita a al-Maymuni diciendo que no la anula. Sa'id ibn al-Musayyab solía dormir acostado varias veces mientras esperaba la oración y luego oraba sin renovar su ablución. Ibn Qudama sugiere que sostenían que dormir no es en sí mismo una impureza y que la impureza es dudosa, por lo que la certeza no se elimina con la duda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} Los hanbalíes sobre el sueño: quien duerme mientras cree que su pureza permanece no la pierde; Ibn Taymiyya eligió esta opinión, mientras que al-Khallal llamó a ese informe un error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Segundo, el desmayo y el desvanecimiento rompen el wudu' por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Tercero, la locura, leve o grave, la rompe por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Cuarto, la intoxicación la rompe por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Quinto, tocar la parte privada de un adulto, hombre, mujer o intersexual, es discutido como una ruptura; su detalle está bajo sus propios encabezados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Sexto, tocar la piel de un hombre y una mujer es discutido; su detalle está bajo sus propios encabezados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Séptimo, apostasía. Los Hanafi, la opinión Shafi'i más sólida, un grupo de Malikis y un informe Hanbali sostienen que la apostasía en sí misma no rompe el wudu', pero anula los actos si se une a la muerte; por lo tanto, quien apostató estando en wudu' y luego regresó al Islam mantiene su wudu' si nada más lo rompió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} La opinión preferida de Maliki, la opinión más sólida de Hanbali y una opinión de Shafi'i sostienen que la apostasía rompe el wudu', citando el versículo de la sura al-Zumar sobre la anulación de las obras, y sosteniendo que el llamado es a la comunidad y no al Profeta, mientras que un informe de Musa ibn Mu'awiya de Ibn al-Qasim recomienda el wudu' después de la apostasía. Al-Sawi explica que la anulación es de la recompensa, y que el wudu' se vuelve necesario en la opinión preferida porque el apóstata que regresa está en la posición de alguien que acaba de alcanzar la madurez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} Octavo, reírse en voz alta en la oración. La mayoría (malikis, shafi'is y hanbalis) sostienen que no rompe la ablución, pero invalida la oración; los shafi'is recomiendan realizar la ablución después. Los hanafíes, y lo que se narra de al-Hasan, al-Nakha'i y al-Thawri, sostienen que reírse en voz alta durante una oración completa, es decir, una con inclinación y postración, rompe el wudu' e invalida la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} Noveno, comer lo que ha sido tocado por el fuego. Hay dos opiniones. La primera, sostenida por la mayoría y narrada por Abu Bakr, 'Umar, 'Uthman, 'Ali, Ibn Mas'ud y otros, es que no requiere wudu'. Citan el relato de Ibn 'Abbas de que el Profeta comió una paletilla de cordero y oró sin wudu', el relato de Jabir de que el último de los dos asuntos era dejar el wudu' después de que el fuego hubiera cambiado, y el dicho de que el wudu' es para lo que sale y no para lo que entra, que Ibn Hajar considera débil en sus cadenas. La segunda, sostenida por 'Umar ibn 'Abd al-Aziz, al-Hasan, al-Zuhri, Abu Qilaba y Abu Mijlaz, es que se requiere wudu'; citan el hadiz 'realiza el wudu' de lo que el fuego ha tocado' en Muslim de Abu Hurayra, 'A'isha y Zayd ibn Thabit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17444} Décimo, comer carne de camello. Hay dos puntos de vista. El primero, sostenido por los Hanafi, Maliki, la visión Shafi'i más reciente y una visión Hanbali, es que no rompe el wudu', como otros alimentos; la razón dada por al-Kasani es que lo que lo rompe es la emisión de una impureza o lo que la causa, y eso no ocurrió. La segunda, sostenida por la antigua visión Shafi'i, Ishaq, Yahya ibn Yahya, Ibn Khuzayma e Ibn al-Mundhir, es que el wudu' es necesario solo para la carne de camello, poca o mucha, cruda o cocida; citan el relato de Jabir ibn Samura sobre el hombre que preguntó si debía realizar el wudu' después de cordero y camello, y la respuesta del Profeta de realizarlo después del camello, y el relato de al-Bara'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445} El detalle Hanbali: la visión de la escuela es que la carne de camello rompe el wudu' ya sea que se coma a sabiendas o no, cruda o cocida; Ahmad tiene un relato que dice que la carne cruda lo rompe pero la cocida no; otro que no lo rompe en ningún caso, elegido por Yusuf al-Jawzi e Ibn Taymiyya; y un tercero que se rompe solo si la prohibición era conocida, elegido por al-Khallal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} Las otras partes del camello, como la joroba, la grasa, el hígado y el panza, no lo rompen según la visión de la escuela; beber leche de camello o el caldo de su carne no lo rompe, y un informe de Ahmad dice que beber su leche sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} Undécimo, comer alimentos prohibidos. Los informes hanbalíes difieren: los alimentos prohibidos rompen el wudu', o la carne prohibida en todos los casos, o solo el cerdo. La opinión de la escuela es que comer carne que no sea carne de camello no la rompe, sea lícita o prohibida, ya que la regla para la carne de camello es una que no se entiende por su significado y por lo tanto no se extiende. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} Duodécimo, lavar a los muertos. La mayoría no lo cuenta entre las rupturas; los Hanafi dicen que el wudu' es recomendable después de lavar a los muertos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} La opinión más sólida de la escuela Hanbali es que lavar a los muertos rompe el wudu'; algunos Hanbalis admiten que no lo hace, cuando la persona muerta fue lavada en una camisa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447} Duodécimo, duda sobre si uno tiene wudu' o no. Los malikíes sostienen que la duda es una ruptura, ya que el deber no se cumple sin certeza; sus tres casos son: quien duda, después de saber su pureza anterior, si ocurrió una ruptura; quien duda, después de saber su impureza, si ocurrió la ablución; y quien sabe tanto pureza como impureza y duda cuál fue primero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447} La mayoría sostiene que la duda sobre si la ablución permanece o ha terminado no es una ruptura: quien está seguro de que era puro y duda si ocurrió una ruptura, o viceversa, actúa sobre la certeza anterior. Citan el hadiz en Muslim sobre un hombre que siente algo en su vientre y no sabe si salió algo, quien no debe salir de la mezquita hasta que oiga un sonido o huela algo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17448} Decimotercero, la calumnia y el lenguaje soez. Un relato de Ahmad sostiene que la calumnia, la obscenidad y actos similares, incluyendo el chisme, la mentira, la difamación y el falso testimonio, invalidan el wudu'; se dice que Aisha afirmó que uno realiza el wudu' después de una buena comida, pero no después de una palabra soez que pronuncie. Los hanafíes y los shafiíes recomiendan el wudu' adecuado después de un lenguaje soez como la calumnia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17448}"
  fr: "Le wudu' (de wada'a, être pur et net) désigne l'acte d'ablution, ainsi que l'eau utilisée pour le réaliser, au sens littéral du terme. Les juristes le définissent comme suit: les hanafites comme le lavage et l'essuyage de membres spécifiques; les malikites comme une purification par l'eau de quatre membres selon un rite précis; les chaféites comme des actes spécifiques accomplis par intention; et les hanbalites comme l'utilisation d'eau pure sur les quatre membres selon le rite prescrit, dans l'ordre et la succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17364}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365} Le ghusl consiste à laver tout le corps selon un rite précis. Le wudu' et le ghusl éliminent tous deux une impureté rituelle, mineure et majeure. La tahara est le terme plus général désignant l'élimination de l'impureté et de ses effets. Le tayammum consiste à s'essuyer le visage et les mains avec de la terre ou du sable pur selon un rite précis, et sert à purifier de toute impureté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} La plupart des juristes estiment que les ablutions (wudu') relèvent des révélations antérieures et que la spécificité de cette communauté réside dans la manière de les accomplir, ou la marque des ablutions (wudu'), à savoir les marques blanches sur les membres le Jour de la Résurrection, comme l'indiquent les récits des prophètes, de Sarah et de Jurayj. L'école malikite, à l'opposé de l'école shafi'ite, considérée comme plus solide, et certains hanafites, soutiennent que les ablutions elles-mêmes sont propres à cette communauté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17367} Les ablutions (wudu') ont été rendues obligatoires à La Mecque en même temps que la prière; la préposition « avec » se réfère au lieu, et non au moment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17366} Leur fondement juridique est le Coran, la Sunna et le consensus. Le verset de la sourate Al-Ma'ida (cité par sourate et verset) est considéré par certains comme la preuve de l'obligation, tandis que la plupart l'interprètent comme s'adressant à ceux qui sont en état d'impureté lorsqu'ils se lèvent pour prier. La Sunna affirme qu'aucune prière n'est acceptée sans pureté. Les biographes s'accordent à dire que son instauration a été rendue obligatoire à La Mecque par l'enseignement de Gabriel, et la communauté reconnaît sa légalité et son caractère obligatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368} Nier son obligation pour la prière est considéré comme de l'incroyance; pour d'autres usages, comme toucher le mushaf, les hanafites ne le considèrent pas comme de l'incroyance, car le verset est sujet à controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} Quiconque néglige délibérément les ablutions et prie en état d'impureté: les hanafites considèrent que celui qui prend la religion à la légère est un incroyant, comme lorsqu'il prie délibérément sans ablutions; les malikites, quant à eux, estiment qu'il est passible de mort pour avoir abandonné la pureté rituelle, notamment en matière de prière. Les chaféites affirment qu'il est invité à se repentir et mis à mort en guise de châtiment (hadd), et non pour incrédulité; les hanbalites, quant à eux, considèrent que celui qui abandonne une condition ou un pilier convenu est traité comme s'il abandonnait l'acte lui-même, et que celui qui néglige la prière est sommé de la reprendre pendant trois jours et mis à mort s'il ne prie pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} La décision juridique varie selon le but des ablutions (wudu'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} Premièrement, lorsque les ablutions sont obligatoires: pour la prière, les juristes s'accordent à dire qu'elles sont obligatoires pour celui qui se trouve en état d'impureté mineure et qui souhaite accomplir une prière obligatoire ou surérogatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369} Les hanafites les exigent pour la prière funéraire, qu'ils considèrent comme une prière à part entière. la majorité l'exige également pour la prosternation de la récitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17369}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} Pour le tawaf, les Malikis, Shafi'is et Hanbalis soutiennent qu'il est obligatoire pour le tawaf obligatoire et volontaire; les Hanafis le considèrent comme nécessaire (wajib) et le pénalisent: un tawaf obligatoire dans une impureté mineure nécessite un sacrifice, et dans une impureté majeure un chameau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371} Concernant le fait de toucher le mushaf, la majorité le considère comme obligatoire, citant le verset de la sourate al-Waqi'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17370} Deuxièmement, lorsqu'il s'agit d'une sunna: les hanafites, les hanbalites et les shafi'ites, à l'exception d'al-Baghawi, estiment que les ablutions avant le sommeil sont une sunna, se basant sur le hadith relatif au fait de se coucher sur le côté droit après les ablutions, rapporté dans les deux Sahihs cités en note de bas de page. Les malikites le considèrent comme recommandé; une opinion malikite est que pour un junub avant le sommeil, il s'agit d'une sunna; une autre est qu'il est obligatoire. Troisièmement, lorsqu'il est recommandé: les ablutions (wudu') ne constituent pas une condition de validité de l'acte, mais contribuent à sa perfection. Elles sont recommandées pour la récitation du Coran et la lecture des hadiths, pour l'invocation de Dieu, pour l'appel à la prière, pour l'iqama (sur lequel les juristes divergent), pour le sermon, pour l'étude des sciences religieuses, pour le pèlerinage à Arafat et pour le sa'y entre Safa et Marwa, ainsi que pour la visite de la mosquée du Prophète et de son tombeau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17371}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} Le renouvellement des ablutions (wudu') est sujet à controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17372} Pour un junub, les écoles hanafite, shafi'ite et hanbalite (la majorité) recommandent les ablutions avant de manger, de boire, de reprendre les rapports sexuels et de dormir; les malikites estiment que le junub n'a pas besoin d'ablutions pour manger, boire ou reprendre les rapports sexuels, mais se lave les mains et les parties intimes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17373}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} Les Hanafites recommandent également de maintenir la constance des ablutions en les renouvelant lorsqu'elles sont interrompues, et conseillent de laisser une différence légale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17374} Quatrièmement, quand cela est permis: les Malikites considèrent que les ablutions permises sont celles effectuées pour la purification et le rafraîchissement; le cadi Iyad mentionne les ablutions avant d'entrer en présence de dirigeants ou d'embarquer sur un navire en danger, et dit qu'elles peuvent être recommandées; al-Hattab est plutôt favorable à la recommandation pour tout sauf pour la purification et le rafraîchissement. De telles ablutions ne lèvent pas l'impureté, sauf si tel est l'objectif. Cinquièmement, les ablutions interdites: pour les Malikites, il s’agit de renouveler ses ablutions avant d’avoir accompli un acte de culte, ou de les faire pour un motif pour lequel elles n’étaient ni prescrites ni permises. Mérite des ablutions: de nombreux hadiths attestent de leur pouvoir d’effacer les péchés; la pureté est la moitié de la foi; le hadith d’Uthman rapporte que quiconque accomplit ses ablutions comme le Prophète voit ses péchés antérieurs pardonnés; le hadith d’Umar concerne les huit portes du Paradis; et le hadith d’Abou Hourayra évoque les signes rayonnants de la communauté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376} Les conditions des ablutions (wudu') sont de trois sortes: les conditions d'obligation, les conditions de validité et les deux. La première des conditions d'obligation est l'intellect, car on ne peut s'adresser à celui qui en est dépourvu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17376} Concernant le lavage requis: la majorité (Hanafis, Shafi'ites et Hanbalites) considère qu'il suffit que l'eau coule sur un membre, sans frottement; les Malikites et al-Muzani exigent le frottement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} Pour les hanafites, le lavage consiste à verser de l'eau jusqu'à ce qu'elle goutte, même une seule goutte; Abu Yusuf accepte le simple fait d'humidifier la surface. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} Pour les shafi'ites, le lavage concerne le membre lavé, que ce soit par le fidèle lui-même, par une autre personne ou même sans intervention, comme la pluie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382} Le visage est la partie lavée; toute sa surface extérieure l'est. Sa largeur s'étend entre les oreilles et sa longueur de la racine des cheveux au menton. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Les Malikites et les Hanbalites mesurent la longueur des cheveux d'un homme imberbe jusqu'à la naissance des cheveux et celle d'un homme barbu jusqu'à l'extrémité de la barbe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Cheveux dépassant du contour du visage: les Hanafites n'exigent pas qu'ils soient lavés; les Chafi'ites exigent que les faces externe et interne soient lavées si les cheveux sont fins, et seulement la face externe s'ils sont épais, une autre opinion n'exigeant aucun lavage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17383} Poils du visage: les Hanafites n’exigent pas de laver la racine des poils épais des sourcils, de la moustache et de la barbe en raison de la difficulté, mais les poils fins doivent être lavés à l’extérieur et à l’intérieur jusqu’à la peau. Les Malikites exigent de peigner les poils fins pour que l’eau atteigne la peau et estiment que les poils épais ne nécessitent qu’un lavage superficiel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384} Les Shafi’ites lavent les cils, les sourcils, la moustache, les favoris et les poils de la lèvre inférieure à l’extérieur et à l’intérieur, de même que les poils du visage d’une femme ou d’une personne intersexuée; pour la barbe d’un homme, les poils fins sont lavés des deux côtés et les poils épais seulement à l’extérieur; là où les poils fins et épais sont mélangés, l’ensemble est lavé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17384}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} Les Hanbalites exigent de laver la barbe et les cheveux dépassant du visage, ainsi que les poils épais de la moustache, des sourcils, de la lèvre inférieure et, pour une femme ou une personne intersexuée, les poils pubiens. Il est recommandé de peigner la barbe. Le hadith concernant l'eau versée sous le menton est cité en note de bas de page. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385} Pour les yeux: le bord de la paupière est lavé avec le visage; les croûtes doivent être enlevées. La majorité ne lave pas l'intérieur de l'œil avec le visage, car le Prophète ne le faisait pas et parce que l'eau chaude ou froide pourrait l'irriter; un hadith rapporté par Ahmad le recommande lorsqu'il n'y a pas de risque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17385}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} Si l'intérieur de l'œil est souillé d'impuretés, les écoles malikite, chaféite et une opinion ahmadis exigent de le laver, tandis que les écoles hanafite et hanbalite l'exemptent de le faire pendant la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} Les cheveux qui poussent au-delà de leur position habituelle (ghumum) sont lavés avec le visage jusqu'à la limite habituelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386} Les tempes (tahdhif), les fins poils entre la tempe et la ligne des cheveux dégarnie, font l'objet de controverses: la majorité des shafi'ites, une opinion malikite et l'opinion hanbalite la plus favorable les considèrent comme faisant partie de la tête et non comme lavées avec le visage; les hanafites, une autre opinion malikite, une opinion hanbalite et une opinion shafi'ite, que Ghazali et Rafi'i appellent la plus favorable, les considèrent comme faisant partie du visage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17386}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} La peau blanche entre la tempe et l'oreille: les shafi'ites, les hanbalites et l'opinion hanafite sur laquelle se fondent les fatwas estiment qu'elle fait partie du visage; Un hadith rapporté par Abou Yusuf l'exclut; les Malikites lavent la peau au niveau du lobe de l'oreille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} Les lèvres: la partie rouge visible lorsque les lèvres se ferment naturellement est lavée; selon une opinion hanafite, la lèvre suit le mouvement de la bouche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} Se laver une partie de la tête avec le visage est obligatoire selon l'avis majoritaire, et les Chafi'ites ajoutent une partie de la gorge, la zone sous le menton et les oreilles, car ce qui est indispensable à l'accomplissement de l'obligation est lui-même obligatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17387} Les favoris sont lavés avec le visage. Les Chafi'ites lavent la partie du nez exposée par une amputation; les Malikites lavent la cloison nasale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388} La majorité considère que l'intérieur de la bouche et du nez ne fait pas partie du visage et n'a pas besoin d'être lavé lors des ablutions (wudu'). Les hanbalites, quant à eux, estiment que la bouche et le nez font partie du visage, et que le rinçage et l'inhalation d'eau sont donc requis pour les ablutions mineures et majeures. Ils citent un hadith dans lequel l'ouvrage indique qu'al-Daraqutni a jugé que cette association était une narration mursal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} La tempe (sudgh), la calvitie et le recul de la ligne des cheveux: la majorité considère que ces parties font partie de la tête et non du visage; une opinion hanbalite considère cependant que la tempe fait partie du visage. Al-Shirbini recommande de se laver les yeux avec le visage en raison des divergences d'opinions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17388}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} Les Malikites lavent les plis du front et le creux des paupières, si l'eau peut y accéder, en frottant, le reste s'éliminant par simple écoulement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389} Concernant les oreilles: al-Zuhri les inclut dans le visage, citant un hadith relatif à la création du visage. La majorité rétorque que les oreilles font partie de la tête, s'appuyant sur le hadith selon lequel les deux oreilles appartiennent à la tête et sur le récit du Prophète s'essuyant les oreilles avec la tête. Ils affirment que les oreilles ne sont rattachées au visage que par proximité, car une chose prend le nom de ce qui la jouxte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17389}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390} Si les cheveux sont lavés et que la peau en dessous devient visible, les hanafites, l'avis majoritaire des malikites et les hanbalites estiment qu'aucun autre acte de purification n'est requis et que les ablutions ne sont pas répétées, car l'obligation s'est reportée sur les cheveux; les shafi'ites, dans leur avis le plus solide, un avis malikite et Ibn Jarir exigent de laver la peau désormais visible, par analogie avec un pied dépassant d'une chaussette essuyée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390} La seconde obligation: se laver les mains jusqu'aux coudes. C'est un pilier et une obligation reconnus par le Coran, par le hadith rapporté par Abou Hourayra décrivant les ablutions du Prophète, et par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17390}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} La majorité (les Malikites, les Chafi'ites, les Hanbalites et les Hanafites, à l'exception de Zufar) considère que les coudes doivent être lavés avec les mains, que le terme « à » dans le verset signifie « avec » ou marque une limite de même nature que ce qu'il limite; ils citent le hadith d'Abbad al-Abdi décrivant l'eau ruisselant sur les coudes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} Zufar, une opinion malikite et une opinion d'Ahmad estiment que le coude n'est pas concerné, par analogie avec la nuit dans le verset relatif au jeûne; une autre opinion malikite l'inclut par précaution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} Si une partie du membre à laver est amputée, le reste doit être lavé par consensus, conformément au hadith « faites ce que vous pouvez de ce que je vous ordonne », et parce que le plus facile ne doit pas être abandonné au profit du plus difficile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17391} La règle concernant une amputation au coude se poursuit au-delà de la page 17391 et n'est pas encore lue; cette partie du sommaire est incomplète. Amputation au coude: les juristes qui exigent le lavage du coude lavent le lieu de la coupure. Les hanafites, l'école hanbalite, l'avis plus favorable des chaféites et un avis malikite exigent le lavage de l'os qui constitue l'extrémité supérieure du bras, car les deux os adjacents doivent être lavés, et si l'un est absent, l'autre est lavé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} L'école malikite et une opinion shafi'ite opposée à l'ablation du coude ne requièrent aucun lavage au niveau de la coupure, puisque le coude fait partie de l'avant-bras et que la coupure l'a emporté; sauf si l'on sait qu'une partie du coude reste dans le bras, auquel cas le lieu de la coupure est lavé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} Amputation au-dessus du coude: l'obligation cesse puisque le coude a disparu, mais les shafi'ites recommandent de laver ce qui reste du bras afin que le membre ne soit pas impur; si la coupure est à l'épaule, il est recommandé de laver le lieu de la coupure à l'eau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} Un doigt, une main ou un bras supplémentaire: les Hanafites, les Malikites, les Shafi'ites et le juge hanbalite al-Qadi lavent un doigt ou une main supplémentaire qui pousse au lieu d'obligation à côté de l'original. Si un poil pousse en dehors de la zone d'obligation, comme à l'épaule ou au bras, la plupart des juristes lavent la partie opposée à cette zone, tandis que l'avis hanbalite, plus solide, n'exige aucun lavage pour une pousse supplémentaire distincte en dehors de cette zone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17392} Les ongles et ce qui se trouve en dessous: les hanafites, les chaféites et les hanbalites exigent de laver l'ongle même s'il est long, car il est uni à la main par la création et fait donc partie de la notion de main. Les malikites et une certaine école hanbalite considèrent qu'une petite saleté sous l'ongle n'altère pas les ablutions, même si elle obstrue l'eau. Al-Mardawi considère cet avis comme le plus solide, car il est répandu; le Prophète aurait donc dû l'expliquer s'il s'agissait d'une condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393} Les fatwas hanafites stipulent qu'une trace de pâte ou d'argile (sèche ou humide) à la base de l'ongle invalide le lavage, contrairement à la teinture au henné ou à la pâte. Un ongle long nécessite que l'eau atteigne sa base, tandis qu'un ongle court n'en a pas besoin. Les ongles dépassant le bout des doigts doivent être lavés par consensus. L'ouvrage rapporte que certains hanafites font une distinction entre citadins et villageois, et qu'al-Dabusi a émis une fatwa de validité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17393}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} Les chaféites exigent le lavage des poils des mains, à l'intérieur et à l'extérieur, même s'ils sont épais. Si les poils sont si épais que la peau n'est pas atteinte, seule la partie visible doit être lavée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394} Les Malikites, selon leur avis privilégié, exigent le lavage des espaces entre les doigts, des articulations et du pli des doigts; une bague permise à un homme ou une femme n’a pas besoin d’être retirée, tandis qu’une bague interdite doit être enlevée et une bague qui ne dépasse pas doit être retirée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17394}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} Une main supplémentaire: les Hanafites, les Malikites, les Chafiites et les Hanbalites exigent le lavage d’une main supplémentaire qui pousse à l’endroit de l’obligation. Si elle pousse à l’extérieur de cet endroit, les Hanafites, les Chafiites et une opinion hanbalite exigent le lavage de la partie opposée à l’endroit de l’obligation; les Malikites exigent le lavage de la main entière si elle possède un coude. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395} Pour les Hanafites, si une personne a deux mains, celle qu'elle utilise pour saisir est la main principale et doit être lavée, tandis que l'autre est considérée comme supplémentaire; les Chafi'ites exigent de laver une main supplémentaire qui n'est pas distincte de la main principale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17395}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} Un repli de peau pendant sur le haut du bras: les Hanafites et les Chafi'ites exigent de laver uniquement la partie opposée au lieu d'obligation, tandis que les Hanbalites exigent de laver un repli arraché du haut du bras qui pend le long de l'avant-bras, comme un doigt supplémentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} Les juristes lavent entièrement le pli de l'avant-bras; si son extrémité est jointe au bras, on lave la partie opposée au point d'obligation, et la partie qui s'éloigne du membre est lavée sur sa face inférieure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} La troisième obligation: s'essuyer la tête. Il est admis comme pilier ou obligation, selon le Coran, les descriptions des ablutions du Prophète (wudu'), y compris le hadith rapporté par 'Uthman, et par consensus. S'essuyer la tête consiste à passer une main humide sur la tête sans utiliser d'eau courante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} Les questions relatives à l'essuyage de la tête commencent ici, notamment sur la quantité suffisante, point sur lequel les juristes divergent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17396} Essuyage de la tête: les Malikites, dans leur avis privilégié, et les Hanbalites, dans l’avis le plus solide, exigent d’essuyer toute la tête, peau et cheveux, depuis la ligne frontale habituelle jusqu’au creux de la nuque, y compris les cheveux des tempes; l’os saillant du visage n’est pas essuyé mais lavé avec le visage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} Autres avis malikites: Ashhab n’en exige que la moitié, un hadith considère que la mèche frontale suffit, Muhammad ibn Maslama en exige les deux tiers et Abu al-Faraj un tiers, la main passant sous les cheveux pour une couverture complète, le retour étant recommandé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} L'école hanbalite exige, selon l'avis le plus solide, de s'essuyer la totalité du crâne. Un hadith rapporté par Ahmad autorise la majeure partie du crâne, les juristes divergent quant à la quantité maximale. Un autre hadith autorise la mèche de cheveux, un autre encore toute partie du crâne sans restriction. S'essuyer la peau seule est insuffisant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397} L'école hanafite considère qu'un seul passage au-dessus des oreilles est un pilier. L'avis le plus répandu préconise de s'essuyer un quart du crâne, avis privilégié par l'école. Un autre hadith inclut la mèche de cheveux et un tiers du crâne, soit la largeur de trois doigts. Ce dernier avis, que les Badai' qualifient d'avis des ouvrages principaux, est celui sur lequel les Zahiriyya émettent des fatwas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17397}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} Les chaféites exigent qu'on essuie une partie de la peau ou des cheveux à l'intérieur du contour de la tête, et autorisent indifféremment la peau ou les cheveux; c'est la tête qui est relevée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} Méthode: selon l'avis hanafite, trois doigts sont nécessaires pour s'essuyer; un ou deux doigts ne suffisent pas selon l'avis apparent, tandis que l'index et le pouce écartés, la paume entre eux, comptent pour trois. Les hanbalites autorisent toute méthode, avec la main ou avec un tissu, selon l'avis hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398} Cheveux tombant sous la tête: les hanafites, les chaféites et les hanbalites n’exigent pas de les essuyer; les malikites exigent de les essuyer, quelle que soit leur longueur, car il s’agit de cheveux de la tête. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17398}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399} Se laver la tête au lieu de l’essuyer: la majorité l’autorise, car cela équivaut à s’essuyer et va plus loin; les hanbalites, dans leur avis le plus solide, exigent que la main soit passée sur la tête, tandis qu’un hadith rapporté par Ahmad autorise le lavage sans passer la main. Les hanafites, l’avis malikite le plus solide et les hanbalites déconseillent de se laver la tête d’emblée au lieu de l’essuyer, car cela contredit les prescriptions. Certains malikites, une opinion chaféite et une opinion hanbalite contestent que cela suffise, car il ne s'agit pas d'un simple essuyage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399} Se raser les cheveux après les ablutions: la majorité considère que cela n'a aucune incidence sur les ablutions. Les hanafites estiment que les ablutions ne sont pas répétées, car s'essuyer les cheveux ne remplace pas l'essuyage de la peau. Une opinion malikite exige de répéter l'essuyage après le rasage, ce qu'al-Dasuqi juge insuffisant; al-Tabari exige également une répétition. Ibn Rajab rapporte qu'Ahmad recommandait de se mouiller la tête après le rasage sans pour autant l'exiger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17399}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} Essuyage répété: les écoles hanafite, malikite et hanbalite estiment qu’il ne faut l’essuyer qu’une seule fois, car la répétition équivaut à un lavage. Les hanbalites citent le fait que la plupart des personnes ayant décrit les ablutions du Prophète (wudu’) mentionnent un seul essuyage, un avis partagé par Abou Dawoud. Les chaféites recommandent trois essuyages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} Cheveux tressés: pour les malikites, les cheveux tressés seuls n’ont pas besoin d’être défaits, même si la tresse est bien serrée; les cheveux tressés avec trois brins doivent être défaits, quelle que soit la solidité de la tresse; les cheveux tressés avec moins de brins doivent être défaits s’ils sont bien serrés. Al-Sawi note que les femmes peuvent suivre l'avis shafi'ite ou hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} L'essuyage du turban est traité dans une section distincte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17400} La quatrième obligation: le lavage des pieds jusqu'aux chevilles. Il existe quatre avis. Le premier, majoritaire, considère que le lavage des deux pieds est un pilier des ablutions (wudu'). Les juristes rapportent un consensus: Abd al-Rahman ibn Abi Layla rapporte que les Compagnons étaient d'accord sur le lavage des pieds; al-Mawardi indique que la majorité des juristes préconisent le lavage et non l'essuyage; et al-Nawawi rapporte que les musulmans étaient unanimes sur l'obligation de se laver les pieds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402} La seconde opinion, attribuée à 'Ali, Ibn 'Abbas, Anas et al-Sha'bi, stipule que l'obligation est de s'essuyer les pieds et non de les laver. Ces derniers se fondaient sur la lecture au génitif du mot « pieds » dans le verset de la sourate al-Ma'ida. Il est rapporté qu'Ali revint sur cette opinion, prescrivant le lavage des pieds. Ibn Qudama affirme qu'aucun autre juriste, hormis ceux cités, n'a soutenu l'avis concernant l'essuyage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} La troisième opinion, celle d'al-Hasan al-Basri, d'al-Jubba'i et d'un hadith rapporté par al-Tabari, autorise le fidèle à choisir entre laver et s'essuyer les pieds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} Quatrièmement, selon certains Zahirites, le lavage et l'essuyage doivent être effectués simultanément, car les deux lectures d'un verset comptent pour deux versets. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} La majorité exige que les chevilles soient incluses dans le lavage; seul Zufar s'y oppose. Les chevilles sont les deux os qui font saillie au pied de la jambe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} Deuxièmement, les obligations controversées des ablutions (wudu'). Premièrement, l'intention: la majorité considère qu'il s'agit d'une condition sans laquelle les ablutions ne sont pas valides; certains la considèrent comme une recommandation et d'autres comme un pilier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17403} Abandon de l'intention: si le fidèle abandonne son intention après avoir terminé ses ablutions (wudu'), les Malikites, l'avis le plus solide des Shafi'ites et l'avis le plus solide des Hanbalites estiment que cela n'affecte pas la validité des ablutions; l'autre avis des Hanbalites considère qu'elles sont nulles. S'il les abandonne pendant les ablutions, les Shafi'ites, dans l'avis le plus solide, affirment qu'elles ne sont pas nulles et qu'il peut renouveler son intention pour la suite; les Hanbalites, dans l'avis le plus solide, considèrent que ce qui a été fait est nul et qu'il doit recommencer; et les Malikites, dans l'avis prédominant, n'excusent pas cet abandon, les ablutions sont donc nulles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404} Deuxièmement, la continuité (muwala): laver les membres successivement, de sorte que le premier ne sèche pas avant que le suivant ne soit commencé. Les hanafites, l'école shafi'ite nouvelle, une école malikite et un hadith hanbalite le recommandent (avis d'Ibn 'Umar, al-Hasan, Sa'id ibn al-Musayyab et al-Thawri). Les malikites (avis privilégié), l'école shafi'ite ancienne et l'école hanbalite le considèrent comme obligatoire (avis d'Umar ibn al-Khattab et al-Awza'i). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404} Troisièmement, l'ordre (tartib) du lavage et de l'essuyage: les shafi'ites, l'école hanbalite et une école malikite le considèrent comme un pilier (avis d'Uthman, Ibn 'Abbas, Qatada, Abu Thawr, Abu 'Ubayd et Ishaq). Ils se basent sur le verset, où l'essuyage se situe entre les deux ablutions, et affirment que tous les récits des ablutions du Prophète (wudu') donnent cet ordre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405} Les hanafites, l'avis malikite privilégié, certains chaféites et un hadith rapporté par Ahmad considèrent cet ordre comme une sunna, tout comme l'avis d'Ibn Mas'ud et d'autres, arguant que le verset utilise la conjonction « et », qui n'implique pas d'ordre, et qu'une seule immersion suffit à purifier l'eau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17406} Quatrièmement, le frottement (dalk): pour les Malikites, il s’agit de passer la main modérément sur le membre, que la saleté soit enlevée ou non, même après avoir versé de l’eau et avant qu’elle ne sèche. La majorité des Hanafites, des Shafi’ites et des Hanbalites, ainsi qu’une opinion malikite, le considèrent comme une sunna. Les Shafi’ites ajoutent qu’il faut insister sur les talons, surtout en hiver, en citant le dicton « Malheur aux talons ! » (Psaume 17406). L’avis malikite prédominant en fait une obligation, citant un hadith rapporté par Aïcha lui enjoignant de se frotter le corps avec sa main, un hadith dont l’ouvrage précise qu’il n’est pas sourcé. Concernant le frottement (dalk), les Malikites ont trois avis différents. L'avis majoritaire le rend obligatoire, car il s'agit d'une condition nécessaire à la validité du terme « ablution », et ses partisans citent l'instruction donnée à Aïcha de se frotter le corps; le second avis, celui d'Ibn Abd al-Hakam, considère qu'il n'est pas obligatoire, puisque le terme « ablution » est considéré comme valide sans lui; le troisième avis le rend obligatoire non pas en soi, mais pour s'assurer que l'eau atteigne la peau, de sorte que celui qui est certain que l'eau l'a atteinte après une longue attente est dispensé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17407} Les sunnas des ablutions. Premièrement, la basmala au début. La majorité des hanafites et des shafi'ites, ainsi qu'un hadith ahmadi, en font une sunna; l'avis malikite majoritaire le recommande, un autre avis malikite le désapprouve; les hanbalites le rendent obligatoire. Pour les Hanafites, toute invocation de Dieu suffit, mais les paroles rapportées du Prophète et des Salaf sont: « Au nom de Dieu, le Tout-Puissant, et louange à Dieu pour l’Islam », tandis que certains préfèrent la basmala complète. Les Shafi’ites considèrent que la formule minimale est « Au nom de Dieu » et la plus complète, avec louange à l’Islam et à la pureté de l’eau. Les Hanbalites exigent les mots « Au nom de Dieu » et aucune autre formule n’est suffisante, selon l’avis le plus répandu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408} Les hanafites considèrent la basmala à chaque membre comme une marque de courtoisie et citent un hadith d'al-Bara' ibn 'Azib concernant les deux témoignages à chaque membre; al-Ayni juge sa chaîne de transmission faible. L'école hanbalite ne la recommande pas à chaque membre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409} Deuxièmement, se laver les mains jusqu'aux poignets au début est une sunna suivant la pratique du Prophète; si les mains sont impures, les laver est obligatoire par consensus. Troisièmement, se rincer la bouche: la majorité le considère comme une sunna, et les Hanbalites comme une obligation. Quatrièmement, se rincer le nez avec de l’eau: la majorité le considère comme une sunna, et les Hanbalites comme un pilier ou une obligation. Cinquièmement, se moucher: une sunna pour les quatre écoles, selon le hadith « quand tu te mouches, mouche-toi ». Pour les Malikites, il s’agit d’expulser l’eau du nez en soufflant avec l’index et le pouce de la main gauche placés dessus; pour les Chafi'ites, il s’agit d’enlever ce qui se trouve dans le nez avec l’auriculaire de la main gauche. Les Hanbalites recommandent de le faire avec la main gauche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} Sixièmement, s'essuyer la tête entière. Les Malikites, dans l'avis préférentiel, et les Hanbalites le rendent obligatoire, comme indiqué précédemment, tandis que les Hanafites et les Shafi'ites le considèrent comme une sunna. Les Hanafites citent un hadith où il est rapporté que l'on s'essuie la tête entière et un autre où le Prophète s'essuie la mèche de cheveux; ainsi, s'essuyer un quart de la tête est une obligation et s'essuyer la tête entière est une sunna. Ils affirment que celui qui néglige systématiquement de s'essuyer la tête entière sans excuses commet des péchés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} Les chaféites recommandent de s'essuyer la tête entière, conformément à la pratique et pour éviter les divergences d'opinions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17410} Questions relatives au fait de s'essuyer la tête: premièrement, la répétition. Les hanafites considèrent que la tête entière doit être essuyée une seule fois avec une seule eau, et les récits faisant état de trois essuyages sont interprétés comme signifiant un essuyage avec une seule eau; al-Hasan rapporte d'après Abu Hanifa que trois essuyages avec une seule eau sont une sunna. Selon l'avis hanafite, trois essuyages avec de l'eau fraîche sont soit déconseillés, soit considérés comme une bid'a (innovation blâmable), soit permis; l'ouvrage cite l'avis d'Ibn 'Abidin, qui préfère les déconseiller. Les chaféites recommandent de s'essuyer la tête entière trois fois, l'une après l'autre, et s'essuyer une partie de la tête trois fois compte pour trois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411} Deuxièmement, la méthode recommandée. L'avis privilégié par l'école hanafite est de placer les paumes des mains et les doigts à l'avant de la tête et de les ramener vers la nuque, en s'essuyant toute la tête, puis de s'essuyer les oreilles avec deux doigts, les oreilles étant considérées comme faisant partie de la tête. Les chaféites disent que la sunna consiste à placer les mains sur le front, l'index joint à l'autre, les pouces sur les tempes, puis à les ramener vers la nuque, là où les cheveux forment une boucle; une personne sans cheveux de ce type les ramène simplement vers l'arrière. Les hanbalites déconseillent de répéter le geste de s'essuyer la tête. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17411} Concernant les sunnas du s'essuyer la tête: celui qui s'essuie ramène ses mains à leur point de départ. Al-Tirmidhi rapporte le récit d'Abu Hayya sur les ablutions d'Ali, au cours desquelles la tête est essuyée une seule fois, et Abu Dawud rapporte qu'Ibn Abbas a vu le Prophète s'essuyer la tête et les oreilles d'un seul geste. Ahmad recommande de répéter le nettoyage à l'eau fraîche, un avis partagé par Abu al-Khattab et Ibn al-Jawzi, et de même pour les oreilles. Les Malikites considèrent comme une sunna le fait de repasser la main sur la tête jusqu'à son point de départ, car les cheveux longs ne peuvent être couverts sans cela. Ce retour à la position initiale est une sunna uniquement si la main reste humide après le nettoyage obligatoire; il est déconseillé de renouveler l'eau pour cela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412} Manière de s'essuyer la tête: les Malikites et les Shafi'ites prennent de l'eau dans la main droite et la versent dans la paume gauche, commencent par l'avant, joignent le bout des doigts et placent les pouces sur les tempes, ramènent les mains vers la nuque et les ramènent au point de départ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Pour les Hanbalites, la méthode recommandée consiste à ramener les mains de l'avant vers l'arrière et à les ramener au point de départ, suivant le hadith d'Abd Allah ibn Zayd; puis les index pénètrent dans les conduits auditifs et les pouces essuient le pavillon des oreilles. Un homme dont les cheveux seraient ébouriffés par le retour ne revient pas, selon le hadith d'al-Rubay' bint Mu'awwidh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Ahmad, interrogé sur la manière dont une femme s'essuie, a décrit le même mouvement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413} Septièmement, s'essuyer les oreilles. Les hanafites, l'avis malikite prédominant et les chaféites considèrent que s'essuyer l'oreille externe et interne est une sunna, se basant sur le hadith d'al-Miqdam ibn Ma'di Karib décrivant le geste d'essuyer les oreilles et l'insertion des doigts dans les conduits auditifs. La majorité considère l'oreille externe comme la partie près de la tête et l'oreille interne comme la partie tournée vers l'extérieur; un avis malikite inverse cette distinction, et les malikites disent que l'oreille est modelée comme une rose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} Les Malikites recensent trois sunnas pour les oreilles: s’essuyer les parties externes et internes, essuyer les conduits auditifs et renouveler l’eau. Les Chafi’ites recommandent l’eau fraîche pour les oreilles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414} Les Hanbalites et certains Malikites rendent obligatoire le nettoyage des oreilles, car elles font partie de la tête; ils recommandent de s’essuyer les oreilles à l’eau fraîche après s’être essuyé la tête, et la peau blanche au-dessus des oreilles fait partie de la tête et est essuyée avec elle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17414}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} La méthode recommandée par les Hanbalites consiste à insérer les index dans les conduits auditifs et à essuyer l'extérieur des oreilles avec les pouces; il n'est pas nécessaire de toucher les parties cartilagineuses internes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17415} Les Hanafites estiment qu'il suffit d'essuyer toute la tête et les deux oreilles avec une seule goutte d'eau, puisqu'elles font partie de la tête; leur méthode préférée est celle décrite ci-dessus, et essuyer les oreilles avec l'eau encore humide est suffisant, bien que l'eau fraîche soit préférable pour résoudre le désaccord; ils recommandent d'insérer l'auriculaire humide dans le conduit auditif. Huitièmement, il est généralement recommandé de se peigner la barbe et les cheveux du visage, les divergences étant traitées dans la section consacrée au lavage du visage. Neuvièmement, le passage des doigts entre les doigts des mains et des pieds fait l'objet d'une section distincte. Dixièmement, répéter chaque ablution trois fois est une sunna parmi les juristes; les hadiths divergent: certains affirment qu'il s'agit des ablutions (wudu') sans lesquelles la prière n'est pas acceptée; d'autres affirment qu'elles doublent la récompense. et à trois reprises, avec la précision qu'il s'agit de ses ablutions et de celles des prophètes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} Onzièmement, le miswak. La majorité considère que l'utilisation du miswak est une sunna pour les ablutions, citant le hadith selon lequel, si cela n'avait pas été une contrainte pour sa communauté, il aurait prescrit le miswak pour chaque ablution. Les hanafites le considèrent comme une sunna fortement confirmée; les malikites, selon leur opinion privilégiée, comme une recommandation; al-Dasuqi note que le hadith suggère une sunna même à l'encontre de l'opinion privilégiée. Ses règles détaillées sont traitées dans une section distincte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17416} Douzièmement, le fait de s'essuyer le turban est controversé et est traité dans une section distincte. Treizièmement, ne pas gaspiller l'eau, sujet traité séparément. Quatorzièmement, commencer par le côté droit des mains et des pieds. Les écoles hanafite, malikite et hanbalite, plus rigoureuse, le recommandent, citant le hadith d'Aïcha selon lequel le Prophète aimait commencer par la droite dans toutes ses actions, et les récits d'Uthman et d'Ali décrivant qu'il commençait par la droite avant la gauche. Les écoles chaféite et certains hanafites le considèrent comme une sunna, selon laquelle, lors des ablutions, on commence par le côté droit. Ibn al-Hammam affirme que c'est une sunna en raison de sa pratique constante. Un hadith hanbalite, cité par al-Razi et rejeté par al-Zarkashi, la rend obligatoire; un autre indique qu'il est déconseillé de l'omettre. Ibn Qudama rapporte un consensus selon lequel celui qui commence par la gauche n'a pas besoin de recommencer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17417}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} Quinzièmement, prolonger les marques d'impureté (ghurra et tahjil): les shafi'ites et l'avis hanbalite le considèrent comme une sunna, c'est-à-dire laver au-delà du visage, des mains et des pieds. Les hanafites le considèrent comme une courtoisie: pour le visage, le lavage atteint le côté du cou et le front, et pour les bras et les jambes, il atteint le haut du bras et le tibia. Le fondement de cette pratique réside dans le dicton selon lequel la communauté est qualifiée de rayonnante, marquée par les ablutions blanches (wudu'). Les écoles chaféite et hanbalite considèrent cela comme une caractéristique propre à cette communauté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418} Les écoles malikite et un hadith hanbalite la déconseillent, et Malik la considère même comme un excès en matière de religion. Ils interprètent le terme « prolongation » comme le maintien de l'état de pureté, et non comme un lavage supplémentaire. Al-Dasuqi distingue les deux sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17418}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419} Seizièmement, se tourner vers la qibla pendant les ablutions: les écoles hanafite et malikite considèrent cela comme une courtoisie, limitée à ce qui est possible sans difficulté. Les chaféites et les hanbalites considèrent cela comme une sunna, car cela convient à tout acte d'adoration, sauf exception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419} Dix-septièmement, s'asseoir sur une estrade, une pratique recommandée par les hanafites et les malikites, afin d'éviter les éclaboussures d'eau lors des ablutions et de protéger ses vêtements; les chaféites recommandent d'éviter les projections. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17419} Dix-huitièmement, accomplir les ablutions dans un lieu propre, une recommandation pour les hanafites et les malikites. Les malikites désapprouvent les ablutions dans les toilettes, car un tel lieu n'est pas propice à la pureté. Dix-neuvième point: ne pas solliciter d'aide. Les écoles chaféite et hanbalite le considèrent comme une sunna; l'école hanafite, comme une marque de courtoisie. Le Prophète a été aidé par al-Mughira ibn Shu'ba pour verser de l'eau, et Safwan ibn 'Assal lui en a versé dessus, mais il est préférable de ne pas solliciter d'aide. Les chaféites distinguent l'aide apportée pour verser de l'eau, qui est déconseillée mais non pécheresse, de l'aide apportée pour apporter de l'eau, qui est permise et obligatoire lorsque la personne ne peut se purifier autrement, par exemple en cas de maladie. Ibn Mawdud déconseille l'aide, sauf en cas d'incapacité. Ibn 'Abidin, quant à lui, n'interdit pas l'aide pour verser, puiser ou aller chercher de l'eau, mais déconseille l'aide pour se laver ou s'essuyer sans raison particulière. Concernant le vingtième point, s'essuyer le cou: les Hanafites et un hadith rapporté par Ahmad le recommandent, et certains le considèrent comme une sunna. Les Malikites, les Chafi'ites et l'école hanbalite, plus rigoureuse, le déconseillent, faute de fondement historique. Al-Nawawi le qualifie d'innovation, et les Malikites le déconseillent, le considérant comme un excès en religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421} Vingt-et-unième point: déplacer la bague lors des ablutions (wudu'). Les écoles hanafite et chaféite recommandent de déplacer une bague trop grande, ainsi qu'une boucle d'oreille. Pour une bague trop serrée, il est recommandé de la déplacer si l'eau peut y pénétrer, et obligatoire dans le cas contraire. Ahmad ibn Hanbal affirme qu'une bague trop serrée doit être déplacée; les détails sont développés à la page suivante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421} Concernant la bague: si l'eau pénètre en dessous, les ablutions sont valides. Il est rapporté que le Prophète faisait tourner sa bague lors de ses ablutions. En cas de doute quant à la pénétration de l'eau en dessous, il est nécessaire de la déplacer, car par défaut, ce n'est pas le cas. Pour les malikites, une bague permise n'a pas besoin d'être retirée ou déplacée, même si elle est trop serrée. Une bague interdite doit être retirée s'il est interdit de la porter, et la déplacer suffit si elle est trop grande. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17421}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422} Vingt-deuxièmement, en commençant par l'avant de chaque membre. Les Chafi'ites recommandent de commencer par le haut du visage, le bout des doigts et le front. Les Hanafites et les Malikites recommandent de commencer chaque membre par son avant: le visage à la naissance des cheveux, les mains du bout des doigts jusqu'aux coudes, la tête de la naissance des cheveux jusqu'au creux de la nuque et le pied des orteils jusqu'aux chevilles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422} Vingt-troisièmement, ne pas parler. Les Hanafites et les Chafi'ites recommandent le silence sans nécessité; Les Malikites et les Hanbalites, plus rigoureux, considèrent la parole comme déconseillée, et les Malikites et Ibn Muflih affirment que cette déconseillation s'applique à toute parole autre que l'invocation de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17422} Vingt-quatrièmement, saluer celui qui accomplit ses ablutions et lui répondre. Les Malikites, certains Chafi'ites et certains Hanbalites estiment qu'il est prescrit de le saluer et de lui répondre; le Shaykh al-Islam chaféite affirme que la réponse est obligatoire. Le Furu' indique que la plupart des textes hanbalites ne désapprouvent ni le salut ni la réponse, tandis qu'Abu al-Faraj et d'autres estiment que le salut est déconseillé. L'ouvrage cite le récit d'Umm Hani, qui salua le Prophète pendant qu'il se lavait les mains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423} Vingt-cinquièmement, invoquer Dieu pour chaque membre. Les hanafites, les malikites, la plupart des chaféites et certains hanbalites le recommandent. L'ouvrage énumère les formules traditionnelles pour chaque membre; selon l'avis d'al-Ayni, cité avec Ibn 'Abidin, le hadith a acquis une certaine valeur grâce à ses nombreuses chaînes de transmission, et un hadith faible peut être suivi, sous certaines conditions, dans des affaires vertueuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17423}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424} L'avis chaféite, sous une certaine forme, et l'avis hanbalite, plus solide, nient que ce soit recommandé; les hanbalites le déconseillent car il revient à négliger ce qui est meilleur; al-Nawawi affirme que l'invocation pour chaque membre est sans fondement, et Ibn al-Qayyim soutient que les formules populaires pour chaque membre ne proviennent pas de la pratique du Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424} Vingt-sixièmement, l'invocation après les ablutions. Les écoles chaféite et hanbalite recommandent que celui qui les accomplit, face à la qibla, les mains et les yeux levés vers le ciel, prononce la profession de foi, puis les paroles du hadith d'Omar concernant les huit portes du Paradis, puis les paroles ajoutées par Tirmidhi au hadith de Muslim, puis la formule: « Gloire à Toi, ô Dieu ! Je témoigne qu'il n'y a de divinité que Toi, je Te demande pardon et je me tourne vers Toi », tirée du hadith d'Abou Sa'id rapporté par An-Nasa'i, qu'An-Nasa'i considère comme un compte rendu des paroles mêmes d'Abou Sa'id. Les écoles chaféite et hanbalite récitent également la sourate Al-Qaïda trois fois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17424}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} Les hanafites, les malikites et les chaféites recommandent de bénir le Prophète après les ablutions (wudu'), et les hanafites et les malikites ajoutent une formule concernant le fait d'être parmi les pénitents et les purifiés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425} Al-Buhuti explique que terminer les ablutions et la prière par une demande de pardon reconnaît que les gens ne sont pas à la hauteur de ce que Dieu leur doit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17425}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426} Vingt-septièmement, sécher les membres. Les Malikites, les Hanbalites et l'ancienne école shafi'ite autorisent le séchage ou le maintien des ablutions. Les Hanbalites estiment qu'il est préférable de ne pas les sécher; les Hanafites considèrent le séchage comme une marque de courtoisie; l'école shafi'ite, plus rigoureuse, recommande de ne pas les sécher, sauf excuse valable, car le séchage efface toute trace d'adoration. Les Hanafites et une école shafi'ite déconseillent le séchage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17426} Vingt-septièmement, ne pas secouer la main ni l'eau. Les Hanafites et l'école shafi'ite, plus rigoureuse, recommandent de ne pas secouer la main, se basant sur le hadith: « Lorsque vous faites vos ablutions, ne secouez pas vos mains, car elles sont les éventails de Satan », hadith qu'Ibn Hibban a jugé abrogé. L'école hanbalite, plus rigoureuse, et une école shafi'ite déconseillent de secouer l'eau. Ibn Qudama précise qu'il n'est pas déconseillé de secouer l'eau du corps, contrairement au fait de secouer la main. L'auteur de Ghayat al-Matlab considère que l'avis le plus judicieux est que cela n'est pas déconseillé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427} Vingt-huitièmement, boire l'eau restante des ablutions. Les hanafites et les chaféites recommandent de le faire immédiatement après les ablutions, se basant sur le hadith rapporté par Ali selon lequel le Prophète buvait l'eau restante de ses ablutions. La pratique idéale consiste à boire debout, face à la qibla, mais certains autorisent également à boire assis. Une invocation pour la santé est récitée après avoir bu, mais l'ouvrage note que cette pratique n'est pas retracée dans la tradition orale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17427}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428} Vingt-neuvièmement, deux rak'as après les ablutions. Les hanafites, les chaféites et les hanbalites les recommandent, se fondant sur le hadith d'Uqba ibn Amir concernant le Paradis pour celui qui accomplit correctement ses ablutions (wudu') puis prie deux rak'as avec ferveur et concentration. Les hanafites et les hanbalites les accomplissent en dehors des heures de prière déconseillées; les chaféites estiment qu'elles peuvent être accomplies à tout moment, car elles sont justifiées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428} La trentième, le renouvellement des ablutions (wudu'), c'est-à-dire refaire ses ablutions après des ablutions non rompues. Certains juristes la considèrent comme une sunna, d'autres comme une recommandation, d'autres encore l'interdisent avant qu'un acte d'adoration n'ait été accompli, et un hadith rapporté par Ahmad la juge sans valeur; les détails sont exposés dans la section correspondante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17428} Trente et unième point: ne pas utiliser moins d’un mudd d’eau. La majorité recommande de ne pas descendre en dessous d’un mudd, se basant sur le hadith d’Anas selon lequel le Prophète a accompli ses ablutions avec un mudd. L’école malikite, dans son avis le plus répandu, et l’école hanafite, estiment qu’aucune mesure fixe ne s’applique, l’objectif étant la vertu de modération. Ibn ‘Abidin rapporte d’après al-Hilya que plusieurs savants font état d’un consensus sur le fait que la quantité nécessaire n’est pas fixe. Ibn Shaban, de l'école malikite, affirme qu'une quantité inférieure à un mudd est insuffisante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429} Trente-deuxièmement, ne pas souffler dans l'eau en se lavant le visage, ce que les hanafites considèrent comme une marque de courtoisie pour les ablutions (wudu'), et effectuer ses ablutions avec l'eau courante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429} Trente-troisièmement, l'ordre des sunnas. Les écoles hanafite et chaféite considèrent cet ordre comme une sunna, tandis que les écoles malikite et hanafite le considèrent comme une recommandation au sein de chaque sunna. Si l'ordre est inversé entre les sunnas, ou entre les sunnas et les obligations, il n'est pas nécessaire de le répéter, car un acte recommandé non accompli n'est pas prescrit à nouveau. Selon une opinion shafi'ite, l'ordre des parties recommandées est obligatoire, par analogie avec les piliers de la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17429}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430} Trente-quatrièmement, prendre l'eau dans les deux mains pour se laver le visage. L'avis shafi'ite le plus solide, exposé dans le Mukhtasar d'al-Muzani et partagé par la plupart des shafi'ites, est que la manière recommandée est de prendre l'eau dans les deux mains, selon le hadith d'Abd Allah ibn Zayd où le Prophète plongeait ses mains dans l'eau et se lavait le visage trois fois, et parce que cela est plus complet. Une opinion shafi'ite préconise une seule main; une troisième opinion, celle de Zahir al-Sarakhsi, recommande de prendre l'eau dans la main droite, le dos de la main reposant sur la paume de la gauche, selon le hadith d'Ibn Abbas. Les Hanbalites affirment que le fait de se laver les mains à deux mains, ou en joignant la main droite à la gauche, est la sunna établie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17430}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431} Les actes déconseillés (makruhat). Les juristes énumèrent plusieurs pratiques déconseillées lors des ablutions (wudu'). Premièrement, se frapper le visage ou les autres membres avec de l'eau, le visage étant particulièrement valorisé; cette pratique est déconseillée par les Hanafites et les Shafi'ites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431} Deuxièmement, l'avarice, c'est-à-dire utiliser juste assez d'eau pour humidifier les membres sans que cela ne goutte visiblement; l'eau doit goutter afin que chacun des trois lavages soit effectué correctement; cette pratique est déconseillée par les Hanafites. Troisièmement, le gaspillage, c'est-à-dire l'utilisation excessive d'eau au-delà des besoins légaux, est déconseillé. Le Prophète a rapporté que Sa'd, croisé pendant qu'il accomplissait ses ablutions (wudu'), lui avait demandé si l'on pouvait être excessif dans ce rituel. Sa'd répondit par l'affirmative, allant jusqu'à dire qu'il pouvait utiliser l'eau d'une rivière en excès. Or, c'est l'excès qui engendre la scrupulosité, et l'on dit que nul ne peut abuser de la religion sans en être rongé. Les écoles hanafite, malikite, chaféite et hanbalite le désapprouvent. Parmi les actes déconseillés, les hanafites et les chaféites ajoutent qu'il est interdit de gaspiller l'eau mise à disposition pour les ablutions, comme celle d'une madrasa, car tout excès est proscrit, cette eau étant destinée aux ablutions appropriées. Ibn 'Abidin limite cette pratique à l'eau stagnante; l'eau courante est autorisée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17431}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432} Quatrièmement, l'utilisation de l'eau restante après les ablutions d'une femme, c'est-à-dire l'eau non bue ni trempée par inadvertance, est déconseillée par certains hanafites, certains chaféites et un hadith rapporté par Ahmad. D'autres hanafites, un hadith rapporté par Ahmad, l'école malikite et certains chaféites, dont al-Baghawi, la considèrent comme pure et purificatrice, et estiment que son utilisation n'est pas déconseillée. Ils citent le hadith d'Ibn 'Abbas concernant une épouse du Prophète se lavant dans un bassin, et l'affirmation selon laquelle l'eau ne devient pas impure par un état d'impureté majeure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432} L'école hanbalite, se basant sur le hadith d'al-Hakam ibn 'Amr al-Ghifari, interdit à un homme de se purifier avec l'eau résiduelle d'une femme. Al-Mardawi considère cette interdiction comme un acte d'adoration dont le sens est incertain, et qui est donc permis à la femme elle-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17432}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433} Cinquièmement, s'essuyer la tête trois fois avec de l'eau fraîche: les hanafites et les malikites désapprouvent cette pratique, et l'école hanbalite déconseille de la répéter. Sixièmement, accomplir les ablutions (wudu') dans un lieu impur est déconseillé car l'eau utilisée pour les ablutions doit être respectée, et il est important d'éviter que les gouttes d'eau ne souillent ce qui est impur. Les hanafites ajoutent qu'il est déconseillé, par souci de pureté, de jeter des mucosités dans l'eau ou de s'y moucher. Septièmement, les ablutions (wudu') à la mosquée sont déconseillées, sauf dans un récipient ou un lieu prévu à cet effet, selon les hanafites (rapporté par Ahmad et Malik). Les shafi'ites et l'avis hanbalite, plus fiable, les autorisent à condition que personne ne soit lésé et que la mosquée ne soit pas endommagée. Sahnun interdit les ablutions (wudu') dans la cour d'une mosquée. L'ouvrage cite le hadith préconisant l'installation de points de purification aux portes de la mosquée, et al-Haythami relève une rupture dans sa chaîne de transmission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17433}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434} Huitièmement, verser l'eau des ablutions dans la mosquée. Les Hanbalites désapprouvent cette pratique, et la désapprouvent également dans un lieu de passage, comme la route. Les Chafi'ites autorisent à la laisser tomber sur le sol de la mosquée si cela ne nuit à personne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434} Neuvièmement, les ablutions avec de l'eau chauffée par le soleil. L'avis majoritaire des Malikites, l'avis de l'école Chafi'ite et certains Hanafites désapprouvent cette pratique. La majorité des hanafites, les hanbalites, une opinion malikite et certains chaféites l'autorisent sans désapprobation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435} Dixièmement, l'omission d'une des sunnas des ablutions. Les malikites estiment qu'il est déconseillé d'en omettre une délibérément, bien que la prière ne soit pas invalidée pour autant; si elle est omise volontairement ou par oubli, il est recommandé de la rattraper pour les prières suivantes. Les hanafites considèrent l'omission d'un acte recommandé comme contraire à la meilleure pratique, et certains la jugent déconseillée par souci de pureté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435} Les actes qui annulent les ablutions (wudu'). Pour les hanafites, annuler les ablutions signifie les détourner de leur but, comme l'autorisation de prier; pour les malikites, c'est la fin de leur application ou la levée de leur maintien pour ce qu'elles autorisaient, comme la prière. Les juristes divergent sur certains points et s'accordent sur d'autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435} Premièrement, ce qui ressort des deux passages, généralement admis, citant les versets des sourates al-Ma'ida et an-Nisa'. Le mot « gha'it » est une métaphore pour désigner le besoin de se soulager dans un endroit creux. Si une personne vient de l'endroit sans nécessité, les ablutions (wudu') ne sont pas obligatoires, par consensus. Les juristes distinguent les émissions habituelles des émissions rares, ainsi que les émissions provenant du rectum, du rectum, du vagin ou d'autres parties du corps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435} Deuxièmement, les impuretés quittant d'autres parties du corps. Les Malikites et les Shafi'ites considèrent que celles-ci n'invalident pas les ablutions; seule la partie touchée est purifiée. Les Hanafites et les Hanbalites considèrent que ces impuretés, comme les vomissements et le sang, invalident généralement les ablutions, avec des divergences entre eux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17435}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} Troisièmement, la perte de conscience, due au sommeil, à la folie, à l'intoxication ou à l'évanouissement. La majorité des écoles de pensée hanafite, malikite, chaféite et hanbalite considèrent que le sommeil invalide les ablutions (wudu'), se basant sur le hadith selon lequel les yeux sont le lien des fesses; par conséquent, quiconque dort doit accomplir ses ablutions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} La distinction hanafite est la suivante: celui qui dort en s'allongeant ou en s'appuyant sur le côté invalide ses ablutions, car ses articulations se relâchent; en revanche, celui qui s'appuie sur un objet susceptible de tomber s'il était retiré doit être examiné. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17436} Selon l'analyse hanafite, si le dormeur est debout, incliné ou prosterné et que son siège ne se soulève pas du sol, les ablutions ne sont pas invalidées; si son siège a quitté le sol, elles sont invalidées, par consensus. Si le siège est surélevé mais que la personne qui dort ne l'a pas complètement quitté, al-Qaduri considère que les ablutions sont invalidées (avis hanafite attribué à al-Tahawi), tandis qu'al-Zayla'i estime plus juste de dire qu'elles ne le sont pas (rapport d'Abu Yusuf d'après Abu Hanifa). Dans ces cas, une personne qui dort pendant la prière ne perd pas ses ablutions (wudu'). En revanche, celle qui dort en dehors de la prière, en position de prosternation, les invalide, sauf si elle se trouve dans la position décrite. Selon al-Zayla'i, une personne malade qui prie couchée et s'endort invalide ses ablutions (wudu'), conformément au hadith relatif à la position couchée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} Si une personne dort assise et tombe sur le visage ou sur le côté: si elle se réveille avant de tomber, ou au moment de la chute, ou si elle s'est endormie et s'est réveillée aussitôt, les ablutions (wudu') ne sont pas invalidées. S'il se rassied après sa chute puis se réveille, les ablutions sont rompues, car il dormait en position semi-allongée; Abu Yusuf affirme que la chute elle-même les rompt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437} Les Hanafites disent que le sommeil n'est pas en soi une cause d'impureté; la cause est ce que le dormeur n'évite pas, et le signe apparent, le sommeil, tient lieu d'impureté, comme le voyage dans une autre règle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17437}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438} Les Malikites ont deux méthodes. La première, celle d'al-Lakhmi, est que c'est la qualité du sommeil qui compte et non la posture: un sommeil profond rompt les ablutions quelle que soit la posture, et son signe est que le dormeur n'est pas réveillé par un bruit fort ou par un éventail qui lui tombe des mains; Un sommeil léger ne rompt pas les ablutions. La seconde méthode, attribuée à 'Abd al-Haqq, considère qu'un sommeil profond rompt les ablutions dans tous les cas, tandis qu'un sommeil léger ne les rompt que lorsqu'on est couché ou prostré, et non debout ou assis. La première méthode est l'avis malikite, plus connu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17438} Les chaféites estiment que le sommeil rompt les ablutions sous toutes ses formes, sauf celui d'une personne fermement assise au sol ou sur un autre siège stable, même si elle s'appuie sur un objet qui tomberait s'il était déplacé, car il n'y a alors aucun risque d'émission par les voies rectales. L'émission par les voies antérieures n'est pas prise en compte, car elle est rare, et le récit d'Anas selon lequel les Compagnons dormaient puis priaient sans renouveler leurs ablutions est interprété comme le cas du sommeil de la personne fermement assise. Al-Nawawi énonce les règles suivantes: il est recommandé à celui qui a dormi assis de renouveler ses ablutions par précaution; si l’on est certain d’avoir dormi mais incertain de la stabilité de sa position assise, les ablutions ne sont pas nécessaires; si l’on a dormi assis et que ses fesses ont quitté le sol avant le réveil, les ablutions sont invalidées; mais si elles ont quitté le sol après le réveil ou en même temps, ou si l’on ignore l’ordre des événements, les ablutions ne sont pas invalidées, car la pureté prévaut. Il n’y a pas de différence entre un sommeil léger et un sommeil prolongé. Concernant celui qui a dormi accroupi, genoux relevés, trois avis divergent, et le meilleur est de ne pas invalider les ablutions. Celui qui dort sur le dos, les fesses à plat, est considéré comme ayant rompu ses ablutions (wudu'), et même s'il est attaché, l'avis général est que ses ablutions sont toujours rompues. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} Les Hanbalites distinguent trois types de sommeil. Le sommeil de celui qui est couché rompt les ablutions, que ce soit légèrement ou beaucoup, selon l'avis unanime des Hanbalites. Le sommeil de celui qui est assis rompt les ablutions si elles sont importantes, mais pas si elles sont légères. Quant au sommeil de celui qui est debout, incliné ou prosterné, Ahmad rapporte trois avis: l'école de pensée majoritaire considère que le sommeil rompt les ablutions; la seconde estime qu'il ne les rompt que si elles sont importantes; et la troisième considère que l'inclinaison ne rompt pas les ablutions, contrairement à la prosternation. Ils citent le texte général du hadith concernant les yeux, assimilant le fait de se bander les fesses, et le hadith « quiconque dort doit faire ses ablutions »; et pour la personne assise, ils citent Safwan ibn 'Assal, qui recommande de ne pas retirer ses chaussettes en voyage, sauf après avoir uriné, déféqué, uriné ou dormi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} Selon une opinion, la personne assise qui se penche ou s'accroupit est considérée comme allongée, tandis qu'Ahmad affirme qu'un sommeil léger ne compromet pas les ablutions et considère que se pencher ou s'allonger est plus grave que de s'accroupir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440} Ibn Qudama soutient que la personne assise, dont le siège repose fermement sur le sol, ne perd ses ablutions qu'en cas de sommeil prolongé, car les preuves concernant la personne assise ne font aucune distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} Les Hanbalites divergent quant à la durée du sommeil comptabilisée. Abu Ya'la affirme qu'il n'existe pas de mesure fixe et que c'est la coutume qui détermine le temps de sommeil. Une autre opinion considère que ce temps est comptabilisé comme un changement de posture du dormeur, par exemple une chute ou un rêve. Ibn Qudama soutient qu'il n'y a pas de mesure fixe, car les mesures ne sont connues que par révélation; ainsi, tout ce qui indique un sommeil important, comme la chute d'un dormeur assis, invalide les ablutions (wudu'). En cas de doute sur la durée du sommeil, les ablutions ne sont pas invalidées, car la pureté est certaine. Il ajoute que le sommeil est un état de maîtrise de l'esprit; par conséquent, celui dont l'esprit n'est pas maîtrisé n'a pas besoin d'ablutions, et celui qui doute d'avoir dormi, ou qui a une pensée d'origine incertaine, un rêve ou une pensée passagère, n'en a pas besoin non plus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} Deuxième avis: Abu Musa al-Ash'ari, Abu Mijlaz, Humayd al-A'raj et 'Amr ibn Dinar soutenaient que le sommeil n'invalide pas les ablutions (wudu'), citant le récit d'Anas concernant les Compagnons qui attendaient la prière du soir jusqu'à ce que leur tête s'incline. Al-Mardawi cite al-Maymuni, qui affirme également que le sommeil n'invalide pas les ablutions. Sa'id ibn al-Musayyab avait coutume de s'endormir plusieurs fois en attendant la prière, puis de prier sans renouveler ses ablutions. Ibn Qudama suggère qu'ils considéraient que le sommeil n'est pas une impureté en soi et que l'impureté est sujette à caution; ainsi, la certitude n'est pas remise en cause par le doute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17441} Selon l'école hanbalite, celui qui dort en croyant sa pureté ne la perd pas; Ibn Taymiyya a adopté cette opinion, tandis qu'al-Khallal a qualifié ce récit d'erreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Deuxièmement, l'évanouissement et le malaise annulent les ablutions (wudu') de manière consensuelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Troisièmement, la folie, même légère, annule les ablutions de manière consensuelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442} Quatrièmement, l'ivresse annule les ablutions de manière consensuelle. Cinquièmement, le fait de toucher les parties intimes d'un adulte, homme, femme ou intersexe, est controversé; ce point est détaillé dans les sections correspondantes. Sixièmement, le fait de toucher la peau d'un homme et d'une femme est controversé; ce point est détaillé dans les sections correspondantes. Septièmement, l'apostasie. Les hanafites, l'avis shafi'ite plus solide, un groupe de malikites et un hadith hanbalite soutiennent que l'apostasie en elle-même n'invalide pas les ablutions, mais annule les actes si elle est associée à la mort. Ainsi, celui qui apostasie alors qu'il était en état d'ablution (wudu') puis se convertit à l'islam conserve ses ablutions, sauf si un autre élément les annule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17442}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} L'avis majoritairement malikite, l'avis hanbalite plus solide et un avis chaféite soutiennent que l'apostasie annule les ablutions, citant le verset de la sourate Az-Zumar sur l'annulation des œuvres et considérant que cette annulation s'adresse à la communauté et non au Prophète. En revanche, un hadith rapporté par Musa ibn Mu'awiya d'après Ibn al-Qasim recommande les ablutions après l'apostasie. Al-Sawi explique que l'annulation concerne la récompense et que, selon l'avis majoritaire, les ablutions sont de nouveau dues car l'apostat revenu à l'islam se trouve dans la situation de celui qui vient d'atteindre la maturité. Huitièmement, rire à voix haute pendant la prière. La majorité (Malikites, Chafi'ites et Hanbalites) considère que cela ne rompt pas les ablutions mais invalide la prière; les Chafi'ites recommandent de refaire les ablutions après cela. L'école hanafite, et d'après al-Hasan, al-Nakha'i et al-Thawri, considère que rire à voix haute pendant une prière complète (avec inclinaison et prosternation) annule les ablutions et invalide la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17443} Neuvièmement, la consommation d'aliments ayant été en contact avec le feu. Deux avis s'opposent. Le premier, majoritaire et rapporté par Abou Bakr, Umar, Uthman, Ali, Ibn Mas'ud et d'autres, estime que cela ne requiert pas d'ablutions. Ils citent le hadith d'Ibn Abbas selon lequel le Prophète aurait mangé une épaule de mouton et prié sans ablutions, celui de Jabir selon lequel le dernier point concernait l'abandon des ablutions après un contact avec le feu, et l'adage selon lequel les ablutions concernent ce qui sort et non ce qui entre, un adage dont Ibn Hajar juge la chaîne de transmission faible. La deuxième opinion, défendue par 'Umar ibn 'Abd al-Aziz, al-Hasan, al-Zuhri, Abu Qilaba et Abu Mijlaz, est que les ablutions (wudu') sont requises; ils citent le hadith « faites vos ablutions après avoir été en contact avec du feu » rapporté par Muslim, d'après Abu Hurayra, 'Aïcha et Zayd ibn Thabit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17444} Dixième opinion: la consommation de viande de chameau. Deux avis existent. Le premier, partagé par les hanafites, les malikites, l'école shafi'ite (plus récente) et une école hanbalite, est qu'elle ne rompt pas les ablutions, contrairement aux autres aliments; al-Kasani explique cela par le fait que la rupture des ablutions est due à l'émission d'une impureté ou à ce qui la provoque, or cela ne s'est pas produit. La seconde opinion, celle de l'ancienne école shafi'ite (Ishaq, Yahya ibn Yahya, Ibn Khuzayma et Ibn al-Mundhir), stipule que les ablutions (wudu') sont requises uniquement pour la viande de chameau, en petite ou grande quantité, crue ou cuite. Ils citent le hadith de Jabir ibn Samura concernant l'homme qui demanda s'il fallait faire les ablutions après avoir mangé du mouton et du chameau, et la réponse du Prophète: les faire après le chameau. Ils citent également le hadith d'al-Bara'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445} Selon l'école hanbalite, la viande de chameau invalide les ablutions, qu'elle soit consommée sciemment ou non, crue ou cuite. Ahmad rapporte que la viande crue invalide les ablutions, mais pas la viande cuite; une autre opinion, retenue par Yusuf al-Jawzi et Ibn Taymiyya, affirme qu'elles ne les invalident en aucun cas. Une troisième règle, retenue par al-Khallal, stipule que la consommation d'aliments interdits n'entraîne la rupture des ablutions que si l'interdiction était connue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17445}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} L'école hanbalite considère que les autres parties du chameau, comme la bosse, la graisse, le foie et le ventre, n'entraînent pas la rupture des ablutions; boire du lait de chamelle ou le bouillon de sa viande n'entraîne pas non plus la rupture des ablutions, bien qu'un hadith rapporté par Ahmad indique que boire du lait de chamelle l'entraîne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} Enfin, la consommation d'aliments interdits fait débat au sein de l'école hanbalite: certains considèrent que la consommation d'aliments interdits entraîne la rupture des ablutions, d'autres que la consommation de viande interdite en toutes circonstances, et d'autres encore que la consommation de porc seulement. L'école hanbalite considère que la consommation de viande autre que celle de chameau ne constitue pas une rupture des ablutions, qu'elle soit licite ou illicite, car la règle concernant la viande de chameau est mal comprise et n'est donc pas étendue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} Douzièmement, la toilette mortuaire. La majorité ne la considère pas comme une rupture des ablutions; les hanafites recommandent les ablutions après la toilette mortuaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17446} L'école hanbalite, plus rigoureuse, considère que la toilette mortuaire rompt les ablutions; certains hanbalites admettent le contraire si le défunt a été lavé vêtu d'une chemise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447} Douzièmement, le doute quant à la validité des ablutions. Les Malikites considèrent que le doute constitue une infraction, car l'obligation de purification ne peut être accomplie sans certitude. Ils distinguent trois cas: celui qui, après avoir constaté sa pureté antérieure, doute de la survenue d'une infraction; celui qui, après avoir constaté son impureté, doute de la validité des ablutions; et celui qui, connaissant à la fois sa pureté et son impureté, doute de la première occurrence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17447} La majorité considère que le doute quant à la validité ou non des ablutions n'est pas une infraction: celui qui est certain d'avoir été pur et doute de la survenue d'une infraction, ou inversement, agit en se fondant sur sa certitude antérieure. Ils citent le hadith rapporté par Muslim concernant l'homme qui ressent une sensation dans son ventre et ignore si quelque chose en est sorti, et qui ne doit pas quitter la mosquée avant d'entendre un bruit ou de sentir quelque chose. Treizièmement, la médisance et les paroles injurieuses. Selon un hadith rapporté par Ahmad, la médisance, l'obscénité et autres actes similaires, y compris les ragots, le mensonge, la calomnie et le faux témoignage, annulent les ablutions (wudu'). Aïcha aurait dit qu'on accomplit les ablutions après un bon repas, mais non après avoir proféré une parole injurieuse. Les écoles hanafite et shafi'ite recommandent d'effectuer les ablutions après des paroles injurieuses telles que la médisance."
