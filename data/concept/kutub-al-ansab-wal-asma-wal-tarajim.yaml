id: concept/kutub-al-ansab-wal-asma-wal-tarajim
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "كتب الأنساب والأسماء والتراجم"
  en: "Books of genealogy, names and biographies"
  ur: "انساب، اسماء اور تراجم کی کتابیں"
  fr: "Livres de généalogie, de noms et de biographies"
  es: "Libros de genealogía, nombres y biografías"
  tr: "Soy Ağacı Kitapları, İsimler ve Biyografiler"
  id: "Buku, Nama, dan Biografi Genealogi"
summary:
  ar: "مراجع الأسماء العربية كما يعرضها ملف بحثي قُدّم إلى المتحف: ستة كتب في الأنساب والنسب منها أنساب السمعاني وجمهرة ابن حزم، وثمانية في الأسماء والكنى والمؤتلف والمختلف، واثنا عشر معجم تراجم، وسبعة مراجع أكاديمية حديثة، وسبعة موارد إلكترونية أبرزها «أونوماستيكون أرابيكوم» {cite:onomasticon-arabicum-cnrs} {cite:jstor-schimmel-islamic-names} {cite:nyu-arabic-collections-online}."
  en: "The reference works on Arabic names as a research file supplied to the museum sets them out: six books on genealogy and nisbas, among them al-Sam'ani's al-Ansab and Ibn Hazm's Jamhara, eight on names, kunyas and confusable names, twelve biographical dictionaries, seven modern academic works and seven online resources, chiefly the Onomasticon Arabicum {cite:onomasticon-arabicum-cnrs} {cite:jstor-schimmel-islamic-names} {cite:nyu-arabic-collections-online}."
  ur: "عربی ناموں کے مراجع، جیسا کہ میوزیم کو پیش کی گئی ایک تحقیقی فائل انہیں بیان کرتی ہے: انساب و نسبت پر چھ کتابیں جن میں سمعانی کی الانساب اور ابن حزم کی جمہرہ شامل ہیں، اسماء، کنیتوں اور مؤتلف و مختلف پر آٹھ، تراجم کی بارہ لغات، سات جدید علمی مراجع اور سات آن لائن وسائل، جن میں نمایاں «اونوماستیکون ارابیکم» ہے {cite:onomasticon-arabicum-cnrs} {cite:jstor-schimmel-islamic-names} {cite:nyu-arabic-collections-online}."
  fr: "Les ouvrages de référence sur les noms arabes, tels qu'un dossier de recherche remis au musée les présente : six livres sur la généalogie et les nisbas, dont al-Ansab d'al-Sam'ani et la Jamhara d'Ibn Hazm, huit sur les noms, les kunyas et les noms susceptibles d'être confondus, douze dictionnaires biographiques, sept ouvrages universitaires modernes et sept ressources en ligne, principalement l'Onomasticon Arabicum {cite:onomasticon-arabicum-cnrs} {cite:jstor-schimmel-islamic-names} {cite:nyu-arabic-collections-online}."
  es: "Las obras de referencia sobre los nombres árabes tal como las presenta un expediente de investigación entregado al museo: seis libros sobre genealogía y nisbas, entre ellos al-Ansab de al-Sam'ani y la Jamhara de Ibn Hazm, ocho sobre nombres, kunyas y nombres que pueden confundirse, doce diccionarios biográficos, siete obras académicas modernas y siete recursos en línea, principalmente el Onomasticon Arabicum {cite:onomasticon-arabicum-cnrs} {cite:jstor-schimmel-islamic-names} {cite:nyu-arabic-collections-online}."
  tr: "Müzeye sunulan bir araştırma dosyasında sunulan Arap isimlerine yapılan referanslar: Al-Sam'ani ve Jamharat Ibn Hazm dahil olmak üzere soybilim ve soy ağacı üzerine altı kitap; isimler, kunyalar, al-Mu'talif ve Al-Mukhtalif üzerine sekiz kitap; on iki biyografik sözlük; yedi güncel akademik referans; ve yedi elektronik kaynak, özellikle \"Onomasticon-Arabic-cnrs\" {cite:jstor-schimmel-islamic-names} {cite:nyu-arabic-collections-online}."
  id: "Referensi nama-nama Arab yang disajikan oleh berkas penelitian yang diserahkan ke museum: enam buku tentang silsilah dan garis keturunan, termasuk Al-Sam'ani dan Jamharat Ibn Hazm; delapan tentang nama, kunyas, al-Mu'talif, dan Al-Mukhtalif; dua belas kamus biografi; tujuh referensi akademik terbaru; dan tujuh sumber elektronik, yang paling terkenal \"Onomasticon-Arabic-cnrs\" {cite:jstor-schimmel-islamic-names} {cite:nyu-arabic-collections-online}."
