id: concept/canon-dry-wet-and-timed-uses-of-the-bath
class: concept
kind: scientific
label:
  ar: "استعمالات الحمام اليابس والرطب وأوقاته عند ابن سينا"
  en: "Dry and wet bathing and the timing of the bath in the Canon"
  fr: "Bain sec ou humide et moment du bain dans le Canon"
  ur: "خشک اور تر حمام اور اس کے اوقات، قانون کے مطابق"
  es: "Baños secos y húmedos y el momento del baño en el Canon"
  tr: "İbn Sina'ya göre kuru ve ıslak banyoların kullanımları ve zamanlamaları"
  id: "Penggunaan bak mandi kering dan basah serta waktunya menurut Ibn Sina"
summary:
  ar: "يفصل ابن سينا كيف يختلف أثر الحمام باختلاف استعماله: يابسا يجفف وينفع الاستسقاء والترهل، ورطبا يرطب، وطويل المقام يجفف بالتحليل والتعريق، وقصيره يرطب، وعلى الريق يجفف ويهزل، وبعد الشبع يسمن مع خطر السدد، وعند آخر الهضم الأول ينفع باعتدال {cite:canon-ibn-sina-print-v1 p.141}."
  en: "Ibn Sina sets out how the effect of the bath changes with its use: dry it dries and helps dropsy and soft swelling; wet it moistens; a long stay dries by dissolving and sweating, a short one moistens; on an empty stomach it dries and emaciates; just after a meal it fattens but risks blockages; at the end of the first digestion it helps in moderation {cite:canon-ibn-sina-print-v1 p.141}."
  fr: "Ibn Sina module les effets du bain : sec, il dessécherait et aiderait hydropisie et gonflement mou ; humide, il humidifierait ; long, il dessécherait par résolution et sueur ; bref, il humidifierait ; à jeun, il dessécherait et amaigrirait ; après repas, il engraisserait mais risquerait d’obstruer ; après première digestion, il aiderait modérément {cite:canon-ibn-sina-print-v1 p.141}."
  es: "Ibn Sina expone cómo cambia el efecto del baño según su uso: seco seca y ayuda con la hidropesía y la hinchazón suave; húmedo humedece; una estancia prolongada seca disolviendo y transpirando, una corta humedece; con el estómago vacío seca y adelgaza; justo después de una comida engorda pero conlleva riesgo de obstrucciones; al final de la primera digestión ayuda con moderación {cite:canon-ibn-sina-print-v1 p.141}."
  ur: "ابن سینا بتاتا ہے کہ اس کے استعمال سے غسل کا اثر کس طرح بدلتا ہے: اسے خشک کرنے سے خشک ہو جاتا ہے اور جلن اور نرم سوجن میں مدد ملتی ہے۔ گیلے اسے نمی کرتا ہے؛ طویل قیام پگھلنے اور پسینہ آنے سے خشک ہو جاتا ہے، ایک چھوٹا سا نم ہو جاتا ہے۔ خالی پیٹ پر یہ سوکھ جاتا ہے اور کمزور ہو جاتا ہے۔ کھانے کے فوراً بعد یہ فربہ ہوجاتا ہے لیکن رکاوٹوں کا خطرہ ہوتا ہے۔ پہلے ہاضمے کے اختتام پر یہ اعتدال میں مدد کرتا ہے"
  tr: "İbn Sina, güvercinlerin etkisinin kullanımına bağlı olarak nasıl değiştiğini detaylandırır: kuru ve yağmur ile sarkma için faydalı; nemli ve nemli; seyreltme ve nüfuzla uzun süreli kuru; kısa süreli kuru ve nemlendirilmiş; aç karnına kuru ve zayıflamış; tokluktan sonra tıkanıklık riski taşıyan yağlanır; ve ilk sindirimin sonunda orta derecede fayda sağlar {cite:canon-ibn-sina-print-v1 s.141}."
  id: "Ibn Sina merapikan bagaimana efek merpati bervariasi tergantung penggunaannya: kering dan bermanfaat untuk hujan dan kendur; lembap dan lembap; kekeringan jangka panjang yang dikeringkan dengan pengenceran dan permeasi; kering pendek dan lembap; kering saat perut kosong dan melemah; setelah kenyang, merpati menjadi gemuk dengan risiko tersumbat; dan pada akhir pencernaan pertama, memberikan manfaat yang sedang {cite:canon-ibn-sina-print-v1 hlm.141}."
