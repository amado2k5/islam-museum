summary:
  ar: "يفصل ابن سينا كيف يختلف أثر الحمام باختلاف استعماله: يابسا يجفف وينفع الاستسقاء والترهل، ورطبا يرطب، وطويل المقام يجفف بالتحليل والتعريق، وقصيره يرطب، وعلى الريق يجفف ويهزل، وبعد الشبع يسمن مع خطر السدد، وعند آخر الهضم الأول ينفع باعتدال {cite:canon-ibn-sina-print-v1 p.141}."
  en: "Ibn Sina sets out how the effect of the bath changes with its use: dry it dries and helps dropsy and soft swelling; wet it moistens; a long stay dries by dissolving and sweating, a short one moistens; on an empty stomach it dries and emaciates; just after a meal it fattens but risks blockages; at the end of the first digestion it helps in moderation {cite:canon-ibn-sina-print-v1 p.141}."
