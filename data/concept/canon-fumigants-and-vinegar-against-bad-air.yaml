summary:
  ar: "يعدد ابن سينا بخورات تصلح عفونة الأهوية، هي السعد والكندر والآس والورد والصندل، ويضيف أن استعمال الخل في الوباء أمان من آفاته، ويحيل تتمة الباب إلى الكتب الجزئية {cite:canon-ibn-sina-print-v1 p.259}."
  en: "Ibn Sina lists the fumigants that mend the putrefaction of airs, namely sa'd, frankincense, myrtle, rose and sandalwood, adds that vinegar in an epidemic is a safeguard against its afflictions, and refers the rest of the subject to the particular books {cite:canon-ibn-sina-print-v1 p.259}."
