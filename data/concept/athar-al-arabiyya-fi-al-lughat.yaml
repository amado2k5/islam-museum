id: concept/athar-al-arabiyya-fi-al-lughat
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "أثر العربية في اللغات الأخرى"
  en: "What Arabic gave other languages"
  ur: "عربی نے دوسری زبانوں کو کیا دیا"
  fr: "Ce que l'arabe a donné aux autres langues"
  es: "Lo que el árabe dio a otras lenguas"
summary:
  ar: "ما تقوله المراجع المقروءة عن أثر العربية في لغات أخرى: قائمة اللغات التي تذكرها صفحة الأمم المتحدة، والمالطية المنحدرة من لهجة عربية، والسواحلية واسمها المأخوذ من لفظ عربي، وانتقال الأبجدية إلى لغات أخرى، وما تقوله مقالات أخرى عن الفارسية والتركية والأردية والإسبانية. وتضيف عشر كلمات مثالاً ونسبة مذكورة من المفردات لكل من سبع لغات: الإسبانية والفارسية والتركية والأردية والسواحلية والملايوية والإندونيسية والهوسا، من ملخص بحثي قُدّم إلى المتحف ولم يفتح المتحف صفحاته."
  en: "What the sources read say of Arabic's influence on other languages: the list of languages named by the United Nations page, Maltese descending from an Arabic dialect, Swahili with its name taken from an Arabic word, the passing of the alphabet to other languages, and what other articles say of Persian, Turkish, Urdu and Spanish. It adds ten example words and a reported share of vocabulary for each of seven languages (Spanish, Persian, Turkish, Urdu, Swahili, Malay and Indonesian, Hausa) from a research summary supplied to the museum, whose pages the museum did not open."
  ur: "پڑھے گئے مآخذ دوسری زبانوں پر عربی کے اثر کے بارے میں کیا کہتے ہیں: اقوام متحدہ کے صفحے میں مذکور زبانوں کی فہرست، مالٹی جو عربی بولی سے نکلی، سواحلی جس کا نام ایک عربی لفظ سے لیا گیا، ابجد کا دوسری زبانوں تک پہنچنا، اور دوسرے مقالات فارسی، ترکی، اردو اور ہسپانوی کے بارے میں کیا کہتے ہیں۔ وہ سات زبانوں (ہسپانوی، فارسی، ترکی، اردو، سواحلی، ملائی اور انڈونیشی، ہاؤسا) میں سے ہر ایک کے لیے دس مثالی الفاظ اور ذخیرۂ الفاظ کا بیان کردہ تناسب بھی دیتا ہے، جو عجائب گھر کو فراہم کیے گئے ایک تحقیقی خلاصے سے ہے اور جس کے صفحات عجائب گھر نے نہیں کھولے۔"
  fr: "Ce que disent les sources lues de l'influence de l'arabe sur d'autres langues : la liste des langues nommées par la page des Nations unies, le maltais descendu d'un dialecte arabe, le swahili dont le nom vient d'un mot arabe, le passage de l'alphabet à d'autres langues, et ce que d'autres articles disent du persan, du turc, de l'ourdou et de l'espagnol. Elle ajoute dix mots d'exemple et une part rapportée du vocabulaire pour chacune de sept langues (espagnol, persan, turc, ourdou, swahili, malais et indonésien, haoussa), tirés d'un résumé de recherche remis au musée, dont le musée n'a pas ouvert les pages."
  es: "Lo que dicen las fuentes leídas sobre la influencia del árabe en otras lenguas: la lista de lenguas que nombra la página de las Naciones Unidas, el maltés descendiente de un dialecto árabe, el suajili cuyo nombre procede de una palabra árabe, el paso del alfabeto a otras lenguas, y lo que dicen otros artículos sobre el persa, el turco, el urdu y el español. Añade diez palabras de ejemplo y una proporción del vocabulario referida para cada una de siete lenguas (español, persa, turco, urdu, suajili, malayo e indonesio, hausa), tomadas de un resumen de investigación entregado al museo, cuyas páginas el museo no abrió."
