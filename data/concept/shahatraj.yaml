summary:
  ar: "الشاهترج في الكتاب أجوده الأخضر الحديث المر، بارد في الأولى يابس في الثانية، يصفي الدم ويفتح السدد وفيه برد لطعم القبض وحر لطعم المرارة وبرده أقوى، ويشرب للحكة والجرب، ويشد اللثة، ويقوي المعدة ويفتح سدد الكبد، ويلين الطبيعة ويدر البول، وبدله في الجرب والحميات العتيقة سنامكي {cite:canon-ibn-sina-print-v1 pp.671-672}"
  en: "Shahatraj is in the book best when green, fresh and bitter; it is cold in the first degree and dry in the second, purifies the blood and opens blockages, having coldness from its astringent taste and heat from its bitter taste, its coldness the stronger; it is drunk for itching and scab, firms the gums, strengthens the stomach and opens blockages of the liver, softens the nature and brings on urine, and its substitute in scab and old fevers is sanamakki {cite:canon-ibn-sina-print-v1 pp.671-672}"
  ur: "شاہترج کتاب میں سب سے اچھا سبز، تازہ اور کڑوا ہے؛ پہلے درجے میں ٹھنڈا اور دوسرے میں خشک ہے، خون کو صاف کرتا اور رکاوٹیں کھولتا ہے، اس میں قبض کے ذائقے کی وجہ سے ٹھنڈک اور کڑواہٹ کی وجہ سے گرمی ہے اور ٹھنڈک زیادہ قوی ہے؛ کھجلی اور خارش کے لیے پیا جاتا ہے، مسوڑھوں کو مضبوط کرتا ہے، معدے کو طاقت دیتا ہے اور جگر کی رکاوٹیں کھولتا ہے، طبیعت کو نرم کرتا اور پیشاب جاری کرتا ہے، اور خارش اور پرانے بخاروں میں اس کا بدل سنامکی ہے {cite:canon-ibn-sina-print-v1 pp.671-672}۔"
  es: "El shahatraj se considera mejor en el libro cuando está verde, fresco y amargo; es frío en el primer grado y seco en el segundo, purifica la sangre y desbloquea las obstrucciones, teniendo frío por su sabor astringente y calor por su sabor amargo, siendo su frío más intenso; se bebe para la picazón y la sarna, reafirma las encías, fortalece el estómago y desbloquea las obstrucciones del hígado, suaviza la naturaleza y provoca la micción, y su sustituto en la sarna y las fiebres antiguas es el sanamakki {cite:canon-ibn-sina-print-v1 pp.671-672}"
  fr: "Le Shahatraj est meilleur lorsqu'il est vert, frais et amer; il est froid au premier degré et sec au second, purifie le sang et débloque les voies respiratoires, sa fraîcheur provenant de son astringence et sa chaleur de son amertume étant plus marquée par la fraîcheur; il est consommé contre les démangeaisons et les croûtes, fortifie les gencives, tonifie l'estomac et débloque le foie, adoucit le tempérament et favorise la diurèse. Son substitut contre les croûtes et les fièvres anciennes est le sanamakki. {cite:canon-ibn-sina-print-v1 pp.671-672}"
