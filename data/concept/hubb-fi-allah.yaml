id: concept/hubb-fi-allah
class: concept
kind: social
label:
  ar: "الحب في الله"
  en: "Love for God's sake"
  es: "Amor por el amor de Dios"
  fr: "L'amour pour l'amour de Dieu"
  ur: "خدا کے لیے محبت"
summary:
  ar: "الحب في الله: أن يحب المرء أخاه ابتغاء وجه الله لا لغرض دنيوي؛ عدّه الحديث من أشد أواصر الإيمان، وجعل المتحابين فيه من السبعة الذين يظلهم الله بظله."
  en: "Love for God's sake: loving a brother seeking God's countenance rather than a worldly purpose; hadith counts it among the firmest bonds of faith and places two who love one another in Him among the seven shaded by God."
  es: "Amor por amor a Dios: amar a un hermano buscando la complacencia de Dios en lugar de un propósito mundano; el hadiz lo considera uno de los lazos de fe más firmes y coloca a dos que se aman en Él entre los siete protegidos por Dios."
  fr: "L’amour désintéressé: aimer son frère en recherchant la faveur de Dieu plutôt qu’un but terrestre; le hadith le compte parmi les liens de foi les plus solides et place les deux qui s’aiment en Lui parmi les sept protégés par Dieu."
  ur: "خدا کی خاطر محبت: دنیاوی مقصد کے بجائے خدا کے چہرے کے طالب بھائی سے محبت کرنا۔ حدیث اسے ایمان کے مضبوط ترین بندھنوں میں شمار کرتی ہے اور ان دو لوگوں کو جو ایک دوسرے سے محبت کرتے ہیں خدا کے سات سایہ داروں میں شامل کرتی ہے۔"
