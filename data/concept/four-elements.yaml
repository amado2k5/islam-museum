id: concept/four-elements
class: concept
kind: scientific
label: { ar: "الأركان الأربعة", en: "The four elements (al-arkan)" }
summary:
  ar: "الأركان عند ابن سينا أجسام بسيطة لا تنقسم إلى أجسام مختلفة الصورة، ومنها تتركب الكائنات بالامتزاج، وهي أربعة: النار والهواء خفيفان، والماء والأرض ثقيلان. يصف الأرض بأنها باردة يابسة، والماء بأنه بارد رطب {cite:canon-ibn-sina-print-v1 p.17}. ويتسلم الطبيب هذا من علم الطبيعة ولا يبرهن عليه في صناعته {cite:canon-ibn-sina-print-v1 p.17}."
  en: "For Ibn Sina the elements are simple bodies, not divisible into bodies different in form, and all compound beings are made from them by mixture. There are four: fire and air are light, water and earth heavy. He describes earth as cold and dry and water as cold and wet {cite:canon-ibn-sina-print-v1 p.17}. The physician takes this from natural philosophy and does not prove it within his own craft {cite:canon-ibn-sina-print-v1 p.17}."
