id: concept/four-elements
class: concept
kind: scientific
label: { ar: "الأركان الأربعة", en: "The four elements (al-arkan)", es: "Los cuatro elementos (al-arkan)", fr: "Les quatre éléments (al-arkan)", ur: "چار عناصر ⁦(الارکان)⁩", tr: "Dört Sütun", id: "Empat Pilar" }
summary:
  ar: "الأركان عند ابن سينا أجسام بسيطة لا تنقسم إلى أجسام مختلفة الصورة، ومنها تتركب الكائنات بالامتزاج، وهي أربعة: النار والهواء خفيفان، والماء والأرض ثقيلان. يصف الأرض بأنها باردة يابسة، والماء بأنه بارد رطب {cite:canon-ibn-sina-print-v1 p.17}. ويتسلم الطبيب هذا من علم الطبيعة ولا يبرهن عليه في صناعته {cite:canon-ibn-sina-print-v1 p.17}."
  en: "For Ibn Sina the elements are simple bodies, not divisible into bodies different in form, and all compound beings are made from them by mixture. There are four: fire and air are light, water and earth heavy. He describes earth as cold and dry and water as cold and wet {cite:canon-ibn-sina-print-v1 p.17}. The physician takes this from natural philosophy and does not prove it within his own craft {cite:canon-ibn-sina-print-v1 p.17}."
  es: "Para Ibn Sina, los elementos son cuerpos simples, indivisibles en cuerpos de distinta forma, y todos los seres compuestos se forman a partir de ellos mediante mezcla. Hay cuatro: el fuego y el aire son ligeros, el agua y la tierra son pesados. Describe la tierra como fría y seca, y el agua como fría y húmeda {cite:canon-ibn-sina-print-v1 p.17}. El médico toma esto de la filosofía natural y no lo demuestra dentro de su propia práctica {cite:canon-ibn-sina-print-v1 p.17}."
  fr: "Pour Ibn Sina, les éléments sont des corps simples, indivisibles en corps de formes différentes, et tous les êtres composés sont formés de leur mélange. Il y en a quatre: le feu et l’air sont légers, l’eau et la terre sont lourds. Il décrit la terre comme froide et sèche et l’eau comme froide et humide (voir: canon d’Ibn Sina, vol. 1, p. 17). Le médecin emprunte cette conception à la philosophie naturelle sans la démontrer dans sa propre pratique (voir: canon d’Ibn Sina, vol. 1, p. 17)."
  ur: "ابن سینا کے لیے عناصر سادہ اجسام ہیں، مختلف اجسام میں تقسیم نہیں ہوتے، اور تمام مرکبات ان سے مرکب کے ذریعے بنتے ہیں۔ چار ہیں: آگ اور ہوا روشنی، پانی اور زمین بھاری۔ وہ زمین کو سرد اور خشک اور پانی کو ٹھنڈا اور گیلا بتاتا ہے طبیب اسے فطری فلسفہ سے لیتا ہے اور اسے اپنے ہنر میں ثابت نہیں کرتا۔"
  tr: "İbn Sina'ya göre, sütunlar farklı cisimlere bölünmeyen basit cisimlerdir ve organizmalar karışarak oluşur ve dört türü vardır: hafif ateş ve hava, su ve toprak ise ağırdır. Toprağı soğuk ve kuru, suyu ise soğuk ve nemli olarak tanımlar {cite:canon-ibn-sina-print-v1 s.17}. Doktor bunu doğa biliminden kabul eder ve yaratımında kanıtlamaz {cite:canon-ibn-sina-print-v1 s.17}."
  id: "Menurut Ibn Sina, pilar-pilar tersebut adalah benda sederhana yang tidak terbagi menjadi berbagai tubuh, dari mana organisme tersusun melalui pencampuran, dan ada empat jenis: api ringan dan udara, serta air dan tanah berat. Ia menggambarkan bumi sebagai dingin dan kering, sedangkan air sebagai dingin dan lembap {cite:canon-ibn-sina-print-v1 hlm.17}. Dokter menerima hal ini dari ilmu alam dan tidak membuktikannya dalam ciptaannya {cite:canon-ibn-sina-print-v1 hlm.17}."
