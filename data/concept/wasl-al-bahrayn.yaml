label: { ar: "وصل بحر القلزم ببحر الروم", en: "Joining the Red Sea to the Mediterranean", es: "Uniendo el Mar Rojo con el Mediterráneo.", fr: "Reliant la mer Rouge à la Méditerranée", ur: "بحیرہ احمر سے بحیرہ روم میں شامل ہونا", tr: "Kızıldeniz, Akdeniz'e bağlanır.", id: "Laut Merah menghubungkan Laut Mediterania" }
summary:
  ar: "حفر بعض من ملك من الروم بين القلزم وبحر الروم طريقاً فلم يتأت له لارتفاع القلزم وانخفاض بحر الروم، والموضع الذي حفره يعرف بذنب التمساح على ميل من مدينة القلزم عليه قنطرة عظيمة يجتاز عليها من يريد الحج من مصر، وأجرى خليجاً إلى موضع يعرف بالهامة فلم يتصل، وحفر خليجاً آخر مما يلي تنيس ودمياط يعرف بالزبر والخبية استمر فيه الماء إلى نعنعان فكانت المراكب تدخل من البحرين ويتناقل أرباب المراكب الأحمال ثم ارتدم بمرور الدهور، ورام الرشيد وصل البحرين من أعالي مصب النيل فلم تتأت له قسمة ماء النيل فرامه من نحو الفرما وتنيس على أن يصب بحر القلزم إلى بحر الروم فقال يحيى بن خالد يخطف الروم الناس من المسجد الحرام والطواف لأن مراكبهم تنتهي إلى بحر الحجاز فتطرح سراياها مما يلي جدة فامتنع، وحكي عن عمرو بن العاص حين كان بمصر أنه رام ذلك فمنعه عمر بن الخطاب للسبب نفسه {cite:muruj-al-dhahab p. 558}."
  en: "The ancient canal-joining dossier: a Roman king's failed cut between Qulzum and the Mediterranean at the Crocodile's Tail bridge, the silted al-Zabr canal that once let boats relay goods between the seas, Harun al-Rashid's two attempts — abandoned when Yahya ibn Khalid warned that Roman squadrons would then land near Jeddah and snatch pilgrims from the Haram — and Umar's veto on Amr ibn al-As for the same reason {cite:muruj-al-dhahab p. 558}."
  es: "El expediente de la antigua conexión de canales: el fallido corte de un rey romano entre Qulzum y el Mediterráneo en el puente de la Cola de Cocodrilo, el canal de al-Zabr, ahora lleno de sedimentos, que una vez permitió a los barcos transportar mercancías entre los mares, los dos intentos de Harun al-Rashid —abandonados cuando Yahya ibn Khalid advirtió que escuadrones romanos desembarcarían cerca de Jeddah y raptarían a los peregrinos del Haram— y el veto de Umar a Amr ibn al-As por la misma razón {cite:muruj-al-dhahab p. 558}."
  fr: "Le dossier des anciens canaux de jonction: la tentative ratée d'un roi romain de relier Qulzum à la Méditerranée au pont de la Queue du Crocodile, le canal envasé d'al-Zabr qui permettait autrefois aux bateaux de relayer des marchandises entre les mers, les deux tentatives de Harun al-Rashid — abandonnées lorsque Yahya ibn Khalid a averti que les escadrons romains débarqueraient alors près de Djeddah et enlèveraient les pèlerins du Haram — et le veto d'Umar sur Amr ibn al-As pour la même raison {cite:muruj-al-dhahab p. 558}."
  ur: "قدیم نہر کو ملانے والی دستاویز: مگرمچھ کے دم کے پل پر قلزم اور بحیرہ روم کے درمیان رومن بادشاہ کا ناکام کٹنا، سلی ہوئی الزبر نہر جو کبھی کشتیوں کو سمندروں کے درمیان سامان لے جانے دیتی تھی، ہارون الرشید کی دو کوششیں - ترک کر دی گئیں جب یحییٰ بن خالد نے رومن کے جنگجوؤں اور جیدوں کے قریب جنگ بندی کی۔ حرم سے زائرین کو چھیننا — اور اسی وجہ سے عمرو بن العاص پر عمر کا ویٹو۔ 558}۔"
  tr: "Romalı krallardan bazıları, Kulzum ile Akdeniz arasında bir yol kazdılar, ancak Kulzum'un yüksekliği ve Akdeniz'in alçaklığı nedeniyle bu mümkün olmadı. Kazdığı yer, Kulzum şehrine bir mil uzaklıkta, Timsah Kuyruğu olarak bilinir ve üzerinde Mısır'dan Hac yapmak isteyenlerin geçtiği büyük bir köprü vardır. El-Hamah olarak bilinen bir yere bir kanal kazdı, ancak bağlantı kurulamadı. Tinnis ve Dimyat yakınlarında, El-Zübr ve El-Habiyye olarak bilinen başka bir kanal kazdı; bu kanaldan su Na'na'an'a kadar akıyordu, böylece gemiler iki denizden girip gemi sahipleri yüklerini aktarabiliyordu. Daha sonra yıllar içinde dolduruldu. El-Raşid, Nil nehrinin yukarı kısımlarından iki denizi birbirine bağlamak istedi, ancak Nil suyunu ayırmayı başaramadı. Yahya bin Halid, Akdeniz'in Akdeniz'e akması şartıyla, bunu El-Farma ve Tinnis yönünden yapmak istedi. Yahya bin Halid, \"Romalılar, gemileri Hicaz denizine ulaştığı ve Cidde yönünden baskınlar düzenlediği için, Mescid-i Haram'dan ve tavaftan insanları kaçıracaklar\" dedi. Bu yüzden reddetti. Rivayet edildiğine göre, Amr bin el-Aas Mısır'dayken bunu yapmak istemiş, ancak Ömer bin el-Hattab aynı sebeple onu engellemiştir."
  id: "Beberapa raja Romawi menggali jalan antara Qulzum dan Laut Mediterania, tetapi hal itu tidak memungkinkan karena perbedaan ketinggian Qulzum dan Laut Mediterania. Tempat yang digalinya dikenal sebagai Ekor Buaya, satu mil dari kota Qulzum, dan di atasnya terdapat jembatan besar yang dilintasi oleh mereka yang ingin melaksanakan ibadah haji dari Mesir. Ia menggali kanal ke tempat yang dikenal sebagai Al-Hamah, tetapi kanal itu tidak terhubung. Ia menggali kanal lain di dekat Tinnis dan Damietta, yang dikenal sebagai Al-Zubr dan Al-Khabiyyah, di mana air terus mengalir ke Na'na'an, sehingga kapal dapat masuk dari kedua laut dan pemilik kapal dapat memindahkan muatan. Kemudian kanal itu ditimbun selama bertahun-tahun. Al-Rashid ingin menghubungkan kedua laut dari hulu muara Sungai Nil, tetapi ia tidak mampu membelah air Sungai Nil. Maka ia ingin melakukannya dari arah Al-Farma dan Tinnis, dengan syarat Laut Mediterania akan mengalir ke Laut Mediterania. Yahya bin Khalid berkata, “Bangsa Romawi akan menculik orang-orang dari Masjidil Haram dan tawaf, karena kapal-kapal mereka mencapai Laut Hijaz dan melancarkan serangan mereka dari arah Jeddah.” Maka ia menolak. Diriwayatkan bahwa Amr bin Al-Aas, ketika berada di Mesir, ingin melakukan hal itu, tetapi Umar bin Al-Khattab mencegahnya dengan alasan yang sama."
