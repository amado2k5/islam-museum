id: concept/wasl-al-bahrayn
class: concept
kind: political
label: { ar: "وصل بحر القلزم ببحر الروم", en: "Joining the Red Sea to the Mediterranean" }
summary:
  ar: "حفر بعض من ملك من الروم بين القلزم وبحر الروم طريقاً فلم يتأت له لارتفاع القلزم وانخفاض بحر الروم، والموضع الذي حفره يعرف بذنب التمساح على ميل من مدينة القلزم عليه قنطرة عظيمة يجتاز عليها من يريد الحج من مصر، وأجرى خليجاً إلى موضع يعرف بالهامة فلم يتصل، وحفر خليجاً آخر مما يلي تنيس ودمياط يعرف بالزبر والخبية استمر فيه الماء إلى نعنعان فكانت المراكب تدخل من البحرين ويتناقل أرباب المراكب الأحمال ثم ارتدم بمرور الدهور، ورام الرشيد وصل البحرين من أعالي مصب النيل فلم تتأت له قسمة ماء النيل فرامه من نحو الفرما وتنيس على أن يصب بحر القلزم إلى بحر الروم فقال يحيى بن خالد يخطف الروم الناس من المسجد الحرام والطواف لأن مراكبهم تنتهي إلى بحر الحجاز فتطرح سراياها مما يلي جدة فامتنع، وحكي عن عمرو بن العاص حين كان بمصر أنه رام ذلك فمنعه عمر بن الخطاب للسبب نفسه {cite:muruj-al-dhahab p. 558}."
  en: "The ancient canal-joining dossier: a Roman king's failed cut between Qulzum and the Mediterranean at the Crocodile's Tail bridge, the silted al-Zabr canal that once let boats relay goods between the seas, Harun al-Rashid's two attempts — abandoned when Yahya ibn Khalid warned that Roman squadrons would then land near Jeddah and snatch pilgrims from the Haram — and Umar's veto on Amr ibn al-As for the same reason {cite:muruj-al-dhahab p. 558}."
