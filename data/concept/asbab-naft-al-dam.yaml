label:
  ar: "أسباب نفث الدم"
  en: "The causes of the spitting of blood"
  fr: "Les causes du crachement de sang"
  ur: "خون کے نفث کے اسباب"
  es: "Las causas de la escupir sangre"
summary:
  ar: "الأسباب القريبة لنفث الدم جراحة لسبب باد من ضربة أو سقطة على الصدر أو على الكبد أو تحديد صوت بلا تدريج أو ضجر ولهذا يكثر بالمجانين وبالذين يضجرون من كل شيء وقد ينتفت من القيء العنيف خصوصاً في المستعدين وقد ينتفت من تناول مسهلات حادة وأغذية حادة أو خوف أو غم محد للدم أو نوم على غير وطاء أو سبب يذكره الكتاب ⁦(سطر موسوم من حيوان يلتصق بالحلق)⁩ أو سبب واصل وهو إما في العروق وإما في غيرها، والذي في العروق إما انقطاع وإما انصداع وإما انفتاح وسعة من حدة أو استرخاء وإما تأكل لحدة خلط وإما لسخافة راسخة، وكثيراً ما تتسع المنافذ من أجزاء القصبة والشرايين فوق الذي في الطبع فيرشح الدم إلى القصبة، والذي في غير العروق إما جرحة وإما قرحة عن جراحة أو عن تأكل وتعفن إذا انقلع من العضو شيء، وقد يكون عن ورم دموي في الرئة يرشح منه الدم، ولهذه الأسباب الواصلة أسباب أقدم منها إما لكثرة المادة وذلك إما لكثرة الأغذية وترك الرياضة وإما لأنها فاضلة عن أعداد الطبيعة كما يعرض من ترك رياضة أو من أسباب يذكرها الكتاب فيمن يحتبس عندهم الدم ⁦(سطور موسومة في النساء وفيمن يذكرهم)⁩ وإما لاستعداد الآلات الحاوية للمادة لبرد يقبضها ويعسر انبساطها أو لحرارة خارجة أو داخلة أو يبوسة أعدتها بالتكثيف والتجفيف للانشقاق عن أدنى سبب أو لرطوبة أرختها فوسعت مسامها أو ملاقاة خارق أكال أو قطاع أو معفن، وإذا عرض الامتلاء الدموي أقبلت الطبيعة على دفع المادة إلى أي جهة أمكنتها إذا كانت أشد استعداداً أو أقرب من مكان الفضل فدفعتها بنفث أو إسالة أو نحوها ⁦(وفيها سطور موسومة)⁩ فإن كانت العروق قوية لا تخلى عن الدم عرض الموت فجأة لانصباب الدم إلى تجاويف العروق، والنفث في الأكثر يكون عن جراحة والجراحة تميل إلى أن تكون قرحة وإذا أعقب نفث الدم اليها الجراحة الأولى، وكثيراً ما يكون الدم المنفوث رعافاً سال من الرأس إلى الرئة، وإذا كان نفث الدم من نواحي الرئة تعلق به خوفان خوف من إفراطه وخوف من جراحته أن يصير قرحة وليس كل نفث دم مخوفاً بل ما كان لا يحتبس أو كان مع حمى، وكثيراً ما يكون نفث الدم بسبب البرد وورم في الكبد أو في الطحال {cite:canon-ibn-sina-print-v2 p.333}"
  en: "The near causes of the spitting of blood: a wound from a remote cause — a blow, a fall on the chest or the liver, straining the voice without graduation, or vexation; for this it abounds in the mad and in those vexed at everything. It may be spat up from violent vomiting, especially in the ready, and from taking sharp purgatives and sharp foods, or from fear or grief constricting the blood, or sleeping on an uncomfortable bed, or a cause the book names (a labelled line of an animal clinging inside the throat), or a proximate cause which is either in the vessels or elsewhere. What is in the vessels is either a cutting, a splitting, or an opening and widening from sharpness or relaxation, or an erosion by a humour's sharpness, or a rooted weakness; and often the passages of the windpipe's and arteries' parts widen beyond what is in nature, so the blood seeps to the windpipe. What is elsewhere is either a wound or an ulcer from wounding or from erosion and putrefaction when something is torn off the organ; and it may be from a sanguine tumour in the lung from which the blood seeps. For these proximate causes there are causes older than they: either for the matter's abundance — either for much food and leaving exercise, or because it is a surplus over nature's counts, as befalls from leaving exercise or from causes the book names in those whose blood is retained (labelled lines in women and in those he names) — or for the readiness of the vessels holding the matter: a cold contracting them and making their expansion hard, so they do not obey the charged power except by splitting; or an exiting or entering heat, or a dryness having prepared them by thickening and drying for splitting at the least cause, or a moisture relaxing them and widening their pores, or meeting a corrosive, cutting or putrefying thing. When sanguine fullness befalls, nature sets about pushing the matter to whatever side is open to it, the readiest or nearest to the place of the surplus — pushing it by spitting or by a flow or the like (among them labelled lines); and if the vessels are too strong to yield the blood, sudden death befalls from the blood's pouring into the vessels' hollows. The spitting is mostly from a wound, and the wound inclines to become an ulcer when the spitting of blood follows the first wound; and often the spat blood is a nosebleed having flowed from the head into the lung. When the spitting is from the lung's regions two fears attach to it: fear of its excess and fear that its wound become an ulcer; not every spitting of blood is to be feared — only what does not stop, or comes with fever. And often the spitting of blood is for cold and a tumour in the liver or in the spleen {cite:canon-ibn-sina-print-v2 p.333}"
  fr: "Les causes proches du crachement de sang : une blessure due à une cause éloignée — coup, chute sur la poitrine ou le foie, effort vocal sans progression, ou irritation ; c’est pourquoi il abonde chez les fous et ceux que tout irrite. Il peut être craché après des vomissements violents, surtout chez les sujets prédisposés, après l’ingestion de purgatifs et d’aliments âcres, par peur ou chagrin resserrant le sang, en dormant sur un lit inconfortable, par une cause nommée par le livre (ligne signalée concernant un animal accroché à l’intérieur de la gorge), ou par une cause immédiate dans les vaisseaux ou ailleurs. Dans les vaisseaux, il s’agit d’une section, d’une fissure, d’une ouverture et dilatation par âcreté ou relâchement, d’une érosion par l’âcreté d’une humeur ou d’une faiblesse enracinée ; souvent les passages des parties de la trachée et des artères se dilatent au-delà du naturel, laissant le sang suinter vers la trachée. Ailleurs, il s’agit d’une plaie ou d’un ulcère par blessure, érosion ou putréfaction quand quelque chose est arraché à l’organe ; il peut s’agir d’une tumeur sanguine du poumon dont le sang suinte. Ces causes immédiates ont des causes antérieures : soit l’abondance de matière — excès d’aliments et abandon de l’exercice, ou surplus par rapport aux comptes de la nature, comme après l’abandon de l’exercice ou selon les causes nommées par le livre chez ceux dont le sang est retenu (lignes signalées concernant les femmes et les personnes qu’il nomme) — soit la disposition des vaisseaux qui contiennent la matière : froid les contractant et rendant leur expansion difficile, de sorte qu’ils ne cèdent à la faculté chargée qu’en se fissurant ; chaleur sortante ou entrante ; sécheresse les ayant épaissis et desséchés, les préparant à se fendre à la moindre cause ; humidité les relâchant et dilatant leurs pores ; ou rencontre d’une chose corrosive, coupante ou putréfiante. Lorsque survient la plénitude sanguine, la nature pousse la matière du côté qui lui est ouvert, le plus disponible ou le plus proche du lieu du surplus — par crachement, écoulement ou autre moyen semblable (parmi eux des lignes signalées) ; si les vaisseaux sont trop forts pour céder le sang, une mort subite survient par son déversement dans leurs cavités. Le crachement vient surtout d’une blessure, et celle-ci tend à devenir un ulcère lorsque le crachement de sang la suit ; souvent, le sang craché est un saignement de nez descendu de la tête au poumon. Lorsque le crachement vient des régions pulmonaires, deux craintes s’y attachent : son excès et la transformation de sa plaie en ulcère ; tout crachement de sang n’est pas à craindre — seulement celui qui ne s’arrête pas ou s’accompagne de fièvre. Il vient souvent du froid et d’une tumeur du foie ou de la rate {cite:canon-ibn-sina-print-v2 p.333}"
  ur: "خون کے نفث کے قریبی اسباب: بعید سبب سے زخم یعنی ضرب سینے یا جگر پر گرنا بغیر تدریج کے آواز تیز کرنا یا خفگی اسی لیے پاگلوں اور ہر چیز سے خفا ہونے والوں میں کثیر ہوتی ہے؛ اور سخت قے سے بھی ہو سکتی ہے خاص طور پر مستعدوں میں اور تیز مسهلوں اور تیز خوراکوں سے یا خوف یا غم سے جو خون کو محدود کرے یا بے آرام بستر پر سونے سے یا ایک سبب جو کتاب بیان کرتی ہے ⁦(حلق کے اندر چمٹنے والے جانور کی موسوم سطر)⁩ یا قریب سبب جو یا تو رگوں میں ہو یا کہیں اور؛ جو رگوں میں ہو وہ یا انقطاع ہے یا شق ہے یا کھلنا اور حدت یا ڈھیل پن سے وسعت یا خلط کی حدت سے کٹرنا یا جڑ پکڑی کمزوری؛ اور اکثر نالی اور شریانوں کے اجزا کے منافذ فطرت سے بڑھ کر کھل جاتے ہیں تو خون نالی میں ترشح کرتا ہے؛ جو رگوں کے سوا ہو وہ یا زخم ہے یا زخم یا کٹ اور سڑ سے قرحة جب عضو سے کچھ اکھڑ جائے؛ اور پھیپھڑے میں دموی ورم سے ترشح کر سکتا ہے؛ ان قریب اسباب کے مزید قدیم اسباب ہیں یا مادے کی کثرت یا تو زیادہ خوراک اور ورزش چھوڑنے سے یا فطرت کے اعتبار سے فاضل ہونے سے جیسے ورزش چھوڑنے یا ان اسباب سے جو کتاب ان کے لیے بیان کرتی ہے جن میں خون محتبس رہتا ہے ⁦(عورتوں اور مذکورہ اشخاص میں موسوم سطریں)⁩ یا مادہ رکھنے والی رگوں کے استعداد سے: ٹھنڈ جو انہیں قبض دے اور پھیلنا دشوار کرے تو وہ مکلف قوت کی اطاعت تڑک کر ہی کرتی ہیں یا بیرونی یا اندرونی حرارت یا خشکی جو انہیں کم سے کم سبب پر شق کے لیے تیار کرے یا رطوبت جو ڈھیلی کر کے مسام کھولے یا کاری کاٹنے یا سڑانے والی چیز سے ملاقات؛ جب دموی امتلاء ہو تو فطرت مادے کو جس طرف ممکن ہو دھکیلنے لگتی ہے جو زیادہ مستعد یا فاضل کے مقام کے قریب ہو نفث یا بہاؤ یا اسی طرح ⁦(ان میں موسوم سطریں)⁩ اور اگر رگیں قوی ہوں اور خون نہ چھوڑیں تو اچانک موت آتی ہے خون کے رگوں کی کھائیوں میں بہنے سے؛ نفث اکثر زخم سے ہوتا ہے اور زخم قرحة بننے کا مائل ہوتا ہے جب نفث دم پہلے زخم کے بعد آئے؛ اور اکثر نکला ہوا خون نکسیر ہوتا ہے جو سر سے پھیپھڑے میں بہی ہو؛ جب نفث پھیپھڑے کی طرف سے ہو تو دو خوف لازم آتے ہیں اس کے ہڑتال کا اور زخم کے قرحة بننے کا؛ ہر نفث دم خطرناک نہیں بلکہ جو رکے نہ یا بخار کے ساتھ ہو؛ اور اکثر نفث دم ٹھنڈ اور جگر یا طحال کی سوجن سے ہوتا ہے {cite:canon-ibn-sina-print-v2 p.333}"
  es: "Las causas próximas de la expectoración de sangre: una herida de una causa lejana —un golpe, una caída sobre el pecho o el hígado, forzar la voz sin graduación, o la irritación; pues esto abunda en los locos y en los irritados por todo. Puede ser escupida por vómitos violentos, especialmente en estado de alerta, y por tomar purgantes fuertes y alimentos irritantes, o por miedo o pena que contraen la sangre, o dormir en una cama incómoda, o una causa que el libro menciona (una línea etiquetada de un animal aferrado dentro de la garganta), o una causa próxima que está en los vasos o en otro lugar. Lo que está en los vasos es o bien un corte, una división, o una apertura y ensanchamiento por agudeza o relajación, o una erosión por la agudeza de un humor, o una debilidad arraigada; y a menudo los conductos de las partes de la tráquea y las arterias se ensanchan más de lo que es natural, por lo que la sangre se filtra a la tráquea. Lo que hay en otro lugar es una herida o una úlcera por lesión o por erosión y putrefacción cuando algo se arranca del órgano; y puede ser por un tumor sanguíneo en el pulmón del que se filtra la sangre. Para estas causas próximas hay causas más antiguas que ellas: ya sea por la abundancia de la materia —ya sea por mucha comida y falta de ejercicio, o porque es un excedente sobre los recuentos naturales, como sucede por falta de ejercicio o por causas que el libro menciona en aquellos cuya sangre se retiene (líneas etiquetadas en mujeres y en aquellos que él menciona)— o por la disposición de los vasos que contienen la materia: un frío que los contrae y hace que su expansión sea dura, de modo que no obedecen al poder cargado excepto por la división; o un calor saliente o entrante, o una sequedad que los ha preparado espesándolos y secándolos para dividirse a la menor causa, o una humedad que los relaja y ensancha sus poros, o encontrarse con algo corrosivo, cortante o putrefacto. Cuando sobreviene la plenitud sanguínea, la naturaleza se dispone a empujar la materia hacia el lado más accesible, el más cercano al lugar del exceso, empujándola mediante un chorro, un flujo o algo similar (entre ellos, líneas etiquetadas); y si los vasos son demasiado fuertes para contener la sangre, sobreviene la muerte súbita por el derrame de la sangre en las cavidades de los vasos. El chorro suele provenir de una herida, y esta tiende a convertirse en úlcera cuando el chorro de sangre sigue a la herida inicial; y a menudo la sangre escupida es una hemorragia nasal que ha fluido desde la cabeza hasta los pulmones. Cuando el chorro proviene de las regiones pulmonares, se asocian dos temores: el temor a su exceso y el temor a que la herida se convierta en úlcera; no todo chorro de sangre es motivo de temor, solo el que no cesa o viene acompañado de fiebre. Y a menudo la expectoración de sangre se debe a un resfriado y a un tumor en el hígado o en el bazo {cite:canon-ibn-sina-print-v2 p.333}"
