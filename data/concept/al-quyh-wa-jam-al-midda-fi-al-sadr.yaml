"summary":
  "ar": "القيح في كلام الأطباء يأتي على معنيين: أحدهما ما يستعمل في كل موضع وهو جمع\
    \ الورم للمدة، والثاني ما يستعمل خاصة في أمراض الصدر ويراد به امتلاء الفضاء الذي\
    \ بين الصدر والرئة من قيح انفجر إليه إما في الجانبين معاً وإما في جانب واحد. وأسباب\
    \ هذا الامتلاء إما نزلة تصب المادة دفعة، أو قروح في الرئة تسيل منها مدة صديدية\
    \ فينفتح بعد عشرين يوماً في الأكثر ثم ينفث، وإما انفجار ورم في نواحي الصدر وهو\
    \ الأكثر ويكون ذلك إما مدة نضيجة وإما شيئاً كالدردي. وأحوال ذلك أربعة: فإنه إما\
    \ يحيق بالكثرة ليقتل ويظهر ذلك بأن يأخذ نفسه يضيق ولا ينفث، وإما أن تعفن الرئة\
    \ فيوقع في السل، وإما أن يستنقي بالنفث المتدارك السهل، وإما أن يستنقي باندفاع\
    \ من طريق العرق العظيم والشريان العظيم إلى المثانة بولاً غليظاً ويكون سلوكه أولاً\
    \ من الوريد إلى الكبد ثم إلى الكلية وقد يرد إلى الأمعاء برازاً وهما محمودان وقد\
    \ سلف منا كلام في ذكر مدة الانفجار. ويعرف ذلك بحسب قوة العلامات وبحسب السن والفصل\
    \ والمزاج، والمشايخ يهلكون في التقيح أكثر من الشباب لضعف ناحية قلوبهم والشباب\
    \ يهلكون في الأوجاع أكثر من المشايخ لشدة حسهم. وقد ذكرنا علامات التقيح في باب\
    \ علامات انفعالات ذات الجنب وكذلك علامات الانفجار {cite:canon-ibn-sina-print-v2\
    \ p.353}"
  "en": "Pus in the physicians' speech bears two meanings: one, what is used everywhere\
    \ — the tumour's gathering of matter; the other, what is used specially in the\
    \ diseases of the chest, meaning the filling of the space between the chest and\
    \ the lung with pus that has burst into it, on both sides together or on one side.\
    \ The causes of this filling are either a catarrh pouring the matter at once,\
    \ or ulcers in the lung from which a purulent matter leaks, opening after twenty\
    \ days at most and then being expectorated, or the bursting of a tumour in the\
    \ regions of the chest — which is the commonest — the matter being either ripe\
    \ or something like dregs. Its states are four: it may overwhelm by abundance\
    \ and kill, shown by the breath's narrowing with no expectoration; or the lung\
    \ putrefies and casts him into consumption; or it is cleansed by an easy, kept-up\
    \ expectoration; or it is cleansed by a driving-off through the great vein and\
    \ the great artery to the bladder as a thick urine — its path first from the vein\
    \ to the liver, then to the kidney — and it may come into the bowels as stool;\
    \ the last two are commended, and we have already spoken of the time of the bursting.\
    \ It is judged by the strength of the signs, and by the age, the season and the\
    \ temperament. The aged perish in the suppuration more than the young, for the\
    \ weakness of their heart's quarter, and the young perish in the pains more than\
    \ the aged, for the sharpness of their feeling. We have stated the signs of suppuration\
    \ in the chapter of the signs of pleurisy's affections, and likewise the signs\
    \ of the bursting {cite:canon-ibn-sina-print-v2 p.353}"
  "fr": "Le pus, dans le langage des médecins, a deux sens : l’un, employé partout — l’amas de matière de la tumeur ; l’autre, employé spécialement dans les maladies de la poitrine, désignant la réplétion de l’espace entre la poitrine et le poumon par du pus qui s’y est déversé en crevant, des deux côtés à la fois ou d’un seul côté. Les causes de cette réplétion sont soit un catarrhe qui déverse la matière d’un coup, soit des ulcères du poumon d’où suinte une matière purulente, qui s’ouvrent après vingt jours au plus puis sont expectorés, soit la rupture d’une tumeur dans les régions de la poitrine — ce qui est le plus fréquent —, la matière étant soit mûre, soit semblable à une lie. Ses états sont au nombre de quatre : elle peut submerger par son abondance et tuer, ce que montre le souffle qui se resserre sans expectoration ; ou le poumon se putréfie et le jette dans la consomption ; ou elle est purifiée par une expectoration aisée et soutenue ; ou elle est purifiée par une évacuation par la grande veine et la grande artère vers la vessie sous forme d’urine épaisse — son chemin allant d’abord de la veine au foie, puis au rein —, et elle peut venir dans les intestins sous forme de selles ; ces deux dernières issues sont louées, et nous avons déjà parlé du moment de la rupture. On en juge par la force des signes, ainsi que par l’âge, la saison et le tempérament. Les vieillards périssent dans la suppuration plus que les jeunes, en raison de la faiblesse de la région de leur cœur, et les jeunes périssent dans les douleurs plus que les vieillards, en raison de l’acuité de leur sensibilité. Nous avons indiqué les signes de la suppuration au chapitre des signes des affections de la pleurésie, ainsi que les signes de la rupture {cite:canon-ibn-sina-print-v2 p.353}"
  "ur": "اطباء کی زبان میں پیپ کے دو معنی ہیں: ایک وہ جو ہر جگہ مستعمل ہے یعنی ورم\
    \ کا مادہ جمع کرنا اور دوسرا وہ جو خاص سینے کے امراض میں ہے یعنی سینے اور پھیپھڑے\
    \ کے درمیانی فضا کا پیپ سے بھرنا جو اس میں پھٹ کر آیا ہو دونوں جانب یا ایک جانب۔\
    \ اس امتلاء کے اسباب: یا تو نزلة جو مادہ ایک دم بہا دے یا پھیپھڑے میں قروح جن\
    \ سے صديدی مادہ رسے اور زیادہ سے زیادہ بیس دن بعد کھل کر نفث ہو یا سینے کی نواحی\
    \ میں ورم کا پھٹنا جو سب سے زیادہ ہے اور وہ یا پکا مادہ ہوتا ہے یا تلچھٹ جیسی\
    \ چیز۔ اس کی چار حالتیں ہیں: یا کثرت سے گھیر کر قتل کرے جس کی علامت سانس کا تنگ\
    \ ہونا اور نفث نہ ہونا ہے یا پھیپھڑا سڑ جائے اور سل میں ڈال دے یا آسان مسلسل نفث\
    \ سے صاف ہو جائے یا بڑی رگ اور بڑی شریان کے راستے مثانے کی طرف گاڑھے پیشاب میں\
    \ دھکیل دے اور اس کا راستہ پہلے شریان سے جگر پھر گردے ہوتا ہے اور بعض اوقات امعاء\
    \ میں براز آ جائے اور یہ دونوں پسندیدہ ہیں اور انفجار کے وقت کی بات پہلے کہی جا\
    \ چکی۔ یہ علامات کی قوت اور عمر موسم اور مزاج کے حساب سے جانا جاتا ہے۔ بوڑھے تقيح\
    \ میں جوانوں سے زیادہ مرتے ہیں دل کی طرف کی کمزوری سے اور جوان بوڑھوں سے زیادہ\
    \ دردوں میں مرتے ہیں حاس کی شدت سے اور ہم تقيح اور انفجار کی علامات ذات الجنب\
    \ کے انفعالات کے باب میں کہہ چکے ہیں {cite:canon-ibn-sina-print-v2 p.353}"
  "es": "El pus en el lenguaje médico tiene dos significados: uno, el que se usa en todas partes: la acumulación de materia del tumor; el otro, el que se usa especialmente en las enfermedades del tórax, que significa el llenado del espacio entre el tórax y el pulmón con pus que ha reventado en él, en ambos lados a la vez o en un lado. Las causas de este llenado son o bien un catarro que vierte la materia de inmediato, o úlceras en el pulmón de las que se filtra una materia purulenta, que se abren después de veinte días como máximo y luego se espera, o la ruptura de un tumor en las regiones del tórax —que es la más común— la materia está madura o algo parecido a los sedimentos. Sus estados son cuatro: puede abrumar por abundancia y matar, lo que se muestra por el estrechamiento de la respiración sin expectoración; o el pulmón se pudre y lo lleva a la tisis; o se limpia por una expectativa fácil y mantenida; o bien se limpia mediante la expulsión a través de la vena principal y la arteria principal hasta la vejiga como una orina espesa —su recorrido primero desde la vena hasta el hígado, luego hasta el riñón— y puede llegar a los intestinos como heces; las dos últimas son recomendables, y ya hemos hablado del momento de la ruptura. Se juzga por la intensidad de los signos, y por la edad, la estación y el temperamento. Los ancianos perecen más en la supuración que los jóvenes, debido a la debilidad de su corazón, y los jóvenes perecen más en los dolores que los ancianos, debido a la agudeza de sus sentimientos. Hemos expuesto los signos de la supuración en el capítulo de los signos de las afecciones de la pleuresía, y también los signos de la ruptura {cite:canon-ibn-sina-print-v2 p.353}"
