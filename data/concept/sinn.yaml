id: concept/sinn
class: concept
kind: legal
label:
  ar: "السِّنّ"
  en: "Sinn (the tooth) and retaliation and compensation for it"
  es: "Pecado (el diente) y represalia y compensación por ello"
  fr: "Le péché (la dent) et les représailles et la compensation qui en découle"
  ur: "گناہ ⁦(دانت)⁩ اور اس کا بدلہ اور معاوضہ"
summary:
  ar: "السن في اللغة واحدة الأسنان، وهي قطعة من العظم تنبت في الفك، والسن من الشيء كل جزء مسنن محدد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} اتفق أهل العلم على وجوب القصاص في السن المتعمد إذا أمكن استيفاء المماثلة، والدية في كل سن خمس من الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} واختلف الفقهاء في كسر السن وفي قلع سن من لم يثغر، وفي وقت القصاص، وفي عودة السن بعد القلع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9843} وأجاز جمهور الفقهاء للرجل أن يتخذ سنا من الذهب أو الفضة، وحرم التفليج للزينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9847}"
  en: "In the lexicon sinn is a single tooth, a piece of bone set in the jaw, and the sinn of a thing is any toothed, pointed part of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} The jurists agree that retaliation is due for a deliberately extracted tooth where equal matching is possible, and that the diya of each tooth is five camels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} They differ on breaking a tooth, on extracting the tooth of one who has not yet shed his milk teeth, on the timing of retaliation, and on a tooth that grows back after extraction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9843} Most jurists allow a man to fit a gold or silver tooth, and filing the teeth apart for beauty is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9847}"
  es: "En el léxico, sinn es un solo diente, un trozo de hueso insertado en la mandíbula, y el sinn de una cosa es cualquier parte dentada y puntiaguda de ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} Los juristas coinciden en que se debe represalia por un diente extraído deliberadamente cuando es posible una contrapartida igualitaria, y que el diya de cada diente es de cinco camellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} Difieren en cuanto a romper un diente, en cuanto a extraer el diente de alguien que aún no ha perdido sus dientes de leche, en cuanto al momento de la represalia y en cuanto a un diente que vuelve a crecer después de la extracción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9843} La mayoría de los juristas permiten que un hombre use un diente de oro o plata, y limar los dientes por motivos estéticos está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9847}"
  fr: "Dans le lexique, « sinn » désigne une dent isolée, un fragment d'os implanté dans la mâchoire, et le « sinn » d'une chose désigne toute partie dentelée et pointue de celle-ci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} Les juristes s'accordent à dire que la vengeance est due pour une dent extraite délibérément, lorsqu'une riposte équivalente est possible, et que la valeur de chaque dent est de cinq chameaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} Ils divergent cependant sur la question de la fracture d'une dent, de l'extraction d'une dent chez un enfant dont les dents de lait ne sont pas encore tombées, du moment de la vengeance et du cas d'une dent qui repousse après extraction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9843} La plupart des juristes autorisent le port d'une dent en or ou en argent, et le limage des dents à des fins esthétiques est interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9847}"
  ur: "لغت میں گناہ ایک دانت ہے، جبڑے میں ہڈی کا ایک ٹکڑا لگا ہوا ہے، اور کسی چیز کا گناہ اس کا کوئی دانت دار، نوکدار حصہ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 9840} فقہاء اس بات پر متفق ہیں کہ قصداً نکالے گئے دانت کا بدلہ لیا جائے گا جہاں برابر مماثلت ممکن ہو اور ہر دانت کی دیت پانچ اونٹ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص9840} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9846} ان میں دانت ٹوٹنے، دودھ کے دانت نکالنے، دودھ کے دانت نکالنے، پیٹھ بڑھنے کے بعد اور بڑھنے کے وقت پر اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9841} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص9843} اکثر فقہاء نے مرد کو سونے یا چاندی کے دانت لگانے کی اجازت دی ہے اور خوبصورتی کے لیے دانتوں کو الگ کرنا حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9846}"
