id: concept/sinn
class: concept
kind: legal
label:
  ar: "السِّنّ"
  en: "Sinn (the tooth) and retaliation and compensation for it"
summary:
  ar: "السن في اللغة واحدة الأسنان، وهي قطعة من العظم تنبت في الفك، والسن من الشيء كل جزء مسنن محدد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} اتفق أهل العلم على وجوب القصاص في السن المتعمد إذا أمكن استيفاء المماثلة، والدية في كل سن خمس من الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} واختلف الفقهاء في كسر السن وفي قلع سن من لم يثغر، وفي وقت القصاص، وفي عودة السن بعد القلع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9843} وأجاز جمهور الفقهاء للرجل أن يتخذ سنا من الذهب أو الفضة، وحرم التفليج للزينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9847}"
  en: "In the lexicon sinn is a single tooth, a piece of bone set in the jaw, and the sinn of a thing is any toothed, pointed part of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} The jurists agree that retaliation is due for a deliberately extracted tooth where equal matching is possible, and that the diya of each tooth is five camels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} They differ on breaking a tooth, on extracting the tooth of one who has not yet shed his milk teeth, on the timing of retaliation, and on a tooth that grows back after extraction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9843} Most jurists allow a man to fit a gold or silver tooth, and filing the teeth apart for beauty is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9846} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9847}"
