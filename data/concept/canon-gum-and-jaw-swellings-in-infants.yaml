label:
  ar: "ورم اللثة والتشنج عند اللحيين في الصبيان عند ابن سينا"
  en: "Gum swellings and jaw spasm in infants in the Canon"
  fr: "Gonflements gingivaux et spasme des mâchoires du nourrisson dans le Canon"
  ur: "قانون میں بچوں کے مسوڑھوں کی سوجن اور جبڑوں کا تشنج"
  es: "Inflamación de las encías y espasmos mandibulares en bebés en el Canon"
summary:
  ar: "يذكر ابن سينا أورام اللثة عند نبات الأسنان وأوراماً وتشنجاً عند أوتار اللحيين في الصبيان، وعلاجها بغمز الإصبع الرفيق والتمريخ بالدهنيات ومضمضة العسل، ونطول للرأس {cite:canon-ibn-sina-print-v1 p.211}."
  en: "Ibn Sina mentions swellings of the gum at teething and swellings with spasm at the tendons of the jaws in infants, and their treatment by gentle pressure with the finger, anointing with the oils named, a honey rinse and a head douche {cite:canon-ibn-sina-print-v1 p.211}."
  fr: "Ibn Sina décrit gonflements gingivaux de dentition et tendineux des mâchoires avec spasme, puis pression digitale douce, huiles citées, rinçage au miel et douche céphalique {cite:canon-ibn-sina-print-v1 p.211}."
  es: "Ibn Sina menciona inflamaciones de las encías durante la dentición e inflamaciones con espasmos en los tendones de las mandíbulas en los bebés, y su tratamiento mediante una suave presión con el dedo, unción con los aceites mencionados, un enjuague con miel y una ducha de cabeza {cite:canon-ibn-sina-print-v1 p.211}."
