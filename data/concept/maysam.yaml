  fr: "Maysam (le grain appelé habb al-ban)"
summary:
  ar: "الميسم حبة تشبه البطم مثلثة المقطع إلى الصفرة طيبة الرائحة يتبخر بها، ومنها بستاني ذو ثلاثة أوراق وبري ومصري، والبستاني معتدل قليل التجفيف والبري أقوى {cite:canon-ibn-sina-print-v1 p.569}."
  en: "Maysam is a grain like terebinth, triangular in section, yellowish and sweet-smelling, used for fumigation, in a garden kind with three leaves, a wild kind and an Egyptian kind; the garden kind is moderate and slightly drying, and the wild stronger {cite:canon-ibn-sina-print-v1 p.569}."
  ur: "میسم ایک دانہ ہے جو بطم سے مشابہ، تین پہلو کٹاؤ والا، زردی مائل اور خوشبودار ہے جس کی دھونی دی جاتی ہے، اس کی ایک باغی قسم تین پتوں والی ہے اور ایک جنگلی اور ایک مصری؛ باغی معتدل اور ہلکا خشک کرنے والا ہے اور جنگلی زیادہ قوی {cite:canon-ibn-sina-print-v1 p.569}۔"
  es: "El maysam es un terebinto parecido a un grano, de sección triangular, amarillento y de olor dulce, utilizado para fumigación, en una variedad de jardín con tres hojas, una variedad silvestre y una variedad egipcia; la variedad de jardín es moderada y ligeramente secante, y la silvestre más fuerte {cite:canon-ibn-sina-print-v1 p.569}."
  fr: "Le maysam est une graine ressemblant au térébinthe, de section triangulaire, jaunâtre et odorante, utilisée pour la fumigation, dans une variété de jardin à trois feuilles, une variété sauvage et une variété égyptienne; la variété de jardin est modérée et légèrement asséchante, et la variété sauvage plus forte {cite:canon-ibn-sina-print-v1 p.569}."
