id: concept/lisan-al-thawr
class: concept
kind: natural
label:
  ar: "لسان الثور"
  en: "Lisan al-thawr (ox-tongue)"
  ur: "لسان الثور"
  es: "Lisan al-thawr (lengua de buey)"
  fr: "Lisan al-thawr (langue de bœuf)"
  tr: "boğa dili"
  id: "lidah sapi"
summary:
  ar: "لسان الثور حشيشة عريضة الورق خشنة الملمس، قريب من المعتدل، مفرح مقو للقلب جيد للوحشة والخفقان والعلل السوداوية، وينبه المؤلف إلى أن ما يستعمله الأطباء في بلاده أكثره ليس به {cite:canon-ibn-sina-print-v1 p.541} {cite:canon-ibn-sina-print-v1 p.542}."
  en: "Lisan al-thawr is an herb with broad, rough leaves, near the moderate; it gladdens and strengthens the heart and is good for dread, palpitation and black-bile ailments, and the author notes that most of what physicians use in his country is not it {cite:canon-ibn-sina-print-v1 p.541} {cite:canon-ibn-sina-print-v1 p.542}."
  ur: "لسان الثور چوڑے کھردرے پتوں والی بوٹی ہے، اعتدال کے قریب؛ دل کو فرحت اور قوت دیتی ہے اور گھبراہٹ، دھڑکن اور سوداوی بیماریوں میں اچھی ہے، اور مصنف متنبہ کرتا ہے کہ اس کے ملک میں طبیب جو استعمال کرتے ہیں اس میں سے اکثر یہ نہیں ہے {cite:canon-ibn-sina-print-v1 p.541} {cite:canon-ibn-sina-print-v1 p.542}۔"
  es: "Lisan al-thawr es una hierba con hojas anchas y ásperas, de intensidad moderada; alegra y fortalece el corazón y es buena para el miedo, las palpitaciones y las dolencias de bilis negra, y el autor señala que la mayor parte de lo que usan los médicos en su país no es esto {cite:canon-ibn-sina-print-v1 p.541} {cite:canon-ibn-sina-print-v1 p.542}."
  fr: "Lisan al-thawr est une herbe aux feuilles larges et rugueuses, proche du modéré; elle réjouit et fortifie le cœur et est bonne pour la peur, les palpitations et les affections de la bile noire, et l'auteur note que la plupart de ce que les médecins utilisent dans son pays n'est pas cela {cite:canon-ibn-sina-print-v1 p.541} {cite:canon-ibn-sina-print-v1 p.542}."
  tr: "Öküzün dili, geniş yapraklı, kaba bir ottur; orta dereceye yakın, neşeli, kalp tonik bir ottur; yalnızlık, çarpıntı ve melankolik rahatsızlıklar için iyidir. Yazar, ülkesindeki doktorların çoğunlukla kullandığı şeylerin {cite:canon-ibn-sina-print-v1 s.541} {cite:canon-ibn-sina-print-v1 s.542} içermediğini belirtir."
  id: "Lidah sapi adalah rumput berdaun lebar, kasar, hampir sedang, penuh sukacita, memicu jantung, baik untuk kesepian, palpitasi, dan penyakit melankolis. Penulis menunjukkan bahwa apa yang paling banyak digunakan dokter di negaranya tidak mengandung {cite:canon-ibn-sina-print-v1 hlm.541} {cite:canon-ibn-sina-print-v1 hlm.542}."
