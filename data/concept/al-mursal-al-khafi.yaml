id: concept/al-mursal-al-khafi
class: concept
kind: term
label: { ar: "المدلَّس والمرسل الخفي", en: "The concealed report (mudallas) and the hidden loose attribution (mursal khafi)", ur: "مدلس اور مرسل خفی" }
term: { ar: "السقط الواضح والخفي، المدلس، المرسل الخفي", en: "al-saqt al-wadih and al-khafi, al-mudallas, al-mursal al-khafi" }
summary:
  ar: "يفرّق ابن حجر بين السقط الواضح الذي يُعرف بعدم التلاقي بين الراوي وشيخه، والسقط الخفي الذي لا يدركه إلا الحذّاق؛ ومنه المدلّس، وهو أن يروي الراوي عمّن عُرف لقاؤه إياه ما لم يسمعه منه بصيغة تحتمل السماع، والمرسل الخفي، وهو أن يروي المعاصر عمّن لم يُعرف لقاؤه إياه؛ ولا يُقبل من المدلّس العدل إلا ما صرّح فيه بالتحديث {cite:nuzhat-al-nazar-itr-bushra-2011 p. 80-83}."
  en: "Ibn Hajar distinguishes the evident drop, known when narrator and teacher never met, from the hidden drop that only expert critics detect. The hidden drop includes concealment (tadlis), a narrator transmitting from someone he is known to have met what he did not hear from him, in a form that could imply hearing, and the hidden loose attribution (mursal khafi), a contemporary transmitting from someone he is not known to have met. From an upright concealer only reports with explicit statements of hearing are accepted {cite:nuzhat-al-nazar-itr-bushra-2011 p. 80-83}."
  ur: "ابن حجر واضح سقط، جو راوی اور شیخ کی عدم ملاقات سے معلوم ہوتا ہے، اور خفی سقط، جسے صرف ماہرین پہچانتے ہیں، میں فرق کرتے ہیں۔ خفی میں مدلس ہے، کہ راوی ایسے شخص سے جس سے اس کی ملاقات معلوم ہو وہ روایت کرے جو اس سے نہیں سنا، ایسے صیغے سے جو سننے کا احتمال رکھے؛ اور مرسل خفی، کہ معاصر ایسے شخص سے روایت کرے جس سے اس کی ملاقات معلوم نہ ہو۔ عادل مدلس سے صرف وہی قبول ہے جس میں تحدیث کی تصریح ہو {cite:nuzhat-al-nazar-itr-bushra-2011 p. 80-83}۔"
