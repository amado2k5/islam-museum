id: concept/shiir-diwan-al-arab
class: concept
kind: term
label: { ar: "الشعر ديوان العرب", en: "Poetry as the Arabs' register" }
summary:
  ar: "استقرأ ابن خلدون تاريخ الشعر عند العرب: كان ديواناً لهم فيه علومهم وأخبارهم وحكمهم وكان رؤساؤهم يقفون بسوق عكاظ لإنشاده وعرض ديباجته على الفحول حتى انتهوا إلى تعليق أشعارهم بأركان البيت الحرام كما فعل امرؤ القيس والنابغة الذبياني وزهير بن أبي سلمى وعنترة بن شداد وطرفة بن العبد وعلقمة بن عبدة والأعشى وغيرهم من أصحاب المعلقات السبع، وكان التعليق لا يتوصل إليه إلا من له قدرة بقومه وعصبيته ومكانه في مضر، ثم انصرف العرب عنه أول الإسلام بما أدهشهم من أسلوب القرآن فأخرسوا وسكتوا عن الخوض في النظم والنثر زماناً، ولم ينزل الوحي بتحريمه وسمعه النبي وأثاب عليه فرجعوا إليه، وكان لعمر بن أبي ربيعة كبير قريش لذلك العهد مقامات فيه عالية وكان يعرض شعره على ابن عباس فيستمعه معجباً، ثم جاء الملك والدولة فتقرب العرب بالأشعار يمتدحون الخلفاء فيجيزونهم بأعظم الجوائز، وكان الرشيد من أعمق الناس رسوخاً فيه كما في مسامرته للأصمعي بالعقد، ثم جاء خلق لم يكن اللسان لسانهم فتعلموه صناعة ومدحوا به أمراء العجب طالبين معروفهم كحبيب والبحتري والمتنبي وابن هانئ فصار غرض الشعر في الغالب للكدية والاستجداء فأنف منه أهل الهمم والمراتب وصار تعاطيه هنة في الرئاسة، وهو موجود في كل لغة وثبت فيه شعراء للفرس ويونان وحمير {cite:muqaddima-ibn-khaldun p. 621-622}."
  en: "From the Ukaz contests and the Ka'ba-hung odes to its lull before the Qur'an and decline into begging-verse {cite:muqaddima-ibn-khaldun p. 621-622}."
