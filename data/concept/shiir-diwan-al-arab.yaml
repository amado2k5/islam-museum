id: concept/shiir-diwan-al-arab
class: concept
kind: term
label: { ar: "الشعر ديوان العرب", en: "Poetry as the Arabs' register", es: "La poesía como registro de los árabes", fr: "La poésie comme registre des Arabes", ur: "عربوں کے رجسٹر کے طور پر شاعری", tr: "Şiir, Arapların Diwanı", id: "Puisi, Diwan Orang Arab" }
summary:
  ar: "استقرأ ابن خلدون تاريخ الشعر عند العرب: كان ديواناً لهم فيه علومهم وأخبارهم وحكمهم وكان رؤساؤهم يقفون بسوق عكاظ لإنشاده وعرض ديباجته على الفحول حتى انتهوا إلى تعليق أشعارهم بأركان البيت الحرام كما فعل امرؤ القيس والنابغة الذبياني وزهير بن أبي سلمى وعنترة بن شداد وطرفة بن العبد وعلقمة بن عبدة والأعشى وغيرهم من أصحاب المعلقات السبع، وكان التعليق لا يتوصل إليه إلا من له قدرة بقومه وعصبيته ومكانه في مضر، ثم انصرف العرب عنه أول الإسلام بما أدهشهم من أسلوب القرآن فأخرسوا وسكتوا عن الخوض في النظم والنثر زماناً، ولم ينزل الوحي بتحريمه وسمعه النبي وأثاب عليه فرجعوا إليه، وكان لعمر بن أبي ربيعة كبير قريش لذلك العهد مقامات فيه عالية وكان يعرض شعره على ابن عباس فيستمعه معجباً، ثم جاء الملك والدولة فتقرب العرب بالأشعار يمتدحون الخلفاء فيجيزونهم بأعظم الجوائز، وكان الرشيد من أعمق الناس رسوخاً فيه كما في مسامرته للأصمعي بالعقد، ثم جاء خلق لم يكن اللسان لسانهم فتعلموه صناعة ومدحوا به أمراء العجب طالبين معروفهم كحبيب والبحتري والمتنبي وابن هانئ فصار غرض الشعر في الغالب للكدية والاستجداء فأنف منه أهل الهمم والمراتب وصار تعاطيه هنة في الرئاسة، وهو موجود في كل لغة وثبت فيه شعراء للفرس ويونان وحمير {cite:muqaddima-ibn-khaldun p. 621-622}."
  en: "From the Ukaz contests and the Ka'ba-hung odes to its lull before the Qur'an and decline into begging-verse {cite:muqaddima-ibn-khaldun p. 621-622}."
  es: "Desde los concursos de Ukaz y las odas a la Kaaba hasta su calma ante el Corán y su declive en versos mendigos {cite:muqaddima-ibn-khaldun p. 621-622}."
  fr: "Des concours d'Ukaz et des odes suspendues à la Kaaba à son calme avant le Coran et son déclin dans les vers de mendicité {cite: muqaddima-ibn-khaldun p. 621-622}."
  ur: "عکاز کے مقابلہ جات اور کعبہ سے لٹکنے کے لیے قرآن کے سامنے اس کی خاموشی اور بھیک مانگنے والی آیت میں جھٹلانا۔ 621-622}۔"
  tr: "İbn Haldun, Araplar arasında şiir tarihini inceledi: bu derleme, onların bilgisini, haberlerini ve bilgeliğini barındırıyordu. Liderleri Sük Ukaz'da durup onu okur ve önsözünü seçkinlere sunar, ta ki şiirlerini Kutsal Ev'in köşelerine asarlar; İmru' el-Kais, el-Nebigha el-Dhubyani, Zuhair ibn Ebi Sulma, Antarah ibn Shaddad, Tarafa ibn al-Abd, Alqama ibn Abda, al-A'sha ve yedi Mu'allaqat'tan diğerleri tarafından yapılmıştır. Yorum sadece Mudar'da yetenek, kabile ve statüye sahip olanlara akıl veriyordu, sonra Araplar ondan uzaklaştı İslam, onları şaşırtan Kur'an üslubuyla başladı, bu yüzden bir süre şiir ve nesir yazmaktan sessiz kaldılar. Bunu yasaklayan vahiy inmedi, ancak Peygamber onu duydu ve ödüllendirdi, böylece tekrar ona döndüler. O dönemde Kureyş'in reisi olan Ömer bin Ebi Rabiah bu kitapta yüksek rütbelere sahipti ve şiirlerini İbn Abbas'a sunardı; İbn Abbas da onu hayranlıkla dinlerdi. Sonra kral ve devlet geldi, Araplar şiirle yaklaştı, halifeleri övdü ve en büyük ödüllerle ödüllendirdi. El-Reşid, bu şiirde en derin yerleşenlerden biriydi; tıpkı Esma'i ile 'akda olan arkadaşlığında olduğu gibi. Sonra dili olmayan bir halk geldi Dillerini bu yüzden zanaat olarak öğrendiler ve Habib, Al-Buhturi, Al-Mutanabbi ve İbn Hani gibi mucizeler prenslerine övdüler. Şiirin temel amacı çoğunlukla dilenmek ve dilenmek oldu, bu yüzden kararlı ve rütbeli insanlar bundan hoşlanmadı ve liderlikte bir zayıflık haline geldi. Her dilde vardır ve Perslerin, Yananların ve Himyarların şairleri yerleşmiştir {cite:muqaddima-ibn-khaldun, s. 621-622}."
  id: "Ibn Khaldun mempelajari sejarah puisi di kalangan orang Arab: itu adalah kumpulan yang berisi pengetahuan, berita, dan kebijaksanaan mereka. Para pemimpin mereka akan berdiri di Souq Ukaz untuk membacakannya dan menyampaikan kata pengantarnya kepada para elit, hingga mereka menggantung puisi mereka di sudut-sudut Rumah Suci, seperti yang dilakukan Imru' al-Qais, al-Nabigha al-Dhubyani, Zuhair ibn Abi Sulma, Antarah ibn Shaddad, Tarafa ibn al-Abd, Alqama ibn Abda, al-A'sha, dan lainnya dari tujuh Mu'allagat. Komentar hanya dapat diakses oleh mereka yang memiliki kemampuan, suku, dan status di Mudar, kemudian orang Arab menjauhinya Islam dimulai dengan gaya Al-Qur'an yang membuat mereka kagum, sehingga mereka tetap diam dan diam untuk tidak menulis puisi dan prosa untuk sementara waktu. Wahyu yang melarangnya tidak datang, tetapi Nabi mendengarnya dan memberinya ganjaran, sehingga mereka kembali kepadanya. Umar ibn Abi Rabi'ah, kepala Quraisy saat itu, memegang pangkat tinggi di dalamnya dan akan mempresentasikan puisinya kepada Ibn Abbas, yang mendengarkannya dengan kekaguman. Kemudian raja dan negara datang, dan orang Arab mendekat dengan puisi, memuji para khalifah dan memberi mereka ganjaran terbesar. Al-Rashid termasuk yang paling mapan di dalamnya, seperti dalam persahabatannya dengan Al-Asma'i dengan 'aqdah. Kemudian datanglah bangsa yang tidak memiliki bahasa Bahasa mereka, sehingga mereka mempelajarinya sebagai keterampilan dan memujinya kepada para pangeran keajaiban, mencari restu mereka, seperti Habib, Al-Buhturi, Al-Mutanabbi, dan Ibn Hani. Tujuan utama puisi menjadi lebih banyak untuk mengemis dan mengemis, sehingga orang-orang yang bertekad dan berpangkat tidak menyukainya, dan menjadi kelemahan dalam kepemimpinan. Puisi ini ada dalam setiap bahasa, dan penyair Persia, Yanan, dan Himyar telah mapan {cite:muqaddima-ibn-khaldun, hlm. 621-622}."
