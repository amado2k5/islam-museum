label: { ar: "شهور القبط وأيامها الملحقة", en: "The Coptic months and their added days", ur: "قبطی مہینے اور ان کے ملحق دن", es: "Los meses coptos y sus días añadidos", fr: "Les mois coptes et leurs jours supplémentaires" }
summary:
  ar: "يعدد البتاني شهور القبط من توت إلى بشنس وبونة وأبيب وبسرى، ويبين أن كل شهر ثلاثون يوماً، وأن خمسة أيام تُلحق بعد الشهور وتسمى المُلحَق، فتبلغ السنة القبطية ثلاثمائة وخمسة وستين يوماً وربع يوم، وتُزاد في الرابعة يوم. {cite:zij-sabi-nallino-byblion p.101}."
  en: "Al-Battani lists the Coptic months from Tut to Abib and Bisra, gives each month thirty days, and notes five days added after the months called al-mulhaq. The Coptic year is 365 and a quarter days, with one day added every fourth year. {cite:zij-sabi-nallino-byblion p.101}."
  ur: "البتانی قبطی مہینے توت سے ابیب اور بسری تک گنواتے ہیں، ہر مہینہ تیس دن کا بتاتے ہیں، اور مہینوں کے بعد پانچ دن ملحق کہلاتے ہیں؛ قبطی سال 365 دن اور ایک چوتھائی کا ہوتا ہے، اور ہر چوتھے سال ایک دن زیادہ ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.101}۔"
  es: "Al-Battani enumera los meses coptos desde Tut hasta Abib y Bisra, indicando que cada mes tiene treinta días, y señala que se añaden cinco días después de los meses llamados al-mulhaq. El año copto tiene 365 días y un cuarto, con un día adicional cada cuatro años. {cite:zij-sabi-nallino-byblion p.101}."
  fr: "Al-Battani énumère les mois coptes de Toutankhamon à Abib et Bisra, leur attribue trente jours et précise que cinq jours supplémentaires, appelés al-mulhaq, sont ajoutés après les mois. L'année copte compte 365 jours et un quart, un jour étant ajouté tous les quatre ans. {cite:zij-sabi-nallino-byblion p.101}"
