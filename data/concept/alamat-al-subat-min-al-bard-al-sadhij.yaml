id: concept/alamat-al-subat-min-al-bard-al-sadhij
class: concept
kind: scientific
label:
  ar: "علامات السبات من البرد الساذج"
  en: "Signs of coma from simple cold"
  fr: "Signes du coma dû au froid simple"
  ur: "سادہ سردی سے غنودگی کی علامات"
  es: "Síntomas de coma por un simple resfriado"
  tr: "Saf soğuk algınlığından kaynaklanan kış uykusu belirtileri"
  id: "Gejala hibernasi yang disebabkan oleh dingin murni"
summary:
  ar: "يذكر ابن سينا علامات السبات الكائن من برد ساذج من خارج، وأنه يتبعه فساد في الذكر والفكر، وأن قول من عدّه أخف من سبات المادة الرطبة ليس سديداً {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}"
  en: "Ibn Sina gives the signs of coma from simple cold from outside, says that corruption of memory and thought follows it, and that the saying that it is lighter than the coma of moist matter is not sound {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}"
  fr: "Ibn Sina donne les signes du coma dû au froid simple venu de l’extérieur. Il dit que la mémoire et la pensée en restent altérées et conteste qu’il soit moins grave que le coma dû à une matière humide {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}."
  ur: "ابن سینا بیرونی سادہ سردی سے ہونے والی غنودگی کی علامات بتاتا ہے، کہتا ہے کہ اس کے پیچھے حافظے اور فکر کا بگاڑ آتا ہے، اور یہ قول کہ وہ نمی والے مادے کی غنودگی سے ہلکی ہے درست نہیں {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}۔"
  es: "Ibn Sina da los síntomas del coma por un simple resfriado externo, dice que le sigue la corrupción de la memoria y el pensamiento, y que el dicho de que es más leve que el coma por materia húmeda no es correcto {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}"
  tr: "İbn Sina, dışarıdan gelen saf soğuğun neden olduğu kış uykusu belirtilerinden bahseder ve bunun ardından hatırlama ve düşünce bozulması yaşandığını, ıslak maddenin uykusundan daha hafif sayanların görüşünün doğru olmadığını belirtir {cite:canon-ibn-sina-print-v2 s.91} {cite:canon-ibn-sina-print-v2 s.92}"
  id: "Ibn Sina menyebutkan gejala hibernasi yang disebabkan oleh dingin murni dari luar dan menyatakan bahwa setelahnya terjadi gangguan memori dan pikiran, dan bahwa mereka yang menganggap materi basah lebih ringan daripada tidur tidak memiliki pandangan yang benar {cite:canon-ibn-sina-print-v2 hlm.91} {cite:canon-ibn-sina-print-v2 hlm.92}"
