label: { ar: "علم التاريخ", en: "The science of history", es: "La ciencia de la historia", fr: "La science de l'histoire", ur: "تاریخ کی سائنس", tr: "Tarihçe", id: "Sejarah" }
summary:
  ar: "قال ابن خلدون فن التاريخ فن عزيز المذهب جم الفوائد شريف الغاية إذ هو يوقفنا على أحوال الماضين من الأمم في أخلاقهم والأنبياء في سيرهم والملوك في دولهم وسياستهم، وهو محتاج إلى مآخذ متعددة ومعارف متنوعة وحسن نظر وتثبت، لأن الأخبار إذا اعتمد فيها على مجرد النقل ولم تحكم أصول العادة وقواعد السياسة وطبيعة العمران والأحوال في الاجتماع الإنساني ولا قيس الغائب منها بالشاهد والحاضر بالذاهب فربما لم يؤمن فيها من العثور، وقد وقع للمؤرخين والمفسرين من المغالط في الحكايات اعتمادهم فيها على مجرد النقل غثاً أو سميناً ولم يعرضوها على أصولها ولا قاسوها بأشباهها ولا سبّوها بمعيار الحكمة، ولا سيما في إحصاء الأعداد من الأموال والعساكر إذ هي مظنة الكذب ومطية الهذر، وأنكر ما نقله المسعودي وكثير من المؤرخين في جيوش بني إسرائيل أنهم ستمائة ألف إذ لا تتسع لها مصر والشام ولم تبلغ جيوش الفرس الأعظم مثل هذا العدد وأعظم جموعهم بالقادسية مائة وعشرون ألفاً على نقل سيف وستون ألفاً على نقل عائشة والزهري {cite:muqaddima-ibn-khaldun p. 22-23}."
  en: "Ibn Khaldun's charter: reports must be measured against custom, political law and the nature of civilisation — never naked transmission, least of all the numbers {cite:muqaddima-ibn-khaldun p. 22-23}."
  es: "Carta de Ibn Khaldun: los informes deben medirse en función de la costumbre, la ley política y la naturaleza de la civilización; nunca la transmisión sin más, y mucho menos las cifras {cite:muqaddima-ibn-khaldun p. 22-23}."
  fr: "La charte d'Ibn Khaldun: les rapports doivent être mesurés à l'aune de la coutume, du droit politique et de la nature de la civilisation — jamais une simple transmission, et surtout pas les chiffres {cite: muqaddima-ibn-khaldun p. 22-23}."
  ur: "ابن خلدون کا چارٹر: رپورٹوں کو رواج، سیاسی قانون اور تہذیب کی نوعیت کے خلاف ناپا جانا چاہیے - کبھی بھی برہنہ ٹرانسمیشن، کم از کم تمام نمبروں سے۔ 22-23}۔"
  tr: "İbn Haldun şöyle demiştir: Tarih sanatı, soylu doktrinin değerli bir sanatıdır; sayısız faydası ve asil amacı vardır; çünkü geçmiş ulusların ahlaklarını, peygamberleri biyografilerinde ve kralların devlet ve politikalarını incelememize olanak tanır. Çoklu eleştiriler, çeşitli bilgi ve iyi içgörü ve doğrulama gerektirir, çünkü haber, gelenek, siyasi kurallar, kentsel gelişimin doğası ve insan toplumundaki koşullar olmadan sadece iletimle ilgiliyse, yokluğun tanıkla ve şimdiki zaman ölenle ölçülemiyorsa, belki de bulan buna inanmayabilir. Bu, tarihçilerin başına gelmiştir Masallarda hata yapan yorumcular, sadece aktarımı kaba veya ağırlıksız olarak görür, kökenleriyle karşılaştırmaz, kendi benzerleriyle karşılaştırmaz veya özellikle zenginlik ve asker sayımını sayarken bilgelik standardıyla aşağılamazlar; çünkü bunlar yalan ve saçmalık aracı olarak düşünülür. El-Mes'udi ve birçok tarihçi, El-Mes'udi ve birçok tarihçi, İsrail orduları hakkında bildirdiklerini reddederek, Mısır ve Şam'ın onları barındıramadığını belirterek orduların altı yüz bin olduğunu belirttiler. En büyük Pers orduları bu sayıya ulaşamadı; Kılıç Raporu'na göre en büyük kütleleri Kadisiye'de yüz yirmi bin, Aişe ve El-Zuhri'ye göre altmış bin kişiye ulaştı {atıf:Muqaddima-ibn-haldun, s. 22-23}."
  id: "Ibn Khaldun berkata: Seni sejarah adalah seni doktrin mulia yang penuh manfaat dan tujuan mulia, karena memungkinkan kita menelaah kondisi bangsa-bangsa masa lalu dalam moral mereka, para nabi dalam biografi mereka, dan raja-raja dalam negara serta kebijakan mereka. Ia membutuhkan banyak kritik, pengetahuan yang beragam, serta wawasan dan verifikasi yang baik, karena jika berita hanya bergantung pada transmisi tanpa prinsip adat, aturan politik, sifat perkembangan perkotaan, dan kondisi dalam masyarakat manusia, dan ketidakhadiran tidak dapat diukur oleh saksi dan masa kini oleh yang telah tiada, maka mungkin penemunya tidak akan mempercayainya. Hal ini pernah terjadi pada para sejarawan Para komentator yang membuat kesalahan dalam cerita hanya mengandalkan transmisi semata sebagai kasar atau ringan, tidak membandingkannya dengan asal-usulnya, tidak membandingkannya dengan yang mereka suka, atau menghina mereka dengan standar kebijaksanaan, terutama dalam menghitung jumlah kekayaan dan prajurit, karena mereka diduga sebagai kebohongan dan cara omong kosong. Al-Mas'udi dan banyak sejarawan membantah apa yang dilaporkan Al-Mas'udi dan banyak sejarawan tentang tentara Israel, dengan menyatakan bahwa jumlahnya enam ratus ribu, karena Mesir dan Levant tidak dapat menampung mereka. Pasukan Persia terbesar tidak mencapai jumlah tersebut, dan massa terbesar mereka di Qadisiyyah mencapai seratus dua puluh ribu, menurut Laporan Pedang, dan enam puluh ribu menurut Aisha dan Al-Zuhri {cite:Muqaddima-ibn-khaldun, hlm. 22-23}."
