label: { ar: "علم التاريخ", en: "The science of history" }
summary:
  ar: "قال ابن خلدون فن التاريخ فن عزيز المذهب جم الفوائد شريف الغاية إذ هو يوقفنا على أحوال الماضين من الأمم في أخلاقهم والأنبياء في سيرهم والملوك في دولهم وسياستهم، وهو محتاج إلى مآخذ متعددة ومعارف متنوعة وحسن نظر وتثبت، لأن الأخبار إذا اعتمد فيها على مجرد النقل ولم تحكم أصول العادة وقواعد السياسة وطبيعة العمران والأحوال في الاجتماع الإنساني ولا قيس الغائب منها بالشاهد والحاضر بالذاهب فربما لم يؤمن فيها من العثور، وقد وقع للمؤرخين والمفسرين من المغالط في الحكايات اعتمادهم فيها على مجرد النقل غثاً أو سميناً ولم يعرضوها على أصولها ولا قاسوها بأشباهها ولا سبّوها بمعيار الحكمة، ولا سيما في إحصاء الأعداد من الأموال والعساكر إذ هي مظنة الكذب ومطية الهذر، وأنكر ما نقله المسعودي وكثير من المؤرخين في جيوش بني إسرائيل أنهم ستمائة ألف إذ لا تتسع لها مصر والشام ولم تبلغ جيوش الفرس الأعظم مثل هذا العدد وأعظم جموعهم بالقادسية مائة وعشرون ألفاً على نقل سيف وستون ألفاً على نقل عائشة والزهري {cite:muqaddima-ibn-khaldun p. 22-23}."
  en: "Ibn Khaldun's charter: reports must be measured against custom, political law and the nature of civilisation — never naked transmission, least of all the numbers {cite:muqaddima-ibn-khaldun p. 22-23}."
