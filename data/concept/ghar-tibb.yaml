summary:
  ar: "غار في الكتاب حبه على شكل البندق الصغار عليها قشور سود دقاق، وورقه كورق الآس غير أنه أكبر وثمرته حمراء وينبت في المواضع الجبلية، وتعليق المحقق أن الغار هو الدهمشت؛ حار يابس في الثانية، وينقل الكتاب نفعه للبهق والأورام الحارة وأوجاع العصب والصداع وأوجاع الأذن الباردة والطنين وضيق النفس وقروح الرئة ووجع الكبد، وأنه ترياق للسموم المشروبة كلها؛ وفيه نقل موسوم عن الحيض والبول والمثانة والرحم والجنين في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.724-725}"
  en: "Ghar is in the book a tree whose seed is in the shape of small hazelnuts with thin black husks, with a leaf like the myrtle leaf but larger and a red fruit, growing in mountainous places, and the editor's note says that al-ghar is al-dahmasht; hot and dry in the second degree, the book records benefit for bahaq, hot swellings, pains of the nerve, headache, cold earache, ringing in the ear, shortness of breath, ulcers of the lung and pain of the liver, and says that it is a theriac for all drunk poisons; it has a labelled listing on menses, urine, bladder, womb and foetus in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.724-725}"
  ur: "غار کتاب میں ایک درخت ہے جس کا دانہ چھوٹے بندق کی شکل کا ہے اور اس پر باریک سیاہ چھلکے ہیں، اس کا پتا آس کے پتے جیسا مگر بڑا ہے اور پھل سرخ ہے اور یہ پہاڑی جگہوں میں اگتا ہے، اور محقق کا حاشیہ کہتا ہے کہ الغار دہمشت ہے؛ دوسرے درجے میں گرم خشک، اور کتاب بہق، گرم ورموں، اعصاب کے دردوں، سر درد، ٹھنڈے کان کے دردوں، کانوں کی گونج، سانس کی تنگی، پھیپھڑے کے قرحوں اور جگر کے درد میں اس کا فائدہ نقل کرتی ہے، اور کہتی ہے کہ یہ تمام پی جانے والے زہروں کی تریاق ہے؛ حیض، پیشاب، مثانے، رحم اور جنین کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.724-725}۔"
  es: "Ghar es en el libro un árbol cuya semilla tiene forma de pequeñas avellanas con cáscaras negras delgadas, con una hoja parecida a la del mirto pero más grande y un fruto rojo, que crece en lugares montañosos, y la nota del editor dice que al-ghar es al-dahmasht; caliente y seco en segundo grado, el libro registra beneficios para bahaq, hinchazones calientes, dolores de nervios, dolor de cabeza, dolor de oído frío, zumbido en los oídos, dificultad para respirar, úlceras de pulmón y dolor de hígado, y dice que es un teriaco para todos los venenos de borrachos; tiene una lista etiquetada sobre menstruación, orina, vejiga, útero y feto en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 pp.724-725}"
  fr: "Le ghar est décrit dans le livre comme un arbre dont la graine a la forme de petites noisettes à la fine coque noire, avec une feuille semblable à celle du myrte mais plus grande, et un fruit rouge. Cet arbre pousse en montagne. La note de l'éditeur précise qu'al-ghar est al-dahmasht, une plante chaude et sèche de deuxième degré. Le livre mentionne ses bienfaits contre le bahaq, les gonflements chauds, les douleurs nerveuses, les maux de tête, les otites dues au froid, les acouphènes, l'essoufflement, les ulcères pulmonaires et les douleurs hépatiques. Il est également décrit comme un remède contre tous les poisons ingérés. Une section, réservée à l'avis du fondateur, contient une liste commentée concernant les menstruations, l'urine, la vessie, l'utérus et le fœtus. {cite:canon-ibn-sina-print-v1 pp.724-725}"
