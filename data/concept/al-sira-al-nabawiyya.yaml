label: { ar: "السيرة النبوية", en: "The Prophetic sira" }
summary:
  ar: "السيرة النبوية هي التاريخ المروي لحياة النبي: مولده ونشأته ودعوته بمكة وهجرته وغزواته ووفاته، وما اتصل بذلك من حال أصحابه وأهل بيته. نشأت في المغازي والآثار المروية بالإسناد عند ابن إسحاق وتلاميذه، ثم استقلت فناً يؤرخ لثلاث وعشرين سنة غيّرت العالم."
  en: "The Prophetic sira is the transmitted history of the Prophet's life: his birth and upbringing, his call in Mecca, the Hijra, his campaigns and his death, with the connected record of his Companions and family. It grew out of the maghazi and athar reports transmitted by isnad in Ibn Ishaq's school, then became its own genre chronicling the twenty-three years that changed the world."
