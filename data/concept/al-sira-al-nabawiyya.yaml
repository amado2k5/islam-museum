label: { ar: "السيرة النبوية", en: "The Prophetic sira", fr: "La biographie du Prophète (sira)", es: "La sira profética" }
summary:
  ar: "السيرة النبوية هي التاريخ المروي لحياة النبي: مولده ونشأته ودعوته بمكة وهجرته وغزواته ووفاته، وما اتصل بذلك من حال أصحابه وأهل بيته. نشأت في المغازي والآثار المروية بالإسناد عند ابن إسحاق وتلاميذه، ثم استقلت فناً يؤرخ لثلاث وعشرين سنة غيّرت العالم."
  en: "The Prophetic sira is the transmitted history of the Prophet's life: his birth and upbringing, his call in Mecca, the Hijra, his campaigns and his death, with the connected record of his Companions and family. It grew out of the maghazi and athar reports transmitted by isnad in Ibn Ishaq's school, then became its own genre chronicling the twenty-three years that changed the world."
  fr: "La sira prophétique est l’histoire transmise de la vie du Prophète : sa naissance et son éducation, son appel à La Mecque, l’Hégire, ses campagnes et sa mort, ainsi que l’histoire de ses Compagnons et de sa famille dans la mesure où elle se rattache à la sienne. Issue des récits de campagnes (maghazi) et des traditions (athar) transmis avec des chaînes de rapporteurs (isnad) dans l’école d’Ibn Ishaq, elle est devenue un genre à part entière qui retrace les vingt-trois années qui ont changé le monde."
  es: "La sira profética es la historia transmitida de la vida del Profeta: su nacimiento y crianza, su llamado en La Meca, la Hégira, sus campañas y su muerte, con el relato de sus Compañeros y su familia. Surgió de los relatos de Maghazi y Athar transmitidos por isnad en la escuela de Ibn Ishaq, y posteriormente se convirtió en un género propio que narra los veintitrés años que cambiaron el mundo."
