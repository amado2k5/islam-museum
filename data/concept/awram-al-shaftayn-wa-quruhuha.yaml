id: concept/awram-al-shaftayn-wa-quruhuha
class: concept
kind: scientific
label:
  ar: "أورام الشفتين وقروحهما"
  en: "The lips' tumours and ulcers"
  fr: "Les tumeurs et ulcères des lèvres"
  ur: "ہونٹوں کی سوجن اور چھالے"
  es: "Tumores y úlceras en los labios"
  tr: "Dudak tümörleri ve yaraları"
  id: "Tumor bibir dan lukanya"
summary:
  ar: "أورام الشفتين وقروحهما يبتدأ فيها باستفراغ الخلط الغالب ثم تستعمل الأدوية الموضعية، وأما الأورام فهي قريبة الأحكام من أورام اللثة وحاجتها إلى علاج أقوى قليلاً أمَسّ، وأما الأدوية الموضعية للقروح فتتخذ من القوابض مما وصف وربما وقع فيها ما وصف من المحرقات، وأما الأدهان التي تستعمل فيها فما وصف ⁦(أظلاف المعز محمولة كما سماها الكتاب ومعروضة على المؤسس والأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.283}"
  en: "In the lips' tumours and ulcers one begins by evacuating the prevailing humour, then the topical drugs are used; the tumours are near in their rules to the gum's tumours, their need being a treatment slightly stronger and more touching; the topical drugs for the ulcers are made of the astringents of what he described, and what he described of the burnt things may fall into them, and the oils used in them are what he described (the goats' hooves carried as the book names them, set before the founder; the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.283}"
  fr: "Dans les tumeurs et ulcères des lèvres, le livre commence par l’évacuation de l’humeur dominante, puis les médicaments locaux. Les tumeurs se rapprochent de celles des gencives dans leurs règles de traitement, mais demandent une action un peu plus forte et plus pénétrante. Les médicaments locaux des ulcères sont préparés à partir des astringents décrits ; certaines substances brûlées décrites peuvent y entrer, et les huiles sont celles indiquées (les sabots de chèvre sont repris tels que le livre les nomme et soumis au fondateur ; les noms de ce type sont omis) {cite:canon-ibn-sina-print-v2 p.283}"
  ur: "ہونٹوں کی سوجن اور چھالوں میں آغاز غالب خلط کے استفراغ سے ہوتا ہے پھر موضعی ادویہ استعمال ہوتے ہیں؛ سوجن کے احکام مسوڑھے کی سوجن کے قریب ہیں لیکن انے کچھ مضبوط اور زیادہ چھونے والے علاج کی ضرورت ہے؛ چھالوں کے موضعی ادویہ بیان کردہ قابضوں سے بنتے ہیں اور بیان کردہ جلائی ہوئی چیزیں بھی ان میں آ سکتی ہیں اور ان میں استعمال ہونے والے تیل وہی ہیں جو اس نے بیان کیے ⁦(بکری کے کھر کتاب کے نام پر محمول اور مؤسس کے سامنے معروض؛ اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.283}"
  es: "En los tumores y úlceras de los labios se comienza evacuando el humor predominante, luego se usan medicamentos tópicos; los tumores son similares en sus reglas a los tumores de las encías, requiriendo un tratamiento ligeramente más fuerte y más delicado; los medicamentos tópicos para las úlceras se elaboran con los astringentes que él describió, y lo que describió de las cosas quemadas puede caer en ellas, y los aceites que se usan en ellas son los que él describió (las pezuñas de cabra llevadas como las llama el libro, colocadas ante el fundador; se omiten los nombres de este tipo) {cite:canon-ibn-sina-print-v2 p.283}"
  tr: "Dudak tümörleri ve ülserleri, baskın humorun kusmasıyla başlar, ardından topikal ilaçların kullanımı başlar. Tümörler ise diş eti tümörlerine yakındır ve dün biraz daha güçlü tedavi gerektirir. Ülser için yerel ilaçlar tanımlanan kümelerden yapılır ve bazen bazı tahriş edici maddeler ortaya çıkmıştır. Kullanılan yağlar ise (kitapta adlandırıldığı gibi keçi toynakları taşınır ve kurucusuna sunulur, bu cinsin isimleri sunulur) {cite:canon-ibn-sina-print-v2 s.283}"
  id: "Tumor bibir dan tukak lambung dimulai dengan muntah dari humor dominan, diikuti dengan penggunaan obat topikal. Adapun tumor, mereka dekat dengan tumor gusi dan memerlukan perawatan yang sedikit lebih kuat kemarin. Obat lokal untuk tukak dibuat dari kelompok yang dijelaskan, dan kadang-kadang beberapa zat iritasi yang dijelaskan terjadi. Adapun minyak yang digunakan di dalamnya, digambarkan sebagai (kuku kambing dibawa seperti yang disebut buku dan diberikan kepada pendiri, dan nama-nama genus ini disajikan) {cite:canon-ibn-sina-print-v2 hlm.283}"
