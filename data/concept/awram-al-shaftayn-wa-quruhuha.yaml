label:
  ar: "أورام الشفتين وقروحهما"
  en: "The lips' tumours and ulcers"
  ur: "ہونٹوں کی سوجن اور چھالے"
summary:
  ar: "أورام الشفتين وقروحهما يبتدأ فيها باستفراغ الخلط الغالب ثم تستعمل الأدوية الموضعية، وأما الأورام فهي قريبة الأحكام من أورام اللثة وحاجتها إلى علاج أقوى قليلاً أمَسّ، وأما الأدوية الموضعية للقروح فتتخذ من القوابض مما وصف وربما وقع فيها ما وصف من المحرقات، وأما الأدهان التي تستعمل فيها فما وصف ⁦(أظلاف المعز محمولة كما سماها الكتاب ومعروضة على المؤسس والأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.283}"
  en: "In the lips' tumours and ulcers one begins by evacuating the prevailing humour, then the topical drugs are used; the tumours are near in their rules to the gum's tumours, their need being a treatment slightly stronger and more touching; the topical drugs for the ulcers are made of the astringents of what he described, and what he described of the burnt things may fall into them, and the oils used in them are what he described (the goats' hooves carried as the book names them, set before the founder; the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.283}"
  ur: "ہونٹوں کی سوجن اور چھالوں میں آغاز غالب خلط کے استفراغ سے ہوتا ہے پھر موضعی ادویہ استعمال ہوتے ہیں؛ سوجن کے احکام مسوڑھے کی سوجن کے قریب ہیں لیکن انے کچھ مضبوط اور زیادہ چھونے والے علاج کی ضرورت ہے؛ چھالوں کے موضعی ادویہ بیان کردہ قابضوں سے بنتے ہیں اور بیان کردہ جلائی ہوئی چیزیں بھی ان میں آ سکتی ہیں اور ان میں استعمال ہونے والے تیل وہی ہیں جو اس نے بیان کیے ⁦(بکری کے کھر کتاب کے نام پر محمول اور مؤسس کے سامنے معروض؛ اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.283}"
