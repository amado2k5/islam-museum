label: { ar: "الهيئة السنية ⁦(علم الكون على الأثر)⁩", en: "al-Hay'a al-sunniyya (tradition-based cosmology)", fr: "al-Hay'a al-sunniyya (cosmologie fondée sur la tradition)", ur: "الہیئۃ السنیہ ⁦(آثار پر مبنی علمِ کائنات)⁩", es: "al-Hay'a al-sunniyya (cosmología basada en la tradición)" }
term: { ar: "الهيئة السنية", en: "hay'a sunniyya" }
summary:
  ar: "اسم يطلقه أنطون هاينن، تبعًا لعنوان كتاب السيوطي، على صنف من الكتب يجمع ما ورد في القرآن والسنة والآثار عن الكون والظواهر الطبيعية، جُمعت مادته بين القرنين التاسع والحادي عشر ثم أحياه السيوطي والقرماني في القرنين الخامس عشر والسادس عشر {cite:heinen-islamic-cosmology p. 15} {cite:heinen-islamic-cosmology p. 20}."
  en: "Anton Heinen's name, after al-Suyuti's title, for a genre gathering what the Qur'an, Sunna and early reports say about the cosmos and natural phenomena; its materials were collected between the ninth and eleventh centuries and revived by al-Suyuti and al-Qaramani in the fifteenth and sixteenth {cite:heinen-islamic-cosmology p. 15} {cite:heinen-islamic-cosmology p. 20}."
  fr: "Nom donné par Anton Heinen, d'après le titre d'al-Suyuti, à un genre réunissant ce que le Coran, la Sunna et les premiers récits disent du cosmos et des phénomènes naturels ; ses matériaux furent rassemblés entre le neuvième et le onzième siècle, puis remis à l'honneur par al-Suyuti et al-Qaramani aux quinzième et seizième siècles {cite:heinen-islamic-cosmology p. 15} {cite:heinen-islamic-cosmology p. 20}."
  ur: "انٹون ہائنن کا، سیوطی کے عنوان کے تتبع میں، اس صنف کا نام جو کائنات اور قدرتی مظاہر کے بارے میں قرآن، سنت اور آثار کو جمع کرتی ہے؛ اس کا مواد نویں سے گیارہویں صدی میں جمع ہوا اور پندرہویں سولہویں صدی میں سیوطی اور قرمانی نے اسے زندہ کیا {cite:heinen-islamic-cosmology p. 15}."
  es: "Nombre de Anton Heinen, después del título de al-Suyuti, para un género que reúne lo que el Corán, la Sunna y los primeros relatos dicen sobre el cosmos y los fenómenos naturales; sus materiales fueron recopilados entre los siglos IX y XI y revividos por al-Suyuti y al-Qaramani en los siglos XV y XVI {cite:heinen-islamic-cosmology p. 15} {cite:heinen-islamic-cosmology p. 20}."
