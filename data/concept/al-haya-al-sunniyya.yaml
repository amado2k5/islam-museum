term: { ar: "الهيئة السنية", en: "hay'a sunniyya" }
summary:
  ar: "اسم يطلقه أنطون هاينن، تبعًا لعنوان كتاب السيوطي، على صنف من الكتب يجمع ما ورد في القرآن والسنة والآثار عن الكون والظواهر الطبيعية، جُمعت مادته بين القرنين التاسع والحادي عشر ثم أحياه السيوطي والقرماني في القرنين الخامس عشر والسادس عشر {cite:heinen-islamic-cosmology p. 15} {cite:heinen-islamic-cosmology p. 20}."
  en: "Anton Heinen's name, after al-Suyuti's title, for a genre gathering what the Qur'an, Sunna and early reports say about the cosmos and natural phenomena; its materials were collected between the ninth and eleventh centuries and revived by al-Suyuti and al-Qaramani in the fifteenth and sixteenth {cite:heinen-islamic-cosmology p. 15} {cite:heinen-islamic-cosmology p. 20}."
  ur: "انٹون ہائنن کا، سیوطی کے عنوان کے تتبع میں، اس صنف کا نام جو کائنات اور قدرتی مظاہر کے بارے میں قرآن، سنت اور آثار کو جمع کرتی ہے؛ اس کا مواد نویں سے گیارہویں صدی میں جمع ہوا اور پندرہویں سولہویں صدی میں سیوطی اور قرمانی نے اسے زندہ کیا {cite:heinen-islamic-cosmology p. 15}."
