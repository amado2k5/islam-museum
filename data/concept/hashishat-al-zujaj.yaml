label:
  ar: "حشيشة الزجاج"
  en: "Hashishat al-zujaj (glass grass)"
  ur: "حشیشۃ الزجاج"
  es: "Hashishat al-zujaj (hierba de cristal)"
  fr: "Hashishat al-zujaj (herbe de verre)"
  tr: "cam çimi"
  id: "rumput kaca"
summary:
  ar: "حشيشة الزجاج نبات يُجلى به الزجاج، فيه قبض مع رطوبة، وهو ملصق منقٍّ مليّن؛ ويُذكر أنه يسكّن الأورام ويُسقى للجمرة والبلغم، وأن عصارته تنفع الأذن والنملة، وأنه يزيل البواسير."
  en: "Hashishat al-zujaj is a plant used to polish glass. It has binding with moisture, is sticking, cleansing and softening. The book says it soothes swellings, is drunk for carbuncle and phlegmy swellings, its juice helps ear pain, nettle-rash and piles."
  ur: "حشیشۃ الزجاج ایک پودا ہے جس سے شیشہ چمکایا جاتا ہے؛ اس میں نمی کے ساتھ کسیلاپن ہے، یہ چپکنے والا، صاف کرنے والا اور نرم کرنے والا ہے۔ کتاب کہتی ہے کہ یہ سوجن کو سکون دیتا ہے، جمرہ اور بلغمی سوجن کے لیے پیا جاتا ہے، اس کا رس کان کے درد اور ارٹیکیریا میں مفید ہے، اور بواسیر دور کرتا ہے۔"
  es: "Hashishat al-zujaj es una planta que se usa para pulir vidrio. Tiene propiedades aglutinantes con la humedad, es adhesiva, limpiadora y suavizante. El libro dice que alivia las hinchazones, se bebe para los forúnculos y las inflamaciones con flema, y su jugo ayuda con el dolor de oído, la urticaria y las hemorroides."
  fr: "Le hashishat al-zujaj est une plante utilisée pour polir le verre. Elle possède des propriétés liantes, adhésives, nettoyantes et adoucissantes. Selon la tradition, elle apaise les gonflements, est utilisée en boisson contre les anthrax et les œdèmes purulents, et son jus soulage les douleurs d'oreille, les éruptions cutanées dues à l'ortie et les hémorroïdes."
  tr: "Cam çimi, camı temizlemek için kullanılan bir bitkidir, nemle sertlik içerir ve nemlendirici bir yapıştırıcıdır; antraks ve balgam için tümörleri ve suyu yatıştırdığı belirtilir. Suyu kulaklara ve karıncalara fayda sağlar, hemoroidleri giderir."
  id: "Rumput kaca adalah tanaman yang digunakan untuk membersihkan kaca, mengandung kekerasan dengan kelembapan, dan merupakan perekat pelembap; disebutkan untuk menenangkan tumor dan menyiram antraks serta dahak. Jusnya bermanfaat bagi telinga dan semut, serta menghilangkan wasir."
