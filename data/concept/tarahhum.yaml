label:
  ar: "الترحم"
  en: "Tarahhum (invoking mercy upon the dead and the righteous)"
  ur: "ترحم (رحمت کی دعا دینا)"
summary:
  ar: "الترحم طلب الرحمة والدعاء بها، ويستحب عند الفقهاء على الوالدين أحياء وأمواتا وعلى الأخيار. والخلاف في الترحم على النبي في الصلاة وخارجها، وفي الترضي والترحم على الصحابة والتابعين، وفي التحية بين المسلمين، وفي الدعاء للكافر والممنوع منه بعد الوفاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958}"
  en: "Tarahhum is asking for mercy and invoking it. Jurists recommend it for parents, living or dead, and for the righteous. The sources differ on invoking mercy upon the Prophet inside and outside prayer, on the formula for the Companions and for those who came after them, on greeting among Muslims, and on invoking mercy upon unbelievers, which is forbidden after their death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958}"
