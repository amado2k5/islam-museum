id: concept/tarahhum
class: concept
kind: legal
label:
  ar: "الترحم"
  en: "Tarahhum (invoking mercy upon the dead and the righteous)"
  ur: "ترحم ⁦(رحمت کی دعا دینا)⁩"
  es: "Tarahhum (invocando la misericordia sobre los muertos y los justos)"
  fr: "Tarahhum (invocation de la miséricorde pour les morts et les justes)"
summary:
  ar: "الترحم طلب الرحمة والدعاء بها، ويستحب عند الفقهاء على الوالدين أحياء وأمواتا وعلى الأخيار. والخلاف في الترحم على النبي في الصلاة وخارجها، وفي الترضي والترحم على الصحابة والتابعين، وفي التحية بين المسلمين، وفي الدعاء للكافر والممنوع منه بعد الوفاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958}"
  en: "Tarahhum is asking for mercy and invoking it. Jurists recommend it for parents, living or dead, and for the righteous. The sources differ on invoking mercy upon the Prophet inside and outside prayer, on the formula for the Companions and for those who came after them, on greeting among Muslims, and on invoking mercy upon unbelievers, which is forbidden after their death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958}"
  es: "Tarahhum consiste en pedir misericordia e invocarla. Los juristas lo recomiendan para los padres, vivos o muertos, y para los justos. Las fuentes difieren en cuanto a la invocación de la misericordia sobre el Profeta dentro y fuera de la oración, en la fórmula para los Compañeros y para quienes vinieron después, en el saludo entre musulmanes y en la invocación de la misericordia sobre los incrédulos, que está prohibida después de su muerte. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4952} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4953} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4954} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4955} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4957} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958}"
  fr: "La prière de Tarahmun consiste à implorer la miséricorde divine. Les juristes la recommandent pour les parents, vivants ou décédés, et pour les pieux. Les sources divergent quant à l'invocation de la miséricorde au Prophète (à l'intérieur et à l'extérieur de la prière), sur la formule à employer pour les Compagnons et leurs successeurs, sur les salutations entre musulmans et sur l'invocation de la miséricorde aux non-croyants, interdite après leur décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958}"
  ur: "ترحم رحم مانگنا اور پکارنا ہے۔ فقہا اسے والدین، زندہ یا مردہ اور صالحین کے لیے تجویز کرتے ہیں۔ نماز کے اندر اور باہر نبی پر رحم کرنے، صحابہ کرام اور ان کے بعد آنے والوں کے لیے، مسلمانوں کے درمیان سلام کرنے اور کافروں پر رحم کرنے کے بارے میں، جو کہ ان کی وفات کے بعد حرام ہے، پر منابع کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4952} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص4953} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4954} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4953} صفحہ 4955} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4957} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص4958}"
