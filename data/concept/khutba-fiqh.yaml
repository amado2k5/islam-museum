label:
  ar: الخطبة
  en: Khutba (sermon)
  ur: خطبہ
summary:
  ar: 'الخطبة لغة الكلام المنثور يخاطب به متكلم فصيح جماعة من الناس لإقناعهم، واصطلاحا كلام مؤلف يتضمن وعظا وإبلاغا على صفة مخصوصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} تفترق عن الموعظة وهي النصح والتذكير بالعواقب، وعن الوصية وهي التقدم بما يعمل به مقترنا بوعظ، وعن النصيحة التي تكون سرا بينما تشترط في الخطبة أن يسمعها جماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} الخطب المشروعة: خطبة الجمعة والعيدين والكسوفين والاستسقاء وخطب الحج، وكلها بعد الصلاة إلا خطبة الجمعة وخطبة الحج يوم عرفة؛ ومنها الخطبة في خطبة النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} خطبة الجمعة شرط لصحة الجمعة عند الجمهور، والحنفية يرون الشرط خطبة واحدة وتسن اثنتان، وحجة الجمهور فعله مع قوله «صلوا كما رأيتموني أصلي» ولأن الخطبتين مقام الركعتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} أركان الخطبة: الحنفية يكتفون بتحميدة أو تهليلة أو تسبيحة، والصاحبان يشترطون ذكرا طويلا يسمى خطبة؛ والمالكية أقل ما يسمى خطبة عند العرب ولو سجعتين فيه وصية؛ والشافعية خمسة أركان: حمد الله، والصلاة على النبي، والوصية بالتقوى، والدعاء للمؤمنين في الثانية، وقراءة آية مفهمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701}'
  en: 'Khutba is lexically a prose speech by an eloquent speaker to a group to persuade them, and in technical usage a composed speech of admonition and announcement in a set form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} It differs from admonition (persuasion by the consequences), from charge (commanding conduct with exhortation), and from private counsel (nasiha), which is secret, while the khutba must be heard by a group. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} Lawful khutbas are those of Friday, the two feasts, the eclipses, rain-prayer and the Hajj; all come after prayer except the Friday khutba and the Hajj khutba on the day of Arafat; a khutba is also given at betrothal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} The Friday khutba is a condition of the validity of the Friday prayer by the majority; the Hanafis hold that one khutba is the condition, two are sunna. The majority cite the Prophet\''s instruction to pray as he prayed, and that the two khutbas stand in place of two units. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} Pillars: the Hanafis require only a praise, a declaration of unity or a glorification; the two companions require a long speech called a khutba; the Malikis require the least that is called a khutba, even two rhymed phrases with admonition; the Shafiis require five pillars: praise of God, prayer on the Prophet, admonition to piety, prayer for the believers in the second khutba, and a recitation of a verse conveying meaning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701}'
  ur: 'خطبہ لغت میں فصیح مقرر کا کسی جماعت کو قائل کرنے کے لیے نثری کلام ہے، اور اصطلاح میں مخصوص صورت میں وعظ اور اعلان پر مشتمل مرتب کلام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} یہ نصیحت (انجام کی یاد دہانی) اور وصیت (عمل کی ہدایت کے ساتھ وعظ) سے مختلف ہے، اور خفیہ نصیحت سے بھی، کیونکہ خطبہ میں جماعت کا سننا شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} مشروع خطبے: جمعہ، عیدین، کسوف، استسقاء اور حج کے خطبے؛ سب نماز کے بعد ہیں سوائے جمعہ اور عرفہ کے دن حج کے خطبے کے؛ نکاح کے خطبے بھی مشروع ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} جمعہ کا خطبہ جمہور کے نزدیک جمعہ کی صحت کی شرط ہے؛ حنفیہ ایک خطبہ شرط اور دو کو سنت کہتے ہیں؛ جمہور کی دلیل نبی کا «صلوا كما رأيتموني أصلي» اور دو خطبوں کا دو رکعت کے قائم مقام ہونا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} ارکان: حنفیہ حمد، تہلیل یا تسبیح پر اکتفا کرتے ہیں؛ صاحبین لمبی تقریر شرط کہتے ہیں؛ مالکیہ کم از کم وہ کلام جو خطبہ کہلائے، جس میں وصیت ہو؛ شافعیہ پانچ ارکان کہتے ہیں: حمد الٰہی، نبی پر درود، تقوی کی وصیت، دوسرے خطبے میں مومنین کے لیے دعا، اور مفہوم رکھنے والی آیت کی تلاوت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701}'
