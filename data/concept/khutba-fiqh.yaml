id: concept/khutba-fiqh
class: concept
kind: legal
label:
  ar: الخطبة
  en: Khutba (sermon)
  ur: خطبہ
summary:
  ar: 'الخطبة لغة الكلام المنثور يخاطب به متكلم فصيح جماعة من الناس لإقناعهم، واصطلاحا كلام مؤلف يتضمن وعظا وإبلاغا على صفة مخصوصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} تفترق عن الموعظة وهي النصح والتذكير بالعواقب، وعن الوصية وهي التقدم بما يعمل به مقترنا بوعظ، وعن النصيحة التي تكون سرا بينما تشترط في الخطبة أن يسمعها جماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} الخطب المشروعة: خطبة الجمعة والعيدين والكسوفين والاستسقاء وخطب الحج، وكلها بعد الصلاة إلا خطبة الجمعة وخطبة الحج يوم عرفة؛ ومنها الخطبة في خطبة النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} خطبة الجمعة شرط لصحة الجمعة عند الجمهور، والحنفية يرون الشرط خطبة واحدة وتسن اثنتان، وحجة الجمهور فعله مع قوله «صلوا كما رأيتموني أصلي» ولأن الخطبتين مقام الركعتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} أركان الخطبة: الحنفية يكتفون بتحميدة أو تهليلة أو تسبيحة، والصاحبان يشترطون ذكرا طويلا يسمى خطبة؛ والمالكية أقل ما يسمى خطبة عند العرب ولو سجعتين فيه وصية؛ والشافعية خمسة أركان: حمد الله، والصلاة على النبي، والوصية بالتقوى، والدعاء للمؤمنين في الثانية، وقراءة آية مفهمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} أركان الخطبة عند الحنابلة أربعة: حمد الله بلفظ الحمد، والصلاة على النبي بصيغتها، والموعظة وهي مقصودها، وقراءة آية كاملة؛ وزاد بعضهم الموالاة والجهر، والأليق عند غيرهم أن يكونا شرطين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7702} شروط الخطبة: أن تقع في وقت الجمعة، وهو عند الجمهور وقت الظهر، والحنابلة يرون أول وقت العيد بعد ارتفاع الشمس، وحجتهم فعل أبي بكر وعمر وعثمان؛ وأن تكون قبل الصلاة، فإن خطب بعدها أعاد الصلاة إن قرب وإلا استأنفها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7702}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7703} وأن يحضرها جماعة تنعقد بهم الجمعة: الحنفية يكفي واحد غير الإمام، والمالكية اثنا عشر، والشافعية والحنابلة أربعون؛ وأن يرفع الصوت بقدر ما يسمع العدد المعتبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7703} الإنصات: الجمهور يوجبونه ويحرمون الكلام إلا للخطيب ومن يكلمه أو لتحذير من هلاك، والشافعية في القديم كالجمهور وفي الجديد لا يجب ولا يحرم، لحديث الأعرابي الذي سأل وهو يخطب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7703}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704} الموالاة بين الأركان والخطبتين والصلاة، ويغتفر اليسير؛ والحنفية يشترطون ألا يفصل بعمل قاطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704} العربية: الجمهور يشترطونها تعبدا، ولو كان الجمع عجما، وأبو حنيفة يجيز غيرها، والصاحبان يوافقان الجمهور إلا لعاجز؛ والمالكية يشترطون أن يفهم الخطيب معنى ما يقول؛ والشافعية يوجبون تعلم العربية كفاية، وإن لم يمكن خطب واحد بلغته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705} النية: الحنفية والحنابلة يشترطونها، والمالكية والشافعية لا يشترطونها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705} سننها المتفق عليها: الخطبة على منبر أو موضع مرتفع، والجلوس قبل الشروع، واستقبال القوم بوجوههم، والأذان بين يدي الخطيب كما كان في عهد النبي، ورفع الصوت، وتقصير الخطبتين وقصر الثانية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7706} سننها المختلف فيها: القيام مع القدرة (شرط عند الشافعية وأكثر المالكية، وواجب عند الدردير)، والاعتماد على قوس أو عصا، والجلوس بين الخطبتين، والطهارة من الحدث والخبث (شرط عند الشافعية وأبي يوسف)، وستر العورة، والسلام على الناس مرتين عند الشافعية والحنابلة، والبداءة بالحمد ثم الشهادة ثم الصلاة على النبي وغيرها من الترتيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7706}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7707}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7707}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7708} مكروهاتها: عند الحنفية التطويل، وترك السنن، والتسبيح والقراءة والصلاة على النبي لمن يسمع الخطبة، وتشميت العاطس ورد السلام؛ والكمال بن الهمام يحرم الكلام؛ والمالكية يكرهون تخطي الرقاب بعد جلوس الخطيب، ويحرمون الكلام والسلام والتنفل بعد الخروج؛ والشافعية يكرهون الدق على درج المنبر والالتفات والمبالغة في أوصاف الولاة؛ والحنابلة يكرهون رفع اليدين في الدعاء وسؤال الدعاء بعد الصعود.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7708}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7709} يكره للمصلي أن يسند ظهره إلى القبلة، ويكره رفع الصوت قدام بعض الخطباء، وابتداء التطوع بخروج الخطيب إلا تحية المسجد فلا تمنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7710} خطبتا العيد سنة لا يجب حضورهما ولا استماعهما لحديث ابن السائب، وعند بعض المالكية تلزم من شهد الصلاة؛ وهما كخطبة الجمعة في صفتها إلا أنهما بعد الصلاة بالإجماع، ويفتتحان بالتكبير لا بالحمد، ويكبر في أثنائهما، والجمهور يستحب تسع تكبيرات في الأولى وسبع في الثانية، والمالكية لا حد لذلك؛ ويبين في خطبة الفطر زكاة الفطر، وفي خطبة الأضحى أحكام الأضحية؛ وعند الشافعية لا يشترط فيهما القيام والطهارة وستر العورة والجلوس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7710}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711} خطبة الكسوف: الحنفية والحنابلة لا خطبة فيها، والمالكية يندبون وعظا بعدها بلا صفة الخطبة، والشافعية يندبون خطبتين كخطبتي الجمعة في أركانهما وسننهما، ولا يصح تقديمها على الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711} خطبة الاستسقاء: يندب عند الجمهور أن يخطب الإمام بعد الصلاة خطبة كخطبة العيد يعظ فيها ويأمر بالتوبة والصدقة؛ وأبو حنيفة لا صلاة جماعة فيها ولا خطبة؛ والمالكية والشافعية ومحمد بن الحسن يرون خطبتين، والحنابلة وأبو يوسف خطبة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7712} خطب الحج: يسن أن يخطب الإمام أو نائبه فيها، والجمهور ثلاث خطب والشافعية أربع: الأولى في السابع من ذي الحجة بمكة، والثانية يوم عرفة بنمرة قبل الظهر والعصر، والثالثة يوم النحر بمنى عند الشافعية والحنابلة، ويجعلها الحنفية والمالكية في الحادي عشر، والرابعة لدى الشافعية والحنابلة في ثاني أيام التشريق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7712}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7713} خطبة النكاح: يستحب أن يخطب العاقد أو غيره خطبة واحدة قبل العقد، والشافعية يستحبون خطبتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7713}'
  en: 'Khutba is lexically a prose speech by an eloquent speaker to a group to persuade them, and in technical usage a composed speech of admonition and announcement in a set form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} It differs from admonition (persuasion by the consequences), from charge (commanding conduct with exhortation), and from private counsel (nasiha), which is secret, while the khutba must be heard by a group. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} Lawful khutbas are those of Friday, the two feasts, the eclipses, rain-prayer and the Hajj; all come after prayer except the Friday khutba and the Hajj khutba on the day of Arafat; a khutba is also given at betrothal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} The Friday khutba is a condition of the validity of the Friday prayer by the majority; the Hanafis hold that one khutba is the condition, two are sunna. The majority cite the Prophet\''s instruction to pray as he prayed, and that the two khutbas stand in place of two units. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} Pillars: the Hanafis require only a praise, a declaration of unity or a glorification; the two companions require a long speech called a khutba; the Malikis require the least that is called a khutba, even two rhymed phrases with admonition; the Shafiis require five pillars: praise of God, prayer on the Prophet, admonition to piety, prayer for the believers in the second khutba, and a recitation of a verse conveying meaning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} Pillars for the Hanbalis are four: praise of God in the word hamd, prayer on the Prophet in its form, admonition, which is the purpose, and recitation of a whole verse; some add continuity and audibility, which the others take as conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7702} Conditions: the time, which the majority take as the time of noon prayer while the Hanbalis allow from the rise of the sun, citing the practice of Abu Bakr, Umar and Uthman; the sermon before the prayer, repeated if near and restarted if not; and a congregation of a number that makes the Friday prayer valid: one besides the Imam for the Hanafis, twelve for the Malikis, forty for the Shafiis and Hanbalis; the speech must be loud enough for that number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7702}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7703} Silence: the majority make it obligatory and forbid speech except for the preacher, or to warn of danger; the old Shafii view agrees, the new view neither obliges nor forbids, citing the Bedouin who spoke during the sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7703}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704} Continuity between the pillars, the two sermons and the prayer, with slight gaps forgiven; the Hanafis require no action that cuts between sermon and prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704} Arabic: the majority require it as an act of worship, even for a non-Arab congregation; Abu Hanifa allows other languages; the Malikis require the preacher understand what he says; the Shafiis require learning Arabic as a collective duty, and if impossible a speaker in their own tongue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705} Intention: required by the Hanafis and Hanbalis; not by the Malikis and Shafiis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705} Agreed sunnas: a pulpit or raised place, sitting before beginning, facing the people, the call before the preacher as in the time of the Prophet, raised voice, brevity of both sermons and shorter second. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7706} Disputed sunnas: standing when able (a condition for the Shafiis and most Malikis, a duty for al-Dardir), leaning on a staff or bow, sitting between the sermons, purity (a condition for the Shafiis and Abu Yusuf), covering the awrah, greeting the people twice (Shafiis and Hanbalis), and the order of praise, testimony, prayer on the Prophet and admonition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7706}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7707}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7707}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7708} Disliked acts: the Hanafis dislike prolixity and omitting sunnas, and dislike glorifying, reciting or praying on the Prophet aloud while the sermon is heard, and returning greetings; Ibn al-Humam forbids speech; the Malikis dislike stepping over people after the preacher sits and forbid speech, greeting and extra prayer; the Shafiis dislike striking the pulpit steps, turning around, and flattery of rulers; the Hanbalis dislike raising the hands in the sermon\''s prayer and asking for prayer on climbing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7708}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7709} The sermon of the Eid feasts: the Eid sermons are a sunna that need not be attended; some Malikis make attendance binding on those who attend the prayer; they match the Friday sermon except that they come after the prayer by agreement, open with takbir not praise, and use takbir within; the majority prefer nine takbirs in the first and seven in the second, the Malikis set no limit; the sermon of fast-breaking teaches the alms, that of sacrifice its rules; the Shafiis do not require standing, purity, covering or sitting for the Eid sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7710}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7710}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711} Eclipse sermon: the Hanafis and Hanbalis have none, the Malikis advise an exhortation without sermon form, the Shafiis prefer two sermons like the Friday ones, and forbid giving it before the prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711} Rain sermon: the majority prefer a sermon after prayer like the Eid sermon, exhorting repentance and alms; Abu Hanifa holds neither congregational prayer nor sermon; the Malikis, Shafiis and Muhammad al-Shaybani two sermons, the Hanbalis and Abu Yusuf one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7712} Hajj sermons: the Imam or his deputy gives sermons teaching the rites; the majority three and the Shafiis four: the first on the seventh of Dhu al-Hijja at Mecca, the second on Arafat before the midday and afternoon prayers, the third on the day of sacrifice at Mina (on the eleventh by the Hanafis and Malikis), and the fourth on the second day of tashriq for the Shafiis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7712}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7713} Marriage sermon: it is recommended to give one sermon before the contract, while the Shafiis prefer two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7713}'
  ur: 'خطبہ لغت میں فصیح مقرر کا کسی جماعت کو قائل کرنے کے لیے نثری کلام ہے، اور اصطلاح میں مخصوص صورت میں وعظ اور اعلان پر مشتمل مرتب کلام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} یہ نصیحت (انجام کی یاد دہانی) اور وصیت (عمل کی ہدایت کے ساتھ وعظ) سے مختلف ہے، اور خفیہ نصیحت سے بھی، کیونکہ خطبہ میں جماعت کا سننا شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700} مشروع خطبے: جمعہ، عیدین، کسوف، استسقاء اور حج کے خطبے؛ سب نماز کے بعد ہیں سوائے جمعہ اور عرفہ کے دن حج کے خطبے کے؛ نکاح کے خطبے بھی مشروع ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7700}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} جمعہ کا خطبہ جمہور کے نزدیک جمعہ کی صحت کی شرط ہے؛ حنفیہ ایک خطبہ شرط اور دو کو سنت کہتے ہیں؛ جمہور کی دلیل نبی کا «صلوا كما رأيتموني أصلي» اور دو خطبوں کا دو رکعت کے قائم مقام ہونا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} ارکان: حنفیہ حمد، تہلیل یا تسبیح پر اکتفا کرتے ہیں؛ صاحبین لمبی تقریر شرط کہتے ہیں؛ مالکیہ کم از کم وہ کلام جو خطبہ کہلائے، جس میں وصیت ہو؛ شافعیہ پانچ ارکان کہتے ہیں: حمد الٰہی، نبی پر درود، تقوی کی وصیت، دوسرے خطبے میں مومنین کے لیے دعا، اور مفہوم رکھنے والی آیت کی تلاوت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7701} حنابلہ کے نزدیک خطبے کے چار ارکان: حمد الٰہی کا لفظ، نبی پر درود کا صیغہ، وعظ جو مقصود ہے، اور پوری آیت کی تلاوت؛ بعض نے موالات اور جہر کو بھی شامل کیا، اور دوسروں کے نزدیک یہ شرائط ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7702} شرائط: وقت، جمہور کے نزدیک ظہر کا وقت، حنابلہ کے نزدیک سورج بلند ہونے کے بعد، ابو بکر، عمر اور عثمان کے عمل سے استدلال؛ نماز سے پہلے خطبہ ہو، بعد میں ہو تو قریب ہو تو نماز دہرائے ورنہ خطبہ دوبارہ؛ جماعت ایسی ہو جس سے جمعہ منعقد ہو: حنفیہ کے نزدیک امام کے سوا ایک، مالکیہ کے نزدیک بارہ، شافعیہ اور حنابلہ کے نزدیک چالیس؛ اتنی آواز ہو کہ معتبر تعداد سنے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7702}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7703} خاموشی: جمہور واجب کہتے ہیں اور خطیب یا ہلاکت سے خبردار کرنے کے سوا بات ممنوع؛ شافعیہ کا قدیم قول یہی ہے اور جدید میں نہ واجب نہ حرام، اعرابی کے سوال کی حدیث سے استدلال۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7703}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704} ارکان اور دونوں خطبوں اور نماز کے درمیان موالات، معمولی وقفہ معاف؛ حنفیہ عمل قاطع سے فصل کو مانع کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704} عربی زبان: جمہور تعبداً شرط کہتے ہیں اگرچہ جماعت عجمی ہو؛ ابو حنیفہ غیر عربی جائز کہتے ہیں؛ مالکیہ خطیب کا معنی سمجھنا شرط کہتے ہیں؛ شافعیہ عربی سیکھنا فرض کفایہ کہتے ہیں، اور نہ ممکن ہو تو اپنی زبان میں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7704}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705} نیت: حنفیہ اور حنابلہ شرط کہتے ہیں، مالکیہ اور شافعیہ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705} متفق علیہ سنتیں: منبر یا بلند جگہ، خطیب کا شروع سے پہلے بیٹھنا، لوگوں کا منہ اس کی طرف کرنا، اذان کا خطیب کے سامنے ہونا جیسا نبی کے زمانے میں تھا، آواز بلند کرنا، اور دونوں خطبے مختصر، دوسرا اس سے بھی مختصر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7705}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7706} اختلافی سنتیں: قیام (شافعیہ اور اکثر مالکیہ کے نزدیک شرط، دردیر کے نزدیک واجب)، کمان یا عصا پر ٹیک، دونوں خطبوں کے درمیان بیٹھنا، طہارت (شافعیہ اور ابو یوسف کے نزدیک شرط)، ستر کا ڈھانپنا، شافعیہ اور حنابلہ کے نزدیک دو بار سلام، اور ترتیب (حمد، شہادت، درود، وعظ)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7706}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7707}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7707}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7708} مکروہات: حنفیہ طوالت اور سنتوں کے ترک کو مکروہ کہتے ہیں، خطبہ سنتے ہوئے تسبیح، قراءت اور درود بلند آواز سے، اور چھینکنے والے کو جواب یا سلام کا جواب مکروہ؛ ابن الہمام کلام کو حرام کہتے ہیں؛ مالکیہ خطیب کے بیٹھنے کے بعد گردنیں پھلانگنے کو مکروہ اور کلام، سلام اور نفل کو ممنوع کہتے ہیں؛ شافعیہ منبر کی سیڑھی پر دق کرنے، التفات اور حکمرانوں کی مبالغہ آمیز تعریف کو مکروہ کہتے ہیں؛ حنابلہ دعا میں ہاتھ اٹھانے اور منبر پر چڑھتے ہی دعا کو مکروہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7708}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7709} نماز کے وقت مصلی کا پشت قبلہ کی طرف لگانا اور قبلہ کی طرف پاؤں پھیلانا مکروہ ہے؛ کچھ خطیبوں کے سامنے آواز بلند کرنا مکروہ ہے؛ خطیب کے نکلنے کے بعد نفل شروع کرنا مکروہ، سوائے تحیۃ المسجد کے جو داخل ہونے والے کو نہ روکا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7710} عیدین کے خطبے سنت ہیں، حاضر ہونا اور سننا واجب نہیں، حدیثِ ابن السائب سے استدلال؛ بعض مالکیہ کے نزدیک نماز میں حاضر ہونے والے پر لازم ہیں؛ یہ جمعہ کے خطبے کی طرح ہیں مگر نماز کے بعد بالاتفاق، تکبیر سے شروع ہوتے ہیں اور بیچ میں بھی تکبیر کہی جاتی ہے؛ جمہور پہلے میں نو اور دوسرے میں سات تکبیریں مستحب کہتے ہیں، مالکیہ حد مقرر نہیں کرتے؛ عید الفطر میں صدقہ فطر اور عید الاضحیٰ میں قربانی کے احکام بیان ہوں؛ شافعیہ کے نزدیک ان میں قیام، طہارت، ستر اور دونوں خطبوں کے درمیان بیٹھنا شرط نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7710}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711} کسوف کا خطبہ: حنفیہ اور حنابلہ کے نزدیک نہیں، مالکیہ خطبے کی صورت کے بغیر وعظ مستحب کہتے ہیں، شافعیہ جمعہ جیسے دو خطبے مستحب کہتے ہیں اور نماز سے پہلے دینا درست نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711} استسقاء کا خطبہ: جمہور کے نزدیک نماز کے بعد عید کی طرح خطبہ مستحب ہے جس میں توبہ اور صدقے کی تلقین ہو؛ ابو حنیفہ جماعت اور خطبہ دونوں نہیں کہتے؛ مالکیہ، شافعیہ اور محمد بن حسن دو خطبے، حنابلہ اور ابو یوسف ایک خطبہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7711}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7712} حج کے خطبے: امام یا اس کا نائب مناسک بتانے کے لیے خطبے دیتا ہے، جمہور کے نزدیک تین اور شافعیہ کے نزدیک چار: پہلا ذی الحجہ کی ساتویں تاریخ کو مکہ میں، دوسرا عرفات میں ظہر اور عصر سے پہلے، تیسرا قربانی کے دن منیٰ میں (حنفیہ اور مالکیہ گیارہویں کو)، اور چوتھا ایامِ تشریق کے دوسرے دن شافعیہ اور حنابلہ کے نزدیک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7712}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7713} نکاح کا خطبہ: عقد سے پہلے ایک خطبہ مستحب ہے، شافعیہ دو مستحب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7713}'
