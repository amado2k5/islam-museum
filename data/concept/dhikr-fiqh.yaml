id: concept/dhikr-fiqh
class: concept
kind: doctrine
label:
  ar: "الذِّكر (في الفقه)"
  en: "Dhikr (the remembrance of God in the rulings of fiqh)"
  ur: "ذکر (فقہی احکام میں اللہ کی یاد)"
summary:
  ar: "الذكر في الاصطلاح ذكر العبد لربه بالإخبار أو التلاوة أو الدعاء أو الثناء، وهو مستحب مطلوب في كل وقت إلا في مواضع خاصة كقضاء الحاجة والجماع وخطبة الجمعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8430} ويكون باللسان والقلب معا، ولا يعتد بالذكر اللساني إلا إذا تلفظ به الذاكر وأسمع نفسه عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8458} وأفضله القرآن لمن عمل به، ثم الكلمات الأربع: سبحان الله والحمد لله ولا إله إلا الله والله أكبر، ويعد الجمهور زيادة الذكر المأثور على الوارد جائزة إن لم تنقص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8448} وتعد من الذكر التهليل والتسبيح والتحميد والتكبير والحوقلة والاسترجاع والتسمية والصلاة على النبي، وتحرم صيغ شركية أو ناقصة، ويحرم الذكر في مواضع مخصوصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8455} واختلف الفقهاء والعلماء في الاجتماع على الذكر بصوت واحد، فأجازه بعضهم بشرط عدم التشويش وألا يعتقد واجبا، وأنكره الشاطبي إذا التزم بدعة إضافية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8461}"
  en: "In the rulings dhikr is the servant's remembrance of his Lord by statement, recitation, supplication or praise. It is recommended at all times, except in certain places and conditions such as relieving oneself, intercourse and the Friday sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8430} It is by tongue and heart together; by the majority, the tongue's dhikr counts only when the speaker says it and hears himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8458} The Qur'an is the best dhikr for one who acts on it, and then the four words: glory be to God, praise be to God, there is no god but God, and God is greatest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8448} The forms include the tahlil, tasbih, tahmid, takbir, hawqala, istirja', basmala and blessing on the Prophet; forms that imply shirk or deficiency are forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8455} Chanting in unison is disputed: some allow it when it does not disturb and is not thought obligatory, while al-Shatibi calls the unison of a fixed form an innovation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8461}"
  ur: "فقہی اصطلاح میں ذکر یہ ہے کہ بندہ زبان یا قلب سے اپنے رب کو یاد کرے، اور یہ ہر وقت مستحب ہے، سوائے مخصوص مواقع کے جیسے قضائے حاجت، جماع اور خطبۂ جمعہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8430} قرآن سب سے افضل ذکر ہے، پھر چار کلمات۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8444}"
