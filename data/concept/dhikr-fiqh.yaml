id: concept/dhikr-fiqh
class: concept
kind: doctrine
label:
  ar: "الذِّكر ⁦(في الفقه)⁩"
  en: "Dhikr (the remembrance of God in the rulings of fiqh)"
  ur: "ذکر ⁦(فقہی احکام میں اللہ کی یاد)⁩"
  es: "Dhikr (el recuerdo de Dios en las normas del fiqh)"
  fr: "Dhikr (le rappel de Dieu dans les règles du fiqh)"
  tr: "Anma (Hukuk Felsefesinde)"
  id: "Kenangan (dalam Yurisprudensi)"
summary:
  ar: "الذكر في الاصطلاح ذكر العبد لربه بالإخبار أو التلاوة أو الدعاء أو الثناء، وهو مستحب مطلوب في كل وقت إلا في مواضع خاصة كقضاء الحاجة والجماع وخطبة الجمعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8430} ويكون باللسان والقلب معا، ولا يعتد بالذكر اللساني إلا إذا تلفظ به الذاكر وأسمع نفسه عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8458} وأفضله القرآن لمن عمل به، ثم الكلمات الأربع: سبحان الله والحمد لله ولا إله إلا الله والله أكبر، ويعد الجمهور زيادة الذكر المأثور على الوارد جائزة إن لم تنقص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8448} وتعد من الذكر التهليل والتسبيح والتحميد والتكبير والحوقلة والاسترجاع والتسمية والصلاة على النبي، وتحرم صيغ شركية أو ناقصة، ويحرم الذكر في مواضع مخصوصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8455} واختلف الفقهاء والعلماء في الاجتماع على الذكر بصوت واحد، فأجازه بعضهم بشرط عدم التشويش وألا يعتقد واجبا، وأنكره الشاطبي إذا التزم بدعة إضافية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8461}"
  en: "In the rulings dhikr is the servant's remembrance of his Lord by statement, recitation, supplication or praise. It is recommended at all times, except in certain places and conditions such as relieving oneself, intercourse and the Friday sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8430} It is by tongue and heart together; by the majority, the tongue's dhikr counts only when the speaker says it and hears himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8458} The Qur'an is the best dhikr for one who acts on it, and then the four words: glory be to God, praise be to God, there is no god but God, and God is greatest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8448} The forms include the tahlil, tasbih, tahmid, takbir, hawqala, istirja', basmala and blessing on the Prophet; forms that imply shirk or deficiency are forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8455} Chanting in unison is disputed: some allow it when it does not disturb and is not thought obligatory, while al-Shatibi calls the unison of a fixed form an innovation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8461}"
  ur: "فقہی اصطلاح میں ذکر یہ ہے کہ بندہ زبان یا قلب سے اپنے رب کو یاد کرے، اور یہ ہر وقت مستحب ہے، سوائے مخصوص مواقع کے جیسے قضائے حاجت، جماع اور خطبۂ جمعہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8430} قرآن سب سے افضل ذکر ہے، پھر چار کلمات۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8444}"
  es: "En las normas, el dhikr es el recuerdo que el siervo hace de su Señor mediante la declaración, la recitación, la súplica o la alabanza. Se recomienda en todo momento, excepto en ciertos lugares y condiciones como al ir al baño, durante las relaciones sexuales y durante el sermón del viernes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8430} Es con la lengua y el corazón juntos; por la mayoría, el dhikr de la lengua solo cuenta cuando el hablante lo dice y se escucha a sí mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8458} El Corán es el mejor dhikr para quien actúa en consecuencia. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8443} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8444} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8447} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8448} Las formas incluyen Tahlil, Tasbih, Tahmid, Takbir, Hawqala, Istirja', Basmala y Bendición al Profeta; Se prohíben las formas que impliquen shirk o deficiencia. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8435} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8436} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8440} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8455} Se discute el canto al unísono: algunos lo permiten cuando no molesta y no se considera obligatorio, mientras que al-Shatibi llama innovación al unísono de una forma fija. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8460} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8461}"
  fr: "Dans les décisions rabbiniques, le dhikr est le souvenir que le serviteur se fait de son Seigneur par la parole, la récitation, la supplication ou la louange. Il est recommandé en tout temps, sauf dans certains lieux et circonstances, comme lors des déjections, des rapports sexuels et du sermon du vendredi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8430} Il s'agit d'un dhikr accompli conjointement par la langue et le cœur; selon la majorité, le dhikr verbal n'est valable que lorsque celui qui le prononce l'entend. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8458} Le Coran est le meilleur dhikr pour celui qui agit en conséquence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8448} Les formes incluent le Tahlil, le Tasbih, le Tahmid, le Takbir, le Hawqala, l'Istirja', le Basmala et la Bénédiction sur le Prophète; les formes qui impliquent un shirk ou une déficience sont interdites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8455} Le chant à l'unisson est contesté: certains l'autorisent lorsqu'il ne dérange pas et n'est pas considéré comme obligatoire, tandis qu'al-Shatibi qualifie l'unisson d'une forme fixe d'innovation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8461}"
  tr: "Terminolojide, anma, hizmetkârın Rabbini bilgilendirerek, okuyarak, yalvararak veya överek anmasını ifade eder ve özel durumlar hariç, örneğin rahatlama, cinsel ilişki veya Cuma vaazı verme gibi durumlarda her zaman tavsiye edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8430} Hem sözlü hem de kalpten yapılır ve sözlü anma, anma kişi tarafından söylenmedikçe ve çoğunluğun önünde kendini duymadıkça geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8458} ve en iyisi, ona göre hareket edenler için Kur'an'dır, ardından dört kelime: Subhan Allah, Alhamdulillah, La ilaha illallah, Allahu Ekber. Çoğunluk, aktarılan anmayı rapor edilenlere eklemeyi, azaltılmazsa izin verir olarak kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8448} ve tahleel, tasbih, hammeed, tekbir, hawqala, ististiq, gülümseme ve Peygamber'e bereket gönderme gibi anma unsurlarının bir parçası olarak kabul edilir. Politeist veya eksik formlar yasaktır ve anma belirli durumlarda yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8455} Hukukçular ve alimler zikr konusunda oybirliğiyle farklı fikir birliği yapmıştır; bazıları karışıklık yapılmadığı ve zorunlu sayılmadığı sürece izin vermiş, el-Şatibi ise ek bir yeniliğe bağlı kalırsa reddetmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8461}"
  id: "Dalam istilah, kenangan merujuk pada hamba yang menyebut Tuhannya melalui pemberitahuan, pembacaan, memohon, atau memuji-Nya, dan disarankan setiap saat kecuali dalam situasi khusus seperti buang air kecil, berhubungan seks, atau menyampaikan khotbah Jumat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8427} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8430} Ini dilakukan baik secara verbal maupun di hati, dan pengingat verbal tidak berlaku kecuali kenangan diucapkan oleh kenangan dan dia mendengar dirinya sendiri di depan mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8458} dan yang terbaik adalah Al-Qur'an bagi mereka yang bertindak atasnya, lalu empat kata: Subhan Allah, Alhamdulillah, La ilaha illallah, Allahu Akbar. Mayoritas menganggap menambahkan kenangan yang disampaikan ke apa yang dilaporkan diperbolehkan jika tidak dikurangi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8443} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8447} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8448} dan dianggap sebagai bagian dari peringatan seperti tahleel, tasbih, hammeed, takbir, hawqala, ististiq, smile, dan mengirimkan berkat kepada Nabi. Bentuk politeistik atau tidak lengkap dilarang, dan peringatan dilarang dalam kasus tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8455} Para ahli hukum dan ulama telah sepakat secara bulat mengenai dhikir; beberapa mengizinkannya asalkan tidak disalahartikan dan tidak dianggap wajib, sementara al-Shatibi menolaknya jika mengikuti inovasi tambahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8461}"
