id: concept/canon-cupping-the-legs-occiput-chin-and-loins
class: concept
kind: scientific
label:
  ar: "الحجامة على الساق والقمحدوة وتحت الذقن والقطن عند ابن سينا"
  en: "Cupping on the leg, the occiput, under the chin and the loins in the Canon"
  fr: "Ventouses sur jambe, occiput, menton et lombes dans le Canon"
  ur: "قانون میں پنڈلی، پس سر، ٹھوڑی کے نیچے اور کمر پر حجامہ"
  es: "Ahuecamiento de la pierna, el occipucio, debajo de la barbilla y los lomos en el Canon"
  tr: "İbn Sina'ya göre bacak, kamehdve, çene altı ve pamuk"
  id: "Bekam di kaki, qamahdwa, di bawah dagu, dan kapas menurut Ibn Sina"
summary:
  ar: "يمضي ابن سينا في مواضع الحجامة فيذكر الساق والقمحدوة والهامة وتحت الذقن والقطن، وما تنفع منه وما تضر به، وأثر الشرط وعدمه والنار {cite:canon-ibn-sina-print-v1 pp.300-301}."
  en: "Ibn Sina goes on through the places of cupping, naming the leg, the occiput, the crown, the place under the chin and the loins, what each helps and harms, and the difference made by scarifying, by not scarifying and by fire {cite:canon-ibn-sina-print-v1 pp.300-301}."
  fr: "Ibn Sina poursuit les sites : jambe, occiput, sommet de tête, dessous du menton et lombes ; il présente bienfaits et méfaits supposés et effets de scarification, de son absence et du feu {cite:canon-ibn-sina-print-v1 pp.300-301}."
  es: "Ibn Sina continúa repasando los lugares de aplicación de las ventosas, nombrando la pierna, el occipucio, la coronilla, el lugar debajo de la barbilla y los lomos, lo que cada uno ayuda y perjudica, y la diferencia que supone escarificar, no escarificar y usar fuego {cite:canon-ibn-sina-print-v1 pp.300-301}."
  ur: "ابن سینا سنگی لگانے کی جگہوں کے بارے میں آگے بڑھتا ہے، ٹانگ، مقبوضہ، تاج، ٹھوڑی اور کمر کے نیچے کی جگہ کا نام دیتا ہے، ہر ایک کس چیز کی مدد کرتا ہے اور نقصان پہنچاتا ہے، اور اس فرق کو نشان زد کرنے سے، نہ داغنے سے اور فائر کرنے سے۔"
  tr: "İbn Sina, kupa sıkma yerlerini tartışır; baldır, kama, hamma, çene altı ve pamuk, bunun fayda ve zararları, durumun etkisi veya yokluğu ve ateş {cite:canon-ibn-sina-print-v1 s.300-301} bahseder."
  id: "Ibn Sina melanjutkan membahas tempat-tempat bekam, menyebutkan tulang kering, qamah, hamma, di bawah dagu, dan kapas, manfaat dan kerugian darinya, efek kondisi atau ketidakhadirannya, serta api {cite:canon-ibn-sina-print-v1 hlm.300-301}."
