id: "concept/mal-al-laqua"
class: "concept"
kind: "scientific"
label:
  ar: "مآل اللقوة وإنذارها"
  en: "Outcome and warning of facial palsy"
  ur: "لقوہ کا انجام اور پیشگی خبر"
  es: "Pronóstico y advertencia de la parálisis facial"
  fr: "Évolution et signes avant-coureurs de la paralysie faciale"
  tr: "Gücün kaderi ve uyarısı"
  id: "Nasib dan peringatan kekuatan"
summary:
  ar: "كل لقوة امتدت ستة أشهر فبالحري أن لا يرجى صلاحها؛ واعلم أن اللقوة قد تنذر بفالج بل كثيراً ما تنذر بسكتة فتأمل هل تسحبها مقدمات الصرع والسكتة فحينئذ بادر باستفراغ قوي {cite:canon-ibn-sina-print-v2 p.154}"
  en: "Every laqua extending six months is fit not to be hoped for repair; know that laqua may warn of palsy, indeed often warns of apoplexy, so look whether the prodromes of epilepsy and apoplexy draw it, and then hasten with a strong evacuation {cite:canon-ibn-sina-print-v2 p.154}"
  ur: "ہر لقوہ جو چھ مہینے تک پھیلی رہے اس کی اصلاح کی امید رکھنا درست نہیں؛ اور جان لے کہ لقوہ فالج کی پیشگی خبر دے سکتا ہے بلکہ اکثر سکتہ کی پیشگی خبر دیتا ہے، تو دیکھ کہ کیا صرع اور سکتہ کی مقدمات اسے کھینچ رہی ہیں تو پھر مضبوط استفراغ میں جلدی کر {cite:canon-ibn-sina-print-v2 p.154}۔"
  es: "No cabe esperar curación de ninguna laguna que dure seis meses; ten en cuenta que la laguna puede advertir de parálisis, e incluso a menudo advierte de apoplejía, así que observa si los pródromos de la epilepsia y la apoplejía la provocan, y entonces procede con una evacuación vigorosa {cite:canon-ibn-sina-print-v2 p.154}"
  fr: "Toute laqua durant six mois ne doit pas être considérée comme guérissable; sachez que la laqua peut annoncer une paralysie, et même souvent une apoplexie; observez donc si les prodromes de l’épilepsie et de l’apoplexie la précèdent, et alors hâtez-vous d’évacuer vigoureusement {cite:canon-ibn-sina-print-v2 p.154}"
  tr: "Altı ay süren herhangi bir güç umulmamalıdır; bilinki bu güç felç uyarısı verebilir ve çoğu zaman felç uyarısı da verebilir. Epilepsi ve felcin öncülleri bunu çekip çekip çıkarıp hızla kusmaya acele etmediğini düşünün {cite:canon-ibn-sina-print-v2 s.154}"
  id: "Kekuatan yang bertahan enam bulan tidak boleh diharapkan; ketahuilah bahwa kekuatan dapat memperingatkan stroke dan sering kali memperingatkan stroke. Jadi pertimbangkan apakah prekursor epilepsi dan stroke menariknya pergi, lalu buru-buru muntah dengan kuat {cite:canon-ibn-sina-print-v2 hlm.154}"
