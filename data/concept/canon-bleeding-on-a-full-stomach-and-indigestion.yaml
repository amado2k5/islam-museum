id: concept/canon-bleeding-on-a-full-stomach-and-indigestion
class: concept
kind: scientific
label:
  ar: "الفصد على امتلاء المعدة والتخمة عند ابن سينا"
  en: "Bleeding on a full stomach and in indigestion in the Canon"
  fr: "Saignée, estomac plein et indigestion dans le Canon"
  ur: "قانون میں بھرے معدے اور بدہضمی میں فصد"
  es: "Sangrado con el estómago lleno y en caso de indigestión en el Canon"
  tr: "İbn Sina'ya göre tok karında flebit ve oburluk"
  id: "Flebitis pada perut kenyang dan rakus menurut Ibn Sina"
summary:
  ar: "يحذر ابن سينا من الفصد على امتلاء من الطعام لئلا تنجذب مادة غير نضيجة إلى العروق، وعلى امتلاء المعدة والمعي، ويأمر باستفراغها بالقيء وبالحقنة، ويمهل صاحب التخمة إلى أن تنهضم {cite:canon-ibn-sina-print-v1 p.292}."
  en: "Ibn Sina warns against bleeding on a fullness from food, lest unripe matter be drawn into the vessels, and on a stomach and gut full to the point of felt weight, and bids them be emptied by vomiting and by the enema, and the one with indigestion be given time until his indigestion is digested {cite:canon-ibn-sina-print-v1 p.292}."
  fr: "Ibn Sina déconseille la saignée en réplétion alimentaire pour ne pas attirer de matière non mûrie dans les vaisseaux, et lorsque estomac et intestin sont pleins jusqu’à pesanteur ressentie. Il propose évacuation par vomissement et lavement et attente de la digestion de l’indigestion {cite:canon-ibn-sina-print-v1 p.292}."
  es: "Ibn Sina advierte contra el sangrado cuando se está lleno por la comida, para que la materia inmadura no sea arrastrada a los vasos, y cuando el estómago y los intestinos están llenos hasta el punto de sentir su peso, y ordena que se vacíen mediante el vómito y el enema, y que a quien padece indigestión se le dé tiempo hasta que su indigestión sea digerida {cite:canon-ibn-sina-print-v1 p.292}."
  ur: "ابن سینا کھانے سے معمور ہونے پر خون آنے سے خبردار کرتا ہے، ایسا نہ ہو کہ کچا مادہ برتنوں میں اور معدے اور آنتوں پر بھرے ہوئے وزن تک نہ جائے اور قے اور انیما کے ذریعے ان کو خالی کر دیا جائے اور بدہضمی والے کو اس وقت تک مہلت دی جائے جب تک کہ اس کا بدہضمی نہ ہو جائے۔ صفحہ 292}۔"
  tr: "İbn Sina, yiyecek dolu olduğunda flebite karşı uyarıda bulunur, böylece olgunlaşmamış bir madde damarlara çekilmez ve mide ile bağırsaklar dolduğunda. Kusma ve enjeksiyon yoluyla atılmasını emreder ve bunalmış kişiye sindirim yapılana kadar verir {atıf:kanon-ibn-sina-print-v1 s.292}."
  id: "Ibn Sina memperingatkan tentang flebitis ketika makanan sudah penuh sehingga zat yang belum matang tidak tertarik ke pembuluh darah, dan ketika lambung serta usus penuh. Ia memerintahkan pengusiran dengan muntah dan suntikan, dan memberikan orang yang kewalahan hingga makanan itu dicerna {cite:canon-ibn-sina-print-v1 hlm.292}."
