id: concept/canon-bleeding-on-a-full-stomach-and-indigestion
class: concept
kind: scientific
label:
  ar: "الفصد على امتلاء المعدة والتخمة عند ابن سينا"
  en: "Bleeding on a full stomach and in indigestion in the Canon"
  fr: "Saignée, estomac plein et indigestion dans le Canon"
  ur: "قانون میں بھرے معدے اور بدہضمی میں فصد"
summary:
  ar: "يحذر ابن سينا من الفصد على امتلاء من الطعام لئلا تنجذب مادة غير نضيجة إلى العروق، وعلى امتلاء المعدة والمعي، ويأمر باستفراغها بالقيء وبالحقنة، ويمهل صاحب التخمة إلى أن تنهضم {cite:canon-ibn-sina-print-v1 p.292}."
  en: "Ibn Sina warns against bleeding on a fullness from food, lest unripe matter be drawn into the vessels, and on a stomach and gut full to the point of felt weight, and bids them be emptied by vomiting and by the enema, and the one with indigestion be given time until his indigestion is digested {cite:canon-ibn-sina-print-v1 p.292}."
  fr: "Ibn Sina déconseille la saignée en réplétion alimentaire pour ne pas attirer de matière non mûrie dans les vaisseaux, et lorsque estomac et intestin sont pleins jusqu’à pesanteur ressentie. Il propose évacuation par vomissement et lavement et attente de la digestion de l’indigestion {cite:canon-ibn-sina-print-v1 p.292}."
