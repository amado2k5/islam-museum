id: concept/al-itidalayn
class: concept
kind: scientific
label: { ar: "الاعتدالان", en: "The equinoxes", es: "Los equinoccios", fr: "Les équinoxes", tr: "İki ekinoks", id: "Dua ekuinoks" }
summary:
  ar: "الاعتدالان هما نقطتا تقاطع فلك البروج مع معدل النهار: الاعتدال الربيعي في أول الحمل، والاعتدال الخريفي في أول الميزان، وفي يوميهما يستوي الليل والنهار في جميع الأرض {cite:farghani-elements-astronomy p. 107}{cite:farghani-elements-astronomy p. 113}{cite:farghani-elements-astronomy p. 149}."
  en: "The equinoxes are the two points where the zodiac cuts the equinoctial circle: the vernal equinox at the beginning of Aries and the autumnal equinox at the beginning of Libra. On those days night and day are equal everywhere on the earth {cite:farghani-elements-astronomy p. 107}{cite:farghani-elements-astronomy p. 113}{cite:farghani-elements-astronomy p. 149}."
  es: "Los equinoccios son los dos puntos donde el zodíaco corta el círculo equinoccial: el equinoccio de primavera al comienzo de Aries y el equinoccio de otoño al comienzo de Libra. En esos días, la noche y el día tienen la misma duración en toda la Tierra {cite:farghani-elements-astronomy p. 107}{cite:farghani-elements-astronomy p. 113}{cite:farghani-elements-astronomy p. 149}."
  fr: "Les équinoxes sont les deux points où le zodiaque coupe le cercle équinoxial: l’équinoxe de printemps au début du Bélier et l’équinoxe d’automne au début de la Balance. Ces jours-là, le jour et la nuit sont égaux partout sur la Terre."
  ur: "equinoxes وہ دو نکات ہیں جہاں رقم مساوی دائرے کو کاٹتی ہے: میش کے شروع میں vernal equinox اور Libra کے شروع میں موسم خزاں کا ایکوینوکس۔ ان دنوں رات اور دن زمین پر ہر جگہ برابر ہوتے ہیں۔ 107}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 113}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 149}۔"
  tr: "İki ekinoks, burç burcunun gün ortalamasıyla kesişim noktalarıdır: Koç başındaki ilkbahar ekinoksu ve Terazi burcunun başındaki sonbahar ekinoksu; her iki günde de gece ve gündüz tüm Dünya genelinde eşittir {cite:farghani-elements-astronomy s. 107}{cite:farghani-elements-astronomy s. 113}{cite:farghani-elements-astronomy s. 149}."
  id: "Kedua ekuinoks tersebut adalah titik perpotongan antara zodiak dengan hari rata-rata: ekuinoks musim semi di ujung Aries dan ekuinoks musim gugur di awal Libra; pada kedua hari tersebut, siang dan malam sama di seluruh dunia {cite:Farghani-Elements-Astronomy hlm. 107}{cite:Farghani-Elements-Astronomy hlm. 113}{cite:Farghani-Elements-Astronomy hlm. 149}."
