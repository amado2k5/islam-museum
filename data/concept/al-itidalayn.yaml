summary:
  ar: "الاعتدالان هما نقطتا تقاطع فلك البروج مع معدل النهار: الاعتدال الربيعي في أول الحمل، والاعتدال الخريفي في أول الميزان، وفي يوميهما يستوي الليل والنهار في جميع الأرض {cite:farghani-elements-astronomy p. 107}{cite:farghani-elements-astronomy p. 113}{cite:farghani-elements-astronomy p. 149}."
  en: "The equinoxes are the two points where the zodiac cuts the equinoctial circle: the vernal equinox at the beginning of Aries and the autumnal equinox at the beginning of Libra. On those days night and day are equal everywhere on the earth {cite:farghani-elements-astronomy p. 107}{cite:farghani-elements-astronomy p. 113}{cite:farghani-elements-astronomy p. 149}."
