label: { ar: "شروط الاستدلال بالبول عند ابن سينا", en: "The conditions for reading urine in the Canon", ur: "پیشاب سے استدلال کی شرطیں قانون میں" }
summary:
  ar: "يشترط ابن سينا في البول المأخوذ للاستدلال أن يكون أول بول الصباح، لم يحبس طويلاً، ولم يسبقه شراب ولا طعام ولا صابغ، وأن يؤخذ كله في قارورة واسعة ويترك يهدأ بعيداً عن الشمس والريح {cite:canon-ibn-sina-print-v1 pp.183-184}."
  en: "Ibn Sina requires that the urine taken for reading be the first of the morning, not held long, preceded by no drink, food or dye, and that it be taken whole in a wide flask and left to settle away from sun and wind {cite:canon-ibn-sina-print-v1 pp.183-184}."
