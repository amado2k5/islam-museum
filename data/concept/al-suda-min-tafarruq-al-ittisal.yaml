id: concept/al-suda-min-tafarruq-al-ittisal
class: concept
kind: scientific
label:
  ar: "الصداع الكائن بسبب تفرق الاتصال"
  en: "Headache from a break of continuity"
  fr: "Céphalée due à une rupture de continuité"
  ur: "اتصال ٹوٹنے سے ہونے والا صداع"
  es: "Dolor de cabeza por una interrupción de la continuidad"
  tr: "Dağınık temas nedeniyle baş ağrısı"
  id: "Sakit kepala akibat kontak yang tersebar"
summary:
  ar: "يبيّن ابن سينا أين يعرض تفرق الاتصال في الرأس وأسبابه من الداخل والخارج، وما يخلّفه من قرحة، ويحكي عن بعض أطباء الهند أن الدود قد يكون سبباً، ويرى أن استبعاد ذلك ليس واجباً {cite:canon-ibn-sina-print-v2 pp.47-48}"
  en: "Ibn Sina shows where a break of continuity may occur in the head and its causes within and without, and the ulcer it may leave, and he reports that some physicians of India held that worms may be a cause, judging that rejecting this is not required {cite:canon-ibn-sina-print-v2 pp.47-48}"
  fr: "Ibn Sina indique où peut survenir une rupture de continuité dans la tête, quelles sont ses causes internes et externes et quel ulcère elle peut laisser. Il rapporte que certains médecins de l’Inde l’attribuaient parfois aux vers et estime qu’il n’y a pas lieu d’écarter cette possibilité {cite:canon-ibn-sina-print-v2 pp.47-48}"
  ur: "ابن سینا بتاتا ہے کہ سر میں اتصال کا ٹوٹنا کہاں ہوتا ہے، اس کے اندرونی اور بیرونی اسباب، اور وہ زخم جو وہ چھوڑ سکتا ہے، اور ہند کے بعض اطبا سے نقل کرتا ہے کہ کیڑے سبب ہو سکتے ہیں، اور اس کو رد کرنا واجب نہیں سمجھتا {cite:canon-ibn-sina-print-v2 pp.47-48}۔"
  es: "Ibn Sina muestra dónde puede producirse una ruptura de continuidad en la cabeza y sus causas internas y externas, así como la úlcera que puede dejar. Relata que algunos médicos de la India sostenían que los gusanos podían ser una causa, considerando que no era necesario rechazar esta posibilidad. {cite:canon-ibn-sina-print-v2 pp.47-48}"
  tr: "İbn Sina, başta temasın dağılımı nerede ortaya çıktığını, hem içte hem dışta nedenlerini ve ortaya çıkan ülseri açıklar. Bazı Hintli doktorların bunun nedeni olabileceğini bildirir ve bunun dışlanmasının gerekli olmadığını düşünür {cite:canon-ibn-sina-print-v2 s.47-48}"
  id: "Ibn Sina awalnya menjelaskan distribusi kontak, tempat terjadi, penyebabnya baik secara internal maupun eksternal, serta tukak yang dihasilkan. Ia menyatakan bahwa beberapa dokter India mungkin penyebabnya dan berpendapat tidak perlu untuk menyingkirkannya {cite:canon-ibn-sina-print-v2 hlm.47-48}"
