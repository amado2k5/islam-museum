label:
  ar: خواتيم الأعمال
  en: The endings of deeds (khawatim)
summary:
  ar: "أن الأعمال تُوزن بخواتيمها؛ يقرر ابن رجب في شرح حديث ابن مسعود أن قوله «إنما الأعمال بالخواتيم» معناه أن العبرة بما يختم به العمل من صلاح أو فساد، وأن خاتمة السوء تكون بسبب دسيسة باطنة في العبد لا يطلع عليها الناس — كخصلة خفية من سوء توجب سوء الخاتمة عند الموت — وأن «الخواتيم ميراث السوابق»، ولذلك كان السلف يشتد خوفهم من سوء الخواتيم ويخافون على أنفسهم النفاق الأصغر أن يغلب عليهم عند الخاتمة فيخرجهم إلى النفاق الأكبر، وكان النبي يكثر في دعائه «يا مقلب القلوب ثبت قلبي على دينك»."
  en: "That deeds are weighed by their endings; in his commentary on Ibn Masud's hadith Ibn Rajab explains 'deeds are but by their endings' as meaning that what counts is the state — sound or corrupt — in which the deed ends, that an evil ending comes through a hidden inward corrupting trait in the servant that people do not see, and that 'endings are the legacy of what preceded'; hence the early generations' intense fear of a bad ending and their fear that lesser hypocrisy might overcome them at the end and carry them into greater hypocrisy, while the Prophet often prayed 'O turner of hearts, make my heart firm on Your religion'."
