label:
  ar: خواتيم الأعمال
  en: The endings of deeds (khawatim)
  es: "Los finales de los actos (khawatim)"
  fr: "Les fins des actes (khawatim)"
  ur: "اعمال کا خاتمہ ⁦(خواتیم)⁩"
  tr: "İş Sonuçları"
  id: "Kesimpulan Bisnis"
summary:
  ar: "أن الأعمال تُوزن بخواتيمها؛ يقرر ابن رجب في شرح حديث ابن مسعود أن قوله «إنما الأعمال بالخواتيم» معناه أن العبرة بما يختم به العمل من صلاح أو فساد، وأن خاتمة السوء تكون بسبب دسيسة باطنة في العبد لا يطلع عليها الناس — كخصلة خفية من سوء توجب سوء الخاتمة عند الموت — وأن «الخواتيم ميراث السوابق»، ولذلك كان السلف يشتد خوفهم من سوء الخواتيم ويخافون على أنفسهم النفاق الأصغر أن يغلب عليهم عند الخاتمة فيخرجهم إلى النفاق الأكبر، وكان النبي يكثر في دعائه «يا مقلب القلوب ثبت قلبي على دينك»."
  en: "That deeds are weighed by their endings; in his commentary on Ibn Masud's hadith Ibn Rajab explains 'deeds are but by their endings' as meaning that what counts is the state — sound or corrupt — in which the deed ends, that an evil ending comes through a hidden inward corrupting trait in the servant that people do not see, and that 'endings are the legacy of what preceded'; hence the early generations' intense fear of a bad ending and their fear that lesser hypocrisy might overcome them at the end and carry them into greater hypocrisy, while the Prophet often prayed 'O turner of hearts, make my heart firm on Your religion'."
  es: "Que las obras se sopesan por sus finales; en su comentario sobre el hadiz de Ibn Masud, Ibn Rajab explica que \"las obras son solo por sus finales\" en el sentido de que lo que cuenta es el estado —bueno o corrupto— en el que termina la obra, que un mal final se produce a través de un rasgo corruptor interno oculto en el siervo que la gente no ve, y que \"los finales son el legado de lo que precedió\"; de ahí el intenso temor de las primeras generaciones a un mal final y su temor a que una hipocresía menor pudiera vencerlos al final y llevarlos a una hipocresía mayor, mientras que el Profeta a menudo oraba \"Oh, transformador de corazones, haz que mi corazón sea firme en Tu religión\"."
  fr: "Que les actes sont jugés par leur fin; dans son commentaire du hadith d'Ibn Masud, Ibn Rajab explique que « les actes ne valent que par leur fin » signifie que ce qui compte, c'est l'état — sain ou corrompu — dans lequel l'acte s'achève, qu'une mauvaise fin provient d'un trait corrupteur intérieur et caché chez le serviteur, invisible aux yeux des gens, et que « les fins sont l'héritage de ce qui a précédé »; d'où la crainte intense des premières générations d'une mauvaise fin et leur crainte qu'une hypocrisie moindre ne les submerge à la fin et ne les entraîne dans une hypocrisie plus grande, tandis que le Prophète priait souvent: « Ô Toi qui retournes les cœurs, affermis mon cœur dans Ta religion »."
  ur: "کہ اعمال اپنے انجام سے تولے جاتے ہیں۔ ابن مسعود کی حدیث کی تفسیر میں ابن رجب نے وضاحت کی ہے کہ 'اعمال ان کے انجام سے ہوتے ہیں' کے معنی یہ ہیں کہ کیا شمار ہوتا ہے وہ حالت - صحیح یا فاسد - جس میں عمل کا خاتمہ ہوتا ہے، اس کا خاتمہ بندے میں چھپی ہوئی باطنی خرابی کی وجہ سے ہوتا ہے جسے لوگ نہیں دیکھتے، اور یہ کہ 'انجام اس سے پہلے کی میراث ہیں'۔ اس لیے ابتدائی نسلوں میں برے انجام کا شدید خوف اور ان کے خوف سے کہ کہیں کم نفاق ان پر غالب آجائے اور انھیں بڑے نفاق کی طرف لے جائے، جب کہ نبی کریم اکثر دعا کرتے تھے کہ اے دلوں کو پھیرنے والے میرے دل کو اپنے دین پر ثابت قدم رکھ۔"
  tr: "eylemlerin sonlarıyla tartıldığını; İbn Receb, İbn Mes'ud'un hadislerini açıklarken, onun \"Amallar ancak sonla olur\" ifadesinin, ölçütün eylemi doğruluk veya yozlaşma açısından sonlandıran şey olduğunu ve kötü sonun, insanların bilmediği bir iç komplo — kötü işlerin gizli bir özelliği olan ve ölümde kötü sona yol açan — ve \"sonların önceki sonlardan miras kaldığını\" açıklar. Bu nedenle, ilk nesiller kötü sonlardan derinden korkmuş ve daha az ikiyüzlülüğün sonunda onları alt edip daha büyük bir ikiyüzlülüğe sürükleyebileceğinden korkmuşlardır. Peygamber sık sık şöyle dua ederdi: \"Ey kalplerin dönen, kalbimi dinine sıkı tut.\""
  id: "bahwa perbuatan ditimbang berdasarkan akhirnya; Ibn Rajab menjelaskan dalam menjelaskan hadits Ibn Mas'ud bahwa pernyataannya \"Perbuatan hanya berdasarkan akhir\" berarti bahwa kriteria adalah apa yang menyimpulkan perbuatan dalam hal kebenaran atau kerusakan, dan bahwa akhir buruk disebabkan oleh intrik batin dalam hamba yang tidak diketahui orang — sifat tersembunyi dari perbuatan buruk yang menyebabkan akhir buruk saat kematian — dan bahwa \"akhir diwarisi dari akhir sebelumnya.\" Oleh karena itu, generasi awal sangat takut akan akhir yang buruk dan takut bahwa kemunafikan yang lebih kecil mungkin akan membanjiri mereka di akhir dan membawa mereka pada kemunafikan yang lebih besar. Nabi sering berdoa: \"Wahai Pembawa hati, tetaplah hatiku teguh pada agama-Mu.\""
