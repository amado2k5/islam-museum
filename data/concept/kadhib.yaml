id: concept/kadhib
class: concept
kind: legal
label:
  ar: "كَذِب"
  en: "Lying (kadhib)"
  ur: "جھوٹ (کذب)"
summary:
  ar: "الكذب لغة الإخبار عن الشيء بخلاف ما هو عليه، والأصل فيه التحريم بالكتاب والسنة والإجماع. ويُباح أو يجب بحسب المقصد، فيباح في الحرب والإصلاح بين الناس وحديث الرجل امرأته، ويجوز الكذب دفعاً لظالم عن مال أو عرض، مع الاحتراز منه ما أمكن. والكذب على الله ورسوله من الكبائر، والكذب في الرؤيا كذب على الله، وانتساب المرء إلى غير أبيه وغش الوالي رعيته من الكبائر، وتحرم الشهادة الزور واليمين الغموس، ومن الكذب الذي يحرم حتى في المزاح والصبيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13223} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13225}"
  en: "Lying (kadhib) is, in its lexical sense, reporting a thing contrary to what it is. The rule is prohibition by the Qur'an, the Sunna and consensus, but it may be permitted or obligatory according to its purpose: in war, in reconciling people, between spouses, and to repel an oppressor from property or honour, with caution kept wherever possible. Lying about God or His Messenger is a major sin, and forged dream reports count as lying about God. Claiming another father, disowning one's own child, a ruler deceiving his subjects, and false witness and the false oath are all major sins. Lying is forbidden even in joking and in play with children. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13223} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13225} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13228}"
  ur: "لغت میں کذب کسی چیز کی خبر کو اس کے خلاف بیان کرنا ہے، اور اس کا اصل حکم کتاب، سنت اور اجماع سے حرمت ہے۔ لیکن مقصد کے اعتبار سے یہ مباح یا واجب بھی ہو سکتا ہے، جیسے جنگ میں، لوگوں میں صلح کرانے میں، میاں بیوی کی بات میں، اور ظالم سے مال یا عزت بچانے میں، جس میں ہر ممکن احتیاط ضروری ہے۔ اللہ اور اس کے رسول پر جھوٹ کبیرہ گناہ ہے، اور خواب گھڑنا اللہ پر جھوٹ ہے۔ اپنے باپ کے سوا کسی اور کی طرف نسبت، اپنی اولاد کا انکار، اور حاکم کا رعایا کو دھوکہ دینا بھی کبیرہ ہے۔ جھوٹی گواہی اور یمینِ غموس حرام ہیں، اور مذاق اور بچوں سے کھیلنے میں بھی جھوٹ منع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13223} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13225} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13228}"
