id: concept/iyyaka-naabudu-wa-iyyaka-nastain
class: concept
kind: doctrine
label:
  ar: "إياك نعبد وإياك نستعين"
  en: "Iyyaka na'budu wa-iyyaka nasta'in (You alone we worship and from You alone we seek help)"
  ur: "إياك نعبد وإياك نستعين"
  es: "Iyyaka na'budu wa-iyyaka nasta'in (Solo a Ti adoramos y solo de Ti buscamos ayuda)"
  fr: "Iyyaka na'budu wa-iyyaka nasta'in (C'est Toi seul que nous adorons et c'est de Toi seul que nous cherchons de l'aide)"
  tr: "Sana tapma ve yardım isteme"
  id: "Jangan menyembah dirimu dan jangan minta bantuan"
summary:
  ar: "الآية الخامسة من الفاتحة، والتحول فيها من الغيبة إلى الخطاب. يرى الشعراوي أن هذا التحول يضع العبد في حضرة الله، وأن تقديم «إياك» يقصر العبادة والاستعانة على الله وحده، وأن العبادة خضوع لمنهج الله، وأن السجود أعلى صور الخضوع، وأن الاستعانة تكون بالقوي الذي لا يضعف لا بالبشر {cite:tafsir-sharawi-khawatir-scan p.77} {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.83}. كما يذكر أن رؤية الإيمان أقوى من رؤية العين {cite:tafsir-sharawi-khawatir-scan p.74} {cite:tafsir-sharawi-khawatir-scan p.75}. هذا تفسيره ويُنسب إليه."
  en: "The fifth verse of the Fatiha, where the address shifts from the third person to the second. Sha'rawi holds that this shift places the worshipper before God; that putting 'You' first confines worship and seeking help to God alone; that worship is submission to God's method, prostration being the highest form; and that help is sought from the Strong, not from humans {cite:tafsir-sharawi-khawatir-scan p.77} {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.83}. He also holds that faith-sight is stronger than eye-sight {cite:tafsir-sharawi-khawatir-scan p.74} {cite:tafsir-sharawi-khawatir-scan p.75}. This is Sha'rawi's reading and is attributed to him."
  ur: "فاتحہ کی پانچویں آیت، جہاں خطاب غائب سے حاضر کی طرف بدلتا ہے۔ شعراوی کے مطابق یہ بدلاؤ بندے کو اللہ کی حضوری میں کھڑا کرتا ہے، «إياك» کو پہلے رکھنے سے عبادت اور مدد صرف اللہ کے لیے خاص ہوتی ہے، عبادت اللہ کے منہج کے آگے جھکنا ہے جس کی سب سے اعلیٰ صورت سجدہ ہے، اور مدد صرف اس قوی سے مانگی جاتی ہے جو کمزور نہیں ہوتا، انسانوں سے نہیں {cite:tafsir-sharawi-khawatir-scan p.77} {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.83}۔ ان کے نزدیک ایمان کی بصیرت آنکھ کے مشاہدے سے زیادہ مضبوط ہے {cite:tafsir-sharawi-khawatir-scan p.74} {cite:tafsir-sharawi-khawatir-scan p.75}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "El quinto versículo de la Fatiha, donde la invocación pasa de la tercera a la segunda persona. Sha'rawi sostiene que este cambio coloca al adorador ante Dios; que poner \"Tú\" primero limita la adoración y la búsqueda de ayuda solo a Dios; que la adoración es sumisión al método de Dios, siendo la postración la forma más elevada; y que la ayuda se busca en el Fuerte, no en los humanos {cite:tafsir-sharawi-khawatir-scan p.77} {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.83}. También sostiene que la visión de la fe es más fuerte que la vista {cite:tafsir-sharawi-khawatir-scan p.74} {cite:tafsir-sharawi-khawatir-scan p.75}. Esta es la lectura de Sha'rawi y se le atribuye."
  fr: "Le cinquième verset de la Fatiha marque le passage de la troisième à la deuxième personne. Sha'rawi soutient que ce changement place le fidèle devant Dieu; que le fait de commencer par « Toi » restreint l'adoration et la recherche d'aide à Dieu seul; que l'adoration consiste en une soumission à la voie divine, la prosternation étant la forme la plus élevée; et que l'aide doit être recherchée auprès du Tout-Puissant, et non auprès des hommes (voir: Tafsir Sha'rawi Khawatir, p. 77, p. 78, p. 83). Il affirme également que la foi, qui s'appuie sur la clairvoyance, est plus puissante que la vue (voir: Tafsir Sha'rawi Khawatir, p. 74, p. 75). Telle est l'interprétation de Sha'rawi, qui lui est attribuée."
  tr: "Al-Fatiha'nın beşinci ayeti ve içinde örtüşmeden konuşmaya dönüşüm. Al-Shaarawi, bu dönüşümün hizmetkârı Allah'ın huzurunda tuttuğuna, \"dikkatli ol\" sunusunun ibadet ve yardım aramayı yalnızca Tanrı'ya sınırladığına, ibadet Tanrı'nın yöntemine boyun eğmek olduğuna, secdeleşmenin en yüksek teslimiyet biçimi olduğuna ve yardım istemenin zayıflamayan güçlülerden geldiğine, insanlardan değil {cite:tafsir-sharawi-khawatir-scan s.77} {cite:tafsir-sharawi-khawatir-scan s.83} Ayrıca inancı görmenin gözle görmekten daha güçlü olduğunu belirtir {cite:tafsir-sharawi-khawatir-s.74} {cite:tafsir-sharawi-khawatir-s.75}. Bu onun yorumudur ve ona atfedilir."
  id: "Ayat kelima Al-Fatiha, dan transformasi dari okultasi menjadi ucapan di dalamnya. Al-Shaarawi percaya bahwa transformasi ini menempatkan hamba di hadapan Tuhan, bahwa persembahan \"berhati-hati\" membatasi penyembahan dan mencari pertolongan hanya kepada Tuhan, bahwa penyembahan adalah penyerahan pada metode Tuhan, bahwa sujud adalah bentuk tertinggi penyerahan, dan bahwa mencari pertolongan berasal dari yang kuat yang tidak melemah, bukan dari manusia {cite:tafsir-sharawi-khawatir-scan hlm.77} {cite:tafsir-sharawi-khawatir-scan hlm.78} {cite:tafsir-sharawi-khawatir-scan hlm.83}. Ia juga menyebutkan bahwa melihat iman lebih kuat daripada melihat dengan mata {cite:tafsir-sharawi-khawatir-scan hlm.74} {cite:tafsir-sharawi-khawatir-scan hlm.75}. Ini adalah interpretasinya dan dikaitkan dengannya."
