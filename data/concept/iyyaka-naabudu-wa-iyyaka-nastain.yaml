periods: [period/prophetic-era]
issue:
  ar: "لماذا تحوّل الخطاب في الفاتحة من الغائب إلى المخاطَب، وما أثر تقديم «إياك»؟"
  en: "Why does the Fatiha shift from the third person to the second, and what does placing 'You' first do?"
  ur: "فاتحہ میں خطاب غائب سے حاضر کی طرف کیوں بدلتا ہے، اور «إياك» کو پہلے رکھنے کا کیا اثر ہے؟"
perspectives:
  - tradition: sunni
    id: sharawi-iyyaka
    stance:
      ar: "التحول والتقديم يقصران العبادة والاستعانة على الله"
      en: "The shift and the fronting restrict worship and help to God"
      ur: "بدلاؤ اور تقدیم عبادت اور مدد کو اللہ کے لیے خاص کرتے ہیں"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن تقديم «إياك» يحسم أن العبادة لا تُشرك، وأن الانتقال إلى الخطاب يرفع المعاني الغيبية إلى رؤية إيمانية حاضرة {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.77}."
      en: "Sha'rawi holds that fronting 'You' settles that worship admits no partner, and that the move to direct address brings the unseen truths into a present faith-sight {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.77}."
      ur: "شعراوی کے مطابق «إياك» کو پہلے رکھنے سے یہ طے ہوتا ہے کہ عبادت میں کوئی شریک نہیں، اور خطاب کی طرف انتقال غیب کی حقیقتوں کو حاضر ایمانی بصیرت میں لے آتا ہے {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.77}۔"
