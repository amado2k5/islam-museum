id: concept/iyyaka-naabudu-wa-iyyaka-nastain
class: concept
kind: doctrine
label:
  ar: "إياك نعبد وإياك نستعين"
  en: "Iyyaka na'budu wa-iyyaka nasta'in (You alone we worship and from You alone we seek help)"
  ur: "إياك نعبد وإياك نستعين"
summary:
  ar: "الآية الخامسة من الفاتحة، والتحول فيها من الغيبة إلى الخطاب. يرى الشعراوي أن هذا التحول يضع العبد في حضرة الله، وأن تقديم «إياك» يقصر العبادة والاستعانة على الله وحده، وأن العبادة خضوع لمنهج الله، وأن السجود أعلى صور الخضوع، وأن الاستعانة تكون بالقوي الذي لا يضعف لا بالبشر {cite:tafsir-sharawi-khawatir-scan p.77} {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.83}. كما يذكر أن رؤية الإيمان أقوى من رؤية العين {cite:tafsir-sharawi-khawatir-scan p.74} {cite:tafsir-sharawi-khawatir-scan p.75}. هذا تفسيره ويُنسب إليه."
  en: "The fifth verse of the Fatiha, where the address shifts from the third person to the second. Sha'rawi holds that this shift places the worshipper before God; that putting 'You' first confines worship and seeking help to God alone; that worship is submission to God's method, prostration being the highest form; and that help is sought from the Strong, not from humans {cite:tafsir-sharawi-khawatir-scan p.77} {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.83}. He also holds that faith-sight is stronger than eye-sight {cite:tafsir-sharawi-khawatir-scan p.74} {cite:tafsir-sharawi-khawatir-scan p.75}. This is Sha'rawi's reading and is attributed to him."
  ur: "فاتحہ کی پانچویں آیت، جہاں خطاب غائب سے حاضر کی طرف بدلتا ہے۔ شعراوی کے مطابق یہ بدلاؤ بندے کو اللہ کی حضوری میں کھڑا کرتا ہے، «إياك» کو پہلے رکھنے سے عبادت اور مدد صرف اللہ کے لیے خاص ہوتی ہے، عبادت اللہ کے منہج کے آگے جھکنا ہے جس کی سب سے اعلیٰ صورت سجدہ ہے، اور مدد صرف اس قوی سے مانگی جاتی ہے جو کمزور نہیں ہوتا، انسانوں سے نہیں {cite:tafsir-sharawi-khawatir-scan p.77} {cite:tafsir-sharawi-khawatir-scan p.78} {cite:tafsir-sharawi-khawatir-scan p.83}۔ ان کے نزدیک ایمان کی بصیرت آنکھ کے مشاہدے سے زیادہ مضبوط ہے {cite:tafsir-sharawi-khawatir-scan p.74} {cite:tafsir-sharawi-khawatir-scan p.75}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
wings: [ideas]
