summary:
  ar: "التضمير أن تعلف الخيل حتى تسمن وتقوى، ثم يقلل علفها وتدخل بيتا وتغشى بالجلال حتى تعرق، فيخف لحمها وتقوى على الجري، ومدته عند العرب أربعون يوماً. ويرى جمهور الفقهاء إباحته مطلقاً واستحبابه للخيل المعدة للغزو، وفي الحديث أن النبي سابق بين الخيل المضمرة وغيرها. ومن قال إنه لا يجوز لما فيه من المشقة يندفع بالحديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5298}"
  en: "Tadmir is feeding a horse until it is fat and strong, then cutting its feed, stabling it, covering it with cloths until it sweats, so its flesh is lighter and it can run; the Arabs gave it forty days. Most jurists allow it, and recommend it for horses kept for war; the Prophet raced horses that had been trained against untrained ones, and this answers the objection of hardship. The conditions and the difference of racing distances are in the entry on racing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5298}"
  es: "Tadmir consiste en alimentar a un caballo hasta que esté gordo y fuerte, luego reducir su ración, estabularlo y cubrirlo con telas hasta que sude, de modo que su carne se aligera y pueda correr; los árabes lo aplicaban durante cuarenta días. La mayoría de los juristas lo permiten y lo recomiendan para caballos destinados a la guerra; el Profeta hizo competir a caballos entrenados contra caballos sin entrenar, lo que resuelve la objeción de la dificultad. Las condiciones y la diferencia de distancias de las carreras se encuentran en la entrada sobre carreras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5298}"
  fr: "Le tadmir consiste à nourrir un cheval jusqu'à ce qu'il soit gras et fort, puis à réduire sa ration, à le mettre à l'écurie et à le couvrir de couvertures jusqu'à ce qu'il transpire, afin d'alléger sa chair et de lui permettre de courir; les Arabes procédaient ainsi pendant quarante jours. La plupart des juristes l'autorisent et le recommandent pour les chevaux de guerre; le Prophète faisait courir des chevaux entraînés contre des chevaux non entraînés, ce qui répond à l'objection relative à la difficulté de l'entraînement. Les conditions et les différences de distances de course sont détaillées dans l'article consacré aux courses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5298}"
  ur: "تدمر گھوڑے کو اس وقت تک کھانا کھلاتا ہے جب تک کہ وہ موٹا اور مضبوط نہ ہو، پھر اس کے چارے کو کاٹتا ہے، اس کو ٹھنڈا کرتا ہے، اسے کپڑے سے ڈھانپتا ہے یہاں تک کہ اسے پسینہ آجائے، اس لیے اس کا گوشت ہلکا ہو اور وہ دوڑ سکتا ہے۔ عربوں نے اسے چالیس دن کا وقت دیا۔ اکثر فقہاء اس کی اجازت دیتے ہیں اور جنگ کے لیے رکھے گئے گھوڑوں کے لیے تجویز کرتے ہیں۔ نبی نے ایسے گھوڑوں کو دوڑایا جو غیر تربیت یافتہ لوگوں کے خلاف تربیت یافتہ تھے، اور یہ مشقت کے اعتراض کا جواب دیتا ہے۔ حالات اور دوڑ کی دوری کا فرق ریسنگ کے اندراج میں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5297}"
  tr: "Karışıklık kavramı, atları şişmanlayıp güçlenene kadar beslemek, sonra yemlerini azaltmak, bir eve girmek ve terleyene kadar görkemle örtülmek, böylece etleri hafifledi ve koşmaya daha güçlü hale geldiklerini belirtir. Araplar arasında süresi kırk gündür. Çoğu fihil bunu kesinlikle kabul edilebilir bulur ve atlar için tavsiyesini sefere hazırlamakta ve hadislerde Peygamber, eğitilen atlardan ve diğerlerinden önde yer almıştır. Zorluk nedeniyle bunun caiz olmadığını söyleyen, hadisi reddetmektedir. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.5297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5298}"
  id: "Konsep kebingungan adalah memberi makan kuda hingga mereka gemuk dan kuat, lalu mengurangi pakan, masuk ke rumah, dan ditutupi keagungan hingga berkeringat, sehingga dagingnya menjadi lebih ringan dan mereka menjadi lebih kuat untuk berlari. Di kalangan orang Arab, durasinya adalah empat puluh hari. Mayoritas ahli hukum menganggap ini sangat diperbolehkan dan rekomendasinya untuk kuda yang dipersiapkan untuk kampanye, dan dalam hadits Nabi lebih maju daripada kuda yang dilatih dan lainnya. Siapa pun yang mengatakan itu tidak diperbolehkan karena kesulitannya berarti menolak hadits tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5298}"
