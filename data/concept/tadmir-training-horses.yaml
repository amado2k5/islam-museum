  en: "Tadmir (training horses for a race or a campaign)"
  ur: "تضمیر (گھوڑوں کی تربیت، دوڑ یا جہاد کے لیے)"
summary:
  ar: "التضمير أن تعلف الخيل حتى تسمن وتقوى، ثم يقلل علفها وتدخل بيتا وتغشى بالجلال حتى تعرق، فيخف لحمها وتقوى على الجري، ومدته عند العرب أربعون يوماً. ويرى جمهور الفقهاء إباحته مطلقاً واستحبابه للخيل المعدة للغزو، وفي الحديث أن النبي سابق بين الخيل المضمرة وغيرها. ومن قال إنه لا يجوز لما فيه من المشقة يندفع بالحديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5298}"
  en: "Tadmir is feeding a horse until it is fat and strong, then cutting its feed, stabling it, covering it with cloths until it sweats, so its flesh is lighter and it can run; the Arabs gave it forty days. Most jurists allow it, and recommend it for horses kept for war; the Prophet raced horses that had been trained against untrained ones, and this answers the objection of hardship. The conditions and the difference of racing distances are in the entry on racing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5298}"
