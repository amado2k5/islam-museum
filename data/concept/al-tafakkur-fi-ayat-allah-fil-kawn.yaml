id: concept/al-tafakkur-fi-ayat-allah-fil-kawn
class: concept
kind: term
label:
  ar: "التفكر في آيات الله في الكون"
  en: "Reflection on God's signs in creation"
  ur: "کائنات میں اللہ کی نشانیوں پر غور"
summary:
  ar: "يرى الشعراوي أن القرآن يدعو إلى التأمل في آيات الله في الكون، وأن العلوم المادية تتراكم على علم سابق يهبه الله، وأن كل كشف يحمل معرفة كانت موجودة بالقوة {cite:tafsir-sharawi-khawatir-scan p.248} {cite:tafsir-sharawi-khawatir-scan p.249}."
  en: "Sha'rawi holds that the Qur'an calls for reflection on God's signs in the universe, that material sciences build on earlier knowledge God gives, and that every discovery was present potentially before it was found {cite:tafsir-sharawi-khawatir-scan p.248} {cite:tafsir-sharawi-khawatir-scan p.249}."
  ur: "شعراوی کے نزدیک قرآن کائنات میں اللہ کی نشانیوں پر غور کی دعوت دیتا ہے، مادی علوم اللہ کے دیے ہوئے سابقہ علم پر کھڑے ہوتے ہیں، اور ہر دریافت پہلے سے بالقوہ موجود تھی {cite:tafsir-sharawi-khawatir-scan p.248} {cite:tafsir-sharawi-khawatir-scan p.249}۔"
wings: [ideas]
themes: [cosmology-and-creation]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "ما علاقة العلم التجريبي بالإيمان في قراءة الشعراوي؟"
  en: "What is the relation between experimental science and faith in Sha'rawi's reading?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "العلم يتراكم على علم سابق ومن الله، والقرآن يدعو إلى التأمل فيه"
      en: "Science builds on earlier knowledge from God, and the Qur'an calls for reflection on it"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن كل علم نابع من علم سابق وإمكانات وهبها الله للإنسان، وأن القرآن يلفت إلى آيات الله في الكون ليعمل فيها العقل {cite:tafsir-sharawi-khawatir-scan p.248} {cite:tafsir-sharawi-khawatir-scan p.249}."
      en: "Sha'rawi holds that every science springs from earlier knowledge and capacities God gave humanity, and that the Qur'an draws attention to God's signs in the universe so that reason works on them {cite:tafsir-sharawi-khawatir-scan p.248} {cite:tafsir-sharawi-khawatir-scan p.249}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "تاريخ العلم والقرآن لم يُعرض بعد"
      en: "The history of science and the Qur'an is not yet set out"
    summary:
      ar: "لم تُعرض في هذه الصفحات دراسة لتاريخ العلوم أو لعلاقة العلم بالنص، وتحتاج إلى مراجع محددة. قصة نيوتن هنا رواية يذكرها الشعراوي ولم تُراجع."
      en: "No study of the history of science or of its relation to the text is set out in these pages; it needs named sources. The Newton anecdote is Sha'rawi's telling and has not been checked."
    sources: []
