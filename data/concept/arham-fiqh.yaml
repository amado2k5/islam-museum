label:
  ar: "أرحام"
  en: "Arham (kinship ties)"
  ur: "ارحام (رشتہ داری)"
summary:
  ar: "الرحم بيت منبت الولد ووعاؤه، وفي المجاز القرابة. والرحم نوعان: محرم وغير محرم؛ فالمحرم كل شخصين بينهما قرابة لو فرض أحدهما ذكرا والآخر أنثى لم يحل لهما أن يتناكحا، كالآباء والأمهات والإخوة والأخوات والأجداد والجدات والأولاد وأولادهم والأعمام والعمات والأخوال والخالات. أما بنات الأعمام والعمات والأخوال والخالات فليس بينهن وبين الإنسان محرمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2163} وللأرحام أحكام في صلتها وقطعها، والإرث والوصية والنفقة والنظر والولاية والشهادة والعتق، وتفصيلها في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172}"
  en: "The rahm (womb) is the place where the child grows and its container; figuratively it is kinship. Kinship is of two kinds: unlawful (mahram) and lawful (ghayr mahram). The first is any two persons related so that, if one were a male and the other a female, they could not marry, such as parents, siblings, grandparents however high, children and their children however low, paternal and maternal uncles and aunts. Cousins are not unlawful to one another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2163} The entry also covers the rulings on joining and cutting ties, inheritance, bequests, maintenance, sight and seclusion, guardianship, testimony and manumission, each treated in its own entry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172}"
  ur: "رحم بچے کے پیدا ہونے کی جگہ اور اس کا برتن ہے، اور مجازاً قرابت کو کہتے ہیں۔ رحم کی دو قسمیں ہیں: محرم اور غیر محرم۔ محرم وہ دو شخص ہیں جن کے درمیان قرابت ہو کہ اگر ایک مرد اور دوسری عورت فرض کی جائے تو ان کا نکاح حلال نہ ہو، جیسے ماں باپ، بہن بھائی، دادا دادی خواہ کتنے اوپر ہوں، اولاد اور ان کی اولاد خواہ کتنی نیچے ہو، چچا، پھوپھی، ماموں اور خالہ۔ چچا زاد، پھوپھی زاد، ماموں زاد اور خالہ زاد کے درمیان محرمیت نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2163} صلہ رحمی، قطع رحم، وراثت، وصیت، نفقہ، نظر، ولایت، شہادت اور عتق کے احکام بھی اسی مدخل میں ہیں، ہر ایک اپنی جگہ کی تفصیل کے ساتھ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172}"
