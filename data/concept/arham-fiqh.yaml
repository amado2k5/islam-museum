summary:
  ar: "الرحم بيت منبت الولد ووعاؤه، وفي المجاز القرابة. والرحم نوعان: محرم وغير محرم؛ فالمحرم كل شخصين بينهما قرابة لو فرض أحدهما ذكرا والآخر أنثى لم يحل لهما أن يتناكحا، كالآباء والأمهات والإخوة والأخوات والأجداد والجدات والأولاد وأولادهم والأعمام والعمات والأخوال والخالات. أما بنات الأعمام والعمات والأخوال والخالات فليس بينهن وبين الإنسان محرمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2163} وللأرحام أحكام في صلتها وقطعها، والإرث والوصية والنفقة والنظر والولاية والشهادة والعتق، وتفصيلها في مواضعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172}"
  en: "The rahm (womb) is the place where the child grows and its container; figuratively it is kinship. Kinship is of two kinds: unlawful (mahram) and lawful (ghayr mahram). The first is any two persons related so that, if one were a male and the other a female, they could not marry, such as parents, siblings, grandparents however high, children and their children however low, paternal and maternal uncles and aunts. Cousins are not unlawful to one another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2163} The entry also covers the rulings on joining and cutting ties, inheritance, bequests, maintenance, sight and seclusion, guardianship, testimony and manumission, each treated in its own entry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172}"
  fr: "Le rahm (matrice) est le lieu où grandit l’enfant et son réceptacle ; au sens figuré, il désigne la parenté. La parenté est de deux sortes : celle qui interdit le mariage (mahram) et celle qui le permet (ghayr mahram). La première concerne deux personnes apparentées telles que, si l’une était un homme et l’autre une femme, elles ne pourraient se marier, comme les père et mère, les frères et sœurs, les grands-parents à quelque degré qu’ils remontent, les enfants et leurs descendants à quelque degré qu’ils descendent, les oncles et tantes paternels et maternels. Le mariage entre cousins n’est pas interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2163} L’entrée traite aussi des règles sur l’entretien et la rupture des liens, les successions, les legs, l’entretien matériel, le regard et l’isolement en tête-à-tête, la tutelle, le témoignage et l’affranchissement, chacun traité dans son entrée propre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172}"
  ur: "رحم بچے کے پیدا ہونے کی جگہ اور اس کا برتن ہے، اور مجازاً قرابت کو کہتے ہیں۔ رحم کی دو قسمیں ہیں: محرم اور غیر محرم۔ محرم وہ دو شخص ہیں جن کے درمیان قرابت ہو کہ اگر ایک مرد اور دوسری عورت فرض کی جائے تو ان کا نکاح حلال نہ ہو، جیسے ماں باپ، بہن بھائی، دادا دادی خواہ کتنے اوپر ہوں، اولاد اور ان کی اولاد خواہ کتنی نیچے ہو، چچا، پھوپھی، ماموں اور خالہ۔ چچا زاد، پھوپھی زاد، ماموں زاد اور خالہ زاد کے درمیان محرمیت نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2163} صلہ رحمی، قطع رحم، وراثت، وصیت، نفقہ، نظر، ولایت، شہادت اور عتق کے احکام بھی اسی مدخل میں ہیں، ہر ایک اپنی جگہ کی تفصیل کے ساتھ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172}"
  es: "El rahm (útero) es el lugar donde crece el niño y su contenedor; figurativamente, es el parentesco. El parentesco es de dos tipos: ilícito (mahram) y lícito (ghayr mahram). El primero se refiere a dos personas emparentadas de tal manera que, si una fuera hombre y la otra mujer, no podrían contraer matrimonio, como padres, hermanos, abuelos (por muy lejanos que sean), hijos y nietos (por muy pequeños que sean), tíos y tías paternos y maternos. Los primos no son ilícitos entre sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2163} La entrada también abarca las normas sobre la unión y la ruptura de lazos, la herencia, los legados, la manutención, la vigilancia y el aislamiento, la tutela, el testimonio y la manumisión, cada una tratada en su propia entrada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172}"
  tr: "Rahim, çocuğun doğum yeri ve aracıdır ve mecazi anlamda akrabalıktır. İki tür akrabalık vardır: yasak ve mahram olmayan; ihramda olan kişi, biri erkek, diğeri kadın ise akraba olan herhangi bir kişidir; örneğin babalar, anneler, kardeşler, büyükanneler, büyükanneler, çocuklar ve onların çocukları, baba tarafından amcalar, anne tarafından teyzeler, anne tarafından amcalar ve anne tarafından teyzeler. Baba tarafından amcaların, baba tarafından teyzelerin, anne tarafından amcaların ve anne tarafından teyzelerin kızları için ise aralarında mahram yoktur. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.2163} Rahimlerin akrabalık ve ayrılık, miras, vasiyet, nafaka, velayet, vasilik, tanıklık ve özgürleşme ile ilgili yerlerinde kararları vardır. {Kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.2172}"
  id: "Rahim adalah tempat kelahiran dan wadah anak, dan secara metaforis, kekerabatan. Ada dua jenis kekerabatan: terlarang dan non-mahram; yang ada dalam ihram adalah siapa pun yang berkerabat jika satu laki-laki dan yang lain perempuan, tidak diperbolehkan menikah, seperti ayah, ibu, saudara laki-laki, saudara perempuan, kakek-nenek, nenek, anak-anak dan anak-anak mereka, paman dari pihak ayah, bibi dari pihak ibu, paman dari pihak ibu, dan bibi dari pihak ibu. Adapun putri dari paman dari pihak ayah, bibi dari pihak ayah, paman dari pihak ibu, dan bibi dari pihak ibu, tidak ada mahram antara mereka dan seseorang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2163} Rahim memiliki keputusan mengenai kekerabatan dan pemisahan, warisan, wasiat, pemeliharaan, hak asuh, perwalian, kesaksian, dan pembebasan, serta rincian mereka di tempat masing-masing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2172}"
