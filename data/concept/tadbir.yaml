summary:
  ar: "التدبير عتق العبد عن دبر، أي بعد موت سيده، وهو نوع من العتق وقربة شرعا. ويعتق المدبر بعد الموت من ثلث المال عند أكثر العلماء. واختلف الفقهاء في آثاره: فالحنفية والمالكية لا يبيعون المدبر، والشافعية يجيزون بيعه، وتبطله قتل المدبر لسيده واستغراق التركة بالدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4896}"
  en: "Tadbir is freeing a slave to take effect after his master's death; it is a form of manumission and an act of piety. Most scholars hold that the freedman comes from a third of the estate after death. The schools differ on its effects: the Hanafis and Malikis do not sell the tadbir slave; the Shafi'is allow sale, and a later sale is allowed for debt. Killing the master and debts that consume the estate void it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4896}"
  es: "El tadbir es la liberación de un esclavo que entra en vigor tras la muerte de su amo; es una forma de manumisión y un acto de piedad. La mayoría de los eruditos sostienen que el liberto hereda un tercio del patrimonio tras su muerte. Las escuelas difieren en cuanto a sus efectos: los hanafíes y los malikíes no venden al esclavo tadbir; los shafiíes permiten la venta, y se permite una venta posterior por deudas. Matar al amo y las deudas que consumen el patrimonio lo anulan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4896}"
  fr: "Le tadbir consiste à affranchir un esclave après le décès de son maître; c’est une forme d’affranchissement et un acte de piété. La plupart des savants estiment que l’affranchi reçoit un tiers de l’héritage après le décès. Les écoles divergent quant à ses effets: les hanafites et les malikites n’autorisent pas la vente de l’esclave affranchi; les chaféites l’autorisent, et une vente ultérieure est permise pour le règlement d’une dette. Le meurtre du maître et les dettes qui épuisent l’héritage entraînent la perte de ce dernier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4896}"
  ur: "تدبیر ایک غلام کو آزاد کر رہی ہے تاکہ اس کے آقا کی موت کے بعد اثر ہو؛ یہ توحید کی ایک شکل اور تقویٰ کا عمل ہے۔ زیادہ تر علماء کا خیال ہے کہ آزاد کرنے والا مرنے کے بعد جائیداد کے ایک تہائی حصے سے آتا ہے۔ اس کے اثرات پر مکاتب فکر میں اختلاف ہے: حنفیہ اور مالکی تدبیر غلام کو فروخت نہیں کرتے۔ شافعی فروخت کی اجازت دیتے ہیں، اور بعد میں قرض کے لیے فروخت کی اجازت ہے۔ آقا کو قتل کرنا اور قرض جو جائیداد کو استعمال کرتے ہیں اسے باطل کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص4895}"
  tr: "Yönetim, bir köleyi 'dabir'den, yani efendisinin ölümünden sonra kurtarmaktır; bu, İslam hukukuna göre bir tür kurtuluş ve yakınlık biçimidir. Çoğu âlime göre, yönetici ölümünden sonra servetin üçte birinden kurtulur. Hukukçular gelenekler konusunda farklı görüşteydi: Hanafiler ve Malikiler müdürünü satmaz, Şafiiler satışına izin verir ve yönetici efendisini öldürüp mülkü borca boğarak geçersiz sayılır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.4895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4896}"
  id: "Mengelola adalah membebaskan budak dari 'dabir,' yang berarti setelah kematian tuannya, yang merupakan bentuk pembebasan dan bentuk kedekatan menurut hukum Islam. Menurut sebagian besar ulama, pengelola dibebaskan setelah kematian dari sepertiga kekayaan. Para ahli hukum berbeda pendapat mengenai tradisinya: Hanafi dan Malik tidak menjual pengelola, Syafi'i mengizinkan penjualannya, dan hal itu dibatalkan oleh pengelola yang membunuh tuannya dan membebankan harta tersebut dalam utang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4896}"
