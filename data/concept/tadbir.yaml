label:
  ar: "التدبير"
  en: "Tadbir (manumission effective after death)"
  ur: "تدبیر ⁦(مالک کی موت کے بعد آزادی)⁩"
  es: "Tadbir (manumisión efectiva después de la muerte)"
  fr: "Tadbir (affranchissement effectif après la mort)"
  tr: "Yönetim"
