summary:
  ar: "التدبير عتق العبد عن دبر، أي بعد موت سيده، وهو نوع من العتق وقربة شرعا. ويعتق المدبر بعد الموت من ثلث المال عند أكثر العلماء. واختلف الفقهاء في آثاره: فالحنفية والمالكية لا يبيعون المدبر، والشافعية يجيزون بيعه، وتبطله قتل المدبر لسيده واستغراق التركة بالدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4896}"
  en: "Tadbir is freeing a slave to take effect after his master's death; it is a form of manumission and an act of piety. Most scholars hold that the freedman comes from a third of the estate after death. The schools differ on its effects: the Hanafis and Malikis do not sell the tadbir slave; the Shafi'is allow sale, and a later sale is allowed for debt. Killing the master and debts that consume the estate void it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4896}"
