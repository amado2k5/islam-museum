summary:
  ar: "عملة فضية على شكل سلك مثني أو مستقيم، تداولها التجار على الطريق البحري بين موانئ الخليج والساحل الغربي للهند وسريلانكا وجزر المالديف، وشاعت بين نحو 1500 و1700م {cite:nccah-islamic-coins-brochure p. 26}."
  en: "Silver wire money, bent or straight, used by merchants on the sea route linking the Gulf ports with western India, Sri Lanka and the Maldives, common between about 1500 and 1700 {cite:nccah-islamic-coins-brochure p. 26}."
  ur: "تار کی شکل کا چاندی کا سکہ، مڑا ہوا یا سیدھا، جو خلیج کی بندرگاہوں کو مغربی ہند، سری لنکا اور مالدیپ سے ملانے والے بحری راستے پر تاجر استعمال کرتے تھے، اور تقریباً 1500 سے 1700ء تک عام تھا {cite:nccah-islamic-coins-brochure p. 26}۔"
  es: "Monedas de alambre de plata, dobladas o rectas, utilizadas por los comerciantes en la ruta marítima que unía los puertos del Golfo con el oeste de la India, Sri Lanka y las Maldivas, comunes entre aproximadamente 1500 y 1700 {cite:nccah-islamic-coins-brochure p. 26}."
  fr: "Monnaie en fil d'argent, pliée ou droite, utilisée par les marchands sur la route maritime reliant les ports du Golfe à l'ouest de l'Inde, au Sri Lanka et aux Maldives, courante entre environ 1500 et 1700 {cite:nccah-islamic-coins-brochure p. 26}."
  tr: "Körfez limanları ile Hindistan'ın batı kıyısı, Sri Lanka ve Maldivler arasındaki deniz yolunda tüccarlar tarafından dolaşıma giren, bükülmüş veya düz tel şeklinde bir gümüş madeni paradır ve yaklaşık 1500 ile 1700 yılları arasında yaygındı {cite:nccah-islamic-coins-brochure s. 26}."
  id: "Koin perak berbentuk kawat bengkok atau lurus, diedarkan oleh pedagang di jalur maritim antara pelabuhan Teluk dan pantai barat India, Sri Lanka, dan Maladewa, dan umum ditemukan antara sekitar tahun 1500 dan 1700 M {cite:nccah-islamic-coins-brosur hlm. 26}."
