id: "concept/al-sar-min-al-udw"
class: "concept"
kind: "scientific"
label:
  ar: "الصرع الناشئ من عضو آخر"
  en: "Epilepsy arising from another organ"
  fr: "Épilepsie qui naît d’un autre organe"
  ur: "کسی اور عضو سے پیدا ہونے والا صرع"
summary:
  ar: "الصرع الذي يكون سببه في عضو آخر: بخارات ورياح ترتفع إلى الدماغ بالكمية أو بالكيفية — بالإجماد أو الإحراق أو السمّية — من جميع البدن أو من المعدة أو الطحال، أو سمّية تنتقل بوساطة العصب، أو من المعدة والمراق لتخم تورث سدداً {cite:canon-ibn-sina-print-v2 p.120} {cite:canon-ibn-sina-print-v2 p.121}"
  en: "Epilepsy whose cause lies in another organ: vapours and winds rising to the brain by quantity or by quality — chilling, burning or poisonous — from the whole body, the stomach or the spleen, a poisonous quality travelling by way of a nerve, or from the stomach and hypochondrium through indigestions that make obstructions {cite:canon-ibn-sina-print-v2 p.120} {cite:canon-ibn-sina-print-v2 p.121}"
  fr: "L’épilepsie dont la cause réside dans un autre organe : des vapeurs et des vents qui montent vers le cerveau par leur quantité ou par leur qualité — refroidissante, brûlante ou vénéneuse — depuis le corps entier, l’estomac ou la rate, une qualité vénéneuse qui chemine par la voie d’un nerf, ou bien depuis l’estomac et l’hypocondre par des indigestions qui forment des obstructions {cite:canon-ibn-sina-print-v2 p.120} {cite:canon-ibn-sina-print-v2 p.121}"
  ur: "ایسا صرع جس کا سبب کسی دوسرے عضو میں ہو: بخارات اور ہوائیں جو کمیت یا کیفیت کے لحاظ سے — ٹھندک، حرارت یا سمیت سے — دماغ تک اٹھیں، سارے بدن سے یا معدے یا طحال سے، یا سمیت جو عصب کے ذریعے پہنچے، یا معدے اور مراق سے تُخموں کے سبب جو سدے پیدا کریں {cite:canon-ibn-sina-print-v2 p.120} {cite:canon-ibn-sina-print-v2 p.121}۔"
