id: concept/kharas-estimate-fiqh
class: concept
kind: legal
label:
  ar: الخرص (تقدير الثمار)
  en: Kharṣ (estimating the fruit for zakat)
  ur: خرص
summary:
  ar: الخرص لغة القول بالظن، ويطلق على الكذب، وعلى حزر ما على النخل والكرم من الثمار تمرا أو زبيبا، والاصطلاح لا يخالف ذلك، والتخمين والحدس والتحري قريبة منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} يستحب للإمام عند المالكية والشافعية والحنابلة أن يبعث ساعيه ليخرص الثمار على رؤوس النخل والكرم بعد بدو صلاحها، ليعرف بذلك نصاب الزكاة والواجب فيها، واستدلوا بحديث عتاب بن أسيد في خرص العنب كما يخرص النخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} وقت الخرص حين يطيب الثمر ويبدو صلاحه، ودليله حديث عائشة في بعث عبد الله بن رواحة إلى يهود خيبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} جمهور الفقهاء على أن الخرص لا يكون إلا في النخل والكرم، فلا يخرص الحب في سنبله ولا الزيتون، وعند المالكية قول بجوازه إذا احتاج أهله، والزهري والأوزاعي والليث يخرصون الزيتون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} الشافعية يحرمون التصرف في الثمار قبل الخرص أو التضمين لتعلق حق الفقراء بها، والحنابلة يجيزون التصرف قبله وبعده، وتكون الزكاة على البائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} يكفي خارص واحد باتفاق من يقول بالخرص، وعند الشافعية قول باشتراط التعدد، ويشترط أن يكون أمينا عدلا عارفا، وعند الشافعية في الأصح الذكورة والحرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} وصفة الخرص أن يشاهد الخارص الأشجار فيقدر ما يجيء منها تمرا أو زبيبا، وإن تعددت الأنواع خرص كل نوع على حدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} الحنابلة يوجبون أن يترك الخارص الثلث أو الربع توسعة على أرباب الأموال، والشافعية يتركون ثمر نخلة أو نخلات، والمالكية والمشهور عند الشافعية لا يتركون شيئا، ويحملون الحديث على الزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626} جمهور الفقهاء يرون أن حق الفقراء ينتقل بعد الخرص من عين الثمار إلى ذمة المالك فيجوز له التصرف، والشافعية يشترطون تضمين الساعي وقبول المالك، وعندهم قول بانقطاع الحق بنفس الخرص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} إذا هلك المخروص بلا تفريط من المالك قبل الإخراج فلا شيء عليه إن لم يتمكن منه، فإن أخر بلا عذر ضمن نصيب الفقراء. وإن ادعى التلف بغير تفريطه فالقول قوله عند مالك وأحمد بلا يمين، وعند الشافعية يحلف في السبب الخفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} جائز عند المالكية والراجح عند الشافعية قسمة الثمار على رؤوس النخل والكرم بالخرص إذا طابت وحل بيعها واختلفت حاجة الشركاء، للضرورة وسهولة الحزر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} البيع بالمجازفة، وهو بيع الصبرة بلا كيل ولا وزن بالحدس والتخمين، جائز بالجملة باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}
  en: Kharṣ is lexically speaking by guesswork, and can mean a lie, and the estimate of the fruit on palms and vines, as dried dates or raisins; the technical sense agrees. Guessing, conjecture and inquiry are close to it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} The Malikis, Shafiis and Hanbalis hold that the Imam should send his agent to estimate the fruit on the palm and vine once it is ripe, so that the zakat threshold and due amount are known; they cite the report of Attab ibn Asid that grapes are estimated as palms are. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} The time is when the fruit ripens, on the report of Aisha that Abdullah ibn Rawaha was sent to the Jews of Khaybar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} Most jurists limit estimating to palms and vines, not grain on the stalk or olives; one Maliki view allows olives when the owners need it, and al-Zuhri, al-Awza'i and al-Layth estimate olives. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} The Shafiis forbid disposal of the fruit before estimating or guarantee, since the poor have a claim on it; the Hanbalis allow disposal before and after, the zakat falling on the seller. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} One estimator suffices by agreement among those who allow it; one Shafii view requires several; he must be trustworthy, just and knowledgeable, and for the Shafiis (the sounder view) male and free. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} The estimator views the trees and judges how much will become dried dates or raisins; if there are several kinds, each is estimated apart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} The Hanbalis require leaving a third or a quarter to the owner for his household and guests; the Shafiis leave the fruit of a palm or two; the Malikis and the preferred Shafii view leave nothing, reading the report as about zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626} Most jurists hold that after estimation the poor's claim moves from the fruit to the owner's liability, so he may dispose of it; the Shafiis require the agent's guarantee and the owner's acceptance, and one view holds the claim ends by the estimate alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} If the estimated fruit perishes without the owner's neglect before zakat is paid, nothing is owed if he could not pay; if he delayed without excuse he owes the poor's share. If the owner claims loss without fault, his word is accepted without oath (Malik, Ahmad); the Shafiis have him swear for a hidden cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} The Malikis and the preferred Shafii view allow dividing the fruit on the palms by estimate once it ripens and may be sold, when the partners' needs differ, for the need and the ease of estimating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} Sale by guesswork, without measure or weight, on sight and estimate, is lawful by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}
  ur: خرص لغت میں گمان سے بات کرنا ہے، جھوٹ کے معنی میں بھی آتا ہے، اور کھجور اور انگور کے درختوں کے پھل کا اندازہ لگانے کو کہتے ہیں کہ کتنا خشک ہو کر کھجور یا کشمش بنے گا؛ اصطلاح بھی یہی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} مالکیہ، شافعیہ اور حنابلہ کے نزدیک امام مستحب ہے کہ پھل پکنے پر عامل بھیج کر درختوں پر خرص کرائے تاکہ زکوٰۃ کا نصاب اور واجب مقدار معلوم ہو؛ انگور کو کھجور کی طرح خرص کرنے پر عتاب بن اسید کی حدیث سے استدلال کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} وقت یہ ہے کہ پھل پک کر تیار ہو، عائشہ کی روایت میں عبداللہ بن رواحہ کو خیبر کے یہود پر بھیجنے کا ذکر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} جمہور کے نزدیک خرص صرف کھجور اور انگور میں ہے، غلہ اور زیتون میں نہیں؛ مالکیہ کا ایک قول ہے کہ گھر والوں کی ضرورت ہو تو زیتون میں بھی جائز ہے، اور زہری، اوزاعی اور لیث زیتون کا خرص کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} شافعیہ خرص یا ضمانت سے پہلے پھل میں تصرف حرام کہتے ہیں کیونکہ فقراء کا حق متعلق ہے، حنابلہ پہلے اور بعد دونوں میں تصرف جائز کہتے ہیں اور زکوٰۃ بیچنے والے پر ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} جن کے نزدیک خرص جائز ہے ان کے ہاں ایک خارص کافی ہے، شافعیہ کے ایک قول میں متعدد خارص شرط ہیں؛ خارص امین، عادل اور واقف کار ہو، اور شافعیہ کے اصح قول میں مرد اور آزاد ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} خارص درختوں کو دیکھ کر اندازہ کرتا ہے کہ کتنا پھل کھجور یا کشمش بنے گا، اور اقسام متعدد ہوں تو ہر قسم کا الگ خرص ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} حنابلہ مالک کے لیے ایک تہائی یا چوتھائی چھوڑنا واجب کہتے ہیں تاکہ گھر والے اور مہمان کھا سکیں؛ شافعیہ ایک دو درخت کا پھل چھوڑتے ہیں؛ مالکیہ اور شافعیہ کا مشہور قول کچھ نہیں چھوڑتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626} جمہور کے نزدیک خرص کے بعد فقراء کا حق پھل سے مالک کے ذمے میں منتقل ہو جاتا ہے، اس لیے وہ تصرف کر سکتا ہے؛ شافعیہ عامل کی ضمانت اور مالک کی قبولیت شرط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} مالک کی بلا کوتاہی پھل ضائع ہو جائے تو جب ادائیگی ممکن نہ تھی تو کچھ لازم نہیں، بلا عذر تاخیر ہوئی تو فقراء کا حصہ دینا ہوگا۔ ضیاع کا دعویٰ بغیر کوتاہی کے ہو تو مالک اور احمد کے نزدیک بلا قسم قبول ہے، شافعیہ خفیہ سبب میں قسم لیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} مالکیہ اور شافعیہ کا راجح قول ہے کہ جب پھل پک جائے اور بیچا جا سکے اور شرکاء کی ضرورتیں مختلف ہوں تو خرص کے ذریعے درخت پر تقسیم جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} بغیر ناپ تول کے اندازے سے بیچنا (مجازفہ) باتفاق جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}
