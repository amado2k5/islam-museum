id: concept/kharas-estimate-fiqh
class: concept
kind: legal
label:
  ar: الخرص ⁦(تقدير الثمار)⁩
  en: Kharṣ (estimating the fruit for zakat)
  ur: خرص
  es: "Kharṣ (estimación de la fruta para el zakat)"
  fr: "Kharṣ (estimation des fruits pour la zakat)"
  tr: "Kharas (Meyve Tahmini)"
  id: "Kharas (Perkiraan Buah)"
summary:
  ar: الخرص لغة القول بالظن، ويطلق على الكذب، وعلى حزر ما على النخل والكرم من الثمار تمرا أو زبيبا، والاصطلاح لا يخالف ذلك، والتخمين والحدس والتحري قريبة منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} يستحب للإمام عند المالكية والشافعية والحنابلة أن يبعث ساعيه ليخرص الثمار على رؤوس النخل والكرم بعد بدو صلاحها، ليعرف بذلك نصاب الزكاة والواجب فيها، واستدلوا بحديث عتاب بن أسيد في خرص العنب كما يخرص النخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} وقت الخرص حين يطيب الثمر ويبدو صلاحه، ودليله حديث عائشة في بعث عبد الله بن رواحة إلى يهود خيبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} جمهور الفقهاء على أن الخرص لا يكون إلا في النخل والكرم، فلا يخرص الحب في سنبله ولا الزيتون، وعند المالكية قول بجوازه إذا احتاج أهله، والزهري والأوزاعي والليث يخرصون الزيتون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} الشافعية يحرمون التصرف في الثمار قبل الخرص أو التضمين لتعلق حق الفقراء بها، والحنابلة يجيزون التصرف قبله وبعده، وتكون الزكاة على البائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} يكفي خارص واحد باتفاق من يقول بالخرص، وعند الشافعية قول باشتراط التعدد، ويشترط أن يكون أمينا عدلا عارفا، وعند الشافعية في الأصح الذكورة والحرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} وصفة الخرص أن يشاهد الخارص الأشجار فيقدر ما يجيء منها تمرا أو زبيبا، وإن تعددت الأنواع خرص كل نوع على حدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} الحنابلة يوجبون أن يترك الخارص الثلث أو الربع توسعة على أرباب الأموال، والشافعية يتركون ثمر نخلة أو نخلات، والمالكية والمشهور عند الشافعية لا يتركون شيئا، ويحملون الحديث على الزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626} جمهور الفقهاء يرون أن حق الفقراء ينتقل بعد الخرص من عين الثمار إلى ذمة المالك فيجوز له التصرف، والشافعية يشترطون تضمين الساعي وقبول المالك، وعندهم قول بانقطاع الحق بنفس الخرص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} إذا هلك المخروص بلا تفريط من المالك قبل الإخراج فلا شيء عليه إن لم يتمكن منه، فإن أخر بلا عذر ضمن نصيب الفقراء. وإن ادعى التلف بغير تفريطه فالقول قوله عند مالك وأحمد بلا يمين، وعند الشافعية يحلف في السبب الخفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} جائز عند المالكية والراجح عند الشافعية قسمة الثمار على رؤوس النخل والكرم بالخرص إذا طابت وحل بيعها واختلفت حاجة الشركاء، للضرورة وسهولة الحزر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} البيع بالمجازفة، وهو بيع الصبرة بلا كيل ولا وزن بالحدس والتخمين، جائز بالجملة باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}
  en: Kharṣ is lexically speaking by guesswork, and can mean a lie, and the estimate of the fruit on palms and vines, as dried dates or raisins; the technical sense agrees. Guessing, conjecture and inquiry are close to it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} The Malikis, Shafiis and Hanbalis hold that the Imam should send his agent to estimate the fruit on the palm and vine once it is ripe, so that the zakat threshold and due amount are known; they cite the report of Attab ibn Asid that grapes are estimated as palms are. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} The time is when the fruit ripens, on the report of Aisha that Abdullah ibn Rawaha was sent to the Jews of Khaybar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} Most jurists limit estimating to palms and vines, not grain on the stalk or olives; one Maliki view allows olives when the owners need it, and al-Zuhri, al-Awza'i and al-Layth estimate olives. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} The Shafiis forbid disposal of the fruit before estimating or guarantee, since the poor have a claim on it; the Hanbalis allow disposal before and after, the zakat falling on the seller. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} One estimator suffices by agreement among those who allow it; one Shafii view requires several; he must be trustworthy, just and knowledgeable, and for the Shafiis (the sounder view) male and free. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} The estimator views the trees and judges how much will become dried dates or raisins; if there are several kinds, each is estimated apart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} The Hanbalis require leaving a third or a quarter to the owner for his household and guests; the Shafiis leave the fruit of a palm or two; the Malikis and the preferred Shafii view leave nothing, reading the report as about zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626} Most jurists hold that after estimation the poor's claim moves from the fruit to the owner's liability, so he may dispose of it; the Shafiis require the agent's guarantee and the owner's acceptance, and one view holds the claim ends by the estimate alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} If the estimated fruit perishes without the owner's neglect before zakat is paid, nothing is owed if he could not pay; if he delayed without excuse he owes the poor's share. If the owner claims loss without fault, his word is accepted without oath (Malik, Ahmad); the Shafiis have him swear for a hidden cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} The Malikis and the preferred Shafii view allow dividing the fruit on the palms by estimate once it ripens and may be sold, when the partners' needs differ, for the need and the ease of estimating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} Sale by guesswork, without measure or weight, on sight and estimate, is lawful by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}
  ur: خرص لغت میں گمان سے بات کرنا ہے، جھوٹ کے معنی میں بھی آتا ہے، اور کھجور اور انگور کے درختوں کے پھل کا اندازہ لگانے کو کہتے ہیں کہ کتنا خشک ہو کر کھجور یا کشمش بنے گا؛ اصطلاح بھی یہی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} مالکیہ، شافعیہ اور حنابلہ کے نزدیک امام مستحب ہے کہ پھل پکنے پر عامل بھیج کر درختوں پر خرص کرائے تاکہ زکوٰۃ کا نصاب اور واجب مقدار معلوم ہو؛ انگور کو کھجور کی طرح خرص کرنے پر عتاب بن اسید کی حدیث سے استدلال کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} وقت یہ ہے کہ پھل پک کر تیار ہو، عائشہ کی روایت میں عبداللہ بن رواحہ کو خیبر کے یہود پر بھیجنے کا ذکر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} جمہور کے نزدیک خرص صرف کھجور اور انگور میں ہے، غلہ اور زیتون میں نہیں؛ مالکیہ کا ایک قول ہے کہ گھر والوں کی ضرورت ہو تو زیتون میں بھی جائز ہے، اور زہری، اوزاعی اور لیث زیتون کا خرص کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} شافعیہ خرص یا ضمانت سے پہلے پھل میں تصرف حرام کہتے ہیں کیونکہ فقراء کا حق متعلق ہے، حنابلہ پہلے اور بعد دونوں میں تصرف جائز کہتے ہیں اور زکوٰۃ بیچنے والے پر ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} جن کے نزدیک خرص جائز ہے ان کے ہاں ایک خارص کافی ہے، شافعیہ کے ایک قول میں متعدد خارص شرط ہیں؛ خارص امین، عادل اور واقف کار ہو، اور شافعیہ کے اصح قول میں مرد اور آزاد ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} خارص درختوں کو دیکھ کر اندازہ کرتا ہے کہ کتنا پھل کھجور یا کشمش بنے گا، اور اقسام متعدد ہوں تو ہر قسم کا الگ خرص ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} حنابلہ مالک کے لیے ایک تہائی یا چوتھائی چھوڑنا واجب کہتے ہیں تاکہ گھر والے اور مہمان کھا سکیں؛ شافعیہ ایک دو درخت کا پھل چھوڑتے ہیں؛ مالکیہ اور شافعیہ کا مشہور قول کچھ نہیں چھوڑتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626} جمہور کے نزدیک خرص کے بعد فقراء کا حق پھل سے مالک کے ذمے میں منتقل ہو جاتا ہے، اس لیے وہ تصرف کر سکتا ہے؛ شافعیہ عامل کی ضمانت اور مالک کی قبولیت شرط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} مالک کی بلا کوتاہی پھل ضائع ہو جائے تو جب ادائیگی ممکن نہ تھی تو کچھ لازم نہیں، بلا عذر تاخیر ہوئی تو فقراء کا حصہ دینا ہوگا۔ ضیاع کا دعویٰ بغیر کوتاہی کے ہو تو مالک اور احمد کے نزدیک بلا قسم قبول ہے، شافعیہ خفیہ سبب میں قسم لیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} مالکیہ اور شافعیہ کا راجح قول ہے کہ جب پھل پک جائے اور بیچا جا سکے اور شرکاء کی ضرورتیں مختلف ہوں تو خرص کے ذریعے درخت پر تقسیم جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} بغیر ناپ تول کے اندازے سے بیچنا ⁦(مجازفہ)⁩ باتفاق جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}
  es: "Kharṣ es léxicamente hablando por conjetura, y puede significar una mentira, y la estimación del fruto en palmeras y vides, como dátiles secos o pasas; el sentido técnico concuerda. Adivinar, conjeturar e investigar están cerca de ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} Los malikíes, shafiíes y hanbalíes sostienen que el Imam debe enviar a su agente para estimar el fruto en la palmera y la vid una vez que esté maduro, para que se conozcan el umbral del zakat y la cantidad debida; citan el informe de Attab ibn Asid de que las uvas se estiman como las palmeras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} El momento es cuando el fruto madura, en el informe de Aisha de que Abdullah ibn Rawaha fue enviado a los judíos de Khaybar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} La mayoría de los juristas limitan la estimación a las palmas y vides, no al grano en tallo ni a las aceitunas; una opinión malikí permite las aceitunas cuando los propietarios las necesitan, y al-Zuhri, al-Awza'i y al-Layth estiman las aceitunas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} Los shafiíes prohíben la disposición de la fruta antes de estimarla o garantizarla, ya que los pobres tienen derecho a ella; los hanbalíes permiten la disposición antes y después, recayendo el zakat sobre el vendedor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} Un estimador basta por acuerdo entre quienes lo permiten; una opinión shafií requiere varios; debe ser digno de confianza, justo y conocedor, y para los shafiíes (la opinión más sólida) varón y libre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} El tasador observa los árboles y juzga cuánto se convertirá en dátiles secos o pasas; si hay varios tipos, cada uno se estima por separado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} Los hanbalíes requieren dejar un tercio o un cuarto al propietario para su familia e invitados; los shafiíes dejan el fruto de una o dos palmeras; los malikíes y la opinión shafií preferida no dejan nada, interpretando el informe como sobre el zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626} La mayoría de los juristas sostienen que después de la estimación, el reclamo del pobre pasa del fruto a la responsabilidad del propietario, para que este pueda disponer de él; los shafiíes requieren la garantía del agente y la aceptación del propietario, y una opinión sostiene que el reclamo termina con la estimación sola. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} Si la fruta estimada perece sin negligencia del propietario antes de que se pague el zakat, no se debe nada si no pudo pagar; si se demoró sin excusa, debe la parte del pobre. Si el propietario reclama pérdida sin culpa, su palabra es aceptada sin juramento (Malik, Ahmad); los shafiíes le hacen jurar por una causa oculta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} Los malikíes y la opinión preferida de los shafiíes permiten dividir la fruta en las palmas por estimación una vez que madura y puede venderse, cuando las necesidades de los socios difieren, por la necesidad y la facilidad de estimación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} La venta a ojo, sin medida ni peso, a simple vista y estimación, es lícita por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}"
  fr: "Le terme « kharṣ » signifie littéralement « estimation » et peut désigner un mensonge, ainsi que l'estimation des fruits des palmiers et des vignes, comme des dattes ou des raisins secs; le sens technique est le même. Les notions de supposition, de conjecture et d'enquête sont proches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} Les écoles malikite, chaféite et hanbalite estiment que l'imam doit envoyer son représentant estimer les fruits des palmiers et des vignes une fois mûrs, afin de déterminer le seuil et le montant de la zakat; ils citent le hadith d'Attab ibn Asid selon lequel les raisins sont estimés de la même manière que les palmiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7623} Le moment de l'estimation est celui de la maturation des fruits, d'après le hadith d'Aïcha rapportant qu'Abdullah ibn Rawaha fut envoyé auprès des Juifs de Khaybar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} La plupart des juristes limitent l'estimation aux palmiers et aux vignes, excluant les céréales sur tige ou les olives; une opinion malikite autorise l'estimation des olives lorsque les propriétaires en ont besoin, et al-Zuhri, al-Awza'i et al-Layth l'autorisent également. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7624} Les chaféites interdisent la vente des fruits avant estimation ou garantie, car les pauvres y ont droit; les hanbalites autorisent la vente avant et après estimation, la zakat étant à la charge du vendeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} Un seul estimateur suffit par consensus entre ceux qui l'autorisent; une opinion chaféite en exige plusieurs. Il doit être digne de confiance, juste et instruit, et, pour les Chafiites (l'avis le plus solide), homme et libre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} L'estimateur examine les arbres et évalue la quantité qui deviendra des dattes séchées ou des raisins secs; s'il y a plusieurs variétés, chacune est estimée séparément. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7625} Les Hanbalites exigent de laisser un tiers ou un quart au propriétaire pour sa famille et ses invités; les Chafiites laissent le fruit d'un ou deux palmiers; les Malikites et l'avis chaféite privilégié ne laissent rien, interprétant le rapport comme concernant la zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626} La plupart des juristes estiment qu'après l'estimation, la créance du pauvre passe du fruit à l'obligation du propriétaire, qui peut donc en disposer. Les shafi'ites exigent la garantie de l'agent et l'acceptation du propriétaire, et une opinion considère que la créance s'arrête à la seule estimation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7626}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} Si les fruits estimés pourrissent sans négligence du propriétaire avant le paiement de la zakat, rien n'est dû s'il était dans l'incapacité de payer; s'il a tardé sans excuse, il doit la part du pauvre. Si le propriétaire déclare une perte sans faute, sa parole est acceptée sans serment (Malik, Ahmad); les shafi'ites exigent un serment pour une cause cachée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7627} L'avis malikite et l'avis shafi'ite prédominant autorisent le partage des fruits des palmiers à l'estimation une fois mûrs. Ces fruits peuvent être vendus, lorsque les besoins des partenaires divergent, pour satisfaire aux besoins et par souci de simplicité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} La vente à vue d'œil, sans mesure ni poids, est licite par accord. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}"
  tr: "Al-khars dilsel olarak varsayımdır ve hurma ya da kuru üzüm olsun, palmiye ağaçlarında veya bağlarda ne olduğunu yalan söylemek veya tahmin etmek anlamına gelir. Terimler buna aykırı değildir ve tahmin, sezgi ve araştırma buna yakındır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7623} Malikiler, Şafiiler ve Hanbalilere göre imamın, palmiye ağaçları ve bağların başlarındaki meyveleri olgunlaşmaya başladıktan sonra budaması için elçisini göndermesi, böylece zekatın nisabı ve yükümlülüğü belirlenmelidir. Atab bin Asid'in üzüm hasadı ve palmiye ağaçlarının budama ile ilgili hadisini aktardılar. {cite:fiqh-mawsua-kuwaitiyya-v3 s.7623} Hasat zamanı, meyvenin olgunlaştığı ve olgun göründüğü zamandır. Bunun kanıtı, Abdullah ibn Rawaha'nın Haybar Yahudilerine gönderilmesiyle ilgili Aişe'nin hadisidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7624} Çoğu hukukçu, harsın sadece palmiye ağaçlarında ve bağlarda izin verildiğini, bu yüzden kulaklarında veya zeytinde tahılların budanmadığını savunur. Malikiler, ailelerinin ihtiyacı varsa buna izin verir. Al-Zuhri, Al-Awza'i ve Al-Layth zeytin budadıkları kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7624} Şafi'ler, meyveyi harlardan önce veya dahil etmeden önce elden çıkarmayı yasaklar çünkü yoksulların hakları bunlara bağlıdır. Hanbaliler meyvenin öncesinde ve sonrasında elden çıkarma izni verir, zakat ise satıcıya aittir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7625} Al-khars diyenlerin anlaşmasıyla bir khars yeterlidir. Şafiilere göre, çok eşlilik gerektirir ve kişinin güvenilir, adil ve bilgili olması gerekir. Şafiilere göre daha doğru olanı erkeklik ve özgürlüktür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7625} al-kharların tanımı, kharların ağaçları gördüğü ve onlardan hangi hurma veya kuru üzüm geldiğini tahmin etmeleridir; eğer çok sayıda tür varsa, her türü ayrı ayrı ele alırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7625} Hanbaliler, harilerin zengin sahipleri için genişleme olarak üçte birini veya dörtte birini bırakmasını, Şafiilerin palmiye veya palmiye ağacı meyvesini bırakmasını ve Malikiler ise Şafiilere göre tanınan kişiler hiçbir şey bırakmaz ve hadisi zekat olarak yorumlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7626} Çoğu hukukçu, fakirlerin hakkının kharlardan sonra meyvelerden sahiplerin sorumluluğuna geçtiğine inanır, böylece sahibin bunu elden çıkarabileceğini düşünür. Şafiiler sponsorun dahil edilmesini ve sahibin kabul edilmesini ister; aynı kharalarla bu hakkın sona erdiğini savunurlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7627} Yarık kişi, sürgün edilmeden önce sahibinden ihmal olmadan ölürse, elde edemezse üzerinde hiçbir şey yoktur; mazeretsiz geciktirirse, bu yoksulların payına dahil edilir. Eğer ihmal etmeden zarar talep ederse, Malik ve Ahmed'e göre görüş yemin etmez ve Şafiilere göre gizli sebep için yemin eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7627} Malikilere ve Şafiilere göre tercih edilen olarak, meyveler iyi ise ve satışları caizse ve ortakların ihtiyaçları farklıysa, zorunluluk ve tahmin kolaylığı nedeniyle palmiye ve bağ arasında toprak kapla bölüşdürülmesi caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7628} Riskle satış, ölçü veya ağırlık olmadan sezgi veya tahminle sabır satışı olup, toplu olarak anlaşmayla izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7628}"
  id: "Al-khars adalah dugaan linguistik, dan merujuk pada kebohongan atau menebak apa yang ada di pohon palem atau kebun anggur, baik kurma maupun kismis. Terminologi ini tidak bertentangan dengan hal ini, dan tebak-tebakan, intuisi, serta penyelidikan hampir sama dengan itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7623} Menurut Maliki, Syafi'i, dan Hanbalis disarankan agar Imam mengirim utusannya untuk memangkas buah di kepala pohon palem dan kebun anggur setelah mulai matang, untuk menentukan nisab zakat dan kewajiban di dalamnya. Mereka mengutip hadis Atab ibn Asid mengenai panen anggur serta pemangkasan pohon palem. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7623} Waktu panen adalah saat buah matang dan penampilannya yang matang muncul. Buktinya adalah hadis Aisha tentang pengiriman Abdullah ibn Rawaha kepada orang Yahudi Khaybar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7624} Mayoritas ahli hukum berpendapat bahwa khar hanya diperbolehkan di pohon palem dan kebun anggur, sehingga biji-bijian tidak dipangkas di tongkol atau zaitun. Keluarga Malik mengizinkan jika keluarga mereka membutuhkannya. Al-Zuhri, Al-Awza'i, dan Al-Layth dianggap memangkas zaitun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7624} Syafi melarang membuang buah sebelum khar atau memasukkan karena hak orang miskin bergantung pada mereka. Hanbal mengizinkan membuang buah sebelum dan sesudahnya, dan zakat ada pada penjual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7625} Satu khar sudah cukup dengan persetujuan mereka yang mengucapkan al-khar. Menurut syafi'i, diperlukan poligami, dan orang tersebut harus dapat dipercaya, adil, dan berpengetahuan. Menurut syafi'i, semakin benar maskulinitas dan kebebasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7625} Deskripsi al-khar adalah bahwa khar melihat pohon dan memperkirakan kurma atau kismis yang berasal darinya, dan jika ada banyak jenis, mereka akan membahas setiap jenis secara terpisah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7625} Hanbalis mengharuskan kharis meninggalkan sepertiga atau seperempat sebagai perluasan bagi pemilik kaya, Shafi'i meninggalkan buah pohon palem atau pohon palem, dan Maliki serta yang terkenal menurut Shafi'i tidak meninggalkan apa pun dan menafsirkan hadits sebagai zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7626} Mayoritas ahli hukum percaya bahwa hak orang miskin berpindah setelah khar dari buah ke tanggung jawab pemilik, sehingga ia dapat melepaskannya. Para Shafi'i mengharuskan sponsor dimasukkan dan pemilik menerima, dan mereka berpendapat bahwa hak tersebut berakhir dengan khara yang sama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7627} Jika orang yang terbelah meninggal tanpa kelalaian dari pemilik sebelum dikeluarkan, tidak ada beban atas dirinya jika tidak dapat mendapatkannya; jika dia menunda tanpa alasan, maka dimasukkan dalam bagian orang miskin. Jika dia mengklaim kerugian tanpa kelalaian, pendapat menurut Malik dan Ahmad tanpa sumpah, dan menurut para syafi'i, dia bersumpah tentang penyebab tersembunyi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7627} Menurut Maliki dan menurut Shafi'i diperbolehkan untuk membagi buah di antara pohon palem dan kebun anggur dengan pot tanah liat jika baik dan penjualannya diperbolehkan serta kebutuhan mitra berbeda, karena kebutuhan dan kemudahan menebak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7628} Penjualan dengan risiko, yaitu penjualan kesabaran tanpa ukuran atau bobot melalui intuisi atau tebakan, diizinkan secara massal berdasarkan kesepakatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7628}"
