label:
  ar: "أمير سلاح (كبير حملة السلاح في المملكة المملوكية)"
  en: "Amir silah (grand master of the armour; Mamluk office)"
summary:
  ar: "أمير سلاح، أي كبير حملة السلاح، منصب في المملكة المملوكية، كان متولي حملة السلاح والمشرف على مخزن السلاح، ويحمل سلاح السلطان في المراسم العامة ويوصله إليه في الحرب ومناسبات أخرى؛ وفي العصر الجركسي كان ثاني أكبر الأمراء منزلة {cite:encyclopaedia-of-islam-2 vol. 1 p. 467-468}."
  en: "Amir silah, 'grand master of the armour', was an office of the Mamluk kingdom. He was in charge of the armour-bearers and supervised the arsenal, bearing the sultan's arms in public ceremonies and conveying them to him in battle; under the Circassians he was the second office among the highest amirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 467-468}."
