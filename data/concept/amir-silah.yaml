label:
  ar: "أمير سلاح ⁦(كبير حملة السلاح في المملكة المملوكية)⁩"
  en: "Amir silah (grand master of the armour; Mamluk office)"
  fr: "Amir silah (grand maître de l’armure ; charge mamelouke)"
  es: "Amir silah (gran maestro de la armadura; cargo mameluco)"
  ur: "امیر سلاح ⁦(آرمر کے عظیم ماسٹر؛ مملوک دفتر)⁩"
  tr: "Amir Salah (Memlük Krallığı'nda Baş Arma Taşıyıcısı)"
  id: "Amir Salah (Memlük Krallığı'nda Baş Arma Taşıyıcısı)"
summary:
  ar: "أمير سلاح، أي كبير حملة السلاح، منصب في المملكة المملوكية، كان متولي حملة السلاح والمشرف على مخزن السلاح، ويحمل سلاح السلطان في المراسم العامة ويوصله إليه في الحرب ومناسبات أخرى؛ وفي العصر الجركسي كان ثاني أكبر الأمراء منزلة {cite:encyclopaedia-of-islam-2 vol. 1 p. 467-468}."
  en: "Amir silah, 'grand master of the armour', was an office of the Mamluk kingdom. He was in charge of the armour-bearers and supervised the arsenal, bearing the sultan's arms in public ceremonies and conveying them to him in battle; under the Circassians he was the second office among the highest amirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 467-468}."
  fr: "Amir silah, « grand maître de l’armure », était une charge du royaume mamelouk. Il avait la charge des porteurs d’armes et supervisait l’arsenal, portant les armes du sultan lors des cérémonies publiques et les lui remettant au combat ; sous les Circassiens, c’était la deuxième charge parmi les plus hauts amirs {cite:encyclopaedia-of-islam-2 vol. 1 p. 467-468}."
  es: "Amir silah, «gran maestro de la armadura», era un cargo del reino mameluco. Estaba a cargo de los escuderos y supervisaba el arsenal, portando las armas del sultán en ceremonias públicas y llevándoselas en batalla; bajo los circasianos, era el segundo cargo más importante entre los emires {cite:encyclopaedia-of-islam-2 vol. 1 p. 467-468}."
  ur: "امیر سلاح، 'آرمر کے عظیم ماسٹر'، مملوک سلطنت کا ایک دفتر تھا۔ وہ ہتھیار برداروں کا انچارج تھا اور اسلحہ خانے کی نگرانی کرتا تھا، عوامی تقریبات میں سلطان کے ہتھیار اٹھاتا تھا اور جنگ میں اسے اس تک پہنچاتا تھا۔ سرکیسیئن کے تحت وہ اعلیٰ ترین امیروں میں دوسرا عہدہ تھا {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 467-468}۔"
  tr: "Bir silah emiri, yani baş taşıyıcı, Memlük krallığında bir görevdi; cephaneliğin taşıyıcısı ve denetçisinden sorumluydu; halka açık törenlerde sultanın silahını taşıyıp savaş ve diğer durumlarda ona teslim ederdi; Çerkes döneminde ise ikinci en yüksek prens idi {cite:encyclopaedia-of-Islam-2 cilt 1, s. 467-468}."
  id: "Bir silah emiri, yani baş taşıyıcı, Memlük krallığında bir görevdi; cephaneliğin taşıyıcısı ve denetçisinden sorumluydu; halka açık törenlerde sultanın silahını taşıyıp savaş ve diğer durumlarda ona teslim ederdi; Çerkes döneminde ise ikinci en yüksek prens idi {cite:encyclopaedia-of-Islam-2 cilt 1, s. 467-468}."
