label: { ar: "أسطورة بحيرا الراهب", en: "The Bahira legend" }
summary:
  ar: "أسطورة يزعم بعض المسيحيين أن الراهب بحيرا علّم محمداً العقيدة وأنه هو من ألّف القرآن، ويعرض شكيب أرسلان ما ذكره المستشرق كارا دي فو عنها، وهو أنها موجودة مكتوبة بالعربية، وأنه لم يرَ فيها ما يستحق الاعتبار. ويذكر أن بعض القسس في سورية ما زالوا يعتقدون بها، ويقول إن كارا دي فو ذكر ما قيل عن بحيرا من أنه كان راهباً من أنطاكية. ويكتفي أرسلان بنقل تقدير كارا دي فو دون أن يحكم فيها بنفسه. يعرض هذا وصفاً لجدل قديم، ولا يُعدّ حكماً تاريخياً على الأسطورة."
  en: "The legend that the monk Bahira taught Muhammad his faith and was the real author of the Qur'an. Arslan reports the view of the orientalist Carra de Vaux, who found the legend in Arabic, thought it had no value, and noted that some Roman Catholic priests in Syria still believed it. Arslan mainly reports that scholar's assessment. The entry describes an old argument rather than settling a historical question."
