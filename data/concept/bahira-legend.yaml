id: concept/bahira-legend
class: concept
kind: term
label:
  ar: "أسطورة بحيرا الراهب"
  en: "The Bahira legend"
  fr: "La légende de Bahira"
  es: "La leyenda de Bahira"
  ur: "بحیرہ کا افسانہ"
  tr: "Keşiş Gölü Efsanesi"
  id: "Legenda Danau Biarawan"
summary:
  ar: "أسطورة يزعم بعض المسيحيين أن الراهب بحيرا علّم محمداً العقيدة وأنه هو من ألّف القرآن، ويعرض شكيب أرسلان ما ذكره المستشرق كارا دي فو عنها، وهو أنها موجودة مكتوبة بالعربية، وأنه لم يرَ فيها ما يستحق الاعتبار. ويذكر أن بعض القسس في سورية ما زالوا يعتقدون بها، ويقول إن كارا دي فو ذكر ما قيل عن بحيرا من أنه كان راهباً من أنطاكية. ويكتفي أرسلان بنقل تقدير كارا دي فو دون أن يحكم فيها بنفسه. يعرض هذا وصفاً لجدل قديم، ولا يُعدّ حكماً تاريخياً على الأسطورة."
  en: "The legend that the monk Bahira taught Muhammad his faith and was the real author of the Qur'an. Arslan reports the view of the orientalist Carra de Vaux, who found the legend in Arabic, thought it had no value, and noted that some Roman Catholic priests in Syria still believed it. Arslan mainly reports that scholar's assessment. The entry describes an old argument rather than settling a historical question."
  fr: "Légende selon laquelle le moine Bahira aurait enseigné sa foi à Muhammad et serait le véritable auteur du Coran. Arslan rapporte l’avis de l’orientaliste Carra de Vaux, qui trouva la légende en arabe, ne lui reconnut aucune valeur et observa que certains prêtres catholiques romains de Syrie y croyaient encore. Arslan transmet surtout l’évaluation de ce savant. La notice décrit un débat ancien sans trancher une question historique."
  es: "La leyenda afirma que el monje Bahira enseñó la fe de Mahoma y fue el verdadero autor del Corán. Arslan recoge la opinión del orientalista Carra de Vaux, quien, tras encontrar la leyenda en árabe, la consideró carente de valor y señaló que algunos sacerdotes católicos en Siria aún la creían. Arslan se centra principalmente en la valoración de este erudito. La entrada describe una antigua controversia más que una cuestión histórica."
  ur: "وہ افسانہ کہ راہب بحیرہ نے محمد کو اپنا ایمان سکھایا اور وہ قرآن کے حقیقی مصنف تھے۔ ارسلان مستشرق کارا ڈی ووکس کے نقطہ نظر کی رپورٹ کرتا ہے، جس نے یہ افسانہ عربی میں پایا، سوچا کہ اس کی کوئی قیمت نہیں ہے، اور کہا کہ شام میں کچھ رومن کیتھولک پادری اب بھی اس پر یقین رکھتے ہیں۔ ارسلان بنیادی طور پر اس عالم کی تشخیص کی اطلاع دیتا ہے۔ اندراج ایک تاریخی سوال کو حل کرنے کے بجائے ایک پرانی دلیل کو بیان کرتا ہے۔"
  tr: "Efsane Bazı Hristiyanlar, keşiş Bahir'in Muhammed'e öğrettiğini ve Kur'an'ı onun yazdığını iddia eder. Shakib Arslan, Oryantalist Kara de Fo'nun Arapça yazılı olduğunu ve içinde dikkate değer bir şey görmediğini belirtir. Suriye'deki bazı rahiplerin hâlâ Kur'ana inandığını belirtir ve Kara de Fo'nun Bahira hakkında söylenenleri Antakyalı bir keşiş olarak belirttiğini belirtir. Arslan, sadece Kara de Fu'nun değerlendirmesini iletir, kendisi yargılamaz. Bu, eski bir tartışmanın tanımını sunar ve efsane hakkında tarihsel bir yargı olarak kabul edilmez."
  id: "Legenda Beberapa orang Kristen mengklaim bahwa biksu Bahir mengajarkan ajaran ini kepada Muhammad dan bahwa ia adalah penulis Al-Qur'an. Shakib Arslan menyajikan apa yang disebutkan oleh orientalis Kara de Fo, yaitu bahwa ajaran itu ada dalam bahasa Arab dan ia tidak melihat sesuatu yang layak dipertimbangkan di dalamnya. Ia menyebutkan bahwa beberapa pendeta di Suriah masih mempercayainya, dan mengatakan bahwa Kara de Fo menyebutkan apa yang dikatakan tentang Bahira bahwa ia adalah seorang biksu dari Antiokhia. Arslan hanya menyampaikan penilaian Kara de Fu tanpa menghakiminya sendiri. Ini menggambarkan sebuah kontroversi lama dan tidak dianggap sebagai penilaian sejarah atas legenda tersebut."
