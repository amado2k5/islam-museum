label: { ar: "النُّزُول", en: "Descent and dismounting (nuzul)", ur: "نزول ⁦(اترنا)⁩", es: "Descenso y desmontaje (nuzul)", fr: "Descente et débarquement (nuzul)", tr: "soy", id: "keturunan" }
summary:
  ar: "النزول في اللغة الهبوط من علو إلى سفل، وفي الفقه أحكام عدة: فيما يفعله خطيب الجمعة بعد فراغه من الخطبة، فعند الحنفية يقيم المؤذن للصلاة بعد نزوله، وعند المالكية يستغفر ثم ينزل فيصلي، وعند الشافعية يأخذ في النزول مع فراغ المؤذن من الإقامة، وعند الحنابلة ينزل عند قول المؤذن قد قامت الصلاة. ونزول وفد الكفار في المسجد جائز عند الحنابلة للحاجة، ولا يلزم الراكب النزول لسجود التلاوة عند الجمهور بل يومئ، ويجيز الشافعية والحنابلة نزول الخطيب لسجدة التلاوة، وأوجبه الحنفية، ولم يره المالكية. وتعمد إنزال المني بشهوة يبطل الصوم عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
  en: "Nuzul, in the lexicon, is descent from a height to a lower place. In law there are several rulings. On what the preacher does after finishing his sermon on Friday: the Hanafis have the caller give the call to prayer after he descends; the Malikis have him ask forgiveness and then descend to pray; the Shafi'is have him begin to descend as the caller finishes the second call; and the Hanbalis have him descend when the caller says that the prayer has begun. The descent of a delegation of unbelievers into a mosque is allowed by the Hanbalis for need. Most jurists do not require a rider to dismount for the prostration of recitation, but gesture instead; the Shafi'is and Hanbalis allow the preacher to descend for it, the Hanafis make it obligatory, and the Malikis do not prostrate. Deliberate emission of semen by desire invalidates the fast according to most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
  ur: "نزول کا مطلب بلندی سے پستی کی طرف اترنا ہے۔ جمعہ کے خطیب کا خطبہ کے بعد نیچے اترنا فقہاء کے ہاں مختلف طریقوں پر ہے۔ جمہور کے نزدیک سواری سے اتر کر سجدہ تلاوت کرنا لازم نہیں بلکہ اشارے سے کافی ہے۔ عمداً انزالِ منی روزہ کو باطل کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
  es: "Nuzul, en el léxico, significa descenso desde una altura a un lugar más bajo. En derecho existen varias normas. Sobre lo que debe hacer el predicador después de terminar su sermón del viernes: los hanafíes hacen que el que llama a la oración lo haga después de que él descienda; los malikíes hacen que pida perdón y luego descienda a orar; los shafiíes hacen que comience a descender cuando el que llama termina la segunda llamada; y los hanbalíes hacen que descienda cuando el que llama dice que la oración ha comenzado. Los hanbalíes permiten el descenso de una delegación de no creyentes a una mezquita por necesidad. La mayoría de los juristas no exigen que el jinete desmonte para la postración de la recitación, sino que gesticula en su lugar; los shafiíes y los hanbalíes permiten que el predicador descienda para ello, los hanafíes lo hacen obligatorio y los malikíes no se postran. La emisión deliberada de semen por deseo invalida el ayuno según la mayoría de los juristas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
  fr: "Nuzul, dans le lexique, désigne la descente d'un lieu élevé vers un lieu plus bas. En droit islamique, plusieurs règles existent à ce sujet. Concernant les actions du prédicateur après son sermon du vendredi: les hanafites exigent qu'il lance l'appel à la prière après sa descente; les malikites exigent qu'il demande pardon avant de descendre pour prier; les chaféites exigent qu'il commence à descendre lorsque le prédicateur termine le second appel; et les hanbalites exigent qu'il descende lorsque le prédicateur annonce le début de la prière. La descente d'une délégation de non-croyants dans une mosquée est autorisée par les hanbalites en cas de nécessité. La plupart des juristes n'exigent pas que le cavalier descende de cheval pour la prosternation lors de la récitation du Coran, mais un geste suffit; les chaféites et les hanbalites autorisent le prédicateur à descendre, les hanafites rendent cette prosternation obligatoire, et les malikites ne l'exigent pas. L'éjaculation volontaire, motivée par le désir, invalide le jeûne selon la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
  tr: "Dilbilimde 'nazul' bir yükseklikten diğerine inmek anlamına gelir. Fıkıhta ise birkaç hüküm vardır: Cuma vaizi vaazı bitirdikten sonra ne yapar. Hanefilere göre, müezzin namazı indikten sonra yönetir; Malikilere göre af diler ve sonra namaz kılmak için iner; Şafiilere göre, müezzin ikama bittikten sonra inmeye devam eder; hanbalilere göre, müezzin namaz kurulduğunda iner. Hanelilere göre zorunluluktan dolayı kafirlerin camide inmesi izinlidir ve binicinin cemaat önünde secde etmek zorunda değildir; bunun yerine zorunludur. Hanefiler, Maliki mezhebi bunu zorunlu kılmadığı için onu namaz için indirmeye zorlar. Çoğu hukukçuya göre kasıtlı olarak meniyi arzuyla indirmek, orucu geçersiz kılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15649}"
  id: "Dalam linguistik, 'nazul' berarti turun dari satu ketinggian ke ketinggian lain. Dalam firitur, ada beberapa keputusan: Apa yang dilakukan pengkhotbah Jumat setelah menyelesaikan khotbah. Menurut Hanafi, muezzin memimpin shalat setelah ia turun; menurut Maliki, ia mencari pengampunan lalu turun untuk berdoa; menurut Shafi'i, ia terus turun setelah muezzin menyelesaikan iqama; menurut Hanbali, ia turun ketika muezzin mengatakan doa telah ditetapkan. Perbedaan pendapat para kafir di masjid diperbolehkan menurut Hanbalis karena kebutuhan, dan penunggang tidak diwajibkan turun untuk sujud membaca di hadapan jemaat; melainkan, ia wajib. Hanafi mewajibkannya turun untuk berdoa, yang tidak diwajibkan oleh mazhab Maliki. Menurunkan sperma dengan keinginan secara sengaja membatalkan puasa menurut mayoritas ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
