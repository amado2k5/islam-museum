label: { ar: "النُّزُول", en: "Descent and dismounting (nuzul)", ur: "نزول (اترنا)" }
summary:
  ar: "النزول في اللغة الهبوط من علو إلى سفل، وفي الفقه أحكام عدة: فيما يفعله خطيب الجمعة بعد فراغه من الخطبة، فعند الحنفية يقيم المؤذن للصلاة بعد نزوله، وعند المالكية يستغفر ثم ينزل فيصلي، وعند الشافعية يأخذ في النزول مع فراغ المؤذن من الإقامة، وعند الحنابلة ينزل عند قول المؤذن قد قامت الصلاة. ونزول وفد الكفار في المسجد جائز عند الحنابلة للحاجة، ولا يلزم الراكب النزول لسجود التلاوة عند الجمهور بل يومئ، ويجيز الشافعية والحنابلة نزول الخطيب لسجدة التلاوة، وأوجبه الحنفية، ولم يره المالكية. وتعمد إنزال المني بشهوة يبطل الصوم عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
  en: "Nuzul, in the lexicon, is descent from a height to a lower place. In law there are several rulings. On what the preacher does after finishing his sermon on Friday: the Hanafis have the caller give the call to prayer after he descends; the Malikis have him ask forgiveness and then descend to pray; the Shafi'is have him begin to descend as the caller finishes the second call; and the Hanbalis have him descend when the caller says that the prayer has begun. The descent of a delegation of unbelievers into a mosque is allowed by the Hanbalis for need. Most jurists do not require a rider to dismount for the prostration of recitation, but gesture instead; the Shafi'is and Hanbalis allow the preacher to descend for it, the Hanafis make it obligatory, and the Malikis do not prostrate. Deliberate emission of semen by desire invalidates the fast according to most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
  ur: "نزول کا مطلب بلندی سے پستی کی طرف اترنا ہے۔ جمعہ کے خطیب کا خطبہ کے بعد نیچے اترنا فقہاء کے ہاں مختلف طریقوں پر ہے۔ جمہور کے نزدیک سواری سے اتر کر سجدہ تلاوت کرنا لازم نہیں بلکہ اشارے سے کافی ہے۔ عمداً انزالِ منی روزہ کو باطل کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
