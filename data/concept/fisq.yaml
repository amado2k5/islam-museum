id: concept/fisq
class: concept
kind: doctrine
label:
  ar: الفسق (الخروج عن منهج الله)
  en: Fisq (going out of God's law)
summary:
  ar: "يرى الشعراوي أن أصل الفسق في اللغة خروج الرطب من قشرته، وأنه انتقل إلى الدين وصفاً لمن يخرج عن منهج الله، فيقال فسق في الجزئية وفسق في القمة. ويميز الفسق الذي يصيب العاصي الذي يؤمن بالمنهج ويخالف في جزئية، من الفسق الذي يعني التولي عن ركب الإيمان كله بعد أخذ العهد والشهادة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1578}."
  en: "Sha'rawi holds that fisq originally means the date leaving its skin, and that the religion took the word as a description of one who goes out of God's law. He distinguishes a partial fisq, that of a disobedient believer who fails in one part of the law, from the greatest fisq, which is turning from the whole community of faith after the covenant and the testimony {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1578}."
