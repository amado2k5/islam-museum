id: concept/fisq
class: concept
kind: doctrine
label:
  ar: الفسق ⁦(الخروج عن منهج الله)⁩
  en: Fisq (going out of God's law)
  es: "Fisq (salirse de la ley de Dios)"
  fr: "Fisq (sortir de la loi de Dieu)"
  ur: "فسق ⁦(خدا کے قانون سے باہر جانا)⁩"
summary:
  ar: "يرى الشعراوي أن أصل الفسق في اللغة خروج الرطب من قشرته، وأنه انتقل إلى الدين وصفاً لمن يخرج عن منهج الله، فيقال فسق في الجزئية وفسق في القمة. ويميز الفسق الذي يصيب العاصي الذي يؤمن بالمنهج ويخالف في جزئية، من الفسق الذي يعني التولي عن ركب الإيمان كله بعد أخذ العهد والشهادة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1578}."
  en: "Sha'rawi holds that fisq originally means the date leaving its skin, and that the religion took the word as a description of one who goes out of God's law. He distinguishes a partial fisq, that of a disobedient believer who fails in one part of the law, from the greatest fisq, which is turning from the whole community of faith after the covenant and the testimony {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1578}."
  es: "Sha'rawi sostiene que fisq originalmente significa el dátil que se desprende de su cáscara, y que la religión adoptó la palabra para describir a aquel que se aparta de la ley de Dios. Distingue un fisq parcial, el de un creyente desobediente que falla en una parte de la ley, del fisq mayor, que es apartarse de toda la comunidad de fe después del pacto y el testimonio {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1577}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1578}."
  fr: "Sha'rawi soutient que le terme « fisq » signifie à l'origine « la datte qui sort de sa peau » et que la religion a adopté ce mot pour décrire celui qui s'écarte de la loi divine. Il distingue le « fisq » partiel, celui du croyant désobéissant qui manque à un seul précepte de la loi, du « fisq » suprême, qui consiste à se détourner de toute la communauté de foi après l'alliance et le témoignage."
  ur: "شعراوی کا خیال ہے کہ فسق کا اصل معنی ہے وہ تاریخ جو اس کی جلد کو چھوڑ دیتی ہے، اور مذہب نے اس لفظ کو اس کی وضاحت کے طور پر لیا ہے جو خدا کے قانون سے باہر ہے۔ وہ جزوی فسق کو ممتاز کرتا ہے، وہ نافرمان مومن جو قانون کے ایک حصے میں ناکام رہتا ہے، سب سے بڑے فسق سے، جو عہد اور گواہی کے بعد ایمان کی پوری جماعت سے پھر رہا ہے۔ صفحہ 1577 {حوالہ: تفسیر شعراوی خواطر اسکین جلد 2 صفحہ 1578}۔"
