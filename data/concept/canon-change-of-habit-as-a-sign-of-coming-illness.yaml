label: { ar: "تغير العادة علامة على مرض قادم", en: "Change of habit as a sign of coming illness in the Canon", ur: "عادت کی تبدیلی آنے والی بیماری کی علامت قانون میں" }
summary:
  ar: "يضع ابن سينا قاعدة عامة: كل شيء تغير عن عادته في شهوة أو براز أو بول أو شهوة جماع أو نوم أو عرق أو جفاف بدن أو حدة ذهن أو طعم أو عادة احتلام، فصار أقل أو أكثر أو تغيرت كيفيته، أنذر بمرض، ولا تترك العادة الرديئة جداً دفعة بل بتدريج لأن العادة كالطبيعة {cite:canon-ibn-sina-print-v1 p.260}."
  en: "Ibn Sina lays down a general rule: anything that changes from its habit, in appetite, stool, urine, desire for intercourse, sleep, sweat, dryness of the body, keenness of mind, taste, or habit of nocturnal emission, becoming less or more or altered in quality, warns of disease; and a very bad habit is not dropped at once but by degrees because habit is like nature {cite:canon-ibn-sina-print-v1 p.260}."
