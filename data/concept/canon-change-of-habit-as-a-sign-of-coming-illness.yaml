id: concept/canon-change-of-habit-as-a-sign-of-coming-illness
class: concept
kind: scientific
label:
  ar: "تغير العادة علامة على مرض قادم"
  en: "Change of habit as a sign of coming illness in the Canon"
  fr: "Changement d’habitude et maladie à venir dans le Canon"
  ur: "عادت کی تبدیلی آنے والی بیماری کی علامت قانون میں"
  es: "El cambio de hábitos como señal de enfermedad inminente en el Canon"
summary:
  ar: "يضع ابن سينا قاعدة عامة: كل شيء تغير عن عادته في شهوة أو براز أو بول أو شهوة جماع أو نوم أو عرق أو جفاف بدن أو حدة ذهن أو طعم أو عادة احتلام، فصار أقل أو أكثر أو تغيرت كيفيته، أنذر بمرض، ولا تترك العادة الرديئة جداً دفعة بل بتدريج لأن العادة كالطبيعة {cite:canon-ibn-sina-print-v1 p.260}."
  en: "Ibn Sina lays down a general rule: anything that changes from its habit, in appetite, stool, urine, desire for intercourse, sleep, sweat, dryness of the body, keenness of mind, taste, or habit of nocturnal emission, becoming less or more or altered in quality, warns of disease; and a very bad habit is not dropped at once but by degrees because habit is like nature {cite:canon-ibn-sina-print-v1 p.260}."
  fr: "Pour Ibn Sina, tout changement quantitatif ou qualitatif d’appétit, selles, urine, désir sexuel, sommeil, sueur, sécheresse corporelle, vivacité d’esprit, goût ou émissions nocturnes annonce la maladie. Une très mauvaise habitude se quitte progressivement, car elle est semblable à une nature {cite:canon-ibn-sina-print-v1 p.260}."
  es: "Ibn Sina establece una regla general: cualquier cosa que cambie de su hábito, en el apetito, las heces, la orina, el deseo sexual, el sueño, el sudor, la sequedad del cuerpo, la agudeza mental, el gusto o el hábito de la eyaculación nocturna, que disminuya o aumente o se altere en su calidad, advierte de una enfermedad; y un hábito muy malo no se abandona de inmediato, sino gradualmente, porque el hábito es como la naturaleza {cite:canon-ibn-sina-print-v1 p.260}."
