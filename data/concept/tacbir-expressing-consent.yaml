id: concept/tacbir-expressing-consent
class: concept
kind: legal
label:
  ar: "التعبير"
  en: "Tacbir (expressing one's will: speech, deed, writing, gesture, silence)"
  ur: "تعبیر ⁦(ارادے کا اظہار: قول، فعل، تحریر، اشارہ اور خاموشی)⁩"
  es: "Tácbir (expresar la voluntad de uno: palabra, obra, escrito, gesto, silencio)"
  fr: "Tacbir (exprimer sa volonté: parole, acte, écrit, geste, silence)"
summary:
  ar: "التعبير في اللغة التبيين، والتعبير عن الإرادة الأصل فيه القول، لأن الرضا قلبي خفي، فناط الحكم بالقول الظاهر، ولهذا كانت الصيغة ركناً في العقود. ويكون بالفعل في المعاطاة وهو موضع خلاف، وبالكتابة فينعقد بها العقد ويقع بها الطلاق المستبين، وبالإشارة للأخرس باتفاق، وبالسكوت للبكر البالغة رضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5382}"
  en: "Tacbir is expression; the root of expressing will is speech, since consent is hidden in the heart, so the law attaches to the visible word, and the formula is a pillar of contracts. It may be by deed, as in exchange where the majority accept it and the Shafiis largely do not; by writing, which concludes contracts and makes a divorce when legible; by gesture for the dumb by agreement; and by silence for a grown virgin's consent, on the hadith «her consent is her silence». Laughter and weeping count with their signs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5382}"
  es: "Tacbir es expresión; la raíz de la expresión de la voluntad es el habla, puesto que el consentimiento reside en el corazón, por lo que la ley se adhiere a la palabra visible, y la fórmula es un pilar de los contratos. Puede manifestarse mediante escritura, como en el intercambio, donde la mayoría lo acepta y los shafiíes en gran medida lo rechazan; por escrito, que concluye los contratos y formaliza el divorcio cuando es legible; mediante gestos para los mudos, por acuerdo; y por silencio para el consentimiento de una virgen adulta, según el hadiz «su consentimiento es su silencio». La risa y el llanto cuentan con sus signos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5378} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5379} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5380} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5381} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5382}"
  fr: "Le tacbir est l'expression; l'expression de la volonté trouve son origine dans la parole, car le consentement réside dans le cœur. La loi s'attache donc à la parole visible, et la formule est un pilier des contrats. Ce consentement peut être donné par un acte, comme dans un échange où la majorité l'accepte, contrairement à la plupart des chaféites; par écrit, qui conclut les contrats et prononce le divorce lorsqu'il est lisible; par geste pour le muet, par accord; et par le silence pour le consentement d'une jeune fille vierge, selon le hadith « son consentement est son silence ». Le rire et les larmes comptent comme autant de signes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5382}"
  ur: "تکبیر اظہار ہے۔ مرضی کے اظہار کی جڑ تقریر ہے، چونکہ رضامندی دل میں پوشیدہ ہوتی ہے، لہٰذا قانون ظاہر لفظ سے منسلک ہوتا ہے، اور فارمولہ معاہدوں کا ایک ستون ہے۔ یہ عمل سے ہو سکتا ہے، جیسا کہ اس کے بدلے میں جہاں اکثریت اسے قبول کرتی ہے اور شافعی زیادہ تر قبول نہیں کرتے۔ تحریری طور پر، جو معاہدوں کو ختم کرتا ہے اور جائز ہونے پر طلاق دیتا ہے؛ معاہدے کے ذریعے گونگے کے لیے اشارے سے؛ اور ایک بالغ کنواری کی رضامندی کے لیے خاموشی سے، حدیث میں ہے \"اس کی رضامندی اس کی خاموشی ہے\"۔ ہنسنا اور رونا ان کی نشانیوں میں شمار ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5378} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5379} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5380} صفحہ 5381} {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 5382}"
