id: concept/tacbir-expressing-consent
class: concept
kind: legal
label:
  ar: "التعبير"
  en: "Tacbir (expressing one's will: speech, deed, writing, gesture, silence)"
  ur: "تعبیر (ارادے کا اظہار: قول، فعل، تحریر، اشارہ اور خاموشی)"
summary:
  ar: "التعبير في اللغة التبيين، والتعبير عن الإرادة الأصل فيه القول، لأن الرضا قلبي خفي، فناط الحكم بالقول الظاهر، ولهذا كانت الصيغة ركناً في العقود. ويكون بالفعل في المعاطاة وهو موضع خلاف، وبالكتابة فينعقد بها العقد ويقع بها الطلاق المستبين، وبالإشارة للأخرس باتفاق، وبالسكوت للبكر البالغة رضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5382}"
  en: "Tacbir is expression; the root of expressing will is speech, since consent is hidden in the heart, so the law attaches to the visible word, and the formula is a pillar of contracts. It may be by deed, as in exchange where the majority accept it and the Shafiis largely do not; by writing, which concludes contracts and makes a divorce when legible; by gesture for the dumb by agreement; and by silence for a grown virgin's consent, on the hadith «her consent is her silence». Laughter and weeping count with their signs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5382}"
