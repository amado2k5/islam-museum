label:
  ar: "قرة العين"
  en: "Qurrat al-ayn (water-cress, as the book says)"
  ur: "قرۃ العین"
  es: "Qurrat al-ayn (berro, como dice el libro)"
  fr: "Qurrat al-ayn (cresson d'eau, comme le dit le livre)"
  tr: "Göz nuru"
  id: "Buah mata"
summary:
  ar: "قرة العين في الكتاب هو جرجير الماء ويقال له أيضا كرفس الماء، عطر الرائحة ينبت في المياه الراكدة، مسخن محلل، ويفتت الحصاة في الكلى وينفع من قروح الأمعاء، ويذكر الكتاب أنه يدر الطمث {cite:canon-ibn-sina-print-v1 pp.655-656}"
  en: "Qurrat al-ayn is in the book water-cress, also called water celery, of a fragrant smell and growing in still waters; it is heating and dissolving, breaks the stone in the kidneys and benefits ulcers of the intestines; the book lists that it brings on the menses {cite:canon-ibn-sina-print-v1 pp.655-656}"
  ur: "قرۃ العین کتاب میں جرجیر الماء ہے جسے کرفس الماء بھی کہا جاتا ہے، خوشبودار اور ٹھہرے پانیوں میں اگنے والا؛ گرم کرنے والا اور گھلانے والا ہے، گردے کی پتھری توڑتا اور آنتوں کے قرحوں میں نافع ہے؛ کتاب میں درج ہے کہ یہ حیض جاری کرتا ہے {cite:canon-ibn-sina-print-v1 pp.655-656}۔"
  es: "Qurrat al-ayn es en el libro el berro, también llamado apio de agua, de olor fragante y que crece en aguas tranquilas; es caliente y disolvente, disuelve los cálculos renales y beneficia las úlceras intestinales; el libro menciona que provoca la menstruación {cite:canon-ibn-sina-print-v1 pp.655-656}"
  fr: "Le cresson d'eau (Qurrat al-ayn) est mentionné dans le livre comme étant une plante odorante qui pousse dans les eaux calmes; il est réchauffant et dissolvant, dissout les calculs rénaux et soulage les ulcères intestinaux; le livre indique qu'il provoque les menstruations {cite:canon-ibn-sina-print-v1 pp.655-656}"
  tr: "Kitaptaki göz ucu su rokasıdır, aynı zamanda su kerevizi olarak da adlandırılır. Kokusu durgun suda büyür, çözünmüş bir ısıtıcıdır, böbrek taşlarını kırar ve bağırsak ülserleri için faydalıdır. Kitapta adet başlattığı belirtilir {cite:canon-ibn-sina-print-v1 s.655-656}"
  id: "Buah mata dalam buku ini adalah arugula air, juga disebut seledri air. Aromanya tumbuh dalam air tergenang, merupakan pemanas larut, memecah batu ginjal, dan bermanfaat untuk tukak lambung usus. Buku tersebut menyebutkan bahwa ini memicu menstruasi {cite:canon-ibn-sina-print-v1 hlm.655-656}"
