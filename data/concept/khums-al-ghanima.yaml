id: concept/khums-al-ghanima
education:
  did_you_know:
    ar: "يجمع السجل سؤالاً تفسيرياً: هل آية الأنفال الأولى «يسألونك عن الأنفال» منسوخة بآية الخمس أم محكمة قائمة بذاتها؟"
    en: "The record gathers an exegetical question: is the first verse of al-Anfal — 'they ask you about the spoils' — abrogated by the verse of the fifth, or does it stand in its own right?"
    ur: "رکارڈ ایک تفسیری سوال جمع کرتا ہے: کیا سورۃ انفال کی پہلی آیت «تم سے غنیمت کے بارے میں پوچھتے ہیں» خمس والی آیت سے منسوخ ہے یا اپنے مقام پر قائم ہے؟"
    sources: [source/tafsir-ibn-kathir, source/sahih-al-bukhari]
class: concept
kind: legal
label: { ar: "خمس الغنيمة", en: "The fifth of spoils (khums)" }
issue:
  ar: "هل آية الأنفال الأولى، «يسألونك عن الأنفال»، منسوخة بآية الخمس أم محكمة؟"
summary:
  ar: "يبيّن رضا أن مفسرين نقلوا عن مجاهد وعكرمة والسدي أن آية الأنفال الأولى منسوخة بآية الخمس، وأن الصواب عنده قول ابن زيد أن الآية محكمة، وأن الله بيّن مصارف الغنيمة في آية الخمس، وأن للإمام أن ينفِّل من شاء قبل التخميس."
  en: "Rida reports that Mujahid, Ikrima and al-Suddi held that the first Anfal verse is abrogated by the verse of the fifth, and prefers the view of Ibn Zayd that the verse is muhkam (not abrogated): the fifth verse gives its destinations, and the imam may grant a share to whom he wills before the division into fifths."
