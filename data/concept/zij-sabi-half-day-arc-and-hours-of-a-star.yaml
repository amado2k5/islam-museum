class: concept
kind: scientific
label: { ar: "نصف قوس نهار الكوكب وأزمان ساعاته", en: "The half day arc of a star and the times of its hours", ur: "ستارے کی نصف قوسِ نہار اور اس کے ساعات کے ازمان", es: "El arco de medio día de una estrella y los tiempos de sus horas", fr: "L'arc d'une étoile en demi-journée et les heures de ses heures" }
summary:
  ar: "إذا عُرف الاختلاف زِيد على تسعين درجة إن كان بعد الكوكب عن معدل النهار شمالياً، ونُقص من تسعين إن كان جنوبياً، والناتج نصف قوس نهار الكوكب. وسدس هذا النصف هو أزمان ساعاته فوق الأرض. {cite:zij-sabi-nallino-byblion p.53}."
  en: "Once the difference is known it is added to ninety degrees if the star's distance from the equator is northern and taken from ninety if it is southern; the result is half the star's day arc. One sixth of that half is the times of its hours above the earth. {cite:zij-sabi-nallino-byblion p.53}."
  ur: "اختلاف معلوم ہو جائے تو اگر ستارے کا معدل النہار سے بعد شمالی ہو تو اسے نوے درجے میں جمع کیا جاتا ہے اور جنوبی ہو تو نوے میں سے گھٹایا جاتا ہے؛ حاصل ستارے کی نصف قوسِ نہار ہے۔ اس نصف کا چھٹا حصہ زمین کے اوپر اس کے ساعات کے ازمان ہیں۔ {cite:zij-sabi-nallino-byblion p.53}۔"
  es: "Una vez conocida la diferencia, se le suman noventa grados si la distancia de la estrella al ecuador es norte y se le restan noventa si es sur; el resultado es la mitad del arco diurno de la estrella. Una sexta parte de esa mitad corresponde a las horas que permanece visible sobre la Tierra. {cite:zij-sabi-nallino-byblion p.53}."
  fr: "Une fois la différence connue, on l'ajoute à 90 degrés si l'étoile est située au nord de l'équateur, et on la soustrait à 90 degrés si elle est située au sud; le résultat correspond à la moitié de l'arc diurne de l'étoile. Un sixième de cette moitié représente la durée de son passage au-dessus de la Terre. {cite:zij-sabi-nallino-byblion p.53}."
