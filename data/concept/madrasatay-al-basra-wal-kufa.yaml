id: concept/madrasatay-al-basra-wal-kufa
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "مدرستا البصرة والكوفة في الشواهد والسماع والقياس"
  en: "The schools of Basra and Kufa on witnesses, transmission and analogy"
  ur: "بصرہ اور کوفہ کے مدارس: شواہد، سماع اور قیاس"
  fr: "Les écoles de Basra et de Kufa : témoins, transmission et analogie"
  es: "Las escuelas de Basora y Kufa: testimonios, transmisión y analogía"
  tr: "Basra ve Kufa Okulları Delil, Duruşma ve Benzerlikte"
  id: "Sekolah Basra dan Kufa dalam Bukti, Pendengaran, dan Analogi"
summary:
  ar: "جدول المقارنة بين المدرستين كما ينقله ملخص بحثي قُدّم إلى المتحف: أعلام كل مدرسة، وتقديم البصريين القياس والتعليل وتضييقهم الشواهد، وتقديم الكوفيين السماع وتوسيعهم الشواهد والقراءات، ومئة وواحد وعشرون مسألة خلاف جمعها ابن الأنباري {cite:pageplace-baalbaki-early-islamic-grammatical-tradition-preview} {cite:al-kindi-publisher-ijllt-nahwu-kufah-2023} {cite:qaf-min-tarikh-al-nahw-al-arabi}."
  en: "The comparison of the two schools as a research summary supplied to the museum gives it: the figures of each, the Basrans' preference for analogy and causal reasoning and their narrow limits on witnesses, the Kufans' preference for transmission and their wider range of witnesses and readings, and the 121 points of dispute Ibn al-Anbari gathered {cite:pageplace-baalbaki-early-islamic-grammatical-tradition-preview} {cite:al-kindi-publisher-ijllt-nahwu-kufah-2023} {cite:qaf-min-tarikh-al-nahw-al-arabi}."
  ur: "دونوں مدارس کا موازنہ جیسا میوزیم کو دیا گیا تحقیقی خلاصہ نقل کرتا ہے: ہر مدرسے کے اعلام، بصریوں کا قیاس اور تعلیل کو مقدم رکھنا اور شواہد کو محدود کرنا، کوفیوں کا سماع کو مقدم رکھنا اور شواہد و قراءات کو وسیع کرنا، اور ابن الانباری کے جمع کیے ہوئے 121 اختلافی مسائل {cite:pageplace-baalbaki-early-islamic-grammatical-tradition-preview} {cite:al-kindi-publisher-ijllt-nahwu-kufah-2023} {cite:qaf-min-tarikh-al-nahw-al-arabi}۔"
  fr: "La comparaison des deux écoles telle que la donne une synthèse de recherche remise au musée : les figures de chacune, la préférence des Basriens pour l'analogie et le raisonnement causal et leurs limites étroites sur les témoins, celle des Kufiens pour la transmission et leur éventail plus large de témoins et de lectures, et les 121 points de désaccord réunis par Ibn al-Anbari {cite:pageplace-baalbaki-early-islamic-grammatical-tradition-preview} {cite:al-kindi-publisher-ijllt-nahwu-kufah-2023} {cite:qaf-min-tarikh-al-nahw-al-arabi}."
  es: "La comparación de las dos escuelas tal como la da un resumen de investigación entregado al museo: las figuras de cada una, la preferencia de los basrenses por la analogía y el razonamiento causal y sus límites estrechos sobre los testimonios, la de los kufíes por la transmisión y su abanico más amplio de testimonios y lecturas, y los 121 puntos de disputa reunidos por Ibn al-Anbari {cite:pageplace-baalbaki-early-islamic-grammatical-tradition-preview} {cite:al-kindi-publisher-ijllt-nahwu-kufah-2023} {cite:qaf-min-tarikh-al-nahw-al-arabi}."
  tr: "Müzeye sunulan bir araştırma özetiyle iki okul arasındaki karşılaştırma tablosu: her okulun önemli isimleri, Basran alimleri benzetme ve mantık sunarak kanıtları daralttı, Kufiler duruşmayı sundu ve kanıt ile okumaları genişletti, ayrıca İbn el-Anbari tarafından toplanan yüz yirmi bir tartışmalı sayı {cite:pageplace-baalbaki-early-Islamic-gramatical-tradition-preview} {cite:al-kindi-publisher-ijllt-nahwu-kufah-2023} {cite:qaf-min-tarikh-al-nahw-al-arabi}"
  id: "Tabel perbandingan antara kedua aliran tersebut disampaikan oleh ringkasan penelitian yang diajukan ke museum: tokoh-tokoh penting dari masing-masing aliran, para sarjana Basran menyajikan analogi dan penalaran serta mempersempit bukti, para Kufi menyajikan sidang dan memperluas bukti serta pembacaan, serta seratus dua puluh satu isu yang diperdebatkan yang dikumpulkan oleh Ibn al-Anbari {cite:pageplace-baalbaki-early-Islamic-grammatical-tradition-preview} {cite:al-kindi-publisher-ijllt-nahwu-kufah-2023} {cite:qaf-min-tarikh-al-nahw-al-arabi}."
