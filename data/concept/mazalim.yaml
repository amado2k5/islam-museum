summary:
  ar: "المظالم مؤسسة قضائية إدارية كان يعقدها الخليفة أو ينيب عنه قاضياً للنظر في شكاوى الظلم التي تتجاوز أعمال القضاء العادي؛ اهتم بها المهدي حتى بلغ به الاهتمام بإقامة العدل أنه اتخذ بيتاً له نافذة من حديد تُطرح فيه الشكاوى {cite:tarikh-dawla-abbasiyya-taqqush p. 76}، وبنى المهتدي قبة لها أربعة أبواب سماها قبة المظالم كان يجلس فيها للعام والخاص {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
  en: "Mazalim — the caliphal grievance institution above the ordinary qadi's remit: al-Mahdi's iron-windowed complaints house and al-Muhtadi's four-doored Dome of Redress {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
