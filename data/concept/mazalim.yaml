id: concept/mazalim
class: concept
kind: legal
label: { ar: "المظالم", en: "The mazalim (courts of grievances)", es: "Los mazalim (tribunales de quejas)", fr: "Les mazalim (tribunaux des griefs)", ur: "مزالم ⁦(شکایات کی عدالتیں)⁩", tr: "şikayetler", id: "keluhan" }
summary:
  ar: "المظالم مؤسسة قضائية إدارية كان يعقدها الخليفة أو ينيب عنه قاضياً للنظر في شكاوى الظلم التي تتجاوز أعمال القضاء العادي؛ اهتم بها المهدي حتى بلغ به الاهتمام بإقامة العدل أنه اتخذ بيتاً له نافذة من حديد تُطرح فيه الشكاوى {cite:tarikh-dawla-abbasiyya-taqqush p. 76}، وبنى المهتدي قبة لها أربعة أبواب سماها قبة المظالم كان يجلس فيها للعام والخاص {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
  en: "Mazalim — the caliphal grievance institution above the ordinary qadi's remit: al-Mahdi's iron-windowed complaints house and al-Muhtadi's four-doored Dome of Redress {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
  es: "Mazalim: la institución califal de quejas por encima de la competencia del cadí ordinario: la casa de quejas con ventanas de hierro de al-Mahdi y la Cúpula de la Reparación de cuatro puertas de al-Muhtadi {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
  fr: "Mazalim — l'institution califale de règlement des griefs au-dessus du mandat du cadi ordinaire: la maison des plaintes aux fenêtres en fer d'al-Mahdi et le Dôme de réparation à quatre portes d'al-Muhtadi {cite: tarikh-dawla-abbasiyya-taqqush p. 166}."
  ur: "مزلیم - عام قادیانیوں سے بالاتر خلیفہ شکایات کا ادارہ: المہدی کا لوہے کی کھڑکیوں والا شکایات کا گھر اور المحتدی کا چار دروازوں والا گنبد ازالہ۔ 166}۔"
  tr: "Şikayetler, halife tarafından kurulan veya yargıç olarak atanan idari bir yargı kurumudur; bu kurumlar sıradan yargı süreçlerinin ötesine geçen adaletsizlik şikayetlerini dinler; el-Mehdi bu konuda o kadar ilgilendi ki, adaletin sağlanmasına o kadar önem verdi ki, şikayetlerin yapılabileceği demir pencereli bir ev inşa etti {atıf:Tarikh-dawla-abbasiyya-taqqush s. 76} ve el-Muhtadi dört kapılı bir kubbe inşa etti ve buna Şikayetler Kubbesi adını verdi; burada hem halk hem de özel yer yer aldı {cite:Tarikh-dawla-siyabbaya-taqqush s. 166}."
  id: "Keluhan adalah institusi peradilan administratif yang didirikan oleh khalifah atau diangkat sebagai hakim untuk mendengar keluhan ketidakadilan yang melampaui proses peradilan biasa; al-Mahdi begitu peduli dengan hal ini sehingga ia sangat peduli dengan penegakan keadilan sehingga ia membangun sebuah rumah dengan jendela besi tempat keluhan dapat diajukan {cite:Tarikh-dawla-abbasiyya-taqqush hlm. 76}, dan al-Muhtadi membangun kubah dengan empat pintu yang ia beri nama Dome of Grievances, di mana baik publik maupun pribadi duduk {cite:Tarikh-dawla-abbasiyya-taqqush hlm. 166}."
