id: concept/marahil-hayat-al-insan
class: concept
kind: belief
label:
  ar: "مراحل حياة الإنسان"
  en: "The stages of human life"
  ur: "انسانی زندگی کے مراحل"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن لحياة الإنسان خمس مراحل (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:01:30} أولها عالم الذر قبل خلق آدم حين أخذ الله الميثاق على الأرواح، {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:01:30} وثانيها عالم الأرحام، {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:03:00} وثالثها عالم الشهادة وهو الدنيا، {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:04:00} وتنتهي هذه المرحلة ببداية ما يتناوله مفتتح سورة النازعات. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:04:30}"
  en: "Sheikh Omar Abdelkafy says that human life has five stages (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:01:30} The first is the world of the dharr before the creation of Adam, when God took the covenant from the souls, {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:01:30} the second is the world of the wombs, {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:03:00} and the third is the world of witnessing, which is this life; {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:04:00} this stage ends with the start of what the opening of Surat an-Nazi'at addresses. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:04:30}"
  ur: "شیخ عمر عبد الکافی کہتے ہیں کہ انسانی زندگی پانچ مراحل پر مشتمل ہے (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:01:30} پہلا عالمِ ذر ہے آدم کی تخلیق سے پہلے جب اللہ نے ارواح سے عہد لیا، {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:01:30} دوسرا عالمِ ارحام، {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:03:00} اور تیسرا عالمِ شہادت یعنی یہی دنیا ہے؛ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:04:00} یہ مرحلہ اس پر ختم ہوتا ہے جس کا ذکر سورہ النازعات کے آغاز میں ہے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:04:30}"
