label: { ar: "الاعتصام", en: "Holding fast (i'tisam)", ur: "اعتصام" }
summary:
  ar: "المنزلة التاسعة من منازل السالكين في مدارج السالكين لابن قيم الجوزية؛ يقسمها إلى اعتصام بحبل الله يعصم من الضلالة ويوجب الهداية واتباع الدليل، واعتصام بالله يعصم من الهلكة ويكون بالتوكل عليه والاحتماء به، ويشرح درجات الهروي الثلاث فيه ويخالفه في جعل الفناء غايتها."
  en: "The ninth of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin. He divides it into holding fast to God's rope, which protects from going astray and brings guidance and following the evidence, and holding fast to God Himself, which protects from ruin and consists in relying on Him and seeking His protection; he explains al-Harawi's three degrees of it and disagrees with him in making annihilation (fana') their goal."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی نویں منزل۔ وہ اسے دو قسموں میں بانٹتے ہیں: اللہ کی رسی کو مضبوطی سے تھامنا، جو گمراہی سے بچاتا اور ہدایت اور دلیل کی پیروی لاتا ہے، اور خود اللہ کا سہارا لینا، جو ہلاکت سے بچاتا ہے اور اس پر توکل اور اس کی پناہ لینے سے عبارت ہے؛ وہ اس کے بارے میں ہروی کے تین درجوں کی شرح کرتے ہیں اور فنا کو ان کی غایت قرار دینے میں ان سے اختلاف کرتے ہیں۔"
