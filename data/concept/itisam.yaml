label: { ar: "الاعتصام", en: "Holding fast (i'tisam)", ur: "اعتصام", es: "Manteniéndose firme (i'tisam)", fr: "Tenir bon (i'tisam)", tr: "Oturma eylemi", id: "Aksi duduk" }
summary:
  ar: "المنزلة التاسعة من منازل السالكين في مدارج السالكين لابن قيم الجوزية؛ يقسمها إلى اعتصام بحبل الله يعصم من الضلالة ويوجب الهداية واتباع الدليل، واعتصام بالله يعصم من الهلكة ويكون بالتوكل عليه والاحتماء به، ويشرح درجات الهروي الثلاث فيه ويخالفه في جعل الفناء غايتها."
  en: "The ninth of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin. He divides it into holding fast to God's rope, which protects from going astray and brings guidance and following the evidence, and holding fast to God Himself, which protects from ruin and consists in relying on Him and seeking His protection; he explains al-Harawi's three degrees of it and disagrees with him in making annihilation (fana') their goal."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی نویں منزل۔ وہ اسے دو قسموں میں بانٹتے ہیں: اللہ کی رسی کو مضبوطی سے تھامنا، جو گمراہی سے بچاتا اور ہدایت اور دلیل کی پیروی لاتا ہے، اور خود اللہ کا سہارا لینا، جو ہلاکت سے بچاتا ہے اور اس پر توکل اور اس کی پناہ لینے سے عبارت ہے؛ وہ اس کے بارے میں ہروی کے تین درجوں کی شرح کرتے ہیں اور فنا کو ان کی غایت قرار دینے میں ان سے اختلاف کرتے ہیں۔"
  es: "La novena de las estaciones del viajero en el Madarij al-Salikin de Ibn Qayyim al-Jawziyya. La divide en aferrarse a la cuerda de Dios, que protege de extraviarse y trae guía y seguimiento de la evidencia, y aferrarse a Dios mismo, que protege de la ruina y consiste en confiar en Él y buscar Su protección; explica los tres grados de al-Harawi y discrepa con él en que la aniquilación (fana') sea su objetivo."
  fr: "La neuvième étape du parcours du voyageur, selon Ibn Qayyim al-Jawziyya dans son ouvrage Madarij al-Salikin, est divisée en deux degrés: s’attacher à la corde de Dieu, qui protège de l’égarement, apporte la guidance et le suivi des preuves; et s’attacher à Dieu Lui-même, qui protège de la ruine et consiste à se confier à Lui et à rechercher Sa protection. Il explique les trois degrés de cette étape selon al-Harawi et réfute son point de vue selon lequel l’anéantissement (fana’) en est le but."
  tr: "Dokuzuncu istasyon, İbn Kayyim al-Jawziyyah'ın Medreci'l-Salikin'deki yolcuların duraklarından biridir; bunu, yolsuzluktan koruyan ve rehberliği gerektiren Allah'ın ipine sıkı sıkıya tutunmak, yol göstermeyi ve rehberi takip etmek ile yıkımdan koruyan ve O'na güvenerek ve O'na sığınarak elde edilen Allah'a sıkı sıkıya tutunmayı ikiye ayırır. Burada El-Haravi'nin üç derecesini açıklar ve yok oluşu amaçlayan Haravi'nin kendisiyle tezat oluşturur."
  id: "Stasiun kesembilan adalah salah satu stasiun para pengembara di Madarij al-Salikin oleh Ibn Qayyim al-Jawziyyah; ia membaginya menjadi memegang erat tali Allah, yang melindungi dari kekeliruan dan membutuhkan bimbingan serta mengikuti pituduh, dan memegang erat Allah, yang melindungi dari kehancuran dan dicapai dengan bergantung kepada-Nya dan mencari perlindungan kepada-Nya. Ia menjelaskan tiga derajat Al-Harawi di dalamnya dan berbeda dengan Dia dalam menjadikan pemusnahan sebagai tujuan."
