label: { ar: "الحسم", en: "Cauterising the stump (hasm)", ur: "حسم (زخم کو داغنا)" }
summary:
  ar: "الحسم في اللغة القطع، وفي الاصطلاح غمس موضع القطع في يد أو رجل بعد القطع في السرقة ونحوها في زيت أو دهن مغلي، أو الكي بحديدة محماة لتنسد أفواه العروق وينقطع الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7090} وهو عند الحنفية والمالكية وجه للشافعية واجب، لأن الحد زاجر لا متلف، والشافعية في الأصح والحنابلة يرونه مندوبا، ومؤونته على السارق عند الحنفية والشافعية في الأصح، وقيل من بيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091}"
  en: "Hasm (cauterising) means, in the lexicon, cutting, and in law dipping the stump of a cut hand or foot in boiling oil or searing it with a heated iron so that the veins close and the bleeding stops. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7090} The Hanafis and Malikis, and one Shafi'i view, treat it as obligatory since the penalty must deter and not destroy; the sounder Shafi'i view and the Hanbalis treat it as recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091}"
