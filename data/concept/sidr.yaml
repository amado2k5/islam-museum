  es: "Sidr es una entrada de referencia cruzada en el libro: el autor dice que ha mencionado sus estados y acciones cuando mencionó los estados de nabq en el capítulo de nun {cite:canon-ibn-sina-print-v1 p.588}."
  fr: "Sidr est une entrée de référence croisée dans le livre: l'auteur dit qu'il a mentionné ses états et ses actions lorsqu'il a mentionné les états de nabq dans le chapitre de nun {cite:canon-ibn-sina-print-v1 p.588}."
