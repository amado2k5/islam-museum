label: { ar: "النَّسَب", en: "Lineage (nasab) and the proofs of descent", ur: "نسب ⁦(قرابت)⁩ اور اس کے اثبات کے طریقے", es: "Linaje (nasab) y pruebas de descendencia", fr: "Lignée (nasab) et preuves de descendance", tr: "Soy Geçmişi", id: "Garis Keturunan" }
summary:
  ar: "النسب في اللغة الانتساب، وفي الاصطلاح القرابة وهي الاتصال بين إنسانين بالاشتراك في ولادة قريبة أو بعيدة. وهو يختلف عن العصبة والولاء والرحم والمصاهرة والرضاع والقعدد. ولا يجوز الإقرار بنسب ولد وهو يعلم أنه ليس منه، ولا نفيه وهو يعلم أنه منه. والنسب يثبت بالنكاح الصحيح إذا أمكن الحمل، ويثبت بالنكاح الفاسد إذا اتصل به دخول، وبالوطء بشبهة عند الجمهور، ولا يثبت بالزنا. ويثبت بالفراش والقيافة عند المالكية والشافعية والحنابلة، وبالإقرار وبالبينة بشهادة رجلين، وبالاستفاضة عند الجمهور، وبحكم القاضي. وأكثر مدة الحمل مختلف فيها بين أربع سنين وسنتين وخمس وتسع أشهر، وأقلها ستة أشهر. والإقرار بالنسب معتبر بشروط، ويفرق الحنفية بين إقرار الرجل بخمسة نفر وإقرار المرأة بأربعة، ولا يثبت النسب بالتحكيم، وفي التحليف خلاف. ومن آثار النسب النفقة والميراث وتحريم النكاح وسقوط القصاص عن الوالد، والولاية. ولا يجوز إسقاط النسب بعد ثبوته، ويثبت انتفاؤه باللعان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15677}"
  en: "Nasab, in the lexicon, is lineage; in law it is the relation between two people through a shared birth, near or far. It differs from agnation (asaba), client-right (wala'), kinship by womb (rahm), marriage-relation (musaharah), suckling kinship and the degrees of the line. It is forbidden to acknowledge a child one knows is not one's own, or to deny one who is. Lineage is established by a valid marriage where conception is possible, by a defective marriage with real intercourse, and by intercourse under a mistaken belief according to the majority, but not by fornication. Firash (the marriage bed), qiyafa (the tracker's judgement) according to the Malikis, Shafi'is and Hanbalis, acknowledgement, testimony, hearsay by reputation, and the judge's ruling are the proofs. The gestation period is at least six months, and the maximum is disputed (four years, two years, five years, or nine months). The acknowledgement of lineage is governed by conditions; a man may acknowledge five kinds of relation and a woman four, according to the Hanafis. Lineage cannot be made the subject of arbitration; an oath in a lineage claim is disputed. Its effects include maintenance, inheritance, the bar of marriage, the lifting of retaliation from a father, and guardianship. Lineage once established cannot be given up, and it is ended by li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15677}"
  ur: "نسب کا مطلب قرابت ہے، جو ولادت میں شرکت سے قائم ہوتی ہے۔ نکاح صحیح یا فاسد میں جماع سے، اور شبہ کی صورت میں جمہور کے نزدیک نسب ثابت ہوتا ہے، زنا سے نہیں۔ اقرار، گواہی، شہرت اور قاضی کے فیصلے سے بھی نسب ثابت ہوتا ہے۔ حمل کی کم از کم مدت چھ ماہ ہے۔ نسب کا انکار لعان سے ہوتا ہے۔"
  es: "Nasab, en el léxico, significa linaje; en derecho, es la relación entre dos personas por nacimiento común, cercano o lejano. Se diferencia de la agnación (asaba), el derecho de cliente (wala'), el parentesco por gestación (rahm), la relación matrimonial (musaharah), el parentesco por lactancia y los grados de la línea. Está prohibido reconocer a un hijo que se sabe que no es propio, o negar a uno que sí lo es. El linaje se establece mediante un matrimonio válido donde es posible la concepción, mediante un matrimonio defectuoso con coito real, y mediante coito bajo creencia errónea según la mayoría, pero no mediante fornicación. Firash (el lecho conyugal), qiyafa (el juicio del rastreador) según los malikíes, shafi'íes y hanbalíes, el reconocimiento, el testimonio, la reputación y la sentencia del juez son las pruebas. El período de gestación es de al menos seis meses, y el máximo es objeto de debate (cuatro años, dos años, cinco años o nueve meses). El reconocimiento del linaje se rige por condiciones; según la escuela Hanafi, un hombre puede reconocer cinco tipos de parentesco y una mujer cuatro. El linaje no puede ser objeto de arbitraje; un juramento en una reclamación de linaje es cuestionable. Sus efectos incluyen el sustento, la herencia, la prohibición de contraer matrimonio, la eliminación de la represalia paterna y la tutela. Una vez establecido, el linaje no puede renunciarse y se extingue mediante el li'an. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15654} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15656} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15658} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15660} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15662} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15664} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.15666} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15668} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15670} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15672} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15674} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15676} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15677}"
  fr: "Nasab, dans le lexique, signifie filiation; en droit, il s'agit du lien de parenté entre deux personnes par une naissance commune, proche ou éloignée. Il diffère de l'ascendance (asaba), du droit de parenté (wala'), de la parenté par le sang (rahm), du lien de mariage (musaharah), de la parenté par allaitement et des degrés de filiation. Il est interdit de reconnaître un enfant dont on sait qu'il n'est pas le sien, ou de nier celui qui l'est. La filiation est établie par un mariage valide où la conception est possible, par un mariage défectueux avec rapports sexuels réels, et par des rapports sexuels sous une croyance erronée selon la majorité, mais non par la fornication. Firash (le lit conjugal), qiyafa (le jugement du traqueur) selon les écoles malikite, chaféite et hanbalite, la reconnaissance, le témoignage, la rumeur et la décision du juge sont les preuves. La période de gestation est d'au moins six mois, et la durée maximale est sujette à débat (quatre ans, deux ans, cinq ans ou neuf mois). La reconnaissance de la filiation est soumise à des conditions. Selon l'école hanafite, un homme peut reconnaître cinq liens de parenté et une femme quatre. La filiation ne peut faire l'objet d'un arbitrage; un serment prêté dans le cadre d'une revendication de filiation est contestable. Ses effets comprennent l'entretien, l'héritage, l'interdiction du mariage, la levée des représailles contre un père et la tutelle. Une fois établie, la filiation est irrévocable et prend fin avec le li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15664} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.15666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15677}"
  tr: "Dilbilimde soy akrabalıktır; terminolojide akrabalık, yakın veya uzak doğumla iki kişi arasındaki bağdır. Bu, akrabalık, sadakat, akrabalık, evlilik, emzirme ve birlikte yaşamaktan farklıdır. Bir çocuğun soyunu kendisine ait olmadığını bilerek kabul etmek ya da onun soyundan geldiğini bilerek inkâr etmek yasaktır. Soy hattı, gebelik mümkünse geçerli evlilikle, geçersiz evlilikle ve kamuoyu ile cinsel ilişkiyle kurulur, ancak zina yoluyla değil. Maliki, Şafii ve Hanbali'ye göre yatak ve süsleme, iki erkeğin tanıklığıyla kabul ve kanıtla, çoğunluk önünde kapsamlı danışma ve hakimin kararıyla belirlenir. Gebeliğin en çok tartışmalı süresi dört ila iki yıl, beş ile dokuz ay arasındadır; minimum altı aydır. Soy soyunun kabul edilmesi koşullu kabul edilir. Hanafiler, beş kişiyi kabul eden erkek, dört kişiyi kabul eden kadın arasındaki farkı ayırır. Soy tahkim yoluyla belirlenmez ve yemin konusunda anlaşmazlık vardır. Soy hattının etkileri arasında nafaka, miras, evliliğin yasaklanması, babaya karşı misillemeden feragat etme ve vasilik bulunur. Soy kurulduktan sonra soydan vazgeçmek ve ihmali li'an tarafından tespit edilmesi kabul edilemez. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.15653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15677}"
  id: "Dalam linguistik, garis keturunan adalah kekerabatan, dan dalam terminologi, kekerabatan adalah hubungan antara dua orang melalui kelahiran yang dekat atau jauh. Hubungan ini berbeda dengan kekerabatan, kesetiaan, kekerabatan, pernikahan, menyusui, dan tinggal bersama. Tidak diperbolehkan mengakui garis keturunan anak dengan mengetahui bahwa dia bukan miliknya, maupun menyangkalnya dengan mengetahui bahwa dia adalah anaknya. Garis keturunan ditentukan melalui pernikahan yang sah jika kehamilan memungkinkan, dan oleh pernikahan yang tidak sah jika disempurnakan melalui hubungan seksual, dan hubungan dengan opini publik, tetapi bukan melalui perselingkuhan. Garis keturunan ditentukan melalui tempat tidur dan hiasan menurut Maliki, Shafi'i, dan Hanbali, melalui pengakuan dan bukti melalui kesaksian dua pria, melalui konsultasi luas di hadapan mayoritas, dan oleh putusan hakim. Durasi kehamilan yang paling banyak diperdebatkan adalah antara empat hingga dua tahun, dan lima hingga sembilan bulan, dengan minimum enam bulan. Mengakui garis keturunan dianggap bersyarat. Hanafi membedakan antara pria mengakui lima orang dan wanita mengakui empat. Garis keturunan tidak ditetapkan melalui arbitrase, dan terdapat perbedaan pendapat mengenai sumpah. Di antara efek garis keturunan adalah nafkah, warisan, larangan pernikahan, pengabaian pembalasan terhadap ayah, dan perwalian. Tidak diperbolehkan meninggalkan garis keturunan setelah ditetapkan, dan kelalaian itu dibuktikan oleh li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p