label: { ar: "النَّسَب", en: "Lineage (nasab) and the proofs of descent", ur: "نسب (قرابت) اور اس کے اثبات کے طریقے" }
summary:
  ar: "النسب في اللغة الانتساب، وفي الاصطلاح القرابة وهي الاتصال بين إنسانين بالاشتراك في ولادة قريبة أو بعيدة. وهو يختلف عن العصبة والولاء والرحم والمصاهرة والرضاع والقعدد. ولا يجوز الإقرار بنسب ولد وهو يعلم أنه ليس منه، ولا نفيه وهو يعلم أنه منه. والنسب يثبت بالنكاح الصحيح إذا أمكن الحمل، ويثبت بالنكاح الفاسد إذا اتصل به دخول، وبالوطء بشبهة عند الجمهور، ولا يثبت بالزنا. ويثبت بالفراش والقيافة عند المالكية والشافعية والحنابلة، وبالإقرار وبالبينة بشهادة رجلين، وبالاستفاضة عند الجمهور، وبحكم القاضي. وأكثر مدة الحمل مختلف فيها بين أربع سنين وسنتين وخمس وتسع أشهر، وأقلها ستة أشهر. والإقرار بالنسب معتبر بشروط، ويفرق الحنفية بين إقرار الرجل بخمسة نفر وإقرار المرأة بأربعة، ولا يثبت النسب بالتحكيم، وفي التحليف خلاف. ومن آثار النسب النفقة والميراث وتحريم النكاح وسقوط القصاص عن الوالد، والولاية. ولا يجوز إسقاط النسب بعد ثبوته، ويثبت انتفاؤه باللعان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15677}"
  en: "Nasab, in the lexicon, is lineage; in law it is the relation between two people through a shared birth, near or far. It differs from agnation (asaba), client-right (wala'), kinship by womb (rahm), marriage-relation (musaharah), suckling kinship and the degrees of the line. It is forbidden to acknowledge a child one knows is not one's own, or to deny one who is. Lineage is established by a valid marriage where conception is possible, by a defective marriage with real intercourse, and by intercourse under a mistaken belief according to the majority, but not by fornication. Firash (the marriage bed), qiyafa (the tracker's judgement) according to the Malikis, Shafi'is and Hanbalis, acknowledgement, testimony, hearsay by reputation, and the judge's ruling are the proofs. The gestation period is at least six months, and the maximum is disputed (four years, two years, five years, or nine months). The acknowledgement of lineage is governed by conditions; a man may acknowledge five kinds of relation and a woman four, according to the Hanafis. Lineage cannot be made the subject of arbitration; an oath in a lineage claim is disputed. Its effects include maintenance, inheritance, the bar of marriage, the lifting of retaliation from a father, and guardianship. Lineage once established cannot be given up, and it is ended by li'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15654} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15662} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15677}"
  ur: "نسب کا مطلب قرابت ہے، جو ولادت میں شرکت سے قائم ہوتی ہے۔ نکاح صحیح یا فاسد میں جماع سے، اور شبہ کی صورت میں جمہور کے نزدیک نسب ثابت ہوتا ہے، زنا سے نہیں۔ اقرار، گواہی، شہرت اور قاضی کے فیصلے سے بھی نسب ثابت ہوتا ہے۔ حمل کی کم از کم مدت چھ ماہ ہے۔ نسب کا انکار لعان سے ہوتا ہے۔"
