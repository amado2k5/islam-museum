summary:
  ar: "الشيح في الكتاب جنسان رومي وتركي، وينقل عن ديسقوريدوس أن من الناس من يسميه ساريقون ومنهم من يسميه الأفسنتين البحري، وأجوده الأرمني، حار في الثانية يابس في الثالثة، مقطع محلل للرياح، وفيه قبض دون قبض الأفسنتين، ورماده بزيت أو دهن اللوز طلاء نافع من داء الثعلب، ويكمد بمائه الرمد، وهو ضار بالمعدة، ويخرج الديدان وحب القرع، وينفع من لسع العقارب والرتيلاء، ويذكر الكتاب نقلا موسوما أنه يدر الطمث {cite:canon-ibn-sina-print-v1 p.673}"
  en: "Shih is in the book of two kinds, Rumi and Turkish; the book reports from Dioscorides that some people call it sariqun and some call it the sea absinthe; the best is the Armenian; it is hot in the second degree and dry in the third, cutting and dissolving winds, with an astringency less than that of absinthe; its ash with oil or oil of almond is a beneficial smear for alopecia, its water is applied warm to ophthalmia, it harms the stomach, it expels worms and the tapeworm, and it benefits the stings of scorpions and the tarantula; and the book lists, as a labelled report, that it brings on the menses {cite:canon-ibn-sina-print-v1 p.673}"
  ur: "شیح کتاب میں دو جنس کا ہے، رومی اور ترکی؛ کتاب دیسقوریدوس سے نقل کرتی ہے کہ بعض لوگ اسے ساریقون کہتے ہیں اور بعض اسے سمندری افسنتین کہتے ہیں؛ سب سے اچھا ارمنی ہے؛ دوسرے درجے میں گرم اور تیسرے میں خشک ہے، ہواؤں کو کاٹنے اور تحلیل کرنے والا، اس میں افسنتین سے کم قبض ہے؛ اس کی راکھ زیتون کے تیل یا بادام کے تیل کے ساتھ داء الثعلب میں نافع لیپ ہے، اس کے پانی سے آشوبِ چشم میں سینک کیا جاتا ہے، معدے کو نقصان دیتا ہے، کیڑوں اور کدو دانے کو نکالتا ہے، اور بچھوؤں اور رتیلا کے ڈنک میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ یہ حیض جاری کرتا ہے {cite:canon-ibn-sina-print-v1 p.673}۔"
  es: "El shih aparece en el libro en dos versiones: la rumiense y la turca. El libro informa, citando a Dioscórides, que algunos lo llaman sariqun y otros absenta marina; la mejor es la armenia. Es caliente en segundo grado y seca en tercero, cortante y disuelta los vientos, con una astringencia menor que la de la absenta. Su ceniza con aceite o aceite de almendras es ungüento beneficioso para la alopecia, su agua se aplica tibia para la oftalmía, daña el estómago, expulsa gusanos y tenias, y alivia las picaduras de escorpiones y tarántulas. El libro también menciona, como un informe específico, que provoca la menstruación {cite:canon-ibn-sina-print-v1 p.673}."
  fr: "Le Shih est mentionné dans le livre sous deux formes: celle de Rumi et celle de la Turquie. Le livre rapporte, d'après Dioscoride, que certains l'appellent sariqun et d'autres absinthe de mer. La meilleure est la version arménienne. Elle est chaude au deuxième degré et sèche au troisième, tranchant et dissolvant les vents, avec une astringence moindre que celle de l'absinthe. Ses cendres mélangées à de l'huile ou de l'huile d'amande douce constituent un cataplasme bénéfique contre l'alopécie. Son eau, appliquée chaude, est utilisée contre les affections oculaires. Elle est nocive pour l'estomac, expulse les vers intestinaux et le ténia, et soulage les piqûres de scorpions et de tarentules. Enfin, le livre indique, sous forme de rapport, qu'elle provoque les menstruations. {cite:canon-ibn-sina-print-v1 p.673}"
  tr: "Kitaptaki pelin otu iki çeşittir: Roma ve Türk. Dioscorideus'tan bazılarının buna Sarikun, bazılarının Bahri'nin absinthe'i dediği ve en iyisi Ermeni olduğunu bildirir. İkinci kısmı sıcak, üçüncüsü kuru, rüzgarla analiz edilen bir bölüme sahiptir ve absinthe özü olmadan bir nöbet içerir; yağ veya badem yağı ile külleri tilki hastalığı için faydalı bir kaplamadır. Suyu, mideye zararlı opioidleri baskılar, solucanları ve kabak çekirdeği atar ve akrep ile tarantula sokmaları için faydalıdır. Kitapta bir anlatımda adet başlattığı belirtilir {cite:canon-ibn-sina-print-v1 s.673}"
  id: "Wormwood dalam buku ini terdiri dari dua jenis: Romawi dan Turki. Dilaporkan dari Dioscorideus bahwa beberapa orang menyebutnya Sarikun, yang lain menyebutnya absinthe Bahri, dan yang terbaik adalah Armenia. Wormwood ini panas di gigi kedua dan kering pada yang ketiga, dengan bagian yang dianalisis angin, dan mengandung kejang tanpa ekstrak absinthe, dan abunya dengan minyak atau minyak almond merupakan lapisan yang bermanfaat untuk penyakit rubah. Airnya menekan opioid, yang berbahaya bagi lambung, mengeluarkan cacing dan biji labu, serta bermanfaat untuk sengatan kalajengking dan tarantula. Buku ini menyebutkan dalam sebuah narasi bahwa obat ini memicu menstruasi {cite:canon-ibn-sina-print-v1 hlm.673}"
