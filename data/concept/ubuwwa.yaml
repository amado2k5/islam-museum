label:
  ar: "الأبوة"
  en: "Fatherhood"
  ur: "ابوبت"
  es: "Paternidad"
  fr: "Paternité"
summary:
  ar: "الأبوة في الإسلام رعاية ومسؤولية قبل أن تكون نسبا: الأب مطالب بالإنفاق والتربية وحسن القدوة، وأولاده مطالبون ببره وطاعته في المعروف. قرن القرآن الإحسان بالوالدين بعبادة الله في آيات البقرة والإسراء ولقمان والأحقاف، وجعل الوالد أوسط أبواب الجنة، وحذر من العقوق مع كبائر الذنوب، وكتب لليتيم الذي فقد أباه كفالة وحماية."
  en: "Fatherhood in Islam is care and responsibility before it is lineage: the father is charged with providing, raising and modelling his children, and his children are charged with dutifulness to him. The Qur'an pairs kindness to the parents with the worship of God in al-Baqara, al-Isra', Luqman and al-Ahqaf; the Sunnah calls the father the middle gate of Paradise, warns against 'uquq among the greatest sins, and surrounds the orphan who lost his father with kafala and protection."
  ur: "اسلام میں ابوبت نسب سے پہلے رعایت اور ذمہ داری ہے: باپ اپنے بچوں کی کفالت، تربیت اور نمونہ ہونے کا ذمہ دار ہے اور اولاد اس کے ساتھ احسان کی مکلف ہے۔ قرآن نے والدین کے ساتھ احسان کو عبادتِ الٰہی کے ساتھ جوڑا؛ سنت نے باپ کو جنت کا درمیانی دروازہ کہا، عقوق سے خبردار کیا، اور یتیم کی کفالت لکھی۔"
  es: "En el Islam, la paternidad es cuidado y responsabilidad antes que linaje: el padre tiene la responsabilidad de proveer, criar y ser un ejemplo para sus hijos, y estos, a su vez, tienen la responsabilidad de serle fieles. El Corán vincula la bondad hacia los padres con la adoración a Dios en al-Baqara, al-Isra', Luqman y al-Ahqaf; la Sunnah llama al padre la puerta central del Paraíso, advierte contra el 'uquq como uno de los pecados más graves y rodea al huérfano que ha perdido a su padre con kafala y protección."
  fr: "En Islam, la paternité est synonyme de sollicitude et de responsabilité avant même d'être une question de filiation: le père a la charge de subvenir aux besoins de ses enfants, de les élever et de leur servir de modèle, et ses enfants ont le devoir de lui être fidèles. Le Coran associe la bienveillance envers les parents à l'adoration de Dieu dans les sourates Al-Baqara, Al-Isra', Luqman et Al-Ahqaf; la Sunna considère le père comme la porte du milieu du Paradis, met en garde contre l'« uquq » (l'impiété) parmi les plus grands péchés, et assure l'orphelin de sa protection et de son soutien (kafala)."
