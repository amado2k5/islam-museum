summary:
  ar: "التجربة الباطنية التي يقوم عليها الإيمان في نظر محمد إقبال؛ يعدّها في المحاضرة الأولى معطًى من معطيات الخبرة الإنسانية لا يُرَدّ إلى معطيات العلم الطبيعي، وتُختبر دعاواها بمعايير المعرفة نفسها."
  en: "The inner experience on which faith rests, in the view of Muhammad Iqbal. In Lecture I he treats it as one of the data of human experience, not reducible to the data of natural science, whose claims must be tested by the standards of knowledge in general."
  es: "La experiencia interior en la que se basa la fe, según Muhammad Iqbal. En la Lección I, la trata como uno de los datos de la experiencia humana, no reducible a los datos de las ciencias naturales, cuyas afirmaciones deben ser contrastadas con los criterios del conocimiento en general."
  fr: "L'expérience intérieure sur laquelle repose la foi, selon Muhammad Iqbal. Dans sa première conférence, il la considère comme une donnée de l'expérience humaine, non réductible aux données des sciences naturelles, dont les affirmations doivent être vérifiées selon les critères de la connaissance en général."
