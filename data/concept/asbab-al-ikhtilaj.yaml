id: "concept/asbab-al-ikhtilaj"
class: "concept"
kind: "scientific"
label:
  ar: "أسباب الاختلاج"
  en: "Causes of ikhtilaj"
  ur: "اختلاج کے اسباب"
summary:
  ar: "أسباب الاختلاج قوة مبردة ومادة رطبة وقد يعرض من الأعراض النفسانية كثيراً خصوصاً من الفرح وكذلك من الغم والغضب لأن الحركة من الروح قد تحلل المواد رياحاً، وإذا عم البدن أنذر بسكتة أو كزاز وإذا دام بالمراق أنذر بالمالنخوليا وإذا دام بالوجه أنذر باللقوة {cite:canon-ibn-sina-print-v2 p.160}"
  en: "The causes of ikhtilaj are a cooled power and a moist matter; it often arises from psychical events, especially joy, likewise grief and anger, for the spirit's motion can dissolve matters into winds; generalised it warns of apoplexy or tetanus; persistent in the temples it warns of melancholy; persistent in the face, of facial palsy {cite:canon-ibn-sina-print-v2 p.160}"
  ur: "اختلاج کے اسباب ٹھنڈی کی ہوئی قوت اور مرطوب مادہ ہیں؛ وہ نفسانی عوارض سے بھی اکثر ہوتا ہے، بالخصوص خوشی سے، اور اسی طرح غم اور غصے سے، کیونکہ روح کی حرکت مادوں کو ہواؤں میں تحلیل کر سکتی ہے؛ سارے بدن میں پھیل جائے تو سکتے یا کزاز کی پیش خبری ہے؛ مآق پر قائم رہے تو مالیخولیا کی؛ چہرے پر قائم رہے تو لقوہ کی {cite:canon-ibn-sina-print-v2 p.160}"
