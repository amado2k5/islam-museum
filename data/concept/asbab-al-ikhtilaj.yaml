id: "concept/asbab-al-ikhtilaj"
class: "concept"
kind: "scientific"
label:
  ar: "أسباب الاختلاج"
  en: "Causes of ikhtilaj"
  fr: "Causes de l’ikhtilaj"
  ur: "اختلاج کے اسباب"
  es: "Causas de ikhtilaj"
  tr: "Nöbetlerin nedenleri"
  id: "Penyebab kejang"
summary:
  ar: "أسباب الاختلاج قوة مبردة ومادة رطبة وقد يعرض من الأعراض النفسانية كثيراً خصوصاً من الفرح وكذلك من الغم والغضب لأن الحركة من الروح قد تحلل المواد رياحاً، وإذا عم البدن أنذر بسكتة أو كزاز وإذا دام بالمراق أنذر بالمالنخوليا وإذا دام بالوجه أنذر باللقوة {cite:canon-ibn-sina-print-v2 p.160}"
  en: "The causes of ikhtilaj are a cooled power and a moist matter; it often arises from psychical events, especially joy, likewise grief and anger, for the spirit's motion can dissolve matters into winds; generalised it warns of apoplexy or tetanus; persistent in the temples it warns of melancholy; persistent in the face, of facial palsy {cite:canon-ibn-sina-print-v2 p.160}"
  fr: "Les causes de l’ikhtilaj sont une faculté refroidie et une matière humide ; il naît souvent d’événements psychiques, surtout la joie, mais aussi le chagrin et la colère, car le mouvement de l’esprit peut dissoudre les matières en vents ; généralisé, il annonce l’apoplexie ou le tétanos ; persistant aux tempes, la mélancolie ; persistant au visage, la paralysie faciale {cite:canon-ibn-sina-print-v2 p.160}"
  ur: "اختلاج کے اسباب ٹھنڈی کی ہوئی قوت اور مرطوب مادہ ہیں؛ وہ نفسانی عوارض سے بھی اکثر ہوتا ہے، بالخصوص خوشی سے، اور اسی طرح غم اور غصے سے، کیونکہ روح کی حرکت مادوں کو ہواؤں میں تحلیل کر سکتی ہے؛ سارے بدن میں پھیل جائے تو سکتے یا کزاز کی پیش خبری ہے؛ مآق پر قائم رہے تو مالیخولیا کی؛ چہرے پر قائم رہے تو لقوہ کی {cite:canon-ibn-sina-print-v2 p.160}"
  es: "Las causas del ikhtilaj son un poder enfriado y una materia húmeda; a menudo surge de eventos psíquicos, especialmente alegría, así como pena e ira, pues el movimiento del espíritu puede disolver la materia en vientos; generalizado advierte de apoplejía o tétanos; persistente en las sienes advierte de melancolía; persistente en el rostro, de parálisis facial {cite:canon-ibn-sina-print-v2 p.160}"
  tr: "Nöbetlerin nedenleri soğutma gücü ve nemli maddelerdir; özellikle sevinç, üzüntü ve öfke gibi birçok psikolojik belirtiye yol açabilir, çünkü ruhtan gelen hareket rüzgar gibi maddeleri çözebilir. Vücut bunaldığında felç veya tetanoz uyarısı yapılır; tükürükte devam ederse melankoli uyarısı yapılır; yüz devam ederse güç uyarısı yapılır. {cite:canon-ibn-sina-print-v2 s.160}"
  id: "Penyebab kejang adalah kekuatan pendinginan dan zat lembap, dan dapat menyebabkan banyak gejala psikologis, terutama dari sukacita serta kesedihan dan kemarahan, karena gerakan dari jiwa dapat melarutkan zat seperti angin. Jika tubuh kewalahan, tubuh diperingatkan akan stroke atau tetanus; jika tetap ada di air liur, tubuh akan diingatkan akan kesedihan; jika tetap ada di wajah, maka akan kekuatan. {cite:canon-ibn-sina-print-v2 hlm.160}"
