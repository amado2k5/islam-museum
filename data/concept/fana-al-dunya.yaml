label:
  ar: "فناء الدنيا وزوالها"
  en: "The transience of the world (fana al-dunya)"
  ur: "دنیا کا فنا اور زوال"
summary:
  ar: "زوال الدنيا في كلام الشيخ عمر عبد الكافي في سلسلة «الفوز المبين»: الدنيا زيارة مؤقتة يعود بعدها الناس إلى مستقرهم، وهي متقلبة لا تبقى، ومثال القصر المعيب، وزوال الطغاة، والدنيا التي تُحسب بعمر الإنسان فيها، ومثل نوح عن الدنيا ذات البابين."
  en: "The transience of the world in Sheikh Omar Abdelkafy's teaching in the series 'Al Fawzu Al Moubeen': the world is a temporary visit after which people return to their abode, and it is fickle and does not last; the parable of the flawed palace; the fall of tyrants; the world measured by a person's span within it; and Noah's saying about the world with two doors."
  ur: "شیخ عمر عبدالکافی کے سلسلہ «الفوز المبین» میں بیان کے مطابق دنیا کا فنا ہونا: دنیا ایک عارضی قیام ہے جس کے بعد لوگ اپنے ٹھکانے کو لوٹتے ہیں، اور یہ متغیر ہے اور باقی نہیں رہتی؛ عیب دار محل کی مثال؛ ظالموں کا زوال؛ انسان کی مدت کے لحاظ سے دنیا کا اندازہ؛ اور نوح کا دو دروازوں والی دنیا کے بارے میں قول۔"
