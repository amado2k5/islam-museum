id: concept/al-qiwama
class: concept
kind: legal
sensitivity: contested
label:
  ar: "القوامة"
  en: "Male guardianship in the family (qiwama)"
  ur: "قوامیت"
summary:
  ar: "يقرأ الشعراوي قوله تعالى «الرجال قوامون على النساء» قراءة تجعل القوامة مشقة وقياماً بالأمر لا سيطرة، وتقوم على التفضيل بما يكدح فيه الرجل وبما ينفقه من ماله، وعلى أن المرأة سكن. ويعرض ترتيب الآية في النشوز: الوعظ، ثم الهجر في المضجع، ثم الضرب غير المبرح، ويرى أن الطاعة تُحكم بالظاهر، وأن الشقاق يُعالج بحكمين من أهل الزوجين {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2192}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2193}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2199}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2203}."
  en: "Al-Sha'rawi reads 'men are in charge of women' as a burden of standing for their affairs, not as domination. He grounds it in the preference given to men through their labour and the maintenance they pay, and in the wife as a place of rest. He sets out the order in the verse for disobedience: admonition, separation in bed, then light striking that leaves no mark, and holds that obedience is judged by outward conduct. Conflict is referred to two arbiters from the two families {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2192}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2193}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2199}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2203}."
  ur: "شعراوی آیت «الرجال قوامون على النساء» کو اس طرح سمجھتے ہیں کہ قوامیت ایک ذمہ داری اور مشقت ہے نہ کہ تسلط۔ ان کے مطابق نشوز کی صورت میں ترتیب وعظ، بستر میں علیحدگی، پھر ایسی ہلکی مار جو نشان نہ چھوڑے، ہے، اور اطاعت ظاہری عمل سے پرکھی جاتی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2192}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2193}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2199}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2203}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "ما معنى القوامة في الآية، وكيف يُعالج النشوز والشقاق بحسب تفسير الشعراوي؟"
  en: "What does qiwama mean in the verse, and how does Sha'rawi's commentary treat disobedience and discord?"
  ur: "آیت میں قوامیت کا کیا مطلب ہے، اور شعراوی کی تفسیر میں نشوز اور شقاق کا علاج کیا ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-duty-of-care
    stance:
      ar: "القوامة مسؤولية قيام ونفقة، والنشوز يعالج بالتدرج، والشقاق يُحال إلى حكمين"
      en: "Qiwama is a duty of care and maintenance; disobedience is addressed in stages, and discord is referred to two arbiters"
      ur: "قوامیت دیکھ بھال اور نفقے کی ذمہ داری ہے؛ نشوز کا علاج درجہ بدرجہ ہے، اور شقاق دو حکموں کے سپرد ہوتا ہے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن القوامة تكليف بالسعي والإنفاق، وأن الوعظ والهجر والضرب غير المبرح مراحل، وأن الحكمين من أهل الزوجين يسعيان للإصلاح {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2199}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2204}. ويذكر أن بعض العلماء قالوا بالسواك في الضرب، وهو قول يعرضه ولا يتبناه صراحة {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}."
      en: "Sha'rawi holds that qiwama is a duty of effort and maintenance, that admonition, separation in bed and light striking are stages, and that the two arbiters from the families seek reconciliation {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2199}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2204}. He reports that some scholars said the striking should be with a tooth-stick (miswak), a view he states without making it his own verdict {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}."
      ur: "شعراوی کے مطابق قوامیت کوشش اور نفقے کی ذمہ داری ہے، وعظ، بستر میں علیحدگی اور ہلکی مار مراحل ہیں، اور دونوں خاندانوں کے حکم اصلاح کی کوشش کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2199}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2204}۔ وہ بتاتے ہیں کہ بعض علماء نے کہا کہ مار مسواک سے ہو، یہ قول وہ نقل کرتے ہیں مگر اسے واضح طور پر اپنا فیصلہ نہیں بناتے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2201}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-hayel-administrative-role
    stance:
      ar: "القوامة وظيفة إدارية داخل الأسرة لا قهر، ولها حدود مفصّلة"
      en: "Qiwama is an administrative role within the family, not coercion, with set limits"
      ur: "قوامیت خاندان کے اندر انتظامی ذمہ داری ہے، جبر نہیں، اور اس کی مفصل حدود ہیں"
    holders: []
    summary:
      ar: "رأي الدكتور هايل عبد الحفيظ في برنامج «الوسطية»: القوامة ولاية لإدارة الأسرة بالتشاور، والدرجة درجة مسؤولية لا تفضيل، والإنفاق ليس علة تسقطها؛ لا يتدخل الزوج في دين زوجته ولا مذهبها ولا دراستها ولا تصويتها ولا وظيفتها المشروعة، وله القرار في المشترك عند الخلاف وفي السفر بغير محرم وفي حدود العورة المتفق عليها {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:08:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:20:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:26:00}."
      en: "Dr Hayel Abd al-Hafiz on 'Al-Wasatiyya': qiwama is an authority to manage the family through consultation; the 'degree' is one of responsibility, not preference; maintenance is not a cause whose absence cancels it; the husband does not interfere in his wife's religion, school, studies, vote or lawful work, and decides shared matters when they disagree, travel without a mahram and the agreed limits of 'awra {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:08:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:20:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:26:00}."
      ur: "«الوسطیہ» میں ڈاکٹر ہایل عبد الحفیظ کی رائے: قوامیت مشورے سے خاندان چلانے کی ولایت ہے؛ «درجہ» ذمہ داری کا ہے، فضیلت کا نہیں؛ نفقہ ایسی علت نہیں جس کے نہ ہونے سے یہ ختم ہو؛ شوہر بیوی کے دین، مذہب، تعلیم، ووٹ یا جائز ملازمت میں دخل نہیں دیتا، اور اختلاف میں مشترکہ امور، محرم کے بغیر سفر اور متفقہ حدودِ ستر میں فیصلہ کرتا ہے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:08:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:20:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 00:26:00}۔"
    sources: [source/assabile-tareq-al-suwaidan]
  - tradition: sunni
    id: presenter-suwaidan-reconsider-details
    stance:
      ar: "رأي طارق السويدان (رأي المتكلم): التفاصيل تأثرت بالعادات وتحتاج إعادة نظر، والقوامة داخل الأسرة فقط"
      en: "Tareq al-Suwaidan's view (the speaker's opinion): the details were shaped by custom and need reconsidering; qiwama is within the family only"
      ur: "طارق السویدان کی رائے (متکلم کی رائے): تفصیلات رسوم سے متاثر ہوئیں اور نظرِ ثانی چاہتی ہیں؛ قوامیت صرف خاندان کے اندر ہے"
    holders: [person/tariq-al-suwaidan]
    summary:
      ar: "يرى المقدّم أن فتاوى الفقهاء في تفاصيل القوامة تأثرت بعادات زمانها فينبغي إعادة النظر فيها لواقع اليوم، ويقترح دائرة خاصة بكل من الزوجين لا يتدخل فيها الآخر ودائرة مشتركة الأصل فيها التشاور ويُرجَّح فيها جانب الرجل عند التعادل في الجزئيات، ويرى أن من يلجأ إلى «سيف القوامة» هو الضعيف {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:00:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:18:00}."
      en: "The presenter holds that the jurists' fatwas on the details of qiwama were shaped by the customs of their time and should be reconsidered for today; he proposes a sphere for each spouse that the other does not enter and a shared sphere governed by consultation, where the man's side prevails on a tie in minor matters; and he sees whoever reaches for 'the sword of qiwama' as the weak one {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:00:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:18:00}."
      ur: "میزبان کے نزدیک قوامیت کی تفصیلات پر فقہا کے فتوے اپنے زمانے کی رسوم سے متاثر تھے اور آج کے لیے ان پر نظرِ ثانی ہونی چاہیے؛ وہ ہر شریکِ حیات کے لیے ایک دائرہ تجویز کرتے ہیں جس میں دوسرا دخل نہ دے، اور ایک مشترکہ دائرہ جہاں مشورہ اصل ہے اور جزوی امور میں برابری پر مرد کا پلڑا بھاری ہے؛ اور «قوامیت کی تلوار» اٹھانے والے کو کمزور سمجھتے ہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:00:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep32 01:18:00}۔"
    sources: [source/assabile-tareq-al-suwaidan]
