"label":
  "ar": "علامات انتقال ذات الرئة إلى التقيح"
  "en": "The signs of peripneumonia's passage into suppuration"
  "fr": "Signes du passage de la péripneumonie à la suppuration"
  "ur": "ذات الرئة کے تقيح میں منتقل ہونے کی علامات"
  "es": "Signos de la progresión de la perineumonía a supuración."
"summary":
  "ar": "وعلامات انتقاله إلى التقيح قريبة من علامات ذات الجنب في مثله وهو أن تكون\
    \ الحمى لا تنقص ولا الوجع ولا يرى نقص يعتد به بنفث أو بول غليظ ذي رسوب أو براز\
    \ فإنه إن رأيت المريض مع هذه العلامات سالماً قوياً فهو يؤول إلى التقيح أو إلى\
    \ الخراج إما إلى فوق وإما إلى أسفل بحسب العلامات المذكورة في ذات الجنب، وإن لم\
    \ يكن هناك قوة سلامة فتوقع الهلاك. وإذا صار بصاقه حلواً فقد تقيح فإن تنقى في أربعين\
    \ يوماً وإلا طال، وإذا طال الزمان بذات الرئة أورث تهيج الرجلين لضعف الغاذية وخصوصاً\
    \ في الأطراف، وإذا مالت المادة إلى المثانة رجيت السلامة {cite:canon-ibn-sina-print-v2\
    \ p.352}"
  "en": "The signs of its passage into suppuration are near to the signs of pleurisy\
    \ in the same case: that the fever does not diminish, nor the pain, and no counted\
    \ relief is seen — neither by expectoration, nor by a thick urine with sediment,\
    \ nor by stool. If you see the patient, with these signs, sound and strong, he\
    \ is heading to suppuration or to an abscess, either upward or downward by the\
    \ signs named under pleurisy; and if there is no saving power, expect death. If\
    \ his spittle turns sweet, he has suppurated: if he is cleansed within forty days,\
    \ well — otherwise it lingers. And when peripneumonia lasts long it brings on\
    \ an irritation of the legs for the weakness of the nourishment, especially at\
    \ the extremities; and if the matter inclines toward the bladder, safety may be\
    \ hoped {cite:canon-ibn-sina-print-v2 p.352}"
  "fr": "Les signes du passage à la suppuration sont proches de ceux de la pleurésie dans le même cas : ni la fièvre ni la douleur ne diminuent et on ne constate aucun soulagement appréciable, que ce soit à la suite d’une expectoration, d’une urine épaisse avec dépôt ou de l’évacuation des selles. Si le malade présente ces signes tout en demeurant robuste et vigoureux, il s’achemine vers la suppuration ou vers un abcès, vers le haut ou vers le bas selon les signes énumérés à propos de la pleurésie. Si ses forces ne peuvent le sauver, il faut s’attendre à la mort. Si sa salive prend un goût sucré, il a suppuré : si la matière s’évacue en quarante jours, l’issue est bonne ; sinon, le mal se prolonge. Une péripneumonie prolongée provoque une irritation des jambes par faiblesse de la nutrition, surtout aux extrémités. Si la matière se porte vers la vessie, on peut espérer une issue favorable. {cite:canon-ibn-sina-print-v2 p.352}"
  "ur": "اس کے تقيح میں منتقل ہونے کی علامات ذات الجنب کی علامات کے قریب ہیں: حمى\
    \ نہ گھٹے نہ درد اور کوئی قابل اعتبار کمی نہ نظر آئے نہ نفث سے نہ رسوب دار گاڑھے\
    \ پیشاب سے نہ براز سے اگر مریض ان علامات کے ساتھ تندرست اور قوی نظر آئے تو وہ\
    \ تقيح یا خراج کی طرف جاتا ہے اوپر یا نیچے ذات الجنب میں مذکور علامات کے حساب\
    \ سے اور اگر نجات دینے والی قوت نہ ہو تو ہلاکت کی توقع۔ اگر اس کا تھوک میٹھا ہو\
    \ جائے تو وہ پیپ دار ہو گیا اگر چالیس دن میں صاف ہو جائے تو ورنہ طول کھینچتا ہے\
    \ اور جب ذات الرئة طول کھینچے تو غذائیت کی کمزوری سے ٹانگوں میں بے چینی پیدا کرتی\
    \ ہے خاص طور پر سروں میں اور اگر مادہ مثانے کی طرف جھکے تو سلامتی کی امید {cite:canon-ibn-sina-print-v2\
    \ p.352}"
  "es": "Los signos de su progresión a supuración son similares a los de la pleuresía en el mismo caso: la fiebre no disminuye, ni el dolor, y no se observa alivio alguno, ni con la expectoración, ni con orina espesa con sedimento, ni con las heces. Si se observa al paciente con estos signos, sano y fuerte, se dirige hacia la supuración o hacia un absceso, ya sea ascendente o descendente según los signos de la pleuresía; y si no hay posibilidad de curación, cabe esperar la muerte. Si su saliva se vuelve dulce, ha supurado; si se cura en cuarenta días, bien; de lo contrario, persiste. Y cuando la perineumonía dura mucho tiempo, provoca irritación en las piernas debido a la debilidad de la nutrición, especialmente en las extremidades; y si la infección se dirige hacia la vejiga, cabe esperar la recuperación. {cite:canon-ibn-sina-print-v2 p.352}"
