summary:
  ar: "السورة في اصطلاح علوم القرآن القطعة المسمّاة من القرآن الجامعة لعدد من الآيات، وعدد سور المصحف عند الجمهور مائة وأربع عشرة سورة {cite:itqan-suyuti}."
  en: "The sura in Qur'anic-sciences usage is the named division of the Qur'an comprising a number of ayat; the masahif count a hundred and fourteen suras {cite:itqan-suyuti}."
  es: "La sura, en el uso de las ciencias coránicas, es la división nombrada del Corán que comprende una serie de ayat; los masahif cuentan ciento catorce suras {cite:itqan-suyuti}."
  fr: "Dans l'usage des sciences coraniques, la sourate est la division nommée du Coran comprenant un certain nombre d'ayat; les masahif comptent cent quatorze sourates {cite:itqan-suyuti}."
  ur: "قرآنی سائنس کے استعمال میں سورہ قرآن کی ایک مخصوص تقسیم ہے جس میں متعدد آیات شامل ہیں۔ مصحف میں ایک سو چودہ سورتیں ہیں {حوالہ:اتقان سیوطی}"
  tr: "Kur'an bilimleri terminolojisinde, bir sure, Kur'an'ın birçok ayeti kapsayan isimlendirilmiş bir parçadır ve Muşaf'ın surelerinin sayısı çoğunluğa göre yüz on dört suredir {cite:itqan-suyuti}."
  id: "Dalam istilah ilmu Al-Qur'an, surah adalah bagian nama Al-Qur'an yang mencakup sejumlah ayat, dan jumlah surah Mushaf menurut mayoritas adalah seratus empat belas surah {cite:itqan-suyuti}."
