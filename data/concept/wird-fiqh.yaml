id: concept/wird-fiqh
class: concept
kind: discipline
label:
  ar: وِرْد
  en: Wird (litanies and daily devotional portions)
  es: "Wird (letanías y porciones devocionales diarias)"
  fr: "Wird (litanies et portions de dévotion quotidiennes)"
  ur: "وائرڈ ⁦(لطینی اور روزانہ عقیدت کے حصے)⁩"
summary:
  ar: 'الورد في اللغة الوظيفة من قراءة ونحوها، والجمع أوراد، وفي الاصطلاح ما يرتّبه الإنسان على نفسه كل يوم أو ليلة من العمل، وهو ما يداوم عليه من صلاة وقراءة وذكر وغير ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} ويُذكر الحزب لفظاً قريباً منه بمعنى الورد الذي يعتاده الشخص، ولا يخرج المعنى الاصطلاحي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} وقد عدّ الغزالي الأوراد وسيلة إلى لقاء الله، لأن المحبة والأنس لا يحصلان إلا بدوام ذكر المحبوب، ولا يتيسر ذلك إلا بترك الدنيا والاكتفاء منها بقدر الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} ويستشهد لفضل الذكر بآيات من سور الأحزاب والعنكبوت والنساء والبقرة، وبحديث «سبق المفردون» وقد فسره ابن عباس بالذكر في أدبار الصلوات وعند النوم والخروج من المنزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} ولأن النفس تملّ الفن الواحد، فإن تنويع الأوراد من أسباب التلذذ بها والمداومة عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} والصلاة أفضل الأوراد، ولها نصف يتعلق بالعمل ظاهراً وباطناً، وتراعى فيها الأعمال الباطنة الستة: الحضور، والفهم، والتعظيم، والهيبة، والرجاء، والحياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141} ويستحب المحافظة على الجماعة في أقرب المساجد، والصف الأول، وترك الكلام الدنيوي فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140} وتلاوة القرآن أفضل الأذكار، ويختلف قدرها بحال القارئ، فمن كان له شغل بنشر العلم أو القضاء بين الناس اقتصر على قدر لا يخل بشغله، ومن لم يكن كذلك استكثر ما أمكنه دون الملل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} وقد ذُكر تحزيب القرآن إلى سبعة أحزاب بحسب الطول، وهو مروي من طريق أوس بن حذيفة في السنن، وقد نقل ابن عبد البر أن الحديث فيه ليس بقائم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} والأذكار والأدعية المأثورة من الورد، ويُستحب فيها ألا تُبتدع أذكار لم يشهد لها الكتاب والسنة، وقد نقل الشعراني عهداً في تجنب البدع، ونقل ابن علان عن النووي جواز الاشتغال بأوراد المشايخ إذا لم تخالف المأثور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17143}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144} والأصل في الأوراد المداومة، فالعمل القليل الدائم أحب إلى الله، والمنقطع يتلاشى أثره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145} وأوراد النهار سبعة، من الفجر إلى الشروق بالدعاء والذكر والقراءة والفكر، ثم ما بعد الشروق وصلاة الضحى، ثم ما قبل الزوال بالكسب والقيلولة، ثم بعد الزوال إلى العصر بالصلاة، ثم إلى الاصفرار بالتدبر في القرآن، ثم إلى الغروب بالتسبيح والاستغفار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17146}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17147}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17148} ويشمل ورد الليل ما بين المغرب والعشاء من النوافل، ثم ما بعد العشاء بقراءة السور المأثورة والوتر قبل النوم، ثم النوم بقدر معتدل، ثم التهجد في الثلث الأخير، ثم السحر بالاستغفار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17149}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17150} واختلاف الأوراد باختلاف الأحوال: فالعابد يستغرق في الأذكار والتلاوة، والعالم يقدم التعليم والتصنيف لنفع الناس، والمتعلم يشتغل بالاستفادة، والوالي يقدم قضاء حوائج المسلمين على الأوراد، والمحترف يجمع الذكر إلى الكسب ويتصدق بما يفضل عنه، والمستغرق بمحبة الله يتحرك إلى ما يريد من ورده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17151}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17152}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} ومن فاته ورده استدركه، وقد كان بعض السلف يقضون أوراد الليل نهاراً، وفي الحديث الصحيح من نام عن حزبه فقرأه فيما بين الفجر والظهر كتب له كأنما قرأه من الليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} وتُخص بعض الأشهر والأيام والليالي بمزيد استحباب إحيائها، وتحيل المادة في تفصيلها إلى مداخل أخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153}'
  en: 'Wird (plural awrad) is, in the lexicon, a fixed portion of recitation or other practice; in the technical sense it is what a person sets himself each day or night as a regular act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} The related term hizb is a practice a person keeps up, such as prayer or recitation, and its technical sense does not depart from the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} Al-Ghazali treats the awrad as the path to meeting God, since love and intimacy come only from constant remembrance, which in turn needs leaving worldly concerns to what is necessary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} The virtue of remembrance is supported by Qur''an passages in several surahs (al-Ahzab, al-Ankabut, al-Nisa'', al-Baqara) and by a hadith on those who go ahead by remembering God often; Ibn Abbas explains remembrance as practised after prayers, on going to sleep and on leaving home. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} Because the soul tires of one kind of act, varying the awrad keeps them pleasant and sustained. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} Prayer is the best of the awrad, and half of its right is the outward and inward work; six inward acts are to be observed in it: presence of heart, understanding, reverence, awe, hope and modesty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141} Attending the congregation in the nearest mosque, in the first row, and without worldly talk is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140} Recitation of the Qur''an is the best remembrance, and its amount varies with the reader: a man busy with teaching or judging keeps to what does not disturb his work, and others recite as much as they can without tiring. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} The Qur''an is divided into seven portions by length; the division is reported through a report from Aws ibn Hudhayfa, which Ibn Abd al-Barr judged not firmly established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} Transmitted supplications and remembrances belong to the awrad, while devising remembrances unsupported by the Book and the sunna is to be avoided; al-Sha''rani records a covenant to that effect, and Ibn Allan reports from al-Nawawi that the practices of the shaykhs may be followed where they do not depart from the transmitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17143}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144} The principle is constancy: a small act done regularly is loved by God, while an act abandoned loses its effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145} The seven daytime awrad run from dawn to sunset: first the supplication, remembrance, recitation and reflection after the dawn prayer, then the forenoon prayer, then work and a midday rest, then the prayer after noon, then Qur''an reflection in the afternoon, and finally glorification and seeking forgiveness until sunset. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17146}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17147}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17148} The night awrad include the voluntary prayers between maghrib and isha, the recitation of transmitted surahs and the witr before sleep, moderate sleep, the night prayer in the later part of the night, and seeking forgiveness at dawn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17149}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17150} The awrad vary with the state of the person: the devotee gives his time to worship and recitation; the scholar to teaching and writing; the student to learning; the ruler gives the needs of Muslims precedence over his own awrad; the craftsman joins remembrance to his work and gives away what he does not need; and one absorbed in love of God moves according to what his practice calls for. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17151}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17152}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} A missed wird should be made up, and a sound report says that whoever sleeps through his night portion and reads it between dawn and noon is credited as if he read it at night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} Certain months, days and nights are given extra merit for devotion, and the entry refers the detail to other headwords. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153}'
  es: "Wird (plural awrad) es, en el léxico, una porción fija de recitación u otra práctica; en el sentido técnico es lo que una persona se propone cada día o noche como un acto regular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} El término relacionado hizb es una práctica que una persona mantiene, como la oración o la recitación, y su sentido técnico no se aparta del léxico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} Al-Ghazali trata el awrad como el camino para encontrarse con Dios, ya que el amor y la intimidad provienen solo del recuerdo constante, que a su vez necesita dejar las preocupaciones mundanas para lo necesario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} La virtud del recuerdo está respaldada por pasajes del Corán en varias suras (al-Ahzab, al-Ankabut, al-Nisa', al-Baqara) y por un hadiz sobre aquellos que avanzan recordando a Dios a menudo; Ibn Abbas explica el recuerdo como practicado después de las oraciones, al irse a dormir y al salir de casa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} Debido a que el alma se cansa de un tipo de acto, variar los awrad los mantiene agradables y sostenidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} La oración es la mejor de las awrad, y la mitad de su derecho es el trabajo externo e interno; seis actos internos deben observarse en ella: presencia de corazón, comprensión, reverencia, temor, esperanza y modestia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141} Se recomienda asistir a la congregación en la mezquita más cercana, en la primera fila, y sin hablar de temas mundanos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140} La recitación del Corán es el mejor recuerdo, y su cantidad varía según el lector: un hombre ocupado con la enseñanza o el juicio se limita a lo que no interrumpe su trabajo, y otros recitan tanto como pueden sin cansarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} El Corán está dividido en siete partes por longitud; la división se informa a través de un informe de Aws ibn Hudhayfa, que Ibn Abd al-Barr juzgó que no estaba firmemente establecido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} Las súplicas y recuerdos transmitidos pertenecen al awrad, mientras que se debe evitar idear recuerdos no respaldados por el Libro y la sunna; al-Sha'rani registra un pacto en ese sentido, e Ibn Allan informa de al-Nawawi que las prácticas de los shaykhs pueden seguirse cuando no se apartan de lo transmitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17143}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144} El principio es la constancia: un pequeño acto realizado regularmente es amado por Dios, mientras que un acto abandonado pierde su efecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145} Los siete awrad diurnos van desde el amanecer hasta el atardecer: primero la súplica, el recuerdo, la recitación y la reflexión después de la oración del amanecer, luego la oración de la mañana, luego el trabajo y un descanso al mediodía, luego la oración después del mediodía, luego la reflexión del Corán por la tarde y finalmente la glorificación y la búsqueda del perdón hasta el atardecer. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17146}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17147}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17148} El awrad nocturno incluye las oraciones voluntarias entre maghrib e isha, la recitación de suras transmitidas y el witr antes de dormir, el sueño moderado, la oración nocturna al final de la noche y la búsqueda del perdón al amanecer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17149}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17150} Los awrad varían según el estado de la persona: el devoto dedica su tiempo a la adoración y la recitación; el erudito a la enseñanza y la escritura; el estudiante al aprendizaje; el gobernante da prioridad a las necesidades de los musulmanes sobre sus propios awrad; el artesano une el recuerdo a su trabajo y da lo que no necesita; y uno absorto en el amor a Dios se mueve según lo que su práctica le exige. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17151}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17152}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} Un wird omitido debe recuperarse, y un informe fiable dice que quien duerme durante su porción nocturna y la lee entre el amanecer y el mediodía se le acredita como si la hubiera leído por la noche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} Ciertos meses, días y noches reciben mérito adicional por la devoción, y la entrada remite el detalle a otras palabras clave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153}"
  fr: "Le terme « wird » (pluriel: awrad) désigne, dans le lexique, une portion fixe de récitation ou autre pratique; au sens technique, il s’agit de ce qu’une personne s’impose chaque jour ou chaque nuit comme acte régulier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} Le terme apparenté « hizb » désigne une pratique qu’une personne maintient, telle que la prière ou la récitation, et son sens technique ne diffère pas de son sens lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} Al-Ghazali considère l’awrad comme le chemin vers la rencontre avec Dieu, car l’amour et l’intimité ne naissent que du souvenir constant, ce qui implique de se détacher des préoccupations terrestres pour se concentrer sur l’essentiel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} La vertu du rappel est attestée par des passages du Coran dans plusieurs sourates (al-Ahzab, al-Ankabut, al-Nisa', al-Baqara) et par un hadith concernant ceux qui progressent en invoquant fréquemment Dieu. Ibn Abbas explique que le rappel se pratique après la prière, avant de s'endormir et en quittant son domicile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} L'âme se lassant d'un seul type d'acte, la variété des récompenses (awrad) les maintient agréables et durables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} La prière est la meilleure des récompenses, et sa moitié réside dans l'action extérieure et intérieure; six actes intérieurs doivent y être observés: la présence du cœur, la compréhension, le respect, la crainte révérencielle, l'espérance et la modestie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141} Il est recommandé d'assister à la prière en congrégation dans la mosquée la plus proche, au premier rang, et de s'abstenir de toute conversation profane. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140} La récitation du Coran est le meilleur des rappels, et sa durée varie selon le lecteur: celui qui est occupé à enseigner ou à juger se limite à ce qui ne perturbe pas son travail, tandis que d’autres récitent autant qu’ils le peuvent sans se fatiguer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} Le Coran est divisé en sept parties selon leur longueur; cette division est rapportée d’après un hadith d’Aws ibn Hudhayfa, dont Ibn Abd al-Barr a jugé l’authenticité incertaine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} Les invocations et les rappels transmis appartiennent à la récompense (awrad), tandis que l'invention de rappels non fondés sur le Coran et la Sunna est à éviter; al-Sha'rani rapporte un accord à cet effet, et Ibn Allan rapporte d'al-Nawawi que les pratiques des cheikhs peuvent être suivies lorsqu'elles ne s'écartent pas de la transmission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17143}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144} Le principe est la constance: un petit acte accompli régulièrement est aimé de Dieu, tandis qu'un acte abandonné perd son effet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145} Les sept awrad de la journée se déroulent de l'aube au coucher du soleil: d'abord la supplication, le rappel, la récitation et la réflexion après la prière de l'aube, puis la prière du matin, puis le travail et un repos de midi, puis la prière de l'après-midi, puis la réflexion sur le Coran dans l'après-midi, et enfin la glorification et la recherche du pardon jusqu'au coucher du soleil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17146}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17147}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17148} Les awrad nocturnes comprennent les prières volontaires entre maghrib et isha, la récitation des sourates transmises et le witr avant de dormir, un sommeil modéré, la prière nocturne en fin de nuit et la recherche du pardon à l'aube. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17149}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17150} Les awrad varient selon l'état de la personne: le dévot consacre son temps au culte et à la récitation; le savant à l'enseignement et à l'écriture; l'étudiant à l'apprentissage; le dirigeant donne la priorité aux besoins des musulmans sur ses propres awrad; l'artisan joint le souvenir à son travail et donne ce dont il n'a pas besoin; et celui qui est absorbé par l'amour de Dieu agit selon ce que sa pratique exige. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17151}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17152}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} Un wird manqué doit être rattrapé, et un hadith authentique rapporte que celui qui dort pendant sa prière de nuit et la récite entre l'aube et midi est considéré comme l'ayant récitée la nuit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} Certains mois, jours et nuits sont particulièrement méritoires pour la dévotion, et l'entrée renvoie à d'autres entrées pour plus de détails. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153}"
  ur: "Wird ⁦(کثرت awrad)⁩، لغت میں، تلاوت یا دیگر مشق کا ایک مقررہ حصہ ہے۔ تکنیکی معنوں میں یہ وہی ہے جو ایک شخص اپنے آپ کو ہر دن یا رات ایک باقاعدہ عمل کے طور پر متعین کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17137}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} متعلقہ اصطلاح حزب ایک ایسا عمل ہے جو ایک شخص جاری رکھتا ہے، جیسے نماز یا تلاوت، اور اس کا تکنیکی احساس لغت سے ہٹتا نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17138} الغزالی اوراد کو خدا سے ملنے کا راستہ مانتے ہیں، کیونکہ محبت اور قربت صرف یاد رکھنے سے حاصل ہوتی ہے، جس کے نتیجے میں دنیاوی فکروں کو چھوڑ کر ضرورت کی طرف جانا پڑتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17138} ذکر کی فضیلت کی تائید قرآن کی متعدد سورتوں ⁦(الاحزاب، العنکبوت، النساء، البقرہ)⁩ میں اور ایک حدیث سے ہوتی ہے جو اکثر خدا کو یاد کرتے ہوئے آگے بڑھتے ہیں۔ ابن عباس ذکر کی وضاحت کرتے ہیں جیسا کہ نماز کے بعد، سوتے وقت اور گھر سے نکلتے وقت کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17138}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} کیونکہ روح ایک قسم کے عمل سے تھک جاتی ہے، مختلف اوراد انہیں خوشگوار اور پائیدار رکھتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17139} نماز افضل ترین ہے اور اس کا نصف حق ظاہری اور باطنی کام ہے۔ اس میں چھ باطنی اعمال کا مشاہدہ کرنا ہے: قلب کی موجودگی، سمجھ، تعظیم، خوف، امید اور حیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17140}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141} قریبی مسجد میں پہلی صف میں اور دنیاوی گفتگو کے بغیر جماعت میں شرکت مستحب ہے۔ قرآن کی تلاوت بہترین ذکر ہے اور اس کی مقدار قاری کے لحاظ سے مختلف ہوتی ہے: ایک آدمی پڑھانے یا فیصلہ کرنے میں مصروف رہتا ہے جو اس کے کام میں خلل نہ ڈالے، اور دوسرے بغیر تھکے ہوئے جتنا ہو سکے تلاوت کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17141}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} قرآن کو لمبائی کے لحاظ سے سات حصوں میں تقسیم کیا گیا ہے۔ یہ تقسیم اوس بن حذیفہ کی ایک رپورٹ کے ذریعے بتائی گئی ہے، جسے ابن عبد البر نے مضبوطی سے قائم نہیں کیا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17142} منقول دعائیں اور نصیحتیں اوراد سے تعلق رکھتی ہیں، جبکہ ایسی یادیں وضع کرنا جن کی کتاب و سنت سے تائید نہیں ہوتی۔ الشرانی نے اس سلسلے میں ایک عہد لکھا ہے، اور ابن ایلن النووی سے روایت کرتے ہیں کہ شیخوں کے معمولات کی پیروی کی جاسکتی ہے جہاں وہ منتقلی سے الگ نہ ہوں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17143}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144} اصول استقامت ہے: ایک چھوٹا سا عمل جو باقاعدگی سے کیا جاتا ہے خدا کو پیارا ہوتا ہے، جب کہ ترک کیا گیا عمل اپنا اثر کھو دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17144}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145} سات دن کا اوورد طلوع فجر سے غروب آفتاب تک چلتا ہے: پہلے دعا، ذکر، تلاوت اور دعا، پھر دن کے بعد غور و فکر آرام، پھر دوپہر کے بعد نماز، پھر دوپہر میں قرآن کی تلاوت، اور آخر میں تسبیح اور غروب آفتاب تک استغفار۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17145}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17146}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17147}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17147}{cite:fiqh-mawsua-kuwaityya-noor-v3 p. رات کے اوارد میں مغرب اور عشاء کے درمیان نفلی نمازیں، سورتوں کی تلاوت اور سونے سے پہلے وتر، اعتدال کی نیند، رات کے آخری حصے میں رات کی نماز اور فجر کے وقت استغفار شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17149}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17150} اوراد انسان کی حالت کے مطابق مختلف ہوتی ہے: عبادت کرنے والا اپنا وقت عبادت اور تلاوت کے لیے دیتا ہے۔ پڑھانے اور لکھنے کا عالم؛ طالب علم سیکھنے کے لیے؛ حکمران مسلمانوں کی ضروریات کو اپنی ذات پر فوقیت دیتا ہے۔ کاریگر اپنے کام کو یاد کرتا ہے اور وہ چیز دیتا ہے جس کی اسے ضرورت نہیں ہوتی ہے۔ اور خدا کی محبت میں جذب ہونے والا شخص اس کے مطابق حرکت کرتا ہے جس کی اس کی مشق کی ضرورت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17151}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17152}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} ایک کہتا ہے کہ جس نے رات کو نیند پوری کر دی، وہ کہتا ہے کہ اس کی نیند پوری ہو جائے گی۔ فجر اور دوپہر کے درمیان حصہ ڈال کر پڑھنا گویا رات کو پڑھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17153} بعض مہینوں، دن اور راتوں کو عقیدت کے لیے اضافی فضیلت دی گئی ہے، اور اندراج کا حوالہ دوسرے عنوانات کی تفصیل ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17153}"
