label:
  ar: وِرْد
  en: Wird (litanies and daily devotional portions)
summary:
  ar: 'الورد في اللغة الوظيفة من قراءة ونحوها، والجمع أوراد، وفي الاصطلاح ما يرتّبه الإنسان على نفسه كل يوم أو ليلة من العمل، وهو ما يداوم عليه من صلاة وقراءة وذكر وغير ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} ويُذكر الحزب لفظاً قريباً منه بمعنى الورد الذي يعتاده الشخص، ولا يخرج المعنى الاصطلاحي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} وقد عدّ الغزالي الأوراد وسيلة إلى لقاء الله، لأن المحبة والأنس لا يحصلان إلا بدوام ذكر المحبوب، ولا يتيسر ذلك إلا بترك الدنيا والاكتفاء منها بقدر الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} ويستشهد لفضل الذكر بآيات من سور الأحزاب والعنكبوت والنساء والبقرة، وبحديث «سبق المفردون» وقد فسره ابن عباس بالذكر في أدبار الصلوات وعند النوم والخروج من المنزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} ولأن النفس تملّ الفن الواحد، فإن تنويع الأوراد من أسباب التلذذ بها والمداومة عليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} والصلاة أفضل الأوراد، ولها نصف يتعلق بالعمل ظاهراً وباطناً، وتراعى فيها الأعمال الباطنة الستة: الحضور، والفهم، والتعظيم، والهيبة، والرجاء، والحياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141} ويستحب المحافظة على الجماعة في أقرب المساجد، والصف الأول، وترك الكلام الدنيوي فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140} وتلاوة القرآن أفضل الأذكار، ويختلف قدرها بحال القارئ، فمن كان له شغل بنشر العلم أو القضاء بين الناس اقتصر على قدر لا يخل بشغله، ومن لم يكن كذلك استكثر ما أمكنه دون الملل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} وقد ذُكر تحزيب القرآن إلى سبعة أحزاب بحسب الطول، وهو مروي من طريق أوس بن حذيفة في السنن، وقد نقل ابن عبد البر أن الحديث فيه ليس بقائم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} والأذكار والأدعية المأثورة من الورد، ويُستحب فيها ألا تُبتدع أذكار لم يشهد لها الكتاب والسنة، وقد نقل الشعراني عهداً في تجنب البدع، ونقل ابن علان عن النووي جواز الاشتغال بأوراد المشايخ إذا لم تخالف المأثور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17143}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144} والأصل في الأوراد المداومة، فالعمل القليل الدائم أحب إلى الله، والمنقطع يتلاشى أثره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145} وأوراد النهار سبعة، من الفجر إلى الشروق بالدعاء والذكر والقراءة والفكر، ثم ما بعد الشروق وصلاة الضحى، ثم ما قبل الزوال بالكسب والقيلولة، ثم بعد الزوال إلى العصر بالصلاة، ثم إلى الاصفرار بالتدبر في القرآن، ثم إلى الغروب بالتسبيح والاستغفار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17146}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17147}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17148} ويشمل ورد الليل ما بين المغرب والعشاء من النوافل، ثم ما بعد العشاء بقراءة السور المأثورة والوتر قبل النوم، ثم النوم بقدر معتدل، ثم التهجد في الثلث الأخير، ثم السحر بالاستغفار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17149}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17150} واختلاف الأوراد باختلاف الأحوال: فالعابد يستغرق في الأذكار والتلاوة، والعالم يقدم التعليم والتصنيف لنفع الناس، والمتعلم يشتغل بالاستفادة، والوالي يقدم قضاء حوائج المسلمين على الأوراد، والمحترف يجمع الذكر إلى الكسب ويتصدق بما يفضل عنه، والمستغرق بمحبة الله يتحرك إلى ما يريد من ورده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17151}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17152}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} ومن فاته ورده استدركه، وقد كان بعض السلف يقضون أوراد الليل نهاراً، وفي الحديث الصحيح من نام عن حزبه فقرأه فيما بين الفجر والظهر كتب له كأنما قرأه من الليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} وتُخص بعض الأشهر والأيام والليالي بمزيد استحباب إحيائها، وتحيل المادة في تفصيلها إلى مداخل أخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153}'
  en: 'Wird (plural awrad) is, in the lexicon, a fixed portion of recitation or other practice; in the technical sense it is what a person sets himself each day or night as a regular act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17137}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} The related term hizb is a practice a person keeps up, such as prayer or recitation, and its technical sense does not depart from the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} Al-Ghazali treats the awrad as the path to meeting God, since love and intimacy come only from constant remembrance, which in turn needs leaving worldly concerns to what is necessary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138} The virtue of remembrance is supported by Qur''an passages in several surahs (al-Ahzab, al-Ankabut, al-Nisa'', al-Baqara) and by a hadith on those who go ahead by remembering God often; Ibn Abbas explains remembrance as practised after prayers, on going to sleep and on leaving home. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17138}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} Because the soul tires of one kind of act, varying the awrad keeps them pleasant and sustained. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17139} Prayer is the best of the awrad, and half of its right is the outward and inward work; six inward acts are to be observed in it: presence of heart, understanding, reverence, awe, hope and modesty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141} Attending the congregation in the nearest mosque, in the first row, and without worldly talk is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17140} Recitation of the Qur''an is the best remembrance, and its amount varies with the reader: a man busy with teaching or judging keeps to what does not disturb his work, and others recite as much as they can without tiring. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17141}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} The Qur''an is divided into seven portions by length; the division is reported through a report from Aws ibn Hudhayfa, which Ibn Abd al-Barr judged not firmly established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17142} Transmitted supplications and remembrances belong to the awrad, while devising remembrances unsupported by the Book and the sunna is to be avoided; al-Sha''rani records a covenant to that effect, and Ibn Allan reports from al-Nawawi that the practices of the shaykhs may be followed where they do not depart from the transmitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17143}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144} The principle is constancy: a small act done regularly is loved by God, while an act abandoned loses its effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17144}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145} The seven daytime awrad run from dawn to sunset: first the supplication, remembrance, recitation and reflection after the dawn prayer, then the forenoon prayer, then work and a midday rest, then the prayer after noon, then Qur''an reflection in the afternoon, and finally glorification and seeking forgiveness until sunset. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17145}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17146}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17147}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17148} The night awrad include the voluntary prayers between maghrib and isha, the recitation of transmitted surahs and the witr before sleep, moderate sleep, the night prayer in the later part of the night, and seeking forgiveness at dawn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17149}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17150} The awrad vary with the state of the person: the devotee gives his time to worship and recitation; the scholar to teaching and writing; the student to learning; the ruler gives the needs of Muslims precedence over his own awrad; the craftsman joins remembrance to his work and gives away what he does not need; and one absorbed in love of God moves according to what his practice calls for. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17151}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17152}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} A missed wird should be made up, and a sound report says that whoever sleeps through his night portion and reads it between dawn and noon is credited as if he read it at night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153} Certain months, days and nights are given extra merit for devotion, and the entry refers the detail to other headwords. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17153}'
