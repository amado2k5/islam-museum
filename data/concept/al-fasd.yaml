id: concept/al-fasd
class: concept
kind: scientific
label: { ar: "الفصد", en: "Venesection, or bloodletting (al-fasd)", fr: "La saignée, ou phlébotomie (al-fasd)", ur: "فصد، یعنی رگ کھولنا", es: "Venopunción o sangría (al-fasd)", tr: "flebitum", id: "flebitum" }
summary:
  ar: "الفصد عند ابن سينا استفراغ كلّي يخفّف كثرة الأخلاط، وهو أحد وجوه المعالجة بأعمال اليد، وقد أفرد له في الفن الرابع من الكتاب الأول فصلاً، وأقام فيه الكلام على من يُفصد ومن يُحذر عليه، وعلى ضيق الشق وسعته، وعلى عروق الذراع الستة وخطر الشريان تحت الباسليق {cite:canon-ibn-sina-print-v1 pp.289-295}. ويعرض القانون الحجامة والعلق في فصلين تاليين، فالفصد في ميزانه غير الحجامة {cite:canon-ibn-sina-print-v1 p.299}."
  en: "For Ibn Sina venesection is a general evacuation that relieves a plethora of the humours, one of the manual modes of treatment. The fourth fann of Book I gives it its own chapter, covering who may be bled and who should be spared, narrow and wide incisions, the six veins of the arm, and the danger of the artery lying under the basilic vein {cite:canon-ibn-sina-print-v1 pp.289-295}. The Canon treats cupping and leeches in the chapters that follow, so for Ibn Sina bloodletting is a different procedure from cupping {cite:canon-ibn-sina-print-v1 p.299}."
  fr: "Pour Ibn Sina, la saignée est une évacuation générale destinée à soulager une pléthore d’humeurs, et l’un des modes de traitement manuels. Le quatrième fann du Livre I lui consacre un chapitre : qui saigner et qui épargner, incisions étroites et larges, les six veines du bras et le danger de l’artère située sous la veine basilique {cite:canon-ibn-sina-print-v1 pp.289-295}. Le Canon aborde les ventouses et les sangsues dans les chapitres suivants : Ibn Sina distingue donc la saignée de la pose de ventouses {cite:canon-ibn-sina-print-v1 p.299}."
  ur: "ابن سینا کے نزدیک فصد ایک کلی استفراغ ہے جو اخلاط کی کثرت کو کم کرتا ہے اور ہاتھ کے اعمال سے علاج کا ایک طریقہ ہے۔ پہلی کتاب کے چوتھے فن میں اس کا الگ فصل ہے جس میں بتایا گیا ہے کہ کس کا فصد کھولا جائے اور کس سے احتراز ہو، شگاف تنگ ہو یا کشادہ، بازو کی چھ رگیں کون سی ہیں، اور باسلیق کے نیچے شریان کا خطرہ کیا ہے {cite:canon-ibn-sina-print-v1 pp.289-295}۔ قانون حجامت اور جونکوں کو اگلے فصلوں میں الگ بیان کرتا ہے، یعنی ابن سینا کے ہاں فصد حجامت سے مختلف عمل ہے {cite:canon-ibn-sina-print-v1 p.299}۔"
  es: "Para Ibn Sina, la flebotomía es una evacuación general que alivia una gran cantidad de humores, uno de los métodos manuales de tratamiento. El cuarto fann del Libro I le dedica un capítulo propio, donde se aborda quiénes pueden ser sometidos a sangría y quiénes deben ser excluidos, las incisiones estrechas y anchas, las seis venas del brazo y el peligro de la arteria situada bajo la vena basílica {cite:canon-ibn-sina-print-v1 pp.289-295}. El Canon trata la ventosaterapia y las sanguijuelas en los capítulos siguientes, por lo que para Ibn Sina la sangría es un procedimiento diferente a la ventosaterapia {cite:canon-ibn-sina-print-v1 p.299}."
  tr: "İbn Sina'ya göre, flebit, aşırı humoru azaltan tam bir kusmadır. Bu, el emeğiyle tedavi yöntemlerinden biridir. İlk kitabın dördüncü sanatında buna bir bölüm ayırmıştır; kimlerin beneklendiğini ve kimlerin uyarıda bulunduğunu, çatlağın darlığını ve genişliğini, kolun altı damarını ve basiliq altındaki arterin tehlikesini tartışır {cite:canon-ibn-sina-print-v1 s.289-295}. Kanon, kupa ve 'alaq'ı sonraki iki bölümde sunar, bu nedenle flegmoloji ölçeği olarak kupa sıkmasından farklıdır {cite:canon-ibn-sina-print-v1 s.299}."
  id: "Menurut Ibn Sina, flebitis adalah muntah total yang mengurangi humor berlebihan. Ini adalah salah satu metode pengobatan yang dibuat dengan tangan. Dalam seni keempat buku pertama, ia mendedikasikan satu bab untuk hal ini; membahas siapa yang terlihat dan siapa yang memperingatkan, sempit dan lebar retakan, pembuluh darah di bawah lengan, serta bahaya arteri di bawah basilika. {cite:canon-ibn-sina-print-v1 hlm.289-295}. Kanon menyajikan cangkir dan 'alaq' dalam dua bagian berikutnya, sehingga berbeda dari skala cup-squeeze sebagai skala flegmologi {cite:canon-ibn-sina-print-v1 hlm.299}."
