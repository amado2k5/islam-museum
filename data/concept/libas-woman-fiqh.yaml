id: concept/libas-woman-fiqh
class: concept
kind: legal
label:
  ar: "لِباس المرأة"
  en: "Women's clothing (libas al-mar'a), fiqh rulings"
  ur: "عورت کا لباس (فقہی احکام)"
summary:
  ar: "اللباس ما يستر الجسم، جمعه ألبسة ولُبُس؛ والزوج والزوجة كل منهما لباس للآخر، وهو ما ورد في سورة البقرة (الآية ١٨٧) دون نقل نصها هنا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13563}. والزينة أعم من اللباس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13563}."
  en: "Libas is what covers the body; its plural is albisa and lubus. Husband and wife are each a garment for the other, as the surah of the Cow says (verse 187), without quoting the text here {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13563}. Zina, adornment, is wider than libas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13563}."
  ur: "لباس وہ ہے جو جسم کو ڈھانپے؛ جمع البسہ اور لُبُس ہے۔ میاں بیوی ایک دوسرے کا لباس ہیں، جیسا کہ سورۂ بقرہ (آیت ۱۸۷) میں ہے، جس کا نص یہاں نقل نہیں کیا گیا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13563}۔ زینت لباس سے عام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13563}۔"
