label: { ar: "أمارة", en: "Amara (indication: the probable evidence in usul)" }
summary:
  ar: "الأمارة لغة العلامة، وعند الأصوليين الدليل الظني، وهو ما يمكن التوصل بصحيح النظر فيه إلى مطلوب خبري ظني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} ويفترق عن الدليل والعلامة والوصف المخيل والقرينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} ويأخذ الفقهاء بالأمارات في القبلة والبلوغ، وفي القضاء اختلفوا في الحكم بها، وقد استدل بعضهم بقصة قميص يوسف، واحتج آخرون بحديث لو كنت راجما أحدا بغير بينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}"
  en: "Amara is a sign in the lexical sense, and for the usulis a probable evidence: that by which correct reasoning reaches a probable factual conclusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} It differs from proof, from a mark, from a suggestive attribute and from a presumptive circumstance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} Jurists rely on indicators for the qibla and for puberty; in judging by indicators they differ, some citing the story of Joseph's shirt and others the hadith on the woman accused without proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}"
