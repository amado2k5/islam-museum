label: { ar: "أمارة", en: "Amara (indication: the probable evidence in usul)", fr: "Amara (indice : la preuve probable dans les fondements du droit)", es: "Amara (indicación: la evidencia probable en usul)", ur: "عمارہ ⁦(اشارہ: اصول میں امکانی ثبوت)⁩", tr: "Emirlik", id: "Emirlik" }
summary:
  ar: "الأمارة لغة العلامة، وعند الأصوليين الدليل الظني، وهو ما يمكن التوصل بصحيح النظر فيه إلى مطلوب خبري ظني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} ويفترق عن الدليل والعلامة والوصف المخيل والقرينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} ويأخذ الفقهاء بالأمارات في القبلة والبلوغ، وفي القضاء اختلفوا في الحكم بها، وقد استدل بعضهم بقصة قميص يوسف، واحتج آخرون بحديث لو كنت راجما أحدا بغير بينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}"
  en: "Amara is a sign in the lexical sense, and for the usulis a probable evidence: that by which correct reasoning reaches a probable factual conclusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} It differs from proof, from a mark, from a suggestive attribute and from a presumptive circumstance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} Jurists rely on indicators for the qibla and for puberty; in judging by indicators they differ, some citing the story of Joseph's shirt and others the hadith on the woman accused without proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}"
  fr: "Au sens lexical, amara signifie « signe » ; pour les spécialistes des fondements du droit, c’est un indice de probabilité, ce par quoi un raisonnement correct aboutit à une conclusion de fait probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} Elle se distingue de la preuve, de la marque, de l’attribut suggestif et de la circonstance présomptive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} Les juristes se fient à des indices pour déterminer la qibla et reconnaître la puberté. Ils divergent sur leur emploi en justice : certains citent le récit de la chemise de Joseph, d’autres le hadith sur la femme accusée sans preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}"
  es: "Amara es un signo en el sentido léxico, y para los usulis una evidencia probable: aquello por lo cual el razonamiento correcto llega a una conclusión fáctica probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} Se diferencia de la prueba, de una marca, de un atributo sugestivo y de una circunstancia presuntiva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334} Los juristas se basan en indicadores para la qibla y para la pubertad; al juzgar por indicadores difieren, algunos citan la historia de la camisa de José y otros el hadiz sobre la mujer acusada sin prueba. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3334}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}"
  ur: "عمارہ لغوی معنوں میں ایک علامت ہے، اور اصول کے لیے ایک ممکنہ ثبوت ہے: جس کے ذریعے صحیح استدلال کسی ممکنہ حقیقت پر مبنی نتیجے پر پہنچتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3333}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3334} یہ ثبوت سے، نشان سے، ایک مشتبہ صفت سے اور قیاس کے حالات سے مختلف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3334} فقہاء قبلہ اور بلوغت کے اشارے پر انحصار کرتے ہیں۔ اشارے سے فیصلہ کرنے میں ان میں اختلاف ہے، کچھ جوزف کی قمیض کی کہانی کا حوالہ دیتے ہیں اور کچھ نے بغیر ثبوت کے الزام والی عورت پر حدیث کا حوالہ دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3334}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3335}"
  tr: "İşaret, işaretin dilidir ve usul bilginleri arasında muhtemel kanıttır; bu da doğru şekilde spekülatif bir beyan gerekliliği olarak kabul edilebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3334} ve kanıt, işaret, tanım ve gösterimden farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3334} Hukukçular kıblah ve ergenlikle ilgili işaretleri kabul ederler, ancak yargıda bunlar hakkında karar vermekte farklılık gösterirler. Bazıları Yusuf'un gömleği hikayesini aktarırken, diğerleri 'Kanıtsız birini taşlasan.' hadisini aktarmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3334} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3335}"
  id: "İşaret, işaretin dilidir ve usul bilginleri arasında muhtemel kanıttır; bu da doğru şekilde spekülatif bir beyan gerekliliği olarak kabul edilebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3334} ve kanıt, işaret, tanım ve gösterimden farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3334} Hukukçular kıblah ve ergenlikle ilgili işaretleri kabul ederler, ancak yargıda bunlar hakkında karar vermekte farklılık gösterirler. Bazıları Yusuf'un gömleği hikayesini aktarırken, diğerleri 'Kanıtsız birini taşlasan.' hadisini aktarmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3334} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3335}"
