label:
  ar: "الكرم"
  en: "Generosity (karam)"
  ur: "کرم (سخاوت)"
summary:
  ar: "الكرم عند الشيخ عمر عبد الكافي أن يعطي المرء فلا يسأل لمن أعطى ولا كم أعطى {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:13:00}. ويرى أن هذا المعنى لا ينطبق على الحقيقة إلا على الله {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:14:00}، الذي يرزق الجميع ويُبقي لهم الشمس والمطر والهواء {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:15:00}."
  en: "For Sheikh Omar Abdelkafy, generosity (karam) is to give without asking to whom one gives or how much {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:13:00}. He holds that this meaning truly applies only to God {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:14:00}, who provides for everyone and leaves the sun, the rain and the air for them {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:15:00}."
  ur: "شیخ عمر عبد الکافی کے نزدیک کرم یہ ہے کہ آدمی دے اور یہ نہ پوچھے کہ کسے دیا اور کتنا دیا {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:13:00}۔ ان کی رائے ہے کہ یہ معنی حقیقت میں صرف اللہ پر صادق آتا ہے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:14:00}، جو سب کو رزق دیتا ہے اور ان کے لیے سورج، بارش اور ہوا باقی رکھتا ہے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:15:00}۔"
