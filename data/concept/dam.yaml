summary:
  ar: "الدم المستعمل في الأدوية يُؤخذ من حيوان سليم، وأكثر ما يُنقل عنه غير معتمد، والكتاب يذكره بهذا التحفظ. {cite:canon-ibn-sina-print-v1 p.442}"
  en: "The blood used in remedies is taken from a healthy animal; much of what is reported about blood is not reliable, and the book records it with that caution. {cite:canon-ibn-sina-print-v1 p.442}"
  ur: "دوا میں استعمال ہونے والا خون صحت مند جانور کا ہونا چاہیے؛ خون کے بارے میں جو کچھ نقل ہوتا ہے اس کا بیشتر حصہ قابل اعتماد نہیں، اور کتاب اسے اسی احتیاط سے لکھتی ہے۔ {cite:canon-ibn-sina-print-v1 p.442}"
  es: "La sangre utilizada en los remedios se obtiene de un animal sano; gran parte de lo que se dice sobre la sangre no es fiable, y el libro lo registra con esa cautela. {cite:canon-ibn-sina-print-v1 p.442}"
  fr: "Le sang utilisé dans les remèdes provient d'un animal sain; une grande partie de ce qui est rapporté au sujet du sang n'est pas fiable, et le livre le mentionne avec prudence. {cite:canon-ibn-sina-print-v1 p.442}"
  tr: "İlaçlarda kullanılan kan sağlıklı bir hayvandan alınır ve iletilen verilerin çoğu buna dayanmaz; kitapta bu çekinceden bahsedilir. {kaynak:kanon-ibn-sina-print-v1 s.442}"
  id: "Darah yang digunakan dalam obat-obatan diambil dari hewan yang sehat, dan sebagian besar data yang dikirimkan tidak dijadikan dasar keberadaan, dan buku ini menyebutkan keberatan ini. {cite:canon-ibn-sina-print-v1 hlm.442}"
