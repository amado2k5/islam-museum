  es: "Estreñimiento en lactantes en el Canon"
summary:
  ar: "يذكر ابن سينا اعتقال الطبيعة عند الصبيان وعلاجه بالشيافات والعسل وعلك البطم وتمريخ البطن بالزيت وتلطيخ السرة، ثم لذع اللثة وتكميده {cite:canon-ibn-sina-print-v1 p.212}."
  en: "Ibn Sina mentions constipation in infants and its treatment with suppositories, honey, terebinth gum, gentle oiling of the belly and smearing the navel, then a stinging of the gum and its fomenting {cite:canon-ibn-sina-print-v1 p.212}."
  fr: "Ibn Sina mentionne la constipation du nourrisson et ses traitements : suppositoires, miel, gomme de térébinthe, onction douce du ventre et enduit ombilical ; puis irritation gingivale et fomentation {cite:canon-ibn-sina-print-v1 p.212}."
  es: "Ibn Sina menciona el estreñimiento en los bebés y su tratamiento con supositorios, miel, goma de terebinto, un suave engrasado del vientre y untado del ombligo, luego un escozor de la goma y su estimulación {cite:canon-ibn-sina-print-v1 p.212}."
