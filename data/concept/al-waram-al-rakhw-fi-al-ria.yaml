"id": "concept/al-waram-al-rakhw-fi-al-ria"
"class": "concept"
"kind": "scientific"
"label":
  "ar": "الورم الرخو في الرئة"
  "en": "The soft tumour in the lung"
  "fr": "Tumeur molle du poumon"
  "ur": "پھیپھڑے میں نرم ورم"
  "es": "El tumor blando en el pulmón"
  "tr": "Yumuşak akciğer tümörü"
  "id": "Tumor paru-paru lunak"
"summary":
  "ar": "قد يعرض في الرئة الورم الرخو، ويدل عليه ضيق نفس مع بصاق كثير ورطوبة في الصدر\
    \ من غير حرارة كثيرة ولا حمرة في الوجه بل رصاصية {cite:canon-ibn-sina-print-v2\
    \ p.352}"
  "en": "A soft tumour may occur in the lung; it is indicated by a shortness of breath\
    \ with much spittle, a moisture in the chest without much heat, and no redness\
    \ on the face — rather a leaden colour {cite:canon-ibn-sina-print-v2 p.352}"
  "fr": "Une tumeur molle peut se former dans le poumon. Le Canon l’associe à un essoufflement accompagné de crachats abondants, à une humidité dans la poitrine sans grande chaleur et à un teint du visage non pas rouge, mais plutôt plombé {cite:canon-ibn-sina-print-v2 p.352}"
  "ur": "پھیپھڑے میں نرم ورم ہو سکتا ہے اور اس کی دلیل تنگی نفس ہے زیادہ تھوک کے ساتھ\
    \ اور سینے میں نمی بغیر زیادہ گرمی کے اور چہرے پر سرخی نہیں بلکہ سیسہ جیسا رنگ\
    \ {cite:canon-ibn-sina-print-v2 p.352}"
  "es": "Puede aparecer un tumor blando en el pulmón; se manifiesta con dificultad para respirar con mucha saliva, humedad en el pecho sin mucho calor y ausencia de enrojecimiento facial, más bien un color predominante {cite:canon-ibn-sina-print-v2 p.352}"
  "tr": "Akciğerde yumuşak bir tümör ortaya çıkabilir; bu, nefes darlığı, göğüste çok fazla tükürük ve nem ile belirtilebilir, çok fazla ısı veya yüz kızarıklığı olmadan, bunun yerine kurşun olabilir {cite:canon-ibn-sina-print-v2 s.352}"
  "id": "Tumor lunak dapat berkembang di paru-paru; ini mungkin menunjukkan sesak napas, air liur berlebih, dan kelembapan di dada, tanpa panas berlebihan atau wajah memerah, tetapi timbal dapat muncul {cite:canon-ibn-sina-print-v2 hlm.352}"
