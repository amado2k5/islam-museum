label:
  ar: المؤمن
  en: Mu'min (believer)
  ur: مومن
summary:
  ar: "المؤمن في اصطلاح أهل السنة من آمن بما جاء به النبي واعترف له بكل ما قاله وأخبره — «نسمّي أهل قبلتنا مسلمين مؤمنين ما داموا بما جاء به النبي ولمعترفين» {cite:aqida-tahawiyya §73}؛ ويفرد ابن تيمية كتاب الإيمان لتحقيق معناه ونزاع المتكلمين فيه {cite:kitab-iman-ibn-taymiyya}."
  en: "The mu'min in Sunni usage is one who believes what the Prophet brought and acknowledges all he said and informed — 'we name the people of our qibla Muslims and believers, so long as they hold what the Prophet brought and acknowledge all he said' {cite:aqida-tahawiyya §73}; Ibn Taymiyya's Kitab al-Iman is devoted to defining it and the theologians' dispute over it {cite:kitab-iman-ibn-taymiyya}."
