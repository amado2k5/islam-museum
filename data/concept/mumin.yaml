label:
  ar: المؤمن
  en: Mu'min (believer)
  ur: مومن
  es: "Mu'min (creyente)"
  fr: "Mu'min (croyant)"
  tr: "inanan"
  id: "orang percaya"
summary:
  ar: "المؤمن في اصطلاح أهل السنة من آمن بما جاء به النبي واعترف له بكل ما قاله وأخبره — «نسمّي أهل قبلتنا مسلمين مؤمنين ما داموا بما جاء به النبي ولمعترفين» {cite:aqida-tahawiyya §73}؛ ويفرد ابن تيمية كتاب الإيمان لتحقيق معناه ونزاع المتكلمين فيه {cite:kitab-iman-ibn-taymiyya}."
  en: "The mu'min in Sunni usage is one who believes what the Prophet brought and acknowledges all he said and informed — 'we name the people of our qibla Muslims and believers, so long as they hold what the Prophet brought and acknowledge all he said' {cite:aqida-tahawiyya §73}; Ibn Taymiyya's Kitab al-Iman is devoted to defining it and the theologians' dispute over it {cite:kitab-iman-ibn-taymiyya}."
  es: "El mu'min en el uso sunita es aquel que cree en lo que el Profeta trajo y reconoce todo lo que dijo e informó: \"llamamos musulmanes y creyentes a la gente de nuestra qibla, siempre que mantengan lo que el Profeta trajo y reconozcan todo lo que dijo\" {cite:aqida-tahawiyya §73}; el Kitab al-Iman de Ibn Taymiyya está dedicado a definirlo y a la disputa de los teólogos al respecto {cite:kitab-iman-ibn-taymiyya}."
  fr: "Le mu'min, dans l'usage sunnite, est celui qui croit ce que le Prophète a apporté et reconnaît tout ce qu'il a dit et transmis — « nous appelons musulmans et croyants les gens de notre qibla, tant qu'ils adhèrent à ce que le Prophète a apporté et reconnaissent tout ce qu'il a dit » {cite:aqida-tahawiyya §73}; le Kitab al-Iman d'Ibn Taymiyya est consacré à sa définition et à la controverse théologique à ce sujet {cite:kitab-iman-ibn-taymiyya}."
  ur: "سنی استعمال میں مؤمن وہ ہے جو نبی کی لائی ہوئی باتوں کو مانتا ہے اور جو کچھ اس نے بتایا ہے اس کو تسلیم کرتا ہے - 'ہم اپنے قبلہ کے لوگوں کو مسلمان اور مومنین کا نام دیتے ہیں، جب تک کہ وہ اس بات پر قائم رہیں جو نبی نے لایا ہے اور ان کی تمام باتوں کو تسلیم کرتے ہیں'۔ ابن تیمیہ کی کتاب الایمان اس کی تعریف کرنے کے لیے وقف ہے اور اس پر ماہرین الہیات کا اختلاف {حوالہ: کتاب ایمان ابن تیمیہ}۔"
  tr: "Ehl-sünnet terminolojisinde, mümin, Peygamber'in getirdiğine inanan ve söylediklerini ve anlattıklarını kabul eden kişidir — \"Kıble müminlerimizin insanlarına, Peygamber'in getirdiklerini kabul ettikleri sürece müminler deriz\" {cite:aqida-tahawiyya §73}; İbn Teymiye, anlamını doğrulamak ve teologlar arasındaki tartışmayı doğrulamak için İnan Kitabı'nı seçer {cite:kitab-iman-ibn-teymiye}."
  id: "Dalam istilah Ahl al-Sunnah, seorang mukmin adalah seseorang yang percaya pada apa yang dibawa Nabi dan mengakui segala yang Ia katakan dan informasikan — \"Kami menyebut umat umat qibla kami sebagai orang beriman selama mereka menerima apa yang dibawa Nabi\" {cite:aqida-tahawiyya §73}; Ibn Taymiyyah menyoroti Kitab Iman untuk memverifikasi makna dan perselisihannya di antara para teolog {cite:kitab-iman-ibn-taymiyya}."
