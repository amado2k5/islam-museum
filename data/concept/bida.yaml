label:
  ar: البدعة والمحدثات
  en: Bid'a (religious innovation)
  fr: "Bid'a (innovation religieuse)"
  es: "Bid'a (innovación religiosa)"
summary:
  ar: "إحداث ما لم يكن عليه أمر الشارع في الدين؛ يجعل ابن رجب حديث عائشة «من أحدث في أمرنا هذا ما ليس منه فهو رد» ميزاناً للأعمال في ظاهرها، كما أن حديث «إنما الأعمال بالنيات» ميزان لها في باطنها، فكل عمل لا يكون عليه أمر الله ورسوله فهو مردود على عامله، وكل من أحدث في الدين ما لم يأذن به الله ورسوله فليس من الدين في شيء؛ وقرن ذلك بحديث العرباض بن سارية «وإياكم ومحدثات الأمور فإن كل محدثة بدعة وكل بدعة ضلالة» وأجل تفصيل الكلام على المحدثات إلى شرحه ⁦(الحديث الثامن والعشرين)⁩؛ وفي ذلك الشرح يجعل «إياكم ومحدثات الأمور فإن كل بدعة ضلالة» تحذيراً للأمة من اتباع الأمور المحدثة المبتدعة أكده بعموم «كل بدعة ضلالة»، ويعرف البدعة المرادة بأنها ما أحدث مما لا أصل له في الشريعة يدل عليه — فأما ما كان له أصل من الشرع يدل عليه فليس ببدعة شرعاً وإن كان بدعة لغةً؛ ويقرنه بخطبة جابر في صحيح مسلم «شر الأمور محدثاتها وكل بدعة ضلالة» وبهديه في أنسنة الفقه بأن المراد بالراشدين من عرف الحق واتبعه خلاف الغاوي الذي عرفه ولم يتبعه والضال الذي لم يعرفه بالكلية، وبتقرير أن «فسيرى اختلافاً كثيراً» إخبار بما وقع في الأمة من اختلاف في الأصول والفروع ⁦(جامع العلوم والحكم ص 581–601)⁩."
  en: "Introducing into religion what the Lawgiver's command did not bring; Ibn Rajab makes Aisha's hadith 'whoever introduces into this matter of ours what is not of it has it rejected' the scale of deeds in their outward form, as the hadith of intentions is their scale inwardly: every act not upon the command of God and His Messenger is thrown back at its doer, and whoever introduces into religion what God and His Messenger did not permit is no part of the religion; he pairs it with al-Irbad ibn Sariya's hadith 'beware of newly introduced matters, for every innovation is an error', deferring the detailed discussion of innovations to his commentary on it (hadith 28); in that commentary he reads 'beware of novelties, for every innovation is error' as a warning to the community against following invented matters, emphasised by the universal 'every innovation is error', and defines the intended innovation as what is introduced with no foundation in the Law to indicate it — whatever does have a legal basis is no innovation in the legal sense though it may be one linguistically; he couples it with Jabir's sermon report in Sahih Muslim 'the worst of matters are their novelties and every innovation is error', with his account of the Rightly Guided as those who know the truth and follow it — unlike the ghawi who knows and does not follow and the dall who does not know at all — and with his reading of 'you will see much disagreement' as foretelling the community's divergence in roots and branches (Jami' al-Ulum wal-Hikam pp. 581–601)."
  fr: "Introduction dans la religion de ce que le Législateur n’a pas ordonné. Ibn Rajab fait du hadith d’Aisha sur le rejet de l’ajout étranger à la religion la mesure extérieure des actes, et de celui des intentions leur mesure intérieure. Tout acte non conforme à l’ordre de Dieu et de Son Messager est rejeté ; un ajout non autorisé ne relève pas de la religion. Il y associe l’avertissement d’al-Irbad ibn Sariya contre les nouveautés, toute innovation étant égarement, et renvoie à son commentaire du vingt-huitième hadith. Il y voit un avertissement général contre les inventions, définissant l’innovation visée par l’absence de fondement dans la Loi ; un acte fondé juridiquement n’est pas une innovation juridique, même s’il l’est linguistiquement. Il rapproche ce propos du sermon de Jabir dans Sahih Muslim jugeant les nouveautés les pires choses, distingue les bien-guidés qui connaissent et suivent la vérité de celui qui sait sans suivre et de celui qui ignore, et interprète l’annonce de nombreuses divergences comme celle des désaccords de la communauté dans les fondements et les branches (Jami' al-Ulum wal-Hikam, p. 581–601)."
  es: "Introducir en la religión lo que el mandato del Legislador no trajo; Ibn Rajab hace que el hadiz de Aisha 'quien introduce en este asunto nuestro lo que no es de él, es rechazado' la escala de los actos en su forma externa, así como el hadiz de las intenciones es su escala interna: todo acto que no sea por mandato de Dios y Su Mensajero es devuelto a quien lo realiza, y quien introduce en la religión lo que Dios y Su Mensajero no permitieron no es parte de la religión; lo empareja con el hadiz de al-Irbad ibn Sariya 'cuidado con los asuntos recién introducidos, pues toda innovación es un error', aplazando la discusión detallada de las innovaciones a su comentario sobre ello (hadiz 28); En ese comentario, lee «cuidado con las novedades, pues toda innovación es un error» como una advertencia a la comunidad contra seguir asuntos inventados, enfatizada por el universal «toda innovación es un error», y define la innovación intencionada como aquello que se introduce sin fundamento en la Ley que lo indique; todo lo que tiene una base legal no es una innovación en el sentido legal, aunque pueda serlo lingüísticamente; lo relaciona con el informe del sermón de Jabir en Sahih Muslim «lo peor de los asuntos son sus novedades y toda innovación es un error», con su descripción de los Bien Guiados como aquellos que conocen la verdad y la siguen —a diferencia del ghawi que sabe y no la sigue y del dall que no sabe en absoluto— y con su lectura de «veréis mucho desacuerdo» como presagio de la divergencia de la comunidad en raíces y ramas (Jami' al-Ulum wal-Hikam pp. 581–601)."
