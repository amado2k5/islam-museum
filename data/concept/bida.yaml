label:
  ar: البدعة والمحدثات
  en: Bid'a (religious innovation)
summary:
  ar: "إحداث ما لم يكن عليه أمر الشارع في الدين؛ يجعل ابن رجب حديث عائشة «من أحدث في أمرنا هذا ما ليس منه فهو رد» ميزاناً للأعمال في ظاهرها، كما أن حديث «إنما الأعمال بالنيات» ميزان لها في باطنها، فكل عمل لا يكون عليه أمر الله ورسوله فهو مردود على عامله، وكل من أحدث في الدين ما لم يأذن به الله ورسوله فليس من الدين في شيء؛ وقرن ذلك بحديث العرباض بن سارية «وإياكم ومحدثات الأمور فإن كل محدثة بدعة وكل بدعة ضلالة» وأجل تفصيل الكلام على المحدثات إلى شرحه (الحديث الثامن والعشرين)."
  en: "Introducing into religion what the Lawgiver's command did not bring; Ibn Rajab makes Aisha's hadith 'whoever introduces into this matter of ours what is not of it has it rejected' the scale of deeds in their outward form, as the hadith of intentions is their scale inwardly: every act not upon the command of God and His Messenger is thrown back at its doer, and whoever introduces into religion what God and His Messenger did not permit is no part of the religion; he pairs it with al-Irbad ibn Sariya's hadith 'beware of newly introduced matters, for every innovation is an error', deferring the detailed discussion of innovations to his commentary on it (hadith 28)."
