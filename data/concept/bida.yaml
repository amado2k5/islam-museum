label:
  ar: البدعة والمحدثات
  en: Bid'a (religious innovation)
summary:
  ar: "إحداث ما لم يكن عليه أمر الشارع في الدين؛ يجعل ابن رجب حديث عائشة «من أحدث في أمرنا هذا ما ليس منه فهو رد» ميزاناً للأعمال في ظاهرها، كما أن حديث «إنما الأعمال بالنيات» ميزان لها في باطنها، فكل عمل لا يكون عليه أمر الله ورسوله فهو مردود على عامله، وكل من أحدث في الدين ما لم يأذن به الله ورسوله فليس من الدين في شيء؛ وقرن ذلك بحديث العرباض بن سارية «وإياكم ومحدثات الأمور فإن كل محدثة بدعة وكل بدعة ضلالة» وأجل تفصيل الكلام على المحدثات إلى شرحه (الحديث الثامن والعشرين)؛ وفي ذلك الشرح يجعل «إياكم ومحدثات الأمور فإن كل بدعة ضلالة» تحذيراً للأمة من اتباع الأمور المحدثة المبتدعة أكده بعموم «كل بدعة ضلالة»، ويعرف البدعة المرادة بأنها ما أحدث مما لا أصل له في الشريعة يدل عليه — فأما ما كان له أصل من الشرع يدل عليه فليس ببدعة شرعاً وإن كان بدعة لغةً؛ ويقرنه بخطبة جابر في صحيح مسلم «شر الأمور محدثاتها وكل بدعة ضلالة» وبهديه في أنسنة الفقه بأن المراد بالراشدين من عرف الحق واتبعه خلاف الغاوي الذي عرفه ولم يتبعه والضال الذي لم يعرفه بالكلية، وبتقرير أن «فسيرى اختلافاً كثيراً» إخبار بما وقع في الأمة من اختلاف في الأصول والفروع (جامع العلوم والحكم ص 581–601)."
  en: "Introducing into religion what the Lawgiver's command did not bring; Ibn Rajab makes Aisha's hadith 'whoever introduces into this matter of ours what is not of it has it rejected' the scale of deeds in their outward form, as the hadith of intentions is their scale inwardly: every act not upon the command of God and His Messenger is thrown back at its doer, and whoever introduces into religion what God and His Messenger did not permit is no part of the religion; he pairs it with al-Irbad ibn Sariya's hadith 'beware of newly introduced matters, for every innovation is an error', deferring the detailed discussion of innovations to his commentary on it (hadith 28); in that commentary he reads 'beware of novelties, for every innovation is error' as a warning to the community against following invented matters, emphasised by the universal 'every innovation is error', and defines the intended innovation as what is introduced with no foundation in the Law to indicate it — whatever does have a legal basis is no innovation in the legal sense though it may be one linguistically; he couples it with Jabir's sermon report in Sahih Muslim 'the worst of matters are their novelties and every innovation is error', with his account of the Rightly Guided as those who know the truth and follow it — unlike the ghawi who knows and does not follow and the dall who does not know at all — and with his reading of 'you will see much disagreement' as foretelling the community's divergence in roots and branches (Jami' al-Ulum wal-Hikam pp. 581–601)."
