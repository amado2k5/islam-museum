label:
  ar: "التركة"
  en: "Tarika (the estate of a deceased person)"
  ur: "ترکہ (میت کا مال و حقوق)"
summary:
  ar: "التركة ما يخلفه الميت من أموال وحقوق، وعند الحنفية المال وحده. تنتقل إلى الورثة بعد موت المورث، وتقدم الحقوق المتعلقة بها: تجهيز الميت، ثم الديون، ثم الوصية، ثم قسمة الباقي بين الورثة، وتختلف المذاهب في انتقالها عند استغراق الدين وفي نقض القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4997}"
  en: "The estate is what a deceased person leaves of property and rights; for the Hanafis it is property alone. It passes to the heirs on the owner's death, and the rights attached to it are paid in order: the burial, the debts, the bequest, and then the division among heirs. The schools differ on its passing when debts take the whole estate, on the dying man's gifts and on undoing a division. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4997}"
