label:
  ar: "التركة"
  en: "Tarika (the estate of a deceased person)"
  ur: "ترکہ ⁦(میت کا مال و حقوق)⁩"
  es: "Tarika (el patrimonio de una persona fallecida)"
  fr: "Tarika (la succession d'une personne décédée)"
  tr: "Miras"
  id: "Warisan"
summary:
  ar: "التركة ما يخلفه الميت من أموال وحقوق، وعند الحنفية المال وحده. تنتقل إلى الورثة بعد موت المورث، وتقدم الحقوق المتعلقة بها: تجهيز الميت، ثم الديون، ثم الوصية، ثم قسمة الباقي بين الورثة، وتختلف المذاهب في انتقالها عند استغراق الدين وفي نقض القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4997}"
  en: "The estate is what a deceased person leaves of property and rights; for the Hanafis it is property alone. It passes to the heirs on the owner's death, and the rights attached to it are paid in order: the burial, the debts, the bequest, and then the division among heirs. The schools differ on its passing when debts take the whole estate, on the dying man's gifts and on undoing a division. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4997}"
  es: "La herencia es el conjunto de bienes y derechos que deja una persona fallecida; para los hanafíes, se trata únicamente de bienes. Esta se transmite a los herederos tras la muerte del propietario, y los derechos inherentes a ella se pagan en el siguiente orden: el entierro, las deudas, el legado y, finalmente, la división entre los herederos. Las distintas escuelas discrepan sobre su transmisión cuando las deudas afectan a la totalidad de la herencia, sobre las donaciones del moribundo y sobre cómo revertir una división. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4978} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4983} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4988} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4994} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4995} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4997}"
  fr: "Le patrimoine désigne l'ensemble des biens et droits laissés par une personne décédée; pour les hanafites, il s'agit uniquement de biens. Il est transmis aux héritiers au décès du propriétaire, et les droits qui y sont attachés sont acquittés dans l'ordre suivant: les frais d'obsèques, le règlement des dettes, le legs, puis le partage entre les héritiers. Les écoles divergent quant au moment de la transmission du patrimoine, notamment en cas de dettes s'élevant à la totalité des biens, concernant les legs du défunt et l'annulation d'un partage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4997}"
  ur: "جائیداد وہ ہے جو مرنے والا شخص جائیداد اور حقوق چھوڑتا ہے۔ احناف کے نزدیک یہ واحد ملکیت ہے۔ یہ مالک کی موت پر ورثاء کے پاس جاتا ہے، اور اس سے منسلک حقوق ترتیب وار ادا کیے جاتے ہیں: تدفین، قرض، وصیت، اور پھر وارثوں میں تقسیم۔ اسکولوں میں اس کے گزرنے پر اختلاف ہوتا ہے جب قرض پوری جائیداد لے لیتا ہے، مرنے والے کے تحائف پر اور تقسیم کو ختم کرنے پر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4977} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4978} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4983} p.4988} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4994} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4995} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4997}"
  tr: "Miras, ölen kişinin para ve haklar açısından bıraktığı mirastır ve Hanefi okuluna göre sadece servettir. Miras, ölen kişinin ölümünden sonra varislere geçer ve ilgili haklar önceliklidir: önce ölenin hazırlanması, sonra borçlar, sonra vasiyet, kalan kısmı ise varisler arasında paylaştır. Okullar borcun devri ve paylaşımın iptali konusunda farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4997}"
  id: "Warisan adalah apa yang ditinggalkan almarhum dalam bentuk uang dan hak, dan menurut aliran Hanafi, hanya kekayaan. Warisan diwariskan kepada ahli waris setelah kematian almarhum, dan hak terkait menjadi prioritas: menyiapkan almarhum, lalu utang, kemudian wasiat, kemudian membagi sisanya di antara ahli waris. Aliran berbeda dalam hal pemindahan utang dan pembatalan pembagian hutang tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4997}"
