id: concept/zij-sabi-day-count-begins-at-noon-or-midnight
class: concept
kind: scientific
label: { ar: "لماذا يبدأ حساب الأيام من نصف النهار أو نصف الليل", en: "Why the day count begins at noon or midnight", ur: "دنوں کا حساب دوپہر یا آدھی رات سے کیوں شروع ہوتا ہے", es: "¿Por qué el conteo de días comienza al mediodía o a medianoche?", fr: "Pourquoi le décompte des jours commence-t-il à midi ou à minuit ?", tr: "Gün sayımı neden öğlen veya gece yarısından başlar?", id: "Mengapa penghitungan hari dimulai pada tengah hari atau tengah malam?" }
summary:
  ar: "يقول البتاني إن الابتداء من دائرة الأفق يتغير ويختلف في كل موضع باختلاف مطالع البروج فيه، وإن الابتداء من انتصاف النهار ثابت على حالة واحدة لاستواء طلوع البروج في فلك نصف النهار في كل بلد، ولذلك لا يجعل ابتداء الأيام في حساب الكواكب وتقويم مواضعها من طلوع الشمس ولا غروبها، وإنما من وقت انتصاف النهار أو انتصاف الليل {cite:zij-sabi-nallino-byblion p.78}."
  en: "Al-Battani says the start from the horizon circle changes and varies from place to place with the ascensions of the signs there, while the start from midday stays in one state through the evenness of the rising of the signs at the meridian circle in every land; therefore the beginning of the days in reckoning the planets and setting their places is made neither from sunrise nor sunset but from midday or midnight {cite:zij-sabi-nallino-byblion p.78}."
  ur: "البتانی کہتے ہیں کہ افق کے دائرے سے ابتدا ہر جگہ وہاں کے بروج کے مطالع کے اختلاف سے بدلتی اور مختلف ہوتی ہے، جبکہ دوپہر سے ابتدا ہر شہر میں نصف النہار کے فلک پر بروج کے طلوع کے برابر ہونے کی وجہ سے ایک ہی حال پر رہتی ہے؛ اس لیے ستاروں کے حساب اور ان کے مقامات کی درستی میں دنوں کی ابتدا نہ طلوعِ آفتاب سے رکھی جاتی ہے نہ غروب سے، بلکہ دوپہر یا آدھی رات کے وقت سے {cite:zij-sabi-nallino-byblion p.78}۔"
  es: "Al-Battani dice que el inicio desde el círculo del horizonte cambia y varía de un lugar a otro con las ascensiones de los signos allí, mientras que el inicio desde el mediodía permanece en un estado debido a la uniformidad de la salida de los signos en el círculo meridiano en cada tierra; por lo tanto, el comienzo de los días al calcular los planetas y establecer sus posiciones no se hace ni desde el amanecer ni desde el atardecer, sino desde el mediodía o la medianoche {cite:zij-sabi-nallino-byblion p.78}."
  fr: "Al-Battani affirme que le point de départ à partir du cercle de l'horizon change et varie d'un endroit à l'autre en fonction des ascensions des signes, tandis que le point de départ à partir de midi reste le même grâce à l'homogénéité de la levée des signes au méridien dans chaque pays; par conséquent, le début des jours, dans le calcul des planètes et la détermination de leurs positions, ne se fait ni à partir du lever ni du coucher du soleil, mais à partir de midi ou de minuit {cite: zij-sabi-nallino-byblion p.78}."
  tr: "El-Battani, ufuk çemberinden başlangıç noktasının, oradaki zodyak işaretlerinin farklı doğuş noktalarına göre her yerde değiştiğini ve farklılık gösterdiğini, öğle vaktinden başlangıç noktasının ise sabit kaldığını, çünkü zodyak işaretlerinin doğuş noktalarının her ülkede öğle vakti yörüngesinde eşit olduğunu söyler. Bu nedenle, gezegenlerin hesaplanmasında ve konumlarının takviminde günlerin başlangıcı, güneşin doğuşundan veya batışından değil, öğle vaktinden veya gece yarısından yapılır. {cite:zij-sabi-nallino-byblion s.78}"
  id: "Al-Battani mengatakan bahwa titik awal dari lingkaran cakrawala berubah dan berbeda di setiap tempat sesuai dengan titik terbit zodiak yang berbeda di tempat tersebut, dan bahwa titik awal dari tengah hari tetap dalam satu keadaan karena titik terbit zodiak sama dalam orbit tengah hari di setiap negara. Oleh karena itu, permulaan hari dalam perhitungan planet dan kalender posisi mereka tidak dibuat dari terbitnya matahari atau terbenamnya, melainkan dari waktu tengah hari atau tengah malam {cite:zij-sabi-nallino-byblion p.78}."
