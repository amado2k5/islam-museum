id: concept/alamat-al-zukam-wa-al-nazla
class: concept
kind: scientific
label:
  ar: علامات الزكام والنزلة
  en: The signs of catarrh and the descending catarrh
  fr: "Les signes du coryza et du catarrhe descendant"
  ur: زکام اور نزلہ کی علامات
  es: "Los signos del catarro y del catarro descendente"
summary:
  ar: علامة النزلة الحادة الحارة إن كانت زكامية حمرة الوجه والعينين ولذع السائل ورقته وحرارة ملمسه وربما عرضت معه حمى فلا ينتفع بها وإن كانت حلقية فحد ما ينزل إلى الحلق وشدة إحراقه ورقته مع التهاب؛ وعلامة الباردة برد السيلان إن كان في الأنف ودغدغة في الأنف مع تمدد الجبهة وشدة السدة والغنة وربما دل عليها غلظ المادة وإن كانت إلى الحلق فبرد ما يتنخع به وبياضه والانتفاع بحمى إن عرضت {cite:canon-ibn-sina-print-v2 p.242}
  en: The sign of the acute hot nazla — if nasal — is redness of face and eyes, a burning, thin flow hot to the touch, and a fever may occur with it that benefits nothing; if it is of the throat, the severity of what descends to the throat, its burning and thinness, with inflammation. The sign of the cold one is coldness of the flow if nasal, tickling in the nose with stretching of the forehead, strong occlusion and nasal voice, thick matter betraying it; if it descends to the throat, the coldness and whiteness of what is hawked up and the benefit from a fever if one occurs {cite:canon-ibn-sina-print-v2 p.242}
  fr: "Le signe de la nazla chaude aiguë, quand elle est nasale, est la rougeur du visage et des yeux, avec un écoulement brûlant, fluide et chaud au toucher. Une fièvre peut s’y ajouter, sans aucun bénéfice. Quand la gorge est atteinte, la descente de l’écoulement vers celle-ci est violente, il brûle et reste fluide, et il y a inflammation. La forme froide se reconnaît, quand elle est nasale, à la froideur de l’écoulement, à un chatouillement du nez avec tension du front, à une forte obstruction et à une voix nasale ; l’épaisseur de la matière peut la trahir. Si elle descend à la gorge, elle se reconnaît à la froideur et à la blancheur de ce que le malade crache en se raclant la gorge, et au bénéfice d’une fièvre si elle survient {cite:canon-ibn-sina-print-v2 p.242}."
  ur: شدید گرم نزلے کی علامت — اگر ناک میں ہو — چہرے اور آنکھوں کی سرخی، بہتے مادہ کی جلن، پتلپن اور چھونے پر گرمی ہے، اور بخار آئے تو نفع نہیں دیتا؛ اور اگر حلق کی طرف ہو تو حلق تک اترنے والے کی شدت، جلانے اور پتلپن کے ساتھ سوجن؛ اور سرد نزلے کی علامت بہنے والے مادے کی سردی ہے اگر ناک میں ہو، ناک میں چبھن اور پیشانی کے تنے ہوئے ہونے کے ساتھ، سخت سدہ اور گن گن، اور گاڑھا مادہ اس پر دلالت کرتا ہے؛ اور اگر حلق تک ہو تو نکھارنے والے کی سردی اور سفیدی اور بخار آئے تو اس سے نفع {cite:canon-ibn-sina-print-v2 p.242}
  es: "El signo de la nazla caliente aguda —si es nasal— es enrojecimiento de la cara y los ojos, un flujo ardiente y fino, caliente al tacto, y puede presentarse fiebre que no aporta ningún beneficio; si es de la garganta, la gravedad de lo que desciende a la garganta, su ardor y fluidez, con inflamación. El signo de la fría es frío en el flujo si es nasal, cosquilleo en la nariz con estiramiento de la frente, fuerte oclusión y voz nasal, materia espesa que la delata; si desciende a la garganta, el frío y la blancura de lo que se expectora y el beneficio de la fiebre si se presenta {cite:canon-ibn-sina-print-v2 p.242}"
