class: concept
kind: scientific
label: { ar: "مطالع البروج فيما بين الأوتاد في أرباع الفلك", en: "The risings of the signs between the cusps of the quarters of the sphere", ur: "فلک کے ارباع میں اوتاد کے درمیان بروج کے مطالع", es: "Los ascensos de los signos entre las cúspides de los cuartos de la esfera" }
summary:
  ar: "يحتاج تحقيق الأقدار على دائرة البروج إلى معرفة مطالع البروج فيما بين الأوتاد، أي وتد الطالع ووتد الغارب ووتد وسط السماء ووتد الأرض. وتُعرف مطالع الحمل في وتد وسط السماء كذا، وفي وتد الأرض كذا، وبينهما ست ساعات زمانية، وهي ساعات الربع الواحد من أرباع النهار والليل. فما كان تحت الأرض من الربعين الباقيين كانت ساعاته ليلية. {cite:zij-sabi-nallino-byblion pp.202-203}"
  en: "Knowing the measures on the ecliptic requires the risings of the signs between the cusps: the ascendant, the descendant, the midheaven and the nadir. The rising of Aries at the midheaven and at the nadir differs by a stated number of equal hours, and between each cusp and the next there are six equal hours, the hours of one quarter of the day or night. The hours of the quarters below the earth are night hours. {cite:zij-sabi-nallino-byblion pp.202-203}"
  ur: "دائرۂ البروج پر پیمانے معلوم کرنے کے لیے اوتاد کے درمیان بروج کے مطالع جاننا ضروری ہے، یعنی طالع، غارب، وسط السماء اور وتد الارض کے اوتاد۔ حمل کے مطالع وسط السماء پر اور وتد الارض پر الگ ہیں، اور ہر وتد اور اگلے وتد کے درمیان چھ ساعات زمانیہ ہیں، جو دن یا رات کے ایک ربع کی ساعات ہیں۔ زمین کے نیچے کے باقی دو ارباع کی ساعات رات کی ساعات ہوتی ہیں۔ {cite:zij-sabi-nallino-byblion pp.202-203}"
  es: "Para conocer las medidas en la eclíptica se requieren los ascensos de los signos entre las cúspides: el ascendente, el descendente, el medio cielo y el nadir. El ascenso de Aries en el medio cielo y en el nadir difiere en un número determinado de horas iguales, y entre cada cúspide y la siguiente hay seis horas iguales, las horas de un cuarto del día o de la noche. Las horas de los cuartos inferiores a la Tierra son las horas nocturnas. {cite:zij-sabi-nallino-byblion pp.202-203}"
