summary:
  ar: 'الحكم: الحاكم بين خلقه بالعدل الذي لا يُردّ حكمه. الاسم رقم 28 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Hakam — The Judge. Name 28 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Hakam — Le Juge. Nom 28 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'الحكم: حاکم — جو مخلوق میں عدل سے فیصلہ کرے، جس کا حکم ٹالا نہ جا سکے۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 28۔'
  es: "al-Hakam — El Juez. Nombre número 28 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Hakam: Yaratıldığı yaratılanlar arasında adaletle yargılanan, hükmü reddedilemez. El-Tirmidi'nin Allah'ın En Güzel İsimleri hakkındaki hadislerde adı 28."
  id: "Al-Hakam: Hakim di antara ciptaan-Nya dengan keadilan yang penilaiannya tidak dapat ditolak. Nama nomor 28 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Terindah Allah."
