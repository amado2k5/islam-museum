label:
  ar: "الذراع (في الفقه)"
  en: "Dhira' (forearm, cubit, and their rulings in fiqh)"
  ur: "ذراع (فقہی احکام)"
summary:
  ar: "الذراع في اللغة اليد من الإنسان من المرفق إلى الأصابع، وذراع القياس يقاس بها، وتستعمل في الاصطلاح بالمعنيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8414} يجب غسل الذراعين في الوضوء إلى المرفق عند الجمهور، ويكره افتراش الذراعين في السجود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8415} وفي قطع الذراع من المفصل القصاص عمدا والدية خطأ، أما كسرها من غير المفصل فحكومة عدل عند أكثر الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8416}"
  en: "In lexicon dhira' is the arm from the elbow to the fingers, and also the measuring cubit; the jurists use both senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8414} Washing the arms up to the elbow is required in ablution by the majority, and resting the forearms on the ground in prostration is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8415} Cutting the arm at the joint carries retaliation if deliberate and half a diya if accidental; breaking it short of the joint carries a discretionary sum according to most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8416}"
  ur: "ذراع لغت میں انسان کے کہنی سے انگلیوں تک کے حصے کو کہتے ہیں، اور پیمائش کا ذراع بھی۔ وضو میں جمہور کے نزدیک کہنی تک ہاتھ دھونا واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8414}"
