label: { ar: "الجواب", en: "Jawab (the answer, and its legal effect)", ur: "جواب", es: "Jawab (la respuesta y su efecto legal)", fr: "Jawab (la réponse et ses conséquences juridiques)", tr: "Cevap", id: "Jawabannya" }
summary:
  ar: "الجواب في الأصول والفقه ما يُرد به على السؤال، ويتبع السؤال في عمومه وخصوصه إن لم يستقل بنفسه، كقول نعم. وإن استقل كان له حكم مستقل، كالإقرار بالجواب، وقد يحدد الجواب بالنية، كجواب تفويض الطلاق. ويأثم من امتنع عن الجواب الواجب، كالمفتي والشاهد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6675}"
  en: "In the usul and fiqh, a jawab is a reply to a question. If it cannot stand alone, such as yes, it takes the scope of the question; if it can stand alone, it has its own effect, as in an acknowledgement given in reply. An answer may also be read by the speaker's intention, as with a reply to a delegated divorce. A person who refuses a required answer, such as a mufti or a witness, is sinful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6675}"
  es: "En el usul y el fiqh, un jawab es una respuesta a una pregunta. Si no puede expresarse de forma independiente, como un sí, abarca el alcance de la pregunta; si puede expresarse de forma independiente, tiene su propio efecto, como en una respuesta de acuse de recibo. Una respuesta también puede interpretarse según la intención del hablante, como en una respuesta a un divorcio delegado. Quien se niega a dar una respuesta requerida, como un muftí o un testigo, incurre en pecado. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6671} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6672} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6673} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6674} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6675}"
  fr: "En droit islamique (usul et fiqh), une réponse (jawab) est une réplique à une question. Si elle ne peut être comprise seule, comme un simple « oui », elle englobe la question; si elle peut être comprise seule, elle a sa propre signification, comme dans une réponse à une acquiescement. Une réponse peut également être interprétée selon l'intention de celui qui parle, comme dans le cas d'une réponse à un divorce par délégation. Celui qui refuse de répondre à une demande, tel qu'un mufti ou un témoin, commet un péché. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6675}"
  ur: "اصول اور فقہ میں جواب سوال کا جواب ہے۔ اگر یہ تنہا نہیں رہ سکتا، جیسے کہ ہاں، یہ سوال کی گنجائش لیتا ہے۔ اگر یہ اکیلا کھڑا ہوسکتا ہے، تو اس کا اپنا اثر ہوتا ہے، جیسا کہ جواب میں دیے گئے اعتراف میں۔ ایک جواب کو اسپیکر کی نیت سے بھی پڑھا جا سکتا ہے، جیسا کہ ایک تفویض شدہ طلاق کے جواب کے ساتھ۔ وہ شخص جو مطلوبہ جواب سے انکار کرے، جیسے کہ مفتی یا گواہ، گناہ گار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6671} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6672} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6673} صفحہ 6674} {حوالہ: فقہ معاویہ کویتیہ نور v3 ص6675}"
  tr: "İlkeler ve hukukta verilen cevap, soruya verilen cevaptır ve soru, bağımsız olarak konuşmazsa, örneğin evet demesi durumunda genel ve özgül olarak ortaya çıkar. Eğer bağımsızsa, cevabı kabul etmek gibi bağımsız bir hükmü vardır ve cevap niyetle belirlenebilir, örneğin boşanmayı yetkilendirme yanıtı gibi. Müfti veya tanık gibi zorunlu cevabı vermeyi reddederse günahkar sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6675}"
  id: "Jawaban dalam prinsip dan yurisprudensi adalah apa yang dijawab atas pertanyaan, dan pertanyaan mengikuti dalam istilah umum dan spesifik jika dia tidak berbicara secara mandiri, misalnya mengatakan ya. Jika dia independen, maka ia memiliki keputusan independen, seperti mengakui jawaban, dan jawaban dapat ditentukan oleh niat, seperti jawaban atas izin perceraian. Dia berdosa jika menolak memberikan jawaban wajib, seperti mufti atau saksi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6675}"
