label: { ar: "الجواب", en: "Jawab (the answer, and its legal effect)", ur: "جواب" }
summary:
  ar: "الجواب في الأصول والفقه ما يُرد به على السؤال، ويتبع السؤال في عمومه وخصوصه إن لم يستقل بنفسه، كقول نعم. وإن استقل كان له حكم مستقل، كالإقرار بالجواب، وقد يحدد الجواب بالنية، كجواب تفويض الطلاق. ويأثم من امتنع عن الجواب الواجب، كالمفتي والشاهد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6675}"
  en: "In the usul and fiqh, a jawab is a reply to a question. If it cannot stand alone, such as yes, it takes the scope of the question; if it can stand alone, it has its own effect, as in an acknowledgement given in reply. An answer may also be read by the speaker's intention, as with a reply to a delegated divorce. A person who refuses a required answer, such as a mufti or a witness, is sinful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6672} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6675}"
