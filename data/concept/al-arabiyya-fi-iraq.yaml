label:
  ar: "العربية في العراق"
  en: "Arabic in Iraq"
  ur: "عراق میں عربی"
  fr: "L'arabe en Irak"
  es: "El árabe en Irak"
  tr: "Irak'ta Arapça"
  id: "Bahasa Arab di Irak"
summary:
  ar: "ما وُجد عن العربية في العراق: المادة 4 من دستور 2005 في اللغات الرسمية كما يعرضها Constitute، ووصف دراسة مكتبة الكونغرس للعربية العراقية والكردية، وتصنيف اللهجات الرافدية، مع بيان الخلاف بين المصادر وما لم يُعثر عليه. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on Arabic in Iraq: Article 4 of the 2005 constitution on the official languages as the Constitute Project shows it, the Library of Congress study's account of Iraqi Arabic and of Kurdish, and the classification of the Mesopotamian dialects, with the differences between sources and what was not found. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "عراق میں عربی کے بارے میں جو ملا: 2005 کے دستور کی دفعہ 4 سرکاری زبانوں پر جیسا Constitute دکھاتا ہے، لائبریری آف کانگریس کی تحقیق کا عراقی عربی اور کردی کا بیان، اور بین النہرینی بولیوں کی درجہ بندی، مآخذ کے اختلاف اور جو نہیں ملا اس کے ساتھ۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur l'arabe en Irak : l'article 4 de la constitution de 2005 sur les langues officielles tel que le montre le Constitute Project, le compte rendu de l'étude de la Bibliothèque du Congrès sur l'arabe irakien et le kurde, et la classification des dialectes mésopotamiens, avec les différences entre sources et ce qui n'a pas été trouvé. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el árabe en Irak: el artículo 4 de la constitución de 2005 sobre las lenguas oficiales tal como lo muestra el Constitute Project, el relato del estudio de la Biblioteca del Congreso sobre el árabe iraquí y el kurdo, y la clasificación de los dialectos mesopotámicos, con las diferencias entre fuentes y lo que no se halló. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
  tr: "Irak'ta Arapça hakkında bulunanlar: 2005 Anayasası'nın 4. maddesi, Constitution tarafından sunulan resmi dillerde, Kongre Kütüphanesi'nin Irak ve Kürt Arapçası çalışmasının açıklaması, Mezopotamya lehçelerinin sınıflandırılması ve kaynaklar ile bulunamayanlar arasındaki tutarsızlıkların netleştirilmesi. Anayasa kararının metni, müzenin sayfada doğrulamadığı bir araştırma özetinde yer aldığı şekilde orijinal dilinde eklendi."
  id: "Tentang Bahasa Arab di Irak: Pasal 4 Konstitusi 2005, dalam bahasa resmi yang disediakan oleh Konstitusi, penjelasan tentang pekerjaan Perpustakaan Kongres tentang Arab Irak dan Kurdi, klasifikasi dialek Mesopotamia, serta klarifikasi ketidaksesuaian antara sumber dan yang tidak ditemukan. Teks keputusan konstitusional ditambahkan dalam bahasa aslinya seperti yang tercantum dalam ringkasan penelitian yang tidak diverifikasi oleh museum di halaman tersebut."
