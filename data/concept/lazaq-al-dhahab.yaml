summary:
  ar: "لزاق الذهب اسم يقع على أشياء، والذي يذكره الكتاب هنا هو المعدني، حار جال قابض مجفف محلل، ويذيب اللحم وينفع الجراحات العسيرة {cite:canon-ibn-sina-print-v1 p.545}."
  en: "Lizaq al-dhahab is a name for several things; the one the book treats here is the mineral kind, hot, cleansing, astringent, drying and dissolving, which dissolves flesh and is listed for hard wounds {cite:canon-ibn-sina-print-v1 p.545}."
  ur: "لزاق الذہب کئی چیزوں کا نام ہے؛ کتاب یہاں معدنی قسم کا ذکر کرتی ہے، گرم، جلا دینے والی، قابض، خشک کرنے والی اور تحلیل کرنے والی، جو گوشت کو گھلاتی ہے اور مشکل زخموں میں مذکور ہے {cite:canon-ibn-sina-print-v1 p.545}۔"
  es: "Lizaq al-dhahab es un nombre para varias cosas; la que el libro trata aquí es del tipo mineral, caliente, limpiador, astringente, secante y disolvente, que disuelve la carne y se menciona para heridas duras {cite:canon-ibn-sina-print-v1 p.545}."
  fr: "Lizaq al-dhahab est un nom pour plusieurs choses; celle dont le livre parle ici est de nature minérale, chaude, purifiante, astringente, asséchante et dissolvante, qui dissout la chair et est répertoriée pour les plaies dures {cite:canon-ibn-sina-print-v1 p.545}."
