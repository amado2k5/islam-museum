label:
  ar: الإسلام دين الأنبياء المشترك
  en: "Islam as the common religion of the prophets"
summary:
  ar: "يبين محمد عبد الله دراز أن كلمة الإسلام في القرآن ليست اسما لدين خاص، بل للدين المشترك الذي دعا إليه الأنبياء؛ فنوح ويعقوب وموسى والحواريون يعدّون أنفسهم من المسلمين {cite:hatha-huwa-al-islam-azhar p. 49}. ويرى أن القرآن يجمع الأنبياء وأتباعهم في أمة واحدة لها إله واحد وشريعة واحدة في أصولها {cite:hatha-huwa-al-islam-azhar p. 50}. ويصف هذا الدين بأنه التوجه إلى الله بخضوع خالص لا يشوبه شرك، والإيمان بكل ما جاء من عنده دون تمييز بين كتاب وكتاب أو رسول ورسول {cite:hatha-huwa-al-islam-azhar p. 50}. وهذا تفسير المؤلف لمعنى الإسلام، وقد نشر المقال في مجلة الأزهر سنة 1433هـ/2012م {cite:hatha-huwa-al-islam-azhar p. 49}."
  en: "Muhammad Abdullah Draz reads 'Islam' in its Qur'anic sense as the shared religion of all prophets, citing Noah, Jacob, Moses and the disciples of Jesus as calling themselves Muslims. He describes this religion as sincere submission to God without associating partners, and faith in all that came from Him without distinguishing between books or messengers. This is the author's own reading, first published in al-Azhar magazine in 2012 (pp. 49-50)."
