id: concept/islam-common-religion-of-prophets
class: concept
kind: belief
label:
  ar: الإسلام دين الأنبياء المشترك
  en: "Islam as the common religion of the prophets"
  es: "El Islam como religión común de los profetas"
  fr: "L'islam comme religion commune des prophètes"
  ur: "اسلام انبیاء کا مشترکہ مذہب ہے۔"
  tr: "İslam, peygamberlerin ortak dinidir"
  id: "Islam adalah agama bersama para nabi"
summary:
  ar: "يبين محمد عبد الله دراز أن كلمة الإسلام في القرآن ليست اسما لدين خاص، بل للدين المشترك الذي دعا إليه الأنبياء؛ فنوح ويعقوب وموسى والحواريون يعدّون أنفسهم من المسلمين {cite:hatha-huwa-al-islam-azhar p. 49}. ويرى أن القرآن يجمع الأنبياء وأتباعهم في أمة واحدة لها إله واحد وشريعة واحدة في أصولها {cite:hatha-huwa-al-islam-azhar p. 50}. ويصف هذا الدين بأنه التوجه إلى الله بخضوع خالص لا يشوبه شرك، والإيمان بكل ما جاء من عنده دون تمييز بين كتاب وكتاب أو رسول ورسول {cite:hatha-huwa-al-islam-azhar p. 50}. وهذا تفسير المؤلف لمعنى الإسلام، وقد نشر المقال في مجلة الأزهر سنة 1433هـ/2012م {cite:hatha-huwa-al-islam-azhar p. 49}."
  en: "Muhammad Abdullah Draz reads 'Islam' in its Qur'anic sense as the shared religion of all prophets, citing Noah, Jacob, Moses and the disciples of Jesus as calling themselves Muslims. He describes this religion as sincere submission to God without associating partners, and faith in all that came from Him without distinguishing between books or messengers. This is the author's own reading, first published in al-Azhar magazine in 2012 (pp. 49-50)."
  es: "Muhammad Abdullah Draz interpreta el término «islam» en su sentido coránico como la religión compartida por todos los profetas, citando a Noé, Jacob, Moisés y los discípulos de Jesús como musulmanes. Describe esta religión como una sumisión sincera a Dios sin asociarle copartícipes, y una fe en todo lo que proviene de Él sin distinguir entre libros o mensajeros. Esta es la interpretación del autor, publicada originalmente en la revista Al-Azhar en 2012 (págs. 49-50)."
  fr: "Muhammad Abdullah Draz interprète l’islam au sens coranique comme la religion partagée par tous les prophètes, citant Noé, Jacob, Moïse et les disciples de Jésus qui se déclaraient musulmans. Il décrit cette religion comme une soumission sincère à Dieu, sans association d’autres divinités, et une foi en tout ce qui vient de Lui, sans distinction entre les livres ou les messagers. Cette interprétation, propre à l’auteur, a été initialement publiée dans la revue al-Azhar en 2012 (pp. 49-50)."
  ur: "محمد عبداللہ دراز نے نوح، یعقوب، موسیٰ اور عیسیٰ کے حواریوں کا حوالہ دیتے ہوئے اپنے آپ کو مسلمان کہنے کے حوالے سے قرآنی معنوں میں 'اسلام' کو تمام انبیاء کے مشترکہ مذہب کے طور پر پڑھا۔ وہ اس مذہب کو بغیر کسی شریک کے خدا کے لیے مخلصانہ تابعداری اور کتابوں یا رسولوں میں فرق کیے بغیر ان تمام چیزوں پر ایمان کے طور پر بیان کرتا ہے جو اس کی طرف سے آیا ہے۔ یہ مصنف کا اپنا مطالعہ ہے، جو پہلی بار 2012 میں الازہر میگزین میں شائع ہوا تھا ⁦(صفحہ 49-50)⁩۔"
  tr: "Muhammed Abdullah Daraz, Kur'an'daki İslam kelimesinin belirli bir din için değil, peygamberlerin çağrısında bulunan ortak din için bir isim olduğunu açıklar; örneğin, Nuh, Yakup, Musa ve öğrenciler kendilerini Müslüman sayırlar {atıf:hatha-huwa-al-Islam-azhar s. 49}. Kur'an'ın peygamberleri ve takipçilerini tek bir Allah ve tek bir yasa ile tek bir millet olarak birleştirdiğine inanır {cite:hatha-huwa-al-islam-azhar s. 50}. Bu dini, hiçbir çoktanrıcılıktan uzak, saf bir teslimiyetle ve O'ndan gelen her şeye kitap ile elçi ile elçi arasında ayrım yapmadan inanan bir şey olarak tanımlar {cite:hatha-huwa-al-Islam-azhar s. 50}. Bu, yazarın İslam'ın anlamına dair yorumudur ve makale 1433 Hicri / 2012 yılında El-Ezher dergisinde yayımlanmıştır {atıf:hatha-huwa-al-Islam-azhar s. 49}."
  id: "Muhammad Abdullah Daraz menjelaskan bahwa kata Islam dalam Al-Qur'an bukanlah nama untuk agama tertentu, melainkan untuk agama umum yang disarankan oleh para nabi; misalnya, Nuh, Yakub, Musa, dan para murid menganggap diri mereka Muslim {cite:hatha-huwa-al-Islam-azhar hlm. 49}. Ia percaya bahwa Al-Qur'an menyatukan para nabi dan pengikutnya menjadi satu bangsa dengan satu Allah dan satu hukum asal-usulnya {cite:hatha-huwa-al-islam-azhar hlm. 50}. Ia menggambarkan agama ini sebagai berbalik kepada Tuhan dengan penyerahan murni dan tanpa politeisme, serta mempercayai segala sesuatu yang berasal dari-Nya tanpa membedakan antara sebuah kitab dan sebuah kitab atau utusan dan utusan {cite:hatha-huwa-al-Islam-azhar hlm. 50}. Ini adalah interpretasi penulis tentang makna Islam, dan artikel tersebut diterbitkan di majalah Al-Azhar pada tahun 1433 AH / 2012 M {cite:hatha-huwa-al-Islam-azhar hlm. 49}."
