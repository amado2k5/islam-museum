id: concept/zij-sabi-ascendant-from-the-hours-since-noon
class: concept
kind: scientific
label: { ar: "الطالع من الساعات المأخوذة من انتصاف النهار", en: "The ascendant from the hours counted from noon", ur: "دوپہر سے شمار گھنٹوں سے طالع", es: "El ascendente de las horas contadas desde el mediodía", fr: "L'ascendant à partir des heures comptées à partir de midi" }
summary:
  ar: "إذا أُخذت الساعات من انتصاف النهار إلى الساعة المفروضة، ضُربت مثلما يُضرب غيرها، وزيدت عليها مطالع جزء الشمس في الفلك المستقيم، فيُعرف الطالع ووسط السماء على تلك الجهة. {cite:zij-sabi-nallino-byblion p.110}."
  en: "When the hours are counted from noon to the given hour, they are multiplied as before, and the risings of the Sun's degree in the right sphere are added. The ascendant and the mid-heaven for that place are thus known. {cite:zij-sabi-nallino-byblion p.110}."
  ur: "جب گھنٹے دوپہر سے مقررہ گھنٹے تک لیے جائیں تو پہلے کی طرح ضرب دیے جاتے ہیں، اور سورج کے درجے کے مطالع فلکِ مستقیم میں ان پر جمع کیے جاتے ہیں؛ اس طرح طالع اور اس جہت کا وسط السماء معلوم ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.110}۔"
  es: "Cuando se cuentan las horas desde el mediodía hasta la hora indicada, se multiplican como antes y se suman los grados de salida del Sol en la esfera derecha. De esta forma se conocen el ascendente y el medio cielo para ese lugar. {cite:zij-sabi-nallino-byblion p.110}."
  fr: "En comptant les heures de midi à l'heure donnée, on les multiplie comme précédemment, puis on ajoute les levers du Soleil dans la sphère droite. On connaît ainsi l'ascendant et le milieu du ciel pour ce lieu. {cite:zij-sabi-nallino-byblion p.110}."
