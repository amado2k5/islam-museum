label:
  ar: بيع المحرمات
  en: Sale of the prohibited
summary:
  ar: "تحريم بيع المحرمات في الحديث الخامس والأربعين من زيادات ابن رجب: «إن الله ورسوله حرم بيع الخمر والميتة والخنزير والأصنام» — فيحرم بيع ما حرم أكله أو الانتفاع به على أصله، ويستدل على تسلسل التحريم إلى الثمن بقصة شحوم الميتة التي سأل عنها للطلاء والدهن والاستصباح فقال «لا هو حرام» وبقوله «قاتل الله اليهود إن الله حرم عليهم الشحوم فأجملوه ثم باعوه فأكلوا ثمنه» — فالقاعدة أن ما حرم عينه حرم ثمنه وتحويل صورته لا يحله (جامع العلوم والحكم ص 871)."
  en: "The prohibition of selling the prohibited in the forty-fifth hadith of Ibn Rajab's additions: 'God and His Messenger forbade the sale of wine, carrion, swine and idols' — so what is forbidden to eat or benefit from is forbidden to sell, the extension of the prohibition to its price being drawn from the question over carrion fat sought for caulking, oiling and lighting — answered 'no, it is forbidden' — and from the saying 'God fight the Jews: God had forbidden them the fat, so they melted it, sold it and ate its price' — the rule being that whatever's substance is forbidden, its price is forbidden too, and altering its form does not make it lawful (Jami' al-Ulum wal-Hikam p. 871)."
