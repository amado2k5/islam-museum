id: concept/bay-al-muharramat
education:
  did_you_know:
    ar: "قاعدة ابن رجب: ما حرم عينه حرم ثمنه — فيحرم بيع الخمر والميتة والخنزير والأصنام، وتحويل صورة المحرم لا يحلّه."
    en: "Ibn Rajab's rule: whatever is forbidden in itself is forbidden in price — so selling wine, carrion, pork or idols is unlawful, and reshaping the forbidden does not permit it."
    ur: "ابن رجب کا اصول: جو چیز اپنی ذات میں حرام اس کا دام بھی حرام — اس لیے شراب، مردار، خنزیر اور بت بیچنا جائز نہیں، اور حرام چیز کی شکل بدلنا اسے حلال نہیں کرتا۔"
    sources: [source/ibn-rajab-jami-ulum-hikam, source/usul-iqtisad-islami-0660]
class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-bay, halal-haram-browser, halal-subject-earnings]
label:
  ar: بيع المحرمات
  en: Sale of the prohibited
  fr: "Vente des choses interdites"
  es: "Venta de lo prohibido"
  ur: "ممنوعہ کی فروخت"
summary:
  ar: "تحريم بيع المحرمات في الحديث الخامس والأربعين من زيادات ابن رجب: «إن الله ورسوله حرم بيع الخمر والميتة والخنزير والأصنام» — فيحرم بيع ما حرم أكله أو الانتفاع به على أصله، ويستدل على تسلسل التحريم إلى الثمن بقصة شحوم الميتة التي سأل عنها للطلاء والدهن والاستصباح فقال «لا هو حرام» وبقوله «قاتل الله اليهود إن الله حرم عليهم الشحوم فأجملوه ثم باعوه فأكلوا ثمنه» — فالقاعدة أن ما حرم عينه حرم ثمنه وتحويل صورته لا يحله ⁦(جامع العلوم والحكم ص 871)⁩. يعرض المؤلف حديث جابر في تحريم بيع الخمر والميتة والخنزير والأصنام، وحكم شحوم الميتة في الطلي والإضاءة، ويعرض خلاف الفقهاء في بيع الزيت النجس، ويرى أن المنفعة المشروعة لها ثمن، وأن الحكم يحتاج إلى تحرير نقلي وعقلي دقيق."
  en: "The prohibition of selling the prohibited in the forty-fifth hadith of Ibn Rajab's additions: 'God and His Messenger forbade the sale of wine, carrion, swine and idols' — so what is forbidden to eat or benefit from is forbidden to sell, the extension of the prohibition to its price being drawn from the question over carrion fat sought for caulking, oiling and lighting — answered 'no, it is forbidden' — and from the saying 'God fight the Jews: God had forbidden them the fat, so they melted it, sold it and ate its price' — the rule being that whatever's substance is forbidden, its price is forbidden too, and altering its form does not make it lawful (Jami' al-Ulum wal-Hikam p. 871)."
  fr: "Dans le quarante-cinquième hadith des ajouts d’Ibn Rajab, Dieu et Son Messager interdisent la vente du vin, des bêtes mortes, du porc et des idoles. Ce dont la consommation ou l’usage est interdit ne peut donc être vendu. L’extension au prix est tirée de la question sur la graisse de bête morte destinée au calfatage, au graissage et à l’éclairage, à laquelle il est répondu négativement, et du propos imprécatoire concernant les Juifs qui auraient fondu puis vendu la graisse interdite pour en consommer le prix. La règle présentée est que l’interdiction de la substance s’étend à son prix et qu’un changement de forme ne la rend pas licite (Jami' al-Ulum wal-Hikam, p. 871)."
  es: "La prohibición de vender lo prohibido en el hadiz número cuarenta y cinco de las adiciones de Ibn Rajab: \"Dios y Su Mensajero prohibieron la venta de vino, carroña, cerdos e ídolos\" — por lo que lo que está prohibido comer o del que beneficiarse está prohibido vender, la extensión de la prohibición a su precio se deriva de la pregunta sobre la grasa de carroña buscada para calafatear, engrasar e iluminar — se respondió \"no, está prohibido\" — y del dicho \"Dios combata a los judíos: Dios les había prohibido la grasa, así que la fundieron, la vendieron y comieron su precio\" — la regla es que cualquier sustancia que esté prohibida, su precio también está prohibido, y alterar su forma no la hace lícita (Jami' al-Ulum wal-Hikam p. 871)."
  ur: "ابن رجب کے اضافے کی پینتالیسویں حدیث میں ممنوعہ کو بیچنے کی ممانعت: 'خدا اور اس کے رسول نے شراب، مردار، سور اور بتوں کی خریدوفروخت کو حرام قرار دیا ہے' - پس جس چیز کا کھانا یا اس سے فائدہ اٹھانا حرام ہے وہ بیچنا حرام ہے، ممانعت کی توسیع، کار کی قیمت سے لے کر اس کی قیمت میں اضافے کی وجہ سے۔ تیل لگانا اور روشنی لگانا - جواب دیا 'نہیں، یہ حرام ہے' - اور اس قول سے 'خدا نے یہودیوں سے لڑو: خدا نے ان پر چربی حرام کی تھی، اس لیے انہوں نے اسے پگھلا کر بیچا اور اس کی قیمت کھا لی' - اس کا قاعدہ یہ ہے کہ جو چیز حرام ہے، اس کی قیمت بھی حرام ہے، اور اس کی شکل بدلنے سے اسے حلال نہیں ہوگا۔"
