id: concept/bay-al-muharramat
education:
  did_you_know:
    ar: "قاعدة ابن رجب: ما حرم عينه حرم ثمنه — فيحرم بيع الخمر والميتة والخنزير والأصنام، وتحويل صورة المحرم لا يحلّه."
    en: "Ibn Rajab's rule: whatever is forbidden in itself is forbidden in price — so selling wine, carrion, pork or idols is unlawful, and reshaping the forbidden does not permit it."
    ur: "ابن رجب کا اصول: جو چیز اپنی ذات میں حرام اس کا دام بھی حرام — اس لیے شراب، مردار، خنزیر اور بت بیچنا جائز نہیں، اور حرام چیز کی شکل بدلنا اسے حلال نہیں کرتا۔"
    sources: [source/ibn-rajab-jami-ulum-hikam, source/usul-iqtisad-islami-0660]
class: concept
kind: legal
label:
  ar: بيع المحرمات
  en: Sale of the prohibited
summary:
  ar: "تحريم بيع المحرمات في الحديث الخامس والأربعين من زيادات ابن رجب: «إن الله ورسوله حرم بيع الخمر والميتة والخنزير والأصنام» — فيحرم بيع ما حرم أكله أو الانتفاع به على أصله، ويستدل على تسلسل التحريم إلى الثمن بقصة شحوم الميتة التي سأل عنها للطلاء والدهن والاستصباح فقال «لا هو حرام» وبقوله «قاتل الله اليهود إن الله حرم عليهم الشحوم فأجملوه ثم باعوه فأكلوا ثمنه» — فالقاعدة أن ما حرم عينه حرم ثمنه وتحويل صورته لا يحله (جامع العلوم والحكم ص 871). يعرض المؤلف حديث جابر في تحريم بيع الخمر والميتة والخنزير والأصنام، وحكم شحوم الميتة في الطلي والإضاءة، ويعرض خلاف الفقهاء في بيع الزيت النجس، ويرى أن المنفعة المشروعة لها ثمن، وأن الحكم يحتاج إلى تحرير نقلي وعقلي دقيق."
  en: "The prohibition of selling the prohibited in the forty-fifth hadith of Ibn Rajab's additions: 'God and His Messenger forbade the sale of wine, carrion, swine and idols' — so what is forbidden to eat or benefit from is forbidden to sell, the extension of the prohibition to its price being drawn from the question over carrion fat sought for caulking, oiling and lighting — answered 'no, it is forbidden' — and from the saying 'God fight the Jews: God had forbidden them the fat, so they melted it, sold it and ate its price' — the rule being that whatever's substance is forbidden, its price is forbidden too, and altering its form does not make it lawful (Jami' al-Ulum wal-Hikam p. 871)."
