label: { ar: "الإنهاء", en: "Inha (informing another judge of a ruling or of a claim, so that he may carry it out; and the sense of completion)", es: "Inha (informar a otro juez de una resolución o de una demanda, para que pueda ejecutarla; y el sentido de finalización)", fr: "Inha (informer un autre juge d'une décision ou d'une réclamation, afin qu'il puisse l'exécuter; et le sentiment d'achèvement)" }
summary:
  ar: "الإنهاء لغة الإعلام والإبلاغ، يقال أنهيت الأمر إلى الحاكم أي أعلمته به، ويأتي بمعنى الإتمام والإنجاز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} واستعمله المالكية والشافعية بمعنى إبلاغ القاضي قاضيا آخر بحكمه لينفذه، أو بما حصل عنده دون الحكم، كسماع الدعوى ليتممه، ويكون مشافهة أو بكتاب أو بشاهدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  en: "Inha is lexically informing and reporting, as one says ‘I informed the ruler of the matter’, and also completing and finishing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} The Malikis and Shafi'is use it to mean informing another judge of one's ruling so that he may carry it out, or of what has come before one short of a ruling, such as a claim heard so that the other may complete it; this may be done in person, by letter, or before two witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  es: "Inha significa, desde un punto de vista léxico, informar y reportar, como se dice en «Informé al gobernante del asunto», y también completar y finalizar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} Los malikíes y shafiíes lo usan para referirse a informar a otro juez sobre el propio fallo para que lo ejecute, o sobre lo que se ha presentado ante uno sin llegar a ser un fallo, como una reclamación escuchada para que el otro pueda completarla; esto puede hacerse en persona, por carta o ante dos testigos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  fr: "Le terme « inha » signifie lexicalement informer et rapporter, comme lorsqu'on dit « J'ai informé le souverain de cette affaire », mais aussi achever et finaliser. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} Les écoles malikite et chaféite l'emploient pour désigner le fait d'informer un autre juge de sa propre décision afin qu'il puisse l'appliquer, ou de ce qui a été soumis à un juge avant qu'une décision ne soit rendue, comme une demande entendue, afin que l'autre juge puisse la compléter; cela peut se faire en personne, par lettre ou en présence de deux témoins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
