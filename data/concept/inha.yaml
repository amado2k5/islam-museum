label: { ar: "الإنهاء", en: "Inha (informing another judge of a ruling or of a claim, so that he may carry it out; and the sense of completion)" }
summary:
  ar: "الإنهاء لغة الإعلام والإبلاغ، يقال أنهيت الأمر إلى الحاكم أي أعلمته به، ويأتي بمعنى الإتمام والإنجاز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} واستعمله المالكية والشافعية بمعنى إبلاغ القاضي قاضيا آخر بحكمه لينفذه، أو بما حصل عنده دون الحكم، كسماع الدعوى ليتممه، ويكون مشافهة أو بكتاب أو بشاهدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  en: "Inha is lexically informing and reporting, as one says ‘I informed the ruler of the matter’, and also completing and finishing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} The Malikis and Shafi'is use it to mean informing another judge of one's ruling so that he may carry it out, or of what has come before one short of a ruling, such as a claim heard so that the other may complete it; this may be done in person, by letter, or before two witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
