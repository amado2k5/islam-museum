label: { ar: "النَّفْر", en: "Nafar (departure from Mina)", ur: "نفر (منیٰ سے روانگی)" }
summary:
  ar: "النفر في اللغة الخروج والرحيل، ويقال نفر الحاج من منى أي دفعوا إلى مكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855} وللحاج نفران يتعجل في أيهما شاء، فالنفر الأول في اليوم الثاني من أيام التشريق، والنفر الثاني في اليوم الثالث، ويشترط للأول عند المالكية والشافعية والحنابلة أن يجاوز منى قبل غروب الشمس، وعند الحنفية قبل فجر اليوم الثالث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15856} ويستحب في النفر الذكر والدعاء، ومن وصل المحصّب يستحب أن ينزل فيه ويصلي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15856} وورد النفر في القرآن في الحث على طلب العلم والجهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15856}"
  en: "Nafar, in the lexicon, is setting out or leaving; the pilgrims are said to depart from Mina when they move to Mecca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855} A pilgrim has two departures and may choose either. The first falls on the second day of the Tashriq, the twelfth of Dhu al-Hijja, and the second on the third day. For the first, the Malikis, Shafi'is and Hanbalis require leaving Mina before sunset, and the Hanafis before dawn of the third day. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15856} Remembrance and supplication are recommended on the way, and whoever reaches al-Muhassab may stop and pray there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15856} The word also occurs in the Qur'an as a call to seek knowledge and to go out to fight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15856}"
  ur: "نفر لغت میں نکلنے اور روانہ ہونے کو کہتے ہیں، اور حاجیوں کے منیٰ سے مکہ کی طرف روانہ ہونے پر بھی یہی لفظ بولا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855} حاجی کو دو نفر کا اختیار ہے: پہلا نفر بارہ ذوالحجہ کو، جس میں مالکیہ، شافعیہ اور حنابلہ کے نزدیک غروب آفتاب سے پہلے منیٰ سے نکلنا ضروری ہے، اور حنفیہ کے نزدیک تیسرے دن کی فجر سے پہلے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15856} دوسرا نفر تیرہ ذوالحجہ کو ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855}"
