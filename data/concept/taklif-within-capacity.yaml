id: concept/taklif-within-capacity
class: concept
kind: belief
label: { ar: "التكليف بالوسع", en: "Obligation within capacity", ur: "وسعت کے مطابق تکلیف" }
summary:
  ar: "يرى الشعراوي في قوله تعالى «التكليف بالوسع» أن الأحكام تقع في دائرة الوسع، وأن الله يخفف عند ضيق الوسع كالمسافر والمريض، وأن كسب الخير يكون بطبيعة النفس وكسب الشر بافتعال، وأن الله استجاب دعاء المؤمنين في الإصر والمشقة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1242} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1243} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1244}."
  en: "On the verse that God burdens no soul beyond its capacity, Sha'rawi holds that the rulings fall within capacity, and that God lightens them when capacity narrows, as for the traveller and the sick. He reads the good as natural and evil as effortful, and holds that God answered the believers' prayer against heavy burdens {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1242} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1243} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1244}."
  ur: "شعراوی اس آیت پر کہ اللہ کسی جان پر اس کی وسعت سے زیادہ بوجھ نہیں ڈالتا، کہتے ہیں کہ احکام وسعت کے دائرے میں ہیں، اور وسعت کم ہو تو اللہ تخفیف کرتا ہے، جیسے مسافر اور بیمار کے لیے۔ ان کے نزدیک نیکی طبعی کسب ہے اور برائی تکلف سے کی جاتی ہے، اور اللہ نے بھاری بوجھ کے بارے میں مومنین کی دعا قبول کی {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1242} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1243} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1244}۔"
