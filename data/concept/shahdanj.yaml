summary:
  ar: "الشهدانج في الكتاب بزر شجرة القنب، ومنه بستاني ومنه بري، حار يابس في الثالثة، يحلل الرياح ويجفف بقوة وخلطه قليل رديء، وأصول القنب البري المطبوخة ضماد للأورام الحارة، ويصدع الرأس، ويظلم البصر، ويضر المعد فيما يقال، وعصارته تقطر لوجع الأذن، ويذكر الكتاب نقلا موسوما أنه يجفف المني {cite:canon-ibn-sina-print-v1 p.671}"
  en: "Shahdanj is in the book the seed of the qinnab tree, of a garden kind and a wild kind; it is hot and dry in the third degree, dissolves winds and dries strongly, and its humour is little and poor; the cooked roots of the wild qinnab are a poultice for hot swellings; it causes headache, darkens the sight and, it is said, harms the stomachs; its juice is dropped for earache; and the book lists, as a labelled report, that it dries up semen {cite:canon-ibn-sina-print-v1 p.671}"
  ur: "شہدانج کتاب میں قنب کے درخت کا بیج ہے، ایک باغی اور ایک جنگلی قسم کا؛ تیسرے درجے میں گرم خشک ہے، ہواؤں کو تحلیل کرتا ہے اور زور سے خشک کرتا ہے، اس کا خلط تھوڑا اور ناقص ہے؛ جنگلی قنب کی پکائی ہوئی جڑیں گرم ورموں پر لیپ ہیں؛ سر میں درد پیدا کرتا ہے، بینائی تاریک کرتا ہے اور جیسا کہ کہا جاتا ہے معدوں کو نقصان دیتا ہے؛ اس کا رس کان کے درد کے لیے ٹپکایا جاتا ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ یہ منی کو خشک کرتا ہے {cite:canon-ibn-sina-print-v1 p.671}۔"
