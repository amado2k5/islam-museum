summary:
  ar: "الفصل السادس والأخير من جملة العصب يذكر أن أول زوج عجزي يخالط الأعصاب القطنية، وأن باقي الأزواج والفرد النابت من طرف العصعص يتفرق في عضل المقعدة والقضيب والمثانة والرحم {cite:canon-ibn-sina-print-v1 p.83}."
  en: "The sixth and last chapter of the nerves group says the first sacral pair mingles with the lumbar nerves, and that the remaining pairs and the single nerve growing from the tip of the coccyx spread in the muscles of the anus, penis, bladder and uterus {cite:canon-ibn-sina-print-v1 p.83}."
