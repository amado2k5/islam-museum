id: concept/sacral-and-coccygeal-nerves
class: concept
kind: scientific
label: { ar: "أعصاب العجز والعصعص عند ابن سينا", en: "Sacral and coccygeal nerves in the Canon", ur: "قانون میں عجز اور دم چوٹ کے اعصاب", es: "Nervios sacro y coccígeo en el Canon", fr: "Nerfs sacrés et coccygiens dans le canon", tr: "İbn Sina'da sakral ve kuyruk sokumu sinirleri", id: "Saraf sakral dan tulang ekor pada Ibn Sina" }
summary:
  ar: "الفصل السادس والأخير من جملة العصب يذكر أن أول زوج عجزي يخالط الأعصاب القطنية، وأن باقي الأزواج والفرد النابت من طرف العصعص يتفرق في عضل المقعدة والقضيب والمثانة والرحم {cite:canon-ibn-sina-print-v1 p.83}."
  en: "The sixth and last chapter of the nerves group says the first sacral pair mingles with the lumbar nerves, and that the remaining pairs and the single nerve growing from the tip of the coccyx spread in the muscles of the anus, penis, bladder and uterus {cite:canon-ibn-sina-print-v1 p.83}."
  es: "El sexto y último capítulo del grupo de nervios dice que el primer par sacro se mezcla con los nervios lumbares, y que los pares restantes y el nervio único que crece desde la punta del cóccix se extienden por los músculos del ano, el pene, la vejiga y el útero {cite:canon-ibn-sina-print-v1 p.83}."
  fr: "Le sixième et dernier chapitre du groupe des nerfs indique que la première paire sacrée se mêle aux nerfs lombaires, et que les paires restantes et le nerf unique qui pousse à partir de l'extrémité du coccyx se répandent dans les muscles de l'anus, du pénis, de la vessie et de l'utérus {cite:canon-ibn-sina-print-v1 p.83}."
  ur: "اعصابی گروپ کا چھٹا اور آخری باب کہتا ہے کہ پہلا سیکرل جوڑا ریڑھ کی ہڈی کے اعصاب کے ساتھ مل جاتا ہے، اور یہ کہ بقیہ جوڑے اور کوکسیکس کی نوک سے بڑھنے والا واحد اعصاب مقعد، عضو تناسل، مثانے اور بچہ دانی کے پٹھوں میں پھیلتا ہے۔"
  tr: "Sinir bölümünün altıncı ve son bölümü, ilk sakral çiftin lomber sinirlerle bağlandığını, diğer çiftlerin ise kuyruk kuyruğunun yanından büyüyen bireyin oturak, penis, mesane ve rahmde dağıldığını, belirtir {cite:canon-ibn-sina-print-v1 s.83}."
  id: "Bab keenam dan terakhir dari bagian Saraf menyebutkan bahwa pasangan sakral pertama terhubung dengan saraf lumbar, sementara pasangan lainnya dan individu yang tumbuh dari sisi tulang ekor menyebar di tempat duduk, penis, kandung kemih, dan rahim {cite:canon-ibn-sina-print-v1 hlm.83}."
