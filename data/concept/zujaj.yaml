label:
  ar: "الزجاج"
  en: "Zujaj (glass)"
  ur: "شیشہ ⁦(زجاج)⁩"
  es: "Zujaj (vaso)"
  fr: "Zujaj (verre)"
summary:
  ar: "الزجاج حار في الأولى يابس في الثانية، فيه قبض ولطافة؛ يجلو الأسنان، وينبت الشعر بدهن الزنبق، ويجلو العين ويذهب بياضها، والمسحوق المحرق منه نافع لحصاة المثانة. {cite:canon-ibn-sina-print-v1 p.461}"
  en: "Glass is hot in the first degree and dry in the second, with astringency and fineness. It polishes the teeth, grows hair when rubbed with lily oil, clears the eye and removes its whiteness, and the powdered burnt form helps bladder stone. {cite:canon-ibn-sina-print-v1 p.461}"
  ur: "شیشہ پہلے درجے میں گرم اور دوسرے میں خشک ہے، اس میں قبض اور لطافت ہے؛ یہ دانت چمکاتا، زنبق کے تیل کے ساتھ بال اگاتا، آنکھ کو صاف کرتا اور سفیدی دور کرتا ہے، اور جلے ہوئے پسے ہوئے شیشے کا سفوف مثانے کی پتھری میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.461}"
  es: "El vidrio es caliente en primer grado y seco en segundo, con astringencia y finura. Pule los dientes, estimula el crecimiento del cabello al frotarlo con aceite de lirio, aclara los ojos y elimina su blancura, y el vidrio quemado en polvo ayuda a disolver los cálculos vesicales. {cite:canon-ibn-sina-print-v1 p.461}"
  fr: "Le verre est chaud au premier degré et sec au second, avec une texture astringente et fine. Il polit les dents, favorise la pousse des cheveux lorsqu'on le frotte avec de l'huile de lys, éclaircit l'œil et enlève le blanc des yeux, et sa forme brûlée en poudre aide à dissoudre les calculs vésicaux. {cite:canon-ibn-sina-print-v1 p.461}"
