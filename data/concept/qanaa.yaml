label:
  ar: "القناعة"
  en: "Contentment (qana'a)"
  ur: "قناعت"
summary:
  ar: "القناعة في تعليم الشيخ عمر عبد الكافي رضا النفس بما قسم الله، في مقابل الطمع الذي يجعل الإنسان لا يكتفي بالقليل. ويرى الشيخ أن الطمع من طبع الإنسان، وأن الإنسان لا يتمنى ما عند غيره، بل يسأل الله من فضله."
  en: "In Sheikh Omar Abdelkafy's lessons, contentment (qana'a) is the soul's acceptance of what God has apportioned, set against greed, which stops a person from being satisfied with little. He says greed is part of human nature, and that one should not wish for what others have, but ask God for His bounty."
  ur: "شیخ عمر عبدالکافی کے درسوں میں قناعت اس بات کو کہتے ہیں کہ نفس اس پر راضی ہو جو اللہ نے تقسیم کیا، جبکہ لالچ انسان کو تھوڑے پر راضی نہیں ہونے دیتا۔ شیخ کے مطابق لالچ انسانی فطرت کا حصہ ہے، اور آدمی دوسروں کی چیزوں کی تمنا نہ کرے بلکہ اللہ سے اس کا فضل مانگے۔"
