label:
  ar: "القناعة"
  en: "Contentment (qana'a)"
  ur: "قناعت"
  es: "Contentamiento (qana'a)"
  fr: "Contentement (qana'a)"
  tr: "Memnuniyet"
  id: "Kepuasan"
summary:
  ar: "القناعة في تعليم الشيخ عمر عبد الكافي رضا النفس بما قسم الله، في مقابل الطمع الذي يجعل الإنسان لا يكتفي بالقليل. ويرى الشيخ أن الطمع من طبع الإنسان، وأن الإنسان لا يتمنى ما عند غيره، بل يسأل الله من فضله."
  en: "In Sheikh Omar Abdelkafy's lessons, contentment (qana'a) is the soul's acceptance of what God has apportioned, set against greed, which stops a person from being satisfied with little. He says greed is part of human nature, and that one should not wish for what others have, but ask God for His bounty."
  ur: "شیخ عمر عبدالکافی کے درسوں میں قناعت اس بات کو کہتے ہیں کہ نفس اس پر راضی ہو جو اللہ نے تقسیم کیا، جبکہ لالچ انسان کو تھوڑے پر راضی نہیں ہونے دیتا۔ شیخ کے مطابق لالچ انسانی فطرت کا حصہ ہے، اور آدمی دوسروں کی چیزوں کی تمنا نہ کرے بلکہ اللہ سے اس کا فضل مانگے۔"
  es: "En las enseñanzas del jeque Omar Abdelkafy, la satisfacción (qana'a) es la aceptación del alma de lo que Dios ha repartido, en contraposición a la codicia, que impide que la persona se conforme con poco. Afirma que la codicia forma parte de la naturaleza humana y que uno no debe desear lo que otros tienen, sino pedirle a Dios su generosidad."
  fr: "Dans les enseignements du cheikh Omar Abdelkafy, le contentement (qana'a) est l'acceptation par l'âme de ce que Dieu a accordé, par opposition à l'avidité qui empêche de se satisfaire du peu. Il affirme que l'avidité fait partie de la nature humaine et qu'il ne faut pas envier ce que possèdent les autres, mais implorer la grâce divine."
  tr: "Şeyh Ömer Abdulkafi'nin öğretisindeki memnuniyet, Tanrı'nın verdiği şeyle kendini tatmin etmektir; açgözlülük, insanı azla yetinmemesine neden olur. Şeyh, açgözlülüğün insan doğası olduğuna ve bir kişinin başkalarının sahip olduklarını istemediğine, bunun yerine Tanrı'dan lütf dilediğine inanır."
  id: "Kepuasan dalam ajaran Sheikh Omar Abdul Kafi adalah kepuasan diri terhadap apa yang telah diberikan Tuhan, berbeda dengan keserakahan yang membuat seseorang tidak puas dengan sedikit. Sheikh percaya bahwa keserakahan adalah sifat manusia, dan bahwa seseorang tidak menginginkan apa yang dimiliki orang lain, melainkan memohon kepada Allah atas anugerah-Nya."
