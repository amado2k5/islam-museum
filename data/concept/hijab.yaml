id: concept/hijab
class: concept
kind: legal
sensitivity: contested
label:
  ar: الحجاب
  en: The hijab
  ur: حجاب
summary:
  ar: "الحجاب في اصطلاح الفقهاء ما يستر المرأة، وتعقد له الموسوعة الفقهية الكويتية مادة مستقلة تفرق إطلاقاته الحسية والمعنوية {cite:fiqh-mawsua-kuwaitiyya-noor-v3}. وتتتبع دائرة المعارف الإسلامية اللفظ في أربعة اتجاهات: حجاب النساء الذي عُمّم بعد أزواج النبي على الحرائر، وستار الخلفاء والحكام، وحجاب الصوفية، والحرز. وتروي تحول السفور في مصر على يد قاسم أمين وهدى شعراوي."
  en: "The hijab in juristic usage is that which veils the woman; the Kuwaiti Fiqh Encyclopedia gives it a dedicated entry distinguishing its material and figurative senses {cite:fiqh-mawsua-kuwaitiyya-noor-v3}. The Encyclopaedia of Islam follows the word in four directions: the veiling of women, extended from the Prophet's wives to free Muslim women; the curtain of caliphs and rulers; the mystics' veil; and the amulet. It also recounts the unveiling movement in Egypt around Qasim Amin and Huda Sharawi."
  ur: "فقہاء کی اصطلاح میں حجاب وہ چیز ہے جو عورت کو ڈھانپے، اور کویتی فقہ دائرۃ المعارف اس کا مستقل مضمون رکھتی ہے جس میں حسی اور معنوی معانی ممیز ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3}۔ دائرۃ المعارفِ اسلامیہ اس لفظ کو چار سمتوں میں دیکھتا ہے: عورتوں کا پردہ جو ازواجِ نبی سے آزاد مسلمان عورتوں تک پھیلا، خلفا اور حکمرانوں کا پردہ، صوفیہ کا حجاب، اور تعویذ۔ وہ مصر میں قاسم امین اور ہدیٰ شعراوی کے گرد پردہ اتارنے کی تحریک بھی بیان کرتا ہے۔"
