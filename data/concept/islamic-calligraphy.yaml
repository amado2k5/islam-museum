id: concept/islamic-calligraphy
class: concept
kind: art_form
label:
  ar: "الخط الإسلامي"
  en: "Islamic calligraphy"
  es: "caligrafía islámica"
  fr: "calligraphie islamique"
  ur: "اسلامی خطاطی۔"
  tr: "İslami Hat Sanatı"
  id: "Kaligrafi Islam"
summary:
  ar: "فن كتابة الحرف العربي وتشكيله جمالياً؛ أشرف الفنون الإسلامية لارتباطه بكتابة القرآن. تصف دائرة المعارف الإسلامية في طبعتها الثانية تطوره من الخط الأموي المتوازن إلى الكوفي الزخرفي ثم الخطوط المدورة التي نظّمها ابن مقلة وبلغت ذروتها مع ابن البواب وياقوت المستعصمي. وتتتبع المقالة انتقال الأقلام الستة إلى بلاد فارس وتركيا والهند، وظهور التعليق والنستعليق والديواني."
  en: "The art of beautiful Arabic script, the noblest Islamic art for its link to writing the Qur'an. The second edition of the Encyclopaedia of Islam traces it from the balanced Umayyad script to ornamental kufic and then the rounded scripts ordered by Ibn Muqla and brought to their height by Ibn al-Bawwab and Yaqut al-Musta'simi. It follows the six styles into Persia, Turkey and India, and the rise of ta'liq, nasta'liq and diwani."
  ur: "عربی حرف کو جمالیاتی انداز میں لکھنے کا فن، جو قرآن کی کتابت سے تعلق کی وجہ سے اسلامی فنون میں سب سے شریف ہے۔ انسائیکلوپیڈیا آف اسلام کا دوسرا ایڈیشن اس کا ارتقا متوازن اموی خط سے آرائشی کوفی اور پھر ان گول خطوط تک بیان کرتا ہے جنہیں ابن مقلہ نے منظم کیا اور ابن البواب اور یاقوت مستعصمی نے عروج دیا۔ مضمون چھ اقلام کے ایران، ترکی اور ہندوستان تک پہنچنے اور تعلیق، نستعلیق اور دیوانی کے ابھرنے کو بھی دیکھتا ہے۔"
  es: "El arte de la bella escritura árabe, la más noble expresión del arte islámico por su vínculo con la escritura del Corán. La segunda edición de la Enciclopedia del Islam la recorre desde la equilibrada escritura omeya hasta la cúfica ornamental, pasando por las escrituras redondeadas ordenadas por Ibn Muqla y llevadas a su máximo esplendor por Ibn al-Bawwab y Yaqut al-Musta'simi. Sigue la evolución de los seis estilos hasta Persia, Turquía e India, y el surgimiento del ta'liq, el nasta'liq y el diwani."
  fr: "L'art de la belle écriture arabe, le plus noble des arts islamiques de par son lien avec la transcription du Coran, est retracé dans la deuxième édition de l'Encyclopédie de l'Islam. Cette dernière en retrace l'évolution, depuis l'écriture omeyyade équilibrée jusqu'au coufique ornemental, puis aux écritures arrondies ordonnées par Ibn Muqla et portées à leur apogée par Ibn al-Bawwab et Yaqut al-Musta'simi. Elle suit la diffusion des six styles en Perse, en Turquie et en Inde, ainsi que l'essor du ta'liq, du nasta'liq et du diwani."
  tr: "Arap alfabesini yazma sanatı ve estetik oluşumu; Kur'an yazımıyla bağlantısı nedeniyle en onurlu İslami sanatlardır. İslami Ansiklopedi'nin İkinci Baskısı, dengeli Emevi alfabesinden dekoratif Kufi alfabesine doğru gelişimini, ardından İbn Mukalla tarafından düzenlenen yuvarlak yazı yazılarına ve İbn el-Bavwab ile Yaqut al-Musta'simi ile doruğa ulaştığını anlatır. Makale, altı kalemin İran, Türkiye ve Hindistan'a göçünü ve tefsir, Nastaliq ve Diwan'ın ortaya çıkışını izler."
  id: "Seni menulis aksara Arab dan pembentukan estetikanya; seni Islam yang paling terhormat karena kaitannya dengan penulisan Al-Qur'an. Edisi Kedua Ensiklopedia Islam menggambarkan perkembangannya dari aksara Umayyah yang seimbang menjadi aksara Kufik dekoratif, kemudian aksara bulat yang disusun oleh Ibn Muqalla, yang berpuncak pada Ibn al-Bawwab dan Yaqut al-Musta'simi. Artikel ini menelusuri migrasi enam pena ke Persia, Turki, dan India, serta munculnya komentar, Nastaliq, dan Diwan."
