label:
  ar: "الخط الإسلامي"
  en: "Islamic calligraphy"
summary:
  ar: "فن كتابة الحرف العربي وتشكيله جمالياً؛ أشرف الفنون الإسلامية لارتباطه بكتابة القرآن. تصف دائرة المعارف الإسلامية في طبعتها الثانية تطوره من الخط الأموي المتوازن إلى الكوفي الزخرفي ثم الخطوط المدورة التي نظّمها ابن مقلة وبلغت ذروتها مع ابن البواب وياقوت المستعصمي. وتتتبع المقالة انتقال الأقلام الستة إلى بلاد فارس وتركيا والهند، وظهور التعليق والنستعليق والديواني."
  en: "The art of beautiful Arabic script, the noblest Islamic art for its link to writing the Qur'an. The second edition of the Encyclopaedia of Islam traces it from the balanced Umayyad script to ornamental kufic and then the rounded scripts ordered by Ibn Muqla and brought to their height by Ibn al-Bawwab and Yaqut al-Musta'simi. It follows the six styles into Persia, Turkey and India, and the rise of ta'liq, nasta'liq and diwani."
  ur: "عربی حرف کو جمالیاتی انداز میں لکھنے کا فن، جو قرآن کی کتابت سے تعلق کی وجہ سے اسلامی فنون میں سب سے شریف ہے۔ انسائیکلوپیڈیا آف اسلام کا دوسرا ایڈیشن اس کا ارتقا متوازن اموی خط سے آرائشی کوفی اور پھر ان گول خطوط تک بیان کرتا ہے جنہیں ابن مقلہ نے منظم کیا اور ابن البواب اور یاقوت مستعصمی نے عروج دیا۔ مضمون چھ اقلام کے ایران، ترکی اور ہندوستان تک پہنچنے اور تعلیق، نستعلیق اور دیوانی کے ابھرنے کو بھی دیکھتا ہے۔"
