label:
  ar: "الأشعرية"
  en: "Ash'ariyya (the Ash'ari school of theology)"
summary:
  ar: "مدرسة كلامية نسبت إلى أبي الحسن الأشعري (ت 324هـ)، ونشأت في سنواته الأخيرة بتلاميذ جمعهم حوله، ثم صارت المدرسة الغالبة في البلاد الناطقة بالعربية من الخلافة العباسية، متحالفة في الغالب مع فقه الشافعي؛ وعند الغزالي والجويني وغيرهما انتقلت إلى الفلسفة والمنطق {cite:encyclopaedia-of-islam-2 vol. 1 p. 745}."
  en: "A theological school named after Abu 'l-Hasan al-Ash'ari (d. 324 AH), founded by disciples who gathered round him in the last two decades of his life. It became the dominant school in the Arabic-speaking parts of the 'Abbasid caliphate, usually allied with Shafi'i law, and under al-Ghazali, al-Juwayni and others it took in Aristotelian logic and Neoplatonic metaphysics {cite:encyclopaedia-of-islam-2 vol. 1 p. 745}."
