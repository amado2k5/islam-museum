label:
  ar: "الأشعرية"
  en: "Ash'ariyya (the Ash'ari school of theology)"
  fr: "Ash'ariyya (l’école théologique acharite)"
  es: "Ash'ariyya (la escuela teológica Ash'ari)"
  ur: "اشعریہ ⁦(مکتبہ اشعری)⁩"
summary:
  ar: "مدرسة كلامية نسبت إلى أبي الحسن الأشعري ⁦(ت 324هـ)⁩، ونشأت في سنواته الأخيرة بتلاميذ جمعهم حوله، ثم صارت المدرسة الغالبة في البلاد الناطقة بالعربية من الخلافة العباسية، متحالفة في الغالب مع فقه الشافعي؛ وعند الغزالي والجويني وغيرهما انتقلت إلى الفلسفة والمنطق {cite:encyclopaedia-of-islam-2 vol. 1 p. 745}."
  en: "A theological school named after Abu 'l-Hasan al-Ash'ari (d. 324 AH), founded by disciples who gathered round him in the last two decades of his life. It became the dominant school in the Arabic-speaking parts of the 'Abbasid caliphate, usually allied with Shafi'i law, and under al-Ghazali, al-Juwayni and others it took in Aristotelian logic and Neoplatonic metaphysics {cite:encyclopaedia-of-islam-2 vol. 1 p. 745}."
  fr: "École théologique nommée d’après Abu 'l-Hasan al-Ash'ari (mort en 324 H), fondée par les disciples réunis autour de lui durant les deux dernières décennies de sa vie. Elle devint dominante dans les régions arabophones du califat abbasside, généralement alliée au droit chaféite ; avec al-Ghazali, al-Juwayni et d’autres, elle intégra la logique aristotélicienne et la métaphysique néoplatonicienne {cite:encyclopaedia-of-islam-2 vol. 1 p. 745}."
  es: "Una escuela teológica que lleva el nombre de Abu 'l-Hasan al-Ash'ari (fallecido en el año 324 de la Hégira), fundada por discípulos que se reunieron a su alrededor en las dos últimas décadas de su vida. Se convirtió en la escuela dominante en las partes de habla árabe del califato abasí, generalmente aliada con la ley shafi'í, y bajo al-Ghazali, al-Juwayni y otros, adoptó la lógica aristotélica y la metafísica neoplatónica {cite:encyclopaedia-of-islam-2 vol. 1 p. 745}."
  ur: "ابو الحسن اشعری ⁦(متوفی 324 ہجری)⁩ کے نام سے منسوب ایک مذہبی اسکول، جس کی بنیاد ان شاگردوں نے رکھی جو ان کی زندگی کی آخری دو دہائیوں میں ان کے گرد جمع ہوئے۔ یہ عباسی خلافت کے عربی بولنے والے حصوں میں غالب مکتبہ بن گیا، جو عام طور پر شافعی قانون کے ساتھ منسلک تھا، اور الغزالی، الجوینی اور دیگر کے تحت اس نے ارسطو منطق اور نوپلاٹونک مابعدالطبیعیات میں لیا {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 745}۔"
