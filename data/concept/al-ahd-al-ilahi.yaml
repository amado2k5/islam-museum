    id: sunni-sharawi
    stance:
      ar: "ثلاثة معان محتملة، وكلها وارد عنده، وأولها عهد الفطرة"
      en: "Three meanings are possible, and he takes all of them as possible, beginning with the covenant of the fitra"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يعرض الشعراوي ثلاثة معان للعهد: عهد الفطرة، وعهد الأنبياء بالإيمان بالرسول الخاتم، وعهد علماء بني إسرائيل بعدم كتم ما في التوراة، ويقول إن كلها وارد {cite:tafsir-sharawi-khawatir-scan p.290} {cite:tafsir-sharawi-khawatir-scan p.291}."
      en: "Sha'rawi sets out three meanings of the covenant: the covenant of the fitra, the covenant of the prophets to believe in the final messenger, and the covenant of the scholars of the Children of Israel not to conceal what is in the Torah, and he says all of them are possible {cite:tafsir-sharawi-khawatir-scan p.290} {cite:tafsir-sharawi-khawatir-scan p.291}."
