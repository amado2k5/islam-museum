id: concept/al-ahd-al-ilahi
class: concept
kind: doctrine
label:
  ar: "العهد الإلهي"
  en: "The divine covenant (al-ahd)"
  ur: "عہدِ الٰہی"
summary:
  ar: "يرى الشعراوي أن العهد الإلهي يحتمل ثلاثة معان: عهد الفطرة بالإيمان وشكر النعم، وعهد الأنبياء بالإيمان بالرسول الخاتم ونصره، وعهد علماء بني إسرائيل ألا يكتموا ما في كتبهم، وأن الله يوفي بعهده بالجنة لمن وفى {cite:tafsir-sharawi-khawatir-scan p.289} {cite:tafsir-sharawi-khawatir-scan p.290} {cite:tafsir-sharawi-khawatir-scan p.291} {cite:tafsir-sharawi-khawatir-scan p.292}."
  en: "Sha'rawi holds that the divine covenant can mean three things: the covenant of the fitra to believe and be grateful for God's favours; the covenant of the prophets to believe in and support the final messenger; and the covenant of the scholars of the Children of Israel not to conceal what is in their books. He holds that God fulfils His covenant with the promise of Paradise to those who keep theirs {cite:tafsir-sharawi-khawatir-scan p.289} {cite:tafsir-sharawi-khawatir-scan p.290} {cite:tafsir-sharawi-khawatir-scan p.291} {cite:tafsir-sharawi-khawatir-scan p.292}."
  ur: "شعراوی کے نزدیک عہدِ الٰہی کے تین مفہوم ہو سکتے ہیں: فطرت کا عہد کہ اللہ پر ایمان لایا جائے اور اس کی نعمتوں کا شکر کیا جائے، انبیاء کا عہد کہ آخری رسول پر ایمان لایا جائے اور ان کی مدد کی جائے، اور بنی اسرائیل کے علماء کا عہد کہ کتابوں کی باتیں نہ چھپائیں۔ ان کے نزدیک اللہ اپنا عہد جنت کے وعدے سے پورا کرتا ہے، جو اپنا عہد نبھائے {cite:tafsir-sharawi-khawatir-scan p.289} {cite:tafsir-sharawi-khawatir-scan p.290} {cite:tafsir-sharawi-khawatir-scan p.291} {cite:tafsir-sharawi-khawatir-scan p.292}۔"
wings: [ideas]
themes: [scripture-and-its-sciences]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "ما العهد المقصود في الآيات التي تأمر بالوفاء بعهد الله، وهل هو عهد الفطرة أم عهد الأنبياء أم عهد علماء أهل الكتاب؟"
  en: "Which covenant is meant in the verses that command fulfilling God's covenant: the covenant of the fitra, the covenant of the prophets, or the covenant of the scholars of the People of the Book?"
