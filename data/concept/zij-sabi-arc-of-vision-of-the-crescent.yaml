id: concept/zij-sabi-arc-of-vision-of-the-crescent
class: concept
kind: scientific
label: { ar: "قوس رؤية الهلال", en: "The arc of vision of the crescent", ur: "ہلال کی رؤیت کا قوس", es: "El arco de visión de la media luna", fr: "L'arc de vision du croissant" }
summary:
  ar: "يحدد البتاني قوس الرؤية من معدل النهار بنحو عشرة أجزاء ونصف وثلث جزء عندما تكون الشمس في بُعدها الأقرب والقمر في بُعده الأبعد، وبنحو ثلاثة عشر جزءاً وثلث في الحالة المقابلة، ويقول إن هذا القوس يتبين في الأقاليم مع الحساب. {cite:zij-sabi-nallino-byblion p.130}."
  en: "Al-Battani sets the arc of vision from the equator at about ten and a half and a third parts when the Sun is at its nearest and the Moon at its farthest, and at about thirteen and a third parts in the opposite case. He says this arc is clear in the climes with the reckoning. {cite:zij-sabi-nallino-byblion p.130}."
  ur: "البتانی رؤیت کا قوس معدل النہار سے تقریباً ساڑھے دس اور ایک تہائی جزو بتاتے ہیں جب سورج اپنے قریب ترین فاصلے پر ہو اور چاند اپنے دور ترین پر، اور مخالف صورت میں تقریباً تیرہ اور ایک تہائی جزو؛ اور کہتے ہیں کہ یہ قوس حساب کے ساتھ اقالیم میں واضح ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.130}۔"
  es: "Al-Battani sitúa el arco de visión desde el ecuador en aproximadamente diez partes y media y un tercio cuando el Sol está en su punto más cercano y la Luna en su punto más lejano, y en aproximadamente trece partes y un tercio en el caso contrario. Afirma que este arco es nítido en los climas con el sistema de coordenadas. {cite:zij-sabi-nallino-byblion p.130}."
  fr: "Al-Battani fixe l'arc de vision depuis l'équateur à environ dix parties et demie et un tiers lorsque le Soleil est au plus près et la Lune au plus loin, et à environ treize parties et un tiers dans le cas inverse. Il précise que cet arc est clairement visible sous les climats où le calcul est effectué. {cite:zij-sabi-nallino-byblion p.130}."
