summary:
  ar: "يسمي البتاني نقطتي تقاطع الفلك المائل مع فلك البروج الرأس والذنب؛ فعرض القمر يمتد شمالاً من الرأس وجنوباً من الذنب، وهما موضعا تقاطع المدارين. {cite:zij-sabi-nallino-byblion p.76}."
  en: "Al-Battani calls the two points where the inclined sphere cuts the zodiac's sphere the head and the tail. The Moon's latitude runs north from the head and south from the tail, and these are the points where the two circles meet. {cite:zij-sabi-nallino-byblion p.76}."
  ur: "البتانی مائل فلک اور بروجی فلک کے دونوں تقاطعی نکتوں کو رأس اور ذنب کہتے ہیں؛ چاند کا عرض رأس سے شمال کی طرف اور ذنب سے جنوب کی طرف ہوتا ہے، اور یہی دونوں دائروں کے ملنے کے نکتے ہیں۔ {cite:zij-sabi-nallino-byblion p.76}۔"
