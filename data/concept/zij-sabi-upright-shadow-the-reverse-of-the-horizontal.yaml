id: concept/zij-sabi-upright-shadow-the-reverse-of-the-horizontal
class: concept
kind: scientific
label: { ar: "الظل المنتصب عكس المبسوط في الزيج الصابي", en: "The upright shadow, the reverse of the horizontal", ur: "کھڑا سایہ، افقی سایے کا الٹ", es: "La sombra vertical, el reverso de la horizontal", fr: "L'ombre verticale, l'inverse de l'horizontale", tr: "Sabi'i zij'deki dik gölge, uzamış gölgenin tam tersidir.", id: "Bayangan tegak adalah kebalikan dari bayangan memanjang pada Sabi'i zij." }
summary:
  ar: "يقول البتاني إن الظل المنتصب، وهو القائم، على عكس المبسوط: فأطول ما يكون وقت انتصاف النهار وأقصر ما يكون عند طلوع الشمس. ويُعرف من الارتفاع بضرب وتر الارتفاع في أجزاء المقياس وقسمة الحاصل على وتر تمام الارتفاع، ويُعرف الارتفاع منه بالعكس بحساب جذر مجموع المربعين. {cite:zij-sabi-nallino-byblion p.36}."
  en: "Al-Battani says the upright shadow, the standing one, is the reverse of the horizontal: it is longest at noon and shortest at sunrise. It is found from the altitude by multiplying the chord of the altitude by the gnomon's parts and dividing by the chord of the altitude's complement, and the altitude is found from it conversely through the root of the sum of the two squares. {cite:zij-sabi-nallino-byblion p.36}."
  ur: "البتانی کہتے ہیں کہ ظل منتصب یعنی کھڑا سایہ بسیط کے الٹ ہے: وہ دوپہر کے وقت سب سے لمبا اور طلوع آفتاب کے وقت سب سے چھوٹا ہوتا ہے۔ وہ ارتفاع سے ارتفاع کے وتر کو مقیاس کے اجزا سے ضرب دے کر اور ارتفاع کے تتمے کے وتر پر تقسیم کر کے معلوم ہوتا ہے، اور اس سے ارتفاع الٹ کر دو مربعوں کے مجموعے کے جذر سے معلوم ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.36}۔"
  es: "Al-Battani afirma que la sombra vertical, la que se proyecta hacia arriba, es la inversa de la horizontal: es más larga al mediodía y más corta al amanecer. Se obtiene a partir de la altitud multiplicando la cuerda de la altitud por las partes del gnomon y dividiendo por la cuerda del complemento de la altitud; y la altitud se obtiene a la inversa mediante la raíz cuadrada de la suma de los dos cuadrados. {cite:zij-sabi-nallino-byblion p.36}."
  fr: "Al-Battani affirme que l'ombre verticale, l'ombre portée, est l'inverse de l'ombre horizontale: elle est la plus longue à midi et la plus courte au lever du soleil. On la calcule à partir de la hauteur en multipliant la corde de la hauteur par les parties du gnomon et en divisant par la corde du complément de la hauteur; la hauteur se calcule inversement en prenant la racine carrée de la somme des deux carrés. {cite:zij-sabi-nallino-byblion p.36}."
  tr: "El-Battani, dik gölgenin, uzamış gölgenin aksine, öğle vakti en uzun, gün doğumu vakti ise en kısa olduğunu belirtir. Yüksekliği, yüksekliğin hipotenüsünü ölçeğin parçalarıyla çarparak ve sonucu yüksekliğin katsayısının hipotenüsüne bölerek bulunur. Tersine, yükseklik, karelerin toplamının karekökünü hesaplayarak da bulunur. {cite:zij-sabi-nallino-byblion s.36}."
  id: "Al-Battani menyatakan bahwa bayangan tegak, tidak seperti bayangan memanjang, paling panjang pada tengah hari dan paling pendek saat matahari terbit. Tingginya ditentukan dengan mengalikan sisi miring tinggi dengan bagian-bagian skala dan membagi hasilnya dengan sisi miring koefisien tinggi. Sebaliknya, tinggi ditentukan dengan menghitung akar kuadrat dari jumlah kuadrat. {cite:zij-sabi-nallino-byblion p.36}."
