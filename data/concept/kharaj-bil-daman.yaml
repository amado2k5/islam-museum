label:
  ar: "الخراج بالضمان"
  en: "Al-kharaj bil-daman (yield follows liability)"
  es: "Al-kharaj bil-daman (el rendimiento sigue a la responsabilidad)"
  fr: "Al-kharaj bil-daman (le rendement suit la responsabilité)"
  ur: "الخراج بل دامن ⁦(پیداوار ذمہ داری کے بعد)⁩"
  tr: "Garantili apse"
  id: "Abses dengan garansi"
summary:
  ar: "«الخراج بالضمان» حديث يقرر أن الغلة لمن يضمن الأصل، وهو عند المؤلف أصل لربط العائد بالمخاطرة {cite:usul-iqtisad-islami-0660 p. 202} {cite:usul-iqtisad-islami-0660 p. 240}. ومعناه أن من اشترى عبداً له غلة ثم وجد فيه عيباً فرده، فالغلة للمشتري لأنه كان مالكاً ضامناً {cite:usul-iqtisad-islami-0660 p. 240} {cite:usul-iqtisad-islami-0660 p. 284}."
  tr: "\"Sorumlulukla Kharaj\", getirinin ana parayı garanti eden kişiye ait olduğunu ortaya koyan bir hadistir ve yazara göre, riskin geri dönüşünü birbirine bağlayan bir ilkedir {cite:usul-iqtisad-islami-0660 s. 202} {cite:usul-iqtisad-islami-0660 s. 240}. Anlamı, getirisi olan bir köleyi satın alan ve onda bir kusur bulan kişinin, onu geri vermesidir; böylece getiri alıcıya aittir çünkü o sahibi ve sorumluydu {cite:usul-iqtisad-islami-0660 s. 240} {cite:usul-iqtisad-islami-0660, s. 284}."
  id: "\"Kharaj karena kewajiban\" adalah hadits yang menetapkan bahwa hasil tersebut milik orang yang menjamin prinsip, dan menurut penulis, ini adalah prinsip yang menghubungkan pengembalian risiko {cite:usul-iqtisad-islami-0660 hlm. 202} {cite:usul-iqtisad-islami-0660 hlm. 240}. Artinya adalah siapa pun yang membeli budak yang memiliki hasil dan menemukan cacat di dalamnya, mengembalikannya, sehingga hasil tersebut menjadi milik pembeli karena dia adalah pemilik dan bertanggung jawab {cite:usul-iqtisad-islami-0660 hlm. 240} {cite:usul-iqtisad-islami-0660, hlm. 284}."
