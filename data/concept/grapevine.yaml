summary:
  ar: "من آيات الله في الأرض كرم ينبت في الجنات المعروشات وغير المعروشات، وفي الجنة جنات من أعناب، وفي مثل صاحب الجنتين كرم ونخل."
  en: "Among God's signs in the earth the vine grows in trellised and untrellised gardens; in Paradise are gardens of vines, and in the parable of the two gardens one had grapes and palms."
  ur: "زمین میں اللہ کی نشانیوں میں بیل جالدار اور بے جال باغوں میں اُگتی ہے؛ جنت میں انگوروں کے باغ ہیں اور دو باغوں والے کی مثال میں انگور اور کھجوریں تھیں۔"
  es: "Entre los signos de Dios en la tierra, la vid crece en jardines con y sin enrejado; en el Paraíso hay jardines de vides, y en la parábola de los dos jardines, uno tenía uvas y palmeras."
  fr: "Parmi les signes de Dieu sur la terre, la vigne pousse dans des jardins palissés et non palissés; au Paradis se trouvent des jardins de vignes, et dans la parabole des deux jardins, il y avait des raisins et des palmiers."
  tr: "Allah'ın yeryüzündeki işaretlerinden biri, döşeli ve asfaltsız bahçelerde yetişen cömertliktir; cennette üzüm bahçeleri vardır ve iki bahçenin sahibinin örneğinde bağ ve palmiye ağaçları vardır."
  id: "Di antara tanda-tanda Allah di bumi adalah kemurahan hati yang tumbuh di taman yang beraspal dan yang belum beraspal, dan di surga terdapat kebun anggur, dan menurut teladan pemilik kedua taman itu, terdapat kebun anggur dan pohon palem."
