id: concept/zij-sabi-venus-distance-and-apparent-size
class: concept
kind: scientific
label: { ar: "بُعد الزهرة وقطرها الظاهر وعظم جرمها", en: "The distance, apparent diameter and size of Venus", ur: "زہرہ کا بُعد، ظاہری قطر اور جرم", es: "La distancia, el diámetro aparente y el tamaño de Venus", fr: "La distance, le diamètre apparent et la taille de Vénus", tr: "Çiçeğin mesafesi, görünen çapı ve gövdesinin büyüklüğü.", id: "Jarak antar bunga, diameter tampak, dan ukuran tubuhnya." }
summary:
  ar: "يذكر النص أن الزهرة يتفاوت عظمها بين بعديها بكسر يذكره النص، وأن قطرها الظاهر اثنتان وثلاثون دقيقة وسبع وعشرون ثانية، وأن عظم جرمها جزء من ستة وثلاثين من عظم الأرض بالتقريب، وأن قطرها الظاهر على أبعادها المختلفة يتغير. وأما مركز فلكها وفلك تدويرها فيُعلم عظم قطر كل منهما بما تقدم. {cite:zij-sabi-nallino-byblion pp.187-188}"
  en: "The text gives Venus's apparent diameter as thirty-two minutes and twenty-seven seconds of arc, and its bulk as about one part in thirty-six of the Earth. Its size changes between its distances, and the text refers back to what was said of the diameters of the epicycle. {cite:zij-sabi-nallino-byblion pp.187-188}"
  ur: "متن زہرہ کا ظاہری قطر بتیس دقیقے اور ستائیس ثانیے بتاتا ہے، اور اس کا جرم زمین کے جرم کا تقریباً چھتیسواں حصہ۔ اس کا جسم اپنے مختلف بُعدوں کے مطابق بدلتا ہے، اور متن فلکِ تدویر کے قطروں کے بیان کی طرف لوٹتا ہے۔ {cite:zij-sabi-nallino-byblion pp.187-188}"
  es: "El texto indica que el diámetro aparente de Venus es de treinta y dos minutos y veintisiete segundos de arco, y su volumen es aproximadamente una parte en treinta y seis de la Tierra. Su tamaño varía según la distancia a la que se encuentre, y el texto remite a lo dicho sobre los diámetros del epiciclo. {cite:zij-sabi-nallino-byblion pp.187-188}"
  fr: "Le texte indique que le diamètre apparent de Vénus est de trente-deux minutes et vingt-sept secondes d'arc, et que sa masse représente environ une partie sur trente-six de celle de la Terre. Sa taille varie selon la distance, et le texte fait référence aux diamètres de l'épicycle. {cite:zij-sabi-nallino-byblion pp.187-188}"
  tr: "Metinde, Venüs'ün iki boyutu arasında belirtilen bir oranda büyüklüğünü değiştirdiği, görünen çapının otuz iki dakika yirmi yedi saniye olduğu, kütlesinin Dünya'nın kütlesinin yaklaşık otuz altıda biri olduğu ve görünen çapının farklı mesafelerde değiştiği belirtilmektedir. Yörüngesinin merkezi ve episiklinin çapının büyüklüğü ise daha önce belirtilenlerden belirlenir. {cite:zij-sabi-nallino-byblion pp.187-188}"
  id: "Teks tersebut menyatakan bahwa ukuran Venus bervariasi antara dua dimensinya dengan pecahan yang disebutkan dalam teks, bahwa diameter tampak Venus adalah tiga puluh dua menit dan dua puluh tujuh detik, bahwa massanya kira-kira sepertiga puluh enam dari massa Bumi, dan bahwa diameter tampak Venus berubah pada jarak yang berbeda. Adapun pusat orbit dan epikikelnya, besarnya diameter masing-masing ditentukan dari apa yang telah dinyatakan sebelumnya. {cite:zij-sabi-nallino-byblion pp.187-188}"
