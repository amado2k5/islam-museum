label: { ar: "بُعد الزهرة وقطرها الظاهر وعظم جرمها", en: "The distance, apparent diameter and size of Venus", ur: "زہرہ کا بُعد، ظاہری قطر اور جرم" }
summary:
  ar: "يذكر النص أن الزهرة يتفاوت عظمها بين بعديها بكسر يذكره النص، وأن قطرها الظاهر اثنتان وثلاثون دقيقة وسبع وعشرون ثانية، وأن عظم جرمها جزء من ستة وثلاثين من عظم الأرض بالتقريب، وأن قطرها الظاهر على أبعادها المختلفة يتغير. وأما مركز فلكها وفلك تدويرها فيُعلم عظم قطر كل منهما بما تقدم. {cite:zij-sabi-nallino-byblion pp.187-188}"
  en: "The text gives Venus's apparent diameter as thirty-two minutes and twenty-seven seconds of arc, and its bulk as about one part in thirty-six of the Earth. Its size changes between its distances, and the text refers back to what was said of the diameters of the epicycle. {cite:zij-sabi-nallino-byblion pp.187-188}"
  ur: "متن زہرہ کا ظاہری قطر بتیس دقیقے اور ستائیس ثانیے بتاتا ہے، اور اس کا جرم زمین کے جرم کا تقریباً چھتیسواں حصہ۔ اس کا جسم اپنے مختلف بُعدوں کے مطابق بدلتا ہے، اور متن فلکِ تدویر کے قطروں کے بیان کی طرف لوٹتا ہے۔ {cite:zij-sabi-nallino-byblion pp.187-188}"
