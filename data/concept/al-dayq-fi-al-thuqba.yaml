id: "concept/al-dayq-fi-al-thuqba"
class: "concept"
kind: "scientific"
label:
  ar: "ضيق الثقبة"
  en: "Narrowing of the pupil (al-dayq)"
  fr: "Rétrécissement de la pupille (al-dayq)"
  ur: "ثقبہ کی تنگی"
  es: "Estrechamiento de la pupila (al-dayq)"
  tr: "Açıkların daralması"
  id: "Penyempitan defisit"
summary:
  ar: "الضيق أن تكون الثقبة العنبية أضيق من المعتاد، إن كان طبيعياً فمحمود وإن مرضياً فرديء أردأ من الانتشار وربما أدى إلى الانسداد، وأكثر ما يعرض من اليبوسة، وعلاجه على اليبس بالمرطبات وعلى الرطب بالأكحال المعروفة {cite:canon-ibn-sina-print-v2 p.212}"
  en: "Dayq is the uveal pupil being narrower than usual; if natural it is wholesome, if morbid it is bad, worse than widening, and may lead to occlusion; it mostly arises from dryness, treated for dryness by the moisteners and for moisture by the known collyria {cite:canon-ibn-sina-print-v2 p.212}"
  fr: "Le dayq est un rétrécissement de la pupille uvéale par rapport à son état habituel ; naturel, il est sain, mais morbide, il est mauvais, pire que l’élargissement, et peut conduire à l’occlusion ; il provient le plus souvent de la sécheresse, traitée par les humidifiants, tandis que la forme humide est traitée par les collyres connus {cite:canon-ibn-sina-print-v2 p.212}"
  ur: "تنگی یہ ہے کہ عنبیہ کا ثقبہ معمول سے زیادہ تنگ ہو؛ اگر فطری ہو تو پسندیدہ، اور اگر مرضی ہو تو برا، پھیلاؤ سے بدتر، اور انسداد تک پہنچا سکتا ہے؛ یہ اکثر خشکی سے عرض ہوتا ہے، خشکی پر مرطبات اور تر پر معلوم اکحال سے علاج ہوتا ہے {cite:canon-ibn-sina-print-v2 p.212}۔"
  es: "Dayq es la pupila uveal más estrecha de lo normal; si es natural, es saludable; si es patológica, es mala, peor que la dilatación, y puede provocar oclusión; generalmente se debe a la sequedad, tratada para la sequedad con humectantes y para la hidratación con la conocida collyria {cite:canon-ibn-sina-print-v2 p.212}"
  tr: "Uveal foramenin darlığı normalden daha dardır; normalse övgüye değerdir; patolojikse yayılmaktan daha kötüdür ve tıkanıklığa yol açabilir. En yaygın kuruluk şekli kuruluktur ve kuru ciltte nemlendirici ve nemlendiricilerle tedavi edilen yöntem kohl {cite:canon-ibn-sina-print-v2 s.212}"
  id: "Penyempitan foramen uveal lebih sempit dari normal; jika normal, patut diapresiasi; jika patologis, lebih buruk dari penyebaran dan dapat menyebabkan kemacetan. Bentuk kekeringan yang paling umum adalah kekeringan, dan metode untuk mengobati kulit kering dengan pelembap dan pelembap adalah Kohl {cite:canon-ibn-sina-print-v2 hlm.212}"
