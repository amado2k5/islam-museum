id: "concept/al-dayq-fi-al-thuqba"
class: "concept"
kind: "scientific"
label:
  ar: "ضيق الثقبة"
  en: "Narrowing of the pupil (al-dayq)"
  ur: "ثقبہ کی تنگی"
summary:
  ar: "الضيق أن تكون الثقبة العنبية أضيق من المعتاد، إن كان طبيعياً فمحمود وإن مرضياً فرديء أردأ من الانتشار وربما أدى إلى الانسداد، وأكثر ما يعرض من اليبوسة، وعلاجه على اليبس بالمرطبات وعلى الرطب بالأكحال المعروفة {cite:canon-ibn-sina-print-v2 p.212}"
  en: "Dayq is the uveal pupil being narrower than usual; if natural it is wholesome, if morbid it is bad, worse than widening, and may lead to occlusion; it mostly arises from dryness, treated for dryness by the moisteners and for moisture by the known collyria {cite:canon-ibn-sina-print-v2 p.212}"
  ur: "تنگی یہ ہے کہ عنبیہ کا ثقبہ معمول سے زیادہ تنگ ہو؛ اگر فطری ہو تو پسندیدہ، اور اگر مرضی ہو تو برا، پھیلاؤ سے بدتر، اور انسداد تک پہنچا سکتا ہے؛ یہ اکثر خشکی سے عرض ہوتا ہے، خشکی پر مرطبات اور تر پر معلوم اکحال سے علاج ہوتا ہے {cite:canon-ibn-sina-print-v2 p.212}۔"
