label: { ar: "الأشغال المعدنية المطعمة", en: "Inlaid metalwork", ur: "مرصع دھات کاری", es: "Trabajos de metal con incrustaciones", fr: "Incrustation de métal", tr: "Kakma metal işçiliği", id: "Pekerjaan logam inlay" }
summary:
  ar: "تطعيم أواني النحاس الأصفر والبرونز بالذهب والفضة والنحاس ومادة سوداء، يرى كتيب مجموعة نهاد السعيد أنه نضج في هراة في القرن الثاني عشر ثم انتشر إلى الموصل والجزيرة والشام ومصر {cite:nuhad-es-said-collection-islamic-metalwork-1985 p. 3}."
  en: "The inlaying of brass and bronze vessels with gold, silver, copper and a black compound, which the Nuhad Es-Said collection booklet sees maturing at Herat in the twelfth century and spreading to Mosul, the Jazira, Syria and Egypt {cite:nuhad-es-said-collection-islamic-metalwork-1985 p. 3}."
  ur: "پیتل اور کانسی کے برتنوں میں سونا، چاندی، تانبا اور ایک سیاہ مرکب جڑنا، جسے نہاد السعید کے مجموعے کا کتابچہ بارھویں صدی میں ہرات میں پختہ اور پھر موصل، جزیرہ، شام اور مصر تک پھیلتا دیکھتا ہے {cite:nuhad-es-said-collection-islamic-metalwork-1985 p. 3}۔"
  es: "La incrustación de vasijas de latón y bronce con oro, plata, cobre y un compuesto negro, que según el folleto de la colección Nuhad Es-Said alcanzó su madurez en Herat en el siglo XII y se extendió a Mosul, Jazira, Siria y Egipto {cite:nuhad-es-said-collection-islamic-metalwork-1985 p. 3}."
  fr: "L'incrustation de récipients en laiton et en bronze avec de l'or, de l'argent, du cuivre et un composé noir, que le livret de la collection Nuhad Es-Said voit mûrir à Hérat au XIIe siècle et se répandre à Mossoul, la Jazira, la Syrie et l'Égypte {cite:nuhad-es-said-collection-islamic-metalwork-1985 p. 3}."
  tr: "Altın, gümüş, bakır ve siyah malzeme ile kaplanmış pirinç ve bronz kaplar yer alan Nihad Al-Saeed'in koleksiyon kitapçığında, koleksiyonun on ikinci yüzyılda Herat'ta olgunlaştığı ve ardından Musul, Cazire, Levant ve Mısır'a yayıldığı belirtilir {cite:nuhad-es-said-collection-islamic-metalwork-1985 s. 3}."
  id: "Dengan memasukkan wadah kuningan dan perunggu dengan bahan emas, perak, tembaga, dan hitam, buku kecil koleksi Nihad Al-Saeed menyatakan bahwa wadah ini matang di Herat pada abad kedua belas dan kemudian menyebar ke Mosul, Jazira, Levant, dan Mesir {cite:nuhad-es-said-collection-islamic-metalwork-1985 hlm. 3}."
