id: concept/sama-quraysh-lil-quran
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-ijaz]
label:
  ar: "من سمعوا القرآن من قريش وما قالوا"
  en: "The men of Quraysh who heard the Qur'an, and what they said"
  ur: "قریش کے وہ لوگ جنہوں نے قرآن سنا اور انہوں نے کیا کہا"
  fr: "Les hommes de Quraysh qui entendirent le Coran, et ce qu'ils dirent"
  es: "Los hombres de Quraysh que oyeron el Corán y lo que dijeron"
  tr: "Kur'an'ı Kurayş'tan duyup söylemeyenler"
  id: "Mereka yang mendengar Al-Quran dari Quraish dan tidak mengatakan"
summary:
  ar: "أخبار ينقلها المفسرون عن أثر سماع القرآن في أهل الفصاحة من قريش: الوليد بن المغيرة الذي قال إن لقوله لحلاوة وإنه ليعلو ولا يعلى ثم قال إنه سحر يؤثر، وتواصي قريش باللغو والصفير عند تلاوته، وإسلام عمر بن الخطاب بعد قراءته صحيفة فيها أول سورة طه. والروايات مختلفة الطرق، وكل منها منسوب إلى راويه."
  en: "Reports the commentators transmit on what hearing the Qur'an did to the masters of speech among Quraysh: al-Walid ibn al-Mughira, who said its words had a sweetness and that it rises and is not surpassed, then called it magic handed down; Quraysh agreeing to drown the recitation with noise and whistling; and Umar ibn al-Khattab becoming a Muslim after reading a sheet with the opening of sura Ta-Ha. The reports come by different chains, and each is given under its narrator."
  ur: "وہ روایات جو مفسرین اس بارے میں نقل کرتے ہیں کہ قرآن سننے کا قریش کے اہل فصاحت پر کیا اثر ہوا: ولید بن مغیرہ، جس نے کہا کہ اس کے کلام میں مٹھاس ہے اور وہ بلند ہوتا ہے اور اس پر کوئی بلند نہیں ہوتا، پھر اسے دوسروں سے منقول جادو کہا؛ تلاوت کے وقت قریش کا شور اور سیٹیاں بجانے پر باہم اتفاق؛ اور عمر بن خطاب کا سورہ طٰہٰ کے آغاز والا صحیفہ پڑھ کر مسلمان ہونا۔ روایات مختلف سندوں سے آئی ہیں اور ہر ایک اپنے راوی سے منسوب ہے۔"
  fr: "Récits que les commentateurs transmettent sur l'effet de l'écoute du Coran sur les maîtres de la parole de Quraysh : al-Walid ibn al-Mughira, qui dit que ses paroles avaient une douceur et qu'il s'élève sans être surpassé, puis l'appela une magie transmise ; Quraysh s'entendant pour couvrir la récitation de bruit et de sifflements ; et Umar ibn al-Khattab devenant musulman après avoir lu une feuille portant le début de la sourate Ta-Ha. Les récits viennent par des chaînes différentes, et chacun est donné sous le nom de son rapporteur."
  es: "Relatos que los comentaristas transmiten sobre el efecto que tuvo oír el Corán en los maestros de la palabra de Quraysh: al-Walid ibn al-Mughira, que dijo que sus palabras tenían dulzura y que se eleva sin ser superado, y luego lo llamó magia transmitida; Quraysh acordando sofocar la recitación con ruido y silbidos; y Umar ibn al-Khattab haciéndose musulmán tras leer una hoja con el comienzo de la sura Ta-Ha. Los relatos vienen por cadenas distintas, y cada uno se da bajo el nombre de su transmisor."
  tr: "Kurayşlılar arasında Kur'an dinlemenin etkisiyle ilgili yorumcular tarafından aktarılan raporlar: El-Velid bin el-Muhira, sözün tatlı, 'yücelt' ve 'yüce değil' olduğunu söylemiş, ardından bunun sihir olduğunu ve Kureyş'in okunurken boş konuşma ve ıslık çalmaktan kaçınılması yönündeki tavsiyesi, Ömer bin el-Hattab'ın Taha Suresi'nin başını içeren bir parşömen okuduktan sonra İslam'ı benimsediğini belirtmiştir. Rivayetler zincirlerle farklılık gösterir ve her biri anlatıcısına atfedilir."
  id: "Laporan yang disampaikan oleh para komentator tentang pengaruh mendengarkan Al-Qur'an di antara para Quraisy yang fasih: Al-Walid ibn al-Mughira, yang mengatakan bahwa ucapannya manis, bahwa itu 'ditinggikan' dan 'tidak ditinggikan,' lalu mengatakan bahwa yang mempengaruhi adalah sihir, dan nasihat Quraisy untuk menghindari omongan kosong dan siulan saat mengucapkan, serta bahwa Umar ibn al-Khattab memeluk Islam setelah membaca gulungan yang berisi awal Surah Taha. Riwayat-riwayat tersebut berbeda dalam bentuk rantai, masing-masing dikaitkan dengan naratornya."
