id: "concept/al-sadda-fi-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "السدة العارضة في الأذن"
  en: "The occlusion occurring in the ear"
  fr: "L’obstruction qui survient dans l’oreille"
  ur: "کان میں عارض ہونے والی سدہ"
  es: "La oclusión que se produce en el oído"
summary:
  ar: "السدة في الأذن قد تكون في الخلقة لغشاء مخلوق على الثقب، وقد تكون لوسخ، وقد تكون لدم جامد، وقد تكون للحم زائد أو ثؤلول، وقد تكون لحصاة أو نواة تقع فيها أو حيوان يدخلها فيموت فيها، وربما كانت مع خلط لزج يسد الثقبة أو مجاري العصبة فيحس الإنسان كأن أذنه مسدودة دائماً وربما حدث ذلك بعد ريح شديدة؛ والسدة التي تكون في الخلقة أن تخلق الأذن غير مثقوبة ومسدودة الداخل خلقة وقد يجرب بعمل اليد وربما لم ينفع بكل حيلة بتة ⁦⁦(أسماء الأدوية لا تحمل وأعمال اليد منقولة كوصف الكتاب لا كعمليات)⁩⁩ {cite:canon-ibn-sina-print-v2 p.229} {cite:canon-ibn-sina-print-v2 p.230}"
  en: "The ear's occlusion may be in creation — a membrane created over the hole; from dirt; from clotted blood; from extra flesh or a wart; from a pebble or pip fallen in, or an animal entering and dying in it; or with a viscid humour blocking the aperture or the nerve's passages, so a man always feels his ear stopped — it may come after a violent wind. The congenital occlusion is the ear created unpierced, stopped within from creation; hand-work may be tried and may help if scraping reaches the inner meatus, or may not help by any device at all ⁦(drug names are not carried and the hand-works are transmitted as the book's description, not as procedures)⁩ {cite:canon-ibn-sina-print-v2 p.229} {cite:canon-ibn-sina-print-v2 p.230}"
  fr: "L’obstruction de l’oreille peut être de naissance — une membrane créée par-dessus l’orifice ; venir de la saleté ; de sang coagulé ; d’une chair surnuméraire ou d’une verrue ; d’un caillou ou d’un pépin qui y est tombé, ou d’un animal qui y est entré et y est mort ; ou d’une humeur visqueuse qui bouche l’ouverture ou les passages du nerf, si bien que l’homme sent toujours son oreille bouchée — elle peut survenir après un vent violent. L’obstruction congénitale est l’oreille créée non percée, bouchée à l’intérieur dès la création ; on peut tenter l’œuvre de la main, qui peut aider si le raclage atteint le conduit intérieur, ou ne profiter par aucun moyen ⁦(les noms des remèdes ne sont pas reproduits et les œuvres de la main sont transmises comme description du livre, non comme procédures)⁩ {cite:canon-ibn-sina-print-v2 p.229} {cite:canon-ibn-sina-print-v2 p.230}"
  ur: "کان کی سدہ پیدائش میں ہو سکتی ہے — سوراخ پر پیدا شدہ جھلی؛ میل سے؛ جمے خون سے؛ زائد گوشت یا ماسے سے؛ اندر گرے کنکری یا گٹھلی سے یا کوئی جانور داخل ہو کر مر جائے؛ یا لعاب دار خلط سے جو ثقبہ یا عصبے کے مجاری کو بند کر دے کہ انسان کو ہمیشہ محسوس ہو کان بند ہے — اور زور کی ہوا کے بعد بھی ہو سکتا ہے؛ اور پیدائشی سدہ یہ ہے کہ کان بغیر سوراخ اندر سے بند پیدا ہوا ہو، اور عمل دست آزمایا جا سکتا ہے اور اگر کھردنا اندرونی صماخ تک پہنچے تو نفع دے یا کسی حیلہ سے بھی بالکل نفع نہ دے ⁦⁦(ادویہ کے نام منقول نہیں اور عمل دست کتاب کے وصف کے طور پر منقول، عملی طریقہ نہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.229} {cite:canon-ibn-sina-print-v2 p.230}"
  es: "La oclusión del oído puede ser de origen congénito: una membrana que cubre el orificio; suciedad; sangre coagulada; tejido sobrante o una verruga; una piedrecita o semilla que cae dentro, o un animal que entra y muere en él; o un humor viscoso que bloquea la abertura o los conductos nerviosos, por lo que una persona siempre siente el oído tapado; puede ocurrir después de un viento fuerte. La oclusión congénita es el oído que nace sin perforar, obstruido internamente desde su concepción; se puede intentar el trabajo manual, que puede ayudar si el raspado alcanza el conducto auditivo interno, o puede que ningún método sea efectivo (no se incluyen nombres de medicamentos y los trabajos manuales se transmiten como la descripción del libro, no como procedimientos). {cite:canon-ibn-sina-print-v2 p.229} {cite:canon-ibn-sina-print-v2 p.230}"
