label:
  ar: إخراج
  en: Ikhraj (removal or expulsion, and the act of paying out)
  es: "Ikhraj (destitución o expulsión, y el acto de pagar)"
  fr: "Ikhraj (enlèvement ou expulsion, et l'acte de verser)"
summary:
  ar: 'الإخراج لغةً الدفع من الداخل، والإبعاد والتنحية، وهو كذلك عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} ويفرّق الفقهاء بينه وبين التخارج، وهو صلح الورثة على إخراج بعضهم من الميراث بشيء معلوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} ويتحقق الإخراج بحسب الشيء: إخراج القائم من الدار بقدميه عند بعض الفقهاء، وإخراج المسروق من الحرز، وإخراج الزكاة والكفارات بالتمليك أو بالعزل عند آخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} ويجب الإخراج تارة، كالزكاة والكفارات وإخراج من يستحق الحد من المسجد، ويحرم تارة، كإخراج المعتدة من بيتها بغير حق وإخراج المتاع من الحرز بنية السرقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974}'
  en: 'Ikhraj means, in the lexicon, pushing out from within, and also removal or banishment, and the jurists use it in the same sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} The jurists distinguish it from takharruj, the agreement of heirs to exclude one of them from the inheritance for a known sum from the estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} Removal is judged by the kind of thing: a standing person leaves a house by his feet, according to some; stolen goods are removed from a store; zakat and expiations are paid out by transferring them to the poor, or, according to others, by setting them aside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} The ruling varies: removal is obligatory in zakat, expiations, and expelling one who deserves a hadd from the mosque, and forbidden when a woman in her waiting period is expelled from her house without right, or goods are removed from a store with intent to steal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974}'
  es: "Ikhraj significa, en el léxico, empujar desde dentro, y también remoción o destierro, y los juristas lo usan en el mismo sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} Los juristas lo distinguen de takharruj, el acuerdo de los herederos para excluir a uno de ellos de la herencia por una suma conocida de la herencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} La remoción se juzga por el tipo de cosa: una persona de pie sale de una casa por los pies, según algunos; los bienes robados se retiran de una tienda; el zakat y las expiaciones se pagan transfiriéndolos a los pobres, o, según otros, apartándolos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} La norma varía: la expulsión es obligatoria en el zakat, las expiaciones y la expulsión de quien merece un hadd de la mezquita, y está prohibida cuando una mujer en su período de espera es expulsada de su casa sin derecho, o cuando se sustraen mercancías de una tienda con intención de robar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974}"
  fr: "Dans le lexique, « ikhraj » signifie « expulser de l'intérieur », mais aussi « exclusion » ou « bannissement », et les juristes l'emploient dans le même sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} Les juristes le distinguent du « takharruj », l'accord entre héritiers visant à exclure l'un d'eux de l'héritage moyennant une somme déterminée prélevée sur la succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} L'exclusion est appréciée selon sa nature: une personne debout quitte une maison par ses pieds, selon certains; des biens volés sont retirés d'un entrepôt; la zakat et les expiations sont versées en les donnant aux pauvres, ou, selon d'autres, en les mettant de côté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} La règle varie: l’expulsion est obligatoire pour la zakat, les expiations et l’expulsion de la mosquée de celui qui mérite une amende (hadd), et interdite lorsqu’une femme en période d’attente est expulsée de son domicile sans droit, ou lorsque des marchandises sont soustraites d’un magasin dans l’intention de voler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974}"
