label:
  ar: إخراج
  en: Ikhraj (removal or expulsion, and the act of paying out)
summary:
  ar: 'الإخراج لغةً الدفع من الداخل، والإبعاد والتنحية، وهو كذلك عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} ويفرّق الفقهاء بينه وبين التخارج، وهو صلح الورثة على إخراج بعضهم من الميراث بشيء معلوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} ويتحقق الإخراج بحسب الشيء: إخراج القائم من الدار بقدميه عند بعض الفقهاء، وإخراج المسروق من الحرز، وإخراج الزكاة والكفارات بالتمليك أو بالعزل عند آخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} ويجب الإخراج تارة، كالزكاة والكفارات وإخراج من يستحق الحد من المسجد، ويحرم تارة، كإخراج المعتدة من بيتها بغير حق وإخراج المتاع من الحرز بنية السرقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974}'
  en: 'Ikhraj means, in the lexicon, pushing out from within, and also removal or banishment, and the jurists use it in the same sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} The jurists distinguish it from takharruj, the agreement of heirs to exclude one of them from the inheritance for a known sum from the estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} Removal is judged by the kind of thing: a standing person leaves a house by his feet, according to some; stolen goods are removed from a store; zakat and expiations are paid out by transferring them to the poor, or, according to others, by setting them aside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1973} The ruling varies: removal is obligatory in zakat, expiations, and expelling one who deserves a hadd from the mosque, and forbidden when a woman in her waiting period is expelled from her house without right, or goods are removed from a store with intent to steal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1974}'
