id: concept/jabsin
class: concept
kind: natural
label:
  ar: "جبسين"
  en: "Jabsin (gypsum, the editor says)"
  ur: "جبسین ⁦(جفصین)⁩"
  es: "Jabsin (yeso, dice el editor)"
  fr: "Jabsine (gypse, précise le rédacteur)"
  tr: "alçı"
  id: "gipsum"
summary:
  ar: "حجر الجص صفائحي أبيض مشفّ، وإذا أُحرق ازداد لطافة؛ بارد يابس، مغرّ يُوضع على النزوف، ويُطلى به الجبهة فيحبس الرعاف، ويُخلط ببياض البيض ضماداً للرمد الدموي؛ وعُدّ الكتاب له من السموم الخانقة {cite:canon-ibn-sina-print-v1 p.424}."
  en: "Gypsum stone, white, flaky and translucent; when burnt it becomes finer. Cold and dry, astringent, placed on bleeding. Spread on the forehead, or wrapped around the head, it stops nosebleed. Mixed with egg white and applied, it is for bloody ophthalmia. The book counts it among the choking poisons {cite:canon-ibn-sina-print-v1 p.424}."
  ur: "جص کا پتھر، سفید، تہہ دار اور شفاف؛ جلانے پر زیادہ باریک ہوتا ہے۔ ٹھنڈا اور خشک، مغرّ، خون بہنے کی جگہ رکھا جاتا ہے؛ پیشانی پر لگانے یا سر پر لپیٹنے سے ناک کا خون رکتا ہے۔ انڈے کی سفیدی میں ملا کر خونی آشوبِ چشم پر لگایا جاتا ہے؛ کتاب اسے گلا گھونٹنے والے زہروں میں شمار کرتی ہے {cite:canon-ibn-sina-print-v1 p.424}۔"
  es: "Yeso, blanco, escamoso y translúcido; al quemarse se vuelve más fino. Frío y seco, astringente, se aplica sobre la hemorragia. Extendido en la frente o envuelto alrededor de la cabeza, detiene la hemorragia nasal. Mezclado con clara de huevo y aplicado, sirve para la oftalmía hemorrágica. El libro lo incluye entre los venenos asfixiantes {cite:canon-ibn-sina-print-v1 p.424}."
  fr: "Pierre de gypse, blanche, friable et translucide; elle devient plus fine à la cuisson. Froide et sèche, astringente, elle s’applique sur les saignements. Étendue sur le front ou enroulée autour de la tête, elle arrête les saignements de nez. Mélangée à du blanc d’œuf et appliquée localement, elle est utilisée contre l’ophtalmie sanglante. Le livre la classe parmi les poisons suffocants {cite:canon-ibn-sina-print-v1 p.424}."
  tr: "Alçıtaş, beyaz, kürlenmiş bir laminat taştır ve yandığında daha da yumuşak hale gelir; soğuk, kuru, baştan çıkarıcı, kanamaya uygulanır, burun kanamasını önlemek için alınla kaplanır ve kan konjonktiviti için yumurta akı ile karıştırılır; kitap bunu boğucu zehirlerden biri olarak değerlendirmiştir {cite:canon-ibn-sina-print-v1 s.424}."
  id: "Batu gipsum adalah batu laminasi putih yang diawetkan, dan ketika dibakar, batu ini menjadi lebih lembut; batu ini dingin, kering, menggoda, diaplikasikan hingga berdarah, dilapisi dengan dahi untuk mencegah mimisan, dan dicampur dengan putih telur sebagai ramuan konjungtivitis darah; buku ini menganggapnya sebagai salah satu racun yang mencekik {cite:canon-ibn-sina-print-v1 hlm.424}."
