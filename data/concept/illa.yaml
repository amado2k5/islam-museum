id: concept/illa
class: concept
kind: legal
label:
  ar: "العِلَّة"
  en: "The effective cause (illa) in legal reasoning"
  ur: "علت ⁦(علتِ حکم)⁩"
  es: "La causa efectiva (illa) en el razonamiento jurídico"
  fr: "La cause effective (illa) dans le raisonnement juridique"
summary:
  ar: "العلة في اللغة المرض، وتطلق على السبب، وفي اصطلاح الأصوليين وصف ظاهر منضبط أضافه الشارع إلى الحكم ونصبه علامة عليه، وهي غير الحكمة التي هي المصلحة المقصودة من تشريع الحكم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11793}. وتفترق العلة عن السبب في أن الحكم يترتب على العلة بذاتها دون أن تكون مؤثرة فيه بواسطة، وعن الشرط بأن الشرط مناسبته في غيره، وعن المانع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. والعلة من أركان القياس، وإذا لم يدرك العقل علة الأصل امتنع القياس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. وشروط العلة أن تكون وصفاً ظاهراً منضبطاً متعدياً غير مقصور على الأصل، وألا تكون من الأوصاف التي ألغاها الشارع، ويقيم الشارع مقام الأمر الخفي أمراً ظاهراً يدل عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796}. وتثبت العلة بالنص الصريح كلفظ التعليل، وبالإيماء والتنبيه على الأسباب، وبالإجماع، وبالاستنباط، ومنه تنقيح المناط والسبر والتقسيم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11797}."
  en: "In the lexicon, illa means an illness, and also a cause; as a term of the jurists of legal theory it is an apparent and regular attribute that the Lawgiver attached to a ruling and set as a sign of it. It is distinct from the wisdom (hikma) of a ruling, which is the purpose it serves {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11793}. An illa differs from a sabab in that the ruling follows the illa without the illa itself having an effect in the ruling, and from a condition, whose suitability lies in something else, and from a preventer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. The illa is a pillar of analogical reasoning, and analogy fails if the reason cannot find the illa of the original ruling {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. Its conditions are that it be an apparent, regular and extendable attribute that is not one of those the Lawgiver disregarded; where the real cause is hidden, the Lawgiver sets an apparent sign to stand for it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796}. It is established by explicit text, by an indication or allusion, by consensus, and by deduction, including the purification of the ground of ruling, and the method of examining and dividing attributes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11797}."
  es: "En el léxico, illa significa enfermedad y también causa; como término de los juristas de la teoría jurídica, es un atributo aparente y regular que el Legislador adjuntó a una norma y estableció como señal de la misma. Es distinto de la sabiduría (hikma) de una norma, que es el propósito que cumple {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11793}. Una illa se diferencia de un sabab en que la norma sigue a la illa sin que la illa misma tenga efecto en la norma, y de una condición, cuya idoneidad reside en otra cosa, y de un preventivo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. La illa es un pilar del razonamiento analógico, y la analogía falla si la razón no puede encontrar la illa de la norma original {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. Sus condiciones son que sea un atributo aparente, regular y extensible que no sea uno de los que el Legislador desestimó; donde la causa real está oculta, el Legislador pone un signo aparente para representarla {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796}. Se establece mediante texto explícito, mediante indicación o alusión, por consenso y por deducción, incluida la purificación del fundamento de la norma y el método de examen y división de los atributos {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.11797}."
  fr: "Dans le lexique, « illa » signifie à la fois maladie et cause. En tant que terme employé par les juristes, il désigne un attribut apparent et régulier que le Législateur a attribué à une décision et en a fait son signe. Il se distingue de la sagesse (hikma) de la décision, dont il constitue la finalité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11793}. Une « illa » diffère d'un « sabab » en ce que la décision découle de l'« illa » sans que celle-ci n'ait d'effet sur la décision, et d'une condition dont la pertinence dépend d'autre chose, ainsi que d'un empêchement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. L'« illa » est un pilier du raisonnement analogique, et l'analogie échoue si la raison ne peut trouver l'« illa » de la décision initiale {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. Ses conditions sont qu'il s'agisse d'un attribut apparent, régulier et extensible qui ne soit pas l'un de ceux que le Législateur a ignorés; lorsque la véritable cause est cachée, le Législateur établit un signe apparent pour la représenter {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796}. Il est établi par un texte explicite, par une indication ou une allusion, par consensus et par déduction, y compris la purification du motif de décision et la méthode d'examen et de division des attributs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11797}."
  ur: "لغت میں، illa کا مطلب ایک بیماری ہے، اور ایک وجہ بھی۔ قانونی نظریہ کے فقہاء کی اصطلاح کے طور پر یہ ایک ظاہری اور باقاعدہ صفت ہے جسے قانون دینے والے کسی حکم کے ساتھ منسلک کرتے ہیں اور اس کی علامت کے طور پر متعین کرتے ہیں۔ یہ کسی حکم کی حکمت ⁦(حکمہ)⁩ سے الگ ہے، جس کا مقصد یہ پورا کرتا ہے {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 11793}۔ اِلّا سبب سے اس لحاظ سے مختلف ہے کہ حکم اِلٰہ کی پیروی کرتا ہے بغیر اِلٰہ کا حکم میں اثر ہوتا ہے، اور ایسی حالت سے، جس کی موافقت کسی اور چیز میں ہوتی ہے، اور روکنے والے سے۔ علل مشابہت استدلال کا ایک ستون ہے، اور قیاس ناکام ہو جاتا ہے اگر وجہ اصل حکم کی علل تلاش نہ کر سکے۔ اس کی شرائط یہ ہیں کہ یہ ایک ظاہری، باقاعدہ اور قابل توسیع وصف ہو جو قانون دینے والے کو نظر انداز کیے جانے والوں میں سے نہ ہو۔ جہاں اصل وجہ پوشیدہ ہوتی ہے، قانون دینے والا اس کے لیے ایک ظاہری نشان مقرر کرتا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11794} صفحہ 11796}۔ یہ صریح متن، اشارے یا اشارے سے، اجماع کے ذریعے، اور کٹوتی کے ذریعے قائم کیا گیا ہے، جس میں حکم کی زمین کی تطہیر، اور صفات کی جانچ اور تقسیم کا طریقہ بھی شامل ہے صفحہ 11796} {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 11797}۔"
