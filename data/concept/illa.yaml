label:
  ar: "العِلَّة"
  en: "The effective cause (illa) in legal reasoning"
  ur: "علت (علتِ حکم)"
summary:
  ar: "العلة في اللغة المرض، وتطلق على السبب، وفي اصطلاح الأصوليين وصف ظاهر منضبط أضافه الشارع إلى الحكم ونصبه علامة عليه، وهي غير الحكمة التي هي المصلحة المقصودة من تشريع الحكم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11793}. وتفترق العلة عن السبب في أن الحكم يترتب على العلة بذاتها دون أن تكون مؤثرة فيه بواسطة، وعن الشرط بأن الشرط مناسبته في غيره، وعن المانع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. والعلة من أركان القياس، وإذا لم يدرك العقل علة الأصل امتنع القياس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. وشروط العلة أن تكون وصفاً ظاهراً منضبطاً متعدياً غير مقصور على الأصل، وألا تكون من الأوصاف التي ألغاها الشارع، ويقيم الشارع مقام الأمر الخفي أمراً ظاهراً يدل عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796}. وتثبت العلة بالنص الصريح كلفظ التعليل، وبالإيماء والتنبيه على الأسباب، وبالإجماع، وبالاستنباط، ومنه تنقيح المناط والسبر والتقسيم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11797}."
  en: "In the lexicon, illa means an illness, and also a cause; as a term of the jurists of legal theory it is an apparent and regular attribute that the Lawgiver attached to a ruling and set as a sign of it. It is distinct from the wisdom (hikma) of a ruling, which is the purpose it serves {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11793}. An illa differs from a sabab in that the ruling follows the illa without the illa itself having an effect in the ruling, and from a condition, whose suitability lies in something else, and from a preventer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. The illa is a pillar of analogical reasoning, and analogy fails if the reason cannot find the illa of the original ruling {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794}. Its conditions are that it be an apparent, regular and extendable attribute that is not one of those the Lawgiver disregarded; where the real cause is hidden, the Lawgiver sets an apparent sign to stand for it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796}. It is established by explicit text, by an indication or allusion, by consensus, and by deduction, including the purification of the ground of ruling, and the method of examining and dividing attributes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11797}."
