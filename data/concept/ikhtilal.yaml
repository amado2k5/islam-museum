id: concept/ikhtilal
class: concept
kind: legal
label:
  ar: اختلال
  en: Ikhtilal (disruption or defect in acts, contracts and consent)
  es: "Ikhtilal (interrupción o defecto en actos, contratos y consentimientos)"
  fr: "Ikhtilal (rupture ou défaut dans les actes, les contrats et le consentement)"
  ur: "اختلال ⁦(اعمال، معاہدوں اور رضامندی میں خلل یا خرابی)⁩"
  tr: "Düzensizlik"
  id: "Gangguan"
summary:
  ar: 'الاختلال لغةً الفساد والوهن في الرأي والأمر، واصطلاحاً مداخلة الوهن والنقص في الشيء أو الأمر، ومنه اختلال العقل واختلال العبادة أو العقد واختلال الرضا واختلال الضبط عند الراوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962} والاختلال أعم من الفساد والبطلان، فيدخل فيه نقص المكملات الذي لا يُبطل ولا يُفسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} وفي العبادة يكون الخلل بترك شرط أو ركن أو واجب أو مستحب، أو بفعل محظور أو مكروه، وقد يُتدارك بسجود السهو أو الفدية أو القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} وفي العقد يمنع اختلال الركن الانعقاد، ويوجب اختلال الوصف الخارج الفساد عند الحنفية، ويوجب اختلال الرضا الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964}'
  en: 'Ikhtilal means, in the lexicon, a defect or weakness in an opinion or a matter, and as a technical term the intrusion of weakness or deficiency into a thing or an affair. It covers disorder of reason, defect of worship or contract, defect of consent, and defect of a narrator''s precision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962} It is wider than invalidity and corruption, since it includes missing complements that cause neither. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} In worship the defect lies in omitting a condition, pillar, obligation or recommended act, or in doing a forbidden or disliked act, and may be repaired by prostration of forgetfulness, ransom or make-up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} In a contract a defect in a pillar prevents formation; a defect in an external attribute gives corruption according to the Hanafis; a defect in consent gives an option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964}'
  es: "Ikhtilal significa, en el léxico, un defecto o debilidad en una opinión o un asunto, y como término técnico la intrusión de debilidad o deficiencia en una cosa o un asunto. Cubre el desorden de la razón, el defecto de culto o contrato, el defecto de consentimiento y el defecto de precisión de un narrador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962} Es más amplio que la invalidez y la corrupción, ya que incluye complementos faltantes que no causan ninguno de los dos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} En el culto el defecto radica en omitir una condición, pilar, obligación o acto recomendado, o en hacer un acto prohibido o desagrado, y puede repararse mediante la postración del olvido, el rescate o la compensación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} En un contrato un defecto en un pilar impide la formación; un defecto en un atributo externo da corrupción según los Hanafis; un defecto en el consentimiento da una opción. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964}"
  fr: "Dans le lexique, « ikhtilal » désigne un défaut ou une faiblesse dans une opinion ou une question, et, en tant que terme technique, l'intrusion d'une faiblesse ou d'une déficience dans une chose ou une affaire. Ce terme englobe le désordre de la raison, le défaut de culte ou de contrat, le défaut de consentement et le défaut de précision du narrateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962} Il est plus large que l'invalidité et la corruption, puisqu'il inclut les compléments manquants qui n'entraînent ni l'une ni l'autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} Dans le culte, le défaut réside dans l'omission d'une condition, d'un pilier, d'une obligation ou d'un acte recommandé, ou dans l'accomplissement d'un acte interdit ou déconseillé, et peut être réparé par la prosternation de l'oubli, la rançon ou le recouvrement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} Dans un contrat, un défaut dans un pilier empêche sa formation; un défaut dans un attribut extérieur donne la corruption selon les Hanafis; un défaut de consentement donne une option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964}"
  ur: "اختلال کا مطلب لغت میں کسی رائے یا معاملے میں نقص یا کمزوری ہے اور تکنیکی اصطلاح کے طور پر کسی چیز یا معاملے میں کمزوری یا کمی کا دخل ہے۔ اس میں عقل کی خرابی، عبادات یا معاہدے کی خرابی، رضامندی کی خرابی، اور راوی کی درستگی کی خرابی کا احاطہ کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1962} یہ باطل اور بدعنوانی سے زیادہ وسیع ہے، کیونکہ اس میں غائب تکمیلات شامل ہیں جن کی وجہ سے کوئی بھی نہیں ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1963} عبادات میں عیب کسی شرط، ستون، فرض یا مستحب عمل کو چھوڑنے یا حرام یا ناپسندیدہ کام کرنے میں ہے، اور بھول جانے، فدیہ یا قضاء کے سجدے سے اس کی اصلاح ہوسکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1963} ایک معاہدے میں ستون میں نقص پیدا ہونے سے روکتا ہے۔ حنفیہ کے نزدیک خارجی صفت میں خرابی خرابی پیدا کرتی ہے۔ رضامندی میں خرابی ایک آپشن دیتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1963}"
  tr: "Bozulma, dilsel olarak yozlaşmış ve görüş ile komuta açısından zayıftır; teknik olarak bir şey veya maddedeki zayıflık ve eksikliktir; anlatıcıya göre zihinsel bozulma, ibadet veya sözleşmenin bozulması, rızanın bozulması ve kontrolün bozulması dahildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1962} Dengesizlik, yozlaşma ve geçersizleştirmeden daha geniştir; ne geçersiz kılan ne de geçersiz kılan tamamlayıcıların eksikliğini içerir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1963} İbadette, bir kusur bir koşul, sütun, zorunluluk veya önerilenin atlanması ya da yasaklanmış ya da sevilmediği bir eylemin yapılmasıyla oluşur ve unutkanlık secdesi, fidya veya kaçırılan duaları telafi ederek giderilebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1963} ve sözleşmede, bağlamanın dengesizliği önlenir ve Hanafilere göre yozlaşmayı dışlayan tanım dengesizliği rıza ve tercih dengesizliğine yol açar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1964}"
  id: "Gangguan secara linguistik korup dan lemah dalam pendapat dan perintah, dan secara teknis merujuk pada kelemahan dan kekurangan dalam sesuatu atau materi, termasuk gangguan intelek, gangguan ibadah atau kontrak, gangguan persetujuan, dan gangguan kendali menurut narator. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1962} Ketidakseimbangan lebih luas daripada korupsi dan pembatalan, termasuk kekurangan pelengkap yang tidak membatalkan atau membatalkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1963} Dalam ibadah, cacat disebabkan oleh menghilangkan suatu kondisi, pilar, kewajiban, atau rekomendasi, atau melakukan tindakan yang dilarang atau tidak disukai, dan dapat diperbaiki dengan sujud karena lupa, fidya, atau menebus doa yang terlewat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1963} dan dalam kontrak, ketidakseimbangan konjungsi dicegah, dan ketidakseimbangan deskripsi yang mengecualikan korupsi menurut Hanafi menyebabkan ketidakseimbangan persetujuan dan pilihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1964}"
