id: concept/ikhtilal
class: concept
kind: legal
label:
  ar: اختلال
  en: Ikhtilal (disruption or defect in acts, contracts and consent)
summary:
  ar: 'الاختلال لغةً الفساد والوهن في الرأي والأمر، واصطلاحاً مداخلة الوهن والنقص في الشيء أو الأمر، ومنه اختلال العقل واختلال العبادة أو العقد واختلال الرضا واختلال الضبط عند الراوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962} والاختلال أعم من الفساد والبطلان، فيدخل فيه نقص المكملات الذي لا يُبطل ولا يُفسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} وفي العبادة يكون الخلل بترك شرط أو ركن أو واجب أو مستحب، أو بفعل محظور أو مكروه، وقد يُتدارك بسجود السهو أو الفدية أو القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} وفي العقد يمنع اختلال الركن الانعقاد، ويوجب اختلال الوصف الخارج الفساد عند الحنفية، ويوجب اختلال الرضا الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964}'
  en: 'Ikhtilal means, in the lexicon, a defect or weakness in an opinion or a matter, and as a technical term the intrusion of weakness or deficiency into a thing or an affair. It covers disorder of reason, defect of worship or contract, defect of consent, and defect of a narrator''s precision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962} It is wider than invalidity and corruption, since it includes missing complements that cause neither. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} In worship the defect lies in omitting a condition, pillar, obligation or recommended act, or in doing a forbidden or disliked act, and may be repaired by prostration of forgetfulness, ransom or make-up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} In a contract a defect in a pillar prevents formation; a defect in an external attribute gives corruption according to the Hanafis; a defect in consent gives an option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1963} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964}'
