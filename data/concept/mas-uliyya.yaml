summary:
  ar: "المسؤولية كما يعرضها الشيخ عمر عبد الكافي: كل إنسان مسؤول عما استُرعي عليه، من الأسرة والعمل إلى الدين والوطن، وهي عنده ميدان من ميادين الفقه إلى جانب العبادات والمعاملات."
  en: "Responsibility as Sheikh Omar Abdelkafy presents it: each person is answerable for what is entrusted to his care, from the family and work to religion and homeland, and in his account it is a field of fiqh beside worship and transactions."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق ذمہ داری: ہر شخص اپنی امانت کا جواب دہ ہے، خاندان اور کام سے لے کر دین اور وطن تک، اور ان کے نزدیک یہ عبادات اور معاملات کے ساتھ فقہ کا ایک میدان ہے۔"
