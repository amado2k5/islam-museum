label: { ar: "الامتلاء المفرط وتدبيره", en: "Overfilling and its remedies", ur: "حد سے زیادہ بھرنا اور اس کی تدبیر" }
summary:
  ar: "يذكر ابن سينا أن من أفرط في الأكل أو خضخضت معدته بحركة أو شوشه شرب فليبادر إلى القيء، فإن تعذر شرب الماء الحار قليلاً قليلاً ونام، وإلا أعان الطبيعة بما يطلق بالرفق، وإن لم يغن ذلك نام طويلاً وهجر الغذاء يوماً ثم استحم وكمد ولطف الغذاء، وإن بقي الثقل فقد امتلأت العروق من الفضول فيعالج بما يسهل من العروق {cite:canon-ibn-sina-print-v1 pp.232-233}."
  en: "Ibn Sina says one who has overeaten, or whose stomach has been shaken by movement or disturbed by a drink, should hasten to vomit; failing that, he sips hot water little by little and sleeps, or nature is helped with a gentle loosening; if not, he sleeps long and goes without food for a day, then bathes, applies warm compresses and lightens his diet; and if heaviness stays the vessels are full of residue and are treated by what clears the vessels {cite:canon-ibn-sina-print-v1 pp.232-233}."
