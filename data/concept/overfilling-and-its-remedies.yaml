id: concept/overfilling-and-its-remedies
class: concept
kind: scientific
label: { ar: "الامتلاء المفرط وتدبيره", en: "Overfilling and its remedies", ur: "حد سے زیادہ بھرنا اور اس کی تدبیر", es: "El sobrellenado y sus soluciones", fr: "Le surremplissage et ses solutions" }
summary:
  ar: "يذكر ابن سينا أن من أفرط في الأكل أو خضخضت معدته بحركة أو شوشه شرب فليبادر إلى القيء، فإن تعذر شرب الماء الحار قليلاً قليلاً ونام، وإلا أعان الطبيعة بما يطلق بالرفق، وإن لم يغن ذلك نام طويلاً وهجر الغذاء يوماً ثم استحم وكمد ولطف الغذاء، وإن بقي الثقل فقد امتلأت العروق من الفضول فيعالج بما يسهل من العروق {cite:canon-ibn-sina-print-v1 pp.232-233}."
  en: "Ibn Sina says one who has overeaten, or whose stomach has been shaken by movement or disturbed by a drink, should hasten to vomit; failing that, he sips hot water little by little and sleeps, or nature is helped with a gentle loosening; if not, he sleeps long and goes without food for a day, then bathes, applies warm compresses and lightens his diet; and if heaviness stays the vessels are full of residue and are treated by what clears the vessels {cite:canon-ibn-sina-print-v1 pp.232-233}."
  es: "Ibn Sina dice que quien ha comido en exceso, o cuyo estómago ha sido sacudido por el movimiento o perturbado por una bebida, debe apresurarse a vomitar; si no lo logra, bebe agua caliente poco a poco y duerme, o se ayuda a la naturaleza con un suave aflojamiento; si no, duerme mucho y pasa un día sin comer, luego se baña, se aplica compresas tibias y aligera su dieta; y si la pesadez persiste, los vasos están llenos de residuos y se tratan con lo que limpia los vasos {cite:canon-ibn-sina-print-v1 pp.232-233}."
  fr: "Ibn Sina dit que celui qui a trop mangé, ou dont l'estomac a été secoué par un mouvement ou perturbé par une boisson, doit se hâter de vomir; à défaut, il boit de petites gorgées d'eau chaude et dort, ou bien on aide la nature à se soulager en douceur; sinon, il dort longtemps et ne mange pas pendant une journée, puis se baigne, applique des compresses chaudes et allège son régime alimentaire; et si la lourdeur persiste, les vaisseaux sont pleins de résidus et sont traités par ce qui nettoie les vaisseaux {cite:canon-ibn-sina-print-v1 pp.232-233}."
  ur: "ابن سینا کہتے ہیں کہ جس نے زیادہ کھایا ہو یا پیٹ ہلنے سے ہل گیا ہو یا پینے سے پریشان ہو اسے قے میں جلدی کرنی چاہیے۔ اس میں ناکام ہو کر، وہ گرم پانی کے گھونٹ آہستہ آہستہ پیتا ہے اور سو جاتا ہے، یا قدرت نے نرمی سے ڈھیلے ہونے کی مدد کی ہے۔ اگر نہیں، تو وہ لمبا سوتا ہے اور ایک دن بغیر کھائے چلا جاتا ہے، پھر غسل کرتا ہے، گرم کمپریس لگاتا ہے اور اپنی خوراک کو ہلکا کرتا ہے۔ اور اگر بھاری پن برقرار رہتا ہے تو برتن باقیات سے بھرے ہوتے ہیں اور برتنوں کو صاف کرنے والی چیزوں سے علاج کیا جاتا ہے۔"
