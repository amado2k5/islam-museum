id: concept/quran-reception-by-faith
class: concept
kind: doctrine
label: { ar: "تلقي القرآن على قدر الإيمان", en: "Receiving the Quran according to faith" }
summary:
  ar: "يرى الشعراوي أن عطاء القرآن واحد للجميع، لكن كل إنسان يأخذ منه على قدر إيمانه واستقباله، ويستدل بقوله تعالى في سورة محمد عن الذين يستمعون ثم يقولون للذين أوتوا العلم «ماذا قال آنفاً»، وبقوله في سورة فصلت عن القرآن هدى وشفاء للمؤمنين ووقر في آذان الذين لا يؤمنون {cite:tafsir-sharawi-khawatir-scan p.28} {cite:tafsir-sharawi-khawatir-scan p.29}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that the Quran's gift is equal for all, but each person takes from it according to his faith and how he receives it. He cites the verse in Surat Muhammad about those who listen and then ask those given knowledge what was just said, and the verse in Surat Fussilat that the Quran is guidance and healing for believers while it is a deafness in the ears of those who do not believe {cite:tafsir-sharawi-khawatir-scan p.28} {cite:tafsir-sharawi-khawatir-scan p.29}. This is his reading and is attributed to him."
