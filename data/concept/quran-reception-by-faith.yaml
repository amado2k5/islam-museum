issue:
  ar: "لماذا يؤثر القرآن في قوم ولا يؤثر في آخرين مع أن عطاءه واحد؟"
  en: "Why does the Quran move some hearers and not others, when its gift is the same for all?"
perspectives:
  - tradition: sunni
    id: sharawi-reception-faith
    stance:
      ar: "العطاء واحد والتأثير على قدر الاستقبال والإيمان"
      en: "The gift is the same and its effect depends on reception and faith"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن القرآن لم يؤثر في من أعرض عنه، وأثّر في المؤمنين الذين استمعوا إليه {cite:tafsir-sharawi-khawatir-scan p.28}."
      en: "Sha'rawi says the Quran did not move those who turned away from it, but moved the believers who listened {cite:tafsir-sharawi-khawatir-scan p.28}."
