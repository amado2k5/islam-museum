summary:
  ar: 'البصير: المبصر لكل شيء لا يخفى عليه خافية. الاسم رقم 27 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Basir — The All-Seeing. Name 27 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Basir — Celui qui voit tout. Nom 27 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'البصير: سب دیکھنے والا — جس سے کوئی چیز پوشیدہ نہیں۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 27۔'
  es: "al-Basir — El que todo lo ve. Nombre número 27 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Basir: Her şeyi gören: Her şeyi gören ve hiçbir şey O'ndan gizlenen Kişidir. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerde bahsedilen 27 numaralı isimdir."
  id: "Al-Basir: Yang Maha Melihat: Dia yang melihat segala sesuatu dan tidak ada yang tersembunyi dari-Nya. Nama nomor 27 dalam penentuan yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Allah."
