summary:
  ar: "القسط في الكتاب ثلاثة أصناف عربي أبيض وهندي أسود وشامي، حار في الثالثة يابس في الثانية، مرة حريفة قوية حتى إنه يقرح، ينفع كل عضو يحتاج إلى تسخين واجتذاب الخلط من عمقه، ويجلو الكلف، وينفع من استرخاء العضل وعرق النسا وليثرغس وأوجاع الصدر والنافض والنهوش كلها، ويدر البول ويخرج حب القرع والديدان {cite:canon-ibn-sina-print-v1 p.648}"
  en: "Qust is in the book of three kinds, the white Arabian, the black Indian and the Syrian, hot in the third degree and dry in the second, of a bitter acrid quality so strong that it ulcerates; it benefits every organ that needs heating and the drawing of the humour from its depth, clears freckles, and benefits slackness of the muscles, sciatica, lethargy, pains of the chest, rigors and bites of every kind, and it induces urine and brings out tapeworm and worms {cite:canon-ibn-sina-print-v1 p.648}"
  ur: "قسط کتاب میں تین قسم کا ہے، عربی سفید، ہندی سیاہ اور شامی، تیسرے درجے میں گرم اور دوسرے میں خشک، کڑوا اور تیز اس حد تک کہ زخم کر دیتا ہے؛ ہر اس عضو کے لیے نافع ہے جسے گرمی اور گہرائی سے خلط کھینچنے کی ضرورت ہو، جھائیاں صاف کرتا ہے، اور پٹھوں کی ڈھیلاہٹ، عرق النسا، لیثرغس، سینے کے دردوں، کپکپی اور ہر طرح کے کاٹنے میں نافع ہے، پیشاب لاتا اور کدو دانے اور کیڑے نکالتا ہے {cite:canon-ibn-sina-print-v1 p.648}۔"
  es: "El Qust se encuentra en el libro de tres tipos: el árabe blanco, el indio negro y el sirio, caliente en el tercer grado y seco en el segundo, de una cualidad amarga y acre tan fuerte que ulcera; beneficia a todo órgano que necesita calor y la extracción del humor de su profundidad, elimina las pecas y beneficia la flacidez muscular, la ciática, el letargo, los dolores de pecho, los escalofríos y las picaduras de todo tipo, e induce la micción y expulsa tenias y gusanos {cite:canon-ibn-sina-print-v1 p.648}"
  fr: "Le Qust est décrit dans le livre comme étant de trois sortes: le Qust blanc arabe, le Qust noir indien et le Qust syrien, chaud au troisième degré et sec au deuxième, d'une qualité amère et âcre si forte qu'il provoque des ulcérations; il est bénéfique à tous les organes qui ont besoin d'être chauffés et de faire remonter les humeurs en profondeur, il atténue les taches de rousseur et soulage la faiblesse musculaire, la sciatique, la léthargie, les douleurs thoraciques, les frissons et les morsures de toutes sortes; il favorise la diurèse et élimine les ténias et les vers. {cite:canon-ibn-sina-print-v1 p.648}"
  tr: "Kitaptaki ekmek üç çeşide sahiptir: Arap, beyaz, Hint, siyah ve Levantine. Üçüncüsü sıcak, ikincisi kuru, bazen acı ve ülsere kadar güçlüdür. Isıtılması gereken her organa fayda sağlar ve karışımı derinliklerinden çeker. Melazmayı giderir, kasları, siyatikleri gevşetir, alerjik rahatlamaya, göğüs ağrısına ve ısırıklara yardımcı olur, idrar söktürücü yapar ve kabak çekirdeği ile solucanları dışarı atar {cite:canon-ibn-sina-print-v1 s.648}"
  id: "Roti dalam buku ini memiliki tiga jenis: Arab, putih, India, hitam, dan Levantine. Yang ketiga panas, yang kedua kering, kadang pahit, dan kuat sampai mengalami luka. Ia bermanfaat bagi setiap organ yang perlu pemanasan dan menarik campuran dari kedalamannya. Ia meredakan melasma, membantu merilekskan otot, sciatica, dan pereda alergi, nyeri dada, dan gigitan, serta menyebabkan diuretik dan mengeluarkan biji labu serta cacing {cite:canon-ibn-sina-print-v1 hlm.648}"
