summary:
  ar: "يجعل ابن سينا المعالجة بالدواء على ثلاثة قوانين: قانون اختيار كيفية الدواء، وقانون اختيار كميته وزناً ودرجة، وقانون ترتيب وقته، ويقرر أن المرض يعالج بالضد وأن الصحة تحفظ بالمشاكل {cite:canon-ibn-sina-print-v1 p.268}."
  en: "Ibn Sina sets treatment by drugs under three rules: the choice of the drug's quality, the choice of its quantity in weight and in degree, and the ordering of its time, and he states that disease is treated by the contrary while health is kept by the like {cite:canon-ibn-sina-print-v1 p.268}."
