label: { ar: "القوانين الثلاثة للمعالجة بالدواء عند ابن سينا", en: "The three rules of treatment by drugs in the Canon", ur: "دوا سے علاج کے تین قاعدے قانون میں", es: "Las tres reglas del tratamiento farmacológico en el Canon", fr: "Les trois règles du traitement médicamenteux dans le Canon" }
summary:
  ar: "يجعل ابن سينا المعالجة بالدواء على ثلاثة قوانين: قانون اختيار كيفية الدواء، وقانون اختيار كميته وزناً ودرجة، وقانون ترتيب وقته، ويقرر أن المرض يعالج بالضد وأن الصحة تحفظ بالمشاكل {cite:canon-ibn-sina-print-v1 p.268}."
  en: "Ibn Sina sets treatment by drugs under three rules: the choice of the drug's quality, the choice of its quantity in weight and in degree, and the ordering of its time, and he states that disease is treated by the contrary while health is kept by the like {cite:canon-ibn-sina-print-v1 p.268}."
  es: "Ibn Sina establece el tratamiento con medicamentos bajo tres reglas: la elección de la calidad del medicamento, la elección de su cantidad en peso y en grado, y el orden de su tiempo, y afirma que la enfermedad se trata con lo contrario mientras que la salud se mantiene con lo semejante {cite:canon-ibn-sina-print-v1 p.268}."
  fr: "Ibn Sina établit le traitement par les médicaments selon trois règles: le choix de la qualité du médicament, le choix de sa quantité en poids et en degré, et l'ordre de son administration, et il déclare que la maladie est traitée par le contraire tandis que la santé est maintenue par le semblable {cite:canon-ibn-sina-print-v1 p.268}."
