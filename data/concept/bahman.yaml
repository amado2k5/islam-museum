summary:
  ar: "أصول خشبية مجففة متشجنة متغضنة، وهي نوعان أبيض وأحمر. حارة يابسة في الثانية، مسمنة، تقوي القلب وتنفع من الخفقان، وتُذكر في الكتاب زيادتها في المني، فتُسجَّل كما وردت دون توصية {cite:canon-ibn-sina-print-v1 p.387}."
  en: "Dried, twisted and wrinkled woody roots in two kinds, white and red. Hot and dry in the second degree. It fattens, strengthens the heart and helps palpitation. The book also lists an increase in semen, recorded as its own listing {cite:canon-ibn-sina-print-v1 p.387}."
  fr: "Racines ligneuses sèches, tordues et ridées, de deux sortes, blanche et rouge. Chaudes et sèches au deuxième degré, elles sont dites engraissantes, fortifiantes pour le cœur et utiles contre les palpitations. Le livre mentionne aussi une augmentation du sperme, rapportée comme son propre énoncé {cite:canon-ibn-sina-print-v1 p.387}."
  ur: "یہ خشک، مڑی ہوئی اور جھری دار لکڑی جیسی جڑیں ہیں، جو دو قسم کی ہوتی ہیں: سفید اور سرخ۔ دوسرے درجے میں گرم اور خشک۔ یہ موٹاپا لاتی ہے، دل کو قوت دیتی ہے اور دھڑکن میں نفع دیتی ہے۔ کتاب اس کے منی بڑھانے کا قول بھی درج کرتی ہے، جو کتاب کا اپنا بیان ہے {cite:canon-ibn-sina-print-v1 p.387}۔"
  es: "Raíces leñosas secas, retorcidas y arrugadas, de dos tipos: blancas y rojas. De naturaleza cálida y seca en segundo grado. Engorda, fortalece el corazón y alivia las palpitaciones. El libro también menciona un aumento del semen, registrado como un efecto secundario {cite:canon-ibn-sina-print-v1 p.387}."
  tr: "Kuru, ekşi ve yoğun ahşap kökler, iki türde mevcuttur: beyaz ve kırmızı. İkincisinde kuru sıcak, kalınlaşır, kalbi güçlendirir ve çarpıntıya yardımcı olur; kitapta meni artışlarından bahsedilir; bu da tavsiye edilmeden rapor edilmiştir {cite:canon-ibn-sina-print-v1 s.387}."
  id: "Akar kayu kering, asam, dan padat, tersedia dalam dua jenis: putih dan merah. Akar kayu kering panas pada yang kedua, menebalkan, memperkuat jantung dan membantu palpitasi, dan buku menyebutkan peningkatan sperma, yang dicatat tanpa rekomendasi {cite:canon-ibn-sina-print-v1 hlm.387}."
