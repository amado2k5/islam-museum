id: concept/amrad-al-ras-al-failah-lil-araad
class: concept
kind: scientific
label:
  ar: "أمراض الرأس الفاعلة للأعراض فيه"
  en: "The diseases of the head that produce symptoms in it"
  fr: "Les maladies de la tête qui y produisent des symptômes"
  ur: "سر کی وہ بیماریاں جو اس میں علامات پیدا کرتی ہیں"
  es: "Las enfermedades de la cabeza que producen síntomas en ella"
  tr: "Semptomatik baş hastalıkları"
  id: "Semptomatik baş hastalıkları"
summary:
  ar: "يقول ابن سينا إن أمراض الرأس هنا هي أمراض الدماغ وحجبه: سوء المزاج مفرداً أو مع مادة، وأمراض التركيب، والسدد، وتفرق الاتصال، والأورام، وإنها خاصة أو بالمشاركة؛ وفيها سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.9-10}"
  en: "Ibn Sina says that by the head here he means the brain and its membranes, and lists its diseases: ill-temperament alone or with matter, diseases of composition, obstructions, breaks of continuity and swellings, either its own or by sharing; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.9-10}"
  fr: "Ibn Sina dit que par la tête il entend ici le cerveau et ses membranes, et énumère ses maladies : mauvais tempérament seul ou avec matière, maladies de la composition, obstructions, ruptures de continuité et enflures, soit propres, soit par participation ; la fiche comporte une ligne signalée dans une section en attente de la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.9-10}"
  ur: "ابن سینا کہتا ہے کہ یہاں سر سے مراد دماغ اور اس کی جھلیاں ہیں، اور اس کی بیماریاں گنتا ہے: سوءِ مزاج اکیلا یا مادے کے ساتھ، ترکیب کی بیماریاں، سدّے، اتصال ٹوٹنا اور ورم، خاص ہوں یا مشارکت سے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.9-10}۔"
  es: "Ibn Sina afirma que por cabeza se refiere al cerebro y sus membranas, y enumera sus enfermedades: mal genio solo o con materia, enfermedades de la composición, obstrucciones, rupturas de continuidad e inflamaciones, ya sean propias o compartidas; el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 pp.9-10}"
  tr: "İbn Sina, burada baş hastalıklarının beyin hastalıkları ve onun belirsizliği olduğunu söyler: duygu durum bozuklukları tek başına ya da maddeyle birlikte, sentez hastalıkları, tıkanıklık, iletişim yayılımı, tümörler ve bunlar özel ya da kombinasyonludur; ve kurucunun kuralı hakkında bir bölümde işaretlenmiş bir satır vardır {cite:canon-ibn-sina-print-v2 s.9-10}"
  id: "İbn Sina, burada baş hastalıklarının beyin hastalıkları ve onun belirsizliği olduğunu söyler: duygu durum bozuklukları tek başına ya da maddeyle birlikte, sentez hastalıkları, tıkanıklık, iletişim yayılımı, tümörler ve bunlar özel ya da kombinasyonludur; ve kurucunun kuralı hakkında bir bölümde işaretlenmiş bir satır vardır {cite:canon-ibn-sina-print-v2 s.9-10}"
