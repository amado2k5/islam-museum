id: concept/al-khawf-wal-hazan-lil-muttabi
class: concept
kind: ethical
label:
  ar: "الخوف والحزن عند متبعي الهدى"
  en: "Fear and grief for those who follow guidance"
  ur: "ہدایت کے پیروکاروں کا خوف اور غم"
summary:
  ar: "يرى الشعراوي أن من اتبع هدى الله لا يخاف ولا يحزن، لأن الخوف توقع شر لا يُدفع، والحزن فوات محبوب، ولأن المنهج يقود إلى الخير كله، وأن الحزن مع الإيمان لا ينافيه {cite:tafsir-sharawi-khawatir-scan p.278} {cite:tafsir-sharawi-khawatir-scan p.279} {cite:tafsir-sharawi-khawatir-scan p.280}."
  en: "Sha'rawi holds that whoever follows God's guidance has no fear or grief, because fear is expecting an evil that cannot be warded off and grief is losing what one loves, and the method leads to all good. He holds that grief joined with faith does not contradict it {cite:tafsir-sharawi-khawatir-scan p.278} {cite:tafsir-sharawi-khawatir-scan p.279} {cite:tafsir-sharawi-khawatir-scan p.280}."
  ur: "شعراوی کے نزدیک جو اللہ کی ہدایت کی پیروی کرتا ہے اسے نہ خوف ہوتا ہے نہ غم، کیونکہ خوف کسی آنے والی برائی کی توقع ہے جسے روکا نہ جا سکے، اور غم کسی محبوب کے چھن جانے کا نام ہے، اور منہج سب بھلائی کی طرف لے جاتا ہے۔ ان کے نزدیک ایمان کے ساتھ غم اس کے منافی نہیں {cite:tafsir-sharawi-khawatir-scan p.278} {cite:tafsir-sharawi-khawatir-scan p.279} {cite:tafsir-sharawi-khawatir-scan p.280}۔"
