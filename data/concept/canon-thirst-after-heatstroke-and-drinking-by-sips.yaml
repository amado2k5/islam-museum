id: concept/canon-thirst-after-heatstroke-and-drinking-by-sips
class: concept
kind: scientific
label: { ar: "العطش بعد ضربة الحر والشرب جرعة جرعة", en: "Thirst after heatstroke and drinking by sips in the Canon", ur: "لو لگنے کے بعد پیاس اور گھونٹ گھونٹ پینا قانون میں", es: "Sed tras un golpe de calor y beber a sorbos en el Canon", fr: "Soif après un coup de chaleur et hydratation par petites gorgées dans le Canon", tr: "Sıcak çarpması sonrası susuzluk ve doz doz içme", id: "Haus setelah heat stroke dan minum dosis demi dosis" }
summary:
  ar: "يحذر ابن سينا من أن يشرب العطشان على النوم ريه دفعة، فيقول إنه حينئذ يموت في المكان، ويوصي بالتجزي بالمضمضة، فإن لم يجد بداً شرب جرعة بعد جرعة، ويفضل أن يشرب دهن ورد وماء ممزوجين قبل الماء، ويجلس مضروب الحر في موضع بارد ويغسل رجليه بماء بارد {cite:canon-ibn-sina-print-v1 p.262}."
  en: "Ibn Sina warns that a man thirsty from sleep who drinks his fill at once may die on the spot, and advises making do with rinsing the mouth; if he cannot avoid drinking, he drinks sip after sip, best taking mixed rose oil and water before the water; one struck by heat sits in a cool place and washes his feet in cold water {cite:canon-ibn-sina-print-v1 p.262}."
  es: "Ibn Sina advierte que un hombre sediento por el sueño que bebe hasta saciarse de una vez puede morir en el acto, y aconseja conformarse con enjuagarse la boca; si no puede evitar beber, bebe sorbo tras sorbo, preferiblemente tomando aceite de rosas mezclado con agua antes del agua; quien sufre de calor se sienta en un lugar fresco y se lava los pies con agua fría {cite:canon-ibn-sina-print-v1 p.262}."
  fr: "Ibn Sina avertit qu'un homme assoiffé après le sommeil qui boit à satiété d'un seul coup peut mourir sur le coup, et conseille de se contenter de se rincer la bouche; s'il ne peut éviter de boire, il boit gorgée après gorgée, en prenant de préférence un mélange d'huile de rose et d'eau avant l'eau; celui qui est frappé par la chaleur s'assoit dans un endroit frais et se lave les pieds à l'eau froide {cite:canon-ibn-sina-print-v1 p.262}."
  ur: "ابن سینا نے تنبیہ کی ہے کہ نیند سے پیاسا آدمی جو ایک دم پیٹ بھر کر پی لیتا ہے وہ موقع پر ہی مر سکتا ہے، اور منہ کی کلی کرنے کا مشورہ دیتا ہے۔ اگر وہ پینے سے بچ نہیں سکتا تو گھونٹ گھونٹ پیتا ہے، پانی سے پہلے گلاب کا تیل اور پانی ملا کر پینا بہتر ہے۔ گرمی کی زد میں آنے والا ٹھنڈی جگہ پر بیٹھتا ہے اور ٹھنڈے پانی سے پاؤں دھوتا ہے۔"
  tr: "İbn Sina, susamış birinin uyumadan önce hemen içmesi gerektiğini, böyle durumlarda anında öleceğini ve kısmi durulama önerdiğini söyler. Gerek kalmazsa, doz ardı ardına içilmelidir. Gül yağı ve su karışımı su içmek, sıcak bir karışımla serin bir yerde oturup ayaklarını soğuk suyla yıkamak tercih edilir {cite:canon-ibn-sina-print-v1 s.262}."
  id: "Ibn Sina memperingatkan bahwa orang yang haus harus segera meminumnya sebelum tidur, mengatakan bahwa dalam kasus seperti itu ia akan meninggal di tempat dan menyarankan untuk membilas sebagian. Jika ia tidak merasa perlu, ia harus minum satu dosis demi dosis berikutnya. Lebih baik minum minyak mawar dan air yang dicampur sebelum air, lalu duduk dengan campuran panas di tempat yang sejuk dan mencuci kakinya dengan air dingin {cite:canon-ibn-sina-print-v1 hlm.262}."
