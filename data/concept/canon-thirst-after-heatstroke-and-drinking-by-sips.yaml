summary:
  ar: "يحذر ابن سينا من أن يشرب العطشان على النوم ريه دفعة، فيقول إنه حينئذ يموت في المكان، ويوصي بالتجزي بالمضمضة، فإن لم يجد بداً شرب جرعة بعد جرعة، ويفضل أن يشرب دهن ورد وماء ممزوجين قبل الماء، ويجلس مضروب الحر في موضع بارد ويغسل رجليه بماء بارد {cite:canon-ibn-sina-print-v1 p.262}."
  en: "Ibn Sina warns that a man thirsty from sleep who drinks his fill at once may die on the spot, and advises making do with rinsing the mouth; if he cannot avoid drinking, he drinks sip after sip, best taking mixed rose oil and water before the water; one struck by heat sits in a cool place and washes his feet in cold water {cite:canon-ibn-sina-print-v1 p.262}."
