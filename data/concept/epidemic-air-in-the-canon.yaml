id: concept/epidemic-air-in-the-canon
class: concept
kind: scientific
label: { ar: "الهواء الوبائي عند ابن سينا", en: "Epidemic air in the Canon", ur: "قانون میں وبائی ہوا", es: "Aire epidémico en el Canon", fr: "Air épidémique dans le Canon" }
summary:
  ar: "في الفصل التاسع من التعليم الثاني يعرض ابن سينا التغيرات الهوائية الرديئة المضادة للمجرى الطبيعي، ويبدأ بما يصيب جوهر الهواء، وهو الوباء، فيصفه بأنه تعفن يعرض في الهواء يشبه تعفن الماء المستنقع الآجن {cite:canon-ibn-sina-print-v1 p.125}."
  en: "In the ninth chapter of the second lesson Ibn Sina treats the harmful changes of the air that run against its natural course, and begins with changes in the air's substance, the epidemic, which he describes as a putrefaction arising in the air like the putrefaction of stagnant, stale water {cite:canon-ibn-sina-print-v1 p.125}."
  es: "En el noveno capítulo de la segunda lección, Ibn Sina trata los cambios nocivos del aire que van en contra de su curso natural, y comienza con los cambios en la sustancia del aire, la epidemia, que describe como una putrefacción que surge en el aire como la putrefacción del agua estancada y rancia {cite:canon-ibn-sina-print-v1 p.125}."
  fr: "Dans le neuvième chapitre de la deuxième leçon, Ibn Sina traite des changements nocifs de l'air qui vont à l'encontre de son cours naturel, et commence par les changements dans la substance de l'air, l'épidémie, qu'il décrit comme une putréfaction survenant dans l'air comme la putréfaction de l'eau stagnante et croupie {cite:canon-ibn-sina-print-v1 p.125}."
  ur: "دوسرے سبق کے نویں باب میں ابن سینا ہوا کی ان نقصان دہ تبدیلیوں کا علاج کرتا ہے جو اس کے فطری دھارے کے خلاف چلتی ہیں اور اس کا آغاز ہوا کے مادے یعنی وبا میں ہونے والی تبدیلیوں سے ہوتا ہے، جسے وہ ہوا میں پیدا ہونے والی خرابی کے طور پر بیان کرتا ہے جیسا کہ ٹھہرے ہوئے، باسی پانی کے زوال کی طرح۔"
