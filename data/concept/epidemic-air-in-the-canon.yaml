summary:
  ar: "في الفصل التاسع من التعليم الثاني يعرض ابن سينا التغيرات الهوائية الرديئة المضادة للمجرى الطبيعي، ويبدأ بما يصيب جوهر الهواء، وهو الوباء، فيصفه بأنه تعفن يعرض في الهواء يشبه تعفن الماء المستنقع الآجن {cite:canon-ibn-sina-print-v1 p.125}."
  en: "In the ninth chapter of the second lesson Ibn Sina treats the harmful changes of the air that run against its natural course, and begins with changes in the air's substance, the epidemic, which he describes as a putrefaction arising in the air like the putrefaction of stagnant, stale water {cite:canon-ibn-sina-print-v1 p.125}."
