  ur: "ہیوفاریقون ⁦(رومی دازی، حاشیہ کے مطابق)⁩"
  es: "Hayufariqun (Roman dazi, según el editor)"
  fr: "Hayufariqun (Roman dazi, selon l'éditeur)"
summary:
  ar: "قضبان وزهر وحبّ أصفر إلى الحمرة، يُسقى من ثمرته، وهو محلّل للأورام، وأوراقه تنفع من الحروق والقروح، ومطبوخه بالشراب ينفع من وجع الورك. {cite:canon-ibn-sina-print-v1 p.447}"
  en: "Hayufariqun has stalks, flowers and a yellowish-red seed like sumac; its fruit is drunk; it resolves swellings, its leaf helps burns and ulcers, and its decoction with wine helps hip pain. {cite:canon-ibn-sina-print-v1 p.447}"
  ur: "ہیوفاریقون کے تنے، پھول اور سرخی مائل زرد بیج ہیں جو سماق سے ملتے ہیں؛ اس کا پھل پیا جاتا ہے؛ یہ سوجن تحلیل کرتا ہے، اس کا پتا جلنے اور زخموں میں کام آتا ہے، اور شراب کے ساتھ جوشاندہ کولھے کے درد میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.447}"
  es: "Hayufariqun tiene tallos, flores y una semilla de color rojo amarillento similar al zumaque; su fruto se consume en bebida; reduce la hinchazón, sus hojas ayudan con quemaduras y úlceras, y su decocción con vino alivia el dolor de cadera. {cite:canon-ibn-sina-print-v1 p.447}"
  fr: "Le Hayufariqun possède des tiges, des fleurs et une graine jaune-rougeâtre semblable à celle du sumac; son fruit est une boisson; il résorbe les gonflements, sa feuille soigne les brûlures et les ulcères, et sa décoction avec du vin soulage les douleurs de la hanche. {cite:canon-ibn-sina-print-v1 p.447}"
