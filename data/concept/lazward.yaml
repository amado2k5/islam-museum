  ur: "لازورد"
summary:
  ar: "اللازورد حجر قوته كقوة لزاق الذهب وأضعف يسيراً، حار في الثانية يابس في الثالثة، لذاع معفن جلاء، ينفع البهر ووجع الكلى ويسهل السوداء {cite:canon-ibn-sina-print-v1 p.538}."
  en: "Lazward is a stone whose power is that of the gold-solder (lizaq al-dhahab) but a little weaker, hot in the second degree and dry in the third; stinging, putrefying and cleansing, it helps shortness of breath and kidney pain and loosens black bile {cite:canon-ibn-sina-print-v1 p.538}."
  ur: "لازورد ایک پتھر ہے جس کی قوت لزاق الذہب جیسی ہے مگر ذرا کمزور، دوسرے درجے میں گرم اور تیسرے میں خشک؛ چبھنے والا، گلانے والا اور جلا دینے والا، سانس پھولنے اور گردے کے درد میں مفید ہے اور سودا خارج کرتا ہے {cite:canon-ibn-sina-print-v1 p.538}۔"
