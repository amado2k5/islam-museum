summary:
  fr: "De la famille de fashra, avec feuille de grand lierre et racine noire dehors, jaune dedans {cite:canon-ibn-sina-print-v1 p.628}."
  ar: "فاشرستين في الكتاب من جنس الفاشرا له ورق كورق اللبلاب الكبير وأصله أسود الخارج أصفر الداخل، يفعل مثل أفعالها لكنه أضعف قليلا، وينفع من الفالج والصرع وينقي الصدر {cite:canon-ibn-sina-print-v1 628}"
  en: "Fashrastin is in the book of the genus of fashra, with a leaf like the large ivy and a root black outside and yellow within; it acts as fashra does but a little more weakly, and it benefits palsy and epilepsy and cleanses the chest {cite:canon-ibn-sina-print-v1 628}"
  ur: "فاشرستین کتاب میں فاشرا کی جنس سے ہے، اس کا پتا بڑی بیل کے پتے جیسا ہے اور جڑ باہر سے کالی اور اندر سے پیلی؛ یہ فاشرا ہی کی طرح عمل کرتی ہے مگر ذرا کمزور، اور فالج اور صرع میں نافع ہے اور سینہ صاف کرتی ہے {cite:canon-ibn-sina-print-v1 628}۔"
