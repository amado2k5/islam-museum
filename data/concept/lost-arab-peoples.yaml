id: concept/lost-arab-peoples
class: concept
kind: term
label: { ar: "العرب البائدة", en: "The vanished Arabs (al-'Arab al-ba'ida)", ur: "عرب بائدہ" }
summary:
  ar: "العرب البائدة أو العاربة أمم عربية قديمة ينقل المؤرخون العرب أنها هلكت قبل الإسلام: عاد وهي الأولى، وثمود، وطسم، وجديس، والعماليق، وأميم، وجاسم، وجرهم، ووبار، وغيرها. وتتفق كتب الطبري والمسعودي وابن كثير وابن خلدون في أصل القائمة وتختلف في أنساب بعضها وفي أماكنها وفي مصير كل منها؛ وينبّه ابن خلدون إلى أن أخبار ما قبل القرآن مما لم يرد في الكتاب منقطعة الإسناد، ويقول مقال عاد في دائرة المعارف الإسلامية إن وجود أمة اسمها عاد لا يزال سؤالًا بلا جواب وإن أنساب العاديين لا قيمة لها، بينما يورد مقال ثمود شواهد خارجية قديمة على ثمود {cite:tarikh-al-tabari on the dispersal after Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 pp. 188-189} {cite:tarikh-ibn-khaldun-ibar p. 333} {cite:encyclopaedia-of-islam-2 vol. 1 p. 188} {cite:encyclopaedia-of-islam-2 vol. 10 p. 461}."
  en: "The vanished Arabs, al-'Arab al-ba'ida or al-'ariba, are ancient Arab nations that the Arab historians report perished before Islam: 'Ad, the first of them, Thamud, Tasm, Jadis, the 'Amaliq, Umaym, Jasim, Jurhum, Wabar and others. Al-Tabari, al-Mas'udi, Ibn Kathir and Ibn Khaldun agree on the core list and differ over the genealogies of some, their lands and the fate of each; Ibn Khaldun warns that reports of the ages before what the Book relates have no unbroken chain, and the Encyclopaedia of Islam's article on 'Ad calls it still an open question whether a nation named 'Ad existed and the Arab genealogies of the 'Adites worthless, while its article on Thamud sets out early outside evidence for Thamud {cite:tarikh-al-tabari on the dispersal after Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 pp. 188-189} {cite:tarikh-ibn-khaldun-ibar p. 333} {cite:encyclopaedia-of-islam-2 vol. 1 p. 188} {cite:encyclopaedia-of-islam-2 vol. 10 p. 461}."
  ur: "عرب بائدہ یا عرب عاربہ قدیم عرب قومیں ہیں جن کے بارے میں عرب مؤرخین نقل کرتے ہیں کہ وہ اسلام سے پہلے ہلاک ہو گئیں: عاد جو پہلی ہے، ثمود، طسم، جدیس، عمالقہ، امیم، جاسم، جرہم، وبار اور دیگر۔ طبری، مسعودی، ابن کثیر اور ابن خلدون فہرست کے بنیادی حصے پر متفق ہیں اور بعض کے نسب، مقامات اور انجام میں اختلاف کرتے ہیں؛ ابن خلدون متنبہ کرتے ہیں کہ جو خبریں اس سے پہلے کے زمانوں کی کتاب میں بیان نہیں ہوئیں ان کی سند منقطع ہے، اور دائرۃ المعارف الاسلامیہ کا مقالہ «عاد» کہتا ہے کہ عاد نام کی کسی قوم کا وجود آج بھی بے جواب سوال ہے اور عادیوں کے عرب نسب بے وقعت ہیں، جبکہ مقالہ «ثمود» ثمود کے قدیم بیرونی شواہد پیش کرتا ہے {cite:tarikh-al-tabari on the dispersal after Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 pp. 188-189} {cite:tarikh-ibn-khaldun-ibar p. 333} {cite:encyclopaedia-of-islam-2 vol. 1 p. 188} {cite:encyclopaedia-of-islam-2 vol. 10 p. 461}۔"
