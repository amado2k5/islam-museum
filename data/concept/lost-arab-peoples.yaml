id: concept/lost-arab-peoples
class: concept
kind: term
label: { ar: "العرب البائدة", en: "The vanished Arabs (al-'Arab al-ba'ida)", ur: "عرب بائدہ", es: "Los árabes desaparecidos (al-'Arab al-ba'ida)", fr: "Les Arabes disparus (al-'Arab al-ba'ida)", tr: "Nesli tükenmiş Araplar", id: "Arab yang punah" }
summary:
  ar: "العرب البائدة أو العاربة أمم عربية قديمة ينقل المؤرخون العرب أنها هلكت قبل الإسلام: عاد وهي الأولى، وثمود، وطسم، وجديس، والعماليق، وأميم، وجاسم، وجرهم، ووبار، وغيرها. وتتفق كتب الطبري والمسعودي وابن كثير وابن خلدون في أصل القائمة وتختلف في أنساب بعضها وفي أماكنها وفي مصير كل منها؛ وينبّه ابن خلدون إلى أن أخبار ما قبل القرآن مما لم يرد في الكتاب منقطعة الإسناد، ويقول مقال عاد في دائرة المعارف الإسلامية إن وجود أمة اسمها عاد لا يزال سؤالًا بلا جواب وإن أنساب العاديين لا قيمة لها، بينما يورد مقال ثمود شواهد خارجية قديمة على ثمود {cite:tarikh-al-tabari on the dispersal after Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 pp. 188-189} {cite:tarikh-ibn-khaldun-ibar p. 333} {cite:encyclopaedia-of-islam-2 vol. 1 p. 188} {cite:encyclopaedia-of-islam-2 vol. 10 p. 461}."
  en: "The vanished Arabs, al-'Arab al-ba'ida or al-'ariba, are ancient Arab nations that the Arab historians report perished before Islam: 'Ad, the first of them, Thamud, Tasm, Jadis, the 'Amaliq, Umaym, Jasim, Jurhum, Wabar and others. Al-Tabari, al-Mas'udi, Ibn Kathir and Ibn Khaldun agree on the core list and differ over the genealogies of some, their lands and the fate of each; Ibn Khaldun warns that reports of the ages before what the Book relates have no unbroken chain, and the Encyclopaedia of Islam's article on 'Ad calls it still an open question whether a nation named 'Ad existed and the Arab genealogies of the 'Adites worthless, while its article on Thamud sets out early outside evidence for Thamud {cite:tarikh-al-tabari on the dispersal after Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 pp. 188-189} {cite:tarikh-ibn-khaldun-ibar p. 333} {cite:encyclopaedia-of-islam-2 vol. 1 p. 188} {cite:encyclopaedia-of-islam-2 vol. 10 p. 461}."
  ur: "عرب بائدہ یا عرب عاربہ قدیم عرب قومیں ہیں جن کے بارے میں عرب مؤرخین نقل کرتے ہیں کہ وہ اسلام سے پہلے ہلاک ہو گئیں: عاد جو پہلی ہے، ثمود، طسم، جدیس، عمالقہ، امیم، جاسم، جرہم، وبار اور دیگر۔ طبری، مسعودی، ابن کثیر اور ابن خلدون فہرست کے بنیادی حصے پر متفق ہیں اور بعض کے نسب، مقامات اور انجام میں اختلاف کرتے ہیں؛ ابن خلدون متنبہ کرتے ہیں کہ جو خبریں اس سے پہلے کے زمانوں کی کتاب میں بیان نہیں ہوئیں ان کی سند منقطع ہے، اور دائرۃ المعارف الاسلامیہ کا مقالہ «عاد» کہتا ہے کہ عاد نام کی کسی قوم کا وجود آج بھی بے جواب سوال ہے اور عادیوں کے عرب نسب بے وقعت ہیں، جبکہ مقالہ «ثمود» ثمود کے قدیم بیرونی شواہد پیش کرتا ہے {cite:tarikh-al-tabari on the dispersal after Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 pp. 188-189} {cite:tarikh-ibn-khaldun-ibar p. 333} {cite:encyclopaedia-of-islam-2 vol. 1 p. 188} {cite:encyclopaedia-of-islam-2 vol. 10 p. 461}۔"
  es: "Los árabes desaparecidos, al-'Arab al-ba'ida o al-'ariba, son antiguas naciones árabes que, según los historiadores árabes, perecieron antes del Islam: 'Ad, la primera de ellas, Thamud, Tasm, Jadis, los 'Amaliq, Umaym, Jasim, Jurhum, Wabar y otras. Al-Tabari, al-Mas'udi, Ibn Kathir e Ibn Khaldun coinciden en la lista principal y difieren en cuanto a las genealogías de algunos, sus tierras y el destino de cada uno; Ibn Khaldun advierte que los informes de las edades anteriores a lo que relata el Libro no tienen una cadena ininterrumpida, y el artículo de la Enciclopedia del Islam sobre 'Ad dice que todavía es una cuestión abierta si existió una nación llamada 'Ad y las genealogías árabes de los 'Aditas carecen de valor, mientras que su artículo sobre Thamud expone evidencia externa temprana de Thamud {cite:tarikh-al-tabari sobre la dispersión después de Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 pp. 188-189} {cite:tarikh-ibn-khaldun-ibar p. 333} {cite:encyclopaedia-of-islam-2 vol. 1 p. 188} {cite:encyclopaedia-of-islam-2 vol. 10 p. 461}."
  fr: "Les Arabes disparus, al-'Arab al-ba'ida ou al-'ariba, sont d'anciennes nations arabes dont les historiens arabes rapportent qu'elles ont péri avant l'islam: les Ad, les premiers d'entre eux, les Thamud, les Tasm, les Jadis, les Amaliq, les Umaym, les Jasim, les Jurhum, les Wabar et d'autres. Al-Tabari, al-Mas'udi, Ibn Kathir et Ibn Khaldun s'accordent sur la liste principale et divergent sur les généalogies de certains, leurs terres et le destin de chacun; Ibn Khaldun avertit que les récits des époques antérieures à celles relatées dans le Livre ne sont pas transmis de manière ininterrompue, et l'article de l'Encyclopédie de l'Islam sur 'Ad considère que l'existence d'une nation nommée 'Ad reste une question ouverte et que les généalogies arabes des 'Adites sont sans valeur, tandis que son article sur Thamud présente des preuves extérieures anciennes concernant Thamud {cite:tarikh-al-tabari on the dispersal after Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 pp. 188-189} {cite:tarikh-ibn-khaldun-ibar p. 333} {cite:encyclopaedia-of-islam-2 vol. 1 p. 188} {cite:encyclopaedia-of-islam-2 vol. 10 p. 461}."
  tr: "Soyu tükenmiş veya Araplaşmış Araplar, Arap tarihçilerinin İslam'dan önce yok olduğunu bildirdiği eski Arap uluslarıdır: 'Ad, ilk olan, Thamud, Tasm, Jadis, Amalekliler, Umim, Jassim, Jurhum, Wabar ve diğerleri. El-Tabari, el-Ma'sudi, İbn Kathir ve İbn Haldun'un kitapları listenin kökeni konusunda hemfikirdir ancak soyağacı, konumları ve akıbetleri açısından farklılık gösterir; İbn Haldun, kitapta bulunmayan Kur'an öncesi anlatımların aktarım zincirinin kopuk olduğunu belirtir. İslam Ansiklopedisi'nde 'Ad' adlı bir ulusun varlığının cevapsız bir soru olarak kaldığını ve sıradan insanların soy kütüklerinin değersiz olduğunu, Semud hakkındaki makalenin ise Semud'un eski dış kanıtlarını sunduğunu belirtir {alıntı:] historikh-al-tabari, Babil sonrası yayılma hakkında} {cite:muruj-al-dhahab OpenITI text cilt 1 s. 189} {cite:Tarikh-ibn-khaldun-ibar s. 333} {cite:encyclopaedia-of-Islam-2 cilt 1 s. 188} {cite:encyclopaedia-of-Islam-2 cilt 10, s. 461}."
  id: "Arab yang punah atau telah diarabadikan adalah bangsa Arab kuno yang dilaporkan oleh sejarawan Arab telah punah sebelum Islam: 'Ad, yang merupakan yang pertama, Thamud, Tasm, Jadis, Amalekit, Umim, Jassim, Jurhum, Wabar, dan lainnya. Buku-buku al-Tabari, al-Ma'sudi, Ibn Kathir, dan Ibn Khaldun sepakat tentang asal-usul daftar tersebut tetapi berbeda dalam silsilah, lokasi, dan nasibnya; Ibn Khaldun menunjukkan bahwa catatan pra-Al-Qur'an yang tidak ditemukan dalam buku tersebut memiliki rantai transmisi yang terputus. Sebuah artikel oleh 'Ad dalam Ensiklopedia Islam menyatakan bahwa keberadaan sebuah bangsa bernama 'Ad tetap menjadi pertanyaan yang belum terjawab dan silsilah orang biasa tidak memiliki nilai, sementara artikel tentang Thamud memberikan bukti eksternal lama tentang Thamud {cite:historikh-al-tabari tentang penyebaran setelah Babel} {cite:muruj-al-dhahab OpenITI text vol. 1 hlm. 189} {cite:Tarikh-ibn-khaldun-ibar hlm. 333} {cite:encyclopaedia-of-Islam-2 vol. 1 hlm. 188} {cite:encyclopaedia-of-Islam-2 vol. 10, hlm. 461}."
