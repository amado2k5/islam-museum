id: concept/mashq-script
class: concept
kind: art_form
label: { ar: "المشق", en: "Mashq (the extended hand)", ur: "مشق", es: "Mashq (la mano extendida)", fr: "Mashq (la main tendue)", tr: "Al-Mashq", id: "Al-Mashq" }
summary:
  ar: "طريقة في الكتابة تمدّ الحروف وتبسطها، ذكرها ابن النديم بين خطوط المصاحف ووصف بها ما يكتبه الورّاقون من المصاحف مع المحقق؛ وكره بعض السلف أن يُكتب المصحف مشقًا، ورأى السيوطي أن المستحب تحقيق الخط دون مشقه وتعليقه {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 21} {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 22} {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243}."
  en: "A manner of writing that stretches and extends the letters. Ibn al-Nadim lists it among the scripts of the mushafs and says the warraqs who copy mushafs write them in muhaqqaq and mashq; some early authorities disliked a mushaf being written mashq, and al-Suyuti holds that it is preferable to write the mushaf in a clear, verified hand rather than mashq or ta'liq {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 21} {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 22} {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243}."
  ur: "لکھنے کا وہ انداز جو حروف کو کھینچ کر پھیلاتا ہے۔ ابن الندیم اسے خطوطِ مصاحف میں گنتے ہیں اور کہتے ہیں کہ مصاحف نقل کرنے والے ورّاق انہیں محقق اور مشق میں لکھتے ہیں؛ بعض سلف نے مصحف کے مشق میں لکھے جانے کو ناپسند کیا، اور سیوطی کے نزدیک مستحب یہ ہے کہ مصحف واضح تحقیقی خط میں لکھا جائے نہ کہ مشق یا تعلیق میں {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 21} {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 22} {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243}۔"
  es: "Una forma de escritura que estira y extiende las letras. Ibn al-Nadim la enumera entre las escrituras de los mushafs y dice que los warraqs que copian mushafs los escriben en muhaqqaq y mashq; algunas autoridades antiguas desaprobaban que un mushaf se escribiera en mashq, y al-Suyuti sostiene que es preferible escribir el mushaf con una letra clara y verificada en lugar de mashq o ta'liq {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 21} {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 22} {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243}."
  fr: "Une manière d'écrire qui étire et allonge les lettres. Ibn al-Nadim la mentionne parmi les écritures des mushafs et indique que les warraqs qui copient les mushafs les écrivent en muhaqqaq et mashq; certaines autorités anciennes désapprouvaient qu'un mushaf soit écrit en mashq, et al-Suyuti soutient qu'il est préférable d'écrire le mushaf d'une main claire et vérifiée plutôt qu'en mashq ou en ta'liq {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 21} {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 22} {cite:itqan-suyuti p. 2240} {cite:itqan-suyuti p. 2243}."
  tr: "İbn el-Nadim'in Kur'an yazıtları arasında bahsettiği ve yazıcıların Kur'anlar hakkında yazdıklarını editörle birlikte anlatan harfleri genişleten ve basitleştiren bir yazım yöntemi; bazı erken kuşaklar Kur'an yazmaktan zorlukla hoşlanmazdı ve Al-Suyuti bunun yazının zorluk olmadan doğrulanmasını ve asılmasını önerdi {cite:Fihrist-ibn-al-Nadim-rahmaniyya-cairo s. 21} {cite:Fihrist-ibn-al-Nadim-rahmaniyya-Cairo s. 22} {cite:itqan-suyuti s. 2240} {cite:itqan-suyuti s. 2243}."
  id: "Metode penulisan yang memperluas dan menyederhanakan huruf-huruf, yang disebutkan oleh Ibn al-Nadim di antara aksara Al-Qur'an, yang menggambarkan apa yang ditulis para ahli kitab Al-Qur'an bersama editor; beberapa generasi awal tidak suka menulis Al-Qur'an dengan kesulitan, dan Al-Suyuti menganggap disarankan untuk memverifikasi aksara tanpa kesulitan dan menggantungnya {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo hlm. 21} {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo hlm. 22} {cite:itqan-suyuti hlm. 2240} {cite:itqan-suyuti hlm. 2243}."
