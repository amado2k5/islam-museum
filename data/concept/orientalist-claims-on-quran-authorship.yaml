id: concept/orientalist-claims-on-quran-authorship
class: concept
kind: term
label:
  ar: "دعوى أن النبي مؤلف القرآن عند المستشرقين"
  en: "The orientalist claim that the Prophet authored the Qur'an"
  es: "La afirmación orientalista de que el Profeta fue el autor del Corán"
  fr: "L'affirmation des orientalistes selon laquelle le Prophète est l'auteur du Coran"
  ur: "مستشرقین کا دعویٰ ہے کہ پیغمبر نے قرآن کی تصنیف کی۔"
  tr: "Oryantalistlere göre Peygamber'in Kur'an'ın yazarı olduğu iddiası"
  id: "Klaim bahwa Nabi adalah penulis Al-Qur'an menurut para orientalis"
summary:
  ar: "يعرض زقزوق نماذج من آراء المستشرقين في مصدر القرآن، ويذكر أن جورج سيل جزم في مقدمة ترجمته الإنجليزية بأن النبي هو مؤلف القرآن وأن لهذه المقدمة أثراً طويلاً في الكتابات الأوروبية. ويذكر أن ريتشارد بل رأى أن النبي اعتمد على الكتاب المقدس. هذه الدعوى عند الكتاب وصف لآراء المستشرقين، ويردّ عليها المؤلف، ولا يصدر عنه المتحف حكم فيها."
  en: "Zaqzuq presents orientalist views on the source of the Qur'an. He reports that George Sale's English preface states flatly that the Prophet was the author, a claim that shaped European writing for a long time, and that Richard Bell argued the Prophet drew on the Bible. These are the author's report and rebuttal, not a ruling by the museum."
  es: "Zaqzuq presenta puntos de vista orientalistas sobre el origen del Corán. Informa que el prefacio en inglés de George Sale afirma categóricamente que el Profeta fue el autor, una afirmación que influyó en la literatura europea durante mucho tiempo, y que Richard Bell argumentó que el Profeta se basó en la Biblia. Este es el informe y la refutación del autor, no una decisión del museo."
  fr: "Zaqzuq présente des points de vue orientalistes sur l'origine du Coran. Il rapporte que la préface anglaise de George Sale affirme catégoriquement que le Prophète en est l'auteur, une affirmation qui a longtemps influencé la pensée européenne, et que Richard Bell soutenait que le Prophète s'était inspiré de la Bible. Il s'agit là du compte rendu et de la réfutation de l'auteur, et non d'une décision du musée."
  ur: "زقوق نے قرآن کے ماخذ کے بارے میں مستشرقین کے خیالات پیش کیے ہیں۔ وہ رپورٹ کرتا ہے کہ جارج سیل کا انگریزی دیباچہ واضح طور پر بیان کرتا ہے کہ پیغمبر مصنف تھے، ایک دعویٰ جس نے ایک طویل عرصے تک یورپی تحریر کو شکل دی، اور یہ کہ رچرڈ بیل نے دلیل دی کہ پیغمبر نے بائبل کی طرف متوجہ کیا تھا۔ یہ مصنف کی رپورٹ اور تردید ہیں، میوزیم کا کوئی حکم نہیں۔"
  tr: "Zaqzouk, Kur'an kaynağında Oryantalistlerin görüşlerine örnekler sunar; George Seale'in İngilizce çevirisinin girişinde Peygamber'in Kur'an'ın yazarı olduğunu ve bu girişin Avrupa yazıları üzerinde uzun bir etkisi olduğunu belirtir. Richard Bell'in Peygamber'in İncil'e dayandığına inandığını belirtir. Kitaptaki bu iddia, yazarın reddettiği Oryantalistlerin görüşlerinin bir tanımıdır ve müze bu konuda bir yargı yapmaz."
  id: "Zaqzouk menyajikan contoh pandangan Orientalis dalam sumber Al-Qur'an, menyebutkan bahwa George Seale menyatakan dalam pengantar terjemahan bahasa Inggrisnya bahwa Nabi adalah penulis Al-Qur'an dan bahwa pengantar ini memiliki pengaruh panjang terhadap tulisan-tulisan Eropa. Ia menyebutkan bahwa Richard Bell percaya bahwa Nabi mengandalkan Alkitab. Klaim dalam buku ini merupakan deskripsi pandangan para Orientalis, yang dibantah oleh penulis, dan museum tidak mengeluarkan penilaian terhadapnya."
issue:
  ar: "هل القرآن وحي من الله، أم هو من تأليف النبي أو من مصادر بشرية؟"
  en: "Is the Qur'an revelation from God, or the composition of the Prophet or of human sources?"
