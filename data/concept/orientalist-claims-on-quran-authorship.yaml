id: concept/orientalist-claims-on-quran-authorship
class: concept
kind: term
label:
  ar: "دعوى أن النبي مؤلف القرآن عند المستشرقين"
  en: "The orientalist claim that the Prophet authored the Qur'an"
summary:
  ar: "يعرض زقزوق نماذج من آراء المستشرقين في مصدر القرآن، ويذكر أن جورج سيل جزم في مقدمة ترجمته الإنجليزية بأن النبي هو مؤلف القرآن وأن لهذه المقدمة أثراً طويلاً في الكتابات الأوروبية. ويذكر أن ريتشارد بل رأى أن النبي اعتمد على الكتاب المقدس. هذه الدعوى عند الكتاب وصف لآراء المستشرقين، ويردّ عليها المؤلف، ولا يصدر عنه المتحف حكم فيها."
  en: "Zaqzuq presents orientalist views on the source of the Qur'an. He reports that George Sale's English preface states flatly that the Prophet was the author, a claim that shaped European writing for a long time, and that Richard Bell argued the Prophet drew on the Bible. These are the author's report and rebuttal, not a ruling by the museum."
issue:
  ar: "هل القرآن وحي من الله، أم هو من تأليف النبي أو من مصادر بشرية؟"
  en: "Is the Qur'an revelation from God, or the composition of the Prophet or of human sources?"
wings: [ideas]
themes: [scripture-and-its-sciences, polemic-and-apologetic, islam-and-christianity]
periods: [period/modern-era]
sources: [source/al-istishraq-wal-khalfiyya-azhar]
perspectives:
  - tradition: sunni
    id: zaqzuq-rebuttal
    stance:
      ar: "القرآن وحي من عند الله، وأي دعوى بأن النبي مؤلفه تعيد قول مشركي مكة الذي ردّه القرآن نفسه"
      en: "The Qur'an is revelation from God, and the claim that the Prophet composed it repeats the charge the Meccan pagans made, which the Qur'an itself answers"
    summary:
      ar: "يعدّ زقزوق هذه الدعوى امتداداً لاعتراضات مشركي مكة، ويرى أن المستشرقين الذين تحاملوا على الإسلام سلكوا هذا المسلك {cite:al-istishraq-wal-khalfiyya-azhar p. 112}، ويذكر أن جورج سيل قرر ذلك في مقدمته {cite:al-istishraq-wal-khalfiyya-azhar p. 113}."
      en: "Zaqzuq treats the claim as a continuation of the Meccan pagans' objections and says biased orientalists took the same path, citing Sale's preface as the clearest example."
    holders: [source/al-istishraq-wal-khalfiyya-azhar]
    evidence:
      - ref: source/al-istishraq-wal-khalfiyya-azhar
        note:
          ar: "ص 112 و113 من PDF"
          en: "PDF pp. 112 and 113"
    sources: [source/al-istishraq-wal-khalfiyya-azhar]
  - tradition: other
    id: orientalist-positions-as-reported
    stance:
      ar: "القرآن من تأليف النبي، أو من مصادر كتابية، والكتاب المقدس أو المعاصرون مصدر ما فيه"
      en: "The Qur'an is the Prophet's composition, or drawn from scriptural sources such as the Bible"
    summary:
      ar: "يذكر الكتاب ثلاثة مواقف منسوبة إلى أصحابها: جورج سيل جزم بأن النبي هو المؤلف، وإرنست رينان عدّ الرسالة امتداداً لحركة دينية سائدة، وريتشارد بل رأى أن الكتاب المقدس، ولا سيما قسم القصص، كان المصدر الأكبر {cite:al-istishraq-wal-khalfiyya-azhar p. 113} {cite:al-istishraq-wal-khalfiyya-azhar p. 115}. هذه مواقف منقولة في الكتاب لا يُعرض فيها أصحابها من أصولهم بعد."
      en: "The book reports three positions, each attributed: Sale holds the Prophet was the author, Renan treats the mission as an extension of a religious movement of the time, and Bell holds that the Bible, above all in its narratives, was the main source. The book reports these; their original texts are not yet checked."
    holders: []
