label:
  ar: النقود
  en: "Money (al-nuqud)"
  es: "Dinero (al-nuqud)"
  fr: "L'argent (al-nuqud)"
  ur: "رقم ⁦(النقود)⁩"
  tr: "Para"
  id: "Untuk"
summary:
  ar: "يرى قعدات أن الوظيفة الشرعية للنقود هي وسيلة التبادل بين المنتجين والمستهلكين، وأن الإنتاج الطبيعي إذا كان قاعدة الاقتصاد صارت النقود أمراً ثانوياً {cite:qadan-manhaj-iqtisad-quran p. 142}، {cite:qadan-manhaj-iqtisad-quran p. 143}. ويعيب على الرأسمالية والشيوعية أنهما أعطتا النقود قيمة تفوق قيمة السلع، فصار مالك النقد يملك كل شيء ولو لم ينتج {cite:qadan-manhaj-iqtisad-quran p. 142}. ويعد ما جرى بعد النفط من تجميد الأموال في المصارف الأوروبية، وإلقاء الإنتاج في البحر طلباً للربح، صوراً لانحراف هذه الوظيفة {cite:qadan-manhaj-iqtisad-quran p. 144}. يعرض المؤلف ذكر النقود في القرآن والسنة، وينقل عن ابن تيمية أن الدراهم والدنانير وسيلة لا تقصد لذاتها، وعن الغزالي أنهما حجران وإنما خُلقا لتتداولهما الأيدي، ويذكر أن سك النقود وظيفة الدولة، وأن الزكاة تجب فيها وأن المتجانسة منها تبادل مثلًا بمثل."
  tr: "Qaadat, paranın meşru işlevinin üreticiler ile tüketiciler arasında bir alışveriş aracı olduğuna ve ekonominin temeli para ise doğal üretimin ikincil hale geldiğine inanır. {cite:qadan-manhaj-iqtisad-kur'an s. 142}, {cite:qadan-manhaj-iqtisad-kuran s. 143}. Kapitalizmi ve komünizmi paraya mallardan daha yüksek bir değer verdiği için eleştirir; böylece paranın sahibi, üretilmese bile her şeye sahip olur {cite:qadan-manhaj-iqtisad-kur'an s. 142}. Petrolden sonra olanlar—Avrupa bankalarındaki fonların dondurulması ve üretimin kâr için denize boşaltılması—bu işlevin sapmasına örneklerdir {cite:qadan-manhaj-iqtisad-qur'an s. 144}. Yazar, Kur'an ve Sünnet'te paralardan bahsederek, İbn Teymiye'nin dirhem ve dinarların kendi amaçları için değil, iki taş olduğunu ve el dolaşıma uygun olarak yaratılmış iki taş olduğunu belirten paraları aktarır. Ayrıca para basmanın devletin görevi olduğunu, zekatın zorunlu olduğunu ve homojen olanların örneğin değiş tokuş edildiğini belirtir."
  id: "Qaadat percaya bahwa fungsi sah uang adalah sarana pertukaran antara produsen dan konsumen, dan jika uang adalah fondasi ekonomi, maka produksi alami menjadi sekunder. {cite:qadan-manhaj-iqtisad-qur'an hlm. 142}, {cite:qadan-manhaj-iqtisad-qur'an hlm. 143}. Ia mengkritik kapitalisme dan komunisme karena menghargai uang lebih tinggi daripada barang; dengan demikian, pemilik uang memiliki segalanya, bahkan jika uang itu tidak diproduksi {cite:qadan-manhaj-iqtisad-qur'an hlm. 142}. Apa yang terjadi setelah minyak—membekukan dana di bank-bank Eropa dan membuang produksi ke laut untuk keuntungan—adalah contoh penyimpangan dari fungsi ini {cite:qadan-manhaj-iqtisad-qur'an hlm. 144}. Penulis menyebutkan uang dalam Al-Qur'an dan Sunnah, mengutip pernyataan Ibn Taymiyyah bahwa dirham dan dinar bukan untuk tujuan sendiri, melainkan dua batu yang dibuat untuk beredar. Ia juga menyatakan bahwa mencetak uang adalah tugas negara, zakat wajib, dan koin homogen ditukar, misalnya."
