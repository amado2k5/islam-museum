  en: "Money (al-nuqud)"
summary:
  ar: "يرى قعدات أن الوظيفة الشرعية للنقود هي وسيلة التبادل بين المنتجين والمستهلكين، وأن الإنتاج الطبيعي إذا كان قاعدة الاقتصاد صارت النقود أمراً ثانوياً {cite:qadan-manhaj-iqtisad-quran p. 142}، {cite:qadan-manhaj-iqtisad-quran p. 143}. ويعيب على الرأسمالية والشيوعية أنهما أعطتا النقود قيمة تفوق قيمة السلع، فصار مالك النقد يملك كل شيء ولو لم ينتج {cite:qadan-manhaj-iqtisad-quran p. 142}. ويعد ما جرى بعد النفط من تجميد الأموال في المصارف الأوروبية، وإلقاء الإنتاج في البحر طلباً للربح، صوراً لانحراف هذه الوظيفة {cite:qadan-manhaj-iqtisad-quran p. 144}."
