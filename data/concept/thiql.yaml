summary:
  ar: "ثفل في الكتاب أجوده ثفل دهن الزعفران الرزين، وثفل عصير الزيت في الأولى من الحرارة، وثفل دهن الزعفران يصبغ اللسان والأسنان صبغا يبقى، وثفل عصير الزيت من المدملات للقروح العارضة في الأبدان اليابسة {cite:canon-ibn-sina-print-v1 p.697}"
  en: "Thiql is in the book best as the dregs of saffron oil that are heavy; the dregs of olive pressings are in the first degree of heat; the dregs of saffron oil dye the tongue and teeth with a stain that lasts, and the dregs of olive pressings are among the healers of ulcers that occur in dry bodies {cite:canon-ibn-sina-print-v1 p.697}"
  ur: "ثفل کتاب میں سب سے اچھا زعفران کے تیل کا بھاری ثفل ہے؛ زیتون کے نچوڑ کا ثفل حرارت کے پہلے درجے میں ہے؛ زعفران کے تیل کا ثفل زبان اور دانتوں کو ایسا رنگ دیتا ہے جو ٹھہرا رہتا ہے، اور زیتون کے نچوڑ کا ثفل خشک بدنوں میں پیدا ہونے والے قرحوں کو بھرنے والی دواؤں میں سے ہے {cite:canon-ibn-sina-print-v1 p.697}۔"
