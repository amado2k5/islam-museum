id: concept/khums-fiqh
class: concept
kind: term
label:
  ar: الخمس (في الغنيمة)
  en: Khums (the fifth of spoil)
  ur: خمس (غنیمت کا پانچواں حصہ)
summary:
  ar: 'الخُمس لغة جزء من خمسة أجزاء، وخمّسه أخذ خمسه، والخمس في الاصطلاح خمس الغنيمة أو الفيء، والتخميس إخراج الخمس من الغنيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} الألفاظ ذات الصلة: المرباع (ربع الغنيمة الذي يأخذه الرئيس في الجاهلية)، والصفي (ما يصطفيه الرئيس لنفسه قبل القسمة، ومنه في الإسلام ما اصطفاه النبي كالسيف والفرس والأمة)، والنشيطة (ما يأخذه الرئيس قبل القسمة)، والفضول (بقايا الغنيمة التي لا تستقيم قسمتها على الجيش). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} الحكم: تخميس الغنيمة واجب بالاتفاق بقوله تعالى في سورة الأنفال؛ والتخميس في الفيء خلاف بين الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} الأموال التي تخمس: الغنيمة، وهي ما يأخذه المسلمون من الكفار بالقوة؛ وكانت الغنائم حلالا للنبي وأمته، ثم صار أربعة أخماسها للغانمين والخمس لأهل الخمس؛ والغنيمة إن كانت أرضا فتحت عنوة ففي تخميسها خلاف. وإن كانت منقولة وجب تخميسها بعد إخراج السلب والمؤن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} أسهم الخمس عند الشافعية والحنابلة خمسة: سهم لله ولرسوله يصرف في الكراع والسلاح ومصالح المسلمين وأرزاق القضاة والعلماء، وسهم لذوي القربى من بني هاشم وبني المطلب ويستحقونه بالانتساب إلى الآباء ذكورا وإناثا غنيا وفقيرا عند الجمهور، وسهم لليتامى ويشترط عند المشهور أن يكونوا فقراء مسلمين، وسهم للمساكين، وسهم لابن السبيل؛ ويجب تعميم المستحقين بالعطاء إن وفى المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7859}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861} الحنفية يقسمون الخمس ثلاثة أسهم لليتامى والمساكين وابن السبيل، ويرون أن سهم الله والرسول سقط بموته، وسهم ذوي القربى بالنصرة ثم بالفقر؛ والمالكية يجعلونه موكولا إلى نظر الإمام؛ وطائفة تجعله ستة أسهم؛ وأبو العالية يجعل سهم الله ما يقبض عليه الإمام للكعبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7864} الفيء لا يخمس عند الحنفية والمالكية، والخرقي من الحنابلة والشافعية يخمسونه، والأخماس الأربعة للمرتزقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7865} السلب: إن استحقه القاتل لا يخمس عند جمهور الفقهاء، وعن ابن عباس والأوزاعي ومكحول أنه يخمس؛ والحنفية يخمسونه إلا أن ينفل به الإمام؛ وفي أثر البراء بن مالك أن عمر خمس سلبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} الركاز: المدفون في الأرض، والواجب فيه الخمس لحديث أبي هريرة، وتفصيله في الزكاة والركاز والمعدن والكنز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}'
  en: 'Khums is lexically a fifth; khammasa is to take a fifth; technically it is the fifth of spoil or booty, and takhmis is setting aside the fifth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} Related terms: mirba'' (the quarter taken by the chief in pre-Islamic raids), safi (what the chief chose for himself before division, including what the Prophet chose, such as a sword, a horse or a slave-girl), nashita (what a chief took before division) and fudul (remnants too small to divide among an army). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} Ruling: setting aside a fifth of spoil is obligatory by agreement, on the Quranic verse of the spoil; setting aside a fifth of fay'' is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} Property subject to the fifth: spoil taken from unbelievers by force; spoil was lawful to the Prophet\''s community, and four fifths went to the warriors and the fifth to its beneficiaries. If the spoil is land conquered by force the division is disputed; movable spoil is divided after the salab and expenses are deducted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} The Shafiis and Hanbalis give five shares: one for God and His Messenger (for horses, arms, the public good and the stipends of judges and scholars); one for the kin of Hashim and al-Muttalib (by descent, male and female, rich and poor by the majority); one for orphans (by the preferred view poor Muslims); one for the needy; one for the traveller; the beneficiaries must be generally given when enough is available. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7859}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861} The Hanafis divide the fifth into three shares for orphans, the needy and the traveller, holding that God\''s and the Messenger\''s share lapsed at the Prophet\''s death; the Malikis leave it to the Imam; some divide it into six; Abu al-Aliya gives God\''s share to the Kaaba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7864} Fay\'' is not divided into a fifth by the Hanafis and Malikis; the Shafiis and Khiraqi divide it, the four fifths going to the frontier soldiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7865} Spoil: if the slayer takes it, the majority do not divide it; al-Awza''i, Makhul and Ibn Abbas held that it is divided; the Hanafis divide it unless the Imam granted it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} Buried treasure: the fifth is due, on the report of Abu Hurayra; its details are under zakat, buried treasure, mine and hoard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}'
  ur: 'خمس لغت میں پانچ میں سے ایک حصہ ہے، اور اصطلاح میں مال غنیمت یا فے کا پانچواں حصہ، اور تخمیس اس پانچویں حصے کو الگ کرنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} متعلقہ الفاظ: مرباع (جاہلیت میں سردار کا غنیمت کا چوتھائی لینا)، صفی (سردار کا تقسیم سے پہلے اپنے لیے چنا ہوا حصہ، جیسے نبی کا چنا ہوا تلوار، گھوڑا یا باندی)، نشیطہ (تقسیم سے پہلے سردار کا لیا ہوا مال)، فضول (غنیمت کا بچا ہوا ٹکڑا جو لشکر پر تقسیم نہ ہو سکے)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} حکم: مال غنیمت کا خمس نکالنا بالاتفاق واجب ہے، سورۂ انفال کی آیت کی بنا پر؛ فے کا خمس نکالنے میں فقہاء میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} وہ اموال جن کا خمس نکالا جائے: غنیمت، یعنی وہ مال جو مسلمان کفار سے زور سے لیں؛ غنائم امت محمدیہ کے لیے حلال ہوئیں، پھر چار حصے لڑنے والوں کے اور پانجواں حصہ خمس کے مستحقین کا ہوا؛ اگر غنیمت وہ زمین ہو جو طاقت سے فتح ہوئی تو اس کے خمس میں اختلاف ہے؛ منقولہ غنیمت میں سلب اور اخراجات کے بعد خمس نکالا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} شافعیہ اور حنابلہ کے نزدیک خمس کے پانچ حصے ہیں: ایک اللہ اور رسول کا (گھوڑوں، ہتھیاروں اور مسلمانوں کی مصلحتوں اور قاضیوں اور علماء کے وظائف میں خرچ)، ایک ذوی القربیٰ بنو ہاشم اور بنو مطلب کا (نسب سے، مرد و عورت، غنی و فقیر جمہور کے نزدیک)، ایک یتیموں کا (مشہور قول کے مطابق فقیر مسلمان)، ایک مساکین کا، اور ایک ابن السبیل کا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7859}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861} حنفیہ خمس کو تین حصوں میں بانٹتے ہیں یعنی یتیم، مسکین اور ابن السبیل؛ اللہ اور رسول کا حصہ نبی کی وفات سے ساقط؛ مالکیہ امام کی صوابدید پر؛ بعض چھ حصے کرتے ہیں؛ ابو العالیہ اللہ کا حصہ کعبہ کو دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7864} فیء کا خمس حنفیہ اور مالکیہ کے نزدیک نہیں؛ شافعیہ اور خرقی خمس نکالتے ہیں، باقی چار حصے سرحدی جنگجوؤں کے لیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7865} سلب: قاتل کو مل جائے تو جمہور کے نزدیک خمس نہیں؛ اوزاعی، مکحول اور ابن عباس سے خمس منقول؛ حنفیہ امام کی عطا نہ ہو تو خمس نکالتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} رِکاز: اس میں خمس واجب ہے، ابو ہریرہ کی حدیث سے؛ تفصیل زکوٰۃ، رکاز، معدن اور کنز کے مصطلحات میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}'
