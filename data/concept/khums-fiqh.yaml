id: concept/khums-fiqh
class: concept
kind: term
label:
  ar: الخمس ⁦(في الغنيمة)⁩
  en: Khums (the fifth of spoil)
  ur: خمس ⁦(غنیمت کا پانچواں حصہ)⁩
  es: "Khums (la quinta parte del botín)"
  fr: "Khums (le cinquième du butin)"
  tr: "Khums (ganimetlerde)"
  id: "Khums (dalam hasil rampasan)"
summary:
  ar: 'الخُمس لغة جزء من خمسة أجزاء، وخمّسه أخذ خمسه، والخمس في الاصطلاح خمس الغنيمة أو الفيء، والتخميس إخراج الخمس من الغنيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} الألفاظ ذات الصلة: المرباع ⁦(ربع الغنيمة الذي يأخذه الرئيس في الجاهلية)⁩، والصفي ⁦(ما يصطفيه الرئيس لنفسه قبل القسمة، ومنه في الإسلام ما اصطفاه النبي كالسيف والفرس والأمة)⁩، والنشيطة ⁦(ما يأخذه الرئيس قبل القسمة)⁩، والفضول ⁦(بقايا الغنيمة التي لا تستقيم قسمتها على الجيش)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} الحكم: تخميس الغنيمة واجب بالاتفاق بقوله تعالى في سورة الأنفال؛ والتخميس في الفيء خلاف بين الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} الأموال التي تخمس: الغنيمة، وهي ما يأخذه المسلمون من الكفار بالقوة؛ وكانت الغنائم حلالا للنبي وأمته، ثم صار أربعة أخماسها للغانمين والخمس لأهل الخمس؛ والغنيمة إن كانت أرضا فتحت عنوة ففي تخميسها خلاف. وإن كانت منقولة وجب تخميسها بعد إخراج السلب والمؤن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} أسهم الخمس عند الشافعية والحنابلة خمسة: سهم لله ولرسوله يصرف في الكراع والسلاح ومصالح المسلمين وأرزاق القضاة والعلماء، وسهم لذوي القربى من بني هاشم وبني المطلب ويستحقونه بالانتساب إلى الآباء ذكورا وإناثا غنيا وفقيرا عند الجمهور، وسهم لليتامى ويشترط عند المشهور أن يكونوا فقراء مسلمين، وسهم للمساكين، وسهم لابن السبيل؛ ويجب تعميم المستحقين بالعطاء إن وفى المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7859}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861} الحنفية يقسمون الخمس ثلاثة أسهم لليتامى والمساكين وابن السبيل، ويرون أن سهم الله والرسول سقط بموته، وسهم ذوي القربى بالنصرة ثم بالفقر؛ والمالكية يجعلونه موكولا إلى نظر الإمام؛ وطائفة تجعله ستة أسهم؛ وأبو العالية يجعل سهم الله ما يقبض عليه الإمام للكعبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7864} الفيء لا يخمس عند الحنفية والمالكية، والخرقي من الحنابلة والشافعية يخمسونه، والأخماس الأربعة للمرتزقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7865} السلب: إن استحقه القاتل لا يخمس عند جمهور الفقهاء، وعن ابن عباس والأوزاعي ومكحول أنه يخمس؛ والحنفية يخمسونه إلا أن ينفل به الإمام؛ وفي أثر البراء بن مالك أن عمر خمس سلبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} الركاز: المدفون في الأرض، والواجب فيه الخمس لحديث أبي هريرة، وتفصيله في الزكاة والركاز والمعدن والكنز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}'
  en: 'Khums is lexically a fifth; khammasa is to take a fifth; technically it is the fifth of spoil or booty, and takhmis is setting aside the fifth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} Related terms: mirba'' (the quarter taken by the chief in pre-Islamic raids), safi (what the chief chose for himself before division, including what the Prophet chose, such as a sword, a horse or a slave-girl), nashita (what a chief took before division) and fudul (remnants too small to divide among an army). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} Ruling: setting aside a fifth of spoil is obligatory by agreement, on the Quranic verse of the spoil; setting aside a fifth of fay'' is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} Property subject to the fifth: spoil taken from unbelievers by force; spoil was lawful to the Prophet\''s community, and four fifths went to the warriors and the fifth to its beneficiaries. If the spoil is land conquered by force the division is disputed; movable spoil is divided after the salab and expenses are deducted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} The Shafiis and Hanbalis give five shares: one for God and His Messenger (for horses, arms, the public good and the stipends of judges and scholars); one for the kin of Hashim and al-Muttalib (by descent, male and female, rich and poor by the majority); one for orphans (by the preferred view poor Muslims); one for the needy; one for the traveller; the beneficiaries must be generally given when enough is available. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7859}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861} The Hanafis divide the fifth into three shares for orphans, the needy and the traveller, holding that God\''s and the Messenger\''s share lapsed at the Prophet\''s death; the Malikis leave it to the Imam; some divide it into six; Abu al-Aliya gives God\''s share to the Kaaba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7864} Fay\'' is not divided into a fifth by the Hanafis and Malikis; the Shafiis and Khiraqi divide it, the four fifths going to the frontier soldiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7865} Spoil: if the slayer takes it, the majority do not divide it; al-Awza''i, Makhul and Ibn Abbas held that it is divided; the Hanafis divide it unless the Imam granted it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} Buried treasure: the fifth is due, on the report of Abu Hurayra; its details are under zakat, buried treasure, mine and hoard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}'
  ur: 'خمس لغت میں پانچ میں سے ایک حصہ ہے، اور اصطلاح میں مال غنیمت یا فے کا پانچواں حصہ، اور تخمیس اس پانچویں حصے کو الگ کرنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} متعلقہ الفاظ: مرباع ⁦(جاہلیت میں سردار کا غنیمت کا چوتھائی لینا)⁩، صفی ⁦(سردار کا تقسیم سے پہلے اپنے لیے چنا ہوا حصہ، جیسے نبی کا چنا ہوا تلوار، گھوڑا یا باندی)⁩، نشیطہ ⁦(تقسیم سے پہلے سردار کا لیا ہوا مال)⁩، فضول ⁦(غنیمت کا بچا ہوا ٹکڑا جو لشکر پر تقسیم نہ ہو سکے)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} حکم: مال غنیمت کا خمس نکالنا بالاتفاق واجب ہے، سورۂ انفال کی آیت کی بنا پر؛ فے کا خمس نکالنے میں فقہاء میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} وہ اموال جن کا خمس نکالا جائے: غنیمت، یعنی وہ مال جو مسلمان کفار سے زور سے لیں؛ غنائم امت محمدیہ کے لیے حلال ہوئیں، پھر چار حصے لڑنے والوں کے اور پانجواں حصہ خمس کے مستحقین کا ہوا؛ اگر غنیمت وہ زمین ہو جو طاقت سے فتح ہوئی تو اس کے خمس میں اختلاف ہے؛ منقولہ غنیمت میں سلب اور اخراجات کے بعد خمس نکالا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} شافعیہ اور حنابلہ کے نزدیک خمس کے پانچ حصے ہیں: ایک اللہ اور رسول کا ⁦(گھوڑوں، ہتھیاروں اور مسلمانوں کی مصلحتوں اور قاضیوں اور علماء کے وظائف میں خرچ)⁩، ایک ذوی القربیٰ بنو ہاشم اور بنو مطلب کا ⁦(نسب سے، مرد و عورت، غنی و فقیر جمہور کے نزدیک)⁩، ایک یتیموں کا ⁦(مشہور قول کے مطابق فقیر مسلمان)⁩، ایک مساکین کا، اور ایک ابن السبیل کا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7859}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861} حنفیہ خمس کو تین حصوں میں بانٹتے ہیں یعنی یتیم، مسکین اور ابن السبیل؛ اللہ اور رسول کا حصہ نبی کی وفات سے ساقط؛ مالکیہ امام کی صوابدید پر؛ بعض چھ حصے کرتے ہیں؛ ابو العالیہ اللہ کا حصہ کعبہ کو دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7862}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7863}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7864} فیء کا خمس حنفیہ اور مالکیہ کے نزدیک نہیں؛ شافعیہ اور خرقی خمس نکالتے ہیں، باقی چار حصے سرحدی جنگجوؤں کے لیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7865} سلب: قاتل کو مل جائے تو جمہور کے نزدیک خمس نہیں؛ اوزاعی، مکحول اور ابن عباس سے خمس منقول؛ حنفیہ امام کی عطا نہ ہو تو خمس نکالتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} رِکاز: اس میں خمس واجب ہے، ابو ہریرہ کی حدیث سے؛ تفصیل زکوٰۃ، رکاز، معدن اور کنز کے مصطلحات میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}'
  es: "Khums es léxicamente un quinto; khammasa es tomar un quinto; técnicamente es el quinto del botín o despojo, y takhmis es apartar el quinto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} Términos relacionados: mirba' (el cuarto tomado por el jefe en las incursiones preislámicas), safi (lo que el jefe escogió para sí mismo antes de la división, incluyendo lo que el Profeta escogió, como una espada, un caballo o una esclava), nashita (lo que un jefe tomó antes de la división) y fudul (restos demasiado pequeños para dividir entre un ejército). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} Dictamen: apartar un quinto del botín es obligatorio por acuerdo, en el versículo coránico del botín; El hecho de reservar una quinta parte de fay' es objeto de controversia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} Propiedad sujeta a la quinta parte: botín tomado de los incrédulos por la fuerza; el botín era lícito para la comunidad del Profeta, y cuatro quintas partes fueron para los guerreros y la quinta para sus beneficiarios. Si el botín es tierra conquistada por la fuerza, la división es objeto de controversia; el botín mueble se divide después del salab y se deducen los gastos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} Los shafiíes y los hanbalíes dan cinco partes: una para Dios y Su Mensajero (para caballos, armas, el bien público y los estipendios de jueces y eruditos); una para los parientes de Hashim y al-Muttalib (por descendencia, hombres y mujeres, ricos y pobres por mayoría); una para los huérfanos (por la opinión preferida, musulmanes pobres); una para los necesitados; una para el viajero; los beneficiarios deben recibir generalmente cuando haya suficiente disponible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7859}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861} Los hanafíes dividen la quinta parte en tres partes para los huérfanos, los necesitados y el viajero, sosteniendo que la parte de Dios y del Mensajero caducó con la muerte del Profeta; los malikíes la dejan al Imam; algunos la dividen en seis; Abu al-Aliya da la parte de Dios a la Kaaba. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7862}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7863}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7864} Fay' no está dividida en una quinta parte por los Hanafis y Malikis; los Shafiis y Khiraqi lo dividen, y las cuatro quintas partes van a parar a los soldados fronterizos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7865} Botín: si el asesino lo toma, la mayoría no lo divide; al-Awza'i, Makhul e Ibn Abbas sostuvieron que está dividido; los Hanafis lo dividen a menos que el Imam se lo conceda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} Tesoro enterrado: se debe entregar el quinto, según el informe de Abu Hurayra; sus detalles están bajo zakat, tesoro enterrado, mío y tesoro. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}"
  fr: "Lexicalement, « khums » signifie un cinquième; « khammasa » signifie prendre un cinquième; techniquement, il s’agit du cinquième du butin, et « takhmis » signifie mettre de côté le cinquième. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} Termes apparentés: « mirba’ » (le quart pris par le chef lors des raids préislamiques), « safi » (ce que le chef choisissait pour lui-même avant le partage, y compris ce que le Prophète choisissait, comme une épée, un cheval ou une esclave), « nashita » (ce qu’un chef prenait avant le partage) et « fudul » (les restes trop petits pour être partagés entre une armée). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} Décision: la mise de côté d’un cinquième du butin est obligatoire par consensus, conformément au verset coranique relatif au butin. La répartition du cinquième du fay' est sujette à controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} Biens soumis au cinquième: butin pris aux mécréants par la force; le butin était licite pour la communauté du Prophète, et les quatre cinquièmes revenaient aux guerriers et le cinquième à ses héritiers. Si le butin est constitué de terres conquises par la force, la répartition est controversée; le butin mobilier est partagé après déduction du salab et des dépenses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} Les écoles chaféite et hanbalite attribuent cinq parts: une pour Dieu et Son Messager (pour les chevaux, les armes, le bien public et les traitements des juges et des savants); une pour la famille de Hashim et d'al-Muttalib (par descendance, hommes et femmes, riches et pauvres, à la majorité); Une part est destinée aux orphelins (ou, selon l'avis privilégié, aux musulmans pauvres); une autre aux nécessiteux; et une dernière au voyageur. Ces parts doivent être distribuées en fonction des ressources disponibles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7859}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7860}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7861} Les hanafites divisent le cinquième en trois parts: une pour les orphelins, une pour les nécessiteux et une pour le voyageur, considérant que la part de Dieu et du Messager a été perdue à la mort du Prophète. Les malikites la lèguent à l'imam. Certains la divisent en six parts. Abou al-Aliya attribue la part de Dieu à la Kaaba. } Fay' n'est pas divisé en un cinquième par les Hanafis et les Malikis; les Shafiis et les Khiraqi se le partagent, les quatre cinquièmes revenant aux soldats frontaliers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7865} Butin: si le tueur le prend, la majorité ne le partage pas; al-Awza'i, Makhul et Ibn Abbas soutiennent qu'il est divisé; les Hanafis le divisent à moins que l'Imam ne l'accorde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} Trésor enfoui: le cinquième est dû, sur le rapport d'Abu Hurayra; ses détails sont sous zakat, trésor enfoui, mien et trésor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}"
  tr: "Dilsel olarak beş, beşlik beş parçadan oluşur, beşlik beşlik olarak kabul edilir; terminolojide beşli, ganimetin beşincisi veya fay, beşli ise ganimetten beşincinin çıkarılmasıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7856} İlgili terimler: al-murba' (İslam öncesi dönemde liderin aldığı ganimetlerin dörtte biri), al-Safi (başlının bölünmeden önce kendisi için seçtiği, İslam'da Peygamber'in seçtiği kılıç, at ve ümmet dahil), al-Nashita (bölme öncesi liderin aldığı şey) ve al-Fudul (ordu tarafından bölünmesi haklı gösterilmeyen ganimetlerin kalıntıları). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7857} Hükm: Allah'ın Enfal Suresi'nde belirttiği gibi, fıkıh-humis muamele ile zorunludur; fıkıhlar arasında fıkıh-humular konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7858} Serbest ganimet: Müslümanların kâfirlerden zorla aldığı savaş ganimetleri; ganimetler Peygamber ve onun ülkesi için geçerliydi, sonra beşte dördü ganimet, beşte biri hums halkı için olurdu; eğer ganimet toprak olup zorla açılmışsa, humları konusunda fark vardır. Taşınabilirse, ganimet ve erzak çıkarıldıktan sonra vergilendirilmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7858} Şafiiler ve Hanelilere göre beş pay beştir: Allah ve Elçisi için, toprak, silahlar, Müslümanların çıkarları ve hakimler ile alimlerin geçimleri için harcanan pay; Banu Haşim ve Banu el-Muttalib'den soy gereği hak eden akrabalar, hem erkek hem kadın, çoğunluğa göre zengin ve fakir; yetimler için bir pay, çoğunluğa göre fakir Müslüman olmalarını şart koşur; yoksullar için bir ok; ve bir yolcu için pay; ve servet yeterliyse hak edenlerin veriş ile genelleştirilmesi gerekir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7861} Hanafiler beş payı yetimler, muhtaçlar ve yolcular için üç paya bölerler. Allah ve Peygamber'in payını, onun ölümü nedeniyle kaybedilmiş sayılır, geçindirilecek akrabaların payı ve ardından yoksulluk olarak kabul edilir; Malikiler bunu İmam'ın görüşüne emanet eder; başka bir grup ise altı pay olarak görür; ve Ebu aliya Allah'ın payını İmam için Kabe olarak aldığı pay olarak görür. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.7861}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7862} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7863} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7864} fiqh-mawsua-kuwaitiyya-noor-v3 Hanafi ve Malikilere göre vergilendirilmez, Hanbali ve Şafii'lerden gelen Kharaqi bunun hums olduğunu ve dört khumun paralı askerler için olduğunu söyler. {cite:cit:fiqh-mawsua-kuwaitiyya-noor-v3 s.7865} Soygun: Katil hak ediyorsa, çoğu hukukçuya göre hums ödenmez. İbn Abbas'a göre, Al-Awza'i ve Makhool bunun hums olduğunu söyler; Hanafiler ise İmam bunu gönüllü bir eylem yapmadıkça yapar. Al-Bara' ibn Malik'in rivayetinde, Ömer humlardan mahrum bırakılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7866} Rekaz (yere gömülü) ve hums, Ebu Hureyre'nin hadisine göre zorunludur; bu hadis zekat, kaya, metal ve hazinede ayrıntılı olarak belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7867}"
  id: "Secara linguistik, lima adalah bagian dari lima bagian, dan kelima dianggap sebagai kelima, dan dalam terminologi, kelima adalah kelima dari rampasan atau fay, dan kelima adalah penghapusan seperlima dari rampasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7856} Istilah terkait: al-murba' (seperempat rampasan yang diambil pemimpin pada era pra-Islam), al-Safi (apa yang dipilih kepala sebelum pembagian, termasuk dalam Islam apa yang dipilih Nabi, seperti pedang, kuda, dan umat), al-Nashita (apa yang diambil kepala sebelum pembagian), dan al-Fudul (sisa rampasan yang pembagian tidak dibenarkan oleh tentara). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7856} {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7857} Putusan: Fiqh-khumis wajib berdasarkan konsensus seperti yang dikatakan Allah dalam Surah Al-Anfal; ada perbedaan pendapat di antara para ahli hukum mengenai fiqh-khumi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7858} Rampasan yang longgar: rampasan perang, yang dipaksa diambil Muslim dari kafir; rampasan itu sah bagi Nabi dan bangsanya, lalu empat per lima menjadi rampasan dan seperlima untuk rakyat khum; jika rampasan itu tanah dan dibuka secara paksa, maka ada perbedaan mengenai khum mereka. Jika barang itu bergerak, harus dikenakan pajak setelah barang rampasan dan persediaan diambil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7858} Lima bagian menurut syafi'i dan Hanbalis adalah lima: bagian untuk Allah dan Rasul-Nya, dibelanjakan untuk tanah, senjata, kepentingan umat Islam, dan nafkah hakim serta ulama; bagian untuk kerabat dari Banu Hashim dan Banu al-Muttalib yang layak mendapatkannya berdasarkan garis keturunan leluhur mereka, baik laki-laki maupun perempuan, kaya dan miskin menurut mayoritas; bagian untuk anak yatim, yang menurut mayoritas mensyaratkan mereka Muslim miskin; anak panah untuk yang membutuhkan; dan bagian untuk pengembara; dan perlu menggeneralisasi yang layak dengan memberi jika kekayaan cukup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7861} Hanafi membagi lima bagian tersebut menjadi tiga bagian: anak yatim, yang membutuhkan, dan seorang pengembara. Mereka menganggap bagian Allah dan Rasul hilang karena kematiannya, bagian keluarga yang harus dihidupi lalu kemiskinan; orang Malik menganggapnya dipercayakan kepada pandangan Imam; kelompok lain menganggapnya enam bagian; dan Abu al-'Aliyah menganggap bagian Allah adalah apa yang diambil Imam untuk Ka'bah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7862} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7863} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7864} Fiqh-mawsua-kuwaitiyya-noor-v3 tidak dikenakan pajak menurut Hanafi dan Maliki, Kharaqi dari Hanbalis dan Shafi'i mengatakan itu khum, dan empat khum untuk tentara bayaran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7865} Perampokan: Jika pembunuh pantas mendapatkannya, khums tidak dibayar sesuai dengan mayoritas ahli hukum. Menurut Ibn Abbas, Al-Awza'i, dan Makhool mengatakan itu adalah khum; kaum Hanafi melakukannya kecuali Imam menjadikannya tindakan sukarela. Dalam riwayat Al-Bara' ibn Malik, Umar dicabut khum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7866} Rakaz: dikubur di tanah, dan khums adalah wajib menurut hadits Abu Huraira, yang dirinci dalam zakat, batu, logam, dan harta karun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7867}"
