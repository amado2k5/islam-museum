id: concept/khums-fiqh
class: concept
kind: term
label:
  ar: الخمس (في الغنيمة)
  en: Khums (the fifth of spoil)
  ur: خمس (غنیمت کا پانچواں حصہ)
summary:
  ar: 'الخُمس لغة جزء من خمسة أجزاء، وخمّسه أخذ خمسه، والخمس في الاصطلاح خمس الغنيمة أو الفيء، والتخميس إخراج الخمس من الغنيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} الألفاظ ذات الصلة: المرباع (ربع الغنيمة الذي يأخذه الرئيس في الجاهلية)، والصفي (ما يصطفيه الرئيس لنفسه قبل القسمة، ومنه في الإسلام ما اصطفاه النبي كالسيف والفرس والأمة)، والنشيطة (ما يأخذه الرئيس قبل القسمة)، والفضول (بقايا الغنيمة التي لا تستقيم قسمتها على الجيش). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} الحكم: تخميس الغنيمة واجب بالاتفاق بقوله تعالى في سورة الأنفال؛ والتخميس في الفيء خلاف بين الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} الأموال التي تخمس: الغنيمة، وهي ما يأخذه المسلمون من الكفار بالقوة؛ وكانت الغنائم حلالا للنبي وأمته، ثم صار أربعة أخماسها للغانمين والخمس لأهل الخمس؛ والغنيمة إن كانت أرضا فتحت عنوة ففي تخميسها خلاف. وإن كانت منقولة وجب تخميسها بعد إخراج السلب والمؤن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858}'
  en: 'Khums is lexically a fifth; khammasa is to take a fifth; technically it is the fifth of spoil or booty, and takhmis is setting aside the fifth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} Related terms: mirba'' (the quarter taken by the chief in pre-Islamic raids), safi (what the chief chose for himself before division, including what the Prophet chose, such as a sword, a horse or a slave-girl), nashita (what a chief took before division) and fudul (remnants too small to divide among an army). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} Ruling: setting aside a fifth of spoil is obligatory by agreement, on the Quranic verse of the spoil; setting aside a fifth of fay'' is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} Property subject to the fifth: spoil taken from unbelievers by force; spoil was lawful to the Prophet\''s community, and four fifths went to the warriors and the fifth to its beneficiaries. If the spoil is land conquered by force the division is disputed; movable spoil is divided after the salab and expenses are deducted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858}'
  ur: 'خمس لغت میں پانچ میں سے ایک حصہ ہے، اور اصطلاح میں مال غنیمت یا فے کا پانچواں حصہ، اور تخمیس اس پانچویں حصے کو الگ کرنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856} متعلقہ الفاظ: مرباع (جاہلیت میں سردار کا غنیمت کا چوتھائی لینا)، صفی (سردار کا تقسیم سے پہلے اپنے لیے چنا ہوا حصہ، جیسے نبی کا چنا ہوا تلوار، گھوڑا یا باندی)، نشیطہ (تقسیم سے پہلے سردار کا لیا ہوا مال)، فضول (غنیمت کا بچا ہوا ٹکڑا جو لشکر پر تقسیم نہ ہو سکے)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7856}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857} حکم: مال غنیمت کا خمس نکالنا بالاتفاق واجب ہے، سورۂ انفال کی آیت کی بنا پر؛ فے کا خمس نکالنے میں فقہاء میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7857}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858} وہ اموال جن کا خمس نکالا جائے: غنیمت، یعنی وہ مال جو مسلمان کفار سے زور سے لیں؛ غنائم امت محمدیہ کے لیے حلال ہوئیں، پھر چار حصے لڑنے والوں کے اور پانجواں حصہ خمس کے مستحقین کا ہوا؛ اگر غنیمت وہ زمین ہو جو طاقت سے فتح ہوئی تو اس کے خمس میں اختلاف ہے؛ منقولہ غنیمت میں سلب اور اخراجات کے بعد خمس نکالا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7858}'
