id: concept/istiqama
class: concept
kind: doctrine
label:
  ar: الاستقامة
  en: Istiqama (steadfast uprightness)
  es: "Istiqama (rectitud inquebrantable)"
  fr: "Istiqama (droiture inébranlable)"
  ur: "استقامت ⁦(ثابت قدمی)⁩"
summary:
  ar: "الثبات على الإيمان والطاعة بعد قول «آمنت بالله»؛ جاء في حديث سفيان بن عبد الله الثقفي أنه سأل النبي قولاً جامعاً في الإسلام لا يسأل عنه أحداً بعده فقال «قل آمنت بالله ثم استقم» وفي رواية «قل ربي الله ثم استقم»، ومعناه عند ابن رجب منتزع من قوله تعالى في فصلت «إن الذين قالوا ربنا الله ثم استقاموا» وفي الأحقاف؛ وفسر أبو بكر «ثم استقاموا» بثلاثة معان مأثورة عنه: لم يشركوا بالله شيئاً، ولم يلتفتوا إلى إله غيره، واستقاموا على أن الله ربهم؛ وفي رواية النسائي عن أنس مرفوعاً بإسناد ضعيف «قد قالها الناس ثم كفر أكثرهم فمن مات عليها فهو من أهل الاستقامة»؛ وفي تتمة الحديث عند الترمذي والنسائي أنه لما سأل «ما أخوف ما تخاف علي؟» و«فما أتقي؟» أخذ النبي بلسانه وقال «هذا» وأومأ إلى لسانه، فكان حفظ اللسان من أعظم ما تتقيه الاستقامة. ويورد باب الاستقامة في رياض الصالحين آيات «فاستقم كما أمرت» و«إن الذين قالوا ربنا الله ثم استقاموا»، وحديث سفيان بن عبد الله الثقفي «قل آمنت بالله ثم استقم» رواه مسلم {cite:riyad-salihin p.34}، وحديث أبي هريرة «قاربوا وسددوا واعلموا أنه لن ينجو أحدكم بعمله» وفيه أنه قال «ولا أنا إلا أن يتغمدني الله برحمة منه وفضل» {cite:riyad-salihin p.34}؛ ويقول العلماء بعدها إن معنى الاستقامة لزوم طاعة الله تعالى وإنها من جوامع الكلم {cite:riyad-salihin p.35}"
  en: "Standing firm upon faith and obedience after the words 'I believe in God'; in Sufyan ibn Abdullah al-Thaqafi's hadith he asked the Prophet for comprehensive words of Islam he would not need to ask anyone after him about and was answered 'say: I believe in God, then stand firm' — one route 'say: my Lord is God, then stand firm' — its meaning for Ibn Rajab drawn from 'those who say our Lord is God then stand firm' in Fussilat and al-Ahqaf; Abu Bakr is reported glossing 'then stood firm' three ways: 'they associated nothing with God', 'they did not turn to a god other than Him', and 'they stood firm that God is their Lord'; a weak al-Nasa'i route through Anas adds 'people have said it then most of them disbelieved, and whoever dies upon it is of the people of istiqama'; and in the hadith's continuation in al-Tirmidhi and al-Nasa'i, when he asked 'what do you most fear for me?' and 'what shall I guard against?', the Prophet took hold of his own tongue — 'this' — or gestured to it, making guarding the tongue among the greatest things istiqama watches. The chapter on istiqama in Riyad al-Salihin cites the verses 'so stand firm as you are commanded' and 'those who say our Lord is God then stand firm', with Sufyan ibn Abdullah al-Thaqafi's hadith 'say: I believe in God, then stand firm' related by Muslim {cite:riyad-salihin p.34}, and Abu Hurayra's 'draw near and be upright, and know that none of you will be saved by his deed' — in which he said 'not even I, except that God envelops me in mercy and bounty' {cite:riyad-salihin p.34}; the scholars then gloss istiqama as cleaving to God's obedience and count it among the comprehensive words {cite:riyad-salihin p.35}"
  es: "Mantenerse firmes en la fe y la obediencia después de las palabras 'Creo en Dios'; en el hadiz de Sufyan ibn Abdullah al-Thaqafi, le pidió al Profeta palabras completas del Islam sobre las que no necesitaría preguntar a nadie después de él y se le respondió 'di: Creo en Dios, luego mantente firme' — una ruta 'di: Mi Señor es Dios, luego mantente firme' — su significado para Ibn Rajab se extrajo de 'aquellos que dicen que nuestro Señor es Dios, luego se mantienen firmes' en Fussilat y al-Ahqaf; se informa que Abu Bakr glosó 'luego se mantuvieron firmes' de tres maneras: 'no asociaron nada con Dios', 'no se volvieron a un dios que no fuera Él', y 'se mantuvieron firmes en que Dios es su Señor'; una ruta débil de al-Nasa'i a través de Anas agrega 'la gente lo ha dicho, luego la mayoría de ellos no creyó, y quien muere por ello es de la gente de istiqama'; y en la continuación del hadiz en al-Tirmidhi y al-Nasa'i, cuando preguntó '¿qué es lo que más teméis por mí?' y '¿de qué debo protegerme?', el Profeta se agarró la lengua —'esto'— o hizo un gesto hacia ella, haciendo que proteger la lengua sea una de las cosas más importantes que vigila el istiqama. El capítulo sobre istiqama en Riyad al-Salihin cita los versículos «manténganse firmes como se les ordena» y «quienes dicen que nuestro Señor es Dios, entonces manténganse firmes», con el hadiz de Sufyan ibn Abdullah al-Thaqafi «di: creo en Dios, entonces mantente firme», relatado por Muslim {cite:riyad-salihin p.34}, y el de Abu Hurayra «acérquense y sean rectos, y sepan que ninguno de ustedes se salvará por sus obras», en el que dijo «ni siquiera yo, excepto que Dios me envuelve en misericordia y generosidad» {cite:riyad-salihin p.34}; los eruditos luego interpretan istiqama como aferrarse a la obediencia a Dios y la incluyen entre las palabras que abarcan {cite:riyad-salihin p.35}."
  fr: "Rester ferme dans la foi et l'obéissance après avoir prononcé les mots « Je crois en Dieu »; dans le hadith de Sufyan ibn Abdullah al-Thaqafi, il demanda au Prophète des paroles complètes de l'Islam sur lesquelles il n'aurait besoin de se référer après lui, et il lui fut répondu: « Dis: Je crois en Dieu, puis reste ferme » — une interprétation possible: « Dis: Mon Seigneur est Dieu, puis reste ferme » — dont le sens pour Ibn Rajab est tiré de « ceux qui disent que notre Seigneur est Dieu, puis restent fermes » dans Fussilat et al-Ahqaf; Abu Bakr aurait interprété « puis sont restés fermes » de trois manières: « ils n'ont rien associé à Dieu », « ils ne se sont pas tournés vers un autre dieu que Lui », et « ils sont restés fermes sur le fait que Dieu est leur Seigneur »; une interprétation faible d'al-Nasa'i par Anas ajoute: « les gens l'ont dit, puis la plupart d'entre eux ont mécru, et quiconque meurt en le prononçant est du nombre des gens de l'istiqama »; et dans la suite du hadith rapportée par al-Tirmidhi et al-Nasa'i, lorsqu'il demanda « qu'est-ce que vous craignez le plus pour moi ? » et « de quoi dois-je me prémunir ? », le Prophète prit sa propre langue — « ceci » — ou la désigna du doigt, faisant ainsi de la protection de la langue l'une des choses les plus importantes que l'istiqama surveille. Le chapitre sur l'istiqama dans Riyad al-Salihin cite les versets « Tenez-vous fermes, comme il vous a été ordonné » et « Ceux qui disent: Notre Seigneur est Dieu, tenez-vous fermes », ainsi que le hadith de Sufyan ibn Abdullah al-Thaqafi « Dis: Je crois en Dieu, puis tiens-toi ferme », rapporté par Muslim (Riyad al-Salihin, p. 34), et celui d'Abu Hurayra: « Approchez-vous et soyez droits, et sachez que nul d'entre vous ne sera sauvé par ses actes », où il dit: « Pas même moi, si ce n'est que Dieu m'enveloppe de miséricorde et de générosité » (Riyad al-Salihin, p. 34). Les savants interprètent ensuite l'istiqama comme l'attachement à l'obéissance à Dieu et la comptent parmi les termes englobants (Riyad al-Salihin, p. 35)."
  ur: "'میں خدا پر یقین رکھتا ہوں' کے الفاظ کے بعد ایمان اور اطاعت پر ثابت قدم رہنا؛ سفیان بن عبداللہ ثقفی کی حدیث میں ہے کہ انہوں نے رسول اللہ سے اسلام کے جامع الفاظ کے بارے میں پوچھا کہ آپ کے بعد کسی سے پوچھنے کی ضرورت نہیں ہے اور جواب دیا گیا کہ میں اللہ پر ایمان لاؤں، پھر ثابت قدم رہوں - ایک راستہ 'کہو: میرا رب اللہ ہے، پھر ثابت قدم رہو' - اس کا مطلب ابن رجب سے اخذ کیا گیا ہے 'جو لوگ اللہ کو کہتے ہیں اور پھر ثابت قدم رہو'۔ ابوبکر کے بارے میں بیان کیا جاتا ہے کہ وہ تین طریقوں سے 'پھر ثابت قدم رہے': 'انہوں نے خدا کے ساتھ کسی چیز کو شریک نہیں کیا'، 'وہ اس کے سوا کسی معبود کی طرف متوجہ نہیں ہوئے'، اور 'وہ ثابت قدم رہے کہ اللہ ان کا رب ہے'۔ نسائی کا ضعیف راستہ انس کے ذریعے کہتے ہیں کہ لوگوں نے اسے کہا تو ان میں سے اکثر نے کفر کیا اور جو اس پر مرے وہ اہل استقامت میں سے ہے۔ اور ترمذی اور النسائی میں حدیث کے تسلسل میں جب اس نے پوچھا کہ تم مجھ سے سب سے زیادہ کس چیز سے ڈرتے ہو؟ اور 'میں کس چیز سے بچوں؟'، نبی نے اپنی زبان کو پکڑ لیا - 'یہ' - یا اس کی طرف اشارہ کرتے ہوئے، زبان کی حفاظت کو استقامت کی گھڑیوں میں سب سے بڑی چیز قرار دیا۔ ریاض الصالحین میں استقامت کے باب میں آیات کا حوالہ دیا گیا ہے 'پس ثابت قدم رہو جیسا کہ تمہیں حکم دیا گیا ہے' اور 'وہ لوگ جو کہتے ہیں کہ ہمارا رب اللہ ہے تو ثابت قدم رہو'، سفیان بن عبداللہ ثقفی کی حدیث 'کہو: میں خدا پر ایمان لاتا ہوں، پھر ثابت قدم رہو' کا حوالہ مسلم نے روایت کیا ہے۔ سیدھے رہو، اور جان لو کہ تم میں سے کوئی بھی اس کے عمل سے نجات نہیں پائے گا - جس میں اس نے کہا 'میں بھی نہیں، سوائے اس کے کہ خدا مجھے اپنی رحمت اور فضل سے ڈھانپ لے'۔ اس کے بعد علماء استقامت کو خدا کی فرمانبرداری سے جڑے ہوئے قرار دیتے ہیں اور اسے جامع الفاظ میں شمار کرتے ہیں {حوالہ: ریاض صالحین صفحہ 35}"
