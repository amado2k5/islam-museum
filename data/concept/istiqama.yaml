id: concept/istiqama
class: concept
kind: doctrine
label:
  ar: الاستقامة
  en: Istiqama (steadfast uprightness)
summary:
  ar: "الثبات على الإيمان والطاعة بعد قول «آمنت بالله»؛ جاء في حديث سفيان بن عبد الله الثقفي أنه سأل النبي قولاً جامعاً في الإسلام لا يسأل عنه أحداً بعده فقال «قل آمنت بالله ثم استقم» وفي رواية «قل ربي الله ثم استقم»، ومعناه عند ابن رجب منتزع من قوله تعالى في فصلت «إن الذين قالوا ربنا الله ثم استقاموا» وفي الأحقاف؛ وفسر أبو بكر «ثم استقاموا» بثلاثة معان مأثورة عنه: لم يشركوا بالله شيئاً، ولم يلتفتوا إلى إله غيره، واستقاموا على أن الله ربهم؛ وفي رواية النسائي عن أنس مرفوعاً بإسناد ضعيف «قد قالها الناس ثم كفر أكثرهم فمن مات عليها فهو من أهل الاستقامة»؛ وفي تتمة الحديث عند الترمذي والنسائي أنه لما سأل «ما أخوف ما تخاف علي؟» و«فما أتقي؟» أخذ النبي بلسانه وقال «هذا» وأومأ إلى لسانه، فكان حفظ اللسان من أعظم ما تتقيه الاستقامة."
  en: "Standing firm upon faith and obedience after the words 'I believe in God'; in Sufyan ibn Abdullah al-Thaqafi's hadith he asked the Prophet for comprehensive words of Islam he would not need to ask anyone after him about and was answered 'say: I believe in God, then stand firm' — one route 'say: my Lord is God, then stand firm' — its meaning for Ibn Rajab drawn from 'those who say our Lord is God then stand firm' in Fussilat and al-Ahqaf; Abu Bakr is reported glossing 'then stood firm' three ways: 'they associated nothing with God', 'they did not turn to a god other than Him', and 'they stood firm that God is their Lord'; a weak al-Nasa'i route through Anas adds 'people have said it then most of them disbelieved, and whoever dies upon it is of the people of istiqama'; and in the hadith's continuation in al-Tirmidhi and al-Nasa'i, when he asked 'what do you most fear for me?' and 'what shall I guard against?', the Prophet took hold of his own tongue — 'this' — or gestured to it, making guarding the tongue among the greatest things istiqama watches."
