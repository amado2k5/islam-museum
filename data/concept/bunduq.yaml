  ar: "بندق"
  en: "Bunduq (hazelnut)"
  fr: "Bunduq (noisette)"
  ur: "بندق ⁦(ہیزل نٹ)⁩"
  es: "Bunduq (avellana)"
summary:
  ar: "معروف، أرضيته أكثر من أرضية الجوز، وهو أغذى من الجوز لكنه أبطأ انهضاماً، قابض، يولّد المرار والرياح، ويُؤكل مع ماء العسل للسعال المزمن، وقشره قابض يعقل البطن {cite:canon-ibn-sina-print-v1 p.406}."
  en: "A known nut, richer in earth than the walnut and more nourishing, but slower to digest. It is astringent, produces bile and wind, is eaten with honey water for chronic cough, and its shell binds the bowel {cite:canon-ibn-sina-print-v1 p.406}."
  fr: "Fruit connu, plus terreux et nourrissant que la noix mais plus lent à digérer. Astringent, il produit bile et vents ; mangé avec eau miellée contre la toux chronique. Sa coque resserrerait l’intestin {cite:canon-ibn-sina-print-v1 p.406}."
  ur: "ایک معروف میوہ، جس کی زمین جوز سے زیادہ ہے اور یہ جوز سے زیادہ غذائیت والا ہے، مگر ہضم میں دیر لیتا ہے۔ یہ قابض ہے، صفرا اور ہوا پیدا کرتا ہے، پرانی کھانسی میں شہد کے پانی کے ساتھ کھایا جاتا ہے، اور اس کا چھلکا پیٹ کو باندھتا ہے {cite:canon-ibn-sina-print-v1 p.406}۔"
  es: "Un fruto seco conocido, más rico en tierra que la nuez y más nutritivo, pero de digestión más lenta. Es astringente, produce bilis y gases, se consume con agua de miel para la tos crónica y su cáscara ayuda a estreñir {cite:canon-ibn-sina-print-v1 p.406}."
