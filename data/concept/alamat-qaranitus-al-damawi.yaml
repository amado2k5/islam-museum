label:
  ar: "علامات قرانيطس الدموي"
  en: "Signs of the sanguine qaranitus"
  fr: "Signes du qaranitus sanguin"
  ur: "خونی قرانیطس کی علامات"
  es: "Signos del qaranitus sanguíneo"
  tr: "Kan Curraniti Belirtileri"
  id: "Gejala Curranitis Darah"
summary:
  ar: "يذكر ابن سينا علامات السرسام الحقيقي الكائن عن الدم: أن عوارضه المشتركة تعرض مع الضحك، وقطرات الرعاف، وعظم النفس، وما يخص اللسان والخيالات وعروق الوجه والعين {cite:canon-ibn-sina-print-v2 p.79}"
  en: "Ibn Sina gives the signs of the true sarsam from blood: that its common symptoms come with laughter, with drops of nosebleed and a large breath, and what is particular to the tongue, the fancies, and the vessels of the face and eye {cite:canon-ibn-sina-print-v2 p.79}"
  fr: "Ibn Sina donne les signes du véritable sarsam dû au sang : les symptômes communs s’accompagnent de rires, de quelques gouttes de sang du nez et d’une respiration ample. Il décrit aussi les signes propres à la langue, aux visions et aux vaisseaux du visage et de l’œil. {cite:canon-ibn-sina-print-v2 p.79}"
  ur: "ابن سینا خون سے ہونے والے حقیقی سرسام کی علامات بتاتا ہے: اس کے مشترک عوارض ہنسی کے ساتھ آتے ہیں، نکسیر کے قطرے اور بڑا سانس، اور جو زبان، خیالات اور چہرے اور آنکھ کی رگوں سے خاص ہے {cite:canon-ibn-sina-print-v2 p.79}۔"
  es: "Ibn Sina da los signos del verdadero sarsam de sangre: que sus síntomas comunes vienen con risa, con gotas de sangrado nasal y una respiración profunda, y lo que es particular de la lengua, los ojos y los vasos de la cara y los ojos {cite:canon-ibn-sina-print-v2 p.79}"
  tr: "İbn Sina, kandan oluşan gerçek hırlamanın belirtilerinden bahseder: yaygın belirtilerinde kahkaha, kanama damlaları, nefes kemiği ve dil, balgam, yüz ve göz damarlarıyla ilgili şeyler bulunur {atıf:kanon-ibn-sina-print-v2 s.79}"
  id: "Ibn Sina menyebutkan tanda-tanda desisan darah yang nyata: gejala umum termasuk tawa, tetesan pendarahan, hal-hal yang berkaitan dengan tulang angin dan lidah, dahak, serta pembuluh darah di wajah dan mata {kutipan: kanon-ibn-sina-print-v2 hlm.79}"
