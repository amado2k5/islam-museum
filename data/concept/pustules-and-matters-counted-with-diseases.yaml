id: concept/pustules-and-matters-counted-with-diseases
class: concept
kind: scientific
label: { ar: "البثور وما يعد مع الأمراض عند ابن سينا", en: "Pustules and the matters counted with diseases in the Canon", ur: "قانون میں پھنسیاں اور بیماریوں کے ساتھ گنی جانے والی باتیں", es: "Las pústulas y los asuntos considerados enfermedades en el canon.", fr: "Les pustules et les matières considérées comme des maladies dans le canon" }
summary:
  ar: "يقسم ابن سينا البثور على عدد الأورام: دموية وصفراوية ومختلطة ومائية وريحية، ثم يذكر في الفصل السادس ما يعد مع الأمراض وليس منها: آفات الشعر واللون والرائحة والسحنة {cite:canon-ibn-sina-print-v1 p.109}."
  en: "Ibn Sina divides pustules by the same count as tumours, sanguine, bilious, mixed, watery and windy, then in the sixth chapter lists what is counted with diseases though not itself a disease: the afflictions of hair, colour, odour and bodily habit {cite:canon-ibn-sina-print-v1 p.109}."
  es: "Ibn Sina divide las pústulas con el mismo número que los tumores, sanguíneas, biliares, mixtas, acuosas y flatulentas, y luego en el sexto capítulo enumera lo que se cuenta entre las enfermedades aunque no sea una enfermedad en sí misma: las afecciones del cabello, el color, el olor y el hábito corporal {cite:canon-ibn-sina-print-v1 p.109}."
  fr: "Ibn Sina divise les pustules selon le même nombre que les tumeurs: sanguines, bilieuses, mixtes, aqueuses et gazeuses, puis, dans le sixième chapitre, énumère ce qui est compté parmi les maladies bien que n'étant pas une maladie en soi: les affections des cheveux, de la couleur, de l'odeur et des habitudes corporelles {cite:canon-ibn-sina-print-v1 p.109}."
  ur: "ابن سینا نے آبلوں کو ایک ہی شمار کے حساب سے تقسیم کیا ہے جیسے رسولی، زہریلے، بلیئس، مخلوط، پانی دار اور ہوا دار، پھر چھٹے باب میں ان چیزوں کی فہرست دی ہے جو بیماریوں میں شمار ہوتی ہیں حالانکہ وہ خود ایک بیماری نہیں ہیں: بالوں، رنگ، بدبو اور جسمانی عادتوں کی تکلیفیں"
