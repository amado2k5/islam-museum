summary:
  ar: "يقسم ابن سينا البثور على عدد الأورام: دموية وصفراوية ومختلطة ومائية وريحية، ثم يذكر في الفصل السادس ما يعد مع الأمراض وليس منها: آفات الشعر واللون والرائحة والسحنة {cite:canon-ibn-sina-print-v1 p.109}."
  en: "Ibn Sina divides pustules by the same count as tumours, sanguine, bilious, mixed, watery and windy, then in the sixth chapter lists what is counted with diseases though not itself a disease: the afflictions of hair, colour, odour and bodily habit {cite:canon-ibn-sina-print-v1 p.109}."
