summary:
  ar: "يذكر ابن سينا أن لون البول في الأمراض الحادة المحرقة يضرب إلى الزعفرانية والنارية، وأن اشتداد الصفرة يدل على ازدياد الحرارة وازدياد الصفاء على نقصانها، ويفصل في البول الدموي والغزير والرقيق قبل البحران {cite:canon-ibn-sina-print-v1 p.185}."
  en: "Ibn Sina says that in acute burning diseases the colour of urine leans toward saffron and fire, that deepening yellow shows rising heat and increasing clearness shows falling heat, and he treats blood-like, abundant and thin urine before the crisis {cite:canon-ibn-sina-print-v1 p.185}."
