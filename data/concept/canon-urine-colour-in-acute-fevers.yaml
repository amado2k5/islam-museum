id: concept/canon-urine-colour-in-acute-fevers
class: concept
kind: scientific
label: { ar: "لون البول في الحميات الحادة عند ابن سينا", en: "The colour of urine in acute fevers in the Canon", ur: "تیز بخاروں میں پیشاب کا رنگ قانون میں", es: "El color de la orina en fiebres agudas en el Canon", fr: "La couleur de l'urine lors de fièvres aiguës dans le Canon", tr: "İbn Sina'ya göre akut diyetlerde idrar rengi", id: "Warna urin dalam diet akut menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا أن لون البول في الأمراض الحادة المحرقة يضرب إلى الزعفرانية والنارية، وأن اشتداد الصفرة يدل على ازدياد الحرارة وازدياد الصفاء على نقصانها، ويفصل في البول الدموي والغزير والرقيق قبل البحران {cite:canon-ibn-sina-print-v1 p.185}."
  en: "Ibn Sina says that in acute burning diseases the colour of urine leans toward saffron and fire, that deepening yellow shows rising heat and increasing clearness shows falling heat, and he treats blood-like, abundant and thin urine before the crisis {cite:canon-ibn-sina-print-v1 p.185}."
  es: "Ibn Sina dice que en las enfermedades agudas con sensación de ardor el color de la orina tiende al azafrán y al fuego, que un amarillo más intenso muestra un aumento del calor y una mayor claridad muestra un descenso del calor, y trata la orina abundante, líquida y parecida a la sangre antes de la crisis {cite:canon-ibn-sina-print-v1 p.185}."
  fr: "Ibn Sina dit que dans les maladies brûlantes aiguës, la couleur de l'urine tend vers le safran et le feu, que le jaune plus foncé indique une chaleur montante et que la clarté croissante indique une chaleur descendante, et il traite l'urine sanglante, abondante et fluide avant la crise {cite:canon-ibn-sina-print-v1 p.185}."
  ur: "ابن سینا کہتے ہیں کہ شدید جلنے والی بیماریوں میں پیشاب کا رنگ زعفران اور آگ کی طرف جھکتا ہے، یہ کہ گہرا زرد بڑھتا ہوا گرمی کو ظاہر کرتا ہے اور شفافیت میں اضافہ گرتی ہوئی گرمی کو ظاہر کرتا ہے، اور وہ بحران سے پہلے خون کی طرح، بکثرت اور پتلے پیشاب کا علاج کرتا ہے۔"
  tr: "İbn Sina, akut yanık hastalıklarında idrarın renginin safrandan ateşli idrara kadar değiştiğini ve sarı rengin yoğunluğunun azalmış değil, artan ısı ve artan berraklığı gösterdiğini belirtir. Krizden önce kanlı, bol ve ince idrarda ayırt edilir {atıf:kanon-ibn-sina-print-v1 s.185}."
  id: "Ibn Sina menyebutkan bahwa warna urin pada penyakit terbakar akut berkisar dari saffron hingga urin yang menyala, dan intensitas kuning menunjukkan peningkatan panas dan peningkatan kejernihan, bukan menurun. Urine ini dibedakan pada urine berdarah, melimpah, dan tipis sebelum krisis {cite:canon-ibn-sina-print-v1 hlm.185}."
