id: concept/back-and-abdominal-muscles
class: concept
kind: scientific
label:
  ar: "عضل الصلب والبطن عند ابن سينا"
  en: "Muscles of the back and abdomen in the Canon"
  fr: "Les muscles du dos et de l’abdomen"
  ur: "قانون میں پشت اور پیٹ کے پٹھے"
  es: "Músculos de la espalda y el abdomen en el Canon"
  tr: "İbn Sina'da skleroz ve karın kası"
  id: "Sklerosis dan otot perut pada Ibn Sina"
summary:
  ar: "يقسّم ابن سينا عضل الصلب إلى ما يثنيه إلى خلف وما يحنيه إلى قدام، ويجعل عضل البطن ثمانية تشترك في منافع {cite:canon-ibn-sina-print-v1 p.72} {cite:canon-ibn-sina-print-v1 p.73}."
  en: "Ibn Sina divides the muscles of the back into those that bend it backward and those that bow it forward, and gives the abdomen eight muscles with shared uses {cite:canon-ibn-sina-print-v1 p.72} {cite:canon-ibn-sina-print-v1 p.73}."
  fr: "Ibn Sina distingue les muscles du dos qui le fléchissent vers l’arrière de ceux qui l’inclinent vers l’avant ; il attribue à l’abdomen huit muscles aux fonctions communes {cite:canon-ibn-sina-print-v1 p.72} {cite:canon-ibn-sina-print-v1 p.73}."
  es: "Ibn Sina divide los músculos de la espalda en aquellos que la doblan hacia atrás y aquellos que la arquean hacia adelante, y da al abdomen ocho músculos con funciones compartidas {cite:canon-ibn-sina-print-v1 p.72} {cite:canon-ibn-sina-print-v1 p.73}."
  ur: "ابن سینا پیٹھ کے پٹھوں کو ان حصوں میں تقسیم کرتا ہے جو اسے پیچھے کی طرف موڑتے ہیں اور جو اسے آگے جھکتے ہیں، اور مشترکہ استعمال کے ساتھ پیٹ کو آٹھ عضلات دیتا ہے"
  tr: "İbn Sina, sert kası geriye doğru bükenle öne doğru büken olarak ayırır; böylece karın kasını sekiz olarak yapar ve bu kası şu faydaları paylaşır {cite:canon-ibn-sina-print-v1 s.72} {cite:canon-ibn-sina-print-v1 s.73}."
  id: "Ibn Sina membagi otot kaku menjadi apa yang membengkokkannya ke belakang dan apa yang membengkokkannya ke depan, menjadikan otot perut delapan yang berbagi manfaat {cite:canon-ibn-sina-print-v1 hlm.72} {cite:canon-ibn-sina-print-v1 hlm.73}."
