summary:
  ar: "يعدد ابن سينا أسباب التحلل والتعفن: من خارج الهواء المحلل والمعفن، ومن داخل الحرارة الغريزية المحللة لرطوباتنا والحرارة الغريبة المتولدة عن الأغذية المتعفنة، وكلها تتعاون على تجفيفنا، وهذا الجفاف ضروري لا بد منه {cite:canon-ibn-sina-print-v1 p.201}."
  en: "Ibn Sina lists the causes of dissolving and rotting: from outside, air that dissolves and putrefies, and from inside, the innate heat that dissolves our moistures and the foreign heat generated from putrefying food, all working together to dry us, a drying that is necessary and unavoidable {cite:canon-ibn-sina-print-v1 p.201}."
