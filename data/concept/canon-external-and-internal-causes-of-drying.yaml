id: concept/canon-external-and-internal-causes-of-drying
class: concept
kind: scientific
label:
  ar: "أسباب التجفيف الخارجة والباطنة"
  en: "External and internal causes of drying"
  fr: "Causes externes et internes de dessiccation"
  ur: "خشک کرنے والے بیرونی اور اندرونی اسباب"
  es: "Causas externas e internas de la desecación"
  tr: "Dış ve iç kurutmanın nedenleri"
  id: "Penyebab pengeringan eksternal dan internal"
summary:
  ar: "يعدد ابن سينا أسباب التحلل والتعفن: من خارج الهواء المحلل والمعفن، ومن داخل الحرارة الغريزية المحللة لرطوباتنا والحرارة الغريبة المتولدة عن الأغذية المتعفنة، وكلها تتعاون على تجفيفنا، وهذا الجفاف ضروري لا بد منه {cite:canon-ibn-sina-print-v1 p.201}."
  en: "Ibn Sina lists the causes of dissolving and rotting: from outside, air that dissolves and putrefies, and from inside, the innate heat that dissolves our moistures and the foreign heat generated from putrefying food, all working together to dry us, a drying that is necessary and unavoidable {cite:canon-ibn-sina-print-v1 p.201}."
  fr: "Ibn Sina énumère résolution et pourrissement : air extérieur résolutif et putréfiant, chaleur innée dissipant l’humidité et chaleur étrangère issue des aliments putréfiés concourent à une dessiccation nécessaire, inévitable {cite:canon-ibn-sina-print-v1 p.201}."
  es: "Ibn Sina enumera las causas de la disolución y la putrefacción: desde el exterior, el aire que disuelve y putrefacta, y desde el interior, el calor innato que disuelve nuestra humedad y el calor externo generado por la putrefacción de los alimentos, todo ello trabajando conjuntamente para secarnos, un secado que es necesario e inevitable {cite:canon-ibn-sina-print-v1 p.201}."
  ur: "ابن سینا نے پگھلنے اور گلنے کے اسباب کی فہرست دی ہے: باہر سے، ہوا جو گھلتی اور پگھلتی ہے، اور اندر سے، فطری حرارت جو ہماری رطوبتوں کو تحلیل کرتی ہے اور غیر ملکی گرمی جو کہ ہمیں خشک کرتی ہے، یہ سب مل کر ہمیں خشک کرنے کے لیے کام کرتے ہیں، ایک خشک کرنا جو ضروری اور ناگزیر ہے۔"
  tr: "İbn Sina, çürüme ve bozulmanın nedenlerini sıralar: dışarıdan çürümüş ve çürük hava, içeriden nemimizi parçalayan içgüdüsel ısı ve çürümüş yiyeceklerin ürettiği garip ısı, bunların hepsi bizi kurutmada işbirliği yapar. Bu kuruluk, gerekli ve gereklidir {atıf:kanon-ibn-sina-print-v1 s.201}."
  id: "Ibn Sina mencantumkan penyebab pembusukan dan pembusukan: dari luar udara yang membusuk dan membusuk, dari dalam panas naluriah yang menguraikan kelembapan kita, dan panas aneh yang dihasilkan oleh makanan busuk, yang semuanya bekerja sama dalam mengeringkan kita. Kekeringan ini diperlukan dan esensial {cite:canon-ibn-sina-print-v1 hlm.201}."
