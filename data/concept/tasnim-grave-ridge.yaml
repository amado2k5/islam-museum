label:
  ar: "التسنيم"
  en: "Tasnim (raising the grave into a ridge, against leveling it)"
  ur: "تسنیم (قبر کا کوہان نما اونچا کرنا)"
summary:
  ar: "التسنيم عند الفقهاء رفع القبر عن الأرض مقدار شبر أو أكثر قليلا، ويقابله التسطيح، وهو أن يُجعل القبر مبسوطا متساوي الأجزاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5113} ولا خلاف في استحباب رفع التراب فوق القبر قدر شبر، ولا بأس بزيادة قليلة عند بعض الحنفية، ليُعرف أنه قبر فيُتوقّى ويُترحّم على صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5113} والحنفية والمالكية والحنابلة يندبون التسنيم ويكرهون التسطيح، لأنه يشبه أبنية أهل الدنيا. أما الشافعية فيندبون التسطيح ويرونه أفضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5114} وإن دُفن المسلم في غير دار الإسلام وتعذر نقله، فالأولى تسوية القبر وإخفاؤه خوفا من النبش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5115}"
  en: "In the jurists' usage tasnim is raising a grave above the ground by about a span or a little more; its opposite is tasttih (tasteeh), making the grave flat and level. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5113} All agree that raising the earth over a grave by about a span is recommended, and some Hanafis allow a little more, so that the grave is known, avoided and prayed for. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5113} The Hanafis, Malikis and Hanbalis recommend the ridge and dislike leveling, since leveling resembles the buildings of the world. The Shafi'is recommend leveling and hold it better. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5114} If a Muslim dies in a land outside the abode of Islam and cannot be moved to it, the better course is to level the grave and conceal it, for fear it will be dug up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5115}"
