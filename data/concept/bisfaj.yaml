id: concept/bisfaj
class: concept
kind: natural
label:
  ar: "بسفايج"
  en: "Bisfaj (polypody fern root)"
  fr: "Bisfaj (racine de polypode)"
  ur: "بسفایج ⁦(پالی پوڈی جڑ)⁩"
  es: "Bisfaj (raíz de helecho polipodio)"
summary:
  ar: "عود دقيق أغبر ذو شعب كالدودة، وفي مذاقه حلاوة مع قبض، أجوده الغليظ المكتنز الطري، حار في الثانية يابس في الثالثة، محلّل منضج للنفخ والرطوبات، ضماده نافع لالتواء العصب، ويسهّل السوداء بلا مغص، ويُطبخ في مرقة الديك للقولنج {cite:canon-ibn-sina-print-v1 p.407}."
  en: "A fine, dusty-grey stem with branches like a worm's body, sweet with astringency in taste. The best is thick, firm and fresh. Hot in the second degree and dry in the third. It dissolves and ripens wind and humours, its poultice helps a twisted nerve, and it loosens black bile without colic; boiled in cock broth it is used for colic {cite:canon-ibn-sina-print-v1 p.407}."
  fr: "Fine tige gris poussière aux ramifications évoquant le corps d’un ver, douce et astringente. La meilleure est épaisse, ferme et fraîche. Chaude au deuxième degré et sèche au troisième, elle résoudrait et mûrirait vents et humeurs ; son cataplasme aiderait un nerf tordu. Elle évacuerait la bile noire sans coliques ; bouillie dans un bouillon de coq, elle sert contre celles-ci {cite:canon-ibn-sina-print-v1 p.407}."
  ur: "ایک باریک خاکستری رنگ کی جڑ جس کی شاخیں کیڑے کے جسم جیسی ہیں، اور ذائقے میں مٹھاس کے ساتھ قبض۔ بہترین وہ ہے جو موٹی، ٹھوس اور تازہ ہو۔ دوسرے درجے میں گرم اور تیسرے میں خشک۔ یہ ہوا اور رطوبتوں کو تحلیل اور پکاتا ہے، اس کا لیپ مروڑے ہوئے پٹھے کو فائدہ دیتا ہے، اور مروڑ کے بغیر سودا نکالتا ہے؛ مرغ کے شوربے میں پکا کر قولنج کے لیے استعمال ہوتا ہے {cite:canon-ibn-sina-print-v1 p.407}۔"
  es: "Un tallo fino, gris polvoriento, con ramificaciones parecidas al cuerpo de un gusano, de sabor dulce y ligeramente astringente. Lo mejor es grueso, firme y fresco. Caliente en segundo grado y seco en tercero. Disuelve y madura los gases y los humores, su cataplasma ayuda a aliviar un nervio contraído y fluidifica la bilis negra sin provocar cólicos; hervido en caldo de gallo se usa para los cólicos {cite:canon-ibn-sina-print-v1 p.407}."
