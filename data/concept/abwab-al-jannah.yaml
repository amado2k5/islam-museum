id: concept/abwab-al-jannah
class: concept
kind: belief
label:
  ar: "أبواب الجنة"
  en: "The Gates of Paradise"
  ur: "جنت کے دروازے"
summary:
  ar: "للجنة ثمانية أبواب كما في الصحيح، لكل باب أهله من أهل الأعمال: باب للصلاة يدعى منه من كان من أهل الصلاة، وباب للجهاد، وباب للريان — وهو خاص بالصائمين — وباب للصدقة. قال رسول الله: «من أنفق زوجين في سبيل الله نودي في الجنة: يا عبد الله هذا خير؛ فمن كان من أهل الصلاة دعي من باب الصلاة»."
  en: "Paradise has eight gates, as the Sahih reports, each with its people of deed: a gate of prayer for the people of prayer, a gate of jihad, a gate of al-Rayyan reserved for the fasting, and a gate of charity. The Prophet said: «Whoever spends a pair in the way of God is called at the gates of Paradise: O servant of God, this is good — whoever was of the people of prayer is called from the gate of prayer»."
  ur: "جنت کے آٹھ دروازے ہیں، صحیح حدیث کے مطابق ہر دروازے کے اپنے عمل والے ہیں: نماز کا دروازہ اہل نماز کے لیے، جہاد کا دروازہ، باب الریان جو روزہ داروں کے لیے مخصوص ہے، اور صدقے کا دروازہ۔ نبی نے فرمایا: «جو شخص اللہ کی راہ میں جوڑا خرچ کرے اسے جنت کے دروازوں سے پکارا جائے گا»۔"
