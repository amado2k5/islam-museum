id: concept/abwab-al-jannah
class: concept
kind: belief
label:
  ar: "أبواب الجنة"
  en: "The Gates of Paradise"
  fr: "Les portes du Paradis"
  ur: "جنت کے دروازے"
  es: "Las Puertas del Paraíso"
  tr: "Cennetin kapıları"
  id: "Gerbang surga"
summary:
  ar: "للجنة ثمانية أبواب كما في الصحيح، لكل باب أهله من أهل الأعمال: باب للصلاة يدعى منه من كان من أهل الصلاة، وباب للجهاد، وباب للريان — وهو خاص بالصائمين — وباب للصدقة. قال رسول الله: «من أنفق زوجين في سبيل الله نودي في الجنة: يا عبد الله هذا خير؛ فمن كان من أهل الصلاة دعي من باب الصلاة»."
  en: "Paradise has eight gates, as the Sahih reports, each with its people of deed: a gate of prayer for the people of prayer, a gate of jihad, a gate of al-Rayyan reserved for the fasting, and a gate of charity. The Prophet said: «Whoever spends a pair in the way of God is called at the gates of Paradise: O servant of God, this is good — whoever was of the people of prayer is called from the gate of prayer»."
  fr: "Le Paradis a huit portes, comme le rapporte le Sahih, chacune destinée aux personnes qui se distinguent par un acte : une porte de la prière pour les gens de la prière, une porte du jihad, une porte d'al-Rayyan réservée aux jeûneurs et une porte de la charité. Le Prophète a dit : « Quiconque dépense une paire dans la voie de Dieu est appelé aux portes du Paradis : Ô serviteur de Dieu, ceci est un bien — celui qui était des gens de la prière est appelé par la porte de la prière »."
  ur: "جنت کے آٹھ دروازے ہیں، صحیح حدیث کے مطابق ہر دروازے کے اپنے عمل والے ہیں: نماز کا دروازہ اہل نماز کے لیے، جہاد کا دروازہ، باب الریان جو روزہ داروں کے لیے مخصوص ہے، اور صدقے کا دروازہ۔ نبی نے فرمایا: «جو شخص اللہ کی راہ میں جوڑا خرچ کرے اسے جنت کے دروازوں سے پکارا جائے گا»۔"
  es: "El Paraíso tiene ocho puertas, como relata el Sahih, cada una con su gente de buenas obras: una puerta de oración para los devotos, una puerta de yihad, una puerta de al-Rayyan reservada para los que ayunan y una puerta de caridad. El Profeta dijo: «Quien dedique un par de días a la causa de Dios será llamado a las puertas del Paraíso. ¡Oh siervo de Dios, esto es bueno! Quien sea de la gente de oración será llamado desde la puerta de la oración»."
  tr: "Cennetin Sahih'te belirtildiği gibi sekiz kapısı vardır; her birinin kendi iş adamları vardır: namaz kılanlar için bir bölüm, cihat için bir bölüm, oruç tutanlara özgü olan el-rayyan için bir bölüm ve sadaka için bir bölüm. Allah'ın Elçisi şöyle dedi: \"Allah yolunda iki eş harcayan cennete çağrılır: Ey Allah'ın kulü, bu en iyisidir; bu yüzden namaz kılanlar arasında kim varsa, namaz kapısından davet edilir.\""
  id: "Surga memiliki delapan gerbang, seperti yang dinyatakan dalam Sahih, masing-masing dengan akhbar perbuatannya sendiri: satu bab untuk shalat yang dipanggil kepada mereka yang berada di antara umat shalat, satu bab untuk jihad, satu bab untuk al-rayyan (yang khusus untuk mereka yang berpuasa), dan satu bab untuk amal. Rasulullah berkata: \"Barangsiapa yang menghabiskan dua pasangan di jalan Allah akan dipanggil ke Surga: wahai hamba Allah, inilah yang terbaik; maka siapa pun yang berada di antara umat salat diundang keluar dari gerbang doa.\""
