label:
  ar: "التسليم"
  en: "Taslim (delivery, handing over, and the greeting of peace)"
  ur: "تسلیم (سپرد کرنا، قبضہ دینا اور سلام)"
summary:
  ar: "التسليم في اللغة التوصيل والدفع والتمكين، وعند الفقهاء يُطلق على السلام، وعلى تسليم المصلي للخروج من الصلاة، وعلى التمكين من القبض في العقود، وعلى تسليم الرهن والكفالة والأجرة والصداق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5084} والسلام ابتداؤه سنة مؤكدة، ورده واجب على الواحد، وفرض كفاية على الجماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5085} والتسليمة الأولى للخروج من الصلاة فرض عند المالكية والشافعية والحنابلة، والحنفية يرونها واجبا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5085} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5087} وفي البيع يتم القبض بالتخلية، فيقبض العقار بالتخلية، والمنقول بحسب العرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5088} وفي تقديم أحد البدلين خلاف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5089} ويجب تسليم رأس مال السلم في مجلس العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5090} وفي الرهن يسلم الراهن الدين ثم يسلم المرتهن المرهون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5092}"
  en: "In the lexicon taslim means delivery, handing over and enabling; for jurists it names the greeting of peace, the closing of the prayer, the enabling of possession in contracts, and the delivery of pledges, sureties, wages and dowries. The initiating greeting is a strongly recommended practice, and its reply is obligatory for one person and a communal duty for a group. The first closing salutation is required in prayer for the Malikis, Shafi'is and Hanbalis, while the Hanafis hold it obligatory. In sale, possession comes by enabling: real property is taken by enabling, movables by custom. The payment of capital in a salam must be made at the session of the contract. In a pledge, the debt is paid first, then the pledged item is handed over. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5085} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5092}"
