label: { ar: "دلائل جزئية تشير إلى أعضاء بعينها", en: "Particular signs pointing to particular organs in the Canon", ur: "مخصوص اعضا کی طرف اشارہ کرنے والی جزئی علامات قانون میں" }
summary:
  ar: "يبين ابن سينا أن أموراً جزئية تدل على أمور جزئية: دوام الصداع وتخيل العين قدام الوجه كالبق ينذر بنزول الماء في العين، والثقل والوجع في الجانب الأيمن إذا طال دل على علة في الكبد، والثقل والتمدد في أسفل الظهر والخاصرة مع تغير البول ينذر بعلة في الكلى، والبراز العادم للصبغ ينذر باليرقان، وطول حرق البول ينذر بقروح المثانة والقضيب {cite:canon-ibn-sina-print-v1 p.260}."
  en: "Ibn Sina shows that particular signs point to particular conditions: lasting headache with the eye imagining specks like gnats before the face foretells water descending in the eye; heaviness and pain on the right side, if long, points to a disorder of the liver; heaviness and stretching in the lower back and flank with a change in the urine foretells a kidney disorder; stool devoid of its colour foretells jaundice; and long burning of urine foretells sores in the bladder and penis {cite:canon-ibn-sina-print-v1 p.260}."
