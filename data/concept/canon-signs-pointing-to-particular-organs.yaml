id: concept/canon-signs-pointing-to-particular-organs
class: concept
kind: scientific
label:
  ar: "دلائل جزئية تشير إلى أعضاء بعينها"
  en: "Particular signs pointing to particular organs in the Canon"
  fr: "Signes particuliers de certains organes dans le Canon"
  ur: "مخصوص اعضا کی طرف اشارہ کرنے والی جزئی علامات قانون میں"
  es: "Signos particulares que señalan órganos particulares en el Canon"
  tr: "Belirli üyelere işaret eden kısmi işaretler"
  id: "Indikasi parsial yang menunjuk pada anggota tertentu"
summary:
  ar: "يبين ابن سينا أن أموراً جزئية تدل على أمور جزئية: دوام الصداع وتخيل العين قدام الوجه كالبق ينذر بنزول الماء في العين، والثقل والوجع في الجانب الأيمن إذا طال دل على علة في الكبد، والثقل والتمدد في أسفل الظهر والخاصرة مع تغير البول ينذر بعلة في الكلى، والبراز العادم للصبغ ينذر باليرقان، وطول حرق البول ينذر بقروح المثانة والقضيب {cite:canon-ibn-sina-print-v1 p.260}."
  en: "Ibn Sina shows that particular signs point to particular conditions: lasting headache with the eye imagining specks like gnats before the face foretells water descending in the eye; heaviness and pain on the right side, if long, points to a disorder of the liver; heaviness and stretching in the lower back and flank with a change in the urine foretells a kidney disorder; stool devoid of its colour foretells jaundice; and long burning of urine foretells sores in the bladder and penis {cite:canon-ibn-sina-print-v1 p.260}."
  fr: "Pour Ibn Sina, céphalée durable avec points en moucherons devant les yeux annoncerait descente d’eau dans l’œil ; lourdeur et douleur droites prolongées, atteinte hépatique ; lourdeur et distension lombaires et du flanc avec urine modifiée, atteinte rénale ; selles décolorées, jaunisse ; longue sensation de brûlure urinaire, ulcères vésicaux et péniens {cite:canon-ibn-sina-print-v1 p.260}."
  es: "Ibn Sina muestra que ciertos signos apuntan a afecciones específicas: un dolor de cabeza persistente con la visión de puntos como mosquitos frente al rostro presagia la presencia de agua en el ojo; pesadez y dolor en el lado derecho, si es prolongado, apunta a un trastorno del hígado; pesadez y estiramiento en la parte baja de la espalda y el flanco con un cambio en la orina presagian un trastorno renal; heces sin color presagian ictericia; y ardor prolongado en la orina presagia llagas en la vejiga y el pene {cite:canon-ibn-sina-print-v1 p.260}."
  ur: "ابن سینا سے پتہ چلتا ہے کہ خاص علامات خاص حالات کی طرف اشارہ کرتی ہیں: آنکھوں کے ساتھ دیرپا سر درد جو چہرے سے پہلے مچھروں جیسے دھبوں کا تصور کرتے ہوئے آنکھ میں پانی اترنے کی پیشین گوئی کرتا ہے۔ دائیں طرف بھاری پن اور درد، اگر طویل ہو تو، جگر کی خرابی کی طرف اشارہ کرتا ہے؛ پیشاب میں تبدیلی کے ساتھ کمر کے نچلے حصے میں بھاری پن اور کھنچاؤ گردے کی خرابی کی پیش گوئی کرتا ہے۔ پاخانہ اپنے رنگ سے خالی ہونا یرقان کی پیش گوئی کرتا ہے۔ اور پیشاب کا لمبا جلنا مثانے اور عضو تناسل میں زخموں کی پیش گوئی کرتا ہے"
  tr: "İbn Sina, küçük sorunların küçük sorunları gösterdiğini açıklar: sürekli baş ağrıları ve gözün yüzün önünde yatak kurusu gibi görünmesi, göze suyun girmesini haber vermesi; uzun sürerse sağ tarafta ağırlık ve ağrı karaciğer rahatsızlığını gösterir; alt sırt ve yanlarda ağırlık ve şişkinlik, idrarda değişiklikler böbrek rahatsızlığını gösterir; pigment sinyalleri yayan dışkı sarılık sinyali verir; ve idrarın uzun süreli yanması mesane ve penis ülserlerini işaret eder {cite:canon-ibn-sina-print-v1 s.260}."
  id: "Ibn Sina menjelaskan bahwa masalah kecil menunjukkan masalah ringan: sakit kepala yang terus-menerus dan munculnya mata di depan wajah seperti kutu kasur yang memperingatkan air masuk ke mata; berat dan nyeri di sisi kanan jika berkepanjangan menandakan penyakit hati; berat dan ketegangan di punggung bawah dan sisi tubuh dengan perubahan urin menunjukkan penyakit ginjal; tinja yang mengeluarkan sinyal pigmen penyakit kuning; dan pembakaran urin yang berkepanjangan menandakan ulkus kandung kemih dan penis {cite:canon-ibn-sina-print-v1 hlm.260}."
