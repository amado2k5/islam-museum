id: concept/bidah
class: concept
kind: legal
label: { ar: "البدعة", en: "Bid'a (innovation in religion)" }
summary:
  ar: "يرى ابن قيم الجوزية، في منتخب «إغاثة اللهفان»، أن البدعة ما أُحدث في الدين مما لم يأذن به الله ولا رسوله، وأن البدع عند القبور تُحيي الشرك القديم، وأن المبتدع يزعم أنه يعظّم الأنبياء والصالحين وهو يخالف هديهم، وأن الصحابة والتابعين لم يفعلوا شيئاً منها."
  en: "As the extract presents Ibn Qayyim's view, an innovation is what is introduced into religion without God's or His Messenger's authority; innovations at graves revive an old polytheism; the innovator believes he honours the prophets and the righteous while contradicting their way; and the Companions and Successors did none of them."
wings: [ideas]
themes: [creed, worship-and-the-pillars]
periods: [period/prophetic-era, period/crusades-ayyubid-mamluk]
regions: [global]
issue:
  ar: "كيف يُميَّز ما شُرع مما أُحدث في العبادة، وما الذي يجعل البدعة خطيرة؟"
  en: "How is what was legislated told apart from what was introduced in worship, and why is an innovation dangerous?"
perspectives:
  - tradition: sunni
    id: ighathat-lahfan
    stance:
      ar: "كل بدعة ضلالة، وأشدها ما أدى إلى الشرك عند القبور؛ والسنة هي المعيار"
      en: "Every innovation is misguidance, and the worst are those that lead to shirk at graves; the Sunna is the measure"
    summary:
      ar: "يقرر ابن قيم الجوزية أن البدعة في زيارة القبور وفي الصلاة عندها تخالف نصوص النهي، وأن الذين يقولون بالبدعة يحرّفون الكلم عن مواضعه ويتأولونه على غير وجهه، ويستشهد بأثر عمر في قطع الشجرة التي بايع تحتها الصحابة، وبأثر أبي سعيد الخدري في بكائه على ما أُحدث. ويرى أن من ارتكب الكبيرة بعد الشرك أسهل إثماً من أن يُحدث في الدين ما لم يأذن به الله."
      en: "Ibn Qayyim holds that innovations in visiting graves and in praying at them contradict the explicit prohibitions, and that those who innovate distort the text and read it against its sense. He cites Umar's cutting of the tree under which the Companions pledged, and Abu Sa'id al-Khudri's weeping over what had been introduced. He argues that committing a grave sin after shirk is lighter than introducing into religion what God has not authorised."
