summary:
  ar: "خنثى في الكتاب نبات ورقه كالكراث الشامي، له ساق ملساء على رأسها زهر وثمرة طويلة مستديرة كالبلوط، وهو حريف؛ حار يابس، ويذكر الكتاب أن بعضهم قال بارد رطب وأن ذلك بعيد، جلاء محلل خصوصا أصله، وقوته كقوة اللوف الجعد، ينفع من داء الثعلب والحية ومن أورام الغدد والدماميل والقروح الخبيثة ومن قيح الأذن واليرقان ونهش الهوام، ويدر البول، وفيه نقل موسوم عن الطمث وأورام الثدي والخصى في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.708-709}"
  en: "Khuntha is in the book a plant with a leaf like the Syrian leek, a smooth stalk with a flower on its head and a long round fruit like the acorn, and pungent; hot and dry, though the book notes that some said it is cold and moist and that this is far off, cleansing and dissolving, especially its root, with a strength like that of lufa ja'd, it benefits alopecia, swellings of the glands, boils, malignant ulcers, ear pus, jaundice and the bites of vermin and promotes urine, with a labelled listing on menses and swellings of the breast and testicles in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.708-709}"
  ur: "خنثیٰ کتاب میں ایک نبات ہے جس کا پتا شامی گندنا جیسا ہے، ہموار تنے کے سر پر پھول ہے اور بلوط جیسا لمبا گول پھل، اور یہ تیز ذائقے کا ہے؛ گرم خشک، اور کتاب نوٹ کرتی ہے کہ بعض نے اسے ٹھنڈا تر کہا اور یہ بعید ہے، صاف کرنے والا اور تحلیل کرنے والا خصوصاً اس کی جڑ، اس کی قوت لوف جعد جیسی ہے، یہ داء الثعلب اور داء الحیہ، غدودوں کے ورموں، پھوڑوں، خبیث زخموں، کان کی پیپ، یرقان اور زہریلے جانوروں کے ڈنک میں نافع ہے اور پیشاب لاتا ہے، اور حیض اور چھاتی اور خصیوں کے ورموں کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.708-709}۔"
  es: "Khuntha es descrita en el libro como una planta con una hoja parecida al puerro sirio, un tallo liso con una flor en su cabeza y un fruto largo y redondo como la bellota, de sabor picante; caliente y seco, aunque el libro señala que algunos decían que era frío y húmedo, lo cual está muy lejos de la realidad; purificante y disolvente, especialmente su raíz, con una fuerza similar a la de la lufa ja'd; beneficia la alopecia, la inflamación de las glándulas, los forúnculos, las úlceras malignas, el pus de oído, la ictericia y las picaduras de parásitos, y promueve la micción, con una lista etiquetada sobre la menstruación y la inflamación de los senos y los testículos en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.708-709}"
  fr: "Le khuntha est décrit dans le livre comme une plante à feuilles semblables à celles du poireau syrien, à tige lisse portant une fleur et produisant un fruit long et rond comme un gland, à l'odeur piquante; chaude et sèche, bien que le livre indique que certains la décrivent comme froide et humide, ce qui est loin d'être le cas. Purifiante et dissolvante, en particulier sa racine, d'une force comparable à celle du lufa ja'd, elle est bénéfique contre l'alopécie, les gonflements des ganglions, les furoncles, les ulcères malins, le pus de l'oreille, la jaunisse et les piqûres de vermine. Elle favorise également la diurèse, avec une liste détaillée mentionnant les menstruations et les gonflements des seins et des testicules dans une section réservée à l'avis du fondateur. {cite:canon-ibn-sina-print-v1 pp.708-709}"
  tr: "Kitapta, Levant pırasası gibi yapraklara sahip, üstünde pürüzsüz bir sap ve meşe benzeri uzun, yuvarlak meyveye sahip bir hermafrodittir. Baharatlı, sıcak, kurudur. Kitapta bazılarının soğuk ve nemli olduğunu söylediği belirtilir, bu pek olası değildir. Özellikle kıvırcık lof gibi kökeni ve gücü açısından açık ve analitik bir karaktere sahiptir. Tilki ve yılan hastalıklarına, bez tümörlerine, çıbanlara, kötü huylu ülserlere, kulak irinlerine, sarılığa ve morarmaya karşı faydalıdır ve idrar söktürücüdür. Kurucu kuralı ile ilgili bir bölümde adet görme, meme tümörleri ve testisler başlıklı bir alıntı içerir {cite:canon-ibn-sina-print-v1 s.708-709}"
  id: "Dalam buku tersebut, ia adalah hermaprodit dengan daun seperti bawang Levantine, dengan batang halus di bagian atasnya dan buah bulat panjang seperti ek. Buahnya pedas, panas, kering. Buku menyebutkan bahwa beberapa orang mengatakan ia dingin dan lembap, yang tidak mungkin. Karakternya jelas dan analitis, terutama asal dan kekuatannya seperti loof keriting. Ikan ini bermanfaat melawan penyakit rubah dan ular, tumor kelenjar, bisul, tukak ganas, nanah telinga, kuning, dan memar, serta bersifat diuretik. Buku ini memuat kutipan berjudul tentang menstruasi, tumor payudara, dan testis dalam bagian yang berkaitan dengan aturan pendiri {cite:canon-ibn-sina-print-v1 hlm.708-709}"
