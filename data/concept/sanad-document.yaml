label:
  ar: "السَّنَد"
  en: "Sanad (a written instrument of right, and the chain of narrators)"
summary:
  ar: "السند في اللغة ما يُستند إليه ويُعتمد عليه، ويطلق في الاصطلاح على الحجة المكتوبة التي توثق بها الحقوق، ويشترط لاعتبارها أن تبين الحق ومبلغه، وأن تكون معنونة باسم من له الحق، مختومة بخاتم من عليه الحق مع إمضائه، وسالمة من التزوير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} وإذا استوفى السند شروطه كان إقرارا بالكتابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} ويطلق السند ثانيا على سلسلة رواة الحديث الموصلة إلى المتن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836}"
  en: "In the lexicon sanad is whatever one leans on and relies on. In the technical sense it has two uses. The first is a written instrument by which rights are secured: to be relied on for proof it must state the right and its amount, bear the name of the person entitled, be sealed and signed by the debtor, and be free from forgery and alteration, with its hand confirmed by experts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} A sound instrument that meets these conditions counts as a written confession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} The second use is the chain of narrators of a hadith leading to its text; the conditions for accepting it are treated under the entry on isnad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836}"
