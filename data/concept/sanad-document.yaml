class: concept
kind: legal
label:
  ar: "السَّنَد"
  en: "Sanad (a written instrument of right, and the chain of narrators)"
  es: "Sanad (un instrumento escrito de derecho y la cadena de narradores)"
  fr: "Sanad (un acte de droit écrit et la chaîne des narrateurs)"
  ur: "سناد ⁦(حق کا تحریری آلہ، اور راویوں کا سلسلہ)⁩"
summary:
  ar: "السند في اللغة ما يُستند إليه ويُعتمد عليه، ويطلق في الاصطلاح على الحجة المكتوبة التي توثق بها الحقوق، ويشترط لاعتبارها أن تبين الحق ومبلغه، وأن تكون معنونة باسم من له الحق، مختومة بخاتم من عليه الحق مع إمضائه، وسالمة من التزوير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} وإذا استوفى السند شروطه كان إقرارا بالكتابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} ويطلق السند ثانيا على سلسلة رواة الحديث الموصلة إلى المتن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836}"
  en: "In the lexicon sanad is whatever one leans on and relies on. In the technical sense it has two uses. The first is a written instrument by which rights are secured: to be relied on for proof it must state the right and its amount, bear the name of the person entitled, be sealed and signed by the debtor, and be free from forgery and alteration, with its hand confirmed by experts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} A sound instrument that meets these conditions counts as a written confession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} The second use is the chain of narrators of a hadith leading to its text; the conditions for accepting it are treated under the entry on isnad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836}"
  es: "En el léxico, sanad es aquello en lo que uno se apoya y confía. En el sentido técnico tiene dos usos. El primero es un instrumento escrito mediante el cual se garantizan los derechos: para que se confíe en él como prueba, debe indicar el derecho y su cantidad, llevar el nombre de la persona titular, estar sellado y firmado por el deudor, y estar libre de falsificaciones y alteraciones, con su firma confirmada por expertos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} Un instrumento sólido que cumpla estas condiciones cuenta como una confesión escrita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} El segundo uso es la cadena de narradores de un hadiz que conduce a su texto; las condiciones para aceptarlo se tratan en la entrada sobre isnad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836}"
  fr: "Dans le lexique, le terme « sanad » désigne tout ce sur quoi on s'appuie. Techniquement, il a deux usages. Le premier est un acte écrit garantissant des droits: pour être recevable comme preuve, il doit énoncer le droit et son montant, porter le nom du bénéficiaire, être scellé et signé par le débiteur, et être exempt de faux et d'altération, son écriture étant authentifiée par des experts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} Un acte authentique répondant à ces conditions vaut aveu écrit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836} Le second usage est la chaîne de transmission d'un hadith jusqu'à son texte; les conditions d'acceptation sont traitées dans l'article relatif à l'isnad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9836}"
  ur: "لغت میں سناد وہ ہے جس پر کوئی ٹیک لگائے اور اس پر بھروسہ کرے۔ تکنیکی لحاظ سے اس کے دو استعمال ہیں۔ پہلا ایک تحریری آلہ ہے جس کے ذریعے حقوق محفوظ ہوتے ہیں: ثبوت کے لیے اس پر انحصار کرنے کے لیے ضروری ہے کہ اس کا حق اور اس کی رقم بتائی جائے، حقدار کا نام ہونا چاہیے، مقروض کے ذریعے مہر اور دستخط ہونا چاہیے، اور جعلسازی اور تبدیلی سے پاک ہونا چاہیے، جس کی تصدیق ماہرین کے ہاتھ سے ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9835} ان شرائط پر پورا اترنے والا ایک تحریری اقرار شمار ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9835} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ9836} دوسرا استعمال حدیث کے راویوں کا سلسلہ ہے جو اس کے متن کی طرف لے جاتا ہے۔ اسے قبول کرنے کی شرائط اسناد کے اندراج کے تحت دی جاتی ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص9836}"
