id: concept/karaha
class: concept
kind: legal
label:
  ar: "كَراهة"
  en: "Disliked acts (karaha)"
  ur: "کراہت"
summary:
  ar: "الكراهة لغة الكره، واصطلاحاً طلب الكف عن الفعل طلباً غير جازم. وتنقسم إلى كراهة تحريم، وهي ما كان إلى الحرام أقرب، وكراهة تنزيه، وهي ما كان تركه أولى من فعله، وقد يطلق المكروه على الحرام، وقد يطلق على ما وقعت الشبهة في تحريمه. وخلاف الأولى قسم من المكروه عند الزركشي، وقال إمام الحرمين إن الفصل بينهما من محدثات المتأخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  en: "Karaha is dislike in the lexicon and, in the terminology, a demand to abstain from an act that is not firm. It divides into dislike of prohibition (karaha tahrimiyya), which is close to forbidden, and dislike of reprehension (karaha tanzihiyya), where leaving the act is better. The word may also mean the forbidden itself, or a thing whose prohibition is doubtful. For al-Zarkashi, leaving the better (khilaf al-awla) is a grade of dislike; the Imam al-Haramayn held that the distinction is a later invention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  ur: "کراہت لغت میں ناپسندیدگی ہے، اور اصطلاح میں کسی فعل سے غیر جازم طور پر رکنے کا مطالبہ۔ یہ کراہتِ تحریمی میں تقسیم ہوتی ہے، جو حرام کے قریب ہے، اور کراہتِ تنزیہی، جس میں اس فعل کو چھوڑنا بہتر ہو۔ مکروہ کا اطلاق حرام پر، اور اس چیز پر بھی ہوتا ہے جس کی حرمت میں شبہ ہو۔ زرکشی کے نزدیک خلافِ اولیٰ مکروہ کی ایک درجہ ہے، جبکہ امام الحرمین کے نزدیک ان دونوں میں فصل بعد کے علماء کی ایجاد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
