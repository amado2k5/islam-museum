label:
  ar: "كَراهة"
  en: "Disliked acts (karaha)"
  ur: "کراہت"
  es: "Actos que desagradan (karaha)"
  fr: "Actes détestés (karaha)"
  tr: "nefret"
  id: "kebencian"
summary:
  ar: "الكراهة لغة الكره، واصطلاحاً طلب الكف عن الفعل طلباً غير جازم. وتنقسم إلى كراهة تحريم، وهي ما كان إلى الحرام أقرب، وكراهة تنزيه، وهي ما كان تركه أولى من فعله، وقد يطلق المكروه على الحرام، وقد يطلق على ما وقعت الشبهة في تحريمه. وخلاف الأولى قسم من المكروه عند الزركشي، وقال إمام الحرمين إن الفصل بينهما من محدثات المتأخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  en: "Karaha is dislike in the lexicon and, in the terminology, a demand to abstain from an act that is not firm. It divides into dislike of prohibition (karaha tahrimiyya), which is close to forbidden, and dislike of reprehension (karaha tanzihiyya), where leaving the act is better. The word may also mean the forbidden itself, or a thing whose prohibition is doubtful. For al-Zarkashi, leaving the better (khilaf al-awla) is a grade of dislike; the Imam al-Haramayn held that the distinction is a later invention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  ur: "کراہت لغت میں ناپسندیدگی ہے، اور اصطلاح میں کسی فعل سے غیر جازم طور پر رکنے کا مطالبہ۔ یہ کراہتِ تحریمی میں تقسیم ہوتی ہے، جو حرام کے قریب ہے، اور کراہتِ تنزیہی، جس میں اس فعل کو چھوڑنا بہتر ہو۔ مکروہ کا اطلاق حرام پر، اور اس چیز پر بھی ہوتا ہے جس کی حرمت میں شبہ ہو۔ زرکشی کے نزدیک خلافِ اولیٰ مکروہ کی ایک درجہ ہے، جبکہ امام الحرمین کے نزدیک ان دونوں میں فصل بعد کے علماء کی ایجاد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  es: "Karaha es un término que expresa aversión en el léxico y, en la terminología, una exigencia de abstenerse de un acto que no es firme. Se divide en aversión a la prohibición (karaha tahrimiyya), que se acerca a lo prohibido, y aversión a la reprimenda (karaha tanzihiyya), donde es preferible abstenerse del acto. La palabra también puede significar lo prohibido en sí mismo, o algo cuya prohibición es dudosa. Para al-Zarkashi, abstenerse de lo mejor (khilaf al-awla) es un grado de aversión; el Imam al-Haramayn sostenía que esta distinción es una invención posterior. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13239} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13240} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  fr: "Karaha désigne, dans le lexique, une aversion et, dans la terminologie, une injonction à s'abstenir d'un acte dont l'interdiction n'est pas formelle. On distingue l'aversion pour l'interdiction (karaha tahrimiyya), proche de l'interdiction formelle, et l'aversion pour la réprimande (karaha tanzihiyya), où il est préférable de s'abstenir. Le terme peut également désigner l'interdit lui-même, ou une chose dont l'interdiction est douteuse. Pour al-Zarkashi, s'abstenir de ce qui est préférable (khilaf al-awla) constitue un degré d'aversion; l'imam al-Haramayn considérait cette distinction comme une invention postérieure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  tr: "Dilsel olarak hoşlanmamak, hoşlanmamak anlamına gelir ve teknik olarak eylemden kaçınmak için belirleyici olmayan bir taleptir. Yasaktan hoşlanmamak, yasaklanmaya daha yakın olan şey ve arınmayı sevmemek, ki bu onu terk etmektense tercih edilir, diğer. Sevilmeyenler, yasak olanı veya yasaklanmasında şüpheli olanı ifade edebilir. İlk taraf arasındaki anlaşmazlık, Al-Zarkashi'ye göre sevilmeyenlerin bir parçasıdır. İmam el-Haramayn, onları ayırmanın sonraki alimlerin yeniliklerinden biri olduğunu söylemiştir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13241}"
  id: "Tidak suka secara linguistik berarti tidak suka, dan secara teknis ini adalah permintaan yang tidak menentukan untuk menahan diri dari tindakan tersebut. Itu terbagi menjadi ketidaksukaan terhadap larangan, yang lebih dekat dengan yang terlarang, dan ketidaksukaan terhadap penyucian, yang lebih baik daripada meninggalkannya daripada melakukannya. Yang tidak suka dapat merujuk pada yang terlarang, atau pada apa yang diragukan tentang larangannya. Perbedaan antara yang pertama adalah bagian dari yang tidak disukai menurut Al-Zarkashi. Imam al-Haramayn mengatakan bahwa memisahkan mereka adalah salah satu inovasi para ulama berikutnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13239} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13240} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
