id: concept/canon-preserving-the-complexion-on-a-journey
class: concept
kind: scientific
label:
  ar: "حفظ اللون في السفر عند ابن سينا"
  en: "Preserving the complexion on a journey in the Canon"
  fr: "Préserver le teint en voyage dans le Canon"
  ur: "سفر میں رنگت کی حفاظت قانون میں"
  es: "Preservar la tez en un viaje por el Canon"
  tr: "İbn Sina'ya göre seyahat sırasında rengin korunması"
  id: "Menjaga warna selama perjalanan menurut Ibn Sina"
summary:
  ar: "يوصي ابن سينا في الفصل السادس بأن يطلى وجه المسافر بالأشياء اللزجة التي فيها تغرية، مثل لعاب بزر قطونا ولعاب العرفج والكثيراء المحلول في الماء والصمغ المحلول في الماء وبياض البيض والكعك السميذ المنقوع في الماء، ويحيل علاج التشقق بالريح أو البرد أو الشمس إلى الكلام في الزينة {cite:canon-ibn-sina-print-v1 p.265}."
  en: "In the sixth chapter Ibn Sina advises coating the traveller's face with viscous substances that act as a glue, such as psyllium mucilage, mucilage of the 'arfaj shrub, tragacanth dissolved in water, gum dissolved in water, egg white and fine wheat cake soaked in water, and refers the treatment of cracking by wind, cold or sun to the discussion of cosmetics {cite:canon-ibn-sina-print-v1 p.265}."
  fr: "Au chapitre 6, Ibn Sina décrit enduits visqueux adhésifs : mucilages de psyllium et d’arfaj, gomme adragante ou gomme dissoutes dans l’eau, blanc d’œuf, galette de froment fin trempée ; les gerçures de vent, froid ou soleil relèvent des cosmétiques {cite:canon-ibn-sina-print-v1 p.265}."
  es: "En el sexto capítulo, Ibn Sina aconseja cubrir el rostro del viajero con sustancias viscosas que actúan como pegamento, como mucílago de psyllium, mucílago del arbusto 'arfaj, tragacanto disuelto en agua, goma disuelta en agua, clara de huevo y torta fina de trigo remojada en agua, y remite el tratamiento de las grietas causadas por el viento, el frío o el sol a la discusión sobre cosméticos {cite:canon-ibn-sina-print-v1 p.265}."
  ur: "چھٹے باب میں ابن سینا مسافر کے چہرے پر چپکنے والے مادوں سے ملمع کرنے کا مشورہ دیتے ہیں جو کہ گوند کا کام کرتے ہیں، جیسے سائیلیم میوسیلج، ارفج کی جھاڑی، پانی میں گھلنے والا مسوڑھ، پانی میں تحلیل شدہ مسوڑھ، انڈے کی سفیدی اور باریک گندم کے کیک کو پانی میں بھگو کر، اور دھوپ میں بھگو کر ٹھنڈا کرنے کے لیے، اور دھوپ کے علاج کے لیے۔ کاسمیٹکس {حوالہ:کینن-ابن سینا-پرنٹ-v1 صفحہ 265}۔"
  tr: "Altıncı bölümde, İbn Sina yolcunun yüzünü pamuk tohumundan tükürük, Arfaj tükürüğü, suda çözünmüş mukus, suda çözünmüş sakız, yumurta akı ve ıslatılmış irmik kekleri gibi baştan çıkarıcı şeylerle kaplamayı önerir. Süslemelerden bahsetmek için rüzgar, soğuk veya güneşle çatlamayı tedavi etmekten bahseder."
  id: "Di bab enam, Avicenna merekomendasikan untuk melapisi wajah pelancong dengan benda-benda lengket yang mengandung godaan, seperti air liur dari biji kapas, air liur dari Arfaj, lendir yang larut dalam air, permen karet yang larut dengan air, putih telur, dan kue semolina yang direndam. Ia merujuk pada cara merawat retak akibat angin, dingin, atau matahari untuk membicarakan perhiasan."
