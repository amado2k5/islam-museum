label: { ar: "حفظ اللون في السفر عند ابن سينا", en: "Preserving the complexion on a journey in the Canon", ur: "سفر میں رنگت کی حفاظت قانون میں" }
summary:
  ar: "يوصي ابن سينا في الفصل السادس بأن يطلى وجه المسافر بالأشياء اللزجة التي فيها تغرية، مثل لعاب بزر قطونا ولعاب العرفج والكثيراء المحلول في الماء والصمغ المحلول في الماء وبياض البيض والكعك السميذ المنقوع في الماء، ويحيل علاج التشقق بالريح أو البرد أو الشمس إلى الكلام في الزينة {cite:canon-ibn-sina-print-v1 p.265}."
  en: "In the sixth chapter Ibn Sina advises coating the traveller's face with viscous substances that act as a glue, such as psyllium mucilage, mucilage of the 'arfaj shrub, tragacanth dissolved in water, gum dissolved in water, egg white and fine wheat cake soaked in water, and refers the treatment of cracking by wind, cold or sun to the discussion of cosmetics {cite:canon-ibn-sina-print-v1 p.265}."
