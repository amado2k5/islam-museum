summary:
  ar: "يفتتح ابن سينا التعليم الثالث، في تدبير المشايخ، وهو ستة فصول، بقول كلي: يرطب المشايخ ويسخنون معاً بإطالة النوم والبقاء في الفراش أكثر من الشبان وبالأغذية والاستحمامات والأشربة، ويدام إدرار بولهم وإخراج البلغم، ويفيدهم الدلك المعتدل بالدهن ثم الركوب أو المشي {cite:canon-ibn-sina-print-v1 p.251}."
  en: "Ibn Sina opens the third teaching, on the regimen of the old, in six chapters, with a general statement: the old are to be moistened and warmed together by longer sleep and more time in bed than the young, and by foods, baths and drinks, with their urine kept flowing and phlegm expelled; moderate rubbing with oil is of great benefit, then riding or walking {cite:canon-ibn-sina-print-v1 p.251}."
