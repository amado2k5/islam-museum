id: concept/canon-general-regimen-of-the-old
class: concept
kind: scientific
label:
  ar: "التدبير الكلي للمشايخ عند ابن سينا"
  en: "The general regimen of the old in the Canon"
  fr: "Régime général des vieillards dans le Canon"
  ur: "بزرگوں کی عمومی تدبیر قانون میں"
  es: "El régimen general de los antiguos en el Canon"
  tr: "İbn Sina'ya göre şeyhlerin genel yönetimi"
  id: "Manajemen keseluruhan para sheikh menurut Ibn Sina"
summary:
  ar: "يفتتح ابن سينا التعليم الثالث، في تدبير المشايخ، وهو ستة فصول، بقول كلي: يرطب المشايخ ويسخنون معاً بإطالة النوم والبقاء في الفراش أكثر من الشبان وبالأغذية والاستحمامات والأشربة، ويدام إدرار بولهم وإخراج البلغم، ويفيدهم الدلك المعتدل بالدهن ثم الركوب أو المشي {cite:canon-ibn-sina-print-v1 p.251}."
  en: "Ibn Sina opens the third teaching, on the regimen of the old, in six chapters, with a general statement: the old are to be moistened and warmed together by longer sleep and more time in bed than the young, and by foods, baths and drinks, with their urine kept flowing and phlegm expelled; moderate rubbing with oil is of great benefit, then riding or walking {cite:canon-ibn-sina-print-v1 p.251}."
  fr: "La troisième leçon, six chapitres sur les vieillards, s’ouvre sur humidification et réchauffement conjoints : davantage de sommeil et de lit que chez les jeunes, aliments, bains, boissons, urine favorisée et phlegme expulsé ; friction modérée à l’huile puis équitation ou marche {cite:canon-ibn-sina-print-v1 p.251}."
  es: "Ibn Sina abre la tercera enseñanza, sobre el régimen de los ancianos, en seis capítulos, con una declaración general: los ancianos deben ser humedecidos y calentados juntos mediante un sueño más prolongado y más tiempo en la cama que los jóvenes, y mediante alimentos, baños y bebidas, manteniendo su orina fluyendo y expulsando la flema; frotarse moderadamente con aceite es de gran beneficio, luego montar a caballo o caminar {cite:canon-ibn-sina-print-v1 p.251}."
  ur: "ابن سینا نے تیسرا درس، پرانے کے طرز عمل پر، چھ ابواب میں، ایک عمومی بیان کے ساتھ کھولا ہے: بوڑھوں کو لمبا نیند اور جوانوں کے مقابلے میں بستر پر زیادہ وقت، کھانے، غسل اور مشروبات کے ذریعے، ان کے پیشاب کو جاری رکھنے اور بلغم کو نکالنے کے ذریعے ایک ساتھ نم اور گرم کیا جانا چاہیے۔ تیل کے ساتھ اعتدال سے مالش کرنے سے بہت فائدہ ہوتا ہے، پھر سواری یا پیدل چلنا۔"
  tr: "İbn Sina, şeyhlerin yönetimiyle ilgili üçüncü öğretiye başladığı altı bölümden oluşuyor ve genel bir ifadeyle başlar: Şeyhler, genç erkeklerden daha uzun uyku süresi uzatarak ve yatakta kalarak, yiyecek, banyo ve içeceklerle birlikte nemlendirir ve ısınır, idrar ve balgamları devam eder, yağla ılımlı masaj ve ardından binmek veya yürümek onlara fayda sağlar {cite:canon-ibn-sina-print-v1 s.251}."
  id: "Ibn Sina membuka ajaran ketiga dalam pengelolaan para sheikh, yang terdiri dari enam bab, dengan pernyataan umum: Para sheikh melembapkan dan menghangatkan tubuh bersama dengan memperpanjang tidur dan lebih sering berbaring di tempat tidur dibandingkan pemuda, serta melalui makanan, mandi, minuman, dan urine serta dahak mereka dilanjutkan, dan pijatan sedang dengan minyak lalu berkuda atau berjalan memberikan manfaat bagi mereka {cite:canon-ibn-sina-print-v1 hlm.251}."
