  ar: "سبب الوجع الضرباني ورم حار لا بارد، إذ البارد لا يوجع إلا أن يستحيل إلى الحار، ويحدث إذا كان العضو المجاور حساساً وقربه شريانات تضرب دائماً {cite:canon-ibn-sina-print-v1 p.150}."
  en: "Throbbing pain is caused by a hot swelling, not a cold one, since a cold swelling does not hurt unless it turns hot; it arises when the neighbouring organ is sensitive and arteries pulse constantly nearby {cite:canon-ibn-sina-print-v1 p.150}."
