id: concept/maratib-al-wahy
class: concept
kind: doctrine
label: { ar: "مراتب الوحي", en: "The modes (ranks) of revelation", es: "Los modos (rangos) de revelación", fr: "Les modes (rangs) de révélation", ur: "وحی کے طریقے ⁦(درجے)⁩" }
summary:
  ar: "أقسام الوحي كما يعدّها ابن القيم وينقلها الرحيق المختوم: الرؤيا الصادقة، وما يلقيه الملك في الروع، وتمثّل الملك رجلاً، ومجيئه في مثل صلصلة الجرس، ورؤية الملك في صورته، وما أُوحي فوق السماوات ليلة المعراج، وكلام الله بلا واسطة؛ وزاد بعضهم مرتبة ثامنة لا يراها المؤلف ثابتة."
  en: "The modes of revelation as Ibn al-Qayyim lists them and al-Raheeq al-Makhtum transmits: true dreams, what the angel casts into the heart, the angel appearing as a man, revelation coming like the ringing of a bell, seeing the angel in his true form, what was revealed above the heavens on the night of the Ascension, and God's speech without an intermediary; some add an eighth mode which the author does not consider established."
  es: "Los modos de revelación, tal como los enumera Ibn al-Qayyim y los transmite al-Raheeq al-Makhtum, son: sueños verdaderos, lo que el ángel infunde en el corazón, la aparición del ángel como un hombre, la revelación que llega como el tañido de una campana, ver al ángel en su verdadera forma, lo que fue revelado sobre los cielos en la noche de la Ascensión y la palabra de Dios sin intermediario; algunos añaden un octavo modo que el autor no considera establecido."
  fr: "Les modes de révélation tels qu'Ibn al-Qayyim les énumère et qu'al-Raheeq al-Makhtum transmet: les rêves véridiques, ce que l'ange dépose dans le cœur, l'apparition de l'ange sous forme humaine, la révélation survenant comme le son d'une cloche, la vision de l'ange sous sa véritable forme, ce qui fut révélé au-dessus des cieux la nuit de l'Ascension, et la parole de Dieu sans intermédiaire; certains ajoutent un huitième mode que l'auteur ne considère pas comme établi."
  ur: "وحی کے طریقے جیسا کہ ابن القیم نے ان کی فہرست دی ہے اور الرحیق المختم منتقل کرتا ہے: سچے خواب، جو فرشتہ دل میں ڈالتا ہے، فرشتہ کا انسان کے طور پر ظاہر ہونا، وحی کا آنا جیسے گھنٹی بجتی ہے، فرشتے کو اس کی حقیقی شکل میں دیکھنا، آسمانوں کے اوپر جو کچھ نازل ہوا ہے، اس کی رات میں بغیر کسی شبیہہ کے آسمانوں پر نازل ہونا۔ کچھ آٹھویں موڈ کا اضافہ کرتے ہیں جسے مصنف نے قائم نہیں سمجھا۔"
