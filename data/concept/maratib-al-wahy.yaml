id: concept/maratib-al-wahy
class: concept
kind: doctrine
label: { ar: "مراتب الوحي", en: "The modes (ranks) of revelation" }
summary:
  ar: "أقسام الوحي كما يعدّها ابن القيم وينقلها الرحيق المختوم: الرؤيا الصادقة، وما يلقيه الملك في الروع، وتمثّل الملك رجلاً، ومجيئه في مثل صلصلة الجرس، ورؤية الملك في صورته، وما أُوحي فوق السماوات ليلة المعراج، وكلام الله بلا واسطة؛ وزاد بعضهم مرتبة ثامنة لا يراها المؤلف ثابتة."
  en: "The modes of revelation as Ibn al-Qayyim lists them and al-Raheeq al-Makhtum transmits: true dreams, what the angel casts into the heart, the angel appearing as a man, revelation coming like the ringing of a bell, seeing the angel in his true form, what was revealed above the heavens on the night of the Ascension, and God's speech without an intermediary; some add an eighth mode which the author does not consider established."
