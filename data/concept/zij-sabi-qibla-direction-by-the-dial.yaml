label: { ar: "سمت القبلة بالرخامة والمثلث الكروي", en: "The qibla direction by the dial and the spherical triangle", ur: "رخامہ اور کروی مثلث سے سمتِ قبلہ", es: "La dirección de la qibla según el dial y el triángulo esférico.", fr: "La direction de la qibla indiquée par le cadran et le triangle sphérique", tr: "Kıble, mermer ve küresel bir üçgenle işaretlenmiştir.", id: "Arah kiblat ditandai dengan marmer dan segitiga berbentuk bola." }
summary:
  ar: "لمعرفة سمت القبلة يخرج خط من مركز الدائرة على الصورة المعروفة، وتُقارن عروض البلد وعرض مكة وطولها وطول المدينة من جداول المدن، فيُعرف الأقرب من الطول، ويُعرف موضع مكة من البلد، شمالاً أو جنوباً، وشرقاً أو غرباً. ثم يُخط خط من تقاطع الطول والعرض على محيط الدائرة إلى المركز، فيكون هو سمت القبلة. {cite:zij-sabi-nallino-byblion pp.210-211}"
  en: "To find the direction of the qibla a line is drawn from the centre of the circle on the known figure. The latitudes of the town and of Makkah, and the longitudes of Makkah and Madinah from the city tables, are compared; the difference in longitude decides on which side of the town Makkah lies, east or west, and north or south of it. The point where the longitude and latitude lines meet on the rim is joined to the centre, and that line is the qibla azimuth. {cite:zij-sabi-nallino-byblion pp.210-211}"
  ur: "سمتِ قبلہ معلوم کرنے کے لیے دائرے کے مرکز سے معروف شکل پر ایک خط کھینچا جاتا ہے۔ شہر کے عرض اور مکہ کے عرض کا، اور شہروں کے جدولوں سے مکہ اور مدینہ کے طول کا موازنہ کیا جاتا ہے؛ طول کا فرق بتاتا ہے کہ مکہ شہر کے مشرق میں ہے یا مغرب میں، اور شمال یا جنوب میں۔ طول اور عرض کی لکیروں کا دائرے کے کنارے پر ملاپ مرکز سے جوڑا جاتا ہے، اور وہی سمتِ قبلہ ہے۔ {cite:zij-sabi-nallino-byblion pp.210-211}"
  es: "Para determinar la dirección de la qibla, se traza una línea desde el centro del círculo en la figura conocida. Se comparan las latitudes de la ciudad y de La Meca, y las longitudes de La Meca y Medina, según las tablas de la ciudad; la diferencia de longitud determina en qué lado de la ciudad se encuentra La Meca: al este o al oeste, y al norte o al sur. El punto donde se cruzan las líneas de longitud y latitud en el borde se une al centro, y esa línea es el acimut de la qibla. {cite:zij-sabi-nallino-byblion pp.210-211}"
  fr: "Pour déterminer la direction de la qibla, on trace une ligne depuis le centre du cercle sur la figure connue. On compare les latitudes de la ville et de La Mecque, ainsi que les longitudes de La Mecque et de Médine, relevées dans les tables des villes; la différence de longitude détermine de quel côté de la ville se situe La Mecque, à l’est ou à l’ouest, et au nord ou au sud. Le point d’intersection des lignes de longitude et de latitude sur le pourtour est relié au centre, et cette ligne correspond à l’azimut de la qibla. {cite:zij-sabi-nallino-byblion pp.210-211}"
  tr: "Namaz yönünü (kıble) belirlemek için, diyagramda gösterildiği gibi bir dairenin merkezinden bir çizgi çizilir. Daha sonra, Mekke şehrinin ve diğer şehrin enlem ve boylamları, şehir tabloları kullanılarak karşılaştırılır. En yakın boylam belirlenir ve Mekke'nin şehre göre konumu (kuzey veya güney, doğu veya batı) tespit edilir. Ardından, dairenin çevresindeki enlem ve boylamın kesişme noktasından merkeze bir çizgi çizilir; bu, namaz yönüdür (kıble). {cite:zij-sabi-nallino-byblion pp.210-211}"
  id: "Untuk menentukan arah kiblat, sebuah garis ditarik dari pusat lingkaran seperti yang ditunjukkan pada diagram. Garis lintang dan garis bujur kota Mekah dan kota tersebut kemudian dibandingkan menggunakan tabel kota. Garis bujur terdekat ditentukan, dan posisi Mekah relatif terhadap kota tersebut diidentifikasi (utara atau selatan, timur atau barat). Kemudian, sebuah garis ditarik dari titik perpotongan garis lintang dan garis bujur pada keliling lingkaran ke pusatnya; inilah arah kiblat. {cite:zij-sabi-nallino-byblion pp.210-211}"
