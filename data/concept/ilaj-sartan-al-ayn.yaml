id: "concept/ilaj-sartan-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "علاج السرطان في العين"
  en: "Treating the eye's cancer"
  ur: "آنکھ کے سرطان کا علاج"
  es: "Tratamiento del cáncer de ojo"
  fr: "Traitement du cancer de l'œil"
summary:
  ar: "إن لم يكن بد من علاجه فليكن الغرض تسكين الوجع وأن ينقى البدن وناحية الرأس من الخلط العكر ويغتذي بالأغذية الجيدة الكيموس الحنطية التي لا تسخين فيها، وشرب اللبن نافع منه، ويستعمل فيه بياض البيض مع إكليل الملك وشيء من زعفران والشياف الأبيض وكل شياف يتخذ مثل النشا والاسفيذاج والصمغ والأفيون وجميع اللواتي تقع فيها سائر الملينات والمخدرات ⁦(أسماء الشيافات ونسخها لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.182}"
  en: "If it must be treated let the aim be soothing the pain: the body and the head region are cleansed of the turbid humour, the patient feeds on good-chyme wheat foods with no heating in them, drinking milk benefits him, and there are used in it egg white with rosemary and a little saffron and the white collyrium, and every collyrium made like starch, ceruse, gum and opium, and all those in which the softening and narcotic kinds occur ⁦(collyrium names and recipes are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.182}"
  ur: "اگر اس کا علاج ناگزیر ہو تو مقصد درد کی تسکین ہو: بدن اور سر کی طرف کو کدور خلط سے صاف کیا جائے، مریض اچھے کیموس والے گیہوں کے کھانے کھائے جن میں حرارت نہ ہو، دودھ پینا اس کے لیے مفید ہے، اور استعمال ہوتا ہے مرغوب کے ساتھ انڈے کی سفیدی اور کچھ زعفران اور سفید شیاف، اور ہر وہ شیاف جو نشاستہ، اسفیداج، صمغ اور افیون جیسی چیزوں سے بنے، اور وہ سب جن میں نرم کرنے والی اور مخدر اقسام ہوں ⁦(شیافوں کے نام اور نسخے منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.182}"
  es: "Si debe tratarse, el objetivo debe ser aliviar el dolor: se limpia el cuerpo y la región de la cabeza del humor turbio, el paciente se alimenta de alimentos de trigo con buen quimo que no produzcan calor, beber leche le beneficia, y en ella se utilizan clara de huevo con romero y un poco de azafrán y el colirio blanco, y todo colirio hecho como almidón, cerusa, goma y opio, y todos aquellos en los que se encuentran los tipos suavizantes y narcóticos (no se incluyen nombres ni recetas de colirios) {cite:canon-ibn-sina-print-v2 p.182}"
  fr: "Si un traitement s'avère nécessaire, son but doit être de soulager la douleur: le corps et la région céphalique sont purifiés des humeurs troubles, le patient se nourrit d'aliments à base de bon chyme et de blé, sans apport calorique, la consommation de lait lui est bénéfique, et l'on utilise dans ce traitement du blanc d'œuf avec du romarin et un peu de safran, ainsi que du collyre blanc et tout collyre de fabrication similaire, comme l'amidon, la céruse, la gomme et l'opium, et tous ceux qui contiennent des substances adoucissantes et narcotiques (les noms et recettes des collyres ne sont pas mentionnés). {cite:canon-ibn-sina-print-v2 p.182}"
