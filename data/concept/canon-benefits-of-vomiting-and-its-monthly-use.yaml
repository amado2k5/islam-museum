id: concept/canon-benefits-of-vomiting-and-its-monthly-use
class: concept
kind: scientific
label:
  ar: "منافع القيء واستعماله في الشهر عند ابن سينا"
  en: "The benefits of vomiting and its monthly use in the Canon"
  fr: "Bienfaits supposés du vomissement et usage mensuel dans le Canon"
  ur: "قانون میں قے کے فوائد اور ماہانہ استعمال"
  es: "Los beneficios del vómito y su uso mensual en el Canon"
  tr: "İbn Sina'ya göre kusmanın faydaları ve ay boyunca kullanımı"
  id: "Manfaat muntah dan penggunaannya selama bulan menurut Ibn Sina"
summary:
  ar: "ينقل ابن سينا أن أبقراط يأمر بالقيء في الشهر يومين متواليين ليتدارك الثاني ما قصر في الأول، ثم يعدد منافعه من استفراغ البلغم والمرة وتنقية المعدة وجلاء البصر ودفع التخمة وغير ذلك، ويرى أن يستعمل مرة أو مرتين في الشهر على الامتلاء من غير دور معلوم {cite:canon-ibn-sina-print-v1 p.287}."
  en: "Ibn Sina reports that Hippocrates orders vomiting on two consecutive days each month so that the second makes good what fell short in the first, lists its benefits (clearing phlegm and bile, cleansing the stomach, brightening sight, driving off indigestion and more), and advises once or twice a month when full, with no fixed cycle {cite:canon-ibn-sina-print-v1 p.287}."
  fr: "Ibn Sina rapporte la prescription d’Hippocrate de vomir deux jours consécutifs chaque mois, le second complétant le premier. Il énumère évacuation du phlegme et de la bile, nettoyage gastrique, éclaircissement de la vue, disparition de l’indigestion et autres bienfaits supposés ; il conseille une ou deux fois par mois en cas de réplétion, sans cycle fixe {cite:canon-ibn-sina-print-v1 p.287}."
  es: "Ibn Sina informa que Hipócrates ordena vomitar dos días consecutivos cada mes para que el segundo compense lo que faltó en el primero, enumera sus beneficios (eliminar la flema y la bilis, limpiar el estómago, mejorar la vista, aliviar la indigestión y más), y aconseja hacerlo una o dos veces al mes cuando se está lleno, sin un ciclo fijo {cite:canon-ibn-sina-print-v1 p.287}."
  ur: "ابن سینا کا بیان ہے کہ ہپوکریٹس ہر مہینے لگاتار دو دن قے کرنے کا حکم دیتا ہے تاکہ دوسرے میں پہلے کی کمی کو ٹھیک کر دے، اس کے فوائد ⁦(بلغم اور پت کو صاف کرنا، معدہ صاف کرنا، نظر کو روشن کرنا، بدہضمی دور کرنا اور بہت کچھ)⁩ بتاتا ہے، اور مہینے میں ایک یا دو بار مشورہ دیتا ہے کہ جب مکمل نہ ہو تو چکر لگاؤ۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 287}۔"
  tr: "İbn Sina, Hipokrat'ın ayda iki gün üst üste kusmayı emrettiğini, ilkinde ise balgam ve acıyı atma, mideyi temizleme, görmeyi netleştirme, aşırı yemeyi önleme gibi faydalarını saydığını bildirir. Ayrıca, bilinmeyen bir rol olmadan doldurmak için ayda bir veya iki kez kullanılmasını önerir {cite:canon-ibn-sina-print-v1 s.287}."
  id: "Ibn Sina melaporkan bahwa Hippocrates memerintahkan muntah dua hari berturut-turut dalam sebulan untuk mengimbangi kekurangan yang terakhir di hari pertama, lalu merinci manfaatnya seperti mengeluarkan dahak dan kepahitan, membersihkan perut, membersihkan penglihatan, mencegah makan berlebihan, dan lainnya. Ia juga merekomendasikan penggunaan sekali atau dua kali sebulan untuk mengisi peran tanpa peran yang diketahui {cite:canon-ibn-sina-print-v1 hlm.287}."
