label: { ar: "منافع القيء واستعماله في الشهر عند ابن سينا", en: "The benefits of vomiting and its monthly use in the Canon", ur: "قانون میں قے کے فوائد اور ماہانہ استعمال" }
summary:
  ar: "ينقل ابن سينا أن أبقراط يأمر بالقيء في الشهر يومين متواليين ليتدارك الثاني ما قصر في الأول، ثم يعدد منافعه من استفراغ البلغم والمرة وتنقية المعدة وجلاء البصر ودفع التخمة وغير ذلك، ويرى أن يستعمل مرة أو مرتين في الشهر على الامتلاء من غير دور معلوم {cite:canon-ibn-sina-print-v1 p.287}."
  en: "Ibn Sina reports that Hippocrates orders vomiting on two consecutive days each month so that the second makes good what fell short in the first, lists its benefits (clearing phlegm and bile, cleansing the stomach, brightening sight, driving off indigestion and more), and advises once or twice a month when full, with no fixed cycle {cite:canon-ibn-sina-print-v1 p.287}."
