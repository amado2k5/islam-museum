  ur: فرشتے جو لیلت القدر میں روح کے ساتھ اپنے رب کے حکم سے ہر معاملے میں سلام لے کر اترتے ہیں، جیسا کہ [[passage/quran-97-4|القدر 4]] میں ہے؛
    یہ زمین کے لوگوں پر فرشتوں کے نزول کی عظیم ترین مواقع میں سے ہے۔
