id: concept/malaikat-laylat-al-qadr
class: concept
kind: angel
label:
  ar: ملائكة ليلة القدر
  en: The Angels of Laylat al-Qadr
  ur: لیلت القدر کے فرشتے
  es: "Los ángeles de Laylat al-Qadr"
  fr: "Les Anges de Laylat al-Qadr"
summary:
  ar: ملائكة ينزلون مع الروح في ليلة القدر بإذن ربهم من كل أمر سلام، كما في قوله تعالى [[passage/quran-97-4|القدر 4]]؛ وهو من أعظم مواطن نزول الملائكة على أهل الأرض.
  en: Angels who descend with the Spirit on Laylat al-Qadr by their Lord's leave, with peace on every matter, as in [[passage/quran-97-4|al-Qadr 4]]; it is among the greatest instances of angels descending upon the earth's people.
  ur: فرشتے جو لیلت القدر میں روح کے ساتھ اپنے رب کے حکم سے ہر معاملے میں سلام لے کر اترتے ہیں، جیسا کہ [[passage/quran-97-4|القدر 4]] میں ہے؛ یہ زمین کے لوگوں پر فرشتوں کے نزول کی عظیم ترین مواقع میں سے ہے۔
  es: "Ángeles que descienden con el Espíritu en Laylat al-Qadr con el permiso de su Señor, con paz en todo asunto, como en [[passage/quran-97-4|al-Qadr 4]]; es uno de los mayores ejemplos de ángeles que descienden sobre la gente de la tierra."
  fr: "Les anges qui descendent avec l'Esprit sur Laylat al-Qadr par la permission de leur Seigneur, avec la paix sur toute chose, comme dans [[passage/quran-97-4|al-Qadr 4]]; c'est parmi les plus grands exemples d'anges descendant sur les habitants de la terre."
