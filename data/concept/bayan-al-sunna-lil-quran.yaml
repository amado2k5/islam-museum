label:
  ar: بيان السنة للقرآن
  en: The Sunna as explanation of the Qur'an
summary:
  ar: "يرى الشيخ علي الخفيف أن القرآن هو الأصل والأساس، وأن السنة تابعة له مبينة له لا تخالفه: تفصّل مجمله، كبيان هيئات الصلاة والزكاة والحج، وتقيّد مطلقه، كتقييد الوصية بغير الوارث، وتخصّص عامه، كإخراج ما حرم بالرضاع وجمع المرأة مع عمتها أو خالتها من عموم ما أُحل، وتوضح مشكله {cite:makanat-al-sunna-azhar p. 30}{cite:makanat-al-sunna-azhar p. 31}. ويقرر أن القرآن مقطوع بورود جملته وتفصيله، والسنة مظنونة الورود تفصيلًا، فلا يُقطع بنسبة حديث معين إلى النبي إلا إذا كان متواترًا {cite:makanat-al-sunna-azhar p. 32}. ويذكر أن الصحابة بعد وفاة النبي كانوا يطلبون الحكم في الكتاب، ثم في السنة، ثم يجتهدون، واستدل بحديث معاذ بن جبل في بعث اليمن، وناقش ما قيل في اتصاله، ودافع عنه بشهرة أصحاب معاذ {cite:makanat-al-sunna-azhar p. 33}{cite:makanat-al-sunna-azhar p. 34}{cite:makanat-al-sunna-azhar p. 35}. وذكر أن الخلاف في نسخ القرآن بالسنة قائم، وأن المانعين لذلك يستدلون بآيتي الوصية والجلد، وأن الكثرة من العلماء ترى عدم النسخ في هذه الآيات، وينقل عن الشاطبي في الموافقات أن البحث في جواز نسخ القرآن بالسنة بحث في غير واقع {cite:makanat-al-sunna-azhar p. 36}{cite:makanat-al-sunna-azhar p. 37}. وما ورد من خبر يعارض أصول القرآن وأحكامه يُرد، لأن ذلك من أوجه الطعن فيه {cite:makanat-al-sunna-azhar p. 38}."
