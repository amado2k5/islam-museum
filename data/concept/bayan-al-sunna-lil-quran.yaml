id: concept/bayan-al-sunna-lil-quran
class: concept
kind: term
label:
  ar: بيان السنة للقرآن
  en: The Sunna as explanation of the Qur'an
  fr: "La Sunna comme explication du Coran"
  es: "La Sunna como explicación del Corán"
  ur: "قرآن کی تفسیر کے طور پر سنت"
summary:
  ar: "يرى الشيخ علي الخفيف أن القرآن هو الأصل والأساس، وأن السنة تابعة له مبينة له لا تخالفه: تفصّل مجمله، كبيان هيئات الصلاة والزكاة والحج، وتقيّد مطلقه، كتقييد الوصية بغير الوارث، وتخصّص عامه، كإخراج ما حرم بالرضاع وجمع المرأة مع عمتها أو خالتها من عموم ما أُحل، وتوضح مشكله {cite:makanat-al-sunna-azhar p. 30}{cite:makanat-al-sunna-azhar p. 31}. ويقرر أن القرآن مقطوع بورود جملته وتفصيله، والسنة مظنونة الورود تفصيلًا، فلا يُقطع بنسبة حديث معين إلى النبي إلا إذا كان متواترًا {cite:makanat-al-sunna-azhar p. 32}. ويذكر أن الصحابة بعد وفاة النبي كانوا يطلبون الحكم في الكتاب، ثم في السنة، ثم يجتهدون، واستدل بحديث معاذ بن جبل في بعث اليمن، وناقش ما قيل في اتصاله، ودافع عنه بشهرة أصحاب معاذ {cite:makanat-al-sunna-azhar p. 33}{cite:makanat-al-sunna-azhar p. 34}{cite:makanat-al-sunna-azhar p. 35}. وذكر أن الخلاف في نسخ القرآن بالسنة قائم، وأن المانعين لذلك يستدلون بآيتي الوصية والجلد، وأن الكثرة من العلماء ترى عدم النسخ في هذه الآيات، وينقل عن الشاطبي في الموافقات أن البحث في جواز نسخ القرآن بالسنة بحث في غير واقع {cite:makanat-al-sunna-azhar p. 36}{cite:makanat-al-sunna-azhar p. 37}. وما ورد من خبر يعارض أصول القرآن وأحكامه يُرد، لأن ذلك من أوجه الطعن فيه {cite:makanat-al-sunna-azhar p. 38}."
  fr: "Ali al-Khafif tient le Coran pour origine et fondement, la Sunna lui étant subordonnée et l’expliquant sans le contredire : elle détaille ses formulations globales, notamment les modalités de la prière, de la zakat et du pèlerinage ; restreint l’absolu, comme le legs aux non-héritiers ; particularise le général en excluant des unions permises celles interdites par l’allaitement ou réunissant une femme et sa tante paternelle ou maternelle ; et éclaircit l’obscur {cite:makanat-al-sunna-azhar p. 30}{cite:makanat-al-sunna-azhar p. 31}. Il affirme la certitude de la transmission coranique, globale et détaillée, mais le caractère probable de celle de la Sunna dans ses détails : seul un hadith mutawatir peut être attribué avec certitude au Prophète {cite:makanat-al-sunna-azhar p. 32}. Il dit qu’après sa mort les Compagnons cherchaient le jugement dans le Livre, puis la Sunna, puis raisonnaient. Il invoque le récit de Mu'adh ibn Jabal envoyé au Yémen, discute sa continuité et le défend par la notoriété des compagnons de Mu'adh {cite:makanat-al-sunna-azhar p. 33}{cite:makanat-al-sunna-azhar p. 34}{cite:makanat-al-sunna-azhar p. 35}. Il mentionne la divergence sur l’abrogation du Coran par la Sunna : ses adversaires invoquent les versets du legs et de la flagellation ; la majorité des savants ne reconnaît pas d’abrogation dans ces versets. Il rapporte d’al-Shatibi, dans al-Muwafaqat, que discuter cette possibilité revient à discuter d’un cas inexistant {cite:makanat-al-sunna-azhar p. 36}{cite:makanat-al-sunna-azhar p. 37}. Tout récit contredisant les fondements et règles du Coran est rejeté, cette contradiction étant un motif de critique du récit {cite:makanat-al-sunna-azhar p. 38}."
