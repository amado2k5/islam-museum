id: concept/bayan-al-sunna-lil-quran
class: concept
kind: term
label:
  ar: بيان السنة للقرآن
  en: The Sunna as explanation of the Qur'an
  fr: "La Sunna comme explication du Coran"
  es: "La Sunna como explicación del Corán"
  ur: "قرآن کی تفسیر کے طور پر سنت"
  tr: "Kur'an'ın Sünnetinin Açıklaması"
  id: "Penjelasan Sunnah dalam Al-Qur'an"
summary:
  ar: "يرى الشيخ علي الخفيف أن القرآن هو الأصل والأساس، وأن السنة تابعة له مبينة له لا تخالفه: تفصّل مجمله، كبيان هيئات الصلاة والزكاة والحج، وتقيّد مطلقه، كتقييد الوصية بغير الوارث، وتخصّص عامه، كإخراج ما حرم بالرضاع وجمع المرأة مع عمتها أو خالتها من عموم ما أُحل، وتوضح مشكله {cite:makanat-al-sunna-azhar p. 30}{cite:makanat-al-sunna-azhar p. 31}. ويقرر أن القرآن مقطوع بورود جملته وتفصيله، والسنة مظنونة الورود تفصيلًا، فلا يُقطع بنسبة حديث معين إلى النبي إلا إذا كان متواترًا {cite:makanat-al-sunna-azhar p. 32}. ويذكر أن الصحابة بعد وفاة النبي كانوا يطلبون الحكم في الكتاب، ثم في السنة، ثم يجتهدون، واستدل بحديث معاذ بن جبل في بعث اليمن، وناقش ما قيل في اتصاله، ودافع عنه بشهرة أصحاب معاذ {cite:makanat-al-sunna-azhar p. 33}{cite:makanat-al-sunna-azhar p. 34}{cite:makanat-al-sunna-azhar p. 35}. وذكر أن الخلاف في نسخ القرآن بالسنة قائم، وأن المانعين لذلك يستدلون بآيتي الوصية والجلد، وأن الكثرة من العلماء ترى عدم النسخ في هذه الآيات، وينقل عن الشاطبي في الموافقات أن البحث في جواز نسخ القرآن بالسنة بحث في غير واقع {cite:makanat-al-sunna-azhar p. 36}{cite:makanat-al-sunna-azhar p. 37}. وما ورد من خبر يعارض أصول القرآن وأحكامه يُرد، لأن ذلك من أوجه الطعن فيه {cite:makanat-al-sunna-azhar p. 38}."
  fr: "Ali al-Khafif tient le Coran pour origine et fondement, la Sunna lui étant subordonnée et l’expliquant sans le contredire : elle détaille ses formulations globales, notamment les modalités de la prière, de la zakat et du pèlerinage ; restreint l’absolu, comme le legs aux non-héritiers ; particularise le général en excluant des unions permises celles interdites par l’allaitement ou réunissant une femme et sa tante paternelle ou maternelle ; et éclaircit l’obscur {cite:makanat-al-sunna-azhar p. 30}{cite:makanat-al-sunna-azhar p. 31}. Il affirme la certitude de la transmission coranique, globale et détaillée, mais le caractère probable de celle de la Sunna dans ses détails : seul un hadith mutawatir peut être attribué avec certitude au Prophète {cite:makanat-al-sunna-azhar p. 32}. Il dit qu’après sa mort les Compagnons cherchaient le jugement dans le Livre, puis la Sunna, puis raisonnaient. Il invoque le récit de Mu'adh ibn Jabal envoyé au Yémen, discute sa continuité et le défend par la notoriété des compagnons de Mu'adh {cite:makanat-al-sunna-azhar p. 33}{cite:makanat-al-sunna-azhar p. 34}{cite:makanat-al-sunna-azhar p. 35}. Il mentionne la divergence sur l’abrogation du Coran par la Sunna : ses adversaires invoquent les versets du legs et de la flagellation ; la majorité des savants ne reconnaît pas d’abrogation dans ces versets. Il rapporte d’al-Shatibi, dans al-Muwafaqat, que discuter cette possibilité revient à discuter d’un cas inexistant {cite:makanat-al-sunna-azhar p. 36}{cite:makanat-al-sunna-azhar p. 37}. Tout récit contredisant les fondements et règles du Coran est rejeté, cette contradiction étant un motif de critique du récit {cite:makanat-al-sunna-azhar p. 38}."
  tr: "Şeyh Ali Al-Kizik, Kur'an'ın temel ve temel olduğunu, Sünnet'in ise ona tabi olduğunu, onu çelişmeden açıkladığını düşünür: namaz, zekat ve hac biçimlerini açıklar ve mutlak hükmünü kısıtlar, örneğin vasiyeti varis olmayanlarla sınırlar, genel olarak emzirme ve kadını baba tarafından teyzesi veya teyzesiyle birleştirerek yasak olanı dışlamak gibi genel hükmünü belirtir ve sorununu açıklar {alıntı:Makanat-al-Sunna-Azhar s. 30}{atıf:Makanat-al-sunna-Azhar s. 31}. Kur'an'ın genel ve ayrıntılı rivayetiyle parçalandığını, Sünnet'in ise ayrıntılı olduğu varsayıldığından, belirli bir hadisi Peygamber'e atfetmek kesin değildir, ancak mütevatire ait değilse {atıf:Makanat-al-sunna-azhar s. 32}. Peygamber'in ölümünden sonra Sahabelerin önce Kitap'a, sonra Sünnet'e, sonra da ectihat üzerine hükmetmeye çalıştıkları belirtilir. Mühd bin Cebel'in Yemen'in dirilişi hakkındaki hadislerini aktardı, bağlantısı hakkında söylenenleri tartıştı ve Muadh'ın sahabelerinin ünü ile savundu {alıntı:) Makanat-al-sunna-azhar, s. 33}{atıf:Makanat-al-sunna-azhar, s. 34}{atıf:Makanat-al-sunna-azhar, s. 35}. Kur'an'ın Sünnet tarafından kaldırılması konusundaki anlaşmazlığın var olduğunu, itiraz edenlerin 'irade' ve 'kırbaçlama' ayetlerini kanıt olarak gösterdiğini, birçok alimin ise bu ayetlerin iptal edilmediğine inandığını belirtti. Al-Muwafaqa'da Al-Shatibi, Kur'an'ın Sünnet'in Sünnet'in kaldırılmasının izinliliği üzerine yapılan araştırmaların gerçekçi olmayan bir çalışma olduğunu söyler. {atıf:Makanat-al-sunna-azhar s. 36}{cite:Makanat-al-sunna-azhar s. 37}. Kur'an'ın ilke ve hükümleriyle çelişen herhangi bir rapor reddedilir, çünkü bu eleştiri gerekçelerinden biridir {atıf:makanat-al-sunna-azhar s. 38}."
  id: "Sheikh Ali Al-Khafif percaya bahwa Al-Qur'an adalah dasar dan dasar, dan bahwa Sunnah berada di bawahnya, menjelaskannya tanpa bertentangan: Al-Qur'an merinci secara keseluruhan, seperti menjelaskan bentuk shalat, zakat, dan Haji, serta membatasi keputusannya secara mutlak, seperti membatasi kehendak kepada yang bukan ahli waris dan menetapkan keluasannya, seperti mengeluarkan apa yang dilarang dengan menyusui dan menggabungkan seorang wanita dengan bibi dari pihak ayah atau bibi dari pihak ibu dari apa yang diperbolehkan, dan memperjelas masalahnya {cite:makanat-al-sunna-azhar hlm. 30}{cite:makanat-al-sunna-azhar hlm. 31}. Ia menetapkan bahwa Al-Qur'an terfragmentasi oleh riwayat umum dan rinci, dan Sunnah dianggap rinci, sehingga tidak pasti untuk mengaitkan hadits tertentu kepada Nabi kecuali itu mutawatir {cite:makanat-al-sunna-azhar hlm. 32}. Disebutkan bahwa setelah wafatnya Nabi, para Sahabat berusaha memerintah atas Kitab, kemudian dalam Sunnah, kemudian atas ijtihad. Ia mengutip hadis Muadh ibn Jabal tentang kebangkitan Yaman, membahas apa yang dikatakan tentang hubungannya, dan membelanya dengan ketenaran para sahabat Mu'adh {cite:makanat-al-sunna-azhar, hlm. 33}{sitasi:makanat-al-sunna-azhar, hlm. 34}{sitasi:makanat-al-sunna-azhar, hlm. 35}. Ia menyebutkan bahwa ada perselisihan mengenai pembatalan Al-Qur'an oleh Sunnah, dan bahwa mereka yang keberatan mengutip ayat-ayat 'kehendak' dan 'cambuk' sebagai bukti, dan banyak ulama percaya ayat-ayat tersebut tidak dibatalkan. Al-Shatibi dikutip dalam Al-Muwafaqat mengatakan bahwa penelitian tentang kelayakan pembatalan Al-Qur'an oleh Sunnah adalah studi yang tidak realistis {cite:makanat-al-sunna-azhar hlm. 36}{cite:makanat-al-sunna-azhar hlm. 37}. Setiap laporan yang bertentangan dengan prinsip dan aturan Al-Qur'an ditolak, karena itu adalah salah satu alasan kritik {cite:makanat-al-sunna-azhar hlm. 38}."
