summary:
  ar: "يصف قعدات الشيوعية بأنها جاءت لإصلاح حال العمال فأفسدته، لأنها تطلب الإصلاح المادي وحده وتهمل الجانب الروحي {cite:qadan-manhaj-iqtisad-quran p. 15}. ويعرض من أصولها أن هاجسها حقوق العمال، وأنها نقلت السلطة من الفرد إلى الطبقة، وانتزعت الملكية الخاصة من الأفراد {cite:qadan-manhaj-iqtisad-quran p. 15}. وينقل قولاً منسوباً إلى كارل ماركس «الدين أفيون الشعوب»، ويرى أن الشيوعية أنكرت الدين والعقيدة جملة وتفصيلاً {cite:qadan-manhaj-iqtisad-quran p. 15}{cite:qadan-manhaj-iqtisad-quran p. 16}."
