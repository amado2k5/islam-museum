label:
  ar: الشيوعية في نقد قعدات
  en: Communism as criticised by Qa'dat
  es: "El comunismo, según las críticas de Qa'dat"
  fr: "Le communisme critiqué par Qa'dat"
  ur: "کمیونزم جیسا کہ قدات نے تنقید کی۔"
  tr: "Toplantıların Eleştirisinde Komünizm"
  id: "Komunisme dalam Kritik terhadap Pertemuan"
summary:
  ar: "يصف قعدات الشيوعية بأنها جاءت لإصلاح حال العمال فأفسدته، لأنها تطلب الإصلاح المادي وحده وتهمل الجانب الروحي {cite:qadan-manhaj-iqtisad-quran p. 15}. ويعرض من أصولها أن هاجسها حقوق العمال، وأنها نقلت السلطة من الفرد إلى الطبقة، وانتزعت الملكية الخاصة من الأفراد {cite:qadan-manhaj-iqtisad-quran p. 15}. وينقل قولاً منسوباً إلى كارل ماركس «الدين أفيون الشعوب»، ويرى أن الشيوعية أنكرت الدين والعقيدة جملة وتفصيلاً {cite:qadan-manhaj-iqtisad-quran p. 15}{cite:qadan-manhaj-iqtisad-quran p. 16}."
  tr: "Komünist ayaklanmaları işçilerin durumunu düzeltmek için gelmiş ama onu yozlaştıran olarak tanımlar; çünkü sadece maddi reform talep ederler ve manevi yönü ihmal ederler {cite:qadan-manhaj-iqtisad-kur'an s. 15}. Kökenlerinden itibaren işçilerin hakları olduğunu, gücü bireyden sınıfa devrettiklerini ve özel mülkiyetin bireylerden alındığını {cite:qadan-manhaj-iqtisad-kur'an s. 15} Karl Marx'a atfedilen bir sözü alıntılar: \"Din, halkların afyonudur,\" ve komünizmin din ve doktrini tamamen reddettiğine inanır {cite:qadan-manhaj-iqtisad-kuran s. 15}{cite:qadan-manhaj-iqtisad-kur'an s. 16}."
  id: "Pemberontakan komunis digambarkan datang untuk memperbaiki kondisi pekerja tetapi merusak mereka; karena mereka hanya menuntut reformasi material dan mengabaikan aspek spiritual {cite:qadan-manhaj-iqtisad-qur'an hlm. 15}. Dari asal-usulnya, pekerja memiliki hak, kekuasaan dialihkan dari individu ke kelas, dan kepemilikan pribadi diambil dari individu {cite:qadan-manhaj-iqtisad-qur'an hlm. 15} mengutip pepatah yang dikaitkan dengan Karl Marx: \"Agama adalah opium bangsa-bangsa,\" dan ia percaya bahwa komunisme sepenuhnya menolak agama dan doktrin {cite:qadan-manhaj-iqtisad-quran hlm. 15}{cite:qadan-manhaj-iqtisad-qur'an hlm. 16}."
