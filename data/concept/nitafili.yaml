label:
  ar: "نيطافيلي"
  en: "Nitafili (the five-leaved spurge)"
  ur: "نیطافیلی"
  es: "Nitafili (la euforbia de cinco hojas)"
  fr: "Nitafili (l'euphorbe à cinq feuilles)"
summary:
  ar: "نيطافيلي في الكتاب هو اليتوع المسمى بخمسة أوراق، قوي التجفيف بلا حدة ولا لذع، يضمد به للنزف فيقطعه ولكثير من الأورام والخنازير، وينفع المفاصل وعرق النسا وأمراض الفم والكبد، وعصارة أصله دواء قتال {cite:canon-ibn-sina-print-v1 p.583}."
  en: "Nitafili is in the book the spurge called five-leaved, strongly drying without sharpness or sting; it is applied as a poultice to stop bleeding and for many swellings and scrofula, it helps the joints, sciatica and ailments of the mouth and liver, and the juice of its root is a deadly drug {cite:canon-ibn-sina-print-v1 p.583}."
  ur: "نیطافیلی کتاب میں وہ یتوع ہے جسے پانچ پتوں والا کہا جاتا ہے، بغیر تیزی اور چبھن کے سخت خشک کرنے والا؛ خون بہنے کو روکنے اور بہت سے ورموں اور غدود کے لیے لیپ کیا جاتا ہے، جوڑوں، عرق النسا اور منہ و جگر کی بیماریوں میں مفید ہے، اور اس کی جڑ کا عرق مہلک دوا ہے {cite:canon-ibn-sina-print-v1 p.583}۔"
  es: "Nitafili es en el libro la euforbia llamada de cinco hojas, fuertemente secante sin agujetas ni picazón; se aplica como cataplasma para detener hemorragias y para muchas hinchazones y escrófulas, ayuda a las articulaciones, la ciática y las dolencias de la boca y el hígado, y el jugo de su raíz es una droga mortal {cite:canon-ibn-sina-print-v1 p.583}."
  fr: "Nitafili est dans le livre l'euphorbe appelée à cinq feuilles, fortement asséchante sans piquant ni piqûre; elle est appliquée en cataplasme pour arrêter les saignements et pour de nombreux gonflements et scrofules, elle aide les articulations, la sciatique et les affections de la bouche et du foie, et le jus de sa racine est un médicament mortel {cite:canon-ibn-sina-print-v1 p.583}."
