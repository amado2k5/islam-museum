summary:
  ar: "رابغ واد بين الحرمين قرب البحر، موضع معروف قريب من الجحفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} والجحفة كانت ميقات أهل الشام ومصر والمغرب، وقد اندثرت منذ زمن بعيد، فصار الحجاج يُحرمون من رابغ احتياطا، وتقع قبل الجحفة بقليل لمن يقدم من المدينة، وتبعد عن مكة نحو مائتين وعشرين كيلومترا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  en: "Rabigh is a valley between the two sanctuaries near the sea, a known place close to al-Juhfa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} Al-Juhfa was the miqat for the people of Greater Syria, Egypt and the Maghrib; it has long since disappeared, so pilgrims from those lands take ihram from Rabigh out of caution. It lies a little before al-Juhfa for those coming from Medina, about 220 kilometres from Mecca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
