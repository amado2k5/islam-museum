label:
  ar: "رابغ"
  en: "Rabigh (the place near al-Juhfa, a station for pilgrims from Medina)"
  ur: "رابغ"
  es: "Rabigh (el lugar cerca de al-Juhfa, una estación para peregrinos procedentes de Medina)"
  fr: "Rabigh (l'endroit près d'al-Juhfa, une station pour les pèlerins venant de Médine)"
summary:
  ar: "رابغ واد بين الحرمين قرب البحر، موضع معروف قريب من الجحفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} والجحفة كانت ميقات أهل الشام ومصر والمغرب، وقد اندثرت منذ زمن بعيد، فصار الحجاج يُحرمون من رابغ احتياطا، وتقع قبل الجحفة بقليل لمن يقدم من المدينة، وتبعد عن مكة نحو مائتين وعشرين كيلومترا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  en: "Rabigh is a valley between the two sanctuaries near the sea, a known place close to al-Juhfa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} Al-Juhfa was the miqat for the people of Greater Syria, Egypt and the Maghrib; it has long since disappeared, so pilgrims from those lands take ihram from Rabigh out of caution. It lies a little before al-Juhfa for those coming from Medina, about 220 kilometres from Mecca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  es: "Rabigh es un valle situado entre los dos santuarios, cerca del mar, un lugar conocido próximo a al-Juhfa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567} Al-Juhfa era el miqat para la gente de la Gran Siria, Egipto y el Magreb; hace mucho que desapareció, por lo que los peregrinos de esas tierras toman el ihram en Rabigh por precaución. Se encuentra un poco antes de al-Juhfa para quienes vienen de Medina, a unos 220 kilómetros de La Meca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8567}"
  fr: "Rabigh est une vallée située entre les deux sanctuaires près de la mer, un lieu connu à proximité d'al-Juhfa. Al-Juhfa était le miqat pour les populations de la Grande Syrie, de l'Égypte et du Maghreb; il a disparu depuis longtemps, aussi les pèlerins venant de ces régions prennent l'ihram à Rabigh par précaution. Ce lieu se trouve un peu avant al-Juhfa pour ceux qui viennent de Médine, à environ 220 kilomètres de La Mecque."
