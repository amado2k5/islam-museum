label:
  ar: "كلام كلي في معالجات أورام الحلق"
  en: "The general discourse on treating the throat's tumours"
  ur: "حلق کی سوجنوں کے علاج پر کلی کلام"
  es: "Discurso general sobre el tratamiento de los tumores de garganta"
  fr: "Le discours général sur le traitement des tumeurs de la gorge"
  tr: "Boğaz tümörü tedavileri hakkında genel konuşma"
  id: "Pembicaraan umum tentang pengobatan tumor tenggorokan"
summary:
  ar: "في معالجات الأورام العارضة في نواحي الحلق والحنجرة والغدد التي تطيف بها واللهاة والغلصمة واللوزتين يجب أن يستفرغ أول كل شيء المادة الفاعلة لذلك بالفصد والإسهال وأن تجذب المادة إلى الجهة المخالفة ولو بالمحاجم توضع على المواضع البعيدة المقابلة لها وربط الأطراف ربطاً مؤلماً وأن يبتدأ بالأدوية القابضة ممزوجة بما له قليل جلاء كالعسل، والمبادرة إلى التغرغر بالخل كما يبتدئ ورم اللهاة أو خناق مما يمنع ويردع ويجلب رطوبة كثيرة ويكون معه امتناع ما كاد يحدث ⁦(محمول على أنه وصف الكتاب والأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.291}"
  en: "In treating the tumours befalling the quarters of the throat, the larynx, the glands about them, the uvula, the epiglottis and the tonsils: the doing matter must first of all be evacuated by venesection and purging, the matter drawn to the opposite side — if only by cupping-glasses set on the far opposite places and a painful binding of the limbs — and begun with the astringent drugs mixed with what has a little cleansing like honey. And hastening to gargle with vinegar as a tumour of the uvula or a quinsy begins is what prevents and repels, drawing much moisture, and with it what was about to arise is averted (carried as the book's description; the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.291}"
  ur: "حلق حنجرے ان کے گرد کی گلٹیوں لہات غلصمہ اور لوزتین کے علاقوں میں عارض ہونے والی سوجنوں کے علاج میں ہر چیز سے پہلے اس عمل کرنے والے مادے کا فصد اور اسہال سے استفراغ لازم ہے اور مادے کو مخالف طرف کھینچنا — خواہ دور مقابل مقامات پر محاجم رکھ کر اور اعضاء کی دردناک باندھ کر — اور آغاز قابض ادویہ سے ہونا چاہیے جن میں ہلکا جلاء دینے والی چیز جیسے شہد ملا ہو؛ اور لہات کی سوجن یا خناق کے آغاز میں سرکے کے غرارے کی طرف جلدی کرنا روکتا اور دفع کرتا ہے، کافی رطوبت لاتا ہے اور جو ہونے والا تھا اسے روک دیتا ہے ⁦(کتاب کے وصف پر محمول؛ اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.291}"
  es: "En el tratamiento de los tumores que afectan a los cuartos de la garganta, la laringe, las glándulas circundantes, la úvula, la epiglotis y las amígdalas: primero se debe evacuar la materia afectada mediante flebotomía y purga, luego desplazarla hacia el lado opuesto —aunque sea con ventosas colocadas en los extremos opuestos y una dolorosa venda de las extremidades— y comenzar con medicamentos astringentes mezclados con algo que tenga un poco de limpieza, como la miel. Y apresurarse a hacer gárgaras con vinagre cuando comienza un tumor de la úvula o un absceso periamigdalino es lo que previene y repele, extrayendo mucha humedad, y con ello se evita lo que estaba a punto de surgir (según la descripción del libro; se omiten los nombres de este tipo) {cite:canon-ibn-sina-print-v2 p.291}"
  fr: "Pour traiter les tumeurs affectant les quartiers de la gorge, le larynx, les ganglions environnants, la luette, l'épiglotte et les amygdales: il faut d'abord évacuer la substance active par saignées et purges, puis la déplacer du côté opposé – ne serait-ce que par ventouses placées aux extrémités opposées et par une contention douloureuse des membres – et commencer le traitement par des médicaments astringents mélangés à un produit légèrement purifiant comme le miel. Dès l'apparition d'une tumeur de la luette ou d'un angine, il est important de se gargariser rapidement avec du vinaigre pour prévenir et repousser l'infection, en attirant l'humidité et en évitant ainsi ce qui était sur le point de se développer (extrait de la description du livre; les noms de ce type de tumeurs sont omis). {cite:canon-ibn-sina-print-v2 p.291}"
  tr: "Boğaz, gırtlak, çevresindeki bezler, uvula, skuamoz ve bademcikler etrafındaki semptomatik tümörlerin tedavisinde, flebite ve ishale neden olan ilk şey atılmalı ve madde karşı tarafa, diyaframlarla birlikte çekilmeli, uzak zıt bölgelere uygulanmalı, uzuvlarla acı verici şekilde bağlanmalıdır; önce büzücü ilaçlar ve hafif berrak maddeler (bal gibi) ve uvula veya difteri başladığında sirkeyle gargara başlatılmalıdır; bu, çok fazla nemi önler, engeller ve getirir, beraberinde de olacakların önlenmesini sağlar (kitabın açıklaması olarak alınır ve bu cinsin isimleri sunulur) {cite:canon-ibn-sina-print-v2 s.291}"
  id: "Dalam pengobatan tumor simptomatik di sekitar tenggorokan, laring, kelenjar di sekitarnya, uvula, skuamia, dan amandel, hal pertama yang menyebabkan flebitis dan diare harus dikeluarkan, dan zat tersebut harus ditarik ke sisi berlawanan, bahkan dengan diafragma, diaplikasikan pada area yang berlawanan, diikat dengan menyakitkan dengan anggota tubuh, dimulai dengan obat astringen yang dicampur zat bening sedikit seperti madu, dan memulai kumur dengan cuka seperti saat uvula atau difteri dimulai, yang mencegah, menghalangi, dan membawa banyak kelembapan, serta dengan itu menghindari apa yang akan terjadi (diambil sebagai deskripsi buku dan nama-nama genus ini disajikan) {cite:canon-ibn-sina-print-v2 hlm.291}"
