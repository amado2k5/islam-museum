summary:
  ar: "موضوع العلم الذي وضعه ابن خلدون، وهو الاجتماع الإنساني، وبين أن الإنسان مدني بالطبع أي لا بد له من الاجتماع، إذ قدرة الواحد قاصرة عن تحصيل قوته من الحنطة ولو فرض أقل ما يمكن لما يحتاج إليه من الطحن والعجن والطبخ وآلات من حداد ونجار وفاخوري فضلاً عن الزراعة والحصاد والدراس، فلا بد من اجتماع القدر الكثير ليحصل بالتعاون قدر الكفاية لأكثر منهم بأضعاف، وكذلك الدفاع عن النفس إذ جعل الله لكل حيوان عضواً يختص بمدافعته وجعل للإنسان عضواً من ذلك الفكر واليد فاليد مهيئة للصنائع بخدمة الفكر والصنائع تحصل له الآلات التي تنوب عن الجوارح مثل الرماح التي تنوب عن القرون والسيوف النائبة عن المخالب والتراس النائبة عن البرشات على ما ذكره جالينوس في كتاب منافع الأعضاء، وإذا حصل الاجتماع فلا بد من وازع يدفع بعضهم عن بعض لما في طباعهم من العدوان، وبين ابن خلدون أن وجوب النبوات ليس بعقلي وإنما مدركه الشرع كما هو مذهب السلف {cite:muqaddima-ibn-khaldun p. 48-49}. وبين أن الحضارة غاية العمران ونهاية لعمره وأنها مؤذنة بفساده كما أن الأربعين غاية في تزايد قوى الإنسان ثم تأخذ في الانحطاط، فإذا حصل الترف والنعمة دعا إلى التفنن في الصنائع وطاعة الشهوات فتعظم النفقات وتزيدها المكوس غلاءً فيعود ذلك على البياعات بالغلاء وتكسد الأسواق ويغلب على أهل المدينة الفقر، وفي الأشخاص يكثر الفسق والكذب والمقامرة والغش والخلابة والفجور في الإيمان ويستحكم المكر والخديعة، وتطبيقاً لقوله تعالى وإذا أردنا أن نهلك قرية أمرنا مترفيها ففسقوا فيها، ومن هنا مثل أهل الخواص أن المدينة إذا كثر فيها غرس النارنج تأذنت بالخراب لأن النارنج والدفلى من توابع الحضارة مما لا طعم فيه ولا منفعة إنما يقصد بها أشكالها وهو الطور الذي يخشى معه هلاك المصر {cite:muqaddima-ibn-khaldun p. 366-368}"
  en: "Ibn Khaldun's science of civilisation: humans are civic by nature — one man cannot make a loaf, so cooperation is necessary, and a restrainer (wazi') indispensable {cite:muqaddima-ibn-khaldun p. 48-49}."
  es: "La ciencia de la civilización de Ibn Khaldun: los humanos son cívicos por naturaleza; un solo hombre no puede hacer un pan, por lo que la cooperación es necesaria y un moderador (wazi') indispensable {cite:muqaddima-ibn-khaldun p. 48-49}."
  fr: "La science de la civilisation selon Ibn Khaldun: les humains sont civiques par nature — un homme ne peut pas faire un pain, la coopération est donc nécessaire et un modérateur (wazi') indispensable {cite: muqaddima-ibn-khaldun p. 48-49}."
  ur: "ابن خلدون کی تہذیب کی سائنس: انسان فطرتاً شہری ہیں - ایک آدمی روٹی نہیں بنا سکتا، اس لیے تعاون ضروری ہے، اور ایک روک تھام کرنے والا ⁦(وازی)⁩ ناگزیر ہے۔ 48-49}۔"
  tr: "İbn Haldun tarafından kurulan bilim konusu olan insan toplumu, insanların elbette Medinan olduğunu, yani sosyalleşmeleri gerektiğini açıkladı; çünkü bir kişinin buğdaydan geçimini sağlama yeteneği sınırlıdır, ihtiyaç duydukları şeyler için mümkün olan asgari gerekçeyi dayatsalar bile—öğütme, yoğurma, yemek pişirme, demirci, marangoz ve mezbahalar gibi aletler, ayrıca tarım, hasat ve çalışma. Bu nedenle, kaderin çok daha fazlası için yeterli iş birliği sağlamak için bir araya gelmesini gerektirir. Aynı şekilde, Tanrı her hayvana özel bir organ verdiği için kendini savunma gereklidir İnsanları o düşünce ve elin bir üyesi olarak savunup yaparak, el düşünce ve zanaatlara hizmet ederek zanaatlara hazırlanır ve uzuvları temsil eden aletler edinir; örneğin boynuzları temsil eden mızraklar, pençelerin yerine geçen kılıçlar, pençelerin yerine geçen kılıç ve mızrakların yerine geçen teras gibi aletler edinir; Galenus'un 'Uzuvların Faydaları' adlı kitabında belirttiği gibi. Ve bu birleşme gerçekleştiğinde, doğalarındaki saldırıdan bazılarını uzaklaştıracak bir caydırıcı olmalıdır. İbn Haldun, peygamberlik yükümlülüğünün akılcı olmadığını, Şeriat tarafından anlaşıldığını ve Selef öğretisinin de öyle olduğunu açıklamıştır. {atıf:mukaddima-ibn-haldun, s. 48-49}. Medeniyetin kentleşmenin nihai hedefi ve ömrünün sonu olduğunu, bunun yozlaşmanın habercisi olduğunu açıkladı. Kırk insan gücünü artırmanın nihai hedefi olduğu gibi, o zaman da azalmaya başlar. Lüks ve bereket ortaya çıktığında, zanaatta ustalık ve arzulara itaat çağrısı yapar; bu da masrafları artırır ve vergileri yüksek fiyatlarla yükseltir. Bu da satıcılar için yüksek fiyatlara yol açar, pazarlar durgunlaşır ve Medine halkı arasında yoksulluk hakimdir. İnsanlar arasında ahlaksızlık, yalan, kumar, hile, aldatma ve inançta sefahat artar, aldatma ve aldatma hüküm sürer. Yüce Tanrı'nın sözüne uygun olarak: 'Ve bir kasabayı yok etmeyi düşünüyorsak, zenginlerine emir veririz, böylece günahkar oldular.' Burada ve buradan elitlerin sözü şudur: Şehir çok acı portakal yetiştirirse, yıkıma maruz kalır, çünkü acı portakal ve zakkum medeniyetin kalıntılarıdır ve ne tadı ne faydası var; sadece biçimlerine atıfta bulunurlar ve Mısır'ın yıkımından korkulan aşama da budur {atıf:mukaddima-ibn-khaldun, s. 366-368}"
  id: "Subjek ilmu yang diadegkan oleh Ibn Khaldun, yaitu masyarakat manusia, menjelaskan bahwa manusia tentu saja adalah Medinan, artinya mereka harus bersosialisasi, karena kemampuan seseorang untuk mendapatkan nafkah dari gandum terbatas, meskipun mereka memaksakan minimum yang mungkin untuk apa yang mereka butuhkan—menggiling, mengulen, memasak, alat seperti pandai besi, tukang kayu, dan rumah potong hewan, selain bertani, memanen, dan belajar. Oleh karena itu, banyak takdir harus bersatu untuk mencapai kerja sama yang cukup untuk berkali-kali lipat lebih lama. Demikian pula, bela diri diperlukan, karena Tuhan telah memberikan setiap hewan organ khusus Dengan membela dan menjadikan manusia anggota pikiran dan tangan itu, tangan dipersiapkan untuk kerajinan dengan melayani pikiran dan kerajinan, dan ia memperoleh alat yang mewakili anggota tubuh, seperti tombak yang mewakili tanduk, pedang yang menggantikan cakar, dan pedang yang menggantikan cakar, dan teras yang menggantikan tombak, seperti yang disebutkan Galen dalam bukunya 'Manfaat Anggota Tubuh.' Dan ketika persatuan ini terjadi, harus ada pencegah untuk menolak sebagian dari mereka dari agresi dalam sifat mereka. Ibn Khaldun menjelaskan bahwa kewajiban nubuat bukanlah rasional tetapi dipahami oleh Syariah, seperti halnya doktrin Salaf. {cite:muqaddima-ibn-khaldun, hlm. 48-49}. Ia menjelaskan bahwa peradaban adalah tujuan akhir urbanisasi dan akhir dari hidupnya, dan bahwa peradaban menandai korupsinya. Sama seperti empat puluh adalah tujuan utama dalam meningkatkan kekuatan manusia, maka peradaban mulai menurun. Ketika kemewahan dan berkah terjadi, ia menyerukan penguasaan dalam kerajinan dan ketaatan terhadap keinginan, yang meningkatkan pengeluaran dan menaikkan pajak dengan harga tinggi. Hal ini menyebabkan harga tinggi bagi para penjual, pasar menjadi stagnan, dan kemiskinan mendominasi rakyat Madinah. Di antara manusia, kebejatan, kebohongan, judi, penipuan, penipuan, dan kebejatan dalam iman meningkat, dan penipuan serta penipuan pun berlaku. Sesuai dengan pepatah Yang Maha Kuasa: 'Dan jika Kami berniat menghancurkan sebuah kota, Kami memerintah orang kayanya, sehingga mereka telah menjadi berdosa.' Di dalamnya, dan dari sini pepatah para elit adalah bahwa jika kota itu menumbuhkan banyak jeruk pahit, maka kota itu rentan kepada kehancuran, karena jeruk pahit dan oleander adalah sisa-sisa peradaban yang tidak memiliki rasa atau manfaat; mereka hanya merujuk pada bentuknya, yang merupakan tahap ketakutan terhadap kehancuran Mesir {cite:muqaddima-ibn-khaldun, hlm. 366-368}"
