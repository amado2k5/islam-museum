label: { ar: "العمران", en: "Umran (civilisation)" }
summary:
  ar: "موضوع العلم الذي وضعه ابن خلدون، وهو الاجتماع الإنساني، وبين أن الإنسان مدني بالطبع أي لا بد له من الاجتماع، إذ قدرة الواحد قاصرة عن تحصيل قوته من الحنطة ولو فرض أقل ما يمكن لما يحتاج إليه من الطحن والعجن والطبخ وآلات من حداد ونجار وفاخوري فضلاً عن الزراعة والحصاد والدراس، فلا بد من اجتماع القدر الكثير ليحصل بالتعاون قدر الكفاية لأكثر منهم بأضعاف، وكذلك الدفاع عن النفس إذ جعل الله لكل حيوان عضواً يختص بمدافعته وجعل للإنسان عضواً من ذلك الفكر واليد فاليد مهيئة للصنائع بخدمة الفكر والصنائع تحصل له الآلات التي تنوب عن الجوارح مثل الرماح التي تنوب عن القرون والسيوف النائبة عن المخالب والتراس النائبة عن البرشات على ما ذكره جالينوس في كتاب منافع الأعضاء، وإذا حصل الاجتماع فلا بد من وازع يدفع بعضهم عن بعض لما في طباعهم من العدوان، وبين ابن خلدون أن وجوب النبوات ليس بعقلي وإنما مدركه الشرع كما هو مذهب السلف {cite:muqaddima-ibn-khaldun p. 48-49}. وبين أن الحضارة غاية العمران ونهاية لعمره وأنها مؤذنة بفساده كما أن الأربعين غاية في تزايد قوى الإنسان ثم تأخذ في الانحطاط، فإذا حصل الترف والنعمة دعا إلى التفنن في الصنائع وطاعة الشهوات فتعظم النفقات وتزيدها المكوس غلاءً فيعود ذلك على البياعات بالغلاء وتكسد الأسواق ويغلب على أهل المدينة الفقر، وفي الأشخاص يكثر الفسق والكذب والمقامرة والغش والخلابة والفجور في الإيمان ويستحكم المكر والخديعة، وتطبيقاً لقوله تعالى وإذا أردنا أن نهلك قرية أمرنا مترفيها ففسقوا فيها، ومن هنا مثل أهل الخواص أن المدينة إذا كثر فيها غرس النارنج تأذنت بالخراب لأن النارنج والدفلى من توابع الحضارة مما لا طعم فيه ولا منفعة إنما يقصد بها أشكالها وهو الطور الذي يخشى معه هلاك المصر {cite:muqaddima-ibn-khaldun p. 366-368}"
  en: "Ibn Khaldun's science of civilisation: humans are civic by nature — one man cannot make a loaf, so cooperation is necessary, and a restrainer (wazi') indispensable {cite:muqaddima-ibn-khaldun p. 48-49}."
