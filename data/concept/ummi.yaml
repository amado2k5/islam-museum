label: { ar: "الأمي", en: "Ummi (unlettered, and the prayer of one who cannot recite)" }
summary:
  ar: "الأمي المنسوب إلى الأم، ويطلق على من لا يقرأ ولا يكتب، لأن القراءة والكتابة مكتسبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} وصلاة الأمي الذي لا يحسن الفاتحة تختلف فيها أقوال الفقهاء: يكرر ما يحسنه سبعا عند بعضهم، ويحمد الله ويهلله ويكبره عند الشافعي وأحمد، ويصلي دون قراءة عند أبي حنيفة وبعض المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}"
  en: "Ummi is one who is attributed to his mother, and it is used for one who can neither read nor write, since reading and writing are acquired. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} For one who cannot recite the opening surah, the views differ: some have him repeat what he can recite seven times, al-Shafi'i and Ahmad have him praise God in place of the recitation, and Abu Hanifa and some Malikis have him pray without recitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}"
