label: { ar: "الأمي", en: "Ummi (unlettered, and the prayer of one who cannot recite)", es: "Ummi (iletrado, y la oración de quien no puede recitar)", fr: "Ummi (illettrée, et la prière de celle qui ne peut réciter)" }
summary:
  ar: "الأمي المنسوب إلى الأم، ويطلق على من لا يقرأ ولا يكتب، لأن القراءة والكتابة مكتسبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} وصلاة الأمي الذي لا يحسن الفاتحة تختلف فيها أقوال الفقهاء: يكرر ما يحسنه سبعا عند بعضهم، ويحمد الله ويهلله ويكبره عند الشافعي وأحمد، ويصلي دون قراءة عند أبي حنيفة وبعض المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}"
  en: "Ummi is one who is attributed to his mother, and it is used for one who can neither read nor write, since reading and writing are acquired. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} For one who cannot recite the opening surah, the views differ: some have him repeat what he can recite seven times, al-Shafi'i and Ahmad have him praise God in place of the recitation, and Abu Hanifa and some Malikis have him pray without recitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}"
  es: "Ummi es aquel que se atribuye a su madre, y se usa para quien no sabe leer ni escribir, ya que la lectura y la escritura se adquieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} Para quien no puede recitar la sura inicial, las opiniones difieren: algunos le hacen repetir lo que puede recitar siete veces, al-Shafi'i y Ahmad le hacen alabar a Dios en lugar de la recitación, y Abu Hanifa y algunos malikíes le hacen orar sin recitar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}"
  fr: "Ummi est un terme attribué à sa mère et s'emploie pour désigner une personne illettrée, car l'apprentissage de la lecture et de l'écriture s'acquiert. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} Concernant celui qui ne peut réciter la première sourate, les avis divergent: certains lui recommandent de répéter sept fois ce qu'il sait réciter; al-Shafi'i et Ahmad lui conseillent de louer Dieu à la place de la récitation; et Abu Hanifa ainsi que certains Malikites lui recommandent de prier sans récitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}"
