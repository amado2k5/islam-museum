id: concept/ashab-al-ukhdud
class: concept
kind: belief
label:
  ar: "أصحاب الأخدود"
  en: "Ashab al-Ukhdud (the people of the trench)"
  fr: "Ashab al-Ukhdud (les gens du Fossé)"
  es: "Ashab al-Ukhdud (la gente de la trinchera)"
  ur: "اصحاب الخدود ⁦(خندق کے لوگ)⁩"
  tr: "Groove sahipleri"
  id: "Pemilik groove"
summary:
  ar: "تعبير قرآني غامض في سورة البروج ⁦(الآيات 4-7)⁩، وقد فسّره المفسرون القدماء بمحنة نصارى نجران على يد ذي نواس اليهودي سنة 523م تقريبًا، وفسّره آخرون تفسيرًا أخرويًا؛ والمراد به من يحرقون المؤمنين، ومصيرهم جهنم {cite:encyclopaedia-of-islam-2 vol. 1 p. 741}."
  en: "An obscure Qur'anic expression at the start of sura 85 (verses 4-7), 'those of the trench'. Early commentators tied it to the persecution of the Christians of Najran under the Jewish king Dhu Nuwas, placed by history in about 523; the entry argues for an eschatological reading in which the 'people of the trench' are unbelievers destined for the fire {cite:encyclopaedia-of-islam-2 vol. 1 p. 741}."
  fr: "Expression coranique obscure au début de la sourate 85 (versets 4-7), « ceux du fossé ». Les premiers commentateurs la relièrent à la persécution des chrétiens de Najran sous le roi juif Dhu Nuwas, située historiquement vers 523 ; la notice défend une lecture eschatologique où les « gens du fossé » sont les mécréants destinés au feu {cite:encyclopaedia-of-islam-2 vol. 1 p. 741}."
  es: "Una expresión coránica poco conocida al comienzo de la sura 85 (versículos 4-7), «los de la trinchera». Los primeros comentaristas la vincularon con la persecución de los cristianos de Najrán bajo el rey judío Dhu Nuwas, que la historia sitúa alrededor del año 523; la entrada aboga por una lectura escatológica en la que la «gente de la trinchera» son incrédulos destinados al fuego {cite:encyclopaedia-of-islam-2 vol. 1 p. 741}."
  ur: "سورہ 85 ⁦(آیات 4-7)⁩ کے شروع میں ایک غیر واضح قرآنی اظہار، 'خندق کے لوگ'۔ ابتدائی مفسرین نے اسے یہودی بادشاہ ذو نواس کے تحت نجران کے عیسائیوں کے ظلم و ستم سے جوڑ دیا، جسے تاریخ نے تقریباً 523 میں رکھا ہے۔ اندراج ایک eschatological پڑھنے کی دلیل ہے جس میں 'خندق کے لوگ' کافر ہیں جو آگ کے لیے مقدر ہیں {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 741}۔"
  tr: "Buruj Suresi'nde (4-7. ayetler) gizemli bir Kur'an ifadesi, eski yorumcular tarafından 523 civarında Yahudi Dhi Nuwas'ın elinde Necranlı Hristiyanların yaşadığı sıkıntılar olarak yorumlanırken, diğerleri bunu başka bir dünyaya ait şekilde yorumlamıştır; bu ifade müminleri yakanlara atıfta bulunur ve onların kaderleri Cehennemdir {cite:encyclopaedia-of-Islam-2 cilt 1, s. 741}."
  id: "Sebuah ungkapan Al-Quran yang misterius dalam Surah Al-Buruj (ayat 4-7), yang ditafsirkan oleh komentator kuno sebagai penderitaan umat Kristen Najran di tangan Dhi Nuwas si Yahudi sekitar tahun 523 M, sementara yang lain menafsirkannya dengan cara yang tidak duniawi; ini merujuk pada mereka yang membakar orang beriman, dan nasib mereka adalah Neraka {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 741}."
