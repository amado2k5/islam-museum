label:
  ar: "أصحاب الأخدود"
  en: "Ashab al-Ukhdud (the people of the trench)"
summary:
  ar: "تعبير قرآني غامض في سورة البروج (الآيات 4-7)، وقد فسّره المفسرون القدماء بمحنة نصارى نجران على يد ذي نواس اليهودي سنة 523م تقريبًا، وفسّره آخرون تفسيرًا أخرويًا؛ والمراد به من يحرقون المؤمنين، ومصيرهم جهنم {cite:encyclopaedia-of-islam-2 vol. 1 p. 741}."
  en: "An obscure Qur'anic expression at the start of sura 85 (verses 4-7), 'those of the trench'. Early commentators tied it to the persecution of the Christians of Najran under the Jewish king Dhu Nuwas, placed by history in about 523; the entry argues for an eschatological reading in which the 'people of the trench' are unbelievers destined for the fire {cite:encyclopaedia-of-islam-2 vol. 1 p. 741}."
