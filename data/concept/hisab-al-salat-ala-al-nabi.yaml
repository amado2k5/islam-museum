id: concept/hisab-al-salat-ala-al-nabi
class: concept
kind: doctrine
label:
  ar: "الصلاة على النبي مرة واحدة"
  en: "One prayer of blessing upon the Prophet"
  ur: "نبی پر ایک بار درود"
  es: "Una oración de bendición sobre el Profeta"
  fr: "Une prière de bénédiction sur le Prophète"
  tr: "Bir kez peygambere dua etmek"
  id: "Berdoa kepada nabi sekali"
summary:
  ar: "من صلى على النبي صلاة واحدة جزاه الله بها عشر صلوات، وحُطّت عنه عشر خطيئات، ورُفعت له عشر درجات، في رواية أنس عند النسائي [[passage/nasai-api-1297]]، وأصل العشر بالواحدة عند مسلم [[passage/muslim-0384]]. فالواحدة هنا تتحرك في ثلاث خانات معا: الصلوات، والمحو، والدرجات."
  en: "Whoever invokes one blessing upon the Prophet, God blesses him ten times, ten sins are shed from him and he is raised ten ranks, in Anas's narration in al-Nasa'i [[passage/nasai-api-1297]]; the core of ten for one is in Muslim [[passage/muslim-0384]]. One act here moves three columns at once: the blessings, the erasure and the ranks."
  ur: "جو نبی پر ایک بار درود بھیجے اللہ اس پر دس رحمتیں بھیجتا ہے، اس کی دس خطائیں مٹا دی جاتی ہیں اور دس درجے بلند کیے جاتے ہیں، انس کی روایت میں جو نسائی میں ہے [[passage/nasai-api-1297]]، اور ایک کے بدلے دس کی اصل مسلم میں ہے [[passage/muslim-0384]]۔ یہاں ایک عمل بیک وقت تین خانوں کو حرکت دیتا ہے: رحمتیں، مٹنا اور درجات۔"
  es: "Quien invoca una bendición sobre el Profeta, Dios lo bendice diez veces, se le perdonan diez pecados y asciende diez rangos, según la narración de Anas en al-Nasa'i [[passage/nasai-api-1297]]; la esencia de diez por uno se encuentra en Muslim [[passage/muslim-0384]]. Un solo acto mueve tres columnas a la vez: las bendiciones, el perdón y los rangos."
  fr: "Quiconque invoque une seule bénédiction sur le Prophète, Dieu le bénit dix fois, dix péchés sont effacés de lui et il est élevé de dix rangs, selon le hadith rapporté par Anas dans al-Nasa'i [[passage/nasai-api-1297]]; le principe de dix pour un se trouve dans Muslim [[passage/muslim-0384]]. Un seul acte a donc un impact simultané sur trois piliers: les bénédictions, l'effacement des péchés et l'élévation de rang."
  tr: "Peygamber'e bir namaz kılan kişi Allah ona on namazla ödüllendirir, on günah kaldırılır ve on derece yükselir, Anas En-Nasa'i rivayetinde [[passage/nasai-api-1297]] belirtilir ve on derece yükselir; Müslüman'a göre on derecenin kökeni birdir. Burada bir, dua, silme ve dereceler olmak üzere üç kategoriye ayrılır."
  id: "Siapa pun yang berdoa satu doa kepada Nabi, Allah akan memberinya sepuluh doa, dan sepuluh dosa akan dihapuskan darinya, dan sepuluh derajat akan dinaikkan untuknya, menurut Anas dalam riwayat An-Nasa'i [[passage/nasai-api-1297]], dan asal mula sepuluh adalah satu menurut Muslim [[passage/muslim-0384]]. Di sini, satu bergerak dalam tiga kategori bersama: doa, penghapusan, dan derajat."
