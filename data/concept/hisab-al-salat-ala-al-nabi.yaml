id: concept/hisab-al-salat-ala-al-nabi
class: concept
kind: doctrine
label:
  ar: "الصلاة على النبي مرة واحدة"
  en: "One prayer of blessing upon the Prophet"
  ur: "نبی پر ایک بار درود"
summary:
  ar: "من صلى على النبي صلاة واحدة جزاه الله بها عشر صلوات، وحُطّت عنه عشر خطيئات، ورُفعت له عشر درجات، في رواية أنس عند النسائي [[passage/nasai-api-1297]]، وأصل العشر بالواحدة عند مسلم [[passage/muslim-0384]]. فالواحدة هنا تتحرك في ثلاث خانات معا: الصلوات، والمحو، والدرجات."
  en: "Whoever invokes one blessing upon the Prophet, God blesses him ten times, ten sins are shed from him and he is raised ten ranks, in Anas's narration in al-Nasa'i [[passage/nasai-api-1297]]; the core of ten for one is in Muslim [[passage/muslim-0384]]. One act here moves three columns at once: the blessings, the erasure and the ranks."
  ur: "جو نبی پر ایک بار درود بھیجے اللہ اس پر دس رحمتیں بھیجتا ہے، اس کی دس خطائیں مٹا دی جاتی ہیں اور دس درجے بلند کیے جاتے ہیں، انس کی روایت میں جو نسائی میں ہے [[passage/nasai-api-1297]]، اور ایک کے بدلے دس کی اصل مسلم میں ہے [[passage/muslim-0384]]۔ یہاں ایک عمل بیک وقت تین خانوں کو حرکت دیتا ہے: رحمتیں، مٹنا اور درجات۔"
