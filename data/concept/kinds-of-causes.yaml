label: { ar: "أنواع الأسباب عند ابن سينا", en: "The kinds of causes in the Canon", ur: "قانون میں اسباب کی اقسام", es: "Los tipos de causas en el Canon", fr: "Les types de causes dans le Canon" }
summary:
  ar: "يفتتح ابن سينا التعليم الثاني، في الأسباب، بتقسيم أسباب أحوال البدن إلى سابقة وبادية وواصلة، وبيان الفرق بينها، ثم السبب بالذات والعرض، وشروط فعل السبب، والمخلف وغير المخلف، والأجناس الستة الضرورية {cite:canon-ibn-sina-print-v1 pp.112-113}."
  en: "Ibn Sina opens the second lesson, on causes, by dividing the causes of the body's states into antecedent, evident and conjoined, showing how they differ, then causes by themselves and by accident, the conditions for a cause to act, surviving and non-surviving causes, and the six necessary genera {cite:canon-ibn-sina-print-v1 pp.112-113}."
  es: "Ibn Sina abre la segunda lección, sobre las causas, dividiendo las causas de los estados del cuerpo en antecedentes, evidentes y conjuntas, mostrando en qué se diferencian, luego las causas por sí mismas y por accidente, las condiciones para que una causa actúe, las causas supervivientes y no supervivientes, y los seis géneros necesarios {cite:canon-ibn-sina-print-v1 pp.112-113}."
  fr: "Ibn Sina ouvre la deuxième leçon, sur les causes, en divisant les causes des états du corps en causes antérieures, évidentes et conjointes, en montrant comment elles diffèrent, puis les causes par elles-mêmes et par accident, les conditions pour qu'une cause agisse, les causes survivantes et non survivantes, et les six genres nécessaires {cite:canon-ibn-sina-print-v1 pp.112-113}."
  ur: "ابن سینا دوسرا سبق اسباب پر کھولتا ہے، جسم کی حالتوں کے اسباب کو سابقہ، واضح اور جوڑ میں تقسیم کرکے، یہ ظاہر کرتا ہے کہ وہ کس طرح مختلف ہیں، پھر خود اسباب اور حادثاتی طور پر، کسی سبب کے کام کرنے کی شرائط، زندہ رہنے والے اور غیر زندہ رہنے والے اسباب، اور چھ ضروری نسلوں کا حوالہ دیتے ہیں: canon-print-1۔ صفحہ 112-113}۔"
