summary:
  ar: "يفتتح ابن سينا التعليم الثاني، في الأسباب، بتقسيم أسباب أحوال البدن إلى سابقة وبادية وواصلة، وبيان الفرق بينها، ثم السبب بالذات والعرض، وشروط فعل السبب، والمخلف وغير المخلف، والأجناس الستة الضرورية {cite:canon-ibn-sina-print-v1 pp.112-113}."
  en: "Ibn Sina opens the second lesson, on causes, by dividing the causes of the body's states into antecedent, evident and conjoined, showing how they differ, then causes by themselves and by accident, the conditions for a cause to act, surviving and non-surviving causes, and the six necessary genera {cite:canon-ibn-sina-print-v1 pp.112-113}."
