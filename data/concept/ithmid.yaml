  en: "Ithmid (kohl stone)"
  ur: "اثمد ⁦(سرمہ)⁩"
  es: "Ithmid (piedra de kohl)"
summary:
  ar: "جوهر الأسرب الميت، وقوّته كقوة الرصاص المحرق؛ يقبض ويجفف بلا لذع، ويقطع النزوف، وينفع القروح والحروق، ويحفظ صحة العين {cite:canon-ibn-sina-print-v1 p.356}."
  en: "The essence of dead lead, with a power like that of calcined lead. It astringes and dries without burning, stops bleeding, heals ulcers and burns, and preserves the health of the eye {cite:canon-ibn-sina-print-v1 p.356}."
  ur: "مردہ سیسے کا جوہر، جس کی قوت جلائے ہوئے سیسے جیسی ہے۔ یہ بغیر جلن کے قبض اور خشکی کرتا ہے، خون کا بہنا روکتا ہے، زخموں اور جلنے کی جگہوں کو بھرتا ہے، اور آنکھ کی صحت قائم رکھتا ہے {cite:canon-ibn-sina-print-v1 p.356}۔"
  es: "La esencia del plomo muerto, con un poder similar al del plomo calcinado. Astringe y seca sin quemar, detiene el sangrado, cura úlceras y quemaduras, y preserva la salud ocular {cite:canon-ibn-sina-print-v1 p.356}."
