label:
  ar: "الصَّرْف (مبادلة الأثمان بعضها ببعض)"
  en: "Sarf (exchange of money for money: its conditions of mutual receipt, equal weight, no option, no deferment, the kinds of exchange, defective coins, and copper coins)"
summary:
  ar: "الصرف في الفقه بيع الثمن بالثمن، أي مبادلة النقد بالنقد جنسا أو غير جنس، وهو قسم من البيع العام. ويصح بشرط التقابض في المجلس قبل الافتراق، ولا يصح فيه خيار الشرط ولا الأجل عند الجمهور، ويجب فيه التماثل في الوزن عند اتحاد الجنس ولو اختلفت الصياغة عند الجمهور، ويجوز التفاضل عند اختلاف الجنس مع التقابض. وللفقهاء تفصيل في الصرف على الذمة، وفي المغشوش، وفي الفلوس، وفي ظهور عيب في البدل، وفي تعين النقود بالتعيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10330} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10332} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10334} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10335} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10338} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10343} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10344} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10345} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10346}"
  en: "In the law sarf is the sale of a price for a price: the exchange of money for money, of the same kind or of different kinds, and it is one kind of sale in general. It is valid only if both sides are received before the parties part from the session; the majority also hold that a stipulated option or deferment voids it. When the kind is the same the weight must be equal, even if the workmanship differs (majority); when the kinds differ, excess is allowed if the exchange is made hand to hand. The jurists also treat exchanges on credit, adulterated coins, copper coins, defects in the money received, and whether coins are fixed by being named. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10330} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10332} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10334} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10335} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10338} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10343} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10344} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10345} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10346}"
