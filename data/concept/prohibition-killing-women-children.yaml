label: { ar: "حظر قتل النساء والولدان والعسفاء", en: "Prohibition of killing women, children and non-combatant labourers in war", es: "Prohibición de matar mujeres, niños y trabajadores no combatientes en la guerra." }
summary:
  ar: "أصل تشريعي في أخلاقيات وقوانين الحرب الإسلامية أعلنه النبي يوم حنين حين رأى امرأة مقتولة فقال «ما كانت هذه لتقاتل»، وأرسل إلى خالد بن الوليد ينهاه عن قتل الوليد أو المرأة أو العسيف ⁦(الأجير)⁩."
  en: "A foundational rule of Islamic laws of war proclaimed by the Prophet at the Battle of Hunayn upon seeing a slain woman: 'She was not one to fight', ordering Khalid ibn al-Walid never to kill children, women, or hired labourers."
  es: "Una regla fundamental de las leyes islámicas de la guerra, proclamada por el Profeta en la Batalla de Hunayn al ver a una mujer muerta, fue: \"Ella no era una mujer para luchar\", ordenando a Khalid ibn al-Walid que nunca matara a niños, mujeres ni trabajadores contratados."
