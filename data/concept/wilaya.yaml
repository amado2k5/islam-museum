id: concept/wilaya
class: concept
kind: doctrine
label:
  ar: ولاية الله
  en: Friendship with God (wilaya)
  es: "Amistad con Dios (wilaya)"
  fr: "Amitié avec Dieu (wilaya)"
summary:
  ar: "ولاية الله في الحديث القدسي الثامن والثلاثين من الأربعين: «من عادى لي ولياً فقد آذنته بالحرب، وما تقرب إلي عبدي بشيء أحب إلي مما افترضت عليه، ولا يزال عبدي يتقرب إلي بالنوافل حتى أحبه» — فالولي عند الشرح من استقام على الفرائض ثم تدرج بالنوافل حتى يصير محبوباً لله فيكون سمعه وبصره ويده ورجله بالله، والتقرب المؤسس للولاية رتبتان: الفرائض أولاً وهي أحب القربات، ثم النوافل بعدها؛ وعداوة الولي موجبة لإعلان الحرب من الله — أعظم وعيد في حق محبيه ⁦(جامع العلوم والحكم ص 770–771)⁩."
  en: "Friendship with God in the thirty-eighth sacred hadith of the Forty: 'whoever is hostile to a friend of Mine, I have declared war on him; My servant draws near to Me by nothing dearer to Me than what I have made obligatory on him; and My servant keeps drawing near to Me through supererogatory works until I love him' — the wali, on the commentary's account, is the one upright upon the obligations who then ascends through supererogatory works until he becomes beloved of God, his hearing, sight, hand and foot then acting by Him; the drawing near that founds wilaya has two ranks — the obligations first, dearest of all approaches, then the supererogatory after them — while enmity to a friend occasions God's own declaration of war, the gravest of threats in defence of His beloveds (Jami' al-Ulum wal-Hikam pp. 770–771)."
  es: "La amistad con Dios en el trigésimo octavo hadiz sagrado de los Cuarenta: «Quien sea hostil a un amigo Mío, le he declarado la guerra; Mi siervo se acerca a Mí por nada más querido para Mí que lo que le he hecho obligatorio; y Mi siervo sigue acercándose a Mí mediante obras supererogatorias hasta que Yo lo amo». El wali, según el comentario, es aquel que se mantiene íntegro en las obligaciones y luego asciende mediante obras supererogatorias hasta que se convierte en amado de Dios, actuando entonces su oído, vista, mano y pie por Él; el acercamiento que funda la wilaya tiene dos rangos: primero las obligaciones, las más queridas de todas las aproximaciones, y luego las supererogatorias después de ellas; mientras que la enemistad hacia un amigo ocasiona la propia declaración de guerra de Dios, la más grave de las amenazas en defensa de Sus amados (Jami' al-Ulum wal-Hikam, págs. 770-771)."
  fr: "L'amitié avec Dieu dans le trente-huitième hadith sacré des Quarante: « Quiconque est hostile à un de Mes amis, Je lui déclare la guerre; Mon serviteur ne s'approche de Moi que par ce que Je lui ai prescrit; et Mon serviteur continue de s'approcher de Moi par des œuvres surérogatoires jusqu'à ce que Je l'aime » — le wali, selon le commentaire, est celui qui est droit dans l'accomplissement des obligations et qui s'élève ensuite par des œuvres surérogatoires jusqu'à devenir aimé de Dieu, son ouïe, sa vue, ses mains et ses pieds agissant alors par Lui; le rapprochement qui fonde la wilaya comporte deux rangs — les obligations d'abord, la plus chère de toutes les approches, puis les œuvres surérogatoires après elles — tandis que l'inimitié envers un ami provoque la déclaration de guerre de Dieu, la plus grave des menaces pour défendre Ses bien-aimés (Jami' al-Ulum wal-Hikam pp. 770–771)."
