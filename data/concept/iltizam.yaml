label: { ar: "الالتزام", en: "Iltizam (binding obligation in fiqh)" }
summary:
  ar: "الالتزام في اللغة الثبوت والدوام، وفي الاصطلاح إلزام الشخص نفسه ما لم يكن لازما له قبل، والعقد التزام بارتباط الإيجاب بالقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3284} وسببه التصرفات الاختيارية، وتلحق به عند بعض المعاصرين الأفعال الضارة والنافعة والشرع، وهي عند الفقهاء إلزام لا التزام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3285}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289} وأركانه عند غير الحنفية الصيغة والملتزِم والملتزَم له والملتزَم به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3290} ويجب الوفاء بالعقود اللازمة والعهود والنذور وحقوق الناس، ولا يجب الوفاء بالوعد والتبرعات الجائزة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3303} وتنقضي الالتزامات بالوفاء وبالإبراء والفسخ والمقاصة وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  en: "Iltizam means binding oneself, and an agreement is a binding of offer and acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3284} Its causes are voluntary acts; some modern writers add harmful acts, unjust enrichment and the Law, which the classical jurists call imposition rather than obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3285}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289} Non-Hanafi jurists count four pillars: the formula, the one who binds, the party bound to, and the object. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3290} Binding contracts, covenants, vows and duties to people must be fulfilled, while promises and gratuitous contracts that may be revoked need not be. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3303} Obligations end by performance, release, rescission, set-off and other causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
