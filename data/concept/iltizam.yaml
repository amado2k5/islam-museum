id: concept/iltizam
class: concept
kind: legal
label: { ar: "الالتزام", en: "Iltizam (binding obligation in fiqh)", es: "Iltizam (obligación vinculante en fiqh)", fr: "Iltizam (obligation contraignante en fiqh)", ur: "التزام ⁦(فقہ میں واجب)⁩" }
summary:
  ar: "الالتزام في اللغة الثبوت والدوام، وفي الاصطلاح إلزام الشخص نفسه ما لم يكن لازما له قبل، والعقد التزام بارتباط الإيجاب بالقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3284} وسببه التصرفات الاختيارية، وتلحق به عند بعض المعاصرين الأفعال الضارة والنافعة والشرع، وهي عند الفقهاء إلزام لا التزام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3285}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289} وأركانه عند غير الحنفية الصيغة والملتزِم والملتزَم له والملتزَم به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3290} ويجب الوفاء بالعقود اللازمة والعهود والنذور وحقوق الناس، ولا يجب الوفاء بالوعد والتبرعات الجائزة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3303} وتنقضي الالتزامات بالوفاء وبالإبراء والفسخ والمقاصة وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  en: "Iltizam means binding oneself, and an agreement is a binding of offer and acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3284} Its causes are voluntary acts; some modern writers add harmful acts, unjust enrichment and the Law, which the classical jurists call imposition rather than obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3285}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3287}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289} Non-Hanafi jurists count four pillars: the formula, the one who binds, the party bound to, and the object. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3290} Binding contracts, covenants, vows and duties to people must be fulfilled, while promises and gratuitous contracts that may be revoked need not be. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3303} Obligations end by performance, release, rescission, set-off and other causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  es: "Iltizam significa obligarse a uno mismo, y un acuerdo es una vinculación de oferta y aceptación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3284} Sus causas son actos voluntarios; algunos autores modernos añaden actos dañinos, enriquecimiento injusto y la Ley, que los juristas clásicos llaman imposición en lugar de obligación. Los juristas no hanafíes cuentan cuatro pilares: la fórmula, el que obliga, la parte obligada y el objeto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3290} Los contratos vinculantes, los pactos, los votos y los deberes para con las personas deben cumplirse, mientras que las promesas y los contratos gratuitos que pueden ser revocados no tienen por qué serlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3303} Las obligaciones terminan por cumplimiento, liberación, rescisión, compensación y otras causas. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3311}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  fr: "Iltizam signifie s'engager, et un accord est un engagement d'offre et d'acceptation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3283}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3284} Ses causes sont les actes volontaires; certains auteurs modernes y ajoutent les actes nuisibles, l'enrichissement sans cause et la Loi, que les juristes classiques qualifient d'imposition plutôt que d'obligation. Les juristes non hanafites comptent quatre piliers: la formule, celui qui engage, la partie liée et l'objet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3289}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3290} Les contrats, alliances, vœux et devoirs envers autrui doivent être exécutés, tandis que les promesses et les contrats gratuits, révocables, ne le sont pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3303} Les obligations prennent fin par l'exécution, la libération, la résiliation, la compensation et d'autres causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3311}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  ur: "التزام کا مطلب ہے خود کو پابند کرنا، اور معاہدہ پیشکش اور قبولیت کا پابند ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3283}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3284} اس کے اسباب رضاکارانہ اعمال ہیں۔ کچھ جدید مصنفین نقصان دہ اعمال، غیر منصفانہ افزودگی اور قانون کا اضافہ کرتے ہیں، جسے کلاسیکی فقہاء فرض کے بجائے مسلط قرار دیتے ہیں۔ غیر حنفی فقہاء چار ستون شمار کرتے ہیں: فارمولہ، پابند کرنے والا، پابند جماعت اور اعتراض۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3289}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3290} لوگوں کے لیے پابند ہونے والے معاہدے، عہد، نذر اور فرائض کو پورا کرنا ضروری ہے، جبکہ وعدے اور بلا معاوضہ معاہدوں کی ضرورت نہیں ہے جو دوبارہ نہ کیے جائیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3301}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3303} ذمہ داریاں کارکردگی، رہائی، تنسیخ، سیٹ آف اور دیگر وجوہات سے ختم ہوتی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3311}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3312}"
