label: { ar: "رصد البتاني لميل فلك البروج بالرقة: ثلاثة وعشرون جزءاً وخمس وثلاثون دقيقة", en: "Al-Battani's observation of the obliquity at al-Raqqa: 23 degrees 35 minutes", ur: "البتانی کی رقہ میں میل فلک البروج کی رصد: ۲۳ درجے ۳۵ دقیقے" }
summary:
  ar: "يقرر البتاني في الباب الرابع أن ميل فلك البروج عن معدل النهار يُعرف ببعد الشمس عند الانقلابين في فلك نصف النهار، ويذكر أن إرخس نقل عنه بطليموس أن القوس بين المنقلبين سبعة وأربعون جزءاً واثنتان وأربعون دقيقة وأن الميل ثلاثة وعشرون جزءاً وإحدى وخمسون دقيقة، ثم يخبر أنه رصد مراراً بالرقة فوجد أقرب قرب للشمس من سمت الرأس اثني عشر جزءاً وست وعشرين دقيقة وأبعد بعدها تسعة وخمسين جزءاً وست وثلاثين دقيقة، فالقوس بين المنقلبين سبعة وأربعون جزءاً وعشر دقائق والميل ثلاثة وعشرون جزءاً وخمس وثلاثون دقيقة. {cite:zij-sabi-nallino-byblion pp.21-22}."
  en: "In chapter 4 al-Battani states that the obliquity of the zodiac from the equator of the day is known from the Sun's distance at the two solstices in the meridian, reports that Hipparchus is cited by Ptolemy as giving the arc between the solstices as 47 degrees 42 minutes and the obliquity as 23 degrees 51 minutes, and then tells that he observed many times at al-Raqqa and found the Sun's nearest approach to the zenith 12 degrees 26 minutes and its farthest distance 59 degrees 36 minutes, so the arc between the solstices is 47 degrees 10 minutes and the obliquity 23 degrees 35 minutes. {cite:zij-sabi-nallino-byblion pp.21-22}."
  ur: "چوتھے باب میں البتانی بتاتے ہیں کہ فلک البروج کا معدل النہار سے میل دونوں انقلابوں پر نصف النہار میں سورج کے بعد سے معلوم ہوتا ہے، اور بیان کرتے ہیں کہ بطلیموس نے ارخس سے نقل کیا کہ دونوں انقلابوں کے درمیان کی قوس ۴۷ جزء ۴۲ دقیقے ہے اور میل ۲۳ جزء ۵۱ دقیقے، پھر خبر دیتے ہیں کہ انہوں نے رقہ میں بار بار رصد کی اور سورج کی سمت الرأس سے قریب ترین دوری ۱۲ جزء ۲۶ دقیقے اور دور ترین ۵۹ جزء ۳۶ دقیقے پائی، چنانچہ دونوں انقلابوں کے درمیان کی قوس ۴۷ جزء ۱۰ دقیقے اور میل ۲۳ جزء ۳۵ دقیقے ہے۔ {cite:zij-sabi-nallino-byblion pp.21-22}۔"
