id: concept/zij-sabi-battani-obliquity-observation-at-raqqa
class: concept
kind: scientific
label: { ar: "رصد البتاني لميل فلك البروج بالرقة: ثلاثة وعشرون جزءاً وخمس وثلاثون دقيقة", en: "Al-Battani's observation of the obliquity at al-Raqqa: 23 degrees 35 minutes", ur: "البتانی کی رقہ میں میل فلک البروج کی رصد: ۲۳ درجے ۳۵ دقیقے", es: "Observación de Al-Battani sobre la oblicuidad en al-Raqqa: 23 grados 35 minutos", fr: "L'observance de l'al-Raqqa, mesurée par Al-Battani, est de 23 degrés et 35 minutes.", tr: "El-Battani'nin Rakka'da zodyakın eğimi hakkındaki gözlemi: yirmi üç bölüm ve otuz beş dakika", id: "Pengamatan Al-Battani tentang kemiringan zodiak di Raqqa: dua puluh tiga bagian dan tiga puluh lima menit" }
summary:
  ar: "يقرر البتاني في الباب الرابع أن ميل فلك البروج عن معدل النهار يُعرف ببعد الشمس عند الانقلابين في فلك نصف النهار، ويذكر أن إرخس نقل عنه بطليموس أن القوس بين المنقلبين سبعة وأربعون جزءاً واثنتان وأربعون دقيقة وأن الميل ثلاثة وعشرون جزءاً وإحدى وخمسون دقيقة، ثم يخبر أنه رصد مراراً بالرقة فوجد أقرب قرب للشمس من سمت الرأس اثني عشر جزءاً وست وعشرين دقيقة وأبعد بعدها تسعة وخمسين جزءاً وست وثلاثين دقيقة، فالقوس بين المنقلبين سبعة وأربعون جزءاً وعشر دقائق والميل ثلاثة وعشرون جزءاً وخمس وثلاثون دقيقة. {cite:zij-sabi-nallino-byblion pp.21-22}."
  en: "In chapter 4 al-Battani states that the obliquity of the zodiac from the equator of the day is known from the Sun's distance at the two solstices in the meridian, reports that Hipparchus is cited by Ptolemy as giving the arc between the solstices as 47 degrees 42 minutes and the obliquity as 23 degrees 51 minutes, and then tells that he observed many times at al-Raqqa and found the Sun's nearest approach to the zenith 12 degrees 26 minutes and its farthest distance 59 degrees 36 minutes, so the arc between the solstices is 47 degrees 10 minutes and the obliquity 23 degrees 35 minutes. {cite:zij-sabi-nallino-byblion pp.21-22}."
  ur: "چوتھے باب میں البتانی بتاتے ہیں کہ فلک البروج کا معدل النہار سے میل دونوں انقلابوں پر نصف النہار میں سورج کے بعد سے معلوم ہوتا ہے، اور بیان کرتے ہیں کہ بطلیموس نے ارخس سے نقل کیا کہ دونوں انقلابوں کے درمیان کی قوس ۴۷ جزء ۴۲ دقیقے ہے اور میل ۲۳ جزء ۵۱ دقیقے، پھر خبر دیتے ہیں کہ انہوں نے رقہ میں بار بار رصد کی اور سورج کی سمت الرأس سے قریب ترین دوری ۱۲ جزء ۲۶ دقیقے اور دور ترین ۵۹ جزء ۳۶ دقیقے پائی، چنانچہ دونوں انقلابوں کے درمیان کی قوس ۴۷ جزء ۱۰ دقیقے اور میل ۲۳ جزء ۳۵ دقیقے ہے۔ {cite:zij-sabi-nallino-byblion pp.21-22}۔"
  es: "En el capítulo 4, al-Battani afirma que la oblicuidad del zodíaco con respecto al ecuador del día se conoce a partir de la distancia del Sol en los dos solsticios del meridiano, informa que Ptolomeo cita a Hiparco, quien da el arco entre los solsticios como 47 grados 42 minutos y la oblicuidad como 23 grados 51 minutos, y luego dice que observó muchas veces en al-Raqqa y encontró que la aproximación más cercana del Sol al cenit era de 12 grados 26 minutos y su distancia más lejana de 59 grados 36 minutos, por lo que el arco entre los solsticios es de 47 grados 10 minutos y la oblicuidad de 23 grados 35 minutos. {cite:zij-sabi-nallino-byblion pp.21-22}."
  fr: "Au chapitre 4, al-Battani indique que l'obliquité du zodiaque par rapport à l'équateur diurne est déterminée par la distance du Soleil au méridien lors des deux solstices. Il rapporte qu'Hipparque, cité par Ptolémée, donne un arc de 47 degrés 42 minutes entre les solstices et une obliquité de 23 degrés 51 minutes. Il précise ensuite avoir observé à plusieurs reprises à Raqqa et constaté que le Soleil s'approchait au plus près du zénith à 12 degrés 26 minutes et s'en éloignait au plus loin à 59 degrés 36 minutes. Ainsi, l'arc entre les solstices mesure 47 degrés 10 minutes et l'obliquité 23 degrés 35 minutes. (Voir: Zij Sabi Nallino Byblion, p. 21-22)."
  tr: "Dördüncü bölümde, el-Battani, ekliptiğin meridyenden olan eğiminin, güneşin meridyendeki gündönümlerindeki uzaklığı olarak bilindiğini belirtir. Batlamyus'un, Arches'ten aktardığına göre, gündönümleri arasındaki yayın kırk yedi kısım kırk iki dakika, eğimin ise yirmi üç kısım elli bir dakika olduğunu söyler. Daha sonra Rakka'da defalarca gözlem yaptığını ve güneşin zenite en yakın noktasının on iki kısım yirmi altı dakika, en uzak noktasının ise elli dokuz kısım otuz altı dakika olduğunu bulduğunu bildirir. Böylece, gündönümleri arasındaki yay kırk yedi kısım on dakika, eğim ise yirmi üç kısım otuz beş dakikadır. {cite:zij-sabi-nallino-byblion pp.21-22}."
  id: "Dalam bab keempat, al-Battani menyatakan bahwa kemiringan ekliptika dari meridian dikenal sebagai jarak matahari pada titik balik matahari di meridian. Ia menyebutkan bahwa Ptolemy mengutip Arches yang mengatakan bahwa busur antara titik balik matahari adalah empat puluh tujuh bagian dan empat puluh dua menit, dan kemiringannya adalah dua puluh tiga bagian dan lima puluh satu menit. Kemudian ia melaporkan bahwa ia berulang kali mengamati di Raqqa dan menemukan titik terdekat matahari ke zenit adalah dua belas bagian dan dua puluh enam menit, dan titik terjauh adalah lima puluh sembilan bagian dan tiga puluh enam menit. Dengan demikian, busur antara titik balik matahari adalah empat puluh tujuh bagian dan sepuluh menit, dan kemiringannya adalah dua puluh tiga bagian dan tiga puluh lima menit. {cite:zij-sabi-nallino-byblion pp.21-22}."
