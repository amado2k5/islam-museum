summary:
  ar: "حاسيس دواء أرمني، ويقال أيضاً فارسي، ذكر الكتاب أن أحد من ينقل عنهم أنه أقوى من الأفربيون، وأنه محرق للمعدة مقيء. والكمية المميتة متروكة."
  en: "Hasasis is a drug the book calls Armenian, and also Persian. One authority the book quotes says it is stronger than euphorbium, and the book says it burns the stomach and brings on vomiting. The quantity that kills is left out."
  ur: "حاسیس ایک ارمنی دوا ہے، جسے فارسی بھی کہا جاتا ہے۔ کتاب کا ایک ماخذ اسے افربیون سے زیادہ طاقتور بتاتا ہے، اور کتاب کے مطابق یہ معدے کو جلاتی ہے اور قے لاتی ہے۔ جان لیوا مقدار چھوڑ دی گئی ہے۔"
  es: "El libro menciona que la hasasis es una droga de origen armenio y también persa. Una autoridad citada en el libro afirma que es más potente que la euforbia, y que quema el estómago y provoca vómitos. No se especifica la dosis letal."
