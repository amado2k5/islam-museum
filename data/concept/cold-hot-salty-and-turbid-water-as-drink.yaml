  ar: "يذكر ابن سينا أن الماء البارد المعتدل المقدار أوفق المياه للأصحاء، وإن كان قد يضر العصب وأصحاب أورام الأحشاء، وهو ينبه الشهوة ويشد المعدة {cite:canon-ibn-sina-print-v1 pp.137-138}."
  en: "Ibn Sina says cold water of moderate quantity is the water most suited to the healthy, though it may harm the nerves and those with tumours of the viscera; it rouses the appetite and braces the stomach {cite:canon-ibn-sina-print-v1 pp.137-138}."
