  tr: "El-Muhaymin: Karakterini gören ve yaptıklarını koruyan Gözcü. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerde bahsedilen numara 7'de yer alır."
  id: "Al-Muhaymin: Sang Pengawas yang menyaksikan watak-Nya dan menjaga perbuatan mereka. Nama nomor 7 dalam penghitungan yang disebutkan dalam hadis Al-Tirmidhi tentang Nama-nama Allah."
