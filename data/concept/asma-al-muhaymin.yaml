summary:
  ar: 'المهيمن: الرقيب الشاهد على خلقه الحافظ لأعمالهم. الاسم رقم 7 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Muhaymin — The Guardian. Name 7 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Muhaymin — Le Gardien. Nom 7 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'المهيمن: نگران — اپنی مخلوق پر گواہ اور ان کے اعمال کا محافظ۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 7۔'
