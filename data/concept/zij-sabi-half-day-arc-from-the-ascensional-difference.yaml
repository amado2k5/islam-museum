id: concept/zij-sabi-half-day-arc-from-the-ascensional-difference
class: concept
kind: scientific
label: { ar: "نصف قوس النهار من اختلاف المطالع في الزيج الصابي", en: "Half the day arc from the difference of the risings", ur: "مطالع کے اختلاف سے نصف قوس النہار", es: "La mitad del día se calcula a partir de la diferencia de las salidas.", fr: "La moitié de la journée est due à la différence des heures de lever.", tr: "Saba astronomik tablolarındaki doğuş zamanları farkından yola çıkarak günün yarısı.", id: "Setengah busur hari dari perbedaan waktu terbit dalam tabel astronomi Sabaean" }
summary:
  ar: "في طريقة ثانية يأخذ البتاني أزمان مطالع جزء الشمس في الإقليم وفي الفلك المستقيم، وينقص من الأولى تسعين، ثم يأخذ الفضل بين المطالع وينقصه من تسعين أو يزيده عليها بحسب كثرة مطالع الإقليم، فيكون نصف قوس النهار. ويقرر أن هذا الفضل هو حصة جزء الشمس من اختلاف النهار، فيزيده على تسعين إن كانت الشمس في البروج الشمالية وينقصه منها إن كانت في الجنوبية. {cite:zij-sabi-nallino-byblion p.46}."
  en: "In a second way al-Battani takes the rising times of the Sun's degree in the clime and in the right sphere, subtracts ninety from the first, then takes the gap between the risings and subtracts it from ninety or adds it to ninety according to which of the clime's risings is the greater, and the result is half the day arc. He states that this gap is the Sun's degree's share of the difference of the day, which he adds to ninety if the Sun is in the northern signs and subtracts from ninety if it is in the southern. {cite:zij-sabi-nallino-byblion p.46}."
  ur: "دوسرے طریقے میں البتانی اقلیم اور فلک مستقیم میں سورج کے جز کے مطالع کے اوقات لیتے ہیں، پہلے سے نوے گھٹاتے ہیں، پھر مطالع کے درمیان کا فرق لے کر اسے نوے سے گھٹاتے یا نوے پر بڑھاتے ہیں اس پر منحصر کہ اقلیم کے مطالع زیادہ ہیں یا کم، اور نتیجہ نصف قوس النہار ہوتا ہے۔ وہ بتاتے ہیں کہ یہ فرق سورج کے جز کا اختلاف النہار میں حصہ ہے، جسے وہ شمالی بروج میں نوے پر بڑھاتے اور جنوبی بروج میں نوے سے گھٹاتے ہیں۔ {cite:zij-sabi-nallino-byblion p.46}۔"
  es: "En segundo lugar, al-Battani toma las horas de salida del Sol en el grado del clima y en la esfera derecha, le resta noventa a la primera, luego toma el intervalo entre las salidas y lo resta de noventa o lo suma a noventa según cuál de las salidas del clima sea mayor, y el resultado es la mitad del arco del día. Afirma que este intervalo es la parte del grado del Sol en la diferencia del día, que suma a noventa si el Sol está en los signos del norte y le resta de noventa si está en los del sur. {cite:zij-sabi-nallino-byblion p.46}."
  fr: "Dans une seconde méthode, al-Battani prend les heures de lever du Soleil selon le degré du climat et dans la sphère droite, soustrait 90 de la première, puis calcule l'intervalle entre les levers et le soustrait ou l'ajoute à 90 selon le lever du climat le plus avancé. Le résultat correspond à la moitié de l'arc du jour. Il affirme que cet intervalle représente la part du degré du Soleil dans la différence du jour, qu'il ajoute à 90 si le Soleil se trouve dans les signes du nord et qu'il soustrait de 90 s'il se trouve dans les signes du sud. {cite:zij-sabi-nallino-byblion p.46}."
  tr: "İkinci bir yöntemde, el-Battani belirli bir bölgedeki ve düz çizgideki güneş doğuş zamanlarını alır, ilk güneş doğuş zamanından doksanı çıkarır, ardından doğuş zamanları arasındaki farkı alır ve bölgedeki doğuş zamanlarının sayısına bağlı olarak bu farktan doksanı çıkarır veya ekler, böylece gün ışığının yarım yayını belirler. Bu farkın, güneşin gün ışığı değişimindeki payını temsil ettiğini, güneş kuzey takımyıldızlarında ise doksana eklediğini, güney takımyıldızlarında ise çıkardığını belirtir. {cite:zij-sabi-nallino-byblion s.46}."
  id: "Dalam metode kedua, al-Battani mengambil waktu matahari terbit di suatu wilayah tertentu dan dalam garis lurus, mengurangi sembilan puluh dari yang pertama, kemudian mengambil selisih antara waktu terbit dan mengurangi atau menambahkan sembilan puluh tersebut tergantung pada jumlah waktu terbit di wilayah tersebut, sehingga menentukan setengah busur siang hari. Ia menyatakan bahwa selisih ini mewakili bagian matahari dari variasi siang hari, menambahkannya ke sembilan puluh jika matahari berada di konstelasi utara dan menguranginya jika berada di konstelasi selatan. {cite:zij-sabi-nallino-byblion p.46}."
