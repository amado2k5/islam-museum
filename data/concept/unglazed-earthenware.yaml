class: concept
kind: art_form
label: { ar: "الفخار غير المزجج", en: "Unglazed earthenware (early Islamic Iran)", ur: "بے لعاب مٹی کے برتن", es: "Cerámica sin esmaltar (Irán islámico temprano)", fr: "Céramique non émaillée (Iran du début de l'ère islamique)", tr: "sırsız çömlek", id: "tembikar tanpa glasir" }
summary:
  ar: "الفخار غير المزجج في نيسابور الإسلامية المبكرة: جرار التخزين وأواني الطبخ والأباريق الكبيرة لحفظ الماء والصغيرة للشرب، والسرج والشمعدانات والقوالب، ويكشف عن جوانب من الحياة اليومية لا تصفها الكتب {cite:wilkinson-nishapur-pottery p. 332}."
  en: "Unglazed earthenware of early Islamic Nishapur: storage jars, cooking pots, large water pitchers and small drinking pitchers, lamps, candlesticks and moulds, revealing aspects of daily life not described in the literature {cite:wilkinson-nishapur-pottery p. 332}."
  ur: "ابتدائی اسلامی نیشاپور کے بے لعاب برتن: ذخیرے کے مرتبان، کھانا پکانے کے برتن، پانی رکھنے کی بڑی اور پینے کی چھوٹی صراحیاں، چراغ، شمع دان اور سانچے، جو روزمرہ زندگی کے وہ پہلو دکھاتے ہیں جو کتابوں میں نہیں {cite:wilkinson-nishapur-pottery p. 332}."
  es: "Cerámica sin esmaltar de la época islámica temprana de Nishapur: tinajas de almacenamiento, ollas para cocinar, grandes cántaros de agua y pequeñas jarras para beber, lámparas, candelabros y moldes, que revelan aspectos de la vida cotidiana no descritos en la literatura {cite:wilkinson-nishapur-pottery p. 332}."
  fr: "Poterie non émaillée du Nishapur islamique primitif: jarres de stockage, pots de cuisson, grandes cruches à eau et petites cruches à boire, lampes, chandeliers et moules, révélant des aspects de la vie quotidienne non décrits dans la littérature {cite:wilkinson-nishapur-pottery p. 332}."
  tr: "Erken İslami Nişapur'da sırlanmamış çömlekler: saklama kavanozları, pişirme gereçleri, su depolamak için büyük tencereler, küçük içme kapları, eyerler, şamdanlar ve kalıplar; günlük yaşamın kitaplarda anlatılmayan yönlerini ortaya çıkarır {cite:Wilkinson-Nishapur-pottery s. 332}."
  id: "Keramik tanpa glasir di Nishapur Islam awal: guci penyimpanan, peralatan memasak, panci besar untuk penyimpanan air, panci minum kecil, pelana, kandelabra, dan cetakan, mengungkap aspek kehidupan sehari-hari yang tidak dijelaskan dalam buku {cite:Wilkinson-Nishapur-pottery hlm. 332}."
