summary:
  ar: "الفخار غير المزجج في نيسابور الإسلامية المبكرة: جرار التخزين وأواني الطبخ والأباريق الكبيرة لحفظ الماء والصغيرة للشرب، والسرج والشمعدانات والقوالب، ويكشف عن جوانب من الحياة اليومية لا تصفها الكتب {cite:wilkinson-nishapur-pottery p. 332}."
  en: "Unglazed earthenware of early Islamic Nishapur: storage jars, cooking pots, large water pitchers and small drinking pitchers, lamps, candlesticks and moulds, revealing aspects of daily life not described in the literature {cite:wilkinson-nishapur-pottery p. 332}."
  ur: "ابتدائی اسلامی نیشاپور کے بے لعاب برتن: ذخیرے کے مرتبان، کھانا پکانے کے برتن، پانی رکھنے کی بڑی اور پینے کی چھوٹی صراحیاں، چراغ، شمع دان اور سانچے، جو روزمرہ زندگی کے وہ پہلو دکھاتے ہیں جو کتابوں میں نہیں {cite:wilkinson-nishapur-pottery p. 332}."
