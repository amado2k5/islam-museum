summary:
  ar: "الكزبرة رطبة ويابسة، باردة في آخر الأولى إلى الثالثة يابسة في الثانية، فيها قبض وتخدير، ويناقش المؤلف قول جالينوس في برودتها، وينفع الأورام الحارة والدوار ويولد ظلمة البصر {cite:canon-ibn-sina-print-v1 p.533} {cite:canon-ibn-sina-print-v1 p.534}."
  en: "Coriander, fresh and dry, is cold from the end of the first degree to the third and dry in the second, with astringency and numbing. The author weighs Galen's view of its coldness; it helps hot swellings and dizziness and brings darkness to the sight {cite:canon-ibn-sina-print-v1 p.533} {cite:canon-ibn-sina-print-v1 p.534}."
  ur: "دھنیا، تر اور خشک، پہلے درجے کے آخر سے تیسرے تک ٹھنڈا اور دوسرے میں خشک ہے، اس میں قبض اور بے حسی ہے۔ مصنف اس کی ٹھنڈک کے بارے میں جالینوس کے قول کو پرکھتا ہے؛ یہ گرم ورموں اور چکر میں مفید ہے اور نظر میں تاریکی لاتا ہے {cite:canon-ibn-sina-print-v1 p.533} {cite:canon-ibn-sina-print-v1 p.534}۔"
  es: "El cilantro, fresco y seco, es frío desde el final del primer grado hasta el tercero y seco en el segundo, con astringencia y adormecimiento. El autor sopesa la opinión de Galeno sobre su frialdad; ayuda a aliviar la hinchazón y el mareo, y oscurece la vista {cite:canon-ibn-sina-print-v1 p.533} {cite:canon-ibn-sina-print-v1 p.534}."
  fr: "La coriandre, fraîche et sèche, est froide de la fin du premier degré au troisième et sèche au deuxième, avec une sensation d'astringence et d'engourdissement. L'auteur examine l'avis de Galien sur sa froideur; elle soulage les gonflements et les vertiges et trouble la vision {cite:canon-ibn-sina-print-v1 p.533} {cite:canon-ibn-sina-print-v1 p.534}."
