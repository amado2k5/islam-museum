  es: "Astronomía (ilm al-hay'a)"
summary:
  ar: "علم حساب النجوم وفلك البروج ومواضع الكواكب وحركاتها. يعرّف الزيج الصابي موضوعه بأنه حساب النجوم وفلك البروج ومواضع الكواكب وغيرها، ويتناول تقويم الفلك وحساب الأوتار والميل والمطالع والعروض والظل والارتفاع والأبعاد {cite:zij-sabi-nallino-byblion p.1} {cite:zij-sabi-nallino-byblion p.5}."
  en: "The science of computing star positions, the zodiac and the motions of the planets. Al-Zij al-Sabi gives its subject as the computation of stars, the zodiac and planetary positions, and covers the sphere, chords, obliquity, risings, latitude, shadows and distances {cite:zij-sabi-nallino-byblion p.1} {cite:zij-sabi-nallino-byblion p.5}."
  fr: "Science du calcul des positions des astres, du zodiaque et des mouvements des planètes. Al-Zij al-Sabi lui donne pour objet le calcul des astres, du zodiaque et des positions planétaires ; il traite de la sphère, des cordes, de l’obliquité, des levers, de la latitude, des ombres et des distances {cite:zij-sabi-nallino-byblion p.1} {cite:zij-sabi-nallino-byblion p.5}."
  es: "La ciencia del cálculo de las posiciones estelares, el zodíaco y los movimientos de los planetas. Al-Zij al-Sabi define su tema como el cálculo de las posiciones estelares, el zodíaco y los planetas, y abarca la esfera, las cuerdas, la oblicuidad, las salidas, la latitud, las sombras y las distancias {cite:zij-sabi-nallino-byblion p.1} {cite:zij-sabi-nallino-byblion p.5}."
