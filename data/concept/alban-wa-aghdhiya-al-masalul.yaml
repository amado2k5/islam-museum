"summary":
  "ar": "وقد يفتقر اليبس والذبول إلى استعمال اللبن أو الدوغ وفي ذلك تغذية وترطيب وتعديل\
    \ للخلط الفاسد وتغرية للقرحة بالجبنية وتنقية بجلاء ماء اللبن للصديد والمدة بل\
    \ كثيراً ما أبرأ هذا التدبير قروح الرئة إذا لم يقصد في تدبيرها التصليب، والمدمل\
    \ من النبات مثل ما يجري مجراه وأما المنقي المنفث فمثل ما يجري مجراه، ومن اشتغل\
    \ بشرب اللبن فيجب أن يراعى سائر التدبير فإنه إن أخطأ في شيء فربما عاد وبالاً عليه.\
    \ وقد وصف بعض من هو محصل في الطب كيفية سقي اللبن بأيامها ومقاديرها وتدرجها وما\
    \ يخالطه وما يقاس به وما يحتذى فيه وقد ذكر بعض المحصلين أن الأجود في سقي لبن الأتن\
    \ ما كان من دابة ترعى مواضع فيها حشائش ملطفة منقية مع قبض وتجفيف من هذا الجنس.\
    \ وأما لبن المعز فالأصوب فيه أن يمزج بحليبه شيء من الماء وتحمى الحجارة وتطرح فيه\
    \ مراراً حتى ينضج وتذهب مائيته وهذا أجود هضماً من المطبوخ على النار ويراعى أيضاً\
    \ لبن الطبيعة اللهم إلا أن يكون ذرب فيجب أن يجعل فيه شيء من هذا الجنس أو سعال\
    \ كثير فيجعل فيه كثيراء وإن كانت المعدة ضعيفة جعل معه شيء من هذا الجنس واللبن\
    \ المطبوخ إذا هضمه المسلول فهو له غذاء كاف وإذا حم عليه المسلول فيجب أن يقطعه.\
    \ وأما الدوغ فيحتاج إليه عند شدة الحمى وعند الإسهال فهو نافع لهم جداً وأجوده أن\
    \ يترك الرائب ليلة بعد أخذ الزبد كله في وضع معتدل ثم يمخض من الغد مخضاً شديداً\
    \ حتى يمتزج بعضه ببعض امتزاجاً شديداً ثم يؤخذ أقراص من دقيق الحنطة السميذ الجيد\
    \ فيلعق وفي اليوم الثاني يزاد من الدوغ وينقص من الخبز يفعل ذلك دائماً حتى ينقي\
    \ المخيض وحده ثم يقلب القصة إن استغني عن الدوغ وظهرت العافية وانحطت العلة فلا\
    \ يزال ينقص من الدوغ ويزاد في القرص حتى ينقطع اللبن فإن كان يبغضهم ذرب لم يكن\
    \ بإلقاء الحديد المحمى في الدوغ مراراً بأس. وأما أغذيتهم فالمغريات مثل الخبز السميذ\
    \ والأطرية والجاورسية والأرز أيضاً ينقي وينبت اللحم وكشك الشعير الجيد المطبوخ\
    \ مغر ومنق وصالح عند شدة الحمى وخصوصاً ما يتخذ بالنشا والخيار والبطيخ قد يسهل\
    \ النفث وإن كانت الحمى خفيفة فلا كالكرنب وما يجري مجراه والمنقيات. وأما السمك\
    \ المالح فإنه إذا أكل مرة أو مرتين نفع في التنقية وإذا كانت القرحة خبيئة فاجتنبه\
    \ وكل مالح فإن غذوتهم باللحم فليكن مثل لحوم الطياهيج والدجاج والقنابر والعصافير\
    \ كلها غير مسمن والأجود أن يطعم شواء ليكون أشد تجفيفاً وإلحاماً والأكارع أيضاً\
    \ جيدة للزوجتها وإذا اشتهوا المرق فاخلطها بعسل وقد يجوز إدخالهم الحمام قبل الغذاء\
    \ وبعده إذا لم يكن بأكبادهم سدد فإنه يسمنهم ويقويهم وأما ماؤهم الذي يشربونه فليكن\
    \ ماء المطر. وأصحاب السل كثيراً ما يعرض لهم نفث الدم على ما سلف ذكره ومن الأقراص\
    \ الجيدة لذلك قرص من هذا الجنس، وكثيراً ما يبتلى المسلول بسقوط اللهاة فيقع في\
    \ نخير وغطيط من قبله وربما احتيج إلى قطعها فاعلم ذلك، ومن المجربات الجيدة أن تطلى\
    \ نواحي الصدر والجانب الأيمن بمادة من هذا الجنس محكوكة بماء الورد مع قليل من الطين\
    \ المختوم فإنه نافع جداً {cite:canon-ibn-sina-print-v2 p.369}"
  "en": "Dryness and wasting may need the use of milk or buttermilk: in it there is\
    \ feeding, moistening, correcting of the corrupt humour, glutination of the ulcer\
    \ by its cheese, and cleansing by the milk-whey's washing of the pus and the matter\
    \ — indeed this regimen has often healed the lung's ulcers when hardening was\
    \ not intended in their management. The agglutinant among the plants is the like\
    \ of what runs its course, and the cleansing expectorant the like of what runs\
    \ its course; and whoever takes up drinking milk must have the rest of the regimen\
    \ watched over, for if he errs in a thing it may turn to a curse on him. One who\
    \ is accomplished in medicine has described the manner of giving milk — its days,\
    \ its measures and its gradation, what is mixed in it and what it is measured\
    \ by — and some of the accomplished have said that the best in giving donkey milk\
    \ is of a beast that grazes places of softening cleansing herbs with astringency\
    \ and drying, of this kind. As for goat's milk, the soundest in it is that its\
    \ milk is mixed with some water and stones are heated and thrown into it repeatedly\
    \ until it is cooked and its wateriness is gone — this digests better than what\
    \ is cooked on the fire; and the milk of nature is also watched, unless there\
    \ be a flux — then a thing of this kind must be put in it — or much coughing,\
    \ then tragacanth is put in it; and if the stomach is weak a thing of this kind\
    \ is put with it; and cooked milk, if the consumptive digests it, is a sufficing\
    \ food for him; and if fever comes on him it must be cut off. As for buttermilk,\
    \ it is needed at the severity of the fever and at diarrhoea — very beneficial\
    \ for them; the best of it: the sour milk is left a night after all the butter\
    \ is taken off, in a moderate posture, then churned in the morning a hard churning\
    \ until its parts are thoroughly mingled, then discs of good semolina wheat flour\
    \ are taken and licked; on the second day the buttermilk is increased and the\
    \ bread lessened — this is done continually until the churned milk alone cleanses;\
    \ then the story is turned: if the buttermilk is done without and health appears\
    \ and the disease declines, the buttermilk is still lessened and the disc increased\
    \ until the milk is cut off; and if a flux loathes them, throwing hot iron into\
    \ the buttermilk repeatedly is no harm. As for their foods: the glutinous ones\
    \ such as semolina bread, the atrıyya and the jawars dishes; rice also cleanses\
    \ and makes flesh grow; well-cooked good barley kishk is glutinous, cleansing\
    \ and sound at the fever's height, especially what is made with starch; cucumber\
    \ and melon may ease expectoration — but not if the fever is light, like cabbage\
    \ and its like — and the cleansers. As for salted fish: eaten once or twice it\
    \ benefits the cleansing, but if the ulcer is hidden, shun it and every salty\
    \ thing; if they are fed meat, let it be the like of partridge, chicken, lark\
    \ and sparrow meats — all unsalted — and the best is feeding roast, that it may\
    \ dry and heal more; the trotters are also good for their viscidity; and if they\
    \ crave broth, mix it with honey; they may also be brought into the bath before\
    \ and after food if their livers have no obstruction — it fattens and strengthens\
    \ them; and the water they drink, let it be rain water. The consumptive often\
    \ suffer the spitting of blood, as has been said before — a good tablet of this\
    \ kind exists for it. And the consumptive is often afflicted with the falling\
    \ of the uvula, which brings on snuffling and snoring — and cutting it may be\
    \ needed: know that. And among the good tried things: anointing the chest regions\
    \ and the right side with a substance of this kind rubbed up in rosewater with\
    \ a little stamped clay — it is very beneficial {cite:canon-ibn-sina-print-v2\
    \ p.369}"
  "ur": "خشکی اور سوکھے کو دودھ یا لسی کے استعمال کی ضرورت پڑ سکتی ہے اس میں غذا تر\
    \ کرنے فاسد خلط کی اصلاح پنیر سے قرحة کو چپکانا اور دودھ کے پانی سے پیپ اور مادہ\
    \ کو دھو کر صاف کرنا ہے بلکہ اس تدبیر نے اکثر پھیپھڑے کے زخم شفا دیے ہیں جب ان\
    \ کے تدبیر میں سخت کرنا مقصود نہ ہو اور پودوں میں ملحم وہ ہے جو اس کے مجرى میں\
    \ ہو اور صاف کرنے والا نفث کرنے والا بھی اسی مجرى کی چیز اور جو دودھ پینے پر لگے\
    \ اسے باقی تدبیر کی بھی رعایت کرنی چاہیے کیونکہ اگر کسی چیز میں بھولے تو وہ اس\
    \ پر وبال ہو سکتی ہے اور طب کے کسی ماہر نے دودھ پلانے کی صفت بیان کی ہے اس کے\
    \ دن اس کی مقداریں اور اس کا تدریج کیا ملا یا جائے اور کس ناپ سے ناپا جائے اور\
    \ بعض ماہروں نے کہا کہ گدھے کا دودھ پلانے میں بہترین وہ ہے جو ایسے جانور کا ہو\
    \ جو ایسے مقامات چرے جہاں اسی جنس کی نرم صاف کرنے والی قبض اور خشک کرنے والی جڑی\
    \ بوٹیاں ہوں اور بکری کے دودھ میں درست ترین یہ ہے کہ اس کے دودھ میں کچھ پانی ملایا\
    \ جائے اور پتھر گرم کر کے بار بار اس میں ڈالے جائیں یہاں تک کہ پک جائے اور اس\
    \ کی پانی جاتی رہے اور یہ آگ پر پکے ہوئے سے بہتر ہضم ہے اور طبیعت کا دودھ بھی\
    \ دیکھا جائے مگر ذرب ہو تو اس میں اسی جنس کی کچھ چیز ڈالنی چاہیے یا بہت کھانسی\
    \ ہو تو کثيراء ڈالی جائے اور معدہ کمزور ہو تو اسی جنس کی چیز اس کے ساتھ ڈالی جائے\
    \ اور پکا ہوا دودھ اگر سل والا ہضم کر لے تو اس کے لیے کافی غذا ہے اور اگر اس پر\
    \ بخار آ جائے تو کاٹنا چاہیے اور لسی حمى کی شدت اور دست پر درکار ہوتی ہے ان کے\
    \ لیے بہت مفید اس کا بہترین یہ کہ مکھن سب نکالنے کے بعد کھٹا دودھ ایک رات معتدل\
    \ حالت میں چھوڑا جائے پھر صبح سخت مٹھایا جائے یہاں تک کہ اچھی طرح مل جائے پھر\
    \ اچھی سميد کی روٹی کی قرصیں لیے کر چاٹی جائیں اور دوسرے دن لسی بڑھائی اور روٹی\
    \ گھٹائی جائے یہ مسلسل ہوتا رہے یہاں تک کہ مکھن کا پانی اکیلا صاف کرنے لگے پھر\
    \ قصہ الٹا جائے اگر لسی کے بغیر کام چلے اور صحت ظاہر اور علت زوال پزیر ہو تو لسی\
    \ گھٹاتے اور قرص بڑھاتے رہو یہاں تک کہ دودھ بند ہو جائے اور اگر ذرب انہیں ناگوار\
    \ لگے تو گرم لوہا لسی میں بار بار ڈالنا کوئی حرج نہیں اور ان کی غذائیں چپکنے والی\
    \ ہیں جیسے سميد کی روٹی اطریہ اور جاورس کی اشیاء اور چاول بھی صاف کرتا اور گوشت\
    \ چڑھاتا ہے اور اچھا پکا ہوا جو کا کشک چپکانے والا صاف کرنے والا اور حمى کی شدت\
    \ پر صالح ہے خاص طور پر نشہ سے بنا ہوا اور کھیرا اور خربوزہ نفث آسان کر سکتے ہیں\
    \ مگر حمى ہلکی ہو تو نہیں جیسے گوبھی اور اس کے ہم جنس اور صاف کرنے والی چیزیں\
    \ اور نمکین مچھلی ایک دو بار کھانے سے تنقیہ میں نفع دیتی ہے مگر زخم چھپا ہو تو\
    \ اسے اور ہر نمکین چیز سے بچو اور اگر انہیں گوشت کھلاؤ تو بکبتر مرغ ٹیتری اور\
    \ چڑیا جیسے گوشت ہوں سب بغیر نمک اور بہترین بھنا کھلانا ہے تاکہ زیادہ خشک اور\
    \ التحام کرنے والا ہو اور پائے بھی اپنی چپکاہٹ سے اچھے ہیں اور اگر شوربے کی خواہش\
    \ کریں تو اسے شہد ملا دو اور اگر ان کے جگر میں رکاوٹ نہ ہو تو غذا سے پہلے اور\
    \ بعد میں حمام لے جانا جائز ہے وہ انہیں موٹا اور مضبوط کرتا ہے اور ان کا پینے\
    \ کا پانی برسات کا پانی ہو اور سل والوں کو اکثر نفث الدم ہوتا ہے جیسا پہلے کہا\
    \ گیا اس کے لیے اسی جنس کی اچھی قرص ہے اور سل والے کو اکثر لهاة کے گرنے کی آفت\
    \ ہوتی ہے جس سے ناک کی آواز اور کھڑکھڑاہٹ آتی ہے اور کبھی اسے کاٹنے کی ضرورت پڑتی\
    \ ہے یہ جان لو اور اچھی آزمائی ہوئی چیزوں میں سینے کی طرفوں اور دائیں پہلو پر\
    \ اسی جنس کی شے کو گلاب کے پانی میں رگڑ کر تھوڑی مہر لگی مٹی کے ساتھ ملانا ہے\
    \ یہ بہت مفید ہے {cite:canon-ibn-sina-print-v2 p.369}"
