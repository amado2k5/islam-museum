label: { ar: "بُعد المريخ وقطره الظاهر وعظم جرمه", en: "The distance, apparent diameter and size of Mars", ur: "مریخ کا بُعد، ظاہری قطر اور جرم", es: "La distancia, el diámetro aparente y el tamaño de Marte.", fr: "La distance, le diamètre apparent et la taille de Mars" }
summary:
  ar: "يذكر النص أن المريخ يتفاوت عظمه بين بعديه الأبعد والأقرب، وأن عظمه في بعده الأقرب سبعة أمثال عظمه في بعده الأبعد، وأن بعده الأبعد ثمانية آلاف واثنان وعشرون مرة مثل نصف قطر الأرض، وأن بعده الأوسط نحو أربعة آلاف وخمسمائة وأربعة وثمانين مرة. وأن قطر المريخ الظاهر درجتان ودقيقة تقريباً، وعظم جرمه في بعده الأوسط قدر جزء من عشرين من قطر الشمس. {cite:zij-sabi-nallino-byblion pp.187-188}"
  en: "The text states that Mars's apparent size varies between its farthest and nearest positions, and that its nearest size is seven times its farthest size. Its farthest distance is given as eight thousand and twenty-two times the Earth's radius and its middle distance as about four thousand, five hundred and eighty-four. Its apparent diameter is about two degrees and a minute, and its mean diameter is given as one twentieth of the Sun's. {cite:zij-sabi-nallino-byblion pp.187-188}"
  ur: "متن کہتا ہے کہ مریخ کا ظاہری حجم اس کے دور اور قریب مقامات کے درمیان بدلتا ہے، اور قریب کا حجم دور کے حجم کا سات گنا ہے۔ اس کا دور کا بُعد زمین کے نصف قطر کے آٹھ ہزار بائیس گنا بتایا گیا ہے، اور وسطی بُعد تقریباً چار ہزار پانچ سو چوراسی گنا۔ اس کا ظاہری قطر تقریباً دو درجے اور ایک دقیقہ ہے، اور اس کا وسطی قطر سورج کے قطر کا بیسواں حصہ۔ {cite:zij-sabi-nallino-byblion pp.187-188}"
  es: "El texto indica que el tamaño aparente de Marte varía entre su posición más lejana y la más cercana, y que su tamaño más cercano es siete veces mayor que su tamaño más lejano. Su distancia más lejana se estima en ocho mil veintidós veces el radio de la Tierra, y su distancia media en aproximadamente cuatro mil quinientos ochenta y cuatro. Su diámetro aparente es de aproximadamente dos grados y un minuto, y su diámetro medio se estima en una vigésima parte del diámetro del Sol. {cite:zij-sabi-nallino-byblion pp.187-188}"
  fr: "Le texte indique que la taille apparente de Mars varie entre ses positions les plus éloignées et les plus proches, et que sa taille au plus près est sept fois supérieure à sa taille au plus loin. Sa distance maximale est donnée comme étant de huit mille vingt-deux fois le rayon de la Terre et sa distance moyenne d'environ quatre mille cinq cent quatre-vingt-quatre. Son diamètre apparent est d'environ deux degrés et une minute, et son diamètre moyen est donné comme étant un vingtième de celui du Soleil. {cite:zij-sabi-nallino-byblion pp.187-188}"
