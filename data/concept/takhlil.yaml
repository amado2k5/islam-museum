id: concept/takhlil
class: concept
kind: legal
label:
  ar: "التخليل"
  en: "Takhlil (passing water between fingers, hair and teeth; vinegar from wine)"
  ur: "تخلیل ⁦(انگلیوں، بالوں اور دانتوں میں خلال کرنا)⁩"
  es: "Takhlil (pasar agua entre los dedos, el cabello y los dientes; vinagre de vino)"
  fr: "Takhlil (passer de l'eau entre les doigts, les cheveux et les dents; vinaigre de vin)"
  tr: "turşu"
  id: "pengasinan"
summary:
  ar: "التخليل إيصال الماء أو تفريق الشعر أو إخراج ما بين الأسنان، وأحكامه في الطهارة تختلف بين الفرض والسنة والاستحباب. وفي تخليل الخمر حكم خاص: الخمر إذا تخللت بنفسها صارت طاهرة حلالا عند الفقهاء، وفي إلقاء شيء فيها خلاف بين الشافعية والحنابلة من جهة، والحنفية والمالكية من جهة أخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4826}"
  en: "Takhlil is passing water through the fingers, combing or separating the hair, or cleaning between the teeth; in purification its rulings range from obligation to sunna and recommendation. Wine that turns to vinegar by itself becomes pure and lawful; adding something to wine to make vinegar is disputed, the Shafi'is and Hanbalis forbidding it and the Hanafis and (preferably) Malikis allowing it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4826}"
  es: "Takhlil consiste en pasar agua entre los dedos, peinar o separar el cabello, o limpiar entre los dientes; en purificación, sus normas varían desde la obligación hasta la sunna y la recomendación. El vino que se convierte en vinagre por sí solo se vuelve puro y lícito; añadir algo al vino para hacer vinagre es un tema controvertido, ya que los shafiíes y los hanbalíes lo prohíben, mientras que los hanafíes y (preferiblemente) los malikíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4826}"
  fr: "Le takhlil consiste à se passer de l'eau entre les doigts, à se peigner ou à se démêler les cheveux, ou à se nettoyer entre les dents; en matière de purification, les règles varient entre obligation, sunna et recommandation. Le vin qui se transforme naturellement en vinaigre devient pur et licite; l'ajout d'une substance au vin pour obtenir du vinaigre est controversé: les écoles chaféite et hanbalite l'interdisent, tandis que les écoles hanafite et (de préférence) malikite l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4826}"
  ur: "تعلیل انگلیوں سے پانی بہانا، کنگھی کرنا یا بالوں کو الگ کرنا، یا دانتوں کے درمیان صفائی کرنا۔ تزکیہ میں اس کے احکام فرض سے لے کر سنت اور سفارش تک ہیں۔ شراب جو سرکہ بن جاتی ہے خود ہی پاک اور حلال ہو جاتی ہے۔ سرکہ بنانے کے لیے شراب میں کوئی چیز شامل کرنے میں اختلاف ہے، شافعی اور حنبلی اس سے منع کرتے ہیں اور حنفیہ اور ⁦(ترجیحی طور پر)⁩ مالکی اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4820} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4821}"
  tr: "Turşulama, suyun verilmesi, saçın ayrılması veya dişler arasındaki şeyin çıkarılmasıdır. Arınma ile ilgili kararları zorunlu ve önerilen uygulamalar arasında değişiklik gösterir. Turşu şarabı ile ilgili özel bir kural vardır: şarap kendine nüfuz ederse, fıkıhlara göre saf ve izin verilen olur. Şafiiler ile Hanbaliler arasında bir yanda, Hanafileri ve Malikiler arasında ise anlaşmazlık vardır. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.4820} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.4821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4826}"
  id: "Pengasinan adalah pengiriman air, memisahkan rambut, atau menghilangkan apa yang ada di antara gigi. Aturan pemurniannya berbeda antara praktik wajib dan yang direkomendasikan. Ada aturan khusus mengenai pengasinan anggur: jika anggur meresap sendiri, anggur menjadi murni dan diperbolehkan menurut para ahli hukum. Ada perbedaan pendapat antara Syafi'i dan Hanbalis di satu sisi, dan Hanafi serta Malik di sisi lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4820} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.4821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4826}"
