  en: "Takhlil (passing water between fingers, hair and teeth; vinegar from wine)"
  ur: "تخلیل (انگلیوں، بالوں اور دانتوں میں خلال کرنا)"
summary:
  ar: "التخليل إيصال الماء أو تفريق الشعر أو إخراج ما بين الأسنان، وأحكامه في الطهارة تختلف بين الفرض والسنة والاستحباب. وفي تخليل الخمر حكم خاص: الخمر إذا تخللت بنفسها صارت طاهرة حلالا عند الفقهاء، وفي إلقاء شيء فيها خلاف بين الشافعية والحنابلة من جهة، والحنفية والمالكية من جهة أخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4826}"
  en: "Takhlil is passing water through the fingers, combing or separating the hair, or cleaning between the teeth; in purification its rulings range from obligation to sunna and recommendation. Wine that turns to vinegar by itself becomes pure and lawful; adding something to wine to make vinegar is disputed, the Shafi'is and Hanbalis forbidding it and the Hanafis and (preferably) Malikis allowing it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4826}"
