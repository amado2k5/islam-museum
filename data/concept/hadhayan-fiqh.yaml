id: concept/hadhayan-fiqh
class: concept
kind: legal
label: { ar: "هَذَيان", en: "Hadhayan (delirium: its effect on acts and testimony)", es: "Hadhayan (delirio: su efecto en los actos y el testimonio)", fr: "Hadhayan (délire: son effet sur les actes et le témoignage)", ur: "ہدھیان ⁦(ڈیلیریم: اعمال اور گواہی پر اس کا اثر)⁩", tr: "delirium", id: "delirium" }
summary:
  ar: "الهذيان في اللغة الكلام بغير معقول في مرض أو غيره، وفي الاصطلاح التكلم بغير روية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} ويُفرّق عن اللغو والهذيان بأن اللغو لا يترتب عليه أثر في ثبوت الحكم، أما اللغط فيُقصد معناه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} وأجمع أهل العلم على أن طلاق زائل العقل بغير سكر لا يقع، وذهب الحنفية إلى أن من غلب على كلامه الهذيان لا يُعتد بعباراته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} ونص المالكية على أن من طلق في الهذيان ثم أفاق وادّعى عدم الشعور لم يلزمه شيء، إلا أن تشهد بينة بصحة عقله، أو قال إن شيئاً وقع منه ولم يعقله فيلزمه الطلاق عند ابن ناجي، واعترض عليه الدردير بأن المريض قد يتخيل خيالات فيتكلم بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} ومن شروط العدالة عند الحنفية قلة اللغو والهذيان، فمن اعتاد الكذب أو الهذيان لم تُقبل شهادته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519}"
  en: "Hadhayan in the lexical sense is speech without sense, in illness or otherwise; technically it is speaking without reflection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} It differs from lagh, speech with no legal weight, and from laghat, noisy talk whose meaning is intended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} All scholars agree that the divorce of one who has lost his reason, without intoxication, does not take effect; the Hanafis hold that the words of one whose speech is mostly delirious carry no weight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} The Malikis hold that one who divorces in delirium and later says he did not notice is not bound, unless evidence shows his reason was sound; if he says something happened that he did not understand, Ibn Naji holds the divorce binds him, and al-Dardir objects that a sick man may imagine things and speak accordingly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} Among the conditions of uprightness, the Hanafis require little idle talk and delirium; a man given to lying or delirium is not accepted as a witness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519}"
  es: "Hadhayan en el sentido léxico es habla sin sentido, en enfermedad o en otras circunstancias; técnicamente es hablar sin reflexión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} Se diferencia de lagh, habla sin peso legal, y de laghat, charla ruidosa cuyo significado se pretende. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} Todos los eruditos coinciden en que el divorcio de quien ha perdido la razón, sin intoxicación, no tiene efecto; los Hanafis sostienen que las palabras de quien habla mayormente delirante no tienen peso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} Los malikíes sostienen que quien se divorcia en estado de delirio y luego dice no haberse dado cuenta no está obligado, a menos que haya pruebas de que su razón era lúcida; si dice que sucedió algo que no comprendió, Ibn Naji sostiene que el divorcio lo vincula, y al-Dardir objeta que un enfermo puede imaginar cosas y hablar en consecuencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} Entre las condiciones de rectitud, los hanafíes exigen poca charla ociosa y delirio; un hombre propenso a mentir o al delirio no es aceptado como testigo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519}"
  fr: "Le terme « hadhayan », au sens lexical, désigne des paroles dénuées de sens, qu'elles soient dues à la maladie ou non; techniquement, il s'agit de parler sans réfléchir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} Il diffère du « lagh », paroles sans valeur juridique, et du « laghat », bavardage bruyant dont le sens est voulu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} Tous les savants s'accordent à dire que le divorce d'une personne ayant perdu la raison, sans être sous l'influence de l'alcool ou de drogues, est sans effet; les hanafites estiment que les paroles d'une personne dont le discours est principalement délirant sont sans valeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} Les Malikites estiment que celui qui divorce en état de délire et prétend ensuite ne pas avoir été conscient de l'événement n'est pas lié par le divorce, à moins que des preuves ne démontrent la validité de son raisonnement. S'il affirme qu'un événement s'est produit sans qu'il en ait conscience, Ibn Naji considère que le divorce le lie, tandis qu'al-Dardir objecte qu'un malade peut imaginer des choses et parler en conséquence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} Parmi les conditions de la droiture, les Hanafites exigent peu de paroles vaines et de délire; un homme enclin au mensonge ou au délire n'est pas accepté comme témoin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519}"
  ur: "لغوی معنوں میں ہدایان بغیر احساس کے، بیماری میں یا کسی اور صورت میں تقریر ہے۔ تکنیکی طور پر یہ عکاسی کے بغیر بول رہا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16517} یہ لغو سے مختلف ہے جس میں کوئی شرعی وزن نہیں ہے اور لغو سے مختلف ہے جس کا مطلب مقصود ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16517} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16518} تمام علماء اس بات پر متفق ہیں کہ بغیر نشہ کے بغیر وجہ سے محروم ہونے والے کی طلاق نافذ نہیں ہوتی۔ احناف کا خیال ہے کہ جس کی بات زیادہ تر دلفریب ہو اس کی بات میں کوئی وزن نہیں ہوتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16518} مالکیوں کا خیال ہے کہ جس نے بدحواسی میں طلاق دی اور بعد میں کہے کہ میں نے محسوس نہیں کیا وہ پابند نہیں ہے، جب تک کہ اس کی وجہ صحیح نہ ہو۔ اگر وہ کہے کہ کوئی ایسی بات ہوئی جو اس کی سمجھ میں نہیں آئی تو ابن ناجی کہتے ہیں کہ طلاق اس کو پابند کرتی ہے، اور الدردیر نے اعتراض کیا ہے کہ بیمار آدمی چیزوں کا تصور کرے اور اس کے مطابق بات کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16518} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16519} صراط مستقیم کی شرائط میں سے احناف کو بہت کم فضول گفتگو اور بدگمانی کی ضرورت ہے۔ جھوٹ بولنے یا فریب دینے والے آدمی کو بطور گواہ قبول نہیں کیا جاتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 16519}"
  tr: "Dilde deliryum, hastalık sırasında ya da başka bir şekilde sebepsiz konuşma anlamına gelir ve terminolojide içgörüsüz konuşmadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16517} Boş konuşma ve deliryumdan farklıdır; saçmalık, bir kararın belirlenmesini etkilemezken, belirsiz anlamını ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16518} Bilginler, sarhoşluk olmadan kaybedilen boşanmanın etkili olmadığı konusunda oybirliğiyle hemfikirdir ve Hanafiler, konuşmasının ağırlıklı olarak deliryum içindeyse sözlerinin dikkate alınmaması gerektiğini savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16518} Malikiler, deliryumda boşanıp sonra bilincini geri kazanan birinin, aklının sağlam olduğunu kanıtlayan kanıt yoksa veya başına bir şey olduğunu ve aklı başında olmadığını söylediği sürece boşanmanın zorunlu olduğunu belirtmiştir. Al-Dardir, hastanın hayaller kurup onlarla konuşabileceğini savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16519} Hanafilere göre adaletin koşulları arasında boş konuşmanın ve deliryumun azaltılması vardır. Yalan söylemeye veya deliryuma alışkın olan kabul edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16519}"
  id: "Delusi dalam bahasa berarti berbicara tanpa alasan, baik saat sakit maupun lainnya, dan dalam terminologi, itu adalah ucapan tanpa wawasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16517} Ini berbeda dari omong kosong dan delirium karena omong kosong tidak memengaruhi penetapan keputusan, sedangkan samar merujuk pada maknanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16518} Para sarjana sepakat bulat bahwa perceraian yang hilang tanpa mabuk tidak berlaku, dan para Hanafi berpendapat bahwa jika ucapannya didominasi oleh delirium, kata-katanya tidak boleh dipertimbangkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16518} Keluarga Malik menyatakan bahwa siapa pun yang bercerai dalam keadaan delirium lalu sadar kembali tidak wajib melakukannya, kecuali ada bukti yang membuktikan kewarasan pikirannya, atau jika ia mengatakan sesuatu terjadi padanya dan ia tidak rasional, maka perceraian adalah wajib menurut Ibn Naji. Al-Dardir keberatan agar pasien dapat membayangkan khayalan dan berbicara dengannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16519} Di antara syarat keadilan menurut Hanafi adalah pengurangan omongan kosong dan delirium. Siapa pun yang terbiasa berbohong atau delirium tidak diterima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519}"
