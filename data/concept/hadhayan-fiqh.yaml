id: concept/hadhayan-fiqh
class: concept
kind: legal
label: { ar: "هَذَيان", en: "Hadhayan (delirium: its effect on acts and testimony)" }
summary:
  ar: "الهذيان في اللغة الكلام بغير معقول في مرض أو غيره، وفي الاصطلاح التكلم بغير روية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} ويُفرّق عن اللغو والهذيان بأن اللغو لا يترتب عليه أثر في ثبوت الحكم، أما اللغط فيُقصد معناه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} وأجمع أهل العلم على أن طلاق زائل العقل بغير سكر لا يقع، وذهب الحنفية إلى أن من غلب على كلامه الهذيان لا يُعتد بعباراته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} ونص المالكية على أن من طلق في الهذيان ثم أفاق وادّعى عدم الشعور لم يلزمه شيء، إلا أن تشهد بينة بصحة عقله، أو قال إن شيئاً وقع منه ولم يعقله فيلزمه الطلاق عند ابن ناجي، واعترض عليه الدردير بأن المريض قد يتخيل خيالات فيتكلم بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} ومن شروط العدالة عند الحنفية قلة اللغو والهذيان، فمن اعتاد الكذب أو الهذيان لم تُقبل شهادته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519}"
  en: "Hadhayan in the lexical sense is speech without sense, in illness or otherwise; technically it is speaking without reflection. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} It differs from lagh, speech with no legal weight, and from laghat, noisy talk whose meaning is intended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} All scholars agree that the divorce of one who has lost his reason, without intoxication, does not take effect; the Hanafis hold that the words of one whose speech is mostly delirious carry no weight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} The Malikis hold that one who divorces in delirium and later says he did not notice is not bound, unless evidence shows his reason was sound; if he says something happened that he did not understand, Ibn Naji holds the divorce binds him, and al-Dardir objects that a sick man may imagine things and speak accordingly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16518} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519} Among the conditions of uprightness, the Hanafis require little idle talk and delirium; a man given to lying or delirium is not accepted as a witness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16519}"
