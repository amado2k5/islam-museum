id: concept/maskut-anhu
class: concept
kind: legal
label:
  ar: المسكوت عنه
  en: What the Law was silent about
summary:
  ar: "المسكوت عنه ما لم يرد فيه نص تحريم ولا إيجاب؛ يقسّم حديث أبي ثعلبة الخشني التكليف أربعة أقسام: فرائض أوجبها فلا تضيع، وحدود حدّها فلا تُعتد، وأشياء حرّمها فلا تنتهك، وأشياء سكت عنها «رحمة لكم غير نسيان» فلا يُبحث عنها — فالسكوت رحمة وعفو لا دليل على الحظر ولا على الوجوب؛ وفي رواية أبي الدرداء عند البزار والحاكم «ما سكت عنه فهو عفو فاقبلوا من الله عافيته فإن الله لم يكن لينسى شيئاً» ثم تلا «وما كان ربك نسياً» [مريم 64]، وفي رواية سلمان الموقوفة عند الترمذي «ما سكت عنه فهو مما عفا عنه» — فالعفوية الأصل فيما سكت الله عنه لا التحريم."
  en: "The maskut 'anhu is whatever the Law's texts neither forbid nor oblige; Abu Tha'laba al-Khushani's hadith divides the charge four ways: obligations ordained and not to be neglected, bounds set and not to be transgressed, things forbidden and not to be violated, and things passed over in silence 'as a mercy to you, not out of forgetfulness', not to be searched into — the silence being mercy and pardon, evidence neither of prohibition nor of obligation; Abu al-Darda''s route in al-Bazzar and al-Hakim runs 'what He was silent about is pardon, so accept God's pardon, for God was never one to forget anything', followed by 'your Lord was never forgetful' (Maryam 64), and Salman's halted version in al-Tirmidhi has 'what He was silent about is among what He pardoned' — pardon, not prohibition, being the default of what God left unspoken."
