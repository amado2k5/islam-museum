id: concept/maskut-anhu
class: concept
kind: legal
label:
  ar: المسكوت عنه
  en: What the Law was silent about
  es: "De lo que la ley guardaba silencio"
  fr: "Ce que la loi gardait le silence sur"
  ur: "جس پر قانون خاموش تھا۔"
  tr: "Sessiz"
  id: "Keheningan"
summary:
  ar: "المسكوت عنه ما لم يرد فيه نص تحريم ولا إيجاب؛ يقسّم حديث أبي ثعلبة الخشني التكليف أربعة أقسام: فرائض أوجبها فلا تضيع، وحدود حدّها فلا تُعتد، وأشياء حرّمها فلا تنتهك، وأشياء سكت عنها «رحمة لكم غير نسيان» فلا يُبحث عنها — فالسكوت رحمة وعفو لا دليل على الحظر ولا على الوجوب؛ وفي رواية أبي الدرداء عند البزار والحاكم «ما سكت عنه فهو عفو فاقبلوا من الله عافيته فإن الله لم يكن لينسى شيئاً» ثم تلا «وما كان ربك نسياً» [مريم 64]، وفي رواية سلمان الموقوفة عند الترمذي «ما سكت عنه فهو مما عفا عنه» — فالعفوية الأصل فيما سكت الله عنه لا التحريم."
  en: "The maskut 'anhu is whatever the Law's texts neither forbid nor oblige; Abu Tha'laba al-Khushani's hadith divides the charge four ways: obligations ordained and not to be neglected, bounds set and not to be transgressed, things forbidden and not to be violated, and things passed over in silence 'as a mercy to you, not out of forgetfulness', not to be searched into — the silence being mercy and pardon, evidence neither of prohibition nor of obligation; Abu al-Darda''s route in al-Bazzar and al-Hakim runs 'what He was silent about is pardon, so accept God's pardon, for God was never one to forget anything', followed by 'your Lord was never forgetful' (Maryam 64), and Salman's halted version in al-Tirmidhi has 'what He was silent about is among what He pardoned' — pardon, not prohibition, being the default of what God left unspoken."
  es: "El maskut 'anhu es todo aquello que los textos de la Ley no prohíben ni obligan; el hadiz de Abu Tha'laba al-Khushani divide la acusación en cuatro partes: obligaciones ordenadas que no deben descuidarse, límites establecidos que no deben transgredirse, cosas prohibidas que no deben violarse y cosas pasadas por alto en silencio 'como una misericordia para ti, no por olvido', que no deben ser investigadas; el silencio es misericordia y perdón, evidencia que no es ni de prohibición ni de obligación; la ruta de Abu al-Darda en al-Bazzar y al-Hakim dice 'lo que Él guardó silencio es perdón, así que acepta el perdón de Dios, porque Dios nunca fue uno de los que olvidan nada', seguido de 'tu Señor nunca fue olvidadizo' (Maryam 64), y la versión interrumpida de Salman en al-Tirmidhi dice 'lo que Él guardó silencio está entre lo que perdonó'; el perdón, no la prohibición, es el defecto de lo que Dios dejó sin decir."
  fr: "Le maskut 'anhu désigne ce que les textes de la Loi n'interdisent ni n'obligent. Le hadith d'Abu Tha'laba al-Khushani divise cette notion en quatre catégories: les obligations prescrites qu'il ne faut pas négliger, les limites fixées qu'il ne faut pas transgresser, les interdictions qu'il ne faut pas enfreindre, et les choses passées sous silence « par miséricorde envers vous, et non par oubli », qu'il ne faut pas examiner – le silence étant miséricorde et pardon, preuve ni d'interdiction ni d'obligation. Selon Abu al-Darda' dans al-Bazzar et al-Hakim, « ce dont Il a gardé le silence est pardon, acceptez donc le pardon de Dieu, car Dieu n'oublie jamais rien », suivi de « votre Seigneur n'est jamais oublieux » (Maryam 64). La version de Salman dans al-Tirmidhi, bien que plus courte, dit: « ce dont Il a gardé le silence fait partie de ce qu'Il a pardonné » – le pardon, et non l'interdiction, étant la conséquence de ce que Dieu n'a pas dit."
  ur: "مسقط عنہ وہ چیز ہے جو قانون کے نصوص میں نہ تو منع ہے اور نہ واجب؛ ابو ثعلبہ خشنی کی حدیث الزام کو چار طریقوں سے تقسیم کرتی ہے: واجبات مقرر کیے گئے اور ان میں غفلت نہ کی جائے، حدود متعین کیے جائیں اور ان سے تجاوز نہ کیا جائے، چیزیں حرام اور ان کی خلاف ورزی نہ کی جائیں، اور چیزیں خاموشی سے گزر جائیں 'تمہارے لیے رحمت کے طور پر، نہ بھولنے کی وجہ سے'، نہ کہ خاموشی سے ثبوت تلاش کیا جائے، اور نہ ہی اس کی تلاش کی جائے۔ نہ ہی ذمہ داری کی؛ البزار اور الحکیم میں ابو الدرداء کا راستہ چلتا ہے کہ 'وہ جس چیز کے بارے میں خاموش تھا وہ معافی ہے، لہذا خدا کی معافی کو قبول کرو، کیونکہ خدا کبھی بھی کسی چیز کو بھولنے والا نہیں تھا'، اس کے بعد 'تمہارا رب کبھی بھولنے والا نہیں تھا' ⁦(مریم 64)⁩، اور الترمذی میں سلمان کا روکا ہوا نسخہ ہے - 'وہ معافی کے بارے میں کیا ہے، وہ معافی میں سے کیا نہیں تھا'۔ ممانعت، خدا نے جو کچھ نہ کہا اس کا ڈیفالٹ ہونا۔"
  tr: "Söylenmeyen, açıkça yasaklamayan veya yasaklamayan şeylerdir; Ebu Telabah el-Haşni'nin hadisi dört kategoriye ayırır: Kendisinin ödettiği ve boşa harcamadığı yükümlülükler, uyulmayan, ihlal edilmemesi için yasakladığı şeyler ve \"sana unutmadan bir merhamet\" diye sessiz kaldığı şeyler — sessizlik merhamet ve bağışlamadır, yasak veya zorunluluk kanıtı yoktur; ve El-Bazsar ve El-Hakim'e göre Ebu Derde'nin rivayetinde: \"Sustuğun şey bir afdır, Allah'tan iyiliğini kabul et, Allah hiçbir şeyi unutmaz,\" sonra şöyle okunmuştur: \"Ve Rabbin asla unutmadı\" [Meryem 64]. Selman'ın rivayetinde, ki bu Tirmidi tarafından durdurulur, \"Bağışlanan onun affettiğidir.\" — Allah'ın susmasının temeli spontane olmaktır, yasak değil."
  id: "Yang tidak diucapkan adalah hal-hal yang tidak secara eksplisit melarang atau memberlakukan larangan; hadits Abu Tha'labah al-Khashni membagi kewajiban menjadi empat kategori: kewajiban yang telah diwajibkan dan tidak disia-siakan, batasan yang tidak dipatuhi, hal-hal yang dilarangnya agar tidak dilanggar, dan hal-hal yang ia diamkan tentang \"rahmat untukmu tanpa melupakan\" agar ia tidak mencarinya — diam adalah rahmat dan pengampunan, tanpa bukti larangan atau kewajiban; dan dalam narasi Abu Darda menurut Al-Bazzar dan Al-Hakim: \"Apa yang kau diamkan adalah pengampunan, maka terimalah dari Allah kesejahteraan-Nya, karena Allah tidak akan pernah lupa apa pun,\" lalu mengucapkan: \"Dan Tuhanmu tidak pernah pelupa\" [Maryam 64]. Dalam riwayat Salman, yang dihentikan oleh Al-Tirmidhi, \"Apa yang diampuni adalah apa yang telah Dia ampuni.\" — spontanitas adalah dasar dari apa yang Allah diamkan, bukan larangan."
