label:
  ar: "حور رومي"
  en: "Hawr rumi (the Rumi tree)"
  ur: "حور رومی ⁦(رومی درخت)⁩"
  es: "Hawr rumi (el árbol de Rumi)"
summary:
  ar: "حور رومي شجرة يُسمّى ثمرها التروس، وطبعها معتدل إلى اليبس وفيها لطافة. ورقها مع الخل ضماد لوجع النقرس، وعصارة ورقها تُقطر في الأذن فتسكّن وجعها، وثمرتها بالخل تنفع من الصرع."
  en: "Hawr rumi is a tree whose fruit the book calls al-turus. The book gives two temperament statements, moderate inclining to dryness, and hot in the second degree. Its leaf with vinegar is a poultice for gout, its leaf juice dropped into the ear soothes pain, and its fruit with vinegar helps epilepsy."
  ur: "حور رومی ایک درخت ہے جس کے پھل کو کتاب التروس کہتی ہے۔ کتاب اس کا مزاج دو طرح بیان کرتی ہے: اعتدال کی طرف جھکی ہوئی خشکی، اور دوسرے درجے میں گرمی۔ اس کا پتا سرکے کے ساتھ گٹھیا پر ضماد ہے، پتے کا رس کان میں ٹپکانے سے درد کم ہوتا ہے، اور سرکے کے ساتھ پھل مرگی میں مفید ہے۔"
  es: "El árbol Hawr rumi, cuyo fruto el libro denomina al-turus, describe dos temperamentos: moderado con tendencia a la sequedad y cálido en segundo grado. Sus hojas, mezcladas con vinagre, se utilizan como cataplasma para la gota; el jugo de sus hojas, aplicado en el oído, alivia el dolor; y su fruto, también mezclado con vinagre, ayuda a tratar la epilepsia."
