id: "concept/mabadi-ilaj-al-falij"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ علاج الفالج"
  en: "Principles of the treatment of palsy"
  ur: "فالج کے علاج کے اصول"
  es: "Principios del tratamiento de la parálisis"
summary:
  ar: "يجب أن يكون الفصد في أمراض العصب الخمسة — الخدر والتشنج والرعشة والفالج والاختلاج — قصد مؤخر الدماغ، ولا تعجل باستعمال الأدوية القوية في أول الأمر بل أخر إلى الرابع أو السابع، فإن كانت العلة قوية فإلى الرابع عشر، وفي هذا الوقت اقتصر على أشياء لطيفة مما يلين وينضج ويسهل {cite:canon-ibn-sina-print-v2 p.139} {cite:canon-ibn-sina-print-v2 p.140}"
  en: "In the five nerve diseases — numbness, convulsion, tremor, palsy and twitching — venesection must aim at the back of the brain; do not hurry to strong medicines at first but postpone to the fourth or seventh day, or if the illness is strong to the fourteenth, confining oneself meanwhile to light things that soften, mature and loosen {cite:canon-ibn-sina-print-v2 p.139} {cite:canon-ibn-sina-print-v2 p.140}"
  ur: "اعصاب کی پانچ بیماریوں — خدر، تشنج، رعشہ، فالج اور اختلاج — میں فصد کا قصد دماغ کے پچھلے حصے کی طرف ہونا چاہیے؛ اور آغاز میں مضبوط ادویہ کے استعمال میں جلدی نہ کر بلکہ چوتھے یا ساتویں دن تک مؤخر کر، اور اگر علت قوی ہو تو چودہویں دن تک، اور اس مدت میں ہلکی چیزوں پر اقتصار کر جو نرم، پکا اور رخی کرتی ہوں {cite:canon-ibn-sina-print-v2 p.139} {cite:canon-ibn-sina-print-v2 p.140}۔"
  es: "En las cinco enfermedades nerviosas —entumecimiento, convulsiones, temblores, parálisis y espasmos— la flebotomía debe dirigirse a la parte posterior del cerebro; no se debe recurrir de inmediato a medicamentos fuertes, sino posponerlos hasta el cuarto o séptimo día, o si la enfermedad es grave, hasta el decimocuarto, limitándose mientras tanto a cosas suaves que ablanden, maduren y relajen {cite:canon-ibn-sina-print-v2 p.139} {cite:canon-ibn-sina-print-v2 p.140}"
