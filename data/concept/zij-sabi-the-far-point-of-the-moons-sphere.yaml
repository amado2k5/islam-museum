summary:
  ar: "البُعد الأبعد من الأرض نقطة في الفلك المائل المتماس بفلك البروج، وهي أرفع موضع منه، ويكون عندها أبعد القمر عن الأرض في الترتيب الذي يصفه البتاني، ومنها يُقاس مسير الاختلاف. {cite:zij-sabi-nallino-byblion p.76}."
  en: "The far point from the Earth is a point on the inclined sphere, touching the zodiac's sphere, which is its highest place. In al-Battani's arrangement it is where the Moon is farthest from the Earth, and the inequality is measured from it. {cite:zij-sabi-nallino-byblion p.76}."
