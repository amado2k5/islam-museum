id: concept/al-suda-al-mansub-ila-al-dud-wa-baad-al-nawm
class: concept
kind: scientific
label:
  ar: "الصداع المنسوب إلى الدود والصداع بعد النوم"
  en: "Headache attributed to worms and headache after sleep"
  fr: "Céphalée attribuée aux vers et céphalée après le sommeil"
  ur: "کیڑوں سے منسوب صداع اور نیند کے بعد کا صداع"
  es: "Dolor de cabeza atribuido a parásitos intestinales y dolor de cabeza después de dormir."
  tr: "Solucanlara atfedilen baş ağrıları ve uyku sonrası baş ağrıları"
  id: "Sakit kepala yang disebabkan oleh cacing dan sakit kepala setelah tidur"
summary:
  ar: "ينقل ابن سينا عن الهندي علامة الصداع الذي يُدّعى أنه من الدود وعلاجه بتنقية البدن والدماغ، ويذكر أن صداع ما بعد النوم يُنقّى معه البدن والرأس {cite:canon-ibn-sina-print-v2 pp.52-70}"
  en: "Ibn Sina reports from al-Hindi the sign of the headache claimed to be from worms and its treatment by cleansing the body and the brain, and says that the headache that stirs after sleep is treated by cleansing the body and the head {cite:canon-ibn-sina-print-v2 pp.52-70}"
  fr: "Ibn Sina rapporte, d’après al-Hindi, le signe de la céphalée que l’on attribue aux vers et son traitement par le nettoyage du corps et du cerveau. Il dit aussi que la céphalée qui se déclenche après le sommeil se traite par le nettoyage du corps et de la tête {cite:canon-ibn-sina-print-v2 pp.52-70}"
  ur: "ابن سینا الہندی سے اس صداع کی علامت نقل کرتا ہے جس کے بارے میں دعویٰ ہے کہ وہ کیڑوں سے ہے، اور اس کا علاج بدن اور دماغ کی صفائی سے، اور بتاتا ہے کہ نیند کے بعد بھڑکنے والے صداع میں بدن اور سر کی صفائی کی جاتی ہے {cite:canon-ibn-sina-print-v2 pp.52-70}۔"
  es: "Ibn Sina relata, citando a al-Hindi, que el dolor de cabeza que se atribuía a los gusanos y su tratamiento consistía en la limpieza del cuerpo y la mente, y afirma que el dolor de cabeza que aparece después de dormir se trata limpiando el cuerpo y la cabeza {cite:canon-ibn-sina-print-v2 pp.52-70}."
  tr: "İbn Sina, baş ağrısı belirtisini Al-Hindi'den alıntılar; bunun solucan olduğu iddia edilir ve tedavisi beden ve beynin arındırılmasıdır. Uyku sonrası baş ağrılarının vücudu ve başı arındırdığını belirtir {cite:canon-ibn-sina-print-v2 s.52-70}"
  id: "Ibn Sina mengutip Al-Hindi sebagai gejala sakit kepala; diklaim sebagai cacing dan pengobatannya membersihkan tubuh dan otak. Ia menyatakan bahwa sakit kepala pasca tidur membersihkan tubuh dan kepala {cite:canon-ibn-sina-print-v2 hlm.52-70}"
