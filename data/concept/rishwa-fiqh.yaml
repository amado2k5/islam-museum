id: concept/rishwa-fiqh
class: concept
kind: legal
label:
  ar: "الرشوة"
  en: "Rishwa (bribery): its definition, its ruling for giver and taker, the paying to avert harm, and its effects on judges and rulings"
  ur: "رشوت"
summary:
  ar: "الرشوة في اللغة الجُعل وما يُعطى لقضاء مصلحة، وفي الاصطلاح ما يُعطى لإبطال حق أو لإحقاق باطل، وتفرق عن المصانعة والسحت والهدية والهبة والصدقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} الرشوة حرام على الآخذ والمعطي وهي من الكبائر، ويحرم طلبها وبذلها وقبولها، ويحرم عمل الوسيط، وقد لعن النبي الراشي والمرتشي والرائش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} ويجوز للإنسان عند الجمهور أن يدفع الرشوة لدفع ظلم أو ضرر أو لنيل حق، والإثم على المرتشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} ويحرم على الإمام والعمال والقضاة والمفتين والشهود قبول الهدية أو الرشوة، ولم يُختلف في تحريمها على القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8748} ويحرم تولي القضاء بالرشوة، ويختلف الفقهاء في نفاذ حكم القاضي المرتشي، فجمهورهم يبطله، ويُعزل القاضي بالفسق عند الشافعية والحنابلة والحنفية في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8749} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8750} ولا عقوبة مقدرة في الرشوة، والتعزير هو المقرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8751}"
  en: "Rishwa in the lexicon is a fee or reward paid to secure a purpose; in the jurists' usage it is what is given to void a right or to establish a falsehood, and it is distinct from favours, forbidden gain, gift, alms and presents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} It is forbidden to the one who takes and to the one who gives, is a major sin, and taking, offering and accepting it are all forbidden, as is acting as broker; the Prophet cursed the giver, the taker and the broker. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} The majority hold that a person may pay a bribe to avert wrong or harm or to gain a right, and that the guilt falls on the taker. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} Taking gifts or bribes is forbidden to the ruler, the governors, the judges, the muftis and the witnesses, and the forbidding of it to the judge is agreed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8748} Obtaining the office of judge by bribery is forbidden, and the majority hold the rulings of a judge who took a bribe void, while the Hanafi, Shafi'i and Hanbali schools hold that a judge is removed by such wrongdoing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8749} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8750} No fixed punishment applies, and discretionary punishment is the rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8751}"
  ur: "رشوت وہ مال ہے جو کسی باطل کو ثابت کرنے یا حق کو باطل کرنے کے لیے دیا جائے؛ لینے اور دینے والے دونوں پر حرام ہے، اور جمہور کے نزدیک ظلم سے بچنے کے لیے دینے والا گناہ گار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747}"
