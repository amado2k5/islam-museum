tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "الرشوة"
  en: "Rishwa (bribery): its definition, its ruling for giver and taker, the paying to avert harm, and its effects on judges and rulings"
  ur: "رشوت"
  es: "Rishwa (soborno): su definición, su resultado para el que da y el que recibe, el pago para evitar daños y sus efectos en los jueces y las sentencias."
  fr: "Rishwa (corruption): sa définition, son statut pour celui qui donne et celui qui reçoit, le paiement pour éviter un préjudice et ses effets sur les juges et les décisions."
summary:
  ar: "الرشوة في اللغة الجُعل وما يُعطى لقضاء مصلحة، وفي الاصطلاح ما يُعطى لإبطال حق أو لإحقاق باطل، وتفرق عن المصانعة والسحت والهدية والهبة والصدقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} الرشوة حرام على الآخذ والمعطي وهي من الكبائر، ويحرم طلبها وبذلها وقبولها، ويحرم عمل الوسيط، وقد لعن النبي الراشي والمرتشي والرائش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} ويجوز للإنسان عند الجمهور أن يدفع الرشوة لدفع ظلم أو ضرر أو لنيل حق، والإثم على المرتشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} ويحرم على الإمام والعمال والقضاة والمفتين والشهود قبول الهدية أو الرشوة، ولم يُختلف في تحريمها على القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8748} ويحرم تولي القضاء بالرشوة، ويختلف الفقهاء في نفاذ حكم القاضي المرتشي، فجمهورهم يبطله، ويُعزل القاضي بالفسق عند الشافعية والحنابلة والحنفية في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8749} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8750} ولا عقوبة مقدرة في الرشوة، والتعزير هو المقرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8751}"
  en: "Rishwa in the lexicon is a fee or reward paid to secure a purpose; in the jurists' usage it is what is given to void a right or to establish a falsehood, and it is distinct from favours, forbidden gain, gift, alms and presents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} It is forbidden to the one who takes and to the one who gives, is a major sin, and taking, offering and accepting it are all forbidden, as is acting as broker; the Prophet cursed the giver, the taker and the broker. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} The majority hold that a person may pay a bribe to avert wrong or harm or to gain a right, and that the guilt falls on the taker. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} Taking gifts or bribes is forbidden to the ruler, the governors, the judges, the muftis and the witnesses, and the forbidding of it to the judge is agreed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8748} Obtaining the office of judge by bribery is forbidden, and the majority hold the rulings of a judge who took a bribe void, while the Hanafi, Shafi'i and Hanbali schools hold that a judge is removed by such wrongdoing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8749} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8750} No fixed punishment applies, and discretionary punishment is the rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8751}"
  ur: "رشوت وہ مال ہے جو کسی باطل کو ثابت کرنے یا حق کو باطل کرنے کے لیے دیا جائے؛ لینے اور دینے والے دونوں پر حرام ہے، اور جمہور کے نزدیک ظلم سے بچنے کے لیے دینے والا گناہ گار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747}"
  es: "Rishwa en el léxico es una tarifa o recompensa pagada para asegurar un propósito; en el uso de los juristas es lo que se da para anular un derecho o establecer una falsedad, y es distinto de favores, ganancias prohibidas, regalos, limosnas y presentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} Está prohibido para quien toma y para quien da, es un pecado mayor, y tomar, ofrecer y aceptarlo están todos prohibidos, como actuar como intermediario; el Profeta maldijo al dador, al tomador y al intermediario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} La mayoría sostiene que una persona puede pagar un soborno para evitar un daño o perjuicio o para obtener un derecho, y que la culpa recae sobre quien lo recibe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} Aceptar regalos o sobornos está prohibido para el gobernante, los gobernadores, los jueces, los muftíes y los testigos, y se acepta la prohibición para el juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8748} Obtener el cargo de juez mediante soborno está prohibido, y la mayoría considera nulas las resoluciones de un juez que haya aceptado un soborno, mientras que las escuelas Hanafi, Shafi'i y Hanbali sostienen que un juez es destituido por tal falta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8749} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8750} No se aplica un castigo fijo, y la norma es el castigo discrecional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8751}"
  fr: "Dans le lexique, la rishwa désigne une rémunération ou une récompense versée pour atteindre un objectif. Pour les juristes, il s'agit de ce qui est donné pour annuler un droit ou établir un mensonge, et elle se distingue des faveurs, des gains illicites, des dons, des aumônes et des présents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} Il est interdit à celui qui reçoit et à celui qui donne; c'est un péché majeur. Recevoir, offrir et accepter sont tous interdits, de même que le fait d'agir comme intermédiaire. Le Prophète a maudit le donateur, le preneur et l'intermédiaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8745} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} La majorité considère qu'une personne peut verser un pot-de-vin pour éviter un tort ou un préjudice, ou pour obtenir un droit, et que la culpabilité incombe à celui qui le reçoit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8746} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} Il est interdit au souverain, aux gouverneurs, aux juges, aux muftis et aux témoins d'accepter des cadeaux ou des pots-de-vin; l'interdiction faite au juge d'en accepter fait consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8747} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8748} L'obtention d'une charge de juge par la corruption est interdite, et la majorité considère que les décisions d'un juge ayant accepté un pot-de-vin sont nulles, tandis que les écoles hanafite, shafi'ite et hanbalite estiment qu'un juge est destitué pour un tel acte répréhensible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8749} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8750} Aucune peine fixe n'est prévue; la peine est laissée à l'appréciation du juge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8751}"
