  ur: "سونا اور چاندی"
summary:
  ar: "زيّن للناس حب الشهوات من النساء والبنين والقناطير المقنطرة من الذهب والفضة، وفي الجنة يلبس المتقون أساور من ذهب ويلبسون ثياباً خضراً من سندس وإستبرق، والذين يكنزون الذهب والفضة فبشرهم بعذاب أليم."
  en: "Adorned for people is the love of desires — women, children, heaped-up hoards of gold and silver; in Paradise the righteous wear bracelets of gold and green garments of fine and thick silk; and those who hoard gold and silver, give them tidings of a painful doom."
  ur: "لوگوں کے لیے خواہشوں کی محبت آراستہ ہے — عورتیں، بیٹے، سونے چاندی کے ڈھیر؛ جنت میں نیک لوگ سونے کے کنگن اور باریک و موٹے ریشم کے سبز لباس پہنتے ہیں؛ اور جو سونا چاندی ذخیرہ کرتے ہیں انہیں دردناک عذاب کی بشارت دو۔"
