summary:
  ar: "السنة العربية اثنا عشر شهراً قمرياً، شهور تامة ثلاثون يوماً وناقصة تسعة وعشرون، فتكون ستة تامة وستة ناقصة. وعدد أيامها في الحساب المطلق 354 يوماً، وتزيد في كل ثلاثين سنة أحد عشر يوماً، فتكون سبعاً تامة وخمس ناقصة في السنة الكبيسة {cite:farghani-elements-astronomy p. 131}{cite:farghani-elements-astronomy p. 133}{cite:farghani-elements-astronomy p. 134}{cite:farghani-elements-astronomy p. 130}."
  en: "The Arabic lunar year has twelve months, alternately thirty and twenty-nine days: six full and six hollow. Its absolute count is 354 days, with eleven days added every thirty years, so the year that takes the fraction has seven full months and five hollow {cite:farghani-elements-astronomy p. 131}{cite:farghani-elements-astronomy p. 133}{cite:farghani-elements-astronomy p. 134}{cite:farghani-elements-astronomy p. 130}."
