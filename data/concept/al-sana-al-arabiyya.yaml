id: concept/al-sana-al-arabiyya
class: concept
kind: scientific
label:
  ar: السنة العربية
  en: The Arabic lunar year
  fr: "L’année lunaire arabe"
  ur: السنة العربية
  es: "El año lunar árabe"
  tr: "Arap Yılı"
  id: "Tahun Arab"
summary:
  ur: عربی قمری سال بارہ مہینے کا ہے — چھ تیس روز کے اور چھ انتیس کے؛ شمار 354 دن،
    اور لیپ سال میں گیارہ دن کا اضافہ۔
  ar: السنة العربية اثنا عشر شهراً قمرياً، شهور تامة ثلاثون يوماً وناقصة تسعة وعشرون،
    فتكون ستة تامة وستة ناقصة. وعدد أيامها في الحساب المطلق 354 يوماً، وتزيد في كل
    ثلاثين سنة أحد عشر يوماً، فتكون سبعاً تامة وخمس ناقصة في السنة الكبيسة {cite:farghani-elements-astronomy
    p. 131}{cite:farghani-elements-astronomy p. 133}{cite:farghani-elements-astronomy
    p. 134}{cite:farghani-elements-astronomy p. 130}.
  en: 'The Arabic lunar year has twelve months, alternately thirty and twenty-nine
    days: six full and six hollow. Its absolute count is 354 days, with eleven days
    added every thirty years, so the year that takes the fraction has seven full months
    and five hollow {cite:farghani-elements-astronomy p. 131}{cite:farghani-elements-astronomy
    p. 133}{cite:farghani-elements-astronomy p. 134}{cite:farghani-elements-astronomy
    p. 130}.'
  fr: "L’année lunaire arabe compte douze mois, alternativement de trente et de vingt-neuf jours : six pleins et six creux. Son compte absolu est de 354 jours, onze jours étant ajoutés tous les trente ans, de sorte que l’année qui prend la fraction compte sept mois pleins et cinq creux {cite:farghani-elements-astronomy p. 131}{cite:farghani-elements-astronomy p. 133}{cite:farghani-elements-astronomy p. 134}{cite:farghani-elements-astronomy p. 130}."
  es: "El año lunar árabe tiene doce meses, alternativamente treinta y veintinueve días: seis llenos y seis huecos. Su recuento absoluto es de 354 días, con once días añadidos cada treinta años, por lo que el año que toma la fracción tiene siete meses llenos y cinco huecos {cite:farghani-elements-astronomy p. 131}{cite:farghani-elements-astronomy p. 133}{cite:farghani-elements-astronomy p. 134}{cite:farghani-elements-astronomy p. 130}."
  tr: "Arap yılı on iki ay ayından oluşur; tam aylar otuz gün, eksi yirmi dokuz gün olur; altı tam ve altı eksi ay olur. Mutlak hesaplamada günleri 354 gündür ve her otuz yılda on bir gün artar; böylece artık yılda yedi tam ve artık yılda beş eksi olur {cite:farghani-elements-astronomy s. 131}{cite:farghani-elements-astronomy s. 133}{cite:farghani-elements-astronomy s. 134}{cite:farghani-elements-astronomy s. 130}."
  id: "Tahun Arab terdiri dari dua belas bulan lunar; bulan penuh adalah tiga puluh hari, dikurangi dua puluh sembilan hari; enam bulan purnama dan enam bulan minus. Secara absolut, hari-harinya adalah 354 hari dan meningkat sebelas hari setiap tiga puluh tahun; jadi, terdapat tujuh tahun kabisat penuh dan lima tahun kabisat minus {cite:Farghani-Elements-Astronomy hlm. 131}{cite:Farghani-Elements-Astronomy hlm. 133}{cite:Farghani-Elements-Astronomy hlm. 134}{cite:Farghani-Elements-Astronomy hlm. 130}"
