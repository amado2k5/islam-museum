      ar: "يعرض العقاد النخوة بوصفها تفسيراً لمواقف علي، ويرد على من عابوا عليه التصوف أو السباب، ويعدّ السباب الذي صدر عنه في بعض المواقف «فلتات» لا صناعة {cite:abqariyyat-ali-aqqad p.36}."
      en: "Al-Aqqad uses nakhwa to explain Ali's conduct, answers critics who faulted his mysticism or his insults, and calls the rare insults slips rather than a practice {cite:abqariyyat-ali-aqqad p.36}."
