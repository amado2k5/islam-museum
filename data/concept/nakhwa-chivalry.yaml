id: concept/nakhwa-chivalry
class: concept
kind: ethical
tags: [akhlaq-browser, akhlaq-karam, sport-browser, sport-furusiyya]
label: { ar: "النخوة وآداب الفروسية", en: "Nakhwa: chivalry and the knightly code", es: "Nakhwa: la caballería y el código caballeresco", fr: "Nakhwa: la chevalerie et le code chevaleresque", ur: "نخوا: بہادری اور نائٹلی کوڈ" }
summary:
  ar: "النخوة، في قراءة العقاد لعلي بن أبي طالب، هي «آداب الفروسية» التي تجمع الشجاعة والمروءة وترك البغي والكف عن الغدر والسباب، وهي المفتاح الذي يفسّر به المؤلف أكثر أفعال علي في الحرب والسياسة. ويرى المؤلف أنها طبع أصيل فيه وأدب من آداب أسرته الهاشمية، لا تكلّف فيه {cite:abqariyyat-ali-aqqad p.33}. ومن صورها عنده: ألا يهتبل الفرصة على عدو مكشوف، وألا يقتل مدبراً ولا يجهز على جريح، وأن يُكرم الخصم الضعيف والقوي على السواء {cite:abqariyyat-ali-aqqad p.22}."
  en: "In al-Aqqad's reading of Ali ibn Abi Talib, nakhwa is the knightly code: courage joined with generosity, restraint from wrongdoing and from treachery, and a refusal to insult. The author uses it as the key to much of Ali's conduct in war and policy, and holds that it was innate and also taught in the Hashemite household rather than affected {cite:abqariyyat-ali-aqqad p.33}."
  es: "En la interpretación que hace al-Aqqad de Ali ibn Abi Talib, la nakhwa es el código caballeresco: valentía unida a generosidad, abstención de la maldad y la traición, y rechazo al insulto. El autor la utiliza como clave para comprender gran parte de la conducta de Ali en la guerra y la política, y sostiene que era innata y también se enseñaba en la familia hachemita, en lugar de ser algo fingido {cite:abqariyyat-ali-aqqad p.33}."
  fr: "Selon l'interprétation d'al-Aqqad concernant Ali ibn Abi Talib, la nakhwa représente le code chevaleresque: le courage allié à la générosité, la retenue face au mal et à la trahison, et le refus de l'insulte. L'auteur y voit la clé de voûte de la conduite d'Ali, tant à la guerre qu'en politique, et soutient qu'elle était innée et enseignée au sein de la famille hachémite, plutôt qu'acquise (voir: Abqariyyat Ali Aqqad, p. 33)."
  ur: "العقاد میں علی ابن ابی طالب کی پڑھائی میں، نخوا نائٹ کا ضابطہ ہے: سخاوت کے ساتھ ہمت، غلط کام اور خیانت سے روکنا، اور توہین سے انکار۔ مصنف نے اسے جنگ اور پالیسی میں علی کے زیادہ تر طرز عمل کی کلید کے طور پر استعمال کیا ہے، اور اس کا خیال ہے کہ یہ پیدائشی تھا اور متاثر ہونے کے بجائے ہاشمی گھرانے میں پڑھایا جاتا تھا"
