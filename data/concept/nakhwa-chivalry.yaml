id: concept/nakhwa-chivalry
class: concept
kind: ethical
label: { ar: "النخوة وآداب الفروسية", en: "Nakhwa: chivalry and the knightly code" }
summary:
  ar: "النخوة، في قراءة العقاد لعلي بن أبي طالب، هي «آداب الفروسية» التي تجمع الشجاعة والمروءة وترك البغي والكف عن الغدر والسباب، وهي المفتاح الذي يفسّر به المؤلف أكثر أفعال علي في الحرب والسياسة. ويرى المؤلف أنها طبع أصيل فيه وأدب من آداب أسرته الهاشمية، لا تكلّف فيه {cite:abqariyyat-ali-aqqad p.33}. ومن صورها عنده: ألا يهتبل الفرصة على عدو مكشوف، وألا يقتل مدبراً ولا يجهز على جريح، وأن يُكرم الخصم الضعيف والقوي على السواء {cite:abqariyyat-ali-aqqad p.22}."
  en: "In al-Aqqad's reading of Ali ibn Abi Talib, nakhwa is the knightly code: courage joined with generosity, restraint from wrongdoing and from treachery, and a refusal to insult. The author uses it as the key to much of Ali's conduct in war and policy, and holds that it was innate and also taught in the Hashemite household rather than affected {cite:abqariyyat-ali-aqqad p.33}."
