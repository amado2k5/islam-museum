id: concept/ihtidar
class: concept
kind: legal
label: { ar: "احتضار", en: "The dying person (ihtidar)" }
summary:
  ar: "الاحتضار حضور الموت، والمحتضر من أخذ في سياق الموت، ومن علاماته استرخاء القدمين واعوجاج الأنف وانخساف الصدغين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726} ومن الوصايا المشروعة للمحتضر أن يوصي أهله باتباع السنة في التجهيز والدفن واجتناب البدع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1727} وقد اختلف الفقهاء في قراءة القرآن عند المحتضر: فنقل النووي استحبابها، وكرهها المالكية عند الموت وبعده وعلى القبور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1729}"
  en: "Ihtidar is the presence of death; the dying person is one in the throes of death, whose signs include slackening of the feet, bending of the nose and sinking of the temples. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726} Among the right instructions for the dying is to tell the family to follow the sunna in preparing and burying the body and to avoid innovations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1727} The jurists differ on reciting the Qur'an beside the dying: al-Nawawi recommends it, while the Malikis dislike any recitation at death, after it, or at graves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1729}"
