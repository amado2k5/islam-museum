id: concept/ihtidar
class: concept
kind: legal
tags: [wasaya-browser, wasaya-righteous, wasaya-ihtidar]
label: { ar: "احتضار", en: "The dying person (ihtidar)", es: "La persona moribunda (ihtidar)", fr: "La personne mourante (ihtidar)" }
summary:
  ar: "الاحتضار حضور الموت، والمحتضر من أخذ في سياق الموت، ومن علاماته استرخاء القدمين واعوجاج الأنف وانخساف الصدغين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726} ومن الوصايا المشروعة للمحتضر أن يوصي أهله باتباع السنة في التجهيز والدفن واجتناب البدع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1727} وقد اختلف الفقهاء في قراءة القرآن عند المحتضر: فنقل النووي استحبابها، وكرهها المالكية عند الموت وبعده وعلى القبور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1729}"
  en: "Ihtidar is the presence of death; the dying person is one in the throes of death, whose signs include slackening of the feet, bending of the nose and sinking of the temples. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726} Among the right instructions for the dying is to tell the family to follow the sunna in preparing and burying the body and to avoid innovations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1727} The jurists differ on reciting the Qur'an beside the dying: al-Nawawi recommends it, while the Malikis dislike any recitation at death, after it, or at graves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1729}"
  es: "Ihtidar es la presencia de la muerte; la persona moribunda está en las agonías de la muerte, cuyos signos incluyen el aflojamiento de los pies, la inclinación de la nariz y el hundimiento de las sienes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726} Entre las instrucciones correctas para el moribundo está decir a la familia que siga la sunna en la preparación y el entierro del cuerpo y que evite las innovaciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1727} Los juristas difieren en cuanto a recitar el Corán junto al moribundo: al-Nawawi lo recomienda, mientras que los malikíes desaprueban cualquier recitación en el momento de la muerte, después de ella o en las tumbas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1728} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1729}"
  fr: "L'ihtidar désigne la présence de la mort; le mourant est celui qui agonise, dont les signes incluent le relâchement des jambes, la flexion du nez et l'affaissement des tempes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1726} Parmi les conseils appropriés au mourant, il est recommandé à la famille de suivre la sunna pour la préparation et l'inhumation du corps et d'éviter les innovations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1727} Les juristes divergent quant à la récitation du Coran auprès du mourant: al-Nawawi la recommande, tandis que les malikites désapprouvent toute récitation au moment du décès, après celui-ci ou au cimetière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1729}"
