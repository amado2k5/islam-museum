id: concept/bada
class: concept
kind: doctrine
label:
  ar: "البداء"
  en: "Bada' (change in the divine ruling)"
  ur: "بدا"
summary:
  ar: "مصطلح كلامي لظهور ظروف جديدة تغيّر حكماً إلهياً سابقاً؛ تناقشه كتب اللاهوت الشيعي في باب العلم الإلهي خلافاً للمذهب السني، وتستعمله بمعنى تغيّر المشيئة فرق الغلو (البدائية) {cite:encyclopaedia-of-islam-2 vol. 1 p. 907-908}."
  en: "A theological term for the emergence of new circumstances causing a change in an earlier divine ruling; treated in Shiite theology's chapter on the divine knowledge, against the divergent Sunni doctrine, and taught in its extreme form by the ultra-Shiite Bada'iyya {cite:encyclopaedia-of-islam-2 vol. 1 p. 907-908}."
wings: [ideas]
regions: [persia-central-asia]
sources: [source/encyclopaedia-of-islam-2]
perspectives:
- tradition: sunni
  id: no-change-in-divine-knowledge
  stance:
    ar: "رفض البداء — لا تغيّر في علم الله"
    en: "Rejects bada' — no change in God's knowledge"
  summary:
    ar: "عارض اللاهوت السني البداء إذ يقتضي — في ظنه — أن يجهل الله عواقب الأمور، واتهم أهله السنة بأنهم اختلقوا للشيعة صورة كاذبة من البداء؛ والفرق بين اللاهوتين عند المعتدلين حرب ألفاظ إذ تقرر الشيعة المعتدلة أن البداء المستقبل مقضي في العلم الأزلي {cite:encyclopaedia-of-islam-2 vol. 1 p. 908}."
  evidence:
  - ref: source/encyclopaedia-of-islam-2
    note: {en: "vol. 1 p. 908, orthodox objections and the moderate rejoinder"}
- tradition: shia-twelver
  id: imami-moderate-bada
  stance:
    ar: "البداء مجازاً — مشيئة متعلقة بالمصلحة"
    en: "Bada' metaphorically — will tied to the common good"
  summary:
    ar: "تتناول الإمامية المعتدلة البداء في باب العلم الإلهي بصيغ تحصر أو تنفي تغير العلم: فالله لا يشيّع ما أعلن إلا بقدر ما يقتضيه الصلاح العام، والبداء لا يفهم حرفياً بل مجازاً؛ ومن مصالحاتهم التفريق بين العلم المحتوم والعلم المخصوص ولوحي المحو والإثبات {cite:encyclopaedia-of-islam-2 vol. 1 p. 907-908}."
  evidence:
  - ref: source/encyclopaedia-of-islam-2
    note: {en: "vol. 1 pp. 907-908, Imami formulae and the two-tablets reconciliation"}
- tradition: other
  id: bada-origins-and-ultra-forms
  stance:
    ar: "نشأة الفكرة وصورها الغالية"
    en: "Origins and ultra-Shiite forms"
  summary:
    ar: "تروي كتب الفرق أن فكرة البداء اقترحها المختار ثم صارت من عقيدة الكيسانية بعد هزيمته على يد مصعب بن الزبير؛ وفي صورتها الغالية — تغير مشيئة الله — تعلمها البدائية، مستدلة بقول هشام بن الحكم إن علم الله لا يوجد حتى يوجد معلومه {cite:encyclopaedia-of-islam-2 vol. 1 p. 907}."
  evidence:
  - ref: source/encyclopaedia-of-islam-2
    note: {en: "vol. 1 p. 907, Mukhtar, the Kaysaniyya and the Bada'iyya"}
