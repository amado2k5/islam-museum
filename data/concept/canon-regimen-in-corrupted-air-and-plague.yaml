id: concept/canon-regimen-in-corrupted-air-and-plague
class: concept
kind: scientific
label:
  ar: "التدبير عند فساد الهواء والوباء"
  en: "The regimen in corrupted air and epidemic in the Canon"
  fr: "Régime en air corrompu et en épidémie dans le Canon"
  ur: "ہوا کے بگاڑ اور وبا میں تدبیر قانون میں"
  es: "El régimen en aire corrompido y epidemia en el Canon"
  tr: "Hava kirliliği ve salgınlar sırasında yönetim"
  id: "Manajemen selama polusi udara dan epidemi"
summary:
  ar: "يقرر ابن سينا أن الهواء إذا فسد ووبئ يتلقى بتجفيف البدن وتعديل المسكن بما يبرد ويرطب بقوته، أو بما يسخن ويضاد موجب الفساد، وأن الروائح الطيبة أنفع شيء، وأن يقلل من استنشاق الهواء الكثير، ويفرق بين فساد يأتي من الأرض وفساد يأتي من الهواء نفسه {cite:canon-ibn-sina-print-v1 p.259}."
  en: "Ibn Sina states that when air is corrupted and plague-ridden it is met by drying the body and adjusting the dwelling with things cooling and moistening in power, or heating against the cause of corruption; that pleasant scents help most; that inhalation of much air is reduced; and that corruption from the ground is told apart from corruption from the air itself {cite:canon-ibn-sina-print-v1 p.259}."
  fr: "Face à l’air corrompu et pestilentiel, Ibn Sina décrit dessèchement corporel et aménagement du logement par des agents refroidissants et humidifiants, ou réchauffants opposés à la cause ; il privilégie les parfums, limite l’inhalation de grandes quantités d’air et distingue corruption terrestre et atmosphérique {cite:canon-ibn-sina-print-v1 p.259}."
  es: "Ibn Sina afirma que cuando el aire está corrompido y plagado de enfermedades, se debe tratar secando el cuerpo y acondicionando la vivienda con cosas que enfríen y humedezcan, o calentando contra la causa de la corrupción; que los aromas agradables son de gran ayuda; que se reduce la inhalación de mucho aire; y que la corrupción proveniente del suelo se distingue de la corrupción proveniente del aire mismo {cite:canon-ibn-sina-print-v1 p.259}."
  ur: "ابن سینا کہتا ہے کہ جب ہوا خراب ہو جاتی ہے اور طاعون کا شکار ہو جاتا ہے تو جسم کو خشک کر کے اور مکان کو ٹھنڈا کرنے والی چیزوں کے ساتھ ایڈجسٹ کیا جاتا ہے اور طاقت میں نم ہو جاتا ہے، یا فساد کی وجہ سے گرم ہو جاتا ہے۔ کہ خوشگوار خوشبو سب سے زیادہ مدد کرتی ہے۔ کہ زیادہ ہوا کا سانس لینا کم ہو جاتا ہے۔ اور یہ کہ زمین کی بدعنوانی کو ہوا کی بدعنوانی کے علاوہ بتایا گیا ہے {حوالہ: کینن ابن سینا پرنٹ-v1 صفحہ 259}۔"
  tr: "İbn Sina, hava bozulursa veya veba olursa, bedenin kurutulması ve evin soğutulup nemlendirilerek ya da bozulmanın nedenini ısıtıp karşı koyarak emildiğini belirtir. Hoş kokular en faydalı şeydir ve aşırı hava solumayı azaltır; topraktan gelen bozulma ile havanın kendisinden gelen bozulma arasındaki farkı ayırt eder {cite:canon-ibn-sina-print-v1 s.259}."
  id: "Ibn Sina menyatakan bahwa jika udara menjadi korup atau wabah, maka udara diserap dengan mengeringkan tubuh dan memodifikasi tempat tinggal dengan mendinginkan dan melembapkannya dengan kekuatannya, atau dengan menghangatkan dan mengatasi penyebab pembusukan. Bau yang menyenangkan adalah hal yang paling bermanfaat, dan mengurangi inhalasi udara yang berlebihan, membedakan antara kerusakan yang berasal dari bumi dan kerusakan yang berasal dari udara itu sendiri {cite:canon-ibn-sina-print-v1 hlm.259}."
