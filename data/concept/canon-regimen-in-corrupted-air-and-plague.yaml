id: concept/canon-regimen-in-corrupted-air-and-plague
class: concept
kind: scientific
label: { ar: "التدبير عند فساد الهواء والوباء", en: "The regimen in corrupted air and epidemic in the Canon", ur: "ہوا کے بگاڑ اور وبا میں تدبیر قانون میں" }
summary:
  ar: "يقرر ابن سينا أن الهواء إذا فسد ووبئ يتلقى بتجفيف البدن وتعديل المسكن بما يبرد ويرطب بقوته، أو بما يسخن ويضاد موجب الفساد، وأن الروائح الطيبة أنفع شيء، وأن يقلل من استنشاق الهواء الكثير، ويفرق بين فساد يأتي من الأرض وفساد يأتي من الهواء نفسه {cite:canon-ibn-sina-print-v1 p.259}."
  en: "Ibn Sina states that when air is corrupted and plague-ridden it is met by drying the body and adjusting the dwelling with things cooling and moistening in power, or heating against the cause of corruption; that pleasant scents help most; that inhalation of much air is reduced; and that corruption from the ground is told apart from corruption from the air itself {cite:canon-ibn-sina-print-v1 p.259}."
