label: { ar: "الجنون", en: "Junun (insanity in law)" }
summary:
  ar: "الجنون في الاصطلاح اختلال في العقل يمنع جريان الأفعال والأقوال على وجهها المعتبر. وتبيّن الموسوعة الفقهية الكويتية أثره في العبادات البدنية كالصلاة والصوم، وفي الزكاة، وفي التصرفات القولية كالوصية والوكالة والشركة، وفي الولاية على النكاح والوقف، وفي الجزية والقصاص والحد، وتفرق بينه وبين العته والسفه والصرع. وتذكر أن عمد الصبي والمجنون يُعد خطأ في الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6574}"
  en: "In law, insanity is a disorder of the mind that prevents acts and words from having their proper legal effect. The Kuwaiti encyclopedia sets out its effect on bodily acts of worship (prayer and fasting, including what a madness that begins or ends in the middle of a prayer or of Ramadan does), on zakat, on the validity of gifts, bequests and agency, on guardianship over marriage and waqf, on the jizya, on retaliation and the hadd punishments. It distinguishes madness from mental weakness (ta'ah), from foolishness (sufah) and from epilepsy. It records that the intentional act of a child or a madman counts as accidental for blood-money purposes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6574}"
