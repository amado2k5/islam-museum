label: { ar: "الجنون", en: "Junun (insanity in law)", es: "Junun (locura en la ley)", fr: "Junun (la folie en droit)", ur: "جنون ⁦(قانون میں پاگل پن)⁩", tr: "Delilik", id: "Kegilaan" }
summary:
  ar: "الجنون في الاصطلاح اختلال في العقل يمنع جريان الأفعال والأقوال على وجهها المعتبر. وتبيّن الموسوعة الفقهية الكويتية أثره في العبادات البدنية كالصلاة والصوم، وفي الزكاة، وفي التصرفات القولية كالوصية والوكالة والشركة، وفي الولاية على النكاح والوقف، وفي الجزية والقصاص والحد، وتفرق بينه وبين العته والسفه والصرع. وتذكر أن عمد الصبي والمجنون يُعد خطأ في الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6574}"
  en: "In law, insanity is a disorder of the mind that prevents acts and words from having their proper legal effect. The Kuwaiti encyclopedia sets out its effect on bodily acts of worship (prayer and fasting, including what a madness that begins or ends in the middle of a prayer or of Ramadan does), on zakat, on the validity of gifts, bequests and agency, on guardianship over marriage and waqf, on the jizya, on retaliation and the hadd punishments. It distinguishes madness from mental weakness (ta'ah), from foolishness (sufah) and from epilepsy. It records that the intentional act of a child or a madman counts as accidental for blood-money purposes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6574}"
  es: "En derecho, la locura es un trastorno mental que impide que los actos y las palabras tengan el efecto jurídico correspondiente. La enciclopedia kuwaití describe sus efectos en los actos corporales de culto (oración y ayuno, incluyendo las consecuencias de un episodio de locura que comienza o termina en medio de una oración o del Ramadán), en el zakat, en la validez de las donaciones, los legados y la representación, en la tutela sobre el matrimonio y el waqf, en la jizya, en la represalia y en las penas hadd. Distingue la locura de la debilidad mental (ta'ah), de la insensatez (sufah) y de la epilepsia. Asimismo, establece que el acto intencional de un niño o de una persona con problemas mentales se considera accidental a efectos de la indemnización por homicidio. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6558} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6559} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6561} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6564} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6566} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6574}"
  fr: "En droit, la folie est un trouble mental qui empêche les actes et les paroles de produire leurs effets juridiques. L'encyclopédie koweïtienne expose ses conséquences sur les actes de culte (prière et jeûne, y compris les effets d'une crise de folie survenant au cours d'une prière ou du Ramadan), sur la zakat, sur la validité des donations, des legs et des mandats, sur la tutelle matrimoniale et le waqf, sur la jizya, sur les représailles et les peines du hadd. Elle distingue la folie de la faiblesse mentale (ta'ah), de la sottise (sufah) et de l'épilepsie. Elle précise que l'acte intentionnel d'un enfant ou d'un aliéné est considéré comme accidentel pour le calcul du prix du sang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6574}"
  ur: "قانون میں، پاگل پن دماغ کی ایک خرابی ہے جو اعمال اور الفاظ کو ان کے مناسب قانونی اثر سے روکتی ہے۔ کویتی انسائیکلوپیڈیا اس کا اثر جسمانی عبادات ⁦(نماز اور روزہ، بشمول نماز یا رمضان کے وسط میں شروع ہونے یا ختم ہونے والا دیوانگی)⁩، زکوٰۃ، تحائف، وصیت اور ایجنسی کے جائز ہونے، شادی اور وقف کی سرپرستی، جزیہ اور سزاؤں پر بیان کرتا ہے۔ یہ جنون کو ذہنی کمزوری ⁦(طہ)⁩ سے، حماقت ⁦(سفاح)⁩ سے اور مرگی سے ممتاز کرتا ہے۔ یہ ریکارڈ کرتا ہے کہ کسی بچے یا دیوانے کے جان بوجھ کر کیے گئے عمل کو خون کے پیسے کے مقاصد کے لیے حادثاتی شمار کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6558} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6559} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6561} صفحہ 6564} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6566} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6574}"
  tr: "Delilik, terminolojide, eylemlerin ve sözlerin doğru biçimde ilerlemesini engelleyen bir zihin bozukluğudur. Kuveyt Fıkıh Ansiklopedisi, dua ve oruç, zekat, vasiyetname, vekaletname, ortaklık, evlilik ve vakıflar üzerinde vasilik, cizye, kısa ve hudud gibi fiziksel ibadet eylemleri üzerindeki etkisini açıklar; bunları demans, aptallık ve epilepsiden ayırır. Ayrıca, bir çocuğun veya akıl hastasının kasıtlı eylemlerinin kan parasında hata olarak kabul edildiğini belirtir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6574}"
  id: "Kegilaan, dalam istilah tertentu, adalah gangguan pikiran yang mencegah tindakan dan kata-kata berjalan dalam bentuk yang semestinya. Ensiklopedia Yurisprudensi Kuwait menjelaskan pengaruhnya terhadap tindakan ibadah fisik seperti doa dan puasa, zakat, tindakan verbal seperti wasiat, agensi pengacara, kemitraan, wali atas pernikahan dan wakaf, jizya, qisas, dan hudud, membedakan antara mereka dengan demensia, kebodohan, dan epilepsi. Juga disebutkan bahwa tindakan sengaja anak atau orang gila dianggap sebagai kesalahan dalam uang darah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6564} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6574}"
