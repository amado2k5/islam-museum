summary:
  ar: "المنبرية مسألة من مسائل العول في المواريث، لقبت بذلك لأن علي بن أبي طالب أجاب عنها وهو على المنبر في خطبته. وصورتها زوجة وبنتان وأبوان، فتعول المسألة من أربعة وعشرين إلى سبعة وعشرين، فيصير للزوجة تسع التركة."
  en: "Al-Minbariyya is one of the 'awl (increase) problems in inheritance, so named because Ali answered it from the pulpit during a sermon. The case is a wife, two daughters and two parents: the sum rises from twenty-four to twenty-seven, so the wife's share becomes a ninth of the estate."
  ur: "منبریہ وراثت کے عول کے مسائل میں سے ایک ہے، جس کا جواب علی بن ابی طالب نے منبر پر خطبہ دیتے ہوئے دیا۔ اس میں بیوی، دو بیٹیاں اور دو والدین ہیں، اور مسئلہ چوبیس سے ستائیس ہو جاتا ہے۔"
