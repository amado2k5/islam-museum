label: { ar: "الحارصة", en: "Harisa (a superficial wound)", ur: "حارصہ", es: "Harisa (una herida superficial)", fr: "Harisa (une plaie superficielle)", tr: "Al-Harissa", id: "Al-Harissa" }
summary:
  ar: "الحارصة شجة تخدش الجلد وتشقه قليلا ولا تدميه، وتسمى الخادشة والقاشرة. ذهب الشافعية والحنابلة وهو رواية عند الحنفية إلى أنه لا قصاص فيها وإنما تجب حكومة عدل، وقال المالكية وظاهر المذهب عند الحنفية بوجوب القصاص فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6723}"
  en: "Harisa is a superficial head wound that scratches and slightly splits the skin without drawing blood; it is also called the scratching or peeling wound. The Shafiis and Hanbalis, and one Hanafi view, hold that there is no retaliation for it and that only a just assessment (hukuma adl) is due; the Malikis and the apparent Hanafi view require retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6724}"
  ur: "حارصہ سر یا چہرے کا وہ زخم ہے جو جلد کو کھرچتا ہے اور تھوڑا سا شق کرتا ہے مگر خون نہیں بہاتا۔ شافعیہ اور حنابلہ کے نزدیک اس میں قصاص نہیں، صرف حکومت عدل واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6722}"
  es: "Harisa es una herida superficial en la cabeza que raspa y desgarra ligeramente la piel sin causar sangrado; también se la conoce como herida por raspadura o descamación. Los shafiíes y los hanbalíes, así como una postura hanafí, sostienen que no hay represalia por ella y que solo se debe una justa evaluación (hukuma adl); los malikíes y la postura hanafí aparente exigen represalia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6724}"
  fr: "La harisa est une blessure superficielle à la tête qui érafle et fend légèrement la peau sans faire couler le sang; on l’appelle aussi plaie par égratignure ou écorchure. Les écoles chaféite et hanbalite, ainsi qu’une certaine opinion hanafite, estiment qu’il n’y a pas lieu de représailles et qu’une juste appréciation (hukuma adl) est de mise; l’école malikite et l’opinion hanafite apparente exigent des représailles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6724}"
  tr: "El-Harisa, deriyi kaşıyan ve kanamadan hafifçe yırtan bir kıvılcımdır ve buna 'el-khadasha' veya 'al-kaşra' denir. Şafi'ler ve Hanbaliler, Hanefilere göre bir rivayet olarak, bunun intikam olmadığını, adil bir hükümetin zorunlu olduğunu savunur. Maliki okulu ve Hanafilerin görünürdeki görüşü, bu durumda intikamın zorunlu olduğunu savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6723}"
  id: "Al-Harisa adalah percikan yang menggores kulit dan merobeknya sedikit tanpa berdarah, dan disebut 'al-khadasha' atau 'al-qashra'. Syafi'i dan Hanbali, yang merupakan narasi menurut Hanafi, berpendapat bahwa tidak ada pembalasan di dalamnya melainkan pemerintahan yang adil adalah kewajiban. Mazhab Maliki dan pandangan yang tampak dari Hanafi menyatakan bahwa pembalasan adalah wajib dalam kasus ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6723}"
