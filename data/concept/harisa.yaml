label: { ar: "الحارصة", en: "Harisa (a superficial wound)", ur: "حارصہ" }
summary:
  ar: "الحارصة شجة تخدش الجلد وتشقه قليلا ولا تدميه، وتسمى الخادشة والقاشرة. ذهب الشافعية والحنابلة وهو رواية عند الحنفية إلى أنه لا قصاص فيها وإنما تجب حكومة عدل، وقال المالكية وظاهر المذهب عند الحنفية بوجوب القصاص فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6723}"
  en: "Harisa is a superficial head wound that scratches and slightly splits the skin without drawing blood; it is also called the scratching or peeling wound. The Shafiis and Hanbalis, and one Hanafi view, hold that there is no retaliation for it and that only a just assessment (hukuma adl) is due; the Malikis and the apparent Hanafi view require retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6724}"
  ur: "حارصہ سر یا چہرے کا وہ زخم ہے جو جلد کو کھرچتا ہے اور تھوڑا سا شق کرتا ہے مگر خون نہیں بہاتا۔ شافعیہ اور حنابلہ کے نزدیک اس میں قصاص نہیں، صرف حکومت عدل واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6722}"
