id: concept/khafara-fiqh
class: concept
kind: term
label:
  ar: الخفارة
  en: Khafara (guarding, safe-conduct, escort fee)
  ur: خفارہ
  es: "Khafara (custodia, salvoconducto, tarifa de escolta)"
  fr: "Khafara (frais de garde, de sauf-conduit, d'escorte)"
  tr: "Muhafız"
  id: "Penjaga"
summary:
  ar: 'الخفارة لغة الحراسة والحماية والأمان والذمة، والخفير الحارس، والخفارة أيضا جعل الخفير؛ وتعرف عند الفقهاء بالبذرقة وهي الجماعة التي تتقدم القافلة للحراسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} الحكم: الحراسة قد تكون واجبة كحراسة طائفة للأخرى في صلاة الخوف، وقد تكون مستحبة كالمرابطة في الثغور، وقد تكون جائزة كالحراسة في عمل مباح؛ وعقد الأمان جائز إذا كان في مصلحة المسلمين، ويجب إعطاء الأمان لمن طلب سماع كلام الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} الخفارة في الحج: أمن الطريق من شروط الاستطاعة؛ فإن احتاج الحجاج إلى خفير بأجر، فالحنفية والمالكية وقول للحنابلة يرون أن الخفارة اليسيرة التي لا تجحف مع الأمن من الغدر لا تسقط الحج، والشافعية وجمهور الحنابلة يرون أنها رشوة لا يلزم بذلها؛ وأجرة الخفير على الحج بأجرة المثل لازمة عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} تضمين الخفراء: جمهور الفقهاء على عدم تضمين الخفير لأنه أمين إلا أن يتعدى أو يفرط، ولا عبرة بما يشترط على الخفراء في الحارات والأسواق من الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} الخفارة بمعنى الذمة والعهد والأمان قد تكون بين الله وعباده: فالمسلم في خفارة الله أي أمانه ما دام مطيعا، فإذا عصى فقد غدر؛ وأخذ ابن حجر من حديث «من صلى صلاتنا» أن تارك الصلاة يقتل عند من قال بذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} ومن الذمة ما في الصبح، وقد نهى القاضي عياض أن يتعرض أحد لمن صلى الصبح بما يوجب المطالبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} الخفارة بمعنى الأمان بين الناس: ذمة المسلمين واحدة يسعى بها أدناهم، ومن أخفر مسلما فعليه لعنة الله؛ وإذا أعطي الأمان لأهل الحرب حرم قتلهم وأخذ أموالهم، ومن طلب الأمان ليسمع كلام الله ويعرف شرائع الإسلام أعطي وردّ إلى مأمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743}'
  en: 'Khafara is lexically guard, protection and safe-conduct, the guard is a khafir, and khafara also means the guard\''s fee; the jurists also call it the escort, a group that goes before a caravan to guard it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} Ruling: guarding may be a duty, as a body guarding another during the prayer of fear, a recommended watch on the frontiers, or lawful when hired for a lawful work; safe-conduct is lawful where it serves the Muslims and must be granted to one asking to hear God\''s word. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} In the Hajj: security of the road is a condition of ability; if pilgrims must hire a guard, the Hanafis, Malikis and one Hanbali view hold that a small fee that does not ruin them, given with assurance against betrayal, does not excuse the Hajj; the Shafiis and most Hanbalis treat it as a bribe that need not be paid; for the Shafiis a guard hired at the going rate is a duty of the pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} On guards\'' liability: most jurists do not hold guards liable, as they are trustees unless they transgress or neglect; any stipulation making guards liable in markets is disregarded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} Khafara as a covenant between God and His servants: a Muslim is under God\''s protection while obedient, and one who disobeys has broken faith; Ibn Hajar draws from the report on praying in our prayer that the one who abandons prayer may be killed in the view of some. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} The dawn prayer is under God\''s protection; al-Qadi Iyad says one must not molest the one who prays dawn with a claim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} Khafara as the safe-conduct among people: the protection of Muslims is one, and the least of them may grant it; whoever betrays a Muslim\''s protection is cursed; when protection is given to enemies, killing or taking their goods is forbidden, and one who asks it to hear God\''s word is granted it and returned to his place of safety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743}'
  ur: 'خفارہ لغت میں حفاظت، پناہ اور امان ہے، خفیر محافظ کو کہتے ہیں، اور خفارہ محافظ کی اجرت کو بھی کہا جاتا ہے؛ فقہاء اسے بذرقہ کہتے ہیں یعنی وہ جماعت جو قافلے سے آگے جا کر اس کی حفاظت کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} حکم: حفاظت کبھی واجب ہے، جیسے نماز خوف میں ایک گروہ کا دوسرے کی حفاظت کرنا، کبھی مستحب، جیسے سرحدوں پر پہرہ؛ کبھی جائز، جیسے مباح کام کے لیے اجرت پر حفاظت؛ امان کا معاہدہ مسلمانوں کی مصلحت میں جائز ہے، اور کلام الٰہی سننے کی درخواست کرنے والے کو امان دینا واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} حج میں: راستے کا امن استطاعت کی شرط ہے؛ اگر حاجیوں کو اجرت پر محافظ لینا پڑے تو حنفیہ، مالکیہ اور حنابلہ کے ایک قول کے مطابق جو تھوڑا ہو اور جس سے امن ہو، وہ حج کو ساقط نہیں کرتا؛ شافعیہ اور جمہور حنابلہ اسے رشوت سمجھتے ہیں جس کی ادائیگی لازم نہیں؛ شافعیہ کے نزدیک مثلی اجرت پر محافظ حج کا حصہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} محافظوں کا ضمان: جمہور کے نزدیک محافظ امین ہے، جب تک زیادتی یا کوتاہی نہ کرے؛ محلوں اور بازاروں میں محافظوں پر لگائی گئی ضمان کی شرط معتبر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} خفارہ بمعنی ذمہ، عہد اور امان اللہ اور اس کے بندوں کے درمیان بھی ہوتی ہے: مسلمان اللہ کی پناہ میں ہے جب تک اطاعت کرے، نافرمانی پر وہ عہد توڑ دیتا ہے؛ ابن حجر نے ہماری نماز پڑھنے والی حدیث سے سمجھا کہ نماز چھوڑنے والے کو قتل کیا جا سکتا ہے، بعض کے نزدیک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} صبح کی نماز پڑھنے والا اللہ کی پناہ میں ہے، قاضی عیاض کے نزدیک اس کے لیے مطالبہ کا سبب نہ بنا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} لوگوں کے درمیان امان کے معنی میں خفارہ: مسلمانوں کا ذمہ ایک ہے جس کی ضمانت ادنیٰ مسلمان بھی دے سکتا ہے، جو مسلمان کا عہد توڑے اس پر لعنت ہے؛ حربی کو امان دی جائے تو اس کا قتل اور مال لینا حرام ہے، اور کلامِ الٰہی سننے کی درخواست کرنے والے کو امان دے کر اس کی جائے امن تک پہنچایا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743}'
  es: "Khafara es léxicamente guardia, protección y salvoconducto, el guardia es un khafir, y khafara también significa la tarifa del guardia; los juristas también lo llaman escolta, un grupo que va delante de una caravana para protegerla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} Dictamen: la guardia puede ser un deber, como un cuerpo que protege a otro durante la oración del temor, una vigilancia recomendada en las fronteras, o lícita cuando se contrata para un trabajo lícito; el salvoconducto es lícito cuando sirve a los musulmanes y debe otorgarse a quien pide escuchar la palabra de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} En el Hajj: la seguridad del camino es una condición de capacidad; Si los peregrinos deben contratar un guardia, los Hanafis, Malikis y una visión Hanbali sostienen que una pequeña tarifa que no los arruine, dada con garantía contra la traición, no exime del Hajj; los Shafiis y la mayoría de los Hanbalis lo consideran un soborno que no es necesario pagar; para los Shafiis, un guardia contratado al precio vigente es un deber de la peregrinación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} Sobre la responsabilidad de los guardias: la mayoría de los juristas no consideran responsables a los guardias, ya que son fideicomisarios a menos que transgredan o descuiden; cualquier estipulación que haga responsables a los guardias en los mercados se ignora. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} Khafara como un pacto entre Dios y Sus siervos: un musulmán está bajo la protección de Dios mientras obedece, y quien desobedece ha roto la fe; Ibn Hajar extrae del informe sobre la oración en nuestra oración que quien abandona la oración puede ser asesinado en el punto de vista de algunos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} La oración del amanecer está bajo la protección de Dios; al-Qadi Iyad dice que uno no debe molestar a quien reza el amanecer con una reclamación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} Khafara como el salvoconducto entre la gente: la protección de los musulmanes es una, y el más pequeño de ellos puede otorgarla; quien traiciona la protección de un musulmán es maldito; Cuando se brinda protección a los enemigos, está prohibido matarlos o apoderarse de sus bienes, y a quien la pide para escuchar la palabra de Dios se le concede y regresa a su lugar seguro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743}"
  fr: "Le terme « khafara » signifie littéralement garde, protection et sauf-conduit. Le garde est un « khafir » (mécréant), et « khafara » désigne également sa rémunération. Les juristes l'appellent aussi escorte, un groupe qui précède une caravane pour la protéger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} Décision: la garde peut être un devoir, comme celui de protéger une autre personne pendant la prière de crainte, une surveillance recommandée aux frontières, ou licite lorsqu'on est engagé pour un travail licite; le sauf-conduit est licite lorsqu'il sert les musulmans et doit être accordé à celui qui demande à entendre la parole de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} Lors du Hajj: la sécurité de la route est une condition de capacité. Si les pèlerins doivent engager un garde, les écoles hanafite, malikite et une certaine école hanbalite estiment qu'une somme modique, non exonérante de toute responsabilité et assortie de garanties contre la trahison, ne les dispense pas du Hajj. Les écoles chaféite et la plupart des écoles hanbalites considèrent cela comme un pot-de-vin non exigible; pour les chaféites, engager un garde au tarif habituel est une obligation du pèlerinage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} Concernant la responsabilité des gardes: la plupart des juristes ne les tiennent pas responsables, car ils sont des dépositaires, sauf en cas de faute ou de négligence de leur part; toute stipulation les rendant responsables sur les marchés est ignorée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} La Khafara comme pacte entre Dieu et Ses serviteurs: le musulman est sous la protection divine tant qu’il obéit, et celui qui désobéit a rompu sa foi. Ibn Hajar s’appuie sur le hadith relatif à la prière pour affirmer que, selon certains, celui qui abandonne la prière peut être mis à mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} La prière de l’aube est sous la protection divine; al-Qadi Iyad dit qu’il ne faut pas importuner celui qui prie à l’aube en formulant une revendication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742} La Khafara comme sauf-conduit: la protection des musulmans est unique, et le plus humble d’entre eux peut l’accorder; quiconque trahit la protection d’un musulman est maudit. Lorsqu'on accorde sa protection à des ennemis, il est interdit de les tuer ou de s'emparer de leurs biens; celui qui la demande pour entendre la parole de Dieu l'obtient et retourne en lieu sûr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7742}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7743}"
  tr: "'khafara' kelimesi koruma, koruma, güvenlik ve güven anlamına gelirken, 'muhafız muhafızdır' ve 'khafara' da 'muhafız' anlamına gelir. Hukukçular arasında 'bazrqa' olarak bilinir ve kervanı nöbet tutmaya götüren grubu ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7740} Hüküm: Koruma, korku namazında bir grubu diğerine korumak olarak zorunlu olabilir, ön saflarda nöbet tutmak gibi önerilebilir veya izin verilen bir eylemde nöbet tutmak gibi kabul edilebilir. Güvenlik sözleşmesi, Müslümanların çıkarına ise mümkündür ve Allah'ın sözlerini duymak isteyenlere güvenlik sağlanmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7740} Hac nöbetçisi: Yolun güvenliği yeteneğin bir koşuludur; eğer hacı ücret karşılığında bekçi isterse, Hanefiler, Malikiler ve Hanbalılar, hainliğin güvenliğine zarar vermeyen küçük bir muhafızın Hacı geçersiz kılmaz. Şafiiler ve çoğu Hanbalılar bunu ödenmeyen bir rüşvet olarak görür; ve hac için muhafızın adil ücretle alması Şafiilere göre zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7741} Muhafızların dahil edilmesi: Çoğu hukukçu, muhafızı güvenilir olduğu için dahil etmez; ancak o konuyu ihmal etmezse veya ihmal etmezse ve mahallelerde ve pazarlarda bekçi sorumluluğu gerekliliğiyle ilgili değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7741} Muhafız, Allah ile kulları arasında var olabilecek güven, antlaşma ve güvenlik anlamına gelir: Allah'ı koruyan bir Müslüman, itaatkar olduğu sürece güvenilir demektir. İtaatsizlik ederse, ihanet etmiş olur; İbn Hajar, 'Namazımızı kim kılarsa' hadisinden çıkarmıştır ki, namazı terk eden bunu söyleyenler tarafından öldürülür. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s. 7742} Sabah namazında yükümlülük olarak kabul edilen şey borçtur; Hakim İyad, şafak namazını kınan birine talep gerektiren şekilde zarar vermeyi yasaklamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7742} Al-Khafarah, insanlar arasında güvenlik anlamına gelir: Müslümanların korunması en az isteyenlerin yaptığı şeydir ve bir Müslümanı savunan Allah tarafından lanetlenir; savaş halkına güvenlik sağlanırsa, onları öldürmek ve paralarını almak yasaktır. Allah'ın sözlerini duymak ve İslam kanunlarını bilmek için güvenlik arayan kişi verilir ve güvenli yerine geri döndürülür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7743}"
  id: "Kata 'khafara' berarti penjagaan, perlindungan, keselamatan, dan kepercayaan, sedangkan 'penjaga adalah penjaga,' dan 'khafara' juga berarti 'penjaga.' Kata ini dikenal di kalangan ahli hukum sebagai 'bazrqa,' merujuk pada kelompok yang memimpin karavan untuk berjaga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7740} Keputusan: Menjaga dapat menjadi kewajiban seperti menjaga satu kelompok untuk kelompok lain dalam shalat ketakutan, atau dapat direkomendasikan seperti menjaga di garis depan, atau diperbolehkan seperti menjaga dalam tindakan yang diperbolehkan. Kontrak keselamatan diperbolehkan jika demi kepentingan umat Islam, dan keamanan harus diberikan kepada mereka yang ingin mendengar firman Allah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7740} Penjaga dalam Haji: Keselamatan jalan adalah syarat kemampuan; jika jamaah membutuhkan pengawal sebagai bayaran, Hanafi, Maliki, dan Hanbalis berpendapat bahwa pengawal kecil yang tidak merugikan keselamatan pengkhianatan tidak membatalkan Haji. Para Shafi'i dan mayoritas Hanbal menganggapnya sebagai suap yang tidak memerlukan pembayaran; dan biaya pengawal untuk Haji dengan upah yang adil wajib menurut para Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7741} Inklusi penjaga: Mayoritas ahli hukum tidak memasukkan penjaga karena ia dapat dipercaya kecuali ia melanggar atau mengabaikan masalah, dan tidak relevan dengan persyaratan tanggung jawab penjaga di lingkungan dan pasar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7741} Penjaga berarti kepercayaan, perjanjian, dan keamanan yang mungkin ada antara Allah dan hamba-Nya: seorang Muslim dalam menjaga Allah berarti dapat dipercaya selama ia taat. Jika ia membangkang, ia telah mengkhianati; Ibn Hajar mengambil dari hadits 'Siapa pun yang berdoa kita' bahwa orang yang meninggalkan shalat akan dibunuh oleh mereka yang berkata demikian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7742} Dan apa yang dianggap sebagai beban dalam shalat pagi adalah utang, dan Hakim Iyad melarang siapa pun menyakiti seseorang yang shalat fajar dengan cara yang memerlukan tuntutan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7742} Al-Khafarah berarti keselamatan di antara manusia: Perlindungan Muslim adalah sesuatu yang paling sedikit ingin lakukan, dan siapa pun yang membela Muslim akan dikutuk oleh Tuhan; dan jika keselamatan diberikan kepada rakyat perang, dilarang membunuh mereka dan mengambil uang mereka. Siapa pun yang mencari keselamatan untuk mendengar firman Tuhan dan mengetahui hukum Islam akan diberikan dan dikembalikan ke tempat amannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7743}"
