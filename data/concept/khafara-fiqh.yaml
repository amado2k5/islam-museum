id: concept/khafara-fiqh
class: concept
kind: term
label:
  ar: الخفارة
  en: Khafara (guarding, safe-conduct, escort fee)
  ur: خفارہ
summary:
  ar: 'الخفارة لغة الحراسة والحماية والأمان والذمة، والخفير الحارس، والخفارة أيضا جعل الخفير؛ وتعرف عند الفقهاء بالبذرقة وهي الجماعة التي تتقدم القافلة للحراسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} الحكم: الحراسة قد تكون واجبة كحراسة طائفة للأخرى في صلاة الخوف، وقد تكون مستحبة كالمرابطة في الثغور، وقد تكون جائزة كالحراسة في عمل مباح؛ وعقد الأمان جائز إذا كان في مصلحة المسلمين، ويجب إعطاء الأمان لمن طلب سماع كلام الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} الخفارة في الحج: أمن الطريق من شروط الاستطاعة؛ فإن احتاج الحجاج إلى خفير بأجر، فالحنفية والمالكية وقول للحنابلة يرون أن الخفارة اليسيرة التي لا تجحف مع الأمن من الغدر لا تسقط الحج، والشافعية وجمهور الحنابلة يرون أنها رشوة لا يلزم بذلها؛ وأجرة الخفير على الحج بأجرة المثل لازمة عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} تضمين الخفراء: جمهور الفقهاء على عدم تضمين الخفير لأنه أمين إلا أن يتعدى أو يفرط، ولا عبرة بما يشترط على الخفراء في الحارات والأسواق من الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741}'
  en: 'Khafara is lexically guard, protection and safe-conduct, the guard is a khafir, and khafara also means the guard\''s fee; the jurists also call it the escort, a group that goes before a caravan to guard it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} Ruling: guarding may be a duty, as a body guarding another during the prayer of fear, a recommended watch on the frontiers, or lawful when hired for a lawful work; safe-conduct is lawful where it serves the Muslims and must be granted to one asking to hear God\''s word. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} In the Hajj: security of the road is a condition of ability; if pilgrims must hire a guard, the Hanafis, Malikis and one Hanbali view hold that a small fee that does not ruin them, given with assurance against betrayal, does not excuse the Hajj; the Shafiis and most Hanbalis treat it as a bribe that need not be paid; for the Shafiis a guard hired at the going rate is a duty of the pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} On guards\'' liability: most jurists do not hold guards liable, as they are trustees unless they transgress or neglect; any stipulation making guards liable in markets is disregarded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741}'
  ur: 'خفارہ لغت میں حفاظت، پناہ اور امان ہے، خفیر محافظ کو کہتے ہیں، اور خفارہ محافظ کی اجرت کو بھی کہا جاتا ہے؛ فقہاء اسے بذرقہ کہتے ہیں یعنی وہ جماعت جو قافلے سے آگے جا کر اس کی حفاظت کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} حکم: حفاظت کبھی واجب ہے، جیسے نماز خوف میں ایک گروہ کا دوسرے کی حفاظت کرنا، کبھی مستحب، جیسے سرحدوں پر پہرہ؛ کبھی جائز، جیسے مباح کام کے لیے اجرت پر حفاظت؛ امان کا معاہدہ مسلمانوں کی مصلحت میں جائز ہے، اور کلام الٰہی سننے کی درخواست کرنے والے کو امان دینا واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740} حج میں: راستے کا امن استطاعت کی شرط ہے؛ اگر حاجیوں کو اجرت پر محافظ لینا پڑے تو حنفیہ، مالکیہ اور حنابلہ کے ایک قول کے مطابق جو تھوڑا ہو اور جس سے امن ہو، وہ حج کو ساقط نہیں کرتا؛ شافعیہ اور جمہور حنابلہ اسے رشوت سمجھتے ہیں جس کی ادائیگی لازم نہیں؛ شافعیہ کے نزدیک مثلی اجرت پر محافظ حج کا حصہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741} محافظوں کا ضمان: جمہور کے نزدیک محافظ امین ہے، جب تک زیادتی یا کوتاہی نہ کرے؛ محلوں اور بازاروں میں محافظوں پر لگائی گئی ضمان کی شرط معتبر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7741}'
