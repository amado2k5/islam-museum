id: concept/ilgha
class: concept
kind: legal
label: { ar: "الإلغاء", en: "Ilgha' (annulment or cancellation, and the principle of removing a difference)" }
summary:
  ar: "الإلغاء في اللغة الإبطال، وعند الفقهاء إسقاط الحكم أو إبطاله بعد وجود الشيء أو فعله، ويأتي بمعنى الفسخ والإسقاط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324} وتلغى التصرفات التي لا يقرها الشارع، وتلغى شروط مخالفة للنص، وتصح شروط توثيق للعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325} ويطلق الأصوليون الإلغاء في إلغاء الفارق بين الأصل والفرع في القياس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}"
  en: "Ilgha' means annulment in the lexical sense. For the jurists it is the removal of a ruling after the thing or its act has occurred, and it is close to faskh (rescission) and isqat (waiver). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324} Transactions the Law does not allow are void, and conditions that contradict a text are void while the contract stands; conditions that secure a contract are valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325} The usulis use ilgha' also for removing the difference between root and branch in analogy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}"
