id: concept/ilgha
class: concept
kind: legal
label: { ar: "الإلغاء", en: "Ilgha' (annulment or cancellation, and the principle of removing a difference)", es: "Ilgha' (anulación o cancelación, y el principio de eliminar una diferencia)", fr: "Ilgha' (annulation ou suppression, et le principe de suppression d'une différence)", ur: "الغہ ⁦(تنسیخ یا منسوخی، اور فرق کو دور کرنے کا اصول)⁩" }
summary:
  ar: "الإلغاء في اللغة الإبطال، وعند الفقهاء إسقاط الحكم أو إبطاله بعد وجود الشيء أو فعله، ويأتي بمعنى الفسخ والإسقاط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324} وتلغى التصرفات التي لا يقرها الشارع، وتلغى شروط مخالفة للنص، وتصح شروط توثيق للعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325} ويطلق الأصوليون الإلغاء في إلغاء الفارق بين الأصل والفرع في القياس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}"
  en: "Ilgha' means annulment in the lexical sense. For the jurists it is the removal of a ruling after the thing or its act has occurred, and it is close to faskh (rescission) and isqat (waiver). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324} Transactions the Law does not allow are void, and conditions that contradict a text are void while the contract stands; conditions that secure a contract are valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325} The usulis use ilgha' also for removing the difference between root and branch in analogy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}"
  es: "Ilgha' significa anulación en el sentido léxico. Para los juristas es la eliminación de una resolución después de que la cosa o su acto haya ocurrido, y es cercano a faskh (rescisión) e isqat (renuncia). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324} Las transacciones que la Ley no permite son nulas, y las condiciones que contradicen un texto son nulas mientras el contrato esté vigente; las condiciones que garantizan un contrato son válidas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325} Los usulis usan ilgha' también para eliminar la diferencia entre raíz y rama en analogía. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}"
  fr: "Le terme « ilgha' » signifie annulation au sens littéral. Pour les juristes, il s'agit de la suppression d'une règle après que la chose ou l'acte se soit produit, et il est proche de « faskh » (résiliation) et d'« isqat » (renonciation). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324} Les transactions non autorisées par la Loi sont nulles, et les conditions qui contredisent un texte sont nulles tant que le contrat est en vigueur; les conditions qui garantissent un contrat sont valides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325} Les usulis utilisent également « ilgha' » pour supprimer, par analogie, la différence entre la racine et la branche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3325}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3326}"
  ur: "لغوی معنوں میں الغا کا مطلب منسوخی ہے۔ فقہاء کے نزدیک کسی چیز یا اس کے فعل کے واقع ہونے کے بعد حکم کا ہٹانا ہے اور یہ فاسخ اور استثنیٰ کے قریب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3323}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3324} جن لین دین کی قانون اجازت نہیں دیتا وہ باطل ہیں، اور ایسی شرائط جو کسی متن سے متصادم ہوں باطل ہیں جبکہ معاہدہ قائم ہے؛ وہ شرائط جو معاہدہ کو محفوظ رکھتی ہیں درست ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3324}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.3325} اصول قیاس میں جڑ اور شاخ کے فرق کو دور کرنے کے لیے بھی الغا کا استعمال کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3325}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3326}"
