summary:
  ar: "أحد الأقلام الستة الموزونة، صورة أصغر من المحقق وقرينه الدقيق، فضّل للوثائق الديوانية والخواتيم وزخرفة الأغلفة والصفحات المزخرفة {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  en: "One of the six proportional pens, a smaller variant and partner of muhaqqaq, preferred for chancery documents, colophons, book covers and carpet pages {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  ur: "اقلامِ ستہ میں سے ایک، محقق کی چھوٹی صورت اور جوڑی دار، دیوانی دستاویزات، ترقیموں، جلدوں اور منقش صفحات کے لیے پسندیدہ {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}۔"
  es: "Una de las seis plumas proporcionales, una variante más pequeña y compañera de la muhaqqaq, preferida para documentos de cancillería, colofones, cubiertas de libros y páginas de alfombras {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  fr: "L'un des six stylos proportionnels, une variante plus petite et partenaire du muhaqqaq, préféré pour les documents de chancellerie, les colophons, les couvertures de livres et les pages de tapis {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  tr: "Altı ağırlıklı kalemden biri, araştırmacı ve yakın muadili daha küçük bir fotoğraf, gümrük belgelerini, mühürleri, kapak süslemelerini ve süslü sayfaları tercih ediyordu {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 26}."
  id: "Salah satu dari enam pena berbobot, gambar kecil penyelidik dan rekan dekatnya, lebih memilih dokumen bea cukai, segel, dekorasi sampul, dan halaman yang dihias {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 26}."
