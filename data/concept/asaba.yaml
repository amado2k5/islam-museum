id: concept/asaba
class: concept
kind: legal
label:
  ar: "العَصَبَة"
  en: "Agnatic kin (asaba) in inheritance, guardianship and custody"
  fr: "Parents agnats (asaba) dans l’héritage, la tutelle et la garde"
  ur: "عصبہ ⁦(عصبات)⁩"
  es: "Parientes agnatos (asaba) en materia de herencia, tutela y custodia."
summary:
  ar: "العصبة في اللغة أبناء الرجل وأقاربه لأبيه، والذين يرثونه، وفي الاصطلاح من ليس له سهم مقدر من المجمع على توريثهم، فيرث المال إن لم يكن معه ذو فرض، أو ما فضل بعد الفروض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. ويقابلها أصحاب الفروض، وهم أهل النصيب المقدر في كتاب الله، وذوو الأرحام، وهم كل قريب ليس بذي سهم ولا عصبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. وللعصبة في الإرث ثلاثة أقسام: عاصب بنفسه كالابن وابن الابن، وعاصب بغيره كالبنات مع الإخوة، وعاصب مع غيره كالأخوات مع البنات، وتأخذ ما أبقت الفرائض، وتحوز جميع المال إن انفردت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}. ويتعلق بالعصبة تقديمها في غسل الميت والصلاة عليه، وولاية النكاح، وانتقال الحضانة إليها عند عدم من يستحقها من النساء على ترتيب الإرث، ولزوم دية الخطأ على عاقلة الجاني، واستثنى الشافعية الأصل والفرع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}."
  en: "In the lexicon, asaba are a man's sons and his paternal relatives, who inherit from him. As a term they are the heirs who have no fixed share in the inheritance agreed upon, and who take what remains after the sharers take theirs, or the whole estate if there are no sharers {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. They are set against the sharers (ashab al-furud), who have a fixed share in the Book of God, and against the distant kin (dhawu al-arham), who are relatives with neither a fixed share nor agnatic standing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. Agnates in inheritance are of three kinds: the agnate in his own right, such as a son; the agnate through another, such as daughters with their brothers; and the agnate with another, such as sisters with daughters. They take what the fixed shares leave, and the whole estate if alone {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}. Agnates also have priority in the washing and funeral prayer of the dead, the right to contract a marriage on behalf of a woman, custody of a child when no woman entitled to it is available, and the bearing of blood money for manslaughter, with the Shafi'is excluding the ascendant and descendant from that burden {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}."
  fr: "Dans la langue, les asaba sont les fils d’un homme et ses parents du côté paternel, qui héritent de lui. En droit successoral, le terme désigne des héritiers dont le droit à hériter fait l’objet d’un consensus, mais à qui aucune part fixe n’est réservée. Ils recueillent le reliquat une fois les parts fixes attribuées, ou la totalité de la succession si personne n’a droit à une part fixe {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. Ils s’opposent aux ayants droit à part fixe (ashab al-furud), qui ont une part déterminée dans le Livre de Dieu, et aux parents éloignés (dhawu al-arham), qui sont des proches n’ayant ni part fixe ni qualité d’agnat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. Dans l’héritage, les agnats sont de trois catégories : l’agnat par lui-même, comme le fils ; l’agnat par autrui, comme les filles avec leurs frères ; et l’agnat avec autrui, comme les sœurs avec les filles. Ils prennent ce que laissent les parts fixes, et la totalité de la succession s’ils sont seuls {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}. Les agnats ont aussi la priorité pour le lavage et la prière funéraire du défunt, le droit de conclure le mariage au nom d’une femme, la garde d’un enfant lorsqu’aucune femme qui y a droit n’est disponible, et la charge du prix du sang pour l’homicide involontaire, les shafi’ites excluant de cette charge l’ascendant et le descendant {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}."
  es: "En el léxico, asaba son los hijos de un hombre y sus parientes paternos, que heredan de él. Como término son los herederos que no tienen una parte fija en la herencia acordada, y que toman lo que queda después de que los copartícipes toman lo suyo, o toda la herencia si no hay copartícipes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. Se contraponen a los copartícipes (ashab al-furud), que tienen una parte fija en el Libro de Dios, y a los parientes lejanos (dhawu al-arham), que son parientes sin una parte fija ni posición agnaticia {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. Los agnados en la herencia son de tres tipos: el agnado por derecho propio, como un hijo; los agnados a través de otro, como las hijas con sus hermanos; y los agnados con otro, como las hermanas con sus hijas. Toman lo que dejan las partes fijas, y toda la herencia si están solos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}. Los agnados también tienen prioridad en el lavado y la oración fúnebre de los muertos, el derecho a contraer matrimonio en nombre de una mujer, la custodia de un hijo cuando no hay ninguna mujer con derecho a él disponible, y el pago de la indemnización por homicidio, con los Shafi'is excluyendo al ascendiente y al descendiente de esa carga {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}."
  ur: "لغت میں، اصابہ ایک آدمی کے بیٹے اور اس کے آبائی رشتہ دار ہیں، جو اس سے وراثت میں آتے ہیں۔ اصطلاحی طور پر وہ وارث ہیں جن کا متفقہ وراثت میں کوئی مقررہ حصہ نہیں ہے، اور جو حصہ داروں کے لینے کے بعد جو بچتا ہے اسے لے لیتے ہیں، یا اگر کوئی حصہ دار نہ ہوں تو پوری جائیداد لے لیتے ہیں۔ وہ ان شراکت داروں ⁦(اصحاب الفرود)⁩ کے خلاف ہیں جن کا خدا کی کتاب میں حصہ مقرر ہے، اور ان دور کے رشتہ داروں کے خلاف ہے جو نہ تو متعین حصہ کے ساتھ ہیں اور نہ ہی جہنمی موقف کے ساتھ۔ وراثت میں اگنیٹس تین قسم کے ہوتے ہیں: اگنیٹ اپنے حق میں، جیسے بیٹا۔ دوسرے کے ذریعے اگنیٹ، جیسے بیٹیاں اپنے بھائیوں کے ساتھ۔ اور دوسرے کے ساتھ اگنیٹی، جیسے بہنیں بیٹیوں کے ساتھ۔ وہ جو مقررہ حصص چھوڑتے ہیں وہ لے لیتے ہیں، اور اگر اکیلے ہوں تو پوری جائیداد لے لیتے ہیں {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11641}۔ میت کے غسل اور نماز جنازہ میں بھی اجنبیوں کو ترجیح حاصل ہے، عورت کی طرف سے نکاح کا حق، جب کوئی عورت اس کی حقدار نہ ہو تو بچے کی حفاظت، اور قتل کے بدلے خون بہانے کو، شافعی اس بوجھ سے صعودی اور اولاد کو خارج کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11640} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11641}۔"
