label:
  ar: "العَصَبَة"
  en: "Agnatic kin (asaba) in inheritance, guardianship and custody"
  ur: "عصبہ (عصبات)"
summary:
  ar: "العصبة في اللغة أبناء الرجل وأقاربه لأبيه، والذين يرثونه، وفي الاصطلاح من ليس له سهم مقدر من المجمع على توريثهم، فيرث المال إن لم يكن معه ذو فرض، أو ما فضل بعد الفروض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. ويقابلها أصحاب الفروض، وهم أهل النصيب المقدر في كتاب الله، وذوو الأرحام، وهم كل قريب ليس بذي سهم ولا عصبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. وللعصبة في الإرث ثلاثة أقسام: عاصب بنفسه كالابن وابن الابن، وعاصب بغيره كالبنات مع الإخوة، وعاصب مع غيره كالأخوات مع البنات، وتأخذ ما أبقت الفرائض، وتحوز جميع المال إن انفردت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}. ويتعلق بالعصبة تقديمها في غسل الميت والصلاة عليه، وولاية النكاح، وانتقال الحضانة إليها عند عدم من يستحقها من النساء على ترتيب الإرث، ولزوم دية الخطأ على عاقلة الجاني، واستثنى الشافعية الأصل والفرع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}."
  en: "In the lexicon, asaba are a man's sons and his paternal relatives, who inherit from him. As a term they are the heirs who have no fixed share in the inheritance agreed upon, and who take what remains after the sharers take theirs, or the whole estate if there are no sharers {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. They are set against the sharers (ashab al-furud), who have a fixed share in the Book of God, and against the distant kin (dhawu al-arham), who are relatives with neither a fixed share nor agnatic standing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640}. Agnates in inheritance are of three kinds: the agnate in his own right, such as a son; the agnate through another, such as daughters with their brothers; and the agnate with another, such as sisters with daughters. They take what the fixed shares leave, and the whole estate if alone {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}. Agnates also have priority in the washing and funeral prayer of the dead, the right to contract a marriage on behalf of a woman, custody of a child when no woman entitled to it is available, and the bearing of blood money for manslaughter, with the Shafi'is excluding the ascendant and descendant from that burden {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11641}."
