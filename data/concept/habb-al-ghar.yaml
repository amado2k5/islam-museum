id: concept/habb-al-ghar
class: concept
kind: natural
label:
  ar: "حبّ الغار"
  en: "Habb al-ghar (the laurel berry)"
  ur: "حب الغار ⁦(غار کا دانہ)⁩"
  es: "Habb al-ghar (la baya de laurel)"
  fr: "Habb al-ghar (la baie de laurier)"
summary:
  ar: "حبّ الغار ثمرة صغيرة كالبندق، قشرها إلى السواد رقيق، ينفلق عن فلقتين صلبتين إلى الصفرة، وفيه يسير عطرية. وأفعاله مؤجّلة إلى فصل الغين عند ذكر الغار."
  en: "Habb al-ghar is a small hazelnut-like berry with a thin, dark shell that splits into two hard yellowish halves, with a slight fragrance. Its actions are deferred to the letter ghayn, under ghar."
  ur: "حب الغار ایک چھوٹا ہیزل نٹ جیسا دانہ ہے جس کا چھلکا باریک اور سیاہی مائل ہوتا ہے، جو دباؤ سے دو سخت زردی مائل حصوں میں کھل جاتا ہے، اور اس میں ہلکی خوشبو ہے۔ اس کے افعال حرف غین میں غار کے تحت بیان کیے جائیں گے۔"
  es: "Habb al-ghar es una pequeña baya parecida a una avellana, con una cáscara fina y oscura que se parte en dos mitades duras y amarillentas, y que desprende una ligera fragancia. Sus funciones se atribuyen a la letra ghayn, bajo ghar."
  fr: "Le habb al-ghar est une petite baie ressemblant à une noisette, à la coque fine et foncée qui se divise en deux moitiés dures et jaunâtres, légèrement parfumée. Ses propriétés sont décrites par la lettre ghayn, sous le terme ghar."
