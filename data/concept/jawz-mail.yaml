summary:
  ar: "سمّ مخدّر شبيه بالجوز، عليه شوك غليظ قصير، وحبّه مثل حبّ الأترج. مُسبِت، رديء للدماغ، وهو عدوّ للقلب، ويُذكر أن قليله يُهلك في يومه. نبات له زهر أبيض كبير {cite:canon-ibn-sina-print-v1 p.431}."
  en: "A narcotic poison like the walnut, with short thick thorns, and its seed like the citron seed. It stupefies, is bad for the brain, and is an enemy of the heart; the book says even a small amount is deadly the same day. A plant with a large white flower {cite:canon-ibn-sina-print-v1 p.431}."
  ur: "جوز سے مشابہ ایک مخدّر زہر، جس پر چھوٹے موٹے کانٹے ہیں، اور اس کا بیج ترنج کے بیج جیسا ہے۔ یہ بے ہوشی لاتا ہے، دماغ کے لیے نقصان دہ ہے، اور دل کا دشمن ہے؛ کتاب کہتی ہے کہ تھوڑی مقدار بھی اسی دن ہلاک کرتی ہے۔ یہ ایک پودا ہے جس پر بڑا سفید پھول ہے {cite:canon-ibn-sina-print-v1 p.431}۔"
