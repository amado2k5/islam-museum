summary:
  ar: "دار الجزاء في القرآن والسنة: الدار الآخرة التي يُجازى فيها الناس على أعمالهم، يذكر أنها الجنة والنار، وأن الله يجزى كل إنسان على عمله خيرا أو شرا."
  en: "The Abode of Recompense in Qur'an and Sunnah: the Hereafter where people are repaid for their deeds — paradise and fire — where God rewards every person for their deeds, good or evil."
  ur: "دار الجزا قرآن و سنت میں: وہ دارِ آخرت جہاں لوگوں کو ان کے اعمال کا بدلہ دیا جاتا ہے — جنت اور آگ — جہاں اللہ ہر انسان کو اس کے عمل کا بدلہ دیتا ہے، نیکی یا بدی۔"
