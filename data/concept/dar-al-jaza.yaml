label:
  ar: دار الجزاء
  en: The Abode of Recompense
  ur: دار الجزا
  es: "La Morada de la Recompensa"
  fr: "Le Demeure de la Récompense"
  tr: "Hapishane"
  id: "Penjara"
summary:
  ar: "دار الجزاء في القرآن والسنة: الدار الآخرة التي يُجازى فيها الناس على أعمالهم، يذكر أنها الجنة والنار، وأن الله يجزى كل إنسان على عمله خيرا أو شرا."
  en: "The Abode of Recompense in Qur'an and Sunnah: the Hereafter where people are repaid for their deeds — paradise and fire — where God rewards every person for their deeds, good or evil."
  ur: "دار الجزا قرآن و سنت میں: وہ دارِ آخرت جہاں لوگوں کو ان کے اعمال کا بدلہ دیا جاتا ہے — جنت اور آگ — جہاں اللہ ہر انسان کو اس کے عمل کا بدلہ دیتا ہے، نیکی یا بدی۔"
  es: "La Morada de la Recompensa en el Corán y la Sunnah: la otra vida, donde las personas son recompensadas por sus obras (el paraíso y el fuego), donde Dios recompensa a cada persona por sus actos, buenos o malos."
  fr: "Le lieu de la récompense dans le Coran et la Sunna: l’au-delà où les gens sont récompensés pour leurs actes — le paradis et le feu — où Dieu récompense chaque personne pour ses actes, bons ou mauvais."
  tr: "Kur'an ve Sünnet'teki ödül yeri: İnsanların yaptıkları şeylerin ödülünü aldığı ahiret yeri. Burası cennet ve cehennemdir ve Allah'ın her kişiyi, iyi ya da kötü, yaptığı şeyler için ödüllendirdiği belirtilir."
  id: "Tempat keberadaan ganjaran dalam Al-Qur'an dan Sunnah: tempat di akhirat di mana manusia diberi ganjaran atas perbuatan mereka. Disebutkan bahwa ini adalah Surga dan Neraka, dan Allah memberi ganjaran kepada setiap orang atas perbuatannya, baik atau buruk."
