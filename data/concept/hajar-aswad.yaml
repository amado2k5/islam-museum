id: concept/hajar-aswad
class: concept
kind: legal
label: { ar: "الحجر الأسود", en: "The Black Stone (al-Hajar al-Aswad)", ur: "حجرِ اسود", es: "La Piedra Negra (al-Hajar al-Aswad)", fr: "La Pierre Noire (al-Hajar al-Aswad)", tr: "Kara Taş", id: "Batu Hitam" }
summary:
  ar: "الحجر الأسود كتلة من الحجر ضاربة إلى السواد، شبه بيضاوية الشكل، تقع في أصل بناء الكعبة في ركنها الجنوبي الشرقي، يستلمه الطائفون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} ويتفق الفقهاء على سنية استلامه وتقبيله لمن يقدر، فإن عجز استلمه باليد وقبّل يده عند المالكية والحنابلة، وعند الحنفية والشافعية يمسّه بشيء في يده ثم يقبّله، أو يشير إليه من بعيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} ويستحب التكبير عند استلامه، ورفع اليدين عند التكبير عند الجمهور، ويستحب استلامه في كل طواف، وأن يُقبّل من غير صوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} ويتعين عند المالكية والشافعية والحنابلة ومحمد بن الحسن أن يبدأ الطواف من الحجر، فلا يُحتسب الشوط الذي لا يبدأ منه إلا أن يصير إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} ولا يستحب للنساء استلامه إلا عند خلو المطاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919}"
  en: "The Black Stone is a dark, roughly oval stone set in the south-east corner of the Ka'ba, which circumambulants touch. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} The jurists agree that it is recommended to touch and kiss it when able; when unable, the Malikis and Hanbalis allow touching it with the hand and kissing the hand, while the Hanafis and Shafi'is touch it with something held in the hand and kiss that, or point at it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} It is recommended to say takbir at touching it, and the majority raise the hands; it is recommended to touch it in every circuit and to kiss it silently. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} The Malikis, Shafi'is, Hanbalis and Muhammad ibn al-Hasan hold that the circuit must begin at the Stone, and a circuit that does not begin there is not counted unless it reaches the Stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} Women are not recommended to touch it except when the circuit is clear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919}"
  es: "La Piedra Negra es una piedra oscura, aproximadamente ovalada, situada en la esquina sureste de la Kaaba, que los circunvaladores tocan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} Los juristas coinciden en que es recomendable tocarla y besarla cuando sea posible; cuando no lo sea, los malikíes y hanbalíes permiten tocarla con la mano y besarla, mientras que los hanafíes y shafiíes la tocan con algo que sostienen en la mano y lo besan, o la señalan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} Se recomienda decir takbir al tocarla, y la mayoría levanta las manos; se recomienda tocarla en cada circunvalación y besarla en silencio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} Los malikíes, shafi'ís, hanbalíes y Muhammad ibn al-Hasan sostienen que el circuito debe comenzar en la Piedra, y un circuito que no comience allí no se cuenta a menos que llegue a la Piedra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} No se recomienda que las mujeres la toquen excepto cuando el circuito esté despejado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919}"
  fr: "La Pierre Noire est une pierre sombre, de forme ovale approximative, située dans l'angle sud-est de la Kaaba, que les fidèles touchent lors de la circumambulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} Les juristes s'accordent à dire qu'il est recommandé de la toucher et de l'embrasser lorsque cela est possible; dans le cas contraire, les écoles malikite et hanbalite autorisent à la toucher de la main et à embrasser la main, tandis que les écoles hanafite et chaféite la touchent avec un objet tenu à la main et l'embrassent, ou la désignent du doigt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} Il est recommandé de prononcer le takbir en la touchant, et la majorité lève les mains; il est recommandé de la toucher à chaque circumambulation et de l'embrasser en silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} Les Malikites, les Shafi'ites, les Hanbalites et Muhammad ibn al-Hasan estiment que le circuit doit commencer à la Pierre, et qu'un circuit qui ne commence pas à cet endroit n'est pas comptabilisé à moins qu'il n'atteigne la Pierre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} Il est déconseillé aux femmes de la toucher, sauf lorsque le circuit est pur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919}"
  ur: "حجر اسود ایک سیاہ، تقریباً بیضوی پتھر ہے جو کعبہ کے جنوب مشرقی کونے میں نصب ہے، جسے طواف کرنے والے چھوتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6917} فقہاء اس بات پر متفق ہیں کہ جب استطاعت ہو تو اسے چھونا اور چومنا مستحب ہے۔ جب اس سے عاجز ہو تو مالکیہ اور حنبلی اس کو ہاتھ سے چھونے اور ہاتھ کو چومنے کی اجازت دیتے ہیں، جب کہ حنفیہ اور شافعی ہاتھ میں پکڑی ہوئی چیز سے چھوتے ہیں اور اسے چومتے ہیں یا اس کی طرف اشارہ کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6917} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6918} اسے چھونے پر تکبیر کہنا مستحب ہے، اور اکثریت ہاتھ اٹھاتی ہے۔ اسے ہر سرکٹ میں چھونے اور خاموشی سے چومنے کی سفارش کی جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6918} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6919} مالکیہ، شافعیہ، حنبلی اور محمد ابن الحسن کا خیال ہے کہ چکر کا آغاز حجر اسود سے ہونا چاہیے، اور اس کے بغیر کوئی چکر شروع نہیں ہوتا جو وہاں تک نہیں پہنچتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6919} خواتین کو اسے چھونے کی سفارش نہیں کی جاتی ہے سوائے اس کے جب سرکٹ صاف ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص6919}"
  tr: "Kara Taş, siyah renkte bir taştır, yarı oval, Kabe'nin yapısının güneydoğu köşesinde yer alır. Çevreleyiciler tarafından kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6917} Hukukçular, Sünnet'te kabul edilip öpülmesi konusunda anlaşırlar; yapabilenler için Sünnet'te anlaşırlar. Dokunamazsa, Sünnet özenle seçilir ve öpülür. Maliki ve Hanbali'ye, Hanafi ve Şafi'lere göre, elinde bir şeyle dokunur ve sonra öper ya da uzaktan işaret eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.6917} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 6918} Takbir dokunulurken okunması, cemaatin önünde takbir söylerken ellerin kaldırılması ve her tavafta dokunulması ve ses çıkarmadan öpülmesi tavsiye edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.6918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6919} Malikiler, Şafi'ler, Hanbaliler ve Muhammed ibn al-Hasan'a göre, Tevaf'ın Hicr'den başlaması zorunludur, bu yüzden başlamadığı çevre dolaşması, Taaf'a ulaşmadıkça sayılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6919} Kadınların Mataf kapalı olmadıkça Tawaf alması önerilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6919}"
  id: "Batu Hitam adalah batu berwarna kehitaman berbentuk semi-oval, terletak di dasar struktur Ka'bah di sudut tenggaranya. Para pengelilingi yang menerimanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6917} Para ahli hukum sepakat pada Sunnah untuk menerima dan menciumnya bagi yang mampu. Jika seseorang tidak dapat menyentuhnya, batu itu dipilih dan dicium dengan tangan. Menurut Maliki dan Hanbali, serta menurut Hanafi dan Shafi'i, ia menyentuhnya dengan sesuatu di tangannya lalu menciumnya atau menunjuk dari kejauhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.. 6918} Disarankan untuk mengucapkan takbir saat menyentuhnya, mengangkat tangan saat mengucapkan takbir di depan jemaat, dan disarankan untuk menyentuhnya setiap tawaf, serta mencium tanpa bersuara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6919} Menurut Maliki, Shafi'i, Hanbali, dan Muhammad ibn al-Hasan, diwajibkan memulai Tawaf dari Hijr, sehingga perjalanan mengelilingi yang tidak dimulainya tidak dihitung kecuali sampai ke sana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6919} Tidak disarankan bagi wanita untuk mengonsumsinya kecuali saat Mataf ditutup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919}"
