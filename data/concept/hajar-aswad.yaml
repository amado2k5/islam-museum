label: { ar: "الحجر الأسود", en: "The Black Stone (al-Hajar al-Aswad)", ur: "حجرِ اسود" }
summary:
  ar: "الحجر الأسود كتلة من الحجر ضاربة إلى السواد، شبه بيضاوية الشكل، تقع في أصل بناء الكعبة في ركنها الجنوبي الشرقي، يستلمه الطائفون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} ويتفق الفقهاء على سنية استلامه وتقبيله لمن يقدر، فإن عجز استلمه باليد وقبّل يده عند المالكية والحنابلة، وعند الحنفية والشافعية يمسّه بشيء في يده ثم يقبّله، أو يشير إليه من بعيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} ويستحب التكبير عند استلامه، ورفع اليدين عند التكبير عند الجمهور، ويستحب استلامه في كل طواف، وأن يُقبّل من غير صوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} ويتعين عند المالكية والشافعية والحنابلة ومحمد بن الحسن أن يبدأ الطواف من الحجر، فلا يُحتسب الشوط الذي لا يبدأ منه إلا أن يصير إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} ولا يستحب للنساء استلامه إلا عند خلو المطاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919}"
  en: "The Black Stone is a dark, roughly oval stone set in the south-east corner of the Ka'ba, which circumambulants touch. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} The jurists agree that it is recommended to touch and kiss it when able; when unable, the Malikis and Hanbalis allow touching it with the hand and kissing the hand, while the Hanafis and Shafi'is touch it with something held in the hand and kiss that, or point at it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} It is recommended to say takbir at touching it, and the majority raise the hands; it is recommended to touch it in every circuit and to kiss it silently. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} The Malikis, Shafi'is, Hanbalis and Muhammad ibn al-Hasan hold that the circuit must begin at the Stone, and a circuit that does not begin there is not counted unless it reaches the Stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919} Women are not recommended to touch it except when the circuit is clear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6919}"
