id: concept/riaya
class: concept
kind: term
label: { ar: "الرعاية", en: "Safeguarding (ri'aya)", ur: "رعایت" }
summary:
  ar: "المنزلة الثالثة والعشرون من منازل السالكين في مدارج السالكين لابن قيم الجوزية؛ هي مراعاة العلم بالعمل، والعمل بالإحسان والإخلاص، والحال بالموافقة، ويجعل مراتب العلم ثلاثاً: رواية ودراية ورعاية، ويستشهد بذم من لم يرع الرهبانية التي ابتدعها، ويشرح درجات الهروي الثلاث: رعاية الأعمال والأحوال والأوقات."
  en: "The twenty-third of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin: safeguarding knowledge by action, action by excellence and sincerity, and the spiritual state by conformity. He ranks knowledge in three tiers – transmission, understanding and safeguarding – cites the Qur'an's blame of those who did not observe the monasticism they had invented, and explains al-Harawi's three degrees: safeguarding deeds, states and moments."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی تئیسویں منزل: علم کی عمل سے، عمل کی احسان اور اخلاص سے، اور حال کی موافقت سے حفاظت۔ وہ علم کے تین مراتب بیان کرتے ہیں – روایت، درایت اور رعایت – قرآن میں ان لوگوں کی مذمت سے استدلال کرتے ہیں جنہوں نے اپنی ایجاد کردہ رہبانیت کی رعایت نہ کی، اور ہروی کے تین درجوں کی شرح کرتے ہیں: اعمال، احوال اور اوقات کی رعایت۔"
