label: { ar: "الرعاية", en: "Safeguarding (ri'aya)", ur: "رعایت", es: "Salvaguarda (ri'aya)", fr: "Sauvegarde (ri'aya)" }
summary:
  ar: "المنزلة الثالثة والعشرون من منازل السالكين في مدارج السالكين لابن قيم الجوزية؛ هي مراعاة العلم بالعمل، والعمل بالإحسان والإخلاص، والحال بالموافقة، ويجعل مراتب العلم ثلاثاً: رواية ودراية ورعاية، ويستشهد بذم من لم يرع الرهبانية التي ابتدعها، ويشرح درجات الهروي الثلاث: رعاية الأعمال والأحوال والأوقات."
  en: "The twenty-third of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin: safeguarding knowledge by action, action by excellence and sincerity, and the spiritual state by conformity. He ranks knowledge in three tiers – transmission, understanding and safeguarding – cites the Qur'an's blame of those who did not observe the monasticism they had invented, and explains al-Harawi's three degrees: safeguarding deeds, states and moments."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی تئیسویں منزل: علم کی عمل سے، عمل کی احسان اور اخلاص سے، اور حال کی موافقت سے حفاظت۔ وہ علم کے تین مراتب بیان کرتے ہیں – روایت، درایت اور رعایت – قرآن میں ان لوگوں کی مذمت سے استدلال کرتے ہیں جنہوں نے اپنی ایجاد کردہ رہبانیت کی رعایت نہ کی، اور ہروی کے تین درجوں کی شرح کرتے ہیں: اعمال، احوال اور اوقات کی رعایت۔"
  es: "La vigésimo tercera etapa de las peregrinaciones en la obra Madarij al-Salikin de Ibn Qayyim al-Jawziyya consiste en salvaguardar el conocimiento mediante la acción, la acción mediante la excelencia y la sinceridad, y el estado espiritual mediante la conformidad. Clasifica el conocimiento en tres niveles: transmisión, comprensión y salvaguarda. Cita la censura del Corán a quienes no observaron el monacato que ellos mismos habían inventado y explica los tres grados de al-Harawi: salvaguardar las acciones, los estados y los momentos."
  fr: "La vingt-troisième étape du parcours du pèlerin, selon Ibn Qayyim al-Jawziyya dans son ouvrage Madarij al-Salikin, consiste à préserver le savoir par l'action, à agir avec excellence et sincérité, et à atteindre l'état spirituel par la conformité. L'auteur hiérarchise le savoir en trois niveaux – transmission, compréhension et préservation –, cite le reproche du Coran à ceux qui n'ont pas respecté la vie monastique qu'ils avaient eux-mêmes instituée, et explique les trois degrés de la doctrine d'al-Harawi: la préservation des actes, des états et des moments."
