id: concept/diwan-al-barid
class: concept
kind: political
label: { ar: "ديوان البريد", en: "Diwan al-Barid (the postal diwan)", ur: "دیوان البرید ⁦(ڈاک کا دیوان)⁩", es: "Diwan al-Barid (el diwan postal)", fr: "Diwan al-Barid (le diwan postal)" }
summary:
  ar: "ديوان البريد عند قدامة بن جعفر في كتاب الخراج وصنعة الكتابة: ديوان يُفرد به، تصرف إليه الكتب المنفذة من جميع النواحي ويُنفذ كل شيء إلى الموضع المرسوم به، ويتولى عرض كتب أصحاب البريد والأخبار في جميع النواحي على الخليفة أو عمل جوامع لها، وإليه النظر في أمر الغروانقيين والموقتين والمؤثبين في السكك وتنجيز أرزاقهم وتقليد أصحاب الخرائط في سائر الأمصار، والذي يحتاج إليه في صاحب هذا الديوان أن يكون ثقة {cite:masalik-mamalik-ibn-khurdadhbih p. 192}. ويؤرخ القلقشندي في صبح الأعشى للبريد من الأكاسرة والقياصرة إلى معاوية وعبد الملك والعباسيين، ثم قطع بني بويه له، وإعادة الظاهر بيبرس إياه بين مصر والشام، وبطلانه بعد فتنة تيمور سنة 804هـ، ويصف ألواحه الفضية المنقوشة التي يحملها البريدي في عنقه، ومراكزه من قلعة الجبل إلى قوص والإسكندرية ودمياط وغزة ودمشق وحلب {cite:subh-al-asha-cairo-v14 p. 366-373}."
  en: "The postal diwan as Abu al-Faraj Qudama ibn Ja'far prescribes it in Kitab al-Kharaj wa-Sina'at al-Kitaba: a diwan unto itself receiving dispatches from every province and forwarding each to its destination, presenting the barid masters' reports from all regions to the caliph or composing their digests, overseeing the station-masters, timekeepers and clerks of the relay routes, disbursing their rations and commissioning the keepers of itineraries in every misr — its chief required to be a man of trust {cite:masalik-mamalik-ibn-khurdadhbih p. 192}. Al-Qalqashandi's Subh al-a'sha traces the barid from the Persian and Roman emperors through Mu'awiya, Abd al-Malik and the Abbasids, its suspension by the Buyids, its revival by al-Zahir Baybars between Egypt and Syria and its collapse after Timur's invasion in 804 AH, and describes the engraved silver plaques couriers wore and the relay stations from the Cairo Citadel to Qus, Alexandria, Damietta, Gaza, Damascus and Aleppo {cite:subh-al-asha-cairo-v14 p. 366-373}."
  es: "El diwan postal, tal como lo prescribe Abu al-Faraj Qudama ibn Ja'far en Kitab al-Kharaj wa-Sina'at al-Kitaba: un diwan en sí mismo que recibe despachos de cada provincia y los envía a su destino, presenta los informes de los maestros barid de todas las regiones al califa o compone sus resúmenes, supervisa a los jefes de estación, cronometradores y escribanos de las rutas de relevo, distribuye sus raciones y comisiona a los encargados de los itinerarios en cada misr; su jefe debía ser un hombre de confianza {cite:masalik-mamalik-ibn-khurdadhbih p. 192}. El Subh al-a'sha de Al-Qalqashandi rastrea el barid desde los emperadores persas y romanos a través de Mu'awiya, Abd al-Malik y los abasíes, su suspensión por los buyíes, su reactivación por al-Zahir Baybars entre Egipto y Siria y su colapso después de la invasión de Timur en 804 AH, y describe las placas de plata grabadas que llevaban los mensajeros y las estaciones de relevo desde la Ciudadela de El Cairo hasta Qus, Alejandría, Damietta, Gaza, Damasco y Alepo {cite:subh-al-asha-cairo-v14 p. 366-373}."
  fr: "Le diwan postal tel qu'Abu al-Faraj Qudama ibn Ja'far le prescrit dans Kitab al-Kharaj wa-Sina'at al-Kitaba: un diwan en soi recevant les dépêches de chaque province et les acheminant à leur destination, présentant au calife les rapports des maîtres barid de toutes les régions ou composant leurs résumés, supervisant les chefs de gare, les chronométreurs et les commis des itinéraires de relais, distribuant leurs rations et chargeant les gardiens d'itinéraires dans chaque misr — son chef devant être un homme de confiance {cite:masalik-mamalik-ibn-khurdadhbih p. 192}. L'ouvrage Subh al-a'sha d'Al-Qalqashandi retrace l'histoire du barid depuis les empereurs perses et romains jusqu'à Mu'awiya, Abd al-Malik et les Abbassides, sa suspension par les Bouyides, sa renaissance par al-Zahir Baybars entre l'Égypte et la Syrie et son effondrement après l'invasion de Timour en 804 AH, et décrit les plaques d'argent gravées que portaient les courriers et les stations relais de la citadelle du Caire à Qos, Alexandrie, Damiette, Gaza, Damas et Alep {cite:subh-al-asha-cairo-v14 p. 366-373}."
  ur: "ڈاک کا دیوان جیسا کہ ابو الفراج قدامہ ابن جعفر نے اسے کتاب الخراج و سیناۃ الکتابہ میں بیان کیا ہے: ایک دیوان جو اپنے آپ کو ہر صوبے سے بھیجتا ہے اور ہر ایک کو اس کی منزل تک پہنچاتا ہے، تمام خطوں سے بارد کے آقاؤں کی رپورٹیں خلیفہ کے سامنے پیش کرتا ہے، اپنے وقت کے ناظمین اور ناظمین کو مرتب کرتا ہے۔ ریلے کے راستوں کے کلرک، ان کا راشن تقسیم کرتے تھے اور ہر مصر میں سفر کے نگہبانوں کو کمیشن دیتے تھے - اس کے سربراہ کے لیے ضروری تھا کہ وہ قابل اعتماد آدمی ہو۔ 192}۔ القلقاشندی کی سبھ العیشا میں معاویہ، عبد الملک اور عباسیوں کے ذریعے فارس اور رومی شہنشاہوں سے بارد کا پتہ چلتا ہے، خریداروں کے ذریعہ اس کی معطلی، مصر اور شام کے درمیان الظاہر بیبرس کے ذریعہ اس کا احیاء اور تیمور کے حملے کے بعد اس کا خاتمہ، کورئیر پہنتے تھے اور قاہرہ قلعہ سے قس، اسکندریہ، دمیتہ، غزہ، دمشق اور حلب تک ریلے اسٹیشنز 366-373}۔"
