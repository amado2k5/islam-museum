label: { ar: "ديوان البريد", en: "Diwan al-Barid (the postal diwan)" }
summary:
  ar: "ديوان البريد عند قدامة بن جعفر في كتاب الخراج وصنعة الكتابة: ديوان يُفرد به، تصرف إليه الكتب المنفذة من جميع النواحي ويُنفذ كل شيء إلى الموضع المرسوم به، ويتولى عرض كتب أصحاب البريد والأخبار في جميع النواحي على الخليفة أو عمل جوامع لها، وإليه النظر في أمر الغروانقيين والموقتين والمؤثبين في السكك وتنجيز أرزاقهم وتقليد أصحاب الخرائط في سائر الأمصار، والذي يحتاج إليه في صاحب هذا الديوان أن يكون ثقة {cite:masalik-mamalik-ibn-khurdadhbih p. 192}."
  en: "The postal diwan as Abu al-Faraj Qudama ibn Ja'far prescribes it in Kitab al-Kharaj wa-Sina'at al-Kitaba: a diwan unto itself receiving dispatches from every province and forwarding each to its destination, presenting the barid masters' reports from all regions to the caliph or composing their digests, overseeing the station-masters, timekeepers and clerks of the relay routes, disbursing their rations and commissioning the keepers of itineraries in every misr — its chief required to be a man of trust {cite:masalik-mamalik-ibn-khurdadhbih p. 192}."
