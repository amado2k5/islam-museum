perspectives:
- tradition: sunni
  id: sunni-sharawi-covenant
  stance:
    ar: "الإسلام دين الوفاء بالعهود، ومن لجأ إلى قوم بينهم وبين المسلمين ميثاق فله الأمان"
    en: "Islam is a religion of keeping covenants; one who takes refuge with a people bound to the Muslims by treaty is given safety"
  summary:
    ar: "يقرر الشعراوي أن الآية تستثني من الأمر بالأخذ والقتل من يلجأ إلى قوم بينهم وبين المسلمين عهد، لأن الإسلام دين الوفاء بالعهود {cite:tafsir-sharawi-khawatir-scan p.2533}. ويعرض عهد النبي مع هلال بن عويمر الأسلمي على ألا يعين أحدهما على الآخر، وعلى أن من وصل إلى هلال فله ما لهلال من الجوار، ويرى أن الاستثناء يشمل من جاء إلى المسلمين من المنافقين، فيؤمنه الإسلام {cite:tafsir-sharawi-khawatir-scan p.2534}. ويرى أن الاستثناء يشمل من يضيق صدره عن قتال الفريقين، فيقبله النبي لأنه أقرّ بضعفه {cite:tafsir-sharawi-khawatir-scan p.2534}. وهذا رأيه، ولم تُعرض بعد أحكام الفقهاء في العهد والذمة من مصدر محدد (needs_source)."
    en: "Sha'rawi holds that the verse makes an exception to the order to seize and kill for one who takes refuge with a people bound by treaty, since Islam is a religion of keeping covenants {cite:tafsir-sharawi-khawatir-scan p.2533}. He cites the covenant between the Prophet and Hilal ibn Uwaymir, that neither would help the other's enemy and that whoever reached Hilal had Hilal's protection {cite:tafsir-sharawi-khawatir-scan p.2534}. He reads the exception as including hypocrites who come to the Muslims, who are given safety by Islam {cite:tafsir-sharawi-khawatir-scan p.2534}. He holds that the exception also covers one whose heart is too strained to fight either side, whom the Prophet accepts because he admits his weakness {cite:tafsir-sharawi-khawatir-scan p.2534}. This is his view; the jurists' rules on covenants and protection are not yet set out from a named source (needs_source)."
