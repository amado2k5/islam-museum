label:
  ar: العهد والميثاق
  en: Covenant and treaty (ahd and mithaq)
summary:
  ar: "يقرر الشعراوي أن الإسلام دين الوفاء بالعهود، فلا يُتعرض لمن لجأ إلى قوم بينهم وبين المسلمين ميثاق، ولا لمن جاء إلى المسلمين وقد ضاقت صدوره عن قتالهم وقتال قومه، ويضرب مثلاً بالعهد بين النبي وهلال بن عويمر الأسلمي على الجوار {cite:tafsir-sharawi-khawatir-scan p.2533}{cite:tafsir-sharawi-khawatir-scan p.2534}."
  en: "Sha'rawi holds that Islam is a religion that keeps its covenants: one who takes refuge with a people bound by treaty to the Muslims is not to be attacked, nor one who comes to the Muslims with a heart unwilling to fight them or his own people. He gives as an example the covenant between the Prophet and Hilal ibn Uwaymir al-Aslami on mutual protection {cite:tafsir-sharawi-khawatir-scan p.2533}{cite:tafsir-sharawi-khawatir-scan p.2534}."
