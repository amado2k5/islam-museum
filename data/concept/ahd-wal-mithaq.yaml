issue:
  ar: "هل يجوز قتال من بينه وبين المسلمين عهد أو ميثاق، وكيف يُعامل من لجأ إليهم؟"
  en: "May one fight those bound to the Muslims by a covenant, and how is one who takes refuge with them treated?"
