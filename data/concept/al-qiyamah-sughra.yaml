label:
  ar: القيامة الصغرى
  en: The Lesser Resurrection
  ur: صغری قیامت
summary:
  ar: "القيامة الصغرى في القرآن والسنة: موت كل إنسان وبعثه في برزخه، يذكر أنها من أشراط الساعة، وأن فيها من الفزع ما لا يوصف، وأن الله يبعث من في القبور كما يبعث من في الأرض."
  en: "The Lesser Resurrection in Qur'an and Sunnah: the death of every person and their raising in the barzakh — a sign of the Hour, a day of indescribable terror, when God raises those in the graves as He raises those on the earth."
  ur: "صغری قیامت قرآن و سنت میں: ہر انسان کی موت اور اس کا برزخ میں اٹھنا — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ قبروں سے اٹھاتا ہے جیسے زمین کے لوگوں کو اٹھاتا ہے۔"
