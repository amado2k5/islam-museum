id: concept/al-qiyamah-sughra
class: concept
kind: belief
label:
  ar: القيامة الصغرى
  en: The Lesser Resurrection
  fr: "La Petite Résurrection"
  ur: صغری قیامت
  es: "La Resurrección Menor"
  tr: "Küçük Diriliş"
  id: "Kebangkitan Kecil"
summary:
  ar: "القيامة الصغرى في القرآن والسنة: موت كل إنسان وبعثه في برزخه، يذكر أنها من أشراط الساعة، وأن فيها من الفزع ما لا يوصف، وأن الله يبعث من في القبور كما يبعث من في الأرض."
  en: "The Lesser Resurrection in Qur'an and Sunnah: the death of every person and their raising in the barzakh — a sign of the Hour, a day of indescribable terror, when God raises those in the graves as He raises those on the earth."
  fr: "La Petite Résurrection dans le Coran et la sunna : la mort de chaque personne et son relèvement dans le barzakh. C’est un signe de l’Heure, un jour de terreur indescriptible où Dieu relève ceux qui sont dans les tombes comme il relève ceux qui sont sur la terre."
  ur: "صغری قیامت قرآن و سنت میں: ہر انسان کی موت اور اس کا برزخ میں اٹھنا — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ قبروں سے اٹھاتا ہے جیسے زمین کے لوگوں کو اٹھاتا ہے۔"
  es: "La Resurrección Menor en el Corán y la Sunnah: la muerte de cada persona y su resurrección en el barzakh, una señal de la Hora, un día de terror indescriptible, cuando Dios resucitará a los que están en las tumbas como resucita a los que están en la tierra."
  tr: "Kur'an ve Sünnet'teki küçük diriliş: her insanın ölümü ve onların ara halindeki dirilişi. Bunun Saatin işaretlerinden biri olduğu, tarif edilemez bir korku içerdiği ve Allah'ın mezardakileri yeryüzündekileri dirilttiği gibi dirilttiği belirtilir."
  id: "Kebangkitan kecil dalam Al-Qur'an dan Sunnah: kematian setiap orang dan kebangkitan mereka dalam keadaan menengah. Dikatakan bahwa ini adalah salah satu tanda Jam, mengandung ketakutan yang tak terlukiskan, dan bahwa Allah membangkitkan mereka yang di kubur seperti halnya Dia membangkitkan mereka yang di bumi."
