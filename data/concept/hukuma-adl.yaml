label: { ar: "حكومة العدل", en: "Hukumat al-adl (assessed compensation)", ur: "حکومتِ عدل" }
summary:
  ar: "الحكومة لغة مصدر حكم، ومن معانيها رد الظالم عن ظلمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} والمراد بحكومة العدل في الفقه الواجب الذي يقدره عدل في جناية ليس فيها مقدار معين من المال، ويكون التقدير باجتهاد الحاكم أو المحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7236} والأصل أن كل جناية على ما دون النفس بلا قصاص ولا أرش مقدر ففيها حكومة العدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7236} ومن شروطها ألا يكون للجناية أرش مقدر شرعا، وألا تبلغ الحكومة أرش العضو المقدر، وأن تقوم بعد اندمال الجرح، وأن يحكم بها القاضي أو المحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7239} وفي كيفية تقديرها: يقوم المجني عليه كأنه عبد ويُنظر إلى النقص الذي أحدثته الجناية، وقال غيرهم بإلحاقها بأقرب جناية مقدرة، واستدل له بأثر منقول عن علي في قطع طرف اللسان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7239} وفي مذهب الجمهور أن الجرح الذي يبرأ دون شين لا شيء فيه، وعند المالكية يبقى الخلاف في الموضحة للوجه والرأس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7240} "
  en: "Hukuma is lexically a noun from hakama and means restraining the wrongdoer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} In jurisprudence the hukuma of fairness is the sum fixed by a just assessor for a wound with no prescribed amount, the assessment resting on the judge's or arbiter's reasoning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7236} In principle every injury short of death with no retaliation or fixed compensation carries a hukuma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7236} Its conditions: the injury has no fixed compensation in the law, the hukuma does not exceed the fixed compensation of the organ, the assessment comes after healing, and a judge or arbiter gives it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7239} On the method, the majority value the victim as if a slave and take the loss of value; others liken the wound to the nearest injury with a fixed sum, and cite a narration attributed to Ali for a tongue injury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7239} The Maliki position holds that a wound healed without a scar carries no payment beyond the fixed sum, and the scarred head and face wounds are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7240} "
  ur: "حکومت لغت میں حکم کا مصدر ہے اور اس کا ایک معنی ظالم کو ظلم سے روکنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} فقہ میں حکومتِ عدل وہ واجب ہے جو کسی عادل شخص کے مقرر کردہ ہو، ایسی جنایت میں جس کا کوئی متعین مال نہ ہو؛ اور اس کی تقدیر قاضی یا ثالث کے اجتہاد سے ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7236} اصل یہ ہے کہ قصاص اور مقرر ارش کے بغیر نفس سے کمتر ہر جنایت میں حکومت ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7236} اس کی شرائط یہ ہیں: جنایت کا شرع میں کوئی مقرر ارش نہ ہو، حکومت عضو کے مقرر ارش سے نہ بڑھے، تقدیر زخم کے مندمل ہونے کے بعد ہو، اور قاضی یا ثالث حکم دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7239} تقدیر کے طریقے میں جمہور مجروح کو غلام فرض کر کے قیمت میں ہونے والی کمی دیکھتے ہیں، جبکہ دوسرے اسے قریب ترین مقرر ارش والی جنایت سے ملاتے ہیں اور زبان کے ٹکڑے کے بارے میں حضرت علی سے منقول اثر سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7238} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7239} مالکیہ کے نزدیک جو زخم بغیر داغ کے مندمل ہو اس میں مقرر ارش کے سوا کچھ لازم نہیں، اور چہرے و سر کے موضحہ میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7240} "
