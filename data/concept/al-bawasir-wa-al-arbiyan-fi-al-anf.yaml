id: concept/al-bawasir-wa-al-arbiyan-fi-al-anf
class: concept
kind: scientific
label:
  ar: البواسير والأربيان في الأنف
  en: The piles and the polyps in the nose
  fr: "Excroissances et polypes du nez"
  ur: ناک میں بواسیر اور اربیان
summary:
  ar: البواسير في الأنف لحوم زائدة تنبت فربما كانت رخوة بيضاء لا وجع معها وهي أسهل علاجاً وربما كانت حمراء كمدة شديدة الوجع أصعب علاجاً لا سيما إذا سيل منها صديد منتن، وربما كان منها سرطاني يفسد شكل الأنف ويوجع بتمديده الشديد وهو كمد اللون رديء التكون جداً في غور كثير وسبيله المداراة دون القطع والجرد، ويفرق بين السرطاني والبواسير الرديئة بأن اللحم النابت إن حدث عقيب علل وعدم سيلانات فهو سرطان خصوصاً إن تقدمه في الدماغ أعراض سوداوية وابتداؤه كحمصة أو بندقة ثم يتزايد محدثاً في الأنف صلابة {cite:canon-ibn-sina-print-v2 p.248} {cite:canon-ibn-sina-print-v2 p.249}
  en: 'The piles in the nose are superfluous flesh that grows: sometimes soft white painless flesh — the easiest to treat; sometimes red, dusky and very painful — the hardest, especially if foul pus flows from it; and sometimes a cancerous kind that corrupts the nose''s shape and hurts by its severe stretching — dusky of colour, very ill-formed, deep in the root — whose way is palliation, not cutting and scraping. The cancerous is told from the bad piles in that flesh growing after illness without flows is cancer, especially if melancholic signs preceded in the brain and it began like a chickpea or hazelnut, then grew, working a hardness in the nose {cite:canon-ibn-sina-print-v2 p.248} {cite:canon-ibn-sina-print-v2 p.249}'
  fr: "Les excroissances du nez sont une chair superflue qui se développe : parfois une chair molle, blanche et indolore — la plus facile à traiter ; parfois rouge, sombre et très douloureuse — la plus difficile, surtout si un pus fétide s’en écoule ; parfois une forme cancéreuse qui déforme le nez et fait mal par son fort étirement — de couleur sombre, très mal conformée, profondément enracinée — dont la prise en charge est palliative, et non par incision et raclage. On distingue la forme cancéreuse des mauvaises excroissances en ce qu’une chair qui pousse après une maladie sans écoulements est un cancer, surtout si des signes mélancoliques l’ont précédée dans le cerveau et si elle a commencé comme un pois chiche ou une noisette, puis a grandi en produisant une dureté dans le nez {cite:canon-ibn-sina-print-v2 p.248} {cite:canon-ibn-sina-print-v2 p.249}"
  ur: 'ناک میں بواسیر اضافی گوشت ہے جو اگتا ہے: کبھی نرم سفید بے درد جو علاج میں آسان ترین ہے؛ کبھی سرخ سیاہی مائل نہایت دردناک جو سب سے مشکل ہے خاص طور پر جب اس سے بدبو دار پیپ بہے؛ اور کبھی سرطانی قسم جو ناک کی صورت بگاڑ دیتی ہے اور اپنے سخت تنے ہوئے ہونے سے درد دیتی ہے — رنگ سیاہی مائل، تکوین نہایت بری، جڑ گہری — جس کا طریقہ تسکین ہے نہ کاٹنا و جھاڑنا؛ اور سرطانی اور بری بواسیر میں یہ فرق ہے کہ اگر گوشت امراض کے بعد بغیر بہاؤ کے اگے تو وہ سرطان ہے خصوصاً جب دماغ میں پہلے سوداوی اعراض ہوں اور آغاز چنے یا فندق جتنا ہو پھر بڑھتا جائے اور ناک میں سختی پیدا کرے {cite:canon-ibn-sina-print-v2 p.248} {cite:canon-ibn-sina-print-v2 p.249}'
