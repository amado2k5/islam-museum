summary:
  ar: "جعل الله الليل سكناً والنهار مبصراً وردّهما آية للناس، وفي اختلاف الليل والنهار آيات لأولي الألباب الذين يذكرون الله قياماً وقعوداً وعلى جنوبهم."
  en: "God made the night for rest and the day for sight, each veiling the other — a sign for people; in their alternation are signs for those of understanding who remember Him standing, sitting and on their sides."
  ur: "اللہ نے رات کو آرام اور دن کو دیکھنے کے لیے بنایا ایک دوسرے کے پیچھے — لوگوں کے لیے نشانی؛ ان کے آنے جانے میں اہلِ دانش کے لیے نشانیاں ہیں جو کھڑے بیٹھے اور لیٹے اسے یاد کرتے ہیں۔"
