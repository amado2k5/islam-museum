id: concept/hayat-life
class: concept
kind: legal
label: { ar: "الحياة", en: "Hayat (life and its beginning and end)", ur: "حیات", es: "Hayat (la vida, su principio y su fin)", fr: "Hayat (la vie, son commencement et sa fin)", tr: "Hayatı", id: "Kehidupan" }
summary:
  ar: "الحياة نقيض الموت، وهي قوة مزاجية تقتضي الحس والحركة، وفي حق الله صفة تليق به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} ويفرق المدخل بينها وبين الروح والنفس والاستهلال والموت؛ فالاستهلال رفع الصوت عند الولادة وهو أمارة من أمارات الحياة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} بدأ الحياة الإنسانية الأولى بنفخة الروح في آدم، واتفق الفقهاء على أن الحياة المعتبرة في الذرية تبدأ بنفخ الروح في الجنين، واختلفوا في موعد النفخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} والجمهور أن حياة الجنين قبل نفخ الروح اعتبارية تظهر في الإرث والوصية، وذهب بعضهم إلى أن الحياة تبدأ باستقرار النطفة في الرحم، والحياة الكاملة المعتبرة في الأحكام تبدأ بالولادة حيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} وتنتهي الحياة بنزع الروح، وللموت أمارات منها شخوص البصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433}  وتحفظ الحياة بفعل ما يمسكها والكف عما يهلكها، وحفظ النفوس عند الفقهاء آكد الضروريات بعد الدين، والمضطر يأكل من المحرم بقدر ما يدفع الهلاك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} وحرم الشرع أن يجني الإنسان على حياته، وأن يقتل غيره بغير حق؛ والقتل عمدا وشبه عمد وخطأ، والحياة عند الجناية مستمرة أو مستقرة أو عيش المذبوح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7436} والجناية على حياة الجنين: إن ألقته ميتا ففيه غرة، وإن ألقته حيا ثم مات ففيه الدية كاملة مع الكفارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} والحياة شرط الإرث: يرث الحمل بشرطين، والذين يموتون معا لا يتوارثون عند الجمهور، وإن علم السابق بعينه يوقف الميراث حتى يتبين الأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} والذكاة تشترط لها حياة مستقرة، والسقط إن استهل ثبتت له أحكام الحي من الغسل والصلاة والإرث، واختلف الفقهاء فيه إن لم يستهل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} وتقبل التوبة ما لم يغرغر الإنسان، أي ما لم تبلغ الروح الحلقوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441}"
  en: "Hayat (life) is the opposite of death, a temperament that brings sensation and motion; in God's case it is an attribute that suits Him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} The article separates it from ruh, nafs, istihlal (crying out at birth, a sign of life) and death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} The first human life began with the breath of the spirit into Adam; the jurists agree that the life that counts for the offspring begins when the spirit is breathed into the foetus, but they differ on the date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} The majority hold that the foetus's life before ensoulment is legal, shown in inheritance and bequest; some hold life begins when the drop settles in the womb, and full legal life begins at a live birth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} Life ends with the departure of the spirit, and one sign of death is the fixed gaze. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433}  Life is to be kept by what sustains it and by refraining from what destroys it; the guarding of souls ranks just below religion among the necessities, and the compelled may eat what is forbidden only as far as it saves him from death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} Self-injury is forbidden, and so is killing another without right; killing is wilful, quasi-wilful or by error, and the life harmed is lasting, settled or the dying throes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7436} Harm to a foetus: if the child is born dead there is a ghurra, if born alive and then dies there is a full blood-money with expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} For inheritance, life must be proved: the unborn inherits on two conditions; people who die together do not inherit from each other on the majority view; if one is known to have died first and the order is unclear, the estate is held in suspense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} Slaughter needs settled life; a foetus born crying out is treated as living for washing, prayer and inheritance, and the schools differ when it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} Repentance is accepted until the soul reaches the throat (gharghara). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441}"
  ur: "حیات موت کی ضد ہے، یہ وہ مزاجی قوت ہے جو حس اور حرکت کا تقاضا کرتی ہے؛ اللہ کے حق میں یہ اس کی شان کے لائق صفت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} مدخل اسے روح، نفس، استہلال ⁦(ولادت کے وقت آواز بلند کرنا، زندگی کی علامت)⁩ اور موت سے ممیز کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} پہلے انسان کی حیات آدم میں روح پھونکنے سے شروع ہوئی؛ فقہاء کا اتفاق ہے کہ اولاد میں معتبر حیات جنین میں روح پھونکنے سے شروع ہوتی ہے، البتہ اس کے وقت میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} جمہور کے نزدیک نفخِ روح سے پہلے جنین کی حیات اعتباری ہے جو وراثت اور وصیت میں ظاہر ہوتی ہے؛ بعض کے نزدیک نطفہ رحم میں ٹھہرنے سے حیات شروع ہو جاتی ہے، اور کامل حیات زندہ ولادت سے شروع ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} موت روح نکلنے سے ہوتی ہے، اور اس کی ایک علامت نگاہ کا جم جانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433}  جان کی حفاظت اس کو قائم رکھنے والی چیزوں اور اسے ہلاک کرنے والی چیزوں سے بچنے سے ہوتی ہے؛ فقہاء کے نزدیک دین کے بعد جانوں کی حفاظت سب سے مقدم ضرورت ہے، اور مضطر حرام چیز اتنی ہی کھا سکتا ہے جتنی سے ہلاکت سے بچے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} شریعت نے خود کو ہلاک کرنا اور بغیر حق کسی کو قتل کرنا حرام کیا ہے؛ قتل عمد، شبہ عمد اور خطا میں تقسیم ہے، اور جنایت کے وقت زندگی مستمر، مستقر یا ذبح کیے گئے کی سی حالت میں ہو سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7436} جنین پر جنایت: مردہ گرنے پر غرہ، زندہ گرنے اور پھر مرنے پر پوری دیت اور کفارہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} وراثت کے لیے حیات ثابت ہونی چاہیے: حمل دو شرطوں کے ساتھ وارث ہوتا ہے؛ جو ایک ساتھ مریں وہ جمہور کے نزدیک ایک دوسرے کے وارث نہیں؛ اگر سابق کا تعین معلوم نہ ہو تو ترکہ موقوف رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} ذکاۃ کے لیے مستقر حیات شرط ہے؛ سقط اگر چیخ کر پیدا ہو تو غسل، نماز اور وراثت کے احکام ثابت ہوتے ہیں، اور نہ چیخنے کی صورت میں فقہاء میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} توبہ اس وقت تک قبول ہے جب تک روح حلق تک نہ پہنچے ⁦(غرغرہ)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441}"
  es: "Hayat (vida) es lo opuesto a la muerte, un temperamento que trae sensación y movimiento; en el caso de Dios es un atributo que le conviene. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} El artículo lo separa de ruh, nafs, istihlal (el llanto al nacer, un signo de vida) y la muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} La primera vida humana comenzó con el aliento del espíritu en Adán; los juristas concuerdan en que la vida que cuenta para la descendencia comienza cuando el espíritu es insuflado en el feto, pero difieren en la fecha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} La mayoría sostiene que la vida del feto antes de la infusión del alma es legal, mostrada en herencia y legado; Algunos sostienen que la vida comienza cuando la gota se asienta en el útero, y la vida legal completa comienza con un nacimiento vivo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} La vida termina con la partida del espíritu, y una señal de la muerte es la mirada fija. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} La vida debe mantenerse mediante lo que la sustenta y absteniéndose de lo que la destruye; la protección de las almas se sitúa justo por debajo de la religión entre las necesidades, y el obligado puede comer lo prohibido solo en la medida en que lo salve de la muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} La autolesión está prohibida, al igual que matar a otro sin derecho; matar es intencional, casi intencional o por error, y la vida dañada es duradera, establecida o en la agonía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7436} Daño a un feto: si el niño nace muerto hay un ghurra, si nace vivo y luego muere hay una compensación por sangre completa con expiación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} Para la herencia, debe probarse la vida: el no nacido hereda bajo dos condiciones; las personas que mueren juntas no heredan entre sí según la opinión mayoritaria; si se sabe que uno murió primero y el orden no está claro, la herencia se mantiene en suspenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} La matanza requiere una vida establecida; un feto que nace llorando se considera vivo para el lavado, la oración y la herencia, y las escuelas difieren cuando no lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} Se acepta el arrepentimiento hasta que el alma llega a la garganta (gharghara). {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441}"
  fr: "La Hayat (vie) est l'opposé de la mort, un tempérament qui apporte sensation et mouvement; chez Dieu, c'est un attribut qui Lui sied parfaitement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} Cet article la distingue du ruh, du nafs, de l'istihlal (cri à la naissance, signe de vie) et de la mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} La première vie humaine a commencé avec le souffle de l'esprit en Adam; les juristes s'accordent à dire que la vie qui compte pour la descendance commence lorsque l'esprit est insufflé dans le fœtus, mais ils divergent quant à la date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} La majorité considère que la vie du fœtus avant l'animation est légale, attestée par l'héritage et les legs. D'aucuns considèrent que la vie commence dès que la goutte de sperme se dépose dans le ventre de la mère, et que la vie légale et pleine débute à la naissance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} La vie s'achève avec le départ de l'esprit, et le regard fixe est un signe de mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} Il faut préserver sa vie en s'aidant de ce qui la soutient et en s'abstenant de ce qui la détruit; le salut des âmes est une nécessité presque aussi importante que la religion, et celui qui y est contraint ne peut consommer ce qui est interdit que dans la mesure où cela le sauve de la mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} L'automutilation est interdite, de même que le fait de tuer autrui sans raison valable; le meurtre est volontaire, quasi volontaire ou accidentel, et la vie affectée est permanente, stable ou en phase terminale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7436} Atteinte à un fœtus: si l'enfant naît mort-né, il y a une peine de ghurra; s'il naît vivant et décède ensuite, il y a une amende complète pour le sang avec expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} Pour l'héritage, la vie doit être prouvée: l'enfant à naître hérite sous deux conditions; les personnes décédées simultanément n'héritent pas l'une de l'autre selon l'avis majoritaire; si l'on sait que l'une des personnes est décédée en premier et que l'ordre est incertain, la succession est suspendue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} L'abattage nécessite une vie établie; un fœtus qui naît en criant est considéré comme vivant pour les ablutions, la prière et l'héritage, et les écoles divergent lorsqu'il ne l'est pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} La repentance est acceptée jusqu'à ce que l'âme atteigne la gorge (gharghara). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441}"
  tr: "Hayat ölümün tam tersidir; duygu ve hareket gerektiren huysuz bir güçtür ve Tanrı'nın kendisine yakışır bir özelliği vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7431} Giriş onu ruhtan, ruhtan, inisiyasyondan ve ölümden ayırır; başlatma, doğumda sesi yükseltmektir ve bu yaşamın bir işaretidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7431} En erken insan yaşamı, ruhun Adem'e nefesiyle başlamış ve hukukçular, çocuklarda düşünülen yaşamın ruhun fetüse nefesinden başladığı konusunda hemfikirdir, ancak nefes zamanlaması konusunda farklı görüşteydiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7432} Çoğunluk, ruhun ruha üflenmeden önceki fetüsün yaşamının miras ve vasiyette görünen olarak kabul edildiğini savunur. Bazıları hayatın rahimdeki spermin stabilitesiyle başladığını, kararlarda ise tam yaşamın canlı doğumla başladığını savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7433} Hayat ruhun alınmasıyla sona erer ve ölümün işaretleri vardır, görme kişilikleri de dahil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7433} Hayat, onu tutan şeyi yaparak ve onu yok edenlerden kaçınarak korunur. Hukukçulara göre yaşamları korumak dinden sonra en vazgeçilmezdir ve zorunlu olan kişi, yalnızca yıkımdan kaçınabildiği ölçüde yasak (yasak) olanı yemelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7435} Şeriat, bir kişinin hayatı için öldürmeyi veya başkalarını haksız yere öldürmeyi yasaklardı; kasıtlı, yarı-kasıtlı ve kazara öldürmeleri, suç durumunda yaşam ise sürekli veya istikrarlı ya da katledilen kişinin hayatını içerir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7436} Ve fetüsün hayatına karşı suç: onu öldürürseniz ghara sayılır; canlı atıp sonra ölürseniz, kan parası ve kefaret doludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7438} Hayat miras için bir koşuldur: fetus iki şartla miras alır ve birlikte ölenler çoğunluğa göre miras almaz, ancak önceki bilgi selef tarafından bilinir, ta ki mesele netleşene kadar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7439} Zekat istikrarlı bir yaşam gerektirir ve başlanırsa, canlıların hükümleri olan gusl, namaz ve miras belirlenir. Hukukçular, zekatın başlatılmadığı konusunda farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7440} tövbe, kişi guruldamadığı sürece, yani ruh boğaza ulaşana kadar kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7441}"
  id: "Kehidupan adalah kebalikan dari kematian; ini adalah kekuatan temperamental yang membutuhkan sensasi dan gerakan, dan Tuhan memiliki atribut yang pantas bagi-Nya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7431} Pendahuluan membedakannya dari jiwa, jiwa, inisiasi, dan kematian; inisiasi adalah mengangkat suara saat lahir, yang merupakan tanda kehidupan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7431} Kehidupan manusia paling awal dimulai dengan nafas jiwa ke dalam Adam, dan para ahli hukum sepakat bahwa kehidupan yang dipertimbangkan pada keturunan dimulai dengan napas jiwa ke janin, meskipun mereka berbeda waktu bernapas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7432} Mayoritas berpendapat bahwa kehidupan janin sebelum jiwa dihembuskan ke dalam jiwa dianggap muncul dalam warisan dan kehendak. Beberapa berpendapat bahwa kehidupan dimulai dengan stabilitas sperma di dalam rahim, dan kehidupan lengkap yang dianggap dalam aturan dimulai dengan kelahiran hidup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7432} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7433} Kehidupan berakhir dengan jiwa diambil, dan kematian memiliki tanda-tanda, termasuk kepribadian penglihatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7433} Kehidupan dijaga dengan melakukan apa yang menahan diri dan menahan diri dari apa yang menghancurkannya. Menjaga nyawa menurut ahli hukum adalah hal yang paling penting setelah agama, dan orang yang dipaksa hanya boleh makan dari yang terlarang (terlarang) sejauh ia dapat menghindari kehancuran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7435} Syariah melarang membunuh seseorang demi nyawa atau membunuh orang lain secara tidak adil; pembunuhan sengaja, semi-sengaja, dan tidak sengaja, sementara kehidupan dalam kasus kejahatan bersifat berkelanjutan atau stabil atau nyawa orang yang disembelih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7436} Dan kejahatan terhadap nyawa janin: jika dibuang mati, itu dianggap ghara; jika dibuang hidup-hidup lalu mati, uang darahnya penuh beserta penebusan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7438} Hidup adalah syarat untuk warisan: janin mewarisi dengan dua syarat, dan yang meninggal bersama tidak mewarisi menurut mayoritas, meskipun pengetahuan sebelumnya diketahui oleh pendahulu sampai masalahnya dijelaskan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7439} Zakat membutuhkan kehidupan yang stabil, dan jika dimulai, aturan orang hidup seperti ghusl, doa, dan warisan akan ditetapkan. Para ahli hukum berbeda pendapat apakah itu belum diinisiasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7440} Taubat diterima selama orang itu tidak bergurgling, yaitu sampai jiwa mencapai tenggorokan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-noor-v3 hlm.7441}"
