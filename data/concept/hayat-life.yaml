label: { ar: "الحياة", en: "Hayat (life and its beginning and end)", ur: "حیات" }
summary:
  ar: "الحياة نقيض الموت، وهي قوة مزاجية تقتضي الحس والحركة، وفي حق الله صفة تليق به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} ويفرق المدخل بينها وبين الروح والنفس والاستهلال والموت؛ فالاستهلال رفع الصوت عند الولادة وهو أمارة من أمارات الحياة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} بدأ الحياة الإنسانية الأولى بنفخة الروح في آدم، واتفق الفقهاء على أن الحياة المعتبرة في الذرية تبدأ بنفخ الروح في الجنين، واختلفوا في موعد النفخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} والجمهور أن حياة الجنين قبل نفخ الروح اعتبارية تظهر في الإرث والوصية، وذهب بعضهم إلى أن الحياة تبدأ باستقرار النطفة في الرحم، والحياة الكاملة المعتبرة في الأحكام تبدأ بالولادة حيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} وتنتهي الحياة بنزع الروح، وللموت أمارات منها شخوص البصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433}  وتحفظ الحياة بفعل ما يمسكها والكف عما يهلكها، وحفظ النفوس عند الفقهاء آكد الضروريات بعد الدين، والمضطر يأكل من المحرم بقدر ما يدفع الهلاك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} وحرم الشرع أن يجني الإنسان على حياته، وأن يقتل غيره بغير حق؛ والقتل عمدا وشبه عمد وخطأ، والحياة عند الجناية مستمرة أو مستقرة أو عيش المذبوح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7436} والجناية على حياة الجنين: إن ألقته ميتا ففيه غرة، وإن ألقته حيا ثم مات ففيه الدية كاملة مع الكفارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} والحياة شرط الإرث: يرث الحمل بشرطين، والذين يموتون معا لا يتوارثون عند الجمهور، وإن علم السابق بعينه يوقف الميراث حتى يتبين الأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} والذكاة تشترط لها حياة مستقرة، والسقط إن استهل ثبتت له أحكام الحي من الغسل والصلاة والإرث، واختلف الفقهاء فيه إن لم يستهل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} وتقبل التوبة ما لم يغرغر الإنسان، أي ما لم تبلغ الروح الحلقوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441}"
  en: "Hayat (life) is the opposite of death, a temperament that brings sensation and motion; in God's case it is an attribute that suits Him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} The article separates it from ruh, nafs, istihlal (crying out at birth, a sign of life) and death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} The first human life began with the breath of the spirit into Adam; the jurists agree that the life that counts for the offspring begins when the spirit is breathed into the foetus, but they differ on the date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} The majority hold that the foetus's life before ensoulment is legal, shown in inheritance and bequest; some hold life begins when the drop settles in the womb, and full legal life begins at a live birth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} Life ends with the departure of the spirit, and one sign of death is the fixed gaze. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433}  Life is to be kept by what sustains it and by refraining from what destroys it; the guarding of souls ranks just below religion among the necessities, and the compelled may eat what is forbidden only as far as it saves him from death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} Self-injury is forbidden, and so is killing another without right; killing is wilful, quasi-wilful or by error, and the life harmed is lasting, settled or the dying throes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7436} Harm to a foetus: if the child is born dead there is a ghurra, if born alive and then dies there is a full blood-money with expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} For inheritance, life must be proved: the unborn inherits on two conditions; people who die together do not inherit from each other on the majority view; if one is known to have died first and the order is unclear, the estate is held in suspense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} Slaughter needs settled life; a foetus born crying out is treated as living for washing, prayer and inheritance, and the schools differ when it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} Repentance is accepted until the soul reaches the throat (gharghara). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441}"
  ur: "حیات موت کی ضد ہے، یہ وہ مزاجی قوت ہے جو حس اور حرکت کا تقاضا کرتی ہے؛ اللہ کے حق میں یہ اس کی شان کے لائق صفت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} مدخل اسے روح، نفس، استہلال (ولادت کے وقت آواز بلند کرنا، زندگی کی علامت) اور موت سے ممیز کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} پہلے انسان کی حیات آدم میں روح پھونکنے سے شروع ہوئی؛ فقہاء کا اتفاق ہے کہ اولاد میں معتبر حیات جنین میں روح پھونکنے سے شروع ہوتی ہے، البتہ اس کے وقت میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} جمہور کے نزدیک نفخِ روح سے پہلے جنین کی حیات اعتباری ہے جو وراثت اور وصیت میں ظاہر ہوتی ہے؛ بعض کے نزدیک نطفہ رحم میں ٹھہرنے سے حیات شروع ہو جاتی ہے، اور کامل حیات زندہ ولادت سے شروع ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} موت روح نکلنے سے ہوتی ہے، اور اس کی ایک علامت نگاہ کا جم جانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433}  جان کی حفاظت اس کو قائم رکھنے والی چیزوں اور اسے ہلاک کرنے والی چیزوں سے بچنے سے ہوتی ہے؛ فقہاء کے نزدیک دین کے بعد جانوں کی حفاظت سب سے مقدم ضرورت ہے، اور مضطر حرام چیز اتنی ہی کھا سکتا ہے جتنی سے ہلاکت سے بچے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} شریعت نے خود کو ہلاک کرنا اور بغیر حق کسی کو قتل کرنا حرام کیا ہے؛ قتل عمد، شبہ عمد اور خطا میں تقسیم ہے، اور جنایت کے وقت زندگی مستمر، مستقر یا ذبح کیے گئے کی سی حالت میں ہو سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7435} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7436} جنین پر جنایت: مردہ گرنے پر غرہ، زندہ گرنے اور پھر مرنے پر پوری دیت اور کفارہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7437} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} وراثت کے لیے حیات ثابت ہونی چاہیے: حمل دو شرطوں کے ساتھ وارث ہوتا ہے؛ جو ایک ساتھ مریں وہ جمہور کے نزدیک ایک دوسرے کے وارث نہیں؛ اگر سابق کا تعین معلوم نہ ہو تو ترکہ موقوف رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} ذکاۃ کے لیے مستقر حیات شرط ہے؛ سقط اگر چیخ کر پیدا ہو تو غسل، نماز اور وراثت کے احکام ثابت ہوتے ہیں، اور نہ چیخنے کی صورت میں فقہاء میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7439} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} توبہ اس وقت تک قبول ہے جب تک روح حلق تک نہ پہنچے (غرغرہ)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7441}"
