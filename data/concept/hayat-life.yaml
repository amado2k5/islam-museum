label: { ar: "الحياة", en: "Hayat (life and its beginning and end)", ur: "حیات" }
summary:
  ar: "الحياة نقيض الموت، وهي قوة مزاجية تقتضي الحس والحركة، وفي حق الله صفة تليق به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} ويفرق المدخل بينها وبين الروح والنفس والاستهلال والموت؛ فالاستهلال رفع الصوت عند الولادة وهو أمارة من أمارات الحياة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} بدأ الحياة الإنسانية الأولى بنفخة الروح في آدم، واتفق الفقهاء على أن الحياة المعتبرة في الذرية تبدأ بنفخ الروح في الجنين، واختلفوا في موعد النفخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} والجمهور أن حياة الجنين قبل نفخ الروح اعتبارية تظهر في الإرث والوصية، وذهب بعضهم إلى أن الحياة تبدأ باستقرار النطفة في الرحم، والحياة الكاملة المعتبرة في الأحكام تبدأ بالولادة حيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} وتنتهي الحياة بنزع الروح، وللموت أمارات منها شخوص البصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} "
  en: "Hayat (life) is the opposite of death, a temperament that brings sensation and motion; in God's case it is an attribute that suits Him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} The article separates it from ruh, nafs, istihlal (crying out at birth, a sign of life) and death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} The first human life began with the breath of the spirit into Adam; the jurists agree that the life that counts for the offspring begins when the spirit is breathed into the foetus, but they differ on the date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} The majority hold that the foetus's life before ensoulment is legal, shown in inheritance and bequest; some hold life begins when the drop settles in the womb, and full legal life begins at a live birth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} Life ends with the departure of the spirit, and one sign of death is the fixed gaze. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} "
  ur: "حیات موت کی ضد ہے، یہ وہ مزاجی قوت ہے جو حس اور حرکت کا تقاضا کرتی ہے؛ اللہ کے حق میں یہ اس کی شان کے لائق صفت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} مدخل اسے روح، نفس، استہلال (ولادت کے وقت آواز بلند کرنا، زندگی کی علامت) اور موت سے ممیز کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431} پہلے انسان کی حیات آدم میں روح پھونکنے سے شروع ہوئی؛ فقہاء کا اتفاق ہے کہ اولاد میں معتبر حیات جنین میں روح پھونکنے سے شروع ہوتی ہے، البتہ اس کے وقت میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} جمہور کے نزدیک نفخِ روح سے پہلے جنین کی حیات اعتباری ہے جو وراثت اور وصیت میں ظاہر ہوتی ہے؛ بعض کے نزدیک نطفہ رحم میں ٹھہرنے سے حیات شروع ہو جاتی ہے، اور کامل حیات زندہ ولادت سے شروع ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} موت روح نکلنے سے ہوتی ہے، اور اس کی ایک علامت نگاہ کا جم جانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7433} "
