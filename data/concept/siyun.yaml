label:
  ar: "سيون"
  en: "Siyun (the water plant the book names siyun)"
  ur: "سیون"
  es: "Siyun (la planta acuática que el libro llama siyun)"
  fr: "Siyun (la plante aquatique que le livre nomme siyun)"
  tr: "Sion"
  id: "Sion"
summary:
  ar: "السيون في الكتاب هو قرة العين يكون في المياه القائمة وفيه عطرية، وقد ذكر في باب القاف، وهو مطبوخاً وغير مطبوخ ينفع من الحصاة ويدر وينفع من الدوسنطاريا {cite:canon-ibn-sina-print-v1 p.596}."
  en: "Siyun is in the book the qurrat al-ayn, found in standing waters and having an aromatic quality, already mentioned in the chapter of qaf; cooked or uncooked the book lists it for stone and the flow of urine, and for dysentery {cite:canon-ibn-sina-print-v1 p.596}."
  ur: "سیون کتاب میں قرۃ العین ہے جو ٹھہرے ہوئے پانیوں میں ہوتا ہے اور اس میں خوشبو کا جز ہے، اور قاف کے باب میں ذکر ہو چکا؛ پکا ہوا ہو یا نہ ہو، کتاب اسے پتھری، پیشاب کے اخراج اور پیچش کے لیے گنواتی ہے {cite:canon-ibn-sina-print-v1 p.596}۔"
  es: "Siyun es en el libro qurrat al-ayn, que se encuentra en aguas estancadas y tiene una cualidad aromática, ya mencionada en el capítulo de qaf; cocido o crudo, el libro lo enumera para cálculos y flujo de orina, y para disentería {cite:canon-ibn-sina-print-v1 p.596}."
  fr: "Le siyun est mentionné dans le livre qurrat al-ayn, trouvé dans les eaux stagnantes et ayant une qualité aromatique, déjà mentionné dans le chapitre de qaf; cuit ou non cuit, le livre le mentionne pour les calculs et le flux urinaire, et pour la dysenterie {cite:canon-ibn-sina-print-v1 p.596}."
  tr: "Kitapta 'sion', durgun suda bulunan göz elmasıdır ve aromatik özelliklere sahiptir. 'Kaf' bölümünde, hem pişmiş hem de pişmemiş olarak belirtilir. Çakıl taşlarından faydalıdır, seyreltilmiş ve dizanteri için faydalıdır. {kaynak:kanon-ibn-sina-print-v1 s.596}."
  id: "Dalam buku ini, 'sion' adalah buah mata yang ditemukan di air tergenang dan memiliki sifat aromatik. Ia disebutkan dalam bab tentang 'Qaf', baik yang dimasak maupun yang belum dimasak. Buah ini bermanfaat dari kerikil, diencerkan, dan bermanfaat dari disentri. {cite:canon-ibn-sina-print-v1 hlm.596}."
