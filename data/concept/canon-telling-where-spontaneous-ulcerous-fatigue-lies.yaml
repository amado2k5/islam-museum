id: concept/canon-telling-where-spontaneous-ulcerous-fatigue-lies
class: concept
kind: scientific
label: { ar: "معرفة موضع الإعياء القروحي الحادث بنفسه عند ابن سينا", en: "Telling where spontaneous ulcerous fatigue lies in the Canon", ur: "خود پیدا ہونے والی قروحی تھکن کی جگہ کی پہچان قانون میں", es: "Indicando dónde se ubica la fatiga ulcerosa espontánea en el canon", fr: "Indiquer où se situe la fatigue ulcéreuse spontanée dans le Canon", tr: "İbn Sina'ya göre kendisinin ortaya çıkan ülser yorgunluğunun yerini belirlemek", id: "Mengidentifikasi lokasi kelelahan tukak yang terjadi sendiri menurut Avicenna" }
summary:
  ar: "يفتتح ابن سينا الفصل السادس عشر في علاج الإعياء الحادث بنفسه بأن يتعرف في القروحي هل الخلط الموجب له داخل العروق أو خارجها، من نتن البول وأحوال الأغذية السالفة وعادته في توليد الفضول وصفاء شرابه أو كدره، ويعالج الخارجي برياضة الاسترداد والآخر بالسكون والتجويع والمسح بالدهن والإحمام {cite:canon-ibn-sina-print-v1 p.247}."
  en: "Ibn Sina opens the sixteenth chapter, on spontaneous fatigue, by saying that for the ulcerous kind one must learn whether the humour that causes it is inside the vessels or outside, from the stench of the urine, the foods of the past days, his habit in generating superfluities and the clarity or turbidity of his drink; the outside kind is treated with restorative exercise, the other with rest, hunger, oiling and bathing {cite:canon-ibn-sina-print-v1 p.247}."
  es: "Ibn Sina abre el capítulo dieciséis, sobre la fatiga espontánea, diciendo que para el tipo ulceroso hay que averiguar si el humor que lo causa está dentro o fuera de los vasos, por el hedor de la orina, los alimentos de los días anteriores, su hábito de generar superfluidades y la claridad o turbidez de su bebida; el tipo externo se trata con ejercicios restaurativos, el otro con descanso, ayuno, ungüentos y baños {cite:canon-ibn-sina-print-v1 p.247}."
  fr: "Ibn Sina ouvre le seizième chapitre, sur la fatigue spontanée, en disant que pour la fatigue ulcéreuse, il faut apprendre si l'humeur qui la provoque est à l'intérieur ou à l'extérieur des vaisseaux, à partir de la puanteur de l'urine, des aliments des jours précédents, de son habitude de générer des excès et de la clarté ou de la turbidité de sa boisson; la fatigue extérieure est traitée par des exercices réparateurs, l'autre par le repos, la faim, l'application d'huile et le bain {cite:canon-ibn-sina-print-v1 p.247}."
  ur: "ابن سینا نے سولہویں باب کا آغاز بے ساختہ تھکاوٹ کے بارے میں یہ کہتے ہوئے کیا ہے کہ السر قسم کے آدمی کو یہ سیکھنا چاہیے کہ اس کا سبب بننے والا مزاح برتنوں کے اندر ہے یا باہر، پیشاب کی بدبو، پچھلے دنوں کے کھانے، اس کی ضرورت سے زیادہ چیزیں پیدا کرنے کی عادت اور اس کے پینے کی شفافیت یا گندگی؛ بیرونی قسم کا علاج بحالی ورزش کے ساتھ کیا جاتا ہے، دوسرے کا آرام، بھوک، تیل لگانے اور نہانے کے ساتھ۔"
  tr: "İbn Sina, kendi başına oluşan yorgunluğu tedavi etmek üzerine on altıncı bölümü ülserlerde damarların içinde mi yoksa dışında mı karışmanın kötü idrar, bahsedilen yiyeceklerin durumu ve merak ile içkinin berraklığı ya da donukluk yaratma alışkanlığı olduğunu belirleyerek açar. Dışını restorasyon uygulamasıyla, diğerini ise sessizlik, açlık, yağ ile silme ve yıkanma ile ele alır {cite:canon-ibn-sina-print-v1 s.247}."
  id: "Ibn Sina membuka bab keenam belas tentang pengobatan kelelahan yang terjadi pada dirinya sendiri dengan mengidentifikasi pada borok apakah pencampuran yang dihasilkan di dalam atau luar pembuluh darah adalah urin yang busuk, kondisi makanan yang disebutkan sebelumnya, dan kebiasaannya menimbulkan rasa ingin tahu serta kejernihan minumannya atau kebosanan. Ia menangani bagian luar dengan latihan pemulihan, dan yang lain dengan keheningan, kelaparan, serta mengelap dengan minyak dan mandi {cite:canon-ibn-sina-print-v1 hlm.247}."
