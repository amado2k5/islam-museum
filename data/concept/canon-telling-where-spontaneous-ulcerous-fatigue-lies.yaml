label: { ar: "معرفة موضع الإعياء القروحي الحادث بنفسه عند ابن سينا", en: "Telling where spontaneous ulcerous fatigue lies in the Canon", ur: "خود پیدا ہونے والی قروحی تھکن کی جگہ کی پہچان قانون میں" }
summary:
  ar: "يفتتح ابن سينا الفصل السادس عشر في علاج الإعياء الحادث بنفسه بأن يتعرف في القروحي هل الخلط الموجب له داخل العروق أو خارجها، من نتن البول وأحوال الأغذية السالفة وعادته في توليد الفضول وصفاء شرابه أو كدره، ويعالج الخارجي برياضة الاسترداد والآخر بالسكون والتجويع والمسح بالدهن والإحمام {cite:canon-ibn-sina-print-v1 p.247}."
  en: "Ibn Sina opens the sixteenth chapter, on spontaneous fatigue, by saying that for the ulcerous kind one must learn whether the humour that causes it is inside the vessels or outside, from the stench of the urine, the foods of the past days, his habit in generating superfluities and the clarity or turbidity of his drink; the outside kind is treated with restorative exercise, the other with rest, hunger, oiling and bathing {cite:canon-ibn-sina-print-v1 p.247}."
