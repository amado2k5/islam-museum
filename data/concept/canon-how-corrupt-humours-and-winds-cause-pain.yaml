summary:
  ar: "في الفصلين الخامس والسادس والعشرين يقول ابن سينا إن الأخلاط الرديئة توجع بكيفيتها كاللذع أو بكثرتها كالتمديد أو بالأمرين معاً، وإن الريح تؤلم بالتمديد في تجاويف الأعضاء أو طبقاتها أو حول العضل {cite:canon-ibn-sina-print-v1 p.151}."
  en: "In chapters 25 and 26 Ibn Sina says corrupt humours hurt by their quality, as they irritate, by their quantity, as they stretch, or by both, and that wind hurts by stretching, whether in the cavities of organs, in their layers, or around muscles {cite:canon-ibn-sina-print-v1 p.151}."
