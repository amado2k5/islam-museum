id: concept/canon-how-corrupt-humours-and-winds-cause-pain
class: concept
kind: scientific
label:
  ar: "كيفية إيلام الأخلاط الرديئة والرياح عند ابن سينا"
  en: "How corrupt humours and winds cause pain in the Canon"
  fr: "Douleur par humeurs corrompues et vents dans le Canon"
  ur: "بگڑی ہوئی اخلاط اور ہواؤں سے درد کیسے ہوتا ہے، قانون کے مطابق"
  es: "Cómo los humores y vientos corruptos causan dolor en el Canon"
  tr: "İbn Sina'ya göre kötü humorları ve rüzgarları nasıl incitilir"
  id: "Cara Menyakiti Humor Buruk dan Angin Menurut Ibn Sina"
summary:
  ar: "في الفصلين الخامس والسادس والعشرين يقول ابن سينا إن الأخلاط الرديئة توجع بكيفيتها كاللذع أو بكثرتها كالتمديد أو بالأمرين معاً، وإن الريح تؤلم بالتمديد في تجاويف الأعضاء أو طبقاتها أو حول العضل {cite:canon-ibn-sina-print-v1 p.151}."
  en: "In chapters 25 and 26 Ibn Sina says corrupt humours hurt by their quality, as they irritate, by their quantity, as they stretch, or by both, and that wind hurts by stretching, whether in the cavities of organs, in their layers, or around muscles {cite:canon-ibn-sina-print-v1 p.151}."
  fr: "Aux chapitres 25 et 26, Ibn Sina attribue la douleur humorale à qualité irritante, quantité distendante ou aux deux ; les vents distendraient cavités, couches organiques ou pourtours musculaires {cite:canon-ibn-sina-print-v1 p.151}."
  es: "En los capítulos 25 y 26, Ibn Sina dice que los humores corruptos duelen por su calidad, ya que irritan, por su cantidad, ya que estiran, o por ambas cosas, y que el viento duele al estirar, ya sea en las cavidades de los órganos, en sus capas o alrededor de los músculos {cite:canon-ibn-sina-print-v1 p.151}."
  ur: "ابن سینا ابواب 25 اور 26 میں کہتا ہے کہ بدعنوان مزاح کو ان کے معیار سے نقصان پہنچتا ہے، جیسے وہ چڑچڑاپن کرتے ہیں، ان کی مقدار سے، جب وہ کھینچتے ہیں، یا دونوں سے، اور یہ ہوا کھینچنے سے تکلیف دیتی ہے، خواہ اعضاء کی گہاوں میں ہو، ان کی تہوں میں، یا پٹھوں کے آس پاس۔"
  tr: "Beşinci ve yirmi altıncı bölümlerde İbn Sina, kötü humorların doğası gereği acı verici olduğunu, örneğin sokma gibi, ya da bol miktarda esneme gibi olduğunu, ya da her ikisi birden olduğunu ve rüzgarın organ boşluklarında veya katmanlarında ya da kas çevresinde gerildiğinde acı verdiğini {cite:canon-ibn-sina-print-v1 s.151} söyler."
  id: "Dalam bab lima dan dua puluh enam, Ibn Sina mengatakan bahwa humor buruk itu menyakitkan secara alami, seperti sengat, atau melimpah seperti peregangan, atau keduanya, dan angin terasa sakit ketika meregang di rongga atau lapisan organ atau sekitar otot {cite:canon-ibn-sina-print-v1 hlm.151}."
