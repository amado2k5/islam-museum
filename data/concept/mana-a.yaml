label: { ar: "المَنَعَة", en: "Strength or protection (mana'a) and its bearing on rebellion and banditry", ur: "منعہ ⁦(قوت، حفاظت)⁩", es: "Fuerza o protección (mana'a) y su relación con la rebelión y el bandidaje.", fr: "Force ou protection (mana'a) et son influence sur la rébellion et le banditisme" }
summary:
  ar: "المنعة في اللغة العز والقوة، يقال: هو في منعة أي معه من يمنعه من عشيرته. ومن أحكامها أن الفقهاء يشترطون أن يكون للبغاة والمحاربين منعة لتحقق وصف البغي والحرابة، وأنه إذا استعان البغاة بالمستأمنين وكانت لهم منعة لم ينتقض عهدهم."
  en: "Mana'a in the lexicon is power and strength, such as having kinsmen to defend one. The jurists require that rebels and bandits have such strength for the offence to count as rebellion (baghy) or brigandage (hiraba). If rebels, having that strength, are aided by protected visitors, the visitors' pact is not broken."
  ur: "منعہ کے لغوی معنی قوت اور عزت کے ہیں۔ فقہاء کے نزدیک بغاوت اور حرابہ میں باغیوں اور ڈاکوؤں کے پاس قوت کا ہونا شرط ہے، اور جب باغی قوت کے ساتھ امان والوں سے مدد لیں تو امان والوں کا عہد نہیں ٹوٹتا۔"
  es: "En el léxico, maná significa poder y fuerza, como tener parientes que te defiendan. Los juristas exigen que los rebeldes y bandidos posean dicha fuerza para que el delito se considere rebelión (baghy) o bandidaje (hiraba). Si los rebeldes, al tener esa fuerza, reciben ayuda de visitantes protegidos, el pacto de los visitantes no se rompe."
  fr: "Le terme « mana'a » désigne le pouvoir et la force, comme le fait d'avoir des proches pour se défendre. Les juristes exigent que les rebelles et les bandits possèdent cette force pour que leur acte soit qualifié de rébellion (baghy) ou de brigandage (hiraba). Si des rebelles, disposant de cette force, sont aidés par des visiteurs protégés, le pacte conclu avec ces derniers n'est pas rompu."
