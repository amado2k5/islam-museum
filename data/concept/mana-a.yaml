summary:
  ar: "المنعة في اللغة العز والقوة، يقال: هو في منعة أي معه من يمنعه من عشيرته. ومن أحكامها أن الفقهاء يشترطون أن يكون للبغاة والمحاربين منعة لتحقق وصف البغي والحرابة، وأنه إذا استعان البغاة بالمستأمنين وكانت لهم منعة لم ينتقض عهدهم."
  en: "Mana'a in the lexicon is power and strength, such as having kinsmen to defend one. The jurists require that rebels and bandits have such strength for the offence to count as rebellion (baghy) or brigandage (hiraba). If rebels, having that strength, are aided by protected visitors, the visitors' pact is not broken."
  ur: "منعہ کے لغوی معنی قوت اور عزت کے ہیں۔ فقہاء کے نزدیک بغاوت اور حرابہ میں باغیوں اور ڈاکوؤں کے پاس قوت کا ہونا شرط ہے، اور جب باغی قوت کے ساتھ امان والوں سے مدد لیں تو امان والوں کا عہد نہیں ٹوٹتا۔"
