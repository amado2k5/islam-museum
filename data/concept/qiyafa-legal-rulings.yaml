label:
  ar: "قيافة (الأحكام الفقهية)"
  en: "Qiyafa (legal rulings)"
  ur: "قیافہ (فقہی احکام)"
summary:
  ar: "القيافة في الفقه معرفة النسب أو تتبع الأثر بالنظر إلى هيئة الأعضاء والشبه، ويقسمها أهل العلم إلى قيافة الأثر وقيافة البشر. أجاز المالكية والشافعية والحنابلة الاعتماد عليها في إثبات النسب عند التنازع وعدم الدليل الأقوى، ومنع الحنفية ذلك لأن الشرع حصر النسب في الفراش. ويشترط عند القائلين بها الخبرة والعدالة والإسلام والذكورة والحرية ونحوها، ويُرجع إليها كذلك في الأموال والجنايات قرينةً أو شهادةً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13115}"
  en: "In the jurists' usage, qiyafa is the reading of likeness, either of footprints or of a person's bodily features, to establish kinship or trace an act. The Malikis, Shafi'is and Hanbalis allow relying on it to settle a disputed lineage when no stronger proof exists, while the Hanafis reject it because the law confines lineage to the marriage bed (firash). Those who accept it require a qa'if with experience, probity, Islam, and, for the Shafi'is, male and free status. It is also used in property and crime cases as evidence or a clue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13113} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13115}"
  ur: "فقہ میں قیافہ کسی شخص کے اعضاء کی ہیئت و مشابہت یا نشانِ قدم دیکھ کر نسب یا سراغ کا تعین کرنا ہے۔ مالکیہ، شافعیہ اور حنابلہ نزاع میں اور قوی دلیل نہ ہونے کی صورت میں اس سے نسب ثابت کرنے کے قائل ہیں، جبکہ حنفیہ اسے نہیں مانتے کیونکہ شریعت نے نسب کو فراش تک محدود کیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13113}"
