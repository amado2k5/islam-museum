summary:
  ar: "قمر قريش في الكتاب، نقلا عن ديسقوريدوس، يسميه بعض الناس فنطونداس وهو ثمرة التنوب في غلف تسمى الصنوبر، قوته قابضة مسخنة إسخانا يسيرا، وينفع من السعال ومن وجع الصدر، وبه يختم الكتاب حرف القاف {cite:canon-ibn-sina-print-v1 p.661}"
  en: "Qamar quraysh is in the book, on the authority of Dioscorides, called by some fantundas, the fruit of tannub, in pods that are called sanawbar; its power is astringent and mildly heating, it benefits cough and pain of the chest, and with it the book closes the letter qaf {cite:canon-ibn-sina-print-v1 p.661}"
  ur: "قمر قریش کتاب میں، دیسقوریدوس کے حوالے سے، بعض لوگ اسے فنطونداس کہتے ہیں، یہ تنوب کا پھل ہے جو غلافوں میں ہوتا ہے جنہیں صنوبر کہا جاتا ہے؛ اس کی قوت قابض اور ہلکی گرمی دینے والی ہے، کھانسی اور سینے کے درد میں نافع ہے، اور اس پر کتاب حرف قاف کو ختم کرتی ہے {cite:canon-ibn-sina-print-v1 p.661}۔"
  es: "Qamar quraysh está en el libro, bajo la autoridad de Dioscórides, llamado por algunos fantundas, el fruto de tannub, en vainas que se llaman sanawbar; su poder es astringente y ligeramente caliente, beneficia la tos y el dolor de pecho, y con él el libro cierra la letra qaf {cite:canon-ibn-sina-print-v1 p.661}"
