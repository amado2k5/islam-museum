summary:
  ar: "السماني في الكتاب طائر معروف، يخاف من أكل لحمه التمدد والتشنج، لا لأنه يأكل الخربق فقط بل لأن في جوهره هذه القوة {cite:canon-ibn-sina-print-v1 p.601}."
  en: "Sumani is in the book a well-known bird; eating its meat is feared to cause stretching and spasm, not only because it eats hellebore but because this power is in its substance {cite:canon-ibn-sina-print-v1 p.601}."
  ur: "سمانی کتاب میں ایک معروف پرندہ ہے؛ اس کا گوشت کھانے سے کھنچاؤ اور تشنج کا خوف رہتا ہے، صرف اس لیے نہیں کہ یہ خربق کھاتا ہے بلکہ اس لیے کہ اس کے جوہر میں یہ قوت ہے {cite:canon-ibn-sina-print-v1 p.601}۔"
  es: "En el libro, Sumani es un ave muy conocida; se teme que comer su carne provoque estiramientos y espasmos, no solo porque come eléboro sino porque este poder está en su sustancia {cite:canon-ibn-sina-print-v1 p.601}."
  fr: "Le Sumani est décrit dans le livre comme un oiseau bien connu; on craint que manger sa chair ne provoque des étirements et des spasmes, non seulement parce qu'il mange de l'hellébore, mais aussi parce que ce pouvoir est dans sa substance {cite:canon-ibn-sina-print-v1 p.601}."
