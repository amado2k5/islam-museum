id: concept/lahjat-al-yaman
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "لهجات اليمن"
  en: "The dialects of Yemen"
  ur: "یمن کی بولیاں"
  fr: "Les dialectes du Yémen"
  es: "Los dialectos de Yemen"
summary:
  ar: "ما قُرئ عن كلام اليمن: عبارة دائرة المعارف البريطانية أن الناس يتكلمون لهجات مختلفة من العربية، ولسان حمير في الصاحبي والمزهر وعند ابن خلدون، وخصائص تُنسب إلى لغة اليمن عن ابن دريد وابن فارس والسيوطي كالوتم والشنشنة، ولغات اليمن في القرآن ونسب القبائل. ولم يُعثر على وصف تفصيلي للهجات اليمن المعاصرة ولا على عدد متكلميها."
  en: "What was read of the speech of Yemen: the Encyclopaedia Britannica's statement that the people speak various dialects of Arabic; the tongue of Himyar in al-Sahibi, al-Muzhir and Ibn Khaldun; features ascribed to the language of Yemen from Ibn Duraid, Ibn Faris and al-Suyuti, such as watm and shanshana; and the dialects of Yemen in the Qur'an and in questions of descent. No detailed description of the dialects of Yemen today, and no count of their speakers, was found."
  ur: "یمن کے کلام کے بارے میں جو پڑھا گیا: انسائیکلوپیڈیا برٹانیکا کی عبارت کہ لوگ عربی کی مختلف بولیاں بولتے ہیں؛ الصاحبی، المزہر اور ابن خلدون کے ہاں حمیر کی زبان؛ ابن درید، ابن فارس اور سیوطی سے یمن کی لغت کی طرف منسوب خصوصیات، جیسے وتم اور شنشنہ؛ اور قرآن میں اور قبائل کے نسب میں یمن کی لغات۔ آج کی یمنی بولیوں کی کوئی تفصیلی توصیف اور ان کے بولنے والوں کی کوئی تعداد نہیں ملی۔"
  fr: "Ce qui a été lu sur le parler du Yémen : l'énoncé de l'Encyclopaedia Britannica selon lequel les gens parlent divers dialectes de l'arabe ; la langue de Himyar dans al-Sahibi, al-Muzhir et chez Ibn Khaldun ; des traits attribués à la langue du Yémen d'après Ibn Duraid, Ibn Faris et al-Suyuti, comme le watm et la shanshana ; et les parlers du Yémen dans le Coran et dans les questions de descendance. Aucune description détaillée des dialectes du Yémen d'aujourd'hui, ni aucun décompte de leurs locuteurs, n'a été trouvée."
  es: "Lo que se leyó sobre el habla de Yemen: la declaración de la Encyclopaedia Britannica de que la gente habla diversos dialectos del árabe; la lengua de Himyar en al-Sahibi, al-Muzhir e Ibn Jaldún; rasgos atribuidos a la lengua de Yemen según Ibn Duraid, Ibn Faris y al-Suyuti, como el watm y la shanshana; y los dialectos de Yemen en el Corán y en las cuestiones de ascendencia. No se halló ninguna descripción detallada de los dialectos de Yemen hoy ni un recuento de sus hablantes."
