summary:
  ar: "الرخبين في الكتاب قال ابن ماسويه إنه حار يابس في الثانية رديء الخلط جيد للمعدة الحارة، ويلين البطن إن احتمل منه شياف، وغذاؤه بطيء الانهضام جدا {cite:canon-ibn-sina-print-v1 p.669}"
  en: "Rakhbin is in the book, Ibn Masawayh said, hot and dry in the second degree, poor in its humour and good for the hot stomach; it softens the belly if a suppository of it is taken, and its nourishment is very slow to digest {cite:canon-ibn-sina-print-v1 p.669}"
  ur: "رخبین کتاب میں ہے؛ ابن ماسویہ نے کہا کہ یہ دوسرے درجے میں گرم خشک ہے، اس کا خلط ناقص ہے اور گرم معدے کے لیے اچھا ہے؛ اس کی بتی لی جائے تو پیٹ کو نرم کرتا ہے، اور اس کی غذا بہت دیر میں ہضم ہوتی ہے {cite:canon-ibn-sina-print-v1 p.669}۔"
  es: "Según Ibn Masawayh, el rakhbin es caliente y seco en segundo grado, pobre en humor y bueno para el estómago caliente; ablanda el vientre si se toma un supositorio, y su nutrición es de digestión muy lenta. {cite:canon-ibn-sina-print-v1 p.669}"
