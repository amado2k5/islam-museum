label:
  ar: الخصاء
  en: Khasa' (castration in fiqh)
  ur: خصاء
summary:
  ar: 'الخصاء سل الخصيتين، وعند الفقهاء أخذ الخصيتين دون الذكر أو معه؛ والمجبوب من قُطع ذكره، والعنين العاجز عن إتيان النساء، والوجاء رض عروق البيضتين حتى تنفضخا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7644} حكم خصاء الآدمي حرام صغيرا كان أو كبيرا باتفاق، لورود النهي في حديث ابن مسعود وحديث سعد، ورد النبي التبتل على عثمان بن مظعون، وروي عن عمر «لا كنيمة في الإسلام ولا خصاء»؛ وعلل ابن حجر المنع بمخالفة تكثير النسل، وتعذيب النفس، وتغيير خلق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7645} في غير الآدمي: الحنفية لا بأس بخصاء البهائم للمنفعة؛ والمالكية يجيزونه في المأكول بلا كراهة؛ والشافعية يجيزونه في المأكول صغيرا بشرط ألا يهلك؛ والحنابلة يبيحون خصي الغنم وقيل يكره، ويستدلون بنهي النبي عن خصاء البهائم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646} في فسخ النكاح: الحنفية يجعلون الخصي كالعنين فيؤجل سنة، والمالكية لها الخيار إن لم ينزل، والشافعية قولان، والحنابلة لا خيار إن وصل إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} القصاص في الخصيتين: الجمهور يجرون القصاص عند توافر شروطه، والشافعية يلحقون الإشلال والدق بالقطع، والمالكية لا قصاص في الرض، والحنفية لا يرون نصا في وجوب القصاص فتجب الدية؛ وفي كتاب النبي لعمرو بن حزم «وفي البيضتين الدية». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} وفي موجب قطع الخصيتين: الأثر عن سعيد بن المسيب أن في الصلب الدية وفي الأنثيين الدية، وفي إحداهما نصف الدية في قول أكثر أهل العلم؛ وحكي عنه أن في اليسرى الثلثين وفي اليمنى الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648} إذا رض الأنثيين أو أشلهما كملت الدية، وإذا قطعهما فذهب النسل لم تزد على دية، وإذا قطع إحداهما فذهب النسل فنصف الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648} وإذا قطع الأنثيين مع الذكر فيهما ديتان عند الجمهور؛ وعند الحنفية والحنابلة إن قطع الذكر أولا ثم الأنثيين فديتان، وإن قطع الأنثيين ثم الذكر ففي الأنثيين دية وفي الذكر حكومة عدل؛ والشافعية يوجبون دية كاملة في الأنثيين وفي الذكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7649} الأضحية بالموجوء: الأحاديث في تضحية النبي بكبشين أملحين موجوءين، وقال الشوكاني إن الاستحباب ظاهر فيه؛ الحنفية يجيزون الخصي والفحل لإطلاق اسم الجنس؛ والمالكية يفضلون الفحيل إلا أن يكون الخصي أسمن؛ والشافعية والحنابلة يجيزون الخصي (المجبوب عند الحنابلة لا يجزئ). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650}'
  en: 'Khasa'' is the removal of the two testicles; the jurists use it for taking the testicles without or with the penis; the castrated man is one whose penis is cut off, the impotent (unan) cannot have intercourse, and wijā'' is crushing the testicles'' vessels without removal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7644} Castrating a human is forbidden for child or adult by agreement, on reports of Ibn Mas''ud and Sa''d; the Prophet refused Uthman ibn Maz''un celibacy; a report from Umar says "no castration in Islam"; Ibn Hajar gives as reasons that it defeats the growth of offspring, tortures the self and alters God''s creation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7645} For animals: the Hanafis see no harm for their benefit; the Malikis allow it for edible animals without dislike; the Shafiis allow it for edible animals when young, if it does not kill; the Hanbalis allow castrating sheep (one view dislikes it), citing the Prophet''s strong prohibition on castrating animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646} On annulment of marriage: the Hanafis treat a castrated husband like an impotent one, with a one-year delay; the Malikis give the wife a choice if he does not ejaculate; the Shafiis have two views; the Hanbalis give no choice if he can have intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} On retaliation for the testicles: most jurists order retaliation when its conditions hold; the Shafiis treat crushing or paralysing them as cutting; the Malikis allow no retaliation for crushing; the Hanafis find no text for retaliation and so require blood-money; the Prophet''s letter to Amr ibn Hazm says "blood-money for the testicles". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} On the price of cutting the testicles: a report from al-Zuhri on Sa''id ibn al-Musayyab says the sunna sets full blood-money for the penis and full for the two testicles; for one testicle, half, by most scholars; he is also reported to have set two-thirds for the left and one-third for the right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648} If both are crushed or paralysed, the full sum is due; if both are cut and procreation is lost, only one sum; if one is cut and procreation lost, half. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648} Where both testicles and the penis are cut together, the majority give two sums; the Hanafis and Hanbalis give two if the penis is cut first, but if the testicles are cut first, one sum for them and a fair assessment for the penis; the Shafiis give a full sum for the testicles and for the penis in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7649} On sacrifice of a castrated animal: reports say the Prophet sacrificed two horned, spotted, castrated rams; al-Shawkani took the desirability from this; the Hanafis allow castrated and whole males alike; the Malikis prefer the whole male unless the castrated one is fatter; the Shafiis and Hanbalis allow the castrated animal (the Hanbalis not the fully emasculated one). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650}'
  ur: 'خصاء دونوں خصیوں کو نکالنا ہے، فقہاء اسے خصیے نکالنے یا خصیوں کے ساتھ عضو تناسل کاٹنے پر بولتے ہیں؛ مجبوب وہ ہے جس کا عضو کٹا ہو، عنین وہ ہے جو عورتوں کے پاس جانے سے عاجز ہو، اور وجاء خصیوں کی رگیں کچلنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7644} آدمی کا خصاء بالاتفاق حرام ہے، خواہ بچہ ہو یا بالغ، ابن مسعود اور سعد کی روایات کی بنا پر؛ نبی نے عثمان بن مظعون کو تبتل کی اجازت نہ دی، اور عمر سے مروی «لا كنيمة في الإسلام ولا خصاء» ہے؛ ابن حجر نے منع کی علت نسل کی افزائش کی مخالفت، جان کو اذیت اور خلقِ خدا کی تبدیلی بیان کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7645} غیر آدمی میں حنفیہ کے نزدیک جانور کو فائدے کے لیے خصی کرنے میں حرج نہیں؛ مالکیہ ماکول جانور کو بغیر کراہت جائز کہتے ہیں؛ شافعیہ کم عمری میں ماکول جانور کا خصی کرنا جائز کہتے ہیں بشرطیکہ ہلاکت نہ ہو؛ حنابلہ بکری کا خصی کرنا جائز کہتے ہیں، ایک قول میں مکروہ ہے، اور نبی کا جانوروں کو خصی کرنے سے سخت منع فرمانا دلیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646} نکاح کے فسخ میں: حنفیہ خصی کو عنین کی طرح سمجھ کر ایک سال کی مہلت دیتے ہیں؛ مالکیہ کے نزدیک منی نہ آنے کی صورت میں عورت کو اختیار ہے؛ شافعیہ کے دو قول ہیں؛ حنابلہ کے نزدیک اگر وطی ممکن ہو تو اختیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} خصیوں میں قصاص: جمہور شرائط پوری ہونے پر قصاص کرتے ہیں، شافعیہ کچلنے اور ناکارہ کرنے کو کاٹنے کے برابر، مالکیہ کچلنے میں قصاص نہیں، حنفیہ اس کا نص نہ ہونے کی وجہ سے دیت لازم کرتے ہیں؛ نبی کے عمرو بن حزم کے نام خط میں «وفي البيضتين الدية» ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} خصیوں کے کاٹنے کی دیت میں سعید بن المسیب سے مروی ہے کہ عضو تناسل اور دونوں خصیوں میں مکمل دیت ہے، اور ایک خصیے میں اکثر اہلِ علم کے نزدیک آدھی؛ ان سے بائیں میں دو تہائی اور دائیں میں ایک تہائی بھی منقول ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648} دونوں کو کچل دینے یا ناکارہ کرنے سے مکمل دیت لازم ہے؛ دونوں کاٹنے سے نسل ختم ہو تو ایک ہی دیت؛ ایک کاٹنے سے نسل ختم ہو تو آدھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648} خصیے اور عضو تناسل ایک ساتھ کاٹنے پر جمہور کے نزدیک دو دیتیں؛ حنفیہ اور حنابلہ کے نزدیک عضو پہلے کٹے تو دو، خصیے پہلے کٹیں تو خصیوں کی ایک دیت اور عضو میں حکومتِ عدل؛ شافعیہ دونوں میں مکمل دیت لازم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7648}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7649} موجوء کی قربانی: نبی کا دو سینگ دار سفید رنگ کے خصی مینڈھوں کی قربانی کی حدیث ہے، شوکانی نے اسی سے استحباب لیا؛ حنفیہ جنس کے اطلاق کی بنا پر خصی اور فحل دونوں کو جائز کہتے ہیں؛ مالکیہ فحل کو افضل کہتے ہیں الا یہ کہ خصی زیادہ موٹا ہو؛ شافعیہ اور حنابلہ خصی کو جائز کہتے ہیں، حنابلہ کے نزدیک مجبوب (مکمل کٹا ہوا) جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7649}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7650}'
