label:
  ar: الخصاء
  en: Khasa' (castration in fiqh)
  ur: خصاء
summary:
  ar: 'الخصاء سل الخصيتين، وعند الفقهاء أخذ الخصيتين دون الذكر أو معه؛ والمجبوب من قُطع ذكره، والعنين العاجز عن إتيان النساء، والوجاء رض عروق البيضتين حتى تنفضخا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7644} حكم خصاء الآدمي حرام صغيرا كان أو كبيرا باتفاق، لورود النهي في حديث ابن مسعود وحديث سعد، ورد النبي التبتل على عثمان بن مظعون، وروي عن عمر «لا كنيمة في الإسلام ولا خصاء»؛ وعلل ابن حجر المنع بمخالفة تكثير النسل، وتعذيب النفس، وتغيير خلق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7645} في غير الآدمي: الحنفية لا بأس بخصاء البهائم للمنفعة؛ والمالكية يجيزونه في المأكول بلا كراهة؛ والشافعية يجيزونه في المأكول صغيرا بشرط ألا يهلك؛ والحنابلة يبيحون خصي الغنم وقيل يكره، ويستدلون بنهي النبي عن خصاء البهائم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646} في فسخ النكاح: الحنفية يجعلون الخصي كالعنين فيؤجل سنة، والمالكية لها الخيار إن لم ينزل، والشافعية قولان، والحنابلة لا خيار إن وصل إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} القصاص في الخصيتين: الجمهور يجرون القصاص عند توافر شروطه، والشافعية يلحقون الإشلال والدق بالقطع، والمالكية لا قصاص في الرض، والحنفية لا يرون نصا في وجوب القصاص فتجب الدية؛ وفي كتاب النبي لعمرو بن حزم «وفي البيضتين الدية». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647}'
  en: 'Khasa'' is the removal of the two testicles; the jurists use it for taking the testicles without or with the penis; the castrated man is one whose penis is cut off, the impotent (unan) cannot have intercourse, and wijā'' is crushing the testicles'' vessels without removal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7644} Castrating a human is forbidden for child or adult by agreement, on reports of Ibn Mas''ud and Sa''d; the Prophet refused Uthman ibn Maz''un celibacy; a report from Umar says "no castration in Islam"; Ibn Hajar gives as reasons that it defeats the growth of offspring, tortures the self and alters God''s creation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7645} For animals: the Hanafis see no harm for their benefit; the Malikis allow it for edible animals without dislike; the Shafiis allow it for edible animals when young, if it does not kill; the Hanbalis allow castrating sheep (one view dislikes it), citing the Prophet''s strong prohibition on castrating animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646} On annulment of marriage: the Hanafis treat a castrated husband like an impotent one, with a one-year delay; the Malikis give the wife a choice if he does not ejaculate; the Shafiis have two views; the Hanbalis give no choice if he can have intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} On retaliation for the testicles: most jurists order retaliation when its conditions hold; the Shafiis treat crushing or paralysing them as cutting; the Malikis allow no retaliation for crushing; the Hanafis find no text for retaliation and so require blood-money; the Prophet''s letter to Amr ibn Hazm says "blood-money for the testicles". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647}'
  ur: 'خصاء دونوں خصیوں کو نکالنا ہے، فقہاء اسے خصیے نکالنے یا خصیوں کے ساتھ عضو تناسل کاٹنے پر بولتے ہیں؛ مجبوب وہ ہے جس کا عضو کٹا ہو، عنین وہ ہے جو عورتوں کے پاس جانے سے عاجز ہو، اور وجاء خصیوں کی رگیں کچلنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7643}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7644} آدمی کا خصاء بالاتفاق حرام ہے، خواہ بچہ ہو یا بالغ، ابن مسعود اور سعد کی روایات کی بنا پر؛ نبی نے عثمان بن مظعون کو تبتل کی اجازت نہ دی، اور عمر سے مروی «لا كنيمة في الإسلام ولا خصاء» ہے؛ ابن حجر نے منع کی علت نسل کی افزائش کی مخالفت، جان کو اذیت اور خلقِ خدا کی تبدیلی بیان کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7645} غیر آدمی میں حنفیہ کے نزدیک جانور کو فائدے کے لیے خصی کرنے میں حرج نہیں؛ مالکیہ ماکول جانور کو بغیر کراہت جائز کہتے ہیں؛ شافعیہ کم عمری میں ماکول جانور کا خصی کرنا جائز کہتے ہیں بشرطیکہ ہلاکت نہ ہو؛ حنابلہ بکری کا خصی کرنا جائز کہتے ہیں، ایک قول میں مکروہ ہے، اور نبی کا جانوروں کو خصی کرنے سے سخت منع فرمانا دلیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646} نکاح کے فسخ میں: حنفیہ خصی کو عنین کی طرح سمجھ کر ایک سال کی مہلت دیتے ہیں؛ مالکیہ کے نزدیک منی نہ آنے کی صورت میں عورت کو اختیار ہے؛ شافعیہ کے دو قول ہیں؛ حنابلہ کے نزدیک اگر وطی ممکن ہو تو اختیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7646}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647} خصیوں میں قصاص: جمہور شرائط پوری ہونے پر قصاص کرتے ہیں، شافعیہ کچلنے اور ناکارہ کرنے کو کاٹنے کے برابر، مالکیہ کچلنے میں قصاص نہیں، حنفیہ اس کا نص نہ ہونے کی وجہ سے دیت لازم کرتے ہیں؛ نبی کے عمرو بن حزم کے نام خط میں «وفي البيضتين الدية» ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7647}'
