id: concept/lisan-fiqh
class: concept
kind: legal
label:
  ar: "اللِّسان"
  en: "The tongue (lisan), fiqh rulings"
  ur: "زبان ⁦(فقہی احکام)⁩"
  es: "La lengua (lisan), normas de fiqh"
  fr: "La langue (lisan), les décisions fiqh"
  tr: "dil"
  id: "lidah"
summary:
  ar: "اللسان في اللغة عضو لحمي مستطيل متحرك في الفم يصلح للتذوق والبلع والنطق، وجمعه ألسنة وألسن ولُسن؛ ويُقال لسانه فصيح، والذكر والتأنيث يختلفان باعتبار اللفظ أو اللغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612}. واللغة ما يعبر بها كل قوم عن أغراضهم، والصلة بينهما أن اللسان يكون مرادفاً للغة في أحد إطلاقيه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13613}."
  en: "Lisan, in lexicon, is the fleshy, elongated, movable organ in the mouth, fit for tasting, swallowing and speaking; its plurals are alsina, lusin. A man's lisan is eloquent, and lisan can mean language in one of its senses. Lugha is what each people uses to express its aims, and the two overlap {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13613}."
  ur: "لسان لغت میں منہ کے اندر کا لمبوترا، گوشت دار اور حرکت کرنے والا عضو ہے جو ذائقہ چکھنے، نگلنے اور بولنے کے لیے ہے؛ جمع السنہ، السن اور لُسن ہے۔ لغت وہ ہے جس سے ہر قوم اپنے مقاصد بیان کرتی ہے، اور دونوں کا تعلق یہ ہے کہ لسان اپنے ایک اطلاق میں لغت کے مترادف ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13613}۔"
  es: "Lisan, en léxico, es el órgano carnoso, alargado y móvil de la boca, apto para saborear, tragar y hablar; sus plurales son alsina y lusin. El lisan de un hombre es elocuente, y lisan puede significar lenguaje en uno de sus sentidos. Lugha es lo que cada pueblo usa para expresar sus objetivos, y ambos se superponen {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13613}."
  fr: "Lisan, dans le lexique, est l'organe charnu, allongé et mobile de la bouche, servant à goûter, à avaler et à parler; ses pluriels sont alsina et lusin. Le lisan d'un homme est éloquent, et lisan peut désigner le langage dans l'un de ses sens. Lugha est ce que chaque peuple utilise pour exprimer ses objectifs, et les deux se recoupent {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13613}."
  tr: "Dilde dil, ağızda tat, yutma ve konuşma için uygun, etli, dikdörtgen ve hareketli bir organdır. Çoğulu 'al-sān' (diller), 'alsan' ve 'lassan'dır; dili etkileyici olarak adlandırılır ve eril ile dişil biçimleri telaffuza veya dile göre farklılık gösterir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13612}. Dil, her halkın amaçlarını ifade etmek için kullandığı şeydir ve aralarındaki bağlantı, dilin dilin terimlerinden birinde dil ile eşanlamlı olmasıdır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13613}."
  id: "Dalam bahasa, lidah adalah organ berbentuk persegi panjang yang berdaging dan dapat bergerak di dalam mulut yang cocok untuk mencicipi, menelan, dan berbicara. Jamaknya adalah 'al-sān' (lidah), 'alsan', dan 'lassan'; lidahnya disebut eloquent, dan bentuk maskulin serta feminin berbeda tergantung pada pengucapan atau bahasa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13612}. Bahasa adalah apa yang digunakan setiap bangsa untuk mengungkapkan tujuan mereka, dan hubungan di antara keduanya adalah bahwa lidah identik dengan bahasa dalam salah satu istilahnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13613}."
