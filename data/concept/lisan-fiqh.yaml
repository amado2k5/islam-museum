id: concept/lisan-fiqh
class: concept
kind: legal
label:
  ar: "اللِّسان"
  en: "The tongue (lisan), fiqh rulings"
  ur: "زبان (فقہی احکام)"
summary:
  ar: "اللسان في اللغة عضو لحمي مستطيل متحرك في الفم يصلح للتذوق والبلع والنطق، وجمعه ألسنة وألسن ولُسن؛ ويُقال لسانه فصيح، والذكر والتأنيث يختلفان باعتبار اللفظ أو اللغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612}. واللغة ما يعبر بها كل قوم عن أغراضهم، والصلة بينهما أن اللسان يكون مرادفاً للغة في أحد إطلاقيه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13613}."
  en: "Lisan, in lexicon, is the fleshy, elongated, movable organ in the mouth, fit for tasting, swallowing and speaking; its plurals are alsina, lusin. A man's lisan is eloquent, and lisan can mean language in one of its senses. Lugha is what each people uses to express its aims, and the two overlap {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13613}."
  ur: "لسان لغت میں منہ کے اندر کا لمبوترا، گوشت دار اور حرکت کرنے والا عضو ہے جو ذائقہ چکھنے، نگلنے اور بولنے کے لیے ہے؛ جمع السنہ، السن اور لُسن ہے۔ لغت وہ ہے جس سے ہر قوم اپنے مقاصد بیان کرتی ہے، اور دونوں کا تعلق یہ ہے کہ لسان اپنے ایک اطلاق میں لغت کے مترادف ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13613}۔"
