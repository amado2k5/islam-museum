label:
  ar: "النسر الواقع"
  en: "Lyra (an-nasr al-waqi')"
  ur: "نسر واقع"
  es: "Lyra (an-nasr al-waqi')"
  fr: "Lyra (an-nasr al-waqi')"
summary:
  ar: "يسمّي فهرس البتاني صورة القيثارة باسم النسر الواقع، ويقول إن ألمع نجومها، وهو الذي يذكره الفهرس مع حامل القيثارة، وهو نفسه النسر. والاسم نفسه يطلقه الفهرس على النسر الطائر، فلا يُخلط بين الصورتين. لا تُنقل المواضع هنا. {cite:nallino-albatenii-opus-astronomicum pp.148}"
  en: "The catalogue gives the Lyre the Arabic name an-nasr al-waqi', the falling eagle, and says that its brightest star, which the catalogue places with the lyre-holder, is itself the an-nasr. The catalogue uses the same word for Aquila, so the two figures should not be confused. Star positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.148}"
  ur: "فہرست میں لائرا کو عربی نام النسر الواقع، یعنی گرتا ہوا عقاب، دیا گیا ہے، اور کہا گیا ہے کہ اس کا روشن ترین ستارہ، جو لائرا اٹھانے والے کی صورت کے ساتھ درج ہے، خود النسر ہے۔ یہی لفظ عقاب کی صورت، النسر الطائر، کے لیے بھی آتا ہے، اس لیے دونوں کو الگ پہچاننا چاہیے۔ ستاروں کے مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.148}"
  es: "El catálogo le da a la Lira el nombre árabe an-nasr al-waqi', el águila que cae, y dice que su estrella más brillante, que el catálogo sitúa junto al portador de la lira, es precisamente el an-nasr. El catálogo usa la misma palabra para Aquila, por lo que no deben confundirse. Las posiciones de las estrellas no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.148}"
  fr: "Le catalogue donne à la Lyre le nom arabe d'an-nasr al-waqi', l'aigle tombant, et précise que son étoile la plus brillante, placée avec le porteur de la lyre, est elle-même an-nasr. Le catalogue utilise le même terme pour Aquila, il ne faut donc pas confondre les deux figures. Les positions des étoiles ne sont pas transcrites ici. {cite:nallino-albatenii-opus-astronomicum pp.148}"
