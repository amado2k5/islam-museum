label: { ar: "الخزف ذو العجينة البيضاء ⁦(الفريت)⁩", en: "Fritware (stonepaste)", ur: "فرٹ ویئر ⁦(سنگی خمیر)⁩", es: "Fritware (pasta de piedra)", fr: "Fritware (pâte à pierre)", tr: "Beyaz Macun Porselen (Frete)", id: "Porselen Pasta Putih (Frete)" }
summary:
  ar: "عجينة بيضاء صلبة من الزجاج المسحوق والسيليكا والطين الأبيض، ظهرت في فارس السلجوقية في القرن الثاني عشر ويصفها آرثر لين بأنها «بورسلين لين» أكثر منها فخارًا {cite:lane-early-islamic-pottery-1947 p. 50}."
  en: "A hard white body of ground glass frit, silica and white clay that appeared in twelfth-century Saljuq Persia, which Arthur Lane calls a 'soft-paste porcelain' rather than earthenware {cite:lane-early-islamic-pottery-1947 p. 50}."
  ur: "شیشے کے سفوف، سلیکا اور سفید مٹی کا سخت سفید خمیر جو بارھویں صدی کے سلجوقی فارس میں ظاہر ہوا، اور آرتھر لین اسے مٹی کے برتن کے بجائے «نرم خمیر کی چینی» کہتے ہیں {cite:lane-early-islamic-pottery-1947 p. 50}۔"
  es: "Un cuerpo blanco duro de frita de vidrio molido, sílice y arcilla blanca que apareció en la Persia selyúcida del siglo XII, que Arthur Lane llama una \"porcelana de pasta blanda\" en lugar de loza {cite:lane-early-islamic-pottery-1947 p. 50}."
  fr: "Un corps blanc dur de fritte de verre broyé, de silice et d'argile blanche qui est apparu dans la Perse saldjoukide du XIIe siècle, qu'Arthur Lane appelle une « porcelaine à pâte molle » plutôt que de la faïence {cite:lane-early-islamic-pottery-1947 p. 50}."
  tr: "Ezilmiş cam, silika ve beyaz kilden yapılmış katı beyaz bir macun olan bu ezgi, on ikinci yüzyılda Selçuklu Şövalyeleri'nde ortaya çıkmış ve Arthur Lane tarafından çömlekten çok 'Çizgi porselen' olarak tanımlanmıştır {cite:lane-early-islamic-pottery-1947 s. 50}."
  id: "Pasta putih padat yang terbuat dari kaca hancur, silika, dan tanah liat putih, muncul dalam Kesatria Seljuk pada abad kedua belas dan oleh Arthur Lane digambarkan sebagai 'porselen garis' lebih daripada tembikar {cite:lane-early-islamic-pottery-1947 hlm. 50}."
