label: { ar: "القوسان الفصليتان المرصودتان وربع البعد الأبعد للشمس", en: "The observed seasonal arcs and the quadrant of the Sun's apogee", ur: "سورج کی رصد کردہ موسمی قوسیں اور اوج کا ربع", es: "Los arcos estacionales observados y el cuadrante del apogeo del Sol", fr: "Les arcs saisonniers observés et le quadrant de l'apogée du Soleil", tr: "Gözlemlenen iki mevsimsel yay ve güneşin en uzak çeyreği", id: "Dua busur musiman yang diamati dan seperempat bagian terjauh matahari" }
summary:
  ar: "في الباب الثامن والعشرين يتبع البتاني مذهب بطليموس في تقدير اختلاف حركة الشمس ونقطة بعدها الأبعد من مركز الأرض، ويعتمد قياسات رصدها في سنين متوالية: تقطع الشمس من نقطة الاعتدال الخريفي إلى الربيعي في مائة وثمانية وسبعين يوماً وأربع عشرة ساعة ونصف تقريباً، ومن الربيعي إلى الخريفي في مائة وستة وثمانين يوماً وأربع عشرة ساعة معتدلة ونصف وربع {cite:zij-sabi-nallino-byblion pp.68-69}."
  en: "In chapter 28 al-Battani follows Ptolemy's school in measuring the variation in the Sun's motion and the point of its greatest distance from the centre of the earth, and relies on measurements of its passage made in successive years: the Sun runs from the autumn to the spring equinox point in about a hundred and seventy-eight days and fourteen and a half hours, and from the spring to the autumn equinox in a hundred and eighty-six days and fourteen mean hours, a half and a quarter {cite:zij-sabi-nallino-byblion pp.68-69}."
  ur: "اٹھائیسویں باب میں البتانی سورج کی حرکت کے اختلاف اور زمین کے مرکز سے اس کے سب سے دور نقطے کو ناپنے میں بطلیموس کے مذہب کی پیروی کرتے ہیں، اور متواتر سالوں میں کی گئی اس کے گزرنے کی پیمائشوں پر اعتماد کرتے ہیں: سورج خریفی اعتدال کے نقطے سے ربیعی اعتدال تک تقریباً ایک سو اٹھہتر دن اور ساڑھے چودہ گھنٹوں میں پہنچتا ہے، اور ربیعی سے خریفی تک ایک سو چھیاسی دن اور چودہ معتدل گھنٹوں، آدھے اور ایک چوتھائی میں {cite:zij-sabi-nallino-byblion pp.68-69}۔"
  es: "En el capítulo 28, al-Battani sigue la escuela de Ptolomeo al medir la variación en el movimiento del Sol y el punto de su mayor distancia del centro de la tierra, y se basa en mediciones de su paso realizadas en años sucesivos: el Sol va desde el equinoccio de otoño hasta el de primavera en aproximadamente ciento setenta y ocho días y catorce horas y media, y desde el equinoccio de primavera hasta el de otoño en ciento ochenta y seis días y catorce horas medias, media y cuarto {cite:zij-sabi-nallino-byblion pp.68-69}."
  fr: "Au chapitre 28, al-Battani suit l'école de Ptolémée pour mesurer la variation du mouvement du Soleil et le point de sa plus grande distance par rapport au centre de la Terre, et s'appuie sur des mesures de son passage effectuées au cours d'années successives: le Soleil parcourt l'équinoxe d'automne jusqu'à l'équinoxe de printemps en environ cent soixante-dix-huit jours et quatorze heures et demie, et l'équinoxe de printemps jusqu'à l'équinoxe d'automne en cent quatre-vingt-six jours et quatorze heures moyennes, une demi et un quart {cite: zij-sabi-nallino-byblion pp.68-69}."
  tr: "Yirmi sekizinci bölümde, El-Battani, güneşin hareketindeki farkı ve dünyanın merkezinden en uzak olduğu noktayı tahmin ederken Batlamyus'un öğretisini izler ve ardışık yıllardaki gözlemlerine dayanarak şunları söyler: Güneş, sonbahar ekinoksundan ilkbahar ekinoksuna yaklaşık yüz yetmiş sekiz gün ve on dört buçuk saatte, ilkbahar ekinoksundan sonbahar ekinoksuna ise yüz seksen altı gün ve on dört buçuk çeyrek saatte yol alır. {cite:zij-sabi-nallino-byblion pp.68-69}"
  id: "Dalam bab ke-28, Al-Battani mengikuti doktrin Ptolemy dalam memperkirakan perbedaan pergerakan matahari dan titik terjauhnya dari pusat bumi, dan ia mengandalkan pengukuran pengamatannya pada tahun-tahun berturut-turut: matahari bergerak dari titik ekuinoks musim gugur ke ekuinoks musim semi dalam waktu sekitar seratus tujuh puluh delapan hari dan empat belas setengah jam, dan dari ekuinoks musim semi ke ekuinoks musim gugur dalam waktu seratus delapan puluh enam hari dan empat belas setengah seperempat jam {cite:zij-sabi-nallino-byblion pp.68-69}."
