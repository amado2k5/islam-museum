  ur: "لسان الحمل"
  es: "Lisan al-haml (plátano)"
  fr: "Lisan al-haml (plantain)"
summary:
  ar: "لسان الحمل صغير وكبير، بارد يابس في الثانية، قابض رادع غير لذاع، غاية في القروح والأورام الحارة، وينفع العين والأذن والكبد والأمعاء ولسع الكلب الكلب {cite:canon-ibn-sina-print-v1 p.542} {cite:canon-ibn-sina-print-v1 p.543}."
  en: "Plantain is small and large, cold and dry in the second degree, astringent and repelling without stinging, the best for ulcers and hot swellings, and it helps the eye, ear, liver and intestines and the bite of a rabid dog {cite:canon-ibn-sina-print-v1 p.542} {cite:canon-ibn-sina-print-v1 p.543}."
  ur: "لسان الحمل چھوٹا اور بڑا، دوسرے درجے میں ٹھنڈا اور خشک، قابض اور دفع کرنے والا مگر چبھنے والا نہیں، زخموں اور گرم ورموں کے لیے بہترین، اور آنکھ، کان، جگر، آنتوں اور باؤلے کتے کے کاٹے میں مفید ہے {cite:canon-ibn-sina-print-v1 p.542} {cite:canon-ibn-sina-print-v1 p.543}۔"
  es: "El llantén es pequeño y grande, frío y seco en segundo grado, astringente y repelente sin picar, el mejor para úlceras e hinchazones calientes, y ayuda al ojo, oído, hígado e intestinos y la mordedura de un perro rabioso {cite:canon-ibn-sina-print-v1 p.542} {cite:canon-ibn-sina-print-v1 p.543}."
  fr: "Le plantain est petit et grand, froid et sec au deuxième degré, astringent et repoussant sans piquer, le meilleur pour les ulcères et les gonflements chauds, et il aide les yeux, les oreilles, le foie et les intestins et la morsure d'un chien enragé {cite:canon-ibn-sina-print-v1 p.542} {cite:canon-ibn-sina-print-v1 p.543}."
