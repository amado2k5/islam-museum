id: concept/al-adwiya-al-sadriyya
class: concept
kind: scientific
label:
  ar: "الأدوية الصدرية"
  en: "The chest drugs"
  fr: "Les remèdes de la poitrine"
  ur: "صدری ادویہ"
summary:
  ar: "الأدوية الصدرية هي الأدوية التي تنقي الصدر وهي على مراتب الأولى أضعفها ثم ما فوقها قوة إلى أقواها وفيها من ينفث الأخلاط الغليظة والمدة ومنها الحبوب والمشارب والمعاجين والمباخر والمركبات التي سماها الكتاب بأسماء أصحابها ⁦(والكتاب يعدد المفردات والمركبات بأسمائها ونسخها ومقاديرها وما جرب فيها ولا ينقل شيء منها بحسب القاعدة بل تذكر المراتب والهيئات فقط)⁩ {cite:canon-ibn-sina-print-v2 p.305}"
  en: "The chest drugs are the drugs that cleanse the chest, and they are in ranks: the first rank the weakest, then what is above it in strength, up to the strongest; among them is what raises the thick humours and the pus, and among them are the pills, the draughts, the electuaries and the fumigations, and compounds the book names by their authors' names (the book lists the simples and the compounds by name, formula and measure, and what was tried of them; none of that is carried, per the rule — only the ranks and the forms are told) {cite:canon-ibn-sina-print-v2 p.305}"
  fr: "Les remèdes de la poitrine sont les remèdes qui nettoient la poitrine, et ils se répartissent en rangs : le premier rang le plus faible, puis ce qui le dépasse en force, jusqu’au plus fort ; parmi eux, ce qui fait remonter les humeurs épaisses et le pus, et parmi eux les pilules, les potions, les électuaires et les fumigations, ainsi que des composés que le livre désigne par le nom de leurs auteurs (le livre énumère les simples et les composés par leur nom, leur formule et leur mesure, ainsi que ce qui en a été éprouvé ; rien de cela n’est repris, conformément à la règle — seuls les rangs et les formes sont rapportés) {cite:canon-ibn-sina-print-v2 p.305}"
  ur: "صدری ادویہ وہ ہیں جو سینے کو صاف کریں اور وہ درجوں میں ہیں پہلا درجہ کمزور ترین پھر اس سے اوپر قوت میں بڑھتے ہوئے مضبوط ترین تک؛ ان میں کچھ ہیں جو گاڑھے اخلاط اور مدہ اٹھوائیں اور ان میں گولیاں مشروبات معاجین اور دھونیاں ہیں اور ایسے مرکب بھی جنہیں کتاب نے ان کے واضعین کے ناموں سے موسوم کیا ⁦(کتاب مفردات اور مرکبات کو نام نسخہ اور مقدار کے ساتھ شمار کرتی ہے اور ان میں آزمائے ہوئے بھی؛ ان میں سے کچھ بھی اصول کے مطابق نہیں لایا گیا — صرف درجے اور صورتیں بیان کی گئیں)⁩ {cite:canon-ibn-sina-print-v2 p.305}"
