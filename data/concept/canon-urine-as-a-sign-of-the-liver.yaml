id: concept/canon-urine-as-a-sign-of-the-liver
class: concept
kind: scientific
label: { ar: "البول دليل على الكبد عند ابن سينا", en: "Urine as a sign of the liver in the Canon", ur: "جگر کی علامت کے طور پر پیشاب قانون میں", es: "La orina como signo del hígado en el Canon", fr: "L'urine comme signe du foie dans le canon", tr: "İbn Sina'ya göre idrar, karaciğer kanıtıdır", id: "Urin adalah bukti hati menurut Ibn Sina" }
summary:
  ar: "يقول ابن سينا إن الدلالة الأولية للبول على حال الكبد ومسالك الماء وعلى أحوال العروق، ويدل بتوسطها على أمراض أخرى {cite:canon-ibn-sina-print-v1 p.184}."
  en: "Ibn Sina says the first indication of urine is of the state of the liver, the water passages and the vessels, and through them it points to other diseases {cite:canon-ibn-sina-print-v1 p.184}."
  es: "Ibn Sina dice que el primer indicio de la orina es del estado del hígado, los conductos de agua y los vasos, y a través de ellos apunta a otras enfermedades {cite:canon-ibn-sina-print-v1 p.184}."
  fr: "Ibn Sina dit que le premier signe de l'urine est l'état du foie, des voies d'eau et des vaisseaux, et à travers eux elle indique d'autres maladies {cite:canon-ibn-sina-print-v1 p.184}."
  ur: "ابن سینا کا کہنا ہے کہ پیشاب کا پہلا اشارہ جگر، پانی کے راستے اور رگوں کی حالت کی طرف ہے اور ان کے ذریعے دیگر بیماریوں کی طرف اشارہ کرتا ہے۔"
  tr: "İbn Sina, idrarın öncelikle karaciğerin durumunu, su yollarını ve damarların durumunu gösterdiğini, aracılığının ise diğer hastalıkları gösterdiğini söyler {cite:canon-ibn-sina-print-v1 s.184}."
  id: "Ibn Sina mengatakan bahwa urin terutama menunjukkan kondisi hati, jalur air, dan kondisi pembuluh darah, dan mediasinya menunjukkan penyakit lain {cite:canon-ibn-sina-print-v1 hlm.184}."
