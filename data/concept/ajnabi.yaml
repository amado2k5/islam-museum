id: concept/ajnabi
class: concept
kind: legal
label: { ar: "أجنبي", en: "Stranger, outsider (ajnabi)" }
summary:
  ar: "الأجنبي في اللغة الغريب، ويطلق على من هو غريب حساً أو معنى، ولم يعرّفه الفقهاء تعريفاً جامعاً، وإنما يفسر في كل موضع بحسبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} ومن معانيه البعيد في القرابة الذي لا تصله رابطة النسب، وغريب الأمر من عقد أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} وينقلب ذو العلاقة إلى أجنبي بارتفاع السبب، أو قيام مانع، أو بحكم القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} وإذا اجتمع ذو العلاقة والأجنبي فذو العلاقة أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702}"
  en: "Ajnabi in the lexicon is a stranger, someone foreign in fact or in meaning. Jurists give no single definition; the word is read in each place by its context. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} Its senses include a relative with no kinship tie, and one outside a contract or other matter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} A person with a relation to a matter becomes a stranger when the cause ends, when an obstacle arises, or by a judgement; for example, the divorced wife, the apostate spouse, and a ward held to be incompetent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} When a person with a relation and a stranger are both present, the person with the relation has priority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} A person who acts for another without authority is called a fudul, and jurists differ on whether his act is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1703}"
