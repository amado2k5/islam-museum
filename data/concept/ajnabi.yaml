id: concept/ajnabi
class: concept
kind: legal
label: { ar: "أجنبي", en: "Stranger, outsider (ajnabi)", fr: "Étranger, tiers (ajnabi)", es: "Extraño, forastero (ajnabi)", ur: "اجنبی، اجنبی ⁦(اجنبی)⁩" }
summary:
  ar: "الأجنبي في اللغة الغريب، ويطلق على من هو غريب حساً أو معنى، ولم يعرّفه الفقهاء تعريفاً جامعاً، وإنما يفسر في كل موضع بحسبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} ومن معانيه البعيد في القرابة الذي لا تصله رابطة النسب، وغريب الأمر من عقد أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} وينقلب ذو العلاقة إلى أجنبي بارتفاع السبب، أو قيام مانع، أو بحكم القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} وإذا اجتمع ذو العلاقة والأجنبي فذو العلاقة أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702}"
  en: "Ajnabi in the lexicon is a stranger, someone foreign in fact or in meaning. Jurists give no single definition; the word is read in each place by its context. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} Its senses include a relative with no kinship tie, and one outside a contract or other matter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} A person with a relation to a matter becomes a stranger when the cause ends, when an obstacle arises, or by a judgement; for example, the divorced wife, the apostate spouse, and a ward held to be incompetent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} When a person with a relation and a stranger are both present, the person with the relation has priority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} A person who acts for another without authority is called a fudul, and jurists differ on whether his act is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1703}"
  fr: "Au sens lexical, ajnabi désigne un étranger, quelqu’un qui est étranger au sens propre ou au sens figuré. Les juristes n’en donnent pas de définition unique : le mot s’interprète dans chaque cas selon le contexte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} Il peut désigner un proche sans lien de parenté ou un tiers à un contrat ou à une autre affaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} Une personne liée à une affaire devient un tiers lorsque le motif du lien disparaît, lorsqu’un obstacle survient ou à la suite d’un jugement : c’est le cas, par exemple, de l’épouse divorcée, du conjoint apostat ou du pupille déclaré incapable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} Lorsqu’une personne liée à l’affaire et un tiers sont tous deux présents, la première a priorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} Celui qui agit pour autrui sans en avoir le pouvoir est appelé fudul. Les juristes divergent sur la validité de son acte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1703}"
  es: "Ajnabi en el léxico es un extraño, alguien extranjero de hecho o de significado. Los juristas no dan una definición única; la palabra se lee en cada lugar por su contexto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} Sus sentidos incluyen un pariente sin vínculo de parentesco y alguien fuera de un contrato u otro asunto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1701} Una persona con relación en un asunto se convierte en un extraño cuando la causa termina, cuando surge un obstáculo o por una sentencia; por ejemplo, la esposa divorciada, el cónyuge apóstata y un pupilo declarado incapacitado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} Cuando una persona con relación y un extraño están presentes, la persona con relación tiene prioridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1702} A quien actúa en nombre de otro sin autorización se le llama fudul, y los juristas discrepan sobre la validez de su acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1703}"
  ur: "لغت میں اجنبی ایک اجنبی ہے، حقیقت میں یا معنی میں کوئی اجنبی۔ فقہا کوئی ایک تعریف نہیں کرتے۔ لفظ ہر جگہ اس کے سیاق و سباق کے مطابق پڑھا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1701} اس کے حواس میں ایسا رشتہ دار شامل ہے جس میں رشتہ داری نہ ہو، اور ایک معاہدہ سے باہر یا کوئی اور معاملہ۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1701} کسی معاملے سے تعلق رکھنے والا شخص اس وقت اجنبی ہو جاتا ہے جب وجہ ختم ہو جاتی ہے، جب کوئی رکاوٹ پیدا ہوتی ہے، یا فیصلے سے۔ مثال کے طور پر، طلاق یافتہ بیوی، مرتد شریک حیات، اور ایک وارڈ جسے نااہل قرار دیا گیا ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1702} جب رشتہ دار اور اجنبی دونوں موجود ہوں تو رشتہ دار کو ترجیح حاصل ہوتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1702} جو شخص بغیر اختیار کے کسی دوسرے کے لیے کام کرتا ہے اسے فضول کہتے ہیں، اور فقہاء کا اس بات میں اختلاف ہے کہ آیا اس کا عمل درست ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1703}"
