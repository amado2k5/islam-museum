summary:
  ar: "نبات قريب من الشجر، ينبت قرب المياه، أغصانه صلبة وورقه كورق الزيتون، لطيف حرّيف عفِص، حار في الأولى يابس في الثالثة، ملطّف محلّل مفشّش للرياح، ينفع الصداع، ويفتح سدد الكبد والطحال {cite:canon-ibn-sina-print-v1 p.406}، {cite:canon-ibn-sina-print-v1 p.407}."
  en: "A plant nearly the size of a tree, growing near water, with firm stems and a leaf like the olive's but softer. It is light, sharp and astringent, hot in the first degree and dry in the third. It thins, dissolves and releases wind, helps headache, and opens blockages of the liver and spleen {cite:canon-ibn-sina-print-v1 p.406}, {cite:canon-ibn-sina-print-v1 p.407}."
  ur: "ایک پودا جو تقریباً درخت جتنا ہوتا ہے، پانی کے قریب اگتا ہے، اس کی ٹہنیاں سخت اور پتا زیتون کے پتے جیسا مگر نرم۔ یہ ہلکا، تیز اور قابض ہے، پہلے درجے میں گرم اور تیسرے میں خشک۔ یہ پتلا کرتا، تحلیل کرتا اور ہوا نکالتا ہے، سردرد میں مفید اور جگر اور تلی کی رکاوٹیں کھولتا ہے {cite:canon-ibn-sina-print-v1 p.406}، {cite:canon-ibn-sina-print-v1 p.407}۔"
