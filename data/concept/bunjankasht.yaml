label:
  ar: "بنجنكشت"
  en: "Banjankasht (a plant with a Persian name)"
  fr: "Banjankasht (plante au nom persan)"
  ur: "بنجنکشت"
  es: "Banjankasht (una planta con nombre persa)"
  tr: "Benjangxt"
  id: "Benjangxt"
summary:
  ar: "نبات قريب من الشجر، ينبت قرب المياه، أغصانه صلبة وورقه كورق الزيتون، لطيف حرّيف عفِص، حار في الأولى يابس في الثالثة، ملطّف محلّل مفشّش للرياح، ينفع الصداع، ويفتح سدد الكبد والطحال {cite:canon-ibn-sina-print-v1 p.406}، {cite:canon-ibn-sina-print-v1 p.407}."
  en: "A plant nearly the size of a tree, growing near water, with firm stems and a leaf like the olive's but softer. It is light, sharp and astringent, hot in the first degree and dry in the third. It thins, dissolves and releases wind, helps headache, and opens blockages of the liver and spleen {cite:canon-ibn-sina-print-v1 p.406}, {cite:canon-ibn-sina-print-v1 p.407}."
  fr: "Plante presque aussi grande qu’un arbre, près de l’eau, aux tiges fermes et feuilles d’olivier plus tendres. Légère, âcre, astringente, chaude au premier degré et sèche au troisième. Elle fluidifierait, résoudrait et libérerait les vents, aiderait les céphalées et lèverait les obstructions du foie et de la rate {cite:canon-ibn-sina-print-v1 p.406}, {cite:canon-ibn-sina-print-v1 p.407}."
  ur: "ایک پودا جو تقریباً درخت جتنا ہوتا ہے، پانی کے قریب اگتا ہے، اس کی ٹہنیاں سخت اور پتا زیتون کے پتے جیسا مگر نرم۔ یہ ہلکا، تیز اور قابض ہے، پہلے درجے میں گرم اور تیسرے میں خشک۔ یہ پتلا کرتا، تحلیل کرتا اور ہوا نکالتا ہے، سردرد میں مفید اور جگر اور تلی کی رکاوٹیں کھولتا ہے {cite:canon-ibn-sina-print-v1 p.406}، {cite:canon-ibn-sina-print-v1 p.407}۔"
  es: "Una planta casi del tamaño de un árbol, que crece cerca del agua, con tallos firmes y una hoja parecida a la del olivo pero más suave. Es ligera, punzante y astringente, caliente en primer grado y seca en tercero. Adelgaza, disuelve y libera el viento, alivia el dolor de cabeza y desbloquea el hígado y el bazo {cite:canon-ibn-sina-print-v1 p.406}, {cite:canon-ibn-sina-print-v1 p.407}."
  tr: "Ağaçlara yakın bir bitki, suya yakın büyür, dalları sert ve yaprakları zeytin yaprakları gibi, tanenlere nazik, ilkinde sıcak, üçüncüsünde kuru, rüzgara tepki veren, baş ağrılarına yardımcı olan ve karaciğer ile dalak valfini açan yatıştırıcı bir maddedir {cite:canon-ibn-sina-print-v1 s.406}, {cite:canon-ibn-sina-print-v1 s.407}."
  id: "Tanaman dekat pohon tumbuh dekat air, cabangnya keras dan daunnya seperti daun zaitun, lembut dengan tanin, panas di tanaman pertama dan kering di tanaman ketiga, zat penenang yang bereaksi terhadap angin, membantu sakit kepala, dan membuka katup hati serta limpa {cite:canon-ibn-sina-print-v1 hlm.406}, {cite:canon-ibn-sina-print-v1 hlm.407}."
