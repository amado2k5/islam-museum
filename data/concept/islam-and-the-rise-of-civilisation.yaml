# Verification: one source (Arslan's commentary, scan pages 118-155, book pp. 106-127). The argument is an apologetic of the 1920s and quotes several European authors (French and English authors, as Arslan cites them) whose words must be checked in the originals. Claims about the schools of Basra, Kufa and Cordoba need a standard history of Islamic education (for example George Makdisi's work on the madrasa) before publication.
