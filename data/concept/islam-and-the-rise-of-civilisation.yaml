id: concept/islam-and-the-rise-of-civilisation
class: concept
kind: social
label: { ar: "لماذا راق الإسلام بذاته", en: "Why Islam rose by its own merits" }
summary:
  ar: "يناقش شكيب أرسلان في فصول «الحضارة الإسلامية» و«لماذا الإسلام راق بذاته» دعوى بعض الكتاب الأوروبيين والمبشرين أن الإسلام سبب التأخر الحضاري. يرى أن الحضارات الشرقية القديمة كانت قد انحطت قبل الإسلام، وأن الحضارة العربية الإسلامية قامت على الاقتباس من الحضارات القديمة مع الإضافة إليها، وأن المدارس في البصرة والكوفة وبغداد وقرطبة والقاهرة اتسعت للطلاب من أديان مختلفة. يعرض هذه الحجج كما يراها، ويعترف بأن الإسلام في عصور لاحقة أخذ منحى آخر لأسباب سياسية واجتماعية يحمّلها غيره."
  en: "In chapters titled 'Islamic civilisation' and 'Why Islam rose by its own merits' Arslan rebuts the claim, made by some European writers and missionaries, that Islam caused backwardness. He argues that older Eastern civilisations had declined before Islam, that Arab-Islamic learning built on inherited knowledge while adding to it, and that the great centres of learning welcomed students of many faiths. He admits that later centuries took a different course but puts the cause on political and social factors rather than the religion. This is his argument."
wings: [ideas]
periods: [period/abbasid-early]
