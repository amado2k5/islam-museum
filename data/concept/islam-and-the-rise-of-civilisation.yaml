class: concept
kind: social
label: { ar: "لماذا راق الإسلام بذاته", en: "Why Islam rose by its own merits", es: "Por qué el Islam surgió por sus propios méritos", fr: "Pourquoi l'islam s'est élevé par ses propres mérites", ur: "اسلام اپنی خوبیوں سے کیوں طلوع ہوا؟", tr: "İslam neden kendini seviyordu", id: "Mengapa Islam menyukai dirinya sendiri" }
summary:
  ar: "يناقش شكيب أرسلان في فصول «الحضارة الإسلامية» و«لماذا الإسلام راق بذاته» دعوى بعض الكتاب الأوروبيين والمبشرين أن الإسلام سبب التأخر الحضاري. يرى أن الحضارات الشرقية القديمة كانت قد انحطت قبل الإسلام، وأن الحضارة العربية الإسلامية قامت على الاقتباس من الحضارات القديمة مع الإضافة إليها، وأن المدارس في البصرة والكوفة وبغداد وقرطبة والقاهرة اتسعت للطلاب من أديان مختلفة. يعرض هذه الحجج كما يراها، ويعترف بأن الإسلام في عصور لاحقة أخذ منحى آخر لأسباب سياسية واجتماعية يحمّلها غيره."
  en: "In chapters titled 'Islamic civilisation' and 'Why Islam rose by its own merits' Arslan rebuts the claim, made by some European writers and missionaries, that Islam caused backwardness. He argues that older Eastern civilisations had declined before Islam, that Arab-Islamic learning built on inherited knowledge while adding to it, and that the great centres of learning welcomed students of many faiths. He admits that later centuries took a different course but puts the cause on political and social factors rather than the religion. This is his argument."
  es: "En los capítulos titulados «La civilización islámica» y «Por qué el islam surgió por mérito propio», Arslan refuta la afirmación, formulada por algunos escritores y misioneros europeos, de que el islam causó el atraso. Argumenta que las antiguas civilizaciones orientales habían declinado antes del islam, que el saber árabe-islámico se basó en el conocimiento heredado a la vez que lo enriqueció, y que los grandes centros de aprendizaje acogieron a estudiantes de diversas religiones. Admite que siglos posteriores tomaron un rumbo diferente, pero atribuye la causa a factores políticos y sociales más que a la religión. Este es su argumento."
  fr: "Dans les chapitres intitulés « Civilisation islamique » et « Pourquoi l’islam s’est développé par ses propres mérites », Arslan réfute l’affirmation, avancée par certains auteurs et missionnaires européens, selon laquelle l’islam aurait engendré un retard de développement. Il soutient que les civilisations orientales plus anciennes avaient décliné avant l’avènement de l’islam, que le savoir arabo-islamique s’est appuyé sur les connaissances héritées tout en les enrichissant, et que les grands centres d’apprentissage ont accueilli des étudiants de diverses confessions. Il reconnaît que les siècles suivants ont suivi une trajectoire différente, mais il attribue cette évolution à des facteurs politiques et sociaux plutôt qu’à la religion. Tel est son argumentation."
  ur: "'اسلامی تہذیب' اور 'اسلام اپنی خوبیوں سے کیوں طلوع ہوا' کے عنوان سے ابواب میں ارسلان نے بعض یورپی مصنفین اور مشنریوں کے اس دعوے کی تردید کی ہے کہ اسلام پسماندگی کا سبب بنا۔ اس کا استدلال ہے کہ قدیم مشرقی تہذیبیں اسلام سے پہلے زوال پذیر ہو چکی تھیں، کہ عرب-اسلامی تعلیم وراثت میں ملنے والے علم پر استوار ہوتی تھی اور اس میں اضافہ کرتے تھے، اور یہ کہ سیکھنے کے عظیم مراکز نے بہت سے مذاہب کے طلباء کو خوش آمدید کہا۔ وہ تسلیم کرتا ہے کہ بعد کی صدیوں نے ایک مختلف راستہ اختیار کیا لیکن اس کی وجہ مذہب کی بجائے سیاسی اور سماجی عوامل پر ڈالی گئی۔ یہ اس کی دلیل ہے۔"
  tr: "Shakib Arslan, \"İslam Medeniyeti\" ve \"İslam Neden Kendini Sınıflandırıyor\" bölümlerinde, bazı Avrupalı yazar ve misyonerlerin İslam'ın medeniyetsel geri kalmışlığın nedeni olduğu iddiasını tartışır. Antik Doğu medeniyetlerinin İslam öncesinde gerilediğine, Arap-İslam uygarlığının eski uygarlıklardan alıntı yapıp onlara eklemeler yapıldığına ve Basra, Kufa, Bağdat, Kordoba ve Kahire'deki okulların farklı dinlerden öğrencileri kabul edecek şekilde genişlediğine inanır. Bu argümanları kendi bakış açısıyla sunar ve İslam'ın sonraki dönemlerde başkalarının siyasi ve sosyal nedenleriyle farklı bir yöne yöneldiğini kabul eder."
  id: "Shakib Arslan membahas, dalam bab \"Peradaban Islam\" dan \"Mengapa Islam Diklasifikasikan Sendiri,\" klaim beberapa penulis dan misionaris Eropa bahwa Islam adalah penyebab keterbelakangan peradaban. Ia percaya bahwa peradaban Timur kuno menurun sebelum Islam, bahwa peradaban Arab-Islam didasarkan pada peminjaman dari peradaban kuno dengan tambahan di dalamnya, dan bahwa sekolah-sekolah di Basra, Kufa, Baghdad, Cordoba, dan Kairo berkembang untuk menampung siswa dari berbagai agama. Ia menyajikan argumen-argumen ini sebagaimana melihatnya dan mengakui bahwa Islam di era berikutnya mengambil arah berbeda karena alasan politik dan sosial yang dipegang oleh orang lain."
