label:
  ar: "السَّنَة"
  en: "Sanah (the year) and its legal uses"
  es: "Sanah (el año) y sus usos legales"
  fr: "Sanah (l'année) et ses usages juridiques"
  ur: "صنع ⁦(سال)⁩ اور اس کے قانونی استعمال"
  tr: "Sünnet"
  id: "Sunnah"
summary:
  ar: "السنة في اللغة والاصطلاح الحول، وإذا أطلقت في كلام الفقهاء فهي السنة القمرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9832} والحول شرط لوجوب زكاة السائمة والأثمان وعروض التجارة، أما الزرع والثمار والمعدن فلا يشترط فيها حول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9833} ومن أحكامها عند الفقهاء مدة تعريف اللقطة، ومدة إمهال العنين، ومدة التغريب في عقوبة الزنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9834}"
  en: "The sanah means a full year in language and in the technical sense; where the jurists use the word without qualification they mean the lunar year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9832} A full year (haul) is a condition for zakat on grazing livestock, on gold and silver, and on trade goods; crops, fruit and minerals need no haul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9833} Among its legal uses are the period for announcing found property, the year granted to an impotent husband, and the year of exile in the penalty for fornication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9834}"
  es: "El término sanah significa año completo tanto en el lenguaje como en el sentido técnico; cuando los juristas usan la palabra sin ninguna especificación, se refieren al año lunar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9832} Un año completo (haul) es una condición para el zakat sobre el ganado de pastoreo, el oro y la plata, y los bienes comerciales; los cultivos, las frutas y los minerales no requieren haul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9833} Entre sus usos legales se encuentran el período para anunciar bienes encontrados, el año concedido a un marido impotente y el año de exilio como castigo por fornicación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9834}"
  fr: "Le terme « sanah » désigne une année complète, tant au sens courant que technique; lorsque les juristes l’emploient sans précision, il s’agit de l’année lunaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9832} Une année complète (haul) est une condition pour le calcul de la zakat sur le bétail en pâturage, l’or et l’argent, ainsi que sur les marchandises; les récoltes, les fruits et les minéraux n’y sont pas soumis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9833} Parmi ses applications juridiques figurent le délai pour annoncer la découverte d’un bien, l’année accordée à un mari impuissant et l’année d’exil en cas de fornication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9834}"
  ur: "سنہ کا مطلب زبان اور فنی لحاظ سے پورا سال ہے۔ جہاں فقہاء بغیر اہلیت کے لفظ استعمال کرتے ہیں ان سے مراد قمری سال ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 9832} مویشیوں کے چرنے، سونے چاندی اور تجارتی سامان پر زکوٰۃ کے لیے پورا سال شرط ہے۔ فصلوں، پھلوں اور معدنیات کو لے جانے کی ضرورت نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9833} اس کے قانونی استعمال میں سے جائیداد کا اعلان کرنے کی مدت، نامحرم شوہر کو دیا گیا سال، اور زنا کی سزا میں جلاوطنی کا سال شامل ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص9834}"
  tr: "Sünnet, dil ve terminoloji olarak yılın yılıdır ve hukukçuların söylevinde kullanıldığında ay yılıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9832} Yıl, skandal, fiyatlar ve ticaret teklifleri üzerine zekat yükümlülüğü için bir koşuldur; bir yıl için ise ürünler, meyveler ve mineraller zorunlu değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9833} Hukukçulara göre kararları arasında anlık görüntünün tanımlanma süresi, dinlenme süresi ve zina cezası kapsamında sürgün süresi yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9834}"
  id: "Sunnah dalam bahasa dan istilah adalah tahun dalam setahun, dan ketika digunakan dalam wacana para ahli hukum, itu adalah tahun lunar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9832} Tahun adalah syarat untuk kewajiban zakat atas skandal, harga, dan tawaran perdagangan, sementara tanaman, buah-buahan, dan mineral tidak diperlukan selama satu tahun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9833} Di antara putusannya menurut para ahli hukum adalah durasi penentuan snapshot, waktu istirahat, dan durasi pengasingan dalam hukuman perselingkuhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9834}"
