label:
  ar: "السَّنَة"
  en: "Sanah (the year) and its legal uses"
summary:
  ar: "السنة في اللغة والاصطلاح الحول، وإذا أطلقت في كلام الفقهاء فهي السنة القمرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9832} والحول شرط لوجوب زكاة السائمة والأثمان وعروض التجارة، أما الزرع والثمار والمعدن فلا يشترط فيها حول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9833} ومن أحكامها عند الفقهاء مدة تعريف اللقطة، ومدة إمهال العنين، ومدة التغريب في عقوبة الزنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9834}"
  en: "The sanah means a full year in language and in the technical sense; where the jurists use the word without qualification they mean the lunar year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9832} A full year (haul) is a condition for zakat on grazing livestock, on gold and silver, and on trade goods; crops, fruit and minerals need no haul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9833} Among its legal uses are the period for announcing found property, the year granted to an impotent husband, and the year of exile in the penalty for fornication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9834}"
