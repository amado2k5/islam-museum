id: concept/zij-sabi-sun-mean-place-from-hijri-years
class: concept
kind: scientific
label: { ar: "وسط الشمس بالسنين الهجرية", en: "The Sun's mean place from Hijri years", ur: "ہجری سالوں سے سورج کا اوسط مقام", es: "El lugar medio del Sol desde los años Hijri", fr: "Le lieu moyen du Soleil depuis les années de l'Hégire", tr: "Hicri yıllara göre güneşin tam ortasında", id: "Di tengah matahari, menurut tahun Hijriah" }
summary:
  ar: "يبين البتاني أن وسط الشمس يُطلب بالسنين الهجرية أيضاً، فتُؤخذ السنة الهجرية مع السنة التي أنت فيها، ويُطلب ذلك في جدول حركة الشمس في سطر السنين المجموعة من سني العرب، ثم يُعمل بالرسم المتقدم. {cite:zij-sabi-nallino-byblion p.107}."
  en: "Al-Battani shows that the Sun's mean place can also be found from Hijri years: the Hijri year is taken with the current year and looked up in the table of the Sun's motion, in the row of combined Arab years; the earlier procedure is then followed. {cite:zij-sabi-nallino-byblion p.107}."
  ur: "البتانی دکھاتے ہیں کہ سورج کا اوسط مقام ہجری سالوں سے بھی نکلتا ہے: ہجری سال اور موجودہ سال لے کر سورج کی حرکت کے جدول میں عربی سالوں کی مجموعی قطار میں دیکھا جاتا ہے، پھر پہلے بیان کردہ طریقہ اختیار کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.107}۔"
  es: "Al-Battani demuestra que la posición media del Sol también puede hallarse a partir de los años islámicos: se toma el año islámico junto con el año actual y se consulta la tabla del movimiento del Sol, en la fila de años árabes combinados; a continuación, se sigue el procedimiento anterior. {cite:zij-sabi-nallino-byblion p.107}."
  fr: "Al-Battani démontre que la position moyenne du Soleil peut également être déterminée à partir des années hégiriennes: l’année hégirienne est combinée à l’année en cours et consultée dans le tableau du mouvement solaire, à la ligne des années arabes combinées; la procédure décrite précédemment est ensuite appliquée. {cite:zij-sabi-nallino-byblion p.107}."
  tr: "El-Battani, güneşin konumunun Hicri yıl kullanılarak da belirlendiğini açıklıyor. Hicri yıl, mevcut yılla birlikte alınır ve bu, Arap takviminden derlenen yıllar dizisindeki güneşin hareket tablosunda bulunur. Daha sonra, yukarıda bahsedilen diyagram kullanılır. {cite:zij-sabi-nallino-byblion s.107}."
  id: "Al-Battani menjelaskan bahwa posisi matahari juga ditentukan menggunakan tahun Hijriah. Tahun Hijriah diambil bersama dengan tahun berjalan, dan ini ditemukan dalam tabel pergerakan matahari dalam deretan tahun yang dikumpulkan dari kalender Arab. Kemudian, diagram yang disebutkan di atas digunakan. {cite:zij-sabi-nallino-byblion p.107}."
