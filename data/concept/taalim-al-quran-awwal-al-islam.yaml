summary:
  ar: "قال النبي «خيركم من تعلم القرآن وعلمه»، فأول من تلا وعلم من الصحابة أبي ومعاذ وزيد وسالم، وأول من لقب بالمقرئ مصعب بن عمير في المدينة {cite:sahih-al-bukhari}."
  en: "The Prophet said 'the best of you are those who learn the Qur'an and teach it'; the first to recite and teach among the Companions were Ubayy, Mu'adh, Zayd and Salim, and the first called al-muqri' was Mus'ab ibn 'Umayr in Medina {cite:sahih-al-bukhari}."
