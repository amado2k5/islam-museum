label:
  ar: "الركاز"
  en: "Rikaz (buried treasure of the pre-Islamic period): what is owed on it (one fifth), its kinds, where it is found, to whom it belongs, and how the fifth is spent"
  ur: "رکاز ⁦(زمین میں دفن خزانہ)⁩"
  es: "Rikaz (tesoro enterrado del período preislámico): qué se debe sobre él (una quinta parte), sus tipos, dónde se encuentra, a quién pertenece y cómo se gasta esa quinta parte."
  fr: "Rikaz (trésor enfoui de la période préislamique): ce qui est dû (un cinquième), ses différentes formes, son lieu de découverte, son propriétaire et l’usage qui en est fait."
summary:
  ar: "الركاز لغة المركوز المدفون في الأرض إذا خفي، واصطلاحا عند جمهور الفقهاء ما دفنه أهل الجاهلية، ويطلق على كل مال، وخص الشافعية إطلاقه بالذهب والفضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} والمعدن غير الركاز عند الجمهور، وأما الحنفية فيطلقون الركاز على المعدن والكنز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} والواجب فيه الخمس بالإجماع لقوله: وفي الركاز الخمس، ويجب في قليله وكثيره عند الجمهور، ولا يُشترط له نصاب ولا حول عند جمهور الفقهاء، واشترطه الشافعية على المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} ويجب الخمس على المسلم والذمي والصبي والمجنون بحسب المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} وإن وجد الركاز في موات أو في أرض لا مالك لها فهو لواجده بعد الخمس، وإن وجد في ملك مملوك فهو لصاحب الأرض عند الجمهور، وقال أحمد وأبو يوسف للواجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953} ومصرف الخمس عند الحنفية والمالكية والحنابلة مصرف الغنيمة، وعند الشافعية مصرف الزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8954} وفي دار الحرب تختلف المذاهب في حكم الركاز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953}"
  en: "Rikaz in the lexicon is what is fixed and hidden in the ground; for the majority it is the treasure buried by people of the pre-Islamic period, and it may name any property, though the Shafi'is restrict it to gold and silver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} For the majority a mine is not rikaz, while the Hanafis use the word for both mines and hoards. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} One fifth is due on rikaz by agreement, following the saying that there is a fifth on buried treasure; it is due on little and much according to the majority, and the Shafi'is require a nisab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} Anyone who finds it, Muslim, dhimmi, child or madman, owes the fifth according to the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} If it is found on unowned ground, the finder takes the rest after the fifth; if it is on owned ground, most jurists give it to the owner, while Abu Yusuf and Ahmad give it to the finder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953} The fifth is spent like the booty in the Hanafi, Maliki and Hanbali views, and like zakat in the Shafi'i view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8954} In the abode of war the schools differ on the rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953}"
  ur: "رکاز زمین میں دفن جاہلیت کا خزانہ ہے، جس میں پانچواں حصہ واجب ہے، اور بعض فقہاء کے نزدیک یہ حکم کم و زیادہ سب پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8954}"
  es: "Rikaz en el léxico es lo que está fijo y oculto en la tierra; para la mayoría es el tesoro enterrado por la gente del período preislámico, y puede nombrar cualquier propiedad, aunque los shafi'is lo restringen al oro y la plata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} Para la mayoría una mina no es rikaz, mientras que los hanafíes usan la palabra tanto para minas como para tesoros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} Se debe un quinto sobre rikaz por acuerdo, siguiendo el dicho de que hay un quinto sobre tesoro enterrado; se debe sobre poco y mucho según la mayoría, y los shafi'is requieren un nisab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} Cualquiera que lo encuentre, musulmán, dhimmi, niño o loco, debe la quinta parte según las escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} Si se encuentra en terreno no perteneciente a nadie, el que lo encuentra toma el resto después de la quinta parte; si está en terreno perteneciente a alguien, la mayoría de los juristas se lo dan al dueño, mientras que Abu Yusuf y Ahmad se lo dan al que lo encuentra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953} El quinto se gasta como el botín en las visiones Hanafi, Maliki y Hanbali, y como zakat desde el punto de vista Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8954} En el lugar de la guerra, las escuelas difieren en cuanto a las reglas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953}"
  fr: "Le terme « rikaz » désigne, dans le lexique, ce qui est enfoui et fixé dans le sol. Pour la majorité, il s'agit du trésor enterré par les populations de la période préislamique, et il peut s'appliquer à tout type de propriété, bien que les chaféites le limitent à l'or et à l'argent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} La majorité considère qu'une mine n'est pas un rikaz, tandis que les hanafites utilisent ce terme pour désigner à la fois les mines et les trésors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} Un cinquième du rikaz est dû par convention, conformément à la règle du cinquième sur les trésors enfouis; ce cinquième est dû aussi bien sur les petites que sur les grandes possessions selon la majorité, et les chaféites exigent un nisab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} Quiconque trouve un objet, musulman, dhimmi, enfant ou fou, doit un cinquième, selon les écoles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} S'il est trouvé sur un terrain non attribué, le découvreur prend le reste après le cinquième; s'il est sur un terrain attribué, la plupart des juristes le donnent au propriétaire, tandis qu'Abu Yusuf et Ahmad le donnent au découvreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953} Le cinquième est dépensé comme le butin dans les vues Hanafi, Maliki et Hanbali, et comme la zakat du point de vue Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8954} Au pays de la guerre, les écoles diffèrent sur la règle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953}"
