id: concept/rikaz-fiqh
class: concept
kind: legal
label:
  ar: "الركاز"
  en: "Rikaz (buried treasure of the pre-Islamic period): what is owed on it (one fifth), its kinds, where it is found, to whom it belongs, and how the fifth is spent"
  ur: "رکاز (زمین میں دفن خزانہ)"
summary:
  ar: "الركاز لغة المركوز المدفون في الأرض إذا خفي، واصطلاحا عند جمهور الفقهاء ما دفنه أهل الجاهلية، ويطلق على كل مال، وخص الشافعية إطلاقه بالذهب والفضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} والمعدن غير الركاز عند الجمهور، وأما الحنفية فيطلقون الركاز على المعدن والكنز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} والواجب فيه الخمس بالإجماع لقوله: وفي الركاز الخمس، ويجب في قليله وكثيره عند الجمهور، ولا يُشترط له نصاب ولا حول عند جمهور الفقهاء، واشترطه الشافعية على المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} ويجب الخمس على المسلم والذمي والصبي والمجنون بحسب المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} وإن وجد الركاز في موات أو في أرض لا مالك لها فهو لواجده بعد الخمس، وإن وجد في ملك مملوك فهو لصاحب الأرض عند الجمهور، وقال أحمد وأبو يوسف للواجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953} ومصرف الخمس عند الحنفية والمالكية والحنابلة مصرف الغنيمة، وعند الشافعية مصرف الزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8954} وفي دار الحرب تختلف المذاهب في حكم الركاز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953}"
  en: "Rikaz in the lexicon is what is fixed and hidden in the ground; for the majority it is the treasure buried by people of the pre-Islamic period, and it may name any property, though the Shafi'is restrict it to gold and silver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} For the majority a mine is not rikaz, while the Hanafis use the word for both mines and hoards. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8945} One fifth is due on rikaz by agreement, following the saying that there is a fifth on buried treasure; it is due on little and much according to the majority, and the Shafi'is require a nisab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} Anyone who finds it, Muslim, dhimmi, child or madman, owes the fifth according to the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} If it is found on unowned ground, the finder takes the rest after the fifth; if it is on owned ground, most jurists give it to the owner, while Abu Yusuf and Ahmad give it to the finder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953} The fifth is spent like the booty in the Hanafi, Maliki and Hanbali views, and like zakat in the Shafi'i view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8954} In the abode of war the schools differ on the rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8953}"
  ur: "رکاز زمین میں دفن جاہلیت کا خزانہ ہے، جس میں پانچواں حصہ واجب ہے، اور بعض فقہاء کے نزدیک یہ حکم کم و زیادہ سب پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8954}"
