label: { ar: "الحِمى", en: "Hima (protected pasture)", ur: "حِمیٰ (محفوظ چراگاہ)" }
summary:
  ar: "الحِمى لغة الموضع الذي يُمنع الناس من رعيه، واصطلاحا موضع من الموات يحميه الإمام لمواشي مخصوصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7283} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7284} والأصل في الحِمى المنع لأنه تضييق على الناس، لقوله: لا حِمى إلا لله ولرسوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7284} وأجاز جمهور الفقهاء للإمام أن يحمي لخيل المجاهدين ونعم الجزية وإبل الصدقة والماشية الضعيفة بشروط، واستدلوا بأن النبي حمى النقيع لخيل المسلمين والربذة لإبل الصدقة، وبأن عمر حمى الشرف والربذة وعثمان مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7285} ومن شروط الحِمى أن يقع من الإمام أو نائبه، وأن يكون لمصلحة المسلمين، وألا يكون ملكا لأحد، وأن يكون قليلا لا يضيق على الناس؛ ولا يجوز للإمام أن يخص نفسه به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} ولا يجوز أخذ العوض من أصحاب المواشي عن مرعى الموات أو الحمى، ويندب أن ينصب الإمام أمينا يدخل دواب الضعفاء ويمنع دواب الأقوياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} ويعزّر المتعدي على الحمى بعد بلوغه النهي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287}  وما حماه النبي يثبت حمايته ولا يصح إحياؤه، وما حماه الأئمة بعده فيه خلاف عند الشافعية والحنابلة في إقرار إحيائه، والمعتمد عند الحنابلة الملك بالإحياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288} ويجوز نقض الحمى الذي حماه غير النبي إن اقتضت مصلحة المسلمين ذلك، أما حِمى النبي فلا ينقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288}"
  en: "Hima lexically is a place protected from people grazing in it; technically it is a stretch of waste land that the ruler protects for particular herds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7283} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7284} The rule is prohibition, since it narrows the common ground, on the saying 'no protection except for God and His messenger'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7284} The majority allow the ruler to protect pasture for the horses of fighters, the herds of the poll tax, the camels of zakat and weak herds under conditions; the Prophet is reported to have protected al-Naqi' for Muslim horses and al-Rabadha for zakat camels, and Umar and Uthman did the same. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7285} Conditions include that it be set by the ruler or his deputy, serve the Muslims, not be private property, and be small; the ruler may not reserve it for himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} Officials may not take payment from herders for waste or protected pasture; the ruler should appoint an agent to admit the herds of the weak and bar those of the strong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} A violator who continues after being warned may be disciplined. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287}  The protection set by the Prophet stands and reviving such land is void; for protections set by later rulers the Shafiis have two views on whether reviving confers ownership, and the Hanbalis have two views, the preferred one holding that revival confers ownership by the hadith on reviving dead land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288} A protection set by a ruler other than the Prophet may be annulled when the public interest requires it; the Prophet's protection is not annulled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288}"
  ur: "حِمیٰ لغت میں اس جگہ کو کہتے ہیں جہاں لوگوں کو چرانے سے روکا جائے، اور اصطلاح میں وہ غیر آباد زمین جسے امام مخصوص مویشیوں کے لیے محفوظ کر دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7283} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7284} اصل حِمیٰ کی ممانعت ہے کیونکہ اس میں لوگوں پر تنگی ہے، اور حدیث ہے: حِمیٰ اللہ اور اس کے رسول کے سوا کسی کے لیے نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7284} جمہور فقہاء امام کو مجاہدین کے گھوڑوں، جزیے کے مویشیوں، زکوٰۃ کے اونٹوں اور کمزور مویشیوں کے لیے شرائط کے ساتھ حِمیٰ کی اجازت دیتے ہیں؛ نبی نے نقیع کو مسلمانوں کے گھوڑوں کے لیے اور ربذہ کو زکوٰۃ کے اونٹوں کے لیے محفوظ کیا، اور عمر و عثمان رضی کے عہد میں بھی ایسا ہوا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7285} شرائط میں یہ ہے کہ امام یا اس کا نائب مقرر کرے، مسلمانوں کے مصلحت میں ہو، کسی کی ملکیت نہ ہو، اور تھوڑی ہو تاکہ لوگوں پر تنگی نہ کرے؛ امام اپنے لیے حِمیٰ مخصوص نہیں کر سکتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} مویشی والوں سے چراگاہ کا معاوضہ لینا جائز نہیں، اور امام کے لیے مستحب ہے کہ وہ کسی امین کو مقرر کرے جو کمزوروں کے جانور داخل کرے اور طاقتوروں کے جانور روکے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} خلاف ورزی کرنے والا، جب اسے منع کیا جا چکا ہو، تعزیر کا مستحق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287}  نبی کی قائم کردہ حِمیٰ باقی رہتی ہے اور اس کا احیاء باطل ہے؛ بعد کے ائمہ کی حِمیٰ میں شافعیہ اور حنابلہ کے ہاں احیاء کے ملک دینے میں دو دو اقوال ہیں، اور حنابلہ کا معتمد قول یہ ہے کہ احیاء سے ملک ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288} نبی کے سوا کسی اور کی حِمیٰ مصلحتِ مسلمین کے تقاضے پر توڑی جا سکتی ہے، جبکہ نبی کی حِمیٰ نہیں توڑی جاتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288}"
