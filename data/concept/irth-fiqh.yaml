class: concept
kind: legal
label:
  ar: "إرث"
  en: "Irth (inheritance: the science of fixed shares, its lawfulness, the gradual legislation and the estate and its debts)"
  ur: "ارث (میراث: علم الفرائض، اس کی مشروعیت، تدریجی نزول، ترکہ اور اس کے قرض)"
summary:
  ar: "الإرث في الفقه انتقال حق قابل للتجزي إلى مستحقه بعد موت من كان له ذلك بقرابة أو نحوها، وعلمه علم الفرائض، وهو من أهم العلوم بعد أركان الدين، ومشروع بالكتاب والسنة والإجماع. وكان أهل الجاهلية يتوارثون بالنسب والحلف والتبني، ثم نسخ ذلك. والتركة في اصطلاح الجمهور ما تركه الميت من أموال وحقوق، ويبدأ منها عند المالكية والشافعية بالديون المتعلقة بأعيانها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2100}"
  en: "In law, irth is a divisible right passing to its beneficiary after the death of the one who held it, by kinship or the like; its science is the science of fixed shares, among the most important sciences after the pillars of religion, and it is lawful by the Qur'an, the Sunna and consensus. The pre-Islamic people inherited by kinship, alliance and adoption, and this was later abrogated. The estate, for the majority, is what the deceased left in property and rights, and for the Malikis and Shafi'is its debts attached to particular goods are paid first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2100}"
  ur: "فقہ میں ارث وہ قابل تقسیم حق ہے جو صاحبِ حق کی موت کے بعد اس کے مستحق کو کسی رشتہ داری یا اس جیسی بنیاد پر منتقل ہوتا ہے؛ اس کا علم علم الفرائض ہے، جو دینی ارکان کے بعد سب سے اہم علوم میں سے ہے، اور قرآن، سنت اور اجماع سے مشروع ہے۔ جاہلیت کے لوگ نسب، حلف اور تبنیٰ سے وارث بنتے تھے، جو بعد میں منسوخ ہوا۔ جمہور کے نزدیک ترکہ وہ مال اور حقوق ہیں جو میت چھوڑ گیا، اور مالکیہ و شافعیہ کے نزدیک اس میں سے پہلے مخصوص چیزوں سے متعلق قرض ادا ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2100}"
