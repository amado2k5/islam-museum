label:
  ar: "إرث"
  en: "Irth (inheritance: the science of fixed shares, its lawfulness, the gradual legislation and the estate and its debts)"
  ur: "ارث ⁦(میراث: علم الفرائض، اس کی مشروعیت، تدریجی نزول، ترکہ اور اس کے قرض)⁩"
  es: "Irth (herencia: la ciencia de las participaciones fijas, su legalidad, la legislación gradual y el patrimonio y sus deudas)"
  fr: "Irth (héritage: la science des parts fixes, sa légalité, la législation progressive et le domaine et ses dettes)"
  tr: "Miras"
  id: "Warisan"
summary:
  ar: "الإرث في الفقه انتقال حق قابل للتجزي إلى مستحقه بعد موت من كان له ذلك بقرابة أو نحوها، وعلمه علم الفرائض، وهو من أهم العلوم بعد أركان الدين، ومشروع بالكتاب والسنة والإجماع. وكان أهل الجاهلية يتوارثون بالنسب والحلف والتبني، ثم نسخ ذلك. والتركة في اصطلاح الجمهور ما تركه الميت من أموال وحقوق، ويبدأ منها عند المالكية والشافعية بالديون المتعلقة بأعيانها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2100}"
  en: "In law, irth is a divisible right passing to its beneficiary after the death of the one who held it, by kinship or the like; its science is the science of fixed shares, among the most important sciences after the pillars of religion, and it is lawful by the Qur'an, the Sunna and consensus. The pre-Islamic people inherited by kinship, alliance and adoption, and this was later abrogated. The estate, for the majority, is what the deceased left in property and rights, and for the Malikis and Shafi'is its debts attached to particular goods are paid first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2100}"
  ur: "فقہ میں ارث وہ قابل تقسیم حق ہے جو صاحبِ حق کی موت کے بعد اس کے مستحق کو کسی رشتہ داری یا اس جیسی بنیاد پر منتقل ہوتا ہے؛ اس کا علم علم الفرائض ہے، جو دینی ارکان کے بعد سب سے اہم علوم میں سے ہے، اور قرآن، سنت اور اجماع سے مشروع ہے۔ جاہلیت کے لوگ نسب، حلف اور تبنیٰ سے وارث بنتے تھے، جو بعد میں منسوخ ہوا۔ جمہور کے نزدیک ترکہ وہ مال اور حقوق ہیں جو میت چھوڑ گیا، اور مالکیہ و شافعیہ کے نزدیک اس میں سے پہلے مخصوص چیزوں سے متعلق قرض ادا ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2100}"
  es: "En derecho, el derecho de sucesión es un derecho divisible que se transmite a su beneficiario tras la muerte de quien lo poseía, ya sea por parentesco o similar; su ciencia es la de las participaciones fijas, una de las más importantes después de los pilares de la religión, y es lícita según el Corán, la Sunna y el consenso. Los pueblos preislámicos heredaban por parentesco, alianza y adopción, práctica que posteriormente fue abolida. Para la mayoría, la herencia consiste en los bienes y derechos que el difunto dejó, mientras que para los malikíes y shafiíes, las deudas vinculadas a bienes específicos se pagan primero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2100}"
  fr: "En droit, l'héritage est un droit divisible transmis à son bénéficiaire après le décès du titulaire, par filiation ou autre lien similaire. Son calcul est celui des parts fixes, l'une des sciences les plus importantes après les piliers de la religion, et il est licite selon le Coran, la Sunna et le consensus. Avant l'islam, l'héritage se faisait par filiation, alliance et adoption, pratiques abolies ultérieurement. Pour la majorité, la succession correspond aux biens et droits laissés par le défunt. Chez les Malikites et les Chafi'ites, les dettes liées à des biens particuliers sont payées en premier."
  tr: "Fıkıhta miras, akrabalık veya benzeri bir şekilde sahip olan birinin ölümünden sonra hak sahibine bölünebilen bir hakkın devredilmesidir. Ona miras bilimini öğretmiştir; bu, din direklerinden sonra en önemli bilimlerden biridir ve Kur'an, Sünnet ve uzlaşma ile meşrulaştırılır. İslam öncesi dönemde insanlar soy, yemin ve evlat edinme yoluyla miras almış, ancak daha sonra bunu iptal etmişlerdir. Çoğunluk terminolojisinde mülk, ölen kişinin miras ve haklar açısından geride bıraktığı şeydir; Malikiler ve Şafi'lerden başlayarak mülkleriyle ilgili borçları vardır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2100}"
  id: "Warisan dalam yurisprudensi adalah pemindahan hak yang dapat dibagi kepada pemilik sahnya setelah kematian seseorang yang memilikinya melalui kekerabatan atau sejenisnya. Ia mengajarkan ilmu warisan, yang merupakan salah satu ilmu terpenting setelah pilar agama, dan dilegitimasi oleh Al-Qur'an, Sunnah, dan konsensus. Orang-orang pada era pra-Islam mewarisi melalui garis keturunan, sumpah, dan adopsi, tetapi kemudian membatalkannya. Dalam istilah mayoritas, harta adalah apa yang ditinggalkan almarhum dalam hal kekayaan dan hak, dimulai dari Malik dan Syafi dengan utang yang terkait dengan properti mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2100}"
