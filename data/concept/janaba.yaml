id: concept/janaba
class: concept
kind: legal
label:
  ar: الجنابة
  en: Janaba (major ritual impurity)
  ur: جنابت
summary:
  ar: "الجنابة في الفقه الحدث الأكبر الموجب للغسل، وهي في اللغة البُعد، وفي الاصطلاح تحصل بأمرين: غيبوبة الحشفة في الفرج، وخروج المني بشهوة. تبيّن الموسوعة الفقهية الكويتية اختلاف المذاهب في تفاصيلها، ومنها هل يجنب الصغير، وهل يحدث الإنزال بلا شهوة، وهل يرفعها التيمم، وما يحرم على الجنب من الصلاة والطواف ومس المصحف، وما يباح له من الذكر والنوم بعد الوضوء، وأثرها في الصوم والحج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6506} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6510} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6517}"
  en: "Janaba in fiqh is the major ritual impurity that requires a full bath (ghusl). Its literal sense is distance. It arises by two causes: the head of the penis entering the private part, and the discharge of semen with desire. The Kuwaiti encyclopedia records how the schools differ on the details, such as whether a child becomes janub, whether discharge without desire counts, whether tayammum lifts it, what a janub may not do (prayer, circumambulation, touching the Qur'an) and what he may do (remembrance, sleep after ablution), and its effect on fasting and pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6506} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6510} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6517}"
