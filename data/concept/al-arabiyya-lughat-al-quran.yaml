id: concept/al-arabiyya-lughat-al-quran
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "العربية لغة القرآن"
  en: "Arabic, the language of the Qur'an"
  ur: "عربی، قرآن کی زبان"
  fr: "L'arabe, langue du Coran"
  es: "El árabe, lengua del Corán"
  tr: "Kur'an'ın dili Arapçadır"
  id: "Bahasa Al-Qur'an adalah Arab"
summary:
  ar: "خمس عشرة آية يتحدث فيها القرآن عن لسانه: إحدى عشرة تصفه أو تصف لسانه بأنه عربي، وأربع تذكر لسان قوم الرسول ولسان النبي والأعجمين. يعلل الطبري والبغوي ذلك بأن كل رسول يُبعث بلسان قومه ليفهموا عنه، ويزيد ابن كثير أن لغة العرب أفصح اللغات وأبينها وأوسعها، ويرى القرطبي أن نزوله بلسانهم يقيم الإعجاز لأنهم أعلم الناس بأنواع الكلام."
  en: "Fifteen verses in which the Qur'an speaks of its own tongue: eleven call it, or its tongue, Arabic, and four speak of the tongue of the Messenger's people, the Prophet's tongue and the non-Arabs. Al-Tabari and al-Baghawi explain it by the rule that every messenger is sent in his people's tongue so that they understand him; Ibn Kathir adds that Arabic is the most eloquent, clearest and widest of languages; al-Qurtubi holds that its coming in their tongue establishes its inimitability, since they knew the kinds of speech best."
  ur: "قرآن پندرہ آیات میں اپنی زبان کا ذکر کرتا ہے۔ گیارہ آیات اسے یا اس کی زبان کو عربی کہتی ہیں، اور چار رسول کی قوم کی زبان، نبی کی زبان اور عجمیوں کا ذکر کرتی ہیں۔ طبری اور بغوی اس کی وجہ یہ بتاتے ہیں کہ ہر رسول اپنی قوم کی زبان میں بھیجا جاتا ہے تاکہ وہ اس کی بات سمجھیں۔ ابن کثیر کے نزدیک عربی سب زبانوں میں فصیح ترین، واضح ترین اور وسیع ترین ہے۔ قرطبی کہتے ہیں کہ ان کی زبان میں نزول اعجاز کو ثابت کرتا ہے، کیونکہ وہ کلام کی قسموں کو سب سے بہتر جانتے تھے۔"
  fr: "Quinze versets dans lesquels le Coran parle de sa propre langue : onze le disent arabe, ou disent sa langue arabe, et quatre évoquent la langue du peuple du Messager, la langue du Prophète et les non-Arabes. Al-Tabari et al-Baghawi l'expliquent par la règle que chaque messager est envoyé dans la langue de son peuple afin qu'il le comprenne ; Ibn Kathir ajoute que l'arabe est la plus éloquente, la plus claire et la plus vaste des langues ; al-Qurtubi tient que sa descente dans leur langue établit son inimitabilité, puisqu'ils connaissaient mieux que tous les genres de discours."
  es: "Quince versículos en los que el Corán habla de su propia lengua: once lo llaman árabe, o llaman árabe a su lengua, y cuatro mencionan la lengua del pueblo del Mensajero, la lengua del Profeta y a los no árabes. Al-Tabari y al-Baghawi lo explican con la regla de que todo mensajero es enviado en la lengua de su pueblo para que lo entienda; Ibn Kathir añade que el árabe es la más elocuente, clara y amplia de las lenguas; al-Qurtubi sostiene que su descenso en su lengua establece su inimitabilidad, pues ellos conocían mejor que nadie las clases de discurso."
  tr: "Kur'an'ın dilinden bahsettiği on beş ayet: on bir ayette onu veya dilini Arap olarak tanımlar, dördü ise Peygamber'in cami, Peygamber'in dili ve Arap olmayanların dili olarak belirtilir. El-Taberi ve Bağhavi, her elçinin onu anlamak için kendi halkının dilinde gönderildiğini belirtirler. İbn Kathir ekler ki, Arapların dilinin en etkileyici, açık ve en geniş dildir. El-Kurtubi, onların dilindeki vahiyinin bir mucize olduğuna inanır; çünkü onlar çeşitli konuşma biçimlerinde en bilgili kişilerdir."
  id: "Lima belas ayat dalam Al-Qur'an menyebutkan bahasa: sebelas ayat menggambarkan dia atau bahasanya sebagai Arab, empat sebagai masjid Nabi, bahasa Nabi, dan bahasa non-Arab. Al-Tabari dan Baghawi menyatakan bahwa setiap rasul dikirim dalam bahasa umatnya sendiri untuk memahaminya. Ibn Kathir menambahkan bahwa bahasa orang Arab adalah yang paling mengesankan, jelas, dan luas. Al-Qurtubi percaya bahwa wahyu dalam bahasa mereka adalah mukjizat; karena mereka adalah orang yang paling berpengetahuan dalam berbagai bentuk ucapan."
