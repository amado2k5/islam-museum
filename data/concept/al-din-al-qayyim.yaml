  en: "Sheikh Omar Abdelkafy holds that God called this religion al-qayyim, because it has the highest value and because it sets human life straight {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:11:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:13:30}."
