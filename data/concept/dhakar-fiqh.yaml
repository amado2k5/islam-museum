id: concept/dhakar-fiqh
class: concept
kind: legal
label:
  ar: "الذكر (العضو) في الفقه"
  en: "The male organ (dhakar) in the rulings"
  ur: "ذکر (عضو تناسل، فقہی احکام)"
summary:
  ar: "الذكر اسم للعضو المعروف، وخلاف الأنثى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} ويختلف الفقهاء في انتقاض الوضوء بمس الذكر باليد، فيرى المالكية والشافعية وبعض الحنابلة أنه ينتقض، والحنفية وبعض الحنابلة أنه لا ينتقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} ويجب القصاص في قطع الذكر السليم عند الجمهور، وتجب الدية الكاملة في قطعه إذا لم يجب القصاص، ويختلف الفقهاء في ذكر العنين والخصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427}"
  en: "Dhakar is the known male organ, and the opposite of female. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} The jurists differ on whether touching it with the palm breaks ablution: the Malikis, Shafi'is and one Hanbali view say it does; the Hanafis and another Hanbali view say it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} Retaliation is due for cutting a sound male organ according to the majority, and a full diya is due for it when retaliation does not apply; the schools differ over the organs of the impotent and the eunuch. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427}"
  ur: "ذکر عضو تناسل کو کہتے ہیں اور عورت کی ضد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} اس کو ہاتھ لگانے سے وضو ٹوٹنے کے بارے میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425}"
