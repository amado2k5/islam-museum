id: concept/dhakar-fiqh
class: concept
kind: legal
label:
  ar: "الذكر ⁦(العضو)⁩ في الفقه"
  en: "The male organ (dhakar) in the rulings"
  ur: "ذکر ⁦(عضو تناسل، فقہی احکام)⁩"
  es: "El órgano masculino (dhakar) en los fallos"
  fr: "L'organe masculin (dhakar) dans les jugements"
summary:
  ar: "الذكر اسم للعضو المعروف، وخلاف الأنثى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} ويختلف الفقهاء في انتقاض الوضوء بمس الذكر باليد، فيرى المالكية والشافعية وبعض الحنابلة أنه ينتقض، والحنفية وبعض الحنابلة أنه لا ينتقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} ويجب القصاص في قطع الذكر السليم عند الجمهور، وتجب الدية الكاملة في قطعه إذا لم يجب القصاص، ويختلف الفقهاء في ذكر العنين والخصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427}"
  en: "Dhakar is the known male organ, and the opposite of female. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} The jurists differ on whether touching it with the palm breaks ablution: the Malikis, Shafi'is and one Hanbali view say it does; the Hanafis and another Hanbali view say it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} Retaliation is due for cutting a sound male organ according to the majority, and a full diya is due for it when retaliation does not apply; the schools differ over the organs of the impotent and the eunuch. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427}"
  ur: "ذکر عضو تناسل کو کہتے ہیں اور عورت کی ضد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} اس کو ہاتھ لگانے سے وضو ٹوٹنے کے بارے میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425}"
  es: "Dhakar es el órgano masculino conocido, y el opuesto del femenino. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} Los juristas difieren sobre si tocarlo con la palma rompe la ablución: los malikíes, shafi'ís y una opinión hanbalí dicen que sí; los hanafíes y otra opinión hanbalí dicen que no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} Según la mayoría, se debe tomar represalia por cortar un órgano masculino sano, y se debe realizar una diya completa cuando no se aplica la represalia; las escuelas difieren sobre los órganos del impotente y del eunuco. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8426} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427}"
  fr: "Le dhakar est l'organe masculin connu, et l'opposé du féminin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} Les juristes divergent quant à savoir si le fait de le toucher avec la paume de la main annule les ablutions: les Malikites, les Shafi'ites et une école hanbalite affirment que oui; les Hanafites et une autre école hanbalite affirment que non. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} La majorité des juristes s'attend à une vengeance pour la mutilation d'un organe masculin sain, et une offrande de diya complète est due lorsque la vengeance n'est pas applicable; les écoles divergent quant au sort des organes de l'impuissance et de l'eunuque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8427}"
