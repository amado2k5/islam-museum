label: { ar: "الإعياء التمددي والورمي والقشفي عند ابن سينا", en: "Tension, inflammatory and desiccatory fatigue in the Canon", ur: "تمددی، ورمی اور قشفی تھکن قانون میں", es: "Tensión, fatiga inflamatoria y desecante en el Canon", fr: "Tension, fatigue inflammatoire et dessiccation dans le Canon", tr: "İbn Sina'da uzanma, tümör ve yassı yorgunluk", id: "Ekstensi, tumor, dan kelelahan skuamosa pada Ibn Sina" }
summary:
  ar: "يصف ابن سينا ثلاثة أصناف من الإعياء، فالتمددي يحس صاحبه كأن بدنه رض مع حرارة وتمدد، والورمي يكون فيه البدن أسخن من العادة شبيهاً بالمنتفخ، والقشفي حالة كأن البدن قد أفرط به الجفاف واليبس {cite:canon-ibn-sina-print-v1 p.243}."
  en: "Ibn Sina describes three kinds of fatigue: in the tension kind the sufferer feels as if his body were bruised, with heat and stretching; in the inflammatory kind the body is hotter than usual and like something swollen; the desiccatory is a state as if the body had been seized by excessive dryness {cite:canon-ibn-sina-print-v1 p.243}."
  es: "Ibn Sina describe tres tipos de fatiga: en la de tensión, quien la padece siente como si su cuerpo estuviera magullado, con calor y estiramiento; en la inflamatoria, el cuerpo está más caliente de lo normal y como algo hinchado; la desecante es un estado como si el cuerpo hubiera sido afectado por una sequedad excesiva {cite:canon-ibn-sina-print-v1 p.243}."
  fr: "Ibn Sina décrit trois types de fatigue: dans la fatigue de tension, le souffrant a l'impression que son corps est meurtri, avec chaleur et étirement; dans la fatigue inflammatoire, le corps est plus chaud que d'habitude et semble gonflé; la fatigue dessicante est un état comme si le corps avait été saisi par une sécheresse excessive {cite:canon-ibn-sina-print-v1 p.243}."
  ur: "ابن سینا نے تین قسم کی تھکاوٹ بیان کی ہے: تناؤ کی حالت میں مریض کو ایسا محسوس ہوتا ہے جیسے اس کے جسم کو گرمی اور کھنچاؤ کے ساتھ چوٹ لگی ہو۔ سوزش کی قسم میں جسم معمول سے زیادہ گرم ہے اور کچھ سوجن کی طرح ہے۔ خشک کرنے والی ایسی حالت ہے جیسے جسم کو ضرورت سے زیادہ خشکی نے پکڑ لیا ہو۔"
  tr: "İbn Sina üç tür yorgunluk tanımlar: esnek olan, vücudu sıcaklık ve gerilmeyle morarmış gibi hisseder; şişlik, vücudun normalden daha sıcak olduğu ve şişmeye benzeyen bir durumdur; pullu ise vücudun aşırı kuru ve sertleştiği bir durumdur {cite:canon-ibn-sina-print-v1 s.243}."
  id: "Ibn Sina menggambarkan tiga jenis kelelahan: orang yang lentur merasa tubuhnya memar karena panas dan peregangan; pembengkakan adalah kondisi di mana tubuh lebih hangat dari biasanya dan menyerupai pembengkakan; dan sisik adalah kondisi di mana tubuh menjadi sangat kering dan kaku {cite:canon-ibn-sina-print-v1 hlm.243}."
