summary:
  ar: "يصف ابن سينا ثلاثة أصناف من الإعياء، فالتمددي يحس صاحبه كأن بدنه رض مع حرارة وتمدد، والورمي يكون فيه البدن أسخن من العادة شبيهاً بالمنتفخ، والقشفي حالة كأن البدن قد أفرط به الجفاف واليبس {cite:canon-ibn-sina-print-v1 p.243}."
  en: "Ibn Sina describes three kinds of fatigue: in the tension kind the sufferer feels as if his body were bruised, with heat and stretching; in the inflammatory kind the body is hotter than usual and like something swollen; the desiccatory is a state as if the body had been seized by excessive dryness {cite:canon-ibn-sina-print-v1 p.243}."
