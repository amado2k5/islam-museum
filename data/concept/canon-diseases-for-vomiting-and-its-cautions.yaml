label: { ar: "أمراض ينفعها القيء ومحاذيره عند ابن سينا", en: "Diseases helped by vomiting and its cautions in the Canon", ur: "قانون میں قے سے فائدہ اٹھانے والی بیماریاں اور احتیاطیں" }
summary:
  ar: "يذكر ابن سينا أن أولى ما يُستعمل فيه القيء الأمراض المزمنة العسيرة كالاستسقاء والمالنخوليا والصرع والجذام والنقرس وعرق النسا، وأن القيء قد يجلب أمراضاً كالطرش، فلا يُتبع بالفصد بل يؤخر ثلاثة أيام، ولا تُقيَّأ الحبلى {cite:canon-ibn-sina-print-v1 p.287}."
  en: "Ibn Sina says vomiting is most fittingly used in hard, long-lasting diseases such as dropsy, melancholia, epilepsy, leprosy, gout and sciatica, that it may bring diseases such as deafness, that venesection should not follow it at once but wait three days, and that a pregnant woman should not be made to vomit {cite:canon-ibn-sina-print-v1 p.287}."
