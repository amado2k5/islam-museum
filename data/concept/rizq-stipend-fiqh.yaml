label:
  ar: "الرزق ⁦(الأرزاق من بيت المال)⁩"
  en: "Rizq (stipends from the treasury): who is paid, the register of the fighters, and the three groups the imam supports"
  ur: "رزق ⁦(بیت المال کا وظیفہ)⁩"
  es: "Rizq (estipendios del tesoro): quién recibe el pago, el registro de los combatientes y los tres grupos que apoya el imán."
  fr: "Rizq (allocations du trésor public): qui est rémunéré, le registre des combattants et les trois groupes soutenus par l’imam."
  tr: "Al-Irzq (hazineden geçim kaynağı)"
  id: "Al-Irzq (mata pencaharian dari kas negara)"
summary:
  ar: "الرزق في اللغة العطاء دنيويا كان أو أخرويا، وفي اصطلاح الفقهاء ما يُفرض في بيت المال بقدر الحاجة والكفاية مشاهرة أو مياومة، ويُفرق عنه العطاء الذي يُفرض لكل سنة بحسب الصبر والغناء في أمر الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} ويجوز للقضاة والعمال والولاة الرزق من بيت المال، وقال القرافي إنه يجوز فيه الدفع والقطع والتقليل والتكثير بحسب المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8727} وينبغي للإمام أن يضع ديوانا للمرتزقة، ويعطي كل واحد قدر حاجته، ويقدم قريشا، ولا يثبت في الديوان الصبي والمجنون والمرأة والضعيف الذي لا يصلح للغزو، ويفرق الأرزاق كل عام مرة، ويعطى الورثة بعد الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} ومن يرعاه الإمام ثلاثة أصناف: المحتاجون، والذين يقومون بأركان الدين كالقضاة والحكام والمفتين، والذين لهم طائفة من مال بيت المال كبني هاشم وبني المطلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8730}"
  en: "Rizq in the lexicon is provision, given in this world or the next; in the jurists' usage it is what is fixed from the treasury by need and sufficiency, monthly or daily, and it is distinguished from 'ata' which is set yearly by a person's service and merit in religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} Judges, agents and governors may be paid from the treasury; al-Qarafi holds that such pay may be cut, reduced, increased or changed as the public interest requires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8727} The imam should keep a register of the paid fighters, give each what he needs, put the Quraysh first, and enter no child, madman, woman or weak man unfit for war; he pays once a year and may pay monthly, and gives the dead man's wife and young children enough. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} Those the imam supports are three groups: the needy; those who uphold the pillars of religion, such as judges, rulers and muftis, who must be relieved so that they can devote themselves to it; and those given a share of the treasury for their standing, such as the Banu Hashim and Banu al-Muttalib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8730}"
  ur: "رزق بیت المال سے مقرر وظیفہ ہے جو ضرورت اور کفایت کے مطابق دیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} امام کو سپاہیوں کا رجسٹر رکھنا، ہر ایک کو ضرورت کے مطابق دینا اور قریش کو مقدم رکھنا چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729}"
  es: "Rizq en el léxico es provisión, dada en este mundo o en el próximo; en el uso de los juristas es lo que se fija del tesoro según la necesidad y suficiencia, mensual o diariamente, y se distingue de 'ata' que se establece anualmente según el servicio y mérito de una persona en la religión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} Los jueces, agentes y gobernadores pueden ser pagados del tesoro; al-Qarafi sostiene que dicho pago puede ser recortado, reducido, aumentado o modificado según lo requiera el interés público. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8727} El imán debe llevar un registro de los combatientes pagados, dar a cada uno lo que necesita, poner a los Quraysh primero y no incluir a ningún niño, loco, mujer u hombre débil no apto para la guerra; paga una vez al año y puede pagar mensualmente, y da suficiente a la esposa y los hijos pequeños del hombre muerto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} Aquellos a quienes el imán apoya son tres grupos: los necesitados; aquellos que sostienen los pilares de la religión, como jueces, gobernantes y muftíes, quienes deben ser aliviados para que puedan dedicarse a ella; y aquellos a quienes se les dio una parte del tesoro por su posición, como los Banu Hashim y Banu al-Muttalib. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8730}"
  fr: "Le terme « rizq » désigne, dans le lexique, la subsistance, accordée dans ce monde ou dans l'autre. Dans l'usage juriste, il s'agit de la somme fixée par le trésor public en fonction des besoins et des ressources, mensuellement ou quotidiennement. Ce terme se distingue de l'« ata », qui est fixée annuellement selon les services et le mérite religieux d'une personne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} Les juges, les agents et les gouverneurs peuvent être rémunérés par le trésor public; al-Qarafi soutient que cette rémunération peut être diminuée, augmentée ou modifiée selon l'intérêt public. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8727} L'imam doit tenir un registre des combattants rémunérés, donner à chacun ce dont il a besoin, donner la priorité aux Qurayshites et n'y inscrire ni enfant, ni fou, ni femme, ni homme faible inapte à la guerre; il paie une fois par an et peut payer mensuellement, et donne suffisamment à la veuve et aux jeunes enfants du défunt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} L'imam soutient trois groupes: les nécessiteux; ceux qui défendent les piliers de la religion, tels que les juges, les dirigeants et les muftis, qui doivent être soulagés afin qu'ils puissent s'y consacrer; et ceux qui reçoivent une part du trésor pour leur statut, comme les Banu Hashim et les Banu al-Muttalib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8730}"
  tr: "Dilbilimde geçim, dünyevi ya da öteki dünyadan olmak üzere vermek anlamına gelir. Fıkıh terminolojisinde, kamu hazinesinde ihtiyaç ve yeterlilik miktarına göre günlük ya da günlük olarak dayatılan şeydir. Bağışlamak, her yıl için dini konularda sabır ve refaha göre dayatılan şeyden ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8726} Hakimler, valiler ve valiler kamu hazinesinden geçim sağlayabilirler. Al-Karafi, faize göre ödemenin, kesmenin, azaltmanın veya artırmanın caiz olduğunu söyledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8727} İmam paralı askerler için bir kayıt tutmalı, her birine ihtiyaçlarına göre vermeli, Qureyş sunmalı ve diwanda çocuk, akıl hastası, kadın veya istilaya uygun olmayan zayıfları tutmamalıdır. Yılda bir kez erzak dağıtır ve ölümünden sonra varislere verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8729} İmamın bakımında olanlar üç tiptir: ihtiyacı olanlar, hakimler, yöneticiler ve müfti gibi dinin temel direklerini yürütenler; ve Banu Haşim ile Banu Muttalib gibi kamu fonuna sahip olanlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8730}"
  id: "Dalam linguistik, kehidupan berarti memberi, baik duniawi maupun duniawi. Dalam istilah hukum, ini adalah apa yang dipaksakan dalam kas negara sesuai dengan kebutuhan dan kecukupan, baik harian maupun harian. Memberi dibedakan dari itu, yang diwajibkan setiap tahun sesuai dengan kesabaran dan kemakmuran dalam urusan agama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8726} Hakim, gubernur, dan gubernur dapat memperoleh penghidupan dari kas negara. Al-Qarafi berkata bahwa diperbolehkan membayar, memotong, mengurangi, atau menambah sesuai bunga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8727} Imam harus membuat daftar untuk tentara bayaran, memberikan masing-masing sesuai kebutuhan, mempersembahkan Quraish, dan tidak menyimpan anak, orang gila, wanita, atau yang lemah di dalam diwan. Ia membagikan makanan setahun sekali dan memberikannya kepada ahli waris setelah meninggal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8729} Mereka yang berada di bawah pengawasan Imam ada tiga jenis: mereka yang membutuhkan, mereka yang menjalankan pilar agama seperti hakim, penguasa, dan mufti, serta mereka yang memiliki dana publik seperti Banu Hashim dan Banu Muttalib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8730}"
