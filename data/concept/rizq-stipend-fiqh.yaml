id: concept/rizq-stipend-fiqh
class: concept
kind: legal
label:
  ar: "الرزق (الأرزاق من بيت المال)"
  en: "Rizq (stipends from the treasury): who is paid, the register of the fighters, and the three groups the imam supports"
  ur: "رزق (بیت المال کا وظیفہ)"
summary:
  ar: "الرزق في اللغة العطاء دنيويا كان أو أخرويا، وفي اصطلاح الفقهاء ما يُفرض في بيت المال بقدر الحاجة والكفاية مشاهرة أو مياومة، ويُفرق عنه العطاء الذي يُفرض لكل سنة بحسب الصبر والغناء في أمر الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} ويجوز للقضاة والعمال والولاة الرزق من بيت المال، وقال القرافي إنه يجوز فيه الدفع والقطع والتقليل والتكثير بحسب المصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8727} وينبغي للإمام أن يضع ديوانا للمرتزقة، ويعطي كل واحد قدر حاجته، ويقدم قريشا، ولا يثبت في الديوان الصبي والمجنون والمرأة والضعيف الذي لا يصلح للغزو، ويفرق الأرزاق كل عام مرة، ويعطى الورثة بعد الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} ومن يرعاه الإمام ثلاثة أصناف: المحتاجون، والذين يقومون بأركان الدين كالقضاة والحكام والمفتين، والذين لهم طائفة من مال بيت المال كبني هاشم وبني المطلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8730}"
  en: "Rizq in the lexicon is provision, given in this world or the next; in the jurists' usage it is what is fixed from the treasury by need and sufficiency, monthly or daily, and it is distinguished from 'ata' which is set yearly by a person's service and merit in religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} Judges, agents and governors may be paid from the treasury; al-Qarafi holds that such pay may be cut, reduced, increased or changed as the public interest requires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8727} The imam should keep a register of the paid fighters, give each what he needs, put the Quraysh first, and enter no child, madman, woman or weak man unfit for war; he pays once a year and may pay monthly, and gives the dead man's wife and young children enough. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} Those the imam supports are three groups: the needy; those who uphold the pillars of religion, such as judges, rulers and muftis, who must be relieved so that they can devote themselves to it; and those given a share of the treasury for their standing, such as the Banu Hashim and Banu al-Muttalib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8730}"
  ur: "رزق بیت المال سے مقرر وظیفہ ہے جو ضرورت اور کفایت کے مطابق دیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729} امام کو سپاہیوں کا رجسٹر رکھنا، ہر ایک کو ضرورت کے مطابق دینا اور قریش کو مقدم رکھنا چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8728} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8729}"
