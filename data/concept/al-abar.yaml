label: { ar: "الآبار", en: "Wells (fiqh of wells)" }
summary:
  ar: "البئر، جمع آبار، موضع لأحكام تخص مائها عند الفقهاء: طهارته، وحريمها عند إحياء الموات، وتعلق حق الناس بمائها، وحد الكثرة فيها. تعرض الموسوعة الكويتية كل مسألة منسوبة إلى أصحابها: يحدد الحنفية والحنابلة حريم البئر بالأذرع، ويقدّره المالكية والشافعية بما لا يضيّق على الوارد ولا على المواشي. وفي حق الناس في ماء البئر اتجاهان، أحدهما يثبت للناس حقاً فيه، والآخر يجعله خالصاً لصاحبه؛ وتعرضهما الموسوعة دون أن ترجّح بينهما في الصفحات المقروءة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1353}"
  en: "For the jurists a well (pl. abar) is a subject with rules on its water: its purity, the protected zone around it when dead land is revived, the public claim on its water, and the threshold of abundance. The Kuwaiti encyclopedia states each question with its attributed positions: the Hanafis and Hanbalis set the protected zone in cubits, while the Malikis and Shafi'is measure it by what does not narrow the water's access or the animals' resting places. On whether the public has a claim to a well's water there are two positions, one granting it and one making the water the owner's alone; the pages read present both without choosing between them."
