summary:
  ar: "البئر، جمع آبار، موضع لأحكام تخص مائها عند الفقهاء: طهارته، وحريمها عند إحياء الموات، وتعلق حق الناس بمائها، وحد الكثرة فيها. تعرض الموسوعة الكويتية كل مسألة منسوبة إلى أصحابها: يحدد الحنفية والحنابلة حريم البئر بالأذرع، ويقدّره المالكية والشافعية بما لا يضيّق على الوارد ولا على المواشي. وفي حق الناس في ماء البئر اتجاهان، أحدهما يثبت للناس حقاً فيه، والآخر يجعله خالصاً لصاحبه؛ وتعرضهما الموسوعة دون أن ترجّح بينهما في الصفحات المقروءة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1353}"
  en: "For the jurists a well (pl. abar) is a subject with rules on its water: its purity, the protected zone around it when dead land is revived, the public claim on its water, and the threshold of abundance. The Kuwaiti encyclopedia states each question with its attributed positions: the Hanafis and Hanbalis set the protected zone in cubits, while the Malikis and Shafi'is measure it by what does not narrow the water's access or the animals' resting places. On whether the public has a claim to a well's water there are two positions, one granting it and one making the water the owner's alone; the pages read present both without choosing between them."
  fr: "Pour les juristes, le puits (pl. abar) est un sujet doté de règles sur son eau : sa pureté, le périmètre protégé qui l’entoure lors de la vivification d’une terre sans maître, le droit des gens sur son eau et le seuil d’abondance. L’encyclopédie koweïtienne expose chaque question avec les positions attribuées à leurs tenants : les hanafites et les hanbalites fixent le périmètre protégé en coudées, tandis que les malikites et les chaféites le mesurent selon ce qui ne restreint ni l’accès à l’eau ni les lieux de repos des animaux. Sur la question de savoir si les gens ont un droit sur l’eau d’un puits, il existe deux positions, l’une qui le leur accorde et l’autre qui réserve l’eau au seul propriétaire ; les pages lues présentent les deux sans trancher entre elles."
  es: "Para los juristas, un pozo (plural: abar) es un sujeto con normas que rigen su agua: su pureza, la zona protegida a su alrededor cuando se recupera tierra muerta, el derecho público sobre ella y el umbral de abundancia. La enciclopedia kuwaití plantea cada cuestión con sus respectivas posturas: los hanafíes y hanbalíes establecen la zona protegida en codos, mientras que los malikíes y shafiíes la miden según lo que no restrinja el acceso al agua ni los lugares de descanso de los animales. Respecto a si el público tiene derecho al agua de un pozo, existen dos posturas: una que lo concede y otra que considera que el agua pertenece exclusivamente al propietario; las páginas consultadas presentan ambas sin decantarse por ninguna."
  ur: "فقہا کے نزدیک کنواں (pl. abar) ایک ایسا موضوع ہے جس کے پانی کے اصول ہیں: اس کی پاکیزگی، مردہ زمین کے زندہ ہونے پر اس کے ارد گرد محفوظ علاقہ، اس کے پانی پر عوام کا دعویٰ، اور کثرت کی دہلیز۔ کویتی انسائیکلوپیڈیا ہر سوال کو اس کے منسوب مقامات کے ساتھ بیان کرتا ہے: حنفیہ اور حنبلی محفوظ زون کو ہاتھ میں متعین کرتے ہیں، جبکہ مالکیہ اور شافعی اس کی پیمائش اس بات سے کرتے ہیں کہ پانی کی رسائی یا جانوروں کے آرام کی جگہوں کو تنگ نہیں کیا جاتا ہے۔ کنویں کے پانی پر عوام کا دعویٰ ہے یا نہیں اس کے بارے میں دو حیثیتیں ہیں، ایک اسے دینا اور دوسرا پانی کو صرف مالک کا بنانا۔ پڑھے گئے صفحات ان کے درمیان انتخاب کیے بغیر دونوں کو پیش کرتے ہیں۔"
  tr: "Kuyu kelimesinin çoğulu, hukukçulara göre suyun suyla ilgili kararların yeridir: saflığı, ölü bedenleri diriltirken kutsallığı, insanların suyuna olan hakkı ve bolluk sınırı. Kuveyt Ansiklopedisi, yazarlarına atfedilen her konuyu sunar: Hanafi ve Hanbaliler kuyunun kutsallığını 'udhra' ile tanımlar, Malikiler ve Şafi'ler ise kuyunun gelen veya hayvanları kısıtlamadığını düşünürler. İnsanların kuyunun suyuna olan haklarının iki yönü vardır: biri insanların kuyu üzerindeki hakkını teyit eder, diğeri ise kuyunun sahibine özel hale getirir; ansiklopedi bunları okunan sayfalarda aralarında tartmadan sunar. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.1351} {cite:fiqh-mawsua-kuveytiyya-noor-v3 s.1352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1353}"
  id: "Menurut ahli hukum, jamak kata sumur merujuk pada keputusan yang berkaitan dengan air: kemurnian, kesucian saat membangkitkan mayat, hak orang atas air, dan batas kelimpahan. Ensiklopedia Kuwait menyajikan setiap topik yang dikaitkan dengan penulisnya: Hanafi dan Hanbali mendefinisikan kesucian sumur sebagai 'udhra,' sementara Maliki dan Shafi'i percaya sumur tidak membatasi masuknya atau hewan. Ada dua aspek dalam hak orang atas air sumur: satu menegaskan hak orang atas sumur, dan yang lain menjadikannya eksklusif untuk pemilik sumur; ensiklopedia menyajikan ini tanpa memberikan berat pada halaman yang dibaca. {sitasi:fiqh-mawsua-kuveytiyya-noor-v3 hlm.1351} {sitasi:fiqh-mawsua-kuveytiyya-noor-v3 hlm.1352} {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 p.1353}"
