summary:
  ar: "العليق في الكتاب نبات معروف ينقل عن ديسقوريدوس أنه غير العوسج، بارد يابس وثمرته النضيجة فيها حرارة ما، قابض مجفف بجميع أجزائه، ينفع من القروح والقلاع ونفث الدم ويقوي المعدة الضعيفة ويفتت الحصى، وفي الكتاب نقل موسوم في سيلان الرحم {cite:canon-ibn-sina-print-v1 p.616}"
  en: "Ulayq is in the book a well-known plant which, as reported from Dioscorides, is other than awsaj, cold and dry, its ripe fruit having some heat; astringent and drying in all its parts, it benefits ulcers, thrush and spitting of blood, strengthens a weak stomach and breaks up stones, and the book gives a labelled listing on a discharge from the womb {cite:canon-ibn-sina-print-v1 p.616}"
  ur: "علیق کتاب میں ایک معروف پودا ہے جس کے بارے میں دیسقوریدوس سے نقل ہے کہ یہ عوسج سے الگ ہے، سرد خشک اور اس کے پکے ہوئے پھل میں کچھ گرمی ہے؛ اپنے تمام اجزاء میں قابض اور خشک کرنے والا، زخموں، چھالوں اور خون تھوکنے میں فائدہ دیتا ہے، کمزور معدے کو قوت دیتا اور پتھری کو توڑتا ہے، اور کتاب میں رحم سے رطوبت کے بہنے کے بارے میں ایک موسوم نقل ہے {cite:canon-ibn-sina-print-v1 p.616}۔"
  es: "En el libro se menciona una planta muy conocida que, según Dioscórides, es distinta del awsaj, fría y seca, aunque su fruto maduro tiene cierto calor; es astringente y secante en todas sus partes, beneficiosa para las úlceras, la candidiasis y la sangre en las venas, fortalece el estómago débil y disuelve los cálculos. El libro también incluye una lista con etiquetas para las secreciones uterinas {cite:canon-ibn-sina-print-v1 p.616}."
  fr: "L'oulayq est mentionné dans le livre comme une plante bien connue qui, selon Dioscoride, est différente de l'awsaj, froide et sèche, son fruit mûr ayant une certaine chaleur; astringente et asséchante dans toutes ses parties, elle est bénéfique pour les ulcères, le muguet et les crachats de sang, fortifie un estomac faible et dissout les calculs. Le livre donne également une liste légendée concernant les pertes utérines {cite:canon-ibn-sina-print-v1 p.616}"
  tr: "Kitaptaki böğürtlen, Dioskorid'den bildirilen iyi bilinen bir bitkidir; bu bitki sukulent, soğuk, kuru ve olgun, biraz ısılı bir meyve değildir. Tüm kısımları büzücü ve kurudur. Ülserler, ardıçklar ve kan yavruları için faydalıdır, zayıf mideyi güçlendirir ve taşları parçalar. Kitapta 'Uterin Dizenteri' başlıklı bir anlatı vardır {cite:canon-ibn-sina-print-v1 s.616}"
  id: "Blackberry dalam buku ini adalah tanaman terkenal yang dilaporkan oleh Dioscorides bahwa ia bukan buah yang sukulen, dingin, kering, dan matang dengan sedikit pedas. Buah ini bersifat astringen dan kering di semua bagiannya. Buah ini bermanfaat untuk tukak lambung, burung thrush, dan anak darah, memperkuat perut yang lemah, dan memecah batu. Dalam buku tersebut, terdapat narasi berjudul 'Uterine Dysentery' {cite:canon-ibn-sina-print-v1 hlm.616}"
