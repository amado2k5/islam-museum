id: concept/al-basmala
class: concept
kind: term
label:
  ar: "البسملة"
  en: "Al-basmala (the formula bismillah)"
  ur: "بسم اللہ (بسملہ)"
summary:
  ar: "قول «بسم الله الرحمن الرحيم» الذي يفتتح به القرآن وكل عمل المؤمن. يرى الشعراوي أن القرآن نزل مقروناً باسم الله، وأن القارئ يبدأ بالبداية نفسها التي أرادها الله، وأن المؤمن يستعين بالاسم الجامع لصفات الكمال على ما لا قدرة له عليه، ويحذر بذكره من كل عمل يغضب الله {cite:tafsir-sharawi-khawatir-scan p.41} {cite:tafsir-sharawi-khawatir-scan p.46} {cite:tafsir-sharawi-khawatir-scan p.47}. هذا تفسيره ويُنسب إليه."
  en: "The formula 'In the name of God, the Merciful, the Compassionate', with which the Quran and every believer's act begin. Sha'rawi holds that the Quran came down bound to God's name, that the reader begins with the beginning God intended, and that the believer seeks God's power for what he cannot do, using the name that unites every attribute of perfection, and that it restrains him from acts that displease God {cite:tafsir-sharawi-khawatir-scan p.41} {cite:tafsir-sharawi-khawatir-scan p.46} {cite:tafsir-sharawi-khawatir-scan p.47}. This is Sha'rawi's reading and is attributed to him."
  ur: "وہ کلمہ «بسم اللہ الرحمن الرحیم» جس سے قرآن اور مومن کا ہر عمل شروع ہوتا ہے۔ شعراوی کے مطابق قرآن اللہ کے نام کے ساتھ نازل ہوا، قاری اسی ابتدا سے شروع کرتا ہے جو اللہ نے چاہی، اور مومن ہر ایسے کام کے لیے مدد مانگتا ہے جس پر اسے خود قدرت نہیں، اور یہی نام اسے اللہ کی ناپسندیدہ کاموں سے روکتا ہے {cite:tafsir-sharawi-khawatir-scan p.41} {cite:tafsir-sharawi-khawatir-scan p.46} {cite:tafsir-sharawi-khawatir-scan p.47}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
