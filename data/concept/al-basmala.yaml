issue:
  ar: "لماذا يبدأ المؤمن كل عمل وقراءة القرآن بقول: بسم الله؟"
  en: "Why does the believer begin every act and each recitation of the Quran with the formula bismillah?"
  ur: "مومن ہر کام اور قرآن کی تلاوت کا آغاز بسم اللہ سے کیوں کرتا ہے؟"
