label: { ar: "نوعا الامتلاء عند ابن سينا", en: "The two kinds of fullness in the Canon", ur: "بھراؤ کی دو قسمیں قانون میں", es: "Los dos tipos de plenitud en el Canon", fr: "Les deux types de plénitude dans le Canon" }
summary:
  ar: "يقسم ابن سينا في الفصل السادس الامتلاء إلى امتلاء بحسب الأوعية وامتلاء بحسب القوة، ويذكر خطر كل منهما وعلاجه {cite:canon-ibn-sina-print-v1 p.164}."
  en: "In the sixth chapter Ibn Sina divides fullness into fullness in respect of the vessels and fullness in respect of the faculty, and gives the danger of each and the remedy {cite:canon-ibn-sina-print-v1 p.164}."
  es: "En el sexto capítulo, Ibn Sina divide la plenitud en plenitud con respecto a los vasos y plenitud con respecto a la facultad, y da el peligro de cada una y el remedio {cite:canon-ibn-sina-print-v1 p.164}."
  fr: "Dans le sixième chapitre, Ibn Sina divise la plénitude en plénitude en ce qui concerne les vaisseaux et plénitude en ce qui concerne la faculté, et donne le danger de chacune et le remède {cite:canon-ibn-sina-print-v1 p.164}."
  ur: "چھٹے باب میں ابن سینا نے برتنوں کے سلسلے میں مکملیت کو مکمل اور فیکلٹی کے لحاظ سے مکملت میں تقسیم کیا ہے اور ہر ایک کے خطرے اور علاج کا حوالہ دیا ہے۔"
