label: { ar: "مدى جدول الأوتار والأوتار التامة في الزيج الصابي", en: "The range of the chord table and the full chords", ur: "اوتار کے جدول کا دائرہ اور وتر تام", es: "El rango de la tabla de acordes y los acordes completos", fr: "L'étendue du tableau d'accords et les accords complets", tr: "Sabi astronomik tablolarındaki akorlar ve mükemmel akorlar tablosunun aralığı", id: "Rentang tabel akord dan akord sempurna dalam tabel astronomi Sabi." }
summary:
  ar: "يختم البتاني باب الأوتار بأن لا حاجة إلى أكثر مما وضع، فيكفي في معرفة الأوتار المنصفة معرفة أوتار ما بين درجة وتسعين درجة، لأن ما جاوز التسعين إلى المائة والثمانين فوتره مثل وتر التسعين معكوساً، وأن الأوتار التامة تُعرف من نصف القوس بأن يؤخذ نصف تلك الدرج فيعرف وتره المنصف من الجدول ويضاعف. {cite:zij-sabi-nallino-byblion p.21}."
  en: "Al-Battani closes the chapter on chords by saying no more is needed than he has set down: for the half-chords it is enough to know those of the degrees from one to ninety, since what passes ninety up to 180 has a chord like that of ninety read in reverse, and the full chords come from half the arc, taking half those degrees, reading its half-chord from the table and doubling it. {cite:zij-sabi-nallino-byblion p.21}."
  ur: "البتانی اوتار کے باب کو یوں ختم کرتے ہیں کہ جو رکھا گیا اس سے زیادہ کی ضرورت نہیں؛ منصف اوتار جاننے کے لیے ایک سے نوے درجے کے اوتار کا جاننا کافی ہے، کیونکہ نوے سے ایک سو اسّی تک کی قوس کا وتر نوے کے وتر کی طرح الٹا ہوتا ہے، اور تام اوتار قوس کے نصف سے معلوم ہوتے ہیں: ان درجوں کا نصف لے کر جدول سے اس کا منصف وتر پڑھیں اور اسے دگنا کریں۔ {cite:zij-sabi-nallino-byblion p.21}۔"
  es: "Al-Battani cierra el capítulo sobre acordes diciendo que no se necesita más de lo que ya ha expuesto: para los semicordios basta con conocer los de los grados del uno al noventa, puesto que lo que va del noventa al 180 tiene un acorde como el del noventa leído al revés, y los acordes completos provienen de la mitad del arco, tomando la mitad de esos grados, leyendo su semicordio de la tabla y duplicándolo. {cite:zij-sabi-nallino-byblion p.21}."
  fr: "Al-Battani conclut le chapitre sur les accords en affirmant que tout ce qu'il a exposé est suffisant: pour les demi-accords, il suffit de connaître ceux des degrés de un à quatre-vingt-dix, car de quatre-vingt-dix à cent quatre-vingt-dix, l'accord est l'inverse de celui de quatre-vingt-dix; quant aux accords complets, ils proviennent de la moitié de l'arc, en prenant la moitié de ces degrés, en lisant le demi-accord correspondant dans le tableau et en le doublant. {cite:zij-sabi-nallino-byblion p.21}."
  tr: "Al-Battani, akorlar hakkındaki bölümü, verilenlerden daha fazlasına gerek olmadığını belirterek sonlandırıyor. Bir derece ile doksan derece arasındaki akorları bilmek, orta nokta akorlarını belirlemek için yeterlidir, çünkü doksan ile yüz seksen arasındaki her şey, doksan derecelik akorun tersi gibi bir akora sahiptir. Mükemmel akorlar, yayın yarısından, bu derecelerin yarısını alıp, tabloda orta nokta akorunu bulup ikiye katlayarak belirlenir. {cite:zij-sabi-nallino-byblion s.21}."
  id: "Al-Battani menyimpulkan bab tentang akord dengan menyatakan bahwa tidak ada lagi yang dibutuhkan selain apa yang telah disediakan. Mengetahui akord antara satu derajat dan sembilan puluh derajat sudah cukup untuk menentukan akord titik tengah, karena apa pun di atas sembilan puluh hingga seratus delapan puluh memiliki akord seperti akord sembilan puluh derajat dalam arah terbalik. Akord sempurna ditentukan dari setengah busur dengan mengambil setengah dari derajat tersebut, kemudian menemukan akord titik tengahnya dalam tabel dan menggandakannya. {cite:zij-sabi-nallino-byblion p.21}."
