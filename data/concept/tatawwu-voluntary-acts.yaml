label:
  ar: "التطوع"
  en: "Tatawwu (voluntary acts beyond the obligatory, in worship and in giving)"
  ur: "تطوع (نفل اور نفلی عبادات و نیکیاں)"
summary:
  ar: "التطوع التبرع، وهو عند الفقهاء ما زاد على الفرائض والواجبات، ويطلق عليه السنة والمندوب والنفل والمستحب بمعنى واحد عند جمهورهم. وفيه ما له نظير من العبادات كالصلاة والصيام والزكاة والحج والجهاد، وما هو في غير العبادات كالإنفاق والإعارة والوقف والوصية والقرض. والأصل فيه الندب، وقد يعرض له الوجوب كبذل الطعام للمضطر، وقد يحرم أو يكره في أوقات النهي. وللمتطوع شروط: الإسلام والعقل والتمييز في العبادات، والعقل والبلوغ والرشد في التبرع. وأفضل التطوع الصلاة عند المالكية والشافعية، والجهاد عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5319}"
  en: "Tatawwu is giving freely; for the jurists it is what goes beyond the obligatory and the required, and the sunna, the recommended, the nafl and the desirable are used as the same word by most of them. It has counterparts among acts of worship, such as prayer, fasting, zakat, pilgrimage and holy war, and it covers giving, lending, endowment, bequest and lending of goods. It is recommended as a rule, and may become obligatory, such as giving food to one in dire need, or forbidden or disliked at times of prohibition. Its doer must be a Muslim, sane and discerning in worship, and sane, adult and of sound judgement in giving. The Malikis and Shafiis hold prayer the best of bodily worship, the Hanbalis holy war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5319}"
