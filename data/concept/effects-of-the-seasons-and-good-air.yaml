id: concept/effects-of-the-seasons-and-good-air
class: concept
kind: scientific
label: { ar: "أحكام الفصول والهواء الجيد عند ابن سينا", en: "The rulings of the seasons and good air in the Canon", ur: "قانون میں موسموں کے اثرات اور اچھی ہوا", es: "Las normas sobre las estaciones y el buen aire en el Canon", fr: "Les règles des saisons et du bon air dans le Canon" }
summary:
  ar: "يبين ابن سينا أن كل فصل يوافق من به مزاج مناسب له، وأن تقابل الفصول المنحرفة قد يعدل الأبدان، وأن السنة المستمرة على كيفية واحدة رديئة، وأصح الأزمنة خريف مطير وشتاء معتدل، ثم يصف الهواء الجيد في جوهره {cite:canon-ibn-sina-print-v1 pp.117-118}."
  en: "Ibn Sina shows that each season suits those with a temperament proper to it, that the meeting of seasons that have strayed in opposite ways can set bodies right, that a year that holds one quality throughout is bad, that the healthiest times are a rainy autumn and a moderate winter, and then describes air good in its substance {cite:canon-ibn-sina-print-v1 pp.117-118}."
  es: "Ibn Sina muestra que cada estación es adecuada para aquellos con un temperamento apropiado para ella, que la confluencia de estaciones que se han desviado en direcciones opuestas puede reequilibrar los cuerpos, que un año que mantiene una sola cualidad de principio a fin es malo, que las épocas más saludables son un otoño lluvioso y un invierno moderado, y luego describe el aire como bueno en su sustancia {cite:canon-ibn-sina-print-v1 pp.117-118}."
  fr: "Ibn Sina montre que chaque saison convient à ceux qui ont un tempérament qui lui est propre, que la rencontre de saisons qui se sont égarées dans des directions opposées peut remettre les corps en ordre, qu'une année qui conserve une seule qualité tout au long est mauvaise, que les périodes les plus saines sont un automne pluvieux et un hiver modéré, puis décrit l'air bon dans sa substance {cite:canon-ibn-sina-print-v1 pp.117-118}."
  ur: "ابن سینا ظاہر کرتا ہے کہ ہر موسم اپنے مزاج والوں کے موافق ہوتا ہے، کہ موسموں کی ملاقات جو مخالف طریقوں سے بھٹک گئی ہو جسم کو درست کر سکتی ہے، کہ ایک سال جس میں ایک ہی خوبی ہو، وہ خراب ہے، یہ کہ صحت مند ترین موسم خزاں اور معتدل موسم ہے، اور پھر اس کے مادہ میں ہوا کی اچھائی کو بیان کرتا ہے۔ صفحہ 117-118}۔"
