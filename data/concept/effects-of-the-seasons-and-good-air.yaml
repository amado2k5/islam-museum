summary:
  ar: "يبين ابن سينا أن كل فصل يوافق من به مزاج مناسب له، وأن تقابل الفصول المنحرفة قد يعدل الأبدان، وأن السنة المستمرة على كيفية واحدة رديئة، وأصح الأزمنة خريف مطير وشتاء معتدل، ثم يصف الهواء الجيد في جوهره {cite:canon-ibn-sina-print-v1 pp.117-118}."
  en: "Ibn Sina shows that each season suits those with a temperament proper to it, that the meeting of seasons that have strayed in opposite ways can set bodies right, that a year that holds one quality throughout is bad, that the healthiest times are a rainy autumn and a moderate winter, and then describes air good in its substance {cite:canon-ibn-sina-print-v1 pp.117-118}."
