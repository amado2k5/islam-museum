label: { ar: "العقد المنكسر ⁦(عقد القارب المقلوب)⁩", en: "Keel arch", ur: "کشتی نما محراب", es: "Arco de quilla", fr: "Arche de quille", tr: "Kırık Kolye (Ters Tekne Sözleşmesi)", id: "Kalung Pecah (Kontrak Perahu Terbalik)" }
summary:
  ar: "عقد مدبب على هيئة قارب مقلوب، ابتكره الفاطميون في القاهرة وبقي سمة للعمارة القاهرية، بنائياً أو زخرفياً، حتى الفتح العثماني {cite:yeomans-islamic-cairo-2006 p.53} {cite:yeomans-islamic-cairo-2006 p.54}."
  en: "A pointed arch shaped like an upturned boat, a Fatimid innovation in Cairo that remained a feature of Cairene architecture, structural or decorative, until the Ottoman conquest {cite:yeomans-islamic-cairo-2006 p.53} {cite:yeomans-islamic-cairo-2006 p.54}."
  es: "Un arco apuntado con forma de barco invertido, una innovación fatimí en El Cairo que siguió siendo una característica de la arquitectura cairota, estructural o decorativa, hasta la conquista otomana {cite:yeomans-islamic-cairo-2006 p.53} {cite:yeomans-islamic-cairo-2006 p.54}."
  fr: "Une arche pointue en forme de bateau renversé, une innovation fatimide au Caire qui est restée une caractéristique de l'architecture cairote, structurelle ou décorative, jusqu'à la conquête ottomane {cite:yeomans-islamic-cairo-2006 p.53} {cite:yeomans-islamic-cairo-2006 p.54}."
  ur: "ایک نوک دار محراب جس کی شکل ایک الٹی ہوئی کشتی کی طرح ہے، قاہرہ میں ایک فاطمی اختراع جو عثمانی فتح تک قاہرہ کے فن تعمیر کی ایک خصوصیت رہی، ساختی یا آرائشی"
  tr: "Kahire'de Fatımiler tarafından icat edilen, ters bir tekne şeklinde sivri kemer, Osmanlı fethine kadar yapısal veya dekoratif olarak Kahire mimarisinin bir özelliği olarak kalmıştır {cite:yeomans-islamic-cairo-2006 s.53} {cite:yeomans-islamic-cairo-2006 s.54}."
  id: "Sebuah lengkungan runcing berbentuk perahu terbalik, ditemukan oleh Fatimiyah di Kairo, yang tetap menjadi ciri arsitektur Kairo, baik secara struktural maupun dekoratif, hingga penaklukan Ottoman {cite:yeomans-islamic-cairo-2006 hlm.53} {cite:yeomans-islamic-cairo-2006 hlm.54}."
