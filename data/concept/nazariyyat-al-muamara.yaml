  ur: "پروگرام پوچھتا ہے کہ کیا سازشی نظریہ امت کی پستی کی وضاحت کرتا ہے؛ شیخ عمر عبدالکافی کے نزدیک شکست کا پہلا سبب اللہ اور «لا إله إلا الله» کے اخلاق سے دوری ہے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:18:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:48:30}۔"
