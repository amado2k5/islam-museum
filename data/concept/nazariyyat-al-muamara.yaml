id: concept/nazariyyat-al-muamara
class: concept
kind: political
sensitivity: contested
label:
  ar: "نظرية المؤامرة"
  en: "Conspiracy theory (nazariyyat al-muamara) and the nation's decline"
  ur: "سازشی نظریہ (نظریۂ مؤامرہ)"
summary:
  ar: "يطرح البرنامج سؤال نظرية المؤامرة في تراجع الأمة، ويرى الشيخ عمر عبد الكافي أن سبب الهزيمة الأول البعد عن الله وأخلاق لا إله إلا الله، وأن الأمة اليوم لا تملك المناعة التي كانت للصحابة أمام الدسائس. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:18:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:48:30} وفي حلقة «نظرية المؤامرة حقيقة أم خيال» من برنامج «الوسطية» لطارق السويدان صوّت 89% من جمهور الاستوديو بأنها حقيقة، وخلص المقدّم إلى أن المؤيدين والرافضين يشتركون في الدعوة إلى العمل والتخطيط والدراسة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep40 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep40 01:15:00}"
  en: "The programme asks whether the conspiracy theory explains the nation's decline; Sheikh Omar Abdelkafy holds that the first cause of defeat is distance from God and the ethics of 'la ilaha illa Allah' {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:18:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:48:30}. In the 'conspiracy theory: fact or fancy' episode of Tareq al-Suwaidan's programme Al-Wasatiyya, 89% of the studio audience voted that it is fact, and the presenter concluded that those who hold the theory and those who reject it share one call: to act, plan and study. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep40 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep40 01:15:00}"
  ur: "پروگرام پوچھتا ہے کہ کیا سازشی نظریہ امت کی پستی کی وضاحت کرتا ہے؛ شیخ عمر عبدالکافی کے نزدیک شکست کا پہلا سبب اللہ اور «لا إله إلا الله» کے اخلاق سے دوری ہے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:18:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:48:30}۔ طارق السویدان کے پروگرام «الوسطیہ» کی قسط «سازشی نظریہ: حقیقت یا خیال» میں اسٹوڈیو کے 89% حاضرین نے اسے حقیقت قرار دیا، اور میزبان اس نتیجے پر پہنچے کہ اس نظریے کے حامی اور منکر دونوں ایک ہی دعوت میں شریک ہیں: عمل، منصوبہ بندی اور مطالعہ۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep40 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep40 01:15:00}"
