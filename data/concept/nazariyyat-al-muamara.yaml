summary:
  ar: "يطرح البرنامج سؤال نظرية المؤامرة في تراجع الأمة، ويرى الشيخ عمر عبد الكافي أن سبب الهزيمة الأول البعد عن الله وأخلاق لا إله إلا الله، وأن الأمة اليوم لا تملك المناعة التي كانت للصحابة أمام الدسائس. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:18:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep10 00:48:30}"
