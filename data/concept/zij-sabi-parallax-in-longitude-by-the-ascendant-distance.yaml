id: concept/zij-sabi-parallax-in-longitude-by-the-ascendant-distance
class: concept
kind: scientific
label: { ar: "اختلاف المنظر في الطول بحسب بُعد الجزء عن الطالع", en: "The parallax in longitude according to the degree's distance from the ascendant", ur: "طالع سے درجے کے فاصلے کے لحاظ سے طول میں اختلافِ منظر", es: "La paralaje en longitud según la distancia del grado al ascendente", fr: "La parallaxe en longitude en fonction de la distance en degrés par rapport à l'ascendant" }
summary:
  ar: "إذا كان بُعد الجزء الذي فيه القمر عن الطالع أقل من تسعين درجة زِيد اختلاف المنظر في الطول على موضع القمر الحقيقي، وإن كان أكثر من تسعين نُقص منه، لأن القمر حينئذ يكون أقرب إلى أفق المشرق أو المغرب بحسب الحال. {cite:zij-sabi-nallino-byblion p.126}."
  en: "If the distance of the Moon's degree from the ascendant is less than ninety degrees, the parallax in longitude is added to the Moon's true place; if more, it is subtracted, because the Moon is then nearer the eastern or western horizon as the case may be. {cite:zij-sabi-nallino-byblion p.126}."
  ur: "اگر چاند کے درجے کا طالع سے فاصلہ نوے درجے سے کم ہو تو طول میں اختلافِ منظر چاند کے حقیقی مقام پر جمع کیا جاتا ہے، اور زیادہ ہو تو گھٹایا جاتا ہے، کیونکہ اس وقت چاند حالت کے مطابق مشرق یا مغرب کے افق کے قریب ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.126}۔"
  es: "Si la distancia del grado de la Luna al ascendente es menor de noventa grados, se suma la paralaje en longitud a la posición verdadera de la Luna; si es mayor, se resta, ya que la Luna se encuentra entonces más cerca del horizonte oriental u occidental, según sea el caso. {cite:zij-sabi-nallino-byblion p.126}."
  fr: "Si la distance entre le degré de la Lune et l'ascendant est inférieure à 90 degrés, la parallaxe en longitude est ajoutée à la position réelle de la Lune; si elle est supérieure, elle est soustraite, car la Lune est alors plus proche de l'horizon est ou ouest, selon le cas. {cite:zij-sabi-nallino-byblion p.126}."
