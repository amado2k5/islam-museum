id: "concept/asbab-al-ra-sha"
class: "concept"
kind: "scientific"
label:
  ar: "أسباب الرعشة"
  en: "Causes of tremor"
  ur: "رعشہ کے اسباب"
summary:
  ar: "سبب الرعشة إما في القوة — كاعتراض الخوف ووصول شيء مفظع كالنظر من موضع عال أو مخاطبة محتشم مهيب أو غم أو حزن أو فرح مشوش لنظام حركات القوة أو غضب — وإما في الآلة كاسترخاء العصب بعض الاسترخاء دون أن يبلغ الفالج أو سدد لامتلاء أو جفوف، وإما فيهما جميعاً {cite:canon-ibn-sina-print-v2 p.157}"
  en: "Tremor's cause is either in the power — like the interception of fear, the reaching of something dreadful like looking from a high place or addressing an awe-inspiring person, or grief, sorrow, a joy disturbing the order of the powers' motions, or anger — or in the instrument, like a nerve's relaxing a little short of palsy, or obstructions from repletion, or drying; or in both {cite:canon-ibn-sina-print-v2 p.157}"
  ur: "رعشہ کا سبب یا تو قوت میں ہے — جیسے خوف کا عروض، کوئی خوفناک چیز کا پہنچنا جیسے اونچی جگہ سے دیکھنا یا کسی رعب دار شخص سے خطاب کرنا، یا غم یا حزن یا ایسی خوشی جو قوتوں کی حرکتوں کے نظام کو مشوش کر دے یا غصہ — یا آلہ میں، جیسے عصب کا کچھ مسترخی ہونا بغیر فالج تک پہنچے، یا امتلاء کی سدد، یا سوکھنا؛ یا دونوں میں {cite:canon-ibn-sina-print-v2 p.157}۔"
