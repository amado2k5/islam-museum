id: concept/fadl-taallum-al-arabiyya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "تعلّم العربية في آثار الصحابة والتابعين وأقوال العلماء"
  en: "Learning Arabic in the reports of the Companions and Successors and the words of the scholars"
  ur: "عربی سیکھنا: صحابہ اور تابعین کے آثار اور علماء کے اقوال میں"
  fr: "Apprendre l'arabe dans les récits des Compagnons et des Successeurs et les paroles des savants"
  es: "Aprender árabe en los relatos de los Compañeros y los Sucesores y las palabras de los sabios"
summary:
  ar: "أخبار وآثار في تعلّم العربية عن أبيّ بن كعب وعمر بن الخطاب والحسن البصري، مع حكم المحققين على كل منها: صحيح الإسناد عند محقق، ومنقطع عند آخر، أو مروي بلا إسناد. ثم حجة الشافعي في الرسالة في وجوب ما يبلغه الجهد من لسان العرب، وحجة ابن تيمية في أن العربية من الدين، وخبر «أحبوا العرب لثلاث» الذي ضعّفه أو ردّه من نُقل عنهم."
  en: "Reports on learning Arabic from Ubayy ibn Ka'b, Umar ibn al-Khattab and al-Hasan al-Basri, each with the verdict of the editors: sound in chain for one editor, broken for another, or told without a chain. Then al-Shafi'i's argument in al-Risala that every Muslim must learn what effort reaches of the Arabs' tongue, Ibn Taymiyya's argument that Arabic is part of religion, and the widely told report on loving the Arabs, which the graders quoted weaken or reject."
  ur: "عربی سیکھنے سے متعلق ابی بن کعب، عمر بن الخطاب اور حسن بصری کی روایات، ہر ایک پر محققین کے حکم کے ساتھ: ایک محقق کے نزدیک صحیح سند، دوسرے کے نزدیک منقطع، یا بغیر سند کے مروی۔ پھر الرسالہ میں شافعی کی دلیل کہ ہر مسلم پر اتنی عربی سیکھنا لازم ہے جتنی اس کی کوشش پہنچے، ابن تیمیہ کی دلیل کہ عربی دین کا حصہ ہے، اور مشہور خبر «أحبوا العرب لثلاث» جسے نقل شدہ ناقدین نے ضعیف یا مردود کہا۔"
  fr: "Récits sur l'apprentissage de l'arabe rapportés d'Ubayy ibn Ka'b, d'Umar ibn al-Khattab et d'al-Hasan al-Basri, chacun avec le jugement des éditeurs : chaîne authentique pour l'un, interrompue pour l'autre, ou transmis sans chaîne. Puis l'argument d'al-Shafi'i dans la Risala selon lequel tout musulman doit apprendre ce que son effort atteint de la langue des Arabes, celui d'Ibn Taymiyya pour qui l'arabe fait partie de la religion, et le récit célèbre sur l'amour des Arabes, que les critiques cités jugent faible ou rejeté."
  es: "Relatos sobre el aprendizaje del árabe transmitidos de Ubayy ibn Ka'b, Umar ibn al-Khattab y al-Hasan al-Basri, cada uno con el juicio de los editores: cadena sólida para uno, interrumpida para otro, o contado sin cadena. Luego el argumento de al-Shafi'i en la Risala sobre lo que todo musulmán debe aprender del árabe, el de Ibn Taymiyya de que es parte de la religión, y el famoso relato sobre amar a los árabes, que los críticos citados juzgan débil o rechazado."
