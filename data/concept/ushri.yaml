id: concept/ushri
class: concept
kind: legal
label: { ar: "العشري", en: "Ushri (tithe-land status)", es: "Ushri (estatus de tierra de diezmo)", fr: "Ushri (statut foncier soumis à la dîme)", ur: "عشری ⁦(دسواں زمین کی حیثیت)⁩", tr: "ondalık", id: "desimal" }
summary:
  ar: "حكم أرضي يؤخذ على أرض أهلها العشر لا الخراج؛ عند البلاذري صار ما عمروه العرب من أراضي عيون الطف بعد ذي قار والفتح عشرياً وكذلك ما أقطع من أراضي تلك العيون التي جلا عنها أهلها بعد القادسية والمدائن وصيرت عيون الطف سوادية في عمالة إسحاق بن إبراهيم بن مصعب للمتوكل."
  en: "A land status whose holders pay the tithe, not kharaj; in al-Baladhuri the Taff spring-lands the Arabs cultivated after Dhu Qar and the conquest became ushri, likewise the abandoned spring-lands granted after al-Qadisiyya and al-Mada'in — until Ishaq ibn Ibrahim ibn Mus'ab made them Sawadi under al-Mutawakkil."
  es: "Un estatus territorial cuyos poseedores pagan el diezmo, no el kharaj; en al-Baladhuri, las tierras de manantial de Taff que los árabes cultivaron después de Dhu Qar y la conquista se convirtieron en ushri, al igual que las tierras de manantial abandonadas otorgadas después de al-Qadisiyya y al-Mada'in, hasta que Ishaq ibn Ibrahim ibn Mus'ab las convirtió en Sawadi bajo al-Mutawakkil."
  fr: "Un statut foncier dont les détenteurs paient la dîme, et non le kharaj; dans al-Baladhuri, les terres de source de Taff que les Arabes ont cultivées après Dhu Qar et la conquête sont devenues ushri, de même que les terres de source abandonnées concédées après al-Qadisiyya et al-Mada'in — jusqu'à ce qu'Ishaq ibn Ibrahim ibn Mus'ab les transforme en Sawadi sous al-Mutawakkil."
  ur: "ایسی زمین کی حیثیت جس کے حاملین دسواں حصہ ادا کرتے ہیں، خرج نہیں؛ البلادوری میں طف موسم بہار کی سرزمین جو عربوں نے ذو قار اور فتح کے بعد عشری میں کاشت کی تھی، اسی طرح القدسیہ اور المدائن کے بعد چھوڑی گئی بہار کی زمینیں - یہاں تک کہ اسحاق بن ابراہیم ابن مصعب نے انہیں المتوکل کے ماتحت سوادی بنا دیا۔"
  tr: "Bir toprak, halkının toprakları üzerinde vergiyle değil, ondalıklarla alınır; El-Baladhuri'ye göre, Dhi Qar ve El-Feth'ten sonra Ud-Tuf kaynaklarındaki topraklarda Arapların ektiği topraklar on olur, ayrıca El-Kadisiye ve Mada'in'den sonra sakinleri sürülen kaynakların toprakları ve El-Tuf kaynaklarının toprakları İshaq ibn İbrahim ibn Mus'ab al-Mutawakkil'in yargı yetkisi altında kara topraklar olmuştur."
  id: "Pemerintahan tanah diambil atas tanah rakyatnya dengan persepuluhan, bukan pajak; menurut Al-Baladhuri, apa yang digarap oleh orang Arab dari tanah Ud-Tuf muncul setelah Dhi Qar dan Al-Fath menjadi sepuluh, begitu juga tanah mata air yang penduduknya diusir setelah Al-Qadisiyyah dan Al-Mada'in, dan tanah mata air Al-Tuf menjadi tanah hitam di bawah yurisdiksi Ishaq ibn Ibrahim ibn Mus'ab al-Mutawakkil."
