summary:
  ar: "حكم أرضي يؤخذ على أرض أهلها العشر لا الخراج؛ عند البلاذري صار ما عمروه العرب من أراضي عيون الطف بعد ذي قار والفتح عشرياً وكذلك ما أقطع من أراضي تلك العيون التي جلا عنها أهلها بعد القادسية والمدائن وصيرت عيون الطف سوادية في عمالة إسحاق بن إبراهيم بن مصعب للمتوكل."
  en: "A land status whose holders pay the tithe, not kharaj; in al-Baladhuri the Taff spring-lands the Arabs cultivated after Dhu Qar and the conquest became ushri, likewise the abandoned spring-lands granted after al-Qadisiyya and al-Mada'in — until Ishaq ibn Ibrahim ibn Mus'ab made them Sawadi under al-Mutawakkil."
