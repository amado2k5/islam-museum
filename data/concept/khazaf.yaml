summary:
  ar: "خزف في الكتاب مجفف جلاء، وخاصة خزف التنور، وألطف الأخزاف خزف السرطان البحري، والقراميد في طبيعة السنباذج؛ يجلو الكلف والنمش، ويتخذ منه قيروطي للخنازير ومرهم قوي الإدمال للقروح ويجلو الجرب، وينقل الكتاب فيه أفعالا للعين، ويطلى خزف التنور على النقرس {cite:canon-ibn-sina-print-v1 p.711}"
  en: "Khazaf is in the book drying and cleansing, especially the khazaf of the oven, the subtlest being the khazaf of the sea crab, and the roof tiles are in the nature of sanbadhaj; it clears freckles and blotches, a cerate of it is made for scrofula and an ointment strong in healing ulcers and clearing mange, the book gives it actions for the eye, and the khazaf of the oven is applied on gout {cite:canon-ibn-sina-print-v1 p.711}"
  ur: "خزف کتاب میں خشک کرنے والا اور صاف کرنے والا ہے، خصوصاً تنور کا خزف، اور سب سے لطیف خزف سرطان بحری کا خزف ہے، اور کھپریل سنباذج کی طبیعت میں ہیں؛ جھائیوں اور چھائیوں کو صاف کرتا ہے، اس سے خنازیر کے لیے قیروطی اور زخموں کے بھرنے میں قوی مرہم بنایا جاتا ہے اور خارش کو صاف کرتا ہے، کتاب اس کے آنکھ کے افعال بیان کرتی ہے، اور تنور کا خزف نقرس پر لگایا جاتا ہے {cite:canon-ibn-sina-print-v1 p.711}۔"
  es: "El khazaf se menciona en el libro como secante y limpiador, especialmente el khazaf del horno, siendo el más sutil el khazaf del cangrejo marino, y las tejas del techo tienen la naturaleza del sanbadhaj; elimina las pecas y las manchas, se prepara un cerato con él para la escrófula y un ungüento eficaz para curar úlceras y eliminar la sarna, el libro le atribuye propiedades para los ojos, y el khazaf del horno se aplica sobre la gota {cite:canon-ibn-sina-print-v1 p.711}"
