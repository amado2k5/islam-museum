summary:
  ar: "الإبدال لغةً جعل شيء مكان آخر، وهو عند الفقهاء نوع من التصرفات أصله الجواز ممن هو أهل للتصرف فيما يجوز له. وتعرض الموسوعة الكويتية اختلاف المذاهب فيه في مواطنه: إبدال الواجب في الزكاة والكفارة، وإبدال الأثمان والمبيعات قبل القبض في عقود المعاوضة، والإبدال الواجب في الإجارة، وإبدال عين الوقف. ولا تحكم الموسوعة بين هذه الأقوال في هذه الصفحات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415}"
  en: "Ibdal means putting one thing in place of another; in fiqh it is a kind of disposition whose default is permission, when made by someone competent over what he may dispose of. The Kuwaiti encyclopedia sets out the schools' differences on its places: substituting the obligated item in zakat and expiation, substituting prices and goods before receipt in exchange contracts, compulsory substitution in leases, and substituting the endowed property itself. It does not choose between these positions on the pages read."
  es: "Ibdal significa poner una cosa en lugar de otra; en fiqh, es un tipo de disposición cuyo valor predeterminado es la autorización, cuando la realiza alguien competente sobre aquello de lo que puede disponer. La enciclopedia kuwaití expone las diferencias entre las escuelas en sus respectivos casos: la sustitución del bien obligado en el zakat y la expiación, la sustitución de precios y bienes antes de su recepción en los contratos de intercambio, la sustitución obligatoria en los arrendamientos y la sustitución del bien donado en sí. No se decanta por ninguna de estas posturas en las páginas consultadas."
  fr: "Ibdal signifie substituer une chose à une autre; en jurisprudence islamique (fiqh), il s'agit d'une disposition dont le caractère non autorisé est la permission, lorsqu'elle est effectuée par une personne compétente sur ce dont elle peut disposer. L'encyclopédie koweïtienne expose les divergences entre les écoles juridiques quant à ces substitutions: substitution de l'objet obligatoire dans le cadre de la zakat et de l'expiation, substitution des prix et des biens avant leur réception dans les contrats d'échange, substitution obligatoire dans les baux, et substitution du bien en dot lui-même. Elle ne tranche pas entre ces différentes positions dans les pages consultées."
  ur: "ابدال کا مطلب ہے ایک چیز کی جگہ دوسری چیز رکھنا۔ فقہ میں یہ ایک قسم کا تصرف ہے جس کی ڈیفالٹ اجازت ہے، جب کوئی شخص اس پر قادر ہو کہ وہ کس چیز کا تصرف کر سکتا ہے۔ کویتی انسائیکلوپیڈیا اسکولوں کے فرق کو اپنی جگہوں پر متعین کرتا ہے: زکوٰۃ اور کفارہ میں واجب شے کو تبدیل کرنا، تبادلے کے معاہدوں میں وصولی سے پہلے قیمتوں اور سامان کو تبدیل کرنا، لیز میں لازمی متبادل، اور خود مختص شدہ جائیداد کا متبادل۔ یہ پڑھے گئے صفحات پر ان پوزیشنوں کے درمیان انتخاب نہیں کرتا ہے۔"
