label: { ar: "الإبدال", en: "Substitution (ibdal) in fiqh" }
summary:
  ar: "الإبدال لغةً جعل شيء مكان آخر، وهو عند الفقهاء نوع من التصرفات أصله الجواز ممن هو أهل للتصرف فيما يجوز له. وتعرض الموسوعة الكويتية اختلاف المذاهب فيه في مواطنه: إبدال الواجب في الزكاة والكفارة، وإبدال الأثمان والمبيعات قبل القبض في عقود المعاوضة، والإبدال الواجب في الإجارة، وإبدال عين الوقف. ولا تحكم الموسوعة بين هذه الأقوال في هذه الصفحات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1415}"
  en: "Ibdal means putting one thing in place of another; in fiqh it is a kind of disposition whose default is permission, when made by someone competent over what he may dispose of. The Kuwaiti encyclopedia sets out the schools' differences on its places: substituting the obligated item in zakat and expiation, substituting prices and goods before receipt in exchange contracts, compulsory substitution in leases, and substituting the endowed property itself. It does not choose between these positions on the pages read."
