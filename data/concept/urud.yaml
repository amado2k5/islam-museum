id: concept/urud
class: concept
kind: legal
label:
  ar: "العُرُوض"
  en: "Goods of trade (urud) and zakat on them"
  ur: "عروض"
  es: "Mercancías comerciales (urud) y zakat sobre ellas."
  fr: "Les marchandises d'échange (urud) et la zakat qui en découle"
summary:
  ar: "العروض في اللغة جمع عَرَض، ومن معاني العرض المتاع، وقال أبو عبيد: العروض هي الأمتعة التي لا يدخلها كيل ولا وزن، ولا تكون حيواناً ولا عقاراً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. وفي الاصطلاح العرض ما عدا الأثمان من المال على اختلاف أنواعه من نبات وحيوان وعقار وسائر المال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. ويذهب الفقهاء إلى وجوب الزكاة في عروض التجارة إذا تحققت شروطها، واستدلوا بالكتاب والسنة، ولأن المال معد للنماء بإعداد صاحبه فأشبه المعد لذلك بخلقته كالسوائم والنقدين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. وتفصيل ذلك في مصطلح «زكاة» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}."
  en: "In the lexicon, urud is the plural of ard, and one sense of ard is goods. Abu Ubayd defined urud as merchandise that is not measured by volume or weight and is neither an animal nor real estate {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. As a technical term, ard is all property other than the currencies, of every kind: plants, animals, real estate and other property {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. The jurists hold that zakat is due on goods of trade when its conditions are met, relying on the Qur'an, on prophetic reports and on the reasoning that goods held for gain are, like livestock and the two precious metals, prepared for growth {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. The detailed rules are treated under «zakat» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}."
  es: "En el léxico, urud es el plural de ard, y uno de los significados de ard es bienes. Abu Ubayd definió urud como mercancía que no se mide por volumen ni por peso y que no es ni animal ni inmueble {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. Como término técnico, ard es toda propiedad distinta de las monedas, de cualquier tipo: plantas, animales, bienes inmuebles y otras propiedades {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. Los juristas sostienen que el zakat es exigible sobre los bienes comerciales cuando se cumplen sus condiciones, basándose en el Corán, en los relatos proféticos y en el razonamiento de que los bienes mantenidos con fines de lucro, al igual que el ganado y los dos metales preciosos, están preparados para su crecimiento {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. Las reglas detalladas se tratan en el apartado «zakat» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}."
  fr: "Dans le lexique, « urud » est le pluriel de « ard », et l'un des sens de « ard » est « biens ». Abu Ubayd définit « urud » comme une marchandise qui ne se mesure ni en volume ni en poids et qui n'est ni un animal ni un bien immobilier (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11573). Techniquement, « ard » désigne tous les biens autres que les monnaies, de toute nature: plantes, animaux, biens immobiliers et autres (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11573). Les juristes estiment que la zakat est due sur les biens issus du commerce lorsque ses conditions sont remplies, se fondant sur le Coran, les hadiths et le raisonnement selon lequel les biens détenus à des fins lucratives, à l'instar du bétail et des métaux précieux, sont préparés pour leur croissance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. Les règles détaillées sont traitées dans l'article « zakat » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}."
  ur: "لغت میں، urud ard کی جمع ہے، اور ard کا ایک معنی سامان ہے۔ ابو عبید نے اُرد کی تعریف ایسی تجارت کے طور پر کی ہے جو حجم یا وزن سے نہیں ماپا جاتا ہے اور نہ ہی کوئی جانور ہے اور نہ ہی جائیداد۔ ایک تکنیکی اصطلاح کے طور پر، ard ہر قسم کی کرنسیوں کے علاوہ تمام جائیداد ہے: پودے، جانور، جائداد اور دیگر جائیداد {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.11573}۔ فقہاء کا عقیدہ ہے کہ زکوٰۃ تجارت کے سامان پر واجب ہے جب اس کی شرائط پوری ہو جائیں، قرآن پر بھروسہ کرتے ہوئے، نبوی احادیث اور اس استدلال پر کہ نفع کے لیے رکھے ہوئے مال مویشیوں اور دو قیمتی دھاتوں کی طرح ترقی کے لیے تیار کیے گئے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11574}۔ تفصیلی قواعد کا علاج «زکوٰۃ» کے تحت کیا جاتا ہے {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 11574}۔"
