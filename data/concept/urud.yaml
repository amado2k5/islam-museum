label:
  ar: "العُرُوض"
  en: "Goods of trade (urud) and zakat on them"
  ur: "عروض"
summary:
  ar: "العروض في اللغة جمع عَرَض، ومن معاني العرض المتاع، وقال أبو عبيد: العروض هي الأمتعة التي لا يدخلها كيل ولا وزن، ولا تكون حيواناً ولا عقاراً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. وفي الاصطلاح العرض ما عدا الأثمان من المال على اختلاف أنواعه من نبات وحيوان وعقار وسائر المال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. ويذهب الفقهاء إلى وجوب الزكاة في عروض التجارة إذا تحققت شروطها، واستدلوا بالكتاب والسنة، ولأن المال معد للنماء بإعداد صاحبه فأشبه المعد لذلك بخلقته كالسوائم والنقدين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. وتفصيل ذلك في مصطلح «زكاة» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}."
  en: "In the lexicon, urud is the plural of ard, and one sense of ard is goods. Abu Ubayd defined urud as merchandise that is not measured by volume or weight and is neither an animal nor real estate {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. As a technical term, ard is all property other than the currencies, of every kind: plants, animals, real estate and other property {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573}. The jurists hold that zakat is due on goods of trade when its conditions are met, relying on the Qur'an, on prophetic reports and on the reasoning that goods held for gain are, like livestock and the two precious metals, prepared for growth {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. The detailed rules are treated under «zakat» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}."
