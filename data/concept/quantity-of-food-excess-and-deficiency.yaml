summary:
  ar: "يقول ابن سينا إن الغذاء يغير حال البدن بكيفيته وبكميته. وتغيره بكميته إما بالزيادة فيورث التخمة والسدد ثم العفونة، وإما بالنقصان فيورث الذبول {cite:canon-ibn-sina-print-v1 p.134}."
  en: "Ibn Sina says food changes the state of the body by its quality and by its quantity. By quantity it does so either by excess, which brings indigestion and obstructions and then putrefaction, or by deficiency, which brings wasting {cite:canon-ibn-sina-print-v1 p.134}."
