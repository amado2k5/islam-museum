label: { ar: "كمية الغذاء زيادة ونقصاناً عند ابن سينا", en: "The quantity of food, too much and too little, in the Canon", ur: "قانون میں غذا کی مقدار، زیادتی اور کمی", es: "La cantidad de comida, tanto excesiva como insuficiente, en el Canon", fr: "La quantité de nourriture, en excès et en insuffisance, dans le Canon" }
summary:
  ar: "يقول ابن سينا إن الغذاء يغير حال البدن بكيفيته وبكميته. وتغيره بكميته إما بالزيادة فيورث التخمة والسدد ثم العفونة، وإما بالنقصان فيورث الذبول {cite:canon-ibn-sina-print-v1 p.134}."
  en: "Ibn Sina says food changes the state of the body by its quality and by its quantity. By quantity it does so either by excess, which brings indigestion and obstructions and then putrefaction, or by deficiency, which brings wasting {cite:canon-ibn-sina-print-v1 p.134}."
  es: "Ibn Sina afirma que los alimentos modifican el estado del cuerpo tanto por su calidad como por su cantidad. En cuanto a la cantidad, lo hacen bien por exceso, que provoca indigestión, obstrucciones y, posteriormente, putrefacción, o bien por deficiencia, que provoca desgaste {cite:canon-ibn-sina-print-v1 p.134}."
  fr: "Ibn Sina affirme que l'alimentation modifie l'état du corps par sa qualité et par sa quantité. Par la quantité, elle agit soit par excès, provoquant indigestion, obstructions et putréfaction, soit par carence, entraînant dépérissement {cite:canon-ibn-sina-print-v1 p.134}."
