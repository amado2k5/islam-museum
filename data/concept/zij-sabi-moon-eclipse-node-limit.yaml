id: concept/zij-sabi-moon-eclipse-node-limit
class: concept
kind: scientific
label: { ar: "حد العقدة في كسوف القمر", en: "The nodal limit for an eclipse of the Moon", ur: "چاند گرہن کے لیے عقدے کی حد", es: "El límite nodal para un eclipse lunar", fr: "La limite nodale d'une éclipse de Lune", tr: "Ay tutulmasında düğümün sınırı", id: "Batas simpul pada gerhana bulan" }
summary:
  ar: "لا ينكسف القمر إلا وهو في الاستقبال، أي المقابلة، داخل الحدود الكسوفية المرسومة في صدر صفحات شهور الاجتماع والامتلاء. فإن كان بُعده عن إحدى العقدتين، الرأس أو الذنب، أكثر من الحد لم ينكسف، وإن كان أقل انكسف بقدر قربه من العقدة، وإذا كان على نفس العقدة كان الكسوف أتم ما يكون. {cite:zij-sabi-nallino-byblion pp.150-151}"
  en: "The Moon can be eclipsed only at opposition, when it stands inside the eclipse limits printed at the head of the conjunction and opposition pages. If its distance from either node, the head or the tail, is greater than the limit, there is no eclipse. If it is less, the eclipse is in proportion to the nearness to the node, and when the Moon is exactly on the node the eclipse is as full as it can be. {cite:zij-sabi-nallino-byblion pp.150-151}"
  ur: "چاند صرف مقابلے یعنی استقبال کے وقت گرہن ہو سکتا ہے، جب وہ اجتماع اور امتلا کے صفحات کے اوپر درج گرہنی حدود کے اندر ہو۔ اگر وہ عقدہ رأس یا ذنب میں سے کسی ایک سے حد سے زیادہ دور ہو تو گرہن نہیں ہوتا۔ اگر کم ہو تو گرہن عقدے کے قرب کے مطابق ہوتا ہے، اور جب چاند عین عقدے پر ہو تو گرہن کامل ترین ہوتا ہے۔ {cite:zij-sabi-nallino-byblion pp.150-151}"
  es: "La Luna solo puede eclipsarse en oposición, cuando se encuentra dentro de los límites del eclipse impresos al inicio de las páginas de conjunción y oposición. Si su distancia a cualquiera de los nodos, la cabeza o la cola, es mayor que el límite, no hay eclipse. Si es menor, el eclipse es proporcional a la proximidad al nodo, y cuando la Luna está exactamente sobre el nodo, el eclipse es total. {cite:zij-sabi-nallino-byblion pp.150-151}"
  fr: "La Lune ne peut être éclipsée qu'à l'opposition, lorsqu'elle se trouve à l'intérieur des limites d'éclipse indiquées en tête des pages consacrées à la conjonction et à l'opposition. Si sa distance à l'un des nœuds (la tête ou la queue) dépasse ces limites, il n'y a pas d'éclipse. Si elle est inférieure, l'éclipse est proportionnelle à la proximité du nœud, et lorsque la Lune se trouve exactement sur le nœud, l'éclipse est maximale. {cite:zij-sabi-nallino-byblion pp.150-151}"
  tr: "Ay, yalnızca karşı konumdayken, kavuşum ve dolunay aylarının sayfalarında belirtilen tutulma sınırları içinde tutulur. Eğer iki düğümden (tepe veya kuyruk) birine olan uzaklığı sınırdan daha büyükse, tutulmaz. Daha az ise, düğüme olan yakınlığı ölçüsünde tutulur. Aynı düğümde ise, tutulma en eksiksiz olur. {cite:zij-sabi-nallino-byblion pp.150-151}"
  id: "Bulan hanya mengalami gerhana ketika berada dalam posisi oposisi, dalam batas gerhana yang diuraikan pada halaman-halaman bulan konjungsi dan purnama. Jika jaraknya dari salah satu dari dua simpul, puncak atau ekor, lebih besar dari batas tersebut, maka gerhana tidak akan terjadi. Jika lebih kecil, gerhana akan terjadi sejauh jaraknya dengan simpul tersebut. Jika berada pada simpul yang sama, gerhana akan paling sempurna. {cite:zij-sabi-nallino-byblion pp.150-151}"
