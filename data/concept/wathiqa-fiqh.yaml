id: concept/wathiqa-fiqh
class: concept
kind: legal
label: { ar: "وَثِيقة", en: "Wathiqa (documentary security for a right: witness, writing, pledge and surety)" }
summary:
  ar: "الوثيقة في اللغة الإحكام في الأمر، وفي الاصطلاح ما يُتخذ لتأمين الحقوق من الفوات بجحد أو نسيان أو إفلاس أو غير ذلك من المخاطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} وأصلها في الكتاب آيات المداينة وفي السنة قوله: «الزعيم غارم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} والوثائق ثلاثة: الشهادة لخوف الجحد، والرهن والضمان لخوف الإفلاس، والكتابة لخوف النسيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} وذهب جمهور الفقهاء إلى أن الأمر بالكتابة ندب لا وجوب، لأن المسلمين يبيعون بالأثمان المؤجلة من غير كتابة ولا إشهاد، وذهب بعضهم ومنهم الطبري إلى وجوبها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} وحكمة الكتابة والإشهاد أن الدين إذا تأخرت فيه المطالبة يتخلله النسيان ويدخله الجحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618} والرهن مال يُجعل وثيقة بالدين ليُستوفى من ثمنه، والضمان ضم ذمة الضامن إلى ذمة المضمون عنه، فيثبت الحق في ذمتيهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618}"
  en: "Wathiqa in the lexical sense is the making firm of a matter; technically it is what is taken to secure a right against loss through denial, forgetting, insolvency or other hazards. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} Its basis is the Qur'anic verses on debt and the Prophet's saying 'the guarantor is liable'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} There are three kinds: witness against denial, pledge and surety against insolvency, and writing against forgetting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} Most jurists hold the command to write a recommendation, not an obligation, since Muslims sell on deferred prices without writing or witness, while some, including al-Tabari, hold it obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} The purpose of writing and witness is that a debt whose payment is deferred suffers forgetting and denial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618} A pledge is property held as security for a debt, to be paid from its price if the debtor cannot pay; a surety joins the guarantor's liability to that of the debtor, so the right holds against both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618}"
