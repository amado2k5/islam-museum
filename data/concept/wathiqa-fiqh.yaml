label: { ar: "وَثِيقة", en: "Wathiqa (documentary security for a right: witness, writing, pledge and surety)", es: "Wathiqa (garantía documental de un derecho: testigo, escrito, promesa y fianza)", fr: "Wathiqa (garantie documentaire d'un droit: témoin, écrit, gage et caution)" }
summary:
  ar: "الوثيقة في اللغة الإحكام في الأمر، وفي الاصطلاح ما يُتخذ لتأمين الحقوق من الفوات بجحد أو نسيان أو إفلاس أو غير ذلك من المخاطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} وأصلها في الكتاب آيات المداينة وفي السنة قوله: «الزعيم غارم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} والوثائق ثلاثة: الشهادة لخوف الجحد، والرهن والضمان لخوف الإفلاس، والكتابة لخوف النسيان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} وذهب جمهور الفقهاء إلى أن الأمر بالكتابة ندب لا وجوب، لأن المسلمين يبيعون بالأثمان المؤجلة من غير كتابة ولا إشهاد، وذهب بعضهم ومنهم الطبري إلى وجوبها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} وحكمة الكتابة والإشهاد أن الدين إذا تأخرت فيه المطالبة يتخلله النسيان ويدخله الجحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618} والرهن مال يُجعل وثيقة بالدين ليُستوفى من ثمنه، والضمان ضم ذمة الضامن إلى ذمة المضمون عنه، فيثبت الحق في ذمتيهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618}"
  en: "Wathiqa in the lexical sense is the making firm of a matter; technically it is what is taken to secure a right against loss through denial, forgetting, insolvency or other hazards. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} Its basis is the Qur'anic verses on debt and the Prophet's saying 'the guarantor is liable'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} There are three kinds: witness against denial, pledge and surety against insolvency, and writing against forgetting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} Most jurists hold the command to write a recommendation, not an obligation, since Muslims sell on deferred prices without writing or witness, while some, including al-Tabari, hold it obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} The purpose of writing and witness is that a debt whose payment is deferred suffers forgetting and denial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618} A pledge is property held as security for a debt, to be paid from its price if the debtor cannot pay; a surety joins the guarantor's liability to that of the debtor, so the right holds against both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618}"
  es: "Wathiqa en el sentido léxico es la formalización de un asunto; técnicamente es lo que se toma para asegurar un derecho contra la pérdida por negación, olvido, insolvencia u otros riesgos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} Su base son los versículos coránicos sobre la deuda y el dicho del Profeta: \"el garante es responsable\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} Hay tres tipos: testimonio contra negación, prenda y fianza contra insolvencia, y escritura contra olvido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} La mayoría de los juristas sostienen que el mandato de escribir una recomendación no es una obligación, ya que los musulmanes venden a precios diferidos sin escribir ni testigos, mientras que algunos, incluido al-Tabari, lo consideran obligatorio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} El propósito de escribir y tener testigos es que una deuda cuyo pago se difiere sufra olvido y negación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618} Una prenda es un bien mantenido como garantía de una deuda, que se pagará con su precio si el deudor no puede pagar; un fiador une la responsabilidad del garante a la del deudor, por lo que el derecho se extiende a ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618}"
  fr: "La wathiqa, au sens littéral, désigne la consolidation d'une affaire; techniquement, il s'agit de ce qui est pris pour garantir un droit contre la perte due au déni, à l'oubli, à l'insolvabilité ou à d'autres aléas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} Elle se fonde sur les versets coraniques relatifs à la dette et sur le hadith du Prophète: « Le garant est responsable. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} Il en existe trois types: le témoignage contre le déni, le gage et la caution contre l'insolvabilité, et l'écrit contre l'oubli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16616} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} La plupart des juristes considèrent qu'il s'agit d'un commandement, et non d'une obligation, de rédiger une recommandation, car les musulmans vendent à crédit sans écrit ni témoin. Cependant, certains, comme al-Tabari, la jugent obligatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} L'objectif de l'écrit et du témoin est d'éviter qu'une dette dont le paiement est différé ne soit oubliée ou contestée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618} Un gage est un bien détenu en garantie d'une dette, à payer sur son prix si le débiteur est insolvable; une caution lie la responsabilité du garant à celle du débiteur, de sorte que le droit s'applique aux deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16618}"
