label: { ar: "قطرا الشمس والقمر المعدلان في الكسوف", en: "The corrected diameters of the Sun and the Moon in the eclipse", ur: "گرہن میں سورج اور چاند کے تصحیح شدہ قطر", es: "Los diámetros corregidos del Sol y la Luna durante el eclipse." }
summary:
  ar: "تُعرف حاصة الشمس لوسط الكسوف، ثم تُدخل في جداول التقويم ويُؤخذ ما تحتها من دقائق الجدول الثالث، وهي دقائق يختلف بها قطر الشمس عند القمر فيما بين البعد الأبعد والأقرب، فتُضاف إلى قطرها في البعد الأبعد. ثم يُعرف قطر القمر بالجهة المرسومة في كسوف القمر، ويُجمع قطر الشمس المعدل مع قطر القمر المعدل، ويُنصف الناتج فيخرج نصف القطرين الذي يُقاس به الكسوف. {cite:zij-sabi-nallino-byblion pp.165-166}"
  en: "The Sun's anomaly for mid-eclipse is found, entered in the tables, and the minutes beneath it in the third table are taken; these are the minutes by which the Sun's diameter differs as seen from the Moon between its farthest and nearest distance. They are added to the diameter at the farthest distance. The Moon's diameter is found in the manner set out for the lunar eclipse, the two corrected diameters are added and halved, and the half-sum is the measure of the eclipse. {cite:zij-sabi-nallino-byblion pp.165-166}"
  ur: "گرہن کے وسط کے لیے سورج کی خاصہ معلوم کر کے جداول میں داخل کی جاتی ہے اور اس کے نیچے تیسرے جدول کے دقائق لیے جاتے ہیں؛ یہ وہ دقائق ہیں جن سے سورج کا قطر، چاند کے مقام سے، دور ترین اور قریب ترین بُعد کے درمیان بدلتا ہے۔ انہیں دور ترین بُعد کے قطر میں جمع کیا جاتا ہے۔ چاند کا قطر گرہنِ قمر والے طریقے سے معلوم ہوتا ہے، دونوں تصحیح شدہ قطر جمع کر کے آدھے کیے جاتے ہیں، اور یہ نصف المجموع گرہن کا پیمانہ ہے۔ {cite:zij-sabi-nallino-byblion pp.165-166}"
  es: "Se encuentra la anomalía del Sol en el punto medio del eclipse, se introduce en las tablas y se toman los minutos que aparecen debajo en la tercera tabla; estos son los minutos en los que difiere el diámetro del Sol, visto desde la Luna, entre su distancia más lejana y la más cercana. Se suman al diámetro en la distancia más lejana. El diámetro de la Luna se calcula de la forma establecida para el eclipse lunar, se suman los dos diámetros corregidos y se dividen por la mitad, y la mitad de la suma es la medida del eclipse. {cite:zij-sabi-nallino-byblion pp.165-166}"
