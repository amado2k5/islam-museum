summary:
  ar: "الشلجم في الكتاب منه بري ومنه بستاني، وكلاهما حاران في الثانية رطبان في الأولى، وقال جالينوس إن أكله مطبوخا جيدا يغذي غذاء غليظا كثيرا وإدمانه يولد السدد والرياح، وينفع من داء الثعلب العتيق ومن الشقاق ومن النقرس ويليّن الحلق والصدر ويسخن الكلى ويبطئ في المعدة، وقيل إنه ينفع البصر، وماؤه يدر البول، وورقه كذلك، ويذكر الكتاب نقلا موسوما توليده المني وتهييجه الباه {cite:canon-ibn-sina-print-v1 pp.679-680}"
  en: "Shaljam is in the book wild and garden; both are hot in the second degree and moist in the first; Galen said that eating it well cooked nourishes thickly and much, and constant eating generates blockages and winds; it benefits long-standing alopecia, cracks and gout, softens the throat and chest, warms the kidneys and is slow in the stomach; it is said to benefit sight; its water promotes urine, and so does its leaf; and the book lists, as a labelled report, its generating of semen and its stirring of desire {cite:canon-ibn-sina-print-v1 pp.679-680}"
  ur: "شلجم کتاب میں جنگلی بھی ہے اور باغی بھی؛ دونوں دوسرے درجے میں گرم اور پہلے میں تر ہیں؛ جالینوس نے کہا کہ اچھی طرح پکا کر کھانا گاڑھی غذا بہت دیتا ہے اور اسے مسلسل کھانا رکاوٹیں اور ہوائیں پیدا کرتا ہے؛ پرانے داء الثعلب میں، پھٹن میں اور نقرس میں نافع ہے، حلق اور سینے کو نرم کرتا ہے، گردوں کو گرم کرتا ہے اور معدے میں دیر لگاتا ہے؛ کہا گیا کہ یہ بینائی کو فائدہ دیتا ہے؛ اس کا پانی پیشاب لاتا ہے اور اس کا پتہ بھی؛ اور کتاب منقول فہرست کے طور پر اس کا منی پیدا کرنا اور باہ کو ابھارنا درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.679-680}۔"
