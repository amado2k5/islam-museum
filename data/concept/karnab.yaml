summary:
  ar: "الكرنب بقل معروف حار في الأولى يابس في الثانية، بستاني وبري ومائي، منضج مليّن يجفف، ينفع الأورام والجراح والمفاصل، وفيه ذكر لنفعه من لسع الأفعى وعضة الكلب {cite:canon-ibn-sina-print-v1 p.531} {cite:canon-ibn-sina-print-v1 p.532}."
  en: "Cabbage is a known pot-herb, hot in the first degree and dry in the second, garden, wild and water kinds. It ripens, softens and dries, and the book lists uses for swellings, wounds and joints, and for viper stings and the bite of a rabid dog {cite:canon-ibn-sina-print-v1 p.531} {cite:canon-ibn-sina-print-v1 p.532}."
  ur: "کرنب ایک معروف ترکاری ہے، پہلے درجے میں گرم اور دوسرے میں خشک، باغی، جنگلی اور آبی قسمیں۔ یہ پکاتا، نرم کرتا اور خشک کرتا ہے، اور کتاب ورموں، زخموں اور جوڑوں میں اس کے فائدے اور افعی کے ڈسنے اور باؤلے کتے کے کاٹے میں نفع گنواتی ہے {cite:canon-ibn-sina-print-v1 p.531} {cite:canon-ibn-sina-print-v1 p.532}۔"
  es: "La col es una hierba aromática conocida, de sabor intenso en primer grado y seco en segundo, que se cultiva en huertos, en zonas silvestres y acuáticas. Madura, se ablanda y se seca, y el libro enumera sus usos para hinchazones, heridas y articulaciones, así como para picaduras de víbora y la mordedura de un perro rabioso {cite:canon-ibn-sina-print-v1 p.531} {cite:canon-ibn-sina-print-v1 p.532}."
  fr: "Le chou est une plante potagère connue, chaude au premier degré et sèche au second, cultivée, sauvage et aquatique. Il mûrit, s'attendrit et sèche, et le livre énumère ses usages pour les gonflements, les plaies et les articulations, ainsi que pour les piqûres de vipère et la morsure d'un chien enragé {cite:canon-ibn-sina-print-v1 p.531} {cite:canon-ibn-sina-print-v1 p.532}."
