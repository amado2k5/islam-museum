label:
  ar: "الصرع"
  en: "Epilepsy (al-sarʿ)"
  fr: "Épilepsie (al-sarʿ)"
  ur: "صرع"
  es: "Epilepsia (al-sarʿ)"
  tr: "Epilepsi"
  id: "Epilepsi"
summary:
  ar: "يعرّف ابن سينا الصرع بأنه علة تمنع الأعضاء النفسية عن أفعال الحس والحركة والانتصاب منعاً غير تام، لسدّة تقع، وأكثره لتشنّج كلي يعرض من آفة فيمنع نفوذ قوة الحس والحركة {cite:canon-ibn-sina-print-v2 p.118}"
  en: "Ibn Sina defines epilepsy as an illness that bars the psychic organs from the acts of sensation, motion and standing upright, not completely, because of an obstruction that occurs, mostly with a general convulsion arising from a lesion that stops the power of sense and motion passing fully into them {cite:canon-ibn-sina-print-v2 p.118}"
  fr: "Ibn Sina définit l’épilepsie comme une maladie qui empêche les organes psychiques d’accomplir les actes de la sensation, du mouvement et de la station debout, sans les en empêcher complètement, à cause d’une obstruction qui se produit, le plus souvent avec une convulsion générale née d’une lésion qui empêche la faculté de la sensation et du mouvement de pénétrer pleinement en eux {cite:canon-ibn-sina-print-v2 p.118}"
  ur: "ابن سینا صرع کی تعریف اس طرح کرتا ہے کہ یہ ایک بیماری ہے جو نفسانی اعضا کو حس، حرکت اور سیدھا کھڑے ہونے کے افعال سے مکمل طور پر نہیں روکتی، بلکہ سدے کی وجہ سے، اور اکثر مجموعی تشنج کے ساتھ جو کوئی آفت پیدا کرتی ہے جو حس اور حرکت کی قوت کے مکمل نفوذ سے روکتی ہے {cite:canon-ibn-sina-print-v2 p.118}۔"
  es: "Ibn Sina define la epilepsia como una enfermedad que impide a los órganos psíquicos los actos de sensación, movimiento y postura erguida, aunque no completamente, debido a una obstrucción que se produce, generalmente con una convulsión general derivada de una lesión que impide que la capacidad de sentir y mover llegue plenamente a ellos {cite:canon-ibn-sina-print-v2 p.118}."
  tr: "İbn Sina, epilepsiyi psikolojik organların duyusal işlevleri, hareket ve ereksiyonu kısmen engelleyen bir durum olarak tanımlar; bunun başlıca nedeni bir tıkanıklık ve en sık olarak duyusal ve motor yeteneklerin etkisini engelleyen bir lezyona neden olan tam nöbet nedeniyle (cite:canon-ibn-sina-print-v2 s.118}"
  id: "Ibn Sina mendefinisikan epilepsi sebagai kondisi yang sebagian menghambat fungsi sensorik, gerakan, dan ereksi organ psikologis; penyebab utamanya adalah kemacetan dan paling sering kejang total yang mengakibatkan lesi yang mengganggu kemampuan sensorik dan motorik (kutip: canon-ibn-sina-print-v2 hlm.118))"
