summary:
  ar: "التعويذ المشروع: قراءة القرآن والأدعية المشروع على المريض أو المصاب استجلاباً للشفاء وطلباً لحفظ الله، وهو ما فعله النبي بنفسه حين سُحر، وفيه النهي عن الرقية بالثوم والبصل وما فيه من الشرك والجهل."
  en: "The lawful counter-incantation: reciting Qur'an and permissible supplications over the sick or afflicted to seek healing and God's protection — what the Prophet himself did when bewitched, distinct from unlawful ruqyah by garlic, onions and ignorance."
  ur: "جائز رقیہ: مریض یا متاثرہ شخص پر قرآن اور جائز دعائیں پڑھ کر شفا اور اللہ کی حفاظت مانگنا — وہی جو نبی نے اپنے اوپر جادو ہونے پر کیا، بجائے لہسن، پیاز اور شرک والی ناجائز رقیہ کے۔"
