label: { ar: "الرُّقْيَة", en: "Ruqyah", ur: "رقیہ", es: "Ruqyah", fr: "Ruqyah", tr: "Ruqyah", id: "Ruqyah" }
summary:
  ar: "التعويذ المشروع: قراءة القرآن والأدعية المشروع على المريض أو المصاب استجلاباً للشفاء وطلباً لحفظ الله، وهو ما فعله النبي بنفسه حين سُحر، وفيه النهي عن الرقية بالثوم والبصل وما فيه من الشرك والجهل."
  en: "The lawful counter-incantation: reciting Qur'an and permissible supplications over the sick or afflicted to seek healing and God's protection — what the Prophet himself did when bewitched, distinct from unlawful ruqyah by garlic, onions and ignorance."
  ur: "جائز رقیہ: مریض یا متاثرہ شخص پر قرآن اور جائز دعائیں پڑھ کر شفا اور اللہ کی حفاظت مانگنا — وہی جو نبی نے اپنے اوپر جادو ہونے پر کیا، بجائے لہسن، پیاز اور شرک والی ناجائز رقیہ کے۔"
  es: "El contrahechizo lícito: recitar el Corán y súplicas permitidas sobre los enfermos o afligidos para buscar la curación y la protección de Dios, lo que el Profeta mismo hizo cuando fue embrujado, a diferencia de la ruqyah ilícita realizada con ajo, cebollas e ignorancia."
  fr: "La contre-incantation licite: réciter le Coran et des invocations permises sur les malades ou les affligés pour rechercher la guérison et la protection de Dieu — ce que le Prophète lui-même a fait lorsqu’il était ensorcelé —, à distinguer de la ruqyah illicite pratiquée avec de l’ail, des oignons et par ignorance."
  tr: "Buyurulan muska: Kur'an okumak ve hasta ya da hasta olanlara şifa aramak ve Allah'ı korumaları için dua etmek. Bu, Peygamber'in sahur sırasında yaptığı şeydir ve sarımsak ve soğanla rukiyeyi yasaklar; bu da çoktanrıcılık ve cehaleti içerir."
  id: "Jimat yang diresepkan: Membaca Al-Qur'an dan doa agar orang sakit atau yang menderita mencari penyembuhan dan melindungi Allah. Inilah yang dilakukan Nabi sendiri selama suhoor, dan melarang ruqyah dengan bawang putih dan bawang, yang melibatkan politeisme dan kebodohan."
