label: { ar: "الألبسة", en: "Albisa (clothing: rulings, colours and manners)" }
summary:
  ar: "الألبسة جمع لباس، وهو ما يستر البدن ويدفع الحر والبرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3267} وتعتريها الأحكام الخمسة: فالفرض ستر العورة، والمندوب إظهار النعمة والتجمل في الجمع والأعياد، والمكروه ما يكون مظنة للتكبر والخيلاء، والحرام لبس الحرير والذهب للرجال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3267}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3268}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3269} والأصل في اللباس الحل إلا ما ورد النص بتحريمه، وتختلف أحكام الألوان والصور والنقوش، ويكره ما يشهر صاحبه، ولا يجوز لبس ما يصف العورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3273}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3276}"
  en: "Clothing is that which covers the body and protects from heat and cold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3267} Five rulings apply: covering the nakedness is obligatory; showing blessing and dressing well for Friday and festivals is recommended; garb that suggests pride is disliked; silk and gold are forbidden to men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3267}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3268}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3269} The default is that clothing is lawful unless a text forbids it; the rulings on colours, images and transparency differ, and clothing that makes its wearer conspicuous is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3270}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3273}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3275}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3276}"
