id: concept/hisab-al-sayyia-al-mamula
class: concept
kind: doctrine
label:
  ar: "السيئة المعمولة: سيئة واحدة"
  en: "A bad deed done: one bad deed"
  ur: "کی ہوئی برائی: ایک ہی برائی"
summary:
  ar: "من همّ بسيئة فعملها كتبها الله سيئة واحدة [[passage/muslim-0131]]، والقرآن يقرر أن من جاء بالسيئة لا يجزى إلا مثلها [[passage/quran-6-160]] [[passage/quran-40-40]]. فكفة السيئات تُعدّ بالواحد، وكفة الحسنات تبدأ من العشر: هذا هو الفرق الذي تبني عليه الآلة الحاسبة عمودَيها."
  en: "Whoever intends a bad deed and does it, God writes it as one bad deed [[passage/muslim-0131]], and the Qur'an states that whoever brings a bad deed is repaid only its like [[passage/quran-6-160]] [[passage/quran-40-40]]. The bad-deed side is counted in ones while the good-deed side starts at ten: this is the asymmetry on which the calculator builds its two columns."
  ur: "جو برائی کا ارادہ کرے اور اسے کر لے، اللہ اسے ایک ہی برائی لکھتا ہے [[passage/muslim-0131]]، اور قرآن بتاتا ہے کہ جو برائی لائے اسے اسی کے برابر بدلہ ملتا ہے [[passage/quran-6-160]] [[passage/quran-40-40]]۔ برائیوں کا پلڑا ایک ایک سے گنا جاتا ہے اور نیکیوں کا دس سے شروع ہوتا ہے: یہی وہ فرق ہے جس پر کیلکولیٹر اپنے دو کالم بناتا ہے۔"
