id: concept/zij-sabi-meridian-line-from-two-shadow-tips
class: concept
kind: scientific
label: { ar: "خط نصف النهار من طرفي الظل قبل الزوال وبعده في الزيج الصابي", en: "The meridian line from two shadow tips before and after noon", ur: "زوال سے پہلے اور بعد کے سائے کے دو سروں سے خط نصف النہار", es: "La línea meridiana desde dos puntas de sombra antes y después del mediodía." }
summary:
  ar: "يرصد البتاني ظل العود في أول النهار وهو طويل ثم يقصر حتى يبلغ محيط الدائرة فيعلّم موضعه، ثم يرصده بعد الزوال وهو يزداد حتى يبلغ المحيط فيعلّم موضعه ثانية، ويقسم القوس بين العلامتين نصفين، ويصل بين نقطة النصف والمركز بخط ممتد إلى الجانب الآخر، فهذا خط نصف النهار أبداً. {cite:zij-sabi-nallino-byblion pp.38-39}."
  en: "Al-Battani watches the rod's shadow early in the day, long and shortening until it reaches the circumference, and marks that spot; then watches it after noon, lengthening until it reaches the circumference again, and marks the second spot. He bisects the arc between the marks and joins the midpoint to the centre by a line carried to the other side of the circle: this is the meridian line for good. {cite:zij-sabi-nallino-byblion pp.38-39}."
  ur: "البتانی دن کے آغاز میں سلاخ کے سائے کو دیکھتے ہیں جو لمبا ہوتا ہے پھر گھٹتا ہے یہاں تک کہ دائرے کے محیط تک پہنچتا ہے تو اس جگہ نشان لگاتے ہیں؛ پھر زوال کے بعد جب سایہ بڑھ کر دوبارہ محیط تک پہنچے تو دوسرا نشان لگاتے ہیں۔ دونوں نشانوں کے بیچ کی قوس کے دو برابر حصے کرتے ہیں اور درمیانی نقطے کو مرکز سے ملا کر دوسری طرف تک خط کھینچتے ہیں؛ یہی ہمیشہ کے لیے خط نصف النہار ہے۔ {cite:zij-sabi-nallino-byblion pp.38-39}۔"
  es: "Al-Battani observa la sombra de la vara al amanecer, que se alarga y se acorta hasta alcanzar la circunferencia, y marca ese punto; luego la observa después del mediodía, que se alarga hasta alcanzar de nuevo la circunferencia, y marca un segundo punto. Divide el arco entre las marcas y une el punto medio con el centro mediante una línea que se extiende hasta el otro lado del círculo: esta es la línea meridiana definitiva. {cite:zij-sabi-nallino-byblion pp.38-39}."
