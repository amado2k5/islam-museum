summary:
  ar: "الزعرور شجرة مشوّكة، ثمرها صغير شبيه بالتفاح، لذيذ الحمرة، عفص الطعم؛ قابض يقمع الصفراء ويحبس السيلان، ومصدّع، ورديء للمعدة. {cite:canon-ibn-sina-print-v1 p.466}"
  en: "Zu'rur is a thorny tree with small fruit like the apple, pleasant and red, astringent in taste. It is astringent, checks yellow bile and flows, causes headache, and is bad for the stomach. {cite:canon-ibn-sina-print-v1 p.466}"
  ur: "زعرور ایک کانٹے دار درخت ہے جس کا پھل سیب سے چھوٹا، مزیدار اور سرخ، کسیلا ذائقہ؛ یہ قابض ہے، پیلے پت کو دباتا اور بہاؤ روکتا ہے، سر درد کرتا اور معدے کے لیے بُرا ہے۔ {cite:canon-ibn-sina-print-v1 p.466}"
  es: "Zu'rur es un árbol espinoso con frutos pequeños parecidos a la manzana, agradables y rojos, de sabor astringente. Es astringente, inhibe la bilis amarilla y sus flujos, provoca dolor de cabeza y es malo para el estómago. {cite:canon-ibn-sina-print-v1 p.466}"
  fr: "Le zu'rur est un arbre épineux aux petits fruits ressemblant à des pommes, agréables et rouges, au goût astringent. Il est astringent, stoppe la bile jaune et provoque des maux de tête et est mauvais pour l'estomac. {cite:canon-ibn-sina-print-v1 p.466}"
