label: { ar: "القومية العثمانية الإسلامية والقومية التركية الطورانية", en: "Ottoman-Islamic versus Turanian-Turkish nationalism", es: "Nacionalismo otomano-islámico versus nacionalismo turanio-turco", fr: "nationalisme ottoman-islamique contre nationalisme turanien-turc", ur: "عثمانی-اسلامی بمقابلہ تورانی-ترک قوم پرستی", tr: "Osmanlı İslami milliyetçiliği ve Türk-Turan milliyetçiliği", id: "Nasionalisme Islam Ottoman dan nasionalisme Turki-Turan" }
summary:
  ar: "يعرض شكيب أرسلان في تعليقه على حاضر العالم الإسلامي خلافاً بين تيارين في الأوساط التركية العثمانية: تيار يرى الهوية العثمانية إسلامية الجذر تقوم على الثقافة العربية والفارسية، وتيار طوراني يقدّم الأصل التركي والمغولي ويميل إلى تنقية اللغة مما استُعير من العربية والفارسية. ويذكر أن أنصار التيار الطوراني يعدّون المغول أصلاً لهم، وهو ما ينكره أرسلان ويعدّه من آراء أصحاب التيار الآخر. يعرض الوصف كما نقله المؤلف عن أصحابه، ولا يُعد حكماً محايداً."
  en: "In Arslan's commentary on Stoddard, two currents among Ottoman Turks are described: an Ottoman-Islamic one that roots Ottoman culture in Arabic and Persian learning, and a Turanian one that stresses Turkic-Mongol origins and wants Arabic and Persian loanwords removed from Turkish. Arslan reports the Turanian camp's admiration for Chinggis Khan. The entry describes his account as a participant's view and is not a neutral verdict."
  es: "En el comentario de Arslan sobre Stoddard, se describen dos corrientes entre los turcos otomanos: una otomano-islámica que fundamenta la cultura otomana en el saber árabe y persa, y una turania que enfatiza los orígenes turco-mongoles y busca eliminar los préstamos árabes y persas del turco. Arslan relata la admiración del bando turanio por Gengis Kan. La entrada describe su relato como la perspectiva de un participante y no como un veredicto neutral."
  fr: "Dans son commentaire sur Stoddard, Arslan décrit deux courants au sein de la communauté turque ottomane: un courant ottoman-islamique qui ancre la culture ottomane dans le savoir arabe et persan, et un courant turanien qui met l’accent sur les origines turco-mongoles et prône l’élimination des emprunts arabes et persans du turc. Arslan rapporte l’admiration que le courant turanien portait à Gengis Khan. Il est précisé que son récit reflète le point de vue d’un participant et ne constitue pas un jugement neutre."
  ur: "سٹوڈارڈ پر ارسلان کی تفسیر میں، عثمانی ترکوں کے درمیان دو دھارے بیان کیے گئے ہیں: ایک عثمانی-اسلامی جو عربی اور فارسی سیکھنے میں عثمانی ثقافت کی جڑیں رکھتی ہے، اور ایک تورانی جو کہ ترک-منگول ماخذ پر زور دیتی ہے اور یہ چاہتی ہے کہ عربی اور فارسی کے لفظ ترکی سے ہٹا دی جائیں۔ ارسلان نے تورانی کیمپ کی چنگیز خان کی تعریف کی اطلاع دی۔ اندراج اس کے اکاؤنٹ کو شریک کے نقطہ نظر کے طور پر بیان کرتا ہے اور یہ غیر جانبدار فیصلہ نہیں ہے۔"
  tr: "Şakib Arslan, günümüz İslam dünyası üzerine yaptığı yorumunda Osmanlı Türk çevreleri içinde iki akım arasında bir anlaşmazlık sunar: Osmanlı kimliğini kökeninde İslami olarak gören ve Arap ile Fars kültürüne dayanan bir akım ile Türk ve Moğol kökenlerini sunan ve Arapça ile Farsçadan ödünç alınan dili arındırmaya eğilimli Turan akım. Turan akımının destekçilerinin Moğolları kökenleri olarak gördüklerini, ancak Arslan'ın bunu reddettiğini ve diğer akımın görüşlerinin bir parçası olarak gördüğünü belirtir. Tanımı, yazarın yazarlarından aktardığı şekilde sunar ve tarafsız bir yargı olarak kabul edilmez."
  id: "Shakib Arslan menyajikan dalam komentarnya tentang dunia Islam saat ini sebuah perselisihan antara dua arus dalam lingkaran Turki Ottoman: arus yang melihat identitas Ottoman sebagai Islam pada akarnya, berdasarkan budaya Arab dan Persia, dan arus Turan yang menunjukkan asal-usul Turki dan Mongol serta cenderung memurnikan bahasa yang dipinjam dari bahasa Arab dan Persia. Ia menyebutkan bahwa pendukung arus Turanian menganggap Mongol asal-usulnya, yang dibantah Arslan dan dianggap sebagai bagian dari pandangan arus lain. Ia menyajikan deskripsi sebagaimana penulis menyampaikan dari penulisnya dan tidak dianggap sebagai penilaian netral."
