label: { ar: "القومية العثمانية الإسلامية والقومية التركية الطورانية", en: "Ottoman-Islamic versus Turanian-Turkish nationalism" }
summary:
  ar: "يعرض شكيب أرسلان في تعليقه على حاضر العالم الإسلامي خلافاً بين تيارين في الأوساط التركية العثمانية: تيار يرى الهوية العثمانية إسلامية الجذر تقوم على الثقافة العربية والفارسية، وتيار طوراني يقدّم الأصل التركي والمغولي ويميل إلى تنقية اللغة مما استُعير من العربية والفارسية. ويذكر أن أنصار التيار الطوراني يعدّون المغول أصلاً لهم، وهو ما ينكره أرسلان ويعدّه من آراء أصحاب التيار الآخر. يعرض الوصف كما نقله المؤلف عن أصحابه، ولا يُعد حكماً محايداً."
  en: "In Arslan's commentary on Stoddard, two currents among Ottoman Turks are described: an Ottoman-Islamic one that roots Ottoman culture in Arabic and Persian learning, and a Turanian one that stresses Turkic-Mongol origins and wants Arabic and Persian loanwords removed from Turkish. Arslan reports the Turanian camp's admiration for Chinggis Khan. The entry describes his account as a participant's view and is not a neutral verdict."
