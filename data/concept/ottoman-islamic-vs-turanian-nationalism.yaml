label: { ar: "القومية العثمانية الإسلامية والقومية التركية الطورانية", en: "Ottoman-Islamic versus Turanian-Turkish nationalism", es: "Nacionalismo otomano-islámico versus nacionalismo turanio-turco", fr: "nationalisme ottoman-islamique contre nationalisme turanien-turc" }
summary:
  ar: "يعرض شكيب أرسلان في تعليقه على حاضر العالم الإسلامي خلافاً بين تيارين في الأوساط التركية العثمانية: تيار يرى الهوية العثمانية إسلامية الجذر تقوم على الثقافة العربية والفارسية، وتيار طوراني يقدّم الأصل التركي والمغولي ويميل إلى تنقية اللغة مما استُعير من العربية والفارسية. ويذكر أن أنصار التيار الطوراني يعدّون المغول أصلاً لهم، وهو ما ينكره أرسلان ويعدّه من آراء أصحاب التيار الآخر. يعرض الوصف كما نقله المؤلف عن أصحابه، ولا يُعد حكماً محايداً."
  en: "In Arslan's commentary on Stoddard, two currents among Ottoman Turks are described: an Ottoman-Islamic one that roots Ottoman culture in Arabic and Persian learning, and a Turanian one that stresses Turkic-Mongol origins and wants Arabic and Persian loanwords removed from Turkish. Arslan reports the Turanian camp's admiration for Chinggis Khan. The entry describes his account as a participant's view and is not a neutral verdict."
  es: "En el comentario de Arslan sobre Stoddard, se describen dos corrientes entre los turcos otomanos: una otomano-islámica que fundamenta la cultura otomana en el saber árabe y persa, y una turania que enfatiza los orígenes turco-mongoles y busca eliminar los préstamos árabes y persas del turco. Arslan relata la admiración del bando turanio por Gengis Kan. La entrada describe su relato como la perspectiva de un participante y no como un veredicto neutral."
  fr: "Dans son commentaire sur Stoddard, Arslan décrit deux courants au sein de la communauté turque ottomane: un courant ottoman-islamique qui ancre la culture ottomane dans le savoir arabe et persan, et un courant turanien qui met l’accent sur les origines turco-mongoles et prône l’élimination des emprunts arabes et persans du turc. Arslan rapporte l’admiration que le courant turanien portait à Gengis Khan. Il est précisé que son récit reflète le point de vue d’un participant et ne constitue pas un jugement neutre."
