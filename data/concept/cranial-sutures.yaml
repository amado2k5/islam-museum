summary:
  ar: "يميّز ابن سينا في تشريح القحف بين ثلاثة دروز حقيقية ودرزين كاذبين، ويسمّي كلاً منها بحسب شكله {cite:canon-ibn-sina-print-v1 p.44}."
  en: "In the anatomy of the skull Ibn Sina distinguishes three true sutures and two false ones, and names each by its shape {cite:canon-ibn-sina-print-v1 p.44}."
  es: "En la anatomía del cráneo, Ibn Sina distingue tres suturas verdaderas y dos falsas, y nombra cada una por su forma {cite:canon-ibn-sina-print-v1 p.44}."
  fr: "Dans l'anatomie du crâne, Ibn Sina distingue trois vraies sutures et deux fausses, et nomme chacune par sa forme {cite:canon-ibn-sina-print-v1 p.44}."
  ur: "کھوپڑی کی اناٹومی میں ابن سینا نے تین سچے سیون اور دو جھوٹے، اور ہر ایک کو اس کی شکل سے الگ کیا ہے۔"
  tr: "İbn Sina, üç gerçek Dürzî ile iki sahte Dürzî arasında ayrım yapar ve her birini şekline göre adlandırır {cite:canon-ibn-sina-print-v1 s.44}."
  id: "Ibn Sina membedakan antara tiga Druze sejati dan dua Druze palsu, menamai masing-masing berdasarkan bentuknya {cite:canon-ibn-sina-print-v1 hlm.44}."
