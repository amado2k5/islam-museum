label: { ar: "مسألة القبر وعذابه", en: "The questioning and punishment of the grave", ur: "قبر کا سوال اور عذابِ قبر" }
term: { ar: "فتنة القبر، المسألة في القبر، عذاب القبر", en: "fitnat al-qabr, al-mas'ala fi al-qabr, 'adhab al-qabr" }
summary:
  ar: "يعقد أبو داود في كتاب السنة «باب في المسألة في القبر وعذاب القبر»، ويروي فيه حديث البراء بن عازب أن المسلم إذا سئل في القبر فشهد أن لا إله إلا الله وأن محمداً رسول الله فذلك قوله «يثبت الله الذين آمنوا بالقول الثابت» ⁦(إبراهيم 27)⁩، وحديث أنس في الملكين اللذين يأتيان المقبور فيسألانه عمّا كان يعبد وعن «هذا الرجل»، وحديث البراء الطويل في السؤال عن الرب والدين والنبي وما يُفتح للمؤمن من الجنة وللكافر من النار {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 74-76}."
  en: "In the Book of the Sunna Abu Dawud has a 'chapter on the questioning in the grave and the punishment of the grave', with al-Bara' ibn 'Azib's report that when the Muslim is questioned in the grave and testifies that there is no god but God and that Muhammad is His Messenger, that is the meaning of 'God makes firm those who believe with the firm word' (Ibrahim 27), Anas's report of the angels who come to the buried person and ask what he worshipped and about 'this man', and al-Bara's long report of the questions about one's Lord, religion and prophet and of what is opened for the believer from Paradise and for the unbeliever from the Fire {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 74-76}."
  ur: "ابو داؤد کتاب السنہ میں «قبر میں سوال اور عذابِ قبر کا باب» رکھتے ہیں، جس میں براء بن عازب کی حدیث ہے کہ جب مسلمان سے قبر میں سوال ہوتا ہے اور وہ گواہی دیتا ہے کہ اللہ کے سوا کوئی معبود نہیں اور محمد اللہ کے رسول ہیں، تو یہی «اللہ ایمان والوں کو پکی بات سے ثابت قدم رکھتا ہے» (ابراہیم 27) کا مطلب ہے؛ انس کی حدیث ان فرشتوں کے بارے میں جو مدفون کے پاس آ کر پوچھتے ہیں کہ وہ کس کی عبادت کرتا تھا اور «اس شخص» کے بارے میں کیا کہتا تھا؛ اور براء کی طویل حدیث رب، دین اور نبی کے سوال اور مومن کے لیے جنت سے اور کافر کے لیے آگ سے کھولے جانے والے دروازے کے بارے میں {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 74-76}۔"
