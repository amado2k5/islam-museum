id: concept/ibtila
class: concept
kind: term
label: { ar: "الابتلاء والامتحان", en: "Trial and testing (ibtila')", es: "Ensayo y prueba (ibtila')", fr: "Essai et test (ibtila')", ur: "آزمائش اور جانچ ⁦(ابتلا)⁩", tr: "Duruşma ve Soruşturma", id: "Persidangan dan Pemeriksaan" }
issue:
  ar: "كيف يُفهم أن الله يعلم أو يعلم ليظهر، وهل يتغير العلم أم المعلوم؟"
summary:
  ar: "الامتحان الإلهي للناس، ويرد في قوله تعالى «لنعلم من يتبع الرسول». يعرض محمد رشيد رضا وجهين في معنى «لنعلم»: أن الفعل منسوب إلى الله على سبيل أسلوب العرب في إسناد الفعل إلى الرئيس الذي يأمر به، وأن العلم هنا علم وقوع يترتب عليه الجزاء، فيتجدد المعلوم لا العلم."
  en: "Divine testing of people, as in the verse about God's knowledge of who follows the Messenger. Muhammad Rashid Rida presents two readings of the phrase 'that We might know': first, that the verb is ascribed to God in the Arabic idiom of attributing an act to the ruler who orders it; second, that the knowledge here is knowledge of an event on which reward follows, so that what is known changes, not the knowledge."
  es: "La prueba divina a la que se somete a las personas, como en el versículo sobre el conocimiento que Dios tiene de quién sigue al Mensajero. Muhammad Rashid Rida presenta dos interpretaciones de la frase «para que sepamos»: primero, que el verbo se atribuye a Dios en la expresión árabe que atribuye un acto al gobernante que lo ordena; segundo, que el conocimiento aquí es el conocimiento de un acontecimiento que conlleva una recompensa, de modo que lo que cambia es lo que se sabe, no el conocimiento en sí."
  fr: "L'épreuve divine des hommes, comme dans le verset concernant la connaissance qu'a Dieu de ceux qui suivent le Messager. Muhammad Rashid Rida propose deux interprétations de l'expression « afin que Nous sachions »: premièrement, le verbe est attribué à Dieu selon l'expression arabe qui consiste à attribuer un acte au souverain qui l'ordonne; deuxièmement, la connaissance en question est la connaissance d'un événement qui entraîne une récompense, de sorte que c'est ce qui est connu qui change, et non la connaissance elle-même."
  ur: "لوگوں کی الہی آزمائش، جیسا کہ آیت میں خدا کے علم کے بارے میں ہے کہ کون رسول کی پیروی کرتا ہے۔ محمد راشد ردا نے 'جو ہم جان سکتے ہیں' کے فقرے کی دو تلاوتیں پیش کرتے ہیں: پہلا، یہ کہ عربی محاورے میں فعل کو خدا کی طرف منسوب کیا جاتا ہے جس کا حکم حاکم کی طرف منسوب کرنا ہے۔ دوسرا، یہ کہ یہاں علم ایک ایسے واقعہ کا علم ہے جس پر ثواب ہوتا ہے، تاکہ جو معلوم ہے وہ بدل جائے، علم نہیں۔"
  tr: "İnsanlar için ilahi sınav, \"Kimin Resulu'nu takip ettiğini bilebiliriz\" ayetinde belirtildiği gibi. Muhammed Rashid Rida, \"bize bildir\" ifadesinin iki yönünü sunar: eylemin Tanrı'ya atfedildiği, eylemin Arapça yöntemiyle eylemi emreden lidere atfettiği ve burada bilginin ödülü getiren olay bilgisi olduğu, böylece bilinen yenilendiği, bilgi değil."
  id: "Ujian ilahi bagi manusia, seperti yang dinyatakan dalam ayat, \"Kita dapat mengetahui siapa yang mengikuti Rasulul.\" Muhammad Rashid Rida menyajikan dua aspek makna \"beri tahu kami\": bahwa tindakan dikaitkan dengan Tuhan, mengikuti metode Arab yang mengaitkan tindakan kepada pemimpin yang memerintahkannya, dan bahwa pengetahuan di sini adalah pengetahuan tentang kejadian yang menghasilkan ganjaran, sehingga yang diketahui diperbarui, bukan pengetahuan."
