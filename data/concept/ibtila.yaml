id: concept/ibtila
class: concept
kind: term
label: { ar: "الابتلاء والامتحان", en: "Trial and testing (ibtila')" }
issue:
  ar: "كيف يُفهم أن الله يعلم أو يعلم ليظهر، وهل يتغير العلم أم المعلوم؟"
summary:
  ar: "الامتحان الإلهي للناس، ويرد في قوله تعالى «لنعلم من يتبع الرسول». يعرض محمد رشيد رضا وجهين في معنى «لنعلم»: أن الفعل منسوب إلى الله على سبيل أسلوب العرب في إسناد الفعل إلى الرئيس الذي يأمر به، وأن العلم هنا علم وقوع يترتب عليه الجزاء، فيتجدد المعلوم لا العلم."
  en: "Divine testing of people, as in the verse about God's knowledge of who follows the Messenger. Muhammad Rashid Rida presents two readings of the phrase 'that We might know': first, that the verb is ascribed to God in the Arabic idiom of attributing an act to the ruler who orders it; second, that the knowledge here is knowledge of an event on which reward follows, so that what is known changes, not the knowledge."
wings: [ideas]
