    stance:
      ar: "الفعل منسوب إلى الله على أسلوب العرب في إسناد الفعل إلى الرئيس"
    summary:
      ar: "قراءة يذكرها رضا عن الأستاذ الإمام، وفيها أن العرب تنسب إلى الأمير فتح البلد وإن لم يباشر القتال، وأن الله لما ولي المؤمنين وخاطبهم خطاب السيد صح الإسناد بصيغة الجمع. وينقل أمثلة من الحديث القدسي والقرآن يُحمل فيها الفعل على هذا الأسلوب. {cite:tafsir-manar-v02 p.7} {cite:tafsir-manar-v02 p.8}"
