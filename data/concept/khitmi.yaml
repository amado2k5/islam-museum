summary:
  ar: "خطمي في الكتاب اسمه باليونانية مشتق من اسم كثير المنافع، حار باعتدال، فيه تليين وإنضاج وإرخاء وتحليل وبزره وأصله في قوته وأقوى تجفيفا وألطف، يطلى به على البهق، ويليّن الأورام ويمنعها ويحلل الدموية وينضج الدماميل وينفع من الخنازير، ويسكن وجع المفاصل وخصوصا مع شحم الأوز، وبزره نافع من السعال الحار ويسهل النفث ويمنع نفث الدم، وصمغه يسكن العطش، وطبيخ أصوله ينفع من حرقة البول وحرقة المعي وأورام المقعدة، ويذكر الكتاب فيه قولا عن الرحم والنفاس في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.701-702}"
  en: "Khitmi is in the book named in Greek from the name of one of many benefits, hot with moderation, with softening, ripening, relaxing and dissolving, its seed and root of like power, stronger in drying and subtler; it is applied on bahaq, softens and prevents swellings, dissolves the sanguine, ripens boils and benefits scrofula, calms joint pain, especially with goose fat, its seed benefits hot cough, eases expectoration and prevents the spitting of blood, its gum calms thirst, and a decoction of its roots benefits burning of urine, burning of the intestine and swellings of the anus; the book gives a statement on the womb and the lochia in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.701-702}"
  ur: "خطمی کتاب میں ہے کہ اس کا یونانی نام بہت منافع والی چیز کے نام سے ماخوذ ہے، اعتدال کے ساتھ گرم، اس میں نرمی، پکانا، ڈھیلا کرنا اور تحلیل ہے، اس کا بیج اور جڑ اسی قوت کے ہیں، زیادہ خشک کرنے والے اور زیادہ لطیف؛ بہق پر لگایا جاتا ہے، ورموں کو نرم کرتا اور روکتا ہے، دموی کو تحلیل کرتا ہے، پھوڑوں کو پکاتا ہے اور خنازیر میں نافع ہے، جوڑوں کے درد کو تسکین دیتا ہے خصوصاً ہنس کی چربی کے ساتھ، اس کا بیج گرم کھانسی میں نافع ہے، بلغم نکالنا آسان کرتا ہے اور خون تھوکنا روکتا ہے، اس کا گوند پیاس کو تسکین دیتا ہے، اور اس کی جڑوں کا جوشاندہ پیشاب کی جلن، آنت کی جلن اور مقعد کے ورموں میں نافع ہے؛ کتاب رحم اور نفاس کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.701-702}۔"
