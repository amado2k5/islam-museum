summary:
  ar: "خطمي في الكتاب اسمه باليونانية مشتق من اسم كثير المنافع، حار باعتدال، فيه تليين وإنضاج وإرخاء وتحليل وبزره وأصله في قوته وأقوى تجفيفا وألطف، يطلى به على البهق، ويليّن الأورام ويمنعها ويحلل الدموية وينضج الدماميل وينفع من الخنازير، ويسكن وجع المفاصل وخصوصا مع شحم الأوز، وبزره نافع من السعال الحار ويسهل النفث ويمنع نفث الدم، وصمغه يسكن العطش، وطبيخ أصوله ينفع من حرقة البول وحرقة المعي وأورام المقعدة، ويذكر الكتاب فيه قولا عن الرحم والنفاس في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.701-702}"
  en: "Khitmi is in the book named in Greek from the name of one of many benefits, hot with moderation, with softening, ripening, relaxing and dissolving, its seed and root of like power, stronger in drying and subtler; it is applied on bahaq, softens and prevents swellings, dissolves the sanguine, ripens boils and benefits scrofula, calms joint pain, especially with goose fat, its seed benefits hot cough, eases expectoration and prevents the spitting of blood, its gum calms thirst, and a decoction of its roots benefits burning of urine, burning of the intestine and swellings of the anus; the book gives a statement on the womb and the lochia in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.701-702}"
  ur: "خطمی کتاب میں ہے کہ اس کا یونانی نام بہت منافع والی چیز کے نام سے ماخوذ ہے، اعتدال کے ساتھ گرم، اس میں نرمی، پکانا، ڈھیلا کرنا اور تحلیل ہے، اس کا بیج اور جڑ اسی قوت کے ہیں، زیادہ خشک کرنے والے اور زیادہ لطیف؛ بہق پر لگایا جاتا ہے، ورموں کو نرم کرتا اور روکتا ہے، دموی کو تحلیل کرتا ہے، پھوڑوں کو پکاتا ہے اور خنازیر میں نافع ہے، جوڑوں کے درد کو تسکین دیتا ہے خصوصاً ہنس کی چربی کے ساتھ، اس کا بیج گرم کھانسی میں نافع ہے، بلغم نکالنا آسان کرتا ہے اور خون تھوکنا روکتا ہے، اس کا گوند پیاس کو تسکین دیتا ہے، اور اس کی جڑوں کا جوشاندہ پیشاب کی جلن، آنت کی جلن اور مقعد کے ورموں میں نافع ہے؛ کتاب رحم اور نفاس کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.701-702}۔"
  es: "Khitmi, cuyo nombre en griego proviene de uno de sus muchos beneficios, es caliente con moderación, suavizante, madurador, relajante y disolvente; su semilla y raíz poseen un poder similar, siendo más fuertes para secar y más sutiles. Se aplica sobre el bahaq, suaviza y previene hinchazones, disuelve la sangre, madura forúnculos y beneficia la escrófula, calma el dolor articular, especialmente con grasa de ganso. Su semilla beneficia la tos caliente, facilita la expectoración y previene la escupición de sangre. Su goma calma la sed, y una decocción de sus raíces beneficia el ardor de orina, el ardor intestinal y las hinchazones del ano. El libro incluye una declaración sobre el útero y los loquios en una sección etiquetada reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.701-702}."
  fr: "Le khitmi est mentionné dans le livre, son nom grec étant dérivé de l'un de ses nombreux bienfaits. Chaud avec modération, il adoucit, mûrit, détend et dissout. Sa graine et sa racine ont une puissance similaire, plus asséchante et plus subtile. Appliqué sur le bahaq, il adoucit et prévient les gonflements, dissout le sang, fait mûrir les furoncles et est bénéfique en cas de scrofule. Il calme les douleurs articulaires, surtout associé à la graisse d'oie. Sa graine est bénéfique en cas de toux grasse, facilite l'expectoration et prévient les crachats de sang. Sa gomme calme la soif, et une décoction de ses racines est bénéfique en cas de brûlures urinaires, de brûlures intestinales et de gonflements anaux. Le livre contient une déclaration concernant l'utérus et les lochies dans une section intitulée réservée à l'avis du fondateur. {cite:canon-ibn-sina-print-v1 pp.701-702}"
  tr: "Kitaptaki marshmallowum, birçok faydası olan, ölçülü sıcak, yumuşayıp olgunlaşan, gevşetici, eriyen ve ekim yapan birçok faydası olan bir isimden türetilen Yunanca adlandırılmıştır. Kökeni gücünde, daha güçlü kurutmada ve daha nazik olmasıdır. Vitiligo kapar, tümörleri yumuşatır, önler, kanı parçalar, olgunlaştırır ve domuzlara fayda sağlar. Eklem ağrılarını yatıştırır, özellikle kaz yağıyla birlikte. Tohumları sıcak öksürükler için faydalıdır, üflemeyi kolaylaştırır ve kan pompalamasını engeller. Mukusu susuzluğu giderir ve orijinal pişirmesi idrar, mide yanması ve anal tümörler için faydalıdır. Kitap, 'Kurucu Kuralı' başlıklı bölümde rahim ve doğum sonrası kanama hakkında bir pasajdan bahseder {cite:canon-ibn-sina-print-v1 s.701-702}"
  id: "Marshmallow saya dalam buku ini dinamai dalam bahasa Yunani yang berasal dari nama yang memiliki banyak manfaat, panas dalam moderat, melunak dan matang, menenangkan, melarutkan, dan menabur. Asal-usulnya berasal dari kekuatannya, pengeringan yang lebih kuat, dan lebih lembut. Ia melapisi vitiligo, melunakkan tumor, mencegahnya, memecah darah, mematangkan bisul, dan bermanfaat bagi babi. Ia meredakan nyeri sendi, terutama dengan lemak angsa. Bijinya bermanfaat untuk batuk panas, memudahkan meniup, dan mencegah aliran darah. Lendirnya menghilangkan haus, dan masakan aslinya bermanfaat untuk membakar urine, maag, dan tumor anus. Buku ini menyebutkan sebuah bagian tentang rahim dan perdarahan pasca melahirkan dalam bagian berjudul 'Aturan Pendiri' {cite:canon-ibn-sina-print-v1 hlm.701-702}"
