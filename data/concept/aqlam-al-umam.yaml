label: { ar: "أقلام الأمم", en: "The nations' scripts", fr: "Les écritures des nations", es: "Los guiones de las naciones", ur: "قوموں کے رسم الخط", tr: "Ulusların Kalemleri", id: "Pena Bangsa" }
summary:
  ar: "مسح ابن النديم كتابات الأمم في الفن الأول: للمانوية قلم يشبه السرياني غيره وللمرقيونية قلم لا يحتصون به، وللصغد الذين أهلهم ثنوية ونصارى يسمون الثنوية بلسانهم احاركف قلم وقصبتهم تونكث، وللصين نحو مائتي قلم ويكتبون بالتسعة الأحرف فيزيدون بالنقط حتى يأتوا على حروف المعجم، وأجناس السودان من النوبة والبجة والزغاية والمراوة والإستان والبربر وأصناف الزنج لا قلم لهم ولا كتابة سوى السند يكتبون بالهندية للمجاورة، وللزنج خطابة وبلاغة على مذهبهم كما قال الجاحظ في البيان إذا حزبتهم الأمور جلس خطيبهم على ما علا من الأرض وتكلم بما يشبه الدمتمة والهمهمة فيفهم عنه الباقون، وللبجة قلم وكتابة لم تصل إليه، والنوبة تكتب بالسريانية والرومية والقبطية من أجل الدين، وللحبشة قلم حروفه متصلة كحروف الحميري يبتدئ من الشمال إلى اليمين يفرقون بين كل اسم بثلاث نقط، ولا قلم للترك والبلغر والبلغار والبرغز والخزر واللان سوى البلغر والتبت يكتبون بالصينية والمانانية والخزر بالعبرانية، وأخبره حمود حرار التركي أن ملك الترك الأعظم إذا كتب إلى ملك من الأصاغر أحضر وزيره وأمر بشق نشابة ونقش عليها نقوشاً يعرفها أفاضل الأتراك تدل على المعاني، وللروسية كتابة على الخشب حفراً، وكتابة الفرنجة تُشبه الخط الرومي أحسن استواء منه وربما رؤي على السيوف الفرنجية، وكانت ملكة الفرنجة كتبت إلى المكتفي كتاباً في حرير أبيض تخطب صداقته مع خادم وقع إلى بلدها من جهة المغرب {cite:fihrist-ibn-al-nadim p. 41-45}."
  en: "Manichaean, Sogdian, Chinese, Ethiopic, Nubian, Turkic carved-arrow and Rus wood scripts — plus Queen Berta's silk letter to al-Muktafi {cite:fihrist-ibn-al-nadim p. 41-45}."
  fr: "Écritures manichéenne, sogdienne, chinoise, éthiopienne, nubienne, turque sur flèche gravée et rus’ sur bois — ainsi que la lettre sur soie de la reine Berta à al-Muktafi {cite:fihrist-ibn-al-nadim p. 41-45}."
  es: "Escrituras maniqueas, sogdianas, chinas, etíopes, nubias, turcas con flechas talladas y rusas en madera, además de la carta de seda de la reina Berta a al-Muktafi {cite:fihrist-ibn-al-nadim p. 41-45}."
  ur: "مانیچیان، سغدیان، چینی، ایتھوپیک، نیوبین، ترکی کے تراشے ہوئے تیر اور روس کی لکڑی کے رسم الخط - علاوہ ملکہ برٹا کا المکتفی کو ریشم کا خط 41-45}۔"
  tr: "İbn el-Nadim, ulusların yazılarını ilk sanatta incelemiştir: Maniheizmin kalemi Süryaniceye benzer, Marqeoniyye'nin sahip olmadıkları bir kalemi vardır ve Sogdluların halkı Dhunwaniya ve Hristiyan olduğu için dilleriyle 'Tanwiya', 'Harkaf Qalam' ve kamışları Tonkatth olarak adlandırılır. Çinlilerin yaklaşık iki yüz kalemi vardır, dokuz harfle yazır ve sözlük harflerine kadar noktalarla artarlar. Sudan ırkları, Nubia, Beja, Zaghaya, Marwa, Istan, Berber ve Zanj'ın çeşitli kolları dahil olmak üzere, komşu amaçlarla Hintçe yazılmış anlatı zinciri dışında kaleme veya yazıya sahiptir. Zanjların doktrinlerinde hitabet ve hitabet vardır; Al-Jahiz'in Al-Bayan'da dediği gibi. Konular tartışmalı olduğunda, vaizleri yüksek bir yerde oturur ve diğerlerinin onu anlaması için mırıldanır ve fısıldardı. Beja'nın kalemi ve yazısı ona ulaşmamışken, Nubia dili din için Süryanice, Roma ve Kıptice olarak yazılır. Habeşistan'da ise harfleri Himyarit harfleri gibi, kuzeyden sağa doğru birbirine bağlı olan bir kalemi vardır ve her isim için üç nokta ayrılır. Türkler, Bulgarlar, Bulgarlar, Barghisler, Hazarlar ve Lanlar için kalem yoktur, sadece Bulgarlar vardır. Tibetliler Çince, Manani ve Hazarca İbranice yazırlar. Hamud Harrar the Turk ona, eğer yazarsa Türklerin en büyük kralı olduğunu söylemiştir Küçük bir kral, bakanını getirip, bir oklava kesmesini emretti; üzerine saygın Türklerin bildiği ve anlamlarını gösteren yazıtlar kazındı. Rus alfabesinde ahşap üzerinde oymalar vardır ve Frank alfabesi Roma alfabesine olduğundan daha çok benzer; Frank kılıçlarında da görülmüş olabilir. Frankların Kraliçesi, Al-Muktafi'ye beyaz ipekle bir mektup yazarak Mağrip'ten ülkesine gelen bir hizmetkârla dostluğunu teklif etti {atıf:Fihrist-ibn-al-nadim s. 41-45}."
  id: "Ibn al-Nadim meneliti tulisan-tulisan bangsa-bangsa dalam seni pertama: Manikheisme memiliki pena yang mirip dengan bahasa Siria, Marqeoniyyah memiliki pena yang tidak mereka miliki, dan orang Sogdian, yang kaumnya adalah Dhunwaniya dan Kristen, menyebutnya 'Tanwiya' dengan bahasa mereka, 'Harkaf Qalam' dan alang-alangnya adalah Tonkatth. Orang Tionghoa memiliki sekitar dua ratus pena, menulis dalam sembilan huruf, bertambah dengan titik-titik hingga mencapai huruf kamus. Ras-ras Sudan, termasuk Nubia, Beja, Zaghaya, Marwa, Istan, Berber, dan berbagai cabang Zanj, tidak memiliki pena atau tulisan kecuali rantai narasi yang ditulis dalam bahasa Hindi untuk tujuan tetangga. Zanj memiliki orasi dan kefasihan dalam doktrin mereka, seperti yang dikatakan Al-Jahiz dalam Al-Bayan Ketika ada perselisihan, pengkhotbah mereka duduk di tanah tinggi dan berbicara dengan gumaman dan bisikan, sehingga yang lain memahaminya. Beja memiliki pena dan tulisan yang belum sampai kepadanya, sedangkan Nubia ditulis dalam bahasa Siria, Romawi, dan Koptik untuk agama. Untuk Abyssinia, ia memiliki pena yang hurufnya terhubung seperti huruf Himyarit, dimulai dari utara ke kanan, dipisahkan oleh tiga titik untuk setiap nama. Tidak ada pena untuk Turki, Bulgar, Bulgar, Barghi, Khazar, dan Lan kecuali orang Bulgar. Orang Tibet menulis dalam bahasa Tionghoa, Manani, dan Khazar dalam bahasa Ibrani. Hamud Harrar si Turki memberitahunya bahwa raja terbesar orang Turki, jika ia menulis Kepada seorang raja kecil yang membawa menterinya dan memerintahkan pemotongan penggiling, terukir di atasnya prasasti yang dikenal oleh orang Turki terhormat yang menunjukkan makna. Aksara Rusia memiliki ukiran di kayu, dan aksara Franka lebih mirip dengan aksara Romawi daripada aslinya serta mungkin terlihat pada pedang Franka. Ratu Franka menulis surat kepada Al-Muktafi dari sutra putih yang menawarkan persahabatannya kepada seorang pelayan yang datang ke negaranya dari Maghreb {cite:fihrist-ibn-al-nadim hlm. 41-45}."
