label: { ar: "أقلام الأمم", en: "The nations' scripts" }
summary:
  ar: "مسح ابن النديم كتابات الأمم في الفن الأول: للمانوية قلم يشبه السرياني غيره وللمرقيونية قلم لا يحتصون به، وللصغد الذين أهلهم ثنوية ونصارى يسمون الثنوية بلسانهم احاركف قلم وقصبتهم تونكث، وللصين نحو مائتي قلم ويكتبون بالتسعة الأحرف فيزيدون بالنقط حتى يأتوا على حروف المعجم، وأجناس السودان من النوبة والبجة والزغاية والمراوة والإستان والبربر وأصناف الزنج لا قلم لهم ولا كتابة سوى السند يكتبون بالهندية للمجاورة، وللزنج خطابة وبلاغة على مذهبهم كما قال الجاحظ في البيان إذا حزبتهم الأمور جلس خطيبهم على ما علا من الأرض وتكلم بما يشبه الدمتمة والهمهمة فيفهم عنه الباقون، وللبجة قلم وكتابة لم تصل إليه، والنوبة تكتب بالسريانية والرومية والقبطية من أجل الدين، وللحبشة قلم حروفه متصلة كحروف الحميري يبتدئ من الشمال إلى اليمين يفرقون بين كل اسم بثلاث نقط، ولا قلم للترك والبلغر والبلغار والبرغز والخزر واللان سوى البلغر والتبت يكتبون بالصينية والمانانية والخزر بالعبرانية، وأخبره حمود حرار التركي أن ملك الترك الأعظم إذا كتب إلى ملك من الأصاغر أحضر وزيره وأمر بشق نشابة ونقش عليها نقوشاً يعرفها أفاضل الأتراك تدل على المعاني، وللروسية كتابة على الخشب حفراً، وكتابة الفرنجة تُشبه الخط الرومي أحسن استواء منه وربما رؤي على السيوف الفرنجية، وكانت ملكة الفرنجة كتبت إلى المكتفي كتاباً في حرير أبيض تخطب صداقته مع خادم وقع إلى بلدها من جهة المغرب {cite:fihrist-ibn-al-nadim p. 41-45}."
  en: "Manichaean, Sogdian, Chinese, Ethiopic, Nubian, Turkic carved-arrow and Rus wood scripts — plus Queen Berta's silk letter to al-Muktafi {cite:fihrist-ibn-al-nadim p. 41-45}."
