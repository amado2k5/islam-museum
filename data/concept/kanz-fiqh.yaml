id: concept/kanz-fiqh
class: concept
kind: legal
label:
  ar: "كَنْز"
  en: "Hidden treasure (kanz), fiqh rulings"
  ur: "کنز (چھپا ہوا خزانہ، فقہی احکام)"
summary:
  ar: "الكنز في اللغة الجمع والادخار، والمال المدفون تحت الأرض، وكل كثير مجموع يتنافس فيه؛ وفي الاصطلاح عند الجمهور ما دفنه أهل الجاهلية، ويطلق على كل مال، وخصه الشافعية بالذهب والفضة، وعرفه الحنفية بأنه مال مركوز تحت الأرض من غير اعتبار لراكزه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13514}، والكنز أعم من الركاز {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13514}."
  en: "Kanz, in lexicon, is gathering and storing, buried wealth, or any gathered abundance; in law, the majority take it as what the people of the Jahiliyya buried, applying to any property, while the Shafi'is limit it to gold and silver and the Hanafis define it as property placed under the ground by any creator; kanz is wider than rikaz {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13514}."
  ur: "کنز لغت میں جمع کرنے اور ذخیرہ کرنے، زمین میں دبے ہوئے مال، یا ہر جمع شدہ کثرت کو کہتے ہیں؛ اصطلاح میں جمہور کے نزدیک یہ وہ مال ہے جو زمانۂ جاہلیت کے لوگوں نے دفن کیا، اور ہر مال پر بولا جاتا ہے؛ شافعیہ اسے سونے چاندی تک محدود کرتے ہیں، اور حنفیہ کے نزدیک یہ زمین کے نیچے رکھا ہوا مال ہے خواہ رکھنے والا خالق ہو یا مخلوق؛ کنز رکاز سے عام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13514}۔"
