summary:
  ar: "يسمّي الفهرس الصورة السبع، أي الوحش، ويأتي قسمها بعد قسم القنطورس. تتناول الحواشي بعده نجمًا يسميه بعض العرب رِجل القنطورس، ويذكر المحقق آراء بيلي في تعيينه. لا تُنقل المواضع. {cite:nallino-albatenii-opus-astronomicum pp.174}"
  en: "The catalogue names the figure al-Sab', the beast (bellua). Its section follows Centaurus, and the notes after it discuss a star that other Arabs call rijl Qintawrus, the foot of the Centaur, which the editor cites Baily on as unidentified. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.174}"
  ur: "فہرست میں درندہ، یعنی السبع، کی صورت ہے، اور اس کا حصہ قنطورس کے بعد آتا ہے۔ اس کے بعد کے حواشی میں ایک ستارہ ہے جسے دوسرے عرب رجل القنطورس کہتے ہیں، اور مرتب بیلی کی رائے نقل کرتا ہے کہ یہ ستارہ پہچانا نہیں جاتا۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.174}"
  es: "El catálogo denomina a la figura al-Sab', la bestia (bellua). Su sección sigue a Centaurus, y las notas posteriores tratan sobre una estrella que otros árabes llaman rijl Qintawrus, el pie del Centauro, que el editor cita a Baily como no identificada. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.174}"
  fr: "Le catalogue nomme la figure al-Sab', la bête (bellua). Sa section suit celle du Centaure, et les notes qui suivent évoquent une étoile que d'autres Arabes appellent rijl Qintawrus, le pied du Centaure, et que l'éditeur cite Baily comme non identifiée. Les positions ne sont pas transcrites ici. {cite:nallino-albatenii-opus-astronomicum pp.174}"
