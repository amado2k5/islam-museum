id: concept/al-qital-fi-sabil-allah
class: concept
kind: legal
label:
  ar: "القتال في سبيل الله"
  en: "Fighting in the way of God (qital fi sabil Allah)"
summary:
  ar: "يرى الشعراوي أن القتال في الإسلام لدفع العدوان وحماية اختيار الناس في الدين، لا لإكراههم عليه، وأن القتال تأخر في مكة لأن الدعوة تحتاج إلى قدوة وتدرج، وأن حرمة الشهر والمكان تُقابل بالمثل، وأن الفتنة في الدين أشد من القتل، وأن من أسلم عُصم دمه. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.815}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.816}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.817}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.818}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.820}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.825}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.826}"
  en: "Sha'rawi holds that fighting in Islam repels aggression and protects people's choice of religion, not compelling them into it; that it was delayed in Mecca because the call needed a model and gradual steps; that a sacred month or place is met in kind; that strife in religion is worse than killing; and that one who embraces Islam has his blood protected {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.815}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.816}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.817}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.818}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.820}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.825}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.826}."
wings: [ideas]
themes: [wars-and-campaigns, laws-of-war-and-peace]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "ما غاية القتال في الإسلام وحدوده، ولماذا تأخر تشريعه، وهل هو دفاع عن المؤمنين وحدهم؟"
  en: "What is the purpose and limit of fighting in Islam, why was it delayed, and is it defence only of believers?"
perspectives:
  - tradition: sunni
    id: sharawi-defensive-fighting
    stance:
      ar: "القتال دفع للعدوان وحماية لحرية الاختيار في الدين، وليس إكراهاً عليه، ومن أسلم عُصم دمه"
      en: "Fighting repels aggression and protects freedom of choice in religion, not compelling it; one who embraces Islam is protected in his blood"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن آية [[passage/quran-2-190|190 من البقرة]] تقيد القتال بمن يقاتل، وأن المعتدين لا يُقاتلون، وأن العدو إذا انتهى فلا عدوان إلا على الظالمين، وأن الإسلام لا إكراه فيه وفق [[passage/quran-2-256|الآية 256 من البقرة]]، ويستدل على أن الجزية تُثبت حرية الاعتقاد. ويذكر أن تأخير القتال كان لتمحيص الصفوف وتألف القلوب، ويروي أمثلة من الصحابة الذين كانوا خصوماً ثم أسلموا، دون ترتيب زمني موثق. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.815}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.816}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.817}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.818}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.819}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.822}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.826}"
      en: "Sha'rawi reads [[passage/quran-2-190|2:190]] as limiting fighting to those who fight; he holds that when the enemy stops there is no aggression except against wrongdoers; and that the verse on no compulsion in religion ([[passage/quran-2-256|2:256]]) means that the jizya protects freedom of belief. He says delay was to sift the ranks and win hearts, and recounts former enemies who later embraced Islam, without a checked order {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.815}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.816}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.817}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.818}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.819}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.822}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.826}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-jihad-debate
    stance:
      ar: "خلاف الفقهاء في الجهاد الابتدائي وأحكام الحرب والأسرى لم يُدخل من مصدر مراجَع في هذه الدفعة"
      en: "The jurists' disagreement on offensive jihad and the rules of war and captives is not entered from a checked source in this batch"
    holders: []
    summary:
      ar: "يقرر الشعراوي أن القتال دفاع، ولم تُدخل هنا أقوال الفقهاء في الجهاد الابتدائي، ولا الرأي الأكاديمي، ولا الآراء الأخرى التي تنتقد هذا التوصيف. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.826}"
      en: "Sha'rawi holds that fighting is defence; the jurists' views on offensive jihad, the academic view and the other views that dispute this characterisation are not entered here {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.826}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
