id: concept/hija-fiqh
class: concept
kind: legal
label: { ar: "هِجَاء", en: "Hija' (satire and insult in verse: its rules)", es: "Hija' (sátira e insulto en verso: sus reglas)", fr: "Hija' (satire et insulte en vers: ses règles)", ur: "حجا ⁦(آیت میں طنز اور توہین: اس کے احکام)⁩" }
summary:
  ar: "الهجاء في اللغة خلاف المدح، وهو السب والشتم وتعديد المعايب، وقد يكون تقطيع اللفظة إلى حروفها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} ويفترق عن السب بأن الهجاء يكون بالشعر، والسب أعم، وعن القذف بأن القذف رمي بالزنا أو نفي النسب، والهجاء أعم، وعن الغيبة بأن الغيبة تكون في غيبة المقول فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16811} وذهب الفقهاء إلى جواز هجاء الكافر غير المعصوم والمرتد، لأن النبي أمر حسان بهجو الكفار، ولا يجوز هجاء المسلم، واستثنى الشافعية المبتدع والفاسق المعلن بفسقه، وأجاز الحنفية هجاء المنافق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} وحكم هجاء الأموات كالأحياء، لنهي النبي عن سب الأموات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} ومن تهاجى الناس ظلماً فالإثم على البادئ، والانتصار جائز بقدر الظلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} وللإمام أن يعزر من يهجو الناس بغير حق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814}"
  en: "Hija', in the lexical sense, is the opposite of praise: it is abuse and enumeration of faults; the word also means spelling out the letters of a word. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} It differs from sabb (abuse, which is wider), from qadhf (accusing a free Muslim of unchastity or of a false lineage), and from ghiba (backbiting, said in the absence of the person). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16811} Most jurists allow satirising an unbelieving non-protected person and an apostate, since the Prophet bade Hassan ibn Thabit satirise the unbelievers, and forbid satirising a Muslim; the Shafi'is except an innovator and an open sinner; the Hanafis allow satire of a hypocrite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} Satirising the dead is judged as satirising the living. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} If two men abuse each other, the sin falls on the one who began, and retaliation is allowed to the extent of the wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} The imam may discipline one who satirises people without right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814}"
  es: "Hija', en sentido léxico, es lo opuesto a la alabanza: es abuso y enumeración de faltas; la palabra también significa deletrear las letras de una palabra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} Se diferencia de sabb (abuso, que es más amplio), de qadhf (acusar a un musulmán libre de impureza o de un linaje falso) y de ghiba (calumnia, dicha en ausencia de la persona). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16811} La mayoría de los juristas permiten satirizar a una persona no creyente no protegida y a un apóstata, ya que el Profeta ordenó a Hassan ibn Thabit satirizar a los no creyentes y prohibió satirizar a un musulmán; los shafi'is excepto a un innovador y a un pecador abierto; los hanafíes permiten la sátira de un hipócrita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} Satirizar a los muertos se considera satirizar a los vivos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} Si dos hombres se insultan mutuamente, el pecado recae sobre quien empezó, y se permite la represalia en proporción a la falta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} El imán puede disciplinar a quien satiriza a la gente sin derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814}"
  fr: "Hija', au sens lexical, est l'opposé de l'éloge: il s'agit d'injures et d'énumérations de fautes; le mot signifie également épeler les lettres d'un mot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} Il diffère de sabb (injure, qui est plus large), de qadhf (accuser un musulman libre d'impureté ou d'une fausse lignée), et de ghiba (médisance, dite en l'absence de la personne). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16811} La plupart des juristes autorisent la satire d'un incroyant non protégé et d'un apostat, car le Prophète a enjoint à Hassan ibn Thabit de satiriser les incroyants, et interdisent de satiriser un musulman; les chaféites l'autorisent sauf un innovateur et un pécheur notoire; les hanafites autorisent la satire d'un hypocrite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} La satire des morts est considérée comme une satire des vivants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} Si deux hommes s'insultent, le péché retombe sur celui qui a commencé, et la vengeance est permise à la mesure du tort causé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} L'imam peut sanctionner celui qui se moque des gens sans raison valable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814}"
  ur: "حیا لغوی معنوں میں تعریف کے مخالف ہے: یہ زیادتی اور عیوب کا شمار ہے۔ اس لفظ کا مطلب بھی کسی لفظ کے حروف کو ہجے کرنا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16809} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16810} یہ سب ⁦(گالی، جو وسیع تر ہے)⁩، قذف ⁦(کسی آزاد مسلمان پر بدکاری کا الزام لگانا)⁩ سے مختلف ہے شخص کی غیر موجودگی)۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16810} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16811} اکثر فقہاء نے ایک کافر غیر محفوظ شخص اور مرتد پر طنز کرنے کی اجازت دی ہے، چونکہ نبی نے حسنین اور تابعین کو بدعت دی ہے۔ ایک مسلمان پر طنز کرنا؛ شافعی سوائے بدعتی اور کھلے گناہ کے۔ احناف منافق کے طنز کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16812} مردہ پر طنز کرنا زندہ پر طنز کرنا ہے۔ اگر دو آدمی ایک دوسرے کو گالی دیں تو گناہ شروع کرنے والے پر پڑے گا اور بدلہ غلط کی حد تک جائز ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16813} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16814} امام اس شخص کو تادیب کر سکتا ہے جو بلاوجہ لوگوں پر طنز کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16814}"
