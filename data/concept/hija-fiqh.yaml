id: concept/hija-fiqh
class: concept
kind: legal
label: { ar: "هِجَاء", en: "Hija' (satire and insult in verse: its rules)" }
summary:
  ar: "الهجاء في اللغة خلاف المدح، وهو السب والشتم وتعديد المعايب، وقد يكون تقطيع اللفظة إلى حروفها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} ويفترق عن السب بأن الهجاء يكون بالشعر، والسب أعم، وعن القذف بأن القذف رمي بالزنا أو نفي النسب، والهجاء أعم، وعن الغيبة بأن الغيبة تكون في غيبة المقول فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16811} وذهب الفقهاء إلى جواز هجاء الكافر غير المعصوم والمرتد، لأن النبي أمر حسان بهجو الكفار، ولا يجوز هجاء المسلم، واستثنى الشافعية المبتدع والفاسق المعلن بفسقه، وأجاز الحنفية هجاء المنافق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} وحكم هجاء الأموات كالأحياء، لنهي النبي عن سب الأموات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} ومن تهاجى الناس ظلماً فالإثم على البادئ، والانتصار جائز بقدر الظلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} وللإمام أن يعزر من يهجو الناس بغير حق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814}"
  en: "Hija', in the lexical sense, is the opposite of praise: it is abuse and enumeration of faults; the word also means spelling out the letters of a word. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} It differs from sabb (abuse, which is wider), from qadhf (accusing a free Muslim of unchastity or of a false lineage), and from ghiba (backbiting, said in the absence of the person). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16811} Most jurists allow satirising an unbelieving non-protected person and an apostate, since the Prophet bade Hassan ibn Thabit satirise the unbelievers, and forbid satirising a Muslim; the Shafi'is except an innovator and an open sinner; the Hanafis allow satire of a hypocrite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} Satirising the dead is judged as satirising the living. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16812} If two men abuse each other, the sin falls on the one who began, and retaliation is allowed to the extent of the wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814} The imam may discipline one who satirises people without right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16814}"
