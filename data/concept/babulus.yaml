  ur: "کتاب اسے وحشی اور کریمی پوست کہتی ہے۔ یہ یتوع کی طرح پیٹ ڈھیلا کرتی ہے، بہت گرم ہے، اور یتوعات کی طرح مسہل ہے {cite:canon-ibn-sina-print-v1 p.412}۔"
  es: "El libro la llama la amapola silvestre y crema. Actúa como el yatu' para ablandar el intestino, es muy caliente y purga como el yatu'at {cite:canon-ibn-sina-print-v1 p.412}."
