summary:
  ar: "يبين ابن سينا أن اليابس من البراز يدل على تعب وتحلل أو كثرة بول أو حرارة نارية، وأن اللون الطبيعي ناري خفيف، ويفصل دلالات الشديد والناقص والأبيض والأسود والأخضر. {cite:canon-ibn-sina-print-v1 p.199}."
  en: "Ibn Sina says dry stool shows fatigue and dissolution, much urine or fiery heat, that the natural colour is lightly fiery, and he sets out what intense, pale, white, black and green stool show. {cite:canon-ibn-sina-print-v1 p.199}."
