label: { ar: "يبوسة البراز ولونه عند ابن سينا", en: "Dryness and colour of the stool in the Canon", ur: "فضلے کی خشکی اور رنگ قانون میں", es: "Sequedad y color de las heces en el Canon", fr: "Sécheresse et couleur des selles dans le Canon" }
summary:
  ar: "يبين ابن سينا أن اليابس من البراز يدل على تعب وتحلل أو كثرة بول أو حرارة نارية، وأن اللون الطبيعي ناري خفيف، ويفصل دلالات الشديد والناقص والأبيض والأسود والأخضر. {cite:canon-ibn-sina-print-v1 p.199}."
  en: "Ibn Sina says dry stool shows fatigue and dissolution, much urine or fiery heat, that the natural colour is lightly fiery, and he sets out what intense, pale, white, black and green stool show. {cite:canon-ibn-sina-print-v1 p.199}."
  es: "Ibn Sina afirma que las heces secas indican fatiga y disolución, las heces con mucha orina o calor intenso, que el color natural es ligeramente rojizo, y describe lo que indican las heces intensas, pálidas, blancas, negras y verdes. {cite:canon-ibn-sina-print-v1 p.199}."
  fr: "Ibn Sina affirme que des selles sèches indiquent fatigue et épuisement, une urine abondante ou une forte chaleur, que leur couleur naturelle est légèrement rougeâtre, et il décrit la signification des selles intenses, pâles, blanches, noires et vertes. {cite:canon-ibn-sina-print-v1 p.199}."
