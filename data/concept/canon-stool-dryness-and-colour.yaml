id: concept/canon-stool-dryness-and-colour
class: concept
kind: scientific
label: { ar: "يبوسة البراز ولونه عند ابن سينا", en: "Dryness and colour of the stool in the Canon", ur: "فضلے کی خشکی اور رنگ قانون میں", es: "Sequedad y color de las heces en el Canon", fr: "Sécheresse et couleur des selles dans le Canon", tr: "İbn Sina'ya göre tabureye ve rengine öpücük", id: "Mencium bangku dan warnanya menurut Ibn Sina" }
summary:
  ar: "يبين ابن سينا أن اليابس من البراز يدل على تعب وتحلل أو كثرة بول أو حرارة نارية، وأن اللون الطبيعي ناري خفيف، ويفصل دلالات الشديد والناقص والأبيض والأسود والأخضر. {cite:canon-ibn-sina-print-v1 p.199}."
  en: "Ibn Sina says dry stool shows fatigue and dissolution, much urine or fiery heat, that the natural colour is lightly fiery, and he sets out what intense, pale, white, black and green stool show. {cite:canon-ibn-sina-print-v1 p.199}."
  es: "Ibn Sina afirma que las heces secas indican fatiga y disolución, las heces con mucha orina o calor intenso, que el color natural es ligeramente rojizo, y describe lo que indican las heces intensas, pálidas, blancas, negras y verdes. {cite:canon-ibn-sina-print-v1 p.199}."
  fr: "Ibn Sina affirme que des selles sèches indiquent fatigue et épuisement, une urine abondante ou une forte chaleur, que leur couleur naturelle est légèrement rougeâtre, et il décrit la signification des selles intenses, pâles, blanches, noires et vertes. {cite:canon-ibn-sina-print-v1 p.199}."
  ur: "ابن سینا کا کہنا ہے کہ خشک پاخانہ تھکاوٹ اور تحلیل، بہت زیادہ پیشاب یا آگ کی گرمی کو ظاہر کرتا ہے، کہ قدرتی رنگ ہلکا جلتا ہے، اور وہ یہ بتاتا ہے کہ کیا شدید، پیلا، سفید، سیاہ اور سبز پاخانہ ظاہر کرتا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 199}۔"
  tr: "İbn Sina, kuru dışkının yorgunluk, çürüme, sık idrara çıkma veya ateşli sıcaklığı gösterdiğini, doğal rengin ise hafif ateşli olduğunu ve şiddetli ve eksik, beyaz, siyah ve yeşilin anlamlarını ayırt ettiğini açıklar. {cite:canon-ibn-sina-print-v1 s.199}."
  id: "Ibn Sina menjelaskan bahwa kotoran kering menunjukkan kelelahan, pembusukan, sering buang air kecil, atau panas yang membara, dan warna alaminya adalah terang berapi, membedakan arti berat dan kurang, putih, hitam, dan hijau. {cite:canon-ibn-sina-print-v1 hlm.199}."
