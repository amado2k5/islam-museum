label: { ar: "الحائط", en: "Wall (haith) and the shared wall", ur: "حائط", es: "Muro (haith) y el muro compartido", fr: "Mur (haith) et mur mitoyen", tr: "Duvar", id: "Tembok" }
summary:
  ar: "الحائط الجدار، وتعرض الموسوعة أحكام الجدار المشترك، وإجبار الشريك على الإسهام في عمارته، وحق وضع الخشب على جدار الجار، وهدم الحائط الذي يخشى سقوطه. وترى الحنابلة وقديم قول الشافعية أن الجار يجبر على تمكين جاره من غرز خشبه في جداره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6695}"
  en: "The wall (haith) and the rules on a shared wall: how a partner may be compelled to share the cost of repair, the right to set one's beams into a neighbour's wall, and the demolition of a wall that threatens to fall. The Hanbalis and the older Shafi'i view hold that a neighbour may be compelled to allow his neighbour's beams into the wall. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6695}"
  ur: "حائط یعنی دیوار۔ اس میں مشترکہ دیوار کے احکام آتے ہیں: مرمت کے خرچ میں شریک کو شامل کرنا، پڑوسی کی دیوار میں شہتیر رکھنے کا حق، اور گرنے کے خطرے والی دیوار کو گرانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6694}"
  es: "El muro (haith) y las reglas sobre un muro compartido: cómo se puede obligar a un socio a compartir el costo de la reparación, el derecho a colocar las propias vigas en el muro del vecino y la demolición de un muro que amenaza con derrumbarse. La visión hanbalí y la antigua shafi'í sostienen que un vecino puede verse obligado a permitir que las vigas de su vecino se coloquen en el muro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6695}"
  fr: "Le mur (haith) et les règles relatives aux murs mitoyens: comment un partenaire peut être contraint de participer aux frais de réparation, le droit d’ancrer ses poutres dans le mur du voisin et la démolition d’un mur menaçant de s’effondrer. Les écoles hanbalite et shafi’ite (plus ancienne) estiment qu’un voisin peut être contraint d’autoriser l’ancrage des poutres de son voisin dans le mur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6695}"
  tr: "Duvar duvardır ve ansiklopedi, ortak duvarın inşasına katkıda bulunmaya zorlayan kuralları, komşunun duvarına ahşap koyma hakkını ve yıkılmasından korkulan duvarı yıkmayı sunar. Hanbali okulu ve eski Şafii görüşü, komşunun komşusunun ahşabını duvara gömmesine izin vermek zorunda kaldığını savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6695}"
  id: "Tembok adalah tembok, dan ensiklopedia menyajikan aturan tentang tembok bersama, memaksa mitra untuk berkontribusi pada pembangunannya, hak untuk menempatkan kayu di tembok tetangga, dan merobohkan tembok yang ditakuti akan runtuh. Mazhab Hanbali dan pandangan lama Shafi'i menyatakan bahwa tetangga dipaksa mengizinkan tetangganya menanamkan kayunya ke dalam tembok. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6695}"
