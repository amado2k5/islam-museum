label: { ar: "الحائط", en: "Wall (haith) and the shared wall", ur: "حائط" }
summary:
  ar: "الحائط الجدار، وتعرض الموسوعة أحكام الجدار المشترك، وإجبار الشريك على الإسهام في عمارته، وحق وضع الخشب على جدار الجار، وهدم الحائط الذي يخشى سقوطه. وترى الحنابلة وقديم قول الشافعية أن الجار يجبر على تمكين جاره من غرز خشبه في جداره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6695}"
  en: "The wall (haith) and the rules on a shared wall: how a partner may be compelled to share the cost of repair, the right to set one's beams into a neighbour's wall, and the demolition of a wall that threatens to fall. The Hanbalis and the older Shafi'i view hold that a neighbour may be compelled to allow his neighbour's beams into the wall. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6695}"
  ur: "حائط یعنی دیوار۔ اس میں مشترکہ دیوار کے احکام آتے ہیں: مرمت کے خرچ میں شریک کو شامل کرنا، پڑوسی کی دیوار میں شہتیر رکھنے کا حق، اور گرنے کے خطرے والی دیوار کو گرانا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6694}"
