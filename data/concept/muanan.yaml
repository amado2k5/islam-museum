label:
  ar: "المعنعن ⁦(العنعنة)⁩"
  en: "Mu'an'an (chain linked by 'from')"
summary:
  ar: "الإسناد المعنعن ما يقال فيه: فلان عن فلان. عدّه بعض الناس من المرسل والمنقطع حتى يتبين اتصاله، والصحيح الذي عليه العمل عند ابن الصلاح أنه متصل بشرط ثبوت لقاء الرواة بعضهم بعضاً وبراءتهم من التدليس، وكاد ابن عبد البر يدّعي فيه إجماع أئمة الحديث. واكتفى مسلم في مقدمة صحيحه بالمعاصرة وإمكان اللقاء، وأنكر اشتراط ثبوت اللقاء، وقيل إن القول الذي رده هو قول علي بن المديني والبخاري. واختلفوا في «أنّ فلاناً قال» هل هي مثل «عن» {cite:muqaddima-ibn-salah-itr p. 61-67}."
  en: "A mu'an'an chain is one phrased 'so-and-so from so-and-so'. Some counted it as mursal or broken until its connection was shown; the sound view acted upon, for Ibn al-Salah, is that it is connected provided the narrators are known to have met and are free of tadlis, and Ibn Abd al-Barr almost claimed the hadith imams' consensus on it. In the preface to his Sahih Muslim held contemporaneity and the possibility of meeting enough and rejected the requirement of proven meeting, a requirement said to be that of Ali ibn al-Madini and al-Bukhari. Scholars also differed over whether 'that so-and-so said' (anna) equals 'from' (an)."
