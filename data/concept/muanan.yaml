id: concept/muanan
class: concept
kind: term
label:
  ar: "المعنعن ⁦(العنعنة)⁩"
  en: "Mu'an'an (chain linked by 'from')"
  es: "Mu'an'an (cadena unida por 'desde')"
  fr: "Mu'an'an (chaîne liée par 'de')"
  ur: "Mu'an'an ⁦('منجانب' سے منسلک سلسلہ)⁩"
  tr: "Al-Ma'an'an (Al-An'ana)"
  id: "Al-Ma'an'an (Al-An'ana)"
summary:
  ar: "الإسناد المعنعن ما يقال فيه: فلان عن فلان. عدّه بعض الناس من المرسل والمنقطع حتى يتبين اتصاله، والصحيح الذي عليه العمل عند ابن الصلاح أنه متصل بشرط ثبوت لقاء الرواة بعضهم بعضاً وبراءتهم من التدليس، وكاد ابن عبد البر يدّعي فيه إجماع أئمة الحديث. واكتفى مسلم في مقدمة صحيحه بالمعاصرة وإمكان اللقاء، وأنكر اشتراط ثبوت اللقاء، وقيل إن القول الذي رده هو قول علي بن المديني والبخاري. واختلفوا في «أنّ فلاناً قال» هل هي مثل «عن» {cite:muqaddima-ibn-salah-itr p. 61-67}."
  en: "A mu'an'an chain is one phrased 'so-and-so from so-and-so'. Some counted it as mursal or broken until its connection was shown; the sound view acted upon, for Ibn al-Salah, is that it is connected provided the narrators are known to have met and are free of tadlis, and Ibn Abd al-Barr almost claimed the hadith imams' consensus on it. In the preface to his Sahih Muslim held contemporaneity and the possibility of meeting enough and rejected the requirement of proven meeting, a requirement said to be that of Ali ibn al-Madini and al-Bukhari. Scholars also differed over whether 'that so-and-so said' (anna) equals 'from' (an)."
  es: "Una cadena mu'an'an es aquella que se expresa como «fulano de tal de mengano». Algunos la consideraban mursal o rota hasta que se demostrara su conexión; la opinión más aceptada, según Ibn al-Salah, es que está conectada siempre que se sepa que los narradores se conocieron y estén libres de tadlis, e Ibn Abd al-Barr casi afirmó el consenso de los imanes de hadices al respecto. En el prefacio de su Sahih Muslim, sostuvo que la contemporaneidad y la posibilidad de encuentro eran suficientes y rechazó el requisito de encuentro probado, un requisito que se dice que fue el de Ali ibn al-Madini y al-Bukhari. Los eruditos también discreparon sobre si «que fulano dijo» (anna) equivale a «de» (an)."
  fr: "Une chaîne mu'an'an est une chaîne formulée ainsi: « untel de la part d'untel ». Certains la considéraient comme mursal, c'est-à-dire interrompue, jusqu'à ce que sa continuité soit établie. L'avis généralement retenu, selon Ibn al-Salah, est qu'elle est valide dès lors que les narrateurs se sont rencontrés et que leur transmission est exempte de tadlis. Ibn Abd al-Barr affirmait presque que les imams du hadith s'accordaient sur ce point. Dans la préface de son Sahih Muslim, il jugeait la contemporanéité et la possibilité de rencontre suffisantes et rejetait l'exigence d'une rencontre prouvée, une exigence attribuée à Ali ibn al-Madini et al-Bukhari. Les savants divergeaient également quant à l'équivalence entre « untel a dit » (anna) et « de la part de » (an)."
  ur: "ایک موعن سلسلہ ایک جملہ ہے جس میں 'فلاں فلاں سے فلاں' ہے۔ بعض نے اسے مرسل یا ٹوٹا ہوا شمار کیا جب تک کہ اس کا تعلق ظاہر نہ ہو جائے۔ ابن الصلاح کے نزدیک صحیح قول یہ ہے کہ یہ متصل ہے بشرطیکہ راویوں کی ملاقات ہوئی ہو اور وہ تدلیس سے پاک ہوں، اور ابن عبد البر نے تقریباً اس پر ائمہ حدیث کے اجماع کا دعویٰ کیا ہے۔ اپنی صحیح مسلم کے دیباچے میں معاصریت اور ملاقات کے امکان کو کافی قرار دیا ہے اور ثابت ملاقات کے تقاضے کو رد کیا ہے، ایک شرط علی ابن المدینی اور البخاری کی بتائی گئی ہے۔ علماء کا اس بات پر بھی اختلاف ہے کہ آیا 'فلاں نے کہا' ⁦(انا)⁩ 'سے' ⁦(ع)⁩ کے برابر ہے۔"
  tr: "'Muqaddima-ibn salah-itr' zinciri söylenir: falancaktan falanca. Bazı kişiler bunu hem mursal hem de bağlantısı netleşene kadar kesik olarak kabul etmiştir. İbn al-Salah'a göre doğru görüş, rivayetçilerin buluşmasının kurulması ve onların tadlislerden masumiyetiyle bağlantılı olduğudur. İbn Abdülberr bu konuda hadis âlimleri arasında neredeyse uzlaşı olduğunu iddia etti. Müslüman, Sahih'in girişinde çağdaşlık ve buluşma olasılığıyla yeterli oldu ve buluşmanın kurulma şartını reddetti. Reddettiği görüşün Ali ibn al-Madini ve el-Buhari'ye ait olduğu söylenir. Bunun 'from' gibi olup olmadığı konusunda farklı görüşler yaşadılar {atı:mukaddima-ibn salah-itr, s. 61-67}."
  id: "Rantai 'muqaddima-ibn-salah-itr' adalah yang dikatakan: si anu dari si anu. Beberapa orang menganggapnya mursal dan terputus sampai hubungannya menjadi jelas. Pandangan yang benar menurut Ibn al-Salah adalah bahwa hal itu terkait dengan kondisi pembentukan pertemuan para narator dan ketidakbersalahan mereka dari tadli. Ibn Abd al-Barr hampir mengklaim konsensus di antara para ulama hadis dalam hal ini. Muslim cukup dalam pengantar Sahihnya dengan kesesuaian dan kemungkinan pertemuan, dan menolak syarat pembentukan pertemuan tersebut. Dikatakan bahwa pandangan yang ia tolak adalah pandangan Ali ibn al-Madini dan al-Bukhari. Mereka berbeda pendapat apakah itu seperti 'dari' {cite:muqaddima-ibn-salah-itr, hlm. 61-67}."
