label: { ar: "الأكولة", en: "Akula (a fattened sheep kept for eating)" }
summary:
  ar: "الأكولة شاة اللحم التي تسمن لتؤكل، ذكرا كانت أو أنثى، وتوصف بها المرأة الكثيرة الأكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3266} ويتفق الفقهاء على أن الساعي لا يأخذ الأكولة من الغنم في الزكاة، لنهي النبي عن أخذ كرائم الأموال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3267}"
  en: "Akula is a sheep fattened to be eaten, male or female; the term is also applied to a woman who eats a great deal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3266} The jurists agree that the zakat collector may not take an akula from the flock, following the prohibition on taking the choicest property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3267}"
