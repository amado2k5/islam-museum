id: concept/wara-al-salaf-an-al-haram
class: concept
kind: ethical
label:
  ar: "ورع النبي والصحابة والتابعين عن الحرام والشبهة"
  en: "The scruple of the Prophet, the Companions and the Successors before the unlawful and the doubtful"
  ur: "حرام اور شبہے سے نبی، صحابہ اور تابعین کا ورع"
  es: "El escrúpulo del Profeta, los Compañeros y los Sucesores ante lo ilícito y lo dudoso."
  fr: "Le scrupule du Prophète, des Compagnons et des Successeurs face à l'illicite et au douteux"
  id: "Nabi, para sahabatnya, dan para pengikutnya sangat teliti dalam menghindari hal-hal yang dilarang dan meragukan."
summary:
  ar: "هذا سجل حكايات عن الورع أمام الحرام والشبهة. مرّ النبي بتمرة مسقوطة فقال لولا أن تكون صدقة لأكلتها {cite:sahih-al-bukhari 2055}، ومنع الحسن بن علي من تمرة أخذها من الصدقة {cite:sahih-al-bukhari 1491}. وأكل أبو بكر من طعام كسبه غلامه بالكهانة ثم علم بذلك {cite:sahih-al-bukhari 3842}، وشرب عمر لبناً ثم علم أنه من إبل الصدقة فاستقاءه {cite:muwatta-malik 606}. ويذكر الترمذي أن العبد لا يبلغ درجة المتقين حتى يدع ما لا بأس به حذراً لما به البأس {cite:jami-al-tirmidhi 2451}. ويروي أبو نعيم عن مالك بن دينار أن صدقته بتمرة حلال أحب إليه من مائة ألف حرام {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}."
  en: "This is a record of stories of scruple before the unlawful and the doubtful. The Prophet passed a fallen date and said that had it not been that it might be charity he would have eaten it {cite:sahih-al-bukhari 2055}, and al-Hasan ibn 'Ali was stopped from a date taken from the charity {cite:sahih-al-bukhari 1491}. Abu Bakr ate food his slave had earned by soothsaying and then learned of it {cite:sahih-al-bukhari 3842}, and 'Umar drank milk, learned it came from the charity camels, and made himself vomit it {cite:muwatta-malik 606}. Al-Tirmidhi relates that a servant does not reach the rank of the God-fearing until he leaves what is harmless out of caution for what is harmful {cite:jami-al-tirmidhi 2451}, and Abu Nu'aym relates that Malik ibn Dinar preferred giving a lawful date in charity to giving a hundred thousand of the forbidden {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}."
  ur: "یہ حرام اور شبہے کے سامنے ورع کے واقعات کا اندراج ہے۔ نبی ایک گری ہوئی کھجور کے پاس سے گزرے اور فرمایا اگر یہ اندیشہ نہ ہوتا کہ یہ صدقہ ہے تو میں کھا لیتا {cite:sahih-al-bukhari 2055}، اور حسن بن علی کو صدقے کی ایک کھجور سے روکا گیا {cite:sahih-al-bukhari 1491}۔ ابو بکر نے وہ کھانا کھایا جو ان کے غلام نے کہانت سے کمایا تھا، پھر انہیں معلوم ہوا {cite:sahih-al-bukhari 3842}، اور عمر نے دودھ پیا، پھر معلوم ہوا کہ صدقے کے اونٹوں کا ہے تو انہوں نے قے کر کے نکال دیا {cite:muwatta-malik 606}۔ ترمذی روایت کرتے ہیں کہ بندہ متقیوں کے درجے کو نہیں پہنچتا جب تک بے ضرر چیز کو نقصان دہ کے ڈر سے نہ چھوڑے {cite:jami-al-tirmidhi 2451}، اور ابو نعیم مالک بن دینار سے نقل کرتے ہیں کہ انہیں حلال کی ایک کھجور صدقہ کرنا ایک لاکھ حرام صدقہ کرنے سے زیادہ پسند تھا {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}۔"
  es: "Este es un registro de historias de escrúpulos ante lo ilícito y lo dudoso. El Profeta pasó un dátil caído y dijo que si no hubiera sido porque podría ser caridad, lo habría comido {cite:sahih-al-bukhari 2055}, y a al-Hasan ibn 'Ali se le impidió comer un dátil tomado de la caridad {cite:sahih-al-bukhari 1491}. Abu Bakr comió comida que su esclavo había ganado adivinando y luego se enteró de ello {cite:sahih-al-bukhari 3842}, y 'Umar bebió leche, supo que provenía de los camellos de la caridad y se hizo vomitarla {cite:muwatta-malik 606}. Al-Tirmidhi relata que un siervo no alcanza el rango de temeroso de Dios hasta que deja lo que es inofensivo por precaución hacia lo que es dañino {cite:jami-al-tirmidhi 2451}, y Abu Nu'aym relata que Malik ibn Dinar prefirió dar un dátil lícito en caridad a dar cien mil de lo prohibido {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}."
  fr: "Voici un recueil d'histoires de scrupules face à l'illicite et au douteux. Le Prophète laissa passer une datte tombée et déclara que s'il ne s'était pas agi d'aumône, il l'aurait mangée (Sahih al-Bukhari 2055). Al-Hasan ibn Ali s'abstint de consommer une datte issue d'une aumône (Sahih al-Bukhari 1491). Abou Bakr mangea de la nourriture que son esclave avait obtenue par divination, puis en prit connaissance (Sahih al-Bukhari 3842). Enfin, Umar but du lait, apprit qu'il provenait des chameaux donnés en aumône, et se le fit vomir (Muwatta-Malik 606). Al-Tirmidhi rapporte qu'un serviteur n'atteint le rang de pieux que lorsqu'il s'abstient de ce qui est inoffensif par prudence face à ce qui est nuisible {cite:jami-al-tirmidhi 2451}, et Abu Nu'aym rapporte que Malik ibn Dinar préférait donner une datte licite en aumône plutôt que de donner cent mille dattes interdites {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}."
  tr: "Bu, haram ve şüpheli olan şeylere karşı gösterilen takva ile ilgili hikayelerin kaydıdır. Peygamberimiz yere düşmüş bir hurmanın yanından geçerken, \"Eğer sadaka olmasaydı, yerdim\" demiştir (Sahih Buhari 2055). Hasan ibn Ali'nin sadakadan hurma almasını engellemiştir (Sahih Buhari 1491). Ebu Bekir, hizmetçisinin falcılık yoluyla kazandığı yemeği yemiş, sonra bunu öğrenmiştir (Sahih Buhari 3842). Ömer süt içmiş, sonra bunun sadaka develerinden olduğunu öğrenince kusmuştur (Muvatta-Malik 606). Tirmizi, bir kulun, haram olan şeylerden sakınmak için helal olan şeylerden kaçınmadıkça takva sahibi olamayacağını belirtir (Cami-i Tirmizi 2451). Ebu Nu'aym, Malik ibn Dinar'dan rivayetle, onun tek bir helal hurmanın sadakasının, yüz bin haram hurmadan daha çok sevildiğini söyler. {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 s.371}."
  id: "Ini adalah catatan kisah-kisah tentang ketakwaan dalam menghadapi hal-hal yang dilarang dan meragukan. Nabi melewati sebuah kurma yang jatuh dan berkata, \"Seandainya bukan karena mungkin itu sedekah, aku akan memakannya\" (kutipan: Sahih Al-Bukhari 2055). Beliau mencegah al-Hasan bin Ali mengambil kurma dari sedekah (kutipan: Sahih Al-Bukhari 1491). Abu Bakar memakan makanan yang diperoleh pelayannya melalui ramalan, kemudian mengetahui hal itu (kutipan: Sahih Al-Bukhari 3842). Umar minum susu, kemudian mengetahui bahwa itu berasal dari unta sedekah, sehingga ia memuntahkannya (kutipan: Muwatta Malik 606). Al-Tirmidhi menyebutkan bahwa seorang hamba tidak mencapai tingkat ketakwaan sampai ia menghindari apa yang diperbolehkan karena waspada terhadap apa yang tidak diperbolehkan (kutipan: Jami Al-Tirmidhi 2451). Abu Nu’aym meriwayatkan dari Malik ibn Dinar bahwa sedekah berupa satu buah kurma halal lebih dicintainya daripada seratus ribu buah kurma haram. {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}."
