id: concept/wara-al-salaf-an-al-haram
class: concept
kind: ethical
label:
  ar: "ورع النبي والصحابة والتابعين عن الحرام والشبهة"
  en: "The scruple of the Prophet, the Companions and the Successors before the unlawful and the doubtful"
  ur: "حرام اور شبہے سے نبی، صحابہ اور تابعین کا ورع"
summary:
  ar: "هذا سجل حكايات عن الورع أمام الحرام والشبهة. مرّ النبي بتمرة مسقوطة فقال لولا أن تكون صدقة لأكلتها {cite:sahih-al-bukhari 2055}، ومنع الحسن بن علي من تمرة أخذها من الصدقة {cite:sahih-al-bukhari 1491}. وأكل أبو بكر من طعام كسبه غلامه بالكهانة ثم علم بذلك {cite:sahih-al-bukhari 3842}، وشرب عمر لبناً ثم علم أنه من إبل الصدقة فاستقاءه {cite:muwatta-malik 606}. ويذكر الترمذي أن العبد لا يبلغ درجة المتقين حتى يدع ما لا بأس به حذراً لما به البأس {cite:jami-al-tirmidhi 2451}. ويروي أبو نعيم عن مالك بن دينار أن صدقته بتمرة حلال أحب إليه من مائة ألف حرام {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}."
  en: "This is a record of stories of scruple before the unlawful and the doubtful. The Prophet passed a fallen date and said that had it not been that it might be charity he would have eaten it {cite:sahih-al-bukhari 2055}, and al-Hasan ibn 'Ali was stopped from a date taken from the charity {cite:sahih-al-bukhari 1491}. Abu Bakr ate food his slave had earned by soothsaying and then learned of it {cite:sahih-al-bukhari 3842}, and 'Umar drank milk, learned it came from the charity camels, and made himself vomit it {cite:muwatta-malik 606}. Al-Tirmidhi relates that a servant does not reach the rank of the God-fearing until he leaves what is harmless out of caution for what is harmful {cite:jami-al-tirmidhi 2451}, and Abu Nu'aym relates that Malik ibn Dinar preferred giving a lawful date in charity to giving a hundred thousand of the forbidden {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}."
  ur: "یہ حرام اور شبہے کے سامنے ورع کے واقعات کا اندراج ہے۔ نبی ایک گری ہوئی کھجور کے پاس سے گزرے اور فرمایا اگر یہ اندیشہ نہ ہوتا کہ یہ صدقہ ہے تو میں کھا لیتا {cite:sahih-al-bukhari 2055}، اور حسن بن علی کو صدقے کی ایک کھجور سے روکا گیا {cite:sahih-al-bukhari 1491}۔ ابو بکر نے وہ کھانا کھایا جو ان کے غلام نے کہانت سے کمایا تھا، پھر انہیں معلوم ہوا {cite:sahih-al-bukhari 3842}، اور عمر نے دودھ پیا، پھر معلوم ہوا کہ صدقے کے اونٹوں کا ہے تو انہوں نے قے کر کے نکال دیا {cite:muwatta-malik 606}۔ ترمذی روایت کرتے ہیں کہ بندہ متقیوں کے درجے کو نہیں پہنچتا جب تک بے ضرر چیز کو نقصان دہ کے ڈر سے نہ چھوڑے {cite:jami-al-tirmidhi 2451}، اور ابو نعیم مالک بن دینار سے نقل کرتے ہیں کہ انہیں حلال کی ایک کھجور صدقہ کرنا ایک لاکھ حرام صدقہ کرنے سے زیادہ پسند تھا {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 p.371}۔"
