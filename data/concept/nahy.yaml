id: concept/nahy
class: concept
kind: legal
label:
  ar: "نَهْي"
  en: "Nahy (prohibition, in usul al-fiqh)"
  ur: "نہی (اصولِ فقہ میں منع)"
summary:
  ar: "النهي في اللغة ضد الأمر، وعند الأصوليين اقتضاء الكف عن الفعل على جهة الاستعلاء. قال الجمهور إن له صيغة مبينة له هي «لا تفعل» وخالف الأشعري ومن تبعه، واختلفوا في اقتضائه الدوام والتكرار والفور، وذهب جمهور العلماء إلى أن مطلقه يقتضي التحريم، وأنه يقتضي الفساد في الجملة، وفي تفصيله خلاف بين الحنفية والشافعية من جهة وبين المالكية والحنابلة من جهة، وتستعمل صيغته في معان أخرى كالكراهة والدعاء والإرشاد والتحقير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
  en: "Nahy, in the lexicon, is the opposite of command; for the usulis it is demanding cessation from an act from a position of superiority. The majority hold it has a dedicated form, \"la taf'al\" (do not), which Abu al-Hasan al-Ash'ari and his followers denied. They differ over whether it conveys permanence, repetition and immediacy; most scholars hold that the absolute prohibition conveys tahrim and, in general, invalidity — the details disputed between the Hanafis and Shafi'is on one side and the Malikis and Hanbalis on the other; and its form is also used for dislike, supplication, guidance and belittling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
  ur: "نہی لغت میں امر کی ضد ہے؛ اصولیوں کے نزدیک بلند مرتبے کے ساتھ کسی فعل سے باز رہنے کا مطالبہ ہے۔ جمہور کے نزدیک اس کی مخصوص صیغہ «لا تفعل» ہے جس سے اشعری اور ان کے پیروکاروں نے اختلاف کیا؛ دوام، تکرار اور فور کے دلالت میں اختلاف ہے؛ جمہور کے نزدیک مطلق نہی تحریم اور مجموعی طور پر فساد کا اقتضا کرتی ہے جس کی تفصیل حنفیہ و شافعیہ بمقابلہ مالکیہ و حنابلہ میں مختلف ہے؛ اور اس کا صیغہ کراہت، دعا، ارشاد اور تحقیر جیسے معنوں میں بھی آتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
