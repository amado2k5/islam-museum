label:
  ar: "نَهْي"
  en: "Nahy (prohibition, in usul al-fiqh)"
  ur: "نہی ⁦(اصولِ فقہ میں منع)⁩"
  es: "Nahy (prohibición, en usul al-fiqh)"
  fr: "Nahy (interdiction, in usul al-fiqh)"
  tr: "Yasaklama"
  id: "Larangan"
summary:
  ar: "النهي في اللغة ضد الأمر، وعند الأصوليين اقتضاء الكف عن الفعل على جهة الاستعلاء. قال الجمهور إن له صيغة مبينة له هي «لا تفعل» وخالف الأشعري ومن تبعه، واختلفوا في اقتضائه الدوام والتكرار والفور، وذهب جمهور العلماء إلى أن مطلقه يقتضي التحريم، وأنه يقتضي الفساد في الجملة، وفي تفصيله خلاف بين الحنفية والشافعية من جهة وبين المالكية والحنابلة من جهة، وتستعمل صيغته في معان أخرى كالكراهة والدعاء والإرشاد والتحقير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
  en: "Nahy, in the lexicon, is the opposite of command; for the usulis it is demanding cessation from an act from a position of superiority. The majority hold it has a dedicated form, \"la taf'al\" (do not), which Abu al-Hasan al-Ash'ari and his followers denied. They differ over whether it conveys permanence, repetition and immediacy; most scholars hold that the absolute prohibition conveys tahrim and, in general, invalidity — the details disputed between the Hanafis and Shafi'is on one side and the Malikis and Hanbalis on the other; and its form is also used for dislike, supplication, guidance and belittling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
  ur: "نہی لغت میں امر کی ضد ہے؛ اصولیوں کے نزدیک بلند مرتبے کے ساتھ کسی فعل سے باز رہنے کا مطالبہ ہے۔ جمہور کے نزدیک اس کی مخصوص صیغہ «لا تفعل» ہے جس سے اشعری اور ان کے پیروکاروں نے اختلاف کیا؛ دوام، تکرار اور فور کے دلالت میں اختلاف ہے؛ جمہور کے نزدیک مطلق نہی تحریم اور مجموعی طور پر فساد کا اقتضا کرتی ہے جس کی تفصیل حنفیہ و شافعیہ بمقابلہ مالکیہ و حنابلہ میں مختلف ہے؛ اور اس کا صیغہ کراہت، دعا، ارشاد اور تحقیر جیسے معنوں میں بھی آتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
  es: "En el léxico, nahy es lo opuesto a mandato; para los usulis, es exigir el cese de un acto desde una posición de superioridad. La mayoría sostiene que tiene una forma específica, \"la taf'al\" (no), que Abu al-Hasan al-Ash'ari y sus seguidores negaron. Discrepan sobre si implica permanencia, repetición e inmediatez; la mayoría de los eruditos sostiene que la prohibición absoluta implica tahrim y, en general, invalidez —los detalles son objeto de disputa entre los hanafíes y shafi'ís, por un lado, y los malikíes y hanbalíes, por el otro—; y su forma también se usa para expresar desagrado, súplica, guía y menosprecio. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16233} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16234} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
  fr: "Dans le lexique, « nahy » est l'antonyme d'ordre; pour les usulis, il s'agit d'exiger la cessation d'un acte depuis une position de supériorité. La majorité considère qu'il possède une forme spécifique, « la taf'al » (ne fais pas), ce qu'Abu al-Hasan al-Ash'ari et ses disciples ont nié. Les avis divergent quant à savoir s'il implique la permanence, la répétition et l'immédiateté; la plupart des savants estiment que l'interdiction absolue implique le tahrim et, de manière générale, l'invalidité – les détails faisant l'objet de débats entre les hanafites et les chaféites d'une part, et les malikites et les hanbalites d'autre part; et cette forme est également employée pour exprimer le désamour, la supplication, la demande de guidance et le dénigrement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
  tr: "Dil yasağı emrin tam tersidir ve usul bilginlerine göre, üstünlük anlamında eylemden kaçınmayı ifade eder. Çoğunluk, bunun için net bir formülü olduğunu ve 'yapma' olduğunu söyledi. El-Aş'ari ve onu takip edenler, süreklilik, tekrarlama ve anlık anlamına gelme konusunda anlaşmazlık yaşadılar. Çoğu alim, mutlak anlamının yasaklama anlamına geldiğini ve genel yozlaşma anlamına geldiğini savundu. Hanafi ve Şafiiler arasında bir yanda, Malikiler ve Hanbaliler arasında da ayrıntılı olarak açıklanması konusunda anlaşmazlık vardır ve biçimi hoşlanmama, yalvarış, rehberlik ve aşağılanma gibi başka anlamlarda kullanılır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16233} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16234} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.16235}"
  id: "Larangan dalam bahasa adalah kebalikan dari perintah, dan menurut para sarjana usul, itu berarti menahan diri dari tindakan dalam arti superioritas. Mayoritas mengatakan bahwa larangan dalam bahasa memiliki formula yang jelas untuk itu, yaitu 'jangan lakukan.' Al-Ash'ari dan mereka yang mengikutinya tidak setuju, dan mereka berbeda pendapat dalam implikasi kontinuitas, pengulangan, dan kelangsungan. Mayoritas ulama berpendapat bahwa makna mutlaknya mengandung larangan, dan mengandung korupsi umum. Ada perbedaan pendapat mengenai elaborasinya antara Hanafi dan Shafi'i di satu sisi, dan antara Malik dan Hanbalis di sisi lain, dan bentuknya digunakan dalam makna lain seperti tidak suka, memohon, membimbing, dan menghina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16235}"
