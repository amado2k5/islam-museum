label: { ar: "شكوك في عروض الكواكب ومصدرها في النسخة", en: "Doubts about the planets' latitudes and the source of the error", ur: "سیاروں کے عرض پر شبہات اور نسخے کی غلطی کا امکان", es: "Dudas sobre las latitudes de los planetas y la fuente del error.", fr: "Des doutes subsistent quant à la latitude des planètes et à l'origine de l'erreur.", tr: "Gezegen tasvirleri ve bunların kaynağı hakkındaki şüpheler, söz konusu versiyonda yer almaktadır.", id: "Keraguan tentang presentasi planet dan sumbernya dalam versi tersebut" }
summary:
  ar: "يذكر البتاني أن عروض الزهرة وعطارد مختلفة كثيراً في الرصد عما في كتاب بطليموس، فيأخذ مأخذ العمل الذي وجده فيه، ويقارب ويدقق بما يجده بالرصد، ويحتمل أن يكون الخلل من المترجم أو من النسخة التي نُقل عنها الكتاب. {cite:zij-sabi-nallino-byblion p.100}."
  en: "Al-Battani says the latitudes of Venus and Mercury differ widely from what Ptolemy's book gives, so he takes the method he found there and adjusts it to approximate and check what observation gives. He allows that the fault may lie with the translator or with the copy the book was translated from. {cite:zij-sabi-nallino-byblion p.100}."
  ur: "البتانی کہتے ہیں کہ زہرہ اور عطارد کے عرض رصد میں بطلیموس کی کتاب کے عرض سے کافی مختلف ہیں، اس لیے وہ کتاب میں ملنے والا طریقہ لیتے ہیں اور اسے رصد کے نتیجے کے قریب اور اس سے موافق کرتے ہیں۔ وہ یہ امکان بھی مانتے ہیں کہ خلل مترجم کی طرف سے ہو یا اس نسخے میں ہو جس سے کتاب ترجمہ ہوئی۔ {cite:zij-sabi-nallino-byblion p.100}۔"
  es: "Al-Battani afirma que las latitudes de Venus y Mercurio difieren considerablemente de las que aparecen en el libro de Ptolomeo, por lo que toma el método que encontró allí y lo ajusta para aproximarlo y comprobarlo mediante observaciones. Admite que el error podría deberse al traductor o a la copia original del libro. {cite:zij-sabi-nallino-byblion p.100}."
  fr: "Al-Battani indique que les latitudes de Vénus et de Mercure diffèrent considérablement de celles données par Ptolémée. Il reprend donc la méthode qu'il y a trouvée et l'adapte pour obtenir une approximation, qu'il vérifie ensuite par l'observation. Il admet que l'erreur pourrait provenir du traducteur ou de l'exemplaire utilisé pour la traduction. {cite:zij-sabi-nallino-byblion p.100}"
  tr: "Al-Battani, Venüs ve Merkür'ün konumlarının, Batlamyus'un kitabındakilerden gözlemlerde büyük ölçüde farklılık gösterdiğini belirtiyor. Orada bulduğu yaklaşımı benimseyerek, gözlemlerini yaklaşık olarak hesaplıyor ve doğruluyor. Hatanın çevirmenden veya kitabın çevrildiği nüshadan kaynaklanmış olması mümkündür. {cite:zij-sabi-nallino-byblion s.100}."
  id: "Al-Battani menyebutkan bahwa posisi Venus dan Merkurius sangat berbeda dalam pengamatan dari yang ada dalam buku Ptolemy. Ia mengadopsi pendekatan yang ia temukan di sana, memperkirakan dan memverifikasi apa yang ia amati. Ada kemungkinan bahwa kesalahan tersebut berasal dari penerjemah atau salinan dari mana buku tersebut diterjemahkan. {cite:zij-sabi-nallino-byblion p.100}."
