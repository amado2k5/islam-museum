summary:
  ar: "يذكر البتاني أن عروض الزهرة وعطارد مختلفة كثيراً في الرصد عما في كتاب بطليموس، فيأخذ مأخذ العمل الذي وجده فيه، ويقارب ويدقق بما يجده بالرصد، ويحتمل أن يكون الخلل من المترجم أو من النسخة التي نُقل عنها الكتاب. {cite:zij-sabi-nallino-byblion p.100}."
  en: "Al-Battani says the latitudes of Venus and Mercury differ widely from what Ptolemy's book gives, so he takes the method he found there and adjusts it to approximate and check what observation gives. He allows that the fault may lie with the translator or with the copy the book was translated from. {cite:zij-sabi-nallino-byblion p.100}."
  ur: "البتانی کہتے ہیں کہ زہرہ اور عطارد کے عرض رصد میں بطلیموس کی کتاب کے عرض سے کافی مختلف ہیں، اس لیے وہ کتاب میں ملنے والا طریقہ لیتے ہیں اور اسے رصد کے نتیجے کے قریب اور اس سے موافق کرتے ہیں۔ وہ یہ امکان بھی مانتے ہیں کہ خلل مترجم کی طرف سے ہو یا اس نسخے میں ہو جس سے کتاب ترجمہ ہوئی۔ {cite:zij-sabi-nallino-byblion p.100}۔"
  es: "Al-Battani afirma que las latitudes de Venus y Mercurio difieren considerablemente de las que aparecen en el libro de Ptolomeo, por lo que toma el método que encontró allí y lo ajusta para aproximarlo y comprobarlo mediante observaciones. Admite que el error podría deberse al traductor o a la copia original del libro. {cite:zij-sabi-nallino-byblion p.100}."
