label:
  ar: "نموذج استكشاف القادة"
  en: "The model for discovering leaders"
  ur: "قائدین کی دریافت کا نمونہ"
summary:
  ar: "نموذج طارق السويدان لاستكشاف من عندهم استعداد للقيادة: ست علامات هي التحليل والمبادرة والشجاعة والجدية والطموح والبيئة القيادية، ووسائل البحث عنها من اختبارات ومقابلات، مع تطبيقه على عمرو بن العاص."
  en: "Tareq al-Suwaidan's model for discovering people with a readiness to lead: six signs, analysis, initiative, courage, seriousness, ambition and a leadership environment, the means of looking for them through tests and interviews, and its application to Amr ibn al-As."
  ur: "قیادت کی آمادگی رکھنے والوں کی دریافت کا طارق السویدان کا نمونہ: چھ علامات، تجزیہ، پہل، شجاعت، سنجیدگی، بلند ہمتی اور قیادتی ماحول، ٹیسٹ اور انٹرویو کے ذریعے ان کی تلاش، اور عمرو بن العاص پر اس کا اطلاق۔"
