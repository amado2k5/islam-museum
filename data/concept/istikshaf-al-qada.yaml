id: concept/istikshaf-al-qada
class: concept
kind: term
label:
  ar: "نموذج استكشاف القادة"
  en: "The model for discovering leaders"
  ur: "قائدین کی دریافت کا نمونہ"
  es: "El modelo para descubrir líderes"
  fr: "Le modèle pour découvrir les leaders"
  tr: "Lider Keşif Modeli"
  id: "Model Penemuan Pemimpin"
summary:
  ar: "نموذج طارق السويدان لاستكشاف من عندهم استعداد للقيادة: ست علامات هي التحليل والمبادرة والشجاعة والجدية والطموح والبيئة القيادية، ووسائل البحث عنها من اختبارات ومقابلات، مع تطبيقه على عمرو بن العاص."
  en: "Tareq al-Suwaidan's model for discovering people with a readiness to lead: six signs, analysis, initiative, courage, seriousness, ambition and a leadership environment, the means of looking for them through tests and interviews, and its application to Amr ibn al-As."
  ur: "قیادت کی آمادگی رکھنے والوں کی دریافت کا طارق السویدان کا نمونہ: چھ علامات، تجزیہ، پہل، شجاعت، سنجیدگی، بلند ہمتی اور قیادتی ماحول، ٹیسٹ اور انٹرویو کے ذریعے ان کی تلاش، اور عمرو بن العاص پر اس کا اطلاق۔"
  es: "El modelo de Tareq al-Suwaidan para descubrir personas con aptitudes para el liderazgo: seis señales, análisis, iniciativa, valentía, seriedad, ambición y un entorno de liderazgo; los medios para encontrarlas mediante pruebas y entrevistas; y su aplicación a Amr ibn al-As."
  fr: "Le modèle de Tareq al-Suwaidan pour découvrir les personnes prêtes à diriger: six signes, l'analyse, l'initiative, le courage, le sérieux, l'ambition et un environnement de leadership, les moyens de les rechercher par le biais de tests et d'entretiens, et son application à Amr ibn al-As."
  tr: "Tariq Al-Suwaidan'ın liderliğe hazır olanları keşfetme modeli: altı özellik: analiz, inisiyatif, cesaret, ciddiyet, hırs ve liderlik ortamı; ayrıca bunları testler ve mülakatlar yoluyla arama yöntemleri, bunu Amr ibn al-As'a uygular."
  id: "Model Tariq Al-Suwaidan untuk mengeksplorasi siapa yang siap memimpin: enam sifat: analisis, inisiatif, keberanian, keseriusan, ambisi, dan lingkungan kepemimpinan, bersama dengan metode untuk mencarinya melalui tes dan wawancara, diterapkan pada Amr ibn al-As."
