label: { ar: "جداول التعديل للكواكب في الزيج الصابي", en: "The equation tables for the planets in the Zij al-Sabi", ur: "زیج صابی میں سیاروں کے تعدیل کے جداول", es: "Las tablas de ecuaciones para los planetas en el Zij al-Sabi" }
summary:
  ar: "يرتب البتاني جداول التعديل للكواكب: الجدول السادس للتعديل الأوسط، والخامس لمقادير النقصان، والسابع لمقادير الزيادة، والرابع للدقائق التي يؤخذ بقدرها من الزيادة والنقصان، والثالث لتعديل الخاصة ومركز الفلك الخارج. {cite:zij-sabi-nallino-byblion p.95}."
  en: "Al-Battani arranges the planetary equation tables: the sixth gives the mean equation, the fifth the amounts of decrease, the seventh the amounts of increase, the fourth the minutes taken from the increase or decrease, and the third the equation of the apogee and of the centre between the two centres. {cite:zij-sabi-nallino-byblion p.95}."
  ur: "البتانی سیاروں کے تعدیل کے جداول ترتیب دیتے ہیں: چھٹا اوسط تعدیل دیتا ہے، پانچواں کمی کی مقداریں، ساتواں زیادتی کی مقداریں، چوتھا وہ دقائق جو زیادتی یا کمی سے لیے جاتے ہیں، اور تیسرا خاصہ اور دونوں مرکزوں کے درمیان سے نکلنے والے مرکز کا تعدیل۔ {cite:zij-sabi-nallino-byblion p.95}۔"
  es: "Al-Battani organiza las tablas de ecuaciones planetarias: la sexta proporciona la ecuación media, la quinta las cantidades de disminución, la séptima las cantidades de aumento, la cuarta los minutos tomados del aumento o la disminución, y la tercera la ecuación del apogeo y del centro entre los dos centros. {cite:zij-sabi-nallino-byblion p.95}."
