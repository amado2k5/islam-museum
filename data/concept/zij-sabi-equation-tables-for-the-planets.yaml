label: { ar: "جداول التعديل للكواكب في الزيج الصابي", en: "The equation tables for the planets in the Zij al-Sabi", ur: "زیج صابی میں سیاروں کے تعدیل کے جداول", es: "Las tablas de ecuaciones para los planetas en el Zij al-Sabi", fr: "Les tables d'équations pour les planètes du Zij al-Sabi", tr: "Sabian Zij'deki gezegenler için ayarlama tabloları", id: "Tabel penyesuaian untuk planet-planet dalam Sabian Zij" }
summary:
  ar: "يرتب البتاني جداول التعديل للكواكب: الجدول السادس للتعديل الأوسط، والخامس لمقادير النقصان، والسابع لمقادير الزيادة، والرابع للدقائق التي يؤخذ بقدرها من الزيادة والنقصان، والثالث لتعديل الخاصة ومركز الفلك الخارج. {cite:zij-sabi-nallino-byblion p.95}."
  en: "Al-Battani arranges the planetary equation tables: the sixth gives the mean equation, the fifth the amounts of decrease, the seventh the amounts of increase, the fourth the minutes taken from the increase or decrease, and the third the equation of the apogee and of the centre between the two centres. {cite:zij-sabi-nallino-byblion p.95}."
  ur: "البتانی سیاروں کے تعدیل کے جداول ترتیب دیتے ہیں: چھٹا اوسط تعدیل دیتا ہے، پانچواں کمی کی مقداریں، ساتواں زیادتی کی مقداریں، چوتھا وہ دقائق جو زیادتی یا کمی سے لیے جاتے ہیں، اور تیسرا خاصہ اور دونوں مرکزوں کے درمیان سے نکلنے والے مرکز کا تعدیل۔ {cite:zij-sabi-nallino-byblion p.95}۔"
  es: "Al-Battani organiza las tablas de ecuaciones planetarias: la sexta proporciona la ecuación media, la quinta las cantidades de disminución, la séptima las cantidades de aumento, la cuarta los minutos tomados del aumento o la disminución, y la tercera la ecuación del apogeo y del centro entre los dos centros. {cite:zij-sabi-nallino-byblion p.95}."
  fr: "Al-Battani organise les tables d'équations planétaires: la sixième donne l'équation moyenne, la cinquième les valeurs de diminution, la septième les valeurs d'augmentation, la quatrième les minutes soustraites à l'augmentation ou à la diminution, et la troisième l'équation de l'apogée et du centre entre les deux centres. {cite:zij-sabi-nallino-byblion p.95}."
  tr: "Al-Battani, gezegenler için ayarlama tablolarını şu şekilde düzenler: altıncı tablo orta ayarlama için, beşinci tablo azalma miktarları için, yedinci tablo artış miktarları için, dördüncü tablo artış ve azalışın alındığı dakikalar için ve üçüncü tablo gök küresinin iç ve dış merkezlerinin ayarlaması için. {cite:zij-sabi-nallino-byblion s.95}."
  id: "Al-Battani menyusun tabel penyesuaian untuk planet-planet: tabel keenam untuk penyesuaian tengah, tabel kelima untuk jumlah penurunan, tabel ketujuh untuk jumlah peningkatan, tabel keempat untuk menit-menit di mana peningkatan dan penurunan diambil, dan tabel ketiga untuk penyesuaian pusat khusus dan pusat luar bola langit. {cite:zij-sabi-nallino-byblion p.95}."
