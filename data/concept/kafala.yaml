  tr: "Garanti: Garanti dili ve terminolojide, kefilin sorumluluğu, asıl kişinin kişi, borç veya mal talebindeki sorumluluğuyla birleştirilir. Terimler okullar arasında değişiklik gösterir. Kur'an, Sünnet ve uzlaşma ile yasalaştırılır ve temel direkleri vardır: form, kefaletçi, kefaletçi, kefalet veren ve kefaletçi. Borç, mal ve hayatın garantisi geçerlidir, ancak kişisel teminat konusunda fark vardır. Garantör, teminat kendi emriyle yapılmışsa borçluya karşı başvurabilir ve teminat, borcun tamamlanması, tahliye, teslim veya kefilin ölümüyle sona erer. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.13304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13330} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13332} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13334} {cite:fiqh-ma