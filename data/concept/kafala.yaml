  id: "Jaminan: Bahasa jaminan, dan dalam terminologi, tanggung jawab penjamin digabungkan dengan tanggung jawab prinsipal dalam mengklaim orang, utang, atau properti. Terminologi ini berbeda-beda antar aliran. Istilah ini diatur oleh Al-Qur'an, Sunnah, dan konsensus, serta memiliki pilar: bentuk, penjamin, penjamin, penjamin, penjamin, dan penjamin. Menjamin utang, properti, dan nyawa sah, tetapi ada perbedaan terkait jaminan pribadi. Penjamin dapat mengajukan gugatan terhadap debitur jika jaminan dilakukan atas perintahnya, dan jaminan berakhir setelah penyelesaian utang, pembebasan, penyerahan, atau kematian penjamin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13330} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13332} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 