summary:
  ar: "الكفالة لغة الضمان، وفي الاصطلاح ضم ذمة الكفيل إلى ذمة الأصيل في المطالبة بنفس أو دين أو عين، وتختلف الاصطلاحات بين المذاهب. وهي مشروعة بالكتاب والسنة والإجماع، ولها أركان: الصيغة والكفيل والمكفول له والمكفول عنه والمكفول به. وتصح كفالة الدين والعين والنفس، وفي كفالة النفس خلاف، ويرجع الكفيل على المدين إذا كانت الكفالة بأمره، وتنتهي الكفالة بانقضاء الدين أو بالإبراء أو بالتسليم أو بموت المكفول به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13330} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13332} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13334} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13335} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13337}"
  en: "Kafala is surety in the lexicon. In the terminology it is joining the surety's obligation to the principal's in a claim for a person, a debt or a thing; the schools differ on the wording of the definition. It is lawful by the Qur'an, the Sunna and consensus, and has five pillars: the words of the surety, the surety, the creditor, the principal debtor and the thing secured. Debts, things and persons may be secured, and the surety for a person is disputed. A surety who acted at the principal's request may claim back from him what he paid, and the surety ends with payment of the debt, release, delivery of the thing, or the death of the person secured. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13330} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13332} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13334} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13335} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13337}"
  ur: "کفالت لغت میں ضمانت ہے، اور اصطلاح میں کفیل کے ذمے کو اصیل کے ذمے کے ساتھ ملانا، کسی شخص، قرض یا چیز کے مطالبے میں۔ اس کی تعریف میں مذاہب کا اختلاف ہے۔ یہ قرآن، سنت اور اجماع سے جائز ہے، اور اس کے ارکان یہ ہیں: صیغہ، کفیل، مکفول لہ، مکفول عنہ اور مکفول بہ۔ قرض، چیز اور شخص کی کفالت ہو سکتی ہے، اور شخص کی کفالت میں اختلاف ہے۔ اصیل کے کہنے پر کفالت کرنے والا ادا کی ہوئی رقم اس سے واپس لے سکتا ہے، اور کفالت قرض کی ادائیگی، ابراء، چیز کی سپردگی یا مکفول بہ کی موت سے ختم ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13325} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13329} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13330} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13331} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13332} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13333} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13334} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13335} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13