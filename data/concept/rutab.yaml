summary:
  ar: "الرطب في الكتاب يختار الجني من كل نوع، حار في الثانية رطب في الأولى، وقيل إن حرارته أكثر من رطوبته، وكل ما كان أشد حلاوة كان أشد حرارة، والدم المتولد منه سريع التعفن رديء ويصلحه اللوز والجلنجبين والخس والخل والسكنجبين، وهو نافع للمعدة الباردة ويضر الحنجرة والصوت ويلين الطبع، ويذكر الكتاب أنه يزيد في جوهر المني نقلا موسوما {cite:canon-ibn-sina-print-v1 pp.664-665}"
  en: "Rutab is in the book to be chosen freshly picked of every kind, hot in the second degree and moist in the first, though it is said its heat is greater than its moisture, and the sweeter a kind the hotter it is; the blood engendered from it is quick to putrefy and poor, and almond, jallanjabin, lettuce, vinegar and sikanjabin set it right; it benefits the cold stomach, harms the larynx and the voice and softens the stool, and the book lists, as a labelled report, that it adds to the substance of semen {cite:canon-ibn-sina-print-v1 pp.664-665}"
  ur: "رطب کتاب میں ہر قسم کا تازہ توڑا ہوا چنا جاتا ہے، دوسرے درجے میں گرم اور پہلے میں تر، اور کہا گیا کہ اس کی گرمی تری سے زیادہ ہے، اور جو قسم جتنی زیادہ میٹھی ہو اتنی زیادہ گرم؛ اس سے پیدا ہونے والا خون جلد سڑنے والا اور ناقص ہے اور بادام، جلنجبین، کاہو، سرکہ اور سکنجبین اسے درست کرتے ہیں؛ ٹھنڈے معدے کے لیے نافع ہے، حلق اور آواز کو نقصان دیتا ہے اور طبیعت کو نرم کرتا ہے، اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ یہ منی کے جوہر میں اضافہ کرتا ہے {cite:canon-ibn-sina-print-v1 pp.664-665}۔"
  es: "En el libro se indica que el rutab debe elegirse recién cosechado de cualquier tipo, caliente en segundo grado y húmedo en primero, aunque se dice que su calor es mayor que su humedad, y cuanto más dulce es un tipo, más caliente es; la sangre que produce es de fácil putrefacción y de mala calidad, y la almendra, el jalanjabin, la lechuga, el vinagre y el sikanjabin la corrigen; beneficia al estómago frío, daña la laringe y la voz y ablanda las heces, y el libro enumera, como un informe etiquetado, que aumenta la sustancia del semen {cite:canon-ibn-sina-print-v1 pp.664-665}"
  fr: "Le rutab est décrit dans le livre comme devant être choisi fraîchement cueilli de toutes sortes, chaud au deuxième degré et humide au premier, bien qu'on dise que sa chaleur est supérieure à son humidité, et que plus une variété est sucrée, plus elle est chaude; le sang qui en découle se putréfie rapidement et est de mauvaise qualité, et l'amande, le jallanjabin, la laitue, le vinaigre et le sikanjabin le rétablissent; il est bénéfique pour l'estomac froid, nocif pour le larynx et la voix et ramollit les selles, et le livre mentionne, comme un rapport légendé, qu'il augmente la substance du sperme {cite:canon-ibn-sina-print-v1 pp.664-665}"
  tr: "Kitaptaki tarihler her türden cin tarafından seçilir: ikincisi sıcak, ilkinde nemli. Sıcaklığının neminden daha yüksek olduğu ve ne kadar tatlıysa o kadar sıcak olduğu söylenir. Ondan çıkan kan hızla çürür ve fakirdir; badem, jalanjabin, marul, sirke ve skanjibeen faydalıdır, soğuk mideye zarar verir, boğaza ve sese zarar verir ve mizacını yumuşatır. Kitap, meninin özünü işaretli bir {cite:canon-ibn-sina-print-v1 s.664-665} ile artırdığını belirtir"
  id: "Kurma dalam buku dipilih oleh jin dari setiap jenis: panas pada jin kedua, lembap pada jin. Dikatakan bahwa panasnya lebih besar daripada kelembapannya, dan semakin manis, semakin panas. Darah yang dihasilkan darinya cepat membusuk dan buruk, dan almond, jalanjabin, selada, cuka, dan skanjibeen bermanfaat, bermanfaat untuk perut dingin, merusak tenggorokan dan suara, serta melunakkan temperamen. Buku ini menyebutkan bahwa jin meningkatkan esensi sperma dengan tanda {cite:canon-ibn-sina-print-v1 hlm.664-665}"
