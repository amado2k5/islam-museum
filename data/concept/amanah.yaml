issue:
  ar: "هل تُعامَل الأمانة بمعيار واحد مع المسلم وغيره، أم تختلف بحسب الدين أو الأمّية؟"
  en: "Is trust owed on one standard to all people, or does it vary by religion or unlettered status?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-one-standard
  stance:
    ar: "الأمانة واحدة لكل الناس، وتفرقة المعاملة بحسب الدين ليست من الدين"
    en: "Trust is owed to all people alike; distinguishing by religion is not part of the religion"
  summary:
    ar: "يرى الشعراوي أن الدين الحق لا يفرّق في أداء الأمانة بين صنف وصنف، وأن القول بأن ليس على أهل الكتاب في الأميين سبيل هو تشريع من عند أنفسهم وليس من الكتاب، وأن الآية تقرر أن من أوفى بعهده واتقى يحبه الله {cite:tafsir-sharawi-khawatir-scan p.1548}{cite:tafsir-sharawi-khawatir-scan p.1549}."
    en: "Sha'rawi holds that the true religion does not distinguish between classes of people in rendering trust. He says the claim that there is no way against the unlettered is a law of their own making and not from the scripture, and that the verse affirms that whoever keeps his covenant and is conscious of God, God loves {cite:tafsir-sharawi-khawatir-scan p.1548}{cite:tafsir-sharawi-khawatir-scan p.1549}."
