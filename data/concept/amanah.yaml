label:
  ar: الأمانة (الأداء والتحمل)
  en: "Trust (amanah): taking it on and rendering it back"
summary:
  ar: "يرى الشعراوي أن للأمانة لحظتين: لحظة التحمل التي يضمن فيها الإنسان نفسه، ولحظة الأداء التي لا يضمن فيها نفسه إلا بالحذر. ويفرّق بين تعدية الفعل بالباء، وهي إلصاق الأمانة بما اؤتمن عليه، وتعديته بعلى، وهي علوّ الأمانة فوق ما اؤتمن عليه. ويقرر أن الأمانة لا تُفرّق بين الناس بحسب دينهم أو أمّيتهم، وأن المعاملة بالتفرقة من عند أهل الكتاب أنفسهم {cite:tafsir-sharawi-khawatir-scan p.1542}{cite:tafsir-sharawi-khawatir-scan p.1545}{cite:tafsir-sharawi-khawatir-scan p.1546}{cite:tafsir-sharawi-khawatir-scan p.1547}{cite:tafsir-sharawi-khawatir-scan p.1548}."
  en: "Sha'rawi distinguishes two moments of trust: taking it on, when a person can be confident of himself, and rendering it back, when he cannot be sure of himself without vigilance. He notes that the verb takes ba' in one verse, which binds the trust to the thing entrusted, and 'ala' in another, which places the trust above it. He holds that trust is owed equally to all people, regardless of religion or unlettered status, and that the double standard came from the People of the Book themselves {cite:tafsir-sharawi-khawatir-scan p.1542}{cite:tafsir-sharawi-khawatir-scan p.1545}{cite:tafsir-sharawi-khawatir-scan p.1546}{cite:tafsir-sharawi-khawatir-scan p.1547}{cite:tafsir-sharawi-khawatir-scan p.1548}."
