label: { ar: "الأمانة", en: "Trust (amanah)", ur: "امانت" }
summary:
  ar: "يرى الشعراوي أن الأمانة في الدين والتعامل تقوم على الذمة الإيمانية، وأن الإنسان قد يكون أميناً وقت التحمل ثم لا يضمن ظروفه وقت الأداء، ولذلك شرع الله التوثيق، وأن الأمانة التي عُرضت على السماوات والأرض فأشفقن منها هي اختيار الإنسان الذي حمله الإنسان {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1225} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1226}."
  en: "Sha'rawi holds that trust in dealings rests on the believer's conscience, but a person may be trustworthy when entrusted and yet be unable to guarantee his circumstances when repayment is due. That is why God ordained documentation. He reads the trust offered to heaven and earth as the power of choice that humans took on {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1225} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1226}."
  ur: "شعراوی کے نزدیک لین دین میں امانت ایمانی ضمیر پر قائم ہے، مگر آدمی امانت لیتے وقت دیانتدار ہو سکتا ہے اور ادائیگی کے وقت اپنے حالات کی ضمانت نہیں دے سکتا، اس لیے اللہ نے دستاویز مقرر کی۔ وہ اس امانت کو جو آسمانوں اور زمین پر پیش کی گئی، اختیار کی امانت سمجھتے ہیں جسے انسان نے اٹھایا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1225} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1226}۔"
