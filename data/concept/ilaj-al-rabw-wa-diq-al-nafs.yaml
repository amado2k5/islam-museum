label:
  ar: "علاج الربو وضيق النفس"
  en: "The treatment of asthma and the breath's narrowness"
  ur: "ربو اور سانس کی تنگی کا علاج"
summary:
  ar: "أما الكائن عن الرطوبات فالعلاج أن يقبل على إفناء الرطوبات التي في رئاتهم بالرفق والاعتدال وإن علمت أن الآفة الكثرة استفرغ البدن لا محالة بالإسهال ويجب أن تكون الأدوية ملطفة منضجة من غير تسخين شديد يؤدي إلى تجفيف المادة وتغليظها ولهذا لم يلق الأوائل في معاجين الربو المخدرات ولا المقويات للنوم ⁦(قول على لفظ الكتاب والأسماء مستثناة)⁩ ولذلك يجب أن تتعهد ترطيب المادة وإنضاجها إذا كانت غليظة أو لزجة ولا تقتصر على تلطيف أو تقطيع ساذج فربما أدى عنفه وعصيان المادة إلى جراحة في الرئة فإن جميع ما يدر يضر هذه العلة من حيث يدر لإخراجه الرقيق من الرطوبة، وإذا أحسست مع الربو بغلظ في الكبد خلط بالأدوية الصدرية أدوية تناسبهما جميعاً، وإذا كان المعالج صبياً وجب أن تخلط الأدوية بلبن أمه وتكفيهم الأدوية المعتدلة مع اللبن ⁦(سطر موسوم من أجل اللبن)⁩، ومن التدبير النافع دلك الصدر وما يليه بالأيدي والمناديل الخشنة خاصة إذا كان هناك نفس الانتصاب دلكاً معتدلاً يابساً من غير دهن إلا إن وقع إعياء فيستعمل بالدهن، وإن كانت المادة كثيرة فلا بد من تنقية بمسهل، ومن التدبير استعمال الصوت ورفعه متدرجاً فيه إلى قوة وطول واستعمال القيء المتصل، وإدامة تليين الطبيعة، ورياضة يتدرج فيها من بطء إلى سرعة لئلا تحدث المعاجلة اختناقاً لتحريكها المادة بعنف، وأغذيتهم ومرقهم وأشربتهم على ما يفصل في المتن ويجتنبون الحمام ما قدروا والنوم الكثير وخصوصاً نوم النهار والنوم على الطعام وكل حبة فيها نفخ والشراب على الطعام {cite:canon-ibn-sina-print-v2 p.317}"
  en: "For the kind arising from moistures, the treatment is to work on finishing the moistures in their lungs with gentleness and measure; if the harm is known to be muchness, the body must be evacuated by purging. The drugs must be refining and ripening, without a fierce heating that would dry and thicken the matter — for which reason the ancients put none of the stupefying or sleep-stilling drugs into the asthma electuaries (carried on the book's wording, the names excluded) — so the matter's moistening and ripening must be tended when it is thick or sticky, not stopping at a simple refining or cutting, lest its violence and the matter's stubbornness lead to a wounding in the lung; all that makes urine harms this illness inasmuch as it drains the thin part of the moisture. If a liver-thickness is felt beside the asthma, drugs suiting both are mixed with the chest drugs. If the treated is a boy, the drugs must be mixed with his mother's milk and the moderate ones with milk suffice them (a line set out labelled for the milk). Among the useful regimens: rubbing the chest and its neighbours with the hands and rough cloths — above all when the upright breath is there — a moderate dry rubbing without oil unless weariness comes, then with oil; if the matter is much, a purgative cleansing is a must. Among the regimens: using the voice and raising it gradually to strength and length; using connected vomiting; keeping the nature loose; an exercise graduated from slow to swift lest the sudden work choke by violently stirring the matter. Their foods, broths and drinks as set out in the text; and they must shun the bath as far as they can, much sleep — above all day-sleep — sleeping on food, every wind-breeding thing, and drink upon food {cite:canon-ibn-sina-print-v2 p.317}"
  ur: "رطوبتوں سے ہونے والی قسم کا علاج یہ ہے کہ ان کے پھیپھڑوں کی رطوبتوں کو نرمی اور اعتدال سے ختم کیا جائے؛ اگر معلوم ہو کہ آفت کثرت ہے تو بدن کی صفائی جلاب سے لازم ہے؛ ادویہ لطیف کرنے والی اور پکانے والی ہوں بغیر سخت تسخین کے جو مادہ کو خشک اور گاڑھا کر دے — اسی لیے قدیم لوگوں نے ربو کے معاجین میں سن کرنے والی یا نیند لانے والی ادویہ نہیں ڈالیں ⁦(کتاب کے لفظ پر نام مستثنیٰ)⁩ — اس لیے مادہ کی تر کرنے اور پکانے کی عنايت کرنی چاہیے جب وہ گاڑھا یا چپچپا ہو اور صرف سادہ لطیف یا کاٹنے پر قناعت نہ کرے کہ اس کی شدت اور مادہ کی ضد پھیپھڑے میں زخم تک لے جائے؛ اور ہر وہ چیز جو پیشان لائے اس علت کو نقصان دیتی ہے اس لیے کہ وہ رطوبت کا باریک حصہ نکالتی ہے؛ اگر ربو کے ساتھ جگر میں گاڑھاپن محسوس ہو تو صدری ادویہ میں دونوں کو سازگار ادویہ ملائے جائیں؛ اگر معالج ہونے والا بچہ ہو تو ادویہ اس کی ماں کے دودھ میں ملائے جائیں اور اعتدال والے دودھ کے ساتھ ان کے لیے کافی ہیں ⁦(دودھ کی وجہ سے وضاحت شدہ سطر)⁩؛ مفید تدبیر میں سینے اور اس کے اطراف کو ہاتھوں اور خردرے کپڑوں سے ملنا — خصوصاً جب کھڑی سانس ہو — معتدل خشک مالش بغیر تیل کے مگر تھکن ہو تو تیل کے ساتھ؛ اگر مادہ کثیر ہو تو جلابی صفائی لازم؛ تدبیر میں آواز کا استعمال اور اسے آہستہ آہستہ قوت اور طول تک بلند کرنا؛ مسلسل قی کا استعمال؛ طبیعت کو نرم رکھنا؛ ایسی ورزش جو سست سے تیز کی طرف بڑھے کہ اچانک مادہ کو عنت سے ہلا کر گھٹن نہ پیدا کرے؛ ان کی خوراکیں شوربے اور مشروبات متن میں مفصل ہیں؛ اور انہیں غسل سے جتنا ہو سکے پرہیز زیادہ نیند خصوصاً دن کی نیند کھانے پر سونا ہر وہ چیز جس میں پھولن ہو اور کھانے پر مشروب سے بچنا چاہیے {cite:canon-ibn-sina-print-v2 p.317}"
