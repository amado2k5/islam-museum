summary:
  ar: "أما الكائن عن الرطوبات فالعلاج أن يقبل على إفناء الرطوبات التي في رئاتهم بالرفق والاعتدال وإن علمت أن الآفة الكثرة استفرغ البدن لا محالة بالإسهال ويجب أن تكون الأدوية ملطفة منضجة من غير تسخين شديد يؤدي إلى تجفيف المادة وتغليظها ولهذا لم يلق الأوائل في معاجين الربو المخدرات ولا المقويات للنوم ⁦(قول على لفظ الكتاب والأسماء مستثناة)⁩ ولذلك يجب أن تتعهد ترطيب المادة وإنضاجها إذا كانت غليظة أو لزجة ولا تقتصر على تلطيف أو تقطيع ساذج فربما أدى عنفه وعصيان المادة إلى جراحة في الرئة فإن جميع ما يدر يضر هذه العلة من حيث يدر لإخراجه الرقيق من الرطوبة، وإذا أحسست مع الربو بغلظ في الكبد خلط بالأدوية الصدرية أدوية تناسبهما جميعاً، وإذا كان المعالج صبياً وجب أن تخلط الأدوية بلبن أمه وتكفيهم الأدوية المعتدلة مع اللبن ⁦(سطر موسوم من أجل اللبن)⁩، ومن التدبير النافع دلك الصدر وما يليه بالأيدي والمناديل الخشنة خاصة إذا كان هناك نفس الانتصاب دلكاً معتدلاً يابساً من غير دهن إلا إن وقع إعياء فيستعمل بالدهن، وإن كانت المادة كثيرة فلا بد من تنقية بمسهل، ومن التدبير استعمال الصوت ورفعه متدرجاً فيه إلى قوة وطول واستعمال القيء المتصل، وإدامة تليين الطبيعة، ورياضة يتدرج فيها من بطء إلى سرعة لئلا تحدث المعاجلة اختناقاً لتحريكها المادة بعنف، وأغذيتهم ومرقهم وأشربتهم على ما يفصل في المتن ويجتنبون الحمام ما قدروا والنوم الكثير وخصوصاً نوم النهار والنوم على الطعام وكل حبة فيها نفخ والشراب على الطعام {cite:canon-ibn-sina-print-v2 p.317}"
  en: "For the kind arising from moistures, the treatment is to work on finishing the moistures in their lungs with gentleness and measure; if the harm is known to be muchness, the body must be evacuated by purging. The drugs must be refining and ripening, without a fierce heating that would dry and thicken the matter — for which reason the ancients put none of the stupefying or sleep-stilling drugs into the asthma electuaries (carried on the book's wording, the names excluded) — so the matter's moistening and ripening must be tended when it is thick or sticky, not stopping at a simple refining or cutting, lest its violence and the matter's stubbornness lead to a wounding in the lung; all that makes urine harms this illness inasmuch as it drains the thin part of the moisture. If a liver-thickness is felt beside the asthma, drugs suiting both are mixed with the chest drugs. If the treated is a boy, the drugs must be mixed with his mother's milk and the moderate ones with milk suffice them (a line set out labelled for the milk). Among the useful regimens: rubbing the chest and its neighbours with the hands and rough cloths — above all when the upright breath is there — a moderate dry rubbing without oil unless weariness comes, then with oil; if the matter is much, a purgative cleansing is a must. Among the regimens: using the voice and raising it gradually to strength and length; using connected vomiting; keeping the nature loose; an exercise graduated from slow to swift lest the sudden work choke by violently stirring the matter. Their foods, broths and drinks as set out in the text; and they must shun the bath as far as they can, much sleep — above all day-sleep — sleeping on food, every wind-breeding thing, and drink upon food {cite:canon-ibn-sina-print-v2 p.317}"
  ur: "رطوبتوں سے ہونے والی قسم کا علاج یہ ہے کہ ان کے پھیپھڑوں کی رطوبتوں کو نرمی اور اعتدال سے ختم کیا جائے؛ اگر معلوم ہو کہ آفت کثرت ہے تو بدن کی صفائی جلاب سے لازم ہے؛ ادویہ لطیف کرنے والی اور پکانے والی ہوں بغیر سخت تسخین کے جو مادہ کو خشک اور گاڑھا کر دے — اسی لیے قدیم لوگوں نے ربو کے معاجین میں سن کرنے والی یا نیند لانے والی ادویہ نہیں ڈالیں ⁦(کتاب کے لفظ پر نام مستثنیٰ)⁩ — اس لیے مادہ کی تر کرنے اور پکانے کی عنايت کرنی چاہیے جب وہ گاڑھا یا چپچپا ہو اور صرف سادہ لطیف یا کاٹنے پر قناعت نہ کرے کہ اس کی شدت اور مادہ کی ضد پھیپھڑے میں زخم تک لے جائے؛ اور ہر وہ چیز جو پیشان لائے اس علت کو نقصان دیتی ہے اس لیے کہ وہ رطوبت کا باریک حصہ نکالتی ہے؛ اگر ربو کے ساتھ جگر میں گاڑھاپن محسوس ہو تو صدری ادویہ میں دونوں کو سازگار ادویہ ملائے جائیں؛ اگر معالج ہونے والا بچہ ہو تو ادویہ اس کی ماں کے دودھ میں ملائے جائیں اور اعتدال والے دودھ کے ساتھ ان کے لیے کافی ہیں ⁦(دودھ کی وجہ سے وضاحت شدہ سطر)⁩؛ مفید تدبیر میں سینے اور اس کے اطراف کو ہاتھوں اور خردرے کپڑوں سے ملنا — خصوصاً جب کھڑی سانس ہو — معتدل خشک مالش بغیر تیل کے مگر تھکن ہو تو تیل کے ساتھ؛ اگر مادہ کثیر ہو تو جلابی صفائی لازم؛ تدبیر میں آواز کا استعمال اور اسے آہستہ آہستہ قوت اور طول تک بلند کرنا؛ مسلسل قی کا استعمال؛ طبیعت کو نرم رکھنا؛ ایسی ورزش جو سست سے تیز کی طرف بڑھے کہ اچانک مادہ کو عنت سے ہلا کر گھٹن نہ پیدا کرے؛ ان کی خوراکیں شوربے اور مشروبات متن میں مفصل ہیں؛ اور انہیں غسل سے جتنا ہو سکے پرہیز زیادہ نیند خصوصاً دن کی نیند کھانے پر سونا ہر وہ چیز جس میں پھولن ہو اور کھانے پر مشروب سے بچنا چاہیے {cite:canon-ibn-sina-print-v2 p.317}"
  es: "Para el tipo que surge de la humedad, el tratamiento consiste en eliminar la humedad de los pulmones con suavidad y mesura; si se sabe que el daño es excesivo, el cuerpo debe ser evacuado mediante purga. Los medicamentos deben ser refinadores y maduradores, sin un calentamiento intenso que reseque y espese la materia —por lo que los antiguos no incluían ningún medicamento somnífero o sedante en los electuarios para el asma (según la redacción del libro, se omiten los nombres)—, por lo que se debe atender la humectación y maduración de la materia cuando está espesa o pegajosa, sin limitarse a un simple refinado o corte, para que su violencia y la persistencia de la materia no provoquen una lesión en el pulmón; todo lo que produce orina perjudica esta enfermedad en la medida en que drena la parte líquida de la humedad. Si se siente una opresión en el hígado junto con el asma, se mezclan medicamentos adecuados para ambas afecciones con los medicamentos para el pecho. Si el paciente es un niño, los medicamentos deben mezclarse con la leche materna y los moderados con leche son suficientes (hay una línea marcada para la leche). Entre los regímenes útiles: frotar el pecho y las zonas adyacentes con las manos y paños ásperos —sobre todo cuando la respiración es normal— un frotamiento seco moderado sin aceite, a menos que haya cansancio, en cuyo caso con aceite; si la materia es abundante, es imprescindible una limpieza purgativa. Entre los regímenes: usar la voz y aumentar gradualmente su fuerza y duración; usar el vómito conectado; mantener la naturaleza suelta; un ejercicio gradual de lento a rápido para que el esfuerzo repentino no provoque asfixia al agitar violentamente la materia. Sus alimentos, caldos y bebidas son los que se indican en el texto; y deben evitar el baño en la medida de lo posible, dormir mucho —sobre todo dormir de día— dormir sobre la comida, todo lo que produzca gases, y beber sobre la comida {cite:canon-ibn-sina-print-v2 p.317}"
  fr: "Pour les affections d'origine humide, le traitement consiste à éliminer l'humidité des poumons avec douceur et mesure. Si l'excès d'humidité est avéré, il faut procéder à une purge. Les remèdes doivent être affinants et affinants, sans chauffage excessif qui dessécherait et épaissirait la substance – c'est pourquoi les anciens n'incluaient aucun médicament stupéfiant ou somnifère dans les électuaires contre l'asthme (repris dans le texte original, noms exclus) – il faut donc s'occuper de l'humidification et de l'affinage de la substance lorsqu'elle est épaisse ou collante, sans se contenter d'un simple affinage ou d'une simple dissolution, de peur que leur violence et la persistance de la substance n'entraînent une lésion pulmonaire. Tout ce qui favorise la diurèse aggrave cette maladie, car cela draine la partie la plus fluide de l'humidité. Si une congestion hépatique est ressentie en plus de l'asthme, des médicaments adaptés aux deux affections sont associés aux remèdes pour la poitrine. Si le patient est un garçon, les médicaments doivent être mélangés au lait de sa mère, et les remèdes modérés, associés au lait, lui suffisent (une ligne est prévue à cet effet). Parmi les traitements utiles: se frotter la poitrine et les zones adjacentes avec les mains et des linges rêches – surtout lorsque la respiration est franche – un frottement sec modéré, sans huile, sauf en cas de fatigue, auquel cas on utilise de l’huile; si la quantité de matière est importante, une purification est indispensable. Parmi les autres traitements: utiliser sa voix et l’élever progressivement en puissance et en intensité; provoquer des vomissements; faciliter l’évacuation des selles; un exercice physique progressif, d’abord lent puis rapide, afin d’éviter que l’effort brusque ne provoque une suffocation en remuant violemment la matière. Leurs aliments, bouillons et boissons sont conformes aux indications du texte; ils doivent éviter autant que possible le bain, beaucoup dormir – surtout la sieste – dormir après avoir mangé, éviter tout ce qui favorise les flatulences et boire après avoir mangé. {cite:canon-ibn-sina-print-v2 p.317}"
  tr: "Nem yaşayanlar için tedavi, akciğerlerindeki nemin nazik ve orta derecede dağıtılmasıdır. Sık sık oluşan lezyonun vücudun ishal ile kusmasına neden olduğunu biliyorsanız, ilaçlar yatıştırıcı ve olgun olmalı, aşırı ısınma, bu da maddenin kurumasına ve koyulaştırılmasına yol açmamalıdır. Bu nedenle, ilkler astım macunlarına ilaç veya uyku yardımı içermemiştir (kitap ve isimlerde belirtilen bir ifade yoktur). Bu nedenle, madde koyu veya yapışkan ise nemlendirilmeli ve pişirilmeli, sadece yatıştırıcı veya kesici ile sınırlı olmamalıdır Saf bir davranıştır, çünkü şiddeti ve itaatsizliği akciğer ameliyatına yol açabilir; çünkü bu duruma neden olan her şey hassas nemi uzaklaştırarak zarar verebilir. Eğer astımlı kalın karaciğer hissederseniz, her ikisine uygun göğüs ilaçlarını karıştırın. Terapist erkekse, ilaçlar annesinin sütüyle karıştırılmalıdır ve sütle orta derecede ilaçlar (süt için etiketlenmiş bir çizgi) yeterlidir. Etkili bir önlem, özellikle aynı ereksiyon varsa, göğüs masajı ve ardından kaba eller ve dokularla masaj yapmaktır. Orta ve kuru, yağsız, yorgunluk oluşmadıkça kullanılır. Madde bol ise, müshil ile arıtılmalıdır. Önlemler arasında sesi kullanmak ve yavaş yavaş güç ve uzunluğa yükseltmek, sürekli kusmuk kullanmak ve doğayı yumuşatmak ve egzersizi yavaş ve yavaştan hızlıya doğru sürdürmek vardır; böylece tedavi şiddetli hareketlerden kaynaklanan boğulmaya yol açmaz. Yiyecekleri, suyu ve içecekleri metinde belirtildiği şekilde tutulmalı, mümkün olduğunca banyodan kaçınmalı, özellikle gündüz uykusunda aşırı uyumalı, yiyecekle uyumalı ve her tane şişkinlik ve yiyecek içme içermelidir {cite:canon-ibn-sina-print-v2 s.317}"
  id: "Bagi mereka yang mengalami kelembapan, pengobatan adalah dengan menghilangkan kelembapan di paru-paru secara lembut dan sedang. Jika Anda tahu bahwa luka yang sering menyebabkan tubuh muntah diare, obat harus menenangkan dan matang, tanpa panas berlebihan yang menyebabkan zat menjadi kering dan mengental. Oleh karena itu, obat pertama tidak memasukkan obat atau bantuan tidur dalam pasta asma (pernyataan tentang kata-kata buku dan nama tidak dimasukkan). Oleh karena itu, zat harus dilembapkan dan dimasak jika kental atau lengket, dan tidak boleh dibatasi hanya untuk menenangkan atau mengiris Naif, karena kekerasan dan ketidakpatuhan dapat menyebabkan operasi paru-paru, karena segala sesuatu yang menyebabkan kondisi ini merusak kondisi ini dengan menghilangkan kelembapan yang halus. Jika Anda merasakan hati kental dengan asma, campurkan obat dada yang cocok untuk keduanya. Jika terapis laki-laki, obat harus dicampur dengan ASI ibu, dan obat sedang dengan susu (garis yang diberi label susu) sudah cukup. Langkah efektif adalah memijat dada dan setelahnya dengan tangan dan jaringan kasar, terutama jika ereksi sama. Sedang dan kering tanpa lemak, kecuali jika terjadi kelelahan, dalam hal ini digunakan. Jika zat melimpah, harus dimurnikan dengan pencahar. Salah satu langkahnya adalah menggunakan suara dan secara bertahap meningkatkan kekuatan dan panjangnya, serta menggunakan muntah terus-menerus, sambil mempertahankan sifat dan olahraga secara bertahap dari lambat ke cepat agar pengobatan tidak menyebabkan sesak napas akibat gerakan kasar. Makanan, kaldu, dan minuman mereka harus dijaga sesuai dengan rincian dalam teks, dan mereka harus menghindari mandi sebisa mungkin, serta tidur berlebihan, terutama tidur siang hari, tidur di atas makanan, dan setiap biji-bijian mengandung kembung dan minum makanan {cite:canon-ibn-sina-print-v2 hlm.317}"
