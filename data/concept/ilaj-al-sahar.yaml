label:
  ar: "علاج السهر"
  en: "Treatment of sleeplessness"
  ur: "بے خوابی کا علاج"
summary:
  ar: "يذكر ابن سينا مبادئ علاج السهر بحسب سببه: الغذاء المرطب والسكون من اليبس، وتسكين الوجع، وتجنب ما يزيد الرطوبة المالحة؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.95} {cite:canon-ibn-sina-print-v2 p.96}"
  en: "Ibn Sina gives the principles of treating sleeplessness by its cause: moistening food and rest for dryness, soothing the pain, and avoiding what adds to salty moisture; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.95} {cite:canon-ibn-sina-print-v2 p.96}"
  ur: "ابن سینا بے خوابی کے علاج کے اصول اس کے سبب کے مطابق بتاتا ہے: خشکی میں تر کرنے والی غذا اور سکون، درد کو تسکین دینا، اور نمکین نمی کو بڑھانے والی چیز سے بچنا؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.95} {cite:canon-ibn-sina-print-v2 p.96}۔"
