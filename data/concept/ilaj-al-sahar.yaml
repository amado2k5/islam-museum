id: concept/ilaj-al-sahar
class: concept
kind: scientific
label:
  ar: "علاج السهر"
  en: "Treatment of sleeplessness"
  ur: "بے خوابی کا علاج"
  es: "Tratamiento del insomnio"
  fr: "Traitement de l'insomnie"
  tr: "Geç saatlere kadar uyanık kalma tedavisi"
  id: "Perawatan begadang"
summary:
  ar: "يذكر ابن سينا مبادئ علاج السهر بحسب سببه: الغذاء المرطب والسكون من اليبس، وتسكين الوجع، وتجنب ما يزيد الرطوبة المالحة؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.95} {cite:canon-ibn-sina-print-v2 p.96}"
  en: "Ibn Sina gives the principles of treating sleeplessness by its cause: moistening food and rest for dryness, soothing the pain, and avoiding what adds to salty moisture; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.95} {cite:canon-ibn-sina-print-v2 p.96}"
  ur: "ابن سینا بے خوابی کے علاج کے اصول اس کے سبب کے مطابق بتاتا ہے: خشکی میں تر کرنے والی غذا اور سکون، درد کو تسکین دینا، اور نمکین نمی کو بڑھانے والی چیز سے بچنا؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.95} {cite:canon-ibn-sina-print-v2 p.96}۔"
  es: "Ibn Sina expone los principios para tratar el insomnio según su causa: humedecer los alimentos y descansar para la sequedad, aliviar el dolor y evitar lo que aumenta la humedad salada; las recetas y los métodos de aplicación no se reproducen {cite:canon-ibn-sina-print-v2 p.95} {cite:canon-ibn-sina-print-v2 p.96}"
  tr: "İbn Sina, geç saatlere kadar uyanık kalmanın nedenine göre tedavi edilmesinin prensiplerinden bahseder: nemlendirmek, kuruluğu yatıştırmak, ağrıyı hafifletmek ve tuzlu nemi artıran her şeyden kaçınmak; ne tarifler ne de kullanım yöntemleri açıklanmamıştır {cite:canon-ibn-sina-print-v2 s.95} {cite:canon-ibn-sina-print-v2 s.96}"
  id: "Ibn Sina menyebutkan prinsip mengobati begadang sesuai penyebabnya: melembapkan makanan, menenangkan kekeringan, meredakan rasa sakit, dan menghindari apa pun yang meningkatkan kelembapan asin; baik resep maupun metode penggunaannya tidak dijelaskan {cite:canon-ibn-sina-print-v2 hlm.95} {cite:canon-ibn-sina-print-v2 hlm.96}"
