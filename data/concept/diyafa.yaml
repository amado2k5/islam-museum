id: concept/diyafa
class: concept
kind: social
label:
  ar: "الضيافة وإكرام الضيف"
  en: "Hospitality and honouring the guest"
  ur: "مہمان نوازی اور مہمان کا اکرام"
  es: "Hospitalidad y respeto hacia el huésped"
  fr: "L'hospitalité et le respect de l'invité"
  tr: "Misafirperverlik ve Konuk Onuru"
  id: "Keramahan dan Penghormatan Tamu"
summary:
  ar: "الضيافة عادة المسلمين في إكرام الضيف وإجارة الضعيف، جاء في الحديث «من كان يؤمن بالله واليوم الآخر فليكرم ضيفه»، وضرب إبراهيم ولوط والنبي بأهله الأمثال في إطعام الضيفان وإحسان ضيافتهم، وسار المسلمون على إكرام جيرانهم ومن نزل بهم."
  en: "Diyafa is the Muslim custom of honouring the guest and sheltering the weak; the hadith says «whoever believes in God and the Last Day, let him honour his guest». Ibrahim, Lut and the Prophet's household set the example of feeding guests and hosting them well, and Muslims have kept the custom toward neighbours and travellers."
  ur: "ضیافت مسلمانوں کا مہمان کے اکرام اور کمزور کی پناہ کا دستور ہے؛ حدیث میں آیا ہے «جو اللہ اور آخرت کے دن پر ایمان رکھتا ہو وہ اپنے مہمان کا اکرام کرے»۔ ابراہیم، لوط اور نبی کے اہل نے مہمانوں کو کھانا کھلانے اور اچھی مہمان نوازی کی مثال قائم کی۔"
  es: "La diyafa es la costumbre musulmana de honrar al huésped y dar cobijo a los débiles; el hadiz dice: «Quien crea en Dios y en el Último Día, que honre a su huésped». Ibrahim, Lut y la familia del Profeta dieron ejemplo alimentando y acogiendo bien a los huéspedes, y los musulmanes han mantenido esta costumbre con los vecinos y los viajeros."
  fr: "La diyafa est la coutume musulmane d'honorer l'invité et d'héberger les plus faibles. Un hadith dit: « Quiconque croit en Dieu et au Jour dernier doit honorer son hôte. » Ibrahim, Lot et la famille du Prophète ont donné l'exemple en nourrissant et en accueillant chaleureusement les invités, et les musulmans ont perpétué cette coutume envers leurs voisins et les voyageurs."
  tr: "Misafirperverlik, Müslümanların misafirleri onurlandırma ve zayıfları koruma geleneğidir. Hadislerde şöyle der: \"Allah'a ve Ahiret Günü'ne inanan kişi, misafirini onurlandırmalıdır.\" İbrahim, Lut ve Peygamber, misafirleri beslemek ve iyi davranmak için ailelerini örnek gösterdiler. Müslümanlar, komşularını ve yanlarında kalanları onurlandırma geleneğini benimsediler."
  id: "Keramahan adalah kebiasaan Muslim dalam menghormati tamu dan melindungi yang lemah. Hadis menyatakan, \"Siapa yang percaya kepada Allah dan Hari Terakhir harus menghormati tamunya.\" Ibrahim, Lot, dan Nabi mengutip keluarga mereka sebagai contoh dalam memberi makan tamu dan memperlakukan mereka dengan baik. Muslim mengikuti praktik menghormati tetangga dan mereka yang tinggal bersama mereka."
