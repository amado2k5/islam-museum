id: concept/diyafa
class: concept
kind: social
label:
  ar: "الضيافة وإكرام الضيف"
  en: "Hospitality and honouring the guest"
  ur: "مہمان نوازی اور مہمان کا اکرام"
summary:
  ar: "الضيافة عادة المسلمين في إكرام الضيف وإجارة الضعيف، جاء في الحديث «من كان يؤمن بالله واليوم الآخر فليكرم ضيفه»، وضرب إبراهيم ولوط والنبي بأهله الأمثال في إطعام الضيفان وإحسان ضيافتهم، وسار المسلمون على إكرام جيرانهم ومن نزل بهم."
  en: "Diyafa is the Muslim custom of honouring the guest and sheltering the weak; the hadith says «whoever believes in God and the Last Day, let him honour his guest». Ibrahim, Lut and the Prophet's household set the example of feeding guests and hosting them well, and Muslims have kept the custom toward neighbours and travellers."
  ur: "ضیافت مسلمانوں کا مہمان کے اکرام اور کمزور کی پناہ کا دستور ہے؛ حدیث میں آیا ہے «جو اللہ اور آخرت کے دن پر ایمان رکھتا ہو وہ اپنے مہمان کا اکرام کرے»۔ ابراہیم، لوط اور نبی کے اہل نے مہمانوں کو کھانا کھلانے اور اچھی مہمان نوازی کی مثال قائم کی۔"
