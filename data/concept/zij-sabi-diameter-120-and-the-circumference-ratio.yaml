label: { ar: "القطر مائة وعشرون جزءاً ونسبة المحيط إلى القطر في الزيج الصابي", en: "The diameter of 120 parts and the circumference ratio", ur: "قطر کے ۱۲۰ اجزا اور محیط کی نسبت", es: "El diámetro de 120 piezas y la relación de circunferencia" }
summary:
  ar: "يفتتح البتاني الباب الثالث بأن الأوائل اختلفوا في نسبة قطر الدائرة إلى محيطها وإن قرّبوها، ثم يقرر أنه لا يحتاج في وضع الأوتار إلى حقيقة هذه النسبة لأن الأوتار إنما تُعلم من قبل أقواسها، فيفرض القطر مائة وعشرين جزءاً كما فعل بطليموس لسهولة مخارج الحساب، ويعمل عليه في كتابه، فيكون وتر السدس ستين جزءاً أي نصف القطر. {cite:zij-sabi-nallino-byblion p.17}."
  en: "Al-Battani begins chapter 3 by saying the ancients differed on the ratio of a circle's diameter to its circumference though they approximated it, and then states that he does not need the exact ratio to set out the chords, because chords are known through their arcs; so he fixes the diameter at 120 parts as Ptolemy did, for the ease of the computing, and works on it in his book, which makes the chord of a sixth sixty parts, the radius. {cite:zij-sabi-nallino-byblion p.17}."
  ur: "البتانی تیسرے باب کا آغاز یوں کرتے ہیں کہ اگلوں نے دائرے کے قطر اور محیط کی نسبت میں اختلاف کیا اگرچہ اس کا تقریبی اندازہ لگایا، پھر وہ طے کرتے ہیں کہ اوتار قائم کرنے کے لیے انہیں اس نسبت کی حقیقت کی ضرورت نہیں کیونکہ اوتار اپنی قوسوں سے معلوم ہوتے ہیں؛ چنانچہ وہ حساب کی سہولت کے لیے بطلیموس کی طرح قطر کو ۱۲۰ اجزا فرض کرتے ہیں اور اپنی کتاب میں اسی پر کام کرتے ہیں، تو سدس کا وتر ساٹھ جزء، یعنی نصف قطر، ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.17}۔"
  es: "Al-Battani comienza el capítulo 3 diciendo que los antiguos discrepaban sobre la proporción entre el diámetro y la circunferencia de un círculo, aunque la aproximaban, y luego afirma que no necesita la proporción exacta para trazar las cuerdas, ya que estas se conocen a través de sus arcos; por lo tanto, fija el diámetro en 120 partes, como hizo Ptolomeo, para facilitar los cálculos, y trabaja con ello en su libro, que establece la cuerda de una sexta parte en sesenta partes, el radio. {cite:zij-sabi-nallino-byblion p.17}."
