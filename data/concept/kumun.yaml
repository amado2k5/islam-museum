label: { ar: "الكمون والظهور ⁦(مذهب النظام)⁩", en: "Latency and manifestation (kumun), al-Nazzam's doctrine", ur: "کمون و ظہور (نظام کا نظریہ)" }
summary:
  ar: "مذهب المعتزلي أبي إسحاق النظام أن الأشياء كامنة في الأجسام قبل ظهورها، كالنار في الحطب والحجر والدهن في السمسم والدم في الإنسان، وأن الاحتراق خروج نيران الشيء منه؛ عرضه تلميذه الجاحظ في كتاب الحيوان مع جدال النظام لضرار بن عمرو وأصحاب الأعراض، وعدّه عبد القاهر البغدادي من فضائح النظام وقال إنه شرّ من قول الدهرية {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 5} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 10} {cite:farq-bayn-al-firaq-tawfiqiyya p. 110}."
  en: "The doctrine of the Mu'tazili Abu Ishaq al-Nazzam that things lie latent in bodies before they appear — fire in wood and stone, oil in sesame, blood in man — and that burning is the coming-out of a thing's own fires; his pupil al-Jahiz set it out in Kitab al-Hayawan with al-Nazzam's arguments against Dirar ibn 'Amr and the 'people of accidents', and 'Abd al-Qahir al-Baghdadi counted it among al-Nazzam's scandals, worse than the view of the Dahriyya {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 5} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 10} {cite:farq-bayn-al-firaq-tawfiqiyya p. 110}."
  ur: "معتزلی ابو اسحاق نظام کا یہ نظریہ کہ چیزیں ظاہر ہونے سے پہلے اجسام میں پوشیدہ (کامن) رہتی ہیں — آگ لکڑی اور پتھر میں، تیل تل میں، خون انسان میں — اور جلنا چیز کی اپنی آگ کا اس سے نکلنا ہے؛ ان کے شاگرد جاحظ نے اسے کتاب الحیوان میں ضرار بن عمرو اور اصحابِ اعراض سے نظام کی بحث کے ساتھ پیش کیا، اور عبد القاہر بغدادی نے اسے نظام کی «فضائح» میں شمار کر کے دہریہ کے قول سے بدتر کہا {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 5} {cite:hayawan-jahiz-ilmiyya-2003-v3 p. 10} {cite:farq-bayn-al-firaq-tawfiqiyya p. 110}۔"
