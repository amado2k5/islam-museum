  - tradition: other
    id: nazzam-kumun-as-reported-by-jahiz
    standing: other
    stance:
      ar: "قول النظام المعتزلي كما يحكيه الجاحظ: النار وغيرها كامنة في الأجسام، والإحراق إخراج نيران الشيء منه"
      en: "The Mu'tazili al-Nazzam's view as al-Jahiz reports it: fire and other things lie latent in bodies, and burning a thing is drawing out its own fires"
      ur: "معتزلی نظام کا قول، جیسا کہ جاحظ نقل کرتے ہیں: آگ اور دوسری چیزیں اجسام میں کامن ہیں، اور جلانا چیز کی اپنی آگ کو اس سے نکالنا ہے"
    summary:
      ar: "يحكي الجاحظ أن النظام كان يحتج بأن من أنكر كون النار في العود والحجر لزمه أن ينكر الدهن في السمسم والزيت في الزيتون والدم في الإنسان، وأن الحطب إذا انحل رجع إلى نار ودخان وماء ورماد، وأن الاحتراق ليس ناراً جاءت من مكان فعملت في الحطب بل ظهور النار الكامنة فيه عند زوال مانعها."
      en: "Al-Jahiz reports that al-Nazzam argued that whoever denies fire is in wood and stone must deny oil in sesame, olive oil in olives and blood in man; that wood when it breaks up returns to fire, smoke, water and ash; and that burning is not fire coming from elsewhere to act on wood but the appearance of the fire latent in it once what held it back is removed."
      ur: "جاحظ نقل کرتے ہیں کہ نظام یہ استدلال کرتے تھے کہ جو لکڑی اور پتھر میں آگ کے ہونے کا انکار کرے اسے تل میں تیل، زیتون میں روغن اور انسان میں خون کا بھی انکار کرنا پڑے گا؛ کہ لکڑی بکھرنے پر آگ، دھوئیں، پانی اور راکھ کی طرف لوٹتی ہے؛ اور جلنا کسی اور جگہ سے آنے والی آگ کا لکڑی پر عمل نہیں بلکہ رکاوٹ ہٹنے پر اس میں کامن آگ کا ظاہر ہونا ہے۔"
