issue:
  ar: "هل الأشياء كامنة في الأجسام قبل ظهورها، أم هي حادثة عند ظهورها؟"
  en: "Do things lie latent in bodies before they appear, or are they newly brought about when they appear?"
  ur: "کیا چیزیں ظاہر ہونے سے پہلے اجسام میں پوشیدہ ہوتی ہیں، یا ظہور کے وقت نئی پیدا ہوتی ہیں؟"
sensitivity: contested
perspectives:
  - tradition: sunni-ashari
    id: baghdadi-kumun-rejected
    standing: main
    stance:
      ar: "قول باطل: يفتح طريق الدهرية إلى إنكار حدوث الأجسام والأعراض، كما يقرر البغدادي"
      en: "A false doctrine: it opens the way for the Dahriyya to deny that bodies and accidents are originated, as al-Baghdadi holds"
      ur: "باطل قول: بغدادی کے مطابق یہ دہریہ کے لیے اجسام و اعراض کے حدوث کے انکار کا راستہ کھولتا ہے"
    summary:
      ar: "يعدّ عبد القاهر البغدادي في الفرق بين الفرق قول النظام بالظهور والكمون وتداخل الأجسام من فضائحه، ويقول إنه شرّ من قول الدهرية الذين زعموا أن الأعراض كامنة في الأجسام، وإن في المذهبين تطريقاً إلى إنكار حدوث الأجسام والأعراض، ويربطه بقول النظام إن الله خلق الناس والحيوان والنبات والمعادن في وقت واحد وإن التقدم والتأخر في ظهورها من أماكنها، ويقول إنه خالف بذلك سلف الأمة وأكثر المعتزلة."
      en: "In al-Farq bayn al-Firaq, 'Abd al-Qahir al-Baghdadi counts al-Nazzam's doctrine of manifestation and latency and the interpenetration of bodies among his scandals, calls it worse than the Dahriyya's claim that accidents lie latent in bodies, and says both open a way to denying that bodies and accidents are originated; he links it to al-Nazzam's claim that God created people, animals, plants and minerals all at one time, priority and lateness being only in their emerging from their places, and says that in this he opposed the early community and most of the Mu'tazila."
      ur: "الفرق بین الفرق میں عبد القاہر بغدادی نظام کے ظہور و کمون اور اجسام کے تداخل کے قول کو ان کی فضائح میں شمار کرتے ہیں، اسے دہریہ کے اس قول سے بدتر کہتے ہیں کہ اعراض اجسام میں کامن ہیں، اور کہتے ہیں کہ دونوں مذاہب اجسام و اعراض کے حدوث کے انکار کی راہ کھولتے ہیں؛ وہ اسے نظام کے اس قول سے جوڑتے ہیں کہ اللہ نے انسان، حیوان، نبات اور معدنیات ایک ہی وقت میں پیدا کیے اور تقدم و تاخر صرف ان کے اپنی جگہوں سے ظاہر ہونے میں ہے، اور کہتے ہیں کہ اس میں انہوں نے سلفِ امت اور اکثر معتزلہ کی مخالفت کی۔"
    holders: [person/al-baghdadi-abd-al-qahir-ibn-tahir]
