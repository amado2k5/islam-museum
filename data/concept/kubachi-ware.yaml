  ur: "نیلے اور سفید مٹی کے برتن داغستانی قصبے کوباچی اور اس کے علاقے سے 16ویں صدی سے منسوب ہیں، جو سبزیوں اور جانوروں کے زیور سے مالا مال ہیں۔"
  tr: "Dağıstan'ın Kobachi kasabası ve çevresinden 16. yüzyıla atfedilen, çiçek ve hayvan motifleriyle süslenmiş mavi ve beyaz çömlekler."
  id: "Keramik biru dan putih dari kota Kobachi di Dagestan dan sekitarnya, yang dikaitkan dengan abad ke-16, dihiasi dengan motif bunga dan hewan."
