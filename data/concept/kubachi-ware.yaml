  ar: "فخاريات زرقاء وبيضاء من بلدة كوباتشي الداغستانية وما حولها، تُنسب للقرن السادس عشر وتزدان بالزخارف النباتية والحيوانية."
  en: "Blue-and-white pottery attributed to the Dagestani town of Kubachi and its region from the 16th century, rich in vegetal and animal ornament."
  es: "Cerámica azul y blanca atribuida a la ciudad daguestaní de Kubachi y su región, que data del siglo XVI y es rica en ornamentación vegetal y animal."
