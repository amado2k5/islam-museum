summary:
  ar: "غاليون في الكتاب دواء طيب الرائحة، مجفف يجمد اللبن وفيه يسير حدة ويمنع من انفجار الدم، وينفع من حرق النار {cite:canon-ibn-sina-print-v1 p.726}"
  en: "Ghalyun is in the book a sweet-smelling drug, drying, which congeals milk, with a little sharpness in it, and it prevents the bursting forth of blood and benefits a burn by fire {cite:canon-ibn-sina-print-v1 p.726}"
  ur: "غالیون کتاب میں ایک خوشبودار دوا ہے، خشک کرنے والی، جو دودھ کو جماتی ہے، اس میں تھوڑی تیزی ہے، اور خون کے پھوٹ پڑنے کو روکتی ہے اور آگ کے جلنے میں نافع ہے {cite:canon-ibn-sina-print-v1 p.726}۔"
  es: "En el libro, Ghalyun es una droga de olor dulce, secante, que coagula la leche, con un ligero toque picante, y previene el sangrado y beneficia a quienes sufren quemaduras por fuego {cite:canon-ibn-sina-print-v1 p.726}"
  fr: "Le ghaliun est décrit dans le livre comme une drogue odorante et asséchante qui fait cailler le lait, légèrement piquante, qui empêche l'éclatement du sang et est bénéfique en cas de brûlure par le feu {cite:canon-ibn-sina-print-v1 p.726}"
  tr: "Kitaptaki Galion, sütü donduran, keskinliğini yumuşatan, kanın patlamasını önleyen ve ateş yakmak için kullanışlı kurutulmuş bir ilaçtır {cite:canon-ibn-sina-print-v1 s.726}"
  id: "Galion dalam buku ini adalah obat yang harum, obat kering yang membekukan susu, melunakkan ketajamannya, mencegah darah meledak, dan berguna untuk membakar api {cite:canon-ibn-sina-print-v1 hlm.726}"
