  ar: 'الاقتصاد: القصد والاعتدال'
  en: Economy as moderation
summary:
  ar: 'الاقتصاد في اللغة القصد، أي التوسط والاعتدال، ومنه ما جاء في القرآن من الأمر بالقصد في المشي [[passage/quran-31-19|لقمان 19]] {cite:usul-iqtisad-islami-0660 p. 14}. ويعرّفه العز بن عبد السلام بأنه «رتبة بين رتبتين، ومنزلة بين منزلتين»، هما التفريط والإفراط {cite:usul-iqtisad-islami-0660 p. 14}. ويعدّد المؤلف مواضع الاقتصاد: في الطهارة والطعام والشراب، وفي العقوبة والتأديب، وفي الإنفاق {cite:usul-iqtisad-islami-0660 p. 14} {cite:usul-iqtisad-islami-0660 p. 15}. وقد صار الاصطلاح الحديث مقصورًا على دراسة سلوك الإنسان في إدارة الموارد النادرة وتنميتها لإشباع حاجاته {cite:usul-iqtisad-islami-0660 p. 15}، لكن للاقتصاد في العقوبة صلة بحفظ المورد البشري، أحد المقاصد الشرعية الخمسة {cite:usul-iqtisad-islami-0660 p. 16}.'
