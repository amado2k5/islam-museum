id: concept/economy-as-moderation
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: 'الاقتصاد: القصد والاعتدال'
  en: Economy as moderation
  es: "La economía como moderación"
  fr: "L'économie comme modération"
  ur: "اعتدال کے طور پر معیشت"
  tr: "Ekonomi: Niyetlilik ve Ölçülülük"
  id: "Ekonomi: Intensionalitas dan Moderasi"
summary:
  ar: 'الاقتصاد في اللغة القصد، أي التوسط والاعتدال، ومنه ما جاء في القرآن من الأمر بالقصد في المشي [[passage/quran-31-19|لقمان 19]] {cite:usul-iqtisad-islami-0660 p. 14}. ويعرّفه العز بن عبد السلام بأنه «رتبة بين رتبتين، ومنزلة بين منزلتين»، هما التفريط والإفراط {cite:usul-iqtisad-islami-0660 p. 14}. ويعدّد المؤلف مواضع الاقتصاد: في الطهارة والطعام والشراب، وفي العقوبة والتأديب، وفي الإنفاق {cite:usul-iqtisad-islami-0660 p. 14} {cite:usul-iqtisad-islami-0660 p. 15}. وقد صار الاصطلاح الحديث مقصورًا على دراسة سلوك الإنسان في إدارة الموارد النادرة وتنميتها لإشباع حاجاته {cite:usul-iqtisad-islami-0660 p. 15}، لكن للاقتصاد في العقوبة صلة بحفظ المورد البشري، أحد المقاصد الشرعية الخمسة {cite:usul-iqtisad-islami-0660 p. 16}.'
  tr: "Dilde ekonomi, niyet anlamına gelir; ölçülü ve dengelilik anlamına gelir; Kur'an'da yürüme niyeti emriyle ilgili olarak belirtildiği gibi [[pasaj/kuran-31-19|Luqman 19]] {cite:usul-iqtisad-islami-0660 s. 14}. Al-Izz bin Abdülselam bunu \"iki rütbe arasında bir rütbe ve iki seviye arasında bir rütbe\" olarak tanımlar; bunlar ihmal ve aşıklıktır {cite:usul-iqtisad-islami-0660 s. 14}. Yazar ekonominin alanlarını sıralar: saflık, yiyecek ve içecek, ceza ve disiplin, harcama {cite:usul-iqtisad-islami-0660 s. 14} {cite:usul-iqtisad-islami-0660 s. 15}. Modern terminoloji, insan davranışını, kıt kaynakların yönetimi ve geliştirilmesinde incelemekle sınırlı kalmıştır {cite:usul-iqtisad-islami-0660 s. 15}, ancak cezada ekonomi, beş dini hedeften biri olan insan kaynaklarının korunmasıyla ilgilidir {cite:usul-iqtisad-islami-0660 s. 16}."
  id: "Efisiensi dalam bahasa berarti niat, yang berarti moderasi dan keseimbangan, seperti yang disebutkan dalam Al-Qur'an mengenai perintah untuk berniat berjalan [[ayat/al-Quran-31-19|Luqman 19]] {cite:usul-iqtisad-islami-0660 hlm. 14}. Al-Izz ibn Abd al-Salam mendefinisikannya sebagai \"pangkat antara dua tingkat, dan pangkat antara dua tingkat,\" yaitu kelalaian dan kelebihan {cite:usul-iqtisad-islami-0660 hlm. 14}. Penulis mencantumkan bidang ekonomi: dalam kemurnian, makanan dan minuman, dalam hukuman dan disiplin, serta dalam pengeluaran {cite:usul-iqtisad-islami-0660 hlm. 14} {cite:usul-iqtisad-islami-0660 hlm. 15}. Terminologi modern kini terbatas pada studi perilaku manusia dalam mengelola dan mengembangkan sumber daya yang langka untuk memenuhi kebutuhan mereka {cite:usul-iqtisad-islami-0660 hlm. 15}, tetapi ekonomi dalam hukuman berkaitan dengan pelestarian sumber daya manusia, salah satu dari lima tujuan keagamaan {cite:usul-iqtisad-islami-0660 hlm. 16}."
