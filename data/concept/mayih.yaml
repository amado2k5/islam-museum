summary:
  ar: "المايح في الكتاب نبات جبلي نقل ديسقوريدوس وصفه، له ساق واحد وورق مستدير وثمر كالترس، يسكن طبيخه الفواق، ويجلو الكلف والبرق مع العسل {cite:canon-ibn-sina-print-v1 p.574}."
  en: "Mayih, in the book, is a mountain plant whose description is reported from Dioscorides, with one stem, round leaves and a shield-like fruit; its decoction calms hiccup, and with honey it cleanses freckles and vitiligo {cite:canon-ibn-sina-print-v1 p.574}."
  ur: "مایح کتاب میں ایک پہاڑی پودا ہے جس کا وصف دیسقوریدوس سے نقل ہوا؛ اس کا ایک تنا، گول پتے اور ڈھال جیسا پھل ہے، اس کا جوشاندہ ہچکی کو تسکین دیتا ہے اور شہد کے ساتھ جھائیاں اور برص صاف کرتا ہے {cite:canon-ibn-sina-print-v1 p.574}۔"
  es: "En el libro, Mayih es una planta de montaña cuya descripción se recoge de Dioscórides, con un tallo, hojas redondas y un fruto en forma de escudo; su decocción calma el hipo y, con miel, limpia las pecas y el vitíligo {cite:canon-ibn-sina-print-v1 p.574}."
