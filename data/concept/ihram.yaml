label: { ar: "إحرام", en: "Ihram (the state of consecration for hajj or umra)" }
summary:
  ar: "الإحرام في اللغة الإهلال بحج أو عمرة والدخول في الحرمة، وعند الإطلاق يراد به الإحرام بالحج أو العمرة، وقد يُطلق على الدخول في الصلاة فيقال «تكبيرة الإحرام». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777} وهو عند الحنفية الدخول في حرمات مخصوصة لا يتحقق شرعاً إلا بالنية مع الذكر أو ما يقوم مقامه، وعند المالكية والشافعية والحنابلة نية الدخول في حرمات الحج والعمرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} وأجمع العلماء على أنه من فرائض النسك، واختلفوا هل هو ركن أو شرط: فهو ركن عند المالكية والشافعية والحنابلة، وشرط من وجه وركن من وجه عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} ويشترط لصحته الإسلام والنية، وزاد الحنفية التلبية أو ما يقوم مقامها، وهي عندهم شرط، وقيل واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} والتلبية قول «لبيك اللهم لبيك»، والصيغة الواردة فيها ما لزمه النبي في حجة الوداع، وهي عند الحنابلة والشافعية سنة، وعند المالكية واجبة يلزم الدم بتركها أو بطول الفصل عن النية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1782} ويقوم مقام التلبية عند الحنفية كل ذكر فيه تعظيم لله، وتقليد الهدي وسوقه مع التوجه معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} وإيهام الإحرام، وهو أن ينوي نسكاً مطلقاً ثم يعيّنه، صحيح باتفاق المذاهب، ويجب تعيين النسك عند الشافعية والحنابلة قبل أي عمل، وعند الحنفية والمالكية بحسب الطواف أو الوقوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} والإحرام بإحرام الغير صحيح وينعقد على مثل ما أحرم به ذلك الشخص عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} والاشتراط عند الإحرام، بأن يقول «إن حبسني حابس فمحلي حيث حبستني»، يصح عند الشافعية والحنابلة ويفيد التحلل عند المانع، ولا يصح عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} وللحنفية تفصيل في القِران بحسب حال المحرم: المكي (أي الميقاتي) يُكره له القِران، فإن فعله جاز وعليه دم جبر، والآفاقي إذا أدخل الحج على العمرة قبل أن يطوف لها صح قارناً عند الجمهور، أما المكي فترفض عمرته عند الحنفية بدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} وأجاز المالكية والحنابلة إرداف الحج على العمرة بعد الشروع فيها ويصير المحرم قارناً، ومنع الشافعية ذلك بعد الشروع في الطواف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1788} وإضافة إحرام العمرة إلى الحج لا تصح عند المالكية والشافعية والحنابلة فلا يصير قارناً، وكرهها الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} والإحرام بحجتين أو عمرتين معاً ينعقد بإحداهما عند الجمهور ويلغو الآخر، وعند أبي حنيفة ينعقد بهما وعليه قضاء إحداهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} وتنقسم حالات الإحرام إلى إفراد وقِران وتمتع، وتعريفها يختلف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} وتنحصر واجبات الإحرام عند الفقهاء في أمرين: أن يكون من الميقات، وأن يصان عن المحظورات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790}"
  en: "Ihram in the lexicon means to proclaim the pilgrimage or the umra and to enter the state of sanctity; in jurists' usage it means, when unqualified, entering the hajj or the umra, and the word is also used for entering prayer, as in «the takbir of ihram». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777} For the Hanafis it is entering into certain prohibitions, valid only with intention together with a mention of God or what stands in for it; for the Malikis, Shafi'is and Hanbalis it is the intention to enter the prohibitions of hajj or umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} All agree that it is one of the obligations of the rite. They differ on whether it is a pillar or a condition: the Malikis, Shafi'is and Hanbalis count it a pillar, while the Hanafis count it a condition in one respect and a pillar in another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} Its validity requires Islam and intention; the Hanafis add the talbiya or what stands in for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} The talbiya is the words «here I am, O God, here I am», which the Prophet's practice on the farewell pilgrimage fixed; the Shafi'is and Hanbalis treat it as a sunna, while the Malikis treat it as an obligation whose omission or long delay after intention requires a sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1782} For the Hanafis, anything that glorifies God stands in for the talbiya, as does garlanding and driving the sacrificial animal with the intention to go along. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} Ihram with an unspecified rite is valid by agreement; the Shafi'is and Hanbalis require the rite to be named before any act, while the Hanafis and Malikis judge by the first act performed (circling the House or standing at Arafat). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} Entering ihram by copying another's ihram is valid, and according to the majority it takes the form of the other person's ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} A stipulation made at the start (that one may leave the state if prevented) is valid for the Shafi'is and Hanbalis and allows release when hindered, but it is not valid for the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} The Hanafis have their own rule for the Meccan (one at or within the miqat zone): for him qiran is disliked; if he does it, it is lawful but he owes a make-up sacrifice, while for a man coming from afar who joins hajj to umra before circling for it, the joining is qiran by the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} The Malikis and Hanbalis allow joining hajj to an umra already begun, making the pilgrim a qarin; the Shafi'is forbid it once circling has begun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1788} Adding an umra to a hajj already begun is not valid for the Malikis, Shafi'is and Hanbalis, so no qiran results; the Hanafis and Malikis dislike it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} Entering ihram for two hajjs or two umras together takes effect with one and the other is void, according to the majority; Abu Hanifa holds both take effect and one must be made up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} The forms of ihram are ifrad, qiran and tamattu', and each school defines them differently. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} Its obligations come down to two: beginning at the miqat, and guarding the ihram against the prohibited acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790}"
