id: concept/ihram
class: concept
kind: legal
label: { ar: "إحرام", en: "Ihram (the state of consecration for hajj or umra)", es: "Ihram (estado de consagración para el Hajj o la Umrah)", fr: "Ihram (l'état de consécration pour le hajj ou l'umra)", ur: "احرام ⁦(حج یا عمرہ کے لیے تقدیس کی حالت)⁩", tr: "İhram", id: "Ihram" }
summary:
  ar: "الإحرام في اللغة الإهلال بحج أو عمرة والدخول في الحرمة، وعند الإطلاق يراد به الإحرام بالحج أو العمرة، وقد يُطلق على الدخول في الصلاة فيقال «تكبيرة الإحرام». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777} وهو عند الحنفية الدخول في حرمات مخصوصة لا يتحقق شرعاً إلا بالنية مع الذكر أو ما يقوم مقامه، وعند المالكية والشافعية والحنابلة نية الدخول في حرمات الحج والعمرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} وأجمع العلماء على أنه من فرائض النسك، واختلفوا هل هو ركن أو شرط: فهو ركن عند المالكية والشافعية والحنابلة، وشرط من وجه وركن من وجه عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} ويشترط لصحته الإسلام والنية، وزاد الحنفية التلبية أو ما يقوم مقامها، وهي عندهم شرط، وقيل واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} والتلبية قول «لبيك اللهم لبيك»، والصيغة الواردة فيها ما لزمه النبي في حجة الوداع، وهي عند الحنابلة والشافعية سنة، وعند المالكية واجبة يلزم الدم بتركها أو بطول الفصل عن النية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1782} ويقوم مقام التلبية عند الحنفية كل ذكر فيه تعظيم لله، وتقليد الهدي وسوقه مع التوجه معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} وإيهام الإحرام، وهو أن ينوي نسكاً مطلقاً ثم يعيّنه، صحيح باتفاق المذاهب، ويجب تعيين النسك عند الشافعية والحنابلة قبل أي عمل، وعند الحنفية والمالكية بحسب الطواف أو الوقوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} والإحرام بإحرام الغير صحيح وينعقد على مثل ما أحرم به ذلك الشخص عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} والاشتراط عند الإحرام، بأن يقول «إن حبسني حابس فمحلي حيث حبستني»، يصح عند الشافعية والحنابلة ويفيد التحلل عند المانع، ولا يصح عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} وللحنفية تفصيل في القِران بحسب حال المحرم: المكي ⁦(أي الميقاتي)⁩ يُكره له القِران، فإن فعله جاز وعليه دم جبر، والآفاقي إذا أدخل الحج على العمرة قبل أن يطوف لها صح قارناً عند الجمهور، أما المكي فترفض عمرته عند الحنفية بدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} وأجاز المالكية والحنابلة إرداف الحج على العمرة بعد الشروع فيها ويصير المحرم قارناً، ومنع الشافعية ذلك بعد الشروع في الطواف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1788} وإضافة إحرام العمرة إلى الحج لا تصح عند المالكية والشافعية والحنابلة فلا يصير قارناً، وكرهها الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} والإحرام بحجتين أو عمرتين معاً ينعقد بإحداهما عند الجمهور ويلغو الآخر، وعند أبي حنيفة ينعقد بهما وعليه قضاء إحداهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} وتنقسم حالات الإحرام إلى إفراد وقِران وتمتع، وتعريفها يختلف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} وتنحصر واجبات الإحرام عند الفقهاء في أمرين: أن يكون من الميقات، وأن يصان عن المحظورات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} الميقات في اللغة الوقت المحدد، وفي الاصطلاح مواضع وأزمنة معينة لعبادة مخصوصة، وللإحرام ميقات زماني وميقات مكاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} ميقات الإحرام بالحج عند الأئمة الثلاثة وأحمد: شوال وذو القعدة وعشر من ذي الحجة، وعند مالك يمتد إلى آخر ذي الحجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} وعند الحنفية والحنابلة يوم النحر من أشهر الحج، وعند الشافعية آخرها ليلة النحر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} وأجاز الحنفية والمالكية والحنابلة الإحرام بالحج قبل أشهره مع الكراهة، ومنعه الشافعية فلا ينعقد حجاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} وميقات العمرة الزماني جميع العام، وهي تندب في رمضان، وكرهها الحنفية يوم عرفة وأربعة أيام بعده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} ومواقيت الآفاق المكانية متفق عليها: ذو الحليفة لأهل المدينة، والجحفة لأهل الشام ومن مر بها، وقرن المنازل لأهل نجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} ميقات أهل اليمن يلملم، وميقات أهل العراق وسائر المشرق ذات عرق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} وثبتت المواقيت بالسنة ⁦(حديث ابن عباس وحديث ابن عمر)⁩ وبالإجماع، واختلف في ذات عرق هل ثبتت بالنص أم باجتهاد عمر الموافق للنص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} ومن مرّ بالميقات يريد أحد النسكين وجب عليه أن يحرم منه، ويحرم تأخير الإحرام عنه بالإجماع، والإحرام من أوله أفضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} والعبرة بموضع الميقات لا باسم القرية، ويكفي الإحرام من الميقات أو من محاذاته، والمحاذاة هي الأصل عند من لم يمر بميقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} ومن مرّ بميقاتين فالشافعية والحنابلة يوجبون الإحرام من الأبعد، والمالكية يجيزون الإحرام من الأول، والحنفية يجيزونه ويكرهون تأخيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} والإحرام قبل الميقات المكاني جائز بالإجماع، والخلاف في الأفضل: المالكية والشافعية والحنابلة يكرهونه، والحنفية يرونه أفضل مع الأمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} ومن جاوز الميقات قاصداً النسك غير محرم أثم، ويجب عليه الرجوع والإحرام منه، فإن لم يرجع لزمه الدم، إلا بعذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} والميقاتي أي من يسكن في منطقة المواقيت، وميقاته موضعه عند المالكية، وعند الشافعية والحنابلة قريته أو حلته، والحنفية يجعلون ميقاته منطقة الحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} ميقات أهل مكة والحرم في الحج هو موضعهم، فيحرمون من مكة ⁦(أو من المسجد عند الحنفية والحنابلة)⁩، والمالكية يفرقون بين من أهل بالحج ومن أهل بالقران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} وميقات العمرة لمن كان في مكة هو الحل من أي موضع، وأفضله عند الجمهور الجعرانة وعند الحنفية التنعيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} ويحرم المحرم من المحظورات المباحة عادة تذكيراً وتربية على التقشف، ومن أهمها للرجل ستر الجسم بالمخيط أو المحيط، فلا يلبس القميص والعمامة والسراويل والبرانس والخفاف، وتحريم الزعفران والورس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} ولا يلبس الرجل القباء ونحوه إلا بالتفصيل عند الحنفية؛ ولمن لم يجد الإزار السراويل مع الفدية عند بعض المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} ومن لم يجد النعلين قطع الخفين أسفل الكعبين ولبسهما عند الجمهور، وأحمد وأهل قول يخالفون ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} ومما يحظر على المحرم عند المالكية والحنابلة تقلد السيف بلا حاجة، وأجازه الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} وستر الرأس محرم بالاتفاق، واختلفوا في ضابطه: الحنفية والحنابلة بما يقصد به التغطية عادة، والمالكية والشافعية بما يعد ساتراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} والتظلل بما يثبت في أصل تابع، كالخيمة والسيارة المسقفة، جائز بالاتفاق، وبما لا يثبت جائز عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} ويحرم على الرجل ستر وجهه وعلى المرأة ستره بالنقاب، والاستثناء عند الحاجة ودفع الفتنة؛ ويحرم على الرجل لبس القفازين باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} وتحرم المرأة المحرمة اللبس في وجهها ويديها عند الجمهور مع الاستثناء، وأجازه الحنفية في اليدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} ومحظورات البدن للمحرم كل ما يتعلق بتطييب الجسم أو إزالة الشعث أو قضاء التفث: حلق الرأس، وإزالة الشعر، وقص الظفر، والادّهان، والتطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} وحلق الرأس محرم على المحرم وعلى من يحلق له، وكذلك التقصير، واختلف في حلق المحرم للحلال: فحظره الحنفية، وأجازه الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} والادّهان بالدهن غير المطيب محظور عند الجمهور لما فيه من الترفه، والشافعية يخصون الرأس واللحية، والحنابلة يبيحون الدهن في البدن كله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} والطيب محظور بلا خلاف على التفصيل، والمحرم ممنوع من استعماله في إزاره وثيابه وفراشه ونعله، ويحرم على المحرم شرب الطيب الخالص وأكله، ويختلف الحكم فيه إذا خلط بالطعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1810} شم الطيب دون مسه يكره عند الحنفية والمالكية والشافعية ولا جزاء فيه عندهم، ويحرم عند الحنابلة ويجب فيه الفداء كالمسك والكافور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} والصيد محظور على المحرم بالكتاب ⁦(سورة المائدة 95-96)⁩ والسنة ⁦(حديث أبي قتادة)⁩ والإجماع، والصيد عند الحنفية الحيوان البري الممتنع المتوحش في أصل الخلقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} ويحرم على المحرم قتل الصيد وإيذاؤه والمساعدة عليه والأمر به، وتملكه بالبيع أو الهبة أو غيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} ويحرم عليه الانتفاع بالصيد كأكل لحمه أو بيضه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} وفي أكل صيد صاده الحلال خلاف: منعه علي وابن عمر وابن عباس، وأجازه الجمهور إن لم يصد له، وأجازه الحنفية ما لم يكن منه أمر أو دلالة، وسنده حديث «صيد البر لكم حلال ما لم تصيدوه أو يصد لكم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1814} ويُسنّ الغسل للإحرام، ويُسنّ التطيب قبله عند الجمهور، ويُصلّى ركعتان قبل الإحرام، وتُلبّى التلبية سنةً مع الإكثار منها ورفع الصوت بها، وينتهي وقتها للحاج عند رمي جمرة العقبة، وللمعتمر عند استلام الحجر، {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1823}. وموجب الإحرام إتمام النسك، والردة تبطله، والجماع يفسده فيوجب القضاء، والتحلل الأصغر يكون بفعل اثنين من ثلاثة: الرمي والنحر والحلق أو التقصير، والتحلل الأكبر بطواف الإفاضة مع الحلق عند الحنفية والمالكية، وبالأفعال الثلاثة عند الشافعية والحنابلة، والعمرة لها تحلل واحد بالحلق أو التقصير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1825}. ويرفع الإحرام الفسخ، وهو محل خلاف، والرفض وهو لغو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1826} وفي أحكام الصبي والمغمى عليه والناسي: ينعقد إحرام الصبي المميز بنفسه عند الحنفية والمالكية، ويحرم عن غير المميز وليّه، والمغمى عليه قبل الإحرام لا يحرم عنه عند الثلاثة ويُحرم عنه عند الحنفية بتفصيل، والناسي للنسك المعين يلزمه الحج والعمرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1829}. ويبدأ الفصل العاشر في كفارات المحظورات، وفيه الفدية والهدي والصدقة والصيام، وتُفصّل كفارات الترفه في اللباس والطيب والحلق والأظفار وقتل القمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1834}. وفي قمل الرأس والصيد: يُكره تعرّض المحرم للقمل تنزيهاً، وفي قتله خلاف في الجزاء، والصيد مضمون بالجزاء عمداً وخطأً عند الأئمة الأربعة، والمثلي فيه التخيير بين الهدي والطعام والصيام، وإصابة الصيد والحلب والكسر والتسبب والتعدي بوضع اليد والأكل له أحكام متفاوتة بين المذاهب. وفي الجماع: هو جناية موجبة للجزاء، ويفسد الحج قبل الوقوف وبعده قبل التحلل الأول بخلاف ما بعده، وعلى العمرة كذلك، ويُفصل في فداء المقدمات والنظر والتفكير وفي حج القارن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1842}. وفي الصدقة والصيام والقضاء: تُراعى في الصدقة أصناف صدقة الفطر، والصيام للعاجز عن الهدي ثلاثة أيام في الحج وسبعة بعد الرجوع، والقضاء للفاسد على الفور عند الجمهور وفي العام القادم عند الحنفية، ويُحرم القاضي من ميقات النسك المفسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1844}."
  en: "Ihram in the lexicon means to proclaim the pilgrimage or the umra and to enter the state of sanctity; in jurists' usage it means, when unqualified, entering the hajj or the umra, and the word is also used for entering prayer, as in «the takbir of ihram». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777} For the Hanafis it is entering into certain prohibitions, valid only with intention together with a mention of God or what stands in for it; for the Malikis, Shafi'is and Hanbalis it is the intention to enter the prohibitions of hajj or umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} All agree that it is one of the obligations of the rite. They differ on whether it is a pillar or a condition: the Malikis, Shafi'is and Hanbalis count it a pillar, while the Hanafis count it a condition in one respect and a pillar in another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} Its validity requires Islam and intention; the Hanafis add the talbiya or what stands in for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} The talbiya is the words «here I am, O God, here I am», which the Prophet's practice on the farewell pilgrimage fixed; the Shafi'is and Hanbalis treat it as a sunna, while the Malikis treat it as an obligation whose omission or long delay after intention requires a sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1782} For the Hanafis, anything that glorifies God stands in for the talbiya, as does garlanding and driving the sacrificial animal with the intention to go along. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} Ihram with an unspecified rite is valid by agreement; the Shafi'is and Hanbalis require the rite to be named before any act, while the Hanafis and Malikis judge by the first act performed (circling the House or standing at Arafat). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} Entering ihram by copying another's ihram is valid, and according to the majority it takes the form of the other person's ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} A stipulation made at the start (that one may leave the state if prevented) is valid for the Shafi'is and Hanbalis and allows release when hindered, but it is not valid for the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} The Hanafis have their own rule for the Meccan (one at or within the miqat zone): for him qiran is disliked; if he does it, it is lawful but he owes a make-up sacrifice, while for a man coming from afar who joins hajj to umra before circling for it, the joining is qiran by the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} The Malikis and Hanbalis allow joining hajj to an umra already begun, making the pilgrim a qarin; the Shafi'is forbid it once circling has begun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1788} Adding an umra to a hajj already begun is not valid for the Malikis, Shafi'is and Hanbalis, so no qiran results; the Hanafis and Malikis dislike it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} Entering ihram for two hajjs or two umras together takes effect with one and the other is void, according to the majority; Abu Hanifa holds both take effect and one must be made up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} The forms of ihram are ifrad, qiran and tamattu', and each school defines them differently. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} Its obligations come down to two: beginning at the miqat, and guarding the ihram against the prohibited acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} A miqat is, in the lexicon, a set time or place; in law, the set places and times for a specific rite. Ihram has a time miqat and a place miqat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} For the hajj, the three imams and Ahmad fix the time as Shawwal, Dhu al-Qa'da and the first ten days of Dhu al-Hijja; for Malik it runs to the end of Dhu al-Hijja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} The Hanafis and Hanbalis count the day of sacrifice as one of the months of hajj; the Shafi'is count only its night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} The Hanafis, Malikis and Hanbalis allow ihram for the hajj before its months, with dislike; the Shafi'is hold it does not make a hajj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} The time for umra is the whole year; it is recommended in Ramadan, and the Hanafis dislike it on the day of Arafa and four days after. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} The places for those coming from afar are agreed: Dhu al-Hulayfa for the people of Madina, al-Juhfa for Syria and those who come by it, and Qarn al-Manazil for the people of Najd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} For those of Yemen the miqat is Yalamlam, and for Iraq and the rest of the East it is Dhat Irq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} The miqats are fixed by the sunna (the hadiths of Ibn Abbas and Ibn Umar) and by consensus; whether Dhat Irq was fixed by text or by Umar's judgment that matched the text is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} Whoever passes a miqat wishing to perform either rite must enter ihram there; delaying it past the miqat is forbidden by agreement, and beginning at its far edge is best. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} The place counts, not the name of the village; entering ihram at the miqat or at its alignment is enough. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} For a traveller who passes two miqats, the Shafi'is and Hanbalis require ihram at the farther one, the Malikis allow the nearer, and the Hanafis allow either and dislike delay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} Entering ihram before the place miqat is lawful by agreement; the Malikis, Shafi'is and Hanbalis dislike it, while the Hanafis consider it better when the pilgrim is safe from breaking its rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} Whoever passes the miqat without ihram intending a rite is sinful, must return and enter ihram there, and owes a sacrifice if he does not return, unless he has an excuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} The resident of the miqat zone enters from his own place according to the Malikis, from his village or encampment according to the Shafi'is and Hanbalis, and the Hanafis take the whole sanctuary-free zone as his miqat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} For the Meccans and the people of the sanctuary the hajj miqat is their own place, so they enter ihram in Mecca (or at the mosque, according to the Hanafis and Hanbalis); the Malikis distinguish those who begin with hajj from those who begin with qiran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} The umra miqat for a man who is in Mecca is the lawful zone outside the sanctuary from any point; the majority prefer al-Ji'ranah and the Hanafis prefer al-Tan'im. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} Ihram forbids some things otherwise lawful, to remind the pilgrim of his rite and train him in simplicity; for men the core rule is that no stitched or fitted garment may cover the body, so shirts, turbans, trousers, hooded cloaks and socks are forbidden, as are garments touched by saffron or wars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} A man may not wear a qaba (a long coat) or similar, except by the Hanafi distinction; a man who has no waist-wrap may wear trousers with a sacrifice owed according to some schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} A man who has no sandals cuts the socks below the ankles and wears them, according to the majority; Ahmad and others differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} The Malikis and Hanbalis forbid the wearing of a sword without need, while the Hanafis and Shafi'is allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} Covering the head is forbidden to the man by agreement; the Hanafis and Hanbalis define covering by what is usually meant as a covering, the Malikis and Shafi'is by what counts as a covering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} Shade from something fixed to a base, such as a tent or a roofed car, is lawful by agreement; shade from something not fixed is lawful for the Hanafis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} A man may not cover his face, and a woman in ihram may not wear the niqab; the exception is need or fear of temptation. Gloves are forbidden to men by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} For women in ihram the majority forbid covering the face and hands with gloves, while the Hanafis allow covering the hands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} The prohibitions on the body concern anything that perfumes the body, removes its disorder or ends its untidiness: shaving the head, removing hair, cutting nails, oiling and scent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} Shaving the head is forbidden to the pilgrim and to whoever shaves him, and so is trimming; for shaving a lawful person the Hanafis forbid it, while the Shafi'is and Hanbalis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} Oil without scent is forbidden by the majority because it adds comfort; the Shafi'is limit it to the head and beard, and the Hanbalis allow it on the whole body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} Scent is forbidden by agreement with distinctions: the pilgrim may not use it on his waist-wrap, garments, bedding or sandals, nor drink or eat pure scent, and the ruling differs when scent is mixed into food. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1810} Smelling scent without touching it is disliked by the Hanafis, Malikis and Shafi'is with no penalty; the Hanbalis forbid it and require a sacrifice, as with musk and camphor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} Hunting is forbidden to the pilgrim by the Qur'an (al-Ma'ida, ayas 95-96), the sunna (the hadith of Abu Qatada) and consensus; for the Hanafis game is the wild land animal that resists capture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} The pilgrim may not kill game, harm it, assist in its hunting, order it killed, or take ownership of it by sale, gift or other means. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} He may not benefit from game, such as eating its meat or eggs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} There is disagreement on eating game caught by a lawful person: Ali, Ibn Umar and Ibn Abbas forbid it; the majority allow it if it was not caught for him; the Hanafis allow it unless he ordered or pointed to it, citing the hadith «land game is lawful to you as long as you do not hunt it or have it hunted for you». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1814} Recommended acts of ihram: the bath, perfume before entry according to the majority, two rak'as before entering, and the talbiya said often and aloud, ending for the hajj pilgrim at the throwing of the Jamra al-Aqaba and for the umra pilgrim at touching the Stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1823}. Ihram obliges completion; apostasy voids it and intercourse spoils it, requiring make-up. The lesser release comes by two of three acts (throwing, sacrifice, shaving or cutting); the greater release by the Ifada circling with shaving for the Hanafis and Malikis, and by all three acts for the Shafi'is and Hanbalis; the umra has a single release by shaving or cutting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1825}. Fasakh (a change of intention, disputed) lifts ihram, while rafd (abandonment) is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1826} Special rulings: a discerning child enters ihram by his own act for the Hanafis and Malikis; a guardian enters for a non-discerning child; the Hanafis alone allow entry for an unconscious person before ihram, and one who forgets the rite he entered must do both hajj and umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1829}. Chapter ten sets out the penalties: ransom, offering, alms and fasting, with the detailed penalties for comfort offences (clothing, perfume, shaving, nails and lice). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1834}. On game and intercourse: the pilgrim who kills game owes a penalty of like, food or fasting, with the schools differing on how the like is fixed; injury, milking, causing death, handling and eating game each have their own rules. Intercourse in ihram is a penalty offence: before standing it spoils the hajj, after standing and before the first release it spoils the hajj by the majority (the Hanafis dissent), after the first release it does not; the precursors and the qarin's position are set out in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1842}. On almsgiving, fasting and make-up: alms follow the kinds of the alms of the end of Ramadan; fasting for one unable to find an offering is three days in hajj and seven on return; the make-up is owed at once by the majority and in the following year by the Hanafis, entered from the miqat of the spoiled rite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1844}."
  es: "Ihram en el léxico significa proclamar la peregrinación o la umra y entrar en estado de santidad; en el uso de los juristas significa, cuando no está calificado, entrar en el hajj o la umra, y la palabra también se usa para entrar en la oración, como en «el takbir del ihram». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777} Para los hanafíes es entrar en ciertas prohibiciones, válidas solo con la intención junto con una mención de Dios o lo que lo representa; para los malikíes, shafi'ís y hanbalíes es la intención de entrar en las prohibiciones del hajj o la umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} Todos están de acuerdo en que es una de las obligaciones del rito. Difieren en si es un pilar o una condición: los malikíes, shafi'ís y hanbalíes lo consideran un pilar, mientras que los hanafíes lo consideran una condición en un sentido y un pilar en otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} Su validez requiere Islam e intención; los hanafíes añaden la talbiya o lo que la sustituye. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} La talbiya son las palabras «aquí estoy, oh Dios, aquí estoy», que la práctica del Profeta en la peregrinación de despedida estableció; Los shafi'ís y hanbalíes lo tratan como una sunna, mientras que los malikíes lo tratan como una obligación cuya omisión o demora prolongada después de la intención requiere un sacrificio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1782} Para los hanafíes, cualquier cosa que glorifique a Dios sustituye a la talbiya, al igual que adornar y conducir al animal de sacrificio con la intención de acompañarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} El ihram con un rito no especificado es válido por acuerdo; los shafi'ís y hanbalíes requieren que el rito se nombre antes de cualquier acto, mientras que los hanafíes y malikíes juzgan por el primer acto realizado (circunvalar la Casa o estar de pie en Arafat). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} Entrar en ihram copiando el ihram de otra persona es válido, y según la mayoría toma la forma del ihram de la otra persona. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} Una estipulación hecha al comienzo (que uno puede abandonar el estado si se lo impiden) es válida para los shafi'is y hanbalis y permite la liberación cuando se le impide, pero no es válida para los hanafis y malikíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} Los hanafíes tienen su propia regla para el mecano (uno en o dentro de la zona del miqat): para él el qiran es desaconsejable; si lo hace, es lícito pero debe un sacrificio compensatorio, mientras que para un hombre que viene de lejos que une el hajj a la umra antes de dar la vuelta para ella, la unión es qiran según la opinión mayoritaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} Los malikíes y los hanbalíes permiten unir el hajj a una umra ya iniciada, haciendo del peregrino un qarin; los shafi'íes lo prohíben una vez que ha comenzado la vuelta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1788} Agregar una umra a un hajj ya iniciado no es válido para los Malikis, Shafi'is y Hanbalis, por lo que no se obtienen resultados de qiran; A los Hanafis y Malikis no les gusta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} La entrada al ihram para dos hajjs o dos umras juntas tiene efecto con uno y la otra es nula, según la mayoría; Abu Hanifa sostiene que ambos entran en vigor y que uno debe recuperarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} Las formas de ihram son ifrad, qiran y tamattu', y cada escuela las define de manera diferente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} Sus obligaciones se reducen a dos: comenzar en el miqat y proteger el ihram contra los actos prohibidos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} Un miqat es, en el léxico, un tiempo o lugar determinado; en derecho, los lugares y tiempos establecidos para un rito determinado. Ihram tiene un miqat de tiempo y un miqat de lugar. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} Para el hajj, los tres imanes y Ahmad fijan el tiempo como Shawwal, Dhu al-Qa'da y los primeros diez días de Dhu al-Hijja; Para Malik, se extiende hasta el final de Dhu al-Hijja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} Los Hanafis y Hanbalis cuentan el día del sacrificio como uno de los meses del hajj; los Shafi'is cuentan solo su noche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} Los Hanafis, Malikis y Hanbalis permiten el ihram para el hajj antes de sus meses, con desagrado; los Shafi'is sostienen que no constituye un hajj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} El tiempo para la umra es todo el año; Se recomienda en Ramadán, y los Hanafi lo desaprueban el día de Arafa y los cuatro días posteriores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} Los lugares para los que vienen de lejos están acordados: Dhu al-Hulayfa para la gente de Medina, al-Juhfa para Siria y los que vienen por allí, y Qarn al-Manazil para la gente de Najd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} Para los de Yemen el miqat es Yalamlam, y para Irak y el resto del Este es Dhat Irq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} Los miqats están fijados por la sunna (los hadices de Ibn Abbas e Ibn Umar) y por consenso; se discute si Dhat Irq fue fijado por texto o por el juicio de Umar que coincidía con el texto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} Quien pase por un miqat deseando realizar cualquiera de los ritos debe entrar en ihram allí; retrasarlo más allá del miqat está prohibido por acuerdo, y lo mejor es comenzar en su extremo más alejado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} El lugar cuenta, no el nombre del pueblo; entrar en ihram en el miqat o en su alineación es suficiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} Para un viajero que pasa por dos miqats, los shafi'is y hanbalis requieren ihram en el más lejano, los malikíes permiten el más cercano, y los hanafíes permiten cualquiera y desaprueban la demora. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} Entrar en ihram antes del miqat del lugar es lícito por acuerdo; los malikíes, shafi'is y hanbalis lo desaprueban, mientras que los hanafíes lo consideran mejor cuando el peregrino está a salvo de quebrantar sus reglas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} Quien pase el miqat sin ihram con la intención de realizar un rito es pecador, debe regresar y entrar en ihram allí, y debe un sacrificio si no regresa, a menos que tenga una excusa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} El residente de la zona del miqat entra desde su propio lugar según los malikíes, desde su aldea o campamento según los shafi'íes y hanbalíes, y los hanafíes toman toda la zona libre del santuario como su miqat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} Para los mecanos y la gente del santuario, el miqat del hajj es su propio lugar, por lo que entran en ihram en La Meca (o en la mezquita, según los hanafíes y los hanbalíes); los malikíes distinguen a los que comienzan con el hajj de los que comienzan con el qiran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} El miqat de la umra para un hombre que está en La Meca es la zona lícita fuera del santuario desde cualquier punto; la mayoría prefiere al-Ji'ranah y los hanafíes prefieren al-Tan'im. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} El ihram prohíbe algunas cosas que de otro modo serían lícitas, para recordarle al peregrino su rito y entrenarlo en la sencillez; para los hombres la regla fundamental es que ninguna prenda cosida o ajustada puede cubrir el cuerpo, por lo que las camisas, los turbantes, los pantalones, las capas con capucha y los calcetines están prohibidos, al igual que las prendas tocadas por el azafrán o las wars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} Un hombre no puede usar un qaba (un abrigo largo) o similar, excepto por la distinción Hanafi; un hombre que no tiene un chal puede usar pantalones con un sacrificio debido según algunas escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} Un hombre que no tiene sandalias corta los calcetines por debajo de los tobillos y los usa, según la mayoría; Ahmad y otros difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} Los malikíes y hanbalíes prohíben el uso de una espada sin necesidad, mientras que los hanafíes y shafiíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} Cubrirse la cabeza está prohibido para el hombre por acuerdo; los hanafíes y hanbalíes definen cubrirse por lo que generalmente se entiende como una cobertura, los malikíes y shafiíes por lo que cuenta como una cobertura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} La sombra de algo fijo a una base, como una tienda de campaña o un coche con techo, es lícita por acuerdo; la sombra de algo no fijo es lícita para los hanafíes y shafi'ís. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} Un hombre no puede cubrirse el rostro, y una mujer en ihram no puede usar el niqab; la excepción es la necesidad o el temor a la tentación. Los guantes están prohibidos para los hombres por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} Para las mujeres en ihram, la mayoría prohíbe cubrirse la cara y las manos con guantes, mientras que los hanafíes permiten cubrirse las manos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} Las prohibiciones sobre el cuerpo se refieren a todo lo que perfuma el cuerpo, elimina su desorden o termina con su desorden: afeitarse la cabeza, quitarse el cabello, cortarse las uñas, engrasarse y perfumarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} Afeitarse la cabeza está prohibido para el peregrino y para quien lo afeite, y también lo está recortarse; para afeitar a una persona lícita, los hanafíes lo prohíben, mientras que los shafi'íes y los hanbalíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} El aceite sin perfume está prohibido por la mayoría porque añade comodidad; los shafi'ís lo limitan a la cabeza y la barba, y los hanbalíes lo permiten en todo el cuerpo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} El perfume está prohibido por acuerdo con distinciones: el peregrino no puede usarlo en su faja, vestimentas, ropa de cama o sandalias, ni beber o comer perfume puro, y la norma difiere cuando el perfume se mezcla con la comida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1810} Oler un aroma sin tocarlo es desaconsejado por los Hanafi, Maliki y Shafi'i sin castigo alguno; los Hanbali lo prohíben y exigen un sacrificio, como con el almizcle y el alcanfor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} La caza está prohibida para el peregrino por el Corán (al-Ma'ida, ayas 95-96), la sunna (el hadiz de Abu Qatada) y el consenso; para los Hanafi, la caza es el animal terrestre salvaje que se resiste a ser capturado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} El peregrino no puede matar animales de caza, dañarlos, ayudar en su caza, ordenar que se maten, ni tomar posesión de ellos mediante venta, donación u otros medios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} No puede beneficiarse de los animales de caza, como comer su carne o huevos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} Hay desacuerdo sobre comer animales de caza capturados por una persona lícita: Ali, Ibn Umar e Ibn Abbas lo prohíben; la mayoría lo permite si no fue capturado para él; Los hanafíes lo permiten a menos que él lo ordene o lo señale, citando el hadiz «la caza terrestre es lícita para ti siempre que no la caces ni la hagas cazar por ti». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1814} Actos recomendados de ihram: el baño, perfume antes de entrar según la mayoría, dos rak'as antes de entrar y la talbiya dicha a menudo y en voz alta, terminando para el peregrino del hajj al lanzar la Jamra al-Aqaba y para el peregrino de la umra al tocar la Piedra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1823}. El ihram obliga a su finalización; la apostasía lo anula y el coito lo estropea, requiriendo su reparación. La liberación menor se obtiene mediante dos de tres actos (lanzamiento, sacrificio, afeitado o corte); la liberación mayor mediante el Ifada circling con afeitado para los Hanafi y Maliki, y mediante los tres actos para los Shafi'i y Hanbali; la umra tiene una única liberación mediante afeitado o corte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1825}. Fasakh (un cambio de intención, disputado) levanta el ihram, mientras que rafd (abandono) es nulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1826} Reglas especiales: un niño discernidor entra en ihram por su propio acto para los Hanafis y Malikis; un tutor entra por un niño no discernidor; solo los Hanafis permiten la entrada para una persona inconsciente antes del ihram, y uno que olvida el rito en el que entró debe hacer tanto el hajj como la umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1829}. El capítulo diez establece las penas: rescate, ofrenda, limosna y ayuno, con las penas detalladas para los delitos de comodidad (ropa, perfume, afeitado, uñas y piojos). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1834}. Sobre la caza y el coito: el peregrino que mata caza debe una pena de like, comida o ayuno, y las escuelas difieren en cómo se fija el like; las lesiones, el ordeño, causar la muerte, manipular y comer caza tienen cada uno sus propias reglas. Las relaciones sexuales en estado de ihram son una falta punible: antes de ponerse de pie invalidan el hajj, después de ponerse de pie y antes de la primera liberación invalidan el hajj según la mayoría (la disidencia de los hanafíes), después de la primera liberación no lo invalidan; los precedentes y la posición del qarin se exponen en detalle. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1835} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1836} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1837} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1838} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1839} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1840} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1841} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1842}. Sobre la limosna, el ayuno y la compensación: la limosna sigue las mismas normas que la limosna del final del Ramadán; el ayuno para quien no pueda encontrar una ofrenda es de tres días en el Hajj y de siete al regresar; la compensación la deben pagar de inmediato la mayoría y al año siguiente los Hanafi, a partir del miqat del rito perdido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1844}."
  fr: "Dans le lexique, l'ihram signifie proclamer le pèlerinage (ou umra) et entrer en état de sacralité. Chez les juristes, il désigne, sans autre précision, l'entrée en pèlerinage (hajj ou umra), et le terme est également employé pour l'entrée en prière, comme dans l'expression « le takbir de l'ihram ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777} Pour les hanafites, l'ihram consiste à enfreindre certaines interdictions, ce qui n'est valable qu'avec l'intention d'accomplir le hajj ou la umra, accompagnée d'une invocation de Dieu ou de son substitut. Pour les malikites, les chaféites et les hanbalites, il s'agit de l'intention d'accomplir les interdictions du hajj ou de la umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} Tous s'accordent à dire qu'il s'agit d'une obligation du rite. Les avis divergent quant à savoir s'il s'agit d'un pilier ou d'une condition: les Malikites, les Shafi'ites et les Hanbalites le considèrent comme un pilier, tandis que les Hanafites le considèrent comme une condition à certains égards et comme un pilier à d'autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} Sa validité requiert l'islam et l'intention; les Hanafites ajoutent la talbiya ou ce qui la remplace. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} La talbiya est la formule « Me voici, ô Dieu, me voici », établie par la pratique du Prophète lors du pèlerinage d'adieu. Les chaféites et les hanbalites considèrent le sacrifice comme une sunna, tandis que les malikites le considèrent comme une obligation dont l'omission ou le retard important après l'intention requiert un sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1782} Pour les hanafites, tout acte glorifiant Dieu remplace la talbiya, de même que le fait de parer de guirlandes et de conduire l'animal sacrificiel avec l'intention de l'accompagner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} L'ihram avec un rite non spécifié est valide par consensus; les chaféites et les hanbalites exigent que le rite soit mentionné avant tout acte, tandis que les hanafites et les malikites jugent d'après le premier acte accompli (faire le tour de la Kaaba ou se tenir à Arafat). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} Entrer en état d'ihram en copiant celui d'autrui est valide, et selon l'avis majoritaire, il prend la forme de l'ihram de cette personne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} Une stipulation faite au début (autorisant la sortie de l'état d'ihram en cas d'empêchement) est valide pour les écoles chaféite et hanbalite et permet la levée de l'ihram en cas d'empêchement, mais elle n'est pas valide pour les écoles hanafite et malikite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} Les Hanafites ont leur propre règle pour le Mecquois (celui qui se trouve dans la zone du miqat ou à l'intérieur): pour lui, le qiran est déconseillé; s'il le pratique, il est licite, mais il doit accomplir un sacrifice compensatoire. Quant à celui qui vient de loin et qui combine le hajj avec la umra avant d'avoir effectué le tour du temple, cette jonction est considérée comme du qiran par l'avis majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} Les Malikites et les Hanbalites autorisent la jonction du hajj avec une umra déjà commencée, faisant du pèlerin un qarin; les Chafi'ites l'interdisent une fois le tour du temple commencé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1788} L'ajout d'une umra à un hajj déjà commencé n'est pas valable pour les Malikis, Shafi'is et Hanbalis, donc aucun résultat de qiran; les Hanafis et les Malikis n'aiment pas ça. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} L'entrée en ihram pour deux hajjs ou deux umras ensemble prend effet avec l'un et l'autre est nulle, selon la majorité; Abu Hanifa considère que les deux prennent effet et qu'il faut en rattraper un. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} Les formes de l'ihram sont l'ifrad, le qiran et le tamattu', et chaque école les définit différemment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} Ses obligations se résument à deux: commencer au miqat et protéger l'ihram contre les actes interdits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} Un miqat est, dans le lexique, une heure ou un lieu défini; en droit, les lieux et horaires fixés pour un rite spécifique. Ihram a un temps miqat et un lieu miqat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} Pour le hajj, les trois imams et Ahmad fixent l'heure comme Shawwal, Dhu al-Qa'da et les dix premiers jours de Dhu al-Hijja; Pour Malik, le pèlerinage s'étend jusqu'à la fin du mois de Dhu al-Hijja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} Les Hanafites et les Hanbalites comptent le jour du sacrifice comme l'un des mois du hajj; les Shafi'ites ne comptent que sa nuit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} Les Hanafites, les Malikites et les Hanbalites autorisent l'ihram pour le hajj avant ses mois, avec réticence; les Shafi'ites considèrent que cela ne constitue pas un hajj valide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} Le temps pour la umra est toute l'année; Le pèlerinage est recommandé pendant le Ramadan, mais les hanafites le déconseillent le jour d'Arafat et les quatre jours suivants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} Les lieux de pèlerinage pour ceux venant de loin font consensus: Dhu al-Hulayfa pour les habitants de Médine, al-Juhfa pour la Syrie et ceux qui y transitent, et Qarn al-Manazil pour les habitants du Najd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} Pour les Yéménites, le miqat est Yalamlam, et pour l'Irak et le reste de l'Orient, il est Dhat Irq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} Les miqats sont fixés par la sunna (les hadiths d'Ibn Abbas et d'Ibn Umar) et par consensus; la question de savoir si le Dhat Irq a été fixé par un texte ou par l'appréciation d'Umar conforme au texte est controversée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} Quiconque franchit un miqat pour accomplir l'un ou l'autre rite doit y entrer en état d'ihram; il est interdit, par consensus, de le retarder au-delà du miqat, et il est préférable de commencer à son extrémité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} C'est le lieu qui compte, non le nom du village; entrer en état d'ihram au miqat ou à son alignement suffit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} Pour un voyageur franchissant deux miqats, les écoles chaféite et hanbalite exigent l'ihram au miqat le plus éloigné, les écoles malikite autorisent celui du plus proche, et les écoles hanafite autorisent les deux et déconseillent tout retard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} Entrer en état d'ihram avant le miqat est licite par consensus; les écoles malikite, chaféite et hanbalite le déconseillent, tandis que les écoles hanafite le considèrent préférable lorsque le pèlerin est à l'abri de toute infraction aux règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} Quiconque franchit le miqat sans ihram dans l'intention d'accomplir un rite commet un péché, doit revenir et y entrer en état d'ihram, et doit un sacrifice s'il ne revient pas, à moins d'avoir une excuse valable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} Selon l'école malikite, l'habitant de la zone du miqat y entre depuis son domicile; selon les écoles chaféite et hanbalite, depuis son village ou son campement; et selon l'école hanafite, toute la zone non sacrée est considérée comme son miqat. Pour les Mecquois et les fidèles du sanctuaire, le miqat du hajj est leur propre lieu d'entrée; ils entrent donc en état d'ihram à La Mecque (ou à la mosquée, selon les écoles hanafite et hanbalite). Les malikites font la distinction entre ceux qui commencent par le hajj et ceux qui commencent par le qiran. Le miqat de la umra pour un homme se trouvant à La Mecque est la zone licite située à l'extérieur du sanctuaire, quel que soit le point d'entrée; la majorité privilégie al-Ji'ranah et les hanafites al-Tan'im. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} L'ihram interdit certaines choses par ailleurs licites, afin de rappeler au pèlerin son rite et de l'instruire dans la simplicité; pour les hommes, la règle fondamentale est qu'aucun vêtement cousu ou ajusté ne doit couvrir le corps, de sorte que les chemises, les turbans, les pantalons, les manteaux à capuche et les chaussettes sont interdits, de même que les vêtements touchés par le safran ou les algues. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} Un homme ne peut porter de qaba (long manteau) ou similaire, sauf selon la distinction hanafite; un homme qui n'a pas de ceinture peut porter un pantalon moyennant un sacrifice selon certaines écoles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} Selon la majorité, un homme qui n'a pas de sandales coupe ses chaussettes sous les chevilles et les porte; Ahmad et d'autres sont d'un avis différent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} Les Malikites et les Hanbalites interdisent le port d'une épée sans nécessité, tandis que les Hanafites et les Chafi'ites l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} Il est interdit à l'homme de se couvrir la tête; les Hanafites et les Hanbalites définissent le fait de se couvrir selon l'usage courant, les Malikites et les Chafi'ites selon ce qui est considéré comme tel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} L'ombre d'un objet fixé à une base, comme une tente ou une voiture couverte, est licite par consensus; l'ombre d'un objet non fixé est licite pour les hanafites et les chaféites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} Un homme ne doit pas se couvrir le visage, et une femme en état d'ihram ne doit pas porter le niqab; l'exception est la nécessité ou la crainte de la tentation. Le port de gants est interdit aux hommes par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} Pour les femmes en état d'ihram, la majorité interdit de se couvrir le visage et les mains de gants, tandis que les hanafites autorisent de se couvrir les mains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} Les interdictions concernant le corps portent sur tout ce qui parfume le corps, en corrige les déséquilibres ou met fin à la négligence: se raser la tête, s'épiler, se couper les ongles, s'enduire d'huile et utiliser du parfum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} Il est interdit au pèlerin et à celui qui le rase de se tailler la tête; pour une personne licite, le rasage est interdit par les hanafites, tandis que les chaféites et les hanbalites l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} L'huile sans parfum est interdite par la majorité car elle procure du confort; les chaféites la limitent à la tête et à la barbe, tandis que les hanbalites l'autorisent sur tout le corps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} L'usage du parfum est interdit par consensus, avec des distinctions: le pèlerin ne peut en utiliser sur sa ceinture, ses vêtements, sa literie ou ses sandales, ni boire ou manger de produits parfumés purs; la règle diffère également lorsque le parfum est mélangé à des aliments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1810} Sentir un parfum sans le toucher est mal vu par les hanafites, les malikites et les chaféites, sans sanction; les hanbalites l’interdisent et exigent un sacrifice, comme pour le musc et le camphre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} La chasse est interdite au pèlerin selon le Coran (al-Ma’ida, versets 95-96), la sunna (hadith d’Abu Qatada) et le consensus; pour les hanafites, le gibier est l’animal sauvage terrestre qui résiste à la capture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} Le pèlerin ne peut ni tuer de gibier, ni lui faire du mal, ni participer à sa chasse, ni ordonner qu'il soit tué, ni s'en approprier par vente, don ou tout autre moyen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} Il ne peut tirer profit du gibier, notamment en consommant sa viande ou ses œufs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} Il existe une divergence d'opinions quant à la consommation de gibier chassé par une personne licite: Ali, Ibn Umar et Ibn Abbas l'interdisent; la majorité l'autorise si le gibier n'a pas été chassé pour son compte. Les hanafites l'autorisent, sauf s'il l'a ordonné ou désigné, citant le hadith « le gibier terrestre vous est licite tant que vous ne le chassez pas vous-même ou que vous ne le faites pas chasser pour vous ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1814} Actes d'ihram recommandés: le bain rituel, le parfum avant l'entrée (selon la majorité), deux rak'as avant l'entrée et la talbiya récitée plusieurs fois à haute voix, se terminant pour le pèlerin du hajj au moment du jet de la Jamra al-Aqaba et pour le pèlerin de l'umra au moment où il touche la Pierre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1821} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1823}. L'ihram impose son accomplissement; l'apostasie l'annule et les rapports sexuels le rendent caduc, nécessitant une régularisation. La levée mineure s'effectue par deux des trois actes suivants: le jet de pierres tombales, le sacrifice, le rasage ou l'incision. La levée majeure s'effectue par le tour de l'Ifada, accompagné du rasage, pour les hanafites et les malikites, et par les trois actes pour les chaféites et les hanbalites. La umra s'effectue par un seul acte: le rasage ou l'incision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1825}. Le fasakh (changement d'intention, sujet à controverse) lève l'ihram, tandis que le rafd (abandon) l'annule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1826} Règles particulières: selon les écoles hanafite et malikite, un enfant capable de discernement entre en ihram de son propre chef; un tuteur y entre pour un enfant incapable de discernement; seule l'école hanafite autorise l'entrée d'une personne inconsciente avant l'ihram; et celui qui oublie le rite auquel il a participé doit accomplir à la fois le hajj et la umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1829}. Le chapitre dix énonce les peines: rançon, offrande, aumône et jeûne, avec les peines détaillées pour les infractions liées au confort (vêtements, parfum, rasage, ongles et poux). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1834}. Concernant le gibier et les relations avec lui: le pèlerin qui tue du gibier doit s’acquitter d’une peine de nature, de nourriture ou de jeûne, les écoles divergeant quant à la manière dont cette peine est fixée; les blessures, la traite, le fait de causer la mort, la manipulation et la consommation de gibier font chacune l’objet de règles spécifiques. Les rapports sexuels en état d'ihram constituent une infraction passible d'une peine: avant de se lever, ils invalident le hajj; après s'être levé et avant la première libération, ils invalident le hajj selon la majorité (les hanafites sont en désaccord); après la première libération, ils ne l'invalident pas; les précurseurs et la position du qarin sont exposés en détail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1842}. Concernant l'aumône, le jeûne et le rattrapage: les aumônes suivent les mêmes règles que celles de fin de Ramadan; le jeûne pour celui qui n'a pas pu trouver d'offrande est de trois jours pendant le hajj et de sept jours au retour; le rattrapage est dû immédiatement par la majorité et l'année suivante par les Hanafites, selon le miqat du rite aboli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1844}."
  ur: "لغت میں احرام کا مطلب ہے حج یا عمرہ کا اعلان کرنا اور حرمت کی حالت میں داخل ہونا۔ فقہا کے استعمال میں اس کے معنی ہیں نا اہل ہونے پر، حج یا عمرہ میں داخل ہونا، اور یہ لفظ نماز میں داخل ہونے کے لیے بھی استعمال ہوتا ہے، جیسا کہ «احرام کی تکبیر» میں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1777} احناف کے نزدیک یہ بعض ممنوعات میں داخل ہے، جو صرف نیت کے ساتھ ساتھ خدا کا ذکر یا اس کے لیے کیا ہے؛ مالکیوں، شافعیوں اور حنبلیوں کے نزدیک حج یا عمرہ کی ممانعت میں داخل ہونا مقصود ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1778} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1779} سب اس بات پر متفق ہیں کہ یہ عبادات میں سے ہے۔ ان کا اختلاف ہے کہ آیا یہ ستون ہے یا شرط: مالکیہ، شافعی اور حنبلی اسے ستون شمار کرتے ہیں، جبکہ احناف اسے ایک لحاظ سے شرط اور دوسرے میں ستون شمار کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1778} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1779} اس کے جواز کے لیے اسلام اور نیت کی ضرورت ہے۔ احناف تلبیہ کا اضافہ کرتے ہیں یا اس میں کیا ہے؟ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1779} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1781} تلبیہ یہ الفاظ ہیں \"میں حاضر ہوں، اے خدا، میں حاضر ہوں\"، جس پر نبی کریم نے حج کے الوداعی عمل کا حکم دیا۔ شافعی اور حنبلی اسے سنت سمجھتے ہیں، جبکہ مالکیہ اسے ایک فرض سمجھتے ہیں جس کے ترک کرنے یا نیت کے بعد دیر تک قربانی کی ضرورت ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ1781} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1782} احناف کے نزدیک ہر وہ چیز جو خدا کی تسبیح کرتی ہے تلبیہ کے لیے کھڑی ہوتی ہے، جیسا کہ مالا چڑھانا اور قربانی کے ساتھ جانور چلانا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1783} غیر متعینہ رسم کے ساتھ احرام معاہدہ سے درست ہے۔ شافعی اور حنبلی کے نزدیک کسی بھی عمل سے پہلے رسم کا نام لینا ضروری ہے، جب کہ حنفیہ اور مالکی پہلے عمل سے فیصلہ کرتے ہیں ⁦(گھر کا چکر لگانا یا عرفات میں کھڑے ہونا)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص1783} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص1784} دوسرے کا احرام نقل کر کے احرام باندھنا صحیح ہے اور جمہور کے نزدیک دوسرے کے احرام کی شکل اختیار کر لیتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص1784} {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1785} شروع میں ایک شرط ⁦(کہ اگر روکا جائے تو وہ ریاست چھوڑ سکتا ہے)⁩ شافعیوں اور حنبلیوں کے لیے جائز ہے لیکن حنبل کے لیے جائز ہے اور جب اس کی اجازت نہیں ہے تو حنبلی کے لیے جائز ہے۔ مالکیوں {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 1785} مکہ کے لیے احناف کا اپنا قاعدہ ہے ⁦(میقات کے علاقے میں یا اس کے اندر)⁩: اس کے لیے قرن ناپسند ہے؛ اگر وہ ایسا کرے تو حلال ہے لیکن اس پر قضاء قربانی واجب ہے، جب کہ دور سے آنے والے آدمی کے لیے جو طواف کرنے سے پہلے حج کے لیے عمرہ میں شامل ہو جائے تو جمہور کے نزدیک یہ قرأت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1786} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1787} مالکی اور حنبلی عمرہ میں شامل ہونے کی اجازت دیتے ہیں جو پہلے سے شروع ہو چکا ہے، حاجی کو قارین بناتا ہے۔ شافعی اس سے منع کرتے ہیں کہ ایک بار چکر لگانا شروع ہو جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1787} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1788} پہلے سے شروع ہوچکے ہوئے حج میں عمرہ کا اضافہ کرنا مالکیوں، شافعیوں اور حنبلیوں کے نزدیک درست نہیں ہے، لہٰذا کوئی نتیجہ نہیں نکلتا۔ احناف اور مالکیہ اسے ناپسند کرتے ہیں۔ دو حج یا دو عمروں کا ایک ساتھ احرام باندھنا جمہور کے نزدیک ایک کا اثر ہے اور دوسرا باطل ہے۔ ابوحنیفہ نے دونوں کو نافذ کیا اور ایک کی قضاء لازم ہے۔ احرام کی شکلیں افراد،قران اور تمتع ہیں اور ہر مکتب ان کی مختلف تعریف کرتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1790} اس کے فرائض دو پر آتے ہیں: میقات سے شروع، اور ممنوعہ کاموں سے احرام کی حفاظت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1790} لغت میں میقات ایک مقررہ وقت یا جگہ ہے۔ قانون میں، ایک مخصوص رسم کے لیے مقرر مقامات اور اوقات۔ احرام کا ایک وقت میقات ہے اور جگہ میقات۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص1790} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1791} حج کے لیے تینوں ائمہ اور احمد نے شوال، ذوالقعدہ اور ذی الحجہ کے پہلے دس دن کا وقت مقرر کیا ہے۔ مالک کے نزدیک یہ ذی الحجہ کے آخر تک چلتا ہے۔ حنفیہ اور حنبلی قربانی کے دن کو حج کے مہینوں میں شمار کرتے ہیں۔ شافعی صرف اس کی رات کو شمار کرتے ہیں۔ حنفیہ، مالکیہ اور حنبلی حج کے لیے اس کے مہینوں سے پہلے احرام باندھنے کی اجازت دیتے ہیں۔ شافعیوں کے نزدیک اس سے حج نہیں ہوتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1792} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1793} عمرہ کا وقت پورا سال ہے۔ رمضان المبارک میں مستحب ہے، اور احناف اسے عرفہ کے دن اور اس کے بعد کے چار دن ناپسند کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1793} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1794} دور سے آنے والوں کے لیے مقامات متفق ہیں: ذوالحلیفہ اہل مدینہ کے لیے، الجوفہ، شام اور قازان کے لوگوں کے لیے۔ نجد۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1794} یمن والوں کے لیے میقات یلملم ہے، اور عراق اور باقی مشرق کے لیے یہ التعرک ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص1795} میقات سنت ⁦(ابن عباس اور ابن عمر کی احادیث)⁩ اور اجماع سے طے شدہ ہیں۔ آیا دشت عرق کو متن کے ذریعہ طے کیا گیا تھا یا عمر کے فیصلے سے جو متن سے میل کھاتا تھا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1795} جو شخص میقات سے گزرے اس میں دونوں میں سے کسی ایک کا احرام باندھنا ضروری ہے۔ میقات سے گزرنے میں تاخیر کرنا معاہدہ کی رو سے حرام ہے، اور اس کے دور کنارے سے شروع کرنا افضل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1796} جگہ شمار ہوتی ہے، گاؤں کا نام نہیں۔ میقات پر یا اس کی سیدھ میں احرام باندھنا کافی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1796} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص1797} دو میقات سے گزرنے والے مسافر کے لیے شافعیہ اور حنبلی احرام کو دور سے احرام باندھتے ہیں، مالکی اس کی اجازت دیتے ہیں اور حنبلی نزدیکی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1797} میقات سے پہلے احرام باندھنا اتفاق سے حلال ہے۔ مالکیہ، شافعی اور حنبلی اسے ناپسند کرتے ہیں، جبکہ احناف اس کو بہتر سمجھتے ہیں جب حاجی اس کے احکام کی خلاف ورزی سے محفوظ ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص1797} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص1798} جو شخص بغیر احرام کے میقات سے گزرے وہ گنہگار ہے، اسے چاہیے کہ واپس لوٹ کر احرام باندھے، اور اگر قربانی نہ ہو تو قربانی نہ کرے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1798} میقات زون کا رہنے والا مالکیوں کے نزدیک اپنی جگہ سے، شافعیوں اور حنبلیوں کے نزدیک اپنے گاؤں یا پڑاؤ سے داخل ہوتا ہے اور احناف پورے حرم سے پاک علاقے کو اپنی میقات کے طور پر لیتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1798} مکہ والوں اور اہل حرم کے لیے حج کا میقات ان کی اپنی جگہ ہے، اس لیے وہ مکہ میں ⁦(یا احناف اور حنبلیوں کے نزدیک مسجد میں)⁩ احرام باندھتے ہیں۔ مالکی حج سے شروع ہونے والوں کو قرآن سے شروع کرنے والوں سے ممتاز کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1799} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1800} مکہ میں رہنے والے کے لیے عمرہ میقات حرم سے باہر کسی بھی مقام سے حلال ہے؛ جمہور الجیرانۃ کو ترجیح دیتے ہیں اور احناف التنم کو ترجیح دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1800} احرام کچھ چیزوں کو حرام قرار دیتا ہے جو دوسری صورت میں حلال ہے، حاجی کو اس کی رسم یاد دلانے اور اسے سادگی کی تربیت دینے کے لیے؛ مردوں کے لیے بنیادی قاعدہ یہ ہے کہ کوئی سلی یا فٹ شدہ لباس جسم کو ڈھانپ نہیں سکتا، لہٰذا قمیض، پگڑی، پتلون، ڈھیلے چادریں اور موزے حرام ہیں، جیسا کہ زعفران یا جنگوں سے چھونے والے کپڑوں پر پابندی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1800} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1801} حنفی امتیاز کے علاوہ کوئی شخص قبا ⁦(لمبا کوٹ)⁩ یا اس سے ملتا جلتا نہیں پہن سکتا۔ ایک آدمی جس کی کمر پر لپیٹ نہیں ہے وہ کچھ مکاتب کے مطابق قربانی کے ساتھ پتلون پہن سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1801} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1802} ایک آدمی جس کے پاس سینڈل نہیں ہے وہ ٹخنوں سے نیچے موزے کاٹتا ہے اور جمہور کے مطابق پہنتا ہے۔ احمد وغیرہ کا اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1802} مالکیہ اور حنبلی بلا ضرورت تلوار پہننے سے منع کرتے ہیں جبکہ حنفیہ اور شافعی اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1803} مرد کے لیے سر ڈھانپنا معاہدہ کے مطابق حرام ہے۔ احناف اور حنبلی نے اوڑھنے کی تعریف اس سے کی ہے جس سے عام طور پر پردہ مراد ہے، مالکیہ اور شافعی اس بات سے کہتے ہیں جس کو اوڑھنا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1803} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1804} کسی ٹھوس چیز سے سایہ، جیسے خیمہ یا چھت والی گاڑی، معاہدے سے حلال ہے۔ حنفیہ اور شافعیہ کے لیے مقررہ چیز کا سایہ حلال ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1804} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1805} مرد اپنا چہرہ نہیں ڈھانپ سکتا، اور احرام والی عورت نقاب نہیں پہن سکتی۔ استثناء ضرورت ہے یا آزمائش کا خوف۔ معاہدے کے مطابق دستانے مردوں کے لیے حرام ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1805} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1806} احرام والی عورتوں کے لیے جمہور نے چہرے اور ہاتھوں کو دستانے سے ڈھانپنے سے منع کیا ہے، جب کہ احناف ہاتھوں کو ڈھانپنے کی اجازت دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1806} جسم کی ممانعتیں ہر اس چیز سے متعلق ہیں جو جسم کو خوشبو دیتی ہے، اس کی خرابی کو دور کرتی ہے یا اس کی بے حیائی کو ختم کرتی ہے: سر منڈوانا، بال اکھاڑنا، ناخن کاٹنا، تیل لگانا اور خوشبو لگانا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص1807} سر منڈوانا حاجی اور منڈوانے والے کے لیے حرام ہے اور اسی طرح تراشنا بھی حرام ہے۔ حلال شخص کو مونڈنے سے احناف منع کرتے ہیں جبکہ شافعی اور حنبلی اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1807} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1808} خوشبو کے بغیر تیل جمہور کے نزدیک حرام ہے کیونکہ اس سے سکون ملتا ہے۔ شافعی اسے سر اور داڑھی تک محدود کرتے ہیں اور حنبلی پورے جسم پر اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1808} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1809} امتیازات کے ساتھ خوشبو حرام ہے: حاجی اسے اپنی کمر پر لپیٹنے، کپڑوں یا سینڈل وغیرہ پر استعمال نہیں کر سکتا، نہ پی سکتا ہے۔ جب کھانے میں خوشبو مل جاتی ہے تو حکم مختلف ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1809} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1810} اسے چھوئے بغیر خوشبو سونگھنا احناف، مالکیہ اور شافعیہ کے نزدیک ناپسندیدہ ہے جس کی کوئی سزا نہیں ہے۔ حنبلی اس سے منع کرتے ہیں اور قربانی کا تقاضا کرتے ہیں، جیسا کہ کستوری اور کافور کی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1811} قرآن ⁦(المائدہ، آیت 95-96)⁩، سنت ⁦(ابو قتادہ کی حدیث)⁩ اور اجماع کے ذریعہ شکار کو حرام قرار دیا گیا ہے۔ حنفیوں کا کھیل جنگلی زمینی جانور ہے جو پکڑنے کی مزاحمت کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1811} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1812} حاجی کھیل کو نہیں مار سکتا، اسے نقصان نہیں پہنچا سکتا، اس کے شکار میں مدد نہیں کر سکتا، اسے مارنے کا حکم نہیں دے سکتا، یا فروخت، تحفہ یا دوسرے طریقوں سے اس کی ملکیت نہیں لے سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1812} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1813} اسے کھیل سے فائدہ نہیں ہو سکتا، جیسے کہ اس کا گوشت یا انڈے۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص1813} حلال کے پکڑے ہوئے کھیل کھانے میں اختلاف ہے: علی، ابن عمر اور ابن عباس نے اسے حرام قرار دیا ہے۔ اکثریت اس کی اجازت دیتی ہے اگر یہ اس کے لیے نہیں پکڑا گیا تھا۔ احناف اس کی اجازت دیتے ہیں جب تک کہ وہ اس کا حکم نہ دے یا اس کی طرف اشارہ نہ کرے، حدیث کا حوالہ دیتے ہوئے کہ \"زمین کا کھیل تمہارے لیے حلال ہے جب تک کہ تم اس کا شکار نہ کرو یا اسے تمہارے لیے شکار نہ کرو\"۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1813} {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص1814} احرام کے مستحب اعمال: غسل، جمہور کے مطابق داخل ہونے سے پہلے خوشبو، دو رکعتیں اور کثرت سے ہذیبی کہنے سے پہلے، جمرہ عقبہ کو پھینکنے پر حاجی اور حجر اسود کو چھونے پر عمرہ کرنے والے کے لئے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1820} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص1821} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1822} صفحہ 1823}۔ احرام کی تکمیل؛ ارتداد اسے باطل کر دیتا ہے اور جماع اس کو خراب کر دیتا ہے، میک اپ کی ضرورت ہوتی ہے۔ کم رہائی تین میں سے دو کاموں سے آتی ہے ⁦(پھینکنا، قربانی کرنا، مونڈنا یا کاٹنا)⁩؛ احناف اور مالکیوں کے لیے منڈوانے کے ساتھ، اور شافعیوں اور حنبلیوں کے لیے تینوں اعمال کے ذریعے افادہ کی طرف سے زیادہ رہائی؛ عمرہ کو مونڈنے یا کاٹنے سے ایک ہی اخراج ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1823} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1824} {حوالہ: فقہ الموسوع-کویتیہ-نور-v3 صفحہ 1825}۔ فسخ ⁦(نیت کی تبدیلی، اختلافی)⁩ احرام اٹھاتا ہے، جبکہ رفع ⁦(ترک)⁩ باطل ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1826} خصوصی احکام: ایک سمجھدار بچہ احناف اور مالکیہ کے لیے اپنے عمل سے احرام باندھتا ہے۔ ایک سرپرست غیر سمجھدار بچے کے لیے داخل ہوتا ہے۔ احناف ہی احرام سے پہلے بے ہوش آدمی کو داخلے کی اجازت دیتے ہیں، اور جو شخص اپنے داخل کردہ رسم کو بھول جائے تو اس پر حج اور عمرہ دونوں واجب ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1827} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1828} دسویں باب میں سزاؤں کا تعین کیا گیا ہے: فدیہ، نذرانہ، خیرات اور روزہ، آرام کے جرائم ⁦(کپڑے، خوشبو، مونڈنا، ناخن اور جوئیں)⁩ کے لیے تفصیلی سزاؤں کے ساتھ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1830} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1831} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1832} صفحہ 1833} {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1834}۔ کھیل اور جماع کے بارے میں: جو حجاج کھیل کو مارتا ہے اس پر پسند، کھانا یا روزہ کا جرمانہ عائد ہوتا ہے، اس طرح کے تعین کے بارے میں اسکولوں میں اختلاف ہے۔ چوٹ، دودھ پینا، موت کا سبب بننا، سنبھالنا اور کھانے کا کھیل ہر ایک کے اپنے اپنے اصول ہیں۔ احرام میں جماع کرنا جرمانہ جرم ہے: کھڑے ہونے سے پہلے حج کو خراب کر دیتا ہے، کھڑے ہونے کے بعد اور پہلے چھوڑنے سے پہلے جمہور کے نزدیک حج کو خراب کر دیتا ہے ⁦(احناف کا اختلاف)⁩، پہلی چھوڑنے کے بعد ایسا نہیں ہوتا۔ پیشرو اور قرین کا مقام تفصیل سے بیان کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1835} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1836} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1837} p.1838} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.1839} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.1840} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1841} {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1842}۔ صدقہ دینے، روزہ رکھنے اور میک اپ کرنے پر: رمضان کے آخر میں صدقات کی قسموں پر عمل کیا جاتا ہے۔ ہدیہ نہ ملنے والے کے لیے تین روزے حج میں اور سات دن واپسی کے ہیں۔ قضاء ایک ہی وقت میں جمہور پر واجب ہے اور اگلے سال احناف کے نزدیک بگڑی ہوئی رسم کی میقات سے داخل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص1843} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1844}۔"
  tr: "Dilde İhram, Hac veya Umre sırasında kutsal döneme girmek ve kutsal mekâna girmek anlamına gelir. Genel olarak kullanıldığında, Hac veya Umre sırasında kutsal yerlere girmeyi ifade eder. Ayrıca namaza girmeyi de ifade edebilir, bu yüzden 'Tekbir'i İhram' olarak adlandırılır. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.1777} Hanefilere göre, belirli kutsal yerlere girmek, ancak kasıtla ve anma yoluyla gerçekleşir. Maliki, Şafiî ve Haneli'ye göre, Hac ve Umre kutsal yerlerine girme niyeti gerçekleşmez. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1779} Alimler oybirliğiyle bunun ritüelin zorunlu eylemlerinden biri olduğu konusunda hemfikir oldular ve bunun bir sütun mu yoksa bir durum mu olduğu konusunda görüş ayrılığı yaptılar: Malikiler, Şafiiler ve Hanbalilere göre bir şart, Hanefilere göre bir şart, başka bir açıdan sütundur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1779} ve geçerliliği İslam ve niyet gerektirir. Hanafiler talbiyah veya eşdeğerini eklediler, bunu bir şart olarak görürler ve bazıları bunun zorunlu olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1781} Ve talbiye, 'Labbayk Allahumma Labbayk' ifadesidir ve içindeki ifade, Peygamber'in Veda Hacında verdiği zorunluluktur. Hanbali ve Şafiilere göre bir sünnettir ve Malikilere göre zorunludur ve kanın çıkarılmasını ya da niyetten ayrılmayı uzatmasını gerektirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1782} Hanafilere göre Talbiye'nin yeri, Allah'ı yüceltmek, kurban sunusunu taklit etmek ve ona dönerken ona götürmek için yapılan her bir ifadedir. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1783} ve mutlak ritüelleri amaçlayan ve sonra bunları belirten hayali ihram, düşünce okullarının uzlaşmasına göre geçerlidir. Ritüel, herhangi bir eylemden önce Şafi'ler ve Haneliler, Hanafi ve Malikilere göre ise tavif veya statüye göre belirlenmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1784} ve ihram malul kişi içindir ve o kişinin yetişkinlikten önce ihrama girdiği için de aynı şekilde belirlenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1784} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 1785} İhram zamanındaki \"Eğer bir mahkum beni hapse atarsa, nerede hapse atılırsam orada hapsedilirim\" şartı Şafiiler ve Hanbalilere göre geçerlidir ve engelleyen kişi için caiz olduğunu gösterir, ancak Hanafi ve Maliki'ye göre geçerli değildir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1785} Hanafiler, hacının durumuna göre Kur'an'da ayrıntılı bir açıklama yaparlar: Mekkeli (yani Mikati) Kur'an'ı onun için sevmez, bu yüzden yaparsa bu caizdir ve tazminat ödemek zorundadır. Afaqi'ye göre, eğer Hec Umre'ye Tewaf yapmadan önce dahil edilirse, çoğunluğa göre geçerlidir. Mekke'ye gelince, Umresi Hanefi tarafından kanla reddedilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1787} Malikiler ve Hanbaliler, Umre başladıktan sonra hacın devamına izin vermiş ve hacı Qar olur, ancak Şafiiler Tewaf başladıktan sonra bunu yasaklamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1788} Umre'nin Hec'e eklenmesi Maliki, Şafii ve Hanbali'ye göre geçerli değildir, bu nedenle Qaran olmaz ve Hanafi ile Malikiler tarafından sevilmez. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1789} İhrem, iki Hac veya Umre ile birlikte yapılır; bunlardan biri çoğunluk tarafından yapılır, diğeri ise iptal edilir; oysa Abu Hanifa'ya göre her ikisiyle birlikte yapılır ve biri telafi edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1789} İhram davaları bireysel, Kur'an ve Tamattu' olarak ayrılır ve tanımları okullar arasında farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1790} Hukukçulara göre ihramın yükümlülükleri iki konuya sınırlıdır: Mikat'tan olması ve yasaklı eylemlerden korunması. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1790} Dildeki miqat sabit bir zamandır ve terminolojide, belirli bir ibadet eylemi için belirli yer ve zamanları ifade eder; ihram miqatı ise zamansal veya mekânsal olarak ifade edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1791} İhram'ın hac için mikatı, üç İmam ve Ahmed'e göre hac için mikat: Shawwal, Dhu al-Qi'dah ve Dhu al-Hijjah'ın ilk on günü, Malik'e göre ise Dhu al-Hijjah'ın sonuna kadar uzanır. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 1791} Hanafileri ve Hanbalilere göre, kurban günü Hacın en ünlü günlerinden biridir ve Şafiilere göre son gün kurban gecesidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1792} Hanefiler, Malikiler ve Hanbaliler, resmi ayından önce İhrem için girmelerine hoşnutsuzlukla izin verirlerdi, ancak Şafiiler hacın yapılamaması için bunu yasaklamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1793} ve umre zamanı yıl boyunca sürer, Ramazan ayında yapılır ve Hanafiler Arafah Günü ve ondan sonraki dört gün Umre vakti tarafından hoşlanmazlardı. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1794} Mekânsal ufuk zamanları üzerinde anlaşılmıştır: Medine halkı için Dhu al-Hulayfah, Levant halkı ve oradan geçenler için Al-Juhfa, Necd halkı için Qarn al-Manazil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1794} Yemen halkının miqatı Yalamlam, Irak ve Doğu'nun geri kalanının miqatı ise Dhath Arq'dır. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 1795} Mikat, Sünnet (İbn Abbas ve İbn Ömer'in hadisleri) ve uzlaşma ile kurulmuştur, ancak metinle mi yoksa metinle uyumlu Umar'ın ectihadı mı olduğu konusunda anlaşmazlık vardır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1795} Mikat'tan geçen herkes İhrama girmek zorundadır, İhramı ertelemek oybirliğiyle yasaktır ve ihram baştan iyidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1796} Önemli olan köyün adı değil, Miqat'ın konumudur. Mikat'tan veya bitişiğinden ihram yeterlidir ve Mikat'tan geçmeyenler için bu hatat varsayılan olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1797} Ve iki mikattan geçen herkes, Şafiiler ve Hanbaliler en uzak noktadan ihram ister, Malikiler ilk noktadan İhram ister, Hanafiler ise İhrem ister, ancak geciktirmekten hoşlanmazlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1797} Mekânsal mikattan önce ihram oybirliğiyle kabul edilir, ancak anlaşmazlık şu ki, Malikiler, Şafiiler ve Hanbaliler bundan hoşlanmaz, Hanafiler ise bunu güvence altına almak için daha iyi bulurlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1798} Miqat'tan geçip rituel yapmak isteyen kimse yasak ve günahkar değildir; geri döner ve oradan ihrama girmelidir. Dönmezse, kanını sadece bir bahane olmadan ödemelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1798} Miqati, Miqatların bulunduğu bölgede yaşayan kişi anlamına gelir ve onun Miqatı Malikilere göre yeridir, Şafi'ler ve Hanbalilere göre yeri onun yeri veya yeridir ve Hanefiler Miqatını kabul edilebilir alan olarak kabul ederler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1798} Mekke halkının Hac sırasında Miqatı ve Haram onların yeridir, bu yüzden Mekke'den (veya Hanafi ve Hanbalilere göre camiden) İhrama girerler. Malikiler, Hac için uygun olanlarla Kur'an'a uyanları ayırt ederler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1800} Mekke'dekiler için Umre'nin Mikatı herhangi bir yerden izin verilen yerdir, çoğunluğa göre tercih edilen yer Ja'ranah'tır ve Hanefi okuluna göre Al-Tan'im'dir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1800} Mahram genellikle izin verilen yasaklardan yasaktır; hatırlatma ve sadeliği teşvik etmek için. Bunların en önemlilerinden biri, bir erkeğin vücudunu dikilmiş veya dış örtüyle örtmesidir; bu yüzden gömlek, sarık, pantolon, pelerin veya ayakkabı giymemelidir; safran ve eşek arısı yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1801} Bir erkek, Hanefi'lere göre ayrıntılı olarak belirtilen şekilde cübbe veya benzeri giymemelidir; bazı düşünce okullarına göre izar pantolonu fidya ile bulmayanlar için de geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1801} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 1802} Ve sandalet bulamayan çorapları ayak bileklerinin altındaki kesip halka açık şekilde giymelidir; Ahmed ve görüş alimleri buna katılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1802} Maliki ve Hanelilere göre ihramda kılıcı giymek yasaklarından biri vardır ve Hanafi ile Şafiiler buna izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1803} Başın örtülmesi oybirliğiyle yasaktır. Kararında farklı görüşler vardı: Hanefiler ve Hanbaliler genellikle başı örtmek isterken, Malikiler ve Şafiiler bunu bir örtü olarak kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1804} Ve alt kökenle kanıtlanmış bir şeyle, örneğin çadır veya kapalı bir araba ile gölgelendirme uzlaşma ile mümkündür, kesinleşmemiş olanlar ise Hanafi ve Şafi'lere göre izinlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1805} Erkeklerin yüzlerini örtmesi, kadınların nikabla örtmesi yasaktır; gerekirse istisnalar yapar ve ayartmayı önlemek içindir; erkeklerin ise eldiven takması da uzlaşmayla yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1805} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 1806} İhramda bir kadının çoğunluğun önünde yüzünü ve ellerini örtmesi yasaktır, bir istisna dışında, Hanefi ise eller için izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1806} Mahram için bedenin yasakları, vücudu parfetmek, dağınık saçları çıkarmak veya masrafları telafi etmekle ilgili her şeydir: kafa tıraş etmek, saç almak, tırnak kesmek, yağlamak ve parfüm sürmek. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1807} Mahram ve onun için tıraş olanlar için baş tıraş etmek ve saçı kısaltmak yasaktır. Mehramın izinli olanlar için tıraş edilmesi konusunda anlaşmazlıklar vardır: Hanafiler yasaklar, Şafiiler ve Hanbaliler izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1808} Hoş olmayan yağ sürmek çoğunluk tarafından lüks olduğu için yasaktır. Şafiiler baş ve sakalı belirtirken, Hanbaliler tüm vücuda yağ sürülmesine izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1809} ve parfüm detaylarda anlaşmazlık olmadan yasaktır. Yasaklı kişinin izarında, kıyafetlerinde, yataklarında ve sandaletlerinde parfüm kullanması yasaktır. Saf parfüm içmek ve yemek yasaktır ve yiyecekle karıştırıldığında hüküm farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1810} Parfümü dokunmadan koklamak Hanefiler, Malikiler ve Şafi'ler tarafından sevilmez ve bunun karşılığında ödül almaz. Hanbalilere göre yasaktır ve misk ile kafur gibi fidye (fidye) gerektirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1811} Avcılık, Kitap (Suresi Al-Ma'idah 95-96) ve Sünnet (Ebu Katadah Hadisleri) tarafından ihramda olan kişi için yasaktır. Hanefilere göre avcılık, orijinal doğasında yabani ve yabani olan bir hayvandır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1812} İhramda olan kişinin avı öldürmesi, zarar vermesi, yardım etmesi, emretmesi ve satış, hediye veya başka yollarla sahip olması yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1813} ve avcılıktan, örneğin etini veya yumurtasını yemekten faydalanması yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1813} Avlanması yasal olan av hayvanlarının yemesi konusunda anlaşmazlık vardır: Ali, İbn Ömer ve İbn Abbas tarafından yasaklanmıştı, çoğunluk avlanmadığı sürece izin vermiş, Hanefiler ise emir veya işaret olmadıkça izin vermiştir. Zinciri şu hadistir: \"Karada avlanmadığınız sürece veya sizin için uzaklaştırıldığı sürece sizin için razattır.\" {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1814} İhram için gusl kılmak tavsiye edilir, cemaat önünde ona parfüm sürmek ve İhram önünde iki rekat namaz kılmak tavsiye edilir. Talbiye, Sünnet büyütülerek ve ses yükseltilerek okunur. Hacı için Akabe Cemreti'nin taşlanmasıyla ve hacı için taşı aldıktan sonra zaman sona erer, {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1823}. İhrama girme yükümlülüğü ritüeli tamamlamaktır, dinden dönmek onu geçersiz kılar, cinsel ilişki ise geçersiz kılarak uydurur. Küçük tahlul üç eylemden ikisiyle gerçekleşir: taşlama, kesim, tıraş etme veya kısaltma; büyük tahlul Hanafi ve Maliki'ye göre tıraş ile tevaf ifada, Şafiî ve Haneli'ye göre üç eylemle yapılır; Umre ise tıraş veya kısaltma ile bir tahlul elde edilir. {atıf:) fiqh-mawsua-kuwaitiyya-noor-v3 s.1823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1825}. İhram devleti, iptal ile kaldırılır, bu da tartışmalı bir konudur ve reddetmek anlamsızdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1826} Küçük, bilinçsiz ve unutkanla ilgili hükümlerde: kendisiyle ayırt edilen bir çocuğun ihramı Hanafi ve Maliki'ye göre belirlenir ve ayırt edemeyen bir vasi için yasaktır. İhrama girmeden önce bayılırsa, üç kişi için ihramda değildir; Hanafi'lerin ayrıntılı olarak belirttiği üzere ihramdadır. Belirli bir ritüeli unutan kişi Hac ve Umre yapmak zorundadır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1829}. Onuncu bölüm, yasak eylemler için kefaretlerle başlar; fidye, kurbanlar, sadaka ve oruç gibi konuları kapsar. Lüks için kefaretler arasında giysi, parfüm, talaş, tırnak ve bit öldürme bulunur. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1831}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1833}. Baş bitleri ve avcılık durumlarında: İhram'daki kişinin biti arındırmak için maruz kalması hoş karşılanmaz. Öldürmenin cezası konusunda anlaşmazlık vardır. Dört İmam tarafından kasıtlı ve kazara avlanma garantilidir. Eşdeğer olan, kurban hayvan, yiyecek ve oruç arasında seçimdir. Avcılık, sağma, zinciri koparma, zarar verme ve el koyup yemek yoluyla suç işleme okullar arasında farklılık gösterir. Cinsel ilişkide: ceza gerektiren bir ceza cezasıdır. Hacı ayağa kalkmadan önce, sonra ve ilk fesih öncesinde geçersiz kılar, sonrasında ve Umre'de de benzer şekilde. Ayrıca ön koşulların fidyesi, düşünce ve Karin Hacı hakkında da ayrıntılı bilgi verilir. {atıf:) fiqh-mawsua-kuwaitiyya-noor-v3 s.1835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1842}. Sadaka, oruç ve kaçırılmış namazları telafi etme konusunda: sadakat türleri uygulanır ve kurban sunamayanlar için oruç Hac sırasında üç gün, dönüşten sonra yedi gün boyunca yapılır. Kaçırılan kişi, çoğunluk ve ertesi yıl Hanefilere göre kaçırdığı orucu telafi etmek zorundadır. Hakim, ritüelleri geçersiz kıldığı için mikattan mahrum bırakılır. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.1843} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.1844}."
  id: "Dalam bahasa ini, Ihram berarti memasuki masa suci selama Haji atau Umrah dan memasuki kawasan suci. Ketika digunakan secara umum, istilah ini merujuk pada memasuki tempat-tempat suci selama Haji atau Umrah. Istilah ini juga dapat merujuk pada memasuki shalat, sehingga disebut 'Takbir al-Ihram.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1777} Menurut Hanafi, memasuki tempat-tempat suci tertentu tidak secara hukum diwujudkan kecuali dengan niat bersama dengan peringatan atau sesuatu sebagai gantinya. Menurut Maliki, Shafi'i, dan Hanbali, niat untuk memasuki kesucian Haji dan Umrah tidak terpenuhi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1779} Para cendekiawan sepakat bahwa ini adalah salah satu tindakan wajib dalam ritual, dan mereka berbeda apakah itu adalah tiang atau kondisi: ini adalah tiang menurut Maliki, Shafi'i, dan Hanbali, sebuah syarat dalam satu hal, dan tiang dalam hal lain menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1779} dan keabsahannya mensyaratkan Islam dan niat. Para Hahanfi menambahkan talbiyah atau yang setara, yang mereka anggap sebagai syarat, dan beberapa mengatakan itu wajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1781} Dan talbiyah adalah frasa 'Labbayk Allahumma Labbayk,' dan kata-kata yang terkandung di dalamnya adalah apa yang diwajibkan Nabi dalam Ziarah Perpisahan. Ini adalah Sunnah menurut Hanbalis dan Shafi'i, dan menurut Maliki, ini wajib dan mengharuskan darah dihilangkan atau memperpanjang pemisahan dari niat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1782} Tempat Talbiyah menurut Hanafi adalah setiap penyebutan yang memuliakan Allah, meniru persembahan persembahan, dan mengarahkannya sambil berbalik kepada-Nya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1783} dan ihram imajiner, yang bermaksud ritual mutlak lalu menentukannya, berlaku menurut konsensus aliran pemikiran. Ritual harus ditentukan sesuai dengan Shafi'i dan Hanbalis sebelum tindakan apapun, dan menurut Hanafi dan Malik sesuai tawaf atau kedudukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1784} dan Ihram adalah untuk orang yang tidak valid, dan ditetapkan untuk apa yang orang itu masuk ke Ihram sebelum mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 1785} Syarat pada waktu ihram, yang menyatakan \"Jika seorang tahanan memenjarakan saya, maka saya akan dikurung di mana pun Anda memenjarakan saya,\" berlaku menurut Shafi'i dan Hanbalis dan menunjukkan izin bagi yang mencegahnya, tetapi tidak sah menurut Hanafi dan Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1785} Hanafi memiliki penjelasan rinci dalam Al-Qur'an sesuai dengan keadaan peziarah: Orang Mekah (yaitu Miqati) tidak menyukai Al-Qur'an untuknya, jadi jika dia melakukannya, itu diperbolehkan dan harus membayar kompensasi. Menurut 'Afaqi, jika Haji dimasukkan dalam Umrah sebelum melaksanakan Tawa, itu sah menurut mayoritas. Adapun Mekah, Umrahnya ditolak oleh Hanafi dengan darah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1787} Umat Malik dan Hanbal mengizinkan kelanjutan Haji ke Umrah setelah memulainya, dan peziarah menjadi Qar, sementara para Shafi'i melarang hal ini setelah memulai Tawa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1788} Menambahkan Ihram Umrah ke dalam Haji tidak sah menurut Maliki, Shafi'i, dan Hanbali, sehingga tidak menjadi Qaran, dan tidak disukai oleh Haji dan Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1789} Ihram dilakukan dengan dua Haji atau Umrah bersamaan, satu dilakukan oleh mayoritas dan yang lain dibatalkan, sedangkan menurut Abu Hanifa, dilakukan dengan keduanya dan harus dibuat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1789} Kasus Ihram dibagi menjadi individu, Al-Qur'an, dan Tamattu', dan definisinya berbeda antar aliran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1790} Kewajiban Ihram menurut para ahli hukum terbatas pada dua hal: harus dari Miqat dan harus dilindungi dari tindakan terlarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1790} Miqat dalam bahasa ini adalah waktu tetap, dan dalam istilah, miqat merujuk pada tempat dan waktu tertentu untuk suatu tindakan ibadah tertentu, dan miqat untuk ihram bersifat temporal atau spasial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1791} Miqat Ihram untuk Haji menurut tiga Imam dan Ahmad: Shawwal, Dhu al-Qi'dah, dan sepuluh hari pertama Dhu al-Hijjah, dan menurut Malik, ini berlanjut hingga akhir Dhu al-Hijjah. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 1791} Menurut Hanafi dan Hanbali, hari pengorbanan adalah salah satu hari paling terkenal dalam Haji, dan menurut para Shafi'i, hari terakhir adalah malam pengorbanan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1792} Hanafi, Maliki, dan Hanbalis mengizinkan masuk ke Ihram untuk Haji sebelum bulan resminya dengan ketidaksukaan, tetapi Shafi'i melarangnya agar Haji tidak dapat dilaksanakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1793} dan waktu Umrah adalah sepanjang tahun, dan dilakukan pada Ramadan, dan Hanafi tidak menyukainya pada Hari Arafah dan empat hari setelahnya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1793} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1794} Waktu cakrawala spasial disepakati: Dhu al-Hulayfah untuk rakyat Madinah, Al-Juhfa untuk rakyat Levant dan mereka yang melewatinya, dan Qarn al-Manazil untuk rakyat Najd. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1794} Miqat rakyat Yaman adalah Yalamlam, dan miqat rakyat Irak serta sisa Timur adalah Dhath Arq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 1795} Miqat ditetapkan oleh Sunnah (hadits Ibn Abbas dan Ibn Umar) dan oleh konsensus, tetapi ada perbedaan pendapat apakah ditetapkan melalui teks atau oleh ijtihad Umar yang sesuai dengan teks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1795} Siapa pun yang melewati Miqat dengan niat salah satu dari dua ritual harus masuk ke Ihram dari sana, dan menunda Ihram dilarang secara bulat, dan Ihram sejak awal lebih baik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1796} Intinya adalah lokasi Miqat, bukan nama desa. Ihram dari Miqat atau yang berdekatannya sudah cukup, dan penjajaran adalah default bagi mereka yang tidak melewati Miqat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1797} Dan siapa pun yang melewati dua miqat, Shafi'i dan Hanbalis mengharuskan Ihram dari titik terjauh, Maliki mengizinkan Ihram dari titik pertama, dan Hanafi mengizinkan tapi tidak suka menundanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1797} Ihram sebelum miqat ruang diperbolehkan secara bulat, tetapi perselisihan adalah Maliki, Shafi'i, dan Hanbal tidak menyukainya, sementara Hanafi menganggapnya lebih aman dengan keamanan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1798} Siapa pun yang melewati Miqat dengan niat melakukan ritual bukanlah hal yang dilarang dan berdosa, dan ia harus kembali dan masuk ke Ihram dari sana. Jika ia tidak kembali, ia harus membayar darah kecuali dengan alasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1798} Dan Miqati berarti seseorang yang tinggal di daerah Miqat, dan Miqat-nya adalah tempatnya menurut Maliki, dan menurut Shafi'i dan Hanbali, tempatnya adalah tempat atau tempatnya, dan Hanafi menganggap Miqat-nya sebagai wilayah yang diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1798} Miqat umat Mekah dan Haram selama Haji adalah tempat mereka, sehingga mereka masuk Ihram dari Mekah (atau dari masjid menurut Haṣṇhh). Umat Maliki membedakan antara mereka yang memenuhi syarat untuk Haji dan mereka yang mengikuti Al-Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1799} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1800} Miqat Umrah bagi mereka yang di Mekah adalah tempat yang diperbolehkan dari mana pun, dan yang disukai adalah Ja'ranah menurut mayoritas, dan menurut mazhab Hanafi, itu adalah Al-Tan'im. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 1800} Mahram biasanya dilarang dilarang sebagai pengingat dan mendorong penghematan. Salah satu yang paling penting adalah pria menutupi tubuhnya dengan selimut yang dijahit atau luar, sehingga ia tidak boleh mengenakan kemeja, sorban, celana, jubah, atau sepatu, dan kufron serta tawon dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1801} Seorang pria tidak boleh mengenakan jubah atau serupa kecuali sesuai dengan rincian menurut Hanafi; dan bagi mereka yang tidak menemukan celana izar dengan fidya menurut beberapa aliran pemikiran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1801} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 1802} Dan siapa pun yang tidak menemukan sandal harus memotong kaus kaki di bawah pergelangan kaki dan memakainya di depan umum, dan Ahmad serta para ulama tidak setuju dengan hal itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1802} Di antara larangan bagi orang yang berada di ihram menurut Malik dan Hanbalis adalah memakai pedang tanpa perlu, dan Hanafi serta Shafi'i mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1803} Menutup kepala dilarang secara bulat. Mereka berbeda pendapat tentang putusannya: Hanafi dan Hanbalis biasanya bermaksud menutupinya, sementara Malik dan Shafi'i menganggapnya sebagai penutup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1804} Dan pewarnaan berdasarkan apa yang terbukti berasal dari sumber bawahan, seperti tenda atau mobil tertutup, diperbolehkan berdasarkan konsensus, dan apa yang belum ditetapkan diperbolehkan menurut Hanafi dan Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1805} Dilarang bagi pria menutupi wajah mereka dan wanita menutupinya dengan niqab, dengan pengecualian jika perlu dan untuk mencegah godaan; dan dilarang bagi pria mengenakan sarung tangan dengan konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1805} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 1806} Seorang wanita di ihram dilarang menutupi wajah dan tangannya di depan mayoritas dengan pengecualian, dan Hanafi mengizinkannya untuk tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1806} Larangan tubuh untuk mahram adalah segala hal yang berkaitan dengan mengharumkan wangi, menghilangkan rambut yang berantakan, atau menutupi biaya: mencukur kepala, mencabut rambut, memotong kuku, mengurap, dan mengoleskan parfum. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1807} Mencukur kepala dilarang bagi mahram dan bagi mereka yang mencukur untuknya, serta memendekkan rambut. Ada perbedaan pendapat tentang mencukur mahram untuk yang diperbolehkan: Hanafi melarangnya, dan Shafi'i serta Hanbal mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1808} Mengoleskan minyak tidak sedap dilarang oleh mayoritas karena kemewahannya. Syafi'i menentukan kepala dan janggut, sedangkan Hanbalis mengizinkan minyak di seluruh tubuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1809} dan parfum dilarang tanpa perbedaan pendapat dalam detail. Orang yang dilarang memakainya pada izar, pakaian, tempat tidur, dan sandal. Dilarang bagi yang dilarang untuk minum dan makan parfum murni, dan aturannya berbeda jika dicampur dengan makanan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1810} Mencium aroma parfum tanpa disentuh tidak disukai oleh Hanafi, Maliki, dan Shafi'i dan tidak ada imbalan untuk itu. Menurut Hanbali, hal ini dilarang dan membutuhkan tebusan seperti musk dan kamper. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1811} Berburu dilarang bagi yang ada dalam ihram menurut Kitab (Surah Al-Ma'idah 95-96), dan Sunnah (Hadis Abu Qatadah), konsensus. Menurut Hanafi, berburu adalah hewan liar yang dilarang dan liar dalam sifatnya yang asli. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1812} Dilarang bagi orang di ihram untuk membunuh dan melukai buruan, membantu, memerintahnya, dan memilikinya melalui penjualan, hadiah, atau cara lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1812} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1813} dan dilarang baginya untuk mendapatkan manfaat dari berburu, seperti memakan daging atau telurnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1813} Mengenai memakan buruan yang sah untuk diburu, ada perbedaan pendapat: itu dilarang oleh Ali, Ibn Umar, dan Ibn Abbas, dan mayoritas mengizinkannya jika tidak diburu, dan Hanafi mengizinkannya kecuali ada perintah atau petunjuk. Rantainya adalah hadits: \"Berburu di darat adalah sah bagimu selama kamu tidak menangkapnya atau ia diusir untukmu.\" {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1814} Disarankan untuk melakukan ghusl untuk Ihram, dan disarankan untuk mengoleskan parfum di hadapannya di hadapan jemaat, serta berdoa dua rak'ah di hadapan Ihram. Talbiyah dibacakan Sunnah dengan meningkatkannya dan meninggikan suara. Waktunya berakhir bagi peziarah saat dilempari batu Jamrat Aqaba, dan bagi peziarah setelah menerima batu tersebut, {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1820} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1823}. Kewajiban untuk memasuki Ihram adalah menyelesaikan ritual, murtad membatalkannya, dan hubungan seksual membatalkannya, menebusnya. Tahlul minor terjadi melalui dua dari tiga babak: dilempari batu, disembelih, dicukur, atau memendekkan rambut; tahlul utama adalah dengan tawaf al-ifadah dengan mencukur sesuai Hanafi dan Maliki, dan dengan tiga tindakan menurut Shafi'i dan Hanbali; dan Umrah memiliki satu tahlul dengan mencukur atau memendekannya. {cite:Fiqh-Mawsua-Kuwaityya-Noor-V3 hlm.1823} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1825}. Status Ihram dicabut oleh pembatalan, yang menjadi bahan perdebatan, dan penolakan tidak berarti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1826} Dalam aturan tentang yang kecil, yang tidak sadar, dan yang pelupa: ihram seorang anak laki-laki yang dibedakan oleh dirinya sendiri ditetapkan menurut Hanafi dan Maliki, dan dilarang bagi wali yang tidak bijaksana. Jika dia pingsan sebelum masuk ihram, dia tidak berada dalam ihram untuk ketiganya tetapi berada dalam ihram menurut Hanafi secara rinci. Orang yang lupa ritual tertentu wajib melaksanakan Haji dan Umrah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1829}. Bab kesepuluh dimulai dengan penebusan atas perbuatan terlarang, mencakup tebusan, pengorbanan, amal, dan puasa. Penebusan kemewahan meliputi pakaian, parfum, serutan, paku, dan kutu pembunuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1834}. Dalam kasus kutu kepala dan berburu: tidak disukai bagi orang di Ihram untuk terpapar kutu untuk memurnikannya. Ada perbedaan pendapat mengenai hukuman membunuh mereka. Berburu secara sengaja dan tidak sengaja dijamin menurut keempat Imam. Yang setara adalah pilihan antara hewan kurban, makanan, dan puasa. Merusak perburuan, memerah, memutus rantai, menyebabkan kerugian, dan pelanggaran dengan meletakkan tangan dan makan memiliki aturan yang berbeda di antara aliran. Dalam hubungan seksual: ini adalah hukuman pidana yang memerlukan hukuman. Haji membatalkan sebelum berdiri, setelahnya, sebelum pembubaran pertama, berbeda dengan yang terjadi setelahnya, dan demikian juga untuk Umrah. Juga dirinci mengenai tebusan prasyarat, refleksi, dan Haji Qarin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1842}. Mengenai amal, puasa, dan menebus salat yang terlewat: jenis amal dijalankan, dan puasa bagi yang tidak dapat melakukan kurban dilakukan selama tiga hari selama Haji dan tujuh hari setelah kembali. Orang yang tertinggal harus segera mengejar puasa yang terlewat sesuai dengan mayoritas dan tahun berikutnya menurut Hanafi. Hakim dicabut miqat karena membatalkan ritual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1844}."
