id: concept/ihram
class: concept
kind: legal
label: { ar: "إحرام", en: "Ihram (the state of consecration for hajj or umra)" }
summary:
  ar: "الإحرام في اللغة الإهلال بحج أو عمرة والدخول في الحرمة، وعند الإطلاق يراد به الإحرام بالحج أو العمرة، وقد يُطلق على الدخول في الصلاة فيقال «تكبيرة الإحرام». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777} وهو عند الحنفية الدخول في حرمات مخصوصة لا يتحقق شرعاً إلا بالنية مع الذكر أو ما يقوم مقامه، وعند المالكية والشافعية والحنابلة نية الدخول في حرمات الحج والعمرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} وأجمع العلماء على أنه من فرائض النسك، واختلفوا هل هو ركن أو شرط: فهو ركن عند المالكية والشافعية والحنابلة، وشرط من وجه وركن من وجه عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} ويشترط لصحته الإسلام والنية، وزاد الحنفية التلبية أو ما يقوم مقامها، وهي عندهم شرط، وقيل واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} والتلبية قول «لبيك اللهم لبيك»، والصيغة الواردة فيها ما لزمه النبي في حجة الوداع، وهي عند الحنابلة والشافعية سنة، وعند المالكية واجبة يلزم الدم بتركها أو بطول الفصل عن النية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1782} ويقوم مقام التلبية عند الحنفية كل ذكر فيه تعظيم لله، وتقليد الهدي وسوقه مع التوجه معه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} وإيهام الإحرام، وهو أن ينوي نسكاً مطلقاً ثم يعيّنه، صحيح باتفاق المذاهب، ويجب تعيين النسك عند الشافعية والحنابلة قبل أي عمل، وعند الحنفية والمالكية بحسب الطواف أو الوقوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} والإحرام بإحرام الغير صحيح وينعقد على مثل ما أحرم به ذلك الشخص عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} والاشتراط عند الإحرام، بأن يقول «إن حبسني حابس فمحلي حيث حبستني»، يصح عند الشافعية والحنابلة ويفيد التحلل عند المانع، ولا يصح عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} وللحنفية تفصيل في القِران بحسب حال المحرم: المكي (أي الميقاتي) يُكره له القِران، فإن فعله جاز وعليه دم جبر، والآفاقي إذا أدخل الحج على العمرة قبل أن يطوف لها صح قارناً عند الجمهور، أما المكي فترفض عمرته عند الحنفية بدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} وأجاز المالكية والحنابلة إرداف الحج على العمرة بعد الشروع فيها ويصير المحرم قارناً، ومنع الشافعية ذلك بعد الشروع في الطواف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1788} وإضافة إحرام العمرة إلى الحج لا تصح عند المالكية والشافعية والحنابلة فلا يصير قارناً، وكرهها الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} والإحرام بحجتين أو عمرتين معاً ينعقد بإحداهما عند الجمهور ويلغو الآخر، وعند أبي حنيفة ينعقد بهما وعليه قضاء إحداهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} وتنقسم حالات الإحرام إلى إفراد وقِران وتمتع، وتعريفها يختلف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} وتنحصر واجبات الإحرام عند الفقهاء في أمرين: أن يكون من الميقات، وأن يصان عن المحظورات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} الميقات في اللغة الوقت المحدد، وفي الاصطلاح مواضع وأزمنة معينة لعبادة مخصوصة، وللإحرام ميقات زماني وميقات مكاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} ميقات الإحرام بالحج عند الأئمة الثلاثة وأحمد: شوال وذو القعدة وعشر من ذي الحجة، وعند مالك يمتد إلى آخر ذي الحجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} وعند الحنفية والحنابلة يوم النحر من أشهر الحج، وعند الشافعية آخرها ليلة النحر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} وأجاز الحنفية والمالكية والحنابلة الإحرام بالحج قبل أشهره مع الكراهة، ومنعه الشافعية فلا ينعقد حجاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} وميقات العمرة الزماني جميع العام، وهي تندب في رمضان، وكرهها الحنفية يوم عرفة وأربعة أيام بعده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} ومواقيت الآفاق المكانية متفق عليها: ذو الحليفة لأهل المدينة، والجحفة لأهل الشام ومن مر بها، وقرن المنازل لأهل نجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} ميقات أهل اليمن يلملم، وميقات أهل العراق وسائر المشرق ذات عرق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} وثبتت المواقيت بالسنة (حديث ابن عباس وحديث ابن عمر) وبالإجماع، واختلف في ذات عرق هل ثبتت بالنص أم باجتهاد عمر الموافق للنص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} ومن مرّ بالميقات يريد أحد النسكين وجب عليه أن يحرم منه، ويحرم تأخير الإحرام عنه بالإجماع، والإحرام من أوله أفضل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} والعبرة بموضع الميقات لا باسم القرية، ويكفي الإحرام من الميقات أو من محاذاته، والمحاذاة هي الأصل عند من لم يمر بميقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} ومن مرّ بميقاتين فالشافعية والحنابلة يوجبون الإحرام من الأبعد، والمالكية يجيزون الإحرام من الأول، والحنفية يجيزونه ويكرهون تأخيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} والإحرام قبل الميقات المكاني جائز بالإجماع، والخلاف في الأفضل: المالكية والشافعية والحنابلة يكرهونه، والحنفية يرونه أفضل مع الأمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} ومن جاوز الميقات قاصداً النسك غير محرم أثم، ويجب عليه الرجوع والإحرام منه، فإن لم يرجع لزمه الدم، إلا بعذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} والميقاتي أي من يسكن في منطقة المواقيت، وميقاته موضعه عند المالكية، وعند الشافعية والحنابلة قريته أو حلته، والحنفية يجعلون ميقاته منطقة الحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} ميقات أهل مكة والحرم في الحج هو موضعهم، فيحرمون من مكة (أو من المسجد عند الحنفية والحنابلة)، والمالكية يفرقون بين من أهل بالحج ومن أهل بالقران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} وميقات العمرة لمن كان في مكة هو الحل من أي موضع، وأفضله عند الجمهور الجعرانة وعند الحنفية التنعيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} ويحرم المحرم من المحظورات المباحة عادة تذكيراً وتربية على التقشف، ومن أهمها للرجل ستر الجسم بالمخيط أو المحيط، فلا يلبس القميص والعمامة والسراويل والبرانس والخفاف، وتحريم الزعفران والورس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} ولا يلبس الرجل القباء ونحوه إلا بالتفصيل عند الحنفية؛ ولمن لم يجد الإزار السراويل مع الفدية عند بعض المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} ومن لم يجد النعلين قطع الخفين أسفل الكعبين ولبسهما عند الجمهور، وأحمد وأهل قول يخالفون ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} ومما يحظر على المحرم عند المالكية والحنابلة تقلد السيف بلا حاجة، وأجازه الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} وستر الرأس محرم بالاتفاق، واختلفوا في ضابطه: الحنفية والحنابلة بما يقصد به التغطية عادة، والمالكية والشافعية بما يعد ساتراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} والتظلل بما يثبت في أصل تابع، كالخيمة والسيارة المسقفة، جائز بالاتفاق، وبما لا يثبت جائز عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} ويحرم على الرجل ستر وجهه وعلى المرأة ستره بالنقاب، والاستثناء عند الحاجة ودفع الفتنة؛ ويحرم على الرجل لبس القفازين باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} وتحرم المرأة المحرمة اللبس في وجهها ويديها عند الجمهور مع الاستثناء، وأجازه الحنفية في اليدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} ومحظورات البدن للمحرم كل ما يتعلق بتطييب الجسم أو إزالة الشعث أو قضاء التفث: حلق الرأس، وإزالة الشعر، وقص الظفر، والادّهان، والتطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} وحلق الرأس محرم على المحرم وعلى من يحلق له، وكذلك التقصير، واختلف في حلق المحرم للحلال: فحظره الحنفية، وأجازه الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} والادّهان بالدهن غير المطيب محظور عند الجمهور لما فيه من الترفه، والشافعية يخصون الرأس واللحية، والحنابلة يبيحون الدهن في البدن كله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} والطيب محظور بلا خلاف على التفصيل، والمحرم ممنوع من استعماله في إزاره وثيابه وفراشه ونعله، ويحرم على المحرم شرب الطيب الخالص وأكله، ويختلف الحكم فيه إذا خلط بالطعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1810} شم الطيب دون مسه يكره عند الحنفية والمالكية والشافعية ولا جزاء فيه عندهم، ويحرم عند الحنابلة ويجب فيه الفداء كالمسك والكافور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} والصيد محظور على المحرم بالكتاب (سورة المائدة 95-96) والسنة (حديث أبي قتادة) والإجماع، والصيد عند الحنفية الحيوان البري الممتنع المتوحش في أصل الخلقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} ويحرم على المحرم قتل الصيد وإيذاؤه والمساعدة عليه والأمر به، وتملكه بالبيع أو الهبة أو غيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} ويحرم عليه الانتفاع بالصيد كأكل لحمه أو بيضه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} وفي أكل صيد صاده الحلال خلاف: منعه علي وابن عمر وابن عباس، وأجازه الجمهور إن لم يصد له، وأجازه الحنفية ما لم يكن منه أمر أو دلالة، وسنده حديث «صيد البر لكم حلال ما لم تصيدوه أو يصد لكم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1814}"
  en: "Ihram in the lexicon means to proclaim the pilgrimage or the umra and to enter the state of sanctity; in jurists' usage it means, when unqualified, entering the hajj or the umra, and the word is also used for entering prayer, as in «the takbir of ihram». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777} For the Hanafis it is entering into certain prohibitions, valid only with intention together with a mention of God or what stands in for it; for the Malikis, Shafi'is and Hanbalis it is the intention to enter the prohibitions of hajj or umra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} All agree that it is one of the obligations of the rite. They differ on whether it is a pillar or a condition: the Malikis, Shafi'is and Hanbalis count it a pillar, while the Hanafis count it a condition in one respect and a pillar in another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} Its validity requires Islam and intention; the Hanafis add the talbiya or what stands in for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} The talbiya is the words «here I am, O God, here I am», which the Prophet's practice on the farewell pilgrimage fixed; the Shafi'is and Hanbalis treat it as a sunna, while the Malikis treat it as an obligation whose omission or long delay after intention requires a sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1782} For the Hanafis, anything that glorifies God stands in for the talbiya, as does garlanding and driving the sacrificial animal with the intention to go along. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} Ihram with an unspecified rite is valid by agreement; the Shafi'is and Hanbalis require the rite to be named before any act, while the Hanafis and Malikis judge by the first act performed (circling the House or standing at Arafat). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} Entering ihram by copying another's ihram is valid, and according to the majority it takes the form of the other person's ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} A stipulation made at the start (that one may leave the state if prevented) is valid for the Shafi'is and Hanbalis and allows release when hindered, but it is not valid for the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1785} The Hanafis have their own rule for the Meccan (one at or within the miqat zone): for him qiran is disliked; if he does it, it is lawful but he owes a make-up sacrifice, while for a man coming from afar who joins hajj to umra before circling for it, the joining is qiran by the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} The Malikis and Hanbalis allow joining hajj to an umra already begun, making the pilgrim a qarin; the Shafi'is forbid it once circling has begun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1788} Adding an umra to a hajj already begun is not valid for the Malikis, Shafi'is and Hanbalis, so no qiran results; the Hanafis and Malikis dislike it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} Entering ihram for two hajjs or two umras together takes effect with one and the other is void, according to the majority; Abu Hanifa holds both take effect and one must be made up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1789} The forms of ihram are ifrad, qiran and tamattu', and each school defines them differently. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} Its obligations come down to two: beginning at the miqat, and guarding the ihram against the prohibited acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} A miqat is, in the lexicon, a set time or place; in law, the set places and times for a specific rite. Ihram has a time miqat and a place miqat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} For the hajj, the three imams and Ahmad fix the time as Shawwal, Dhu al-Qa'da and the first ten days of Dhu al-Hijja; for Malik it runs to the end of Dhu al-Hijja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1791} The Hanafis and Hanbalis count the day of sacrifice as one of the months of hajj; the Shafi'is count only its night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} The Hanafis, Malikis and Hanbalis allow ihram for the hajj before its months, with dislike; the Shafi'is hold it does not make a hajj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} The time for umra is the whole year; it is recommended in Ramadan, and the Hanafis dislike it on the day of Arafa and four days after. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} The places for those coming from afar are agreed: Dhu al-Hulayfa for the people of Madina, al-Juhfa for Syria and those who come by it, and Qarn al-Manazil for the people of Najd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1794} For those of Yemen the miqat is Yalamlam, and for Iraq and the rest of the East it is Dhat Irq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} The miqats are fixed by the sunna (the hadiths of Ibn Abbas and Ibn Umar) and by consensus; whether Dhat Irq was fixed by text or by Umar's judgment that matched the text is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1795} Whoever passes a miqat wishing to perform either rite must enter ihram there; delaying it past the miqat is forbidden by agreement, and beginning at its far edge is best. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} The place counts, not the name of the village; entering ihram at the miqat or at its alignment is enough. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} For a traveller who passes two miqats, the Shafi'is and Hanbalis require ihram at the farther one, the Malikis allow the nearer, and the Hanafis allow either and dislike delay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} Entering ihram before the place miqat is lawful by agreement; the Malikis, Shafi'is and Hanbalis dislike it, while the Hanafis consider it better when the pilgrim is safe from breaking its rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} Whoever passes the miqat without ihram intending a rite is sinful, must return and enter ihram there, and owes a sacrifice if he does not return, unless he has an excuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} The resident of the miqat zone enters from his own place according to the Malikis, from his village or encampment according to the Shafi'is and Hanbalis, and the Hanafis take the whole sanctuary-free zone as his miqat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1798} For the Meccans and the people of the sanctuary the hajj miqat is their own place, so they enter ihram in Mecca (or at the mosque, according to the Hanafis and Hanbalis); the Malikis distinguish those who begin with hajj from those who begin with qiran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} The umra miqat for a man who is in Mecca is the lawful zone outside the sanctuary from any point; the majority prefer al-Ji'ranah and the Hanafis prefer al-Tan'im. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} Ihram forbids some things otherwise lawful, to remind the pilgrim of his rite and train him in simplicity; for men the core rule is that no stitched or fitted garment may cover the body, so shirts, turbans, trousers, hooded cloaks and socks are forbidden, as are garments touched by saffron or wars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} A man may not wear a qaba (a long coat) or similar, except by the Hanafi distinction; a man who has no waist-wrap may wear trousers with a sacrifice owed according to some schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} A man who has no sandals cuts the socks below the ankles and wears them, according to the majority; Ahmad and others differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1802} The Malikis and Hanbalis forbid the wearing of a sword without need, while the Hanafis and Shafi'is allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} Covering the head is forbidden to the man by agreement; the Hanafis and Hanbalis define covering by what is usually meant as a covering, the Malikis and Shafi'is by what counts as a covering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} Shade from something fixed to a base, such as a tent or a roofed car, is lawful by agreement; shade from something not fixed is lawful for the Hanafis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} A man may not cover his face, and a woman in ihram may not wear the niqab; the exception is need or fear of temptation. Gloves are forbidden to men by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} For women in ihram the majority forbid covering the face and hands with gloves, while the Hanafis allow covering the hands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1806} The prohibitions on the body concern anything that perfumes the body, removes its disorder or ends its untidiness: shaving the head, removing hair, cutting nails, oiling and scent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} Shaving the head is forbidden to the pilgrim and to whoever shaves him, and so is trimming; for shaving a lawful person the Hanafis forbid it, while the Shafi'is and Hanbalis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} Oil without scent is forbidden by the majority because it adds comfort; the Shafi'is limit it to the head and beard, and the Hanbalis allow it on the whole body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} Scent is forbidden by agreement with distinctions: the pilgrim may not use it on his waist-wrap, garments, bedding or sandals, nor drink or eat pure scent, and the ruling differs when scent is mixed into food. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1810} Smelling scent without touching it is disliked by the Hanafis, Malikis and Shafi'is with no penalty; the Hanbalis forbid it and require a sacrifice, as with musk and camphor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} Hunting is forbidden to the pilgrim by the Qur'an (al-Ma'ida, ayas 95-96), the sunna (the hadith of Abu Qatada) and consensus; for the Hanafis game is the wild land animal that resists capture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} The pilgrim may not kill game, harm it, assist in its hunting, order it killed, or take ownership of it by sale, gift or other means. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} He may not benefit from game, such as eating its meat or eggs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} There is disagreement on eating game caught by a lawful person: Ali, Ibn Umar and Ibn Abbas forbid it; the majority allow it if it was not caught for him; the Hanafis allow it unless he ordered or pointed to it, citing the hadith «land game is lawful to you as long as you do not hunt it or have it hunted for you». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1814}"
