id: concept/nawafil
class: concept
kind: ethical
label:
  ar: النوافل
  en: Supererogatory works (nawafil)
  es: "Obras supererogatorias (nawafil)"
  fr: "Œuvres surérogatoires (nawafil)"
summary:
  ar: "النوافل في الحديث الثامن والثلاثون من الأربعين رتبة التقرب الثانية بعد الفرائض: «وما تقرب إلي عبدي بشيء أحب إلي مما افترضت عليه، ولا يزال عبدي يتقرب إلي بالنوافل حتى أحبه» — فهي الأعمال الزائدة على الواجب من صلاة وصوم وصدقة وذكر يستمر بها العبد بعد إقامة الفرض حتى تناله محبة الله، ورتبتها في الشرح تابعة للفرائض لا تقدم عليها: فمن أهمل الفرض واشتغل بالنفل فقد قدم المرجوح على الراجح ⁦(جامع العلوم والحكم ص 770)⁩."
  en: "Supererogatory works in the thirty-eighth hadith of the Forty are the second rank of drawing near after the obligations: 'My servant draws near to Me by nothing dearer to Me than what I have made obligatory on him, and My servant keeps drawing near to Me through the supererogatory until I love him' — works beyond the required of prayer, fasting, charity and remembrance, by which the servant perseveres after establishing the obligatory until God's love reaches him; their rank in the commentary is subordinate to the obligations and never precedes them — whoever neglects the obligatory while busying himself with the supererogatory has put the lesser before the greater (Jami' al-Ulum wal-Hikam p. 770)."
  es: "Las obras supererogatorias en el trigésimo octavo hadiz de los Cuarenta son el segundo rango de acercamiento después de las obligaciones: «Mi siervo se acerca a Mí por nada más querido para Mí que lo que le he hecho obligatorio, y Mi siervo sigue acercándose a Mí a través de lo supererogatorio hasta que lo amo» — obras más allá de lo requerido de la oración, el ayuno, la caridad y el recuerdo, por las cuales el siervo persevera después de establecer lo obligatorio hasta que el amor de Dios lo alcanza; su rango en el comentario es subordinado a las obligaciones y nunca las precede — quien descuida lo obligatorio mientras se ocupa de lo supererogatorio ha puesto lo menor antes que lo mayor (Jami' al-Ulum wal-Hikam p. 770)."
  fr: "Dans le trente-huitième hadith des Quarante, les œuvres surérogatoires constituent le deuxième rang des actes de rapprochement après les obligations: « Mon serviteur ne se rapproche de Moi que par ce qui M’est plus cher que ce que Je lui ai prescrit, et Mon serviteur continue de se rapprocher de Moi par les œuvres surérogatoires jusqu’à ce que Je l’aime » — des œuvres qui vont au-delà des obligations de prière, de jeûne, de charité et d’invocation, par lesquelles le serviteur persévère après avoir accompli les obligations jusqu’à ce que l’amour de Dieu l’atteigne; leur rang dans le commentaire est subordonné aux obligations et ne les précède jamais — quiconque néglige les obligations tout en s’occupant des œuvres surérogatoires a placé le moindre avant le plus grand (Jami' al-Ulum wal-Hikam p. 770)."
