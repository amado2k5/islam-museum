label:
  ar: النوافل
  en: Supererogatory works (nawafil)
summary:
  ar: "النوافل في الحديث الثامن والثلاثون من الأربعين رتبة التقرب الثانية بعد الفرائض: «وما تقرب إلي عبدي بشيء أحب إلي مما افترضت عليه، ولا يزال عبدي يتقرب إلي بالنوافل حتى أحبه» — فهي الأعمال الزائدة على الواجب من صلاة وصوم وصدقة وذكر يستمر بها العبد بعد إقامة الفرض حتى تناله محبة الله، ورتبتها في الشرح تابعة للفرائض لا تقدم عليها: فمن أهمل الفرض واشتغل بالنفل فقد قدم المرجوح على الراجح (جامع العلوم والحكم ص 770)."
  en: "Supererogatory works in the thirty-eighth hadith of the Forty are the second rank of drawing near after the obligations: 'My servant draws near to Me by nothing dearer to Me than what I have made obligatory on him, and My servant keeps drawing near to Me through the supererogatory until I love him' — works beyond the required of prayer, fasting, charity and remembrance, by which the servant perseveres after establishing the obligatory until God's love reaches him; their rank in the commentary is subordinate to the obligations and never precedes them — whoever neglects the obligatory while busying himself with the supererogatory has put the lesser before the greater (Jami' al-Ulum wal-Hikam p. 770)."
