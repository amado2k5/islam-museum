summary:
  ar: "يحدد ابن سينا مقدار الرياضة بمراعاة ثلاثة أشياء: اللون ما دام يزداد جودة، والحركات ما دامت خفيفة، وحال الأعضاء وانتفاخها ما دامت تزداد انتفاخاً، فإذا أخذت في الانتقاص وصار العرق البخاري رشحاً سائلاً وجب القطع {cite:canon-ibn-sina-print-v1 pp.224-225}."
  en: "Ibn Sina fixes the measure of exercise by three things: the colour while it keeps improving, the movements while they are light, and the state of the organs and their swelling while it keeps growing; when these begin to fall off and the steamy sweat turns into a running ooze, exercise should stop {cite:canon-ibn-sina-print-v1 pp.224-225}."
