label: { ar: "مقدار الرياضة ومتى تقطع عند ابن سينا", en: "How long to exercise and when to stop in the Canon", ur: "قانون میں ورزش کی مقدار اور کب روکنی ہے", es: "¿Cuánto tiempo hacer ejercicio y cuándo parar en el Canon?", fr: "Combien de temps faire de l'exercice et quand s'arrêter dans le Canon", tr: "İbn Sina'ya göre egzersiz miktarı ve ne zaman kesileceği", id: "Jumlah olahraga dan kapan dikurangi menurut Ibn Sina" }
summary:
  ar: "يحدد ابن سينا مقدار الرياضة بمراعاة ثلاثة أشياء: اللون ما دام يزداد جودة، والحركات ما دامت خفيفة، وحال الأعضاء وانتفاخها ما دامت تزداد انتفاخاً، فإذا أخذت في الانتقاص وصار العرق البخاري رشحاً سائلاً وجب القطع {cite:canon-ibn-sina-print-v1 pp.224-225}."
  en: "Ibn Sina fixes the measure of exercise by three things: the colour while it keeps improving, the movements while they are light, and the state of the organs and their swelling while it keeps growing; when these begin to fall off and the steamy sweat turns into a running ooze, exercise should stop {cite:canon-ibn-sina-print-v1 pp.224-225}."
  es: "Ibn Sina fija la medida del ejercicio en función de tres cosas: el color mientras sigue mejorando, los movimientos mientras son ligeros y el estado de los órganos y su hinchazón mientras sigue aumentando; cuando estos empiezan a caerse y el sudor caliente se convierte en un flujo constante, se debe detener el ejercicio {cite:canon-ibn-sina-print-v1 pp.224-225}."
  fr: "Ibn Sina fixe la mesure de l'exercice par trois choses: la couleur pendant qu'elle continue de s'améliorer, les mouvements pendant qu'ils sont légers et l'état des organes et leur gonflement pendant qu'il continue de croître; lorsque ceux-ci commencent à tomber et que la sueur chaude se transforme en une boue coulante, l'exercice doit cesser {cite:canon-ibn-sina-print-v1 pp.224-225}."
  ur: "ابن سینا نے ورزش کی پیمائش کو تین چیزوں سے طے کیا ہے: رنگت جب تک اس میں بہتری آتی رہتی ہے، ہلکی ہلکی حرکت ہوتی ہے، اور اعضاء کی حالت اور ان کی سوجن جبکہ یہ بڑھتا رہتا ہے۔ جب یہ گرنا شروع ہو جائیں اور بھاپ دار پسینہ بہتے ہوئے پانی میں بدل جائے تو ورزش کو روک دینا چاہیے"
  tr: "İbn Sina, egzersiz miktarını üç şeyi göz önünde bulundurarak belirler: renk kalitesi arttıkça değişir; hareketler hafif olduğu sürece; ve uzuvların şişmesi ve durumu. Eğer azalır ve buhar teri sıvı bir sıvıya dönüşürse, kesmek zorunludur {cite:canon-ibn-sina-print-v1 s.224-225}."
  id: "Ibn Sina menentukan jumlah olahraga dengan mempertimbangkan tiga hal: warna selama kualitas meningkat; gerakan selama ringan; dan kondisi serta pembengkakan anggota tubuh saat semakin bengkak. Jika berkurang dan keringat uap menjadi cairan cair, memotongnya wajib {cite:canon-ibn-sina-print-v1 hlm.224-225}."
