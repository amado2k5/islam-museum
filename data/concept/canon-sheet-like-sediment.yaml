  en: "Ibn Sina says the scraped, scaly sediment includes a sheet-like kind in large pieces, white and red, which shows detachment from parts near the passage of urine: the white from the bladder, the red fleshy from the kidney. {cite:canon-ibn-sina-print-v1 p.194}."
