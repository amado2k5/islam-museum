id: concept/canon-sheet-like-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب الصفائحي القشوري عند ابن سينا"
  en: "Sheet-like, scaly sediment in the Canon"
  fr: "Sédiment en lamelles et écailles dans le Canon"
  ur: "پرت دار پپڑی نما تلچھٹ قانون میں"
  es: "Sedimento escamoso en forma de láminas en el Cañón"
summary:
  ar: "يذكر ابن سينا أن الخراطي القشوري منه صفائحي كبير الأجزاء أبيض وأحمر، ويدل على انفصاله من أعضاء قرب مجرى البول، وأن الأبيض من المثانة والأحمر اللحمي من الكلية. {cite:canon-ibn-sina-print-v1 p.194}."
  en: "Ibn Sina says the scraped, scaly sediment includes a sheet-like kind in large pieces, white and red, which shows detachment from parts near the passage of urine: the white from the bladder, the red fleshy from the kidney. {cite:canon-ibn-sina-print-v1 p.194}."
  fr: "Ibn Sina inclut dans le sédiment de raclage et d’écailles de grandes lamelles blanches ou rouges, détachées près du passage urinaire : blanches de la vessie, rouges et charnues du rein. {cite:canon-ibn-sina-print-v1 p.194}."
  es: "Ibn Sina afirma que el sedimento raspado y escamoso incluye una especie de lámina en grandes trozos, blancos y rojos, que muestra desprendimiento de partes cercanas al paso de la orina: el blanco de la vejiga, el rojo carnoso del riñón. {cite:canon-ibn-sina-print-v1 p.194}."
  ur: "ابن سینا کا کہنا ہے کہ کھرچنے والی، کھردری تلچھٹ میں ایک چادر جیسی قسم کے بڑے ٹکڑوں میں شامل ہے، سفید اور سرخ، جو پیشاب کے گزرنے کے قریب حصوں سے لاتعلقی ظاہر کرتا ہے: مثانے سے سفید، گردے سے سرخ گوشت۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 194}۔"
