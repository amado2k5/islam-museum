class: concept
kind: scientific
label: { ar: "طريقة امتحان هل يُرى الهلال في تلك الليلة", en: "Procedure to test whether the crescent will be seen that night", ur: "اس رات ہلال نظر آئے گا یا نہیں، اس کی جانچ کا طریقہ" }
summary:
  ar: "يصف البتاني طريقة امتحان رؤية الهلال: تُقوَّم الشمس والقمر لوقت غروب الشمس من اليوم الثاني من الاجتماع، أي يوم تسعة وعشرين من الشهر العربي، ثم تُعرف مواضعهما ومقدار اختلاف المنظر في الطول والعرض، فيصح موضع القمر المرئي. {cite:zij-sabi-nallino-byblion p.130}."
  en: "Al-Battani describes a test of whether the crescent will be seen: the Sun and the Moon are reckoned for the time of sunset on the second day after conjunction, that is the twenty-ninth of the Arab month; then their places and the parallax in longitude and latitude are found, which gives the visible place of the Moon. {cite:zij-sabi-nallino-byblion p.130}."
  ur: "البتانی ہلال کی رؤیت کی جانچ کا طریقہ بیان کرتے ہیں: اجتماع کے دوسرے دن، یعنی عربی مہینے کی انتیس تاریخ کو، غروبِ آفتاب کے وقت کے لیے سورج اور چاند کا حساب کیا جاتا ہے، پھر ان کے مقام اور طول و عرض میں اختلافِ منظر معلوم ہوتا ہے، تو چاند کا ظاہری مقام درست ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.130}۔"
