summary:
  ar: "يذكر ابن سينا أن الإفراط في الرياضة مع قلة الدلك والإفراط في الجماع والحمام المتواتر قد يعقبها ضعف مع تخلخل، ويعالج برياضة الاسترداد والدلك اليابس مع دهن قابض وأغذية مرطبة قليلة الكمية {cite:canon-ibn-sina-print-v1 p.247}."
  en: "Ibn Sina notes that excess exercise with little rubbing, excess intercourse and frequent bathing can be followed by weakness with expansion, treated with restorative exercise, dry rubbing with an astringent oil and moistening food in small quantity {cite:canon-ibn-sina-print-v1 p.247}."
