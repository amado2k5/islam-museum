id: concept/canon-weakness-with-expansion-after-excess
class: concept
kind: scientific
label: { ar: "الضعف مع التخلخل بعد الإفراط عند ابن سينا", en: "Weakness with expansion after excess in the Canon", ur: "زیادتی کے بعد کمزوری اور پھیلاؤ قانون میں", es: "Debilidad con expansión después de exceso en el Canon", fr: "Faiblesse liée à l'expansion après un excès dans le Canon" }
summary:
  ar: "يذكر ابن سينا أن الإفراط في الرياضة مع قلة الدلك والإفراط في الجماع والحمام المتواتر قد يعقبها ضعف مع تخلخل، ويعالج برياضة الاسترداد والدلك اليابس مع دهن قابض وأغذية مرطبة قليلة الكمية {cite:canon-ibn-sina-print-v1 p.247}."
  en: "Ibn Sina notes that excess exercise with little rubbing, excess intercourse and frequent bathing can be followed by weakness with expansion, treated with restorative exercise, dry rubbing with an astringent oil and moistening food in small quantity {cite:canon-ibn-sina-print-v1 p.247}."
  es: "Ibn Sina señala que el exceso de ejercicio con poco masaje, el exceso de relaciones sexuales y los baños frecuentes pueden provocar debilidad con expansión, tratada con ejercicios restaurativos, masajes secos con un aceite astringente y alimentos humectantes en pequeñas cantidades {cite:canon-ibn-sina-print-v1 p.247}."
  fr: "Ibn Sina note que l'excès d'exercice avec peu de frottement, les rapports sexuels excessifs et les bains fréquents peuvent être suivis d'une faiblesse avec expansion, traitée par des exercices réparateurs, un frottement à sec avec une huile astringente et des aliments humidifiants en petite quantité {cite:canon-ibn-sina-print-v1 p.247}."
  ur: "ابن سینا نوٹ کرتے ہیں کہ تھوڑی رگڑ کے ساتھ زیادہ ورزش، زیادہ جماع اور کثرت سے نہانے سے کمزوری بڑھ جاتی ہے، اس کا علاج بحال کرنے والی ورزش سے، خشک رگڑ کو کسی تیل سے کرنے اور کھانے کو کم مقدار میں گیلا کرنے سے۔"
