summary:
  ar: "يعد ابن سينا الحقنة معالجة فاضلة في نفض الفضول عن الأمعاء وجذبها عن الأعضاء الرئيسية العالية، وينبه إلى أن الحادة منها تؤذي الكبد وتورث الحمى، وأن أفضل أوضاع المحتقن الاستلقاء ثم الاضطجاع على جانب الوجع، وأن أفضل أوقاتها برد الهواء، وأن الحمام لا يقدم عليها في الأكثر {cite:canon-ibn-sina-print-v1 p.289}."
  en: "Ibn Sina counts the enema an excellent treatment for driving superfluities out of the intestines and drawing them from the upper principal organs, but warns that sharp ones harm the liver and bring fever, that the best position is lying on the back and then on the painful side, that the best time is the cool of the air, and that the bath usually should not come before it {cite:canon-ibn-sina-print-v1 p.289}."
