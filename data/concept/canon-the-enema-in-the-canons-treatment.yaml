id: concept/canon-the-enema-in-the-canons-treatment
class: concept
kind: scientific
label: { ar: "الحقنة وأوقاتها وهيئتها عند ابن سينا", en: "The enema, its position and timing in the Canon", ur: "قانون میں حقنہ، اس کی ہیئت اور وقت", es: "El enema, su posición y momento en el Canon", fr: "Le lavement, sa position et son moment dans le Canon" }
summary:
  ar: "يعد ابن سينا الحقنة معالجة فاضلة في نفض الفضول عن الأمعاء وجذبها عن الأعضاء الرئيسية العالية، وينبه إلى أن الحادة منها تؤذي الكبد وتورث الحمى، وأن أفضل أوضاع المحتقن الاستلقاء ثم الاضطجاع على جانب الوجع، وأن أفضل أوقاتها برد الهواء، وأن الحمام لا يقدم عليها في الأكثر {cite:canon-ibn-sina-print-v1 p.289}."
  en: "Ibn Sina counts the enema an excellent treatment for driving superfluities out of the intestines and drawing them from the upper principal organs, but warns that sharp ones harm the liver and bring fever, that the best position is lying on the back and then on the painful side, that the best time is the cool of the air, and that the bath usually should not come before it {cite:canon-ibn-sina-print-v1 p.289}."
  es: "Ibn Sina considera el enema un excelente tratamiento para expulsar las superfluidades de los intestinos y extraerlas de los órganos principales superiores, pero advierte que los enemas fuertes dañan el hígado y provocan fiebre, que la mejor posición es tumbado boca arriba y luego sobre el lado dolorido, que el mejor momento es cuando el aire está fresco y que el baño no suele preceder a este tratamiento {cite:canon-ibn-sina-print-v1 p.289}."
  fr: "Ibn Sina considère le lavement comme un excellent traitement pour chasser les excès des intestins et les éliminer des organes supérieurs principaux, mais avertit que les lavements forts nuisent au foie et provoquent de la fièvre, que la meilleure position est allongée sur le dos puis sur le côté douloureux, que le meilleur moment est la fraîcheur de l'air et que le bain ne doit généralement pas précéder le lavement {cite:canon-ibn-sina-print-v1 p.289}."
  ur: "ابن سینا انیما کو آنتوں سے ضرورت سے زیادہ نکالنے اور اوپری اعضاء سے نکالنے کے لیے ایک بہترین علاج قرار دیتے ہیں، لیکن تنبیہ کرتے ہیں کہ تیز شے جگر کو نقصان پہنچاتی ہے اور بخار لاتی ہے، کہ بہترین حالت کمر پر اور پھر تکلیف دہ پہلو پر لیٹنا ہے، کہ بہترین وقت ہوا کا ٹھنڈا ہے، اور عام طور پر اس سے پہلے نہیں آنا چاہیے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 289}۔"
