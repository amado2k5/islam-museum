id: concept/aqsam-al-muftin
class: concept
kind: legal
label: { ar: "أقسام المفتين", en: "The four kinds of muftis", fr: "Les quatre catégories de muftis", ur: "مفتیوں کی اقسام", es: "Los cuatro tipos de muftíes", tr: "Muftilerin Bölümleri", id: "Bagian-bagian Mufti" }
summary:
  ar: "تقسيم يعرضه ابن قيم الجوزية في إعلام الموقعين للمفتين الذين نصبوا أنفسهم للفتوى: المجتهد العالم بالكتاب والسنة وأقوال الصحابة، ثم المجتهد المقيد في مذهب إمامه، ثم المجتهد في المذهب الذي لا يتعدى أقوال إمامه، ثم المقلد المحض الذي حفظ فتاوى مذهبه؛ ويبني عليه منزلة كل نوع، ومسائل تجزؤ الاجتهاد وتقليد الميت."
  en: "A classification set out by Ibn Qayyim al-Jawziyya in I'lam al-Muwaqqi'in of those who have set themselves up to give fatwas: the mujtahid who knows the Book, the Sunna and the Companions' views; the mujtahid bound to his imam's school; the mujtahid within the school who does not go beyond his imam's sayings; and the pure imitator who has memorised his school's rulings. On it he builds the standing of each kind and the questions of partial ijtihad and following a dead scholar."
  fr: "Une classification établie par Ibn Qayyim al-Jawziyya dans I’lam al-Muwaqqi’in de ceux qui se sont établis pour donner des fatwas : le mujtahid qui connaît le Livre, la Sunna et les avis des Compagnons ; le mujtahid lié à l’école de son imam ; le mujtahid au sein de l’école qui ne dépasse pas les propos de son imam ; et le pur imitateur qui a mémorisé les règles de son école. Il en déduit le statut de chaque catégorie et les questions de l’ijtihad partiel et du fait de suivre un savant défunt."
  ur: "ایک تقسیم جو ابن قیم الجوزیہ اعلام الموقعین میں ان لوگوں کی پیش کرتے ہیں جنہوں نے خود کو فتویٰ کے لیے مقرر کیا: کتاب، سنت اور اقوالِ صحابہ کا عالم مجتہد؛ اپنے امام کے مذہب کا پابند مجتہد؛ مذہب کے اندر مجتہد جو امام کے اقوال سے آگے نہ بڑھے؛ اور محض مقلد جس نے اپنے مذہب کے فتاویٰ یاد کیے۔ اسی پر وہ ہر قسم کا مرتبہ، اجتہاد کے تجزی اور میت کی تقلید کے مسائل قائم کرتے ہیں۔"
  es: "Una clasificación propuesta por Ibn Qayyim al-Jawziyya en I'lam al-Muwaqqi'in de aquellos que se han erigido en fatuas: el mujtahid que conoce el Corán, la Sunna y las opiniones de los Compañeros; el mujtahid vinculado a la escuela de su imán; el mujtahid dentro de la escuela que no va más allá de las enseñanzas de su imán; y el imitador puro que ha memorizado las normas de su escuela. Sobre esta base, fundamenta la posición de cada tipo y aborda las cuestiones del ijtihad parcial y el seguimiento de un erudito fallecido."
  tr: "İbn Keyim el-Cevziyye, fetva vermek üzere kendini atayan müftiler için 'İ'lam al-Muwaqqiyyin'de bir ayrım sunar: Kur'an, Sünnet ve Sahabelerin sözleri bilen müjtehid; sonra imamının okuluna bağlı olan müctehid; sonra imamının sözlerini aşmayan mezhebindeki müctehid; sonra kendi mezhebinin fetvalarını ezberleyip her tipin statüsünü üzerine inşa eden saf taklitçi; ve ijtihadın parçalanması ve vefat edenin ardından gelen meseleler."
  id: "Ibn Qayyim al-Jawziyyah membagi dalam 'I'lam al-Muwaqqiyyin untuk para mufti yang menunjuk diri mereka sendiri untuk mengeluarkan fatwa: mujtahid yang menguasai Al-Qur'an, Sunnah, dan perkataan para sahabat; kemudian mujtahid yang menganut mazhab imamnya; kemudian mujtahid di sekolah yang tidak melampaui pernyataan imamnya; kemudian peniru murni yang menghafal fatwa sekolahnya dan membangun status setiap jenis; serta masalah fragmentasi ijtihad dan mengikuti almarhum."
