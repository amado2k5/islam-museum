id: concept/aqsam-al-muftin
class: concept
kind: legal
label: { ar: "أقسام المفتين", en: "The four kinds of muftis", ur: "مفتیوں کی اقسام" }
summary:
  ar: "تقسيم يعرضه ابن قيم الجوزية في إعلام الموقعين للمفتين الذين نصبوا أنفسهم للفتوى: المجتهد العالم بالكتاب والسنة وأقوال الصحابة، ثم المجتهد المقيد في مذهب إمامه، ثم المجتهد في المذهب الذي لا يتعدى أقوال إمامه، ثم المقلد المحض الذي حفظ فتاوى مذهبه؛ ويبني عليه منزلة كل نوع، ومسائل تجزؤ الاجتهاد وتقليد الميت."
  en: "A classification set out by Ibn Qayyim al-Jawziyya in I'lam al-Muwaqqi'in of those who have set themselves up to give fatwas: the mujtahid who knows the Book, the Sunna and the Companions' views; the mujtahid bound to his imam's school; the mujtahid within the school who does not go beyond his imam's sayings; and the pure imitator who has memorised his school's rulings. On it he builds the standing of each kind and the questions of partial ijtihad and following a dead scholar."
  ur: "ایک تقسیم جو ابن قیم الجوزیہ اعلام الموقعین میں ان لوگوں کی پیش کرتے ہیں جنہوں نے خود کو فتویٰ کے لیے مقرر کیا: کتاب، سنت اور اقوالِ صحابہ کا عالم مجتہد؛ اپنے امام کے مذہب کا پابند مجتہد؛ مذہب کے اندر مجتہد جو امام کے اقوال سے آگے نہ بڑھے؛ اور محض مقلد جس نے اپنے مذہب کے فتاویٰ یاد کیے۔ اسی پر وہ ہر قسم کا مرتبہ، اجتہاد کے تجزی اور میت کی تقلید کے مسائل قائم کرتے ہیں۔"
