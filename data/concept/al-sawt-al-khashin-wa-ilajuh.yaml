id: concept/al-sawt-al-khashin-wa-ilajuh
class: concept
kind: scientific
label:
  ar: "الصوت الخشن وعلاجه"
  en: "The harsh voice and its treatment"
  fr: "La voix rude et son traitement"
  ur: "خشن آواز اور اس کا علاج"
summary:
  ar: "تعرض خشونة الصوت من توتر عضل ومن البرد ومن حالة كالتشنج تعرض فيها ومن جفاف رطوبتها بكثرة الترنم ومن قطع اللهاة ومن السهر ومن سبب آخر يذكره الكتاب ⁦(سطر موسوم)⁩، وعلاجه الحمية عن الأسباب التي ذكرها وترك الترنم وتناول الملينات المذكورة في باب البحوحة، ومن عرض له ذلك من قطع اللهاة فالصواب له أن يتغرغر بمغلي من هذا الجنس ممزوج بماء حار ويسقى منه وعتيقه أنفع من طريه على لفظ الكتاب ⁦(أسماء الأدوية والأغذية ومقاديرها وصورها مستثناة بحسب القاعدة)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
  en: "The voice's harshness arises from a muscle's tension, from cold, from a convulsion-like state befalling in it, from the drying of its moisture by much chanting, from the uvula's cutting, from sleeplessness, and from another cause the book names (a labelled line). Its treatment is the diet away from the causes he mentioned, leaving chanting, and taking the softening means mentioned in the huskiness chapter; whoever is struck by it from the uvula's cutting should gargle with a decoction of this kind mixed with hot water and be given it to drink, its old better than its fresh, on the book's wording (the drug and food names, measures and forms are excluded per the rule) {cite:canon-ibn-sina-print-v2 p.326}"
  fr: "La rudesse de la voix naît de la tension d’un muscle, du froid, d’un état semblable à la convulsion qui y survient, du dessèchement de son humidité par une psalmodie fréquente, de la coupure de la luette, de l’insomnie, et d’une autre cause que nomme le livre (une ligne signalée). Son traitement est le régime qui écarte les causes qu’il a mentionnées, l’abandon de la psalmodie et le recours aux moyens émollients mentionnés dans le chapitre sur l’enrouement ; celui qui en est atteint à la suite de la coupure de la luette doit se gargariser d’une décoction de ce genre mélangée à de l’eau chaude et en boire, l’ancienne valant mieux que la fraîche, selon la formulation du livre (les noms des remèdes et des aliments, les mesures et les formes sont exclus selon la règle) {cite:canon-ibn-sina-print-v2 p.326}"
  ur: "آواز کی خشونی پٹھے کے کھچاؤ سے اور ٹھنڈ سے اور ایک ایسی حالت سے جو اس میں تشنج کی طرح ہوتی ہے اور زیادہ ترنم سے اس کی رطوبت خشک ہونے سے اور لہاٹ کے کٹنے سے اور بیداری سے اور ایک اور سبب سے جو کتاب بیان کرتی ہے ⁦(موسوم سطر)⁩ ہوتی ہے؛ اس کا علاج مذکور اسباب سے پرہیز اور ترنم چھوڑنا اور باب بھاری پن میں بتائی گئی نرم کرنے والی چیزوں کا استعمال ہے؛ اور جسے لہاٹ کے کٹنے سے یہ عرض ہو اس کے لیے درست یہ ہے کہ اسی جنس کے جوشاندے کو گرم پانی میں ملا کر غرارے کرے اور اسے پلایا جائے اور اس کا پرانا تازے سے زیادہ مفید ہے کتاب کے لفظ پر ⁦(ادویہ اور خوراکوں کے نام مقداریں اور صورتیں اصول کے مطابق مستثنیٰ ہیں)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
