summary:
  ar: "القنب في الكتاب بزره يطرد الرياح ويجفف وهو عسر الانهضام قوي الإسخان، والحاشية تقول إنه الشهدانج، وعصارته ودهنه ينفعان لوجع الأذن، ويذكر الكتاب أن الإكثار من بزره يقطع المني {cite:canon-ibn-sina-print-v1 pp.653-654}"
  en: "Qinnab is in the book a plant whose seed drives out winds and dries and is hard to digest and strongly heating; the editor's note says it is shahdanaj; its juice and oil benefit earache; the book lists that much of its seed cuts the semen {cite:canon-ibn-sina-print-v1 pp.653-654}"
  ur: "قنب کتاب میں ایک پودا ہے جس کا بیج ریاح کو دور کرتا اور خشک کرتا ہے، دیر ہضم اور سخت گرم ہے؛ حاشیے کے مطابق یہ شہدانج ہے؛ اس کا رس اور تیل کان کے درد میں نافع ہیں؛ کتاب میں درج ہے کہ اس کے بیج کی کثرت منی کو منقطع کرتی ہے {cite:canon-ibn-sina-print-v1 pp.653-654}۔"
  es: "En el libro, Qinnab es una planta cuya semilla ahuyenta los vientos, seca, es difícil de digerir y produce un fuerte calor; la nota del editor dice que es shahdanaj; su jugo y aceite son beneficiosos para el dolor de oído; el libro menciona que gran parte de su semilla corta el semen {cite:canon-ibn-sina-print-v1 pp.653-654}."
  fr: "Le Qinnab est décrit dans le livre comme une plante dont la graine chasse les vents, dessèche, est difficile à digérer et fortement réchauffante; la note de l'éditeur indique qu'il s'agit du shahdanaj; son jus et son huile sont bénéfiques contre les maux d'oreilles; le livre mentionne qu'une grande partie de sa graine réduit le sperme {cite:canon-ibn-sina-print-v1 pp.653-654}"
  tr: "Kitaptaki kenevir tohumu rüzgarı dışarı atar ve kurutur, sindirilmez ve çok sıcaktır. Dipnotta bunun Shahdanj olduğu ve suyu ile yağının kulak ağrısı için faydalı olduğu belirtilir. Kitapta aşırı tohumun meni kestiği belirtilir {cite:canon-ibn-sina-print-v1 s.653-654}"
  id: "Biji ganja dalam buku itu mengeluarkan angin dan mengeringkannya, dan benih ini tidak tercerna serta sangat panas. Catatan kaki mengatakan itu adalah Shahdanj, dan jus serta minyaknya bermanfaat untuk sakit telinga. Buku tersebut menyebutkan bahwa biji berlebih memotong sperma {cite:canon-ibn-sina-print-v1 hlm.653-654}"
