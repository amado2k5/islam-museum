  ar: "القنب في الكتاب بزره يطرد الرياح ويجفف وهو عسر الانهضام قوي الإسخان، والحاشية تقول إنه الشهدانج، وعصارته ودهنه ينفعان لوجع الأذن، ويذكر الكتاب أن الإكثار من بزره يقطع المني {cite:canon-ibn-sina-print-v1 pp.653-654}"
