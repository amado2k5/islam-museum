id: concept/hurmat-al-dam
class: concept
kind: legal
label:
  ar: حرمة دم المسلم
  en: The sanctity of a Muslim's blood
summary:
  ar: "تحريم دم من شهد أن لا إله إلا الله وأن محمداً رسول الله إلا بإحدى ثلاث خصال كما في حديث ابن مسعود في الصحيحين: «الثيب الزاني، والنفس بالنفس، والتارك لدينه المفارق للجماعة»، وفي رواية عثمان عند الترمذي والنسائي وابن ماجه بألفاظ أوضح «كفر بعد إسلامه، أو زنى بعد إحصانه، أو قتل نفساً بغير نفس»، وفي إحدى روايات النسائي بيان الحكم في كل واحدة؛ يسمي ابن رجب هذه الخصال الثلاث حق الإسلام التي يستباح بها الدم، وينقل أن القتل بكل واحدة منها متفق عليه بين المسلمين، وأن المسلمين أجمعوا على أن حد من زنى وهو ثيب الرجم حتى يموت — وقد رجم النبي ماعزاً والغامدية — وأن الرجم كان مما نسخ لفظه من القرآن، واستنبطه ابن عباس من قوله تعالى في المائدة: «تخفون من الكتاب»؛ وفي رواية عمر بن الخطاب خشية أن يأتي زمان يقول فيه أقوام لا نجد الرجم في كتاب الله فيضلوا بترك فريضة أنزلها الله."
  en: "The inviolability of the blood of one who testifies that there is no god but God and that Muhammad is His messenger, lifted in only three cases as in Ibn Masud's hadith in the two Sahihs — 'the previously-married adulterer, a life for a life, and the one who abandons his religion, leaving the community' — Uthman's version in al-Tirmidhi, al-Nasa'i and Ibn Majah running 'disbelieves after his Islam, commits adultery after being chaste, or kills a soul without due cause', with one of al-Nasa'i's routes spelling out the ruling in each; Ibn Rajab calls these three the claim of Islam by which blood may lawfully be shed, transmits that killing for each is agreed among Muslims, that Muslims agree the previously-married adulterer's hadd is stoning until death — the Prophet having stoned Ma'iz and the Ghamidiyya woman — that stoning stood among what was abrogated from the Quran's wording, and that Ibn Abbas derived it from al-Ma'ida's 'you used to hide of the scripture'; Umar's version adds his fear that a time would come when people, not finding stoning in God's book, would stray by abandoning an obligation God sent down."
