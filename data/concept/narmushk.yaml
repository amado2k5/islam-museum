summary:
  ar: "النارمشك في الكتاب فقاح وقشور وأقماع تشبه البسباسة، عطر قليل العفوصة يقارب الناردين في القوة ويقال له ناغبشت، حار يابس في الثالثة لطيف محلل، جيد للمعدة والكبد الباردتين {cite:canon-ibn-sina-print-v1 p.578}."
  en: "Narmushk is in the book buds, husks and calyces like mace, fragrant with a little astringency, near nardin in power and also called naghbusht; hot and dry in the third degree, fine and dissolving, good for the cold stomach and liver {cite:canon-ibn-sina-print-v1 p.578}."
  ur: "نارمشک کتاب میں کلیاں، چھلکے اور ڈنڈیاں ہیں جو بسباسہ ⁦(جاوتری)⁩ سے ملتی ہیں، خوشبودار، قدرے کسیلی، قوت میں ناردین کے قریب اور ناغبشت بھی کہلاتی ہے؛ تیسرے درجے میں گرم خشک، لطیف اور تحلیل کرنے والی، ٹھنڈے معدے اور جگر کے لیے اچھی {cite:canon-ibn-sina-print-v1 p.578}۔"
  es: "Narmushk es en el libro brotes, cáscaras y cálices como macis, fragante con un poco de astringencia, cercano al nardin en potencia y también llamado naghbusht; caliente y seco en tercer grado, fino y disolvente, bueno para el estómago y el hígado fríos {cite:canon-ibn-sina-print-v1 p.578}."
