label:
  ar: "إرصاد"
  en: "Irsad (assigning the revenue of bayt al-mal)"
  ur: "ارصاد ⁦(بیت المال کی آمدنی مخصوص کرنا)⁩"
  es: "Irsad (asignación de los ingresos de bayt al-mal)"
  fr: "Irsad (attribution des revenus du bayt al-mal)"
  tr: "Meteoroloji"
  id: "Meteorologi"
summary:
  ar: "الإرصاد تخصيص الإمام غلة بعض أراضي بيت المال لبعض مصارفه، وهو عند الحنفية أيضا تخصيص ريع الوقف لسداد ديونه. وفي حقيقته رأيان: أنه غير الوقف لأن المرصِد لا يملك ما يرصده، أو أنه وقف لأن السلطان وكيل عن المسلمين. وهو مشروع باتفاق، بل واجب إذا لم تتأمن المصالح إلا به، ويفترق عن الإقطاع والحمى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2189}"
  en: "Irsad is the imam's assignment of the yield of some bayt al-mal lands to some of its expenditures, and for the Hanafis also the assignment of a waqf's revenue to pay its debts. Its nature is disputed: it is either not a waqf, since the assignor owns nothing of what he assigns, or a waqf, since the sultan acts as agent for the Muslims. It is lawful by agreement, and obligatory where public interests cannot be secured without it; it differs from iqta' and hima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2189}"
  ur: "ارصاد امام کا بیت المال کی کچھ زمینوں کی آمدنی کو اس کے کچھ مصارف کے لیے مخصوص کرنا ہے، اور حنفیہ کے نزدیک وقف کی آمدنی کو اس کے قرضوں کی ادائیگی کے لیے مخصوص کرنا بھی۔ اس کی حقیقت میں اختلاف ہے: یہ وقف نہیں کیونکہ مرصِد اپنی مخصوص کی ہوئی چیز کا مالک نہیں، یا وقف ہے کیونکہ سلطان مسلمانوں کا وکیل ہے۔ یہ اتفاقاً جائز ہے، اور جہاں عام مصلحتیں اس کے بغیر محفوظ نہ ہوں وہاں واجب ہے؛ یہ اقطاع اور حمی سے مختلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2189}"
  es: "Irsad es la cesión por parte del imán de la producción de algunas tierras bayt al-mal para cubrir parte de sus gastos, y para los hanafíes también la cesión de los ingresos de un waqf para pagar sus deudas. Su naturaleza es objeto de debate: o bien no es un waqf, puesto que el cedente no posee nada de lo que cede, o bien es un waqf, puesto que el sultán actúa como agente de los musulmanes. Es lícito por acuerdo y obligatorio cuando no se pueden garantizar los intereses públicos sin él; difiere de iqta' e hima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2189}"
  fr: "L'irsad est l'affectation par l'imam des revenus de certaines terres du bayt al-mal à certaines de ses dépenses. Pour les hanafites, il s'agit également de l'affectation des revenus d'un waqf au paiement de ses dettes. Sa nature est controversée: soit il ne s'agit pas d'un waqf, puisque le donateur ne possède rien de ce qu'il affecte, soit il s'agit d'un waqf, puisque le sultan agit comme mandataire des musulmans. Il est licite par convention et obligatoire lorsque l'intérêt public ne peut être garanti sans lui; il diffère de l'iqta' et de la hima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2189}"
  tr: "Ölçüm, Beytül-Mal topraklarının bazı gelirlerinin bazı harcamalarına tahsis edilmesidir ve Hanefilere göre, vakıfın borçlarını ödemek için gelirin tahsisidir. Gerçekte iki görüş vardır: vakıftan farklı olduğu çünkü gözlemevi kaydettiklerine sahip değildir ya da vakıf olduğu çünkü otorite Müslümanların temsilcisi olduğu için. Uzlaşmayla yasalaştırılır, menfaatler ancak bu vakıf aracılığıyla güvence altına alınırsa zorunludur ve feodalizm ile güvensizlikten farklıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2189}"
  id: "Survei adalah alokasi hasil dari sebagian tanah Bayt al-Mal untuk beberapa pengeluarannya, dan menurut Hanafi, ini juga merupakan alokasi hasil dari wakaf untuk melunasi utangnya. Sebenarnya, ada dua pendapat: bahwa ini berbeda dari wakaf karena observatorium tidak memiliki apa yang dicatatnya, atau bahwa itu adalah wakaf karena otoritas adalah agen umat Muslim. Wakaf diatur melalui konsensus, bahkan wajib jika kepentingan tidak dijamin kecuali melalui dana tersebut, dan berbeda dari feodalisme dan ketidakamanan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2189}"
