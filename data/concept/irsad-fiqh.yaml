label:
  ar: "إرصاد"
  en: "Irsad (assigning the revenue of bayt al-mal)"
  ur: "ارصاد (بیت المال کی آمدنی مخصوص کرنا)"
summary:
  ar: "الإرصاد تخصيص الإمام غلة بعض أراضي بيت المال لبعض مصارفه، وهو عند الحنفية أيضا تخصيص ريع الوقف لسداد ديونه. وفي حقيقته رأيان: أنه غير الوقف لأن المرصِد لا يملك ما يرصده، أو أنه وقف لأن السلطان وكيل عن المسلمين. وهو مشروع باتفاق، بل واجب إذا لم تتأمن المصالح إلا به، ويفترق عن الإقطاع والحمى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2189}"
  en: "Irsad is the imam's assignment of the yield of some bayt al-mal lands to some of its expenditures, and for the Hanafis also the assignment of a waqf's revenue to pay its debts. Its nature is disputed: it is either not a waqf, since the assignor owns nothing of what he assigns, or a waqf, since the sultan acts as agent for the Muslims. It is lawful by agreement, and obligatory where public interests cannot be secured without it; it differs from iqta' and hima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2189}"
  ur: "ارصاد امام کا بیت المال کی کچھ زمینوں کی آمدنی کو اس کے کچھ مصارف کے لیے مخصوص کرنا ہے، اور حنفیہ کے نزدیک وقف کی آمدنی کو اس کے قرضوں کی ادائیگی کے لیے مخصوص کرنا بھی۔ اس کی حقیقت میں اختلاف ہے: یہ وقف نہیں کیونکہ مرصِد اپنی مخصوص کی ہوئی چیز کا مالک نہیں، یا وقف ہے کیونکہ سلطان مسلمانوں کا وکیل ہے۔ یہ اتفاقاً جائز ہے، اور جہاں عام مصلحتیں اس کے بغیر محفوظ نہ ہوں وہاں واجب ہے؛ یہ اقطاع اور حمی سے مختلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2189}"
