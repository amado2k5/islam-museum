id: concept/qurra-al-amsar
class: concept
kind: term
label:
  ar: "قراء الأمصار: من الصحابة إلى أئمة القراءة"
  en: "The readers of the garrison cities: from the Companions to the imams of recitation"
  ur: "شہروں کے قراء: صحابہ سے ائمۂ قراءت تک"
  es: "Los lectores de las ciudades guarnición: de los Compañeros a los imanes de la recitación"
  fr: "Les lecteurs des villes de garnison: des Compagnons aux imams de la récitation"
  tr: "Bölgelerin Okunucuları: Sahabelerden İmamlara"
  id: "Para Pembaca Wilayah: Dari Para Sahabat hingga Imam Pembacaan"
summary:
  ar: "يعدّد ابن الجزري في «النشر» من اشتهر بالقراءة في الأمصار من التابعين: بالمدينة ابن المسيب وعروة وسالم وابن شهاب، وبمكة عبيد بن عمير وعطاء وطاووس ومجاهد، وبالكوفة علقمة والأسود ومسروق والنخعي والشعبي، وبالبصرة أبو العالية ونصر بن عاصم ويحيى بن يعمر والحسن وابن سيرين وقتادة، وبالشام المغيرة بن أبي شهاب {cite:nashr-dahman-damascus-1345-v1 p. 18}."
  en: "Ibn al-Jazari lists in al-Nashr the Successors famed for reciting in the garrison cities: in Medina Ibn al-Musayyib, Urwa, Salim and Ibn Shihab; in Mecca Ubayd ibn Umayr, Ata', Tawus and Mujahid; in Kufa Alqama, al-Aswad, Masruq, al-Nakha'i and al-Sha'bi; in Basra Abu al-Aliya, Nasr ibn Asim, Yahya ibn Ya'mar, al-Hasan, Ibn Sirin and Qatada; in Syria al-Mughira ibn Abi Shihab {cite:nashr-dahman-damascus-1345-v1 p. 18}."
  ur: "ابن الجزری «النشر» میں ان تابعین کو گنواتے ہیں جو شہروں میں قراءت سے مشہور ہوئے: مدینہ میں ابن المسیب، عروہ، سالم اور ابن شہاب؛ مکہ میں عبید بن عمیر، عطاء، طاؤس اور مجاہد؛ کوفہ میں علقمہ، اسود، مسروق، نخعی اور شعبی؛ بصرہ میں ابو العالیہ، نصر بن عاصم، یحییٰ بن یعمر، حسن، ابن سیرین اور قتادہ؛ شام میں مغیرہ بن ابی شہاب {cite:nashr-dahman-damascus-1345-v1 p. 18}۔"
  es: "Ibn al-Jazari enumera en al-Nashr a los Sucesores famosos por recitar en las ciudades guarnición: en Medina Ibn al-Musayyib, Urwa, Salim e Ibn Shihab; en La Meca Ubayd ibn Umayr, Ata', Tawus y Mujahid; en Kufa Alqama al-Aswad, Masruq, al-Nakha'i y al-Sha'bi; en Basora Abu al-Aliya, Nasr ibn Asim, Yahya ibn Ya'mar, al-Hasan, Ibn Sirin y Qatada; en Siria al-Mughira ibn Abi Shihab {cita:nashr-dahman-damascus-1345-v1 p. 18}."
  fr: "Ibn al-Jazari énumère dans al-Nashr les successeurs célèbres pour réciter dans les villes de garnison: à Médine Ibn al-Musayyib, Urwa, Salim et Ibn Shihab; à la Mecque Ubayd ibn Umayr, Ata', Tawus et Mujahid; à Kufa Alqama al-Aswad, Masruq, al-Nakha'i et al-Sha'bi; à Bassora Abu al-Aliya, Nasr ibn Asim, Yahya ibn Ya'mar, al-Hasan, Ibn Sirin et Qatada; en Syrie al-Mughira ibn Abi Shihab {cite:nashr-dahman-damascus-1345-v1 p. 18}."
  tr: "İbn el-Cezeri, 'El-Nashr'da, takipçileri arasında topraklarda okuyan eserlerle ünlenenleri listeler: Medine'de İbn el-Musayyib, Urve, Salim ve İbn Şihab'da; Mekke'de Übeyd ibn Umair, Ata, Tavus ve Mücahid; Kufa'da, Alkame'de, El-Esvad'da, Mesruk'ta, el-Nakhai ve el-Şa'bi'de; Basra'da Ebu el-Aliyah, Nasr ibn Asim, Yahya ibn Ya'mar, el-Hasan, İbn Sirin ve Katada'da; ve Levant'ta el-Muğira ibn Ebi Şihab'da {atıf:nashr-dahman-damascus-1345-v1, s. 18}."
  id: "Ibn al-Jazari mencantumkan dalam 'Al-Nashr' mereka yang terkenal karena melafalkan di tanah-tanah di antara para pengikut: di Madinah, Ibn al-Musayyib, Urwah, Salim, dan Ibn Shihab; di Mekah, Ubayd ibn Umair, Ata, Tawu, dan Mujahid; di Kufa, Alqamah, Al-Aswad, Masruq, al-Nakha'i, dan al-Sha'bi; di Basra, Abu al-'Aliyah, Nasr ibn Asim, Yahya ibn Ya'mar, al-Hasan, Ibn Sirin, dan Qatadah; dan di Levant, al-Mughira ibn Abi Shihab {cite:nashr-dahman-damascus-1345-v1, hlm. 18}."
