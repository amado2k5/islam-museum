id: concept/iwad
class: concept
kind: legal
label:
  ar: "العِوَض"
  en: "Consideration (iwad) in contracts, marriage, injury and damage"
  ur: "عوض (بدل)"
summary:
  ar: "العوض في اللغة البدل، وهو ما يبذل في مقابلة شيء، ويطلق على الثواب في الآخرة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11928}. وأوجب الفقهاء أداء العوض في عقود المعاوضات، ويجب على المؤجر والمستأجر وعلى الزوج صداق امرأته، وعلى من أتلف شيئاً مثله أو قيمته، وعلى الجاني الدية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11931}. ومن الأعواض ما لا يصح عوضاً كالدم والميتة والخمر وجعل البضع مهراً في الشغار {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11930}. والأعواض مالية أو غير مالية، ومن شروطها أن تكون معلومة ومقدرة عند عقود المعاوضات حسماً للنزاع، وقد قدر الشارع بعض الأعواض كالدية والفدية والكفارات {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11938}. وتسقط الأعواض بهلاك المعقود عليه، أو بالإبراء، أو بالعفو، أو بالإسلام في الجزية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11943}."
  en: "In the lexicon, iwad is a substitute, what is given in return for a thing; it is also used of the reward in the hereafter {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11928}. The jurists require that the consideration be paid in exchange contracts: the hirer and the lessor, the husband's dower, the one who destroys a thing must return its like or its value, and the killer owes the blood-money {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11931}. Some things cannot be a consideration, such as blood, carrion and wine, and making a woman's intimacy the dower in a shighar exchange {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11930}. Considerations are either financial or not, and in exchange contracts they must be known and fixed to end disputes; the law fixes some, such as the blood-money, the ransom and the expiations {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11938}. A consideration lapses when the object perishes, by release of a debt, by pardon, or by conversion to Islam in the case of the poll-tax {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11943}."
