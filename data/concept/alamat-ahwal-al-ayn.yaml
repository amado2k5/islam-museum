class: "concept"
kind: "scientific"
label:
  ar: "علامات أحوال العين وأمراضها"
  en: "Signs of the eye's states and diseases"
  fr: "Les signes des états et des maladies de l’œil"
  ur: "آنکھ کے احوال و امراض کی علامات"
  es: "Signos de afecciones y enfermedades oculares"
  tr: "Gözün Belirtileri ve Hastalıkları"
  id: "Gejala dan Penyakit Mata"
summary:
  ar: "علامات مرض العين بشركة الدماغ أن يكون في الدماغ دلائل آفاته فإن كانت الواسطة الحجب الباطنة ابتدأ الوجع والألم من غور العين مع عطاس وحكة إن كانت المادة حارة وسيلان بارد إن باردة، وإن كانت المشاركة بالحجب الخارجة تمددت الجبهة والعروق الخارجة وظهرت المضرة فيما يلي الجفن، ويدل الدموي على الثقل والحمرة والدمع وضربان الصدغين والبلغمي على ثقل مع حمرة خفية رصاصية والصفراوي على النخس والالتهاب مع حمرة إلى صفرة {cite:canon-ibn-sina-print-v2 p.164}"
  en: "The sign of eye disease shared with the brain is that the brain bears proofs of its own lesions; when the intermediary is the inner membranes the pain begins from the eye's depth, with sneezing and nose-itch if the matter is hot or a cold flow if cold; when the sharing is with the outer membranes brow and outer veins distend and the harm shows most below the lid; the sanguineous kind is told by heaviness, redness, tears and pulsing temples, the phlegmy by heaviness with a faint leaden redness, the choleric by pricking and burning with yellower redness {cite:canon-ibn-sina-print-v2 p.164}"
  fr: "Le signe de la maladie de l’œil partagée avec le cerveau est que le cerveau porte les preuves de ses propres lésions ; lorsque l’intermédiaire est constitué par les membranes internes, la douleur commence dans la profondeur de l’œil, avec éternuements et démangeaison du nez si la matière est chaude, ou un écoulement froid si elle est froide ; lorsque la participation se fait avec les membranes externes, le front et les veines externes se distendent et le dommage se montre surtout sous la paupière ; l’espèce sanguine se reconnaît à la lourdeur, la rougeur, les larmes et les tempes qui battent, l’espèce phlegmatique à la lourdeur avec une faible rougeur plombée, l’espèce bilieuse à la piqûre et à la brûlure avec une rougeur plus jaune {cite:canon-ibn-sina-print-v2 p.164}"
  ur: "دماغ کی شرکت سے آنکھ کے مرض کی علامت یہ ہے کہ دماغ میں اس کی اپنی آفتوں کی دلیلیں ہوں؛ اگر وسیلہ اندرونی حجاب ہوں تو درد آنکھ کی گہرائی سے شروع ہوتا ہے، مادہ گرم ہو تو چھینک اور ناک کی خارش، ٹھنڈا ہو تو ٹھنڈا سیلان؛ اگر شرکت بیرونی حجابوں سے ہو تو پیشانی اور بیرونی رگیں تَن جاتی ہیں اور نقصان پلک کے نیچے زیادہ دکھتا ہے؛ دموی کی دلیل بھاری پن، سرخی، آنسو اور کنپٹیوں کی دھڑکن، بلغمی کی بھاری پن کے ساتھ ہلکی سیسہ جیسی سرخی، صفراوی کی چبھن اور جلن کے ساتھ زرد مائل سرخی ہے {cite:canon-ibn-sina-print-v2 p.164}"
  es: "El signo de una enfermedad ocular compartida con el cerebro es que el cerebro presenta evidencias de sus propias lesiones; cuando el intermediario son las membranas internas, el dolor comienza en la profundidad del ojo, con estornudos y picazón nasal si la materia es caliente o un flujo frío si es fría; cuando la afectación se da en las membranas externas, la frente y las venas externas se distienden y el daño se manifiesta más debajo del párpado; la forma sanguínea se caracteriza por pesadez, enrojecimiento, lagrimeo y pulsaciones en las sienes, la flemática por pesadez con un leve enrojecimiento plomizo, la colérica por punzadas y ardor con un enrojecimiento más amarillento {cite:canon-ibn-sina-print-v2 p.164}"
  tr: "Beyindeki göz hastalığı belirtileri arasında beyinde lezyonlar bulunur. Orta profil iç tıkanıklık ise, ağrı ve ağrı gözün derinliklerinden başlar; madde sıcaksa hapşırma ve kaşıntı, soğuk veya soğuk burun akıntısı eşlik eder. Dış tıkanıklık varsa, alın ve dış damarlar genişler ve zararlı belirtiler ortaya çıkar. Aşağıda, göz kapağı ağırlık, kızarıklık, yırtılma ve şakaklarda karıncalanma, flegmatik ise hafif kurşun benzeri kızarıklık, boğazda safra ve iltihaplanma, sararıklıktan sararmaya kadar şiddetle işaret eder. {cite:canon-ibn-sina-print-v2 s.164}"
  id: "Di antara gejala penyakit mata di otak adalah lesi di otak. Jika ini adalah oklusi internal profil sedang, rasa sakit dan ketidaknyamanan dimulai dari dalam mata; jika zat panas, bersin dan gatal, disertai dengan cairan hidung yang dingin atau dingin. Jika ada sumbatan eksternal, dahi dan pembuluh darah eksternal akan mengembang, dan gejala berbahaya muncul. Di bawah, kelopak mata ditandai dengan rasa berat, kemerahan, robekan, dan kesemutan di pelipis; jika kemerahan halus, empedu, dan peradangan di tenggorokan yang ringan seperti timbal, dari menguning hingga menguning, sangat diindikasikan. {cite:canon-ibn-sina-print-v2 hlm.164}"
