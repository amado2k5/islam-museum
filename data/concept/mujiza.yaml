label: { ar: "المعجزة", en: "Miracle (mu'jiza)", es: "Milagro (mu'jiza)", fr: "Miracle (mu'jiza)", ur: "معجزہ ⁦(مجیزا)⁩", tr: "Mucize", id: "Keajaiban" }
summary:
  ar: "قرر ابن خلدون أن الخوارق التي تقع للأنبياء شاهدة بصدقهم أفعال يعجز البشر عن مثلها فسميت معجزة، وليست من جنس مقدور العباد، والمتكلمون على القول بالفاعل المختار يقولون إنها واقعة بقدرة الله لا بفعل النبي وليس للنبي فيها إلا التحدي بها بإذن الله فيتنزل إذا وقعت منزلة القول الصريح من الله بالتصديق فتكون دلالتها قطعية، والتحدي هو الفارق بينها وبين الكرامة والسحر، وأما الفلاسفة فالخارق عندهم من فعل النبي لما للنفس النبوية من خواص ذاتية وطاعة العناصر لها في التكوين ولا يكون التحدي جزءاً منها، وأعظم المعجزات عنده القرآن لأنه بنفسه الوحي المدعى وهو الخارق المعجز فشاهده في عينه ولا يفتقر إلى دليل مغاير له {cite:muqaddima-ibn-khaldun p. 91-93}."
  en: "Miracles authenticate prophets by tahaddi — God effecting the challenge — while the Quran, being itself the revelation, needs no external proof {cite:muqaddima-ibn-khaldun p. 91-93}."
  es: "Los milagros autentican a los profetas mediante el tahaddi —Dios efectúa el desafío— mientras que el Corán, al ser él mismo la revelación, no necesita prueba externa {cite:muqaddima-ibn-khaldun p. 91-93}."
  fr: "Les miracles authentifient les prophètes par tahaddi — Dieu effectuant le défi — tandis que le Coran, étant lui-même la révélation, n'a besoin d'aucune preuve externe {cite:muqaddima-ibn-khaldun p. 91-93}."
  ur: "معجزات تہدی کے ذریعہ انبیاء کی تصدیق کرتے ہیں - خدا چیلنج کو متاثر کرتا ہے - جبکہ قرآن خود وحی ہونے کے ناطے کسی بیرونی ثبوت کی ضرورت نہیں ہے {حوالہ: مقدّمہ ابن خلدون صفحہ 91-93}۔"
  tr: "İbn Haldun, peygamberlerin başına gelen mucizelerin, insanların yapamadığı eylemlere karşı doğruluklarıyla tanıklık edildiğini ortaya koymuştur; bu yüzden mucizeler olarak adlandırılır, hizmetkârların yapabileceği türden mucizeler değildir. Seçilmiş vasiyetten bahsedenler bunların Allah'ın gücüyle gerçekleştiğini, Peygamber'in eylemiyle değil, Peygamber'in onları sorgulamaktan başka seçeneği olmadığını söyler. Dolayısıyla, Allah'ın açık inanç beyanı düşerse, önemi mutlaktır. Zorluk, mucizeler ve büyü arasındaki farktır. Filozoflar için ise, doğaüstü Peygamber'in eylemidir çünkü peygamberlik ruhunun doğasında olan özellikler ve ona itaat eden unsurlar vardır ve meydan okuma bunun parçası değildir. Onun için en büyük mucize Kur'an'dır, çünkü o da iddia edilen vahiy, mucizevi doğaüstü ve bunu kendi gözleriyle görmüştür, ona karşı hiçbir kanıt yoktu {alıntı::) Muqaddima-ibn-Haldun, s. 91-93}."
  id: "Ibn Khaldun menetapkan bahwa mukjizat yang terjadi pada para nabi disaksikan melalui kebenaran terhadap tindakan yang tidak dapat dilakukan manusia, sehingga disebut mukjizat, bukan seperti yang bisa dilakukan oleh hamba. Mereka yang berbicara tentang agen terpilih mengatakan mukjizat itu terjadi oleh kuasa Allah, bukan oleh tindakan Nabi, dan Nabi tidak punya pilihan selain menantangnya dengan izin Tuhan. Jadi, jika status pernyataan iman eksplisit Tuhan jatuh, maknanya mutlak. Tantangannya adalah perbedaan antara mukjizat dan sihir. Adapun para filsuf, hal supranatural adalah tindakan Nabi karena jiwa nabi memiliki sifat intrinsik dan ketaatan unsur-unsur terhadapnya dalam pembentukan, dan tantangan bukan bagian darinya. Mukjizat terbesar baginya adalah Al-Qur'an, karena itu sendiri adalah wahyu yang diklaim, supranatural mukjizat dan dia menyaksikannya dengan matanya sendiri tanpa bukti yang bertentangan {cite:muqaddima-ibn-khaldun, hlm. 91-93}."
