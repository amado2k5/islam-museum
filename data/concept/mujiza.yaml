id: concept/mujiza
class: concept
kind: term
label: { ar: "المعجزة", en: "Miracle (mu'jiza)" }
summary:
  ar: "قرر ابن خلدون أن الخوارق التي تقع للأنبياء شاهدة بصدقهم أفعال يعجز البشر عن مثلها فسميت معجزة، وليست من جنس مقدور العباد، والمتكلمون على القول بالفاعل المختار يقولون إنها واقعة بقدرة الله لا بفعل النبي وليس للنبي فيها إلا التحدي بها بإذن الله فيتنزل إذا وقعت منزلة القول الصريح من الله بالتصديق فتكون دلالتها قطعية، والتحدي هو الفارق بينها وبين الكرامة والسحر، وأما الفلاسفة فالخارق عندهم من فعل النبي لما للنفس النبوية من خواص ذاتية وطاعة العناصر لها في التكوين ولا يكون التحدي جزءاً منها، وأعظم المعجزات عنده القرآن لأنه بنفسه الوحي المدعى وهو الخارق المعجز فشاهده في عينه ولا يفتقر إلى دليل مغاير له {cite:muqaddima-ibn-khaldun p. 91-93}."
  en: "Miracles authenticate prophets by tahaddi — God effecting the challenge — while the Quran, being itself the revelation, needs no external proof {cite:muqaddima-ibn-khaldun p. 91-93}."
