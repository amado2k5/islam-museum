id: "concept/al-buthur-fi-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "البثور في العين"
  en: "Pustules in the eye"
  fr: "Pustules dans l’œil"
  ur: "آنکھ میں بثور"
summary:
  ar: "البثور في العين ما كان على القرنية يكون إلى البياض وما كان على الملتحمة يكون إلى الحمرة، وعلاجه الفصد وتقطير الدم في العين على ما يذكر في باب الطرفة وتضميد العين بصوفة مغموسة بما يلينها ⁦(أسماء الأدوية والشيافات لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.180}"
  en: "The eye's pustules: what is on the cornea tends to whiteness, what is on the conjunctiva to redness; its treatment is venesection and dripping blood into the eye as told in the chapter of the tarfa, and poulticing the eye with wool soaked in what softens it ⁦(drug and collyrium names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.180}"
  fr: "Les pustules de l’œil : celles de la cornée tendent vers le blanc, celles de la conjonctive vers le rouge ; leur traitement consiste en une saignée et en l’instillation de sang dans l’œil, comme indiqué au chapitre de la tarfa, ainsi qu’en un cataplasme de laine imbibée de ce qui l’adoucit (les noms des médicaments et des collyres ne sont pas reproduits) {cite:canon-ibn-sina-print-v2 p.180}"
  ur: "آنکھ میں بثور: جو قرنیہ پر ہو وہ سفیدی کی طرف ہوتا ہے اور جو ملتحمہ پر ہو وہ سرخی کی طرف؛ اس کا علاج فصد اور طرفہ کے باب کے طریقے پر آنکھ میں خون ٹپکانا اور آنکھ پر ایسے میں بھیجی اون کی پٹی رکھنا ہے جو اسے نرم کرے ⁦(ادویہ اور شیافوں کے نام منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.180}"
