id: concept/zulm-mukharrib-al-umran
class: concept
kind: term
label: { ar: "الظلم مؤذن بخراب العمران", en: "Injustice heralds ruin", es: "La injusticia anuncia la ruina", fr: "L'injustice annonce la ruine", ur: "ناانصافی تباہی کا پیغام دیتی ہے۔", tr: "Adaletsizlik, medeniyetin yıkımının habercisidir.", id: "Ketidakadilan adalah pertanda kehancuran peradaban." }
summary:
  ar: "من أعظم فصول المقدمة: العدوان على الناس في أموالهم ذاهب بآمالهم في تحصيلها واكتسابها فإذا ذهبت آمالهم انقبضت أيديهم عن السعي، وعلى قدر الاعتداء يكون انقباض الرعايا عن الكسب، فإذا قعد الناس عن المعاش كسدت أسواق العمران وتبذّر الناس في الآفاق فخف ساكن القطر وخربت أمصاره واختلت الدولة لأنها صورة للعمران تفسد بفساد مادته، والظلم أعم من أخذ المال فكل من غصّ أحداً في عمله أو طالبه بغير حق أو فرض عليه ما لم يفرضه الشرع فقد ظلمه، وهذه هي الحكمة المقصودة للشارع في تحريم الظلم لأنه مؤذن بانقطاع النوع البشري وهي الحكمة العامة المرعية في مقاصد الشريعة الضرورية الخمسة، وليس فيه عقوبة زاجرة لأن الظلم لا يقدر عليه إلا أهل القدرة والسلطان فبولغ في ذمه ليكون الوازع في نفس القادر عليه، ومن أشد الظلمات في إفساد العمران تكليف الأعمال وتسخير الرعايا بغير حق لأن الأعمال من قبيل المتموالات فإذا كُلف الرعية العمل في غير شأنهم اغتصبوا قيمة عملهم وفسدت آمالهم في العمارة {cite:muqaddima-ibn-khaldun p. 276-278}."
  en: "Oppression kills the hope of gain, markets collapse, populations scatter — the wisdom behind its prohibition; corvée the sharpest case {cite:muqaddima-ibn-khaldun p. 276-278}."
  es: "La opresión mata la esperanza de ganancia, los mercados colapsan, las poblaciones se dispersan: la sabiduría detrás de su prohibición; la corvea es el caso más agudo {cite:muqaddima-ibn-khaldun p. 276-278}."
  fr: "L'oppression tue l'espoir de gain, les marchés s'effondrent, les populations se dispersent — la sagesse derrière son interdiction; la corvée est le cas le plus frappant {cite:muqaddima-ibn-khaldun p. 276-278}."
  ur: "جبر فائدہ کی امید کو ختم کر دیتا ہے، مارکیٹیں ٹوٹ جاتی ہیں، آبادیاں بکھر جاتی ہیں — اس کی ممانعت کے پیچھے حکمت ہے۔ corvée the sharpest case {حوالہ: مقدّمہ ابن خلدون ص۔ 276-278}۔"
  tr: "Giriş bölümünün en önemli noktalarından biri, insanların servetine yönelik saldırganlığın, onu edinme ve kazanma umutlarını yok etmesidir. Umutları kaybolduğunda, çabalamayı bırakırlar. Saldırganlığın derecesi, insanların geçimlerini sağlamaya isteksizliğini belirler. İnsanların geçimlerini sağlamaları engellendiğinde, medeniyetin pazarları durgunlaşır ve insanlar uzak diyarlara dağılır. Sonuç olarak, bir ülkenin nüfusu azalır, şehirleri harap olur ve devlet çöker; çünkü devlet medeniyetin bir yansımasıdır ve temellerinin bozulmasıyla yozlaşır. Haksızlık, sadece para almakla sınırlı değildir. Birinin çalışmasını engelleyen, ondan haksız yere bir şey talep eden veya Şeriatın gerektirmediği bir şeyi ona dayatan herkes ona haksızlık etmiş olur. Bu, Şeriatın beş temel amacında ele alınan genel bilgeliktir. Adaletsizliğe karşı caydırıcı bir ceza yoktur çünkü yalnızca güç ve yetkiye sahip olanlar bunu işleyebilir. Bu nedenle, adaletsizlik, bunu yapabileceklerin kalplerinde caydırıcı bir etki yaratması için şiddetle kınanır. Medeniyeti yozlaştıran en ağır adaletsizlik biçimlerinden biri, insanlara haksız yere iş vermek ve onları sömürmektir, çünkü iş bir tür mülkiyettir. İnsanlar uzmanlık alanlarının dışında çalışmaya zorlanırlarsa, emeklerinin değerinden mahrum kalırlar. Ve mimariye dair umutları da yıkılır. {Kaynak: Mukaddime İbn Haldun, s. 276-278}"
  id: "Salah satu poin terpenting dalam pendahuluan adalah bahwa agresi terhadap kekayaan orang menghancurkan harapan mereka untuk memperoleh dan mendapatkannya. Ketika harapan mereka hilang, mereka berhenti berusaha. Tingkat agresi menentukan keengganan orang untuk mencari nafkah. Ketika orang dicegah untuk mencari nafkah, pasar peradaban mengalami stagnasi, dan orang-orang berpencar ke negeri-negeri yang jauh. Akibatnya, populasi suatu negara berkurang, kota-kotanya hancur, dan negara runtuh, karena negara merupakan cerminan peradaban, dan negara dirusak oleh kerusakan fondasinya. Ketidakadilan lebih luas daripada sekadar mengambil uang. Siapa pun yang menghalangi pekerjaan seseorang, menuntut sesuatu dari mereka secara tidak adil, atau memaksakan kepada mereka apa yang tidak diwajibkan oleh Syariah telah berbuat salah kepada mereka. Inilah hikmah yang dimaksudkan oleh Sang Pemberi Hukum dalam melarang ketidakadilan, karena hal itu menandai kepunahan umat manusia. Inilah hikmah umum yang dipertimbangkan dalam lima tujuan utama Syariah. Tidak ada hukuman yang bersifat jera untuk ketidakadilan karena hanya mereka yang memiliki kekuasaan dan otoritas yang mampu melakukannya. Oleh karena itu, hal ini dikecam keras agar menjadi jera di hati orang-orang yang mampu melakukannya. Salah satu bentuk ketidakadilan yang paling parah yang merusak peradaban adalah memberikan tugas dan mengeksploitasi orang secara tidak adil, karena pekerjaan adalah bentuk kepemilikan. Jika orang dipaksa bekerja di luar bidang keahlian mereka, mereka kehilangan nilai dari kerja mereka. Dan harapan mereka terhadap arsitektur hancur {cite:muqaddima-ibn-khaldun p. 276-278}."
