id: concept/zulm-mukharrib-al-umran
class: concept
kind: term
label: { ar: "الظلم مؤذن بخراب العمران", en: "Injustice heralds ruin" }
summary:
  ar: "من أعظم فصول المقدمة: العدوان على الناس في أموالهم ذاهب بآمالهم في تحصيلها واكتسابها فإذا ذهبت آمالهم انقبضت أيديهم عن السعي، وعلى قدر الاعتداء يكون انقباض الرعايا عن الكسب، فإذا قعد الناس عن المعاش كسدت أسواق العمران وتبذّر الناس في الآفاق فخف ساكن القطر وخربت أمصاره واختلت الدولة لأنها صورة للعمران تفسد بفساد مادته، والظلم أعم من أخذ المال فكل من غصّ أحداً في عمله أو طالبه بغير حق أو فرض عليه ما لم يفرضه الشرع فقد ظلمه، وهذه هي الحكمة المقصودة للشارع في تحريم الظلم لأنه مؤذن بانقطاع النوع البشري وهي الحكمة العامة المرعية في مقاصد الشريعة الضرورية الخمسة، وليس فيه عقوبة زاجرة لأن الظلم لا يقدر عليه إلا أهل القدرة والسلطان فبولغ في ذمه ليكون الوازع في نفس القادر عليه، ومن أشد الظلمات في إفساد العمران تكليف الأعمال وتسخير الرعايا بغير حق لأن الأعمال من قبيل المتموالات فإذا كُلف الرعية العمل في غير شأنهم اغتصبوا قيمة عملهم وفسدت آمالهم في العمارة {cite:muqaddima-ibn-khaldun p. 276-278}."
  en: "Oppression kills the hope of gain, markets collapse, populations scatter — the wisdom behind its prohibition; corvée the sharpest case {cite:muqaddima-ibn-khaldun p. 276-278}."
