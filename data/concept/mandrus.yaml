summary:
  ar: "المندروس في الكتاب صمغ شجرة في بلاد العرب والهند فيه شبه يسير من المر كريه الطعم، حار يابس في الثانية، قابض يحبس الدم ويستعمله المصارعون ليخفوا ويقووا، وينفع الأسنان واللثة والخفقان والإسهال المزمن وضعف البصر {cite:canon-ibn-sina-print-v1 p.584}."
  en: "Mandrus is in the book the gum of a tree in the lands of the Arabs and India, with a slight likeness to myrrh and a disagreeable taste, hot and dry in the second degree and astringent, stopping blood; wrestlers use it to be light and strong, and it helps the teeth and gums, palpitation, long-standing diarrhoea and weak sight {cite:canon-ibn-sina-print-v1 p.584}."
  ur: "مندروس کتاب میں عرب اور ہند کے ایک درخت کا گوند ہے جس میں مر سے ہلکی مشابہت اور ناگوار ذائقہ ہے، دوسرے درجے میں گرم خشک، قابض، خون روکتا ہے؛ پہلوان اسے ہلکا اور طاقتور رہنے کے لیے برتتے ہیں، اور دانتوں، مسوڑھوں، دھڑکن، پرانے اسہال اور کمزور نظر میں مفید ہے {cite:canon-ibn-sina-print-v1 p.584}۔"
  es: "En el libro, Mandrus es la goma de un árbol en las tierras de los árabes e India, con un ligero parecido a la mirra y un sabor desagradable, caliente y seco en segundo grado y astringente, que detiene el sangrado; los luchadores la usan para ser ligeros y fuertes, y ayuda a los dientes y las encías, las palpitaciones, la diarrea prolongada y la vista débil {cite:canon-ibn-sina-print-v1 p.584}."
