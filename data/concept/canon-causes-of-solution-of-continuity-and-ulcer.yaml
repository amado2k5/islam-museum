id: concept/canon-causes-of-solution-of-continuity-and-ulcer
class: concept
kind: scientific
label:
  ar: "أسباب تفرق الاتصال والقرحة عند ابن سينا"
  en: "The causes of solution of continuity and of ulcer in the Canon"
  fr: "Causes de solution de continuité et d’ulcère dans le Canon"
  ur: "اتصال ٹوٹنے اور زخم کے اسباب، قانون کے مطابق"
  es: "Las causas de la solución de continuidad y de úlcera en el Canon"
  tr: "İbn Sina'da Kopukluk ve Ülserin Nedenleri"
  id: "Penyebab Terputus Sambungan dan Ulkus pada Avicenna"
summary:
  ar: "في الفصلين السادس عشر والسابع عشر يقسم ابن سينا أسباب تفرق الاتصال إلى داخلية وخارجية، ويذكر أن سبب القرحة ورم ينفجر أو جراحة تنفتح أو بثور تتآكل {cite:canon-ibn-sina-print-v1 pp.146-147}."
  en: "In chapters 16 and 17 Ibn Sina divides the causes of solution of continuity into internal and external, and says the cause of an ulcer is a tumour that bursts, a wound that opens or pustules that erode {cite:canon-ibn-sina-print-v1 pp.146-147}."
  fr: "Aux chapitres 16 et 17, Ibn Sina distingue causes internes et externes de solution de continuité ; l’ulcère viendrait d’une tumeur éclatée, d’une plaie ouverte ou de pustules érosives {cite:canon-ibn-sina-print-v1 pp.146-147}."
  es: "En los capítulos 16 y 17, Ibn Sina divide las causas de la solución de la continuidad en internas y externas, y dice que la causa de una úlcera es un tumor que revienta, una herida que se abre o pústulas que se erosionan {cite:canon-ibn-sina-print-v1 pp.146-147}."
  ur: "ابواب 16 اور 17 میں ابن سینا تسلسل کے حل کے اسباب کو اندرونی اور بیرونی میں تقسیم کرتا ہے، اور کہتا ہے کہ السر کا سبب ایک رسولی ہے جو پھٹ جاتا ہے، ایک ایسا زخم جو کھلتا ہے یا پھوٹتا ہے جو ختم ہو جاتا ہے۔"
  tr: "On altıncı ve on yedinci bölümlerde İbn Sina, iletişim yayılımının nedenlerini iç ve dış olarak ayırır ve ülserlerin nedeninin tümör patlaması veya açılan cerrahi ya da aşındırıcı kabarcıklar olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.146-147}."
  id: "Dalam bab enam belas dan tujuh belas, Avicenna membagi penyebab dispersi komunikasi menjadi internal dan eksternal, menyebutkan bahwa penyebab tukak adalah tumor yang pecah atau operasi yang terbuka, atau lepuhan erosif {cite:canon-ibn-sina-print-v1 hlm.146-147}."
