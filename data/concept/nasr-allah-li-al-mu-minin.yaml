id: concept/nasr-allah-li-al-mu-minin
class: concept
kind: doctrine
label:
  ar: "نصر الله للمؤمنين وشروطه"
  en: "God's victory for the believers and its conditions"
  es: "La victoria de Dios para los creyentes y sus condiciones."
  fr: "La victoire de Dieu pour les croyants et ses conditions"
  ur: "مومنین کے لیے خدا کی فتح اور اس کے حالات"
summary:
  ar: "يقرر عرجون أن نصر الله للمؤمنين معقود بشرط نصرهم لله، أي استمساكهم بشريعته وإقامة حدوده {cite:sunan-allah-fi-al-mujtama-azhar p. 57}، ووحدة كلمتهم وقيادتهم، إذ يُخشى من تفرق القيادات الفشل وذهاب الريح {cite:sunan-allah-fi-al-mujtama-azhar p. 55}. والتمكين في الأرض يعني وضع سلطان الشريعة في أيدي أهل الإيمان مع وسائل التنفيذ {cite:sunan-allah-fi-al-mujtama-azhar p. 59}. ويعدّ انتصارات بدر والخندق وحنين وحروب الردة وفتوح فارس والروم وعين جالوت وحطين شواهد على أن الغلبة كانت لمن وحّد الكلمة مع قلة العدد {cite:sunan-allah-fi-al-mujtama-azhar p. 67}."
  en: "Arjun holds that God's help for believers depends on their help for God: holding to the Shari'a and its limits, and on a single command, since division among leaders brings failure {cite:sunan-allah-fi-al-mujtama-azhar p. 55-57}. He cites Badr, the Trench, Hunayn, the Ridda wars, the victories over Persia and Byzantium, 'Ayn Jalut and Hattin as cases where a united community won despite fewer numbers {cite:sunan-allah-fi-al-mujtama-azhar p. 67}."
  es: "Arjun sostiene que la ayuda de Dios a los creyentes depende de la ayuda que ellos le brindan a Dios: adhiriéndose a la Sharia y sus límites, y a un solo mandato, ya que la división entre los líderes conduce al fracaso {cite:sunan-allah-fi-al-mujtama-azhar p. 55-57}. Cita Badr, la trinchera, Hunayn, las guerras de Ridda, las victorias sobre Persia y Bizancio, 'Ayn Jalut y Hattin como ejemplos donde una comunidad unida triunfó a pesar de ser menor en número {cite:sunan-allah-fi-al-mujtama-azhar p. 67}."
  fr: "Arjun soutient que l'aide divine aux croyants dépend de leur propre aide à Dieu: le respect de la charia et de ses limites, ainsi que d'un commandement unique, car la division entre les dirigeants conduit à l'échec (Sunan Allah fi al-Mujtama Azhar, p. 55-57). Il cite Badr, le Fossé, Hunayn, les guerres de Ridda, les victoires sur la Perse et Byzance, Ayn Djalout et Hattin comme autant d'exemples où une communauté unie a triomphé malgré un nombre inférieur (Sunan Allah fi al-Mujtama Azhar, p. 67)."
  ur: "ارجن کا خیال ہے کہ مومنوں کے لئے خدا کی مدد خدا کے لئے ان کی مدد پر منحصر ہے: شریعت اور اس کی حدود کو برقرار رکھنا، اور ایک حکم پر، کیونکہ رہنماؤں کے درمیان تقسیم ناکامی کا باعث بنتی ہے۔ 55-57}۔ انہوں نے بدر، خندق، حنین، ردا کی جنگیں، فارس اور بازنطیم پر فتوحات، عین جالوت اور حطین کا حوالہ دیا ہے کہ کم تعداد کے باوجود ایک متحدہ جماعت جیت گئی۔ 67}۔"
