id: concept/nasr-allah-li-al-mu-minin
class: concept
kind: doctrine
label:
  ar: "نصر الله للمؤمنين وشروطه"
  en: "God's victory for the believers and its conditions"
summary:
  ar: "يقرر عرجون أن نصر الله للمؤمنين معقود بشرط نصرهم لله، أي استمساكهم بشريعته وإقامة حدوده {cite:sunan-allah-fi-al-mujtama-azhar p. 57}، ووحدة كلمتهم وقيادتهم، إذ يُخشى من تفرق القيادات الفشل وذهاب الريح {cite:sunan-allah-fi-al-mujtama-azhar p. 55}. والتمكين في الأرض يعني وضع سلطان الشريعة في أيدي أهل الإيمان مع وسائل التنفيذ {cite:sunan-allah-fi-al-mujtama-azhar p. 59}. ويعدّ انتصارات بدر والخندق وحنين وحروب الردة وفتوح فارس والروم وعين جالوت وحطين شواهد على أن الغلبة كانت لمن وحّد الكلمة مع قلة العدد {cite:sunan-allah-fi-al-mujtama-azhar p. 67}."
  en: "Arjun holds that God's help for believers depends on their help for God: holding to the Shari'a and its limits, and on a single command, since division among leaders brings failure {cite:sunan-allah-fi-al-mujtama-azhar p. 55-57}. He cites Badr, the Trench, Hunayn, the Ridda wars, the victories over Persia and Byzantium, 'Ayn Jalut and Hattin as cases where a united community won despite fewer numbers {cite:sunan-allah-fi-al-mujtama-azhar p. 67}."
