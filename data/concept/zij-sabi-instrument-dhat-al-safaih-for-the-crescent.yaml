id: concept/zij-sabi-instrument-dhat-al-safaih-for-the-crescent
class: concept
kind: scientific
label: { ar: "آلة ذات الصفائح لرصد الهلال", en: "The instrument dhat al-safaih for sighting the crescent", ur: "ہلال کے رصد کے لیے ذات الصفائح آلہ", es: "El instrumento dhat al-safaih para avistar la luna creciente", fr: "L'instrument dhat al-safaih pour observer le croissant", tr: "Hilal şeklindeki ayı gözlemlemek için kullanılan plaka tipi bir alet.", id: "Instrumen berbentuk lempengan untuk mengamati bulan sabit." }
summary:
  ar: "يصف البتاني طريقة رصد الهلال بآلة تسمى ذات الصفائح، فيُنصب عمود في موضع مكشوف الأفق بارتفاع القامة، ويُدار عليه دائرة مقسّمة بمائة وثمانين، ويُضبط مسطرة أو أنبوب على مركز الدائرة بحسب بُعد سمت الهلال عن المشرق أو المغرب، ثم تُعلَّق ذات الصفائح ويُرفع طرف المسطرة. {cite:zij-sabi-nallino-byblion p.137}."
  en: "Al-Battani describes sighting the crescent with an instrument called dhat al-safaih. A pole is set up at a place with an open horizon, at the height of a man; a circle divided into degrees is drawn on it; a ruler or tube is fixed on the circle's centre according to the distance of the crescent's bearing from east or west; the instrument is then hung and the end of the ruler is raised. {cite:zij-sabi-nallino-byblion p.137}."
  ur: "البتانی ہلال کی رؤیت کا طریقہ ایک آلے سے بیان کرتے ہیں جسے ذات الصفائح کہا جاتا ہے: کھلے افق والی جگہ پر قامت کے برابر ایک ستون نصب کیا جاتا ہے، اس پر ایک دائرہ بنایا جاتا ہے جو درجوں میں تقسیم ہو، مرکز پر ایک مسطرہ یا نلکی ہلال کی سمت کے فاصلے کے مطابق لگائی جاتی ہے، پھر ذات الصفائح لٹکائی جاتی ہے اور مسطرہ کا سرا اٹھایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.137}۔"
  es: "Al-Battani describe cómo avistar la luna creciente con un instrumento llamado dhat al-safaih. Se coloca un poste en un lugar con el horizonte despejado, a la altura de un hombre; se dibuja sobre él un círculo dividido en grados; se fija una regla o tubo en el centro del círculo según la distancia de la dirección de la luna creciente desde el este o el oeste; luego se cuelga el instrumento y se levanta el extremo de la regla. {cite:zij-sabi-nallino-byblion p.137}."
  fr: "Al-Battani décrit l'observation du croissant de lune à l'aide d'un instrument appelé dhat al-safaih. Un poteau est dressé à hauteur d'homme, dans un endroit où l'horizon est dégagé; un cercle gradué en degrés y est tracé; une règle ou un tube est fixé au centre du cercle, la mesure correspondant à la direction du croissant par rapport à l'est ou à l'ouest; l'instrument est ensuite suspendu et l'extrémité de la règle est levée. {cite:zij-sabi-nallino-byblion p.137}."
  tr: "El-Battani, hilalin gözlemlenmesi için \"plaka benzeri alet\" adı verilen bir alet kullanma yöntemini şöyle anlatır: Açık ufuklu bir yere, insan boyunda bir direk dikilir ve 180 bölüme ayrılmış bir daire bu direğin etrafında döndürülür. Hilalin doğu veya batıdan olan zenit uzaklığına göre dairenin merkezine bir cetvel veya tüp yerleştirilir. Daha sonra plaka benzeri alet asılır ve cetvelin ucu yukarı kaldırılır. {cite:zij-sabi-nallino-byblion s.137}"
  id: "Al-Battani menjelaskan metode pengamatan bulan sabit menggunakan instrumen yang disebut \"instrumen berbentuk piringan\". Sebuah tiang didirikan di lokasi dengan cakrawala terbuka, setinggi orang dewasa, dan sebuah lingkaran yang dibagi menjadi 180 bagian diputar di sekelilingnya. Sebuah penggaris atau tabung diletakkan di tengah lingkaran sesuai dengan jarak zenit bulan sabit dari timur atau barat. Kemudian instrumen berbentuk piringan digantung, dan ujung penggaris diangkat. {cite:zij-sabi-nallino-byblion p.137}."
