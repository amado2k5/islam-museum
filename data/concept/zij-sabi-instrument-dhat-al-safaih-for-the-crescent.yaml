id: concept/zij-sabi-instrument-dhat-al-safaih-for-the-crescent
class: concept
kind: scientific
label: { ar: "آلة ذات الصفائح لرصد الهلال", en: "The instrument dhat al-safaih for sighting the crescent", ur: "ہلال کے رصد کے لیے ذات الصفائح آلہ" }
summary:
  ar: "يصف البتاني طريقة رصد الهلال بآلة تسمى ذات الصفائح، فيُنصب عمود في موضع مكشوف الأفق بارتفاع القامة، ويُدار عليه دائرة مقسّمة بمائة وثمانين، ويُضبط مسطرة أو أنبوب على مركز الدائرة بحسب بُعد سمت الهلال عن المشرق أو المغرب، ثم تُعلَّق ذات الصفائح ويُرفع طرف المسطرة. {cite:zij-sabi-nallino-byblion p.137}."
  en: "Al-Battani describes sighting the crescent with an instrument called dhat al-safaih. A pole is set up at a place with an open horizon, at the height of a man; a circle divided into degrees is drawn on it; a ruler or tube is fixed on the circle's centre according to the distance of the crescent's bearing from east or west; the instrument is then hung and the end of the ruler is raised. {cite:zij-sabi-nallino-byblion p.137}."
  ur: "البتانی ہلال کی رؤیت کا طریقہ ایک آلے سے بیان کرتے ہیں جسے ذات الصفائح کہا جاتا ہے: کھلے افق والی جگہ پر قامت کے برابر ایک ستون نصب کیا جاتا ہے، اس پر ایک دائرہ بنایا جاتا ہے جو درجوں میں تقسیم ہو، مرکز پر ایک مسطرہ یا نلکی ہلال کی سمت کے فاصلے کے مطابق لگائی جاتی ہے، پھر ذات الصفائح لٹکائی جاتی ہے اور مسطرہ کا سرا اٹھایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.137}۔"
