id: concept/ruyat-allah
education:
  did_you_know:
    ar: "رؤية أهل الجنة لله عند الطحاوي حق بغير إحاطة ولا كيفية، مع التسليم بما جاء في الحديث الصحيح وترك التأويل بالرأي."
    en: "In al-Tahawi's creed, the people of paradise truly see God, without encompassing Him and without modality — accepting what sound hadith says and leaving off opinion's interpretation."
    ur: "طحاوی کے نزدیک اہلِ جنت اللہ کو دیکھیں گے، بغیر احاطہ اور بلا کیف — صحیح حدیث کو قبول کرتے ہوئے اور رائے کی تاویل کو ترک کرتے ہوئے۔"
    sources: [source/aqida-tahawiyya, source/aqida-wasitiyya]
class: concept
kind: doctrine
label:
  ar: رؤية الله في الآخرة
  en: The vision of God in the hereafter
summary:
  ar: قول الطحاوي إن رؤية أهل الجنة لله حق بغير إحاطة ولا كيفية، مع التسليم بما جاء في الحديث الصحيح وترك التأويل بالرأي.
  en: al-Tahawi's statement that the vision of God by the people of Paradise is true, without encompassing or how, accepting what is in the sound hadith and refraining from interpretation by opinion.
