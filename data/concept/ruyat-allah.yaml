label:
  ar: رؤية الله في الآخرة
  en: The vision of God in the hereafter
summary:
  ar: قول الطحاوي إن رؤية أهل الجنة لله حق بغير إحاطة ولا كيفية، مع التسليم بما جاء في الحديث الصحيح وترك التأويل بالرأي.
  en: al-Tahawi's statement that the vision of God by the people of Paradise is true, without encompassing or how, accepting what is in the sound hadith and refraining from interpretation by opinion.
