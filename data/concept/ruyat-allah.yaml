  id: lumat-al-itiqad
  stance:
    ar: المؤمنون يرون ربهم بأبصارهم في الآخرة
    en: The believers will see their Lord with their eyes in the hereafter
  summary:
    ar: 'يقول ابن قدامة: «والمؤمنون يرون ربهم في الآخرة بأبصارهم، ويزورونه، ويكلمهم ويكلمونه»، ويحتج بآية سورة القيامة وبآية المطففين عن حجب الكفار، وبحديث القمر، ويقول إن الحديث تشبيه للرؤية بالرؤية لا للمرئي بالمرئي.'
    en: Ibn Qudama says the believers will see their Lord in the hereafter with their eyes, visit Him, and He will speak to them and they to Him; he cites the verse of al-Qiyama, the verse of al-Mutaffifin about the unbelievers being veiled, and the hadith of the moon, which he says likens the seeing to seeing, not the seen to the seen.
