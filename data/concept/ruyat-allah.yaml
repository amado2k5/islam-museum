- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: الله يُرى بالأبصار يوم القيامة، يراه المؤمنون ولا يراه الكافرون
    en: God is seen with the eyes on the Day of Resurrection; the believers see Him and the unbelievers do not
  summary:
    ar: يذكر الأشعري أنهم يقولون إن الله يُرى بالأبصار يوم القيامة كما يُرى القمر ليلة البدر، يراه المؤمنون ولا يراه الكافرون لأنهم عن ربهم محجوبون، وأن موسى سأل الرؤية في الدنيا فأُعلم أنه لا يراه فيها بل في الآخرة.
    en: Al-Ash'ari reports they say God is seen with the eyes on the Day of Resurrection as the moon is seen on the night of the full moon, the believers see Him and the unbelievers do not because they are veiled from their Lord, and that Musa asked to see Him in this world and was told he would not see Him in it but in the hereafter.
