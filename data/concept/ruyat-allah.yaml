  stance:
    ar: الرؤية حق لأهل الجنة بغير إحاطة ولا كيفية، مع ترك التأويل
    en: The vision is true for the people of Paradise without encompassing or how, leaving aside interpretation
  summary:
    ar: يقول الطحاوي إن الرؤية حق لأهل الجنة بغير إحاطة ولا كيفية، وإن تفسيرها على ما أراده الله وعلمه، ولا يصح الإيمان بها عنده لمن اعتبرها بوهم أو تأوّلها بفهم.
