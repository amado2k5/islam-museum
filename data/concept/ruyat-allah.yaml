  id: lumat-al-itiqad
  stance:
    ar: المؤمنون يرون ربهم بأبصارهم في الآخرة
    en: The believers will see their Lord with their eyes in the hereafter
  summary:
    ar: 'يقول ابن قدامة: «والمؤمنون يرون ربهم في الآخرة بأبصارهم، ويزورونه، ويكلمهم ويكلمونه»، ويحتج بآية سورة القيامة وبآية المطففين عن حجب الكفار، وبحديث القمر، ويقول إن الحديث تشبيه للرؤية بالرؤية لا للمرئي بالمرئي.'
    en: Ibn Qudama says the believers will see their Lord in the hereafter with their eyes, visit Him, and He will speak to them and they to Him; he cites the verse of al-Qiyama, the verse of al-Mutaffifin about the unbelievers being veiled, and the hadith of the moon, which he says likens the seeing to seeing, not the seen to the seen.
  holders:
  - person/ibn-qudama-al-maqdisi
  - work/lumat-al-itiqad
  evidence:
  - ref: source/lumat-al-itiqad
    note:
      ar: ص 23
      en: p. 23
  sources:
  - source/lumat-al-itiqad
- tradition: sunni-hanbali
  id: aqida-wasitiyya
  stance:
    ar: المؤمنون يرون ربهم يوم القيامة عياناً بأبصارهم
    en: The believers will see their Lord on the Day of Resurrection plainly with their eyes
  summary:
    ar: يقول ابن تيمية إن من الإيمان الإيمان بأن المؤمنين يرونه يوم القيامة عياناً بأبصارهم كما يرون الشمس صحواً وكما يرون القمر ليلة البدر، ثم يرونه بعد دخول الجنة كما يشاء الله.
    en: Ibn Taymiyya says belief includes that the believers will see Him on the Day of Resurrection plainly with their eyes as they see the sun on a clear day and the moon on the night of the full moon, and then see Him after entering Paradise as God wills.
  holders:
  - person/ibn-taymiyya
  - work/aqida-wasitiyya
  evidence:
