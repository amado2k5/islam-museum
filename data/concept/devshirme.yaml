id: concept/devshirme
class: concept
kind: political
label: { ar: "الدوشرمة (نظام التجنيد)" }
summary:
  ar: "الاسم الذي يُطلق في المصادر الأوروبية على نظام انتقاء أطفال من الرعايا النصارى لتنشئهم في صفوف الإنكشارية ودوائر الدولة العثمانية، وتُطلق عليه أحياناً «ضريبة الغلمان» أو «ضريبة الأبناء». أصل الجدل في أن الإنكشارية أُضيفت في عهد أورخان أو مراد الأول، والمسألة موضع خلاف شديد بين المؤرخين المسلمين والأوروبيين {cite:dawlat-uthmaniyya-salabi p. 53-54}."
  en: "The devshirme — the name given in European sources to the Ottoman levy of Christian boys for the Janissary corps and palace service, sometimes called the 'boy tribute'. Its very existence as a levy is contested between Muslim and Western historiography {cite:dawlat-uthmaniyya-salabi p. 53-54}."
