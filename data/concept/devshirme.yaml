    summary:
      ar: "يرى علي محمد الصلابي أن نظام الدوشرمة المزعوم كذبة دُسّت على تاريخ أورخان بن عثمان ومراد، وأن الإنكشارية تشكلت من المسلمين الجدد الداخلين طوعاً ومن الأطفال المشردين الذين تركتهم الحروب أيتاماً فاحتضنتهم الدولة وربّتهم تربية إسلامية، وأن «ضريبة الغلمان» لا دليل لها إلا كتب المستشرقين كجب وبروكلمان وسوموفيل، وأن بعض المؤرخين المسلمين التقطوا الفرية ورددوها في كتبهم."
