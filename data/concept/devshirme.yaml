id: concept/devshirme
class: concept
kind: political
label: { ar: "الدوشرمة ⁦(نظام التجنيد)⁩", en: "The devshirme (Ottoman levy of boys)", es: "El devshirme (reclutamiento otomano de muchachos)", fr: "Le devchirmé (levée ottomane de garçons)", ur: "دیوشرمے ⁦(لڑکوں پر عثمانی لیوی)⁩", tr: "Al-Dusharma (İşe Alım Sistemi)", id: "Al-Dusharma (Sistem Rekrutmen)" }
summary:
  ar: "الاسم الذي يُطلق في المصادر الأوروبية على نظام انتقاء أطفال من الرعايا النصارى لتنشئهم في صفوف الإنكشارية ودوائر الدولة العثمانية، وتُطلق عليه أحياناً «ضريبة الغلمان» أو «ضريبة الأبناء». أصل الجدل في أن الإنكشارية أُضيفت في عهد أورخان أو مراد الأول، والمسألة موضع خلاف شديد بين المؤرخين المسلمين والأوروبيين {cite:dawlat-uthmaniyya-salabi p. 53-54}."
  en: "The devshirme — the name given in European sources to the Ottoman levy of Christian boys for the Janissary corps and palace service, sometimes called the 'boy tribute'. Its very existence as a levy is contested between Muslim and Western historiography {cite:dawlat-uthmaniyya-salabi p. 53-54}."
  es: "El devshirme —nombre que en las fuentes europeas se da al reclutamiento otomano de niños cristianos para el cuerpo de jenízaros y el servicio palaciego, a veces llamado «tributo de niños». Su existencia como reclutamiento es objeto de controversia entre la historiografía musulmana y occidental {cite:dawlat-uthmaniyya-salabi p. 53-54}."
  fr: "Le devchirmé — nom donné dans les sources européennes à la levée ottomane de jeunes garçons chrétiens pour le corps des janissaires et le service du palais, parfois appelée « tribut des garçons » —, est contesté par l'historiographie musulmane et occidentale {cite:dawlat-uthmaniyya-salabi p. 53-54}."
  ur: "دیوشرمے - یورپی ذرائع میں جنیسری کور اور محل کی خدمت کے لیے عیسائی لڑکوں سے عثمانی لیوی کو دیا گیا نام، جسے کبھی کبھی 'لڑکا خراج' بھی کہا جاتا ہے۔ محصول کے طور پر اس کے وجود کا مسلم اور مغربی تاریخ نویس کے درمیان مقابلہ ہے۔ 53-54}۔"
  tr: "Avrupa kaynaklarında verilen isim, Hristiyan tebaasından çocukların seçilerek Yeniçeriler ve Osmanlı devlet çevrelerinde yetiştirilmesi sistemi, bazen \"köle vergisi\" veya \"çocuk vergisi\" olarak adlandırılır. Tartışmanın kökeni, Yeniçerilerin Orhan veya Murad I döneminde tanıtıldığıdır ve bu konu Müslüman ve Avrupalı tarihçiler arasında yoğun tartışma konusu olmuştur {cite:dawlat-uthmaniyya-salabi s. 53-54}."
  id: "Nama yang diberikan dalam sumber Eropa merujuk pada sistem pemilihan anak-anak dari subjek Kristen untuk dibesarkan dalam kalangan Janissari dan lingkaran negara Ottoman, yang kadang disebut \"pajak budak\" atau \"pajak anak.\" Asal mula perdebatan ini adalah bahwa Janissari diperkenalkan pada masa pemerintahan Orhan atau Murad I, dan isu ini menjadi bahan perdebatan sengit di antara sejarawan Muslim dan Eropa {cite:dawlat-uthmaniyya-salabi hlm. 53-54}."
