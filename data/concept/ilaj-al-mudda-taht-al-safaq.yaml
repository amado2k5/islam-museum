id: "concept/ilaj-al-mudda-taht-al-safaq"
class: "concept"
kind: "scientific"
label:
  ar: "علاج المدة تحت الصفاق"
  en: "Treating the pus under the conjunctiva"
  ur: "صفاق کے نیچے مدہ کا علاج"
  es: "Tratamiento del pus debajo de la conjuntiva"
  fr: "Traitement du pus sous la conjonctive"
summary:
  ar: "ينقل الكتاب عن بولس أن المدة تحت الصفاق تعالج إذا أزمنت وغلظت بمثل شراب العسل وعصارة الحلبة وشياف الكندر بالزعفران أو تفتح بإكليل الملك ولعاب بزر الكتان إن لم يمنع رمد وتنقى بمثل شياف المر والشاهترج وإن لم تكن قرحة استعملت هذا الشياف وأيضاً دواء المغناطيس المتخذ للظفرة ودواء طين ساموس المذكور في باب النفاخات ⁦(قول بولس منقول عن الكتاب كخبر والنسخ ومقاديرها لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.181}"
  en: "The book transmits from Paulus that the pus under the conjunctiva is treated, when chronic and thickened, with the like of honey drink and fenugreek juice and the frankincense collyrium with saffron, or it is opened with rosemary and flaxseed mucilage unless ophthalmia prevents, and it is cleansed with the like of the myrrh and shahtaraj collyrium; if there is no ulcer this collyrium is used, and also the magnet drug made for pterygium and the Samos clay drug mentioned in the watery-bladders chapter ⁦(Paulus's word transmitted as the book's report; recipes and measures are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.181}"
  ur: "کتاب پولس سے منقول کرتی ہے کہ صفاق کے نیچے کا مدہ جب پرانا اور گاڑھا ہو جائے تو شہد کے شراب اور میتھی کے رس اور کندر کے شیاف زعفران کے ساتھ علاج ہوتا ہے، یا اکلیل الملک اور کتان کے بیج کے لعاب سے کھولا جاتا ہے بشرطیکہ رمد نہ روکے، اور مر اور شاہترج جیسے شیاف سے صاف کیا جاتا ہے؛ اگر قرحہ نہ ہو تو یہی شیاف استعمال ہوتا ہے، اور ساتھ ہی ظفرہ کے لیے بنایا گیا مقناطیس والا دوا اور نفاخات کے باب میں مذکور طین ساموس کا دوا ⁦(پولس کا قول کتاب کے خبر کے طور پر منقول؛ نسخے اور مقدار منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.181}"
  es: "El libro transmite de Pablo que el pus bajo la conjuntiva, cuando es crónico y espeso, se trata con una bebida de miel y jugo de fenogreco y el colirio de incienso con azafrán, o se abre con romero y mucílago de linaza a menos que la oftalmía lo impida, y se limpia con una mezcla de mirra y colirio de shahtaraj; si no hay úlcera, se usa este colirio, y también el medicamento magnético para el pterigión y el medicamento de arcilla de Samos mencionado en el capítulo sobre vejigas acuosas (palabra de Pablo transmitida como informe del libro; no se incluyen recetas ni medidas) {cite:canon-ibn-sina-print-v2 p.181}"
  fr: "Le livre rapporte de Paul que le pus sous la conjonctive, lorsqu'il est chronique et épais, est traité avec une boisson au miel et du jus de fenugrec, ainsi qu'avec un collyre d'encens et de safran. On peut aussi l'ouvrir avec du mucilage de romarin et de lin, sauf en cas d'ophtalmie, et le nettoyer avec un collyre de myrrhe et de shahtaraj. En l'absence d'ulcère, on utilise ce collyre, ainsi que le remède magnétique prescrit pour le ptérygion et le remède à base d'argile de Samos mentionné dans le chapitre sur les vésicules aqueuses (paroles de Paul transmises par le livre; les recettes et les doses ne sont pas précisées). {cite:canon-ibn-sina-print-v2 p.181}"
