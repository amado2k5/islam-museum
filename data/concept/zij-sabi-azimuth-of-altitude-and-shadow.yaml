id: concept/zij-sabi-azimuth-of-altitude-and-shadow
class: concept
kind: scientific
label: { ar: "سمت الارتفاع والظل من دائرة الأفق في الزيج الصابي", en: "The azimuth of the altitude and of the shadow", ur: "ارتفاع اور سایہ کا سمت", es: "El acimut de la altitud y de la sombra", fr: "L'azimut de l'altitude et de l'ombre" }
summary:
  ar: "يتناول الباب الحادي عشر معرفة سمت الارتفاع والظل من دائرة الأفق في أي بلد ولأي جزء من البروج ولأي وقت من النهار. يأخذ البتاني ميل الجزء ووتره وجهته، وعرض البلد ووتره ووتر تمامه، وارتفاع الوقت ووتره ووتر تمامه، ثم يحسب سعة المشرق واختلاف الأفق ويجمعهما أو يطرح أحدهما من الآخر بحسب الجهة، ثم يضرب في نصف القطر ويقسم على وتر تمام الارتفاع فيكون قوس الحاصل هو السمت. {cite:zij-sabi-nallino-byblion pp.37-38}."
  en: "Chapter 11 takes up the azimuth of the altitude and the shadow on the horizon circle, in any country, for any part of the zodiac and any time of day. Al-Battani takes the declination of the part, its chord and its side; the place's latitude, its chord and the chord of its complement; the altitude of the time, its chord and the chord of its complement; then works out the amplitude of the east and the difference of the horizon and adds the two or subtracts one from the other according to side, multiplies by the radius and divides by the chord of the altitude's complement, and the arc of the result is the azimuth. {cite:zij-sabi-nallino-byblion pp.37-38}."
  ur: "گیارہواں باب کسی بھی شہر میں، بروج کے کسی بھی جز کے لیے اور دن کے کسی بھی وقت کے لیے دائرۂ افق پر ارتفاع اور سایہ کی سمت معلوم کرنے کو لیتا ہے۔ البتانی جز کا میل، اس کا وتر اور جہت لیتے ہیں، شہر کا عرض، اس کا وتر اور اس کے تتمے کا وتر، وقت کا ارتفاع، اس کا وتر اور اس کے تتمے کا وتر؛ پھر سعۃ المشرق اور اختلاف الافق نکالتے ہیں اور جہت کے مطابق دونوں کو جمع کرتے ہیں یا ایک کو دوسرے سے گھٹاتے ہیں، نصف قطر سے ضرب دیتے ہیں اور ارتفاع کے تتمے کے وتر پر تقسیم کرتے ہیں، اور حاصل کی قوس سمت ہے۔ {cite:zij-sabi-nallino-byblion pp.37-38}۔"
  es: "El capítulo 11 aborda el acimut de la altitud y la sombra sobre el círculo del horizonte, en cualquier país, para cualquier parte del zodíaco y cualquier hora del día. Al-Battani toma la declinación de la parte, su cuerda y su lado; la latitud del lugar, su cuerda y la cuerda de su complemento; la altitud del momento, su cuerda y la cuerda de su complemento; luego calcula la amplitud del este y la diferencia del horizonte y suma o resta una de la otra según el lado, multiplica por el radio y divide por la cuerda del complemento de la altitud, y el arco del resultado es el acimut. {cite:zij-sabi-nallino-byblion pp.37-38}."
  fr: "Le chapitre 11 traite de l'azimut de l'altitude et de l'ombre sur le cercle de l'horizon, pour tout pays, toute partie du zodiaque et tout moment de la journée. Al-Battani prend en compte la déclinaison de la partie, sa corde et son côté; la latitude du lieu, sa corde et la corde de son complémentaire; l'altitude du moment, sa corde et la corde de son complémentaire; puis il calcule l'amplitude de l'est et la différence d'horizon, qu'il additionne ou soustrait selon le côté, multiplie par le rayon et divise par la corde du complémentaire de l'altitude. L'arc résultant est l'azimut. {cite:zij-sabi-nallino-byblion pp.37-38}."
