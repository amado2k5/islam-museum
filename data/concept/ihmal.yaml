label: { ar: "الإهمال", en: "Ihmal (neglect or carelessness as a ground for liability, and the rule that speech is to be given effect rather than left void)" }
summary:
  ar: "الإهمال لغة الترك، وأهمل أمره لم يحكمه، ولا يخرج معناه الاصطلاحي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} والإهمال في الأمانات إذا أدى إلى هلاكها أو ضياعها يوجب الضمان، فالأمين لا يضمن إلا بالتعدي أو الإهمال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} وإهمال الأجير الخاص يوجب الضمان، والأجير المشترك ضامن عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} وإهمال الحاذق من طبيب أو ختان أو معلم يوجب ضمان ما يحدث بسببه، وكذلك إهمال القاطع في القصاص والحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} والقاعدة أن إعمال الكلام أولى من إهماله، فإن تعذرت الحقيقة والمجاز أُهمل الكلام ولغا، كدعوى قتل المورث وهو حي، وكدعوى بنوة من هو معروف النسب لغيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3665}"
  en: "Ihmal is lexically leaving a thing neglected; the technical sense keeps this meaning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} Neglect in a trust that leads to its loss makes the trustee liable, since a trustee is liable only for excess or neglect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} The neglect of a private hired worker creates liability, and a shared worker is liable by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} The neglect of a skilled practitioner, such as a doctor, circumciser or teacher, makes him liable for what follows, as does a cutter who exceeds his mandate in retaliation or in the hand cut for theft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} The rule is that speech is to be given effect rather than left void; when neither the literal nor the figurative sense is possible, the speech is left void, as in a claim that a living man has been killed by his heir, or that a child of known lineage is one's son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3665}"
