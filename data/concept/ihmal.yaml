id: concept/ihmal
class: concept
kind: term
label: { ar: "الإهمال", en: "Ihmal (neglect or carelessness as a ground for liability, and the rule that speech is to be given effect rather than left void)", es: "Ihmal (negligencia o descuido como causa de responsabilidad, y la regla de que el discurso debe tener efecto en lugar de quedar sin efecto).", fr: "Ihmal (la négligence ou l'imprudence comme fondement de la responsabilité, et la règle selon laquelle la parole doit être appliquée plutôt que d'être laissée sans effet)", ur: "احمال ⁦(ذمہ داری کی بنیاد کے طور پر غفلت یا لاپرواہی، اور یہ قاعدہ کہ تقریر کو باطل چھوڑنے کے بجائے اثر دیا جائے)⁩" }
summary:
  ar: "الإهمال لغة الترك، وأهمل أمره لم يحكمه، ولا يخرج معناه الاصطلاحي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} والإهمال في الأمانات إذا أدى إلى هلاكها أو ضياعها يوجب الضمان، فالأمين لا يضمن إلا بالتعدي أو الإهمال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} وإهمال الأجير الخاص يوجب الضمان، والأجير المشترك ضامن عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} وإهمال الحاذق من طبيب أو ختان أو معلم يوجب ضمان ما يحدث بسببه، وكذلك إهمال القاطع في القصاص والحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} والقاعدة أن إعمال الكلام أولى من إهماله، فإن تعذرت الحقيقة والمجاز أُهمل الكلام ولغا، كدعوى قتل المورث وهو حي، وكدعوى بنوة من هو معروف النسب لغيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3665}"
  en: "Ihmal is lexically leaving a thing neglected; the technical sense keeps this meaning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} Neglect in a trust that leads to its loss makes the trustee liable, since a trustee is liable only for excess or neglect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} The neglect of a private hired worker creates liability, and a shared worker is liable by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} The neglect of a skilled practitioner, such as a doctor, circumciser or teacher, makes him liable for what follows, as does a cutter who exceeds his mandate in retaliation or in the hand cut for theft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} The rule is that speech is to be given effect rather than left void; when neither the literal nor the figurative sense is possible, the speech is left void, as in a claim that a living man has been killed by his heir, or that a child of known lineage is one's son. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3665}"
  es: "Ihmal es léxicamente dejar algo descuidado; el sentido técnico mantiene este significado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} La negligencia en un fideicomiso que lleva a su pérdida hace responsable al fiduciario, ya que un fiduciario es responsable solo por exceso o negligencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} La negligencia de un trabajador contratado privadamente crea responsabilidad, y un trabajador compartido es responsable por la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} La negligencia de un profesional calificado, como un médico, circuncidador o maestro, lo hace responsable de lo que sigue, al igual que un cortador que excede su mandato en represalia o en la mano cortada por robo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} La regla es que el discurso debe tener efecto en lugar de quedar sin efecto; cuando no es posible ni el sentido literal ni el figurado, el discurso queda sin efecto, como en la afirmación de que un hombre vivo ha sido asesinado por su heredero, o que un niño de linaje conocido es hijo propio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3665}"
  fr: "Le terme « ihmal » signifie lexicalement « laisser quelque chose être négligé »; le sens technique conserve cette signification. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} La négligence dans la gestion d'un trust qui entraîne sa perte engage la responsabilité du fiduciaire, car celui-ci n'est responsable qu'en cas d'excès ou de négligence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663} La négligence d'un travailleur salarié crée une responsabilité, et celle d'un travailleur salarié est engagée à la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3663}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} La négligence d'un professionnel qualifié, tel qu'un médecin, un circonciseur ou un enseignant, l'engage pour ses conséquences, de même qu'un exciseur qui outrepasse son mandat par vengeance ou lorsqu'il est mutilé pour vol. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} La règle est que la parole doit avoir un effet plutôt que d'être laissée sans effet; lorsque ni le sens littéral ni le sens figuré ne sont possibles, la parole est laissée sans effet, comme dans l'affirmation qu'un homme vivant a été tué par son héritier, ou qu'un enfant de lignée connue est son fils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3665}"
  ur: "احمال لغوی طور پر کسی چیز کو نظرانداز کر رہا ہے۔ تکنیکی احساس اس معنی کو برقرار رکھتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3663} امانت میں کوتاہی جو اس کے نقصان کا باعث بنتی ہے، امانت دار کو ذمہ دار بناتی ہے، کیونکہ امانت دار صرف زیادتی یا کوتاہی کا ذمہ دار ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3663} پرائیویٹ ملازم کو نظر انداز کرنا ذمہ داری پیدا کرتا ہے، اور ایک مشترکہ کارکن اکثریت کی طرف سے ذمہ دار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3663}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3664} ماہر ڈاکٹر، ختنہ کرنے والے یا استاد جیسے ماہر کی کوتاہی اسے اس کے لیے ذمہ دار بناتی ہے، جو اس کے ہاتھ کاٹنے یا کاٹنے کے بعد اس کے ہاتھ کاٹتا ہے۔ چوری کے لئے کٹ. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3664} قاعدہ یہ ہے کہ تقریر کو باطل چھوڑنے کے بجائے اثر دیا جائے۔ جب نہ لفظی اور نہ ہی علامتی معنی ممکن ہو تو تقریر باطل رہ جاتی ہے، جیسا کہ دعویٰ ہے کہ ایک زندہ آدمی کو اس کے وارث نے قتل کر دیا ہے، یا یہ کہ معلوم نسب کا بچہ کسی کا بیٹا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3664}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3665}"
