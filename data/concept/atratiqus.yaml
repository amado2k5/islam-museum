label:
  ar: "أطراطيقوس"
  en: "Atratiqus (called al-halibi)"
  fr: "Atratiqus (appelé al-halibi)"
  ur: "اطراطیقوس ⁦(حالبی)⁩"
summary:
  ar: "دواء يُعرف عند الكتاب بالحالبي، فيه أدنى تبريد وليس فيه قبض، قوّته محلّلة مع التبريد، ينفع من أورام الحالب ضماداً وتعليقاً {cite:canon-ibn-sina-print-v1 p.376}."
  en: "A drug the book calls al-halibi. It has the least cooling and no astringency; its power is resolving with a little cooling. It helps swellings of the ureter, as a poultice and as an application {cite:canon-ibn-sina-print-v1 p.376}."
  fr: "Médicament que le livre appelle al-halibi. Il refroidit très peu et n’a pas d’astringence ; sa puissance est résolutive avec un léger refroidissement. Il aide contre les gonflements de l’uretère, en cataplasme et en application {cite:canon-ibn-sina-print-v1 p.376}."
  ur: "ایک دوا جسے کتاب حالبی کہتی ہے۔ اس میں تھوڑی سی ٹھنڈک ہے اور قبض نہیں؛ اس کی قوت ٹھنڈک کے ساتھ تحلیل کرنے کی ہے۔ یہ حالب کی سوجن میں لیپ اور لٹکانے دونوں طرح نفع دیتی ہے {cite:canon-ibn-sina-print-v1 p.376}۔"
