summary:
  ar: "ذريرة في الكتاب مدخل يحيل إلى ما قيل في فصل القاف عند قصب الذريرة ثم يضيف أنه قيل لا شيء أفضل منها لحرق النار بدهن ورد وخل، وأنها تنفع من أورام المعدة والأمعاء والكبد ومن الاستسقاء {cite:canon-ibn-sina-print-v1 p.719}"
  en: "Dharira is in the book an entry that refers to what was said in the chapter of the letter qaf at qasab al-dharira and then adds that it was said that nothing is better than it for a burn by fire, with rose oil and vinegar, and that it benefits swellings of the stomach and intestines and of the liver, and dropsy {cite:canon-ibn-sina-print-v1 p.719}"
  ur: "ذریرہ کتاب میں ایک اندراج ہے جو اس بات کی طرف رجوع کرتا ہے جو حرف قاف کے باب میں قصب الذریرہ کے ذکر پر کہی گئی، پھر اضافہ کرتا ہے کہ کہا گیا کہ آگ کے جلنے کے لیے گلاب کے تیل اور سرکے کے ساتھ اس سے بہتر کچھ نہیں، اور یہ معدے، آنتوں اور جگر کے ورموں اور استسقاء میں نافع ہے {cite:canon-ibn-sina-print-v1 p.719}۔"
  es: "Dharira es en el libro una entrada que se refiere a lo que se dijo en el capítulo de la carta qaf at qasab al-dharira y luego agrega que se dijo que nada es mejor que él para una quemadura por fuego, con aceite de rosa y vinagre, y que beneficia las hinchazones del estómago y los intestinos y del hígado, y la hidropesía {cite:canon-ibn-sina-print-v1 p.719}"
  fr: "Le livre contient une entrée concernant Dharira, qui fait référence à ce qui a été dit dans le chapitre de la lettre Qaf à Qasab al-Dharira, et qui ajoute qu'il a été dit que rien n'est meilleur que cette plante pour soigner une brûlure, associée à de l'huile de rose et du vinaigre, et qu'elle est bénéfique pour les gonflements de l'estomac, des intestins et du foie, ainsi que pour l'hydropisie. {cite:canon-ibn-sina-print-v1 p.719}"
  tr: "Dharira, Dharira'nın kamışındaki kaf bölümünde söylenenlere atıfta bulunan bir girişte, ardından yağ ve sirkeyle ateş yakmak için bundan daha iyi bir şey olmadığını, mide, bağırsaklar ve karaciğer tümörleri ile Ascites için fayda sağladığını ekler {cite:canon-ibn-sina-print-v1 s.719}"
  id: "Dharira dalam buku Sebuah entri yang merujuk pada apa yang dikatakan dalam bab tentang qaf di atas alang-alang dharira, kemudian menambahkan bahwa dikatakan tidak ada yang lebih baik daripada qaf untuk membakar api dengan minyak dan cuka, dan bahwa itu bermanfaat bagi tumor lambung, usus, dan hati, serta ascites {cite:canon-ibn-sina-print-v1 hlm.719}"
