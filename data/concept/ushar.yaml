summary:
  ar: "العشر في الكتاب شجرة أعرابية يمانية من اليتوعات حارة يابسة، فيها قبض معتدل، تطلى للسعف والقوباء والقلاع، ويحذر من صنف منها يضر الجلوس في ظله وربما قتل {cite:canon-ibn-sina-print-v1 p.620}"
  en: "Ushar is in the book an Arabian, Yemeni tree of the spurges, hot and dry, with a moderate astringency, applied on scalp scurf, ringworm and thrush, and the book warns of a kind whose shade harms and may kill one who sits in it {cite:canon-ibn-sina-print-v1 p.620}"
  ur: "عشر کتاب میں ایک عربی، یمنی درخت ہے جو یتوعات میں سے ہے، گرم خشک ہے اور اس میں معتدل قبض ہے، سر کی بھوسی، دادر اور چھالوں پر لگایا جاتا ہے، اور ایک قسم سے تنبیہ ہے جس کے سائے میں بیٹھنا نقصان دیتا اور کبھی ہلاک بھی کر دیتا ہے {cite:canon-ibn-sina-print-v1 p.620}۔"
  es: "Ushar es descrito en el libro como un árbol árabe yemení de la familia de las euforbias, de sabor cálido y seco, con una astringencia moderada, que se aplica sobre la caspa, la tiña y la candidiasis del cuero cabelludo. El libro advierte sobre una especie cuya sombra daña y puede matar a quien se sienta en ella {cite:canon-ibn-sina-print-v1 p.620}."
  fr: "L'Ushar est décrit dans le livre comme un arbre d'Arabie et du Yémen appartenant à la famille des euphorbes, chaud et sec, à l'astringence modérée, utilisé sur les pellicules, la teigne et le muguet du cuir chevelu. Le livre met en garde contre une espèce dont l'ombre est nocive et peut tuer celui qui s'y assoit {cite:canon-ibn-sina-print-v1 p.620}"
