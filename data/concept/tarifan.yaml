summary:
  ar: "نبات ينبت في الربيع بزره يشبه العصفر؛ طبيخه إذا صب على نهش الأفعى يسكن وجعه، وإن صب على عضو سليم أحدث به مثل وجع النهش."
  en: "A plant that grows in spring, its seed like safflower; its decoction poured on a viper bite calms the pain, but poured on a healthy limb it causes the pain of a bite."
  ur: "یہ بہار میں اُگنے والا پودا ہے، جس کا بیج کسم سے ملتا ہے؛ اس کا کاڑھا سانپ کے کاٹے پر ڈالا جائے تو درد کم ہوتا ہے، اور صحت مند عضو پر ڈالا جائے تو کاٹے جیسا درد پیدا کرتا ہے۔"
  es: "Es una planta que crece en primavera, cuya semilla es parecida al cártamo; su decocción, vertida sobre una mordedura de víbora, calma el dolor, pero vertida sobre una extremidad sana provoca el dolor de la mordedura."
  fr: "Plante qui pousse au printemps, dont les graines ressemblent à celles du carthame; sa décoction, versée sur une morsure de vipère, calme la douleur, mais versée sur un membre sain, elle provoque la douleur d'une morsure."
  tr: "İlkbaharda aspir çiçekine benzeyen tohumlar yetiştiren bir bitki; yılanın ısırığına döküldüğünde pişmesi acısını hafifletir, ancak sağlıklı bir uzağa döküldüğünde ısırığa benzer bir acı verir."
  id: "Tanaman yang tumbuh biji di musim semi yang menyerupai bunga safflower; masakannya saat dituangkan ke gigitan ular dapat meredakan rasa sakitnya, tetapi jika dituangkan pada cabang yang sehat, menyebabkan rasa sakit mirip gigitan."
