label: { ar: "الإبهام", en: "Ibham (ambiguity in speech and transactions)" }
summary:
  ar: "الإبهام في اللغة يُطلق على الإصبع الكبرى المتطرفة في اليد والقدم، ويُطلق على ما لا يُعرف الطريق إليه. وهو عند الفقهاء والأصوليين الكلام الذي لا يُعرف وجهُ المراد منه، فإن وقع في العقود فسد العقد في الجملة، وإن وقع في غيرها وجب البيان. وإذا جُني على الإصبع عمداً وجب القصاص، وخطأً وجبت عشر الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468}"
  en: "In the language, ibham refers to the big finger at the end of the hand or foot, and to whatever has no known way to it. For jurists and usulis it is speech whose meaning is unknown. If the ambiguity falls in a contract, the contract is in general invalid; if it falls elsewhere, the speaker must clarify it. Where a finger is harmed deliberately, retaliation is due; where it is harmed by mistake, a tenth of the blood money is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468}"
