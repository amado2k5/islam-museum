id: concept/ibham
class: concept
kind: legal
label: { ar: "الإبهام", en: "Ibham (ambiguity in speech and transactions)", es: "Ibham (ambigüedad en el habla y las transacciones)", fr: "Ibham (ambiguïté dans le discours et les transactions)", ur: "ابھم ⁦(گفتار اور لین دین میں ابہام)⁩", tr: "Başparmak", id: "Ibu jari" }
summary:
  ar: "الإبهام في اللغة يُطلق على الإصبع الكبرى المتطرفة في اليد والقدم، ويُطلق على ما لا يُعرف الطريق إليه. وهو عند الفقهاء والأصوليين الكلام الذي لا يُعرف وجهُ المراد منه، فإن وقع في العقود فسد العقد في الجملة، وإن وقع في غيرها وجب البيان. وإذا جُني على الإصبع عمداً وجب القصاص، وخطأً وجبت عشر الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468}"
  en: "In the language, ibham refers to the big finger at the end of the hand or foot, and to whatever has no known way to it. For jurists and usulis it is speech whose meaning is unknown. If the ambiguity falls in a contract, the contract is in general invalid; if it falls elsewhere, the speaker must clarify it. Where a finger is harmed deliberately, retaliation is due; where it is harmed by mistake, a tenth of the blood money is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468}"
  es: "En el idioma, ibham se refiere al dedo gordo del pie o de la mano, y a todo aquello a lo que no se puede acceder de forma conocida. Para los juristas y usulis, se trata de un discurso cuyo significado se desconoce. Si la ambigüedad se encuentra en un contrato, este suele ser inválido; si se encuentra en otro lugar, quien lo expresa debe aclararla. Si un dedo resulta dañado deliberadamente, se debe tomar represalia; si resulta dañado por error, se debe pagar la décima parte de la indemnización por la pérdida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468}"
  fr: "Dans cette langue, ibham désigne le gros doigt, à l'extrémité de la main ou du pied, et tout ce qui n'a pas de chemin connu pour y parvenir. Pour les juristes et les usulis, il s'agit d'une parole dont le sens est inconnu. Si l'ambiguïté se situe dans un contrat, celui-ci est généralement nul; si elle se situe ailleurs, celui qui parle doit la clarifier. Lorsqu'un doigt est blessé délibérément, une vengeance est due; lorsqu'il est blessé par erreur, un dixième du prix du sang est dû. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468}"
  ur: "زبان میں، ابھام سے مراد ہاتھ یا پاؤں کے آخر میں بڑی انگلی ہے، اور جس چیز کے لیے اس کا کوئی طریقہ معلوم نہیں ہے۔ فقہاء اور اصول کے نزدیک یہ وہ کلام ہے جس کا مفہوم معلوم نہیں ہے۔ اگر ابہام کسی معاہدے میں آتا ہے، تو معاہدہ عام طور پر باطل ہے۔ اگر یہ کہیں اور گرتا ہے، تو اسپیکر کو اس کی وضاحت کرنی چاہیے۔ جہاں جان بوجھ کر انگلی کو نقصان پہنچایا جائے تو جوابی کارروائی ہوتی ہے۔ جہاں اسے غلطی سے نقصان پہنچا ہے، خون کا دسواں حصہ واجب الادا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1467}"
  tr: "Dilde 'ibbah', el ve ayaktaki aşırı büyük parmağı ifade eder ve ulaşılması bilinmeyen şeyi ifade eder. Hukukçular ve ilke bilginlerine göre, amaçlanan anlamı bilinmeyen konuşmayı ifade eder; sözleşmelerde geçersiz, başka bir yerde geçersiz sayılır ve başka bir yerde geçersiz kalırsa açıklama gereklidir. Parmak kasıtlı olarak geçersiz kalırsa intikam gerekir, kazara ise kan parasının onda biri zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1468}"
  id: "Dalam bahasa, 'ibbah' merujuk pada jari besar yang ekstrem di tangan dan kaki, dan merujuk pada apa yang tidak diketahui telah dicapai. Menurut ahli hukum dan ahli prinsip, istilah ini merujuk pada ucapan yang maknanya tidak diketahui; jika muncul dalam kontrak, kontrak tersebut umumnya tidak sah, dan jika terjadi di tempat lain, diperlukan klarifikasi. Jika jari tersebut sengaja dibatalkan, maka pembalasan diperlukan, dan jika itu tidak disengaja, sepersepuluh uang darah wajib dilakukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1468}"
