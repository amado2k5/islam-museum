id: concept/canon-cupping-its-nature-and-its-time
class: concept
kind: scientific
label:
  ar: "الحجامة وطبيعتها ووقتها عند ابن سينا"
  en: "Cupping, its nature and its best time in the Canon"
  fr: "Nature et meilleur moment des ventouses dans le Canon"
  ur: "قانون میں حجامہ، اس کی طبیعت اور مناسب وقت"
  es: "La ventosaterapia, su naturaleza y su mejor momento en el Canon"
  tr: "İbn Sina'ya göre kupa terapisi, doğası ve zamanı"
  id: "Cupping, sifatnya, dan waktunya menurut Ibn Sina"
summary:
  ar: "يفتتح ابن سينا الفصل الحادي والعشرين بالحجامة فيقارنها بالفصد، ويبين أنها أبلغ في تنقية نواحي الجلد وأخرج للدم الرقيق، وأن نفعها قليل في الأبدان الغليظة الدم، ثم يحدد أفضل أوقاتها من الشهر ومن النهار {cite:canon-ibn-sina-print-v1 pp.299-300}."
  en: "Ibn Sina opens chapter 21 with cupping, comparing it with venesection: it cleanses the skin regions more and draws thin blood better, it helps little in thick-blooded bodies, and he sets its best time in the month and in the day {cite:canon-ibn-sina-print-v1 pp.299-300}."
  fr: "Au chapitre 21, Ibn Sina compare ventouses et saignée : les premières nettoieraient mieux la peau et attireraient mieux le sang fluide, mais aideraient peu les corps au sang épais. Il fixe leur moment préféré du mois et du jour {cite:canon-ibn-sina-print-v1 pp.299-300}."
  es: "Ibn Sina abre el capítulo 21 con la ventosaterapia, comparándola con la venopunción: limpia mejor las regiones de la piel y extrae mejor la sangre diluida, ayuda poco en cuerpos de sangre espesa, y establece su mejor momento en el mes y en el día {cite:canon-ibn-sina-print-v1 pp.299-300}."
  ur: "ابن سینا باب 21 کو سنگی لگانے کے ساتھ کھولتا ہے، اس کا تقابل نس بندی سے کرتا ہے: یہ جلد کے علاقوں کو زیادہ صاف کرتا ہے اور پتلا خون کو بہتر بناتا ہے، یہ موٹے خون والے جسموں میں بہت کم مدد کرتا ہے، اور وہ مہینے اور دن میں اس کا بہترین وقت مقرر کرتا ہے۔"
  tr: "İbn Sina, yirmi birinci bölümü kupa ile açar, bunu flebotomiye benzetir; cildi arındırmada ve ince kanı gidermede daha etkili olduğunu, kalın kanlı bedenler için faydasının sınırlı olduğunu açıklar. Sonra ayın en iyi zamanlarını ve günü belirtir {cite:canon-ibn-sina-print-v1 s.299-300}."
  id: "Ibn Sina membuka bab kedua puluh satu dengan bekam, membandingkannya dengan flebotomi, menjelaskan bahwa ini lebih efektif dalam memurnikan kulit dan menghilangkan darah tipis, serta manfaatnya terbatas untuk tubuh berdarah tebal. Ia kemudian menentukan waktu terbaik dalam sebulan dan hari {cite:canon-ibn-sina-print-v1 hlm.299-300}."
