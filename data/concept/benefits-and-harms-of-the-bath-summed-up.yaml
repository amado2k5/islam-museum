id: concept/benefits-and-harms-of-the-bath-summed-up
class: concept
kind: scientific
label:
  ar: "منافع الحمام ومضاره عند ابن سينا"
  en: "The benefits and harms of the bath summed up in the Canon"
  fr: "Bienfaits et méfaits du bain résumés dans le Canon"
  ur: "قانون میں حمام کے فوائد اور نقصانات کا خلاصہ"
  es: "Los beneficios y perjuicios del baño se resumen en el Canon."
summary:
  ar: "يذكر ابن سينا أن الحمام مسخن مبرد مرطب ميبس نافع ضار، ويجمل منافعه في التنويم وتحليل ما يراد تحليله ونفض ما يراد نفضه في جهته الطبيعية وحبس الإسهال وإزالة الإعياء، ومضاره في تضعيف القلب إن أفرط وإيراث الغشي والغثيان وتحريك المواد الساكنة وتهيئتها للعفونة وإمالتها إلى الأعضاء الضعيفة فتحدث الأورام {cite:canon-ibn-sina-print-v1 pp.226-227}."
  en: "Ibn Sina says the bath warms, cools, moistens and dries, helps and harms, and sums its benefits as bringing sleep, dissolving what is meant to dissolve, shaking out what is meant to be shaken out in its natural direction, stopping looseness and removing fatigue, and its harms as weakening the heart if overdone, bringing fainting and nausea, stirring still matters and readying them for putrefaction and turning them to the cavities and weak organs, so that swellings arise {cite:canon-ibn-sina-print-v1 pp.226-227}."
  fr: "Selon Ibn Sina, le bain réchauffe, refroidit, humidifie et dessèche, aide et nuit. Ses bienfaits sont le sommeil, la résolution de ce qui doit se résoudre, l’évacuation de ce qui doit l’être dans sa direction naturelle, l’arrêt du relâchement et la disparition de la fatigue. En excès, il affaiblirait le cœur, provoquerait évanouissement et nausée, mobiliserait les matières immobiles, les préparerait à la putréfaction et les dirigerait vers les cavités et organes faibles, provoquant des gonflements {cite:canon-ibn-sina-print-v1 pp.226-227}."
  es: "Ibn Sina dice que el baño calienta, enfría, humedece y seca, ayuda y perjudica, y resume sus beneficios como traer sueño, disolver lo que debe disolverse, sacudir lo que debe sacudirse en su dirección natural, detener la flacidez y eliminar la fatiga, y sus perjuicios como debilitar el corazón si se exagera, provocar desmayos y náuseas, remover las materias estancadas y prepararlas para la putrefacción y dirigirlas hacia las cavidades y los órganos débiles, de modo que surgen hinchazones {cite:canon-ibn-sina-print-v1 pp.226-227}."
  ur: "ابن سینا کہتے ہیں کہ غسل گرم کرتا ہے، ٹھنڈا کرتا ہے، تر کرتا ہے اور خشک کرتا ہے، مدد کرتا ہے اور نقصان پہنچاتا ہے، اور اس کے فوائد کو نیند لانے، تحلیل کرنے والی چیز کو تحلیل کرنے، جس چیز کو ہلانا ہے اسے اس کی فطری سمت میں ہلانا، ڈھیلے پن کو روکنا اور تھکاوٹ کو دور کرنا، اور اس کے نقصانات دل کو کمزور کرنے کے طور پر ہیں، اگر ان کا زیادہ استعمال ہو جائے اور ان کے استعمال کو ٹھنڈا کر دیا جائے۔ گڑبڑ اور کمزور اعضاء کی طرف موڑنا، تاکہ سوجن پیدا ہو {حوالہ: کینون ابن سینا پرنٹ-v1 صفحہ 226-227}۔"
