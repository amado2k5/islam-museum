label: { ar: "منافع الحمام ومضاره عند ابن سينا", en: "The benefits and harms of the bath summed up in the Canon", ur: "قانون میں حمام کے فوائد اور نقصانات کا خلاصہ" }
summary:
  ar: "يذكر ابن سينا أن الحمام مسخن مبرد مرطب ميبس نافع ضار، ويجمل منافعه في التنويم وتحليل ما يراد تحليله ونفض ما يراد نفضه في جهته الطبيعية وحبس الإسهال وإزالة الإعياء، ومضاره في تضعيف القلب إن أفرط وإيراث الغشي والغثيان وتحريك المواد الساكنة وتهيئتها للعفونة وإمالتها إلى الأعضاء الضعيفة فتحدث الأورام {cite:canon-ibn-sina-print-v1 pp.226-227}."
  en: "Ibn Sina says the bath warms, cools, moistens and dries, helps and harms, and sums its benefits as bringing sleep, dissolving what is meant to dissolve, shaking out what is meant to be shaken out in its natural direction, stopping looseness and removing fatigue, and its harms as weakening the heart if overdone, bringing fainting and nausea, stirring still matters and readying them for putrefaction and turning them to the cavities and weak organs, so that swellings arise {cite:canon-ibn-sina-print-v1 pp.226-227}."
