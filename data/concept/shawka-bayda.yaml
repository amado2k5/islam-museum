summary:
  ar: "شوكة البيضاء في الكتاب قيل إنه الباذاورد، ينبت في جبال وغياض، له ورق شبيه بورق الخامالاون الأبيض أدق وأشد بياضا وهو مشوك، وله ساق مجوفة بيضاء ورأس مشوك وزهر لونه كلون الفرفيرية وبزر شبيه بحب القرطم وأصله أحمر، بارد يابس في الأولى، إذا علق في موضع طرد الهوام، ويضمد بأصله الأورام البلغمية، وطبيخه ينفع وجع الأسنان والنقرس، وأصله إذا شرب نافع لنفث الدم ولاسترخاء المعدة وللإسهال المزمن ويدر البول وينفع من لذع الهوام {cite:canon-ibn-sina-print-v1 p.684}"
  en: "Shawka bayda is in the book said to be badhawurd, growing in mountains and thickets, with a leaf like that of the white khamalaun but finer and whiter and thorny, a hollow white stalk, a thorny head, a flower the colour of purple, a seed like the safflower seed and a red root; cold and dry in the first degree; when hung up in a place it drives away vermin; its root is a poultice for phlegmatic swellings, its decoction benefits toothache and gout, and its root when drunk is beneficial for spitting of blood, slackness of the stomach and chronic diarrhoea, promotes urine and benefits the stinging of vermin {cite:canon-ibn-sina-print-v1 p.684}"
  ur: "شوکۃ البیضاء کتاب میں کہا گیا ہے کہ یہ باذاورد ہے، پہاڑوں اور جھاڑیوں میں اگتی ہے، اس کا پتہ سفید خاماليون کے پتے جیسا مگر باریک اور زیادہ سفید اور کانٹے دار ہے، سفید کھوکھلا تنا، کانٹے دار سر، ارغوانی رنگ کا پھول، کُسم کے بیج جیسا بیج اور سرخ جڑ ہے؛ پہلے درجے میں سرد خشک ہے؛ کسی جگہ لٹکانے سے کیڑے مکوڑوں کو بھگاتی ہے؛ اس کی جڑ کا لیپ بلغمی ورموں پر کیا جاتا ہے، اس کا جوشاندہ دانت کے درد اور نقرس میں نافع ہے، اور اس کی جڑ پینے پر خون تھوکنے، معدے کے ڈھیلے پن اور پرانے اسہال میں نافع ہے، پیشاب لاتی ہے اور کیڑوں کے ڈنک میں نافع ہے {cite:canon-ibn-sina-print-v1 p.684}۔"
  es: "En el libro se dice que Shawka bayda es badhawurd, que crece en montañas y matorrales, con una hoja parecida a la del khamalaun blanco pero más fina, blanca y espinosa, un tallo blanco hueco, una cabeza espinosa, una flor de color púrpura, una semilla parecida a la del cártamo y una raíz roja; fría y seca en primer grado; cuando se cuelga en un lugar, ahuyenta a los parásitos; su raíz es una cataplasma para las hinchazones flemáticas, su decocción beneficia el dolor de muelas y la gota, y su raíz, cuando se bebe, es beneficiosa para la expectoración de sangre, la flacidez estomacal y la diarrea crónica, promueve la micción y beneficia la picadura de los parásitos {cite:canon-ibn-sina-print-v1 p.684}"
  fr: "Le Shawka bayda est décrit dans le livre comme une plante appelée badhawurd, poussant dans les montagnes et les fourrés. Ses feuilles ressemblent à celles du khamalaun blanc, mais sont plus fines, plus blanches et épineuses. Sa tige est blanche et creuse, son capitule est épineux, sa fleur est violette, sa graine est semblable à celle du carthame et sa racine est rouge. Elle est appréciée pour son climat froid et sec. Suspendue, elle éloigne la vermine. Sa racine est utilisée en cataplasme contre les gonflements phlegmatiques, sa décoction soulage les maux de dents et la goutte, et sa racine, consommée en infusion, est bénéfique en cas de crachats de sang, de constipation et de diarrhée chronique. Elle favorise la diurèse et soulage les piqûres de vermine. {cite:canon-ibn-sina-print-v1 p.684}"
  tr: "Kitaptaki beyaz dikenin Badhaward olduğu söylenir, dağlarda ve vadilerde yetişir. Yaprakları çiğ yaprağa benzer. Beyaz rengi daha ince, daha beyazdır ve dikenlidir. İçi boş beyaz bir sapı, dikenli bir başı ve purfiriye benzer, başlangıçta kırmızı olan saf tohumlarına benzer tohumları olan bir çiçeği vardır. İlk formunda somurtkan, köstebek attığı yere sıkıştığında soğuk kurudur ve kökü balgam tümörlerini iyileştirir. Pişirmesi diş ağrısı ve gut hastalığına yardımcı olur. İçildiğinde kökeni kan yavruları, mide rahatlama, kronik ishal, idrar söktürücüler ve böceklerin sokması için faydalıdır {cite:canon-ibn-sina-print-v1 s.684}"
  id: "Duri putih dalam buku ini dikatakan sebagai Badhaward, tumbuh di pegunungan dan lembah. Daunnya mirip dengan daun mentah. Warna putihnya lebih halus dan lebih putih serta berduri. Memiliki batang putih berongga, kepala berduri, dan bunga mirip purphyria, dengan biji mirip biji safflower yang awalnya berwarna merah. Duri ini kering dingin pada bentuk pertama, jika terjebak di lokasi tikus lalat, dan akarnya menyembuhkan tumor dahak. Memasaknya membantu mengatasi sakit gigi dan asam urat. Asalnya, saat diminum, bermanfaat untuk anak anjing darah, relaksasi perut, diare kronis, diuretik, dan bermanfaat untuk serangga yang menyengat {cite:canon-ibn-sina-print-v1 hlm.684}"
