id: concept/masiya
class: concept
kind: legal
label:
  ar: المعصية
  en: Ma'siya (disobedience, sin)
  ur: معصیت (گناہ)
summary:
  ar: "المعصية في اللغة الخروج من الطاعة، وفي الاصطلاح فعل حرام مقصود بعينه، وتفرق عن الزلة التي هي فعل غير مقصود في عينه. وقسّم الفقهاء المعاصي باعتبارات: فجمهور العلماء يقسمونها إلى صغائر وكبائر، وأنكرت جماعة الصغيرة، وقسّمها الحليمي إلى صغيرة وكبيرة وفاحشة، وقسّمها الماوردي باعتبار ميل النفس إليها. ومن آثارها عقوبات دنيوية حسية ومعنوية، وأخروية، وتجب التوبة منها على الفور، ويُكره الإصرار عليها، وتُستحب الصدقة عقبها عند الشافعية، ويُستر الذنب عند الجمهور، ولا يجوز التحدث به تفكهاً، ولا تصح الإجارة ولا الوقف ولا الوصية ولا النذر فيها، ولا تُعطى الزكاة لمن خرج في معصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14775} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14779}"
  en: "In the Kuwaiti encyclopedia's account, disobedience (ma'siya) is lexically leaving obedience and in the jurists' technical sense a forbidden act intended in itself. It differs from a slip (zalla), which is not intended in itself. Jurists divide sins into minor and grave, a view some deny, and by the soul's inclination. Their effects include worldly penalties, spiritual deprivation and punishment in the hereafter. Repentance is obligatory at once; persistence is condemned; concealment is recommended except where a hadd is involved. Contracts for hiring, endowment, bequest and vows for sin are invalid, and zakat is not given to a traveller on a sinful journey. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14775} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14778} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14779}"
  ur: "گناہ (معصیت) لغت میں اطاعت سے نکلنے کو کہتے ہیں اور اصطلاح میں ایسا حرام فعل جو مقصود بالذات ہو، جبکہ لغزش (زلہ) وہ فعل ہے جو مقصود نہ ہو۔ فقہاء گناہوں کو صغیرہ و کبیرہ میں تقسیم کرتے ہیں، اور دنیوی و اخروی سزائیں بیان کرتے ہیں۔ توبہ فوراً واجب ہے، اصرار مذموم ہے، اور گناہ پر اجارہ، وقف، وصیت اور نذر درست نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14778}"
