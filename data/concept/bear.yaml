summary:
  ar: "الدب عند الدميري: دابة من سباع الجبال، قالوا إن لحمه لا يؤكل عند كثير من أهل العلم لكونه ذا ناب يفترس، وفي أخباره أنه من أحذق الدواب وأقواها بأساً إذا غضب."
  en: "The bear in al-Damiri: a predator of the mountains; most scholars hold its flesh is not eaten as it is a fanged beast of prey, and the reports tell it is among the craftiest and fiercest of beasts when angered."
  ur: "دمیری میں ریچھ: پہاڑوں کا درندہ؛ اکثر علماء کے نزدیک اس کا گوشت حلال نہیں کہ وہ نوکدار شکاری ہے؛ اخبار میں ہے کہ غصے میں سب سے چالاک اور سخت جانوروں میں ہے۔"
  es: "El oso en al-Damiri: un depredador de las montañas; la mayoría de los eruditos sostienen que su carne no se come porque es una bestia de presa con colmillos, y los relatos dicen que es una de las bestias más astutas y feroces cuando se enfurece."
  fr: "L'ours chez al-Damiri: un prédateur des montagnes; la plupart des érudits estiment que sa chair n'est pas consommée car c'est une bête de proie aux crocs acérés, et les récits rapportent qu'il compte parmi les bêtes les plus rusées et les plus féroces lorsqu'il est en colère."
  tr: "Al-Damiri'ye göre, ayı bir dağ hayvanıdır. Etinin birçok bilgin tarafından yenmediği, çünkü avlanan bir köpeği olduğu söylenir. Raporlarında, öfkelendiğinde en yetenekli ve güçlü hayvanlardan biri olduğu belirtilir."
  id: "Menurut Al-Damiri, beruang adalah binatang gunung. Mereka mengatakan dagingnya tidak dimakan oleh banyak ulama karena ia memiliki anjing yang memangsa. Dalam laporannya, beruang ini dikatakan sebagai salah satu hewan paling terampil dan kuat saat marah."
