summary:
  ar: "السوسن في الكتاب نبات ذو ورق شبيه بورق الكسيقون أعرض منه، له ساق عليها زهر منحن بألوان مختلفة من بياض وصفرة وأرجوان ولون السماء، وله أصول صلبة عقدية طيبة الرائحة، والأبيض البستاني منه حار يابس إلى الثانية، يجلو ويجفف باعتدال، وينفع من الكلف والنمش ومن عرق النسا وقروح الرأس والصدر، وفي الكتاب نقل موسوم في الرحم والطمث {cite:canon-ibn-sina-print-v1 p.590}."
  en: "Sawsan is in the book a plant whose leaf resembles that of kasiqun but is broader, with a stem bearing a drooping flower in several colours, white, yellow, purple and the colour of the sky, and hard knotted roots of good scent; the white garden kind is hot and dry to the second degree, cleanses and dries with moderation, and the book lists it for freckles and spots, sciatica and pains of the joints, scalp ulcers and the chest, with a labelled listing on the womb and menses {cite:canon-ibn-sina-print-v1 p.590}."
  ur: "سوسن کتاب میں ایک پودا ہے جس کا پتا کسیقون کے پتے جیسا مگر اس سے چوڑا ہے، اس کے تنے پر جھکا ہوا پھول ہے جس کے رنگ مختلف ہیں: سفید، زرد، ارغوانی اور آسمانی؛ اس کی جڑیں سخت، گانٹھ دار اور خوشبودار ہیں؛ سفید باغی قسم دوسرے درجے تک گرم خشک ہے، اعتدال سے جلا دیتی اور خشک کرتی ہے؛ کتاب اسے جھائیوں اور چھائیوں، عرق النسا اور جوڑوں کے درد، سر کے زخموں، اور سینے کے لیے گنواتی ہے، اور رحم و حیض کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.590}۔"
  es: "Sawsan es en el libro una planta cuya hoja se asemeja a la de kasiqun pero es más ancha, con un tallo que lleva una flor colgante de varios colores, blanco, amarillo, púrpura y del color del cielo, y raíces duras y nudosas de buen aroma; la variedad blanca de jardín es cálida y seca en segundo grado, limpia y seca con moderación, y el libro la enumera para pecas y manchas, ciática y dolores de las articulaciones, úlceras del cuero cabelludo y el pecho, con una lista etiquetada para el útero y la menstruación {cite:canon-ibn-sina-print-v1 p.590}."
  fr: "Le Sawsan est décrit dans le livre comme une plante dont la feuille ressemble à celle du kasiqun mais est plus large, avec une tige portant une fleur pendante de plusieurs couleurs, blanche, jaune, violette et couleur ciel, et des racines noueuses et dures au bon parfum; la variété blanche de jardin est chaude et sèche au deuxième degré, purifie et assèche avec modération, et le livre la mentionne pour les taches de rousseur et les boutons, la sciatique et les douleurs articulaires, les ulcères du cuir chevelu et de la poitrine, avec une mention sur l'utérus et les menstruations {cite:canon-ibn-sina-print-v1 p.590}."
  tr: "Kitaptaki iris, scydon'a benzer yapraklara sahip, ondan daha geniş, gövdesi beyaz, sarı, mor ve gökyüzü renklerinde çeşitli renklerde kıvrımlı çiçeklere sahip bir bitkidir. Sert, hoş kokulu kökleri vardır ve bahçenin beyazı diğerine sıcak ve kurudur, durulanır ve orta derecede kuruyur, melazma, çiller, siyatik ve baş ile göğüs ülserleri için faydalıdır. Kitapta 'Rahim ve Regl' başlıklı bir alıntı bulunur {cite:canon-ibn-sina-print-v1 s.590}."
  id: "Iris dalam buku ini adalah tanaman dengan daun mirip dengan scydon, lebih lebar darinya, dengan batang bunga melengkung dalam berbagai warna putih, kuning, ungu, dan warna langit. Akarnya keras dan harum, dan warna putih taman berwarna panas dan kering untuk yang lain, dibilas dan kering sedang, serta bermanfaat untuk melasma, bintik-bintik, sciatica, serta borok kepala dan dada. Buku ini memuat kutipan berjudul 'Uterus and Menstruation' {cite:canon-ibn-sina-print-v1 hlm.590}."
