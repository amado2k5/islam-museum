id: concept/zij-sabi-inhabited-earth-length-and-latitude
class: concept
kind: scientific
label: { ar: "طول المعمور وعرضه في الزيج الصابي", en: "The length and latitude of the inhabited earth", ur: "آباد زمین کا طول اور عرض" }
summary:
  ar: "يحدد البتاني طول المعمور من الجزائر العامرة، وهي ست جزائر في بحر أوقيانس الغربي، إلى أقصى عمران الصين، فيجده اثنتي عشرة ساعة أي نصف دائرة الأرض. وحدد عرضه من خط الاستواء إلى جزيرة تولي حيث يبلغ أطول النهار عشرين ساعة، وهو نحو ستين جزءاً أي سدس دائرة الأرض، فما يظهر من العمران نحو نصف سدس الأرض، جزء من اثني عشر. {cite:zij-sabi-nallino-byblion pp.29-30}."
  en: "Al-Battani fixes the length of the inhabited earth from the Inhabited Islands, six islands in the western ocean, to the farthest limit of China, and finds it twelve hours, half the circle of the earth. Its latitude he takes from the equator to the island of Thule, where the longest day reaches twenty hours: about sixty parts, a sixth of the earth's circle, so the inhabited part seen is about half a sixth of the earth, one part in twelve. {cite:zij-sabi-nallino-byblion pp.29-30}."
  ur: "البتانی آباد زمین کا طول جزائر عامرہ سے، جو بحر اوقیانس مغربی میں چھ جزیرے ہیں، چین کی انتہائی آبادی تک لیتے ہیں اور اسے بارہ گھنٹے یعنی زمین کے دائرے کا نصف پاتے ہیں۔ اس کا عرض خط استوا سے جزیرۂ تولی تک ہے جہاں سب سے لمبا دن بیس گھنٹے کا ہوتا ہے، اور یہ تقریباً ساٹھ جز یعنی زمین کے دائرے کا چھٹا حصہ ہے، چنانچہ جو آبادی ظاہر ہے وہ زمین کا تقریباً نصف سدس ہے، بارہواں حصہ۔ {cite:zij-sabi-nallino-byblion pp.29-30}۔"
