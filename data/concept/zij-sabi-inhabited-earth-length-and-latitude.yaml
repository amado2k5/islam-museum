id: concept/zij-sabi-inhabited-earth-length-and-latitude
class: concept
kind: scientific
label: { ar: "طول المعمور وعرضه في الزيج الصابي", en: "The length and latitude of the inhabited earth", ur: "آباد زمین کا طول اور عرض", es: "La longitud y latitud de la Tierra habitada", fr: "La longueur et la latitude de la terre habitée" }
summary:
  ar: "يحدد البتاني طول المعمور من الجزائر العامرة، وهي ست جزائر في بحر أوقيانس الغربي، إلى أقصى عمران الصين، فيجده اثنتي عشرة ساعة أي نصف دائرة الأرض. وحدد عرضه من خط الاستواء إلى جزيرة تولي حيث يبلغ أطول النهار عشرين ساعة، وهو نحو ستين جزءاً أي سدس دائرة الأرض، فما يظهر من العمران نحو نصف سدس الأرض، جزء من اثني عشر. {cite:zij-sabi-nallino-byblion pp.29-30}."
  en: "Al-Battani fixes the length of the inhabited earth from the Inhabited Islands, six islands in the western ocean, to the farthest limit of China, and finds it twelve hours, half the circle of the earth. Its latitude he takes from the equator to the island of Thule, where the longest day reaches twenty hours: about sixty parts, a sixth of the earth's circle, so the inhabited part seen is about half a sixth of the earth, one part in twelve. {cite:zij-sabi-nallino-byblion pp.29-30}."
  ur: "البتانی آباد زمین کا طول جزائر عامرہ سے، جو بحر اوقیانس مغربی میں چھ جزیرے ہیں، چین کی انتہائی آبادی تک لیتے ہیں اور اسے بارہ گھنٹے یعنی زمین کے دائرے کا نصف پاتے ہیں۔ اس کا عرض خط استوا سے جزیرۂ تولی تک ہے جہاں سب سے لمبا دن بیس گھنٹے کا ہوتا ہے، اور یہ تقریباً ساٹھ جز یعنی زمین کے دائرے کا چھٹا حصہ ہے، چنانچہ جو آبادی ظاہر ہے وہ زمین کا تقریباً نصف سدس ہے، بارہواں حصہ۔ {cite:zij-sabi-nallino-byblion pp.29-30}۔"
  es: "Al-Battani fija la longitud de la Tierra habitada desde las Islas Habitadas, seis islas en el océano occidental, hasta el límite más lejano de China, y calcula que es de doce horas, la mitad de la circunferencia terrestre. Su latitud la toma desde el ecuador hasta la isla de Thule, donde el día más largo alcanza las veinte horas: aproximadamente sesenta partes, una sexta parte de la circunferencia terrestre, por lo que la parte habitada visible es aproximadamente media sexta parte de la Tierra, una parte en doce. {cite:zij-sabi-nallino-byblion pp.29-30}."
  fr: "Al-Battani fixe la longueur de la surface terrestre habitée depuis les Îles Habitées, six îles de l'océan Atlantique, jusqu'à la limite la plus éloignée de la Chine, et la trouve égale à douze heures, soit la moitié du cercle terrestre. Il en détermine la latitude depuis l'équateur jusqu'à l'île de Thulé, où le jour le plus long atteint vingt heures: environ soixante parties, soit un sixième du cercle terrestre. Ainsi, la partie habitée visible représente environ un demi-sixième de la Terre, soit une partie sur douze. {cite:zij-sabi-nallino-byblion pp.29-30}."
