id: concept/ilaj-qaranitus-al-mushtarak
class: concept
kind: scientific
label:
  ar: "العلاج المشترك لأصناف قرانيطس"
  en: "The common treatment of the kinds of qaranitus"
  ur: "قرانیطس کی قسموں کا مشترک علاج"
  es: "El tratamiento común de los tipos de qaranitus"
  fr: "Le traitement courant des différents types de qaranitus"
summary:
  ar: "يذكر ابن سينا مبادئ علاج قرانيطس الحقيقي: الاستفراغ بالدم مع الاحتياط من الغشي، وجذب المواد، والتبريد، وتدبير المسكن والصحبة والنوم، وتلطيف الغذاء ثم التدرج فيه، وتدبير الناقهين؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.80} {cite:canon-ibn-sina-print-v2 p.81} {cite:canon-ibn-sina-print-v2 p.82}"
  en: "Ibn Sina gives the principles of treating true qaranitus: evacuation of blood with care against fainting, drawing the matters away, cooling, the management of the dwelling, company and sleep, lightening the food and then raising it by degrees, and the regimen of the convalescent; recipes and methods of application are left out {cite:canon-ibn-sina-print-v2 p.80} {cite:canon-ibn-sina-print-v2 p.81} {cite:canon-ibn-sina-print-v2 p.82}"
  ur: "ابن سینا حقیقی قرانیطس کے علاج کے اصول بتاتا ہے: غشی سے احتیاط کے ساتھ خون کا استفراغ، مادوں کو کھینچ لینا، ٹھنڈک پہنچانا، رہائش، صحبت اور نیند کی تدبیر، غذا کو ہلکا کرنا پھر درجہ بدرجہ بڑھانا، اور صحت یاب ہونے والے کی تدبیر؛ نسخے اور استعمال کے طریقے چھوڑ دیے گئے ہیں {cite:canon-ibn-sina-print-v2 p.80} {cite:canon-ibn-sina-print-v2 p.81} {cite:canon-ibn-sina-print-v2 p.82}۔"
  es: "Ibn Sina expone los principios para tratar a los verdaderos qaranitus: evacuación de la sangre con cuidado para evitar desmayos, eliminación de las sustancias, enfriamiento, manejo de la vivienda, compañía y sueño, aligeramiento de la comida y luego aumento gradual de la misma, y el régimen del convaleciente; se omiten recetas y métodos de aplicación {cite:canon-ibn-sina-print-v2 p.80} {cite:canon-ibn-sina-print-v2 p.81} {cite:canon-ibn-sina-print-v2 p.82}"
  fr: "Ibn Sina expose les principes du traitement de la véritable qaranitus: l’évacuation du sang en prenant soin d’éviter les évanouissements, l’élimination des matières fécales, le refroidissement, l’aménagement du logement, la gestion des relations et du sommeil, l’allègement puis l’augmentation progressive de l’alimentation, et le régime du convalescent; les recettes et les méthodes d’application sont omises. {cite:canon-ibn-sina-print-v2 p.80} {cite:canon-ibn-sina-print-v2 p.81} {cite:canon-ibn-sina-print-v2 p.82}"
