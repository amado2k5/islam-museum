id: concept/free-resources-and-their-share
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: الموارد الحرة وعائدها
  en: Free resources and their share
  es: "Recursos gratuitos y su parte"
  fr: "Ressources gratuites et leur partage"
  ur: "مفت وسائل اور ان کا حصہ"
  tr: "Ücretsiz kaynaklar ve bunların getirileri"
  id: "Sumber daya gratis dan hasilnya"
summary:
  ar: يقسم المؤلف الموارد باعتبار الملك إلى حرة لا يملكها أحد ولا ثمن لها، كالهواء، واقتصادية مملوكة لا تنال إلا ببذل الثمن، كالقمح {cite:usul-iqtisad-islami-0660 p. 16}، وباعتبار الأصل إلى طبيعية، وهي هبة من الخالق دون عمل أو كلفة، ومكتسبة بالعمل {cite:usul-iqtisad-islami-0660 p. 16}. والموارد الحرة إذا استُخدمت في الإنتاج لا تنال حصة من الناتج، وعوائدها من حق الفقراء، ولذلك فُرضت الزكاة على سائمة الماشية والزروع والثمار على نحو يقابل هذه الحصة {cite:usul-iqtisad-islami-0660 p. 16} {cite:usul-iqtisad-islami-0660 p. 17}. ويذكر المؤلف أن المقدار المفروض لا يزيد على معدل العائد على حصة الفقراء، وأنه يُدفع من النصاب شيوعًا بنسبة لا مبلغًا مقطوعًا {cite:usul-iqtisad-islami-0660 p. 17}، وأن الزرع البعلي فيه العشر والمسقي بمياه مكلّفة فيه نصف العشر {cite:usul-iqtisad-islami-0660 p. 17} {cite:usul-iqtisad-islami-0660 p. 18}. ويعيب على الاقتصاد الوضعي إهمال الموارد الحرة في الإنتاج والتوزيع {cite:usul-iqtisad-islami-0660 p. 17} {cite:usul-iqtisad-islami-0660 p. 18}.
  tr: "Yazar, kaynakları mülkiyet kavramına göre kimsenin sahip olmadığı ve hava gibi paha biçilmez olan ücretsiz varlıklar ile fiyat verilerek elde edilen ekonomik varlıklar (örneğin buğday {cite:usul-iqtisad-islami-0660 s. 16} ve kökenini doğal olarak kabul ederek, emek ve maliyet olmadan Yaratıcı'dan gelen bir armağan {cite:usul-iqtisad-islami-0660 s. 16}. Eğer serbest kaynaklar üretim için kullanılırsa, üretimden pay almazlar ve getirileri fakirlere aittir. Bu nedenle, zekat, hayvanların, ürünlerin ve meyvelerin otlatılmasına bu paya uygun şekilde uygulanmıştır {cite:usul-iqtisad-islami-0660 s. 16} {cite:usul-iqtisad-islami-0660 s. 17}. Yazar, dayatılan tutarın yoksulların payının ortalama getirisini aşmadığını, nisabdan genel bir oranda ödendiğini, toplu bir ödeme olmadığını {cite:usul-iqtisad-islami-0660 s. 17}} ve yağmurla beslenen ürünlerin onda biri maliyetli ve suyla sulanan ürünlerin yarısına mal olduğunu belirtir {cite:usul-iqtisad-islami-0660 s. 17} {cite:usul-iqtisad-islami-0660 s. 18}. Pozitivist ekonomiyi, üretim ve dağıtımda serbest kaynakları ihmal etmekle eleştirir {cite:usul-iqtisad-islami-0660 s. 17} {cite:usul-iqtisad-islami-0660 s. 18}."
  id: "Penulis membagi sumber daya menurut konsep kepemilikan menjadi aset bebas yang dimiliki oleh siapa pun dan aset yang tak ternilai seperti udara, serta aset ekonomi yang hanya diperoleh dengan memberikan harga, seperti gandum {cite:usul-iqtisad-islami-0660 hlm. 16}, dan menganggap asal-usulnya alami, hadiah dari Sang Pencipta tanpa tenaga kerja atau biaya, diperoleh melalui kerja {cite:usul-iqtisad-islami-0660 hlm. 16}. Jika sumber daya gratis digunakan untuk produksi, mereka tidak menerima bagian dari hasil produksi, dan hasilnya menjadi milik orang miskin. Oleh karena itu, zakat dikenakan pada penggembalaan ternak, tanaman, dan buah dengan cara yang sesuai dengan bagian ini {cite:usul-iqtisad-islami-0660 hlm. 16} {cite:usul-iqtisad-islami-0660 hlm. 17}. Penulis mencatat bahwa jumlah yang dikenakan tidak melebihi rata-rata pengembalian bagian orang miskin, bahwa dibayarkan dari nisab sebagai proporsi umum, bukan sekaligus {cite:usul-iqtisad-islami-0660 hlm. 17}, dan bahwa tanaman yang diberi air harganya sepersepuluh dan irigasi dengan air setengahnya {cite:usul-iqtisad-islami-0660 hlm. 17} {cite:usul-iqtisad-islami-0660 hlm. 18}. Ia mengkritik ekonomi positivis karena mengabaikan sumber daya bebas dalam produksi dan distribusi {cite:usul-iqtisad-islami-0660 hlm. 17} {cite:usul-iqtisad-islami-0660 hlm. 18}."
