label:
  ar: الموارد الحرة وعائدها
  en: Free resources and their share
summary:
  ar: يقسم المؤلف الموارد باعتبار الملك إلى حرة لا يملكها أحد ولا ثمن لها، كالهواء، واقتصادية مملوكة لا تنال إلا ببذل الثمن، كالقمح {cite:usul-iqtisad-islami-0660 p. 16}، وباعتبار الأصل إلى طبيعية، وهي هبة من الخالق دون عمل أو كلفة، ومكتسبة بالعمل {cite:usul-iqtisad-islami-0660 p. 16}. والموارد الحرة إذا استُخدمت في الإنتاج لا تنال حصة من الناتج، وعوائدها من حق الفقراء، ولذلك فُرضت الزكاة على سائمة الماشية والزروع والثمار على نحو يقابل هذه الحصة {cite:usul-iqtisad-islami-0660 p. 16} {cite:usul-iqtisad-islami-0660 p. 17}. ويذكر المؤلف أن المقدار المفروض لا يزيد على معدل العائد على حصة الفقراء، وأنه يُدفع من النصاب شيوعًا بنسبة لا مبلغًا مقطوعًا {cite:usul-iqtisad-islami-0660 p. 17}، وأن الزرع البعلي فيه العشر والمسقي بمياه مكلّفة فيه نصف العشر {cite:usul-iqtisad-islami-0660 p. 17} {cite:usul-iqtisad-islami-0660 p. 18}. ويعيب على الاقتصاد الوضعي إهمال الموارد الحرة في الإنتاج والتوزيع {cite:usul-iqtisad-islami-0660 p. 17} {cite:usul-iqtisad-islami-0660 p. 18}.
