id: "concept/aghshiyat-al-ayn-wa-al-jufn"
class: "concept"
kind: "scientific"
label:
  ar: "أغشية العين والجفن"
  en: "The eye's coats and the eyelid"
  fr: "Les tuniques de l’œil et la paupière"
  ur: "آنکھ کے غشائے اور پلک"
  es: "Las capas del ojo y el párpado"
summary:
  ar: "طرف العصبة يحتوي على الزجاجية والجليدية كإحتواء الشبكة على الصيد فسميت شبكية، ومن طرفها نسج عنكبوتي يتولد منه صفاق لطيف حاجز بين الجليدية والبيضية، ثم المشيمية منفذ الغذاء، ثم العنبية الأسمانجونية اللون المثقوبة ثقبة تقع فيها التأدية، ثم القرنية الصلبة المركبة من طبقات رقاق، والملتحمة، وأجزاء الجفن جلد فطاق فشحم فعضل فالطاق الآخر {cite:canon-ibn-sina-print-v2 p.161} {cite:canon-ibn-sina-print-v2 p.163}"
  en: "The nerve's end holds the glass-like and the ice-like as a net holds the catch, hence net-like (shabakiyya); from its end grows a spider-web tissue yielding a thin separator between ice-like and white-of-egg; then the choroid (mashimiyya), the true feeder; then the azure grape-like coat (anabiyya) pierced by the aperture where transmission occurs; then the hard cornea, built of thin layers — four by some, three by others; and the conjunctiva; the eyelid's parts: skin, the upper tarsus, fat, muscle and the lower tarsus {cite:canon-ibn-sina-print-v2 p.162} {cite:canon-ibn-sina-print-v2 p.163}"
  fr: "L’extrémité du nerf contient les humeurs vitrée et glaciale comme un filet contient la prise, d’où son nom de réticulée (shabakiyya) ; de son extrémité naît un tissu en toile d’araignée produisant une mince cloison entre l’humeur glaciale et celle qui ressemble au blanc d’œuf ; puis vient la choroïde (mashimiyya), qui nourrit véritablement ; puis la tunique azurée en forme de raisin (anabiyya), percée de l’ouverture par laquelle s’effectue la transmission ; puis la cornée dure, faite de couches minces — quatre selon certains, trois selon d’autres ; et la conjonctive ; les parties de la paupière : peau, tarse supérieur, graisse, muscle et tarse inférieur {cite:canon-ibn-sina-print-v2 p.162} {cite:canon-ibn-sina-print-v2 p.163}"
  ur: "عصب کے سرے زجاجیہ اور جلیدیہ کو اس طرح سمیٹے ہیں جیسے جال شکار کو، اسی لیے شبکیہ کہلائی؛ اس کے سرے سے مکڑی کے جال جیسا بافت نکلتا ہے جس سے جلیدیہ اور بيضيہ کے درمیان ایک باریک صفاق پیدا ہوتا ہے؛ پھر مشیمیہ جو اصل غذا رساں ہے؛ پھر آسمانی رنگ کی عنبیہ جس میں سوراخ ہے جہاں ادائیگی ہوتی ہے؛ پھر سخت قرنیہ جو باریک تہوں سے بنی ہے — بعض کے نزدیک چار اور بعض کے نزدیک تین؛ اور ملتحمہ؛ پلک کے اجزا: جلد، اوپر کا طاق، چربی، پٹھا اور نیچے کا طاق {cite:canon-ibn-sina-print-v2 p.162} {cite:canon-ibn-sina-print-v2 p.163}"
  es: "El extremo del nervio sostiene lo vítreo y lo helado como una red sostiene la presa, de ahí su nombre en forma de red (shabakiyya); de su extremo crece un tejido similar a una telaraña que produce un delgado separador entre lo helado y la clara de huevo; luego la coroides (mashimiyya), el verdadero alimentador; luego la capa azul similar a una uva (anabiyya) perforada por la abertura donde ocurre la transmisión; luego la córnea dura, construida de capas delgadas —cuatro en algunos casos, tres en otros—; y la conjuntiva; las partes del párpado: piel, tarso superior, grasa, músculo y tarso inferior {cite:canon-ibn-sina-print-v2 p.162} {cite:canon-ibn-sina-print-v2 p.163}"
