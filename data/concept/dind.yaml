summary:
  ar: "الدند ثمر الخروع الصيني، وأجوده الصيني، وهو حار جداً، ولا يُسقى إلا بحذر، والكتاب يحذّر من إفراطه. {cite:canon-ibn-sina-print-v1 p.441}"
  en: "Dind is the Chinese castor fruit; the Chinese kind is the best and strongest. It is very hot and must be given with care, and the book warns against excess. {cite:canon-ibn-sina-print-v1 p.441}"
  ur: "دند چینی ارنڈ کا پھل ہے؛ چینی قسم سب سے بہتر اور طاقتور ہے۔ یہ بہت گرم ہے اور احتیاط سے دیا جاتا ہے، اور کتاب زیادتی سے خبردار کرتی ہے۔ {cite:canon-ibn-sina-print-v1 p.441}"
  es: "El dind es el fruto del ricino chino; la variedad china es la mejor y más potente. Es muy picante y debe administrarse con precaución, y el libro advierte contra el exceso. {cite:canon-ibn-sina-print-v1 p.441}"
  fr: "Le dind est le fruit du ricin chinois; la variété chinoise est la meilleure et la plus puissante. Il est très fort et doit être consommé avec précaution, et le livre met en garde contre tout excès. {cite:canon-ibn-sina-print-v1 p.441}"
