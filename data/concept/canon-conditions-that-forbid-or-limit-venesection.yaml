id: concept/canon-conditions-that-forbid-or-limit-venesection
class: concept
kind: scientific
label:
  ar: "أحوال تمنع الفصد أو تقيده عند ابن سينا"
  en: "Conditions that forbid or limit venesection in the Canon"
  fr: "Conditions interdisant ou limitant la saignée dans le Canon"
  ur: "قانون میں وہ حالات جن میں فصد منع یا محدود ہے"
  es: "Condiciones que prohíben o limitan la venesección en el Canon"
summary:
  ar: "يجمع ابن سينا الأحوال التي يحذر فيها الفصد: الحبلى والطامث والقولنج، والمزاج والبلاد الشديدة البرد، والوجع الشديد، وبعد الاستحمام والجماع، وصغر السن والشيخوخة، والأبدان الشديدة القضافة أو السمن، وطول المرض، ما لم تطمئن إلى السحنة {cite:canon-ibn-sina-print-v1 pp.290-292}."
  en: "Ibn Sina gathers the states in which bleeding is guarded against: the pregnant and the menstruating woman and colic, a very cold temperament and very cold countries, severe pain, after a bath and after coitus, youth and old age, bodies very lean or very fat, and long illness, unless the physique gives confidence {cite:canon-ibn-sina-print-v1 pp.290-292}."
  fr: "Ibn Sina réunit les situations appelant la prudence : grossesse, règles, coliques, tempérament ou pays très froids, douleur intense, après bain et rapports sexuels, jeunesse et vieillesse, maigreur ou obésité extrêmes, maladie prolongée, sauf constitution rassurante {cite:canon-ibn-sina-print-v1 pp.290-292}."
  es: "Ibn Sina reúne los estados en los que se debe evitar el sangrado: la mujer embarazada y menstruante y el cólico, un temperamento muy frío y los países muy fríos, el dolor intenso, después de un baño y después del coito, la juventud y la vejez, cuerpos muy delgados o muy gordos y enfermedades prolongadas, a menos que el físico dé confianza {cite:canon-ibn-sina-print-v1 pp.290-292}."
