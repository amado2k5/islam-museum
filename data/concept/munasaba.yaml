id: concept/munasaba
class: concept
kind: legal
label: { ar: "المُنَاسَبَة", en: "Suitability (munasaba) as a ground of legal cause", ur: "مناسبت (علت کا معقول ربط)" }
summary:
  ar: "المناسبة في اللغة الملاءمة، وفي الاصطلاح وصف ظاهر منضبط يحصل عقلا من ترتب الحكم عليه ما يصلح أن يكون مصلحة للعقلاء أو دفع مفسدة. وهي من الطرق المعقولة لإثبات العلة، وتنقسم إلى مؤثرة وملائمة وغريبة، وباعتبار شهادة الشرع لها إلى ما ألغاه الشرع وما اعتبره وما لم يعلم اعتباره ولا إلغاؤه."
  en: "Munasaba in the lexicon is fitness. In usul it is an apparent, definable attribute whose connection with the ruling is understood by reason as bringing a benefit or averting a harm. It is one of the rational ways to establish a ground of ruling. It is divided into effective, fitting and strange; and, by the law's recognition, into what the law disregards, what it upholds, and what is neither upheld nor disregarded (the public interest without a text)."
  ur: "مناسبت لغت میں ملاءمت کو کہتے ہیں۔ اصول میں یہ ایسی ظاہر اور منضبط صفت ہے جس کا حکم سے ربط عقل سے سمجھا جائے، اور وہ مصلحت یا مفسدہ کو دور کرنے والی ہو۔ اس کی تین قسمیں مؤثر، ملائم اور غریب ہیں۔"
