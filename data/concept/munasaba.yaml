label: { ar: "المُنَاسَبَة", en: "Suitability (munasaba) as a ground of legal cause", ur: "مناسبت ⁦(علت کا معقول ربط)⁩", es: "Idoneidad (munasaba) como fundamento de causa jurídica", fr: "L'aptitude (munasaba) comme fondement d'une cause légale" }
summary:
  ar: "المناسبة في اللغة الملاءمة، وفي الاصطلاح وصف ظاهر منضبط يحصل عقلا من ترتب الحكم عليه ما يصلح أن يكون مصلحة للعقلاء أو دفع مفسدة. وهي من الطرق المعقولة لإثبات العلة، وتنقسم إلى مؤثرة وملائمة وغريبة، وباعتبار شهادة الشرع لها إلى ما ألغاه الشرع وما اعتبره وما لم يعلم اعتباره ولا إلغاؤه."
  en: "Munasaba in the lexicon is fitness. In usul it is an apparent, definable attribute whose connection with the ruling is understood by reason as bringing a benefit or averting a harm. It is one of the rational ways to establish a ground of ruling. It is divided into effective, fitting and strange; and, by the law's recognition, into what the law disregards, what it upholds, and what is neither upheld nor disregarded (the public interest without a text)."
  ur: "مناسبت لغت میں ملاءمت کو کہتے ہیں۔ اصول میں یہ ایسی ظاہر اور منضبط صفت ہے جس کا حکم سے ربط عقل سے سمجھا جائے، اور وہ مصلحت یا مفسدہ کو دور کرنے والی ہو۔ اس کی تین قسمیں مؤثر، ملائم اور غریب ہیں۔"
  es: "Munasaba en el léxico significa aptitud. En usul, es un atributo aparente y definible cuya conexión con la norma se entiende por la razón como algo que aporta un beneficio o evita un daño. Es una de las formas racionales de establecer un fundamento para una norma. Se divide en eficaz, apropiado y extraño; y, por reconocimiento de la ley, en lo que la ley desestima, lo que respalda y lo que no es ni respaldado ni desestimado (el interés público sin texto)."
  fr: "Dans le lexique, « munasaba » signifie aptitude. En droit coutumier (usul), il s'agit d'un attribut apparent et définissable dont le lien avec la décision est compris par la raison comme apportant un bénéfice ou évitant un préjudice. C'est l'un des moyens rationnels d'établir un fondement à une décision. On distingue trois catégories: l'aptitude effective, l'aptitude appropriée et l'étrangeté; et, selon la reconnaissance juridique, on distingue ce que la loi ignore, ce qu'elle retient et ce qui n'est ni retenu ni ignoré (l'intérêt public en l'absence de texte)."
