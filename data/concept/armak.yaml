id: concept/armak
class: concept
kind: natural
label:
  ar: "أرماك"
  en: "Armak (Yemeni fragrant wood)"
  fr: "Armak (bois odorant du Yémen)"
  ur: "ارماک ⁦(یمنی خوشبودار لکڑی)⁩"
summary:
  ar: "خشبة يمانية عطرية تشبه القرفة في لونها، تطيّب النكهة، وتنفع الأورام الحارة والقروح المتسعة، وتقوي الدماغ واللثة والقلب، وأكلها ينفع من الرمد، وتعقل الطبيعة {cite:canon-ibn-sina-print-v1 p.373}."
  en: "A fragrant Yemeni wood resembling cinnamon in colour. It sweetens the breath, helps hot swellings and spreading ulcers, strengthens the brain, gums and heart, its eating helps ophthalmia, and it binds the bowels {cite:canon-ibn-sina-print-v1 p.373}."
  fr: "Un bois odorant du Yémen dont la couleur ressemble à celle de la cannelle. Il adoucit l’haleine, est bénéfique contre les tuméfactions chaudes et les ulcères qui s’étendent, fortifie le cerveau, les gencives et le cœur ; sa consommation est bénéfique contre l’ophtalmie, et il resserre les intestins {cite:canon-ibn-sina-print-v1 p.373}."
  ur: "یمنی خوشبودار لکڑی جو رنگ میں دارچینی سے ملتی ہے۔ یہ سانس کی بو درست کرتی ہے، گرم سوجنوں اور پھیلتے ہوئے زخموں میں نفع دیتی ہے، دماغ، مسوڑھوں اور دل کو قوت دیتی ہے، کھانے سے آشوبِ چشم میں فائدہ دیتی ہے، اور پیٹ کو باندھتی ہے {cite:canon-ibn-sina-print-v1 p.373}۔"
