tags: ["nubuwat-browser", "nubuwat-nubuwwa"]
summary:
  ar: "عدد ابن خلدون علامات الأنبياء: الغيبة عن الحاضرين عند الوحي مع غطيط يشبه الغشي وهو استغراق في لقاء الملك الروحاني ثم يتنزل إلى المدارك البشرية إما بسماع دوي من الكلام أو يتمثل له صورة شخص، والخلق الذي كان قبل الوحي من مجانبة المذمومات وهو معنى العصمة كأنه مفطور على التنزه عنها حتى كان لا يقرب البصل والثوم لأنه يناجي من لا يناجون، والدعاء إلى الدين والعبادة من الصلاة والصدقة والعفاف وبه استدلت خديجة وأبو بكر واستدل هرقل على صدقه لما أجابه أبو سفيان فقال إن يكن ما تقول حقاً فهو نبي وسيملك ما تحت قدمي هاتين، والحسب في قومهم لقوله ما بعث الله نبياً إلا في منعة من قومه أي عصبة وشوكة تمنعه عن أذى الكفار حتى يبلغ رسالة ربه، ووقوع الخوارق لهم شاهدة بصدقهم {cite:muqaddima-ibn-khaldun p. 90-92}. ومن علاماته المشاهدة خاتم النبوة بين كتفيه — شامة كزر الحجلة رآها السائب بن يزيد غلاماً حين توضأ فقام خلف ظهره {cite:sahih-al-bukhari 190}."
  en: "The trance, pre-prophetic sinlessness, the call to worship (Heraclius's test), protected lineage and miracles {cite:muqaddima-ibn-khaldun p. 90-92}."
  fr: "La transe, la préservation du péché avant la prophétie, l’appel au culte (l’épreuve d’Héraclius), la protection du lignage et les miracles {cite:muqaddima-ibn-khaldun p. 90-92}."
  es: "El trance, la impecabilidad preprofética, el llamado a la adoración (la prueba de Heraclio), el linaje protegido y los milagros {cite:muqaddima-ibn-khaldun p. 90-92}."
  ur: "ٹرانس، قبل از نبوت بے گناہی، عبادت کی دعوت ⁦(ہراکلیس کا امتحان)⁩، محفوظ نسب اور معجزات۔ 90-92}۔"
  tr: "İbn Haldun'un peygamberlerin işaretleri listesi: Vahiy sırasında bulunanların bayılmaya benzeyen bir gheit ile sırtından söylenmesi, yani ruhani kralla buluşmaya dalmak, ardından ya konuşmanın yankısını duyarak ya da bir kişi olarak görünerek insan alemlerine inmek. Vahiyden önceki karakter, suçlulardan kaçınmaktı; yanılmaz olmanın anlamı da budur; sanki onlardan kaçınmak öğretilmişti ki, soğan ve sarımsağa yaklaşmazdı çünkü konuşmayanlarla konuşurdu. Dine ve ibadete dua, sadaka ve iffet yoluyla çağrı yapmak Khadice ve Ebu Bekir tarafından kanıt olarak kullanılmıştır. Herakleios, Ebu Sufyan şöyle yanıt verdiğinde doğruluğunu destekledi: Eğer söylediklerin doğruysa, o bir peygamberdir ve bu ikisinin ayaklarının altındaki şeyi yönetecektir. Halkları arasındaki özellik şudur: Tanrı sadece halkını korumak için bir peygamber göndermiştir, yani Rabbinin mesajına ulaşana kadar kâfirlere zarar vermesini engelleyen bir grup ve diken ve doğaüstü olayların gerçekleşmesi onların doğruluğunun kanıtıdır {atı:Muqaddima-ibn-khaldun, s. 90-92}. Görünür işaretlerinden biri, omuzları arasında peygamberlik mührü vardır — Sa'ib ibn Yezid'in çocukken abdest alırken ve arkasında dururken gördüğü, palmiye altın plakası gibi bir bendir {atıf:sahih-al-bukhari 190}."
  id: "Daftar tanda-tanda nabi Ibn Khaldun: Diberitahu dari belakang dengan gheit yang menyerupai pingsan saat wahyu, yaitu, menyelam bertemu raja spiritual, lalu mendengar gema pidato atau muncul sebagai seseorang yang turun ke alam manusia. Karakter sebelum wahyu adalah menghindari orang berdosa; ini juga berarti menjadi tak pernah salah; seolah-olah menghindari mereka diajarkan untuk tidak mendekati bawang dan bawang putih karena dia berbicara kepada mereka yang tidak berbicara. Seruan kepada agama dan ibadah melalui doa, amal, dan kesucian digunakan sebagai bukti oleh Khadice dan Abu Bakr. Heraclius mendukung kebenarannya ketika Abu Sufyan menjawab: Jika apa yang kamu katakan benar, dia adalah nabi dan akan mengatur apa yang ada di bawah kaki kedua orang ini. Ciri khas di antara umat mereka adalah ini: Allah mengutus seorang nabi hanya untuk melindungi umat-Nya, yaitu kelompok yang mencegah bahaya bagi orang-orang kafir sampai pesan Tuhan mereka tersampai, dan terjadinya duri serta peristiwa supranatural adalah bukti kebenaran mereka {di: Muqaddima-ibn-khaldun, hlm. 90-92}. Salah satu tanda yang terlihat adalah segel kenabian di antara bahu mereka — sebuah lempeng emas seperti telapak tangan yang dilihat Sa'ib ibn Yazid saat masih kecil sedang berwudhu dan berdiri di belakangnya {atribusi: Sahih al-Bukhari 190}."
