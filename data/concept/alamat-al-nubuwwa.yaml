id: concept/alamat-al-nubuwwa
class: concept
kind: term
label: { ar: "علامات النبوة", en: "The signs of prophethood" }
summary:
  ar: "عدد ابن خلدون علامات الأنبياء: الغيبة عن الحاضرين عند الوحي مع غطيط يشبه الغشي وهو استغراق في لقاء الملك الروحاني ثم يتنزل إلى المدارك البشرية إما بسماع دوي من الكلام أو يتمثل له صورة شخص، والخلق الذي كان قبل الوحي من مجانبة المذمومات وهو معنى العصمة كأنه مفطور على التنزه عنها حتى كان لا يقرب البصل والثوم لأنه يناجي من لا يناجون، والدعاء إلى الدين والعبادة من الصلاة والصدقة والعفاف وبه استدلت خديجة وأبو بكر واستدل هرقل على صدقه لما أجابه أبو سفيان فقال إن يكن ما تقول حقاً فهو نبي وسيملك ما تحت قدمي هاتين، والحسب في قومهم لقوله ما بعث الله نبياً إلا في منعة من قومه أي عصبة وشوكة تمنعه عن أذى الكفار حتى يبلغ رسالة ربه، ووقوع الخوارق لهم شاهدة بصدقهم {cite:muqaddima-ibn-khaldun p. 90-92}. ومن علاماته المشاهدة خاتم النبوة بين كتفيه — شامة كزر الحجلة رآها السائب بن يزيد غلاماً حين توضأ فقام خلف ظهره {cite:sahih-al-bukhari 190}."
  en: "The trance, pre-prophetic sinlessness, the call to worship (Heraclius's test), protected lineage and miracles {cite:muqaddima-ibn-khaldun p. 90-92}."
