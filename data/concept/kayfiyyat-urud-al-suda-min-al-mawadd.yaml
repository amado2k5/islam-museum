id: concept/kayfiyyat-urud-al-suda-min-al-mawadd
class: concept
kind: scientific
label:
  ar: "كيفية عروض الصداع من المواد"
  en: "How headache arises from matters"
  ur: "مادوں سے صداع کے لاحق ہونے کی کیفیت"
  es: "Cómo surge el dolor de cabeza a partir de asuntos"
  fr: "Comment les maux de tête surviennent à partir de certaines choses"
  tr: "Malzemelerden Kaynaklanan Baş Ağrılarını Nasıl Gösterirsiniz"
  id: "Cara Menampilkan Sakit Kepala dari Material"
summary:
  ar: "يبيّن ابن سينا أن المواد تسبّب الصداع بالذات أو بالعرض: بالذات بتغيير المزاج أو بتفريق الاتصال، وبالعرض بالسدّة، وأن السدة تكون بلزوجة الخلط أو غلظه أو كثرته {cite:canon-ibn-sina-print-v2 pp.48-49}"
  en: "Ibn Sina shows that matters cause headache by essence or by accident: by essence through changing the temperament or breaking continuity, by accident through an obstruction, which comes from the viscosity, thickness or abundance of a humour {cite:canon-ibn-sina-print-v2 pp.48-49}"
  ur: "ابن سینا بتاتا ہے کہ مادے صداع کا سبب بالذات یا بالعرض بنتے ہیں: بالذات مزاج بدلنے یا اتصال توڑنے سے، اور بالعرض سدّے سے، جو خلط کی لزوجت، غلظت یا کثرت سے ہوتا ہے {cite:canon-ibn-sina-print-v2 pp.48-49}۔"
  es: "Ibn Sina muestra que los asuntos causan dolor de cabeza por esencia o por accidente: por esencia, a través de un cambio de temperamento o una ruptura de la continuidad; por accidente, a través de una obstrucción que proviene de la viscosidad, el espesor o la abundancia de un humor {cite:canon-ibn-sina-print-v2 pp.48-49}."
  fr: "Ibn Sina montre que les matières causent des maux de tête par essence ou par accident: par essence, en changeant le tempérament ou en rompant la continuité, par accident, par une obstruction, qui provient de la viscosité, de l'épaisseur ou de l'abondance d'une humeur {cite:canon-ibn-sina-print-v2 pp.48-49}"
  tr: "İbn Sina, maddelerin özellikle veya tesadüfi olarak baş ağrısına neden olduğunu açıklar: özellikle ruh hali değişiklikleri veya temasın dağılımıyla, tıkanıklığın ise karışımın viskozitesi, kalınlığı veya bolluğundan kaynaklandığını {atıf:canon-ibn-sina-print-v2 s.48-49}"
  id: "Ibn Sina menjelaskan bahwa zat menyebabkan sakit kepala secara spesifik atau kebetulan: terutama melalui perubahan suasana hati atau penyebaran kontak, dan bahwa penyumbatan disebabkan oleh viskositas, ketebalan, atau kelimpahan campuran {cite:canon-ibn-sina-print-v2 hlm.48-49}"
