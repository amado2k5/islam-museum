id: concept/rabiba-fiqh
class: concept
kind: legal
label:
  ar: "الربيبة"
  en: "Rabiba (a stepdaughter: the marriage bar that follows entering the mother)"
  ur: "ربیبہ (سوتیلی بیٹی)"
summary:
  ar: "الربيبة في اصطلاح الفقهاء بنت الزوجة، وبنت ابنها وبنت بنتها وإن نزلن، من النسب أو الرضاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} وهي محرّمة بشرط دخول الرجل بأمها، ولا يشترط أن تكون في حجره عند عامة الفقهاء، وقال عمر وعلي بخلافه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} ولا يقوم موت الزوجة مقام الدخول عند عامة الفقهاء، وخالف الحنابلة في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} وتثبت حرمة بنات الربيبة وبنات أبنائها بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618}"
  en: "A rabiba is the daughter of a wife, and the daughter of her son or daughter however far down, by blood or fostering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} She is forbidden to the husband when he has entered her mother, and most jurists do not require that she be in his custody, though Umar and Ali did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} The death of the wife before entry does not take the place of entry for most jurists, while a Hanbali view counts it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} The daughters of the rabiba and their daughters are forbidden by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618}"
  ur: "ربیبہ سوتیلی بیٹی ہے؛ ماں سے دخول ہو جائے تو وہ حرام ہو جاتی ہے، اور اس کی بیٹیاں بالاجماع حرام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618}"
