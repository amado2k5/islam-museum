id: concept/rabiba-fiqh
class: concept
kind: legal
label:
  ar: "الربيبة"
  en: "Rabiba (a stepdaughter: the marriage bar that follows entering the mother)"
  ur: "ربیبہ ⁦(سوتیلی بیٹی)⁩"
  es: "Rabiba (hijastra: la prohibición matrimonial que sigue a la entrada de la madre)"
  fr: "Rabiba (une belle-fille: l’interdiction de mariage qui suit l’entrée dans la famille de la mère)"
summary:
  ar: "الربيبة في اصطلاح الفقهاء بنت الزوجة، وبنت ابنها وبنت بنتها وإن نزلن، من النسب أو الرضاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} وهي محرّمة بشرط دخول الرجل بأمها، ولا يشترط أن تكون في حجره عند عامة الفقهاء، وقال عمر وعلي بخلافه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} ولا يقوم موت الزوجة مقام الدخول عند عامة الفقهاء، وخالف الحنابلة في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} وتثبت حرمة بنات الربيبة وبنات أبنائها بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618}"
  en: "A rabiba is the daughter of a wife, and the daughter of her son or daughter however far down, by blood or fostering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} She is forbidden to the husband when he has entered her mother, and most jurists do not require that she be in his custody, though Umar and Ali did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} The death of the wife before entry does not take the place of entry for most jurists, while a Hanbali view counts it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} The daughters of the rabiba and their daughters are forbidden by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618}"
  ur: "ربیبہ سوتیلی بیٹی ہے؛ ماں سے دخول ہو جائے تو وہ حرام ہو جاتی ہے، اور اس کی بیٹیاں بالاجماع حرام ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618}"
  es: "Una rabiba es la hija de una esposa, y la hija de su hijo o hija, sin importar el grado de parentesco, ya sea por consanguinidad o crianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} Está prohibida para el marido una vez que ha entrado con su madre, y la mayoría de los juristas no exigen que esté bajo su custodia, aunque Umar y Ali sí lo hicieron. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} La muerte de la esposa antes de la entrada no reemplaza la entrada para la mayoría de los juristas, mientras que una visión hanbalí sí la cuenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} Las hijas de la rabiba y sus hijas están prohibidas por consenso. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618}"
  fr: "Une rabiba est la fille d'une épouse, ainsi que la fille de son fils ou de sa fille, quel que soit le degré de parenté, par le sang ou par adoption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} Elle est interdite à l'époux dès lors qu'il a pris sa mère, et la plupart des juristes n'exigent pas qu'elle soit sous sa garde, contrairement à Umar et Ali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} Le décès de l'épouse avant l'entrée dans le mariage n'est pas considéré comme une entrée dans le mariage par la plupart des juristes, tandis que l'école hanbalite le prend en compte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8618} Les filles de la rabiba et leurs filles sont, par consensus, interdites. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8618}"
