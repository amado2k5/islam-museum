id: concept/ghurbat-al-islam
class: concept
kind: term
label:
  ar: "غربة الإسلام"
  en: "Ghurbat al-Islam (the strangeness of Islam)"
  ur: "غربتِ اسلام"
  es: "Ghurbat al-Islam (la extrañeza del Islam)"
  fr: "Ghurbat al-Islam (l'étrangeté de l'Islam)"
  tr: "İslam'ın Yabancılaşması"
  id: "Pengasingan Islam"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن الإسلام بدأ غريبًا وسيعود غريبًا كما بدأ، وأن الغربة الثانية أشد من الأولى، وأن الثبات لازم في الغربة. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep04 01:10:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep07 00:56:00}"
  en: "Sheikh Omar Abdelkafy holds that Islam began as a strange thing and will return strange, and that the second strangeness is harder than the first {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep04 01:10:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep07 00:56:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک اسلام اجنبی شروع ہوا اور اجنبی ہو کر لوٹے گا، اور دوسری غربت پہلی سے سخت ہے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep04 01:10:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep07 00:56:00}۔"
  es: "El jeque Omar Abdelkafy sostiene que el Islam comenzó como algo extraño y volverá a ser extraño, y que la segunda extrañeza es más difícil que la primera {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep04 01:10:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep07 00:56:00}."
  fr: "Le cheikh Omar Abdelkafy soutient que l'islam a commencé comme une chose étrange et qu'il redeviendra étrange, et que la seconde étrangeté est plus difficile que la première {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep04 01:10:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep07 00:56:00}."
  tr: "Şeyh Ömer Abdulkafi, İslam'ın garip başladığını ve başladığı gibi garip döneceğini, ikinci sürgünün birincisinden daha ağır olduğunu ve sürgünde kararlılığın gerekli olduğunu düşünür. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep04 01:10:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep07 00:56:00}"
  id: "Sheikh Omar Abdul Kafi percaya bahwa Islam bermula dengan aneh dan akan kembali seaneh seperti awalnya, bahwa pengasingan kedua lebih berat daripada yang pertama, dan keteguhan sangat penting dalam pengasingan. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep04 01:10:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep07 00:56:00}"
