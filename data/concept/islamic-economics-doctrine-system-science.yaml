  ar: 'الاقتصاد الإسلامي: مذهب ونظام وعلم'
  en: 'Islamic economics: doctrine, system and science'
summary:
  ar: 'يفرّق المؤلف بين ثلاثة معانٍ: المذهب، وهو مجموعة المبادئ الإسلامية الثابتة التي تُتخذ منطلقًا لنظرية، والنظام، وهو الأفكار والمؤسسات المتصلة بالأهداف والوسائل، والعلم، وهو دراسة الواقع الاقتصادي وتفسيره وتعليله {cite:usul-iqtisad-islami-0660 p. 44} {cite:usul-iqtisad-islami-0660 p. 45}. ويرى أن المذهب يعتمد النقل، والنظرية تعتمد العقل، وأن المذهب يهتم بما ينبغي أن يكون، والنظرية بما هو كائن {cite:usul-iqtisad-islami-0660 p. 44}. ويذكر أن محمد باقر الصدر قال إن علم الاقتصاد الإسلامي لا يولد إلا إذا جُسِّد في المجتمع، ويرى المؤلف أن عنوان الصدر غير مناسب، وأن كتابه أقرب إلى المذهب منه إلى العلم {cite:usul-iqtisad-islami-0660 p. 45} {cite:usul-iqtisad-islami-0660 p. 46}. ويفرّق المؤلف بين النظام الإسلامي والنظام الرأسمالي: كلاهما يقر حرية السوق والملكية الخاصة، لكن الإسلام يعتمد الدين والخلق، والرأسمالية تكرّس قوة الأقوياء {cite:usul-iqtisad-islami-0660 p. 46} {cite:usul-iqtisad-islami-0660 p. 47}.'
