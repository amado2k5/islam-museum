summary:
  ar: 'يفرّق المؤلف بين ثلاثة معانٍ: المذهب، وهو مجموعة المبادئ الإسلامية الثابتة التي تُتخذ منطلقًا لنظرية، والنظام، وهو الأفكار والمؤسسات المتصلة بالأهداف والوسائل، والعلم، وهو دراسة الواقع الاقتصادي وتفسيره وتعليله {cite:usul-iqtisad-islami-0660 p. 44} {cite:usul-iqtisad-islami-0660 p. 45}. ويرى أن المذهب يعتمد النقل، والنظرية تعتمد العقل، وأن المذهب يهتم بما ينبغي أن يكون، والنظرية بما هو كائن {cite:usul-iqtisad-islami-0660 p. 44}. ويذكر أن محمد باقر الصدر قال إن علم الاقتصاد الإسلامي لا يولد إلا إذا جُسِّد في المجتمع، ويرى المؤلف أن عنوان الصدر غير مناسب، وأن كتابه أقرب إلى المذهب منه إلى العلم {cite:usul-iqtisad-islami-0660 p. 45} {cite:usul-iqtisad-islami-0660 p. 46}. ويفرّق المؤلف بين النظام الإسلامي والنظام الرأسمالي: كلاهما يقر حرية السوق والملكية الخاصة، لكن الإسلام يعتمد الدين والخلق، والرأسمالية تكرّس قوة الأقوياء {cite:usul-iqtisad-islami-0660 p. 46} {cite:usul-iqtisad-islami-0660 p. 47}.'
  tr: "Yazar üç anlamı ayırır: teorinin başlangıç noktası olan sabit İslami ilkeler bütünü olan medhab; ve amaçlar ve araçlarla ilgili fikirler ve kurumlar olan sistem; ve ekonomik gerçekliğin incelenmesi, yorumlanması ve akıl yürütmesi olan bilim {cite:usul-iqtisad-islami-0660 s. 44} {cite:usul-iqtisad-islami-0660 s. 45}. Mezhabın aktarıma dayandığına, teorinin akla dayandığına, madhhabın ne olması gerektiğine önem verdiğine ve teorinin {cite:usul-iqtisad-islami-0660 s. 44} olduğuna inanır. Muhammed Baqir al-Sadr'ın İslami ekonominin ancak toplumda somutlaştığında doğduğunu söylediğini belirtmekte fayda var; yazar ise el-Sadr'ın unvanını uygun bulmamaktadır ve kitabının bilimden çok doktrine daha yakın olduğunu {cite:usul-iqtisad-islami-0660 s. 45} {cite:usul-iqtisad-islami-0660 s. 46}} Yazar, İslami sistem ile kapitalist sistemi ayırır: her ikisi de piyasa özgürlüğünü ve özel mülkiyeti tanır, ancak İslam din ve ahlaka dayanır, kapitalizm ise güçlü olanın gücünü pekiştirir {cite:usul-iqtisad-islami-0660 s. 46} {cite:usul-iqtisad-islami-0660 s. 47}."
  id: "Penulis membedakan antara tiga makna: madhhab, yaitu kumpulan prinsip Islam tetap yang menjadi titik awal teori; dan sistem, yaitu gagasan dan institusi yang berkaitan dengan tujuan dan sarana; dan ilmu pengetahuan, yaitu studi, interpretasi, dan penalaran realitas ekonomi {cite:usul-iqtisad-islami-0660 hlm. 44} {cite:usul-iqtisad-islami-0660 hlm. 45}. Ia percaya bahwa madhhab bergantung pada transmisi, teori bergantung pada akal, madhhab peduli pada apa yang seharusnya ada, dan teori sebagai {cite:usul-iqtisad-islami-0660 hlm. 44}. Perlu disebutkan bahwa Muhammad Baqir al-Sadr mengatakan bahwa ekonomi Islam hanya lahir jika diwujudkan dalam masyarakat, dan penulis menganggap gelar al-Sadr tidak tepat, dan bukunya lebih dekat pada doktrin daripada ilmu pengetahuan {cite:usul-iqtisad-islami-0660 hlm. 45} {cite:usul-iqtisad-islami-0660 hlm. 46}. Penulis membedakan antara sistem Islam dan sistem kapitalis: keduanya mengakui kebebasan pasar dan kepemilikan pribadi, tetapi Islam bergantung pada agama dan moralitas, dan kapitalisme mengkonsolidasikan kekuatan yang berkuasa {cite:usul-iqtisad-islami-0660 hlm. 46} {cite:usul-iqtisad-islami-0660 hlm. 47}."
