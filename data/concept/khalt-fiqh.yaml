label:
  ar: الخلط
  en: Khalt (mixing of property and things)
  ur: خلط
summary:
  ar: 'الخلط لغة مزج الشيء بغيره، وأعم من أن يكون في المائعات أو غيرها، وفي الكليات الجمع بين أجزاء شيئين فأكثر؛ وأحكامه تختلف بحسب موضوعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7746} خلط ما تجب فيه الزكاة: إذا خلط اثنان من أهل الزكاة مالين لهما مما تجب فيه الزكاة بخلطة الشيوع أو الجوار زكيا زكاة الواحد عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747} خلط المالين في الشركة: الحنفية والمالكية والحنابلة يرون انعقاد الشركة بمجرد العقد دون خلط، والشافعية يشترطون الخلط قبل العقد خلطا لا يتميز معه المال، فإن كان بعده لم يكف ويعاد العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747} الخلط تعديا: إذا خلط الغاصب أو الأمين المال بغيره، فإن أمكن التمييز لزمه، وإلا كان كالتالف فينتقل الحق إلى الذمة، سواء خلطه بمثله أو أجود أو أردأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} خلط الولي مال الصبي بماله: جائز إذا كان فيه حظ للصبي؛ وخلط أطعمة الأيتام لمصلحة الجميع، بقوله تعالى عن الإصلاح لهم خير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} خلط الماء بطاهر: لا يسلبه الطهورية إذا كان مما لا يمكن التحرز منه كالطحلب؛ ويسلبه إذا خلط بقصد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}'
  en: 'Khalt is lexically mixing a thing with another, and is wider than liquids; the Kulliyat defines it as joining the parts of two or more things; its rules vary with its subject. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7746} Mixing of zakatable property: if two owners mix their property, by joint ownership or by neighbourhood, some jurists have them pay zakat as one owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747} Mixing capital in partnership: the Hanafis, Malikis and Hanbalis hold that partnership is concluded by the contract alone without mixing; the Shafiis require the mixing before the contract to a degree that the goods cannot be told apart, and if it is after, the contract must be repeated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747} Mixing by wrongdoing: a usurper or trustee who mixes the property with other goods must pay it if it can be separated; if not, it counts as lost and the duty passes to his liability, whether he mixes it with a like, better or worse thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} A guardian mixing an orphan\''s property with his own: allowed where it benefits the orphan, and the mixing of food for orphans for the good of all, as the verse on reform of orphans is cited. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} Mixing water with a pure thing: it does not lose its purifying power if the mixing cannot be avoided, like weed; it loses it when mixed deliberately. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}'
  ur: 'خلط لغت میں ایک چیز کو دوسری سے ملانا ہے، مائع اور غیر مائع دونوں میں؛ کلیات میں دو یا زیادہ چیزوں کے اجزا کو جمع کرنا؛ اس کے احکام موضوع کے لحاظ سے مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7746} زکوٰۃ کے قابل دو مال مخلوط ہوں تو بعض فقہاء کے نزدیک دونوں ایک مالک کی طرح زکوٰۃ دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747} شرکت کے سرمائے کا خلط: حنفیہ، مالکیہ اور حنابلہ کے نزدیک عقد سے شرکت منعقد ہو جاتی ہے بغیر خلط کے؛ شافعیہ عقد سے پہلے ایسا خلط شرط کہتے ہیں کہ مال الگ نہ ہو سکے، عقد کے بعد ہو تو کافی نہیں اور عقد دوبارہ کیا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747} غصب یا امانت میں خلط: غاصب یا امین مال کسی اور چیز سے ملا دے تو الگ ہو سکے تو ملانے والا الگ کرے، ورنہ مال تلف سمجھا جاتا ہے اور حق ذمہ میں منتقل ہو جاتا ہے، چاہے ملانا ہم جنس، بہتر یا کمتر سے ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7747}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} ولی کا یتیم کا مال اپنے مال سے ملانا: جائز ہے اگر یتیم کا فائدہ ہو؛ یتیموں کے کھانے کا خلط بھی بھلائی کے لیے جائز ہے، یتیموں کی اصلاح کے بارے میں آیت کا حوالہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} پانی کا پاک چیز سے خلط: اگر ایسا ہو کہ اس سے بچنا ممکن نہ ہو جیسے سوار یا کائی، تو طہوریت ختم نہیں ہوتی؛ قصداً ملانے سے ختم ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}'
