id: concept/intimidation-as-coercion
class: concept
kind: legal
label:
  ar: "التخويف"
  en: "Intimidation (takhwif) and coercion"
  ur: "تخویف ⁦(ڈرانا اور اکراہ)⁩"
  es: "Intimidación (takhwif) y coacción"
  fr: "Intimidation (takhwif) et coercition"
  tr: "yıldırma"
  id: "intimidasi"
summary:
  ar: "التخويف جعل الشخص يخاف، والإنذار أخص منه لأنه يتضمن إعلام موضع المخافة. والتخويف يكون إكراها إذا كان بالقتل أو الضرب الشديد أو الحبس الطويل عند الحنفية والمالكية، والخلاف في التخويف بالمال والحبس اليسير. وقد يفضي التخويف إلى القتل أو الإجهاض فيوجب الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838}"
  en: "Takhwif is causing a person to fear, and inindhar is narrower because it also states the source of the fear. Intimidation counts as coercion when it threatens killing, severe beating or long imprisonment, according to the Hanafis and Malikis, while for lesser beating or imprisonment the rank of the victim decides. Intimidation can cause a death or a miscarriage, which then carries liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838}"
  es: "Takhwif significa causar temor a una persona, e inindhar es más específico porque también indica la fuente del temor. La intimidación se considera coacción cuando amenaza con la muerte, palizas severas o largas penas de prisión, según los hanafíes y los malikíes, mientras que para palizas o penas de prisión menores, depende del rango de la víctima. La intimidación puede causar la muerte o un aborto espontáneo, lo que conlleva responsabilidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838}"
  fr: "Le terme « takhwif » désigne le fait de susciter la peur chez une personne, tandis que « inindhar » est plus précis car il indique également la source de cette peur. L’intimidation est considérée comme une coercition lorsqu’elle menace de mort, de coups et blessures graves ou d’une longue peine d’emprisonnement, selon les écoles hanafite et malikite. En revanche, pour des coups et blessures moins graves ou un emprisonnement, le rang de la victime est déterminant. L’intimidation peut entraîner la mort ou une fausse couche, ce qui engage la responsabilité de l’auteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838}"
  ur: "تکویف انسان کو خوف میں مبتلا کر رہی ہے، اور اندراندر تنگ ہے کیونکہ یہ خوف کا ذریعہ بھی بتاتا ہے۔ دھمکی کو جبر کے طور پر شمار کیا جاتا ہے جب یہ حنفیہ اور مالکیہ کے مطابق قتل، شدید مار پیٹ یا طویل قید کی دھمکی دیتا ہے، جبکہ کم مار پیٹ یا قید کے لیے مقتول کا درجہ فیصلہ کرتا ہے۔ دھمکی موت یا اسقاط حمل کا سبب بن سکتی ہے، جس کے بعد ذمہ داری عائد ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4836} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4837}"
  tr: "Korkutma insanı korkutur ve uyarı daha spesifiktir çünkü korkunun yerini belirler. Hanafi ve Malikilere göre korkutma, öldürme, ağır dayak veya uzun hapis cezası içeriyorsa zorlamadır. Mali yıldırma ve hafif hapis konusunda anlaşmazlıklar vardır. Yıldırma ölüme veya düşük yapmaya yol açabilir, bu yüzden sorumluluk gereklidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4838}"
  id: "Intimidasi membuat seseorang menjadi takut, dan peringatan lebih spesifik karena memberi tahu tempat ketakutan. Intimidasi adalah paksaan jika melibatkan pembunuhan, pemukulan berat, atau penjara lama menurut Hanafi dan Maliki. Ada perbedaan pendapat tentang intimidasi finansial dan penahanan ringan. Intimidasi dapat berujung pada kematian atau keguguran, sehingga tanggung jawab diperlukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4836} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.4837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4838}"
