label:
  ar: "التخويف"
  en: "Intimidation (takhwif) and coercion"
  ur: "تخویف (ڈرانا اور اکراہ)"
summary:
  ar: "التخويف جعل الشخص يخاف، والإنذار أخص منه لأنه يتضمن إعلام موضع المخافة. والتخويف يكون إكراها إذا كان بالقتل أو الضرب الشديد أو الحبس الطويل عند الحنفية والمالكية، والخلاف في التخويف بالمال والحبس اليسير. وقد يفضي التخويف إلى القتل أو الإجهاض فيوجب الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838}"
  en: "Takhwif is causing a person to fear, and inindhar is narrower because it also states the source of the fear. Intimidation counts as coercion when it threatens killing, severe beating or long imprisonment, according to the Hanafis and Malikis, while for lesser beating or imprisonment the rank of the victim decides. Intimidation can cause a death or a miscarriage, which then carries liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838}"
