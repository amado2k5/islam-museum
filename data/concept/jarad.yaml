summary:
  ar: "الجراد: أجوده السمين الذي لا جناح له. تقلع أرجله الثآليل فيما يقال، ويُذكر أن ما يُعمل منه ينفع الاستسقاء وعسر البول، والمشوي من السمان ينفع من لسع العقرب {cite:canon-ibn-sina-print-v1 p.427}."
  en: "The locust. The best is the fat one without wings. Its legs are said to remove warts; the book gives a prepared form for dropsy and difficult urination, and roasted fat wingless locusts for scorpion stings {cite:canon-ibn-sina-print-v1 p.427}."
  ur: "ٹڈی۔ اس کی بہترین قسم وہ ہے جو موٹی ہو اور جس کے پر نہ ہوں۔ کہا جاتا ہے کہ اس کی ٹانگیں مسے ہٹاتی ہیں؛ کتاب استسقا اور عسر البول کے لیے ایک تیار شدہ شکل بیان کرتی ہے، اور بِچھو کے ڈنک کے لیے بغیر پروں کی موٹی ٹڈیاں بھون کر کھانے کا ذکر ہے {cite:canon-ibn-sina-print-v1 p.427}۔"
  es: "La langosta. La mejor es la gorda sin alas. Se dice que sus patas eliminan las verrugas; el libro proporciona una fórmula preparada para la hidropesía y la dificultad para orinar, y langostas gordas asadas sin alas para las picaduras de escorpión {cite:canon-ibn-sina-print-v1 p.427}."
  fr: "La sauterelle. La meilleure est la grosse sauterelle sans ailes. On dit que ses pattes enlèvent les verrues; le livre donne une préparation contre l’hydropisie et les difficultés à uriner, et des sauterelles grasses sans ailes rôties contre les piqûres de scorpion {cite:canon-ibn-sina-print-v1 p.427}."
