id: concept/istidlal-min-al-muwafaqa-wa-al-mukhalafa
class: concept
kind: scientific
label:
  ar: "الاستدلال من الموافقة والمخالفة وسرعة الانفعال"
  en: "Inference from what agrees, what disagrees, and quickness of reaction"
  ur: "موافقت، مخالفت اور جلد اثر لینے سے استدلال"
  es: "Inferencia a partir de lo que coincide, lo que no coincide y la rapidez de reacción."
  fr: "Déduction à partir des points de concordance, des points de divergence et de la rapidité de réaction"
summary:
  ar: "يبين ابن سينا كيف يعرف مزاج الدماغ مما يوافقه ويخالفه، ومن سرعة تسخنه أو تبرده أو جفافه أو ترطبه، ويفرق بين الأسباب {cite:canon-ibn-sina-print-v2 pp.16-18}"
  en: "Ibn Sina shows how the temperament of the brain is known from what agrees and disagrees with it, and from how quickly it heats, cools, dries or moistens, and tells the causes apart {cite:canon-ibn-sina-print-v2 pp.16-18}"
  ur: "ابن سینا بتاتا ہے کہ دماغ کا مزاج اس چیز سے کیسے پہچانا جاتا ہے جو اس کے موافق اور مخالف ہو، اور اس کے جلد گرم، ٹھنڈا، خشک یا تر ہو جانے سے، اور اسباب میں فرق کرتا ہے {cite:canon-ibn-sina-print-v2 pp.16-18}۔"
  es: "Ibn Sina muestra cómo se conoce el temperamento del cerebro a partir de lo que le agrada y lo que le desagrada, y de la rapidez con que se calienta, se enfría, se seca o se humedece, y distingue las causas {cite:canon-ibn-sina-print-v2 pp.16-18}"
  fr: "Ibn Sina montre comment le tempérament du cerveau se reconnaît à ce qui est en accord ou en désaccord avec lui, et à la rapidité avec laquelle il se réchauffe, se refroidit, s'assèche ou s'humidifie, et il en distingue les causes {cite:canon-ibn-sina-print-v2 pp.16-18}"
