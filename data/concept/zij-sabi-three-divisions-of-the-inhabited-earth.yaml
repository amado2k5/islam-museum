id: concept/zij-sabi-three-divisions-of-the-inhabited-earth
class: concept
kind: scientific
label: { ar: "أقسام المعمور الثلاثة أوروقي ولوبيا وآسيا الكبرى في الزيج الصابي", en: "The three divisions of the inhabited earth", ur: "آباد زمین کے تین حصے", es: "Las tres divisiones de la tierra habitada", fr: "Les trois divisions de la terre habitée", tr: "Sabean Zij'e göre, yerleşim bulunan üç bölge Uruk, Libya ve Büyük Asya'dır.", id: "Tiga wilayah yang berpenduduk adalah Uruk, Libya, dan Asia Raya, menurut Sabean Zij." }
summary:
  ar: "يقول البتاني إن الأرض قُسمت ثلاثة أقسام جمعت الأقاليم والكور وسائر البلدان العامرة: الأول من البحر الأخضر شمالاً إلى بنطس وبحيرة مايطس ويسمونه أوروقي، والثاني من بحر مصر جنوباً إلى بحر الحبش ويسمى لوبيا، والثالث كل ما بقي من العمران إلى الصين ويسمى آسيا الكبرى. {cite:zij-sabi-nallino-byblion pp.31-32}."
  en: "Al-Battani says the earth was divided into three parts that gather the climes, districts and all other inhabited lands: the first from the Green Sea northward to Bontos and the lake of Maetis, which they call Europe; the second from the sea of Egypt south to the Abyssinian sea, called Libya; and the third everything left of the inhabited world as far as China, called Great Asia. {cite:zij-sabi-nallino-byblion pp.31-32}."
  ur: "البتانی کہتے ہیں کہ زمین کو تین حصوں میں بانٹا گیا جو اقالیم، کور اور تمام آباد شہروں کو جمع کرتے ہیں: پہلا بحر اخضر سے شمال کی طرف بنطس اور بحیرۂ مایطس تک جسے اوروقی کہتے ہیں، دوسرا بحر مصر سے جنوب میں بحر حبش تک جسے لوبیا کہتے ہیں، اور تیسرا آباد دنیا کا باقی سب کچھ چین تک جسے آسیا الکبریٰ کہتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.31-32}۔"
  es: "Al-Battani afirma que la tierra se dividió en tres partes que abarcan los climas, distritos y demás tierras habitadas: la primera, desde el Mar Verde hacia el norte hasta Bontos y el lago de Metis, a la que denominan Europa; la segunda, desde el mar de Egipto hacia el sur hasta el mar de Abisinia, a la que llaman Libia; y la tercera, todo lo que quedaba del mundo habitado hasta China, a la que llaman Gran Asia. {cite:zij-sabi-nallino-byblion pp.31-32}."
  fr: "Al-Battani affirme que la Terre était divisée en trois parties regroupant les climats, les régions et toutes les autres terres habitées: la première, de la Mer Verte au nord jusqu’au Bontos et au lac Maetis, qu’ils appellent l’Europe; la deuxième, de la mer d’Égypte au sud jusqu’à la mer d’Abyssinie, appelée Libye; et la troisième, tout le reste du monde habité jusqu’à la Chine, appelée Grande Asie. {cite:zij-sabi-nallino-byblion pp.31-32}."
  tr: "El-Battani, yeryüzünün, bölgeleri, ilçeleri ve diğer tüm yerleşim yerlerini kapsayan üç bölüme ayrıldığını söyler: Birincisi, kuzeyde Yeşil Deniz'den Pontus ve Maitus Gölü'ne kadar olan ve Uruk olarak adlandırılan bölge; ikincisi, güneyde Mısır Denizi'nden Habeşistan Denizi'ne kadar olan ve Lubia olarak adlandırılan bölge; ve üçüncüsü, Çin'e kadar olan medeniyetin geri kalanının tamamı, Büyük Asya olarak adlandırılan bölge. {cite:zij-sabi-nallino-byblion pp.31-32}."
  id: "Al-Battani mengatakan bahwa bumi terbagi menjadi tiga bagian, meliputi wilayah, distrik, dan semua negara berpenghuni lainnya: yang pertama dari Laut Hijau di utara hingga Pontus dan Danau Maitus, yang mereka sebut Uruk; yang kedua dari Laut Mesir di selatan hingga Laut Abyssinia, yang mereka sebut Lubia; dan yang ketiga, semua yang tersisa dari peradaban hingga Tiongkok, yang mereka sebut Asia Raya. {cite:zij-sabi-nallino-byblion pp.31-32}."
