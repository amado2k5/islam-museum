id: concept/al-wasiyya-al-diniyya
class: concept
kind: doctrine
label: { ar: "الوصية الدينية: الإسلام حتى الموت", en: "The religious bequest: submission until death" }
summary:
  ar: "يقرر الشعراوي أن الوصية تُقال في آخر العمر فيصدق فيها الموصي، وأن وصية إبراهيم ويعقوب لبنيهما بالدين الذي اصطفاه الله، فلا يُفارق المؤمن الإسلام حتى يأتيه الموت، لأن الموت لا يُعرف وقته. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.595}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.596}"
  en: "Sha'rawi holds that a bequest is spoken at the end of life, when the one who bequeaths speaks truthfully, and that the bequest of Abraham and Jacob to their sons was the religion God had chosen, so that the believer must not leave submission before death comes, since its time is not known {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.595}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.596}."
wings: [ideas]
themes: [worship-and-the-pillars, prophets]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "ما معنى الوصية بالدين عند الموت، ولماذا يُوصي الأنبياء بما اختاره الله لا بما يرونه؟"
  en: "What does it mean to bequeath the religion at death, and why do prophets bequeath what God chose rather than their own preference?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-submission-until-death
    stance:
      ar: "الوصية بما اختاره الله، والثبات على الإسلام حتى الموت لأنه لا يُعلم وقته"
      en: "The bequest is to what God chose, and steadfastness in submission until death, whose time is unknown"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن آخر لحظات الإنسان يصدق فيها فلا يغش نفسه ولا غيره، ويرى أن الوصية لم تكن من إبراهيم ويعقوب بل بما اختاره الله، وأن النهي عن الموت إلا مسلماً يعني ألا يفارق المرء الإسلام لحظة حتى لا يفاجئه الموت، فالموت لا يملكه أحد، ولا يُعلم زمنه ولا مكانه. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.595}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.596}"
      en: "Sha'rawi says that in his last hours a person speaks truthfully and deceives neither himself nor others. He holds that the bequest was not Abraham's or Jacob's own but what God had chosen, and that the command not to die except in submission means not to leave the religion for a moment, for death comes unannounced and no one controls it {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.595}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.596}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "أقوال المفسرين في نص الوصية وأثرها في الفقه دون مصدر في هذه الدفعة"
      en: "The exegetes' readings of the text of the bequest and its effect in law are not yet entered from a source"
    holders: []
