id: concept/al-wasiyya-al-diniyya
class: concept
kind: doctrine
tags: [wasaya-browser, wasaya-righteous, wasaya-wasiyya]
label: { ar: "الوصية الدينية: الإسلام حتى الموت", en: "The religious bequest: submission until death", fr: "Le legs religieux : la soumission jusqu’à la mort", es: "El legado religioso: sumisión hasta la muerte.", ur: "مذہبی وصیت: موت تک تسلیم" }
summary:
  ar: "يقرر الشعراوي أن الوصية تُقال في آخر العمر فيصدق فيها الموصي، وأن وصية إبراهيم ويعقوب لبنيهما بالدين الذي اصطفاه الله، فلا يُفارق المؤمن الإسلام حتى يأتيه الموت، لأن الموت لا يُعرف وقته. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.595}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.596}"
  en: "Sha'rawi holds that a bequest is spoken at the end of life, when the one who bequeaths speaks truthfully, and that the bequest of Abraham and Jacob to their sons was the religion God had chosen, so that the believer must not leave submission before death comes, since its time is not known {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.595}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.596}."
  fr: "Sha’rawi soutient qu’un legs se prononce à la fin de la vie, lorsque celui qui lègue parle avec sincérité, et que le legs d’Abraham et de Jacob à leurs fils était la religion que Dieu avait choisie, de sorte que le croyant ne doit pas quitter la soumission avant que la mort ne vienne, puisque son heure n’est pas connue {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.595}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.596}."
  es: "Sha'rawi sostiene que un legado se pronuncia al final de la vida, cuando quien lo hace habla con veracidad, y que el legado de Abraham y Jacob a sus hijos fue la religión que Dios había elegido, por lo que el creyente no debe abandonar la sumisión antes de que llegue la muerte, puesto que su momento es desconocido {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.595}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.596}."
  ur: "شعراوی کا خیال ہے کہ وصیت اس وقت کی جاتی ہے جب وصیت کرنے والا سچ بولتا ہو، اور یہ کہ ابراہیم اور یعقوب کی ان کے بیٹوں کے لیے وصیت وہ دین تھا جو خدا نے منتخب کیا تھا، اس لیے مومن کو موت آنے سے پہلے تسلیم نہیں کرنا چاہیے، کیونکہ اس کا وقت معلوم نہیں ہے۔ صفحہ 595}{حوالہ:تفسیر-شعروی-خواطر-اسکین-pp-501-1000 p.596}۔"
