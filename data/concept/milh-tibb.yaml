summary:
  ar: "الملح معروف في الكتاب، حار يابس في الثانية وكل ما كان أمر فهو أحر، جلاء محلل قابض مجفف، وقبضه أشد أفعاله، يمنع العفونة، ويذكر له الكتاب منافع كثيرة للجلد والجراح والمفاصل والعين والصدر والمعدة والإسهال والسموم {cite:canon-ibn-sina-print-v1 p.572}."
  en: "Milh, salt, which the book calls well known, is hot and dry in the second degree and the more bitter the hotter, cleansing, dissolving, astringent and drying, its astringency its strongest act, and it prevents putrefaction; the book lists many uses for the skin, wounds, joints, eye, chest, stomach, purging and poisons {cite:canon-ibn-sina-print-v1 p.572}."
  ur: "ملح کتاب میں معروف ہے، دوسرے درجے میں گرم خشک اور جو جتنا کڑوا ہو اتنا زیادہ گرم، جلا دینے والا، تحلیل کرنے والا، قابض اور خشک کرنے والا، جس کی قبض اس کا سب سے سخت فعل ہے، اور یہ سڑاند روکتا ہے؛ کتاب جلد، زخموں، جوڑوں، آنکھ، سینے، معدے، جلاب اور زہروں کے لیے اس کے بہت سے فائدے گناتی ہے {cite:canon-ibn-sina-print-v1 p.572}۔"
  es: "Milh, sal, que el libro llama bien conocida, es caliente y seca en segundo grado y cuanto más amarga, más caliente, limpiadora, disolvente, astringente y secante, su astringencia es su acción más fuerte, y previene la putrefacción; el libro enumera muchos usos para la piel, heridas, articulaciones, ojos, pecho, estómago, purga y venenos {cite:canon-ibn-sina-print-v1 p.572}."
