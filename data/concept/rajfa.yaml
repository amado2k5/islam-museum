label: { ar: "الرجفة", en: "Al-rajfa (the quake)" }
issue:
  ar: "ما معنى الرجفة في عذاب قوم شعيب وصالح، وكيف يُجمع بينها وبين الصيحة؟"
summary:
  ar: "الرجفة عند رضا الحركة الشديدة والاضطراب، والراجح عنده أنها الزلزلة، وقد عبّر القرآن عن عذاب أهل مدين بالرجفة في الأعراف وبالصيحة في هود، كما عبّر عن عذاب ثمود بالأمرين في السورتين. ويقول رضا إن وجه الجمع بينهما بيّنه في موضع آخر."
  en: "Rida glosses rajfa as violent shaking and prefers the reading of earthquake. The Qur'an names the punishment of Madyan rajfa in al-A'raf and sayha (the cry) in Hud, and of Thamud both ways in the two suras; Rida says he treated how to reconcile them elsewhere in his tafsir."
