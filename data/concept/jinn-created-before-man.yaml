id: concept/jinn-created-before-man
class: concept
kind: jinn
label: { ar: "الجن المخلوقون قبل الإنسان", en: "The jinn created before man", ur: "انسان سے پہلے پیدا ہونے والے جن", es: "Los genios fueron creados antes que el hombre." }
summary:
  ar: "تذكر [[passage/quran-15-27|الحجر 27]] أن الجان خُلق من قبل من نار السموم، وتذكر [[passage/quran-55-15|الرحمن 15]] أنه خُلق من مارج من نار؛ وفي حديث عائشة عند مسلم أن الملائكة خُلقت من نور والجان من مارج من نار وآدم مما وُصف لكم {cite:sahih-muslim-harvest-20260227-2223 no. 3113}. ولم تفصّل الآيات سكنى الجن الأرض قبل آدم؛ ذلك في آثار الضحاك عن ابن عباس ومجاهد عن عبد الله بن عمرو والحسن البصري {cite:tafsir-ibn-kathir-alexandria-024188 pp. 70-71, 77}."
  en: "[[passage/quran-15-27|al-Hijr 27]] says the jinn were created earlier from the fire of the scorching wind, and [[passage/quran-55-15|al-Rahman 15]] from a flame of fire; in Aisha's hadith in Muslim the angels were created from light, the jinn from a flame of fire, and Adam from what has been described to you {cite:sahih-muslim-harvest-20260227-2223 no. 3113}. The verses do not detail the jinn's dwelling on earth before Adam; that is in reports of al-Dahhak from Ibn Abbas, of Mujahid from Abd Allah ibn Amr, and of al-Hasan al-Basri {cite:tafsir-ibn-kathir-alexandria-024188 pp. 70-71, 77}."
  ur: "[[passage/quran-15-27|الحجر 27]] کے مطابق جن پہلے سے لو کی آگ سے پیدا کیے گئے، اور [[passage/quran-55-15|الرحمن 15]] کے مطابق شعلۂ آتش سے؛ مسلم میں عائشہ کی حدیث ہے کہ فرشتے نور سے، جن شعلۂ آتش سے اور آدم اس چیز سے پیدا ہوئے جو تمہیں بتائی گئی {cite:sahih-muslim-harvest-20260227-2223 no. 3113}۔ آیات آدم سے پہلے جنوں کے زمین میں رہنے کی تفصیل نہیں دیتیں؛ وہ ضحاک کی ابن عباس سے، مجاہد کی عبد اللہ بن عمرو سے اور حسن بصری کی روایات میں ہے {cite:tafsir-ibn-kathir-alexandria-024188 pp. 70-71, 77}۔"
  es: "[[passage/quran-15-27|al-Hijr 27]] dice que los jinn fueron creados antes del fuego del viento abrasador, y [[passage/quran-55-15|al-Rahman 15]] de una llama de fuego; en el hadiz de Aisha en Muslim los ángeles fueron creados de luz, los jinn de una llama de fuego, y Adán de lo que se te ha descrito {cite:sahih-muslim-harvest-20260227-2223 no. 3113}. Los versículos no detallan la morada de los jinn en la tierra antes de Adán; es decir, en los informes de al-Dahhak de Ibn Abbas, de Mujahid de Abd Allah ibn Amr y de al-Hasan al-Basri {citar:tafsir-ibn-kathir-alexandria-024188 págs. 70-71, 77}."
