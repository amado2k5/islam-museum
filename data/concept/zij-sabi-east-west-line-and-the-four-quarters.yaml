class: concept
kind: scientific
label: { ar: "خط المشرق والمغرب وتقسيم الدائرة أرباعاً في الزيج الصابي", en: "The east-west line and the four quarters of the circle", ur: "خط مشرق و مغرب اور دائرے کی چار برابر تقسیم", es: "La línea este-oeste y los cuatro cuartos del círculo", fr: "La ligne est-ouest et les quatre quarts du cercle" }
summary:
  ar: "بعد خط نصف النهار يرسم البتاني خطاً آخر يجوز على المركز على زوايا قائمة فتنقسم الدائرة أرباعاً متساوية، ويكون هذا الخط سمت ما بين المشرق والمغرب، ثم يكتب على أطراف الخطين جهات الأفق: المشرق والمغرب والشمال والجنوب. ويُعيد الشكل التالي العمل بالحروف: نقطة الجنوب ونقطة الشمال على طرفي خط نصف النهار، ونقطتا المشرق والمغرب بتنصيف القوس. {cite:zij-sabi-nallino-byblion pp.39-40}."
  en: "After the meridian line al-Battani draws a second line through the centre at right angles to it, so that the circle is divided into four equal quarters; this line is the direction between east and west, and the four horizon directions east, west, north and south are then written at the line ends. The figure that follows repeats the work with letters: the south and north points at the ends of the meridian line, and the east and west points found by bisecting an arc. {cite:zij-sabi-nallino-byblion pp.39-40}."
  ur: "خط نصف النہار کے بعد البتانی مرکز سے گزرتا ہوا دوسرا خط قائمہ زاویوں پر کھینچتے ہیں جس سے دائرہ چار برابر حصوں میں بٹ جاتا ہے؛ یہ خط مشرق و مغرب کے درمیان کی سمت ہے، اور پھر خطوں کے سروں پر افق کی چاروں جہتیں مشرق، مغرب، شمال اور جنوب لکھی جاتی ہیں۔ اگلا نقشہ حروف کے ساتھ یہی کام دہراتا ہے: خط نصف النہار کے سروں پر جنوب اور شمال کے نقطے، اور قوس کی تنصیف سے مشرق و مغرب کے نقطے۔ {cite:zij-sabi-nallino-byblion pp.39-40}۔"
  es: "Tras trazar la línea meridiana, al-Battani traza una segunda línea perpendicular al centro, dividiendo así el círculo en cuatro cuadrantes iguales. Esta línea indica la dirección entre el este y el oeste, y en sus extremos se escriben las cuatro direcciones del horizonte: este, oeste, norte y sur. La figura que sigue repite el procedimiento con letras: los puntos cardinales sur y norte se sitúan en los extremos de la línea meridiana, y los puntos cardinales este y oeste se obtienen al bisecar un arco. {cite:zij-sabi-nallino-byblion pp.39-40}."
  fr: "Après avoir tracé la ligne méridienne, al-Battani trace une seconde ligne perpendiculaire à la première, divisant ainsi le cercle en quatre quarts égaux. Cette ligne représente la direction est-ouest, et les quatre points cardinaux (est, ouest, nord et sud) sont ensuite inscrits à ses extrémités. La figure suivante reprend cette opération avec des lettres: les points nord et sud se situent aux extrémités de la ligne méridienne, et les points est et ouest sont obtenus en bissectant un arc de cercle. {cite:zij-sabi-nallino-byblion pp.39-40}."
