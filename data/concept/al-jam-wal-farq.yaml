    summary: { ar: "في نقل ابن تيمية: اتفق الجنيد وطائفة من أصحابه على شهود توحيد الربوبية وسموه مقام الجمع، ثم ذكر لهم الجنيد الفرق الثاني وهو الفرق الشرعي.", en: "As Ibn Taymiyya reports: al-Junayd and some of his companions agreed on witnessing the unity of lordship and called it the station of gathering; then al-Junayd mentioned to them the second separation, the lawful one.", ur: "ابن تیمیہ کی نقل میں: جنید اور ان کے بعض اصحاب نے توحیدِ ربوبیت کے شہود پر اتفاق کیا اور اسے مقامِ جمع کہا؛ پھر جنید نے ان سے فرقِ ثانی، یعنی شرعی فرق، کا ذکر کیا۔" }
