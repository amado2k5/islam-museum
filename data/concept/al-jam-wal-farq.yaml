id: concept/al-jam-wal-farq
class: concept
kind: term
label: { ar: "الجمع والفرق", en: "Gathering and separation (al-jam' wa'l-farq)", ur: "جمع اور فرق" }
summary:
  ar: "زوج من مصطلحات الصوفية: «الجمع» شهود أن الله خالق كل شيء وفاعله، و«الفرق» شهود أفعال العباد والتمييز بين المأمور والمحظور. يحكي ابن تيمية أن الجنيد نبه أصحابه بعد مقام الجمع على «الفرق الثاني» وهو الفرق الشرعي، فنازعه بعضهم، ويعدّ الوقوف عند الجمع والفناء فيه مزلقاً يؤدي إلى إسقاط الأمر والنهي."
  en: "A pair of Sufi terms: 'gathering' is witnessing that God is the creator and maker of everything; 'separation' is witnessing the acts of creatures and distinguishing the commanded from the forbidden. Ibn Taymiyya relates that al-Junayd pointed his companions, after the station of gathering, to a 'second separation', the separation of the law, and that some disputed with him; he regards stopping at gathering and annihilation in it as a slippery place that leads to dropping command and prohibition."
wings: [ideas]
themes: [spirituality-and-sufism, creed]
periods: [period/abbasid-early]
regions: [levant-iraq]
issue:
  ar: "هل غاية السالك شهود الجمع، أي أن الله خالق كل شيء، أم الفرق الشرعي بعده بين المأمور والمحظور؟"
  en: "Is the wayfarer's goal the witnessing of gathering – that God creates everything – or the lawful separation after it between the commanded and the forbidden?"
  ur: "کیا سالک کی منزل جمع کا شہود ہے، یعنی یہ کہ اللہ ہر چیز کا خالق ہے، یا اس کے بعد مامور اور محظور کے درمیان شرعی فرق؟"
