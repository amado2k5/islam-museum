    summary: { ar: "في نقل ابن تيمية: من أصحاب الجنيد من أنكر الفرق الثاني أو لم يفهمه أو ادعى أن المتكلم فيه لم يصل إليه، ومن الشيوخ بعدهم من ينتهي إلى الجمع ويرى الوقوف مع الأمر لأجل مصلحة العامة.", en: "As Ibn Taymiyya reports: some of al-Junayd's companions denied the second separation, did not understand it, or claimed that the one speaking of it had not reached it; and some later shaykhs end at gathering and see keeping to the command as being for the good of the common people.", ur: "ابن تیمیہ کی نقل میں: جنید کے بعض اصحاب نے فرقِ ثانی کا انکار کیا، یا اسے نہ سمجھا، یا کہا کہ اس کی بات کرنے والا وہاں تک پہنچا ہی نہیں؛ اور بعد کے بعض شیوخ جمع پر رک جاتے ہیں اور امر کی پابندی کو عوام کی مصلحت کے لیے سمجھتے ہیں۔" }
