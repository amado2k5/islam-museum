    standing: main
    stance: { ar: "لا بد بعد الجمع من الفرق الشرعي، وهو شهود توحيد الألوهية", en: "After gathering there must be the lawful separation, the witnessing of the unity of divinity", ur: "جمع کے بعد شرعی فرق ضروری ہے، یعنی توحیدِ الوہیت کا شہود" }
    summary: { ar: "يرى ابن تيمية أن الجمع شهود توحيد الربوبية وهو حق، لكن الوقوف عنده ونفي الفرق الشرعي قول بسقوط العبادة، ويؤيد ما يحكيه عن الجنيد من إثبات الفرق الثاني.", en: "Ibn Taymiyya holds that gathering is the witnessing of the unity of lordship and is true, but stopping there and denying the lawful separation amounts to dropping worship; he endorses what he reports of al-Junayd's affirmation of the second separation.", ur: "ابن تیمیہ کے نزدیک جمع توحیدِ ربوبیت کا شہود ہے اور حق ہے، مگر اس پر رک جانا اور شرعی فرق کا انکار عبادت کو ساقط کرنا ہے؛ وہ جنید سے منقول فرقِ ثانی کے اثبات کی تائید کرتے ہیں۔" }
