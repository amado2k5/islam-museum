id: concept/al-shamail-al-muhammadiyya
class: concept
kind: term
label: { ar: "الشمائل المحمدية", en: "Shama'il Muhammadiyya" }
summary:
  ar: "الشمائل باب من الحديث يجمع ما ورد في خلق النبي وخُلقه: شعره ومشيته وكلامه وطعامه ومجلسه وضحكه وبكائه — الصورة الجسدية والأدبية الكاملة كما نقلها أهل بيته وأصحابه. أشهر مصنفاته «الشمائل المحمدية» الذي ختم به الترمذي جامعه، فاستقل بالتداول والشرح حتى صار علماً قائماً بذاته. ومن نواة الباب وصف أنس بن مالك عند البخاري: «كان ربعة من القوم ليس بالطويل ولا بالقصير، أزهر اللون ليس بأبيض أمهق ولا آدم، ليس بجعد قطط ولا سبط رجل… وليس في رأسه ولحيته عشرون شعرة بيضاء» {cite:sahih-al-bukhari 3547}. وفي صحيح مسلم وصفه أنس أيضاً: «أزهر اللون كأن عرقه اللؤلؤ، إذا مشى تكفأ» {cite:sahih-muslim 2330} وشهادته أنه خدمه عشر سنين «فوالله ما قال لي أفاً قط» {cite:sahih-muslim 2309}، وقول أنس: «كان أحسن الناس وأجود الناس وأشجع الناس» {cite:sahih-muslim 2307}."
  en: "Shama'il is the hadith genre gathering what is transmitted of the Prophet's form and character — his hair, gait, speech, food, gathering, laughter and weeping: the complete physical and moral portrait as his family and Companions conveyed it. Its most famous compilation is al-Tirmidhi's Shama'il Muhammadiyya, with which he closed his Jami', until it circulated and was commented on as a discipline of its own."
