label: { ar: "الشمائل المحمدية", en: "Shama'il Muhammadiyya" }
summary:
  ar: "الشمائل باب من الحديث يجمع ما ورد في خلق النبي وخُلقه: شعره ومشيته وكلامه وطعامه ومجلسه وضحكه وبكائه — الصورة الجسدية والأدبية الكاملة كما نقلها أهل بيته وأصحابه. أشهر مصنفاته «الشمائل المحمدية» الذي ختم به الترمذي جامعه، فاستقل بالتداول والشرح حتى صار علماً قائماً بذاته."
  en: "Shama'il is the hadith genre gathering what is transmitted of the Prophet's form and character — his hair, gait, speech, food, gathering, laughter and weeping: the complete physical and moral portrait as his family and Companions conveyed it. Its most famous compilation is al-Tirmidhi's Shama'il Muhammadiyya, with which he closed his Jami', until it circulated and was commented on as a discipline of its own."
