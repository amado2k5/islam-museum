id: concept/al-shamail-al-muhammadiyya
class: concept
kind: term
label: { ar: "الشمائل المحمدية", en: "Shama'il Muhammadiyya", fr: "Shama'il Muhammadiyya" }
summary:
  ar: "الشمائل باب من الحديث يجمع ما ورد في خلق النبي وخُلقه: شعره ومشيته وكلامه وطعامه ومجلسه وضحكه وبكائه — الصورة الجسدية والأدبية الكاملة كما نقلها أهل بيته وأصحابه. أشهر مصنفاته «الشمائل المحمدية» الذي ختم به الترمذي جامعه، فاستقل بالتداول والشرح حتى صار علماً قائماً بذاته. ومن نواة الباب وصف أنس بن مالك عند البخاري: ذكر أنه كان متوسط القامة، مشرق اللون، لا شديد البياض ولا أسمر، وشعره ليس شديد الجعودة ولا مسترسلاً، وكان الشيب في رأسه ولحيته دون عشرين شعرة {cite:sahih-al-bukhari 3547}. وفي صحيح مسلم وصفه أنس أيضاً: «أزهر اللون كأن عرقه اللؤلؤ، إذا مشى تكفأ» {cite:sahih-muslim 2330} وشهادته أنه خدمه عشر سنين «فوالله ما قال لي أفاً قط» {cite:sahih-muslim 2309}، وقول أنس: «كان أحسن الناس وأجود الناس وأشجع الناس» {cite:sahih-muslim 2307}."
  en: "Shama'il is the hadith genre gathering what is transmitted of the Prophet's form and character — his hair, gait, speech, food, gathering, laughter and weeping: the complete physical and moral portrait as his family and Companions conveyed it. Its most famous compilation is al-Tirmidhi's Shama'il Muhammadiyya, with which he closed his Jami', until it circulated and was commented on as a discipline of its own."
  fr: "Les Shama'il sont le genre du hadith qui rassemble ce qui est transmis de l’apparence et du caractère du Prophète — ses cheveux, sa démarche, sa parole, sa nourriture, ses assemblées, son rire et ses pleurs : le portrait physique et moral complet tel que l’ont transmis sa famille et ses Compagnons. Sa compilation la plus célèbre est la Shama'il Muhammadiyya d’al-Tirmidhi, par laquelle il conclut son Jami', jusqu’à ce qu’elle circule et soit commentée comme une discipline à part entière."
