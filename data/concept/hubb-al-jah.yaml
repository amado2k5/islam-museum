id: concept/hubb-al-jah
class: concept
kind: ethical
label: { ar: "حب الجاه", en: "Love of status (hubb al-jah)", ur: "حبِ جاہ" }
summary:
  ar: "الجاه عند الغزالي «ملك القلوب» كما أن المال ملك الأعيان، أي قيام المنزلة في قلوب الناس باعتقادهم في صاحبه صفة من صفات الكمال؛ وحبه طبعي في القلوب، منه قدر محمود يحتاجه الإنسان لمعيشته، ومنه مذموم يجلب الرياء {cite:ihya-shamela-dar-al-marifa p. 5548} {cite:ihya-shamela-dar-al-marifa p. 5550} {cite:ihya-shamela-dar-al-marifa p. 5581}."
  en: "For al-Ghazali status is 'possession of hearts', as wealth is possession of things: a standing in people's hearts because they believe its holder has some attribute of perfection. Loving it is natural; a measure is praiseworthy and needed for living among people, and a measure is blameworthy and leads to showing off {cite:ihya-shamela-dar-al-marifa p. 5548} {cite:ihya-shamela-dar-al-marifa p. 5550} {cite:ihya-shamela-dar-al-marifa p. 5581}."
  ur: "غزالی کے نزدیک جاہ «دلوں کی ملکیت» ہے جیسے مال چیزوں کی ملکیت: یعنی لوگوں کے دلوں میں مقام، کیونکہ وہ صاحبِ جاہ میں کسی کمال کی صفت کا اعتقاد رکھتے ہیں۔ اس کی محبت فطری ہے؛ ایک مقدار قابلِ تعریف اور لوگوں کے ساتھ رہنے کے لیے ضروری، اور ایک مقدار مذموم جو ریا تک لے جاتی ہے {cite:ihya-shamela-dar-al-marifa p. 5548} {cite:ihya-shamela-dar-al-marifa p. 5550} {cite:ihya-shamela-dar-al-marifa p. 5581}۔"
