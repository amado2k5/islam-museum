summary:
  ar: "باب من حساب الوصايا يعالج المسائل التي يتوقف فيها مقدار الوصية على مقدار التركة ويتوقف مقدار التركة على الوصية، كمن تزوج في مرض موته ثم ماتت الزوجة قبله وأوصت؛ يحلّه الخوارزمي بجعل المجهول «شيئاً» ثم الجبر والمقابلة {cite:khwarizmi-jabr-cairo-1939 p.108}."
  en: "A branch of the reckoning of bequests for problems in which the bequest depends on the estate and the estate depends on the bequest, as when a man marries in his final illness and his wife dies before him leaving a bequest; al-Khwarizmi solves them by calling the unknown a 'thing' and applying al-jabr and al-muqabala."
  es: "Una rama del cálculo de legados para problemas en los que el legado depende del patrimonio y el patrimonio depende del legado, como cuando un hombre se casa en su enfermedad terminal y su esposa muere antes que él dejando un legado; al-Juarismi los resuelve llamando a lo desconocido una \"cosa\" y aplicando al-jabr y al-muqabala."
  fr: "Une branche du calcul des legs pour les problèmes dans lesquels le legs dépend de la succession et la succession dépend du legs, comme lorsqu'un homme se marie pendant sa dernière maladie et que sa femme meurt avant lui en laissant un legs; al-Khwarizmi les résout en appelant l'inconnu une « chose » et en appliquant al-jabr et al-muqabala."
