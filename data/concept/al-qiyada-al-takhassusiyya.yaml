id: concept/al-qiyada-al-takhassusiyya
class: concept
kind: term
label:
  ar: "القيادة التخصصية والتدريب عليها"
  en: "Specialised leadership and training in it"
  fr: "Le leadership spécialisé et sa formation"
  ur: "تخصصی قیادت اور اس کی تدریب"
  es: "Liderazgo especializado y formación en ello."
  tr: "Uzmanlaşmış liderlik ve eğitim"
  id: "Kepemimpinan dan pelatihan khusus"
summary:
  ar: "تفريق طارق السويدان بين القيادة العامة والقيادة التخصصية في الفكر والسياسة والإعلام وغيرها، مع أمثلة من الصحابة، ومنهجيته في إعداد القادة المتخصصين من خلال معهد «مفكر»."
  en: "Tareq al-Suwaidan's distinction between general leadership and specialised leadership in thought, politics, media and other fields, with examples from the Companions, and his method of preparing specialised leaders through the Mufakkir institute."
  fr: "La distinction que fait Tareq al-Suwaidan entre le leadership général et le leadership spécialisé dans la pensée, la politique, les médias ou d’autres domaines, avec des exemples tirés de la vie des Compagnons et sa méthode de formation des dirigeants spécialisés au sein de l’institut Mufakkir."
  ur: "طارق السویدان کا عمومی قیادت اور فکر، سیاست، ابلاغ وغیرہ میں تخصصی قیادت کے درمیان فرق، صحابہ کی مثالوں کے ساتھ، اور «مفکر» انسٹی ٹیوٹ کے ذریعے تخصصی قائدین کی تیاری کا ان کا طریقہ۔"
  es: "La distinción que hace Tareq al-Suwaidan entre liderazgo general y liderazgo especializado en pensamiento, política, medios de comunicación y otros ámbitos, con ejemplos de los Compañeros, y su método de preparación de líderes especializados a través del instituto Mufakkir."
  tr: "Tariq Al-Suwaidan, Genel Komutanlık ile düşünce, siyaset, medya ve diğer alanlarda uzmanlaşmış liderlik arasında ayrım yapmış, Yoldaşlar ve 'Mufakkir' Enstitüsü aracılığıyla uzmanlaşmış liderler yetiştirme metodolojisinden örnekler sunmuştur."
  id: "Tariq Al-Suwaidan membedakan antara Komando Umum dan kepemimpinan yang mengkhususkan diri dalam pemikiran, politik, media, dan bidang lainnya, serta memberikan contoh metodologi pelatihan pemimpin khusus melalui Comrades dan Institut 'Mufakkir'."
