summary:
  ar: "الزنجار مادة خضراء تتكوّن من تفاعل حامض الخلّ مع النحاس، حار يابس إلى الرابعة، جلاء أكّال؛ يمنع القروح الساعية، وينفع الأذن والعين والبواسير، ومع العلك والنطرون ينفع الجرب المتقرّح والبرص والبهق. {cite:canon-ibn-sina-print-v1 p.465}"
  en: "Zinjar, verdigris, is a green matter formed when vinegar acts on copper. Hot and dry to the fourth degree, it is a sharp cleanser that eats flesh; it stops running ulcers, helps the ear, the eye and piles, and with mastic and natron helps ulcerating scabies, baras and white patches. {cite:canon-ibn-sina-print-v1 p.465}"
  ur: "زنجار ایک سبز مادہ ہے جو سرکے کا تانبے پر عمل کرنے سے بنتا ہے۔ چوتھے درجے تک گرم اور خشک؛ تیز صفائی کرنے والا اور گوشت گلانے والا ہے؛ یہ بہتے السر روکتا، کان، آنکھ اور بواسیر میں مفید ہے، اور کندر اور نطرون کے ساتھ خارش زدہ زخم، برص اور بہق میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.465}"
  es: "El cardenillo, o verdín, es una sustancia verde que se forma cuando el vinagre reacciona con el cobre. Caliente y seco hasta el cuarto grado, es un potente limpiador que corroe la carne; detiene las úlceras supurantes, beneficia el oído, el ojo y las hemorroides, y junto con el mástique y el natrón ayuda a combatir la sarna ulcerada, la baras y las manchas blancas. {cite:canon-ibn-sina-print-v1 p.465}"
  fr: "Le zinjar, ou vert-de-gris, est une substance verte qui se forme lorsque le vinaigre agit sur le cuivre. Chaud et sec au quatrième degré, c'est un nettoyant puissant qui ronge la chair; il stoppe les ulcères purulents, soulage les affections de l'oreille, de l'œil et des hémorroïdes, et, associé au mastic et au natron, il est efficace contre la gale ulcéreuse, le baras et les plaques blanches. {cite:canon-ibn-sina-print-v1 p.465}"
  tr: "Bakır oksit, asetik asit ile bakırın reaksiyonu sonucu oluşan yeşil bir maddedir. Sıcak ve kuru (4. sınıf) olup aşındırıcı bir temizleyicidir; ülserlerin yayılmasını önler ve kulak, göz ve hemoroid için faydalıdır. Arap zamkı ve natron ile birleştirildiğinde uyuz, cüzzam ve vitiligo için faydalıdır. {cite:canon-ibn-sina-print-v1 s.465}"
  id: "Verdigris adalah zat berwarna hijau yang terbentuk dari reaksi asam asetat dengan tembaga. Zat ini panas dan kering (kelas 4), pembersih korosif; mencegah penyebaran tukak dan bermanfaat untuk telinga, mata, dan wasir. Bila dikombinasikan dengan gom arab dan natron, bermanfaat untuk kudis, kusta, dan vitiligo. {cite:canon-ibn-sina-print-v1 p.465}"
