label:
  ar: الملكية في القرآن
  en: "Ownership in the Qur'an"
summary:
  ar: "يبدأ قعدات بأن الملك لله أولاً وآخراً، فهو الخالق لكل شيء، وأن الأرض تُعطى للإنسان للانتفاع بها وإعمارها لا للتملك المطلق {cite:qadan-manhaj-iqtisad-quran p. 149}. ويجعل العمل وصلاح المواطنة أساساً شرعياً للملكية، ويرفض أن تنشأ الإقطاعيات من الاستحواذ على أراض شاسعة دون استغلالها {cite:qadan-manhaj-iqtisad-quran p. 150}، {cite:qadan-manhaj-iqtisad-quran p. 151}. ويحدّ الملكية الخاصة بمقدار الحاجات الأساسية، كالغذاء والمركوب والمسكن والعلاج والعلم، مع منع الاكتناز والاحتكار {cite:qadan-manhaj-iqtisad-quran p. 152}، {cite:qadan-manhaj-iqtisad-quran p. 153}."
