id: concept/al-milkiyya-fi-al-quran
class: concept
kind: ethical
label:
  ar: الملكية في القرآن
  en: "Ownership in the Qur'an"
  es: "La propiedad en el Corán"
  fr: "La propriété dans le Coran"
  ur: "قرآن میں ملکیت"
  tr: "Kur'an'daki mülkiyet"
  id: "Kepemilikan dalam Al-Qur'an"
summary:
  ar: "يبدأ قعدات بأن الملك لله أولاً وآخراً، فهو الخالق لكل شيء، وأن الأرض تُعطى للإنسان للانتفاع بها وإعمارها لا للتملك المطلق {cite:qadan-manhaj-iqtisad-quran p. 149}. ويجعل العمل وصلاح المواطنة أساساً شرعياً للملكية، ويرفض أن تنشأ الإقطاعيات من الاستحواذ على أراض شاسعة دون استغلالها {cite:qadan-manhaj-iqtisad-quran p. 150}، {cite:qadan-manhaj-iqtisad-quran p. 151}. ويحدّ الملكية الخاصة بمقدار الحاجات الأساسية، كالغذاء والمركوب والمسكن والعلاج والعلم، مع منع الاكتناز والاحتكار {cite:qadan-manhaj-iqtisad-quran p. 152}، {cite:qadan-manhaj-iqtisad-quran p. 153}."
  tr: "Öncelikle, egemenliğin öncelikle Tanrı'ya ait olduğu, çünkü her şeyin Yaratıcısı olduğu ve toprağın insanlara mutlak mülkiyet için değil, yararına ve gelişim için verildiğine inanarak başlar {cite:qadan-manhaj-iqtisad-kur'an s. 149}. Mülkiyetin meşru temeli olarak emeği ve vatandaşlığın doğruluğunu yapar ve geniş toprakların sömürülmeden elde edilmesinden doğan feodal mülklerin kurulmasını reddeder {cite:qadan-manhaj-iqtisad-kuran s. 150}, {cite:qadan-manhaj-iqtisad-kuran s. 151}. Özel mülkiyet, yiyecek, ulaşım, barınma, sağlık hizmetleri ve bilgi gibi temel ihtiyaçlarla sınırlıdır; aynı zamanda biriktirme ve tekelin önüne geçilir {cite:qadan-manhaj-iqtisad-kur'an s. 152}, {cite:qadan-manhaj-iqtisad-kur'an s. 153}."
  id: "Buku ini dimulai dengan keyakinan bahwa kedaulatan terutama milik Tuhan, karena Dia adalah Pencipta segala sesuatu, dan bahwa tanah diberikan kepada manusia bukan untuk kepemilikan mutlak tetapi untuk kepentingan dan pengembangan mereka {cite:qadan-manhaj-iqtisad-qur'an hlm. 149}. Dokumen ini menjadikan kerja dan kewarganegaraan sebagai dasar sah atas keharusan properti dan menolak pendirian tanah feodal yang muncul dari akuisisi tanah luas tanpa eksploitasi {cite:qadan-manhaj-iqtisad-quran hlm. 150}, {cite:qadan-manhaj-iqtisad-quran hlm. 151}. Kepemilikan pribadi terbatas pada kebutuhan dasar seperti makanan, transportasi, tempat tinggal, kesehatan, dan informasi; Pada saat yang sama, akumulasi dan monopoli dicegah {cite:qadan-manhaj-iqtisad-qur'an hlm. 152}, {cite:qadan-manhaj-iqtisad-qur'an hlm. 153}."
