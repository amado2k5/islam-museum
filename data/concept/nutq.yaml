label: { ar: "النُّطْق", en: "Nutq (speech)", ur: "نطق (گویائی)" }
summary:
  ar: "النطق في اللغة الكلام، ويستعمل معه المنطق والعبارة، والعبارة أخص منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15759} والنطق شرط في الإيمان لمن قدر عليه، فيُشترط النطق بالشهادتين لإجراء أحكام المسلمين، ومن صدّق بقلبه ومات قبل التمكن من النطق فهو مؤمن بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760} وهو شرط في صحة العقود والحلول كالنكاح والبيع والطلاق، والعاجز عن النطق تقوم إشارته مقام عبارته في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760} وإذا أذهبت الجناية النطق كاملاً وجبت الدية الكاملة، وفي العجز الجزئي تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760}"
  en: "Nutq, in the lexicon, is speech; logic (mantiq) and expression (ibara) are related words, and expression is narrower. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15759} Speaking the two testimonies is required of one able to do so, since it is what gives a person the rights of a Muslim in worldly rulings; one who believes in the heart but is able and does not speak is not treated as a Muslim by agreement, though jurists differ on his standing before God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760} Speech is a condition for the validity of contracts and releases such as marriage, sale and divorce, and a sign may stand for speech in the case of one unable to speak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760} If an injury destroys speech entirely, the full blood-money is due; partial loss is dealt with separately. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760}"
  ur: "نطق لغت میں کلام کو کہتے ہیں، منطق اور عبارت اس سے متعلق الفاظ ہیں، اور عبارت اس سے خاص ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15759} قادر شخص کے لیے کلمہ شہادت کا زبان سے اقرار ضروری ہے تاکہ دنیا میں مسلمانوں کے احکام جاری ہوں، اور جو دل سے تصدیق کرے مگر قدرت کے باوجود زبان سے اقرار نہ کرے تو وہ بالاجماع مسلمانوں کے احکام میں شامل نہیں، جبکہ آخرت کے حکم میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15759} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760} نکاح، بیع اور طلاق جیسے معاملات میں نطق شرط ہے، اور گونگے کا اشارہ بعض احکام میں عبارت کے قائم مقام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760} زبان کا مکمل ضائع ہونا کامل دیت کا موجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15760}"
