id: concept/al-ruya-wa-al-risala
class: concept
kind: term
label:
  ar: "الرؤية والرسالة في التخطيط الاستراتيجي"
  en: "Vision and mission in strategic planning"
  ur: "سٹریٹجک منصوبہ بندی میں وژن اور مشن"
summary:
  ar: "الرؤية عند طارق السويدان صورة ذهنية لوضع المنظمة في نقطة مستقبلية، والرسالة جملة قصيرة تلخص من نحن وماذا نريد؛ ويعرض معايير الرسالة العشرة وطريقة كتابة كليهما بالفريق، ويميز بينهما وبين الشعار والشعار المصوّر."
  en: "The vision, in Tareq al-Suwaidan's teaching, is a mental picture of the organisation at a future point, and the mission a short sentence summarising who we are and what we want; he gives the ten criteria of a mission and the team method for writing both, distinguishing them from the slogan and the logo."
  ur: "طارق السویدان کی تعلیم میں وژن مستقبل کے ایک مقام پر ادارے کی ذہنی تصویر ہے اور مشن ایک مختصر جملہ جو بتاتا ہے ہم کون ہیں اور کیا چاہتے ہیں؛ وہ مشن کے دس معیار اور دونوں کو لکھنے کا ٹیمی طریقہ پیش کرتے ہیں اور انہیں سلوگن اور لوگو سے ممیز کرتے ہیں۔"
