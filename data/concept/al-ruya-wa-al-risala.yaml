id: concept/al-ruya-wa-al-risala
class: concept
kind: term
label:
  ar: "الرؤية والرسالة في التخطيط الاستراتيجي"
  en: "Vision and mission in strategic planning"
  fr: "Vision et mission dans la planification stratégique"
  ur: "سٹریٹجک منصوبہ بندی میں وژن اور مشن"
  es: "Visión y misión en la planificación estratégica"
  tr: "Stratejik Planlamada Vizyon ve Misyon"
  id: "Visi dan Misi dalam Perencanaan Strategis"
summary:
  ar: "الرؤية عند طارق السويدان صورة ذهنية لوضع المنظمة في نقطة مستقبلية، والرسالة جملة قصيرة تلخص من نحن وماذا نريد؛ ويعرض معايير الرسالة العشرة وطريقة كتابة كليهما بالفريق، ويميز بينهما وبين الشعار والشعار المصوّر."
  en: "The vision, in Tareq al-Suwaidan's teaching, is a mental picture of the organisation at a future point, and the mission a short sentence summarising who we are and what we want; he gives the ten criteria of a mission and the team method for writing both, distinguishing them from the slogan and the logo."
  fr: "La vision, dans l’enseignement de Tareq al-Suwaidan, est une image mentale de l’organisation à un point de l’avenir, et la mission une courte phrase résumant qui nous sommes et ce que nous voulons ; il donne les dix critères d’une mission et la méthode d’équipe pour rédiger l’une et l’autre, en les distinguant du slogan et du logo."
  ur: "طارق السویدان کی تعلیم میں وژن مستقبل کے ایک مقام پر ادارے کی ذہنی تصویر ہے اور مشن ایک مختصر جملہ جو بتاتا ہے ہم کون ہیں اور کیا چاہتے ہیں؛ وہ مشن کے دس معیار اور دونوں کو لکھنے کا ٹیمی طریقہ پیش کرتے ہیں اور انہیں سلوگن اور لوگو سے ممیز کرتے ہیں۔"
  es: "En la enseñanza de Tareq al-Suwaidan, la visión es una imagen mental de la organización en un momento futuro, y la misión una frase corta que resume quiénes somos y qué queremos; él proporciona los diez criterios de una misión y el método de equipo para redactar ambos, diferenciándolos del eslogan y el logotipo."
  tr: "Tariq Al-Suwaidan için vizyon, organizasyonun gelecekteki konumunun zihinsel bir görüntüsüdür. Mesaj, kim olduğumuzu ve ne istediğimizi özetleyen kısa bir cümledir; mektubun on kriterini ve her ikisinin takımda nasıl yazıldığını sunar, logo ile resimli logo arasındaki ayrımı yapar."
  id: "Bagi Tariq Al-Suwaidan, visi tersebut adalah gambaran mental tentang posisi masa depan organisasi. Pesan tersebut adalah kalimat singkat yang merangkum siapa kami dan apa yang kami inginkan; pesan ini menyajikan sepuluh kriteria surat dan bagaimana keduanya ditulis dalam tim, membedakan antara logo dan logo bergambar."
