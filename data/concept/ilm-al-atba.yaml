id: concept/ilm-al-atba
class: concept
kind: term
label:
  ar: "علم الأتباع وأنواع الأتباع الثمانية"
  en: "Followership and the eight kinds of follower"
  ur: "علمِ پیروکاران اور پیروکاروں کی آٹھ اقسام"
summary:
  ar: "علم الأتباع (followership) كما يقدمه طارق السويدان: الفرق بين التابع والمقلد، وأسباب التبعية، وثمانية أنواع من الأتباع بثلاثة معايير هي القدرة القيادية والتحدي والفاعلية، لكل نوع مثال من الصحابة أو من معاصري النبي."
  en: "Followership as Tareq al-Suwaidan presents it: the follower and the imitator, the causes of following, and eight kinds of follower by three criteria, leadership ability, challenge and effectiveness, each illustrated by a Companion or a contemporary of the Prophet."
  ur: "علمِ پیروکاران، جیسا کہ طارق السویدان اسے پیش کرتے ہیں: پیروکار اور مقلد کا فرق، پیروی کے اسباب، اور تین معیاروں، قیادتی صلاحیت، چیلنج اور مؤثریت، کی بنیاد پر پیروکاروں کی آٹھ اقسام، ہر ایک کی مثال کسی صحابی یا نبی کے کسی ہم عصر سے۔"
