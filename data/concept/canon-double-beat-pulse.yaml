summary:
  ar: "يعرض ابن سينا اختلاف الأطباء في ذي القرعتين، أهو نبضة واحدة أم نبضتان، ويضع ضابطاً للعد {cite:canon-ibn-sina-print-v1 p.173}."
  en: "Ibn Sina presents the physicians' disagreement over the double-beat pulse, whether it is one beat or two, and sets a rule for counting {cite:canon-ibn-sina-print-v1 p.173}."
  fr: "Ibn Sina présente le désaccord médical sur l’unité ou la dualité du double battement et fixe une règle de décompte {cite:canon-ibn-sina-print-v1 p.173}."
  es: "Ibn Sina presenta el desacuerdo de los médicos sobre el pulso de doble latido, si es un latido o dos, y establece una regla para contarlo {cite:canon-ibn-sina-print-v1 p.173}."
  ur: "ابن سینا دوہری دھڑکن نبض پر طبیبوں کے اختلاف کو پیش کرتے ہیں، خواہ یہ ایک دھڑکن ہو یا دو، اور گنتی کے لیے ایک قاعدہ مقرر کرتا ہے۔"
  tr: "İbn Sina, hekimler arasında lot sayısı konusundaki farkları, bunun bir atış mı yoksa iki mi olduğunu ortaya koyar ve bir sayım kuralı koyar {cite:canon-ibn-sina-print-v1 s.173}."
  id: "Ibn Sina menyajikan perbedaan di antara dokter mengenai jumlah lot, apakah itu satu denyut nadi atau dua, dan menetapkan aturan penghitungan {cite:canon-ibn-sina-print-v1 hlm.173}."
