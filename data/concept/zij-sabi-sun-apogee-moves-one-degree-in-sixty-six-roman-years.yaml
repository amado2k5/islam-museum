summary:
  ar: "يبين البتاني أن البُعد الأبعد للشمس يتحرك بحركة الكواكب الثابتة التي وجدها بالرصد، فيتحرك درجة واحدة في كل ستة وستين سنة رومية، ويتحرك كذلك درجة واحدة في عدد من السنين القمرية. {cite:zij-sabi-nallino-byblion p.108}."
  en: "Al-Battani says the Sun's apogee moves with the motion of the fixed stars, which he found by observation, so it moves one degree every sixty-six Roman years, and likewise one degree in a set number of lunar years. {cite:zij-sabi-nallino-byblion p.108}."
