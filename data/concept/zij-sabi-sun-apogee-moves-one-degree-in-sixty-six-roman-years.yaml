id: concept/zij-sabi-sun-apogee-moves-one-degree-in-sixty-six-roman-years
class: concept
kind: scientific
label: { ar: "بُعد الشمس الأبعد يتحرك درجة في ستة وستين عاماً رومياً", en: "The Sun's apogee moves one degree in sixty-six Roman years", ur: "سورج کا بُعدِ اَبعد چھیاسٹھ رومی سالوں میں ایک درجہ حرکت کرتا ہے", es: "El apogeo del Sol se desplaza un grado cada sesenta y seis años romanos.", fr: "L'apogée du Soleil se déplace d'un degré en soixante-six années romaines.", tr: "Güneşin en uzak noktası altmış altı Roma yılında bir derece hareket eder.", id: "Titik terjauh matahari bergerak satu derajat dalam enam puluh enam tahun Romawi." }
summary:
  ar: "يبين البتاني أن البُعد الأبعد للشمس يتحرك بحركة الكواكب الثابتة التي وجدها بالرصد، فيتحرك درجة واحدة في كل ستة وستين سنة رومية، ويتحرك كذلك درجة واحدة في عدد من السنين القمرية. {cite:zij-sabi-nallino-byblion p.108}."
  en: "Al-Battani says the Sun's apogee moves with the motion of the fixed stars, which he found by observation, so it moves one degree every sixty-six Roman years, and likewise one degree in a set number of lunar years. {cite:zij-sabi-nallino-byblion p.108}."
  ur: "البتانی کہتے ہیں کہ سورج کا بُعدِ اَبعد ثوابت کی حرکت کے ساتھ حرکت کرتا ہے جسے انہوں نے رصد سے پایا، اس لیے یہ ہر چھیاسٹھ رومی سال میں ایک درجہ چلتا ہے، اور اسی طرح قمری سالوں کی ایک مقررہ تعداد میں بھی ایک درجہ۔ {cite:zij-sabi-nallino-byblion p.108}۔"
  es: "Al-Battani afirma que el apogeo del Sol se mueve con el movimiento de las estrellas fijas, lo cual descubrió mediante la observación, de modo que se desplaza un grado cada sesenta y seis años romanos, y de igual manera un grado en un número determinado de años lunares. {cite:zij-sabi-nallino-byblion p.108}."
  fr: "Al-Battani affirme que l'apogée du Soleil se déplace en fonction du mouvement des étoiles fixes, qu'il a constaté par l'observation; ainsi, elle se déplace d'un degré tous les soixante-six ans romains, et de même d'un degré en un nombre déterminé d'années lunaires. {cite:zij-sabi-nallino-byblion p.108}."
  tr: "Al-Battani, gözlem yoluyla bulduğu üzere, güneşin en uzak noktasının gezegenlerin sabit hareketiyle birlikte hareket ettiğini açıklıyor. Bu nokta her altmış altı Roma yılında bir derece, ayrıca her birkaç ay yılında da bir derece hareket eder. {cite:zij-sabi-nallino-byblion s.108}."
  id: "Al-Battani menjelaskan bahwa titik terjauh matahari bergerak dengan gerakan tetap planet-planet, yang ia temukan melalui pengamatan. Titik tersebut bergerak satu derajat setiap enam puluh enam tahun Romawi, dan juga satu derajat setiap beberapa tahun lunar. {cite:zij-sabi-nallino-byblion p.108}."
