id: concept/dud
class: concept
kind: natural
label:
  ar: "دود"
  en: "Dud (the dyers' worm)"
  ur: "دود ⁦(رنگریز کا کیڑا)⁩"
  es: "Dud (el gusano de los tintoreros)"
  fr: "Dud (le ver des teinturiers)"
  tr: "duman"
  id: "asap"
summary:
  ar: "دود القرمز، دودة الصباغين، قوتها كقوة الأسفيذاج لكنها ألطف وأغوص، مجففة بلا لذع، ومعتدلة القبض. وفيه منافع للجراحات العصبية والتشنج، وذكر لدود كثير الأرجل تحت الجرار ينفع الأذن والخوانيق والربو واليرقان وعسر البول {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
  en: "The worm of the dyers, kermes. Its strength is like that of asfidhaj but finer and deeper; dries without sting and, according to Galen, is moderately astringent. Listed for nerve wounds and spasm, and for a many-legged worm found under water jars, which the book lists for the ear, angina, asthma, jaundice and difficult urination {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
  ur: "قرمز کا کیڑا، رنگریزوں کا کیڑا۔ اس کی قوت اسفیذاج جیسی ہے مگر زیادہ باریک اور گہرائی تک جانے والی؛ بغیر جلن کے خشک کرتا ہے اور جالینوس کے مطابق معتدل قابض ہے۔ عصبی زخموں اور اینٹھن کے لیے بیان ہوا ہے، اور جرّوں کے نیچے ملنے والا کثیر الپاؤں کیڑا کان، خوانیق، دمہ، یرقان اور عسر البول کے لیے کتاب میں درج ہے {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}۔"
  es: "El gusano de los tintoreros, kermes. Su fuerza es similar a la del asfidhaj, pero más fina y profunda; seca sin picar y, según Galeno, es moderadamente astringente. Se menciona para heridas nerviosas y espasmos, y para un gusano de muchas patas que se encuentra debajo de tinajas de agua, que el libro menciona para el oído, la angina, el asma, la ictericia y la dificultad para orinar {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
  fr: "Le ver des teinturiers, le kermès. Sa force est semblable à celle de l'asfidhaj, mais plus subtile et plus profonde; il sèche sans piquer et, selon Galien, est modérément astringent. Il est mentionné pour les lésions nerveuses et les spasmes, ainsi que pour un ver à nombreuses pattes trouvé sous les jarres d'eau, que le livre mentionne pour les otites, l'angine de poitrine, l'asthme, la jaunisse et les difficultés à uriner {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
  tr: "Kızıl solucanlar, pigmentli solucanlar, sphadag ile aynı güçte ancak daha hafif ve daha dalışlıdır, kurutulmuş ve sokmaz, orta derecede tutunur. Sinirsel yaralar ve spazmlar için faydalıdır, kavanozun altında çok bacaklı erkek solucan ise kulaklar, kulaklar, faringeallar, sarılık ve dizüri için faydalıdır {cite:canon-ibn-sina-print-v1 s.435} {cite:canon-ibn-sina-print-v1 s.436}."
  id: "Cacing merah, cacing berpigmen, memiliki kekuatan yang sama dengan sphadag tetapi lebih ringan dan lebih menyelam, kering tanpa perih, dan cukup mencengkeram. Cacing ini memiliki manfaat untuk luka saraf dan kejang, dan cacing berkaki banyak jantan di bawah toples bermanfaat untuk telinga, telinga, faring, penyakit kuning, dan disuria {cite:canon-ibn-sina-print-v1 hlm.435} {cite:canon-ibn-sina-print-v1 hlm.436}."
