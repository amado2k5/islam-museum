label:
  ar: "دود"
  en: "Dud (the dyers' worm)"
  ur: "دود ⁦(رنگریز کا کیڑا)⁩"
summary:
  ar: "دود القرمز، دودة الصباغين، قوتها كقوة الأسفيذاج لكنها ألطف وأغوص، مجففة بلا لذع، ومعتدلة القبض. وفيه منافع للجراحات العصبية والتشنج، وذكر لدود كثير الأرجل تحت الجرار ينفع الأذن والخوانيق والربو واليرقان وعسر البول {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
  en: "The worm of the dyers, kermes. Its strength is like that of asfidhaj but finer and deeper; dries without sting and, according to Galen, is moderately astringent. Listed for nerve wounds and spasm, and for a many-legged worm found under water jars, which the book lists for the ear, angina, asthma, jaundice and difficult urination {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}."
  ur: "قرمز کا کیڑا، رنگریزوں کا کیڑا۔ اس کی قوت اسفیذاج جیسی ہے مگر زیادہ باریک اور گہرائی تک جانے والی؛ بغیر جلن کے خشک کرتا ہے اور جالینوس کے مطابق معتدل قابض ہے۔ عصبی زخموں اور اینٹھن کے لیے بیان ہوا ہے، اور جرّوں کے نیچے ملنے والا کثیر الپاؤں کیڑا کان، خوانیق، دمہ، یرقان اور عسر البول کے لیے کتاب میں درج ہے {cite:canon-ibn-sina-print-v1 p.435} {cite:canon-ibn-sina-print-v1 p.436}۔"
