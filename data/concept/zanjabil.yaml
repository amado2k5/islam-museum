label:
  ar: "الزنجبيل"
  en: "Zanjabil (ginger)"
  ur: "زنجبیل ⁦(ادرک)⁩"
  es: "Zanjabil (jengibre)"
  fr: "Zanjabil (gingembre)"
  tr: "Zencefil"
  id: "Jahe"
summary:
  ar: "الزنجبيل أصوله صغار تشبه أصول السعد، طعمه شبيه بالفلفل وأقل لطافة منه، وطبعه حار في آخر الثالثة يابس في الثانية؛ يعين على الهضم، ويحلّل النفخ، ويحفظ الذهن، وينفع من سموم الهوام. {cite:canon-ibn-sina-print-v1 p.455}"
  en: "Zanjabil has small roots like those of sa'd, a taste like pepper but less subtle; it is hot at the end of the third degree and dry in the second. It aids digestion, dissolves flatulence, strengthens memory, and helps against the venom of vermin. {cite:canon-ibn-sina-print-v1 p.455}"
  ur: "زنجبیل کی جڑیں سعد کی جڑوں جیسی چھوٹی ہوتی ہیں، ذائقہ کالی مرچ جیسا مگر اس سے کم لطیف؛ مزاج تیسرے درجے کے آخر میں گرم اور دوسرے میں خشک ہے۔ یہ ہضم میں مدد دیتا ہے، ہوا کو تحلیل کرتا ہے، حافظہ بڑھاتا ہے، اور زہریلے کیڑوں کے زہر میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.455}"
  es: "El zanjabil tiene raíces pequeñas, como las del sa'd, y un sabor parecido al de la pimienta, pero menos sutil; es picante al final del tercer grado y seco al final del segundo. Favorece la digestión, disuelve la flatulencia, fortalece la memoria y ayuda contra el veneno de los parásitos. {cite:canon-ibn-sina-print-v1 p.455}"
  fr: "Le zanjabil possède de petites racines semblables à celles du sa'd, un goût poivré mais moins subtil; il est piquant à la fin du troisième degré et sec au deuxième. Il facilite la digestion, soulage les flatulences, fortifie la mémoire et protège contre le venin des vermines. {cite:canon-ibn-sina-print-v1 p.455}"
  tr: "Zencefilin kökleri siper ağacınınkine benzer küçük köklerdir; tadı bibere benzer ancak daha az hoştur; üçüncü derecede acı, ikinci derecede kuru bir yapıya sahiptir. Sindirime yardımcı olur, gazı giderir, zihni keskinleştirir ve böcek zehirlerine karşı faydalıdır. {cite:canon-ibn-sina-print-v1 s.455}"
  id: "Jahe memiliki akar kecil yang mirip dengan akar pohon cemara; rasanya mirip dengan lada tetapi kurang enak; temperamennya panas pada tingkat ketiga dan kering pada tingkat kedua. Jahe membantu pencernaan, meredakan perut kembung, mempertajam pikiran, dan bermanfaat untuk melawan racun serangga. {cite:canon-ibn-sina-print-v1 p.455}"
