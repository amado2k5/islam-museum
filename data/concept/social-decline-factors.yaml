id: concept/social-decline-factors
class: concept
kind: social
label:
  ar: "عوامل انحدار المجتمع في القرآن"
  en: "Qur'anic factors of social decline"
  es: "Factores coránicos del declive social"
  fr: "Facteurs coraniques du déclin social"
  ur: "معاشرتی زوال کے قرآنی عوامل"
  tr: "Kur'an'da toplumsal gerileme faktörleri"
  id: "Faktor-faktor kemunduran masyarakat dalam Al-Qur'an"
summary:
  ar: "يذكر عرجون ثلاث علامات تسبق انحدار المجتمع: فساد القمة، وهو تفتت من رأس المجتمع ينذر بإفساد عام {cite:sunan-allah-fi-al-mujtama-azhar p. 40}؛ والانغماس في الترف الذي يميت النخوة والغيرة ويجعل الرذيلة مألوفة {cite:sunan-allah-fi-al-mujtama-azhar p. 40}؛ والركون إلى الظالمين {cite:sunan-allah-fi-al-mujtama-azhar p. 41}. ويستدل بآيات الإسراء وهود على أن الله يأخذ بالإفساد الاجتماعي أسرع مما يأخذ بالكفر، وأن جزاء البغي والفساد معجل في الدنيا بينما يقبل جزاء الكفر التأجيل إلى الآخرة {cite:sunan-allah-fi-al-mujtama-azhar p. 41}."
  en: "Arjun lists three signs of decline: decay at the top of society, which warns of general corruption; luxury, which kills honour and makes vice ordinary; and reliance on oppressors. He reads the Qur'an as showing that social corruption is requited faster than unbelief in this life {cite:sunan-allah-fi-al-mujtama-azhar p. 40-41}."
  es: "Arjun enumera tres señales de decadencia: la decadencia en la cúspide de la sociedad, que advierte de la corrupción generalizada; el lujo, que destruye el honor y normaliza el vicio; y la dependencia de los opresores. Interpreta el Corán como una muestra de que la corrupción social se castiga más rápidamente que la incredulidad en esta vida {cite:sunan-allah-fi-al-mujtama-azhar p. 40-41}."
  fr: "Arjun cite trois signes de déclin: la décadence des élites, annonciatrice d’une corruption généralisée; le luxe, qui pervertit l’honneur et banalise le vice; et la dépendance envers les oppresseurs. Il interprète le Coran comme démontrant que la corruption sociale est punie plus rapidement que l’incroyance dans cette vie (Sunan Allah fi al-Mujtama Azhar, p. 40-41)."
  ur: "ارجن زوال کی تین نشانیوں کی فہرست دیتا ہے: معاشرے کی چوٹی پر زوال، جو عام بدعنوانی سے خبردار کرتا ہے۔ عیش و عشرت، جو عزت کو مار دیتی ہے اور عام کو عام کرتی ہے۔ اور ظالموں پر بھروسہ۔ وہ قرآن پڑھتا ہے جس سے ظاہر ہوتا ہے کہ سماجی بدعنوانی کا بدلہ اس زندگی میں کفر سے زیادہ تیزی سے ملتا ہے۔ 40-41}۔"
  tr: "Arjun, toplumun çöküşünden önce üç işaretten bahseder: toplumun başından parçalanan, kamu yozlaşmasını tehdit eden tepedeki yozlaşma {cite:sunan-allah-fi-al-mujtama-azhar s. 40}; gurur ve kıskançlığı öldüren, kötülüğü tanıdık kılan lüks [cite:sunan-allah-fi-al-mujtama-azhar s. 40}; ve suçlulara güvenmek {cite:sunan-allah-fi-al-mujtama-azhar s. 41}. El-İsra ve Hud ayetlerini, Allah'ın toplumsal yozlaşmaya inançsızlığı yakalamaktan daha hızlı ele geçirdiğine ve zulüm ve yozlaşma cezasının bu dünyada hızlandığını, kâfirliğin cezasının ise ahiret zamanına ertelendiğini {cite:sunan-allah-fi-al-mujtama-azhar s. 41} göstermektedir."
  id: "Arjun menyebutkan tiga tanda sebelum kemunduran masyarakat: korupsi di puncak, yang merupakan fragmentasi dari kepala masyarakat yang mengancam korupsi publik {cite:sunan-allah-fi-al-mujtama-azhar hlm. 40}; kemewahan yang membunuh kesombongan dan kecemburuan serta membuat kejahatan menjadi familiar {cite:sunan-allah-fi-al-mujtama-azhar hlm. 40}; dan ketergantungan pada para pelaku kejahatan {cite:sunan-allah-fi-al-mujtama-azhar hlm. 41}. Ia mengutip ayat-ayat Al-Isra dan Hud sebagai bukti bahwa Tuhan menangkap korupsi sosial lebih cepat daripada Dia menangkap ketidakpercayaan, dan bahwa hukuman atas penindasan dan korupsi dipercepat di dunia ini sementara hukuman atas ketidakpercayaan ditunda ke akhirat {cite:sunan-allah-fi-al-mujtama-azhar hlm. 41}."
