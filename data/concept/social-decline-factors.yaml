summary:
  ar: "يذكر عرجون ثلاث علامات تسبق انحدار المجتمع: فساد القمة، وهو تفتت من رأس المجتمع ينذر بإفساد عام {cite:sunan-allah-fi-al-mujtama-azhar p. 40}؛ والانغماس في الترف الذي يميت النخوة والغيرة ويجعل الرذيلة مألوفة {cite:sunan-allah-fi-al-mujtama-azhar p. 40}؛ والركون إلى الظالمين {cite:sunan-allah-fi-al-mujtama-azhar p. 41}. ويستدل بآيات الإسراء وهود على أن الله يأخذ بالإفساد الاجتماعي أسرع مما يأخذ بالكفر، وأن جزاء البغي والفساد معجل في الدنيا بينما يقبل جزاء الكفر التأجيل إلى الآخرة {cite:sunan-allah-fi-al-mujtama-azhar p. 41}."
  en: "Arjun lists three signs of decline: decay at the top of society, which warns of general corruption; luxury, which kills honour and makes vice ordinary; and reliance on oppressors. He reads the Qur'an as showing that social corruption is requited faster than unbelief in this life {cite:sunan-allah-fi-al-mujtama-azhar p. 40-41}."
