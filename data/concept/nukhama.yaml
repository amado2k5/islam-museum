id: concept/nukhama
class: concept
kind: legal
label: { ar: "النُّخَامَة", en: "Phlegm (nukhama) and its purity", ur: "نخامہ ⁦(بلغم)⁩", es: "La flema (nukhama) y su pureza", fr: "Le flegme (nukhama) et sa pureté" }
summary:
  ar: "النخامة في اللغة ما يخرج من صدر الإنسان أو خيشومه من البلغم والمواد عند التنحنح، وهي أعم من المخاط، وأعم من القلس من حيث مكان خروجها. وذهب جمهور الفقهاء إلى طهارتها إن نزلت من الرأس أو خرجت من الصدر أو أقصى الحلق، واختلفوا فيما صعد من المعدة، فذهب الشافعية وأبو يوسف إلى نجاسته. وذهب المالكية والحنابلة والمذهب عند الحنفية إلى طهارتها، واستدلوا بأن النبي أخذ النخامة بطرف رداء. ولا تنقض ابتلاعها الوضوء. ويحرم عند الجمهور إلقاء النخامة في المسجد، ويجب دفنها إن لم يكن حصير، وتزال من الجدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549}"
  en: "Nukhama, in the lexicon, is what comes out of the chest or the nose, phlegm and matter, when one clears the throat. It is wider than mucus and wider than qalas as to where it comes out. Most jurists hold it pure if it comes down from the head, or comes from the chest or the far end of the throat; they differ on what rises from the stomach, which the Shafi'is and Abu Yusuf hold impure. The Malikis, the Hanbalis and the adopted Hanafi view hold it pure, citing the report that the Prophet took phlegm with the edge of his garment in prayer. Swallowing it does not break the ablution. Most jurists forbid throwing phlegm into the mosque; it must be buried if there is no mat, and wiped from the wall. Its swallowing during fasting is disputed and is treated under fasting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549}"
  ur: "نخامہ سینے یا ناک سے نکلنے والا بلغم ہے۔ جمہور کے نزدیک سر یا سینے یا حلق کے آخری حصے سے آنے والا بلغم پاک ہے۔ مالکیہ اور حنابلہ کے نزدیک پاک ہے، اور مسجد میں تھوکنا منع ہے، اور اسے دفن کرنا چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549}"
  es: "Nukhama, en el léxico, es lo que sale del pecho o la nariz, flema y materia, cuando uno se aclara la garganta. Es más amplio que el moco y más amplio que el qalas en cuanto a su origen. La mayoría de los juristas lo consideran puro si baja de la cabeza, o si proviene del pecho o del extremo más alejado de la garganta; difieren en cuanto a lo que asciende del estómago, que los shafi'íes y Abu Yusuf consideran impuro. Los malikíes, los hanbalíes y la visión hanafí adoptada lo consideran puro, citando el relato de que el Profeta recogió flema con el borde de su vestimenta durante la oración. Tragarla no invalida la ablución. La mayoría de los juristas prohíben arrojar flema a la mezquita; debe enterrarse si no hay alfombra y limpiarse de la pared. Su ingestión durante el ayuno es objeto de controversia y se trata dentro del ayuno. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15547} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15548} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549}"
  fr: "Dans le lexique, le terme « nukhama » désigne ce qui sort de la poitrine ou du nez, flegme et sécrétions, lorsqu'on se racle la gorge. Sa définition est plus large que celle du mucus et des sécrétions nasales (qalas) quant à leur origine. La plupart des juristes considèrent le nukhama pur s'il provient de la tête, de la poitrine ou du fond de la gorge; les avis divergent quant à ce qui provient de l'estomac, que les chaféites et Abou Yusuf considèrent comme impur. Les malikites, les hanbalites et l'école hanafite, qui a adopté cette dernière, le considèrent pur, se référant au hadith selon lequel le Prophète recueillait du flegme avec le bord de son vêtement pendant la prière. L'avaler ne invalide pas les ablutions. La plupart des juristes interdisent de jeter le flegme dans la mosquée; il doit être enterré s'il n'y a pas de tapis de prière, et essuyé des murs. L'ingestion de nukhama pendant le jeûne est controversée et traitée dans le cadre du jeûne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549}"
