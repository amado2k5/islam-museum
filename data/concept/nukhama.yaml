id: concept/nukhama
class: concept
kind: legal
label: { ar: "النُّخَامَة", en: "Phlegm (nukhama) and its purity", ur: "نخامہ (بلغم)" }
summary:
  ar: "النخامة في اللغة ما يخرج من صدر الإنسان أو خيشومه من البلغم والمواد عند التنحنح، وهي أعم من المخاط، وأعم من القلس من حيث مكان خروجها. وذهب جمهور الفقهاء إلى طهارتها إن نزلت من الرأس أو خرجت من الصدر أو أقصى الحلق، واختلفوا فيما صعد من المعدة، فذهب الشافعية وأبو يوسف إلى نجاسته. وذهب المالكية والحنابلة والمذهب عند الحنفية إلى طهارتها، واستدلوا بأن النبي أخذ النخامة بطرف رداء. ولا تنقض ابتلاعها الوضوء. ويحرم عند الجمهور إلقاء النخامة في المسجد، ويجب دفنها إن لم يكن حصير، وتزال من الجدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549}"
  en: "Nukhama, in the lexicon, is what comes out of the chest or the nose, phlegm and matter, when one clears the throat. It is wider than mucus and wider than qalas as to where it comes out. Most jurists hold it pure if it comes down from the head, or comes from the chest or the far end of the throat; they differ on what rises from the stomach, which the Shafi'is and Abu Yusuf hold impure. The Malikis, the Hanbalis and the adopted Hanafi view hold it pure, citing the report that the Prophet took phlegm with the edge of his garment in prayer. Swallowing it does not break the ablution. Most jurists forbid throwing phlegm into the mosque; it must be buried if there is no mat, and wiped from the wall. Its swallowing during fasting is disputed and is treated under fasting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549}"
  ur: "نخامہ سینے یا ناک سے نکلنے والا بلغم ہے۔ جمہور کے نزدیک سر یا سینے یا حلق کے آخری حصے سے آنے والا بلغم پاک ہے۔ مالکیہ اور حنابلہ کے نزدیک پاک ہے، اور مسجد میں تھوکنا منع ہے، اور اسے دفن کرنا چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15549}"
