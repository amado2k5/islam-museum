  tr: "Banka parası yaratma"
  id: "Menciptakan uang bank"
summary:
  ar: "يفرق المؤلف بين النقود الأساسية التي تصدرها الدولة من ورق ومعدن، ونقود الودائع الائتمانية أو الكتابية التي تخلقها البنوك {cite:usul-iqtisad-islami-0660 p. 356}. ويرى أن البنوك تحتفظ باحتياطي جزئي فتقرض أكثر منه، فتتضاعف الودائع والنقود المصرفية {cite:usul-iqtisad-islami-0660 p. 356}، وأن التوسع في الائتمان من أهم أسباب الأزمة {cite:usul-iqtisad-islami-0660 p. 356}."
  tr: "Yazar, devlet tarafından çıkarılan temel parayı, ister kağıt ister metal olsun, ile bankalar tarafından oluşturulan kredi veya yazılı mevduat parası arasında ayrım yapar {cite:usul-iqtisad-islami-0660 s. 356}. Bankaların kısmi bir rezerv tuttuğuna ve bundan fazlasını kredi verdiğine, bunun da mevduat ve banka parasının çoğalmasına neden olduğuna inanır {cite:usul-iqtisad-islami-0660 s. 356} ve krizin genişlemesinin krizin başlıca nedenlerinden biri olduğunu {cite:usul-iqtisad-islami-0660 s. 356}"
  id: "Penulis membedakan antara uang dasar yang diterbitkan oleh negara, baik kertas maupun logam, dan uang kredit atau uang simpanan tertulis yang dibuat oleh bank {cite:usul-iqtisad-islami-0660 hlm. 356}. Ia percaya bahwa bank menyimpan cadangan sebagian dan meminjamkan lebih dari itu, menyebabkan simpanan dan uang bank berlipat ganda {cite:usul-iqtisad-islami-0660 hlm. 356}, dan bahwa perluasan kredit adalah salah satu penyebab utama krisis {cite:usul-iqtisad-islami-0660 hlm. 356}."
