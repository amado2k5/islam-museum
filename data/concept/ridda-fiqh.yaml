id: concept/ridda-fiqh
class: concept
kind: legal
label:
  ar: "الردة"
  en: "Ridda (apostasy from Islam): its conditions, its forms, the repentance of the apostate, and its effects on property, marriage and worship"
  ur: "ارتداد"
  es: "Ridda (apostasía del Islam): sus condiciones, sus formas, el arrepentimiento del apóstata y sus efectos sobre la propiedad, el matrimonio y el culto."
  fr: "Ridda (apostasie de l'islam): ses conditions, ses formes, le repentir de l'apostat et ses effets sur la propriété, le mariage et le culte"
summary:
  ar: "الردة في اللغة الرجوع عن الشيء، وفي الاصطلاح كفر المسلم بقول صريح أو لفظ يقتضيه أو فعل يتضمنه، ولا تقع إلا من بالغ عاقل مختار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} وذهب أبو حنيفة والشافعي إلى عدم اعتبار ردة الصبي في قول، واعتبرها المالكية والمشهور عن أحمد، ولا يقتل الصبي قبل بلوغه، وردة المجنون لا تصح، وردة السكران عند الحنفية لا تعتبر، والشافعية والحنابلة يعتبرونها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8706} والمكره على كلمة الكفر لا يصير كافرا، لقوله تعالى: إلا من أكره وقلبه مطمئن بالإيمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8706} وتقع الردة بالاعتقاد أو القول أو الفعل أو الترك، كالإشراك بالله، وإلقاء المصحف في القذر، والسجود للصنم، وترك الصلاة جاحدا لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8711} وسب الله كفر باتفاق، وسب النبي ردة عند الحنفية والحنابلة، وقال الشافعية هو ردة وزيادة، واختلف في قبول توبة الساب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8718} ويستتاب المرتد، فإن تاب وإلا قتل بعد الاستتابة للإمام، والمرأة المرتدة عند الجمهور كالمرتد، وخالف الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8715} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8719} ولا تصح زواج المرتد، وينفسخ نكاح الزوجين بالردة عند الحنفية، ويختلف الفقهاء في توقف ملكه عن ماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8721} وتحبط أعمال المرتد على خلاف في شرط الحبوط، ويختلف الفقهاء في إعادة الحج والصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725}"
  en: "Ridda in the lexicon is turning back from a thing; in law it is a Muslim's unbelief by an explicit word, a word implying it, or an act containing it, and it can only be committed by a sane, adult and free person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} Abu Hanifa and al-Shafi'i do not count a child's apostasy in one view, the Malikis and a famous Hanbali view count it; a child is not killed before puberty; a madman's apostasy is not valid; a drunk man's apostasy is not counted by the Hanafis, while the Shafi'is and Ahmad count it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8706} One who is compelled to speak unbelief does not become an unbeliever, by the verse excepting the compelled whose heart is at peace in faith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8706} Apostasy happens by belief, speech, act or omission: associating others with God, throwing the Qur'an in filth, prostrating to an idol, and abandoning prayer in denial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8711} Insulting God is unbelief by agreement; insulting the Prophet is apostasy for the Hanafis and Hanbalis, and for the Shafi'is apostasy with an added hadd, while the acceptance of the repentance of the insulter is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8718} The apostate is asked to repent, and if he does not he is killed by the imam; the female apostate is killed by the majority and not by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8715} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8719} A marriage of an apostate is void; a spouse's apostasy annuls the marriage for the Hanafis; the apostate's property is disputed as to whether it passes away. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8721} The deeds of the apostate are annulled, and the jurists differ on the condition of this, and on repeating the pilgrimage and the missed prayers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725}"
  ur: "ردت وہ کفر ہے جو مسلمان کسی صریح قول، فعل یا ترک سے اختیار کرے، اور یہ بالغ، عاقل اور مختار شخص سے ہی ممکن ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} توبہ کے بعد مرتد کو قتل نہیں کیا جاتا جب تک وہ توبہ نہ کرے، اور اس کی توبہ کی قبولیت کا طریقہ اختلافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8717}"
  es: "Ridda en el léxico es apartarse de algo; en la ley es la incredulidad de un musulmán por una palabra explícita, una palabra que lo implica, o un acto que lo contiene, y solo puede ser cometido por una persona cuerda, adulta y libre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} Abu Hanifa y al-Shafi'i no cuentan la apostasía de un niño en una opinión, los Malikis y una famosa opinión Hanbali sí la cuentan; un niño no es asesinado antes de la pubertad; la apostasía de un loco no es válida; la apostasía de un borracho no es contada por los Hanafis, mientras que los Shafi'is y Ahmad sí la cuentan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8706} Quien es obligado a hablar incredulidad no se convierte en incrédulo, según el versículo que exceptúa a los obligados cuyo corazón está en paz en la fe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8706} La apostasía ocurre por creencia, palabra, acto u omisión: asociar a otros con Dios, tirar el Corán a la inmundicia, postrarse ante un ídolo y abandonar la oración en negación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8707} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8710} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8711} Insultar a Dios es incredulidad por acuerdo; Insultar al Profeta es apostasía para los Hanafis y Hanbalis, y para los Shafi'is apostasía con un hadd añadido, mientras que se discute la aceptación del arrepentimiento del insultador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8718} Al apóstata se le pide que se arrepienta, y si no lo hace, es asesinado por el imán; la mujer apóstata es asesinada por la mayoría y no por los hanafíes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8715} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8716} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8718} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8719} El matrimonio de un apóstata es nulo; la apostasía del cónyuge anula el matrimonio de los Hanafis; Se discute si la propiedad del apóstata desaparece o no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8721} Los hechos del apóstata son anulados, y los juristas difieren sobre la condición de esto, y en repetir la peregrinación y las oraciones perdidas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8724} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725}"
  fr: "Dans le lexique, « ridda » signifie se détourner de quelque chose; en droit, il s'agit de l'incroyance d'un musulman exprimée par une parole explicite, une parole qui l'implique ou un acte la contenant, et elle ne peut être commise que par une personne saine d'esprit, majeure et libre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8704} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} Selon une opinion, Abu Hanifa et al-Shafi'i ne prennent pas en compte l'apostasie d'un enfant, tandis que les Malikites et une opinion hanbalite bien connue la prennent en compte; un enfant n'est pas tué avant la puberté; l'apostasie d'un fou n'est pas valable; l'apostasie d'un homme ivre n'est pas prise en compte par les Hanafites, tandis que les Shafi'ites et Ahmad la prennent en compte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8705} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8706} Celui qui est contraint de proférer l'incroyance ne devient pas pour autant incroyant, selon le verset, sauf celui qui, contraint, a le cœur en paix dans la foi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8706} L'apostasie se manifeste par la croyance, la parole, l'acte ou l'omission: associer d'autres divinités à Dieu, jeter le Coran dans les ordures, se prosterner devant une idole et abandonner la prière par reniement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8710} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8711} Insulter Dieu est une incrédulité par accord; insulter le Prophète est une apostasie pour les Hanafis et les Hanbalis, et pour les Shafi'is, une apostasie avec un hadd supplémentaire, tandis que l'acceptation du repentir de l'insulteur est contestée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8708} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8709} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8717} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8718} L'apostat est invité à se repentir, et s'il ne le fait pas, il est tué par l'imam; l'apostat femme est tuée par la majorité et non par les Hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8715} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8716} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8718} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8719} Le mariage d'un apostat est nul; l'apostasie d'un conjoint annule le mariage pour les Hanafis; la propriété de l'apostat est contestée quant à savoir si elle décède. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8722} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8723} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8721} Les actes de l'apostat sont annulés, et les juristes diffèrent sur cette condition, et sur répéter le pèlerinage et les prières manquées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8725}"
