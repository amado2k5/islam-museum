label:
  ar: "الترجيل"
  en: "Tarjil (combing and dressing the hair)"
  ur: "ترجیل ⁦(بالوں میں کنگھی کرنا)⁩"
  es: "Tarjil (peinar y arreglar el cabello)"
  fr: "Tarjil (coiffage et mise en forme des cheveux)"
  tr: "Tarjilut"
