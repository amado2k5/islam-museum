summary:
  ar: "الترجيل تسريح الشعر وتنظيفه وتحسينه، والأصل فيه الاستحباب. ويجوز للمعتكف، وللمحرم يكره عند الشافعية، ويجوز بغير الطيب للمحدة عند الجمهور، ومنعه الحنفية، ويستحب التيامن فيه، ويسن غبا لا كل يوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4951}"
  en: "Tarjil is combing, cleaning and dressing the hair; the rule is recommendation. It is allowed to one in seclusion; for the muhrim the Shafi'is call it disliked; a widow in mourning may comb with something without perfume (the majority allow it, the Hanafis forbid it); starting from the right is recommended, and doing it every other day rather than daily is the sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4951}"
  es: "Tarjil es peinar, limpiar y arreglar el cabello; la regla es la recomendación. Está permitido para quien está en reclusión; para el muhrim, los shafi'íes lo consideran desaconsejable; una viuda en duelo puede peinarse con algo sin perfume (la mayoría lo permite, los hanafíes lo prohíben); se recomienda comenzar por la derecha, y hacerlo cada dos días en lugar de diariamente es la sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4951}"
  fr: "Le tarjil consiste à peigner, laver et coiffer les cheveux; il s'agit d'une recommandation. Il est permis à celui qui vit en ermite; pour le muhrim, les chaféites le déconseillent; une veuve en deuil peut se peigner avec un produit sans parfum (la majorité l'autorise, les hanafites l'interdisent); il est recommandé de commencer par la droite, et le faire un jour sur deux plutôt que quotidiennement est la sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4951}"
  ur: "ترجیل کنگھی کر رہا ہے، بالوں کو صاف کر رہا ہے اور ڈریسنگ کر رہا ہے۔ اصول سفارش ہے. تنہائی میں اس کی اجازت ہے۔ محرم کے لیے شافعی اسے ناپسندیدہ کہتے ہیں۔ سوگ میں بیوہ بغیر عطر کے کنگھی کر سکتی ہے ⁦(اکثر اس کی اجازت دیتے ہیں، احناف منع کرتے ہیں)⁩؛ دائیں سے شروع کرنا مستحب ہے، اور روزانہ کی بجائے ہر دوسرے دن کرنا سنت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4949} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4950}"
  tr: "Tarjil, saçın şekillendirilmesi, temizlenmesi ve güzelleştirilmesidir ve orijinal tavsiye bunun içindir. Şafii mezhebi tarafından sevilmeyen, i'tikaf yapanlar için izinlidir ve çoğunluğa göre ihramda olmayan kişiler için de izinlidir, Hanefi mezhebi ise bundan yasaktır. Tayamin sırasında yapılması tavsiye edilir ve sebepsizce, her gün değil, yapılması tavsiye edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.4949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4951}"
  id: "Tarjil adalah penataan, pembersihan, dan perindahan rambut, dan rekomendasi aslinya adalah untuk itu. Tarjil diperbolehkan bagi mereka yang menjalankan i'tikaf, yang tidak disukai oleh mazhab Shafi'i, dan diperbolehkan bagi orang yang tidak berada di ihram menurut mayoritas, dan aliran Hanafi dilarang melakukannya. Disarankan untuk melakukan Tayamin selama itu, dan disarankan melakukannya tanpa alasan, bukan setiap hari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4951}"
