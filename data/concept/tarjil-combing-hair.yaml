summary:
  ar: "الترجيل تسريح الشعر وتنظيفه وتحسينه، والأصل فيه الاستحباب. ويجوز للمعتكف، وللمحرم يكره عند الشافعية، ويجوز بغير الطيب للمحدة عند الجمهور، ومنعه الحنفية، ويستحب التيامن فيه، ويسن غبا لا كل يوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4951}"
  en: "Tarjil is combing, cleaning and dressing the hair; the rule is recommendation. It is allowed to one in seclusion; for the muhrim the Shafi'is call it disliked; a widow in mourning may comb with something without perfume (the majority allow it, the Hanafis forbid it); starting from the right is recommended, and doing it every other day rather than daily is the sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4951}"
