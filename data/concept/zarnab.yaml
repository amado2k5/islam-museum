summary:
  ar: "الزرنب قضبان دقاق مستديرة سوداء إلى الصفرة، قليلة الطعم والرائحة، حار يابس في الثانية؛ فيه قبض وتحليل للرياح، ينفع الكبد والمعدة الباردتين، ويُسعط بالماء للصداع البارد. {cite:canon-ibn-sina-print-v1 p.462}"
  en: "Zarnab is a set of fine round stems, black to yellowish, with little taste or smell. Hot and dry in the second degree, it is astringent and dissolves winds; it helps the cold liver and stomach, and is snuffed with water for cold headache. {cite:canon-ibn-sina-print-v1 p.462}"
  ur: "زرنب باریک گول تنوں کی شکل میں ہے، سیاہ سے زردی مائل، کم ذائقہ اور کم بو والا۔ دوسرے درجے میں گرم اور خشک؛ اس میں قبض ہے اور یہ ہوا کو تحلیل کرتا ہے، ٹھنڈے جگر اور معدے کے لیے مفید ہے، اور ٹھنڈے سر درد میں پانی سے سونگھایا جاتا ہے۔ {cite:canon-ibn-sina-print-v1 p.462}"
  es: "El zarnab es un conjunto de tallos finos y redondos, de color negro a amarillento, con poco sabor y olor. De naturaleza cálida y seca en segundo grado, es astringente y disuelve los vientos; ayuda al hígado y al estómago fríos, y se inhala con agua para aliviar el dolor de cabeza causado por el frío. {cite:canon-ibn-sina-print-v1 p.462}"
  fr: "Le zarnab est composé de fines tiges rondes, noires à jaunâtres, peu odorantes et peu savoureuses. Chaud et sec au deuxième degré, il est astringent et dissout les vents; il est bénéfique pour le foie et l’estomac froids, et s’utilise en inhalation avec de l’eau pour soulager les maux de tête dus au froid. {cite:canon-ibn-sina-print-v1 p.462}"
  tr: "Zarnab, az tadı ve kokusu olan, küçük, yuvarlak, siyah ila sarımsı renkte bir çubuktur. İkinci derecede sıcak ve kurudur; büzücü ve gaz giderici özelliklere sahiptir. Soğuk algınlığına bağlı karaciğer ve mide rahatsızlıklarına iyi gelir ve soğuk algınlığından kaynaklanan baş ağrıları için suyla burun yıkama suyu olarak kullanılır. {cite:canon-ibn-sina-print-v1 s.462}"
  id: "Zarnab adalah batang kecil, bulat, berwarna hitam hingga kekuningan, dengan sedikit rasa atau bau. Zarnab bersifat panas dan kering tingkat kedua; memiliki sifat astringen dan karminatif. Zarnab bermanfaat untuk hati dan lambung yang dingin, dan digunakan sebagai bilasan hidung dengan air untuk sakit kepala yang disebabkan oleh flu. {cite:canon-ibn-sina-print-v1 p.462}"
