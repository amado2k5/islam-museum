id: concept/asma-allah-al-husna
education:
  did_you_know:
    ar: "«إن لله تسعة وتسعين اسمًا مائة إلا واحدًا من أحصاها دخل الجنة» رواه البخاري ومسلم؛ وعلى هذا الحديث أفرد ابن قيم الجوزية باباً في جلاء الأفهام لأسمائه الحسنى."
    en: "'God has ninety-nine names — a hundred less one; whoever counts them enters Paradise', narrated by al-Bukhari and Muslim; on this hadith Ibn Qayyim al-Jawziyya devoted a chapter of Jala' al-Afham to His beautiful names."
    ur: "«اللہ کے نامیران نام ہیں، سو کم ایک؛ جو انہیں یاد رکھے جنت میں داخل ہوگا» — بخاری و مسلم کی روایت؛ اسی حدیث پر ابن قیم جوزیہ نے جلاء الافہام میں اسمائے حسنیٰ کا باب الگ کیا۔"
    sources: [source/sahih-al-bukhari, source/sahih-muslim]
class: concept
kind: belief
label:
  ar: أسماء الله الحسنى
  en: The most beautiful names of God (asma' Allah al-husna)
  ur: اسماء حسنیٰ
summary:
  ar: "أسماء الله الحسنى: «إن لله تسعة وتسعين اسمًا مائة إلا واحدًا من أحصاها دخل الجنة» — رواه البخاري ومسلم {cite:sahih-al-bukhari} {cite:sahih-muslim}؛ وعليه أفرد ابن قيم الجوزية بابًا في جلاء الأفهام {cite:jala-afham-ibn-qayyim}. وتعرض دائرة المعارف الإسلامية الخلاف الكلامي في جواز تسمية الله بما لم يرد في النص، وتلاوة الأسماء بالسبحة، وتفاوت القائمة، ومعاني الأسماء عند الغزالي والإيجي والجرجاني {cite:encyclopaedia-of-islam-2 vol. 1 p. 763}."
  en: "The most beautiful names of God: 'God has ninety-nine names — a hundred less one — whoever enumerates them enters Paradise', reported by Bukhari and Muslim {cite:sahih-al-bukhari} {cite:sahih-muslim}; Ibn Qayyim al-Jawziyya devoted a section to them in Jala' al-Afham {cite:jala-afham-ibn-qayyim}. The Encyclopaedia of Islam sets out the theological dispute over naming God beyond the texts, the recitation of the names with the rosary, the variants of the list, and the meanings of the names in al-Ghazali, al-Iji and al-Jurjani {cite:encyclopaedia-of-islam-2 vol. 1 p. 763}."
  ur: "اسماء حسنیٰ: «اللہ کے ننانوے نام ہیں، سو کم ایک؛ جو انہیں شمار کرے گا جنت میں داخل ہوگا»، بخاری و مسلم کی روایت؛ ابن قیم جوزیہ نے جلاء الافہام میں اس پر الگ باب رکھا۔ دائرۂ معارفِ اسلامیہ اللہ کو نصوص سے باہر نام دینے کے کلامی اختلاف، ناموں کی تسبیح پر تلاوت، فہرست کے اختلافات اور غزالی، ایجی اور جرجانی کے ہاں ناموں کے معنی بیان کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 763}."
