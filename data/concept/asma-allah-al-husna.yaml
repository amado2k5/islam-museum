id: concept/asma-allah-al-husna
education:
  did_you_know:
    ar: "«إن لله تسعة وتسعين اسمًا مائة إلا واحدًا من أحصاها دخل الجنة» رواه البخاري ومسلم؛ وعلى هذا الحديث أفرد ابن قيم الجوزية باباً في جلاء الأفهام لأسمائه الحسنى."
    en: "'God has ninety-nine names — a hundred less one; whoever counts them enters Paradise', narrated by al-Bukhari and Muslim; on this hadith Ibn Qayyim al-Jawziyya devoted a chapter of Jala' al-Afham to His beautiful names."
    ur: "«اللہ کے نامیران نام ہیں، سو کم ایک؛ جو انہیں یاد رکھے جنت میں داخل ہوگا» — بخاری و مسلم کی روایت؛ اسی حدیث پر ابن قیم جوزیہ نے جلاء الافہام میں اسمائے حسنیٰ کا باب الگ کیا۔"
    sources: [source/sahih-al-bukhari, source/sahih-muslim]
class: concept
kind: belief
label:
  ar: أسماء الله الحسنى
  en: The most beautiful names of God (asma' Allah al-husna)
  fr: "Les plus beaux noms de Dieu (asma' Allah al-husna)"
  ur: اسماء حسنیٰ
  es: "Los nombres más hermosos de Dios (asma' Allah al-husna)"
  tr: "Allah'ın Güzel İsimleri"
  id: "Nama-nama Indah Allah"
summary:
  ar: "أسماء الله الحسنى: «إن لله تسعة وتسعين اسمًا مائة إلا واحدًا من أحصاها دخل الجنة» — رواه البخاري ومسلم {cite:sahih-al-bukhari} {cite:sahih-muslim}؛ وعليه أفرد ابن قيم الجوزية بابًا في جلاء الأفهام {cite:jala-afham-ibn-qayyim}. وتعرض دائرة المعارف الإسلامية الخلاف الكلامي في جواز تسمية الله بما لم يرد في النص، وتلاوة الأسماء بالسبحة، وتفاوت القائمة، ومعاني الأسماء عند الغزالي والإيجي والجرجاني {cite:encyclopaedia-of-islam-2 vol. 1 p. 763}."
  en: "The most beautiful names of God: 'God has ninety-nine names — a hundred less one — whoever enumerates them enters Paradise', reported by Bukhari and Muslim {cite:sahih-al-bukhari} {cite:sahih-muslim}; Ibn Qayyim al-Jawziyya devoted a section to them in Jala' al-Afham {cite:jala-afham-ibn-qayyim}. The Encyclopaedia of Islam sets out the theological dispute over naming God beyond the texts, the recitation of the names with the rosary, the variants of the list, and the meanings of the names in al-Ghazali, al-Iji and al-Jurjani {cite:encyclopaedia-of-islam-2 vol. 1 p. 763}."
  fr: "Les plus beaux noms de Dieu : « Dieu a quatre-vingt-dix-neuf noms — cent moins un — celui qui les énumère entre au Paradis », selon Bukhari et Muslim {cite:sahih-al-bukhari} {cite:sahih-muslim} ; Ibn Qayyim al-Jawziyya leur a consacré une section dans Jala' al-Afham {cite:jala-afham-ibn-qayyim}. L’Encyclopaedia of Islam expose la controverse théologique sur les noms de Dieu au-delà des textes, la récitation des noms avec le chapelet, les variantes de la liste et les sens des noms chez al-Ghazali, al-Iji et al-Jurjani {cite:encyclopaedia-of-islam-2 vol. 1 p. 763}."
  ur: "اسماء حسنیٰ: «اللہ کے ننانوے نام ہیں، سو کم ایک؛ جو انہیں شمار کرے گا جنت میں داخل ہوگا»، بخاری و مسلم کی روایت؛ ابن قیم جوزیہ نے جلاء الافہام میں اس پر الگ باب رکھا۔ دائرۂ معارفِ اسلامیہ اللہ کو نصوص سے باہر نام دینے کے کلامی اختلاف، ناموں کی تسبیح پر تلاوت، فہرست کے اختلافات اور غزالی، ایجی اور جرجانی کے ہاں ناموں کے معنی بیان کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 763}."
  es: "Los nombres más bellos de Dios: «Dios tiene noventa y nueve nombres — cien menos uno — quien los enumere entrará en el Paraíso», según informan Bukhari y Muslim {cite:sahih-al-bukhari} {cite:sahih-muslim}; Ibn Qayyim al-Jawziyya les dedicó una sección en Jala' al-Afham {cite:jala-afham-ibn-qayyim}. La Enciclopedia del Islam expone la disputa teológica sobre la denominación de Dios más allá de los textos, la recitación de los nombres con el rosario, las variantes de la lista y los significados de los nombres en al-Ghazali, al-Iji y al-Jurjani {cite:encyclopaedia-of-islam-2 vol. 1 p. 763}."
  tr: "Allah'ın Güzel İsimleri: \"Gerçekten Allah'ın doksan dokuz adı vardır, biri hariç yüz tane ve kim sayarsa, cennete girer.\" — El-Buhari ve Müslüman tarafından anlatılmıştır {atı:sahih-al-bukhari} {alıntı:sahih-müslim}; buna göre İbn Kayyim el-Cevziyyah anlayışların açıklığa kavuşturulmasına bir bölüm ayırdı {cite:cela-afham-ibn-kayyim}. İslami Ansiklopedi, metinde belirtilmeyen konularda Allah'ın isimlendirilmesinin izinliliği, tesbihle isimlerin okunması, isim listesindeki farklılıklar ve isimlerin anlamları el-Gazali, el-İji ve el-Cürcani'ye göre {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 763} konusundaki teolojik anlaşmazlığı sunar."
  id: "Nama-nama Indah Allah: \"Sesungguhnya, Allah memiliki sembilan puluh sembilan nama, seratus kecuali satu, dan siapa pun yang menyebutkannya akan masuk ke Surga.\" — Dinarasikan oleh Al-Bukhari dan Muslim {cite:sahih-al-bukhari} {cite:sahih-muslim}; sesuai dengan itu, Ibn Qayyim al-Jawziyyah mendedikasikan sebuah bab tentang penjelasan pemahaman {cite:jala-afham-ibn-qayyim}. Ensiklopedia Islam menyajikan perbedaan teologis mengenai diperbolehkannya menyebut Allah dalam hal-hal yang tidak disebutkan dalam teks, pembacaan nama bersama rosario, variasi dalam daftar nama, dan makna nama menurut al-Ghazali, al-Iji, dan al-Jurjani {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 763}."
