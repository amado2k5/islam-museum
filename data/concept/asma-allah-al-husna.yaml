id: concept/asma-allah-al-husna
education:
  did_you_know:
    ar: "«إن لله تسعة وتسعين اسمًا مائة إلا واحدًا من أحصاها دخل الجنة» رواه البخاري ومسلم؛ وعلى هذا الحديث أفرد ابن قيم الجوزية باباً في جلاء الأفهام لأسمائه الحسنى."
    en: "'God has ninety-nine names — a hundred less one; whoever counts them enters Paradise', narrated by al-Bukhari and Muslim; on this hadith Ibn Qayyim al-Jawziyya devoted a chapter of Jala' al-Afham to His beautiful names."
    ur: "«اللہ کے نامیران نام ہیں، سو کم ایک؛ جو انہیں یاد رکھے جنت میں داخل ہوگا» — بخاری و مسلم کی روایت؛ اسی حدیث پر ابن قیم جوزیہ نے جلاء الافہام میں اسمائے حسنیٰ کا باب الگ کیا۔"
    sources: [source/sahih-al-bukhari, source/sahih-muslim]
