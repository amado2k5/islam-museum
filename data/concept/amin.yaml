label:
  ar: "آمين"
  en: "Amin (the word 'amen' at the end of prayer)"
summary:
  ar: "آمين، لفظ معناه «آمِن» أو «ليكن كذلك»، ويُستعمل في الدعاء تأكيدًا، ويُقال في الصلاة بعد الفاتحة، ويجهر به الإمام أو يخفيه بحسب الروايات، ويردده المأمومون، وسُمّي «ختم الله على المؤمنين» {cite:encyclopaedia-of-islam-2 vol. 1 p. 458}."
  en: "Amin, 'safe', 'secure', is used in prayer and supplication as a confirmation, 'so be it', and is said in the prayer after the opening sura, loudly or quietly by the imam according to different reports, and repeated by the congregation. It is called God's seal on the believers {cite:encyclopaedia-of-islam-2 vol. 1 p. 458}."
