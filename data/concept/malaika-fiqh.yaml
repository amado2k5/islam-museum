label:
  ar: مَلائكة ⁦(الفقه)⁩
  en: Angels in the jurists' discussion (malaika)
  ur: فرشتے ⁦(فقہی بحث)⁩
  es: "Ángeles en la discusión de los juristas (malaika)"
  fr: "Les anges dans la discussion des juristes (malaika)"
  tr: "Malaika (Hukuk Bilimi)"
  id: "Malaika (Jurisprudensi)"
summary:
  ar: الملك في اللغة جسم لطيف نوراني، والملائكة جمع الملك، ومسكنها السموات. الإيمان بالملائكة ركن من أركان العقيدة، وإنكار وجودهم كفر بإجماع المسلمين. وخلقهم من نور وأنهم لا يأكلون ولا يشربون ولا ينامون، ولهم القدرة على التمثل بصور البشر بإذن الله. وعبادتهم لله طاعة وامتثال، ولهم أعمال موكلة بأصناف المخلوقات، ورؤساؤهم جبريل وميكائيل وإسرافيل. وقد اختلف الفقهاء في تفضيلهم على سائر الناس، وقتل من سب الملائكة أو استخف بهم أو أنكر وجودهم كفرا، واختلفوا هل يستتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}
  en: In the lexicon a malak is a subtle luminous body, and the angels are its plural, dwelling in the heavens. Belief in them is a pillar of the creed, and denying their existence is unbelief by the agreement of the Muslims. They were created of light, neither eat, drink nor sleep, and can take human forms by God's permission. They worship God in full obedience and are charged with tasks over every kind of creature; their chiefs are Jibril, Mikail and Israfil. The jurists differ on whether they excel the rest of mankind, and agree that whoever curses or mocks the angels, or denies them, is an unbeliever to be killed, while they differ on whether he is to be asked to repent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}
  ur: فرشتوں پر ایمان عقیدے کا رکن ہے اور ان کے وجود کا انکار بالاجماع کفر ہے۔ فرشتے نور سے پیدا ہوئے، نہ کھاتے ہیں نہ پیتے ہیں اور نہ سوتے ہیں۔ فقہاء نے فرشتوں کی فضیلت پر اختلاف کیا، اور فرشتوں کو گالی دینے یا ان کا انکار کرنے والے کو کافر ماننے پر اتفاق کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}
  es: "En el léxico, un malak es un cuerpo luminoso sutil, y los ángeles son su plural, que moran en los cielos. La creencia en ellos es un pilar del credo, y negar su existencia es incredulidad según el consenso de los musulmanes. Fueron creados de luz, no comen, beben ni duermen, y pueden adoptar forma humana con el permiso de Dios. Adoran a Dios con plena obediencia y tienen responsabilidades sobre toda clase de criaturas; sus jefes son Jibril, Mikail e Israfil. Los juristas discrepan sobre si superan al resto de la humanidad, y coinciden en que quien maldiga o se burle de los ángeles, o los niegue, es un incrédulo que debe ser ejecutado, aunque discrepan sobre si se le debe pedir que se arrepienta. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14974} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14976} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14977} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}"
  fr: "Dans le lexique, un malak est un corps lumineux subtil, et les anges en sont le pluriel, résidant dans les cieux. Croire en eux est un pilier de la foi, et nier leur existence est considéré comme de l'incroyance par les musulmans. Créés de lumière, ils ne mangent, ne boivent ni ne dorment, et peuvent prendre forme humaine par la permission de Dieu. Ils adorent Dieu en toute obéissance et sont responsables de toutes les créatures; leurs chefs sont Jibril, Mikail et Israfil. Les juristes divergent quant à savoir s'ils sont supérieurs au reste de l'humanité, et s'accordent à dire que quiconque maudit ou raille les anges, ou les renie, est un incroyant passible de mort, mais ils divergent quant à savoir s'il convient de l'exhorter à se repentir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}"
  tr: "Dilde kral ince, parlak bir bedendir, melekler krallığın çoğuludur ve onların ikametgahı göklerdir. Meleklere inanmak bir inanç direğidir ve varlığını reddetmek Müslümanlar arasında oybirliğiyle inançsızlık olarak kabul edilir. Onları ışıktan yaratmışlardır; ne yememiş, ne içmemiş, ne uyumamış, hem de Allah'ın izniyle insan formlarını taklit edebildiklerini belirtmişlerdir. Tanrı'ya tapmaları itaat ve itaattır; çeşitli yaratıklara görevleri verilmiş ve liderleri Gabriel, Michael ve İsrail'dir. Hukukçular, başkalarına karşı tercihleri konusunda farklı görüşlerde bulunmuşlardır; melekleri aşağılayan, küçümseyenler veya varlığını inkâr edenler kâfir sayılır ve birinin tövbe edip etmemesi gerektiği konusunda ise görüş ayrılığı vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14978}"
  id: "Dalam bahasa, raja adalah tubuh yang halus dan bercahaya, dan malaikat adalah jamak dari kerajaan, dan tempat tinggal mereka adalah langit. Kepercayaan kepada malaikat adalah tiang kepercayaan, dan menyangkal keberadaan mereka secara bulat dianggap sebagai ketidakpercayaan di kalangan Muslim. Mereka menciptakan malaikat dari cahaya, dan bahwa mereka tidak makan, minum, maupun tidur, serta memiliki kemampuan meniru bentuk manusia, dengan izin Tuhan. Pemujaan mereka kepada Tuhan adalah ketaatan dan ketaatan, dan mereka memiliki tugas yang dipercayakan kepada berbagai makhluk, dan pemimpin mereka adalah Gabriel, Mikhael, dan Israfil. Para ahli hukum berbeda pendapat mengenai preferensi mereka dibandingkan orang lain, dan mereka yang menghina malaikat, merendahkan mereka, atau menyangkal keberadaan mereka dianggap kafir, dan mereka berbeda pendapat apakah seseorang harus bertobat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}"
