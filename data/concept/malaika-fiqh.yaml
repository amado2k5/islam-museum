label: { ar: "مَلائكة (الفقه)", en: "Angels in the jurists' discussion (malaika)", ur: "فرشتے (فقہی بحث)" }
summary:
  ar: "الملك في اللغة جسم لطيف نوراني، والملائكة جمع الملك، ومسكنها السموات. الإيمان بالملائكة ركن من أركان العقيدة، وإنكار وجودهم كفر بإجماع المسلمين. وخلقهم من نور وأنهم لا يأكلون ولا يشربون ولا ينامون، ولهم القدرة على التمثل بصور البشر بإذن الله. وعبادتهم لله طاعة وامتثال، ولهم أعمال موكلة بأصناف المخلوقات، ورؤساؤهم جبريل وميكائيل وإسرافيل. وقد اختلف الفقهاء في تفضيلهم على سائر الناس، وقتل من سب الملائكة أو استخف بهم أو أنكر وجودهم كفرا، واختلفوا هل يستتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}"
  en: "In the lexicon a malak is a subtle luminous body, and the angels are its plural, dwelling in the heavens. Belief in them is a pillar of the creed, and denying their existence is unbelief by the agreement of the Muslims. They were created of light, neither eat, drink nor sleep, and can take human forms by God's permission. They worship God in full obedience and are charged with tasks over every kind of creature; their chiefs are Jibril, Mikail and Israfil. The jurists differ on whether they excel the rest of mankind, and agree that whoever curses or mocks the angels, or denies them, is an unbeliever to be killed, while they differ on whether he is to be asked to repent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}"
  ur: "فرشتوں پر ایمان عقیدے کا رکن ہے اور ان کے وجود کا انکار بالاجماع کفر ہے۔ فرشتے نور سے پیدا ہوئے، نہ کھاتے ہیں نہ پیتے ہیں اور نہ سوتے ہیں۔ فقہاء نے فرشتوں کی فضیلت پر اختلاف کیا، اور فرشتوں کو گالی دینے یا ان کا انکار کرنے والے کو کافر ماننے پر اتفاق کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14978}"
