label: { ar: "بُعد القمر بأوتار اختلاف المنظر", en: "The Moon's distance by the chords of the parallax", ur: "اختلافِ منظر کے اوتار سے چاند کا فاصلہ", es: "La distancia de la Luna según las cuerdas de la paralaje", fr: "La distance de la Lune selon les cordes de la parallaxe" }
summary:
  ar: "يُحسب بُعد القمر بالأوتار: يُضرب وتر بُعده عن نقطة سمت الرأس في نصف قطر الدائرة، ويُقسم على وتر اختلاف المنظر، فيخرج بالأجزاء بُعد القمر عن الأرض، مع إضافة دقيقة لكل درجة من وتر الارتفاع. {cite:zij-sabi-nallino-byblion p.128}."
  en: "The Moon's distance is computed by chords: the chord of its distance from the zenith point is multiplied by the radius of the circle and divided by the chord of the parallax, which gives the distance in parts, adding one minute for each degree of the chord of altitude. {cite:zij-sabi-nallino-byblion p.128}."
  ur: "چاند کا فاصلہ اوتار سے حساب ہوتا ہے: سمتِ راس کے نقطے سے اس کے فاصلے کا وتر دائرے کے نصف قطر سے ضرب دیا جاتا ہے اور اختلافِ منظر کے وتر پر تقسیم کیا جاتا ہے، تو اجزاء میں چاند کا زمین سے فاصلہ نکلتا ہے، ارتفاع کے وتر کی ہر درجے کے لیے ایک دقیقہ جمع کرتے ہوئے۔ {cite:zij-sabi-nallino-byblion p.128}۔"
  es: "La distancia a la Luna se calcula mediante cuerdas: la cuerda que representa su distancia al cenit se multiplica por el radio del círculo y se divide por la cuerda de la paralaje, lo que da como resultado la distancia en partes, sumando un minuto por cada grado de la cuerda de altitud. {cite:zij-sabi-nallino-byblion p.128}."
  fr: "La distance de la Lune est calculée par la méthode des cordes: la corde correspondant à sa distance au zénith est multipliée par le rayon du cercle et divisée par la corde de la parallaxe, ce qui donne la distance par segments, en ajoutant une minute pour chaque degré de la corde d'altitude. {cite:zij-sabi-nallino-byblion p.128}."
