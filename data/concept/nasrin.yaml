summary:
  ar: "النسرين في الكتاب كالياسمين في القوة وأضعف منه وكالنرجس، حار يابس في الثانية، كل أصنافه منق ملطف وزهره أخص بذلك، وينفع الأذن والأسنان والحلق والمعدة {cite:canon-ibn-sina-print-v1 p.576}."
  en: "Nasrin is in the book like jasmine in power but weaker, and like narcissus; hot and dry in the second degree, all its kinds cleansing and thinning, its flower more so, and it helps the ear, teeth, throat and stomach {cite:canon-ibn-sina-print-v1 p.576}."
  ur: "نسرین کتاب میں قوت میں چمبیلی جیسی مگر کمزور اور نرجس جیسی ہے؛ دوسرے درجے میں گرم خشک، اس کی سب قسمیں صاف کرنے اور لطیف کرنے والی ہیں اور پھول اس میں خاص ہے، اور کان، دانتوں، حلق اور معدے میں مفید ہے {cite:canon-ibn-sina-print-v1 p.576}۔"
