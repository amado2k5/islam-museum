label:
  ar: "بصل"
  en: "Basal (onion)"
  fr: "Basal (oignon)"
  ur: "پیاز"
  es: "Basal (cebolla)"
  tr: "soğan"
  id: "bawang bombay"
summary:
  ar: "معروف، فيه مع الحرافة المقطعة مرارة وقبض، وأحرّه ما كان أطول والأحمر أحرّ من الأبيض. حار في الثالثة، وفيه رطوبة فضلية، وفيه مع قبضه جلاء وتفتيح قوي ونفخ. ينفع ماؤه القروح الوسخة، وقطره في الأذن ينفع من الطنين، وهو مما يصدع إذا أُكثر منه، وماؤه يدر الطمث ويليّن الطبيعة، وهو مهيّج للباه، وينفع من عضة الكلب مع ملح وسذاب. {cite:canon-ibn-sina-print-v1 p.390}، {cite:canon-ibn-sina-print-v1 p.391}."
  en: "A well-known vegetable. Along with its cutting pungency it has bitterness and astringency; the longer kind is sharper, and the red is sharper than the white. Hot in the third degree, with a superfluous moisture. It gives wind but has a strong opening and cleansing power. Its water helps dirty ulcers, and drops in the ear help ringing and discharge. The book says its water promotes menses and loosens the bowels, that it stirs desire, and that it helps the bite of a mad dog with salt and rue {cite:canon-ibn-sina-print-v1 p.390}, {cite:canon-ibn-sina-print-v1 p.391}."
  fr: "Légume connu, à l’âcreté incisive jointe à l’amertume et à l’astringence ; l’allongé est plus âcre, le rouge davantage que le blanc. Chaud au troisième degré, avec une humidité excédentaire, il produit des vents mais possède un fort pouvoir désobstruant et nettoyant. Son eau serait utile aux ulcères sales et, en gouttes auriculaires, aux bourdonnements et écoulements. Le livre lui attribue l’apparition des règles, le relâchement intestinal, l’excitation du désir et une action contre la morsure de chien enragé avec sel et rue {cite:canon-ibn-sina-print-v1 p.390}, {cite:canon-ibn-sina-print-v1 p.391}."
  ur: "یہ معروف سبزی ہے۔ اس میں تیز چٹپٹاپن ہے، ساتھ ہی کڑواہٹ اور قبض بھی۔ جو لمبا ہو وہ زیادہ تیز ہے، اور سرخ سفید سے زیادہ تیز ہے۔ تیسرے درجے میں گرم، اور اس میں زائد رطوبت ہے۔ اس میں قبض کے ساتھ جلا اور کھولنے کی قوی قوت اور ہوا پیدا کرنے کی صفت ہے۔ اس کا پانی گندے زخموں میں نفع دیتا ہے، کان میں ٹپکانے سے سرکی بھاری پن، کان کی گونج اور پیپ میں نفع ہوتا ہے۔ کتاب کے مطابق اس کا پانی حیض جاری کرتا ہے اور پیٹ نرم کرتا ہے، شہوت بڑھاتا ہے، اور نمک اور سداب کے ساتھ کتے کے کاٹنے میں نفع دیتا ہے {cite:canon-ibn-sina-print-v1 p.390}، {cite:canon-ibn-sina-print-v1 p.391}۔"
  es: "Una verdura muy conocida. Además de su picor penetrante, tiene amargor y astringencia; la variedad más larga es más picante, y la roja más que la blanca. Caliente en tercer grado, con exceso de humedad. Produce gases, pero tiene un fuerte poder depurativo y limpiador. Su agua ayuda a las úlceras sucias, y las gotas en el oído alivian el zumbido y la secreción. El libro dice que su agua promueve la menstruación y ablanda los intestinos, que despierta el deseo y que ayuda a la mordedura de un perro rabioso con sal y ruda {cite:canon-ibn-sina-print-v1 p.390}, {cite:canon-ibn-sina-print-v1 p.391}."
  tr: "Kesintili sertlikle acı ve kramp yarattığı bilinmektedir; en sıcak olanı uzun olanıdır ve kırmızı beyazdan daha sıcaktır. Üçüncü mevsimde sıcaktır, fazla nem içerir ve sıkılığı güçlü bir şekilde temizlenir, hafifletir ve şişkinlik gösterir. Suyu kirli yaralar için faydalıdır, kulak çapı kulak çınlamasına yardımcı olur, daha sık gelirse çatlaklara neden olur, suyu adet dönemini tetikler ve doğayı yumuşatır, solgunları tahriş eder ve tuz ile kurumlu köpek ısırıklarından faydalıdır. {cite:canon-ibn-sina-print-v1 s.390}, {cite:canon-ibn-sina-print-v1 s.391}."
  id: "Diketahui bahwa dengan kekakuan terputus, menyebabkan rasa pahit dan kram; yang paling panas adalah yang lebih panjang, dan merah lebih panas daripada putih. Panas pada musim ketiga, mengandung kelembapan berlebih, dan dengan ketat, memiliki pemburuan yang kuat, pencerahan, dan kembung. Airnya bermanfaat untuk luka kotor, diameter telinganya membantu mengatasi tinnitus, menyebabkan retakan jika lebih sering, airnya memicu menstruasi dan melembutkan sifat, mengiritasi kulit pucat dan bermanfaat dari gigitan anjing dengan garam dan jelaga. {cite:canon-ibn-sina-print-v1 hlm.390}, {cite:canon-ibn-sina-print-v1 hlm.391}."
