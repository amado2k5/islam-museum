id: concept/nafaqat-al-aqarib
class: concept
kind: legal
label:
  ar: "نفقات الأقارب"
  en: "Maintenance of relatives (nafaqat al-aqarib)"
  es: "Manutención de familiares (nafaqat al-aqarib)"
  fr: "Entretien des proches (nafaqat al-aqarib)"
  ur: "رشتہ داروں کی کفالت ⁦(نفقات العقریب)⁩"
  tr: "Akraba giderleri"
  id: "Biaya kerabat"
summary:
  ar: "تقوم نفقة الأقارب في الإسلام على ثلاثة أسباب: الملك والنسب والزواج، وهي نفقة على الأشخاص لا على الأموال {cite:usul-iqtisad-islami-0660 p. 301}. وتشمل الحوائج الأصلية من غذاء ودواء وكساء وسكن وزواج، دون إسراف ولا تقتير {cite:usul-iqtisad-islami-0660 p. 302}، ويتعين مقدارها بالتراضي أو بحكم القضاء {cite:usul-iqtisad-islami-0660 p. 302}."
  tr: "İslam'da akrabaları desteklemek üç nedene dayanır: mülkiyet, soy ve evlilik. Bu, bireylere verilen geçimdir, para üzerinden değil {cite:usul-iqtisad-islami-0660 s. 301}. Giyecek, ilaç, giysi, barınak ve evlilik gibi temel ihtiyaçları savurganlık veya cimrilik olmadan içerir {cite:usul-iqtisad-islami-0660 s. 302} ve miktarı kararlaştırılmalı veya yargı kararıyla belirlenmelidir {cite:usul-iqtisad-islami-0660 s. 302}."
  id: "Mendukung kerabat dalam Islam didasarkan pada tiga alasan: kepemilikan, garis keturunan, dan pernikahan. Ini adalah tunjangan individu, bukan uang {cite:usul-iqtisad-islami-0660 hlm. 301}. Ini mencakup kebutuhan pokok seperti makanan, obat-obatan, pakaian, tempat tinggal, dan pernikahan, tanpa boros atau kekikiran {cite:usul-iqtisad-islami-0660 hlm. 302}, dan jumlahnya harus disepakati atau melalui putusan yudisial {cite:usul-iqtisad-islami-0660 hlm. 302}."
