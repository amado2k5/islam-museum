label: { ar: "جداول اختلاف المنظر لسبعة أقاليم بتفاضل نصف ساعة", en: "The parallax tables for seven climes in half-hour steps", ur: "سات اقالیم کے اختلافِ منظر کے جداول، نصف گھنٹے کے فرق سے", es: "Tablas de paralaje para siete climas en intervalos de media hora.", fr: "Tableaux de parallaxe pour sept climats par intervalles de trente minutes", tr: "Yarım saatlik zaman farkıyla yedi bölge için paralellik tabloları", id: "Tabel paralelisme untuk tujuh wilayah dengan perbedaan setengah jam." }
summary:
  ar: "يذكر البتاني أن جداول اختلاف المنظر في الطول والعرض وضعها عالم من الإسكندرية، جعل اختلاف منظر القمر في سبعة أقاليم على تفاضل نصف ساعة في أطول النهار الأول، ورسمه لكون القمر في رؤوس البروج بعد نقص اختلاف منظر الشمس. {cite:zij-sabi-nallino-byblion p.124}."
  en: "Al-Battani says the tables of parallax in longitude and latitude were set up by an astronomer of Alexandria, who gave the Moon's parallax for seven climes in steps of half an hour of the longest day, drawn for the Moon at the heads of the signs after the Sun's parallax was subtracted. {cite:zij-sabi-nallino-byblion p.124}."
  ur: "البتانی کہتے ہیں کہ اختلافِ منظر کے طول اور عرض کے جداول اسکندریہ کے ایک عالم نے وضع کیے، جنہوں نے سات اقالیم میں چاند کا اختلافِ منظر سب سے لمبے دن کے نصف گھنٹے کے فرق سے دیا، اور اسے چاند کے بروج کے سروں پر ہونے کی صورت میں سورج کا اختلافِ منظر گھٹانے کے بعد لکھا۔ {cite:zij-sabi-nallino-byblion p.124}۔"
  es: "Al-Battani afirma que las tablas de paralaje en longitud y latitud fueron establecidas por un astrónomo de Alejandría, quien proporcionó el paralaje de la Luna para siete climas en intervalos de media hora del día más largo, trazado para la Luna en las cabezas de los signos después de restar el paralaje del Sol. {cite:zij-sabi-nallino-byblion p.124}."
  fr: "Al-Battani affirme que les tables de parallaxe en longitude et latitude ont été établies par un astronome d'Alexandrie, qui a donné la parallaxe de la Lune pour sept climats par incréments d'une demi-heure du jour le plus long, tracée pour la Lune en tête des signes après soustraction de la parallaxe du Soleil. {cite:zij-sabi-nallino-byblion p.124}."
  tr: "Al-Battani, boylam ve enlemdeki paralaks değişim tablolarının, İskenderiyeli bir bilgin tarafından derlendiğini, bu bilginin ilk günün en uzun günündeki yarım saatlik farka dayanarak yedi bölgedeki paralaks değişimini hesapladığını ve güneşin paralaks değişiminin azalmasından sonra zodyakın başlangıcındaki ayın konumuna göre bunu çizdiğini belirtir. {cite:zij-sabi-nallino-byblion s.124}."
  id: "Al-Battani menyebutkan bahwa tabel variasi paralaks dalam garis bujur dan garis lintang disusun oleh seorang sarjana dari Alexandria, yang menghitung variasi paralaks di tujuh wilayah berdasarkan perbedaan setengah jam pada hari terpanjang di hari pertama, dan memplotnya sesuai dengan posisi bulan di awal zodiak setelah variasi paralaks matahari berkurang. {cite:zij-sabi-nallino-byblion p.124}."
