summary:
  ar: "الجهاز في اللغة ما يحتاج إليه الغازي والمسافر، وما تُزف به المرأة إلى زوجها. وفي الفقه تجهيز الغزاة المثبتين في الديوان واجب على المسلمين من بيت المال، وتملك المرأة جهازها وحدها، ولا يجب عليها أن تتجهز بمهرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6625}"
  en: "Jihaz in the language is what a fighter or traveller needs, and what a bride takes to her husband. In fiqh, equipping the registered fighters is an obligation on the Muslims through the public treasury. The bride owns her own trousseau, and jurists generally hold that she is not obliged to furnish it from her dower. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6625}"
