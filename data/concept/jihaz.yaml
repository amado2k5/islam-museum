label: { ar: "الجهاز", en: "Jihaz (equipment of the fighter, the traveller or the bride)", ur: "جہاز", es: "Jihaz (equipo del combatiente, del viajero o de la novia)", fr: "Jihaz (équipement du combattant, du voyageur ou de la mariée)" }
summary:
  ar: "الجهاز في اللغة ما يحتاج إليه الغازي والمسافر، وما تُزف به المرأة إلى زوجها. وفي الفقه تجهيز الغزاة المثبتين في الديوان واجب على المسلمين من بيت المال، وتملك المرأة جهازها وحدها، ولا يجب عليها أن تتجهز بمهرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6625}"
  en: "Jihaz in the language is what a fighter or traveller needs, and what a bride takes to her husband. In fiqh, equipping the registered fighters is an obligation on the Muslims through the public treasury. The bride owns her own trousseau, and jurists generally hold that she is not obliged to furnish it from her dower. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6625}"
  es: "En el idioma kuwaití, el yihaz se refiere a lo que necesita un combatiente o viajero, y a lo que una novia lleva a su esposo. En el fiqh (jurisprudencia islámica), equipar a los combatientes registrados es una obligación para los musulmanes a través del tesoro público. La novia posee su propio ajuar, y los juristas generalmente sostienen que no está obligada a proveerlo con su dote. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6625}"
  fr: "Le terme « jihaz » désigne ce dont un combattant ou un voyageur a besoin, et ce qu'une épouse apporte à son mari. En droit musulman (fiqh), l'équipement des combattants enregistrés est une obligation pour les musulmans, financée par les fonds publics. La mariée possède son propre trousseau, et les juristes estiment généralement qu'elle n'est pas tenue de le constituer à partir de sa dot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6625}"
  ur: "زبان میں جہاد وہ ہے جو ایک لڑاکا یا مسافر کی ضرورت ہے، اور دلہن اپنے شوہر کے پاس کیا لے کر جاتی ہے۔ فقہ میں رجسٹرڈ جنگجوؤں کو مسلح کرنا مسلمانوں پر سرکاری خزانے سے فرض ہے۔ دلہن کا اپنا ٹراؤساؤ ہے، اور فقہاء کا عام طور پر خیال ہے کہ وہ اسے اپنے مہر سے دینے کی پابند نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6624} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6625}"
