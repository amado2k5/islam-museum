label: { ar: "أحكام الحج", en: "Rulings on the hajj", ur: "حج کے احکام", es: "Normas sobre el Hajj", fr: "Décisions relatives au hajj", tr: "Hac Kararları", id: "Putusan Haji" }
summary:
  ar: "الحج في اصطلاح الشرع قصد البيت الحرام وعرفة في وقت مخصوص، وهي أشهر الحج، للقيام بأعمال مخصوصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6836} وهو فرض عين على كل مكلف مستطيع مرة في العمر، ثبتت فرضيته بالكتاب والسنة والإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} واختلفوا في وجوبه على الفور أو التراخي، فأبو حنيفة في أصح الروايتين وأبو يوسف ومالك في الراجح عنه وأحمد يرون الفورية، والشافعي ومحمد بن الحسن يرون التراخي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} وفضل الحج عظيم بنصوص كثيرة، منها ما ورد أن الحج المبرور ليس له جزاء إلا الجنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6839} وشروط الوجوب خمسة متفق عليها: الإسلام والعقل والبلوغ والحرية والاستطاعة، ويبطل حج المجنون، ويصح حج الصبي تطوعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} والاستطاعة العامة أربع خصال: القدرة على الزاد والراحلة، وصحة البدن، وأمن الطريق، وإمكان السير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} والجمهور يشترطون الزاد والراحلة، وخالف المالكية فاكتفوا بالقدرة على المشي مع الزاد لمن كان صحيح البدن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} ويشترط الجمهور أن يملك الزاد والراحلة فاضلين عن الحاجة الأصلية كالنفقة على العيال والمسكن وأثاث البيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6844}"
  en: "Hajj, in the sacred sense, is the purposeful journey to the Sacred House and to Arafat in the months of hajj to perform set acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6836} It is an individual obligation on every adult who is able, once in a lifetime, established by the Qur'an, the Sunna and consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} On whether it must be performed at once or may be delayed, Abu Hanifa (in the sounder of his two reports), Abu Yusuf, Malik (in the preferred view) and Ahmad hold that it is immediate, while al-Shafi'i and Muhammad ibn al-Hasan hold that it may be delayed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} The texts praise the merit of the hajj at length, including the report that a hajj accepted has no reward but paradise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6839} Five conditions of obligation are agreed: Islam, reason, puberty, freedom and capacity. The hajj of a madman is not valid; a child's hajj counts as a voluntary one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} General capacity has four elements: provision and a mount, bodily health, safety of the road, and the possibility of travel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} The majority require provision and a mount, while the Malikis accept the ability to walk with provision for a person in good health. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} The majority also require that the provision and mount be owned beyond the basic needs, such as maintenance of dependants, housing and household goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6844}"
  es: "El Hajj, en el sentido sagrado, es el viaje con propósito a la Casa Sagrada y a Arafat en los meses del Hajj para realizar actos prescritos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6836} Es una obligación individual para todo adulto que pueda realizarla una vez en la vida, establecida por el Corán, la Sunna y el consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} Sobre si debe realizarse de inmediato o puede posponerse, Abu Hanifa (en el más sólido de sus dos relatos), Abu Yusuf, Malik (en la opinión preferida) y Ahmad sostienen que es inmediato, mientras que al-Shafi'i y Muhammad ibn al-Hasan sostienen que puede posponerse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} Los textos elogian extensamente el mérito del hajj, incluido el informe de que un hajj aceptado no tiene otra recompensa que el paraíso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6839} Se acuerdan cinco condiciones de obligación: Islam, razón, pubertad, libertad y capacidad. El hajj de un loco no es válido; el hajj de un niño cuenta como voluntario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} La capacidad general tiene cuatro elementos: provisión y montura, salud corporal, seguridad del camino y posibilidad de viajar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} La mayoría requiere provisión y montura, mientras que los malikíes aceptan la capacidad de caminar con provisión para una persona con buena salud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} La mayoría también requiere que la provisión y la montura sean propias más allá de las necesidades básicas, como el mantenimiento de dependientes, vivienda y artículos del hogar. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6843} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6844}"
  fr: "Le Hajj, au sens sacré, est le pèlerinage à la Maison Sacrée et à Arafat durant les mois du Hajj, afin d'y accomplir des actes prescrits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6836} Il s'agit d'une obligation individuelle pour tout adulte capable, à accomplir une fois dans sa vie, établie par le Coran, la Sunna et le consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} Quant à savoir s'il doit être accompli immédiatement ou s'il peut être différé, Abu Hanifa (dans le plus fiable de ses deux hadiths), Abu Yusuf, Malik (dans l'avis préférentiel) et Ahmad estiment qu'il doit être accompli immédiatement, tandis qu'al-Shafi'i et Muhammad ibn al-Hasan estiment qu'il peut être différé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} Les textes louent longuement le mérite du hajj, y compris le rapport selon lequel un hajj accepté n'a d'autre récompense que le paradis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6839} Cinq conditions d'obligation sont convenues: l'Islam, la raison, la puberté, la liberté et la capacité. Le hajj d’un fou n’est pas valable; le hajj d'un enfant est considéré comme volontaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} La capacité générale comprend quatre éléments: des provisions et un moyen de transport, la santé physique, la sécurité des routes et la possibilité de voyager. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} La majorité exige des provisions et un moyen de transport, tandis que les Malikites admettent la capacité de se déplacer à pied avec des provisions pour une personne en bonne santé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} La majorité exige également que les provisions et le moyen de transport comprennent des biens autres que ceux nécessaires aux besoins fondamentaux, tels que l’entretien des personnes à charge, le logement et les biens ménagers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6844}"
  ur: "حج، مقدس معنوں میں، مقررہ اعمال کی انجام دہی کے لیے حج کے مہینوں میں بیت اللہ اور عرفات کا بامقصد سفر ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6836} یہ ہر بالغ شخص پر انفرادی ذمہ داری ہے جو زندگی میں ایک بار قرآن، سنت اور اجماع سے ثابت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6837} اس بارے میں کہ آیا اسے ایک ہی وقت میں کرنا ضروری ہے یا تاخیر سے، ابو حنیفہ ⁦(اپنی دو روایتوں کے مطابق)⁩، ابو یوسف، مالک ⁦(ترجیحی خیال میں)⁩ اور احمد کا کہنا ہے کہ یہ فوری ہے، جبکہ شافعی اور محمد الحسن نے اسے صحیح کہا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6837} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6838} نصوص میں حج کی فضیلت کی تعریف کی گئی ہے، جس میں یہ رپورٹ بھی شامل ہے کہ قبول شدہ حج کا بدلہ جنت کے سوا کوئی نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6838} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6839} فرض کی پانچ شرطیں متفق ہیں: اسلام، عقل، بلوغت، آزادی اور استطاعت۔ دیوانے کا حج صحیح نہیں ہے۔ بچے کا حج رضاکارانہ کے طور پر شمار ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6840} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6841} عمومی صلاحیت کے چار عناصر ہیں: رزق اور سواری، جسمانی صحت، سڑک کی حفاظت، اور سفر کا امکان۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6841} اکثریت کو رزق اور سواری کی ضرورت ہے، جب کہ مالکی صحت مند شخص کے لیے رزق کے ساتھ چلنے کی صلاحیت کو قبول کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6841} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6842} اکثریت کا یہ بھی تقاضا ہے کہ رزق اور سواری بنیادی ضروریات سے ہٹ کر ملکیت میں ہو، جیسے کہ کفیلوں کی دیکھ بھال، رہائش اور اچھے گھر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6842} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6843}"
  tr: "İslami terminolojide Hac, Kutsal Ev ve Arafa'yı belirli bir zamanda ifade eder; bu, en popüler Hac ayinidir ve belirli eylemleri gerçekleştirmek için kullanılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6836} Bu, her yetenekli kişinin hayatında bir kez üstlendiği özel bir yükümlülüktür; Kur'an, Sünnet ve uzlaşma ile belirlenmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6837} Hemen zorunlu mu yoksa gevşek mi olduğu konusunda farklı görüşler yaşadılar. En gerçek rivayetlerde Ebu Hanifa, daha doğru versiyonda Ebu Yusuf ve Malik, Ahmed bunu anlık olarak kabul eder, Şafii ve Muhammed ibn al-Hasan ise gevşek sayar. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.6837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6838} Hac erdemi birçok metinde büyüktür, kabul edilen bir Hacın ödülü sadece cennet olduğunu söyleyenler de dahil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6839} Zorunluluk koşulları beş üzerinde anlaşılmıştır: İslam, akıl, ergenlik, özgürlük ve yetenek. Akıl hastalarının hac yolculuğu geçersiz sayılır ve bir çocuğun hacı gönüllü olarak geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6841} Genel yeteneğin dört özelliği vardır: erzak ve binek sahibi olabilme, fiziksel sağlık, yol güvenliği ve yürüyebilme yeteneği. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6841} Çoğunluğu erzak ve binme gerektirir, ancak Malikilerden farklı olarak, sağlıklı bedenli olanların erzakla yürüme yeteneğini sınırlarlarıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6842} Çoğunluk, çocukların bakımı, barınma ve ev mobilyaları gibi orijinal ihtiyaçlara bırakılan erzak ve bineklere sahip olmak zorundadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6842}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6844}"
  id: "Haji, dalam istilah Islam, merujuk pada Rumah Suci dan Arafah pada waktu tertentu, yang merupakan Haji paling populer, untuk melakukan tindakan tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6836} Ini adalah kewajiban khusus bagi setiap orang yang mampu sekali seumur hidup, ditetapkan oleh Al-Qur'an, Sunnah, dan konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6837} Mereka berbeda pendapat apakah itu wajib segera atau longgar. Abu Hanifa dalam narasi paling otentik, Abu Yusuf dan Malik dalam versi yang lebih benar, Ahmad menganggapnya langsung, dan Shafi'i serta Muhammad ibn al-Hasan menganggapnya kelonggaran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6838} Kebajikan Haji sangat besar dalam banyak teks, termasuk yang mengatakan Haji yang diterima tidak memiliki ganjaran kecuali Surga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6839} Syarat kewajiban adalah lima yang disepakati: Islam, intelek, pubertas, kebebasan, dan kemampuan. Haji orang gila tidak sah, dan Haji anak sah secara sukarela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6841} Kemampuan umum memiliki empat kualitas: kemampuan membawa persediaan dan tunggangan, kesehatan fisik, keselamatan jalan, dan kemampuan berjalan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6841} Mayoritas membutuhkan persediaan dan tunggangan, tetapi mereka berbeda dari Malikis dengan membatasi kemampuan berjalan dengan persediaan bagi mereka yang sehat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6842} Mayoritas harus memiliki persediaan dan tunggangan yang dibiarkan sesuai kebutuhan awal, seperti perawatan anak-anak, tempat tinggal, dan perabotan rumah tangga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6842} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6844}"
