label: { ar: "أحكام الحج", en: "Rulings on the hajj", ur: "حج کے احکام" }
summary:
  ar: "الحج في اصطلاح الشرع قصد البيت الحرام وعرفة في وقت مخصوص، وهي أشهر الحج، للقيام بأعمال مخصوصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6836} وهو فرض عين على كل مكلف مستطيع مرة في العمر، ثبتت فرضيته بالكتاب والسنة والإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} واختلفوا في وجوبه على الفور أو التراخي، فأبو حنيفة في أصح الروايتين وأبو يوسف ومالك في الراجح عنه وأحمد يرون الفورية، والشافعي ومحمد بن الحسن يرون التراخي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} وفضل الحج عظيم بنصوص كثيرة، منها ما ورد أن الحج المبرور ليس له جزاء إلا الجنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6839} وشروط الوجوب خمسة متفق عليها: الإسلام والعقل والبلوغ والحرية والاستطاعة، ويبطل حج المجنون، ويصح حج الصبي تطوعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} والاستطاعة العامة أربع خصال: القدرة على الزاد والراحلة، وصحة البدن، وأمن الطريق، وإمكان السير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} والجمهور يشترطون الزاد والراحلة، وخالف المالكية فاكتفوا بالقدرة على المشي مع الزاد لمن كان صحيح البدن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} ويشترط الجمهور أن يملك الزاد والراحلة فاضلين عن الحاجة الأصلية كالنفقة على العيال والمسكن وأثاث البيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6844}"
  en: "Hajj, in the sacred sense, is the purposeful journey to the Sacred House and to Arafat in the months of hajj to perform set acts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6836} It is an individual obligation on every adult who is able, once in a lifetime, established by the Qur'an, the Sunna and consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} On whether it must be performed at once or may be delayed, Abu Hanifa (in the sounder of his two reports), Abu Yusuf, Malik (in the preferred view) and Ahmad hold that it is immediate, while al-Shafi'i and Muhammad ibn al-Hasan hold that it may be delayed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} The texts praise the merit of the hajj at length, including the report that a hajj accepted has no reward but paradise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6839} Five conditions of obligation are agreed: Islam, reason, puberty, freedom and capacity. The hajj of a madman is not valid; a child's hajj counts as a voluntary one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6840} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} General capacity has four elements: provision and a mount, bodily health, safety of the road, and the possibility of travel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} The majority require provision and a mount, while the Malikis accept the ability to walk with provision for a person in good health. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} The majority also require that the provision and mount be owned beyond the basic needs, such as maintenance of dependants, housing and household goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6842} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6844}"
