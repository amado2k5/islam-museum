id: concept/salawat-min-allah
class: concept
kind: doctrine
label:
  ar: "الصلاة من الله والملائكة والمؤمنين"
  en: "Blessing from God, the angels and believers (salawat)"
summary:
  ar: "يرى الشعراوي أن الصلاة في اللغة الدعاء، وأن صلاة الله على عباده رحمة وبركة، وصلاة الملائكة استغفار، وصلاة المؤمنين دعاء، وأن الدعاء للنبي عائد على الأمة لأن منزلته لها. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.665}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.666}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.667}"
  en: "Sha'rawi holds that salat means supplication in the language, that God's blessing on His servants is mercy and grace, that the angels' blessing is forgiveness, and that believers' blessing is supplication; he holds that prayer for the Prophet returns to the community because his station is theirs {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.665}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.666}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.667}."
wings: [ideas]
themes: [creed, worship-and-the-pillars]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "ما معنى الصلاة من الله ومن الملائكة ومن المؤمنين، وكيف يعود الدعاء للنبي على الدَّاعي؟"
  en: "What is meant by blessing from God, from the angels and from believers, and how does prayer for the Prophet return to the one who prays?"
perspectives:
  - tradition: sunni
    id: sharawi-three-salawat
    stance:
      ar: "صلاة الله رحمة وبركة، والملائكة استغفار، والمؤمنين دعاء، والدعاء للنبي يعود نفعه على الأمة"
      en: "God's blessing is mercy and grace, the angels' is forgiveness, believers' is supplication, and prayer for the Prophet benefits the community"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الصلاة من الله عطاء الرحمة والبركة، ومن الملائكة استغفار، ومن المؤمنين دعاء، وإن منزلة النبي عند الله تعود على أمته، وإن الصلاة عليه تعود على المصلي. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.666}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.667}"
      en: "Sha'rawi says that God's blessing is the gift of mercy and grace, the angels' is forgiveness, believers' is supplication; that the Prophet's rank with God returns to his community; and that blessing him returns to the one who blesses {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.666}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.667}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-hadith-counts
    stance:
      ar: "الأحاديث في عدد الصلوات على النبي وثوابها لم تُراجع أصولها هنا"
      en: "The hadiths on the number of blessings on the Prophet and their reward were not checked against their originals here"
    holders: []
    summary:
      ar: "يذكر الشعراوي في النص أن صلاة واحدة على النبي يصلي الله بها عشراً دون ذكر مصدر في النص، ولم تُراجع. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.667}"
      en: "Sha'rawi states in the text that one blessing on the Prophet brings God's blessing ten times, without naming a source; this was not checked {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.667}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
