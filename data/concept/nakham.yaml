summary:
  ar: "نحم في الكتاب مدخل قصير يلزق الجراحات الدامية، وطبيخه يخرج الحصاة، وبزره يدر البول ويعقل، والنبات غير محدد {cite:canon-ibn-sina-print-v1 p.582}."
  en: "Nakham is in the book a short entry: it joins bleeding wounds, its decoction expels the stone, and its seed provokes urine and restrains the bowels; the plant is not identified {cite:canon-ibn-sina-print-v1 p.582}."
  ur: "نحم کتاب میں ایک مختصر اندراج ہے: خون بہتے زخموں کو جوڑتا ہے، اس کا جوشاندہ پتھری نکالتا ہے، اور اس کا بیج پیشاب لاتا اور پیٹ روکتا ہے؛ پودا متعین نہیں {cite:canon-ibn-sina-print-v1 p.582}۔"
  es: "Nakham es una breve entrada en el libro: cierra heridas sangrantes, su decocción expulsa los cálculos y su semilla provoca la micción y retiene los intestinos; la planta no está identificada {cite:canon-ibn-sina-print-v1 p.582}."
  fr: "Nakham est mentionné brièvement dans le livre: il joint les plaies saignantes, sa décoction expulse la pierre et sa graine provoque l'urine et retient les intestins; la plante n'est pas identifiée {cite:canon-ibn-sina-print-v1 p.582}."
