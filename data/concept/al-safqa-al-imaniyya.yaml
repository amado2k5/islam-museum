id: concept/al-safqa-al-imaniyya
class: concept
kind: ethical
label:
  ar: "الصفقة الإيمانية"
  en: "The transaction of faith"
  ur: "ایمان کا سودا"
summary:
  ar: "يرى الشعراوي أن الله يستعمل لغة التجارة في القرآن ليبين أن الإيمان صفقة رابحة، وأن من يبيع آيات الله بثمن زهيد قلب الصفقة، وأن المال خادم لا سيد، وأن الربا يفسد المجتمع لأنه يجعل المال سلعة يزيد بغير عمل {cite:tafsir-sharawi-khawatir-scan p.295} {cite:tafsir-sharawi-khawatir-scan p.296} {cite:tafsir-sharawi-khawatir-scan p.297} {cite:tafsir-sharawi-khawatir-scan p.298}."
  en: "Sha'rawi holds that the Qur'an uses the language of trade to show that faith is a profitable exchange; that whoever sells God's signs for a small price reverses the transaction; that wealth is a servant rather than a master; and that usury corrupts society because it makes money a commodity that grows without work {cite:tafsir-sharawi-khawatir-scan p.295} {cite:tafsir-sharawi-khawatir-scan p.296} {cite:tafsir-sharawi-khawatir-scan p.297} {cite:tafsir-sharawi-khawatir-scan p.298}."
  ur: "شعراوی کے نزدیک قرآن تجارت کی زبان استعمال کرتا ہے تاکہ دکھائے کہ ایمان نفع بخش سودا ہے، اور جو اللہ کی آیات کو تھوڑی قیمت پر بیچ دے وہ سودا الٹ دیتا ہے۔ ان کے نزدیک مال خادم ہے نہ کہ آقا، اور سود معاشرے کو بگاڑتا ہے کیونکہ وہ مال کو کام کے بغیر بڑھنے والی جنس بنا دیتا ہے {cite:tafsir-sharawi-khawatir-scan p.295} {cite:tafsir-sharawi-khawatir-scan p.296} {cite:tafsir-sharawi-khawatir-scan p.297} {cite:tafsir-sharawi-khawatir-scan p.298}۔"
wings: [ideas]
