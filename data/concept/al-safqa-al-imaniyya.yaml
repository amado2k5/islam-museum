    id: academic
    stance:
      ar: "دراسات الاقتصاد الإسلامي والربا لم تُضف بعد"
      en: "Studies of Islamic economics and usury are not yet added"
    summary:
      ar: "لم تُعرض في هذه الصفحات دراسة اقتصادية للربا، والمثال الذي يضربه الشعراوي عن الديون الدولية لم يُراجع. تحتاج هذه المسألة إلى مراجع اقتصادية وفقهية محددة."
      en: "No economic study of usury is set out in these pages; the example he gives about international debt has not been checked. The question needs named economic and juristic sources."
