issue:
  ar: "هل الربا في تفسير الشعراوي مجرد حكم، أم له أثر اقتصادي يفسد المجتمع؟"
  en: "In Sha'rawi's tafsir, is usury only a ruling, or does it have an economic effect that corrupts society?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "المال خادم، والربا يفسد المجتمع بجعل المال سلعة تزيد بغير عمل"
      en: "Money is a servant, and usury corrupts society by making money a commodity that grows without work"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن المال عبد مخلص لمن ينفقه، وأن الربا يجعل المال سلعة فيزيد الفقير فقرا والغني غنى، ويضرب مثل الدول المدينة {cite:tafsir-sharawi-khawatir-scan p.297} {cite:tafsir-sharawi-khawatir-scan p.298}. هذا تقدير اقتصادي من صاحبه ولم يُراجع بمصادر الاقتصاد."
      en: "Sha'rawi holds that money is a loyal servant to the one who spends it, and that usury makes money a commodity so that the poor grow poorer and the rich richer; he gives the example of indebted countries {cite:tafsir-sharawi-khawatir-scan p.297} {cite:tafsir-sharawi-khawatir-scan p.298}. This is his economic assessment and has not been checked against economic sources."
    sources: [source/tafsir-sharawi-khawatir-scan]
