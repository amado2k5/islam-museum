id: concept/public-and-secret-charity
class: concept
kind: belief
label: { ar: "الصدقة علانية وسراً", en: "Public and secret charity", ur: "علانیہ اور خفیہ صدقہ" }
summary:
  ar: "يرى الشعراوي أن إظهار الصدقة للغني يحمي عرضه من ألسنة الناس، وأن إخفاءها أفضل للفقير، وأن الله يعلم نية المعطي في الحالين، وأن الصدقة المفروضة علانيتها أفضل من سرها عند بعض الروايات المنقولة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1167} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1172}."
  en: "Sha'rawi holds that a wealthy person should give openly, to protect his honour from people's talk, while concealment suits one who is not visibly wealthy. God knows the intention in both cases. He cites reports on the relative merit of public and secret giving {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1167} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1172}."
  ur: "شعراوی کے نزدیک مالدار کا علانیہ دینا اس کی عزت کو لوگوں کی زبان سے بچاتا ہے، اور جس کی مالداری ظاہر نہ ہو اس کے لیے خفیہ دینا بہتر ہے۔ دونوں صورتوں میں اللہ نیت کو جانتا ہے۔ وہ کچھ روایات بھی نقل کرتے ہیں جو علانیہ اور خفیہ صدقے کی فضیلت سے متعلق ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1167} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1172}۔"
