label:
  ar: "محبة النبي للكون"
  en: "The Prophet's love for all creation"
  ur: "نبی کی کائنات سے محبت"
summary:
  ar: "يدعو الشيخ عمر عبد الكافي إلى التأسي بما كان النبي يحبه في أقواله وأفعاله، ويصف تفاعله مع الكون كله، ويروي قصة حنين جذع النخلة، ويذكر ما كان يسمّيه من أشياء بيته، ويشرح الوزر الذي وُضع عنه {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep02 00:01:00}."
  en: "Sheikh Omar Abdelkafy calls for emulating what the Prophet loved in his words and deeds, describes his engagement with the whole of creation, recounts the story of the palm trunk, mentions the names he gave the things in his house, and explains the burden that was lifted from him {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep02 00:01:00}."
  ur: "شیخ عمر عبدالکافی نبی کے اقوال و افعال میں جو کچھ ان کو پسند تھا اس کی پیروی کی دعوت دیتے ہیں، کائنات کے ساتھ ان کے تعلق کا ذکر کرتے ہیں، کھجور کے تنے کا واقعہ بیان کرتے ہیں، گھر کی چیزوں کے نام کا ذکر کرتے ہیں، اور وہ بوجھ واضح کرتے ہیں جو ان سے اتارا گیا {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep02 00:01:00}۔"
