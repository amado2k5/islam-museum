id: concept/tacleel-rationale-of-rulings
class: concept
kind: legal
label:
  ar: التعليل
  en: Ta'lil (giving reasons for rulings)
  ur: تعلیل (احکام کی علت بیان کرنا)
summary:
  ar: 'التعليل في الاصطلاح هو تقرير ثبوت المؤثر لإثبات الأثر، أو إظهار علّيّة الشيء، وهو الباعث على تشريع الحكم أو المصلحة التي من أجلها شرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5482} الأصل في أحكام العبادات عدم التعليل لأنها قائمة على التعبد، والأصل في المعاملات والعادات والجنايات أن تكون معللة لأنها مبنية على مصالح العباد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} وللتعليل فوائد منها تعريف الأحكام وإظهارها ليسهل التزامها، وقبولها بالاطمئنان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} واختلف الأصوليون في تعليل النصوص على أربعة اتجاهات: أن الأصل عدم التعليل، أو التعليل بكل وصف صالح، أو التعليل بوصف مع دليل يميزه، أو أن الأصل التعبد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} ومسالك العلة: النص الصريح، والإجماع، والإيماء والتنبيه، والسبر والتقسيم، والمناسبة والشبه والطرد، وتنقيح المناط وتحقيقه والدوران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5484} والحديث المعلل هو ما اطلع فيه على علة تقدح في صحته مع ظاهر السلامة منها، وهو من أنواع الحديث الضعيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5484}'
  en: 'Ta''lil, in the technical sense, is establishing that a cause is effective in order to prove its effect, or showing that a thing is a cause; it is the motive for legislating a ruling or the interest for which it was set. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5482} Worship rulings are presumed not to have a stated rationale, because they rest on pure devotion; transactions, customs and offences are presumed to have one, because they serve the interests of people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} Stating the rationale helps people know and keep the rulings, and makes them more accepted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} The usuliyyun divided on whether texts have stated reasons into four views: the default is no reason unless shown; the default is any suitable attribute; the default is an attribute with a test to choose the suitable ones; or the texts are devotional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} The paths to a cause are the explicit text, consensus, implication and allusion, division and examination, suitability, resemblance and concomitance, the refinement and verification of the ground, and concomitance of presence and absence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5484} A defective hadith is one in which a cause has been found that impairs its soundness although it appears sound; it is a kind of weak hadith. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5484}'
  ur: 'تعلیل اصطلاح میں کسی مؤثر کے ثبوت کو اثر کے ثبوت کے لیے ثابت کرنا، یا کسی چیز کی علت ظاہر کرنا ہے، یعنی وہ محرک یا مصلحت جس کی بنا پر حکم مشروع ہوا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5482} عبادات کے احکام میں اصل عدم تعلیل ہے کیونکہ وہ تعبد پر مبنی ہیں، اور معاملات، عادات اور جنایات میں اصل تعلیل ہے کیونکہ وہ بندوں کی مصلحتوں پر مبنی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} تعلیل کا فائدہ یہ ہے کہ احکام واضح ہوں اور ان کی پابندی آسان ہو، اور وہ زیادہ قابل قبول اور مطمئن کن ہوں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} نصوص کی تعلیل میں اصولیین کی چار آرا ہیں: اصل عدم تعلیل ہے، یا ہر مناسب وصف سے تعلیل ہو سکتی ہے، یا وصف سے تعلیل ہو مگر دلیل سے مناسب وصف متعین کیا جائے، یا نصوص تعبدی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} مسالکِ علت میں صریح نص، اجماع، ایماء و تنبیہ، سبر و تقسیم، مناسبت و شبہ و طرد، اور تنقیح و تحقیق مناط اور دوران شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5483} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5484} معلل حدیث وہ ہے جس میں ایسی علت معلوم ہو جو اس کی صحت پر اثر انداز ہو، حالانکہ ظاہری طور پر وہ سالم معلوم ہوتی ہو؛ یہ ضعیف حدیث کی ایک قسم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5484}'
