label:
  ar: "أيام العجوز"
  en: "The days of the old woman"
  fr: "Les jours de la vieille"
summary:
  ar: "سبعة أيام تسقط فيها الجمر في آخر شباط وأول آذار، تسميها العرب صناً وصنبراً ووبراً وآمراً ومؤتمراً ومعللاً ومطفئ الجمر، وهي آخر أيام شديدة البرد قبل تحول السنة بحلول الشمس الحمل في النصف من آذار {cite:muruj-al-dhahab p. 506}."
  en: "The seven bitter days at February's end — Sinn, Sinabbar, Wabr, Amir, Mu'tamir, Mu'allal and Mutfi' al-Jamr in the Arabs' naming — closing winter before the sun enters Aries {cite:muruj-al-dhahab p. 506}."
  fr: "Les sept jours rigoureux de la fin de février — Sinn, Sinabbar, Wabr, Amir, Mu'tamir, Mu'allal et Mutfi' al-Jamr dans la dénomination arabe — achèvent l’hiver avant l’entrée du soleil dans le Bélier {cite:muruj-al-dhahab p. 506}."
