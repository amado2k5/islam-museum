label: { ar: "حيازة أمكنة السوق", en: "Market-Place Preemption" }
summary:
  ar: "عند البلاذري: خرج علي إلى السوق فرأى أهله قد حازوا أمكنتهم فقال ليس ذلك لهم إن سوق المسلمين كمصلاهم من سبق إلى موضع فهو له يومه حتى يدعه وكانوا في زمن المغيرة بن شعبة يعدون إلى السوق فمن قعد في موضع كان أحق به إلى الليل فلما كان زياد قال من قعد في موضع كان أحق به ما دام فيه."
  en: "In al-Baladhuri: Ali went out to the market, saw its people had seized their places, and said 'that is not theirs — the Muslims' market is like their prayer-place: whoever first reaches a spot holds it for his day until he leaves it'; under al-Mughira ibn Shu'ba they raced to the market, first-sitter holding his spot till nightfall, and Ziyad ruled the sitter keeps it while he remains."
