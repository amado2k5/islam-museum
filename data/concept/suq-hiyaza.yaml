id: concept/suq-hiyaza
class: concept
kind: legal
label: { ar: "حيازة أمكنة السوق", en: "Market-Place Preemption", es: "Preferencia en el mercado", fr: "Préemption du marché", ur: "مارکیٹ پلیس پریمپشن", tr: "Pazar yerlerinin edinimi", id: "Akuisisi pasar" }
summary:
  ar: "عند البلاذري: خرج علي إلى السوق فرأى أهله قد حازوا أمكنتهم فقال ليس ذلك لهم إن سوق المسلمين كمصلاهم من سبق إلى موضع فهو له يومه حتى يدعه وكانوا في زمن المغيرة بن شعبة يعدون إلى السوق فمن قعد في موضع كان أحق به إلى الليل فلما كان زياد قال من قعد في موضع كان أحق به ما دام فيه."
  en: "In al-Baladhuri: Ali went out to the market, saw its people had seized their places, and said 'that is not theirs — the Muslims' market is like their prayer-place: whoever first reaches a spot holds it for his day until he leaves it'; under al-Mughira ibn Shu'ba they raced to the market, first-sitter holding his spot till nightfall, and Ziyad ruled the sitter keeps it while he remains."
  es: "En al-Baladhuri: Ali salió al mercado, vio que la gente había tomado sus lugares y dijo: \"Eso no es de ellos; el mercado de los musulmanes es como su lugar de oración: quien primero llega a un lugar lo conserva durante todo el día hasta que lo abandona\". Bajo al-Mughira ibn Shu'ba, corrieron hacia el mercado, el primero en sentarse conservaba su lugar hasta el anochecer, y Ziyad dictaminó que quien se sienta lo conserva mientras permanece allí."
  fr: "Dans al-Baladhuri: Ali se rendit au marché, constata que les gens s'étaient emparés de leurs places et dit: « Cela ne leur appartient pas — le marché des musulmans est comme leur lieu de prière: celui qui arrive le premier à une place la conserve pour la journée jusqu'à ce qu'il la quitte »; sous al-Mughira ibn Shu'ba, ils se précipitèrent au marché, le premier assis conservant sa place jusqu'à la tombée de la nuit, et Ziyad décréta que celui qui s'y trouvait la conservait tant qu'il y restait."
  ur: "البلادوری میں ہے: علی بازار کی طرف نکلے، دیکھا کہ وہاں کے لوگوں نے ان کی جگہوں پر قبضہ کر لیا ہے، اور کہا کہ یہ ان کا نہیں ہے، مسلمانوں کا بازار ان کی عبادت گاہ کی طرح ہے: جو پہلے کسی جگہ پر پہنچتا ہے اسے اپنے دن کے لیے روکے رکھتا ہے یہاں تک کہ وہ وہاں سے نکل جائے۔ مغیرہ بن شعبہ کے ماتحت وہ بازار کی طرف دوڑ پڑے، پہلے بیٹھنے والے نے رات ہونے تک اپنی جگہ پکڑی رکھی، اور زیاد نے حکم دیا کہ بیٹھنے والا اسے باقی رکھے۔"
  tr: "Al-Baladhuri'ye göre: Ali pazara çıktı ve ailesinin yerlerini güvence altına aldığını gördü, dedi ki, 'Bu onların değil. Müslüman pazarı onların namaz yeri gibidir; bir yerden önce giden herkesin günü vardır, ta ki oradan çıkana kadar.' dedi. Al-Muhira ibn Şu'be zamanında pazara geri dönerlerdi. Bir yerde kalan herkesin geceye kadar daha fazla hakkı vardı. Ziyad geldiğinde dedi ki: Bir yerde oturan kişi, orada olduğu sürece daha fazla hakka sahiptir."
  id: "Menurut Al-Baladhuri: Ali pergi ke pasar dan melihat keluarganya telah mengamankan tempat mereka, maka ia berkata, 'Itu bukan milik mereka. Pasar Muslim seperti tempat salat mereka; siapa pun yang pergi sebelum suatu tempat mendapat harinya sampai ia meninggalkannya.' Pada zaman Al-Mughira ibn Shu'bah, mereka biasa kembali ke pasar. Siapa pun yang tinggal di suatu tempat berhak atas tempat itu sampai malam. Ketika Ziyad tiba, ia berkata: Siapa pun yang duduk di suatu tempat memiliki hak lebih atas tempat itu selama ia masih di sana."
