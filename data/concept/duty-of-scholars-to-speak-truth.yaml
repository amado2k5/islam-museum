id: concept/duty-of-scholars-to-speak-truth
class: concept
kind: ethical
label:
  ar: "مسؤولية العلماء في الكلمة بالحق"
  en: "The scholars' duty to speak the truth"
summary:
  ar: "يرى عرجون أن الحكام يملكون قوة التنفيذ، والعلماء تملك الكلمة، والكلمة بالحق أقدم أثراً من السيف {cite:sunan-allah-fi-al-mujtama-azhar p. 75}. ويستدل بالأخذ على العلماء بالبيان لدين الله وبالنهي عن المنكر دعامة من دعائم نصر الله {cite:sunan-allah-fi-al-mujtama-azhar p. 75}. ويذكر أن عز الدين بن عبد السلام في حروب الصليبيين مثال لإمام أثار العزة في الأمة {cite:sunan-allah-fi-al-mujtama-azhar p. 76}. ويذكر قول عمر بن عبد العزيز أن الولاية مسؤولية مشتركة بين الوالي والرعية {cite:sunan-allah-fi-al-mujtama-azhar p. 74}. ويقترح المؤلف أن يصوغ العلماء خطة إصلاح مكتوبة تُرفع إلى المسؤولين، وأن يتابعوها في موسم الحج، وهذا اقتراحه ورأيه {cite:sunan-allah-fi-al-mujtama-azhar p. 78}."
  en: "Arjun gives rulers the power to act and scholars the word, and holds that the word of truth precedes the sword in effect {cite:sunan-allah-fi-al-mujtama-azhar p. 75}. He cites Izz al-Din ibn Abd al-Salam's stance against the Crusaders as an example, and Umar ibn Abd al-Aziz's saying that authority is shared between ruler and ruled {cite:sunan-allah-fi-al-mujtama-azhar p. 74-76}. His proposal that scholars draft a written reform plan is his own view {cite:sunan-allah-fi-al-mujtama-azhar p. 78}."
