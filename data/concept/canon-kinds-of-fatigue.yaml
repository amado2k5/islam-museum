summary:
  ar: "يعدد ابن سينا في الفصل الثاني عشر أصناف الإعياء الثلاثة القروحي والتمددي والورمي ورابعاً هو القشفي، ويصف علامات القروحي وسببه من فضول رقيقة حادة أو ذوبان اللحم والشحم لشدة الحركة {cite:canon-ibn-sina-print-v1 pp.242-243}."
  en: "In the twelfth chapter Ibn Sina counts the three kinds of fatigue, ulcerous, tension and inflammatory, and a fourth, the desiccatory, and describes the signs of the ulcerous kind and its cause in thin sharp superfluities or the melting of flesh and fat by hard movement {cite:canon-ibn-sina-print-v1 pp.242-243}."
