id: concept/canon-kinds-of-fatigue
class: concept
kind: scientific
label:
  ar: "أصناف الإعياء عند ابن سينا"
  en: "The kinds of fatigue in the Canon"
  fr: "Types de fatigue dans le Canon"
  ur: "تھکن کی اقسام قانون میں"
  es: "Los tipos de fatiga en el Canon"
  tr: "İbn Sina'ya göre yorgunluk türleri"
  id: "Jenis-jenis kelelahan menurut Ibn Sina"
summary:
  ar: "يعدد ابن سينا في الفصل الثاني عشر أصناف الإعياء الثلاثة القروحي والتمددي والورمي ورابعاً هو القشفي، ويصف علامات القروحي وسببه من فضول رقيقة حادة أو ذوبان اللحم والشحم لشدة الحركة {cite:canon-ibn-sina-print-v1 pp.242-243}."
  en: "In the twelfth chapter Ibn Sina counts the three kinds of fatigue, ulcerous, tension and inflammatory, and a fourth, the desiccatory, and describes the signs of the ulcerous kind and its cause in thin sharp superfluities or the melting of flesh and fat by hard movement {cite:canon-ibn-sina-print-v1 pp.242-243}."
  fr: "Au chapitre 12, Ibn Sina distingue ulcéreuse, tensive, inflammatoire, avec quatrième desséchante ; il attribue l’ulcéreuse aux excédents fluides âcres ou à fonte de chair et graisse par mouvement dur {cite:canon-ibn-sina-print-v1 pp.242-243}."
  es: "En el capítulo doce, Ibn Sina enumera los tres tipos de fatiga: ulcerosa, tensional e inflamatoria, y un cuarto, la desecante, y describe los signos del tipo ulceroso y su causa en finas y agudas superfluidades o en el derretimiento de la carne y la grasa por el movimiento brusco {cite:canon-ibn-sina-print-v1 pp.242-243}."
  ur: "ابن سینا نے بارہویں باب میں تھکاوٹ کی تین قسمیں گنیں ہیں، السر، تناؤ اور سوزش اور چوتھے، خشک کرنے والی، اور السر کی قسم کی علامات اور اس کی وجہ پتلی تیز ضرورتوں یا سخت حرکت سے گوشت اور چربی کے پگھل جانے کو بیان کیا ہے۔ صفحہ 242-243}۔"
  tr: "On ikinci bölümde İbn Sina üç tür yorgunluğu sıralar: ülser, uzun süren ve tümör; dördüncü ise kabuklulardır. Ülserlerin belirtilerini ve nedenlerini anlatır; örneğin ince, keskin aşırılıklar veya yoğun hareket nedeniyle et ve yağın erimesi {cite:canon-ibn-sina-print-v1 s.242-243}."
  id: "Dalam bab dua belas, Ibn Sina mencantumkan tiga jenis kelelahan: ulkus, berpanjangan, dan tumor, dan yang keempat adalah krustasea. Ia menggambarkan tanda-tanda tukak lambung dan penyebabnya, seperti kelebihan tipis dan tajam atau pelarutan daging dan lemak akibat gerakan intens {cite:canon-ibn-sina-print-v1 hlm.242-243}."
