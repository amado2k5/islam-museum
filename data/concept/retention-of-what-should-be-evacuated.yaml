id: concept/retention-of-what-should-be-evacuated
class: concept
kind: scientific
label: { ar: "احتباس ما يجب أن يستفرغ عند ابن سينا", en: "The retention of what should be evacuated in the Canon", ur: "قانون میں اس چیز کا رک جانا جسے خارج ہونا چاہیے" }
summary:
  ar: "في الفصل السابع عشر، في موجبات الاحتباس والاستفراغ، يذكر ابن سينا أن احتباس ما يجب أن يستفرغ بالطبع يكون لضعف الدافعة، أو لشدة القوة الماسكة، أو لضعف الهاضمة، أو لضيق المجاري والسدد فيها، أو لغلظ المادة أو لزوجتها أو كثرتها، أو لفقدان الإحساس بالحاجة إلى دفعها، أو لانصراف قوة الطبيعة إلى جهة أخرى كما في البحارين {cite:canon-ibn-sina-print-v1 p.138}."
  en: "In the seventeenth chapter, on the causes that lie in retention and evacuation, Ibn Sina lists why what should be naturally evacuated is held back: weakness of the expelling power, strength of the retaining power, weakness of the digestive power, narrowness of the passages and obstructions in them, thickness, stickiness or abundance of the matter, loss of the sense of any need to expel it, or the turning of nature's power elsewhere, as in crises {cite:canon-ibn-sina-print-v1 p.138}."
