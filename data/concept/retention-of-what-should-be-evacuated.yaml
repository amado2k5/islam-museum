id: concept/retention-of-what-should-be-evacuated
class: concept
kind: scientific
label: { ar: "احتباس ما يجب أن يستفرغ عند ابن سينا", en: "The retention of what should be evacuated in the Canon", ur: "قانون میں اس چیز کا رک جانا جسے خارج ہونا چاہیے", es: "La retención de lo que debe ser evacuado en el Canon", fr: "La conservation de ce qui devrait être évacué dans le Canon" }
summary:
  ar: "في الفصل السابع عشر، في موجبات الاحتباس والاستفراغ، يذكر ابن سينا أن احتباس ما يجب أن يستفرغ بالطبع يكون لضعف الدافعة، أو لشدة القوة الماسكة، أو لضعف الهاضمة، أو لضيق المجاري والسدد فيها، أو لغلظ المادة أو لزوجتها أو كثرتها، أو لفقدان الإحساس بالحاجة إلى دفعها، أو لانصراف قوة الطبيعة إلى جهة أخرى كما في البحارين {cite:canon-ibn-sina-print-v1 p.138}."
  en: "In the seventeenth chapter, on the causes that lie in retention and evacuation, Ibn Sina lists why what should be naturally evacuated is held back: weakness of the expelling power, strength of the retaining power, weakness of the digestive power, narrowness of the passages and obstructions in them, thickness, stickiness or abundance of the matter, loss of the sense of any need to expel it, or the turning of nature's power elsewhere, as in crises {cite:canon-ibn-sina-print-v1 p.138}."
  es: "En el capítulo diecisiete, sobre las causas que subyacen a la retención y la evacuación, Ibn Sina enumera por qué lo que debería evacuarse naturalmente se retiene: debilidad del poder de expulsión, fuerza del poder de retención, debilidad del poder digestivo, estrechez de los conductos y obstrucciones en ellos, espesor, viscosidad o abundancia de la materia, pérdida de la sensación de necesidad de expulsarla, o la desviación del poder de la naturaleza hacia otro lado, como en las crisis {cite:canon-ibn-sina-print-v1 p.138}."
  fr: "Dans le dix-septième chapitre, sur les causes de la rétention et de l'évacuation, Ibn Sina énumère les raisons pour lesquelles ce qui devrait être naturellement évacué est retenu: faiblesse du pouvoir d'expulsion, force du pouvoir de rétention, faiblesse du pouvoir digestif, étroitesse des passages et obstructions dans ceux-ci, épaisseur, adhérence ou abondance de la matière, perte du sentiment de tout besoin de l'expulser, ou le détournement du pouvoir de la nature ailleurs, comme dans les crises {cite:canon-ibn-sina-print-v1 p.138}."
