id: concept/nafs-lawwama
class: concept
kind: doctrine
label:
  ar: النفس اللوامة
  en: The self-reproaching soul (nafs lawwama)
  es: "El alma que se reprocha (nafs lawwama)"
  fr: "L'âme qui se fait des reproches (nafs lawwama)"
  ur: "خود کو ملامت کرنے والی روح ⁦(نفس قانونا)⁩"
  tr: "Suç Ruhu"
  id: "Jiwa Yang Menyalahkan"
summary:
  ar: "يرى الشعراوي أن في النفس الإنسانية خلية إيمانية تستيقظ بعد الغفلة فتلوم صاحبها على الخطأ وتردّه إلى المنهج، وهي النفس اللوامة. فإن غابت هذه اللوامة صارت النفس أمارة بالسوء، ويكون المجتمع المحيط عندئذ هو الذي يردّ الإنسان بمن فيه من خلايا الخير {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1567}."
  en: "Sha'rawi holds that the human soul contains a faith-cell which wakes after heedlessness and reproaches its owner for a fault, bringing him back to the law. This is the self-reproaching soul. If that reproach is absent, the soul commands evil, and the surrounding community becomes the place where a person is turned back by the good cells within it {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1567}."
  es: "Sha'rawi sostiene que el alma humana contiene una célula de fe que despierta tras la negligencia y reprocha a su dueño por una falta, devolviéndolo a la ley. Esta es el alma que se auto-reprende. Si ese reproche está ausente, el alma ordena el mal, y la comunidad circundante se convierte en el lugar donde la persona es reconducida por las células buenas que contiene {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1567}."
  fr: "Sha'rawi soutient que l'âme humaine contient une cellule de foi qui s'éveille après une période d'insouciance et reproche à son propriétaire sa faute, le ramenant ainsi à la loi. C'est l'âme qui se reproche à elle-même. Si ce reproche est absent, l'âme se tourne vers le mal, et la communauté environnante devient le lieu où une personne est ramenée à la raison par les bonnes cellules qui la composent {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1567}."
  ur: "شعراوی کا خیال ہے کہ انسانی روح میں ایک ایمانی خلیہ ہوتا ہے جو غفلت کے بعد بیدار ہوتا ہے اور اپنے مالک کو غلطی پر ملامت کرتا ہے اور اسے قانون کی طرف واپس لاتا ہے۔ یہ خود کو ملامت کرنے والی روح ہے۔ اگر وہ ملامت نہ ہو تو روح برائی کا حکم دیتی ہے، اور اردگرد کا معاشرہ وہ جگہ بن جاتا ہے جہاں انسان کو اس کے اندر موجود اچھے خلیات کے ذریعے پیچھے ہٹا دیا جاتا ہے صفحہ 1526 {حوالہ:تفسیر-شعروی-خواطر-سکین-جلد-2 صفحہ 1567}۔"
  tr: "Al-Shaarawi, insan ruhunun içinde dikkatsizlikten sonra uyanan, sahibini hatalar için suçlayan ve onları azarlayan ruh olan yönteme geri döndüren bir inanç hücresi olduğuna inanır. Bu suçlama olmazsa, ruh kötülüğün bir emri olur ve çevresindeki toplum, kişiyi ve içindeki iyilik hücrelerini reddeden taraf olur {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 s.1567}."
  id: "Al-Shaarawi percaya bahwa di dalam jiwa manusia ada sel iman yang terbangun setelah ketidakpedulian, menyalahkan pemiliknya atas kesalahan, dan mengembalikan mereka ke metode, yaitu jiwa yang penuh celaan. Jika kesalahan ini tidak ada, jiwa menjadi perintah kejahatan, dan kemudian masyarakat di sekitarnya adalah yang menolak orang tersebut bersama dengan sel-sel kebaikan di dalam dirinya {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1567}."
