id: concept/nafs-lawwama
class: concept
kind: doctrine
label:
  ar: النفس اللوامة
  en: The self-reproaching soul (nafs lawwama)
summary:
  ar: "يرى الشعراوي أن في النفس الإنسانية خلية إيمانية تستيقظ بعد الغفلة فتلوم صاحبها على الخطأ وتردّه إلى المنهج، وهي النفس اللوامة. فإن غابت هذه اللوامة صارت النفس أمارة بالسوء، ويكون المجتمع المحيط عندئذ هو الذي يردّ الإنسان بمن فيه من خلايا الخير {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1567}."
  en: "Sha'rawi holds that the human soul contains a faith-cell which wakes after heedlessness and reproaches its owner for a fault, bringing him back to the law. This is the self-reproaching soul. If that reproach is absent, the soul commands evil, and the surrounding community becomes the place where a person is turned back by the good cells within it {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1525}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1526}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1567}."
