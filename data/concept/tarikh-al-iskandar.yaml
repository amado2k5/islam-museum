label: { ar: "تاريخ الإسكندر ⁦(التقويم السلوقي)⁩", en: "The era of Alexander (Seleucid era)", ur: "تاریخِ اسکندر ⁦(سلوقی تقویم)⁩", es: "La era de Alejandro (era seléucida)", fr: "L'époque d'Alexandre (époque séleucide)", tr: "İskender'in Tarihi (Seleukos takvimi)", id: "Sejarah Alexander (kalender Seleukid)" }
term: { ar: "تاريخ الإسكندر", en: "era of Alexander" }
summary:
  ar: "التقويم المشهور بتاريخ الإسكندر، الذي يرى البيروني أنه لا يبدأ من أول ملك الإسكندر كما يظن الجمهور، بل من السنة الثالثة عشرة من مماته حين انفرد سلوقس بالملك {cite:qanun-masudi-jundi-v1 p. 39} {cite:qanun-masudi-jundi-v1 p. 40}."
  en: "The era known as 'of Alexander', which al-Biruni shows does not begin with Alexander's accession, as most people supposed, but in the thirteenth year after his death, when Seleucus came to rule alone {cite:qanun-masudi-jundi-v1 p. 39} {cite:qanun-masudi-jundi-v1 p. 40}."
  ur: "«تاریخِ اسکندر» کے نام سے مشہور تقویم، جس کے بارے میں بیرونی بتاتے ہیں کہ یہ اسکندر کی تخت نشینی سے نہیں بلکہ اس کی موت کے تیرہویں سال سے شروع ہوتی ہے جب سلوقس اکیلا حکمران بنا {cite:qanun-masudi-jundi-v1 p. 40}."
  es: "La era conocida como \"de Alejandro\", que al-Biruni muestra, no comienza con la ascensión de Alejandro, como la mayoría de la gente suponía, sino en el decimotercer año después de su muerte, cuando Seleuco pasó a gobernar solo {cite:qanun-masudi-jundi-v1 p. 39} {cite:qanun-masudi-jundi-v1 p. 40}."
  fr: "L'ère connue sous le nom d'« d'Alexandre », qui, selon al-Biruni, ne commence pas avec l'accession d'Alexandre au pouvoir, comme la plupart des gens le supposaient, mais la treizième année après sa mort, lorsque Séleucos est venu régner seul {cite:qanun-masudi-jundi-v1 p. 39} {cite:qanun-masudi-jundi-v1 p. 40}."
  tr: "Al-Biruni'nin İskender'in tarihindeki ünlü takvimin, çoğunluğun inandığı gibi İskender'in ilk saltanatından değil, ölümünden sonraki on üçüncü yıldan itibaren Seleukos'un tek kral olduğu zamandan başladığını düşünmektedir {cite:qanun-masudi-jundi-v1 s. 39} {cite:qanun-masudi-jundi-v1 s. 40}."
  id: "Kalender terkenal dalam sejarah Alexander, yang diyakini Al-Biruni tidak dimulai dari masa pemerintahan pertama Alexander seperti yang diyakini mayoritas, melainkan dari tahun ketiga belas setelah kematiannya ketika Seleukus menjadi raja tunggal {cite:qanun-masudi-jundi-v1 hlm. 39} {cite:qanun-masudi-jundi-v1 hlm. 40}."
