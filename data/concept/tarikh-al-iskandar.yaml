label: { ar: "تاريخ الإسكندر ⁦(التقويم السلوقي)⁩", en: "The era of Alexander (Seleucid era)", ur: "تاریخِ اسکندر (سلوقی تقویم)" }
term: { ar: "تاريخ الإسكندر", en: "era of Alexander" }
summary:
  ar: "التقويم المشهور بتاريخ الإسكندر، الذي يرى البيروني أنه لا يبدأ من أول ملك الإسكندر كما يظن الجمهور، بل من السنة الثالثة عشرة من مماته حين انفرد سلوقس بالملك {cite:qanun-masudi-jundi-v1 p. 39} {cite:qanun-masudi-jundi-v1 p. 40}."
  en: "The era known as 'of Alexander', which al-Biruni shows does not begin with Alexander's accession, as most people supposed, but in the thirteenth year after his death, when Seleucus came to rule alone {cite:qanun-masudi-jundi-v1 p. 39} {cite:qanun-masudi-jundi-v1 p. 40}."
  ur: "«تاریخِ اسکندر» کے نام سے مشہور تقویم، جس کے بارے میں بیرونی بتاتے ہیں کہ یہ اسکندر کی تخت نشینی سے نہیں بلکہ اس کی موت کے تیرہویں سال سے شروع ہوتی ہے جب سلوقس اکیلا حکمران بنا {cite:qanun-masudi-jundi-v1 p. 40}."
