label: { ar: "الحُلي", en: "Hilya (jewellery and its ruling)", ur: "حُلی (زیور)" }
summary:
  ar: "الحُليّ لغة ما يتزين به من المصوغ من المعادن أو الأحجار الكريمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} يحرم على الرجل اتخاذ حلي الذهب بجميع أشكاله، إلا للحاجة كالأنف والسن عند الجمهور، وتجوز تحلية السيف بالذهب عند المالكية والحنابلة، ولا تجوز تحلية آلات القتال بالذهب عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7277} ويجوز للرجل من الفضة الخاتم، والمالكية يقيدونه بدرهمين شرعيين، وللحنابلة في سائر الحلي من الفضة ثلاثة أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7278} وأجمع الفقهاء على جواز المرأة أنواع الحلي من الذهب والفضة ما لم يبلغ الإسراف أو التشبه بالرجال، ومنعت المذاهب الثلاثة تحلية المرأة آلات الحرب لما فيه من التشبه بالرجال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} ويجوز المموه بالذهب أو الفضة عند الحنفية والمالكية والشافعية في الأصح إذا لم يخلص منه شيء بالنار، ومنعه الحنابلة في الأواني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} وأجاز الأئمة الثلاثة الحلي من الجواهر للرجال والنساء، وكرهه الشافعية وبعض الحنابلة للرجل لأنه من زي النساء أو السرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} واتفق الفقهاء على كراهة خاتم الحديد والصفر والشبه والقصدير، واختار النووي أنه لا يكره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7280} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7281} وتجب الزكاة في الحلي المستعمل استعمالا محرما وفي المكنوز، واختلفوا في المباح المستعمل: فالمالكية والحنابلة والشافعي في القديم لا زكاة فيه، والحنفية والشافعي في الجديد على الوجوب، واستدل كل فريق بآثار عن عائشة وابن عمر وأسماء وجابر وابن عمرو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7281} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7282} وفي انكسار الحلي أحوال تتعلق بوجوب الزكاة، وتجوز إجارته عند الشافعية والحنابلة، وصحح الشافعية والحنابلة وقفه، ومنعه الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7282} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7283} وينتهي المدخل عند العنوان التالي «حمى» على ص 7283. "
  en: "Hilya lexically is ornament made of worked metals or precious stones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} A man may not wear gold ornaments in any form, except for need, as an artificial nose or tooth, which the majority allow; the Malikis and Hanbalis allow gold on a sword's hilt, while the Hanafis and Shafiis forbid gold on weapons. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7277} A man may wear a silver ring; the Malikis limit its weight to two lawful dirhams, and the Hanbalis have three opinions on other silver ornaments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7278} The jurists agree that women may wear gold and silver ornaments so long as they are not extravagant or imitate men; all three schools forbid a woman to decorate weapons with gold or silver as an imitation of men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} Gilding with gold or silver is allowed to men by the Hanafis, Malikis and the sounder Shafii view if no metal is recovered by fire; the Hanbalis forbid it on vessels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} The three imams allow men gems; the Shafiis and some Hanbalis dislike it for men as women's dress or extravagance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} The jurists agree that iron, brass and tin rings are disliked for men and women; al-Nawawi holds that they are not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7280} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7281} Zakat is due on ornaments kept for forbidden use and hoarded ones; for ornaments worn lawfully the Malikis, Hanbalis and the old Shafii view exempt them, while the Hanafis and the new Shafii view require zakat, citing reports from Aisha, Ibn Umar, Asma and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7281} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7282} Breakage changes the zakat position, hiring ornaments is allowed by the Shafiis and Hanbalis, and they also accept an endowment of ornaments, which the Hanafis refuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7282} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7283} The entry closes at the next headword, hima (حمى), on p.7283. "
  ur: "حُلیّ لغت میں دھات یا قیمتی پتھروں کے بنے ہوئے زیور کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} مرد کے لیے سونے کے ہر طرح کے زیور حرام ہیں، سوائے ضرورت کے جیسے ناک یا دانت کا سونا، جسے جمہور جائز کہتے ہیں؛ مالکیہ اور حنابلہ تلوار کے قبضے پر سونا جائز کہتے ہیں، جبکہ حنفیہ اور شافعیہ جنگی آلات پر سونا منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7277} مرد کے لیے چاندی کی انگوٹھی جائز ہے، مالکیہ اس کا وزن دو شرعی درہم تک محدود کرتے ہیں، اور حنابلہ کے نزدیک باقی چاندی کے زیورات میں تین اقوال ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7278} فقہاء کا اجماع ہے کہ عورت سونے چاندی کے زیورات پہن سکتی ہے جب تک اسراف یا مردوں سے مشابہت نہ ہو؛ تینوں مذاہب عورت کے لیے جنگی آلات کو سونے چاندی سے آراستہ کرنا منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} آگ پر ڈالنے سے جس کا دھات الگ نہ ہو ایسی ملمع کاری حنفیہ، مالکیہ اور شافعیہ کے اصح قول کے مطابق مرد کے لیے جائز ہے، جبکہ حنابلہ برتنوں پر منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} ائمہ ثلاثہ مرد اور عورت دونوں کے لیے قیمتی پتھروں کے زیورات کو جائز کہتے ہیں، جبکہ شافعیہ اور بعض حنابلہ مرد کے لیے مکروہ کہتے ہیں کیونکہ یہ عورتوں کا لباس یا اسراف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7280} لوہے، پیتل اور ٹین کی انگوٹھی مرد و عورت دونوں کے لیے مکروہ ہے، اور نووی کے نزدیک یہ مکروہ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7280} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7281} زکوٰۃ حرام استعمال کے زیورات اور ذخیرہ شدہ زیورات میں واجب ہے؛ جائز استعمال کے زیورات میں مالکیہ، حنابلہ اور شافعی کا قدیم قول عدم وجوب کا ہے، جبکہ حنفیہ اور شافعی کا جدید قول وجوب کا ہے، اور ہر فریق نے عائشہ، ابن عمر، اسماء، جابر اور عبداللہ بن عمرو سے آثار سے استدلال کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7281} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7282} ٹوٹے ہوئے زیور کے بارے میں کئی احوال ہیں؛ شافعیہ اور حنابلہ کے نزدیک زیور کی اجارہ جائز ہے، اور شافعیہ و حنابلہ اس کے وقف کو صحیح کہتے ہیں جبکہ حنفیہ اس کے منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7282} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7283} یہ مدخل p.7283 پر «حمى» کے عنوان پر ختم ہوتا ہے۔ "
