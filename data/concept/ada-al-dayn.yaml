id: concept/ada-al-dayn
class: concept
kind: legal
label:
  ar: "أداء الدين"
  en: "Ada' al-dayn (paying a debt: its ruling, the manner of payment, insolvency and the debts of the dead)"
summary:
  ar: "الدين وصف ثابت في الذمة، وأداؤه بالوصف الواجب فرض بالإجماع، والحال منه يجب فوراً عند الطلب مع القدرة، والمؤجل لا يجب قبل أجله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990} ويكون الأداء بالمثل في الديون، ويجوز بالأفضل بغير شرط، والقيمة فيما لا مثل له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1991} ويقوم مقام الأداء الإبراء والهبة والحوالة والمقاصة والصلح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1991} والموسر الممتنع يُلزم القاضي بالأداء، فإن امتنع حُبس، وباع الحاكم ماله الظاهر، وعند جمهور الفقهاء يُحجر على المفلس ويقسم ماله بين غرمائه، خلافاً لأبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1992} والمعسر يُنظر، ويُقضى دينه من الزكاة إن استدان لنفسه في غير معصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1992} والدين على الميت يتعلق بالتركة ويُقدَّم على الوصايا والميراث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1993}"
  en: "Paying a debt in the form owed is obligatory by consensus. A debt due now must be paid on demand when the debtor can pay; a deferred debt is not due before its term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1990} Payment is made in like items, with value owed where there is no like; a better payment is allowed when unconditioned. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1991} Remission, gift, assignment, set-off and settlement take the place of payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1991} A solvent debtor who refuses is compelled, imprisoned and his apparent property sold; the majority hold that a bankrupt is put under interdiction and his property divided among creditors, against Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1992} The insolvent is given respite, and his debt may be paid from zakat if he borrowed for himself in a lawful matter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1992} A dead person's debt attaches to his estate and takes precedence over bequests and inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1993}"
