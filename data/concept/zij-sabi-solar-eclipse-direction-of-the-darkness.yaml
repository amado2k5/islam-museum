id: concept/zij-sabi-solar-eclipse-direction-of-the-darkness
class: concept
kind: scientific
label: { ar: "جهة ظلمة كسوف الشمس على الأفق", en: "The horizon direction of the darkness in a solar eclipse", ur: "سورج گرہن کی سیاہی کی افقی سمت", es: "La dirección del horizonte de la oscuridad en un eclipse solar", fr: "Direction de l'horizon de l'obscurité lors d'une éclipse solaire" }
summary:
  ar: "تُعرف جهة الظلمة في بدء الكسوف من حد سمت الجزء الغارب عند ذلك إلى جهة عرض القمر المرئي فيه، وفي تمام الانجلاء من حد سمت الجزء الطالع إلى جهة عرض القمر. أما في وسط الكسوف فإن الظلمة تكون على زاوية قائمة على فلك البروج، وتُحدّ من دائرة الأفق بالقوس التي تجوز على قطبي فلك البروج وعلى مركز القمر والأفق بحسب بُعد الشمس والقمر عن فلك معدل النهار. {cite:zij-sabi-nallino-byblion pp.169-171}"
  en: "The direction of the darkness at the beginning is measured from the azimuth of the setting part of the ecliptic at that moment, toward the side of the Moon's visible latitude; at the end of totality it is measured from the azimuth of the rising part toward the same side. At mid-eclipse the darkness lies at a right angle to the ecliptic, bounded on the horizon by the arc through the poles of the ecliptic, the Moon's centre and the horizon, according to the distances of the Sun and Moon from the equator of the day. {cite:zij-sabi-nallino-byblion pp.169-171}"
  ur: "گرہن کے آغاز پر سیاہی کی سمت اس وقت کے غارب جزو کے سمت سے چاند کے مرئی عرض کی جانب ناپی جاتی ہے؛ اختتامِ انجلا پر طالع جزو کے سمت سے اسی جانب۔ وسطِ گرہن میں سیاہی دائرۂ البروج پر قائمہ زاویے پر ہوتی ہے، اور افق پر وہ قوس اسے حد دیتی ہے جو دائرۂ البروج کے قطبوں، چاند کے مرکز اور افق سے گزرتی ہے، سورج اور چاند کے معدل النہار سے بُعد کے مطابق۔ {cite:zij-sabi-nallino-byblion pp.169-171}"
  es: "La dirección de la oscuridad al comienzo se mide desde el acimut de la parte poniente de la eclíptica en ese momento, hacia el lado de la latitud visible de la Luna; al final de la totalidad se mide desde el acimut de la parte saliente hacia el mismo lado. En el punto medio del eclipse, la oscuridad se encuentra en ángulo recto con respecto a la eclíptica, delimitada en el horizonte por el arco que pasa por los polos de la eclíptica, el centro de la Luna y el horizonte, según las distancias del Sol y la Luna al ecuador del día. {cite:zij-sabi-nallino-byblion pp.169-171}"
  fr: "La direction de l'obscurité au début de l'éclipse totale est mesurée à partir de l'azimut du point de coucher de l'écliptique à ce moment précis, du côté de la latitude visible de la Lune; à la fin de l'éclipse totale, elle est mesurée à partir de l'azimut du point de lever, du même côté. Au milieu de l'éclipse, l'obscurité forme un angle droit avec l'écliptique, délimité à l'horizon par l'arc passant par les pôles de l'écliptique, le centre de la Lune et l'horizon, en fonction des distances du Soleil et de la Lune à l'équateur diurne. {cite:zij-sabi-nallino-byblion pp.169-171}"
