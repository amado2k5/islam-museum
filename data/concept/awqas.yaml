label: { ar: "الأوقاص", en: "Awqas (the gaps between the prescribed amounts of zakat on camels, cattle and sheep, and whether zakat is due on them)" }
summary:
  ar: "الأوقاص جمع وقص، وهو في الشرع ما بين الفريضتين في أنصبة زكاة الإبل والبقر والغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3686} والأشناق والعفو بمعنى ما بين الفريضتين، وخص بعض الفقهاء الشنق بالإبل والوقص بالبقر والغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687} وأوقاص الإبل خمس مراتب، وأوقاص البقر عددان، وأوقاص الغنم ثلاث مراتب تبدأ بالثمانين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} ولا زكاة في أوقاص الغنم بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} واختلف الفقهاء في زكاة أوقاص الإبل، فقال الحنفية وأبو يوسف والشافعي في القديم بعدم الزكاة، وقال محمد وزفر ومالك في قوله الراجع والشافعي في رواية البويطي بالزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689} وفي البقر ما بين الأربعين والستين: قال الجمهور لا زكاة فيه، وقال أبو حنيفة في روايته الأصل بالحساب، وروايته الثالثة بعد الخمسين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}"
  en: "Awqas are the plural of waqs, the gap between two prescribed amounts in zakat on camels, cattle and sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3686} Ashnaq and afw are the same sense, and some jurists restrict shanaq to camels and waqs to cattle and sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687} The gaps in camels are of five ranks, those in cattle are of two counts, and those in sheep are of three ranks beginning at eighty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} By agreement no zakat is due on the gaps in sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} The jurists differ on zakat on the gaps in camels: the Hanafis (Abu Hanifa and Abu Yusuf), the Malikis in one view and al-Shafi'i in the older view deny it, while Muhammad, Zufar, the Malikis in their later view and al-Shafi'i in another report affirm it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689} On the gap in cattle between forty and sixty, the majority hold no zakat is due, while Abu Hanifa has three views, one counting by proportion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}"
