label:
  ar: "الأوقاص"
  en: "Awqas (the gaps between the prescribed amounts of zakat on camels, cattle and sheep, and whether zakat is due on them)"
  fr: "Awqas (intervalles entre les quantités prescrites de zakat sur les chameaux, les bovins et les ovins, et leur assujettissement)"
  es: "Awqas (las diferencias entre las cantidades prescritas de zakat para camellos, ganado vacuno y ovino, y si se debe pagar zakat sobre ellos)"
summary:
  ar: "الأوقاص جمع وقص، وهو في الشرع ما بين الفريضتين في أنصبة زكاة الإبل والبقر والغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3686} والأشناق والعفو بمعنى ما بين الفريضتين، وخص بعض الفقهاء الشنق بالإبل والوقص بالبقر والغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687} وأوقاص الإبل خمس مراتب، وأوقاص البقر عددان، وأوقاص الغنم ثلاث مراتب تبدأ بالثمانين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} ولا زكاة في أوقاص الغنم بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} واختلف الفقهاء في زكاة أوقاص الإبل، فقال الحنفية وأبو يوسف والشافعي في القديم بعدم الزكاة، وقال محمد وزفر ومالك في قوله الراجع والشافعي في رواية البويطي بالزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689} وفي البقر ما بين الأربعين والستين: قال الجمهور لا زكاة فيه، وقال أبو حنيفة في روايته الأصل بالحساب، وروايته الثالثة بعد الخمسين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}"
  en: "Awqas are the plural of waqs, the gap between two prescribed amounts in zakat on camels, cattle and sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3686} Ashnaq and afw are the same sense, and some jurists restrict shanaq to camels and waqs to cattle and sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687} The gaps in camels are of five ranks, those in cattle are of two counts, and those in sheep are of three ranks beginning at eighty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} By agreement no zakat is due on the gaps in sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} The jurists differ on zakat on the gaps in camels: the Hanafis (Abu Hanifa and Abu Yusuf), the Malikis in one view and al-Shafi'i in the older view deny it, while Muhammad, Zufar, the Malikis in their later view and al-Shafi'i in another report affirm it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689} On the gap in cattle between forty and sixty, the majority hold no zakat is due, while Abu Hanifa has three views, one counting by proportion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}"
  fr: "Awqas est le pluriel de waqs, l’intervalle entre deux quantités prescrites de zakat sur les chameaux, les bovins et les ovins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3686} Ashnaq et afw ont le même sens ; certains juristes réservent shanaq aux chameaux et waqs aux bovins et aux ovins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687} Les intervalles comptent cinq rangs chez les chameaux, deux chez les bovins et trois chez les ovins, à commencer par quatre-vingts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} Tous s’accordent à ne pas imposer de zakat sur les intervalles chez les ovins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} Les juristes divergent pour les chameaux : les hanafites Abu Hanifa et Abu Yusuf, les malikites selon un avis et al-Shafi'i dans son ancien avis l’excluent ; Muhammad, Zufar, les malikites dans leur avis ultérieur et un autre récit d’al-Shafi'i l’affirment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689} Pour l’intervalle entre quarante et soixante bovins, la majorité n’impose aucune zakat, tandis que trois avis sont rapportés d’Abu Hanifa, dont un calcul proportionnel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}"
  es: "Awqas son el plural de waqs, la diferencia entre dos cantidades prescritas en zakat sobre camellos, ganado vacuno y ovejas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3686} Ashnaq y afw tienen el mismo sentido, y algunos juristas restringen shanaq a los camellos y waqs al ganado vacuno y las ovejas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687} Las diferencias en los camellos son de cinco rangos, las del ganado vacuno son de dos conteos, y las de las ovejas son de tres rangos comenzando en ochenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3687}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3688}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} Por acuerdo, no se debe zakat sobre las brechas en las ovejas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} Los juristas difieren sobre el zakat sobre las brechas en los camellos: los hanafíes (Abu Hanifa y Abu Yusuf), los malikíes en una opinión y al-shafi'i en la opinión más antigua lo niegan, mientras que Muhammad, Zufar, los malikíes en su opinión posterior y al-shafi'i en otro informe lo afirman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689} Respecto a la diferencia en el número de cabezas de ganado entre cuarenta y sesenta, la mayoría sostiene que no se debe pagar zakat, mientras que Abu Hanifa tiene tres opiniones, una de ellas calculada proporcionalmente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3689}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}"
