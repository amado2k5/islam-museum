summary:
  ar: "معنى شرح الصدر وانشراحه كما يعرضه الشيخ عمر عبد الكافي: أن أسرار الصدر لا يعلمها إلا خالقه، والتمييز بين شرح الصدر الحسي والمعنوي، وحادثة شق الصدر في طفولة النبي مع التفسير الطبي الذي يذكره، وسعة الصدر مع السائل المكرر {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}."
  en: "The expansion and opening of the breast as Sheikh Omar Abdelkafy presents it: its secrets known to its Creator alone, the sensory and moral kinds of opening, the account of the opening of the breast in the Prophet's childhood with the medical reading he offers, and breadth of heart toward a repeating questioner {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق شرحِ صدر اور انشراحِ صدر: صدر کے اسرار صرف خالق کو معلوم، شرحِ صدر کی حسی اور معنوی قسمیں، نبی کے بچپن میں شقِ صدر کا واقعہ اور اس کی طبی تشریح، اور مکرر سوال کرنے والے کے ساتھ سعتِ صدر {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}۔"
  es: "La expansión y apertura del pecho tal como la presenta el jeque Omar Abdelkafy: sus secretos conocidos solo por su Creador, los tipos sensoriales y morales de apertura, el relato de la apertura del pecho en la infancia del Profeta con la lectura médica que ofrece, y la amplitud de corazón hacia un interrogador repetido {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}."
  fr: "L'expansion et l'ouverture du sein telles que le présente Cheikh Omar Abdelkafy: ses secrets connus de son Créateur seul, les types d'ouverture sensoriels et moraux, le récit de l'ouverture du sein dans l'enfance du Prophète avec la lecture médicale qu'il propose, et l'ouverture de cœur envers un questionneur répétitif {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}."
  tr: "Şeyh Ömer Abdul Kafi tarafından sunulan sandığın ve açılışının anlamı: sandığın sırlarının yalnızca Yaratıcısı tarafından bilindiği, duyusal ve ruhani açıklamalar arasında ayrım yapıldığı, Peygamber'in çocukluğunda sandığın tıbbi yorumla çatladığı olay ve geniş göğüslü olanın tekrar tekrar sorduğu {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}"
  id: "Makna penjelasan peti dan pembukaannya seperti yang disampaikan oleh Sheikh Omar Abdul Kafi: bahwa rahasia peti hanya diketahui oleh Penciptanya, membedakan antara penjelasan indra dan spiritual, insiden peti yang terbelah saat masa kecil Nabi dengan interpretasi medis yang disebutkannya, dan penjelasan dada lebar dengan penanya yang berulang {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}."
