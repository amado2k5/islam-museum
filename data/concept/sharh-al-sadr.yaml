  en: "Expansion of the breast (sharh al-sadr)"
  ur: "شرحِ صدر"
summary:
  ar: "معنى شرح الصدر وانشراحه كما يعرضه الشيخ عمر عبد الكافي: أن أسرار الصدر لا يعلمها إلا خالقه، والتمييز بين شرح الصدر الحسي والمعنوي، وحادثة شق الصدر في طفولة النبي مع التفسير الطبي الذي يذكره، وسعة الصدر مع السائل المكرر {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}."
  en: "The expansion and opening of the breast as Sheikh Omar Abdelkafy presents it: its secrets known to its Creator alone, the sensory and moral kinds of opening, the account of the opening of the breast in the Prophet's childhood with the medical reading he offers, and breadth of heart toward a repeating questioner {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق شرحِ صدر اور انشراحِ صدر: صدر کے اسرار صرف خالق کو معلوم، شرحِ صدر کی حسی اور معنوی قسمیں، نبی کے بچپن میں شقِ صدر کا واقعہ اور اس کی طبی تشریح، اور مکرر سوال کرنے والے کے ساتھ سعتِ صدر {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep11 00:01:30}۔"
