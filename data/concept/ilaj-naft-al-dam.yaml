label:
  ar: "علاج نفث الدم"
  en: "The treatment of the spitting of blood"
  ur: "خون کے نفث کا علاج"
  es: "El tratamiento de la escupir sangre"
summary:
  ar: "المبتلى بنفث الدم كل وقت يجب أن يراعي حال امتلائه فكلما أحس فيه بامتلاء بودر بالفصد وخصوصاً إذا كان صدره في الخلقة ضيقاً أو كان السعال عليه ملحاً، والأصوب أن يمال الدم منهم إلى ناحية السفل بفصد عرق يسميه الكتاب وبعده بفصد عرق آخر ⁦(اسماهما على لفظ الكتاب)⁩، وإذا در أمر تذكره النساء في الوقت وعلى الكفاية زال به نفث الدم منهن كما قد يحدث فيهن باحتباسه ⁦(سطر موسوم)⁩، ويجب أن يتحرز عن جميع الأسباب المحركة للدم مثل الأغذية المسخنة والوثبة والصيحة والضجر وسبب آخر ⁦(سطر موسوم)⁩ والنفس العالي والكلام والشراب الكثير وكثرة الاستحمام، ويجتنب المفتّحات من الأدوية ⁦(أسماؤها مستثناة)⁩ والطري منها ضار وما ذكره نافع ⁦(سطر موسوم من الجبن)⁩، والأغذية الموافقة كل مغر ومسدد وكل ملحم وكل مبرد للدم مانع من غليانه ومنها اللبن المطبوخ لمافيه من تغرية ومخيض البقر لما فيه من القبض وما عداهما من الألبان والأجبان والفواكه القابضة ⁦(سطور موسومة)⁩ والمياه الشبية شديدة المنفعة، وأما الكائن عن نفس جرم الرئة فيسقى الأدوية الملحمة اليابسة ⁦(أسماؤها مستثناة)⁩ والخل الممزوج بالماء، وأما علاجه عن تدبير غذائه فأن يبادر ويفصد منه العرق المذكور من الشق الذي يحدس أن انحلال الفرد فيه فصداً دقيقاً ويؤخذ الدم في دفعات بينها ساعات مع مراعاة القوة فإن الفصد يجذب الدم إلى الخلاف ويمنع أيضاً حدوث الورم في الجراحة، وتدلك أطرافهم وتشد شداً مبتدأً من فوق إلى أسفل ⁦(خبر الكتاب عما يفعل لا حكم عمل)⁩ ويمنعون الأمور المذكورة ويعدل هواؤهم وتكون اضطجاعهم على جنب وعلى هيئة كالانتصاب لئلا يقع بعض أجزاء صدره على بعض، وقد يوافقهم الخل الممزوج بالماء فإنه يمنع النزف وينقي ناحية الصدر والرئة عن دم إن احتبس فيها فلا يجمد، ويسقون الأدوية الباردة والمغرية فإن المغرية ههنا أولى ما يجب أن يشتغل به وإذا وجد مع التغرية التنقية كان غاية المطلوب ⁦(أسماء الأدوية مستثناة)⁩، وربما احتيج أن تخلط بها المدرات لأمرين لتسكين الدم وترقيقه وللتنويم وإزالة الحركة، وإذا عرض نفث الدم من نزلة ولم تكن حريفة صفراوية فصدت الرجل من ساعته وأدمت ربط أطرافه منحدراً من فوق إلى أسفل ودلكتها بدهن حار من هذا الجنس ولا يدهن الرأس البتة وتكون أغذيتهم الحنطة بشيء من العفوصات على سبيل الأحساء وعند الضعف يطعمون خبزاً منقوعاً في خل ممزوج بماء بارد وتستعمل عليهم الحقن الحادة لتجذب المادة عن ناحية الرأس وخصوصاً إذا لم يمكن الفصد لمانع ويجب أن يجتهد في تبريد الرأس ما أمكن ولا يجهد جهداً كثيراً في ترطيبه، ومما ينفعه سقي أقراص من هذا الجنس فإن لم ينجع ما ذكر فعلاج من هذا الجنس ⁦(سطر موسوم فيه زبل حيوان)⁩ {cite:canon-ibn-sina-print-v2 p.335}"
  en: "The one afflicted by spitting of blood at all times must watch his fullness-state: whenever he senses fullness he is forestalled by venesection, especially if his chest is narrow in build or the cough insistent on him; the soundest is to tilt their blood toward the lower side by venesecting a vein the book names, then another vein after it (their names on the book's wording). And if a thing the women mention flows at the time and to sufficiency, their spitting of blood leaves them, as it may arise in them by its retention (a labelled line). All the blood-stirring causes must be shunned: the heating foods, leaping, shouting, vexation, another cause (a labelled line), the high breath, talk, much drink and much bathing; and the opening drugs are avoided (names excluded) — the fresh of what he mentions is harmful, the other beneficial (a labelled line of the cheese). The foods suiting them are every glutinous thing and every obstructer, every healer, every cooler of the blood barring its boiling: among them the boiled milk for its glutinousness, and the cow's buttermilk for its astringency, and the other milks, cheeses and astringent fruits he counts (labelled lines), and the alum-waters strongly benefit. As for what is from the lung's own body, the dry healing drugs are given to drink (names excluded) and vinegar mixed with water. As for treating it by its food-regimen: that venesection of the named vein be hastened on the side where dissolution of unity is guessed, a measured venesection, the blood taken in bouts with hours between, watching the strength — for venesection draws the blood to the contrary side and also prevents a tumour arising in the wound; their limbs are rubbed and bound, beginning from above downward (the book's report of what is done, not a ruling), the mentioned things are forbidden them, their air is moderated, and their lying is on a side in a near-upright posture lest some chest part press on another. Vinegar mixed with water may suit them, barring the bleeding and cleansing the chest and lung of a blood retained in them lest it congeal. They are given the cold and the glutinous drugs — the glutinous here is the first thing to be busy with, and if cleansing is found with the glutinousness it is the utmost wanted (drug names excluded). Diuretics may need mixing in for two things: stilling and thinning the blood, and sleep and removing movement. If the spitting arose from a catarrh not sharp-bilious, the man is bled at once, his limbs kept bound descending from above downward, rubbed with a hot oil of this kind, the head never anointed, their foods wheat with some astringents as gruels; at weakness they are fed bread soaked in vinegar mixed with cold water, sharp clysters are used to draw the matter off the head's side, especially when venesection is barred, and one must strive to cool the head as far as possible and not labour much at moistening it. And among what benefits is giving tablets of this kind; if what was mentioned does not avail, a treatment of this kind (a labelled line holding an animal's droppings) {cite:canon-ibn-sina-print-v2 p.335}"
  ur: "جو ہر وقت خون کے نفث میں مبتلا ہو اسے اپنے امتلاء کی نگہبانی کرنی چاہیے جب بھی امتلاء محسوس کرے فصد سے پہل کرے خاص طور پر اگر سینہ فطرت میں تنگ ہو یا کھانسی مسلسل ہو؛ بہترین یہ ہے کہ خون نیچے کی طرف میلان کیا جائے ایک ایسی رگ کی فصد سے جسے کتاب نام دیتی ہے پھر اس کے بعد دوسری رگ ⁦(نام کتاب کے لفظ پر)⁩؛ اور اگر وہ چیز جو عورتیں بیان کرتی ہیں وقت اور کفایت پر جاری ہو تو ان کا نفث دم جاتا رہتا ہے جیسا کہ محتبس رہنے سے بھی ہو سکتا ہے ⁦(موسوم سطر)⁩؛ اور خون ابھارنے والے تمام اسباب سے بچنا چاہیے گرم کرنے والی خوراکیں چھلانگ چیخ خفگی ایک اور سبب ⁦(موسوم سطر)⁩ اونچی سانس بات زیادہ مشروب اور زیادہ غسل؛ اور کھولنے والی ادویہ سے پرہیز ⁦(نام مستثنیٰ)⁩ ان میں تازہ مضر اور مذکورہ دوسرا مفید ⁦(پنیر کی موسوم سطر)⁩؛ موافق خوراکیں ہر چپچپی اور بند کرنے والی ہر جوڑنے والی اور خون کو ٹھنڈا رکھنے والی چیز اس کے ابال سے روکنے والی؛ ان میں ابلا دودھ چپچپاہٹ کے لیے اور گائے کا چھاچھ قبض کے لیے اور باقی دودھ پنیر اور قابض پھل ⁦(موسوم سطریں)⁩ اور شب والے پانی بہت مفید؛ اور جو پھیپھڑے کے جرم سے ہو اسے خشک ملحم ادویہ پلائے جائیں ⁦(نام مستثنیٰ)⁩ اور پانی میں ملا سرکہ؛ اور خوراک کی تدبیر سے علاج یہ کہ مذکورہ رگ کی فصد اس پہلو سے جلد کرے جہاں وحدت کے انحلال کا گمان ہو مدروب فصد اور خون وقفے وقفے سے گھنٹوں کے فاصلے پر لیا جائے قوت کی نگہبانی کے ساتھ کیونکہ فصد خون کو مخالف طرف کھینچتی ہے اور زخم میں ورم بھی روکتی ہے؛ ان کے اعضا مالش کرے اور باندھے اوپر سے نیچے کی طرف ⁦(کتاب کی خبر اس کے کہ جو ہوتا ہے حکم نہیں)⁩ مذکورہ چیزیں منع ہوں ہواؤں معتدل ہوں اور لیٹنا پہلو پر قریب القیام وضع پر ہو تاکہ سینے کا ایک حصہ دوسرے پر نہ پڑے؛ اور پانی میں ملا سرکہ موافق آسکتا ہے نزف روکتا ہے اور سینے اور پھیپھڑے کو اندر رکھے خون سے صاف کرتا ہے کہ جم نہ جائے؛ اور ٹھنڈی اور چپچپی ادویہ پلائی جائیں چپچپی یہاں اولین کام ہے اور اگر چپچپاہٹ کے ساتھ صفائی مل جائے تو وہی مطلوب کی انتہا ⁦(ادویہ کے نام مستثنیٰ)⁩؛ اور کبھی مداریں ملی جائیں دو کاموں کے لیے خون ٹھंडا اور پتلا کرنا اور نیند اور حرکت ہٹانا؛ اگر نفث غیر تیز صفراوی نزلة سے ہو تو فوراً فصد کرے اعضا کا باندھنا جاری رکھے اوپر سے نیچے گرم روغن سے ملطف کرے سر بالکل نہ ملے خوراکیں گندم کچھ عفوصتوں کے ساتھ احساء کی طرح؛ کمزوری پر ٹھنڈے پانی ملے سرکے میں بھگوئی روٹی کھلائیں تیز حقن استعمال ہوں تاکہ مادہ سر کی طرف سے کھینچے خاص طور پر جب فصد نہ ہو سکے اور سر کو جتنا ممکن ہو ٹھنڈا رکھنے کی کوشش کرے مرطوب کرنے میں زیادہ نہ جکڑے؛ اور اسی جنس کی گولیاں پلانا بھی مفید ہے اگر مذکورہ نہ کارگر ہو تو اسی جنس کا علاج ⁦(موسوم سطر جس میں جانور کی بِل ہے)⁩ {cite:canon-ibn-sina-print-v2 p.335}"
  es: "Quien padece de escupir sangre constantemente debe vigilar su estado de saciedad: siempre que sienta saciedad, debe prevenirla mediante una venopunción, especialmente si su pecho es estrecho o la tos es persistente; lo más recomendable es desviar la sangre hacia la parte inferior mediante la venopunción de una vena que el libro menciona, y luego otra vena después (sus nombres en el texto del libro). Y si algo que las mujeres mencionan fluye en el momento y en cantidad suficiente, la escupir sangre desaparece, ya que puede surgir en ellas por su retención (una línea etiquetada). Deben evitarse todas las causas que agitan la sangre: los alimentos calientes, los saltos, los gritos, la irritación, otra causa (una línea etiquetada), la respiración agitada, hablar mucho, beber en exceso y bañarse mucho; y se evitan los medicamentos que abren la sangre (nombres excluidos): lo fresco de lo que menciona es dañino, lo otro beneficioso (una línea etiquetada del queso). Los alimentos adecuados son todo lo glutinoso y todo obstructor, todo curativo, todo enfriador de la sangre que no hierva: entre ellos la leche hervida por su glutinosidad, y el suero de leche de vaca por su astringencia, y las otras leches, quesos y frutas astringentes que enumera (líneas etiquetadas), y las aguas de alumbre son muy beneficiosas. En cuanto a lo que proviene del propio cuerpo del pulmón, se administran por vía oral los medicamentos curativos secos (nombres excluidos) y vinagre mezclado con agua. En cuanto a su tratamiento mediante su régimen alimenticio: que se acelere la flebotomía de la vena nombrada en el lado donde se supone la disolución de la unidad, una flebotomía medida, la sangre tomada en episodios con horas de intervalo, vigilando la fuerza, pues la flebotomía atrae la sangre al lado contrario y también previene la aparición de un tumor en la herida; Sus miembros son frotados y atados, comenzando desde arriba hacia abajo (el informe del libro sobre lo que se hace, no una regla), las cosas mencionadas están prohibidas para ellos, su aire es moderado, y su acostado es de lado en una postura casi vertical para que ninguna parte del pecho presione otra. El vinagre mezclado con agua puede serles adecuado, evitando la hemorragia y limpiando el pecho y los pulmones de la sangre retenida para que no se coagule. Se les dan los medicamentos para el frío y los glutinosos; los glutinosos aquí son lo primero con lo que hay que ocuparse, y si se encuentra limpieza con la glutinosidad es lo más deseado (se excluyen los nombres de los medicamentos). Puede ser necesario mezclar diuréticos para dos cosas: calmar y diluir la sangre, y dormir y eliminar el movimiento. Si el escupir surgió de un catarro no biliar agudo, al hombre se le sangra de inmediato, sus miembros se mantienen atados de arriba hacia abajo, se frotan con un aceite caliente de este tipo, la cabeza nunca se unge, sus alimentos trigo con algunos astringentes como gachas; Cuando están débiles, se les da pan remojado en vinagre mezclado con agua fría; se usan enemas afilados para extraer la materia del costado de la cabeza, especialmente cuando no es posible la venopunción; y se debe procurar enfriar la cabeza lo máximo posible y no humedecerla en exceso. Entre los beneficios se encuentra la administración de comprimidos de este tipo; si lo mencionado no funciona, se puede recurrir a un tratamiento como este (una línea etiquetada que contiene las heces del animal) {cite:canon-ibn-sina-print-v2 p.335}"
