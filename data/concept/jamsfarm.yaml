summary:
  ar: "نبات قوته شبيهة بقوة الشيح مع عنب الثعلب، مفتّح مسكّن للنفخ والرياح خاصةً، يحلل الرطوبات اللزجة في المعدة، وينفع معدة الصبيان جداً. وفيه ذكر لرياح الأرحام {cite:canon-ibn-sina-print-v1 p.427}."
  en: "A plant whose strength is like that of wormwood with the nightshade berry. It opens and soothes flatulence and winds in particular, dissolves sticky humours in the stomach, and is very good for children's stomachs. The book also lists it for womb winds {cite:canon-ibn-sina-print-v1 p.427}."
  ur: "ایک پودا جس کی قوت شیح اور عنب الثعلب جیسی ہے۔ یہ خاص طور پر نفخ اور ہواؤں کو کھولتا اور سکون دیتا ہے، معدے کی لیس دار رطوبتوں کو تحلیل کرتا ہے، اور بچوں کے معدے کے لیے بہت مفید ہے۔ کتاب اسے رحم کی ہواؤں کے لیے بھی بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.427}۔"
  es: "Una planta cuya potencia es similar a la del ajenjo con bayas de belladona. Alivia y calma la flatulencia y los gases, en particular, disuelve los humores pegajosos del estómago y es muy beneficiosa para el estómago de los niños. El libro también la menciona para los gases uterinos {cite:canon-ibn-sina-print-v1 p.427}."
  fr: "Une plante dont la vigueur est comparable à celle de l'absinthe associée à la belladone. Elle soulage les flatulences et les gaz en particulier, dissout les humeurs visqueuses de l'estomac et est très bénéfique pour l'estomac des enfants. Le livre la mentionne également pour les gaz utérins {cite:canon-ibn-sina-print-v1 p.427}."
  tr: "Gücü pelin ve bektaşi üzümüne benzer, özellikle şişkinlik ve rüzgar için bir ağrı kesicidir, midedeki yapışkan nemi parçalar ve erkek çocukların midesi için çok faydalıdır. Ayrıca rahim rüzgarlarından da bahseder {cite:canon-ibn-sina-print-v1 s.427}."
  id: "Kekuatannya mirip dengan wormwood dan gooseberry, ini adalah pereda nyeri terutama untuk perut dan angin, memecah kelembapan lengket di perut dan sangat bermanfaat untuk perut anak laki-laki. Juga disebutkan angin rahim {cite:canon-ibn-sina-print-v1 hlm.427}."
