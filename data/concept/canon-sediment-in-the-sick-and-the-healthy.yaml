id: concept/canon-sediment-in-the-sick-and-the-healthy
class: concept
kind: scientific
label:
  ar: "الرسوب عند المرضى والأصحاء والسمان والقضاف عند ابن سينا"
  en: "Sediment in the sick and the healthy, the fat and the lean, in the Canon"
  fr: "Sédiment chez malades et bien-portants, maigres et corpulents dans le Canon"
  ur: "بیماروں، تندرستوں، موٹوں اور دبلوں میں تلچھٹ قانون میں"
  es: "Sedimento en los enfermos y en los sanos, en los gordos y en los delgados, en el Canon"
summary:
  ar: "يبين ابن سينا أن طلب الرسوب الجيد يكون في المرض لا في الصحة، وأن الرسوب يقل عند القضاف ويكثر عند السمان، وأن المريض النحيف لا يتوقع منه ما يتوقع من السمين. {cite:canon-ibn-sina-print-v1 p.193}."
  en: "Ibn Sina says good sediment is looked for in illness, not in health, and that it is scarce in the lean and plentiful in the fat, so a thin patient is not expected to show what a stout one does. {cite:canon-ibn-sina-print-v1 p.193}."
  fr: "Ibn Sina recherche le bon sédiment en maladie, non en santé : rare chez le maigre, abondant chez le corpulent ; un malade maigre ne présenterait donc pas nécessairement les mêmes signes. {cite:canon-ibn-sina-print-v1 p.193}."
  es: "Ibn Sina afirma que la buena sedimentación se busca en la enfermedad, no en la salud, y que es escasa en los delgados y abundante en los obesos, por lo que no se espera que un paciente delgado muestre lo mismo que uno corpulento. {cite:canon-ibn-sina-print-v1 p.193}."
