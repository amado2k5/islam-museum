summary:
  ar: "يبين ابن سينا أن طلب الرسوب الجيد يكون في المرض لا في الصحة، وأن الرسوب يقل عند القضاف ويكثر عند السمان، وأن المريض النحيف لا يتوقع منه ما يتوقع من السمين. {cite:canon-ibn-sina-print-v1 p.193}."
  en: "Ibn Sina says good sediment is looked for in illness, not in health, and that it is scarce in the lean and plentiful in the fat, so a thin patient is not expected to show what a stout one does. {cite:canon-ibn-sina-print-v1 p.193}."
