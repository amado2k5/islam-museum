label: { ar: "شهور الفرس والأيام الخمسة الملحقة", en: "The Persian months and the five added days", ur: "فارسی مہینے اور پانچ ملحق دن", es: "Los meses persas y los cinco días añadidos", fr: "Les mois persans et les cinq jours supplémentaires", tr: "Atın ayları ve ona bağlı beş gün", id: "Bulan-bulan kuda dan lima hari yang terkait" }
summary:
  ar: "يعدد البتاني شهور الفرس من فروردين، ويبين أن النيروز أول يوم منه، وأن الأيام الخمسة الملحقة في آخر السنة لا تُعد من الشهور؛ فجميع أيام السنة الفارسية ثلاثمائة وخمسة وستون يوماً بلا كسر. {cite:zij-sabi-nallino-byblion p.101}."
  en: "Al-Battani lists the Persian months from Farvardin, says Nawruz is the first day of the year, and states that the five added days at the end are not counted in the months. The whole Persian year is three hundred and sixty-five days without fraction. {cite:zij-sabi-nallino-byblion p.101}."
  ur: "البتانی فارسی مہینے فروردین سے گنواتے ہیں، کہتے ہیں کہ نوروز سال کا پہلا دن ہے، اور آخر کے پانچ ملحق دن مہینوں میں شمار نہیں ہوتے؛ پوری فارسی سال تین سو پینسٹھ دن کا ہے بغیر کسی کسر کے۔ {cite:zij-sabi-nallino-byblion p.101}۔"
  es: "Al-Battani enumera los meses persas desde Farvardin, indica que Nawruz es el primer día del año y afirma que los cinco días adicionales al final no se cuentan en los meses. El año persa completo tiene trescientos sesenta y cinco días sin fracciones. {cite:zij-sabi-nallino-byblion p.101}."
  fr: "Al-Battani énumère les mois persans à partir de Farvardin, indique que Nawruz est le premier jour de l'année et précise que les cinq jours supplémentaires à la fin ne sont pas comptabilisés dans les mois. L'année persane compte trois cent soixante-cinq jours. {cite:zij-sabi-nallino-byblion p.101}."
  tr: "El-Battani, Fars aylarını Farvardin'den başlayarak sıralar ve Nevruz'un bu ayın ilk günü olduğunu, yılın sonuna eklenen beş günün ise ay olarak sayılmadığını belirtir; böylece tüm Fars yılı, kesirler olmaksızın üç yüz altmış beş günden oluşur. {cite:zij-sabi-nallino-byblion s.101}."
  id: "Al-Battani mencantumkan bulan-bulan Persia mulai dari Farvardin, dan menyatakan bahwa Nowruz adalah hari pertama bulan tersebut, dan bahwa lima hari yang ditambahkan di akhir tahun tidak dihitung sebagai bulan; dengan demikian, seluruh tahun Persia terdiri dari tiga ratus enam puluh lima hari tanpa pecahan. {cite:zij-sabi-nallino-byblion p.101}."
