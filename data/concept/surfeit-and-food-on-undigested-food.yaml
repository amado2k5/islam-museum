id: concept/surfeit-and-food-on-undigested-food
class: concept
kind: scientific
label: { ar: "التخمة وإدخال الغذاء على غذاء لم ينهضم", en: "Surfeit and food taken on undigested food", ur: "بدہضمی اور ہضم نہ ہوئی غذا پر مزید غذا" }
summary:
  ar: "يقول ابن سينا إن أضر شيء بالبدن إدخال غذاء على غذاء لم ينضج وينهضم، وإن التخمة من الأغذية الغليظة تورث وجع المفاصل والكلى والربو وضيق النفس، ومن اللطيفة حميات حادة خبيثة وأورام حادة رديئة، وإن العادة قد تقتضي أحياناً أن يتبع طعام بما يشبه الدواء له {cite:canon-ibn-sina-print-v1 pp.228-229}."
  en: "Ibn Sina says the most harmful thing for the body is to add food to food not yet ripened and digested; surfeit from coarse foods brings joint and kidney pain, asthma and tight breath, and from light foods acute malignant fevers and acute bad swellings; yet sometimes one food is added to another so as to act like a remedy for it {cite:canon-ibn-sina-print-v1 pp.228-229}."
