id: concept/surfeit-and-food-on-undigested-food
class: concept
kind: scientific
label: { ar: "التخمة وإدخال الغذاء على غذاء لم ينهضم", en: "Surfeit and food taken on undigested food", ur: "بدہضمی اور ہضم نہ ہوئی غذا پر مزید غذا", es: "Exceso de comida y alimentos no digeridos", fr: "Surconsommation et aliments ingérés non digérés" }
summary:
  ar: "يقول ابن سينا إن أضر شيء بالبدن إدخال غذاء على غذاء لم ينضج وينهضم، وإن التخمة من الأغذية الغليظة تورث وجع المفاصل والكلى والربو وضيق النفس، ومن اللطيفة حميات حادة خبيثة وأورام حادة رديئة، وإن العادة قد تقتضي أحياناً أن يتبع طعام بما يشبه الدواء له {cite:canon-ibn-sina-print-v1 pp.228-229}."
  en: "Ibn Sina says the most harmful thing for the body is to add food to food not yet ripened and digested; surfeit from coarse foods brings joint and kidney pain, asthma and tight breath, and from light foods acute malignant fevers and acute bad swellings; yet sometimes one food is added to another so as to act like a remedy for it {cite:canon-ibn-sina-print-v1 pp.228-229}."
  es: "Ibn Sina dice que lo más perjudicial para el cuerpo es añadir alimentos a alimentos que aún no han madurado ni se han digerido; el exceso de alimentos toscos provoca dolor en las articulaciones y los riñones, asma y dificultad para respirar, y los alimentos ligeros fiebres malignas agudas e hinchazones graves agudas; sin embargo, a veces se añade un alimento a otro para que actúe como remedio para este último {cite:canon-ibn-sina-print-v1 pp.228-229}."
  fr: "Ibn Sina dit que la chose la plus nuisible pour le corps est d'ajouter de la nourriture à des aliments qui ne sont pas encore mûrs et digérés; la surabondance d'aliments grossiers provoque des douleurs articulaires et rénales, de l'asthme et une respiration difficile, et celle d'aliments légers des fièvres malignes aiguës et des gonflements aigus; pourtant, il arrive parfois qu'un aliment soit ajouté à un autre afin d'agir comme un remède pour celui-ci {cite:canon-ibn-sina-print-v1 pp.228-229}."
  ur: "ابن سینا کا کہنا ہے کہ جسم کے لیے سب سے زیادہ نقصان دہ چیز کھانے کو کھانا پکانا اور ہضم نہیں کرنا ہے۔ موٹے کھانوں سے سرفیٹ جوڑوں اور گردے میں درد، دمہ اور سانس کی تنگی، اور ہلکے کھانے سے شدید مہلک بخار اور شدید خراب سوجن؛ پھر بھی بعض اوقات ایک کھانے کو دوسرے کھانے میں شامل کیا جاتا ہے تاکہ اس کے علاج کی طرح کام کیا جاسکے۔"
