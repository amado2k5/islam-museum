id: concept/alamat-tamyiz-qaranitus-al-haqiqi-min-al-mushtarak
class: concept
kind: scientific
label:
  ar: "علامات التمييز بين قرانيطس الحقيقي وغير الحقيقي"
  en: "Signs that tell true qaranitus from the kind by sharing"
  fr: "Signes qui distinguent le véritable qaranitus de la forme par participation"
  ur: "حقیقی قرانیطس کو مشارکت والے سے الگ کرنے کی علامات"
  es: "Señales que distinguen a los verdaderos qaranitus de los falsos compartiendo"
summary:
  ar: "يبيّن ابن سينا كيف يُعرف السرسام الكائن بالمشاركة من الحقيقي: بوقوعه دفعة وتبعيته لسوء حال عضو آخر، وبما يتقدمه من علامات الصدر وذات الجنب، وما يُحسّ في فم المعدة، وأن أورام الأعضاء الأخرى لا تؤدي إلى اختلاط العقل ما لم تكن ظاهرة {cite:canon-ibn-sina-print-v2 p.79}"
  en: "Ibn Sina shows how the sarsam by sharing is told from the true one: by its coming all at once and following the bad state of another organ, by the signs of the chest and of dhat al-janb that come before it, by what is felt at the mouth of the stomach, and by the fact that swellings of other organs do not lead to confusion of mind unless they are plain {cite:canon-ibn-sina-print-v2 p.79}"
  fr: "Ibn Sina montre comment distinguer le sarsam par participation du véritable sarsam : par son apparition soudaine à la suite du mauvais état d’un autre organe, par les signes de la poitrine et de la dhat al-janb qui le précèdent, par les sensations à l’orifice de l’estomac et par le fait que les tuméfactions d’autres organes ne conduisent à une confusion de l’esprit que si elles sont manifestes. {cite:canon-ibn-sina-print-v2 p.79}"
  ur: "ابن سینا بتاتا ہے کہ مشارکت سے ہونے والا سرسام حقیقی سے کیسے پہچانا جاتا ہے: اس کے اچانک آنے اور کسی اور عضو کی خرابی کے پیچھے آنے سے، سینے اور ذات الجنب کی ان علامات سے جو اس سے پہلے آتی ہیں، معدے کے منہ میں محسوس ہونے والی چیز سے، اور اس سے کہ دوسرے اعضا کی سوجنیں جب تک ظاہر نہ ہوں عقل کے اختلاط تک نہیں لے جاتیں {cite:canon-ibn-sina-print-v2 p.79}۔"
  es: "Ibn Sina muestra cómo se distingue el sarsam por el verdadero: por su aparición repentina y posterior al mal estado de otro órgano, por los signos del pecho y de dhat al-janb que lo preceden, por lo que se siente en la boca del estómago y por el hecho de que las hinchazones de otros órganos no provocan confusión mental a menos que sean evidentes {cite:canon-ibn-sina-print-v2 p.79}"
