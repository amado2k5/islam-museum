id: concept/canon-signs-that-purging-has-done-its-work
class: concept
kind: scientific
label:
  ar: "علامات بلوغ الإسهال غايته عند ابن سينا"
  en: "Signs that purging has done its work in the Canon"
  fr: "Signes d’une purge achevée dans le Canon"
  ur: "اسہال کے اپنے کام کو پہنچنے کی علامات قانون میں"
  es: "Señales de que la purga ha surtido efecto en el Canon"
  tr: "İbn Sina'ya göre ishal belirtileri hedefine ulaşıyor"
  id: "Tanda-tanda Diare Mencapai Tujuannya menurut Ibn Sina"
summary:
  ar: "يعد ابن سينا من علامات تمام التنقية أن يتغير الخلط المستفرغ إلى خلط آخر، وأن ينام المستفرغ نوماً شديداً عقيب الإسهال أو القيء، وأن يشتد العطش، وأما الاضطراب فعلامة أن الدواء يستفرغ غير الفضول، وأما الخراطة والشيء الأسود المنتن فرديء {cite:canon-ibn-sina-print-v1 p.278}."
  en: "Ibn Sina counts as signs of complete cleansing that the evacuated humour changes into another, that sound sleep follows the purge or vomit and that thirst grows strong, while agitation means the drug is drawing out something other than the surplus, and a scraping or black stinking matter is bad {cite:canon-ibn-sina-print-v1 p.278}."
  fr: "Ibn Sina reconnaît le nettoyage complet au changement de l’humeur évacuée, au sommeil profond après purge ou vomissement et à forte soif ; l’agitation indiquerait évacuation d’autre chose que le superflu, les raclures ou matières noires et fétides seraient mauvaises {cite:canon-ibn-sina-print-v1 p.278}."
  es: "Ibn Sina considera signos de limpieza completa que el humor evacuado se transforma en otro, que un sueño profundo sigue a la purga o al vómito y que la sed se intensifica, mientras que la agitación significa que el medicamento está extrayendo algo más que el excedente, y una sustancia negra, fétida o raspante es mala {cite:canon-ibn-sina-print-v1 p.278}."
  ur: "ابن سینا نے مکمل صفائی کی علامات میں شمار کیا ہے کہ خالی ہونے والا مزاح دوسرے میں بدل جاتا ہے، یہ کہ نیند صاف ہونے یا قے کے بعد آتی ہے اور پیاس مضبوط ہوتی ہے، جب کہ مشتعل ہونے کا مطلب ہے کہ دوا اضافی کے علاوہ کوئی چیز نکال رہی ہے، اور کھرچنے والی یا کالی بدبودار چیز خراب ہے۔"
  tr: "İbn Sina, tam arınmanın işaretlerinden birinin, kusma balgamının başka bir karışıma dönüşmesi, kusan kişinin ishal veya kusmadan sonra derin uykuya dalması ve susuzluğun şiddetlenmesi olduğunu düşünür. Rahatsızlık ise ilacın sadece meraktan kusuğunun işaretidir; inatçı siyah madde ise saf değildir {cite:canon-ibn-sina-print-v1 s.278}."
  id: "Ibn Sina menganggap salah satu tanda pemurnian total adalah dahak yang muntah berubah menjadi campuran lain, bahwa orang yang muntah tidur nyenyak setelah diare atau muntah, dan dahaga semakin kuat. Adapun gangguan, ini adalah tanda bahwa obat muntah kecuali karena rasa ingin tahu, sementara zat hitam yang membandel itu tidak murni {cite:canon-ibn-sina-print-v1 hlm.278}."
