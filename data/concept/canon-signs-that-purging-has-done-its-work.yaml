label: { ar: "علامات بلوغ الإسهال غايته عند ابن سينا", en: "Signs that purging has done its work in the Canon", ur: "اسہال کے اپنے کام کو پہنچنے کی علامات قانون میں" }
summary:
  ar: "يعد ابن سينا من علامات تمام التنقية أن يتغير الخلط المستفرغ إلى خلط آخر، وأن ينام المستفرغ نوماً شديداً عقيب الإسهال أو القيء، وأن يشتد العطش، وأما الاضطراب فعلامة أن الدواء يستفرغ غير الفضول، وأما الخراطة والشيء الأسود المنتن فرديء {cite:canon-ibn-sina-print-v1 p.278}."
  en: "Ibn Sina counts as signs of complete cleansing that the evacuated humour changes into another, that sound sleep follows the purge or vomit and that thirst grows strong, while agitation means the drug is drawing out something other than the surplus, and a scraping or black stinking matter is bad {cite:canon-ibn-sina-print-v1 p.278}."
