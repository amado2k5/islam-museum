label:
  ar: "القصر ⁦(الألكازار)⁩"
  en: "Alcazar (from the Arabic al-qasr, castle in Spanish)"
  fr: "Alcazar (de l’arabe al-qasr, « château » en espagnol)"
  es: "Alcázar (del árabe al-qasr, castillo en español)"
summary:
  ar: "الألكازار، لفظ إسباني من العربية ⁦(القصر)⁩، ويعني القلعة والحصن، ومن أشهر الألكازارات قصور إشبيلية وقرطبة وسيغوفيا وطليطلة، ويُطلق الاسم كذلك على بلدان كثيرة، منها ألكازار دي سان خوان، وألكازار كيفير، أي القصر الكبير بالمغرب {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  en: "Alcazar, a Spanish word from the Arabic al-qasr, meaning castle or citadel. The Alcazars of Seville, Cordova, Segovia and Toledo are famous, and the name is also used for many places, among them Alcazar de San Juan and Alcazarquivir, the Spanish name of Ksar al-Kabir in Morocco {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  fr: "Alcazar est un mot espagnol issu de l’arabe al-qasr, qui signifie « château » ou « citadelle ». Les alcazars de Séville, de Cordoue, de Ségovie et de Tolède sont célèbres ; ce nom désigne aussi de nombreux lieux, dont Alcázar de San Juan et Alcazarquivir, nom espagnol de Ksar el-Kébir au Maroc {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  es: "Alcázar, palabra española derivada del árabe al-qasr, que significa castillo o ciudadela. Los alcázares de Sevilla, Córdoba, Segovia y Toledo son famosos, y el nombre también se usa para muchos lugares, entre ellos el Alcázar de San Juan y el Alcazarquivir, nombre español de Ksar al-Kabir en Marruecos {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
