label:
  ar: "القصر (الألكازار)"
  en: "Alcazar (from the Arabic al-qasr, castle in Spanish)"
summary:
  ar: "الألكازار، لفظ إسباني من العربية (القصر)، ويعني القلعة والحصن، ومن أشهر الألكازارات قصور إشبيلية وقرطبة وسيغوفيا وطليطلة، ويُطلق الاسم كذلك على بلدان كثيرة، منها ألكازار دي سان خوان، وألكازار كيفير، أي القصر الكبير بالمغرب {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
  en: "Alcazar, a Spanish word from the Arabic al-qasr, meaning castle or citadel. The Alcazars of Seville, Cordova, Segovia and Toledo are famous, and the name is also used for many places, among them Alcazar de San Juan and Alcazarquivir, the Spanish name of Ksar al-Kabir in Morocco {cite:encyclopaedia-of-islam-2 vol. 1 p. 380}."
