class: "concept"
kind: "scientific"
label:
  ar: "وجع الأذن"
  en: "Earache (waja' al-udhun)"
  ur: "کان کا درد"
  es: "Dolor de oído (waja' al-udhun)"
  fr: "Mal d'oreille (waja' al-udhun)"
  tr: "kulak ağrısı"
  id: "sakit telinga"
summary:
  ar: "وجع الأذن إما أن يكون من سوء مزاج — حار بسبب هواء حار وريح حارة أو اغتسال بماء حار دخل الأذن أو بمادة دموية أو صفراوية، أو بارد بلا مادة أو بمادة ريحية باردة أو خلطية لحجة — أو بسبب ورم أو بثور أو بسبب تفرق اتصال كريح تمدد أو قروح وجراحات أو ماء يدخلها أو حيوان يخلص إلى صماخها أو دود يتولد فيها أو عقيب سقطة أو ضربة؛ وأصعب أوجاعها ما كان عن ورم حار غائص مع حمى لازمة، وقد يقتل بغتة كما تقتل السكتة وهو أقتل للشاب منه للشيخ {cite:canon-ibn-sina-print-v2 p.222}"
  en: "Earache is either from a bad temperament — hot, from hot air and hot winds, washing with hot water entering the ear, or a sanguine or bilious matter; or cold without matter, or with a cold windy or sticky humoral matter — or from a swelling or pustules, or from loss of continuity: a stretching wind, ulcers and wounds, water entering, an animal reaching the meatus, worms breeding in it, or after a fall or blow. The worst earaches are from a deep-lying hot swelling with a continued fever; it may kill suddenly as apoplexy kills, and kills the young more than the old {cite:canon-ibn-sina-print-v2 p.222}"
  ur: "کان کا درد یا تو سوء مزاج سے ہے — گرم، گرم ہوا اور گرم ہواؤں سے، یا گرم پانی سے نہانے کے اندر جانے سے، یا دمی یا صفراوی مادے سے؛ یا سرد بغیر مادے کے یا سرد ریحی یا لعاب دار خلطی مادے کے ساتھ — یا ورم یا دانوں سے، یا انحلال اتصال سے: پھیلانے والی ہوا، پھوڑے اور زخم، پانی کا اندر جانا، کسی جانور کا صماخ تک پہنچنا، اس میں کیڑوں کا پیدا ہونا، یا گرنے یا ضرب کے بعد؛ اور اس کے سخت ترین درد وہ ہیں جو گہرے گرم ورم سے ہوں ساتھ مسلسل بخار ہو؛ یہ اچانک مار بھی سکتا ہے جیسے سکتہ مارتا ہے، اور جوان کو بوڑھے سے زیادہ مارتا ہے {cite:canon-ibn-sina-print-v2 p.222}"
  es: "El dolor de oído puede deberse a un mal temperamento: calor, por aire caliente y vientos calientes, lavado con agua caliente que entra en el oído, o una sustancia sanguínea o biliar; o frío sin sustancia, o con una sustancia humoral fría, ventosa o pegajosa; o a una inflamación o pústulas, o a la pérdida de continuidad: un gas que estira el oído, úlceras y heridas, entrada de agua, un animal que llega al meato, gusanos que se reproducen en él, o después de una caída o golpe. Los peores dolores de oído se deben a una inflamación caliente profunda con fiebre persistente; puede ser mortal repentinamente, como la apoplejía, y mata más a los jóvenes que a los ancianos {cite:canon-ibn-sina-print-v2 p.222}"
  fr: "L'otite peut être due à un mauvais tempérament: chaleur (due à l'air chaud, aux vents chauds, au lavage à l'eau chaude, à la présence de sang ou de bile); ou à un froid sans substance, ou accompagné d'une substance froide, venteuse ou collante; ou encore à un gonflement, des pustules ou une rupture du conduit auditif: vent étirant, ulcères, plaies, infiltration d'eau, présence d'un animal dans le conduit auditif, infestation parasitaire, ou suite à une chute ou un coup. Les otites les plus graves sont causées par un gonflement chaud et profond accompagné d'une fièvre persistante; elles peuvent être mortelles subitement, comme une apoplexie, et sont plus fréquentes chez les jeunes que chez les personnes âgées. {cite:canon-ibn-sina-print-v2 p.222}"
  tr: "Kulak ağrısı kötü huydan kaynaklanabilir — sıcak hava ve sıcak rüzgardan kaynaklanan sıcaklık, kulağa sıcak su giren yıkama, kanlı veya safra maddesi nedeniyle soğuk, soğuk bir madde içermeyen soğuk, soğuk rüzgar ya da bahane olarak esprili bir madde — ya da tümör, kabarcıklar, rüzgar, gerilme, ülser, yaralar, suyun girmesi, etine ulaşan hayvan, içinde doğan solucanlar veya düşme ya da darbe sonrası dağılım temasından; en şiddetli ağrı, inme gibi aniden öldürebilen sıcak tümörden kaynaklanır; bu ağrı, şeyhten çok gençler için daha ölümcül olan inme gibi ani öldürebilir. {cite:canon-ibn-sina-print-v2 s.222}"
  id: "Sakit telinga dapat disebabkan oleh temperamen buruk — panas akibat udara panas dan angin panas, atau mencuci dengan air panas yang masuk ke telinga, atau dengan zat berdarah atau empedu, atau dingin tanpa zat, atau dari angin dingin atau zat humoris sebagai alasan — atau karena tumor, lepuhan, atau akibat kontak penyebaran seperti angin, peregangan, tukak lambung, luka, air yang masuk, hewan yang mencapai meatusnya, cacing yang lahir di dalamnya, atau setelah jatuh atau terpukul; rasa sakit paling parah adalah tumor panas dengan demam yang terus-menerus, yang dapat membunuh secara tiba-tiba seperti stroke, yang lebih mematikan bagi anak muda daripada bagi sheikh {cite:canon-ibn-sina-print-v2 hlm.222}"
