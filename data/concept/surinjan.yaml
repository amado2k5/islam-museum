summary:
  ar: "السورنجان في الكتاب أصل نبات له ورد أبيض وأصفر يظهر أول ما يظهر في سفوح الجبال، أجوده الأبيض داخلاً الصلب المكسر، حار يابس إلى الثانية، فيه قوة مسهلة، ينفع من النقرس ويسكن الوجع في الوقت ضماداً، ويضعف المعدة، والأحمر والأسود منه سم، ويذكر له نقلاً موسوماً في الباه {cite:canon-ibn-sina-print-v1 p.589}."
  en: "Surinjan is in the book the root of a plant with white and yellow flowers appearing first on the slopes of mountains, best when white within and hard when broken, hot and dry to the second degree, with a purgative power; it helps gout and calms its pain at once as a poultice, but weakens the stomach, and the red and black are poison; the book gives a labelled listing on desire {cite:canon-ibn-sina-print-v1 p.589}."
  ur: "سورنجان کتاب میں ایک پودے کی جڑ ہے جس کا پھول سفید اور زرد ہے اور پہاڑوں کے دامن میں سب سے پہلے نمودار ہوتا ہے، بہترین وہ جو اندر سے سفید اور توڑنے میں سخت ہو، دوسرے درجے تک گرم خشک، مسہل قوت رکھتا ہے؛ نقرس میں مفید ہے اور لیپ سے فوراً درد کو تسکین دیتا ہے، مگر معدے کو کمزور کرتا ہے، اور سرخ اور سیاہ زہر ہیں؛ کتاب باہ کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.589}۔"
  es: "Surinjan es en el libro la raíz de una planta con flores blancas y amarillas que aparece primero en las laderas de las montañas, mejor cuando es blanca por dentro y dura al romperse, caliente y seca en segundo grado, con poder purgante; ayuda a la gota y calma su dolor de inmediato como cataplasma, pero debilita el estómago, y las variedades roja y negra son venenosas; el libro da una lista etiquetada sobre el deseo {cite:canon-ibn-sina-print-v1 p.589}."
  fr: "Le surinjan est décrit dans le livre comme la racine d'une plante aux fleurs blanches et jaunes, apparaissant d'abord sur les pentes des montagnes, meilleure lorsqu'elle est blanche à l'intérieur et dure lorsqu'on la casse, chaude et sèche au second degré, avec un pouvoir purgatif; elle aide à soulager la goutte et calme immédiatement la douleur sous forme de cataplasme, mais affaiblit l'estomac, et les parties rouges et noires sont toxiques; le livre donne une liste légendée sur le désir {cite:canon-ibn-sina-print-v1 p.589}."
  tr: "Kitaptaki surangan, ilk kez dağ yamaçlarında ortaya çıkan beyaz ve sarı güllere sahip bir bitkinin kökenidir. Beyazı, sertleşmiş ve kırık formun içinde en bol olanıdır, saniyesine kadar sıcak ve kurudur, müshil gücüne sahiptir, gut için faydalıdır, ağrıyı bir kompres olarak yatıştırır, mideyi zayıflatır, kırmızı ve siyah zehirdir ve Bah {cite:canon-ibn-sina-print-v1 s.589} başlıklı bir anlatımda bahsedilir."
  id: "Surangan dalam buku ini adalah asal mula tumbuhan dengan mawar putih dan kuning yang pertama kali muncul di lereng gunung. Warna putihnya paling melimpah di dalam bentuk yang keras dan rusak, panas dan kering hingga yang kedua, memiliki kekuatan pencahar, bermanfaat untuk asam urat, meredakan rasa sakit sebagai rabunan, melemahkan perut, merah dan hitam adalah racun, dan disebutkan dalam narasi berjudul Bah {cite:canon-ibn-sina-print-v1 hlm.589}."
