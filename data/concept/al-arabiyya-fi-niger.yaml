id: concept/al-arabiyya-fi-niger
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في النيجر"
  en: "Arabic in Niger"
  ur: "نائجر میں عربی"
  fr: "l'arabe au Niger"
  es: "el árabe en Níger"
  tr: "Nijer'de Arapça"
  id: "Bahasa Arab di Niger"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في النيجر: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. وفي النيجر تغيّرت المكانة القانونية للعربية بميثاق الانتقال لسنة 2025 بحسب الملخص، ولا يوجد عدد رسمي للمتكلمين. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Niger: its legal status, the varieties spoken and the official figures, each as the summary gives it. In Niger the legal place of Arabic changed with the transitional charter of 2025, according to the summary, and no official count of speakers was found. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ نائجر میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ نائجر میں خلاصے کے مطابق 2025 کے عبوری منشور سے عربی کی قانونی حیثیت بدل گئی، اور بولنے والوں کی کوئی سرکاری گنتی نہیں ملی۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe au Niger : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. Au Niger, la place juridique de l'arabe a changé avec la charte de transition de 2025, selon le résumé, et aucun décompte officiel de locuteurs n'a été trouvé. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Níger: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. En Níger el lugar jurídico del árabe cambió con la carta de transición de 2025, según el resumen, y no se encontró ningún recuento oficial de hablantes. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
  tr: "Bu sayfa, müzenin sunduğu bir araştırma özetinin Nijer'deki Arapça hakkında söylediklerini sunmaktadır: yasal statüsü, konuşulan çeşitleri ve alınan resmi numaralar. Nijer'de, Arapçanın yasal statüsü özete göre 2025 Geçiş Şartı'na göre değişti ve resmi konuşmacı sayısı yok. Müze, özet olarak adlandırdığı sayfaları açmadı ve kurucu, 21 Kasım 2026'da belirtildiği gibi kullanımına izin verdi. Özet, resmi bir kaynak veya numara bulunmadığını belirttiği için, sayfa kendi kelimeleriyle bunu söylüyor ve müze kendi hesabından bir numara içermiyor."
  id: "Halaman ini menyajikan apa yang dikatakan ringkasan penelitian yang disediakan museum tentang bahasa Arab di Niger: status hukumnya, varietas yang digunakan, dan nomor resmi yang diterima. Di Niger, status hukum bahasa Arab berubah sesuai dengan Piagam Transisi 2025 sesuai ringkasan, dan tidak ada jumlah penutur resmi. Museum tidak membuka halaman yang disebut ringkasan, dan pendiri mengizinkan penggunaannya seperti yang dinyatakan pada 21 November 2026. Karena ringkasan menyatakan tidak ada sumber atau nomor resmi, halaman tersebut menyatakan hal ini dengan kata-katanya sendiri, dan museum tidak menyertakan nomor dari akun mereka sendiri."
