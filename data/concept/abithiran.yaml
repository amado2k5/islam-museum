summary:
  ar: "عبيثران في الكتاب دواء محلل ينفع من الأمراض الباردة في الدماغ ويمنع زكام البرودة وماؤه كحلاً يحد البصر {cite:canon-ibn-sina-print-v1 p.610}"
  en: "Abithiran is in the book a dissolving drug which benefits cold diseases of the brain, prevents cold catarrh, and whose water as a collyrium sharpens sight {cite:canon-ibn-sina-print-v1 p.610}"
  fr: "L'abithiran est, dans le livre, une drogue résolutive, utile contre les maladies froides du cerveau, qui prévient le catarrhe froid et dont l'eau, employée en collyre, aiguise la vue {cite:canon-ibn-sina-print-v1 p.610}"
  ur: "عبیثران کتاب میں ایک گھلانے والی دوا ہے جو دماغ کے سرد امراض میں فائدہ دیتی اور سرد زکام کو روکتی ہے، اور اس کا پانی سرمے کے طور پر نظر تیز کرتا ہے {cite:canon-ibn-sina-print-v1 p.610}۔"
  es: "En el libro, Abithiran es un fármaco disolvente que beneficia las enfermedades cerebrales causadas por el frío, previene el catarro por frío y cuya agua, como colirio, agudiza la vista {cite:canon-ibn-sina-print-v1 p.610}."
  tr: "Kitapta, Abithran seyreltilebilir bir ilaçtır; soğuk algınlığı hastalıklarını önlemeye yardımcı olur, soğuk algınlığını önler ve suyu görme kısıtlamasıdır {cite:canon-ibn-sina-print-v1 s.610}"
  id: "Dalam buku tersebut, Abithran adalah obat yang dapat diencerkan yang membantu mencegah penyakit otak pilek, mencegah flu, dan airnya adalah pembatas penglihatan {cite:canon-ibn-sina-print-v1 hlm.610}"
