  en: "Wedding feast and wedding rites (irs)"
  ur: "عرس"
summary:
  ar: "العرس في اللغة مهنة الإملاك والبناء، وقيل هو اسم لطعام العرس خاصة، والعروس وصف يستوي فيه الذكر والأنثى ما داما في إعراسهما، والزفاف لغة إهداء الزوجة إلى زوجها، والعرس أعم منه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}. وذهب المالكية والشافعية إلى أن العروس لا يتخلف عن الجماعات وأعمال البر مدة الزفاف إلا ليلاً، وأجاز الحنابلة له التخلف لأنسه بزوجته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545}. وليمة العرس مشروعة بالإجماع، وهي سنة مؤكدة عند جمهور الفقهاء، وإجابة الدعوى إليها واجبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546}. ويستحب تهنئة العروس والدعاء له، وكره الشافعية قول «بالرفاء والبنين» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. ويستحب للزوج أن يأخذ بناصية زوجته ويدعو، ويستحب إعلان النكاح بالدف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. وفي القسم، يقضي الزوج للجديدة البكر سبعاً وللثيب ثلاثاً عند الجمهور، مع خلاف في ذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11548}."
  en: "In the lexicon, irs is the marriage arrangement and the building of the home; some say it is the name of the wedding feast alone. Arus denotes both bride and groom while they are at their wedding, and zifaf is the handing over of the bride to her husband, a narrower word than irs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}. The Malikis and Shafi'is hold that the bridegroom may not leave congregational prayer and works of piety during the wedding days except at night; the Hanbalis allow him to stay with his bride to be at ease with her {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545}. The wedding feast (walima) is prescribed by consensus; for most jurists it is a confirmed sunna, but accepting the invitation to it is obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546}. Congratulating the couple and praying for them is recommended, and the Shafi'is disliked the saying 'with harmony and children' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. The husband is recommended to take his bride by the forelock and pray, and the marriage is to be announced with the drum {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. On the division of nights, the majority give a new bride seven nights if she is a virgin and three if she is a widow or divorcee, with disagreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11548}."
