label:
  ar: "العُرْس"
  en: "Wedding feast and wedding rites (irs)"
  ur: "عرس"
  es: "Banquete nupcial y ritos nupciales (IRS)"
  fr: "Festin de mariage et rites de mariage (irs)"
summary:
  ar: "العرس في اللغة مهنة الإملاك والبناء، وقيل هو اسم لطعام العرس خاصة، والعروس وصف يستوي فيه الذكر والأنثى ما داما في إعراسهما، والزفاف لغة إهداء الزوجة إلى زوجها، والعرس أعم منه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}. وذهب المالكية والشافعية إلى أن العروس لا يتخلف عن الجماعات وأعمال البر مدة الزفاف إلا ليلاً، وأجاز الحنابلة له التخلف لأنسه بزوجته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545}. وليمة العرس مشروعة بالإجماع، وهي سنة مؤكدة عند جمهور الفقهاء، وإجابة الدعوى إليها واجبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546}. ويستحب تهنئة العروس والدعاء له، وكره الشافعية قول «بالرفاء والبنين» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. ويستحب للزوج أن يأخذ بناصية زوجته ويدعو، ويستحب إعلان النكاح بالدف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. وفي القسم، يقضي الزوج للجديدة البكر سبعاً وللثيب ثلاثاً عند الجمهور، مع خلاف في ذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11548}."
  en: "In the lexicon, irs is the marriage arrangement and the building of the home; some say it is the name of the wedding feast alone. Arus denotes both bride and groom while they are at their wedding, and zifaf is the handing over of the bride to her husband, a narrower word than irs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}. The Malikis and Shafi'is hold that the bridegroom may not leave congregational prayer and works of piety during the wedding days except at night; the Hanbalis allow him to stay with his bride to be at ease with her {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545}. The wedding feast (walima) is prescribed by consensus; for most jurists it is a confirmed sunna, but accepting the invitation to it is obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546}. Congratulating the couple and praying for them is recommended, and the Shafi'is disliked the saying 'with harmony and children' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. The husband is recommended to take his bride by the forelock and pray, and the marriage is to be announced with the drum {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. On the division of nights, the majority give a new bride seven nights if she is a virgin and three if she is a widow or divorcee, with disagreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11548}."
  es: "En el léxico, irs es el arreglo matrimonial y la construcción del hogar; algunos dicen que es el nombre del banquete de bodas solamente. Arus denota tanto a la novia como al novio mientras están en su boda, y zifaf es la entrega de la novia a su esposo, una palabra más específica que irs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}. Los malikíes y shafi'ís sostienen que el novio no puede abandonar la oración congregacional y las obras de piedad durante los días de la boda excepto por la noche; los hanbalíes le permiten quedarse con su novia para estar cómodo con ella {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545}. El banquete de bodas (walima) está prescrito por consenso; Para la mayoría de los juristas es una sunna confirmada, pero aceptar la invitación es obligatorio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546}. Se recomienda felicitar a la pareja y orar por ellos, y a los shafi'ís les disgustaba la expresión \"con armonía e hijos\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. Se recomienda al esposo tomar a su novia por el mechón de pelo y orar, y el matrimonio debe anunciarse con el tambor {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. En cuanto a la división de las noches, la mayoría concede a una recién casada siete noches si es virgen y tres si es viuda o divorciada, con desacuerdo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11548}."
  fr: "Dans le lexique, irs désigne l'organisation du mariage et la construction du foyer; certains affirment qu'il s'agit uniquement du nom du festin de noces. Arus désigne à la fois la mariée et le marié pendant leur mariage, et zifaf désigne la remise de la mariée à son époux, un terme plus restreint qu'irs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}. Les Malikites et les Shafi'ites estiment que le marié ne doit pas s'abstenir de la prière en congrégation et des actes de piété pendant les jours de noces, sauf la nuit; les Hanbalites l'autorisent à rester auprès de sa femme pour être à son aise avec elle {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545}. Le festin de noces (walima) est prescrit par consensus. Pour la plupart des juristes, il s'agit d'une sunna confirmée, mais accepter l'invitation est obligatoire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546}. Il est recommandé de féliciter les époux et de prier pour eux, et les chaféites désapprouvaient l'expression « avec harmonie et enfants » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. Il est recommandé au mari de prendre sa fiancée par la mèche de cheveux et de prier, et le mariage doit être annoncé au son du tambour {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11547}. En ce qui concerne la répartition des nuits, la majorité accorde à une nouvelle mariée sept nuits si elle est vierge et trois si elle est veuve ou divorcée, avec des désaccords {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11548}."
  ur: "لغت میں، IRS شادی کا انتظام اور گھر کی تعمیر ہے۔ کچھ کہتے ہیں کہ یہ صرف شادی کی دعوت کا نام ہے۔ عروس سے مراد دولہا اور دلہن دونوں اپنی شادی کے وقت ہوتے ہیں، اور ضعف دلہن کو اس کے شوہر کے حوالے کرنا ہے، جو irs کے مقابلے میں ایک تنگ لفظ ہے۔ مالکیوں اور شافعیوں کا خیال ہے کہ دولہا رات کے علاوہ شادی کے دنوں میں نماز باجماعت اور تقویٰ کے کام نہیں چھوڑ سکتا۔ حنبلی اسے اپنی دلہن کے ساتھ رہنے کی اجازت دیتے ہیں تاکہ وہ اس کے ساتھ آرام سے رہے۔ شادی کی دعوت ⁦(ولیمہ)⁩ اتفاق رائے سے مشروع ہے۔ اکثر فقہاء کے نزدیک یہ سنت ثابت ہے، لیکن اس کی دعوت کو قبول کرنا واجب ہے۔ جوڑے کو مبارکباد دینا اور ان کے لیے دعا کرنا مستحب ہے، اور شافعی اس قول کو ناپسند کرتے ہیں کہ 'ہم آہنگی اور بچوں کے ساتھ'۔ شوہر کو سفارش کی جاتی ہے کہ وہ اپنی دلہن کو پیشانی کے ساتھ لے جائے اور نماز پڑھے، اور نکاح کا اعلان ڈھول کے ساتھ کیا جائے۔ راتوں کی تقسیم پر، اکثریت نئی دلہن کو سات راتیں دیتی ہے اگر وہ کنواری ہو اور تین راتیں اگر وہ بیوہ یا طلاق یافتہ ہو، اختلاف کے ساتھ۔"
