  ar: "السمندل عند القدماء دابة تقع في النار فلا تحترق وتطفئ ما نزلت فيه، وذكره الدميري من عجائب الدواب وضعف خبره كثير من أهل النقل: سطر من أساطير الطبيعة لا من متن الحديث."
  en: "The samandal of the ancients: a creature that falls into fire unburned and quenches what it lands in; al-Damiri lists it among the marvels of beasts while most of the transmitters weaken the tale — a line from the mythology of nature, not the hadith canon."
