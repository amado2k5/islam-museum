summary:
  ar: "السمندل عند القدماء دابة تقع في النار فلا تحترق وتطفئ ما نزلت فيه، وذكره الدميري من عجائب الدواب وضعف خبره كثير من أهل النقل: سطر من أساطير الطبيعة لا من متن الحديث."
  en: "The samandal of the ancients: a creature that falls into fire unburned and quenches what it lands in; al-Damiri lists it among the marvels of beasts while most of the transmitters weaken the tale — a line from the mythology of nature, not the hadith canon."
  ur: "قدماء کا سمندر: وہ جاندار جو آگ میں گر کر نہ جلے اور جس چیز پر اترے اسے بجھا دے؛ دمیری نے اسے حیوانات کے عجائبات میں لکھا اور نقّاد نے اس کی خبر کمزور کہی — یہ فطرت کے اساطیر کا صفحہ ہے، حدیث کا متن نہیں۔"
  es: "El samandal de los antiguos: una criatura que cae al fuego sin quemarse y apaga lo que toca; al-Damiri lo incluye entre las maravillas de las bestias, mientras que la mayoría de los transmisores debilitan el relato; una línea de la mitología de la naturaleza, no del canon de los hadices."
  fr: "Le samandal des anciens: une créature qui tombe dans le feu sans se brûler et éteint ce dans quoi elle atterrit; al-Damiri le classe parmi les merveilles des bêtes tandis que la plupart des transmetteurs atténuent le récit — une ligne tirée de la mythologie de la nature, et non du canon des hadiths."
  tr: "Eski zamanlarda Selamendal, ateşe düşen, yanmayan ve kendisine vahyedileni söndüren bir hayvandı. El-Damiri onu hayvanların mucizeleri arasında anmış, ancak birçok verici bunu hadis metninden değil, doğal efsanelerden bir satır olarak belirtmiştir."
  id: "Salamandal, pada zaman dahulu, adalah hewan yang jatuh ke dalam api, tidak terbakar, dan memadamkan apa yang diwahyukan kepadanya. Al-Damiri menyebutnya sebagai salah satu keajaiban hewan, tetapi banyak pemancar menyebutnya sebagai baris dari legenda alam, bukan dari teks hadits."
