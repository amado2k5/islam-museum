id: concept/canon-timing-and-precautionary-venesection
class: concept
kind: scientific
label: { ar: "توقيت الفصد والفصد احتياطاً عند ابن سينا", en: "The timing of venesection and bleeding as a precaution in the Canon", ur: "قانون میں فصد کا وقت اور احتیاطاً فصد", es: "El momento de la flebotomía y la sangría como medida de precaución en el Canon", fr: "Le moment opportun pour la saignée et le saignement comme précaution dans le Canon" }
summary:
  ar: "يبين ابن سينا أن الفصد قد يكون احتياطاً بعد ضربة أو سقطة أو عند ورم يخاف انفجاره قبل نضجه، وأن الفصد في أوائل الأمراض الواقعة يرقق الفضول ويجريها في البدن فيؤخر إلى ظهور النضج، ولا يفصد في يوم حركة المرض {cite:canon-ibn-sina-print-v1 p.290}."
  en: "Ibn Sina explains that bleeding may be done as a precaution after a blow or a fall or when a swelling is feared to burst before it ripens, that bleeding in the early stage of a disease already fallen into thins the superfluities and runs them through the body so it is put off until ripening shows, and that no one is bled on the day the disease stirs {cite:canon-ibn-sina-print-v1 p.290}."
  es: "Ibn Sina explica que se puede realizar una sangría como medida de precaución después de un golpe o una caída, o cuando se teme que una hinchazón reviente antes de madurar; que la sangría en la etapa temprana de una enfermedad ya manifestada diluye las superfluidades y las distribuye por el cuerpo, de modo que se retrasa hasta que se muestre la maduración; y que a nadie se le practica una sangría el día en que la enfermedad se manifiesta {cite:canon-ibn-sina-print-v1 p.290}."
  fr: "Ibn Sina explique que la saignée peut être pratiquée par précaution après un coup ou une chute, ou lorsqu'on craint qu'un gonflement n'éclate avant d'être mûr, que la saignée au stade précoce d'une maladie déjà installée dilue les excès et les fait circuler dans le corps afin de retarder la guérison jusqu'à ce que la maturation se manifeste, et que personne n'est saigné le jour où la maladie se déclare {cite:canon-ibn-sina-print-v1 p.290}."
  ur: "ابن سینا تصریح کرتے ہیں کہ چوٹ لگنے یا گرنے کے بعد یا سوجن کے پکنے سے پہلے پھٹنے کا اندیشہ ہو تو احتیاط کے طور پر خون بہنا ممکن ہے، یہ کہ بیماری کے ابتدائی مرحلے میں خون بہت زیادہ پتلی ہو کر جسم میں چلا جاتا ہے اس لیے اسے پکنے تک روک دیا جاتا ہے، اور یہ کہ کسی کو بیماری نہ آئے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 290}۔"
