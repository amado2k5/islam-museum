label:
  ar: "كلام كلي في أوجاع نواحي الصدر"
  en: "A general discourse on the pains of the chest's regions"
  ur: "سینے کے اطراف کے دردوں پر کلی کلام"
  es: "Discurso general sobre los dolores de las regiones del pecho."
  fr: "Discours général sur les douleurs des régions de la poitrine"
  tr: "Göğüs çevresindeki ağrılar hakkında tam bir konuşma"
  id: "Pembicaraan lengkap tentang nyeri di sekitar dada"
summary:
  ar: "قد يعرض في الحجب والصفاقات والضل التي في الصدر ونواحيها والأضلاع أورام دموية موجعة جداً تسمى شوصة وبرساماً وذات الجنب، وقد تكون أوجاع هذه الأعضاء ليست من ورم ولكن من رياح فتغلظ فيظن أنها من هذه العلة ولا تكون، وذات الجنب ورم حار في نواحي الصدر إما في العضلات الباطنة وفي الحجاب المستبطن للصدر وإما في الحجاب الحاجر وهو الخالص أو في العضل الظاهرة الخارجة أو الحجاب الخارج بمشاركة الجلد أو بغير مشاركة، وأعظم هذا وأهوله ما كان في الحجاب الحاجز نفسه وهو أصعبه، ومادة هذا الورم في الأكثر مرار أو دم رديء لأن الأعضاء الصفاقية لا ينفذ فيها إلا اللطيف المراري ثم الدم الخالص ولذلك تكون نوائب اشتداد حماه غباً في الأكثر ولذلك قلما يعرض لمن يتجشأ في الأكثر حامضاً لأنه بلغمي المزاج ومع ذلك قد يكون في الندرة من سوداء عفن ملتهب وقد بين في الكتاب الكلي أنه ليس من شرط الورم الحار أن لا يكون من بلغم وسوداء بل قد يكون من بلغم وسوداء على صفة إلا أنه لا يكون حاراً إلا إذا كان من مرة أو دم فإن كان من غيرهما كان مزمناً وهذا شيء ليس يحصله كثير من الناس، ولما كان كل ورم إما أن يتحلل وإما أن يجمع وإما أن يصلب فكذلك حال ذات الجنب لكن الصلابة فيه مما يقل فهو إذن إما أن يتحلل وإما أن يجمع في غالب الأحوال، وذات الجنب إذا تحللت قبلت الرئة في الأكثر ما يتحلل منها ونفثته وأخرجته وربما تحلل إلى جهة أخرى، وإذا اجتمعت المدة احتيج ضرورة إلى أن تنضج لتتفجر فربما نفثت الرئة المدة وربما قبلها العرق الأجوف فخرجت بالبول وربما انصبت إلى مجاري الثفل فاستفرغت في الإسهال وقد تقع كثيراً إلى الأماكن الخالية واللحوم الغددية فتحدث أوراماً في مثل الأربتين والمغابن وخلف الأذنين، وكثيراً ما تندفع المادة إلى الدماغ وأعضاء أخرى فيقع خطر أو يهلك وربما خنقت المادة الرئة بكثرتها وملأت مجرى النفس وربما لم تكن كثرتها هذه الكثرة ولا كانت إلا نضيجة أو نفثاً مثل المدة إلا أن القوى تكون ساقطة فتعجز عن النفث ولذلك يجب أن تقوى القوة في هذا الوقت حتى تقوى على الانقباض الشديد للسعال النافث فإن هذا النفث فعل يتم بقوتين إحداهما طبيعية منضجة ودافعة والأخرى إرادية دافعة وإذا لم تقويا جميعاً أمكن أن تعجز عن التنقية، واعلم أن عسر النفث إما أن يكون من القوة إذا كانت ضعيفة أو من الآلة إذا كانت تتأذى بحركة نفسها أو حركة جارها أو من المادة إذا كانت رقيقة جداً أو كانت غليظة أو لزجة، وفي مثل هذه الأحوال قد يعرض في الرئة كالغليان لاختلاط الهواء بالمادة العاصية المنصبة إلى الرئة والعصبة، ومتى لم يستنق بالنفث في ذات الجنب إلى أربعة عشر يوماً فقد جمع ومتى لم يستنق القيح بعد أربعين يوماً فقد وقع في ذات الرئة والسل وقد ينق بالتقيح في السابع وأما في الأكثر فيكون في العشرين وفي الأربعين وفي الستين، وقد يقع انفجار قبل النضج لدفع الطبيعة المادة المؤذية بكثرتها أو حدتها أو لحرارة المزاج والسن والفصل والبلد أو لتناول المفجرات من المشروبات قبل الوقت من جهة خطأ الطبيب أو لحركة من العليل مفرطة متعبة أو صيحة وذلك خطر، وقد يعرض أن ينتقل ذات الجنب إلى ذات الرئة بأن تقبل الرئة مادة الورم ثم لا تجيد نفثها وتحتبس فيها فتتورم، وقد ينتقل إلى السل تارة بوساطة ذات الرئة وتارة بغير وساطة بأن تقرح المادة أو المدة المتحللة منه جوهر الرئة لحدتها ورداءتها، وقد ينتقل إلى التشنج والكزاز بأن تندفع المادة في الأعصاب المتصلة بالعضو الذي فيه الورم، وقد يعقب ذات الرئة والجنب كالخدر في مؤخر عضد صاحبه وأنسيه وساعده إلى أطراف الأصابع وقد يحمل على جهة القلب فيعرض منه خفقان يتبعه الغشي وإلى جانب الدماغ أيضاً في حال التحلل قبل الجمع وفي حال الجمع وقد تنتقل المادة إلى الأعضاء الظاهرة فتصير خراجات وقد يكون انتقالها هذا بنفوذها في جواهر العصب والوتر بل العظام وإذا مالت إلى المواضع السفلية ثم انفتحت وصارت نواصير كان ذلك من أسباب الخلاص ولكن تكون النواصير خبيثة معدية وإن مالت إلى المفاصل وصارت نواصير خلص العليل أيضاً لكن ربما أزمن العضو خصوصاً إذا لم يكن هناك استفراغ آخر ببراز أو بول غليظ كثير الرسوب أو نفث كثير نضيج فإن كان شيء من هذا كان أسلم فإن ذلك يدل على قلة المادة المحدثة للخراج وإمكان إصلاحها بالنضج، وهذه الخراجات إذا خفيت وغارت دلت على آفة الرئة، وقد يعرض من شدة الحمى تواتر النفس ومن تواتر النفس لزوجة النفث فإن النفث يجف بسبب النفس المتواتر ويعرض من لزوجة النفث شدة الوصب وازدياد اللهيب ومن ازدياد اللهيب تواتر النفس ومن تواتر النفس اللزوجة فلا يزالان يتعاونان على الغائلة، وأما أن أي أصناف ذات الجنب والرئة أردأ أهو الذي يكون في الجانب الأيسر المجاور للقلب أو الذي في الأيمن فإن بعضهم جعل هذا أردأ وبعضهم جعل ذلك أردأ إلا أن الحق عنده أن القريب من جهة المكان أردأ لكنه أولى بأن ينضج ويقبل التحليل إن كان من شأنه أن يقبل ذلك والبعيد من جهة المكان أسلم إلا أنه عن التحليل والتنضيج أعصى {cite:canon-ibn-sina-print-v2 p.340}"
  en: "There may arise in the partitions, membranes and muscles in the chest and its regions and in the ribs very painful sanguine tumours called shawsa, barsam and pleurisy; and the pains of these organs may not be of a tumour but of winds, so it thickens and is thought to be of this affliction and is not. Pleurisy is a hot tumour in the chest's regions — either in the inner muscles and the membrane lining the chest, or in the partitioning diaphragm, which is the true kind, or in the apparent outer muscles, or the outer membrane with the skin's participation or without; the greatest and most terrible of this is what is in the diaphragm itself, and the hardest. This tumour's matter is mostly bile or bad blood, for the membranous organs admit only the subtle bilious, then the pure blood; therefore its fever's paroxysms come mostly every other day, and therefore it rarely befalls him who mostly belches sour, his temperament being phlegmy — yet rarely it may be of inflamed rotten melancholy; and it was shown in the General Book that a hot tumour is not bound to be of anything but phlegm and melancholy — it may be of phlegm and melancholy in a way, only it is not hot unless it is of bile or blood; if of another it is chronic — a thing not many people grasp. Since every tumour either resolves, collects or hardens, so is pleurisy's state, though hardening in it is rare: it either resolves or collects, in most conditions. When pleurisy resolves, the lung mostly accepts what resolves of it and expectorates and expels it, and it may resolve toward another side. If the pus collects it must ripen to burst: the lung may expectorate the pus, or the hollow vessel may accept it and it come out in the urine, or it may pour into the spittle's channels and be evacuated in diarrhoea; and it often falls to the empty places and the glandular flesh, making tumours in the like of the armpits, the groins and behind the ears. Often the matter is pushed to the brain and other organs, so danger befalls or he perishes; the matter may choke the lung by its abundance and fill the breath's passage, or its abundance may not be this abundance — being only a ripe pus or a pus-like expectoration — yet the powers are fallen and cannot expectorate, so the power must be strengthened at this time until it masters the expectorating cough's hard contraction, for this expectoration is an act done by two powers, one natural ripening and pushing, the other voluntary pushing; if both are not strong it may fail at cleansing. Know that the expectoration's difficulty is either of the power when weak, or of the instrument when hurt by its own motion or its neighbour's, or of the matter when too thin or when thick or sticky; and in such states a boiling-like may arise in the lung from air mixing with the rebellious matter poured into the lung and its sheath. When it is not cleansed by expectoration in pleurisy by fourteen days it has collected, and when the pus is not cleansed after forty days it has fallen into peripneumonia and consumption; it may be cleansed by suppuration on the seventh, but mostly on the twentieth, the fortieth and the sixtieth. Bursting may happen before ripeness by nature's pushing the harmful matter for its abundance or sharpness, or for heat of temperament, age, season and country, or for taking the bursting drinks before the time through the physician's error — or for a patient's excessive tiring motion or a shout, and that is dangerous. Pleurisy may pass into peripneumonia by the lung's accepting the tumour's matter then not managing to expectorate it so it is withheld in it and inflames; it may pass into consumption, once through peripneumonia in the way to be told, and once without peripneumonia's mediation, by the matter or the pus resolving out of it ulcerating the lung's substance for its sharpness and badness; and it may pass into convulsion and tetanus by the matter's being pushed into the nerves connected to the organ holding the tumour. Peripneumonia and pleurisy may be followed by a numbness in the back of the patient's upper arm and its inner side and forearm to the fingertips; it may bear toward the heart, so a palpitation arises followed by syncope, and toward the brain's side too in the state of resolution before collection and in the state of collection; and the matter may pass to the apparent organs and become abscesses — this passing may be by its permeating the nerves' and sinews' substances, even the bones; and if it inclines to the lower places then opens and becomes fistulas, that is among the causes of deliverance, but the fistulas are malignant and infecting; and if it inclines to the joints and becomes fistulas the patient is delivered too, but the organ may be made chronic, especially if there is no other evacuation by stool or thick much-sedimented urine or copious ripe expectoration — if there is something of this it is safest, for it indicates the littleness of the matter making the abscess and the possibility of mending it by ripening. These abscesses, when they hide and sink, indicate the lung's affliction. From the fever's severity may arise frequency of breath, and from the frequency the sputum's stickiness — for the sputum dries by the frequent breath — and from the sputum's stickiness severity of distress and increase of burning, and from the increase of burning frequency of breath, and from the frequency the stickiness: the two keep cooperating on the evil. As for which kind of pleurisy and peripneumonia is worse — the one in the left side neighbouring the heart or the one in the right — some made this the worse and some made that the worse, but the truth in his view is that the nearer in place is the worse, though first to ripen and accept analysis if it is apt to accept it, while the farther in place is safer but harder as to analysis and ripening {cite:canon-ibn-sina-print-v2 p.340}"
  ur: "سینے کے حجابوں صفاقات اور پٹھوں میں اور اس کے اطراف اور پسلیوں میں بہت دردناک دموی سوجنیں ہو سکتی ہیں جنہیں شوصہ برسام اور ذات الجنب کہتے ہیں؛ اور ان اعضا کے درد سوجن سے نہیں بلکہ ہوا سے ہو سکتے ہیں تو گاڑھے ہو کر یہ علت سمجھی جاتی ہے حالکہ نہیں؛ ذات الجنب سینے کے اطراف میں گرم ورم ہے یا اندرونی پٹھوں اور سینے کی اندرونی جھلی میں یا حجاب حاجر میں جو خالص قسم ہے یا بیرونی ظاہر پٹھوں میں یا بیرونی حجاب میں جلد کی شرکت کے ساتھ یا بغیر؛ اس میں سب سے بڑا اور خوفناک وہ ہے جو خود حجاب حاجر میں ہو اور وہی مشکل ترین؛ اس ورم کا مادہ اکثر صفرا یا برا خون ہے کیونکہ صفاقی اعضا میں صرف لطیف مراری داخل ہوتا ہے پھر خالص خون اسی لیے اس کے بخار کے نوبے اکثر ایک دن چھوڑ کر آتے ہیں اور اسی لیے اس شخص کو کم ہوتی ہے جو اکثر کھٹی ڈکار لیتا ہے کیونکہ وہ بلغمی مزاج ہے لیکن ندرتاً سڑی ہوئی جلتی سودا سے بھی ہو سکتی ہے اور کلی کتاب میں بیان ہوا کہ گرم ورم کے لیے شرط نہیں کہ بلغم اور سودا سے نہ ہو ایک صورت پر ہو سکتا ہے لیکن گرم اسی وقت ہوتا ہے جب مادہ یا خون سے ہو ورنہ وہ مزمن ہوتا ہے اور یہ بات بہت سے لوگ نہیں سمجھتے؛ اور چونکہ ہر ورم یا تحلیل ہوتا ہے یا جمع ہوتا ہے یا سخت ایسا ہی ذات الجنب کا حال ہے لیکن اس میں سخت ہونا کم ہے تو وہ اکثر یا تحلیل ہوتی ہے یا جمع؛ تحلیل ہونے پر پھیپھڑا اکثر اس کا تحلیل شدہ قبول کر کے نفث اور خارج کر دیتا ہے اور وہ کسی اور طرف بھی تحلیل ہو سکتی ہے؛ اگر مدّہ جمع ہو تو ضرورتاً پکنا ہوتا ہے تاکہ پھٹے شاید پھیپھڑا مدّہ نفث دے شاید کھوخلی رگ قبول کرے تو پیشاب سے نکلے شاید تھوک کے مجاری میں بہ کر اسہال سے خارج ہو؛ اور اکثر خالی مقامات اور غددی گوشت میں گر کر بغلوں کولہوں اور کانوں کے پیچھے ورم ڈالتی ہے؛ اکثر مادہ دماغ اور دوسرے اعضا کی طرف دھکیلا جاتا ہے تو خطرہ یا ہلاکت آتی ہے اور مادہ کثرت سے پھیپھڑے کو گلا گھونٹ کر سانس کی راہ بھر سکتا ہے یا اتنی کثرت نہ ہو صرف پکی مدّہ یا مدّہ جیسا نفث ہو لیکن قوتیں گر چکی ہوں تو نفث سے عاجز ہیں اس لیے اس وقت قوت مضبوط کرنی چاہیے تاکہ نفث والی کھانسی کے سخت انقباض پر قادر ہو کیونکہ یہ نفث دو قوتوں سے ہوتا ہے ایک فطری پکانے اور دھکیلنے والی دوسری ارادی دھکیلنے والی دونوں قوی نہ ہوں تو صفائی سے عاجز ہو سکتی ہیں؛ جان لو کہ عسر نفث یا قوت کی کمزوری سے ہوتا ہے یا آلہ سے جب وہ اپنی یا پڑوسی کی حرکت سے اذیت پائے یا مادے سے جب وہ بہت پتلا ہو یا گاڑھا یا چپچپا؛ اور ایسی حالتوں میں پھیپھڑے میں ابال جیسا عرض ہوتا ہے ہوا کے اس سرکش مادے سے ملنے سے جو پھیپھڑے اور اس کی جھلی میں بہتا ہے؛ جب ذات الجنب میں چودہ دن تک نفث سے صفائی نہ ہو تو مادہ جمع ہو چکا اور جب چالیس دن بعد پیب صاف نہ ہو تو ذات الرئة اور سل میں گر گیا اور وہ ساتویں دن تقيح سے صاف ہو سکتی ہے لیکن اکثر بیسویں چالیسویں اور ساٹھویں؛ اور پکنے سے پہلے بھی پھٹ سکتی ہے فطرت کے مؤذی مادہ کو اس کی کثرت یا حدت سے دھکیلنے سے یا مزاج عمر موسم اور ملک کی حرارت سے یا وقت سے پہلے پھٹا دینے والے مشروبات سے طبیب کی غلطی کی طرف سے یا مریض کی حد سے زیادہ تھکا دینے والی حرکت یا چیخ سے اور یہ خطرناک ہے؛ اور ذات الجنب ذات الرئة میں بدل سکتی ہے اس طرح کہ پھیپھڑا ورم کا مادہ قبول کرے پھر اسے اچھی طرح نفث نہ کر سکے اور وہ اس میں محتبس رہ کر ورم کرے؛ اور سل میں بدل سکتی ہے کبھی ذات الرئة کے توسط سے مذکورہ طریق پر اور کبھی بغیر اس کے اس طرح کہ مادہ یا اس سے تحلیل شدہ مدّہ اپنی حدت اور بدی سے پھیپھڑے کے جوہر کو قرحة کر دے؛ اور تشنج اور کزاز میں بدل سکتی ہے مادہ کے ان اعصاب میں دھکیلے جانے سے جو ورم والے عضو سے جڑے ہیں؛ اور ذات الرئة اور ذات الجنب کے بعد مریض کی بازو کے پچھلے اور اندرونی حصے اور بازو تک انگلیوں کے سروں تک سنن جیسا آ سکتا ہے اور دل کی طرف مائل ہو کر دھڑکن پھر غشی آ سکتی ہے اور دماغ کی طرف بھی تحلل سے پہلے اور جمع کی حالت میں؛ اور مادہ ظاہر اعضا میں منتقل ہو کر خراجیں بن سکتا ہے یہ انتقال عصب وتروں بلکہ ہڈیوں کے جوہر میں نفوذ سے ہو سکتا ہے اور اگر وہ نیچلے مقامات کی طرف جھکے پھر کھل کر ناسور بنیں تو نجات کے اسباب میں سے ہے لیکن یہ ناسور خبیث اور معدی ہوتے ہیں اور اگر جوڑوں کی طرف جھک کر ناسور بنیں تو مریض بچ بھی جاتا ہے لیکن عضو مزمن ہو سکتا ہے خاص طور پر جب دوسری استفراغ نہ ہو براز یا گاڑھا کثیر رسوب پیشاب یا کثیر پکا نفث ان میں سے کچھ ہو تو وہ محفوظ تر ہے کیونکہ یہ خراج پیدا کرنے والے مادے کی قلت اور پکا کر اصلاح کی امکان کی دلیل ہے؛ اور یہ خراجیں جب چھپ کر دھنس جائیں تو پھیپھڑے کی آفت کی دلیل ہیں؛ اور بخار کی شدت سے تواتر نفس آ سکتا ہے تواتر سے نفث کی چپچپاہٹ کیونکہ نفث متواتر سانس سے سوکھتا ہے چپچپاہٹ سے سخت تکلیف اور بڑھتی جھلسی جھلسی بڑھنے سے تواتر اور تواتر سے چپچپاہٹ یہ دونوں آفت پر ملتے رہتے ہیں؛ اور ذات الجنب اور ذات الرئة کی کون سی قسم بتر ہے جو دل کے قریب بائیں پہلو میں ہو یا دائیں میں بعض نے اسے بتر کہا بعض نے اسے لیکن اس کے نزدیک حق یہ ہے کہ مقام میں قریب والا بتر ہے لیکن اگر اس کی شان ہو تو وہ جلد پک کر تحلیل قبول کرتا ہے اور دور والا محفوظ تر ہے مگر تحلیل اور پکنے میں مشکل تر {cite:canon-ibn-sina-print-v2 p.340}"
  es: "Pueden aparecer en los tabiques, membranas y músculos del tórax y sus regiones, y en las costillas, tumores sanguíneos muy dolorosos llamados shawsa, barsam y pleuresía; y los dolores de estos órganos pueden no ser de un tumor sino de gases, por lo que se espesan y se cree que son de esta afección, pero no lo son. La pleuresía es un tumor caliente en las regiones del tórax, ya sea en los músculos internos y la membrana que recubre el tórax, o en el diafragma, que es el tipo verdadero, o en los músculos externos aparentes, o la membrana externa con participación de la piel o sin ella; el más grande y terrible de estos es el que está en el diafragma mismo, y el más duro. La materia de este tumor es principalmente bilis o sangre mala, ya que los órganos membranosos solo admiten la bilis sutil, luego la sangre pura; Por lo tanto, los paroxismos de su fiebre ocurren casi a diario, y por lo tanto, rara vez le sucede a quien suele eructar agrio, siendo su temperamento flemático; sin embargo, rara vez puede ser de melancolía inflamada y podrida; y se demostró en el Libro General que un tumor caliente no tiene por qué ser de otra cosa que de flema y melancolía; puede ser de flema y melancolía en cierto modo, solo que no es caliente a menos que sea de bilis o sangre; si es de otra cosa, es crónico, algo que no mucha gente comprende. Dado que todo tumor o bien se resuelve, se acumula o se endurece, así es el estado de la pleuresía, aunque el endurecimiento en ella es raro: o bien se resuelve o se acumula, en la mayoría de los casos. Cuando la pleuresía se resuelve, el pulmón generalmente acepta lo que se resuelve de ella y lo expectora y expulsa, y puede resolverse hacia otro lado. Si el pus se acumula, debe madurar para reventar: el pulmón puede expectorarlo, o el vaso hueco puede absorberlo y expulsarlo con la orina, o puede verterse en los conductos de la saliva y evacuarse con diarrea; y a menudo cae en los espacios vacíos y en la carne glandular, formando tumores en lugares como las axilas, las ingles y detrás de las orejas. Con frecuencia, la materia es empujada hacia el cerebro y otros órganos, por lo que el peligro acecha o la persona muere; la materia puede asfixiar el pulmón por su abundancia y llenar las vías respiratorias, o su abundancia puede no ser esta abundancia —siendo solo pus maduro o una expectoración similar al pus—, pero las facultades están debilitadas y no pueden expectorar, por lo que la facultad debe fortalecerse en este momento hasta que domine la fuerte contracción de la tos expectorante, ya que esta expectoración es un acto realizado por dos facultades, una maduración y empuje naturales, la otra empuje voluntario; si ambas no son fuertes, puede fracasar la limpieza. Debe saberse que la dificultad de la expectoración radica en la debilidad de la fuerza, en el instrumento cuando se daña por su propio movimiento o el de otro instrumento, o en la consistencia de la materia cuando es demasiado líquida, espesa o pegajosa; en tales casos, puede producirse una sensación de ebullición en el pulmón debido a la mezcla del aire con la materia rebelde vertida en el pulmón y su vaina. Si en la pleuresía no se limpia mediante expectoración a los catorce días, se ha acumulado pus, y si el pus no se limpia después de cuarenta días, se ha convertido en perineumonía y tisis; puede limpiarse mediante supuración al séptimo día, pero generalmente al vigésimo, cuadragésimo y sexagésimo. La ruptura puede ocurrir antes de tiempo debido a que la naturaleza empuja la materia dañina por su abundancia o acidez, o por el calor del temperamento, la edad, la estación y el país, o por tomar los líquidos que provocan la ruptura antes de tiempo por error del médico, o por el movimiento excesivo y cansado del paciente o un grito, lo cual es peligroso. La pleuresía puede evolucionar a perineumonía cuando el pulmón acepta la materia del tumor y no logra expectorarla, por lo que queda retenida e inflamada; puede evolucionar a tisis, una vez a través de la perineumonía de la forma que se explicará, y otra vez sin la mediación de la perineumonía, cuando la materia o el pus que se resuelven ulceran la sustancia pulmonar debido a su acidez y mal olor; y puede evolucionar a convulsiones y tétanos cuando la materia es empujada hacia los nervios conectados al órgano que contiene el tumor. La perineumonía y la pleuresía pueden ir seguidas de entumecimiento en la parte posterior del brazo del paciente y su cara interna y antebrazo hasta las puntas de los dedos; puede dirigirse hacia el corazón, por lo que surge una palpitación seguida de síncope, y también hacia el lado del cerebro en el estado de resolución antes de la acumulación y en el estado de acumulación; y la materia puede pasar a los órganos aparentes y convertirse en abscesos; este paso puede ocurrir al penetrar las sustancias de los nervios y tendones, incluso los huesos; y si se inclina hacia las partes inferiores entonces se abre y se convierte en fístulas, que es una de las causas de liberación, pero las fístulas son malignas e infecciosas; y si se inclina hacia las articulaciones y se convierte en fístulas el paciente también se libera, pero el órgano puede volverse crónico, especialmente si no hay otra evacuación por heces o orina espesa muy sedimentada o expectoración abundante y madura; si hay algo de esto es lo más seguro, porque indica la poca cantidad de materia que forma el absceso y la posibilidad de curarlo mediante la maduración. Estos abscesos, cuando se ocultan y se hunden, indican la afección del pulmón. De la gravedad de la fiebre puede surgir la frecuencia respiratoria, y de la frecuencia la viscosidad del esputo —pues el esputo se seca con la respiración frecuente— y de la viscosidad del esputo la gravedad del malestar y el aumento del ardor, y del aumento del ardor la frecuencia respiratoria, y de la frecuencia la viscosidad: ambos factores se siguen asociando para empeorar la situación. En cuanto a qué tipo de pleuresía y perineumonía es peor —la del lado izquierdo, cerca del corazón, o la del lado derecho— algunos consideraban esta peor y otros aquella peor, pero la verdad, en su opinión, es que cuanto más cerca del lugar es peor, aunque primero madura y admite el análisis si es apto para aceptarlo, mientras que cuanto más lejos del lugar es más seguro pero más difícil de analizar y madurar {cite:canon-ibn-sina-print-v2 p.340}"
  fr: "Des tumeurs sanguines très douloureuses, appelées shawsa, barsam et pleurésie, peuvent se développer dans les cloisons, les membranes et les muscles de la poitrine et de ses régions, ainsi que dans les côtes. Les douleurs ressenties dans ces organes peuvent être dues à des vents plutôt qu'à une tumeur, ce qui provoque un épaississement de la muqueuse et la confusion avec cette affection. La pleurésie est une tumeur chaude située dans la région thoracique: soit dans les muscles internes et la membrane tapissant la poitrine, soit dans le diaphragme (qui est la forme véritable), soit dans les muscles externes apparents, soit dans la membrane externe, avec ou sans participation de la peau. La forme la plus grave et la plus terrible est celle qui se trouve dans le diaphragme lui-même, et la plus dure. La substance de cette tumeur est principalement composée de bile ou de mauvais sang, car les organes membraneux ne laissent passer que la bile subtile, puis le sang pur. C'est pourquoi ses crises de fièvre surviennent généralement tous les deux jours, et c'est pourquoi elle touche rarement celui qui rote le plus souvent des eaux acides, son tempérament étant flegmatique — bien que, plus rarement, elle puisse être d'origine mélancolique et purulente; et il a été démontré dans le Livre Général qu'une tumeur chaude n'est pas forcément d'origine autre que flegmatique et mélancolique — elle peut l'être d'une certaine manière, mais elle n'est chaude que si elle est de bile ou de sang; si elle est d'une autre nature, elle est chronique — une notion que peu de gens comprennent. Puisque toute tumeur se résorbe, s'accumule ou s'aggrave, il en va de même pour la pleurésie, bien que l'aggravation soit rare: elle se résorbe ou s'accumule, dans la plupart des cas. Lorsque la pleurésie se résorbe, le poumon accepte généralement ce qui s'en est résorbé, l'expectore et l'expulse, et il peut arriver qu'elle se résorbe du côté opposé. Si le pus s'accumule, il doit mûrir avant d'éclater: le poumon peut l'expectorer, ou bien le vaisseau creux peut l'absorber et il est évacué dans l'urine, ou encore il peut se déverser dans les canaux salivaires et être expulsé lors d'une diarrhée. Souvent, il se dépose dans les cavités et les tissus glandulaires, formant des tumeurs, notamment aux aisselles, à l'aine et derrière les oreilles. Fréquemment, la matière est poussée vers le cerveau et d'autres organes, ce qui peut entraîner un danger ou la mort. La matière peut aussi, par son abondance, obstruer les poumons et remplir les voies respiratoires, ou bien son abondance peut être moindre – il peut s'agir seulement de pus mûr ou d'une expectoration purulente – mais les forces sont alors affaiblies et l'expectoration impossible. Il est donc nécessaire de renforcer ces forces jusqu'à ce qu'elles maîtrisent la forte contraction de la toux expectorante, car l'expectoration est un acte qui requiert deux forces: l'une, la maturation et la poussée naturelles, l'autre, la poussée volontaire. Si les deux ne sont pas suffisamment fortes, l'expectoration peut échouer. Sachez que la difficulté à expectorer peut provenir soit d'un manque de force, soit d'une altération de l'instrument (entraînant une irritation due à ses propres mouvements ou à ceux des poumons voisins), soit de la consistance des sécrétions (trop fluides, trop épaisses ou trop collantes). Dans ces cas, une sensation de bouillonnement peut se former dans le poumon, résultant du mélange d'air et des sécrétions purulentes qui s'y déversent. Si, en cas de pleurésie, les sécrétions ne sont pas évacuées par expectoration au bout de quatorze jours, elles s'accumulent. Si le pus n'est pas évacué après quarante jours, il évolue en péripneumonie et en tuberculose. L'expectoration peut permettre l'évacuation des sécrétions au bout de sept jours, mais le plus souvent au bout de vingt, quarantième et soixantième jours. L'éclatement prématuré des sécrétions peut être dû à l'abondance ou à l'agressivité des sécrétions, à la chaleur corporelle, à l'âge, à la saison et au lieu de résidence, à la prise prématurée de boissons purulentes par erreur médicale, à une fatigue excessive du patient ou à un cri. Ceci est dangereux. La pleurésie peut évoluer en péripneumonie lorsque le poumon absorbe la matière tumorale sans parvenir à l'expectorer, celle-ci s'y accumule et s'enflamme. Elle peut également évoluer en tuberculose, soit par péripneumonie (selon le mécanisme décrit), soit sans péripneumonie, lorsque la matière ou le pus, en se résorbant, ulcère le parenchyme pulmonaire en raison de son caractère aigu et purulent. Enfin, elle peut dégénérer en convulsions et en tétanos lorsque la matière est comprimée contre les nerfs reliés à l'organe contenant la tumeur. La péripneumonie et la pleurésie peuvent s'accompagner d'un engourdissement de la face interne du bras et de l'avant-bras jusqu'au bout des doigts. Cette sensation peut irradier vers le cœur, provoquant des palpitations suivies de syncope, et vers le cerveau, aussi bien en phase de résolution qu'en phase d'accumulation. La substance peut se propager aux organes apparents et former des abcès. Cette propagation peut se faire par imprégnation des nerfs, des tendons, voire des os. Si elle se dirige vers les parties inférieures, elle s'ouvre et forme des fistules, ce qui peut entraîner la guérison. Cependant, les fistules sont malignes et infectieuses. Si elle se dirige vers les articulations et forme également des fistules, le patient guérit aussi, mais l'organe peut devenir chronique, surtout en l'absence d'évacuation par les selles, d'urines épaisses et sédimentées ou d'expectorations abondantes et mûres. La présence de ces signes est plus rassurante, car elle indique la faible quantité de substance à l'origine de l'abcès et la possibilité de guérison par maturation. Ces abcès, lorsqu'ils sont profonds et profonds, signalent une affection pulmonaire. La gravité de la fièvre peut entraîner une augmentation de la fréquence respiratoire, et de cette fréquence, une augmentation de la viscosité des expectorations (car les expectorations s'assèchent avec la respiration fréquente), et de cette viscosité, une aggravation de la détresse et une augmentation des brûlures, et de cette augmentation, une augmentation de la fréquence respiratoire, et de la viscosité: les deux contribuent continuellement au mal. Quant à savoir quel type de pleurésie et de péripneumonie est le pire — celle du côté gauche, près du cœur, ou celle du côté droit —, certains considéraient l'une comme pire, d'autres l'autre, mais la vérité, selon lui, est que la plus proche est la plus grave, bien qu'elle mûrisse plus vite et soit plus réceptive à l'analyse si elle y est apte, tandis que la plus éloignée est moins dangereuse, mais plus difficile à analyser et à faire mûrir. {cite:canon-ibn-sina-print-v2 p.340}"
  tr: "Diyaframlarda, peritonlarda ve çevresinde ve kaburgalarda çok ağrılı hematomlar (şişlik, morluk, plevraz olarak adlandırılır) ortaya çıkabilir. Bu organlardaki ağrı tümörden değil, rüzgardan, kalınlaşmadan ve yanlış anlaşılmadan kaynaklanabilir; bu nedenle bu hastalıktan kaynaklandığı düşünülür ancak yoktur. Plevral ağrı, göğs çevresinde, göğsü tanıtan diyaframda veya saf diyaframda, ya da görünen çıkıntılı kas veya deri katılımıyla ya da olmadan çıkıntı yapan diyaframda sıcak bir tümördür. Bunların en büyüğü En şiddetlisi, en zor olan diyaframın kendisidir. Bu tümörün maddesi çoğunlukla acı veya zayıf kandır, çünkü sadece hafif safra ve ardından saf kan periton organlarına nüfuz eder. Bu nedenle, şiddetli ateş atakları çoğu durumda donuktur ve en ekşi durumlarda geğirenler için nadiren maruz kalır çünkü flegmatik bir mizaçtır. Ancak nadir durumlarda siyah, küflü, iltihaplı olabilir. Kapsamlı kitap, sıcak tümörün balgamdan oluşmasının bir durum olmadığını açıklar. Ve siyah, hatta balgam veya siyah karakterden oluşabilir, ancak kandan veya kan türlerinden gelmedikçe sıcak değildir, başka türlerden ise kroniktir, ki bu birçok kişinin yaşamadığı bir durumdur. Her tümör ya düzelir, birleşir ya da sertleşir, ishal için de aynı durum geçerlidir, ancak sertliği daha azdır, bu yüzden ya çözünür ya da birleşir; çoğu durumda sindirim ve plevrite kabul edilir. Parçalanan şey onu nefes verir, dışarı atır ve başka yerlerde çözünebilir. Süre birikirse, olgunlaşmalı ve patlamalı. Bazen akciğerler süreyi boşaltabilir, bazen idrarla atılan boş damarı dışarı atabilir veya pominal yola girerek ishal sırasında kusmaya neden olabilir. Genellikle boş yerlere ve bez derisine düşerek arpatin, mugaben ve kulak arkasında tümörlere yol açar. Çoğu zaman madde beyne ve diğer organlara hızla girer, tehlike veya yıkıma yol açar. Madde bolca akciğerleri tıkayabilir ve hava yolunu doldurabilir, belki de doldurmayabilir Bolluğu bu bolluktur ve sadece süresi gibi olgun veya şişkindir, ancak kuvvetler zayıftır ve üfleyemez. Bu nedenle, üfleme öksürüğünün şiddetli kasılmasına dayanabilmek için kuvvet bu anda güçlenmelidir. Bu üfleme iki kuvvet tarafından gerçekleştirilir: biri doğal, olgun bir itici güç, diğeri ise gönüllü, itici kuvvettir. Hepsi güçlü değilse, arındırmayı başaramaz. Üflemenin zorluğunun ya zayıfsa güçten ya da makine zarar görürse makineden kaynaklanabileceğini bilin. Kendisini, komşusunu hareket ettirerek ya da çok ince, kalın veya yapışkan ise maddeden hareket eder. Bu gibi durumlarda, havanın bağırsak maddesiyle akciğerlere ve sinire karışması nedeniyle akciğerlerde kaynamaya maruz kalabilir. Plevraya üflenerek on dört gün boyunca solunmazsa toplanır; kırk gün sonra solunmazsa zatürre ve tüberkülozda ortaya çıkmıştır ve yedinci günde dışkı ile arındırılabilir. Çoğu durumda yirmi, kırk veya altmış gündür. Patlama, zararlı maddenin aşırı veya şiddetli doğası, ruh hali sıcaklığı, yaş, sınıflandırma veya ülke nedeniyle ya da doktorun hatası nedeniyle patlayıcı içeceklerin erken tüketilmesi ya da aşırı yorucu hareket veya bağırış nedeniyle tehlikeli olması nedeniyle olgunlaşmadan önce meydana gelebilir. Pröroz, akciğerin tümör maddesini kabul etmesi, ardından üfleyemeyerek içeride sıkışması ve şişmesiyle zatürreye bulaşabilir. Bazen zatürre yoluyla tüberküloza bulaşabilir, bazen ise aracılık olmadan, maddenin ülserasyonu yoluyla veya Akciğer çekirdeğinin keskinliği ve kötü durumu nedeniyle çürüme dönemi, maddeyi tümörü içeren organa bağlı sinirlere iterek spazm ve tetanosa dönüşebilir. Ayrıca hastanın üst kolunun, önkolunun ve ön kolunun arkasında parmak uçlarına kadar uyuşma gibi akciğer ve plevra belirtilerine neden olabilir. Kalbin yanına taşınabilir, çarpıntı ve ardından bayılmaya yol açabilir; ayrıca kombinasyon öncesinde çürürse beyne de ulaşabilir. Kombinasyon durumunda, madde görünür organlara geçebilir ve apse haline gelebilir; bu bulaşım sinir mücevherlerine nüfuz ederek gerçekleşebilir. Ve tendon, hatta kemikler. Alt bölgelere doğru eğilip açılıp yumruk haline gelirlerse, bu kurtuluşun nedenlerinden biridir. Ancak yumruklar kötü huylu ve bulaşıcıdır, eklemlere doğru eğilip yumruk haline gelirse hasta da serbesttir. Ancak, organ boşaltılabilir, özellikle dışkı veya sık sık biriken kalın idrar veya çok olgun şişme yoksa. Bunlardan herhangi biri daha güvenliyse, apseye neden olan madde eksikliğini ve olgunlukla onarılma olasılığını gösterir. Bu apseler, solup apse oluşursa Akciğer rahatsızlığını gösterir. Ateşin şiddeti nedeniyle nefes yayılabilir ve nefes sıklığı mide viskozitesine neden olabilir; üfleme sürekli nefes nedeniyle kuruyur. Üflemenin kalınlığı, üflemenin şiddeti ve alevlerin artmasından kaynaklanır, alevlerin artması ise nefesin sürekli iletilmesine neden olur. Sürekli nefes ve nefesin viskoz sürekliliği hâlâ yanlış tarafta işbirliği yapar. Hangi plevez ve akciğer türlerinin daha kötü olduğuna, kalbe bitişik sol taraftaki mı, yoksa sağ taraftaki mı, bazıları bunu daha kötü bulur, ancak Gerçek şu ki, yakın yer açısından daha kötü, ancak mümkünse olgunlaşıp analizi kabul etmeyi daha hak ediyor. Uzak yer açısından daha güvenlidir, ancak analiz ve iyileştirmeden daha fazla itaatsizlik edilir {cite:canon-ibn-sina-print-v2 s.340}"
  id: "Hematoma yang sangat menyakitkan yang disebut pembengkakan, memar, dan pleuris dapat muncul di diafragma, peritoneum, dan bayangan di dada serta sekitarnya, serta tulang rusuk. Nyeri pada organ-organ ini mungkin bukan disebabkan oleh tumor tetapi oleh angin, penebalan, dan kekeliruan, sehingga diduga disebabkan oleh penyakit ini tetapi sebenarnya tidak ada. Nyeri pleura adalah tumor panas di sekitar dada, baik di otot dalam, di diafragma yang memperkenalkan dada, atau di diafragma yang murni, atau pada otot yang terlihat menonjol atau diafragma yang menonjol dengan atau tanpa keterlibatan kulit. Yang terbesar di antaranya Yang paling parah adalah pada diafragma itu sendiri, yang paling sulit. Bahan tumor ini sebagian besar adalah darah pahit atau kurang baik, karena hanya empedu ringan dan kemudian darah murni yang menembus organ peritoneal. Oleh karena itu, episode demam berat biasanya bersifat tumpul dalam sebagian besar kasus, dan jarang terpapar pada mereka yang bersendawa dalam kasus paling asam karena temperamen bersifat dahak. Namun, dalam kasus yang jarang, tumor tersebut bisa berwarna hitam, berjamur, meradang. Buku komprehensif menjelaskan bahwa bukan kondisi bagi tumor panas untuk terbuat dari dahak. Dan hitam, bahkan bisa terbuat dari dahak atau berkarakter hitam, tapi tidak panas kecuali berasal dari darah atau darah, dan jika berasal dari jenis lain, itu kronis, sesuatu yang tidak banyak orang alami. Karena setiap tumor bisa sembuh, menggabung, atau mengeras, hal yang sama berlaku untuk diare, tapi kekakuannya lebih ringan, jadi biasanya terlarut atau digabungkan, dan dalam banyak kasus, pencernaan, pleurisi diterima dalam sebagian besar kasus. Apa yang terurai darinya, menghembuskannya, dan mengeluarkannya, dan dapat larut di tempat lain. Jika durasinya bertambah, perlu matang dan meledak. Kadang-kadang paru-paru dapat mengeluarkan durasi tersebut, kadang sebelum, vena berongga yang dikeluarkan melalui urine, atau masuk ke saluran pominal dan menyebabkan muntah saat diare. Sering kali jatuh ke tempat kosong dan daging kelenjar, menyebabkan tumor di arpatin, mugaben, dan belakang telinga. Seringkali, zat ini masuk ke otak dan organ lain, menyebabkan bahaya atau kehancuran. Zat ini dapat mencekik paru-paru dalam jumlah banyak dan memenuhi saluran napas, dan mungkin tidak Kelimpahannya adalah kelimpahan ini dan hanya matang atau bengkak seperti durasinya, tetapi gaya tersebut lemah dan tidak mampu meniup. Oleh karena itu, gaya harus menguat pada saat ini agar mampu menahan kontraksi parah dari batuk tiupan. Hembusan ini adalah tindakan yang dilakukan oleh dua gaya: satu adalah gaya penggerak alami yang matang, dan yang lain adalah sukarela yang mendorong. Jika tidak semuanya kuat, mungkin gagal memurnikan. Ketahuilah bahwa kesulitan meniup bisa berasal dari kekuatan jika lemah atau dari mesin jika terluka. Dengan bergerak sendiri atau zat tetangganya atau dari zat tersebut jika sangat tipis, tebal, atau lengket. Dalam kasus seperti itu, dapat terpapar didih di paru-paru akibat pencampuran udara dengan zat usus yang terendap ke paru-paru dan saraf. Jika tidak dihirup dengan ditiup ke pleura selama empat belas hari, maka dikumpulkan; jika tidak dihirup setelah empat puluh hari, sudah terjadi pada pneumonia dan tuberkulosis, dan dapat dibersihkan dengan buang air besar pada hari ketujuh. Dalam banyak kasus, terjadi pada dua puluh, empat puluh, atau enam puluh hari. Ledakan dapat terjadi sebelum kematangan akibat sifat berbahaya yang berlebihan atau berat, karena suasana hati, suhu, usia, klasifikasi, atau negara, atau karena mengonsumsi minuman eksplosif terlalu dini akibat kesalahan dokter, atau karena gerakan berlebihan dan melelahkan atau teriakan, yang berbahaya. Pleuriasis dapat menyebar menjadi pneumonia ketika paru-paru menerima bahan tumor, kemudian gagal melepaskannya, terperangkap di dalam, dan pembengkakan. Kadang-kadang dapat menular ke tuberkulosis melalui pneumonia, dan kadang tanpa mediasi, dengan melakukan ulkus pada zat atau Periode pembusukan inti paru-paru akibat ketajaman dan kondisi yang buruk, dan dapat berkembang menjadi kejang dan tetanus dengan mendorong zat tersebut ke saraf yang terhubung ke organ yang mengandung tumor. Zat ini juga dapat menyebabkan gejala paru-paru dan pleura seperti mati rasa di bagian belakang lengan atas, lengan bawah, dan lengan bawah pasien hingga ujung jari. Zat ini dapat dibawa ke sisi jantung, menyebabkan palpitasi diikuti pingsan, dan juga ke otak jika terurai sebelum kombinasi. Dalam kasus kombinasi, zat dapat berpindah ke organ yang terlihat dan menjadi abses, dan penularan ini dapat terjadi melalui penetrasi ke dalam permata saraf. Dan tendon, bahkan tulang. Jika condong ke area bawah lalu terbuka dan menjadi tinju, ini adalah salah satu penyebab keselamatan. Namun, tinju bersifat ganas dan menular, dan jika condong ke sendi dan menjadi tinju, pasien juga bebas. Namun, organ dapat keluar, terutama jika tidak ada muntah lain dengan tinja atau urin kental yang sering menempel atau puffing yang sangat matang. Jika salah satu dari ini lebih aman, ini menunjukkan kurangnya zat penyebab abses dan kemungkinan untuk memperbaikinya seiring kematangan. Abses ini, jika memudar dan menjadi abses menunjukkan gangguan paru-paru. Karena intensitas demam, napas bisa menjadi menyebar, dan frekuensi napas dapat menyebabkan viskositas lambung, karena hembusan mengering akibat napas yang terus-menerus. Ketebalan hembusan disebabkan oleh intensitas hembusan dan peningkatan api, dan peningkatan nyala api menyebabkan transmisi napas yang terus-menerus. Napas yang terus-menerus dan kontinuitas napas yang kental masih bekerja sama di sisi yang salah. Adapun jenis pleuris dan paru-paru mana yang lebih parah, yang di sisi kiri yang dekat dengan jantung atau di kanan, beberapa menganggap ini lebih buruk, dan yang lain menganggapnya lebih buruk, kecuali bahwa Kenyataannya adalah yang dekat lebih buruk dalam hal tempat, tetapi lebih layak untuk matang dan menerima analisis jika memungkinkan. Yang jauh lebih aman dalam hal tempat, tetapi lebih dilanggar daripada analisis dan penyempurnaan {cite:canon-ibn-sina-print-v2 hlm.340}"
