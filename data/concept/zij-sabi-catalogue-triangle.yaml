  es: "El triángulo"
  fr: "Le Triangle"
  tr: "üçgen"
  id: "segi tiga"
summary:
  ar: "يذكر الفهرس صورة طرينانس، وهي المثلث، بعد صورة الدروميذس، ويبدأ بالكوكب الذي في رأس المثلث، ثم المقدَّم من الثلاثة التي في أسفله، ثم الكوكب الذي في آخر هذه الثلاثة. {cite:zij-sabi-nallino-byblion pp.254}"
  en: "The catalogue gives Triangulum, the Triangle, after Andromeda. The entries begin with the star at the head of the triangle, then the leading one of the three stars at its base, and then the star at the end of these three. {cite:zij-sabi-nallino-byblion pp.254}"
  ur: "فہرست طرینانس یعنی مثلث کو دروميذس کے بعد رکھتی ہے۔ آغاز مثلث کے سر والے ستارے سے ہوتا ہے، پھر اس کے نچلے حصے کی تین میں سے مقدم، اور پھر ان تین کا آخری ستارہ۔ {cite:zij-sabi-nallino-byblion pp.254}"
  es: "El catálogo le da el nombre de Triangulum, el Triángulo, en honor a Andrómeda. Las entradas comienzan con la estrella en la cabeza del triángulo, luego la principal de las tres estrellas en su base, y finalmente la estrella en el extremo de estas tres. {cite:zij-sabi-nallino-byblion pp.254}"
  fr: "Le catalogue donne Triangulum, le Triangle, d'après Andromède. Les entrées commencent par l'étoile à la pointe du triangle, puis l'étoile principale des trois à sa base, et enfin l'étoile à l'extrémité de ces trois. {cite:zij-sabi-nallino-byblion pp.254}"
  tr: "Dizin, Dromedius görüntüsünden sonra üçgen olan Terence görüntüsünü listeler ve üçgenin tepesindeki gezegenle başlar, ardından altındaki üç gezegenden ilki ve son olarak bu üçünün sonundaki gezegenle devam eder. {cite:zij-sabi-nallino-byblion pp.254}"
  id: "Indeks tersebut mencantumkan gambar Terence, yang berupa segitiga, setelah gambar Dromedius, dan dimulai dengan planet di puncak segitiga, kemudian planet pertama dari tiga planet di bawahnya, dan akhirnya planet di ujung ketiga planet tersebut. {cite:zij-sabi-nallino-byblion pp.254}"
