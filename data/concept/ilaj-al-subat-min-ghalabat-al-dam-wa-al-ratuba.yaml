id: concept/ilaj-al-subat-min-ghalabat-al-dam-wa-al-ratuba
class: concept
kind: scientific
label:
  ar: "علاج السبات من غلبة الدم والرطوبة"
  en: "Treatment of coma from blood and from moisture"
  ur: "خون اور نمی کے غلبے سے غنودگی کا علاج"
  es: "Tratamiento del coma por hemorragia y por humedad"
  fr: "Traitement du coma dû au sang et à l'humidité"
  tr: "Aşırı kan ve nemden kaynaklanan kış uykusunun tedavisi"
  id: "Pengobatan hibernasi akibat darah dan kelembapan berlebih"
summary:
  ar: "يذكر ابن سينا مبادئ علاج السبات من غلبة الدم ومن الرطوبة الساذجة ومن الرطوبة مع بلغم، وأن يُسمع صاحبه ويُرى ما يغمه؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.93} {cite:canon-ibn-sina-print-v2 p.94}"
  en: "Ibn Sina gives the principles of treating coma from prevailing blood, from simple moisture and from moisture with phlegm, and that the patient be made to hear and see what grieves him; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.93} {cite:canon-ibn-sina-print-v2 p.94}"
  ur: "ابن سینا خون کے غلبے، سادہ نمی اور بلغم کے ساتھ نمی سے ہونے والی غنودگی کے علاج کے اصول بتاتا ہے، اور یہ کہ مریض کو وہ سنایا اور دکھایا جائے جو اسے غمگین کرے؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.93} {cite:canon-ibn-sina-print-v2 p.94}۔"
  es: "Ibn Sina expone los principios para tratar el coma causado por la presencia de sangre, humedad simple y humedad con flema, y que se haga oír y ver al paciente lo que le aflige; las recetas y los métodos de aplicación no se reproducen {cite:canon-ibn-sina-print-v2 p.93} {cite:canon-ibn-sina-print-v2 p.94}"
  fr: "Ibn Sina expose les principes du traitement du coma dû à une accumulation de sang, à une simple accumulation d'humidité et à une accumulation d'humidité mêlée de mucosités, et recommande de faire entendre et voir au patient ce qui le tourmente; les recettes et les méthodes d'application ne sont pas reproduites. {cite:canon-ibn-sina-print-v2 p.93} {cite:canon-ibn-sina-print-v2 p.94}"
  tr: "İbn Sina, kış uykusunun tedavi prensiplerinden, aşırı kan, saf nem ve mukus dahil olmak üzerinden, kişinin kendisini rahatsız eden şeyleri duyup görmesi gerektiğini belirtir; tariflerin ve kullanım yöntemlerinin aktarılmaması gerektiğini belirtir {cite:canon-ibn-sina-print-v2 s.93} {cite:canon-ibn-sina-print-v2 s.94}"
  id: "Ibn Sina menyebutkan prinsip-prinsip pengobatan hibernasi, termasuk darah berlebihan, kelembapan naif, dan lendir, serta bahwa seseorang harus mendengar dan melihat apa yang membuatnya stres; dan bahwa resep serta metode penggunaannya tidak boleh disebarkan {cite:canon-ibn-sina-print-v2 hlm.93} {cite:canon-ibn-sina-print-v2 hlm.94}"
