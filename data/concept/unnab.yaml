summary:
  ar: "العناب في الكتاب ثمرة شجرة معروفة أكثرها بجرجان، بارد إلى الأولى معتدل في اليبوسة والرطوبة، وينقل قول جالينوس إنه لم يجد له أثراً في الصحة ولا في المرض غير أنه عسر الهضم قليل الغذاء، ويقول إنه جيد للصدر والرئة رديء للمعدة {cite:canon-ibn-sina-print-v1 p.615}"
  en: "Unnab is in the book the fruit of a well-known tree, found mostly at Jurjan, cold toward the first degree and moderate in dryness and moisture; the book relates the saying of Galen that he found no effect of it in health or in illness, only that it is hard to digest and of little nourishment, and says it is good for the chest and the lung and bad for the stomach {cite:canon-ibn-sina-print-v1 p.615}"
  ur: "عناب کتاب میں ایک معروف درخت کا پھل ہے جو زیادہ تر جرجان میں ہوتا ہے، پہلے درجے تک سرد اور خشکی اور تری میں معتدل؛ کتاب جالینوس کا قول نقل کرتی ہے کہ اس نے اس کا کوئی اثر نہ صحت میں پایا نہ بیماری میں سوائے اس کے کہ یہ دیر ہضم اور کم غذا ہے، اور کہتی ہے کہ یہ سینے اور پھیپھڑے کے لیے اچھا اور معدے کے لیے برا ہے {cite:canon-ibn-sina-print-v1 p.615}۔"
  es: "En el libro, Unnab es el fruto de un árbol muy conocido, que se encuentra principalmente en Jurjan, frío hacia el primer grado y de humedad y sequedad moderadas; el libro relata que Galeno dijo que no encontró ningún efecto en la salud ni en la enfermedad, solo que es difícil de digerir y de poco valor nutritivo, y dice que es bueno para el pecho y los pulmones y malo para el estómago {cite:canon-ibn-sina-print-v1 p.615}."
  fr: "L'unnab est décrit dans le livre comme le fruit d'un arbre bien connu, que l'on trouve principalement à Jurjan, de climat froid au premier degré et d'humidité modérée. Le livre rapporte les propos de Galien, qui n'y a trouvé aucun effet sur la santé ni sur la maladie, mais seulement qu'il est difficile à digérer et peu nutritif. Il est dit qu'il est bon pour la poitrine et les poumons, mais mauvais pour l'estomac. {cite:canon-ibn-sina-print-v1 p.615}"
  tr: "Kitaptaki jujube, en çok Jurjan olarak bilinen bir ağacın meyvesidir; baştan soğuk, kuru ve nemi orta derecede yüksektir. Galen, sağlıkta veya hastalıkta hiçbir iz bulmadığını, sadece sindirilmediğini ve yetersiz beslendiğini belirtir. Göğüs ve akciğerler için iyi ama mide için zararlı olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.615}"
  id: "Jujube dalam buku adalah buah dari pohon yang paling dikenal sebagai Jurjan, dingin hingga pohon pertama dan sedang dalam kekeringan serta kelembapan. Galen mengutip bahwa ia tidak menemukan jejak jujube dalam kesehatan atau penyakit, kecuali bahwa jujube tidak tercerna dan malnutrisi. Ia mengatakan bahwa jujube baik untuk dada dan paru-paru tetapi buruk untuk lambung {cite:canon-ibn-sina-print-v1 hlm.615}"
