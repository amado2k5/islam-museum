id: concept/munkar-and-nakir
class: concept
kind: angel
label:
  ar: منكر ونكير
  en: Munkar and Nakir
  ur: منکر اور نکیر
summary:
  ar: ملكان يقال إنهما يسألان الميت في قبره بعد دفنه، ويثبت السؤال عليه في أحاديث مروية في السنن الأربعة ومسند أحمد؛ وأصلهما من أنهما اثنان من
    الملائكة سمّاهما النبي في حديث القبر.
  en: Two angels said to question the dead in the grave after burial, established by hadith narrated across the Four Sunans and Musnad Ahmad;
    their names are given in the Prophet's hadith of the grave.
  ur: دو فرشتے جن کا کہا جاتا ہے کہ وہ دفن کے بعد قبر میں میت سے سوال کرتے ہیں؛ ان کا ثبوت چار سنن اور مسند احمد کی احادیث میں ہے اور ان کے نام
    نبی کی قبر والی حدیث میں آئے ہیں۔
