id: concept/munkar-and-nakir
class: concept
kind: angel
label:
  ar: منكر ونكير
  en: Munkar and Nakir
  ur: منکر اور نکیر
  es: "Munkar y Nakir"
  fr: "Munkar et Nakir"
summary:
  ar: ملكان يقال إنهما يسألان الميت في قبره بعد دفنه، ويثبت السؤال عليه في أحاديث مروية في السنن الأربعة ومسند أحمد؛ وأصلهما من أنهما اثنان من
    الملائكة سمّاهما النبي في حديث القبر.
  en: Two angels said to question the dead in the grave after burial, established by hadith narrated across the Four Sunans and Musnad Ahmad;
    their names are given in the Prophet's hadith of the grave.
  ur: دو فرشتے جن کا کہا جاتا ہے کہ وہ دفن کے بعد قبر میں میت سے سوال کرتے ہیں؛ ان کا ثبوت چار سنن اور مسند احمد کی احادیث میں ہے اور ان کے نام
    نبی کی قبر والی حدیث میں آئے ہیں۔
  es: "Según se dice, dos ángeles interrogan a los muertos en la tumba después del entierro, tal como lo establecen los hadices narrados en los Cuatro Sunans y el Musnad Ahmad; sus nombres se mencionan en el hadiz del Profeta sobre la tumba."
  fr: "Deux anges sont censés interroger les morts dans la tombe après l'enterrement, selon un hadith rapporté dans les quatre Sunan et le Musnad Ahmad; leurs noms sont donnés dans le hadith du Prophète concernant la tombe."
