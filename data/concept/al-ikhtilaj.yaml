id: "concept/al-ikhtilaj"
class: "concept"
kind: "scientific"
label:
  ar: "الاختلاج"
  en: "Palpitating twitch (ikhtilaj)"
  fr: "La contraction palpitante (ikhtilaj)"
  ur: "اختلاج"
  es: "Espasmo palpitante (ikhtilaj)"
  tr: "Nöbetler"
  id: "Kejang"
summary:
  ar: "الاختلاج حركة عضلانية قد يتحرك معها ما يلتصق بها من الجلد وهي من ريح غليظة نفاخة، دل على ريحيتها سرعة انحلالها وكونها في الأبدان الباردة وإسكان المسخنات لها، وعلى غلظها أنها لا تنحل إلا بتحريك العضو، وعلى عضلانيتها أنها تعرض لما توسط بين الصلابة واللين {cite:canon-ibn-sina-print-v2 p.160}"
  en: "Ikhtilaj is a muscular twitching motion with which the adjoining skin may move; it is from a thick blowing wind: its wind-nature is proved by its quick dissolution, its occurring in cold bodies and its calming by warmers; its thickness by its not dissolving without moving the organ; and its fleshy-muscular seat by its befalling what is midway between hardness and softness {cite:canon-ibn-sina-print-v2 p.160}"
  fr: "L'ikhtilaj est un mouvement de contraction musculaire avec lequel la peau voisine peut bouger ; il provient d'un vent épais qui souffle : sa nature venteuse se prouve par sa dissolution rapide, sa survenue dans les corps froids et son apaisement par les réchauffants ; son épaisseur, par le fait qu'il ne se dissout pas sans mouvoir l'organe ; et son siège charnu et musculaire, par le fait qu'il atteint ce qui est à mi-chemin entre la dureté et la mollesse {cite:canon-ibn-sina-print-v2 p.160}"
  ur: "اختلاج ایک پٹھوں کی حرکت ہے جس کے ساتھ جڑا ہوا جلد بھی ہل سکتی ہے؛ یہ ایک موٹی پھیلانے والی ریح سے ہے: اس کی ریح ہونا اس کے جلد تحلیل ہونے، سرد بدنوں میں ہونے اور مسخنات سے سکنے سے ثابت ہوتا ہے؛ اس کی کثافت اس بات سے کہ عضو کی حرکت کے بغیر تحلیل نہیں ہوتی؛ اور اس کا پٹھوں اور گوشت میں ہونا اس سے کہ وہ اوسط صلابت اور نرمی والے مقام پر عرض ہوتا ہے {cite:canon-ibn-sina-print-v2 p.160}"
  es: "Ikhtilaj es un movimiento muscular espasmódico con el que puede moverse la piel adyacente; se origina en un viento denso y fuerte: su naturaleza eólica se demuestra por su rápida disolución, su aparición en cuerpos fríos y su atenuación por el calor; su densidad, por el hecho de no disolverse sin mover el órgano; y su sede carnosa-muscular, por el hecho de producirse en un punto intermedio entre la dureza y la suavidad {cite:canon-ibn-sina-print-v2 p.160}"
  tr: "Nöbet, cildin ona yapışmasına neden olabilen kas hareketidir ve kalın, şişkin bir rüzgardır. Kokusu hızlı çözülmesini, soğuk cisimlerdeki varlığını ve ısıtıcılarının serbest kalmasını gösterir. Kabalığı ise sadece uzvunu hareket ettirerek çözüldüğünü gösterir. Kaslılığı, sertlik ile yumuşaklık arasında bir şeye maruz kaldığını gösterir {cite:canon-ibn-sina-print-v2 s.160}"
  id: "Kejang adalah gerakan otot yang dapat menyebabkan kulit menempel padanya dan merupakan angin tebal serta bengkak. Baunya menunjukkan pelarutan cepat, keberadaan benda dingin, dan pelepasan pemanasnya. Kekasaran menunjukkan pelarutan hanya dengan menggerakkan anggota tubuh. Kemasan menunjukkan paparan sesuatu antara kekerasan dan kelembutan {cite:canon-ibn-sina-print-v2 hlm.160}"
