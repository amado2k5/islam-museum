label:
  ar: "بابونج"
  en: "Babunaj (chamomile)"
  fr: "Babunaj (camomille)"
  ur: "بابونج ⁦(کیمومائل)⁩"
  es: "Babundaj (manzanilla)"
summary:
  ar: "حشيشة ذات ألوان يُحفظ ورقها وزهرها في أقراص، وأصلها يُجفَّف ويُحفظ، وهي حارة يابسة في الأولى. تفتح السدد وتلطّف وتحلّل بلا جذب، وتسكن الأورام الحارة والبثور، وتذهب اليرقان، وتصلح للقلاع والصداع البارد. ويذكر الكتاب لها أيضاً إدرار الطمث وإخراج الجنين، فتُسجَّل كما وردت دون توصية {cite:canon-ibn-sina-print-v1 p.382}، {cite:canon-ibn-sina-print-v1 p.383}."
  en: "A herb of several colours. Its leaves and flowers are kept by pressing them into cakes, and its root is dried and stored. Hot and dry in the first degree. The book says it opens obstructions, thins and dissolves without drawing, eases hot swellings and pustules, clears jaundice, and suits cold headache and thrush. The book also lists menses and foetus effects, recorded as the book's own listing and not as advice {cite:canon-ibn-sina-print-v1 p.382}, {cite:canon-ibn-sina-print-v1 p.383}."
  fr: "Herbe de plusieurs couleurs. Ses feuilles et ses fleurs sont conservées en galettes pressées, sa racine séchée et gardée. Chaude et sèche au premier degré, elle est décrite dans le livre comme désobstruante, fluidifiante et résolutive sans attraction, apaisant gonflements chauds et pustules, dissipant la jaunisse et convenant aux céphalées froides et au muguet. Le livre mentionne aussi des effets sur les règles et le fœtus, rapportés comme ses propres indications et non comme des conseils {cite:canon-ibn-sina-print-v1 p.382}, {cite:canon-ibn-sina-print-v1 p.383}."
  ur: "یہ رنگ برنگی جڑی بوٹی ہے۔ اس کے پتے اور پھول گولیوں کی شکل میں محفوظ کیے جاتے ہیں، اور اس کی جڑ خشک کر کے رکھی جاتی ہے۔ طبیعت میں پہلے درجے میں گرم اور خشک۔ کتاب کے مطابق یہ رکاوٹیں کھولتا ہے، پتلا کرتا اور بغیر کھینچے تحلیل کرتا ہے، گرم ورموں اور پھنسیوں میں آرام دیتا ہے، یرقان دور کرتا ہے، اور سرد دردِ سر اور منہ کے چھالوں میں موافق ہے۔ کتاب اس کے حیض کھولنے اور جنین خارج کرنے کے اقوال بھی درج کرتی ہے، جو صرف کتاب کی فہرست کے طور پر لکھے گئے ہیں، نسخے کے طور پر نہیں {cite:canon-ibn-sina-print-v1 p.382}، {cite:canon-ibn-sina-print-v1 p.383}۔"
  es: "Hierba de varios colores. Sus hojas y flores se conservan prensándolas en forma de tortas, y su raíz se seca y almacena. De naturaleza cálida y seca en primer grado. El libro afirma que abre obstrucciones, fluidifica y disuelve sin necesidad de tirar, alivia hinchazones y pústulas calientes, elimina la ictericia y es beneficiosa para el dolor de cabeza por frío y la candidiasis. El libro también enumera sus efectos sobre la menstruación y el feto, registrados como una lista propia del libro y no como consejo {cite:canon-ibn-sina-print-v1 p.382}, {cite:canon-ibn-sina-print-v1 p.383}."
