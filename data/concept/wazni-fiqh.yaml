label:
  ar: وَزْنيّ
  en: Wazni (weighed goods)
  es: "Wazni (mercancías pesadas)"
  fr: "Wazni (marchandises pesées)"
summary:
  ar: 'الوَزني في اللغة المقدّر بالميزان، والكيلي المقدّر بالكيل، وكلاهما من المثليات، ولا يخرج الاصطلاح عن اللغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185} وفي كون الشيء وزنياً قولان: جمهور الفقهاء من المالكية والشافعية والحنابلة وغير أبي يوسف من الحنفية يرون أن ما كان موزوناً في عهد النبي لا يتغير، استناداً إلى قوله: «الوزن وزن أهل مكة والمكيال مكيال المدينة»، بينما يرى أبو يوسف أن العرف معتبر مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}

    وما لم يكن معلوماً في عهد النبي أو جُهل حاله، فيرجع فيه إلى عرف موضع البيع، لأنه لا حدّ له في الشرع ولا في اللغة، وللشافعية أقوال: أن يُعتبر الكيل لأن أكثر ما ورد فيه مكيل، أو الوزن لأنه أضبط، أو التخيير عند التساوي، أو اعتبار الأصل المعلوم للشيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}

    والوزني المنصوص عليه هو الذهب والفضة، ويلحق بهما جواهر الأرض كالحديد والنحاس والرصاص والزجاج والزئبق، ومنه الحرير والقطن والكتان والصوف وغزلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}

    وتجري الربا في الوزنيات بحسب الخلاف في علة الربا في الوزني المنصوص عليه، وتفصيله في مدخل الربا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}'
  en: 'The lexical sense of wazni is what is measured by the balance, and kayli is what is measured by volume; both are fungible goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185} Whether a good counts as weighed is disputed: most jurists (Malikis, Shafi''is, Hanbalis and Hanafis other than Abu Yusuf) hold that what was weighed in the Prophet''s time stays so, on the report that the weight is the weight of the people of Mecca and the measure that of Medina; Abu Yusuf holds that custom is decisive in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187} A good not fixed in the Prophet''s time, or whose status is unknown, is judged by local custom at the place of sale, since neither the law nor the lexicon sets a standard for it; the Shafi''is have further views (measure by volume because most texts concern volumes, by weight because it is more exact, or by the standard of its origin). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186} The weighed good named in the texts is gold and silver, and like them are earthly metals such as iron, copper, lead, glass and mercury, and silk, cotton, flax and wool with their yarn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187} Usury on weighed goods follows the disagreement about its ground in the named goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}'
  es: "El sentido léxico de wazni es lo que se mide con la balanza, y kayli es lo que se mide por volumen; ambos son bienes fungibles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185} Si un bien se considera pesado es discutido: la mayoría de los juristas (malikis, shafi'is, hanbalis y hanafis, excepto Abu Yusuf) sostienen que lo que se pesaba en la época del Profeta sigue siendo así, basándose en el relato de que el peso es el peso de la gente de La Meca y la medida la de Medina; Abu Yusuf sostiene que la costumbre es decisiva en cada caso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187} Un bien que no estaba establecido en la época del Profeta, o cuyo estatus se desconoce, se juzga según la costumbre local en el lugar de venta, ya que ni la ley ni el léxico establecen un estándar para ello; los shafi'is tienen otras opiniones (medir por volumen porque la mayoría de los textos se refieren a volúmenes, por peso porque es más exacto, o por el estándar de su origen). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186} El bien pesado mencionado en los textos es el oro y la plata, y como tales son los metales terrosos como el hierro, el cobre, el plomo, el vidrio y el mercurio, así como la seda, el algodón, el lino y la lana con sus hilos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187} La usura sobre bienes pesados surge del desacuerdo sobre su fundamento en los bienes mencionados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}"
  fr: "Le sens lexical de wazni désigne ce qui est mesuré à la balance, et celui de kayli, ce qui est mesuré en volume; les deux sont des biens fongibles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185} La question de savoir si un bien est considéré comme pesé est controversée: la plupart des juristes (malikites, chaféites, hanbalites et hanafites, à l’exception d’Abou Yusuf) estiment que le poids utilisé au temps du Prophète demeure inchangé, se fondant sur le récit selon lequel le poids est celui des habitants de La Mecque et la mesure celui de Médine; Abou Yusuf, quant à lui, considère que la coutume est déterminante en toutes circonstances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187} Un bien non fixé à l'époque du Prophète, ou dont le statut est inconnu, est jugé selon la coutume locale du lieu de vente, car ni la loi ni le lexique n'établissent de norme à cet égard; les Shafi'ites ont d'autres points de vue (mesurer par volume car la plupart des textes concernent les volumes, par poids car c'est plus précis, ou selon la norme de son origine). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186} Les biens pesés mentionnés dans les textes sont l'or et l'argent, ainsi que des métaux terrestres comme le fer, le cuivre, le plomb, le verre et le mercure, et la soie, le coton, le lin et la laine avec leurs fils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187} L'usure sur les biens pesés découle du désaccord concernant son fondement dans les biens mentionnés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}"
