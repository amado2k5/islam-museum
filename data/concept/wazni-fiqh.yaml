id: concept/wazni-fiqh
class: concept
kind: legal
label:
  ar: وَزْنيّ
  en: Wazni (weighed goods)
summary:
  ar: 'الوَزني في اللغة المقدّر بالميزان، والكيلي المقدّر بالكيل، وكلاهما من المثليات، ولا يخرج الاصطلاح عن اللغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185} وفي كون الشيء وزنياً قولان: جمهور الفقهاء من المالكية والشافعية والحنابلة وغير أبي يوسف من الحنفية يرون أن ما كان موزوناً في عهد النبي لا يتغير، استناداً إلى قوله: «الوزن وزن أهل مكة والمكيال مكيال المدينة»، بينما يرى أبو يوسف أن العرف معتبر مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}

    وما لم يكن معلوماً في عهد النبي أو جُهل حاله، فيرجع فيه إلى عرف موضع البيع، لأنه لا حدّ له في الشرع ولا في اللغة، وللشافعية أقوال: أن يُعتبر الكيل لأن أكثر ما ورد فيه مكيل، أو الوزن لأنه أضبط، أو التخيير عند التساوي، أو اعتبار الأصل المعلوم للشيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}

    والوزني المنصوص عليه هو الذهب والفضة، ويلحق بهما جواهر الأرض كالحديد والنحاس والرصاص والزجاج والزئبق، ومنه الحرير والقطن والكتان والصوف وغزلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}

    وتجري الربا في الوزنيات بحسب الخلاف في علة الربا في الوزني المنصوص عليه، وتفصيله في مدخل الربا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}'
  en: 'The lexical sense of wazni is what is measured by the balance, and kayli is what is measured by volume; both are fungible goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185} Whether a good counts as weighed is disputed: most jurists (Malikis, Shafi''is, Hanbalis and Hanafis other than Abu Yusuf) hold that what was weighed in the Prophet''s time stays so, on the report that the weight is the weight of the people of Mecca and the measure that of Medina; Abu Yusuf holds that custom is decisive in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17185}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187} A good not fixed in the Prophet''s time, or whose status is unknown, is judged by local custom at the place of sale, since neither the law nor the lexicon sets a standard for it; the Shafi''is have further views (measure by volume because most texts concern volumes, by weight because it is more exact, or by the standard of its origin). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186} The weighed good named in the texts is gold and silver, and like them are earthly metals such as iron, copper, lead, glass and mercury, and silk, cotton, flax and wool with their yarn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17186}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187} Usury on weighed goods follows the disagreement about its ground in the named goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}'
