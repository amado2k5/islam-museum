id: concept/yawm-al-shakk-fiqh
class: concept
kind: legal
label:
  ar: "يَوم الشك"
  en: "Yawm al-Shakk (the day of doubt, fiqh)"
  es: "Yawm al-Shakk (el día de la duda, fiqh)"
  fr: "Yawm al-Shakk (le jour du doute, fiqh)"
  ur: "یوم الشک ⁦(شبہ کا دن، فقہ)⁩"
summary:
  ar: "يوم الشك مصطلح فقهي ليوم الثلاثين من شعبان إذا لم تثبت فيه رؤية هلال رمضان ثبوتاً شرعياً، وسُمي بذلك لأنه قد يكون أول رمضان. اختلف الفقهاء في ضابطه وفي حكم صومه: فالحنفية لا يصومونه لغير النفل مع تفصيل في الخواص والعوام، والمالكية يمنعون صومه احتياطاً لرمضان، والشافعية لا يحل صومه بغير سبب في الأصح، والحنابلة يكرهونه بنية الرمضانية احتياطاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029}"
  en: "Yawm al-shakk is a juristic term for the thirtieth of Sha'ban when the sighting of Ramadan's crescent is not legally established; it is so named because it may be the first of Ramadan. The schools differ on its definition and on the ruling of fasting it: the Hanafis allow only supererogatory fasting with a distinction between the select and the common people, the Malikis bar a precautionary fast for Ramadan, the Shafi'is on the sound view do not permit it without a reason, and the Hanbalis dislike a fast intended precautionarily as Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029}"
  es: "Yawm al-shakk es un término jurídico que designa el trigésimo día de Sha'ban, cuando la observación de la luna creciente de Ramadán no está legalmente establecida; se denomina así porque puede ser el primer día de Ramadán. Las escuelas difieren en su definición y en la norma sobre el ayuno: los hanafíes solo permiten el ayuno supererogatorio, distinguiendo entre los elegidos y el pueblo común; los malikíes prohíben el ayuno preventivo de Ramadán; los shafiíes, desde una perspectiva sólida, no lo permiten sin una razón justificada; y los hanbalíes desaprueban el ayuno preventivo de Ramadán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029}"
  fr: "Yawm al-shakk est un terme juridique désignant le trentième jour de Sha'ban, où l'observation du croissant de Ramadan n'est pas légalement établie; il est ainsi nommé car il peut s'agir du premier jour du Ramadan. Les écoles juridiques divergent quant à sa définition et à la règle concernant le jeûne ce jour-là: les hanafites n'autorisent que le jeûne surérogatoire, avec une distinction entre les personnes privilégiées et le commun des mortels; les malikites interdisent le jeûne préventif pour le Ramadan; les chaféites, suivant l'avis le plus juste, ne le permettent pas sans raison valable; et les hanbalites désapprouvent un jeûne pris par précaution pour le Ramadan."
  ur: "یوم الشک شعبان کی تیسویں کے لیے ایک فقہی اصطلاح ہے جب رمضان کا چاند نظر آنا شرعی طور پر ثابت نہیں ہے۔ اس کا نام اس لیے رکھا گیا ہے کہ شاید یہ رمضان کا پہلا مہینہ ہو۔ اس کی تعریف اور اس کے روزے کے حکم میں مکاتب کا اختلاف ہے: احناف صرف فضول روزے رکھنے کی اجازت دیتے ہیں اور عام لوگوں کے درمیان فرق کرتے ہیں، مالکی رمضان کے احتیاطی روزوں کو روکتے ہیں، شافعی بلا وجہ اس کی اجازت نہیں دیتے، اور حنبلی احتیاطی طور پر روزہ رکھنے کو ناپسند کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18027} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18028}"
