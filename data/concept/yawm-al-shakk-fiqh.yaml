label:
  ar: "يَوم الشك"
  en: "Yawm al-Shakk (the day of doubt, fiqh)"
summary:
  ar: "يوم الشك مصطلح فقهي ليوم الثلاثين من شعبان إذا لم تثبت فيه رؤية هلال رمضان ثبوتاً شرعياً، وسُمي بذلك لأنه قد يكون أول رمضان. اختلف الفقهاء في ضابطه وفي حكم صومه: فالحنفية لا يصومونه لغير النفل مع تفصيل في الخواص والعوام، والمالكية يمنعون صومه احتياطاً لرمضان، والشافعية لا يحل صومه بغير سبب في الأصح، والحنابلة يكرهونه بنية الرمضانية احتياطاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029}"
  en: "Yawm al-shakk is a juristic term for the thirtieth of Sha'ban when the sighting of Ramadan's crescent is not legally established; it is so named because it may be the first of Ramadan. The schools differ on its definition and on the ruling of fasting it: the Hanafis allow only supererogatory fasting with a distinction between the select and the common people, the Malikis bar a precautionary fast for Ramadan, the Shafi'is on the sound view do not permit it without a reason, and the Hanbalis dislike a fast intended precautionarily as Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18029}"
