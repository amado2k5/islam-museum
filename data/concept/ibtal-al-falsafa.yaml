id: concept/ibtal-al-falsafa
class: concept
kind: term
label: { ar: "إبطال الفلسفة", en: "The refutation of philosophy", es: "La refutación de la filosofía", fr: "La réfutation de la philosophie", ur: "فلسفہ کی تردید", tr: "Felsefenin Çürütülmesi", id: "Penolakan terhadap Filsafat" }
summary:
  ar: "خصص ابن خلدون فصلاً لإبطال الفلسفة وفساد منتحلها لأن هذه العلوم عارضة في العمران كثيرة في المدن وضررها في الدين كثير، فأصحابها زعموا أن الوجود كله الحس منه وما وراءه تدرك ذواته وأحواله بالأنظار الفكرية والأقيسة العقلية وأن تصحيح العقائد الإيمانية من قبل النظر لا من جهة السمع، ووضعوا قانوناً يهتدي به العقل إلى التمييز بين الحق والباطل سموه المنطق، وإمام مذاهبهم أرسطو المقدوني من تلاميذ أفلاطون ومعلم الإسكندر الذي يسمونه المعلم الأول لأنه أول من رتب قانون المنطق، ومن أشهر من أخذ بمذاهبهم في الإسلام أبو نصر الفارابي في المائة الرابعة وأبو علي بن سينا في الخامسة، وحكم على رأيهم بأنه باطل بجميع وجوهه: فإسنادهم الموجودات كلها إلى العقل الأول قصور عما وراءه من رتب خلق الله، وبراهينهم المعروضة على معيار المنطق قاصرة لأنها أحكام ذهنية كلية عامة والموجودات الخارجية متشخصة بموادها ولعل في المواد ما يمنع من مطابقة الذهني للخارجي فلا يقين فيها، ومسائل الطبيعيات لا تهم في دين ولا معاش {cite:muqaddima-ibn-khaldun p. 548-549}."
  en: "Philosophy — Aristotle's logic as the canon of truth — fails: its abstract proofs cannot match individuated existents {cite:muqaddima-ibn-khaldun p. 548-549}."
  es: "La filosofía —la lógica de Aristóteles como canon de la verdad— falla: sus pruebas abstractas no pueden coincidir con los entes individualizados {cite:muqaddima-ibn-khaldun p. 548-549}."
  fr: "La philosophie — la logique d'Aristote comme canon de la vérité — échoue: ses preuves abstraites ne peuvent correspondre aux existants individualisés {cite: muqaddima-ibn-khaldun p. 548-549}."
  ur: "فلسفہ - ارسطو کی منطق بطور سچائی - ناکام ہو جاتی ہے: اس کے تجریدی ثبوت انفرادی وجود سے میل نہیں کھا سکتے۔ 548-549}۔"
  tr: "İbn Haldun, felsefenin çürütülmesine ve taklitçilerinin yozlaşmasına bir bölüm ayırdı; çünkü bu bilimler kentsel gelişimde yaygındır ve dinde birçok zararı vardır. Savunucuları, varoluşun tamamen duyular ve altında yatanlar aracılığıyla olduğunu, özlerini ve durumlarını entelektüel bakış açıları ve rasyonel ölçümlerle algıladığını, inanç inançlarının düzeltilmesinin ise duymaktan değil, gözlemden kaynaklandığını iddia ettiler. Gerçek ile yalanı ayırt etmek için aklı yönlendiren bir yasa koydular; buna mantık adını verdiler. Okullarının lideri, Platon'un öğrencisi olan Makedon Aristoteles ve ilk öğretmen olarak adlandırdıkları İskender'in öğretmeniydi çünkü o ilkti Mantık yasasının en ünlü benimseyenleri arasında dördüncü yüzyılda Ebu Nasr el-Ferabi ve beşinci yüzyılda Ebu Ali bin Sina vardır. Görüşleri tüm biçimleriyle yanlış olarak değerlendirildi: tüm mevcut varlıkları birincil akla atfetmek, Tanrı'nın yaratılışının arkasındaki eksikliktir. Mantık standardına göre sunulan kanıtları sınırlıdır çünkü bunlar genel zihinsel yargılardır ve dışsal varlıklar öz varlıklarıyla karakterizedir. Belki de zihinsel ile dışsal olanı eşleştirmesini engelleyen materyaller vardır, bu yüzden bunlarda kesinlik yoktur. Doğal konular din veya geçim açısından önemli değildir {atıf:muqaddima-ibn-khaldun s. 548-549}."
  id: "Ibn Khaldun mendedikasikan satu bab untuk penolakan filsafat dan korupsi para penirunya, karena ilmu ini umum dalam pembangunan perkotaan dan memiliki banyak kerugian dalam agama. Para pendukungnya mengklaim bahwa keberadaan adalah melalui indera dan apa yang ada di bawahnya, yang melihat esensi dan keadaannya melalui perspektif intelektual dan ukuran rasional, dan bahwa koreksi kepercayaan iman berasal dari pengamatan, bukan dari pendengaran. Mereka menetapkan hukum yang membimbing akal untuk membedakan antara kebenaran dan kebohongan, yang mereka sebut logika. Pemimpin aliran mereka adalah Aristoteles Makedonia, murid Plato, dan guru Alexander, yang mereka sebut guru pertama karena dia adalah yang pertama Di antara penganut hukum logika yang paling terkenal adalah Abu Nasr al-Farabi pada abad keempat AH dan Abu Ali ibn Sina pada abad kelima. Pendapat mereka dinilai salah dalam segala bentuknya: mengaitkan semua makhluk yang ada pada intelek primer adalah kekurangan dalam apa yang ada di balik barisan ciptaan Tuhan. Bukti mereka yang disajikan menurut standar logika terbatas karena merupakan penilaian mental umum, dan entitas eksternal ditandai oleh substansinya. Mungkin ada materi yang mencegah mental mencocokkan eksternal dengan eksternal, sehingga tidak ada kepastian di dalamnya. Materi alam tidak relevan dalam agama atau mata pencaharian {cite:muqaddima-ibn-khaldun hlm. 548-549}."
