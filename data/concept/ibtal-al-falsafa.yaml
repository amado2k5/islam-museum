id: concept/ibtal-al-falsafa
class: concept
kind: term
label: { ar: "إبطال الفلسفة", en: "The refutation of philosophy" }
summary:
  ar: "خصص ابن خلدون فصلاً لإبطال الفلسفة وفساد منتحلها لأن هذه العلوم عارضة في العمران كثيرة في المدن وضررها في الدين كثير، فأصحابها زعموا أن الوجود كله الحس منه وما وراءه تدرك ذواته وأحواله بالأنظار الفكرية والأقيسة العقلية وأن تصحيح العقائد الإيمانية من قبل النظر لا من جهة السمع، ووضعوا قانوناً يهتدي به العقل إلى التمييز بين الحق والباطل سموه المنطق، وإمام مذاهبهم أرسطو المقدوني من تلاميذ أفلاطون ومعلم الإسكندر الذي يسمونه المعلم الأول لأنه أول من رتب قانون المنطق، ومن أشهر من أخذ بمذاهبهم في الإسلام أبو نصر الفارابي في المائة الرابعة وأبو علي بن سينا في الخامسة، وحكم على رأيهم بأنه باطل بجميع وجوهه: فإسنادهم الموجودات كلها إلى العقل الأول قصور عما وراءه من رتب خلق الله، وبراهينهم المعروضة على معيار المنطق قاصرة لأنها أحكام ذهنية كلية عامة والموجودات الخارجية متشخصة بموادها ولعل في المواد ما يمنع من مطابقة الذهني للخارجي فلا يقين فيها، ومسائل الطبيعيات لا تهم في دين ولا معاش {cite:muqaddima-ibn-khaldun p. 548-549}."
  en: "Philosophy — Aristotle's logic as the canon of truth — fails: its abstract proofs cannot match individuated existents {cite:muqaddima-ibn-khaldun p. 548-549}."
