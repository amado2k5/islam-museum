id: concept/canon-taking-the-pulse-at-the-forearm
class: concept
kind: scientific
label: { ar: "جس نبض الساعد عند ابن سينا", en: "Taking the pulse at the forearm in the Canon", ur: "بازو کی نبض ٹٹولنا قانون میں", es: "Tomar el pulso en el antebrazo en el Canon", fr: "Prendre le pouls à l'avant-bras dans le Canon", tr: "İbn Sina'ya göre ön kolun nabzını hisset", id: "Rasakan denyut nadi lengan bawah menurut Ibn Sina" }
summary:
  ar: "يعلل ابن سينا اختيار عرق الساعد للجس، ويبين وضع اليد ووقت الجس وشروط الممتحن والمفحوص {cite:canon-ibn-sina-print-v1 p.169}."
  en: "Ibn Sina explains why the vessel at the forearm is chosen for feeling the pulse and sets out the position of the hand, the time of examination and the conditions for the patient {cite:canon-ibn-sina-print-v1 p.169}."
  es: "Ibn Sina explica por qué se elige el vaso sanguíneo del antebrazo para sentir el pulso y establece la posición de la mano, el momento del examen y las condiciones para el paciente {cite:canon-ibn-sina-print-v1 p.169}."
  fr: "Ibn Sina explique pourquoi le vaisseau de l'avant-bras est choisi pour sentir le pouls et précise la position de la main, le moment de l'examen et les conditions pour le patient {cite:canon-ibn-sina-print-v1 p.169}."
  ur: "ابن سینا وضاحت کرتے ہیں کہ بازو کے برتن کو نبض محسوس کرنے کے لیے کیوں چنا جاتا ہے اور ہاتھ کی پوزیشن، معائنے کا وقت اور مریض کے لیے حالات کا تعین کرتا ہے۔"
  tr: "İbn Sina, palpasyon için ön kol terinin seçimini, elin pozisyonunu, palpasyon zamanını ve sınav görevlisi ile sınav görevlisinin durumunu açıklar {cite:canon-ibn-sina-print-v1 s.169}."
  id: "Ibn Sina menjelaskan pemilihan keringat lengan bawah untuk palpasi, menjelaskan posisi tangan, waktu palpasi, dan kondisi pemeriksa serta pemeriksa {cite:canon-ibn-sina-print-v1 hlm.169}."
