label:
  ar: "نيل"
  en: "Nil (as the Canon lists it)"
  ur: "نیل"
  es: "Ninguno (según lo indica el Canon)"
  fr: "Néant (comme l'indique le Canon)"
  tr: "Nil"
  id: "Nil"
summary:
  ar: "النيل في الكتاب منه بستاني ومنه بري وفعله فعل البستاني، حار في الأولى يابس في الثانية، قابض يمنع النزف ويجفف بلا لذع، وينفع الجراحات والأورام وسعال الصبيان والطحال {cite:canon-ibn-sina-print-v1 p.575}."
  en: "Nil is in the book of two kinds, garden and wild, the wild acting as the garden does; hot in the first degree and dry in the second, astringent and stopping bleeding, drying without sting, and helpful for wounds, swellings, the cough of children and the spleen {cite:canon-ibn-sina-print-v1 p.575}."
  ur: "نیل کتاب میں دو قسم کا ہے، باغی اور جنگلی، اور جنگلی کا فعل باغی جیسا ہے؛ پہلے درجے میں گرم اور دوسرے میں خشک، قابض اور خون بہنا روکنے والا، بغیر جلن کے خشک کرتا ہے، اور زخموں، ورموں، بچوں کی کھانسی اور تلی میں مفید ہے {cite:canon-ibn-sina-print-v1 p.575}۔"
  es: "Nil está en el libro de dos tipos, de jardín y silvestre, el silvestre actuando como lo hace el de jardín; caliente en el primer grado y seco en el segundo, astringente y deteniendo el sangrado, secando sin picar, y útil para heridas, hinchazones, la tos de los niños y el bazo {cite:canon-ibn-sina-print-v1 p.575}."
  fr: "Le Nil est décrit dans le livre comme étant de deux sortes, le Nil des jardins et le Nil sauvage, le Nil sauvage agissant comme le Nil des jardins; chaud au premier degré et sec au second, astringent et hémostatique, asséchant sans piquer, et utile pour les plaies, les gonflements, la toux des enfants et la rate {cite:canon-ibn-sina-print-v1 p.575}."
  tr: "Kitapta 'Gardener' ve 'Ber' olarak adlandırılır, fiili 'al-botanist'tir; birincisi sıcak, ikincisi kurudur, büzücüdür, kanamayı önler ve kurudur, acıtmaz, ayrıca erkeklerde yaralar, tümörler ve öksürükler ile dalak için faydalıdır {cite:canon-ibn-sina-print-v1 s.575}."
  id: "Dalam buku, disebut 'Gardener' dan 'Ber', dan kata kerjanya 'al-botanist'; panas pada yang pertama dan kering pada yang kedua, astringen yang mencegah pendarahan dan kering tanpa perih, serta bermanfaat untuk luka, tumor, dan batuk pada anak laki-laki dan limpa {cite:canon-ibn-sina-print-v1 hlm.575}."
