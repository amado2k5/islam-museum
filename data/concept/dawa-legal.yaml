label:
  ar: "الدعوى (في القضاء)"
  en: "Claim before the judge (legal sense of da'wa)"
summary:
  ar: "الدعوى في الاصطلاح قول يطلب به الإنسان إثبات حق على الغير في مجلس القاضي أو المحكم، وأركانها عند الجمهور المدعي والمدعى عليه والمدعى به والقول الصادر عن المدعي، وتتنوع بحسب صحتها وبحسب نوع المدعى به، وتشترط لصحتها شروط في القول والخصوم والمدعى به، ويترتب عليها نظر القاضي وحضور الخصم والجواب عنها، وتنتهي غالبا بالحكم أو بالتنازل عنها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8164}"
  en: "In technical usage a claim (da'wa) is a statement by which a person seeks to establish a right against another before a judge or an arbiter. The jurists count its pillars as the claimant, the defendant, the thing claimed and the statement itself. Claims are sorted by soundness and by the kind of thing claimed; a valid claim must meet conditions on the statement, on the parties and on the subject. A claim brings the judge's hearing, the presence of the opponent and an answer, and it usually ends with a judgment or with the claimant's withdrawal {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8118} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8127} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8164}"
  ur: "اصطلاحِ قضا میں دعویٰ وہ قول ہے جس کے ذریعے آدمی قاضی یا حَکَم کی مجلس میں کسی دوسرے پر اپنا حق ثابت کرنے کا مطالبہ کرے۔ جمہور فقہاء کے نزدیک اس کے ارکان مدعی، مدعیٰ علیہ، مدعیٰ بہ اور مدعی کا قول ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8116} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8118}"
