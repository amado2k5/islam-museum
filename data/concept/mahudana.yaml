  tr: "Mahudaneh"
  id: "Mahudaneh"
summary:
  ar: "ماهودانه هو حب الملوك، شجرته السيسبان، حار يابس في الثالثة، يسهل كاليتوعات وينفع بإسهاله من أوجاع المفاصل والنقرس وعرق النسا والاستسقاء والقولنج، ويقيء بقوة ولا يوافق المعدة {cite:canon-ibn-sina-print-v1 p.568}."
  en: "Mahudana is called habb al-muluk, the seed of kings, from the tree called sisaban; hot and dry in the third degree, it purges like the spurges and helps by purging in pains of the joints, gout, sciatica, dropsy and colic, but makes one vomit violently and does not suit the stomach {cite:canon-ibn-sina-print-v1 p.568}."
  ur: "ماہودانہ، جسے حبّ الملوک کہتے ہیں، سیسبان نامی درخت کا دانہ ہے؛ تیسرے درجے میں گرم خشک، یتوعات کی طرح جلاب دیتا ہے اور اپنے اسہال کے ذریعے جوڑوں کے درد، نقرس، عرق النسا، استسقا اور قولنج میں فائدہ دیتا ہے، مگر زور سے قے کراتا ہے اور معدے کو موافق نہیں {cite:canon-ibn-sina-print-v1 p.568}۔"
  es: "Mahudana se llama habb al-muluk, la semilla de los reyes, del árbol llamado sisaban; caliente y seco en tercer grado, purga como las euforbias y ayuda purgando dolores de las articulaciones, gota, ciática, hidropesía y cólicos, pero hace vomitar violentamente y no es adecuado para el estómago {cite:canon-ibn-sina-print-v1 p.568}."
  fr: "Mahudana est appelé habb al-muluk, la graine des rois, de l'arbre appelé sisaban; chaud et sec au troisième degré, il purge comme les euphorbes et aide en purifiant les douleurs articulaires, la goutte, la sciatique, l'hydropisie et les coliques, mais fait vomir violemment et ne convient pas à l'estomac {cite:canon-ibn-sina-print-v1 p.568}."
  tr: "Mahudanası kralların sevgisidir, sispan ağacı ise üçüncü mevsimde sıcak ve kurudur, kolayca kavranır ve eklem ağrıları, gut, siyatik, asit ve kolik gibi ishalleri hafifletmekte faydalıdır. Güçlü kusar ve mideyi doyurmaz {cite:canon-ibn-sina-print-v1 s.568}."
  id: "Mahudana-nya adalah kegemaran raja, pohon sispan-nya, panas dan kering di musim ketiga, mudah diambil dan bermanfaat untuk meredakan diare akibat nyeri sendi, asam urat, saraf panggang, ascites, dan kolik. Ia muntah dengan kuat dan tidak memuaskan perut {cite:canon-ibn-sina-print-v1 hlm.568}."
