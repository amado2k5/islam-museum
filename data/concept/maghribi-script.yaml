id: concept/maghribi-script
class: concept
kind: art_form
label: { ar: "الخط المغربي", en: "Maghribi script", ur: "خطِ مغربی", es: "Escritura magrebí", fr: "Écriture maghrébine", tr: "Fas Alfabesi", id: "Aksara Maroko" }
summary:
  ar: "خط تطور واستعمل أساسًا في الأندلس وشمال أفريقيا، يكتب باليد الحرة دون نسب محددة، ويرى بعض الباحثين أنه الخط الوحيد المشتق من الكوفي، واقتصر غالبًا على المخطوطات {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 51}."
  en: "A script developed and used mainly in Spain and North Africa, written freehand without fixed proportions; some scholars hold it the only script derived from kufic, and it was largely confined to manuscripts {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 51}."
  ur: "ایک خط جو زیادہ تر اندلس اور شمالی افریقہ میں بنا اور برتا گیا، مقررہ تناسب کے بغیر آزاد ہاتھ سے لکھا جاتا؛ بعض محققین اسے کوفی سے نکلنے والا واحد خط مانتے ہیں، اور یہ زیادہ تر مخطوطات تک محدود رہا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 51}۔"
  es: "Un sistema de escritura desarrollado y utilizado principalmente en España y el norte de África, escrito a mano alzada sin proporciones fijas; algunos estudiosos lo consideran el único sistema de escritura derivado del cúfico, y se limitó en gran medida a los manuscritos {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 51}."
  fr: "Une écriture développée et utilisée principalement en Espagne et en Afrique du Nord, écrite à main levée sans proportions fixes; certains érudits la considèrent comme la seule écriture dérivée du coufique, et elle était largement confinée aux manuscrits {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 51}."
  tr: "Endülüs ve Kuzey Afrika'da gelişen ve esas olarak kullanılan, serbest el yazısıyla yazılmış, özel atıf belirtilmeden kullanılan bir yazı kitabı. Bazı araştırmacılar, bunu Kufi alfabesinden türetilmiş tek yazı olarak kabul eder; çoğunlukla el yazmalarıyla sınırlı {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 51}."
  id: "Sebuah aksara yang berkembang dan terutama digunakan di Andalusia dan Afrika Utara, ditulis secara bebas tanpa atribusi khusus. Beberapa peneliti menganggapnya sebagai satu-satunya aksara yang berasal dari aksara Kufic, sebagian besar terbatas pada manuskrip {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 51}."
