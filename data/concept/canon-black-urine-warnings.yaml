summary:
  ar: "يذكر ابن سينا أن البول الأسود إذا لم يكن على سبيل البحران علامة رديئة، خصوصاً في الأمراض الحادة وإذا قل وغلظ، وأنه في ابتداء الحميات قتال، ويورد قول روفس ويعقب عليه {cite:canon-ibn-sina-print-v1 pp.186-187}."
  en: "Ibn Sina says black urine that is not a crisis is a bad sign, especially in acute diseases and when scanty and thick, and deadly at the start of fevers, and he reports the saying of Rufus and comments on it {cite:canon-ibn-sina-print-v1 pp.186-187}."
