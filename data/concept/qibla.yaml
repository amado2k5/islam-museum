id: concept/qibla
education:
  did_you_know:
    ar: "القبلة جهة الكعبة التي يستقبلها المصلي؛ تحوّلت في المدينة من بيت المقدس إلى الكعبة، واستقبالها شرط في صحة الصلاة عند الفقهاء."
    en: "The qibla is the direction of the Kaaba that the worshipper faces; in Medina it shifted from Jerusalem to the Kaaba, and facing it is a condition of valid prayer in fiqh."
    ur: "قبلہ کعبہ کی سمت ہے جس کی طرف نمازی رخ کرتا ہے؛ مدینہ میں یہ بیت المقدس سے کعبہ کی طرف بدل گئی، اور اس کی طرف رخ فقہ میں نماز کی صحت کی شرط ہے۔"
    sources: [source/tafsir-ibn-kathir, source/sabiq-fiqh-al-sunnah]
class: concept
kind: legal
label:
  ar: القبلة
  en: Qibla
  ur: قبلہ
summary:
  ar: "القبلة جهة الكعبة التي يتجه إليها المصلي، وتروي دائرة المعارف الإسلامية أن المسلمين استقبلوا القدس في السنوات الأولى بعد الهجرة ثم حُوّلت القبلة، ويضع التقليد ذلك في رجب أو شعبان من السنة الثانية. وتعرض المقالة أحكام المذهب الشافعي في الاستقبال، وتبيّن كيف حدّد الفلكيون في العصر الوسيط اتجاه القبلة بالرياضيات، ومنهم حبش الحاسب وابن يونس والبيروني والخليلي الذي ألّف جدولًا من نحو ثلاثة آلاف مدخل."
  en: "The qibla is the direction of the Kaaba towards which the worshipper turns in prayer. The Encyclopaedia of Islam reports that the Muslims faced Jerusalem in the first years after the hijra before the direction was changed, which tradition places in Rajab or Sha'ban of the second year. The article also gives the Shafi'i rules on facing it and shows how medieval astronomers such as Habash, Ibn Yunus, al-Biruni and al-Khalili, whose table has almost 3,000 entries, worked out the direction mathematically."
  ur: "قبلہ کعبہ کی وہ سمت ہے جس کی طرف نمازی نماز میں رخ کرتا ہے۔ دائرۃ المعارف الاسلامیہ بتاتی ہے کہ ہجرت کے بعد ابتدائی برسوں میں مسلمانوں نے یروشلم کی طرف رخ کیا اور پھر سمت بدلی گئی، جسے روایت دوسرے سال کے رجب یا شعبان میں رکھتی ہے۔ مضمون شافعی مسلک کے احکامِ استقبال بھی دیتا ہے اور دکھاتا ہے کہ قرونِ وسطیٰ کے ماہرین فلکیات، جیسے حبش، ابن یونس، البیرونی اور الخلیلی، جن کے جدول میں تقریباً تین ہزار اندراجات ہیں، نے ریاضی سے سمت کیسے نکالی۔"
