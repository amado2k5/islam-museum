education:
  did_you_know:
    ar: "القبلة جهة الكعبة التي يستقبلها المصلي؛ تحوّلت في المدينة من بيت المقدس إلى الكعبة، واستقبالها شرط في صحة الصلاة عند الفقهاء."
    en: "The qibla is the direction of the Kaaba that the worshipper faces; in Medina it shifted from Jerusalem to the Kaaba, and facing it is a condition of valid prayer in fiqh."
    ur: "قبلہ کعبہ کی سمت ہے جس کی طرف نمازی رخ کرتا ہے؛ مدینہ میں یہ بیت المقدس سے کعبہ کی طرف بدل گئی، اور اس کی طرف رخ فقہ میں نماز کی صحت کی شرط ہے۔"
    sources: [source/tafsir-ibn-kathir, source/sabiq-fiqh-al-sunnah]
