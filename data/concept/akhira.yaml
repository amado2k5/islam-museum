  id: aqida-wasitiyya
  stance:
    ar: الإيمان بفتنة القبر وعذابه ونعيمه والبعث والميزان والحوض والصراط
    en: Belief in the trial of the grave and its punishment and bliss, the resurrection, the scale, the pool and the bridge
  summary:
    ar: 'يفصّل ابن تيمية الإيمان باليوم الآخر: فتنة القبر والسؤال عن الرب والدين والنبي، ثم النعيم أو العذاب إلى القيامة الكبرى، فتعاد الأرواح إلى الأجساد، وتنصب الموازين وتنشر الدواوين، والحوض الذي طوله شهر وعرضه شهر، والصراط المنصوب على متن جهنم.'
    en: 'Ibn Taymiyya sets out belief in the last day: the trial of the grave and the questions about the Lord, the religion and the prophet, then bliss or punishment until the great resurrection, when spirits are returned to bodies, the scales are set up and the records unrolled, the pool a month long and a month wide, and the bridge set over Hell.'
  holders:
