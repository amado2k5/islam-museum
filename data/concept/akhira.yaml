  stance:
    ar: عذاب القبر والبعث والحساب والحوض والصراط، والجنة والنار مخلوقتان
    en: The punishment of the grave, resurrection, reckoning, the pool and the bridge, and Paradise and Hell are created
  summary:
    ar: يذكر الأشعري أنهم يقرون بعذاب القبر والحوض والصراط والبعث بعد الموت والمحاسبة والوقوف بين يدي الله، وبسؤال منكر ونكير، ويقرون بأن الجنة والنار مخلوقتان.
    en: Al-Ash'ari reports they affirm the punishment of the grave, the pool, the bridge, the resurrection after death, the reckoning and standing before God, and the questioning by Munkar and Nakir, and they affirm that Paradise and Hell are created.
