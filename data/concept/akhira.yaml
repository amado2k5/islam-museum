  id: lumat-al-itiqad
  stance:
    ar: تفصيل أوسع للقبر والبعث والحساب والميزان والحوض والصراط
    en: A fuller account of the grave, resurrection, reckoning, scale, pool and bridge
  summary:
    ar: يذكر ابن قدامة عذاب القبر ونعيمه وفتنة القبر وسؤال منكر ونكير، ثم البعث بعد النفخ في الصور وحشر الناس حفاة عراة، والحساب ونشر الدواوين ونصب الموازين، والميزان له كفتان ولسان، والحوض والصراط، وأن الجنة والنار مخلوقتان لا تفنيان.
    en: Ibn Qudama mentions the punishment and bliss of the grave, the trial of the grave and the questioning by Munkar and Nakir, then the resurrection after the blowing of the trumpet, the gathering of the people barefoot and naked, the reckoning, the unrolling of the records and the setting up of the scales, the scale having two pans and a tongue, the pool and the bridge, and that Paradise and Hell are created and do not perish.
  holders:
  - person/ibn-qudama-al-maqdisi
  - work/lumat-al-itiqad
  evidence:
  - ref: source/lumat-al-itiqad
    note:
      ar: ص 31 إلى 35
      en: pp. 31 to 35
  sources:
