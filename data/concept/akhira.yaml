id: concept/akhira
education:
  did_you_know:
    ar: "تعرض العقيدة الطحاوية بنود الآخرة كاملة: عذاب القبر وسؤال الملكين، ثم البعث والحساب والصراط والميزان، وخلق الجنة والنار حقاً."
    en: "The Tahawi creed lays out the afterlife in order: the grave's torment and the two angels' questioning, then resurrection, reckoning, the Path and the Scale — paradise and hellfire created and real."
    ur: "طحاوی عقیدہ آخرت کی تمام چیزیں ترتیب سے بیان کرتا ہے: قبر کا عذاب اور دو فرشتوں کا سوال، پھر اٹھ کھڑے ہونا، حساب، صراط اور میزان — جنت اور جہنم خلق شدہ اور حقیقی۔"
    sources: [source/aqida-tahawiyya, source/lumat-al-itiqad]
