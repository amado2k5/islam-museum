label: { ar: "الحقد", en: "Grudge (hiqd)", ur: "کینہ (حقد)" }
summary:
  ar: "الحقد في اللغة الضغن والانطواء على البغضاء، وإمساك العداوة في القلب، والتربص لفرصتها، أو سوء الظن على الناس لأجل العداوة، أو طلب الانتقام. وهو في الحقيقة غضب كُظم لعجز صاحبه عن التشفي في الحال، فرجع إلى الباطن واحتقن فصار حقدا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7172} ويفرق عن الحسد، وهو تمني زوال النعمة عن المحسود أو سلبها، وهو أحد ثمار الحقد، وعن الغضب الذي هو أصله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7172} وحكمه يتبع باعثه: إن كان عن حسد وضغن بغير حق فهو مذموم شرعا، لأنه يثير العداوة والبغضاء. وقد ذم القرآن المنافقين الذين يعضون الأنامل غيظا من ائتلاف المؤمنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} ومما ورد في الباب حديث «المؤمن ليس بحقود» الذي قال فيه العراقي إنه لا أصل له مرفوعا، وإنما هو من قول الفضيل بن عياض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} ومن العلاج: الهدية والمصافحة، فقد ورد أنهما يذهبان وحر الصدر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} أما الحقد على ظالم لا يمكن دفع ظلمه، أو على كافر يؤذي المسلمين، فليس مذموما شرعا، وللمظلوم أن يعفو وله أن يأخذ حقه دون حرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} ويذكر الفقهاء أن المناظر لا يكاد يخلو من الحقد على خصمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173}"
  en: "Hiqd is a settled resentment: anger held back when one cannot yet take revenge, which turns inward and becomes enmity, suspicion or a wish for retaliation. It differs from envy (wishing a blessing removed from another) and from anger itself, of which it is the residue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7172} Its ruling follows its motive: resentment born of envy and rancour without right is blameworthy, and the Qur'an censures hypocrites who bite their fingertips in rage at the believers' unity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} The saying 'the believer is not a grudge-holder' is traced by al-Iraqi to al-Fudayl ibn Iyad and not to the Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} Gifts and handshakes are named as remedies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Resentment toward an oppressor who cannot be stopped, or toward an unbeliever harming Muslims, is not blameworthy; the wronged may forgive or take his right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174}"
