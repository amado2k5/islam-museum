id: concept/hiqd-grudge
class: concept
kind: ethical
label: { ar: "الحقد", en: "Grudge (hiqd)", ur: "کینہ ⁦(حقد)⁩", es: "Rencor (hiqd)", fr: "Rancune (hiqd)", tr: "nefret", id: "kebencian" }
summary:
  ar: "الحقد في اللغة الضغن والانطواء على البغضاء، وإمساك العداوة في القلب، والتربص لفرصتها، أو سوء الظن على الناس لأجل العداوة، أو طلب الانتقام. وهو في الحقيقة غضب كُظم لعجز صاحبه عن التشفي في الحال، فرجع إلى الباطن واحتقن فصار حقدا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7172} ويفرق عن الحسد، وهو تمني زوال النعمة عن المحسود أو سلبها، وهو أحد ثمار الحقد، وعن الغضب الذي هو أصله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7172} وحكمه يتبع باعثه: إن كان عن حسد وضغن بغير حق فهو مذموم شرعا، لأنه يثير العداوة والبغضاء. وقد ذم القرآن المنافقين الذين يعضون الأنامل غيظا من ائتلاف المؤمنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} ومما ورد في الباب حديث «المؤمن ليس بحقود» الذي قال فيه العراقي إنه لا أصل له مرفوعا، وإنما هو من قول الفضيل بن عياض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} ومن العلاج: الهدية والمصافحة، فقد ورد أنهما يذهبان وحر الصدر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} أما الحقد على ظالم لا يمكن دفع ظلمه، أو على كافر يؤذي المسلمين، فليس مذموما شرعا، وللمظلوم أن يعفو وله أن يأخذ حقه دون حرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} ويذكر الفقهاء أن المناظر لا يكاد يخلو من الحقد على خصمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173}"
  en: "Hiqd is a settled resentment: anger held back when one cannot yet take revenge, which turns inward and becomes enmity, suspicion or a wish for retaliation. It differs from envy (wishing a blessing removed from another) and from anger itself, of which it is the residue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7172} Its ruling follows its motive: resentment born of envy and rancour without right is blameworthy, and the Qur'an censures hypocrites who bite their fingertips in rage at the believers' unity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} The saying 'the believer is not a grudge-holder' is traced by al-Iraqi to al-Fudayl ibn Iyad and not to the Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} Gifts and handshakes are named as remedies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Resentment toward an oppressor who cannot be stopped, or toward an unbeliever harming Muslims, is not blameworthy; the wronged may forgive or take his right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174}"
  es: "Hiqd es un resentimiento arraigado: ira contenida cuando uno aún no puede vengarse, que se vuelve hacia adentro y se convierte en enemistad, sospecha o deseo de represalia. Se diferencia de la envidia (desear que una bendición se le quite a otro) y de la ira misma, de la cual es un residuo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7172} Su dictamen sigue su motivo: el resentimiento nacido de la envidia y el rencor sin razón es censurable, y el Corán reprende a los hipócritas que se muerden las yemas de los dedos con rabia ante la unidad de los creyentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} El dicho \"el creyente no guarda rencor\" es atribuido por al-Iraqi a al-Fudayl ibn Iyad y no al Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} Los regalos y los apretones de manos se mencionan como remedios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} El resentimiento hacia un opresor que no puede ser detenido, o hacia un infiel que perjudica a los musulmanes, no es censurable; el agraviado puede perdonar o reclamar su derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174}"
  fr: "Le ressentiment (hiqd) est une rancune tenace: une colère contenue, refoulée faute de pouvoir se venger, qui se retourne contre soi et se mue en inimitié, en suspicion ou en désir de représailles. Il diffère de l’envie (souhaiter qu’une bénédiction soit retirée à autrui) et de la colère elle-même, dont il est le résidu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7172} Son châtiment découle de son motif: le ressentiment né de l’envie et de la rancune sans fondement est blâmable, et le Coran condamne les hypocrites qui s’indignent de l’unité des croyants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} L’adage « le croyant ne garde pas de rancune » est attribué par al-Iraqi à al-Fudayl ibn Iyad et non au Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7173} Les cadeaux et les poignées de main sont cités comme remèdes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174} Le ressentiment envers un oppresseur qu'on ne peut arrêter, ou envers un non-croyant qui nuit aux musulmans, n'est pas blâmable; la victime peut pardonner ou faire valoir ses droits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7174}"
  ur: "حق ایک طے شدہ ناراضگی ہے: غصہ اس وقت روکا جاتا ہے جب کوئی بدلہ نہیں لے سکتا، جو اندر کی طرف مڑ جاتا ہے اور دشمنی، شک یا انتقام کی خواہش بن جاتا ہے۔ یہ حسد ⁦(دوسرے سے برکت کی خواہش کرنا)⁩ اور غصے سے مختلف ہے، جس میں سے یہ باقی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص7172} اس کا حکم اس کے مقصد کے مطابق ہے: حق کے بغیر حسد اور کینہ سے پیدا ہونے والی ناراضگی قابل مذمت ہے، اور قرآن ان منافقوں کی مذمت کرتا ہے جو مومنین کے اتحاد پر غصے میں انگلیاں کاٹتے ہیں۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 ص7173} یہ قول 'مومن بغض رکھنے والا نہیں ہے' کو عراقی نے فضیل بن عیاض سے نقل کیا ہے نہ کہ نبی سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7173} تحفے اور مصافحہ کو علاج کا نام دیا گیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7174} ایسے ظالم کے خلاف ناراضگی جس کو روکا نہیں جا سکتا، یا مسلمانوں کو نقصان پہنچانے والے کافر کے خلاف، قابل مذمت نہیں ہے۔ مظلوم معاف کر سکتا ہے یا اپنا حق لے سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7174}"
  tr: "Nefret, dilde, kin ve nefrete çekilmek, kalpte düşmanlık tutmak, fırsatını beklemek ya da düşmanlıktan ya da intikam peşinde koşmaktan dolayı insanlara kötü düşünceler beslemektir. Gerçekte, sahibi hemen zevk alamadığı için bastırılmış öfkedir, bu yüzden iç benliğine geri döner, sıkıştırılır ve nefrete dönüşür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7172} Kıskançlıktan farklıdır; kıskançlık, kıskançlıktan kutsamanın kaybolmasını ya da onu almasını istemektir; nefretin meyvelerinden biridir ve kaynağı öfkedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7172} Hükmetmesi kökenini takip eder: eğer haksız kıskançlık ve nefretten kaynaklanıyorsa, İslam hukukuna göre suçludur, çünkü düşmanlık ve düşmanlık körükler. Kur'an, inananlar ittifağına öfkeyle parmaklarını ısıran münafıkları kınadı. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7173} Bu bölümde bahsedilen hadisler arasında \"İnanan kin dolu değildir\" hadisi vardır; burada Al-Iraqi'nin marfu kaynağı olmadığını, bunun yerine el-Fudayl ibn 'Iyad'ın sözünden geldiğini söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7173} Çözümler arasında: hediyeler ve el sıkışmalar, çünkü bunların kalbi özgür bıraktığı bildirilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7174} Adaletsizliği reddedilemeyen bir zallime ya da Müslümanlara zarar veren bir kâfire karşı nefret İslam hukukunda kınanmaz; ezilen kişiler haklarını zarar vermeden affedebilir ve alabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7174} Hukukçular, bir yarışmacının rakibine karşı nefretten neredeyse tamamen muaf olmadığını belirtir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7173}"
  id: "Kebencian, dalam bahasa, adalah dendam dan menarik diri menjadi kebencian, menyimpan permusuhan di hati, menunggu kesempatan, atau menyimpan pikiran buruk orang lain karena permusuhan atau mencari balas dendam. Sebenarnya, kemarahan yang ditekan karena pemiliknya tidak dapat segera menikmati kesenangan, sehingga ia kembali ke dirinya sendiri dan menjadi terbatas, menjadi kebencian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7172} Ini berbeda dengan iri hati, yaitu keinginan agar berkat itu hilang dari yang iri atau mengambilnya, dan ia adalah salah satu buah kebencian, dan dari kemarahan, itulah asalnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7172} Keputusannya mengikuti asal-usulnya: jika karena iri hati dan kebencian tanpa hak, maka ia dianggap salah menurut hukum Islam, karena ia menimbulkan permusuhan dan permusuhan. Al-Qur'an mengutuk para munafik yang menggigit jari mereka karena marah terhadap koalisi orang beriman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7173} Di antara hadis yang disebutkan dalam bab ini adalah hadis \"Orang beriman tidak berdendam,\" di mana Al-Iraqi mengatakan bahwa ia tidak memiliki sumber marfu' (marfu'), melainkan berasal dari perkataan al-Fudayl ibn 'Iyad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7173} Di antara obat-obatan tersebut: hadiah dan jabat tangan, karena dilaporkan bahwa itu pergi dan membebaskan hati. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7174} Adapun kebencian terhadap penindas yang ketidakadilannya tidak dapat dilawan, atau terhadap orang kafir yang menyakiti Muslim, itu tidak tercela dalam hukum Islam, dan orang yang tertindas dapat mengampuni dan mengambil hak mereka tanpa bahaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7174} Para ahli hukum menyebutkan bahwa seorang peserta hampir tidak bebas dari kebencian terhadap lawannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7173}"
