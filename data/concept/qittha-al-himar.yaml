summary:
  ar: "قثاء الحمار في الكتاب حار يابس في الثالثة لطيف محلل، وعصارته تنفع من اليرقان وتحلل الورم البلغمي القديم والشقيقة وتسكن وجع الأذن، وللاستسقاء منفعة مذكورة، ويذكر الكتاب أن عصارته تفسد الجنين {cite:canon-ibn-sina-print-v1 pp.657-658}"
  en: "Qittha' al-himar is in the book hot and dry in the third degree, subtle and dissolving; its juice benefits jaundice, dissolves the old phlegmatic swelling and migraine and calms earache; the book names a benefit in dropsy; and it lists that its juice spoils the foetus {cite:canon-ibn-sina-print-v1 pp.657-658}"
  ur: "قثاء الحمار کتاب میں تیسرے درجے میں گرم خشک، لطیف اور گھلانے والا ہے؛ اس کا رس یرقان میں نافع ہے، پرانے بلغمی ورم اور آدھے سر کے درد کو گھلاتا ہے اور کان کے درد کو تسکین دیتا ہے؛ کتاب استسقا میں اس کا فائدہ بیان کرتی ہے؛ اور درج ہے کہ اس کا رس جنین کو خراب کرتا ہے {cite:canon-ibn-sina-print-v1 pp.657-658}۔"
  es: "En el libro, Qittha' al-himar es caliente y seco en tercer grado, sutil y disolvente; su jugo beneficia la ictericia, disuelve la inflamación flemática antigua y la migraña, y calma el dolor de oído; el libro menciona un beneficio en la hidropesía; y enumera que su jugo daña el feto {cite:canon-ibn-sina-print-v1 pp.657-658}"
  fr: "Le Qittha' al-himar est décrit dans le livre comme chaud et sec au troisième degré, subtil et dissolvant; son jus est bénéfique en cas de jaunisse, dissout les anciens œdèmes et migraines et calme les maux d'oreilles; le livre mentionne un bienfait dans l'hydropisie; et il est indiqué que son jus est nocif pour le fœtus {cite:canon-ibn-sina-print-v1 pp.657-658}"
  tr: "Kitaptaki eşeğin tutamı sıcak ve kuru; üçüncüde ise nazik ve tükenmiş. Suyu sarılığa fayda sağlar, eski flegmatik ve migren tümörlerini çözer ve kulak ağrısını hafifletir. Escites'in bahsedilen bir faydası vardır. Kitapta suyunun fetüsü bozduğu belirtilir {cite:canon-ibn-sina-print-v1 s.657-658}"
  id: "Bulu keledai dalam buku ini panas dan kering; pada buku ketiga, lembut dan terkuras. Jusnya bermanfaat bagi penyakit kuning, melarutkan tumor dahak dan migrain lama, serta meredakan sakit telinga. Escites memiliki manfaat yang disebutkan. Buku ini menyebutkan bahwa jusnya merusak janin {cite:canon-ibn-sina-print-v1 hlm.657-658}"
