label:
  ar: "التصفية"
  en: "Tasfiya (settling a deceased person's estate and debts)"
  ur: "تصفیہ (ترکے اور قرضوں کا تصفیہ)"
summary:
  ar: "التصفية مجموع الأعمال التي غايتها حصر حقوق المتوفى والتزاماته وأداء الحقوق المتعلقة بالتركة لأصحابها من الدائنين والموصى لهم والورثة. وهو اصطلاح حديث تعارف عليه أهل القانون، ولم يتكلم عنه الفقهاء بهذا العنوان، لكنهم بينوا حقوق التركة وحقوق القصر وحقوق الدائنين والموصى لهم بتفصيل في مداخل التركة والإرث والوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5247}"
  en: "Tasfiya is the whole of the work whose aim is to list the dead person's rights and obligations and to pay the claims on the estate to those who hold them, creditors, legatees and heirs. It is a modern term used by lawyers; the jurists did not treat it under this heading, but they set out the rights of the estate, of minors, of creditors and of legatees in the entries on the estate, inheritance and bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5247}"
