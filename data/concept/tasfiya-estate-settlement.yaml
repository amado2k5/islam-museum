id: concept/tasfiya-estate-settlement
class: concept
kind: legal
label:
  ar: "التصفية"
  en: "Tasfiya (settling a deceased person's estate and debts)"
  ur: "تصفیہ ⁦(ترکے اور قرضوں کا تصفیہ)⁩"
  es: "Tasfiya (liquidación de la herencia y las deudas de una persona fallecida)"
  fr: "Tasfiya (règlement de la succession et des dettes d'une personne décédée)"
summary:
  ar: "التصفية مجموع الأعمال التي غايتها حصر حقوق المتوفى والتزاماته وأداء الحقوق المتعلقة بالتركة لأصحابها من الدائنين والموصى لهم والورثة. وهو اصطلاح حديث تعارف عليه أهل القانون، ولم يتكلم عنه الفقهاء بهذا العنوان، لكنهم بينوا حقوق التركة وحقوق القصر وحقوق الدائنين والموصى لهم بتفصيل في مداخل التركة والإرث والوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5247}"
  en: "Tasfiya is the whole of the work whose aim is to list the dead person's rights and obligations and to pay the claims on the estate to those who hold them, creditors, legatees and heirs. It is a modern term used by lawyers; the jurists did not treat it under this heading, but they set out the rights of the estate, of minors, of creditors and of legatees in the entries on the estate, inheritance and bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5247}"
  es: "La tasfiya es la obra completa cuyo objetivo es enumerar los derechos y obligaciones del difunto y distribuir las reclamaciones sobre la herencia entre sus titulares: acreedores, legatarios y herederos. Es un término moderno utilizado por los abogados; los juristas no lo trataban bajo este epígrafe, pero sí establecían los derechos de la herencia, de los menores, de los acreedores y de los legatarios en las entradas relativas a la herencia y el legado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5247}"
  fr: "La tasfiya désigne l'ensemble des documents ayant pour but de recenser les droits et obligations du défunt et de régler les créances successorales entre les créanciers, les légataires et les héritiers. Ce terme moderne est employé par les juristes; les auteurs ne le traitaient pas sous cette appellation, mais ils mentionnaient les droits de la succession, des mineurs, des créanciers et des légataires dans les actes de succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5247}"
  ur: "توصیفہ وہ کام ہے جس کا مقصد مرنے والے کے حقوق اور واجبات کی فہرست بنانا اور جائیداد کے دعووں کی ادائیگی ان لوگوں کو کرنا ہے جو ان کے پاس ہیں، قرض دہندگان، وارثوں اور وارثوں کو۔ یہ ایک جدید اصطلاح ہے جسے وکلاء نے استعمال کیا ہے۔ فقہاء نے اس عنوان کے تحت اس کا علاج نہیں کیا، بلکہ انہوں نے جائیداد، وراثت اور وصیت کے اندراجات میں جائیداد، نابالغوں، قرض دہندگان اور وراثت کے حقوق کا تعین کیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 5247}"
