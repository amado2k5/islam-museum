label:
  ar: "يتّوع"
  en: "Yatu' (the milky spurges)"
  ur: "یتوع ⁦(دودھیا پودے)⁩"
  es: "Yatu' (las euforbias lechosas)"
  fr: "Yatu' (les euphorbes laiteuses)"
summary:
  ar: "كل نبات له لبن حاد مسهّل مقطّع محرق؛ والمشهور منه سبعة، وأقواها لبنه، وهو مقرّح قتّال، يذكر الكتاب فوائده في إزالة الشعر والثآليل والكلف والبواسير ولا يُنقل فيه المقدار."
  en: "Any plant with a sharp, purgative, cutting, burning milk. The book names seven well-known kinds; the milk is the strongest part and is ulcerating and deadly. Its uses named include removing hair, warts and piles, with the amounts left out."
  ur: "ہر وہ پودا جس کا دودھ تیز، اسہال آور، کاٹنے والا اور جلانے والا ہو۔ کتاب سات مشہور اقسام بتاتی ہے؛ دودھ سب سے قوی حصہ ہے اور زخم کرنے والا اور جان لیوا ہے۔ اس کے فوائد میں بال، مسے اور بواسیر کا ذکر ہے، مقداریں نقل نہیں کی گئیں۔"
  es: "Cualquier planta con una savia irritante, purgante, cortante y urticante. El libro menciona siete tipos conocidos; la savia es la parte más potente, ulcerante y mortal. Entre sus usos se incluyen la depilación, la eliminación de verrugas y hemorroides, aunque se especifican las cantidades."
  fr: "Toute plante dont le latex est âcre, purgatif et brûlant. L'ouvrage cite sept espèces bien connues; le latex, partie la plus puissante, est ulcérogène et potentiellement mortel. Parmi ses usages mentionnés figurent l'épilation, le traitement des verrues et des hémorroïdes, sans toutefois préciser les quantités."
