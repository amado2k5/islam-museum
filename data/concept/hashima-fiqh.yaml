label: { ar: "هاشِمة", en: "Hashima (a head wound that breaks the bone: its compensation)", es: "Hashima (una herida en la cabeza que fractura el hueso: su compensación)", fr: "Hashima (une blessure à la tête qui brise l'os: sa compensation)", ur: "ہاشمہ ⁦(سر کا زخم جس سے ہڈی ٹوٹ جاتی ہے: اس کا معاوضہ)⁩", tr: "Haşima", id: "Hashema" }
summary:
  ar: "الهاشمة في اللغة شجة تهشم العظم، وفي الاصطلاح عند الجمهور هي الشجة التي تكسر العظم، وزاد الشافعية ولو بلا انفصال وبلا إيضاح، وعند الحنابلة وبعض الشافعية التي توضح العظم وتهشمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} والهاشمة لا قصاص فيها باتفاق الفقهاء، وتجب فيها الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} واختلف في مقدارها: فقال الشافعية والحنابلة عشر من الإبل بقول زيد بن ثابت، وقال الحنفية عشر الدية، وللمالكية أقوال بحسب تعريفهم لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} وإذا كانت هاشمة مع موضحة تجمع الدية بينهما، وإذا أحب المجني عليه أن يقتص من الموضحة جاز، وفي أرش الزائد خلاف بين الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771} وخص المالكية هاشمة الجسد بالحكومة إذا امتنع القصاص، وجمهور الفقهاء لا يسمون كسر العظام في غير الرأس والوجه هاشمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771}"
  en: "Hashima in the lexical sense is a wound that breaks the bone of the head; for the majority it is a wound that breaks the bone, the Shafi'is adding that it does so even without separating the flesh or exposing the bone, and the Hanbalis and some Shafi'is defining it as a wound that exposes and breaks the bone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} No retaliation is due for it, by agreement, and compensation is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} The Shafi'is and Hanbalis fix it at ten camels, on the ruling of Zayd ibn Thabit; the Hanafis at a tenth of the full diya; the Malikis differ according to their definitions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} When a hashima accompanies a muwadiha, the compensations combine, and the victim may take retaliation for the muwadiha, with the schools differing on the extra arsh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771} The Malikis give discretionary compensation for a broken bone in the body where retaliation is excluded, and most jurists do not call a break in the body other than the head or face a hashima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771}"
  es: "Hashima en el sentido léxico es una herida que rompe el hueso de la cabeza; para la mayoría es una herida que rompe el hueso, los Shafi'is agregan que lo hace incluso sin separar la carne o exponer el hueso, y los Hanbalis y algunos Shafi'is la definen como una herida que expone y rompe el hueso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} No se debe represalia por ello, por acuerdo, y se debe compensación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} Los Shafi'is y los Hanbalis la fijan en diez camellos, en el dictamen de Zayd ibn Thabit; los Hanafis en una décima parte de la diya completa; los Malikis difieren según sus definiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} Cuando un hashima acompaña a un muwadiha, las compensaciones se combinan y la víctima puede recibir represalias por la muwadiha, y las escuelas discreparon sobre el arsh adicional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771} Los malikíes otorgan una compensación discrecional por una fractura ósea en el cuerpo cuando se excluye la represalia, y la mayoría de los juristas no consideran hashima una fractura en el cuerpo que no sea la cabeza o el rostro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771}"
  fr: "Hashima, au sens littéral, est une blessure qui brise l'os du crâne; pour la majorité, il s'agit d'une blessure qui brise l'os, les chaféites ajoutant qu'elle le fait même sans décollement de la chair ni exposition de l'os, tandis que les hanbalites et certains chaféites la définissent comme une blessure qui expose et brise l'os. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} Aucune vengeance n'est due, par accord mutuel, et une compensation est due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} Les chaféites et les hanbalites la fixent à dix chameaux, selon l'avis de Zayd ibn Thabit; les hanafites à un dixième de la diya entière; les malikites divergent selon leurs définitions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} Lorsqu'un hashima accompagne un muwadiha, les indemnisations se cumulent et la victime peut exercer une vengeance pour le muwadiha, les écoles divergeant quant à l'arsh supplémentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771} Les Malikites accordent une indemnisation discrétionnaire pour une fracture corporelle lorsque la vengeance est exclue, et la plupart des juristes ne considèrent pas comme hashima une fracture autre que celle de la tête ou du visage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771}"
  ur: "لغوی معنوں میں ہاشمہ ایک ایسا زخم ہے جو سر کی ہڈی کو توڑ دیتا ہے۔ جمہور کے نزدیک یہ ایک ایسا زخم ہے جو ہڈی کو توڑتا ہے، شافعی کہتے ہیں کہ یہ گوشت کو الگ کیے بغیر یا ہڈی کو ظاہر کیے بغیر ایسا کرتا ہے، اور حنبلی اور بعض شافعی اسے ایسا زخم کہتے ہیں جو ہڈی کو کھول کر توڑ دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16768} معاہدے کے ذریعے اس کے لیے کوئی انتقام واجب نہیں ہے، اور معاوضہ واجب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16768} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16769} شافعی اور حنبلی اسے زید بن ثابت کے حکم پر دس اونٹوں پر مقرر کرتے ہیں۔ حنفیہ پوری دیت کے دسویں حصے پر۔ مالکی اپنی تعریفوں کے مطابق مختلف ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16768} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16769} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16770} جب کوئی معاوضہ اور اس کی تعمیل کرتا ہے متاثرہ شخص معاوضہ کا بدلہ لے سکتا ہے، اسکولوں میں اضافی عرش پر اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16770} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16771} مالکی جسم میں ٹوٹی ہوئی ہڈی کا صوابدیدی معاوضہ دیتے ہیں جہاں بدلہ خارج ہوتا ہے، اور اکثر فقہا کے نزدیک سر کے ٹوٹنے یا جسم کے ٹوٹنے کے علاوہ جسم کی ہڈی ٹوٹ جاتی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص16771}"
  tr: "Dilbilimde 'haşima' kemiği kıran bir 'shajja'dır ve çoğunluğun terimiyle 'shajja' kemiği kırır. Şafi'ler ayrım veya açıklama olmadan bile eklenirken, Hanbaliler ve bazı Şafiilerde kemiği netleştirir ve kırar. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.16768} Haşime, hukukçuların uzlaşmasıyla kısalara (qisa) tabi değildir ve kan parası zorunludur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16769} Miktarı konusunda anlaşmazlık vardır: Şafi'ler ve Hanbaliler Zayd ibn Thabit'e göre on deve söylerken, Hanafiler on kan parası söylerken, Malikiler tanımlarına göre farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16770} Eğer belirli bir Haşimi ise, kan parası aralarında birleştirilir ve mağdur belirtilen miktardan intikam almak isterse, bu kabul edilebilir. Şafi'ler ile Hanbaliler arasında fazla 'arsh' (ek tazminat) konusunda bir anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16771} Malikis, intikam yapılmazsa bedeni hükümete sınırlar ve çoğu hukukçu baş ve yüz dışındaki kemik kırıklarını Haşimi olarak adlandırmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16771}"
  id: "Dalam linguistik, 'hashima' adalah 'shajja' yang mematahkan tulang, dan dalam istilah mayoritas, 'shajja' yang mematahkan tulang. Shafi'i ditambahkan bahkan tanpa pemisahan atau penjelasan, sedangkan di antara Hanbalis dan beberapa Shafi'i, ia memperjelas dan mematahkan tulang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16768} Hashimah tidak tunduk pada qisa (qisa) berdasarkan kesepakatan para ahli hukum, dan uang darah wajib di dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16769} Ada perbedaan pendapat mengenai jumlahnya: Shafi'i dan Hanbal mengatakan sepuluh unta menurut Zayd ibn Thabit, sementara Hanafi mengatakan sepuluh uang darah, sementara Maliti memiliki pendapat berbeda menurut definisi mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16770} Jika dia seorang Hasyemit dengan sebutan tertentu, uang darah digabungkan di antara mereka, dan jika korban ingin mendapatkan pembalasan dari jumlah yang ditentukan, maka diperbolehkan. Ada perselisihan antara para Shafi'i dan Hanbal mengenai kelebihan 'arsh' (kompensasi tambahan). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16771} Malikis membatasi badan ini hanya kepada pemerintah jika pembalasan dihindari, dan mayoritas ahli hukum tidak menyebut patah tulang pada hal lain selain kepala dan wajah sebagai Hashemi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16771}"
