label: { ar: "هاشِمة", en: "Hashima (a head wound that breaks the bone: its compensation)" }
summary:
  ar: "الهاشمة في اللغة شجة تهشم العظم، وفي الاصطلاح عند الجمهور هي الشجة التي تكسر العظم، وزاد الشافعية ولو بلا انفصال وبلا إيضاح، وعند الحنابلة وبعض الشافعية التي توضح العظم وتهشمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} والهاشمة لا قصاص فيها باتفاق الفقهاء، وتجب فيها الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} واختلف في مقدارها: فقال الشافعية والحنابلة عشر من الإبل بقول زيد بن ثابت، وقال الحنفية عشر الدية، وللمالكية أقوال بحسب تعريفهم لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} وإذا كانت هاشمة مع موضحة تجمع الدية بينهما، وإذا أحب المجني عليه أن يقتص من الموضحة جاز، وفي أرش الزائد خلاف بين الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771} وخص المالكية هاشمة الجسد بالحكومة إذا امتنع القصاص، وجمهور الفقهاء لا يسمون كسر العظام في غير الرأس والوجه هاشمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771}"
  en: "Hashima in the lexical sense is a wound that breaks the bone of the head; for the majority it is a wound that breaks the bone, the Shafi'is adding that it does so even without separating the flesh or exposing the bone, and the Hanbalis and some Shafi'is defining it as a wound that exposes and breaks the bone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} No retaliation is due for it, by agreement, and compensation is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} The Shafi'is and Hanbalis fix it at ten camels, on the ruling of Zayd ibn Thabit; the Hanafis at a tenth of the full diya; the Malikis differ according to their definitions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} When a hashima accompanies a muwadiha, the compensations combine, and the victim may take retaliation for the muwadiha, with the schools differing on the extra arsh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771} The Malikis give discretionary compensation for a broken bone in the body where retaliation is excluded, and most jurists do not call a break in the body other than the head or face a hashima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16771}"
