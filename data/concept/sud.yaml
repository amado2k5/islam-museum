  ar: "سعد"
  en: "Sud (the root called sa'd)"
  ur: "سعد"
summary:
  ar: "السعد في الكتاب أصل نبات يصفه ديسقوريدوس بأوراق كالكراث وأصول سود كالزيتون طيبة الرائحة فيها مرارة، أجوده الكثيف الرزين العطر، يحسن اللون ويطيب النكهة، وينفع القروح والفم والمثانة والكلى والحميات العتيقة ولسع العقرب، ويذكر له نقلاً موسوماً في الرحم والبواسير {cite:canon-ibn-sina-print-v1 p.584}."
  en: "Sud is in the book the root of a plant that Dioscorides describes with leaves like leek and black roots like olives, sweet in smell with some bitterness; the best is the dense, heavy, fragrant kind; it improves colour and sweetens the breath and helps ulcers, the mouth, the bladder, the kidneys, old fevers and scorpion sting, and the book gives a labelled listing on the womb and haemorrhoids {cite:canon-ibn-sina-print-v1 p.584}."
  ur: "سعد کتاب میں ایک پودے کی جڑ ہے جسے دیسقوریدوس کراث جیسے پتوں اور زیتون جیسی سیاہ، خوشبودار، قدرے تلخ جڑوں والا بتاتا ہے؛ بہترین گھنا، بھاری، خوشبودار ہے؛ رنگ نکھارتا اور سانس مہکاتا ہے، اور زخموں، منہ، مثانے، گردوں، پرانے بخاروں اور بچھو کے ڈنک میں مفید ہے، اور کتاب رحم اور بواسیر کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.584}۔"
