summary:
  ar: "خندروس في الكتاب هو الحنطة الرومية، غذاؤه أبرد من غذاء الحنطة وأقل، وهو مع ذلك جيد كثير قوي غليظ {cite:canon-ibn-sina-print-v1 p.717}"
  en: "Khandarus is in the book the Roman wheat, its nourishment colder than the nourishment of wheat and less, yet good, abundant, strong and thick {cite:canon-ibn-sina-print-v1 p.717}"
  ur: "خندروس کتاب میں رومی گندم ہے، اس کی غذا گندم کی غذا سے زیادہ ٹھنڈی اور کم ہے، اور پھر بھی اچھی، وافر، قوی اور گاڑھی ہے {cite:canon-ibn-sina-print-v1 p.717}۔"
  es: "En el libro, Khandarus es el trigo romano, cuyo alimento es más frío que el del trigo común y menos abundante, pero bueno, abundante, fuerte y grueso {cite:canon-ibn-sina-print-v1 p.717}."
  fr: "Khandarus est décrit dans le livre comme le blé romain, dont la nourriture est plus froide et moins abondante que celle du blé, mais néanmoins bonne, abondante, forte et épaisse {cite:canon-ibn-sina-print-v1 p.717}"
  tr: "Kitapta Khandrus, Roma buğdayından bahseder; besin buğday yiyeceğinden daha soğuk ve daha az olsa da, çok iyi, güçlü ve yoğundur {cite:canon-ibn-sina-print-v1 s.717}"
  id: "Khandrus dalam buku merujuk pada gandum Romawi; makanannya lebih dingin dan kurang dari makanan gandum, namun sangat baik, kuat, dan kental {cite:canon-ibn-sina-print-v1 hlm.717}"
