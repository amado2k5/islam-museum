summary:
  ar: "خزف ذو بدن أصفر شاحب وزخرفة مرسومة بالأسود والأصفر والأخضر تحت طلاء رصاصي، من أكبر مجموعات فخار نيسابور، نشأ في خراسان ولم يُعرف قبل اكتشافه في نيسابور سنة 1935 {cite:wilkinson-nishapur-pottery p. 46}."
  en: "Ware with a buff body and decoration painted in black, yellow and green under a lead glaze, one of the largest groups of Nishapur pottery; it originated in Khurasan and was unknown before its discovery at Nishapur in 1935 {cite:wilkinson-nishapur-pottery p. 46}."
  ur: "زرد مائل بدن اور سیسے کے لعاب کے نیچے سیاہ، زرد اور سبز نقش والے ظروف، نیشاپور کے ظروف کے بڑے گروہوں میں سے؛ خراسان میں پیدا ہوئے اور 1935ء میں نیشاپور میں دریافت سے پہلے نامعلوم تھے {cite:wilkinson-nishapur-pottery p. 46}."
