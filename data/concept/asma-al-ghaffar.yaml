summary:
  ar: 'الغفار: الكثير المغفرة لذنوب عباده مهما عظمت. الاسم رقم 14 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Ghaffar — The Ever-Forgiving. Name 14 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Ghaffar — Celui qui ne cesse de pardonner. Nom 14 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'الغفار: بہت بخشنے والا — جو بندوں کے گناہ بار بار معاف کرے۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 14۔'
  es: "al-Ghaffar — El Perdonador. Nombre número 14 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Ghaffar: En Bağışlayan, En Bağışlayan, En Bağışlayan, En Affedici, Hizmetkârlarının günahları için, ne kadar büyük olursa olsun. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerde bahsedilen listede 14. numarayı belirtin."
  id: "Al-Ghaffar: Yang Paling Ampun, Yang Paling Pemaaf, atas dosa-dosa hamba-Nya, tidak peduli seberapa besar. Nama nomor 14 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Allah."
