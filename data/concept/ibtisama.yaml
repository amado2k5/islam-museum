id: concept/ibtisama
class: concept
kind: ethical
label:
  ar: "الابتسامة"
  en: "The smile (ibtisama)"
  ur: "مسکراہٹ ⁦(ابتسامہ)⁩"
  es: "La sonrisa (ibtisama)"
  fr: "Le sourire (ibtisama)"
  tr: "Gülümse"
  id: "Tersenyumlah"
summary:
  ar: "الابتسامة في درس الشيخ عمر عبد الكافي بابٌ إلى حسن المعاملة، فيحثّ الشيخ على أن يبدأ المرء لقاءه بالابتسامة والسلام وحسن السؤال. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} ويروي أن النبي ابتسم لرجل دخل عليه وهو غاضب. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} ويرى أن الابتسامة في وجه العدو تُشعره بقوة المرء. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
  en: "In Sheikh Omar Abdelkafy's lessons the smile is a doorway to good dealing: he urges a person to begin a meeting with a smile, a greeting of peace and a kind enquiry. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} He relates that the Prophet smiled at a man who came in while he was angry. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} He holds that a smile at an enemy shows the smiler's strength. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
  ur: "شیخ عمر عبد الکافی کے درس میں مسکراہٹ حسنِ معاملہ کا دروازہ ہے، چنانچہ وہ تلقین کرتے ہیں کہ آدمی ملاقات کا آغاز مسکراہٹ، سلام اور حال پوچھنے سے کرے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} وہ بیان کرتے ہیں کہ نبی نے ایک ایسے آدمی کی طرف مسکرا کر دیکھا جو ان کی ناراضی کے وقت اندر آیا۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} ان کی رائے ہے کہ دشمن کی طرف مسکرانا اس پر آدمی کی طاقت ظاہر کرتا ہے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
  es: "En las enseñanzas del Sheikh Omar Abdelkafy, la sonrisa es una puerta de entrada a las buenas relaciones: insta a la persona a comenzar una reunión con una sonrisa, un saludo de paz y una pregunta amable. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} Relata que el Profeta sonrió a un hombre que entró enojado. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} Sostiene que una sonrisa a un enemigo muestra la fortaleza de quien sonríe. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
  fr: "Dans les enseignements du cheikh Omar Abdelkafy, le sourire est une porte ouverte à la bienveillance: il exhorte à entamer une rencontre par un sourire, une salutation de paix et une question bienveillante. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} Il rapporte que le Prophète a souri à un homme qui était entré en colère. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} Il soutient qu'un sourire adressé à un ennemi témoigne de la force de celui qui sourit. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
  tr: "Şeyh Ömer Abdulkafi'nin dersinde gülümsemek, iyi muamele üzerine bir bölüm vardır; kişinin buluşmasına gülümseme, selam ve nazik sorgulamayla başlamasını teşvik eder. {cite:assabile-omar-abdelkafy tafsir-al-Quran-al-Kareem/ep02 00:33:00} Peygamber'in, kendisine öfkeyle yaklaşan bir adama gülümsediği rivayet edilir. {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep02 00:34:00} Bir düşmanın karşısında gülümsemenin bir kişinin gücünü hissettirdiğine inanır. {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep02 00:50:30}"
  id: "Tersenyum dalam pelajaran Sheikh Omar Abdulkafi adalah bab tentang perlakuan baik, mendorong seseorang untuk memulai pertemuan dengan senyuman, salam, dan pertanyaan yang ramah. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} Diceritakan bahwa Nabi tersenyum kepada seorang pria yang mendekatinya dengan marah. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} Ia percaya bahwa tersenyum di hadapan musuh membuatnya merasakan kekuatan seseorang. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
