id: concept/ibtisama
class: concept
kind: ethical
label:
  ar: "الابتسامة"
  en: "The smile (ibtisama)"
  ur: "مسکراہٹ (ابتسامہ)"
summary:
  ar: "الابتسامة في درس الشيخ عمر عبد الكافي بابٌ إلى حسن المعاملة، فيحثّ الشيخ على أن يبدأ المرء لقاءه بالابتسامة والسلام وحسن السؤال. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} ويروي أن النبي ابتسم لرجل دخل عليه وهو غاضب. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} ويرى أن الابتسامة في وجه العدو تُشعره بقوة المرء. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
  en: "In Sheikh Omar Abdelkafy's lessons the smile is a doorway to good dealing: he urges a person to begin a meeting with a smile, a greeting of peace and a kind enquiry. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} He relates that the Prophet smiled at a man who came in while he was angry. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} He holds that a smile at an enemy shows the smiler's strength. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
  ur: "شیخ عمر عبد الکافی کے درس میں مسکراہٹ حسنِ معاملہ کا دروازہ ہے، چنانچہ وہ تلقین کرتے ہیں کہ آدمی ملاقات کا آغاز مسکراہٹ، سلام اور حال پوچھنے سے کرے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:33:00} وہ بیان کرتے ہیں کہ نبی نے ایک ایسے آدمی کی طرف مسکرا کر دیکھا جو ان کی ناراضی کے وقت اندر آیا۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:34:00} ان کی رائے ہے کہ دشمن کی طرف مسکرانا اس پر آدمی کی طاقت ظاہر کرتا ہے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:50:30}"
