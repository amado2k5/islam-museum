label:
  ar: "التضبيب"
  en: "Tadbib (binding a vessel or tool with metal, esp. gold or silver)"
  ur: "تضبیب (برتن یا آلے کو دھات سے جوڑنا، خاص کر سونے یا چاندی سے)"
summary:
  ar: "التضبيب إصلاح الإناء أو نحوه بضبة من حديد أو فضة أو ذهب تشده. والفرق بينه وبين التطعيم والتمويه أن التضبيب للإصلاح والتطعيم للزينة بالحفر، والتمويه طلاء بماء الذهب أو الفضة. وأجاز الحنفية التضبيب واستعمال المضبب مع الكراهة، ويتقي موضع اليد والفم. وحرّمه المالكية في الراجح مطلقاً. وحرم الشافعية والحنابلة تضبيب الإناء بالذهب مطلقاً، وبالفضة الكبيرة عرفاً لغير حاجة، وأباحوا الضبة الفضية الصغيرة للحاجة، لحديث قدح النبي الذي اتخذ فيه سلسلة من فضة مكان الشعب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297}"
  en: "Tadbib is repairing a vessel or the like with a clamp of iron, silver or gold. It differs from inlay, which is by cutting into the surface for decoration, and from gilding, which is a coat of gold or silver water. The Hanafis allow tadbib and the use of a bound vessel with dislike, avoiding the place of the hand and the mouth. The Malikis, in the preferred view, forbid it in all cases. The Shafiis and Hanbalis forbid gold absolutely and large silver clamps that are ornamental without need; a small silver clamp for need is allowed, on the hadith of the Prophet's cup mended with a silver chain. Beyond need, the sounder Shafii view disliked it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297}"
