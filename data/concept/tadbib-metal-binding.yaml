id: concept/tadbib-metal-binding
class: concept
kind: legal
label:
  ar: "التضبيب"
  en: "Tadbib (binding a vessel or tool with metal, esp. gold or silver)"
  ur: "تضبیب ⁦(برتن یا آلے کو دھات سے جوڑنا، خاص کر سونے یا چاندی سے)⁩"
  es: "Tadbib (unión de un recipiente o herramienta con metal, especialmente oro o plata)"
  fr: "Tadbib (lier un récipient ou un outil avec du métal, notamment de l'or ou de l'argent)"
summary:
  ar: "التضبيب إصلاح الإناء أو نحوه بضبة من حديد أو فضة أو ذهب تشده. والفرق بينه وبين التطعيم والتمويه أن التضبيب للإصلاح والتطعيم للزينة بالحفر، والتمويه طلاء بماء الذهب أو الفضة. وأجاز الحنفية التضبيب واستعمال المضبب مع الكراهة، ويتقي موضع اليد والفم. وحرّمه المالكية في الراجح مطلقاً. وحرم الشافعية والحنابلة تضبيب الإناء بالذهب مطلقاً، وبالفضة الكبيرة عرفاً لغير حاجة، وأباحوا الضبة الفضية الصغيرة للحاجة، لحديث قدح النبي الذي اتخذ فيه سلسلة من فضة مكان الشعب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297}"
  en: "Tadbib is repairing a vessel or the like with a clamp of iron, silver or gold. It differs from inlay, which is by cutting into the surface for decoration, and from gilding, which is a coat of gold or silver water. The Hanafis allow tadbib and the use of a bound vessel with dislike, avoiding the place of the hand and the mouth. The Malikis, in the preferred view, forbid it in all cases. The Shafiis and Hanbalis forbid gold absolutely and large silver clamps that are ornamental without need; a small silver clamp for need is allowed, on the hadith of the Prophet's cup mended with a silver chain. Beyond need, the sounder Shafii view disliked it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297}"
  es: "Tadbib consiste en reparar un recipiente o similar con una abrazadera de hierro, plata u oro. Se diferencia de la incrustación, que consiste en tallar la superficie para decorarla, y del dorado, que es una capa de oro o plata. Los hanafíes permiten el tadbib y el uso de un recipiente atado, aunque con desaprobación, evitando la zona de contacto con la mano y la boca. Los malikíes, en su opinión preferida, lo prohíben en todos los casos. Los shafiíes y los hanbalíes prohíben el oro por completo y las grandes abrazaderas de plata ornamentales sin necesidad; se permite una pequeña abrazadera de plata para casos de necesidad, según el hadiz de la copa del Profeta reparada con una cadena de plata. Más allá de la necesidad, la opinión shafií más sólida lo desaprueba. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5295} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5296} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297}"
  fr: "Le tadbib consiste à réparer un récipient à l'aide d'une bride en fer, en argent ou en or. Il se distingue de la marqueterie, qui consiste à inciser la surface à des fins décoratives, et de la dorure, qui est une couche d'or ou d'argent. Les hanafites autorisent le tadbib et l'utilisation d'un récipient ainsi serti, mais avec une certaine réticence, en évitant le contact avec la main et la bouche. Les malikites, dans leur avis prédominant, l'interdisent formellement. Les chaféites et les hanbalites interdisent totalement l'or et les grandes brides en argent à des fins ornementales non nécessaires; une petite bride en argent, utilisée en cas de besoin, est autorisée, conformément au hadith de la coupe du Prophète réparée avec une chaînette en argent. Au-delà de la nécessité, l'avis chaféite, plus rigoureux, le désapprouve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5297}"
  ur: "تدبیب لوہے، چاندی یا سونے کے کلیمپ سے برتن یا اس طرح کی مرمت کر رہا ہے۔ یہ جڑنا سے مختلف ہے، جو سجاوٹ کے لیے سطح میں کاٹ کر ہوتا ہے، اور گلڈنگ سے، جو سونے یا چاندی کے پانی کا کوٹ ہوتا ہے۔ حنفیہ ہاتھ اور منہ کی جگہ سے گریز کرتے ہوئے تذیب اور ناپسندیدہ برتن کے استعمال کی اجازت دیتے ہیں۔ مالکیوں کے نزدیک ترجیحی لحاظ سے اسے ہر حال میں حرام قرار دیا گیا ہے۔ شافعی اور حنبلی سونا اور چاندی کے بڑے کلیمپوں کو بالکل حرام قرار دیتے ہیں جو بغیر ضرورت کے زیور ہوتے ہیں۔ چاندی کی زنجیر کے ساتھ ترمیم شدہ نبی کے پیالے کی حدیث پر، ضرورت کے لیے چاندی کے چھوٹے کلیمپ کی اجازت ہے۔ ضرورت سے بڑھ کر شافعی کا قول اسے ناپسند تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5295} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5296}"
