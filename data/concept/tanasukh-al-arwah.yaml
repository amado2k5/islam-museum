label: { ar: "تنقل الأرواح", en: "The transmigration of souls" }
summary:
  ar: "مذهب حكاه المسعودي عن طائفة من الفلاسفة القدماء اليونانيين والهند ممن لم يثبت كلاماً منزلاً ولا نبياً مرسلاً منهم أفلاطون ومن يمم طريقهم، زعموا أن النفس جوهر ليست بجسم حية عالمة مميزة لأجل ذاتها مدبرة للأجسام المركبة، وأنها تلذ وتألم وتموت وموتها عندهم انتقالها من جسد إلى جسد بتدبير وبطلان الشخص الذي فسد {cite:muruj-al-dhahab p. 546-547}."
  en: "The doctrine al-Mas'udi reports from the early Greek and Indian philosophers — Plato among them — that the soul is a self-knowing, body-managing substance whose 'death' is its managed passage from body to body {cite:muruj-al-dhahab p. 546-547}."
