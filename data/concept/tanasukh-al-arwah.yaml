id: concept/tanasukh-al-arwah
class: concept
kind: doctrine
label: { ar: "تنقل الأرواح", en: "The transmigration of souls", es: "La transmigración de las almas", fr: "La transmigration des âmes", ur: "روحوں کی منتقلی۔", tr: "Ruh Hareketi", id: "Gerakan Jiwa" }
summary:
  ar: "مذهب حكاه المسعودي عن طائفة من الفلاسفة القدماء اليونانيين والهند ممن لم يثبت كلاماً منزلاً ولا نبياً مرسلاً منهم أفلاطون ومن يمم طريقهم، زعموا أن النفس جوهر ليست بجسم حية عالمة مميزة لأجل ذاتها مدبرة للأجسام المركبة، وأنها تلذ وتألم وتموت وموتها عندهم انتقالها من جسد إلى جسد بتدبير وبطلان الشخص الذي فسد {cite:muruj-al-dhahab p. 546-547}."
  en: "The doctrine al-Mas'udi reports from the early Greek and Indian philosophers — Plato among them — that the soul is a self-knowing, body-managing substance whose 'death' is its managed passage from body to body {cite:muruj-al-dhahab p. 546-547}."
  es: "La doctrina que al-Mas'udi recoge de los primeros filósofos griegos e indios —entre ellos Platón— es que el alma es una sustancia autoconsciente que gestiona el cuerpo y cuya \"muerte\" es su paso controlado de un cuerpo a otro {cite:muruj-al-dhahab p. 546-547}."
  fr: "La doctrine rapportée par al-Mas'udi d'après les premiers philosophes grecs et indiens — Platon parmi eux — selon laquelle l'âme est une substance consciente d'elle-même et gérant son corps, dont la « mort » est son passage géré d'un corps à l'autre {cite:muruj-al-dhahab p. 546-547}."
  ur: "نظریہ المسعودی ابتدائی یونانی اور ہندوستانی فلاسفروں سے رپورٹ کرتا ہے - ان میں افلاطون - کہ روح ایک خود کو جاننے والا، جسم کا انتظام کرنے والا مادہ ہے جس کی 'موت' جسم سے جسم تک اس کا انتظام ہے {حوالہ: مروج الذہاب صفحہ 546-547}۔"
  tr: "El-Mas'udi tarafından, Platon ve onların yolunu takip edenler dahil hiçbir vahiy edilmiş veya gönderilmiş peygamberi kanıtlamayan antik Yunan ve Hintli filozoflar grubundan anlatılan bir doktrin, ruhun öz olduğu, kendi başına ayrı olan ve bileşik bedenleri yöneten, zevk verdiğini, acı çektiğini, öldüğünü ve onlar için ölümünün, yozlaşmış kişinin planı ve geçersizliği yoluyla bir bedenden diğerine geçiş olduğunu iddia etmiştir {cite:muruj-al-dhahab s. 546-547}."
  id: "Sebuah doktrin yang diceritakan oleh al-Mas'udi dari sekelompok filsuf Yunani dan India kuno yang tidak membuktikan nabi yang diwahyukan atau dikirim, termasuk Plato dan mereka yang mengikuti jalan mereka, menyatakan bahwa jiwa adalah esensi, bukan tubuh hidup yang berpengetahuan yang terpisah demi dirinya sendiri dan mengelola tubuh gabungan, dan bahwa jiwa menikmati, menderita, mati, dan kematiannya bagi mereka adalah perpindahan dari satu tubuh ke tubuh lain melalui perencanaan dan ketidakabsahan orang yang telah rusak {cite:muruj-al-dhahab hlm. 546-547}."
