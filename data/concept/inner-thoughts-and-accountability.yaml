id: concept/inner-thoughts-and-accountability
class: concept
kind: belief
label: { ar: "خواطر النفس والمحاسبة عليها", en: "Inner thoughts and whether they are accounted for", ur: "دل کے خیالات اور ان کا محاسبہ", es: "Los pensamientos internos y si se tienen en cuenta.", fr: "Les pensées intérieures et la question de savoir si elles sont prises en compte", tr: "Benlik ve Sorumluluk Üzerine Düşünceler", id: "Refleksi tentang Diri dan Akuntabilitas Terhadapnya" }
summary:
  ar: "يعرض الشعراوي قول الله في البقرة 284 إن كل ما في النفس يُحاسب عليه، ويذكر مراتب النوازع الخمس: الهاجس والخاطر وحديث النفس والهم والعزم، ويرى أن الحساب على العزم والقصد، وأن آية التكليف بالوسع خبر لا ناسخ، وأن ابن عمر بكى لما سمع الآية {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}."
  en: "On al-Baqara 284, Sha'rawi takes up the verse that God will account for what is in people's selves. He lists five stages of inner movement: the fleeting thought, the passing idea, the self's talk, the resolve to seek means, and the firm intention. He holds that the account falls on intention and resolve, and that the verse about God not burdening a soul beyond its capacity is news, not an abrogation. He reports that Ibn Umar wept on hearing the verse {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}."
  ur: "شعراوی البقرہ 284 میں اس بات پر بات کرتے ہیں کہ دل میں جو کچھ ہے اس کا محاسبہ ہوگا۔ وہ دل کی حرکات کی پانچ منزلیں بیان کرتے ہیں: ہاجس، خاطر، حدیثِ نفس، ہم اور عزم۔ ان کے نزدیک محاسبہ ارادے اور عزم پر ہے، اور وسعت کے مطابق تکلیف والی آیت خبر ہے، ناسخ نہیں۔ وہ نقل کرتے ہیں کہ ابن عمر نے یہ آیت سن کر رو دیا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}۔"
  es: "En al-Baqara 284, Sha'rawi aborda el versículo que dice que Dios dará cuenta de lo que hay en el interior de las personas. Enumera cinco etapas del movimiento interior: el pensamiento fugaz, la idea pasajera, el diálogo interno, la resolución de buscar medios y la firme intención. Sostiene que la rendición de cuentas recae sobre la intención y la resolución, y que el versículo sobre Dios no sobrecarga a un alma más allá de su capacidad es una novedad, no una abrogación. Relata que Ibn Umar lloró al escuchar el versículo {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}."
  fr: "Dans son commentaire sur al-Baqara 284, Sha'rawi examine le verset selon lequel Dieu rendra compte de ce qui se trouve dans l'âme humaine. Il énumère cinq étapes du mouvement intérieur: la pensée fugace, l'idée passagère, le monologue intérieur, la résolution de chercher des moyens et l'intention ferme. Il soutient que le jugement repose sur l'intention et la résolution, et que le verset affirmant que Dieu n'impose pas à l'âme une charge supérieure à ses capacités est une nouveauté, et non une abrogation. Il rapporte qu'Ibn Umar pleura en entendant ce verset."
  tr: "El-Şaarawi, Tanrı'nın El-Bekarah 284'teki her şeyin sorumlu olduğunu belirterek, motivasyonların beş seviyesini belirtir: takıntı, düşünce, ruhun konuşması, endişe ve kararlılık. Hesabın kararlılık ve amaca dayandığına, görev ayetinin güçlü olmak için bir rapor olduğunu, akıl almaz olmadığını ve İbn Ömer'in şu ayeti duyduğunda ağladığını düşünür {cite:tafsir-sharawi-khawatir-scan-cilt 2 s.1234} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1235}}."
  id: "Al-Shaarawi menyampaikan pernyataan Tuhan dalam Al-Baqarah 284 bahwa segala sesuatu dalam jiwa bertanggung jawab, menyebutkan lima tingkat motivasi: obsesi, pikiran, pembicaraan jiwa, kekhawatiran, dan tekad. Ia percaya bahwa perhitungan didasarkan pada tekad dan tujuan, bahwa ayat kewajiban untuk menjadi sekuat adalah laporan daripada tidak membatalkan, dan bahwa Ibn Umar menangis ketika mendengar ayat {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1235}."
