perspectives:
  - tradition: sunni
    id: sunni-sharawi-intention-and-resolve-accounted
    stance: { ar: "يُحاسب الإنسان على القصد والعزم، والآية التي بعدها خبر لا ناسخ", en: "A person is accounted for intention and resolve, and the verse that follows is news, not an abrogation", ur: "انسان کا محاسبہ قصد اور عزم پر ہوتا ہے، اور اس کے بعد والی آیت خبر ہے ناسخ نہیں" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن ما يُحاسب عليه هو القصد والعزم، وأن الآية التي بعدها خبر لا يُنسخ، وينقل عن ابن عمر بكاءه، وعن ابن عباس قوله، دون أن يذكر من خالفهما {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}."
      en: "Sha'rawi holds that what is accounted is intention and resolve, that the verse that follows is news and cannot be abrogated, and he reports Ibn Umar's weeping and Ibn Abbas's reply, without naming anyone who disagreed {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}."
      ur: "شعراوی کے نزدیک محاسبہ قصد اور عزم پر ہے، اور اس کے بعد والی آیت خبر ہے جو منسوخ نہیں ہو سکتی۔ وہ ابن عمر کا رونا اور ابن عباس کا قول نقل کرتے ہیں، اور کسی مخالف کا نام نہیں لیتے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}۔"
