id: concept/inner-thoughts-and-accountability
class: concept
kind: belief
label: { ar: "خواطر النفس والمحاسبة عليها", en: "Inner thoughts and whether they are accounted for", ur: "دل کے خیالات اور ان کا محاسبہ" }
summary:
  ar: "يعرض الشعراوي قول الله في البقرة 284 إن كل ما في النفس يُحاسب عليه، ويذكر مراتب النوازع الخمس: الهاجس والخاطر وحديث النفس والهم والعزم، ويرى أن الحساب على العزم والقصد، وأن آية التكليف بالوسع خبر لا ناسخ، وأن ابن عمر بكى لما سمع الآية {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}."
  en: "On al-Baqara 284, Sha'rawi takes up the verse that God will account for what is in people's selves. He lists five stages of inner movement: the fleeting thought, the passing idea, the self's talk, the resolve to seek means, and the firm intention. He holds that the account falls on intention and resolve, and that the verse about God not burdening a soul beyond its capacity is news, not an abrogation. He reports that Ibn Umar wept on hearing the verse {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}."
  ur: "شعراوی البقرہ 284 میں اس بات پر بات کرتے ہیں کہ دل میں جو کچھ ہے اس کا محاسبہ ہوگا۔ وہ دل کی حرکات کی پانچ منزلیں بیان کرتے ہیں: ہاجس، خاطر، حدیثِ نفس، ہم اور عزم۔ ان کے نزدیک محاسبہ ارادے اور عزم پر ہے، اور وسعت کے مطابق تکلیف والی آیت خبر ہے، ناسخ نہیں۔ وہ نقل کرتے ہیں کہ ابن عمر نے یہ آیت سن کر رو دیا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1234} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1235}۔"
