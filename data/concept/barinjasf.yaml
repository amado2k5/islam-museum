  fr: "Barinjasf (armoise, absinthe)"
  ur: "برنجاسف ⁦(قیصوم)⁩"
summary:
  ar: "نبات يشبه الأفسنتين، لونه أخضر ورطوبته دبقية، وفيه صنف أقصر أغصاناً وأعظم ورقاً. بارد رطب في الأولى، ملطّف مفتّح جداً. ينفع من الصداع البارد، ومن سدة الأنف والزكام، ويفتّت الحصاة في الكلية، وينفع من انضمام الرحم وصلابته. ويذكر الكتاب له إدرار الطمث وإسقاط المشيمة والجنين، فتُسجَّل كما وردت {cite:canon-ibn-sina-print-v1 p.387}، {cite:canon-ibn-sina-print-v1 p.388}."
  en: "A plant like absinthe, green in colour with a sticky moisture. There is a variety with shorter branches and larger leaves. Cold and moist in the first degree; very thinning and opening. It helps cold headache, blocked nose and cold, breaks up kidney stone, and helps a closed or hardened womb. The book also lists menses, the afterbirth and the foetus, recorded as its own listing {cite:canon-ibn-sina-print-v1 p.387}, {cite:canon-ibn-sina-print-v1 p.388}."
  fr: "Plante semblable à l’absinthe, verte et pourvue d’une humidité visqueuse. Une variété a des rameaux plus courts et des feuilles plus grandes. Froide et humide au premier degré, très fluidifiante et désobstruante, elle aiderait contre les céphalées froides, le nez bouché et le rhume, briserait les calculs rénaux et aiderait l’utérus fermé ou induré. Le livre mentionne aussi les règles, le placenta et le fœtus, indications rapportées comme les siennes {cite:canon-ibn-sina-print-v1 p.387}, {cite:canon-ibn-sina-print-v1 p.388}."
  ur: "یہ افسنتین جیسا پودا ہے، جس کا رنگ سبز اور اندر چپچپی تری ہوتی ہے۔ اس کی ایک قسم کی شاخیں چھوٹی اور پتے بڑے ہوتے ہیں۔ پہلے درجے میں ٹھنڈا اور تر، بہت پتلا کرنے اور کھولنے والا۔ یہ سرد دردِ سر، بند ناک اور زکام میں نفع دیتا ہے، گردے کی پتھری توڑتا ہے، اور رحم کے بند ہونے اور سختی میں نفع دیتا ہے۔ کتاب اس کے حیض جاری کرنے اور مشیمہ اور جنین گرانے کے اقوال بھی درج کرتی ہے، جو کتاب کا اپنا بیان ہیں {cite:canon-ibn-sina-print-v1 p.387}، {cite:canon-ibn-sina-print-v1 p.388}۔"
