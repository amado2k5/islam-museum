id: concept/hirasa
class: concept
kind: legal
label: { ar: "الحراسة", en: "Guarding (hirasa)", ur: "حراسہ ⁦(پہرہ دینا)⁩", es: "Vigilancia (hirasa)", fr: "Garder (hirasa)", tr: "Muhafız", id: "Penjaga" }
summary:
  ar: "الحراسة في اللغة حفظ الشيء حفظا مستمرا، وفي الاصطلاح لا يخرج عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} وتفترق عن الرباط، وهو الإقامة بالثغر تقوية للمسلمين، والحمى وهو منع الناس من رعي بقعة معينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} وتعتريها الأحكام الخمسة: فتجب كحراسة طائفة من الجيش في صلاة الخوف، وتستحب كالحراسة في الثغور والغزو تطوعا، وتباح كحراسة الثمار والأسواق، وتحرم كحراسة أماكن اللهو المحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} ويجوز عند الفقهاء في الجملة استخدام الكلب للحراسة، وفي ضمان الحارس خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6980}"
  en: "Hirasa (guarding) means keeping a thing safe continuously, and the term keeps this meaning in law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} It differs from ribat, which is residence at a frontier to strengthen the Muslims, and from himan, the reservation of a plot against grazing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} It takes the five rulings: obligatory, as when part of an army guards another during the prayer of fear; recommended, as in guarding a frontier or a volunteer raid; permitted, as in guarding fruit or markets; and forbidden, as in guarding places of unlawful amusement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} Using a dog for guarding is generally allowed, and the guard's liability is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6980}"
  es: "Hirasa (vigilancia) significa mantener algo seguro continuamente, y el término conserva este significado en la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} Se diferencia de ribat, que es la residencia en una frontera para fortalecer a los musulmanes, y de himan, la reserva de una parcela contra el pastoreo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} Toma las cinco reglas: obligatorio, como cuando parte de un ejército vigila a otro durante la oración del temor; recomendado, como en vigilar una frontera o una incursión de voluntarios; permitido, como en vigilar frutas o mercados; y prohibido, como en vigilar lugares de diversión ilícita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} Generalmente se permite el uso de perros guardianes, y la responsabilidad del guardián es objeto de controversia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6980}"
  fr: "Hirasa (garde) signifie assurer la sécurité continue d'une chose, et ce terme conserve ce sens en droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} Il diffère de ribat, qui désigne la résidence à une frontière pour renforcer les musulmans, et de himan, qui désigne la mise en réserve d'une parcelle de terrain pour le pâturage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} Il comprend cinq catégories: obligatoire, comme lorsqu'une partie d'une armée en garde une autre pendant la prière de crainte; recommandée, comme pour la garde d'une frontière ou d'une expédition de volontaires; permise, comme pour la garde des fruits ou des marchés; et interdite, comme pour la garde des lieux de divertissement illicites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} L'utilisation d'un chien de garde est généralement autorisée, et la responsabilité du gardien est controversée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6980}"
  ur: "حراسہ کا مطلب ہے کسی چیز کو مسلسل محفوظ رکھنا، اور اصطلاح اس معنی کو قانون میں رکھتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6978} یہ رباط سے مختلف ہے، جو مسلمانوں کو مضبوط کرنے کے لیے سرحد پر رہائش ہے، اور ہیمان سے، چرنے کے خلاف سازش کی بکنگ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6978} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6979} اس کے پانچ احکام ہیں: واجب، جیسا کہ جب فوج کا ایک حصہ خوف کی نماز کے دوران دوسرے کی حفاظت کرتا ہے۔ سفارش کی جاتی ہے، جیسا کہ سرحدوں کی حفاظت یا رضاکارانہ حملے میں؛ اجازت ہے، جیسا کہ پھلوں یا منڈیوں کی حفاظت میں ہے۔ اور حرام، جیسا کہ غیر قانونی تفریحی مقامات کی حفاظت میں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6979} کتے کو حفاظت کے لیے استعمال کرنے کی عموماً اجازت ہے، اور محافظ کی ذمہ داری میں اختلاف ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص6980}"
  tr: "Dilde koruma, sürekli bir şeyi ezberlemek demektir ve terminolojide bunun ötesine geçmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6978} Bu, sınırda kalmak için Müslümanları güçlendirmek için 'ribat' ve insanların belirli bir yerde otlatmasını engellemek için kullanılan 'hamma'dan farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6979} ve beş kurala tabidir: korku namazında bir grup askeri korumak gibi, sınırları ve istilaları gönüllü olarak korumak, meyve ve pazarları korumak için izin vermek ve yasak eğlence yerlerini korumak gibi zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6979} Hukukçulara göre, köpeğin nöbetçi olarak kullanılması caizdir, ancak muhafızın garantisi konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6980}"
  id: "Dalam bahasa, menjaga berarti menghafal sesuatu secara terus-menerus, dan dalam istilah itu, tidak lebih dari itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6978} Ini berbeda dengan 'ribat,' yang berarti tinggal di perbatasan untuk memperkuat umat Muslim, dan 'hamma,' yang berarti mencegah orang merumput di suatu tempat tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6979} dan tunduk pada lima keputusan: wajib seperti menjaga sekelompok tentara dalam doa ketakutan, direkomendasikan sebagai penjaga perbatasan dan invasi secara sukarela, diizinkan sebagai penjaga buah dan pasar, dan dilarang sebagai penjaga tempat hiburan terlarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6979} Menurut para ahli hukum, diperbolehkan menggunakan anjing untuk penjagaan, tetapi ada perbedaan pendapat mengenai jaminan penjaga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6980}"
