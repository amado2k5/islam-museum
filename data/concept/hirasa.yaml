label: { ar: "الحراسة", en: "Guarding (hirasa)", ur: "حراسہ (پہرہ دینا)" }
summary:
  ar: "الحراسة في اللغة حفظ الشيء حفظا مستمرا، وفي الاصطلاح لا يخرج عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} وتفترق عن الرباط، وهو الإقامة بالثغر تقوية للمسلمين، والحمى وهو منع الناس من رعي بقعة معينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} وتعتريها الأحكام الخمسة: فتجب كحراسة طائفة من الجيش في صلاة الخوف، وتستحب كالحراسة في الثغور والغزو تطوعا، وتباح كحراسة الثمار والأسواق، وتحرم كحراسة أماكن اللهو المحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} ويجوز عند الفقهاء في الجملة استخدام الكلب للحراسة، وفي ضمان الحارس خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6980}"
  en: "Hirasa (guarding) means keeping a thing safe continuously, and the term keeps this meaning in law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} It differs from ribat, which is residence at a frontier to strengthen the Muslims, and from himan, the reservation of a plot against grazing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} It takes the five rulings: obligatory, as when part of an army guards another during the prayer of fear; recommended, as in guarding a frontier or a volunteer raid; permitted, as in guarding fruit or markets; and forbidden, as in guarding places of unlawful amusement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6979} Using a dog for guarding is generally allowed, and the guard's liability is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6980}"
