label: { ar: "البداوة والحضارة", en: "Badawa and hadara" }
summary:
  ar: "قرر ابن خلدون أن أجيال البدو والحضر طبيعية لا بد منها لاختلاف نحلتهم من المعاش، وأن البادية أصل العمران والأمصار مدد لها لأن الضروري أقدم من الحاجي والكمالي، وأن جيل العرب في الخلقة طبيعي وهم أشد الناس توحشاً لاختصاصهم بالقيام على الإبل دون الشياه والبقر فأوغلوا في القفار، وأن أهل البدو أقرب إلى الخير من أهل الحضر لأن النفس على الفطرة الأولى متهيئة لقبول ما ينطبع فيها وأهل الحضر تلونت أنفسهم بمذمومات الخلق لكثرة ما يعانون من الملاذ، وأنهم أقرب إلى الشجاعة لأن أهل الحضر وكلوا أمرهم في المدافعة إلى ولاتهم والحامية والأسوار فتنزلوا منزلة النساء والولدان {cite:muqaddima-ibn-khaldun p. 114-122}. وأن العرب لا يتغلبون إلا على البسائط لأنهم بطبيعة التوحش أهل انتهاب وعيث لا يذهبون إلى المزاحفة إلا إذا دفعوا عن أنفسهم والقبائل الممتنعة بالأوعار في منجاة من عيثهم، وإذا تغلبوا على أوطان أسرع إليها الخراب، ولا يحصل لهم الملك إلا بصبغة دينية من نبوة أو ولاية أو أثر عظيم من الدين لأنهم لخلق التوحش أصعب الأمم انقياداً بعضهم لبعض فإذا كان فيهم النبي أو الولي كان الوازع لهم من أنفسهم وذهب خلق الكبر والمنافسة فسهل انقيادهم وتم اجتماعهم وحصل لهم التغلب والملك، وهم أسرع الناس قبولاً للحق لسلامة طباعهم {cite:muqaddima-ibn-khaldun p. 146-150}"
  en: "The desert precedes the city; camel-nomads are the wildest; the bedouin closer to fitra and courage {cite:muqaddima-ibn-khaldun p. 114-122}."
