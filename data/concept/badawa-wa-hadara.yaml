id: concept/badawa-wa-hadara
class: concept
kind: term
label: { ar: "البداوة والحضارة", en: "Badawa and hadara" }
summary:
  ar: "قرر ابن خلدون أن أجيال البدو والحضر طبيعية لا بد منها لاختلاف نحلتهم من المعاش، وأن البادية أصل العمران والأمصار مدد لها لأن الضروري أقدم من الحاجي والكمالي، وأن جيل العرب في الخلقة طبيعي وهم أشد الناس توحشاً لاختصاصهم بالقيام على الإبل دون الشياه والبقر فأوغلوا في القفار، وأن أهل البدو أقرب إلى الخير من أهل الحضر لأن النفس على الفطرة الأولى متهيئة لقبول ما ينطبع فيها وأهل الحضر تلونت أنفسهم بمذمومات الخلق لكثرة ما يعانون من الملاذ، وأنهم أقرب إلى الشجاعة لأن أهل الحضر وكلوا أمرهم في المدافعة إلى ولاتهم والحامية والأسوار فتنزلوا منزلة النساء والولدان {cite:muqaddima-ibn-khaldun p. 114-122}."
  en: "The desert precedes the city; camel-nomads are the wildest; the bedouin closer to fitra and courage {cite:muqaddima-ibn-khaldun p. 114-122}."
sources: [source/muqaddima-ibn-khaldun]
