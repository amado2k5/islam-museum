label:
  ar: "البداوة والحضارة"
  en: "Badawa and hadara"
  fr: "Vie bédouine et vie sédentaire"
  es: "Badawa y hadara"
  ur: "بدوا اور ہدرہ"
  tr: "Bedeviler ve Uygarlık"
  id: "Badui dan Peradaban"
summary:
  ar: "قرر ابن خلدون أن أجيال البدو والحضر طبيعية لا بد منها لاختلاف نحلتهم من المعاش، وأن البادية أصل العمران والأمصار مدد لها لأن الضروري أقدم من الحاجي والكمالي، وأن جيل العرب في الخلقة طبيعي وهم أشد الناس توحشاً لاختصاصهم بالقيام على الإبل دون الشياه والبقر فأوغلوا في القفار، وأن أهل البدو أقرب إلى الخير من أهل الحضر لأن النفس على الفطرة الأولى متهيئة لقبول ما ينطبع فيها وأهل الحضر تلونت أنفسهم بمذمومات الخلق لكثرة ما يعانون من الملاذ، وأنهم أقرب إلى الشجاعة لأن أهل الحضر وكلوا أمرهم في المدافعة إلى ولاتهم والحامية والأسوار فتنزلوا منزلة النساء والولدان {cite:muqaddima-ibn-khaldun p. 114-122}. وأن العرب لا يتغلبون إلا على البسائط لأنهم بطبيعة التوحش أهل انتهاب وعيث لا يذهبون إلى المزاحفة إلا إذا دفعوا عن أنفسهم والقبائل الممتنعة بالأوعار في منجاة من عيثهم، وإذا تغلبوا على أوطان أسرع إليها الخراب، ولا يحصل لهم الملك إلا بصبغة دينية من نبوة أو ولاية أو أثر عظيم من الدين لأنهم لخلق التوحش أصعب الأمم انقياداً بعضهم لبعض فإذا كان فيهم النبي أو الولي كان الوازع لهم من أنفسهم وذهب خلق الكبر والمنافسة فسهل انقيادهم وتم اجتماعهم وحصل لهم التغلب والملك، وهم أسرع الناس قبولاً للحق لسلامة طباعهم {cite:muqaddima-ibn-khaldun p. 146-150}"
  en: "The desert precedes the city; camel-nomads are the wildest; the bedouin closer to fitra and courage {cite:muqaddima-ibn-khaldun p. 114-122}."
  fr: "Selon Ibn Khaldun, le désert précède la ville, les nomades chameliers sont les plus éloignés de la vie policée, et les Bédouins plus proches de la fitra et du courage {cite:muqaddima-ibn-khaldun p. 114-122}."
  es: "El desierto precede a la ciudad; los nómadas camellos son los más salvajes; los beduinos están más cerca de la fitra y el coraje {cite:muqaddima-ibn-khaldun p. 114-122}."
  ur: "صحرا شہر سے آگے ہے۔ اونٹ خانہ بدوش سب سے جنگلی ہیں۔ اعرابی فطرت اور ہمت کے قریب {حوالہ: مقدّمہ ابن خلدون ص۔ 114-122}۔"
  tr: "İbn Haldun, bedevi ve kentsel kuşakların geçim farklılıkları nedeniyle doğal ve gerekli olduğunu, çölün kentsel gelişimin kaynağı olduğunu ve şehirlerin genişlediğini çünkü ihtiyaç sahipleri ve mükemmellerin önünde geldiğini ortaya koymuştur. Arap kuşağı doğası gereği doğaldır ve koyun ve sığır yerine develerin üzerinde durma konusunda uzmanlaştıkları için en vahşi olanıdır, bu yüzden çöle dalmışlardır. Bedeviler, ruhları orijinal doğaları gereği içlerinde işleneni kabul etmeye hazır oldukları için kent sakinlerinden daha iyiliğe daha yakındırlar. Kentsel sakinler, sığınmanın getirdiği birçok acı nedeniyle yaratılışın suçlusuyla renklendirmişlerdir ve cesarete daha yakındırlar çünkü şehir sakinleri işlerini valilerini, garnizonlarını ve surları savunmaya emanet etmişlerdir; böylece kadın ve çocuk statüsüne düşmüşlerdir {atıf:mukaddima-ibn-khaldun s. 114-122}. Ve Arapların basit olanı ancak doğaları gereği vahşet ve yaramazlık insanları oldukları için yenerler; ancak kendilerini ve sorunlarından kaçınan kabileleri savunurlarsa kumar oynarlar. Hızla yok edilen toprakları fethederlerse, egemenliği ancak peygamberlik, koruyuculuk veya büyük dini etki gibi dini bir boyutla elde ederler, çünkü birbirlerine itaat etmeleri en zor uluslardır. Aralarında bir peygamber veya aziz varsa, kendilerinden alıkonulurlar ve kibir ile rekabet doğası ortadan kalkar, bu da teslimiyetlerini, toplanmalarını ve egemenlik ile egemenlik kazanmalarını kolaylaştırır. Karakterlerinin sağlam doğası nedeniyle gerçeği en hızlı kabul edenlerdir. {atıf:Muqaddima-ibn-khaldun, s. 146-150}"
  id: "Ibn Khaldun menetapkan bahwa generasi Badui dan penduduk kota adalah alami dan diperlukan karena perbedaan mata pencaharian mereka, dan bahwa gurun adalah asal mula pembangunan perkotaan dan kota-kota diperluas karena yang perlu mendahului yang membutuhkan dan yang sempurna. Generasi Arab secara alami bersifat alami dan paling liar karena keahlian mereka berdiri di atas unta daripada domba dan sapi, sehingga mereka terjun ke padang liar. Badui lebih dekat dengan kebaikan daripada penghuni kota karena jiwa mereka, dengan sifat aslinya, siap menerima apa yang tertanam dalam diri mereka. Penduduk perkotaan telah mewarnai diri mereka dengan kesalahan ciptaan karena banyak penderitaan mereka dari perlindungan, dan mereka lebih dekat dengan keberanian karena penduduk perkotaan mempercayakan urusan mereka untuk melindungi gubernur, garnisun, dan tembok, sehingga menurun ke status perempuan dan anak-anak {sitasi: Muqaddima-ibn-Khaldun hlm. 114-122}. Dan bahwa orang Arab hanya mengatasi yang sederhana karena secara alami mereka adalah orang yang kejam dan nakal; mereka hanya berjudi jika mereka membela diri dan suku-suku yang menahan diri dari masalah mereka untuk menghindari kejahatan mereka. Jika mereka menaklukkan tanah yang cepat hancur, mereka tidak memperoleh kedaulatan kecuali melalui aspek keagamaan seperti kenabian, perwalian, atau pengaruh agama yang besar, karena mereka adalah bangsa yang paling sulit untuk saling taat. Jika mereka memiliki nabi atau wali di antara mereka, mereka dibatasi dari diri sendiri, dan sifat kesombongan dan persaingan menghilang, membuat penyerahan mereka lebih mudah, pengumpulan, dan mencapai dominasi serta kedaulatan. Mereka adalah yang paling cepat menerima kebenaran karena sifat watak mereka yang sehat. {cite:muqaddima-ibn-khaldun, hlm. 146-150}"
