label: { ar: "مخاطر الأدوية القوية والأبدان اليابسة عند ابن سينا", en: "The dangers of strong drugs and dry bodies in the Canon", ur: "قوی دواؤں کے خطرات اور خشک جسم قانون میں" }
summary:
  ar: "يحذر ابن سينا من الأدوية القوية كالخربق فإنها تشنج البدن النقي وتحرك رطوبة الممتلئ تحريكاً خانقاً وتجلب إلى الأحشاء ما يعسر دفعه، ويأمر بترطيب البدن اليابس بالأغذية الدسمة قبلها، ويذكر ضرر اليتوعات السمية وتدارك أثرها بسويق الشعير {cite:canon-ibn-sina-print-v1 p.281}."
  en: "Ibn Sina warns of strong drugs such as hellebore, which convulse a clean body, stir the moisture of a full one so that it chokes, and draw to the viscera what is hard to expel, tells that a dry, hard-fleshed body be moistened beforehand with fatty foods, and mentions the harm of poisonous spurges and barley meal as a remedy {cite:canon-ibn-sina-print-v1 p.281}."
