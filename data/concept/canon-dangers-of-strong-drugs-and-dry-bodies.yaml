id: concept/canon-dangers-of-strong-drugs-and-dry-bodies
class: concept
kind: scientific
label:
  ar: "مخاطر الأدوية القوية والأبدان اليابسة عند ابن سينا"
  en: "The dangers of strong drugs and dry bodies in the Canon"
  fr: "Dangers des remèdes puissants et des corps secs dans le Canon"
  ur: "قوی دواؤں کے خطرات اور خشک جسم قانون میں"
  es: "Los peligros de las drogas fuertes y la deshidratación en el Canon"
summary:
  ar: "يحذر ابن سينا من الأدوية القوية كالخربق فإنها تشنج البدن النقي وتحرك رطوبة الممتلئ تحريكاً خانقاً وتجلب إلى الأحشاء ما يعسر دفعه، ويأمر بترطيب البدن اليابس بالأغذية الدسمة قبلها، ويذكر ضرر اليتوعات السمية وتدارك أثرها بسويق الشعير {cite:canon-ibn-sina-print-v1 p.281}."
  en: "Ibn Sina warns of strong drugs such as hellebore, which convulse a clean body, stir the moisture of a full one so that it chokes, and draw to the viscera what is hard to expel, tells that a dry, hard-fleshed body be moistened beforehand with fatty foods, and mentions the harm of poisonous spurges and barley meal as a remedy {cite:canon-ibn-sina-print-v1 p.281}."
  fr: "Ibn Sina avertit des remèdes forts comme l’hellébore : convulsions du corps nettoyé, agitation suffocante de l’humidité d’un corps plein, attraction viscérale difficile à évacuer. Il décrit humidification alimentaire grasse du corps sec à chair dure, méfaits des euphorbes toxiques et farine d’orge comme remède {cite:canon-ibn-sina-print-v1 p.281}."
  es: "Ibn Sina advierte sobre drogas fuertes como el eléboro, que convulsionan un cuerpo limpio, revuelven la humedad de uno lleno hasta el punto de asfixiarlo y atraen a las vísceras lo que es difícil de expulsar; dice que un cuerpo seco y de carne dura debe humedecerse previamente con alimentos grasos y menciona el daño de las euforbias venenosas y la harina de cebada como remedio {cite:canon-ibn-sina-print-v1 p.281}."
