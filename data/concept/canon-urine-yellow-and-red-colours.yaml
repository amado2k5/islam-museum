label: { ar: "طبقات الصفرة والحمرة في البول عند ابن سينا", en: "The yellow and red shades of urine in the Canon", ur: "پیشاب میں زردی اور سرخی کے درجے قانون میں", es: "Los tonos amarillos y rojos de la orina en el Canon", fr: "Les nuances jaunes et rouges de l'urine dans le Canon", tr: "İbn Sina'ya göre idrarda sarı ve kırmızı katmanlar", id: "Lapisan kuning dan merah dalam urin menurut Ibn Sina" }
summary:
  ar: "يفتتح ابن سينا الفصل الثاني في ألوان البول بسلم الصفرة من التبني إلى الزعفراني، وسلم الحمرة، ويبين أن ما بعد الأترجي يدل على الحرارة، وأن الحمرة تدل على غلبة الدم، وكلما مالت إلى الزعفرانية فالغالب المرة {cite:canon-ibn-sina-print-v1 pp.184-185}."
  en: "Ibn Sina opens the second chapter on the colours of urine with the scale of yellows from straw to saffron and the scale of reds, saying that what lies beyond the citron shade shows heat and that reds show a predominance of blood, or of bile where they lean toward saffron {cite:canon-ibn-sina-print-v1 pp.184-185}."
  es: "Ibn Sina abre el segundo capítulo sobre los colores de la orina con la escala de amarillos desde la pajiza hasta el azafrán y la escala de rojos, diciendo que lo que está más allá del tono limón muestra calor y que los rojos muestran un predominio de sangre, o de bilis cuando se inclinan hacia el azafrán {cite:canon-ibn-sina-print-v1 pp.184-185}."
  fr: "Ibn Sina ouvre le deuxième chapitre sur les couleurs de l'urine avec l'échelle des jaunes allant de la paille au safran et l'échelle des rouges, disant que ce qui se trouve au-delà de la teinte citron montre la chaleur et que les rouges montrent une prédominance du sang, ou de la bile lorsqu'ils penchent vers le safran {cite:canon-ibn-sina-print-v1 pp.184-185}."
  ur: "ابن سینا نے پیشاب کے رنگوں پر دوسرے باب کا آغاز بھوسے سے زعفران تک پیلے رنگ کے پیمانے اور سرخ رنگ کے پیمانے کے ساتھ کیا ہے اور کہا ہے کہ لیموں کے سایہ سے باہر جو چیز ہوتی ہے وہ گرمی کو ظاہر کرتی ہے اور یہ کہ سرخ رنگ خون یا پت کی اہمیت کو ظاہر کرتا ہے جہاں وہ زعفران کی طرف جھکاؤ رکھتے ہیں۔ صفحہ 184-185}۔"
  tr: "İbn Sina, idrar renkleriyle ilgili ikinci bölümü safrandan safrana kadar sarı pulla açar ve safrandan sonraki ikinci bölümün ısıyı, kızarıklığın ise kanın baskınlığını gösterdiğini açıklar. Ne kadar çok safran yönüne meyilliyse, o kadar acı {cite:canon-ibn-sina-print-v1 s.184-185}."
  id: "Ibn Sina membuka bab kedua tentang warna urin dengan sisik kuning dari saffron ke saffron, dan memperjelas bahwa detik setelah saffron menunjukkan panas, dan kemerahan menunjukkan dominasi darah. Semakin condong ke arah saffron, semakin pahit {cite:canon-ibn-sina-print-v1 hlm.184-185}."
