summary:
  ar: "يفتتح ابن سينا الفصل الثاني في ألوان البول بسلم الصفرة من التبني إلى الزعفراني، وسلم الحمرة، ويبين أن ما بعد الأترجي يدل على الحرارة، وأن الحمرة تدل على غلبة الدم، وكلما مالت إلى الزعفرانية فالغالب المرة {cite:canon-ibn-sina-print-v1 pp.184-185}."
  en: "Ibn Sina opens the second chapter on the colours of urine with the scale of yellows from straw to saffron and the scale of reds, saying that what lies beyond the citron shade shows heat and that reds show a predominance of blood, or of bile where they lean toward saffron {cite:canon-ibn-sina-print-v1 pp.184-185}."
