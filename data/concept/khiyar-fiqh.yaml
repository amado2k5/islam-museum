id: concept/khiyar-fiqh
class: concept
kind: legal
label:
  ar: الخيار
  en: Khiyar (the right to annul or confirm a contract)
  ur: خیار
summary:
  ar: 'الخيار لغة الاصطفاء والانتقاء، وخيّره بين شيئين فوض إليه الاختيار؛ واصطلاحا حق العاقد في فسخ العقد أو إمضائه لمسوغ شرعي أو باتفاق عقدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} يفترق عن عدم اللزوم (إمكان الرجوع عن العقد بالإرادة المنفردة، وهو صفة طبيعية في بعض العقود، والتخيير قيد طارئ على عقد أصله اللزوم)، وعن الفسخ للفساد (وأثره لا يستند إلى الماضي عند الكاساني في الأنواع المختلفة). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} الفسخ بالخيار له انعطاف وتأثير رجعي كأن العقد لم ينعقد، بخلاف الفسخ في العقود غير اللازمة فلا يمس ما سبق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} الخيار يفترق عن الفساد (الذي يثبت فيه الفسخ بعد القبض، لا يسقط بالإسقاط الصريح كما يسقط الخيار غير الرؤية)، وعن التوقف (الموقوف ينشأ لنقص أهلية أو تعلق حق الغير؛ والخيار ينشأ بعد انعقاد العقد وصلوحه للنفاذ). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7889} الخيار يفترق عن الإقالة: من له الخيار يفسخ بإرادته دون رضا الآخر، والإقالة تقتضي التقاء الإرادتين؛ وتقسيمات الخيار: حكمي (يثبت بحكم الشرع كخيار العيب) وإرادي (ينشأ من إرادة العاقد كخيار الشرط والنقد والتعيين)، وبحسب الغاية: خيار التروي (يجلب المصلحة) وخيار النقيصة (يدفع الضرر)؛ وعند الدردير أيضا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7890}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} من أقسام الخيار عند جمهور المالكية: خيارات التروي (المجلس والرجوع والقبول والشرط)، وخيارات النقيصة (العيب والاستحقاق وتفرق الصفقة والهلاك الجزئي)، وخيارات الجهالة (الرؤية والكمية وكشف الحال والتعيين)، وخيارات التغرير (التدليس والنجش وتلقي الركبان)، وخيارات الغبن (المسترسل وغبن القاصر)، وخيارات الأمانة (المرابحة والتولية والتشريك والمواضعة)، وخيارات الخلف، واختلال التنفيذ (التأخير)، وامتناع التسليم (النقد وتعذر التسليم وتسارع الفساد والتفليس). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} حكمة تشريع الخيار: في الحكمية تلافي النقص بعد تخلف شرط لزوم العقد، ودفع الضرر، وتمحيص التراضي؛ وفي الإرادية الترفيه والتروي بالمشورة أو الاختبار، وتعدد الغرض ممكن؛ وعند المالكية يجبر البائع على التسليم إذا كان الغرض الاختبار وشرط القبض؛ ومدة الخيار بقدر الحاجة إليه عند المالكية، والشافعي وأبو حنيفة لا يجيزونه فوق ثلاثة أيام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893} الخيار سالب للزوم: عقد الخيار مخالف في الصفة للعقود غير اللازمة كالعارية، وخيار الشرط يمنع ابتداء الحكم، وخيار الرؤية يمنع تمامه، وخيار العيب يمنع لزومه؛ وخيار الرؤية والشرط عند الحنفية يثبت فيهما الفسخ على الكل، والعيب يفرق فيه بين القبض وعدمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894} خيار الاختلاف في المقدار والاستحقاق والتأخير وتسارع الفساد: إحالات إلى بيع أو استحقاق أو خيار الشرط أو النقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}'
  en: 'Khiyar is lexically choosing and selecting; to give someone the choice between two things is to leave the choice to him; technically it is a party\''s right to annul or confirm a contract for a legal cause or by a stipulated term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} It differs from non-binding nature (the power to withdraw by one\''s own will, a natural feature of some contracts, while option is an added qualifier to a contract that is binding by origin), and from annulment for invalidity, whose effect does not reach back in some kinds according to al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} Annulment by option has retroactive effect as if the contract were never concluded, unlike annulment in non-binding contracts which does not touch what came before. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} Option is distinct from invalidity, which is annulled after delivery and is not dropped by a plain waiver as option (except the option of sight) is; and from suspension, which arises from defect of capacity or the rights of another, while option arises after conclusion and fitness for effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7889} Option is distinct from rescission (iqala), which needs both wills; options are legal (arising by the law, as for defect) or voluntary (from the parties\'' will, as the option of stipulation, of price payment or of choice); by aim they are for deliberation (benefit) or for deficiency (avoidance of harm), as al-Ghazali and al-Dardir teach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7890}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} Maliki classes: options of deliberation (session, return, acceptance, stipulation); of deficiency (defect, eviction, division of the deal, partial loss); of ignorance (sight, quantity, disclosure of the matter, specification); of deception (fraud, bidding up, meeting caravans); of unfair price (the uninformed seller, the minor); of trust (sale at cost-plus, transfer, partnership, stock); of breach (delay); and of impossibility of delivery (payment, failure to deliver, quick corruption, bankruptcy). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} The wisdom of option: in legal options, to make good the shortfall when a condition of binding fails, to avert harm and to purify consent; in voluntary ones, deliberation by counsel or testing; the aim may be both; the Malikis force the seller to hand over the goods where the purpose is testing and receipt is stipulated; the term is set by need, while al-Shafii and Abu Hanifa allow no option beyond three days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893} Option removes binding: the option contract differs from non-binding ones such as loan; the option of stipulation prevents the effect from starting, that of sight prevents completion, that of defect prevents binding; the Hanafis hold rescission by sight and stipulation effective for all, while for defect they separate before and after receipt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894} Options on quantity, on the eviction of a thing, on delay, on quick corruption and on bankruptcy are referred to sale, eviction, stipulation or payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}'
  ur: 'خیار لغت میں چننا اور منتخب کرنا ہے، دو چیزوں کے درمیان اختیار سپرد کرنا؛ اصطلاح میں عاقد کا عقد کو فسخ یا برقرار رکھنے کا حق کسی شرعی سبب یا معاہدے کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} یہ عدم لزوم (کسی عقد کو اپنی مرضی سے واپس لینے کی صلاحیت، جو بعض عقود کی طبیعت ہے) سے مختلف ہے، اور فسخ بسبب فساد سے بھی؛ خیار کا فسخ ماضی کو لوٹاتا ہے گویا عقد ہوا ہی نہ تھا، جبکہ غیر لازم عقود کا فسخ ماضی پر اثر نہیں کرتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} ابتدائی حصہ، خیار کی اقسام آگے کے صفحات میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} خیار، فاسد عقد سے مختلف ہے کیونکہ فاسد عقد قبض کے بعد فسخ ہوتا ہے اور خیار (سوائے خیار رؤیت) صریح ساقط کرنے سے ساقط ہوتا ہے؛ اور توقف سے بھی جو اہلیت کی کمی یا دوسرے کے حق سے پیدا ہوتا ہے، جبکہ خیار عقد کے بعد نافذ ہونے کی صلاحیت پر پیدا ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7889} اقالہ سے مختلف: خیار والا اپنی مرضی سے فسخ کرتا ہے، اقالہ میں دونوں کی رضا لازم؛ خیار حکمی (شرع سے، جیسے عیب) اور ارادی (عاقد کی مرضی سے، جیسے شرط، نقد، تعیین)؛ مقاصد کے لحاظ سے تروّی (نفع) اور نقیصہ (ضرر دفع)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7890}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} مالکیہ کے نزدیک خیارات کی تقسیم: تروّی (مجلس، رجوع، قبول، شرط)، نقیصہ (عیب، استحقاق، تفریقِ صفقہ، جزوی ہلاکت)، جہالت (رؤیت، کمیت، کشفِ حال، تعیین)، تغریر (تدلیس، نجش، تلقیِ رکبان)، غبن (مسترسل، کم سن کا غبن)، امانت (مرابحہ، تولیہ، تشریک، مواضعہ)، خلف، اختلالِ تنفیذ (تاخیر)، امتناعِ تسلیم (نقد، تعذرِ تسلیم، تسارعِ فساد، تفلیس)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} خیار کی حکمت: حکمی میں شرطِ لزوم کے فوت ہونے پر کمی کی تلافی، ضرر کا دفع اور رضا کی تطہیر؛ ارادی میں مشورہ یا آزمائش سے سوچنے کا موقع؛ مالکیہ کے نزدیک آزمائش کا مقصد ہو تو بائع سامان دینے پر مجبور؛ مدت ضرورت کے مطابق؛ شافعیہ اور ابو حنیفہ تین دن سے زیادہ خیار جائز نہیں کہتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893} خیار لزوم کو سلب کرتا ہے: یہ عقد عاریت جیسے غیر لازم عقود سے صفت میں مختلف؛ خیارِ شرط ابتدائی حکم سے روکتا ہے، خیارِ رؤیت تکمیلِ حکم سے، خیارِ عیب لزوم سے؛ حنفیہ کے نزدیک رؤیت اور شرط میں فسخ سب کے حق میں، عیب میں قبض سے پہلے و بعد کا فرق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894} مقدار کا اختلاف، استحقاق، تاخیر اور تسارعِ فساد کے خیارات بیع، استحقاق، خیارِ شرط یا نقد کی طرف حوالہ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}'
