id: concept/khiyar-fiqh
class: concept
kind: legal
label:
  ar: الخيار
  en: Khiyar (the right to annul or confirm a contract)
  ur: خیار
summary:
  ar: الخيار لغة الاصطفاء والانتقاء، وخيّره بين شيئين فوض إليه الاختيار؛ واصطلاحا حق العاقد في فسخ العقد أو إمضائه لمسوغ شرعي أو باتفاق عقدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} يفترق عن عدم اللزوم (إمكان الرجوع عن العقد بالإرادة المنفردة، وهو صفة طبيعية في بعض العقود، والتخيير قيد طارئ على عقد أصله اللزوم)، وعن الفسخ للفساد (وأثره لا يستند إلى الماضي عند الكاساني في الأنواع المختلفة). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} الفسخ بالخيار له انعطاف وتأثير رجعي كأن العقد لم ينعقد، بخلاف الفسخ في العقود غير اللازمة فلا يمس ما سبق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888}
  en: Khiyar is lexically choosing and selecting; to give someone the choice between two things is to leave the choice to him; technically it is a party\'s right to annul or confirm a contract for a legal cause or by a stipulated term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} It differs from non-binding nature (the power to withdraw by one\'s own will, a natural feature of some contracts, while option is an added qualifier to a contract that is binding by origin), and from annulment for invalidity, whose effect does not reach back in some kinds according to al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} Annulment by option has retroactive effect as if the contract were never concluded, unlike annulment in non-binding contracts which does not touch what came before. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888}
  ur: خیار لغت میں چننا اور منتخب کرنا ہے، دو چیزوں کے درمیان اختیار سپرد کرنا؛ اصطلاح میں عاقد کا عقد کو فسخ یا برقرار رکھنے کا حق کسی شرعی سبب یا معاہدے کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} یہ عدم لزوم (کسی عقد کو اپنی مرضی سے واپس لینے کی صلاحیت، جو بعض عقود کی طبیعت ہے) سے مختلف ہے، اور فسخ بسبب فساد سے بھی؛ خیار کا فسخ ماضی کو لوٹاتا ہے گویا عقد ہوا ہی نہ تھا، جبکہ غیر لازم عقود کا فسخ ماضی پر اثر نہیں کرتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} ابتدائی حصہ، خیار کی اقسام آگے کے صفحات میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888}
