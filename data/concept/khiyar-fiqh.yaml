id: concept/khiyar-fiqh
class: concept
kind: legal
label:
  ar: الخيار
  en: Khiyar (the right to annul or confirm a contract)
  ur: خیار
  es: "Khiyar (el derecho a anular o confirmar un contrato)"
  fr: "Khiyar (le droit d'annuler ou de confirmer un contrat)"
  tr: "Seçenek"
  id: "Opsi"
summary:
  ar: 'الخيار لغة الاصطفاء والانتقاء، وخيّره بين شيئين فوض إليه الاختيار؛ واصطلاحا حق العاقد في فسخ العقد أو إمضائه لمسوغ شرعي أو باتفاق عقدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} يفترق عن عدم اللزوم ⁦(إمكان الرجوع عن العقد بالإرادة المنفردة، وهو صفة طبيعية في بعض العقود، والتخيير قيد طارئ على عقد أصله اللزوم)⁩، وعن الفسخ للفساد ⁦(وأثره لا يستند إلى الماضي عند الكاساني في الأنواع المختلفة)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} الفسخ بالخيار له انعطاف وتأثير رجعي كأن العقد لم ينعقد، بخلاف الفسخ في العقود غير اللازمة فلا يمس ما سبق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} الخيار يفترق عن الفساد ⁦(الذي يثبت فيه الفسخ بعد القبض، لا يسقط بالإسقاط الصريح كما يسقط الخيار غير الرؤية)⁩، وعن التوقف ⁦(الموقوف ينشأ لنقص أهلية أو تعلق حق الغير؛ والخيار ينشأ بعد انعقاد العقد وصلوحه للنفاذ)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7889} الخيار يفترق عن الإقالة: من له الخيار يفسخ بإرادته دون رضا الآخر، والإقالة تقتضي التقاء الإرادتين؛ وتقسيمات الخيار: حكمي ⁦(يثبت بحكم الشرع كخيار العيب)⁩ وإرادي ⁦(ينشأ من إرادة العاقد كخيار الشرط والنقد والتعيين)⁩، وبحسب الغاية: خيار التروي ⁦(يجلب المصلحة)⁩ وخيار النقيصة ⁦(يدفع الضرر)⁩؛ وعند الدردير أيضا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7890}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} من أقسام الخيار عند جمهور المالكية: خيارات التروي ⁦(المجلس والرجوع والقبول والشرط)⁩، وخيارات النقيصة ⁦(العيب والاستحقاق وتفرق الصفقة والهلاك الجزئي)⁩، وخيارات الجهالة ⁦(الرؤية والكمية وكشف الحال والتعيين)⁩، وخيارات التغرير ⁦(التدليس والنجش وتلقي الركبان)⁩، وخيارات الغبن ⁦(المسترسل وغبن القاصر)⁩، وخيارات الأمانة ⁦(المرابحة والتولية والتشريك والمواضعة)⁩، وخيارات الخلف، واختلال التنفيذ ⁦(التأخير)⁩، وامتناع التسليم ⁦(النقد وتعذر التسليم وتسارع الفساد والتفليس)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} حكمة تشريع الخيار: في الحكمية تلافي النقص بعد تخلف شرط لزوم العقد، ودفع الضرر، وتمحيص التراضي؛ وفي الإرادية الترفيه والتروي بالمشورة أو الاختبار، وتعدد الغرض ممكن؛ وعند المالكية يجبر البائع على التسليم إذا كان الغرض الاختبار وشرط القبض؛ ومدة الخيار بقدر الحاجة إليه عند المالكية، والشافعي وأبو حنيفة لا يجيزونه فوق ثلاثة أيام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893} الخيار سالب للزوم: عقد الخيار مخالف في الصفة للعقود غير اللازمة كالعارية، وخيار الشرط يمنع ابتداء الحكم، وخيار الرؤية يمنع تمامه، وخيار العيب يمنع لزومه؛ وخيار الرؤية والشرط عند الحنفية يثبت فيهما الفسخ على الكل، والعيب يفرق فيه بين القبض وعدمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894} خيار الاختلاف في المقدار والاستحقاق والتأخير وتسارع الفساد: إحالات إلى بيع أو استحقاق أو خيار الشرط أو النقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}'
  en: 'Khiyar is lexically choosing and selecting; to give someone the choice between two things is to leave the choice to him; technically it is a party\''s right to annul or confirm a contract for a legal cause or by a stipulated term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} It differs from non-binding nature (the power to withdraw by one\''s own will, a natural feature of some contracts, while option is an added qualifier to a contract that is binding by origin), and from annulment for invalidity, whose effect does not reach back in some kinds according to al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} Annulment by option has retroactive effect as if the contract were never concluded, unlike annulment in non-binding contracts which does not touch what came before. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} Option is distinct from invalidity, which is annulled after delivery and is not dropped by a plain waiver as option (except the option of sight) is; and from suspension, which arises from defect of capacity or the rights of another, while option arises after conclusion and fitness for effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7889} Option is distinct from rescission (iqala), which needs both wills; options are legal (arising by the law, as for defect) or voluntary (from the parties\'' will, as the option of stipulation, of price payment or of choice); by aim they are for deliberation (benefit) or for deficiency (avoidance of harm), as al-Ghazali and al-Dardir teach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7890}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} Maliki classes: options of deliberation (session, return, acceptance, stipulation); of deficiency (defect, eviction, division of the deal, partial loss); of ignorance (sight, quantity, disclosure of the matter, specification); of deception (fraud, bidding up, meeting caravans); of unfair price (the uninformed seller, the minor); of trust (sale at cost-plus, transfer, partnership, stock); of breach (delay); and of impossibility of delivery (payment, failure to deliver, quick corruption, bankruptcy). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} The wisdom of option: in legal options, to make good the shortfall when a condition of binding fails, to avert harm and to purify consent; in voluntary ones, deliberation by counsel or testing; the aim may be both; the Malikis force the seller to hand over the goods where the purpose is testing and receipt is stipulated; the term is set by need, while al-Shafii and Abu Hanifa allow no option beyond three days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893} Option removes binding: the option contract differs from non-binding ones such as loan; the option of stipulation prevents the effect from starting, that of sight prevents completion, that of defect prevents binding; the Hanafis hold rescission by sight and stipulation effective for all, while for defect they separate before and after receipt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894} Options on quantity, on the eviction of a thing, on delay, on quick corruption and on bankruptcy are referred to sale, eviction, stipulation or payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}'
  ur: 'خیار لغت میں چننا اور منتخب کرنا ہے، دو چیزوں کے درمیان اختیار سپرد کرنا؛ اصطلاح میں عاقد کا عقد کو فسخ یا برقرار رکھنے کا حق کسی شرعی سبب یا معاہدے کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} یہ عدم لزوم ⁦(کسی عقد کو اپنی مرضی سے واپس لینے کی صلاحیت، جو بعض عقود کی طبیعت ہے)⁩ سے مختلف ہے، اور فسخ بسبب فساد سے بھی؛ خیار کا فسخ ماضی کو لوٹاتا ہے گویا عقد ہوا ہی نہ تھا، جبکہ غیر لازم عقود کا فسخ ماضی پر اثر نہیں کرتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} ابتدائی حصہ، خیار کی اقسام آگے کے صفحات میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} خیار، فاسد عقد سے مختلف ہے کیونکہ فاسد عقد قبض کے بعد فسخ ہوتا ہے اور خیار ⁦(سوائے خیار رؤیت)⁩ صریح ساقط کرنے سے ساقط ہوتا ہے؛ اور توقف سے بھی جو اہلیت کی کمی یا دوسرے کے حق سے پیدا ہوتا ہے، جبکہ خیار عقد کے بعد نافذ ہونے کی صلاحیت پر پیدا ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7889} اقالہ سے مختلف: خیار والا اپنی مرضی سے فسخ کرتا ہے، اقالہ میں دونوں کی رضا لازم؛ خیار حکمی ⁦(شرع سے، جیسے عیب)⁩ اور ارادی ⁦(عاقد کی مرضی سے، جیسے شرط، نقد، تعیین)⁩؛ مقاصد کے لحاظ سے تروّی ⁦(نفع)⁩ اور نقیصہ ⁦(ضرر دفع)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7890}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} مالکیہ کے نزدیک خیارات کی تقسیم: تروّی ⁦(مجلس، رجوع، قبول، شرط)⁩، نقیصہ ⁦(عیب، استحقاق، تفریقِ صفقہ، جزوی ہلاکت)⁩، جہالت ⁦(رؤیت، کمیت، کشفِ حال، تعیین)⁩، تغریر ⁦(تدلیس، نجش، تلقیِ رکبان)⁩، غبن ⁦(مسترسل، کم سن کا غبن)⁩، امانت ⁦(مرابحہ، تولیہ، تشریک، مواضعہ)⁩، خلف، اختلالِ تنفیذ ⁦(تاخیر)⁩، امتناعِ تسلیم ⁦(نقد، تعذرِ تسلیم، تسارعِ فساد، تفلیس)⁩۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} خیار کی حکمت: حکمی میں شرطِ لزوم کے فوت ہونے پر کمی کی تلافی، ضرر کا دفع اور رضا کی تطہیر؛ ارادی میں مشورہ یا آزمائش سے سوچنے کا موقع؛ مالکیہ کے نزدیک آزمائش کا مقصد ہو تو بائع سامان دینے پر مجبور؛ مدت ضرورت کے مطابق؛ شافعیہ اور ابو حنیفہ تین دن سے زیادہ خیار جائز نہیں کہتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893} خیار لزوم کو سلب کرتا ہے: یہ عقد عاریت جیسے غیر لازم عقود سے صفت میں مختلف؛ خیارِ شرط ابتدائی حکم سے روکتا ہے، خیارِ رؤیت تکمیلِ حکم سے، خیارِ عیب لزوم سے؛ حنفیہ کے نزدیک رؤیت اور شرط میں فسخ سب کے حق میں، عیب میں قبض سے پہلے و بعد کا فرق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894} مقدار کا اختلاف، استحقاق، تاخیر اور تسارعِ فساد کے خیارات بیع، استحقاق، خیارِ شرط یا نقد کی طرف حوالہ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}'
  es: "Khiyar es léxicamente elegir y seleccionar; darle a alguien la opción entre dos cosas es dejarle la elección a él; técnicamente es el derecho de una parte a anular o confirmar un contrato por una causa legal o por un plazo estipulado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} Se diferencia de la naturaleza no vinculante (el poder de retirarse por voluntad propia, una característica natural de algunos contratos, mientras que la opción es un calificador añadido a un contrato que es vinculante por origen), y de la anulación por invalidez, cuyo efecto no se extiende retroactivamente en algunos tipos según al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} La anulación por opción tiene efecto retroactivo como si el contrato nunca se hubiera celebrado, a diferencia de la anulación en contratos no vinculantes que no afecta lo que fue anterior. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} La opción es distinta de la invalidez, que se anula después de la entrega y no se elimina por una simple renuncia como la opción (excepto la opción de la vista); y de la suspensión, que surge por defecto de capacidad o los derechos de otro, mientras que la opción surge después de la celebración y la idoneidad para el efecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7889} La opción es distinta de la rescisión (iqala), que requiere ambos testamentos; Las opciones son legales (que surgen de la ley, como por defecto) o voluntarias (de la voluntad de las partes, como la opción de estipulación, de pago de precio o de elección); por objetivo son para deliberación (beneficio) o para deficiencia (evitación de daño), como enseñan al-Ghazali y al-Dardir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7890}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} Clases malikíes: opciones de deliberación (sesión, devolución, aceptación, estipulación); de deficiencia (defecto, desalojo, división del trato, pérdida parcial); de ignorancia (vista, cantidad, divulgación del asunto, especificación); de engaño (fraude, puja ascendente, encuentro de caravanas); de precio injusto (el vendedor desinformado, el menor); de confianza (venta al costo más, transferencia, sociedad, acciones); de incumplimiento (retraso); y de imposibilidad de entrega (pago, falta de entrega, corrupción rápida, quiebra). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} La sabiduría de la opción: en las opciones legales, para subsanar la deficiencia cuando falla una condición vinculante, para evitar daños y para purificar el consentimiento; en las voluntarias, deliberación por parte de un abogado o prueba; el objetivo puede ser ambos; los malikíes obligan al vendedor a entregar los bienes cuando el propósito es la prueba y se estipula la recepción; el plazo se establece por necesidad, mientras que al-Shafii y Abu Hanifa no permiten ninguna opción más allá de tres días. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893} La opción elimina la vinculación: el contrato de opción difiere de los no vinculantes como el préstamo; La opción de estipulación impide que el efecto comience, la de la vista impide su consumación, la del defecto impide la vinculación; los Hanafi sostienen que la rescisión por vista y la estipulación son efectivas para todos, mientras que, en el caso del defecto, distinguen entre antes y después de la recepción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894} Las opciones sobre la cantidad, sobre el desalojo de una cosa, sobre la demora, sobre la corrupción inmediata y sobre la quiebra se denominan venta, desalojo, estipulación o pago. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}"
  fr: "Khiyar signifie choisir et sélectionner; laisser le choix à quelqu'un entre deux choses revient à lui laisser le choix. Techniquement, il s'agit du droit d'une partie d'annuler ou de confirmer un contrat pour un motif légal ou selon une clause stipulée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887} Cela diffère de la nature non contraignante (la possibilité de se rétracter volontairement, caractéristique naturelle de certains contrats, tandis que l'option est une modalité supplémentaire ajoutée à un contrat initialement contraignant) et de l'annulation pour nullité, dont l'effet n'est pas rétroactif dans certains cas, selon al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7887}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} L'annulation par option a un effet rétroactif, comme si le contrat n'avait jamais été conclu, contrairement à l'annulation des contrats non contraignants qui n'affecte pas les éléments antérieurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7888} L'option se distingue de la nullité, qui est annulée après la délivrance et ne disparaît pas par une simple renonciation, contrairement à l'option (à l'exception de l'option de vue); et de la suspension, qui résulte d'un défaut de capacité ou des droits d'autrui, tandis que l'option naît après la conclusion et la validation du contrat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7889} L'option se distingue de la rescision (iqala), qui requiert la volonté des deux parties; les options sont légales (nées de la loi, comme en cas de défaut) ou volontaires (issues de la volonté des parties, comme l'option de stipulation, de paiement ou de choix); selon leur finalité, elles visent la délibération (l'obtention d'un avantage) ou la réparation d'un manquement (l'évitement d'un préjudice), comme l'enseignent al-Ghazali et al-Dardir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7890}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} Classes malikites: options de délibération (session, retour, acceptation, stipulation); de déficience (défaut, expulsion, division de l’accord, perte partielle); d’ignorance (vue, quantité, divulgation de la question, spécification); de tromperie (fraude, surenchère, rencontre de caravanes); de prix inéquitable (le vendeur non informé, le mineur); de confiance (vente au prix coûtant majoré, transfert, partenariat, stock); de rupture (retard); et d’impossibilité de livraison (paiement, défaut de livraison, corruption rapide, faillite). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7891} La sagesse de l'option: dans les options légales, pour pallier le manquement lorsqu'une condition d'engagement n'est pas remplie, pour prévenir un préjudice et pour purifier le consentement; dans les options volontaires, pour permettre la délibération d'un avocat ou une mise à l'épreuve; le but peut être les deux; les Malikites obligent le vendeur à remettre les marchandises lorsque le but est la mise à l'épreuve et que la réception est stipulée; le délai est fixé par les besoins, tandis qu'al-Shafi'i et Abu Hanifa n'autorisent aucune option au-delà de trois jours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7892}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893} L'option supprime l'engagement: le contrat d'option diffère des contrats non contraignants tels que le prêt; l'option de stipulation empêche le début de l'effet, celle de la vue empêche l'achèvement, celle du vice empêche l'engagement; Les hanafites considèrent que la rescision par simple vue et la stipulation sont opposables à tous, tandis que pour les vices cachés, ils font une distinction entre avant et après réception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7893}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894} Les options relatives à la quantité, à l'éviction d'une chose, au retard, à la corruption rapide et à la faillite sont assimilées à la vente, à l'éviction, à la stipulation ou au paiement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}"
  tr: "Seçim, seçim ve seçim dilidir ve ona iki şey arasında seçim hakkı verilir; teknik olarak, yüklenicinin sözleşmeyi feshetme veya meşru bir nedenle ya da sözleşme anlaşması için imzalama hakkı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7887} Bu, bağlayıcı olmayan (bazı sözleşmelerde doğal bir özellik olan tek taraflı sözleşmenin iptal edilme olasılığı ve seçim, orijinal bağlayıcı nitelikte olan bir sözleşmeye ek bir kısıtlama) ve geçersizlik nedeniyle iptal (Al-Kasani'ye göre çeşitli türlerde geçmişe dayanmamaktadır) ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7888} Opsiyonla fesih, sözleşme yapılmamış gibi geriye dönük etkiye sahiptir; yukarıdaki durum etkilenmediği gereksiz sözleşmelerde iptal ise geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7888} Opsiyon, geçersizlikten (iptalin mülkiyetten sonra tespit edildiği, görüş dışı opsiyonun kaldırılması nedeniyle açıkça sona erdirilmediği) ve sona erdirilmesinden (askıya alınan durum, ehliyetsizlik veya başkasının hakkının askıya alınması nedeniyle ortaya çıkar; opsiyon sözleşme yapıldıktan sonra ortaya çıkar ve uygulanabilir hale gelir) ile ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7889} Opsiyon, seçenekten ayrılır: seçeneğe sahip olan kişi, diğerinin rızası olmadan kendi iradesiyle iptal edebilir. Redd, iki vasiyetin yakınlaşmasını gerektirir; opsiyon sınıflandırmaları: karar (Şeriatla kusur seçeneği olarak belirlenen) ve gönüllü (müteahhitin iradesinden doğar, örneğin koşul, eleştiri ve belirleme) ve amaca göre: tedbir seçeneği (fayda sağlayan) ve eksiklik seçeneği (zararı uzaklaştıran); ayrıca el-Dardir durumunda da geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7891} Maliki topluluğuna göre opsiyon kategorileri arasında: aldatma seçenekleri (konsey, iade, kabul, şart), eksiklik seçenekleri (kusur, hak kazanma, anlaşmanın dağıtılması ve kısmi kayıp), cehalet seçenekleri (görüş, miktar, durumun açıklanması ve atanma), aldatma seçenekleri (dolandırıcılık, ihmal ve yolculukların alınması), adaletsizlik seçenekleri (sürekli ve haksız yere reşit olmayanlara haksızlık), güven seçenekleri (murabaha, vesayet, ortaklık ve durum), halef seçenekleri, uygulama dengesizliği (gecikme) ve teslim reddi (eleştiri, teslimatın imkânsızlığı, yolsuzluğun hızlandırılması ve iflas). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7891} Bir seçeneği yasalaştırmanın akıllıcası: Bilgelikte, sözleşmenin bağlanma koşulundan sonra eksiklikten kaçınmak, zararı önlemek ve anlaşmayı dikkatle incelemek; gönüllü olarak, danışma veya test yoluyla eğlence ve tedbirli, ve çok sayıda amaç mümkündür; Malikilere göre, amaç test ve sahiplenme ise satıcı teslim etmek zorundadır; ve opsiyonun süresi yalnızca gerektiğinde geçerlidir; Malikiler, Şafi'i ve Abu Hanifa'ya göre satıcının lisansı üç günden fazla süremez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7893} Opsiyon zorunluluktan geçersizdir: opsiyon sözleşmesi, kredi gibi gereksiz sözleşmelerden karakter olarak farklıdır. Koşul opsiyonu kararın başlamasını engeller, görüş opsiyonu tamamlanmasını engeller ve kusur seçeneği yükümlülüğünü engeller; Hanefi okuluna göre görüş ve koşul seçenekleri her ikisi için de iptal sağlar ve kusur mülkiyet ile mülkiyet eksikliği arasındaki ayrımı yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7894} Miktar, hak, gecikme ve yolsuzluğun hızlandırılması farkı opsiyonu: satışa yönlendirme, vade, koşullu opsiyon veya nakit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7894}"
  id: "Pilihan adalah bahasa seleksi dan seleksi, dan ia diberi pilihan antara dua hal; secara teknis, hak kontraktor untuk mengakhiri kontrak atau menandatanganinya dengan alasan sah atau perjanjian kontraktual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7887} Ini dibedakan dari non-mengikat (kemungkinan penarikan kontrak secara sepihak, yang merupakan ciri alami dalam beberapa kontrak, dan pilihan adalah pembatasan tambahan pada kontrak yang sifat mengikat aslinya) dan pembatalan karena ketidakabsahan (dampaknya tidak didasarkan pada masa lalu menurut Al-Kasani dalam berbagai jenis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7888} Penghentian dengan opsi memiliki efek retroaktif seolah-olah kontrak tidak dibuat, berbeda dengan pembatalan dalam kontrak yang tidak perlu di mana hal di atas tidak terpengaruh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7888} Opsi berbeda dari pembatalan (di mana pembatalan ditetapkan setelah penguasaan, tidak secara eksplisit dihentikan karena opsi non-visi dilepaskan), dan dari penghentian (penangguhan terjadi karena kurangnya kapasitas atau penangguhan hak orang lain; opsi muncul setelah kontrak ditandatangani dan menjadi dapat dilaksanakan). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7889} Opsi berbeda dengan pemecatan: siapa pun yang memiliki opsi dapat membatalkan dengan kehendaknya sendiri tanpa persetujuan pihak lain. Penolakan membutuhkan konvergensi kedua kehendak tersebut; klasifikasi opsi adalah: memutuskan (ditetapkan oleh Syariah sebagai opsi cacat) dan sukarela (berasal dari kehendak kontraktor, seperti opsi kondisi, kritik, dan penunjukan), dan menurut tujuan: opsi kehati-hatian (yang membawa manfaat) dan pilihan kekurangan (yang menolak bahaya); dan juga dalam kasus al-Dardir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7891} Di antara kategori opsi menurut komunitas Maliki adalah: opsi penipuan (dewan, pengembalian, penerimaan, kondisi), opsi kekurangan (cacat, hak, pembatalan kesepakatan, dan kerugian sebagian), pilihan ketidaktahuan (visi, kuantitas, pengungkapan kondisi, dan penetapan), pilihan penipuan (penipuan, kelalaian, dan menerima tumpangan), pilihan ketidakadilan (pelanggaran berkelanjutan dan tidak adil terhadap anak di bawah umur), opsi kepercayaan (murabaha, perwalian, kemitraan, dan situasi), pilihan penerus, ketidakseimbangan pelaksanaan (penundaan), dan penolakan pelaksanaan (kritik, ketidakmungkinan pelaksanaan, percepatan korupsi, dan kebangkrutan). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7891} Kebijaksanaan di balik pembuatan opsi melalui undang-undang: Dalam kebijaksanaan, menghindari kekurangan setelah syarat mengikat kontrak, mencegah kerusakan, dan memeriksa perjanjian; dalam voluntaryah, hiburan dan kehati-hatian melalui konsultasi atau pengujian, serta berbagai tujuan adalah mungkin; menurut Maliki, penjual dipaksa untuk menyerahkan jika tujuannya adalah pengujian dan kepemilikan; dan durasi opsi hanya sesuai kebutuhan; menurut Maliki, Shafi'i, dan Abu Hanifa, lisensi penjual tidak diperbolehkan lebih dari tiga hari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7893} Opsi tersebut dibatalkan karena kebutuhan: kontrak opsi berbeda karakternya dari kontrak yang tidak perlu seperti pinjaman. Opsi syarat mencegah dimulainya putusan, opsi penglihatan mencegah penyelesaiannya, dan opsi cacat mencegah kewajibannya; opsi visi dan kondisi menurut aliran Hanafi menetapkan pembatalan untuk keduanya, dan cacat membedakan antara kepemilikan dan tidak kepemilikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7894} Opsi selisih jumlah, hak, penundaan, dan percepatan korupsi: rujukan ke penjualan, jatuh tempo, opsi bersyarat, atau tunai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7894}"
