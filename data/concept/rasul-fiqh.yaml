id: concept/rasul-fiqh
class: concept
kind: legal
label:
  ar: "الرسول"
  en: "Rasul (the messenger): the duty to convey, the penalty for insulting messengers, the prohibition on sacrifice in a messenger's name, and the Prophet's protected pastures"
  ur: "رسول"
  es: "Rasul (el mensajero): el deber de transmitir, el castigo por insultar a los mensajeros, la prohibición de realizar sacrificios en nombre de un mensajero y los pastos protegidos del Profeta."
  fr: "Rasul (le messager): le devoir de transmettre, la peine encourue pour avoir insulté un messager, l’interdiction de sacrifier au nom d’un messager et les pâturages protégés du Prophète."
summary:
  ar: "الرسول في اللغة من أرسله المرسل بأداء رسالة، وفي الاصطلاح معنيان: الشخص المرسل من إنسان إلى آخر بمال أو رسالة، والواحد من رسل الله، وهو ذكر حر أوحى الله إليه بشرع وأمره بتبليغه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} يجب على الرسول تبليغ الدعوة، ويجب على من بلغته دعوة الرسل الإيمان بهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} وأجمع أهل العلم على كفر من سب رسولا من الرسل أو استخف به، ويُقتل من سب النبي، وتفصيل التوبة في الردة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} ولا يجوز الذبح باسم رسول الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} وحمى النبي النقيع والربذة لخيل المسلمين وإبل الصدقة، واختلف الفقهاء في نقض ما حماه، فمنعه الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} وأهل الحرب إذا أرسلوا رسولا آمن حتى يؤدي رسالته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736}"
  en: "Rasul in the lexicon is one sent to carry a message; in technical use it has two senses: one sent from one person to another with money or a message, and one of the messengers of God, a free male to whom God revealed a law and whom He commanded to convey it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} The messenger must convey the call, and those who receive it must believe in and obey the messengers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} The scholars agree that whoever insults or mocks a messenger disbelieves, and the insulter of the Prophet is killed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} An animal may not be slaughtered in the name of the Messenger of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} The Prophet set aside pastures at al-Naqi' for the horses of the Muslims and at al-Rabadha for camels of charity, and the majority forbid later rulers to cancel what he protected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} Envoys of the enemy who come with a message are safe until they deliver it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736}"
  ur: "رسول وہ شخص ہے جسے پیغام پہنچانے کے لیے بھیجا جائے، اور شرعی اصطلاح میں اللہ کا رسول آزاد مرد ہے جس پر شریعت نازل ہوئی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} رسول کی توہین کفر ہے، اور نبی کی توہین کرنے والا قتل کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735}"
  es: "Rasul en el léxico es aquel enviado para llevar un mensaje; en uso técnico tiene dos sentidos: uno enviado de una persona a otra con dinero o un mensaje, y uno de los mensajeros de Dios, un varón libre a quien Dios reveló una ley y a quien le ordenó transmitirla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} El mensajero debe transmitir el llamado, y aquellos que lo reciben deben creer en los mensajeros y obedecerlos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} Los eruditos concuerdan en que quien insulta o se burla de un mensajero no cree, y el insultador del Profeta es ejecutado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} No se puede sacrificar un animal en nombre del Mensajero de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} El Profeta reservó pastos en al-Naqi' para los caballos de los musulmanes y en al-Rabadha para los camellos de caridad, y la mayoría prohibió a los gobernantes posteriores cancelar lo que él protegió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} Los enviados del enemigo que vienen con un mensaje están a salvo hasta que lo entregan. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736}"
  fr: "Dans le lexique, le terme « rasul » désigne celui qui est envoyé pour transmettre un message. Techniquement, il a deux sens: celui qui est envoyé d’une personne à une autre avec de l’argent ou un message, et l’un des messagers de Dieu, un homme libre à qui Dieu a révélé une loi et à qui Il a ordonné de la transmettre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} Le messager doit transmettre l’appel, et ceux qui le reçoivent doivent croire aux messagers et leur obéir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} Les savants s’accordent à dire que quiconque insulte ou se moque d’un messager mécroit, et celui qui insulte le Prophète est mis à mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} Il est interdit d'immoler un animal au nom du Messager de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} Le Prophète a réservé des pâturages à al-Naqi' pour les chevaux des musulmans et à al-Rabadha pour les chameaux donnés en aumône, et la majorité a interdit aux souverains ultérieurs d'abolir ce qu'il avait protégé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} Les envoyés de l'ennemi porteurs d'un message sont en sécurité jusqu'à ce qu'ils l'aient remis. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8736}"
