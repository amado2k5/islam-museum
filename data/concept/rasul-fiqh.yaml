label:
  ar: "الرسول"
  en: "Rasul (the messenger): the duty to convey, the penalty for insulting messengers, the prohibition on sacrifice in a messenger's name, and the Prophet's protected pastures"
  ur: "رسول"
summary:
  ar: "الرسول في اللغة من أرسله المرسل بأداء رسالة، وفي الاصطلاح معنيان: الشخص المرسل من إنسان إلى آخر بمال أو رسالة، والواحد من رسل الله، وهو ذكر حر أوحى الله إليه بشرع وأمره بتبليغه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} يجب على الرسول تبليغ الدعوة، ويجب على من بلغته دعوة الرسل الإيمان بهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} وأجمع أهل العلم على كفر من سب رسولا من الرسل أو استخف به، ويُقتل من سب النبي، وتفصيل التوبة في الردة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} ولا يجوز الذبح باسم رسول الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} وحمى النبي النقيع والربذة لخيل المسلمين وإبل الصدقة، واختلف الفقهاء في نقض ما حماه، فمنعه الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} وأهل الحرب إذا أرسلوا رسولا آمن حتى يؤدي رسالته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736}"
  en: "Rasul in the lexicon is one sent to carry a message; in technical use it has two senses: one sent from one person to another with money or a message, and one of the messengers of God, a free male to whom God revealed a law and whom He commanded to convey it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} The messenger must convey the call, and those who receive it must believe in and obey the messengers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} The scholars agree that whoever insults or mocks a messenger disbelieves, and the insulter of the Prophet is killed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} An animal may not be slaughtered in the name of the Messenger of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} The Prophet set aside pastures at al-Naqi' for the horses of the Muslims and at al-Rabadha for camels of charity, and the majority forbid later rulers to cancel what he protected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} Envoys of the enemy who come with a message are safe until they deliver it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736}"
  ur: "رسول وہ شخص ہے جسے پیغام پہنچانے کے لیے بھیجا جائے، اور شرعی اصطلاح میں اللہ کا رسول آزاد مرد ہے جس پر شریعت نازل ہوئی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} رسول کی توہین کفر ہے، اور نبی کی توہین کرنے والا قتل کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8735}"
