label:
  ar: "المقاومة والإرهاب — الخط الفاصل"
  en: "Resistance and terrorism — the dividing line"
issue:
  ar: "أين الخط الفاصل بين المقاومة المشروعة للمحتل والإرهاب، وهل تكفي الأساليب السلمية لتحرير الأرض؟"
summary:
  ar: "حلقة «الوسطية» عن المقاومة: هل تُختزل في العمل المسلح أم توجد أساليب أنفع — اللاعنف الغاندي والعمل السياسي والمقاطعة الاقتصادية والحرب الإعلامية والمواجهة الفكرية {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:30:30}. وبلّور المقدم الخط الفاصل: مقاومة المحتل حق لا يجادل فيه اثنان، وتوجيه السلاح للمدنيين — في نيويورك أو لندن أو مدريد — إرهاب، وهو قبل أن يكون سبباً للعنة الغرب سببُ غضبٍ من الله {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:30}."
  en: "The 'Al-Wasatiyya' episode on resistance: is it reducible to armed action or are there more effective ways — Gandhian non-violence, political work, economic boycott, media war and intellectual confrontation {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:30:30}. The host distilled the dividing line: resisting the occupier is a right no two dispute, while aiming weapons at civilians — in New York, London or Madrid — is terrorism, a cause of God's anger before it is a cause of the West's curse {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:30}."
