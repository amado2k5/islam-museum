label:
  ar: "المقاومة والإرهاب — الخط الفاصل"
  en: "Resistance and terrorism — the dividing line"
  fr: "Résistance et terrorisme : la ligne de partage"
  es: "Resistencia y terrorismo: la línea divisoria."
  ur: "مزاحمت اور دہشت گردی - تقسیم کی لکیر"
issue:
  ar: "أين الخط الفاصل بين المقاومة المشروعة للمحتل والإرهاب، وهل تكفي الأساليب السلمية لتحرير الأرض؟"
summary:
  ar: "حلقة «الوسطية» عن المقاومة: هل تُختزل في العمل المسلح أم توجد أساليب أنفع — اللاعنف الغاندي والعمل السياسي والمقاطعة الاقتصادية والحرب الإعلامية والمواجهة الفكرية {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:30:30}. وبلّور المقدم الخط الفاصل: مقاومة المحتل حق لا يجادل فيه اثنان، وتوجيه السلاح للمدنيين — في نيويورك أو لندن أو مدريد — إرهاب، وهو قبل أن يكون سبباً للعنة الغرب سببُ غضبٍ من الله {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:30}."
  en: "The 'Al-Wasatiyya' episode on resistance: is it reducible to armed action or are there more effective ways — Gandhian non-violence, political work, economic boycott, media war and intellectual confrontation {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:30:30}. The host distilled the dividing line: resisting the occupier is a right no two dispute, while aiming weapons at civilians — in New York, London or Madrid — is terrorism, a cause of God's anger before it is a cause of the West's curse {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:30}."
  fr: "L'épisode d'« Al-Wasatiyya » sur la résistance : se réduit-elle à l'action armée ou existe-t-il des voies plus efficaces, la non-violence gandhienne, l'action politique, le boycott économique, la guerre médiatique et la confrontation intellectuelle {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 00:30:30}. L'animateur a résumé la ligne de partage : résister à l'occupant est un droit que nul ne conteste, tandis que diriger les armes contre des civils, à New York, Londres ou Madrid, est du terrorisme, cause de la colère de Dieu avant d'être cause de la malédiction de l'Occident {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:30}."
  es: "El episodio de 'Al-Wasatiyya' sobre la resistencia: ¿se puede reducir a la acción armada o hay formas más efectivas: no violencia gandhiana, trabajo político, boicot económico, guerra mediática y confrontación intelectual? 00:30:30}. El presentador resumió la línea divisoria: resistir al ocupante es un derecho que nadie discute, mientras que apuntar armas a civiles —en Nueva York, Londres o Madrid— es terrorismo, causa de la ira de Dios antes que de la maldición de Occidente {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep17 01:16:30}."
  ur: "مزاحمت پر 'الوصطیہ' قسط: کیا یہ مسلح کارروائی کے لیے کم ہے یا اس کے زیادہ موثر طریقے ہیں — گاندھیائی عدم تشدد، سیاسی کام، معاشی بائیکاٹ، میڈیا وار اور فکری تصادم {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ایپ17 00:30:30}۔ میزبان نے تقسیم کی لکیر کو کشید کیا: قابض کے خلاف مزاحمت کرنا کوئی دو کا حق نہیں ہے، جبکہ نیو یارک، لندن یا میڈرڈ میں شہریوں پر ہتھیاروں کا نشانہ بنانا دہشت گردی ہے، خدا کے غضب کا سبب ہے، اس سے پہلے کہ یہ مغرب کی لعنت کا سبب بنے۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ep17 01:16:00} {حوالہ:اصابیل-طارق-السویدان الوسیطیہ/ep17 01:16:30}۔"
