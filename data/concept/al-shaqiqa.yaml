id: concept/al-shaqiqa
class: concept
kind: scientific
label:
  ar: "الشقيقة"
  en: "Migraine (al-shaqiqa)"
  fr: "Migraine (al-shaqiqa)"
  ur: "شقیقہ ⁦(آدھے سر کا درد)⁩"
  es: "Migraña (al-shaqiqa)"
  tr: "kız kardeş"
  id: "saudara perempuan"
summary:
  ar: "يعرّف ابن سينا الشقيقة بأنها وجع في أحد جانبي الرأس يهيج، ويذكر مواضعها وأن موادها تصل من الأوردة والشرايين الخارجة أو من الدماغ وحجبه، وأنها ذات أدوار وتكون في الأغلب عن الأخلاط الحارة أو الباردة أو عن الرياح والبخارات، ويذكر علاماتها {cite:canon-ibn-sina-print-v2 p.74}"
  en: "Ibn Sina defines migraine as a pain in one side of the head that flares, names where it lies and how its matters arrive from the outer veins and arteries or from the brain and its membranes, says it comes in fits and arises mostly from hot or cold humours or from winds and vapours, and gives its signs {cite:canon-ibn-sina-print-v2 p.74}"
  fr: "Ibn Sina définit la migraine comme une douleur qui se déclare d’un côté de la tête. Il en indique les sièges et explique comment les matières y parviennent depuis les veines et les artères externes ou depuis le cerveau et ses membranes. Il dit qu’elle survient par accès et provient surtout d’humeurs chaudes ou froides, ou de vents et de vapeurs, et en donne les signes {cite:canon-ibn-sina-print-v2 p.74}"
  ur: "ابن سینا شقیقہ کو سر کے ایک پہلو کا درد بتاتا ہے جو بھڑک اٹھتا ہے، اس کے مقام اور اس کی مادوں کے آنے کے راستے بتاتا ہے، کہتا ہے کہ یہ باری سے آتا ہے اور زیادہ تر گرم یا ٹھنڈے اخلاط یا ہواؤں اور بخارات سے ہوتا ہے، اور اس کی علامات گنواتا ہے {cite:canon-ibn-sina-print-v2 p.74}۔"
  es: "Ibn Sina define la migraña como un dolor en un lado de la cabeza que se intensifica, nombra dónde se localiza y cómo llegan sus sustancias desde las venas y arterias externas o desde el cerebro y sus membranas, dice que viene en ataques y surge principalmente de humores calientes o fríos o de vientos y vapores, y da sus síntomas {cite:canon-ibn-sina-print-v2 p.74}"
  tr: "İbn Sina, migreni başın bir tarafında ağrı olarak tanımlar; bu ağrı başı tahriş eder, yerlerini belirtir ve maddeleri damarlar ve atardamarlardan çıkan ya da beyin ve tıkanıklıktan gelir. Migreni rolleri vardır ve çoğunlukla sıcak veya soğuk humorlar ya da rüzgar ve buharlar tarafından oluşur. Belirtilerinden bahseder {cite:canon-ibn-sina-print-v2 s.74}"
  id: "Ibn Sina mendefinisikan migrain sebagai nyeri di satu sisi kepala; nyeri ini mengiritasi kepala, menandai lokasinya, dan zat-zat tersebut berasal dari pembuluh darah dan arteri atau dari otak dan penyumbatan. Migrain memiliki peran dan sebagian besar disebabkan oleh humor panas atau dingin atau angin dan uap. Ia membahas gejalanya {cite:canon-ibn-sina-print-v2 hlm.74}"
