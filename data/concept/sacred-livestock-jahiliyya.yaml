summary: { ar: "أنعام يعظّمها الجاهليون فلا يركبونها ولا يحرثونها ولا يشربون ألبانها إلا الضيف: البحيرة والسائبة والوصيلة والحامي — أنكرها القرآن.", en: "Animals the pagans consecrated — Bahira, Saʾiba, Wasila, Hami — neither ridden nor milked except for guests; the Qurʾan rebuked the custom.", es: "Los animales que los paganos consagraban — Bahira, Saʾiba, Wasila, Hami — no eran montados ni ordeñados excepto para los invitados; el Corán reprendió esta costumbre.", fr: "Les animaux que les païens consacraient — Bahira, Saʾiba, Wasila, Hami — n’étaient ni montés ni trait, sauf pour les invités; le Coran a réprimandé cette coutume." }
