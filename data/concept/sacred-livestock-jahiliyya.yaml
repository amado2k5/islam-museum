label: { ar: "البحيرة والسائبة والوصيلة والحامي", en: "Consecrated Livestock", es: "Ganado consagrado", fr: "Bétail consacré", ur: "مقدس لائیوسٹاک", tr: "Göl, kalınlık, bağlantı ve koruyucu", id: "Danau, kebesarannya, koneksi, dan pelindungnya" }
kind: social

summary: { ar: "أنعام يعظّمها الجاهليون فلا يركبونها ولا يحرثونها ولا يشربون ألبانها إلا الضيف: البحيرة والسائبة والوصيلة والحامي — أنكرها القرآن.", en: "Animals the pagans consecrated — Bahira, Saʾiba, Wasila, Hami — neither ridden nor milked except for guests; the Qurʾan rebuked the custom.", es: "Los animales que los paganos consagraban — Bahira, Saʾiba, Wasila, Hami — no eran montados ni ordeñados excepto para los invitados; el Corán reprendió esta costumbre.", fr: "Les animaux que les païens consacraient — Bahira, Saʾiba, Wasila, Hami — n’étaient ni montés ni trait, sauf pour les invités; le Coran a réprimandé cette coutume.", ur: "کافروں کے مقدس کردہ جانور - بحیرہ، سائبہ، وصیلہ، حمی - مہمانوں کے علاوہ نہ تو سوار ہوتے ہیں اور نہ ہی دودھ پیتے ہیں۔ قرآن نے اس رواج کی سرزنش کی۔", tr: "İslam öncesi halk tarafından saygı gören hayvanlar, bu yüzden ne binerlerdi, ne sürerlerdi, ne de sütlerini içirlerdi, sadece misafirler için olurdu: göl, seybe, el-vesila ve el-hami — bunlar Kur'an'da reddedilir.", id: "Ternak yang dihormati oleh masyarakat pra-Islam, sehingga mereka tidak menunggang kuda atau membajak, maupun minum susu kecuali untuk tamu: danau, sa'ibah, al-wasila, dan al-hami — semua ini dibantah oleh Al-Qur'an." }
