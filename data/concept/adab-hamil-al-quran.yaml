id: concept/adab-hamil-al-quran
class: concept
kind: ethical
label:
  ar: "آداب حامل القرآن"
  en: "Manners of the Qur'an bearer"
  fr: "Les bonnes manières du porteur du Coran"
  ur: "حاملِ قرآن کے آداب"
  es: "Modales del portador del Corán"
  tr: "Kur'an Taşıyıcısının Görgü Kuralları"
  id: "Etiket Pembawa Al-Qur'an"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن حامل القرآن يُعرف بليله حين ينام الناس، وببكائه حين يضحكون، وبصمته حين يخوض الناس، وبتواضعه حين يتكبرون. ويرى أن ينبغي له أن يكون حكيما حليما، لا جافيا ولا غافلا."
  en: "Sheikh Omar Abdelkafy says that the bearer of the Qur'an is known by his night when people sleep, by his weeping when people laugh, by his silence when people engage in idle talk and by his humility when people are proud. He holds that he should be wise and forbearing, neither harsh nor careless."
  fr: "Le cheikh Omar Abdelkafy dit que le porteur du Coran se reconnaît à sa nuit lorsque les gens dorment, à ses pleurs lorsqu'ils rient, à son silence lorsqu'ils tiennent des propos futiles et à son humilité lorsqu'ils s'enorgueillissent. Il estime qu'il doit être sage et indulgent, sans être dur ni négligent."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ حاملِ قرآن اپنی رات سے پہچانا جاتا ہے جب لوگ سوتے ہیں، اپنے رونے سے جب لوگ ہنستے ہیں، اپنی خاموشی سے جب لوگ فضول باتیں کرتے ہیں، اور اپنی عاجزی سے جب لوگ تکبر کرتے ہیں۔ ان کی رائے ہے کہ اسے دانا اور بردبار ہونا چاہیے، نہ سخت مزاج اور نہ غافل۔"
  es: "El jeque Omar Abdelkafy afirma que quien posee el Corán se distingue por su silencio nocturno cuando la gente duerme, por su llanto cuando ríen, por su quietud cuando conversan ociosamente y por su humildad cuando se enorgullecen. Sostiene que debe ser sabio y tolerante, ni severo ni descuidado."
  tr: "Şeyh Ömer Abdul Kafi, Kur'an'ın taşıyıcısının insanlar uyurken geceleri, güldüklerinde ağlaması, insanlarla yüzleşirken sessizliği ve kibirli olduklarında alçakgönüllülüğüyle tanındığını söyler. Bilge ve hoşgörülü olması gerektiğine, ne sert ne de dikkatsiz olması gerektiğine inanır."
  id: "Sheikh Omar Abdul Kafi mengatakan bahwa pembawa Al-Qur'an dikenal karena malamnya saat orang tidur, tangisannya saat tertawa, diamnya saat menghadapi orang, dan kerendahan hatinya saat mereka sombong. Dia percaya bahwa dia harus bijaksana dan sabar, tidak keras atau ceroboh."
