id: concept/adab-hamil-al-quran
class: concept
kind: ethical
label:
  ar: "آداب حامل القرآن"
  en: "Manners of the Qur'an bearer"
  ur: "حاملِ قرآن کے آداب"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن حامل القرآن يُعرف بليله حين ينام الناس، وببكائه حين يضحكون، وبصمته حين يخوض الناس، وبتواضعه حين يتكبرون. ويرى أن ينبغي له أن يكون حكيما حليما، لا جافيا ولا غافلا."
  en: "Sheikh Omar Abdelkafy says that the bearer of the Qur'an is known by his night when people sleep, by his weeping when people laugh, by his silence when people engage in idle talk and by his humility when people are proud. He holds that he should be wise and forbearing, neither harsh nor careless."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ حاملِ قرآن اپنی رات سے پہچانا جاتا ہے جب لوگ سوتے ہیں، اپنے رونے سے جب لوگ ہنستے ہیں، اپنی خاموشی سے جب لوگ فضول باتیں کرتے ہیں، اور اپنی عاجزی سے جب لوگ تکبر کرتے ہیں۔ ان کی رائے ہے کہ اسے دانا اور بردبار ہونا چاہیے، نہ سخت مزاج اور نہ غافل۔"
