label:
  ar: "فقر الرموز النسائية عبر التاريخ"
  en: "The scarcity of female symbols across history"
issue:
  ar: "لماذا شحّت الرموز النسائية — العلماء والمفكرات والقائدات — عبر التاريخ، وهل سببه تسلّط الذكور أم تكوين المرأة أم ضغط المجتمع؟"
summary:
  ar: "حلقة «الوسطية» عن ظاهرة فقر الرموز النسائية عبر التاريخ — لا لإضعاف المرأة بل لسؤال من كسرن الحاجز كيف كسرنه {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:30}. صوّت الشباب: 50% يرون الرموز موجودة اليوم لكن بحدود أخفّ من الماضي {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:08:30}؛ ومن أرقام الحلقة: النساء العاملات في السياسة بذلك العصر نحو 3%، واستشهد المتحاورون بأسماء تاريخية — خديجة وفاطمة بنت عبد الملك وزبيدة — وكتاب غربي «المرأة الواعدة» يدرس الظاهرة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:16:00} {cite:assabile-tareq-al-suwaidan/al-wassitiya/ep16 00:31:30}."
  en: "The 'Al-Wasatiyya' episode on the scarcity of female symbols across history — not to weaken woman but to ask those who broke the barrier how they broke it {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:30}. The youth voted: 50% see female symbols existing today but more faintly than in the past {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:08:30}; from the episode's figures, women in political work in that era numbered about 3%, and panelists cited historical names — Khadija, Fatima bint Abd al-Malik, Zubayda — and a Western book, 'The Promotable Woman', studying the phenomenon {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:31:30}."
