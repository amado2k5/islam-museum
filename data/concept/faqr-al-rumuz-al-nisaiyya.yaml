id: concept/faqr-al-rumuz-al-nisaiyya
class: concept
kind: social
label:
  ar: "فقر الرموز النسائية عبر التاريخ"
  en: "The scarcity of female symbols across history"
  es: "La escasez de símbolos femeninos a lo largo de la historia"
  fr: "La rareté des symboles féminins à travers l'histoire"
  ur: "تاریخ میں خواتین کی علامتوں کی کمی"
  tr: "Tarih boyunca kadın sembollerinin yoksulluğu"
  id: "Kemiskinan simbol perempuan sepanjang sejarah"
issue:
  ar: "لماذا شحّت الرموز النسائية — العلماء والمفكرات والقائدات — عبر التاريخ، وهل سببه تسلّط الذكور أم تكوين المرأة أم ضغط المجتمع؟"
summary:
  ar: "حلقة «الوسطية» عن ظاهرة فقر الرموز النسائية عبر التاريخ — لا لإضعاف المرأة بل لسؤال من كسرن الحاجز كيف كسرنه {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:30}. صوّت الشباب: 50% يرون الرموز موجودة اليوم لكن بحدود أخفّ من الماضي {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:08:30}؛ ومن أرقام الحلقة: النساء العاملات في السياسة بذلك العصر نحو 3%، واستشهد المتحاورون بأسماء تاريخية — خديجة وفاطمة بنت عبد الملك وزبيدة — وكتاب غربي «المرأة الواعدة» يدرس الظاهرة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:16:00} {cite:assabile-tareq-al-suwaidan/al-wassitiya/ep16 00:31:30}."
  en: "The 'Al-Wasatiyya' episode on the scarcity of female symbols across history — not to weaken woman but to ask those who broke the barrier how they broke it {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:30}. The youth voted: 50% see female symbols existing today but more faintly than in the past {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:08:30}; from the episode's figures, women in political work in that era numbered about 3%, and panelists cited historical names — Khadija, Fatima bint Abd al-Malik, Zubayda — and a Western book, 'The Promotable Woman', studying the phenomenon {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:31:30}."
  es: "El episodio de 'Al-Wasatiyya' sobre la escasez de símbolos femeninos a lo largo de la historia, no para debilitar a la mujer sino para preguntar a quienes rompieron la barrera cómo lo hicieron {00:03:30}. Los jóvenes votaron: el 50% ve símbolos femeninos que existen hoy en día, pero de forma más tenue que en el pasado {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:08:30}; según las cifras del episodio, las mujeres en el trabajo político en esa época sumaban alrededor del 3%, y los panelistas citaron nombres históricos: Khadija, Fatima bint Abd al-Malik, Zubayda, y un libro occidental, 'La mujer promovible' {cite:assabile-tareq-al-suwaidan-al-wassitiya/ep16 00:16:00} {cite:assabile-tareq-al-suwaidan-al-wassitiya/ep16 00:31:30}."
  fr: "L'épisode d'« Al-Wasatiyya » consacré à la rareté des figures féminines emblématiques à travers l'histoire – non pas pour dévaloriser les femmes, mais pour interroger celles qui ont brisé le plafond de verre sur la manière dont elles y sont parvenues (00:03:30). Les jeunes ont voté: 50 % d'entre eux perçoivent des figures féminines aujourd'hui, mais moins visibles qu'auparavant (cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:08:30). D'après les chiffres de l'épisode, les femmes occupant des fonctions politiques à cette époque représentaient environ 3 % de la population. Les intervenants ont cité des figures historiques telles que Khadija, Fatima bint Abd al-Malik et Zubayda, ainsi qu'un ouvrage occidental, « The Promotable Woman » (cite:assabile-tareq-al-suwaidan-al-wassitiya/ep16 00:16:00) (cite:assabile-tareq-al-suwaidan-al-wassitiya/ep16 00:31:30)."
  ur: "پوری تاریخ میں خواتین کی علامتوں کی کمی پر 'الوصطیہ' ایپیسوڈ - عورت کو کمزور کرنے کے لیے نہیں بلکہ ان سے پوچھنا ہے جنہوں نے اس رکاوٹ کو توڑا 00:03:30}۔ نوجوانوں نے ووٹ دیا: 50% آج خواتین کے نشانات کو دیکھتے ہیں لیکن ماضی کے مقابلے میں زیادہ دھندلے انداز میں دیکھ رہے ہیں قسط کے اعداد و شمار سے، اس دور میں سیاسی کام کرنے والی خواتین کی تعداد تقریباً 3% تھی، اور پینلسٹس نے تاریخی ناموں کا حوالہ دیا — خدیجہ، فاطمہ بنت عبد الملک، زبیدہ — اور ایک مغربی کتاب، 'دی پروموٹیبل وومن' {حوالہ:اسابیل-طارق-السویدان-الوصیتیہ/ایپ16 00:31:30}۔"
  tr: "\"Ölçülülük\" bölümü, tarih boyunca kadın figürler arasındaki yoksulluk olgusunu ele aldı — kadınları zayıflatmak için değil, bariyeri kimin aştığını ve nasıl aştığını sormak için {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:30}. Youth Voice: %50'si sembollerin bugün var olduğunu ancak geçmişe göre daha az ölçüde olduğunu düşünüyor {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:08:30}; bölümdeki rakamlardan: o dönemde siyasette çalışan kadınların yaklaşık %3'ü ve muhataplar tarihi isimleri — Khadijah, Fatima bint Abd al-Malik, Zubaida — ve bu fenomeni inceleyen Batı kitabı \"The Promising Woman\"ı {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:16:00} {cite:assabile-tareq-al-suwaidan/al-wassitiya/ep16 00:31:30} {cite:assabile-tareq-al-suwaidan/al-wassitiya/ep16 00:31:30}"
  id: "Episode \"Moderasi\" tentang fenomena kemiskinan di antara tokoh perempuan sepanjang sejarah — bukan untuk melemahkan perempuan tetapi untuk bertanya siapa yang menembus batas dan bagaimana mereka mematahkannya {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:03:30}. Suara Pemuda: 50% melihat simbol sebagai simbol yang ada saat ini tetapi dalam tingkat yang lebih rendah dibandingkan masa lalu {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:08:30}; dari angka episode: sekitar 3% perempuan yang bekerja di dunia politik pada waktu itu, dan lawan bicara menyebut nama sejarah — Khadijah, Fatima bint Abd al-Malik, Zubaida — dan sebuah buku Barat \"The Promising Woman\" yang mempelajari fenomena ini {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep16 00:16:00} {cite:assabile-tareq-al-suwaidan/al-wassitiya/ep16 00:31:30}."
