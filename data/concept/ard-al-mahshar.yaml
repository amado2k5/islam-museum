id: concept/ard-al-mahshar
class: concept
kind: belief
label:
  ar: "أرض المحشر والعرصات"
  en: "The gathering ground"
  fr: "La terre du rassemblement"
  ur: "میدانِ حشر"
  es: "El lugar de reunión"
  tr: "Toplanma Ülkesi ve Tarlalar"
  id: "Tanah Pengumpulan dan Ladang-ladang"
summary:
  ar: "أرض المحشر أرض جديدة يوم تبدل الأرض غير الأرض والسماوات: أرض بيضاء عفراء كقرس النقي لم تُعصَ عليها قطرة دم ولا وُطئت عليها خطيئة، لا علم لأحد فيها {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "The gathering ground is the new earth of 'the day the earth is changed to another earth and the heavens': a white, pure land like fine flour, on which no drop of blood was shed and no sin committed, with no landmark for anyone {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  fr: "La terre du rassemblement est la terre nouvelle du « jour où la terre sera changée en une autre terre, ainsi que les cieux » : une terre blanche et pure comme de la farine fine, sur laquelle aucune goutte de sang n’a été versée et aucun péché commis, sans aucun repère pour quiconque {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "میدانِ حشر وہ نئی زمین ہے «جس دن زمین بدل دی جائے گی اور آسمان بھی»: سفید پاکیزہ زمین جیسے خالص آٹا، جس پر نہ خون بہا نہ گناہ ہوا، جس میں کسی کے لیے کوئی نشان نہ ہو گا {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
  es: "El lugar de reunión es la nueva tierra del 'día en que la tierra se transforme en otra tierra y en los cielos': una tierra blanca y pura como harina fina, en la que no se derramó ni una gota de sangre ni se cometió pecado alguno, sin ningún punto de referencia para nadie {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  tr: "Diriliş Diyarı, yeryüzünün yerden ve göklerden değişeceği gün yeni bir topraktır: saf kaktüs gibi beyaz, tozlu bir topraktır, ona hiç kan damlası dokunmamış, günah da ona dokunmamıştır, bundan habersizdir {cite:sahih-al-bukhari} {cite:sahih-al-muslim}."
  id: "Tanah Kebangkitan adalah tanah baru pada Hari ketika bumi akan berubah dari bumi dan langit: tanah putih berdebu seperti kaktus murni, tidak ada setetes darah pun yang pernah tersentuh olehnya, dan dosa pun tidak menyentuhnya, tanpa pengetahuan tentangnya {cite:sahih-al-bukhari} {cite:sahih-muslim}."
