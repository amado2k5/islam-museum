summary:
  ar: "أرض المحشر أرض جديدة يوم تبدل الأرض غير الأرض والسماوات: أرض بيضاء عفراء كقرس النقي لم تُعصَ عليها قطرة دم ولا وُطئت عليها خطيئة، لا علم لأحد فيها {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "The gathering ground is the new earth of 'the day the earth is changed to another earth and the heavens': a white, pure land like fine flour, on which no drop of blood was shed and no sin committed, with no landmark for anyone {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "میدانِ حشر وہ نئی زمین ہے «جس دن زمین بدل دی جائے گی اور آسمان بھی»: سفید پاکیزہ زمین جیسے خالص آٹا، جس پر نہ خون بہا نہ گناہ ہوا، جس میں کسی کے لیے کوئی نشان نہ ہو گا {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
