id: concept/mass-al-jinn
class: concept
kind: belief
label:
  ar: مس الجن
  en: Possession by jinn (mass)
  ur: جنوں کا ماس
  es: "Posesión por genios (masiva)"
  fr: "Possession par un djinn (messe)"
  tr: "Bayan Jinn"
  id: "Nona Jinn"
summary:
  ar: "من أذى الجن للإنسان: مسٌّ من الجنون يصيبه بإذن الله — قال تعالى في آكل الربا لا يقوم إلا كما يقوم الذي يتخبطه الشيطان من المس، وقد دفع النبي عين الجن ورقى أصحابه {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  en: "Of the jinn's harm to man: a touch of possession striking him by God's leave — the Qur'an says of the usurer that he rises only as one whom Satan throws down by the touch; the Prophet warded off the jinn's eye and did ruqya for his Companions {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  ur: "جنوں کا انسان کو نقصان: اللہ کے اذن سے جنون کا چھوا — قرآن سود خور کے بارے میں فرماتا ہے کہ وہ اسی طرح اٹھتا ہے جیسے شیطان چھو کر گرا ہوا ہو؛ نبی نے جنوں کی نظر دفع کی اور صحابہ کی رقیہ کی {cite:sahih-muslim} {cite:tafsir-ibn-kathir}۔"
  es: "Sobre el daño que los genios causan al hombre: un toque de posesión que lo golpea con el permiso de Dios; el Corán dice del usurero que solo se levanta como aquel a quien Satanás derriba con un toque; el Profeta alejó la mirada de los genios e hizo ruqya por sus Compañeros {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  fr: "Concernant le mal que les djinns peuvent faire à l'homme: une possession qui le frappe par la permission de Dieu — le Coran dit de l'usurier qu'il ne se relève que comme celui que Satan fait tomber d'un simple contact; le Prophète a repoussé le regard du djinn et a pratiqué la roqya pour ses Compagnons {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  tr: "Cinin bir kişiye verdiği zararlar arasında, Allah'ın izniyle onu etkileyen bir delilik dokunuşu — Yüce Allah, tefeci tüketen kişi, şeytanın dokunuşuyla tökezlediğinde olduğu gibi durmaz demiştir. Peygamber, cinin gözünü geri püskürttü ve sahabelerinin ayinlerini yaptı {cit:sahih-müslim} {alıntı:tefsir-ibn-kathir}."
  id: "Di antara bahaya jin terhadap seseorang: sedikit kegilaan yang menimpanya dengan izin Allah — Allah Yang Maha Kuasa berkata tentang orang yang mengonsumsi riba tidak berdiri kecuali ketika dia tersandung oleh sentuhan Setan. Nabi menolak mata jin dan melaksanakan ritual para sahabatnya {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
