id: concept/mass-al-jinn
class: concept
kind: belief
label:
  ar: مس الجن
  en: Possession by jinn (mass)
  ur: جنوں کا ماس
summary:
  ar: "من أذى الجن للإنسان: مسٌّ من الجنون يصيبه بإذن الله — قال تعالى في آكل الربا لا يقوم إلا كما يقوم الذي يتخبطه الشيطان من المس، وقد دفع النبي عين الجن ورقى أصحابه {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  en: "Of the jinn's harm to man: a touch of possession striking him by God's leave — the Qur'an says of the usurer that he rises only as one whom Satan throws down by the touch; the Prophet warded off the jinn's eye and did ruqya for his Companions {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  ur: "جنوں کا انسان کو نقصان: اللہ کے اذن سے جنون کا چھوا — قرآن سود خور کے بارے میں فرماتا ہے کہ وہ اسی طرح اٹھتا ہے جیسے شیطان چھو کر گرا ہوا ہو؛ نبی نے جنوں کی نظر دفع کی اور صحابہ کی رقیہ کی {cite:sahih-muslim} {cite:tafsir-ibn-kathir}۔"
