summary:
  ar: "غاغاطي في الكتاب حجر خفيف له رائحة القفر، ينفع من النقرس، وإذا تدخن به المصروع نفعه، ويطرد دخانه الهوام؛ وفيه نقل موسوم عن اختناق الرحم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.725}"
  en: "Ghaghati is in the book a light stone with the smell of the desert (qafr); it benefits gout, when the epileptic is fumigated with it it benefits him, and its smoke drives away vermin; it has a labelled listing on suffocation of the womb in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.725}"
  ur: "غاغاطی کتاب میں ایک ہلکا پتھر ہے جس کی بو بیابان کی بو جیسی ہے، نقرس میں نافع ہے، مرگی والے کو اس کی دھونی دی جائے تو اسے فائدہ دیتا ہے، اور اس کا دھواں ہوام کو بھگاتا ہے؛ رحم کی گھٹن کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.725}۔"
  es: "Ghaghati es descrita en el libro como una piedra ligera con olor a desierto (qafr); es beneficiosa para la gota, cuando se fumiga con ella a un epiléptico, y su humo ahuyenta a los parásitos; tiene una mención específica sobre la asfixia del útero en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 p.725}."
