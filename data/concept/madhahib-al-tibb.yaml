label: { ar: "مذاهب أهل الطب", en: "The medical sects", es: "Las sectas médicas", fr: "Les sectes médicales", ur: "طبی فرقے۔", tr: "Tıp Halkının Doktrinleri", id: "Doktrin Orang Medis" }
summary:
  ar: "اختلف المتطببون في مجلس الواثق في طرق الطب، فطائفة أهل التجربة زعمت أن الأشياء تعرف بالتجربة كالنقلة من عضو إلى عضو يشبهه ومن دواء إلى دواء، وطائفة أرباب القياس والنظر زعمت أن الطب مأخوذ من مقدمات أولية كمعرفة طبائع الأبدان والأعضاء والأهوية والعادات وقوى الأمراض، وقالوا هذا قول أبقراط وجالينوس، وطائفة عرفت بأصحاب الطب الجبلي ردت العلل والمولدات إلى أصول حاصرة جامعة دون النظر في الأسباب {cite:muruj-al-dhahab p. 467-468}."
  en: "The Empiricist, Dogmatist and 'mountain-medicine' sects of physicians debated at al-Wathiq's majlis — the dogmatists claiming Hippocrates and Galen {cite:muruj-al-dhahab p. 467-468}."
  es: "Las sectas empiristas, dogmáticas y de \"medicina de montaña\" de médicos debatieron en el majlis de al-Wathiq; los dogmáticos citaban a Hipócrates y Galeno {cite:muruj-al-dhahab p. 467-468}."
  fr: "Les sectes de médecins empiristes, dogmatiques et de « médecine de montagne » ont débattu au majlis d'al-Wathiq — les dogmatiques revendiquant Hippocrate et Galien {cite:muruj-al-dhahab p. 467-468}."
  ur: "الوثیق کی مجلس میں طبیبوں کے تجرباتی، عقیدہ پرست اور 'ماؤنٹین میڈیسن' فرقے بحث کرتے ہیں - ہپوکریٹس اور گیلن کا دعویٰ کرنے والے عقیدہ پرست {حوالہ: مروج الذہب ص۔ 467-468}۔"
  tr: "Al-Wathiq'in konseyindeki uygulayıcılar tıp yöntemleri konusunda farklı görüşlere sahipti. Deneyim insanları grubu, bir organdan diğerine ve bir tıptan diğerine geçiş gibi deneyimlerle bilindiğini iddia etti. Benzer ve içgörü uzmanları grubu, tıbbın bedenlerin, organların, kimliklerin, alışkanlıkların ve hastalıkların güçlerinin doğası gibi temel öncüllerden türediğini iddia etti. Bunun Hipokrat ve Galen'in görüşü olduğunu söylediler. Dağ tıbbı insanları olarak bilinen başka bir grup, hastalıkları ve nedenleri kapsamlı ilkelere bağladı {atıf:muruj-al-dhahab s. 467-468}."
  id: "Para praktisi dalam dewan Al-Wathiq berbeda pendapat mengenai metode pengobatan. Kelompok orang berpengalaman mengklaim bahwa segala sesuatu diketahui melalui pengalaman, seperti transisi dari satu organ ke organ lain yang mirip dan dari satu kedokteran ke pengobatan lain. Kelompok ahli dalam analogi dan wawasan mengklaim bahwa kedokteran berasal dari premis utama seperti pengetahuan tentang hakikat tubuh, organ, identitas, kebiasaan, dan kekuatan penyakit. Mereka mengatakan ini adalah pandangan Hippocrates dan Galen. Kelompok lain, yang dikenal sebagai orang-orang pengobatan pegunungan, mengaitkan penyakit dan penyebab dengan prinsip komprehensif tanpa mempertimbangkan penyebabnya {cite:muruj-al-dhahab hlm. 467-468}."
