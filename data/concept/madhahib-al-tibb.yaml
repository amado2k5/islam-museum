summary:
  ar: "اختلف المتطببون في مجلس الواثق في طرق الطب، فطائفة أهل التجربة زعمت أن الأشياء تعرف بالتجربة كالنقلة من عضو إلى عضو يشبهه ومن دواء إلى دواء، وطائفة أرباب القياس والنظر زعمت أن الطب مأخوذ من مقدمات أولية كمعرفة طبائع الأبدان والأعضاء والأهوية والعادات وقوى الأمراض، وقالوا هذا قول أبقراط وجالينوس، وطائفة عرفت بأصحاب الطب الجبلي ردت العلل والمولدات إلى أصول حاصرة جامعة دون النظر في الأسباب {cite:muruj-al-dhahab p. 467-468}."
  en: "The Empiricist, Dogmatist and 'mountain-medicine' sects of physicians debated at al-Wathiq's majlis — the dogmatists claiming Hippocrates and Galen {cite:muruj-al-dhahab p. 467-468}."
