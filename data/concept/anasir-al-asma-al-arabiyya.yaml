label:
  ar: "عناصر الأسماء العربية: عبد وابن وأبو وأم والـ وآل"
  en: "Elements of Arabic names: Abd, Ibn, Abu, Umm, al- and Al"
  ur: "عربی ناموں کے عناصر: عبد، ابن، ابو، ام، ال اور آل"
  fr: "Éléments des noms arabes : Abd, Ibn, Abu, Umm, al- et Al"
  es: "Elementos de los nombres árabes: Abd, Ibn, Abu, Umm, al- y Al"
summary:
  ar: "أربعة أنماط متكررة في الأسماء العربية: «عبد» مضافاً إلى اسم من أسماء الله أو صفاته، و«ابن» و«بن» و«بِن» بمعنى ابن، و«أبو» و«أم» التي قد تدل على الصلة أو الصفة لا الولد وحده، والفرق بين «الـ» أداة التعريف و«آل» بمعنى أسرة؛ كما يعرضها ملف بحثي قُدّم إلى المتحف مع الحديث الذي يستشهد به في أحب الأسماء {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-muslim-2132}."
  en: "Four recurrent patterns in Arabic names: Abd added to a name or attribute of God; Ibn, Bin and Ben for son of; Abu and Umm, which can denote association or quality and not only a child; and the difference between al-, the definite article, and Al, house of, as a research file supplied to the museum sets them out with the hadith it cites on the most beloved names {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-muslim-2132}."
  ur: "عربی ناموں میں چار بار بار آنے والے نمونے: «عبد» جو اللہ کے کسی نام یا صفت کے ساتھ لگتا ہے؛ «ابن»، «بن» اور «بِن» بمعنی بیٹا؛ «ابو» اور «ام» جو صرف اولاد ہی نہیں بلکہ تعلق یا صفت کی طرف بھی اشارہ کر سکتے ہیں؛ اور «ال» ⁦(حرفِ تعریف)⁩ اور «آل» ⁦(خاندان)⁩ کا فرق؛ جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل انہیں پسندیدہ ترین ناموں کے بارے میں اپنی نقل کردہ حدیث کے ساتھ بیان کرتی ہے {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-muslim-2132}۔"
  fr: "Quatre schémas récurrents dans les noms arabes : Abd ajouté à un nom ou à un attribut de Dieu ; Ibn, Bin et Ben pour « fils de » ; Abu et Umm, qui peuvent désigner une association ou une qualité et pas seulement un enfant ; et la différence entre al-, l'article défini, et Al, « maison de », comme les expose un dossier de recherche remis au musée avec le hadith qu'il cite sur les noms les plus aimés {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-muslim-2132}."
  es: "Cuatro patrones recurrentes en los nombres árabes: Abd añadido a un nombre o atributo de Dios; Ibn, Bin y Ben para «hijo de»; Abu y Umm, que pueden denotar asociación o cualidad y no solo un hijo; y la diferencia entre al-, el artículo definido, y Al, «casa de», tal como los expone un expediente de investigación entregado al museo con el hadiz que cita sobre los nombres más amados {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-muslim-2132}."
