label:
  ar: "تواريخ الرواة ووفياتهم"
  en: "Dates of narrators and their deaths (tawarikh al-ruwat)"
  es: "Fechas de los narradores y sus muertes (tawarikh al-ruwat)"
  fr: "Dates des narrateurs et de leurs décès (tawarikh al-ruwat)"
  ur: "راویوں کی تاریخیں اور ان کی وفات ⁦(تواریخ الروات)⁩"
  tr: "Anlatıcıların ve ölüm tarihleri"
  id: "Tanggal narator dan kematian mereka"
summary:
  ar: "النوع الستون من أنواع علوم الحديث عند ابن الصلاح والنووي: معرفة مواليد الرواة وسماعهم وقدومهم البلدان ووفياتهم، وبه يُعرف اتصال الحديث وانقطاعه ويُكشف من ادعى السماع ممن مات قبل أن يلقاه، كما فعل إسماعيل بن عياش وحفص بن غياث والحاكم. ومن كتبه «الوفيات» لابن زبر وذيوله المتعاقبة إلى العراقي. ويذكر النووي والسيوطي فيه عيوناً من التواريخ: سنّ النبي ووفاته، وبدء التاريخ بالهجرة، ووفيات العشرة، وأصحاب المذاهب، وأصحاب الكتب الستة، وسبعة من الحفاظ {cite:tadrib-rawi-awwama-v5 p. 502-540}."
  en: "Type sixty of the hadith sciences in Ibn al-Salah and al-Nawawi: knowing when narrators were born, when they heard, when they arrived in a given city and when they died. It shows whether a chain is connected or broken and exposes those who claimed to have heard from men already dead, as Isma'il ibn Ayyash, Hafs ibn Ghiyath and al-Hakim did. Its books include Ibn Zabr's al-Wafayat and the successive supplements to it down to al-Iraqi. Al-Nawawi and al-Suyuti give choice examples: the Prophet's age and death, the start of the Hijri era, the deaths of the Ten, the founders of the schools, the authors of the six books and seven later hafizes."
  es: "El tipo sesenta de las ciencias del hadiz en Ibn al-Salah y al-Nawawi: conocer cuándo nacieron los narradores, cuándo escucharon, cuándo llegaron a una ciudad determinada y cuándo murieron. Muestra si una cadena está conectada o rota y desenmascara a quienes afirmaron haber escuchado de hombres ya fallecidos, como Isma'il ibn Ayyash, Hafs ibn Ghiyath y al-Hakim. Sus libros incluyen al-Wafayat de Ibn Zabr y sus sucesivos suplementos hasta al-Iraqi. Al-Nawawi y al-Suyuti ofrecen ejemplos selectos: la edad y la muerte del Profeta, el inicio de la era Hijri, las muertes de los Diez, los fundadores de las escuelas, los autores de los seis libros y siete hafices posteriores."
  fr: "Le soixantième type de science du hadith selon Ibn al-Salah et al-Nawawi consiste à déterminer la date de naissance des narrateurs, la date à laquelle ils ont reçu le hadith, leur date d'arrivée dans une ville donnée et leur date de décès. Il permet de vérifier la continuité d'une chaîne de transmission et de démasquer ceux qui prétendaient tenir du hadith de personnes décédées, comme Isma'il ibn Ayyash, Hafs ibn Ghiyath et al-Hakim. Parmi les ouvrages qui en traite figurent al-Wafayat d'Ibn Zabr et ses suppléments successifs jusqu'à al-Iraqi. Al-Nawawi et al-Suyuti en donnent des exemples éloquents: l'âge et la mort du Prophète, le début de l'ère hégirienne, la mort des Dix Compagnons, les fondateurs des écoles, les auteurs des six recueils de hadiths et sept hafizites ultérieurs."
  ur: "ابن الصلاح اور النووی میں حدیث کے ساٹھ علوم کی قسم: یہ جاننا کہ راوی کب پیدا ہوئے، کب سنیں، کب کسی شہر میں پہنچے اور کب فوت ہوئے۔ اس سے پتہ چلتا ہے کہ آیا کوئی زنجیر جڑی ہوئی ہے یا ٹوٹی ہوئی ہے اور ان لوگوں کو بے نقاب کرتی ہے جنہوں نے دعویٰ کیا تھا کہ انہوں نے مردوں سے سنا ہے، جیسا کہ اسماعیل ابن عیاش، حفص ابن غیاث اور الحکیم نے کیا تھا۔ اس کی کتابوں میں ابن زبر کی الوفایت اور اس کے متواتر ضمیمہ عراقی تک شامل ہیں۔ النووی اور السیوطی نے انتخاب کی مثالیں دی ہیں: پیغمبر کی عمر اور وفات، ہجری دور کا آغاز، دس کی وفات، مکاتب کے بانی، چھ کتابوں کے مصنف اور سات بعد کے حافظ۔"
  tr: "İbn al-Salah ve al-Nawawi'ye göre altmış tür hadis ilimi: rivayetçilerin doğumlarını, işitmelerini, kökenlerini ve ölümlerini bilmek. Böylece hadislerin bağlantısı ve kesintisi belirlenir ve onu duyduğunu iddia edenler, İsmail bin Eyyaş, Hafs ibn Ghayat ve al-Hakim gibi onunla karşılaşmadan önce ölen kişiler vahyedilir. Kitapları arasında İbn Zubr'un \"el-Vafayat\" adlı eseri ve el-Irak'a kadar olan ardışık eserleri yer alır. El-Nawavi ve el-Suyuti bu eserlerde önemli tarihî kaynaklardan bahseder: Peygamber'in yaşı ve ölümü, tarihin göçle başlangıcı, on kişinin ölümü, medhebin yazarları, altı kitabın yazarları ve yedi ezberci {atıf:tadrib-rawi-awwama-v5 s. 502-540}."
  id: "Enam puluh jenis ilmu hadis menurut Ibn al-Salah dan al-Nawawi: mengetahui kelahiran, pendengaran, asal-usul narator, dan kematian mereka. Melalui ini, hubungan dan gangguan hadis diidentifikasi, dan mereka yang mengaku telah mendengarnya diungkapkan siapa yang meninggal sebelum melihatnya, seperti halnya Isma'il ibn Ayyash, Hafs ibn Ghayath, dan al-Hakim. Di antara bukunya adalah \"al-Wafayat\" karya Ibn Zubr dan karya-karya berturut-turutnya hingga al-Iraqi. Al-Nawawi dan al-Suyuti menyebutkan sumber-sumber sejarah utama: usia dan kematian Nabi, awal sejarah dengan migrasi, kematian sepuluh orang, penulis madhhab, penulis enam kitab, dan tujuh penghafal {cite:tadrib-rawi-awwama-v5 hlm. 502-540}."
