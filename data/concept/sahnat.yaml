summary:
  ar: "الصحناة في الكتاب مجفف جلاء رديء الخلط، وفي حاشية المحقق أنها السمك المطحون، يورث الجرب والحكة وينفع من وجع الورك البلغمي ويزيل بخر المعدة ويجلو رطوبتها ويجففها {cite:canon-ibn-sina-print-v1 pp.639-640}"
  en: "Sahnat is in the book a drying, cleansing drug of bad humour, and the editor's footnote says it is ground fish; it brings on scab and itch, benefits phlegmatic pain of the hip, removes the foul breath that comes from the stomach and cleanses and dries its moisture {cite:canon-ibn-sina-print-v1 pp.639-640}"
  ur: "صحناۃ کتاب میں خشک کرنے اور جلاء دینے والی، ردی خلط والی چیز ہے، اور مدقق کے حاشیے میں ہے کہ یہ پسی ہوئی مچھلی ہے؛ خارش اور کھجلی پیدا کرتی ہے، بلغمی کولہے کے درد میں نافع ہے، معدے سے آنے والی بدبو دور کرتی ہے اور اس کی نمی کو صاف اور خشک کرتی ہے {cite:canon-ibn-sina-print-v1 pp.639-640}۔"
  es: "En el libro, Sahnat es un medicamento secante y depurativo del mal humor, y la nota al pie del editor dice que es pescado molido; provoca costras y picazón, alivia el dolor flemático de la cadera, elimina el mal aliento que proviene del estómago y limpia y seca su humedad {cite:canon-ibn-sina-print-v1 pp.639-640}"
  fr: "Le sahnat est décrit dans le livre comme un remède asséchant et purifiant contre la mauvaise humeur; la note de bas de page de l’éditeur précise qu’il s’agit de poisson moulu. Il provoque des croûtes et des démangeaisons, soulage les douleurs flegmatiques de la hanche, élimine la mauvaise haleine d’origine gastrique et purifie et assèche l’estomac. {cite:canon-ibn-sina-print-v1 pp.639-640}"
  tr: "Kitaptaki 'sahna' kurutulmuş ve kötü karıştırılmış, editörün kenar notunda ise yer kıymasıdır; bu balık uyuz ve kaşıntıya neden olur, flegmatik kalça ağrısına yardımcı olur, mide buharını giderir, nemini temizler ve kurutur {cite:canon-ibn-sina-print-v1 s.639-640}"
  id: "'Sahna' dalam buku ini dikeringkan dan tidak tercampur dengan baik, dan dalam catatan pinggir editor, ikan yang digiling menyebabkan kudis dan gatal, membantu nyeri pinggul yang berdahak, menghilangkan uap perut, membersihkan kelembapannya, dan mengeringkannya {cite:canon-ibn-sina-print-v1 hlm.639-640}"
