summary:
  ar: "الصحناة في الكتاب مجفف جلاء رديء الخلط، وفي حاشية المحقق أنها السمك المطحون، يورث الجرب والحكة وينفع من وجع الورك البلغمي ويزيل بخر المعدة ويجلو رطوبتها ويجففها {cite:canon-ibn-sina-print-v1 pp.639-640}"
  en: "Sahnat is in the book a drying, cleansing drug of bad humour, and the editor's footnote says it is ground fish; it brings on scab and itch, benefits phlegmatic pain of the hip, removes the foul breath that comes from the stomach and cleanses and dries its moisture {cite:canon-ibn-sina-print-v1 pp.639-640}"
  ur: "صحناۃ کتاب میں خشک کرنے اور جلاء دینے والی، ردی خلط والی چیز ہے، اور مدقق کے حاشیے میں ہے کہ یہ پسی ہوئی مچھلی ہے؛ خارش اور کھجلی پیدا کرتی ہے، بلغمی کولہے کے درد میں نافع ہے، معدے سے آنے والی بدبو دور کرتی ہے اور اس کی نمی کو صاف اور خشک کرتی ہے {cite:canon-ibn-sina-print-v1 pp.639-640}۔"
