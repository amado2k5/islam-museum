label:
  ar: "الرماد"
  en: "Rimad (ashes): whether ashes of pure and impure things are pure, whether tayammum may be made with them, and whether they are property"
  ur: "راکھ ⁦(رماد)⁩"
  es: "Rimad (cenizas): si las cenizas de cosas puras e impuras son puras, si se puede realizar el tayammum con ellas y si son propiedad"
  fr: "Rimad (cendres): la pureté des cendres de choses pures et impures, la possibilité d'en faire du tayammum et leur statut de propriété."
  tr: "Küller"
  id: "Abu"
summary:
  ar: "الرماد في اللغة دقاق الفحم من حراقة النار، وهو ما يبقى بعد الاحتراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} ولا خلاف في طهارة الرماد من احتراق الشيء الطاهر، واستعمل النبي رماد الحصير في وقف الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} واختلف الفقهاء في طهارة الرماد من احتراق النجس: فذهب الحنفية وبعض المالكية والحنابلة في رواية إلى طهارته لأن النار تستحيل بها العين، وذهب الشافعية وجمهور المالكية إلى نجاسته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} ولا يجوز التيمم بالرماد عند جمهور الفقهاء لأنه ليس من جنس الأرض، ويجوز عند الحنفية إذا كان من حجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} والرماد الطاهر مال متقوم يصح بيعه، وأما رماد النجس عند من يقول بنجاسته فلا يعد مالا متقوما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986}"
  en: "Rimad (ashes) in the lexicon is the fine dust of burnt coal, what remains after burning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} There is no dispute that the ash of a pure thing burned is pure; the Prophet used the ashes of a mat to staunch a wound. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} The jurists differ on the ash of an impure thing: Abu Hanifa, some Malikis and one Hanbali view hold it pure because fire changes the substance, while the Shafi'is and most Malikis hold it impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} Most jurists forbid tayammum with ashes because they are not of the earth, while the Hanafis allow it when made from stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} The ash of a pure thing is property that may be sold; the ash of an impure thing is not a valuable property for those who hold it impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986}"
  ur: "راکھ پاک چیز کی ہو تو پاک ہے؛ نجس چیز کی راکھ کی طہارت میں اختلاف ہے، اور راکھ سے تیمم جمہور کے نزدیک جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985}"
  es: "Rimad (cenizas) en el léxico es el polvo fino del carbón quemado, lo que queda después de la combustión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} No hay disputa de que la ceniza de algo puro quemado es pura; el Profeta usó las cenizas de una estera para detener una herida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} Los juristas difieren sobre la ceniza de algo impuro: Abu Hanifa, algunos malikíes y una visión hanbalí la consideran pura porque el fuego cambia la sustancia, mientras que los shafiíes y la mayoría de los malikíes la consideran impura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} La mayoría de los juristas prohíben el tayammum con cenizas porque no son de la tierra, mientras que los hanafíes lo permiten cuando están hechas de piedra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} La ceniza de algo puro es propiedad que puede venderse; la ceniza de algo impuro no es una propiedad valiosa para quienes la consideran impura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986}"
  fr: "Dans le lexique, le terme « rimad » (cendres) désigne la fine poussière de charbon brûlé, résidu de la combustion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} Il est incontestable que les cendres d'une chose pure brûlée sont pures; le Prophète a utilisé les cendres d'une natte pour stopper une plaie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} Les juristes divergent quant à la pureté des cendres d'une chose impure: Abu Hanifa, certains Malikites et une opinion hanbalite les considèrent pures car le feu en modifie la substance, tandis que les Shafi'ites et la plupart des Malikites les considèrent impures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} La plupart des juristes interdisent le tayammum avec des cendres car elles ne sont pas d'origine terrestre, tandis que les hanafites l'autorisent lorsqu'il est fait de pierre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} Les cendres d'une chose pure constituent un bien qui peut être vendu; les cendres d'une chose impure ne constituent pas un bien précieux pour ceux qui les considèrent comme impures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986}"
  tr: "Kül, dilde kömürün kömürü anlamına gelir; yandıktan sonra kalan kömürdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8983} Saf şeylerin yakılmasından elde edilen külün saflığı konusunda bir tartışma yoktur ve Peygamber, kanı durdurmak için mat külünü kullanmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8984} Hukukçular, külün saflığı ile yanan kirli maddeler arasında farklı görüşler yaşamıştır: Hanefiler, bazı Malikiler ve Hanbaliler, külün saf olduğunu, çünkü ateşin nazarı engelleyeceğini anlatmıştır. Şafiiler ve Malikilerin çoğu külün saf olduğunu kabul etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8984} Çoğu hukukçuya göre külle tayammum yapmak yasaktır çünkü toprakla aynı türde değildir ve Hanefi okuluna göre taştan yapılmışsa ziyade kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8985} Saf kül, satışa uygun olan ayakta duran mülk olarak kabul edilir, ancak kirli küllerin külleri, onu saf olmayan olarak iddia edenlere göre, ayakta duran servet olarak kabul edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8986}"
  id: "Abu dalam bahasa berarti arang dari batu bara, yang tersisa setelah dibakar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8983} Tidak ada perselisihan tentang kemurnian abu dari pembakaran benda suci, dan Nabi menggunakan abu mat untuk menghentikan darah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8984} Para ahli hukum berbeda pendapat mengenai kemurnian abu dari pembakaran kotoran: Hanafi, beberapa Maliki, dan Hanbalis menceritakan bahwa abu itu murni karena api membuat mata jahat tidak terlihat. Para Syafi'i dan mayoritas Malik menganggap abu itu tidak murni. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 8984} Menurut mayoritas ahli hukum, tidak diperbolehkan melakukan tayammum dengan abu karena tidak sama jenisnya dengan tanah, dan menurut aliran Hanafi diperbolehkan jika terbuat dari batu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8985} Abu murni dianggap sebagai properti tetap yang sah untuk dijual, tetapi abu dari yang tidak murni, menurut mereka yang mengklaim, tidak dianggap sebagai kekayaan tetap. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8986}"
