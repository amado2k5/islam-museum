id: concept/rimad-fiqh
class: concept
kind: legal
label:
  ar: "الرماد"
  en: "Rimad (ashes): whether ashes of pure and impure things are pure, whether tayammum may be made with them, and whether they are property"
  ur: "راکھ (رماد)"
summary:
  ar: "الرماد في اللغة دقاق الفحم من حراقة النار، وهو ما يبقى بعد الاحتراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} ولا خلاف في طهارة الرماد من احتراق الشيء الطاهر، واستعمل النبي رماد الحصير في وقف الدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} واختلف الفقهاء في طهارة الرماد من احتراق النجس: فذهب الحنفية وبعض المالكية والحنابلة في رواية إلى طهارته لأن النار تستحيل بها العين، وذهب الشافعية وجمهور المالكية إلى نجاسته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} ولا يجوز التيمم بالرماد عند جمهور الفقهاء لأنه ليس من جنس الأرض، ويجوز عند الحنفية إذا كان من حجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} والرماد الطاهر مال متقوم يصح بيعه، وأما رماد النجس عند من يقول بنجاسته فلا يعد مالا متقوما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986}"
  en: "Rimad (ashes) in the lexicon is the fine dust of burnt coal, what remains after burning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} There is no dispute that the ash of a pure thing burned is pure; the Prophet used the ashes of a mat to staunch a wound. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} The jurists differ on the ash of an impure thing: Abu Hanifa, some Malikis and one Hanbali view hold it pure because fire changes the substance, while the Shafi'is and most Malikis hold it impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} Most jurists forbid tayammum with ashes because they are not of the earth, while the Hanafis allow it when made from stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} The ash of a pure thing is property that may be sold; the ash of an impure thing is not a valuable property for those who hold it impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8986}"
  ur: "راکھ پاک چیز کی ہو تو پاک ہے؛ نجس چیز کی راکھ کی طہارت میں اختلاف ہے، اور راکھ سے تیمم جمہور کے نزدیک جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8985}"
