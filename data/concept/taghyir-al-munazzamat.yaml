id: concept/taghyir-al-munazzamat
class: concept
kind: term
label:
  ar: "تغيير المنظمات"
  en: "Organizational change"
  ur: "اداروں کی تبدیلی"
summary:
  ar: "تغيير المنظمات كما يلخصه طارق السويدان من كبار علماء الإدارة: التغيير تخطيطٌ زائد مقاومةٍ متوقعة وكيفية التغلب عليها؛ يُمارس في النجاح لا في الأزمة فقط، ويُنزَّل كبيراً مفاجئاً لا متدرجاً، ولا يكون فعالاً إلا بتغيير البشر وعقلياتهم."
  en: "Organizational change as Tareq al-Suwaidan distils it from leading management scholars: change is planning plus expected resistance and how to overcome it; it is practised in success, not only in crisis; it is brought down big and sudden rather than gradually; and it is effective only through changing people and their mindsets."
  ur: "اداروں کی تبدیلی جیسا کہ طارق السویدان بڑے انتظامی علما سے خلاصہ کرتے ہیں: تبدیلی منصوبہ بندی جمع متوقع مزاحمت اور اس پر قابو پانے کا طریقہ ہے؛ یہ صرف بحران میں نہیں بلکہ کامیابی میں بھی کی جاتی ہے؛ بڑی اور اچانک نافذ کی جاتی ہے نہ کہ بتدریج؛ اور مؤثر صرف لوگوں اور ان کی ذہنیت بدلنے سے ہوتی ہے۔"
