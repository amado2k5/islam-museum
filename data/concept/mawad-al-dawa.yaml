label: { ar: "مواد الدعوة في أوائل المدثر", en: "The substance of the call in the opening of al-Muddaththir" }
summary:
  ar: "ما يستخلصه الرحيق المختوم من أوامر أوائل سورة المدثر: أن الإنذار يقتضي يوماً للجزاء وحياة أخرى، وأن سائر الآيات تطلب التوحيد الصريح وتفويض الأمور إلى الله؛ فتتلخص مواد الدعوة في التوحيد والإيمان باليوم الآخر وتزكية النفس وتفويض الأمور إلى الله، وكل ذلك بعد الإيمان برسالة محمد."
  en: "What al-Raheeq al-Makhtum draws from the commands opening surat al-Muddaththir: warning implies a day of recompense and another life, and the remaining verses demand plain monotheism and entrusting all things to God; so the substance of the call is monotheism, belief in the Last Day, purification of the soul, entrusting affairs to God, all under belief in Muhammad's message."
