id: concept/mawad-al-dawa
class: concept
kind: doctrine
label: { ar: "مواد الدعوة في أوائل المدثر", en: "The substance of the call in the opening of al-Muddaththir", es: "El contenido del llamado en la apertura de al-Muddaththir", fr: "Le contenu de l'appel dans l'ouverture d'al-Muddaththir", ur: "المدثر کے آغاز میں اذان کا مادہ", tr: "Erken Mudatir'deki Da'wah Malzemeleri", id: "Bahan Da'wah pada Mudathir Awal" }
summary:
  ar: "ما يستخلصه الرحيق المختوم من أوامر أوائل سورة المدثر: أن الإنذار يقتضي يوماً للجزاء وحياة أخرى، وأن سائر الآيات تطلب التوحيد الصريح وتفويض الأمور إلى الله؛ فتتلخص مواد الدعوة في التوحيد والإيمان باليوم الآخر وتزكية النفس وتفويض الأمور إلى الله، وكل ذلك بعد الإيمان برسالة محمد."
  en: "What al-Raheeq al-Makhtum draws from the commands opening surat al-Muddaththir: warning implies a day of recompense and another life, and the remaining verses demand plain monotheism and entrusting all things to God; so the substance of the call is monotheism, belief in the Last Day, purification of the soul, entrusting affairs to God, all under belief in Muhammad's message."
  es: "Lo que al-Raheeq al-Makhtum extrae de los mandamientos que abren la sura al-Muddaththir es que la advertencia implica un día de recompensa y otra vida, y los versículos restantes exigen un monoteísmo claro y encomendar todas las cosas a Dios; por lo tanto, la esencia del llamado es el monoteísmo, la creencia en el Último Día, la purificación del alma, encomendar los asuntos a Dios, todo bajo la creencia en el mensaje de Muhammad."
  fr: "Ce que al-Raheeq al-Makhtum tire des commandements ouvrant la sourate al-Muddaththir: l’avertissement sous-entend un jour de rétribution et une autre vie, et les versets suivants exigent un monothéisme pur et simple et la remise de toutes choses à Dieu; ainsi, la substance de l’appel est le monothéisme, la croyance au Jour dernier, la purification de l’âme, la remise des affaires à Dieu, le tout sous la croyance au message de Muhammad."
  ur: "الرحیق المختم سورۃ المدثر کے آغاز کے احکام سے کیا اخذ کرتا ہے: تنبیہ کا مطلب بدلہ کا دن اور دوسری زندگی ہے، اور باقی آیات صریح توحید اور ہر چیز کو خدا کے سپرد کرنے کا مطالبہ کرتی ہیں۔ لہٰذا دعوت کا مادہ توحید ہے، یوم آخرت پر ایمان، تزکیہ نفس، معاملات کو خدا کے سپرد کرنا، یہ سب کچھ محمد کے پیغام پر ایمان کے تحت ہے۔"
  tr: "Mühürlü nektarın, Surah Sürehir'in ilk bölümlerindeki emirlerden çıkardığı şey, uyarının bir ödül günü ve başka bir yaşam anlamına geldiği, diğer tüm ayetlerin açık tek tanrıcılık ve işleri Allah'a emanet etmeyi çağırdığıdır; böylece çağrının özü tek tanrıcılık, Kıyamet Gününe inanç, ruhun arındırılması ve işleri Allah'a emanet etme olarak özetlenir; tüm bunlar Muhammed'in mesajına inandıktan sonra."
  id: "Apa yang diambil oleh nektar yang tersegel dari perintah dalam bab-bab awal Surah Al-Muddathir adalah bahwa peringatan berarti hari ganjaran dan kehidupan lain, dan semua ayat lain menyerukan monoteisme yang eksplisit dan mempercayakan urusan kepada Tuhan; dengan demikian, inti panggilan itu dirangkum sebagai monoteisme, iman pada Hari Terakhir, penyucian jiwa, dan mempercayakan urusan kepada Tuhan, semuanya setelah mempercayai pesan Muhammad."
