label:
  ar: "أرنب بري"
  en: "Arnab barri (wild rabbit, as a drug)"
  fr: "Arnab barri (lapin sauvage, comme remède)"
  ur: "خرگوش ⁦(جنگلی)⁩"
summary:
  ar: "أرنب بري: أنفحته تفعل ما تفعله سائر الأنفحات وأبلغ، ويذكر الكتاب دمه ورماد رأسه، وينفع من الصرع بخلّ، ومن السحج والإسهال المزمن بدمه مقلواً، ويذكر أن أنفحته تمنع الحبل، وهذا ما ورد فيه لا توصية به {cite:canon-ibn-sina-print-v1 p.371}."
  en: "Wild rabbit: its rennet does what rennet does, more finely; the book also lists its blood and the ash of its head. Its rennet with vinegar helps epilepsy, and its roasted blood helps excoriation and chronic diarrhoea. The book says the rennet prevents conception; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.371}."
  fr: "Lapin sauvage : sa présure accomplit les actions de la présure, plus finement ; le livre mentionne aussi son sang et la cendre de sa tête. Sa présure avec du vinaigre est bénéfique contre l’épilepsie, et son sang rôti contre l’excoriation et la diarrhée chronique. Le livre dit que la présure empêche la conception ; il s’agit d’une indication du livre, non d’une recommandation {cite:canon-ibn-sina-print-v1 p.371}."
  ur: "جنگلی خرگوش: اس کا انفحہ انفحہ کے سب کام زیادہ لطیف طریقے سے کرتا ہے؛ کتاب اس کا خون اور سر کی راکھ بھی بیان کرتی ہے۔ سرکے کے ساتھ اس کا انفحہ مرگی اور بھنا ہوا خون سحج اور دائمی اسہال میں مفید ہے۔ کتاب کے مطابق یہ انفحہ حمل روکتا ہے؛ یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.371}۔"
