summary:
  ar: "سريش في الكتاب نبات ينقل عن ديسقوريدوس أنه يتخذ منه السريش، له ورق كورق الكراث الشامي وساق أملس وعلى طرفه زهر يسمى أنباريقون وأصول طوال مستديرة، قوته حارة في الأولى، ينفع من الأورام والقروح والرأس والعين والصدر والسموم، وفي الكتاب نقل موسوم في البول والطمث {cite:canon-ibn-sina-print-v1 p.608}"
  en: "Sarish is in the book a plant from which, as reported from Dioscorides, the glue sarish is made, with a leaf like the Syrian leek, a smooth stem with a flower at its tip called anbariqun and long round roots; its power is hot in the first degree, and it is listed for swellings, ulcers, the head, the eye, the chest and poisons, with a labelled listing on urine and the menses {cite:canon-ibn-sina-print-v1 p.608}"
  ur: "سریش کتاب میں ایک پودا ہے جس سے، دیسقوریدوس کی نقل کے مطابق، سریش بنایا جاتا ہے؛ اس کا پتا شامی گندنے جیسا، تنا ہموار، اس کے سرے پر انباریقون نام کا پھول اور لمبی گول جڑیں ہیں؛ اس کی قوت پہلے درجے میں گرم ہے، اور ورموں، زخموں، سر، آنکھ، سینے اور زہروں کے لیے گنوایا گیا ہے، اور کتاب میں پیشاب اور حیض کے بارے میں ایک موسوم نقل ہے {cite:canon-ibn-sina-print-v1 p.608}۔"
  es: "En el libro, el sarish es una planta de la cual, según Dioscórides, se elabora el pegamento sarish, con una hoja parecida al puerro sirio, un tallo liso con una flor en su extremo llamada anbariqun y raíces largas y redondas; su poder es caliente en primer grado, y se menciona para hinchazones, úlceras, la cabeza, los ojos, el pecho y venenos, con una lista etiquetada para la orina y la menstruación {cite:canon-ibn-sina-print-v1 p.608}"
  fr: "Le sarish est décrit dans le livre comme une plante dont on tire, selon Dioscoride, la colle du même nom. Ses feuilles ressemblent à celles du poireau syrien, sa tige lisse porte à son extrémité une fleur appelée anbariqun, et ses racines sont longues et rondes. Ses propriétés sont de nature chaude au premier degré, et il est mentionné pour traiter les gonflements, les ulcères, les maux de tête, les affections oculaires et thoraciques, ainsi que les poisons. Une mention spécifique l'indique également pour ses usages urinaires et menstruels. {cite:canon-ibn-sina-print-v1 p.608}"
  tr: "Kitapta Sreish, Dioscorides'in sreish'ten türediği bildirilen bir bitkidir. Levant pırasa yaprağı gibi yapraklar, pürüzsüz bir sap ve ucunda Anbariqon adlı bir çiçeği ile uzun, yuvarlak kökleri vardır. Gücü ilkinde sıcaktır ve tümörlere, ülserlere, kafaya, gözlere, göğüs ve zehirlere karşı faydalıdır. Kitapta ayrıca idrar ve adet üzerine bir anlatı da yer alır {cite:canon-ibn-sina-print-v1 s.608}"
  id: "Sreish dalam buku ini adalah tanaman yang dilaporkan berasal dari sreish Dioscorides. Tanaman ini memiliki daun seperti daun bawang Levantine, batang halus, dan bunga bernama Anbariqon di ujungnya serta akar panjang dan bulat. Kekuatannya sangat panas pada tanaman pertama, dan berguna melawan tumor, borok, kepala, mata, dada, dan racun. Buku ini juga memuat narasi berjudul urin dan menstruasi {cite:canon-ibn-sina-print-v1 hlm.608}"
