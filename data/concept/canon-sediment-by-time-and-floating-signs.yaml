summary:
  ar: "يبين ابن سينا أن سرعة الرسوب بعد البول علامة نضج جيدة وبطأه علامة عدم نضج، وأن ظهور الطافي والمتعلق في أول المرض ثم دوامهما يدل على بحران بخراج، ويحذر من الطافي الدسومي الشبيه بنسج العنكبوت. {cite:canon-ibn-sina-print-v1 p.196}."
  en: "Ibn Sina says fast settling after voiding is a good sign of maturation and slow settling a sign of its lack; floating or hanging sediment at the start of illness that persists shows a crisis by abscess; and he warns against greasy floaters like cobwebs. {cite:canon-ibn-sina-print-v1 p.196}."
