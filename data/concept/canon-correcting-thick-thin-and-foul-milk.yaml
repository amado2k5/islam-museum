summary:
  ar: "إذا اضطر إلى لبن ليس بالصفة المحمودة دبر فيه من وجه السقي ومن علاج المرضعة: فالغليظ يلطف بالسكنجبين المطبوخ بالملطفات والرياضة، والرقيق يعالج بالترفيه وتغليظ الدم، والمبرد أو المسخن يغذى بما يضاده، والكريه الرائحة بالشراب الريحاني والأغذية الطيبة {cite:canon-ibn-sina-print-v1 pp.207-209}."
  en: "If one must use milk that lacks the praised qualities, it is managed through how it is given and through treating the nurse: thick milk is thinned with oxymel cooked with attenuating herbs and exercise, thin milk by rest and thickening the blood, hot or cold temperament by the opposite diet, and foul-smelling milk by scented wine and sweet-smelling food {cite:canon-ibn-sina-print-v1 pp.207-209}."
