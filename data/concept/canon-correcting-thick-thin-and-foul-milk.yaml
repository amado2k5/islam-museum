id: concept/canon-correcting-thick-thin-and-foul-milk
class: concept
kind: scientific
label:
  ar: "علاج غلظ اللبن ورقته ونتنه"
  en: "Correcting thick, thin and foul-smelling milk"
  fr: "Correction du lait épais, fluide ou malodorant"
  ur: "گاڑھے، پتلے اور بدبودار دودھ کی اصلاح"
  es: "Cómo corregir la leche espesa, líquida y maloliente."
summary:
  ar: "إذا اضطر إلى لبن ليس بالصفة المحمودة دبر فيه من وجه السقي ومن علاج المرضعة: فالغليظ يلطف بالسكنجبين المطبوخ بالملطفات والرياضة، والرقيق يعالج بالترفيه وتغليظ الدم، والمبرد أو المسخن يغذى بما يضاده، والكريه الرائحة بالشراب الريحاني والأغذية الطيبة {cite:canon-ibn-sina-print-v1 pp.207-209}."
  en: "If one must use milk that lacks the praised qualities, it is managed through how it is given and through treating the nurse: thick milk is thinned with oxymel cooked with attenuating herbs and exercise, thin milk by rest and thickening the blood, hot or cold temperament by the opposite diet, and foul-smelling milk by scented wine and sweet-smelling food {cite:canon-ibn-sina-print-v1 pp.207-209}."
  fr: "Si le lait ne présente pas les qualités souhaitées, le livre adapte administration et soins de la nourrice : lait épais, oxymel aux plantes fluidifiantes et exercice ; fluide, repos et épaississement du sang ; tempérament chaud ou froid, régime contraire ; malodorant, vin parfumé et aliments odorants {cite:canon-ibn-sina-print-v1 pp.207-209}."
  es: "Si uno debe usar leche que carece de las cualidades elogiadas, se maneja a través de la forma en que se administra y a través del trato a la nodriza: la leche espesa se diluye con oxímel cocinado con hierbas atenuantes y ejercicio, la leche aguada con descanso y espesamiento de la sangre, el temperamento caliente o frío con la dieta opuesta, y la leche maloliente con vino perfumado y alimentos de olor dulce {cite:canon-ibn-sina-print-v1 pp.207-209}."
