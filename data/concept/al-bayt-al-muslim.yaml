summary:
  ar: "البيت المسلم كما يعرضه الشيخ عمر عبد الكافي: حاله اليوم، والمودة والرحمة فيه، وأسراره وحرمة الخصوصية، والتجسس والظن، والأهل والضيافة، والرزق الحلال والصبر."
  en: "The Muslim home as Sheikh Omar Abdelkafy presents it: its state today, affection and mercy within it, its secrets and the sanctity of privacy, spying and suspicion, relatives and guests, and lawful provision and patience."
  fr: "Le foyer musulman tel que le présente le cheikh Omar Abdelkafy : son état actuel, l’affection et la miséricorde qui y règnent, ses secrets et le respect de l’intimité, l’espionnage et les soupçons, les proches et les invités, ainsi que la subsistance licite et la patience."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق مسلم گھر: آج اس کی حالت، اس میں محبت اور رحمت، اس کے راز اور رازداری کی حرمت، جاسوسی اور بدگمانی، رشتہ دار اور مہمان، اور حلال رزق اور صبر۔"
  es: "El hogar musulmán tal como lo presenta el jeque Omar Abdelkafy: su estado actual, el afecto y la misericordia que reinan en él, sus secretos y la santidad de la privacidad, el espionaje y la sospecha, los parientes y los invitados, y la provisión lícita y la paciencia."
