summary:
  ar: "يبين ابن سينا أن من أراد التسمين دخل الحمام بعد الطعام إن أمن السدد، ومن أراد التحليل والتهزيل استحم على الجوع وأكثر القعود فيه، ومن أراد حفظ الصحة فقط دخله بعد هضم ما في المعدة، ويوصي الحار المزاج بخبز منقوع في ماء الفاكهة أو ماء الورد {cite:canon-ibn-sina-print-v1 p.226}."
  en: "Ibn Sina says that someone who wants to fatten enters the bath after eating if he is safe from blockages, someone who wants dissolving and thinning bathes fasting and sits long in it, someone who only wants to keep health enters after the stomach has digested, and the hot-tempered, bilious person is advised bread soaked in fruit water or rose water {cite:canon-ibn-sina-print-v1 p.226}."
