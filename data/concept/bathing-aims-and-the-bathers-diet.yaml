id: concept/bathing-aims-and-the-bathers-diet
class: concept
kind: scientific
label:
  ar: "أغراض الاستحمام وتدبير المستحم عند ابن سينا"
  en: "The aims of bathing and the bather's diet in the Canon"
  fr: "Finalités du bain et alimentation du baigneur dans le Canon"
  ur: "قانون میں غسل کے مقاصد اور نہانے والے کی غذا"
  es: "Los objetivos del baño y la dieta del bañista en el Canon"
  tr: "İbn Sina'ya göre Banyo ve Banyo Yönetimi Amaçları"
  id: "Tujuan Mandi dan Pengelolaan Mandi Menurut Ibn Sina"
summary:
  ar: "يبين ابن سينا أن من أراد التسمين دخل الحمام بعد الطعام إن أمن السدد، ومن أراد التحليل والتهزيل استحم على الجوع وأكثر القعود فيه، ومن أراد حفظ الصحة فقط دخله بعد هضم ما في المعدة، ويوصي الحار المزاج بخبز منقوع في ماء الفاكهة أو ماء الورد {cite:canon-ibn-sina-print-v1 p.226}."
  en: "Ibn Sina says that someone who wants to fatten enters the bath after eating if he is safe from blockages, someone who wants dissolving and thinning bathes fasting and sits long in it, someone who only wants to keep health enters after the stomach has digested, and the hot-tempered, bilious person is advised bread soaked in fruit water or rose water {cite:canon-ibn-sina-print-v1 p.226}."
  fr: "Selon Ibn Sina, celui qui cherche à grossir entre au bain après manger s’il ne craint pas les obstructions ; celui qui recherche résolution et amaigrissement se baigne à jeun et reste longtemps ; celui qui veut seulement conserver la santé entre après la digestion gastrique. Aux tempéraments chauds et bilieux, il conseille du pain trempé dans une eau de fruits ou de rose {cite:canon-ibn-sina-print-v1 p.226}."
  es: "Ibn Sina dice que quien quiera engordar debe entrar al baño después de comer si no tiene obstrucciones, quien quiera disolver y adelgazar debe tomar baños en ayunas y permanecer mucho tiempo en ellos, quien solo quiera mantenerse sano debe entrar después de que el estómago haya digerido, y a la persona irascible y biliosa se le aconseja tomar pan remojado en agua de frutas o agua de rosas {cite:canon-ibn-sina-print-v1 p.226}."
  ur: "ابن سینا کہتے ہیں کہ جو شخص موٹا ہونا چاہتا ہو وہ کھانے کے بعد غسل میں داخل ہو اگر وہ رکاوٹوں سے محفوظ ہو، جو گلنا اور پتلا ہونا چاہتا ہو وہ روزہ رکھتا ہے اور اس میں لمبا بیٹھتا ہے، جو شخص صرف صحت رکھنا چاہتا ہے وہ معدہ ہضم ہونے کے بعد داخل ہوتا ہے، اور گرم مزاج آدمی کو مشورہ دیا جاتا ہے کہ وہ پھلوں کے پانی یا عرق گلاب میں بھگو کر روٹی کھائے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 226}۔"
  tr: "İbn Sina, kilo almak isteyenlerin yemekten sonra güvende oldukları sürece tuvalete girmeleri gerektiğini; kilo almak ve hafiflemek isteyenlerin açken yıkanıp çoğunlukla oturarak geçirmeleri, sağlığı korumak isteyenlerin ise ancak midede olanı sindirdikten sonra girmeleri gerektiğini açıklar. Çabuk sinirlenen kişi, meyve suyuna veya gül suyuna batırılmış ekmek önerir {cite:canon-ibn-sina-print-v1 s.226}."
  id: "Ibn Sina menjelaskan bahwa mereka yang ingin menambah berat badan harus masuk ke kamar mandi setelah makan jika aman untuk melakukannya; mereka yang ingin digemukkan dan diringankan harus mandi saat lapar dan menghabiskan sebagian besar waktu duduk; dan mereka yang ingin menjaga kesehatan hanya harus masuk setelah mencerna isi perut. Orang yang mudah marah merekomendasikan roti yang direndam dalam air buah atau air mawar {cite:canon-ibn-sina-print-v1 hlm.226}."
