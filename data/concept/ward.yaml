summary:
  ar: "الورد معروف، فيه حرافة وقبض ومرارة مع قليل حلاوة، ودهنه ومائه يُفيدان في الصداع والحرارة والعين والجراح، ويجفّف، وفيه منافع كثيرة للمعدة والكبد، ويُسهّل البطن إذا شُرب وزن من طريه. {cite:canon-ibn-sina-print-v1 p.451}"
  en: "The rose is well known; it has pungency, astringency and bitterness with a little sweetness; its oil and water help headache, heat, the eye and wounds; it dries; it has many uses for the stomach and liver; fresh rose, when taken, loosens the bowels. {cite:canon-ibn-sina-print-v1 p.451}"
  ur: "گلاب معروف ہے؛ اس میں تیزی، قبض اور کڑواہٹ کے ساتھ تھوڑی مٹھاس ہے؛ اس کا روغن اور پانی سر درد، گرمی، آنکھ اور زخموں میں مفید ہیں؛ یہ خشک کرتا ہے، معدے اور جگر کے لیے بہت فائدے رکھتا ہے، اور تازہ گلاب لینے سے پیٹ ڈھیلا ہوتا ہے۔ {cite:canon-ibn-sina-print-v1 p.451}"
  es: "La rosa es bien conocida; tiene un sabor picante, astringente y amargo con un ligero dulzor; su aceite y agua ayudan con el dolor de cabeza, el calor, los ojos y las heridas; seca; tiene muchos usos para el estómago y el hígado; la rosa fresca, al tomarse, facilita la evacuación intestinal. {cite:canon-ibn-sina-print-v1 p.451}"
  fr: "La rose est bien connue; elle possède une saveur piquante, astringente et amère, avec une légère douceur; son huile et son eau soulagent les maux de tête, la chaleur, les affections oculaires et les plaies; elle est asséchante; elle a de nombreux usages pour l’estomac et le foie; la rose fraîche, consommée, facilite le transit intestinal. {cite:canon-ibn-sina-print-v1 p.451}"
  tr: "Güller iyi bilinir; keskin, buruk ve hafif tatlı bir tada sahiptirler. Yağları ve suları baş ağrısı, ateş, göz rahatsızlıkları ve yaralar için faydalıdır. Ayrıca kurutucu özelliklere sahiptirler ve mide ve karaciğer için sayısız fayda sağlarlar. Bir kilo taze gül yaprağı içmek bağırsakları gevşetir. {cite:canon-ibn-sina-print-v1 s.451}"
  id: "Bunga mawar sangat terkenal; rasanya tajam, sepat, dan pahit dengan sedikit rasa manis. Minyak dan airnya bermanfaat untuk sakit kepala, demam, penyakit mata, dan luka. Bunga mawar juga memiliki sifat mengeringkan dan menawarkan banyak manfaat untuk lambung dan hati. Minum seteguk kelopak mawar segar dapat melancarkan buang air besar. {cite:canon-ibn-sina-print-v1 p.451}"
