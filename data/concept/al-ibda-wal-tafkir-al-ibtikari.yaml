id: concept/al-ibda-wal-tafkir-al-ibtikari
class: concept
kind: term
label:
  ar: "الإبداع والتفكير الابتكاري"
  en: "Creativity and innovative thinking (Tareq al-Suwaidan)"
  fr: "La créativité et la pensée innovante (Tareq al-Suwaidan)"
  ur: "تخلیقیت اور اختراعی سوچ"
  es: "Creatividad y pensamiento innovador (Tareq al-Suwaidan)"
  tr: "Yaratıcılık ve Yenilikçi Düşünce"
  id: "Kreativitas dan Pemikiran Inovatif"
summary:
  ar: "الإبداع كما يعلّمه طارق السويدان في أكاديمية إعداد القادة: تعريفه «عملية الإتيان بجديد»، والفرق بين التفكير الابتكاري والإبداع، والتفكير الجانبي، وصفات المبدع الثلاثون، و«آلة الإبداع» بمراحلها."
  en: "Creativity as Tareq al-Suwaidan teaches it in the Leaders' Academy: his definition, 'the process of bringing about something new', the difference between innovative thinking and creativity, lateral thinking, thirty traits of the creative person, and the stages of the 'creativity machine'."
  fr: "La créativité telle que Tareq al-Suwaidan l'enseigne à l'Académie des dirigeants : sa définition, « le processus qui consiste à faire advenir quelque chose de nouveau », la différence entre pensée innovante et créativité, la pensée latérale, trente traits de la personne créative et les étapes de la « machine à créativité »."
  ur: "تخلیقیت جیسا طارق السویدان قائدین کی اکیڈمی میں سکھاتے ہیں: ان کی تعریف «نئی چیز کو وجود میں لانے کا عمل»، اختراعی سوچ اور تخلیقیت کا فرق، جانبی سوچ، تخلیق کار کی تیس صفات، اور «تخلیق کی مشین» کے مراحل۔"
  es: "La creatividad tal como la enseña Tareq al-Suwaidan en la Academia de Líderes: su definición, \"el proceso de crear algo nuevo\", la diferencia entre pensamiento innovador y creatividad, el pensamiento lateral, treinta rasgos de la persona creativa y las etapas de la \"máquina de la creatividad\"."
  tr: "Tarek Al-Suwaidan tarafından Leaders Preparation Academy'de öğretilen yaratıcılık: 'yeni bir şey getirme süreci' tanımı, yenilikçi düşünce ile yaratıcılık arasındaki fark, çevresel düşünme, yaratıcı kişinin otuz özelliği ve aşamalarındaki 'yaratıcılık makinesi'."
  id: "Kreativitas yang diajarkan oleh Tarek Al-Suwaidan di Leaders Preparation Academy: definisi 'proses membawa sesuatu yang baru,' perbedaan antara berpikir inovatif dan kreativitas, berpikir lingkungan, tiga puluh sifat orang kreatif, dan 'mesin kreativitas' pada tahapnya."
