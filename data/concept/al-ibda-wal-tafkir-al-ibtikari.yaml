summary:
  ar: "الإبداع كما يعلّمه طارق السويدان في أكاديمية إعداد القادة: تعريفه «عملية الإتيان بجديد»، والفرق بين التفكير الابتكاري والإبداع، والتفكير الجانبي، وصفات المبدع الثلاثون، و«آلة الإبداع» بمراحلها."
  en: "Creativity as Tareq al-Suwaidan teaches it in the Leaders' Academy: his definition, 'the process of bringing about something new', the difference between innovative thinking and creativity, lateral thinking, thirty traits of the creative person, and the stages of the 'creativity machine'."
  ur: "تخلیقیت جیسا طارق السویدان قائدین کی اکیڈمی میں سکھاتے ہیں: ان کی تعریف «نئی چیز کو وجود میں لانے کا عمل»، اختراعی سوچ اور تخلیقیت کا فرق، جانبی سوچ، تخلیق کار کی تیس صفات، اور «تخلیق کی مشین» کے مراحل۔"
