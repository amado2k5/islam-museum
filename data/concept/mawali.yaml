id: concept/mawali
class: concept
kind: doctrine
label: { ar: "الموالي", en: "The mawali (clients)", es: "Los mawali (clientes)", fr: "Les mawali (clients)", ur: "موالی ⁦(گاہک)⁩" }
summary:
  ar: "عند البلاذري في سبي عين التمر نموذج للموالي: أسرى أعتقهم ساداتهم فصار ولاؤهم لهم — كحمران بن أبان الذي كان للمسيب بن نجبة فاشتراه عثمان فأعتقه فكان مولى عثمان، وسيرين وإخوته موالي أنس بن مالك، ويسار جد محمد بن إسحاق مولى قيس بن مخرمة بن المطلب، ونصير أبي موسى بن نصير مولى بني أمية، وأبي فروة جد الربيع بن يونس صاحب المنصور الذي ابتاعه ناعم الأسدي ثم ابتاعه عثمان لحفر القبور."
  en: "In al-Baladhuri's Ayn al-Tamr captives, the model of the mawali: captives freed by their patrons whose clientage then attached to them — as Humran ibn Aban, al-Musayyib ibn Najaba's man whom Uthman bought and freed to become Uthman's mawla; Sirin and his brothers, mawali of Anas ibn Malik; Yasar, grandfather of Muhammad ibn Ishaq, mawla of Qays ibn Makhrama ibn al-Muttalib; Nusayr, Musa ibn Nusayr's father, mawla of the Umayyads; and Abu Farwa, grandfather of al-Rabi' ibn Yunus al-Mansur's minister — bought by Na'im al-Asadi then by Uthman for grave-digging."
  es: "En los cautivos Ayn al-Tamr de al-Baladhuri, el modelo de los mawali: cautivos liberados por sus patrones cuyo clientelismo luego se unió a ellos, como Humran ibn Aban, el hombre de al-Musayyib ibn Najaba a quien Uthman compró y liberó para convertirse en su mawla; Sirin y sus hermanos, mawali de Anas ibn Malik; Yasar, abuelo de Muhammad ibn Ishaq, mawla de Qays ibn Makhrama ibn al-Muttalib; Nusayr, padre de Musa ibn Nusayr, mawla de los omeyas; y Abu Farwa, abuelo del ministro de al-Rabi' ibn Yunus al-Mansur, comprado por Na'im al-Asadi y luego por Uthman para cavar tumbas."
  fr: "Dans les captifs Ayn al-Tamr d'al-Baladhuri, le modèle du mawali: des captifs libérés par leurs clients dont la clientèle s'est alors attachée à eux — comme Humran ibn Aban, l'homme d'al-Musayyib ibn Najaba qu'Uthman a acheté et libéré pour devenir le mawla d'Uthman; Sirin et ses frères, mawali d'Anas ibn Malik; Yasar, grand-père de Muhammad ibn Ishaq, mawla de Qays ibn Makhrama ibn al-Muttalib; Nusayr, le père de Musa ibn Nusayr, mawla des Omeyyades; et Abu Farwa, grand-père du ministre d'al-Rabi' ibn Yunus al-Mansur — acheté par Na'im al-Asadi puis par Uthman pour creuser des tombes."
  ur: "البلادوری کی عین التمر اسیران میں، موالی کا نمونہ: اسیروں کو ان کے سرپرستوں کے ذریعے آزاد کیا گیا جن کا مؤکل پھر ان کے ساتھ منسلک تھا - جیسا کہ حمران ابن ابان، المسیب ابن نجابہ کا آدمی جسے عثمان نے خریدا اور عثمان کا مولا بننے کے لیے آزاد کیا؛ سیرین اور اس کے بھائی، انس بن مالک کے موالی؛ یسار، محمد بن اسحاق کے دادا، قیس بن مخرمہ ابن المطلب کے مولا؛ نصیر، موسیٰ بن نصیر کے والد، امویوں کے مولا؛ اور ابو فروا، الربیع ابن یونس المنصور کے وزیر کے دادا - جسے نعیم الاسدی نے پھر عثمان نے قبر کھودنے کے لیے خریدا۔"
