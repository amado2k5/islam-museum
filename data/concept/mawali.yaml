label: { ar: "الموالي", en: "The mawali (clients)" }
summary:
  ar: "عند البلاذري في سبي عين التمر نموذج للموالي: أسرى أعتقهم ساداتهم فصار ولاؤهم لهم — كحمران بن أبان الذي كان للمسيب بن نجبة فاشتراه عثمان فأعتقه فكان مولى عثمان، وسيرين وإخوته موالي أنس بن مالك، ويسار جد محمد بن إسحاق مولى قيس بن مخرمة بن المطلب، ونصير أبي موسى بن نصير مولى بني أمية، وأبي فروة جد الربيع بن يونس صاحب المنصور الذي ابتاعه ناعم الأسدي ثم ابتاعه عثمان لحفر القبور."
  en: "In al-Baladhuri's Ayn al-Tamr captives, the model of the mawali: captives freed by their patrons whose clientage then attached to them — as Humran ibn Aban, al-Musayyib ibn Najaba's man whom Uthman bought and freed to become Uthman's mawla; Sirin and his brothers, mawali of Anas ibn Malik; Yasar, grandfather of Muhammad ibn Ishaq, mawla of Qays ibn Makhrama ibn al-Muttalib; Nusayr, Musa ibn Nusayr's father, mawla of the Umayyads; and Abu Farwa, grandfather of al-Rabi' ibn Yunus al-Mansur's minister — bought by Na'im al-Asadi then by Uthman for grave-digging."
