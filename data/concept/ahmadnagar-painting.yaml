id: concept/ahmadnagar-painting
class: concept
kind: art_form
label: { ar: "تصوير أحمدنگر", en: "Ahmadnagar painting", fr: "La peinture d’Ahmadnagar", ur: "احمد نگر کی مصوری", es: "Pintura de Ahmadnagar" }
summary:
  ar: "أندر مدارس التصوير الدكني وأقصرها عمرًا، ازدهرت في عهود حسين نظام شاه الأول ومرتضى الأول وبرهان الثاني، ومن أقدم آثارها صور «تعريف حسين شاهي» سنة 1565م {cite:zebrowski-deccani-painting-1983 p. 16}."
  en: "The rarest and shortest-lived of the Deccani schools, flourishing under Husain Nizam Shah I, Murtaza I and Burhan II; among its earliest works are the illustrations of the Tarif-i Husain Shahi of 1565 {cite:zebrowski-deccani-painting-1983 p. 16}."
  fr: "La plus rare et la plus éphémère des écoles du Deccan s’épanouit sous Husain Nizam Shah Ier, Murtaza Ier et Burhan II. Parmi ses premières œuvres figurent les illustrations du Tarif-i Husain Shahi de 1565 {cite:zebrowski-deccani-painting-1983 p. 16}."
  ur: "دکنی مکاتب میں سب سے نادر اور مختصر، جو حسین نظام شاہ اول، مرتضیٰ اول اور برہان دوم کے دور میں پھلا؛ اس کے ابتدائی آثار میں 1565ء کی تعریفِ حسین شاہی کی تصاویر ہیں {cite:zebrowski-deccani-painting-1983 p. 16}۔"
  es: "La más rara y efímera de las escuelas del Decán, floreció bajo Husain Nizam Shah I, Murtaza I y Burhan II; entre sus primeras obras se encuentran las ilustraciones del Tarif-i Husain Shahi de 1565 {cite:zebrowski-deccani-painting-1983 p. 16}."
