label:
  ar: يوم النشور
  en: The Day of Spreading
  ur: یوم نشر
summary:
  ar: "يوم النشور في القرآن والسنة: اليوم الذي يُنشر فيه الناس من قبورهم ويُحشرون للحساب، يذكر أنه من أشراط الساعة، وأن الله ينشرهم كما ينشر من في الأرض، وأن فيه من الفزع ما لا يوصف."
  en: "The Day of Spreading in Qur'an and Sunnah: the day people are spread from their graves and gathered for reckoning — a sign of the Hour, when God spreads them as He spreads those on the earth, a day of indescribable terror."
  ur: "یوم نشر قرآن و سنت میں: وہ دن جب لوگ قبروں سے نکل کر بکھرے جاتے ہیں اور حساب کے لیے جمع کیے جاتے ہیں — ساعت کی نشانیوں میں سے، جب اللہ انہیں پھیلاتا ہے جیسے زمین کے لوگوں کو پھیلاتا ہے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا۔"
