id: concept/yaum-al-nushur
class: concept
kind: belief
label:
  ar: يوم النشور
  en: The Day of Spreading
  ur: یوم نشر
  es: "El Día de la Difusión"
  fr: "Le jour de la propagation"
  tr: "Kıyamet Günü"
  id: "Hari Kebangkitan"
summary:
  ar: "يوم النشور في القرآن والسنة: اليوم الذي يُنشر فيه الناس من قبورهم ويُحشرون للحساب، يذكر أنه من أشراط الساعة، وأن الله ينشرهم كما ينشر من في الأرض، وأن فيه من الفزع ما لا يوصف."
  en: "The Day of Spreading in Qur'an and Sunnah: the day people are spread from their graves and gathered for reckoning — a sign of the Hour, when God spreads them as He spreads those on the earth, a day of indescribable terror."
  ur: "یوم نشر قرآن و سنت میں: وہ دن جب لوگ قبروں سے نکل کر بکھرے جاتے ہیں اور حساب کے لیے جمع کیے جاتے ہیں — ساعت کی نشانیوں میں سے، جب اللہ انہیں پھیلاتا ہے جیسے زمین کے لوگوں کو پھیلاتا ہے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا۔"
  es: "El Día de la Extensión en el Corán y la Sunnah: el día en que las personas son extraídas de sus tumbas y reunidas para el juicio final, una señal de la Hora, cuando Dios las extienda como extiende a quienes están en la tierra, un día de terror indescriptible."
  fr: "Le Jour de la Dispersion dans le Coran et la Sunna: le jour où les gens sont sortis de leurs tombes et rassemblés pour le jugement dernier — un signe de l'Heure, où Dieu les disperse comme Il disperse ceux qui sont sur la terre, un jour d'une terreur indescriptible."
  tr: "Kur'an ve Sünnette Kıyamet Günü: İnsanların kabirlerinden diriltilip hesap için bir araya toplanacakları gündür. Bunun Kıyamet alametlerinden biri olduğu, Allah'ın onları yeryüzündekiler gibi dirilteceği ve bunda tarifsiz bir dehşet olduğu belirtilmiştir."
  id: "Hari Kiamat dalam Al-Qur'an dan Sunnah: Hari di mana manusia dibangkitkan dari kubur mereka dan dikumpulkan untuk penghakiman. Disebutkan bahwa hari itu adalah salah satu tanda-tanda Kiamat, dan bahwa Allah membangkitkan mereka sebagaimana Dia membangkitkan orang-orang di bumi, dan bahwa ada kengerian yang tak terlukiskan di dalamnya."
