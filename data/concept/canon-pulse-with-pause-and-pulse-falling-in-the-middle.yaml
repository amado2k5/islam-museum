id: concept/canon-pulse-with-pause-and-pulse-falling-in-the-middle
class: concept
kind: scientific
label:
  ar: "النبض ذو الفترة والواقع في الوسط والمتشنج عند ابن سينا"
  en: "The pause pulse, the inserted pulse and the spasmodic pulses in the Canon"
  fr: "Pouls à pause, intercalé et spasmodiques dans le Canon"
  ur: "وقفے والی، بیچ میں پڑنے والی اور تشنجی نبض قانون میں"
  es: "El pulso de pausa, el pulso insertado y los pulsos espasmódicos en el Canon"
  tr: "İbn Sina'ya göre ortada ve gerginde gerçekleşen periyodik nabız"
  id: "Denyut periodik yang terjadi di tengah dan waktu menurut Ibn Sina"
summary:
  ar: "يفرق ابن سينا بين الواقع في الوسط والغزالي، ثم يذكر المتشنج والمرتعش والمتوتر وما لا حصر له من مركبات النبض {cite:canon-ibn-sina-print-v1 p.173}."
  en: "Ibn Sina distinguishes the pulse that falls in the middle from the gazelle pulse, then names the spasmodic, the trembling and the taut, and the compounds that are almost without limit {cite:canon-ibn-sina-print-v1 p.173}."
  fr: "Ibn Sina distingue pouls intercalé et de gazelle, puis spasmodique, tremblant et tendu, et des composés presque sans limite {cite:canon-ibn-sina-print-v1 p.173}."
  es: "Ibn Sina distingue el pulso que cae en el medio del pulso de gacela, luego nombra el espasmódico, el tembloroso y el tenso, y los compuestos que son casi ilimitados {cite:canon-ibn-sina-print-v1 p.173}."
  ur: "ابن سینا بیچ میں پڑنے والی نبض کو غزال کی نبض سے ممتاز کرتا ہے، پھر اسپاسموڈیک، تھرمپنگ اور ٹاؤٹ اور ان مرکبات کا نام دیتا ہے جو تقریباً بغیر کسی حد کے ہوتے ہیں۔"
  tr: "İbn Sina, 'Al-Mawsa' ile Al-Ghazali'yi ayırır, ardından sarsılan, titreyen, gergin ve sayısız diğer dürtü bileşiklerinden bahseder {cite:canon-ibn-sina-print-v1 s.173}."
  id: "Ibn Sina membedakan antara 'Al-Mawsa' dan Al-Ghazali, lalu menyebutkan senyawa impuls yang bergetar, gemetar, tegang, dan tak terhitung lagi senapan impuls lainnya {cite:canon-ibn-sina-print-v1 hlm.173}."
