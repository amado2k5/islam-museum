label:
  ar: "الشَّجَر"
  en: "Shajar (trees and their rulings in sale, pre-emption, orchard contracts and the sacred enclosure)"
  es: "Shajar (árboles y sus normas en la venta, el derecho de tanteo, los contratos de huertos y el recinto sagrado)"
  fr: "Shajar (les arbres et leurs règles en matière de vente, de préemption, de contrats de vergers et d'enclos sacré)"
  ur: "شجر ⁦(درخت اور ان کے احکام برائے فروخت، قبل از وقت، باغات کے معاہدے اور مقدس دیوار)⁩"
  tr: "Ağaçlar"
  id: "Pohon-pohon"
summary:
  ar: "الشجر في اللغة النبات الذي له ساق، والكلأ ما ينبسط ولا ساق له، والزرع ما استنبت بالبذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} واتفق الفقهاء على تحريم قطع شجر الحرم، لحديث لا يختلى خلاها ولا يعضد شجرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} وتدخل الأشجار في بيع الأرض عند الحنفية والشافعية والمالكية إن كانت ثابتة، ولا شفعة في الشجر إن بيع مفردا عن الأرض، وتجوز المساقاة عليه عند الجمهور بجزء من ثمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9926} ويكره التخلي تحت الشجرة المثمرة عند الجمهور، ويحرم عند الحنابلة إذا كان عليها ثمرة مقصودة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9927}"
  en: "In language shajar is plant with a stem, while kala' is grass with no stem, and zar' is what is sown by seed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} The jurists agree that cutting or uprooting the trees of the sacred enclosure is forbidden, on the hadith that its grass is not cut and its trees are not felled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} Trees fixed in the ground pass with the sale of land for the Hanafis, Shafi'is and Malikis, while there is no pre-emption in trees sold apart from land, and orchard contracts for a share of fruit are allowed by most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9926} Relieving oneself under a fruit-bearing tree is disliked by most jurists, and forbidden by the Hanbalis when the tree bears fruit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9927}"
  es: "En el idioma shajar es planta con tallo, mientras que kala' es hierba sin tallo, y zar' es lo que se siembra por semilla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} Los juristas coinciden en que cortar o arrancar los árboles del recinto sagrado está prohibido, en el hadiz de que su hierba no se corta y sus árboles no se talan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} Los árboles fijados en el suelo se transmiten con la venta de tierras para los Hanafis, Shafi'is y Malikis, mientras que no hay derecho de preferencia sobre los árboles vendidos por separado, y los contratos de huertos para una parte de la fruta son permitidos por la mayoría de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9926} La mayoría de los juristas desaprueban hacer sus necesidades bajo un árbol frutal, y los hanbalíes lo prohíben cuando el árbol da fruto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9927}"
  fr: "En écriture, « shajar » désigne une plante à tige, « kala' » une herbe sans tige et « zar' » ce qui est semé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} Les juristes s'accordent à dire qu'il est interdit de couper ou de déraciner les arbres de l'enceinte sacrée, conformément au hadith selon lequel l'herbe n'y est ni coupée ni les arbres abattus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} Pour les écoles hanafite, chaféite et malikite, les arbres enracinés dans le sol sont transmis avec la vente du terrain. En revanche, il n'y a pas de préemption pour les arbres vendus séparément du terrain, et la plupart des juristes autorisent les contrats de verger prévoyant une part de la récolte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9926} La plupart des juristes désapprouvent le fait de se soulager sous un arbre fruitier, et les Hanbalites l'interdisent lorsque l'arbre porte des fruits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9927}"
  ur: "زبان میں شجر ایک تنا والا پودا ہے، جب کہ کالا وہ گھاس ہے جس میں تنا نہیں ہے، اور زر وہ ہے جو بیج کے ذریعے بویا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص9924} فقہائے کرام کا اتفاق ہے کہ حرم کے درختوں کو کاٹنا یا اکھاڑنا حرام ہے، حدیث میں ہے کہ اس کی گھاس نہیں کاٹی جاتی اور اس کے درخت نہیں کاٹے جاتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9924} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9925} زمین میں متعین درخت حنفیہ، شافعیہ اور مالکیوں کے لیے زمین کی فروخت کے ساتھ گزرتے ہیں، جب کہ زمین کے پہلے سے فروخت ہونے والے درخت یا حصہ کے لیے کوئی معاہدہ نہیں ہے۔ اکثر فقہاء نے پھل کی اجازت دی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9925} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9926} پھل دار درخت کے نیچے آرام کرنا اکثر فقہاء کے نزدیک ناپسندیدہ ہے، اور حنبلیوں نے اس کو حرام قرار دیا ہے جب درخت پھل دار ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 9927}"
  tr: "Dilde 'şar' saplı bir bitkidir, ot sapsız yayılan bitkidir ve ürün tohumla ekilen şeydir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9924} Hukukçular, haram ağaçlarının kesilmesinin yasaklanması konusunda oybirliğiyle hemfikirdir; çünkü bir hadis ne yaprak bırakır ne de ağaçları destekler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9925} Ağaçlar, Hanefi, Şafii ve Maliki okullarına göre arazi satışına dahildir, eğer ağaçlar topraktan ayrı satılırsa öncelik yoktur. Çoğunluğa göre, suyun meyvesinin bir kısmıyla birlikte satılmasına izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9926} Çoğunluk meyve veren ağacın altında bırakılmasını sevmez ve Hanbalilere göre, meyve vermek isteniyorsa yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9927}"
  id: "Dalam bahasa ini, 'shaar' adalah tanaman yang memiliki batang, dan rumput adalah tanaman yang tumbuh tanpa batang, dan tanaman adalah tanaman yang ditanam dengan biji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9924} Para ahli hukum telah sepakat bulat tentang larangan menebang pohon Haram, berdasarkan hadits yang tidak memotong atau menopang pohonnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9925} Pohon termasuk dalam penjualan tanah sesuai aliran Hanafi, Shafi'i, dan Maliki jika didirikan, dan tidak ada penghalang bagi pohon jika dijual terpisah dari tanah. Menurut mayoritas, diperbolehkan menjual air beserta sebagian buahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9926} Mayoritas tidak suka untuk dibiarkan di bawah pohon berbuah, dan menurut Hanbali, dilarang jika pohon itu berbuah yang dimaksud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9927}"
