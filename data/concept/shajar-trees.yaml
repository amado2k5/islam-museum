label:
  ar: "الشَّجَر"
  en: "Shajar (trees and their rulings in sale, pre-emption, orchard contracts and the sacred enclosure)"
summary:
  ar: "الشجر في اللغة النبات الذي له ساق، والكلأ ما ينبسط ولا ساق له، والزرع ما استنبت بالبذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} واتفق الفقهاء على تحريم قطع شجر الحرم، لحديث لا يختلى خلاها ولا يعضد شجرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} وتدخل الأشجار في بيع الأرض عند الحنفية والشافعية والمالكية إن كانت ثابتة، ولا شفعة في الشجر إن بيع مفردا عن الأرض، وتجوز المساقاة عليه عند الجمهور بجزء من ثمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9926} ويكره التخلي تحت الشجرة المثمرة عند الجمهور، ويحرم عند الحنابلة إذا كان عليها ثمرة مقصودة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9927}"
  en: "In language shajar is plant with a stem, while kala' is grass with no stem, and zar' is what is sown by seed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} The jurists agree that cutting or uprooting the trees of the sacred enclosure is forbidden, on the hadith that its grass is not cut and its trees are not felled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} Trees fixed in the ground pass with the sale of land for the Hanafis, Shafi'is and Malikis, while there is no pre-emption in trees sold apart from land, and orchard contracts for a share of fruit are allowed by most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9926} Relieving oneself under a fruit-bearing tree is disliked by most jurists, and forbidden by the Hanbalis when the tree bears fruit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9927}"
