id: concept/amir
class: concept
kind: term
label:
  ar: "أمير ⁦(عامل، حاكم، قائد)⁩"
  en: "Amir (commander, governor, prince in Islamic history)"
  fr: "Émir (commandant, gouverneur ou prince dans l’histoire islamique)"
  es: "Emir (comandante, gobernador, príncipe en la historia islámica)"
summary:
  ar: "أمير، لفظ إسلامي الأصل في معنى القائد والحاكم والأمير، ولم يرد في القرآن منه إلا «أولي الأمر»، وكان في عصر الخلافة في المدينة يُطلق على قادة الجيوش والولاة الذين كانوا قادة فتح في الأصل، ثم فصل الأمويون بين الشؤون الإدارية والمالية، وصار الأمير في الدولة العباسية موظفًا بيروقراطيًا يُعيّنه الخليفة، فتحولت الإمارة مع الزمن إلى أسر حاكمة مستقلة {cite:encyclopaedia-of-islam-2 vol. 1 p. 460-461}."
  en: "Amir, a term basically Islamic for commander, governor and prince. The Qur'an has only ulu l-amr, but amir occurs often in the traditions. In the Medinan caliphate army commanders and governors who had been conquering generals were called amirs. The Umayyads separated administrative and financial duties, and under the 'Abbasids the amir became a bureaucratic official appointed by the caliph, until the amirate turned into independent dynasties {cite:encyclopaedia-of-islam-2 vol. 1 p. 460-461}."
  fr: "Amir, ou émir, est à l’origine un terme islamique désignant un commandant, un gouverneur ou un prince. Le Coran ne connaît que l’expression ulu l-amr, mais amir revient souvent dans les traditions. Dans le califat de Médine, les commandants d’armée et les gouverneurs qui avaient été des généraux de la conquête portaient le titre d’émir. Les Omeyyades ont séparé les fonctions administratives des fonctions financières. Sous les Abbassides, l’émir est devenu un fonctionnaire nommé par le calife, jusqu’à ce que l’émirat donne naissance à des dynasties indépendantes {cite:encyclopaedia-of-islam-2 vol. 1 p. 460-461}."
  es: "Amir, término de origen islámico que significa comandante, gobernador y príncipe. El Corán solo menciona ulu l-amr, pero amir aparece con frecuencia en las tradiciones. En el califato de Medina, los comandantes y gobernadores que habían sido generales conquistadores eran llamados emires. Los omeyas separaron las funciones administrativas y financieras, y bajo los abasíes el amir se convirtió en un funcionario burocrático designado por el califa, hasta que el emirato se transformó en dinastías independientes {cite:encyclopaedia-of-islam-2 vol. 1 p. 460-461}."
