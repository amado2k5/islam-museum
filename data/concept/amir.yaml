label:
  ar: "أمير (عامل، حاكم، قائد)"
  en: "Amir (commander, governor, prince in Islamic history)"
summary:
  ar: "أمير، لفظ إسلامي الأصل في معنى القائد والحاكم والأمير، ولم يرد في القرآن منه إلا «أولي الأمر»، وكان في عصر الخلافة في المدينة يُطلق على قادة الجيوش والولاة الذين كانوا قادة فتح في الأصل، ثم فصل الأمويون بين الشؤون الإدارية والمالية، وصار الأمير في الدولة العباسية موظفًا بيروقراطيًا يُعيّنه الخليفة، فتحولت الإمارة مع الزمن إلى أسر حاكمة مستقلة {cite:encyclopaedia-of-islam-2 vol. 1 p. 460-461}."
  en: "Amir, a term basically Islamic for commander, governor and prince. The Qur'an has only ulu l-amr, but amir occurs often in the traditions. In the Medinan caliphate army commanders and governors who had been conquering generals were called amirs. The Umayyads separated administrative and financial duties, and under the 'Abbasids the amir became a bureaucratic official appointed by the caliph, until the amirate turned into independent dynasties {cite:encyclopaedia-of-islam-2 vol. 1 p. 460-461}."
