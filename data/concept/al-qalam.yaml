label:
  ar: القلم
  en: The Pen
  ur: قلم
summary:
  ar: "أول ما خلق الله القلم؛ قال له اكتب فجرى بما هو كائن إلى يوم القيامة؛ وبه أقسم الله في قوله ن والقلم وما يسطرون {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  en: "The first thing God created was the Pen; He said to it 'Write', and it flowed with all that will be until the Day of Resurrection — and by it God swore: Nun, and by the Pen and what they inscribe {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  ur: "اللہ نے سب سے پہلے قلم کو پیدا کیا؛ فرمایا لکھ، تو وہ قیامت تک ہونے والے ہر واقعہ لکھتا گیا؛ اور اللہ نے اس کی قسم کھائی: ن والقلم وما یسطرون {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}۔"
