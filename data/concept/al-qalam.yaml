id: concept/al-qalam
class: concept
kind: belief
label:
  ar: القلم
  en: The Pen
  fr: "Le Calame"
  ur: قلم
  es: "El bolígrafo"
  tr: "Kalem"
  id: "Pen"
summary:
  ar: "أول ما خلق الله القلم؛ قال له اكتب فجرى بما هو كائن إلى يوم القيامة؛ وبه أقسم الله في قوله ن والقلم وما يسطرون {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  en: "The first thing God created was the Pen; He said to it 'Write', and it flowed with all that will be until the Day of Resurrection — and by it God swore: Nun, and by the Pen and what they inscribe {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  fr: "La première chose que Dieu créa fut le Calame. Il lui ordonna d’écrire, et le Calame traça tout ce qui adviendrait jusqu’au Jour de la Résurrection. Dieu jura par le Calame et par ce que l’on écrit, dans le passage qui commence par Nûn {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  ur: "اللہ نے سب سے پہلے قلم کو پیدا کیا؛ فرمایا لکھ، تو وہ قیامت تک ہونے والے ہر واقعہ لکھتا گیا؛ اور اللہ نے اس کی قسم کھائی: ن والقلم وما یسطرون {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}۔"
  es: "Lo primero que Dios creó fue la Pluma; le dijo 'Escribe', y fluyó con todo lo que será hasta el Día de la Resurrección, y por ella Dios juró: Nun, y por la Pluma y lo que inscriben {cite:sunan-abi-dawud} {cite:jami-al-tirmidhi}."
  tr: "Tanrı'nın yarattığı ilk şey kalemdi; ona \"Yaz\" dedi ve kalem var olanla Diriliş gününe kadar devam etti; ve Tanrı, onunla yemin etti: \"Kalem ve onların yazdıklarıyla\" {alıntı:sunan-ebdavud} {alıntı:cemi-tirmidi}."
  id: "Hal pertama yang Tuhan ciptakan adalah pena; Dia berkata kepadanya, \"Tulislah,\" dan pena itu melanjutkan apa yang ada sampai Hari Kebangkitan; dan Tuhan bersumpah karenanya: \"Dengan pena dan apa yang mereka tulis\" {kutipan: Sunan-Abdavud} {kutipan: Jami-Tirmid}."
