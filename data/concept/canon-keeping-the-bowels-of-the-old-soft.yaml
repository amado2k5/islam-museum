id: concept/canon-keeping-the-bowels-of-the-old-soft
class: concept
kind: scientific
label:
  ar: "تليين طبيعة المشايخ بالحقنة والإسهال عند ابن سينا"
  en: "Keeping the bowels of the old soft by enema and mild purging in the Canon"
  fr: "Assouplir l’intestin des vieillards par lavement et purge douce dans le Canon"
  ur: "بزرگوں کی طبیعت نرم رکھنا حقنہ اور ہلکے اسہال سے قانون میں"
  es: "Mantener los intestinos del anciano blandos mediante enemas y purgas suaves en el Canon"
summary:
  ar: "يذكر ابن سينا ما يلين طبائع المشايخ من صمغ البطم ودواء لباب القرطم مع التين اليابس، ويوصي بالحقنة الدهنية خاصة بالزيت العذب لأنها تلين الأحشاء مع الاستفراغ، ويجتنب الحقن الحارة لأنها تجفف الأمعاء، ويفضل الإسهال المعتدل على الفصد في الكهول والمشايخ {cite:canon-ibn-sina-print-v1 pp.252-253}."
  en: "Ibn Sina names what softens the bowels of the old: terebinth gum and a remedy of safflower kernel with dried figs; he recommends the oily enema, especially sweet olive oil, since it softens the viscera as well as evacuating, avoids hot enemas which dry the intestines, and prefers moderate purging to venesection in the middle-aged and the old {cite:canon-ibn-sina-print-v1 pp.252-253}."
  fr: "Ibn Sina décrit gomme de térébinthe et amande de carthame aux figues sèches ; il recommande lavement huileux, surtout huile d’olive douce, assouplissant et évacuant, écarte les chauds desséchants et préfère purge modérée à saignée chez âge moyen et vieillesse {cite:canon-ibn-sina-print-v1 pp.252-253}."
  es: "Ibn Sina menciona lo que ablanda los intestinos de los ancianos: goma de terebinto y un remedio de semilla de cártamo con higos secos; recomienda el enema oleoso, especialmente aceite de oliva dulce, ya que ablanda las vísceras además de evacuarlas, evita los enemas calientes que resecan los intestinos y prefiere la purga moderada a la venesección en los ancianos de mediana edad y en los ancianos {cite:canon-ibn-sina-print-v1 pp.252-253}."
  ur: "ابن سینا ان چیزوں کے نام بتاتے ہیں جو بوڑھوں کی آنتوں کو نرم کرتی ہیں: ٹیری بنتھ گم اور خشک انجیر کے ساتھ زعفران کی دانا کا علاج؛ وہ تیل دار انیما، خاص طور پر میٹھے زیتون کے تیل کی سفارش کرتا ہے، کیونکہ یہ ویزرا کو نرم کرنے کے ساتھ ساتھ نکالنے کے ساتھ ساتھ، گرم انیما سے پرہیز کرتا ہے جو آنتوں کو خشک کر دیتے ہیں، اور درمیانی عمر اور بوڑھے میں رگ کو صاف کرنے کے لیے معتدل صاف کرنے کو ترجیح دیتے ہیں۔"
