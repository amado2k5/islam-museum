summary:
  ar: "يذكر ابن سينا ما يلين طبائع المشايخ من صمغ البطم ودواء لباب القرطم مع التين اليابس، ويوصي بالحقنة الدهنية خاصة بالزيت العذب لأنها تلين الأحشاء مع الاستفراغ، ويجتنب الحقن الحارة لأنها تجفف الأمعاء، ويفضل الإسهال المعتدل على الفصد في الكهول والمشايخ {cite:canon-ibn-sina-print-v1 pp.252-253}."
  en: "Ibn Sina names what softens the bowels of the old: terebinth gum and a remedy of safflower kernel with dried figs; he recommends the oily enema, especially sweet olive oil, since it softens the viscera as well as evacuating, avoids hot enemas which dry the intestines, and prefers moderate purging to venesection in the middle-aged and the old {cite:canon-ibn-sina-print-v1 pp.252-253}."
