id: concept/ilaj-thiqal-al-ras-wa-al-bayda-wa-al-khuda
class: concept
kind: scientific
label:
  ar: "علاج ثقل الرأس والصداع المعروف بالبيضة والخودة"
  en: "Heaviness of the head, and the headache known as bayda and khuda"
  ur: "سر کے بھاری پن اور بیضہ اور خودہ کے نام سے معروف صداع"
  es: "Pesadez en la cabeza y dolor de cabeza conocido como bayda y khuda."
  fr: "Sensation de lourdeur à la tête, et maux de tête connus sous le nom de bayda et khuda"
  tr: "Baş ağrısı, ağırlık ve yumurta ile yanak olarak bilinen baş ağrısı tedavisi"
  id: "Pengobatan sakit kepala berat dan sakit kepala yang dikenal sebagai telur dan pipi"
summary:
  ar: "يذكر ابن سينا ثقل الرأس وعلاجه، ثم الصداع المعروف بالبيضة والخودة: وصفه وأسبابه وموضع علته وخلاف الأطباء في اسمه، وأن المزمن منه يصير إلى مزاج البرد {cite:canon-ibn-sina-print-v2 pp.72-74}"
  en: "Ibn Sina treats heaviness of the head and then the headache known as bayda and khuda: its description, its causes, the place of its affliction and the physicians' disagreement about its name, and says that the chronic one turns to a cold temperament {cite:canon-ibn-sina-print-v2 pp.72-74}"
  ur: "ابن سینا سر کے بھاری پن اور اس کے علاج کا ذکر کرتا ہے، پھر بیضہ اور خودہ کے نام سے معروف صداع کا: اس کا بیان، اسباب، علت کا مقام اور اس کے نام میں اطبا کا اختلاف، اور بتاتا ہے کہ اس کا دائمی ہونا ٹھنڈے مزاج کی طرف جاتا ہے {cite:canon-ibn-sina-print-v2 pp.72-74}۔"
  es: "Ibn Sina trata la pesadez de cabeza y luego el dolor de cabeza conocido como bayda y khuda: su descripción, sus causas, el lugar donde se presenta y la discrepancia entre los médicos sobre su nombre, y dice que el caso crónico conduce a un temperamento frío {cite:canon-ibn-sina-print-v2 pp.72-74}"
  fr: "Ibn Sina traite la sensation de lourdeur dans la tête, puis le mal de tête connu sous le nom de bayda et khuda: sa description, ses causes, le lieu de son affection et le désaccord des médecins quant à son nom, et dit que le cas chronique conduit à un tempérament froid {cite:canon-ibn-sina-print-v2 pp.72-74}"
  tr: "İbn Sina, başın ağırlığını ve tedavisini, ardından yumurta ve çiğneme olarak bilinen baş ağrısını: tanımını, nedenlerini, hastalığının yerini ve doktorlar arasında ismiyle ilgili farklı görüşleri ve kronik vakaların soğuk bir ruh haline dönüştüğünü belirtir {cite:canon-ibn-sina-print-v2 s.72-74}"
  id: "Ibn Sina menyebutkan beratnya kepala dan pengobatannya, lalu sakit kepala yang dikenal sebagai telur dan kunyah: deskripsinya, penyebab, lokasi penyakitnya, dan perbedaan pendapat dokter mengenai namanya, dan bahwa kasus kronis berubah menjadi suasana hati dingin {cite:canon-ibn-sina-print-v2 hlm.72-74}"
