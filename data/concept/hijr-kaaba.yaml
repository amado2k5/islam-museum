label: { ar: "الحِجر", en: "The Hijr (Isma'il's enclosure)", ur: "حِجر (حجرِ اسماعیل)" }
summary:
  ar: "الحِجر القسم الخارج عن جدار الكعبة، وهو محوط مدوّر على شكل نصف دائرة، ويسمى حجر إسماعيل، وقيل الحطيم هو جداره أو ما بين الركن وزمزم والمقام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} وجمهور الفقهاء يرون أن ستة أذرع منه من البيت، استنادا إلى حديث عائشة في أن قريشا اقتصرت به حين بنت الكعبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} واختلفوا في جميعه: فالحنفية والحنابلة، وهو قول عند الشافعية، يرون أن جميعه من البيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} وفي الصلاة: الحنابلة وقول للمالكية يجيزون استقباله لمن كان خارجه، والحنفية والشافعية لا تصح الصلاة عندهم باستقباله لأن كونه من البيت مظنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} والطواف من داخله لا يصح عند جمهور الفقهاء، لأن الطواف يكون من خارج الحجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917}"
  en: "The Hijr is the curved enclosure beside the Ka'ba's wall, also called the enclosure of Isma'il; some call the Hatim its wall, or the space between the corner and Zamzam and the Station. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} The majority hold that six cubits of it belong to the House, on the report of Aisha that Quraysh left it out when they rebuilt the Ka'ba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} On whether the whole of it belongs to the House, the Hanafis and Hanbalis hold so, and so does one view of the Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} On prayer facing it, the Hanbalis and one Maliki view allow it for someone outside the enclosure; the Hanafis and Shafi'is disallow it, since its belonging to the House is only probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} The majority hold that circumambulation from inside the enclosure is not valid, since the circuit must pass outside it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917}"
