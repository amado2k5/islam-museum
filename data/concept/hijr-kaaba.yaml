label: { ar: "الحِجر", en: "The Hijr (Isma'il's enclosure)", ur: "حِجر ⁦(حجرِ اسماعیل)⁩", es: "El Hijr (recinto de Isma'il)", fr: "Le Hijr (l'enclos d'Ismaïl)" }
summary:
  ar: "الحِجر القسم الخارج عن جدار الكعبة، وهو محوط مدوّر على شكل نصف دائرة، ويسمى حجر إسماعيل، وقيل الحطيم هو جداره أو ما بين الركن وزمزم والمقام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} وجمهور الفقهاء يرون أن ستة أذرع منه من البيت، استنادا إلى حديث عائشة في أن قريشا اقتصرت به حين بنت الكعبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} واختلفوا في جميعه: فالحنفية والحنابلة، وهو قول عند الشافعية، يرون أن جميعه من البيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} وفي الصلاة: الحنابلة وقول للمالكية يجيزون استقباله لمن كان خارجه، والحنفية والشافعية لا تصح الصلاة عندهم باستقباله لأن كونه من البيت مظنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} والطواف من داخله لا يصح عند جمهور الفقهاء، لأن الطواف يكون من خارج الحجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917}"
  en: "The Hijr is the curved enclosure beside the Ka'ba's wall, also called the enclosure of Isma'il; some call the Hatim its wall, or the space between the corner and Zamzam and the Station. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} The majority hold that six cubits of it belong to the House, on the report of Aisha that Quraysh left it out when they rebuilt the Ka'ba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} On whether the whole of it belongs to the House, the Hanafis and Hanbalis hold so, and so does one view of the Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} On prayer facing it, the Hanbalis and one Maliki view allow it for someone outside the enclosure; the Hanafis and Shafi'is disallow it, since its belonging to the House is only probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} The majority hold that circumambulation from inside the enclosure is not valid, since the circuit must pass outside it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917}"
  es: "El Hijr es el recinto curvo junto al muro de la Kaaba, también llamado el recinto de Isma'il; algunos llaman al Hatim su muro, o el espacio entre la esquina y Zamzam y la Estación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} La mayoría sostiene que seis codos pertenecen a la Casa, en el relato de Aisha de que los Quraysh lo dejaron fuera cuando reconstruyeron la Kaaba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} Sobre si todo pertenece a la Casa, los Hanafi y los Hanbali sostienen que sí, y también una opinión de los Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} Sobre la oración frente a él, los Hanbali y una opinión Maliki lo permiten para alguien fuera del recinto; Los hanafíes y shafiíes lo desaprueban, ya que su pertenencia a la Casa es solo probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} La mayoría sostiene que la circunvalación desde dentro del recinto no es válida, puesto que el circuito debe pasar por fuera de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917}"
  fr: "Le Hijr est l'enceinte incurvée jouxtant le mur de la Kaaba, également appelée enceinte d'Ismaïl; certains l'appellent le Hatim, ou encore l'espace entre l'angle et Zamzam et la Station. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} La majorité considère que six coudées de cette enceinte appartiennent à la Maison, se basant sur le récit d'Aïcha selon lequel les Qurayshites l'auraient omise lors de la reconstruction de la Kaaba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6915} Quant à savoir si l'ensemble de l'enceinte appartient à la Maison, les écoles hanafite et hanbalite le soutiennent, de même qu'une opinion shafi'ite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} Concernant la prière face à l'enceinte, les écoles hanbalite et une opinion malikite l'autorisent pour une personne se trouvant à l'extérieur. Les hanafites et les chaféites le rejettent, car son appartenance à la Maison n'est que probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} La majorité considère que la circumambulation depuis l'intérieur de l'enceinte n'est pas valide, car le circuit doit passer par l'extérieur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6917}"
