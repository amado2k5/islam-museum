  en: "Humility (tawadu')"
  ur: "تواضع"
summary:
  ar: "التواضع في درس الشيخ عمر عبد الكافي أول أصول التقوى: ألا يحتقر المسلم أحدا، وأن يرى نفسه أقل من الأكبر سنا لأنهم عبدوا الله أطول، وأن يعرف عيوب نفسه قبل عيوب غيره. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:08:30}"
  en: "In Sheikh Omar Abdelkafy's lessons, humility is the first principle of taqwa: a believer does not look down on anyone, sees himself as lesser before an older person who has served God longer, and knows his own faults before others'. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:08:30}"
  ur: "شیخ عمر عبدالکافی کے درسوں میں تواضع تقویٰ کے اصولوں میں پہلا اصول ہے: مومن کسی کو حقیر نہ جانے، بڑی عمر کے شخص کے سامنے خود کو کمتر سمجھے کیونکہ اس نے اللہ کی عبادت زیادہ کی، اور دوسروں کی خامیوں سے پہلے اپنی خامیاں پہچانے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:08:30}"
