id: concept/nawm-fiqh
class: concept
kind: legal
label: { ar: "نَوْم", en: "Nawm (sleep: its rulings, its effect on ablution, worship and legal acts)" }
summary:
  ar: "النوم في أصل اللغة الهدوء والسكون، وهو استرخاء أعصاب الدماغ بسبب الأبخرة الصاعدة من المعدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} ويفترق عن النعاس، وهو بداية النوم، وعن السِّنة وهي فتور لا يفقد معه العقل، وعن الإغماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} والنوم مباح في الأصل، وقد يعتريه الوجوب إذا توقف عليه واجب، والاستحباب إذا نعس في الصلاة أو القراءة، والتحريم إذا نام بعد دخول وقت الصلاة واستغرق الوقت، وتُكره أحوال منها النوم بعد العصر والنوم بين مستيقظين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16669} ويُسنّ عند النوم إطفاء المصابيح وإيكاء السقاء وإغلاق الباب، وعند الاستيقاظ تلاوة الأذكار وغسل اليدين ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16671} والنوم ناقض للوضوء في الجملة عند عامة أهل العلم، واستدل الجمهور بحديث: العين وكاء السه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16672} وأقوال النائم لغو في التصرفات، فلا تنعقد عبادة ولا يقع طلاقه ولا يُقبل إقراره، ومن استثنى ما لا يحتاج إلى نية كالوقوف بعرفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16674} وفي الجناية يعتبر فعل النائم خطأً، وتجب فيه الدية على العاقلة والكفارة على النائم، وفي إتلاف المال يضمن النائم كالمستيقظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16676}"
  en: "Nawm in the lexical sense is calm and stillness; technically it is the relaxing of the brain's nerves through vapours rising from the stomach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} It differs from nu'as, the first stage of sleep, from sina, a drowsiness that does not take away reason, and from fainting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} Sleep is permitted in itself; it may be obligatory when a duty depends on it, recommended when one dozes in prayer or recitation, forbidden when one sleeps past the prayer time, and disliked in certain cases such as sleeping after the afternoon prayer or among the awake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16669} Before sleep one is recommended to put out lamps, close the water-skin and the door, and on waking to recite the prescribed formulas and wash the hands three times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16671} Sleep breaks the ablution in general, the majority relying on the saying 'the eyes are the binding of the buttocks'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16672} The speech of a sleeper is void in legal acts: his consecration, vow, oath, divorce and admission do not take effect, with the exception of standing at Arafat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16674} In injury, the sleeper's act is treated as an error, with the diya on his kin and expiation on him, and in destruction of property he is liable like the waking. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16676}"
