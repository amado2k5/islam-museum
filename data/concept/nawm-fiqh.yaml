label: { ar: "نَوْم", en: "Nawm (sleep: its rulings, its effect on ablution, worship and legal acts)", es: "Nawm (el sueño: sus normas, su efecto sobre la ablución, el culto y los actos legales)", fr: "Nawm (sommeil: ses règles, son effet sur l'ablution, le culte et les actes légaux)", ur: "نعم ⁦(نیند: اس کے احکام، وضو، عبادت اور شرعی عبادات پر اس کا اثر)⁩" }
summary:
  ar: "النوم في أصل اللغة الهدوء والسكون، وهو استرخاء أعصاب الدماغ بسبب الأبخرة الصاعدة من المعدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} ويفترق عن النعاس، وهو بداية النوم، وعن السِّنة وهي فتور لا يفقد معه العقل، وعن الإغماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} والنوم مباح في الأصل، وقد يعتريه الوجوب إذا توقف عليه واجب، والاستحباب إذا نعس في الصلاة أو القراءة، والتحريم إذا نام بعد دخول وقت الصلاة واستغرق الوقت، وتُكره أحوال منها النوم بعد العصر والنوم بين مستيقظين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16669} ويُسنّ عند النوم إطفاء المصابيح وإيكاء السقاء وإغلاق الباب، وعند الاستيقاظ تلاوة الأذكار وغسل اليدين ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16671} والنوم ناقض للوضوء في الجملة عند عامة أهل العلم، واستدل الجمهور بحديث: العين وكاء السه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16672} وأقوال النائم لغو في التصرفات، فلا تنعقد عبادة ولا يقع طلاقه ولا يُقبل إقراره، ومن استثنى ما لا يحتاج إلى نية كالوقوف بعرفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16674} وفي الجناية يعتبر فعل النائم خطأً، وتجب فيه الدية على العاقلة والكفارة على النائم، وفي إتلاف المال يضمن النائم كالمستيقظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16676}"
  en: "Nawm in the lexical sense is calm and stillness; technically it is the relaxing of the brain's nerves through vapours rising from the stomach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} It differs from nu'as, the first stage of sleep, from sina, a drowsiness that does not take away reason, and from fainting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} Sleep is permitted in itself; it may be obligatory when a duty depends on it, recommended when one dozes in prayer or recitation, forbidden when one sleeps past the prayer time, and disliked in certain cases such as sleeping after the afternoon prayer or among the awake. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16669} Before sleep one is recommended to put out lamps, close the water-skin and the door, and on waking to recite the prescribed formulas and wash the hands three times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16671} Sleep breaks the ablution in general, the majority relying on the saying 'the eyes are the binding of the buttocks'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16672} The speech of a sleeper is void in legal acts: his consecration, vow, oath, divorce and admission do not take effect, with the exception of standing at Arafat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16674} In injury, the sleeper's act is treated as an error, with the diya on his kin and expiation on him, and in destruction of property he is liable like the waking. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16676}"
  es: "Nawm en el sentido léxico es calma y quietud; técnicamente es la relajación de los nervios del cerebro a través de vapores que ascienden del estómago. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} Se diferencia de nu'as, la primera etapa del sueño, de sina, una somnolencia que no quita la razón, y del desmayo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} El sueño está permitido en sí mismo; puede ser obligatorio cuando un deber depende de él, recomendado cuando uno cabecea en la oración o recitación, prohibido cuando uno duerme después de la hora de la oración, y desaconsejable en ciertos casos como dormir después de la oración de la tarde o entre los despiertos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16669} Antes de dormir se recomienda apagar las lámparas, cerrar el odre de agua y la puerta, y al despertar recitar las fórmulas prescritas y lavarse las manos tres veces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16671} Dormir rompe la ablución en general, la mayoría confía en el dicho 'los ojos son la atadura de las nalgas'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16672} El discurso de un durmiente es nulo en los actos legales: su consagración, voto, juramento, divorcio y admisión no surten efecto, con la excepción de estar en Arafat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16674} En caso de daño, el acto del durmiente se considera un error, con la diya sobre sus parientes y la expiación sobre él, y en la destrucción de la propiedad es responsable como el despierto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16676}"
  fr: "Le terme « nawm », au sens littéral, désigne le calme et l'immobilité; techniquement, il s'agit de la relaxation des nerfs cérébraux par les vapeurs provenant de l'estomac. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} Il diffère du « nu'as », le premier stade du sommeil, du « sina », une somnolence qui n'altère pas la raison, et de l'évanouissement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} Le sommeil est permis en soi; il peut être obligatoire lorsqu'un devoir l'exige, recommandé lorsqu'on s'assoupit pendant la prière ou la récitation, interdit lorsqu'on dort après l'heure de la prière, et déconseillé dans certains cas, comme dormir après la prière de l'après-midi ou parmi les personnes éveillées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16669} Avant de dormir, il est recommandé d'éteindre les lampes, de fermer l'outre et la porte, et au réveil de réciter les formules prescrites et de se laver les mains trois fois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16671} Le sommeil annule généralement les ablutions, la plupart des gens se fiant à l'adage « les yeux sont le lien des fesses ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16672} La parole d'un dormeur est nulle dans les actes juridiques: sa consécration, son vœu, son serment, son divorce et son admission sont sans effet, à l'exception de la présence à Arafat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16674} En cas de préjudice, l'acte du dormeur est considéré comme une erreur, la peine incombant à ses proches et l'expiation à lui-même; en cas de destruction de biens, il est responsable au même titre que le dormeur éveillé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16676}"
  ur: "نعم لغوی معنوں میں سکون اور خاموشی ہے۔ تکنیکی طور پر یہ معدے سے اٹھنے والے بخارات کے ذریعے دماغ کے اعصاب کو آرام پہنچانا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16667} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16668} یہ نص سے مختلف ہے، نیند کا پہلا مرحلہ، سینا سے، ایسی غنودگی جو بے ہوشی کو دور نہیں کرتی، اور {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16668} نیند خود ہی جائز ہے۔ واجب ہو سکتا ہے جب فرض اس پر منحصر ہو، مستحب ہے جب نماز یا تلاوت میں اونگھ جائے، حرام ہے جب نماز کے وقت سے پہلے سو جائے، اور بعض صورتوں میں ناپسندیدہ ہو جیسے عصر کی نماز کے بعد یا جاگتے وقت۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص16668} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص16669} سونے سے پہلے چراغ جلانے، پانی کی جلد اور دروازہ بند کرنے اور بیدار ہونے پر تین مرتبہ ہاتھ باندھنے کا حکم ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16670} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16671} نیند سے وضو ٹوٹ جاتا ہے، اکثریت اس قول پر بھروسہ کرتی ہے کہ 'آنکھیں کولہوں کا بندھن ہیں'۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص16672} سونے والے کی بات شرعی عبادات میں باطل ہے: عرفات میں کھڑے ہونے کے علاوہ اس کی تقدیس، نذر، قسم، طلاق اور داخلہ نہیں ہوتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16673} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16674} چوٹ لگنے کی صورت میں سونے والے کے فعل کو خطا سمجھا جاتا ہے، اس کے لواحقین پر دیت اور اس پر کفارہ واجب الادا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ16675}"
