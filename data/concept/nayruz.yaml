label: { ar: "النيروز", en: "Nayruz" }
summary:
  ar: "أول يوم فرورديماه أول شهور الفرس عند المسعودي، وبينه وبين المهرجان مائة وأربعة وسبعون يوماً، ويكون فيه عندهم من السرور والأعياد ما ذكر {cite:muruj-al-dhahab p. 507}.، وعند ابن الجوزي وأمر المعتضد سنة 282هـ بإنشاء الكتب إلى العمال بترك افتتاح الخراج في النيروز الذي هو نيروز العجم وتأخير ذلك إلى اليوم الحادي عشر من حزيران فسمي ذلك النيروز المعتضدي وإنما أراد الترفيه على الناس والترفق بهم، وسببه على ما رووا أن المتوكل ركب في بعض متصيداته فرأى زرعاً خضراً فقيل له إن العجم قد استأذنوا في جمع الخراج والزرع بعد لم يحصد فأمر بتعيين النيروز فولى منجماً أمره فقتل المتوكل قبل استتمامه فلما ولي المعتضد كان أول هممه بعد قهر المتغلبين أمر الكبيسة فأخر النيروز إلى الحادي عشر من حزيران ليحرره {cite:muntazam-ibn-al-jawzi p. 153-154}"
  en: "The first day of Farwardinmah, head of the Persian year — one hundred and seventy-four days from the Mihragan — a festival of joy for the Persians {cite:muruj-al-dhahab p. 507}."
