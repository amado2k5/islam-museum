summary:
  ar: "أول يوم فرورديماه أول شهور الفرس عند المسعودي، وبينه وبين المهرجان مائة وأربعة وسبعون يوماً، ويكون فيه عندهم من السرور والأعياد ما ذكر {cite:muruj-al-dhahab p. 507}. وعند ابن الجوزي وأمر المعتضد سنة 282هـ بإنشاء الكتب إلى العمال بترك افتتاح الخراج في النيروز الذي هو نيروز العجم وتأخير ذلك إلى اليوم الحادي عشر من حزيران فسمي ذلك النيروز المعتضدي وإنما أراد الترفيه على الناس والترفق بهم، وسببه على ما رووا أن المتوكل ركب في بعض متصيداته فرأى زرعاً خضراً فقيل له إن العجم قد استأذنوا في جمع الخراج والزرع بعد لم يحصد فأمر بتعيين النيروز فولى منجماً أمره فقتل المتوكل قبل استتمامه فلما ولي المعتضد كان أول هممه بعد قهر المتغلبين أمر الكبيسة فأخر النيروز إلى الحادي عشر من حزيران ليحرره {cite:muntazam-ibn-al-jawzi p. 153-154}"
  en: "The first day of Farwardinmah, head of the Persian year — one hundred and seventy-four days from the Mihragan — a festival of joy for the Persians {cite:muruj-al-dhahab p. 507}."
  es: "El primer día de Farwardinmah, cabeza del año persa — ciento setenta y cuatro días después del Mihragan — una fiesta de alegría para los persas {cite:muruj-al-dhahab p. 507}."
  fr: "Le premier jour de Farwardinmah, début de l'année perse — cent soixante-quatorze jours après le Mihragan — une fête de joie pour les Perses {cite:muruj-al-dhahab p. 507}."
  ur: "فاروردیمہ کا پہلا دن، فارسی سال کا سربراہ - مہراگن سے ایک سو چوہتر دن - فارسیوں کے لئے خوشی کا تہوار {حوالہ: مروج الذہاب صفحہ. 507}۔"
  tr: "Farwurdi'nin ilk günü, el-Mes'udi'ye göre Perslerin ilk ayıdır ve onunla festival arasında yüz yetmiş dört gün sürer; bu süre zarfında sevinç ve festivaller yaşanır, belirtilen {atı:muruj-al-dhahab, s. 507}. İbn al-Jawzi'ye göre, 282 Hicri yılında, el-Mu'tadid işçilere Novruz'da (Acam Nowruz'da) kharaj açılmasını durdurmak ve onu on birinci Haziran'a kadar ertelemek için kitap kurulmasını emretti. Bu e-Mu'tadidi Nowruz olarak adlandırıldı, ancak insanları eğlendirmek ve onlara nazik davranmak amacıyla yapıldı. Rivayetlere göre, al-Mutawakkil bazı yollarında binerek yeşil bir ürün gördü. Arap olmayanların hasat öncesi kharaj ve ürünleri toplamak için izin istedikleri söylendi. Nowruz'un atanmasını emretti, bu yüzden bir madenci görevlendirdi ve al-Mutawakkil tamamlamadan öldürüldü. Al-Mu'tadid göreve geldiğinde, Babürleri yendikten sonra ilk endişesi artık yılı ilan etmekti, bu yüzden Nowruz'u kurtarmak için on bir Haziran'a erteledi {alıntı: Muntazam-ibn-al-jawzi, s. 153-154}"
  id: "Hari pertama Farwurdi, yang merupakan bulan pertama orang Persia menurut al-Mas'udi, dan antara dia dan festival adalah seratus tujuh puluh empat hari, di mana mereka menikmati sukacita dan festival seperti yang disebutkan {cite:muruj-al-dhahab, hlm. 507}. Menurut Ibn al-Jawzi, pada tahun 282 H, al-Mu'tadid memerintahkan pendirian buku bagi para pekerja agar menghentikan pembukaan kharaj di Nowruz, yaitu Ajam Nowruz, dan menundanya hingga tanggal sebelas Juni. Ini disebut al-Mu'tadidi Nowruz, tetapi ia bermaksud menghibur orang dan bersikap baik kepada mereka. Menurut cerita, al-Mutawakkil menunggang di beberapa jalurnya dan melihat tanaman hijau. Ia diberitahu bahwa orang non-Arab telah meminta izin untuk mengumpulkan kharaj dan hasil panen sebelum panen. Ia memerintahkan penunjukan Nowruz, sehingga ia menunjuk seorang penambang untuk mengelolanya, dan al-Mutawakkil dibunuh sebelum selesai. Ketika al-Mu'tadid menjabat, perhatian pertamanya setelah mengalahkan Mughali adalah mengeluarkan tahun kabisat, sehingga ia menunda Nowruz hingga tanggal sebelas Juni untuk membebaskannya {cite:Muntazam-ibn-al-jawzi, hlm. 153-154}"
