id: concept/marin-fiqh
class: concept
kind: legal
label:
  ar: "المَارِن"
  en: "Marin (the soft tip of the nose): washing, blood-money and retaliation"
  ur: "مارن (ناک کا نرم حصہ): دھونا، دیت اور قصاص"
summary:
  ar: "المارن في اللغة طرف الأنف أو ما لان منه، والمارن عند الفقهاء طرف الأنف أو ما لان منه، والأنف أعم منه اصطلاحاً، والوترة الحاجز بين المنخرين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13798}. واتفق الفقهاء على وجوب غسل ظاهر المارن في الوضوء، واختلفوا في باطنه: الحنفية يرون إيصال الماء إليه في الوضوء سنة وفي الغسل فرضاً، والمالكية سنة فيهما، والشافعية لا يجب إلا إن تنجس، والحنابلة يوجبون الاستنشاق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13798-13799}. وفي قطع المارن خطأ دية كاملة لحديث عمرو بن حزم، والجناية عمداً موجبة للقصاص عند الأئمة الأربعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13799-13800}. وذكر المالكية فرق أرنبة المارن علامة من علامات البلوغ، والشافعية لا يرونه كذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800}."
  en: "Marin, in lexicon, is the tip of the nose or its soft part; the jurists use the same sense. The nose in general is wider; the wutra (the septum between the nostrils) is part of the nose {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13798}. The jurists agree that the outer surface of the marin must be washed in ablution; they differ on the inside: the Hanafis hold reaching the water inside is sunna in ablution and obligatory in full ritual washing, the Malikis hold it sunna in both, the Shafi'is hold it obligatory only if the inside is soiled, and the Hanbalis require snuffing water in {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13798-13799}. For cutting off the marin by error, the full blood-money is due on the report of Amr ibn Hazm, and an intentional injury carries retaliation in the view of the four schools {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13799-13800}. The Malikis count the splitting of the marin's tip among the signs of puberty; the Shafi'is do not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800}."
  ur: "مارن لغت میں ناک کے سرے یا نرم حصے کو کہتے ہیں، فقہاء کے نزدیک بھی یہی ہے۔ ناک عام طور پر اس سے وسیع ہے، اور وترہ دونوں نتھنوں کے درمیان کا پردہ ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13798}۔ ظاہری مارن کا دھونا وضو میں واجب ہے، اور اندرونی حصے میں اختلاف ہے: حنفیہ کے نزدیک وضو میں پانی پہنچانا سنت اور غسل میں فرض ہے، مالکیہ کے نزدیک دونوں میں سنت، شافعیہ کے نزدیک نجاست لگی ہو تو واجب، اور حنابلہ استنشاق کو واجب کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13798-13799}۔ غلطی سے مارن کٹ جائے تو عمرو بن حزم کی روایت کی بنا پر پوری دیت ہے، اور عمداً جنایت پر چاروں ائمہ کے نزدیک قصاص ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13799-13800}۔ مالکیہ مارن کی نوک کا پھٹنا بلوغ کی علامات میں شمار کرتے ہیں، شافعیہ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800}۔"
