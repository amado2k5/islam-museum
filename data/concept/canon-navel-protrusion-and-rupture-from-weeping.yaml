summary:
  ar: "يذكر ابن سينا أن كثرة البكاء قد تحدث نتوءاً في السرة أو سبباً من أسباب الفتق، وعلاجه بسقي النانخواه بنبيذ، ثم بالقوابض الحارة مثل المر وقشور السرو معجونة ببياض البيض وتشد بخرقة كتان {cite:canon-ibn-sina-print-v1 p.217}."
  en: "Ibn Sina says much weeping may bring a protrusion at the navel or one of the causes of rupture, and treats it by giving nankhwah in nabidh, then with the hot astringents such as myrrh and cypress bark kneaded with egg white and bound with a linen cloth {cite:canon-ibn-sina-print-v1 p.217}."
