id: concept/canon-navel-protrusion-and-rupture-from-weeping
class: concept
kind: scientific
label:
  ar: "نتوء السرة والفتق وورم السرة عند ابن سينا"
  en: "Navel protrusion, rupture and swelling at the cord in the Canon"
  fr: "Protrusion ombilicale, rupture et gonflement du cordon dans le Canon"
  ur: "قانون میں ناف کا ابھار، فتق اور ناف کی سوجن"
  es: "Protrusión del ombligo, ruptura e hinchazón en el cordón espermático en el Canon"
summary:
  ar: "يذكر ابن سينا أن كثرة البكاء قد تحدث نتوءاً في السرة أو سبباً من أسباب الفتق، وعلاجه بسقي النانخواه بنبيذ، ثم بالقوابض الحارة مثل المر وقشور السرو معجونة ببياض البيض وتشد بخرقة كتان {cite:canon-ibn-sina-print-v1 p.217}."
  en: "Ibn Sina says much weeping may bring a protrusion at the navel or one of the causes of rupture, and treats it by giving nankhwah in nabidh, then with the hot astringents such as myrrh and cypress bark kneaded with egg white and bound with a linen cloth {cite:canon-ibn-sina-print-v1 p.217}."
  fr: "Ibn Sina attribue aux pleurs abondants protrusion ombilicale ou cause de rupture, et décrit nankhwah au nabidh puis astringents chauds, myrrhe et écorce de cyprès au blanc d’œuf, sous linge de lin {cite:canon-ibn-sina-print-v1 p.217}."
  es: "Ibn Sina dice que el llanto excesivo puede provocar una protuberancia en el ombligo o ser una de las causas de ruptura, y lo trata administrando nankhwah en nabidh, luego con astringentes calientes como mirra y corteza de ciprés amasada con clara de huevo y envuelta en un paño de lino {cite:canon-ibn-sina-print-v1 p.217}."
