summary:
  fr: "Al-Firdaws est la plus haute station du paradis, nommée dans al-Kahf et al-Muminun, où elle est associée au séjour des croyants justes et à leur héritage durable. {cite:tanzil-quran} Ibn Kathir la décrit comme le centre et la partie la plus noble du paradis. {cite:tafsir-ibn-kathir}"
  ar: "أعلى الجنة منزلة وأوسطها، سمّاها القرآن حيث قال: «إن الذين آمنوا وعملوا الصالحات كانت لهم جنات الفردوس نزلا»، وقال في وصف المؤمنين: «الذين يورثون الفردوس هم فيها خالدون». وفي الصحيح: «إذا سألتم الله فاسألوه الفردوس فإنه أوسط الجنة وأعلى الجنة، وفوقه عرش الرحمن، ومنه تفجر أنهار الجنة»."
  en: "The highest and middlemost part of Paradise, named in the Qur'an and described in the Sahih."
  ur: "جنت کا بلند ترین اور درمیانی مقام، قرآن میں مذکور ہے اور صحیح حدیث میں اس کی فضیلت بیان ہوئی ہے۔"
