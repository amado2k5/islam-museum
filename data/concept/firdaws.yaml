label:
  ar: "الفردوس"
  en: "Al-Firdaws"
  ur: "فردوس"
summary:
  ar: "أعلى الجنة منزلة وأوسطها، سمّاها القرآن حيث قال: «إن الذين آمنوا وعملوا الصالحات كانت لهم جنات الفردوس نزلا»، وقال في وصف المؤمنين: «الذين يورثون الفردوس هم فيها خالدون». وفي الصحيح: «إذا سألتم الله فاسألوه الفردوس فإنه أوسط الجنة وأعلى الجنة، وفوقه عرش الرحمن، ومنه تفجر أنهار الجنة»."
  en: "The highest and middlemost part of Paradise, named in the Qur'an where He says «the believers … who inherit al-Firdaws; they will abide therein» and «for those who believe and do righteousness, the gardens of al-Firdaws are a lodging». In the Sahih: «When you ask God, ask Him for al-Firdaws, for it is the middlemost and highest part of Paradise; above it is the Throne of the Merciful, and from it the rivers of Paradise spring»."
  ur: "جنت کا بلند ترین اور درمیانی مقام، قرآن نے اس کا نام لیا: «مومن … جو فردوس کے وارث ہوں گے، وہ اس میں ہمیشہ رہیں گے»۔ صحیح حدیث میں آیا ہے: «جب اللہ سے مانگو تو فردوس مانگو، کیونکہ وہ جنت کا درمیانی اور بلند ترین حصہ ہے، اس کے اوپر رحمن کا عرش ہے اور اسی سے جنت کی نہریں پھوٹتی ہیں»۔"
