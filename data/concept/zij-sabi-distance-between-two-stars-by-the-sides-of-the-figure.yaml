label: { ar: "بعد ما بين الكوكبين بأضلاع الشكل", en: "The distance between two stars by the sides of the figure", ur: "دو ستاروں کے درمیان فاصلہ شکل کے ضلعوں کے ذریعے", es: "La distancia entre dos estrellas a los lados de la figura" }
summary:
  ar: "يقرّر النص حالات عدة. إذا كان الكوكبان في طول واحد وأحدهما فقط في العرض فبعدهما هو العرض وحده. وإن كان لأحدهما عرض ولا عرض للآخر، كالشمس أو ما كان على نطاق البروج، أُخذ فرق الطول ضلعاً أول، ثم نصفه ووتره المنصّف في وتر تمام العرض مقسوماً على نصف القطر ثم قُوِّس الناتج ثم ضوعف فصار ضلعاً ثانياً، ثم يُؤلَّف من الوترين التامين ومن وتر العرض التام جذر يُقوَّس نصفه ويُضاعف فيكون بعد ما بين الكوكبين. {cite:zij-sabi-nallino-byblion pp.63-64}."
  en: "The text sets out several cases. If the two stars are at one longitude and only one has latitude, their distance is the latitude alone. If one has latitude and the other none, like the Sun or any star on the belt of the signs, the difference of longitude is taken as a first side, its half and half-chord are multiplied by the chord of the complement of the latitude and divided by the radius, the result is turned into an arc and doubled to make a second side, and from the two whole chords and the whole chord of the latitude a root is formed whose half is turned into an arc and doubled, which is the distance between the two stars. {cite:zij-sabi-nallino-byblion pp.63-64}."
  ur: "متن کئی صورتیں بیان کرتا ہے۔ اگر دونوں ستارے ایک ہی طول میں ہوں اور ان میں سے صرف ایک کا عرض ہو تو ان کا بعد اکیلا عرض ہے۔ اگر ایک کا عرض ہو اور دوسرے کا نہ ہو، جیسے سورج یا بروج کی پٹی پر کوئی ستارہ، تو طول کا فرق پہلا ضلع لیا جاتا ہے، اس کا نصف اور نصف وتر عرض کے تمام کے وتر سے ضرب ہو کر نصف قطر پر تقسیم ہوتا ہے، نتیجے کی قوس بنا کر اسے دوگنا کیا جاتا ہے تو دوسرا ضلع بنتا ہے، پھر دونوں تمام وتروں اور عرض کے تمام وتر سے ایک جذر بنایا جاتا ہے جس کے نصف کی قوس بنا کر دوگنا کیا جاتا ہے، اور وہی دونوں ستاروں کے درمیان بعد ہے۔ {cite:zij-sabi-nallino-byblion pp.63-64}۔"
  es: "El texto expone varios casos. Si las dos estrellas se encuentran en la misma longitud y solo una tiene latitud, su distancia es igual a la latitud. Si una tiene latitud y la otra no, como el Sol o cualquier estrella del cinturón de los signos, la diferencia de longitud se toma como primer lado, su mitad y la mitad de la cuerda se multiplican por la cuerda del complemento de la latitud y se dividen por el radio, el resultado se convierte en un arco y se duplica para formar un segundo lado, y a partir de las dos cuerdas completas y la cuerda completa de la latitud se forma una raíz cuya mitad se convierte en un arco y se duplica, que es la distancia entre las dos estrellas. {cite:zij-sabi-nallino-byblion pp.63-64}."
