id: concept/modern-alien-and-ufo-claims-in-islamic-discourse
class: concept
kind: term
label: { ar: "الكائنات الفضائية والأطباق الطائرة في الخطاب الإسلامي الحديث", en: "Aliens and UFOs in modern Islamic discourse", ur: "جدید اسلامی بیانیے میں خلائی مخلوق اور اڑن طشتریاں", es: "Extraterrestres y ovnis en el discurso islámico moderno", fr: "Les extraterrestres et les ovnis dans le discours islamique moderne" }
summary:
  ar: "سؤال الكائنات الفضائية صيغة حديثة لم تُطرح بهذه الصورة في المصادر الكلاسيكية؛ وقد قرأنا لكتّاب مسلمين معاصرين ثلاثة مواقف: أن الوحي لا يثبتها ولا ينفيها، وأن لا مانع شرعاً من وجود مخلوقات أخرى مع نفي قصص زيارتها للأرض، وأنها مسألة عقل لا عقيدة {cite:spahic-omer-islam-on-aliens-2020} {cite:islamonline-extraterrestrial-visits-2024} {cite:islamonline-life-on-other-planets-2024}."
  en: "The question of extraterrestrials is a modern framing not posed in this form in the classical sources; we read three positions from contemporary Muslim writers: that revelation neither affirms nor denies them, that nothing in the Shari'a forbids other creatures while stories of their visits are dismissed, and that it is a matter for reason, not creed {cite:spahic-omer-islam-on-aliens-2020} {cite:islamonline-extraterrestrial-visits-2024} {cite:islamonline-life-on-other-planets-2024}."
  ur: "خلائی مخلوق کا سوال ایک جدید صورت ہے جو کلاسیکی ماخذ میں اس شکل میں نہیں اٹھایا گیا؛ ہم نے معاصر مسلم لکھاریوں کے تین موقف پڑھے: وحی نہ اسے ثابت کرتی ہے نہ رد، شریعت میں دوسری مخلوقات سے کوئی مانع نہیں مگر ان کی زمین پر آمد کے قصے رد ہیں، اور یہ عقل کا مسئلہ ہے عقیدے کا نہیں {cite:spahic-omer-islam-on-aliens-2020} {cite:islamonline-extraterrestrial-visits-2024} {cite:islamonline-life-on-other-planets-2024}۔"
  es: "La cuestión de los extraterrestres es un planteamiento moderno que no se presenta de esta forma en las fuentes clásicas; leemos tres posturas de escritores musulmanes contemporáneos: que la revelación ni los afirma ni los niega, que nada en la Sharia prohíbe a otras criaturas mientras que las historias de sus visitas son descartadas, y que es una cuestión de razón, no de credo {cite:spahic-omer-islam-on-aliens-2020} {cite:islamonline-extraterrestrial-visits-2024} {cite:islamonline-life-on-other-planets-2024}."
  fr: "La question des extraterrestres est une formulation moderne qui n'est pas posée sous cette forme dans les sources classiques; nous lisons trois positions chez les auteurs musulmans contemporains: que la révélation ne les affirme ni ne les nie, que rien dans la Shari'a n'interdit d'autres créatures tandis que les récits de leurs visites sont rejetés, et que c'est une question de raison, non de croyance {cite:spahic-omer-islam-on-aliens-2020} {cite:islamonline-extraterrestrial-visits-2024} {cite:islamonline-life-on-other-planets-2024}."
