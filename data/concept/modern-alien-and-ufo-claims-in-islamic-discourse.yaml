id: concept/modern-alien-and-ufo-claims-in-islamic-discourse
class: concept
kind: term
label: { ar: "الكائنات الفضائية والأطباق الطائرة في الخطاب الإسلامي الحديث", en: "Aliens and UFOs in modern Islamic discourse", ur: "جدید اسلامی بیانیے میں خلائی مخلوق اور اڑن طشتریاں" }
summary:
  ar: "سؤال الكائنات الفضائية صيغة حديثة لم تُطرح بهذه الصورة في المصادر الكلاسيكية؛ وقد قرأنا لكتّاب مسلمين معاصرين ثلاثة مواقف: أن الوحي لا يثبتها ولا ينفيها، وأن لا مانع شرعاً من وجود مخلوقات أخرى مع نفي قصص زيارتها للأرض، وأنها مسألة عقل لا عقيدة {cite:spahic-omer-islam-on-aliens-2020} {cite:islamonline-extraterrestrial-visits-2024} {cite:islamonline-life-on-other-planets-2024}."
  en: "The question of extraterrestrials is a modern framing not posed in this form in the classical sources; we read three positions from contemporary Muslim writers: that revelation neither affirms nor denies them, that nothing in the Shari'a forbids other creatures while stories of their visits are dismissed, and that it is a matter for reason, not creed {cite:spahic-omer-islam-on-aliens-2020} {cite:islamonline-extraterrestrial-visits-2024} {cite:islamonline-life-on-other-planets-2024}."
  ur: "خلائی مخلوق کا سوال ایک جدید صورت ہے جو کلاسیکی ماخذ میں اس شکل میں نہیں اٹھایا گیا؛ ہم نے معاصر مسلم لکھاریوں کے تین موقف پڑھے: وحی نہ اسے ثابت کرتی ہے نہ رد، شریعت میں دوسری مخلوقات سے کوئی مانع نہیں مگر ان کی زمین پر آمد کے قصے رد ہیں، اور یہ عقل کا مسئلہ ہے عقیدے کا نہیں {cite:spahic-omer-islam-on-aliens-2020} {cite:islamonline-extraterrestrial-visits-2024} {cite:islamonline-life-on-other-planets-2024}۔"
