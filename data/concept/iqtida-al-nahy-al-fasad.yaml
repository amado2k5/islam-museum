id: concept/iqtida-al-nahy-al-fasad
class: concept
kind: legal
label:
  ar: "هل النهي يقتضي فساد المنهي عنه؟"
  en: "Does a prohibition entail the invalidity of what is prohibited?"
  ur: "کیا نہی منہی عنہ کے فساد کو مقتضی ہے؟"
term: { ar: "اقتضاء النهي الفساد", en: "iqtida' al-nahy al-fasad" }
summary:
  ar: "مسألة أصولية: إذا نهى الشارع عن بيع أو نكاح أو تصرف يفيد الأحكام، فهل يدل النهي على فساده، أي تخلّف أحكامه عنه؟ يعرض الغزالي في المستصفى ثلاثة أقوال: أن الجماهير يرونه يقتضي الفساد، وأن قوماً يفرّقون بين المنهي عنه لعينه ولغيره، ويختار هو أنه لا يقتضي الفساد، ويرد على أربع شبه للقائلين به. ويذكر محقق الكتاب أن الغزالي خالف في ذلك المشهور عن الشافعي. {cite:mustasfa-hafiz-v3 p.199} {cite:mustasfa-hafiz-v3 p.201} {cite:mustasfa-hafiz-v1 p.77} {cite:mustasfa-hafiz-v1 p.78}"
  en: "A question of legal theory: when the Lawgiver forbids a sale, a marriage or another act that produces legal effects, does the prohibition show that the act is invalid, that is, that its effects do not follow? Al-Ghazali in al-Mustasfa sets out three views: the great majority hold that it entails invalidity; some distinguish what is forbidden in itself from what is forbidden for something else; and he chooses the view that it does not entail invalidity, answering four arguments of its proponents. The book's editor notes that al-Ghazali here departs from al-Shafi'i's known position."
  ur: "اصولِ فقہ کا مسئلہ: جب شارع کسی بیع، نکاح یا احکام کا فائدہ دینے والے کسی تصرف سے منع کرے تو کیا نہی اس کے فساد، یعنی اس کے احکام کے مرتب نہ ہونے، پر دلالت کرتی ہے؟ غزالی المستصفیٰ میں تین اقوال ذکر کرتے ہیں: جمہور کے نزدیک یہ فساد کو مقتضی ہے؛ کچھ لوگ لعینہ اور لغیرہ منہی عنہ میں فرق کرتے ہیں؛ اور وہ خود یہ اختیار کرتے ہیں کہ فساد کو مقتضی نہیں، اور اس کے قائلین کے چار شبہات کا جواب دیتے ہیں۔ کتاب کے محقق بتاتے ہیں کہ اس میں غزالی نے امام شافعی کے مشہور قول کی مخالفت کی۔"
wings: [ideas]
themes: [development-of-law-theology-institutions]
regions: [global]
issue:
  ar: "هل يدل النهي عن العقد أو التصرف على فساده؟"
  en: "Does a prohibition of a contract or act show that it is invalid?"
  ur: "کیا عقد یا تصرف سے نہی اس کے فساد پر دلالت کرتی ہے؟"
perspectives:
  - tradition: sunni
    id: jamahir
    stance: { ar: "يقتضي الفساد", en: "It entails invalidity", ur: "فساد کو مقتضی ہے" }
    summary:
      ar: "الجماهير، كما يذكر الغزالي، يرون أن النهي يقتضي فساد المنهي عنه؛ وينقل المحقق في الحاشية أنه مذهب جماهير الفقهاء من الشافعية والحنفية والحنابلة وأهل الظاهر، وعن القرافي أنه مذهب المالكية. {cite:mustasfa-hafiz-v3 p.199}"
      en: "The great majority, as al-Ghazali says, hold that a prohibition entails the invalidity of what is forbidden; the editor notes that this is the view of most Shafi'i, Hanafi and Hanbali jurists and the Zahiris, and, from al-Qarafi, of the Malikis."
      ur: "جمہور، جیسا کہ غزالی کہتے ہیں، نہی کو منہی عنہ کے فساد کا مقتضی سمجھتے ہیں؛ محقق حاشیے میں نقل کرتے ہیں کہ یہ شافعیہ، حنفیہ، حنابلہ اور اہلِ ظاہر کے جمہور فقہاء کا مذہب ہے، اور قرافی سے کہ یہ مالکیہ کا مذہب ہے۔"
    sources: [source/mustasfa-hafiz-v3]
  - tradition: sunni
    id: li-aynihi
    stance: { ar: "يفسد إن كان النهي لعينه لا لغيره", en: "Invalid if forbidden in itself, not if for something else", ur: "اگر لعینہ ہو تو فاسد، لغیرہ ہو تو نہیں" }
    summary:
      ar: "قوم، كما يذكر الغزالي: إن كان النهي عنه لعينه دل على الفساد، وإن كان لغيره فلا. {cite:mustasfa-hafiz-v3 p.199}"
      en: "Some, as al-Ghazali says: if the act is forbidden in itself the prohibition shows invalidity; if for something else, it does not."
      ur: "کچھ لوگ، جیسا کہ غزالی کہتے ہیں: اگر نہی لعینہ ہو تو فساد پر دلالت کرتی ہے، اور لغیرہ ہو تو نہیں۔"
    sources: [source/mustasfa-hafiz-v3]
  - tradition: sunni-shafii
    id: ghazali
    stance: { ar: "المختار عند الغزالي: لا يقتضي الفساد", en: "Al-Ghazali's choice: it does not entail invalidity", ur: "غزالی کا مختار: فساد کو مقتضی نہیں" }
    summary:
      ar: "الغزالي: الفساد تخلّف الأحكام عن التصرف، والتحريم يضادّ الإيجاب والإباحة ولا يضادّ كون الفعل المحرّم سبباً للملك أو الحل، فلا يدل النهي على الفساد لا لغة ولا شرعاً إلا بدليل؛ وينقل المحقق أنه وافق في هذا جماعة كالقفال وإمام الحرمين وكثير من الحنفية وبعض المعتزلة، ويرى أن الغزالي فرض المسألة في المعاملات دون العبادات. {cite:mustasfa-hafiz-v3 p.199} {cite:mustasfa-hafiz-v3 p.200} {cite:mustasfa-hafiz-v3 p.201}"
      en: "Al-Ghazali: invalidity means that the effects do not follow from the act; prohibition contradicts obligation and permission but not the forbidden act's being a cause of ownership or lawfulness, so a prohibition shows invalidity neither by language nor by the law unless there is evidence; the editor notes that al-Qaffal, the Imam al-Haramayn, many Hanafis and some Mu'tazilis held the same, and that al-Ghazali framed the question for transactions, not acts of worship."
      ur: "غزالی: فساد کا مطلب ہے کہ تصرف پر احکام مرتب نہ ہوں؛ تحریم وجوب اور اباحت کے منافی ہے مگر حرام فعل کے ملک یا حلت کا سبب ہونے کے منافی نہیں، اس لیے نہی نہ لغت سے فساد پر دلالت کرتی ہے نہ شرع سے، جب تک کوئی دلیل نہ ہو؛ محقق نقل کرتے ہیں کہ قفال، امام الحرمین، بہت سے حنفیہ اور بعض معتزلہ کا یہی قول ہے، اور یہ کہ غزالی نے مسئلہ معاملات میں فرض کیا ہے، عبادات میں نہیں۔"
