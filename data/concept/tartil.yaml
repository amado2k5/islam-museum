summary:
  ar: "الترتيل تبيين حروف القراءة وإعطاؤها حقها؛ تبحث الموسوعة الفقهية الكويتية الترتيل والترسل ضمن أحكام التلاوة {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Tartil is the measured, distinct articulation of the recitation; the Kuwaiti Fiqh Encyclopedia treats tartil and tarsil among the rules of tilawa {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Tartil es la articulación mesurada y distinta de la recitación; la Enciclopedia Kuwaití de Fiqh trata el tartil y el tarsil entre las reglas de tilawa {cita:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Tartil est l'articulation mesurée et distincte de la récitation; l'Encyclopédie koweïtienne du Fiqh traite le tartil et le tarsil parmi les règles du tilawa {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "ترتیل تلاوت کا ناپا ہوا، الگ بیان ہے۔ کویتی فقہ انسائیکلو پیڈیا ترتیل اور ترسل کو تلوا کے قواعد میں شمار کرتا ہے۔"
  tr: "Tartil: Okuma mektuplarını netleştirmek ve hak ettiklerini bildirmek; Kuveyt Hukuk Ansiklopedisi, okuma ve okumayı okuma kuralları içinde inceler {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Tartil: Memperjelas huruf-huruf pembacaan dan memberikan haknya; Ensiklopedia Yurisprudensial Kuwait meneliti pembacaan dan pembacaan dalam aturan pembacaan {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
