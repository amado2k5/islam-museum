id: concept/amrad
class: concept
kind: ethical
label: { ar: "الأمرد", en: "Amrad (the beardless youth, and rulings on him)", fr: "Amrad (le jeune imberbe, et les statuts qui le concernent)", es: "Amrad (el joven imberbe y las resoluciones sobre él)", ur: "عماد ⁦(داڑھی کے بغیر نوجوان، اور اس کے احکام)⁩", tr: "El-Amrid", id: "El-Amrid" }
summary:
  ar: "الأمرد من لم تنبت لحيته ولم يصل إلى أوان إنباتها في غالب الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391} وأحكامه تتعلق بالنظر والخلوة والمصافحة وانتقاض الوضوء بمسه وإمامته، والأصل أن كل ما كان سببا للفتنة فلا يجوز، إذا لم يعارضه مصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3392}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}"
  en: "Amrad is a youth whose beard has not grown and who has not reached the age when it usually appears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391} The rulings on him concern looking, being alone, shaking hands, whether touching breaks ablution, and leading prayer. The rule is that whatever causes temptation is forbidden unless a public interest outweighs it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3392}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}"
  fr: "L’amrad est un jeune homme dont la barbe n’a pas poussé et qui n’a pas atteint l’âge où elle apparaît habituellement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391} Les statuts qui le concernent portent sur le regard, l’isolement, la poignée de main, la question de savoir si son contact rompt les ablutions, et la direction de la prière. La règle est que tout ce qui cause la tentation est interdit, sauf si un intérêt public l’emporte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3392}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}"
  es: "Amrad es un joven al que no le ha crecido la barba y que aún no ha alcanzado la edad en que suele aparecer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391} Las normas sobre él se refieren a mirar, estar solo, estrechar la mano, si el contacto físico anula la ablución y dirigir la oración. La regla es que todo aquello que cause tentación está prohibido a menos que un interés público lo supere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3392}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}"
  ur: "عماد وہ نوجوان ہے جس کی داڑھی نہیں بڑھی ہے اور جو عام طور پر ظاہر ہونے کی عمر کو نہیں پہنچا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص3391} اس کے احکام دیکھنا، تنہا ہونا، مصافحہ کرنا، چھونے سے وضو ٹوٹ جاتا ہے یا نہیں، اور نماز پڑھانے کا حکم ہے۔ قاعدہ یہ ہے کہ جو چیز فتنہ کا باعث ہو وہ حرام ہے جب تک کہ مفاد عامہ اس سے زیادہ نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3391}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3392}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3393}"
  tr: "Fail, çoğu insanda sakalı uzamayan ve büyüme zamanına ulaşmamış kişidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3391} Hükümleri bakma, inziva, el sıkışma, dua dokunarak ve yönlendirerek abdest almanın geçersiz kılınmasıyla ilgilidir. Temel ilke, baştan çıkarma yaratan hiçbir şeyin, iyi bir sebeple karşı çıkmadıkça izin verilemeyeceğidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3392}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3393}"
  id: "Fail, çoğu insanda sakalı uzamayan ve büyüme zamanına ulaşmamış kişidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3391} Hükümleri bakma, inziva, el sıkışma, dua dokunarak ve yönlendirerek abdest almanın geçersiz kılınmasıyla ilgilidir. Temel ilke, baştan çıkarma yaratan hiçbir şeyin, iyi bir sebeple karşı çıkmadıkça izin verilemeyeceğidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3392}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3393}"
