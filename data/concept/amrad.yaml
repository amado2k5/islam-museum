label: { ar: "الأمرد", en: "Amrad (the beardless youth, and rulings on him)" }
summary:
  ar: "الأمرد من لم تنبت لحيته ولم يصل إلى أوان إنباتها في غالب الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391} وأحكامه تتعلق بالنظر والخلوة والمصافحة وانتقاض الوضوء بمسه وإمامته، والأصل أن كل ما كان سببا للفتنة فلا يجوز، إذا لم يعارضه مصلحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3392}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}"
  en: "Amrad is a youth whose beard has not grown and who has not reached the age when it usually appears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391} The rulings on him concern looking, being alone, shaking hands, whether touching breaks ablution, and leading prayer. The rule is that whatever causes temptation is forbidden unless a public interest outweighs it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3391}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3392}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3393}"
