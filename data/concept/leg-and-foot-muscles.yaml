id: concept/leg-and-foot-muscles
class: concept
kind: scientific
label: { ar: "عضل الساق والركبة والقدم والأصابع عند ابن سينا", en: "Muscles of the shank, knee, foot and toes in the Canon", ur: "قانون میں پنڈلی، گھٹنے، پاؤں اور انگلیوں کے پٹھے", es: "Músculos de la pierna, rodilla, pie y dedos del pie en el Canon", fr: "Muscles de la jambe, du genou, du pied et des orteils dans le canon" }
summary:
  ar: "يعدّ ابن سينا لمفصل الركبة ثلاثة باسطة أمام الفخذ وعضلاً قابضة، ولمفصل القدم عضلاً مشيلة وخافضة، ثم لأصابع الرجل عضلاً كثيرة، ويختم الجملة بأن جميع عضل البدن خمسمائة وتسع وعشرون عضلة {cite:canon-ibn-sina-print-v1 pp.75-77}."
  en: "For the knee Ibn Sina lists three straightening muscles in front of the thigh and bending muscles; for the ankle, lifting and lowering muscles; and for the toes many muscles; he closes the group by saying the muscles of the whole body number five hundred and twenty-nine {cite:canon-ibn-sina-print-v1 pp.75-77}."
  es: "Para la rodilla, Ibn Sina enumera tres músculos extensores en la parte delantera del muslo y músculos flexionadores; para el tobillo, músculos elevadores y descendentes; y para los dedos de los pies, muchos músculos; cierra el grupo diciendo que los músculos de todo el cuerpo son quinientos veintinueve {cite:canon-ibn-sina-print-v1 pp.75-77}."
  fr: "Pour le genou, Ibn Sina énumère trois muscles redresseurs à l'avant de la cuisse et des muscles fléchisseurs; pour la cheville, des muscles levants et abaissants; et pour les orteils, de nombreux muscles; il termine le groupe en disant que les muscles de tout le corps sont au nombre de cinq cent vingt-neuf {cite:canon-ibn-sina-print-v1 pp.75-77}."
  ur: "گھٹنے کے لیے ابن سینا ران کے سامنے تین سیدھے پٹھوں اور جھکنے والے پٹھوں کی فہرست دیتا ہے۔ ٹخنوں، اٹھانے اور کم کرنے کے پٹھوں کے لیے؛ اور انگلیوں کے لیے بہت سے عضلات؛ وہ پورے جسم کے عضلات نمبر پانچ سو انتیس کہہ کر گروپ کو بند کرتا ہے"
