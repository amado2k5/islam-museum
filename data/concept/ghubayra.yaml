summary:
  ar: "غبيراء في الكتاب بارد في أول الأولى يابس في آخر الثانية، يحبس كل سيلان وهو أقل قبضا وعقلا من الزعرور، يقمع الصفراء المنصبة إلى الأحشاء، وإذا تنقل به أبطأ السكر، وينفع من السعال الحار ويحبس القيء ومن السحج الصفراوي ويحبس البطن {cite:canon-ibn-sina-print-v1 pp.722-723}"
  en: "Ghubayra' is in the book cold at the start of the first degree and dry at the end of the second; it halts every flow and is less astringent and binding than za'rur, it suppresses bile pouring into the viscera, when taken as a dessert it slows intoxication, and it benefits hot cough, stops vomiting, benefits bilious dysentery and binds the belly {cite:canon-ibn-sina-print-v1 pp.722-723}"
  ur: "غبیراء کتاب میں پہلے درجے کے آغاز میں ٹھنڈی اور دوسرے کے آخر میں خشک ہے؛ ہر بہاؤ کو روکتی ہے اور زعرور سے کم قابض اور روکنے والی ہے، احشا کی طرف گرنے والے صفرا کو دباتی ہے، نقل کے طور پر لی جائے تو نشے کو سست کرتی ہے، اور گرم کھانسی میں نافع ہے، قے کو روکتی ہے، صفراوی خراش میں نافع ہے اور پیٹ کو باندھتی ہے {cite:canon-ibn-sina-print-v1 pp.722-723}۔"
  es: "En el libro, Ghubayra' es frío al comienzo del primer grado y seco al final del segundo; detiene todo flujo y es menos astringente y restrictivo que za'rur, suprime el vertido de bilis en las vísceras, cuando se toma como postre ralentiza la intoxicación, y beneficia la tos caliente, detiene los vómitos, beneficia la disentería biliar y astringe el estómago {cite:canon-ibn-sina-print-v1 pp.722-723}"
  fr: "Le ghubayra est décrit dans le livre comme froid au début du premier degré et sec à la fin du second; il arrête tout écoulement et est moins astringent et constipant que le za'rur, il supprime le déversement de bile dans les viscères, pris en dessert il ralentit l'intoxication, et il est bénéfique pour la toux chaude, arrête les vomissements, est bénéfique pour la dysenterie bilieuse et constipe l'estomac {cite:canon-ibn-sina-print-v1 pp.722-723}"
