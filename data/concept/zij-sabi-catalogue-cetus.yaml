summary:
  ar: "يذكر الفهرس صورة قيطس، ويصفه في عنوان القسم بأنه تبيع البحر، ثم يعدّ كواكبه بالترتيب، وتقع مواضعها في جدول يُكتب فيه الطول والعرض. {cite:zij-sabi-nallino-byblion pp.266}"
  en: "The catalogue names the figure of Qaytus, Cetus, and in the heading of its section calls it the follower of the sea. Its stars are then listed in order, with their positions in a table. {cite:zij-sabi-nallino-byblion pp.266}"
  ur: "فہرست قیطس کی صورت کا ذکر کرتی ہے اور اس کے حصے کے عنوان میں اسے سمندر کا تابع کہتی ہے۔ اس کے ستارے ترتیب سے درج ہیں اور مواضع جدول میں ہیں۔ {cite:zij-sabi-nallino-byblion pp.266}"
  es: "El catálogo nombra a la figura de Qaytus como Cetus, y en el encabezado de su sección la denomina «la seguidora del mar». Sus estrellas se enumeran a continuación en orden, con sus posiciones en una tabla. {cite:zij-sabi-nallino-byblion pp.266}"
  fr: "Le catalogue nomme la figure de Qaytus, Cetus, et dans l'intitulé de sa section, la désigne comme le suiveur de la mer. Ses étoiles sont ensuite énumérées par ordre, avec leur position dans un tableau. {cite:zij-sabi-nallino-byblion pp.266}"
  tr: "Dizin, Cetus takımyıldızının görüntüsünden bahseder ve bölüm başlığında onu \"deniz bekçisi\" olarak tanımlar, ardından gezegenlerini sırayla listeler ve enlem ve boylamlarını içeren bir tabloda konumlarını belirtir. {cite:zij-sabi-nallino-byblion pp.266}"
  id: "Indeks tersebut menyebutkan gambar Cetus, menggambarkannya dalam judul bagian sebagai \"penjaga laut,\" kemudian mencantumkan planet-planetnya secara berurutan, posisi mereka tercantum dalam tabel yang mencakup garis lintang dan garis bujur. {cite:zij-sabi-nallino-byblion pp.266}"
