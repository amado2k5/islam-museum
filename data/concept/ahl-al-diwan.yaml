label: { ar: "أهل الديوان", en: "Ahl al-Diwan (those paid from the state register of soldiers and officers, and the rules of their conditions and distribution)" }
summary:
  ar: "الديوان لفظ فارسي معرب، معناه مجتمع الصحف والكتاب، ويكتب فيه أهل الجيش وأهل العطية، ويراد به عند الفقهاء الدفتر الذي تثبت فيه أسماء العاملين في الدولة الذين لهم رزق أو عطاء من بيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614} وأول من وضع الديوان عمر بن الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} وأهل الديوان أصناف: أفراد الجيش بشروط تنظيمية كالبلوغ والحرية والإسلام والصحة والقدرة على القتال، وذوو الولايات كالولاة والقضاة والعلماء والسعاة والأئمة والمؤذنين، وذوو الحاجات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} واختلف الصحابة في التفاضل بينهم، فكان أبو بكر وعلي يسويان، وكان عمر وعثمان يفضلان بالسابقة، وزاد عمر القرابة من النبي، وأخذ بقولهما أبو حنيفة وأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}"
  en: "Diwan is a Persian loan-word meaning a collection of sheets and writings, in which the army and those given grants were written; for the jurists it is the register in which the names of those in state service who receive a stipend from the public treasury are recorded, and the office that keeps it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614} Umar ibn al-Khattab was the first to set up the diwan, according to two accounts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} The people of the diwan are of several kinds: soldiers, on conditions that are regulatory, such as puberty, freedom, Islam, health and fitness for fighting; holders of office, such as governors, judges, scholars, collectors, imams and muezzins; and the needy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} The Companions differed on preference in distribution: Abu Bakr and Ali made it equal, while Umar and Uthman preferred by precedence in Islam, and Umar added kinship to the Prophet; Abu Hanifa and Ahmad followed the latter view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}"
