label: { ar: "أهل الديوان", en: "Ahl al-Diwan (those paid from the state register of soldiers and officers, and the rules of their conditions and distribution)", fr: "Ahl al-Diwan (les bénéficiaires du registre d’État des soldats et des officiers, et les règles de leurs conditions et de la distribution)", es: "Ahl al-Diwan (aquellos pagados con cargo al registro estatal de soldados y oficiales, y las normas sobre sus condiciones y distribución)", ur: "اہل دیوان ⁦(جو فوجیوں اور افسروں کے سرکاری رجسٹر سے ادا کیے جاتے ہیں، اور ان کی شرائط اور تقسیم کے قواعد)⁩", tr: "Diwan halkı", id: "Penduduk Diwan" }
summary:
  ar: "الديوان لفظ فارسي معرب، معناه مجتمع الصحف والكتاب، ويكتب فيه أهل الجيش وأهل العطية، ويراد به عند الفقهاء الدفتر الذي تثبت فيه أسماء العاملين في الدولة الذين لهم رزق أو عطاء من بيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614} وأول من وضع الديوان عمر بن الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} وأهل الديوان أصناف: أفراد الجيش بشروط تنظيمية كالبلوغ والحرية والإسلام والصحة والقدرة على القتال، وذوو الولايات كالولاة والقضاة والعلماء والسعاة والأئمة والمؤذنين، وذوو الحاجات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} واختلف الصحابة في التفاضل بينهم، فكان أبو بكر وعلي يسويان، وكان عمر وعثمان يفضلان بالسابقة، وزاد عمر القرابة من النبي، وأخذ بقولهما أبو حنيفة وأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}"
  en: "Diwan is a Persian loan-word meaning a collection of sheets and writings, in which the army and those given grants were written; for the jurists it is the register in which the names of those in state service who receive a stipend from the public treasury are recorded, and the office that keeps it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614} Umar ibn al-Khattab was the first to set up the diwan, according to two accounts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} The people of the diwan are of several kinds: soldiers, on conditions that are regulatory, such as puberty, freedom, Islam, health and fitness for fighting; holders of office, such as governors, judges, scholars, collectors, imams and muezzins; and the needy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} The Companions differed on preference in distribution: Abu Bakr and Ali made it equal, while Umar and Uthman preferred by precedence in Islam, and Umar added kinship to the Prophet; Abu Hanifa and Ahmad followed the latter view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}"
  fr: "Diwan est un emprunt au persan signifiant un ensemble de feuilles et d’écrits, où étaient inscrits les membres de l’armée et les bénéficiaires d’allocations ; pour les juristes, c’est le registre où sont consignés les noms de ceux qui sont au service de l’État et reçoivent un traitement du Trésor public, ainsi que le bureau qui le conserve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614} Umar ibn al-Khattab fut le premier à instituer le diwan, selon deux récits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} Les gens du diwan sont de plusieurs catégories : les soldats, selon des conditions réglementaires telles que la puberté, la liberté, l’islam, la santé et l’aptitude au combat ; les titulaires de fonctions, tels les gouverneurs, les juges, les savants, les collecteurs, les imams et les muezzins ; et les nécessiteux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} Les Compagnons divergeaient sur les préférences dans la distribution : Abu Bakr et Ali la rendaient égale, tandis qu’Umar et Uthman accordaient une préférence selon l’ancienneté dans l’islam, et Umar y ajoutait la parenté avec le Prophète ; Abu Hanifa et Ahmad suivirent cette dernière position. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}"
  es: "Diwan es un préstamo persa que significa una colección de hojas y escritos, en los que se escribía el ejército y aquellos a quienes se les otorgaban subvenciones; para los juristas es el registro en el que se registran los nombres de aquellos en el servicio estatal que reciben un estipendio del tesoro público, y la oficina que lo mantiene. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614} Umar ibn al-Khattab fue el primero en establecer el diwan, según dos relatos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3614}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} Las personas del diwan son de varios tipos: soldados, en condiciones que son reglamentarias, tales como la pubertad, la libertad, el Islam, la salud y la aptitud para el combate; titulares de cargos públicos, como gobernadores, jueces, eruditos, recaudadores, imanes y muecines; y los necesitados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} Los Compañeros discreparon sobre la preferencia en la distribución: Abu Bakr y Ali la hicieron igualitaria, mientras que Umar y Uthman la prefirieron por precedencia en el Islam, y Umar añadió el parentesco con el Profeta; Abu Hanifa y Ahmad siguieron esta última opinión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3616}"
  ur: "دیوان فارسی قرض کا لفظ ہے جس کا مطلب ہے اوراق اور تحریروں کا مجموعہ، جس میں فوج اور دی گئی گرانٹس لکھی جاتی تھیں۔ فقہاء کے نزدیک یہ وہ رجسٹر ہے جس میں سرکاری خزانے سے وظیفہ وصول کرنے والوں کے نام درج کیے جاتے ہیں اور وہ دفتر جو اسے رکھتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3614} دو روایتوں کے مطابق، عمر بن الخطاب پہلے دیوان قائم کرنے والے تھے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3614}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3615} دیوان کے لوگ کئی قسم کے ہوتے ہیں: سپاہی، ان شرائط پر جو ضابطے کے مطابق ہوں، جیسے بلوغت، آزادی، اسلام، صحت اور تندرستی کے لیے جنگ؛ عہدہ رکھنے والے، جیسے گورنر، جج، علماء، جمع کرنے والے، امام اور مؤذن؛ اور ضرورت مند. {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3615} تقسیم میں ترجیح پر صحابہ کرام کا اختلاف ہے: ابوبکر اور علی نے اسے مساوی قرار دیا، جبکہ عمر اور عثمان نے اسلام میں ترجیح دی، اور عمر نے نبی سے قرابت داری کی۔ ابو حنیفہ اور احمد نے مؤخر الذکر قول کی پیروی کی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3615}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3616}"
  tr: "Diwan, Farsça Araplaşmış bir kelimedir ve gazete ile kitapların bir koleksiyonu anlamına gelir. Ordu ve hediyenin halkı içinde yazılıdır. Hukukçulara göre, kamu hazinesinden geçim veya bağış alan devlet görevlilerinin isimlerinin kaydedildiği deftere atıfta bulunur. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.3614} Diwan'ı ilk düzenleyen kişi Umar ibn al-Khattab'tır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3615} Bürodaki kişiler çeşitli tiplerdendir: olgunluk, özgürlük, İslam, sağlık ve savaşma yeteneği gibi örgütsel koşullara sahip ordu personeli; valiler, yargıçlar, alimler, elçiler, imamlar, müezzinler ve ihtiyaç sahipleri gibi yetkili kişiler. {cit:fiqh-mawsua-kuwaitiyya-noor-v3 s.3615} Sahabeler ayrımlarında farklıydı; Ebu Bekir ve Ali eşitti, Ömer ve Osman ilkini tercih etti, Ömer ise Peygamber'in akrabalığını artırdı ve Ebu Hanife ile Ahmed'in görüşünü benimsedi. {atı:fiqh-mawsua-kuveytiyya-noor-v3 s.3615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3616}"
  id: "Diwan adalah kata Persia yang telah diarabadikan dan berarti kumpulan surat kabar dan buku. Kata ini ditulis dalam kalangan tentara dan orang-orang pemberian. Menurut ahli hukum, kata ini merujuk pada register di mana nama-nama pejabat negara yang menerima mata pencaharian atau donasi dari kas negara dicatat. {kutipan:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3614} Orang pertama yang mengorganisir diwan adalah Umar ibn al-Khattab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3615} Orang-orang di kantor ini terdiri dari berbagai jenis: personel militer dengan kondisi organisasi seperti kedewasaan, kebebasan, Islam, kesehatan, dan kemampuan bertarung; Pejabat seperti gubernur, hakim, ulama, utusan, imam, muezzin, dan mereka yang membutuhkan. {sitasi:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3615} Para sahabat berbeda dalam perbedaan mereka; Abu Bakr dan Ali setara, Umar dan Uthman lebih memilih yang pertama, sementara Umar meningkatkan hubungan keluarga Nabi dan mengadopsi pandangan Abu Hanifa dan Ahmad. {sitasi:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3615} {kutipan:fiqh-mawsua-kuwaityya-noor-v3 hlm.3616}"
