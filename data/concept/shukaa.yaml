label:
  ar: "شكاعى"
  en: "Shuka'a"
  ur: "شکاعی"
summary:
  ar: "الشكاعى في الكتاب نبات له أصل شبيه بالسعد شديد المرارة، ويسمى كثير العقد، قبضه أكثر من قبض الباذاورد وخصوصا في قشره وأصله، يتمضمض بطبيخه لوجع الأسنان وينفع من ورم اللهاة، وينفع المعدة والكبد، وينفع من الحميات العتيقة وخصوصا للصبيان، ويذكر الكتاب نقلا موسوما أن طبيخ أصله يمنع من نزف النساء {cite:canon-ibn-sina-print-v1 pp.676-677}"
  en: "Shuka'a is in the book a plant whose root resembles su'd and is very bitter, and it is also called the many-jointed; its astringency is greater than that of badhawurd, especially in its bark and root; its decoction is gargled for toothache and it benefits swelling of the uvula; it benefits the stomach and liver and benefits old fevers, especially for boys; and the book lists, as a labelled report, that the decoction of its root holds back the bleeding of women {cite:canon-ibn-sina-print-v1 pp.676-677}"
  ur: "شکاعی کتاب میں ایک پودا ہے جس کی جڑ سعد سے مشابہ اور بہت کڑوی ہے، اسے کثیر العقد بھی کہا جاتا ہے؛ اس کا قبض باذاورد کے قبض سے زیادہ ہے، خاص طور پر اس کی چھال اور جڑ میں؛ اس کے جوشاندے سے دانتوں کے درد کے لیے غرارے کیے جاتے ہیں اور یہ کوے کے ورم میں نافع ہے؛ معدے اور جگر کو نفع دیتا ہے اور پرانے بخاروں میں خاص طور پر لڑکوں کے لیے نافع ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ اس کی جڑ کا جوشاندہ عورتوں کے خون کے بہاؤ کو روکتا ہے {cite:canon-ibn-sina-print-v1 pp.676-677}۔"
