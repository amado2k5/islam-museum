summary:
  ar: "الشكاعى في الكتاب نبات له أصل شبيه بالسعد شديد المرارة، ويسمى كثير العقد، قبضه أكثر من قبض الباذاورد وخصوصا في قشره وأصله، يتمضمض بطبيخه لوجع الأسنان وينفع من ورم اللهاة، وينفع المعدة والكبد، وينفع من الحميات العتيقة وخصوصا للصبيان، ويذكر الكتاب نقلا موسوما أن طبيخ أصله يمنع من نزف النساء {cite:canon-ibn-sina-print-v1 pp.676-677}"
  en: "Shuka'a is in the book a plant whose root resembles su'd and is very bitter, and it is also called the many-jointed; its astringency is greater than that of badhawurd, especially in its bark and root; its decoction is gargled for toothache and it benefits swelling of the uvula; it benefits the stomach and liver and benefits old fevers, especially for boys; and the book lists, as a labelled report, that the decoction of its root holds back the bleeding of women {cite:canon-ibn-sina-print-v1 pp.676-677}"
  ur: "شکاعی کتاب میں ایک پودا ہے جس کی جڑ سعد سے مشابہ اور بہت کڑوی ہے، اسے کثیر العقد بھی کہا جاتا ہے؛ اس کا قبض باذاورد کے قبض سے زیادہ ہے، خاص طور پر اس کی چھال اور جڑ میں؛ اس کے جوشاندے سے دانتوں کے درد کے لیے غرارے کیے جاتے ہیں اور یہ کوے کے ورم میں نافع ہے؛ معدے اور جگر کو نفع دیتا ہے اور پرانے بخاروں میں خاص طور پر لڑکوں کے لیے نافع ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ اس کی جڑ کا جوشاندہ عورتوں کے خون کے بہاؤ کو روکتا ہے {cite:canon-ibn-sina-print-v1 pp.676-677}۔"
  es: "Shuka'a es, según el libro, una planta cuya raíz se asemeja a la de su'd y es muy amarga, y también se la llama de muchas articulaciones; su astringencia es mayor que la de badhawurd, especialmente en su corteza y raíz; su decocción se usa para hacer gárgaras para el dolor de muelas y beneficia la inflamación de la úvula; beneficia el estómago y el hígado y alivia las fiebres antiguas, especialmente en los niños; y el libro menciona, como un informe detallado, que la decocción de su raíz detiene el sangrado en las mujeres {cite:canon-ibn-sina-print-v1 pp.676-677}"
  fr: "Le Shuka'a est décrit dans le livre comme une plante dont la racine ressemble au su'd et est très amère; on l'appelle aussi la plante aux multiples articulations. Son astringence est supérieure à celle du badhawurd, surtout dans son écorce et sa racine. Sa décoction est utilisée en gargarisme contre les maux de dents et soulage l'inflammation de la luette. Elle est bénéfique pour l'estomac et le foie et soulage les fièvres anciennes, particulièrement chez les garçons. Le livre mentionne également, sous forme de rapport, que la décoction de sa racine arrête les saignements chez les femmes. {cite:canon-ibn-sina-print-v1 pp.676-677}"
  tr: "Kitapta Al-Shaka'i, Saad'a benzer çok acı kökenli bir bitkiden 'Kare-düğüm' adı verilen bir bitkiden bahseder. Tutuşu tomurcuktan daha yoğundur, özellikle kabuğu ve kökünde. Pişirildiğinde diş ağrısı için yıkanır, uvula tümörlerinden faydalanır, mide ve karaciğere fayda sağlar ve özellikle erkek çocuklar için eski ateşler için faydalıdır. Kitapta, orijinal pişirmesinin kadınlarda kanamayı önlediğine dair kayıtlı bir aktarım belirtilir {cite:canon-ibn-sina-print-v1 s.676-677}"
  id: "Al-Shaka'i dalam buku menyebutkan sebuah tanaman dengan asal-usul yang sangat pahit mirip Saad, disebut 'Kare-knot'. Cengkeramannya lebih pekat daripada kuncup, terutama pada kulit dan akarnya. Tanaman ini dibilas saat dimasak untuk sakit gigi, mendapat manfaat dari tumor uvula, bermanfaat bagi lambung dan hati, serta bermanfaat untuk demam kuno, terutama untuk anak laki-laki. Buku ini menyebutkan transmisi tercatat bahwa masakan aslinya mencegah pendarahan pada wanita {cite:canon-ibn-sina-print-v1 hlm.676-677}"
