label:
  ar: "الرباط"
  en: "Ribat (garrisoning the frontier, and the endowed hostels for travellers)"
  ur: "رباط"
  es: "Ribat (guarnición en la frontera y albergues para viajeros)"
  fr: "Ribat (garnissage de la frontière et auberges dotées pour les voyageurs)"
summary:
  ar: "الرباط في الأصل ملازمة ثغر العدو، وقد يُطلق على المحافظة على الصلوات أو مداومة الجلوس في المسجد، وعلى البيوت المسبلة لإيواء الفقراء والغرباء وطلبة العلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} والرباط سنة مؤكدة عند الفقهاء، لأنه حفظ ثغور الإسلام، وهو أصل الجهاد وفرعه عند أحمد، وفيه فضل كبير ورد في الأحاديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} وأفضله في أشد الثغور خوفا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} وتمام الرباط عند الفقهاء أربعون يوما، واختلفوا في أقله، فقال الحنابلة إنه ساعة، وقال ابن حجر إنه يوم أو ليلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} والرباطات المسبلة في الطرق وأطراف البلاد، فمن سبق إلى موضع منها وهو من المستحقين صار أحق به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604}"
  en: "Ribat in its root sense is the garrisoning of an enemy frontier; it is also used for keeping the five prayers, for persistent sitting in the mosque, and for endowed hostels that house the poor, travellers and students. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} Ribat is a confirmed sunna, since it guards the frontiers of Islam; Ahmad called it the root and branch of jihad, and many hadiths praise it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} The best ribat is at the most dangerous frontier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} A complete ribat is forty days by agreement; the Hanbalis set its least at an hour, and Ibn Hajar at a day or a night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} Endowed hostels on roads and frontiers belong to those entitled to them, and whoever arrives first to one of them has the better claim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604}"
  ur: "رباط سے مراد سرحد پر دشمن کے مقابل پہرہ دینا ہے، اور کبھی نمازوں کی پابندی یا مسجد میں بیٹھنے، اور مسافروں و طلبہ کے لیے وقف گھروں پر بھی بولا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601}"
  es: "Ribat, en su sentido original, es la guarnición de una frontera enemiga; también se utiliza para cumplir con las cinco oraciones, para permanecer sentado en la mezquita y para albergues dotados que dan cobijo a los pobres, viajeros y estudiantes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} Ribat es una sunna confirmada, ya que protege las fronteras del Islam; Ahmad la llamó la raíz y rama de la yihad, y muchos hadices la alaban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} El mejor ribat se encuentra en la frontera más peligrosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} Un ribat completo es de cuarenta días por acuerdo; los hanbalíes fijaron su mínimo en una hora, e Ibn Hajar en un día o una noche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} Los albergues dotados en caminos y fronteras pertenecen a quienes tienen derecho a ellos, y quien llegue primero a uno de ellos tiene mejor derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604}"
  fr: "Le ribat, au sens premier, désigne la garnison d'une frontière ennemie; il s'emploie également pour l'accomplissement des cinq prières quotidiennes, la fréquentation assidue de la mosquée et la fondation d'auberges accueillant les pauvres, les voyageurs et les étudiants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} Le ribat est une sunna confirmée, car il protège les frontières de l'islam; Ahmad le qualifiait de racine et de branche du jihad, et de nombreux hadiths le louent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} Le meilleur ribat se pratique aux frontières les plus dangereuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} Un ribat complet est de quarante jours par convention; les Hanbalites fixent sa durée minimale à une heure, et Ibn Hajar à un jour ou une nuit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} Les auberges dotées situées sur les routes et aux frontières appartiennent à ceux qui y ont droit, et celui qui arrive le premier à l’une d’elles a la priorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604}"
