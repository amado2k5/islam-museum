  en: "Ribat (garrisoning the frontier, and the endowed hostels for travellers)"
  ur: "رباط"
summary:
  ar: "الرباط في الأصل ملازمة ثغر العدو، وقد يُطلق على المحافظة على الصلوات أو مداومة الجلوس في المسجد، وعلى البيوت المسبلة لإيواء الفقراء والغرباء وطلبة العلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} والرباط سنة مؤكدة عند الفقهاء، لأنه حفظ ثغور الإسلام، وهو أصل الجهاد وفرعه عند أحمد، وفيه فضل كبير ورد في الأحاديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} وأفضله في أشد الثغور خوفا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} وتمام الرباط عند الفقهاء أربعون يوما، واختلفوا في أقله، فقال الحنابلة إنه ساعة، وقال ابن حجر إنه يوم أو ليلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} والرباطات المسبلة في الطرق وأطراف البلاد، فمن سبق إلى موضع منها وهو من المستحقين صار أحق به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604}"
  en: "Ribat in its root sense is the garrisoning of an enemy frontier; it is also used for keeping the five prayers, for persistent sitting in the mosque, and for endowed hostels that house the poor, travellers and students. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} Ribat is a confirmed sunna, since it guards the frontiers of Islam; Ahmad called it the root and branch of jihad, and many hadiths praise it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} The best ribat is at the most dangerous frontier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8602} A complete ribat is forty days by agreement; the Hanbalis set its least at an hour, and Ibn Hajar at a day or a night. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} Endowed hostels on roads and frontiers belong to those entitled to them, and whoever arrives first to one of them has the better claim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8603} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604}"
  ur: "رباط سے مراد سرحد پر دشمن کے مقابل پہرہ دینا ہے، اور کبھی نمازوں کی پابندی یا مسجد میں بیٹھنے، اور مسافروں و طلبہ کے لیے وقف گھروں پر بھی بولا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8601}"
