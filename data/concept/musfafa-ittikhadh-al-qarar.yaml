id: concept/musfafa-ittikhadh-al-qarar
class: concept
kind: term
label:
  ar: "مصفوفة اتخاذ القرار"
  en: "The decision matrix"
  ur: "فیصلے کی مصفوفہ"
summary:
  ar: "مصفوفة اتخاذ القرار كما يدرّسها طارق السويدان: تُفصل الشروط الأساسية عن التفضيلية، تُستبعد البدائل المخالفة للأساسية ابتداءً من الأسهل استخراجاً، ثم تُنقَّط الباقية على التفضيلية، ويصح إعطاء الشروط أوزاناً؛ وقاعدته أن القرار يتحسن كلما كثرت البدائل."
  en: "The decision matrix as Tareq al-Suwaidan teaches it: essential conditions are separated from preferential ones, alternatives failing the essentials are excluded starting with the easiest to check, the survivors are scored on the preferentials, and conditions may be weighted; his rule is that a decision improves as alternatives multiply."
  ur: "فیصلے کی مصفوفہ جیسا کہ طارق السویدان سکھاتے ہیں: بنیادی شرائط کو ترجیحی شرائط سے الگ کیا جاتا ہے، بنیادی شرائط پر ناکام متبادل حذف ہوتے ہیں، بچے ہوئے ترجیحی شرائط پر نمبر لیتے ہیں، اور شرائط کو وزن دیا جا سکتا ہے؛ ان کا اصول ہے کہ فیصلہ متبادل کے بڑھنے سے بہتر ہوتا ہے۔"
