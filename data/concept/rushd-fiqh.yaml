id: concept/rushd-fiqh
class: concept
kind: legal
label:
  ar: "الرشد"
  en: "Rushd (sound judgment as the end of a ward's incapacity): its meaning, the test of a child, and the release of property"
  ur: "رشد"
summary:
  ar: "الرشد في اللغة الصلاح وإصابة الصواب والاستقامة على طريق الحق، وهو في اصطلاح الفقهاء صلاح المال عند الجمهور، وصلاح المال والدين معا عند الشافعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} والرشد هو المرحلة الأخيرة من الأهلية، فإذا بلغ الشخص رشيدا كملت أهليته وارتفعت عنه الولاية وسلمت إليه أمواله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} وإذا بلغ غير رشيد استمر الحجر عليه عند جمهور الفقهاء حتى يؤنس منه الرشد، وخالف أبو حنيفة فيسلم إليه ماله إذا بلغ خمسا وعشرين سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8741} ويُختبر الصبي بتفويض التصرفات التي يتصرف فيها أمثاله، مرة أو مرتين فأكثر، وتختلف طرق الاختبار بين الحنفية والشافعية والحنابلة والمالكية، ويكون في الغالب قبل البلوغ عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8740} وتتعلق أحكام الرشد بكثير من أبواب الفقه كالبيع والشركة والوكالة والهبة والوقف والنكاح والخلع والحضانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743}"
  en: "Rushd in the lexicon is sound judgment and right conduct; in the jurists' usage it is the soundness of property for the majority, and of both property and religion for al-Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} It is the last stage of capacity: a person who comes of age sound has full capacity, his guardianship ends and his property is handed to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} If he comes of age unsound, the majority hold the restriction continues until his soundness is shown, while Abu Hanifa hands over the property at twenty-five years. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8741} A child is tested by letting him conduct the kind of transactions his peers conduct, once or more, and the schools differ on the method and the time, the Hanafis, Shafi'is and Hanbalis mostly before puberty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8740} The rules of soundness appear in many chapters of law, such as sale, partnership, agency, gift, endowment, marriage, khul' and custody. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743}"
  ur: "رشد سمجھ داری اور درست طرزِ عمل ہے؛ بالغ ہونے کے بعد اگر شخص رشید ہو تو اس کی ولایت ختم ہو جاتی ہے اور مال اس کے سپرد کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738}"
