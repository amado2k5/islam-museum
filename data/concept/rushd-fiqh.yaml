label:
  ar: "الرشد"
  en: "Rushd (sound judgment as the end of a ward's incapacity): its meaning, the test of a child, and the release of property"
  ur: "رشد"
  es: "Rushd (el buen juicio como fin de la incapacidad de un pupilo): su significado, la prueba de un niño y la liberación de bienes."
  fr: "Rushd (le jugement sain comme fin de l'incapacité d'un pupille): sa signification, le critère de l'enfant et la libération des biens"
  tr: "Yetişkinliğe Geçiş"
  id: "Masa Dewasa"
summary:
  ar: "الرشد في اللغة الصلاح وإصابة الصواب والاستقامة على طريق الحق، وهو في اصطلاح الفقهاء صلاح المال عند الجمهور، وصلاح المال والدين معا عند الشافعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} والرشد هو المرحلة الأخيرة من الأهلية، فإذا بلغ الشخص رشيدا كملت أهليته وارتفعت عنه الولاية وسلمت إليه أمواله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} وإذا بلغ غير رشيد استمر الحجر عليه عند جمهور الفقهاء حتى يؤنس منه الرشد، وخالف أبو حنيفة فيسلم إليه ماله إذا بلغ خمسا وعشرين سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8741} ويُختبر الصبي بتفويض التصرفات التي يتصرف فيها أمثاله، مرة أو مرتين فأكثر، وتختلف طرق الاختبار بين الحنفية والشافعية والحنابلة والمالكية، ويكون في الغالب قبل البلوغ عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8740} وتتعلق أحكام الرشد بكثير من أبواب الفقه كالبيع والشركة والوكالة والهبة والوقف والنكاح والخلع والحضانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743}"
  en: "Rushd in the lexicon is sound judgment and right conduct; in the jurists' usage it is the soundness of property for the majority, and of both property and religion for al-Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} It is the last stage of capacity: a person who comes of age sound has full capacity, his guardianship ends and his property is handed to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} If he comes of age unsound, the majority hold the restriction continues until his soundness is shown, while Abu Hanifa hands over the property at twenty-five years. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8741} A child is tested by letting him conduct the kind of transactions his peers conduct, once or more, and the schools differ on the method and the time, the Hanafis, Shafi'is and Hanbalis mostly before puberty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8740} The rules of soundness appear in many chapters of law, such as sale, partnership, agency, gift, endowment, marriage, khul' and custody. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743}"
  ur: "رشد سمجھ داری اور درست طرزِ عمل ہے؛ بالغ ہونے کے بعد اگر شخص رشید ہو تو اس کی ولایت ختم ہو جاتی ہے اور مال اس کے سپرد کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738}"
  es: "Rushd en el léxico es juicio sano y conducta correcta; en el uso de los juristas es la solidez de la propiedad para la mayoría, y tanto de la propiedad como de la religión para al-Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} Es la última etapa de capacidad: una persona que llega a la mayoría de edad sana tiene plena capacidad, su tutela termina y su propiedad le es entregada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} Si llega a la mayoría de edad no está sano, la mayoría sostiene que la restricción continúa hasta que se demuestre su salud, mientras que Abu Hanifa entrega la propiedad a los veinticinco años. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8741} Un niño es puesto a prueba permitiéndole realizar el tipo de transacciones que realizan sus compañeros, una o más veces, y las escuelas difieren en el método y el momento, los Hanafis, Shafi'is y Hanbalis principalmente antes de la pubertad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8740} Las reglas de solidez aparecen en muchos capítulos de la ley, tales como venta, sociedad, agencia, donación, dotación, matrimonio, khul' y custodia. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8743}"
  fr: "Le terme « rushd » dans le lexique désigne le bon jugement et la conduite droite; dans l’usage des juristes, il désigne la validité des biens pour la majorité, et à la fois des biens et de la religion pour al-Shafi’i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} Il s’agit du dernier stade de la capacité: une personne qui atteint l’âge adulte en étant saine d’esprit acquiert sa pleine capacité, sa tutelle prend fin et ses biens lui sont remis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} Si elle atteint l’âge adulte en étant incapable d’esprit, la majorité considère que la tutelle se poursuit jusqu’à ce que sa santé mentale soit prouvée, tandis qu’Abu Hanifa remet les biens à l’âge de vingt-cinq ans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8741} On met un enfant à l'épreuve en le laissant effectuer, une ou plusieurs fois, le type de transactions que font ses pairs. Les écoles divergent quant à la méthode et au moment de cette mise à l'épreuve; les Hanafites, les Shafi'ites et les Hanbalites préconisent généralement de le faire avant la puberté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8740} Les règles de validité apparaissent dans de nombreux chapitres du droit, tels que la vente, le partenariat, le mandat, la donation, la dotation, le mariage, le khul' et la garde. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8743}"
  tr: "Dilde 'doğruluk', doğruluk, doğruluk ve doğruluk yolunda doğruluk anlamına gelir. Fıkıh terminolojisinde, çoğunluğa göre servetin sağlamlığı ve Al-Shafi'i'ye göre zenginlik ile dinin birlikte sağlamlığı anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8737} Yaş, yasal uygunluğun son aşamasıdır. Bir kişi olgunluğa ulaştığında, uygunluğu tamamlanır, vasilik kaldırılır ve mal varlığı ona teslim edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8738} Eğer akıl hastalığı yaşına ulaşırsa, vasi çoğu hukukçuya göre yasal olgunluğa ulaşana kadar devam eder. Abu Hanifa'ya katılmazsa, mülkü yirmi beş yaşına geldiğinde ona devredilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8741} Çocuk, yaptığı eylemleri kendisi gibi bir, iki kez veya daha fazla devrederek sınanır. Test yöntemleri Hanefi, Şafi, Hanbali ve Malikiler arasında farklılık gösterir ve genellikle Hanefi, Şafi'ler ve Hanbalilere göre ergenlikten önce yapılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8740} Hukuki rehberlik kararları, satış, ortaklık, ajans, hediye, vakıf, evlilik, hul' ve velayet gibi birçok fıkıh bölümüne ilişkindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8743}"
  id: "Dalam bahasa, 'kebenaran' berarti kebenaran, kebenaran, dan kejujuran di jalan kebenaran. Dalam istilah firisprudensi, berarti kekayaan yang sehat menurut mayoritas, dan kebaikan kekayaan dan agama secara bersamaan menurut Al-Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8737} Usia adalah tahap akhir kelayakan hukum. Ketika seseorang mencapai kematangan, kelayakannya lengkap, hak asuh dicabut, dan harta benda diserahkan kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8737} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8738} Jika ia mencapai usia gila, wali tersebut tetap berlanjut menurut mayoritas ahli hukum sampai ia mencapai kedewasaan hukum. Jika ia tidak setuju dengan Abu Hanifa, hartanya akan diserahkan kepadanya saat ia berusia dua puluh lima tahun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8738} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8741} Anak laki-laki diuji dengan mendelegasikan tindakan yang ia lakukan seperti dirinya sekali atau dua kali atau lebih. Metode pengujian berbeda antara Hanafi, Shafi'i, Hanbali, dan Maliki, dan biasanya sebelum pubertas menurut Hanafi, Shafi'i, dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8739} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8740} Putusan panduan hukum berkaitan dengan banyak bab yurisprudensial seperti penjualan, kemitraan, agensi, hadiah, wakaf, pernikahan, khul', dan hak asuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8743}"
