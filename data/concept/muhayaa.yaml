id: concept/muhayaa
class: concept
kind: legal
label: { ar: "المُهَايَأة", en: "Taking turns (muhayaa) in the use of shared property", ur: "مہایاۃ ⁦(باری مقرر کر کے مشترکہ چیز سے فائدہ اٹھانا)⁩", es: "Turnarse (muhayaa) en el uso de la propiedad compartida", fr: "L'utilisation à tour de rôle (muhayaa) des biens partagés" }
summary:
  ar: "المهايأة في اللغة مفاعلة من الهيئة، وهي في الاصطلاح قسمة المنافع على التعاقب والتناوب. وهي مشروعة بالكتاب والسنة والإجماع، ومحلها المنافع دون الأعيان. وهي عند الجمهور عقد جائز، ويرى المالكية أنها لازمة إذا كانت في زمن معين. وللفقهاء أحكام في التنازع فيها، وفي الأكساب النادرة والمؤن، وفي الضمان، إذ اختلفوا هل يد المتهايئين يد أمانة أو ضمان."
  en: "Muhayaa is, in law, sharing the use of a property in turns. It is lawful by the Qur'an, the Sunna and consensus, and concerns uses rather than the things themselves. Most jurists hold it a permissible contract that either party may end; the Malikis hold it binding when fixed to a set term. The jurists differ on how disputes are settled, on rare earnings and expenses of a shared slave or animal, and on whether the hand that holds the property in turn is a trustee or a guarantor."
  ur: "مہایاۃ مشترکہ چیز کے فائدے کو باری باری استعمال کرنے کو کہتے ہیں۔ جمہور کے نزدیک یہ جائز عقد ہے، جبکہ مالکیہ کے نزدیک مدت متعین ہونے پر لازم ہے۔ اس میں امانت یا ضمان کے احکام پر اختلاف ہے۔"
  es: "En derecho, la muhayaa consiste en compartir el uso de una propiedad por turnos. Es lícita según el Corán, la Sunna y el consenso, y se refiere al uso más que a la propiedad en sí. La mayoría de los juristas la consideran un contrato permisible que cualquiera de las partes puede rescindir; los malikíes la consideran vinculante cuando se fija por un plazo determinado. Los juristas difieren en cuanto a la resolución de disputas, las ganancias y los gastos ocasionales de un esclavo o animal compartido, y si quien posee la propiedad por turnos actúa como fideicomisario o garante."
  fr: "La muhayaa est, en droit, le partage de l'usage d'un bien à tour de rôle. Elle est licite selon le Coran, la Sunna et le consensus, et concerne les usages plutôt que les biens eux-mêmes. La plupart des juristes la considèrent comme un contrat licite que chaque partie peut résilier; les malikites la considèrent comme contraignante lorsqu'elle est fixée à une durée déterminée. Les juristes divergent quant au règlement des litiges, à la prise en compte des revenus et dépenses exceptionnels liés à un esclave ou un animal partagé, et à la question de savoir si celui qui détient le bien à tour de rôle est un fiduciaire ou un garant."
