id: concept/muhayaa
class: concept
kind: legal
label: { ar: "المُهَايَأة", en: "Taking turns (muhayaa) in the use of shared property", ur: "مہایاۃ (باری مقرر کر کے مشترکہ چیز سے فائدہ اٹھانا)" }
summary:
  ar: "المهايأة في اللغة مفاعلة من الهيئة، وهي في الاصطلاح قسمة المنافع على التعاقب والتناوب. وهي مشروعة بالكتاب والسنة والإجماع، ومحلها المنافع دون الأعيان. وهي عند الجمهور عقد جائز، ويرى المالكية أنها لازمة إذا كانت في زمن معين. وللفقهاء أحكام في التنازع فيها، وفي الأكساب النادرة والمؤن، وفي الضمان، إذ اختلفوا هل يد المتهايئين يد أمانة أو ضمان."
  en: "Muhayaa is, in law, sharing the use of a property in turns. It is lawful by the Qur'an, the Sunna and consensus, and concerns uses rather than the things themselves. Most jurists hold it a permissible contract that either party may end; the Malikis hold it binding when fixed to a set term. The jurists differ on how disputes are settled, on rare earnings and expenses of a shared slave or animal, and on whether the hand that holds the property in turn is a trustee or a guarantor."
  ur: "مہایاۃ مشترکہ چیز کے فائدے کو باری باری استعمال کرنے کو کہتے ہیں۔ جمہور کے نزدیک یہ جائز عقد ہے، جبکہ مالکیہ کے نزدیک مدت متعین ہونے پر لازم ہے۔ اس میں امانت یا ضمان کے احکام پر اختلاف ہے۔"
