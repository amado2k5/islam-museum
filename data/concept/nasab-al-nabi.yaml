    summary:
      ar: "يرى المباركفوري أن الجزء إلى عدنان متفق على صحته، وما فوقه إلى إبراهيم مختلف فيه بين متوقف وقائل، وما فوق إبراهيم فيه أمور غير صحيحة قطعاً؛ وينقل أن المنصور فوري جمع الجزء الثاني برواية الكلبي وابن سعد مع اختلاف كبير بين المصادر."
