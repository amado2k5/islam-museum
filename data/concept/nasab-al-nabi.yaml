id: concept/nasab-al-nabi
class: concept
kind: term
label: { ar: "النسب النبوي وأجزاؤه الثلاثة", en: "The Prophet's lineage and its three parts" }
summary:
  ar: "يقسّم الرحيق المختوم نسب النبي ثلاثة أجزاء: جزء اتفق على صحته أهل السير والأنساب وهو إلى عدنان (محمد بن عبد الله بن عبد المطلب واسمه شيبة بن هاشم واسمه عمرو بن عبد مناف واسمه المغيرة بن قصي واسمه زيد بن كلاب بن مرة بن كعب بن لؤي بن غالب بن فهر بن مالك بن النضر بن كنانة بن خزيمة بن مدركة بن إلياس بن مضر بن نزار بن معد بن عدنان)، وجزء اختلفوا فيه بين متوقف وقائل به وهو ما فوق عدنان إلى إبراهيم، وجزء لا شك أن فيه أموراً غير صحيحة وهو ما فوق إبراهيم إلى آدم."
  en: "al-Raheeq al-Makhtum divides the Prophet's lineage into three parts: one agreed on by the sira and genealogy scholars, up to Adnan; one disputed, between those who suspend judgement and those who affirm it, from Adnan up to Ibrahim; and one that certainly contains unsound matter, from Ibrahim up to Adam."
