label:
  ar: "الزُّبد"
  en: "Zabd (butter)"
  ur: "مکھن ⁦(زبد)⁩"
summary:
  ar: "الزبد حار رطب في الأولى، منضج محلّل مرخٍّ؛ ينفع أعصاب الجراحات والقروح، ويعين السعال البارد اليابس مع اللوز والسكر، ويسهّل النفث، ويحقن للأورام الحارة، ويقاوم السموم، وينفع نهشة الأفعى إذا طُلي به. {cite:canon-ibn-sina-print-v1 p.462}"
  en: "Butter is hot and moist in the first degree; it ripens, dissolves and softens. It helps nerve wounds and ulcers, dry cold coughs with almonds and sugar, and eases spitting; it is used as an enema for hot swellings, counters poisons, and helps viper bites when applied. {cite:canon-ibn-sina-print-v1 p.462}"
  ur: "مکھن پہلے درجے میں گرم اور تر ہے؛ یہ پکاتا، تحلیل کرتا اور نرم کرتا ہے۔ یہ اعصابی زخموں اور السر میں، بادام اور چینی کے ساتھ خشک ٹھنڈی کھانسی میں مفید ہے، بلغم نکالنے میں مدد دیتا ہے، گرم سوجن میں انیما کے طور پر لگایا جاتا ہے، زہروں کا مقابلہ کرتا ہے، اور لگانے سے سانپ کے کاٹنے میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.462}"
