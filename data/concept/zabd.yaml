label:
  ar: "الزُّبد"
  en: "Zabd (butter)"
  ur: "مکھن ⁦(زبد)⁩"
  es: "Zabd (mantequilla)"
  fr: "Zabd (beurre)"
  tr: "tereyağı"
  id: "mentega"
summary:
  ar: "الزبد حار رطب في الأولى، منضج محلّل مرخٍّ؛ ينفع أعصاب الجراحات والقروح، ويعين السعال البارد اليابس مع اللوز والسكر، ويسهّل النفث، ويحقن للأورام الحارة، ويقاوم السموم، وينفع نهشة الأفعى إذا طُلي به. {cite:canon-ibn-sina-print-v1 p.462}"
  en: "Butter is hot and moist in the first degree; it ripens, dissolves and softens. It helps nerve wounds and ulcers, dry cold coughs with almonds and sugar, and eases spitting; it is used as an enema for hot swellings, counters poisons, and helps viper bites when applied. {cite:canon-ibn-sina-print-v1 p.462}"
  ur: "مکھن پہلے درجے میں گرم اور تر ہے؛ یہ پکاتا، تحلیل کرتا اور نرم کرتا ہے۔ یہ اعصابی زخموں اور السر میں، بادام اور چینی کے ساتھ خشک ٹھنڈی کھانسی میں مفید ہے، بلغم نکالنے میں مدد دیتا ہے، گرم سوجن میں انیما کے طور پر لگایا جاتا ہے، زہروں کا مقابلہ کرتا ہے، اور لگانے سے سانپ کے کاٹنے میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.462}"
  es: "La mantequilla es caliente y húmeda en primer grado; madura, se disuelve y se ablanda. Ayuda a curar heridas nerviosas y úlceras, seca la tos fría con almendras y azúcar, y facilita la expectoración; se usa como enema para hinchazones calientes, contrarresta venenos y ayuda a aliviar las picaduras de víbora cuando se aplica. {cite:canon-ibn-sina-print-v1 p.462}"
  fr: "Le beurre est chaud et humide au premier degré; il mûrit, se dissout et s’assouplit. Il soulage les plaies nerveuses et les ulcères, la toux sèche due au rhume (avec des amandes et du sucre), et calme les crachats; il est utilisé en lavement pour les gonflements chauds, neutralise les poisons et soulage les morsures de vipère en application locale. {cite:canon-ibn-sina-print-v1 p.462}"
  tr: "Tereyağı ilk derecede sıcak ve nemlidir, olgunlaşır, çözünür ve gevşetir; yaraların ve ülserlerin sinirlerine iyi gelir, badem ve şekerle birlikte kullanıldığında soğuk ve kuru öksürüğe iyi gelir, balgam söktürmeyi kolaylaştırır, sıcak tümörler için lavman olarak kullanılır, zehirlere karşı etkilidir ve topikal olarak uygulandığında yılan ısırıklarına iyi gelir. {cite:canon-ibn-sina-print-v1 s.462}"
  id: "Mentega bersifat hangat dan lembap pada tingkat pertama, mematangkan, melarutkan, dan merelaksasi; bermanfaat bagi saraf luka dan borok, dan membantu mengatasi batuk kering dan pilek bila dikombinasikan dengan almond dan gula, mempermudah pengeluaran dahak, digunakan sebagai enema untuk tumor panas, menangkal racun, dan bermanfaat untuk gigitan ular bila dioleskan secara topikal. {cite:canon-ibn-sina-print-v1 p.462}"
