label:
  ar: "حقوق المسلم على أخيه المسلم"
  en: "A Muslim's rights over a fellow Muslim (huquq al-muslim ala akhihi)"
  ur: "مسلمان کے ایک دوسرے پر حقوق"
  es: "Derechos de un musulmán sobre otro musulmán (huquq al-muslim ala akhihi)"
  fr: "Les droits d'un musulman sur un autre musulman (huquq al-muslim ala akhihi)"
summary:
  ar: "حقوق المسلم على أخيه المسلم كما يعرضها الشيخ عمر عبد الكافي في حلقة من سلسلة «الحقوق»: السلام، والعيادة، والتهنئة والتعزية، وترك الغيبة، ونصرة الأخ."
  en: "A Muslim's duties toward a fellow Muslim, as Sheikh Omar Abdelkafy presents them in one lesson of his series on rights: greeting, visiting the sick, congratulating and consoling, avoiding backbiting, and standing by one's brother."
  ur: "شیخ عمر عبدالکافی کے سلسلۂ حقوق کے ایک درس میں مسلمان کے دوسرے مسلمان پر حقوق: سلام، عیادت، مبارک باد اور تعزیت، غیبت سے اجتناب اور بھائی کی مدد۔"
  es: "Los deberes de un musulmán hacia otro musulmán, tal como los presenta el jeque Omar Abdelkafy en una lección de su serie sobre derechos: saludar, visitar a los enfermos, felicitar y consolar, evitar la calumnia y apoyar al hermano."
  fr: "Les devoirs d'un musulman envers un autre musulman, tels que les présente le cheikh Omar Abdelkafy dans une leçon de sa série sur les droits: saluer, rendre visite aux malades, féliciter et consoler, éviter la médisance et soutenir son frère."
