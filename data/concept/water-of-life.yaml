  ar: "الماء وكل شيء حي"
  en: "Water and all life"
  ur: "پانی اور ہر جاندار"
summary:
  ar: "وجعلنا من الماء كل شيء حي، وخلق من الماء بشراً ومن دابة ما يمشي على بطنه وما يمشي على رجلين وما يمشي على أربع والله خالق كل شيء."
  en: "'We made from water every living thing'; from water God made man and every creature — what crawls on its belly, what walks on two legs and what walks on four — for God is the creator of all things."
  ur: "'ہم نے پانی سے ہر جیتی چیز بنائی'؛ پانی سے اللہ نے انسان اور ہر جاندار پیدا کیا — جو پیٹ کے بل چلے، دو پاؤں پر چلے یا چار پر — کیونکہ اللہ ہر چیز کا خالق ہے۔"
