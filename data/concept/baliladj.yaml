summary:
  ar: "قريب الطبع من الأملج، ولبّه حلو قريب من البندق، فيه قوة جلاءة ملطفة وقوة قابضة. بارد في الأولى يابس في الثانية. يقوّي المعدة بالدبغ والجمع وينفع من استرخائها ورطوبتها، ولا شيء أدبغ للمعدة منه، ويعقل البطن عند بعضهم، ويليّن عند آخرين، وهو نافع للمعي المستقيم والمقعدة جداً {cite:canon-ibn-sina-print-v1 p.398}."
  en: "Close in nature to the myrobalan, with a sweet kernel like the hazelnut. It has a light cleansing power and an astringent power. Cold in the first degree and dry in the second. It strengthens the stomach by tanning and binding, helps its looseness and moisture, and nothing tans the stomach better. Some say it binds the belly, others that it only softens it; the book prefers the latter, and it helps the straight intestine and the anus greatly {cite:canon-ibn-sina-print-v1 p.398}."
  ur: "یہ املج کی طبیعت کے قریب ہے، اس کا مغز میٹھا اور بادام کے قریب ہے، اس میں ہلکی جلا دینے والی اور قابض قوت دونوں ہیں۔ پہلے درجے میں ٹھنڈا اور دوسرے میں خشک۔ یہ معدے کو دباغت اور جمع کرنے سے قوت دیتا ہے، اس کی ڈھیلاہٹ اور تری میں نفع دیتا ہے، اور معدے کو اس سے بہتر کوئی چیز نہیں دباغ کرتی۔ بعض کے نزدیک یہ پیٹ باندھتا ہے، اور دوسروں کے نزدیک صرف نرم کرتا ہے؛ کتاب دوسری رائے کو ظاہر کہتی ہے، اور یہ سیدھی آنت اور مقعد کے لیے بہت نافع ہے {cite:canon-ibn-sina-print-v1 p.398}۔"
