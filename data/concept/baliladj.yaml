summary:
  ar: "قريب الطبع من الأملج، ولبّه حلو قريب من البندق، فيه قوة جلاءة ملطفة وقوة قابضة. بارد في الأولى يابس في الثانية. يقوّي المعدة بالدبغ والجمع وينفع من استرخائها ورطوبتها، ولا شيء أدبغ للمعدة منه، ويعقل البطن عند بعضهم، ويليّن عند آخرين، وهو نافع للمعي المستقيم والمقعدة جداً {cite:canon-ibn-sina-print-v1 p.398}."
  en: "Close in nature to the myrobalan, with a sweet kernel like the hazelnut. It has a light cleansing power and an astringent power. Cold in the first degree and dry in the second. It strengthens the stomach by tanning and binding, helps its looseness and moisture, and nothing tans the stomach better. Some say it binds the belly, others that it only softens it; the book prefers the latter, and it helps the straight intestine and the anus greatly {cite:canon-ibn-sina-print-v1 p.398}."
  fr: "Proche du myrobolan par sa nature, avec une amande douce semblable à la noisette. Il possède des pouvoirs légèrement nettoyant et astringent. Froid au premier degré et sec au deuxième, il fortifierait l’estomac en le tannant et le resserrant, aidant contre son relâchement et son humidité ; rien ne le tannerait mieux. Certains disent qu’il resserre le ventre, d’autres qu’il l’adoucit seulement ; le livre privilégie ce dernier avis et le dit très utile au rectum et à l’anus {cite:canon-ibn-sina-print-v1 p.398}."
  ur: "یہ املج کی طبیعت کے قریب ہے، اس کا مغز میٹھا اور بادام کے قریب ہے، اس میں ہلکی جلا دینے والی اور قابض قوت دونوں ہیں۔ پہلے درجے میں ٹھنڈا اور دوسرے میں خشک۔ یہ معدے کو دباغت اور جمع کرنے سے قوت دیتا ہے، اس کی ڈھیلاہٹ اور تری میں نفع دیتا ہے، اور معدے کو اس سے بہتر کوئی چیز نہیں دباغ کرتی۔ بعض کے نزدیک یہ پیٹ باندھتا ہے، اور دوسروں کے نزدیک صرف نرم کرتا ہے؛ کتاب دوسری رائے کو ظاہر کہتی ہے، اور یہ سیدھی آنت اور مقعد کے لیے بہت نافع ہے {cite:canon-ibn-sina-print-v1 p.398}۔"
  es: "De naturaleza similar al mirobalano, con una semilla dulce parecida a la de la avellana. Posee un ligero poder depurativo y astringente. Es frío en primer grado y seco en segundo. Fortalece el estómago curtiéndolo y aglutinándolo, favoreciendo su elasticidad e hidratación, y nada curte mejor el estómago. Algunos afirman que aglutina el vientre, otros que solo lo suaviza; el libro se inclina por esta última interpretación, y beneficia enormemente el intestino recto y el ano {cite:canon-ibn-sina-print-v1 p.398}."
  tr: "Doğası amlaj'a benzer, çekirdeği tatlı ve fındık benzeri, yatıştırıcı bir arındırıcı güç ve büzücü bir güce sahiptir. İlkinde soğuk, ikincisinde kurudur. Mideyi bronzlaştırma ve birleştirme yoluyla güçlendirir ve gevşeme, nemden faydalanır. Mideye daha bronzlaştırıcı bir şey yoktur. Bazıları için mideyi güçlendirir, bazılarında ise yumuşatır. Rektum ve bağırsaklar için çok faydalıdır (atıf: canon-ibn-sina-print-v1 s.398}."
  id: "Sifatnya mirip dengan amlaj, intinya manis dan mirip dengan hazelnut, dengan kekuatan menenangkan dan kekuatan astringen. Aromanya dingin pada yang pertama dan kering pada yang kedua. Ia memperkuat lambung dengan cara menyamak dan menggabungkan, serta mendapat manfaat dari relaksasi dan kelembapannya. Tidak ada yang lebih baik daripada penyamakan untuk perut. Ia memperkuat lambung bagi sebagian orang dan melunakkan lambung pada yang lain. Ini sangat bermanfaat untuk rektum dan usus (kutip: canon-ibn-sina-print-v1 hlm.398)."
