id: concept/kathrat-al-bisaq-wa-al-luab
class: concept
kind: scientific
label:
  ar: كثرة البصاق واللعاب وسيلانه في النوم
  en: Much spittle and saliva and its flow in sleep
  ur: تھوک اور لعاب کی کثرت اور نیند میں بہنا
  es: "Mucha saliva y esputo y su flujo durante el sueño"
  fr: "Beaucoup de salive et de mucus, et son écoulement pendant le sommeil"
  tr: "Aşırı tükürük, tükürük ve uykuda burun akıntısı"
  id: "Ludah, air liur, dan hidung meler berlebihan saat tidur"
summary:
  ar: قد يعرض كثرة البصاق وسيلان اللعاب في النوم من كثرة الحرارة والرطوبة وخصوصاً في المعدة وقد يكون لاستيلاء الحرارة ومنهم من فقد البصاق الدائم حتى يطعم فيهدأ ذلك منه وقد يعرض من بلغم أو من برد، وإن كان من حرارة فيجب أن يفصد الوريد المسمى في الكتاب أولاً ويستعمل الربوب الحامضة والفواكه الباردة القابضة ويجعل الغذاء من السمك واللحمان الخفيفة ويدام التمضمض بالسلاقات القابضة من هذا الجنس، وإن كان من برد وبلغم استعمل القيء بما تعلم واستعمل بعده الحارة من هذا الجنس وأما غذاؤه فالمطجنات بالأفاوية ويتجرع الماء الحار ويستاك قبيل النوم وقد جربت الفارة المشوية فوجدت نافعة وخصوصاً للصبيان ⁦(سطر موسوم مطروح لحكم المؤسس)⁩ {cite:canon-ibn-sina-print-v2 p.263} {cite:canon-ibn-sina-print-v2 p.264}
  en: 'Much spittle and saliva flowing in sleep may come from much heat and wetness, especially in the stomach, or from heat''s sway — and there is one whose constant spitting stops only when he eats — and it may come from phlegm or from cold. If from heat, the vein the book names is bled first, the sour rububs and cold astringent fruits used, the food made of fish and the light meats, and rinsing kept up with the astringent decoctions of this kind. If from cold and phlegm, vomiting is used as known, hot things of this kind after it; his food the spiced stews, hot water sipped, and the siwak before sleep; and the roasted mouse was tried and found beneficial, especially for children (a line kept as a labelled listing for the founder''s ruling; the recipes and drug names left out) {cite:canon-ibn-sina-print-v2 p.263} {cite:canon-ibn-sina-print-v2 p.264}'
  ur: 'بہت تھوک اور نیند میں لعاب کا بہنا زیادہ گرمی اور رطوبت سے ہو سکتا ہے خصوصاً معدہ میں، یا گرمی کے غلبے سے — اور کوئی ایسا بھی ہے جس کا مسلسل تھوکنا کھانے تک ہی ٹھہرتا ہے — اور بلغم یا سردی سے بھی ہو سکتا ہے؛ اگر گرمی سے ہو تو پہلے کتاب کی نامزد رگ کی فصد ہو، کھٹے ربوب اور ٹھنڈے قابض پھل استعمال ہوں، خوراک مچھلی اور ہلکے گوشت کی ہو اور اسی جنس کے قابض جوشاندوں سے مضمضہ قائم رہے؛ اگر سردی اور بلغم سے ہو تو معلوم طریقے سے قی استعمال ہو پھر اسی جنس کی گرم چیزیں؛ خوراک مصالحہ دار طبخ، گرم پانی گھونٹ گھونٹ اور سونے سے پہلے مسواک؛ اور بھنی چوہی آزمائی گئی اور نفع پائی گئی خصوصاً لڑکوں کے لیے ⁦(موسوم سطر بانی کے فیصلے کے لیے؛ نسخے اور ادویہ کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.263} {cite:canon-ibn-sina-print-v2 p.264}'
  es: "La abundante salivación durante el sueño puede provenir del calor y la humedad excesivos, especialmente en el estómago, o del calor sofocante —y hay quienes solo dejan de escupir cuando comen— y puede provenir de la flema o del frío. Si es por calor, primero se sangra la vena que menciona el libro, se usan ungüentos ácidos y frutas frías y astringentes, la comida consiste en pescado y carnes blancas, y se continúa con enjuagues con decocciones astringentes de este tipo. Si es por frío y flema, se usa el vómito como se sabe, después se consumen alimentos calientes de este tipo; su comida son los guisos especiados, se bebe agua caliente a sorbos y se toma el siwak antes de dormir; y el ratón asado fue probado y se encontró beneficioso, especialmente para los niños (una línea que se mantuvo como una lista etiquetada para la decisión del fundador; las recetas y los nombres de los medicamentos se omitieron) {cite:canon-ibn-sina-print-v2 p.263} {cite:canon-ibn-sina-print-v2 p.264}"
  fr: "Une salivation abondante pendant le sommeil peut être due à une forte chaleur et à une humidité importante, notamment au niveau de l'estomac, ou à l'influence de la chaleur – et il existe une personne dont la salive continue ne cesse que lorsqu'elle mange – et elle peut aussi être causée par des mucosités ou par le froid. Si elle est due à la chaleur, on commence par saigner la veine mentionnée dans le livre, puis on utilise des rububs acides et des fruits astringents froids, on privilégie les aliments à base de poisson et de viandes légères, et on poursuit les rinçages avec des décoctions astringentes de ce type. Si elle est due au froid et aux mucosités, on procède aux vomissements comme indiqué, puis on consomme des aliments chauds de ce type; son alimentation se compose de ragoûts épicés, on boit de l'eau chaude par petites gorgées et on prend du siwak avant de dormir. et la souris rôtie fut essayée et jugée bénéfique, surtout pour les enfants (une phrase conservée comme une liste légendée pour la décision du fondateur; les recettes et les noms de médicaments ont été omis) {cite:canon-ibn-sina-print-v2 p.263} {cite:canon-ibn-sina-print-v2 p.264}"
  tr: "Sık tükürme ve salya akıtma, özellikle midede aşırı ısı ve nem nedeniyle uykuya yol açabilir ve bu ısı tutulmasından kaynaklanabilir. Bazıları beslenmeye kadar kalıcı tükürük kaybedebilir, bu da sakinleşir. Ayrıca balgam veya soğuğa maruz kalabilirler. Eğer sıcaktan kaynaklanıyorsa, önce kitapta adı geçen damar döndürülmeli, ekşi meyve suyu ve soğuk, büzücü meyveler kullanılmalıdır. Yiyecek balık ve hafif etlerden oluşur ve bu tür büzücü çamurlarla sürekli durulama yapılır. Soğuk ve balgamlıysa, kusmayı Sonrasında bu cinsin acılı tarafını öğrendi ve kullandı, yemeği ise Avia ile baharatlı makarnaydı. Sıcak su içti ve uyumadan önce bir yudum aldı. Ben ızgara fareleri denedim ve özellikle erkekler için faydalı buldum (kurucu kuralı için etiketlenmiş bir satır) {cite:canon-ibn-sina-print-v2 s.263} {cite:canon-ibn-sina-print-v2 s.264}"
  id: "Sering meludah dan air liur dapat menyebabkan tidur karena panas dan kelembapan berlebihan, terutama di lambung, dan mungkin karena retensi panas. Beberapa mungkin kehilangan air liur permanen sampai diberi makan, yang kemudian mereda. Mereka juga bisa terpapar dahak atau dingin. Jika disebabkan oleh panas, pembuluh darah yang disebutkan dalam buku harus dipintal terlebih dahulu, dan jus asam serta buah dingin dan astringen harus digunakan. Makanan terdiri dari ikan dan daging ringan, dan bilas terus-menerus dengan lumpur astringen jenis ini. Jika dingin dan dahak, gunakan muntah sebagai Setelah itu, dia belajar dan menggunakan sisi pedas dari genus ini, sementara makanannya adalah pasta pedas bersama Avia. Dia minum air panas dan menyeruput sebelum tidur. Saya mencoba tikus panggang dan merasa sangat bermanfaat untuk anak laki-laki (kalimat yang diberi label untuk aturan pendiri) {cite:canon-ibn-sina-print-v2 hlm.263} {cite:canon-ibn-sina-print-v2 hlm.264}"
