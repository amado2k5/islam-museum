id: concept/wasat-fiqh
class: concept
kind: legal
label:
  ar: وَسط
  en: Wasat (the middle, moderation, the choice)
  es: "Wasat (el término medio, la moderación, la elección)"
  fr: "Wasat (le juste milieu, la modération, le choix)"
  ur: "وسعت ⁦(درمیانی، اعتدال، انتخاب)⁩"
summary:
  ar: 'الوسط في كلام الفقهاء يأتي بثلاثة معانٍ: المعتدل، والخيار، وما بين طرفي الشيء، ولا يخرج الاصطلاح عن اللغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188} والأصل أن الواجب في كل جنس وسطه، ومن تطبيقاته أن الواجب في زكاة الماشية الوسط، لقوله: «ولكن من وسط أموالكم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189} ويكون الجلد في الحدود والتعزير بسوط متوسط، لا جديد يجرح ولا خلق لا يؤلم، وتكون حجارة الرجم متوسطة كالكف، ويكون إطعام الكفارة من أوسط ما يطعم الأهل، وللفقهاء في تحديد ذلك خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} ويأتي الوسط بمعنى الخيار في الصلاة الوسطى، وفي تحديدها خلاف مفصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} وأما بمعنى ما بين الطرفين فيُندب وقوف الإمام في وسط الصف، ويُكره وقوفه في ميمنته أو ميسرته، ويندب وقوف إمامة النساء وسطهن، ويكره الأكل من وسط القصعة والخبز، والجلوس في وسط الحلقة يكره عند جمهور الفقهاء ويحرم عند بعض الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17191}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17192}'
  en: 'Wasat in the jurists'' usage has three senses: the moderate, the choice, and what lies between two ends. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188} The general rule is that what is due in each kind is its middling part; as an example, the zakat on livestock is the middling animal, on the report "but from the middle of your property". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189} Flogging for penalties and discretionary punishment uses a middling whip, neither new and cutting nor worn and painless; stones for stoning are the size of a palm; and the feeding in expiation is of the middle quality of food eaten by one''s household, a point on which the jurists differ in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} In the sense of choice, wasat is used of the middle prayer, on whose identity the jurists differ at length. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} In the sense of what lies between two ends, it is recommended that the imam stand in the middle of the row; standing at its right or left wing is reported as contrary to the sunna. Women''s imam stands in the middle of the women''s row. Eating from the middle of a dish or bread is disliked, and sitting in the middle of a circle is disliked by most jurists and forbidden by some Shafi''is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17191}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17192}'
  es: "Wasat en el uso de los juristas tiene tres sentidos: el moderado, la elección y lo que se encuentra entre dos extremos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188} La regla general es que lo que se debe en cada tipo es su parte media; como ejemplo, el zakat sobre el ganado es el animal medio, en el informe \"pero del medio de tu propiedad\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189} La flagelación para castigos y castigos discrecionales utiliza un látigo medio, ni nuevo y cortante ni desgastado e indoloro; las piedras para lapidar son del tamaño de una palma; y la alimentación en expiación es de calidad media de la comida consumida por uno en el hogar, un punto en el que los juristas difieren en detalle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} En el sentido de elección, wasat se usa para la oración del medio, sobre cuya identidad los juristas difieren extensamente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} En el sentido de lo que se encuentra entre dos extremos, se recomienda que el imán se coloque en el medio de la fila; se informa que colocarse en su ala derecha o izquierda es contrario a la sunna. El imán de las mujeres se coloca en el medio de la fila de mujeres. Comer del centro de un plato o pan es desaconsejable, y sentarse en el centro de un círculo es desaconsejable para la mayoría de los juristas y prohibido por algunos shafiíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17191}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17192}"
  fr: "Le terme « wasat », dans l'usage des juristes, a trois sens: la modération, le choix et ce qui se situe entre deux extrêmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188} La règle générale est que la part due pour chaque espèce est sa partie médiane; par exemple, la zakat sur le bétail est calculée sur l'animal moyen, conformément à la règle « mais à partir du milieu de votre propriété ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189} Les châtiments corporels, qu'ils soient appliqués à titre de peine ou de sanction discrétionnaire, utilisent un fouet de taille moyenne, ni neuf et tranchant, ni usé et indolore; les pierres utilisées pour la lapidation ont la taille d'une paume. L'offrande expiatoire consiste en des aliments de qualité moyenne, habituellement consommés par le foyer, un point sur lequel les juristes divergent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} Concernant le choix, le terme « wasat » désigne la prière du milieu, dont la nature exacte fait l'objet de nombreuses divergences entre les juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} Quant à la position intermédiaire, il est recommandé que l'imam se tienne au milieu de la rangée; se tenir à droite ou à gauche est considéré comme contraire à la sunna. L'imam des femmes se tient au milieu de la rangée des femmes. Il est déconseillé de manger au centre d'un plat ou d'un pain, et s'asseoir au centre d'un cercle est déconseillé par la plupart des juristes et interdit par certains chaféites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17191}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17192}"
  ur: "فقہا کے استعمال میں وسعت کے تین حواس ہیں: اعتدال، انتخاب، اور وہ چیز جو دو سروں کے درمیان ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17187}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17188} عام اصول یہ ہے کہ ہر قسم میں جو واجب ہے وہ اس کا درمیانی حصہ ہے۔ مثال کے طور پر، مویشیوں کی زکوٰۃ متوسط جانور ہے، رپورٹ میں \"لیکن آپ کے مال کے درمیان سے\"۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17188}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189} جرمانے اور صوابدیدی سزا کے لیے کوڑے مارنے کے لیے درمیانے کوڑے کا استعمال کیا جاتا ہے، نہ کوئی نیا اور نہ کاٹنے والا اور نہ ہی بے دردی سے۔ سنگساری کے لیے پتھر کھجور کے سائز کے ہوتے ہیں۔ اور کفارہ میں کھانا کھلانا اپنے گھر والوں کے کھانے کے درمیانی معیار کا ہے، جس پر فقہاء کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17189}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17190} انتخاب کے معنی میں وسعت درمیانی نماز کے لیے استعمال ہوتی ہے جس کی شناخت پر فقہا کا اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17190} دو سروں کے درمیان جو چیز ہے اس کے لحاظ سے امام کو صف کے بیچ میں کھڑا ہونا مستحب ہے۔ اس کے دائیں یا بائیں بازو پر کھڑا ہونا سنت کے منافی ہے۔ خواتین کا امام عورتوں کی صف کے درمیان میں کھڑا ہے۔ برتن یا روٹی کے درمیان سے کھانا ناپسند ہے اور دائرے کے بیچ میں بیٹھنا اکثر فقہاء کے نزدیک ناپسندیدہ ہے اور بعض شافعیوں نے اس سے منع کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17190}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17191}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17192}"
