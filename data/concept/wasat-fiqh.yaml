label:
  ar: وَسط
  en: Wasat (the middle, moderation, the choice)
summary:
  ar: 'الوسط في كلام الفقهاء يأتي بثلاثة معانٍ: المعتدل، والخيار، وما بين طرفي الشيء، ولا يخرج الاصطلاح عن اللغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188} والأصل أن الواجب في كل جنس وسطه، ومن تطبيقاته أن الواجب في زكاة الماشية الوسط، لقوله: «ولكن من وسط أموالكم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189} ويكون الجلد في الحدود والتعزير بسوط متوسط، لا جديد يجرح ولا خلق لا يؤلم، وتكون حجارة الرجم متوسطة كالكف، ويكون إطعام الكفارة من أوسط ما يطعم الأهل، وللفقهاء في تحديد ذلك خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} ويأتي الوسط بمعنى الخيار في الصلاة الوسطى، وفي تحديدها خلاف مفصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} وأما بمعنى ما بين الطرفين فيُندب وقوف الإمام في وسط الصف، ويُكره وقوفه في ميمنته أو ميسرته، ويندب وقوف إمامة النساء وسطهن، ويكره الأكل من وسط القصعة والخبز، والجلوس في وسط الحلقة يكره عند جمهور الفقهاء ويحرم عند بعض الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17191}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17192}'
  en: 'Wasat in the jurists'' usage has three senses: the moderate, the choice, and what lies between two ends. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17187}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188} The general rule is that what is due in each kind is its middling part; as an example, the zakat on livestock is the middling animal, on the report "but from the middle of your property". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17188}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189} Flogging for penalties and discretionary punishment uses a middling whip, neither new and cutting nor worn and painless; stones for stoning are the size of a palm; and the feeding in expiation is of the middle quality of food eaten by one''s household, a point on which the jurists differ in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17189}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} In the sense of choice, wasat is used of the middle prayer, on whose identity the jurists differ at length. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190} In the sense of what lies between two ends, it is recommended that the imam stand in the middle of the row; standing at its right or left wing is reported as contrary to the sunna. Women''s imam stands in the middle of the women''s row. Eating from the middle of a dish or bread is disliked, and sitting in the middle of a circle is disliked by most jurists and forbidden by some Shafi''is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17190}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17191}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17192}'
