id: concept/adl-bayn-al-zawjat
class: concept
kind: legal
label:
  ar: العدل بين الزوجات
  en: Justice among co-wives
  ur: بیویوں کے درمیان عدل
summary:
  ar: "عند الشعراوي أن العدل الذي يشترطه الشرع بين الزوجات المتعددات تسوية فيما يدخل في اختيار الزوج، كالمكان والزمان ومتاع البيت والنفقة، لا في ميل القلب الذي لا يملكه {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2003}."
  en: "For al-Sha'rawi, the justice the law requires among co-wives is equal treatment in what lies within the husband's choice: housing, time, household goods and provision, not the inclination of the heart, which is not in his power {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2003}."
  ur: "شعراوی کے نزدیک متعدد بیویوں کے درمیان وہ عدل جو شریعت لازم کرتی ہے ان امور میں برابری ہے جو شوہر کے اختیار میں ہوں، یعنی رہائش، وقت، گھر کا سامان اور نان نفقہ، دل کا میلان نہیں جو اس کے بس میں نہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2003}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "ما العدل الذي يشترطه الشرع بين الزوجات، وما الذي يخرج عن قدرة الزوج؟"
  en: "What justice does the law require among co-wives, and what lies beyond a husband's power?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-within-choice
    stance:
      ar: "العدل واجب فيما يدخل في اختيار الزوج، وميل القلب خارج التكليف"
      en: "Justice is required in what lies within the husband's choice; the inclination of the heart is beyond the duty"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الله أباح التعدد بشرط العدل، وأن العدل المطلوب تسوية فيما يملكه الزوج من مكان وزمان ومتاع ونفقة، ويستدل بالآية التي تنهى عن الميل الكامل، فلا يكلّف الله بما لا يُستطاع {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2001}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2003}."
      en: "Sha'rawi holds that God permitted plurality of wives on condition of justice, and that the justice required is equal treatment in what the husband controls: place, time, household goods and provision. He relies on the verse that forbids complete inclination, since God does not command what cannot be done {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2001}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2003}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: academic
    id: academic
    stance:
      ar: "قراءة أكاديمية لشروط العدل في التعدد لم تُضف بعد"
      en: "An academic reading of the conditions of justice in plurality is still to be added"
    summary:
      ar: "لم يُعرض في هذا الجزء من الكتاب رأي أكاديمي؛ يحتاج إلى مرجع محدد (needs_source)."
      en: "No academic reading is set out in this part of the book; it needs a named source (needs_source)."
    sources: []
