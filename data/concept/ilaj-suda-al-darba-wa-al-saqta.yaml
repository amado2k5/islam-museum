id: concept/ilaj-suda-al-darba-wa-al-saqta
class: concept
kind: scientific
label:
  ar: "علاج الصداع الكائن عن ضربة أو سقطة"
  en: "Treatment of headache from a blow or a fall"
  ur: "چوٹ یا گرنے سے ہونے والے صداع کا علاج"
  es: "Tratamiento del dolor de cabeza provocado por un golpe o una caída."
summary:
  ar: "يذكر ابن سينا أن غاية علاج الصداع من الضربة أو السقطة تسكين الوجع وإبعاد المادة عن موضع الألم وعلاج الجراحة، ويحذّر من الورم وما يزيده {cite:canon-ibn-sina-print-v2 p.67}"
  en: "Ibn Sina says that the aim in treating headache from a blow or a fall is to quiet the pain, keep the matter away from the place of pain and treat the wound, and he warns of swelling and of what increases it {cite:canon-ibn-sina-print-v2 p.67}"
  ur: "ابن سینا کہتا ہے کہ چوٹ یا گرنے سے ہونے والے صداع کے علاج کی غایت درد کو سکون دینا، مادے کو درد کی جگہ سے دور کرنا اور زخم کا علاج ہے، اور ورم سے اور اسے بڑھانے والی چیزوں سے خبردار کرتا ہے {cite:canon-ibn-sina-print-v2 p.67}۔"
  es: "Ibn Sina afirma que el objetivo al tratar el dolor de cabeza provocado por un golpe o una caída es calmar el dolor, alejar la sustancia del lugar del dolor y tratar la herida, y advierte sobre la hinchazón y lo que la incrementa {cite:canon-ibn-sina-print-v2 p.67}."
