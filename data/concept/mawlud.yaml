label: { ar: "المَوْلُود", en: "The newborn child (mawlud)", ur: "مولود ⁦(نومولود بچہ)⁩", es: "El niño recién nacido (mawlud)", fr: "Le nouveau-né (mawlud)", tr: "yenidoğan", id: "bayi baru lahir" }
summary:
  ar: "المولود هو الصبي الذي خرج من بطن أمه بعد تمام مدة الحمل، ويفرق عن السقط الذي ينزل قبل تمامها. وتثبت حياته بالرضاع أو الاستهلال أو الحركة أو السعال أو التنفس، فيثبت له أهلية الوجوب. فإن خرج حياً واستهل سُمّي وغُسّل وكُفّن وصُلي عليه ودُفن وورث وورّث عند جمهور الفقهاء، وتجب فيه الدية إن قتل، ويقع بولادته المعلّق من الطلاق والعتاق. ومن أحكامه المستحبة الأذان والإقامة في أذنيه وتحنيكه وحلق شعره وتسميته يوم السابع، وإخراج زكاة الفطر عنه، وختانه، وتثقيب أذن الصبية للزينة عند الحنفية والحنابلة، وإرضاعه وحضانته ونفقته، وتبعيته لأبويه في الإسلام، وأحكام بوله وريقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
  en: "The newborn (mawlud) is a child delivered after the full term of pregnancy; a miscarriage (saqt) comes out before the term is complete. Life is shown by suckling, a cry, movement, coughing or breathing, and with it comes capacity to hold rights. A child born alive who cries is named, washed, shrouded, prayed over, buried, and inherits and is inherited from, according to most jurists; blood-money is due if he is killed. His birth also takes effect on conditional divorces and manumissions. Recommended rites include the call to prayer in his ears, tahnik, shaving his head, naming him on the seventh day, the zakat al-fitr due for him, circumcision, and the piercing of a girl's ears for ornament; his feeding, custody and maintenance; his following of his parents in religion; and the rules on his urine and saliva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
  ur: "مولود وہ بچہ ہے جو مدتِ حمل پوری ہونے پر پیدا ہو، جبکہ سقط وہ ہے جو مدت پوری ہونے سے پہلے گرے۔ زندگی کی علامت رضاعت، استہلال ⁦(چیخنا)⁩، حرکت یا سانس سے ثابت ہوتی ہے، اور زندہ پیدا ہونے والا وارث بنتا اور وراثت پاتا ہے۔ جمہور کے نزدیک مرنے پر اسے غسل، کفن، نماز اور دفن دیا جاتا ہے، اور قتل کی صورت میں دیت واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
  es: "El recién nacido (mawlud) es un niño que nace después del término completo del embarazo; un aborto espontáneo (saqt) ocurre antes de que se complete el término. La vida se muestra a través de la succión, el llanto, el movimiento, la tos o la respiración, y con ella viene la capacidad de tener derechos. Un niño que nace vivo y llora es nombrado, lavado, amortajado, se reza por él, se le entierra y hereda y se hereda de él, según la mayoría de los juristas; se debe pagar una compensación por sangre si muere. Su nacimiento también tiene efecto en los divorcios condicionales y las manumisiones. Los ritos recomendados incluyen la llamada a la oración en sus oídos, el tahnik, el afeitado de su cabeza, nombrarlo al séptimo día, el zakat al-fitr que le corresponde, la circuncisión y la perforación de las orejas de una niña como adorno; su alimentación, custodia y manutención; que siga a sus padres en la religión; y las reglas sobre su orina y saliva. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15318} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15319} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
  fr: "Le nouveau-né (mawlud) est un enfant né à terme; une fausse couche (saqt) survient avant la fin de la grossesse. La vie se manifeste par la succion, les cris, les mouvements, la toux ou la respiration, et elle confère la capacité de posséder des droits. Un enfant né vivant et qui pleure reçoit un nom, est lavé, enveloppé d'un linceul, fait l'objet de prières, est enterré et, selon la plupart des juristes, hérite de lui et reçoit des biens; le prix du sang est dû s'il est tué. Sa naissance a également un effet sur les divorces conditionnels et les affranchissements. Les rites recommandés comprennent l'appel à la prière dans ses oreilles, le tahnik, le rasage de sa tête, le choix de son nom le septième jour, le versement de la zakat al-fitr qui lui est due, la circoncision et le perçage des oreilles d'une fille à titre d'ornement; son alimentation, sa garde et son entretien; son enseignement religieux, à l'instar de ses parents; et les règles relatives à son urine et à sa salive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
  tr: "Yeni doğan, hamilelik dönemi tamamlandıktan sonra annesinin rahminden doğan erkek çocuktur ve düşük, tamamlanmadan önce doğan düşükten ayrılır. Hayatı, emzirme, başlatma, hareket, öksürük veya nefes alma ile doğrulanır ve böylece yükümlülüğe uygunluğu belirlenir. Eğer hayatta çıkar ve başlatılırsa, çoğu hukukçuya göre adı verilir, yıkanır, kefenlenir, dua edilir, gömülür, miras alınır ve miras alınır. Kan parası ödenmesi gerekir öldürülür ve şartlı doğumu boşanma ve özgürlükten doğurur. Önerilen kurallar arasında ezan çağrısı, kulaklarına ikama yapılması, tıraş edilme, saçının tıraş edilmesi, yedinci gün isimlendirilmesi, ona zekat al-fitr verilmesi, sünnet edilmesi, kızın kulağını süslemek için deldirilmesi, emzirme, velayet ve bakım, İslam'da ebeveynlerine uymak ve idrar ile tükürüğü üzerindeki hükümler yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15320}"
  id: "Bayi baru lahir adalah anak laki-laki yang lahir dari rahim ibunya setelah masa kehamilan selesai, dan dibedakan dari keguguran yang terjadi sebelum masa kehamilan selesai. Hidupnya dikonfirmasi dengan menyusui, inisiasi, bergerak, batuk, atau bernapas, sehingga menetapkan kelayakannya untuk kewajiban. Jika dia keluar hidup dan diinisiasi, dia diberi nama, dicuci, dikabur, didoakan, dikuburkan, diwariskan, dan diwarisi menurut mayoritas ahli hukum. Uang darah harus dibayar jika dia dibunuh, dan kelahiran bersyarat berasal dari perceraian dan pembebasan. Di antara peraturan yang direkomendasikan adalah panggilan shalat, iqamah di telinga, mencukur, mencukur rambut, memberi nama pada hari ketujuh, membayar zakat al-fitr padanya, menyunat, menusuk telinga gadis untuk dihias menurut Hanafi dan Hanbali, menyusui, hak asuh, dan pemeliharaan, mengikuti orang tuanya dalam Islam, serta aturan tentang urin dan air liurnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
