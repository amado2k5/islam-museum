label: { ar: "المَوْلُود", en: "The newborn child (mawlud)", ur: "مولود (نومولود بچہ)" }
summary:
  ar: "المولود هو الصبي الذي خرج من بطن أمه بعد تمام مدة الحمل، ويفرق عن السقط الذي ينزل قبل تمامها. وتثبت حياته بالرضاع أو الاستهلال أو الحركة أو السعال أو التنفس، فيثبت له أهلية الوجوب. فإن خرج حياً واستهل سُمّي وغُسّل وكُفّن وصُلي عليه ودُفن وورث وورّث عند جمهور الفقهاء، وتجب فيه الدية إن قتل، ويقع بولادته المعلّق من الطلاق والعتاق. ومن أحكامه المستحبة الأذان والإقامة في أذنيه وتحنيكه وحلق شعره وتسميته يوم السابع، وإخراج زكاة الفطر عنه، وختانه، وتثقيب أذن الصبية للزينة عند الحنفية والحنابلة، وإرضاعه وحضانته ونفقته، وتبعيته لأبويه في الإسلام، وأحكام بوله وريقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
  en: "The newborn (mawlud) is a child delivered after the full term of pregnancy; a miscarriage (saqt) comes out before the term is complete. Life is shown by suckling, a cry, movement, coughing or breathing, and with it comes capacity to hold rights. A child born alive who cries is named, washed, shrouded, prayed over, buried, and inherits and is inherited from, according to most jurists; blood-money is due if he is killed. His birth also takes effect on conditional divorces and manumissions. Recommended rites include the call to prayer in his ears, tahnik, shaving his head, naming him on the seventh day, the zakat al-fitr due for him, circumcision, and the piercing of a girl's ears for ornament; his feeding, custody and maintenance; his following of his parents in religion; and the rules on his urine and saliva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
  ur: "مولود وہ بچہ ہے جو مدتِ حمل پوری ہونے پر پیدا ہو، جبکہ سقط وہ ہے جو مدت پوری ہونے سے پہلے گرے۔ زندگی کی علامت رضاعت، استہلال (چیخنا)، حرکت یا سانس سے ثابت ہوتی ہے، اور زندہ پیدا ہونے والا وارث بنتا اور وراثت پاتا ہے۔ جمہور کے نزدیک مرنے پر اسے غسل، کفن، نماز اور دفن دیا جاتا ہے، اور قتل کی صورت میں دیت واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15320}"
