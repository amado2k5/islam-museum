summary:
  ar: "هرطمان حبّه قوته قوة الشعير، وهو متوسط بين الحنطة والشعير، وسويقه أقبض من سويق الشعير، ويجفف بلا لذع وفيه تحليل وقبض. {cite:canon-ibn-sina-print-v1 p.450}"
  en: "Hartaman is oats; its grain has the strength of barley and sits between wheat and barley; its gruel is more astringent than barley gruel, and it dries without sting, resolving and astringent together. {cite:canon-ibn-sina-print-v1 p.450}"
  ur: "ہرطمان جئی ہے؛ اس کا دانہ جو کی قوت رکھتا ہے اور گیہوں اور جو کے درمیان ہے؛ اس کا ستو جو کے ستو سے زیادہ قابض ہے، اور بغیر جلن کے خشک کرتا ہے، اس میں تحلیل اور قبض دونوں ہیں۔ {cite:canon-ibn-sina-print-v1 p.450}"
  es: "El hartaman es avena; su grano tiene la fuerza de la cebada y se sitúa entre el trigo y la cebada; su papilla es más astringente que la de cebada y se seca sin picar, disolviéndose y siendo astringente a la vez. {cite:canon-ibn-sina-print-v1 p.450}"
  fr: "Hartaman est de l'avoine; son grain a la force de l'orge et se situe entre le blé et l'orge; sa bouillie est plus astringente que la bouillie d'orge, et elle sèche sans piquer, alliant résolution et astringence. {cite:canon-ibn-sina-print-v1 p.450}"
  tr: "Hartaman, arpa kadar dayanıklıdır ve buğday ile arpa arasında bir ara konumdadır. Sapı arpa sapından daha kalındır, kuruyur ve acı sokmaz, çözünmüş ve sağlamdır. {kaynak:canon-ibn-sina-print-v1 s.450}"
  id: "Hartaman memiliki kekuatan seperti jelai, dan berada di antara gandum dan jelai. Batangnya lebih tebal daripada batang jelai, kering tanpa perih, dan larut serta keras. {cite:canon-ibn-sina-print-v1 hlm.450}"
