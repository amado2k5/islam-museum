id: concept/irbah-fiqh
class: concept
kind: legal
label:
  ar: "إربة"
  en: "Irba (desire: men without sexual need and the rules on their gaze at women)"
  ur: "اربہ ⁦(حاجت: غیر اولی الاربہ مرد اور عورتوں کی طرف دیکھنے کے احکام)⁩"
  es: "Irba (deseo: hombres sin necesidad sexual y las reglas sobre su mirada hacia las mujeres)"
  fr: "Irba (désir: hommes sans besoin sexuel et les règles qui régissent leur regard sur les femmes)"
  tr: "Arrba"
  id: "Arrba"
summary:
  ar: "الإربة في الفقه الحاجة، وبخاصة الحاجة إلى النساء. وغير أولي الإربة من التابعين من الرجال من لا حاجة له بالنساء لعجز أو غفلة أو فقر، واختلف الفقهاء في تعيينهم. والراجح عند الحنفية أن الخصي والمجبوب والشيخ والعبد والمعتوه وغيرهم في النظر إلى الأجنبية كالفحل، وعند الجمهور حكم غير أولي الإربة حكم المحارم في النظر إلى موضع الزينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2089}"
  en: "In law, irba is need, especially need for women. Those men who follow a household without sexual need, through impotence, unawareness or poverty, are the 'men without need', and the jurists differ on whom they are. The sounder Hanafi view is that the eunuch, the castrated, the old man, the slave, the imbecile and similar men look at a non-kin woman as a full man does; the majority hold that such men are like kin in looking at a woman's places of adornment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2089}"
  ur: "فقہ میں اربہ حاجت کو کہتے ہیں، خاص کر عورتوں کی حاجت۔ غیر اولی الاربہ وہ مرد ہیں جو گھر کے تابع ہوں اور جنہیں عورتوں کی حاجت نہ ہو، کمزوری، سمجھ کی کمی یا فقر کی وجہ سے، اور فقہاء کا ان کے تعین میں اختلاف ہے۔ حنفیہ کے راجح قول کے مطابق خصی، مجبوب، بوڑھا، غلام، معتوہ اور اسی طرح کے لوگ غیر محرم عورت کو دیکھنے میں مرد کی طرح ہیں، جبکہ جمہور کے نزدیک ایسے مرد زینت کے مقامات دیکھنے میں محرم کی طرح ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2089}"
  es: "En derecho, irba significa necesidad, especialmente la necesidad de las mujeres. Aquellos hombres que viven en un hogar sin necesidad sexual, ya sea por impotencia, desconocimiento o pobreza, son los \"hombres sin necesidad\", y los juristas difieren en cuanto a quiénes son. La opinión más sólida de la escuela Hanafi es que el eunuco, el castrado, el anciano, el esclavo, el imbécil y hombres similares miran a una mujer que no es pariente como lo haría un hombre de verdad; la mayoría sostiene que tales hombres son como parientes al mirar las partes íntimas de una mujer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2089}"
  fr: "En droit, l'irba désigne le besoin, en particulier celui des femmes. Les hommes qui vivent dans un foyer sans besoin sexuel, par impuissance, ignorance ou pauvreté, sont qualifiés d'« hommes sans besoin », et les juristes divergent quant à leur définition. L'avis hanafite, plus solide, considère que l'eunuque, le castré, le vieillard, l'esclave, l'imbécile et les hommes similaires perçoivent une femme non apparentée comme un homme adulte; la majorité estime que ces hommes sont assimilés à des membres de la famille quant à la manière dont ils contemplent la parure d'une femme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2089}"
  tr: "Fıkıhta, 'irbah' ihtiyacı ifade eder, özellikle kadınlara olan ihtiyaç. Erkek takipçiler arasında 'irbah' sorumlusu olmayanlar, maluliyet, ihmal veya yoksulluk nedeniyle kadına ihtiyacı olmayanlardır. Hukukçular tanımlamalarında farklılık gösterir. Hanafiler arasında yaygın görüş, hadım, erkek, şeyh, köle, akıl hastası ve diğerlerinin bir aygır gibi olduğu yönündedir. Çoğunluğa göre, 'irbah' ile akraba olmayanların hükmü, süsleme yerinde mahramların hükmüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2089}"
  id: "Dalam hukum, 'irbah' merujuk pada kebutuhan, terutama kebutuhan akan wanita. Dan mereka yang tidak bertanggung jawab atas 'irbah' di antara pengikut pria adalah mereka yang tidak membutuhkan wanita karena ketidakmampuan, kelalaian, atau kemiskinan. Ahli hukum berbeda dalam penamaan mereka. Pandangan yang dominan di antara Hanafi adalah bahwa kasim, pria, sheikh, budak, orang yang sakit jiwa, dan lainnya ketika melihat wanita non-mahram adalah seperti kuda jantan. Menurut mayoritas, keputusan mereka yang tidak terkait dengan 'irbah' adalah aturan mahram ketika melihat tempat hiasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2089}"
