id: concept/irbah-fiqh
class: concept
kind: legal
label:
  ar: "إربة"
  en: "Irba (desire: men without sexual need and the rules on their gaze at women)"
  ur: "اربہ (حاجت: غیر اولی الاربہ مرد اور عورتوں کی طرف دیکھنے کے احکام)"
summary:
  ar: "الإربة في الفقه الحاجة، وبخاصة الحاجة إلى النساء. وغير أولي الإربة من التابعين من الرجال من لا حاجة له بالنساء لعجز أو غفلة أو فقر، واختلف الفقهاء في تعيينهم. والراجح عند الحنفية أن الخصي والمجبوب والشيخ والعبد والمعتوه وغيرهم في النظر إلى الأجنبية كالفحل، وعند الجمهور حكم غير أولي الإربة حكم المحارم في النظر إلى موضع الزينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2089}"
  en: "In law, irba is need, especially need for women. Those men who follow a household without sexual need, through impotence, unawareness or poverty, are the 'men without need', and the jurists differ on whom they are. The sounder Hanafi view is that the eunuch, the castrated, the old man, the slave, the imbecile and similar men look at a non-kin woman as a full man does; the majority hold that such men are like kin in looking at a woman's places of adornment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2089}"
  ur: "فقہ میں اربہ حاجت کو کہتے ہیں، خاص کر عورتوں کی حاجت۔ غیر اولی الاربہ وہ مرد ہیں جو گھر کے تابع ہوں اور جنہیں عورتوں کی حاجت نہ ہو، کمزوری، سمجھ کی کمی یا فقر کی وجہ سے، اور فقہاء کا ان کے تعین میں اختلاف ہے۔ حنفیہ کے راجح قول کے مطابق خصی، مجبوب، بوڑھا، غلام، معتوہ اور اسی طرح کے لوگ غیر محرم عورت کو دیکھنے میں مرد کی طرح ہیں، جبکہ جمہور کے نزدیک ایسے مرد زینت کے مقامات دیکھنے میں محرم کی طرح ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2089}"
