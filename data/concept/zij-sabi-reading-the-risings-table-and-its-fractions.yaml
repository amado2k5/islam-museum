id: concept/zij-sabi-reading-the-risings-table-and-its-fractions
class: concept
kind: scientific
label: { ar: "قراءة جدول المطالع وكسور الدرجات في الزيج الصابي", en: "Reading the risings table and the fractions of a degree", ur: "مطالع کے جدول کی قراءت اور درجے کے کسور", es: "Lectura de la tabla de ascensos y fracciones de grado.", fr: "Lire le tableau des élévations et les fractions d'un degré" }
summary:
  ar: "يعلّم البتاني كيف يُستخرج مطلع أي درجة من الجدول: يُطلب مثل الدرج المراد في سطر العدد المشترك في جدول مطالع البروج للإقليم المحدود أو في مطالع الفلك المستقيم، ويؤخذ ما بإزائه، فهو مطالع ما بين أول الحمل والدرجة في الإقليم، وما بين أول الجدي والدرجة في الفلك المستقيم. ثم تُضاف كسور الدرجة بنسبة تفاضل الأعداد، بدرجة أو بعشر درجات. {cite:zij-sabi-nallino-byblion pp.44-45}."
  en: "Al-Battani teaches how to take the rising of any degree from the table: look for the wanted degrees in the common-number row of the risings table for the given clime or for the right sphere and take what stands opposite; it is the risings between the first of Aries and the degree in the clime, and between the first of Capricorn and the degree in the right sphere. Then the fractions of the degree are added in proportion to the difference of the figures, over a step of one degree or of ten. {cite:zij-sabi-nallino-byblion pp.44-45}."
  ur: "البتانی سکھاتے ہیں کہ جدول سے کسی بھی درجے کا مطلع کیسے نکالا جائے: مطلوبہ درجوں کو مقررہ اقلیم کے بروج کے مطالع کے جدول یا فلک مستقیم کے مطالع کے مشترک عدد کی سطر میں تلاش کرو اور اس کے سامنے والا لو؛ وہ اقلیم میں حمل کے آغاز اور درجے کے درمیان کے مطالع ہیں اور فلک مستقیم میں جدی کے آغاز اور درجے کے درمیان کے۔ پھر درجے کے کسور اعداد کے تفاضل کی نسبت سے شامل کیے جاتے ہیں، چاہے وقفہ ایک درجے کا ہو یا دس کا۔ {cite:zij-sabi-nallino-byblion pp.44-45}۔"
  es: "Al-Battani enseña cómo obtener el ascendente de cualquier grado de la tabla: busque los grados deseados en la fila de números comunes de la tabla de ascendentes para el clima dado o para la esfera correcta y tome lo que se encuentra opuesto; son los ascendentes entre el primero de Aries y el grado en el clima, y entre el primero de Capricornio y el grado en la esfera correcta. Luego, las fracciones del grado se suman en proporción a la diferencia de las cifras, en pasos de un grado o de diez. {cite:zij-sabi-nallino-byblion pp.44-45}."
  fr: "Al-Battani explique comment calculer l'ascendant d'un degré à partir du tableau: repérer les degrés souhaités dans la ligne des nombres communs du tableau des ascendants pour le climat donné ou pour la sphère droite, et prendre le degré opposé; il s'agit de l'ascendant entre le premier signe du Bélier et le degré du climat, et entre le premier signe du Capricorne et le degré de la sphère droite. Ensuite, on ajoute les fractions du degré proportionnellement à la différence des valeurs, par incréments d'un degré ou de dix. {cite:zij-sabi-nallino-byblion pp.44-45}."
