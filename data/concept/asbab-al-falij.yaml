id: "concept/asbab-al-falij"
class: "concept"
kind: "scientific"
label:
  ar: "أسباب الفالج والاسترخاء"
  en: "Causes of palsy and relaxation"
  fr: "Causes de la paralysie et du relâchement"
  ur: "فالج اور استرخاء کے اسباب"
  es: "Causas de parálisis y relajación"
  tr: "Felç ve gevşeme nedenleri"
  id: "Penyebab kelumpuhan dan relaksasi"
summary:
  ar: "بطلان الحسّ والحركة يكون لأن الروح الحساس أو المتحرك إما محتبس عن النفوذ إلى الأعضاء، وإما نافذ لكن الأعضاء لا تتأثر منه لفساد مزاج؛ والفالج الأكثري يكون باحتباس الروح، وسبب الاحتباس الانسداد أو افتراق المسام والمنافذ بالقطع، والانسداد بانقباض المسام أو بامتناع خلط سادّ أو بورم جامع للأمرين {cite:canon-ibn-sina-print-v2 p.137}"
  en: "The lapse of sensation and motion is because the sensitive or motive spirit is either withheld from reaching the organs, or reaches them while they do not respond to it for corrupt temperament; the majority of palsy comes by the spirit's retention, whose cause is obstruction or the parting of the pores and passages by cutting, and obstruction is by contraction of the pores, or a blocking humour, or a swelling joining both {cite:canon-ibn-sina-print-v2 p.137}"
  fr: "La perte de sensibilité et de mouvement survient parce que l’esprit sensitif ou moteur est empêché d’atteindre les organes, ou les atteint sans qu’ils lui répondent en raison d’un tempérament corrompu ; la plupart des paralysies proviennent de la rétention de l’esprit, causée par une obstruction ou une séparation des pores et des voies par section ; l’obstruction vient d’une contraction des pores, d’une humeur qui les bouche ou d’un gonflement réunissant les deux {cite:canon-ibn-sina-print-v2 p.137}"
  ur: "حس اور حرکت کی باطلی اس لیے ہوتی ہے کہ حساس یا محرک روح یا تو اعضا تک نفوذ سے محتبس رہے، یا نفوذ کرے مگر اعضا فاسد مزاج کے سبب اس سے متاثر نہ ہوں؛ اور اکثری فالج روح کے احتباس سے ہوتا ہے، اور احتباس کا سبب انسداد ہے یا مسام اور منافذ کا قطع سے منتشر ہونا، اور انسداد مسام کے سکڑنے سے ہوتا ہے یا سادّ خلط سے یا ورم سے جو دونوں کو جمع کرے {cite:canon-ibn-sina-print-v2 p.137}۔"
  es: "La pérdida de sensibilidad y movimiento se debe a que el espíritu sensitivo o motriz se ve impedido de llegar a los órganos, o llega a ellos mientras no responden debido a un temperamento corrupto; la mayoría de las parálisis se producen por la retención del espíritu, cuya causa es la obstrucción o la separación de los poros y conductos por corte, y la obstrucción se produce por la contracción de los poros, o un humor bloqueador, o una inflamación que los une {cite:canon-ibn-sina-print-v2 p.137}"
  tr: "Duyu ve hareketin geçersizliği, hassas veya hareket eden ruhun organlara nüfuz etmesini engellemesi ya da geçirgen olması fakat ruh hali bozulması nedeniyle organların etkilenmemesi nedeniyle oluşur; felç çoğu ruhun tutulmasından kaynaklanır ve tutulmanın nedeni gözeneklerin ve portların kesilmesiyle ayrılması veya tıkanmasıdır; gözeneklerin daralması veya karışık konjugasyonun olmaması nedeniyle tıkanma, yani her iki faktörü birleştiren baskın bir tümör {cite:canon-ibn-sina-print-v2 s.137}"
  id: "Ketidakabsahan sensasi dan gerakan terjadi karena jiwa yang sensitif atau bergerak terblokir dari penetrasi ke organ, atau permeabel tetapi organ tidak terpengaruh karena kerusakan suasana hati; sebagian besar kelumpuhan terjadi karena retensi jiwa, dan penyebab retensi adalah penyumbatan atau pemisahan pori-pori dan port dengan potongan, dan penyumbatan oleh kontraksi pori-pori atau oleh tidak adanya konjugasi campuran, tumor dominan yang menggabungkan kedua faktor tersebut {cite:canon-ibn-sina-print-v2 hlm.137}"
