label:
  ar: محرمية الرضاع
  en: Milk-kinship prohibition (rada')
  es: "prohibición de parentesco por leche (rada')"
  fr: "Interdiction de la parenté du lait (rada')"
  ur: "دودھ اور رشتہ داری کی ممانعت"
  tr: "Emzirme Gizliliği"
  id: "Kerahasiaan Menyusui"
summary:
  ar: "محرمية الرضاع في الحديث الرابع والأربعين من زيادات ابن رجب: «الرضاعة تحرم ما تحرم الولادة» وفي لفظ «يحرم من الرضاعة ما يحرم من النسب» — أجمع العلماء على العمل بها في الجملة كما حكاه ابن رجب، فتثبت بالرضاعة المحرمية التي تثبت بالولادة في النكاح، فيحرم على الرضيع ما يحرم عليه لو كان ولداً من جهة المرضعة وأقاربها ومن جهة اللبن الفصل، وتقسيم المحرمات عند الشرح على مؤبد على الانفراد وغيره ينطبق على الرضاع كما ينطبق على النسب ⁦(جامع العلوم والحكم ص 864)⁩."
  en: "The prohibition effected by suckling in the forty-fourth hadith of Ibn Rajab's additions: 'suckling prohibits what birth prohibits', or in another wording 'what lineage prohibits is prohibited by suckling' — the scholars agreed on acting upon it in sum, as Ibn Rajab reports, so that suckling establishes in marriage the very prohibited degree that birth establishes: whatever would be forbidden to the nursling were he a son is forbidden through the nursing woman, her kin and the milk-father, and the commentary's division of the prohibited degrees — the everlasting individual prohibition and the rest — applies to milk as it applies to lineage (Jami' al-Ulum wal-Hikam p. 864)."
  es: "La prohibición efectuada por la lactancia en el hadiz número cuarenta y cuatro de las adiciones de Ibn Rajab: \"la lactancia prohíbe lo que prohíbe el nacimiento\", o en otra formulación \"lo que prohíbe el linaje está prohibido por la lactancia\", los eruditos coincidieron en actuar en consecuencia, como informa Ibn Rajab, de modo que la lactancia establece en el matrimonio el mismo grado prohibido que establece el nacimiento: lo que estaría prohibido para el lactante si fuera un hijo está prohibido a través de la mujer que lo amamanta, sus parientes y el padre de la leche, y la división de los grados prohibidos del comentario —la prohibición individual eterna y el resto— se aplica a la leche como se aplica al linaje (Jami' al-Ulum wal-Hikam p. 864)."
  fr: "L'interdiction liée à l'allaitement, mentionnée dans le quarante-quatrième hadith des ajouts d'Ibn Rajab: « l'allaitement interdit ce que la naissance interdit », ou en d'autres termes « ce que la lignée interdit est interdit par l'allaitement », a fait l'objet d'un consensus parmi les savants, comme le rapporte Ibn Rajab. Ainsi, l'allaitement établit dans le mariage le degré d'interdiction même que la naissance établit: tout ce qui serait interdit à l'enfant allaité s'il était un fils l'est également par la femme qui allaite, sa famille et le père du lait. La distinction faite par le commentaire entre les degrés d'interdiction – l'interdiction individuelle éternelle et les autres – s'applique au lait comme elle s'applique à la lignée (Jami' al-Ulum wal-Hikam p. 864)."
  ur: "ابن رجب کی اضافت کی چوالیسویں حدیث میں دودھ پلانے کی ممانعت: 'دودھ پلانے سے وہ چیز حرام ہے جو پیدائش سے منع کرتی ہے'، یا ایک اور لفظ میں 'دودھ پلانے سے کون سا نسب حرام ہے' - علماء کرام نے اس پر عمل کرنے پر اتفاق کیا، جیسا کہ ابن رجب نے روایت کیا ہے کہ نکاح کی سند ثابت ہے: دودھ پلانے والی پر جو کچھ بھی حرام ہو گا اگر وہ دودھ پلانے والی عورت، اس کے رشتہ دار اور دودھ پینے والے باپ کے ذریعہ بیٹا حرام ہے، اور ممنوعہ درجات کی تفاسیر - ہمیشہ رہنے والی انفرادی حرمت اور باقی - دودھ پر لاگو ہوتا ہے جیسا کہ نسب پر لاگو ہوتا ہے ⁦(جامع العلوم والحکام ص 864)⁩۔"
  tr: "İbn Receb'in kırk dördüncü hadisinde emzirmenin yasaklanması: \"Emzirme, doğumu yasaklayan şeyi yasaklar.\" \"Emzirme, soy tarafından yasak olanı yasaklar\" ifadesiyle — alimler oybirliğiyle genel olarak uygulanması konusunda hemfikirdir; İbn Receb tarafından bildirilmiştir. Bu, evlilikte doğumla belirlenen yasaklayıcı emzirme ile belirlenir. Böylece, bebek, emziren kadının ve onun akrabalarının tarafından ve ayrı süt açısından çocuk olduğunda yasak olan şeyler yasaktır. Yorumda yasakların kalıcı ve münhasır olarak bölünmesi, tıpkı soyun da geçerli olduğu gibi emzirme için de geçerlidir (Jami' al-Ulum wa al-Hikam, s. 864)."
  id: "Larangan menyusui dalam hadits keempat puluh empat dari tambahan Ibn Rajab: \"Menyusui melarang apa yang melarang persalinan.\" Dalam kata-katanya, \"Menyusui melarang apa yang dilarang oleh garis keturunan\" — para ulama sepakat untuk menerapkannya secara umum, seperti yang dilaporkan oleh Ibn Rajab. Hal ini ditetapkan oleh pelarangan menyusui yang ditetapkan melalui kelahiran dalam pernikahan. Dengan demikian, bayi dilarang melakukan apa yang dilarang baginya jika dia masih anak dari pihak wanita menyusui dan kerabatnya, serta dari sudut susu terpisah. Pembagian larangan dalam komentar menjadi permanen dan eksklusif, antara lain, berlaku untuk menyusui sama seperti berlaku untuk garis keturunan (Jami' al-Ulum wa al-Hikam, hlm. 864)."
