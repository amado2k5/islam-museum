label:
  ar: محرمية الرضاع
  en: Milk-kinship prohibition (rada')
summary:
  ar: "محرمية الرضاع في الحديث الرابع والأربعين من زيادات ابن رجب: «الرضاعة تحرم ما تحرم الولادة» وفي لفظ «يحرم من الرضاعة ما يحرم من النسب» — أجمع العلماء على العمل بها في الجملة كما حكاه ابن رجب، فتثبت بالرضاعة المحرمية التي تثبت بالولادة في النكاح، فيحرم على الرضيع ما يحرم عليه لو كان ولداً من جهة المرضعة وأقاربها ومن جهة اللبن الفصل، وتقسيم المحرمات عند الشرح على مؤبد على الانفراد وغيره ينطبق على الرضاع كما ينطبق على النسب (جامع العلوم والحكم ص 864)."
  en: "The prohibition effected by suckling in the forty-fourth hadith of Ibn Rajab's additions: 'suckling prohibits what birth prohibits', or in another wording 'what lineage prohibits is prohibited by suckling' — the scholars agreed on acting upon it in sum, as Ibn Rajab reports, so that suckling establishes in marriage the very prohibited degree that birth establishes: whatever would be forbidden to the nursling were he a son is forbidden through the nursing woman, her kin and the milk-father, and the commentary's division of the prohibited degrees — the everlasting individual prohibition and the rest — applies to milk as it applies to lineage (Jami' al-Ulum wal-Hikam p. 864)."
