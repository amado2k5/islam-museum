label: { ar: "عمر الدولة ثلاثة أجيال", en: "Dynasties live three generations", es: "Las dinastías perduran durante tres generaciones.", fr: "Les dynasties vivent trois générations", ur: "خاندانوں کی تین نسلیں رہتی ہیں۔", tr: "Eyalet üç nesildir", id: "Negara bagian ini berusia tiga generasi" }
summary:
  ar: "قاعدة ابن خلدون أن الدولة في الغالب لا تعدو أعمار ثلاثة أجيال، والجيل عمر شخص واحد من العمر الوسط وهو أربعون الذي هو انتهاء النمو والنشوء إلى غايته، ويؤيده حكمة التيه الذي وقع في بني إسرائيل أن المقصود بالأربعين فيه فناء الجيل الأحياء ونشأة جيل آخر لم يعهدوا الذل، فالجيل الأول لم يزالوا على خلق البداوة وخشونتها وتوحشها من شظف العيش والبسالة والاشتراك في المجد فسورة العصبية محفوظة فيهم، والجيل الثاني تحول حالهم بالملك والترفه من البداوة إلى الحضارة ومن الاشتراك في المجد إلى انفراد الواحد به وكسل الباقين فتنكسر سورة العصبية بعض الشيء ويبقى لهم الكثير منها بما أدركوا الجيل الأول، والجيل الثالث ينسون عهد البداوة كأن لم تكن ويبلغ فيهم الترف غايته فيصيرون عيالاً على الدولة ومن جملة النساء والولدان وتسقط العصبية بالجملة فيحتاج صاحب الدولة إلى الاستظهار بالموالي حتى يتأذن الله بانقراضها، وهذه الأجيال الثلاثة عمرها مائة وعشرون سنة، وهذا معنى ما يجري على الألسنة أن عمر الدولة مائة سنة، ومنه قانون تصحيح عمود النسب: لكل مائة من السنين ثلاثة من الآباء فإن نقصت بجيل غلط العدد بزيادة واحد وإن زادت سقط واحد {cite:muqaddima-ibn-khaldun p. 171-172}."
  en: "Three generations ≈ 120 years: desert-hard founders, softened heirs, luxury-bred heirs who lose ʿaṣabiyya entirely — the genealogy rule of three fathers per century {cite:muqaddima-ibn-khaldun p. 171-172}."
  es: "Tres generaciones ≈ 120 años: fundadores duros como el desierto, herederos ablandados, herederos criados en el lujo que pierden por completo la ʿaṣabiyya: la regla genealógica de tres padres por siglo {cite:muqaddima-ibn-khaldun p. 171-172}."
  fr: "Trois générations ≈ 120 ans: fondateurs robustes du désert, héritiers adoucis, héritiers élevés dans le luxe qui perdent entièrement l'ʿaṣabiyya — la règle généalogique de trois pères par siècle {cite: muqaddima-ibn-khaldun p. 171-172}."
  ur: "تین نسلیں ≈ 120 سال: صحرا کے سخت بانی، نرم وارث، عیش و عشرت کے وارث جو عصابیہ کو مکمل طور پر کھو دیتے ہیں - فی صدی تین باپوں کا نسب نامہ۔ 171-172}۔"
  tr: "İbn Haldun'un ilkesi, devletin genellikle üç nesil yaşam süresini geçmediği, tek bir orta yaşlı kişinin yaşının ise kırk olmasının büyüme ve kalkınmanın nihai hedefine sonunu işaret ettiğini belirtir. Bu, İsrailoğulları arasında yaşanan karmaşanın bilgeliğiyle desteklenir; kırk yıl, yaşayan neslin yok olması ve hiç aşağılanmamış başka bir neslin ortaya çıkması anlamına gelmiştir. İlk kuşak, yaşamın zorlukları, cesareti ve şan paylaşımı nedeniyle göçebeliğin doğasını, sertliğini ve vahşetini korudu; çünkü Asabaya bölümü onlarda korunurken, ikinci kuşak devletlerini krallığa ve lükse dönüştürdü Göçebelikten medeniyete, birinin yalnızlığına ve diğerlerinin tembelliğine kadar ihtişamdan medeniyete kadar, kabileciliğin bölümü biraz parçalanmış ve çoğu ilk kuşağı deneyimledikleri gibi onlar için kalır. Üçüncü nesil, göçebelik çağını sanki hiç var olmamış gibi unutur ve lüks zirveye ulaşır, devletin çocukları olur, kadınlar ve çocuklar arasında, kabilecilik tamamen çöker. Devletin yöneticisi, Tanrı izin verene kadar mawli'ye güvenmek zorundadır. Bu üç nesil yüz yirmi yaşındadır ve yaygın olarak söylenen şeyin anlamı budur: çağ Devlet yüz yıldır ve buradan soy sütununu düzelten kanun vardır: her yüz yıl için üç baba eksiktir; bir nesil azalırsa sayı yanlıştır, bir artar; artarsa bir kaybolur. {atıf:muqaddima-ibn-khaldun s. 171-172}."
  id: "Prinsip Ibn Khaldun adalah bahwa negara biasanya tidak melebihi tiga generasi umur hidup, dan usia satu orang paruh baya, yaitu empat puluh tahun, yang menandai akhir dari pertumbuhan dan perkembangan menuju tujuan akhirnya. Hal ini didukung oleh kebijaksanaan kebingungan yang terjadi di antara Anak-anak Israel, bahwa empat puluh tahun berarti pemusnahan generasi hidup dan munculnya generasi lain yang tidak pernah mengalami penghinaan. Generasi pertama masih mempertahankan sifat nomaden, kekasaran, dan keganasan karena kesulitan hidup, keberanian, dan berbagi kemuliaan, karena bab Asabaya terlestari di dalamnya, sementara generasi kedua mengubah negara mereka menjadi raja dan kemewahan Dari nomadisme ke peradaban, dari berbagi kemuliaan ke kesendirian satu dan kemalasan yang lain, bab tribalisme agak terputus, dan banyak yang tersisa bagi mereka seperti yang mereka alami generasi pertama. Generasi ketiga melupakan era nomadisme seolah-olah tidak pernah ada, dan kemewahan mencapai puncaknya, menjadi anak-anak negara, di antara perempuan dan anak-anak, dan tribalism benar-benar runtuh. Penguasa negara harus mencari ketergantungan pada mawli sampai Tuhan mengizinkan kepunahan mereka. Ketiga generasi ini berusia seratus dua puluh tahun, dan inilah makna dari apa yang sering dikatakan: bahwa zaman Keadaan adalah seratus tahun, dan dari sini berasal hukum yang mengoreksi kolom garis keturunan: untuk setiap seratus tahun, tiga bapak hilang; jika berkurang satu generasi, jumlahnya salah, satu kali meningkat; jika meningkat, satu hilang. {cite:muqaddima-ibn-khaldun hlm. 171-172}."
