id: concept/umr-al-dawla
class: concept
kind: term
label: { ar: "عمر الدولة ثلاثة أجيال", en: "Dynasties live three generations" }
summary:
  ar: "قاعدة ابن خلدون أن الدولة في الغالب لا تعدو أعمار ثلاثة أجيال، والجيل عمر شخص واحد من العمر الوسط وهو أربعون الذي هو انتهاء النمو والنشوء إلى غايته، ويؤيده حكمة التيه الذي وقع في بني إسرائيل أن المقصود بالأربعين فيه فناء الجيل الأحياء ونشأة جيل آخر لم يعهدوا الذل، فالجيل الأول لم يزالوا على خلق البداوة وخشونتها وتوحشها من شظف العيش والبسالة والاشتراك في المجد فسورة العصبية محفوظة فيهم، والجيل الثاني تحول حالهم بالملك والترفه من البداوة إلى الحضارة ومن الاشتراك في المجد إلى انفراد الواحد به وكسل الباقين فتنكسر سورة العصبية بعض الشيء ويبقى لهم الكثير منها بما أدركوا الجيل الأول، والجيل الثالث ينسون عهد البداوة كأن لم تكن ويبلغ فيهم الترف غايته فيصيرون عيالاً على الدولة ومن جملة النساء والولدان وتسقط العصبية بالجملة فيحتاج صاحب الدولة إلى الاستظهار بالموالي حتى يتأذن الله بانقراضها، وهذه الأجيال الثلاثة عمرها مائة وعشرون سنة، وهذا معنى ما يجري على الألسنة أن عمر الدولة مائة سنة، ومنه قانون تصحيح عمود النسب: لكل مائة من السنين ثلاثة من الآباء فإن نقصت بجيل غلط العدد بزيادة واحد وإن زادت سقط واحد {cite:muqaddima-ibn-khaldun p. 171-172}."
  en: "Three generations ≈ 120 years: desert-hard founders, softened heirs, luxury-bred heirs who lose ʿaṣabiyya entirely — the genealogy rule of three fathers per century {cite:muqaddima-ibn-khaldun p. 171-172}."
