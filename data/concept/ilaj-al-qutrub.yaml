id: concept/ilaj-al-qutrub
class: concept
kind: scientific
label:
  ar: "علاج القطرب"
  en: "Treatment of qutrub"
  ur: "قطرب کا علاج"
  es: "Tratamiento de qutrub"
  fr: "Traitement du qutrub"
  tr: "Al-Quterb'in Tedavisi"
  id: "Pengobatan Al-Quterb"
summary:
  ar: "يذكر ابن سينا أن علاج القطرب هو علاج المالنخوليا إذا كان من صفراء أو سوداء محترقة، وأن تمام علاجه الترطيب والتنويم وتقوية القلب؛ ولا تُنقل الوصفات ولا الإجراءات {cite:canon-ibn-sina-print-v2 p.111} {cite:canon-ibn-sina-print-v2 p.112}"
  en: "Ibn Sina says the treatment of qutrub is the treatment of melancholia when it is from bile or burnt black bile, and that its completion is moistening, sleep and strengthening of the heart; recipes and procedures are not reproduced {cite:canon-ibn-sina-print-v2 p.111} {cite:canon-ibn-sina-print-v2 p.112}"
  ur: "ابن سینا کہتا ہے کہ قطرب کا علاج وہی مالنخولیا کا علاج ہے جب وہ صفراء یا جلے ہوئے سودا سے ہو، اور اس کی تکمیل تر کرنا، نیند اور دل کو قوت دینا ہے؛ نسخے اور کارروائیاں نقل نہیں کی گئیں {cite:canon-ibn-sina-print-v2 p.111} {cite:canon-ibn-sina-print-v2 p.112}۔"
  es: "Ibn Sina afirma que el tratamiento del qutrub es el tratamiento de la melancolía cuando esta proviene de la bilis o de bilis negra quemada, y que su culminación consiste en humedecer el corazón, dormir y fortalecerlo; las recetas y los procedimientos no se reproducen {cite:canon-ibn-sina-print-v2 p.111} {cite:canon-ibn-sina-print-v2 p.112}"
  fr: "Ibn Sina affirme que le traitement du qutrub est celui de la mélancolie d'origine biliaire ou de bile noire brûlée, et qu'il se termine par l'hydratation, le sommeil et le renforcement du cœur; les recettes et les procédés ne sont pas reproduits. {cite:canon-ibn-sina-print-v2 p.111} {cite:canon-ibn-sina-print-v2 p.112}"
  tr: "İbn Sina, el-Qatrab tedavisinin sarı veya siyah yanıklı melankolinin tedavisi olduğunu, tam tedavinin ise hidrasyon, hipnoz ve kalbi güçlendirmek olduğunu belirtir; ne reçeteler ne de prosedürler aktarılmazdır {cite:canon-ibn-sina-print-v2 s.111} {cite:canon-ibn-sina-print-v2 s.112}"
  id: "Ibn Sina menyebutkan bahwa pengobatan untuk al-Qatrab adalah pengobatan melankolia jika terbakar kuning atau hitam, dan pengobatan lengkapnya adalah hidrasi, hipnosis, dan penguatan jantung; baik resep maupun prosedur tidak diteruskan {cite:canon-ibn-sina-print-v2 hlm.111} {cite:canon-ibn-sina-print-v2 hlm.112}"
