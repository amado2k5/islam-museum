label:
  ar: "علاج القطرب"
  en: "Treatment of qutrub"
  ur: "قطرب کا علاج"
summary:
  ar: "يذكر ابن سينا أن علاج القطرب هو علاج المالنخوليا إذا كان من صفراء أو سوداء محترقة، وأن تمام علاجه الترطيب والتنويم وتقوية القلب؛ ولا تُنقل الوصفات ولا الإجراءات {cite:canon-ibn-sina-print-v2 p.111} {cite:canon-ibn-sina-print-v2 p.112}"
  en: "Ibn Sina says the treatment of qutrub is the treatment of melancholia when it is from bile or burnt black bile, and that its completion is moistening, sleep and strengthening of the heart; recipes and procedures are not reproduced {cite:canon-ibn-sina-print-v2 p.111} {cite:canon-ibn-sina-print-v2 p.112}"
  ur: "ابن سینا کہتا ہے کہ قطرب کا علاج وہی مالنخولیا کا علاج ہے جب وہ صفراء یا جلے ہوئے سودا سے ہو، اور اس کی تکمیل تر کرنا، نیند اور دل کو قوت دینا ہے؛ نسخے اور کارروائیاں نقل نہیں کی گئیں {cite:canon-ibn-sina-print-v2 p.111} {cite:canon-ibn-sina-print-v2 p.112}۔"
