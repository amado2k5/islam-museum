label:
  ar: يوم القيامة
  en: The Day of Resurrection (Yawm al-Qiyama)
  ur: یوم قیامت
summary:
  ar: "يوم القيامة في العقيدة السنية: الإيمان بالبعث وجزاء الأعمال والعرض والحساب وقراءة الكتاب والثواب والعقاب والصراط والميزان {cite:aqida-tahawiyya §105}، والإيمان بأشراط الساعة من خروج الدجال ونزول عيسى وطلوع الشمس من مغربها وخروج دابة الأرض {cite:aqida-tahawiyya §129}."
  en: "The Day of Resurrection in Sunni creed: belief in the raising, the requital of deeds, the presentation, the reckoning, the reading of the book, reward and punishment, the sirat and the scales {cite:aqida-tahawiyya §105}; and belief in the signs of the Hour — the Dajjal's emergence, the descent of 'Isa, the sun rising from the west, and the Beast of the earth {cite:aqida-tahawiyya §129}."
