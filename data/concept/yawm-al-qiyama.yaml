id: concept/yawm-al-qiyama
education:
  did_you_know:
    ar: "الإيمان بيوم القيامة عند أهل السنة يشمل البعث وجزاء الأعمال والعرض والحساب وقراءة الكتاب والثواب والعقاب والصراط والميزان، وأشراط الساعة من الدجال ونزول عيسى."
    en: "Sunni belief in the Day of Resurrection covers the raising, requital of deeds, the presentation, reckoning, reading of the book, reward and punishment, the Sirat and the Balance — and the Hour's signs: the Dajjal and Isa's descent."
    ur: "اہلِ سنت کے نزدیک روزِ قیامت پر ایمان میں مردوں کی اٹھائی، اعمال کا بدلہ، پیشی، حساب، نامۂ اعمال کا پڑھنا، ثواب و عقاب، صراط اور میزان شامل ہیں — اور قیامت کی نشانیاں: دجال اور عیسیٰ کا نزول۔"
    sources: [source/aqida-tahawiyya, source/sharh-tahawiyya-ibn-abi-al-izz]
