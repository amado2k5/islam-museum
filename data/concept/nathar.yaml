label: { ar: "النَّثَار", en: "Scattered gifts (nathar)", ur: "نثار ⁦(بکھیری ہوئی چیزیں)⁩", es: "Regalos dispersos (nathar)", fr: "Cadeaux dispersés (nathar)" }
summary:
  ar: "النثار في اللغة ما يُنثر، أي يُرمى متفرقاً، كالجوز واللوز والسكر والدراهم. ويفرّق بينه وبين التوزيع، وهو القسمة. وفي حكم الانتهاب فيه خلاف: فالحديث النهبة لا تحل يدل على المنع، والحنفية يجيزونه إذا أذن صاحبه، فمن أخذ منه شيئاً ملكه، ومن وقع في حجره أو ذيله ملكه إن قصد أخذه أو بسط حجره له، والمالكية يحرمون أن يأخذ الإنسان أكثر مما يأكله مع أصحابه إذا نثر ليؤكل، ويكرهون الانتهاب إلا ما أذن فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15493} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495}"
  en: "Nathar, in the lexicon, is the scattering of a thing, such as nuts, almonds, sugar or coins. It is different from tawzi' (sharing out). On whether a scattering may be seized, the hadith that plunder is not lawful points to a ban. The Hanafis allow it if the giver permits, and what one takes becomes one's own; if it falls in one's lap or on one's garment, it is one's own if one meant to take it or spread a lap for it. The Malikis forbid taking more than one eats with one's companions when a thing is scattered to be eaten, and dislike scrambling for it unless permission was given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15493} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495}"
  ur: "نثار سے مراد وہ چیزیں ہیں جو خوشی کے موقع پر بکھیری جائیں۔ حدیث «نہب لینا حلال نہیں» منع کی دلیل ہے۔ حنفیہ کے نزدیک جائز ہے جب دینے والا اجازت دے، اور جو لے وہ اس کا ہو جاتا ہے۔ مالکیہ کے نزدیک جو اس لیے بکھیری جائے کہ مل کر کھائی جائے، اس میں زیادہ لینا حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15493} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495}"
  es: "En el léxico, nathar se refiere a la dispersión de algo, como nueces, almendras, azúcar o monedas. Es diferente de tawzi' (repartir). Respecto a si se puede tomar algo de lo que se ha dispersado, el hadiz que prohíbe el saqueo apunta a una prohibición. Los hanafíes lo permiten si quien lo da lo autoriza, y lo que uno toma se convierte en propio; si cae en el regazo o en la ropa, es propio si se pretendía tomarlo o extender el regazo para recogerlo. Los malikíes prohíben tomar más de lo que se come con los compañeros cuando algo se ha dispersado para ser comido, y desaprueban la disputa por ello a menos que se haya dado permiso. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15493} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15494} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495}"
  fr: "Nathar, dans le lexique, désigne le fait de disperser une chose, comme des noix, des amandes, du sucre ou des pièces de monnaie. Cela diffère de tawzi' (partager). Quant à savoir si l'on peut s'emparer de ce qui a été dispersé, le hadith interdisant le pillage indique une interdiction. Les hanafites l'autorisent si le donateur y consent, et ce que l'on prend devient propriété; si la chose tombe sur les genoux ou sur un vêtement, elle nous appartient si l'on avait l'intention de la prendre ou de l'accueillir. Les malikites interdisent de prendre plus qu'une portion consommée avec ses compagnons lorsqu'une chose a été dispersée pour être mangée, et désapprouvent qu'on se la dispute sans permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15493} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495}"
