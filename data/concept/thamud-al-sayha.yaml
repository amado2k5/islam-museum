label:
  ar: صيحة ثمود
  en: The blast that destroyed Thamud
  ur: ثمود کی چیخ
  es: "La explosión que destruyó Thamud"
  fr: "L'explosion qui a détruit Thamud"
summary:
  ar: "أهلك الله ثمود بالصيحة أو بالرجفة بعد أن عقروا الناقة: فأصبحوا في ديارهم جاثمين، وأنجى الله صالحًا والذين آمنوا معه من خزي يومئذ."
  en: "God destroyed Thamud with the Cry — or the quake — after they hamstrung the she-camel: by morning they lay fallen in their homes, while God saved Salih and those who believed with him."
  ur: "اللہ نے ثمود کو چیخ یا زلزلے سے ہلاک کیا جب انہوں نے اونٹنی معذور کی: صبح وہ اپنے گھروں میں جھکے پڑے تھے، اور اللہ نے صالح اور ان کے ساتھی مومنوں کو اس دن کی رسوائی سے بچایا۔"
  es: "Dios destruyó a Thamud con el Grito —o el terremoto— después de que derribaron a la camella: por la mañana yacían caídos en sus casas, mientras que Dios salvó a Salih y a los que creyeron con él."
  fr: "Dieu détruisit les Thamud par le Cri — ou le tremblement de terre — après qu'ils eurent blessé la chamelle par les jarrets: au matin, ils gisaient à terre dans leurs maisons, tandis que Dieu sauva Salih et ceux qui croyaient avec lui."
