summary:
  ar: "أهلك الله ثمود بالصيحة أو بالرجفة بعد أن عقروا الناقة: فأصبحوا في ديارهم جاثمين، وأنجى الله صالحًا والذين آمنوا معه من خزي يومئذ."
  en: "God destroyed Thamud with the Cry — or the quake — after they hamstrung the she-camel: by morning they lay fallen in their homes, while God saved Salih and those who believed with him."
  ur: "اللہ نے ثمود کو چیخ یا زلزلے سے ہلاک کیا جب انہوں نے اونٹنی معذور کی: صبح وہ اپنے گھروں میں جھکے پڑے تھے، اور اللہ نے صالح اور ان کے ساتھی مومنوں کو اس دن کی رسوائی سے بچایا۔"
