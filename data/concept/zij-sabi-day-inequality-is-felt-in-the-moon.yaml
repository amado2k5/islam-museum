id: concept/zij-sabi-day-inequality-is-felt-in-the-moon
class: concept
kind: scientific
label: { ar: "اختلاف الأيام يظهر في القمر", en: "The inequality of days is felt in the Moon", ur: "دنوں کا اختلاف چاند میں ظاہر ہوتا ہے", es: "La desigualdad de los días se siente en la Luna.", fr: "L'inégalité des jours se ressent dans la Lune" }
summary:
  ar: "يقول البتاني إن الأيام المختلفة والوسطى في سير الشمس وغيرها من الكواكب ليس لها مقدار يتبين من قبله حال محسوس، وأما في القمر فهو ظاهر جداً لسرعة حركته، إذ أكثر ما يجتمع بين الأيام المختلفة والوسطى قريب من نصف ساعة، وتكون حركة القمر في بعض الأوقات في هذه المدة مقدار اثنتي عشرة دقيقة {cite:zij-sabi-nallino-byblion p.78}."
  en: "Al-Battani says that in the motion of the Sun and the other planets the unequal and mean days carry no amount that gives a perceptible effect, while in the Moon it is very clear for the swiftness of its motion, since the most that gathers between the unequal and mean days is close to half an hour, and in this span the Moon's motion is at some times about twelve minutes {cite:zij-sabi-nallino-byblion p.78}."
  ur: "البتانی کہتے ہیں کہ سورج اور دوسرے سیاروں کی چال میں غیر مساوی اور وسطی دنوں کی کوئی ایسی مقدار نہیں جس سے محسوس اثر ظاہر ہو، جبکہ چاند میں یہ اس کی حرکت کی تیزی کی وجہ سے بہت ظاہر ہے، کیونکہ غیر مساوی اور وسطی دنوں کے بیچ زیادہ سے زیادہ جو جمع ہوتا ہے وہ تقریباً آدھا گھنٹہ ہے، اور اس مدت میں چاند کی حرکت بعض اوقات تقریباً بارہ دقیقے ہوتی ہے {cite:zij-sabi-nallino-byblion p.78}۔"
  es: "Al-Battani dice que en el movimiento del Sol y los demás planetas los días desiguales y medios no llevan una cantidad que dé un efecto perceptible, mientras que en la Luna es muy claro por la rapidez de su movimiento, ya que lo máximo que se acumula entre los días desiguales y medios es cerca de media hora, y en este lapso el movimiento de la Luna es en algunos momentos de unos doce minutos {cite:zij-sabi-nallino-byblion p.78}."
  fr: "Al-Battani affirme que dans le mouvement du Soleil et des autres planètes, les jours inégaux et moyens n'ont pas d'effet perceptible, tandis que dans celui de la Lune, cela est très clair en raison de la rapidité de son mouvement, puisque l'écart maximal entre les jours inégaux et moyens est proche d'une demi-heure, et dans cet intervalle, le mouvement de la Lune est parfois d'environ douze minutes {cite:zij-sabi-nallino-byblion p.78}."
