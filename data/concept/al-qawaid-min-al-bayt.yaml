id: concept/al-qawaid-min-al-bayt
class: concept
kind: doctrine
label: { ar: "رفع القواعد من البيت: من بنى الكعبة", en: "Raising the foundations of the House: who built the Ka'ba", fr: "Relever les fondations de la Maison : qui a construit la Kaaba ?", es: "Levantando los cimientos de la Casa: ¿quién construyó la Kaaba?", ur: "خانہ کعبہ کی بنیادیں اٹھانا: کعبہ کی تعمیر کس نے کی۔", tr: "Evden temelleri yükseltmek: Kabe'yi kim inşa etti", id: "Membangun fondasi dari rumah: Siapa yang membangun Ka'bah" }
summary:
  ar: "يذكر الشعراوي أن البيت كان موجوداً قبل إبراهيم، وأن الله أفرده للطواف والعكوف والصلاة بعد أن غمر الطوفان معالمه، وأن إبراهيم لم يبن البيت ابتداءً وإنما رفع قواعده ليُعرف مكانه، واستدل بأن الكعبة ليست البيت ذاته بل المكين الذي يدل عليه. وينقل أن العلماء اختلفوا في زمن بناء البيت. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.575}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.579}"
  en: "Sha'rawi holds that the House existed before Abraham, that God set it apart for circling, retreat and prayer after the flood had erased its landmarks, and that Abraham did not found it but raised its foundations so its place would be known. He reads the Ka'ba as the place that marks the House rather than the House itself, and reports that scholars differ on when the House was built {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.575}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.579}."
  fr: "Sha‘rawi estime que la Maison existait avant Abraham, que Dieu l’a réservée à la circumambulation, à la retraite et à la prière après que le Déluge en eut effacé les repères, et qu’Abraham n’a pas fondé la Maison, mais en a relevé les fondations afin d’en faire connaître l’emplacement. Il comprend la Kaaba comme le lieu qui signale la Maison plutôt que comme la Maison elle-même, et rapporte que les savants divergent sur la date de construction de la Maison {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.575}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.579}."
  es: "Sha'rawi sostiene que la Casa existía antes de Abraham, que Dios la apartó para la circunvalación, el retiro y la oración después de que el diluvio borrara sus hitos, y que Abraham no la fundó, sino que levantó sus cimientos para que se conociera su ubicación. Él interpreta la Kaaba como el lugar que marca la Casa, más que la Casa misma, e informa que los eruditos difieren sobre cuándo se construyó la Casa {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.575}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.579}."
  ur: "شعراوی کا خیال ہے کہ گھر ابراہیم سے پہلے موجود تھا، کہ خدا نے اسے سیلاب کے نشانات مٹانے کے بعد اسے چکر لگانے، اعتکاف اور نماز کے لیے الگ کر دیا، اور ابراہیم نے اسے نہیں پایا بلکہ اس کی بنیادیں اٹھائیں تاکہ اس کا مقام معلوم ہو۔ وہ خانہ کعبہ کو اس جگہ کے طور پر پڑھتا ہے جو خانہ کی بجائے خود خانہ کی نشان دہی کرتا ہے، اور رپورٹ کرتا ہے کہ علمائے کرام کا اس بات پر اختلاف ہے کہ خانہ کب بنایا گیا تھا صفحہ 578 {حوالہ:تفسیر-شعروی-خواطر-اسکین-pp-501-1000 p.579}۔"
  tr: "El-Şaarawi, Ev'in İbrahim'den önce var olduğunu ve Tanrı'nın tufandan sonra Tavaf, Akkuf ve duaya adadığını belirtir. İbrahim evi ilk başta inşa etmedi, ancak temellerini yerini öğrenmek için yükseltti ve Kabe'nin evin kendisi değil, onu gösteren sağlam yapı olduğunu savundu. Âlimlerin Evin inşası zamanı konusunda farklı görüşler yaşadığını bildirir. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.575} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.578} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.579}"
  id: "Al-Shaarawi menyatakan bahwa Rumah itu sudah ada sebelum Abraham dan Tuhan mendedikasikannya untuk Tawaf, Akkuf, dan doa setelah banjir. Ibrahim awalnya tidak membangun rumah itu tetapi mengangkat fondasinya untuk mengetahui lokasinya dan berargumen bahwa Ka'bah bukanlah rumah itu sendiri melainkan struktur kokoh yang mewakilinya. Ia melaporkan bahwa para ulama memiliki pendapat berbeda tentang masa pembangunan Rumah tersebut. {cite:tafsir-sharawi-khawatir-scan-pp-pp-501-1000 hlm.575} {cite:tafsir-sharawi-khawatir-scan-pp-pp-1000 hlm.578} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 hlm.579}"
