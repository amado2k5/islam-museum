id: concept/al-qawaid-min-al-bayt
class: concept
kind: doctrine
label: { ar: "رفع القواعد من البيت: من بنى الكعبة", en: "Raising the foundations of the House: who built the Ka'ba" }
summary:
  ar: "يذكر الشعراوي أن البيت كان موجوداً قبل إبراهيم، وأن الله أفرده للطواف والعكوف والصلاة بعد أن غمر الطوفان معالمه، وأن إبراهيم لم يبن البيت ابتداءً وإنما رفع قواعده ليُعرف مكانه، واستدل بأن الكعبة ليست البيت ذاته بل المكين الذي يدل عليه. وينقل أن العلماء اختلفوا في زمن بناء البيت. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.575}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.579}"
  en: "Sha'rawi holds that the House existed before Abraham, that God set it apart for circling, retreat and prayer after the flood had erased its landmarks, and that Abraham did not found it but raised its foundations so its place would be known. He reads the Ka'ba as the place that marks the House rather than the House itself, and reports that scholars differ on when the House was built {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.575}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.579}."
wings: [ideas]
themes: [sacred-space-and-pilgrimage, prophets]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "هل بنى إبراهيم البيت ابتداءً، أم كان البيت موجوداً فرفع قواعده؟"
  en: "Did Abraham build the House from the beginning, or did he raise the foundations of a House that already existed?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-house-prior
    stance:
      ar: "البيت كان قبل إبراهيم، ورفعُ القواعد إظهارٌ لمكانه لا إنشاءٌ له"
      en: "The House existed before Abraham; raising the foundations was making its place visible, not founding it"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الطوفان أخفى معالم البيت، فأظهره الله بيد إبراهيم، واستدل بقوله تعالى في دعاء إبراهيم عند بيت الله المحرّم حين أسكن هاجر وابنها، وبأن الكعبة قد ارتفع حولها البناء فالساجد يتوجه إلى الجو أو المكين. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.579}"
      en: "Sha'rawi holds that the flood hid the landmarks of the House and that God made its place known through Abraham's hand. He cites Abraham's prayer when he left Hajar and her child by the sacred House, and the rise of buildings around the Ka'ba, so that one who prays above it faces the air above and one who prays below faces the place that marks it {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.579}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "أقوال المفسرين والمؤرخين في الباني الأول للبيت ومدة بنائه لم تُدخل بعد من مصادرها"
      en: "The exegetes' and historians' accounts of the first builder of the House and the length of its construction are not yet entered from their sources"
    holders: []
    summary:
      ar: "يقرر الشعراوي أن العلماء اختلفوا: فبعضهم يرى بدء البناء في زمن إبراهيم، وبعضهم من عهد آدم، وفريق من قبل آدم. ولم تُدخل بعد أقوال هؤلاء من مصادرها، ولا الرأي الأكاديمي أو الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.578}"
      en: "Sha'rawi reports that scholars differ: some date the building to Abraham's time, some to Adam, and some to before Adam. These positions are not yet entered from their sources, nor the academic view or other views."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
