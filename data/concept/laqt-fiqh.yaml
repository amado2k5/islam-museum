id: concept/laqt-fiqh
class: concept
kind: legal
label:
  ar: "اللَّقْط"
  en: "Piecing the clean days (laqt, talfiq), fiqh rulings"
  ur: "لقط (تلفیق، فقہی احکام)"
summary:
  ar: "اللَّقْط في اللغة أخذ الشيء من الأرض وجمعه، وكل نثارة من سنبل أو تمر لقط؛ وعند الفقهاء أخذ أيام النقاء بين الدمين والحكم عليها بالطهر، وأخذ أزمنة الدم والحكم عليها بالحيض، ويُسمى هذا القول بالتلفيق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13663}. والسحب إعطاء النقاء المتخلل حكم الحيض، وهو الضد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13663}."
  en: "Laqt, in lexicon, is taking a thing up from the ground and gathering it; any scattering of ears of grain or dates is laqt. In law it is taking the clean days between two bloods and judging them pure, or taking the days of blood and judging them menses; this view is called talfiq, piecing. Sahb is giving the interval the rule of menses, the opposite {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13663}."
  ur: "لقط لغت میں زمین سے کوئی چیز اٹھانے اور جمع کرنے کو کہتے ہیں، اور سنبل یا کھجور کا ہر بکھرا ہوا دانہ لقط ہے؛ فقہاء کے نزدیک یہ دو خونوں کے درمیان پاکی کے دنوں کو لے کر انہیں پاک قرار دینا، یا خون کے دنوں کو لے کر انہیں حیض قرار دینا ہے، اور اس قول کو تلفیق بھی کہتے ہیں۔ سحب اس کا ضد ہے، یعنی درمیانی پاکی کو حیض کا حکم دینا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13663}۔"
