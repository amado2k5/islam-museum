summary:
  ar: "في الفصول العاشر والحادي عشر والثاني عشر يذكر ابن سينا أن زوال الوضع يكون بتمدد أو حركة عنيفة أو سبب مرخ مرطب أو سبب مفسد لجوهر الرباط، وأن سوء المجاورة المانع للمقاربة أو للمباعدة سببه غلظ أو أثر قرحة أو تشنج أو استرخاء أو جفاف الخلط أو ولادة {cite:canon-ibn-sina-print-v1 pp.145-146}."
  en: "In chapters 10 to 12 Ibn Sina says displacement of position comes from stretching, violent movement, a relaxing and moistening cause, or a cause that spoils the substance of the ligament, and that bad apposition that prevents bringing together or moving apart of limbs is caused by thickness, scar of an ulcer, spasm, slackness, drying and hardening of humour in the joint, or birth {cite:canon-ibn-sina-print-v1 pp.145-146}."
