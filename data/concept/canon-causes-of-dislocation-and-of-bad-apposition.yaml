id: concept/canon-causes-of-dislocation-and-of-bad-apposition
class: concept
kind: scientific
label:
  ar: "أسباب الخلع وسوء المجاورة عند ابن سينا"
  en: "The causes of dislocation and of bad apposition of limbs in the Canon"
  fr: "Causes de luxation et de mauvaise apposition dans le Canon"
  ur: "جوڑ کھسکنے اور ناموزوں پڑوس کے اسباب، قانون کے مطابق"
  es: "Las causas de la dislocación y de la mala aposición de las extremidades en el Canon"
  tr: "İbn Sina'ya göre khul' ve kötü komşuluk nedenleri"
  id: "Alasan khul' dan kebaikan tetangga menurut Ibn Sina"
summary:
  ar: "في الفصول العاشر والحادي عشر والثاني عشر يذكر ابن سينا أن زوال الوضع يكون بتمدد أو حركة عنيفة أو سبب مرخ مرطب أو سبب مفسد لجوهر الرباط، وأن سوء المجاورة المانع للمقاربة أو للمباعدة سببه غلظ أو أثر قرحة أو تشنج أو استرخاء أو جفاف الخلط أو ولادة {cite:canon-ibn-sina-print-v1 pp.145-146}."
  en: "In chapters 10 to 12 Ibn Sina says displacement of position comes from stretching, violent movement, a relaxing and moistening cause, or a cause that spoils the substance of the ligament, and that bad apposition that prevents bringing together or moving apart of limbs is caused by thickness, scar of an ulcer, spasm, slackness, drying and hardening of humour in the joint, or birth {cite:canon-ibn-sina-print-v1 pp.145-146}."
  fr: "Aux chapitres 10 à 12, Ibn Sina attribue les déplacements à traction, mouvement violent, relâchement humide ou corruption du ligament ; les mauvaises appositions empêchant rapprochement ou écartement des membres, à épaisseur, cicatrice, spasme, relâchement, dessèchement et durcissement humoral articulaire, ou naissance {cite:canon-ibn-sina-print-v1 pp.145-146}."
  es: "En los capítulos 10 a 12, Ibn Sina dice que el desplazamiento de la posición proviene del estiramiento, el movimiento violento, una causa de relajación y humectación, o una causa que daña la sustancia del ligamento, y que la mala aposición que impide juntar o separar las extremidades es causada por el grosor, la cicatriz de una úlcera, el espasmo, la laxitud, la sequedad y el endurecimiento del humor en la articulación, o el nacimiento {cite:canon-ibn-sina-print-v1 pp.145-146}."
  ur: "ابن سینا ابواب 10 تا 12 میں کہتا ہے کہ پوزیشن کی نقل مکانی کھینچنے، پرتشدد حرکت، آرام دہ اور نم کرنے والی وجہ سے ہوتی ہے، یا ایسی وجہ جو بند کے مادے کو خراب کر دیتی ہے، اور وہ خراب لگائی جو اعضاء کو اکٹھا کرنے یا الگ ہونے سے روکتی ہے، موٹائی، زخم کے زخم، جوڑوں کی خشکی، سوکھے پن، اسپاس کی وجہ سے ہوتی ہے۔ یا پیدائش {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 145-146}۔"
  tr: "Onuncu, on birinci ve on ikinci bölümlerde İbn Sina, doğumun sonunun gerilme, şiddetli hareket, nemlendirici bir gevşeme veya bağın özünü bozan bir nedenle gerçekleştiğini ve yaklaşmayı ya da ayrılmayı engelleyen zayıf yakınlığın kalınlaşma, ülser, spazm, gevşeme, mizahın kurulukluğu veya doğum izi olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.145-146}."
  id: "Dalam bab sepuluh, sebelas, dan dua belas, Ibn Sina menyebutkan bahwa akhir persalinan terjadi dengan peregangan, gerakan keras, relaksasi yang melembapkan, atau penyebab yang merusak esensi ligamen, dan bahwa kedekatan yang buruk yang menghalangi pendekatan atau pemisahan disebabkan oleh penebalan, tanda tukak lambung, kejang, relaksasi, kekeringan humor, atau persalinan {cite:canon-ibn-sina-print-v1 hlm.145-146}."
