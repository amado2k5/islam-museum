summary:
  ar: "اللبن في اللغة سائل أبيض يكون في إناث الآدميين والحيوان، وهو اسم جنس جمعه ألبان؛ واللبأ أوله عند الولادة، ولبن كل شجرة ماؤها على التشبيه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13567}."
  en: "Laban, in lexicon, is a white liquid in female humans and animals, a collective noun in plural alban; lubaʾ is the first of it after birth; the sap of a tree is also called laban {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13567}."
  ur: "لبن لغت میں انسانی عورتوں اور جانوروں کا سفید رقیق مادہ ہے، اسم جنس ہے اور جمع البان ہے؛ لبأ اس کا پہلا حصہ ہے جو ولادت کے بعد نکلتا ہے؛ اور ہر درخت کا پانی بھی تشبیہاً لبن کہلاتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13567}۔"
