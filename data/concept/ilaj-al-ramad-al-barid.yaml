id: "concept/ilaj-al-ramad-al-barid"
class: "concept"
kind: "scientific"
label:
  ar: "علاج الرمد البارد"
  en: "Treating the cold ophthalmia"
  ur: "سرد رمد کا علاج"
  es: "Tratamiento de la oftalmía por frío"
  fr: "Traitement de l'ophtalmie au froid"
summary:
  ar: "الرمد الكائن من الأسباب الباردة يستفرغ الخلط البارد وربما احتيج إلى التكرير مشروباً أو محتقناً أو غرغرة وأول العلاج بالرادعات التي ليست بالباردة جداً ولكن التي فيها تلطيف ما ثم ما يسخن برفق ⁦(أسماء الأدوية والشيافات والمياه والمقادير لا تحمل)⁩ والتدبير اللطيف والحمام والشراب الصرف الأبيض ينفع هؤلاء {cite:canon-ibn-sina-print-v2 p.174} {cite:canon-ibn-sina-print-v2 p.175}"
  en: "Ramad arising from cold causes: the cold humour is evacuated, repetition of drink, clyster or gargle being sometimes needed; treatment opens with repellents that are not too cold yet carry some attenuation, then gentle warmers ⁦(drug, collyrium and water names and measures are not carried)⁩; the gentle regimen, the bath and pure white wine benefit them {cite:canon-ibn-sina-print-v2 p.174} {cite:canon-ibn-sina-print-v2 p.175}"
  ur: "سرد اسباب سے ہونے والا رمد: سرد خلط کا استفراغ کیا جاتا ہے اور کبھی مشروب، محتقن یا غرارے کی تکرار ضرورت پڑتی ہے؛ علاج کا آغاز ایسے روادع سے ہوتا ہے جو نہایت سرد نہ ہوں مگر جن میں کچھ تلطیف ہو، پھر نرم مسخنات ⁦(ادویہ، شیافوں اور پانیوں کے نام اور مقدار منقول نہیں)⁩؛ نرم تدبیر، حمام اور خالص سفید شراب ان کو نفع دیتی ہے {cite:canon-ibn-sina-print-v2 p.174} {cite:canon-ibn-sina-print-v2 p.175}"
  es: "Ramadán causado por el frío: se evacua el humor frío, siendo a veces necesario repetir la ingesta de líquidos, enemas o gárgaras; el tratamiento comienza con repelentes que no son demasiado fríos pero que tienen cierta atenuación, luego calentadores suaves (no se incluyen nombres ni medidas de medicamentos, colirios ni agua); el régimen suave, el baño y el vino blanco puro les benefician {cite:canon-ibn-sina-print-v2 p.174} {cite:canon-ibn-sina-print-v2 p.175}"
  fr: "Les troubles liés au froid (ramad) sont évacués; il est parfois nécessaire de répéter la prise de boissons, un lavement ou un gargarisme. Le traitement commence par des répulsifs ni trop froids ni trop forts, mais légèrement adoucissants, puis par des réchauffants doux (les noms et les dosages des médicaments, collyres et eaux ne sont pas précisés). Ce régime doux, le bain et le vin blanc pur leur sont bénéfiques. {cite:canon-ibn-sina-print-v2 p.174} {cite:canon-ibn-sina-print-v2 p.175}"
