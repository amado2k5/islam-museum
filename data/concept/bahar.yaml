label:
  ar: "بهار"
  en: "Bahar (eye-of-the-ox, a flowering herb)"
  fr: "Bahar (œil-de-bœuf, plante à fleurs)"
  ur: "بہار ⁦(گاؤ چشم)⁩"
  es: "Bahar (ojo de buey, una hierba con flores)"
summary:
  ar: "هو الذي يسمّى كاوجشم، أي عين البقر، ورده أصفر، وورقه أحمر الوسط، وهو أسمن من ورق البابونج. حار في الثانية يابس في الأولى. ينفع شمّه من الرياح الغليظة في الرأس {cite:canon-ibn-sina-print-v1 p.400}."
  en: "The plant the book calls kawjashm, meaning eye of the ox. Its flower is yellow and its leaf has a red middle, and it is fuller than chamomile leaf. Hot in the second degree and dry in the first. Smelling it helps thick wind in the head {cite:canon-ibn-sina-print-v1 p.400}."
  fr: "Plante que le livre nomme kawjashm, signifiant œil-de-bœuf. Sa fleur est jaune, sa feuille rouge au centre et plus fournie que celle de la camomille. Chaude au deuxième degré et sèche au premier, elle est dite utile, par son odeur, aux vents épais de la tête {cite:canon-ibn-sina-print-v1 p.400}."
  ur: "یہ وہ پودا ہے جسے کاوجشم کہا جاتا ہے، یعنی گائے کی آنکھ۔ اس کا پھول زرد اور پتے کا درمیانی حصہ سرخ ہے، اور یہ بابونج کے پتے سے زیادہ موٹا ہے۔ دوسرے درجے میں گرم اور پہلے میں خشک۔ اسے سونگھنے سے سر کی گاڑھی ہوا میں نفع ہوتا ہے {cite:canon-ibn-sina-print-v1 p.400}۔"
  es: "La planta que el libro llama kawjashm, que significa ojo de buey. Su flor es amarilla y su hoja tiene el centro rojo; es más frondosa que la hoja de manzanilla. Es cálida en el segundo grado y seca en el primero. Olerla ayuda a aliviar la congestión nasal {cite:canon-ibn-sina-print-v1 p.400}."
