label:
  ar: "فن التأليف عند طارق السويدان"
  en: "The art of authorship (Tareq al-Suwaidan)"
  ur: "طارق السویدان کے ہاں فنِ تالیف"
summary:
  ar: "طريقة طارق السويدان في تأليف «كتب المعرفة» كما يعلّمها في أكاديمية إعداد القادة: من اختيار الموضوع والأهداف المكتوبة وجمع المراجع، إلى قانون «ثلاثة إلى خمسة» في الفهرس، والكتابة والتدقيق والطبعة الثانية."
  en: "Tareq al-Suwaidan's method for writing a 'knowledge book' as he teaches it in the Leaders' Academy: from choosing the topic, written goals and gathering references, to his 'three-to-five' law for the table of contents, drafting, outside review and the second edition."
  ur: "طارق السویدان کا «علمی کتاب» لکھنے کا طریقہ جیسا وہ قائدین کی اکیڈمی میں سکھاتے ہیں: موضوع کے انتخاب، لکھے ہوئے اہداف اور حوالوں کی جمع آوری سے لے کر فہرست کے لیے «تین سے پانچ» کے قانون، مسودے، بیرونی جانچ اور دوسرے ایڈیشن تک۔"
