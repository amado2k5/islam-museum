label:
  fr: "Art d’écrire un livre selon Tareq al-Suwaidan"
  ar: "فن التأليف عند طارق السويدان"
  en: "The art of authorship (Tareq al-Suwaidan)"
  ur: "طارق السویدان کے ہاں فنِ تالیف"
summary:
  fr: "L'art de composer un livre est l'atelier où [[person/tariq-al-suwaidan|Tareq al-Suwaidan]] enseigne l'écriture aux stagiaires de [[work/leadership-development-academy-1-program|the Leaders' Academy]]. Il le place avant la prise de parole, car l'orateur en a besoin. {cite:assabile-tareq-al-suwaidan leadership-development-academy-1/ep04 00:02:00} Il distingue livres pour enfants, récits et romans, et ouvrages de connaissance ; il ne traite que les derniers et dit ne connaître aucun livre arabe enseignant leur rédaction. {cite:assabile-tareq-al-suwaidan leadership-development-academy-1/ep04 00:04:00} {cite:assabile-tareq-al-suwaidan leadership-development-academy-1/ep04 00:05:30} Sa méthode va du choix du sujet à la réimpression ; pratique et chiffres sont les siens. Pour une conception arabe bien plus ancienne des sujets méritant un livre, voir [[concept/aqsam-al-talif-saba|the seven kinds of authorship]]."
  ar: "طريقة طارق السويدان في تأليف «كتب المعرفة» كما يعلّمها في أكاديمية إعداد القادة: من اختيار الموضوع والأهداف المكتوبة وجمع المراجع، إلى قانون «ثلاثة إلى خمسة» في الفهرس، والكتابة والتدقيق والطبعة الثانية."
  en: "Tareq al-Suwaidan's method for writing a 'knowledge book' as he teaches it in the Leaders' Academy: from choosing the topic, written goals and gathering references, to his 'three-to-five' law for the table of contents, drafting, outside review and the second edition."
  ur: "طارق السویدان کا «علمی کتاب» لکھنے کا طریقہ جیسا وہ قائدین کی اکیڈمی میں سکھاتے ہیں: موضوع کے انتخاب، لکھے ہوئے اہداف اور حوالوں کی جمع آوری سے لے کر فہرست کے لیے «تین سے پانچ» کے قانون، مسودے، بیرونی جانچ اور دوسرے ایڈیشن تک۔"
