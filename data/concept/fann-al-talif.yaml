label:
  ar: "فن التأليف عند طارق السويدان"
  en: "The art of authorship (Tareq al-Suwaidan)"
  ur: "طارق السویدان کے ہاں فنِ تالیف"
  es: "El arte de la autoría (Tareq al-Suwaidan)"
  fr: "L'art de l'écriture (Tareq al-Suwaidan)"
  tr: "Tariq Al-Suwaidan'a Göre Yazarlık Sanatı"
  id: "Seni Kepenulisan menurut Tariq Al-Suwaidan"
summary:
  ar: "طريقة طارق السويدان في تأليف «كتب المعرفة» كما يعلّمها في أكاديمية إعداد القادة: من اختيار الموضوع والأهداف المكتوبة وجمع المراجع، إلى قانون «ثلاثة إلى خمسة» في الفهرس، والكتابة والتدقيق والطبعة الثانية."
  en: "Tareq al-Suwaidan's method for writing a 'knowledge book' as he teaches it in the Leaders' Academy: from choosing the topic, written goals and gathering references, to his 'three-to-five' law for the table of contents, drafting, outside review and the second edition."
  ur: "طارق السویدان کا «علمی کتاب» لکھنے کا طریقہ جیسا وہ قائدین کی اکیڈمی میں سکھاتے ہیں: موضوع کے انتخاب، لکھے ہوئے اہداف اور حوالوں کی جمع آوری سے لے کر فہرست کے لیے «تین سے پانچ» کے قانون، مسودے، بیرونی جانچ اور دوسرے ایڈیشن تک۔"
  es: "El método de Tareq al-Suwaidan para escribir un \"libro de conocimiento\", tal como lo enseña en la Academia de Líderes: desde la elección del tema, los objetivos escritos y la recopilación de referencias, hasta su regla de \"tres a cinco\" para el índice, la redacción, la revisión externa y la segunda edición."
  fr: "La méthode de Tareq al-Suwaidan pour écrire un « livre de connaissances » telle qu'il l'enseigne à l'Académie des leaders: du choix du sujet, des objectifs écrits et de la collecte des références, à sa loi des « trois à cinq » pour la table des matières, la rédaction, la relecture externe et la deuxième édition."
  tr: "Tariq Al-Suwaidan'ın Liderlik Hazırlık Akademisi'nde öğretilen 'bilgi kitapları' yazma yöntemi: konu ve yazılı hedeflerin seçilmesinden referans toplanmasına kadar, dizinleme, yazma, düzeltme ve ikinci baskıda 'üçten beşe' kuralına kadar."
  id: "Metode Tariq Al-Suwaidan dalam menulis 'buku pengetahuan' seperti yang diajarkan di Leadership Preparation Academy: mulai dari memilih topik dan tujuan tertulis serta mengumpulkan referensi, hingga aturan 'tiga sampai lima' dalam pengindeksan, penulisan, proofreading, dan edisi kedua."
