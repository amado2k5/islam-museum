id: concept/himmat-al-nafs
class: concept
kind: ethical
label:
  ar: "علو الهمة"
  en: "High aspiration (himma)"
  ur: "بلند ہمتی"
  es: "Alta aspiración (himma)"
  fr: "Haute aspiration (himma)"
summary:
  ar: "علو الهمة كما يعرضه الشيخ عمر عبد الكافي: أن النفوس الكبيرة تتعب في سبيل غاياتها، وأن صاحب الهدف لا يقنع بالدون، وأن الهمة تظهر في السؤال والعطاء وتحديد الهدف، مع قول لابن الجوزي لم يُتحقق من نسبته بعد."
  en: "High aspiration as Sheikh Omar Abdelkafy presents it: great souls exert themselves for their aims, the person with a goal does not settle for what is base, and aspiration shows in asking, in giving and in setting a clear goal; with a saying of Ibn al-Jawzi whose attribution is not yet verified."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق بلند ہمتی: بڑی نفوس اپنے مقاصد کے لیے محنت کرتی ہیں، ہدف رکھنے والا پست پر قناعت نہیں کرتا، اور ہمت مانگنے، دینے اور واضح ہدف متعین کرنے میں ظاہر ہوتی ہے؛ ساتھ ابن الجوزی کا ایک قول جس کی نسبت کی تصدیق باقی ہے۔"
  es: "La alta aspiración, como la presenta el jeque Omar Abdelkafy: las grandes almas se esfuerzan por sus objetivos, la persona con una meta no se conforma con lo vil, y la aspiración se muestra en pedir, en dar y en establecer una meta clara; con un dicho de Ibn al-Jawzi cuya atribución aún no está verificada."
  fr: "L'aspiration élevée, telle que la présente le cheikh Omar Abdelkafy: les grandes âmes s'efforcent d'atteindre leurs objectifs, celui qui a un but ne se contente pas de ce qui est vil, et l'aspiration se manifeste dans la demande, dans le don et dans la définition d'un objectif clair; selon une parole d'Ibn al-Jawzi dont l'attribution n'est pas encore vérifiée."
