label:
  ar: "علو الهمة"
  en: "High aspiration (himma)"
  ur: "بلند ہمتی"
summary:
  ar: "علو الهمة كما يعرضه الشيخ عمر عبد الكافي: أن النفوس الكبيرة تتعب في سبيل غاياتها، وأن صاحب الهدف لا يقنع بالدون، وأن الهمة تظهر في السؤال والعطاء وتحديد الهدف، مع قول لابن الجوزي لم يُتحقق من نسبته بعد."
  en: "High aspiration as Sheikh Omar Abdelkafy presents it: great souls exert themselves for their aims, the person with a goal does not settle for what is base, and aspiration shows in asking, in giving and in setting a clear goal; with a saying of Ibn al-Jawzi whose attribution is not yet verified."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق بلند ہمتی: بڑی نفوس اپنے مقاصد کے لیے محنت کرتی ہیں، ہدف رکھنے والا پست پر قناعت نہیں کرتا، اور ہمت مانگنے، دینے اور واضح ہدف متعین کرنے میں ظاہر ہوتی ہے؛ ساتھ ابن الجوزی کا ایک قول جس کی نسبت کی تصدیق باقی ہے۔"
