id: concept/written-instrument-sakk
class: concept
kind: legal
label:
  ar: "الصَّكّ"
  en: "Sakk (the written instrument of a deal or claim: the duty to write it, the fee for writing, a judge relying on his own hand, testimony on a document, and documents accepted by custom)"
summary:
  ar: "الصك في الاصطلاح الكتاب الذي تكتب فيه المعاملات والإقرارات ووقائع الدعوى، ويتميز عن السجل وهو ما تضمن حكم القاضي، وعن المحضر وهو ما يكتب فيه ما جرى بين الخصمين. وعند الشافعية كتابة الصكوك والسجلات فرض كفاية في كل تصرف مالي وغيره. ولا يجب على القاضي عينا كتابتها عند الشافعية، ويجب عند الحنابلة إذا طلبها من له مصلحة وأتى بالورق. وجمهور الفقهاء يجيزون أخذ الأجرة على كتابتها، ولا يستند القاضي إلى خط الصك المجرد عند الجمهور حتى يتذكر الواقعة، وعند أبي يوسف ومحمد وأحمد في رواية يعمل به إذا كان محتوما بختمه. واستثنى الحنفية الصكوك التي جرى العرف بقبولها بمجرد كتابتها كالسلطانية والدفاتر والصكوك القديمة للأوقاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10411}"
  en: "A sakk is the written instrument in which dealings, acknowledgements and the facts of a claim are recorded. It differs from the register (sijill), which holds a judge's ruling, and from the minutes (mahdar), which record what passed between the two parties. The Shafi'is hold that writing instruments is a communal duty in every financial and other transaction. For the Shafi'is the judge is not personally bound to write them; the Hanbalis bind him when a party with an interest asks and supplies the paper. Most jurists allow a fee for writing, and the fee for the paper comes from the treasury when there is one. A judge may not rely on the bare hand of a document unless he recalls the facts, but Abu Yusuf, Muhammad and one view of Ahmad allow it when it is sealed and kept in his keeping. The Hanafis except instruments that custom accepts on their writing alone, such as official orders, the books of traders and money-changers, and old endowment deeds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10411}"
