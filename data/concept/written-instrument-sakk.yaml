label:
  ar: "الصَّكّ"
  en: "Sakk (the written instrument of a deal or claim: the duty to write it, the fee for writing, a judge relying on his own hand, testimony on a document, and documents accepted by custom)"
  es: "Sakk (el instrumento escrito de un acuerdo o reclamación: el deber de redactarlo, la tarifa por redactarlo, un juez que confía en su propia letra, el testimonio sobre un documento y los documentos aceptados por costumbre)"
  fr: "Sakk (l'acte écrit d'un accord ou d'une réclamation: l'obligation de le rédiger, les honoraires de rédaction, un juge se fiant à sa propre main, le témoignage sur un document et les documents acceptés par la coutume)"
  ur: "ساک ⁦(کسی معاہدے یا دعوے کا تحریری آلہ: اسے لکھنے کا فرض، لکھنے کی فیس، اپنے ہاتھ پر بھروسہ کرنے والا جج، کسی دستاویز پر گواہی، اور اپنی مرضی کے مطابق قبول شدہ دستاویزات)⁩"
summary:
  ar: "الصك في الاصطلاح الكتاب الذي تكتب فيه المعاملات والإقرارات ووقائع الدعوى، ويتميز عن السجل وهو ما تضمن حكم القاضي، وعن المحضر وهو ما يكتب فيه ما جرى بين الخصمين. وعند الشافعية كتابة الصكوك والسجلات فرض كفاية في كل تصرف مالي وغيره. ولا يجب على القاضي عينا كتابتها عند الشافعية، ويجب عند الحنابلة إذا طلبها من له مصلحة وأتى بالورق. وجمهور الفقهاء يجيزون أخذ الأجرة على كتابتها، ولا يستند القاضي إلى خط الصك المجرد عند الجمهور حتى يتذكر الواقعة، وعند أبي يوسف ومحمد وأحمد في رواية يعمل به إذا كان محتوما بختمه. واستثنى الحنفية الصكوك التي جرى العرف بقبولها بمجرد كتابتها كالسلطانية والدفاتر والصكوك القديمة للأوقاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10411}"
  en: "A sakk is the written instrument in which dealings, acknowledgements and the facts of a claim are recorded. It differs from the register (sijill), which holds a judge's ruling, and from the minutes (mahdar), which record what passed between the two parties. The Shafi'is hold that writing instruments is a communal duty in every financial and other transaction. For the Shafi'is the judge is not personally bound to write them; the Hanbalis bind him when a party with an interest asks and supplies the paper. Most jurists allow a fee for writing, and the fee for the paper comes from the treasury when there is one. A judge may not rely on the bare hand of a document unless he recalls the facts, but Abu Yusuf, Muhammad and one view of Ahmad allow it when it is sealed and kept in his keeping. The Hanafis except instruments that custom accepts on their writing alone, such as official orders, the books of traders and money-changers, and old endowment deeds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10411}"
  es: "Un sakk es el instrumento escrito en el que se registran las transacciones, los reconocimientos y los hechos de una reclamación. Se diferencia del registro (sijill), que contiene la resolución de un juez, y de las actas (mahdar), que registran lo sucedido entre las dos partes. Los shafi'ís sostienen que la redacción de instrumentos es un deber comunitario en toda transacción financiera y de otro tipo. Para los shafi'ís, el juez no está obligado personalmente a redactarlos; los hanbalíes lo obligan cuando una parte interesada solicita y proporciona el documento. La mayoría de los juristas permiten el pago de una tasa por la redacción, la cual proviene del tesoro público cuando lo hay. Un juez no puede basarse en la mera letra de un documento a menos que recuerde los hechos, pero Abu Yusuf, Muhammad y una interpretación de Ahmad lo permiten cuando está sellado y bajo su custodia. Los hanafíes exceptúan los instrumentos que la costumbre acepta por su mera escritura, como las órdenes oficiales, los libros de comerciantes y cambistas, y las antiguas escrituras de donación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10408} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10409} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10410} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10411}"
  fr: "Un sakk est l'acte écrit dans lequel sont consignés les transactions, les reconnaissances et les faits d'une créance. Il diffère du registre (sijill), qui contient les décisions du juge, et du procès-verbal (mahdar), qui relate les échanges entre les deux parties. Les chaféites considèrent que la rédaction d'actes écrits est une obligation collective pour toute transaction financière ou autre. Pour les chaféites, le juge n'est pas personnellement tenu de les rédiger; les hanbalites, en revanche, l'y obligent lorsqu'une partie intéressée en fait la demande et fournit le document. La plupart des juristes prévoient des honoraires pour la rédaction, lesquels sont généralement prélevés sur le trésor public, le cas échéant. Un juge ne peut se fier à la seule écriture d'un document, sauf s'il se souvient des faits, mais Abou Yusuf, Muhammad et une opinion d'Ahmad l'autorisent lorsque le document est scellé et conservé par le juge. Les hanafites font exception pour les actes dont la coutume reconnaît la validité sur la seule base de leur écriture, tels que les ordres officiels, les livres de comptes des commerçants et des changeurs, et les anciens actes de dot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10411}"
  ur: "ساک ایک تحریری آلہ ہے جس میں لین دین، اعترافات اور دعوے کے حقائق درج کیے جاتے ہیں۔ یہ رجسٹر ⁦(سجیل)⁩ سے مختلف ہے، جس میں جج کا حکم ہوتا ہے، اور منٹ ⁦(مہدر)⁩ سے، جو دونوں فریقوں کے درمیان جو کچھ گزرا اسے ریکارڈ کرتا ہے۔ شافعیوں کا خیال ہے کہ ہر مالی اور دوسرے لین دین میں آلات تحریر کرنا ایک اجتماعی فریضہ ہے۔ شافعیوں کے لیے قاضی ذاتی طور پر ان کو لکھنے کا پابند نہیں ہے۔ حنبلی اس کو پابند کرتے ہیں جب کوئی مفاد پرست فریق کاغذ مانگتا اور فراہم کرتا ہے۔ زیادہ تر فقہا لکھنے کے لیے فیس کی اجازت دیتے ہیں، اور کاغذ کی فیس اس وقت خزانے سے آتی ہے جب کوئی ہو۔ ایک جج کسی دستاویز کے ننگے ہاتھ پر انحصار نہیں کر سکتا جب تک کہ وہ حقائق کو یاد نہ کر لے، لیکن ابو یوسف، محمد اور احمد کا ایک قول اس کی اجازت دیتا ہے جب اس پر مہر لگا دی جائے اور اسے اپنے پاس رکھا جائے۔ حنفیہ سوائے ان آلات کے جن کو رواج صرف ان کی تحریر پر قبول کرتا ہے، جیسے سرکاری احکامات، تاجروں کی کتابیں اور رقم بدلنے والوں کی کتابیں اور پرانے اوقاف کے اعمال۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10408} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10409} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10410} صفحہ 10411}"
