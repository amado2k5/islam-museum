  fr: "Dardar (l'arbre à insectes)"
  tr: "Karaağac"
  id: "Elm"
summary:
  ar: "شجرة تشبه شجرة الخلاف، يسمّيها أهل الشام الدردار، وأهل العراق شجرة البق. تخرج منها أقماع منتفخة كالرمان، ورطوبة أقماعه تجلو الوجه، وقشره قابض والأصل قريب منه، ولف قشره كالرباط على الضربات والجراحات يُدملها، وطبيخ أصله وورقه يُنطل به العظام المكسورة {cite:canon-ibn-sina-print-v1 p.439} {cite:canon-ibn-sina-print-v1 p.440}."
  en: "A tree like the ḥilāf tree; the people of Syria call it dardar, those of Iraq the bug tree. It bears swollen cones like pomegranates; the moisture of its cones polishes the face; its bark is astringent and its root near it. Its bark wrapped as a bandage on blows and wounds heals them; a decoction of the root and leaf is applied to broken bones {cite:canon-ibn-sina-print-v1 p.439} {cite:canon-ibn-sina-print-v1 p.440}."
  ur: "ایک درخت جو خلاف کے درخت جیسا ہے؛ شام والے اسے دردار اور عراق والے بق کا درخت کہتے ہیں۔ اس سے انار جیسی پھولی ہوئی ٹہنیاں نکلتی ہیں؛ ان کی نمی چہرے کو چمکاتی ہے؛ اس کا چھلکا قابض ہے اور جڑ اس کے قریب ہے۔ چھلکا ضربوں اور زخموں پر پٹی کی طرح لپیٹا جائے تو انہیں بھرتا ہے؛ جڑ اور پتے کا جوشاندہ ٹوٹی ہوئی ہڈیوں پر ملا جاتا ہے {cite:canon-ibn-sina-print-v1 p.439} {cite:canon-ibn-sina-print-v1 p.440}۔"
  es: "Un árbol como el árbol ḥilāf; los sirios lo llaman dardar, los iraquíes el árbol de los insectos. Produce conos hinchados como granadas; la humedad de sus conos pule el rostro; su corteza es astringente y su raíz cercana. Su corteza, envuelta como un vendaje sobre golpes y heridas, las cura; una decocción de la raíz y las hojas se aplica a huesos rotos {cite:canon-ibn-sina-print-v1 p.439} {cite:canon-ibn-sina-print-v1 p.440}."
  fr: "Un arbre semblable au ḥilāf; les Syriens l’appellent dardar, les Irakiens arbre à punaises. Il porte des cônes gonflés comme des grenades; l’humidité de ses cônes polit le visage; son écorce est astringente et sa racine se trouve près d’elle. Son écorce, appliquée comme un bandage sur les coups et les plaies, les guérit; une décoction de la racine et des feuilles est appliquée sur les os cassés."
  tr: "Anlaşma ağacına benzeyen bir ağaç, el-Şam halkı tarafından 'al-dardar' olarak adlandırılan ve Irak halkı tarafından böcek ağacı olarak adlandırılır. Şişmiş kozalaklar nar gibi çıkar ve kozalaklarının nemi yüzünü ortaya çıkar. Kabuğu sıkıdır ve kökü ona yakındır. Kabuğu, darbeler ve yaralar üzerine bir bağ gibi sarılıp, onları iyileştirir. Tabanının özü ve yaprakları kırık kemikleri kaplar {cite:canon-ibn-sina-print-v1 s.439} {cite:canon-ibn-sina-print-v1 s.440}."
  id: "Pohon yang menyerupai pohon perselisihan, disebut 'al-dardar' oleh orang-orang al-Sham, dan oleh orang-orang Irak, pohon serangga. Kerucut bengkak muncul darinya seperti delima, dan kelembapan kerucutnya memperlihatkan wajahnya. Kulitnya kencang dan akarnya dekat dengannya. Kulitnya dibalut seperti ligamen di atas pukulan dan luka, menyembuhkannya. Esensi dan daun pangkal serta daunnya menutupi tulang yang patah {cite:canon-ibn-sina-print-v1 hlm.439} {cite:canon-ibn-sina-print-v1 hlm.440}."
