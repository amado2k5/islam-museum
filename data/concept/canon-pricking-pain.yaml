id: concept/canon-pricking-pain
class: concept
kind: scientific
label:
  ar: "الوجع الناخس عند ابن سينا"
  en: "Pricking pain in the Canon"
  fr: "Douleur piquante dans le Canon"
  ur: "چبھنے والا درد، قانون کے مطابق"
  es: "Dolor punzante en el Canon"
summary:
  ar: "سبب الوجع الناخس عند ابن سينا ما يمدّد الغشاء عرضاً فيشبه تفريق اتصاله، وقد يتساوى حسّه وقد لا يتساوى، ويعلّل عدم تساويه بأحوال ما يمتد عليه الغشاء أو بحال حس العضو {cite:canon-ibn-sina-print-v1 p.149}."
  en: "For Ibn Sina pricking pain is caused by something that stretches a membrane across, so that it resembles a separation of its continuity; it may be even or uneven in feeling, and he explains the unevenness by what the membrane stretches over, or by the state of the organ's sense {cite:canon-ibn-sina-print-v1 p.149}."
  fr: "Pour Ibn Sina, elle vient d’une membrane distendue transversalement comme en rupture de continuité ; son ressenti égal ou inégal dépendrait du support de la membrane ou de la sensibilité organique {cite:canon-ibn-sina-print-v1 p.149}."
  es: "Para Ibn Sina, el dolor punzante es causado por algo que estira una membrana, de modo que se asemeja a una separación de su continuidad; puede ser uniforme o irregular en la sensación, y explica la irregularidad por aquello sobre lo que se estira la membrana, o por el estado de la sensibilidad del órgano {cite:canon-ibn-sina-print-v1 p.149}."
