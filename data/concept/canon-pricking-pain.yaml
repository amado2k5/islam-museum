label: { ar: "الوجع الناخس عند ابن سينا", en: "Pricking pain in the Canon", ur: "چبھنے والا درد، قانون کے مطابق" }
summary:
  ar: "سبب الوجع الناخس عند ابن سينا ما يمدّد الغشاء عرضاً فيشبه تفريق اتصاله، وقد يتساوى حسّه وقد لا يتساوى، ويعلّل عدم تساويه بأحوال ما يمتد عليه الغشاء أو بحال حس العضو {cite:canon-ibn-sina-print-v1 p.149}."
  en: "For Ibn Sina pricking pain is caused by something that stretches a membrane across, so that it resembles a separation of its continuity; it may be even or uneven in feeling, and he explains the unevenness by what the membrane stretches over, or by the state of the organ's sense {cite:canon-ibn-sina-print-v1 p.149}."
