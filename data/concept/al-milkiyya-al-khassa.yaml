id: concept/al-milkiyya-al-khassa
class: concept
kind: legal
label:
  ar: "الملكية الخاصة"
  en: "Private ownership (al-milkiyya al-khassa)"
  ur: "نجی ملکیت (الملکیۃ الخاصۃ)"
summary:
  ar: "الملكية الخاصة في كتابات الاقتصاد الإسلامي المعاصرة ما يكون صاحبه شخصاً معيناً، فرداً أو جماعة مشتركة أنصبة أفرادها معلومة، في كل مال حلال من الأعيان والمنافع والحقوق لا يدخل في الملكية العامة أو ملكية الدولة؛ يعرضها الطاهر قانة بأدلتها من القرآن والسنة وأسبابها المنشئة (العمل وإحياء الموات والكسب في الجهاد) والناقلة (العقود والميراث والوصية والوقف) ووسائل حمايتها. {cite:dawr-tawzii-milkiyya-qana-2007 p.71} {cite:dawr-tawzii-milkiyya-qana-2007 p.72} {cite:dawr-tawzii-milkiyya-qana-2007 p.73} {cite:dawr-tawzii-milkiyya-qana-2007 p.83} {cite:dawr-tawzii-milkiyya-qana-2007 p.84} {cite:dawr-tawzii-milkiyya-qana-2007 p.85} {cite:dawr-tawzii-milkiyya-qana-2007 p.86}"
  en: "In contemporary Islamic-economics writing, private ownership is that whose owner is a specific person — an individual or a group whose members' shares are known — over any lawful wealth, whether things, usufructs or rights, not belonging to public or state property; al-Tahir Qana presents its proofs from the Qur'an and Sunna, the causes that create it (labour, reviving dead land, gains in war) and transfer it (contracts, inheritance, bequest, endowment), and the means that protect it."
  ur: "معاصر اسلامی معاشیات کی تحریروں میں نجی ملکیت وہ ہے جس کا مالک کوئی متعین شخص ہو — فرد یا ایسی جماعت جس کے افراد کے حصے معلوم ہوں — ہر اس حلال مال میں، خواہ اشیا ہوں، منافع ہوں یا حقوق، جو عوامی یا ریاستی ملکیت میں داخل نہ ہو؛ الطاہر قانہ قرآن و سنت سے اس کے دلائل، اسے پیدا کرنے والے اسباب (محنت، بنجر زمین کا احیا، جہاد میں کسب) اور منتقل کرنے والے اسباب (عقود، میراث، وصیت، وقف) اور اس کی حفاظت کے ذرائع بیان کرتے ہیں۔"
