label:
  ar: "المساواة في الإسلام"
  en: "Equality in Islam"
summary:
  ar: "يرى محمد الخضر حسين أن الناس خُلقوا متماثلين في الفطرة، ثم تفاوتوا في الحياة الاجتماعية، وأن الإسلام جعل التكاليف على قاعدة التكافؤ، فلا امتياز لشريف على وضيع ولا لملك على عامة، وأن التقوى وحدها لا تغير الحدود ولا الحقوق {cite:al-hurriyya-fi-al-islam-azhar p. 58} {cite:al-hurriyya-fi-al-islam-azhar p. 59}. ويستدل بأن الأخوة في الدين تقتضي عدم التمايز في الحقوق، وبأن أبا بكر وعمر خاطبا الرعية بمبدأ أن القوي ضعيف حتى يُؤخذ منه الحق والضعيف قوي حتى يُنصف {cite:al-hurriyya-fi-al-islam-azhar p. 60} {cite:al-hurriyya-fi-al-islam-azhar p. 61}. ويذكر أن القاضي لا يقضي لنفسه، وأن عمر رفع خصومة إلى رجل من الرعية، وأن القصاص يقتضي المساواة {cite:al-hurriyya-fi-al-islam-azhar p. 61} {cite:al-hurriyya-fi-al-islam-azhar p. 92}. وهذه قراءة المؤلف للنصوص والوقائع المذكورة."
  en: "Muhammad al-Khidr Husayn holds that people are created alike in nature, then differ in social life, and that Islam set obligations on a basis of equal standing: no noble is privileged over a commoner, no ruler over the people, and piety does not change limits or rights (pp. 58-59). He argues from the brotherhood of believers, and from the Caliph Abu Bakr's principle that the strong is weak until right is taken from him and the weak is strong until he is given his right (pp. 60-61). He notes that a judge does not rule for himself and that Umar referred a dispute to a man of the people (p. 61). This is the author's reading of the texts and reports he cites."
