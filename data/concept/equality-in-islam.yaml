summary:
  ar: "يرى محمد الخضر حسين أن الناس خُلقوا متماثلين في الفطرة، ثم تفاوتوا في الحياة الاجتماعية، وأن الإسلام جعل التكاليف على قاعدة التكافؤ، فلا امتياز لشريف على وضيع ولا لملك على عامة، وأن التقوى وحدها لا تغير الحدود ولا الحقوق {cite:al-hurriyya-fi-al-islam-azhar p. 58} {cite:al-hurriyya-fi-al-islam-azhar p. 59}. ويستدل بأن الأخوة في الدين تقتضي عدم التمايز في الحقوق، وبأن أبا بكر وعمر خاطبا الرعية بمبدأ أن القوي ضعيف حتى يُؤخذ منه الحق والضعيف قوي حتى يُنصف {cite:al-hurriyya-fi-al-islam-azhar p. 60} {cite:al-hurriyya-fi-al-islam-azhar p. 61}. ويذكر أن القاضي لا يقضي لنفسه، وأن عمر رفع خصومة إلى رجل من الرعية، وأن القصاص يقتضي المساواة {cite:al-hurriyya-fi-al-islam-azhar p. 61} {cite:al-hurriyya-fi-al-islam-azhar p. 92}. وهذه قراءة المؤلف للنصوص والوقائع المذكورة. ويقرر محيي الدين عفيفي أحمد أن الناس متساوون في النشأة والأصل، فلا تمييز بينهم بالنوع أو اللون أو اللغة {cite:nazarat-mawdu-iyya-azhar p. 113} {cite:nazarat-mawdu-iyya-azhar p. 114}، ويذكر حديثًا في ألا يُظلم المعاهَد {cite:nazarat-mawdu-iyya-azhar p. 114}، وهذه قراءة الكاتب."
  en: "Muhammad al-Khidr Husayn holds that people are created alike in nature, then differ in social life, and that Islam set obligations on a basis of equal standing: no noble is privileged over a commoner, no ruler over the people, and piety does not change limits or rights (pp. 58-59). He argues from the brotherhood of believers, and from the Caliph Abu Bakr's principle that the strong is weak until right is taken from him and the weak is strong until he is given his right (pp. 60-61). He notes that a judge does not rule for himself and that Umar referred a dispute to a man of the people (p. 61). This is the author's reading of the texts and reports he cites. Muhyi al-Din Afifi Ahmad holds that people share one origin and so are equal in rights, duties and reward, and that colour, sex and language give no ground for distinction (pp. 113-114). He cites a hadith against wronging a covenanted non-Muslim (p. 114)."
  es: "Muhammad al-Khidr Husayn sostiene que las personas son creadas iguales por naturaleza, pero difieren en su vida social, y que el Islam establece obligaciones sobre la base de la igualdad: ningún noble tiene privilegios sobre un plebeyo, ningún gobernante sobre el pueblo, y la piedad no cambia los límites ni los derechos (pp. 58-59). Argumenta desde la hermandad de los creyentes y desde el principio del califa Abu Bakr de que el fuerte es débil hasta que se le quita lo que le corresponde y el débil es fuerte hasta que se le da lo que le corresponde (pp. 60-61). Señala que un juez no dicta sentencia por sí mismo y que Umar remitió una disputa a un hombre del pueblo (p. 61). Esta es la interpretación que el autor hace de los textos e informes que cita. Muhyi al-Din Afifi Ahmad sostiene que las personas comparten un mismo origen y, por lo tanto, son iguales en derechos, deberes y recompensa, y que el color, el sexo y el idioma no dan lugar a distinciones (pp. 113-114). Cita un hadiz contra el abuso a un no musulmán con quien se ha hecho un pacto (p. 114)."
  fr: "Muhammad al-Khidr Husayn soutient que les êtres humains sont créés semblables par nature, mais diffèrent dans leur vie sociale, et que l'islam établit des obligations fondées sur l'égalité: aucun noble n'est privilégié par rapport à un roturier, aucun dirigeant par rapport au peuple, et la piété ne modifie ni les limites ni les droits (p. 58-59). Il fonde son argumentation sur la fraternité des croyants et sur le principe du calife Abou Bakr selon lequel le fort est faible tant que son droit lui est ôté, et le faible est fort tant que son droit ne lui est pas rendu (p. 60-61). Il souligne qu'un juge ne statue pas pour lui-même et qu'Omar a soumis un différend à un homme du peuple (p. 61). Telle est l'interprétation que l'auteur fait des textes et des récits qu'il cite. Muhyi al-Din Afifi Ahmad, quant à lui, affirme que les êtres humains partagent une même origine et sont donc égaux en droits, en devoirs et en récompense, et que la couleur, le sexe et la langue ne sauraient justifier une distinction (p. 113-114). Il cite un hadith contre le fait de léser un non-musulman lié par une alliance (p. 114)."
  ur: "محمد الخضر حسین کا خیال ہے کہ لوگ فطرت کے لحاظ سے یکساں پیدا کیے گئے ہیں، پھر سماجی زندگی میں مختلف ہیں، اور اسلام نے مساوی حیثیت کی بنیاد پر فرائض کا تعین کیا ہے: کسی بزرگ کو عام آدمی پر کوئی فوقیت نہیں دی جاتی، کوئی حکمران لوگوں پر نہیں، اور تقویٰ حدود یا حقوق کو تبدیل نہیں کرتا ⁦(صفحہ 58-59)⁩۔ وہ مومنین کے بھائی چارے اور خلیفہ ابوبکر کے اصول سے استدلال کرتا ہے کہ طاقتور اس وقت تک کمزور ہے جب تک اس سے حق نہ لے لیا جائے اور کمزور اس وقت تک مضبوط ہے جب تک اسے اس کا حق نہ دیا جائے ⁦(صفحہ 60-61)⁩۔ وہ نوٹ کرتا ہے کہ ایک جج اپنے لیے فیصلہ نہیں کرتا اور عمر نے تنازعہ کو لوگوں کے ایک آدمی کے حوالے کیا ⁦(ص 61)⁩۔ یہ مصنف کی تحریروں اور رپورٹوں کا مطالعہ ہے جس کا وہ حوالہ دیتے ہیں۔ محی الدین عفیفی احمد کا خیال ہے کہ لوگ ایک ہی ہیں اور اسی طرح حقوق، فرائض اور اجر میں برابر ہیں، اور یہ کہ رنگ، جنس اور زبان میں امتیاز کی کوئی بنیاد نہیں ہے ⁦(صفحہ 113-114)⁩۔ انہوں نے ایک عہد نامہ غیر مسلم پر ظلم کرنے کے خلاف ایک حدیث کا حوالہ دیا ⁦(ص 114)⁩۔"
  tr: "Muhammed el-Hidr Hüseyin, insanların doğa olarak eşit yaratıldığına, sonra sosyal yaşamda farklılık gösterdiğine, İslam'ın görevlerin eşitlik ilkesine dayandığını, bu nedenle soyluların aşağılıkla, kralın ise sıradan olanlara karşı ayrım olmadığını ve sadece dindarlığın sınırları veya hakları değiştirmediğini savunur {cite:al-hurriyya-fi-al-Islam-azhar s. 58} {cite:al-hurriyya-fi-al-Islam-azhar s. 59}. Dinde kardeşliğin haklarda ayrım gerektirmediğini, Ebu Bekir ve Ömer'in tebaalara güçlü olanın hakları alınana kadar zayıf, zayıfların ise adalet sağlanana kadar güçlü olduğu ilkesiyle hitap ettiklerini savunur {cite:al-hurriyya-fi-al-islam-azhar s. 60} {cite:al-hurriyya-fi-al-Islam-azhar, s. 61}. Yargıcın kendisi için karar vermediğini, Umar'ın tebaadan biriyle anlaşmazlık çıkardığını ve intikamın eşitlik gerektirdiğini belirtir {cite:al-hurriyya-fi-al-Islam-azhar s. 61} {cite:al-hurriyya-fi-al-Islam-azhar s. 92}. Bu, yazarın bahsedilen metinler ve gerçekler üzerindeki yorumudur. Mohieddin Afifi Ahmed, insanların köken ve köken olarak eşit olduğunu, bu yüzden tür, renk veya dil açısından ayrım olmadığını belirtir {cite:nazarat-mawdu-iyya-azhar s. 113} {cite:nazarat-mawdu-iyya-azhar s. 114}} ve enstitülere haksızlık edilmemekle ilgili bir hadis {cite:nazarat-mawdu-iyya-azhar s. 114}} yazarın yorumu olduğunu belirtir."
  id: "Muhammad al-Khidr Hussein percaya bahwa manusia diciptakan setara secara alami, kemudian beragam dalam kehidupan sosial, dan bahwa Islam mendasarkan tugas pada prinsip kesetaraan, sehingga tidak ada perbedaan antara yang mulia di atas yang rendah dan raja di atas yang biasa, dan bahwa kesalehan saja tidak mengubah batas atau hak {cite:al-hurriyya-fi-al-Islam-azhar hlm. 58} {cite:al-hurriyya-fi-al-Islam-azhar hlm. 59}. Ia berargumen bahwa persaudaraan dalam agama tidak memerlukan perbedaan hak, dan bahwa Abu Bakr serta Umar membahas subjek dengan prinsip bahwa yang kuat adalah lemah sampai hak mereka diambil, dan yang lemah tetap kuat sampai keadilan diambil {cite:al-hurriyya-fi-al-islam-azhar hlm. 60} {cite:al-hurriyya-fi-al-Islam-azhar, hlm. 61}. Ia menyebutkan bahwa hakim tidak mengadili untuk dirinya sendiri, bahwa Umar mengajukan perselisihan dengan seorang pria dari para subjek, dan bahwa pembalasan membutuhkan kesetaraan {cite:al-hurriyya-fi-al-Islam-azhar hlm. 61} {cite:al-hurriyya-fi-al-Islam-azhar hlm. 92}. Ini adalah pembacaan penulis atas teks dan fakta yang disebutkan. Mohieddin Afifi Ahmed menyatakan bahwa orang itu sama asal-usul dan asal-usul, sehingga tidak ada diskriminasi di antara mereka berdasarkan jenis, warna kulit, atau bahasa {cite:nazarat-mawdu-iyya-azhar hlm. 113} {cite:nazarat-mawdu-iyya-azhar hlm. 114}, dan ia menyebutkan hadits tentang tidak bersalah kepada institusi {cite:nazarat-mawdu-iyya-azhar hlm. 114}, yang merupakan bacaan penulis."
