    ar: "يرى محمد الخضر حسين أن الناس خُلقوا متماثلين في الفطرة، وأن الإسلام بنى التكاليف على التكافؤ فلا امتياز إلا بالتقوى والعمل."
    en: "Muhammad al-Khidr Husayn holds people were created equal in nature, and Islam set its duties on parity — no rank but by piety and deed."
