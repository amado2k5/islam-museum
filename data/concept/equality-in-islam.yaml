id: concept/equality-in-islam
education:
  did_you_know:
    ar: "يرى محمد الخضر حسين أن الناس خُلقوا متماثلين في الفطرة، وأن الإسلام بنى التكاليف على التكافؤ فلا امتياز إلا بالتقوى والعمل."
    en: "Muhammad al-Khidr Husayn holds people were created equal in nature, and Islam set its duties on parity — no rank but by piety and deed."
    ur: "محمد الخضر حسین کے نزدیک انسان فطرتاً برابر پیدا ہوئے اور اسلام نے ذمہ داریاں باہمی برابری پر رکھی — تقویٰ اور عمل کے سوا کوئی برتری نہیں۔"
    sources: [source/al-hurriyya-fi-al-islam-azhar, source/usul-al-tarbiya-azhar]
