summary:
  ar: "الجواز في اللغة الإمكان والإباحة، وفي الاصطلاح الفقهي يُستعمل بمعنى الإباحة ويطلق أحيانا على ما هو أعم منها كالواجب والمستحب والمكروه بحسب الكلام. وتبيّن الموسوعة أن جواز العقود اللازمة يُنظر فيه إلى ما يترتب على لزومها من ضرر، كالجعالة والوصية والقراض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6687}"
  en: "Jawaz in the language is possibility and permission. In the technical sense of fiqh it is often used to mean permission, and at times in a wider sense that covers the obligatory, the recommended and the disliked, depending on the context. The encyclopedia notes that when a contract is considered binding, its harms are weighed, as in the reward for a task, the bequest and the profit-sharing partnership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6687}"
