label: { ar: "الجواز", en: "Jawaz (permissibility, and its wider sense in fiqh)", ur: "جواز", es: "Jawaz (permisibilidad y su sentido más amplio en el fiqh)", fr: "Jawaz (la permissibilité, et son sens plus large en fiqh)", tr: "Pasaport", id: "Paspor" }
summary:
  ar: "الجواز في اللغة الإمكان والإباحة، وفي الاصطلاح الفقهي يُستعمل بمعنى الإباحة ويطلق أحيانا على ما هو أعم منها كالواجب والمستحب والمكروه بحسب الكلام. وتبيّن الموسوعة أن جواز العقود اللازمة يُنظر فيه إلى ما يترتب على لزومها من ضرر، كالجعالة والوصية والقراض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6687}"
  en: "Jawaz in the language is possibility and permission. In the technical sense of fiqh it is often used to mean permission, and at times in a wider sense that covers the obligatory, the recommended and the disliked, depending on the context. The encyclopedia notes that when a contract is considered binding, its harms are weighed, as in the reward for a task, the bequest and the profit-sharing partnership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6687}"
  es: "Jawaz en el idioma significa posibilidad y permiso. En el sentido técnico del fiqh, se usa a menudo para referirse al permiso, y a veces en un sentido más amplio que abarca lo obligatorio, lo recomendado y lo desaconsejable, según el contexto. La enciclopedia señala que cuando un contrato se considera vinculante, se sopesan sus perjuicios, como en el caso de la recompensa por una tarea, el legado y la sociedad de reparto de beneficios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6687}"
  fr: "En kuwaitiyya, le terme « jawaz » signifie possibilité et permission. En droit islamique (fiqh), il est souvent employé pour désigner la permission, et parfois dans un sens plus large englobant l'obligatoire, le recommandé et le déconseillé, selon le contexte. L'encyclopédie précise que lorsqu'un contrat est considéré comme contraignant, ses inconvénients sont évalués, comme dans le cas de la rémunération d'une tâche, d'un legs ou d'un partenariat de partage des bénéfices."
  ur: "جواز زبان میں امکان اور اجازت ہے۔ فقہ کے فنی معنوں میں یہ اکثر اجازت کے معنی میں استعمال ہوتا ہے، اور بعض اوقات وسیع تر معنوں میں جو سیاق و سباق کے لحاظ سے واجب، مستحب اور ناپسندیدہ کا احاطہ کرتا ہے۔ انسائیکلوپیڈیا نوٹ کرتا ہے کہ جب کسی معاہدے کو پابند سمجھا جاتا ہے، تو اس کے نقصانات کو تولا جاتا ہے، جیسا کہ کسی کام کے بدلے، وصیت اور منافع میں شراکت داری۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6685} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6686}"
  tr: "Dilbilimsel terimlerde, izin verilebilirlik olasılık ve kabul edilebilirliktir; fıkıh terminolojisinde ise kabul edilebilirlik anlamına gelir ve bazen teolojiye göre zorunluluk, tavsiye edilen ve sevilmeyenler gibi daha geniş konuları ifade eder. Ansiklopedi, bağlayıcı sözleşmelerin izin verilebilirliğinin, komisyon, vasiyet ve kredi gibi yükümlülüklerinden kaynaklanan zararları dikkate aldığını açıklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6687}"
  id: "Dalam istilah linguistik, permissibility adalah kemungkinan dan permissibility, dan dalam terminologi yurisprudensi, istilah ini digunakan untuk berarti permissibility dan kadang-kadang merujuk pada hal-hal yang lebih luas seperti obligation, recommended, dan disliked menurut teologi. Ensiklopedia ini menjelaskan bahwa diperbolehkannya kontrak yang mengikat mempertimbangkan kerugian yang timbul dari kewajibannya, seperti komisi, wasiat, dan pinjaman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6685} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.6686} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.6687}"
