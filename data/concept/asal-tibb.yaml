summary:
  ar: "العسل في الكتاب طل خفي يقع على الزهر وغيره فيلقطه النحل، حار يابس في الثانية، جال مفتح لأفواه العروق محلل للرطوبات مانع للعفن، يستعمل في القروح والأذن والخوانيق ولعقه علاج لبعض السموم، وفيه جنس حريف سمي يحذر منه {cite:canon-ibn-sina-print-v1 pp.619-620}"
  en: "Asal is in the book a hidden dew that falls on flowers and other things and is gathered by the bees; hot and dry in the second degree, cleansing, opening the mouths of the vessels, dissolving moistures and preventing putrefaction, it is used on ulcers, in the ear and in quinsy, and licked it is a remedy for certain poisons; there is also a pungent poisonous kind against which the book warns {cite:canon-ibn-sina-print-v1 pp.619-620}"
  fr: "Dans le livre, asal est une rosée cachée qui tombe sur les fleurs et d’autres choses et que recueillent les abeilles ; chaud et sec au deuxième degré, nettoyant, ouvrant les orifices des vaisseaux, dissolvant les humidités et empêchant la putréfaction, il s’emploie sur les ulcères, dans l’oreille et contre l’angine, et, léché, sert de remède à certains poisons ; il existe aussi une variété âcre et toxique contre laquelle le livre met en garde {cite:canon-ibn-sina-print-v1 pp.619-620}"
  ur: "عسل کتاب میں ایک مخفی شبنم ہے جو پھولوں اور دوسری چیزوں پر گرتی ہے اور شہد کی مکھیاں اسے چن لیتی ہیں؛ دوسرے درجے میں گرم خشک، جلاء دینے والا، رگوں کے دہانے کھولنے والا، رطوبتوں کو تحلیل کرنے والا اور سڑاند روکنے والا ہے، قروح، کان اور خناق میں استعمال ہوتا ہے، چاٹنا بعض زہروں کا علاج ہے، اور ایک تیز زہریلی قسم بھی ہے جس سے کتاب خبردار کرتی ہے {cite:canon-ibn-sina-print-v1 pp.619-620}۔"
  es: "En el libro, el asal es un rocío oculto que cae sobre las flores y otras cosas y que es recogido por las abejas; caliente y seco en segundo grado, limpiador, abre las bocas de los vasos, disuelve la humedad y previene la putrefacción, se usa en úlceras, en el oído y en el amigdalitis, y lamido es un remedio para ciertos venenos; también hay un tipo venenoso y picante contra el cual advierte el libro {cite:canon-ibn-sina-print-v1 pp.619-620}"
  tr: "Kitaptaki bal, çiçeklere ve diğer çiçeklere düşen gizli bir kaplamadır ve arılar tarafından alınır. İkinci bölümde sıcak ve kurudur, damarların ağızlarını açar, nemi uzaklaştırır, küfü önler, yaralar, kulaklar ve yaralar için kullanılır ve bazı zehirlere karşı bir tedavi olarak kullanılır. Üzerinde buna karşı uyarıda bulunan zehirli bir acı biyen türü vardır {cite:canon-ibn-sina-print-v1 s.619-620}"
  id: "Madu dalam buku adalah lapisan tersembunyi yang jatuh pada bunga dan bunga lain dan diambil oleh lebah. Madu panas dan kering pada bagian kedua, membuka mulut pembuluh darah, menghilangkan kelembapan, mencegah jamur, digunakan untuk luka, telinga, dan luka, serta digunakan sebagai obat untuk beberapa racun. Madu ini mengandung spesies cabai beracun yang memperingatkannya {cite:canon-ibn-sina-print-v1 hlm.619-620}"
