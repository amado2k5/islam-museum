summary:
  ar: "الفأر في الكتاب حيوان تذكر فيه أخبار منسوبة: دمه يقطع الثآليل، وزبله ينفع من داء الثعلب، ويشوى ويجفف فيمسك سيلان اللعاب عن الصبي، وفي الحصاة وعسر البول، ولسع العقرب، وهي أخبار تنقل منسوبة إلى الكتاب لا نصيحة {cite:canon-ibn-sina-print-v1 635}"
  en: "Far is in the book the mouse, about which attributed reports are given: its blood cuts warts, its dung benefits alopecia areata, roasted and dried it stops a child's dribbling of saliva, and there are reports on stone, difficulty in urination and the sting of the scorpion, all passed on as the book's attributed reports, not advice {cite:canon-ibn-sina-print-v1 635}"
  ur: "فار کتاب میں چوہا ہے جس کے بارے میں منسوب خبریں دی گئی ہیں: اس کا خون مسے کاٹتا ہے، اس کی مینگنی داء الثعلب میں نافع ہے، بھون کر خشک کیا جائے تو بچے کے منہ سے رال بہنا روکتا ہے، اور پتھری، پیشاب کی دشواری اور بچھو کے ڈنک کے بارے میں خبریں ہیں، جو کتاب سے منسوب اطلاعات کے طور پر نقل ہیں، نصیحت کے طور پر نہیں {cite:canon-ibn-sina-print-v1 635}۔"
  es: "En el libro se menciona al ratón, del cual se dan relatos atribuidos: su sangre elimina las verrugas, su estiércol beneficia la alopecia areata, asado y seco detiene el babeo infantil, y hay relatos sobre cálculos renales, dificultad para orinar y la picadura del escorpión, todo ello transmitido como relatos atribuidos al libro, no como consejos {cite:canon-ibn-sina-print-v1 635}"
  fr: "Le livre mentionne la souris, au sujet de laquelle on trouve des témoignages attribués: son sang guérit les verrues, ses excréments sont bénéfiques en cas d’alopécie areata, grillés et séchés, ils arrêtent la salivation excessive des enfants, et l’on y trouve également des témoignages sur les calculs rénaux, les difficultés à uriner et la piqûre de scorpion, tous transmis comme des témoignages attribués au livre, et non comme des conseils. {cite:canon-ibn-sina-print-v1 635}"
  tr: "Kitaptaki fare, raporların anıldığı bir hayvandır: kanı siğilleri keser, gübresi tilki hastalığına faydalıdır, çocuktan salya akmasını, taşları, idrar yapmada zorluk ve akrep sokmasını önlemek için ızgarada pişirilir ve kurutulur. Bunlar kitaba atfedilen raporlardır, tavsiye değil {cite:canon-ibn-sina-print-v1 635}"
  id: "Tikus dalam buku adalah hewan yang disebutkan laporan: darahnya memotong kutil, kotorannya bermanfaat untuk penyakit rubah, dipanggang dan dikeringkan untuk mencegah air liur dari anak laki-laki, dalam batu, kesulitan buang air kecil, dan sengatan kalajengking. Ini adalah laporan yang dikaitkan dengan buku, bukan nasihat {cite:canon-ibn-sina-print-v1 635}"
