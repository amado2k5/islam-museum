id: concept/plant-ash-glass
class: concept
kind: term
label: { ar: "زجاج رماد النباتات", en: "Plant-ash (soda ash) glass", ur: "پودوں کی راکھ والا شیشہ" }
summary:
  ar: "زجاج يُصهر برماد نباتات غنية بالصودا، صار وصفة الصناعة الإسلامية بعد زجاج النطرون، وأقدم مجموعاته الشامية المعروفة من الرقة بعد سنة 796م، وأقدم مجموعاته المصرية المؤرخة من الصنج الفاطمية في آخر القرن العاشر {cite:schibille-islamic-glass-2022 p. 234}."
  en: "Glass fluxed with soda-rich plant ash, the Islamic recipe that succeeded natron glass; its earliest known Syro-Palestinian group is from al-Raqqa after 796, and its earliest securely dated Egyptian groups are Fatimid glass weights of the late tenth century {cite:schibille-islamic-glass-2022 p. 234}."
  ur: "سوڈا سے بھرپور پودوں کی راکھ سے پگھلایا گیا شیشہ، جو نیٹرون شیشے کے بعد اسلامی نسخہ بنا؛ اس کا قدیم ترین شامی گروہ 796ء کے بعد رقہ سے، اور قدیم ترین مؤرخ مصری گروہ دسویں صدی کے آخر کے فاطمی باٹوں سے ہے {cite:schibille-islamic-glass-2022 p. 234}."
