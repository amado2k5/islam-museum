id: concept/plant-ash-glass
class: concept
kind: term
label: { ar: "زجاج رماد النباتات", en: "Plant-ash (soda ash) glass", ur: "پودوں کی راکھ والا شیشہ", es: "Vidrio de ceniza vegetal (ceniza de sosa)", fr: "verre à cendres végétales (carbonate de soude)", tr: "Cam Bitkisi Külü", id: "Abu Tanaman Kaca" }
summary:
  ar: "زجاج يُصهر برماد نباتات غنية بالصودا، صار وصفة الصناعة الإسلامية بعد زجاج النطرون، وأقدم مجموعاته الشامية المعروفة من الرقة بعد سنة 796م، وأقدم مجموعاته المصرية المؤرخة من الصنج الفاطمية في آخر القرن العاشر {cite:schibille-islamic-glass-2022 p. 234}."
  en: "Glass fluxed with soda-rich plant ash, the Islamic recipe that succeeded natron glass; its earliest known Syro-Palestinian group is from al-Raqqa after 796, and its earliest securely dated Egyptian groups are Fatimid glass weights of the late tenth century {cite:schibille-islamic-glass-2022 p. 234}."
  ur: "سوڈا سے بھرپور پودوں کی راکھ سے پگھلایا گیا شیشہ، جو نیٹرون شیشے کے بعد اسلامی نسخہ بنا؛ اس کا قدیم ترین شامی گروہ 796ء کے بعد رقہ سے، اور قدیم ترین مؤرخ مصری گروہ دسویں صدی کے آخر کے فاطمی باٹوں سے ہے {cite:schibille-islamic-glass-2022 p. 234}."
  es: "Vidrio elaborado con ceniza vegetal rica en sodio, la receta islámica que sucedió al vidrio de natrón; su grupo siro-palestino más antiguo conocido proviene de al-Raqqa después del 796, y sus grupos egipcios más antiguos con datación segura son pesas de vidrio fatimíes de finales del siglo X {cite:schibille-islamic-glass-2022 p. 234}."
  fr: "Verre fondu avec de la cendre végétale riche en soude, la recette islamique qui a succédé au verre au natron; son plus ancien groupe syro-palestinien connu provient d'al-Raqqa après 796, et ses plus anciens groupes égyptiens datés avec certitude sont des poids en verre fatimides de la fin du Xe siècle {cite:schibille-islamic-glass-2022 p. 234}."
  tr: "Gazoz açısından zengin bitkilerin külleriyle eriyen cam, Natrun camından sonra İslami zanaatkarlığın tarifi haline gelmiştir. 796 MS sonrası Rakka'dan bilinen en eski Levant koleksiyonları ve onuncu yüzyıl sonunda Mısır-tarihli Fatimid zil koleksiyonları {cite:schibille-islamic-glass-2022, s. 234}."
  id: "Kaca yang meleleh bersama abu tanaman kaya soda, kaca ini menjadi resep kerajinan Islam setelah kaca Natrun. Koleksi Levantine tertua yang diketahui dari Raqqa setelah 796 M dan koleksi simbal Fatimid bersejarah Mesir tertua pada akhir abad kesepuluh {cite:schibille-islamic-glass-2022, hlm. 234}."
