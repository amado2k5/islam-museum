id: concept/duhn-fiqh
class: concept
kind: legal
label:
  ar: "الدهن (في الفقه)"
  en: "Oil and fat (the fiqh rules on oil)"
  ur: "تیل اور چکنائی (فقہی احکام)"
summary:
  ar: "الدهن ما يدهن به من زيت وغيره، والسمن ما يكون من الحيوان، والشحم ما يذوب من الحيوان بالنار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240} الدهن الجامد المتنجس يُلقى ما حوله ويُنتفع بالباقي، أما المائع فالأصح عند الجمهور أنه لا يقبل التطهير، وفي قول يطهر بالغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8241} ولا يجوز بيع الودك (شحم الميتة) اتفاقا، ويجيز الجمهور الاستصباح بالدهن المتنجس في غير المسجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
  en: "Duhn is any oil or fat used for anointing; samn is fat from living animals and shahm is what melts from animal fat by fire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240} If a solid fat is made impure, the piece and what is around it are removed and the rest is used; the majority, and the sounder view of the school, hold that liquid oil made impure cannot be purified, while another view allows purifying it by washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8241} The sale of dead animal fat is agreed to be forbidden; the majority allow lighting with impure oil outside the mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
  ur: "دہن وہ تیل یا چکنائی ہے جو بدن پر لگائی جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240} نجس مائع تیل کے پاک ہونے میں جمہور کے نزدیک اختلاف ہے، اور مردہ جانور کی چربی کی بیع بالاتفاق ناجائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
