id: concept/duhn-fiqh
class: concept
kind: legal
label:
  ar: "الدهن ⁦(في الفقه)⁩"
  en: "Oil and fat (the fiqh rules on oil)"
  ur: "تیل اور چکنائی ⁦(فقہی احکام)⁩"
  es: "Aceite y grasa (las normas del fiqh sobre el aceite)"
  fr: "Huile et graisse (les règles du fiqh sur l'huile)"
  tr: "Al-Dihan (Fıkıh alanında)"
  id: "Al-Dihan (dalam Juri)"
summary:
  ar: "الدهن ما يدهن به من زيت وغيره، والسمن ما يكون من الحيوان، والشحم ما يذوب من الحيوان بالنار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240} الدهن الجامد المتنجس يُلقى ما حوله ويُنتفع بالباقي، أما المائع فالأصح عند الجمهور أنه لا يقبل التطهير، وفي قول يطهر بالغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8241} ولا يجوز بيع الودك ⁦(شحم الميتة)⁩ اتفاقا، ويجيز الجمهور الاستصباح بالدهن المتنجس في غير المسجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
  en: "Duhn is any oil or fat used for anointing; samn is fat from living animals and shahm is what melts from animal fat by fire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240} If a solid fat is made impure, the piece and what is around it are removed and the rest is used; the majority, and the sounder view of the school, hold that liquid oil made impure cannot be purified, while another view allows purifying it by washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8241} The sale of dead animal fat is agreed to be forbidden; the majority allow lighting with impure oil outside the mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
  ur: "دہن وہ تیل یا چکنائی ہے جو بدن پر لگائی جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240} نجس مائع تیل کے پاک ہونے میں جمہور کے نزدیک اختلاف ہے، اور مردہ جانور کی چربی کی بیع بالاتفاق ناجائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8241} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
  es: "Duhn es cualquier aceite o grasa utilizada para ungir; samn es grasa de animales vivos y shahm es lo que se derrite de la grasa animal por el fuego. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240} Si una grasa sólida se vuelve impura, se retira el trozo y lo que lo rodea y se utiliza el resto; la mayoría, y la opinión más sólida de la escuela, sostiene que el aceite líquido impuro no se puede purificar, mientras que otra opinión permite purificarlo mediante lavado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8241} Se acepta que la venta de grasa de animales muertos está prohibida; la mayoría permite encender fuego con aceite impuro fuera de la mezquita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
  fr: "Duhn désigne toute huile ou graisse utilisée pour l'onction; samn est la graisse d'animaux vivants et shahm est la graisse animale fondue par le feu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8240} Si une graisse solide devient impure, on en retire la partie endommagée ainsi que ce qui l'entoure, et on utilise le reste. L'avis majoritaire, et le plus solide au sein de l'école, considère que l'huile liquide impure ne peut être purifiée, tandis qu'un autre avis autorise sa purification par lavage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8241} La vente de graisse d'animaux morts est interdite; l'usage d'huile impure pour l'allumage des lampes à huile est autorisé en dehors de la mosquée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
  tr: "Yağ, yağ ve diğer şeyleri yağlamak için kullanılır, ghee hayvanlardan elde edilen yağdır ve yağ hayvanlardan ateşte çözünen şeydir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8240} Katı ve kirli yağ çevreden atılır ve diğerlerinden faydalanırken, çoğunluğa göre sıvı yağ arındırma için kabul edilmez ve görüşe göre yıkanarak arındırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8241} Wudak (ölü yağ) anlaşmayla satılması yasaktır ve çoğunluk cami dışında kirli yağla istishbah içmeye izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8243}"
  id: "Lemak adalah yang digunakan untuk mengurapi minyak dan hal-hal lain, ghee adalah yang berasal dari hewan, dan lemak adalah yang larut dari hewan dalam api. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8240} Lemak padat dan najis dibuang dari lingkungan sekitar dan mendapat manfaat dari sisanya, sedangkan lemak cair, menurut mayoritas, tidak diterima untuk dimurnikan, dan menurut pendapat tersebut, dimurnikan dengan cara dicuci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8241} Tidak diperbolehkan menjual wudak (lemak mati) dengan kesepakatan, dan mayoritas mengizinkan istishbah dengan minyak najis di luar masjid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8243}"
