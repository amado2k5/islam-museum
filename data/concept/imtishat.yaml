label: { ar: "الامتشاط", en: "Imtishat (combing the hair)" }
summary:
  ar: "الامتشاط لغة ترجيل الشعر وتسريحه وتنظيفه، وعند الفقهاء كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} يستحب للرجل ترجيل شعر رأسه ولحيته، وللمرأة ترجيل شعرها، لحديث الرجل ثائر الرأس واللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} ويحرم على المحرم إذا كان يزيل شعرا، وتمنع المحدة من الامتشاط بالطيب أو الدهن، وعند الحنفية بمشط ضيق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}"
  en: "Imtishat is combing the hair, in the lexical and the juristic sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} A man is recommended to comb his hair and beard, and a woman her hair, following the report of a man with untidy hair whom the Prophet told to tidy himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} A man in ihram may not comb if it removes hair; a widow in mourning may not comb with oil or perfume, and the Hanafis forbid a narrow comb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}"
