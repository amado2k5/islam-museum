id: concept/imtishat
class: concept
kind: ethical
label: { ar: "الامتشاط", en: "Imtishat (combing the hair)", es: "Imtishat (peinarse el cabello)", fr: "Imtishat (peigner les cheveux)", ur: "امتشات ⁦(بالوں میں کنگھی کرنا)⁩" }
summary:
  ar: "الامتشاط لغة ترجيل الشعر وتسريحه وتنظيفه، وعند الفقهاء كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} يستحب للرجل ترجيل شعر رأسه ولحيته، وللمرأة ترجيل شعرها، لحديث الرجل ثائر الرأس واللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} ويحرم على المحرم إذا كان يزيل شعرا، وتمنع المحدة من الامتشاط بالطيب أو الدهن، وعند الحنفية بمشط ضيق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}"
  en: "Imtishat is combing the hair, in the lexical and the juristic sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} A man is recommended to comb his hair and beard, and a woman her hair, following the report of a man with untidy hair whom the Prophet told to tidy himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} A man in ihram may not comb if it removes hair; a widow in mourning may not comb with oil or perfume, and the Hanafis forbid a narrow comb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}"
  es: "Imtishat significa peinarse el cabello, tanto en sentido léxico como jurídico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} Se recomienda a los hombres peinarse el cabello y la barba, y a las mujeres el cabello, siguiendo el relato de un hombre con el cabello desaliñado a quien el Profeta le dijo que se lo arreglara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} Un hombre en estado de ihram no puede peinarse si esto le arranca cabello; una viuda en duelo no puede peinarse con aceite o perfume, y los hanafíes prohíben el uso de peines estrechos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}"
  fr: "L'imtishat désigne le peignage des cheveux, au sens lexical et juridique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} Il est recommandé à l'homme de se peigner les cheveux et la barbe, et à la femme les cheveux, conformément au récit d'un homme aux cheveux ébouriffés à qui le Prophète a demandé de se coiffer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3378} Un homme en état d'ihram ne doit pas se peigner si cela coupe des cheveux; une veuve en deuil ne doit pas se peigner avec de l'huile ou du parfum, et les hanafites interdisent l'utilisation d'un peigne étroit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}"
  ur: "امتشات لغت اور فقہی لحاظ سے بالوں میں کنگھی کرنا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3378} ایک مرد کو اپنے بالوں اور داڑھی کو کنگھی کرنے کی سفارش کی گئی ہے اور عورت کو اپنے بالوں میں کنگھی کرنے کی سفارش کی گئی ہے، ایک ایسے شخص کی رپورٹ کے بعد جس کے بال گندے ہیں جسے نبی نے اپنے آپ کو صاف کرنے کا حکم دیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3378} احرام میں آدمی اگر بال اکھاڑ دے تو کنگھی نہیں کر سکتا۔ سوگ کی حالت میں بیوہ تیل یا خوشبو سے کنگھی نہیں کر سکتی اور احناف تنگ کنگھی سے منع کرتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3379}"
