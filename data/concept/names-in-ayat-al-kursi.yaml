id: concept/names-in-ayat-al-kursi
class: concept
kind: belief
label: { ar: "أسماء الله في آية الكرسي", en: "The names of God within the Verse of the Throne", ur: "آیت الکرسی میں اسماء اللہ" }
summary:
  ar: "يعرض الشعراوي اختلاف العلماء في عدد أسماء الله في آية الكرسي: ستة عشر، أو سبعة عشر إذا حُسب الضمير المستتر في المصدر، أو واحد وعشرون إذا حُسبت المشتقات، ويرى أن الآية جمعت قدراً كبيراً من الأسماء الحسنى دون أن يحكم بين الأعداد {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1109} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1110}."
  en: "Sha'rawi reports a disagreement over how many of God's names the Verse of the Throne contains: sixteen, or seventeen if the hidden pronoun in the verbal noun is counted, or twenty-one if the derived forms are counted. He holds that the verse gathers many of the Beautiful Names, and rules on none of the counts {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1109} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1110}."
  ur: "شعراوی آیت الکرسی میں اسماء اللہ کی تعداد پر اختلاف نقل کرتے ہیں: سولہ، یا مصدر میں پوشیدہ ضمیر شمار کرنے سے سترہ، یا مشتقات شمار کرنے سے اکیس۔ ان کے نزدیک یہ آیت اسمائے حسنیٰ کا بڑا حصہ جمع کرتی ہے، اور وہ کسی عدد کا فیصلہ نہیں کرتے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1109} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1110}۔"
