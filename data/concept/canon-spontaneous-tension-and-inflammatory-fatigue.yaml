summary:
  ar: "يجعل ابن سينا سبب التمددي الحادث بنفسه امتلاء بلا رداءة خلط ويعالجه بالتلطيف والتقطيع، ويأمر في الورمي بالمبادرة إلى الفصد في اليوم الأول، ثم يرتب الغذاء ثلاثة أيام من ماء الشعير والدلك بدهن بارد أو معتدل ثم الأغذية الباردة والسمك الرضراضي مع منع الماء ما أمكن {cite:canon-ibn-sina-print-v1 pp.249-250}."
  en: "Ibn Sina makes the cause of spontaneous tension fatigue a fullness without a bad humour and treats it by thinning and cutting, and for the inflammatory kind orders venesection at once on the first day and then arranges three days, barley water, rubbing with a cool or moderate oil, then cooling dishes and river fish, with water withheld as far as possible {cite:canon-ibn-sina-print-v1 pp.249-250}."
