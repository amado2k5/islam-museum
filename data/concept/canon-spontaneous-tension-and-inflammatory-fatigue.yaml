id: concept/canon-spontaneous-tension-and-inflammatory-fatigue
class: concept
kind: scientific
label: { ar: "الإعياء التمددي والورمي الحادث بنفسه عند ابن سينا", en: "Spontaneous tension and inflammatory fatigue in the Canon", ur: "خود پیدا ہونے والی کھنچاؤ اور ورمی تھکن قانون میں", es: "Tensión espontánea y fatiga inflamatoria en el Canon", fr: "Tension spontanée et fatigue inflammatoire dans le Canon" }
summary:
  ar: "يجعل ابن سينا سبب التمددي الحادث بنفسه امتلاء بلا رداءة خلط ويعالجه بالتلطيف والتقطيع، ويأمر في الورمي بالمبادرة إلى الفصد في اليوم الأول، ثم يرتب الغذاء ثلاثة أيام من ماء الشعير والدلك بدهن بارد أو معتدل ثم الأغذية الباردة والسمك الرضراضي مع منع الماء ما أمكن {cite:canon-ibn-sina-print-v1 pp.249-250}."
  en: "Ibn Sina makes the cause of spontaneous tension fatigue a fullness without a bad humour and treats it by thinning and cutting, and for the inflammatory kind orders venesection at once on the first day and then arranges three days, barley water, rubbing with a cool or moderate oil, then cooling dishes and river fish, with water withheld as far as possible {cite:canon-ibn-sina-print-v1 pp.249-250}."
  es: "Ibn Sina considera que la causa de la fatiga por tensión espontánea es una plenitud sin mal humor y la trata mediante adelgazamiento y corte, y para el tipo inflamatorio ordena la flebotomía inmediatamente el primer día y luego dispone durante tres días agua de cebada, frotamiento con un aceite frío o moderado, luego platos fríos y pescado de río, con agua retenida en la medida de lo posible {cite:canon-ibn-sina-print-v1 pp.249-250}."
  fr: "Ibn Sina attribue la fatigue spontanée de tension à une plénitude sans mauvaise humeur et la traite en amincissant et en coupant, et pour la forme inflammatoire, il prescrit une saignée dès le premier jour, puis prévoit pendant trois jours de l'eau d'orge, des frictions avec une huile fraîche ou modérée, puis des plats froids et du poisson de rivière, en limitant autant que possible la consommation d'eau {cite:canon-ibn-sina-print-v1 pp.249-250}."
  ur: "ابن سینا بے ساختہ تناؤ کی تھکاوٹ کی وجہ کو بغیر کسی برے مزاح کے مکمل بناتا ہے اور اس کا علاج پتلا اور کاٹ کر کرتا ہے اور سوزش والی قسم کے لیے پہلے دن ایک ہی وقت میں نس نکالنے کا حکم دیتا ہے اور پھر تین دن جو کا پانی، ٹھنڈے یا معتدل تیل سے مالش کرنے کا انتظام کرتا ہے، پھر برتن ٹھنڈا کرنے اور دریائی مچھلیوں کو جہاں تک ممکن ہو پانی کے ساتھ ملاتا ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 249-250}۔"
