tags: [trade-browser, trade-caravans, trade-trade]
label:
  ar: إيلاف قريش
  en: The ilaf of Quraysh
  ur: قریش کا ایلاف
  es: "El ilaf de Quraysh"
  fr: "L'ilaf de Quraysh"
  tr: "Elaf Qureish"
  id: "Elaf Quraish"
summary:
  ar: "الإيلاف في كلام المفسّرين: أَلْفة قريش وعهدهم الذي جرت به رحلتا الشتاء إلى اليمن والصيف إلى الشام والحبشة؛ يذكر الرازي في مفاتيح الغيب عند قوله تعالى «لإيلاف قريش» أن قريشًا كانوا أهل الحرم فلا يُغير عليهم فيه، فيرتحلون الشتاء إلى اليمن والصيف إلى الشام آمنين {cite:mafatih-al-ghayb-quran-tafsir-net}. وينسب ابن هشام إلى غيره أن هاشم بن عبد مناف أول من سنّ لقريش رحلتيهما، فكان يخرج بالتجار إلى الشام ومصر والعراق واليمن ويعاهد ملوك تلك الأطراف على أمان قوافلهم {cite:ibn-hisham-sira}."
  en: "Ilaf in the exegetes' usage: Quraysh's covenant and accustomed security by which the two journeys ran — the winter caravan to Yemen and the summer caravan to al-Sham and Abyssinia. Al-Razi, at 'li-ilafi Quraysh', explains that Quraysh, as people of the Sanctuary, travelled winter and summer unmolested {cite:mafatih-al-ghayb-quran-tafsir-net}; Ibn Hisham attributes to others that Hashim b. Abd Manaf first instituted the two journeys and made pacts with the neighbouring rulers for the safety of Qurashi caravans {cite:ibn-hisham-sira}."
  ur: "مفسرین کی اصطلاح میں ایلاف: قریش کا وہ عہد اور معمول کی امن جس سے دو سفر چلتے تھے — شتاء کا قافلہ یمن اور صیف کا قافلہ شام اور حبشہ کی طرف۔ رازی «لإيلاف قريش» کے ذیل میں بیان کرتے ہیں کہ قریش اہلِ حرم ہونے کے سبب دونوں موسموں میں بلا خوف سفر کرتے تھے {cite:mafatih-al-ghayb-quran-tafsir-net}؛ ابن ہشام کے نزدیک ہاشم بن عبد مناف نے پہلی بار یہ دو سفر قائم کیے اور پڑوسی بادشاہوں سے قوافل کی امان کے معاہدے کیے {cite:ibn-hisham-sira}."
  es: "Ilaf en el uso de los exegetas: el pacto de Quraysh y la seguridad habitual que regía los dos viajes: la caravana de invierno a Yemen y la caravana de verano a al-Sham y Abisinia. Al-Razi, en 'li-ilafi Quraysh', explica que los Quraysh, como gente del Santuario, viajaban en invierno y verano sin ser molestados {cite:mafatih-al-ghayb-quran-tafsir-net}; Ibn Hisham atribuye a otros que Hashim b. Abd Manaf fue el primero en instituir los dos viajes e hizo pactos con los gobernantes vecinos para la seguridad de las caravanas Qurashi {cite:ibn-hisham-sira}."
  fr: "Le terme « ilaf », selon les exégètes, désigne l'accord conclu par les Qurayshites et la sécurité habituelle qui encadrait leurs deux voyages: la caravane d'hiver vers le Yémen et la caravane d'été vers le Levant et l'Abyssinie. Al-Razi, dans son ouvrage « li-ilafi Quraysh », explique que les Qurayshites, peuple du Sanctuaire, voyageaient sans encombre, hiver comme été. Ibn Hisham attribue à d'autres que Hashim ibn Abd Manaf fut le premier à instituer ces deux voyages et à conclure des pactes avec les souverains voisins pour assurer la sécurité des caravanes qurayshites."
  tr: "El-İlaf, yorumcuların sözleriyle: Qurayş'ın tanıdıklığı ve onların yolculuğuna yol açan antlaşmaları—kışın Yemen'e, yazın Levant ve Habeş'e; El-Razi, Mafatih al-Ghayb (Görünmeyenin Sırları) adlı eserinde Allah'ın \"Qurayş'ın yakınlığı\" dediğinde, Kurayşların kutsal alanın insanları olduğunu, böylece kimsenin oraya gitmeyeceğini belirtir. Kışın Yemen'e, yazın ise Levant'a güvende seyahat ederlerdi {cite:mafatih-al-ghayb-kuran-tafsir-net}. İbn Hisham, başkalarına Haşim bin Abd Manaf'ın Kurayş'ın iki yolculuğunu başlatan ilk kişi olduğunu, tüccarlarla birlikte Levant, Mısır, Irak ve Yemen'e seyahat ettiğini ve bu bölgelerin krallarıyla kervanlarının güvenliğini sağlamak için anlaşmalar yaptığını belirtir {cite:ibn-hisham-sira}."
  id: "Al-Ilaf dalam kata-kata para komentator: Keakraban Quraisy dan perjanjian mereka, yang membawa perjalanan mereka—musim dingin ke Yaman dan musim panas ke Levant dan Abyssinia; Al-Razi menyebutkan dalam Mafatih al-Ghayb (Rahasia Yang Tak Terlihat) ketika Allah berkata \"kedekatan Quraisy\" bahwa Quraisy adalah umat tempat suci, sehingga tidak ada yang mengubah jalan ke sana. Mereka akan melakukan perjalanan di musim dingin ke Yaman dan musim panas ke Levant, aman {cite:mafatih-al-ghayb-quran-tafsir-net}. Ibn Hisham mengaitkan kepada yang lain bahwa Hashim ibn Abd Manaf adalah yang pertama memulai dua perjalanan Quraisy, bepergian bersama pedagang ke Levant, Mesir, Irak, dan Yaman, serta membuat perjanjian dengan raja-raja di wilayah tersebut untuk memastikan keselamatan karavan mereka {cite:ibn-hisham-sira}."
