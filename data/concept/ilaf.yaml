tags: [trade-browser, trade-caravans, trade-trade]
label:
  ar: إيلاف قريش
  en: The ilaf of Quraysh
  ur: قریش کا ایلاف
  es: "El ilaf de Quraysh"
summary:
  ar: "الإيلاف في كلام المفسّرين: أَلْفة قريش وعهدهم الذي جرت به رحلتا الشتاء إلى اليمن والصيف إلى الشام والحبشة؛ يذكر الرازي في مفاتيح الغيب عند قوله تعالى «لإيلاف قريش» أن قريشًا كانوا أهل الحرم فلا يُغير عليهم فيه، فيرتحلون الشتاء إلى اليمن والصيف إلى الشام آمنين {cite:mafatih-al-ghayb-quran-tafsir-net}. وينسب ابن هشام إلى غيره أن هاشم بن عبد مناف أول من سنّ لقريش رحلتيهما، فكان يخرج بالتجار إلى الشام ومصر والعراق واليمن ويعاهد ملوك تلك الأطراف على أمان قوافلهم {cite:ibn-hisham-sira}."
  en: "Ilaf in the exegetes' usage: Quraysh's covenant and accustomed security by which the two journeys ran — the winter caravan to Yemen and the summer caravan to al-Sham and Abyssinia. Al-Razi, at 'li-ilafi Quraysh', explains that Quraysh, as people of the Sanctuary, travelled winter and summer unmolested {cite:mafatih-al-ghayb-quran-tafsir-net}; Ibn Hisham attributes to others that Hashim b. Abd Manaf first instituted the two journeys and made pacts with the neighbouring rulers for the safety of Qurashi caravans {cite:ibn-hisham-sira}."
  ur: "مفسرین کی اصطلاح میں ایلاف: قریش کا وہ عہد اور معمول کی امن جس سے دو سفر چلتے تھے — شتاء کا قافلہ یمن اور صیف کا قافلہ شام اور حبشہ کی طرف۔ رازی «لإيلاف قريش» کے ذیل میں بیان کرتے ہیں کہ قریش اہلِ حرم ہونے کے سبب دونوں موسموں میں بلا خوف سفر کرتے تھے {cite:mafatih-al-ghayb-quran-tafsir-net}؛ ابن ہشام کے نزدیک ہاشم بن عبد مناف نے پہلی بار یہ دو سفر قائم کیے اور پڑوسی بادشاہوں سے قوافل کی امان کے معاہدے کیے {cite:ibn-hisham-sira}."
  es: "Ilaf en el uso de los exegetas: el pacto de Quraysh y la seguridad habitual que regía los dos viajes: la caravana de invierno a Yemen y la caravana de verano a al-Sham y Abisinia. Al-Razi, en 'li-ilafi Quraysh', explica que los Quraysh, como gente del Santuario, viajaban en invierno y verano sin ser molestados {cite:mafatih-al-ghayb-quran-tafsir-net}; Ibn Hisham atribuye a otros que Hashim b. Abd Manaf fue el primero en instituir los dos viajes e hizo pactos con los gobernantes vecinos para la seguridad de las caravanas Qurashi {cite:ibn-hisham-sira}."
