  ur: "طرغافیثا ⁦(کثیرا)⁩"
  es: "Taraghafitha (tragacanto)"
summary:
  ar: "شوك الكثيراء، أصله العريض الخشن يُظهر صمغاً إذا قُطع؛ يُعجن بالعسل تحت اللسان للسعال وخشونة الصدر، ويُستعمل مع قرن الأيل المحرق والشب اليماني للكليتين والمثانة."
  en: "The thorny tragacanth, whose broad rough root gives a gum when cut; kneaded with honey and placed under the tongue for cough and a rough chest, and used with burnt deer horn and Yemeni alum for kidney and bladder pains."
  ur: "کثیرا کا کانٹے دار پودا، جس کی چوڑی کھردری جڑ کاٹنے پر گوند دیتی ہے؛ شہد میں گوندھ کر زبان کے نیچے رکھنے سے کھانسی اور سینے کی خشکی میں فائدہ ہوتا ہے، اور جلے ہوئے ہرن کے سینگ اور یمنی پھٹکری کے ساتھ گردوں اور مثانے کے درد میں۔"
  es: "La espinosa tragacanto, cuya ancha y áspera raíz produce una goma al cortarla, se amasa con miel y se coloca debajo de la lengua para la tos y la irritación del pecho, y se usa con cuerno de ciervo quemado y alumbre yemení para los dolores de riñón y vejiga."
