id: "concept/al-khayalat"
class: "concept"
kind: "scientific"
label:
  ar: "الخيالات"
  en: "Floaters before the sight (al-khayalat)"
  fr: "Corps flottants dans le champ visuel (al-khayalat)"
  ur: "نظر کے سامنے خیالات"
  es: "Moscas flotantes ante la vista (al-khayalat)"
summary:
  ar: "الخيالات ألوان يحس أمام البصر كأنها مبثوثة في الجو، وسببها وقوف شيء غير شفاف بين الجليدية والمبصرات: إما ما لا يدرك في العادة إلا للقوي البصر من هباءات الجو وآثار أبخرة الباطن وهذا لا ينسب إلى مضرة، وإما ما يدركه الوسط من آثار خفية على القرنية أو من تغير الرطوبات أو بخارات واردة تتمكن فتنذر بالماء {cite:canon-ibn-sina-print-v2 p.207} {cite:canon-ibn-sina-print-v2 p.208}"
  en: "Khayalat are hues sensed before the sight as though scattered in the air; their cause is something non-transparent standing between the ice-like humour and the objects seen: either what only the very keen sight perceives — motes of the air or traces of inner vapours, not counted a harm — or what ordinary sights perceive: faint traces on the cornea, or a change in the humours, or incoming vapours that settle and herald the water {cite:canon-ibn-sina-print-v2 p.207} {cite:canon-ibn-sina-print-v2 p.208}"
  fr: "Les khayalat sont des teintes perçues devant les yeux comme si elles étaient dispersées dans l’air. L’auteur les attribue à un élément opaque qui s’interpose entre l’humeur cristalline et les objets regardés. Il peut s’agir de ce que seule une vue très perçante distingue — des particules en suspension dans l’air ou des traces de vapeurs internes, qui ne sont pas tenues pour nuisibles — ou de ce qu’une vue ordinaire distingue : de légères traces sur la cornée, une altération des humeurs ou des vapeurs venues d’ailleurs qui s’y déposent et annoncent la venue de l’eau {cite:canon-ibn-sina-print-v2 p.207} {cite:canon-ibn-sina-print-v2 p.208}"
  ur: "خیالات وہ رنگ ہیں جو بینائی کے سامنے فضا میں بکھرے محسوس ہوتے ہیں؛ ان کا سبب جلیدیہ اور مرئیات کے درمیان غیر شفاف شے کا آنا ہے: یا تو وہ شے جو صرف بہت تیز بصارت محسوس کرتی ہے — ہوا کے ذرات یا باطنی بخارات کے آثار، اور یہ مضرت شمار نہیں ہوتی — یا وہ جو عام بصارتیں محسوس کریں: قرنیہ پر لطیف آثار، یا رطوبتوں کی تبدیلی، یا آنے والی بخارات جو ٹھہرتیں اور پانی کی پیش بندی کرتی ہیں {cite:canon-ibn-sina-print-v2 p.207} {cite:canon-ibn-sina-print-v2 p.208}۔"
  es: "Los khayalat son matices que se perciben antes de la vista como si estuvieran dispersos en el aire; su causa es algo opaco que se interpone entre el humor gélido y los objetos vistos: ya sea lo que solo percibe la vista muy aguda —partículas de aire o rastros de vapores internos, que no se consideran un daño— o lo que perciben las vistas ordinarias: leves rastros en la córnea, un cambio en los humores o vapores entrantes que se asientan y anuncian el agua {cite:canon-ibn-sina-print-v2 p.207} {cite:canon-ibn-sina-print-v2 p.208}"
