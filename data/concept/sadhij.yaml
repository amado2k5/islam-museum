id: concept/sadhij
class: concept
kind: natural
label:
  ar: "ساذج"
  en: "Sadhij (the water leaf of India)"
  ur: "ساذج"
  es: "Sadhij (la hoja de agua de la India)"
  fr: "Sadhij (la feuille d'eau de l'Inde)"
summary:
  ar: "الساذج في الكتاب قريب القوة من السنبل إلا أنه ألين، أوراق تظهر على وجه الماء في بلاد الهند، حار يابس في الثانية، أجوده الحديث الضارب إلى البياض، يحفظ الثياب من السوس فيما يقال، ويطيب النكهة، وهو أنفع للمعدة والكبد وأشد إدراراً من الناردين {cite:canon-ibn-sina-print-v1 p.585}."
  en: "Sadhij is in the book close in strength to sunbul but softer, leaves that appear on the face of the water in India, hot and dry in the second degree, best when fresh and inclining to white; it is said to keep clothes from moths and sweetens the breath, and it is more helpful to the stomach and liver and more strongly diuretic than nardin {cite:canon-ibn-sina-print-v1 p.585}."
  ur: "ساذج کتاب میں قوت میں سنبل کے قریب مگر اس سے نرم ہے، ہند میں پانی کی سطح پر ظاہر ہونے والے پتے، دوسرے درجے میں گرم خشک، بہترین نیا، سفیدی کی طرف مائل؛ کہا جاتا ہے کہ کپڑوں کو گھن سے بچاتا ہے، سانس مہکاتا ہے، اور معدے اور جگر کے لیے ناردین سے زیادہ مفید اور پیشاب لانے میں اس سے زیادہ سخت ہے {cite:canon-ibn-sina-print-v1 p.585}۔"
  es: "En el libro, el Sadhij es similar en potencia al Sunbul pero más suave, hojas que aparecen en la superficie del agua en la India, caliente y seco en segundo grado, mejor cuando está fresco y tiende a ser blanco; se dice que protege la ropa de las polillas y endulza el aliento, y es más beneficioso para el estómago y el hígado y más diurético que el Nardin {cite:canon-ibn-sina-print-v1 p.585}."
  fr: "Le sadhiji est décrit dans le livre comme ayant une force proche de celle du sunbul mais plus douce, ses feuilles apparaissent à la surface de l'eau en Inde, chaudes et sèches au deuxième degré, meilleures lorsqu'elles sont fraîches et tendent vers le blanc; on dit qu'il protège les vêtements des mites et adoucit l'haleine, et qu'il est plus bénéfique pour l'estomac et le foie et plus fortement diurétique que la nardine {cite:canon-ibn-sina-print-v1 p.585}."
