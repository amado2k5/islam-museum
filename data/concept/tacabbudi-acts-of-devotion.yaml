id: concept/tacabbudi-acts-of-devotion
class: concept
kind: legal
label:
  ar: "التعبدي"
  en: "Ta'abbudi (rules whose reason is not given: acts of pure obedience)"
  ur: "تعبدی ⁦(وہ احکام جن کی علت معلوم نہ ہو: محض بندگی کے احکام)⁩"
  es: "Ta'abbudi (reglas cuya razón no se da: actos de pura obediencia)"
  fr: "Ta'abbudi (règles dont la raison n'est pas donnée: actes d'obéissance pure)"
  tr: "ibadet"
  id: "devosional"
summary:
  ar: "التعبدي المنسوب إلى التعبد، وهو في الاصطلاح الأحكام التي لا يظهر للعباد في تشريعها حكمة غير مجرد التكليف بها اختباراً لطاعتهم. والجمهور يرون أن أحكام الله معللة بمصالح العباد، وإنما يكون الحكم تعبدياً عند العجز عن التعليل. ومن خصائص التعبدي أنه لا يقاس عليه، وأن الأصل فيه التعبد، والأصل في العادات الالتفات إلى المعاني. وأفضل التعبدي عند بعضهم لأنه أبلغ في الانقياد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5377}"
  en: "Ta'abbudi is what the law commands without a reason the servant can grasp, so that obedience alone is the point. Most scholars hold that God's rulings have reasons in the interest of people, and a ruling is called ta'abbudi only when the reason cannot be found. Its marks: it is not reasoned from by analogy, the basis of worship is the command while the basis of custom is the purpose; some hold ta'abbudi more excellent for its pure submission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5377}"
  es: "Ta'abbudi es lo que la ley ordena sin una razón que el siervo pueda comprender, de modo que la obediencia es lo único importante. La mayoría de los eruditos sostienen que los preceptos de Dios tienen razones que benefician a las personas, y un precepto se denomina ta'abbudi solo cuando no se encuentra dicha razón. Sus características son: no se basa en razonamientos por analogía; el fundamento del culto es el mandato, mientras que el fundamento de la costumbre es el propósito; algunos consideran que ta'abbudi es más excelente por su sumisión pura. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5365} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5366} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5367} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5369} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5371} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5374} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5376} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5377}"
  fr: "Le ta'abbudi désigne ce que la loi ordonne sans raison compréhensible pour le serviteur, l'obéissance seule étant alors primordiale. La plupart des savants estiment que les décisions divines sont motivées par l'intérêt du peuple et qu'une décision n'est qualifiée de ta'abbudi que lorsque sa raison demeure introuvable. Ses caractéristiques: elle ne repose pas sur un raisonnement par analogie; le culte se fonde sur le commandement tandis que la coutume se fonde sur le but; certains considèrent le ta'abbudi comme supérieur en raison de sa soumission absolue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5377}"
  ur: "تبودی وہ ہے جس کا قانون بغیر کسی وجہ کے حکم دیتا ہے بندہ سمجھ سکتا ہے، اس لیے صرف اطاعت ہی نقطہ ہے۔ اکثر علماء کا خیال ہے کہ خدا کے احکام لوگوں کے مفاد میں اسباب ہوتے ہیں، اور کسی حکم کو تبودی کہا جاتا ہے جب وجہ تلاش نہ ہو۔ اس کے نشانات: مشابہت سے استدلال نہیں کیا جاتا، عبادت کی بنیاد حکم ہے جبکہ رواج کی بنیاد مقصد ہے۔ کچھ لوگ تبودی کو اس کے خالص تسلیم کرنے کے لیے زیادہ بہترین سمجھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5365} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5366} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5367} صفحہ 5369} {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 5371} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص5374} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ5376} {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 5377}"
  tr: "İbadet, ibadete atfedilir ve terminolojide, yasaları hizmetçilere sadece itaatlerini test etmek zorunda olmalarından başka bir bilgelik göstermeyen hükümlerdir. Çoğunluk, Tanrı'nın hükümlerinin hizmetkârların çıkarları doğrultusunda olduğuna ve hükümün ancak gerekçe yoksa ibadet odaklı olduğuna inanır. İbadetin özelliklerinden biri, bunun ölçülmemesi ve geleneklerde varsayılan olarak anlamlara dikkat edilmesidir. Bazıları ibadet daha çok teslimiyet yoluyla ifade edildiği için tercih eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5377}"
  id: "Ibadah dikaitkan dengan ibadah, dan dalam istilah itu, ini adalah aturan yang undang-undangnya tidak menunjukkan kebijaksanaan kepada hamba selain hanya kewajiban bertindak sebagai ujian ketaatan mereka. Mayoritas percaya bahwa perintah Tuhan dibenarkan oleh kepentingan para pelayan, dan putusan hanya bersifat devosi ketika tidak ada pembenaran untuk itu. Salah satu ciri ibadah adalah tidak diukur terhadap ibadah, dan kebiasaan dalam adat adalah memperhatikan makna. Beberapa lebih memilih ibadah karena lebih disampaikan dalam penyerahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5377}"
