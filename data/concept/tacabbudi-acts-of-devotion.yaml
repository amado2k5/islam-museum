label:
  ar: "التعبدي"
  en: "Ta'abbudi (rules whose reason is not given: acts of pure obedience)"
  ur: "تعبدی (وہ احکام جن کی علت معلوم نہ ہو: محض بندگی کے احکام)"
summary:
  ar: "التعبدي المنسوب إلى التعبد، وهو في الاصطلاح الأحكام التي لا يظهر للعباد في تشريعها حكمة غير مجرد التكليف بها اختباراً لطاعتهم. والجمهور يرون أن أحكام الله معللة بمصالح العباد، وإنما يكون الحكم تعبدياً عند العجز عن التعليل. ومن خصائص التعبدي أنه لا يقاس عليه، وأن الأصل فيه التعبد، والأصل في العادات الالتفات إلى المعاني. وأفضل التعبدي عند بعضهم لأنه أبلغ في الانقياد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5377}"
  en: "Ta'abbudi is what the law commands without a reason the servant can grasp, so that obedience alone is the point. Most scholars hold that God's rulings have reasons in the interest of people, and a ruling is called ta'abbudi only when the reason cannot be found. Its marks: it is not reasoned from by analogy, the basis of worship is the command while the basis of custom is the purpose; some hold ta'abbudi more excellent for its pure submission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5377}"
