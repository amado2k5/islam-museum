  en: "Greed (hirs)"
  ur: "حرص"
summary:
  ar: "الحرص في درس الشيخ عمر عبد الكافي شَرَه المال والدنيا؛ ويضرب مثل من يشرب ماء البحر فيزداد عطشا، ويرى أن الأماني لا تنتهي، وأن المليارات لا تغني شيئا عن رغيف الخبز. (رأي الشيخ) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
  en: "In Sheikh Omar Abdelkafy's lessons, greed is the craving for money and the world; he gives the image of one who drinks sea water and grows thirstier, and holds that wishes never end and that billions buy no more than a loaf of bread (his view). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
  ur: "شیخ عمر عبدالکافی کے درس میں حرص مال اور دنیا کی ہوس ہے؛ وہ اس شخص کی مثال دیتے ہیں جو سمندر کا پانی پیتا ہے اور زیادہ پیاسا ہوتا جاتا ہے، اور کہتے ہیں کہ خواہشیں ختم نہیں ہوتیں اور اربوں کی رقم بھی روٹی کے ایک ٹکڑے سے زیادہ کچھ نہیں خرید سکتی (شیخ کی رائے)۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
