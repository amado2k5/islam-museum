summary:
  ar: "الحرص في درس الشيخ عمر عبد الكافي شَرَه المال والدنيا؛ ويضرب مثل من يشرب ماء البحر فيزداد عطشا، ويرى أن الأماني لا تنتهي، وأن المليارات لا تغني شيئا عن رغيف الخبز. ⁦(رأي الشيخ)⁩ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
  en: "In Sheikh Omar Abdelkafy's lessons, greed is the craving for money and the world; he gives the image of one who drinks sea water and grows thirstier, and holds that wishes never end and that billions buy no more than a loaf of bread (his view). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
  ur: "شیخ عمر عبدالکافی کے درس میں حرص مال اور دنیا کی ہوس ہے؛ وہ اس شخص کی مثال دیتے ہیں جو سمندر کا پانی پیتا ہے اور زیادہ پیاسا ہوتا جاتا ہے، اور کہتے ہیں کہ خواہشیں ختم نہیں ہوتیں اور اربوں کی رقم بھی روٹی کے ایک ٹکڑے سے زیادہ کچھ نہیں خرید سکتی ⁦(شیخ کی رائے)⁩۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
  es: "En las enseñanzas del jeque Omar Abdelkafy, la codicia es el ansia de dinero y de bienes materiales; utiliza la metáfora de quien bebe agua de mar y siente cada vez más sed, y sostiene que los deseos nunca terminan y que miles de millones no compran más que una hogaza de pan (su opinión). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
  fr: "Dans les enseignements du cheikh Omar Abdelkafy, l'avidité est la soif d'argent et de biens matériels; il la compare à celle de celui qui boit de l'eau de mer et dont la soif s'intensifie, et affirme que les désirs sont sans fin et que des milliards ne permettent d'acheter qu'une miche de pain (selon son point de vue). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
  tr: "Şeyh Ömer Abdulkafi'nin dersindeki temkinlilik, zenginlik ve dünyevi kazanç için açgözlülüktür; deniz suyu içip daha da susayan, dileklerin bitmediğine ve milyarlarca paranın bir somun ekmek için değersiz olduğuna inanan biri gibidir. (Şeyh'in görüşü) {kaynak:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep02 00:26:30}"
  id: "Kehati-hatian dalam pelajaran Sheikh Omar Abdulkafi adalah serakah akan kekayaan dan keuntungan duniawi; dia seperti seseorang yang minum air laut dan menjadi semakin haus, percaya bahwa harapan tidak pernah habis, dan bahwa miliaran tidak berharga untuk sepotong roti. (Pendapat Sheikh) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:26:30}"
