label:
  ar: من دُفن بالبقيع من الصحابة وأهل بيت النبي
  en: Companions and members of the Prophet's household buried at al-Baqi'
  ur: بقیع میں دفن صحابہ اور اہلِ بیتِ نبی
  es: "Compañeros y miembros de la familia del Profeta enterrados en al-Baqi'."
  fr: "Compagnons et membres de la famille du Prophète enterrés à al-Baqi'"
  tr: "Peygamberin sahabeleri ve ailesi tarafından Al-Baqi'ye gömülmüştür"
  id: "Yang dimakamkan di Al-Baqi' dari para sahabat dan keluarga nabi"
summary:
  ar: يذكر ابن حجر عن الواقدي أن أول من دُفن بالبقيع أسعد بن زرارة عند الأنصار وعثمان بن مظعون عند المهاجرين {cite:isaba scan vol. 1 p. 210}، وتذكر «السير» أن النبي وضع حجراً عند رأس عثمان علامةً {cite:siyar-alam-nubala scan vol. 1 p. 2667}. ودُفن بالبقيع إبراهيم ابن النبي {cite:al-bidaya-wal-nihaya scan vol. 3 p. 337} ورقية {cite:al-bidaya-wal-nihaya scan vol. 6 p. 359} والعباس {cite:siyar-alam-nubala scan vol. 1 p. 382} والحسن بن علي {cite:siyar-alam-nubala scan vol. 1 p. 1435} وعائشة {cite:siyar-alam-nubala scan vol. 1 p. 2090}. وتنسب كل رواية إلى راويها، وتُذكر الخلافات.
  en: Ibn Hajar relays from al-Waqidi that the first buried at al-Baqi' was As'ad ibn Zurara in the Ansar's view and Uthman ibn Maz'un in the Muhajirun's {cite:isaba scan vol. 1 p. 210}; the Siyar says the Prophet set a stone at Uthman's head as a marker {cite:siyar-alam-nubala scan vol. 1 p. 2667}. Buried at al-Baqi' are the Prophet's son Ibrahim {cite:al-bidaya-wal-nihaya scan vol. 3 p. 337}, Ruqayya {cite:al-bidaya-wal-nihaya scan vol. 6 p. 359}, al-Abbas {cite:siyar-alam-nubala scan vol. 1 p. 382}, al-Hasan ibn Ali {cite:siyar-alam-nubala scan vol. 1 p. 1435} and Aisha {cite:siyar-alam-nubala scan vol. 1 p. 2090}. Each report is attributed to its narrator and disagreements are noted.
  ur: ابن حجر واقدی سے نقل کرتے ہیں کہ بقیع میں سب سے پہلے دفن ہونے والے انصار کے نزدیک اسعد بن زرارہ اور مہاجرین کے نزدیک عثمان بن مظعون تھے {cite:isaba scan vol. 1 p. 210}؛ «سیر» کہتی ہے کہ نبی نے عثمان کے سر کے پاس نشانی کے طور پر پتھر رکھا {cite:siyar-alam-nubala scan vol. 1 p. 2667}۔ بقیع میں نبی کے بیٹے ابراہیم {cite:al-bidaya-wal-nihaya scan vol. 3 p. 337}، رقیہ {cite:al-bidaya-wal-nihaya scan vol. 6 p. 359}، عباس {cite:siyar-alam-nubala scan vol. 1 p. 382}، حسن بن علی {cite:siyar-alam-nubala scan vol. 1 p. 1435} اور عائشہ {cite:siyar-alam-nubala scan vol. 1 p. 2090} دفن ہیں۔ ہر روایت اس کے راوی کی طرف منسوب ہے اور اختلافات ذکر کیے گئے ہیں۔
  es: "Ibn Hajar transmite de al-Waqidi que el primero enterrado en al-Baqi' fue As'ad ibn Zurara en la opinión de los Ansar y Uthman ibn Maz'un en la de los Muhajirun {cite:isaba scan vol. 1 p. 210}; el Siyar dice que el Profeta puso una piedra en la cabeza de Uthman como marcador {cite:siyar-alam-nubala scan vol. 1 p. 2667}. Enterrados en al-Baqi' están el hijo del Profeta Ibrahim {cite:al-bidaya-wal-nihaya scan vol. 3 p. 337}, Ruqayya {cite:al-bidaya-wal-nihaya scan vol. 6 p. 359}, al-Abbas {cite:siyar-alam-nubala scan vol. 1 p. 382}, al-Hasan ibn Ali {cite:siyar-alam-nubala scan vol. 1 p. 1435} y Aisha {cite:siyar-alam-nubala scan vol. 1 p. 2090}. Cada relato se atribuye a su narrador y se señalan las discrepancias."
  fr: "Ibn Hajar rapporte d'al-Waqidi que, selon les Ansar, le premier à être enterré à al-Baqi' fut As'ad ibn Zurara, et selon les Muhajirun, Uthman ibn Maz'un (Isaba, vol. 1, p. 210). Le Siyar indique que le Prophète fit placer une pierre à la tête d'Uthman comme repère (Siyar-alam-nubala, vol. 1, p. 2667). Sont enterrés à al-Baqi' le fils du Prophète, Ibrahim (Al-bidaya-wal-nihaya, vol. 3, p. 337), Ruqayya (Al-bidaya-wal-nihaya, vol. 6, p. 359) et al-Abbas (Siyar-alam-nubala, vol. 1, p. 3667). 382}, al-Hasan ibn Ali {cite:siyar-alam-nubala scan vol. 1 p. 1435} et Aisha {cite:siyar-alam-nubala scan vol. 1 p. 2090}. Chaque récit est attribué à son narrateur et les divergences sont notées."
  tr: "İbn Hacer, el-Vakidi'den El-Baqi'de ilk defnelenlerin Ensar arasında As'ad ibn Zurara ve Muhacironlar arasında Osman ibn Maz'un olduğunu belirtir {atıf:Isaba Scan cilt 1, s. 210}. \"Siyar\"da Peygamber'in Uthman'ın başının yanına bir taş koyduğu belirtilir {cite:Siyar-alam-Nubala Scan cilt 1, s. 2667} Peygamber'in oğlu İbrahim, Al-Baqi' {cite:al-bidaya-wal-nihaya scan cilt 3, s. 337}, al-bidaya-wal-nihaya scan cilt 6, s. 359}, al-Abbas {cite:siyar-alam-nubala scan cilt 1, s. 382}, al-Hasan ibn Ali {cite:siyar-alam-nubala scan cilt 1, s. 1435} ve Aisha {cite:siyar-alam-nubala taranı cilt 1, s. 2090} içinde defnedilmiştir. Her anlatım anlatıcısına atfedilir ve anlaşmazlıklar belirtilir."
  id: "Ibn Hajar menyebutkan dari al-Waqidi bahwa yang pertama dimakamkan di Al-Baqi' adalah As'ad ibn Zurara di antara Ansar dan Uthman ibn Maz'oon di antara Muhajirun {cite:Isaba Scan vol. 1, hlm. 210}. \"Siyar\" menyebutkan bahwa Nabi meletakkan sebuah batu di dekat kepala Uthman di sebelah tanda {cite:Siyar-alam-Nubala Scan vol. 1, hlm. 2667}. Ibrahim, putra Nabi, dimakamkan di Al-Baqi' {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 337}, al-bidaya-wal-nihaya scan vol. 6, hlm. 359}, al-Abbas {cite:siyar-alam-nubala scan vol. 1, hlm. 382}, al-Hasan ibn Ali {cite:siyar-alam-nubala scan vol. 1, hlm. 1435}, dan Aisha {cite:siyar-alam-nubala scan vol. 1, hlm. 2090}. Setiap riwayat dikaitkan dengan naratornya, dan perselisihan disebutkan."
