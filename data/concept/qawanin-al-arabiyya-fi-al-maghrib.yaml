id: concept/qawanin-al-arabiyya-fi-al-maghrib
class: concept
kind: legal
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "قوانين اللغة العربية في المغرب"
  en: "Laws on Arabic in Morocco"
  ur: "مراکش میں عربی زبان کے قوانین"
  fr: "Les lois sur la langue arabe au Maroc"
  es: "Las leyes sobre la lengua árabe en Marruecos"
summary:
  ar: "دستور 2011 الفصل 5 الذي يقرر أن العربية تظل اللغة الرسمية للدولة وتعمل الدولة على حمايتها وتطويرها، مع الأمازيغية لغة رسمية، والقانون الإطار رقم 51-17 لسنة 2019 للتعليم والتكوين والبحث العلمي الذي يتخذ العربية لغة التدريس الأساسية، والقانون التنظيمي رقم 26-16 الذي ينظّم الأمازيغية، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:axl-cefan-ulaval-language-legislation} {cite:adala-justice-gov-ma}."
  en: "The 2011 Constitution, Article 5, which states that Arabic remains the official language of the State, which works to protect and develop it, with Amazigh also official; the framework law No. 51-17 of 2019 on education, training and scientific research, which makes Arabic the principal language of teaching; and organic law No. 26-16 on Amazigh, as a research file supplied to the museum summarises them {cite:axl-cefan-ulaval-language-legislation} {cite:adala-justice-gov-ma}."
  ur: "دستور 2011 کی دفعہ 5 جو کہتی ہے کہ عربی ریاست کی سرکاری زبان رہے گی اور ریاست اس کے تحفظ اور ترقی کے لیے کام کرتی ہے، اور امازیغی بھی سرکاری زبان ہے؛ تعلیم، تربیت اور سائنسی تحقیق سے متعلق 2019 کا فریم ورک قانون نمبر 51-17 جو عربی کو تدریس کی بنیادی زبان بناتا ہے؛ اور امازیغی کو منظم کرنے والا نامیاتی قانون نمبر 26-16، جیسا کہ میوزیم کو پیش کی گئی ایک تحقیقی فائل ان کا خلاصہ کرتی ہے {cite:axl-cefan-ulaval-language-legislation} {cite:adala-justice-gov-ma}."
  fr: "La Constitution de 2011, article 5, qui dispose que l'arabe demeure la langue officielle de l'État, lequel œuvre à sa protection et à son développement, l'amazighe étant également officiel ; la loi-cadre n° 51-17 de 2019 relative à l'éducation, à la formation et à la recherche scientifique, qui fait de l'arabe la principale langue d'enseignement ; et la loi organique n° 26-16 sur l'amazighe, telles qu'un dossier de recherche remis au musée les résume {cite:axl-cefan-ulaval-language-legislation} {cite:adala-justice-gov-ma}."
  es: "La Constitución de 2011, artículo 5, que establece que el árabe sigue siendo la lengua oficial del Estado, que trabaja por su protección y desarrollo, siendo también oficial el amazigh; la ley marco n.º 51-17 de 2019 sobre educación, formación e investigación científica, que hace del árabe la lengua principal de enseñanza; y la ley orgánica n.º 26-16 sobre el amazigh, tal como las resume un expediente de investigación entregado al museo {cite:axl-cefan-ulaval-language-legislation} {cite:adala-justice-gov-ma}."
