  ar: "حيوان يعيش في شجر الزيتون، يصيح أكثر الوقت بصرير، ويشوى على الطابق فينفع من أوجاع المثانة."
  en: "An insect the book says lives on olive trees and sings most of the day with a creak; roasted on a flat pan it helps bladder pains."
  ur: "ایک کیڑا جو زیتون کے درختوں پر رہتا ہے اور دن کا بیشتر حصہ چرچراتی آواز میں بولتا ہے؛ چپٹے توے پر بھون کر یہ مثانے کے درد میں فائدہ دیتا ہے۔"
  es: "Según el libro, un insecto vive en los olivos y canta casi todo el día con un crujido; asado en una sartén plana ayuda a aliviar los dolores de vejiga."
  fr: "Un insecte, selon le livre, vit sur les oliviers et chante presque toute la journée d'un chant grinçant; rôti sur une plaque, il soulage les douleurs de la vessie."
  tr: "Zeytin ağaçlarında yaşayan bir hayvandır, çoğu zaman yüksek sesle çığlık atar, yerde mangara yapar ve mesane ağrısına yardımcı olur."
  id: "Hewan yang hidup di pohon zaitun, ia sering berteriak keras, memanggang di lantai, dan membantu mengatasi nyeri kandung kemih."
