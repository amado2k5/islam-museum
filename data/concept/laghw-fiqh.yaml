id: concept/laghw-fiqh
class: concept
kind: legal
label:
  ar: "اللَّغْو"
  en: "Idle speech (laghw), fiqh rulings"
  ur: "لغو (فقہی احکام)"
summary:
  ar: "اللغو في اللغة له معان كثيرة: السقط وما لا يُعتد به من الكلام وغيره، ومنه ما لا يعقد عليه القلب كقول الرجل لا والله وبلى والله، وقالت عائشة إنما اللغو في المراء والهزل والمزاحة في الحديث الذي لا يعقد عليه القلب؛ ومنه الإثم، ومنه اللغط، ومنه النطق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}. واصطلاحاً ضم الكلام بما هو ساقط العبرة منه، أي ما لا معنى له في حق ثبوت الحكم وغيره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}. والباطل أعم من اللغو، فكل لغو باطل وليس كل باطل لغواً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}."
  en: "Laghw, in lexicon, has many senses: a fall, what counts for nothing in speech or otherwise, what the heart does not bind itself to, as in saying no by God or yes by God; Aisha said idle speech is only in dispute, jest and banter in a talk the heart does not bind to; it also means sin, uproar, and utterance. In law it is speech that carries no weight for the ruling; idle is more general than void {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}."
  ur: "لغو لغت میں کئی معنی رکھتا ہے: گرا ہوا، ہر وہ کلام یا چیز جو کسی شمار میں نہ آئے، وہ کلام جس پر دل منعقد نہ ہو جیسے کہنا نہیں اللہ کی قسم اور ہاں اللہ کی قسم؛ عائشہ نے کہا کہ لغو جھگڑے، مذاق اور ایسی بات میں ہے جس پر دل منعقد نہ ہو؛ اور اس کا معنی گناہ، شور اور بولنا بھی ہے۔ اصطلاح میں یہ وہ کلام ہے جو حکم کے ثبوت وغیرہ میں معتبر نہ ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}۔ باطل لغو سے عام ہے، ہر لغو باطل ہے مگر ہر باطل لغو نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}۔"
