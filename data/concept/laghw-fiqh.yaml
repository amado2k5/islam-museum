id: concept/laghw-fiqh
class: concept
kind: legal
label:
  ar: "اللَّغْو"
  en: "Idle speech (laghw), fiqh rulings"
  ur: "لغو ⁦(فقہی احکام)⁩"
  es: "Discurso ocioso (laghw), resoluciones del fiqh"
  fr: "Discours oisif (laghw), décisions de fiqh"
  tr: "Konuşma"
  id: "Pidato"
summary:
  ar: "اللغو في اللغة له معان كثيرة: السقط وما لا يُعتد به من الكلام وغيره، ومنه ما لا يعقد عليه القلب كقول الرجل لا والله وبلى والله، وقالت عائشة إنما اللغو في المراء والهزل والمزاحة في الحديث الذي لا يعقد عليه القلب؛ ومنه الإثم، ومنه اللغط، ومنه النطق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}. واصطلاحاً ضم الكلام بما هو ساقط العبرة منه، أي ما لا معنى له في حق ثبوت الحكم وغيره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}. والباطل أعم من اللغو، فكل لغو باطل وليس كل باطل لغواً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}."
  en: "Laghw, in lexicon, has many senses: a fall, what counts for nothing in speech or otherwise, what the heart does not bind itself to, as in saying no by God or yes by God; Aisha said idle speech is only in dispute, jest and banter in a talk the heart does not bind to; it also means sin, uproar, and utterance. In law it is speech that carries no weight for the ruling; idle is more general than void {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}."
  ur: "لغو لغت میں کئی معنی رکھتا ہے: گرا ہوا، ہر وہ کلام یا چیز جو کسی شمار میں نہ آئے، وہ کلام جس پر دل منعقد نہ ہو جیسے کہنا نہیں اللہ کی قسم اور ہاں اللہ کی قسم؛ عائشہ نے کہا کہ لغو جھگڑے، مذاق اور ایسی بات میں ہے جس پر دل منعقد نہ ہو؛ اور اس کا معنی گناہ، شور اور بولنا بھی ہے۔ اصطلاح میں یہ وہ کلام ہے جو حکم کے ثبوت وغیرہ میں معتبر نہ ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}۔ باطل لغو سے عام ہے، ہر لغو باطل ہے مگر ہر باطل لغو نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}۔"
  es: "Laghw, en el léxico, tiene muchos significados: una caída, algo que no cuenta para nada en el habla o de otra manera, algo a lo que el corazón no se compromete, como decir no por Dios o sí por Dios; Aisha dijo que el habla ociosa solo se da en disputa, broma y charla en una conversación a la que el corazón no se compromete; también significa pecado, alboroto y expresión. En derecho es el habla que no tiene peso para el dictamen; ocioso es más general que vacío {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13652}."
  fr: "Le terme « laghw », dans le lexique, possède de multiples sens: une chute, ce qui est vain, que ce soit dans les paroles ou autrement, ce à quoi le cœur ne s’engage pas, comme lorsqu’on dit « non par Dieu » ou « oui par Dieu ». Aïcha a dit que les paroles vaines ne concernent que les disputes, les plaisanteries et les bavardages, dans un échange auquel le cœur ne s’engage pas. Ce terme signifie également péché, tumulte et parole. En droit, il s’agit de paroles sans valeur pour la décision; le sens de « vain » est plus général que celui de « vide » (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13652)."
  tr: "Dilde boş konuşmanın birçok anlamı vardır: ihmal ve konuşmada dikkate alınmayan şeyler ve diğerleri, bazıları kalbe bağlayıcı değildir, örneğin bir adamın 'Hayır, Allah' ve 'Evet, Allah' demesi.' Aişa şöyle dedi: 'Boş konuşma sadece gösteriş, şaka ve şakadır, kalbin kabul edemeyeceği sözlerdir; ondan günah, ondan karışıklık ve ondan konuşma vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13652}. Teknik olarak, anlamı eksik olan bir ifade ifadesidir; yani bir hüküm veya başka bir şeyle ilgili hiçbir anlamı yoktur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13652}. Yalan tembellikten daha geniştir; tüm boş konuşmalar yalandır, tüm yalan değil {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13652}."
  id: "Pembicaraan kosong dalam bahasa memiliki banyak makna: pengabaian dan apa yang tidak dianggap dalam ucapan dan lainnya, dan beberapa tidak mengikat hati, seperti seseorang berkata 'Tidak, demi Allah' dan 'Ya, demi Allah.' Aisha berkata, 'Omongan kosong hanya dalam hal pamer, bercanda, dan bercanda dalam ucapan yang tidak bisa disetujui hati; dari itu adalah dosa, dari itu adalah kebingungan, dan dari itu adalah ucapan. {cite:\" fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13652}. Secara teknis, ini adalah frasa yang kehilangan makna, yaitu apa yang tidak memiliki makna terkait penetapan suatu putusan atau hal lain {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13652}. Kebohongan lebih luas daripada sekadar kemalasan; semua omongan kosong adalah kebohongan, bukan semua kebohongan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13652}."
