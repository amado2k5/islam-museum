label:
  ar: "اللَّقِيط"
  en: "Foundling (laqit), fiqh rulings"
  ur: "لقیط (فقہی احکام)"
summary:
  ar: "اللقيط في اللغة الطفل الذي يُوجد مرمياً على الطرق لا يُعرف أبوه ولا أمه؛ وعرّفه الحنفية بأنه اسم لحي مولود طرحه أهله خوفاً من العيلة أو فراراً من تهمة الريبة؛ وعرفه المالكية بأنه صغير آدمي لم يُعلم أبوه ولا رقه؛ والشافعية بأنه كل صبي ضائع لا كافل له؛ والحنابلة بأنه طفل غير مميز لا يُعرف نسبه ولا رقه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13681}. واللقطة أعم منه، لأنها تشمل غير الآدمي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13682}."
  en: "Laqit, in lexicon, is a child found thrown on the roads whose father and mother are unknown; the Hanafis define it as a living born child abandoned by his people from fear of poverty or to flee suspicion; the Malikis as a human child whose father and manumission are not known; the Shafi'is as any lost child without a guardian; the Hanbalis as a non-discerning child whose descent and status are unknown. A found thing (luqatah) is wider, since it covers what is not human {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13682}."
  ur: "لقیط لغت میں اس بچے کو کہتے ہیں جو راستوں میں پڑا ملے اور جس کے باپ اور ماں کا پتہ نہ ہو؛ حنفیہ کے نزدیک یہ زندہ پیدا ہونے والا وہ بچہ ہے جسے اس کے گھر والوں نے تنگدستی کے خوف یا تہمت سے بچنے کے لیے چھوڑ دیا؛ مالکیہ کے نزدیک جس کا باپ اور آزادی کی حالت معلوم نہ ہو؛ شافعیہ کے نزدیک ہر گم شدہ بچہ جس کا کوئی کفیل نہ ہو؛ حنابلہ کے نزدیک غیر ممیز بچہ جس کا نسب اور حیثیت معلوم نہ ہو۔ لقطہ اس سے عام ہے، کیونکہ وہ غیر انسان کو بھی شامل ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13682}۔"
