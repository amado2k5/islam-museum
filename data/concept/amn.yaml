id: concept/amn
class: concept
kind: legal
label: { ar: "الأمن", en: "Amn (security of person, property and faith, and the ruler's duty to keep it)", fr: "Amn (sécurité de la personne, des biens et de la foi, et devoir du gouvernant de la maintenir)", es: "Amn (seguridad de la persona, la propiedad y la fe, y el deber del gobernante de mantenerla)", ur: "امن ⁦(شخص، مال اور ایمان کی حفاظت، اور اسے برقرار رکھنا حاکم کا فرض)⁩", tr: "Güvenlik", id: "Güvenlik" }
summary:
  ar: "الأمن ضد الخوف، وهو عدم توقع مكروه في الزمان الآتي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} وهو من أهم ما تقوم عليه الحياة، ومن واجبات الإمام حفظ الدين والفصل في الخصومات وحماية البيضة وإقامة الحدود وتحصين الثغور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411} واتفق الفقهاء على أن أمن الإنسان على نفسه وماله وعرضه شرط في التكليف بالعبادات، فيسقط الاستقبال والجماعة والحج والجهاد والقصاص عند الخوف على النفس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3414}"
  en: "Amn is the opposite of fear: the absence of expected harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} It is among the most necessary things for life, and the ruler's duties include guarding the faith, deciding disputes, protecting the realm, enforcing penalties and fortifying the frontiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411} The jurists agree that a person's safety in life, property and honour is a condition of the obligation to worship; fear for one's life excuses facing the qibla, congregation, pilgrimage, and retaliation that could cause death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3414}"
  fr: "L’amn est le contraire de la peur : l’absence d’un mal attendu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} Il compte parmi les choses les plus nécessaires à la vie, et les devoirs du gouvernant comprennent la garde de la foi, le règlement des litiges, la protection du territoire, l’application des peines et la fortification des frontières. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411} Les juristes s’accordent à dire que la sécurité de la personne dans sa vie, ses biens et son honneur est une condition de l’obligation du culte ; la crainte pour sa vie dispense de l’orientation vers la qibla, de la prière en assemblée, du pèlerinage, et du talion qui pourrait causer la mort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3414}"
  es: "Amn es lo opuesto al miedo: la ausencia de daño esperado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} Es una de las cosas más necesarias para la vida, y los deberes del gobernante incluyen proteger la fe, decidir disputas, proteger el reino, hacer cumplir las penas y fortificar las fronteras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411} Los juristas están de acuerdo en que la seguridad de una persona en la vida, la propiedad y el honor es una condición de la obligación de adorar; el miedo por la vida de uno exime de orientarse hacia la qibla, congregarse, peregrinar y tomar represalias que podrían causar la muerte. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3412}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3413}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3414}"
  ur: "امن خوف کے برعکس ہے: متوقع نقصان کی عدم موجودگی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3409} یہ زندگی کے لیے ضروری چیزوں میں سے ہے، اور حاکم کے فرائض میں ایمان کی حفاظت، تنازعات کا فیصلہ، مملکت کی حفاظت، تعزیرات کا نفاذ اور سرحدوں کو مضبوط کرنا شامل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3410}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411} فقہاء اس بات پر متفق ہیں کہ انسان کی جان، مال اور عزت کی حفاظت عبادت کے واجب ہونے کی شرط ہے۔ کسی کی جان کا خوف قبلہ، جماعت، زیارت، اور انتقامی کارروائی جو موت کا سبب بن سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3411}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3412}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3413}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3413}"
  tr: "Korkuya karşı güvenlik, ki bu da gelecek zamanlarda zarar beklememektir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.3409} Hayatın en önemli yönlerinden biridir ve imamın görevleri arasında dini korumak, anlaşmazlıkları çözmek, yumurtayı korumak, yasal cezalar koymak ve sınırları güçlendirmek vardır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3411} Hukukçular, bir kişinin kendisi, serveti ve onuru üzerindeki güvenliğinin ibadet yapma yükümlülüğü için bir koşul olduğu, bu nedenle ibadet yapma yükümlülüğü, kendisi için korku durumunda biriyle görüşme, cemaat, hac, cihad ve intikam yükümlülüğü kaldırıldığı konusunda hemfikirdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3412}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3414}"
  id: "Korkuya karşı güvenlik, ki bu da gelecek zamanlarda zarar beklememektir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.3409} Hayatın en önemli yönlerinden biridir ve imamın görevleri arasında dini korumak, anlaşmazlıkları çözmek, yumurtayı korumak, yasal cezalar koymak ve sınırları güçlendirmek vardır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3411} Hukukçular, bir kişinin kendisi, serveti ve onuru üzerindeki güvenliğinin ibadet yapma yükümlülüğü için bir koşul olduğu, bu nedenle ibadet yapma yükümlülüğü, kendisi için korku durumunda biriyle görüşme, cemaat, hac, cihad ve intikam yükümlülüğü kaldırıldığı konusunda hemfikirdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3412}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3414}"
