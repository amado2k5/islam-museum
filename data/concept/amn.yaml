id: concept/amn
class: concept
kind: legal
label: { ar: "الأمن", en: "Amn (security of person, property and faith, and the ruler's duty to keep it)" }
summary:
  ar: "الأمن ضد الخوف، وهو عدم توقع مكروه في الزمان الآتي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} وهو من أهم ما تقوم عليه الحياة، ومن واجبات الإمام حفظ الدين والفصل في الخصومات وحماية البيضة وإقامة الحدود وتحصين الثغور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411} واتفق الفقهاء على أن أمن الإنسان على نفسه وماله وعرضه شرط في التكليف بالعبادات، فيسقط الاستقبال والجماعة والحج والجهاد والقصاص عند الخوف على النفس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3414}"
  en: "Amn is the opposite of fear: the absence of expected harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} It is among the most necessary things for life, and the ruler's duties include guarding the faith, deciding disputes, protecting the realm, enforcing penalties and fortifying the frontiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3410}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411} The jurists agree that a person's safety in life, property and honour is a condition of the obligation to worship; fear for one's life excuses facing the qibla, congregation, pilgrimage, and retaliation that could cause death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3411}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3412}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3413}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3414}"
