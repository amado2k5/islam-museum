label:
  ar: دابة الأرض
  en: The Beast of the Earth
  ur: دابہ الارض
summary:
  ar: "الدابة في سورة النمل: دابة من الأرض تخاطب الناس في الوقت الذي تكون فيه الفتن شديدة، وتختم على وجوه أهل الكفر بالنفاق، وتُخرج كل ذات لسان ما كانت تعمل، وتذكر في سياق أشراط الساعة."
  en: "The Beast in Surat an-Naml: a creature of the earth that speaks to people when trials are severe, marks the faces of the unbelieving hypocrites, and declares what every soul has earned — mentioned among the signs before the Hour."
  ur: "دابہ، سورہ النمل میں: زمین کی ایک مخلوق جو سخت فتنے کے زمانے میں لوگوں سے بات کرتی ہے، کافروں کے چہروں پر مہر لگا دیتی ہے، اور ہر صاحبِ زبان کو اس کا عمل بتاتی ہے — یہ ساعت کی نشانیوں میں شمار ہوتی ہے۔"
