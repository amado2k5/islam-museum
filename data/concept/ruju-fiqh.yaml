label:
  ar: "الرجوع"
  en: "Ruju' (return or retraction): in judgment and fatwa, in contracts, in testimony and confession, in apostasy and in the rules of travel"
  ur: "رجوع"
  es: "Ruju' (retractación o retractación): en juicios y fatuas, en contratos, en testimonios y confesiones, en apostasía y en las reglas de viaje."
  fr: "Ruju' (retour ou rétractation): en matière de jugement et de fatwa, de contrats, de témoignage et d'aveu, d'apostasie et de règles de voyage"
  tr: "Dönüş"
  id: "Kembali"
summary:
  ar: "الرجوع في اللغة الانصراف والعود، ويتعدى إلى الرد والفسخ والنقض، وهو في الفقه عود إلى ما كان عليه أو نقض التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} ويكون واجبا كالرجوع إلى الكتاب والسنة عند التنازع، ومستحبا كالإقالة، ومباحا في العقود الجائزة، وحراما كالرجوع في الصدقة، ومكروها كالرجوع في الهبة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8653} ويجوز للمجتهد أن يرجع عن قضائه أو فتواه إذا تغير اجتهاده، وخالف فيه بعض المالكية، والجمهور على أن القضاء الأول لا ينقض بالاجتهاد الثاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8658} وترجع العقود الجائزة كالعارية والوصية والشركة والوكالة والوديعة، ولا يرجع في العقود اللازمة إلا بالتراضي كالإقالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} ويسقط الرجوع بالإسقاط والإبراء وبموت أحد المتعاقدين وبتغير الموهوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8671} وفي الشهادة يضمن الشهود بالرجوع بعد الحكم بالمال، ولا يُستوفى الحد أو القصاص، وفي الإقرار يسقط الحد بالرجوع عند الجمهور، ويقام عند الحسن وأبي ثور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675}"
  en: "Ruju' in the lexicon is turning back; in the law it is a return to what was, or the undoing of an act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} It may be obligatory, as a return to the Qur'an and the Sunna when people dispute; recommended, as the mutual cancellation of a sale; permitted in revocable contracts; forbidden, as taking back a charity; or disliked, as taking back a gift in the Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8653} A judge or mufti may change his ruling when his ijtihad changes; a few Malikis disagreed, but most held that the earlier judgment is not annulled by a later ijtihad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8658} Revocable contracts, such as loan of use, bequest, partnership, agency and deposit, may be revoked; binding contracts may be revoked only by mutual consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} A return is lost by remission, by the death of a party, or by the waiver of a right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8671} In testimony, witnesses who retract after judgment pay the money, and the penalty is not carried out; in confession, a retraction removes the hadd penalty by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675}"
  ur: "رجوع لغت میں لوٹنا ہے، اور فقہ میں کسی تصرف سے پیچھے ہٹنا یا اسے ختم کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} گواہی سے رجوع کی صورت میں فیصلے کے بعد گواہ مال کے ضامن ہوتے ہیں، جبکہ اقرار سے رجوع پر جمہور کے نزدیک حد ساقط ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674}"
  es: "Ruju' en el léxico es volver atrás; en la ley es un retorno a lo que fue, o la deshacer un acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} Puede ser obligatorio, como un retorno al Corán y la Sunna cuando las personas disputan; recomendado, como la cancelación mutua de una venta; permitido en contratos revocables; prohibido, como recuperar una caridad; o desaconsejado, como recuperar un regalo en la visión Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8653} Un juez o muftí puede cambiar su decisión cuando su ijtihad cambia; Algunos malikíes discreparon, pero la mayoría sostuvo que el juicio anterior no es anulado por un ijtihad posterior. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8658} Los contratos revocables, como el préstamo de uso, el legado, la sociedad, la agencia y el depósito, pueden ser revocados; los contratos vinculantes solo pueden ser revocados por mutuo consentimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} Un retorno se pierde por remisión, por la muerte de una parte o por la renuncia a un derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8671} En el testimonio, los testigos que se retractan después del juicio pagan el dinero y no se ejecuta la pena; en la confesión, una retractación elimina la pena hadd por mayoría. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675}"
  fr: "Le terme « ruju' » signifie « retour en arrière » dans le lexique; en droit, il désigne un retour à ce qui était, ou l'annulation d'un acte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} Il peut être obligatoire, comme un retour au Coran et à la Sunna en cas de désaccord; recommandé, comme l'annulation mutuelle d'une vente; autorisé dans les contrats révocables; interdit, comme le fait de reprendre une aumône; ou déconseillé, comme le fait de reprendre un don selon l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8653} Un juge ou un mufti peut modifier sa décision lorsque son ijtihad évolue. Quelques malikites étaient en désaccord, mais la plupart estimaient que le jugement antérieur n'était pas annulé par un ijtihad ultérieur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8658} Les contrats révocables, tels que le prêt d'usage, le legs, le partenariat, le mandat et le dépôt, peuvent être révoqués; les contrats exécutoires ne peuvent être révoqués que par consentement mutuel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} Un retour est perdu par remise, par décès d'une partie ou par renonciation à un droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8671} En matière de témoignage, les témoins qui se rétractent après jugement paient la somme due et la peine n'est pas exécutée; en matière d'aveu, une rétractation annule la peine de hadd à la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675}"
  tr: "Dilde 're' 'tedbir' ve 'tekrar' anlamına gelir ve 'reddetme', iptal ve iptal ifadelerinin ötesine geçer. Hukukta, önceki duruma geri dönmek veya davanın iptali anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8652} Anlaşmazlık durumunda Kur'an ve Sünnet'e atıfta bulunmak gibi zorunlu olabilir, yardım gibi önerilebilir, sözleşmelerde izin verilir, sadaka iadesi gibi yasak ve Hanefilere göre hediye iadesi gibi sevilmez olabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8653} Bir müjtahid, ijtihadı değişirse hükmünü veya fetvasını geri çekebilir ve bazı Maliki mezhebleri bu konuda farklı görüşe sahiptir. Çoğunluk, ilk kararın ikinci ectihad tarafından bozulmadığını savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8658} Geçerli sözleşmeler, örneğin krediler, vasiyetler, ortaklıklar, vekaletname ve mevduatlar iade edilir ve yalnızca karşılıklı anlaşmayla, örneğin fesih gibi geçerli sözleşmeler iptal edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8670} ve iptal, işten çıkarma, bir müteahhitin ölümü ve hediye edilen kişinin değişmesi durumunda başvuru muaf tutulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8671} Tanıklar, mülk hakkında karar verdikten sonra geri çekebilirler ve hudud veya qisas yerine getirilmez. İtirafta, hudud çoğunluk önünde geri çekilerek feragat edilir ve Al-Hasan ile Abu Thawr'a göre kurulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8675}"
  id: "Dalam bahasa, 're' merujuk pada 'perintah' dan 'pengulangan,' dan itu melampaui 'bantahan', pembatalan, dan pembatalan. Dalam hukum, itu berarti kembali ke apa yang sebelumnya atau membatalkan tindakan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8652} Ini bisa menjadi kewajiban seperti merujuk pada Al-Qur'an dan Sunnah dalam kasus perselisihan, direkomendasikan sebagai keringanan, diperbolehkan dalam kontrak yang diperbolehkan, dilarang seperti membalas sedekah, dan tidak suka seperti mengembalikan hadiah menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8653} Seorang mujtahid dapat menarik kembali putusan atau fatwa-nya jika ijtihad-nya berubah, dan beberapa mazhab Maliki berbeda pendapat tentang hal itu. Mayoritas berpendapat bahwa putusan pertama tidak dibatalkan oleh ijtihad kedua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8656} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8658} Kontrak yang sah seperti pinjaman, wasiat, kemitraan, agen pengacara, dan deposit dikembalikan, dan hanya kontrak yang sah yang dicabut berdasarkan kesepakatan bersama, seperti pembatalan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8670} dan hak guna hukum dibatalkan jika pembatalan, pemecatan, kematian salah satu kontraktor, dan perubahan orang yang berbakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8671} Dalam kesaksian, saksi dapat menarik kembali setelah memutuskan properti, dan hudud atau qisas tidak dipenuhi. Dalam pengakuan, hudud dibebaskan dengan pencabutan di hadapan mayoritas dan ditetapkan menurut Al-Hasan dan Abu Thawr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675}"
