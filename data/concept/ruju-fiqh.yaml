id: concept/ruju-fiqh
class: concept
kind: legal
label:
  ar: "الرجوع"
  en: "Ruju' (return or retraction): in judgment and fatwa, in contracts, in testimony and confession, in apostasy and in the rules of travel"
  ur: "رجوع"
summary:
  ar: "الرجوع في اللغة الانصراف والعود، ويتعدى إلى الرد والفسخ والنقض، وهو في الفقه عود إلى ما كان عليه أو نقض التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} ويكون واجبا كالرجوع إلى الكتاب والسنة عند التنازع، ومستحبا كالإقالة، ومباحا في العقود الجائزة، وحراما كالرجوع في الصدقة، ومكروها كالرجوع في الهبة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8653} ويجوز للمجتهد أن يرجع عن قضائه أو فتواه إذا تغير اجتهاده، وخالف فيه بعض المالكية، والجمهور على أن القضاء الأول لا ينقض بالاجتهاد الثاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8658} وترجع العقود الجائزة كالعارية والوصية والشركة والوكالة والوديعة، ولا يرجع في العقود اللازمة إلا بالتراضي كالإقالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} ويسقط الرجوع بالإسقاط والإبراء وبموت أحد المتعاقدين وبتغير الموهوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8671} وفي الشهادة يضمن الشهود بالرجوع بعد الحكم بالمال، ولا يُستوفى الحد أو القصاص، وفي الإقرار يسقط الحد بالرجوع عند الجمهور، ويقام عند الحسن وأبي ثور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675}"
  en: "Ruju' in the lexicon is turning back; in the law it is a return to what was, or the undoing of an act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} It may be obligatory, as a return to the Qur'an and the Sunna when people dispute; recommended, as the mutual cancellation of a sale; permitted in revocable contracts; forbidden, as taking back a charity; or disliked, as taking back a gift in the Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8653} A judge or mufti may change his ruling when his ijtihad changes; a few Malikis disagreed, but most held that the earlier judgment is not annulled by a later ijtihad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8656} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8658} Revocable contracts, such as loan of use, bequest, partnership, agency and deposit, may be revoked; binding contracts may be revoked only by mutual consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8659} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} A return is lost by remission, by the death of a party, or by the waiver of a right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8670} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8671} In testimony, witnesses who retract after judgment pay the money, and the penalty is not carried out; in confession, a retraction removes the hadd penalty by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675}"
  ur: "رجوع لغت میں لوٹنا ہے، اور فقہ میں کسی تصرف سے پیچھے ہٹنا یا اسے ختم کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8652} گواہی سے رجوع کی صورت میں فیصلے کے بعد گواہ مال کے ضامن ہوتے ہیں، جبکہ اقرار سے رجوع پر جمہور کے نزدیک حد ساقط ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8674}"
