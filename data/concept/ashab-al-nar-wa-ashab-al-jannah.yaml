      ar: "الأقوال الأخرى في مصير أهل النار لم تُضف بعد"
      en: "Other views on the fate of the people of the Fire are not yet added"
    summary:
      ar: "لم تُعرض هنا أقوال المذاهب الأخرى في مصير أهل النار، ولم تُراجع."
      en: "Other traditions' views on the fate of the people of the Fire are not set out here and are not checked."
