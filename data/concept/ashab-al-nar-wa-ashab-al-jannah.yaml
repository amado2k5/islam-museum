id: concept/ashab-al-nar-wa-ashab-al-jannah
class: concept
kind: doctrine
label:
  ar: "أصحاب النار وأصحاب الجنة"
  en: "Companions of the Fire and of Paradise"
  ur: "اصحابِ دوزخ اور اصحابِ جنت"
summary:
  ar: "يرى الشعراوي أن الصحبة تعني الألفة والحب والملازمة، فالنار تلازم الكافرين وتفرح بهم، والجنة تلازم المؤمنين الصالحين وتسعد بهم، وأن الخلود في النار عذاب دائم لا يخف {cite:tafsir-sharawi-khawatir-scan p.283} {cite:tafsir-sharawi-khawatir-scan p.284}."
  en: "Sha'rawi holds that companionship means affection and constant attachment: the Fire clings to those who disbelieve and rejoices in them, and Paradise clings to the righteous believers and is glad of them, and that eternal dwelling in the Fire is an unending punishment that is not lightened {cite:tafsir-sharawi-khawatir-scan p.283} {cite:tafsir-sharawi-khawatir-scan p.284}."
  ur: "شعراوی کے نزدیک صحبت محبت، انسیت اور لازمی تعلق کا نام ہے۔ دوزخ کافروں سے چمٹی رہتی ہے اور ان سے خوش ہوتی ہے، جنت نیک مومنین سے وابستہ رہتی ہے اور ان سے خوش ہوتی ہے، اور دوزخ میں ہمیشگی ایسا عذاب ہے جو ہلکا نہیں ہوتا {cite:tafsir-sharawi-khawatir-scan p.283} {cite:tafsir-sharawi-khawatir-scan p.284}۔"
wings: [ideas]
themes: [afterlife-and-eschatology]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل يتصل العذاب الأبدي بالكافرين بصفة لا تتغير، وكيف تفهم الصحبة بين النار والكافر؟"
  en: "Is the eternal punishment of disbelievers unchanging, and how is the companionship between the Fire and the disbeliever to be understood?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "النار تصاحب الكافرين بخلود لا يخفف عنهم، والجنة تصاحب المؤمنين"
      en: "The Fire is joined to disbelievers in an everlasting dwelling that is not lightened for them; Paradise is joined to believers"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يصف الشعراوي الصحبة بالحب والملازمة، ويقرر أن العذاب في النار دائم لا يخف، ويستدل بالآية التي تنفي التخفيف عن الذين اشتروا الحياة الدنيا بالآخرة {cite:tafsir-sharawi-khawatir-scan p.283} {cite:tafsir-sharawi-khawatir-scan p.284}."
      en: "Sha'rawi describes companionship as love and constancy, holds that the punishment in the Fire is everlasting and not lightened, and cites the verse that denies any lightening for those who traded the worldly life for the Hereafter {cite:tafsir-sharawi-khawatir-scan p.283} {cite:tafsir-sharawi-khawatir-scan p.284}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "مسألة خلود أصحاب الكبائر لم تُعرض هنا"
      en: "The question of the duration of punishment for grave sinners is not set out here"
    summary:
      ar: "هذه المسألة خلافية بين المدارس، ولم تُعرض أقوال علماء الكلام والفقه فيها في هذه الصفحات، وتحتاج إلى مراجع محددة."
      en: "This question is disputed among schools; the positions of theologians and jurists on it are not set out in these pages and need named sources."
    sources: []
  - tradition: other
    id: other
