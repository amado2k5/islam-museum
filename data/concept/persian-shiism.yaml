label: { ar: "التشيع في فارس", en: "Shi'ism in Persia", es: "El chiismo en Persia", fr: "Le chiisme en Perse", ur: "فارس میں شیعہ مذہب" }
summary:
  ar: "يعرض شكيب أرسلان في الفصل المعنون «اسلام الفرس ومبدأ التشيع» رأيه في نشأة التشيع في فارس. يقول إن التشيع لم يكن قديماً في العجم كما لم يكن قديماً في العرب، وإن الحكم الصفوي في القرن العاشر الهجري كان من أسباب انتشاره، ويذكر ما نقله عن المحبي عن ارتباط النسب الصفوي بالإمام علي. ويعرض فرق الشيعة في فارس كما يصفها: الأخبارية والمجتهدية والشيخية، ويعدّ ذلك وصفاً من مشاهدته. ويرى أن الشيعة العرب في اليمن والعراق والشام يشاركون الفرس في التعلق بآل البيت، ولذلك لا يصح في نظره ردّ التشيع إلى الدافع السياسي وحده. يعرض هذا كله بوصفه رأي المؤلف، لا حكماً محايداً."
  en: "In his chapter on Persian Islam and the origin of Shi'ism, Arslan argues that Shi'ism was not old among Persians, pointing to the Safavid period (10th century AH) as a decisive moment. He describes the Akhbari, Mujtahid and Shaykhi currents as he observed them in Persia, and argues that Arab Shi'a in Yemen, Iraq and Syria show that devotion to the family of the Prophet is not only a Persian political matter. This is his account, not a neutral verdict."
  es: "En su capítulo sobre el islam persa y el origen del chiismo, Arslan sostiene que el chiismo no era antiguo entre los persas, señalando el período safávida (siglo X d. H.) como un momento decisivo. Describe las corrientes akhbari, mujtahid y shaykhi tal como las observó en Persia, y argumenta que los chiíes árabes en Yemen, Irak y Siria demuestran que la devoción a la familia del Profeta no es solo una cuestión política persa. Esta es su interpretación, no un veredicto neutral."
  fr: "Dans son chapitre consacré à l'islam persan et à l'origine du chiisme, Arslan soutient que le chiisme n'était pas ancien chez les Perses, et désigne la période safavide (Xᵉ siècle de l'Hégire) comme un moment décisif. Il décrit les courants akhbarite, mujtahid et cheikhite tels qu'il les a observés en Perse, et affirme que la présence de chiites arabes au Yémen, en Irak et en Syrie démontre que la dévotion à la famille du Prophète n'est pas uniquement une question politique perse. Il s'agit là de son analyse, et non d'un jugement neutre."
  ur: "فارسی اسلام اور شیعیت کی ابتدا پر اپنے باب میں، ارسلان نے ایک فیصلہ کن لمحہ کے طور پر صفوی دور ⁦(10ویں صدی ہجری)⁩ کی طرف اشارہ کرتے ہوئے دلیل دی ہے کہ فارسیوں میں شیعہ ازم پرانا نہیں تھا۔ وہ اخباری، مجتہد اور شیخی دھارے کو بیان کرتا ہے جیسا کہ اس نے فارس میں مشاہدہ کیا، اور دلیل دی کہ یمن، عراق اور شام میں عرب شیعہ اس بات کو ظاہر کرتے ہیں کہ پیغمبر کے خاندان سے عقیدت صرف فارسی سیاسی معاملہ نہیں ہے۔ یہ اس کا حساب ہے، غیر جانبدارانہ فیصلہ نہیں۔"
