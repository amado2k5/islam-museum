id: concept/persian-shiism
class: concept
kind: term
label: { ar: "التشيع في فارس", en: "Shi'ism in Persia" }
summary:
  ar: "يعرض شكيب أرسلان في الفصل المعنون «اسلام الفرس ومبدأ التشيع» رأيه في نشأة التشيع في فارس. يقول إن التشيع لم يكن قديماً في العجم كما لم يكن قديماً في العرب، وإن الحكم الصفوي في القرن العاشر الهجري كان من أسباب انتشاره، ويذكر ما نقله عن المحبي عن ارتباط النسب الصفوي بالإمام علي. ويعرض فرق الشيعة في فارس كما يصفها: الأخبارية والمجتهدية والشيخية، ويعدّ ذلك وصفاً من مشاهدته. ويرى أن الشيعة العرب في اليمن والعراق والشام يشاركون الفرس في التعلق بآل البيت، ولذلك لا يصح في نظره ردّ التشيع إلى الدافع السياسي وحده. يعرض هذا كله بوصفه رأي المؤلف، لا حكماً محايداً."
  en: "In his chapter on Persian Islam and the origin of Shi'ism, Arslan argues that Shi'ism was not old among Persians, pointing to the Safavid period (10th century AH) as a decisive moment. He describes the Akhbari, Mujtahid and Shaykhi currents as he observed them in Persia, and argues that Arab Shi'a in Yemen, Iraq and Syria show that devotion to the family of the Prophet is not only a Persian political matter. This is his account, not a neutral verdict."
