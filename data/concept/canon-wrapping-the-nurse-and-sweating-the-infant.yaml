label: { ar: "تدثير المرضعة وتعريق الطفل عند ابن سينا", en: "Wrapping the nurse and sweating the infant in the Canon", ur: "قانون میں دایہ کو ڈھانپنا اور بچے کو پسینہ دلانا" }
summary:
  ar: "يذكر ابن سينا في بيان علاج أحد الأمراض أن الأولى أن تدثر المرضعة ويسقى الطفل ماء الرمان مع سكنجبين أو عصارة الخيار مع كافور وسكر، ثم يعرق بعصارة القصب الرطب {cite:canon-ibn-sina-print-v1 p.216}. واسم المرض مشوه في النص الممسوح فلا نسميه."
  en: "In treating one disease Ibn Sina says the better course is to wrap the nurse and give the child pomegranate water with sakanjabin or cucumber juice with camphor and sugar, then to sweat it with the juice of fresh cane {cite:canon-ibn-sina-print-v1 p.216}. The disease's name is garbled in the scanned text and so is not given here."
