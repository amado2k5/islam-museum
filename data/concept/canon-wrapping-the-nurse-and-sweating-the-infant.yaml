id: concept/canon-wrapping-the-nurse-and-sweating-the-infant
class: concept
kind: scientific
label: { ar: "تدثير المرضعة وتعريق الطفل عند ابن سينا", en: "Wrapping the nurse and sweating the infant in the Canon", ur: "قانون میں دایہ کو ڈھانپنا اور بچے کو پسینہ دلانا", es: "Envolviendo a la enfermera y haciendo sudar al bebé en el cañón", fr: "Enveloppant l'infirmière et faisant transpirer le nourrisson dans le Canon", tr: "İbn Sina'ya göre emzirmenin sarılması ve bebeğin uyuşturulması", id: "Membalut menyusui dan membius bayi menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا في بيان علاج أحد الأمراض أن الأولى أن تدثر المرضعة ويسقى الطفل ماء الرمان مع سكنجبين أو عصارة الخيار مع كافور وسكر، ثم يعرق بعصارة القصب الرطب {cite:canon-ibn-sina-print-v1 p.216}. واسم المرض مشوه في النص الممسوح فلا نسميه."
  en: "In treating one disease Ibn Sina says the better course is to wrap the nurse and give the child pomegranate water with sakanjabin or cucumber juice with camphor and sugar, then to sweat it with the juice of fresh cane {cite:canon-ibn-sina-print-v1 p.216}. The disease's name is garbled in the scanned text and so is not given here."
  es: "Para tratar una enfermedad, Ibn Sina afirma que lo mejor es envolver a la nodriza y darle al niño agua de granada con sakanjabin o jugo de pepino con alcanfor y azúcar, y luego sudar con jugo de caña fresca {cite:canon-ibn-sina-print-v1 p.216}. El nombre de la enfermedad aparece ilegible en el texto escaneado, por lo que no se incluye aquí."
  fr: "Pour soigner une maladie, Ibn Sina recommande d'envelopper la nourrice et de donner à l'enfant de l'eau de grenade avec du sakanjabin ou du jus de concombre avec du camphre et du sucre, puis de le faire suer avec du jus de canne fraîche {cite:canon-ibn-sina-print-v1 p.216}. Le nom de la maladie étant illisible dans le texte numérisé, il n'est pas reproduit ici."
  ur: "ایک بیماری کے علاج میں ابن سینا کا کہنا ہے کہ بہتر طریقہ یہ ہے کہ نرس کو لپیٹ کر بچے کو انار کا پانی ساکنجبین یا ککڑی کے رس کے ساتھ کافور اور چینی کے ساتھ پلایا جائے، پھر تازہ گنے کے رس سے پسینہ پلایا جائے۔ اسکین شدہ متن میں بیماری کا نام غلط ہے اور اس لیے یہاں نہیں دیا گیا ہے۔"
  tr: "İbn Sina, hastalıklardan birinin tedavi açıklamasında, emziren annenin kendisi giydirilmesi ve çocuğun nar suyu ile skinjibin veya salatalık suyu ile kafur ve şeker içmesi, ardından nemli kamış suyu ile terlemesi gerektiğini belirtir {cite:canon-ibn-sina-print-v1 s.216}. Taranan metinde hastalığın adı çarpıtılmıştır, bu yüzden adını vermiyoruz."
  id: "Ibn Sina menyebutkan dalam penjelasan pengobatan salah satu penyakit bahwa ibu menyusui harus berpakaian sendiri dan anak minum jus delima dengan skinjibin atau jus mentimun dengan kamper dan gula, lalu berkeringat dengan jus tebu basah {cite:canon-ibn-sina-print-v1 hlm.216}. Nama penyakit ini terdistorsi dalam teks hasil scan, jadi kami tidak menyebutkannya."
