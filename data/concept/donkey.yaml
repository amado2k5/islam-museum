summary:
  ar: "أحقر الأصوات لصوت الحمير، ومثل من حُمّل التورية ثم لم يحملها كمثل الحمار يحمل أسفاراً، والخيل والبغال والحمير لتركبوها، وحمار عزير رآه صاحبه بعد أن أماته الله مئة عام: أنظر كيف ننشر العظام ثم نكسوها لحماً."
  en: "The harshest of voices is the braying of donkeys; one laden with the Torah who carries it not is like a donkey carrying scrolls; horses, mules and donkeys are for riding. And the donkey of Uzair, whose owner saw its bones raised and clothed with flesh after God gave it death a hundred years."
  ur: "بدترین آواز گدھے کی رینک ہے؛ توریت اٹھا کر نہ اٹھانے والا اس گدھے کی مانند ہے جو کتابیں اٹھائے؛ گھوڑے خچر اور گدھے سواری کے لیے ہیں۔ اور عزیر کا گدھا جس کی ہڈیوں کو سو برس مردہ رکھنے کے بعد اللہ نے جوڑ کر گوشت چڑھایا۔"
