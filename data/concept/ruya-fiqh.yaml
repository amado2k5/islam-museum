id: concept/ruya-fiqh
class: concept
kind: legal
label:
  ar: "الرؤيا (في الفقه)"
  en: "The dream (ru'ya): its standing, its interpretation and the rules of telling it"
  ur: "خواب (رؤیا، فقہی احکام اور تعبیر)"
summary:
  ar: "الرؤيا ما يراه الإنسان في منامه، وتتميز عن الإلهام والحلم والخاطر والوحي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} الرؤيا الصالحة جزء من أجزاء النبوة، وهي لأهل الصلاح أكثر صدقا، ومن عدا الصالحين يقع في رؤاهم الصدق والأضغاث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8533} ورؤية النبي في المنام حق، واختلف في الحكم بأقواله وأفعاله فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8535} والتعبير تفسير الرؤيا ونقلها من ظاهرها إلى باطنها، وله أصول مأخوذة من القرآن والسنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8537} ويستحب ألا تقص الرؤيا إلا على ناصح أو عالم، وإذا رأى ما يحب حمد الله وحدث بها، وإذا رأى ما يكره استعاذ من شرها ولا يذكرها لأحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539}"
  en: "A dream (ru'ya) is what a person sees in sleep; it is distinct from inspiration (ilham), from a bad dream (hulm), from a passing thought (khatir) and from revelation (wahy). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} A sound dream is one of the parts of prophethood; a righteous person's dreams are more often true, while others' dreams mix truth with confusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8533} Seeing the Prophet in a dream is true; whether his words or acts seen there bind the dreamer is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8535} Interpretation (ta'bir) carries the dream from its outward form to its inward meaning, with rules drawn from the Qur'an and the Sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8537} A dream should be told only to a sympathetic or learned person; a liked dream is praised to God and told to others, and a disliked one is answered by seeking refuge from its harm and not telling it to anyone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539}"
  ur: "رؤیا وہ ہے جو آدمی نیند میں دیکھتا ہے، اور اسے الہام، حلم، خاطر اور وحی سے ممتاز کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} اچھا خواب نبوت کے اجزا میں سے ہے، اور تعبیر اس کے ظاہر سے باطن کی طرف لے جانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536}"
