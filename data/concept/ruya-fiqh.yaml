label:
  ar: "الرؤيا ⁦(في الفقه)⁩"
  en: "The dream (ru'ya): its standing, its interpretation and the rules of telling it"
  ur: "خواب ⁦(رؤیا، فقہی احکام اور تعبیر)⁩"
summary:
  ar: "الرؤيا ما يراه الإنسان في منامه، وتتميز عن الإلهام والحلم والخاطر والوحي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} الرؤيا الصالحة جزء من أجزاء النبوة، وهي لأهل الصلاح أكثر صدقا، ومن عدا الصالحين يقع في رؤاهم الصدق والأضغاث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8533} ورؤية النبي في المنام حق، واختلف في الحكم بأقواله وأفعاله فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8535} والتعبير تفسير الرؤيا ونقلها من ظاهرها إلى باطنها، وله أصول مأخوذة من القرآن والسنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8537} ويستحب ألا تقص الرؤيا إلا على ناصح أو عالم، وإذا رأى ما يحب حمد الله وحدث بها، وإذا رأى ما يكره استعاذ من شرها ولا يذكرها لأحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} ويجمع جامع الترمذي في أبواب الرؤيا تفاصيل هذا الباب من الحديث: أن رؤيا المؤمن لا تكاد تكذب إذا اقترب الزمان وأن أصدقهم رؤيا أصدقهم حديثا وأن رؤيا المسلم جزء من ستة وأربعين جزءا من النبوة {cite:jami-al-tirmidhi p.521}، وأن النبوة قد انقطعت فبقيت المبشرات وهي رؤيا المسلم {cite:jami-al-tirmidhi p.522}، وأن الرؤيا ثلاثة: بشرى من الله، وتخزيم من الشيطان، وما يحدث به الرجل نفسه، وأن من رأى ما يكره فليقم وليتفُل ولا يحدث به الناس {cite:jami-al-tirmidhi p.522}، وأن الرؤيا من الله والحلم من الشيطان، وأن من رآني في المنام فقد رآني فإن الشيطان لا يتمثل بي {cite:jami-al-tirmidhi p.523}، وأن الرؤيا على رجل طائر ما لم يحدث بها فإذا حدث بها وقعت {cite:jami-al-tirmidhi p.523}، وأن الرؤيا لا تقص إلا على عالم أو ناصح {cite:jami-al-tirmidhi p.523}، وأن من كذب في حلمه أو تحلم كاذبا كلف يوم القيامة ما لا يطيقه {cite:jami-al-tirmidhi p.524}، ويورد في باب رؤيا النبي رؤياه باللبن الذي فسره بالعلم ورؤيا القمص التي فسرها بالدين {cite:jami-al-tirmidhi p.524}؛ ويجمع مشكاة المصابيح كتاب الرؤيا: أن الرؤيا الصالحة جزء من ستة وأربعين جزءا من النبوة وأن من رآني في المنام فقد رآني فإن الشيطان لا يتمثل في صورتي وأن من رآني فقد رأى الحق {cite:mishkat-al-masabih p.1297}، وأن الرؤيا الصالحة من الله والحلم من الشيطان فإذا رأى أحدكم ما يحب فلا يحدث به إلا من يحب وإذا رأى ما يكره فليتعوذ بالله من شرها ومن شر الشيطان وليمفُل ثلاثا ولا يحدث بها أحدا فإنها لن تضره {cite:mishkat-al-masabih p.1298}، وأن ابن سيرين جعل الرؤيا ثلاثا: حديث النفس وتخويف الشيطان وبشرى من الله {cite:mishkat-al-masabih p.1298}، ويورد رؤيا جبريل للنبي في الفصل الأول: رجل يكذب فيحدث بالحديث فتُحمل عنه حتى تبلغ الآفاق ورجل علمه الله القرآن فنام عنه بالليل ولم يعمل به في النهار وثلاثة زناة في ثقب وآكل ربا في نهر دم والشيخ إبراهيم عند أصل الشجرة والدار الأولى دار عامة المؤمنين والثانية دار الشهداء {cite:mishkat-al-masabih p.1300} و{cite:mishkat-al-masabih p.1301}، وأن عائشة روت أن خديجة سألت النبي عن ورقة فقال إني أريته في المنام وعليه ثياب بيض {cite:mishkat-al-masabih p.1302}"
  en: "A dream (ru'ya) is what a person sees in sleep; it is distinct from inspiration (ilham), from a bad dream (hulm), from a passing thought (khatir) and from revelation (wahy). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} A sound dream is one of the parts of prophethood; a righteous person's dreams are more often true, while others' dreams mix truth with confusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8533} Seeing the Prophet in a dream is true; whether his words or acts seen there bind the dreamer is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8535} Interpretation (ta'bir) carries the dream from its outward form to its inward meaning, with rules drawn from the Qur'an and the Sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8537} A dream should be told only to a sympathetic or learned person; a liked dream is praised to God and told to others, and a disliked one is answered by seeking refuge from its harm and not telling it to anyone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} Jami' al-Tirmidhi's Book of Dreams fills in the details: that the believer's dream scarcely lies as the end draws near, that the truest dreamer is the truest in speech, and that a Muslim's dream is one of forty-six parts of prophethood {cite:jami-al-tirmidhi p.521}; that prophethood has ceased and the glad tidings remain — the believer's dream {cite:jami-al-tirmidhi p.522}; that dreams are three — glad tidings from God, agitation from Satan, and what a man tells himself — and that whoever sees what he dislikes should rise, spit and tell no one {cite:jami-al-tirmidhi p.522}; that the dream is from God and the nightmare from Satan, and that whoever sees me in sleep has seen me, for Satan does not take my form {cite:jami-al-tirmidhi p.523}; that the dream rests on a bird's foot until it is told, and once told it comes to pass {cite:jami-al-tirmidhi p.523}; that a dream should be told only to a scholar or a sincere friend {cite:jami-al-tirmidhi p.523}; and that whoever lies about his dream, or dreams falsely, is tasked on the Day of Resurrection with what he cannot do {cite:jami-al-tirmidhi p.524}; the book also records the Prophet's own dreams — the milk he interpreted as knowledge and the garments he interpreted as religion {cite:jami-al-tirmidhi p.524}; and Mishkat al-Masabih's Book of Dreams gathers: that the sound dream is one of forty-six parts of prophethood, that whoever sees me in sleep has seen me for Satan does not take my form, and that whoever sees me has seen the truth {cite:mishkat-al-masabih p.1297}; that the sound dream is from God and the nightmare from Satan — whoever sees what he likes should tell only one he loves, and whoever sees what he dislikes should seek refuge from its harm and Satan's, spit thrice and tell no one, for it will not harm him {cite:mishkat-al-masabih p.1298}; that Ibn Sirin made dreams three — a person's own talk, Satan's agitation and glad tidings from God {cite:mishkat-al-masabih p.1298}; and it records the Prophet's dream of Jibril: a liar whose tale is carried to the horizons, a man taught the Qur'an who slept about it at night and did not act on it by day, three adulterers in a pit, a usurer in a river of blood, Ibrahim at the foot of the tree, the first house the general believers' and the second the martyrs' {cite:mishkat-al-masabih p.1300} and {cite:mishkat-al-masabih p.1301}; and that A'isha reported Khadija asking the Prophet about Waraqa, to whom he said 'I saw him in a dream wearing white garments' {cite:mishkat-al-masabih p.1302}"
  ur: "رؤیا وہ ہے جو آدمی نیند میں دیکھتا ہے، اور اسے الہام، حلم، خاطر اور وحی سے ممتاز کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} اچھا خواب نبوت کے اجزا میں سے ہے، اور تعبیر اس کے ظاہر سے باطن کی طرف لے جانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536}"
