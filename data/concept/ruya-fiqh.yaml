label:
  ar: "الرؤيا ⁦(في الفقه)⁩"
  en: "The dream (ru'ya): its standing, its interpretation and the rules of telling it"
  ur: "خواب ⁦(رؤیا، فقہی احکام اور تعبیر)⁩"
  es: "El sueño (ru'ya): su estatus, su interpretación y las reglas para contarlo."
  fr: "Le rêve (ru'ya): sa place, son interprétation et les règles pour le raconter"
summary:
  ar: "الرؤيا ما يراه الإنسان في منامه، وتتميز عن الإلهام والحلم والخاطر والوحي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} الرؤيا الصالحة جزء من أجزاء النبوة، وهي لأهل الصلاح أكثر صدقا، ومن عدا الصالحين يقع في رؤاهم الصدق والأضغاث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8533} ورؤية النبي في المنام حق، واختلف في الحكم بأقواله وأفعاله فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8535} والتعبير تفسير الرؤيا ونقلها من ظاهرها إلى باطنها، وله أصول مأخوذة من القرآن والسنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8537} ويستحب ألا تقص الرؤيا إلا على ناصح أو عالم، وإذا رأى ما يحب حمد الله وحدث بها، وإذا رأى ما يكره استعاذ من شرها ولا يذكرها لأحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} ويجمع جامع الترمذي في أبواب الرؤيا تفاصيل هذا الباب من الحديث: أن رؤيا المؤمن لا تكاد تكذب إذا اقترب الزمان وأن أصدقهم رؤيا أصدقهم حديثا وأن رؤيا المسلم جزء من ستة وأربعين جزءا من النبوة {cite:jami-al-tirmidhi p.521}، وأن النبوة قد انقطعت فبقيت المبشرات وهي رؤيا المسلم {cite:jami-al-tirmidhi p.522}، وأن الرؤيا ثلاثة: بشرى من الله، وتخزيم من الشيطان، وما يحدث به الرجل نفسه، وأن من رأى ما يكره فليقم وليتفُل ولا يحدث به الناس {cite:jami-al-tirmidhi p.522}، وأن الرؤيا من الله والحلم من الشيطان، وأن من رآني في المنام فقد رآني فإن الشيطان لا يتمثل بي {cite:jami-al-tirmidhi p.523}، وأن الرؤيا على رجل طائر ما لم يحدث بها فإذا حدث بها وقعت {cite:jami-al-tirmidhi p.523}، وأن الرؤيا لا تقص إلا على عالم أو ناصح {cite:jami-al-tirmidhi p.523}، وأن من كذب في حلمه أو تحلم كاذبا كلف يوم القيامة ما لا يطيقه {cite:jami-al-tirmidhi p.524}، ويورد في باب رؤيا النبي رؤياه باللبن الذي فسره بالعلم ورؤيا القمص التي فسرها بالدين {cite:jami-al-tirmidhi p.524}؛ ويجمع مشكاة المصابيح كتاب الرؤيا: أن الرؤيا الصالحة جزء من ستة وأربعين جزءا من النبوة وأن من رآني في المنام فقد رآني فإن الشيطان لا يتمثل في صورتي وأن من رآني فقد رأى الحق {cite:mishkat-al-masabih p.1297}، وأن الرؤيا الصالحة من الله والحلم من الشيطان فإذا رأى أحدكم ما يحب فلا يحدث به إلا من يحب وإذا رأى ما يكره فليتعوذ بالله من شرها ومن شر الشيطان وليمفُل ثلاثا ولا يحدث بها أحدا فإنها لن تضره {cite:mishkat-al-masabih p.1298}، وأن ابن سيرين جعل الرؤيا ثلاثا: حديث النفس وتخويف الشيطان وبشرى من الله {cite:mishkat-al-masabih p.1298}، ويورد رؤيا جبريل للنبي في الفصل الأول: رجل يكذب فيحدث بالحديث فتُحمل عنه حتى تبلغ الآفاق ورجل علمه الله القرآن فنام عنه بالليل ولم يعمل به في النهار وثلاثة زناة في ثقب وآكل ربا في نهر دم والشيخ إبراهيم عند أصل الشجرة والدار الأولى دار عامة المؤمنين والثانية دار الشهداء {cite:mishkat-al-masabih p.1300} و{cite:mishkat-al-masabih p.1301}، وأن عائشة روت أن خديجة سألت النبي عن ورقة فقال إني أريته في المنام وعليه ثياب بيض {cite:mishkat-al-masabih p.1302}"
  en: "A dream (ru'ya) is what a person sees in sleep; it is distinct from inspiration (ilham), from a bad dream (hulm), from a passing thought (khatir) and from revelation (wahy). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} A sound dream is one of the parts of prophethood; a righteous person's dreams are more often true, while others' dreams mix truth with confusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8533} Seeing the Prophet in a dream is true; whether his words or acts seen there bind the dreamer is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8535} Interpretation (ta'bir) carries the dream from its outward form to its inward meaning, with rules drawn from the Qur'an and the Sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8537} A dream should be told only to a sympathetic or learned person; a liked dream is praised to God and told to others, and a disliked one is answered by seeking refuge from its harm and not telling it to anyone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} Jami' al-Tirmidhi's Book of Dreams fills in the details: that the believer's dream scarcely lies as the end draws near, that the truest dreamer is the truest in speech, and that a Muslim's dream is one of forty-six parts of prophethood {cite:jami-al-tirmidhi p.521}; that prophethood has ceased and the glad tidings remain — the believer's dream {cite:jami-al-tirmidhi p.522}; that dreams are three — glad tidings from God, agitation from Satan, and what a man tells himself — and that whoever sees what he dislikes should rise, spit and tell no one {cite:jami-al-tirmidhi p.522}; that the dream is from God and the nightmare from Satan, and that whoever sees me in sleep has seen me, for Satan does not take my form {cite:jami-al-tirmidhi p.523}; that the dream rests on a bird's foot until it is told, and once told it comes to pass {cite:jami-al-tirmidhi p.523}; that a dream should be told only to a scholar or a sincere friend {cite:jami-al-tirmidhi p.523}; and that whoever lies about his dream, or dreams falsely, is tasked on the Day of Resurrection with what he cannot do {cite:jami-al-tirmidhi p.524}; the book also records the Prophet's own dreams — the milk he interpreted as knowledge and the garments he interpreted as religion {cite:jami-al-tirmidhi p.524}; and Mishkat al-Masabih's Book of Dreams gathers: that the sound dream is one of forty-six parts of prophethood, that whoever sees me in sleep has seen me for Satan does not take my form, and that whoever sees me has seen the truth {cite:mishkat-al-masabih p.1297}; that the sound dream is from God and the nightmare from Satan — whoever sees what he likes should tell only one he loves, and whoever sees what he dislikes should seek refuge from its harm and Satan's, spit thrice and tell no one, for it will not harm him {cite:mishkat-al-masabih p.1298}; that Ibn Sirin made dreams three — a person's own talk, Satan's agitation and glad tidings from God {cite:mishkat-al-masabih p.1298}; and it records the Prophet's dream of Jibril: a liar whose tale is carried to the horizons, a man taught the Qur'an who slept about it at night and did not act on it by day, three adulterers in a pit, a usurer in a river of blood, Ibrahim at the foot of the tree, the first house the general believers' and the second the martyrs' {cite:mishkat-al-masabih p.1300} and {cite:mishkat-al-masabih p.1301}; and that A'isha reported Khadija asking the Prophet about Waraqa, to whom he said 'I saw him in a dream wearing white garments' {cite:mishkat-al-masabih p.1302}"
  ur: "رؤیا وہ ہے جو آدمی نیند میں دیکھتا ہے، اور اسے الہام، حلم، خاطر اور وحی سے ممتاز کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} اچھا خواب نبوت کے اجزا میں سے ہے، اور تعبیر اس کے ظاہر سے باطن کی طرف لے جانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536}"
  es: "Un sueño (ru'ya) es lo que una persona ve mientras duerme; es distinto de la inspiración (ilham), de un mal sueño (hulm), de un pensamiento pasajero (khatir) y de la revelación (wahy). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} Un sueño nítido es una de las partes de la profecía; los sueños de una persona justa suelen ser verdaderos, mientras que los sueños de otros mezclan la verdad con la confusión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8533} Ver al Profeta en un sueño es verdadero; si sus palabras o actos vistos allí obligan al soñador es discutido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8535} La interpretación (ta'bir) lleva el sueño de su forma externa a su significado interno, con reglas extraídas del Corán y la Sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8537} Un sueño debe contarse solo a una persona comprensiva o instruida; un sueño agradable se alaba a Dios y se cuenta a otros, y uno desagradable se responde buscando refugio de su daño y no contándoselo a nadie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} El Libro de los Sueños de Jami' al-Tirmidhi completa los detalles: que el sueño del creyente difícilmente miente a medida que se acerca el fin, que el soñador más sincero es el más sincero en el hablar, y que el sueño de un musulmán es una de las cuarenta y seis partes de la profecía {cite:jami-al-tirmidhi p.521}; que la profecía ha cesado y las buenas nuevas permanecen: el sueño del creyente {cite:jami-al-tirmidhi p.522}; que los sueños son tres: buenas nuevas de Dios, agitación de Satanás y lo que un hombre se dice a sí mismo; y que quien vea lo que le desagrada debe levantarse, escupir y no contárselo a nadie {cite:jami-al-tirmidhi p.522}; que el sueño es de Dios y la pesadilla de Satanás, y que quien me ve en sueños me ha visto, porque Satanás no toma mi forma {cite:jami-al-tirmidhi p.523}; que el sueño reposa en la pata de un pájaro hasta que se cuenta, y una vez contado se cumple {cite:jami-al-tirmidhi p.523}; que un sueño solo debe contarse a un erudito o a un amigo sincero {cite:jami-al-tirmidhi p.523}; y que quien miente acerca de su sueño, o sueña falsamente, se le asigna en el Día de la Resurrección lo que no puede hacer {cite:jami-al-tirmidhi p.524}; El libro también registra los propios sueños del Profeta: la leche la interpretó como conocimiento y las vestiduras como religión {cite:jami-al-tirmidhi p.524}; y el Libro de los Sueños de Mishkat al-Masabih reúne: que el sueño vívido es una de las cuarenta y seis partes de la profecía, que quien me ve en sueños me ha visto porque Satanás no toma mi forma, y que quien me ve ha visto la verdad {cite:mishkat-al-masabih p.1297}; que el sueño vívido es de Dios y la pesadilla de Satanás: quien vea lo que le guste debe contárselo solo a quien ame, y quien vea lo que le disguste debe buscar refugio de su daño y del de Satanás, escupir tres veces y no contárselo a nadie, porque no le hará daño {cite:mishkat-al-masabih p.1298}; que Ibn Sirin hizo tres sueños: la propia conversación de una persona, la agitación de Satanás y buenas nuevas de Dios {cite:mishkat-al-masabih p.1298}; y registra el sueño del Profeta sobre Jibril: un mentiroso cuya historia es llevada hasta los horizontes, un hombre al que se le enseñó el Corán pero que durmió sobre él por la noche y no lo puso en práctica durante el día, tres adúlteros en un pozo, un usurero en un río de sangre, Ibrahim al pie del árbol, la primera casa de los creyentes en general y la segunda la de los mártires {cite:mishkat-al-masabih p.1300} y {cite:mishkat-al-masabih p.1301}; y que Aisha informó que Khadija le preguntó al Profeta acerca de Waraqa, a quien él dijo: \"Lo vi en un sueño vestido con ropas blancas\" {cite:mishkat-al-masabih p.1302}."
  fr: "Un rêve (ru'ya) est ce qu'une personne voit en dormant; il se distingue de l'inspiration (ilham), d'un mauvais rêve (hulm), d'une pensée passagère (khatir) et de la révélation (wahy). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} Un rêve lucide est un aspect de la prophétie; les rêves d'une personne vertueuse sont plus souvent véridiques, tandis que ceux des autres mêlent vérité et confusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8533} Voir le Prophète en rêve est véridique; la question de savoir si ses paroles ou ses actes, vus en rêve, engagent le rêveur est sujette à controverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8535} L'interprétation (ta'bir) permet de comprendre le sens profond du rêve, en s'appuyant sur les règles du Coran et de la Sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8537} Il est conseillé de ne confier un rêve qu'à une personne bienveillante ou érudite; un rêve agréable est loué à Dieu et raconté à autrui, tandis qu'un rêve désagréable appelle à la protection divine et au silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} Le Livre des rêves de Jami' al-Tirmidhi apporte des précisions: le rêve du croyant ment rarement à l'approche de la fin; le rêveur le plus sincère est aussi le plus sincère dans ses paroles; le rêve du musulman est l'une des quarante-six composantes de la prophétie {cite:jami-al-tirmidhi p.521}; la prophétie a pris fin, mais la bonne nouvelle demeure: le rêve du croyant {cite:jami-al-tirmidhi p.522}. que les rêves sont de trois sortes: les bonnes nouvelles de Dieu, l'agitation de Satan et ce que l'homme se dit à lui-même; et que quiconque voit ce qui lui déplaît doit se lever, cracher et n'en parler à personne {cite:jami-al-tirmidhi p.522}; que le rêve vient de Dieu et le cauchemar de Satan, et que quiconque me voit en rêve m'a vu, car Satan ne prend pas mon apparence {cite:jami-al-tirmidhi p.523}; que le rêve repose sur une patte d'oiseau jusqu'à ce qu'il soit raconté, et qu'une fois raconté, il se réalise {cite:jami-al-tirmidhi p.523}; qu'un rêve ne doit être raconté qu'à un savant ou à un ami sincère {cite:jami-al-tirmidhi p.523}; et que quiconque ment sur son rêve, ou fait de faux rêves, sera chargé le Jour de la Résurrection d'une tâche qu'il ne peut accomplir {cite:jami-al-tirmidhi p.524}. Le livre relate également les rêves du Prophète lui-même: le lait qu’il interpréta comme la connaissance et les vêtements comme la religion (Jami’ al-Tirmidhi, p. 524). Le Livre des rêves de Mishkat al-Masabih rassemble les enseignements suivants: le rêve sonore est l’un des quarante-six aspects de la prophétie; quiconque me voit en rêve m’a vu, car Satan ne prend pas mon apparence; et quiconque me voit a vu la vérité (Mishkat al-Masabih, p. 1297). Le rêve sonore vient de Dieu et le cauchemar de Satan. Quiconque voit ce qui lui plaît ne doit le dire qu’à un être cher, et quiconque voit ce qui lui déplaît doit se réfugier contre son mal et celui de Satan, cracher trois fois et n’en parler à personne, car cela ne lui nuira pas (Mishkat al-Masabih, p. 1298). Ibn Sirin mentionne trois types de rêves: les paroles d’une personne, l’agitation de Satan et une bonne nouvelle de Dieu (Mishkat al-Masabih, p. 1298). Il relate également le rêve du Prophète concernant Jibril: un menteur dont la légende résonne jusqu’à l’horizon, un homme instruit du Coran qui s’y attarde la nuit sans le mettre en pratique le jour, trois adultères dans une fosse, un usurier dans un fleuve de sang, Ibrahim au pied de l’arbre, la première maison étant celle des croyants et la seconde celle des martyrs (Mishkat al-Masabih, p. 1300 et p. 1301). Aïcha rapporte que Khadija interrogea le Prophète au sujet de Waraqa, auquel il répondit: « Je l’ai vu en rêve vêtu de blanc » (Mishkat al-Masabih, p. 1302)."
