- tradition: other
  id: prophetic-medicine-exists
  stance:
    ar: "الطب النبوي موجود، ويؤخذ منه ما ثبتت دلالته"
    en: "Prophetic medicine exists; what is established in it is taken"
    ur: "طبِ نبوی موجود ہے، اور اس میں سے جو ثابت ہو لیا جاتا ہے"
  summary:
    ar: "رأى مدير مركز للعلاج بالأعشاب والعسل في الشارقة أن الطب النبوي موجود وأن ما ثبتت دلالته الشرعية يُعمل به، وأن الدواء الكيماوي يعالج العرض والعشب يعالج أصل المرض، وأوصى بالبدء بالعشب عند من يفهم فيه؛ وهي دعاوى المتحدث، وقد اعترض عليها الأطباء في الحلقة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:36:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:36:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:19:30}."
    en: "The director of a herbal and honey treatment centre in Sharjah held that prophetic medicine exists and that what is established by shar'i proof is acted on, that chemical drugs treat the symptom while herbs treat the root of the disease, and he advised starting with herbs from someone who understands them; these are the speaker's claims, and the physicians in the episode disputed them {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:36:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:36:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:19:30}."
