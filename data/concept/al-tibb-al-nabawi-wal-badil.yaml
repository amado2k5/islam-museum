- tradition: other
  id: complementary-not-alternative
  stance:
    ar: "طب تكميلي مساعد في الأمور البسيطة، لا بديل عن الطب الحديث"
    en: "A complementary aid in simple matters, not a substitute for modern medicine"
    ur: "سادہ امور میں تکمیلی مددگار، جدید طب کا متبادل نہیں"
  summary:
    ar: "رأى ضيوف من الصيادلة والأطباء أن الأعشاب قد تُجرَّب في الأمراض البسيطة كالزكام والإسهال، أما الأمراض المزمنة والخطيرة فتحتاج تشخيصاً صحيحاً وعلاجاً ثبتت جدواه بالبحث؛ وفضّلوا تسمية «الطب التكميلي» على «البديل»، وقال أحدهم إن من يبدأ بالعشب في مرض خطير قد يضيع فرصته {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:20:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:54:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:20:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:21:00}."
    en: "Pharmacist and physician guests held that herbs may be tried in simple ailments such as colds and diarrhoea, while chronic and serious diseases need correct diagnosis and treatment proven by research; they preferred the name 'complementary medicine' to 'alternative', and one said that whoever starts with herbs in a serious illness may lose his chance {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:20:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:54:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:20:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:21:00}."
