id: concept/al-tibb-al-nabawi-wal-badil
class: concept
kind: social
label:
  ar: "الطب النبوي والطب البديل — حقيقته وحدوده"
  en: "Prophetic medicine and alternative medicine — what it is and its limits"
  ur: "طبِ نبوی اور متبادل طب — اس کی حقیقت اور حدود"
issue:
  ar: "هل يوجد طب اسمه الطب النبوي، ولماذا يُقبل الناس على الأعشاب والطب البديل، ومتى يصح الرجوع إليه ومن يحق له أن يعالج به؟"
  en: "Is there a medicine that can be called 'prophetic medicine', why do people turn to herbs and alternative medicine, and when is it sound to use it and who may treat with it?"
  ur: "کیا کوئی طب ہے جسے «طبِ نبوی» کہا جائے، لوگ جڑی بوٹیوں اور متبادل طب کی طرف کیوں جاتے ہیں، اور کب اس سے رجوع درست ہے اور کون اس سے علاج کر سکتا ہے؟"
summary:
  ar: "حلقة «الوسطية» عن الطب النبوي والطب البديل. صوّت جمهور الاستوديو في سبب إقبال الناس عليه: 56% لأنه طبيعي غير كيماوي، و27% لأدلة شرعية، و17% لأنه أرخص؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:09:30} وقال 30% إنهم استعملوه كثيراً و45% قليلاً و25% لم يستعملوه. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:43:30} وقال ثلاثة من الضيوف الأربعة الأوائل إنه لا يوجد شيء اسمه طب نبوي. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:41:30} وختم المقدّم بأن ما ثبت شرعاً بلا خلاف أو علماً بلا خلاف يُستعمل، وما فيه شك يُترك لأهل الاختصاص. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:22:30}"
  en: "The 'Al-Wasatiyya' episode on prophetic and alternative medicine. Asked why people turn to it, the studio audience voted 56% because it is natural rather than chemical, 27% because of shar'i proofs and 17% because it is cheaper; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:09:30} 30% said they had used it often, 45% a little and 25% never. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:43:30} Three of the first four guests said there is no such thing as 'prophetic medicine'. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:41:30} The presenter closed by saying that what is proven by the sharia without dispute, or by science without dispute, may be used, and what is in doubt is left to specialists. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:22:30}"
  ur: "طبِ نبوی اور متبادل طب پر «الوسطیہ» کی قسط۔ لوگوں کے اس کی طرف رجحان کی وجہ پر اسٹوڈیو حاضرین نے یوں ووٹ دیا: 56% کیونکہ یہ قدرتی ہے کیمیائی نہیں، 27% شرعی دلائل کی وجہ سے، اور 17% کیونکہ یہ سستا ہے؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:09:30} 30% نے کہا کہ انہوں نے اسے بہت استعمال کیا، 45% نے تھوڑا اور 25% نے کبھی نہیں۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:43:30} پہلے چار مہمانوں میں سے تین نے کہا کہ «طبِ نبوی» نام کی کوئی چیز نہیں۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 00:41:30} میزبان نے یہ کہہ کر ختم کیا کہ جو شرعاً بلا اختلاف یا علمی طور پر بلا اختلاف ثابت ہو وہ استعمال ہو، اور جس میں شک ہو وہ اہلِ اختصاص پر چھوڑا جائے۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:22:30}"
sensitivity: contested
perspectives:
- tradition: sunni
  id: proven-by-sharia-or-science
  stance:
    ar: "ما ثبت شرعاً أو علماً يُستعمل، وما فيه شك يُترك لأهل الاختصاص"
    en: "What is proven by the sharia or by science is used; what is in doubt is left to specialists"
    ur: "جو شرعاً یا علمی طور پر ثابت ہو استعمال ہو؛ جس میں شک ہو اہلِ اختصاص پر چھوڑا جائے"
  summary:
    ar: "رأي المقدّم (رأي المتحدث): يستعمل ما ثبت شرعاً بلا خلاف وما ثبت علماً بلا خلاف، وينتظر في المشكوك فيه أهل التخصص؛ ولا يرى شيئاً اسمه الطب النبوي لأن ما ورد عن النبي في العلاج أربع أو خمس قضايا فقط، يستعملها إن ثبتت مع استشارة المختصين، ويرفض العلاج بتجربة يرويها الناس بعضهم لبعض {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:22:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:23:00}."
    en: "The presenter's view (speaker's opinion): he uses what is proven by the sharia without dispute and what is proven by science without dispute, and waits on specialists in what is doubtful; he does not see a thing called prophetic medicine, since what is reported from the Prophet on treatment comes to only four or five matters, which he would use if proven and with specialists' advice, and he rejects treatment by experience passed from person to person {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:22:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep24 01:23:00}."
