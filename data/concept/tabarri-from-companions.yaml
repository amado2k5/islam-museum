id: concept/tabarri-from-companions
class: concept
kind: doctrine
label: { ar: "التبري من الصحابة عند الشيعة الإمامية", en: "Disavowal (tabarri) of the Companions in Twelver Shi'a sources" }
summary:
  ar: "ينقل الصلابي من كتب الشيعة الإمامية أن الصحابة في الغالب كفروا بعد النبي إلا نفراً يسيراً، وأن أبا بكر وعمر وعثمان ومعاوية وأمهات المؤمنين يُتبرأ منهم وتُلعن، وأن التبري منهم شرط للإيمان عند بعض شيوخهم. ويذكر من الشيعة المعاصرين من دعا إلى التقريب ومن استمر في الطعن. ويعرض المؤلف في مقابل ذلك أدلة أهل السنة على عدالة الصحابة وتحريم سبهم، ومواقف أئمة أهل البيت كما يرويها، ولا يحكم المتحف بين الطرفين في مسائل العقيدة {cite:sallabi-ali-vol2 p. 238}."
  en: "Twelver Shi'i sources, as the author quotes them, hold that most Companions apostatised after the Prophet, except a few, and require disavowal of Abu Bakr, Umar, Uthman, Mu'awiya and the Prophet's wives. Presented here with the Sunni rebuttal (the Companions' adala and the prohibition of insulting them) and the author's account of what Ali and the imams of the Prophet's family are reported to have said."
wings: [ideas]
periods: [period/abbasid-early]
regions: [levant-iraq]
themes: [sects-and-schools, creed]
perspectives:
  - tradition: sunni
    id: adala-of-companions
    stance: { ar: "الصحابة كلهم عدول بتعديل الكتاب والسنة وإجماع أهل السنة، ويحرم سبهم" }
    summary: { ar: "يعرض المؤلف أدلة عدالة الصحابة من الآيات وأحاديث «لا تسبوا أصحابي» ومن أقوال ابن عبد البر وابن الصلاح والنووي وابن حجر في الإجماع، ومن أقوال مالك وأحمد وأبي زرعة في الطعن فيهم {cite:sallabi-ali-vol2 p. 343}." }
    sources: [source/sallabi-ali-vol2]
  - tradition: academic
    id: documented-tension
    stance: { ar: "الطعن في الصحابة موجود في أصول كتب المذهب، وتقابله أقوال تُنسب إلى علي وأبنائه بخلافها" }
    summary: { ar: "ينقل المؤلف عن الكشي والمجلسي في حق اليقين أدعية في لعن «صنمي قريش»، ويذكر أن علي بن الحسين وأبا جعفر وجعفر الصادق والحسن بن علي تولّوا الشيخين في روايات تذكرها كتب أهل السنة، ويذكر أن بعض شيوخ الشيعة المعاصرين دعوا إلى التقارب ثم استمروا في الطعن {cite:sallabi-ali-vol2 p. 332}." }
    sources: [source/sallabi-ali-vol2]
  - tradition: shia-twelver
    id: takfir-of-companions
    stance: { ar: "ارتداد أكثر الصحابة بعد النبي، واستثناء ثلاثة أو سبعة، والتبري من الخلفاء الثلاثة" }
    summary: { ar: "يذكر المؤلف عن الكليني رواية «كان الناس أهل ردة بعد النبي إلا ثلاثة» (المقداد وأبو ذر وسلمان)، وعن المجلسي أن الشيعة تتبرأ من «الأصنام الأربعة» أبي بكر وعمر وعثمان ومعاوية، وأن الإيمان لا يتم إلا بالتبرؤ من أعدائهم {cite:sallabi-ali-vol2 p. 330}." }
    sources: [source/sallabi-ali-vol2]
issue: { ar: "هل كفّرت الشيعة الصحابة وأوجبت التبرؤ منهم، وكيف يرد أهل السنة؟", en: "Did Twelver sources declare the Companions apostate and require disavowal of them, and how do Sunni scholars answer?" }
