summary:
  ar: "العصفر في الكتاب نبات ينقل عن ديسقوريدوس وصفه، حار في الأولى يابس في الثانية، فيه قبض معتدل مع إنضاج، ينقي الكلف والبهق، ويستعمل زهره في الطعام {cite:canon-ibn-sina-print-v1 p.611}"
  en: "Usfur is in the book a plant whose description is reported from Dioscorides, hot in the first degree and dry in the second, with a moderate astringency and a ripening power, cleansing freckles and vitiligo, its flower being used in food {cite:canon-ibn-sina-print-v1 p.611}"
  ur: "عصفر کتاب میں ایک پودا ہے جس کا وصف دیسقوریدوس سے نقل ہے، پہلے درجے میں گرم اور دوسرے میں خشک، اس میں معتدل قبض اور پکانے کی قوت ہے، جھائیوں اور برص کو صاف کرتا ہے، اور اس کا پھول کھانے میں استعمال ہوتا ہے {cite:canon-ibn-sina-print-v1 p.611}۔"
  es: "En el libro, Usfur es una planta cuya descripción se encuentra en Dioscórides, caliente en primer grado y seca en segundo, con una astringencia moderada y poder de maduración, que limpia las pecas y el vitíligo, y cuya flor se utiliza en la alimentación {cite:canon-ibn-sina-print-v1 p.611}."
  fr: "L'usfur est décrit dans le livre comme une plante rapportée par Dioscoride, chaude au premier degré et sèche au second, avec une astringence modérée et un pouvoir de maturation, nettoyant les taches de rousseur et le vitiligo, sa fleur étant utilisée en cuisine {cite:canon-ibn-sina-print-v1 p.611}"
  tr: "Kitapta saf çiçek, Dioscorides'in şöyle dediği bir bitkidir: ilkinde sıcak, ikincisinde kuru, olgunlaştıkça orta derecede büzülür, melazma ve vitiligoyu arındırır ve çiçeği yiyeceklerde kullanılır {cite:canon-ibn-sina-print-v1 s.611}"
  id: "Dalam buku tersebut, safflower adalah tanaman yang dikutip dari Dioscorides yang mengatakan: panas pada yang pertama dan kering pada yang kedua, dengan kontraksi sedang saat matang, memurnikan melasma dan vitiligo, dan bunganya digunakan dalam makanan {cite:canon-ibn-sina-print-v1 hlm.611}"
