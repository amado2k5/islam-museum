label: { ar: "ميثاق بني إسرائيل", en: "The covenant with the Children of Israel", es: "El pacto con los hijos de Israel", fr: "L'alliance avec les enfants d'Israël" }
issue:
  ar: "ما الميثاق الغليظ الذي أخذه الله على بني إسرائيل، وما الذي نقضوه منه؟"
summary:
  ar: "العهد الذي أخذه الله على بني إسرائيل بالعمل بالتوراة، وما ترتب على نقضه. يرى رشيد رضا أن الميثاق الغليظ هو العمل بالتوراة كلها بقوة واجتهاد، ومنه البشارة بعيسى ومحمد، ويستدل بما في آخر التوراة كما يطالعه في الترجمة التي يذكرها. ويذكر أن الجبل رُفع فوقهم بسبب الميثاق، ويعد ما نقضوه من الميثاق وكفرهم بالآيات وقتلهم الأنبياء سبباً لما حل بهم من اللعن والغضب والذلة وزوال الملك. ويتساءل بعد ذلك إن كان يستغرب من أهل هذا النقض تحريفهم البشارة بعيسى ومحمد ومشاقتهما. هذه قراءة رضا، وتنسب إليه هنا."
  en: "The covenant that God took from the Children of Israel to act upon the Torah, and what followed from breaking it. Rashid Rida holds that the solemn covenant is to act upon the whole Torah with strength and diligence, including the good tidings of Jesus and Muhammad, and he draws support from what he reads at the end of the Torah in the translation he quotes. He notes that the mountain was lifted above them because of the covenant, and he counts their breaking of the covenant, their rejection of the signs and their killing of prophets as the cause of what befell them: curse, wrath, humiliation and the loss of sovereignty. He then asks whether it is surprising, from people who broke the covenant, that they distorted the good tidings of Jesus and Muhammad and opposed them. This is Rida's reading, and it is attributed to him here."
  es: "El pacto que Dios hizo con los Hijos de Israel para que actuaran conforme a la Torá, y las consecuencias de su ruptura. Rashid Rida sostiene que el pacto solemne consiste en actuar conforme a toda la Torá con fuerza y diligencia, incluyendo las buenas nuevas de Jesús y Mahoma, y se apoya en lo que lee al final de la Torá en la traducción que cita. Señala que la montaña se elevó sobre ellos debido al pacto, y considera que su ruptura, su rechazo de las señales y el asesinato de profetas fueron la causa de lo que les sobrevino: maldición, ira, humillación y la pérdida de soberanía. Luego pregunta si es sorprendente que, viniendo de quienes rompieron el pacto, distorsionaran las buenas nuevas de Jesús y Mahoma y se opusieran a ellas. Esta es la interpretación de Rida, y se le atribuye aquí."
  fr: "L'alliance que Dieu a conclue avec les Enfants d'Israël, les enjoignant à appliquer la Torah, et les conséquences de sa rupture. Rashid Rida soutient que cette alliance solennelle consiste à appliquer la Torah dans son intégralité avec force et diligence, y compris la bonne nouvelle de Jésus et de Mahomet. Il s'appuie sur sa lecture de la fin de la Torah dans la traduction qu'il cite. Il note que la montagne fut élevée au-dessus d'eux en raison de cette alliance et considère leur rupture, leur rejet des signes et le meurtre des prophètes comme la cause de leur châtiment: malédiction, colère divine, humiliation et perte de souveraineté. Il s'interroge alors: est-il surprenant, de la part de ceux qui ont rompu l'alliance, qu'ils aient déformé la bonne nouvelle de Jésus et de Mahomet et se soient opposés à eux ? Telle est l'interprétation de Rida, qui lui est attribuée ici."
