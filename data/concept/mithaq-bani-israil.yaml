kind: term
label: { ar: "ميثاق بني إسرائيل", en: "The covenant with the Children of Israel" }
issue:
  ar: "ما الميثاق الغليظ الذي أخذه الله على بني إسرائيل، وما الذي نقضوه منه؟"
summary:
  ar: "العهد الذي أخذه الله على بني إسرائيل بالعمل بالتوراة، وما ترتب على نقضه. يرى رشيد رضا أن الميثاق الغليظ هو العمل بالتوراة كلها بقوة واجتهاد، ومنه البشارة بعيسى ومحمد، ويستدل بما في آخر التوراة كما يطالعه في الترجمة التي يذكرها. ويذكر أن الجبل رُفع فوقهم بسبب الميثاق، ويعد ما نقضوه من الميثاق وكفرهم بالآيات وقتلهم الأنبياء سبباً لما حل بهم من اللعن والغضب والذلة وزوال الملك. ويتساءل بعد ذلك إن كان يستغرب من أهل هذا النقض تحريفهم البشارة بعيسى ومحمد ومشاقتهما. هذه قراءة رضا، وتنسب إليه هنا."
  en: "The covenant that God took from the Children of Israel to act upon the Torah, and what followed from breaking it. Rashid Rida holds that the solemn covenant is to act upon the whole Torah with strength and diligence, including the good tidings of Jesus and Muhammad, and he draws support from what he reads at the end of the Torah in the translation he quotes. He notes that the mountain was lifted above them because of the covenant, and he counts their breaking of the covenant, their rejection of the signs and their killing of prophets as the cause of what befell them: curse, wrath, humiliation and the loss of sovereignty. He then asks whether it is surprising, from people who broke the covenant, that they distorted the good tidings of Jesus and Muhammad and opposed them. This is Rida's reading, and it is attributed to him here."
