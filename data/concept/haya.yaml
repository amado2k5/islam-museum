id: concept/haya
class: concept
kind: ethical
label:
  ar: الحياء
  en: Haya' (modesty and shame)
summary:
  ar: "الخلق المانع من فعل القبائح؛ جاء في حديث أبي مسعود البدري عند البخاري «إن مما أدرك الناس من كلام النبوة الأولى: إذا لم تستح فاصنع ما شئت»، ويبين ابن رجب أن عبارة «كلام النبوة الأولى» تعني أنه مأثور عن الأنبياء المتقدمين تداوله الناس وتوارثوه قرناً بعد قرن حتى وصل إلى أول هذه الأمة، وفي بعض الروايات «لم يدرك الناس من كلام النبوة الأولى إلا هذا»؛ ولقوله «إذا لم تستح فاصنع ما شئت» معنيان: أحدهما أنه ليس بمعنى الأمر بل الذم والنهي — إما تهديد ووعيد كقوله تعالى «اعملوا ما شئتم إنه بما تعملون بصير» وحديث «من باع الخمر فليشقص الخنازير» وهو اختيار جماعة منهم أبو العباس ثعلب، وإما أمر في اللفظ معناه الخبر أي أن من لا حياء له يصنع ما شاء لأن المانع من فعل القبائح هو الحياء كقوله «من كذب علي متعمداً فليتبوأ مقعده من النار» وهو اختيار أبي عبيد القاسم بن سلام وابن قتيبة ومحمد بن نصر المروزي وروى أبو داود عن الإمام أحمد ما يدل على مثله."
  en: "The disposition that restrains a person from ugly deeds; in Abu Masud al-Badri's hadith in al-Bukhari: 'what people have retained of the speech of the first prophethood: if you feel no shame, do as you wish' — 'the speech of the first prophethood' meaning, for Ibn Rajab, what was handed down from the earlier prophets and inherited by people generation after generation until it reached the first of this community, one route adding 'nothing of the speech of the first prophethood reached people except this'; 'if you feel no shame, do as you wish' has two readings — not an imperative but censure: either threat and warning like 'do as you wish, for He sees what you do' and the hadith 'whoever sells wine, let him then carve up the pigs', the choice of a group including Abu al-Abbas Tha'lab, or an imperative in form carrying a statement — whoever lacks shame does whatever he wishes, shame being the only check on ugly deeds, like 'whoever lies about me deliberately, let him take his seat in the Fire' — the choice of Abu Ubayd al-Qasim ibn Sallam, Ibn Qutayba and Muhammad ibn Nasr al-Marwazi, Abu Dawud reporting from Ahmad what indicates the same."
