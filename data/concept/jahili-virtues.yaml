label: { ar: "أخلاق أهل الجاهلية", en: "The virtues of the Arabs of the Jahiliyya", es: "Las virtudes de los árabes de la Jahiliyya", fr: "Les vertus des Arabes de la Jahiliyya", ur: "جاہلیت کے عربوں کے فضائل" }
summary:
  ar: "الأخلاق الفاضلة التي يعدّها الرحيق المختوم في أهل الجاهلية مع ما كان فيهم من الدنايا: الكرم الذي استنفدوا فيه نصف أشعارهم وتحملوا به الديات والحمالات، ومنه تمدحهم بالخمر والميسر؛ والوفاء بالعهد الذي كان عندهم ديناً كما في قصص هانئ بن مسعود والسموأل وحاجب بن زرارة؛ وعزة النفس وإباء الضيم؛ والمضي في العزائم؛ والحلم والأناة على عزة وجودها؛ والسذاجة البدوية التي أثمرت الصدق والأمانة؛ ويرى المؤلف أن هذه الأخلاق كانت سبباً في اختيار العرب لحمل الرسالة."
  en: "The praiseworthy traits al-Raheeq al-Makhtum finds among the Arabs of the Jahiliyya alongside their vices: generosity, which filled half their poetry and bore blood-money and burdens, and from which came their boasting of wine and gambling; fidelity to covenants, a religion to them as in the stories of Hani ibn Mas'ud, al-Samaw'al and Hajib ibn Zurara; self-respect and refusal of humiliation; resolve; forbearance, rare among them; and Bedouin simplicity yielding truthfulness and trust; the author sees in these traits a reason the Arabs were chosen to bear the message."
  es: "Los rasgos loables que al-Raheeq al-Makhtum encuentra entre los árabes de la época preislámica, junto con sus vicios: la generosidad, que llenaba la mitad de su poesía y soportaba el dinero manchado de sangre y las cargas, y de la que provenía su jactancia de vino y juegos de azar; la fidelidad a los pactos, una religión para ellos como en las historias de Hani ibn Mas'ud, al-Samaw'al y Hajib ibn Zurara; el respeto a sí mismos y el rechazo a la humillación; la resolución; la tolerancia, rara entre ellos; y la sencillez beduina que generaba veracidad y confianza; el autor ve en estos rasgos una razón por la que los árabes fueron elegidos para llevar el mensaje."
  fr: "Les qualités louables qu'al-Raheeq al-Makhtum relève chez les Arabes de la Jahiliyya, parallèlement à leurs vices: la générosité, qui imprégnait la moitié de leur poésie et leur permettait de supporter le prix du sang et les fardeaux, et d'où provenaient leurs vantardises sur le vin et les jeux de hasard; la fidélité aux alliances, une véritable religion pour eux, comme en témoignent les récits de Hani ibn Mas'ud, al-Samaw'al et Hajib ibn Zurara; le respect de soi et le refus de l'humiliation; la détermination; la patience, rare parmi eux; et la simplicité bédouine, source de sincérité et de confiance; l'auteur voit dans ces traits une raison pour laquelle les Arabes furent choisis pour porter le message."
  ur: "رحیق المختم کو جاہلیت کے عربوں میں ان کی برائیوں کے ساتھ قابل ستائش خصلتیں ملتی ہیں: سخاوت، جس نے ان کی نصف شاعری کو بھر دیا اور خون بہا اور بوجھ اُٹھایا، اور جس سے شراب اور جوئے پر فخر کرنا شروع ہوا۔ عہدوں کی وفاداری، ان کے لیے ایک ایسا مذہب جیسا کہ ہانی بن مسعود، السماوئل اور حاجب ابن زرارہ کی کہانیوں میں ہے۔ عزت نفس اور ذلت سے انکار؛ حل تحمل، ان میں نایاب؛ اور بدویوں کی سادگی سچائی اور اعتماد پیدا کرتی ہے۔ مصنف نے ان خصلتوں میں عربوں کو پیغام پہنچانے کے لیے چنے جانے کی ایک وجہ دیکھی۔"
