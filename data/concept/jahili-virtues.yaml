label: { ar: "أخلاق أهل الجاهلية", en: "The virtues of the Arabs of the Jahiliyya" }
summary:
  ar: "الأخلاق الفاضلة التي يعدّها الرحيق المختوم في أهل الجاهلية مع ما كان فيهم من الدنايا: الكرم الذي استنفدوا فيه نصف أشعارهم وتحملوا به الديات والحمالات، ومنه تمدحهم بالخمر والميسر؛ والوفاء بالعهد الذي كان عندهم ديناً كما في قصص هانئ بن مسعود والسموأل وحاجب بن زرارة؛ وعزة النفس وإباء الضيم؛ والمضي في العزائم؛ والحلم والأناة على عزة وجودها؛ والسذاجة البدوية التي أثمرت الصدق والأمانة؛ ويرى المؤلف أن هذه الأخلاق كانت سبباً في اختيار العرب لحمل الرسالة."
  en: "The praiseworthy traits al-Raheeq al-Makhtum finds among the Arabs of the Jahiliyya alongside their vices: generosity, which filled half their poetry and bore blood-money and burdens, and from which came their boasting of wine and gambling; fidelity to covenants, a religion to them as in the stories of Hani ibn Mas'ud, al-Samaw'al and Hajib ibn Zurara; self-respect and refusal of humiliation; resolve; forbearance, rare among them; and Bedouin simplicity yielding truthfulness and trust; the author sees in these traits a reason the Arabs were chosen to bear the message."
