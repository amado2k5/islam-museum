label:
  ar: "التسامع"
  en: "Tasamu (testimony by repute and hearsay)"
  ur: "تسامع (شہرت یا سنی سنائی بات پر گواہی)"
summary:
  ar: "التسامع ما حصل من العلم بالتواتر أو الشهرة، والشهادة به جائزة في أمور مثل العتق والنسب والموت والنكاح والولاء والوقف، ويزيد المذاهب عليها بحسب أقوالها، فيزيد الحنفية المهر والدخول وولاية القاضي، ويزيد المالكية ثلاثين مسألة، ويزيد الشافعية الملك، ويزيد الحنابلة الملك المطلق والولادة والطلاق والخلع وأصل الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5048} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5049} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5050} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5051}"
  en: "Tasamu is knowledge gained by repeated report or wide repute. Testimony by repute is allowed by agreement in six matters: freeing, descent, death, marriage, patronage and endowment. Each school adds to this list: the Hanafis the dower, consummation and the appointment of a judge; the Malikis many more; the Shafi'is ownership; the Hanbalis absolute ownership, birth, divorce, khul, the endowment and its purpose. The Hanafis require the report to come from people who could not agree on a lie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5048} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5049} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5050} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5051}"
