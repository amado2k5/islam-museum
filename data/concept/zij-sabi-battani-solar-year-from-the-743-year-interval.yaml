label: { ar: "سنة البتاني الشمسية من الفاصل بين الرصدين", en: "Al-Battani's solar year from the interval of 743 years", ur: "743 سال کے فاصلے سے البتانی کا شمسی سال", es: "El año solar de Al-Battani a partir del intervalo de 743 años.", fr: "L'année solaire d'Al-Battani à partir de l'intervalle de 743 ans" }
summary:
  ar: "يأخذ البتاني الفاصل بين رصده ورصد بطليموس الخريفي سبعمائة وثلاثاً وأربعين سنة مصرية، فيتقدم زمان رصده زمان الأرباع التامة بنحو سبعة أيام، فتكون حصة السنة الواحدة ثلاثة أجزاء وأربعاً وعشرين دقيقة من ثلاثمائة وستين جزءاً هي دور يوم وليلة، فإذا أنقصها من تسعين جزءاً بقي ستة وثمانون جزءاً وست وثلاثون دقيقة، وبذلك تكون زيادة السنة على ثلاثمائة وخمسة وستين يوماً ستة وثمانين جزءاً وست وثلاثين دقيقة من ثلاثمائة وستين من اليوم {cite:zij-sabi-nallino-byblion pp.67-68}."
  en: "Al-Battani takes the interval between his autumn observation and Ptolemy's to be seven hundred and forty-three Egyptian years, so that his observation comes about seven days ahead of whole quarters; the share of one year is three parts and twenty-four minutes of the three hundred and sixty parts of a day and night, and taking this from ninety parts leaves eighty-six parts and thirty-six minutes, so that the year's excess over three hundred and sixty-five days is eighty-six parts and thirty-six minutes of the three hundred and sixty parts of a day {cite:zij-sabi-nallino-byblion pp.67-68}."
  ur: "البتانی ان کی اور بطلیموس کی خریفی رصد کے درمیان فاصلہ سات سو تینتالیس مصری سال لیتے ہیں، جس سے ان کی رصد پورے چوتھائیوں کے حساب سے تقریباً سات دن آگے آتی ہے؛ ایک سال کا حصہ دن اور رات کے تین سو ساٹھ اجزا میں سے تین اجزا اور چوبیس دقیقے بنتا ہے، اور اسے نوے اجزا میں سے گھٹانے پر چھیاسی اجزا اور چھتیس دقیقے رہتے ہیں، یوں سال کی تین سو پینسٹھ دنوں پر زیادتی دن کے تین سو ساٹھ اجزا میں سے چھیاسی اجزا اور چھتیس دقیقے بنتی ہے {cite:zij-sabi-nallino-byblion pp.67-68}۔"
  es: "Al-Battani toma el intervalo entre su observación de otoño y la de Ptolomeo en setecientos cuarenta y tres años egipcios, de modo que su observación se adelanta unos siete días a trimestres completos; la parte de un año es tres partes y veinticuatro minutos de las trescientas sesenta partes de un día y una noche, y restando esto de noventa partes quedan ochenta y seis partes y treinta y seis minutos, de modo que el exceso del año sobre trescientos sesenta y cinco días es ochenta y seis partes y treinta y seis minutos de las trescientas sesenta partes de un día {cite:zij-sabi-nallino-byblion pp.67-68}."
  fr: "Al-Battani considère que l'intervalle entre son observation d'automne et celle de Ptolémée est de sept cent quarante-trois années égyptiennes, de sorte que son observation arrive environ sept jours en avance sur les trimestres entiers; la part d'une année est de trois parties et vingt-quatre minutes des trois cent soixante parties d'un jour et d'une nuit, et en soustrayant cela de quatre-vingt-dix parties, il reste quatre-vingt-six parties et trente-six minutes, de sorte que l'excédent de l'année sur trois cent soixante-cinq jours est de quatre-vingt-six parties et trente-six minutes des trois cent soixante parties d'un jour {cite:zij-sabi-nallino-byblion pp.67-68}."
