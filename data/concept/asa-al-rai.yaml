  fr: "Asa al-ra'i (bâton de berger)"
  ur: "عصا الراعی"
summary:
  ar: "عصا الراعي في الكتاب هو البطباط، منه ذكر وأنثى وذكره أقوى، فيه قبض وجزؤه المائي كثير، ينفع الأورام والجراحات الطرية وقروح الأذن ونفث الدم والتهاب المعدة، وفي الكتاب نقل موسوم في نزف الرحم {cite:canon-ibn-sina-print-v1 p.610}"
  en: "Asa al-ra'i is in the book the batbat, male and female, the male the stronger, with astringency and a large watery part; it benefits swellings, fresh wounds, ear ulcers, spitting of blood and inflammation of the stomach, and the book gives a labelled listing on bleeding of the womb {cite:canon-ibn-sina-print-v1 p.610}"
  fr: "Asa al-ra'i est, dans le livre, le batbat, mâle et femelle, le mâle étant le plus fort, avec de l’astringence et une part aqueuse importante ; il est utile contre les tuméfactions, les plaies fraîches, les ulcères de l’oreille, le crachement de sang et l’inflammation de l’estomac, et le livre donne une mention signalée concernant le saignement de la matrice {cite:canon-ibn-sina-print-v1 p.610}"
  ur: "عصا الراعی کتاب میں بطباط ہے، اس کا نر اور مادہ ہوتا ہے اور نر زیادہ قوی ہے، اس میں قبض ہے اور اس کا آبی جزو زیادہ ہے؛ ورموں، تازہ زخموں، کان کے زخموں، خون تھوکنے اور معدے کی سوزش میں فائدہ دیتا ہے، اور کتاب میں رحم کے خون بہنے کے بارے میں ایک موسوم نقل ہے {cite:canon-ibn-sina-print-v1 p.610}۔"
