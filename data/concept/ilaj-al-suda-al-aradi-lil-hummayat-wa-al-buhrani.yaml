id: concept/ilaj-al-suda-al-aradi-lil-hummayat-wa-al-buhrani
class: concept
kind: scientific
label:
  ar: "علاج الصداع العارض للحميات والصداع البحراني"
  en: "Treatment of headache that comes with fevers and of crisis headache"
  ur: "بخاروں کے ساتھ آنے والے اور بحرانی صداع کا علاج"
  es: "Tratamiento del dolor de cabeza que acompaña a la fiebre y del dolor de cabeza agudo."
  fr: "Traitement des céphalées fébriles et des céphalées de crise"
summary:
  ar: "يذكر ابن سينا أن الصداع العارض للحميات يقلق المريض ويزيد سببه، وأن علاج الصداع البحراني أن يُعان ميل الطبيعة بالمادة إلى الجهة التي تميل إليها بحسب علاماتها {cite:canon-ibn-sina-print-v2 pp.68-69}"
  en: "Ibn Sina says that the headache that comes with fevers troubles the patient and adds to its cause, and that the treatment of crisis headache is to help the nature's inclination with the matter to the direction in which it inclines, according to its signs {cite:canon-ibn-sina-print-v2 pp.68-69}"
  ur: "ابن سینا کہتا ہے کہ بخاروں کے ساتھ آنے والا صداع مریض کو بے چین کرتا اور اپنے سبب میں اضافہ کرتا ہے، اور بحرانی صداع کا علاج یہ ہے کہ طبیعت کے مادے کے ساتھ جس سمت مائل ہونے کی علامات ہوں اسی کی مدد کی جائے {cite:canon-ibn-sina-print-v2 pp.68-69}۔"
  es: "Ibn Sina afirma que el dolor de cabeza que acompaña a la fiebre molesta al paciente y agrava su afección, y que el tratamiento de la cefalea de crisis consiste en ayudar a la naturaleza a inclinarse hacia la materia en la dirección en que se inclina, según sus signos {cite:canon-ibn-sina-print-v2 pp.68-69}"
  fr: "Ibn Sina affirme que les maux de tête qui accompagnent la fièvre perturbent le patient et aggravent sa cause, et que le traitement des crises de céphalée consiste à aider la nature à s'aligner sur ses signes {cite:canon-ibn-sina-print-v2 pp.68-69}"
