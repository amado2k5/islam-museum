label:
  ar: "التعريف"
  en: "Ta'rif (making known: the Arafat gathering in towns, the announcement of a found thing, identifying the parties in a claim)"
  ur: "تعریف (اعلان: عرفات کا اجتماع، گری ہوئی چیز کا اعلان، اور دعوے میں فریقین کی شناخت)"
summary:
  ar: "التعريف الإعلام والتوضيح، وعند الأصوليين الحد الجامع المانع. ومن صوره عند الفقهاء: التعريف يوم عرفة في الأمصار، فأجازه أحمد ولم يستحبه، وكرهه أبو حنيفة ومالك؛ وتعريف اللقطة واجب عند الأئمة الثلاثة وهو الأصح عند الشافعية؛ وتعريف المدعى به والمدعى عليه شرط لسماع الدعوى باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5417}"
  en: "Ta'rif is making known and clear; the usulis use it for a definition that includes and excludes. Among its applications for the jurists: the gathering in towns on the day of Arafat, which Ahmad allowed without recommending while Abu Hanifa and Malik disliked it; the announcement of a found thing, which the three imams hold obligatory and the Shafiis hold the sounder view; and identifying the claimed thing and the defendant, a condition of hearing a claim by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5417}"
