id: concept/tacrif-defining-and-announcing
class: concept
kind: legal
label:
  ar: "التعريف"
  en: "Ta'rif (making known: the Arafat gathering in towns, the announcement of a found thing, identifying the parties in a claim)"
  ur: "تعریف ⁦(اعلان: عرفات کا اجتماع، گری ہوئی چیز کا اعلان، اور دعوے میں فریقین کی شناخت)⁩"
  es: "Ta'rif (dando a conocer: la reunión de Arafat en las ciudades, el anuncio de un hallazgo, la identificación de las partes en una reclamación)"
  fr: "Ta'rif (faire connaître: le rassemblement d'Arafat dans les villes, l'annonce d'une découverte, l'identification des parties à une réclamation)"
  tr: "Tanım"
  id: "Definisi"
summary:
  ar: "التعريف الإعلام والتوضيح، وعند الأصوليين الحد الجامع المانع. ومن صوره عند الفقهاء: التعريف يوم عرفة في الأمصار، فأجازه أحمد ولم يستحبه، وكرهه أبو حنيفة ومالك؛ وتعريف اللقطة واجب عند الأئمة الثلاثة وهو الأصح عند الشافعية؛ وتعريف المدعى به والمدعى عليه شرط لسماع الدعوى باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5417}"
  en: "Ta'rif is making known and clear; the usulis use it for a definition that includes and excludes. Among its applications for the jurists: the gathering in towns on the day of Arafat, which Ahmad allowed without recommending while Abu Hanifa and Malik disliked it; the announcement of a found thing, which the three imams hold obligatory and the Shafiis hold the sounder view; and identifying the claimed thing and the defendant, a condition of hearing a claim by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5417}"
  es: "Ta'rif significa dar a conocer y aclarar; los usulis lo utilizan para una definición que incluye y excluye. Entre sus aplicaciones para los juristas se encuentran: la reunión en las ciudades el día de Arafat, que Ahmad permitió sin recomendarla, mientras que Abu Hanifa y Malik la desaprobaron; el anuncio de un hallazgo, que los tres imanes consideran obligatorio y los shafiíes sostienen la opinión más sólida; y la identificación del objeto reclamado y del demandado, condición para tramitar una demanda por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5417}"
  fr: "Le ta'rif signifie « faire connaître et clarifier »; les usulis l'utilisent pour une définition qui inclut et exclut. Parmi ses applications pour les juristes: le rassemblement dans les villes le jour d'Arafat, autorisé par Ahmad sans être recommandé, tandis qu'Abu Hanifa et Malik le désapprouvaient; l'annonce d'une chose trouvée, que les trois imams considèrent comme obligatoire et que les chaféites jugent plus judicieuse; et l'identification de la chose revendiquée et du défendeur, condition nécessaire pour entendre une demande par accord mutuel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5417}"
  ur: "طریف معلوم اور واضح کر رہا ہے۔ usulis اسے اس تعریف کے لیے استعمال کرتے ہیں جس میں شامل اور خارج ہوتے ہیں۔ فقہاء کے لیے اس کی درخواستوں میں سے: عرفات کے دن شہروں میں اجتماع، جس کی احمد نے بغیر سفارش کی اجازت دی جبکہ ابو حنیفہ اور مالک نے اسے ناپسند کیا۔ ایک پائی جانے والی چیز کا اعلان، جسے تینوں ائمہ واجب سمجھتے ہیں اور شافعی صحیح نظریہ رکھتے ہیں۔ اور دعویٰ کی گئی چیز اور مدعا علیہ کی شناخت کرنا، معاہدے کے ذریعے دعویٰ سننے کی شرط۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5415} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5416}"
  tr: "Tanım: Bilgi ve açıklama, ve hukukçulara göre kapsamlı ve yasaklayıcı ceza. Hukukçulara göre biçimleri arasında: şehirlerde Arafah Günü tanımı, Ahmed'in izin verdiği ve önermediği, Ebu Hanifa ve Malik'in hoşlanmadığı; bulunan eşyanın tanımı üç imama göre zorunludur ve Şafiilere göre en doğrudur; ve sanık ile sanık tanımı, davanın oybirliğiyle görülmesi için bir koşuldur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5417}"
  id: "Definisi: Pengetahuan dan klarifikasi, dan menurut para ahli hukum, hukuman yang komprehensif dan melarang. Di antara bentuknya menurut ahli hukum: definisi pada Hari Arafah di kota-kota, yang diizinkan dan tidak direkomendasikan oleh Ahmad, dan yang tidak disukai oleh Abu Hanifa dan Malik; definisi barang yang ditemukan wajib menurut tiga imam dan paling benar menurut syafi'i; dan definisi terdakwa dan terdakwa adalah syarat untuk mendengar perkara secara konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5417}"
