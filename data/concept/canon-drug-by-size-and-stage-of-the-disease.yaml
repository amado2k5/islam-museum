id: concept/canon-drug-by-size-and-stage-of-the-disease
class: concept
kind: scientific
label:
  ar: "الدواء بحسب مقدار المرض ووقته عند ابن سينا"
  en: "The drug by the size and the stage of the disease in the Canon"
  fr: "Remède selon intensité et stade de maladie dans le Canon"
  ur: "مرض کی مقدار اور وقت کے مطابق دوا قانون میں"
  es: "El fármaco según el tamaño y la etapa de la enfermedad en el Canon"
  tr: "İbn Sina'ya göre hastalığın boyutu ve zamanlamasına göre ilaç"
  id: "Obat sesuai dengan tingkat dan waktu penyakit menurut Ibn Sina"
summary:
  ar: "يبين ابن سينا أن شدة الدواء تتبع شدة المرض، وأن وقت المرض يغير العلاج: فالورم في ابتدائه يعالج بما يردع، وفي منتهاه بما يحلل، وبينهما بالجمع، والمرض الحاد يلطف له التدبير في الابتداء ويبالغ في المنتهى {cite:canon-ibn-sina-print-v1 p.270}."
  en: "Ibn Sina shows that a drug's strength follows the strength of the disease and that the stage of the disease changes treatment: a swelling at its start is met with what repels, at its end with what dissolves, and in between with both, and an acute disease has its regimen made moderately light at the start and thoroughly light toward the end {cite:canon-ibn-sina-print-v1 p.270}."
  fr: "Ibn Sina adapte puissance du remède à celle du mal et traitement au stade : répulsifs au début du gonflement, résolutifs à la fin, les deux entre-temps ; régime modérément allégé au début des maladies aiguës, fortement à la fin {cite:canon-ibn-sina-print-v1 p.270}."
  es: "Ibn Sina muestra que la potencia de un medicamento depende de la gravedad de la enfermedad y que la etapa de la enfermedad modifica el tratamiento: una inflamación al inicio se trata con lo que repele, al final con lo que disuelve, y en el medio con ambos, y una enfermedad aguda tiene un régimen moderadamente suave al principio y completamente suave hacia el final {cite:canon-ibn-sina-print-v1 p.270}."
  ur: "ابن سینا بتاتے ہیں کہ دوا کی طاقت بیماری کی طاقت کے مطابق ہوتی ہے اور بیماری کا مرحلہ علاج میں تبدیلی لاتا ہے: شروع میں سوجن کو دور کرنے والی چیز سے، اس کے آخر میں گھل جانے والی چیزوں کے ساتھ، اور ان دونوں کے درمیان، اور ایک شدید بیماری کا علاج شروع میں ہلکا اور آخر کی طرف مکمل طور پر ہلکا ہوتا ہے۔"
  tr: "İbn Sina, ilacın şiddetinin hastalığın şiddetine bağlı olduğunu ve hastalığın zamanlamasının tedaviyi değiştirdiğini açıklar: tümör başlangıçta caydırıcı olanla tedavi edilir, sonunda izin verilenle tedavi edilir ve aralarındaki fark birleştirilir. Akut hastalıkta yönetim başlangıçta nazik, sonunda abartılıdır {cite:canon-ibn-sina-print-v1 s.270}."
  id: "Ibn Sina menjelaskan bahwa tingkat keparahan obat mengikuti tingkat keparahan penyakit, dan waktu penyakitnya mengubah pengobatan: tumor awalnya diobati dengan apa yang bersifat pencegah, pada akhirnya dengan apa yang diperbolehkan, dan perbedaan di antara keduanya digabungkan. Untuk penyakit akut, penanganan dilakukan dengan lembut di awal dan dilebih-lebihkan di akhir {cite:canon-ibn-sina-print-v1 hlm.270}."
