label: { ar: "الدواء بحسب مقدار المرض ووقته عند ابن سينا", en: "The drug by the size and the stage of the disease in the Canon", ur: "مرض کی مقدار اور وقت کے مطابق دوا قانون میں" }
summary:
  ar: "يبين ابن سينا أن شدة الدواء تتبع شدة المرض، وأن وقت المرض يغير العلاج: فالورم في ابتدائه يعالج بما يردع، وفي منتهاه بما يحلل، وبينهما بالجمع، والمرض الحاد يلطف له التدبير في الابتداء ويبالغ في المنتهى {cite:canon-ibn-sina-print-v1 p.270}."
  en: "Ibn Sina shows that a drug's strength follows the strength of the disease and that the stage of the disease changes treatment: a swelling at its start is met with what repels, at its end with what dissolves, and in between with both, and an acute disease has its regimen made moderately light at the start and thoroughly light toward the end {cite:canon-ibn-sina-print-v1 p.270}."
