label: { ar: "المُنَاوَلَة", en: "Handing over (munawala): a mode of transmission in hadith and of taking possession in sale", ur: "مناولہ (دینا اور وصول کرنا)" }
summary:
  ar: "المناولة في اللغة كل ما يعطى باليد، وفي اصطلاح المحدثين أن يدفع الشيخ إلى الطالب أصل سماعه أو فرعا مقابلا به، فهي طريقة من طرق التحمل، وتنقسم إلى مقرونة بالإجازة وهي أعلاها، ومجردة عنها لا يجوز الرواية بها عند الجمهور. وفي الفقه تكون قبضا للمعقود عليه في المنقولات عند جمهور الفقهاء."
  en: "Munawala in the lexicon is anything given by hand. In the science of hadith it is the teacher handing a pupil his own text or a collated copy, a way of receiving reports. It is of two kinds: one with a licence to narrate, which is the highest, and one without it, on which narration is not allowed by the majority. In sale, the handing over of a movable good counts as taking possession of it."
  ur: "مناولہ لغت میں ہاتھ سے دینے کو کہتے ہیں۔ علمِ حدیث میں استاد اپنی سماع کی اصل یا اس کا مقابل نسخہ شاگرد کو دے دیتا ہے۔ اجازت کے ساتھ ہو تو اعلیٰ ہے، ورنہ جمہور کے نزدیک اس سے روایت جائز نہیں۔"
