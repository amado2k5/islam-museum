label:
  ar: التقليد الأعمى
  en: Blind imitation (taqlid)
summary:
  ar: "ينقل محمد فريد وجدي عن علماء الإسلام، دون أن يسميهم، أن إيمان المقلد غير مقبول، لأن التقليد قد يكون في الباطل كما يكون في الحق؛ ويرى أن الإسلام دعا كل مكلف إلى إعمال عقله في الاستدلال والاستنتاج حماية له من الجمود الذي يستغله أصحاب الأهواء {cite:muhimmat-al-islam-azhar p. 34} {cite:muhimmat-al-islam-azhar p. 35}. يُنسب هذا النقل إلى المؤلف."
  en: "Wajdi reports, without naming them, that scholars of Islam held the faith of a mere imitator unacceptable, because imitation can be of falsehood as well as truth. He reads Islam as calling each responsible person to use reason in inference and deduction, as protection against the rigidity that the ill-intentioned exploit {cite:muhimmat-al-islam-azhar p. 34} {cite:muhimmat-al-islam-azhar p. 35}. The statement is attributed to the author's report."
