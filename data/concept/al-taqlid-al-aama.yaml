id: concept/al-taqlid-al-aama
class: concept
kind: term
tags: [madhahib-browser, mh-mafahim]
label:
  ar: التقليد الأعمى
  en: Blind imitation (taqlid)
  fr: "Imitation aveugle (taqlid)"
  es: "Imitación ciega (taqlid)"
summary:
  ar: "ينقل محمد فريد وجدي عن علماء الإسلام، دون أن يسميهم، أن إيمان المقلد غير مقبول، لأن التقليد قد يكون في الباطل كما يكون في الحق؛ ويرى أن الإسلام دعا كل مكلف إلى إعمال عقله في الاستدلال والاستنتاج حماية له من الجمود الذي يستغله أصحاب الأهواء {cite:muhimmat-al-islam-azhar p. 34} {cite:muhimmat-al-islam-azhar p. 35}. يُنسب هذا النقل إلى المؤلف."
  en: "Wajdi reports, without naming them, that scholars of Islam held the faith of a mere imitator unacceptable, because imitation can be of falsehood as well as truth. He reads Islam as calling each responsible person to use reason in inference and deduction, as protection against the rigidity that the ill-intentioned exploit {cite:muhimmat-al-islam-azhar p. 34} {cite:muhimmat-al-islam-azhar p. 35}. The statement is attributed to the author's report."
  fr: "Wajdi rapporte, sans les nommer, que des savants de l’islam tenaient pour inacceptable la foi du simple imitateur, car on peut imiter aussi bien le faux que le vrai. Selon sa lecture, l’islam demande à toute personne tenue pour responsable de se servir de sa raison pour inférer et déduire, afin de se prémunir contre la rigidité que les personnes mal intentionnées exploitent {cite:muhimmat-al-islam-azhar p. 34} {cite:muhimmat-al-islam-azhar p. 35}. Cette affirmation est attribuée au récit de l’auteur."
  es: "Wajdi informa, sin mencionarlos, que los eruditos del Islam consideraban inaceptable la fe de un mero imitador, ya que la imitación puede ser tanto de la falsedad como de la verdad. Interpreta el Islam como un llamado a toda persona responsable a usar la razón en la inferencia y la deducción, como protección contra la rigidez que explotan los malintencionados {cite:muhimmat-al-islam-azhar p. 34} {cite:muhimmat-al-islam-azhar p. 35}. Esta afirmación se atribuye al informe del autor."
