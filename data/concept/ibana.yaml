id: concept/ibana
class: concept
kind: legal
label: { ar: "الإبانة", en: "Severance of a part from a living body (ibana)", es: "Separación de una parte de un cuerpo vivo (ibana)", fr: "Séparation d'une partie d'un corps vivant (ibana)", ur: "زندہ جسم سے کسی حصے کا الگ ہونا", tr: "El-İbanah", id: "Al-Ibanah" }
summary:
  ar: "الإبانة عند الفقهاء الفصل والقطع، ومنها ما يُبان من الحي. تعرض الموسوعة الكويتية الحكم الإجمالي فيه: أن ما أُبين من حي، غير الصوف والشعر من المأكول، فهو كميتته، استناداً إلى حديث يُروى بروايات متعددة، وتنقل الموسوعة عن أهل الحديث أن إسناده ضعيف في أكثر طرقه، وأن الترمذي حسّنه. وتذكر أن الحكم في المقطوع بعد التذكية وقبل الموت يختلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1413}"
  en: "For the jurists, ibana means separation or severance, and it includes the separation of a part from a living creature. The Kuwaiti encyclopedia states the general rule: what is severed from a living creature, other than the wool and hair of an edible animal, is like its carrion, on the basis of a report transmitted in several forms. The encyclopedia notes that critics judged its chain weak in most routes, while al-Tirmidhi graded it hasan; and that a part cut after slaughter and before death is lawful to eat, though disliked in general."
  es: "Para los juristas, ibana significa separación o desmembramiento, e incluye la separación de una parte de un ser vivo. La enciclopedia kuwaití establece la regla general: lo que se separa de un ser vivo, a excepción de la lana y el pelo de un animal comestible, es como su carroña, según un relato transmitido de diversas formas. La enciclopedia señala que los críticos consideraron débil su cadena de transmisión en la mayoría de las rutas, mientras que al-Tirmidhi lo clasificó como hasan; y que una parte cortada después del sacrificio y antes de la muerte es lícita para comer, aunque generalmente no es recomendable."
  fr: "Pour les juristes, le terme « ibana » signifie séparation ou détachement, et inclut le détachement d'une partie d'un être vivant. L'encyclopédie koweïtienne énonce la règle générale suivante: ce qui est détaché d'un être vivant, hormis la laine et les poils d'un animal comestible, est assimilé à sa charogne, selon une tradition transmise sous diverses formes. L'encyclopédie note que les critiques ont jugé sa chaîne de transmission faible dans la plupart des cas, tandis qu'al-Tirmidhi l'a qualifiée de « hasan » (bonne tradition); et qu'une partie coupée après l'abattage et avant la mort est licite à consommer, bien que généralement déconseillée."
  ur: "فقہاء کے نزدیک ابنا کا مطلب علیحدگی یا علیحدگی ہے اور اس میں جاندار سے کسی حصے کو الگ کرنا بھی شامل ہے۔ کویتی انسائیکلوپیڈیا عام اصول بیان کرتا ہے: کھانے کے قابل جانور کی اون اور بالوں کے علاوہ جو چیز کسی جاندار سے کاٹی جاتی ہے وہ اس کے مردار کی طرح ہوتی ہے، اس رپورٹ کی بنیاد پر جو کئی شکلوں میں منتقل ہوتی ہے۔ انسائیکلوپیڈیا نوٹ کرتا ہے کہ ناقدین نے اکثر راستوں میں اس کے سلسلے کو کمزور قرار دیا، جبکہ ترمذی نے اسے حسن قرار دیا۔ اور یہ کہ ذبح کے بعد اور موت سے پہلے کاٹا گیا حصہ کھانا حلال ہے، اگرچہ عام طور پر ناپسندیدہ ہو۔"
  tr: "Hukukçulara göre, açıklama ayırma ve kesmedir, bir kısmı ise yaşayanlardan görülen şeydir. Kuveyt Ansiklopedisi genel bir hükmü sunar: yün ve yün dışında, yün ve yün dışında yaşayanların miktarı olduğu ve bunun birçok hadise rivayet edilen bir hadise dayandığıdır. Ansiklopedi, hadis alimlerinden zincirin çoğu zincirde zayıf olduğunu ve el-Tirmidi'nin bunu iyi olarak değerlendirdiğini bildirir. Ayrıca, bir parçanın ölen kişiden sonra ve ölümden önce verilmesi farklı olduğu belirtilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1413}"
  id: "Menurut ahli hukum, klarifikasi adalah pemisahan dan pemotongan, dan sebagian adalah apa yang terlihat dari orang hidup. Ensiklopedia Kuwait menyajikan aturan umum tentangnya: bahwa yang jelas dari yang hidup, kecuali wol dan rambut dari makanan, adalah jumlahnya, berdasarkan hadits yang diceritakan dalam beberapa laporan. Ensiklopedia melaporkan dari para ulama hadis bahwa rantainya lemah pada sebagian besar rantai, dan bahwa al-Tirmidhi menilainya sebagai baik. Ensiklopedia juga mencatat bahwa keputusan atas suatu karya setelah almarhum dan sebelum kematian berbeda. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1413}"
