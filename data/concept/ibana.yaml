label: { ar: "الإبانة", en: "Severance of a part from a living body (ibana)" }
summary:
  ar: "الإبانة عند الفقهاء الفصل والقطع، ومنها ما يُبان من الحي. تعرض الموسوعة الكويتية الحكم الإجمالي فيه: أن ما أُبين من حي، غير الصوف والشعر من المأكول، فهو كميتته، استناداً إلى حديث يُروى بروايات متعددة، وتنقل الموسوعة عن أهل الحديث أن إسناده ضعيف في أكثر طرقه، وأن الترمذي حسّنه. وتذكر أن الحكم في المقطوع بعد التذكية وقبل الموت يختلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1413}"
  en: "For the jurists, ibana means separation or severance, and it includes the separation of a part from a living creature. The Kuwaiti encyclopedia states the general rule: what is severed from a living creature, other than the wool and hair of an edible animal, is like its carrion, on the basis of a report transmitted in several forms. The encyclopedia notes that critics judged its chain weak in most routes, while al-Tirmidhi graded it hasan; and that a part cut after slaughter and before death is lawful to eat, though disliked in general."
