summary:
  ar: "يعرض الشيخ عمر عبد الكافي تعدد الزوجات من خلال قصة رجل تزوج امرأتين لجهل منه بما يشق على الزوج، ويصف المشقة بين الضرتين، ويضع رأيه مميزا عن الرأي السني الذي لم يُصدر بعد. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:29:30}"
  en: "Sheikh Omar Abdelkafy takes up polygyny through the story of a man who married two wives without knowing what burdens a husband, and describes the hardship between co-wives; his view is set apart from the Sunni position, which is not yet sourced. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:29:30}"
  ur: "شیخ عمر عبدالکافی تعدد ازدواج کو ایک شخص کے واقعے سے بیان کرتے ہیں جس نے دو بیویاں کیں اور اپنی ذمہ داری کے بوجھ کو نہ جانا، اور دو سوکنوں کے درمیان مشقت بیان کرتے ہیں؛ ان کی رائے سنی موقف سے الگ دکھائی گئی ہے، جو ابھی ماخوذ نہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:29:30}"
  es: "El jeque Omar Abdelkafy aborda la poliginia a través de la historia de un hombre que se casó con dos mujeres sin conocer las cargas que supone ser marido, y describe las dificultades que existen entre las esposas; su postura se distingue de la posición sunita, que aún no ha sido corroborada. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:29:30}"
  fr: "Le cheikh Omar Abdelkafy aborde la question de la polygamie à travers l'histoire d'un homme qui a épousé deux femmes sans connaître les responsabilités d'un mari, et décrit les difficultés rencontrées par les coépouses; son point de vue se distingue de la position sunnite, dont la source n'est pas encore citée. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:29:30}"
  tr: "Şeyh Ömer Abdelkafi, çok eşliliği, kocasının getirdiği zorluklardan habersiz olarak iki kadınla evlenen bir adamın hikayesiyle sunar, iki kız kardeş arasındaki sıkıntıyı anlatır ve henüz yayımlanmamış Sünni görüşünden farklı görüşünü sunar. {kaynak:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep02 00:29:30}"
  id: "Sheikh Omar Abdelkafi menyajikan poligami melalui kisah seorang pria yang menikahi dua wanita karena tidak mengetahui kesulitan yang ditimbulkan bagi suami, menggambarkan kesulitan antara kedua saudari itu, dan menyampaikan pendapatnya yang berbeda dari pendapat Sunni, yang belum diumumkan. {cite:assabile-omar-abdelkafy tafsir-al-Quran-al-qareem/ep02 00:29:30}"
