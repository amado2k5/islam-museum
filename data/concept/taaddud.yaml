summary:
  ar: "يعرض الشيخ عمر عبد الكافي تعدد الزوجات من خلال قصة رجل تزوج امرأتين لجهل منه بما يشق على الزوج، ويصف المشقة بين الضرتين، ويضع رأيه مميزا عن الرأي السني الذي لم يُصدر بعد. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:29:30}"
  en: "Sheikh Omar Abdelkafy takes up polygyny through the story of a man who married two wives without knowing what burdens a husband, and describes the hardship between co-wives; his view is set apart from the Sunni position, which is not yet sourced. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:29:30}"
  ur: "شیخ عمر عبدالکافی تعدد ازدواج کو ایک شخص کے واقعے سے بیان کرتے ہیں جس نے دو بیویاں کیں اور اپنی ذمہ داری کے بوجھ کو نہ جانا، اور دو سوکنوں کے درمیان مشقت بیان کرتے ہیں؛ ان کی رائے سنی موقف سے الگ دکھائی گئی ہے، جو ابھی ماخوذ نہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:29:30}"
