summary:
  ar: "القراض أو المضاربة عند المؤلف شركة بين رب مال نقدي وعامل على حصة من الربح الصافي، تُوزّع فيها الأرباح بحسب الاتفاق، والخسائر على أرباب المال بحسب حصة كل منهم {cite:usul-iqtisad-islami-0660 p. 144}، وهو البديل الذي يعرضه المؤلف عن القرض الربوي {cite:usul-iqtisad-islami-0660 p. 116}."
  tr: "Qarar ya da spekülasyon, yazara göre, para sahibi ile işçi arasında net kârın bir payı üzerinde yapılan ortaklıktır; burada kârlar anlaşmaya göre dağıtılır ve zararlar sahiplerin her bir hissesine göre dağıtılır {cite:usul-iqtisad-islami-0660 s. 144}; yazarın tefecilik kredileri yerine sunduğu alternatiftir {cite:usul-iqtisad-islami-0660 s. 116}."
  id: "Qarar, atau spekulasi, menurut penulis, adalah kemitraan antara pemilik moneter dan pekerja atas bagian dari laba bersih, di mana keuntungan didistribusikan sesuai dengan perjanjian, dan kerugian dibagi di antara pemilik sesuai dengan masing-masing saham mereka {cite:usul-iqtisad-islami-0660 hlm. 144}, yang merupakan alternatif yang ditawarkan penulis sebagai pengganti pinjaman riba {cite:usul-iqtisad-islami-0660 hlm. 116}."
