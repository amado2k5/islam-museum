label:
  ar: بيت المال
  en: Bayt al-mal (public treasury)
summary:
  ar: 'بيت المال عند المؤلف هو بيوت أموال الدولة، منقولها وغير منقولها، ويمتد ليشمل أراضي الدولة ومخازن الحبوب والسلاح وأنابيب المياه والنفط، فهو أشبه بالذمة المالية منه بالصندوق {cite:usul-iqtisad-islami-0660 p. 63}، ومعنى الماوردي أنه «عبارة عن الجهة لا عن المكان» {cite:usul-iqtisad-islami-0660 p. 63}. ويقسم بيوت المال ثلاثة: بيت مال الزكاة، وموارده الزكاة ومصارفه في سورة التوبة، وبيت مال المصالح، وموارده الفيء والخراج وخمس الغنيمة، ومصارفه الرواتب والثغور والمساجد والطرق، وبيت مال الضوائع، وموارده اللقطات والتركات التي لا وارث لها وديات من لا ولي له {cite:usul-iqtisad-islami-0660 p. 63} {cite:usul-iqtisad-islami-0660 p. 64}. ويرى المؤلف أن ملكية الدولة تتصرف بها الدولة تصرف الأفراد في ملكهم، أما الملكية العامة فلا تتصرف فيها الدولة ولا الفرد {cite:usul-iqtisad-islami-0660 p. 56} {cite:usul-iqtisad-islami-0660 p. 64}.'
