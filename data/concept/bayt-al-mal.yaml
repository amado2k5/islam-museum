label:
  ar: بيت المال
  en: Bayt al-mal (public treasury)
  es: "Bayt al-mal (tesoro público)"
  fr: "Bayt al-mal (trésor public)"
  ur: "بیت المال ⁦(عوامی خزانہ)⁩"
  tr: "Beyt el-Mal"
  id: "Bayt al-Mal"
summary:
  ar: 'بيت المال عند المؤلف هو بيوت أموال الدولة، منقولها وغير منقولها، ويمتد ليشمل أراضي الدولة ومخازن الحبوب والسلاح وأنابيب المياه والنفط، فهو أشبه بالذمة المالية منه بالصندوق {cite:usul-iqtisad-islami-0660 p. 63}، ومعنى الماوردي أنه «عبارة عن الجهة لا عن المكان» {cite:usul-iqtisad-islami-0660 p. 63}. ويقسم بيوت المال ثلاثة: بيت مال الزكاة، وموارده الزكاة ومصارفه في سورة التوبة، وبيت مال المصالح، وموارده الفيء والخراج وخمس الغنيمة، ومصارفه الرواتب والثغور والمساجد والطرق، وبيت مال الضوائع، وموارده اللقطات والتركات التي لا وارث لها وديات من لا ولي له {cite:usul-iqtisad-islami-0660 p. 63} {cite:usul-iqtisad-islami-0660 p. 64}. ويرى المؤلف أن ملكية الدولة تتصرف بها الدولة تصرف الأفراد في ملكهم، أما الملكية العامة فلا تتصرف فيها الدولة ولا الفرد {cite:usul-iqtisad-islami-0660 p. 56} {cite:usul-iqtisad-islami-0660 p. 64}.'
  tr: "Yazara göre, Bayt al-Mal, devlet arazileri, tahıl ve silah depoları, su ve petrol boru hatlarını da kapsayan taşınabilir ve taşınmaz devlet fonlarının evidir. Bir fondan çok finansal bir varlık gibidir {cite:usul-iqtisad-islami-0660 s. 63} ve Al-Mawardi \"bir yer değil, bir yer\" anlamına gelir {cite:usul-iqtisad-islami-0660 s. 63}. Zenginlik evlerini üçe böler: zekat hazinesi, kaynakları T-Tavbe Suresi'nde belirtilen zekat ve harcamalardır; menfaat hazinesi, kaynakları harç, kharc ve savaş ganimetlerinin beşte biri olan gelirler; harcamaları maaşlar, sınırlar, cami ve yollar; ve çorak araziler hazinesi; ve kaynakları, vasisi olmayanlar gibi miras ve miras olmayan varlıklardır {cite:usul-iqtisad-islami-0660, s. 63} {cite:usul-iqtisad-islami-0660, s. 64}. Yazar, devlet mülkiyetinin bireyler tarafından mülkiyetleri üzerinde kullanıldığına, kamu mülkiyetinin ise devlet veya bireyler tarafından yönetilmediğine inanır {cite:usul-iqtisad-islami-0660, s. 56} {cite:usul-iqtisad-islami-0660, s. 64}."
  id: "Menurut penulis, Bayt al-Mal adalah rumah dana negara, baik yang bergerak maupun tidak bergerak, mencakup tanah negara, gudang gandum dan senjata, pipa air dan minyak. Ini lebih mirip aset keuangan daripada dana {cite:usul-iqtisad-islami-0660 hlm. 63}, dan Al-Mawardi berarti bahwa itu adalah \"tempat daripada tempat\" {cite:usul-iqtisad-islami-0660 hlm. 63}. Ia membagi rumah kekayaan menjadi tiga: harta zakat, sumber dayanya adalah zakat dan pengeluaran seperti yang disebutkan dalam Surah At-Tawbah; harta bunga, yang sumbernya adalah biaya, kharaj, dan seperlima rampasan perang; pengeluarannya adalah gaji, perbatasan, masjid, dan jalan; serta harta tanah tandus; dan sumber dayanya adalah warisan dan warisan yang tidak memiliki ahli waris, seperti yang tidak memiliki wali {cite:usul-iqtisad-islami-0660, hlm. 63} {cite:usul-iqtisad-islami-0660, hlm. 64}. Penulis percaya bahwa kepemilikan negara dijalankan oleh individu atas harta mereka, sedangkan kepemilikan publik tidak dikelola oleh negara atau individu {cite:usul-iqtisad-islami-0660, hlm. 56} {cite:usul-iqtisad-islami-0660, hlm. 64}."
