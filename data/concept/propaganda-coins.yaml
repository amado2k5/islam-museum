  ur: "وہ سکے جن پر عبارت، تصویر یا علامت کے ذریعے سیاسی یا تشہیری پیغام ہو، جنہیں حکمران کسی موقع پر سرکاری طور پر یا دوسرے لوگ ریاست کے بارے میں اپنے موقف کے مطابق خفیہ یا علانیہ جاری کرتے، جیسے 597ھ کا غوری سکہ جس پر «اللہ اعلیٰ» کا شعار ہے {cite:nccah-islamic-coins-brochure p. 28}۔"
