summary:
  ar: "نقود تحمل رسالة سياسية أو دعائية بنص أو صورة أو رمز، يصدرها الحاكم رسميًا في مناسبة ما أو يصدرها غيره سرًا أو علنًا بحسب موقفهم من الدولة، كنقد الغوريين بشعار «الله أعلى» سنة 597هـ {cite:nccah-islamic-coins-brochure p. 28}."
  en: "Coins carrying a political or publicity message in text, image or symbol, issued officially by a ruler for an occasion or unofficially by others according to their stance toward the state, such as the Ghurid coin with the motto 'God is most high' of 597 AH {cite:nccah-islamic-coins-brochure p. 28}."
  ur: "وہ سکے جن پر عبارت، تصویر یا علامت کے ذریعے سیاسی یا تشہیری پیغام ہو، جنہیں حکمران کسی موقع پر سرکاری طور پر یا دوسرے لوگ ریاست کے بارے میں اپنے موقف کے مطابق خفیہ یا علانیہ جاری کرتے، جیسے 597ھ کا غوری سکہ جس پر «اللہ اعلیٰ» کا شعار ہے {cite:nccah-islamic-coins-brochure p. 28}۔"
  es: "Monedas que llevan un mensaje político o publicitario en texto, imagen o símbolo, emitidas oficialmente por un gobernante para una ocasión o extraoficialmente por otros según su postura hacia el estado, como la moneda Ghurid con el lema \"Dios es el más alto\" del año 597 AH {cite:nccah-islamic-coins-brochure p. 28}."
