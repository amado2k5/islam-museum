summary:
  ar: "نقود تحمل رسالة سياسية أو دعائية بنص أو صورة أو رمز، يصدرها الحاكم رسميًا في مناسبة ما أو يصدرها غيره سرًا أو علنًا بحسب موقفهم من الدولة، كنقد الغوريين بشعار «الله أعلى» سنة 597هـ {cite:nccah-islamic-coins-brochure p. 28}."
