id: "concept/al-jahr-tibb"
class: "concept"
kind: "scientific"
label:
  ar: "الجهر"
  en: "Day blindness (al-jahr)"
  fr: "Cécité diurne (al-jahr)"
  ur: "دن کوری ⁦(جہر)⁩"
  es: "ceguera diurna (al-jahr)"
  tr: "Ses yüksekliği"
  id: "Volume"
summary:
  ar: "الجهر أن لا يبصر بالنهار، وسببه رقة الروح وقلته جداً فيتحلل مع ضوء الشمس ويجتمع في الظلمة، وربما كان قليلاً فيرى في الظلمة والظل ويضعف في الضوء، وعلاجه الزيادة في الترطيب وتغليظ الدم {cite:canon-ibn-sina-print-v2 p.207}"
  en: "Jahr is not seeing by day; its cause is the thinness and great scantiness of the spirit, which is dissolved by sunlight and gathers in darkness — or it may be slight, so that he sees in darkness and shade night and day and weakens in light; its treatment is increasing moistening and thickening the blood {cite:canon-ibn-sina-print-v2 p.207}"
  fr: "Le jahr est l’incapacité de voir le jour. Dans cette description ancienne, il s’explique par un esprit trop ténu et trop rare, qui se dissipe à la lumière du soleil et se rassemble dans l’obscurité. L’atteinte peut être légère : la personne voit dans l’obscurité et à l’ombre, de nuit comme de jour, mais sa vue faiblit à la lumière. Le traitement décrit consistait à accroître l’humidification et à épaissir le sang {cite:canon-ibn-sina-print-v2 p.207}"
  ur: "جہر یہ ہے کہ دن میں نہ دیکھے؛ اس کا سبب روح کا نہایت پتلا اور کم ہونا ہے جو آفتاب کے ضوء میں تحلیل ہو کر اندھیرے میں جمع ہوتا ہے؛ اور یہ ہلکا بھی ہو سکتا ہے کہ اندھیرے اور سائے میں دیکھے اور ضوء میں کمزور ہو؛ اس کا علاج تر کرنے میں اضافہ اور خون کو گاڑھا کرنا ہے {cite:canon-ibn-sina-print-v2 p.207}۔"
  es: "Jahr no ve de día; su causa es la delgadez y la gran escasez del espíritu, que se disuelve con la luz del sol y se acumula en la oscuridad; o puede ser leve, de modo que ve en la oscuridad y la sombra día y noche y se debilita con la luz; su tratamiento consiste en aumentar la humedad y espesar la sangre {cite:canon-ibn-sina-print-v2 p.207}"
  tr: "Gündüz göremeyenin sebebi ruhun yumuşaklığı ve çok kıtlığıdır, bu yüzden güneş ışığıyla eriyip karanlıkta toplanır. Bazen azdır, böylece karanlıkta ve gölgede görebilir, ışıkta zayıflar. Tedavisi nemi artırmak ve kanın koyulaşmasıdır {atıf:kanon-ibn-sina-print-v2 s.207}"
  id: "Alasan orang buta tidak bisa melihat di siang hari adalah kelembutan dan kelangkaan jiwa yang ekstrem, sehingga larut bersama sinar matahari dan berkumpul dalam kegelapan. Kadang-kadang jiwa rendah, sehingga bisa melihat dalam gelap dan bayangan, tetapi melemah dalam cahaya. Pengobatannya adalah meningkatkan kelembapan dan mengental darah {kutipan: kanon-ibn-sina-print-v2 hlm.207}"
