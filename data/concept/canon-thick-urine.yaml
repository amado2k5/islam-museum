summary:
  ar: "يبين ابن سينا أن الغليظ جداً يدل في الأكثر على عدم النضج وفي الأقل على نضج أخلاط غليظة، ويفرق بين ما يستفرغ دفعة وما يستفرغ قليلاً قليلاً، ويعلل كون الرقة والغلظ جميعاً يدلان على عدم النضج {cite:canon-ibn-sina-print-v1 pp.189-190}."
  en: "Ibn Sina says very thick urine mostly shows lack of ripening and less often the ripening of thick humours, distinguishes what is passed at once from what is passed little by little, and explains why both thinness and thickness show lack of ripening {cite:canon-ibn-sina-print-v1 pp.189-190}."
