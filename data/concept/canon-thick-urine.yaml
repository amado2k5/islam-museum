id: concept/canon-thick-urine
class: concept
kind: scientific
label: { ar: "البول الغليظ عند ابن سينا", en: "Thick urine in the Canon", ur: "گاڑھا پیشاب قانون میں", es: "Orina espesa en el cañón", fr: "Urine épaisse dans le Canon" }
summary:
  ar: "يبين ابن سينا أن الغليظ جداً يدل في الأكثر على عدم النضج وفي الأقل على نضج أخلاط غليظة، ويفرق بين ما يستفرغ دفعة وما يستفرغ قليلاً قليلاً، ويعلل كون الرقة والغلظ جميعاً يدلان على عدم النضج {cite:canon-ibn-sina-print-v1 pp.189-190}."
  en: "Ibn Sina says very thick urine mostly shows lack of ripening and less often the ripening of thick humours, distinguishes what is passed at once from what is passed little by little, and explains why both thinness and thickness show lack of ripening {cite:canon-ibn-sina-print-v1 pp.189-190}."
  es: "Ibn Sina dice que la orina muy espesa generalmente muestra falta de maduración y con menos frecuencia la maduración de los humores espesos, distingue lo que se expulsa de una vez de lo que se expulsa poco a poco, y explica por qué tanto la fluidez como la espeso muestran falta de maduración {cite:canon-ibn-sina-print-v1 pp.189-190}."
  fr: "Ibn Sina dit que l'urine très épaisse indique généralement un manque de maturation et, plus rarement, la maturation des humeurs épaisses, distingue ce qui est évacué d'un seul coup de ce qui est évacué petit à petit, et explique pourquoi la fluidité et l'épaisseur indiquent toutes deux un manque de maturation {cite:canon-ibn-sina-print-v1 pp.189-190}."
