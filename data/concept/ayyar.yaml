summary:
  ar: "اسم جماعات المحاربين المنظمة في العراق وفارس من القرن الثالث إلى السادس الهجري، وكانوا يتصلون بالفتوة والتصوف؛ وقد تسلطوا في بعض الأزمنة على الأغنياء في بغداد {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  en: "The name for organised bands of warriors in 'Iraq and Persia from the ninth to the twelfth century, linked with futuwwa and with Sufism; at times they ruled the wealthy of Baghdad by terror {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
