label:
  ar: "عيّار"
  en: "'Ayyar"
  fr: "'Ayyar"
  ur: "عیار"
  es: "'Ayyar"
  tr: "kalibre"
  id: "kaliber"
summary:
  ar: "اسم جماعات المحاربين المنظمة في العراق وفارس من القرن الثالث إلى السادس الهجري، وكانوا يتصلون بالفتوة والتصوف؛ وقد تسلطوا في بعض الأزمنة على الأغنياء في بغداد {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  en: "The name for organised bands of warriors in 'Iraq and Persia from the ninth to the twelfth century, linked with futuwwa and with Sufism; at times they ruled the wealthy of Baghdad by terror {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  fr: "Nom donné aux bandes organisées de guerriers en Irak et en Perse du IXe au XIIe siècle, liées à la futuwwa et au soufisme ; elles imposèrent parfois leur pouvoir par la terreur aux riches de Bagdad {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  es: "Nombre que recibían las bandas organizadas de guerreros en Irak y Persia desde el siglo IX hasta el XII, vinculadas con el futuwwa y el sufismo; en ocasiones gobernaron a los ricos de Bagdad mediante el terror {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  ur: "عراق اور فارس میں نویں سے بارہویں صدی تک جنگجوؤں کے منظم گروہ کا نام، جو فتووٰی اور تصوف سے منسلک ہیں۔ بعض اوقات انہوں نے دہشت گردی کے ذریعے بغداد کے امیروں پر حکومت کی۔ 1 ص۔ 843}۔"
  tr: "3. yüzyıldan 6. yüzyıla kadar Irak ve Pers'te düzenlenmiş organize savaşçı grupların adı, şövalyelik ve tasavvufla bağlantılıydı; zaman zaman Bağdat'taki zenginlere hakim oldular {cite:encyclopaedia-of-Islam-2 cilt 1, s. 843}."
  id: "Nama kelompok pejuang terorganisir di Irak dan Persia dari abad ke-3 hingga ke-6 H, yang terkait dengan kesatria dan sufisme; kadang-kadang, mereka mendominasi orang kaya di Baghdad {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 843}."
