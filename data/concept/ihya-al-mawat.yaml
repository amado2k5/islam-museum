id: concept/ihya-al-mawat
class: concept
kind: legal
label:
  ar: "إحياء الموات"
  en: "Ihya al-mawat (reviving dead land)"
issue:
  ar: "ما الذي يملكه المحيي بإحياء الأرض الموات: الملك التام أم المنفعة فقط؟"
summary:
  ar: "إحياء الموات عند المؤلف إعمار الأرض التي لا ينتفع بها ولا مالك لها، بالحرث أو الزرع أو الغرس أو السقي أو الحظيرة أو البناء {cite:usul-iqtisad-islami-0660 p. 224}. وتملك الأرض بالإحياء عند جمهور الفقهاء ملكية كاملة، وعند المالكية والإمامية وبعض الحنفية ملكية منفعة فقط دون تصرف {cite:usul-iqtisad-islami-0660 p. 225}. وهو مبدأ يحفز الناس إلى الاستثمار العقاري والزراعي {cite:usul-iqtisad-islami-0660 p. 202}."
wings: [objects]
themes:
- zakat-and-sadaqa
- trade-and-finance
regions:
- global
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-permission
    summary:
      ar: "يشترط أبو حنيفة إذن الإمام للمسلم والذمي على السواء في الإحياء {cite:usul-iqtisad-islami-0660 p. 224}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni-maliki
    id: maliki-use-only
    summary:
      ar: "يرى المالكية أن الإحياء لا يمنح إلا ملكية ناقصة هي الاستعمال والاستغلال دون التصرف، ويجيزون للإمام استرداد الأرض المهملة وإقطاعها لغيره، ولا تنتقل الأرض المحياة إلى الورثة {cite:usul-iqtisad-islami-0660 p. 225}. ويقصرون الإذن على الأراضي القريبة من العمران {cite:usul-iqtisad-islami-0660 p. 224}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: jumhur-full-ownership
    summary:
      ar: "يرى جمهور الفقهاء أن الإحياء يمنح المحيي ملكية كاملة: استعمالاً بنفسه، واستغلالاً بالإيجار، وتصرفاً بالبيع والهبة والإرث {cite:usul-iqtisad-islami-0660 p. 225}. ويجوز عندهم أن يوكل المحيي من يحيي عنه، باتفاق الفقهاء {cite:usul-iqtisad-islami-0660 p. 225}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: shia-twelver
    id: imami-use-only
    summary:
      ar: "يرى الإمامية أن الإحياء كالجلوس في مكان مباح، يمنح الانتفاع ما دام المحيي فيه، ولا يمنح الملك الدائم {cite:usul-iqtisad-islami-0660 p. 225}."
    sources: [source/usul-iqtisad-islami-0660]
