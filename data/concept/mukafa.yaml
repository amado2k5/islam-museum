id: concept/mukafa
class: concept
kind: legal
label: { ar: "المُكَافَأَة", en: "Reciprocity and equality (mukafa'a)", ur: "مُکافأۃ (برابری اور بدلہ)" }
summary:
  ar: "المكافأة في اللغة المجازاة والمماثلة، ومنها تتكافأ دماء المسلمين في الدية والقصاص. وتتعلق بها أحكام منها: المكافأة على الهدية، ومكافأة القاتل بالقتيل في القصاص عند المالكية والشافعية والحنابلة دون الحنفية، واشتراطها في النكاح عند الجمهور، وأثر ألفاظها في الطلاق عند المخاصمة، ومكافأة عامل القراض، والمساواة بين الخيل في السبق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
  en: "Mukafa'a means returning like for like, and in the lexicon it is equality, as in the hadith that the blood of the Muslims is equal in blood-money and retaliation. The jurists apply the notion to several matters: returning a gift with a gift, the equality of killer and victim in retaliation (required by the Malikis, Shafi'is and Hanbalis but not by the Hanafis), equality of spouses in marriage (required by most jurists), the words of a quarrel that turn into divorce, the reward for a partner in a profit-sharing contract, and equality of horses in a race. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
  ur: "مُکافأۃ کا مطلب بدلہ دینا یا برابری ہے، جیسے مسلمانوں کے خون کا برابر ہونا۔ فقہاء اسے ہدیے کے بدلے، قصاص میں قاتل و مقتول کی برابری، نکاح میں زوجین کی کفو اور دوڑ میں گھوڑوں کی برابری کے ابواب میں ذکر کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
