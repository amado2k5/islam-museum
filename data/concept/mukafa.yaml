id: concept/mukafa
class: concept
kind: legal
label: { ar: "المُكَافَأَة", en: "Reciprocity and equality (mukafa'a)", ur: "مُکافأۃ ⁦(برابری اور بدلہ)⁩", es: "Reciprocidad e igualdad (mukafa'a)", fr: "Réciprocité et égalité (mukafa'a)", tr: "Ödül", id: "Hadiah" }
summary:
  ar: "المكافأة في اللغة المجازاة والمماثلة، ومنها تتكافأ دماء المسلمين في الدية والقصاص. وتتعلق بها أحكام منها: المكافأة على الهدية، ومكافأة القاتل بالقتيل في القصاص عند المالكية والشافعية والحنابلة دون الحنفية، واشتراطها في النكاح عند الجمهور، وأثر ألفاظها في الطلاق عند المخاصمة، ومكافأة عامل القراض، والمساواة بين الخيل في السبق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
  en: "Mukafa'a means returning like for like, and in the lexicon it is equality, as in the hadith that the blood of the Muslims is equal in blood-money and retaliation. The jurists apply the notion to several matters: returning a gift with a gift, the equality of killer and victim in retaliation (required by the Malikis, Shafi'is and Hanbalis but not by the Hanafis), equality of spouses in marriage (required by most jurists), the words of a quarrel that turn into divorce, the reward for a partner in a profit-sharing contract, and equality of horses in a race. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
  ur: "مُکافأۃ کا مطلب بدلہ دینا یا برابری ہے، جیسے مسلمانوں کے خون کا برابر ہونا۔ فقہاء اسے ہدیے کے بدلے، قصاص میں قاتل و مقتول کی برابری، نکاح میں زوجین کی کفو اور دوڑ میں گھوڑوں کی برابری کے ابواب میں ذکر کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
  es: "Mukafa'a significa devolver lo mismo, y en el léxico es igualdad, como en el hadiz que dice que la sangre de los musulmanes es igual en compensación y retribución. Los juristas aplican esta noción a varios asuntos: devolver un regalo con otro, la igualdad entre asesino y víctima en la retribución (exigida por los malikíes, shafiíes y hanbalíes, pero no por los hanafíes), la igualdad de los cónyuges en el matrimonio (exigida por la mayoría de los juristas), las palabras de una disputa que desembocan en divorcio, la recompensa para un socio en un contrato de reparto de beneficios y la igualdad de los caballos en una carrera. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14926} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14927} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14928} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
  fr: "La mukafa'a signifie « rendre la pareille », et dans le langage courant, elle désigne l'égalité, comme dans le hadith selon lequel le sang des musulmans est égal en matière de compensation financière et de représailles. Les juristes appliquent cette notion à plusieurs situations: rendre un cadeau par un autre cadeau, l'égalité entre le meurtrier et la victime en matière de représailles (requise par les écoles malikite, chaféite et hanbalite, mais pas par l'école hanafite), l'égalité des époux dans le mariage (requise par la plupart des juristes), les paroles d'une dispute qui mène au divorce, la rémunération d'un associé dans un contrat de partage des bénéfices, et l'égalité des chevaux dans une course. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
  tr: "Dilbilimde ödül, karşılıklılık ve benzerliktir; bunlardan Müslümanların kanı kan parası ve intikam açısından eşdeğerdir. İlgili hükümler arasında: hediyeler için ödül, Malikiler, Şafiiler ve Hanbalilere göre katili mağdur için intikam olarak ödüllendirilmesi ancak Hanefilere göre değil, çoğunluğa göre evlilikte şart koşul, anlaşmazlıklarda boşanma üzerindeki ifadesinin etkisi, borçlu faktörü için ödül ve atlar arasında eşitlik önceliklidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14929}"
  id: "Dalam linguistik, ganjaran adalah timbal balik dan kesamaan, dan dari hal ini, darah Muslim setara dalam uang darah dan pembalasan. Putusan terkait meliputi: hadiah atas hadiah, memberi hadiah kepada pembunuh untuk korban sebagai pembalasan menurut Maliki, Shafi'i, dan Hanbali tetapi bukan Hanafi, menetapkan dalam pernikahan menurut mayoritas, efek kata-katanya terhadap perceraian dalam perselisihan, hadiah untuk faktor debitur, dan kesetaraan di antara kuda yang menjadi prioritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929}"
