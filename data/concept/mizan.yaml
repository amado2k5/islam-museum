label: { ar: "المِيزَان (معيار الوزن والمقادير)", en: "The balance (mizan) and the standards of weight and measure", ur: "میزان (وزن اور پیمائش کے معیار)" }
summary:
  ar: "الميزان إحدى الآلتين لتقدير المقدرات الشرعية، والأخرى الكيل. وباتفاق المسلمين البخس في الميزان بالتطفيف حرام، وقد توعد القرآن المطففين، واعتبر الإخلال فيهما إفساداً في الأرض. والأصل أن المعتبر في الموزونات والمكيلات ما كان مألوفاً في مكة والمدينة في عهد النبي، وتفصيل الفقهاء في ذلك مختلف: فالحنفية يقدمون النص ثم العرف، وأبو يوسف يعتبر العرف مطلقاً، والمالكية يتبعون ما ورد في الشرع ثم العادة، والشافعية يعتبرون أهل مكة والمدينة، والحنابلة يعتبرون عرف المدينة للكيل وعرف مكة للوزن. وعقوبة التطفيف لم يحددها الشرع فهي التعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15370} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15372}"
  en: "The balance (mizan) is one of the two instruments for measuring the fixed quantities of the law, the other being measure (kayl). All Muslims agree that cheating in weight is forbidden, the Qur'an threatens those who cheat, and it treats any shortfall in measure or weight as corruption on earth. The general rule is that the standard for weighed and measured goods is the usage known in Makka and Madina in the Prophet's time; the jurists differ in detail. The Hanafis follow the text first and custom next; Abu Yusuf takes custom in all cases; the Malikis follow what the law states and then custom; the Shafi'is follow the usage of Makka and Madina; the Hanbalis take Madina's usage for measure and Makka's for weight. The law fixes no punishment for cheating, so it falls under discretionary punishment (ta'zir). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15370} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15372}"
  ur: "میزان ان دو آلات میں سے ایک ہے جن سے شرعی مقداروں کا اندازہ کیا جاتا ہے، دوسرا پیمانہ (کیل) ہے۔ وزن میں کمی کرنا (تطفیف) سب مسلمانوں کے نزدیک حرام ہے۔ وزن اور پیمانے کا معیار مکہ اور مدینہ کا وہ عرف ہے جو نبی کے زمانے میں تھا، اور فقہاء کی تفصیل مختلف ہے۔ تطفیف کی سزا شرعاً مقرر نہیں، لہٰذا تعزیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15369} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15370} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15372}"
