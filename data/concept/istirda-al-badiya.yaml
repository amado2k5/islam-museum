label: { ar: "الاسترضاع في البادية", en: "Sending infants to Bedouin wet-nurses" }
summary:
  ar: "عادة أهل الحاضرة من العرب أن يلتمسوا لأولادهم المراضع في البادية، ابتعاداً بهم عن أمراض الحواضر ولتقوى أجسامهم وتشتدّ أعصابهم ويتقنوا اللسان العربي في مهدهم؛ وبها استُرضع النبي في بني سعد بن بكر عند حليمة."
  en: "The custom of the settled Arabs of seeking wet-nurses in the desert for their children, to keep them from the diseases of the towns, strengthen their bodies and nerves, and let them master pure Arabic from the cradle; by it the Prophet was nursed among Banu Sa'd ibn Bakr by Halima."
