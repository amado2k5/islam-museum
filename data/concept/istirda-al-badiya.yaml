id: concept/istirda-al-badiya
class: concept
kind: social
label: { ar: "الاسترضاع في البادية", en: "Sending infants to Bedouin wet-nurses", es: "Enviar bebés a nodrizas beduinas", fr: "Envoyer des nourrissons à des nourrices bédouines", ur: "نوزائیدہ بچوں کو بیڈوین گیلی نرسوں کے پاس بھیجنا" }
summary:
  ar: "عادة أهل الحاضرة من العرب أن يلتمسوا لأولادهم المراضع في البادية، ابتعاداً بهم عن أمراض الحواضر ولتقوى أجسامهم وتشتدّ أعصابهم ويتقنوا اللسان العربي في مهدهم؛ وبها استُرضع النبي في بني سعد بن بكر عند حليمة."
  en: "The custom of the settled Arabs of seeking wet-nurses in the desert for their children, to keep them from the diseases of the towns, strengthen their bodies and nerves, and let them master pure Arabic from the cradle; by it the Prophet was nursed among Banu Sa'd ibn Bakr by Halima."
  es: "La costumbre de los árabes asentados de buscar nodrizas en el desierto para sus hijos, para protegerlos de las enfermedades de las ciudades, fortalecer sus cuerpos y nervios, y que dominaran el árabe puro desde la cuna; de esta manera, el Profeta fue amamantado entre los Banu Sa'd ibn Bakr por Halima."
  fr: "La coutume des Arabes sédentaires de chercher des nourrices dans le désert pour leurs enfants, afin de les préserver des maladies des villes, de fortifier leur corps et leurs nerfs, et de leur permettre de maîtriser l'arabe pur dès le berceau; c'est ainsi que le Prophète fut allaité chez les Banu Sa'd ibn Bakr par Halima."
  ur: "آباد عربوں کا رواج یہ ہے کہ وہ اپنے بچوں کے لیے صحراؤں میں گیلی نرسیں ڈھونڈیں، انہیں شہروں کی بیماریوں سے محفوظ رکھیں، ان کے جسموں اور اعصاب کو مضبوط کریں اور انہیں گہوارہ سے خالص عربی پر عبور حاصل کریں۔ اس کے ذریعے نبی کو بنو سعد بن بکر کے درمیان حلیمہ نے پالا تھا۔"
