id: concept/canon-diarrhoea-at-teething
class: concept
kind: scientific
label:
  ar: "استطلاق البطن عند نبات الأسنان عند الصبيان عند ابن سينا"
  en: "Loose bowels at teething in the Canon"
  fr: "Selles relâchées à la dentition dans le Canon"
  ur: "قانون میں دانت نکلنے کے وقت دست"
  es: "Diarrea durante la dentición en el Canon"
summary:
  ar: "يذكر ابن سينا استطلاق البطن عند الصبيان وخصوصاً عند نبات الأسنان، ويعرض تعليلين، ثم تكميد البطن وتضميده، وسقي أنفحة الجدي، وتبديل الغذاء عن اللبن {cite:canon-ibn-sina-print-v1 pp.211-212}."
  en: "Ibn Sina mentions loosening of the bowels in infants, above all at teething, gives two explanations, then fomenting and poulticing the belly, a drink of kid's rennet, and a food in place of milk {cite:canon-ibn-sina-print-v1 pp.211-212}."
  fr: "Ibn Sina traite le relâchement intestinal infantile, surtout à la dentition : deux explications, fomentation et cataplasme abdominaux, présure de chevreau en boisson, puis aliment remplaçant le lait {cite:canon-ibn-sina-print-v1 pp.211-212}."
  es: "Ibn Sina menciona el ablandamiento de los intestinos en los bebés, sobre todo durante la dentición, y da dos explicaciones: luego, fomentar y aplicar cataplasmas en el vientre, una bebida de cuajo de cabrito y un alimento en lugar de leche {cite:canon-ibn-sina-print-v1 pp.211-212}."
  ur: "ابن سینا نے نوزائیدہ بچوں میں انتڑیوں کے ڈھیلے ہونے کا ذکر کیا ہے، سب سے بڑھ کر دانت نکلنے کے وقت، دو وضاحتیں پیش کی ہیں، پھر پیٹ کو جلانا اور مرغی بنانا، بچوں کے رینٹ کا مشروب، اور دودھ کی جگہ کھانا۔"
