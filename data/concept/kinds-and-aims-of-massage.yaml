id: concept/kinds-and-aims-of-massage
class: concept
kind: scientific
label: { ar: "أنواع الدلك وأغراضه عند ابن سينا", en: "The kinds and aims of massage in the Canon", ur: "قانون میں مالش کی اقسام اور مقاصد", es: "Los tipos y objetivos del masaje en el Canon", fr: "Les types et les objectifs du massage dans le Canon", tr: "İbn Sina'ya göre masaj türleri ve amaçları", id: "Jenis pijat dan tujuannya menurut Ibn Sina" }
summary:
  ar: "يفتتح ابن سينا الفصل الرابع في الدلك بتقسيمه إلى صلب يشدد ولين يرخي وكثير يهزل ومعتدل يخصب، ويركب ذلك تسعة مزاوجات، ثم إلى خشن بخرق خشنة يجذب الدم إلى الظاهر وأملس بالكف يجمعه في العضو، والغرض تكثيف المتخلخل وتصليب اللين وخلخلة الكثيف وتليين الصلب {cite:canon-ibn-sina-print-v1 p.225}."
  en: "Ibn Sina opens chapter 4, on massage, by dividing it into hard, which firms; soft, which relaxes; much, which thins; and moderate, which fattens, whose combinations give nine pairings; then into rough, with coarse cloths drawing blood quickly to the surface, and smooth, with the palm collecting it in the organ; its aim is to condense the loose, harden the soft, loosen the dense and soften the hard {cite:canon-ibn-sina-print-v1 p.225}."
  es: "Ibn Sina abre el capítulo 4, sobre el masaje, dividiéndolo en duro, que reafirma; suave, que relaja; mucho, que adelgaza; y moderado, que engorda, cuyas combinaciones dan nueve pares; luego en áspero, con paños gruesos que llevan la sangre rápidamente a la superficie, y suave, con la palma recogiéndola en el órgano; su objetivo es condensar lo suelto, endurecer lo blando, aflojar lo denso y suavizar lo duro {cite:canon-ibn-sina-print-v1 p.225}."
  fr: "Ibn Sina ouvre le chapitre 4, sur le massage, en le divisant en massage dur, qui raffermit; doux, qui détend; abondant, qui amincit; et modéré, qui engraisse, dont les combinaisons donnent neuf paires; puis en massage rugueux, avec des tissus grossiers attirant rapidement le sang à la surface, et en massage lisse, avec la paume le recueillant dans l'organe; son but est de condenser le relâché, de durcir le mou, de desserrer le dense et d'adoucir le dur {cite:canon-ibn-sina-print-v1 p.225}."
  ur: "ابن سینا نے مالش پر باب 4 کھولا، اسے سخت، کن فرموں میں تقسیم کر کے۔ نرم، جو آرام کرتا ہے؛ زیادہ، جو پتلا اور اعتدال پسند، جو فربہ ہوتا ہے، جس کے امتزاج سے نو جوڑے ہوتے ہیں۔ پھر کھردرے میں، موٹے کپڑوں کے ساتھ خون کو تیزی سے سطح پر کھینچتا ہے، اور ہموار، ہتھیلی کے ساتھ عضو میں جمع کرتا ہے۔ اس کا مقصد ڈھیلے کو گاڑھا کرنا، نرم کو سخت کرنا، گھنے کو ڈھیلا کرنا اور سخت کو نرم کرنا ہے۔"
  tr: "İbn Sina, sürtmenin dördüncü bölümüne sertleştiren, yumuşatan, gevşeden, sık sık kabaran ve ılımlı bir döllenen katı parçaya bölerek açar. Bunu dokuz çiftleşme ile birleştirir; ardından yüzeye kan çeken kaba ve kaba yarıklara, avuç içi ile pürüzsüz olan ve organda toplar. Amaç, gözenekli malzemeyi kalınlaştırmak, yumuşaklığı sertleştirmek, yoğunluğu gevşetmek ve sertliği yumuşatmaktır {cite:canon-ibn-sina-print-v1 s.225}."
  id: "Ibn Sina membuka bab keempat tentang menggosok dengan membaginya menjadi padatan yang mengencang, melembutkan, melonggarkan, sering mengembang, dan membuahkan secara moderat. Ia menggabungkan ini dengan sembilan perpaduan, lalu menjadi celah kasar dengan kasar yang menarik darah ke permukaan, halus dengan telapak tangan, yang mengumpulkannya ke dalam organ. Tujuannya adalah untuk menebalkan bahan berpori, mengeraskan kelembutan, melonggarkan kepadatan, dan melunakkan kekerasan {cite:canon-ibn-sina-print-v1 hlm.225}."
