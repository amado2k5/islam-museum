summary:
  ar: "يفتتح ابن سينا الفصل الرابع في الدلك بتقسيمه إلى صلب يشدد ولين يرخي وكثير يهزل ومعتدل يخصب، ويركب ذلك تسعة مزاوجات، ثم إلى خشن بخرق خشنة يجذب الدم إلى الظاهر وأملس بالكف يجمعه في العضو، والغرض تكثيف المتخلخل وتصليب اللين وخلخلة الكثيف وتليين الصلب {cite:canon-ibn-sina-print-v1 p.225}."
  en: "Ibn Sina opens chapter 4, on massage, by dividing it into hard, which firms; soft, which relaxes; much, which thins; and moderate, which fattens, whose combinations give nine pairings; then into rough, with coarse cloths drawing blood quickly to the surface, and smooth, with the palm collecting it in the organ; its aim is to condense the loose, harden the soft, loosen the dense and soften the hard {cite:canon-ibn-sina-print-v1 p.225}."
