label:
  ar: "مثل «الصيف ضيعت اللبن»"
  en: "The proverb 'In summer you wasted the milk'"
  ur: "مثل «الصیف ضیعت اللبن»"
  fr: "Le proverbe « En été tu as perdu le lait »"
  es: "El proverbio «En verano desperdiciaste la leche»"
  tr: "Mesela \"Summer sütü boşa harcadı\" gibi"
  id: "Seperti \"Musim panas membuang-buang susu\""
summary:
  ar: "مثل يُضرب لمن يطلب الشيء بعد أن فوّت وقته، وقصته أن امرأة طلبت الطلاق من شيخ مسن ثم أرسلت إليه تطلب لبناً في القحط فرفض {cite:arrafid-article-amthal-stories}."
  en: "A proverb for one who asks for a thing after letting its time pass; its tale is of a woman who asked an old man for divorce and later sent to him for milk in a drought, and was refused {cite:arrafid-article-amthal-stories}."
  ur: "وہ مثل جو وقت گنوا کر چیز مانگنے والے کے لیے کہی جاتی ہے؛ اس کا قصہ ایک عورت کا ہے جس نے بوڑھے سے طلاق مانگی اور قحط میں اس سے دودھ مانگا تو انکار ہوا {cite:arrafid-article-amthal-stories}۔"
  fr: "Proverbe dit de qui réclame une chose après en avoir laissé passer le temps ; son histoire est celle d'une femme qui demanda le divorce à un vieil homme puis lui réclama du lait pendant la sécheresse et fut refusée {cite:arrafid-article-amthal-stories}."
  es: "Proverbio que se dice de quien pide algo tras dejar pasar su tiempo; su relato es el de una mujer que pidió el divorcio a un anciano y luego le pidió leche en la sequía y fue rechazada {cite:arrafid-article-amthal-stories}."
  tr: "Bir şeyi zamanı geçtikten sonra arayan biri için verilen bir alegori; hikayesi, bir kadının yaşlı bir adamdan boşanmak istediği ve kuraklık sırasında ona süt istemesini gönderdiği, ancak adamın reddettiği anlatılır."
  id: "Sebuah perumpamaan yang diberikan untuk seseorang yang mencari sesuatu setelah waktunya berlalu, dan ceritanya adalah seorang wanita meminta cerai dari seorang pria tua lalu mengirimnya meminta susu saat kekeringan, tetapi dia menolak."
