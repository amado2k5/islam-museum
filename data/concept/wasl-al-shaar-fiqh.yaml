id: concept/wasl-al-shaar-fiqh
class: concept
kind: legal
label: { ar: "وَصْل الشَّعر", en: "Wasl al-sha'r (hair extensions: the ruling on joining hair)" }
summary:
  ar: "الواصلة اسم فاعل لفعل وصل، وهي المرأة التي تصل شعرها بشعر غيرها، والمستوصلة التي يُفعل بها ذلك بطلبها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} وذهب جمهور الفقهاء إلى حرمة وصل الشعر بشعر الآدمي، سواء كان شعر امرأة أو رجل، لحديث أسماء بنت أبي بكر وحديث ابن عمر وحديث معاوية، ولأن شعر الآدمي محترم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} وفي رأي عند الحنفية وقول عند الحنابلة يكره وصل الشعر بشعر الآدمي، وفي قول عند الحنابلة يجوز بإذن الزوج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} وفي وصل الشعر بشعر البهيمة اختلف الفقهاء: فأجازه الحنفية وقول عند الحنابلة، وحرّمه المالكية والمذهب عند الحنابلة، وفصّل الشافعية بين النجس والطاهر وبين ذات الزوج وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} وأجاز الحنفية والحنابلة في المذهب وصل الشعر بغير الشعر كالخرقة، ومنعه المالكية، ورويت الإجازة عن ابن عباس وأم سلمة وعائشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} وقال المالكية إن حرمة الوصل لا تقتصر على النساء، لأن فيه تغييراً لخلق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603}"
  en: "A wasila is a woman who joins her hair to another's, and a mustawsila is one for whom this is done at her request. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} The majority hold joining human hair forbidden, whether a woman's or a man's, on the reports of Asma bint Abi Bakr, Ibn Umar and Mu'awiya, since human hair is held in honour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} A Hanafi view and a Hanbali view dislike it, and one Hanbali view permits it with the husband's leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} On joining animal hair the jurists differ: the Hanafis and one Hanbali view allow it, the Malikis and the Hanbali school forbid it, and the Shafi'is distinguish clean from unclean hair and a married woman from an unmarried one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} On joining with material other than hair, such as cloth, the Hanafis and Hanbalis allow it, the Malikis forbid it, and the permission is attributed to Ibn Abbas, Umm Salama and Aisha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} The Malikis hold the prohibition is not limited to women, since it alters God's creation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603}"
