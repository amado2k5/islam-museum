label: { ar: "وَصْل الشَّعر", en: "Wasl al-sha'r (hair extensions: the ruling on joining hair)", es: "Wasl al-sha'r (extensiones de cabello: la norma sobre la unión del cabello)", fr: "Wasl al-sha'r (extensions de cheveux: la règle concernant l'assemblage des cheveux)", ur: "وصال الشعر ⁦(بالوں کو بڑھانا: بال جوڑنے کا حکم)⁩", tr: "Saç uzantıları", id: "Ekstensi rambut" }
summary:
  ar: "الواصلة اسم فاعل لفعل وصل، وهي المرأة التي تصل شعرها بشعر غيرها، والمستوصلة التي يُفعل بها ذلك بطلبها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} وذهب جمهور الفقهاء إلى حرمة وصل الشعر بشعر الآدمي، سواء كان شعر امرأة أو رجل، لحديث أسماء بنت أبي بكر وحديث ابن عمر وحديث معاوية، ولأن شعر الآدمي محترم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} وفي رأي عند الحنفية وقول عند الحنابلة يكره وصل الشعر بشعر الآدمي، وفي قول عند الحنابلة يجوز بإذن الزوج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} وفي وصل الشعر بشعر البهيمة اختلف الفقهاء: فأجازه الحنفية وقول عند الحنابلة، وحرّمه المالكية والمذهب عند الحنابلة، وفصّل الشافعية بين النجس والطاهر وبين ذات الزوج وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} وأجاز الحنفية والحنابلة في المذهب وصل الشعر بغير الشعر كالخرقة، ومنعه المالكية، ورويت الإجازة عن ابن عباس وأم سلمة وعائشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} وقال المالكية إن حرمة الوصل لا تقتصر على النساء، لأن فيه تغييراً لخلق الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603}"
  en: "A wasila is a woman who joins her hair to another's, and a mustawsila is one for whom this is done at her request. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} The majority hold joining human hair forbidden, whether a woman's or a man's, on the reports of Asma bint Abi Bakr, Ibn Umar and Mu'awiya, since human hair is held in honour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} A Hanafi view and a Hanbali view dislike it, and one Hanbali view permits it with the husband's leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} On joining animal hair the jurists differ: the Hanafis and one Hanbali view allow it, the Malikis and the Hanbali school forbid it, and the Shafi'is distinguish clean from unclean hair and a married woman from an unmarried one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} On joining with material other than hair, such as cloth, the Hanafis and Hanbalis allow it, the Malikis forbid it, and the permission is attributed to Ibn Abbas, Umm Salama and Aisha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} The Malikis hold the prohibition is not limited to women, since it alters God's creation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603}"
  es: "Una wasila es una mujer que une su cabello al de otra, y una mustawsila es aquella para quien esto se hace a petición suya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} La mayoría sostiene que unir cabello humano está prohibido, ya sea de una mujer o de un hombre, según los informes de Asma bint Abi Bakr, Ibn Umar y Mu'awiya, ya que el cabello humano se considera honorable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} Una visión hanafí y una visión hanbalí lo desaprueban, y una visión hanbalí lo permite con el permiso del marido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} Sobre la unión con pelo de animal, los juristas difieren: los Hanafis y una visión Hanbali lo permiten, los Malikis y la escuela Hanbali lo prohíben, y los Shafi'is distinguen entre cabello limpio e impuro y entre una mujer casada y una soltera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} Sobre la unión con material distinto del cabello, como tela, los Hanafis y los Hanbalis lo permiten, los Malikis lo prohíben, y el permiso se atribuye a Ibn Abbas, Umm Salama y Aisha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} Los Malikis sostienen que la prohibición no se limita a las mujeres, ya que altera la creación de Dios. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603}"
  fr: "Une wasila est une femme qui joint ses cheveux à ceux d'une autre, et une mustawsila est une femme à qui cela est fait à sa demande. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} La majorité considère que joindre les cheveux humains, qu'ils soient de femme ou d'homme, est interdit, se basant sur les hadiths d'Asma bint Abi Bakr, d'Ibn Umar et de Mu'awiya, car les cheveux humains sont considérés comme sacrés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} Une opinion hanafite et une opinion hanbalite s'y opposent, tandis qu'une opinion hanbalite l'autorise avec le consentement du mari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} Concernant l'utilisation de poils d'animaux, les juristes divergent: les hanafites et une école hanbalite l'autorisent, les malikites et l'école hanbalite l'interdisent, et les chaféites font la distinction entre cheveux purs et impurs, et entre cheveux d'une femme mariée et cheveux d'une femme célibataire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} Concernant l'utilisation d'autres matières que les cheveux, comme le tissu, les hanafites et les hanbalites l'autorisent, les malikites l'interdisent, et cette permission est attribuée à Ibn Abbas, Umm Salama et Aïcha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} Les Malikis estiment que l'interdiction ne se limite pas aux femmes, car elle altère la création de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603}"
  ur: "وصیلہ وہ عورت ہے جو اپنے بالوں کو دوسرے کے بالوں سے جوڑتی ہے اور مستوصیلہ وہ ہے جس کے لیے یہ اس کے کہنے پر کیا جاتا ہے۔ اسماء بنت ابی بکر، ابن عمر اور معاویہ م کی روایتوں کے مطابق جمہور انسانی بالوں کا جڑنا حرام سمجھتے ہیں، خواہ عورت کے ہو یا مرد کے، کیونکہ انسانی بالوں کی تعظیم کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16601} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16602} ایک حنفی قول اور ایک حنبلی اس کو ناپسند کرتا ہے اور ایک حنبلی قول شوہر کی رخصت سے اس کی اجازت دیتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16602} جانوروں کے بال جوڑنے میں فقہاء کا اختلاف ہے: حنفیہ اور ایک حنبلی اس کی اجازت دیتے ہیں، مالکی اور حنبلی اس سے منع کرتے ہیں، اور شافعی ناپاک بالوں سے پاک اور شادی شدہ عورت کو غیر شادی شدہ سے ممتاز کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16602} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16603} بالوں کے علاوہ کسی اور چیز کے جوڑنے پر، جیسے کہ کپڑا، حنفیہ اور حنبلی اس کی اجازت دیتے ہیں، مالکیہ اس سے منع کرتے ہیں، اور عباسی کی طرف سے سلم کی طرف منسوب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16602} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16603} مالکیوں کا خیال ہے کہ ممانعت صرف عورتوں تک محدود نہیں ہے، کیونکہ یہ خدا کی تخلیق کو بدل دیتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16603}"
  tr: "\"Vasila\" ⁦(والسيلة)⁩ terimi, \"wasala\" ⁦(وصل)⁩ fiilinin aktif ortacıdır ve bir kadının başkasının saçına saç eklemesini ifade ederken, \"mustawsilah\" ⁦(مستوصلة)⁩ ise bu işlemin kendi isteği üzerine kendisine yapılmasını ifade eder. Çoğu âlim, insan saçına, ister kadın ister erkek olsun, saç eklemenin, Esma bint Ebu Bekir, İbn Ömer ve Muaviye hadislerine dayanarak ve insan saçının kutsal sayılması nedeniyle haram olduğunu savunmaktadır. Bununla birlikte, bazı Hanefi âlimler ve bazı Hanbeli âlimler, insan saçına saç eklemenin mekruh olduğunu savunurken, Hanbeli mezhebi içindeki bazı âlimler ise kocanın izniyle buna izin vermektedir. Hayvan kılından saç uzatma kullanımı konusunda âlimler arasında görüş ayrılığı vardır: Hanefiler buna izin vermiş, Hanbeliler arasında da bir görüş birliği mevcuttur. Malikiler ise bunu yasaklamış, Hanbeliler de kendileri yasaklamıştır. Şafiîler ise ham ve ham hayvanlar arasında, evli ve evli olmayan hayvanlar arasında ayrım yapmışlardır. Hanefiler ve Hanbeliler, saç uzatma için kıldan başka malzemeler, örneğin kumaş gibi malzemeler kullanılmasına izin vermişlerdir. Malikiler ise bunu yasaklamış, İbn Abbas, Ümmü Seleme ve Ayşe'den de buna izin verildiği rivayet edilmiştir. Malikiler, saç uzatma yasağının sadece kadınlarla sınırlı olmadığını, çünkü bunun Tanrı'nın yaratılışını değiştirmek anlamına geldiğini söylemişlerdir."
  id: "Istilah \"wasila\" ⁦(والسيلة)⁩ adalah partisip aktif dari kata kerja \"wasala\" ⁦(وصل)⁩, yang merujuk pada seorang wanita yang menambahkan rambut pada rambut orang lain, dan \"mustawsilah\" ⁦(مستوصلة)⁩ adalah orang yang rambutnya ditambahkan atas permintaannya. Mayoritas ulama berpendapat bahwa menambahkan rambut pada rambut manusia, baik wanita maupun pria, adalah haram, berdasarkan hadits Asma binti Abi Bakr, Ibnu Umar, dan Muawiyah, dan karena rambut manusia dianggap suci. Namun, sebagian ulama Hanafi dan sebagian ulama Hanbali berpendapat bahwa menambahkan rambut pada rambut manusia adalah makruh (tidak disukai), sementara sebagian ulama Hanbali lainnya memperbolehkannya dengan izin suami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} Mengenai penggunaan bulu hewan untuk ekstensi rambut, para ulama berbeda pendapat: mazhab Hanafi memperbolehkannya, dan ada satu pendapat di kalangan mazhab Hanbali. Mazhab Maliki melarangnya, begitu pula mazhab Hanbali sendiri. Mazhab Syafi'i membedakan antara hewan najis dan suci, serta antara hewan yang sudah menikah dan yang belum menikah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16603} Mazhab Hanafi dan Hanbali memperbolehkan ekstensi rambut menggunakan bahan selain rambut, seperti kain. Mazhab Maliki melarangnya, dan izin untuk ini diriwayatkan dari Ibnu Abbas, Umm Salama, dan Aisyah. Mazhab Maliki mengatakan bahwa larangan ekstensi rambut tidak terbatas pada wanita saja, karena hal itu melibatkan pengubahan ciptaan Tuhan."
