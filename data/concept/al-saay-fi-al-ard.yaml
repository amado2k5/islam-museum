  en: Seeking bounty in the land (sa'y fi al-ard)
summary:
  ar: "يقرن قعدات السعي في الأرض بالعمل الإنتاجي، ويرى أن الانتشار في الأرض بعد الصلاة أمر بالعمل والإنتاج لا بالتجارة والاستيراد وحدهما {cite:qadan-manhaj-iqtisad-quran p. 65}. ويعدّ الوقت المنفق في الصلاة والشكر فترة للراحة والتأمل لا يضيع {cite:qadan-manhaj-iqtisad-quran p. 39}. ويقسم العمل إلى يدوي وعقلي وآلي {cite:qadan-manhaj-iqtisad-quran p. 52}، ويعدّ التخصص والتدريب المستمر سبيلين إلى رفع الكفاية الإنتاجية {cite:qadan-manhaj-iqtisad-quran p. 53}{cite:qadan-manhaj-iqtisad-quran p. 54}."
