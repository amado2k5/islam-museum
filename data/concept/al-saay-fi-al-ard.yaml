id: concept/al-saay-fi-al-ard
class: concept
kind: ethical
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: السعي في الأرض
  en: Seeking bounty in the land (sa'y fi al-ard)
  es: "Buscando riquezas en la tierra (sa'y fi al-ard)"
  fr: "Chercher les richesses du pays (sa'y fi al-ard)"
  ur: "زمین میں فضل تلاش کرنا ⁦(سعی فی الارد)⁩"
  tr: "Toprakta Arama"
  id: "Pencarian Tanah"
summary:
  ar: "يقرن قعدات السعي في الأرض بالعمل الإنتاجي، ويرى أن الانتشار في الأرض بعد الصلاة أمر بالعمل والإنتاج لا بالتجارة والاستيراد وحدهما {cite:qadan-manhaj-iqtisad-quran p. 65}. ويعدّ الوقت المنفق في الصلاة والشكر فترة للراحة والتأمل لا يضيع {cite:qadan-manhaj-iqtisad-quran p. 39}. ويقسم العمل إلى يدوي وعقلي وآلي {cite:qadan-manhaj-iqtisad-quran p. 52}، ويعدّ التخصص والتدريب المستمر سبيلين إلى رفع الكفاية الإنتاجية {cite:qadan-manhaj-iqtisad-quran p. 53}{cite:qadan-manhaj-iqtisad-quran p. 54}."
  tr: "Yeryüzünde arama aşamalarını üretken işle ilişkilendirir ve dua sonrası yeryüzünde yayılmanın sadece ticaret ve ithalat değil, iş ve üretimi emrettiğine inanır. Dua ve şükran için harcanan zaman, boşa harcanmayan dinlenme ve düşünme zamanı olarak kabul edilir {cite:qadan-manhaj-iqtisad-kur'an s. 39}. İş, manuel, zihinsel ve mekanik olarak ikiye ayrılır {cite:qadan-manhaj-iqtisad-kur'an s. 52} ve uzmanlaşma ile sürekli eğitim verimliliği artırmanın iki yoludur {cite:qadan-manhaj-iqtisad-qur'an s. 53}."
  id: "Buku ini mengaitkan tahapan pencarian di bumi dengan pekerjaan produktif dan percaya bahwa ekspansi pasca-shalat di bumi tidak hanya memerintah perdagangan dan impor, tetapi juga pekerjaan dan produksi. Waktu yang dihabiskan untuk doa dan syukur dianggap sebagai waktu untuk istirahat dan refleksi, bukan terbuang sia-sia {cite:qadan-manhaj-iqtisad-qur'an hlm. 39}. Pekerjaan dibagi menjadi manual, mental, dan mekanik {cite:qadan-manhaj-iqtisad-qur'an hlm. 52} dan merupakan dua cara untuk meningkatkan produktivitas melalui spesialisasi dan pendidikan berkelanjutan {cite:qadan-manhaj-iqtisad-qur'an hlm. 53}."
