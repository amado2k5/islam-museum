id: concept/zij-sabi-parallax-in-latitude-and-longitude-by-the-horizon
class: concept
kind: scientific
label: { ar: "اختلاف المنظر في العرض والطول بحسب الأفق", en: "Parallax in latitude and longitude according to the horizon", ur: "افق کے لحاظ سے اختلافِ منظر طول اور عرض میں", es: "Paralaje en latitud y longitud según el horizonte", fr: "Parallaxe en latitude et en longitude par rapport à l'horizon" }
summary:
  ar: "يبيّن البتاني أن اختلاف المنظر يقع في الارتفاع وحده دون الطول إذا كان الجزء الغارب من فلك البروج، أي على نصف الدائرة، ولا يكون على خط وسط السماء إلا في نقطتي المنقلبين، وفي غيرهما يميل اختلاف المنظر في العرض والطول بحسب زاوية الفلك مع الأفق. {cite:zij-sabi-nallino-byblion p.115}."
  en: "Al-Battani shows that the parallax falls in altitude only, and not in longitude, when the setting part of the zodiac is opposite, that is half a circle away. It lies on the mid-heaven line only at the two solstitial points; elsewhere the parallax in latitude and longitude tilts according to the angle of the zodiac with the horizon. {cite:zij-sabi-nallino-byblion p.115}."
  ur: "البتانی دکھاتے ہیں کہ اختلافِ منظر صرف ارتفاع میں ہوتا ہے، طول میں نہیں، جب بروجی فلک کا غروب ہونے والا جزو مقابل ہو یعنی نصف دائرے کے فاصلے پر؛ یہ وسط السماء کی لکیر پر صرف دو انقلابی نقطوں پر ہوتا ہے، اور باقی جگہوں پر عرض اور طول میں افق کے ساتھ فلک کے زاویے کے مطابق جھکتا ہے۔ {cite:zij-sabi-nallino-byblion p.115}۔"
  es: "Al-Battani demuestra que la paralaje se produce únicamente en altitud, y no en longitud, cuando la parte poniente del zodíaco se encuentra en el lado opuesto, es decir, a media circunferencia de distancia. Coincide con la línea del medio cielo solo en los dos solsticios; en otros puntos, la paralaje en latitud y longitud se inclina según el ángulo del zodíaco con el horizonte. {cite:zij-sabi-nallino-byblion p.115}."
  fr: "Al-Battani démontre que la parallaxe diminue uniquement en altitude, et non en longitude, lorsque la partie du zodiaque où se couche est opposée, c'est-à-dire à un demi-cercle de distance. Elle se situe sur la ligne du milieu du ciel uniquement aux deux points solsticiaux; ailleurs, la parallaxe en latitude et en longitude s'incline en fonction de l'angle du zodiaque avec l'horizon. {cite:zij-sabi-nallino-byblion p.115}."
