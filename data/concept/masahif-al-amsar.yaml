id: concept/masahif-al-amsar
class: concept
kind: term
label:
  ar: المصاحف العثمانية والمصحف الإمام ومصاحف الأمصار
  en: "The Uthmanic codices: the Imam codex and the codices of the garrison cities"
  ur: "مصاحفِ عثمانیہ: مصحفِ امام اور شہروں کے مصاحف"
  es: "Los códices utmánicos: el códice del imán y los códices de las ciudades guarnición."
  fr: "Les codex uthmaniens: le codex de l’Imam et les codex des villes de garnison"
summary:
  ar: "نسخ عثمان من صحف أبي بكر عدة مصاحف أرسل إلى الأمصار منها وأمسك الإمام لنفسه؛ والمشهور أنها خمسة، وقيل أربعة وقيل سبعة وقيل ستة وثمانية، ولم يصح في عددها شيء كما يقول خالد السبت {cite:itqan-suyuti p. 393} {cite:manahil-irfan-sabt p. 325}."
  en: "Uthman had several codices copied from Abu Bakr's leaves, sent them to the garrison cities and kept the Imam for himself; the best-known number is five, with others saying four, six, seven or eight, and as Khalid al-Sabt says nothing sound is established about the number {cite:itqan-suyuti p. 393} {cite:manahil-irfan-sabt p. 325}."
  ur: "عثمان نے ابو بکر کے اوراق سے کئی مصاحف نقل کرائے، کچھ شہروں کو بھیجے اور امام اپنے پاس رکھا؛ مشہور تعداد پانچ ہے، اور چار، چھ، سات اور آٹھ بھی کہی گئیں، اور جیسا کہ خالد السبت کہتے ہیں تعداد کے بارے میں کوئی صحیح روایت ثابت نہیں {cite:itqan-suyuti p. 393} {cite:manahil-irfan-sabt p. 325}۔"
  es: "Uthman mandó copiar varios códices de las hojas de Abu Bakr, los envió a las ciudades guarnición y se quedó con el Imam para sí mismo; el número más conocido es cinco, mientras que otros dicen cuatro, seis, siete u ocho, y como dice Khalid al-Sabt, no hay nada sólido establecido sobre el número {cite:itqan-suyuti p. 393} {cite:manahil-irfan-sabt p. 325}."
  fr: "Uthman fit copier plusieurs codex à partir des feuilles d'Abu Bakr, les envoya aux villes de garnison et garda l'Imam pour lui-même; le nombre le plus connu est cinq, d'autres disant quatre, six, sept ou huit, et comme le dit Khalid al-Sabt, rien de solide n'est établi à ce sujet {cite:itqan-suyuti p. 393} {cite:manahil-irfan-sabt p. 325}."
