id: concept/uzla
class: concept
kind: ethical
label:
  ar: "العُزْلة"
  en: "Withdrawal from people (uzla)"
  ur: "عزلت"
summary:
  ar: "العزلة في اللغة اسم من الاعتزال، وهو تجنب الشيء بالبدن أو بالقلب، وفي الاصطلاح الخروج عن مخالطة الخلق بالانزواء والانقطاع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. وتفترق عن الخلوة، وهي انفراد الإنسان بنفسه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. والعلماء متفقون على أن العزلة أفضل عند ظهور الفتن وفساد الناس، إلا من كان قادراً على إزالة الفتنة فيجب عليه السعي فيها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. وفي غير أيام الفتنة اختلفوا، فرأى أكثر الفقهاء والمحدثين أن المخالطة مع السلامة من الشر أفضل، وذهب قوم إلى تفضيل العزلة لما فيها من السلامة، ويختلف الحكم باختلاف الأشخاص {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592}. وللعزلة فوائد، منها التفرغ للعبادة والسلامة من المعاصي التي تقع غالباً في المخالطة، وآفات، منها فوات ما يُستفاد من الاستعانة بالغير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11594}. وذكر أهل التصوف آداباً للمعتزل، ومنها أن يعتقد سلامة الناس من شره لا سلامته من شرهم، وأن يترك الخصال المذمومة، وأن يكون مع الناس في الخير وبمعزل عنهم في الشر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11593}."
  en: "In the lexicon, uzla is a noun from i'tizal, avoiding a thing with the body or the heart; as a technical term it is withdrawal from mixing with people by seclusion and cutting off {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. It differs from khalwa, being alone with oneself {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. Scholars agree that withdrawal is better in times of trial and corruption, unless one can remove the trial, in which case one must strive to remove it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. Outside such times they differ: most jurists and hadith scholars prefer mixing with people while being safe from their harm, while some prefer withdrawal for its safety, and the ruling varies with the person {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592}. Withdrawal has benefits, such as devotion and avoiding the sins that company often brings, and a loss, namely the benefits that come from help of others {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11594}. Writers on spirituality give etiquette for the one who withdraws, including wishing others safety from one's own evil rather than one's safety from theirs, and leaving blameworthy traits {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11593}."
