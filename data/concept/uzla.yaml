id: concept/uzla
class: concept
kind: ethical
label:
  ar: "العُزْلة"
  en: "Withdrawal from people (uzla)"
  ur: "عزلت"
  es: "Retirada de la gente (uzla)"
  fr: "Retrait des personnes (uzla)"
summary:
  ar: "العزلة في اللغة اسم من الاعتزال، وهو تجنب الشيء بالبدن أو بالقلب، وفي الاصطلاح الخروج عن مخالطة الخلق بالانزواء والانقطاع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. وتفترق عن الخلوة، وهي انفراد الإنسان بنفسه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. والعلماء متفقون على أن العزلة أفضل عند ظهور الفتن وفساد الناس، إلا من كان قادراً على إزالة الفتنة فيجب عليه السعي فيها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. وفي غير أيام الفتنة اختلفوا، فرأى أكثر الفقهاء والمحدثين أن المخالطة مع السلامة من الشر أفضل، وذهب قوم إلى تفضيل العزلة لما فيها من السلامة، ويختلف الحكم باختلاف الأشخاص {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592}. وللعزلة فوائد، منها التفرغ للعبادة والسلامة من المعاصي التي تقع غالباً في المخالطة، وآفات، منها فوات ما يُستفاد من الاستعانة بالغير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11594}. وذكر أهل التصوف آداباً للمعتزل، ومنها أن يعتقد سلامة الناس من شره لا سلامته من شرهم، وأن يترك الخصال المذمومة، وأن يكون مع الناس في الخير وبمعزل عنهم في الشر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11593}."
  en: "In the lexicon, uzla is a noun from i'tizal, avoiding a thing with the body or the heart; as a technical term it is withdrawal from mixing with people by seclusion and cutting off {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. It differs from khalwa, being alone with oneself {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. Scholars agree that withdrawal is better in times of trial and corruption, unless one can remove the trial, in which case one must strive to remove it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. Outside such times they differ: most jurists and hadith scholars prefer mixing with people while being safe from their harm, while some prefer withdrawal for its safety, and the ruling varies with the person {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592}. Withdrawal has benefits, such as devotion and avoiding the sins that company often brings, and a loss, namely the benefits that come from help of others {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11594}. Writers on spirituality give etiquette for the one who withdraws, including wishing others safety from one's own evil rather than one's safety from theirs, and leaving blameworthy traits {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11593}."
  es: "En el léxico, uzla es un sustantivo derivado de i'tizal, que significa evitar algo con el cuerpo o el corazón; como término técnico, se refiere al retraimiento y aislamiento de la gente {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. Se diferencia de khalwa, que significa estar a solas con uno mismo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. Los eruditos coinciden en que el retraimiento es mejor en tiempos de prueba y corrupción, a menos que se pueda eliminar la prueba, en cuyo caso se debe esforzar por eliminarla {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11590}. Fuera de esos momentos difieren: la mayoría de los juristas y eruditos del hadiz prefieren mezclarse con la gente estando a salvo de su daño, mientras que algunos prefieren el aislamiento por su seguridad, y la decisión varía según la persona {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592}. El aislamiento tiene beneficios, como la devoción y evitar los pecados que a menudo trae la compañía, y una pérdida, a saber, los beneficios que provienen de la ayuda de los demás {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11594}. Los escritores sobre espiritualidad dan normas de etiqueta para quien se retira, incluyendo desear a los demás seguridad frente a la propia maldad en lugar de la propia seguridad frente a la de ellos, y dejar atrás rasgos censurables {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11593}."
  fr: "Dans le lexique, uzla est un nom dérivé de i'tizal, signifiant éviter quelque chose par le corps ou le cœur; en tant que terme technique, il désigne le retrait de la vie sociale par l'isolement et la rupture des liens (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11590). Cela diffère de khalwa, le fait d'être seul avec soi-même (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11590). Les savants s'accordent à dire que le retrait est préférable en période d'épreuve et de corruption, à moins que l'on puisse éviter l'épreuve, auquel cas il faut s'efforcer de l'éliminer (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11590). En dehors de ces périodes, les avis divergent: la plupart des juristes et des spécialistes du hadith préconisent de se mêler aux autres tout en se protégeant de leurs agissements néfastes, tandis que d’autres privilégient le retrait pour des raisons de sécurité. La décision varie selon les individus {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592}. Le retrait présente des avantages, tels que la dévotion et l’évitement des péchés souvent engendrés par la fréquentation, mais aussi une perte, à savoir la privation des bienfaits liés à l’aide d’autrui {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11594}. Les auteurs sur la spiritualité donnent des conseils à celui qui se retire, notamment celui de souhaiter la sécurité des autres face à son propre mal plutôt que sa propre sécurité face au leur, et de laisser derrière soi des traits blâmables {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11593}."
  ur: "لغت میں ازلا اعتکاف سے ایک اسم ہے، جسم یا دل کے ساتھ کسی چیز سے گریز کرنا۔ ایک تکنیکی اصطلاح کے طور پر یہ خلوت کے ذریعے لوگوں کے ساتھ گھل مل جانے سے دستبردار ہو جاتا ہے اور منقطع ہو جاتا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11590}۔ یہ خلوہ سے مختلف ہے، اپنے آپ کے ساتھ تنہا ہونا {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11590}۔ علماء اس بات پر متفق ہیں کہ آزمائش اور بدعنوانی کے دور میں دستبرداری بہتر ہے، جب تک کہ کوئی آزمائش کو ختم نہ کر سکے، ایسی صورت میں اسے دور کرنے کی کوشش کرنی چاہیے۔ اس طرح کے اوقات سے باہر ان میں اختلاف ہے: اکثر فقہاء اور محدثین اہل حدیث کے نقصانات سے محفوظ رہتے ہوئے لوگوں کے ساتھ گھل مل جانے کو ترجیح دیتے ہیں، جب کہ کچھ اس کی حفاظت کے لیے دستبرداری کو ترجیح دیتے ہیں، اور اس کا حکم فرد کے لحاظ سے مختلف ہوتا ہے۔ دستبرداری کے فائدے ہیں، جیسے عقیدت اور ان گناہوں سے بچنا جو کمپنی اکثر کرتی ہیں، اور نقصان، یعنی وہ فائدے جو دوسروں کی مدد سے حاصل ہوتے ہیں۔ روحانیت کے مصنفین پیچھے ہٹنے والے کے لیے آداب بتاتے ہیں، جس میں دوسروں کی حفاظت کی بجائے اپنی برائی سے حفاظت کی خواہش کرنا، اور قابل ملامت خصلتوں کو چھوڑنا بھی شامل ہے"
