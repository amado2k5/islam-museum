id: concept/jonud-rabbik-la-yalamuha-illa-huwa
class: concept
kind: term
label: { ar: "جنود ربك لا يعلمها إلا هو", en: "The hosts of your Lord, known to none but Him", ur: "تمہارے رب کے لشکر جنہیں اس کے سوا کوئی نہیں جانتا", es: "Los ejércitos de tu Señor, conocidos solo por Él.", fr: "Les armées de ton Seigneur, connues de nul autre que Lui", tr: "Efendinin askerleri bunu sadece bilir", id: "Para prajurit Tuhanmu hanya yang tahu" }
summary:
  ar: "تقول آية المدثر 74:31 إن جنود الرب لا يعلمهم إلا هو، في سياق خزنة النار؛ يفسّره القرطبي بملائكة الرب ردّاً على أبي جهل، ويقول ابن كثير إن عددهم وكثرتهم لا يعلمهما إلا الله ويردّ حصرهم في تسعة عشر أو في عقول ونفوس، ويستشهد بحديث أبي ذر في أن السماء ما فيها موضع أربع أصابع إلا وملك ساجد، وقال الترمذي: حسن غريب. {cite:tafsir-qurtubi-quran-com on 74:31} {cite:tafsir-ibn-kathir on 74:31} {cite:jami-al-tirmidhi 2312}"
  en: "Al-Muddaththir 74:31 says none knows the hosts of the Lord but He, in the setting of the keepers of the Fire. Al-Qurtubi explains it as the Lord's angels, answering Abu Jahl; Ibn Kathir says only God knows their number and multitude, rejects limiting them to nineteen or to intellects and souls, and cites Abu Dharr's hadith that there is not four fingers' room in the heaven without an angel in prostration, which al-Tirmidhi called hasan gharib. {cite:tafsir-qurtubi-quran-com on 74:31} {cite:tafsir-ibn-kathir on 74:31} {cite:jami-al-tirmidhi 2312}"
  ur: "سورۂ مدثر 74:31 کہتی ہے کہ رب کے لشکروں کو اس کے سوا کوئی نہیں جانتا، جہنم کے نگرانوں کے سیاق میں۔ قرطبی اسے رب کے فرشتے سمجھتے ہیں اور ابو جہل کا جواب؛ ابن کثیر کہتے ہیں کہ ان کی تعداد اور کثرت اللہ ہی جانتا ہے، انہیں انیس یا عقول و نفوس میں محدود کرنے کا رد کرتے ہیں، اور ابو ذر کی حدیث پیش کرتے ہیں کہ آسمان میں چار انگلیوں کی جگہ بھی نہیں مگر ایک فرشتہ سجدے میں ہے، جسے ترمذی نے حسن غریب کہا۔ {cite:tafsir-qurtubi-quran-com on 74:31} {cite:tafsir-ibn-kathir on 74:31} {cite:jami-al-tirmidhi 2312}"
  es: "Al-Muddaththir 74:31 dice que nadie conoce las huestes del Señor sino Él, en la disposición de los guardianes del Fuego. Al-Qurtubi lo explica como los ángeles del Señor, respondiendo a Abu Jahl; Ibn Kathir dice que solo Dios conoce su número y multitud, rechaza limitarlos a diecinueve o a intelectos y almas, y cita el hadiz de Abu Dharr que dice que no hay espacio de cuatro dedos en el cielo sin un ángel en postración, que al-Tirmidhi llamó hasan gharib. {cite:tafsir-qurtubi-quran-com on 74:31} {cite:tafsir-ibn-kathir on 74:31} {cite:jami-al-tirmidhi 2312}"
  fr: "Al-Muddaththir (74:31) affirme que nul autre que Lui ne connaît les armées du Seigneur lors de la mise en place des gardiens du Feu. Al-Qurtubi les interprète comme étant les anges du Seigneur, répondant à Abu Jahl. Ibn Kathir, quant à lui, soutient que seul Dieu connaît leur nombre et leur multitude, réfute toute limitation à dix-neuf ou aux seuls intellects et âmes, et cite le hadith d'Abu Dharr selon lequel il n'y a pas un espace de quatre doigts au Ciel sans un ange prosterné, hadith qu'al-Tirmidhi qualifie de hasan gharib."
  tr: "El-Sürehir 74:31 ayetinde, yalnızca O'nun Rabbin askerlerini ateş hazinesi bağlamında bildiğini söyler; El-Qurtubi onları Ebu Jahl'a karşılık olarak Rabbin melekleri olarak yorumlar. İbn Kathir, sayılarının ve çokluklarının yalnızca Allah tarafından bilindiğini, kendisinin ise on dokuz kişi ya da zihinler ve ruhlarla sınırlı olduğunu söyler. Ebu Zezir'in hadisini aktarır: Göklerde dört parmak için yer yoktur, sadece secde eden bir melek vardır. El-Tirmizi şöyle demiştir: Bu iyi ve gariptir. {alıntı:Tefsir-Kurtubi-Kuran-com 74:31} {alıntı:Tefsir-ibn-Kathir 74:31} {alıntı:Jami-al-Tirmidhi 2312}"
  id: "Ayat Al-Muddathir 74:31 mengatakan bahwa hanya Dia yang mengenal prajurit Tuhan, dalam konteks harta api; Al-Qurtubi menafsirkan mereka sebagai malaikat Tuhan sebagai jawaban terhadap Abu Jahl. Ibn Kathir berkata bahwa jumlah dan keberagaman mereka hanya diketahui Allah, dan dia dibatasi hanya sembilan belas atau hanya pikiran dan jiwa. Dia mengutip hadits Abu Dharr bahwa tidak ada tempat di langit untuk empat jari kecuali ada malaikat yang sujud. Al-Tirmidhi berkata: Itu baik dan aneh. {cite:tafsir-qurtubi-quran-com pada 74:31} {cite:tafsir-ibn-kathir pada 74:31} {cite:jami-al-tirmidhi 2312}"
