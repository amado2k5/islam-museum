summary:
  ar: "يذكر ابن سينا أن السويقي والدشيشي أكثره من احتراق الدم إن مال إلى الحمرة ومن ذوبان الأعضاء إن مال إلى البياض، وأن المائل إلى السواد من احتراق الدم، وهو رديء في الأمراض الحادة. {cite:canon-ibn-sina-print-v1 p.194}."
  en: "Ibn Sina says the meal-like and gruel-like sediment comes mostly from burning of blood when red, and from the melting of organs when whitish; the black kind comes from burnt blood and is bad in acute diseases. {cite:canon-ibn-sina-print-v1 p.194}."
