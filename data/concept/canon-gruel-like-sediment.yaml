id: concept/canon-gruel-like-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب السويقي والدشيشي عند ابن سينا"
  en: "Meal-like and gruel-like sediment in the Canon"
  fr: "Sédiment farineux et semblable à la bouillie dans le Canon"
  ur: "ستو اور دلیے جیسی تلچھٹ قانون میں"
  es: "Sedimentos con aspecto de harina y papilla en el Cañón"
summary:
  ar: "يذكر ابن سينا أن السويقي والدشيشي أكثره من احتراق الدم إن مال إلى الحمرة ومن ذوبان الأعضاء إن مال إلى البياض، وأن المائل إلى السواد من احتراق الدم، وهو رديء في الأمراض الحادة. {cite:canon-ibn-sina-print-v1 p.194}."
  en: "Ibn Sina says the meal-like and gruel-like sediment comes mostly from burning of blood when red, and from the melting of organs when whitish; the black kind comes from burnt blood and is bad in acute diseases. {cite:canon-ibn-sina-print-v1 p.194}."
  fr: "Ibn Sina attribue le farineux et semblable à la bouillie surtout au sang brûlé si rouge, à la fonte organique si blanchâtre ; noir, il viendrait de sang brûlé et serait mauvais dans l’aigu. {cite:canon-ibn-sina-print-v1 p.194}."
  es: "Ibn Sina afirma que el sedimento con aspecto de harina o papilla proviene principalmente de la combustión de la sangre cuando está roja, y de la fusión de los órganos cuando están blanquecinos; el sedimento negro proviene de la sangre quemada y es perjudicial en enfermedades agudas. {cite:canon-ibn-sina-print-v1 p.194}."
