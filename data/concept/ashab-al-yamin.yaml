id: concept/ashab-al-yamin
class: concept
kind: belief
label:
  ar: أصحاب اليمين
  en: The People of the Right
  fr: "Les gens de la Droite"
  ur: اصحاب یمین
  es: "La gente de la derecha"
  tr: "sağ el sahipleri"
  id: "pemilik tangan kanan"
summary:
  ar: "أصحاب اليمين في القرآن والسنة: الذين يؤتون كتابهم بأيمانهم في يوم القيامة، يدخلون الجنة، يذكر أن كتابهم يؤتى بهم بأيمانهم وهم يدخلون الجنة."
  en: "The People of the Right in Qur'an and Sunnah: those given their book in their right hands on the Day of Resurrection, entering paradise — their book is given in their right hands as they enter paradise."
  fr: "Les gens de la Droite dans le Coran et la Sunna : ceux qui reçoivent leur livre dans la main droite au Jour de la Résurrection et entrent au paradis — leur livre leur est donné dans la main droite lorsqu’ils entrent au paradis."
  ur: "اصحاب یمین قرآن و سنت میں: وہ لوگ جنہیں یوم قیامت میں ان کا نامہ دائیں ہاتھ میں دیا جاتا ہے اور وہ جنت میں داخل ہوتے ہیں — ان کا نامہ دائیں ہاتھ میں دیا جاتا ہے جیسے وہ جنت میں داخل ہوتے ہیں۔"
  es: "La Gente de la Derecha en el Corán y la Sunnah: aquellos a quienes se les entrega su libro en sus manos derechas el Día de la Resurrección, al entrar al paraíso, su libro es entregado en sus manos derechas al entrar al paraíso."
  tr: "Kur'an ve Sünnet'te sağ elin sahabeleri: Diriliş gününde yeminleriyle birlikte kitapları verilecek olanlar cennete gireceklerdir. Kitaplarının yeminleriyle birlikte getirileceği ve cennete girecekleri belirtilir."
  id: "Para sahabat tangan kanan dalam Al-Qur'an dan Sunnah: mereka yang akan diberikan kitab mereka beserta sumpah mereka pada Hari Kebangkitan akan masuk ke Surga. Disebutkan bahwa kitab mereka akan dibawa bersama sumpah mereka sementara mereka akan masuk Surga."
