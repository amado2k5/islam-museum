summary:
  ar: "أصحاب اليمين في القرآن والسنة: الذين يؤتون كتابهم بأيمانهم في يوم القيامة، يدخلون الجنة، يذكر أن كتابهم يؤتى بهم بأيمانهم وهم يدخلون الجنة."
  en: "The People of the Right in Qur'an and Sunnah: those given their book in their right hands on the Day of Resurrection, entering paradise — their book is given in their right hands as they enter paradise."
  ur: "اصحاب یمین قرآن و سنت میں: وہ لوگ جنہیں یوم قیامت میں ان کا نامہ دائیں ہاتھ میں دیا جاتا ہے اور وہ جنت میں داخل ہوتے ہیں — ان کا نامہ دائیں ہاتھ میں دیا جاتا ہے جیسے وہ جنت میں داخل ہوتے ہیں۔"
