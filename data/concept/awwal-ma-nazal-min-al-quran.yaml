    stance:
      ar: "أول سورة نزلت بتمامها «يا أيها المدثر» (المدثر 1)"
    summary:
      ar: "ينقل رضا عن السيوطي رواية جابر بن عبد الله في الصحيحين أن أول ما نزل «يا أيها المدثر»، ويجمع بين القولين بأن «اقرأ» أول ما نزل مطلقاً، وأن «المدثر» أول ما نزل بعد فترة الوحي أو أول سورة نزلت كاملة."
