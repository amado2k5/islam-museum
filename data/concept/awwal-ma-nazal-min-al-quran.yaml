    stance:
      ar: "أول سورة نزلت كاملة الفاتحة"
    summary:
      ar: "ينقل رضا عن الكشاف أن أكثر المفسرين على أن أول سورة نزلت فاتحة الكتاب، ويذكر عن السيوطي أن هذا القول لم يقل به إلا عدد قليل، وأن حجته حديث مرسل في بدء الوحي يذكر الفاتحة. ويذكر أن بعضهم قال إنها نزلت مرتين."
