id: concept/awwal-ma-nazal-min-al-quran
class: concept
kind: term
label: { ar: "أول ما نزل من القرآن", en: "The first revealed of the Qur'an" }
issue:
  ar: "أيّ ما نزل أولاً من القرآن: «اقرأ»، أم «المدثر»، أم الفاتحة؟"
summary:
  ar: "اختلاف العلماء في أول ما نزل من القرآن، وقد عرضه محمد رشيد رضا في تفسير سورة الفاتحة نقلاً عن السيوطي في الإتقان وعن الكشاف، ثم رجّح محمد عبده أمراً خاصاً به."
  en: "A disagreement over what was revealed first. Rashid Rida sets it out at the start of the commentary on al-Fatiha, relying on al-Suyuti's al-Itqan and on al-Kashshaf, and then records the view of Muhammad Abduh."
