id: concept/awwal-ma-nazal-min-al-quran
class: concept
kind: term
label:
  ar: "أول ما نزل من القرآن"
  en: "The first revealed of the Qur'an"
  fr: "La première révélation du Coran"
  es: "La primera revelación del Corán"
  ur: "سب سے پہلے نازل ہونے والا قرآن"
  tr: "Kur'an'dan vahyedilen ilk şey"
  id: "Hal pertama yang diwahyukan dari Al-Qur'an"
issue:
  ar: "أيّ ما نزل أولاً من القرآن: «اقرأ»، أم «المدثر»، أم الفاتحة؟"
summary:
  ar: "اختلاف العلماء في أول ما نزل من القرآن، وقد عرضه محمد رشيد رضا في تفسير سورة الفاتحة نقلاً عن السيوطي في الإتقان وعن الكشاف، ثم رجّح محمد عبده أمراً خاصاً به."
  en: "A disagreement over what was revealed first. Rashid Rida sets it out at the start of the commentary on al-Fatiha, relying on al-Suyuti's al-Itqan and on al-Kashshaf, and then records the view of Muhammad Abduh."
  fr: "Une divergence sur ce qui fut révélé en premier. Rashid Rida l’expose au début du commentaire d’al-Fatiha, en s’appuyant sur l’Itqan d’al-Suyuti et le Kashshaf, puis rapporte l’avis de Muhammad Abduh."
  es: "Existe un desacuerdo sobre qué fue revelado primero. Rashid Rida lo expone al comienzo de su comentario sobre al-Fatiha, basándose en al-Itqan de al-Suyuti y en al-Kashshaf, y luego recoge la opinión de Muhammad Abduh."
  ur: "جو پہلے نازل ہوا اس پر اختلاف۔ راشد ردا نے الفاتحہ کی تفسیر کے شروع میں سیوطی کی الاتقان اور الکشاف پر انحصار کرتے ہوئے اسے مرتب کیا ہے اور پھر محمد عبدہ کا قول درج کیا ہے۔"
  tr: "Âlimler, Kur'an'ın en erken vahyi konusunda farklı görüşlere sahiptir. Muhammed Raşid Ridha, Kur'an'ın Fıtiha suresinin yorumunda El-İtkan ve Kaşşaf'ta Al-Suyuti'yi alıntılayarak sunmuş, ardından Muhammed Abduh belirli bir konuyu tercih etmiştir."
  id: "Para ulama berbeda pendapat mengenai wahyu awal Al-Qur'an. Muhammad Rashid Ridha menyajikannya dalam penafsiran Surah Al-Fatiha, mengutip Al-Suyuti dalam Al-Itqan dan Al-Kashaf, kemudian Muhammad Abduh memilih hal tertentu."
