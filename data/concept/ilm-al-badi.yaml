label:
  ar: "علم البديع"
  en: "The science of badi'"
  ur: "علمِ بدیع"
  fr: "La science du badi'"
  es: "La ciencia del badi'"
summary:
  ar: "تعريف علم البديع عند القزويني وخفاجي وابن خلدون، ومقدمة ابن المعتز في كتابه البديع وألوانه الخمسة وما يقوله محقق الكتاب في نشأة الاسم والخلاف فيه، ووجوه التحسين عند السكاكي بأمثلتها القرآنية، مع ما قاله البغوي والقرطبي وابن كثير عند الكهف 18 والليل 5 وآل عمران 54 والقصص 73."
  en: "The definition of badi' in al-Qazwini, Khafaji and Ibn Khaldun; Ibn al-Mu'tazz's preface to his al-Badi' and its five kinds, and what the book's editor says of the rise of the name and the dispute over it; al-Sakkaki's ways of embellishing speech with their Qur'anic examples, with what al-Baghawi, al-Qurtubi and Ibn Kathir say at al-Kahf 18, al-Layl 5, Al Imran 54 and al-Qasas 73."
  ur: "بدیع کی تعریف قزوینی، خفاجی اور ابن خلدون کے ہاں؛ ابن المعتز کا اپنی البدیع کا مقدمہ اور کتاب کے محقق کا نام کے آغاز اور اس پر اختلاف کے بارے میں کہنا؛ سکاکی کے کلام کو سنوارنے کے طریقے ان کی قرآنی مثالوں کے ساتھ، اور الکہف 18، اللیل 5، آل عمران 54 اور القصص 73 پر بغوی، قرطبی اور ابن کثیر کے کہے ہوئے کے ساتھ۔"
  fr: "La définition du badi' chez al-Qazwini, Khafaji et Ibn Khaldun ; la préface d'Ibn al-Mu'tazz à son al-Badi' et ses cinq sortes, et ce que dit l'éditeur du livre de l'apparition du nom et de la controverse à son sujet ; les manières d'embellir le discours selon al-Sakkaki avec leurs exemples coraniques, avec ce que disent al-Baghawi, al-Qurtubi et Ibn Kathir à al-Kahf 18, al-Layl 5, Al Imran 54 et al-Qasas 73."
  es: "La definición del badi' en al-Qazwini, Khafaji e Ibn Jaldún; el prefacio de Ibn al-Mu'tazz a su al-Badi' y sus cinco clases, y lo que dice el editor del libro sobre el origen del nombre y la disputa sobre él; las maneras de embellecer el discurso según al-Sakkaki con sus ejemplos coránicos, con lo que dicen al-Baghawi, al-Qurtubi e Ibn Kathir en al-Kahf 18, al-Layl 5, Al Imran 54 y al-Qasas 73."
