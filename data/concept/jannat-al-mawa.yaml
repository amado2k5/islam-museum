label:
  ar: "جنة المأوى"
  en: "Jannat al-Ma'wa"
  ur: "جنة المأوى"
summary:
  ar: "جنة المأوى التي عندها سدرة المنتهى، سمّاها القرآن في سورة السجدة: «جنة المأوى تسكنون»، وفي سورة النجم: «عنده جنة المأوى». قال ابن عباس: جنة المأوى مسكن الأنبياء والشهداء والصديقين والصالحين."
  en: "Jannat al-Ma'wa — the garden of refuge — beside which stands the Lote-Tree of the Boundary. The Qur'an names it in the Sajda sura «the garden of refuge is your lodging» and in al-Najm «near it is the garden of refuge». Ibn Abbas said it is the lodging of the prophets, the martyrs, the truthful and the righteous."
  ur: "جنة المأوى پناہ کا باغ ہے جس کے پاس سدرۃ المنتہیٰ ہے۔ قرآن نے اس کا نام سورۃ سجدہ «جنة المأوى تمہارا ٹھکانا ہے» اور سورۃ نجم «اس کے پاس جنة المأوى ہے» میں لیا۔ ابن عباس کہتے ہیں یہ انبیاء، شہداء، صدیقین اور صالحین کا مسکن ہے۔"
