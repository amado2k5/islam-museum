summary:
  ar: "جنة المأوى التي عندها سدرة المنتهى، سمّاها القرآن في سورة السجدة: «جنة المأوى تسكنون»، وفي سورة النجم: «عنده جنة المأوى». قال ابن عباس: جنة المأوى مسكن الأنبياء والشهداء والصديقين والصالحين."
  en: "Jannat al-Ma'wa — the garden of refuge — beside which stands the Lote-Tree of the Boundary. The Qur'an names it in the Sajda sura «the garden of refuge is your lodging» and in al-Najm «near it is the garden of refuge». Ibn Abbas said it is the lodging of the prophets, the martyrs, the truthful and the righteous."
  ur: "جنة المأوى پناہ کا باغ ہے جس کے پاس سدرۃ المنتہیٰ ہے۔ قرآن نے اس کا نام سورۃ سجدہ «جنة المأوى تمہارا ٹھکانا ہے» اور سورۃ نجم «اس کے پاس جنة المأوى ہے» میں لیا۔ ابن عباس کہتے ہیں یہ انبیاء، شہداء، صدیقین اور صالحین کا مسکن ہے۔"
  es: "Jannat al-Ma'wa —el jardín del refugio—, junto al cual se encuentra el Árbol del Loto del Límite. El Corán lo menciona en la sura Sajda: «El jardín del refugio es tu morada», y en al-Najm: «Cerca de él está el jardín del refugio». Ibn Abbas afirmó que es la morada de los profetas, los mártires, los veraces y los justos."
  fr: "Jannat al-Ma'wa, le jardin du refuge, est bordé par le lotus sacré. Le Coran le nomme dans la sourate Sajda: « Le jardin du refuge est votre demeure », et dans la sourate An-Najm: « Près de lui se trouve le jardin du refuge ». Ibn Abbas disait qu'il est la demeure des prophètes, des martyrs, des véridiques et des vertueux."
  tr: "En Büyük Sınırın Lota Ağacı'nın yakınında bulunan Sığınak Bahçesi, Kur'an'da Süs-Sâcde suresinde \"Yaşadığınız Sığınak Bahçesi\" ve En-Najm Suresi'nde \"Onunla Sığınak Bahçesi vardır\" olarak adlandırılmıştır. İbn Abbas şöyle demiştir: Sığınak Bahçesi, Peygamberlerin, şehitlerin, doğruların ve doğru kişilerin meskenidir."
  id: "Taman Perlindungan, yang terletak dekat Pohon Lote dari Wates Tertinggi, disebut oleh Al-Qur'an dalam Surah As-Sajdah: \"Taman Perlindungan yang akan Kau tinggali,\" dan dalam Surah An-Najm: \"Bersama-Nya adalah Taman Perlindungan.\" Ibn Abbas berkata: Taman Perlindungan adalah tempat tinggal para Nabi, para syahid, yang benar, dan yang benar."
