id: concept/bassd
class: concept
kind: natural
label:
  ar: "بسد"
  en: "Bassad (red coral, the editor's marjan)"
  fr: "Bassad (corail rouge, marjan de l’éditeur)"
  ur: "بسد ⁦(مرجان)⁩"
  es: "Bassad (coral rojo, el marjan del editor)"
summary:
  ar: "معروف منه أحمر وأسود وأبيض، بارد في الأولى يابس في الثانية، قابض يمنع النزف، يقوّي العين، ويحبس نفث الدم، ويقوّي القلب ويمنع الخفقان، ويقطع اللحم الزائد، وينفع ورم الطحال بالماء {cite:canon-ibn-sina-print-v1 p.407}، {cite:canon-ibn-sina-print-v1 p.408}."
  en: "Known in red, black and white. Cold in the first degree and dry in the second. It is astringent and stops bleeding, strengthens the eye, holds back spitting of blood, strengthens the heart against palpitations, cuts away proud flesh, and helps swelling of the spleen when taken in water {cite:canon-ibn-sina-print-v1 p.407}, {cite:canon-ibn-sina-print-v1 p.408}."
  fr: "Connu en rouge, noir et blanc. Froid au premier degré et sec au deuxième, astringent, il arrêterait les saignements, fortifierait l’œil, retiendrait les crachements de sang, fortifierait le cœur contre les palpitations, éliminerait les chairs bourgeonnantes et aiderait contre le gonflement de la rate pris dans l’eau {cite:canon-ibn-sina-print-v1 p.407}, {cite:canon-ibn-sina-print-v1 p.408}."
  ur: "یہ سرخ، سیاہ اور سفید ہوتا ہے۔ پہلے درجے میں سرد اور دوسرے میں خشک۔ قابض ہے اور خون بہنا روکتا ہے، آنکھ کو مضبوط کرتا ہے، خون تھوکنے کو روکتا ہے، دل کو دھڑکن کے خلاف قوت دیتا ہے، زائد گوشت کاٹتا ہے، اور پانی کے ساتھ تلی کے ورم میں مفید ہے {cite:canon-ibn-sina-print-v1 p.407}، {cite:canon-ibn-sina-print-v1 p.408}۔"
  es: "Conocida en rojo, negro y blanco. Fría en primer grado y seca en segundo. Es astringente y detiene el sangrado, fortalece la vista, previene la expectoración de sangre, fortalece el corazón contra las palpitaciones, elimina la carne orgullosa y ayuda a la inflamación del bazo cuando se toma en agua {cite:canon-ibn-sina-print-v1 p.407}, {cite:canon-ibn-sina-print-v1 p.408}."
