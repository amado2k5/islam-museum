summary:
  ar: "المنبوذ حي مولود طرحه أهله خوفا من العيلة أو فرارا من التهمة، ومشروعية التقاطه ثابتة لإنقاذه. ولولاية الالتقاط شروط، ولأهل الالتقاط تزاحم وأولوية، ويحكم بإسلامه بحسب الدار التي وجد فيها، ويلحق بمن يستلحقه ببينة، وهو حر في الأصل، ولا يقبل ادعاء رقه بلا بينة."
  en: "The manbud is a living child cast out by his people for fear of poverty or to avoid suspicion. Taking him up is lawful to save his life. The right to take him up has conditions, and rival takers are ranked; his religion follows the territory where he was found; he may be ascribed to a claimant with proof; he is free by default; and a claim that he is a slave without proof is not accepted."
  ur: "منبوذ وہ زندہ نومولود ہے جسے گھر والے غربت کے ڈر یا بدنامی سے بچنے کے لیے پھینک دیں۔ اسے اٹھانا جان بچانے کے لیے جائز ہے۔ اس کے دین کا حکم اس علاقے کے مطابق ہوتا ہے جہاں وہ ملے، وہ بنیادی طور پر آزاد ہے، اور بغیر ثبوت اس کی غلامی کا دعویٰ قبول نہیں۔"
