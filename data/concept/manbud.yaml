summary:
  ar: "المنبوذ حي مولود طرحه أهله خوفا من العيلة أو فرارا من التهمة، ومشروعية التقاطه ثابتة لإنقاذه. ولولاية الالتقاط شروط، ولأهل الالتقاط تزاحم وأولوية، ويحكم بإسلامه بحسب الدار التي وجد فيها، ويلحق بمن يستلحقه ببينة، وهو حر في الأصل، ولا يقبل ادعاء رقه بلا بينة."
  en: "The manbud is a living child cast out by his people for fear of poverty or to avoid suspicion. Taking him up is lawful to save his life. The right to take him up has conditions, and rival takers are ranked; his religion follows the territory where he was found; he may be ascribed to a claimant with proof; he is free by default; and a claim that he is a slave without proof is not accepted."
  ur: "منبوذ وہ زندہ نومولود ہے جسے گھر والے غربت کے ڈر یا بدنامی سے بچنے کے لیے پھینک دیں۔ اسے اٹھانا جان بچانے کے لیے جائز ہے۔ اس کے دین کا حکم اس علاقے کے مطابق ہوتا ہے جہاں وہ ملے، وہ بنیادی طور پر آزاد ہے، اور بغیر ثبوت اس کی غلامی کا دعویٰ قبول نہیں۔"
  es: "El niño abandonado es un niño vivo expulsado por su pueblo por temor a la pobreza o para evitar sospechas. Acogerlo es lícito para salvarle la vida. El derecho a acogerlo tiene condiciones, y quienes compiten por acogerlo se clasifican; su religión corresponde al territorio donde fue encontrado; puede ser atribuido a un reclamante con pruebas; es libre por defecto; y no se acepta la afirmación de que es esclavo sin pruebas."
  fr: "L'enfant abandonné est un enfant vivant rejeté par son peuple par crainte de la pauvreté ou pour éviter les soupçons. Le recueillir est légal pour lui sauver la vie. Ce droit est soumis à conditions, et les prétendants sont classés par ordre de priorité; sa religion est celle du territoire où il a été trouvé; il peut être rattaché à un prétendant sur présentation de preuves; il est libre par défaut; et toute allégation d'esclavage non prouvée est irrecevable."
  tr: "Dışlanmış, ailesinden korktuğu veya suçlamadan kaçmak için ailesi tarafından terk edilmiş yeni doğandır ve onu kurtarmak için yakalanmanın meşruiyeti ortaya çıkar. Esirinin velayetinin şartları vardır ve onu yakalananların rekabeti ve önceliği vardır. Bulunduğu eve göre dönüştürülmesi yargılanır ve kanıtla hak ettiği kişilere atanır. Başlangıçta özgürdür ve kanıt olmadan kölelik iddialarını kabul etmez."
  id: "Yang dibuang adalah bayi baru lahir yang ditinggalkan oleh keluarganya karena takut keluarga atau untuk menghindari tuduhan, dan legitimasi menangkapnya dibuktikan untuk menyelamatkannya. Hak asuh tawanan memiliki syarat, dan orang-orang yang menangkapnya memiliki persaingan dan prioritas. Dia dinilai untuk berpindah agama sesuai dengan rumah tempat dia ditemukan, dan dia ditugaskan kepada mereka yang pantas dengan bukti. Dia awalnya bebas dan tidak menerima klaim perbudakan tanpa bukti."
