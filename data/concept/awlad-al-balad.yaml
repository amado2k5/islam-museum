label:
  ar: "أولاد البلد"
  en: "Awlad al-balad (the Mahdist riverain tribes)"
summary:
  ar: "اسم استعمله السودانيون في عهد المهدية (1881-1898م) للقبائل النهرية الشمالية، وأهمها مجموعة الدناقلة والجعليين، وكان كثير منهم مقيمين بعيدًا عن مراكز قبائلهم. وكانوا الطبقة الحاكمة تحت المهدي، ثم أُزيحوا تدريجيًا عن المناصب الكبرى في عهد الخليفة عبد الله، وإن بقيت الوظائف الدينية والكتابية في أيديهم إلى نهاية المهدية {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
  en: "The term Sudanese used during the Mahdiyya (1881-98) for the northern riverain tribes, chiefly the Danakla and the Ja'aliyyin, many of whom lived away from their tribal centres along the Nile. They formed the ruling class under the Mahdi; after his death in June 1885 the Khalifa 'Abd Allah displaced them gradually from the chief offices, though clerical posts stayed largely in their hands {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
