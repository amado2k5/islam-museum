id: concept/awlad-al-balad
class: concept
kind: term
label:
  ar: "أولاد البلد"
  en: "Awlad al-balad (the Mahdist riverain tribes)"
  fr: "Awlad al-balad (les tribus riveraines mahdistes)"
  es: "Awlad al-balad (las tribus ribereñas mahdistas)"
summary:
  ar: "اسم استعمله السودانيون في عهد المهدية ⁦(1881-1898م)⁩ للقبائل النهرية الشمالية، وأهمها مجموعة الدناقلة والجعليين، وكان كثير منهم مقيمين بعيدًا عن مراكز قبائلهم. وكانوا الطبقة الحاكمة تحت المهدي، ثم أُزيحوا تدريجيًا عن المناصب الكبرى في عهد الخليفة عبد الله، وإن بقيت الوظائف الدينية والكتابية في أيديهم إلى نهاية المهدية {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
  en: "The term Sudanese used during the Mahdiyya (1881-98) for the northern riverain tribes, chiefly the Danakla and the Ja'aliyyin, many of whom lived away from their tribal centres along the Nile. They formed the ruling class under the Mahdi; after his death in June 1885 the Khalifa 'Abd Allah displaced them gradually from the chief offices, though clerical posts stayed largely in their hands {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
  fr: "Terme employé par les Soudanais durant la Mahdiyya (1881-1898) pour les tribus riveraines du Nord, principalement les Danakla et les Ja'aliyyin, dont beaucoup de membres vivaient loin de leurs centres tribaux le long du Nil. Ils formèrent la classe dirigeante sous le Mahdi ; après sa mort en juin 1885, le Khalifa 'Abd Allah les écarta progressivement des principales fonctions, bien que les postes administratifs restent largement entre leurs mains {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
  es: "El término sudanés se utilizaba durante el Mahdiyya (1881-1898) para referirse a las tribus ribereñas del norte, principalmente los Danakla y los Ja'aliyyin, muchos de los cuales vivían alejados de sus centros tribales a lo largo del Nilo. Formaban la clase dirigente bajo el Mahdi; tras su muerte en junio de 1885, el califa Abd Allah los desplazó gradualmente de los cargos principales, aunque los puestos clericales permanecieron en gran medida en sus manos {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
