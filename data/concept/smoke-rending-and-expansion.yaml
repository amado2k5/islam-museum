id: concept/smoke-rending-and-expansion
class: concept
kind: term
label: { ar: "الدخان والفتق والتوسعة في بدء الخلق", en: "Smoke, rending and expansion in the beginning of creation", ur: "ابتدائے تخلیق میں دھواں، شگاف اور وسعت", es: "Humo, desgarro y expansión en el comienzo de la creación." }
summary:
  ar: "ذكر القرآن أن السماء كانت دخاناً، وأن السماوات والأرض كانتا رتقاً ففُتقتا، وأن السماء بُنيت وأن الله موسّع؛ وقد فسّرها الأقدمون بأن الأرض والسماء كانتا ملتصقتين ففصل الهواء بينهما، أو بالمطر والنبات، أو بتفتيق السماء سبعاً، أما القراءات العلمية الحديثة فخطاب لاحق نقده بعض الأكاديميين المسلمين {cite:tafsir-ibn-kathir on 21:30} {cite:quran-com-tafsir-api al-Tabari on 21:30}."
  en: "The Qur'an says the heaven was smoke, that the heavens and earth were a joined mass that was split, and that the heaven was built and God is its expander; early commentators read these as earth and heaven joined and then separated by air, or as rain and plants, or as one heaven split into seven, while the modern scientific readings are a later discourse that some Muslim academics have criticised {cite:tafsir-ibn-kathir on 21:30} {cite:quran-com-tafsir-api al-Tabari on 21:30}."
  ur: "قرآن بتاتا ہے کہ آسمان دھواں تھا، آسمان اور زمین ایک جڑی ہوئی چیز تھے جسے الگ کیا گیا، اور آسمان بنایا گیا اور اللہ وسعت دینے والا ہے؛ قدیم مفسرین نے اسے آسمان و زمین کے جڑے ہونے پھر ہوا سے الگ ہونے، یا بارش اور نباتات، یا ایک آسمان کے سات میں بٹنے سے سمجھا، جبکہ جدید سائنسی قراءتیں ایک بعد کا بیانیہ ہیں جس پر بعض مسلم اہلِ علم نے تنقید کی {cite:tafsir-ibn-kathir on 21:30} {cite:quran-com-tafsir-api al-Tabari on 21:30}۔"
  es: "El Corán dice que el cielo era humo, que los cielos y la tierra eran una masa unida que se dividió, y que el cielo fue construido y Dios es su expansor; los primeros comentaristas interpretaron esto como la tierra y el cielo unidos y luego separados por el aire, o como la lluvia y las plantas, o como un cielo dividido en siete, mientras que las lecturas científicas modernas son un discurso posterior que algunos académicos musulmanes han criticado {cite:tafsir-ibn-kathir en 21:30} {cite:quran-com-tafsir-api al-Tabari en 21:30}."
