id: concept/smoke-rending-and-expansion
class: concept
kind: term
label: { ar: "الدخان والفتق والتوسعة في بدء الخلق", en: "Smoke, rending and expansion in the beginning of creation", ur: "ابتدائے تخلیق میں دھواں، شگاف اور وسعت", es: "Humo, desgarro y expansión en el comienzo de la creación.", fr: "Fumée, déchirure et expansion au commencement de la création", tr: "Duman, fıtık ve yaratılışın başında genleşme", id: "Asap, hernia, dan ekspansi pada awal penciptaan" }
summary:
  ar: "ذكر القرآن أن السماء كانت دخاناً، وأن السماوات والأرض كانتا رتقاً ففُتقتا، وأن السماء بُنيت وأن الله موسّع؛ وقد فسّرها الأقدمون بأن الأرض والسماء كانتا ملتصقتين ففصل الهواء بينهما، أو بالمطر والنبات، أو بتفتيق السماء سبعاً، أما القراءات العلمية الحديثة فخطاب لاحق نقده بعض الأكاديميين المسلمين {cite:tafsir-ibn-kathir on 21:30} {cite:quran-com-tafsir-api al-Tabari on 21:30}."
  en: "The Qur'an says the heaven was smoke, that the heavens and earth were a joined mass that was split, and that the heaven was built and God is its expander; early commentators read these as earth and heaven joined and then separated by air, or as rain and plants, or as one heaven split into seven, while the modern scientific readings are a later discourse that some Muslim academics have criticised {cite:tafsir-ibn-kathir on 21:30} {cite:quran-com-tafsir-api al-Tabari on 21:30}."
  ur: "قرآن بتاتا ہے کہ آسمان دھواں تھا، آسمان اور زمین ایک جڑی ہوئی چیز تھے جسے الگ کیا گیا، اور آسمان بنایا گیا اور اللہ وسعت دینے والا ہے؛ قدیم مفسرین نے اسے آسمان و زمین کے جڑے ہونے پھر ہوا سے الگ ہونے، یا بارش اور نباتات، یا ایک آسمان کے سات میں بٹنے سے سمجھا، جبکہ جدید سائنسی قراءتیں ایک بعد کا بیانیہ ہیں جس پر بعض مسلم اہلِ علم نے تنقید کی {cite:tafsir-ibn-kathir on 21:30} {cite:quran-com-tafsir-api al-Tabari on 21:30}۔"
  es: "El Corán dice que el cielo era humo, que los cielos y la tierra eran una masa unida que se dividió, y que el cielo fue construido y Dios es su expansor; los primeros comentaristas interpretaron esto como la tierra y el cielo unidos y luego separados por el aire, o como la lluvia y las plantas, o como un cielo dividido en siete, mientras que las lecturas científicas modernas son un discurso posterior que algunos académicos musulmanes han criticado {cite:tafsir-ibn-kathir en 21:30} {cite:quran-com-tafsir-api al-Tabari en 21:30}."
  fr: "Le Coran dit que le ciel était fumée, que les cieux et la terre formaient une masse unie qui s'est divisée, et que le ciel a été construit et que Dieu est celui qui l'étend; les premiers commentateurs ont interprété cela comme la terre et le ciel unis puis séparés par l'air, ou comme la pluie et les plantes, ou comme un ciel divisé en sept, tandis que les lectures scientifiques modernes constituent un discours plus tardif que certains universitaires musulmans ont critiqué {cite:tafsir-ibn-kathir on 21:30} {cite:quran-com-tafsir-api al-Tabari on 21:30}."
  tr: "Kur'an, gökyüzünün duman olduğu, gökyüzü ile yerin birleşip ayrıldığını, gökyüzünün inşa edildiğini ve Allah'ın genişlediğini belirtmiştir. Eskiler bunu, yer ve gökyüzünün havanın onları ayırmasıyla, yağmur ve bitkilerle ya da gökyüzünün yediye bölünmesiyle birleşmesi olarak yorumlamışlardır. Modern bilimsel okumalara gelince, bazı Müslüman akademisyenler tarafından eleştirilen daha sonraki bir söylemdir {cite:tafsir-ibn-kathir on 21:30} {cite:quran-com-tafsir-api al-Tabari on 21:30}."
  id: "Al-Qur'an menyebutkan bahwa langit adalah asap, langit dan bumi disatukan dan terbelah, bahwa langit dibangun, dan bahwa Allah meluas. Orang kuno menafsirkan ini sebagai bumi dan langit yang disatukan oleh udara yang memisahkannya, atau oleh hujan dan tumbuhan, atau oleh pemisahan langit menjadi tujuh. Adapun bacaan ilmiah modern, ini adalah wacana yang kemudian dikritik oleh beberapa akademisi Muslim {cite:tafsir-ibn-kathir pada 21:30} {cite:quran-com-tafsir-api al-Tabari pada 21:30}."
