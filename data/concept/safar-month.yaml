id: concept/safar-month
class: concept
kind: legal
label:
  ar: "شهر صفر"
  en: "Safar (the second month and the Jahiliyya superstition about it)"
  es: "Safar (el segundo mes y la superstición de la época preislámica sobre él)"
  fr: "Safar (le deuxième mois et la superstition jahiliyya à son sujet)"
  ur: "صفر ⁦(دوسرا مہینہ اور اس کے بارے میں جاہلیت کے توہمات)⁩"
summary:
  ar: "صفر ثاني شهور السنة القمرية، سمي صفرا لخلو مكة من أهلها فيه للأسفار. وكان أهل الجاهلية يتشاءمون به ويعدونه شهر نحس، فأبطل الإسلام ذلك بقوله: لا عدوى ولا صفر ولا هامة. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "Safar is the second month of the lunar year, named, it is said, for Mecca emptying of its people as they travelled. The people of the Jahiliyya saw it as an ill-omened month, and Islam abolished that in the saying: there is no contagion, no Safar and no owl. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  ur: "صفر قمری سال کا دوسرا مہینہ ہے؛ کہا جاتا ہے اس لیے صفر کہا گیا کہ اس میں مکہ اپنے باشندوں سے خالی ہو جاتا تھا۔ اہلِ جاہلیت اسے منحوس سمجھتے تھے، اور اسلام نے اسے اس فرمان سے باطل کیا: نہ عدوٰی ہے، نہ صفر، نہ ہامہ۔ {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  es: "Safar es el segundo mes del año lunar, llamado así, según se dice, porque La Meca se vació de su gente durante sus viajes. La gente de la época preislámica (Jahiliyya) lo consideraba un mes de mal agüero, y el Islam abolió esa creencia con el dicho: «No hay contagio, ni Safar, ni búho». {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  fr: "Safar est le deuxième mois de l'année lunaire. Sa dénomination proviendrait du départ des habitants de La Mecque, partis en voyage. Les gens de la Jahiliyya le considéraient comme un mois de mauvais augure, et l'islam a aboli cette croyance en affirmant: « Il n'y a ni contagion, ni Safar, ni hibou. » {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
