label: { ar: "اعتدال مزاج خط الاستواء وما بلغه من الأخبار في الزيج الصابي", en: "The temperate equator line and the report that none had reached it", ur: "خط استوا کا اعتدال مزاج اور اس تک کسی کے نہ پہنچنے کی خبر", es: "La línea del ecuador templado y el informe de que nadie la había alcanzado.", fr: "La ligne de l'équateur tempéré et le rapport selon lequel personne ne l'avait atteinte", tr: "Ekvatorun ılıman iklimi ve Saba astronomik tablolarında yer alan bilgiler.", id: "Iklim sedang di khatulistiwa dan informasi yang terkandung di dalamnya dalam tabel astronomi Sabaean." }
summary:
  ar: "يقول البتاني إنه لا يُعلم على الحقيقة أن خط الاستواء مسكون، إذ لم يُرَ أن أحداً انتهى إليه في زمانه ولم يذكره بطليموس في كتابه، لكن أهل الفهم يعرفون أن مزاجه معتدل لأن الشمس لا تبعد عنه مفرطاً ولا تطول أظلالها بسبب سرعة تحركها في الميل هناك، فيكون الصيف والشتاء فيه حسني المزاج، ويظهر شبه ذلك في ما قرب منه كبلاد من اليمن. {cite:zij-sabi-nallino-byblion pp.25-26}."
  en: "Al-Battani says it is not truly known whether the equator line is inhabited, since he knew of no one who had reached it in his day and Ptolemy does not mention it in his book; but people of understanding know its temperament is balanced, because the Sun never goes far from it nor do shadows lengthen there, so swift is the Sun's change of declination at that time, and summer and winter on it are both mild, something seen in lands near it such as places in Yemen. {cite:zij-sabi-nallino-byblion pp.25-26}."
  ur: "البتانی کہتے ہیں کہ یہ حقیقت میں معلوم نہیں کہ خط استوا آباد ہے یا نہیں، کیونکہ ان کے زمانے میں کسی کا وہاں پہنچنا معلوم نہ تھا اور بطلیموس نے بھی اپنی کتاب میں اس کا ذکر نہیں کیا؛ لیکن اہل فہم جانتے ہیں کہ اس کا مزاج معتدل ہے، کیونکہ سورج اس سے حد سے زیادہ دور نہیں جاتا اور میل میں تیز رفتاری کی وجہ سے سائے لمبے نہیں ہوتے، اس لیے وہاں گرمی اور سردی دونوں خوشگوار رہتی ہیں؛ اس کی مثال اس کے قریب کے علاقوں میں دکھائی دیتی ہے، جیسے یمن کے بعض شہر۔ {cite:zij-sabi-nallino-byblion pp.25-26}۔"
  es: "Al-Battani afirma que no se sabe con certeza si la línea del ecuador está habitada, ya que no conocía a nadie que la hubiera alcanzado en su época y Ptolomeo no la menciona en su libro; pero la gente de entendimiento sabe que su clima es equilibrado, porque el Sol nunca se aleja mucho de ella ni las sombras se alargan allí, tan rápido es el cambio de declinación solar en ese momento, y tanto el verano como el invierno son suaves, algo que se observa en tierras cercanas como algunos lugares de Yemen. {cite:zij-sabi-nallino-byblion pp.25-26}."
  fr: "Al-Battani affirme qu'on ignore si l'équateur est habité, car il ne connaissait personne qui l'ait atteint de son temps et Ptolémée n'en fait pas mention dans son ouvrage; mais les personnes avisées savent que son climat est équilibré, car le soleil ne s'en éloigne jamais beaucoup et les ombres n'y sont pas plus longues, tant la déclinaison solaire y est rapide; de plus, l'été et l'hiver y sont doux, comme dans les régions voisines telles que le Yémen. {cite:zij-sabi-nallino-byblion pp.25-26}."
  tr: "El-Battani, ekvatorun yerleşim yeri olup olmadığının kesin olarak bilinmediğini, çünkü kendi zamanında oraya ulaşan kimsenin görülmediğini ve Batlamyus'un da kitabında bundan bahsetmediğini söylüyor. Ancak, bilgili olanlar, güneşin oradan çok uzaklaşmaması ve zenitteki hızlı hareketinden dolayı gölgelerinin çok uzun olmaması nedeniyle ikliminin ılıman olduğunu bilirler. Bu nedenle, yaz ve kış iklimi hoştur ve Yemen'in bazı bölgeleri gibi yakınındaki yerlerde de benzer bir durum gözlemlenir. {cite:zij-sabi-nallino-byblion pp.25-26}."
  id: "Al-Battani mengatakan bahwa tidak diketahui secara pasti apakah garis khatulistiwa dihuni, karena tidak ada yang terlihat mencapainya pada zamannya dan Ptolemy tidak menyebutkannya dalam bukunya. Namun, mereka yang memahaminya tahu bahwa iklimnya sedang karena matahari tidak bergerak terlalu jauh darinya dan bayangannya tidak terlalu panjang karena pergerakannya yang cepat di titik zenit di sana. Dengan demikian, musim panas dan musim dingin memiliki iklim yang menyenangkan, dan fenomena serupa diamati di tempat-tempat di dekatnya, seperti beberapa bagian Yaman. {cite:zij-sabi-nallino-byblion pp.25-26}."
