summary:
  ar: "موميا في قوة الزفت والقفر المخلوطين وطبيعتهما إلا أنه بالغ واسع المنفعة، حار في الثالثة لطيف محلل، وتذكر الكتب له منافع كثيرة في الجبر والفالج والصداع والسعال والمعدة والكبد وقروح المثانة {cite:canon-ibn-sina-print-v1 p.565}."
  en: "Mumiya is in the force and nature of pitch and bitumen mixed, but extreme and wide in benefit; hot in the third degree, fine and dissolving, the book lists many uses for it in broken bones, palsy, headache, cough, stomach, liver and ulcers of the bladder {cite:canon-ibn-sina-print-v1 p.565}."
  ur: "مومیا قوت اور طبیعت میں ملے ہوئے رال اور قیر کے مانند ہے مگر بہت شدید اور وسیع فائدے والا؛ تیسرے درجے میں گرم، لطیف اور تحلیل کرنے والا، اور کتاب اس کے بہت سے فائدے گناتی ہے: ٹوٹی ہڈی، فالج، سر درد، کھانسی، معدہ، جگر اور مثانے کے زخم {cite:canon-ibn-sina-print-v1 p.565}۔"
  es: "La momia es, en la fuerza y naturaleza, una mezcla de brea y betún, pero de beneficio extremo y amplio; caliente en tercer grado, fina y disolvente, el libro enumera muchos usos para ella en fracturas, parálisis, dolor de cabeza, tos, estómago, hígado y úlceras de vejiga {cite:canon-ibn-sina-print-v1 p.565}."
