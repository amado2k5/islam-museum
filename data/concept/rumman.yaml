summary:
  ar: "الرمان في الكتاب الحلو منه بارد إلى الأولى رطب فيها والحامض بارد يابس في الثانية، والحامض يقمع الصفراء ويمنع سيلان الفضول، وجميع أصنافه جلاء مع القبض، وحبه بالعسل للداحس والقروح الخبيثة ووجع الأذن والقلاع، وأقماعه للجراحات، وينفع من نفث الدم والخفقان ويجلو الفؤاد وجيده المز للمعدة، وقشور أصل الرمان بالنبيذ يخرج الديدان، ويذكر الكتاب سويقه لشهوة الحبالى نقلا موسوما {cite:canon-ibn-sina-print-v1 pp.666-667}"
  en: "Rumman is in the book, the sweet cold to the first degree and moist in it, and the sour cold and dry in the second; the sour suppresses bile and stops the flowing of superfluities, and all its kinds cleanse with astringency; its seeds with honey are for whitlow, foul ulcers, ear pain and mouth sores, its calyces for wounds; it benefits spitting of blood and palpitation, and cleanses the heart, the tart being good for the stomach; the bark of the root with nabidh expels worms; and the book lists, as a labelled report, its sawiq for the craving of pregnant women {cite:canon-ibn-sina-print-v1 pp.666-667}"
  ur: "رمان کتاب میں، میٹھا پہلے درجے تک ٹھنڈا اور اس میں تر ہے اور کھٹا دوسرے درجے میں ٹھنڈا خشک؛ کھٹا صفراء کو دباتا اور فضلات کے بہاؤ کو روکتا ہے، اور اس کی تمام قسمیں قبض کے ساتھ جلاء کرتی ہیں؛ اس کے دانے شہد کے ساتھ داحس، خبیث قرحوں، کان کے درد اور منہ کے چھالوں کے لیے ہیں، اس کے قمع زخموں کے لیے؛ خون تھوکنے اور دھڑکن میں نافع ہے اور دل کو جلا دیتا ہے، اور ترش معدے کے لیے اچھا ہے؛ جڑ کی چھال نبیذ کے ساتھ کیڑے نکالتی ہے؛ اور کتاب منقول فہرست کے طور پر حاملہ عورتوں کی خواہش کے لیے اس کا ستو درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.666-667}۔"
  es: "En el libro se menciona el Rumman, el dulce frío en primer grado y húmedo en él, y el ácido frío y seco en segundo grado; el ácido suprime la bilis y detiene el flujo de superfluidades, y todas sus variedades limpian con astringencia; sus semillas con miel son para el panadizo, úlceras purulentas, dolor de oído y llagas en la boca, sus cálices para las heridas; beneficia la expectoración de sangre y las palpitaciones, y limpia el corazón, siendo el ácido bueno para el estómago; la corteza de la raíz con nabidh expulsa los gusanos; y el libro enumera, como un informe etiquetado, su sawiq para los antojos de las mujeres embarazadas {cite:canon-ibn-sina-print-v1 pp.666-667}"
