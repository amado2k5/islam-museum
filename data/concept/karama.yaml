label:
  ar: "كَرامة"
  en: "Marvel of a saint (karama)"
  ur: "کرامت"
  es: "Maravilla de un santo (karama)"
  fr: "Merveille d'un saint (karama)"
  tr: "Onur"
  id: "Martabat"
summary:
  ar: "الكرامة لغة العز، واصطلاحاً أمر خارق للعادة يظهر على يد شخص ظاهر الصلاح غير مقارن لدعوى النبوة، وتطلق أيضاً على الإعزاز والتشريف وإكرام الضيف. ويجوز عند جمهور أهل السنة ظهور الكرامة على يد المؤمن الصالح، ويسمى وليّاً، ولا يحكم بالكرامة في ما يخالف العادة ولا يُعتد به شرعاً، والإسلام يرعى كرامة الإنسان ويحرم انتهاكها، ويرغب في إكرام الضيف والعلماء وكبار السن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
  en: "In the lexicon karama is honour; in the terminology it is an extraordinary event that appears at the hand of a person known for righteousness who does not claim prophethood. The word also means dignity, and hospitality to a guest. Most Sunni scholars allow such marvels to appear at the hands of a righteous believer, who is then called a friend of God (wali), and they say it has occurred. A claim of a thing that is impossible by custom is not accepted in law, even if it is possible by marvel. The law guards human dignity, and urges honouring guests, scholars, the elderly and those who carry the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
  ur: "کرامت لغت میں عزت ہے، اور اصطلاح میں وہ خارقِ عادت امر ہے جو کسی نیک شخص کے ہاتھ پر ظاہر ہو جو نبوت کا دعویٰ نہ کرے۔ یہ لفظ عزت و شرف اور مہمان نوازی کے معنی میں بھی آتا ہے۔ اہلِ سنت کے جمہور کے نزدیک نیک مومن کے ہاتھ پر کرامت ظاہر ہونا جائز اور واقع ہے، اور ایسے شخص کو ولی کہا جاتا ہے۔ جس بات کا عادتاً ممکن نہ ہو، وہ کرامت کے ذریعے ممکن ہونے کے باوجود شرعاً قبول نہیں کی جاتی۔ اسلام انسانی عزت کی حفاظت کرتا ہے، اور مہمان، علماء، بزرگوں اور قرآن کے حاملین کی تکریم کی ترغیب دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
  es: "En el léxico, karama significa honor; en la terminología, se refiere a un acontecimiento extraordinario realizado por una persona conocida por su rectitud, que no se atribuye la profecía. La palabra también significa dignidad y hospitalidad hacia un huésped. La mayoría de los eruditos sunitas permiten que tales prodigios ocurran por obra de un creyente justo, a quien se le llama amigo de Dios (wali), y afirman que el suceso ha ocurrido. La ley no acepta la afirmación de algo imposible por costumbre, aunque sea posible por milagro. La ley protege la dignidad humana e insta a honrar a los huéspedes, a los eruditos, a los ancianos y a quienes portan el Corán. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13235} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13236} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
  fr: "Dans le lexique, « karama » signifie honneur; dans la terminologie, il s'agit d'un événement extraordinaire qui se produit grâce à une personne reconnue pour sa droiture et qui ne prétend pas être prophétique. Ce mot signifie également dignité et hospitalité envers un hôte. La plupart des savants sunnites admettent que de tels miracles puissent se produire grâce à un croyant pieux, alors appelé ami de Dieu (wali), et ils reconnaissent leur véracité. Une affirmation d'une chose impossible selon la coutume n'est pas acceptée par la loi, même si elle est possible par miracle. La loi protège la dignité humaine et recommande d'honorer les hôtes, les savants, les personnes âgées et ceux qui portent le Coran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
  tr: "Onur, onur dilidir ve teknik olarak, doğru görünen ve peygamberlik iddiasıyla kıyaslanamayan olağanüstü bir meseledir. Ayrıca onur, onur ve misafiri onurlandırmak için de kullanılır. Sünni Müslümanların çoğunluğuna göre, onurun, koruyucu olarak adlandırılan doğru bir müminin elinde ortaya çıkması caizdir. Onur, geleneklere aykırı veya dini olarak kabul edilmeyecek konularda yargılanmaz. İslam insan onuruna saygı gösterir ve ihlalini yasaklar, misafirleri, alimleri ve yaşlıları onurlandırmaya çalışır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13238}"
  id: "Martabat adalah bahasa kehormatan, dan secara teknis merupakan hal luar biasa yang muncul pada seseorang yang tampak benar dan tidak sebanding dengan klaim kenabian. Bahasa ini juga digunakan untuk merujuk pada kehormatan, kehormatan, dan penghormatan kepada tamu. Menurut mayoritas Muslim Sunni, kehormatan diperbolehkan muncul di tangan seorang mukmin yang benar, yang disebut penjaga. Kehormatan tidak dinilai dalam hal-hal yang bertentangan dengan tradisi atau tidak dianggap secara agama. Islam menghormati martabat manusia dan melarang pelanggarannya, serta berusaha menghormati tamu, ulama, dan lansia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
