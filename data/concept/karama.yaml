label:
  ar: "كَرامة"
  en: "Marvel of a saint (karama)"
  ur: "کرامت"
summary:
  ar: "الكرامة لغة العز، واصطلاحاً أمر خارق للعادة يظهر على يد شخص ظاهر الصلاح غير مقارن لدعوى النبوة، وتطلق أيضاً على الإعزاز والتشريف وإكرام الضيف. ويجوز عند جمهور أهل السنة ظهور الكرامة على يد المؤمن الصالح، ويسمى وليّاً، ولا يحكم بالكرامة في ما يخالف العادة ولا يُعتد به شرعاً، والإسلام يرعى كرامة الإنسان ويحرم انتهاكها، ويرغب في إكرام الضيف والعلماء وكبار السن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
  en: "In the lexicon karama is honour; in the terminology it is an extraordinary event that appears at the hand of a person known for righteousness who does not claim prophethood. The word also means dignity, and hospitality to a guest. Most Sunni scholars allow such marvels to appear at the hands of a righteous believer, who is then called a friend of God (wali), and they say it has occurred. A claim of a thing that is impossible by custom is not accepted in law, even if it is possible by marvel. The law guards human dignity, and urges honouring guests, scholars, the elderly and those who carry the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
  ur: "کرامت لغت میں عزت ہے، اور اصطلاح میں وہ خارقِ عادت امر ہے جو کسی نیک شخص کے ہاتھ پر ظاہر ہو جو نبوت کا دعویٰ نہ کرے۔ یہ لفظ عزت و شرف اور مہمان نوازی کے معنی میں بھی آتا ہے۔ اہلِ سنت کے جمہور کے نزدیک نیک مومن کے ہاتھ پر کرامت ظاہر ہونا جائز اور واقع ہے، اور ایسے شخص کو ولی کہا جاتا ہے۔ جس بات کا عادتاً ممکن نہ ہو، وہ کرامت کے ذریعے ممکن ہونے کے باوجود شرعاً قبول نہیں کی جاتی۔ اسلام انسانی عزت کی حفاظت کرتا ہے، اور مہمان، علماء، بزرگوں اور قرآن کے حاملین کی تکریم کی ترغیب دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13238}"
