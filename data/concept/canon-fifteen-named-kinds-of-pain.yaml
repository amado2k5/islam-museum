summary:
  ar: "في الفصل العشرين يعدّد ابن سينا أصناف الوجع التي لها أسماء ويحصيها خمسة عشر جنساً، ثم يذكر سبب كل واحد منها {cite:canon-ibn-sina-print-v1 p.149}."
  en: "In chapter 20 Ibn Sina lists the kinds of pain that have names, counts fifteen genera, and then gives the cause of each {cite:canon-ibn-sina-print-v1 p.149}."
