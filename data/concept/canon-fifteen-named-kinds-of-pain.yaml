  ur: "باب 20 میں ابن سینا درد کی ان اقسام کی فہرست دیتا ہے جن کے نام ہیں، پندرہ نسلوں کو شمار کرتے ہیں، اور پھر ہر ایک کی وجہ بتاتے ہیں۔"
  tr: "Yirminci bölümde, İbn Sina isimli acı türlerini listeler ve on beş cinsi sıralar, ardından her birinin nedenini {cite:canon-ibn-sina-print-v1 s.149} açıklar."
  id: "Pada bab dua puluh, Ibn Sina mencantumkan jenis-jenis rasa sakit yang memiliki nama dan menyebutkan lima belas genus, lalu menjelaskan alasan di balik masing-masing {cite:canon-ibn-sina-print-v1 hlm.149}."
