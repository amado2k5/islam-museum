id: concept/lubiya
class: concept
kind: natural
label:
  ar: "لوبيا"
  en: "Lubiya (the cowpea or bean)"
  ur: "لوبیا"
  es: "Lubiya (el caupí o frijol)"
  fr: "Lubiya (le niébé ou le haricot)"
  tr: "fasulye"
  id: "kacang"
summary:
  ar: "اللوبيا حبّ أحمره أسخنها، رأي المؤلف أن جوهره يابس وفيه رطوبة فضلية، سريع الانهضام، نفاخ، يولد خلطاً رطباً بلغمياً ويري أحلاماً رديئة {cite:canon-ibn-sina-print-v1 p.543} {cite:canon-ibn-sina-print-v1 p.544}."
  en: "Lubiya is a pulse whose red kind is the hottest; the author holds that its substance is dry with a superfluous moisture; it digests quickly, is windy, breeds a moist phlegmy humour and brings bad dreams {cite:canon-ibn-sina-print-v1 p.543} {cite:canon-ibn-sina-print-v1 p.544}."
  ur: "لوبیا ایک دانہ ہے جس کی سرخ قسم سب سے گرم ہے؛ مؤلف کی رائے میں اس کا جوہر خشک ہے اور اس میں فاضل نمی ہے؛ جلد ہضم ہوتا ہے، ریاحی ہے، تر بلغمی خلط بناتا ہے اور برے خواب دکھاتا ہے {cite:canon-ibn-sina-print-v1 p.543} {cite:canon-ibn-sina-print-v1 p.544}۔"
  es: "Lubiya es una legumbre cuyo tipo rojo es el más caliente; el autor sostiene que su sustancia es seca con una humedad superflua; se digiere rápidamente, es flatulenta, produce un humor húmedo y flemático y trae malos sueños {cite:canon-ibn-sina-print-v1 p.543} {cite:canon-ibn-sina-print-v1 p.544}."
  fr: "Lubiya est une légumineuse dont la variété rouge est la plus chaude; l'auteur soutient que sa substance est sèche avec une humidité excessive; elle se digère rapidement, est gazeuse, engendre une humeur phlegmique humide et provoque de mauvais rêves {cite:canon-ibn-sina-print-v1 p.543} {cite:canon-ibn-sina-print-v1 p.544}."
  tr: "İnek nohutları en sıcak olan kırmızı tanelerdir. Yazar, özünün kuru olduğunu, fazla nem içerdiğini, hızla sindirildiğini, şiştiğini, nemli, mukus benzeri bir karışım oluşturduğunu ve kötü rüyalara neden olduğunu düşünür {cite:canon-ibn-sina-print-v1 s.543} {cite:canon-ibn-sina-print-v1 s.544}."
  id: "Kacang sapi adalah butiran merah yang paling pedas. Penulis percaya esensinya kering dan mengandung kelembapan berlebih, cepat dicerna, membengkak, menghasilkan campuran basah seperti lendir, dan menyebabkan mimpi buruk {cite:canon-ibn-sina-print-v1 hlm.543} {cite:canon-ibn-sina-print-v1 hlm.544}."
