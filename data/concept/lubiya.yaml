summary:
  ar: "اللوبيا حبّ أحمره أسخنها، رأي المؤلف أن جوهره يابس وفيه رطوبة فضلية، سريع الانهضام، نفاخ، يولد خلطاً رطباً بلغمياً ويري أحلاماً رديئة {cite:canon-ibn-sina-print-v1 p.543} {cite:canon-ibn-sina-print-v1 p.544}."
  en: "Lubiya is a pulse whose red kind is the hottest; the author holds that its substance is dry with a superfluous moisture; it digests quickly, is windy, breeds a moist phlegmy humour and brings bad dreams {cite:canon-ibn-sina-print-v1 p.543} {cite:canon-ibn-sina-print-v1 p.544}."
  ur: "لوبیا ایک دانہ ہے جس کی سرخ قسم سب سے گرم ہے؛ مؤلف کی رائے میں اس کا جوہر خشک ہے اور اس میں فاضل نمی ہے؛ جلد ہضم ہوتا ہے، ریاحی ہے، تر بلغمی خلط بناتا ہے اور برے خواب دکھاتا ہے {cite:canon-ibn-sina-print-v1 p.543} {cite:canon-ibn-sina-print-v1 p.544}۔"
