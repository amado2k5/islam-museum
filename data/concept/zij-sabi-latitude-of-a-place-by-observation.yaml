label: { ar: "عرض البلد بالرصد من ارتفاع الشمس نصف النهار في الزيج الصابي", en: "The latitude of a place by observation of the Sun's noon altitude", ur: "دوپہر کے سورج کے ارتفاع کی رصد سے شہر کا عرض", es: "La latitud de un lugar se determina mediante la observación de la altitud del sol al mediodía.", fr: "La latitude d'un lieu est déterminée par l'observation de l'altitude du soleil à midi.", tr: "Ülkenin genişliği, Sabi Zij'de güneşin öğle vaktindeki yüksekliğinin gözlemlenmesiyle belirlenir.", id: "Lebar negara ditentukan dengan mengamati ketinggian matahari pada tengah hari di Sabi Zij." }
summary:
  ar: "الباب الرابع عشر في عروض البلدان بالرصد: عرض البلد هو ارتفاع القطب الشمالي فيه وبعده عن معدل النهار. يرصد البتاني ارتفاع الشمس عند عبورها خط نصف النهار بالرصد أو بمعرفة الظل، ثم ينقص ميل الدرجة من الارتفاع إن كان شمالياً ويزيده إن كان جنوبياً، فيكون ارتفاع أول الحمل أو الميزان، وتمامه إلى تسعين هو عرض البلد. وما أُخذ من جدول عروض المدن تقريبي وليس كالمأخوذ بالرصد. {cite:zij-sabi-nallino-byblion pp.47-48}."
  en: "Chapter 14 concerns the latitudes of places by observation: the latitude is the altitude of the north pole there and its distance from the equator. Al-Battani takes the Sun's altitude as it crosses the meridian line, by sighting or by the shadow, subtracts the degree's declination from the altitude if northern and adds it if southern, giving the altitude of the first of Aries or Libra, and its complement to ninety is the latitude. What is taken from a table of cities' latitudes is approximate and not like what is taken by observation. {cite:zij-sabi-nallino-byblion pp.47-48}."
  ur: "چودہواں باب شہروں کے عرض کی رصد کے بارے میں ہے: شہر کا عرض وہاں قطب شمالی کی بلندی اور معدل النہار سے اس کا بعد ہے۔ البتانی سورج کا ارتفاع اس وقت لیتے ہیں جب وہ خط نصف النہار سے گزرتا ہے، رصد یا سائے کی معرفت سے، پھر اگر درجے کا میل شمالی ہو تو ارتفاع سے گھٹاتے ہیں اور جنوبی ہو تو بڑھاتے ہیں، یوں حمل یا میزان کا ارتفاع ملتا ہے، اور نوے تک اس کا تتمہ شہر کا عرض ہے۔ شہروں کے عرض کے جدول سے لیا ہوا عرض تقریبی ہے اور رصد سے لیے ہوئے جیسا نہیں۔ {cite:zij-sabi-nallino-byblion pp.47-48}۔"
  es: "El capítulo 14 trata sobre las latitudes de los lugares según la observación: la latitud es la altitud del polo norte en ese lugar y su distancia al ecuador. Al-Battani toma la altitud del Sol cuando cruza la línea meridiana, ya sea por observación directa o por la sombra, le resta la declinación del grado si es latitud norte y se la suma si es latitud sur, obteniendo así la altitud del primer día de Aries o Libra, y su complemento a noventa es la latitud. Lo que se obtiene de una tabla de latitudes de ciudades es aproximado y no se corresponde con lo que se obtiene mediante observación directa. {cite:zij-sabi-nallino-byblion pp.47-48}."
  fr: "Le chapitre 14 traite des latitudes des lieux déterminées par observation: la latitude correspond à la différence entre l’altitude du pôle Nord et sa distance à l’équateur. Al-Battani mesure l’altitude du Soleil lorsqu’il traverse le méridien, soit par observation directe, soit par l’ombre. Il soustrait ensuite la déclinaison magnétique de cette altitude si elle est au nord, et l’ajoute si elle est au sud, obtenant ainsi l’altitude du premier degré du Bélier ou de la Balance. Le complément à 90 de cette altitude correspond à la latitude. Les latitudes relevées dans les tables de latitudes des villes sont approximatives et diffèrent de celles obtenues par observation directe. {cite:zij-sabi-nallino-byblion pp.47-48}."
  tr: "On Dördüncü Bölüm: Ülkelerin Enlemleri Üzerine Gözlem: Bir ülkenin enlemi, Kuzey Kutbu'nun yüksekliği ve meridyenden uzaklığıdır. El-Battani, güneşin meridyen çizgisini geçerkenki yüksekliğini, gözlem yoluyla veya gölgeyi ölçerek belirler. Daha sonra, kuzeye doğru ise yükseklik derecesini çıkarır, güneye doğru ise ekler. Böylece, Koç veya Terazi burcunun başlangıcının yüksekliği ve doksan dereceye kadar olan bitişi, ülkenin enlemidir. Şehirlerin enlem tablosundan alınan değer yaklaşıktır ve gözlem yoluyla elde edilen değerle aynı değildir. {cite:zij-sabi-nallino-byblion pp.47-48}."
  id: "Bab Empat Belas: Tentang Garis Lintang Negara Berdasarkan Pengamatan: Garis lintang suatu negara adalah ketinggian Kutub Utara dan jaraknya dari meridian. Al-Battani mengamati ketinggian matahari saat melintasi garis meridian, baik dengan pengamatan maupun dengan mengukur bayangannya. Kemudian ia mengurangi derajat ketinggian jika berada di utara dan menambahkannya jika berada di selatan. Dengan demikian, ketinggian awal Aries atau Libra, dan penyelesaiannya hingga sembilan puluh derajat, adalah garis lintang negara tersebut. Apa yang diambil dari tabel garis lintang kota-kota bersifat perkiraan dan tidak sama dengan yang diperoleh melalui pengamatan. {cite:zij-sabi-nallino-byblion pp.47-48}."
