id: concept/khala-fiqh
class: concept
kind: term
label:
  ar: الخلاء
  en: Khala' (privy; relieving oneself)
  ur: خلاء
summary:
  ar: 'الخلاء لغة المكان الخالي ثم نقل عرفا إلى البناء المعد لقضاء الحاجة، وجمعه أخلية، ويسمى الكنيف والمرفق والمرحاض، والتخلي قضاء الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7745} من آداب التخلي عند الفقهاء أن يقدم المتخلي رجله اليسرى عند الدخول ويقول: بسم الله، اللهم إني أعوذ بك من الخبث والخبائث، لحديث أنس؛ وتفصيل الأحكام في قضاء الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7746}'
  en: 'Khala'' is lexically an empty place, then by custom the building for relief, called the privy, the place of ease or the toilet; the verb takhalla means to relieve oneself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7745} Among the manners the jurists give: enter with the left foot saying the formula of seeking refuge from evil spirits, following the report of Anas; details of relief are under the entry on relieving oneself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7746}'
  ur: خلاء لغت میں خالی جگہ ہے، پھر عرف میں اس عمارت کے لیے بولا جانے لگا جو قضائے حاجت کے لیے بنائی جاتی ہے، جسے کنیف، مرفق اور مرحاض بھی کہتے ہیں؛ تخلی قضائے حاجت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7745} فقہاء کے نزدیک آداب میں سے یہ ہے کہ داخل ہوتے وقت بایاں پاؤں پہلے رکھے اور «اللهم إني أعوذ بك من الخبث والخبائث» کہے، انس کی حدیث کی بنا پر؛ تفصیل قضائے حاجت کے مصطلح میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7746}
