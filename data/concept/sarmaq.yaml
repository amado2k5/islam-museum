summary:
  ar: "السرمق في الكتاب هو القطف، بقلة معروفة، وهي جنسان أحدهما بري والآخر بستاني، وقد يطبخ أيهما كان ويؤكل، بارد رطب في الأولى وعند بعضهم معتدل {cite:canon-ibn-sina-print-v1 p.600}."
  en: "Sarmaq is in the book the qatf, a well-known potherb of two kinds, one wild and one garden, either of which may be cooked and eaten; cold and moist in the first degree, and moderate according to some {cite:canon-ibn-sina-print-v1 p.600}."
  ur: "سرمق کتاب میں قطف ہے، ایک معروف ترکاری جس کی دو قسمیں ہیں: ایک جنگلی اور ایک باغی، دونوں پکا کر کھائی جا سکتی ہیں؛ پہلے درجے میں ٹھنڈی تر، اور بعض کے نزدیک معتدل {cite:canon-ibn-sina-print-v1 p.600}۔"
  es: "Sarmaq es en el libro el qatf, una hierba bien conocida de dos tipos, una silvestre y otra de jardín, cualquiera de las cuales puede cocinarse y comerse; fría y húmeda en primer grado, y moderada según algunos {cite:canon-ibn-sina-print-v1 p.600}."
  fr: "Le sarmaq est mentionné dans le livre qatf, une plante potagère bien connue de deux sortes, l'une sauvage et l'autre cultivée, dont l'une peut être cuite et consommée; froide et humide au premier degré, et modérée selon certains {cite:canon-ibn-sina-print-v1 p.600}."
  tr: "Kitapta 'sarmaq' 'qat' anlamına gelir ve bilinen bir kıtlık vardır. İki çeşidi vardır, biri yabani, diğeri bahçeciliktir. Her iki şekilde de pişirilip yenilebilir, soğuk ve nemli olan, bazılarında ise ılımlıdır {cite:canon-ibn-sina-print-v1 s.600}."
  id: "Dalam buku, 'sarmaq' berarti 'qat', dengan kelangkaan yang sudah dikenal. Ada dua jenis, satu liar dan satu hortikultura. Sarmaq bisa dimasak dan dimakan dengan cara apa pun, dingin dan lembap pada yang pertama, sementara pada beberapa di sini sedang {cite:canon-ibn-sina-print-v1 hlm.600}."
