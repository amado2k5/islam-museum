id: concept/umra-grant
class: concept
kind: legal
label:
  ar: "العُمْرَى"
  en: "The life-grant (umra): a gift of a thing for the lifetime of a person"
  ur: "عمرٰی (عمر بھر کا ہبہ)"
summary:
  ar: "العمرى في اللغة ما تجعله للرجل مدة عمره أو عمره، وفي الاصطلاح عند الحنفية جعل المالك شيئاً يملكه لآخر مدة حياة أحدهما، وعند المالكية والشافعية تمليك المالك شيئاً يملكه لشخص مدة حياة المعمَر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11818}. وتفترق عن الإعارة والعرية والمنحة والرقبى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819}. وهي جائزة عند الفقهاء في الجملة لحديث جابر، وهي نوع من الهبة يفتقر إلى ما تفتقر إليه الهبات من إيجاب وقبض، واختلفوا هل هي تمليك عين أو منفعة، فقال الحنفية والشافعية والحنابلة إنها تمليك عين في الحال، وقال المالكية إنها منفعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}. وقد فصّل الشافعية أحوالها، فإن قال أعمرتك الدار فإذا مت فهي لورثتك كانت هبة يعود بها الملك إلى الورثة، وإن قال جعلتها لك عمرك فقط فالجديد أنها هبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}."
  en: "In the lexicon, umra is what a man is given for the length of his life, or the lifetime of the grantor. For the Hanafis it is the owner's making a thing that he owns the possession of another for the life of one of the two; for the Malikis and Shafi'is it is the owner's giving of something he owns to a person for the life of the grantee {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11818}. It differs from loan of use, the gift of a palm's fruit, the gift of milk, and the ruqba (mutual life-grant) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819}. It is permitted in general on the report of Jabir, and it is a form of gift that needs offer and taking possession. The jurists differ on whether it transfers ownership or use: the Hanafis, Shafi'is and Hanbalis hold that it transfers ownership at once, while the Malikis hold it transfers the use {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}. The Shafi'is distinguish its forms: if the owner says 'I give you this for your life, and when you die it goes to your heirs', it is a gift with ownership passing to the heirs, and the newer Shafi'i view treats a bare grant for life as a gift {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}."
