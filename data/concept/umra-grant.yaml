id: concept/umra-grant
class: concept
kind: legal
label:
  ar: "العُمْرَى"
  en: "The life-grant (umra): a gift of a thing for the lifetime of a person"
  ur: "عمرٰی ⁦(عمر بھر کا ہبہ)⁩"
  es: "La donación vitalicia (umra): un regalo de algo para toda la vida de una persona."
  fr: "La donation viager (umra): un don d'une chose pour la durée de vie d'une personne"
  tr: "El-Omari"
  id: "Al-Omari"
summary:
  ar: "العمرى في اللغة ما تجعله للرجل مدة عمره أو عمره، وفي الاصطلاح عند الحنفية جعل المالك شيئاً يملكه لآخر مدة حياة أحدهما، وعند المالكية والشافعية تمليك المالك شيئاً يملكه لشخص مدة حياة المعمَر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11818}. وتفترق عن الإعارة والعرية والمنحة والرقبى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819}. وهي جائزة عند الفقهاء في الجملة لحديث جابر، وهي نوع من الهبة يفتقر إلى ما تفتقر إليه الهبات من إيجاب وقبض، واختلفوا هل هي تمليك عين أو منفعة، فقال الحنفية والشافعية والحنابلة إنها تمليك عين في الحال، وقال المالكية إنها منفعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}. وقد فصّل الشافعية أحوالها، فإن قال أعمرتك الدار فإذا مت فهي لورثتك كانت هبة يعود بها الملك إلى الورثة، وإن قال جعلتها لك عمرك فقط فالجديد أنها هبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}."
  en: "In the lexicon, umra is what a man is given for the length of his life, or the lifetime of the grantor. For the Hanafis it is the owner's making a thing that he owns the possession of another for the life of one of the two; for the Malikis and Shafi'is it is the owner's giving of something he owns to a person for the life of the grantee {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11818}. It differs from loan of use, the gift of a palm's fruit, the gift of milk, and the ruqba (mutual life-grant) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819}. It is permitted in general on the report of Jabir, and it is a form of gift that needs offer and taking possession. The jurists differ on whether it transfers ownership or use: the Hanafis, Shafi'is and Hanbalis hold that it transfers ownership at once, while the Malikis hold it transfers the use {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}. The Shafi'is distinguish its forms: if the owner says 'I give you this for your life, and when you die it goes to your heirs', it is a gift with ownership passing to the heirs, and the newer Shafi'i view treats a bare grant for life as a gift {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}."
  es: "En el léxico, la umra es lo que se le da a un hombre por la duración de su vida, o la vida del otorgante. Para los hanafíes, es cuando el propietario hace que otro posea algo por la vida de uno de los dos; para los malikíes y shafiíes, es cuando el propietario da algo que posee a una persona por la vida del beneficiario {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11818}. Se diferencia del préstamo de uso, el regalo del fruto de una palma, el regalo de leche y la ruqba (donación mutua de por vida) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819}. Está permitida en general según el relato de Jabir, y es una forma de donación que requiere ofrenda y toma de posesión. Los juristas difieren en cuanto a si transfiere la propiedad o el uso: los hanafíes, shafi'ís y hanbalíes sostienen que transfiere la propiedad de inmediato, mientras que los malikíes sostienen que transfiere el uso {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}. Los shafi'ís distinguen sus formas: si el propietario dice 'Te doy esto por tu vida, y cuando mueras pasará a tus herederos', es una donación con la propiedad pasando a los herederos, y la visión shafi'í más reciente trata una simple donación de por vida como una donación {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}."
  fr: "Dans le lexique, l'umra désigne un don fait à une personne pour la durée de sa vie ou celle du donateur. Pour les hanafites, il s'agit du don par le propriétaire d'un bien lui appartenant à autrui pour la durée de vie de l'un des deux; pour les malikites et les chaféites, il s'agit du don par le propriétaire d'un bien lui appartenant à une personne pour la durée de vie du bénéficiaire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11818}. Elle diffère du prêt d'usage, du don de fruits de palmier, du don de lait et de la ruqba (donation réciproque viager) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819}. Elle est généralement permise selon le hadith de Jabir et constitue une forme de don nécessitant une offre et une prise de possession. Les juristes divergent quant à savoir si le transfert porte sur la propriété ou l'usage: les hanafites, les shafi'ites et les hanbalites considèrent qu'il porte uniquement sur la propriété, tandis que les malikites estiment qu'il porte uniquement sur l'usage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}. Les shafi'ites distinguent différentes formes de transfert: si le propriétaire déclare « Je vous donne ceci pour votre vie, et à votre décès, cela reviendra à vos héritiers », il s'agit d'une donation avec transfert de propriété aux héritiers; l'avis plus récent des shafi'ites considère une simple donation à vie comme une donation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11820}."
  ur: "لغت میں، عمرہ وہ ہے جو ایک آدمی کو اس کی عمر، یا عطا کرنے والے کی زندگی بھر کے لیے دیا جاتا ہے۔ احناف کے نزدیک مالک کا ایک چیز بنانا ہے کہ وہ دونوں میں سے کسی ایک کی جان کے لیے دوسرے کی ملکیت میں رہے۔ مالکیوں اور شافعیوں کے نزدیک یہ مالک کی طرف سے عطا کرنے والے کی زندگی کے لیے کسی شخص کو اپنی ملکیت میں کچھ دینا ہے۔ یہ استعمال کے قرض، کھجور کے پھل کا تحفہ، دودھ کا تحفہ، اور رکوبہ ⁦(باہمی زندگی عطا)⁩ سے مختلف ہے۔ عام طور پر جابر کی رپورٹ پر اس کی اجازت ہے، اور یہ تحفہ کی ایک شکل ہے جس کے لیے پیش کش اور قبضے کی ضرورت ہے۔ فقہاء کا اس میں اختلاف ہے کہ آیا یہ ملکیت کو منتقل کرتا ہے یا استعمال: حنفیہ، شافعیہ اور حنبلی کا خیال ہے کہ یہ ملکیت کو ایک ہی وقت میں منتقل کرتا ہے، جبکہ مالکیہ کے نزدیک اس کے استعمال کو منتقل کیا جاتا ہے۔ شافعی اس کی شکلوں میں فرق کرتے ہیں: اگر مالک کہے کہ 'میں یہ آپ کو آپ کی زندگی کے بدلے دیتا ہوں، اور جب آپ مر جاتے ہیں تو یہ آپ کے وارثوں کو جاتا ہے'، تو یہ ایک تحفہ ہے جس کی ملکیت وارثوں کو دے دی جاتی ہے، اور نئے شافعی کا نظریہ زندگی کے لیے ایک ننگی عطیہ کو بطور تحفہ سمجھتا ہے۔"
  tr: "Dilde 'umra', bir insana yaşam süresi veya yaşı için verdiği şeydir. Hanefi terminolojisinde, sahibi kişinin hayatının son dönemi için bir şeye sahip olduğu kabul edilir. Maliki ve Şafi'lere göre, sahibin, yaşlı kişinin yaşamı boyunca sahip olduğu bir şeye sahip olmasıdır {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11818}. Bu, ödünç verme ve 'al-'irah', 'al-mawsua' ve 'al-manqabi' (atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11819} ile ayrılır. Hukukçulara göre, Cebir'in hadislerine göre genellikle kabul edilir. Bu, hediyelerin sahip olmadığı teklif ve alıntıdan yoksun bir hediye türüdür. Belirli bir mülkiyet mi yoksa bir fayda mı olduğu konusunda farklı görüşler ayrılmıştır. Hanefiler, Şafiiler ve Hanbaliler bunun bir eşyanın hemen mülkiyeti olduğunu söylerken, Malikiler bunun bir fayda olduğunu söyler. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.11819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11820}. Şafi'ler şartlarını ayrıntılı olarak belirtmişlerdir: eğer 'Evi sana inşa edeceğim, ölürsen varislerine aittir' derse, mülkiyet varislere geri döner bir hediyedir; eğer sadece hayatın için yaptığını söylerse, yeni olan hediye olmasıdır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11820}."
  id: "Dalam bahasa, 'umra' adalah apa yang diberikan kepada seseorang selama hidup atau usianya. Dalam terminologi Hanafi, pemilik dianggap memiliki sesuatu untuk periode terakhir kehidupan seseorang. Menurut Malikis dan Shafi'i, ini adalah kepemilikan pemilik atas sesuatu yang dimilikinya selama masa hidup orang tua tersebut {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11818}. Ia dibedakan dari lending dan 'al-'irah', 'al-mawsua', dan 'al-manqabi' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11819}. Menurut ahli hukum, secara umum diperbolehkan menurut hadits Jabir. Ini adalah jenis hadiah yang tidak memiliki tawaran dan penerimaan yang tidak dimiliki hadiah. Mereka berbeda apakah itu kepemilikan properti tertentu atau manfaat. Hanafi, Shafi'i, dan Hanbalis mengatakan bahwa itu adalah kepemilikan suatu barang secara langsung, sedangkan Malikis mengatakan itu adalah manfaat {sitasi::Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.11819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11820}. Para Syad'i telah merinci syarat-syaratnya: jika dia berkata, 'Aku akan membangun rumah untukmu, dan jika kamu meninggal, rumah itu milik ahli warismu,' itu adalah hadiah bahwa kepemilikan dikembalikan kepada ahli waris; jika dia mengatakan kamu membuatnya hanya untuk hidupmu, maka hal baru adalah itu adalah hadiah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11820}."
