label: { ar: "عظام الفكين والأنف عند ابن سينا", en: "Jaws and nose in the Canon", ur: "قانون میں جبڑے اور ناک", es: "Mandíbulas y nariz en el cañón", fr: "Mâchoires et nez dans le Canon", tr: "İbn Sina'ya göre çene kemikleri ve burun", id: "Tulang rahang dan hidung menurut Ibn Sina" }
summary:
  ar: "في الفصل الرابع من باب العظام يصف ابن سينا حدود الفك الأعلى ودروزه، ثم يعدّد منافع الأنف الثلاث وتركيب عظامه، ثم يوجز القول في الفك الأسفل {cite:canon-ibn-sina-print-v1 pp.45-46}."
  en: "In the fourth chapter on bones Ibn Sina describes the limits and sutures of the upper jaw, then lists the three uses of the nose and the make-up of its bones, and then speaks briefly of the lower jaw {cite:canon-ibn-sina-print-v1 pp.45-46}."
  es: "En el cuarto capítulo sobre los huesos, Ibn Sina describe los límites y las suturas de la mandíbula superior, luego enumera los tres usos de la nariz y la composición de sus huesos, y luego habla brevemente de la mandíbula inferior {cite:canon-ibn-sina-print-v1 pp.45-46}."
  fr: "Dans le quatrième chapitre sur les os, Ibn Sina décrit les limites et les sutures de la mâchoire supérieure, puis énumère les trois usages du nez et la composition de ses os, puis parle brièvement de la mâchoire inférieure {cite:canon-ibn-sina-print-v1 pp.45-46}."
  ur: "ہڈیوں کے چوتھے باب میں ابن سینا نے اوپری جبڑے کی حدود اور سیون کا ذکر کیا ہے، پھر ناک کے تین استعمال اور اس کی ہڈیوں کی تشکیل کی فہرست دی ہے، اور پھر نچلے جبڑے کے بارے میں مختصراً کہا ہے۔"
  tr: "Kemikler üzerine bölümün dördüncü bölümünde, İbn Sina üst çenenin ve dikişlerinin sınırlarını açıklar, ardından burnun üç faydasını ve kemik yapısını sıralar ve ardından alt çene hakkındaki tartışmayı özetler {cite:canon-ibn-sina-print-v1 s.45-46}."
  id: "Pada bab keempat bab tentang tulang, Ibn Sina menjelaskan batas rahang atas dan jahitannya, kemudian merangkum tiga manfaat hidung dan struktur tulangnya, lalu merangkum pembahasan tentang rahang bawah {cite:canon-ibn-sina-print-v1 hlm.45-46}."
