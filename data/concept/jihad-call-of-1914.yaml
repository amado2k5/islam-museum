label: { ar: "نداء الجهاد سنة 1914", en: "The jihad call of 1914" }
summary:
  ar: "يعرض شكيب أرسلان في فصل الجامعة الإسلامية ما جرى بعد إعلان السلطان العثماني دعوته للجهاد في أواخر سنة 1914م بعد دخول تركيا الحرب. يذكر أن الحلفاء صوّروا الدعوة كصرخة في واد، لكنه يرى أن الواقع كان على خلاف ذلك، وأن المسلمين في مناطق كثيرة تفاعلوا معها وإن تأخرت الاستجابة في الظاهر. ويربط ذلك بتقييم المسلمين لتركيا وألمانيا في الحرب، ويعرض رأيه في أن قادة المسلمين كانوا يدركون حدود قوة الدولة العثمانية في تلك الظروف. هذا عرض لرأي المؤلف ولشهاداته، ويحتاج إلى مراجعة بالوثائق العثمانية والبريطانية والفرنسية."
  en: "After the Ottoman sultan declared jihad in late 1914, Arslan says the Allies portrayed the call as a cry in the wilderness, while in his view the response was greater than reported, though slower to appear in public. He links this to how Muslim leaders saw the Ottoman state's limits and its alliance with Germany. This is his reading of the evidence and needs checking against Ottoman, British and French documents."
