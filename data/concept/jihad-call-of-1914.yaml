id: concept/jihad-call-of-1914
class: concept
kind: political
label: { ar: "نداء الجهاد سنة 1914", en: "The jihad call of 1914", es: "El llamado a la yihad de 1914", fr: "L'appel au djihad de 1914", ur: "1914 کی جہاد کی کال" }
summary:
  ar: "يعرض شكيب أرسلان في فصل الجامعة الإسلامية ما جرى بعد إعلان السلطان العثماني دعوته للجهاد في أواخر سنة 1914م بعد دخول تركيا الحرب. يذكر أن الحلفاء صوّروا الدعوة كصرخة في واد، لكنه يرى أن الواقع كان على خلاف ذلك، وأن المسلمين في مناطق كثيرة تفاعلوا معها وإن تأخرت الاستجابة في الظاهر. ويربط ذلك بتقييم المسلمين لتركيا وألمانيا في الحرب، ويعرض رأيه في أن قادة المسلمين كانوا يدركون حدود قوة الدولة العثمانية في تلك الظروف. هذا عرض لرأي المؤلف ولشهاداته، ويحتاج إلى مراجعة بالوثائق العثمانية والبريطانية والفرنسية."
  en: "After the Ottoman sultan declared jihad in late 1914, Arslan says the Allies portrayed the call as a cry in the wilderness, while in his view the response was greater than reported, though slower to appear in public. He links this to how Muslim leaders saw the Ottoman state's limits and its alliance with Germany. This is his reading of the evidence and needs checking against Ottoman, British and French documents."
  es: "Tras la declaración de la yihad por parte del sultán otomano a finales de 1914, Arslan afirma que los Aliados presentaron el llamamiento como un grito en el desierto, mientras que, en su opinión, la respuesta fue mayor de lo que se informó, aunque tardó en manifestarse públicamente. Relaciona esto con la percepción que tenían los líderes musulmanes sobre las limitaciones del Estado otomano y su alianza con Alemania. Esta es su interpretación de las pruebas y requiere ser contrastada con documentos otomanos, británicos y franceses."
  fr: "Après la déclaration du jihad par le sultan ottoman fin 1914, Arslan affirme que les Alliés ont présenté cet appel comme un cri dans le désert, alors que selon lui, la mobilisation fut plus importante que ce qui a été rapporté, même si elle s'est manifestée publiquement plus tard. Il attribue ce phénomène à la perception qu'avaient les dirigeants musulmans des limites de l'État ottoman et de son alliance avec l'Allemagne. Cette interprétation des faits doit être confrontée aux documents ottomans, britanniques et français."
  ur: "1914 کے اواخر میں عثمانی سلطان کے اعلان جہاد کے بعد، ارسلان کا کہنا ہے کہ اتحادیوں نے اس پکار کو بیابان میں ایک پکار کے طور پر پیش کیا، جب کہ ان کے خیال میں ردعمل رپورٹ سے زیادہ تھا، اگرچہ عوام میں ظاہر ہونے میں سست تھا۔ وہ اسے اس بات سے جوڑتا ہے کہ مسلم رہنماؤں نے کس طرح عثمانی ریاست کی حدود اور جرمنی کے ساتھ اس کے اتحاد کو دیکھا۔ یہ اس کا ثبوت کا مطالعہ ہے اور اسے عثمانی، برطانوی اور فرانسیسی دستاویزات کے خلاف جانچ پڑتال کی ضرورت ہے۔"
