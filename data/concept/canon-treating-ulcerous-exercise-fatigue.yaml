id: concept/canon-treating-ulcerous-exercise-fatigue
class: concept
kind: scientific
label: { ar: "علاج الإعياء القروحي الرياضي عند ابن سينا", en: "Treating ulcerous exercise fatigue in the Canon", ur: "ورزشی قروحی تھکن کا علاج قانون میں", es: "Tratamiento de la fatiga ulcerosa por ejercicio en el Canon", fr: "Traitement de la fatigue d'effort ulcéreuse dans le Canon" }
summary:
  ar: "يفتتح ابن سينا الفصل الرابع عشر في علاج الإعياء الرياضي بأن العناية به أمان من أمراض كثيرة منها الحميات، ثم يصف تدبير القروحي منه بإنقاص الرياضة والاستفراغ والدلك بالدهن ثم رياضة الاسترداد {cite:canon-ibn-sina-print-v1 p.244}."
  en: "Ibn Sina opens the fourteenth chapter, on treating exercise fatigue, by saying that care for it is a safeguard against many illnesses, fevers among them, and then sets out the regimen for the ulcerous kind: less exercise, evacuation, rubbing with oil, then restorative exercise {cite:canon-ibn-sina-print-v1 p.244}."
  es: "Ibn Sina abre el capítulo catorce, sobre el tratamiento de la fatiga por ejercicio, diciendo que cuidarla es una protección contra muchas enfermedades, entre ellas las fiebres, y luego expone el régimen para el tipo ulceroso: menos ejercicio, evacuación, frotamiento con aceite y luego ejercicio restaurativo {cite:canon-ibn-sina-print-v1 p.244}."
  fr: "Ibn Sina ouvre le quatorzième chapitre, sur le traitement de la fatigue due à l'exercice, en disant que s'en occuper est une protection contre de nombreuses maladies, dont les fièvres, puis expose le régime pour le type ulcéreux: moins d'exercice, évacuation, friction à l'huile, puis exercice réparateur {cite:canon-ibn-sina-print-v1 p.244}."
  ur: "ابن سینا نے چودھویں باب کا آغاز ورزش کی تھکاوٹ کے علاج پر یہ کہتے ہوئے کیا ہے کہ اس کی دیکھ بھال بہت سی بیماریوں، ان میں سے بخار سے حفاظت ہے، اور پھر السر کی قسم کا طریقہ بتاتا ہے: کم ورزش، انخلاء، تیل سے مالش، پھر بحالی ورزش۔"
