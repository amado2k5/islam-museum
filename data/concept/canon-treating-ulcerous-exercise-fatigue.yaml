summary:
  ar: "يفتتح ابن سينا الفصل الرابع عشر في علاج الإعياء الرياضي بأن العناية به أمان من أمراض كثيرة منها الحميات، ثم يصف تدبير القروحي منه بإنقاص الرياضة والاستفراغ والدلك بالدهن ثم رياضة الاسترداد {cite:canon-ibn-sina-print-v1 p.244}."
  en: "Ibn Sina opens the fourteenth chapter, on treating exercise fatigue, by saying that care for it is a safeguard against many illnesses, fevers among them, and then sets out the regimen for the ulcerous kind: less exercise, evacuation, rubbing with oil, then restorative exercise {cite:canon-ibn-sina-print-v1 p.244}."
