id: concept/idtirar-darura
class: concept
kind: legal
label:
  ar: "الاضطرار والضرورة في الحلال والحرام"
  en: "Necessity and the forbidden"
  ur: "اضطرار اور ضرورت: حلال و حرام میں"
  es: "La necesidad y lo prohibido"
  fr: "Nécessité et interdit"
summary:
  ar: "يجمع هذا السجل ما ورد عن الاضطرار والضرورة في باب الحلال والحرام. فآيات التحريم تعدّد الميتة والدم ولحم الخنزير ثم تستثني من دفعته الضرورة دون رغبة أو تجاوز [[passage/quran-2-173|البقرة 173]] {cite:tanzil-quran}. ويروي [[passage/abudawud-api-3840|سنن أبي داود 3840]] أن جماعة أكلوا من دابة بحرية وقد اضطروا فقال لهم أبو عبيدة كلوا {cite:sunan-abi-dawud 3840}، وفي [[passage/abudawud-api-3874|سنن أبي داود 3874]] نهي عن التداوي بحرام {cite:sunan-abi-dawud 3874}. وفي مصنف ابن أبي شيبة عن أبي جعفر أن من اضطر إلى ما حُرّم عليه فهو له حلال {cite:al-musannaf-ibn-abi-shayba p.4819}، وينقل سيد سابق عن ابن حزم أن المحرم يعود حراماً إذا وجد المضطر الحلال {cite:sabiq-fiqh-al-sunnah p.21}."
  en: "This record gathers what is recorded on necessity in the matter of the lawful and the forbidden. The verses of prohibition list carrion, blood and swine flesh and then except the person driven by necessity, without wanting it or exceeding its measure [[passage/quran-2-173|al-Baqara 173]] {cite:tanzil-quran}. [[passage/abudawud-api-3840|Sunan Abi Dawud 3840]] tells of a party who ate from a sea creature when compelled, Abu 'Ubayda telling them to eat {cite:sunan-abi-dawud 3840}, and [[passage/abudawud-api-3874|Sunan Abi Dawud 3874]] forbids treatment with the forbidden {cite:sunan-abi-dawud 3874}. The Musannaf of Ibn Abi Shayba has Abu Ja'far saying that what was forbidden becomes lawful to the compelled {cite:al-musannaf-ibn-abi-shayba p.4819}, and Sayyid Sabiq quotes Ibn Hazm that the forbidden reverts to forbidden once the lawful is found {cite:sabiq-fiqh-al-sunnah p.21}."
  ur: "یہ اندراج حلال و حرام کے باب میں اضطرار اور ضرورت کے بارے میں مذکور مواد جمع کرتا ہے۔ تحریم کی آیات مردار، خون اور سور کا گوشت گنواتی ہیں اور پھر اس شخص کو مستثنیٰ کرتی ہیں جسے ضرورت مجبور کر دے، بغیر خواہش اور بغیر تجاوز کے [[passage/quran-2-173|البقرہ 173]] {cite:tanzil-quran}۔ [[passage/abudawud-api-3840|سنن ابی داود 3840]] میں ایک جماعت کا ذکر ہے جس نے مجبوری میں بحری جانور سے کھایا اور ابو عبیدہ نے انہیں کھانے کو کہا {cite:sunan-abi-dawud 3840}، اور [[passage/abudawud-api-3874|سنن ابی داود 3874]] حرام سے علاج سے منع کرتی ہے {cite:sunan-abi-dawud 3874}۔ مصنف ابن ابی شیبہ میں ابو جعفر کہتے ہیں کہ مجبور کے لیے حرام حلال ہو جاتا ہے {cite:al-musannaf-ibn-abi-shayba p.4819}، اور سید سابق ابن حزم سے نقل کرتے ہیں کہ حلال ملنے پر وہ حرام پھر حرام ہو جاتا ہے {cite:sabiq-fiqh-al-sunnah p.21}۔"
  es: "Este registro reúne lo que está registrado sobre la necesidad en materia de lo lícito y lo ilícito. Los versículos de prohibición enumeran la carroña, la sangre y la carne de cerdo y luego exceptúan a la persona obligada por necesidad, sin desearlo ni exceder su medida [[passage/quran-2-173|al-Baqara 173]] {cite:tanzil-quran}. [[passage/abudawud-api-3840|Sunan Abi Dawud 3840]] dice de un grupo que comió de una criatura marina cuando fue obligado, Abu 'Ubayda les dijo que comieran {cite:sunan-abi-dawud 3840}, y [[passage/abudawud-api-3874|Sunan Abi Dawud 3874]] prohíbe el trato con lo ilícito {cite:sunan-abi-dawud 3874}. El Musannaf de Ibn Abi Shayba tiene a Abu Ja'far diciendo que lo que estaba prohibido se vuelve lícito para el obligado {cite:al-musannaf-ibn-abi-shayba p.4819}, y Sayyid Sabiq cita a Ibn Hazm diciendo que lo prohibido vuelve a ser prohibido una vez que se encuentra lo lícito {cite:sabiq-fiqh-al-sunnah p.21}."
  fr: "Ce recueil rassemble les passages relatifs à la nécessité, concernant le licite et l'illicite. Les versets d'interdiction mentionnent la charogne, le sang et la chair de porc, sauf pour la personne contrainte par la nécessité, sans désir ni excès [[passage/quran-2-173|al-Baqara 173]] {cite:tanzil-quran}. [[passage/abudawud-api-3840|Sunan Abi Dawud 3840]] relate l'histoire d'un groupe qui, contraint et forcé, mangea de la chair d'une créature marine, Abu 'Ubayda les y ayant incités {cite:sunan-abi-dawud 3840}. Enfin, [[passage/abudawud-api-3874|Sunan Abi Dawud 3874]] interdit tout traitement avec ce qui est illicite {cite:sunan-abi-dawud 3874}. Le Musannaf d'Ibn Abi Shayba rapporte qu'Abu Ja'far dit que ce qui était interdit devient licite pour celui qui y est contraint {cite:al-musannaf-ibn-abi-shayba p.4819}, et Sayyid Sabiq cite Ibn Hazm selon lequel l'interdit redevient interdit une fois que le licite est trouvé {cite:sabiq-fiqh-al-sunnah p.21}."
