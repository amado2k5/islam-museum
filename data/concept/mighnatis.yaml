summary:
  ar: "المغناطيس الحجر الذي يجذب الحديد، أجوده الأسود المشرب حمرة الخالص، جال منق، ويقال إنه يجذب خبث الحديد من البطن {cite:canon-ibn-sina-print-v1 p.562}."
  en: "Mighnatis is the stone that draws iron, the best being black tinged with red and pure; cleansing and purifying, it is said to draw iron filth out of the belly {cite:canon-ibn-sina-print-v1 p.562}."
  ur: "مغناطیس وہ پتھر ہے جو لوہے کو کھینچتا ہے، بہترین سیاہ سرخی مائل خالص ہے؛ جلا دینے والا اور صاف کرنے والا، کہا جاتا ہے کہ پیٹ سے لوہے کا میل کھینچ لیتا ہے {cite:canon-ibn-sina-print-v1 p.562}۔"
  es: "Mighnatis es la piedra que extrae el hierro, siendo la mejor la negra teñida de rojo y pura; limpiadora y purificadora, se dice que extrae la suciedad de hierro del vientre {cite:canon-ibn-sina-print-v1 p.562}."
