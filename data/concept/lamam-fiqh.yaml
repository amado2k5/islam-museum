id: concept/lamam-fiqh
class: concept
kind: legal
label:
  ar: "لَمَم"
  en: "Lamam (minor sins and near-sins)"
  ur: "لمم"
summary:
  ar: "اللمم في اللغة الجمع وصغار الذنوب ومقاربة الذنب من غير إيقاع فعل؛ واصطلاحاً ما دون الوطء من القبلة والغمزة والنظرة والمضاجعة، وقال أبو هريرة وابن عباس والشعبي إنه كل ما دون الزنى، وقال القرطبي إنه الصغائر التي لا يسلم منها إلا من عصمه الله {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13706}."
  en: "Lamam, in lexicon, is gathering, minor sins, and coming near a sin without doing it; in technical use it is what falls short of intercourse, such as a kiss, a glance, a look or lying together. Ibn Abbas and al-Sha'bi held it is everything short of fornication, and al-Qurtubi that it is the minor sins no one is free from except those God protects {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13706}."
  ur: "لمم لغت میں جمع کرنے، چھوٹے گناہوں اور گناہ کے قریب جانے کو کہتے ہیں جبکہ اسے کیا نہ جائے؛ اصطلاح میں وطء سے کم کی چیزیں، جیسے بوسہ، اشارہ، نظر اور ساتھ لیٹنا۔ ابن عباس، ابو هریرہ اور شعبی نے کہا کہ یہ زنا کے سوا ہر گناہ ہے، اور قرطبی نے کہا کہ یہ وہ صغیرہ گناہ ہیں جن سے وہی بچتا ہے جسے اللہ محفوظ رکھے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13706}۔"
