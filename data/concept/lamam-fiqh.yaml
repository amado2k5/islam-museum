id: concept/lamam-fiqh
class: concept
kind: legal
label:
  ar: "لَمَم"
  en: "Lamam (minor sins and near-sins)"
  ur: "لمم"
  es: "Lamam (pecados menores y casi pecados)"
  fr: "Lamam (péchés mineurs et quasi-péchés)"
  tr: "lmm"
  id: "lmm"
summary:
  ar: "اللمم في اللغة الجمع وصغار الذنوب ومقاربة الذنب من غير إيقاع فعل؛ واصطلاحاً ما دون الوطء من القبلة والغمزة والنظرة والمضاجعة، وقال أبو هريرة وابن عباس والشعبي إنه كل ما دون الزنى، وقال القرطبي إنه الصغائر التي لا يسلم منها إلا من عصمه الله {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13706}."
  en: "Lamam, in lexicon, is gathering, minor sins, and coming near a sin without doing it; in technical use it is what falls short of intercourse, such as a kiss, a glance, a look or lying together. Ibn Abbas and al-Sha'bi held it is everything short of fornication, and al-Qurtubi that it is the minor sins no one is free from except those God protects {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13706}."
  ur: "لمم لغت میں جمع کرنے، چھوٹے گناہوں اور گناہ کے قریب جانے کو کہتے ہیں جبکہ اسے کیا نہ جائے؛ اصطلاح میں وطء سے کم کی چیزیں، جیسے بوسہ، اشارہ، نظر اور ساتھ لیٹنا۔ ابن عباس، ابو هریرہ اور شعبی نے کہا کہ یہ زنا کے سوا ہر گناہ ہے، اور قرطبی نے کہا کہ یہ وہ صغیرہ گناہ ہیں جن سے وہی بچتا ہے جسے اللہ محفوظ رکھے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13706}۔"
  es: "Lamam, en el léxico, es la reunión, los pecados menores y el acercarse a un pecado sin cometerlo; en el uso técnico, es lo que no llega a ser una relación sexual, como un beso, una mirada, una expresión o acostarse juntos. Ibn Abbas y al-Sha'bi sostenían que es todo lo que no llega a ser fornicación, y al-Qurtubi que son los pecados menores de los que nadie está exento excepto aquellos a quienes Dios protege {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13706}."
  fr: "Le terme « lamam », dans le lexique, désigne l'accumulation de petits péchés, l'acte de s'approcher du péché sans le commettre; au sens strict, il s'agit de ce qui n'implique pas de rapport sexuel, comme un baiser, un regard, un simple coup d'œil ou le fait de coucher ensemble. Ibn Abbas et al-Sha'bi estimaient qu'il englobait tout ce qui n'est pas la fornication, tandis qu'al-Qurtubi considérait qu'il s'agissait des petits péchés dont nul n'est exempt, sauf ceux que Dieu protège (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13706)."
  tr: "Dilde 'lamm' çoğul, küçük günahlar ve 'eylemin ritmi olmadan karibab al-sin'dir; teknik olarak, öpüşme, göz kırpma, bakma ve cinsel ilişki gibi cinsel ilişkiden daha az bir şeydir. Ebu Huraira, İbn Abbas ve El-Şa'bi bunun zina olmadığını söylerken, El-Qurtubi bunun sadece Allah'ın koruduğu küçük eylemlerden korunduğunu söylemiştir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13706}."
  id: "Dalam bahasa, 'lamm' adalah jamak, dosa kecil, dan 'qaribab al-sin tanpa irama tindakan'; secara teknis, itu adalah sesuatu yang kurang dari hubungan seks, seperti ciuman, kedipan mata, tatapan, dan hubungan seks. Abu Huraira, Ibn Abbas, dan Al-Sha'bi mengatakan itu adalah sesuatu yang kurang dari perselingkuhan, dan Al-Qurtubi mengatakan bahwa itu adalah perbuatan kecil yang hanya aman dari mereka yang dilindungi Allah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13706}."
