id: concept/amir-al-umara
class: concept
kind: political
label:
  ar: إمرة الأمراء
  en: Amir al-Umara — the over-commandership
summary:
  ar: "لقب سياسي جامع تلقّاه أوّل من تلقّاه بحسب مسكويه هارون بن غريب عام 316هـ في خلافة المقتدر، ثم صار باباً للدولة الجديدة حين سلّم الراضي مقاليد الأمور لمحمد بن رائق فاستقل أمير الأمراء بتولية الولاة وعزلهم وتدبير الخراج والضياع والمملكة كلها وخُطب له على المنابر وكُنِّي وأُنفذت إليه الخلع واللواء، فعلت مكانته على الوزير وأصبح الخليفة لا يملك من الأمر شيئاً — وهو المنصب الذي انتقل بعده إلى بجكم ثم إلى أحمد بن بويه الذي لُقّب معز الدولة وحكم بغداد نيابة عن الخلافة نحو قرن."
  en: "The office that swallowed the vizierate: according to Miskawayh, first conferred on Harun ibn Gharib in 316 under al-Muqtadir; when al-Radi handed all affairs to Muhammad ibn Ra'iq the amir al-umara appointed and dismissed governors, farmed kharaj and estates, had khutba and kunya and banner — the caliph holding nothing of rule — the title passing to Bajkam then to Ahmad ibn Buya, Mu'izz al-Dawla, who ran Baghdad for the Buyids nearly a century."
