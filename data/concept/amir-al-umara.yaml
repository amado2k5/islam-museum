id: concept/amir-al-umara
class: concept
kind: political
label:
  ar: إمرة الأمراء
  en: Amir al-Umara — the over-commandership
  fr: "Amir al-umara, le commandement suprême"
  es: "Amir al-Umara — el comandante supremo"
  ur: "امیر العمرہ - اوور کمانڈر شپ"
summary:
  ar: "لقب سياسي جامع تلقّاه أوّل من تلقّاه بحسب مسكويه هارون بن غريب عام 316هـ في خلافة المقتدر، ثم صار باباً للدولة الجديدة حين سلّم الراضي مقاليد الأمور لمحمد بن رائق فاستقل أمير الأمراء بتولية الولاة وعزلهم وتدبير الخراج والضياع والمملكة كلها وخُطب له على المنابر وكُنِّي وأُنفذت إليه الخلع واللواء، فعلت مكانته على الوزير وأصبح الخليفة لا يملك من الأمر شيئاً — وهو المنصب الذي انتقل بعده إلى بجكم ثم إلى أحمد بن بويه الذي لُقّب معز الدولة وحكم بغداد نيابة عن الخلافة نحو قرن."
  en: "The office that swallowed the vizierate: according to Miskawayh, first conferred on Harun ibn Gharib in 316 under al-Muqtadir; when al-Radi handed all affairs to Muhammad ibn Ra'iq the amir al-umara appointed and dismissed governors, farmed kharaj and estates, had khutba and kunya and banner — the caliph holding nothing of rule — the title passing to Bajkam then to Ahmad ibn Buya, Mu'izz al-Dawla, who ran Baghdad for the Buyids nearly a century."
  fr: "La charge qui absorba le vizirat : selon Miskawayh, elle fut conférée pour la première fois à Harun ibn Gharib en 316 sous al-Muqtadir ; lorsque al-Radi remit toutes les affaires à Muhammad ibn Ra’iq, l’amir al-umara nommait et révoquait les gouverneurs, affermait le kharaj et les domaines, recevait la khutba, la kunya et l’étendard, le calife ne détenant plus rien du pouvoir ; le titre passa ensuite à Bajkam, puis à Ahmad ibn Buya, Mu’izz al-Dawla, qui gouverna Bagdad pour les Bouyides pendant près d’un siècle."
  es: "El cargo que absorbió al visirato: según Miskawayh, fue conferido por primera vez a Harun ibn Gharib en 316 bajo al-Muqtadir; cuando al-Radi entregó todos los asuntos a Muhammad ibn Ra'iq, el emir al-umara nombró y destituyó gobernadores, administró tierras y propiedades, tuvo jutba, kunya y estandarte —el califa no ostentaba ningún poder— el título pasó a Bajkam y luego a Ahmad ibn Buya, Mu'izz al-Dawla, quien gobernó Bagdad para los Buyíes durante casi un siglo."
  ur: "وہ دفتر جس نے وزیریٹ کو نگل لیا: مسکاوی کے مطابق، سب سے پہلے ہارون بن غریب کو 316 میں المقتدیر کے تحت عطا کیا گیا۔ جب الرعدی نے تمام امور محمد بن رقیق کو سونپ دیے امیر العمرہ مقرر اور برطرف گورنر، خوارج اور جاگیریں کھیتیں، خطبہ اور کنیہ اور جھنڈا تھا - جس خلیفہ کے پاس حکمرانی کی کوئی چیز نہیں تھی - لقب بزقم کو پھر احمد ابن بویا، معیز الدعوۃ کے پاس جو بعث الدعوۃ کے قریب تھا۔"
