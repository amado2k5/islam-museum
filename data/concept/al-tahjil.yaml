label: { ar: التحجيل, en: "Al-tahjil (white on the legs)" }
summary:
  ar: "التحجيل: البياض في القوائم، ويُسمّى بعدد القوائم ونوعها: المحجل الأربع، والمحجل الرجلين، والمحجل الثلاث المطلق، والأعصم اليد والأعصم اليدين؛ ويُسمّى ارتفاعه الجورب القصير والجورب الطويل (المجبّب) والمسرول."
  en: "Al-tahjil: white on the legs, named by how many legs and which: al-muhajjal al-arba' (all four), al-rijlayn (hind legs), al-muhajjal al-thalath al-mutlaq, al-a'sam al-yad and al-a'sam al-yadayn. Its height is named as the short sock, the long sock (al-mujabbab) or al-masrul."
