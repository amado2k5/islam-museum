label: { ar: التحجيل, en: "Al-tahjil (white on the legs)", es: "Al-tahjil (blanco en las piernas)", fr: "Al-tahjil (blanc sur les jambes)", ur: "التہجل ⁦(ٹانگوں پر سفید)⁩" }
summary:
  ar: "التحجيل: البياض في القوائم، ويُسمّى بعدد القوائم ونوعها: المحجل الأربع، والمحجل الرجلين، والمحجل الثلاث المطلق، والأعصم اليد والأعصم اليدين؛ ويُسمّى ارتفاعه الجورب القصير والجورب الطويل ⁦(المجبّب)⁩ والمسرول."
  en: "Al-tahjil: white on the legs, named by how many legs and which: al-muhajjal al-arba' (all four), al-rijlayn (hind legs), al-muhajjal al-thalath al-mutlaq, al-a'sam al-yad and al-a'sam al-yadayn. Its height is named as the short sock, the long sock (al-mujabbab) or al-masrul."
  es: "Al-tahjil: blanco en las patas, nombrado según la cantidad y el tipo de patas: al-muhajjal al-arba' (las cuatro), al-rijlayn (patas traseras), al-muhajjal al-thalath al-mutlaq, al-a'sam al-yad y al-a'sam al-yadayn. Su altura se denomina calcetín corto, calcetín largo (al-mujabbab) o al-masrul."
  fr: "Al-tahjil: blanc sur les pattes, désigné par le nombre et le type de pattes: al-muhajjal al-arba' (les quatre), al-rijlayn (les pattes arrière), al-muhajjal al-thalath al-mutlaq, al-a'sam al-yad et al-a'sam al-yadayn. Sa hauteur est appelée chaussette courte, chaussette longue (al-mujabbab) ou al-masrul."
  ur: "التہجل: ٹانگوں پر سفید، جس کا نام کتنی ٹانگوں پر رکھا گیا ہے اور جن کا نام ہے: المحجال اربع ⁦(چاروں)⁩، الرجلین ⁦(پچھلی ٹانگیں)⁩، المحجال الثالث المطلق، الاعصام الید اور الاعصام الیدین۔ اس کی اونچائی کو مختصر جراب، لمبی جراب ⁦(المجباب)⁩ یا المسرول کا نام دیا گیا ہے۔"
