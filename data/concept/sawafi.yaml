label:
  ar: الصوافي
  en: Sawafi (the crown lands of the Sawad)
summary:
  ar: "الصوافي عند البلاذري ما أصفاه عمر بن الخطاب من أرض السواد للمسلمين ولم يقرها في أيدي أهلها ولم يضع عليها خراجاً معتاداً: عدّها ابن أبي حرة عن أبيه عشراً — أرض من قتل في الحرب وأرض من هرب وكل أرض كسرى وكل أرض لأهل بيته وكل مغيض ماء وكل دير يزيد وكل صافية اصطفاها كسرى وأرض الجالية — فبلغت صوافيه سبعة آلاف ألف درهم وظلت كذلك حتى وقعت الجماجم أيام الحجاج فاحترق الديوان فأخذ كل قوم ما يليهم ومنها اقتطع عثمان بن عفان أول قطائع العراق كما يقول موسى بن طلحة."
  en: "Sawafi in al-Baladhuri is what Umar set apart from the Sawad's land for the Muslims — neither left in its holders' hands nor laid under the customary kharaj: Abd al-Malik ibn Abi Hurra counts ten heads from his father — land of those killed in the war, of those who fled, all Khusraw's land and all his family's, every water-sink, every monastery of Yazid, every safiyya Khusraw had appropriated, and the Jalandima land — reaching seven million dirhams' revenue and remaining so until the Jamajim in al-Hajjaj's days, when the register burned and each people took what adjoined them; from these Uthman made Iraq's first land-grants, as Musa ibn Talha says."
