id: concept/sawafi
class: concept
kind: legal
label:
  ar: الصوافي
  en: Sawafi (the crown lands of the Sawad)
  es: "Sawafi (las tierras de la corona de Sawad)"
  fr: "Sawafi (les terres de la couronne des Sawad)"
summary:
  ar: "الصوافي عند البلاذري ما أصفاه عمر بن الخطاب من أرض السواد للمسلمين ولم يقرها في أيدي أهلها ولم يضع عليها خراجاً معتاداً: عدّها ابن أبي حرة عن أبيه عشراً — أرض من قتل في الحرب وأرض من هرب وكل أرض كسرى وكل أرض لأهل بيته وكل مغيض ماء وكل دير يزيد وكل صافية اصطفاها كسرى وأرض الجالية — فبلغت صوافيه سبعة آلاف ألف درهم وظلت كذلك حتى وقعت الجماجم أيام الحجاج فاحترق الديوان فأخذ كل قوم ما يليهم ومنها اقتطع عثمان بن عفان أول قطائع العراق كما يقول موسى بن طلحة."
  en: "Sawafi in al-Baladhuri is what Umar set apart from the Sawad's land for the Muslims — neither left in its holders' hands nor laid under the customary kharaj: Abd al-Malik ibn Abi Hurra counts ten heads from his father — land of those killed in the war, of those who fled, all Khusraw's land and all his family's, every water-sink, every monastery of Yazid, every safiyya Khusraw had appropriated, and the Jalandima land — reaching seven million dirhams' revenue and remaining so until the Jamajim in al-Hajjaj's days, when the register burned and each people took what adjoined them; from these Uthman made Iraq's first land-grants, as Musa ibn Talha says."
  es: "Sawafi en al-Baladhuri es lo que Umar apartó de la tierra de Sawad para los musulmanes, que no quedó en manos de sus poseedores ni se puso bajo el kharaj habitual: Abd al-Malik ibn Abi Hurra cuenta diez cabezas de su padre: tierra de los muertos en la guerra, de los que huyeron, toda la tierra de Khusraw y toda la de su familia, cada pozo de agua, cada monasterio de Yazid, cada safiyya que Khusraw se había apropiado, y la tierra de Jalandima, que alcanzó los siete millones de dirhams de ingresos y se mantuvo así hasta los Jamajim en los días de al-Hajjaj, cuando el registro se quemó y cada pueblo tomó lo que le era colindante; de estas Uthman hizo las primeras concesiones de tierras de Irak, como dice Musa ibn Talha."
  fr: "Sawafi, dans al-Baladhuri, désigne ce qu'Umar a mis de côté des terres de Sawad pour les musulmans — ni laissé entre les mains de ses détenteurs ni placé sous le kharaj coutumier: Abd al-Malik ibn Abi Hurra compte dix têtes à partir de son père — les terres de ceux qui sont morts pendant la guerre, de ceux qui ont fui, toutes les terres de Khusraw et de toute sa famille, chaque puits, chaque monastère de Yazid, chaque safiyya que Khusraw s'était appropriée, et les terres de Jalandima — atteignant un revenu de sept millions de dirhams et restant à ce niveau jusqu'aux Jamajim à l'époque d'al-Hajjaj, lorsque le registre a brûlé et que chaque peuple a pris ce qui lui était adjacent; c'est à partir de là qu'Uthman a fait les premières concessions de terres d'Irak, comme le dit Musa ibn Talha."
