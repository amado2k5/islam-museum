summary:
  ar: "هزي إليك بجذع النخلة تساقط عليك رطباً جنياً قيل لمريم حين جاءها المخاض إلى جذعها، وباسقات لها طلع نضيد، وفي الجنة نخل ورمان، وفيها زكاة ومساقاة عند الفقهاء."
  en: "'Shake the trunk of the palm and fresh ripe dates will drop on you' — said to Mary when the pangs drove her to its trunk; tall palms with clustered sheaths; in Paradise palms and pomegranates; and over it the jurists placed zakat and share-cropping."
  ur: "'کھجور کا تنا ہلاؤ تو تازہ پکی کھجوریں گریں گی' — مریم سے کہا گیا جب دردِ زہ اسے تنے تک لایا؛ بلند درخت جن کے خوشے گچھے ہیں؛ جنت میں کھجور اور انار؛ اور فقہاء نے اس پر زکات اور بٹائی مقرر کی۔"
