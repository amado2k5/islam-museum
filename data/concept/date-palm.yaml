label:
  ar: "النخلة"
  en: "The date palm"
  ur: "کھجور کا درخت"
  es: "La palmera datilera"
  fr: "Le palmier dattier"
  tr: "Palmiye ağacı"
  id: "Pohon palem"
summary:
  ar: "هزي إليك بجذع النخلة تساقط عليك رطباً جنياً قيل لمريم حين جاءها المخاض إلى جذعها، وباسقات لها طلع نضيد، وفي الجنة نخل ورمان، وفيها زكاة ومساقاة عند الفقهاء."
  en: "'Shake the trunk of the palm and fresh ripe dates will drop on you' — said to Mary when the pangs drove her to its trunk; tall palms with clustered sheaths; in Paradise palms and pomegranates; and over it the jurists placed zakat and share-cropping."
  ur: "'کھجور کا تنا ہلاؤ تو تازہ پکی کھجوریں گریں گی' — مریم سے کہا گیا جب دردِ زہ اسے تنے تک لایا؛ بلند درخت جن کے خوشے گچھے ہیں؛ جنت میں کھجور اور انار؛ اور فقہاء نے اس پر زکات اور بٹائی مقرر کی۔"
  es: "«Sacude el tronco de la palmera y te caerán dátiles frescos y maduros», le dijeron a María cuando los dolores la llevaron hasta su tronco; palmeras altas con vainas agrupadas; en el Paraíso, palmeras y granadas; y sobre él, los juristas impusieron el zakat y el sistema de aparcería."
  fr: "« Secoue le tronc du palmier et des dattes fraîches et mûres te tomberont dessus », dit-il à Marie lorsque les douleurs la poussèrent vers son tronc; de grands palmiers aux gaines groupées; au Paradis, des palmiers et des grenadiers; et par-dessus, les juristes placèrent la zakat et le métayage."
  tr: "Palmiye ağacının gövdesini sallayın, olgun hurmalar başınıza düşer, Meryem'in gövdesine doğum geldiğinde ona söylendiği gibi, taze yapraklarla büyür, cennette palmiye ağaçları ve narlar vardır, fakıhlara göre zekat ve su vardır."
  id: "Goyangkan batang pohon palem, dan kurma matang jatuh padamu, seperti yang dikatakan kepada Maria ketika belalainya datang, dan tumbuh dengan daun segar, dan di Surga ada pohon palem dan delima, dan di dalamnya ada zakat dan air menurut para ahli hukum."
