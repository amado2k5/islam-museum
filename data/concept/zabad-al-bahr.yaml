label:
  ar: "زبد البحر"
  en: "Sea foam (zabad al-bahr)"
  ur: "زبد البحر ⁦(سمندری جھاگ)⁩"
  es: "espuma de mar (zabad al-bahr)"
  fr: "Écume de mer (zabad al-bahr)"
summary:
  ar: "زبد البحر خمسة أصناف، حار يابس في الثالثة؛ ينقّي الأوساخ ويحرق، وينفع الأسنان والجرب المتقرّح، ويدخل في الغسولات. {cite:canon-ibn-sina-print-v1 p.460}"
  en: "Sea foam has five kinds. Hot and dry in the third degree, it cleans dirt and burns; it suits the teeth and ulcerating scabies, and it enters washes. {cite:canon-ibn-sina-print-v1 p.460}"
  ur: "زبد البحر کی پانچ قسمیں ہیں۔ تیسرے درجے میں گرم اور خشک؛ یہ میل صاف کرتا اور جلاتا ہے، دانتوں اور خارش زدہ زخموں میں مفید ہے، اور غسولوں میں داخل ہوتا ہے۔ {cite:canon-ibn-sina-print-v1 p.460}"
  es: "La espuma marina tiene cinco tipos. Caliente y seca en tercer grado, limpia la suciedad y las quemaduras; es adecuada para los dientes y la sarna ulcerativa, y se utiliza en lavados. {cite:canon-ibn-sina-print-v1 p.460}"
  fr: "L'écume de mer se présente sous cinq formes. Chaude et sèche au troisième degré, elle nettoie la saleté et les brûlures; elle est bénéfique pour les dents et la gale ulcéreuse, et entre dans la composition des bains. {cite:canon-ibn-sina-print-v1 p.460}"
