label: { ar: "الخط المائل ⁦(المنابذ)⁩", en: "Ma'il script (the leaning hand)", ur: "خطِ مائل ⁦(منابذ)⁩", es: "Escritura Ma'il (la mano inclinada)", fr: "Écriture Ma'il (la main penchée)", tr: "İtalik çizgi (aykırı değerler)", id: "Garis miring (outlier)" }
summary:
  ar: "اسم علمي أُطلق في دراسات القرن التاسع عشر على خط مصحفي مبكر مائل الحروف، مأخوذ من قراءة «المائل» في قائمة خطوط المصاحف عند ابن النديم في طبعة فلوغل، ثم تبيّن أن القراءة مبنية على مخطوط محرّف وأن اللفظ الأصلي «المنابذ» أو «المنابِذ» غامض المعنى؛ وقد صار الاسم بعدها «الحجازي» {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
  en: "A scholarly name given in the nineteenth century to an early slanting Qur'anic hand, taken from the reading ma'il in Ibn al-Nadim's list of mushaf scripts in Flugel's edition. That reading rested on a corrupt manuscript: the word Ibn al-Nadim used was munabadh or munabidh, of unclear meaning, and the hand was afterwards renamed hijazi {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
  ur: "انیسویں صدی کی تحقیق میں ایک ابتدائی مائل حروف والے مصحفی خط کو دیا گیا علمی نام، جو فلوگل کے ایڈیشن میں ابن الندیم کی خطوطِ مصاحف کی فہرست میں «المائل» کی قراءت سے لیا گیا؛ یہ قراءت ایک بگڑے ہوئے نسخے پر مبنی تھی اور اصل لفظ «منابذ» یا «منابِذ» تھا جس کا مفہوم واضح نہیں؛ بعد ازاں خط کو «حجازی» کہا گیا {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}۔"
  es: "Nombre académico dado en el siglo XIX a una antigua escritura coránica inclinada, tomada de la lectura ma'il en la lista de escrituras del mushaf de Ibn al-Nadim en la edición de Flugel. Esa lectura se basaba en un manuscrito corrupto: la palabra que usó Ibn al-Nadim fue munabadh o munabidh, de significado poco claro, y la escritura fue posteriormente renombrada hijazi {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
  fr: "Nom savant donné au XIXe siècle à une écriture coranique ancienne et oblique, dérivé de la lecture « ma'il » figurant dans la liste des écritures du mushaf établie par Ibn al-Nadim dans l'édition de Flügel. Cette lecture reposait sur un manuscrit corrompu: le terme utilisé par Ibn al-Nadim était « munabadh » ou « munabidh », dont le sens est incertain, et l'écriture fut par la suite renommée « hijazi » {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
  tr: "On dokuzuncu yüzyıl çalışmalarında, İbn al-Nadim'in Flugel baskısında Mushaf yazıları listesinde 'al-ma'il' okumasından alınan, italik harflerle erken dönem bir Muşafi yazısına verilen bilimsel bir isimdir. Daha sonra okumanın bozulmuş bir el yazmasına dayandığı ve orijinal 'al-munabdh' veya 'al-munabdh' kelimesinin belirsiz bir anlama sahip olduğu ortaya çıkmıştır; isim daha sonra 'al-Hijazi' olmuştur {cite:blair-islamic-calligraphy-2006 s. 147} {cite:blair-islamic-calligraphy-2006 s. 148}."
  id: "Nama ilmiah yang diberikan dalam studi abad kesembilan belas pada aksara Mushafi awal dengan huruf miring, diambil dari pembacaan 'al-ma'il' dalam daftar aksara Mushaf oleh Ibn al-Nadim dalam edisi Flugel. Kemudian ditemukan bahwa pembacaan tersebut didasarkan pada naskah yang terdistorsi dan kata asli 'al-munabdh' atau 'al-munabdh' memiliki makna yang samar; nama tersebut kemudian menjadi 'al-Hijazi' {cite:blair-islamic-calligraphy-2006 hlm. 147} {cite:blair-islamic-calligraphy-2006 hlm. 148}."
