id: concept/mail-script
class: concept
kind: art_form
label: { ar: "الخط المائل ⁦(المنابذ)⁩", en: "Ma'il script (the leaning hand)", ur: "خطِ مائل ⁦(منابذ)⁩" }
summary:
  ar: "اسم علمي أُطلق في دراسات القرن التاسع عشر على خط مصحفي مبكر مائل الحروف، مأخوذ من قراءة «المائل» في قائمة خطوط المصاحف عند ابن النديم في طبعة فلوغل، ثم تبيّن أن القراءة مبنية على مخطوط محرّف وأن اللفظ الأصلي «المنابذ» أو «المنابِذ» غامض المعنى؛ وقد صار الاسم بعدها «الحجازي» {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
  en: "A scholarly name given in the nineteenth century to an early slanting Qur'anic hand, taken from the reading ma'il in Ibn al-Nadim's list of mushaf scripts in Flugel's edition. That reading rested on a corrupt manuscript: the word Ibn al-Nadim used was munabadh or munabidh, of unclear meaning, and the hand was afterwards renamed hijazi {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
  ur: "انیسویں صدی کی تحقیق میں ایک ابتدائی مائل حروف والے مصحفی خط کو دیا گیا علمی نام، جو فلوگل کے ایڈیشن میں ابن الندیم کی خطوطِ مصاحف کی فہرست میں «المائل» کی قراءت سے لیا گیا؛ یہ قراءت ایک بگڑے ہوئے نسخے پر مبنی تھی اور اصل لفظ «منابذ» یا «منابِذ» تھا جس کا مفہوم واضح نہیں؛ بعد ازاں خط کو «حجازی» کہا گیا {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}۔"
