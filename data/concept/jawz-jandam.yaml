summary:
  ar: "لفظ فارسي الأصل، وفي الهامش أن معناه شحم الأرض وأنه نوع من النبات؛ قوته عند بولس مبرّدة مطفئة مجففة قليلاً، تقطع النزف وتبرئ القوباء، ويهيّج الباه عند الكتاب {cite:canon-ibn-sina-print-v1 p.421}."
  en: "A word of Persian origin; the footnote says it means earth-fat and is a kind of plant. The book, citing Bulus, gives it a cooling, quenching and slightly drying power; it stops bleeding and cures ringworm, and the book lists it for stirring desire {cite:canon-ibn-sina-print-v1 p.421}."
  ur: "یہ فارسی الاصل لفظ ہے؛ حاشیے کے مطابق اس کا معنی زمین کی چربی اور یہ ایک قسم کا پودا ہے۔ کتاب پولس کے حوالے سے اس کی قوت ٹھنڈی، بجھانے والی اور کچھ خشک بیان کرتی ہے؛ یہ خون بہنا روکتا ہے اور داد کو درست کرتا ہے، اور کتاب اسے جماع کی خواہش بڑھانے والا بھی بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.421}۔"
  es: "Palabra de origen persa; la nota al pie indica que significa \"grasa de tierra\" y que se refiere a una planta. El libro, citando a Bulus, le atribuye propiedades refrescantes, calmantes y ligeramente secantes; detiene el sangrado y cura la tiña, y también la menciona por despertar el deseo {cite:canon-ibn-sina-print-v1 p.421}."
  fr: "Ce mot d'origine persane, dont la note de bas de page précise qu'il signifie « graisse de terre », désigne une plante. Le livre, citant Bulus, lui attribue des propriétés rafraîchissantes, désaltérantes et légèrement asséchantes; il arrête les saignements et soigne la teigne, et est mentionné comme stimulant le désir {cite:canon-ibn-sina-print-v1 p.421}."
  tr: "Terim Fars kökenlidir ve kenar kenarında toprağın yağı ve bir bitki türü olduğu anlamına gelir; Pavlus'a göre gücü soğutulmuş, hafifçe kurutulmuş, kanamayı durdurmuş, zona iyileşmiş ve pa'yı harekete geçirmiştir, {cite:canon-ibn-sina-print-v1 s.421} kitabına göre hareket ettirilmiştir."
  id: "Istilah ini berasal dari bahasa Persia, dan di pinggirannya, berarti lemak bumi dan bahwa itu adalah jenis tanaman; kekuatannya menurut Paulus didinginkan, sedikit kering, menghentikan pendarahan, menyembuhkan herpes zoster, dan mengaduk pa menurut buku {cite:canon-ibn-sina-print-v1 hlm.421}."
