summary:
  ar: "القيام في الفقه هو الانتصاب، ويتصل أكثره بالصلاة: فهو ركن في الفرض على القادر عليه باتفاق، ويسقط عن العاجز، وللحنفية والحنابلة أحكام في الاستناد والاستقلال فيه، ومن أبوابه قيام الإمام في الخطبة، والقيام للقادم أو الجنازة، والأكل والشرب والبول قائماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13125} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13129} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13132}"
  en: "In jurisprudence qiyam is standing upright. Most of its rules belong to prayer: standing is a pillar of obligatory prayer for the able by agreement and falls for the incapable; the Hanafis and Hanbalis have rules on leaning and independent standing. Other topics include standing in the sermon, standing to greet an arrival or a funeral, and standing while eating, drinking or urinating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13125} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13129} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13132}"
