  en: "Standing (qiyam)"
  ur: "قیام"
  es: "De pie (qiyam)"
  fr: "Debout (qiyam)"
summary:
  ar: "القيام في الفقه هو الانتصاب، ويتصل أكثره بالصلاة: فهو ركن في الفرض على القادر عليه باتفاق، ويسقط عن العاجز، وللحنفية والحنابلة أحكام في الاستناد والاستقلال فيه، ومن أبوابه قيام الإمام في الخطبة، والقيام للقادم أو الجنازة، والأكل والشرب والبول قائماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13125} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13129} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13132}"
  en: "In jurisprudence qiyam is standing upright. Most of its rules belong to prayer: standing is a pillar of obligatory prayer for the able by agreement and falls for the incapable; the Hanafis and Hanbalis have rules on leaning and independent standing. Other topics include standing in the sermon, standing to greet an arrival or a funeral, and standing while eating, drinking or urinating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13125} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13129} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13132}"
  es: "En jurisprudencia, qiyam significa estar de pie. La mayoría de sus reglas pertenecen a la oración: estar de pie es un pilar de oración obligatoria para los capaces por acuerdo y para los incapaces; Los Hanafis y Hanbalis tienen reglas sobre inclinación e independencia. Otros temas incluyen ponerse de pie durante el sermón, ponerse de pie para saludar a una llegada o un funeral y estar de pie mientras come, bebe u orina. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13123} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13124} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13125} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13129} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13132}"
  fr: "Dans la jurisprudence, le qiyam se tient debout. La plupart de ses règles appartiennent à la prière: la position debout est un pilier de la prière obligatoire pour les capables par accord et tombe pour les incapables; les Hanafis et les Hanbalis ont des règles en matière d'inclinaison et d'indépendance. D'autres sujets incluent se tenir debout pendant le sermon, se tenir debout pour saluer une arrivée ou un enterrement et se tenir debout en mangeant, en buvant ou en urinant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13123} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13124} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13125} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13129} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13132}"
  ur: "فقہ میں قیام سیدھا کھڑا ہے۔ اس کے اکثر احکام نماز سے تعلق رکھتے ہیں: کھڑا ہونا اہل کے لیے واجب نماز کا ستون ہے اور عاجز کے لیے گرتا ہے۔ حنفیہ اور حنبلیوں کے نزدیک جھکاؤ اور آزاد حیثیت کے احکام ہیں۔ دیگر موضوعات میں خطبہ میں کھڑا ہونا، آمد یا جنازے کے استقبال کے لیے کھڑا ہونا، اور کھانے، پینے یا پیشاب کرتے وقت کھڑا ہونا شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 13123} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 13124} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 13125} صفحہ 13129} {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 13132}"
