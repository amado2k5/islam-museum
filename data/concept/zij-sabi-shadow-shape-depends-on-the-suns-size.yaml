label: { ar: "شكل ظل الأرض وصلته بحجم الشمس", en: "The shape of the Earth's shadow and the Sun's size", ur: "زمین کے سائے کی شکل اور سورج کے حجم کا تعلق", es: "La forma de la sombra de la Tierra y el tamaño del Sol" }
summary:
  ar: "يبيّن البتاني أن الظل ليس أسطوانة متساوية العرض ولا يتسع بلا نهاية؛ فلأن الشمس أعظم من الأرض يضيق الظل حتى ينتهي إلى نقطة في الهواء، ولو كانت مثل الأرض لتساوى عرضه، ولو كانت أصغر لاتسع. {cite:zij-sabi-nallino-byblion p.84}."
  en: "Al-Battani shows that the shadow is neither a cylinder of equal width nor an endlessly widening cone. Because the Sun is larger than the Earth the shadow narrows to a point in the air; had the Sun been equal to the Earth the shadow would keep one width, and had it been smaller the shadow would widen. {cite:zij-sabi-nallino-byblion p.84}."
  ur: "البتانی دکھاتے ہیں کہ سایہ نہ تو یکساں چوڑائی کا استوانہ ہے اور نہ بے انتہا پھیلنے والا مخروط۔ چونکہ سورج زمین سے بڑا ہے، اس لیے سایہ فضا میں ایک نقطے تک تنگ ہوتا ہے؛ اگر سورج زمین کے برابر ہوتا تو اس کی چوڑائی یکساں رہتی، اور اگر چھوٹا ہوتا تو سایہ پھیلتا۔ {cite:zij-sabi-nallino-byblion p.84}۔"
  es: "Al-Battani demuestra que la sombra no es ni un cilindro de igual anchura ni un cono que se ensancha infinitamente. Dado que el Sol es más grande que la Tierra, la sombra se estrecha hasta un punto en el aire; si el Sol fuera igual a la Tierra, la sombra mantendría una anchura constante, y si fuera más pequeño, se ensancharía. {cite:zij-sabi-nallino-byblion p.84}."
