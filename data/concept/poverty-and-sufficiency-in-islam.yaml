id: concept/poverty-and-sufficiency-in-islam
class: concept
kind: social
label:
  ar: الفقر وحد الكفاية في الإسلام
  en: "Poverty and sufficiency in Islam"
  es: "Pobreza y suficiencia en el Islam"
  fr: "Pauvreté et suffisance en islam"
  ur: "اسلام میں غربت اور کفایت شعاری"
  tr: "İslam'da yeterlilik sınırı yoksulluktur"
  id: "Kemiskinan adalah batas kecukupan dalam Islam"
summary:
  ar: "يميز محمد شوقي الفنجري بين حد الكفاف، وهو أدنى ما يبقى به الإنسان حيا، وحد الكفاية أو الغنى، وهو المستوى اللائق بالزمان والمكان وبعمل الفرد ومسؤوليته، ويرى أن الإسلام يعرّف الفقير بالمعنى الثاني {cite:hatha-huwa-al-islam-azhar p. 170} {cite:hatha-huwa-al-islam-azhar p. 171}. ويذكر أن المشكلة الاقتصادية في المجتمع الواحد هي اختلال التوازن بين أفراده، وفي العالم هي الهوة بين الدول النامية والمتقدمة، ويستدل بآية الحشر على ألا يكون المال دولة بين الأغنياء وحدهم {cite:hatha-huwa-al-islam-azhar p. 171}. ويورد أقوالا تنسب إلى عمر وعلي وإلى الفقهاء السرخسي والشاطبي في أن الإمام يعطي الفقراء ما يكفيهم، وأن الكفاية تختلف باختلاف الأحوال، وأن الزكاة ضمان اجتماعي في الإسلام {cite:hatha-huwa-al-islam-azhar p. 172} {cite:hatha-huwa-al-islam-azhar p. 173}."
  en: "Muhammad Shawqi al-Fanjari distinguishes kafaf, the bare minimum to keep a person alive, from kifaya or richness, the decent standard suited to time, place and a person's work and duties, and holds that Islam defines poverty by the second (pp. 170-172). He places the local problem in imbalance among members of a society and the global problem in the gap between developing and developed states (p. 171). He cites attributed sayings of Umar and Ali and classical jurists on the imam's duty to meet the needs of the poor, and calls zakat an institution of social security (pp. 172-173)."
  es: "Muhammad Shawqi al-Fanjari distingue entre kafaf, lo mínimo indispensable para la supervivencia, y kifaya o riqueza, el nivel de vida adecuado según el tiempo, el lugar, el trabajo y las obligaciones de cada persona. Sostiene que el Islam define la pobreza por el segundo (págs. 170-172). Sitúa el problema local en el desequilibrio entre los miembros de una sociedad y el problema global en la brecha entre los estados en desarrollo y los desarrollados (pág. 171). Cita dichos atribuidos a Umar y Ali, así como a juristas clásicos, sobre el deber del imán de atender las necesidades de los pobres, y denomina al zakat una institución de seguridad social (págs. 172-173)."
  fr: "Muhammad Shawqi al-Fanjari distingue le kafaf, le strict minimum vital, du kifaya ou richesse, niveau de vie décent adapté à l'époque, au lieu et aux fonctions et devoirs de chacun. Il soutient que l'islam définit la pauvreté à la seconde (p. 170-172). Il situe le problème local dans le déséquilibre entre les membres d'une société et le problème global dans le fossé entre pays en développement et pays développés (p. 171). Il cite des hadiths attribués à Umar et Ali, ainsi que des juristes classiques, concernant le devoir de l'imam de subvenir aux besoins des pauvres, et qualifie la zakat d'institution de protection sociale (p. 172-173)."
  ur: "محمد شوقی الفنجری نے کفاف کو، کسی شخص کو زندہ رکھنے کے لیے کم از کم، کفایہ یا امیری سے، وقت، جگہ اور کسی شخص کے کام اور فرائض کے لیے موزوں معیار، اور یہ کہتا ہے کہ اسلام غربت کی تعریف دوسرے ⁦(صفحہ 170-172)⁩ سے کرتا ہے۔ وہ مقامی مسئلہ کو معاشرے کے ارکان کے درمیان عدم توازن اور عالمی مسئلہ کو ترقی پذیر اور ترقی یافتہ ریاستوں کے درمیان فرق میں رکھتا ہے ⁦(ص 171)⁩۔ وہ غریبوں کی ضروریات کو پورا کرنے کے لیے امام کے فرض پر عمر اور علی اور کلاسیکی فقہاء کے منسوب اقوال کا حوالہ دیتے ہیں، اور زکوٰۃ کو سماجی تحفظ کا ادارہ قرار دیتے ہیں ⁦(صفحہ 172-173)⁩۔"
  tr: "Muhammed Shawqi Al-Fengari, geçim eşiği olan kişinin hayatta kaldığı asgari sınır ile yeterlilik veya servet eşiği arasında ayrım yapar; bu eşik zaman, mekân, bireyin işi ve sorumluluğu için uygun seviyedir. İslam'ın yoksulları ikinci anlamda tanımladığına inanır {cite:hatha-huwa-al-Islam-azhar s. 170} {cite:hatha-huwa-al-Islam-azhar, s. 171}. Tek bir toplumdaki ekonomik sorunun üyeleri arasındaki dengesizlik olduğunu, dünyada ise gelişmekte olan ve gelişmiş ülkeler arasındaki uçurum olduğunu belirtir. Zenginliğin sadece zenginler arasında olmaması gerektiğine dair kanıt olarak toplama ayetini gösterir {cite:hatha-huwa-al-Islam-azhar, s. 171}. Ayrıca Umar, Ali ve hukukçular Al-Sarakhsi ile Al-Shatibi'ye atfedilen ifadeleri de aktarır; imamın yoksullara yeterince verdiğini, cemaatin koşullara göre değiştiğini ve zekatın İslam'da sosyal bir garanti olduğunu belirtir {cite:hatha-huwa-al-Islam-azhar s. 172} {cite:hatha-huwa-al-Islam-azhar, s. 173}."
  id: "Muhammad Shawqi Al-Fangari membedakan antara ambang subsistensi, yang merupakan batas minimum di mana seseorang tetap hidup, dan ambang kecukupan atau kekayaan, yang merupakan tingkat yang tepat untuk waktu, tempat, pekerjaan individu, dan tanggung jawab. Ia percaya bahwa Islam mendefinisikan orang miskin dalam arti kedua {cite:hatha-huwa-al-Islam-azhar hlm. 170} {cite:hatha-huwa-al-Islam-azhar, hlm. 171}. Ia menyebutkan bahwa masalah ekonomi dalam satu masyarakat adalah ketidakseimbangan di antara anggotanya, dan di dunia adalah kesenjangan antara negara berkembang dan negara maju. Ia mengutip ayat pengumpulan sebagai bukti bahwa kekayaan tidak seharusnya hanya menjadi negara di antara orang kaya {cite:hatha-huwa-al-Islam-azhar, hlm. 171}. Ia juga mengutip pernyataan yang dikaitkan dengan Umar, Ali, dan para ahli hukum Al-Sarakhsi dan Al-Shatibi, menyatakan bahwa Imam memberikan cukup kepada orang miskin untuk mereka, bahwa komunalitas bervariasi sesuai keadaan, dan bahwa zakat adalah jaminan sosial dalam Islam {cite:hatha-huwa-al-Islam-azhar hlm. 172} {cite:hatha-huwa-al-Islam-azhar, hlm. 173}."
