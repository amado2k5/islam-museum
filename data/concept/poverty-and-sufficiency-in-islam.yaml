label:
  ar: الفقر وحد الكفاية في الإسلام
  en: "Poverty and sufficiency in Islam"
summary:
  ar: "يميز محمد شوقي الفنجري بين حد الكفاف، وهو أدنى ما يبقى به الإنسان حيا، وحد الكفاية أو الغنى، وهو المستوى اللائق بالزمان والمكان وبعمل الفرد ومسؤوليته، ويرى أن الإسلام يعرّف الفقير بالمعنى الثاني {cite:hatha-huwa-al-islam-azhar p. 170} {cite:hatha-huwa-al-islam-azhar p. 171}. ويذكر أن المشكلة الاقتصادية في المجتمع الواحد هي اختلال التوازن بين أفراده، وفي العالم هي الهوة بين الدول النامية والمتقدمة، ويستدل بآية الحشر على ألا يكون المال دولة بين الأغنياء وحدهم {cite:hatha-huwa-al-islam-azhar p. 171}. ويورد أقوالا تنسب إلى عمر وعلي وإلى الفقهاء السرخسي والشاطبي في أن الإمام يعطي الفقراء ما يكفيهم، وأن الكفاية تختلف باختلاف الأحوال، وأن الزكاة ضمان اجتماعي في الإسلام {cite:hatha-huwa-al-islam-azhar p. 172} {cite:hatha-huwa-al-islam-azhar p. 173}."
  en: "Muhammad Shawqi al-Fanjari distinguishes kafaf, the bare minimum to keep a person alive, from kifaya or richness, the decent standard suited to time, place and a person's work and duties, and holds that Islam defines poverty by the second (pp. 170-172). He places the local problem in imbalance among members of a society and the global problem in the gap between developing and developed states (p. 171). He cites attributed sayings of Umar and Ali and classical jurists on the imam's duty to meet the needs of the poor, and calls zakat an institution of social security (pp. 172-173)."
