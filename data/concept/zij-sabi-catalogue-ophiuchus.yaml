summary:
  ar: "يسمّي فهرس البتاني الصورة الحاوي الذي يُمسك الحيّة، ويذكر في العنوان لفظ السيقولوس اليوناني أي الحاوي للحيّات. تُعدّ كواكبها حسب أجزاء الجسم: الرأس والكتف واليدان والركبة والساق والقدم. مواضعها في جدول الطول والعرض ولم تُنقل هنا. {cite:nallino-albatenii-opus-astronomicum pp.151}"
  en: "The catalogue names the figure al-Hawi alladhi yumsik al-hayya, the one who holds the serpent, and its heading gives the Greek psyllus, the snake-charmer. Its stars are listed by part of the body: head, shoulder, hands, knee, leg and foot. Their positions are in the longitude and latitude table, which is not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.151}"
  ur: "فہرست میں حاوی کی صورت ہے جو سانپ کو تھامے ہوئے ہے، اور عنوان میں یونانی لفظ سائلس، یعنی سانپ پکڑنے والا، آتا ہے۔ اس کے ستارے جسم کے حصوں کے مطابق گنے گئے ہیں: سر، کندھا، ہاتھ، گھٹنا، ٹانگ اور پاؤں۔ ان کے مواضع طول و عرض کے جدول میں ہیں، جو یہاں نقل نہیں ہوا۔ {cite:nallino-albatenii-opus-astronomicum pp.151}"
  es: "El catálogo nombra a la figura al-Hawi alladhi yumsik al-hayya, «el que sostiene la serpiente», y su encabezado da el término griego psyllus, «el encantador de serpientes». Sus estrellas se enumeran por partes del cuerpo: cabeza, hombro, manos, rodilla, pierna y pie. Sus posiciones se encuentran en la tabla de longitud y latitud, que no se transcribe aquí. {cite:nallino-albatenii-opus-astronomicum pp.151}"
  fr: "Le catalogue nomme la figure « al-Hawi alladhi yumsik al-hayya », celle qui tient le serpent, et son titre donne le terme grec « psyllus », le charmeur de serpents. Ses étoiles sont répertoriées par partie du corps: tête, épaule, mains, genou, jambe et pied. Leurs positions sont indiquées dans le tableau de longitude et de latitude, non reproduit ici. {cite:nallino-albatenii-opus-astronomicum pp.151}"
