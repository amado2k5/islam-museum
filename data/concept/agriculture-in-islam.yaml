id: concept/agriculture-in-islam
class: concept
kind: ethical
label:
  ar: الزراعة في الإسلام
  en: Agriculture in Islam
  fr: "L’agriculture en islam"
  es: "La agricultura en el Islam"
  ur: "اسلام میں زراعت"
summary:
  ar: "يعرض المراغي الزراعة بوصفها أسبق وجوه المعاش، نقلًا عن ابن خلدون الذي يراها أبسط الصنائع وأقربها إلى الطبيعة {cite:min-qadaya-al-mal-wal-amal-azhar p. 27} {cite:min-qadaya-al-mal-wal-amal-azhar p. 28}. ويرى أن الإسلام حثّ عليها لأنها مصدر أقوات الناس والأنعام، وحذّر من الزراعة في الأرض المغصوبة {cite:min-qadaya-al-mal-wal-amal-azhar p. 28}. ويذكر أن من أحيا أرضًا مواتًا فهو أحق بها، وأن من عطّل أرضه ثلاث سنين فلغيره أن يعمرها، ويقيّد الكتاب ذلك بإذن ولي الأمر في العمل والقضاء {cite:min-qadaya-al-mal-wal-amal-azhar p. 29}. وفي الماء يحذّر الكتاب من منع فضل الماء عن الزرع، ويروي قصة الخصومة في شراج الحرة بين الزبير وأنصاري {cite:min-qadaya-al-mal-wal-amal-azhar p. 29} {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}. ويبين أن المشاركة في الأرض تُسمى مزارعة، وأن لها صورًا تختلف باتفاق المالك والزارع {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}."
  en: "Al-Maraghi presents agriculture as the oldest livelihood, after Ibn Khaldun, the simplest and closest to nature (pp. 27-28). Islam encourages it as the source of people's and animals' food and forbids farming usurped land (p. 28). Reviving dead land gives title, and a tract left unworked for three years may pass to another who works it, subject to the ruler's permission in practice (p. 29). The book warns against withholding surplus water and tells the Zubayr water dispute (pp. 29-30). Sharecropping is called muzara'a (p. 30)."
  fr: "Al-Maraghi présente l’agriculture comme le plus ancien moyen de subsistance et, à la suite d’Ibn Khaldun, comme le plus simple et le plus proche de la nature (pp. 27-28). L’islam l’encourage comme source de nourriture pour les humains et les animaux et interdit de cultiver une terre usurpée (p. 28). Faire revivre une terre morte donne un titre de propriété, et une parcelle laissée sans culture pendant trois ans peut passer à un autre qui la travaille, sous réserve, en pratique, de l’autorisation du gouvernant (p. 29). Le livre met en garde contre le fait de retenir le surplus d’eau et raconte le différend de Zubayr au sujet de l’eau (pp. 29-30). Le métayage est appelé muzara'a (p. 30)."
  es: "Al-Maraghi presenta la agricultura como el medio de subsistencia más antiguo, después de Ibn Khaldun, el más sencillo y cercano a la naturaleza (págs. 27-28). El islam la fomenta como fuente de alimento para personas y animales y prohíbe el cultivo de tierras usurpadas (pág. 28). La recuperación de tierras muertas otorga la propiedad, y una parcela que permanece sin cultivar durante tres años puede pasar a otra persona que la cultive, sujeta a la autorización del gobernante (pág. 29). El libro advierte sobre la retención del agua sobrante y relata la disputa por el agua de Zubayr (págs. 29-30). El sistema de aparcería se denomina muzara'a (pág. 30)."
  ur: "المراثی نے ابن خلدون کے بعد زراعت کو سب سے قدیم ذریعہ معاش کے طور پر پیش کیا ہے جو کہ فطرت کے سب سے آسان اور قریب ہے ⁦(صفحہ 27-28)⁩۔ اسلام اسے لوگوں اور جانوروں کی خوراک کے ذریعہ کی ترغیب دیتا ہے اور غصب شدہ زمین کاشتکاری سے منع کرتا ہے ⁦(ص 28)⁩۔ مردہ زمین کو زندہ کرنا عنوان دیتا ہے، اور ایک ٹریکٹ جو تین سال تک بغیر کام کے چھوڑا جاتا ہے، کسی دوسرے کو منتقل ہو سکتا ہے جو اس پر کام کرتا ہے، عملی طور پر حکمران کی اجازت سے مشروط ہے ⁦(صفحہ 29)⁩۔ کتاب اضافی پانی کو روکنے کے خلاف خبردار کرتی ہے اور زبیر پانی کے تنازعہ کو بتاتی ہے ⁦(صفحہ 29-30)⁩۔ کھیتی باڑی کو مزارع کہتے ہیں ⁦(ص 30)⁩۔"
