label:
  ar: الزراعة في الإسلام
  en: Agriculture in Islam
summary:
  ar: "يعرض المراغي الزراعة بوصفها أسبق وجوه المعاش، نقلًا عن ابن خلدون الذي يراها أبسط الصنائع وأقربها إلى الطبيعة {cite:min-qadaya-al-mal-wal-amal-azhar p. 27} {cite:min-qadaya-al-mal-wal-amal-azhar p. 28}. ويرى أن الإسلام حثّ عليها لأنها مصدر أقوات الناس والأنعام، وحذّر من الزراعة في الأرض المغصوبة {cite:min-qadaya-al-mal-wal-amal-azhar p. 28}. ويذكر أن من أحيا أرضًا مواتًا فهو أحق بها، وأن من عطّل أرضه ثلاث سنين فلغيره أن يعمرها، ويقيّد الكتاب ذلك بإذن ولي الأمر في العمل والقضاء {cite:min-qadaya-al-mal-wal-amal-azhar p. 29}. وفي الماء يحذّر الكتاب من منع فضل الماء عن الزرع، ويروي قصة الخصومة في شراج الحرة بين الزبير وأنصاري {cite:min-qadaya-al-mal-wal-amal-azhar p. 29} {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}. ويبين أن المشاركة في الأرض تُسمى مزارعة، وأن لها صورًا تختلف باتفاق المالك والزارع {cite:min-qadaya-al-mal-wal-amal-azhar p. 30}."
  en: "Al-Maraghi presents agriculture as the oldest livelihood, after Ibn Khaldun, the simplest and closest to nature (pp. 27-28). Islam encourages it as the source of people's and animals' food and forbids farming usurped land (p. 28). Reviving dead land gives title, and a tract left unworked for three years may pass to another who works it, subject to the ruler's permission in practice (p. 29). The book warns against withholding surplus water and tells the Zubayr water dispute (pp. 29-30). Sharecropping is called muzara'a (p. 30)."
