id: concept/canon-opposite-bleeding-and-repeated-small-bleedings
class: concept
kind: scientific
label:
  ar: "الفصد إلى الخلاف وتكرار الفصد القليل عند ابن سينا"
  en: "Bleeding to the opposite side and repeated small bleedings in the Canon"
  fr: "Saignée opposée et petites saignées répétées dans le Canon"
  ur: "قانون میں مخالف سمت میں فصد اور بار بار تھوڑا فصد"
  es: "Sangrado hacia el lado opuesto y pequeños sangrados repetidos en el Canon"
summary:
  ar: "يذكر ابن سينا أن العرق قد يفصد لمنع نزف الدم من الرعاف أو الرحم أو المقعدة إلى خلاف تلك الجهة، وأن كثرة أعداد الفصد أوفق من كثرة مقداره، وأن الفصد الذي لا حاجة إليه يهيج المرار {cite:canon-ibn-sina-print-v1 pp.292-293}."
  en: "Ibn Sina says that a vessel may be opened to stop a flow of blood from the nose, the womb or the anus by turning it to the opposite side, that more bleedings are better than a larger quantity, and that a bleeding that was not needed stirs bile {cite:canon-ibn-sina-print-v1 pp.292-293}."
  fr: "Ibn Sina décrit ouverture vasculaire détournant vers le côté opposé un saignement nasal, utérin ou anal, préfère répétition à grande quantité et attribue à la saignée inutile agitation biliaire {cite:canon-ibn-sina-print-v1 pp.292-293}."
  es: "Ibn Sina dice que un vaso puede abrirse para detener el flujo de sangre de la nariz, el útero o el ano girándolo hacia el lado opuesto, que más sangrados son mejores que una mayor cantidad, y que un sangrado que no era necesario agita la bilis {cite:canon-ibn-sina-print-v1 pp.292-293}."
