id: concept/tasweed-sovereignty-and-blackening
class: concept
kind: legal
label:
  ar: "التسويد"
  en: "Tasweed (making black or making a sayyid: honouring with the title sayyid, and dyeing or dressing in black)"
  ur: "تسوید (سید کہنا، اور سیاہ رنگ کرنا یا سیاہ پہننا)"
summary:
  ar: "التسويد لفظ له معنيان يبحثهما الفقهاء: الأول التشريف بلفظ السيد، والثاني التلوين بالسواد، وهو ضد البياض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5116} فأما السيادة فيبحث فيها تسويد النبي في الصلاة وخارجها، وتسويد غيره، وتسويد المنافق، وخلافهم في إطلاق السيد على غير الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5120} وأما السواد فيبحث في الخضاب به، ولبسه في الحداد والتعزية واللباس، وتسويد الوجه في التعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} وأكثر المذاهب على كراهة الخضاب بالسواد في الجملة إلا للجهاد، واختلفت في التفصيل، والشافعية يرونه حراما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5122}"
  en: "Tasweed has two senses that the jurists treat: the first is honouring someone with the title sayyid, and the second is dyeing with black, the opposite of white. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5116} Under sovereignty they discuss the title for the Prophet in prayer and outside it, for others, for the hypocrite, and whether sayyid may be said of anyone but God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5120} Under black they discuss dyeing with it, wearing it in mourning, condolence and dress, and blackening the face in discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} Most schools dislike dyeing with black except in jihad and differ on the detail; the Shafi'is hold it forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5122}"
