id: concept/tasweed-sovereignty-and-blackening
class: concept
kind: legal
label:
  ar: "التسويد"
  en: "Tasweed (making black or making a sayyid: honouring with the title sayyid, and dyeing or dressing in black)"
  ur: "تسوید ⁦(سید کہنا، اور سیاہ رنگ کرنا یا سیاہ پہننا)⁩"
  es: "Tasweed (hacer negro o hacer un sayyid: honrar con el título sayyid, y teñir o vestir de negro)"
  fr: "Tasweed (se noircir ou se faire sayyid: honorer du titre de sayyid, et teindre ou s’habiller en noir)"
  tr: "kararma"
  id: "Penghitaman"
summary:
  ar: "التسويد لفظ له معنيان يبحثهما الفقهاء: الأول التشريف بلفظ السيد، والثاني التلوين بالسواد، وهو ضد البياض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5116} فأما السيادة فيبحث فيها تسويد النبي في الصلاة وخارجها، وتسويد غيره، وتسويد المنافق، وخلافهم في إطلاق السيد على غير الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5120} وأما السواد فيبحث في الخضاب به، ولبسه في الحداد والتعزية واللباس، وتسويد الوجه في التعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} وأكثر المذاهب على كراهة الخضاب بالسواد في الجملة إلا للجهاد، واختلفت في التفصيل، والشافعية يرونه حراما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5122}"
  en: "Tasweed has two senses that the jurists treat: the first is honouring someone with the title sayyid, and the second is dyeing with black, the opposite of white. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5116} Under sovereignty they discuss the title for the Prophet in prayer and outside it, for others, for the hypocrite, and whether sayyid may be said of anyone but God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5120} Under black they discuss dyeing with it, wearing it in mourning, condolence and dress, and blackening the face in discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} Most schools dislike dyeing with black except in jihad and differ on the detail; the Shafi'is hold it forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5122}"
  es: "Tasweed tiene dos sentidos que los juristas tratan: el primero es honrar a alguien con el título sayyid, y el segundo es teñir con negro, lo opuesto al blanco. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5116} Bajo soberanía discuten el título para el Profeta en la oración y fuera de ella, para otros, para el hipócrita, y si sayyid puede decirse de alguien que no sea Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5120} Bajo negro discuten teñir con él, usarlo en luto, condolencia y vestimenta, y ennegrecer el rostro como castigo discrecional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} A la mayoría de las escuelas no les gusta teñir de negro, excepto en la yihad, y difieren en los detalles; los Shafi'is lo tienen prohibido. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5122}"
  fr: "Le terme « tasweed » a deux sens que les juristes examinent: le premier consiste à honorer quelqu’un du titre de « sayyid », et le second à se teindre en noir, couleur opposée au blanc. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5116} Sous la rubrique « souveraineté », ils abordent le titre donné au Prophète pendant et en dehors de la prière, à d’autres personnes, à l’hypocrite, et la question de savoir si le terme « sayyid » peut être attribué à quiconque autre que Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5120} Sous la rubrique « noir », ils examinent la teinture avec cette couleur, son port en signe de deuil, de condoléances et comme vêtement, ainsi que le noircissement du visage à titre de châtiment discrétionnaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5124} La plupart des écoles n'aiment pas la teinture en noir, sauf dans le jihad et diffèrent sur les détails; les Shafi'ites le tiennent pour interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5122}"
  ur: "تسوید کے دو حواس ہیں جن کا فقہا کرتے ہیں: پہلا سید کے لقب سے کسی کی تعظیم کرنا، اور دوسرا سیاہ سے رنگنا، سفید کے برعکس۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5115} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5116} خودمختاری کے تحت وہ نماز میں نبی کے لقب پر بحث کرتے ہیں اور اس کے باہر، دوسروں کے لیے، منافق کے لیے، اور چاہے سید کے سوا کسی کو کہا جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5117} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5120} سیاہ رنگ کے تحت وہ اس کے ساتھ رنگنے، اسے سوگ میں پہننے، تعزیت اور لباس پہننے، اور صوابدیدی سزا میں چہرہ کالا کرنے پر بحث کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5121} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5124} جہاد کے علاوہ زیادہ تر مکاتب سیاہ رنگ کو ناپسند کرتے ہیں اور تفصیل پر اختلاف رکھتے ہیں۔ شافعی اسے حرام سمجھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5121}"
  tr: "Karartma, hukukçuların incelediği iki anlamı olan bir terimdir: birincisi 'sayyid' kelimesiyle onurlandırmak, ikincisi ise siyahla boyamaktır ki bu beyazlığın tam tersidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5116} Egemenlik konusunda, bu eser Peygamber'i namazda ve namazda karalatlamak, başkalarını karartmak, ikiyüzlüleri karartmak ve efendiyi Tanrı dışındaki birinin üzerinde çağırmadaki anlaşmazlıklarını ele alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5120} Siyahlığa gelince, siyahlık ile lekelenmeye çalışılır, yas, teselli ve giysilerde giyilir ve ta'zirde yüz karartılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5124} Çoğu okul genel olarak cihat hariç siyaha boyamayı sevmez, ayrıntılar farklıdır ve Şafiiler bunu yasak sayar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5122}"
  id: "Blackening adalah istilah dengan dua makna yang dipelajari oleh para ahli hukum: yang pertama adalah honoring dengan kata 'sayyid,' dan yang kedua adalah coloring dengan black, yang merupakan kebalikan dari keputihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5115} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5116} Adapun kedaulatan, istilah ini membahas tentang menghitamkan Nabi dalam doa dan di luar doa, menghitamkan orang lain, menghitamkan munafik, dan ketidaksepakatan mereka dalam memanggil penguasa atas siapa pun selain Tuhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5117} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5120} Adapun kehitaman, dicari untuk dinoda dengan hitam, dipakai sebagai duka, penghiburan, dan pakaian, serta menghitamkan wajah dalam ta'zir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5124} Sebagian besar mazhab umumnya tidak suka mewarnai hitam secara umum kecuali jihad, berbeda dalam detail, dan para Shafi'i menganggapnya terlarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5121} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5122}"
