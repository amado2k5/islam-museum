id: concept/mabtun-fiqh
class: concept
kind: legal
label:
  ar: "المَبْطُون"
  en: "Mabtun (one who dies of a stomach ailment): the rules and the martyr"
  ur: "مبطون (پیٹ کی بیماری میں مرنے والا): احکام اور شہادت"
summary:
  ar: "المبطون في اللغة عليل البطن، وفي الاصطلاح صاحب داء البطن، وقيل صاحب الاستسقاء، وقيل من يموت بداء بطنه مطلقاً، وقيل صاحب الإسهال أو القولنج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13828}. والمبطون مريض ومعذور تجري عليه أحكام المرضى وأصحاب الأعذار {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}. وقد عد الفقهاء المبطون شهيداً إذا مات في بطنه، لحديث أبي هريرة في الشهداء الخمسة، واتفقوا على أنه من شهداء الآخرة، وعلى تغسيله مع عدّه شهيداً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}."
  en: "Mabtun, in lexicon, is one ill in the belly; in technical use one who has a stomach disease, or dropsy, or who dies of a stomach ailment in general, or who has diarrhoea or colic {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13828}. The mabtun is sick and excused, so the rules for the sick and the excused apply to him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}. The jurists count one who dies of his belly ailment as a martyr, on the hadith of Abu Hurayra listing five kinds of martyr: the one who dies of plague, the mabtun, the drowned, the one killed by a collapse, and the one who dies in God's way; they agree he is a martyr of the next world, and that he is washed for burial though counted a martyr {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}."
  ur: "مبطون لغت میں پیٹ کا بیمار ہے؛ اصطلاح میں وہ جسے پیٹ کی بیماری ہو، یا استسقاء ہو، یا جو پیٹ کی بیماری سے مرے، یا جسے اسہال یا قولنج ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13828}۔ مبطون بیمار اور معذور ہے، اس پر بیماروں اور معذوروں کے احکام جاری ہوں گے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}۔ فقہاء نے پیٹ کی بیماری سے مرنے والے کو شہید شمار کیا ہے، ابو ہریرہ کی حدیث کی بنا پر جس میں پانچ قسم کے شہداء گنائے گئے ہیں؛ اور اس پر اتفاق ہے کہ وہ آخرت کے شہداء میں سے ہے، اور شہید شمار ہونے کے باوجود اسے غسل دیا جائے گا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}۔"
