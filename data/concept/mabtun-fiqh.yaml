class: concept
kind: legal
label:
  ar: "المَبْطُون"
  en: "Mabtun (one who dies of a stomach ailment): the rules and the martyr"
  ur: "مبطون ⁦(پیٹ کی بیماری میں مرنے والا)⁩: احکام اور شہادت"
  es: "Mabtun (el que muere de una dolencia estomacal): las reglas y el mártir"
  fr: "Mabtun (celui qui meurt d'une maladie de l'estomac): les règles et le martyr"
  tr: "astarlar"
  id: "liner"
summary:
  ar: "المبطون في اللغة عليل البطن، وفي الاصطلاح صاحب داء البطن، وقيل صاحب الاستسقاء، وقيل من يموت بداء بطنه مطلقاً، وقيل صاحب الإسهال أو القولنج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13828}. والمبطون مريض ومعذور تجري عليه أحكام المرضى وأصحاب الأعذار {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}. وقد عد الفقهاء المبطون شهيداً إذا مات في بطنه، لحديث أبي هريرة في الشهداء الخمسة، واتفقوا على أنه من شهداء الآخرة، وعلى تغسيله مع عدّه شهيداً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}."
  en: "Mabtun, in lexicon, is one ill in the belly; in technical use one who has a stomach disease, or dropsy, or who dies of a stomach ailment in general, or who has diarrhoea or colic {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13828}. The mabtun is sick and excused, so the rules for the sick and the excused apply to him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}. The jurists count one who dies of his belly ailment as a martyr, on the hadith of Abu Hurayra listing five kinds of martyr: the one who dies of plague, the mabtun, the drowned, the one killed by a collapse, and the one who dies in God's way; they agree he is a martyr of the next world, and that he is washed for burial though counted a martyr {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}."
  ur: "مبطون لغت میں پیٹ کا بیمار ہے؛ اصطلاح میں وہ جسے پیٹ کی بیماری ہو، یا استسقاء ہو، یا جو پیٹ کی بیماری سے مرے، یا جسے اسہال یا قولنج ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13828}۔ مبطون بیمار اور معذور ہے، اس پر بیماروں اور معذوروں کے احکام جاری ہوں گے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}۔ فقہاء نے پیٹ کی بیماری سے مرنے والے کو شہید شمار کیا ہے، ابو ہریرہ کی حدیث کی بنا پر جس میں پانچ قسم کے شہداء گنائے گئے ہیں؛ اور اس پر اتفاق ہے کہ وہ آخرت کے شہداء میں سے ہے، اور شہید شمار ہونے کے باوجود اسے غسل دیا جائے گا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}۔"
  es: "Mabtun, en léxico, es aquel que está enfermo del vientre; en uso técnico, aquel que tiene una enfermedad estomacal, o hidropesía, o que muere de una dolencia estomacal en general, o que tiene diarrea o cólicos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13828}. El mabtun está enfermo y excusado, por lo que las reglas para los enfermos y los excusados se aplican a él {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}. Los juristas cuentan como mártir a aquel que muere de su dolencia estomacal, en el hadiz de Abu Hurayra que enumera cinco tipos de mártires: el que muere de peste, el mabtun, el ahogado, el que muere por un derrumbe y el que muere en el camino de Dios; Concuerdan en que es un mártir del otro mundo y que se le lava para el entierro aunque se le considere un mártir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}."
  fr: "Dans le langage courant, le terme « mabtun » désigne une personne souffrant d'un mal de ventre; techniquement, il s'agit d'une personne atteinte d'une maladie de l'estomac, d'hydropisie, ou qui décède d'une affection gastrique en général, ou encore qui souffre de diarrhée ou de coliques (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13828). Le « mabtun » est considéré comme malade et excusé; par conséquent, les règles applicables aux malades et aux excusés s'appliquent à lui (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13829). Les juristes considèrent comme martyr celui qui meurt d'une affection de l'estomac, se basant sur le hadith d'Abu Hurayra qui énumère cinq types de martyrs: celui qui meurt de la peste, le « mabtun », le noyé, celui qui meurt d'un malaise et celui qui meurt pour la cause de Dieu. ils conviennent qu'il est un martyr du monde à venir, et qu'il est lavé pour l'enterrement bien qu'il soit considéré comme un martyr {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13829}."
  tr: "Mubatunlar dil hastalığı olan kişilerdir ve terminoloji olarak karın hastalığı olanlar, bazıları asit hastaları der, bazıları karın hastalığından ölen biri olduğunu, bazıları ise ishal veya kolik hastalığı olduğunu söyler {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13828}. Mubatun hasta ve affedilmiş, hasta ve mazeretli olanların kararları geçerlidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13829}. Mubatun hukukçuları, Ebu Hurere'nin beş şehit hakkındaki hadislerine dayanarak karnından ölürse onu şehit saymış ve onun ahiret şehitleri arasında olduğunu, şehit olarak sayılırken yıkanması gerektiğini kabul etmişlerdir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13829}."
  id: "Mubatun sakit secara linguistik, dan dalam istilah mereka yang menderita penyakit perut, dan beberapa mengatakan mereka yang memiliki ascites, dan beberapa mengatakan yang meninggal karena penyakit perut sama sekali, dan yang lain mengatakan yang mengalami diare atau kolik {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13828}. Mubatun sakit dan dimaafkan, dan putusan orang sakit serta yang memiliki alasan berlaku {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13829}. Para ahli hukum Mubatun menganggapnya martir jika ia meninggal di perut, berdasarkan hadits Abu Huraira tentang lima syuhada tersebut, dan sepakat bahwa ia termasuk di antara martir akhirat, dan harus dicuci saat dianggap sebagai martir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13829}."
