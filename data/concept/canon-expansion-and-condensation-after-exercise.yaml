id: concept/canon-expansion-and-condensation-after-exercise
class: concept
kind: scientific
label:
  ar: "التخلخل والتكاثف بعد الرياضة عند ابن سينا"
  en: "Expansion and condensation after exercise in the Canon"
  fr: "Expansion et condensation après exercice dans le Canon"
  ur: "ورزش کے بعد پھیلاؤ اور سکڑاؤ قانون میں"
  es: "Expansión y condensación tras el ejercicio en el Canon"
summary:
  ar: "يفتتح ابن سينا الفصل الخامس عشر في أحوال أخرى تتبع الرياضات من ترطيب وتخلخل وتكاثف مفرط، ويبدأ بالتخلخل الذي يعرض من الدلك اليسير ومن الحمام ويعالجه بدلك يابس يسير مائل إلى الصلابة مع دهن قابض، ثم يعدد أسباب التكاثف {cite:canon-ibn-sina-print-v1 p.246}."
  en: "Ibn Sina opens the fifteenth chapter on other states that follow exercise, moistening, expansion and excessive condensation, begins with the expansion that comes from slight rubbing and from the bath, treats it with slight dry rubbing leaning toward firmness and an astringent oil, and then lists the causes of condensation {cite:canon-ibn-sina-print-v1 p.246}."
  fr: "Au chapitre 15, Ibn Sina examine humidification, expansion et condensation excessive après exercice : l’expansion par friction légère et bain serait traitée par légère friction sèche plutôt ferme et huile astringente ; il énumère ensuite les causes de condensation {cite:canon-ibn-sina-print-v1 p.246}."
  es: "Ibn Sina abre el capítulo quince sobre otros estados que siguen al ejercicio, la humectación, la expansión y la condensación excesiva, comienza con la expansión que proviene del roce ligero y del baño, la trata con un roce seco ligero que tiende a la firmeza y un aceite astringente, y luego enumera las causas de la condensación {cite:canon-ibn-sina-print-v1 p.246}."
  ur: "ابن سینا دیگر ریاستوں کے بارے میں پندرہویں باب کو کھولتا ہے جو ورزش، نمی، توسیع اور بہت زیادہ گاڑھا ہونے کی پیروی کرتا ہے، اس توسیع سے شروع ہوتا ہے جو ہلکی رگڑ اور غسل سے آتا ہے، اس کا علاج مضبوطی اور کسی کسی تیل کی طرف جھکاؤ رکھنے والے خشک رگڑ کے ساتھ ہوتا ہے، اور پھر اس کی وجہ کو درج کرتا ہے۔ {حوالہ:کینن-ابن سینا-پرنٹ-v1 صفحہ 246}۔"
