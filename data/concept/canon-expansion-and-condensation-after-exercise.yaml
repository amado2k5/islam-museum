summary:
  ar: "يفتتح ابن سينا الفصل الخامس عشر في أحوال أخرى تتبع الرياضات من ترطيب وتخلخل وتكاثف مفرط، ويبدأ بالتخلخل الذي يعرض من الدلك اليسير ومن الحمام ويعالجه بدلك يابس يسير مائل إلى الصلابة مع دهن قابض، ثم يعدد أسباب التكاثف {cite:canon-ibn-sina-print-v1 p.246}."
  en: "Ibn Sina opens the fifteenth chapter on other states that follow exercise, moistening, expansion and excessive condensation, begins with the expansion that comes from slight rubbing and from the bath, treats it with slight dry rubbing leaning toward firmness and an astringent oil, and then lists the causes of condensation {cite:canon-ibn-sina-print-v1 p.246}."
