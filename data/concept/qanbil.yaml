summary:
  ar: "قنبيل في الكتاب بزور رملية تعلوها حمرة دون حمرة الورس، حار يابس في الثالثة فيه قبض شديد على قول ابن ماسويه، يقتل الديدان وحب القرع {cite:canon-ibn-sina-print-v1 p.650}"
  en: "Qanbil is in the book sandy seeds topped with a redness less than the redness of wars, hot and dry in the third degree with strong astringency on the word of Ibn Masawayh, killing worms and tapeworm {cite:canon-ibn-sina-print-v1 p.650}"
  ur: "قنبیل کتاب میں ریتلے بیج ہیں جن پر ورس کی سرخی سے کم سرخی ہے، تیسرے درجے میں گرم خشک اور ابن ماسویہ کے قول پر اس میں شدید قبض ہے، کیڑوں اور کدو دانے کو مارتا ہے {cite:canon-ibn-sina-print-v1 p.650}۔"
  es: "Qanbil es en el libro semillas arenosas cubiertas con un enrojecimiento menor que el enrojecimiento de las guerras, caliente y seco en tercer grado con fuerte astringencia en la palabra de Ibn Masawayh, mata gusanos y tenias {cite:canon-ibn-sina-print-v1 p.650}"
