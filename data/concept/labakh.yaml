label:
  ar: "لبخ"
  en: "Labakh (a large tree)"
  ur: "لبخ ⁦(بڑا درخت)⁩"
  es: "Labaj (un árbol grande)"
  fr: "Labakh (un grand arbre)"
summary:
  ar: "شجرة كبيرة يقال إنها السدر، نُقلت إلى مصر فتغيّر طبعها وطعمها، فصار ثمرها يؤكل ولا يضرّ، ويمنع النزف إذا ذُرّ ورقها على موضع يسيل منه الدم {cite:canon-ibn-sina-print-v1 p.373}."
  en: "A large tree said to be the lote tree, which was moved to Egypt where its taste changed, so that its fruit is eaten without harm. Its leaf, sprinkled on a place where blood flows, stops the bleeding {cite:canon-ibn-sina-print-v1 p.373}."
  ur: "ایک بڑا درخت، جسے کہا گیا ہے کہ یہ سدر ہے۔ اسے مصر لے جایا گیا تو اس کا ذائقہ بدل گیا اور اب اس کا پھل بغیر نقصان کے کھایا جاتا ہے۔ جہاں خون بہتا ہو وہاں اس کے پتے چھڑکنے سے خون بند ہوتا ہے {cite:canon-ibn-sina-print-v1 p.373}۔"
  es: "Se dice que un gran árbol es el árbol del loto, que fue trasladado a Egipto, donde su sabor cambió, de modo que su fruto se puede comer sin daño. Se cree que sus hojas, esparcidas sobre una zona donde fluye sangre, detienen la hemorragia {cite:canon-ibn-sina-print-v1 p.373}."
  fr: "Un grand arbre, que l'on dit être le lotus, fut introduit en Égypte où son goût s'est transformé, de sorte que son fruit est consommé sans danger. Sa feuille, répandue sur un lieu où le sang coule, arrête l'hémorragie {cite:canon-ibn-sina-print-v1 p.373}."
