summary:
  ar: "اللوف سبط وجعد، والجعد أقوى، حار إلى آخر الأولى أو الثانية، مفتح للسدد مقطع للأخلاط الغليظة جلاء، وينفع الجراح والكلف والأذن ويدخل في مراهم القروح {cite:canon-ibn-sina-print-v1 p.540} {cite:canon-ibn-sina-print-v1 p.541}."
  en: "Luf is smooth or curly, the curly being stronger; hot to the end of the first or the second degree, it opens obstructions, cuts thick humours and cleanses, and helps wounds, freckles and the ear and enters ointments for ulcers {cite:canon-ibn-sina-print-v1 p.540} {cite:canon-ibn-sina-print-v1 p.541}."
  ur: "لوف سبط اور جعد، اور جعد زیادہ قوی؛ پہلے یا دوسرے درجے کے آخر تک گرم، رکاوٹیں کھولتا، گاڑھے اخلاط کو کاٹتا اور جلا دیتا ہے، اور زخموں، جھائیوں اور کان میں مفید ہے اور پھوڑوں کے مرہموں میں داخل ہے {cite:canon-ibn-sina-print-v1 p.540} {cite:canon-ibn-sina-print-v1 p.541}۔"
  es: "Luf es liso o rizado, siendo el rizado más fuerte; caliente hasta el final del primer o segundo grado, abre obstrucciones, corta humores espesos y limpia, y ayuda a heridas, pecas y oídos y entra en ungüentos para úlceras {cite:canon-ibn-sina-print-v1 p.540} {cite:canon-ibn-sina-print-v1 p.541}."
  fr: "Luf est lisse ou frisé, le frisé étant plus fort; chaud jusqu'à la fin du premier ou du deuxième degré, il ouvre les obstructions, coupe les humeurs épaisses et nettoie, et aide les plaies, les taches de rousseur et l'oreille et entre dans les onguents pour les ulcères {cite:canon-ibn-sina-print-v1 p.540} {cite:canon-ibn-sina-print-v1 p.541}."
