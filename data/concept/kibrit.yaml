summary:
  ar: "الكبريت عند الكتاب حار يابس إلى الرابعة، ملطف جاذب محلل جدا، من أدوية البرص، ويُستعمل على الجرب المتقرح والحكة والنقرس والزكام."
  en: "Sulphur, kibrit, is hot and dry up to the fourth degree, thinning, drawing and very resolving, according to the book. It is one of the medicines for leukoderma, and is used on ulcerated scabies, itching, gout and catarrh."
  ur: "کتاب کے نزدیک کبریت چوتھے درجے تک گرم اور خشک ہے، باریک کرنے والا، کھینچنے والا اور نہایت محلل ہے۔ یہ برص کی دواؤں میں سے ہے، اور زخمی خارش، خارش، گاؤٹ اور زکام پر استعمال ہوتا ہے۔"
  es: "El azufre, o kibrit, es caliente y seco hasta el cuarto grado, adelgazante, tirante y muy resolutivo, según el libro. Es uno de los medicamentos para la vitíligo y se usa para la sarna ulcerada, el picor, la gota y el catarro."
