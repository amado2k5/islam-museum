id: concept/zij-sabi-the-suns-apparent-diameter-varies-with-distance
class: concept
kind: scientific
label: { ar: "تغيّر القطر الظاهري للشمس مع بُعدها", en: "The Sun's apparent diameter varies with its distance", ur: "سورج کا ظاہری قطر اس کے فاصلے کے ساتھ بدلتا ہے", es: "El diámetro aparente del Sol varía con su distancia.", fr: "Le diamètre apparent du Soleil varie en fonction de sa distance." }
summary:
  ar: "يعيب البتاني على بطليموس أنه جعل قطر الشمس ثابتاً في كسوفين استعملهما، ويقرر أن رصده أظهر تغيّراً بيّناً لقطر الشمس مع القمر بين بعديها الأبعد والأقرب، وإن كان قليلاً في ذاته. {cite:zij-sabi-nallino-byblion p.84}."
  en: "Al-Battani faults Ptolemy for treating the Sun's diameter as fixed in the two eclipses he used, and holds that his own observations showed a clear change in the Sun's diameter between its farthest and nearest distances, though small in itself. {cite:zij-sabi-nallino-byblion p.84}."
  ur: "البتانی بطلیموس پر یہ اعتراض کرتے ہیں کہ انہوں نے جن دو کسوفات سے استدلال کیا ان میں سورج کا قطر ثابت مانا، اور وہ کہتے ہیں کہ ان کے رصد سے سورج کے سب سے دور اور سب سے قریب فاصلے کے درمیان قطر میں واضح تبدیلی ظاہر ہوئی، اگرچہ وہ بذاتِ خود تھوڑی ہے۔ {cite:zij-sabi-nallino-byblion p.84}۔"
  es: "Al-Battani critica a Ptolomeo por considerar fijo el diámetro del Sol en los dos eclipses que utilizó, y sostiene que sus propias observaciones mostraron un cambio claro en el diámetro del Sol entre sus distancias más lejana y más cercana, aunque pequeño en sí mismo. {cite:zij-sabi-nallino-byblion p.84}."
  fr: "Al-Battani reproche à Ptolémée d'avoir considéré le diamètre du Soleil comme fixe lors des deux éclipses qu'il a utilisées, et soutient que ses propres observations ont montré une variation nette du diamètre du Soleil entre ses distances maximale et minimale, bien que faible en soi. {cite:zij-sabi-nallino-byblion p.84}."
