id: concept/khilafat-al-insan-fi-al-ard
class: concept
kind: doctrine
label:
  ar: "خلافة الإنسان في الأرض"
  en: "The human khilafa (stewardship) on earth"
  ur: "زمین میں انسان کی خلافت"
summary:
  ar: "يرى الشعراوي أن الخلافة تعني تعاقب الناس على الأرض، وأن الله سخّر الكون لآدم بإرادته، وأن الملائكة أُعلموا بها لأن لهم مهام مع هذا المخلوق الجديد {cite:tafsir-sharawi-khawatir-scan p.241} {cite:tafsir-sharawi-khawatir-scan p.242}."
  en: "Sha'rawi holds that khilafa means the succession of people on the earth, that God subjected the universe to Adam by His will, and that the angels were informed because they had tasks with this new creature {cite:tafsir-sharawi-khawatir-scan p.241} {cite:tafsir-sharawi-khawatir-scan p.242}."
  ur: "شعراوی کے نزدیک خلافت کا مطلب زمین پر لوگوں کا یکے بعد دیگرے آنا ہے، اللہ نے کائنات کو اپنی مشیت سے آدم کے لیے مسخر کیا، اور فرشتوں کو اس کی خبر اس لیے دی گئی کہ ان کا اس نئی مخلوق سے کام تھا {cite:tafsir-sharawi-khawatir-scan p.241} {cite:tafsir-sharawi-khawatir-scan p.242}۔"
