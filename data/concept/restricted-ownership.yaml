perspectives:
- tradition: sunni
  id: maliki-hanbali-allow-airspace-sale
  stance:
    ar: 'المالكية والحنابلة: يجوز بيع الهواء فوق البناء لمن ينتفع به'
  summary:
    ar: أجاز المالكية والحنابلة بيع علو السقف لمن ينتفع به، مع وصف البناء الأعلى والأسفل وتقدير الأعلى بأذرع معلومة، لأن متانة الأسفل يرغب فيها صاحب الأعلى وخفة الأعلى يرغب فيها صاحب الأسفل {cite:usul-iqtisad-islami-0660 p. 52} {cite:usul-iqtisad-islami-0660 p. 53}.
    en: The Malikis and the Hanbalis allow the sale of airspace above a building to a user, the upper and lower structures being described and the upper measured in fixed cubits (pp. 52-53).
  sources:
  - source/usul-iqtisad-islami-0660
- tradition: sunni
  id: hanafi-shafii-zahiri-forbid-airspace-sale
  stance:
    ar: 'الحنفية والشافعية والظاهرية: لا يجوز إفراد الهواء بالعقد'
  summary:
    ar: منع الحنفية والشافعية والظاهرية بيع الهواء، لأن الهواء عندهم من توابع الملك فلا يجوز إفراده بالعقد {cite:usul-iqtisad-islami-0660 p. 53}.
    en: The Hanafis, Shafi'is and Zahiris forbid the sale of airspace, treating it as an accessory of the ownership that cannot be contracted on its own (p. 53).
  sources:
  - source/usul-iqtisad-islami-0660
- tradition: academic
  id: author-incline-first
  stance:
    ar: 'رأي المؤلف: يميل إلى جواز بيع الهواء، وهو رأيه لا رأي مذهب'
  summary:
    ar: يقول المؤلف «ونحن نميل إلى الرأي الأول» مرجحًا جواز بيع الهواء، وهذا ترجيحه الخاص لا قول مذهب بعينه {cite:usul-iqtisad-islami-0660 p. 53}.
    en: The author says he inclines to the first view (permitting the sale); this is his own preference, not a school's position (p. 53).
  sources:
  - source/usul-iqtisad-islami-0660
- tradition: shia-zaydi
  id: zaydi-forbid-airspace-sale
  stance:
    ar: 'الزيدية: كالحنفية والشافعية في المنع'
  summary:
    ar: تذكر الزيدية مع الحنفية والشافعية والظاهرية في المنع من بيع الهواء {cite:usul-iqtisad-islami-0660 p. 53}.
    en: The Zaydis are listed with the forbidding group on the sale of airspace (p. 53).
  sources:
  - source/usul-iqtisad-islami-0660
