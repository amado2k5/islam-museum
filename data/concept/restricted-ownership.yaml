label:
  ar: الملكية المقيّدة
  en: Restricted ownership
summary:
  ar: 'الملكية المطلقة لله، وملكية البشر مقيدة بقيود وواجبات {cite:usul-iqtisad-islami-0660 p. 50}، وهي صلة بين الإنسان وشيء تمكّنه من الانتفاع به والتصرف فيه وتمنع غيره {cite:usul-iqtisad-islami-0660 p. 50}. وتنقسم الملكية إلى خاصة، وعامة لجماعة المسلمين لا يتصرف فيها فرد ولا دولة، كالمياه والكلأ والنار والمرافق والحمى والأوقاف، وملكية الدولة أو بيت المال {cite:usul-iqtisad-islami-0660 p. 55} {cite:usul-iqtisad-islami-0660 p. 56} {cite:usul-iqtisad-islami-0660 p. 58}. ويستدل المؤلف على الملكية الخاصة بآيات الأموال والميراث والزكاة وبحديث حرمة الدماء والأموال {cite:usul-iqtisad-islami-0660 p. 56}. ويُظهر المؤلف رأيين في بيع الهواء فوق الدار: أجازه المالكية والحنابلة، ومنعه الحنفية والشافعية والظاهرية والزيدية، وهو يميل إلى الأول {cite:usul-iqtisad-islami-0660 p. 52} {cite:usul-iqtisad-islami-0660 p. 53}. والمرافق العامة شركة إباحة لا يجوز أن يتنازل عنها أحد بعوض أو بغير عوض {cite:usul-iqtisad-islami-0660 p. 58} {cite:usul-iqtisad-islami-0660 p. 59}.'
