label:
  ar: الملكية المقيّدة
  en: Restricted ownership
  es: "Propiedad restringida"
  fr: "Propriété restreinte"
  ur: "محدود ملکیت"
  tr: "Kısıtlı mülkiyet"
  id: "Kepemilikan terbatas"
summary:
  ar: 'الملكية المطلقة لله، وملكية البشر مقيدة بقيود وواجبات {cite:usul-iqtisad-islami-0660 p. 50}، وهي صلة بين الإنسان وشيء تمكّنه من الانتفاع به والتصرف فيه وتمنع غيره {cite:usul-iqtisad-islami-0660 p. 50}. وتنقسم الملكية إلى خاصة، وعامة لجماعة المسلمين لا يتصرف فيها فرد ولا دولة، كالمياه والكلأ والنار والمرافق والحمى والأوقاف، وملكية الدولة أو بيت المال {cite:usul-iqtisad-islami-0660 p. 55} {cite:usul-iqtisad-islami-0660 p. 56} {cite:usul-iqtisad-islami-0660 p. 58}. ويستدل المؤلف على الملكية الخاصة بآيات الأموال والميراث والزكاة وبحديث حرمة الدماء والأموال {cite:usul-iqtisad-islami-0660 p. 56}. ويُظهر المؤلف رأيين في بيع الهواء فوق الدار: أجازه المالكية والحنابلة، ومنعه الحنفية والشافعية والظاهرية والزيدية، وهو يميل إلى الأول {cite:usul-iqtisad-islami-0660 p. 52} {cite:usul-iqtisad-islami-0660 p. 53}. والمرافق العامة شركة إباحة لا يجوز أن يتنازل عنها أحد بعوض أو بغير عوض {cite:usul-iqtisad-islami-0660 p. 58} {cite:usul-iqtisad-islami-0660 p. 59}.'
  tr: "Mutlak mülkiyet Tanrı'ya aittir ve insan mülkiyeti, bir kişi ile bir şey arasındaki bağlantıyı sağlayan ve başkalarını engelleyen bir şey ile bağlantıdır {cite:usul-iqtisad-islami-0660 s. 50} [cite:usul-iqtisad-islami-0660 s. 50}. Mülkiyet, Müslüman topluluğu için özel ve genel olarak bölünür; bu topluluklar birey veya devlet tarafından kontrol edilmez; su, otlak, yangın, kamu hizmetleri, vakf, devlet mülkiyeti veya kamu hazinesi {cite:usul-iqtisad-islami-0660 s. 55} {cite:usul-iqtisad-islami-0660 s. 56} {cite:usul-iqtisad-islami-0660 s. 58}. Yazar, servet, miras ve zekat ayetleri ile kan ve mal varlığı kutsallığı hadislerine atıfta bulunur {cite:usul-iqtisad-islami-0660, s. 56}. Yazar, evlerin üstünde hava satışıyla ilgili iki görüş sunar: Maliki ve Hanbali izinleri, Hanefiler, Şafi'ler, Zahiriler ve Zaydiler bunu yasaklar; ilki {cite:usul-iqtisad-islami-0660 s. 52} {cite:usul-iqtisad-islami-0660 s. 53} Kamu tesisleri, kimsenin tazminat karşılığında veya tazminatsız olarak feragat edemeyeceği izin verilen şirketlerdir {cite:usul-iqtisad-islami-0660 s. 58} {cite:usul-iqtisad-islami-0660 s. 59}."
  id: "Kepemilikan mutlak adalah milik Tuhan, dan kepemilikan manusia dibatasi oleh pembatasan dan kewajiban {cite:usul-iqtisad-islami-0660 hlm. 50}, yaitu hubungan antara seseorang dan sesuatu yang memungkinkan seseorang untuk mendapatkan manfaat dan melepaskannya serta mencegah orang lain {cite:usul-iqtisad-islami-0660 hlm. 50}. Kepemilikan dibagi menjadi pribadi dan umum untuk komunitas Muslim, yang tidak dikendalikan oleh individu atau negara, seperti air, padang rumput, api, utilitas, waqf, atau kepemilikan negara atau kas negara {cite:usul-iqtisad-islami-0660 hlm. 55} {cite:usul-iqtisad-islami-0660 hlm. 56} {cite:usul-iqtisad-islami-0660 hlm. 58}. Penulis mengutip kepemilikan pribadi terkait ayat-ayat kekayaan, warisan, dan zakat, serta hadits tentang kesucian darah dan harta {cite:usul-iqtisad-islami-0660, hlm. 56}. Penulis menyampaikan dua pendapat mengenai penjualan udara di atas rumah: izin Maliki dan Hanbali, dan Hanafi, Shafi'i, Zahiri, dan Zaydi melarangnya, dan ia condong ke yang pertama {cite:usul-iqtisad-islami-0660 hlm. 52} {cite:usul-iqtisad-islami-0660 hlm. 53}. Fasilitas publik adalah perusahaan yang diperbolehkan yang tidak boleh dilepaskan oleh siapa pun dengan kompensasi atau tanpa kompensasi {cite:usul-iqtisad-islami-0660 hlm. 58} {cite:usul-iqtisad-islami-0660 hlm. 59}."
