label: { ar: "السفر في البرد عند ابن سينا", en: "Travelling in the cold in the Canon", ur: "سردی میں سفر قانون میں" }
summary:
  ar: "يعد ابن سينا السفر في البرد الشديد عظيم الخطر، فكم من مسافر متدثر قتله البرد بتشنج وكزاز وجمود وسكتة، ويوصي بسد المسام وحفظ الأنف والفم من الهواء البارد المفاجئ، وألا يدفأ المسافر في الحال بل يتدرج، وألا يقترب من النار، ويغتذي بما فيه ثوم وجوز وخردل وحلتيت، وألا يسافر خاوياً {cite:canon-ibn-sina-print-v1 pp.262-263}."
  en: "Ibn Sina counts travel in severe cold a great danger: many a well-wrapped traveller has been killed by cold with spasm, tetanus, rigidity and apoplexy; he advises closing the pores, guarding nose and mouth from sudden cold air, warming not at once but by degrees, keeping from the fire, eating dishes rich in garlic, walnut, mustard and asafoetida, and not travelling empty {cite:canon-ibn-sina-print-v1 pp.262-263}."
