id: concept/canon-travelling-in-the-cold
class: concept
kind: scientific
label: { ar: "السفر في البرد عند ابن سينا", en: "Travelling in the cold in the Canon", ur: "سردی میں سفر قانون میں", es: "Viajar en el frío en el Canon", fr: "Voyager dans le froid dans le Canon" }
summary:
  ar: "يعد ابن سينا السفر في البرد الشديد عظيم الخطر، فكم من مسافر متدثر قتله البرد بتشنج وكزاز وجمود وسكتة، ويوصي بسد المسام وحفظ الأنف والفم من الهواء البارد المفاجئ، وألا يدفأ المسافر في الحال بل يتدرج، وألا يقترب من النار، ويغتذي بما فيه ثوم وجوز وخردل وحلتيت، وألا يسافر خاوياً {cite:canon-ibn-sina-print-v1 pp.262-263}."
  en: "Ibn Sina counts travel in severe cold a great danger: many a well-wrapped traveller has been killed by cold with spasm, tetanus, rigidity and apoplexy; he advises closing the pores, guarding nose and mouth from sudden cold air, warming not at once but by degrees, keeping from the fire, eating dishes rich in garlic, walnut, mustard and asafoetida, and not travelling empty {cite:canon-ibn-sina-print-v1 pp.262-263}."
  es: "Ibn Sina considera que viajar con frío intenso es un gran peligro: muchos viajeros bien abrigados han muerto de frío con espasmos, tétanos, rigidez y apoplejía; aconseja cerrar los poros, proteger la nariz y la boca del aire frío repentino, calentarse no de golpe sino gradualmente, mantenerse alejado del fuego, comer platos ricos en ajo, nueces, mostaza y asafétida, y no viajar vacío {cite:canon-ibn-sina-print-v1 pp.262-263}."
  fr: "Ibn Sina considère les voyages par grand froid comme un grand danger: de nombreux voyageurs bien emmitouflés ont été tués par le froid avec des spasmes, du tétanos, de la rigidité et de l'apoplexie; il conseille de fermer les pores, de protéger le nez et la bouche de l'air froid soudain, de se réchauffer non pas d'un coup mais progressivement, de se tenir à l'écart du feu, de manger des plats riches en ail, noix, moutarde et asafoetida, et de ne pas voyager les mains vides {cite:canon-ibn-sina-print-v1 pp.262-263}."
  ur: "ابن سینا سخت سردی میں سفر کو ایک بڑا خطرہ شمار کرتا ہے: بہت سے اچھی طرح لپٹے ہوئے مسافر سردی سے اینٹھن، تشنج، سختی اور اپوپلکسی سے ہلاک ہو چکے ہیں۔ وہ چھیدوں کو بند کرنے، ناک اور منہ کو اچانک ٹھنڈی ہوا سے بچانے، ایک دم نہیں بلکہ ڈگری کے حساب سے گرم کرنے، آگ سے بچنے، لہسن، اخروٹ، سرسوں اور ہینگ سے بھرپور پکوان کھانے اور خالی سفر نہ کرنے کا مشورہ دیتے ہیں۔"
