label: { ar: "العصبية الفارسية والإسلام", en: "Persian ethnic sentiment and Islam", es: "El sentimiento étnico persa y el islam", fr: "Sentiment ethnique persan et islam", ur: "فارسی نسلی جذبات اور اسلام", tr: "Fars Nervousizmi ve İslam", id: "Nervousisme Persia dan Islam" }
summary:
  ar: "يصف شكيب أرسلان ما لاحظه من عالمين فارسيين كبيرين، متدينين ومتشيعين، يحبان آل البيت، ثم ينقلبان إلى التعصب القومي الفارسي ويكرهان العرب حين يدور الكلام في القوميات. يرى أرسلان أن هذا التناقض يتصل بالتاريخ الفارسي القديم وبما ظهر بعد الفتح من حركات مثل حركة بابك الخرمي في عهد المعتصم، وهي في عرضه حركة ذات نزعة مجوسية ومزدكية. ويعرض رأيه أن الإسلام دين لا يفرّق بين العربي والعجمي، ويسوق أمثلة من تاريخ الفتوح والخلفاء في معاملة الشعوب المفتوحة. هذا عرض لرأي المؤلف وملاحظاته، ولا يصح أن يُؤخذ حكماً على الجماعات أو الأفراد."
  en: "Arslan describes two senior Persian scholars he knew, devout Shi'is who loved the family of the Prophet, yet turned hostile to Arabs when nationality came up. He reads this tension against pre-Islamic Persian religions and against later movements, such as Babak al-Khurrami's revolt under al-Mu'tasim, which he presents as a revival of Mazdakite and Magian ideas. He argues that Islam makes no distinction between Arab and non-Arab. This is his observation and argument, not a verdict on any community."
  es: "Arslan describe a dos destacados eruditos persas que conoció, chiítas devotos que amaban a la familia del Profeta, pero que se volvieron hostiles hacia los árabes cuando surgió el tema de la nacionalidad. Interpreta esta tensión como un reflejo de las religiones persas preislámicas y de movimientos posteriores, como la revuelta de Babak al-Khurrami bajo al-Mu'tasim, que presenta como un resurgimiento de las ideas mazdakitas y magias. Sostiene que el islam no distingue entre árabes y no árabes. Esta es su observación y argumento, no un veredicto sobre ninguna comunidad."
  fr: "Arslan décrit deux éminents érudits persans qu'il a connus, de fervents chiites vénérant la famille du Prophète, mais qui se montrèrent hostiles aux Arabes dès que la question de la nationalité fut abordée. Il interprète cette tension comme une critique des religions persanes préislamiques et des mouvements ultérieurs, tels que la révolte de Babak al-Khurrami sous l'égide d'al-Mu'tasim, qu'il présente comme une renaissance des idées mazdakites et mages. Il affirme que l'islam ne fait aucune distinction entre Arabes et non-Arabes. Il s'agit là de son observation et de son argumentation, et non d'un jugement porté sur une quelconque communauté."
  ur: "ارسلان دو سینئر فارسی اسکالرز کے بارے میں بتاتے ہیں جنہیں وہ جانتے تھے، دیندار شیعہ جو پیغمبر کے خاندان سے محبت کرتے تھے، لیکن جب قومیت سامنے آئی تو عربوں سے دشمنی اختیار کی۔ وہ اس تناؤ کو قبل از اسلام کے فارسی مذاہب کے خلاف اور بعد کی تحریکوں کے خلاف پڑھتا ہے، جیسے المعتصم کے تحت بابک الخرمی کی بغاوت، جسے وہ مزدکیت اور مجوسی نظریات کے احیاء کے طور پر پیش کرتا ہے۔ وہ دلیل دیتے ہیں کہ اسلام عرب اور غیر عرب میں کوئی فرق نہیں کرتا۔ یہ اس کا مشاہدہ اور دلیل ہے، کسی برادری کے بارے میں فیصلہ نہیں۔"
  tr: "Shakib Arslan, Ahl al-Bayt'ı seven iki büyük Fars âlimi, dini ve Şii hakkında gözlemlediklerini, ardından etnik kökenler üzerine döndüğünde Pers milliyetçisi fanatizme dönüştü ve Araplardan nefret etti. Arslan, bu çelişkiyi antik Pers tarihi ve fetih sonrası ortaya çıkan hareketlerle, örneğin el-Mu'tasim döneminde ortaya çıkan Babak al-Khurrami hareketiyle bağlantılı olarak görür; bu hareket, onun sunumunda Magian ve Mazdaki eğilimlerine sahip bir harekettir. İslam'ın Araplar ile Arap olmayanlar arasında ayrım yapmayan bir din olduğu görüşünü sunar ve açık halklarla ilişkide fetihler ve halifeler tarihinden örnekler sunar. Bu, yazarın görüş ve gözlemlerinin bir sunumudur ve grupları veya bireyleri yargılamak uygun değildir."
  id: "Shakib Arslan menggambarkan apa yang dia amati tentang dua ulama besar Persia, religius dan Syiah, yang mencintai Ahl al-Bayt, kemudian berubah menjadi fanatisme nasionalis Persia dan membenci orang Arab ketika diskusi berputar pada etnis. Arslan melihat kontradiksi ini terkait dengan sejarah Persia kuno dan gerakan yang muncul setelah penaklukan, seperti gerakan Babak al-Khurrami pada masa pemerintahan al-Mu'tasim, yang dalam presentasinya adalah gerakan dengan kecenderungan Magian dan Mazdaki. Dia menyajikan pandangannya bahwa Islam adalah agama yang tidak membedakan antara Arab dan non-Arab, dan menyajikan contoh dari sejarah penaklukan dan khalifah dalam menghadapi masyarakat terbuka. Ini adalah penyajian pendapat dan pengamatan penulis, dan tidak tepat untuk menilai kelompok atau individu."
