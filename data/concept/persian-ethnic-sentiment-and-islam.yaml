label: { ar: "العصبية الفارسية والإسلام", en: "Persian ethnic sentiment and Islam" }
summary:
  ar: "يصف شكيب أرسلان ما لاحظه من عالمين فارسيين كبيرين، متدينين ومتشيعين، يحبان آل البيت، ثم ينقلبان إلى التعصب القومي الفارسي ويكرهان العرب حين يدور الكلام في القوميات. يرى أرسلان أن هذا التناقض يتصل بالتاريخ الفارسي القديم وبما ظهر بعد الفتح من حركات مثل حركة بابك الخرمي في عهد المعتصم، وهي في عرضه حركة ذات نزعة مجوسية ومزدكية. ويعرض رأيه أن الإسلام دين لا يفرّق بين العربي والعجمي، ويسوق أمثلة من تاريخ الفتوح والخلفاء في معاملة الشعوب المفتوحة. هذا عرض لرأي المؤلف وملاحظاته، ولا يصح أن يُؤخذ حكماً على الجماعات أو الأفراد."
  en: "Arslan describes two senior Persian scholars he knew, devout Shi'is who loved the family of the Prophet, yet turned hostile to Arabs when nationality came up. He reads this tension against pre-Islamic Persian religions and against later movements, such as Babak al-Khurrami's revolt under al-Mu'tasim, which he presents as a revival of Mazdakite and Magian ideas. He argues that Islam makes no distinction between Arab and non-Arab. This is his observation and argument, not a verdict on any community."
