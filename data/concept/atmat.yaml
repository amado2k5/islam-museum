summary:
  ar: "دواء هندي في قوّة البوزندان، حار رطب، يزيد في الباه بحسب الكتاب، ويجب التثبّت منه حتى لا يُخلط بأطيوط {cite:canon-ibn-sina-print-v1 p.379}."
  en: "An Indian drug with the power of buzandan. Hot and moist; the book says it increases the desire for intercourse, and warns that it must not be confused with atiyut {cite:canon-ibn-sina-print-v1 p.379}."
  fr: "Médicament indien ayant la puissance du buzandan. Chaud et humide ; le livre dit qu’il augmente le désir de rapports sexuels et avertit qu’il ne doit pas être confondu avec l’atiyut {cite:canon-ibn-sina-print-v1 p.379}."
  ur: "ایک ہندی دوا جس کی قوت بوزندان جیسی ہے۔ طبیعت میں گرم اور تر؛ کتاب کے مطابق یہ جماع کی رغبت بڑھاتی ہے، اور خبردار کرتی ہے کہ اسے اطیوط سے خلط نہ کیا جائے {cite:canon-ibn-sina-print-v1 p.379}۔"
