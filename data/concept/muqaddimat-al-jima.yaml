label: { ar: "مُقَدِّمات الجِمَاع", en: "Preliminaries to intercourse (muqaddimat al-jima')", ur: "مُقَدِّماتِ جِماع" }
summary:
  ar: "مقدمات الجماع هي ما يتقدم عليه من تقبيل ولمس ومباشرة. والفقهاء فصّلوا أحكامها فيما يترتب عليها في الحج والصيام والرجعة والظهار وحرمة المصاهرة، ويسن للزوج أن يلاطف زوجته قبل الجماع. وأما الأصوليون فعنوا بمقدمة الواجب، وهي ما يتوقف عليه الواجب وتبعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14919}"
  en: "Preliminaries to intercourse are the kissing, touching and close contact that come before it. The jurists rule on them where they bear consequences: in the pilgrimage, in fasting, in revocable divorce, in zihar and in affinity. A husband is recommended to caress his wife before intercourse so that her desire rises with his. In usul the word muqaddima also means the precondition of an obligation, on which the usul appendix has the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14919}"
  ur: "مقدماتِ جماع سے مراد بوسہ، لمس اور قربت ہے۔ فقہاء نے ان کے احکام حج، روزے، رجعت، ظہار اور حرمتِ مصاہرت میں بیان کیے ہیں، اور شوہر کے لیے جماع سے پہلے بیوی سے ملاطفت مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14919}"
