id: concept/muqaddimat-al-jima
class: concept
kind: legal
label: { ar: "مُقَدِّمات الجِمَاع", en: "Preliminaries to intercourse (muqaddimat al-jima')", ur: "مُقَدِّماتِ جِماع", es: "Preliminares al coito (muqaddimat al-jima')", fr: "Préliminaires aux rapports sexuels (muqaddimat al-jima')", tr: "Hazırlık öncesi", id: "Pra-koimasi" }
summary:
  ar: "مقدمات الجماع هي ما يتقدم عليه من تقبيل ولمس ومباشرة. والفقهاء فصّلوا أحكامها فيما يترتب عليها في الحج والصيام والرجعة والظهار وحرمة المصاهرة، ويسن للزوج أن يلاطف زوجته قبل الجماع. وأما الأصوليون فعنوا بمقدمة الواجب، وهي ما يتوقف عليه الواجب وتبعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14919}"
  en: "Preliminaries to intercourse are the kissing, touching and close contact that come before it. The jurists rule on them where they bear consequences: in the pilgrimage, in fasting, in revocable divorce, in zihar and in affinity. A husband is recommended to caress his wife before intercourse so that her desire rises with his. In usul the word muqaddima also means the precondition of an obligation, on which the usul appendix has the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14919}"
  ur: "مقدماتِ جماع سے مراد بوسہ، لمس اور قربت ہے۔ فقہاء نے ان کے احکام حج، روزے، رجعت، ظہار اور حرمتِ مصاہرت میں بیان کیے ہیں، اور شوہر کے لیے جماع سے پہلے بیوی سے ملاطفت مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14919}"
  es: "Los preliminares al coito son los besos, las caricias y el contacto íntimo que lo preceden. Los juristas dictaminan sobre ellos cuando tienen consecuencias: en la peregrinación, en el ayuno, en el divorcio revocable, en el zihar y en la afinidad. Se recomienda al marido acariciar a su esposa antes del coito para que su deseo aumente con el de ella. En usul, la palabra muqaddima también significa la condición previa de una obligación, sobre la cual el apéndice de usul contiene detalles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14919}"
  fr: "Les préliminaires à l'acte sexuel comprennent les baisers, les caresses et les contacts intimes qui le précèdent. Les juristes statuent sur ces préliminaires lorsqu'ils ont des conséquences: le pèlerinage, le jeûne, le divorce révocable, le zihar et l'alliance. Il est recommandé au mari de caresser sa femme avant l'acte sexuel afin d'éveiller son désir. En usul, le terme muqaddima désigne également la condition préalable à une obligation, sujet détaillé dans l'appendice usul."
  tr: "Cinsel ilişki için ön koşullar, öpüşme, dokunma ve doğrudan temastan önceki koşullardır. Hukukçular, Hac, oruç, dönüş, zihar ve evliliğin yasaklanması gibi sonuçları hakkında kararlarını ayrıntılı olarak vermişlerdir. Kocanın, cinsel ilişkiden önce eşine karşı nazik olması önerilir. Usul bilginleri ise ön yükümlülüğe odaklanmışlardır; bu yükümlülük buna dayanır ve onu takip eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14919}"
  id: "Prasyarat untuk berhubungan seksual adalah yang mendahului ciuman, sentuhan, dan kontak langsung. Para ahli hukum telah merinci putusan mereka mengenai konsekuensi Haji, puasa, kembali, zihar, dan larangan pernikahan. Disarankan agar suami bersikap lembut kepada istrinya sebelum berhubungan seks. Adapun para ulama usul, mereka fokus pada kewajiban awal, yaitu yang menjadi dasar dan mengikutinya kewajiban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14919}"
