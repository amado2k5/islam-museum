summary:
  ar: "الريحان في الكتاب نبت معروف ذو صنفين، يطلى بعد دقه للبواسير، ودهنه مرهما ينفع من النفخ العارض في المعدة {cite:canon-ibn-sina-print-v1 p.661}"
  en: "Rayhan is in the book a well-known plant of two kinds, smeared on after crushing for haemorrhoids, and its oil made into an ointment benefits flatulence arising in the stomach {cite:canon-ibn-sina-print-v1 p.661}"
  ur: "ریحان کتاب میں ایک معروف پودا ہے جس کی دو قسمیں ہیں؛ کوٹ کر بواسیر پر لگایا جاتا ہے، اور اس کا تیل مرہم بنا کر معدے میں پیدا ہونے والی ریاح میں نافع ہے {cite:canon-ibn-sina-print-v1 p.661}۔"
  es: "En el libro, Rayhan es una planta muy conocida de dos tipos, que se aplica después de triturarla para las hemorroides, y cuyo aceite, convertido en ungüento, beneficia la flatulencia estomacal {cite:canon-ibn-sina-print-v1 p.661}."
