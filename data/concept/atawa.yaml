summary:
  ar: "الأتاوة مال يؤديه ملك أو بلد لولي الأمر على وجه الصلح كما كانت أتاوة رتبيل للحجاج على أن لا يغزوه ثم في كل سنة تسعمائة ألف درهم عروضاً وقال رتبيل في عمال بني أمية إنهم لا ينفقون درهماً إلا إذا طمعوا في أن يرجع إليهم مكانه عشرة فلم يعطهم منها شيئاً."
  en: "The atawa, money a king or country pays the ruling power under sulh — as Rutbil's to al-Hajjaj, nine hundred thousand yearly after the truce-years; refusing the Umayyad agents he said they never spend a dirham but they hope for ten in return."
