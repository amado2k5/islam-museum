summary:
  ar: "الأتاوة مال يؤديه ملك أو بلد لولي الأمر على وجه الصلح كما كانت أتاوة رتبيل للحجاج على أن لا يغزوه ثم في كل سنة تسعمائة ألف درهم عروضاً وقال رتبيل في عمال بني أمية إنهم لا ينفقون درهماً إلا إذا طمعوا في أن يرجع إليهم مكانه عشرة فلم يعطهم منها شيئاً."
  en: "The atawa, money a king or country pays the ruling power under sulh — as Rutbil's to al-Hajjaj, nine hundred thousand yearly after the truce-years; refusing the Umayyad agents he said they never spend a dirham but they hope for ten in return."
  fr: "L’atawa, argent qu’un roi ou un pays verse au pouvoir dirigeant au titre d’un sulh — comme celui de Rutbil à al-Hajjaj, neuf cent mille par an après les années de trêve ; refusant de payer les agents omeyyades, il disait qu’ils ne dépensaient jamais un dirham sans espérer en recevoir dix en retour."
  es: "El atawa, dinero que un rey o país paga al poder gobernante bajo el sulh, como el de Rutbil a al-Hajjaj, novecientos mil anuales después de los años de tregua; rechazando a los agentes omeyas, dijo que nunca gastaban un dirham pero que esperaban diez a cambio."
