  es: "La división que hicieron Herzfeld y Creswell del estuco excavado en los palacios abasíes de Samarra en tres estilos coexistentes, traído a Egipto por Ibn Tulun y conservado in situ en su mezquita {cite:yeomans-islamic-cairo-2006 p.37}."
  fr: "La division par Herzfeld et Creswell du stuc mis au jour dans les palais abbassides de Samarra en trois styles coexistants, apportés en Égypte par Ibn Tulun et conservés in situ dans sa mosquée {cite:yeomans-islamic-cairo-2006 p.37}."
  ur: "ہرزفیلڈ اور کریس ویل کے سٹوکو کی تقسیم سامرا کے عباسی محلات میں تین ایک ساتھ موجود طرزوں میں ہوئی، جسے ابن طولون مصر لائے اور اپنی مسجد میں محفوظ رکھا۔"
