id: concept/tawatur-and-ahad-in-history
class: concept
kind: term
label:
  ar: "التواتر وخبر الآحاد في كتابة التاريخ"
  en: "Mass report and single report in writing history"
  ur: "تاریخ نویسی میں تواتر اور خبرِ آحاد"
  fr: "Rapport massif et rapport unique dans l'écriture de l'histoire"
  es: "Informe múltiple e informe único en la escritura de la historia"
summary:
  ar: "منهج رشيد الدين في نقل الأخبار كما عرضه في مقدمة جامع التواريخ. يفرّق بين النقل المتواتر الذي يفيد العلم ولا شبهة فيه، كوجود الرسل والملوك القدماء والمدن البعيدة، وبين نقل الآحاد الذي يحتمل الصدق والكذب، وهو معظم ما يُروى من أخبار الناس. ويرى أن الرواة يغيّرون الألفاظ والمبالغة، وأن الاختلاف وقع حتى في بعض الأحاديث النبوية. فالمؤرخ عليه أن يروي كل قوم ما في كتبه المشهورة وعلى لسان علمائه، و«العهدة على الراوي»، ولا يحكم بالخير والشر {cite:jami-al-tawarikh-khashshab-1960 p. 222}{cite:jami-al-tawarikh-khashshab-1960 p. 223}{cite:jami-al-tawarikh-khashshab-1960 p. 224}{cite:jami-al-tawarikh-khashshab-1960 p. 225}{cite:jami-al-tawarikh-khashshab-1960 p. 226}."
  en: "Rashid al-Din's method of reporting, as he sets it out in the preface to the Jami al-Tawarikh. He separates mass transmission, which gives certain knowledge, as with the existence of ancient prophets, kings and distant cities, from single transmission, which may be true or false and makes up most of what is reported about people. He holds that reporters change wording and exaggerate, and that even some Prophetic reports are disputed for this reason. The historian should therefore report each people's accounts as they stand in their well-known books and in the words of their scholars, the responsibility resting on the reporter, and should not pass judgement on good and evil {cite:jami-al-tawarikh-khashshab-1960 p. 222}{cite:jami-al-tawarikh-khashshab-1960 p. 223}{cite:jami-al-tawarikh-khashshab-1960 p. 224}{cite:jami-al-tawarikh-khashshab-1960 p. 225}{cite:jami-al-tawarikh-khashshab-1960 p. 226}."
  ur: "رشید الدین کا خبروں کے نقل کرنے کا طریقہ، جیسا کہ انہوں نے جامع التواریخ کے دیباچے میں بیان کیا ہے۔ وہ تواتر کے نقل کو، جو یقینی علم دیتا ہے، جیسے قدیم رسولوں، بادشاہوں اور دور کے شہروں کا وجود، خبرِ آحاد سے الگ کرتے ہیں جو سچ بھی ہو سکتی ہے اور جھوٹ بھی، اور لوگوں کی زیادہ تر روایات اسی سے ہیں۔ ان کے مطابق راوی الفاظ بدلتے ہیں اور مبالغہ کرتے ہیں، اور اسی وجہ سے بعض نبوی احادیث میں بھی اختلاف ہے۔ اس لیے مؤرخ کو ہر قوم کی روایات اس کی مشہور کتابوں اور اس کے علما کی زبان سے، ذمہ داری راوی پر ڈال کر، نقل کرنی چاہئیں، اور خیر و شر کا فیصلہ نہیں کرنا چاہیے {cite:jami-al-tawarikh-khashshab-1960 p. 222}{cite:jami-al-tawarikh-khashshab-1960 p. 223}{cite:jami-al-tawarikh-khashshab-1960 p. 224}{cite:jami-al-tawarikh-khashshab-1960 p. 225}{cite:jami-al-tawarikh-khashshab-1960 p. 226}۔"
  fr: "La méthode de Rashid al-Din pour rapporter les faits, telle qu'il l'expose dans la préface du Jami al-Tawarikh. Il distingue la transmission massive, qui donne une connaissance certaine, comme l'existence des anciens prophètes, des rois et des villes lointaines, de la transmission unique, qui peut être vraie ou fausse et forme l'essentiel de ce qui se rapporte sur les hommes. Il estime que les rapporteurs changent les mots et exagèrent, et que même certains hadiths sont discutés pour cette raison. L'historien doit donc rapporter les récits de chaque peuple tels qu'ils figurent dans ses livres connus et dans la bouche de ses savants, la responsabilité incombant au rapporteur, et ne pas juger du bien et du mal {cite:jami-al-tawarikh-khashshab-1960 p. 222}{cite:jami-al-tawarikh-khashshab-1960 p. 223}{cite:jami-al-tawarikh-khashshab-1960 p. 224}{cite:jami-al-tawarikh-khashshab-1960 p. 225}{cite:jami-al-tawarikh-khashshab-1960 p. 226}."
  es: "El método de Rashid al-Din para transmitir los hechos, tal como lo expone en el prefacio del Jami al-Tawarikh. Distingue la transmisión múltiple, que da un conocimiento cierto, como la existencia de antiguos profetas, reyes y ciudades lejanas, de la transmisión única, que puede ser verdadera o falsa y que forma la mayor parte de lo que se cuenta de las personas. Sostiene que los transmisores cambian las palabras y exageran, y que incluso algunos hadices se discuten por esa razón. El historiador debe, pues, referir los relatos de cada pueblo tal como aparecen en sus libros conocidos y en boca de sus sabios, recayendo la responsabilidad en el transmisor, y no juzgar el bien y el mal {cite:jami-al-tawarikh-khashshab-1960 p. 222}{cite:jami-al-tawarikh-khashshab-1960 p. 223}{cite:jami-al-tawarikh-khashshab-1960 p. 224}{cite:jami-al-tawarikh-khashshab-1960 p. 225}{cite:jami-al-tawarikh-khashshab-1960 p. 226}."
