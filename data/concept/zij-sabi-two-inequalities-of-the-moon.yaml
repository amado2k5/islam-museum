id: concept/zij-sabi-two-inequalities-of-the-moon
class: concept
kind: scientific
label: { ar: "اختلافا حركة القمر عند البتاني", en: "The two inequalities of the Moon in al-Battani", ur: "البتانی کے نزدیک چاند کے دو اختلافات", es: "Las dos desigualdades de la Luna en al-Battani", fr: "Les deux inégalités de la Lune dans al-Battani", tr: "El-Battani'ye göre ayın hareketindeki farklılık", id: "Perbedaan pergerakan bulan menurut Al-Battani" }
summary:
  ar: "يقرر البتاني أن لحركة القمر اختلافين: الأول يظهر وحده في أوقات الاجتماع مع الشمس والمقابلة لها، والثاني يتولد من بُعد القمر عن الشمس، ثم يتركب الاختلافان فيصيران أثراً واحداً في الحساب. {cite:zij-sabi-nallino-byblion p.76}."
  en: "Al-Battani holds that the Moon's motion has two inequalities. The first appears alone only at conjunction and opposition with the Sun; the second arises from the Moon's distance from the Sun. The two combine into one effect in the reckoning. {cite:zij-sabi-nallino-byblion p.76}."
  ur: "البتانی کے مطابق چاند کی حرکت میں دو اختلافات ہیں: پہلا صرف اجتماع اور مقابلے کے وقت ظاہر ہوتا ہے، اور دوسرا سورج سے چاند کے فاصلے سے پیدا ہوتا ہے۔ حساب میں دونوں مل کر ایک ہی اثر بن جاتے ہیں۔ {cite:zij-sabi-nallino-byblion p.76}۔"
  es: "Al-Battani sostiene que el movimiento de la Luna presenta dos desigualdades. La primera aparece aisladamente solo en la conjunción y la oposición con el Sol; la segunda surge de la distancia de la Luna al Sol. Ambas se combinan en un solo efecto al calcularlo. {cite:zij-sabi-nallino-byblion p.76}."
  fr: "Al-Battani soutient que le mouvement de la Lune présente deux inégalités. La première n'apparaît isolément qu'en conjonction et en opposition avec le Soleil; la seconde résulte de la distance entre la Lune et le Soleil. Ces deux inégalités se combinent en un seul effet dans le calcul. {cite:zij-sabi-nallino-byblion p.76}."
  tr: "El-Battani, ayın hareketinin iki varyasyonu olduğunu belirtir: birincisi, güneşle kavuşum ve karşıtlık zamanlarında tek başına ortaya çıkar; ikincisi ise ayın güneşe olan uzaklığından kaynaklanır. Bu iki varyasyon daha sonra hesaplamada tek bir etki oluşturmak üzere birleşir. {cite:zij-sabi-nallino-byblion s.76}."
  id: "Al-Battani menyatakan bahwa pergerakan bulan memiliki dua variasi: yang pertama muncul sendiri pada saat konjungsi dan oposisi dengan matahari, dan yang kedua muncul dari jarak bulan dari matahari. Kedua variasi ini kemudian bergabung menjadi satu efek tunggal dalam perhitungan. {cite:zij-sabi-nallino-byblion p.76}."
