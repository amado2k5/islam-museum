id: concept/bish-mush-buha
class: concept
kind: natural
label:
  ar: "بيش موش بوحا"
  en: "Bish mush and buha (the book's pair)"
  fr: "Bish mush et buha (paire du livre)"
  ur: "بیش موش اور بوحا"
summary:
  ar: "بوحا حشيشة تنبت مع البيش وهي أعظم ترياقه، وبيش موش حيوان يسكن أصل البيش؛ ينفعان من البرص والجذام، وهما ترياق لكل سم وللأفاعي {cite:canon-ibn-sina-print-v1 p.415}."
  en: "Buha is a grass that grows with bish and, the book says, is its greatest antidote; bish mush is an animal that lives at the root of bish, like a mouse. The book lists both for leukoderma and leprosy, and as an antidote to every poison and to vipers {cite:canon-ibn-sina-print-v1 p.415}."
  fr: "La buha pousse avec le bish et serait son plus grand antidote ; le bish mush est un animal ressemblant à une souris vivant à sa racine. Le livre les mentionne contre leucodermie et lèpre, et comme antidotes à tous les poisons et aux vipères {cite:canon-ibn-sina-print-v1 p.415}."
  ur: "بوحا ایک گھاس ہے جو بیش کے ساتھ اگتی ہے اور کتاب کے مطابق بیش کا سب سے بڑا تریاق ہے؛ بیش موش ایک جانور ہے جو بیش کی جڑ میں چوہے کی طرح رہتا ہے۔ کتاب دونوں کو برص اور جذام میں اور ہر زہر اور سانپوں کے تریاق کے طور پر بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.415}۔"
