id: concept/nahr
class: concept
kind: legal
label: { ar: "النَّحْر", en: "Slaughter by throat-stabbing (nahr)", ur: "نحر (اونٹ کی قربانی)" }
summary:
  ar: "النحر في اللغة طعن البعير في منحره حيث يبدو الحلقوم من أعلى الصدر، ونحر الإبل مستحب عند جمهور الفقهاء، وذبح ما سواها، وثبت أن النبي نحر بدنة وضحى بكبشين. ولو ذبح ما ينحر أو نحر ما يذبح حل المذبوح عند الجمهور، وقال المالكية يجوز للضرورة. وأيام النحر عند الجمهور ثلاثة: يوم النحر ويومان بعده، وعند الشافعية أربعة لحديث أيام التشريق. ويستحب أن تكون الإبل قائمة معقولة اليد اليسرى، وعند المالكية يوجه الناحر الهدي إلى القبلة ويطعنه في لبته مسمياً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
  en: "Nahr, in the lexicon, is to stab a camel in its throat-hollow, where the windpipe shows above the chest. Most jurists hold that a camel is to be slaughtered by nahr and other animals by dhabh, on the example of the Prophet who slaughtered camels by nahr and two rams by dhabh. If one slaughters what is to be nahr or nahrs what is to be slaughtered, most jurists hold the animal lawful, while the Malikis allow it only in necessity. The days of nahr are three by the majority (the day and the two after), and four by the Shafi'is, citing the hadith that all days of tashriq are days of slaughter. The best practice is to stand the camel with its left foreleg tied; the Malikis have the slaughterer face the qibla, stand by the right side, hold the upper lip and stab the throat-hollow saying the name of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
  ur: "نحر یعنی اونٹ کے سینے کے اوپر والی جگہ پر نیزہ یا چھری مارنا۔ جمہور کے نزدیک اونٹ نحر سے اور باقی جانور ذبح سے ذبح کیے جائیں۔ قربانی کے تین دن جمہور کے نزدیک ہیں، شافعیہ کے نزدیک چار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
