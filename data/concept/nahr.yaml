label: { ar: "النَّحْر", en: "Slaughter by throat-stabbing (nahr)", ur: "نحر ⁦(اونٹ کی قربانی)⁩", es: "Asesinato por apuñalamiento en la garganta (nahr)", fr: "Abattage par égorgement (nahr)", tr: "Al-Nahr", id: "Al-Nahr" }
summary:
  ar: "النحر في اللغة طعن البعير في منحره حيث يبدو الحلقوم من أعلى الصدر، ونحر الإبل مستحب عند جمهور الفقهاء، وذبح ما سواها، وثبت أن النبي نحر بدنة وضحى بكبشين. ولو ذبح ما ينحر أو نحر ما يذبح حل المذبوح عند الجمهور، وقال المالكية يجوز للضرورة. وأيام النحر عند الجمهور ثلاثة: يوم النحر ويومان بعده، وعند الشافعية أربعة لحديث أيام التشريق. ويستحب أن تكون الإبل قائمة معقولة اليد اليسرى، وعند المالكية يوجه الناحر الهدي إلى القبلة ويطعنه في لبته مسمياً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
  en: "Nahr, in the lexicon, is to stab a camel in its throat-hollow, where the windpipe shows above the chest. Most jurists hold that a camel is to be slaughtered by nahr and other animals by dhabh, on the example of the Prophet who slaughtered camels by nahr and two rams by dhabh. If one slaughters what is to be nahr or nahrs what is to be slaughtered, most jurists hold the animal lawful, while the Malikis allow it only in necessity. The days of nahr are three by the majority (the day and the two after), and four by the Shafi'is, citing the hadith that all days of tashriq are days of slaughter. The best practice is to stand the camel with its left foreleg tied; the Malikis have the slaughterer face the qibla, stand by the right side, hold the upper lip and stab the throat-hollow saying the name of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
  ur: "نحر یعنی اونٹ کے سینے کے اوپر والی جگہ پر نیزہ یا چھری مارنا۔ جمہور کے نزدیک اونٹ نحر سے اور باقی جانور ذبح سے ذبح کیے جائیں۔ قربانی کے تین دن جمہور کے نزدیک ہیں، شافعیہ کے نزدیک چار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
  es: "En el léxico, nahr significa apuñalar a un camello en la garganta, donde la tráquea sobresale del pecho. La mayoría de los juristas sostienen que el camello debe ser sacrificado mediante nahr y otros animales mediante dhabh, siguiendo el ejemplo del Profeta, quien sacrificó camellos mediante nahr y dos carneros mediante dhabh. Si se sacrifica un animal que debe ser sacrificado mediante nahr, la mayoría de los juristas consideran que el animal es lícito, mientras que los malikíes lo permiten solo en caso de necesidad. La mayoría considera que los días para el nahr son tres (el día y los dos siguientes), y los shafiíes, cuatro, citando el hadiz que afirma que todos los días de tashriq son días de sacrificio. La mejor práctica es colocar al camello con la pata delantera izquierda atada; los malikíes hacen que el sacrificador mire hacia la qibla, se coloque a su derecha, sujete el labio superior y apuñale la garganta invocando el nombre de Dios. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15543} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
  fr: "Le terme « nahr » désigne, dans le lexique, l'acte d'égorger un chameau en le poignardant à la gorge, là où la trachée apparaît au-dessus de la poitrine. La plupart des juristes estiment que le chameau doit être abattu selon le rite du nahr et les autres animaux selon celui du dhabh, suivant l'exemple du Prophète qui abattait des chameaux selon ce rite et deux béliers selon celui du dhabh. Si l'on égorge un animal qui doit être abattu selon le rite du nahr ou inversement, la plupart des juristes considèrent l'animal comme licite, tandis que les Malikites ne l'autorisent qu'en cas de nécessité. La majorité des juristes prévoient trois jours d'abattage rituel (le jour même et les deux suivants), contre quatre pour les Chafi'ites, qui se fondent sur le hadith selon lequel tous les jours de tashriq sont des jours d'abattage. La meilleure pratique consiste à attacher la patte avant gauche du chameau; les Malikites préconisent que l'abatteur se tourne vers la qibla, se tienne à droite, saisisse la lèvre supérieure et poignarde la gorge en prononçant le nom de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
  tr: "Dilbilimde, kesim, deveyi mızrağına saplamak demektir; boğazı göğsün üstünden görünür. Çoğu fıhil deve kesimi ve başka bir şeyi kesmek önerir. Peygamber'in bir deve kesip iki koç kurban ettiği tespit edilmiştir. Eğer kesileni kestiyse ya da kesileni kestiyse, çoğunluğa göre kesim caizdir. Malikiler bunun zorunluluktan izin olduğunu söyler. Çoğunluğa göre kesim günleri üçtür: kesim günü ve iki gün sonrası, Şafiilere göre ise Taşreek günlerinin hadislerine göre dört gündür. Develerin dik durması ve makul bir sol el ile olması tavsiye edilir ve Malikilere göre, kesici kurban hayvanını kıbleye doğru yönlendirir ve dudağından bıçaklar, bu isim de vardır. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15545}"
  id: "Dalam linguistik, penyembelihan berarti menusuk unta dengan tombaknya, di mana tenggorokannya terlihat dari atas dada. Menyembelih unta direkomendasikan oleh mayoritas ahli hukum, dan menyembelih apa pun yang lain. Telah ditetapkan bahwa Nabi menyembelih unta dan mengorbankan dua ekor domba jantan. Jika ia menyembelih apa yang disembelih atau membunuh apa yang disembelih, maka yang disembelih diperbolehkan menurut mayoritas. Umat Malik mengatakan itu diperbolehkan karena kebutuhan. Hari penyembelihan menurut mayoritas adalah tiga: hari penyembelihan dan dua hari setelahnya, dan menurut Syafi'i, empat hari menurut hadits hari-hari Tashreeq. Disarankan agar unta berdiri tegak dengan tangan kiri yang masuk akal, dan menurut Maliki, penyembelih mengarahkan hewan korban ke kiblah dan menusuknya di bibir, yang disebut nama tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545}"
