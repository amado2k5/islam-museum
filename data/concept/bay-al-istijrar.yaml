id: concept/bay-al-istijrar
class: concept
kind: legal
label:
  ar: "بيع الاستجرار"
  en: "Bay' al-istijrar (sale on running account)"
  ur: "بیعِ استجرار (کھاتے پر خریداری)"
term: { ar: "بَيْع الاسْتِجْرار", en: "bay' al-istijrar" }
summary:
  ar: "بيع الاستجرار أن يأخذ الإنسان من البيّاع حاجته شيئاً فشيئاً، كالعدس والملح والزيت والخبز، على ما جرت به العادة، ثم يحاسبه بعد ذلك. ينقل ابن عابدين في رد المحتار ما في القنية من صحته وإن كان في صورة بيع المعدوم، واعتراض صاحب النهر والحموي، ويرى هو أن المسألة استحسان، ويفرّق بين ما كان ثمنه معلوماً وقت الأخذ وما كان مجهولاً. {cite:radd-al-muhtar-bulaq-v4 p.19} {cite:radd-al-muhtar-bulaq-v4 p.20}"
  en: "Bay' al-istijrar is taking what one needs from a trader bit by bit, such as lentils, salt, oil or bread, as custom has it, and settling the account later. Ibn Abidin in Radd al-Muhtar reports al-Qunya's ruling that it is valid though it looks like a sale of what no longer exists, and the objections of the author of al-Nahr and of al-Hamawi; he himself holds that the question rests on istihsan, and distinguishes goods whose price is known at the time of taking from goods whose price is not."
  ur: "بیعِ استجرار یہ ہے کہ آدمی دکاندار سے عادت کے مطابق اپنی ضرورت کی چیز تھوڑی تھوڑی لیتا رہے، جیسے دال، نمک، تیل یا روٹی، اور بعد میں حساب کرے۔ ابن عابدین رد المحتار میں القنیہ سے اس کا جواز نقل کرتے ہیں اگرچہ یہ معدوم کی بیع کی صورت ہے، اور صاحبِ النہر اور حموی کا اعتراض بھی؛ ان کی اپنی رائے میں یہ مسئلہ استحسان پر مبنی ہے، اور وہ لیتے وقت معلوم قیمت والی اور نامعلوم قیمت والی چیزوں میں فرق کرتے ہیں۔"
