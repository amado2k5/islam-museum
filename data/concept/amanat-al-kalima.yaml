label:
  ar: "أمانة الكلمة"
  en: "The word as a trust (amanat al-kalima)"
  fr: "La parole comme dépôt (amanat al-kalima)"
  ur: "کلمے کی امانت"
  es: "La palabra como confianza (amanat al-kalima)"
  tr: "Güvenilirlik"
