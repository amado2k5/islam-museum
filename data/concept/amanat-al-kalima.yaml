summary:
  ar: "الكلمة أمانة، ولها وزن يرفع صاحبها أو يخفضه؛ يعرض الشيخ عمر عبد الكافي صورها من الغيبة والنميمة والكذب، ويذكر ما يجب على من يتكلم أمام الناس."
  en: "The word is a trust with a weight that can raise or lower its speaker. Sheikh Omar Abdelkafy surveys its forms, among them backbiting, tale-bearing and lying, and what is owed by those who speak in public."
  fr: "La parole est un dépôt dont le poids peut élever ou abaisser celui qui la prononce. Le cheikh Omar Abdelkafy en examine plusieurs aspects, dont la médisance, le colportage et le mensonge, ainsi que les devoirs de ceux qui s’expriment en public."
  ur: "کلمہ ایک امانت ہے جس کا وزن بولنے والے کو بلند یا پست کر سکتا ہے۔ شیخ عمر عبدالکافی اس کی صورتیں بیان کرتے ہیں: غیبت، چغلی اور جھوٹ، اور یہ کہ لوگوں کے سامنے بولنے والوں پر کیا واجب ہے۔"
  es: "La palabra es una responsabilidad que puede enaltecer o hundir a quien la pronuncia. El jeque Omar Abdelkafy analiza sus diversas formas, entre ellas la calumnia, el chisme y la mentira, y lo que deben quienes hablan en público."
  tr: "Bir kelime bir güvendir ve sahibini yücelten ya da küçülten bir ağırlık taşır; Şeyh Ömer Abdülkafi, onun sırtüstü hakaret, dedikodu ve yalan biçimlerini sunar ve insanların önünde konuşanlar için zorunlu olanı belirtir."
  id: "Bir kelime bir güvendir ve sahibini yücelten ya da küçülten bir ağırlık taşır; Şeyh Ömer Abdülkafi, onun sırtüstü hakaret, dedikodu ve yalan biçimlerini sunar ve insanların önünde konuşanlar için zorunlu olanı belirtir."
