id: concept/khawf
class: concept
kind: ethical
label:
  ar: "الخوف من الله"
  en: "Fear of God (khawf)"
  ur: "خوفِ خدا (خوف)"
summary:
  ar: "ينقل الشيخ عمر عبد الكافي عن ابن عباس أن الجلوس مع من يخوّفك من الله حتى تجد الأمن يوم القيامة خير من الجلوس مع من يؤمّنك فتجد الخوف يومئذ (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:30}. ويقول إن الله لا يجمع على عبده أمنين ولا خوفين، فمن خاف في الدنيا أمّنه في الآخرة {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:30}. ويرى أن الإسلام بسيط وأننا عقّدنا مسائله، ويفسّر عدم رجاء الحساب بعدم الخشية منه {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:50:30}."
  en: "Sheikh Omar Abdelkafy relays from Ibn Abbas that sitting with one who makes you fear God, so that you find safety on the Day of Resurrection, is better than sitting with one who reassures you, so that you find fear on that Day (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:30}. He says God does not combine two securities or two fears on His servant: whoever fears in this world is given security in the next {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:30}. He holds that Islam is simple and that we have complicated its matters, and he explains not hoping for the reckoning as not fearing it {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:50:30}."
  ur: "شیخ عمر عبد الکافی ابن عباس سے نقل کرتے ہیں کہ ڈرانے والے کے ساتھ بیٹھنا، تاکہ قیامت کے دن امن ملے، اس کے ساتھ بیٹھنے سے بہتر ہے جو بے خوف کرے اور اس دن خوف ملے (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:30}۔ وہ کہتے ہیں کہ اللہ بندے پر دو امن اور دو خوف جمع نہیں کرتا: جو دنیا میں ڈرتا ہے اسے آخرت میں امن دیتا ہے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:16:30}۔ ان کی رائے ہے کہ اسلام سادہ ہے اور ہم نے اس کے مسائل پیچیدہ بنا دیے ہیں، اور حساب کی امید نہ رکھنے کو وہ حساب سے نہ ڈرنے کے معنی میں لیتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:50:30}۔"
