label: { ar: "إفراط الإسهال ووقت قطعه عند ابن سينا", en: "Excess of purging and when to stop in the Canon", ur: "اسہال کی زیادتی اور اسے روکنے کا وقت قانون میں" }
summary:
  ar: "يجعل ابن سينا العطش من علامات وجوب قطع الإسهال، ويذكر أن العطش قد يعرض لحال المعدة أو لحدة الدواء أو لحرارة المادة، وأن المستسهل للصفراء إذا انتهى إسهاله إلى البلغم فقد أفرط، وأشد منه إذا انتهى إلى السوداء، وأعظم خطراً الدم {cite:canon-ibn-sina-print-v1 pp.282-283}."
  en: "Ibn Sina makes thirst one sign of when purging must be stopped, notes that thirst may come from the state of the stomach, the sharpness of the drug or the heat of the matter, and says that when a purge for bile has gone as far as phlegm it has gone too far, and still more so when it reaches black bile, while blood is the gravest {cite:canon-ibn-sina-print-v1 pp.282-283}."
