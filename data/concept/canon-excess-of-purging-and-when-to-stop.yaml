id: concept/canon-excess-of-purging-and-when-to-stop
class: concept
kind: scientific
label:
  ar: "إفراط الإسهال ووقت قطعه عند ابن سينا"
  en: "Excess of purging and when to stop in the Canon"
  fr: "Excès de purge et moment de l’arrêt dans le Canon"
  ur: "اسہال کی زیادتی اور اسے روکنے کا وقت قانون میں"
  es: "El exceso de purga y cuándo detenerse en el Canon"
  tr: "İbn Sina'ya göre aşırı ishal ve kesme zamanlaması"
  id: "Diare berlebihan dan waktu pemotongan menurut Ibn Sina"
summary:
  ar: "يجعل ابن سينا العطش من علامات وجوب قطع الإسهال، ويذكر أن العطش قد يعرض لحال المعدة أو لحدة الدواء أو لحرارة المادة، وأن المستسهل للصفراء إذا انتهى إسهاله إلى البلغم فقد أفرط، وأشد منه إذا انتهى إلى السوداء، وأعظم خطراً الدم {cite:canon-ibn-sina-print-v1 pp.282-283}."
  en: "Ibn Sina makes thirst one sign of when purging must be stopped, notes that thirst may come from the state of the stomach, the sharpness of the drug or the heat of the matter, and says that when a purge for bile has gone as far as phlegm it has gone too far, and still more so when it reaches black bile, while blood is the gravest {cite:canon-ibn-sina-print-v1 pp.282-283}."
  fr: "Ibn Sina fait de la soif un signe d’arrêt, mais aussi un effet possible de l’estomac, de l’âcreté du remède ou de la chaleur de la matière. Une purge de bile atteignant le phlegme serait excessive, davantage encore la bile noire, et surtout le sang {cite:canon-ibn-sina-print-v1 pp.282-283}."
  es: "Ibn Sina hace de la sed una señal de cuándo debe detenerse la purga, señala que la sed puede provenir del estado del estómago, la agudeza del medicamento o el calor de la materia, y dice que cuando una purga de bilis ha llegado hasta la flema ha ido demasiado lejos, y más aún cuando llega a la bilis negra, mientras que la sangre es la más grave {cite:canon-ibn-sina-print-v1 pp.282-283}."
  ur: "ابن سینا نے پیاس کو اس بات کی علامت قرار دیا ہے کہ جب رفع حاجت کو روکنا ضروری ہے، نوٹ کرتے ہیں کہ پیاس معدہ کی حالت، دوا کی تیزابیت یا مادے کی گرمی سے آتی ہے، اور کہتے ہیں کہ جب رطوبت کی صفائی بلغم تک جاتی ہے تو بہت دور ہوتی ہے، اور اس سے بھی بڑھ کر جب یہ سیاہ صفرا تک پہنچ جاتی ہے، جبکہ خون کی صفائی ہوتی ہے۔ صفحہ 282-283}۔"
  tr: "İbn Sina, susuzluğu ishalin durdurulması zorunluluğunun bir işareti olarak görür; susuzluğun mideyi, ilacın keskinliğini veya maddenin sıcaklığını açığa çıkarabileceğini belirtir. İshal balgama ulaşırsa aşır, siyah mürekkebe ulaşırsa daha şiddetlidir ve daha büyük tehlike kandır {cite:canon-ibn-sina-print-v1 s.282-283}."
  id: "Ibn Sina menganggap dahaga sebagai tanda kewajiban untuk menghentikan diare, menyebutkan bahwa dahaga dapat membuka lambung, ketajaman obat, atau panas zat tersebut. Jika diare mencapai dahak, itu berlebihan, dan lebih parah jika mencapai tinta hitam, dan bahaya yang lebih besar adalah darah {cite:canon-ibn-sina-print-v1 hlm.282-283}."
