label: { ar: "الحشفة", en: "The glans (hashfa) in the rulings", ur: "حشفہ (احکام میں)" }
summary:
  ar: "الحشفة في اصطلاح الفقهاء ما تحت الجلدة المقطوعة من الذكر في الختان، ولها أحكام تتعلق بالجماع في الأحكام العامة كالغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7099} وتترتب على ما يتعلق بها من أحكام الصيام والحج والمهر وتحليل المطلقة ثلاثا والإحصان ووجوب الحد، وفيها خلاف بين المذاهب في تفاصيل كل حكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7100} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7101} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7103} وفي قطع الحشفة خطأ الدية الكاملة عند الفقهاء، وفي قطع بعضها قسط منها عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7104}"
  en: "In the jurists' usage, the glans (hashfa) is what lies beneath the skin cut in circumcision; a series of rulings depend on it in the matter of intercourse, such as the major ablution, the invalidating of fasting and the hajj, the full bridal gift, lawful return after triple divorce, the status of marriage, and the penalty for fornication, on each of which the schools differ in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7100} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7101} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7103} In a mistaken injury that severs the glans, the full blood-money is owed by agreement, and part of it for a partial severance according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7104}"
