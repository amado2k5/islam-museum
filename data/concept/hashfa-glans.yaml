label: { ar: "الحشفة", en: "The glans (hashfa) in the rulings", ur: "حشفہ ⁦(احکام میں)⁩", es: "El glande (hashfa) en las normas", fr: "Le gland (hashfa) dans les décisions" }
summary:
  ar: "الحشفة في اصطلاح الفقهاء ما تحت الجلدة المقطوعة من الذكر في الختان، ولها أحكام تتعلق بالجماع في الأحكام العامة كالغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7099} وتترتب على ما يتعلق بها من أحكام الصيام والحج والمهر وتحليل المطلقة ثلاثا والإحصان ووجوب الحد، وفيها خلاف بين المذاهب في تفاصيل كل حكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7100} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7101} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7103} وفي قطع الحشفة خطأ الدية الكاملة عند الفقهاء، وفي قطع بعضها قسط منها عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7104}"
  en: "In the jurists' usage, the glans (hashfa) is what lies beneath the skin cut in circumcision; a series of rulings depend on it in the matter of intercourse, such as the major ablution, the invalidating of fasting and the hajj, the full bridal gift, lawful return after triple divorce, the status of marriage, and the penalty for fornication, on each of which the schools differ in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7100} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7101} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7103} In a mistaken injury that severs the glans, the full blood-money is owed by agreement, and part of it for a partial severance according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7104}"
  es: "En el uso de los juristas, el glande (hashfa) es lo que se encuentra debajo de la piel cortada en la circuncisión; una serie de normas dependen de él en materia de relaciones sexuales, como la ablución mayor, la invalidez del ayuno y del hajj, la dote completa, el retorno lícito después del triple divorcio, el estado del matrimonio y la pena por fornicación, sobre cada uno de los cuales las escuelas difieren en detalle. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7099} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7100} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7101} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7103} En una lesión por error que corta el glande, se debe el dinero de sangre completo por acuerdo, y una parte por una indemnización parcial según la mayoría. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7104}"
  fr: "Dans l'usage des juristes, le gland (hashfa) est ce qui se trouve sous la peau coupée lors de la circoncision; une série de décisions en dépendent en matière de rapports sexuels, comme les ablutions majeures, l'invalidation du jeûne et du hajj, la dot complète, le retour licite après un triple divorce, le statut du mariage et la peine pour fornication, sur chacun de ces points les écoles divergent dans le détail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7100} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7101} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7103} Dans une blessure erronée qui sectionne le gland, la totalité du prix du sang est due par accord, et une partie pour une indemnité partielle selon la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7104}"
  ur: "فقہاء کے استعمال میں ختنہ میں کٹی ہوئی جلد کے نیچے جو چیز ہوتی ہے اسے کہتے ہیں۔ جماع کے معاملے میں احکام کا ایک سلسلہ اس پر منحصر ہے، جیسا کہ بڑا وضو، روزہ اور حج کا باطل ہونا، مکمل عروسی تحفہ، تین طلاقوں کے بعد حلال واپسی، نکاح کی حیثیت، اور زنا کی سزا، جن میں سے ہر ایک پر مکاتب میں تفصیل سے اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7099} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7100} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7101} صفحہ 7102} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7103} غلطی سے چوٹ لگنے سے جو مثانہ توڑ دیتی ہے، خون کی پوری رقم معاہدے کے تحت واجب الادا ہے، اور اس کا کچھ حصہ جمہور کے مطابق جزوی علیحدگی کے لیے ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص7104}"
