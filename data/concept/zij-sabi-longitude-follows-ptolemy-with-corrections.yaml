label: { ar: "طول القمر عن بطليموس مع استدراكات البتاني", en: "The Moon's longitude after Ptolemy with al-Battani's corrections", ur: "بطلیموس کے بعد چاند کا طول اور البتانی کی تصحیحات", es: "La longitud de la Luna según Ptolomeo, con las correcciones de al-Battani." }
summary:
  ar: "يأخذ البتاني حركة القمر في الطول مما بقي في كتاب بطليموس، بعد أن يزيد عليه ما استدركه في حركة الشمس، أما حركته في الاختلاف فيأخذها كما وضعها بطليموس دون زيادة ولا نقصان. {cite:zij-sabi-nallino-byblion p.82}."
  en: "Al-Battani takes the Moon's motion in longitude from what remains in Ptolemy's book, adding the correction he made to the Sun's motion. His motion in the inequality he takes exactly as Ptolemy set it, with no addition or subtraction. {cite:zij-sabi-nallino-byblion p.82}."
  ur: "البتانی چاند کی طول کی حرکت بطلیموس کی کتاب کے باقی حصے سے لیتے ہیں، اور اس میں سورج کی حرکت پر کی گئی اپنی تصحیح بھی شامل کرتے ہیں۔ اختلاف میں حرکت بطلیموس کی وضع کے مطابق، بغیر کسی کمی بیشی کے، لیتے ہیں۔ {cite:zij-sabi-nallino-byblion p.82}۔"
  es: "Al-Battani toma el movimiento de la Luna en longitud de lo que se conserva en el libro de Ptolomeo, añadiendo la corrección que este introdujo en el movimiento del Sol. Su movimiento en la desigualdad lo toma exactamente como lo estableció Ptolomeo, sin añadir ni restar nada. {cite:zij-sabi-nallino-byblion p.82}."
