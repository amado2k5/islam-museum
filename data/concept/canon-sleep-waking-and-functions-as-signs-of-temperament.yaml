id: concept/canon-sleep-waking-and-functions-as-signs-of-temperament
class: concept
kind: scientific
label:
  ar: "النوم واليقظة والأفعال دلائل على المزاج عند ابن سينا"
  en: "Sleep, waking and functions as signs of temperament in the Canon"
  fr: "Sommeil, veille et fonctions comme signes du tempérament dans le Canon"
  ur: "نیند، بیداری اور افعال بطور علامتِ مزاج، قانون کے مطابق"
  es: "El sueño, la vigilia y las funciones como signos de temperamento en el Canon"
  tr: "İbn Sina'ya göre uyku, uyanıklık ve davranışlar ruh halinin göstergeleridir"
  id: "Tidur, terjaga, dan tindakan adalah indikator suasana hati menurut Avicenna"
summary:
  ar: "الجنس السابع حال النوم واليقظة، والثامن دلائل الأفعال، وهذا أصح دلائله على المزاج المعتدل، أما دلالته على الحر والبرد واليبس والرطوبة فتخمينية {cite:canon-ibn-sina-print-v1 p.162}."
  en: "The seventh genus is the state of sleep and waking, the eighth the signs of functions; the function-sign is surest for a balanced temperament, while its pointing to heat, cold, dryness or moisture is only conjecture {cite:canon-ibn-sina-print-v1 p.162}."
  fr: "Le septième genre concerne sommeil et veille, le huitième les fonctions ; le signe fonctionnel serait le plus sûr pour l’équilibre, mais seulement conjectural pour chaud, froid, sec ou humide {cite:canon-ibn-sina-print-v1 p.162}."
  es: "El séptimo género es el estado de sueño y vigilia, el octavo los signos de las funciones; el signo de la función es el más seguro para un temperamento equilibrado, mientras que su indicación de calor, frío, sequedad o humedad es solo una conjetura {cite:canon-ibn-sina-print-v1 p.162}."
  ur: "ساتویں جینس نیند اور جاگنے کی حالت ہے، آٹھویں افعال کی علامات؛ فعل علامت متوازن مزاج کے لیے یقینی ہے، جب کہ گرمی، سردی، خشکی یا نمی کی طرف اشارہ صرف قیاس ہے"
  tr: "Yedinci tip uyku ve uyanıklık durumu, sekizinci tip ise eylem işaretleridir ve bu da ılımlı ruh halinin en özgün göstergesidir. Sıcaklık, soğuk, kuruluk ve nem göstergesi ise spekülatiftir {cite:canon-ibn-sina-print-v1 s.162}."
  id: "Tipe ketujuh adalah keadaan tidur dan terjaga, dan tipe kedelapan adalah tanda-tanda tindakan, yang merupakan indikator paling otentik dari suasana hati yang sedang sedang. Adapun indikasi panas, dingin, kekeringan, dan kelembapan, ini bersifat spekulatif {cite:canon-ibn-sina-print-v1 hlm.162}."
