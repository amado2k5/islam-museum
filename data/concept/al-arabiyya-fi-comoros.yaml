label:
  ar: "العربية في جزر القمر"
  en: "Arabic in Comoros"
  ur: "کوموروس میں عربی"
  fr: "L'arabe aux Comores"
  es: "El árabe en Comoras"
summary:
  ar: "مكانة العربية في جزر القمر كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: القمرية والفرنسية والعربية لغات رسمية، والقمرية لغة بانتوية قريبة من السواحلية تُكتب بالحرف العربي، والفرنسية لغة الإدارة، وتذكر الموسوعة اختلاط تجار العرب والفرس بسكان الجزر. ويسمّي الكتاب القمرية مرتين، والصفحة تذكر ذلك ولا تفسره."
  en: "The place of Arabic in Comoros as the Encyclopaedia Britannica and The World Factbook state it: Comorian, French and Arabic are official languages; Comorian is a Bantu language related to Swahili written in Arabic script, French is the language of administration, and the encyclopedia tells of Arab and Persian traders mixing with the islanders. The Factbook names Comorian twice, which the page states without explaining."
  ur: "کوموروس میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: کوموری، فرانسیسی اور عربی سرکاری زبانیں ہیں؛ کوموری سواحلی سے متعلق بانتو زبان ہے جو عربی رسم الخط میں لکھی جاتی ہے، فرانسیسی انتظامیہ کی زبان ہے، اور برٹانیکا عرب اور ایرانی تاجروں کے جزائر کے باشندوں میں گھلنے ملنے کا ذکر کرتی ہے۔ فیکٹ بک کوموری کا نام دو بار لیتی ہے، صفحہ اسے بیان کرتا ہے مگر اس کی وضاحت نہیں کرتا۔"
  fr: "La place de l'arabe aux Comores selon l'Encyclopaedia Britannica et The World Factbook : le comorien, le français et l'arabe sont langues officielles ; le comorien est une langue bantoue apparentée au swahili écrite en caractères arabes, le français est la langue de l'administration, et l'encyclopédie évoque le mélange de marchands arabes et persans aux insulaires. Le Factbook nomme deux fois le comorien, ce que la page énonce sans l'expliquer."
  es: "El lugar del árabe en Comoras según la Encyclopaedia Britannica y The World Factbook: el comorense, el francés y el árabe son lenguas oficiales; el comorense es una lengua bantú emparentada con el suajili escrita en alfabeto árabe, el francés es la lengua de la administración, y la enciclopedia habla de la mezcla de comerciantes árabes y persas con los isleños. El Factbook nombra dos veces el comorense, lo que la página enuncia sin explicarlo."
