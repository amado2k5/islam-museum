id: concept/hikka-al-anf
class: concept
kind: scientific
label:
  ar: حكة الأنف
  en: The itch of the nose
  ur: ناک کی خارش
  es: "El picor de la nariz"
  fr: "La démangeaison du nez"
  tr: "Kaşıntılı burun"
  id: "Hidung gatal"
summary:
  ar: حكة الأنف قد تكون لبخار حاد أو نزلة حادة كانت أو تكون أو لنزلة قوية السيلان وإن كانت باردة وقد تكون لبثور وقد تكون لحركة الرعاف وهي من دلائل البحران ومن دلائل الجدري والحصبة على ما يذكر في موضعه وعلاج كل واحد من ذلك بما عرف من الأصول سهل {cite:canon-ibn-sina-print-v2 p.252}
  en: The nose's itch may be from a sharp vapour, or a sharp catarrh that was or is to be, or a strongly flowing catarrh even if cold; it may be from pustules, or from the stirring of a nosebleed. It is among the signs of crisis and among the signs of smallpox and measles, as will be told in their place; and the treatment of each by the known principles is easy {cite:canon-ibn-sina-print-v2 p.252}
  ur: ناک کی خارش کسی تیز بخار سے ہو سکتی ہے یا تیز نزلے سے جو گزرا ہو یا آنے والا ہو یا سخت بہنے والے نزلے سے خواہ سرد ہو؛ اور دانوں سے بھی ہو سکتی ہے اور نکسیر کی حرکت سے بھی؛ یہ بحران کی علامتوں میں سے ہے اور جدری اور خسرے کی علامتوں میں بھی جیسا اپنی جگہ ذکر آئے گا؛ اور ہر ایک کا علاج معروف اصولوں سے آسان ہے {cite:canon-ibn-sina-print-v2 p.252}
  es: "El picor nasal puede deberse a un vapor irritante, a un catarro agudo (ya sea pasado o presente) o a un catarro abundante, incluso si es frío; puede deberse a pústulas o a la reaparición de una hemorragia nasal. Es uno de los signos de crisis y también de viruela y sarampión, como se explicará más adelante; y el tratamiento de cada una, según los principios conocidos, es sencillo. {cite:canon-ibn-sina-print-v2 p.252}"
  fr: "La démangeaison nasale peut être due à des vapeurs âcres, à un rhume aigu, passé ou présent, ou à un écoulement nasal abondant même par temps froid; elle peut provenir de pustules ou de l’aggravation d’un saignement de nez. Elle figure parmi les signes de crise et parmi ceux de la variole et de la rougeole, comme cela sera expliqué plus loin; et le traitement de chacune de ces maladies selon les principes connus est aisé. {cite:canon-ibn-sina-print-v2 p.252}"
  tr: "Kaşıntılı burun keskin bir buhar veya şiddetli soğuk algınlığından kaynaklanabilir, soğuk olsa bile şiddetli burun akıntısından kaynaklanabilir, su toplaması olabilir veya burun kanaması olabilir ki bu ishal belirtisi olabilir ve doğru bağlamda belirtildiği gibi, her birinin bilinen prensiplere göre tedavi edilmesi kolaydır {cite:canon-ibn-sina-print-v2 s.252}"
  id: "Hidung gatal bisa disebabkan oleh uap tajam atau flu parah, atau bisa juga karena hidung meler parah meskipun dingin, bisa jadi lepuhan atau mimisan, yang merupakan tanda diare, dan seperti yang disebutkan dalam konteksnya, serta menangani masing-masing sesuai prinsip yang diketahui adalah mudah {cite:canon-ibn-sina-print-v2 hlm.252}"
