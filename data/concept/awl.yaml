id: concept/awl
class: concept
kind: legal
label:
  ar: "العَوْل"
  en: "Increase of the shares ('awl) in inheritance"
  fr: "L’augmentation de la base des parts ('awl) en matière de succession"
  ur: "عول ⁦(فرائض میں اضافہ)⁩"
  es: "Aumento de las participaciones ('awl') en la herencia"
summary:
  ar: "العول في اللغة الارتفاع والزيادة، وفي الفرائض أن يزاد في سهام المسألة، فتنقص الأنصباء إذا ضاق المخرج عن الفروض، وهو شرعي يؤخذ به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944}. وأول من حكم بالعول عمر، فتابعه الصحابة، وخالفه ابن عباس في خلافة عثمان، ونقل قوله في تقديم وتأخير الفروض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. وللفرائض مخارج سبعة، وتنظر التفاصيل في الإرث {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  en: "In the lexicon, 'awl is rising and increase; in inheritance it is the enlargement of the common base of the shares, so that each sharer's portion falls when the base cannot cover the fixed shares; it is a lawful practice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944}. 'Umar was the first to apply it and the companions followed him; Ibn 'Abbas disagreed in the caliphate of 'Uthman, and his saying on the order of the shares is reported {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. The bases of the shares are seven, and the detail belongs to inheritance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  fr: "Dans le lexique, 'awl signifie élévation et augmentation ; en matière de succession, c’est l’agrandissement de la base commune des parts, de sorte que la portion de chaque ayant droit diminue lorsque la base ne peut couvrir les parts fixes ; c’est une pratique licite {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944}. 'Umar fut le premier à l’appliquer et les Compagnons le suivirent ; Ibn 'Abbas exprima son désaccord sous le califat de 'Uthman, et son propos sur l’ordre des parts est rapporté {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. Les bases des parts sont au nombre de sept, et le détail relève des successions {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  es: "En el léxico, 'awl significa aumento e incremento; en herencia, es la ampliación de la base común de las participaciones, de modo que la porción de cada copropietario disminuye cuando la base no puede cubrir las participaciones fijas; es una práctica lícita {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944}. 'Umar fue el primero en aplicarla y los compañeros lo siguieron; Ibn 'Abbas discrepó en el califato de 'Uthman, y su opinión sobre el orden de las participaciones se encuentra registrada {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. Las bases de las acciones son siete, y el detalle pertenece a la herencia {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  ur: "لغت میں، 'اول بڑھ رہا ہے اور بڑھ رہا ہے؛ وراثت میں یہ حصص کی مشترکہ بنیاد کی توسیع ہے، تاکہ ہر ایک حصہ دار کا حصہ گر جائے جب بنیاد مقررہ حصص کا احاطہ نہ کر سکے۔ یہ ایک جائز عمل ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11943} عمر نے سب سے پہلے اس کا اطلاق کیا اور صحابہ نے ان کی پیروی کی۔ ابن عباس نے عثمان کی خلافت میں اختلاف کیا، اور حصص کی ترتیب کے بارے میں ان کا قول منقول ہے۔ حصص کی بنیادیں سات ہیں اور تفصیل وراثت سے متعلق ہے"
