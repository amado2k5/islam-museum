id: concept/awl
class: concept
kind: legal
label:
  ar: "العَوْل"
  en: "Increase of the shares ('awl) in inheritance"
  ur: "عول (فرائض میں اضافہ)"
summary:
  ar: "العول في اللغة الارتفاع والزيادة، وفي الفرائض أن يزاد في سهام المسألة، فتنقص الأنصباء إذا ضاق المخرج عن الفروض، وهو شرعي يؤخذ به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944}. وأول من حكم بالعول عمر، فتابعه الصحابة، وخالفه ابن عباس في خلافة عثمان، ونقل قوله في تقديم وتأخير الفروض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. وللفرائض مخارج سبعة، وتنظر التفاصيل في الإرث {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  en: "In the lexicon, 'awl is rising and increase; in inheritance it is the enlargement of the common base of the shares, so that each sharer's portion falls when the base cannot cover the fixed shares; it is a lawful practice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944}. 'Umar was the first to apply it and the companions followed him; Ibn 'Abbas disagreed in the caliphate of 'Uthman, and his saying on the order of the shares is reported {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. The bases of the shares are seven, and the detail belongs to inheritance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
