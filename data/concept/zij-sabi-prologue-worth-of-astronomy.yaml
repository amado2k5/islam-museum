label: { ar: "مقدمة الزيج الصابي: شرف علم النجوم وفائدته", en: "The prologue of al-Zij al-Sabi: the worth of astronomy", ur: "زیج صابی کا دیباچہ: علم نجوم کی فضیلت", es: "El prólogo de al-Zij al-Sabi: el valor de la astronomía" }
summary:
  ar: "يبدأ البتاني الباب الأول بحمد الله والصلاة على خاتم الرسل، ثم يعدّ علم صناعة النجوم من أشرف العلوم منزلة وأعلاها مرتبة، لأن الإنسان لا يسعه جهل ما فيه من شرائع الدين وسنته، ولما فيه من معرفة مدة السنين والشهور والمواقيت وفصول الزمان وطول النهار والليل وقصرهما ومواضع النيرين وكسوفهما وسير الكواكب، ولأن إدمان النظر فيه يقود إلى إثبات التوحيد ومعرفة عظمة الخالق. {cite:zij-sabi-nallino-byblion pp.10-11}."
  en: "Al-Battani opens chapter 1 by praising God and invoking blessing on the last of the messengers, then calls the craft of the stars among the noblest sciences in rank, one whose parts a person cannot be ignorant of in the religion's rules and customs, for what it gives of the length of years, months and appointed times, the seasons, the lengthening and shortening of day and night, the places and eclipses of the two luminaries and the course of the planets; and because steady study of it leads to proofs of God's oneness and to knowing the Creator's greatness. {cite:zij-sabi-nallino-byblion pp.10-11}."
  ur: "البتانی پہلے باب کا آغاز اللہ کی حمد اور رسولوں کے خاتم پر درود سے کرتے ہیں، پھر صناعتِ نجوم کو مرتبے کے لحاظ سے اشرف علوم میں شمار کرتے ہیں، کیونکہ دین کے احکام اور سنت میں اس کا جاننا ناگزیر ہے: سالوں، مہینوں، اوقات، موسموں، دن رات کے بڑھنے گھٹنے، دونوں نیّروں کی جگہوں اور کسوف اور سیاروں کی چال کا علم اسی سے ملتا ہے؛ اور اس لیے کہ اس میں مسلسل غور توحید کے دلائل اور خالق کی عظمت کی معرفت تک پہنچاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.10-11}۔"
  es: "Al-Battani inicia el capítulo 1 alabando a Dios e invocando bendiciones sobre el último de los mensajeros, y luego considera la astrología como una de las ciencias más nobles, cuyas partes son indispensables para comprender las normas y costumbres de la religión, por lo que revela sobre la duración de los años, los meses y los tiempos señalados, las estaciones, el alargamiento y el acortamiento del día y la noche, la posición y los eclipses de los dos astros y el curso de los planetas; y porque su estudio constante conduce a pruebas de la unicidad de Dios y al conocimiento de la grandeza del Creador. {cite:zij-sabi-nallino-byblion pp.10-11}."
