id: concept/al-hadith-al-muadal
class: concept
kind: term
label: { ar: "الحديث المعضل والمنقطع", en: "The obscured (mu'dal) and the interrupted (munqati') report", ur: "معضل اور منقطع حدیث" }
term: { ar: "المعضل، المنقطع", en: "al-mu'dal, al-munqati'" }
summary:
  ar: "المعضل عند ابن حجر ما سقط من إسناده اثنان فصاعداً مع التوالي، والمنقطع ما سقط منه اثنان غير متواليين في موضعين أو واحد أو أكثر من اثنين بشرط عدم التوالي {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}. المعضل عند ابن الصلاح لقب لنوع خاص من المنقطع: ما سقط من إسناده اثنان فصاعداً، وسماه قوم مرسلاً. ومثاله ما يرويه تابع التابعي قائلاً: قال رسول الله، وقول المصنفين من الفقهاء: قال رسول الله كذا، وقول مالك: بلغني عن أبي هريرة. وجعل الحاكم منه أن يروي تابع التابعي عن التابعي حديثاً موقوفاً عليه وهو عند غيره متصل مرفوع، واستجاده ابن الصلاح. ويلحق به في كتابه بحثا العنعنة والتعليق {cite:muqaddima-ibn-salah-itr p. 59-61}."
  en: "For Ibn Hajar the obscured report (mu'dal) is one with two or more consecutive narrators missing from its chain, and the interrupted report (munqati') one with two non-consecutive narrators missing in two places, or one, or more than two, provided they are not consecutive {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}. For Ibn al-Salah mu'dal is a name for a special kind of munqati': a chain from which two or more narrators have dropped out, which some also call mursal. Examples are a Follower of the Successors saying 'the Messenger of God said', jurists writing 'the Messenger of God said such-and-such', and Malik's 'it reached me from Abu Hurayra'. Al-Hakim also counted as mu'dal a Follower's report stopping at a Successor when others transmit it connected to the Prophet, which Ibn al-Salah approved. He treats chains with 'an' and suspended chains as appendices to this type."
  ur: "ابن حجر کے نزدیک معضل وہ ہے جس کی سند سے دو یا زیادہ راوی مسلسل ساقط ہوں، اور منقطع وہ جس سے دو غیر مسلسل راوی دو جگہوں سے، یا ایک، یا دو سے زیادہ بشرطیکہ مسلسل نہ ہوں، ساقط ہوں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}۔"
