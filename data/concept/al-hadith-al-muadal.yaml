id: concept/al-hadith-al-muadal
class: concept
kind: term
label: { ar: "الحديث المعضل والمنقطع", en: "The obscured (mu'dal) and the interrupted (munqati') report", ur: "معضل اور منقطع حدیث" }
term: { ar: "المعضل، المنقطع", en: "al-mu'dal, al-munqati'" }
summary:
  ar: "المعضل عند ابن حجر ما سقط من إسناده اثنان فصاعداً مع التوالي، والمنقطع ما سقط منه اثنان غير متواليين في موضعين أو واحد أو أكثر من اثنين بشرط عدم التوالي {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}."
  en: "For Ibn Hajar the obscured report (mu'dal) is one with two or more consecutive narrators missing from its chain, and the interrupted report (munqati') one with two non-consecutive narrators missing in two places, or one, or more than two, provided they are not consecutive {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}."
  ur: "ابن حجر کے نزدیک معضل وہ ہے جس کی سند سے دو یا زیادہ راوی مسلسل ساقط ہوں، اور منقطع وہ جس سے دو غیر مسلسل راوی دو جگہوں سے، یا ایک، یا دو سے زیادہ بشرطیکہ مسلسل نہ ہوں، ساقط ہوں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}۔"
