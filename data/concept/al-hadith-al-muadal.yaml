label: { ar: "الحديث المعضل والمنقطع", en: "The obscured (mu'dal) and the interrupted (munqati') report", fr: "Le hadith à lacune consécutive (mu’dal) et le hadith interrompu (munqati’)", ur: "معضل اور منقطع حدیث", es: "El informe oscurecido (mu'dal) y el interrumpido (munqati')", tr: "Karmaşık ve kesintiye uğrayan konuşma", id: "Percakapan yang kompleks dan terputus" }
term: { ar: "المعضل، المنقطع", en: "al-mu'dal, al-munqati'" }
summary:
  ar: "المعضل عند ابن حجر ما سقط من إسناده اثنان فصاعداً مع التوالي، والمنقطع ما سقط منه اثنان غير متواليين في موضعين أو واحد أو أكثر من اثنين بشرط عدم التوالي {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}. المعضل عند ابن الصلاح لقب لنوع خاص من المنقطع: ما سقط من إسناده اثنان فصاعداً، وسماه قوم مرسلاً. ومثاله ما يرويه تابع التابعي قائلاً: قال رسول الله، وقول المصنفين من الفقهاء: قال رسول الله كذا، وقول مالك: بلغني عن أبي هريرة. وجعل الحاكم منه أن يروي تابع التابعي عن التابعي حديثاً موقوفاً عليه وهو عند غيره متصل مرفوع، واستجاده ابن الصلاح. ويلحق به في كتابه بحثا العنعنة والتعليق {cite:muqaddima-ibn-salah-itr p. 59-61}."
  en: "For Ibn Hajar the obscured report (mu'dal) is one with two or more consecutive narrators missing from its chain, and the interrupted report (munqati') one with two non-consecutive narrators missing in two places, or one, or more than two, provided they are not consecutive {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}. For Ibn al-Salah mu'dal is a name for a special kind of munqati': a chain from which two or more narrators have dropped out, which some also call mursal. Examples are a Follower of the Successors saying 'the Messenger of God said', jurists writing 'the Messenger of God said such-and-such', and Malik's 'it reached me from Abu Hurayra'. Al-Hakim also counted as mu'dal a Follower's report stopping at a Successor when others transmit it connected to the Prophet, which Ibn al-Salah approved. He treats chains with 'an' and suspended chains as appendices to this type."
  fr: "Pour Ibn Hajar, le mu’dal est un récit dont la chaîne a perdu au moins deux transmetteurs consécutifs ; le munqati’ a perdu deux transmetteurs à des endroits différents, un seul, ou plus de deux pourvu qu’ils ne se suivent pas {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}. Pour Ibn al-Salah, mu’dal désigne un type particulier de munqati’ : une chaîne dont au moins deux transmetteurs sont absents, que certains appellent aussi mursal. Par exemple, un disciple des Successeurs dit : « Le Messager de Dieu a dit » ; des juristes lui attribuent des propos ; ou Malik indique qu’un récit d’Abu Hurayra lui est parvenu. Al-Hakim compte aussi comme mu’dal le récit d’un disciple qui s’arrête à un Successeur alors que d’autres le font remonter au Prophète par une chaîne continue ; Ibn al-Salah approuve. Ce dernier traite des chaînes à la formule « an » et des chaînes suspendues en annexes à cette catégorie."
  ur: "ابن حجر کے نزدیک معضل وہ ہے جس کی سند سے دو یا زیادہ راوی مسلسل ساقط ہوں، اور منقطع وہ جس سے دو غیر مسلسل راوی دو جگہوں سے، یا ایک، یا دو سے زیادہ بشرطیکہ مسلسل نہ ہوں، ساقط ہوں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}۔"
  es: "Para Ibn Hajar, el relato oscurecido (mu'dal) es aquel con dos o más narradores consecutivos que faltan en su cadena, y el relato interrumpido (munqati') es aquel con dos narradores no consecutivos que faltan en dos lugares, o uno, o más de dos, siempre que no sean consecutivos {cite:nuzhat-al-nazar-itr-bushra-2011 p. 79}. Para Ibn al-Salah, mu'dal es un nombre para un tipo especial de munqati': una cadena de la que se han perdido dos o más narradores, que algunos también llaman mursal. Ejemplos son un Seguidor de los Sucesores que dice 'el Mensajero de Dios dijo', juristas que escriben 'el Mensajero de Dios dijo tal y cual', y Malik 'me llegó de Abu Hurayra'. Al-Hakim también consideró como mu'dal un relato de un Seguidor que se detiene en un Sucesor cuando otros lo transmiten conectados al Profeta, lo cual fue aprobado por Ibn al-Salah. Él trata las cadenas con 'an' y las cadenas suspendidas como apéndices de este tipo."
  tr: "İbn Hacer'e göre, 'mu'dil' ardışık iki veya daha fazla iletim zincirinde eksik olan şeydir ve 'mu'd'alla' ise ardışık olmayan iki kez iki yerde ya da ardışık koşullar olmadan bir veya daha fazla ikili eksik olanıdır {alıntı:Nuzhat-al-nazar-itr-Bushra-2011 s. 79}. İbn al-Salah'a göre, 'mu'dil' özel bir tür bağlantısı ifade eden bir terimdir: iletim zincirinde eksik olan iki veya daha fazla şey ve bazıları buna mursal demiştir. Bir örnek, Tabii sözün takipçisinin rivayet ettiği şeydir: Allah'ın Resulü ve fahhihlerin görüşü: Allah'ın Resulü böyle buyurdu, Malik'in ise 'Ebu Hureyre'den söyle.' Hakim, müridin takipçisinin askıya alınmış başka bir hadisi anlatmasına izin verdi, diğerlerinin ise sürekli ve yükselen bir hadisi vardı ve İbn al-Salah onun echiadını istedi. Ayrıca kitabında 'An'ana' üzerine bir tartışma ve yorum ekledi {atıf:muqaddima-ibn-salah-itr, s. 59-61}."
  id: "Menurut Ibn Hajar, 'mu'dil' adalah yang hilang dalam dua atau lebih rantai transmisi berturut-turut, dan 'mu'd'alla' adalah yang hilang satu atau lebih pasangan di dua tempat berturut-turut atau tanpa kondisi berturut-turut {kutipan: Nuzhat-al-nazar-itr-Bushra-2011 hlm. 79}. Menurut Ibn al-Salah, 'mu'dil' adalah istilah yang mengungkapkan jenis koneksi khusus: dua atau lebih hal yang hilang dalam rantai transmisi, dan beberapa orang menyebutnya mursal. Contohnya adalah apa yang diceritakan oleh pengikut firman Tab'i: Rasulullah dan pendapat para ulama: Rasulullah berkata, Malik berkata, 'Ceritakan padaku dari Abu Huraira.' Hakim mengizinkan pengikut murid untuk menceritakan hadits yang ditangguhkan lagi, sementara yang lain memiliki hadits yang terus dan naik, dan Ibn al-Salah meminta echiah-nya. Ia juga menambahkan diskusi dan komentar tentang 'An'ana' dalam bukunya {sitasi: muqaddima-ibn-salah-itr, hlm. 59-61}."
