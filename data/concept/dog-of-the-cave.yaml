id: concept/dog-of-the-cave
class: concept
kind: natural
label:
  ar: "كلب أهل الكهف"
  en: "The dog of the cave"
  ur: "اہلِ کہف کا کتا"
  es: "El perro de la cueva"
  fr: "Le chien de la grotte"
  tr: "Mağara halkının köpeği"
  id: "Anjing dari orang-orang gua"
summary:
  ar: "كلب رافق فتية الكهف فذُكر في القرآن معهم باسط ذراعيه بالوصيد على باب الكهف حارساً، وناموا ثلاثمئة سنين وازدادوا تسعاً ثم بعثهم الله ليسأل بعضهم بعضاً."
  en: "The dog that accompanied the youths of the cave and is named with them in the Quran: forelegs stretched at the threshold, a guard. They slept three hundred years and nine, then God raised them to question one another."
  ur: "وہ کتا جو کہف کے جوانوں کے ساتھ تھا اور قرآن میں ان کے ساتھ ذکر ہوا: ڈہلیز پر اگلے پاؤں پھیلائے پہرے دار۔ وہ تین سو برس اور نو سوئے پھر اللہ نے انہیں اٹھایا کہ باہم پوچھیں۔"
  es: "El perro que acompañaba a los jóvenes de la cueva y que aparece junto a ellos en el Corán: con las patas delanteras extendidas en el umbral, hacía de guardián. Durmieron trescientos noventa años, y entonces Dios los despertó para que se interrogaran mutuamente."
  fr: "Le chien qui accompagnait les jeunes gens de la caverne et dont le nom est mentionné avec eux dans le Coran: pattes avant tendues au seuil, tel un gardien. Ils dormirent trois cent neuf ans, puis Dieu les ressuscita pour qu’ils s’interrogent les uns les autres."
  tr: "Mağaradaki gençlere bir köpek eşlik etti ve Kur'an'da onlarla birlikte kollarını uzatıp mağaranın kapısını bekçi olarak tuttuğu belirtilmiştir. Üç yüz yıl uyudular, dokuz yıl arttı, sonra Tanrı onları birbirlerine sorgulamaları için gönderdi."
  id: "Seekor anjing menemani para pemuda di gua, dan disebutkan dalam Al-Qur'an bersama mereka bahwa dia mengulurkan tangan dan memegang pintu gua sebagai penjaga. Mereka tidur selama tiga ratus tahun, bertambah sembilan tahun, lalu Tuhan mengutus mereka untuk saling bertanya."
