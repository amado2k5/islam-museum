summary:
  ar: "كلب رافق فتية الكهف فذُكر في القرآن معهم باسط ذراعيه بالوصيد على باب الكهف حارساً، وناموا ثلاثمئة سنين وازدادوا تسعاً ثم بعثهم الله ليسأل بعضهم بعضاً."
  en: "The dog that accompanied the youths of the cave and is named with them in the Quran: forelegs stretched at the threshold, a guard. They slept three hundred years and nine, then God raised them to question one another."
  ur: "وہ کتا جو کہف کے جوانوں کے ساتھ تھا اور قرآن میں ان کے ساتھ ذکر ہوا: ڈہلیز پر اگلے پاؤں پھیلائے پہرے دار۔ وہ تین سو برس اور نو سوئے پھر اللہ نے انہیں اٹھایا کہ باہم پوچھیں۔"
