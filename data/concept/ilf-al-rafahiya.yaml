label:
  ar: "إلف الرفاهية"
  en: "Habituation to luxury (ilf al-rafaha)"
  ur: "آسائش کی عادت (ilf al-rafaha)"
  es: "Habituación al lujo (ilf al-rafaha)"
  fr: "Habitude au luxe (ilf al-rafaha)"
summary:
  ar: "ما يسميه الشيخ عمر عبد الكافي إلف الرفاهية، أي تعوّد الأبناء على الترف، ويراه آفة، مع رأيه في أن الفقر الحقيقي فقر القلب، وإحصاء عن العنوسة لم يُتحقق منه بعد، ومقارنة جدلية لا يتبناها المتحف."
  en: "What Sheikh Omar Abdelkafy calls habituation to luxury, children's growing accustomed to indulgence, which he regards as a blight; with his view that true poverty is poverty of the heart, a statistic on celibacy not yet verified, and a polemical comparison the museum does not adopt."
  ur: "شیخ عمر عبدالکافی جسے آسائش کی عادت کہتے ہیں، یعنی بچوں کا عیش کا عادی ہونا جسے وہ آفت سمجھتے ہیں؛ ساتھ ان کی رائے کہ حقیقی غربت دل کی غربت ہے، ایک ایسا اعداد و شمار جس کی تصدیق باقی ہے، اور ایک جدلی موازنہ جسے میوزیم اختیار نہیں کرتا۔"
  es: "Lo que el jeque Omar Abdelkafy llama habituación al lujo, la creciente costumbre de los niños de la indulgencia, que él considera una plaga; con su opinión de que la verdadera pobreza es pobreza de corazón, una estadística sobre el celibato aún no verificada y una comparación polémica que el museo no adopta."
  fr: "Ce que le cheikh Omar Abdelkafy appelle l'accoutumance au luxe, l'accoutumance des enfants à l'indulgence, qu'il considère comme un fléau; son point de vue selon lequel la vraie pauvreté est la pauvreté du cœur, une statistique sur le célibat non encore vérifiée, et une comparaison polémique que le musée n'adopte pas."
