summary:
  ar: "ما يسميه الشيخ عمر عبد الكافي إلف الرفاهية، أي تعوّد الأبناء على الترف، ويراه آفة، مع رأيه في أن الفقر الحقيقي فقر القلب، وإحصاء عن العنوسة لم يُتحقق منه بعد، ومقارنة جدلية لا يتبناها المتحف."
  en: "What Sheikh Omar Abdelkafy calls habituation to luxury, children's growing accustomed to indulgence, which he regards as a blight; with his view that true poverty is poverty of the heart, a statistic on celibacy not yet verified, and a polemical comparison the museum does not adopt."
  ur: "شیخ عمر عبدالکافی جسے آسائش کی عادت کہتے ہیں، یعنی بچوں کا عیش کا عادی ہونا جسے وہ آفت سمجھتے ہیں؛ ساتھ ان کی رائے کہ حقیقی غربت دل کی غربت ہے، ایک ایسا اعداد و شمار جس کی تصدیق باقی ہے، اور ایک جدلی موازنہ جسے میوزیم اختیار نہیں کرتا۔"
