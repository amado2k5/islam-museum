summary:
  ar: "قريب القوة والطبع من جبلاهنك، ويُذكر أن الشربة منه تُعادل نصف درهم، وبه يختم الكتاب حرف الجيم، وجملة ما في هذا الحرف ثلاثون عدداً من الأدوية {cite:canon-ibn-sina-print-v1 p.431}."
  en: "Close in strength and nature to the one the book calls jabla hank. The book closes the letter jim here and says the letter holds thirty drugs in all {cite:canon-ibn-sina-print-v1 p.431}."
  ur: "قوت اور طبع میں اس کے قریب جسے کتاب جبلاہنگ کہتی ہے۔ کتاب یہاں حرف جیم ختم کرتی ہے اور کہتی ہے کہ اس حرف میں کل تیس دوائیں ہیں {cite:canon-ibn-sina-print-v1 p.431}۔"
  es: "De fuerza y naturaleza similar a la que el libro llama jabla hank. El libro cierra la carta jim aquí y dice que la carta contiene treinta drogas en total {cite:canon-ibn-sina-print-v1 p.431}."
  fr: "Proche en force et en nature de celui que le livre appelle jabla hank. Le livre clôt la lettre à Jim ici et dit qu'elle contient trente drogues au total {cite:canon-ibn-sina-print-v1 p.431}."
  tr: "Güç ve mizaç olarak Jabalehnak'a yakındır ve ondan içilen bir içkinin yarım dirhem değerinde olduğu belirtilir. Bununla birlikte, kitap 'J' harfiyle sona erer ve bu mektupta otuz ilaç bulunur {cite:canon-ibn-sina-print-v1 s.431}."
  id: "Kekuatan dan temperamennya mirip dengan Jabalehnak, dan disebutkan bahwa minuman dari sana bernilai setengah dirham. Dengan ini, buku ini diakhiri dengan huruf 'J', dan dalam surat ini terdapat tiga puluh obat {cite:canon-ibn-sina-print-v1 hlm.431}."
