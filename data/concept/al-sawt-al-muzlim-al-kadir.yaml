id: concept/al-sawt-al-muzlim-al-kadir
class: concept
kind: scientific
label:
  ar: "الصوت المظلم الكدر"
  en: "The darkened, murky voice"
  ur: "تاریک کدورت والی آواز"
summary:
  ar: "الصوت المظلم الكدر هو الذي يشبه صوت الرصاص إذا صك بعضه ببعض وسببه رطوبة غليظة جداً، وتنفع منه الرياضة والمصارعة وحصر النفس والتدلك اليابس بخرق الكتان ودخول الحمام واستعمال الأغذية الملطفة والمقطعة ⁦(أسماؤها مستثناة بحسب القاعدة والتدلك والمصارعة على وصف الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
  en: "The darkened, murky voice is the one like the sound of lead when pieces are struck on one another, and its cause is a very thick moisture; what benefits in it is exercise, wrestling, holding the breath, dry rubbing with linen cloths, entering the bath, and using the lightening, cutting foods (their names excluded per the rule; the rubbing and wrestling on the book's description) {cite:canon-ibn-sina-print-v2 p.326}"
  ur: "تاریک کدورت والی آواز وہ ہے جو سیسے کی آواز جیسی ہو جب اس کے ٹکڑے ایک دوسرے سے ٹکرائیں اور اس کا سبب بہت گاڑھی رطوبت ہے؛ اس میں مفید ہے ورزش کشتی سانس روکنا کتان کے کپڑوں سے خشک مالش غسل خانے جانا اور ملطف کاٹنے والی خوراکوں کا استعمال ⁦(ان کے نام اصول کے مطابق مستثنیٰ ہیں؛ مالش اور کشتی کتاب کی بیان کردہ صورت پر)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
