id: concept/al-sawt-al-muzlim-al-kadir
class: concept
kind: scientific
label:
  ar: "الصوت المظلم الكدر"
  en: "The darkened, murky voice"
  fr: "La voix obscurcie et trouble"
  ur: "تاریک کدورت والی آواز"
  es: "La voz oscura y turbia"
  tr: "Karanlık, donuk ses"
  id: "Suara gelap dan tumpul"
summary:
  ar: "الصوت المظلم الكدر هو الذي يشبه صوت الرصاص إذا صك بعضه ببعض وسببه رطوبة غليظة جداً، وتنفع منه الرياضة والمصارعة وحصر النفس والتدلك اليابس بخرق الكتان ودخول الحمام واستعمال الأغذية الملطفة والمقطعة ⁦(أسماؤها مستثناة بحسب القاعدة والتدلك والمصارعة على وصف الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
  en: "The darkened, murky voice is the one like the sound of lead when pieces are struck on one another, and its cause is a very thick moisture; what benefits in it is exercise, wrestling, holding the breath, dry rubbing with linen cloths, entering the bath, and using the lightening, cutting foods (their names excluded per the rule; the rubbing and wrestling on the book's description) {cite:canon-ibn-sina-print-v2 p.326}"
  fr: "La voix obscurcie et trouble est celle qui ressemble au son du plomb lorsqu’on en frappe des morceaux les uns contre les autres, et sa cause est une humidité très épaisse ; ce qui lui est bénéfique est l’exercice, la lutte, la rétention du souffle, la friction sèche avec des étoffes de lin, l’entrée au bain et l’usage d’aliments qui allègent et qui tranchent (leurs noms sont exclus selon la règle ; la friction et la lutte selon la description du livre) {cite:canon-ibn-sina-print-v2 p.326}"
  ur: "تاریک کدورت والی آواز وہ ہے جو سیسے کی آواز جیسی ہو جب اس کے ٹکڑے ایک دوسرے سے ٹکرائیں اور اس کا سبب بہت گاڑھی رطوبت ہے؛ اس میں مفید ہے ورزش کشتی سانس روکنا کتان کے کپڑوں سے خشک مالش غسل خانے جانا اور ملطف کاٹنے والی خوراکوں کا استعمال ⁦(ان کے نام اصول کے مطابق مستثنیٰ ہیں؛ مالش اور کشتی کتاب کی بیان کردہ صورت پر)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
  es: "La voz oscura y turbia es como el sonido del plomo al chocar entre sí, y su causa es una humedad muy espesa; lo que la beneficia es el ejercicio, la lucha, contener la respiración, frotarse en seco con paños de lino, entrar en el baño y usar alimentos ligeros y cortados (sus nombres se excluyen según la regla; el frotamiento y la lucha se describen en el libro) {cite:canon-ibn-sina-print-v2 p.326}"
  tr: "Koyu, donuk bir ses, bir kurşunun parçaları birbirine kenetlendiğinde çıkan sesi andıran ve çok yoğun nem oluşmasına neden olan bir sestir. Spor, güreş, kendini tutma, keten bezlerle kuru masaj, banyoya girme ve yatıştırıcı ile doğranmış yiyecekler kullanımı için faydalıdır (kurala göre isimleri istisnadır, masaj ve güreş ise kitapta anlatıldığı gibidir) {cite:canon-ibn-sina-print-v2 s.326}"
  id: "Suara gelap dan tumpul mirip ketika bagian-bagian peluru terkunci bersama dan menyebabkan pembentukan kelembapan yang sangat intens. Ini bermanfaat untuk olahraga, gulat, pengendalian diri, pijat kering dengan kain linen, mandi, dan mengonsumsi makanan yang dicincang dengan obat penenang (menurut aturan, nama-nama tersebut adalah pengecualian, tetapi pijat dan gulat sesuai dengan yang dijelaskan dalam buku) {cite:canon-ibn-sina-print-v2 hlm.326}"
