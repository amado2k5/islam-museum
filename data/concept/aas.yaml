  en: "Al-as (myrtle)"
  fr: "Al-as (myrte)"
  ur: "آس ⁦(مرٹل)⁩"
summary:
  ar: "الآس في الكتاب شجر معروف فيه مرارة وعفوصة وحلاوة، وقبضه أكثر من برده، وطبعه برد في الأولى ويبس في حدود الثانية؛ يحبس الإسهال والعرق وكل نزف، ويقوّي أصول الشعر، وينفع من الأورام الحارة والحمرة والقروح وحرق النار والرعاف والصداع والخفقان وبواسير المقعدة وورم الخصية وعضة الرتيلاء ولسعة العقرب؛ ويذكر الكتاب فيه أقوالاً عن الحيض والرحم في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.345-346}"
  en: "In the book al-as (myrtle) is a well-known shrub with bitterness, astringency and sweetness, its astringency outweighing its cold; the book places it cold in the first degree and dry near the second; it holds back diarrhoea, sweat and every bleeding, strengthens the roots of the hair, and is listed for hot swellings, erysipelas, ulcers, burns, nosebleed, headache, palpitations, piles, swelling of the testicle, the bite of the rutayla spider and the scorpion's sting; the book also gives statements on the menses and the womb in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.345-346}"
  fr: "Dans le livre, al-as (le myrte) est un arbuste bien connu alliant amertume, astringence et douceur, dont l'astringence l'emporte sur la froideur ; le livre le situe au premier degré du froid et près du deuxième degré du sec ; il retient la diarrhée, la sueur et tout saignement, renforce les racines des cheveux et figure dans les listes concernant les tuméfactions chaudes, l'érysipèle, les ulcères, les brûlures, le saignement de nez, le mal de tête, les palpitations, les hémorroïdes, le gonflement du testicule, la morsure de l'araignée rutayla et la piqûre du scorpion ; le livre donne aussi des propos sur les menstrues et l'utérus dans une section signalée, réservée à la décision du fondateur {cite:canon-ibn-sina-print-v1 pp.345-346}"
  ur: "آس کتاب میں ایک معروف جھاڑی ہے جس میں تلخی، قبض اور مٹھاس ہے، اس کی قبض اس کی سردی سے زیادہ ہے؛ کتاب اسے پہلے درجے میں سرد اور دوسرے کے قریب خشک قرار دیتی ہے؛ یہ اسہال، پسینے اور ہر خون بہنے کو روکتی ہے، بالوں کی جڑیں مضبوط کرتی ہے، اور گرم ورم، حمرہ، زخم، آگ سے جلنے، نکسیر، سر درد، دھڑکن، بواسیر، خصیے کے ورم، رتیلا کے کاٹنے اور بچھو کے ڈنک میں مذکور ہے؛ کتاب حیض اور رحم کے بارے میں اقوال موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.345-346}۔"
