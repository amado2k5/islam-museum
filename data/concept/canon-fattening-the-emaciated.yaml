id: concept/canon-fattening-the-emaciated
class: concept
kind: scientific
label:
  ar: "تسمين القضيف عند ابن سينا"
  en: "Fattening the emaciated in the Canon"
  fr: "Engraisser les personnes émaciées dans le Canon"
  ur: "دبلے کو موٹا کرنا قانون میں"
  es: "Engordar a los demacrados en el Canon"
  tr: "İbn Sina'ya göre Kadif'in Şişirilmesi"
  id: "Penggemukan Qadif menurut Ibn Sina"
summary:
  ar: "يعد ابن سينا يبس المزاج والماساريقا ويبس الهواء من أقوى علل الهزال، فإذا يبست الماساريقا لم تقبل الغذاء، ويعالج اليبس والهزال بدلك قبل الحمام بين الخشونة واللين حتى يحمر الجلد، ثم طلاء الزفت، ثم رياضة معتدلة، ثم استحمام بلا إبطاء، ثم تنشيف ودهن يسير وغذاء موافق، ويحيل التمام إلى كتاب الزينة من الكتاب الرابع {cite:canon-ibn-sina-print-v1 p.257}."
  en: "Ibn Sina counts dryness of temperament, of the mesentery and of the air among the strongest causes of emaciation, since a dried mesentery does not take in food; dryness and emaciation are treated with rubbing before the bath, between rough and gentle, until the skin reddens, then a pitch coating, moderate exercise, bathing without delay, drying, a little oil and suitable food, and he refers the full account to the book of adornment in Book Four {cite:canon-ibn-sina-print-v1 p.257}."
  fr: "Ibn Sina attribue fortement l’émaciation à la sécheresse du tempérament, du mésentère et de l’air, un mésentère sec n’absorbant pas les aliments. Il décrit friction avant bain, entre rude et douce jusqu’à rougeur, enduit de poix, exercice modéré, bain immédiat, séchage, peu d’huile et aliments adaptés ; le détail relève de la parure au Livre IV {cite:canon-ibn-sina-print-v1 p.257}."
  es: "Ibn Sina considera la sequedad del temperamento, del mesenterio y del aire como algunas de las causas más importantes de emaciación, ya que un mesenterio seco no absorbe alimento; la sequedad y la emaciación se tratan con frotamiento antes del baño, alternando entre áspero y suave, hasta que la piel se enrojezca, luego una capa de brea, ejercicio moderado, baño sin demora, secado, un poco de aceite y alimentos adecuados, y remite la descripción completa al libro de adornos en el Libro Cuatro {cite:canon-ibn-sina-print-v1 p.257}."
  ur: "ابن سینا مزاج کی خشکی، میسنٹری اور ہوا کی خشکی کو کمزوری کے سب سے مضبوط اسباب میں شمار کرتا ہے، کیونکہ خشک میسنٹری کھانا نہیں کھاتی۔ خشکی اور کمزوری کا علاج غسل سے پہلے کھردری اور نرمی کے درمیان، جلد کے سرخ ہونے تک رگڑنا، اعتدال پسند ورزش، بلاتاخیر نہانا، خشک کرنا، تھوڑا سا تیل اور مناسب خوراک سے کیا جاتا ہے، اور اس کا پورا حساب کتاب 4 میں زینت کی کتاب میں دیا گیا ہے۔"
  tr: "İbn Sina, kuru ruh halini ve masareca ile hava kuruluğunu eritmenin en ciddi nedenleri arasında görür. Masareca kurursa, yenilemez. Kuruluk ve eriklik, cilt kızarana kadar pürüzlülük ve yumuşaklık arasında bir karışımla tedavi edilir, sonra asfalt kaplama, ardından orta düzeyde egzersiz, gecikmeden banyo, ardından kurutma ve uygun diyet hafifçe uygulanır. Tam tedaviyi dördüncü kitaptaki Süs Kitabı'na atıfta bulunur {cite:canon-ibn-sina-print-v1 s.257}."
  id: "Ibn Sina menganggap suasana hati kering, masareca dan kekeringan udara sebagai penyebab paling parah dari kekosongan. Jika masareca mengering, maka tidak akan dimakan. Kekeringan dan pembunuhan diobati dengan campuran sebelum mandi antara kasar dan lembut hingga kulit menjadi merah, lalu lapisan aspal, kemudian olahraga sedang, kemudian mandi tanpa penundaan, kemudian mengeringkan dan menerapkan diet yang sesuai secara ringan. Ia merujuk seluruh perlakuan ke Kitab Perhiasan dari buku keempat {cite:canon-ibn-sina-print-v1 hlm.257}."
