id: concept/canon-fattening-the-emaciated
class: concept
kind: scientific
label: { ar: "تسمين القضيف عند ابن سينا", en: "Fattening the emaciated in the Canon", ur: "دبلے کو موٹا کرنا قانون میں" }
summary:
  ar: "يعد ابن سينا يبس المزاج والماساريقا ويبس الهواء من أقوى علل الهزال، فإذا يبست الماساريقا لم تقبل الغذاء، ويعالج اليبس والهزال بدلك قبل الحمام بين الخشونة واللين حتى يحمر الجلد، ثم طلاء الزفت، ثم رياضة معتدلة، ثم استحمام بلا إبطاء، ثم تنشيف ودهن يسير وغذاء موافق، ويحيل التمام إلى كتاب الزينة من الكتاب الرابع {cite:canon-ibn-sina-print-v1 p.257}."
  en: "Ibn Sina counts dryness of temperament, of the mesentery and of the air among the strongest causes of emaciation, since a dried mesentery does not take in food; dryness and emaciation are treated with rubbing before the bath, between rough and gentle, until the skin reddens, then a pitch coating, moderate exercise, bathing without delay, drying, a little oil and suitable food, and he refers the full account to the book of adornment in Book Four {cite:canon-ibn-sina-print-v1 p.257}."
