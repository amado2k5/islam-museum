id: concept/canon-sensitive-organs-and-harsh-drugs
class: concept
kind: scientific
label:
  ar: "الأعضاء الحساسة والأدوية اللاذعة عند ابن سينا"
  en: "Sensitive organs and harsh drugs in the Canon"
  fr: "Organes sensibles et remèdes agressifs dans le Canon"
  ur: "حساس اعضا اور تیز دوائیں قانون میں"
  es: "Órganos sensibles y drogas fuertes en el canon"
summary:
  ar: "يضيف ابن سينا طريقاً ثالثاً لمراعاة قوة العضو هو ذكاء الحس وكلاله، فالأعضاء العصبية الذكية الحس يتوقى فيها الأدوية الرديئة الكيفية واللذاعة والمؤذية كاليتوعات، ويعدد ثلاثة أصناف يتحاشى استعمالها {cite:canon-ibn-sina-print-v1 p.270}."
  en: "Ibn Sina adds a third way of weighing an organ's strength, the keenness or dullness of its sense: in keenly sensitive nervous organs he avoids drugs of bad quality, biting or harmful, such as the spurges, and he lists three classes of drug to be shunned {cite:canon-ibn-sina-print-v1 p.270}."
  fr: "Ibn Sina ajoute un troisième critère de force organique : acuité ou faiblesse de la sensibilité. Pour les organes nerveux très sensibles, il évite les remèdes de mauvaise qualité, mordants ou nuisibles, comme les euphorbes, et cite trois classes à écarter {cite:canon-ibn-sina-print-v1 p.270}."
  es: "Ibn Sina añade una tercera forma de medir la fuerza de un órgano, la agudeza o la torpeza de su sensibilidad: en órganos nerviosos muy sensibles evita los fármacos de mala calidad, irritantes o dañinos, como las euforbias, y enumera tres clases de fármacos que deben evitarse {cite:canon-ibn-sina-print-v1 p.270}."
  ur: "ابن سینا نے عضو کی طاقت کو تولنے کا تیسرا طریقہ، اس کی حس کی تیز یا سستی کا اضافہ کیا ہے: انتہائی حساس اعصابی اعضاء میں وہ خراب قسم کی دوائیوں سے پرہیز کرتا ہے، کاٹنے والی یا نقصان دہ، جیسے اسپرجز، اور اس نے تین قسم کی دوائیوں کی فہرست دی ہے جس سے پرہیز کیا جائے۔"
