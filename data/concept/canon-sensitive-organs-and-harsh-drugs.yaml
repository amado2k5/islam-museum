summary:
  ar: "يضيف ابن سينا طريقاً ثالثاً لمراعاة قوة العضو هو ذكاء الحس وكلاله، فالأعضاء العصبية الذكية الحس يتوقى فيها الأدوية الرديئة الكيفية واللذاعة والمؤذية كاليتوعات، ويعدد ثلاثة أصناف يتحاشى استعمالها {cite:canon-ibn-sina-print-v1 p.270}."
  en: "Ibn Sina adds a third way of weighing an organ's strength, the keenness or dullness of its sense: in keenly sensitive nervous organs he avoids drugs of bad quality, biting or harmful, such as the spurges, and he lists three classes of drug to be shunned {cite:canon-ibn-sina-print-v1 p.270}."
