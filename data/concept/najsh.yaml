label: { ar: "النَّجْش", en: "Inciting the bidding (najsh)", ur: "نجش ⁦(بولی بڑھانا)⁩", es: "Incitar a la puja (najsh)", fr: "Inciter aux enchères (najsh)", tr: "Al-Najsh", id: "Al-Najsh" }
summary:
  ar: "النجش في اللغة الاستثارة، وفي الاصطلاح أن يزيد الإنسان في سلعة أكثر من ثمنها وليس قصده شراءها بل ترغيب غيره فيوقعه فيها. وجمهور الفقهاء على تحريمه، لنهي النبي عنه. وفصل المالكية: الزيادة على القيمة ممنوعة باتفاق، ومساواتها أو نقصها في خلاف. وبيع النجش عند الجمهور صحيح لأن الفعل من الناجش لا من العاقد، وعند أحمد في رواية باطل. وللمشتري الخيار عند الحنفية والمالكية إن علم البائع بالناجش، وللشافعية الأصح أنه لا خيار له، وعند الحنابلة الخيار إذا كان في العقد غبن لا يتغابن الناس بمثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
  en: "Najash, in the lexicon, is inciting; in usage it is raising the bid for goods above their worth without intending to buy, in order to draw another into buying. Most jurists hold it forbidden on the authority of the Prophet's prohibition. The Malikis hold that bidding above the value is forbidden by agreement, and that bidding up to or below the value is disputed. Most jurists hold the sale valid, since the act is the bidder's and not the contractor's, while a view of Ahmad holds it void. The Hanafis and Malikis give the buyer an option when the seller knew of the shill; the sounder Shafi'i view gives no option; the Hanbalis give an option where the deal carries a loss that people do not usually accept. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
  ur: "نجش یعنی سامان کی قیمت اس کی اصل قیمت سے زیادہ بڑھانا تاکہ دوسرا خریدنے پر آمادہ ہو۔ جمہور کے نزدیک یہ حرام ہے، اور بیع صحیح ہے، جبکہ امام احمد کی ایک روایت میں باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
  es: "En el léxico, \"najash\" significa incitar; en la práctica, se refiere a elevar la puja por bienes por encima de su valor sin intención de comprarlos, con el fin de inducir a otro a la compra. La mayoría de los juristas lo consideran prohibido por la prohibición del Profeta. Los malikíes sostienen que pujar por encima del valor está prohibido por acuerdo, y que pujar por encima o por debajo del valor es objeto de disputa. La mayoría de los juristas consideran válida la venta, puesto que el acto corresponde al postor y no al contratista, mientras que la opinión de Ahmad la considera nula. Los hanafíes y los malikíes otorgan al comprador una opción cuando el vendedor conocía la existencia del shill; la opinión shafi'í, más sólida, no otorga ninguna opción; los hanbalíes otorgan una opción cuando la transacción conlleva una pérdida que la gente no suele aceptar. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
  fr: "Dans le lexique, « najash » signifie incitation; en pratique, cela consiste à surenchérir sur la valeur d'un bien sans intention d'achat, afin d'inciter autrui à acheter. La plupart des juristes l'interdisent en vertu de l'interdiction du Prophète. Les Malikites considèrent que surenchérir est interdit par consensus, et que surenchérir à un montant égal ou inférieur à la valeur est sujet à controverse. La plupart des juristes valident la vente, car l'acte incombe à l'enchérisseur et non au vendeur, tandis qu'une opinion d'Ahmad la déclare nulle. Les Hanafites et les Malikites accordent une option à l'acheteur lorsque le vendeur avait connaissance de la supercherie; l'avis plus solide des Chafi'ites n'en accorde aucune; les Hanbalites en accordent une lorsque la transaction entraîne une perte généralement inacceptable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
  tr: "Dilbilimde 'nejş' kışkırtma anlamına gelir ve teknik terimde bir kişi bir malın fiyatından daha fazla artırır; onu satın almak değil, başkalarını ona düşmeye teşvik etmek için. Hukukçuların çoğunluğu, Peygamber'in yasakladığı için yasaklanmasından yanadır. Maliki bölümünde şöyle der: Değerin artırılması uzlaşmayla yasaktır ve eşit ya da düşürülmesi tartışmalıdır. Nejşin çoğunluğa göre satışı geçerlidir çünkü eylem geçersizden gelir, yükleniciden değil ve Ahmad'ın bir rivayetine göre bu sahtedir. Hanafi ve Malikilere göre, alıcı satıcının geçersizden haberdar olması durumunda seçeneğe sahiptir, Şafiiler ise doğru görüştedir; bu görüşte başka seçeneği yoktur. Hanbali'ye göre seçenek, sözleşmede dolandırıcılık varsa ve insanlar buna itiraz etmezse. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15542}"
  id: "Dalam linguistik, 'najsh' berarti provokasi, dan dalam istilah teknis, seseorang menaikkan harga suatu komoditas lebih dari harganya, bukan bermaksud membelinya tetapi mendorong orang lain untuk terjebak dalam hal itu. Mayoritas ahli hukum mendukung pelarangan tersebut, seperti yang dilarang oleh Nabi. Bagian Maliki menyatakan: Meningkatkan nilai dilarang oleh konsensus, dan menyamai atau menguranginya adalah perselisihan. Penjualan najsh menurut mayoritas sah karena tindakan itu berasal dari yang tidak sah, bukan dari kontraktor, dan menurut Ahmad dalam salah satu narasi, itu salah. Pembeli memiliki opsi menurut Hanafi dan Malik jika penjual mengetahui tentang yang tidak sah, sementara Syafi'i memegang pandangan benar bahwa dia tidak memiliki pilihan. Menurut Hanbali, opsinya adalah jika ada penipuan dalam kontrak, dan orang tidak membantah hal yang sama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
