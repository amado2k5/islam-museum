id: concept/najsh
class: concept
kind: legal
label: { ar: "النَّجْش", en: "Inciting the bidding (najsh)", ur: "نجش (بولی بڑھانا)" }
summary:
  ar: "النجش في اللغة الاستثارة، وفي الاصطلاح أن يزيد الإنسان في سلعة أكثر من ثمنها وليس قصده شراءها بل ترغيب غيره فيوقعه فيها. وجمهور الفقهاء على تحريمه، لنهي النبي عنه. وفصل المالكية: الزيادة على القيمة ممنوعة باتفاق، ومساواتها أو نقصها في خلاف. وبيع النجش عند الجمهور صحيح لأن الفعل من الناجش لا من العاقد، وعند أحمد في رواية باطل. وللمشتري الخيار عند الحنفية والمالكية إن علم البائع بالناجش، وللشافعية الأصح أنه لا خيار له، وعند الحنابلة الخيار إذا كان في العقد غبن لا يتغابن الناس بمثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
  en: "Najash, in the lexicon, is inciting; in usage it is raising the bid for goods above their worth without intending to buy, in order to draw another into buying. Most jurists hold it forbidden on the authority of the Prophet's prohibition. The Malikis hold that bidding above the value is forbidden by agreement, and that bidding up to or below the value is disputed. Most jurists hold the sale valid, since the act is the bidder's and not the contractor's, while a view of Ahmad holds it void. The Hanafis and Malikis give the buyer an option when the seller knew of the shill; the sounder Shafi'i view gives no option; the Hanbalis give an option where the deal carries a loss that people do not usually accept. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
  ur: "نجش یعنی سامان کی قیمت اس کی اصل قیمت سے زیادہ بڑھانا تاکہ دوسرا خریدنے پر آمادہ ہو۔ جمہور کے نزدیک یہ حرام ہے، اور بیع صحیح ہے، جبکہ امام احمد کی ایک روایت میں باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15542}"
