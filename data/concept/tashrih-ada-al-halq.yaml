  es: "Anatomía de los órganos de la garganta"
summary:
  ar: "الحلق هو الفضاء الذي فيه مجريا النفس والغذاء ومنه الزوائد التي هي اللهاة واللوزتان والغلصمة، فأما اللهاة فجوهر لحمي معلق على أعلى الحنجرة كالحجاب منفعته تدريج الهواء لئلا يقرع ببرده الرئة فجأة وليمنع الدخان والغبار وليكون مقرعة للصوت يقوى بها ويعظم كأنه باب موصد على مخرج الصوت بقدره ولذلك يضر قطعها بالصوت ويهيئ الرئة لقبول البرد والتأذي به والسعال عنه، وأما اللوزتان فهما اللحمتان الناتئتان في أصل اللسان إلى فوق وهما لحمتان عصبيتان كغدتين ليكونا أقوى وهما من وجه كأصلين للأذنين والطريق إلى المريء بينهما ومنفعتهما أن يعبا الهواء عند رأس القصبة كالخزانة لكيلا يندفع الهواء جملة عند استنشاق القلب فيشرق الحيوان، وأما الغلصمة فلحم صفاقي لاصق بالحنك تحت اللهاة متدل منطبق على رأس القصبة وفوق الغلصمة الفائق وهو عظيم ذو أربعة أضلاع ⁦(حرر المحقق: الغلصمة اللحم بين الرأس والعنق والفائق ما يصل العنق بالرأس)⁩ {cite:canon-ibn-sina-print-v2 p.285}"
  en: "The throat is the space holding the two passages of breath and food, with the appendages that are the uvula, the two tonsils and the epiglottis. The uvula is a fleshy body hung on the larynx's top like a veil; its use is to admit the air gradually lest it strike the lung with its cold at once, to keep off smoke and dust, and to be a striking-board for the voice, which is strengthened and magnified by it as though it were a door shut on the voice's outlet to its measure — so cutting it harms the voice and readies the lung to take cold, be hurt by it and cough from it. The two tonsils are the two fleshy bodies jutting at the tongue's root upward, two nervous flesh bodies like two glands that they may be stronger, in a way like two roots of the ears, the way to the oesophagus lying between them; their use is to scoop the air at the windpipe's head like a tank lest the air rush all at once at the heart's inhaling and the animal choke. The epiglottis is a membrane-flesh clinging to the palate under the uvula, hanging down applied on the windpipe's head; and above the epiglottis is the fâ'iq, a great thing of four parts (the editor glossed al-ghulsama as the flesh between head and neck, and al-fâ'iq as what joins neck to head) {cite:canon-ibn-sina-print-v2 p.285}"
  ur: "حلق وہ فضاء ہے جس میں نفس اور غذاء کے دو مسیر ہیں اور اس میں وہ زوائد ہیں جو لہات لوزتین اور غلصمہ ہیں؛ لہات ایک گوشت کا جوہر ہے جو حنجرے کی چوٹی پر پردے کی مانند لٹکا ہے، اس کا نفع ہوا کو بتدریج داخل کرنا ہے کہ وہ اچانک اپنی سردی سے پھیپھڑے کو نہ جھکوڑے اور دھواں اور غبار روکنا اور آواز کے لیے مہرکَب بننا جس سے آواز مضبوط اور بڑی ہوتی ہے گویا آواز کے راستے پر بند دروازہ — اس لیے اس کا کٹنا آواز کو نقصان دیتا ہے اور پھیپھڑے کو سردی قبول کرنے اور اس سے تکلیف اور کھانسی اٹھنے کے لیے تیار کرتا ہے؛ لوزتین زبان کی جڑ میں اوپر کی طرف ابھری ہوئی دو گوشتیاں ہیں، عصبی دو گوشت گویا دو گرہیں کہ مضبوط رہیں، ایک رو سے کانوں کی دو جڑیں، اور مریء کا راستہ ان کے درمیان ہے؛ ان کا نفع یہ ہے کہ قصبہ کے سر پر ہوا کو حوض کی مانند بھریں کہ دل کی کشش پر ہوا یکمشت نہ دوڑے اور جانور گھٹن نہ جائے؛ غلصمہ حنک سے چمٹی ہوئی پردے جیسی گوشتی ہے جو لہات کے نیچے لٹک کر قصبے کے سر پر منطبق ہے اور غلصمہ کے اوپر فائق ہے جو بڑا اور چار ضلعوں والا ہے ⁦(محرر کی تحریر: غلصمہ سر اور گردن کے درمیان کی گوشت اور فائق وہ ہے جو گردن کو سر سے ملاتا ہے)⁩ {cite:canon-ibn-sina-print-v2 p.285}"
  es: "La garganta es el espacio que contiene los dos conductos de la respiración y la comida, con los apéndices que son la úvula, las dos amígdalas y la epiglotis. La úvula es un cuerpo carnoso que cuelga de la parte superior de la laringe como un velo; su función es admitir el aire gradualmente para que no golpee el pulmón con su frío de golpe, para mantener alejados el humo y el polvo, y ser una tabla de golpeo para la voz, que es fortalecida y magnificada por ella como si fuera una puerta cerrada en la salida de la voz a su medida; por lo tanto, cortarla daña la voz y prepara el pulmón para recibir el frío, ser dañado por él y toser a causa de él. Las dos amígdalas son los dos cuerpos carnosos que sobresalen en la raíz de la lengua hacia arriba, dos cuerpos carnosos nerviosos como dos glándulas para que puedan ser más fuertes, de manera similar a las dos raíces de los oídos, el camino al esófago que se encuentra entre ellas; Su función es recoger el aire en la cabeza de la tráquea como un tanque para evitar que el aire entre de golpe al inhalar y el animal se ahogue. La epiglotis es una membrana que se adhiere al paladar bajo la úvula y cuelga sobre la cabeza de la tráquea; y por encima de la epiglotis se encuentra el fâ'iq, una estructura grande de cuatro partes (el editor interpretó al-ghulsama como la carne entre la cabeza y el cuello, y al-fâ'iq como lo que une el cuello con la cabeza) {cite:canon-ibn-sina-print-v2 p.285}"
