id: "concept/al-umur-al-darra-bi-al-basar"
class: "concept"
kind: "scientific"
label:
  ar: "الأمور الضارة بالبصر"
  en: "Things harmful to sight"
  fr: "Ce qui nuit à la vue"
  ur: "بینائی کے لیے مضر چیزیں"
  es: "Cosas perjudiciales para la vista"
  tr: "Görmeye zararlı şeyler"
  id: "Hal-hal yang berbahaya bagi penglihatan"
summary:
  ar: "الأمور الضارة بالبصر منها أفعال وحركات ومنها أغذية ومنها حال التصرف في الأغذية: فمن الأفعال ما يجفف وطول النظر إلى المشرقات وقراءة الدقيق بإفراط والنوم على الامتلاء والعشاء، ومن الأغذية المالحة والحريفة والمفجرة وما يؤذي فم المعدة {cite:canon-ibn-sina-print-v2 p.206}"
  en: "The things harmful to sight are of deeds and motions, of foods, and of the handling of foods: among deeds, all that dries, long gazing at bright things, excessive reading of fine script, sleeping on a full stomach and late supper; among foods, the salty, the acrid, the wind-releasing and what hurts the mouth of the stomach {cite:canon-ibn-sina-print-v2 p.206}"
  fr: "Selon le Canon, la vue peut souffrir de certaines activités et de certains mouvements, des aliments et de leur mode d’emploi. Parmi les activités figurent tout ce qui dessèche, le fait de fixer longtemps des objets lumineux, la lecture excessive de caractères fins, le sommeil à l’estomac plein et le souper tardif. Parmi les aliments figurent ceux qui sont salés ou âcres, ceux qui provoquent des vents et ceux qui irritent l’orifice de l’estomac {cite:canon-ibn-sina-print-v2 p.206}"
  ur: "بینائی کے لیے مضر چیزیں بعض اعمال و حرکات سے ہیں، بعض اغذیہ سے اور بعض اغذیہ کے استعمال کے طریقے سے: اعمال میں ہر خشک کرنے والی چیز، روشن چیزوں کی طرف طویل نظر، باریک نوشته کا مفرط مطالعہ، سیر ہو کر سونا اور دیر کا کھانا؛ اور اغذیہ میں نمکین، تیز، ہوا پھوڑنے والے اور جو معدہ کے منہ کو تکلیف دیں {cite:canon-ibn-sina-print-v2 p.206}۔"
  es: "Las cosas perjudiciales para la vista son de actos y movimientos, de alimentos y de su manipulación: entre los actos, todo lo que reseca, la contemplación prolongada de objetos brillantes, la lectura excesiva de textos con letra fina, dormir con el estómago lleno y la cena tardía; entre los alimentos, lo salado, lo acre, lo que produce gases y lo que irrita la boca del estómago. {cite:canon-ibn-sina-print-v2 p.206}"
  tr: "Görmeye zararlı olan şeyler arasında hareketler ve eylemler, bazı yiyecekler ve yiyeceklerle uğraşma durumu bulunur: kuruyan davranışlar, doğu bölgelerine uzun uzun bakma, aşırı un okuma, tok uyumak ve akşam yemeği, tuzlu, baharatlı ve patlayıcı yiyecekler ile mideye zarar veren yiyecekler {cite:canon-ibn-sina-print-v2 s.206}"
  id: "Hal-hal yang berbahaya bagi penglihatan meliputi gerakan dan tindakan, makanan tertentu, dan cara menangani makanan tertentu: perilaku pengeringan, pandangan lama ke daerah timur, pembacaan tepung yang berlebihan, tidur nyenyak dan makan malam, makanan asin, pedas, dan eksplosif, serta makanan yang merusak lambung {cite:canon-ibn-sina-print-v2 hlm.206}"
