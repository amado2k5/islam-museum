summary:
  ar: "السبق عند المؤلف الخطر أو الجعل الذي يُجعل للسابق من المال، وقد ورد في الحديث «لا سبق إلا في خف أو حافر أو نصل» {cite:usul-iqtisad-islami-0660 p. 229}. والمسابقات ثلاث: ما يجوز بجعل وهو ما يعين على الجهاد، وما يجوز بلا جعل كالعدو والمصارعة، وما لا يجوز بجعل ولا بغيره كالنرد والشطرنج عند الأكثرين {cite:usul-iqtisad-islami-0660 p. 229}. وهو عنده أشبه بالغنائم، فأدرجه ضمن التوزيع الأول {cite:usul-iqtisad-islami-0660 p. 230}."
  tr: "Yazara göre, öncelik, önceki oyuncuya para kazandıran risk veya yaratımdır. Hadiste şöyle belirtilir: \"Öncelik sadece bir ayakkabı, toynak veya bıçakta değildir\" {cite:usul-iqtisad-islami-0660 s. 229}. Üç tür yarışma vardır: para kazanarak cihada yardımcı olan ve para kazanarak izin verilen yarışma; kazanmadan izin verilen koşu veya güreş; ve çoğu {cite:usul-iqtisad-islami-0660, s. 229} gibi zar ve satranç gibi yapma veya başka şekilde izin verilmeyen olanlar. Onun için bu daha çok ganimet gibidir, bu yüzden bunu ilk dağıtım arasına dahil etti {cite:usul-iqtisad-islami-0660, s. 230}."
  id: "Menurut penulis, prioritas adalah risiko atau penciptaan yang memberikan uang kepada yang sebelumnya. Disebutkan dalam hadits: \"Tidak ada prioritas kecuali pada sepatu, kuku, atau bilah\" {cite:usul-iqtisad-islami-0660 hlm. 229}. Ada tiga jenis kompetisi: apa yang diperbolehkan dengan menghasilkan uang, yang membantu jihad; apa yang diperbolehkan tanpa menghasilkan uang, seperti berlari atau gulat; dan apa yang tidak diperbolehkan dengan membuat atau tidak, seperti dadu dan catur menurut kebanyakan {cite:usul-iqtisad-islami-0660, hlm. 229}. Bagi dia, itu lebih seperti rampasan, sehingga ia memasukkannya ke dalam distribusi pertama {cite:usul-iqtisad-islami-0660, hlm. 230}."
