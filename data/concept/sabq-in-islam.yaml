summary:
  ar: "السبق عند المؤلف الخطر أو الجعل الذي يُجعل للسابق من المال، وقد ورد في الحديث «لا سبق إلا في خف أو حافر أو نصل» {cite:usul-iqtisad-islami-0660 p. 229}. والمسابقات ثلاث: ما يجوز بجعل وهو ما يعين على الجهاد، وما يجوز بلا جعل كالعدو والمصارعة، وما لا يجوز بجعل ولا بغيره كالنرد والشطرنج عند الأكثرين {cite:usul-iqtisad-islami-0660 p. 229}. وهو عنده أشبه بالغنائم، فأدرجه ضمن التوزيع الأول {cite:usul-iqtisad-islami-0660 p. 230}."
