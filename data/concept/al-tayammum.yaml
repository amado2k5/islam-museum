id: concept/al-tayammum
class: concept
kind: legal
label:
  ar: "التيمم"
  en: "Dry ablution (tayammum)"
  ur: "تیمم"
summary:
  ar: "يقرأ الشعراوي آية «فلم تجدوا ماء فتيمموا صعيداً طيباً» قراءة تعدّ التيمم أمراً من الله تُستباح به الصلاة عند فقد الماء، لا مجرد بديل نظيف، ويرى أن الحكمة في امتثال الأمر، ويعرض الخلاف في الضربة الواحدة والضربتين دون ترجيح، وينقل حديث الخصائص الخمس دون متنه كاملاً {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2256}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2260}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2261}."
  en: "Al-Sha'rawi reads 'then find no water and perform tayammum with clean earth' as a command from God by which prayer is made lawful when water is absent, not merely a clean substitute. He holds that the wisdom lies in obeying the command, reports the disagreement between one strike and two without preferring either, and cites the report of the five things given to the Prophet, without reproducing its full wording {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2256}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2260}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2261}."
  ur: "شعراوی آیت «فلم تجدوا ماء فتیمموا صعیداً طیباً» کو اللہ کا حکم سمجھتے ہیں جس سے پانی نہ ہونے پر نماز جائز ہوتی ہے، محض صفائی کا متبادل نہیں۔ وہ ایک ضرب اور دو ضربوں کے اختلاف کو ترجیح دیے بغیر نقل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2256}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2260}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2261}۔"
wings: [ideas]
themes: [worship-and-the-pillars]
issue:
  ar: "هل التيمم بديل عن الوضوء بالمعنى المادي للنظافة، وما حدّ الضربة فيه؟"
  en: "Is tayammum a substitute for washing in the sense of cleanliness, and how many strikes does it take?"
  ur: "کیا تیمم صفائی کے مفہوم میں وضو کا بدل ہے، اور اس میں کتنی ضربیں ہیں؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-command-of-god
    stance:
      ar: "التيمم عند فقد الماء أمر من الله تستباح به الصلاة، والضربة الواحدة أو الضربتان جائزتان"
      en: "Tayammum when water is absent is a command from God by which prayer is made lawful; one strike or two are both permitted"
      ur: "پانی نہ ہونے پر تیمم اللہ کا حکم ہے جس سے نماز جائز ہوتی ہے؛ ایک یا دو ضربیں دونوں جائز ہیں"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن التيمم يصح للحدث الأصغر والجنابة، وأن الآية تكفي بمسح الوجه واليدين، ويذكر أن بعض العلماء قالوا بضربة واحدة وبعضهم بضربتين {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2261}."
      en: "Sha'rawi holds that tayammum is valid for both minor impurity and major impurity, that wiping the face and hands suffices, and says some scholars held one strike and others two {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2261}."
      ur: "شعراوی کے مطابق تیمم حدث اصغر اور جنابت دونوں میں درست ہے، چہرے اور ہاتھوں کا مسح کافی ہے، اور بعض علماء ایک ضرب اور بعض دو ضربوں کے قائل ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2261}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
