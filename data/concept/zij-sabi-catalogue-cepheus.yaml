  ar: "يذكر الفهرس هذه الصورة باسم المتهب، ويقول إنها قيفاوس. وتُعدّ كواكبها بعد كواكب صورة التنين، وتأتي قبل صورة حارس الشمال في ترتيب الصفحات. {cite:zij-sabi-nallino-byblion pp.247}"
  en: "The catalogue gives this figure under the name al-Mutahhib, which the text identifies as Cepheus. Its stars come after those of the Dragon and before those of the Guardian of the North, in the order of the printed pages. {cite:zij-sabi-nallino-byblion pp.247}"
