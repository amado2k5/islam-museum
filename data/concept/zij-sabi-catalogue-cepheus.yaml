summary:
  ar: "يذكر الفهرس هذه الصورة باسم المتهب، ويقول إنها قيفاوس. وتُعدّ كواكبها بعد كواكب صورة التنين، وتأتي قبل صورة حارس الشمال في ترتيب الصفحات. {cite:zij-sabi-nallino-byblion pp.247}"
  en: "The catalogue gives this figure under the name al-Mutahhib, which the text identifies as Cepheus. Its stars come after those of the Dragon and before those of the Guardian of the North, in the order of the printed pages. {cite:zij-sabi-nallino-byblion pp.247}"
  ur: "فہرست اس صورت کو المتہب کے نام سے دیتی ہے اور متن اسے قیفاوس بتاتا ہے۔ اس کے ستارے تنین کے بعد اور حارس الشمال کی صورت سے پہلے درج ہیں۔ {cite:zij-sabi-nallino-byblion pp.247}"
  es: "El catálogo da a esta figura el nombre de al-Mutahhib, que el texto identifica como Cefeo. Sus estrellas aparecen después de las del Dragón y antes de las del Guardián del Norte, en el orden de las páginas impresas. {cite:zij-sabi-nallino-byblion pp.247}"
  fr: "Le catalogue désigne cette figure sous le nom d'al-Mutahhib, que le texte identifie à Céphée. Ses étoiles suivent celles du Dragon et précèdent celles du Gardien du Nord, selon l'ordre des pages imprimées. {cite:zij-sabi-nallino-byblion pp.247}"
  tr: "Dizin, bu görüntüyü \"Üfleyici\" olarak adlandırıyor ve Cepheus olarak tanımlıyor. Gezegenleri, Ejderha görüntüsünün gezegenlerinden sonra listeleniyor ve sayfa sıralamasında Kuzey Muhafızı görüntüsünden önce geliyor. {cite:zij-sabi-nallino-byblion pp.247}"
  id: "Indeks tersebut menyebut gambar ini sebagai \"Blower\" dan mengidentifikasinya sebagai Cepheus. Planet-planetnya tercantum setelah planet-planet pada gambar Naga, dan mendahului gambar Penjaga Utara dalam urutan halaman. {cite:zij-sabi-nallino-byblion pp.247}"
