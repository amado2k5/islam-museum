id: concept/mahr
class: concept
kind: legal
label: { ar: "المَهْر", en: "Mahr: the dower that a husband gives his wife", ur: "مہر (شوہر کی جانب سے بیوی کا حق)" }
summary:
  ar: "المهر ما يدفعه الزوج إلى زوجته بعقد الزواج، ويسمى الصداق والنحلة والفريضة، وهو واجب في كل نكاح. وللفقهاء فيه أحكام واسعة: مقداره وأقله وأكثره، وجعل المنفعة مهرا، وتعجيله وتأجيله، ومؤكداته كالدخول والموت والخلوة، ونصفه بالطلاق قبل الدخول، ومهر المثل عند التفويض أو فساد التسمية، والاختلاف فيه، ومهر السر والعلن، وأثر المرض المخوف عليه، والجهاز ومتاع البيت."
  en: "Mahr is what a husband gives his wife on marriage; it is also called sadaq, nihla and faridha, and is due in every marriage. The jurists treat its amount, its least and most, making a benefit the dower, prompt or deferred payment, what makes it certain (intercourse, death, seclusion), halving it when divorce comes before consummation, the proper dower when no sum was named or it is invalid, disputes over it, secret and public agreements, a dower given during a fatal illness, and the household goods. The Hanafis, Malikis, Shafi'is and Hanbalis differ on many of these points."
  ur: "مہر وہ مال ہے جو شوہر نکاح کے وقت بیوی کو دیتا ہے، اور ہر نکاح میں واجب ہے۔ فقہاء نے اس کی کم سے کم و زیادہ سے زیادہ مقدار، منفعت کو مہر بنانا، فوری یا مؤجل ادائیگی، طلاق سے پہلے نصف، مہرِ مثل، اختلاف، مرضِ موت میں مہر اور جہیز کے احکام بیان کیے ہیں۔"
