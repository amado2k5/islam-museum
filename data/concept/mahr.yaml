  - tradition: sunni
    id: omar-abdelkafy-aadau-al-islam
    summary:
      ar: "الشيخ عمر عبد الكافي يرى أن المؤخر دين في عنق الزوج يجب أداؤه في حياته، وأن الفهم الشائع بأنه لا يستحق إلا بالطلاق أو الموت فهم خاطئ، وينتقد الآباء الذين يطلبون مؤخرا كبيرا ليدفعوا الزوج إلى الطلاق. الأحكام الفقهية في الأقسام السابقة قائمة كما هي، وهذا رأي الشيخ."
      en: "Sheikh Omar Abdelkafy holds that the deferred dower is a debt on the husband that must be paid during his life, and that the common understanding that it falls due only at divorce or death is mistaken; he criticises fathers who ask for a large deferred dower to push a divorce. The juristic rules in the sections above stand; this is the speaker's view."
      ur: "شیخ عمر عبدالکافی کے نزدیک مؤخر مہر شوہر پر ایک قرض ہے جو اس کی زندگی میں ادا کرنا ہے، اور یہ عام خیال کہ یہ صرف طلاق یا موت پر واجب ہوتا ہے، ان کے نزدیک غلط فہمی ہے؛ وہ ان والدین پر تنقید کرتے ہیں جو زیادہ مؤخر مہر مانگ کر شوہر کو طلاق پر مجبور کرتے ہیں۔ پچھلے حصوں کے فقہی احکام اپنی جگہ قائم ہیں؛ یہ شیخ کی رائے ہے۔"
