id: concept/ikhtilat-al-dhihn-wa-al-hadhayan
class: concept
kind: scientific
label:
  ar: "اختلاط الذهن والهذيان"
  en: "Confusion of the mind and raving (ikhtilat al-dhihn wa al-hadhayan)"
  ur: "ذہن کی گڑبڑ اور ہذیان ⁦(اختلاط الذهن والهذيان)⁩"
  es: "Confusión de la mente y delirante (ikhtilat al-dhihn wa al-hadhayan)"
  fr: "Confusion de l'esprit et délire (ikhtilat al-dhihn wa al-hadhayan)"
summary:
  ar: "يذكر ابن سينا أسباب اختلاط الذهن والهذيان من الدماغ نفسه ومن عضو آخر أو البدن، من سوداء وصفراء ودم وحر وبخار ويبس، وأن أسلمه ما كان مع ضحك وسكون وأردأه ما كان مع اضطراب وإقدام، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.96} {cite:canon-ibn-sina-print-v2 p.97}"
  en: "Ibn Sina gives the causes of confusion of the mind and raving, from the brain itself and from another organ or the body: black bile, yellow bile, blood, heat, vapour and dryness; the safest is that with laughter and stillness, the worst that with agitation and boldness; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.96} {cite:canon-ibn-sina-print-v2 p.97}"
  ur: "ابن سینا ذہن کی گڑبڑ اور ہذیان کے اسباب بتاتا ہے، دماغ ہی سے اور کسی اور عضو یا بدن سے: سودا، صفراء، خون، گرمی، بخار اور خشکی؛ سب سے محفوظ وہ جو ہنسی اور سکون کے ساتھ ہو اور سب سے برا وہ جو اضطراب اور جرأت کے ساتھ؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.96} {cite:canon-ibn-sina-print-v2 p.97}۔"
  es: "Ibn Sina da las causas de la confusión mental y el delirio, tanto del cerebro mismo como de otro órgano o del cuerpo: bilis negra, bilis amarilla, sangre, calor, vapor y sequedad; lo más seguro es que se alivie con risa y quietud, lo peor que se alivie con agitación y audacia; el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 p.96} {cite:canon-ibn-sina-print-v2 p.97}"
  fr: "Ibn Sina énonce les causes de la confusion mentale et du délire, qu'elles proviennent du cerveau lui-même ou d'un autre organe ou corps: la bile noire, la bile jaune, le sang, la chaleur, la vapeur et la sécheresse. Le mieux est d'y parvenir en riant et en restant calme, le pire en l'accompagnant d'agitation et d'audace. Le texte comporte une ligne légendée dans une section réservée à la décision du fondateur. {cite:canon-ibn-sina-print-v2 p.96} {cite:canon-ibn-sina-print-v2 p.97}"
