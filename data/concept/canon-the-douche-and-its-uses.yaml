summary:
  ar: "يعد ابن سينا النطولات علاجات جيدة لما يحتاج أن يحلل من الرأس وغيره من الأعضاء ولما يحتاج أن يبدل مزاجه، ويرتب استعمالها بالحار أولاً ثم الماء البارد ليشتد إن لم تكن فضول منصبة، وبالعكس إن كان الأمر بخلافه {cite:canon-ibn-sina-print-v1 p.289}."
  en: "Ibn Sina counts douches good treatments for what must be dissolved from the head and other organs and for what needs its temperament changed, and orders their use hot first and then cold water to firm the part when no superfluities are flowing down, and the reverse when the case is the opposite {cite:canon-ibn-sina-print-v1 p.289}."
