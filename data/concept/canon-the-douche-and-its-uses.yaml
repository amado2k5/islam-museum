id: concept/canon-the-douche-and-its-uses
class: concept
kind: scientific
label: { ar: "النطولات واستعمالها عند ابن سينا", en: "The medicated douche and its uses in the Canon", ur: "قانون میں نطول اور اس کا استعمال", es: "La ducha vaginal medicada y sus usos en el Canon", fr: "La douche vaginale médicamenteuse et ses usages dans le Canon", tr: "İbn Sina'ya göre nişler ve kullanımları", id: "Ceruk dan Penggunaannya menurut Ibn Sina" }
summary:
  ar: "يعد ابن سينا النطولات علاجات جيدة لما يحتاج أن يحلل من الرأس وغيره من الأعضاء ولما يحتاج أن يبدل مزاجه، ويرتب استعمالها بالحار أولاً ثم الماء البارد ليشتد إن لم تكن فضول منصبة، وبالعكس إن كان الأمر بخلافه {cite:canon-ibn-sina-print-v1 p.289}."
  en: "Ibn Sina counts douches good treatments for what must be dissolved from the head and other organs and for what needs its temperament changed, and orders their use hot first and then cold water to firm the part when no superfluities are flowing down, and the reverse when the case is the opposite {cite:canon-ibn-sina-print-v1 p.289}."
  es: "Ibn Sina considera que las duchas vaginales son buenos tratamientos para lo que debe disolverse de la cabeza y otros órganos y para lo que necesita cambiar su temperamento, y ordena su uso primero con agua caliente y luego con agua fría para fortalecer la parte cuando no hay superfluidades, y lo contrario cuando el caso es opuesto {cite:canon-ibn-sina-print-v1 p.289}."
  fr: "Ibn Sina considère les douches vaginales comme de bons traitements pour ce qui doit être dissous de la tête et des autres organes et pour ce qui a besoin que son tempérament soit modifié, et ordonne leur utilisation d'abord d'eau chaude puis d'eau froide pour raffermir la partie lorsque les excès ne s'écoulent pas, et l'inverse lorsque le cas est opposé {cite:canon-ibn-sina-print-v1 p.289}."
  ur: "ابن سینا نے سر اور دوسرے اعضاء سے تحلیل ہونے اور اس کے مزاج کو بدلنے کی ضرورت کے لیے دوچیز کے اچھے علاج شمار کیے ہیں، اور اس حصے کو مضبوط کرنے کے لیے پہلے گرم اور پھر ٹھنڈا پانی استعمال کرنے کا حکم دیا ہے جب کوئی ضرورت سے زیادہ چیزیں نہ بہہ رہی ہوں، اور جب معاملہ اس کے برعکس ہو تو اس کے برعکس۔"
  tr: "İbn Sina, netulatın baş ve diğer organlardan analiz edilmesi gerekenler için ve ruh halini değiştirmek için iyi bir tedavi olduğunu düşünür. Önce sıcak su, sonra soğuk su ile meraktan değilse güçlendirmek için, aksi takdirde ise tersi şekilde ayarlamıştır {cite:canon-ibn-sina-print-v1 s.289}."
  id: "Ibn Sina menganggap netulat sebagai pengobatan yang baik untuk apa yang perlu dianalisis dari kepala dan organ lain serta untuk mengubah suasana hatinya. Ia mengatur penggunaannya terlebih dahulu dengan air panas, kemudian air dingin untuk memperkuatnya jika bukan karena rasa ingin tahu, dan sebaliknya jika tidak {cite:canon-ibn-sina-print-v1 hlm.289}."
