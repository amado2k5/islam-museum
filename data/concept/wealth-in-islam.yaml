id: concept/wealth-in-islam
class: concept
kind: ethical
label:
  ar: المال في الإسلام
  en: Wealth in Islam
summary:
  ar: "يرى محمد البهي في «الإسلام فطرة الله» أن المال ضروري في حياة الإنسان، وأن السعي إليه والميل إلى تملكه من الفطرة، ولذلك لا يرى في تحريم الملكية الفردية أو الاقتناء جملة اتجاها طبيعيا {cite:al-islam-fitrat-allah-azhar p. 27}. وفي المقابل ينطوي المال على الإغراء والفتنة، فيحتاط المسلم في وسائل تحصيله وإنمائه، ويتجنب ما يضر به ويضر غيره {cite:al-islam-fitrat-allah-azhar p. 28}. ويقوم الأصل الأول عنده على أن الملكية الحقيقية لله وأن الإنسان مستخلف فيه، فيلتزم حدود الله في طرق التحصيل والتنمية، وينفق في سبيل الله بمحض اختياره {cite:al-islam-fitrat-allah-azhar p. 69} {cite:al-islam-fitrat-allah-azhar p. 70}. وسبيل الله عنده هو المصلحة العامة للأمة، أي ما يحفظ تماسكها ويصون علاقات أفرادها ويهيئ فرص العمل والسعي {cite:al-islam-fitrat-allah-azhar p. 37} {cite:al-islam-fitrat-allah-azhar p. 38}. ويعد الكتاب من وسائل الإسلام لمنع تكديس المال في يد قلة: الزكاة، والإنفاق في المصالح العامة، وتفتيت الميراث، وتحريم الربا {cite:al-islam-fitrat-allah-azhar p. 138}."
  en: "Al-Bahi holds that wealth is necessary to human life and that the drive to acquire it is innate, so banning private ownership is unnatural (p. 27). Wealth also carries temptation, so the believer guards the means of getting and growing it (p. 28). God is the true owner and the human a steward (pp. 69-70); spending for God's cause means the public interest (pp. 37-38). Zakat, public spending, inheritance division and the prohibition of riba are, in his account, the means that stop wealth piling up (p. 138). This is the author's own reading, presented as his view."
