label:
  ar: المال في الإسلام
  en: Wealth in Islam
  es: "La riqueza en el Islam"
  fr: "La richesse en islam"
  ur: "اسلام میں دولت"
  tr: "İslam'da Para"
  id: "Uang dalam Islam"
summary:
  ar: "يرى محمد البهي في «الإسلام فطرة الله» أن المال ضروري في حياة الإنسان، وأن السعي إليه والميل إلى تملكه من الفطرة، ولذلك لا يرى في تحريم الملكية الفردية أو الاقتناء جملة اتجاها طبيعيا {cite:al-islam-fitrat-allah-azhar p. 27}. وفي المقابل ينطوي المال على الإغراء والفتنة، فيحتاط المسلم في وسائل تحصيله وإنمائه، ويتجنب ما يضر به ويضر غيره {cite:al-islam-fitrat-allah-azhar p. 28}. ويقوم الأصل الأول عنده على أن الملكية الحقيقية لله وأن الإنسان مستخلف فيه، فيلتزم حدود الله في طرق التحصيل والتنمية، وينفق في سبيل الله بمحض اختياره {cite:al-islam-fitrat-allah-azhar p. 69} {cite:al-islam-fitrat-allah-azhar p. 70}. وسبيل الله عنده هو المصلحة العامة للأمة، أي ما يحفظ تماسكها ويصون علاقات أفرادها ويهيئ فرص العمل والسعي {cite:al-islam-fitrat-allah-azhar p. 37} {cite:al-islam-fitrat-allah-azhar p. 38}. ويعد الكتاب من وسائل الإسلام لمنع تكديس المال في يد قلة: الزكاة، والإنفاق في المصالح العامة، وتفتيت الميراث، وتحريم الربا {cite:al-islam-fitrat-allah-azhar p. 138}. ويرى زيدان قعدات أن الرزق بيد الله يرزق من يشاء، ويعدّ الاعتراف لصاحب الفضل بفضله أقل ما يلزم {cite:qadan-manhaj-iqtisad-quran p. 34}، وأن المحرمات في المال هي حقوق الآخرين التي يحفظها الحلال والحرام {cite:qadan-manhaj-iqtisad-quran p. 40}."
  en: "Al-Bahi holds that wealth is necessary to human life and that the drive to acquire it is innate, so banning private ownership is unnatural (p. 27). Wealth also carries temptation, so the believer guards the means of getting and growing it (p. 28). God is the true owner and the human a steward (pp. 69-70); spending for God's cause means the public interest (pp. 37-38). Zakat, public spending, inheritance division and the prohibition of riba are, in his account, the means that stop wealth piling up (p. 138). This is the author's own reading, presented as his view."
  es: "Al-Bahi sostiene que la riqueza es necesaria para la vida humana y que el afán por adquirirla es innato, por lo que prohibir la propiedad privada es antinatural (p. 27). La riqueza también conlleva tentación, por lo que el creyente protege los medios para obtenerla y aumentarla (p. 28). Dios es el verdadero dueño y el ser humano un administrador (pp. 69-70); gastar para la causa de Dios significa el interés público (pp. 37-38). El zakat, el gasto público, la distribución de la herencia y la prohibición de la usura son, según él, los medios para evitar la acumulación de riqueza (p. 138). Esta es la interpretación del autor, presentada como su punto de vista."
  fr: "Al-Bahi soutient que la richesse est essentielle à la vie humaine et que le désir de l'acquérir est inné; interdire la propriété privée est donc contre nature (p. 27). La richesse est aussi source de tentation, aussi le croyant veille-t-il à la maîtrise des moyens de l'acquérir et de la faire fructifier (p. 28). Dieu est le véritable propriétaire et l'homme un intendant (pp. 69-70); dépenser pour la cause divine, c'est servir l'intérêt général (pp. 37-38). La zakat, les dépenses publiques, le partage des héritages et l'interdiction du riba sont, selon lui, les moyens de freiner l'accumulation des richesses (p. 138). Telle est l'interprétation de l'auteur, présentée comme son point de vue."
  ur: "الباہی کا خیال ہے کہ دولت انسانی زندگی کے لیے ضروری ہے اور اسے حاصل کرنے کی کوشش فطری ہے، اس لیے نجی ملکیت پر پابندی لگانا غیر فطری ہے ⁦(ص27)⁩۔ دولت بھی فتنہ کا باعث ہوتی ہے، اس لیے مومن اسے حاصل کرنے اور بڑھانے کے ذرائع کی حفاظت کرتا ہے ⁦(ص 28)⁩۔ خُدا حقیقی مالک ہے اور انسان ایک نگران ہے (pp. 69-70)؛ خدا کے مقصد کے لئے خرچ کرنے کا مطلب عوامی مفاد ہے ⁦(صفحہ 37-38)⁩۔ زکوٰۃ، عوامی اخراجات، وراثت کی تقسیم اور سود کی حرمت اس کے کھاتے میں دولت کے انبار کو روکنے کے ذرائع ہیں ⁦(ص 138)⁩۔ یہ مصنف کا اپنا مطالعہ ہے، جو اس کے نقطہ نظر کے طور پر پیش کیا گیا ہے۔"
  tr: "Muhammed el-Bahi, \"İslam: Allah'ın Doğası\" adlı kitabında, zenginliğin insan hayatında esas olduğunu ve ona sahip olma arzusunun ve isteğinin insan doğasının bir parçası olduğunu savunmaktadır. Bu nedenle, genel olarak bireysel mülkiyetin veya edinmenin yasaklanmasını doğal bir eğilim olarak görmemektedir {al-islam-fitrat-allah-azhar s. 27}. Aksine, zenginlik ayartma ve cazibe içerir, bu nedenle Müslüman, onu edinme ve artırma yöntemlerinde dikkatli olmalı ve kendisine ve başkalarına zarar veren şeylerden kaçınmalıdır {al-islam-fitrat-allah-azhar s. 28}. Onun temel ilkesi, gerçek mülkiyetin Allah'a ait olduğu ve insanlığın O'nun vekili olduğudur. Bu nedenle, edinme ve geliştirme yöntemlerinde Allah'ın sınırlarına uyulmalı ve kişi kendi özgür iradesiyle Allah yolunda harcamalıdır {al-islam-fitrat-allah-azhar s. 69} {al-islam-fitrat-allah-azhar s. 70}. Ona göre Allah'ın yolu, milletin genel menfaatidir; yani, milletin bütünlüğünü koruyan, üyelerinin ilişkilerini güvence altına alan ve çalışma ve gayret fırsatları sağlayan şeydir. {al-islam-fitrat-allah-azhar s. 37} {al-islam-fitrat-allah-azhar s. 38}. Kitap, servetin azınlığın elinde toplanmasını önlemek için İslam'ın araçları arasında zekât (zorunlu sadaka), kamu yararına harcama, mirasın paylaşımı ve faizin yasaklanmasını sayar. {al-islam-fitrat-allah-azhar s. 138}. Zeydan Kadadat, rızkın Allah'ın elinde olduğuna, dilediğine rızık verdiğine ve iyilik yapanın iyiliğini kabul etmenin en az gerekli olan şey olduğuna inanır. {kadan-manhaj-iqtisad-quran s. 34} ve servet konusunda haram olanın başkalarının hakları olduğu, bu hakların da helal ve haram olanla korunduğu belirtilmiştir. {Kaynak:Kadan-manhaj-iktisad-Kuran, s. 40}"
  id: "Dalam bukunya \"Islam: Sifat Tuhan,\" Muhammad al-Bahi berpendapat bahwa kekayaan adalah hal penting dalam kehidupan manusia, dan bahwa pengejarannya serta kecenderungan untuk memilikinya adalah bagian dari sifat manusia. Oleh karena itu, ia tidak menganggap larangan kepemilikan atau perolehan individu secara umum sebagai kecenderungan alami {cite:al-islam-fitrat-allah-azhar hlm. 27}. Sebaliknya, kekayaan melibatkan godaan dan daya tarik, sehingga seorang Muslim harus berhati-hati dalam cara memperoleh dan meningkatkannya, dan menghindari apa yang membahayakan dirinya sendiri dan orang lain {cite:al-islam-fitrat-allah-azhar hlm. 28}. Prinsip utamanya adalah bahwa kepemilikan sejati adalah milik Tuhan, dan bahwa manusia adalah pengelola-Nya. Oleh karena itu, seseorang harus mematuhi batasan Tuhan dalam metode perolehan dan pengembangan, dan berinfak untuk kepentingan Tuhan dengan kehendak bebasnya sendiri {cite:al-islam-fitrat-allah-azhar hlm. 69} {cite:al-islam-fitrat-allah-azhar hlm. 70}. Dan jalan Allah, menurutnya, adalah kepentingan umum bangsa, yaitu apa yang menjaga keharmonisan bangsa, melindungi hubungan antar anggotanya, dan menyediakan kesempatan untuk bekerja dan berjuang {cite:al-islam-fitrat-allah-azhar hlm. 37} {cite:al-islam-fitrat-allah-azhar hlm. 38}. Kitab ini menganggap beberapa cara Islam untuk mencegah penumpukan kekayaan di tangan segelintir orang antara lain: zakat (sedekah wajib), pengeluaran untuk kepentingan umum, pembagian warisan, dan larangan riba {cite:al-islam-fitrat-allah-azhar hlm. 138}. Zaidan Qadadat percaya bahwa rezeki berada di tangan Allah, yang memberi rezeki kepada siapa pun yang Dia kehendaki, dan bahwa mengakui kebaikan orang yang telah berbuat baik adalah hal yang paling minimal yang diwajibkan {cite:qadan-manhaj-iqtisad-quran hlm. 34}, dan bahwa yang diharamkan terkait harta benda adalah hak orang lain, yang dilindungi oleh apa yang diperbolehkan dan yang diharamkan {kutip:qadan-manhaj-iqtisad-quran hlm. 40}."
