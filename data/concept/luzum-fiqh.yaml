tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "اللُّزُوم"
  en: "Binding force (luzum), fiqh and usul rulings"
  ur: "لزوم ⁦(فقہی و اصولی احکام)⁩"
  es: "Fuerza vinculante (luzum), normas de fiqh y usul"
  fr: "Force contraignante (luzum), règles de fiqh et d'usul"
  tr: "Zorunluluk"
  id: "Kebutuhan"
summary:
  ar: "اللزوم في اللغة مصدر لزِم يلزَم، أي كان مع الشيء فلم يفارقه، والتزمه اعتنقه، ولزمه المال وجب عليه، ولزمه الطلاق وجب حكمه وهو قطع الزوجية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605}. ويستعمل الفقهاء اللزوم بمعنى الوجوب والتحتم، وبمعنى عدم جواز الفسخ في العقود {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13609}."
  en: "Luzum, in lexicon, is staying with a thing and not parting from it; to be bound by money is to owe it, and divorce binds when its ruling takes effect, which is the ending of marriage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605}. Jurists use luzum to mean obligation and necessity, and in contracts, the impossibility of rescission {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13609}."
  ur: "لزوم لغت میں کسی چیز کے ساتھ رہنا اور اسے نہ چھوڑنا ہے؛ مال کا لزوم ہونا یعنی اس کا واجب ہونا، اور طلاق کا لزوم یعنی اس کا حکم جاری ہونا، جو نکاح کا ختم ہونا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605}۔ فقہاء لزوم کو واجب اور لازمی ہونے کے معنی میں اور عقود میں فسخ کے ناجائز ہونے کے معنی میں استعمال کرتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13609}۔"
  es: "Luzum, en el léxico, significa permanecer con algo y no separarse de ello; estar obligado por dinero es deberlo, y el divorcio vincula cuando su sentencia entra en vigor, que es la disolución del matrimonio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605}. Los juristas usan luzum para referirse a la obligación y la necesidad, y en los contratos, a la imposibilidad de rescisión {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13609}."
  fr: "Le terme « luzum », en hébreu, signifie demeurer avec quelque chose et ne pas s'en séparer; être lié par de l'argent signifie en être redevable, et le divorce est contraignant dès que sa décision prend effet, ce qui marque la fin du mariage (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13605). Les juristes utilisent « luzum » pour désigner l'obligation et la nécessité, et, dans le domaine des contrats, l'impossibilité de rescision (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13605) (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13609)."
  tr: "Dilde 'lizum', 'yizmazm' adlı fiil isimidir; yani bir şeyle birlikteydi ve onu bırakmadı; 'eğer ona bağlı kaldıysa, onu benimserdi; paraya bağlıysa, boşanmak zorunda kalırdı ve hükmünü evliliği feshetmek olurdu, bu da evliliğin sona erdirilmesidir' {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13605}. Hukukçular, 'lizum'u yükümlülük ve yükümlülük anlamına gelir ve sözleşmelerde iptalin kabul edilemezliğini ifade eder {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13609}."
  id: "Dalam bahasa, 'lizum' adalah kata benda verbal 'yizmazm,' yang berarti dia bersama sesuatu dan tidak meninggalkannya; 'jika dia berkomitmen pada sesuatu dan tidak meninggalkannya; jika dia berkomitmen pada uang, dia menjadi wajib bercerai, dan keputusannya adalah membubarkan pernikahan, yang berarti pemisahan pernikahan' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13605}. Para ahli hukum menggunakan 'lizum' untuk berarti kewajiban dan kewajiban, dan untuk berarti ketidakbolehan pembatalan dalam kontrak {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13609}."
