id: concept/luzum-fiqh
class: concept
kind: legal
label:
  ar: "اللُّزُوم"
  en: "Binding force (luzum), fiqh and usul rulings"
  ur: "لزوم (فقہی و اصولی احکام)"
summary:
  ar: "اللزوم في اللغة مصدر لزِم يلزَم، أي كان مع الشيء فلم يفارقه، والتزمه اعتنقه، ولزمه المال وجب عليه، ولزمه الطلاق وجب حكمه وهو قطع الزوجية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605}. ويستعمل الفقهاء اللزوم بمعنى الوجوب والتحتم، وبمعنى عدم جواز الفسخ في العقود {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13609}."
  en: "Luzum, in lexicon, is staying with a thing and not parting from it; to be bound by money is to owe it, and divorce binds when its ruling takes effect, which is the ending of marriage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605}. Jurists use luzum to mean obligation and necessity, and in contracts, the impossibility of rescission {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13609}."
  ur: "لزوم لغت میں کسی چیز کے ساتھ رہنا اور اسے نہ چھوڑنا ہے؛ مال کا لزوم ہونا یعنی اس کا واجب ہونا، اور طلاق کا لزوم یعنی اس کا حکم جاری ہونا، جو نکاح کا ختم ہونا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605}۔ فقہاء لزوم کو واجب اور لازمی ہونے کے معنی میں اور عقود میں فسخ کے ناجائز ہونے کے معنی میں استعمال کرتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13609}۔"
