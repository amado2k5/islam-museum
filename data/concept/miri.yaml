summary:
  ar: "المري في الكتاب حار يابس إلى الثالثة، يجلو الأخلاط الغليظة ويليّن وينشف، وفيه قبض وتنقية للبلغم، وينفع من القروح العفنة ووجع الورك وعرق النسا ويقع في أدوية القولنج {cite:canon-ibn-sina-print-v1 p.573}."
  en: "Miri, a fermented condiment, is in the book hot and dry to the third degree, cleansing thick humours, softening and drying, with astringency and a clearing of phlegm; it helps putrid ulcers, pain of the hip and sciatica, and enters the remedies for colic {cite:canon-ibn-sina-print-v1 p.573}."
  ur: "مری کتاب میں تیسرے درجے تک گرم خشک ہے، گاڑھے اخلاط کو جلا دیتی، نرم کرتی اور خشک کرتی ہے، اس میں قبض اور بلغم کی صفائی ہے؛ سڑے ہوئے زخموں، کولہے کے درد اور عرق النسا میں مفید ہے اور قولنج کی دواؤں میں شامل ہوتی ہے {cite:canon-ibn-sina-print-v1 p.573}۔"
