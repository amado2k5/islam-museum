  ur: "شوکران"
summary:
  ar: "الشوكران في الكتاب نبات له ساق ذو عقد مثل ساق الرازيانج وورق ثقيل الرائحة وزهر أبيض وبزر شبيه بالأنيسون، وهو أحد الأدوية القتالة ويقتل بالبرد، ويذكر المؤلف اختلاف الناس فيه إذ ترجم قوبيون بالشوكران وبالبيش، بارد يابس في الثالثة إلى الرابعة، يمنع نزف الدم، وعصارته تسكن الجمرة والنملة وتنفع النقرس الحار، وهو سم قاتل وعلاجه شرب الشراب الصرف، ويذكر الكتاب نقلا موسوما أثره في الرحم والاحتلام {cite:canon-ibn-sina-print-v1 pp.674-675}"
  en: "Shawkaran is in the book a plant with a jointed stem like the stem of razyanaj, a heavy-smelling leaf, a white flower and a seed like anisun; it is one of the deadly drugs and kills by cold; the author notes the disagreement of people about it, since qubiyun was translated by shawkaran and also by bish; it is cold and dry in the third degree to the fourth and prevents the flow of blood; its juice soothes carbuncle and namla and benefits hot gout; it is a deadly poison and its treatment, the book says, is the drinking of the pure drink (al-sharab al-sirf); and the book lists, as a labelled report, its effect on the womb and on nocturnal emission {cite:canon-ibn-sina-print-v1 pp.674-675}"
  ur: "شوکران کتاب میں ایک پودا ہے جس کا تنا رازیانج کے تنے کی طرح گرہ دار ہے، پتا بھاری بو والا، پھول سفید اور بیج انیسون سے مشابہ؛ یہ مہلک دواؤں میں سے ایک ہے اور ٹھنڈک سے مارتا ہے؛ مصنف لوگوں کے اختلاف کا ذکر کرتا ہے کیونکہ قوبیون کا ترجمہ شوکران اور بیش دونوں سے کیا گیا؛ تیسرے درجے سے چوتھے تک ٹھنڈا خشک ہے اور خون کے بہاؤ کو روکتا ہے؛ اس کا رس جمرہ اور نملہ کو سکون دیتا اور گرم نقرس میں نافع ہے؛ یہ مہلک زہر ہے اور کتاب کے مطابق اس کا علاج خالص مشروب ⁦(الشراب الصرف)⁩ پینا ہے؛ اور کتاب منقول فہرست کے طور پر رحم اور احتلام پر اس کا اثر درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.674-675}۔"
