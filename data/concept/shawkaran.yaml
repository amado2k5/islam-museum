summary:
  ar: "الشوكران في الكتاب نبات له ساق ذو عقد مثل ساق الرازيانج وورق ثقيل الرائحة وزهر أبيض وبزر شبيه بالأنيسون، وهو أحد الأدوية القتالة ويقتل بالبرد، ويذكر المؤلف اختلاف الناس فيه إذ ترجم قوبيون بالشوكران وبالبيش، بارد يابس في الثالثة إلى الرابعة، يمنع نزف الدم، وعصارته تسكن الجمرة والنملة وتنفع النقرس الحار، وهو سم قاتل وعلاجه شرب الشراب الصرف، ويذكر الكتاب نقلا موسوما أثره في الرحم والاحتلام {cite:canon-ibn-sina-print-v1 pp.674-675}"
  en: "Shawkaran is in the book a plant with a jointed stem like the stem of razyanaj, a heavy-smelling leaf, a white flower and a seed like anisun; it is one of the deadly drugs and kills by cold; the author notes the disagreement of people about it, since qubiyun was translated by shawkaran and also by bish; it is cold and dry in the third degree to the fourth and prevents the flow of blood; its juice soothes carbuncle and namla and benefits hot gout; it is a deadly poison and its treatment, the book says, is the drinking of the pure drink (al-sharab al-sirf); and the book lists, as a labelled report, its effect on the womb and on nocturnal emission {cite:canon-ibn-sina-print-v1 pp.674-675}"
  ur: "شوکران کتاب میں ایک پودا ہے جس کا تنا رازیانج کے تنے کی طرح گرہ دار ہے، پتا بھاری بو والا، پھول سفید اور بیج انیسون سے مشابہ؛ یہ مہلک دواؤں میں سے ایک ہے اور ٹھنڈک سے مارتا ہے؛ مصنف لوگوں کے اختلاف کا ذکر کرتا ہے کیونکہ قوبیون کا ترجمہ شوکران اور بیش دونوں سے کیا گیا؛ تیسرے درجے سے چوتھے تک ٹھنڈا خشک ہے اور خون کے بہاؤ کو روکتا ہے؛ اس کا رس جمرہ اور نملہ کو سکون دیتا اور گرم نقرس میں نافع ہے؛ یہ مہلک زہر ہے اور کتاب کے مطابق اس کا علاج خالص مشروب ⁦(الشراب الصرف)⁩ پینا ہے؛ اور کتاب منقول فہرست کے طور پر رحم اور احتلام پر اس کا اثر درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.674-675}۔"
  es: "Shawkaran es en el libro una planta con un tallo articulado como el tallo de razyanaj, una hoja de olor fuerte, una flor blanca y una semilla como anisun; es una de las drogas mortales y mata por frío; el autor señala el desacuerdo de la gente al respecto, ya que qubiyun fue traducido por shawkaran y también por bish; es fría y seca de tercer a cuarto grado y previene el flujo de sangre; su jugo alivia el carbunco y la namla y beneficia la gota caliente; es un veneno mortal y su tratamiento, dice el libro, es beber la bebida pura (al-sharab al-sirf); y el libro enumera, como un informe etiquetado, su efecto en el útero y en la emisión nocturna {cite:canon-ibn-sina-print-v1 pp.674-675}"
  fr: "Le shawkaran est décrit dans le livre comme une plante à tige noueuse semblable à celle du razyanaj, aux feuilles odorantes, aux fleurs blanches et aux graines anisées. Il est considéré comme une drogue mortelle, agissant par le froid. L'auteur note les divergences d'opinions à son sujet, le qubiyun étant traduit par shawkaran et par bish. De nature froide et sèche, il provoque une coagulation sanguine. Son jus apaise les anthrax et les namlas et soulage la goutte. C'est un poison mortel, et son traitement, selon le livre, consiste à boire la boisson pure (al-sharab al-sirf). Le livre mentionne également, dans un rapport détaillé, ses effets sur l'utérus et les éjaculations nocturnes. {cite:canon-ibn-sina-print-v1 pp.674-675}"
  tr: "Kitapta hemlock, rasiang sapına benzeyen bir nodül, yoğun aromatik bir yaprağı, beyaz çiçekleri ve anasona benzeyen bir tohumu olan bir bitkidir. Soğuğu öldüren ölümcül bir ilaçtır. Yazar, Qubiyn'un onu 'hemlock' ve 'bilish' olarak çevirdiği, üçüncüden dördüncüye kadar 'soğuk, kuru' olarak çevirdiği, kanamayı önleyen, şarbon ve karıncaları yatıştıran ve sıcak guta iyi geldiği ölümcül bir zehirdir. Ölümcül bir zehirdir ve tedavisi saf içecek içmektir. Kitapta, rahim ve ıslak rüya üzerindeki etkisi olan bir anlatımdan bahsedilir {cite:canon-ibn-sina-print-v1 s.674-675}"
  id: "Dalam buku ini, hemlock adalah tanaman dengan batang dengan benjolan seperti batang rasiang, daun aromatik yang berat, bunga putih, dan biji yang menyerupai adas manis. Ini adalah obat mematikan yang membunuh dingin. Penulis menyebutkan perbedaan di antara orang-orang tentang tanaman ini, karena Qubiyon menerjemahkannya sebagai 'hemlock' dan 'bilish', 'dingin, kering' dari yang ketiga hingga keempat, mencegah pendarahan, jusnya menenangkan antraks dan semut, serta bermanfaat untuk asam urat panas. Ini adalah racun mematikan dan pengobatannya adalah minum minuman murni. Buku ini menyebutkan sebuah narasi yang efeknya pada rahim dan mimpi basah {cite:canon-ibn-sina-print-v1 hlm.674-675}"
