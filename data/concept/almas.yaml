summary:
  ar: "حجر الماس، شديد الجلاء، وعدّه الكتاب من السموم القاتلة. نقل الكتاب عن قوم أنه يكسر الأسنان إذا أُمسك في الفم، وقولهم هذا يردّه، كما نقل قوماً آخرين قالوا إنه يفتّت الحصاة إذا أُوصل إلى المثانة، وهذا مما يستبعده الكتاب {cite:canon-ibn-sina-print-v1 p.372} {cite:canon-ibn-sina-print-v1 p.373}."
  en: "The stone called almas, a very strong polisher, which the book counts among deadly poisons. The book reports that some say it breaks teeth if held in the mouth, and it rejects that claim; it also reports that others say it breaks a stone if carried to the bladder, which the book finds improbable {cite:canon-ibn-sina-print-v1 p.372} {cite:canon-ibn-sina-print-v1 p.373}."
  fr: "La pierre appelée almas, abrasif très puissant que l’ouvrage compte parmi les poisons mortels. Celui-ci rapporte que, selon certains, elle brise les dents quand on la garde en bouche, ce qu’il rejette. D’autres disent qu’elle brise un calcul si on la porte jusqu’à la vessie, ce qu’il juge peu vraisemblable {cite:canon-ibn-sina-print-v1 p.372} {cite:canon-ibn-sina-print-v1 p.373}."
  ur: "پتھر الماس، جو نہایت تیز جلا دینے والا ہے۔ کتاب اسے مہلک زہروں میں شمار کرتی ہے۔ کتاب نقل کرتی ہے کہ بعض لوگ کہتے ہیں یہ منہ میں رکھنے سے دانت توڑ دیتا ہے، جسے کتاب رد کرتی ہے؛ اور کچھ لوگوں کے مطابق یہ مثانے تک پہنچے تو پتھری توڑ دیتا ہے، جسے کتاب بعید سمجھتی ہے {cite:canon-ibn-sina-print-v1 p.372} {cite:canon-ibn-sina-print-v1 p.373}۔"
  es: "La piedra llamada almas, un pulidor muy potente, que el libro incluye entre los venenos mortales. El libro informa que algunos dicen que rompe los dientes si se sostiene en la boca, y rechaza esa afirmación; también informa que otros dicen que rompe un cálculo si se lleva a la vejiga, lo cual el libro considera improbable {cite:canon-ibn-sina-print-v1 p.372} {cite:canon-ibn-sina-print-v1 p.373}."
  tr: "Bir elmas taş, oldukça belirgindir ve kitap onu ölümcül zehirlerden biri olarak kabul eder. Kitap, bazılarına göre ağızda tutulduğunda dişleri kırar, bazıları ise taşı mesaneye ulaştığında kırdığını belirtir; kitap bunu hariç tutar {cite:canon-ibn-sina-print-v1 s.372} {cite:canon-ibn-sina-print-v1 s.373} {cite:canon-ibn-sina-print-v1 s.373}"
  id: "Bir elmas taş, oldukça belirgindir ve kitap onu ölümcül zehirlerden biri olarak kabul eder. Kitap, bazılarına göre ağızda tutulduğunda dişleri kırar, bazıları ise taşı mesaneye ulaştığında kırdığını belirtir; kitap bunu hariç tutar {cite:canon-ibn-sina-print-v1 s.372} {cite:canon-ibn-sina-print-v1 s.373} {cite:canon-ibn-sina-print-v1 s.373}"
