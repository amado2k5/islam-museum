id: concept/almas
class: concept
kind: natural
label:
  ar: "الماس"
  en: "Almas (diamond)"
  ur: "الماس ⁦(ہیرا)⁩"
summary:
  ar: "حجر الماس، شديد الجلاء، وعدّه الكتاب من السموم القاتلة. نقل الكتاب عن قوم أنه يكسر الأسنان إذا أُمسك في الفم، وقولهم هذا يردّه، كما نقل قوماً آخرين قالوا إنه يفتّت الحصاة إذا أُوصل إلى المثانة، وهذا مما يستبعده الكتاب {cite:canon-ibn-sina-print-v1 p.372} {cite:canon-ibn-sina-print-v1 p.373}."
  en: "The stone called almas, a very strong polisher, which the book counts among deadly poisons. The book reports that some say it breaks teeth if held in the mouth, and it rejects that claim; it also reports that others say it breaks a stone if carried to the bladder, which the book finds improbable {cite:canon-ibn-sina-print-v1 p.372} {cite:canon-ibn-sina-print-v1 p.373}."
  ur: "پتھر الماس، جو نہایت تیز جلا دینے والا ہے۔ کتاب اسے مہلک زہروں میں شمار کرتی ہے۔ کتاب نقل کرتی ہے کہ بعض لوگ کہتے ہیں یہ منہ میں رکھنے سے دانت توڑ دیتا ہے، جسے کتاب رد کرتی ہے؛ اور کچھ لوگوں کے مطابق یہ مثانے تک پہنچے تو پتھری توڑ دیتا ہے، جسے کتاب بعید سمجھتی ہے {cite:canon-ibn-sina-print-v1 p.372} {cite:canon-ibn-sina-print-v1 p.373}۔"
