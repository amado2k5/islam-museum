summary:
  ar: "الشيطرج في الكتاب حار يابس في آخر الثانية، جال مقرح يشبه القردمانا في الطعم والرائحة والقوة، وينفع طلاؤه بالخل على البهق والبرص وعلى التقشر والجرب، ويشرب لوجع المفاصل فينفع نفعا بليغا، ويطلى على الطحال فيضمره، ويذكر أنه إذا علق أصله على أذن من به وجع المثانة سكنه فيما يقال، وبدله مثله فوة {cite:canon-ibn-sina-print-v1 p.672}"
  en: "Shitraj is in the book hot and dry at the end of the second degree, cleansing and ulcerating, resembling qardamana in taste, smell and power; smeared with vinegar it benefits bahaq and baras, and peeling and scab; it is drunk for pain of the joints and benefits greatly, smeared on the spleen it wastes it, and, it is said, its root hung on the ear of one with bladder pain soothes it; its substitute is fuwwa {cite:canon-ibn-sina-print-v1 p.672}"
  ur: "شیطرج کتاب میں دوسرے درجے کے آخر میں گرم خشک ہے، جلا دینے والا اور چھالے ڈالنے والا، ذائقے، بو اور قوت میں قردمانا سے مشابہ؛ سرکے کے ساتھ لگانے سے بہق اور برص، چھلکے اترنے اور خارش میں نافع ہے، جوڑوں کے درد کے لیے پیا جاتا ہے تو بہت نفع دیتا ہے، تلی پر لگایا جائے تو اسے گھلا دیتا ہے، اور جیسا کہ کہا جاتا ہے اس کی جڑ مثانے کے درد والے کے کان پر لٹکائی جائے تو درد کو سکون دیتی ہے؛ اور اس کا بدل فوہ ہے {cite:canon-ibn-sina-print-v1 p.672}۔"
  es: "Shitraj es en el libro caliente y seco al final del segundo grado, limpiador y ulcerante, semejante a qardamana en sabor, olor y poder; untado con vinagre beneficia a bahaq y baras, y a la descamación y costras; se bebe para el dolor de las articulaciones y es muy beneficioso, untado en el bazo lo debilita, y, se dice, su raíz colgada en la oreja de quien sufre dolor de vejiga lo alivia; su sustituto es fuwwa {cite:canon-ibn-sina-print-v1 p.672}"
  fr: "Le Shitraj est décrit dans le livre comme chaud et sec à la fin du deuxième degré, purifiant et ulcératif, ressemblant au qardamana par son goût, son odeur et son pouvoir; enduit de vinaigre, il est bénéfique pour le bahaq et le baras, ainsi que pour la desquamation et les croûtes; il est bu pour les douleurs articulaires et est très bénéfique, enduit sur la rate, il la détériore, et, dit-on, sa racine suspendue à l'oreille d'une personne souffrant de douleurs à la vessie l'apaise; son substitut est le fuwwa {cite:canon-ibn-sina-print-v1 p.672}"
  tr: "Kitaptaki satranç ikinci sınıfın sonunda sıcak ve kuru, tat, koku ve güç bakımından maymunu andıran ağrılı bir yaradır. Sirke ile kaplanması vitiligo, cüzzam, soyulma ve uyuz için faydalıdır. Eklem ağrısı için içilir ve çok faydalıdır. Dalak üzerine süsleme için kaplanır. Kökü mesane ağrısı olan birinin kulağına sarkarsa sakinleştiği ve benzer bir meme ile değiştirildiği belirtilir {cite:canon-ibn-sina-print-v1 s.672}"
  id: "Catur dalam buku ini panas dan kering di akhir catur kedua, luka yang sakit menyerupai monyet dalam rasa, bau, dan kekuatan. Pelapisannya dengan cuka bermanfaat untuk vitiligo, kusta, pengelupasan, dan kudis. Catur ini diminum untuk nyeri sendi dan sangat bermanfaat. Catur ini dilapisi limpa untuk menghiasnya. Disebutkan bahwa jika akarnya menggantung di telinga seseorang yang mengalami nyeri kandung kemih, dikatakan akan tenang, dan diganti dengan nosel serupa {cite:canon-ibn-sina-print-v1 hlm.672}"
