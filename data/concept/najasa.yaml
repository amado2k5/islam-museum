id: concept/najasa
class: concept
kind: legal
label: { ar: "النَّجَاسَة", en: "Impurity (najasa) and its rulings", ur: "نجاست (ناپاکی) اور اس کے احکام" }
summary:
  ar: "النجاسة في اللغة ما تنجس به الشيء وتلطخ بالقذر، وعرفها الشافعية بأنها مستقذر يمنع صحة الصلاة حيث لا مرخص، وعرفها المالكية بأنها صفة حكمية توجب منع استباحة الصلاة. والطهارة ضدها، والاستنجاء وسيلة لإزالتها عن السبيلين. والنجاسة حكمية أو عينية، وتزول الحكمية بالطهارة، وتزول العينية بإزالة عينها وطعمها وريحها. والآدمي الحي طاهر عند الفقهاء، وفي الميت خلاف: فالحنفية في عامة مشايخهم يرونه نجساً بالدم المسفوح، والمالكية والشافعية والحنابلة في الأظهر والصحيح يرونه طاهراً. والخنزير نجس عند الحنفية والشافعية والحنابلة، والكلب كذلك عند الشافعية، والمالكية يرون الحي طاهراً. والميتة نجسة إلا السمك والجراد عند جماعة، وميتة البحر طاهرة عند المالكية. وفي البول والروث والدم والقيح والقيء والمني والودي والمذي والدم المسفوح والعرق واللبن والإنفحة والبيض والصوف والشعر خلاف مفصل. ويتفاوت حكم النجاسة بين المغلظة والمخففة والمتوسطة، وفيها معفوات كثيرة. ويجب تطهير النجاسات من البدن والثوب والمكان، ويجوز نضح بول الصبي الذي لم يأكل وغسل بول الجارية، ولا يصح بيع النجس عند الشافعية، ويجوز الانتفاع بالنجس في بعض الوجوه عند المالكية، ومنع الحنابلة ذلك في الغالب، وتوقى النجاسة عن المساجد والمصاحف والطرق وموارد الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15538}"
  en: "Najasa in the lexicon is what makes a thing soiled with filth. The Shafi'is define it as a repugnant thing that prevents the prayer from being valid where no exception applies; the Malikis as a quality in judgement that makes the prayer unlawful. Purity is its opposite, and istinja is the means of removing it from the two passages. Najasa is either real (ayniyya, visible and removable) or legal (hukmiyya, removed by purification). The living human is pure in the view of the jurists. On the dead human the Hanafi majority hold that death makes the body impure through flowing blood, while the Malikis, Shafi'is and Hanbalis hold it pure. The pig is impure for the Hanafis, Shafi'is and Hanbalis; the dog likewise for the Shafi'is; the Malikis hold the living pig pure. Carrion is impure except the fish and locust by agreement of many, and the Malikis hold sea carrion pure. Many fluids and parts (urine, dung, blood, pus, vomit, semen, saliva, phlegm, milk, rennet, eggs, wool, hair, bone, horn, skin) are treated with detailed differences. Najasa is graded as heavy, light or middling, and many items are forgiven in practice. Purification is obligatory for the body, clothes and place of prayer; the child who has not eaten is sprinkled over his urine, the girl's urine washed. Shafi'is do not allow the sale of najis things; Hanafis permit some uses, Malikis allow many uses short of food for humans, Hanbalis forbid much of it. Najasa must be kept from mosques, copies of the Qur'an, roads and sources of water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15538}"
  ur: "نجاسہ وہ شے ہے جو طہارت کے منافی ہو۔ شافعیہ اور مالکیہ کی تعریف میں نماز کی صحت سے مانع ہونا شامل ہے۔ نجاست حقیقیہ اور حکمیہ میں تقسیم ہوتی ہے۔ زندہ انسان پاک ہے، میت کے بارے میں اختلاف ہے۔ خنزیر نجس ہے، کتے کے بارے میں شافعیہ کا یہی مؤقف ہے۔ پیشاب، پاخانہ، خون، پیپ، قے اور منی کے احکام تفصیل سے بیان ہوتے ہیں۔ نجاست کو مغلظہ، مخففہ اور متوسطہ میں تقسیم کیا گیا ہے، اور بہت سی چیزیں معفو عنہ ہیں۔ جس بچے نے کھانا نہ کھایا ہو اس کے پیشاب پر چھینٹے مارے جائیں، اور بچی کے پیشاب کو دھویا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15538}"
