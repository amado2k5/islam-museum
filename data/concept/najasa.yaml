label: { ar: "النَّجَاسَة", en: "Impurity (najasa) and its rulings", ur: "نجاست ⁦(ناپاکی)⁩ اور اس کے احکام", es: "La impureza (najasa) y sus normas", fr: "L'impureté (najasa) et ses règles", tr: "Safsızlık", id: "Ketidakmurnian" }
summary:
  ar: "النجاسة في اللغة ما تنجس به الشيء وتلطخ بالقذر، وعرفها الشافعية بأنها مستقذر يمنع صحة الصلاة حيث لا مرخص، وعرفها المالكية بأنها صفة حكمية توجب منع استباحة الصلاة. والطهارة ضدها، والاستنجاء وسيلة لإزالتها عن السبيلين. والنجاسة حكمية أو عينية، وتزول الحكمية بالطهارة، وتزول العينية بإزالة عينها وطعمها وريحها. والآدمي الحي طاهر عند الفقهاء، وفي الميت خلاف: فالحنفية في عامة مشايخهم يرونه نجساً بالدم المسفوح، والمالكية والشافعية والحنابلة في الأظهر والصحيح يرونه طاهراً. والخنزير نجس عند الحنفية والشافعية والحنابلة، والكلب كذلك عند الشافعية، والمالكية يرون الحي طاهراً. والميتة نجسة إلا السمك والجراد عند جماعة، وميتة البحر طاهرة عند المالكية. وفي البول والروث والدم والقيح والقيء والمني والودي والمذي والدم المسفوح والعرق واللبن والإنفحة والبيض والصوف والشعر خلاف مفصل. ويتفاوت حكم النجاسة بين المغلظة والمخففة والمتوسطة، وفيها معفوات كثيرة. ويجب تطهير النجاسات من البدن والثوب والمكان، ويجوز نضح بول الصبي الذي لم يأكل وغسل بول الجارية، ولا يصح بيع النجس عند الشافعية، ويجوز الانتفاع بالنجس في بعض الوجوه عند المالكية، ومنع الحنابلة ذلك في الغالب، وتوقى النجاسة عن المساجد والمصاحف والطرق وموارد الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15538}"
  en: "Najasa in the lexicon is what makes a thing soiled with filth. The Shafi'is define it as a repugnant thing that prevents the prayer from being valid where no exception applies; the Malikis as a quality in judgement that makes the prayer unlawful. Purity is its opposite, and istinja is the means of removing it from the two passages. Najasa is either real (ayniyya, visible and removable) or legal (hukmiyya, removed by purification). The living human is pure in the view of the jurists. On the dead human the Hanafi majority hold that death makes the body impure through flowing blood, while the Malikis, Shafi'is and Hanbalis hold it pure. The pig is impure for the Hanafis, Shafi'is and Hanbalis; the dog likewise for the Shafi'is; the Malikis hold the living pig pure. Carrion is impure except the fish and locust by agreement of many, and the Malikis hold sea carrion pure. Many fluids and parts (urine, dung, blood, pus, vomit, semen, saliva, phlegm, milk, rennet, eggs, wool, hair, bone, horn, skin) are treated with detailed differences. Najasa is graded as heavy, light or middling, and many items are forgiven in practice. Purification is obligatory for the body, clothes and place of prayer; the child who has not eaten is sprinkled over his urine, the girl's urine washed. Shafi'is do not allow the sale of najis things; Hanafis permit some uses, Malikis allow many uses short of food for humans, Hanbalis forbid much of it. Najasa must be kept from mosques, copies of the Qur'an, roads and sources of water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15538}"
  ur: "نجاسہ وہ شے ہے جو طہارت کے منافی ہو۔ شافعیہ اور مالکیہ کی تعریف میں نماز کی صحت سے مانع ہونا شامل ہے۔ نجاست حقیقیہ اور حکمیہ میں تقسیم ہوتی ہے۔ زندہ انسان پاک ہے، میت کے بارے میں اختلاف ہے۔ خنزیر نجس ہے، کتے کے بارے میں شافعیہ کا یہی مؤقف ہے۔ پیشاب، پاخانہ، خون، پیپ، قے اور منی کے احکام تفصیل سے بیان ہوتے ہیں۔ نجاست کو مغلظہ، مخففہ اور متوسطہ میں تقسیم کیا گیا ہے، اور بہت سی چیزیں معفو عنہ ہیں۔ جس بچے نے کھانا نہ کھایا ہو اس کے پیشاب پر چھینٹے مارے جائیں، اور بچی کے پیشاب کو دھویا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15538}"
  es: "En el léxico, najasa es aquello que contamina algo con inmundicia. Los shafiíes la definen como algo repugnante que impide la validez de la oración cuando no hay excepciones; los malikíes, como una cualidad que, según el juicio, la vuelve ilícita. La pureza es su opuesto, e istinja es el medio para eliminarla de ambos pasajes. Najasa puede ser real (ayniyya, visible y removible) o legal (hukmiyya, eliminada mediante la purificación). El ser humano vivo es puro según los juristas. Respecto al ser humano muerto, la mayoría hanafí sostiene que la muerte hace impuro el cuerpo por la sangre que fluye, mientras que los malikíes, shafiíes y hanbalíes lo consideran puro. El cerdo es impuro para los hanafíes, shafiíes y hanbalíes; el perro también para los shafiíes; los malikíes consideran puro al cerdo vivo. La carroña es impura, excepto el pescado y la langosta, según el consenso de muchos, y los malikíes consideran pura la carroña marina. Muchos fluidos y partes (orina, estiércol, sangre, pus, vómito, semen, saliva, flema, leche, cuajo, huevos, lana, cabello, hueso, cuerno, piel) se tratan con diferencias detalladas. La impureza se clasifica como grave, leve o moderada, y muchos elementos se perdonan en la práctica. La purificación es obligatoria para el cuerpo, la ropa y el lugar de oración; al niño que no ha comido se le rocía sobre su orina, y a la niña se le lava la orina. Los shafiíes no permiten la venta de cosas impuras; los hanafíes permiten algunos usos, los malikíes permiten muchos usos distintos a los de alimento para humanos, y los hanbalíes prohíben gran parte de ella. La impureza debe mantenerse alejada de las mezquitas, los ejemplares del Corán, los caminos y las fuentes de agua. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15520} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15523} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15527} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15531} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15535} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15538}"
  fr: "Dans le lexique, la najasa désigne ce qui souille une chose. Les chaféites la définissent comme une chose répugnante qui invalide la prière, sauf exception; les malikites, comme une qualité de jugement qui rend la prière illicite. La pureté est son contraire, et l’istinja, dans les deux écoles, est le moyen de la purifier. La najasa est soit réelle (ayniyya, visible et éliminable), soit légale (hukmiyya, éliminée par la purification). L’être humain vivant est pur aux yeux des juristes. Concernant l’être humain mort, la majorité hanafite considère que la mort rend le corps impur par le sang qui coule, tandis que les malikites, les chaféites et les hanbalites le considèrent pur. Le porc est impur pour les hanafites, les chaféites et les hanbalites; le chien également pour les chaféites; les malikites considèrent le porc vivant comme pur. La charogne est impure, à l’exception du poisson et de la sauterelle, de l’avis général, et les malikites considèrent la charogne marine comme pure. De nombreux fluides et parties du corps (urine, excréments, sang, pus, vomi, sperme, salive, mucosités, lait, présure, œufs, laine, cheveux, os, corne, peau) sont traités avec des distinctions précises. Le degré d'impureté (najasa) est classé comme élevé, faible ou moyen, et de nombreux objets sont tolérés en pratique. La purification est obligatoire pour le corps, les vêtements et le lieu de prière; l'enfant qui n'a pas mangé est aspergé de son urine, et l'urine de la fille est lavée. Les chaféites interdisent la vente d'objets impurs (najis); les hanafites en autorisent certains usages; les malikites en autorisent de nombreux usages, à l'exception de l'alimentation humaine; les hanbalites en interdisent la plupart. Il est impératif de préserver l'impureté des mosquées, des exemplaires du Coran, des routes et des sources d'eau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15538}"
  tr: "Dildeki kirlilik, bir şeyi arıttır ve onu kirle lekelendirir. Şafi'ler, bunu izin verilmediği yerlerde duanın geçerliliğini engelleyen 'mustaqti' (kirli) olarak tanımlarken, Malikiler bunu duanın izinliliğinin engellenmesini gerektiren yasal bir özellik olarak tanımlar. Saflık onun zıttıdır ve istinja onu iki yoldan çıkarmanın bir yoludur. Saflık ya yasal ya da özgüldür; yasal kirlilik arınma ile giderilir ve nesne gözü çıkarılarak giderilir, tat ve koku. Hukukçulara göre yaşayan insan saftır, ancak ölülerle ilgili bir fark vardır: Hanefiler, öğretmenlerinin çoğuna göre onu dökülen kanla kirli sayarken, Malikiler, Şafiiler ve Hanbaliler en açık ve gerçek olanlarla onu saf olarak görürler. Domuz, Hanefi, Şafii ve Hanbali'ye göre kirli sayılır ve köpek de Şafiiler tarafından saf sayılırken, Malikiler yaşayanları saf sayar. Bazı gruplara göre leş, balık ve çekirge hariç, Maliki okuluna göre deniz ürünleri saftır. İdrar, gübre, kan, irin, kusmuk, meni, vadi ve presidium, akan kan, ter, süt, puf, yumurta, yün ve saç konusunda ayrıntılı bir anlaşmazlık vardır. Kirlilik kararı kalın, hafif ve orta derecede değişir ve birçok muafiyet vardır. Kirler vücuttan, giysiden ve yerinden arındırılmalıdır. Bir köle kızın idrarını yememiş çocuğun idrarını yıkamak ve yıkamak caizdir. Şafii okuluna göre kirli satmak geçerli değildir. Maliki okuluna göre bazı durumlarda kirlilikten faydalanmak caizdir, ancak Hanbaliler genellikle bunu yasaklar. Camiler, Kur'anlar, yollar ve su kaynaklarından kirlilik kaçınılır. {alıntı:] fiqh-mawsua-kuwaitiyya-noor-v3 s.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15538}"
  id: "Kemurnian dalam bahasa adalah apa yang memurnikan sesuatu dan menodai dengan kotoran. Syhafi'i mendefinisikannya sebagai 'mustaqti' (najis) yang menghalangi keabsahan doa jika tidak ada izin, sementara Malikis mendefinisikannya sebagai atribut hukum yang mengharuskan mencegah diizinkan doa. Kemurnian adalah kebalikannya, dan istinja adalah cara untuk menghilangkannya dari dua jalan tersebut. Kemurnian bersifat legal atau spesifik, dan kemurnian hukum dihilangkan melalui penyucian, dan objek dihilangkan dengan menghilangkan mata, rasa, dan baunya. Manusia hidup dianggap suci menurut ahli hukum, tetapi ada perbedaan terkait orang mati: Hanafi, menurut sebagian besar guru mereka, menganggapnya tidak murni dengan darah yang tumpah, sementara Maliki, Shafi'i, dan Hanbal dalam pandangan yang paling nyata dan otentik melihatnya murni. Babi dianggap tidak murni menurut Hanafi, Shafi'i, dan Hanbali, dan anjing juga dianggap suci oleh Shafi'i, sementara Maliki menganggap yang hidup murni. Bangkai adalah najis kecuali ikan dan belalang menurut beberapa kelompok, dan makanan laut murni menurut mazhab Maliki. Ada perbedaan mendalam mengenai urin, kotoran, darah, nanah, muntah, semen, semen, wadi dan presidium, darah yang dibuang, keringat, susu, puffs, telur, wol, dan rambut. Aturan tentang ketidakmurnian bervariasi antara kasus tebal, ringan, dan sedang, dan terdapat banyak pengecualian. Kotoran harus dibersihkan dari tubuh, pakaian, dan tempat. Diperbolehkan membuang air kencing anak yang belum makan dan mencuci urin budak perempuan. Menjual najis tidak sah menurut mazhab Syafi'i. Diperbolehkan mendapatkan manfaat dari ketidakmurnian dalam beberapa kasus menurut mazhab Maliki, meskipun Hanbal umumnya melarang hal ini. Ketidakmurnian dihindari dari masjid, Al-Qur'an, jalan, dan sumber air. {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 p.15495} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15497} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15500} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15523} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15535} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15538}"
