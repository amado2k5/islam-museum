summary:
  ar: "شجرة ذات غلظ وشوك كثير، قشرها حريف وزهرها حار وعودها عفص، ويستعملها العطارون في بعض الأدهان. ينفع القروح الساعية والمتعفنة، ويفيد استرخاء العصب، وينفع نتن الأنف، وطبيخه يمنع نفث الدم ويسكّن النفخ، ويُذكر أنه يُخرج الجنين {cite:canon-ibn-sina-print-v1 p.433} {cite:canon-ibn-sina-print-v1 p.434}."
  en: "A thick tree with many thorns; its bark is pungent, its flower hot and its wood astringent. Used by herbalists in some oils. Helps spreading and putrid ulcers and the relaxation of the nerve; helps a foul nose; its decoction stops spitting blood and calms flatulence; the book also says it can expel a foetus {cite:canon-ibn-sina-print-v1 p.433} {cite:canon-ibn-sina-print-v1 p.434}."
  ur: "موٹے تنے والا درخت جس پر بہت کانٹے ہیں؛ اس کا چھلکا تیز، پھول گرم اور لکڑی قابض ہے، اور عطار بعض تیلوں میں استعمال کرتے ہیں۔ پھیلنے والے اور سڑے ہوئے زخموں اور عصب کی سستی میں مفید ہے؛ بدبودار ناک کے لیے نافع ہے؛ جوشاندہ خون تھوکنا روکتا ہے اور نفخ کو سکون دیتا ہے؛ کتاب کہتی ہے کہ یہ حمل گرا سکتا ہے {cite:canon-ibn-sina-print-v1 p.433} {cite:canon-ibn-sina-print-v1 p.434}۔"
  es: "Un árbol grueso con muchas espinas; su corteza es picante, su flor ardiente y su madera astringente. Utilizado por herbolarios en algunos aceites. Ayuda a extender úlceras purulentas y a relajar los nervios; ayuda con el mal aliento; su decocción detiene la hemorragia nasal y calma la flatulencia; el libro también dice que puede expulsar un feto {cite:canon-ibn-sina-print-v1 p.433} {cite:canon-ibn-sina-print-v1 p.434}."
  fr: "Arbre épais et épineux, à l'écorce âcre, à la fleur chaude et au bois astringent. Utilisé en phytothérapie dans certaines huiles. Il est réputé soulager les ulcères purulents et étendus, et favoriser la détente nerveuse; il est également efficace contre la mauvaise haleine; sa décoction arrête les crachats de sang et calme les flatulences; le livre mentionne aussi son pouvoir d'expulser un fœtus {cite:canon-ibn-sina-print-v1 p.433} {cite:canon-ibn-sina-print-v1 p.434}."
