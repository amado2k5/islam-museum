label:
  ar: "العَقِيق"
  en: "Al-Aqiq: the valley as a place of ihram and the carnelian stone in law (aqiq)"
  ur: "عقیق (وادی اور پتھر)"
summary:
  ar: "العقيق في اللغة الوادي الذي شقه السيل، وخرز أحمر يتخذ منه الفصوص، وله عدة مواضع تسمى بالعقيق في بلاد العرب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}. ويتعلق بالعقيق بمعنى الوادي حكم الإحرام، فنص الشافعية على أفضلية الإحرام منه لأهل المشرق، وقال المالكية والحنابلة إن ميقات أهل العراق ذات عرق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781}. ويتعلق بالعقيق بمعنى الحجر أحكام: فجمهور الفقهاء على عدم جواز التيمم به، وأجازه الحنفية لكونه من جنس الأرض، ولا زكاة فيه عند جمهور الفقهاء إلا للتجارة، وأوجبها الحنابلة فيه، ولا يجري فيه الربا، واختلف الفقهاء في السلم فيه، ويباح التزين به للرجل عند جمهور الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11782}."
  en: "In the lexicon, al-aqiq is a valley cut by a torrent and a red stone used for the settings of rings; several places in Arabia bear the name {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}. As the valley it matters for ihram: the Shafi'is prefer that people of the east begin ihram from it, while the Malikis and Hanbalis hold that the station for the people of Iraq is Dhat 'Irq {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781}. As the stone, the majority do not allow tayammum with it, while the Hanafis allow it because it belongs to the kind of earth; the majority hold that it carries no zakat unless it is held for trade, while the Hanbalis require zakat on it; it is not subject to riba; the schools differ on advance sale of it; and most jurists allow men to wear it as an adornment {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11782}."
