label:
  ar: "العَقِيق"
  en: "Al-Aqiq: the valley as a place of ihram and the carnelian stone in law (aqiq)"
  fr: "Al-Aqiq : la vallée comme lieu d’ihram et la cornaline en droit (aqiq)"
  ur: "عقیق ⁦(وادی اور پتھر)⁩"
  es: "Al-Aqiq: el valle como lugar de ihram y la piedra cornalina en la ley (aqiq)"
  tr: "Akit"
  id: "Agate"
summary:
  ar: "العقيق في اللغة الوادي الذي شقه السيل، وخرز أحمر يتخذ منه الفصوص، وله عدة مواضع تسمى بالعقيق في بلاد العرب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}. ويتعلق بالعقيق بمعنى الوادي حكم الإحرام، فنص الشافعية على أفضلية الإحرام منه لأهل المشرق، وقال المالكية والحنابلة إن ميقات أهل العراق ذات عرق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781}. ويتعلق بالعقيق بمعنى الحجر أحكام: فجمهور الفقهاء على عدم جواز التيمم به، وأجازه الحنفية لكونه من جنس الأرض، ولا زكاة فيه عند جمهور الفقهاء إلا للتجارة، وأوجبها الحنابلة فيه، ولا يجري فيه الربا، واختلف الفقهاء في السلم فيه، ويباح التزين به للرجل عند جمهور الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11782}."
  en: "In the lexicon, al-aqiq is a valley cut by a torrent and a red stone used for the settings of rings; several places in Arabia bear the name {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}. As the valley it matters for ihram: the Shafi'is prefer that people of the east begin ihram from it, while the Malikis and Hanbalis hold that the station for the people of Iraq is Dhat 'Irq {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781}. As the stone, the majority do not allow tayammum with it, while the Hanafis allow it because it belongs to the kind of earth; the majority hold that it carries no zakat unless it is held for trade, while the Hanbalis require zakat on it; it is not subject to riba; the schools differ on advance sale of it; and most jurists allow men to wear it as an adornment {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11782}."
  fr: "Dans le lexique, al-aqiq désigne une vallée creusée par un torrent et une pierre rouge employée pour les chatons des bagues ; plusieurs lieux d’Arabie portent ce nom {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}. Comme vallée, elle importe pour l’ihram : les shafiites préfèrent que les gens de l’Orient y commencent l’ihram, tandis que les malikites et les hanbalites estiment que le lieu d’entrée des gens de l’Irak est Dhat 'Irq {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781}. Comme pierre, la majorité n’autorise pas le tayammum avec elle, tandis que les hanafites l’autorisent parce qu’elle appartient à la catégorie de la terre ; la majorité estime qu’elle n’est pas soumise à la zakat, sauf si elle est détenue pour le commerce, tandis que les hanbalites exigent la zakat sur elle ; elle n’est pas soumise au riba ; les écoles divergent sur sa vente à livraison différée ; et la plupart des juristes permettent aux hommes de la porter comme parure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11782}."
  es: "En el léxico, al-aqiq es un valle cortado por un torrente y una piedra roja utilizada para engastar anillos; varios lugares en Arabia llevan el nombre {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11780}. Como valle es importante para el ihram: los shafi'is prefieren que la gente del este comience el ihram desde allí, mientras que los malikíes y hanbalíes sostienen que la estación para la gente de Irak es Dhat 'Irq {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781}. Como piedra, la mayoría no permite tayammum con ella, mientras que los hanafíes lo permiten porque pertenece al tipo de tierra; la mayoría sostiene que no tiene zakat a menos que se tenga para comerciar, mientras que los hanbalíes requieren zakat sobre ella; no está sujeta a riba; las escuelas difieren sobre la venta anticipada de ella; y la mayoría de los juristas permiten que los hombres lo usen como adorno {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11782}."
  ur: "لغت میں العقیق ایک وادی ہے جسے ایک دھار سے کاٹا جاتا ہے اور ایک سرخ پتھر جو حلقوں کی ترتیب کے لیے استعمال ہوتا ہے۔ عرب میں کئی جگہوں کا نام ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11780}۔ وادی کے طور پر یہ احرام کے لیے اہمیت رکھتی ہے: شافعی اس بات کو ترجیح دیتے ہیں کہ مشرق کے لوگ اس سے احرام باندھیں، جب کہ مالکیہ اور حنبلیوں کا خیال ہے کہ عراق کے لوگوں کے لیے مقام \"ذات عرق\" ہے۔ پتھر کے طور پر، جمہور اس کے ساتھ تیمم کی اجازت نہیں دیتے، جبکہ احناف اس کی اجازت دیتے ہیں کیونکہ یہ زمین کی قسم سے تعلق رکھتا ہے۔ جمہور کا خیال ہے کہ اس میں زکوٰۃ نہیں ہوتی جب تک کہ اسے تجارت کے لیے نہ رکھا جائے، جبکہ حنبلی اس پر زکوٰۃ واجب کرتے ہیں۔ یہ سود کے تابع نہیں ہے۔ اسکولوں میں اس کی پیشگی فروخت پر اختلاف ہے۔ اور زیادہ تر فقہا مردوں کو اسے زینت کے طور پر پہننے کی اجازت دیتے ہیں {حوالہ: فقہ معسوۃ کویتیہ-نور-v3 صفحہ 11781}"
  tr: "Dilde 'akit', bir selin tarafından kesilmiş vadiyi ve kulaklarının yapıldığı kırmızı bir boncukla ifade eder. Arap topraklarında 'ak' olarak adlandırılan birkaç yeri vardır {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11780}. 'Akat' terimi vadi ve İhram üzerindeki hüküm anlamına gelir. Şafiiler, Doğu halkı için İhramın tercih edildiğini açıkça belirtmişlerdir. Malikler ve Haneliler, Irak halkının miqatının bir 'raq' olduğunu söylerler {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11781}. 'Akik' ile ilgili 'hac' anlamındaki hükümler şunlardır: Hukukçuların çoğunluğu tayammumun onunla birlikte izin verilmediği konusunda hemfikirdir ve Hanafiler bunun toprak türünden olduğu için izin vermiştir. Çoğu hukukçuya göre, zekat sadece ticaret için alınır ve Hanbalılar bunu zorunlu kılmıştır, ayrıca tefecilik uygulanmaz. Hukukçular onun güvenliği konusunda farklı görüşlere sahiptir ve çoğunluğuna göre bir insanın kendisini bu zekatıyla süslemesi izinlidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11782}."
  id: "Dalam bahasa ini, 'agate' merujuk pada lembah yang terpotong oleh banjir, dan sebuah manik-manik merah dari mana telinga dibuat. Di tanah Arab terdapat beberapa tempat yang disebut 'agate' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11780}. Istilah 'agate' berarti lembah dan aturan di Ihram. Para Syafi'i secara eksplisit menyatakan bahwa Ihram lebih disukai oleh orang-orang Timur. Umat Malik dan Hanbal mengatakan bahwa miqat rakyat Irak memiliki 'raq' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11781}. Putusan yang berkaitan dengan 'aqiq' dalam arti 'haji' adalah: mayoritas ahli hukum setuju bahwa tayammum tidak diperbolehkan dengan itu, dan Hanafi mengizinkannya karena itu jenis tanah. Menurut mayoritas ahli hukum, zakat tidak dikenakan atas zakat kecuali untuk perdagangan, dan Hanbal telah mewajibkannya untuk itu, dan riba tidak berlaku. Para ahli hukum berbeda pendapat mengenai keamanannya, dan diperbolehkan bagi seseorang untuk menghias dirinya dengan itu menurut kebanyakan ahli hukum {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11782}."
