id: concept/canon-giving-a-strong-emetic-such-as-hellebore
class: concept
kind: scientific
label:
  ar: "سقي المقيئ القوي كالخربق وتدبير القيء عند ابن سينا"
  en: "Giving a strong emetic such as hellebore in the Canon"
  fr: "Émétique puissant comme l’hellébore dans le Canon"
  ur: "قانون میں خربق جیسی قوی قے آور دوا دینے کی تدبیر"
  es: "Administrar un emético fuerte como el eléboro en el Canon"
summary:
  ar: "يذكر ابن سينا أن المقيئ القوي كالخربق يُسقى على الريق إن لم يكن مانع، بعد ساعتين من النهار وبعد إخراج الثفل من المعي، وأن يُحرَّك القيء بالريشة، وإلا أُدخل الحمام، وأن يُعان على الغثيان بتسخين المعدة والأطراف، وأن يُسكَّن الدواء إن أسرع {cite:canon-ibn-sina-print-v1 p.286}."
  en: "Ibn Sina says a strong emetic such as hellebore is given on an empty stomach if nothing forbids, two hours into the day and after the dregs are cleared from the gut; the vomiting is helped with a feather, otherwise the bath, and if the drug acts too fast the patient is calmed {cite:canon-ibn-sina-print-v1 p.286}."
  fr: "Ibn Sina décrit l’émétique fort à jeun sauf empêchement, à la deuxième heure du jour après nettoyage intestinal ; plume puis bain pour aider le vomissement, apaisement si action trop rapide {cite:canon-ibn-sina-print-v1 p.286}."
  es: "Ibn Sina dice que un emético fuerte como el eléboro se administra con el estómago vacío si no hay contraindicaciones, dos horas después de haber comenzado el día y una vez que se hayan eliminado los restos del intestino; el vómito se ayuda con una pluma, de lo contrario con un baño, y si el medicamento actúa demasiado rápido se calma al paciente {cite:canon-ibn-sina-print-v1 p.286}."
