label: { ar: "سقي المقيئ القوي كالخربق وتدبير القيء عند ابن سينا", en: "Giving a strong emetic such as hellebore in the Canon", ur: "قانون میں خربق جیسی قوی قے آور دوا دینے کی تدبیر" }
summary:
  ar: "يذكر ابن سينا أن المقيئ القوي كالخربق يُسقى على الريق إن لم يكن مانع، بعد ساعتين من النهار وبعد إخراج الثفل من المعي، وأن يُحرَّك القيء بالريشة، وإلا أُدخل الحمام، وأن يُعان على الغثيان بتسخين المعدة والأطراف، وأن يُسكَّن الدواء إن أسرع {cite:canon-ibn-sina-print-v1 p.286}."
  en: "Ibn Sina says a strong emetic such as hellebore is given on an empty stomach if nothing forbids, two hours into the day and after the dregs are cleared from the gut; the vomiting is helped with a feather, otherwise the bath, and if the drug acts too fast the patient is calmed {cite:canon-ibn-sina-print-v1 p.286}."
