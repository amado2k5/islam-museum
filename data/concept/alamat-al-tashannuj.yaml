  ar: "علامات التشنج"
  en: "Signs of convulsion"
  fr: "Signes des convulsions"
  ur: "تشنج کی علامات"
summary:
  ar: "نبض المتشنجين متمدد مختلف في الموضع يصعد وينزل كسهام تنقلب من قوس رام، وتختلف حركات نقراته في السرعة والبطء، ويكون العرق حاراً أسخن من سائر الأعضاء، وجرم العرق مجتمعاً كاجتماع العرق في النافض {cite:canon-ibn-sina-print-v2 p.145}"
  en: "The convulsed man's pulse is elongated, varying in place, rising and falling like arrows turned from an archer's bow, the motions of its beats differing in speed and slowness; the vessel is hot, warmer than the other organs, and the vessel's bulk gathered as the vessel gathers in the shivering fit {cite:canon-ibn-sina-print-v2 p.145}"
  fr: "Le pouls du malade pris de convulsions est allongé, varie de place, monte et descend comme des flèches décochées par un arc ; ses battements sont plus ou moins rapides. Le vaisseau est chaud, plus chaud que les autres organes, et il se ramasse comme dans un accès de frissons {cite:canon-ibn-sina-print-v2 p.145}."
  ur: "متشنج کی نبض تمدد یافتہ، مقام میں مختلف، اوپر نیچے ہوتی ہوئی ہوتی ہے جیسے کماندار کی کمان سے پلٹے ہوئے تیر، اور اس کی نگرتوں کی حرکتیں تیزی اور سستی میں مختلف ہوتی ہیں، اور رگ گرم ہوتی ہے باقی اعضا سے زیادہ تپتی ہوئی، اور رگ کا جرم مجتمع ہوتا ہے جیسے نافض میں رگ مجتمع ہوتی ہے {cite:canon-ibn-sina-print-v2 p.145}۔"
