id: concept/wakala-fiqh
class: concept
kind: legal
label:
  ar: "وَكالة"
  en: "Wakala (agency, fiqh)"
summary:
  ar: "الوكالة بالفتح والكسر في اللغة الحفظ، ومنه الوكيل في أسماء الله بمعنى الحافظ، ومنه التوكل، والتوكيل تفويض التصرف إلى الغير، وسُمّي الوكيل وكيلاً لأن موكّله فوّض إليه القيام بأمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} وفي الاصطلاح تعددت التعريفات: فعرّفها الحنفية بأنها إقامة الغير مقام نفسه في تصرف جائز معلوم، ترفّهاً أو عجزاً؛ وعرّفها المالكية بأنها نيابة ذي حق، غير ذي إمرة ولا عبادة، لغيره فيه غير مشروطة بموته؛ وعرّفها الشافعية بأنها تفويض شخص ما له فعله مما يقبل النيابة إلى غيره ليفعله في حياته؛ وعرّفها الحنابلة بأنها استنابة جائز التصرف مثله فيما تدخله النيابة من حقوق الله وحقوق الآدميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nيفرّق الكتاب بين الوكالة وألفاظ قريبة منها: النيابة، وهي قيام الإنسان عن غيره بفعل أمر، وهي عند بعضهم أعم من الوكالة، وعند آخرين مترادفة؛ والولاية، وهي تنفيذ القول على الغير شاء أو أبى، وهي نيابة شرعية أو إجبارية، بينما الوكالة نيابة اتفاقية؛ والإيصاء، وهو إقامة الإنسان غيره مقام نفسه في التصرف بعد الموت، بينما الوكالة في الحياة؛ والقوامة، وهي ولاية يفوضها القاضي إلى راشد للتصرف لمصلحة القاصر، أو ولاية الزوج على زوجته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nاتفق الفقهاء على مشروعية الوكالة، واستدلوا عليها بالقرآن: بقصة أصحاب الكهف في بعث أحدهم بورقهم إلى المدينة، وبآية الحكمين في سورة النساء، والحكم وكيل عن الزوجين على رأي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} وبالسنة: حديث عروة بن أبي الجعد البارقي الذي أعطاه النبي ديناراً ليشتري به شاة، وحديث حكيم بن حزام في شراء الأضحية، وحديث جابر في الوكيل بخيبر، وحديث أبي رافع في زواج النبي بميمونة وكان الرسول بينهما؛ وأجمع الفقهاء على جوازها من عصر النبي إلى اليوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} واستدلوا بالمعقول، وهو أن الحاجة داعية إليها، لأن الإنسان قد يعجز عن المباشرة بنفسه لمرض أو كبر أو وجاهة، فلو لم تجز لوقع الحرج المنفيّ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nأركان الوكالة. يرى جمهور الفقهاء أنها الصيغة والعاقدان (الموكل والوكيل) ومحل العقد (الموكل فيه)، ويرى الحنفية أن ركنها الإيجاب والقبول، لأن وجودهما يستلزم الركنين الآخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} والصيغة هي الإيجاب والقبول، يُعبّر بهما عن التراضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nالإيجاب. يرى الجمهور أنه ما يصدر من الموكل ويدل على إذنه بالتوكيل، ويرى الحنفية أنه ما صدر أولاً من أحد المتعاقدين للدلالة على رغبته في إنشاء العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} ويتحقق بكل ما يدل على الرضا بالوكالة، باللفظ أو الكتابة أو الرسالة أو إشارة الأخرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} فمن اللفظ الصريح: وكلتك، أو فوضت إليك، أو أنبتك، أو أذنت لك، أو أقمتك مقامي، أو أنت وكيلي؛ وأما الأمر كقوله بعه، فيصح عند الحنفية والشافعية والحنابلة، وعند المالكية إذا جرى العرف به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} أما ألفاظ «سأوكلك» و«أوكلك» و«قد عولت عليك» و«قد اعتمدت عليك» فلا تنعقد بها الوكالة عند الشافعية لاحتمالها، إلا أن يُضم إليها لفظ صريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nوتنعقد الوكالة بالرسالة عند الحنفية والمالكية والشافعية، ويكون الوكيل وكيلاً متى بلغه الخبر وقبل، سواء كان المخبر عادلاً أو غير عادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} ويتحقق الإيجاب بالكتابة المستبينة، وبالإشارة المفهومة من الأخرس، وبالفعل الدال على الإذن عند الحنابلة، وبما جرت العادة باعتباره إيجاباً عند المالكية، كتصرف الزوج في مال زوجته وهي عالمة ساكتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} ولا يكون السكوت إيجاباً عند الحنفية والشافعية والحنابلة؛ فمن رأى أجنبياً يبيع ماله فسكت لم يصبح وكيلاً بسكوته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nالقبول. يتحقق باللفظ، كأن يقول الوكيل قبلت، أو بكلام يشعر بالقبول؛ وزاد الحنفية والشافعية أنه لا بد ألا يرده الوكيل، فإن رده بعد الإيجاب لم تنعقد الوكالة وإن قبل بعد ذلك، ما لم يجدد الإيجاب والقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} وفي القبول بالفعل ثلاثة آراء: الجمهور (الحنفية والمالكية والشافعية في أصح الوجهين والحنابلة) يرون أنه يتحقق بكل فعل دال عليه، كفعل الوكيل ما أمره به الموكل؛ والشافعية في وجه والحنابلة في قول وزفر من الحنفية يرونه لا يتحقق إلا باللفظ؛ والشافعية في وجه ثالث يفرّقون: إن كانت صيغة الإيجاب أمراً كقوله «بع واشترِ» تحقق القبول بالفعل، وإن كانت صيغة عقد كـ«وكلتك» فلا بد من اللفظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} ويصح القبول بالكتابة المستبينة المعنونة، وبإشارة الأخرس المعلومة، وعند الحنفية يكون سكوت الوكيل قبولاً ويرتد برده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nوإذا تراخى القبول عن الإيجاب، فجمهور الفقهاء (الحنفية والحنابلة والشافعية في المذهب والمالكية في أحد القولين) يصححونه، لأن الإذن قائم ما لم يرجع عنه الموكل، فأشبه الإباحة؛ وقيّد الشافعية ذلك بألا يتعين زمان العمل، فإن تعين وخيف فواته كان القبول على الفور، وكذا إذا عرضه الحاكم عليه عند ثبوتها عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وذهب المالكية في القول الثاني وأبو حامد المروروذي من الشافعية إلى أن القبول على الفور، لأن الوكالة عقد في حال الحياة فيكون القبول فيه على الفور كالبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وقال المازري إن التحقيق يرجع إلى القصد والعوائد: هل المراد من هذه الألفاظ استدعاء الجواب فوراً، أم معجلاً أو مؤجلاً؟ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nأقسام صيغة الوكالة بحسب وقت ترتّب آثارها: المنجّزة، وهي ألا تكون معلقة بشرط ولا مضافة إلى وقت، والمعلقة، والمضافة إلى المستقبل، والموقتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nالصيغة المنجزة، وهي ألا تُعلّق بشرط ولا تُضاف إلى وقت، كقول الموكل «وكّلتك ببيع الدار الفلانية»، وهي صحيحة باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nالصيغة المعلقة على شرط. اختلف الفقهاء في صحتها على رأيين. الأول، للحنفية والحنابلة على الصحيح عندهم وللشافعية في مقابل الأصح، أنها صحيحة، كقول «إذا قدم الحاج فبع هذا الطعام»، واستدلوا بحديث ابن عمر في إمرة زيد بن حارثة في غزوة مؤتة، ثم جعفر، ثم عبد الله بن رواحة إن قُتل من قبله، ولأنه عقد اعتبر في حق الوكيل حكمه وهو إباحة التصرف، فهو أشبه بالوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} والثاني، للشافعية في الأصح وللحنابلة في قول، أنها فاسدة؛ قال الماوردي إن تعليق الوكالة بالشروط والآجال فاسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} وأجاز الشافعية أن ينجز الموكل الوكالة ويشترط للتصرف شرطاً، كقوله «بعها بعد شهر»، لأن ذلك تأخير لا تعليق؛ ونقل الغزالي عن العراقيين أن قدوم فلان أو مضي شهر شرط للتصرف لا للعقد فيجب على الوكيل الامتثال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nالصيغة الدورية، وصورتها أن يقول الموكل «وكّلتك ببيع هذا المال، وكلما عزلتك فأنت وكيلي»، فتتجدد الوكالة كلما عُزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} وصحّحها الحنفية والحنابلة على الصحيح، بناءً على أن الوكالة تقبل التعليق، ويملك الموكل عزل الوكيل متى شاء عند الحنفية؛ ويحصل العزل عند الحنابلة بقول الموكل «عزلتك، وكلما وكلتك فقد عزلتك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} ومنع ابن تيمية صحتها لأنها تجعل العقد الجائز لازماً، والمقصود من التعليق المنع من التوكيل لا فسخ عقد قبل انعقاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} وقال الشافعية في صحتها في الحال وجهان، أصحهما الصحة، فإن عزله ولم يعلم الوكيل أو علم، ففي عوده بعد العزل وجهان، أصحهما المنع؛ وإن قال «كلما عزلتك» تكرر العود أبداً، وإن قال «إذا» أو «متى» فمرة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المضافة إلى المستقبل، كقول الموكل «وكّلتك على أن تبيع دوابي في شهر رمضان» أو «وكّلتك في بيع هذه الدار غداً»، وقد أجازها الحنفية والحنابلة، ويُقرّ الحنفية أن الوكيل يصبح وكيلاً من الغد فما بعده لا قبله، ويوافقهم الشافعية لأن الوكالة نُجّزت في الحال وعُلّق التصرف على وقت في المستقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المعلقة على وقت، كقوله «إذا جاء رأس الشهر فقد وكّلتك في بيع داري»، وهي باطلة في الأصح عند الشافعية لأن تعليق الوكالة بالآجال فاسد، وصحيحة عند الحنفية والحنابلة والشافعية في مقابل الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} وفرّق الحنفية بين الإضافة والتعليق: فالمضاف سبب ينعقد به العقد في الحال مع تأخّر حكمه إلى الوقت، أما المعلّق ففيه مانع من أن يكون سبباً للحكم في الحال، فلا تنعقد الوكالة إلا عند وجود الشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المؤقتة، كقوله «أنت وكيلي شهراً»، وهي صحيحة عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} واختلفوا في بقائها بعد الوقت: فالشافعية لا تبقى بعده. وعند الحنفية روايتان فيمن وُكّل ببيع الدار «اليوم» فباعها غداً، فقيل الصحيح أنها لا تبقى، وقيل تبقى لأن ذكر اليوم للتعجيل لا للتوقيت؛ ونقل صاحب منحة الخالق عن البزازية أن الوكالة إلى عشرة أيام لا تنتهي بمضيّ العشرة في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}\n\nاقتران الوكالة بشرط. إن كان الشرط فاسداً، فذهب الحنفية وأحمد في أظهر روايتيه وابن أبي ليلى إلى أن الوكالة لا تبطل بأي شرط فاسد، وذهب الشافعية إلى أن الشرط الفاسد يُفسد الوكالة، كأن يقول الموكل «امنع المبيع من المشتري»، لأن منع الحق عمّن يستحق إثبات اليد عليه حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} وقال الزركشي إن العقود الجائزة كالشركة والوكالة والمضاربة، فاسدها لا يمنع نفوذ التصرف فيها بالإذن، لكن خصائصها تزول بفسادها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} وفائدة الفساد سقوط المسمى من الأجرة والرجوع إلى أجرة المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} ورأى بعض الحنابلة أن الوكالة تبطل كالوديعة لزوال الائتمان، وقال أبو محمد الشافعي إن الإذن ليس منفصلاً عن الوكالة فمعنى فسادها بطلان الإذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}\n\nصفة عقد الوكالة، أي هل هو لازم أو جائز. الرأي الأول، للحنفية والشافعية والحنابلة وبعض المالكية، أنها عقد جائز من الجانبين لأنها تبرّع لا لزوم فيه، فقد يرى الموكل المصلحة في ترك ما وكّل فيه أو في توكيل غيره، ولأن الوكيل قد لا يتفرغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} واستثنى الحنفية والمالكية ما إذا تعلّق بالوكالة حق الغير، فتلزم، كوكيل الخصومة بطلب الخصم، والوكيل ببيع الرهن في حضور المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} وقال الحنفية إن على عدم لزومها تتفرع ثلاث مسائل: لا يدخلها خيار الشرط، ولا يُحكم بالوكالة مقصودة، وللوكيل أن يستقيل منها متى أراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} الرأي الثاني، إن كانت بأجرة على سبيل الإجارة فهي لازمة من الطرفين، ويجب أن تجتمع فيها شرائط الإجارة، وبهذا صرح الشافعية والمالكية في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} الرأي الثالث، لبعض المتأخرين من المالكية، أنها لازمة من جانب الوكيل وإن كانت بغير أجرة، قياساً على لزوم الهبة وإن لم تُقبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} وإن كانت على سبيل الجعالة ففيها ثلاثة أقوال عند المالكية: اللزوم من الطرفين، والجواز من الطرفين وهو المعتمد عند الشافعية، واللزوم من جهة الجاعل دون المجعول له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nالركن الثاني: العاقدان، وهما الموكل والوكيل. أولاً: الموكل، وهو من يقيم غيره مقام نفسه في تصرف جائز معلوم، ويُشترط أن يملك ذلك التصرف وأن تلزمه أحكامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} واتفق الفقهاء على أنه لا تجوز الوكالة من المجنون والمعتوه والمغمى عليه والنائم والصبي غير المميز مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nيجوز توكيل الصبي المميز في التصرفات النافعة له نفعاً محضاً باتفاق، أما التصرفات الدائرة بين النفع والضرر فتصح عند الحنفية والمالكية والحنابلة بإذن الولي، وأبطلها الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} ولا تجوز الوكالة من السفيه المحجور عليه فيما لا يستقل به، ويجوز فيما يستقل به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nولا يجوز عند جمهور الفقهاء توكيل المرأة في النكاح، لأنها لا تزوج نفسها فلا توكل فيه، وأجازه الحنفية، وأجازه المالكية في بعض الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nوفي توكيل المرتد ثلاثة أقوال: الأول، لجمهور الفقهاء (الشافعية في أظهر الأقوال، والحنابلة، وأبي حنيفة)، أنها متوقفة على عودته إلى الإسلام، فإن أسلم نفذت، وإن مات أو قُتل أو لحق بدار الحرب مرتداً بطلت؛ والثاني، للصاحبين وللشافعية في قول، أنها صحيحة نافذة، وزاد الحنفية أن المرتدة يجوز توكيلها باتفاقهم؛ والثالث، للشافعية في قول استوجهه زكريا الأنصاري والشبراملسي، أنها باطلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nوفي توكيل المسلم الذمي في بيع الخمر والخنزير: ذهب الشافعية والمالكية والحنابلة والصاحبان إلى أنه لا يصح، لأن شرط الوكالة أن يملك الموكل التصرف الذي يوكّل فيه، والمسلم لا يملك بيعهما، وفاقد الشيء لا يعطيه؛ وذهب أبو حنيفة إلى الصحة، لأنه يكفي أن يكون للموكل أهلية أداء تخوّله توكيل الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nوفي توكيل المحرم لحلال في النكاح: لا يجوز عند جمهور الفقهاء لأنه لا يباشر العقد حال إحرام الموكل، وأجازه الحنفية مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} ونص الحنابلة على أنه لا تصح الوكالة إذا لم يعرف الوكيل موكله، بأن قيل له «وكّلك زيد» ولم يُنسب ولم يُوصف بما يميّزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nالوكيل. يشترط فيه ما يشترط في الموكل من العقل، فلا يجوز توكيل المجنون والمعتوه والصبي غير المميز باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} وفي اشتراط البلوغ: الحنفية والحنابلة أجازوا وكالة الصبي المميز الذي يعقل العقد ويقصده، وتعود حقوق العقد إلى الموكل لا إليه، وحجتهم أثر أن النبي زوّج أم سلمة بعمرو بن أم سلمة وكان صبياً؛ ومنعه الشافعية لأنه غير مكلف ولا يملك التصرف في حق نفسه فلا يملكه في حق غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} ويشترط أن يكون الوكيل معيناً، فإذا قال شخص «وكّلت أحد الناس في بيع سلعة» بطلت الوكالة لجهالة الوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} وذكر ابن نجيم أن قول الدائن لمدينه «من جاءك بعلامة كذا فادفع ما لي إليه» توكيل مجهول لا يصح، فلا يبرأ المدين بالدفع إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17739}\n\nعلم الوكيل بالوكالة. عند الحنفية العلم بالتوكيل في الجملة شرط، إما علم الوكيل وإما علم من يعامله؛ فلو باع الوكيل قبل علمه وعلم المشتري بالتوكيل لم يجز البيع حتى يجيزه الموكل أو الوكيل بعد العلم. وإذا أخبره بالوكالة عدل صار وكيلاً عند الإجماع، فإن أخبره واحد غير عدل فصدّقه صار وكيلاً، وإن لم يصدّقه فليس بوكيل عند أبي حنيفة، وهو وكيل عند أبي يوسف ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وذهب الحنابلة إلى عدم اشتراط العلم، لأن الاعتبار في العقود بما في نفس الأمر، وهو ما يؤخذ من الأظهر عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وعدالة الوكيل لا تشترط في الجملة، إلا في عقود معينة كالنكاح، وذكورته لا تشترط في الجملة إلا في بعض العقود كالنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}\n\nمحل الوكالة، وهو التصرف المأذون فيه من الموكل للوكيل بملك أو ولاية. وشرطه عند الشافعية ثلاثة: أن يكون معلوماً من بعض الوجوه، وأن يقبل النيابة، وأن يملكه الموكل حال التوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وتنقسم الوكالة باعتبار المحل إلى خاصة وعامة. فالخاصة ما كان فيها التوكيل بتصرف معين، ولا يتصرف الوكيل إلا فيه باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} والعامة، ففيها خلاف: الحنفية والمالكية يجيزونها في الجملة مع تفصيل، فقال الحنفية إن قوله «أنت وكيلي في كل قليل وكثير» وكالة بالحفظ فقط، وإن قال «في كل شيء جائز أمرك» صار وكيلاً في جميع التصرفات المالية كالبيع والشراء والهبة والصدقة، واختلفوا في الطلاق والعتاق والوقف، والمفتى به عندهم أنه لا يملكها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} وقال المالكية لا تنعقد بمجرد قوله «وكلتك»، بل يُفوَّض الأمر تفويضاً، وما كان فيه تنمية المال جاز، وما كان كالعتق والهبة والصدقة لثواب الآخرة لا يجوز إلا بإذن صريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} أما الشافعية والحنابلة فلا يصحون التوكيل العام، لكثرة الغرر، فلا يصح قوله «وكلتك في كل قليل وكثير لي»، ويصح قوله «وكلتك في بيع أموالي وقبض ديوني» وإن جُهلت الأموال والديون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}\n\nضابط ما يصح أن يكون محلاً للوكالة: كل عقد جاز أن يعقده الإنسان بنفسه جاز أن يوكّل فيه غيره، لأن الإنسان قد يعجز عن المباشرة لبعض الأحوال فيحتاج إلى التوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} وقد اتفق الفقهاء على جواز التوكيل في البيع والشراء، لأن الحاجة داعية إليه، وفعل النبي ذلك حين وكّل عروة البارقي في شراء الشاة، ودفع إلى حكيم بن حزام ديناراً ليشتري به أضحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} واتفقوا أيضاً على جواز التوكيل في الحوالة والرهن والكفالة والشركة والوديعة والمضاربة والجعالة والمساقاة والإجارة والقرض والوصية والفسخ والإبراء والمصارفة والإقالة والشفعة، لأنها في معنى البيع في الحاجة إلى التوكيل؛ وكذلك في الضمان والصلح والهبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743}\n\nاتفق الفقهاء على صحة التوكيل في عقد النكاح من الرجل، واستدلوا بتوكيل النبي عمرو بن أمية وأبا رافع في قبول النكاح له، وبأن الحاجة داعية إليه إذ قد يحتاج الموكل إلى الزواج من مكان بعيد لا يستطيع السفر إليه، وبزواج النبي أم حبيبة وهي يومئذ بأرض الحبشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nواتفقوا على جواز التوكيل في العبادات المالية كالزكاة والصدقات والمنذورات والكفارات، لأن النبي بعث عماله لقبض الصدقات وتفريقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} واتفقوا على جواز التوكيل في الطلاق والرجعة والخلع، لأن الحاجة إليه كالحاجة إلى التوكيل في البيع والنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nما لا يصح التوكيل فيه باتفاق. الشهادة: لا يجوز التوكيل فيها، لأنها تتعلق بعين الشاهد فيما رآه أو سمعه، ولأنها مبنية على التعبد واليقين؛ فإن استناب فيها كان النائب شاهداً على شهادته يؤدي ما سمع من شاهد الأصل لا وكيلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} والأيمان والنذور، لأنها تتعلق بعين الحالف والناذر، وكذلك اللعان والإيلاء والقسامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والمعاصي كالقتل والسرقة والغصب والقذف، لأنها محرمة لا يصح فعلها من الموكل ولا من الوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والعبادات البدنية المحضة كالصلاة والصيام والطهارة من الحدث، لأنها تتعلق ببدن من وجبت عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745}\n\nما اختلف فيه. الحج: لا يجوز التوكيل فيه لمن يقدر على الحج بنفسه، أما العاجز فتفصيله في موضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والعمرة: يجوز في الجملة أداؤها عن الغير بالوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والنكاح من المرأة: جمهور الفقهاء يمنعون أن توكل المرأة في الزواج أو تتوكل فيه، والحنفية يجيزونه للحرة البالغة العاقلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} والظهار: منعه الجمهور، وأجازه الشافعية في مقابل الأصح، ورأى ابن عبد السلام من المالكية أنه كالطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} وتحصيل المباحات كإحياء الموات والاصطياد وحفر المعدن: أجازه المالكية والشافعية في الأظهر والحنابلة، ومنعه الحنفية وبعض الشافعية والحنابلة لأن الملك للوكيل بوضع اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} والإقرار بالحقوق: أجازه الحنفية والمالكية والحنابلة والشافعية في مقابل الأصح، ومنعه الشافعية في الأصح والطحاوي لأنه إخبار عن حق كالشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747}\n\nالخصومة: أجازها المالكية والشافعية والحنابلة والصاحبان في الدين والعين وسائر الحقوق، حاضراً كان الموكل أو غائباً، رضي الخصم أو لم يرضَ، واستثنى المالكية ما إذا كان الوكيل عدواً للخصم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} واستدلوا بأن علي بن أبي طالب وكّل عقيلاً عند أبي بكر، وبأن الحاجة داعية إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} وقال أبو حنيفة لا تجوز الوكالة بالخصومة إلا برضا الخصم، إلا إذا كان الموكل مريضاً أو غائباً مسيرة ثلاثة أيام فأكثر، لأن حضور الموكل لمجلس الحكم حق لخصمه؛ ووجهه أن الدعوى خبر يحتمل الصدق والكذب، فلا يلزم جوابه إلا للضرورة، والضرورة قائمة عند مرض الموكل أو سفره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} وذكر الجصاص أنه لا فصل في ظاهر الرواية بين الرجل والمرأة، واستحسن المتأخرون توكيل المرأة المخدّرة، وقال ابن أبي ليلى لا يجوز إلا توكيل البكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}\n\nإثبات القصاص واستيفاؤه: أجاز المالكية والشافعية والحنابلة وأبو حنيفة ومحمد بن الحسن التوكيل في إثباته، وخالف أبو يوسف فلم يجزه إلا من الموكل لأن الشبهة يُتحرز عنها في الحدود والقصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} وفي استيفاء القصاص: المالكية والشافعية والحنابلة في المذهب أجازوه في حضرة الموكل وغيبته؛ والحنفية وبعض الشافعية والحنابلة لا يجيزونه إن كان الموكل غائباً لاحتمال العفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749}\n\nإثبات الحدود واستيفاؤها: الحنابلة في المذهب أجازوا التوكيل في إثبات حد الزنا مستندين إلى قصة أُنيس، وقال أبو الخطاب منهم لا يصح؛ والشافعية لا يجيزونه في حدود الله إلا حد القذف لأن الحق لله وقد أُمر بالدرء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} وفي الاستيفاء أجازه المالكية والشافعية والحنابلة، واستدلوا بأمر النبي برجم ماعز وبتوكيل عثمان علياً في إقامة حد الشرب على الوليد بن عقبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} وقال الحنفية إن حقوق الله نوعان، فالإثبات: لا يجوز التوكيل فيما لا يحتاج إلى خصومة كحد الزنا والخمر، ويجوز فيما يحتاج إليها كحد السرقة والقذف عند أبي حنيفة ومحمد، ومنعه أبو يوسف؛ والاستيفاء في القذف والسرقة يجوز إن كان المقذوف أو المسروق منه حاضراً، واختلف مشايخهم إن كان غائباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nأحكام الوكالة. تتعلق بالوكيل بأن ينفذها في الحدود التي أذن بها الموكل أو قيّده الشرع أو العرف، وأن يوافي الموكل بالمعلومات الضرورية ويقدم حساب الوكالة، وأن يرد ما للموكل في يده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} والوكالة الخاصة تصدر مطلقة وتصدر مقيدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} ومن صورها الوكالة بالبيع، فعند أبي حنيفة الوكيل بالبيع المطلق لا يتقيد بقيد إلا إذا كان متهماً، فيملك البيع بالقليل والكثير وبالنقد والنسيئة وبالعرض، لأن الأصل في اللفظ المطلق أن يجري على إطلاقه، ولأن البيع بغبن فاحش لغرض شراء ما هو أربح متعارف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nالوكالة المطلقة في البيع. اختلف الفقهاء في تقييدها على رأيين. الأول لأبي حنيفة، وهو أن الوكيل المطلق لا يتقيد بأي قيد إلا إذا كان متهماً، فيملك البيع بالقليل والكثير وبالنقد والنسيئة وبالعرض، لأن اللفظ المطلق يجري على إطلاقه، ولأن البيع بغبن فاحش لغرض شراء ما هو أربح متعارف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} والثاني لجمهور الفقهاء (المالكية والشافعية والحنابلة) وهو أن الوكيل المطلق مقيد بقيود، منها: أن يبيع بنقد البلد، لأن إطلاق النقد ينصرف إلى نقد البلد، وأن يبيع بثمن المثل فيما لا يتغابن الناس بمثله، فإن باع دونه فعند المالكية يخير الموكل ولو يسيراً، واليسير نصف العشر فأقل، وعند الحنابلة يصح البيع ويضمن الوكيل النقص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} ومنها أن يبيع بالنقود لا بالعرض عند المالكية والحنابلة والصاحبين، وأن لا يبيع نسيئة عند المالكية والشافعية والحنابلة، ويتخرج عند الحنابلة جواز ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} وأن لا يبيع بمنفعة عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}\n\nبيع الوكيل لنفسه. جمهور الفقهاء (الحنفية والشافعية والحنابلة في المذهب والمالكية في المعتمد) يمنعون ذلك، لأن العرف في البيع أن يبيع الإنسان من غيره، ولأن فيه تهمة؛ وأجازه المالكية والحنابلة إذا أذن له الموكل، واستثنى المالكية ما إذا تناهت الرغبات أو كان البيع بحضرة الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعن أحمد رواية بالجواز إذا زاد على الثمن في النداء وتولى النداء غيره، ورأى القاضي أن الثاني قد يكون واجباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعند المالكية في قول: يجوز إن لم يحاب نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754}\n\nبيع الوكيل لمن لا تُقبل شهادته له. عند الحنفية إن باع ممن لا تُقبل شهادته له بأكثر من القيمة جاز، وبأقل بغبن فاحش لا يجوز بالإجماع، وبمثل القيمة فيه روايتان؛ وأجاز الصاحبان البيع منهم بمثل القيمة إلا من عبده أو مكاتبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعند المالكية على المشهور لا يجوز للوكيل أن يبيع لمحجوره من صغير أو سفيه أو رقيق غير مأذون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} وعند الشافعية لا يجوز أن يبيع لولده الصغير ولو أُذن له، والأصح جواز بيعه لأصوله ولفروعه غير المحجورين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} وعند الحنابلة في المذهب لا يجوز أن يبيع لولده أو والده أو مكاتبه، ويجوز في الوجه الثاني، ومحل الخلاف إن لم يأذن الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755}\n\nالوكالة المقيدة في البيع. يلتزم الوكيل بقيود موكله باتفاق. قال الحنفية إن الوكيل إذا خالف قيد موكله لا ينفذ على الموكل إلا بإجازته، إلا أن يكون الخلاف إلى خير، فيكون ذلك موافقة معنى. فإذا قال «بع ثوبي بألف درهم» فباعه بأقل أو بغير الدراهم لم ينفذ، وإن باعه بأكثر نفذ، وإن قال «بع نسيئة» فباعه حالاً نفذ، وإن أمره بالحلول فباعه نسيئة توقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} ورأى المالكية أن الزيادة في البيع أو النقص في الشراء لا توجب الخيار، لأن ذلك مما يرغب فيه، وأن المخالفة لا توجب الخيار إلا إذا تعلق بها غرض صحيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} وقال الشافعية والحنابلة: لا يملك الوكيل من التصرف إلا ما يقتضيه الإذن نطقاً أو عرفاً، فإن كان في أحد التصرفين ضرر بالموكل امتنع، لقوله «لا ضرر ولا ضرار»، وإن كان فيه نظر له لزم، وهو مقتضى النصيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} والإذن المقيد بزمان لا يتعداه، والمقيد بمكان يتعلق به غرض، والمقيد بمشترٍ معين لا يتعدى إلى غيره إلا إذا علم الوكيل أن الموكل لا غرض له في عينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}\n\nمخالفة الوكيل في الثمن. في الوصف: إذا أمره ببيع نسيئة فباع حالاً، فجمهور الفقهاء يجيزون البيع وينفذ في حق الموكل لأن الموكل حصل مقصوده وزاده الوكيل خيراً؛ ويرى الحنابلة في قول أنه إن كان للموكل غرض معين في التأجيل بطل البيع، ومنعه الشافعية إن كان للموكل غرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} وإذا أمره ببيع نسيئة بثمن محدد فباعها نقداً بأقل، فالحنفية والشافعية والحنابلة لا يجيزون البيع، والمالكية يجعلونه موقوفاً على إجازة الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} وإذا أمره بالحلول فباع نسيئة، فالحنفية والشافعية والحنابلة لا يجيزون البيع لأن للتعجيل غرضاً، والمالكية يجعلونه موقوفاً على الإجازة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759}\n\nوللشافعية والحنابلة أن الوكيل لا يملك من التصرف إلا ما يقتضيه إذن الموكل نطقاً أو عرفاً، فإن كان في أحد التصرفين ضرر بالموكل امتنع، وإن كان فيه نظر له لزم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} والإذن المقيد بزمان لا يتعداه، والمقيد بمكان ذي غرض لا يُتعدّى إلى غيره، والمقيد بمشترٍ معين لا يُتعدى إلى غيره إلا إذا علم الوكيل أن الموكل لا غرض له في عينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}\n\nإذا أمره ببيع السلعة حالاً بألف فباعها بألف نسيئة لم ينفذ، بل يتوقف على إجازة الموكل، وهذا قول الكاساني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760}\n\nمخالفة الوكيل في جنس الثمن. إذا أمره ببيع السلعة بالدنانير فباعها بالدراهم أو بالعروض، فالحنفية والشافعية والقاضي من الحنابلة لا يجيزون البيع وإن كانت قيمته أكثر، لأن الإذن في جنس ليس إذناً في جنس آخر؛ ويرى الحنابلة في المذهب أنه إذا أمره بالبيع بدرهم فباعه بدينار صح، لأنه مأذون فيه عرفاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} والمالكية في تخيير الموكل بين الإمضاء والفسخ قولان إذا كان النقدان من نقد البلد وتساوت قيمتهما، وإلا خُيّر قولاً واحداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} وإذا أمره بالنقد فباعه بعرض لم يصح عند الحنابلة والمالكية، لأن العروض ليست من جنس الأثمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761}\n\nمخالفة الوكيل في قدر الثمن. إذا باع بأكثر من الثمن المحدد وكانت الزيادة من جنسه، فالجمهور يصححون البيع لأن المخالفة إلى خير؛ وزاد الشافعية أن يمتنع إذا صرّح الموكل بالنهي عن الزيادة، وفي قول عندهم لا يجوز مطلقاً لأن للمالك غرضاً في إبرار قسمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} وإذا باع بأقل من المحدد، فالمالكية يجعلونه موقوفاً على إجازة الموكل، ويرد السلعة إن كانت قائمة، أو يرد قيمتها إن فاتت؛ والشافعية والحنابلة في رواية يبطلونه؛ والحنابلة في المذهب يصححونه مع ضمان الوكيل للنقص، ولهم في قدر النقص وجهان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}\n\nمخالفة الوكيل في المكان. إذا عين له مكاناً محدداً فباع في غيره: الشافعية والحنابلة وابن شاس من المالكية يوجبون التقيد إذا كان للمكان غرض معين، كسوق معروفة بجودة النقد أو كثرة الثمن؛ والحنابلة والشافعية في وجه يجيزون البيع في مكان آخر إذا تساوى المكانان في الغرض؛ والحنفية يوجبون التقيد ويضمن الوكيل إن خالف؛ والمالكية يجعلون البيع موقوفاً على الإجازة؛ والشافعية في المعتمد لا يجوزونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}\n\nمخالفة الوكيل في الزمان. إذا حدد زمناً فباع في غيره، فالحنفية والشافعية والحنابلة يمنعون البيع ولا يلزم الموكل، لأن الموكل قد يؤثر التصرف في زمن حاجته دون غيره؛ والمالكية يخيّرون الموكل بين الإمضاء والرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}\n\nمخالفة الوكيل في المشتري المعين. إذا قال «لا تبع إلا له» فباع لغيره، فالجمهور (الحنفية والشافعية والحنابلة) لا يجيزونه، والشافعية والحنابلة يجيزونه إذا علم الوكيل أن الموكل لا غرض له في عين المشتري؛ والمالكية يخيّرون الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}\n\nتفريق الصفقة. إذا باع بعض السلعة ولم يبع الباقي، فإن كان التبعيض لا يضر بالموكل صح البيع عند الحنفية والشافعية والحنابلة ما لم ينهه عن ذلك الحنابلة، وقاعدة المالكية أن الموكل يخيّر بين الإجازة والرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} وإن كان فيه ضرر، فالشافعية والحنابلة يبطلونه، والمالكية وأبو يوسف ومحمد يجعلونه موقوفاً، وأبو حنيفة يجيزه نافذاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764}\n\nمخالفة الوكيل في جنس المبيع. إذا باع سلعة أخرى مكان المعينة، فالشافعية والحنابلة في الصحيح يبطلون البيع لأن الوكيل لا يملك إلا ما يقتضيه الإذن، والمالكية والحنابلة في رواية يجعلون الموكل مخيّراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764}\n\nالوكالة بالشراء. يجوز إطلاقها، كقوله «اشترِ لي ما شئت»، عند الحنفية والمالكية وأحمد في رواية، لأن الموكل فوّض الرأي؛ ومنعه الحنابلة في المذهب والشافعية لأنه قد يشتري ما لا يقدر على ثمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} وشراء الوكيل لموكله من ماله أو من محاجيره: الحنفية يمنعونه، ويجيزه أبو يوسف ومحمد إذا كان بمثل القيمة أو بأقل أو بزيادة يتغابن الناس في مثلها؛ وإن كانت الوكالة عامة جاز باتفاقهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766} والمالكية في المعتمد والحنابلة في المذهب يمنعون شراءه مما يملكه، ويجيزونه إذا أذن الموكل، والمالكية يجيزون شراءه من أقاربه إن لم تكن تهمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} والشافعية يمنعونه مطلقاً من ماله أو من ولده الصغير، ويجيزونه في الأصح من أصوله وفروعه البالغين المستقلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767}\n\nالوكالة بالشراء المقيدة. تجوز عند الحنفية في الاستحسان والمالكية والحنابلة في المذهب ولو لم يُذكر نوع السلعة، كأن يقول «اشتر لي ثوباً»، قياساً على القراض، ودليلهم حديث دفع الدينار إلى حكيم بن حزام ليشتري أضحية، لأن الجهالة القليلة في الوكالة لا تفضي إلى المنازعة لأن أساسها الفسحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767}\n\nالشراء بالوكالة المقيدة، والمخالفة فيه. إذا أمره بالشراء بثمن مؤجل لتأجيل مرخص به فاشترى نقداً، فالجمهور (الحنفية والمالكية والشافعية في وجه والحنابلة في المذهب) يجيزون الشراء ويلزم الموكل إذا لم يزد الوكيل في الثمن، لأن المخالفة في الصورة وفاق في المعنى؛ والشافعية في المعتمد لا يصححونه، لأن الموكل قصد ألا يكون عليه دين؛ والحنابلة في رأي يمنعونه إن تضرر الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} وإن اشترى مؤجلاً وقد أمره بالحلول، فالحنفية يلزمون الوكيل وحده، والمالكية يجعلون الخيار للموكل، والشافعية يبطلون الشراء إن كان بعين ماله، والحنابلة يجعلونه موقوفاً على الإجازة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}\n\nمخالفة جنس الثمن في الشراء. الشافعية والحنابلة في وجه يبطلونه، والحنابلة في المذهب يجيزون إبدال الدراهم بالدنانير والعكس لأن من رضي بالدرهم رضي بمكانه الدينار، ولا يجوز إبدال العروض مكان النقدين؛ والحنفية: إذا أمره بالشراء بالدنانير فاشترى بغيرها من العروض لم يلزم الموكل، والمشهور عند الكرخي أن الشراء بالدراهم عن الدنانير كذلك لا يلزم الموكل؛ والمالكية يجعلون ذلك موقوفاً على الإجازة، وفي إلزام الموكل بالدراهم عن الدنانير قولان مشهوران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}\n\nمخالفة قدر الثمن. إن كانت المخالفة إلى خير، كشراء الدابة بأقل من الثمن المسمى، صح الشراء ولزم الموكل. واستثنى الشافعية والحنابلة ما إذا نهاه الموكل عن النقص. وإن كانت إلى غير خير، فالحنفية يلزمون الوكيل ولا يلزمون الموكل؛ والمالكية يلزمون الموكل الزيادة اليسيرة، كالواحد في العشرين، ويجعلون الزيادة الكثيرة موقوفة على إجازته، ويلزم الوكيل إن التزمها؛ والشافعية والحنابلة في وجه يبطلونه؛ والحنابلة في المذهب يصححونه ويضمن الوكيل الزيادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}\n\nمخالفة المشترى. إذا اشترى غير ما وكل فيه، فالحنفية يجعلون الشراء للوكيل ولا يلزم الموكل؛ والمالكية يخيّرون الموكل فإن رده وقع للوكيل ويدفع ثمنه من ماله؛ والشافعية يبطلون إن اشتراه بعين المال، وإن اشتراه في ذمته ولم يسمِّ الموكل وقع للوكيل ولو نوى الموكل؛ والحنابلة يصححون الشراء في الذمة مع روايتين في لزومه للموكل، والشراء بعين المال باطل على الصحيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773}\n\nمخالفة قدر المشترى. الحنفية يفرّقون بين القيميات، فلا ينفذ الزائد على الموكل، وبين الموزونات، فيلزم الموكل قدر ما أمر به عند أبي حنيفة وبعض روايات محمد، ويلزمه الكل عند أبي يوسف ومحمد. والحنابلة والمالكية في مقابل المشهور يلزمون الموكل إذا اشترى شاتين بدينار تساويان كل واحدة منهما ديناراً، والحنابلة يقيدون ذلك بأن تساوي إحداهما الدينار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774} والشافعية يفرّقون بين وصف الموكل للشاة أو عدم وصفها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}\n\nتفريق الصفقة في الشراء. إذا كان المأمور به لا يمتنع تبعيضه عرفاً ولا يضر الموكل، فقد اتفق الفقهاء على جواز التبعيض، فيلزم الموكل ما اشتراه الوكيل، والحنابلة والشافعية في أحد الوجهين يقيدونه بألا يقل الموكل «اشتر ذلك صفقة واحدة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} وإن منع العرف التبعيض أو ترتب عليه ضرر، فالحنفية والمالكية يجعلونه موقوفاً على إجازة الموكل، وجمهور الحنفية يصححون شراء الباقي قبل أن يخاصمه الموكل أمام القضاء، وزفر يرى أن الشراء يقع للوكيل وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775}\n\nإذا أمر بشراء سلعة موصوفة فلا يجوز أن يشتريها إلا سليمة، لأن إطلاق البيع يقتضي السلامة من العيوب؛ فإن اشتراها معيبة، فعند الحنفية لا تلزم الموكل إذا كانت الصفة غير متحققة، كأن يشتري له جارية تخدمه فيشتري عمياء أو مقطوعة اليدين، أو يشتري دابة يركبها فيشتري مهراً، باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17776}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} ولو عيّن له السلعة فاشتراها وهي معيبة ولم يعلم الوكيل بالعيب لزمت الموكل وكان له الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} وإن علم الوكيل بالعيب لم يلزم الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} وإذا قبض الوكيل المشترى ثم اطلع على عيب فله رده ما دام في يده، فإن سلّمه إلى الموكل لم يرده إلا بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}\n\nوعند المالكية يلزم الوكيل المعيب إذا علم بعيبه واشتراه على البت، ولا يلزم الموكل إلا إذا كان العيب يسيراً يغتفر عادة والشراء غبطة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} وعند الشافعية في الشراء في الذمة: إن كان المعيب يساوي بالعيب ما اشتراه به ولم يعلم الوكيل، وقع للموكل، وإن علم فالأصح لا يقع له، وإن لم يساوِ ولم يعلم الوكيل فالأصح يقع للموكل، وإن علم لم يقع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} وإن اشترى بعين مال الموكل ولم يعلم العيب وقع للموكل، وإن علم لم يصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778}\n\nوعند الحنابلة: إذا علم الوكيل بالعيب لم يلزم الموكل ما اشتراه في الذمة؛ وإن لم يعلم جاز الشراء وللوكيل والموكل رده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17779} وإذا عيّن له الموكل السلعة فاشتراها وهي معيبة، فإن علم الوكيل بالعيب قبل الشراء لم يجز له الشراء، ولو اشترى لزمه ولم يلزم الموكل إلا إذا رضيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17779}\n\nالوكيل في العقد الفاسد. إذا وكّل في عقد فاسد لم يملك الوكيل عقداً صحيحاً بدلاً منه عند الشافعية والحنابلة ومحمد وزفر، وأجازه أبو حنيفة وأبو يوسف استحساناً إذا كان خيراً للموكل، كالوكيل بالبيع بألف إذا باع بألفين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}\n\nالوكيل ومخالفته في شرط الخيار. عند الحنفية إذا أمره أن يبيع بخيار ثلاثة أيام للموكل فباعه بغير خيار أو بخيار أقل، فالبيع باطل وهو ضامن. وإذا أمره بخيار شهر فشرط ثلاثة أيام جاز عند أبي حنيفة استحساناً، ولم يجز عندهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781} وعند الشافعية إذا قال «بع بشرط الخيار» فباع مطلقاً لم يصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782} وعند الحنابلة يجوز للوكيل شرط الخيار لنفسه ولموكله، ولا يملك شرطه للعاقد معه، لأنه إلزام لموكله بما لم يلتزمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}\n\nإقرار الوكيل بالخصومة. يمنعه المالكية والشافعية والحنابلة وزفر، لأن الإقرار يقطع الخصومة فلا يملكه الوكيل بها، ولأن الأمر بالشيء لا يتناول ضده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782} وأجازه أبو حنيفة ومحمد عند القاضي فقط دون الحدود والقصاص، والقياس عندهما الجواز عند غيره أيضاً، وأجازه أبو يوسف مطلقاً؛ وإذا استثنى الموكل الإقرار فإقرار الوكيل لا يصح ويخرج به عن الوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}\n\nالوكيل في الخصومة لا يملك المصالحة أو الإبراء أو البيع أو الهبة أو تأجيل الحق، باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}\n\nالوكيل بالقبض إذا جحد من عليه الحق. الحنابلة في المذهب والشافعية في وجه يجعلون الوكيل بالقبض وكيلاً في الخصومة لإثبات الحق لأنه لا يتوصل إلى القبض إلا به، ومنعه أبو يوسف ومحمد والمالكية والحنابلة في وجه والشافعية في وجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}\n\nالإذن في القبض ليس إذناً في الخصومة، لا نطقاً ولا عرفاً، لأن من يُرضى للقبض لا يُرضى بالضرورة للخصومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} ويفرق أبو حنيفة بين الوكيل بقبض العين، فلا يكون خصماً فيما يدعيه المدعى عليه من شراء ونحوه، والوكيل بقبض الدين، فيكون خصماً لأن استيفاء الدين مبادلة يملكها الوكيل بالخصومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} وفي حق الوكيل بالخصومة في قبض ما وُكّل بالخصومة فيه: الشافعية والحنابلة في المذهب وزفر والمروي عن أبي يوسف يمنعونه لأن الموكل قد يرضى للخصومة من لا يرضاه للقبض؛ والحنفية غير زفر والحنابلة في قول يجيزونه، لأن الوكيل بالشيء وكيل بإتمامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}\n\nوفي توكيل الوكيل بالخصومة غيره: إذا أذن له الموكل فله ذلك، وإذا نهاه فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786} وعند الإطلاق: الحنفية والمالكية والحنابلة في المذهب يمنعونه لأن الناس يتفاوتون في الخصومة؛ وقيد المالكية والحنابلة ذلك بما يليق بالوكيل، فإن كان مما لا يليق به أو لا يحسنه جاز له التوكيل، وزاد المالكية أنه يوكل من يعينه إذا كثرت الخصومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786} وقال ابن قدامة: إن أطلق الوكالة فإن كان العمل مما يترفع عنه الوكيل عادة أو يعجز عنه جاز التوكيل، وإن كان مما يعمله بنفسه وعجز عن جميعه لكثرته جاز، وفيما عدا ذلك روايتان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}\n\nوإذا وكّل شخصان واحداً في الخصومة وكان أحدهما يخاصم الآخر، فالتوكيل فاسد عند الحنفية؛ وإن وكّل الخصوم جميعاً في جهة واحدة، فجائز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}\n\nوفي وفاء الدين بالوكيل: إذا قال الموكل «اقضه ولا تشهد» فلا ضمان على الوكيل إن أنكره الدائن، وإن أمره بالإشهاد فلم يشهد فيضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} وإن أمره بالقضاء دون إشهاد فقضاه ولم يشهد، ضمن عند الحنفية والمالكية والشافعية والحنابلة في المذهب، لأنه مفرّط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} ولا يضمن إذا قضى بحضرة الموكل، عند المالكية والحنابلة في المذهب والشافعية في أصح الوجهين، ويضمن عند الشافعية في الوجه الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}\n\nالتوكيل باقتضاء الدين. إذا قبضه الوكيل برئ المدين، والمقبوض ملك للموكل وأمانة في يد الوكيل، وليس للوكيل أن يهب الدين أو يؤخره أو يبرئ منه؛ وعند الحنفية ليس له أن يأخذ به رهناً، ويجوز له أن يأخذ كفيلاً؛ وعند المالكية والحنابلة ليس له أن يصالح عن الدين إلا بإذن الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}\n\nدفع الحق إلى من يدعي وكالة الغائب. يجبر الحاكم المدين على الدفع إذا أقام المدعي بينة على الوكالة باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789} وإن لم تقم بينة، فالمالكية والشافعية والحنابلة يرون أن المدين لا يلزمه الدفع إلى مدعي الوكالة إلا إن صدّقه، والمدين إذا دفع باختياره وأنكر الدائن الوكالة، رجع الدائن على الدافع وحده، ويرجع الدافع على الوكيل إن تلف بتعدٍّ أو تفريط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790} أما الحنفية فيفرقون بين الدين والعين، ويرون أن المدين إن صدّق مدعي الوكالة أُمر بالدفع، وإن كذّبه فالوكيل وحده يُلزم بما قبضه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17791}\n\nإذا أقام الغريم البينة أن الطالب جحد الوكالة وأخذ منه المال، قُبلت، لأنه يثبت بذلك انقطاع حق الطالب عن المدفوع، فينتقض يد الوكيل ضرورة. أما إن كان الحق عيناً كالوديعة فصدّقه المودع لم يؤمر بالدفع إليه، لأنه إقرار بقبض مال الغير، بخلاف الدين فيؤمر بدفعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792} وإذا سلّم المودع الوديعة إلى مدعي الوكالة فهلكت وأنكر المالك الوكالة ضمّن المودِع، وله أن يحلّفه، وليس له أن يرجع على الوكيل إلا إذا ضمّنه وقت الدفع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}\n\nتعدد الوكلاء. يجوز للموكل أن يوكّل أكثر من وكيل في تصرف معين غير الخصومة، فإن وكّلهم بكلام واحد في وقت واحد، فلا ينفرد أحدهم بالتصرف إلا أن يجيز ذلك الموكل؛ وعند الحنفية إن كان التصرف مما يحتاج إلى الرأي والمشورة كالبيع والنكاح وقبض الدين فلا ينفرد أحدهما، وإن كان مما لا يحتاج إليه كتسليم الهبة ورد الوديعة وقضاء الدين فينفرد كل منهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793} وإن وكّلهم بكلامين مرتبين، فأيهم تصرف جاز عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} أما الوكيلان بالخصومة فينفرد كل منهما عند الحنفية، عدا زفر، وعند الحنابلة في قول والشافعية في مقابل الأصح، لأن الغرض إعلام القاضي، ويمنعه زفر والشافعية في الأصح والحنابلة في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795}\n\nتوكيل الوكيل غيره. أ- مع الإذن يجوز بالاتفاق. ب- مع النهي لا يجوز بالاتفاق. ج- مع التفويض، كقوله «اصنع ما شئت» أو «اعمل برأيك»، يجوز عند الحنفية والمالكية والحنابلة، ويمنعه الشافعية لاحتمال الألفاظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796} د- مع الإطلاق: جمهور الفقهاء يمنعونه لأن الموكل رضي برأي الوكيل والناس يتفاوتون في الرأي، واستثنى بعضهم صورتين: أن يترفع الوكيل عن العمل أو يعجز عنه، فيجوز، وأن يكون العمل مما يعمله بنفسه لكنه يعجز عن جميعه لكثرته، فيجوز عند الحنابلة في المذهب والشافعية في قول، ويقتصر عند المالكية والشافعية في المذهب على الزائد عن طاقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17797} وأحمد وابن أبي ليلى يجيزانه مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}\n\nاشتراط الأمانة فيمن يوكّله الوكيل. يجب أن يكون أميناً، إلا أن يعيّن الموكل غير أمين فيتبع الوكيل تعيينه؛ وإن صار الوكيل الثاني خائناً فالحنابلة والشافعية في قول يوجبون على الوكيل عزله، والشافعية في الأصح لا يملكون عزله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}\n\nتكييف وكالة من يوكّله الوكيل. إذا قال الموكل «وكّل عني» أو «فوّض إليه»، فالوكيل الثاني وكيل الموكل ولا ينعزل بعزل الأول، وينعزل الاثنان بموت الموكل؛ وإذا قال «وكّل عنك» فالثاني وكيل الأول، فينعزل بعزله وموته، والموكل عند الشافعية والحنابلة له عزل الفرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} وإن قال «وكّل» ولم يقل «عني» ولا «عنك» فالحنفية والمالكية والشافعية في الأصح والحنابلة في المذهب يجعلونه وكيل الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} والتوكيل بغير إذن أصلاً لا يصح عند الجمهور، ويصححه أحمد وابن أبي ليلى في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799}\n\nالوكيل أمين على ما تحت يده من مال موكله، فهو بمنزلة الوديعة، فلا ضمان عليه فيما يهلك إلا إن تعدى أو فرّط، سواء أكان بأجر أم متبرعاً، لأن يده يد الموكل، ولأن الوكالة عقد إرفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800} ويترتب على أمانته أن قوله مقبول في دفع الضمان عن نفسه مع يمينه، لأن مبنى الوكالة على التسامح والإرفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}\n\nاشتراط الضمان أو نفيه. قال ابن قدامة إن ما كان أمانة لا يصير مضموناً بشرطه، وما كان مضموناً لا ينتفي ضمانه بشرطه؛ وعن أحمد ما يدل على نفي الضمان بالشرط، والأول ظاهر المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}\n\nالتعدي والتفريط. يضمن الوكيل إذا حمّل الدابة فوق طاقتها، أو لبس الثوب بغير إذن، أو ضيّع المال ولا يعرف كيف ضاع، أو خلط مال موكله بماله خلطاً لا يتميز، أو امتنع عن الرد بلا عذر، أو أخر الرد بعد زوال العذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} وإذا دفع الموكل الدين بنفسه ثم دفعه الوكيل، فلا ضمان على الوكيل إن لم يعلم، فإن علم ضمن لأن علمه بفعل الموكل علم بالعزل؛ وعند أبي حنيفة يضمن الوكيل في الزكاة مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} وإن باع الوكيل بالحلول فسلّم المبيع قبل قبض الثمن فجحده المشتري، ضمن قيمة المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} وإذا أخر تسليم الثمن بغير عذر حتى هلك في يده ضمن، وإن كان له عذر فلا ضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}\n\nومن ذبح الشاة خطأ ضمن لأن الخطأ والعمد في أموال الناس سواء، وإذا أمره بقبض الوديعة كلها فقبض بعضها ضمن ويسقط الضمان إن قبض الباقي قبل هلاك الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}\n\nكيفية الضمان. المثلي يُضمن بمثله، والقيمي بقيمته، والمثلي إذا تعذر مثله بقيمته، وتُعتبر القيمة يوم التعدي أو الهلاك لا غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nتقديم البيان. يلتزم الوكيل بأن يقدم للموكل ما يطلبه من بيانات عما تصرف فيه، وقال ابن حجر إن كل أمين طُلب منه البيان والحساب لزمه، والعبرة بالجواب والدعوى لا بالخط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nرد ما في يد الوكيل. يجب عليه رد ما في يده لموكله، فإن امتنع عن الرد مع المطالبة بلا عذر حتى تلف ضمن، وكذا إن زال العذر فأخّر الرد حتى تلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nإذا اتفق الموكل والوكيل على أجر وجب الأجر باتفاق. وإن لم يتفقا: عند الحنفية إن كان الوكيل ممن لا يعمل بالأجر فالوكالة تبرع، وإن كان من أصحاب المهن التي يعمل أهلها بالأجر، كالسمسار والدلّال، استحق أجر المثل. وقد نصت المادة (١٤٦٧) من مجلة الأحكام العدلية على ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}\n\nوقت استحقاق الأجر. يستحقه الوكيل بتسليم ما عُهد إليه إلى الموكل إن كان مما يمكن تسليمه، كالثوب الذي ينسجه أو يخيطه؛ وإن وكّل في بيع أو شراء أو حج استحق الأجر المتفق عليه بإتمام العمل، إلا إذا اشترط الموكل تسليم الثمن أولاً فلم يسلمه الوكيل فلا أجر له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}\n\nشروط استحقاق الأجر: أن يكون العمل معلوماً، وأن تكون الأجرة معلومة المقدار، وألا تكون الأجرة جزءاً من المعقود عليه عند بعض الفقهاء، وأن ينفّذ الوكيل الوكالة تنفيذاً صحيحاً. ومن الجعل المجهول قول «جعلك عُشر ثمنه» فيكون له أجر المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806} وإذا باع الوكيل بيعاً فاسداً فلا جعل له، لأن الإذن المطلق في البيع يقتضي الصحيح فقط، فإن باع صحيحاً وتلف الثمن في يده فله الأجر لوجود العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}\n\nرجوع الوكيل على الموكل بما دفعه. إذا أمره بقضاء دين عليه فقضاه من ماله رجع عليه شرط الرجوع أو لم يشترط؛ وإذا وكّله بالشراء ولم يدفع إليه الثمن فدفعه من ماله، فعند الحنفية، عدا زفر، له حبس المبيع حتى يستوفي الثمن من الموكل، لأنه عاقد وجب له الثمن. ويرى زفر أنه لا يحبسه، لأن المبيع أمانة في يده، وعلى أبي يوسف يكون الضمان ضمان الرهن، وعلى زفر ضمان الغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}\n\nالجهة التي تتعلق بها حقوق العقد الذي يعقده الوكيل. العقود نوعان: ما يجوز إضافته إلى الوكيل، كالبيع والإجارة، فحقوقه تعود إليه كالمالك، فيسلّم المبيع ويقبض الثمن ويطالب به؛ وما يلزم إضافته إلى الموكل، كالنكاح والخلع والصلح عن دم العمد، فحقوقه تعود إلى الموكل، فلا يطالب وكيل الزوج بالمهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} والشافعية وأحمد في رواية يجعلون حقوق العقد متعلقة بالوكيل مطلقاً، والحنابلة في المذهب بالموكل مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}\n\nإذا أمر الوكيل بقبض الثمن ملك المطالبة، وأيهما طلبه المشتري أُجبر على تسليمه إليه؛ وإذا نهى الموكل الوكيل عن القبض فنهيه صحيح، لكن المشتري إذا نقد الثمن إلى الموكل برئ استحساناً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} وإذا استحق المبيع في يد المشتري رجع بالثمن على من نقده إليه، الوكيل أو الموكل؛ وكذا العيب يخاصم فيه الوكيل إن كان هو المتسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}\n\nالعقود التي يلزم إضافتها إلى الموكل، كالنكاح والخلع والعتق على مال والكتابة والصلح عن دم العمد، تكون حقوقها للموكل وعليه، والوكيل فيها سفير ومعبّر، فلا يطالب وكيل الزوج بالمهر، ولا يملك وكيل المرأة قبضه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} وعند المالكية يطالب وكيل البيع بالثمن وقبضه، ووكيل الشراء بقبض المبيع وتسليمه، ويرد المعيب إن لم يكن عالماً بعيبه، ويطالب بالثمن ما لم يصرح بالبراءة منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}\n\nكيفية انصراف حكم العقد إلى الموكل. جمهور الفقهاء (الحنفية في الصحيح، والشافعية في الصحيح، والمالكية والحنابلة) يرون أن الحكم ينتقل إلى الموكل مباشرة لأن العقد له، والكرخي يرى أن الحكم يثبت للوكيل أولاً ثم ينتقل إلى الموكل، وأبو زيد يجعله نائباً في الحكم أصيلاً في الحقوق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}\n\nاختلاف الوكيل والموكل. في أصل الوكالة: القول قول الموكل لأن الأصل عدم الوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} وفي صفة الوكالة كالعين والثمن والنقد والنسيئة: قول الموكل عند الحنفية والمالكية والشافعية والحنابلة في وجه؛ واستثنى المالكية صورتين يكون فيهما القول قول الوكيل بيمينه، وعند الحنابلة في المذهب قول الوكيل لأنه أمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811}\n\nتلف ما بيد الوكيل بغير تفريط: القول قول الوكيل مع يمينه باتفاق، لأنه أمين، ويتعذر عليه الإشهاد، والمالكية يقيدونه بالتهمة، والحنابلة بالسبب الخفي كالسرقة؛ وإن كان التلف بأمر ظاهر كالحريق والنهب فعند القاضي من الحنابلة عليه إثبات الحادث الظاهر ثم يحلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} والتعدي والتفريط في الحفظ: القول قول الوكيل مع يمينه، لأنه منكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812}\n\nالاختلاف في التصرف المأذون فيه وقبض الثمن: تفصيل الحنفية في بيع الوكيل وقبضه الثمن وهلاكه، وقد يكون المبيع مسلّماً إلى الوكيل أو غير مسلّم؛ فإن صدّقه الموكل في البيع والقبض دون الهلاك، فالقول للوكيل في الهلاك مع يمينه؛ وإن كذّبه الموكل في ذلك كله لم يصدّق الوكيل في حق الموكل في القبض، والمشتري بالخيار إن شاء نقد ثانياً وإن شاء فسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} وعند المالكية إذا قال الوكيل «تصرفت كما أذنت» فالقول قوله، لأنه أمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} وعند الشافعية إن جرى الاختلاف بعد الانعزال لم يُقبل قوله إلا ببينة، وإن جرى قبله فقولان، أظهرهما للأكثرين قول الموكل، وقيل ما يستقل به الوكيل يُقبل قوله فيه بيمينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} وعند الحنابلة في المذهب: إذا قال الوكيل «بعت الثوب وقبضت الثمن فتلف» فالقول قوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nدعوى رد ما بيد الوكيل. القول قول الوكيل مع يمينه عند الجمهور، سواء كانت بأجر أو بغير أجر عند الحنفية والمالكية؛ وعند الشافعية في مقابل الأصح والحنابلة في المذهب لا يُقبل قوله إن كان يعمل بأجر إلا ببينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nانتهاء الوكالة. أولاً: العزل، فالوكالة عقد غير لازم، فيجوز لكل من الطرفين فسخها بالعزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nانتهاء الوكالة، وأولها العزل. يجوز للموكل عزل الوكيل وأن ينهاه عن التصرف، وللوكيل أن يعزل نفسه، باتفاق الفقهاء في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}\n\nشروط صحة عزل الوكيل من موكله: الأول، علم الوكيل بالعزل، فيشترطه الحنفية وقول عند المالكية والشافعية ورواية عند الحنابلة، ولا يشترطه المالكية في قول والشافعية في الأصح والحنابلة في المذهب. ويتم علم الوكيل عند الحنفية بحضور العزل، أو بكتاب الموكل الغائب، أو بالرسول الذي يبلغه، ولو كان غير عدل أو صغيراً، أو بخبر عدلين أو عدل، وإن كان الخبر من غير عدل فصدّقه ينعزل؛ وأبو حنيفة لا يجعله منعزلاً إن كذّبه ولو ظهر صدق الخبر، لأن الإخبار عن العزل شبيه بالشهادة، وخالفه أبو يوسف ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818} الثاني، ألا يتعلق بالوكالة حق الغير، فعند الحنفية لا يجوز العزل بغير رضا صاحب الحق، كالمرتهن الذي وُكّل ببيع الرهن، والمدعي الذي وكل المدعى عليه بالخصومة؛ والشافعية يجيزون عزل الوكيل إذا كانت الوكالة بسؤال الخصم، والمالكية يمنعون عزله بعد أن يقاعد الخصم ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} الثالث، ألا تكون الوكالة بإجارة، فهي لازمة. الرابع، ألا يترتب على العزل مفسدة، فيحرم العزل إن كان يؤدي إلى استيلاء ظالم على مال المولى عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}\n\nعزل الوكيل نفسه لا يشترط فيه علم الموكل عند جمهور الفقهاء، إلا عند الحنفية إن كانت الوكالة بالخصومة أو بشراء شيء معين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820}\n\nالوفاة. تبطل الوكالة بموت الموكل أو الوكيل باتفاق، لأن الموت مبطل للأهلية، والمال انتقل إلى الورثة. وعند الحنفية والشافعية والحنابلة في المذهب لا يُشترط علم الوكيل بالموت، وعند المالكية ينعزل الوكيل إن كان المتعاقد معه حاضراً في بلد الموت وعلم بالوكالة إن علم بالموت، وإلا فلا ينعزل إلا بعلمه بالموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820}\n\nالجنون. الحنفية يبطلون الوكالة بالجنون المطبق، وحده عند أبي يوسف بالشهر، ومحمد بالسنة، والمطبق لا تعود الوكالة بإفاقته؛ والشافعية والحنابلة في المذهب يبطلونها بالجنون، والمالكية لا تنعزل إلا أن يطول جنون الموكل فيُنظر فيه الحاكم، والحنابلة في قول يرونها لا تبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17821}\n\nالإغماء. جمهور الفقهاء لا يبطلونها به، والشافعية في الأصح يبطلونها إلحاقاً بالجنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}\n\nالحجر. الحنفية يرون أن الحجر على الموكل أو الوكيل يبطل الوكالة، لكن تخصص الحنفية فتبطل بالحجر على الموكل إن كانت في العقود والخصومة لا في قضاء الدين وقبض الوديعة؛ والحنابلة تبطل بالحجر للسفه، وبفلس الموكل فيما حُجر عليه فيه؛ والشافعية تبطل بالحجر بسفه أو فلس في كل تصرف لا ينفذ؛ والمالكية تبطل بفلس الموكل الأخص لا الأعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}\n\nالردة. الحنفية: إذا حُكم بلحاق المرتد بدار الحرب بطلت وكالته ولا تعود بعوده مسلماً على المذهب، وتصرفاته قبل اللحاق موقوفة عند أبي حنيفة، وعند أبي يوسف ومحمد نافذة. والمالكية ينعزل الوكيل بردة موكله بعد أيام الاستتابة، والشافعية يبنون ذلك على زوال ملك المرتد وفيه أقوال، وأظهرها أن ملكه موقوف. والحنابلة: الصحيح في المذهب أن الوكالة لا تبطل بردة الوكيل، وتبطل بردة الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17824}\n\nالفسق. نص الحنابلة على أن الوكالة لا تبطل بفسق الوكيل إلا فيما ينافيه الفسق، كالإيجاب في عقد النكاح، فينعزل بفسقه أو بفسق موكله؛ وإن كان وكيلاً فيما تشترط فيه الأمانة، كوكيل ولي اليتيم أو ناظر الوقف، انعزل بفسق نفسه وفسق موكله. وأبطلها الشافعية بفسق الموكل فيما تشترط فيه السلامة من الفسق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}\n\nالسكر. عند الشافعية ينعزل الوكيل إذا سكر أحدهما بغير تعدٍّ، وإن سكر بتعدٍّ فيحتمل الانعزال ويحتمل عدمه. وعند الحنابلة لا تبطل بالسكر إلا فيما ينافيه كالإيجاب في النكاح. وعند الحنفية لا تبطل بالسكر مطلقاً، فالوكيل بالطلاق إذا طلق وهو سكران لم يقع، والوكيل بالبيع إذا باع وهو سكران لم ينفذ على موكله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}\n\nخروج محل التصرف عن ملك الموكل. إذا تصرف الموكل في المحل بنفسه، كأن يبيع السلعة قبل أن يبيعها الوكيل أو تستحق لغيره، أو تزوّج المرأة بنفسه، بطلت الوكالة. والمالكية إذا باع الموكل لواحد والوكيل لآخر، فالبيع الأول لازم، والثاني فضولي، إلا أن يقبض الثاني السلعة، فيمضي ويرد الأول إن لم يعلم الثاني والمشتري منه بالبيع الأول. وعند الحنابلة تبطل الوكالة بإقرار الوكيل على موكله بقبض ما وُكّل في قبضه، لاعترافه بذهاب محل الوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}\n\nعودة الوكالة إذا عاد المحل إلى الموكل. قال محمد تعود، لأن العائد بالفسخ عين الملك الأول فيعود بحقوقه، وقال الشافعية وأبو يوسف لا تعود، لأن تصرف الموكل يتضمن عزل الوكيل. وقال ابن عابدين إنها تعود إن عاد الملك بما هو فسخ، لا بما ليس بفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827}\n\nتعدي الوكيل فيما وُكّل فيه. الشافعية في الأصح والحنابلة في المذهب: لا تبطل الوكالة بالتعدي، لأن التصرف صدر بإذن، والأمانة تبطل بالتعدي والتصرف يبقى، كالرهن. والشافعية في مقابل الأصح والحنابلة في قول تبطلها، لأنها عقد أمانة كالوديعة. وقال المرداوي: إن أتلف الوكيل بتعديه عين ما وُكّل فيه بطلت الوكالة، وإن بقيت العين لم تبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827}\n\nالإنكار. الحنابلة والحنفية في قول لا تبطلها جحود الوكيل أو الموكل، لأن الجحود لا يدل على دفع الإذن السابق؛ والحنفية في قول عليه الفتوى والحنابلة في قول تبطلها. والشافعية: الإنكار لنسيان أو لغرض في الإخفاء ليس عزلاً، فإن تعمد أحدهما الإنكار بلا غرض انعزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nتلف محل الوكالة. تبطل الوكالة بتلف العين الموكل فيها، وبموت المرأة الموكل بطلاقها. وعند الحنفية تنعزل الوكالة بافتراق الشريكين الذين وكّلا شخصاً، ولو لم يعلم الوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nإنجاز التصرف. ينعزل الوكيل عند الحنفية بانتهاء المأمور به، كأن يقبض الدين أو يعقد النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nالرجوع دلالة. تبطل الوكالة عند الحنابلة برجوع الموكل دلالة، كوطء الزوجة التي وكّل في طلاقها، أو برجوع الوكيل دلالة، كقبوله وكالة عتق عبد كان قد وكّل في شرائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17829}"
  en: "Wakala, with its vowel variants, means in the language protection, as in the Divine name al-Wakil meaning the Guardian, and in tawakkul ('we have entrusted our affairs to God'); tawkil is the delegation of a disposal to another. The agent is called wakil because his principal has entrusted him with the conduct of his affair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} The jurists define it in several ways. The Hanafis: setting another in one's place in a lawful, known disposal, out of ease or incapacity. The Malikis: the deputising of a person with a right, who has no command or worship, for another in what is not conditioned on his death. The Shafi'is: the delegation by a person of what he may do and that admits delegation, to another to do it during his life. The Hanbalis: the deputising of a person capable of disposing of property, like himself, in what deputising admits of rights of God and rights of men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe Mawsu'a distinguishes wakala from neighbouring terms: deputising (niyaba), which is for some jurists wider than wakala and for others its synonym; authority (wilaya), the carrying out of a word over another whether he wills it or not, which is a legal or compulsory deputising, while wakala is agreed; bequest (iya'), the setting of another in one's place in disposal after death, while wakala is in life; and guardianship (qiwama), a power given by the judge to an adult to act for a minor's interest, or the husband's authority over his wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe jurists agree that wakala is lawful. They cite the Qur'an: the account of the People of the Cave sending one of them with their silver to the city, and the verse of the two arbiters in Surat al-Nisa, which is taken to show that each arbiter acts as agent of one of the spouses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} They cite the Sunna: the report of 'Urwa ibn Abi al-Ja'd al-Bariqi, to whom the Prophet gave a dinar to buy a sheep; the report of Hakim ibn Hizam about buying a sacrifice; the report of Jabir about the agent at Khaybar; and the report of Abu Rafi' that he was the go-between in the Prophet's marriage to Maymuna. The jurists agree on its lawfulness from the time of the Prophet to the present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} By reason, the need for it is clear, since a person may be unable to act himself by illness, age or rank, and without it hardship would follow, which the text removes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe pillars of wakala: the majority hold them to be the formula, the two parties (principal and agent) and the object of the agency. The Hanafis hold that the pillar is the offer and acceptance, since their presence entails the other two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} The formula is the offer and acceptance, through which mutual consent is expressed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe offer. The majority hold it is what comes from the principal and shows his permission to appoint an agent; the Hanafis hold it is what comes first from one of the contracting parties to show his desire to make the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} It may be made by any sign of consent, in words, in writing, by message or by the sign of a mute man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Explicit words include 'I appointed you', 'I entrusted to you', 'I made you my deputy', 'I permitted you', 'I set you in my place' and 'you are my agent'. An order such as 'sell it' is valid for the Hanafis, Shafi'is and Hanbalis, and for the Malikis where custom so treats it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} The words 'I will appoint you', 'I appoint you' and 'I have relied on you' do not make a valid agency for the Shafi'is, since they are ambiguous, unless a clear term is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nAgency may be concluded by message, according to the Hanafis, Malikis and Shafi'is: the agent becomes agent once the news reaches him and he accepts, whether the bearer is trustworthy or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} The offer may also be made by clear writing, by the understood sign of a mute man, by an act that shows permission (for the Hanbalis), and by what custom treats as an offer, as when a husband disposes of his wife's property while she knows and keeps silent (the Malikis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} Silence is not an offer for the Hanafis, Shafi'is and Hanbalis: one who sees a stranger sell his property and says nothing is not made an agent by his silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nThe acceptance may be given in words, such as 'I accept' or words showing acceptance. The Hanafis and Shafi'is add that the agent must not refuse; if he refuses after the offer, no agency is concluded even if he accepts later, unless the offer and acceptance are renewed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} On acceptance by act there are three views. The majority (Hanafis, Malikis, the sounder Shafi'i view, and the Hanbalis) hold that it is complete by any act that shows it, such as the agent doing what he was told; the Shafi'is in one view, the Hanbalis in one view and Zufar among the Hanafis hold that it requires words; a third Shafi'i view distinguishes: if the offer is in the form of a command such as 'sell and buy', acceptance by act suffices, but if it is in the form of a contract such as 'I appointed you', words are needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Acceptance is also valid in clear addressed writing and by the understood sign of a mute man; the Hanafis hold that an agent's silence is acceptance, which is undone by his refusal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nIf acceptance is delayed after the offer, the majority (Hanafis, Hanbalis, the Shafi'i school view, and one Maliki view) hold that it is valid, since the permission remains while the principal does not withdraw it, and it is like a permission to act. The Shafi'is limit this to cases where the time of the act is not fixed; if it is fixed and there is fear of its passing, acceptance must be immediate, as also when the judge offers the agency to a man on its being established before him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} The second Maliki view and Abu Hamid al-Marwarudhi among the Shafi'is hold acceptance must be immediate, because wakala is a contract made in life, and like sale it requires immediate acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Al-Mazari said the matter returns to intention and custom: whether the words in question call for an immediate reply, or allow a prompt or a deferred one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe forms of the wakala formula, by the time at which its effects arise, are: the immediate form, which is neither conditioned on a condition nor linked to a time; the conditional form; the form attached to the future; and the time-limited form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe immediate formula, which is neither conditioned on a condition nor linked to a time, as in the principal saying 'I appointed you to sell that house', is valid by agreement of the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nThe formula conditioned on a condition. The jurists differ on two views. The first, held by the Hanafis, the sounder Hanbali view and, against the sounder view, the Shafi'is, is that it is valid, as in 'if the pilgrim arrives, sell this food'. They cite the report of Ibn 'Umar that the Prophet appointed Zayd ibn Haritha to command at Mu'ta, then Ja'far, then Ibn Rawaha if the first two were killed; and they argue that the agency is a contract whose effect on the agent, the permission to act, is recognised, so it is like a bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} The second, held by the sounder Shafi'i view and one Hanbali view, is that it is invalid; al-Mawardi says conditioning an agency on conditions or terms is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} The Shafi'is allow the principal to conclude the agency now and to make the act itself subject to a condition, as in 'sell it after a month', since that is postponement, not conditioning. Al-Ghazali reports that the Iraqis held that 'I appointed you now, but do not act until a month passes or a certain man arrives' is valid, since it is a delay, and the agent must comply. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nThe periodic formula: the principal says 'I appointed you to sell this property, and whenever I remove you, you are my agent again', so the agency renews itself each time he removes the agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} The Hanafis and the sounder Hanbali view hold it valid, on the ground that agency admits conditioning; for the Hanafis the principal may remove his agent at any time, and for the Hanbalis removal is effected by his words 'I removed you, and whenever I appoint you, I have removed you'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} Ibn Taymiyya holds it invalid, since it would turn a permissive contract into a binding one; the purpose of the conditional is to prevent appointment, not to dissolve a contract before it exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} The Shafi'is have two views on its validity at once; the sounder is that it is valid, because permission exists. If he removes the agent, and the agent did not know, or knew, there are two views on whether the agency returns after removal; the sounder is that it does not. If the words are 'whenever I remove you', the agency returns once; if they are 'every time I remove you', it returns each time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe formula attached to a future time, as in 'I appointed you to sell my beasts in Ramadan', or 'I appointed you to sell this house tomorrow'. The Hanafis and Hanbalis hold it valid, since agency admits being attached to the future; the Hanafis add that the agent becomes agent from tomorrow onward and not before. The Shafi'is agree that it is valid, since the agency is concluded now and only the act is linked to a future time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe formula conditioned on a time, as in 'when the new month comes, I appointed you to sell my house': on the sounder Shafi'i view it is void, since conditioning an agency on terms is invalid; the Hanafis, Hanbalis and the opposite Shafi'i view hold it valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} The Hanafis distinguish attachment (idafa) from conditioning (ta'liq). An attached formula is a cause that concludes the contract now while its effect is deferred to the time; a conditioned formula cannot be a cause of the effect now, so the agency is not concluded until the condition is met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe time-limited formula, as in 'you are my agent for a month', is valid by the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} They differ whether it survives the period. The Shafi'is hold that it does not survive the period. The Hanafis report two views on one who was told 'sell my house today' and did it tomorrow: the sounder view is that the agency does not survive the day, but some Hanafis hold it survives, since naming the day is for haste, not for limiting the agency to that day. Al-Bazzaziyya, quoted by the author of Minhat al-Khaliq, holds that an agency for ten days does not end when the ten days pass, on the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}\n\nConditions attached to the agency. If the condition is invalid, the Hanafis, Ahmad in the apparent of his two reports, and Ibn Abi Layla hold that the agency is not invalidated by any invalid condition. The Shafi'is hold that an invalid condition invalidates it, as when the principal says 'prevent the buyer from taking the goods', since to prevent a right-holder from taking possession is forbidden; the sale itself is valid by permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Al-Zarkashi says that the permissive contracts (partnership, agency and mudaraba) are not stopped from taking effect by permission when they are invalid, but lose their own features. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} The effect of invalidity is that a named fee falls away and the customary fee is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Some Hanbalis hold that the agency is void, like a deposit, because the trust is gone; and Abu Muhammad among the Shafi'is says the permission is not separate from the agency, so its invalidity means the permission is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}\n\nThe nature of the agency contract, whether binding or permissive. The first view, held by the Hanafis, Shafi'is, Hanbalis and some Malikis, is that it is permissive on both sides, since it is a gift and gifts are not binding: the principal may see that it is better to leave the matter, or to appoint another, and the agent may not be free. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The Hanafis and Malikis except where a third party's right attaches to the agency, which then binds, as with an agent in a suit appointed at the claimant's request, or an agent to sell a pledge in the presence of the pledgee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The Hanafis say that from its non-binding nature three rules follow: an option of stipulation does not enter it; agency is not valid as a principal claim; and the agent may resign whenever he wishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The second view: if the agency is for a fee in the form of a hire, it binds both sides and must meet the conditions of hire; the Shafi'is and in one view the Malikis say so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} The third view, of some later Malikis, is that it binds the agent's side even without a fee, by analogy with a gift that binds once given, though not received. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} If the agency is by way of a reward (ju'ala), the Malikis hold three views: binding on both sides; permissive on both sides, which is the view relied upon by the Shafi'is; and binding on the side of the one who offers the reward once the other starts work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nThe second pillar, the two parties, the principal and the agent. First, the principal: one who sets another in his place in a lawful known disposal, who must have the power to make that disposal and be bound by its rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} The jurists agree that agency may not be made by an insane person, an imbecile, a person under anaesthesia, a sleeper, or a minor who cannot discern, in any disposal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nA discerning minor may be appointed to acts that are purely beneficial to him, by agreement. For acts that are between benefit and loss, the Hanafis, Malikis and Hanbalis allow it with the guardian's permission, while the Shafi'is void it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} A spendthrift placed under restraint may not be appointed in what he cannot do independently, but may be in what he can. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nThe majority of jurists do not allow a woman to be appointed in a marriage, since she does not marry herself and so cannot be an agent for it; the Hanafis allow it, and the Malikis allow it in some cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nOn the appointment of an apostate there are three views. The first, held by the majority (the sounder Shafi'i view, the Hanbalis and Abu Hanifa), is that it is suspended on his return to Islam: if he returns the agency takes effect, and if he dies, is killed or joins the enemy as an apostate, it is void. The second, held by the two companions of Abu Hanifa and by one Shafi'i view, is that it is valid and binding; the Hanafis add that an apostate woman may be appointed by their agreement, since her acts take effect. The third, a Shafi'i view that Zakariyya al-Ansari and al-Shibramallisi regarded as the sound one, is that it is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nOn a Muslim appointing a dhimmi to sell wine or pork: the Shafi'is, Malikis, Hanbalis and the two companions hold it invalid, because a condition of the agency is that the principal himself owns the act he delegates, and a Muslim cannot sell wine or pork; one cannot give what one lacks. Abu Hanifa holds it valid, since it is enough that the principal has the capacity to act that entitles him to appoint another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nOn a pilgrim (muhrim) appointing a non-pilgrim to contract a marriage: the majority do not allow it, since the pilgrim does not conduct the contract during his pilgrimage; the Hanafis allow it in every case, since he could conduct the contract himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} The Hanbalis say that agency is invalid if the agent does not know his principal, as when he is told 'Zayd has appointed you' without a name or a description that identifies him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nThe agent must have the same sanity as the principal, so an insane person, an imbecile or a minor who cannot discern may not be an agent, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} On puberty as a condition: the Hanafis and Hanbalis allow a discerning minor who understands the contract and intends it to be an agent, and the rights of the contract return to the principal, not to him; their evidence includes the report that the Prophet married Umm Salama through 'Amr ibn Umm Salama, who was a boy. The Shafi'is forbid it, because a minor is not accountable and cannot dispose of his own right, so he cannot dispose of another's by appointment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} The agent must be named: if someone says 'I appointed one of the people to sell this goods', the agency is void, because the agent is unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} Ibn Najim says that a creditor's words to his debtor, 'whoever comes to you with a certain sign, and takes your finger, or says such and such to you, pay what I owe him', are an unknown agency that does not discharge the debtor if he pays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17739}\n\nKnowledge of the agency. For the Hanafis, knowledge of the agency is a condition, either by the agent or by the party dealing with him. If the agent sells before he knows and the buyer knows, the sale is not valid until the principal or the agent ratifies it after knowledge. If a trustworthy man informs the agent, and the agent accepts, he is an agent; if one who is not trustworthy informs him and he accepts, he is an agent; if he does not accept, Abu Hanifa holds he is not an agent, while Abu Yusuf and Muhammad hold he is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} The Hanbalis do not require knowledge, since the matter of contracts is what is actually the case; the sounder Shafi'i view agrees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Justice in the agent is not required in general, except in certain contracts such as marriage; nor is the male sex, except in some contracts such as marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}\n\nThe object of the agency is the disposal the principal permits the agent, in ownership or in guardianship. The Shafi'is set three conditions: it must be known in some respects; it must admit deputising; and the principal must own it at the time of the agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Agency is special, where it concerns a named disposal and the agent may act only in that, by agreement; or general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} On general agency the Hanafis and Malikis allow it with detail. The Hanafis say that 'you are my agent in every small and great matter' gives only the power to keep; 'you are my agent in every matter your order permits' makes the agent competent for all money dispositions, such as sale, purchase, gift and alms; they differ on divorce, emancipation and waqf, and the view taken is that the agent does not have those, which the author of al-Bazzaziyya also holds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} The Malikis say that a general agency is not concluded by the bare words 'I appointed you'; it must be delegated in words such as 'a delegated agency' or 'in all my affairs'. What increases property is allowed; gifts, emancipation and alms for the reward of the next life are not, unless the principal permits them in words. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} The Shafi'is and Hanbalis hold a general agency invalid because of the risk. 'I appointed you in all my small and great matters' or 'I delegated to you everything' is therefore invalid, while 'I appointed you to sell my goods and collect my debts' is valid even if the goods and debts are unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}\n\nThe general rule for what may be the object of an agency is that whatever contract a person may make himself, he may appoint another to make, because a person may be unable to act himself in some circumstances and so needs to appoint another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} The jurists agree that agency in sale and purchase is valid, because there is a need for it. The Prophet himself appointed 'Urwa al-Bariqi to buy a sheep, and gave a dinar to Hakim ibn Hizam to buy a sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} They also agree that agency is valid in assignment of debt (hawala), pledge, surety, partnership, deposit, mudaraba, reward contracts (ju'ala), irrigation partnership (musaqa), hire, loan, bequest, rescission, release, exchange (musarafa), cancellation (iqala) and pre-emption, since all of these are like sale in their need for an agent; likewise surety, settlement and gift. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743}\n\nThe jurists agree that a man may appoint an agent in a marriage contract, citing the Prophet's appointment of 'Amr ibn Umayya and Abu Rafi' to accept a marriage for him; the need for it, since a man may wish to marry from a far place and cannot travel there; and the Prophet's marriage to Umm Habiba while she was in the land of Abyssinia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nThey agree that agency is valid in financial acts of worship, such as zakat, charity, vows and expiations, since the Prophet sent his agents to collect and distribute charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} They also agree that agency is valid in divorce, revocation and khul', since the need is like the need for agency in sale and marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nActs that agency may not cover, by agreement. Testimony: agency is not valid in it, because it depends on the witness himself, who reports what he saw or heard, and because it rests on devotion and certainty; if a witness appoints another to testify, the second acts as a witness on the first witness's testimony and not as an agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Oaths and vows, since they depend on the swearer or vower himself; so do the oaths of mutual cursing, the vow of abstinence from wives and the oath of compurgation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Sins, such as killing, theft, usurpation and slander, which are forbidden and may not be done by the principal or the agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} And purely bodily worship, such as prayer, fasting and the purification from minor impurity, since they depend on the body of the one obliged. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745}\n\nMatters on which the jurists differ. The pilgrimage: agency is not allowed for a person able to make it himself; the incapable person's case is set out elsewhere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} The lesser pilgrimage (umra) may generally be performed on behalf of another by agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Marriage by a woman: most jurists forbid a woman to appoint or be appointed in marriage, since she may not contract it herself; the Hanafis allow it for a free adult sane woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Zihar: the majority forbid agency in it, the sounder Shafi'i view forbids it, and a Shafi'i view allows it; Ibn 'Abd al-Salam of the Malikis held that zihar is like divorce, since both are mere utterances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Securing permitted acts, such as reviving dead land, drawing water, hunting, gathering grass or digging a mine: the Malikis, the sounder Shafi'i view and the Hanbalis allow it, since the ownership comes from a cause that does not bind the person; the Hanafis, some Shafi'is and some Hanbalis forbid it, since the cause of ownership, taking hold, has occurred for the agent and an intention cannot turn it aside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Acknowledgement of rights: the Hanafis, Malikis, Hanbalis and a non-sounder Shafi'i view allow it, since it establishes a right in the obligation by words, as sale does; the sounder Shafi'i view and al-Tahawi forbid it, since it is a report about a right, like testimony. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747}\n\nLitigation: the Malikis, Shafi'is, Hanbalis and the two companions of Abu Hanifa allow agency in litigation over debts, specific property and all rights, whether the principal is present or absent, sick or well, and whether the opponent consents or not; the Malikis exclude an agent who is hostile to the opponent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} They cite the consensus of the Companions, as 'Ali appointed 'Aqil before Abu Bakr and said 'what is decided for him is mine, and what is decided against him is mine'; and the need for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} Abu Hanifa holds that litigation by agency is valid only with the opponent's consent, unless the principal is sick or absent three days' journey or more, since the principal's presence at the court is a right of his opponent. His reason is that a claim is a report that may be true or false, so its answer is required only by necessity; that necessity arises when the principal is sick or travelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} Al-Jassas reports that the apparent view draws no distinction between a man and a woman, or a virgin and a married woman; later Hanafis approve the agency of a secluded woman who does not appear in public; Ibn Abi Layla held it valid only for a virgin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}\n\nProof and execution of retaliation (qisas). The Malikis, Shafi'is, Hanbalis, Abu Hanifa and Muhammad al-Shaybani allow agency in proving qisas, whether the principal is present or absent, since qisas is a human right; Abu Yusuf does not allow it, and the evidence is accepted only from the principal himself, because of the doubt that must be guarded against in retaliation and the hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} On the execution of qisas: the Malikis, Shafi'is and the school view of the Hanbalis allow it whether the principal is present or absent. The Hanafis, some Shafi'is and some Hanbalis allow it only when the principal is present, since he may pardon in his absence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749}\n\nProof and execution of the hudud. The Shafi'is and Hanbalis distinguish the two. The school view of the Hanbalis allows agency in proving adultery, from the story of Unays; Abu al-Khattab among them says it is invalid. The Shafi'is do not allow agency in proving the hudud of God except the hadd of slander, since the right is God's, and it is commanded to avert it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} On execution, the Malikis, Shafi'is and Hanbalis allow agency, citing the Prophet's order to stone Ma'iz and 'Uthman's appointment of 'Ali to carry out the flogging for drinking on al-Walid ibn 'Uqba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} The Hanafis say there are two kinds of rights of God: proof, where agency is not allowed for the hudud that need no litigation, such as adultery and drinking, and is allowed for those that need it, such as theft and slander, according to Abu Hanifa and Muhammad, but Abu Yusuf forbids it; and execution of slander and theft is valid when the injured party is present, while if he is absent the Hanafi shaykhs differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nThe rules of agency. They bind the agent to carry it out within the limits the principal permitted or that law or custom imposes, to inform the principal of necessary information and render an account, and to return what belongs to the principal that is in his hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} A special agency may be issued unrestricted or restricted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Among its forms is agency in sale. For Abu Hanifa, the agent in an unrestricted sale is not bound by any restriction unless he is suspected; he may sell for little or much, for cash or on credit, and for goods, since the unrestricted word keeps its unrestricted sense, and a sale at a gross undervaluation in order to buy something more profitable is also customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nThe unrestricted agency in sale. The jurists differ on whether it is restricted, on two views. The first, Abu Hanifa's, is that an agent in an unrestricted sale is not bound by any restriction unless he is suspected; he may sell for little or much, for cash or on credit, and for goods, since the unrestricted word keeps its unrestricted sense, and a sale at a gross undervaluation in order to buy something more profitable is customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} The second, the majority (Malikis, Shafi'is and Hanbalis), is that the unrestricted agent is restricted by several limits. He may sell only for the currency of the town, since an unrestricted currency means the local currency. He may sell only at the market price in goods that people do not sell at a notable undervaluation; if he sells below it, the Malikis give the principal a choice, even for a small loss, which they set at half a tenth or less; the Hanbalis hold the sale valid and make the agent liable for the shortfall. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} He may not sell in goods instead of money, according to the Malikis, Hanbalis and the two companions; he may not sell on credit, according to the Malikis, Shafi'is and Hanbalis, though a Hanbali deduction allows it; and he may not sell for a benefit, according to the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}\n\nThe agent selling to himself. The majority (Hanafis, Shafi'is, the school view of the Hanbalis and the settled Maliki view) forbid it, since custom in sale is that a man sells to another, and there is a suspicion of bias. The Malikis and Hanbalis allow it if the principal permits, and the Malikis exclude cases where the bids have run high or where the sale is in the principal's presence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} A narration of Ahmad allows the agent to buy if he outbids in a public auction and someone else conducts the auction; al-Qadi said the second condition may be obligatory and may be recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} A Maliki view allows it if he does not favour himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754}\n\nThe agent selling to one whose testimony cannot be accepted for him. For the Hanafis, a sale to such a person above the value is valid; below the value by gross undervaluation it is invalid by agreement; at the value there are two narrations of Abu Hanifa. The two companions allow a sale to them at the value, except to his own slave or the slave who has bought his freedom by instalments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} The Malikis hold, on the settled view, that the agent may not sell to his ward, whether a minor, a spendthrift or an unauthorised slave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} The Shafi'is forbid a sale to his young son even if permitted, and the sounder view allows sale to his ascendants and his non-ward descendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} The Hanbalis in the school view forbid a sale to his son, his father or his mukatab (a slave contracted to buy his freedom by instalments); the other view allows it; the difference arises where the principal did not permit it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755}\n\nRestricted agency in sale. The agent must keep to the restrictions the principal set, by agreement. The Hanafis say that if he goes against a restriction the sale does not bind the principal unless he ratifies it, unless the difference is for the better, which is agreement in meaning. If he is told 'sell my garment for a thousand dirhams' and sells for less, or for something other than dirhams, the sale is not binding, even if the goods are worth more; if he sells for more, it binds. If he is told to sell on credit and sells for cash, the sale binds; if he is told to sell for cash and sells on credit, it is suspended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} The Malikis hold that exceeding the price in a sale, or paying less in a purchase, does not give the principal an option, since it is desired; only a difference which affects a valid purpose does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} The Shafi'is and Hanbalis say the agent may act only in what the principal's permission requires by word or custom. If one of two acts harms the principal he may not do it, citing the saying that there should be no harm nor reciprocal harm; if one benefits the principal, he must do it, since that is the sincere counsel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} A permission limited to a time does not extend before or after it; one limited to a place with an interest in it, such as a market known for its currency or price, is confined to that place, and where the place is equal in interest, the permission extends to it. Where the buyer is named, the agent may not sell to anyone else, unless he knows the principal has no interest in that particular buyer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}\n\nBreach of the price terms. As to the description of the price: if the principal says 'sell on credit' and the agent sells for cash, the majority hold that the sale binds the principal, since he gets his object and the agent has given him more; a Hanbali view makes the sale void where the principal has a definite interest in the deferral, and the Shafi'is forbid it where the principal has an interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} If he is told to sell on credit for a fixed price and sells for cash at less, the Hanafis, Shafi'is and Hanbalis do not allow the sale, and the Malikis make it suspended on the principal's approval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} If he is told to sell for cash and sells on credit, the Hanafis, Shafi'is and Hanbalis do not allow it, since immediate payment may be the principal's interest; the Malikis make it suspended on approval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759}\n\nIf the principal said to sell for a thousand now and the agent sold for a thousand on credit, the sale is not binding but suspended on the principal's approval; this is al-Kasani's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760}\n\nBreach of the currency. If he is told to sell for dinars and sells for dirhams or for goods, the Hanafis, the Shafi'is and al-Qadi among the Hanbalis do not allow the sale, even if it is worth more, since permission in one kind is not permission in another. The sounder Hanbali view is that if he is told to sell for a dirham and sells for a dinar, it is valid, since that is customary: whoever accepts a dirham accepts its equivalent in dinars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} Al-Kasani holds the sale suspended, with the principal choosing between approval and cancellation. For the Malikis, where the two currencies are the currency of the town and of equal value, there are two views on whether the principal chooses or approves; otherwise he chooses on one view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} If he is told to sell for money and sells for cloth or other goods, the Hanbalis and Malikis hold it invalid, since goods are not a kind of price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761}\n\nBreach of the amount. If he sells for more than the price named, in the same currency, the majority hold the sale valid, since the breach is for the better; the Shafi'is add that it is refused if the principal has expressly forbidden the excess, and one Shafi'i view forbids it entirely, since the principal may have an interest in keeping his oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} If he sells for less than the price named, the Malikis make it suspended on the principal's approval: the principal may take back the goods if they remain, or their value if they are lost. The Shafi'is and one Hanbali narration void it, since the principal did not agree to part with his property on that terms. The settled Hanbali view validates the sale and makes the agent liable for the shortfall, and there are two Hanbali views on how the shortfall is measured. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}\n\nBreach of the place. If he names a place and the agent sells elsewhere, the Shafi'is, Hanbalis and Ibn Shas among the Malikis require keeping to it where the place carries a particular interest, such as a market known for good currency or high prices. Some Hanbalis and a Shafi'i view allow sale elsewhere where the two places are equal in interest. The Hanafis require keeping to the place, and the agent is liable if he breaks the rule; the principal is not bound by the sale. The Malikis make the sale suspended on approval, and the sounder Shafi'i view forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}\n\nBreach of the time. If a time is fixed and the agent sells at another time, the Hanafis, Shafi'is and Hanbalis forbid the sale and it does not bind the principal, since he may want the sale at the time of his need and not before or after; the Malikis let the principal choose between approving and rejecting it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}\n\nBreach of the named buyer. If the principal says 'sell only to him' and the agent sells to another, the majority (Hanafis, Shafi'is, Hanbalis) forbid it, whatever the price, since the principal may have an interest in that buyer and not another. The Shafi'is and Hanbalis allow it if the agent knows from a clear sign or from words that the principal has no interest in that buyer in particular. The Malikis let the principal choose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}\n\nSplitting the sale. If the agent sells part of the goods and leaves the rest, or sells part and then the rest later, the rule depends on whether splitting harms the principal. If it does not harm him, as with two houses or two animals, the sale is valid for the Hanafis, Shafi'is and Hanbalis, and the Hanbalis add that it is valid unless the principal forbade splitting. The Malikis state a general rule that whenever the agent departs from his principal's terms or from custom, the principal chooses between approving the sale and rejecting it, if the goods remain, and between approving and holding the agent liable if they are lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} If splitting harms him, the jurists give three views: the Shafi'is and Hanbalis void the sale; the Malikis, Abu Yusuf and Muhammad make it suspended, and it is completed if the agent sells the rest; Abu Hanifa lets the sale take effect against the principal, since the agent stands in his place and the principal owns part of the goods as he owns the whole. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764}\n\nBreach of the kind of object. If the agent sells a different thing in place of the named one, the sounder Shafi'i and Hanbali view voids the sale, because he has broken the terms of the permission; the Malikis, and a Hanbali narration, let the principal choose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764}\n\nAgency in purchase. It may be issued unrestricted, as in 'buy for me whatever you like'. The Hanafis, the Malikis and a narration of Ahmad allow it, since the principal has delegated his judgement; the Hanbalis in the school view and the Shafi'is forbid it, since the agent may buy what he cannot pay for. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} The agent buying for his principal from his own property or from those whose testimony cannot be accepted for him: the Hanafis forbid buying from himself even with permission, since rights in sale return to the agent and that would make one person both payer and payee; they forbid buying from his minor son even with permission. Abu Hanifa forbids buying from his father, grandfather, grown son or wife; Abu Yusuf and Muhammad allow it at the value or less, or at a small excess. If the agency is general, the Hanafis agree that buying is allowed, since the cause of the bar is suspicion, which general words remove. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766} The Malikis in the settled view and the Hanbalis in the school view forbid buying from his own property, and allow it if the principal permits; the Malikis allow buying from his relatives if there is no suspicion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} The Shafi'is forbid buying from his own property or from his minor son in every case, and in the sounder view allow buying from his adult, independent ascendants and descendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767}\n\nRestricted agency in purchase. It is valid, the Hanafis (on istihsan), the Malikis and the Hanbali school view agreeing, even if the kind of goods is not named: 'buy me a garment' is valid, by analogy with the partnership of profit. The Hanafis cite the Prophet's giving a dinar to Hakim ibn Hizam to buy a sacrifice, which shows that a small uncertainty does not stop agency, since agency rests on leniency and not on the strict bargaining of sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767}\n\nRestricted purchase and its breaches. If the principal ordered a purchase on deferred terms and the agent bought for cash, the majority (Hanafis, Malikis, one Shafi'i view and the school view of the Hanbalis) allow the purchase and make it bind the principal if the agent has not raised the price, since the breach is in form only and agrees in meaning. The Shafi'is in the settled view do not allow it, since the principal meant that he should have no debt; a Hanbali view forbids it where the principal is harmed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} If the agent bought on credit when told to pay cash, the Hanafis bind the agent alone, the Malikis give the principal the choice, the Shafi'is void the purchase if it was with the principal's own money, and the Hanbalis make it suspended on approval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}\n\nBreach of the kind of price in purchase. The Shafi'is and one Hanbali view void it. The school view of the Hanbalis allows exchanging dirhams for dinars and the reverse, since one who accepts a dirham accepts a dinar in its place, but not goods in place of the two coins. The Hanafis hold that if he was told to buy with dinars and buys with other goods, the purchase binds the agent only; on the view reported from al-Karkhi, the purchase is not binding on the principal for dirhams instead of dinars either. The Malikis make it suspended on approval, and there are two well-known views on whether dirhams in place of dinars bind the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}\n\nBreach of the amount of the price. If the breach is for the principal's advantage, such as buying a beast for less than the named price, the purchase binds the principal, since the breach is in form only. The Shafi'is and Hanbalis except the case where the principal forbade paying less. If the breach is to the principal's disadvantage, the Hanafis bind only the agent; the Malikis bind the principal for a small excess, such as one in twenty, and make a large excess suspended on his approval, binding the agent if he takes it on himself; the Shafi'is and one Hanbali view void it; the school view of the Hanbalis validates it and makes the agent liable for the excess. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}\n\nBreach of the object purchased. If the agent buys something other than what he was told, the Hanafis make the purchase fall on the agent and not bind the principal. The Malikis let the principal choose; if he rejects it, the purchase falls on the agent, who pays the price from his own money. The Shafi'is void it if he buys with the principal's money; if he buys on his own credit without naming the principal, it falls on the agent even if he intended the principal. The Hanbalis validate the purchase on the agent's credit, with two views on whether it binds the principal, and hold a purchase with the principal's money void on the sound view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773} The Shafi'is (on a name said in acceptance) hold that the name is ignored and the purchase falls on the agent in the sounder view, while the other view voids the contract.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772}\n\nBreach of the quantity bought. Where the agent buys more of the same thing than the principal ordered, for the same price, the Hanafis distinguish: for things valued individually (qiyyamiyyat), the excess does not bind the principal at all, since the price of each is unknown. For things measured by weight, Abu Hanifa, and Muhammad in some narrations, bind the principal only for the quantity ordered; Abu Yusuf and Muhammad bind him for all of it. The Hanbalis, and the Malikis in the view opposite the settled one (that of Asbagh), bind the principal if the agent buys two sheep for one dinar and each is worth a dinar; the Hanbalis add that it is valid if one of them is worth a dinar, while if neither is, it is invalid in the school view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774} The Shafi'is distinguish whether the principal described the sheep or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}\n\nSplitting the purchase. If the thing ordered may be split by custom without harm to the principal, all agree that the agent may buy part, and the principal is bound by what he bought; the Hanbalis and one Shafi'i view restrict this to the case where the principal did not say 'buy it all in one deal'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} If custom forbids splitting, or it harms the principal, the Hanafis and Malikis make the purchase suspended on the principal's approval. The majority of Hanafis hold that buying the rest before the principal sues the agent in court binds the principal, since the partial purchase was a means of carrying out the order; Zufar holds that the purchase falls on the agent alone. If the principal sues first and the judge binds the agent, a later purchase of the rest binds the agent alone, by Hanafi agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775}\n\nIf the principal orders the purchase of a described good, the agent may buy only a sound one, since an unqualified sale implies freedom from defects. If he buys a defective one, the Hanafis hold, by agreement, that it does not bind the principal where the description is not met: for example, a blind or a one-handed slave girl bought when he was told to buy a servant, or a stallion bought when he was told to buy a riding mount. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17776}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} If the principal named the goods, and the agent bought them defective without knowing it, the purchase binds the principal, who may return it. If the agent knew, it does not bind the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} The Hanafis add that if the agent takes the purchase and finds a defect while it is in his hand, he may return it; but if he has handed it to the principal, he may return it only with the principal's permission, since the agency has ended on delivery. If the agent accepts the defect, it binds him, and the principal may accept it or hold the agent liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}\n\nThe Malikis hold that the agent who buys a defective good knowingly is bound if he bought outright or on the seller's option; if he bought on his own option, it does not bind him and he may return it. The purchase binds the principal only if the defect is slight and customarily tolerated and the purchase is a bargain, as with a cheap beast with a short tail, unlike a noble beast with a cut tail, which does not bind him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} The Shafi'is, for a purchase on the agent's credit, hold that if the defective good is worth the price paid, and the agent did not know, the purchase falls on the principal; if he knew, the sounder view says it does not fall on the principal. If the defect makes it worth less than the price, the sounder view makes it bind the principal if he did not know, and not if he knew. If he bought with the principal's own money, it binds the principal if the agent did not know, and not if he did. If the principal expressly required soundness, al-Isnawi says it does not bind the principal, since it was not authorised. Either the principal or the agent may return the good, if the agent did not know of the defect, and the agent may not return it where the principal has accepted the defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778}\n\nThe Hanbalis: if the agent knew the defect, the purchase on his credit does not bind the principal; if he did not know, the purchase is allowed and both the agent and the principal may return it. The Azjiyy raised whether a purchase with the principal's money with knowledge of the defect falls on the principal; if the goods are equal to the price, the apparent view is that he accepts it, but he may not. If the principal named a defective item and the agent knew before buying, the agent may not buy it; if he buys, the purchase binds him and binds the principal only if the principal accepts; if he did not know, he may return it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17779}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780}\n\nThe agent and an invalid contract. If the principal authorised an invalid contract, the agent may not conclude a sound contract in its place; this is the view of the Shafi'is, Hanbalis, Muhammad and Zufar. Abu Hanifa and Abu Yusuf, by istihsan, allow the sound contract to bind the principal where it is better for him, as with an agent to sell for a thousand who sells for two thousand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}\n\nThe agent and the stipulation of an option. The Hanafis hold that if the principal ordered a sale with a three-day option for himself and the agent sold without it or with less, the sale is void and he is liable as a usurper. If he was told to stipulate an option of a month and stipulated three days, Abu Hanifa allows it by istihsan, but his two companions do not, since in their view the option of a month is valid with the sale. The Shafi'is hold that a sale on a stated option is void if the agent sells without it. The Hanbalis allow the agent to stipulate an option for himself and for his principal, but not for the other party, since that binds the principal to what he did not agree to. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}\n\nThe agent in litigation making an admission. The Malikis, Shafi'is, Hanbalis and Zufar do not allow it, since an admission ends the dispute, which the agent may not do, and the command to contend does not include its opposite. Abu Hanifa and Muhammad allow it before the judge only, excluding the hudud and retaliation; their analogy allows it elsewhere too, and Abu Yusuf allows it in every case. If the principal excluded admission, the admission is void and takes the agent out of the agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}\n\nSettlement, release, sale, gift and postponement by the litigation agent are not his, by agreement; the Hanafis add that he may not sell, give or postpone the right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}\n\nThe agent to collect a debt, when the debtor denies it. The Hanbali school view and one Shafi'i view make him an agent in litigation for proof, since he cannot collect without proving the right, so that this is permission by custom; the agent is so whether the right is a specific thing or a debt, and whether the principal knows the debtor's willingness to pay or his denial or delay. Abu Yusuf, Muhammad, the Malikis, one Hanbali view and one Shafi'i view deny him this power. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}\n\nPermission to collect is not permission to litigate, either in words or by custom, since a person one accepts for collecting need not be one accepted for litigation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} Abu Hanifa distinguishes the agent who collects a specific thing, who is not a party to the principal's dispute over a purchase or the like, from the agent who collects a debt, who is a party, since collecting a debt is an exchange that the litigation agent may conduct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} On whether an agent for litigation may collect what he was appointed to litigate over: the Shafi'is, the school view of the Hanbalis, Zufar, and the view reported from Abu Yusuf hold he may not, since a principal may accept a man for litigation whom he would not accept for collection. The other Hanafis, and one Hanbali view that Ibn al-Banna relied on, allow it, since whoever is appointed to a matter is appointed to complete it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}\n\nAppointment of another by a litigation agent. If the principal permits it, the agent may appoint another; if he forbids it, he may not. Where the principal says nothing, the Hanafis, Malikis and the school view of the Hanbalis forbid it, because people differ in eloquence and skill in litigation. The Malikis and Hanbalis limit this to matters that befit the agent himself; if the matter is beneath him or beyond his skill, he may appoint another, and the Malikis add that where the litigation is heavy he may appoint a partner to help him, though not another in his stead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786} Ibn Qudama says that where the agency is unrestricted, the agent may appoint another if the work is beneath the agent or beyond his capacity in volume; for work he can do himself, there are two narrations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} If two parties appoint one agent to litigate against each other, the Hanafis hold the appointment invalid; if the two appoint one agent against a third party, it is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}\n\nPayment of a debt by an agent. If the principal says 'pay it and do not take witnesses', the agent is not liable if the creditor denies payment; if the principal orders witnesses and the agent takes none, the agent is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} If he is told to pay without a stated instruction on witnesses and does not take witnesses, the Hanafis, Malikis, Shafi'is and the school view of the Hanbalis hold him liable, since he failed to take care; his word is not accepted against the creditor without proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} He is not liable if he paid in the principal's presence, by the Malikis, the school view of the Hanbalis and the sounder Shafi'i view, since the principal's silence is consent; a Shafi'i view holds him liable, since a neglect is not removed by the presence of the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}\n\nThe agent to collect a debt. Once he collects, the debtor is discharged, the money is the principal's and it is held by the agent as a trust, bound by the rules of a deposit. The agent to collect may not give the debt away, defer it or release it. The Hanafis add that he may not take a pledge for it, but may take a surety; the Malikis and Hanbalis add that he may not compromise over it without the principal's permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}\n\nDelivery of a right to one who claims to be an absent owner's agent. All agree that if the claimant proves the agency by evidence, the judge compels the debtor to pay him. If no evidence is given, the Malikis, Shafi'is and the school view of the Hanbalis hold that the debtor is not bound to pay the claimant unless he confirms the agency; if the debtor pays voluntarily and the creditor denies the agency, the creditor may recover from the payer only, and the payer may recover from the agent if the money is lost through his fault or neglect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790} The Hanafis distinguish a debt from a specific thing: if the debtor confirms the claimant's agency he is ordered to pay, and if he denies it, the agent alone is held to what he collected. When the absent owner later confirms the agency, the debtor is discharged; if he denies it, the debtor pays again and may recover from the agent if the money remains in his hand, and if it was lost in his hand the debtor may not recover from the agent unless he has made himself liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17791}\n\nIf the debtor proves that the claimant denied the agency and took the money from him, the proof is accepted, because it establishes that the claimant's right to the sum has ended by his own collection, and so the agent's hold is ended by necessity. If the right is a specific thing, such as a deposit, and the depositary confirms the claimant's agency, he is not ordered to deliver it, since that would be an admission that he surrendered another's property; a debt is different, and he is ordered to pay it, since he admits that the sum is the creditor's own property, debts being discharged by equal sums. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792} If the depositary hands the deposit to one who claims agency, it is lost in his hand and the owner denies the agency, the depositary is liable; he may make the owner swear, and he may not recover from the agent unless he made him liable at the time of delivery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}\n\nSeveral agents. The principal may appoint more than one agent for a particular disposal other than litigation. If he appoints them in one word at one time, none may act alone, unless the principal allows it. The Hanafis hold that where the disposal calls for judgement and counsel, such as sale, marriage and collecting a debt, none may act alone; where it does not, such as delivering a gift, returning a deposit or paying a debt, each may act alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793} Two agents for a sale, a marriage, a khul' or any contract with a sum in it likewise do not act alone, since the principal relied on the judgement of both. The two agents to collect a debt may not collect one without the other, though their collection is complete once what one collected reaches the other or the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794} The Hanafis and Malikis allow either of two agents appointed by separate words to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} For two agents in litigation, each may act alone according to the Hanafis (other than Zufar), one Hanbali view and one Shafi'i view, since litigation aims at informing the judge and the two voices confuse it; Zufar, the sounder Shafi'i view and the school view of the Hanbalis forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795}\n\nAn agent appointing another. With permission, it is allowed by agreement. With prohibition, it is not allowed by agreement. Where the principal says 'do as you like' or 'act on your judgement', the Hanafis, Malikis and Hanbalis allow it, while the Shafi'is forbid it, since such words admit many possibilities. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796} Where nothing is said, the majority forbid it, since the principal relied on the agent's judgement and people differ in judgement. Some allow two cases: where the work is beneath the agent or beyond his skill, and where he could do it himself but cannot do all of it because it is great in volume. In the second case, the school view of the Hanbalis and one Shafi'i view allow him to delegate all of it; the Malikis and the school view of the Shafi'is allow only the excess beyond his capacity. Ahmad and Ibn Abi Layla allow it in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17797}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}\n\nThe trust of the one an agent appoints. Whoever the agent appoints must be trustworthy, unless the principal named an untrustworthy person, in which case the agent follows the principal's choice. If the agent's appointee becomes a wrongdoer, the Hanbalis and one Shafi'i view require the agent to remove him, and the sounder Shafi'i view says the agent may not remove him, since he was allowed to appoint but not to remove. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}\n\nThe kind of agency the appointee holds. If the principal says 'appoint on my behalf' or 'delegate to him', the appointee is the principal's agent, is not dismissed by the first agent's removal, and both lose their office on the principal's death. If the principal says 'appoint on your behalf', the appointee is the first agent's agent, and falls with the first's removal or death; the Shafi'is and Hanbalis allow the principal to remove the sub-agent, since he is a branch of a branch. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} If the principal says only 'appoint', the Hanafis, Malikis, the sounder Shafi'i view and the school view of the Hanbalis make the appointee the principal's agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} Appointment without any permission is not valid according to the majority; Ahmad and Ibn Abi Layla validate it in one case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799}\n\nThe agent is a trustee for what is in his hand of his principal's property. It is like a deposit: he is not liable for a loss unless he transgresses or is negligent, whether he works for a wage or as a volunteer, since his hand is the principal's hand, and agency is a contract of kindness and assistance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800} As a trustee his word is accepted on his own discharge from liability with his oath, since agency rests on leniency and easy dealing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}\n\nStipulating liability or its absence. Ibn Qudama says that what is a trust does not become a liability by stipulation, and what is a liability cannot be removed by stipulation; a narration of Ahmad seems to allow removal of liability by stipulation, but the first view is the apparent school view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}\n\nTransgression and negligence. The agent is liable if he overloads a beast, wears a garment without permission, loses the money without knowing how, mixes the principal's money with his own so that it cannot be separated, refuses to return it without excuse, or delays return after the excuse has ended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} If the principal paid the debt himself and the agent then paid it too, the agent is not liable if he did not know; if he knew, he is liable, since the principal's payment was a removal of the agent that the agent knew of. Abu Hanifa holds the agent liable for a double payment of zakat whether he knew or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} If an agent to sell on credit delivers the goods before collecting the price and the buyer denies payment, he is liable for the goods' value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} If he delays paying the price he has received without excuse until it is lost, he is liable; with an excuse, he is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}\n\nIf he slaughters a beast by mistake and it dies unlawfully, he is liable, since error and intent are the same for people's property. If he was told to collect a deposit in full but collected part, he is liable, and the liability falls away if he collects the rest before the first part is lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}\n\nMeasure of liability. For a fungible thing he pays its like; for a thing valued individually he pays its value; if a fungible thing has no like, he pays its value. The value is taken on the day of transgression or loss, not any other day. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nDuty to account. The agent must give the principal the information he asks for about what he has done, and Ibn Hajar says that any trusted person who is asked for an account must give it; what counts is the answer and the claim, not the handwriting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nReturn of what is in the agent's hand. He must return to the principal what he holds. If he refuses when asked, without excuse, until it is lost, he is liable; and so if an excuse ends and he delays return until the loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nIf the principal and the agent agree on a wage, the wage is due by agreement. If they do not agree, the Hanafis distinguish: an agent who does not work for a wage acts as a volunteer, since the agency is originally gratuitous; an agent of a trade whose people work for a wage, such as a broker or a dealer, is due the customary wage. Article 1467 of the Majalla al-Ahkam al-'Adliyya states this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}\n\nWhen the wage is due. The agent earns it by handing over what was entrusted to him, where handing over is possible, as a cloth he weaves or sews; if he was appointed to sell, buy or perform the pilgrimage, he earns the agreed wage on completing the work, even if the price was not yet collected. But if the principal stipulated that the price be handed over first and the agent did not hand it over, he has no wage, since the condition failed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}\n\nConditions for the wage. The work must be known, the wage must be known in amount, the wage must not be part of the object of the agency according to some jurists, and the agent must carry out the agency validly. An unknown reward, such as 'a tenth of its price', gives only the customary wage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806} If the agent makes a defective sale, he has no reward, since a general permission to sell permits only a valid sale; if he makes a valid sale and the price is lost in his hand, he has the reward because the work was done. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}\n\nRecovery from the principal of what the agent paid. If the principal orders him to pay a debt and he pays from his own money, he recovers it whether or not the principal stipulated recovery. If the agent buys without the principal's money and pays the price from his own money, the Hanafis except Zufar let him hold the goods until he collects the price from the principal, since he is the contracting party to whom the price is due. Zufar says he may not hold them, since the goods are a trust in his hand. The liability for holding them is, for Abu Hanifa and Muhammad, like the liability of a seller; for Abu Yusuf, like a pledge; for Zufar, like usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}\n\nWhose rights a contract made by the agent concerns. Contracts are of two kinds: those that may be made in the agent's name, such as sale and hire, whose rights return to the agent, who delivers the goods, receives the price, and sues for the price as though he were the owner; and those that must be made in the principal's name, such as marriage, khul' and compromise over wilful killing, whose rights return to the principal, so that the husband's agent is not sued for the dower. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} The Shafi'is and a narration of Ahmad hold that the rights of every contract return to the agent; the school view of the Hanbalis holds that they return to the principal in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}\n\nIf the principal orders the agent to collect the price, the agent has the right to demand it, and the buyer is compelled to pay whichever of them he asks. If the principal forbids the agent to collect, the prohibition is valid; but if the buyer pays the price to the principal, he is discharged by istihsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} If the goods are seized from the buyer, he recovers the price from whichever of them he paid, the agent or the principal; and a defect is pursued against the agent if he is the one who received the goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}\n\nContracts that must be made in the principal's name, such as marriage, khul', manumission for a payment, writing of manumission and compromise over wilful killing, have their rights for and against the principal; the agent is a messenger and a conveyor. So the husband's agent is not sued for the dower, and the wife's agent may not receive it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} The Malikis hold that the agent in a sale sues for and collects the price, and the agent in a purchase receives and delivers the goods; he returns a defect if he did not know it, and is bound for the price unless he expressly disclaims it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}\n\nHow the effect of the contract reaches the principal. The majority (the sounder Hanafi and Shafi'i views, the Malikis and the Hanbalis) hold that the effect passes directly to the principal, since the contract was made for him. Al-Karkhi holds that it first falls on the agent and then passes to the principal. Abu Zayd holds that the agent is a deputy for the ruling and a principal for the rights. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}\n\nDisputes between agent and principal. On the existence of the agency, the principal's word is accepted, since the original state is that there is no agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} On its terms (a sale for a price or on credit, a particular object), the principal's word is accepted by the Hanafis, Malikis, Shafi'is and in one Hanbali view; the Malikis add two cases where the agent's oath prevails; the school view of the Hanbalis accepts the agent's word, since he is trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} On the loss of what the agent holds without negligence, the agent's word with oath is accepted by agreement, since he is a trustee and cannot easily prove the loss. The Malikis limit this to an agent who is not suspected; the Hanbalis to a hidden cause, such as theft; if the cause is evident, such as fire or plunder, the Hanbali judge (al-Qadi) requires proof of the event first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} On a claim of transgression or negligence in keeping, the agent's word with oath is accepted, since he denies what is alleged against him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812}\n\nDisputes over the sale and the collection of the price. The Hanafis work through cases, depending on whether the object was delivered to the agent or not. If the principal confirms the sale and the collection but not the loss or delivery, the agent's word with oath is accepted on the loss. If the principal denies the sale and the collection, the agent is believed about the sale but not about the collection as against the principal; the buyer may pay again to the principal and take the goods, or rescind; if the principal confirms the sale and the agent says the buyer paid the principal, the buyer is discharged on the agent's acknowledgement, but the agent is liable if he then cannot prove it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} The summary is compressed here. The Malikis hold that if the agent says 'I acted as you permitted', his word is accepted, since he is trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} The Shafi'is hold that if the dispute arises after the agent's removal, his word is not accepted without proof; if before, there are two views, the more accepted of which gives the principal's word; the other gives the agent's word where he can act alone (as in divorce and manumission) with oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} The Hanbalis in the school view accept the agent's word that he sold and collected and the price was lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nOn the claim to have returned what the agent holds, the majority accept the agent's word with oath, whether the agency is paid or not, according to the Hanafis and Malikis; the Shafi'is and Hanbalis require proof when he is paid, and accept his oath when he is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nThe end of agency. The first way is removal. Agency is a non-binding contract, so either party may end it by dismissal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nThe end of agency. The first cause is removal. The principal may dismiss his agent and forbid him the act, and the agent may dismiss himself; the jurists agree on this in general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}\n\nConditions for a valid removal by the principal. The first is that the agent knows of the removal. The Hanafis, a view of the Malikis, a Shafi'i view and a Hanbali narration require it, since removal dissolves the contract and cannot bind without knowledge. The majority of the Malikis, the sounder Shafi'i view and the school view of the Hanbalis do not. For the Hanafis, knowledge comes by being present at the removal, by the principal's letter, by a messenger (whether trustworthy or not, adult or minor), or by the report of two trustworthy men or one trustworthy man, and a report from an untrustworthy man counts if the agent believes it. Abu Hanifa holds that if the agent denies the report, he is not removed even if it proves true, since reporting a removal resembles testimony; Abu Yusuf and Muhammad disagree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818} The second is that no right of a third party is attached to the agency. The Hanafis hold that removal without the right-holder's consent is not valid, as with a pledge given to a creditor with the agent appointed to sell it, or with a defendant's agent in a suit appointed at the claimant's request. The Shafi'is allow removal if the agency was requested by the opposing party; the Malikis forbid removal once the agent has sat with the opponent three times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} The third is that the agency is not a hire, since a hired agency binds both parties. The fourth is that removal must not cause harm; the Shafi'i Sharwani says that removal is forbidden if it would let a wrongdoer seize the property of a ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}\n\nThe agent's removal of himself does not require the principal's knowledge, by the majority, except that the Hanafis require it where the agency is for litigation or the purchase of a named thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820}\n\nDeath. The agency ends on the death of the principal or of the agent, by agreement, since death ends capacity and the property passed to the heirs. The Hanafis, Shafi'is and the school view of the Hanbalis do not require the agent's knowledge of the death. The Malikis hold that if the person dealing with the agent was in the town of death and knew of the agency, the agent is not removed until he knows of the death; otherwise the agent is removed only on knowledge of the death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820}\n\nInsanity. The Hanafis end the agency by permanent insanity, taking a month according to Abu Yusuf and a year according to Muhammad; once it is permanent, the agency does not return on recovery. The Shafi'is and the school view of the Hanbalis end it by insanity; the Malikis do not, unless the principal's insanity is long, in which case the judge considers it; a Hanbali narration says it does not end. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17821}\n\nFainting. Most jurists do not end the agency by it; the sounder Shafi'i view does, by analogy with insanity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}\n\nInterdiction. The Hanafis hold that interdiction of the principal or the agent ends the agency, but specify that interdiction of the principal ends it only where the agency concerns contracts and litigation, not payment of debts or collection of a deposit. The Hanbalis end it by interdiction for prodigality, and by the principal's insolvency in what he is restrained from. The Shafi'is end it by interdiction for prodigality or insolvency in any disposal that does not take effect. The Malikis end it by the principal's narrow insolvency, a judicial order to take the debtor's goods for his creditors, not by general insolvency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}\n\nApostasy. The Hanafis hold that if the apostate is ruled to have joined the enemy's land, the agency ends and does not return on his return to Islam in the school view. His acts before joining are suspended in Abu Hanifa's view and binding in the view of Abu Yusuf and Muhammad. The Malikis hold that the agent is removed by his principal's apostasy after the period of asking to repent. The Shafi'is base the matter on whether the apostate's property passes out of his ownership, with several views, the most apparent being that it is suspended. The Hanbalis hold that the agency is not ended by the agent's apostasy in the school view, and is ended by the principal's apostasy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17824}\n\nImmorality (fisq). The Hanbalis hold that agency is not ended by the agent's immorality, except in matters that immorality contradicts, such as the offer in a marriage, where an agent is removed by his own or his principal's immorality. An agent for matters requiring trust, such as the agent of a guardian of an orphan or the administrator of an endowment, is removed by his own immorality or his principal's. The Shafi'is end it by the principal's immorality in matters that require integrity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}\n\nDrunkenness. The Shafi'is hold that if either party becomes drunk without fault the agent is removed; if by fault, the Shafi'is say it may or may not end the agency. The Hanbalis hold it does not end the agency except in matters it contradicts, such as the marriage offer. The Hanafis hold that it never ends the agency: an agent appointed to divorce who divorces while drunk has not divorced; an agent who sells while drunk does not bind the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}\n\nThe object leaving the principal's ownership. If the principal does the act himself, as by selling the goods before the agent does, or if the goods are claimed by another, or if he marries the woman himself, the agency ends. The Malikis hold that if the principal sold to one buyer and the agent sold to another, the first sale binds, and the second is an unauthorised sale, unless the second buyer has taken possession, in which case the second stands and the first is undone, unless the second buyer and seller knew of the first. The Hanbalis hold that the agent's admission that he received what he was appointed to collect ends the agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}\n\nIf the object returns to the principal. Muhammad holds that the agency returns, since what comes back by rescission is the first ownership with its rights; the Shafi'is and Abu Yusuf hold that it does not, since the principal's own act implies the agent's removal. Ibn 'Abidin says it returns if the ownership returns by rescission, not otherwise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827}\n\nThe agent's transgression in what he was appointed to do. The sounder Shafi'i view and the school view of the Hanbalis hold that agency is not ended by transgression, since the act was done by permission: the trust is lost by transgression, but the act stands, as with a pledge. The opposite Shafi'i view and one Hanbali view end it, since agency is a trust contract, like a deposit. Al-Mardawi says that if the agent destroys the thing he was appointed for, the agency ends, and if it remains, it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827}\n\nDenial. The Hanbalis and a view of the Hanafis hold that the agency is not ended by the agent's or principal's denial, since denial does not show a withdrawal of earlier permission; the Hanafi fatwa and one Hanbali view hold that it is ended. The Shafi'is hold that denial for forgetfulness or to hide something is not removal; if either denies deliberately with no reason, it removes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nLoss of the object. The agency ends when the object is lost, and when the woman whose divorce was entrusted dies. The Hanafis hold that the agency of two partners ends when they part, even if the agent does not know. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nCompletion of the act. The Hanafis hold that the agent is removed when the matter entrusted is completed, as when he collects a debt or contracts a marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nImplied withdrawal. The Hanbalis hold that agency ends by implied withdrawal of the principal, as by intercourse with a wife whose divorce he entrusted, or by implied withdrawal of the agent, as by accepting the agency to free a slave when he had been appointed to buy him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17829}"
