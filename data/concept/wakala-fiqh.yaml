label:
  ar: "وَكالة"
  en: "Wakala (agency, fiqh)"
  es: "Wakala (agencia, fiqh)"
  fr: "Wakala (agence, fiqh)"
  ur: "ایجنسی ⁦(فقہ)⁩"
  tr: "Ajans"
  id: "Agensi"
summary:
  ar: "الوكالة بالفتح والكسر في اللغة الحفظ، ومنه الوكيل في أسماء الله بمعنى الحافظ، ومنه التوكل، والتوكيل تفويض التصرف إلى الغير، وسُمّي الوكيل وكيلاً لأن موكّله فوّض إليه القيام بأمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} وفي الاصطلاح تعددت التعريفات: فعرّفها الحنفية بأنها إقامة الغير مقام نفسه في تصرف جائز معلوم، ترفّهاً أو عجزاً؛ وعرّفها المالكية بأنها نيابة ذي حق، غير ذي إمرة ولا عبادة، لغيره فيه غير مشروطة بموته؛ وعرّفها الشافعية بأنها تفويض شخص ما له فعله مما يقبل النيابة إلى غيره ليفعله في حياته؛ وعرّفها الحنابلة بأنها استنابة جائز التصرف مثله فيما تدخله النيابة من حقوق الله وحقوق الآدميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nيفرّق الكتاب بين الوكالة وألفاظ قريبة منها: النيابة، وهي قيام الإنسان عن غيره بفعل أمر، وهي عند بعضهم أعم من الوكالة، وعند آخرين مترادفة؛ والولاية، وهي تنفيذ القول على الغير شاء أو أبى، وهي نيابة شرعية أو إجبارية، بينما الوكالة نيابة اتفاقية؛ والإيصاء، وهو إقامة الإنسان غيره مقام نفسه في التصرف بعد الموت، بينما الوكالة في الحياة؛ والقوامة، وهي ولاية يفوضها القاضي إلى راشد للتصرف لمصلحة القاصر، أو ولاية الزوج على زوجته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nاتفق الفقهاء على مشروعية الوكالة، واستدلوا عليها بالقرآن: بقصة أصحاب الكهف في بعث أحدهم بورقهم إلى المدينة، وبآية الحكمين في سورة النساء، والحكم وكيل عن الزوجين على رأي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} وبالسنة: حديث عروة بن أبي الجعد البارقي الذي أعطاه النبي ديناراً ليشتري به شاة، وحديث حكيم بن حزام في شراء الأضحية، وحديث جابر في الوكيل بخيبر، وحديث أبي رافع في زواج النبي بميمونة وكان الرسول بينهما؛ وأجمع الفقهاء على جوازها من عصر النبي إلى اليوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} واستدلوا بالمعقول، وهو أن الحاجة داعية إليها، لأن الإنسان قد يعجز عن المباشرة بنفسه لمرض أو كبر أو وجاهة، فلو لم تجز لوقع الحرج المنفيّ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nأركان الوكالة. يرى جمهور الفقهاء أنها الصيغة والعاقدان ⁦(الموكل والوكيل)⁩ ومحل العقد ⁦(الموكل فيه)⁩، ويرى الحنفية أن ركنها الإيجاب والقبول، لأن وجودهما يستلزم الركنين الآخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} والصيغة هي الإيجاب والقبول، يُعبّر بهما عن التراضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nالإيجاب. يرى الجمهور أنه ما يصدر من الموكل ويدل على إذنه بالتوكيل، ويرى الحنفية أنه ما صدر أولاً من أحد المتعاقدين للدلالة على رغبته في إنشاء العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} ويتحقق بكل ما يدل على الرضا بالوكالة، باللفظ أو الكتابة أو الرسالة أو إشارة الأخرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} فمن اللفظ الصريح: وكلتك، أو فوضت إليك، أو أنبتك، أو أذنت لك، أو أقمتك مقامي، أو أنت وكيلي؛ وأما الأمر كقوله بعه، فيصح عند الحنفية والشافعية والحنابلة، وعند المالكية إذا جرى العرف به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} أما ألفاظ «سأوكلك» و«أوكلك» و«قد عولت عليك» و«قد اعتمدت عليك» فلا تنعقد بها الوكالة عند الشافعية لاحتمالها، إلا أن يُضم إليها لفظ صريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nوتنعقد الوكالة بالرسالة عند الحنفية والمالكية والشافعية، ويكون الوكيل وكيلاً متى بلغه الخبر وقبل، سواء كان المخبر عادلاً أو غير عادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} ويتحقق الإيجاب بالكتابة المستبينة، وبالإشارة المفهومة من الأخرس، وبالفعل الدال على الإذن عند الحنابلة، وبما جرت العادة باعتباره إيجاباً عند المالكية، كتصرف الزوج في مال زوجته وهي عالمة ساكتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} ولا يكون السكوت إيجاباً عند الحنفية والشافعية والحنابلة؛ فمن رأى أجنبياً يبيع ماله فسكت لم يصبح وكيلاً بسكوته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nالقبول. يتحقق باللفظ، كأن يقول الوكيل قبلت، أو بكلام يشعر بالقبول؛ وزاد الحنفية والشافعية أنه لا بد ألا يرده الوكيل، فإن رده بعد الإيجاب لم تنعقد الوكالة وإن قبل بعد ذلك، ما لم يجدد الإيجاب والقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} وفي القبول بالفعل ثلاثة آراء: الجمهور ⁦(الحنفية والمالكية والشافعية في أصح الوجهين والحنابلة)⁩ يرون أنه يتحقق بكل فعل دال عليه، كفعل الوكيل ما أمره به الموكل؛ والشافعية في وجه والحنابلة في قول وزفر من الحنفية يرونه لا يتحقق إلا باللفظ؛ والشافعية في وجه ثالث يفرّقون: إن كانت صيغة الإيجاب أمراً كقوله «بع واشترِ» تحقق القبول بالفعل، وإن كانت صيغة عقد كـ«وكلتك» فلا بد من اللفظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} ويصح القبول بالكتابة المستبينة المعنونة، وبإشارة الأخرس المعلومة، وعند الحنفية يكون سكوت الوكيل قبولاً ويرتد برده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nوإذا تراخى القبول عن الإيجاب، فجمهور الفقهاء ⁦(الحنفية والحنابلة والشافعية في المذهب والمالكية في أحد القولين)⁩ يصححونه، لأن الإذن قائم ما لم يرجع عنه الموكل، فأشبه الإباحة؛ وقيّد الشافعية ذلك بألا يتعين زمان العمل، فإن تعين وخيف فواته كان القبول على الفور، وكذا إذا عرضه الحاكم عليه عند ثبوتها عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وذهب المالكية في القول الثاني وأبو حامد المروروذي من الشافعية إلى أن القبول على الفور، لأن الوكالة عقد في حال الحياة فيكون القبول فيه على الفور كالبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وقال المازري إن التحقيق يرجع إلى القصد والعوائد: هل المراد من هذه الألفاظ استدعاء الجواب فوراً، أم معجلاً أو مؤجلاً؟ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nأقسام صيغة الوكالة بحسب وقت ترتّب آثارها: المنجّزة، وهي ألا تكون معلقة بشرط ولا مضافة إلى وقت، والمعلقة، والمضافة إلى المستقبل، والموقتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nالصيغة المنجزة، وهي ألا تُعلّق بشرط ولا تُضاف إلى وقت، كقول الموكل «وكّلتك ببيع الدار الفلانية»، وهي صحيحة باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nالصيغة المعلقة على شرط. اختلف الفقهاء في صحتها على رأيين. الأول، للحنفية والحنابلة على الصحيح عندهم وللشافعية في مقابل الأصح، أنها صحيحة، كقول «إذا قدم الحاج فبع هذا الطعام»، واستدلوا بحديث ابن عمر في إمرة زيد بن حارثة في غزوة مؤتة، ثم جعفر، ثم عبد الله بن رواحة إن قُتل من قبله، ولأنه عقد اعتبر في حق الوكيل حكمه وهو إباحة التصرف، فهو أشبه بالوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} والثاني، للشافعية في الأصح وللحنابلة في قول، أنها فاسدة؛ قال الماوردي إن تعليق الوكالة بالشروط والآجال فاسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} وأجاز الشافعية أن ينجز الموكل الوكالة ويشترط للتصرف شرطاً، كقوله «بعها بعد شهر»، لأن ذلك تأخير لا تعليق؛ ونقل الغزالي عن العراقيين أن قدوم فلان أو مضي شهر شرط للتصرف لا للعقد فيجب على الوكيل الامتثال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nالصيغة الدورية، وصورتها أن يقول الموكل «وكّلتك ببيع هذا المال، وكلما عزلتك فأنت وكيلي»، فتتجدد الوكالة كلما عُزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} وصحّحها الحنفية والحنابلة على الصحيح، بناءً على أن الوكالة تقبل التعليق، ويملك الموكل عزل الوكيل متى شاء عند الحنفية؛ ويحصل العزل عند الحنابلة بقول الموكل «عزلتك، وكلما وكلتك فقد عزلتك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} ومنع ابن تيمية صحتها لأنها تجعل العقد الجائز لازماً، والمقصود من التعليق المنع من التوكيل لا فسخ عقد قبل انعقاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} وقال الشافعية في صحتها في الحال وجهان، أصحهما الصحة، فإن عزله ولم يعلم الوكيل أو علم، ففي عوده بعد العزل وجهان، أصحهما المنع؛ وإن قال «كلما عزلتك» تكرر العود أبداً، وإن قال «إذا» أو «متى» فمرة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المضافة إلى المستقبل، كقول الموكل «وكّلتك على أن تبيع دوابي في شهر رمضان» أو «وكّلتك في بيع هذه الدار غداً»، وقد أجازها الحنفية والحنابلة، ويُقرّ الحنفية أن الوكيل يصبح وكيلاً من الغد فما بعده لا قبله، ويوافقهم الشافعية لأن الوكالة نُجّزت في الحال وعُلّق التصرف على وقت في المستقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المعلقة على وقت، كقوله «إذا جاء رأس الشهر فقد وكّلتك في بيع داري»، وهي باطلة في الأصح عند الشافعية لأن تعليق الوكالة بالآجال فاسد، وصحيحة عند الحنفية والحنابلة والشافعية في مقابل الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} وفرّق الحنفية بين الإضافة والتعليق: فالمضاف سبب ينعقد به العقد في الحال مع تأخّر حكمه إلى الوقت، أما المعلّق ففيه مانع من أن يكون سبباً للحكم في الحال، فلا تنعقد الوكالة إلا عند وجود الشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المؤقتة، كقوله «أنت وكيلي شهراً»، وهي صحيحة عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} واختلفوا في بقائها بعد الوقت: فالشافعية لا تبقى بعده. وعند الحنفية روايتان فيمن وُكّل ببيع الدار «اليوم» فباعها غداً، فقيل الصحيح أنها لا تبقى، وقيل تبقى لأن ذكر اليوم للتعجيل لا للتوقيت؛ ونقل صاحب منحة الخالق عن البزازية أن الوكالة إلى عشرة أيام لا تنتهي بمضيّ العشرة في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}\n\nاقتران الوكالة بشرط. إن كان الشرط فاسداً، فذهب الحنفية وأحمد في أظهر روايتيه وابن أبي ليلى إلى أن الوكالة لا تبطل بأي شرط فاسد، وذهب الشافعية إلى أن الشرط الفاسد يُفسد الوكالة، كأن يقول الموكل «امنع المبيع من المشتري»، لأن منع الحق عمّن يستحق إثبات اليد عليه حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} وقال الزركشي إن العقود الجائزة كالشركة والوكالة والمضاربة، فاسدها لا يمنع نفوذ التصرف فيها بالإذن، لكن خصائصها تزول بفسادها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} وفائدة الفساد سقوط المسمى من الأجرة والرجوع إلى أجرة المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} ورأى بعض الحنابلة أن الوكالة تبطل كالوديعة لزوال الائتمان، وقال أبو محمد الشافعي إن الإذن ليس منفصلاً عن الوكالة فمعنى فسادها بطلان الإذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}\n\nصفة عقد الوكالة، أي هل هو لازم أو جائز. الرأي الأول، للحنفية والشافعية والحنابلة وبعض المالكية، أنها عقد جائز من الجانبين لأنها تبرّع لا لزوم فيه، فقد يرى الموكل المصلحة في ترك ما وكّل فيه أو في توكيل غيره، ولأن الوكيل قد لا يتفرغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} واستثنى الحنفية والمالكية ما إذا تعلّق بالوكالة حق الغير، فتلزم، كوكيل الخصومة بطلب الخصم، والوكيل ببيع الرهن في حضور المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} وقال الحنفية إن على عدم لزومها تتفرع ثلاث مسائل: لا يدخلها خيار الشرط، ولا يُحكم بالوكالة مقصودة، وللوكيل أن يستقيل منها متى أراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} الرأي الثاني، إن كانت بأجرة على سبيل الإجارة فهي لازمة من الطرفين، ويجب أن تجتمع فيها شرائط الإجارة، وبهذا صرح الشافعية والمالكية في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} الرأي الثالث، لبعض المتأخرين من المالكية، أنها لازمة من جانب الوكيل وإن كانت بغير أجرة، قياساً على لزوم الهبة وإن لم تُقبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} وإن كانت على سبيل الجعالة ففيها ثلاثة أقوال عند المالكية: اللزوم من الطرفين، والجواز من الطرفين وهو المعتمد عند الشافعية، واللزوم من جهة الجاعل دون المجعول له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nالركن الثاني: العاقدان، وهما الموكل والوكيل. أولاً: الموكل، وهو من يقيم غيره مقام نفسه في تصرف جائز معلوم، ويُشترط أن يملك ذلك التصرف وأن تلزمه أحكامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} واتفق الفقهاء على أنه لا تجوز الوكالة من المجنون والمعتوه والمغمى عليه والنائم والصبي غير المميز مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nيجوز توكيل الصبي المميز في التصرفات النافعة له نفعاً محضاً باتفاق، أما التصرفات الدائرة بين النفع والضرر فتصح عند الحنفية والمالكية والحنابلة بإذن الولي، وأبطلها الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} ولا تجوز الوكالة من السفيه المحجور عليه فيما لا يستقل به، ويجوز فيما يستقل به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nولا يجوز عند جمهور الفقهاء توكيل المرأة في النكاح، لأنها لا تزوج نفسها فلا توكل فيه، وأجازه الحنفية، وأجازه المالكية في بعض الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nوفي توكيل المرتد ثلاثة أقوال: الأول، لجمهور الفقهاء ⁦(الشافعية في أظهر الأقوال، والحنابلة، وأبي حنيفة)⁩، أنها متوقفة على عودته إلى الإسلام، فإن أسلم نفذت، وإن مات أو قُتل أو لحق بدار الحرب مرتداً بطلت؛ والثاني، للصاحبين وللشافعية في قول، أنها صحيحة نافذة، وزاد الحنفية أن المرتدة يجوز توكيلها باتفاقهم؛ والثالث، للشافعية في قول استوجهه زكريا الأنصاري والشبراملسي، أنها باطلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nوفي توكيل المسلم الذمي في بيع الخمر والخنزير: ذهب الشافعية والمالكية والحنابلة والصاحبان إلى أنه لا يصح، لأن شرط الوكالة أن يملك الموكل التصرف الذي يوكّل فيه، والمسلم لا يملك بيعهما، وفاقد الشيء لا يعطيه؛ وذهب أبو حنيفة إلى الصحة، لأنه يكفي أن يكون للموكل أهلية أداء تخوّله توكيل الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nوفي توكيل المحرم لحلال في النكاح: لا يجوز عند جمهور الفقهاء لأنه لا يباشر العقد حال إحرام الموكل، وأجازه الحنفية مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} ونص الحنابلة على أنه لا تصح الوكالة إذا لم يعرف الوكيل موكله، بأن قيل له «وكّلك زيد» ولم يُنسب ولم يُوصف بما يميّزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nالوكيل. يشترط فيه ما يشترط في الموكل من العقل، فلا يجوز توكيل المجنون والمعتوه والصبي غير المميز باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} وفي اشتراط البلوغ: الحنفية والحنابلة أجازوا وكالة الصبي المميز الذي يعقل العقد ويقصده، وتعود حقوق العقد إلى الموكل لا إليه، وحجتهم أثر أن النبي زوّج أم سلمة بعمرو بن أم سلمة وكان صبياً؛ ومنعه الشافعية لأنه غير مكلف ولا يملك التصرف في حق نفسه فلا يملكه في حق غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} ويشترط أن يكون الوكيل معيناً، فإذا قال شخص «وكّلت أحد الناس في بيع سلعة» بطلت الوكالة لجهالة الوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} وذكر ابن نجيم أن قول الدائن لمدينه «من جاءك بعلامة كذا فادفع ما لي إليه» توكيل مجهول لا يصح، فلا يبرأ المدين بالدفع إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17739}\n\nعلم الوكيل بالوكالة. عند الحنفية العلم بالتوكيل في الجملة شرط، إما علم الوكيل وإما علم من يعامله؛ فلو باع الوكيل قبل علمه وعلم المشتري بالتوكيل لم يجز البيع حتى يجيزه الموكل أو الوكيل بعد العلم. وإذا أخبره بالوكالة عدل صار وكيلاً عند الإجماع، فإن أخبره واحد غير عدل فصدّقه صار وكيلاً، وإن لم يصدّقه فليس بوكيل عند أبي حنيفة، وهو وكيل عند أبي يوسف ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وذهب الحنابلة إلى عدم اشتراط العلم، لأن الاعتبار في العقود بما في نفس الأمر، وهو ما يؤخذ من الأظهر عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وعدالة الوكيل لا تشترط في الجملة، إلا في عقود معينة كالنكاح، وذكورته لا تشترط في الجملة إلا في بعض العقود كالنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}\n\nمحل الوكالة، وهو التصرف المأذون فيه من الموكل للوكيل بملك أو ولاية. وشرطه عند الشافعية ثلاثة: أن يكون معلوماً من بعض الوجوه، وأن يقبل النيابة، وأن يملكه الموكل حال التوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وتنقسم الوكالة باعتبار المحل إلى خاصة وعامة. فالخاصة ما كان فيها التوكيل بتصرف معين، ولا يتصرف الوكيل إلا فيه باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} والعامة، ففيها خلاف: الحنفية والمالكية يجيزونها في الجملة مع تفصيل، فقال الحنفية إن قوله «أنت وكيلي في كل قليل وكثير» وكالة بالحفظ فقط، وإن قال «في كل شيء جائز أمرك» صار وكيلاً في جميع التصرفات المالية كالبيع والشراء والهبة والصدقة، واختلفوا في الطلاق والعتاق والوقف، والمفتى به عندهم أنه لا يملكها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} وقال المالكية لا تنعقد بمجرد قوله «وكلتك»، بل يُفوَّض الأمر تفويضاً، وما كان فيه تنمية المال جاز، وما كان كالعتق والهبة والصدقة لثواب الآخرة لا يجوز إلا بإذن صريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} أما الشافعية والحنابلة فلا يصحون التوكيل العام، لكثرة الغرر، فلا يصح قوله «وكلتك في كل قليل وكثير لي»، ويصح قوله «وكلتك في بيع أموالي وقبض ديوني» وإن جُهلت الأموال والديون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}\n\nضابط ما يصح أن يكون محلاً للوكالة: كل عقد جاز أن يعقده الإنسان بنفسه جاز أن يوكّل فيه غيره، لأن الإنسان قد يعجز عن المباشرة لبعض الأحوال فيحتاج إلى التوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} وقد اتفق الفقهاء على جواز التوكيل في البيع والشراء، لأن الحاجة داعية إليه، وفعل النبي ذلك حين وكّل عروة البارقي في شراء الشاة، ودفع إلى حكيم بن حزام ديناراً ليشتري به أضحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} واتفقوا أيضاً على جواز التوكيل في الحوالة والرهن والكفالة والشركة والوديعة والمضاربة والجعالة والمساقاة والإجارة والقرض والوصية والفسخ والإبراء والمصارفة والإقالة والشفعة، لأنها في معنى البيع في الحاجة إلى التوكيل؛ وكذلك في الضمان والصلح والهبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743}\n\nاتفق الفقهاء على صحة التوكيل في عقد النكاح من الرجل، واستدلوا بتوكيل النبي عمرو بن أمية وأبا رافع في قبول النكاح له، وبأن الحاجة داعية إليه إذ قد يحتاج الموكل إلى الزواج من مكان بعيد لا يستطيع السفر إليه، وبزواج النبي أم حبيبة وهي يومئذ بأرض الحبشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nواتفقوا على جواز التوكيل في العبادات المالية كالزكاة والصدقات والمنذورات والكفارات، لأن النبي بعث عماله لقبض الصدقات وتفريقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} واتفقوا على جواز التوكيل في الطلاق والرجعة والخلع، لأن الحاجة إليه كالحاجة إلى التوكيل في البيع والنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nما لا يصح التوكيل فيه باتفاق. الشهادة: لا يجوز التوكيل فيها، لأنها تتعلق بعين الشاهد فيما رآه أو سمعه، ولأنها مبنية على التعبد واليقين؛ فإن استناب فيها كان النائب شاهداً على شهادته يؤدي ما سمع من شاهد الأصل لا وكيلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} والأيمان والنذور، لأنها تتعلق بعين الحالف والناذر، وكذلك اللعان والإيلاء والقسامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والمعاصي كالقتل والسرقة والغصب والقذف، لأنها محرمة لا يصح فعلها من الموكل ولا من الوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والعبادات البدنية المحضة كالصلاة والصيام والطهارة من الحدث، لأنها تتعلق ببدن من وجبت عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745}\n\nما اختلف فيه. الحج: لا يجوز التوكيل فيه لمن يقدر على الحج بنفسه، أما العاجز فتفصيله في موضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والعمرة: يجوز في الجملة أداؤها عن الغير بالوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والنكاح من المرأة: جمهور الفقهاء يمنعون أن توكل المرأة في الزواج أو تتوكل فيه، والحنفية يجيزونه للحرة البالغة العاقلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} والظهار: منعه الجمهور، وأجازه الشافعية في مقابل الأصح، ورأى ابن عبد السلام من المالكية أنه كالطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} وتحصيل المباحات كإحياء الموات والاصطياد وحفر المعدن: أجازه المالكية والشافعية في الأظهر والحنابلة، ومنعه الحنفية وبعض الشافعية والحنابلة لأن الملك للوكيل بوضع اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} والإقرار بالحقوق: أجازه الحنفية والمالكية والحنابلة والشافعية في مقابل الأصح، ومنعه الشافعية في الأصح والطحاوي لأنه إخبار عن حق كالشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747}\n\nالخصومة: أجازها المالكية والشافعية والحنابلة والصاحبان في الدين والعين وسائر الحقوق، حاضراً كان الموكل أو غائباً، رضي الخصم أو لم يرضَ، واستثنى المالكية ما إذا كان الوكيل عدواً للخصم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} واستدلوا بأن علي بن أبي طالب وكّل عقيلاً عند أبي بكر، وبأن الحاجة داعية إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} وقال أبو حنيفة لا تجوز الوكالة بالخصومة إلا برضا الخصم، إلا إذا كان الموكل مريضاً أو غائباً مسيرة ثلاثة أيام فأكثر، لأن حضور الموكل لمجلس الحكم حق لخصمه؛ ووجهه أن الدعوى خبر يحتمل الصدق والكذب، فلا يلزم جوابه إلا للضرورة، والضرورة قائمة عند مرض الموكل أو سفره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} وذكر الجصاص أنه لا فصل في ظاهر الرواية بين الرجل والمرأة، واستحسن المتأخرون توكيل المرأة المخدّرة، وقال ابن أبي ليلى لا يجوز إلا توكيل البكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}\n\nإثبات القصاص واستيفاؤه: أجاز المالكية والشافعية والحنابلة وأبو حنيفة ومحمد بن الحسن التوكيل في إثباته، وخالف أبو يوسف فلم يجزه إلا من الموكل لأن الشبهة يُتحرز عنها في الحدود والقصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} وفي استيفاء القصاص: المالكية والشافعية والحنابلة في المذهب أجازوه في حضرة الموكل وغيبته؛ والحنفية وبعض الشافعية والحنابلة لا يجيزونه إن كان الموكل غائباً لاحتمال العفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749}\n\nإثبات الحدود واستيفاؤها: الحنابلة في المذهب أجازوا التوكيل في إثبات حد الزنا مستندين إلى قصة أُنيس، وقال أبو الخطاب منهم لا يصح؛ والشافعية لا يجيزونه في حدود الله إلا حد القذف لأن الحق لله وقد أُمر بالدرء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} وفي الاستيفاء أجازه المالكية والشافعية والحنابلة، واستدلوا بأمر النبي برجم ماعز وبتوكيل عثمان علياً في إقامة حد الشرب على الوليد بن عقبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} وقال الحنفية إن حقوق الله نوعان، فالإثبات: لا يجوز التوكيل فيما لا يحتاج إلى خصومة كحد الزنا والخمر، ويجوز فيما يحتاج إليها كحد السرقة والقذف عند أبي حنيفة ومحمد، ومنعه أبو يوسف؛ والاستيفاء في القذف والسرقة يجوز إن كان المقذوف أو المسروق منه حاضراً، واختلف مشايخهم إن كان غائباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nأحكام الوكالة. تتعلق بالوكيل بأن ينفذها في الحدود التي أذن بها الموكل أو قيّده الشرع أو العرف، وأن يوافي الموكل بالمعلومات الضرورية ويقدم حساب الوكالة، وأن يرد ما للموكل في يده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} والوكالة الخاصة تصدر مطلقة وتصدر مقيدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} ومن صورها الوكالة بالبيع، فعند أبي حنيفة الوكيل بالبيع المطلق لا يتقيد بقيد إلا إذا كان متهماً، فيملك البيع بالقليل والكثير وبالنقد والنسيئة وبالعرض، لأن الأصل في اللفظ المطلق أن يجري على إطلاقه، ولأن البيع بغبن فاحش لغرض شراء ما هو أربح متعارف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nالوكالة المطلقة في البيع. اختلف الفقهاء في تقييدها على رأيين. الأول لأبي حنيفة، وهو أن الوكيل المطلق لا يتقيد بأي قيد إلا إذا كان متهماً، فيملك البيع بالقليل والكثير وبالنقد والنسيئة وبالعرض، لأن اللفظ المطلق يجري على إطلاقه، ولأن البيع بغبن فاحش لغرض شراء ما هو أربح متعارف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} والثاني لجمهور الفقهاء ⁦(المالكية والشافعية والحنابلة)⁩ وهو أن الوكيل المطلق مقيد بقيود، منها: أن يبيع بنقد البلد، لأن إطلاق النقد ينصرف إلى نقد البلد، وأن يبيع بثمن المثل فيما لا يتغابن الناس بمثله، فإن باع دونه فعند المالكية يخير الموكل ولو يسيراً، واليسير نصف العشر فأقل، وعند الحنابلة يصح البيع ويضمن الوكيل النقص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} ومنها أن يبيع بالنقود لا بالعرض عند المالكية والحنابلة والصاحبين، وأن لا يبيع نسيئة عند المالكية والشافعية والحنابلة، ويتخرج عند الحنابلة جواز ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} وأن لا يبيع بمنفعة عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}\n\nبيع الوكيل لنفسه. جمهور الفقهاء ⁦(الحنفية والشافعية والحنابلة في المذهب والمالكية في المعتمد)⁩ يمنعون ذلك، لأن العرف في البيع أن يبيع الإنسان من غيره، ولأن فيه تهمة؛ وأجازه المالكية والحنابلة إذا أذن له الموكل، واستثنى المالكية ما إذا تناهت الرغبات أو كان البيع بحضرة الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعن أحمد رواية بالجواز إذا زاد على الثمن في النداء وتولى النداء غيره، ورأى القاضي أن الثاني قد يكون واجباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعند المالكية في قول: يجوز إن لم يحاب نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754}\n\nبيع الوكيل لمن لا تُقبل شهادته له. عند الحنفية إن باع ممن لا تُقبل شهادته له بأكثر من القيمة جاز، وبأقل بغبن فاحش لا يجوز بالإجماع، وبمثل القيمة فيه روايتان؛ وأجاز الصاحبان البيع منهم بمثل القيمة إلا من عبده أو مكاتبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعند المالكية على المشهور لا يجوز للوكيل أن يبيع لمحجوره من صغير أو سفيه أو رقيق غير مأذون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} وعند الشافعية لا يجوز أن يبيع لولده الصغير ولو أُذن له، والأصح جواز بيعه لأصوله ولفروعه غير المحجورين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} وعند الحنابلة في المذهب لا يجوز أن يبيع لولده أو والده أو مكاتبه، ويجوز في الوجه الثاني، ومحل الخلاف إن لم يأذن الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755}\n\nالوكالة المقيدة في البيع. يلتزم الوكيل بقيود موكله باتفاق. قال الحنفية إن الوكيل إذا خالف قيد موكله لا ينفذ على الموكل إلا بإجازته، إلا أن يكون الخلاف إلى خير، فيكون ذلك موافقة معنى. فإذا قال «بع ثوبي بألف درهم» فباعه بأقل أو بغير الدراهم لم ينفذ، وإن باعه بأكثر نفذ، وإن قال «بع نسيئة» فباعه حالاً نفذ، وإن أمره بالحلول فباعه نسيئة توقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} ورأى المالكية أن الزيادة في البيع أو النقص في الشراء لا توجب الخيار، لأن ذلك مما يرغب فيه، وأن المخالفة لا توجب الخيار إلا إذا تعلق بها غرض صحيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} وقال الشافعية والحنابلة: لا يملك الوكيل من التصرف إلا ما يقتضيه الإذن نطقاً أو عرفاً، فإن كان في أحد التصرفين ضرر بالموكل امتنع، لقوله «لا ضرر ولا ضرار»، وإن كان فيه نظر له لزم، وهو مقتضى النصيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} والإذن المقيد بزمان لا يتعداه، والمقيد بمكان يتعلق به غرض، والمقيد بمشترٍ معين لا يتعدى إلى غيره إلا إذا علم الوكيل أن الموكل لا غرض له في عينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}\n\nمخالفة الوكيل في الثمن. في الوصف: إذا أمره ببيع نسيئة فباع حالاً، فجمهور الفقهاء يجيزون البيع وينفذ في حق الموكل لأن الموكل حصل مقصوده وزاده الوكيل خيراً؛ ويرى الحنابلة في قول أنه إن كان للموكل غرض معين في التأجيل بطل البيع، ومنعه الشافعية إن كان للموكل غرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} وإذا أمره ببيع نسيئة بثمن محدد فباعها نقداً بأقل، فالحنفية والشافعية والحنابلة لا يجيزون البيع، والمالكية يجعلونه موقوفاً على إجازة الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} وإذا أمره بالحلول فباع نسيئة، فالحنفية والشافعية والحنابلة لا يجيزون البيع لأن للتعجيل غرضاً، والمالكية يجعلونه موقوفاً على الإجازة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759}\n\nوللشافعية والحنابلة أن الوكيل لا يملك من التصرف إلا ما يقتضيه إذن الموكل نطقاً أو عرفاً، فإن كان في أحد التصرفين ضرر بالموكل امتنع، وإن كان فيه نظر له لزم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} والإذن المقيد بزمان لا يتعداه، والمقيد بمكان ذي غرض لا يُتعدّى إلى غيره، والمقيد بمشترٍ معين لا يُتعدى إلى غيره إلا إذا علم الوكيل أن الموكل لا غرض له في عينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}\n\nإذا أمره ببيع السلعة حالاً بألف فباعها بألف نسيئة لم ينفذ، بل يتوقف على إجازة الموكل، وهذا قول الكاساني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760}\n\nمخالفة الوكيل في جنس الثمن. إذا أمره ببيع السلعة بالدنانير فباعها بالدراهم أو بالعروض، فالحنفية والشافعية والقاضي من الحنابلة لا يجيزون البيع وإن كانت قيمته أكثر، لأن الإذن في جنس ليس إذناً في جنس آخر؛ ويرى الحنابلة في المذهب أنه إذا أمره بالبيع بدرهم فباعه بدينار صح، لأنه مأذون فيه عرفاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} والمالكية في تخيير الموكل بين الإمضاء والفسخ قولان إذا كان النقدان من نقد البلد وتساوت قيمتهما، وإلا خُيّر قولاً واحداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} وإذا أمره بالنقد فباعه بعرض لم يصح عند الحنابلة والمالكية، لأن العروض ليست من جنس الأثمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761}\n\nمخالفة الوكيل في قدر الثمن. إذا باع بأكثر من الثمن المحدد وكانت الزيادة من جنسه، فالجمهور يصححون البيع لأن المخالفة إلى خير؛ وزاد الشافعية أن يمتنع إذا صرّح الموكل بالنهي عن الزيادة، وفي قول عندهم لا يجوز مطلقاً لأن للمالك غرضاً في إبرار قسمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} وإذا باع بأقل من المحدد، فالمالكية يجعلونه موقوفاً على إجازة الموكل، ويرد السلعة إن كانت قائمة، أو يرد قيمتها إن فاتت؛ والشافعية والحنابلة في رواية يبطلونه؛ والحنابلة في المذهب يصححونه مع ضمان الوكيل للنقص، ولهم في قدر النقص وجهان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}\n\nمخالفة الوكيل في المكان. إذا عين له مكاناً محدداً فباع في غيره: الشافعية والحنابلة وابن شاس من المالكية يوجبون التقيد إذا كان للمكان غرض معين، كسوق معروفة بجودة النقد أو كثرة الثمن؛ والحنابلة والشافعية في وجه يجيزون البيع في مكان آخر إذا تساوى المكانان في الغرض؛ والحنفية يوجبون التقيد ويضمن الوكيل إن خالف؛ والمالكية يجعلون البيع موقوفاً على الإجازة؛ والشافعية في المعتمد لا يجوزونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}\n\nمخالفة الوكيل في الزمان. إذا حدد زمناً فباع في غيره، فالحنفية والشافعية والحنابلة يمنعون البيع ولا يلزم الموكل، لأن الموكل قد يؤثر التصرف في زمن حاجته دون غيره؛ والمالكية يخيّرون الموكل بين الإمضاء والرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}\n\nمخالفة الوكيل في المشتري المعين. إذا قال «لا تبع إلا له» فباع لغيره، فالجمهور ⁦(الحنفية والشافعية والحنابلة)⁩ لا يجيزونه، والشافعية والحنابلة يجيزونه إذا علم الوكيل أن الموكل لا غرض له في عين المشتري؛ والمالكية يخيّرون الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}\n\nتفريق الصفقة. إذا باع بعض السلعة ولم يبع الباقي، فإن كان التبعيض لا يضر بالموكل صح البيع عند الحنفية والشافعية والحنابلة ما لم ينهه عن ذلك الحنابلة، وقاعدة المالكية أن الموكل يخيّر بين الإجازة والرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} وإن كان فيه ضرر، فالشافعية والحنابلة يبطلونه، والمالكية وأبو يوسف ومحمد يجعلونه موقوفاً، وأبو حنيفة يجيزه نافذاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764}\n\nمخالفة الوكيل في جنس المبيع. إذا باع سلعة أخرى مكان المعينة، فالشافعية والحنابلة في الصحيح يبطلون البيع لأن الوكيل لا يملك إلا ما يقتضيه الإذن، والمالكية والحنابلة في رواية يجعلون الموكل مخيّراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764}\n\nالوكالة بالشراء. يجوز إطلاقها، كقوله «اشترِ لي ما شئت»، عند الحنفية والمالكية وأحمد في رواية، لأن الموكل فوّض الرأي؛ ومنعه الحنابلة في المذهب والشافعية لأنه قد يشتري ما لا يقدر على ثمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} وشراء الوكيل لموكله من ماله أو من محاجيره: الحنفية يمنعونه، ويجيزه أبو يوسف ومحمد إذا كان بمثل القيمة أو بأقل أو بزيادة يتغابن الناس في مثلها؛ وإن كانت الوكالة عامة جاز باتفاقهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766} والمالكية في المعتمد والحنابلة في المذهب يمنعون شراءه مما يملكه، ويجيزونه إذا أذن الموكل، والمالكية يجيزون شراءه من أقاربه إن لم تكن تهمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} والشافعية يمنعونه مطلقاً من ماله أو من ولده الصغير، ويجيزونه في الأصح من أصوله وفروعه البالغين المستقلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767}\n\nالوكالة بالشراء المقيدة. تجوز عند الحنفية في الاستحسان والمالكية والحنابلة في المذهب ولو لم يُذكر نوع السلعة، كأن يقول «اشتر لي ثوباً»، قياساً على القراض، ودليلهم حديث دفع الدينار إلى حكيم بن حزام ليشتري أضحية، لأن الجهالة القليلة في الوكالة لا تفضي إلى المنازعة لأن أساسها الفسحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767}\n\nالشراء بالوكالة المقيدة، والمخالفة فيه. إذا أمره بالشراء بثمن مؤجل لتأجيل مرخص به فاشترى نقداً، فالجمهور ⁦(الحنفية والمالكية والشافعية في وجه والحنابلة في المذهب)⁩ يجيزون الشراء ويلزم الموكل إذا لم يزد الوكيل في الثمن، لأن المخالفة في الصورة وفاق في المعنى؛ والشافعية في المعتمد لا يصححونه، لأن الموكل قصد ألا يكون عليه دين؛ والحنابلة في رأي يمنعونه إن تضرر الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} وإن اشترى مؤجلاً وقد أمره بالحلول، فالحنفية يلزمون الوكيل وحده، والمالكية يجعلون الخيار للموكل، والشافعية يبطلون الشراء إن كان بعين ماله، والحنابلة يجعلونه موقوفاً على الإجازة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}\n\nمخالفة جنس الثمن في الشراء. الشافعية والحنابلة في وجه يبطلونه، والحنابلة في المذهب يجيزون إبدال الدراهم بالدنانير والعكس لأن من رضي بالدرهم رضي بمكانه الدينار، ولا يجوز إبدال العروض مكان النقدين؛ والحنفية: إذا أمره بالشراء بالدنانير فاشترى بغيرها من العروض لم يلزم الموكل، والمشهور عند الكرخي أن الشراء بالدراهم عن الدنانير كذلك لا يلزم الموكل؛ والمالكية يجعلون ذلك موقوفاً على الإجازة، وفي إلزام الموكل بالدراهم عن الدنانير قولان مشهوران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}\n\nمخالفة قدر الثمن. إن كانت المخالفة إلى خير، كشراء الدابة بأقل من الثمن المسمى، صح الشراء ولزم الموكل. واستثنى الشافعية والحنابلة ما إذا نهاه الموكل عن النقص. وإن كانت إلى غير خير، فالحنفية يلزمون الوكيل ولا يلزمون الموكل؛ والمالكية يلزمون الموكل الزيادة اليسيرة، كالواحد في العشرين، ويجعلون الزيادة الكثيرة موقوفة على إجازته، ويلزم الوكيل إن التزمها؛ والشافعية والحنابلة في وجه يبطلونه؛ والحنابلة في المذهب يصححونه ويضمن الوكيل الزيادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}\n\nمخالفة المشترى. إذا اشترى غير ما وكل فيه، فالحنفية يجعلون الشراء للوكيل ولا يلزم الموكل؛ والمالكية يخيّرون الموكل فإن رده وقع للوكيل ويدفع ثمنه من ماله؛ والشافعية يبطلون إن اشتراه بعين المال، وإن اشتراه في ذمته ولم يسمِّ الموكل وقع للوكيل ولو نوى الموكل؛ والحنابلة يصححون الشراء في الذمة مع روايتين في لزومه للموكل، والشراء بعين المال باطل على الصحيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773}\n\nمخالفة قدر المشترى. الحنفية يفرّقون بين القيميات، فلا ينفذ الزائد على الموكل، وبين الموزونات، فيلزم الموكل قدر ما أمر به عند أبي حنيفة وبعض روايات محمد، ويلزمه الكل عند أبي يوسف ومحمد. والحنابلة والمالكية في مقابل المشهور يلزمون الموكل إذا اشترى شاتين بدينار تساويان كل واحدة منهما ديناراً، والحنابلة يقيدون ذلك بأن تساوي إحداهما الدينار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774} والشافعية يفرّقون بين وصف الموكل للشاة أو عدم وصفها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}\n\nتفريق الصفقة في الشراء. إذا كان المأمور به لا يمتنع تبعيضه عرفاً ولا يضر الموكل، فقد اتفق الفقهاء على جواز التبعيض، فيلزم الموكل ما اشتراه الوكيل، والحنابلة والشافعية في أحد الوجهين يقيدونه بألا يقل الموكل «اشتر ذلك صفقة واحدة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} وإن منع العرف التبعيض أو ترتب عليه ضرر، فالحنفية والمالكية يجعلونه موقوفاً على إجازة الموكل، وجمهور الحنفية يصححون شراء الباقي قبل أن يخاصمه الموكل أمام القضاء، وزفر يرى أن الشراء يقع للوكيل وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775}\n\nإذا أمر بشراء سلعة موصوفة فلا يجوز أن يشتريها إلا سليمة، لأن إطلاق البيع يقتضي السلامة من العيوب؛ فإن اشتراها معيبة، فعند الحنفية لا تلزم الموكل إذا كانت الصفة غير متحققة، كأن يشتري له جارية تخدمه فيشتري عمياء أو مقطوعة اليدين، أو يشتري دابة يركبها فيشتري مهراً، باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17776}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} ولو عيّن له السلعة فاشتراها وهي معيبة ولم يعلم الوكيل بالعيب لزمت الموكل وكان له الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} وإن علم الوكيل بالعيب لم يلزم الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} وإذا قبض الوكيل المشترى ثم اطلع على عيب فله رده ما دام في يده، فإن سلّمه إلى الموكل لم يرده إلا بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}\n\nوعند المالكية يلزم الوكيل المعيب إذا علم بعيبه واشتراه على البت، ولا يلزم الموكل إلا إذا كان العيب يسيراً يغتفر عادة والشراء غبطة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} وعند الشافعية في الشراء في الذمة: إن كان المعيب يساوي بالعيب ما اشتراه به ولم يعلم الوكيل، وقع للموكل، وإن علم فالأصح لا يقع له، وإن لم يساوِ ولم يعلم الوكيل فالأصح يقع للموكل، وإن علم لم يقع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} وإن اشترى بعين مال الموكل ولم يعلم العيب وقع للموكل، وإن علم لم يصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778}\n\nوعند الحنابلة: إذا علم الوكيل بالعيب لم يلزم الموكل ما اشتراه في الذمة؛ وإن لم يعلم جاز الشراء وللوكيل والموكل رده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17779} وإذا عيّن له الموكل السلعة فاشتراها وهي معيبة، فإن علم الوكيل بالعيب قبل الشراء لم يجز له الشراء، ولو اشترى لزمه ولم يلزم الموكل إلا إذا رضيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17779}\n\nالوكيل في العقد الفاسد. إذا وكّل في عقد فاسد لم يملك الوكيل عقداً صحيحاً بدلاً منه عند الشافعية والحنابلة ومحمد وزفر، وأجازه أبو حنيفة وأبو يوسف استحساناً إذا كان خيراً للموكل، كالوكيل بالبيع بألف إذا باع بألفين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}\n\nالوكيل ومخالفته في شرط الخيار. عند الحنفية إذا أمره أن يبيع بخيار ثلاثة أيام للموكل فباعه بغير خيار أو بخيار أقل، فالبيع باطل وهو ضامن. وإذا أمره بخيار شهر فشرط ثلاثة أيام جاز عند أبي حنيفة استحساناً، ولم يجز عندهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781} وعند الشافعية إذا قال «بع بشرط الخيار» فباع مطلقاً لم يصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782} وعند الحنابلة يجوز للوكيل شرط الخيار لنفسه ولموكله، ولا يملك شرطه للعاقد معه، لأنه إلزام لموكله بما لم يلتزمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}\n\nإقرار الوكيل بالخصومة. يمنعه المالكية والشافعية والحنابلة وزفر، لأن الإقرار يقطع الخصومة فلا يملكه الوكيل بها، ولأن الأمر بالشيء لا يتناول ضده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782} وأجازه أبو حنيفة ومحمد عند القاضي فقط دون الحدود والقصاص، والقياس عندهما الجواز عند غيره أيضاً، وأجازه أبو يوسف مطلقاً؛ وإذا استثنى الموكل الإقرار فإقرار الوكيل لا يصح ويخرج به عن الوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}\n\nالوكيل في الخصومة لا يملك المصالحة أو الإبراء أو البيع أو الهبة أو تأجيل الحق، باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}\n\nالوكيل بالقبض إذا جحد من عليه الحق. الحنابلة في المذهب والشافعية في وجه يجعلون الوكيل بالقبض وكيلاً في الخصومة لإثبات الحق لأنه لا يتوصل إلى القبض إلا به، ومنعه أبو يوسف ومحمد والمالكية والحنابلة في وجه والشافعية في وجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}\n\nالإذن في القبض ليس إذناً في الخصومة، لا نطقاً ولا عرفاً، لأن من يُرضى للقبض لا يُرضى بالضرورة للخصومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} ويفرق أبو حنيفة بين الوكيل بقبض العين، فلا يكون خصماً فيما يدعيه المدعى عليه من شراء ونحوه، والوكيل بقبض الدين، فيكون خصماً لأن استيفاء الدين مبادلة يملكها الوكيل بالخصومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} وفي حق الوكيل بالخصومة في قبض ما وُكّل بالخصومة فيه: الشافعية والحنابلة في المذهب وزفر والمروي عن أبي يوسف يمنعونه لأن الموكل قد يرضى للخصومة من لا يرضاه للقبض؛ والحنفية غير زفر والحنابلة في قول يجيزونه، لأن الوكيل بالشيء وكيل بإتمامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}\n\nوفي توكيل الوكيل بالخصومة غيره: إذا أذن له الموكل فله ذلك، وإذا نهاه فلا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786} وعند الإطلاق: الحنفية والمالكية والحنابلة في المذهب يمنعونه لأن الناس يتفاوتون في الخصومة؛ وقيد المالكية والحنابلة ذلك بما يليق بالوكيل، فإن كان مما لا يليق به أو لا يحسنه جاز له التوكيل، وزاد المالكية أنه يوكل من يعينه إذا كثرت الخصومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786} وقال ابن قدامة: إن أطلق الوكالة فإن كان العمل مما يترفع عنه الوكيل عادة أو يعجز عنه جاز التوكيل، وإن كان مما يعمله بنفسه وعجز عن جميعه لكثرته جاز، وفيما عدا ذلك روايتان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}\n\nوإذا وكّل شخصان واحداً في الخصومة وكان أحدهما يخاصم الآخر، فالتوكيل فاسد عند الحنفية؛ وإن وكّل الخصوم جميعاً في جهة واحدة، فجائز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}\n\nوفي وفاء الدين بالوكيل: إذا قال الموكل «اقضه ولا تشهد» فلا ضمان على الوكيل إن أنكره الدائن، وإن أمره بالإشهاد فلم يشهد فيضمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} وإن أمره بالقضاء دون إشهاد فقضاه ولم يشهد، ضمن عند الحنفية والمالكية والشافعية والحنابلة في المذهب، لأنه مفرّط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} ولا يضمن إذا قضى بحضرة الموكل، عند المالكية والحنابلة في المذهب والشافعية في أصح الوجهين، ويضمن عند الشافعية في الوجه الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}\n\nالتوكيل باقتضاء الدين. إذا قبضه الوكيل برئ المدين، والمقبوض ملك للموكل وأمانة في يد الوكيل، وليس للوكيل أن يهب الدين أو يؤخره أو يبرئ منه؛ وعند الحنفية ليس له أن يأخذ به رهناً، ويجوز له أن يأخذ كفيلاً؛ وعند المالكية والحنابلة ليس له أن يصالح عن الدين إلا بإذن الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}\n\nدفع الحق إلى من يدعي وكالة الغائب. يجبر الحاكم المدين على الدفع إذا أقام المدعي بينة على الوكالة باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789} وإن لم تقم بينة، فالمالكية والشافعية والحنابلة يرون أن المدين لا يلزمه الدفع إلى مدعي الوكالة إلا إن صدّقه، والمدين إذا دفع باختياره وأنكر الدائن الوكالة، رجع الدائن على الدافع وحده، ويرجع الدافع على الوكيل إن تلف بتعدٍّ أو تفريط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790} أما الحنفية فيفرقون بين الدين والعين، ويرون أن المدين إن صدّق مدعي الوكالة أُمر بالدفع، وإن كذّبه فالوكيل وحده يُلزم بما قبضه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17791}\n\nإذا أقام الغريم البينة أن الطالب جحد الوكالة وأخذ منه المال، قُبلت، لأنه يثبت بذلك انقطاع حق الطالب عن المدفوع، فينتقض يد الوكيل ضرورة. أما إن كان الحق عيناً كالوديعة فصدّقه المودع لم يؤمر بالدفع إليه، لأنه إقرار بقبض مال الغير، بخلاف الدين فيؤمر بدفعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792} وإذا سلّم المودع الوديعة إلى مدعي الوكالة فهلكت وأنكر المالك الوكالة ضمّن المودِع، وله أن يحلّفه، وليس له أن يرجع على الوكيل إلا إذا ضمّنه وقت الدفع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}\n\nتعدد الوكلاء. يجوز للموكل أن يوكّل أكثر من وكيل في تصرف معين غير الخصومة، فإن وكّلهم بكلام واحد في وقت واحد، فلا ينفرد أحدهم بالتصرف إلا أن يجيز ذلك الموكل؛ وعند الحنفية إن كان التصرف مما يحتاج إلى الرأي والمشورة كالبيع والنكاح وقبض الدين فلا ينفرد أحدهما، وإن كان مما لا يحتاج إليه كتسليم الهبة ورد الوديعة وقضاء الدين فينفرد كل منهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793} وإن وكّلهم بكلامين مرتبين، فأيهم تصرف جاز عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} أما الوكيلان بالخصومة فينفرد كل منهما عند الحنفية، عدا زفر، وعند الحنابلة في قول والشافعية في مقابل الأصح، لأن الغرض إعلام القاضي، ويمنعه زفر والشافعية في الأصح والحنابلة في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795}\n\nتوكيل الوكيل غيره. أ- مع الإذن يجوز بالاتفاق. ب- مع النهي لا يجوز بالاتفاق. ج- مع التفويض، كقوله «اصنع ما شئت» أو «اعمل برأيك»، يجوز عند الحنفية والمالكية والحنابلة، ويمنعه الشافعية لاحتمال الألفاظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796} د- مع الإطلاق: جمهور الفقهاء يمنعونه لأن الموكل رضي برأي الوكيل والناس يتفاوتون في الرأي، واستثنى بعضهم صورتين: أن يترفع الوكيل عن العمل أو يعجز عنه، فيجوز، وأن يكون العمل مما يعمله بنفسه لكنه يعجز عن جميعه لكثرته، فيجوز عند الحنابلة في المذهب والشافعية في قول، ويقتصر عند المالكية والشافعية في المذهب على الزائد عن طاقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17797} وأحمد وابن أبي ليلى يجيزانه مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}\n\nاشتراط الأمانة فيمن يوكّله الوكيل. يجب أن يكون أميناً، إلا أن يعيّن الموكل غير أمين فيتبع الوكيل تعيينه؛ وإن صار الوكيل الثاني خائناً فالحنابلة والشافعية في قول يوجبون على الوكيل عزله، والشافعية في الأصح لا يملكون عزله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}\n\nتكييف وكالة من يوكّله الوكيل. إذا قال الموكل «وكّل عني» أو «فوّض إليه»، فالوكيل الثاني وكيل الموكل ولا ينعزل بعزل الأول، وينعزل الاثنان بموت الموكل؛ وإذا قال «وكّل عنك» فالثاني وكيل الأول، فينعزل بعزله وموته، والموكل عند الشافعية والحنابلة له عزل الفرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} وإن قال «وكّل» ولم يقل «عني» ولا «عنك» فالحنفية والمالكية والشافعية في الأصح والحنابلة في المذهب يجعلونه وكيل الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} والتوكيل بغير إذن أصلاً لا يصح عند الجمهور، ويصححه أحمد وابن أبي ليلى في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799}\n\nالوكيل أمين على ما تحت يده من مال موكله، فهو بمنزلة الوديعة، فلا ضمان عليه فيما يهلك إلا إن تعدى أو فرّط، سواء أكان بأجر أم متبرعاً، لأن يده يد الموكل، ولأن الوكالة عقد إرفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800} ويترتب على أمانته أن قوله مقبول في دفع الضمان عن نفسه مع يمينه، لأن مبنى الوكالة على التسامح والإرفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}\n\nاشتراط الضمان أو نفيه. قال ابن قدامة إن ما كان أمانة لا يصير مضموناً بشرطه، وما كان مضموناً لا ينتفي ضمانه بشرطه؛ وعن أحمد ما يدل على نفي الضمان بالشرط، والأول ظاهر المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}\n\nالتعدي والتفريط. يضمن الوكيل إذا حمّل الدابة فوق طاقتها، أو لبس الثوب بغير إذن، أو ضيّع المال ولا يعرف كيف ضاع، أو خلط مال موكله بماله خلطاً لا يتميز، أو امتنع عن الرد بلا عذر، أو أخر الرد بعد زوال العذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} وإذا دفع الموكل الدين بنفسه ثم دفعه الوكيل، فلا ضمان على الوكيل إن لم يعلم، فإن علم ضمن لأن علمه بفعل الموكل علم بالعزل؛ وعند أبي حنيفة يضمن الوكيل في الزكاة مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} وإن باع الوكيل بالحلول فسلّم المبيع قبل قبض الثمن فجحده المشتري، ضمن قيمة المبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} وإذا أخر تسليم الثمن بغير عذر حتى هلك في يده ضمن، وإن كان له عذر فلا ضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}\n\nومن ذبح الشاة خطأ ضمن لأن الخطأ والعمد في أموال الناس سواء، وإذا أمره بقبض الوديعة كلها فقبض بعضها ضمن ويسقط الضمان إن قبض الباقي قبل هلاك الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}\n\nكيفية الضمان. المثلي يُضمن بمثله، والقيمي بقيمته، والمثلي إذا تعذر مثله بقيمته، وتُعتبر القيمة يوم التعدي أو الهلاك لا غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nتقديم البيان. يلتزم الوكيل بأن يقدم للموكل ما يطلبه من بيانات عما تصرف فيه، وقال ابن حجر إن كل أمين طُلب منه البيان والحساب لزمه، والعبرة بالجواب والدعوى لا بالخط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nرد ما في يد الوكيل. يجب عليه رد ما في يده لموكله، فإن امتنع عن الرد مع المطالبة بلا عذر حتى تلف ضمن، وكذا إن زال العذر فأخّر الرد حتى تلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nإذا اتفق الموكل والوكيل على أجر وجب الأجر باتفاق. وإن لم يتفقا: عند الحنفية إن كان الوكيل ممن لا يعمل بالأجر فالوكالة تبرع، وإن كان من أصحاب المهن التي يعمل أهلها بالأجر، كالسمسار والدلّال، استحق أجر المثل. وقد نصت المادة ⁦(١٤٦٧)⁩ من مجلة الأحكام العدلية على ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}\n\nوقت استحقاق الأجر. يستحقه الوكيل بتسليم ما عُهد إليه إلى الموكل إن كان مما يمكن تسليمه، كالثوب الذي ينسجه أو يخيطه؛ وإن وكّل في بيع أو شراء أو حج استحق الأجر المتفق عليه بإتمام العمل، إلا إذا اشترط الموكل تسليم الثمن أولاً فلم يسلمه الوكيل فلا أجر له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}\n\nشروط استحقاق الأجر: أن يكون العمل معلوماً، وأن تكون الأجرة معلومة المقدار، وألا تكون الأجرة جزءاً من المعقود عليه عند بعض الفقهاء، وأن ينفّذ الوكيل الوكالة تنفيذاً صحيحاً. ومن الجعل المجهول قول «جعلك عُشر ثمنه» فيكون له أجر المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806} وإذا باع الوكيل بيعاً فاسداً فلا جعل له، لأن الإذن المطلق في البيع يقتضي الصحيح فقط، فإن باع صحيحاً وتلف الثمن في يده فله الأجر لوجود العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}\n\nرجوع الوكيل على الموكل بما دفعه. إذا أمره بقضاء دين عليه فقضاه من ماله رجع عليه شرط الرجوع أو لم يشترط؛ وإذا وكّله بالشراء ولم يدفع إليه الثمن فدفعه من ماله، فعند الحنفية، عدا زفر، له حبس المبيع حتى يستوفي الثمن من الموكل، لأنه عاقد وجب له الثمن. ويرى زفر أنه لا يحبسه، لأن المبيع أمانة في يده، وعلى أبي يوسف يكون الضمان ضمان الرهن، وعلى زفر ضمان الغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}\n\nالجهة التي تتعلق بها حقوق العقد الذي يعقده الوكيل. العقود نوعان: ما يجوز إضافته إلى الوكيل، كالبيع والإجارة، فحقوقه تعود إليه كالمالك، فيسلّم المبيع ويقبض الثمن ويطالب به؛ وما يلزم إضافته إلى الموكل، كالنكاح والخلع والصلح عن دم العمد، فحقوقه تعود إلى الموكل، فلا يطالب وكيل الزوج بالمهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} والشافعية وأحمد في رواية يجعلون حقوق العقد متعلقة بالوكيل مطلقاً، والحنابلة في المذهب بالموكل مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}\n\nإذا أمر الوكيل بقبض الثمن ملك المطالبة، وأيهما طلبه المشتري أُجبر على تسليمه إليه؛ وإذا نهى الموكل الوكيل عن القبض فنهيه صحيح، لكن المشتري إذا نقد الثمن إلى الموكل برئ استحساناً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} وإذا استحق المبيع في يد المشتري رجع بالثمن على من نقده إليه، الوكيل أو الموكل؛ وكذا العيب يخاصم فيه الوكيل إن كان هو المتسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}\n\nالعقود التي يلزم إضافتها إلى الموكل، كالنكاح والخلع والعتق على مال والكتابة والصلح عن دم العمد، تكون حقوقها للموكل وعليه، والوكيل فيها سفير ومعبّر، فلا يطالب وكيل الزوج بالمهر، ولا يملك وكيل المرأة قبضه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} وعند المالكية يطالب وكيل البيع بالثمن وقبضه، ووكيل الشراء بقبض المبيع وتسليمه، ويرد المعيب إن لم يكن عالماً بعيبه، ويطالب بالثمن ما لم يصرح بالبراءة منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}\n\nكيفية انصراف حكم العقد إلى الموكل. جمهور الفقهاء ⁦(الحنفية في الصحيح، والشافعية في الصحيح، والمالكية والحنابلة)⁩ يرون أن الحكم ينتقل إلى الموكل مباشرة لأن العقد له، والكرخي يرى أن الحكم يثبت للوكيل أولاً ثم ينتقل إلى الموكل، وأبو زيد يجعله نائباً في الحكم أصيلاً في الحقوق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}\n\nاختلاف الوكيل والموكل. في أصل الوكالة: القول قول الموكل لأن الأصل عدم الوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} وفي صفة الوكالة كالعين والثمن والنقد والنسيئة: قول الموكل عند الحنفية والمالكية والشافعية والحنابلة في وجه؛ واستثنى المالكية صورتين يكون فيهما القول قول الوكيل بيمينه، وعند الحنابلة في المذهب قول الوكيل لأنه أمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811}\n\nتلف ما بيد الوكيل بغير تفريط: القول قول الوكيل مع يمينه باتفاق، لأنه أمين، ويتعذر عليه الإشهاد، والمالكية يقيدونه بالتهمة، والحنابلة بالسبب الخفي كالسرقة؛ وإن كان التلف بأمر ظاهر كالحريق والنهب فعند القاضي من الحنابلة عليه إثبات الحادث الظاهر ثم يحلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} والتعدي والتفريط في الحفظ: القول قول الوكيل مع يمينه، لأنه منكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812}\n\nالاختلاف في التصرف المأذون فيه وقبض الثمن: تفصيل الحنفية في بيع الوكيل وقبضه الثمن وهلاكه، وقد يكون المبيع مسلّماً إلى الوكيل أو غير مسلّم؛ فإن صدّقه الموكل في البيع والقبض دون الهلاك، فالقول للوكيل في الهلاك مع يمينه؛ وإن كذّبه الموكل في ذلك كله لم يصدّق الوكيل في حق الموكل في القبض، والمشتري بالخيار إن شاء نقد ثانياً وإن شاء فسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} وعند المالكية إذا قال الوكيل «تصرفت كما أذنت» فالقول قوله، لأنه أمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} وعند الشافعية إن جرى الاختلاف بعد الانعزال لم يُقبل قوله إلا ببينة، وإن جرى قبله فقولان، أظهرهما للأكثرين قول الموكل، وقيل ما يستقل به الوكيل يُقبل قوله فيه بيمينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} وعند الحنابلة في المذهب: إذا قال الوكيل «بعت الثوب وقبضت الثمن فتلف» فالقول قوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nدعوى رد ما بيد الوكيل. القول قول الوكيل مع يمينه عند الجمهور، سواء كانت بأجر أو بغير أجر عند الحنفية والمالكية؛ وعند الشافعية في مقابل الأصح والحنابلة في المذهب لا يُقبل قوله إن كان يعمل بأجر إلا ببينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nانتهاء الوكالة. أولاً: العزل، فالوكالة عقد غير لازم، فيجوز لكل من الطرفين فسخها بالعزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nانتهاء الوكالة، وأولها العزل. يجوز للموكل عزل الوكيل وأن ينهاه عن التصرف، وللوكيل أن يعزل نفسه، باتفاق الفقهاء في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}\n\nشروط صحة عزل الوكيل من موكله: الأول، علم الوكيل بالعزل، فيشترطه الحنفية وقول عند المالكية والشافعية ورواية عند الحنابلة، ولا يشترطه المالكية في قول والشافعية في الأصح والحنابلة في المذهب. ويتم علم الوكيل عند الحنفية بحضور العزل، أو بكتاب الموكل الغائب، أو بالرسول الذي يبلغه، ولو كان غير عدل أو صغيراً، أو بخبر عدلين أو عدل، وإن كان الخبر من غير عدل فصدّقه ينعزل؛ وأبو حنيفة لا يجعله منعزلاً إن كذّبه ولو ظهر صدق الخبر، لأن الإخبار عن العزل شبيه بالشهادة، وخالفه أبو يوسف ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818} الثاني، ألا يتعلق بالوكالة حق الغير، فعند الحنفية لا يجوز العزل بغير رضا صاحب الحق، كالمرتهن الذي وُكّل ببيع الرهن، والمدعي الذي وكل المدعى عليه بالخصومة؛ والشافعية يجيزون عزل الوكيل إذا كانت الوكالة بسؤال الخصم، والمالكية يمنعون عزله بعد أن يقاعد الخصم ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} الثالث، ألا تكون الوكالة بإجارة، فهي لازمة. الرابع، ألا يترتب على العزل مفسدة، فيحرم العزل إن كان يؤدي إلى استيلاء ظالم على مال المولى عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}\n\nعزل الوكيل نفسه لا يشترط فيه علم الموكل عند جمهور الفقهاء، إلا عند الحنفية إن كانت الوكالة بالخصومة أو بشراء شيء معين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820}\n\nالوفاة. تبطل الوكالة بموت الموكل أو الوكيل باتفاق، لأن الموت مبطل للأهلية، والمال انتقل إلى الورثة. وعند الحنفية والشافعية والحنابلة في المذهب لا يُشترط علم الوكيل بالموت، وعند المالكية ينعزل الوكيل إن كان المتعاقد معه حاضراً في بلد الموت وعلم بالوكالة إن علم بالموت، وإلا فلا ينعزل إلا بعلمه بالموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820}\n\nالجنون. الحنفية يبطلون الوكالة بالجنون المطبق، وحده عند أبي يوسف بالشهر، ومحمد بالسنة، والمطبق لا تعود الوكالة بإفاقته؛ والشافعية والحنابلة في المذهب يبطلونها بالجنون، والمالكية لا تنعزل إلا أن يطول جنون الموكل فيُنظر فيه الحاكم، والحنابلة في قول يرونها لا تبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17821}\n\nالإغماء. جمهور الفقهاء لا يبطلونها به، والشافعية في الأصح يبطلونها إلحاقاً بالجنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}\n\nالحجر. الحنفية يرون أن الحجر على الموكل أو الوكيل يبطل الوكالة، لكن تخصص الحنفية فتبطل بالحجر على الموكل إن كانت في العقود والخصومة لا في قضاء الدين وقبض الوديعة؛ والحنابلة تبطل بالحجر للسفه، وبفلس الموكل فيما حُجر عليه فيه؛ والشافعية تبطل بالحجر بسفه أو فلس في كل تصرف لا ينفذ؛ والمالكية تبطل بفلس الموكل الأخص لا الأعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}\n\nالردة. الحنفية: إذا حُكم بلحاق المرتد بدار الحرب بطلت وكالته ولا تعود بعوده مسلماً على المذهب، وتصرفاته قبل اللحاق موقوفة عند أبي حنيفة، وعند أبي يوسف ومحمد نافذة. والمالكية ينعزل الوكيل بردة موكله بعد أيام الاستتابة، والشافعية يبنون ذلك على زوال ملك المرتد وفيه أقوال، وأظهرها أن ملكه موقوف. والحنابلة: الصحيح في المذهب أن الوكالة لا تبطل بردة الوكيل، وتبطل بردة الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17824}\n\nالفسق. نص الحنابلة على أن الوكالة لا تبطل بفسق الوكيل إلا فيما ينافيه الفسق، كالإيجاب في عقد النكاح، فينعزل بفسقه أو بفسق موكله؛ وإن كان وكيلاً فيما تشترط فيه الأمانة، كوكيل ولي اليتيم أو ناظر الوقف، انعزل بفسق نفسه وفسق موكله. وأبطلها الشافعية بفسق الموكل فيما تشترط فيه السلامة من الفسق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}\n\nالسكر. عند الشافعية ينعزل الوكيل إذا سكر أحدهما بغير تعدٍّ، وإن سكر بتعدٍّ فيحتمل الانعزال ويحتمل عدمه. وعند الحنابلة لا تبطل بالسكر إلا فيما ينافيه كالإيجاب في النكاح. وعند الحنفية لا تبطل بالسكر مطلقاً، فالوكيل بالطلاق إذا طلق وهو سكران لم يقع، والوكيل بالبيع إذا باع وهو سكران لم ينفذ على موكله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}\n\nخروج محل التصرف عن ملك الموكل. إذا تصرف الموكل في المحل بنفسه، كأن يبيع السلعة قبل أن يبيعها الوكيل أو تستحق لغيره، أو تزوّج المرأة بنفسه، بطلت الوكالة. والمالكية إذا باع الموكل لواحد والوكيل لآخر، فالبيع الأول لازم، والثاني فضولي، إلا أن يقبض الثاني السلعة، فيمضي ويرد الأول إن لم يعلم الثاني والمشتري منه بالبيع الأول. وعند الحنابلة تبطل الوكالة بإقرار الوكيل على موكله بقبض ما وُكّل في قبضه، لاعترافه بذهاب محل الوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}\n\nعودة الوكالة إذا عاد المحل إلى الموكل. قال محمد تعود، لأن العائد بالفسخ عين الملك الأول فيعود بحقوقه، وقال الشافعية وأبو يوسف لا تعود، لأن تصرف الموكل يتضمن عزل الوكيل. وقال ابن عابدين إنها تعود إن عاد الملك بما هو فسخ، لا بما ليس بفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827}\n\nتعدي الوكيل فيما وُكّل فيه. الشافعية في الأصح والحنابلة في المذهب: لا تبطل الوكالة بالتعدي، لأن التصرف صدر بإذن، والأمانة تبطل بالتعدي والتصرف يبقى، كالرهن. والشافعية في مقابل الأصح والحنابلة في قول تبطلها، لأنها عقد أمانة كالوديعة. وقال المرداوي: إن أتلف الوكيل بتعديه عين ما وُكّل فيه بطلت الوكالة، وإن بقيت العين لم تبطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827}\n\nالإنكار. الحنابلة والحنفية في قول لا تبطلها جحود الوكيل أو الموكل، لأن الجحود لا يدل على دفع الإذن السابق؛ والحنفية في قول عليه الفتوى والحنابلة في قول تبطلها. والشافعية: الإنكار لنسيان أو لغرض في الإخفاء ليس عزلاً، فإن تعمد أحدهما الإنكار بلا غرض انعزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nتلف محل الوكالة. تبطل الوكالة بتلف العين الموكل فيها، وبموت المرأة الموكل بطلاقها. وعند الحنفية تنعزل الوكالة بافتراق الشريكين الذين وكّلا شخصاً، ولو لم يعلم الوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nإنجاز التصرف. ينعزل الوكيل عند الحنفية بانتهاء المأمور به، كأن يقبض الدين أو يعقد النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nالرجوع دلالة. تبطل الوكالة عند الحنابلة برجوع الموكل دلالة، كوطء الزوجة التي وكّل في طلاقها، أو برجوع الوكيل دلالة، كقبوله وكالة عتق عبد كان قد وكّل في شرائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17829}"
  en: "Wakala, with its vowel variants, means in the language protection, as in the Divine name al-Wakil meaning the Guardian, and in tawakkul ('we have entrusted our affairs to God'); tawkil is the delegation of a disposal to another. The agent is called wakil because his principal has entrusted him with the conduct of his affair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} The jurists define it in several ways. The Hanafis: setting another in one's place in a lawful, known disposal, out of ease or incapacity. The Malikis: the deputising of a person with a right, who has no command or worship, for another in what is not conditioned on his death. The Shafi'is: the delegation by a person of what he may do and that admits delegation, to another to do it during his life. The Hanbalis: the deputising of a person capable of disposing of property, like himself, in what deputising admits of rights of God and rights of men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe Mawsu'a distinguishes wakala from neighbouring terms: deputising (niyaba), which is for some jurists wider than wakala and for others its synonym; authority (wilaya), the carrying out of a word over another whether he wills it or not, which is a legal or compulsory deputising, while wakala is agreed; bequest (iya'), the setting of another in one's place in disposal after death, while wakala is in life; and guardianship (qiwama), a power given by the judge to an adult to act for a minor's interest, or the husband's authority over his wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe jurists agree that wakala is lawful. They cite the Qur'an: the account of the People of the Cave sending one of them with their silver to the city, and the verse of the two arbiters in Surat al-Nisa, which is taken to show that each arbiter acts as agent of one of the spouses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} They cite the Sunna: the report of 'Urwa ibn Abi al-Ja'd al-Bariqi, to whom the Prophet gave a dinar to buy a sheep; the report of Hakim ibn Hizam about buying a sacrifice; the report of Jabir about the agent at Khaybar; and the report of Abu Rafi' that he was the go-between in the Prophet's marriage to Maymuna. The jurists agree on its lawfulness from the time of the Prophet to the present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} By reason, the need for it is clear, since a person may be unable to act himself by illness, age or rank, and without it hardship would follow, which the text removes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe pillars of wakala: the majority hold them to be the formula, the two parties (principal and agent) and the object of the agency. The Hanafis hold that the pillar is the offer and acceptance, since their presence entails the other two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} The formula is the offer and acceptance, through which mutual consent is expressed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe offer. The majority hold it is what comes from the principal and shows his permission to appoint an agent; the Hanafis hold it is what comes first from one of the contracting parties to show his desire to make the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} It may be made by any sign of consent, in words, in writing, by message or by the sign of a mute man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Explicit words include 'I appointed you', 'I entrusted to you', 'I made you my deputy', 'I permitted you', 'I set you in my place' and 'you are my agent'. An order such as 'sell it' is valid for the Hanafis, Shafi'is and Hanbalis, and for the Malikis where custom so treats it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} The words 'I will appoint you', 'I appoint you' and 'I have relied on you' do not make a valid agency for the Shafi'is, since they are ambiguous, unless a clear term is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nAgency may be concluded by message, according to the Hanafis, Malikis and Shafi'is: the agent becomes agent once the news reaches him and he accepts, whether the bearer is trustworthy or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} The offer may also be made by clear writing, by the understood sign of a mute man, by an act that shows permission (for the Hanbalis), and by what custom treats as an offer, as when a husband disposes of his wife's property while she knows and keeps silent (the Malikis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} Silence is not an offer for the Hanafis, Shafi'is and Hanbalis: one who sees a stranger sell his property and says nothing is not made an agent by his silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nThe acceptance may be given in words, such as 'I accept' or words showing acceptance. The Hanafis and Shafi'is add that the agent must not refuse; if he refuses after the offer, no agency is concluded even if he accepts later, unless the offer and acceptance are renewed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} On acceptance by act there are three views. The majority (Hanafis, Malikis, the sounder Shafi'i view, and the Hanbalis) hold that it is complete by any act that shows it, such as the agent doing what he was told; the Shafi'is in one view, the Hanbalis in one view and Zufar among the Hanafis hold that it requires words; a third Shafi'i view distinguishes: if the offer is in the form of a command such as 'sell and buy', acceptance by act suffices, but if it is in the form of a contract such as 'I appointed you', words are needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Acceptance is also valid in clear addressed writing and by the understood sign of a mute man; the Hanafis hold that an agent's silence is acceptance, which is undone by his refusal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nIf acceptance is delayed after the offer, the majority (Hanafis, Hanbalis, the Shafi'i school view, and one Maliki view) hold that it is valid, since the permission remains while the principal does not withdraw it, and it is like a permission to act. The Shafi'is limit this to cases where the time of the act is not fixed; if it is fixed and there is fear of its passing, acceptance must be immediate, as also when the judge offers the agency to a man on its being established before him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} The second Maliki view and Abu Hamid al-Marwarudhi among the Shafi'is hold acceptance must be immediate, because wakala is a contract made in life, and like sale it requires immediate acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Al-Mazari said the matter returns to intention and custom: whether the words in question call for an immediate reply, or allow a prompt or a deferred one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe forms of the wakala formula, by the time at which its effects arise, are: the immediate form, which is neither conditioned on a condition nor linked to a time; the conditional form; the form attached to the future; and the time-limited form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe immediate formula, which is neither conditioned on a condition nor linked to a time, as in the principal saying 'I appointed you to sell that house', is valid by agreement of the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nThe formula conditioned on a condition. The jurists differ on two views. The first, held by the Hanafis, the sounder Hanbali view and, against the sounder view, the Shafi'is, is that it is valid, as in 'if the pilgrim arrives, sell this food'. They cite the report of Ibn 'Umar that the Prophet appointed Zayd ibn Haritha to command at Mu'ta, then Ja'far, then Ibn Rawaha if the first two were killed; and they argue that the agency is a contract whose effect on the agent, the permission to act, is recognised, so it is like a bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} The second, held by the sounder Shafi'i view and one Hanbali view, is that it is invalid; al-Mawardi says conditioning an agency on conditions or terms is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} The Shafi'is allow the principal to conclude the agency now and to make the act itself subject to a condition, as in 'sell it after a month', since that is postponement, not conditioning. Al-Ghazali reports that the Iraqis held that 'I appointed you now, but do not act until a month passes or a certain man arrives' is valid, since it is a delay, and the agent must comply. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nThe periodic formula: the principal says 'I appointed you to sell this property, and whenever I remove you, you are my agent again', so the agency renews itself each time he removes the agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} The Hanafis and the sounder Hanbali view hold it valid, on the ground that agency admits conditioning; for the Hanafis the principal may remove his agent at any time, and for the Hanbalis removal is effected by his words 'I removed you, and whenever I appoint you, I have removed you'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} Ibn Taymiyya holds it invalid, since it would turn a permissive contract into a binding one; the purpose of the conditional is to prevent appointment, not to dissolve a contract before it exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} The Shafi'is have two views on its validity at once; the sounder is that it is valid, because permission exists. If he removes the agent, and the agent did not know, or knew, there are two views on whether the agency returns after removal; the sounder is that it does not. If the words are 'whenever I remove you', the agency returns once; if they are 'every time I remove you', it returns each time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe formula attached to a future time, as in 'I appointed you to sell my beasts in Ramadan', or 'I appointed you to sell this house tomorrow'. The Hanafis and Hanbalis hold it valid, since agency admits being attached to the future; the Hanafis add that the agent becomes agent from tomorrow onward and not before. The Shafi'is agree that it is valid, since the agency is concluded now and only the act is linked to a future time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe formula conditioned on a time, as in 'when the new month comes, I appointed you to sell my house': on the sounder Shafi'i view it is void, since conditioning an agency on terms is invalid; the Hanafis, Hanbalis and the opposite Shafi'i view hold it valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} The Hanafis distinguish attachment (idafa) from conditioning (ta'liq). An attached formula is a cause that concludes the contract now while its effect is deferred to the time; a conditioned formula cannot be a cause of the effect now, so the agency is not concluded until the condition is met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe time-limited formula, as in 'you are my agent for a month', is valid by the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} They differ whether it survives the period. The Shafi'is hold that it does not survive the period. The Hanafis report two views on one who was told 'sell my house today' and did it tomorrow: the sounder view is that the agency does not survive the day, but some Hanafis hold it survives, since naming the day is for haste, not for limiting the agency to that day. Al-Bazzaziyya, quoted by the author of Minhat al-Khaliq, holds that an agency for ten days does not end when the ten days pass, on the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}\n\nConditions attached to the agency. If the condition is invalid, the Hanafis, Ahmad in the apparent of his two reports, and Ibn Abi Layla hold that the agency is not invalidated by any invalid condition. The Shafi'is hold that an invalid condition invalidates it, as when the principal says 'prevent the buyer from taking the goods', since to prevent a right-holder from taking possession is forbidden; the sale itself is valid by permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Al-Zarkashi says that the permissive contracts (partnership, agency and mudaraba) are not stopped from taking effect by permission when they are invalid, but lose their own features. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} The effect of invalidity is that a named fee falls away and the customary fee is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Some Hanbalis hold that the agency is void, like a deposit, because the trust is gone; and Abu Muhammad among the Shafi'is says the permission is not separate from the agency, so its invalidity means the permission is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}\n\nThe nature of the agency contract, whether binding or permissive. The first view, held by the Hanafis, Shafi'is, Hanbalis and some Malikis, is that it is permissive on both sides, since it is a gift and gifts are not binding: the principal may see that it is better to leave the matter, or to appoint another, and the agent may not be free. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The Hanafis and Malikis except where a third party's right attaches to the agency, which then binds, as with an agent in a suit appointed at the claimant's request, or an agent to sell a pledge in the presence of the pledgee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The Hanafis say that from its non-binding nature three rules follow: an option of stipulation does not enter it; agency is not valid as a principal claim; and the agent may resign whenever he wishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The second view: if the agency is for a fee in the form of a hire, it binds both sides and must meet the conditions of hire; the Shafi'is and in one view the Malikis say so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} The third view, of some later Malikis, is that it binds the agent's side even without a fee, by analogy with a gift that binds once given, though not received. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} If the agency is by way of a reward (ju'ala), the Malikis hold three views: binding on both sides; permissive on both sides, which is the view relied upon by the Shafi'is; and binding on the side of the one who offers the reward once the other starts work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nThe second pillar, the two parties, the principal and the agent. First, the principal: one who sets another in his place in a lawful known disposal, who must have the power to make that disposal and be bound by its rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} The jurists agree that agency may not be made by an insane person, an imbecile, a person under anaesthesia, a sleeper, or a minor who cannot discern, in any disposal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nA discerning minor may be appointed to acts that are purely beneficial to him, by agreement. For acts that are between benefit and loss, the Hanafis, Malikis and Hanbalis allow it with the guardian's permission, while the Shafi'is void it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} A spendthrift placed under restraint may not be appointed in what he cannot do independently, but may be in what he can. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nThe majority of jurists do not allow a woman to be appointed in a marriage, since she does not marry herself and so cannot be an agent for it; the Hanafis allow it, and the Malikis allow it in some cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nOn the appointment of an apostate there are three views. The first, held by the majority (the sounder Shafi'i view, the Hanbalis and Abu Hanifa), is that it is suspended on his return to Islam: if he returns the agency takes effect, and if he dies, is killed or joins the enemy as an apostate, it is void. The second, held by the two companions of Abu Hanifa and by one Shafi'i view, is that it is valid and binding; the Hanafis add that an apostate woman may be appointed by their agreement, since her acts take effect. The third, a Shafi'i view that Zakariyya al-Ansari and al-Shibramallisi regarded as the sound one, is that it is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nOn a Muslim appointing a dhimmi to sell wine or pork: the Shafi'is, Malikis, Hanbalis and the two companions hold it invalid, because a condition of the agency is that the principal himself owns the act he delegates, and a Muslim cannot sell wine or pork; one cannot give what one lacks. Abu Hanifa holds it valid, since it is enough that the principal has the capacity to act that entitles him to appoint another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nOn a pilgrim (muhrim) appointing a non-pilgrim to contract a marriage: the majority do not allow it, since the pilgrim does not conduct the contract during his pilgrimage; the Hanafis allow it in every case, since he could conduct the contract himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} The Hanbalis say that agency is invalid if the agent does not know his principal, as when he is told 'Zayd has appointed you' without a name or a description that identifies him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nThe agent must have the same sanity as the principal, so an insane person, an imbecile or a minor who cannot discern may not be an agent, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} On puberty as a condition: the Hanafis and Hanbalis allow a discerning minor who understands the contract and intends it to be an agent, and the rights of the contract return to the principal, not to him; their evidence includes the report that the Prophet married Umm Salama through 'Amr ibn Umm Salama, who was a boy. The Shafi'is forbid it, because a minor is not accountable and cannot dispose of his own right, so he cannot dispose of another's by appointment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} The agent must be named: if someone says 'I appointed one of the people to sell this goods', the agency is void, because the agent is unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} Ibn Najim says that a creditor's words to his debtor, 'whoever comes to you with a certain sign, and takes your finger, or says such and such to you, pay what I owe him', are an unknown agency that does not discharge the debtor if he pays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17739}\n\nKnowledge of the agency. For the Hanafis, knowledge of the agency is a condition, either by the agent or by the party dealing with him. If the agent sells before he knows and the buyer knows, the sale is not valid until the principal or the agent ratifies it after knowledge. If a trustworthy man informs the agent, and the agent accepts, he is an agent; if one who is not trustworthy informs him and he accepts, he is an agent; if he does not accept, Abu Hanifa holds he is not an agent, while Abu Yusuf and Muhammad hold he is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} The Hanbalis do not require knowledge, since the matter of contracts is what is actually the case; the sounder Shafi'i view agrees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Justice in the agent is not required in general, except in certain contracts such as marriage; nor is the male sex, except in some contracts such as marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}\n\nThe object of the agency is the disposal the principal permits the agent, in ownership or in guardianship. The Shafi'is set three conditions: it must be known in some respects; it must admit deputising; and the principal must own it at the time of the agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Agency is special, where it concerns a named disposal and the agent may act only in that, by agreement; or general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} On general agency the Hanafis and Malikis allow it with detail. The Hanafis say that 'you are my agent in every small and great matter' gives only the power to keep; 'you are my agent in every matter your order permits' makes the agent competent for all money dispositions, such as sale, purchase, gift and alms; they differ on divorce, emancipation and waqf, and the view taken is that the agent does not have those, which the author of al-Bazzaziyya also holds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} The Malikis say that a general agency is not concluded by the bare words 'I appointed you'; it must be delegated in words such as 'a delegated agency' or 'in all my affairs'. What increases property is allowed; gifts, emancipation and alms for the reward of the next life are not, unless the principal permits them in words. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} The Shafi'is and Hanbalis hold a general agency invalid because of the risk. 'I appointed you in all my small and great matters' or 'I delegated to you everything' is therefore invalid, while 'I appointed you to sell my goods and collect my debts' is valid even if the goods and debts are unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}\n\nThe general rule for what may be the object of an agency is that whatever contract a person may make himself, he may appoint another to make, because a person may be unable to act himself in some circumstances and so needs to appoint another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} The jurists agree that agency in sale and purchase is valid, because there is a need for it. The Prophet himself appointed 'Urwa al-Bariqi to buy a sheep, and gave a dinar to Hakim ibn Hizam to buy a sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} They also agree that agency is valid in assignment of debt (hawala), pledge, surety, partnership, deposit, mudaraba, reward contracts (ju'ala), irrigation partnership (musaqa), hire, loan, bequest, rescission, release, exchange (musarafa), cancellation (iqala) and pre-emption, since all of these are like sale in their need for an agent; likewise surety, settlement and gift. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743}\n\nThe jurists agree that a man may appoint an agent in a marriage contract, citing the Prophet's appointment of 'Amr ibn Umayya and Abu Rafi' to accept a marriage for him; the need for it, since a man may wish to marry from a far place and cannot travel there; and the Prophet's marriage to Umm Habiba while she was in the land of Abyssinia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nThey agree that agency is valid in financial acts of worship, such as zakat, charity, vows and expiations, since the Prophet sent his agents to collect and distribute charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} They also agree that agency is valid in divorce, revocation and khul', since the need is like the need for agency in sale and marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nActs that agency may not cover, by agreement. Testimony: agency is not valid in it, because it depends on the witness himself, who reports what he saw or heard, and because it rests on devotion and certainty; if a witness appoints another to testify, the second acts as a witness on the first witness's testimony and not as an agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Oaths and vows, since they depend on the swearer or vower himself; so do the oaths of mutual cursing, the vow of abstinence from wives and the oath of compurgation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Sins, such as killing, theft, usurpation and slander, which are forbidden and may not be done by the principal or the agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} And purely bodily worship, such as prayer, fasting and the purification from minor impurity, since they depend on the body of the one obliged. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745}\n\nMatters on which the jurists differ. The pilgrimage: agency is not allowed for a person able to make it himself; the incapable person's case is set out elsewhere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} The lesser pilgrimage (umra) may generally be performed on behalf of another by agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Marriage by a woman: most jurists forbid a woman to appoint or be appointed in marriage, since she may not contract it herself; the Hanafis allow it for a free adult sane woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Zihar: the majority forbid agency in it, the sounder Shafi'i view forbids it, and a Shafi'i view allows it; Ibn 'Abd al-Salam of the Malikis held that zihar is like divorce, since both are mere utterances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Securing permitted acts, such as reviving dead land, drawing water, hunting, gathering grass or digging a mine: the Malikis, the sounder Shafi'i view and the Hanbalis allow it, since the ownership comes from a cause that does not bind the person; the Hanafis, some Shafi'is and some Hanbalis forbid it, since the cause of ownership, taking hold, has occurred for the agent and an intention cannot turn it aside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Acknowledgement of rights: the Hanafis, Malikis, Hanbalis and a non-sounder Shafi'i view allow it, since it establishes a right in the obligation by words, as sale does; the sounder Shafi'i view and al-Tahawi forbid it, since it is a report about a right, like testimony. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747}\n\nLitigation: the Malikis, Shafi'is, Hanbalis and the two companions of Abu Hanifa allow agency in litigation over debts, specific property and all rights, whether the principal is present or absent, sick or well, and whether the opponent consents or not; the Malikis exclude an agent who is hostile to the opponent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} They cite the consensus of the Companions, as 'Ali appointed 'Aqil before Abu Bakr and said 'what is decided for him is mine, and what is decided against him is mine'; and the need for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} Abu Hanifa holds that litigation by agency is valid only with the opponent's consent, unless the principal is sick or absent three days' journey or more, since the principal's presence at the court is a right of his opponent. His reason is that a claim is a report that may be true or false, so its answer is required only by necessity; that necessity arises when the principal is sick or travelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} Al-Jassas reports that the apparent view draws no distinction between a man and a woman, or a virgin and a married woman; later Hanafis approve the agency of a secluded woman who does not appear in public; Ibn Abi Layla held it valid only for a virgin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}\n\nProof and execution of retaliation (qisas). The Malikis, Shafi'is, Hanbalis, Abu Hanifa and Muhammad al-Shaybani allow agency in proving qisas, whether the principal is present or absent, since qisas is a human right; Abu Yusuf does not allow it, and the evidence is accepted only from the principal himself, because of the doubt that must be guarded against in retaliation and the hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} On the execution of qisas: the Malikis, Shafi'is and the school view of the Hanbalis allow it whether the principal is present or absent. The Hanafis, some Shafi'is and some Hanbalis allow it only when the principal is present, since he may pardon in his absence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749}\n\nProof and execution of the hudud. The Shafi'is and Hanbalis distinguish the two. The school view of the Hanbalis allows agency in proving adultery, from the story of Unays; Abu al-Khattab among them says it is invalid. The Shafi'is do not allow agency in proving the hudud of God except the hadd of slander, since the right is God's, and it is commanded to avert it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} On execution, the Malikis, Shafi'is and Hanbalis allow agency, citing the Prophet's order to stone Ma'iz and 'Uthman's appointment of 'Ali to carry out the flogging for drinking on al-Walid ibn 'Uqba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} The Hanafis say there are two kinds of rights of God: proof, where agency is not allowed for the hudud that need no litigation, such as adultery and drinking, and is allowed for those that need it, such as theft and slander, according to Abu Hanifa and Muhammad, but Abu Yusuf forbids it; and execution of slander and theft is valid when the injured party is present, while if he is absent the Hanafi shaykhs differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nThe rules of agency. They bind the agent to carry it out within the limits the principal permitted or that law or custom imposes, to inform the principal of necessary information and render an account, and to return what belongs to the principal that is in his hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} A special agency may be issued unrestricted or restricted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Among its forms is agency in sale. For Abu Hanifa, the agent in an unrestricted sale is not bound by any restriction unless he is suspected; he may sell for little or much, for cash or on credit, and for goods, since the unrestricted word keeps its unrestricted sense, and a sale at a gross undervaluation in order to buy something more profitable is also customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nThe unrestricted agency in sale. The jurists differ on whether it is restricted, on two views. The first, Abu Hanifa's, is that an agent in an unrestricted sale is not bound by any restriction unless he is suspected; he may sell for little or much, for cash or on credit, and for goods, since the unrestricted word keeps its unrestricted sense, and a sale at a gross undervaluation in order to buy something more profitable is customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} The second, the majority (Malikis, Shafi'is and Hanbalis), is that the unrestricted agent is restricted by several limits. He may sell only for the currency of the town, since an unrestricted currency means the local currency. He may sell only at the market price in goods that people do not sell at a notable undervaluation; if he sells below it, the Malikis give the principal a choice, even for a small loss, which they set at half a tenth or less; the Hanbalis hold the sale valid and make the agent liable for the shortfall. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} He may not sell in goods instead of money, according to the Malikis, Hanbalis and the two companions; he may not sell on credit, according to the Malikis, Shafi'is and Hanbalis, though a Hanbali deduction allows it; and he may not sell for a benefit, according to the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}\n\nThe agent selling to himself. The majority (Hanafis, Shafi'is, the school view of the Hanbalis and the settled Maliki view) forbid it, since custom in sale is that a man sells to another, and there is a suspicion of bias. The Malikis and Hanbalis allow it if the principal permits, and the Malikis exclude cases where the bids have run high or where the sale is in the principal's presence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} A narration of Ahmad allows the agent to buy if he outbids in a public auction and someone else conducts the auction; al-Qadi said the second condition may be obligatory and may be recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} A Maliki view allows it if he does not favour himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754}\n\nThe agent selling to one whose testimony cannot be accepted for him. For the Hanafis, a sale to such a person above the value is valid; below the value by gross undervaluation it is invalid by agreement; at the value there are two narrations of Abu Hanifa. The two companions allow a sale to them at the value, except to his own slave or the slave who has bought his freedom by instalments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} The Malikis hold, on the settled view, that the agent may not sell to his ward, whether a minor, a spendthrift or an unauthorised slave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} The Shafi'is forbid a sale to his young son even if permitted, and the sounder view allows sale to his ascendants and his non-ward descendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} The Hanbalis in the school view forbid a sale to his son, his father or his mukatab (a slave contracted to buy his freedom by instalments); the other view allows it; the difference arises where the principal did not permit it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755}\n\nRestricted agency in sale. The agent must keep to the restrictions the principal set, by agreement. The Hanafis say that if he goes against a restriction the sale does not bind the principal unless he ratifies it, unless the difference is for the better, which is agreement in meaning. If he is told 'sell my garment for a thousand dirhams' and sells for less, or for something other than dirhams, the sale is not binding, even if the goods are worth more; if he sells for more, it binds. If he is told to sell on credit and sells for cash, the sale binds; if he is told to sell for cash and sells on credit, it is suspended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} The Malikis hold that exceeding the price in a sale, or paying less in a purchase, does not give the principal an option, since it is desired; only a difference which affects a valid purpose does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} The Shafi'is and Hanbalis say the agent may act only in what the principal's permission requires by word or custom. If one of two acts harms the principal he may not do it, citing the saying that there should be no harm nor reciprocal harm; if one benefits the principal, he must do it, since that is the sincere counsel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} A permission limited to a time does not extend before or after it; one limited to a place with an interest in it, such as a market known for its currency or price, is confined to that place, and where the place is equal in interest, the permission extends to it. Where the buyer is named, the agent may not sell to anyone else, unless he knows the principal has no interest in that particular buyer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}\n\nBreach of the price terms. As to the description of the price: if the principal says 'sell on credit' and the agent sells for cash, the majority hold that the sale binds the principal, since he gets his object and the agent has given him more; a Hanbali view makes the sale void where the principal has a definite interest in the deferral, and the Shafi'is forbid it where the principal has an interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} If he is told to sell on credit for a fixed price and sells for cash at less, the Hanafis, Shafi'is and Hanbalis do not allow the sale, and the Malikis make it suspended on the principal's approval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} If he is told to sell for cash and sells on credit, the Hanafis, Shafi'is and Hanbalis do not allow it, since immediate payment may be the principal's interest; the Malikis make it suspended on approval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759}\n\nIf the principal said to sell for a thousand now and the agent sold for a thousand on credit, the sale is not binding but suspended on the principal's approval; this is al-Kasani's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760}\n\nBreach of the currency. If he is told to sell for dinars and sells for dirhams or for goods, the Hanafis, the Shafi'is and al-Qadi among the Hanbalis do not allow the sale, even if it is worth more, since permission in one kind is not permission in another. The sounder Hanbali view is that if he is told to sell for a dirham and sells for a dinar, it is valid, since that is customary: whoever accepts a dirham accepts its equivalent in dinars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} Al-Kasani holds the sale suspended, with the principal choosing between approval and cancellation. For the Malikis, where the two currencies are the currency of the town and of equal value, there are two views on whether the principal chooses or approves; otherwise he chooses on one view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} If he is told to sell for money and sells for cloth or other goods, the Hanbalis and Malikis hold it invalid, since goods are not a kind of price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761}\n\nBreach of the amount. If he sells for more than the price named, in the same currency, the majority hold the sale valid, since the breach is for the better; the Shafi'is add that it is refused if the principal has expressly forbidden the excess, and one Shafi'i view forbids it entirely, since the principal may have an interest in keeping his oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} If he sells for less than the price named, the Malikis make it suspended on the principal's approval: the principal may take back the goods if they remain, or their value if they are lost. The Shafi'is and one Hanbali narration void it, since the principal did not agree to part with his property on that terms. The settled Hanbali view validates the sale and makes the agent liable for the shortfall, and there are two Hanbali views on how the shortfall is measured. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}\n\nBreach of the place. If he names a place and the agent sells elsewhere, the Shafi'is, Hanbalis and Ibn Shas among the Malikis require keeping to it where the place carries a particular interest, such as a market known for good currency or high prices. Some Hanbalis and a Shafi'i view allow sale elsewhere where the two places are equal in interest. The Hanafis require keeping to the place, and the agent is liable if he breaks the rule; the principal is not bound by the sale. The Malikis make the sale suspended on approval, and the sounder Shafi'i view forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762}\n\nBreach of the time. If a time is fixed and the agent sells at another time, the Hanafis, Shafi'is and Hanbalis forbid the sale and it does not bind the principal, since he may want the sale at the time of his need and not before or after; the Malikis let the principal choose between approving and rejecting it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}\n\nBreach of the named buyer. If the principal says 'sell only to him' and the agent sells to another, the majority (Hanafis, Shafi'is, Hanbalis) forbid it, whatever the price, since the principal may have an interest in that buyer and not another. The Shafi'is and Hanbalis allow it if the agent knows from a clear sign or from words that the principal has no interest in that buyer in particular. The Malikis let the principal choose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763}\n\nSplitting the sale. If the agent sells part of the goods and leaves the rest, or sells part and then the rest later, the rule depends on whether splitting harms the principal. If it does not harm him, as with two houses or two animals, the sale is valid for the Hanafis, Shafi'is and Hanbalis, and the Hanbalis add that it is valid unless the principal forbade splitting. The Malikis state a general rule that whenever the agent departs from his principal's terms or from custom, the principal chooses between approving the sale and rejecting it, if the goods remain, and between approving and holding the agent liable if they are lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} If splitting harms him, the jurists give three views: the Shafi'is and Hanbalis void the sale; the Malikis, Abu Yusuf and Muhammad make it suspended, and it is completed if the agent sells the rest; Abu Hanifa lets the sale take effect against the principal, since the agent stands in his place and the principal owns part of the goods as he owns the whole. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764}\n\nBreach of the kind of object. If the agent sells a different thing in place of the named one, the sounder Shafi'i and Hanbali view voids the sale, because he has broken the terms of the permission; the Malikis, and a Hanbali narration, let the principal choose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764}\n\nAgency in purchase. It may be issued unrestricted, as in 'buy for me whatever you like'. The Hanafis, the Malikis and a narration of Ahmad allow it, since the principal has delegated his judgement; the Hanbalis in the school view and the Shafi'is forbid it, since the agent may buy what he cannot pay for. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} The agent buying for his principal from his own property or from those whose testimony cannot be accepted for him: the Hanafis forbid buying from himself even with permission, since rights in sale return to the agent and that would make one person both payer and payee; they forbid buying from his minor son even with permission. Abu Hanifa forbids buying from his father, grandfather, grown son or wife; Abu Yusuf and Muhammad allow it at the value or less, or at a small excess. If the agency is general, the Hanafis agree that buying is allowed, since the cause of the bar is suspicion, which general words remove. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766} The Malikis in the settled view and the Hanbalis in the school view forbid buying from his own property, and allow it if the principal permits; the Malikis allow buying from his relatives if there is no suspicion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} The Shafi'is forbid buying from his own property or from his minor son in every case, and in the sounder view allow buying from his adult, independent ascendants and descendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767}\n\nRestricted agency in purchase. It is valid, the Hanafis (on istihsan), the Malikis and the Hanbali school view agreeing, even if the kind of goods is not named: 'buy me a garment' is valid, by analogy with the partnership of profit. The Hanafis cite the Prophet's giving a dinar to Hakim ibn Hizam to buy a sacrifice, which shows that a small uncertainty does not stop agency, since agency rests on leniency and not on the strict bargaining of sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767}\n\nRestricted purchase and its breaches. If the principal ordered a purchase on deferred terms and the agent bought for cash, the majority (Hanafis, Malikis, one Shafi'i view and the school view of the Hanbalis) allow the purchase and make it bind the principal if the agent has not raised the price, since the breach is in form only and agrees in meaning. The Shafi'is in the settled view do not allow it, since the principal meant that he should have no debt; a Hanbali view forbids it where the principal is harmed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} If the agent bought on credit when told to pay cash, the Hanafis bind the agent alone, the Malikis give the principal the choice, the Shafi'is void the purchase if it was with the principal's own money, and the Hanbalis make it suspended on approval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}\n\nBreach of the kind of price in purchase. The Shafi'is and one Hanbali view void it. The school view of the Hanbalis allows exchanging dirhams for dinars and the reverse, since one who accepts a dirham accepts a dinar in its place, but not goods in place of the two coins. The Hanafis hold that if he was told to buy with dinars and buys with other goods, the purchase binds the agent only; on the view reported from al-Karkhi, the purchase is not binding on the principal for dirhams instead of dinars either. The Malikis make it suspended on approval, and there are two well-known views on whether dirhams in place of dinars bind the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}\n\nBreach of the amount of the price. If the breach is for the principal's advantage, such as buying a beast for less than the named price, the purchase binds the principal, since the breach is in form only. The Shafi'is and Hanbalis except the case where the principal forbade paying less. If the breach is to the principal's disadvantage, the Hanafis bind only the agent; the Malikis bind the principal for a small excess, such as one in twenty, and make a large excess suspended on his approval, binding the agent if he takes it on himself; the Shafi'is and one Hanbali view void it; the school view of the Hanbalis validates it and makes the agent liable for the excess. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}\n\nBreach of the object purchased. If the agent buys something other than what he was told, the Hanafis make the purchase fall on the agent and not bind the principal. The Malikis let the principal choose; if he rejects it, the purchase falls on the agent, who pays the price from his own money. The Shafi'is void it if he buys with the principal's money; if he buys on his own credit without naming the principal, it falls on the agent even if he intended the principal. The Hanbalis validate the purchase on the agent's credit, with two views on whether it binds the principal, and hold a purchase with the principal's money void on the sound view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773} The Shafi'is (on a name said in acceptance) hold that the name is ignored and the purchase falls on the agent in the sounder view, while the other view voids the contract.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772}\n\nBreach of the quantity bought. Where the agent buys more of the same thing than the principal ordered, for the same price, the Hanafis distinguish: for things valued individually (qiyyamiyyat), the excess does not bind the principal at all, since the price of each is unknown. For things measured by weight, Abu Hanifa, and Muhammad in some narrations, bind the principal only for the quantity ordered; Abu Yusuf and Muhammad bind him for all of it. The Hanbalis, and the Malikis in the view opposite the settled one (that of Asbagh), bind the principal if the agent buys two sheep for one dinar and each is worth a dinar; the Hanbalis add that it is valid if one of them is worth a dinar, while if neither is, it is invalid in the school view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774} The Shafi'is distinguish whether the principal described the sheep or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}\n\nSplitting the purchase. If the thing ordered may be split by custom without harm to the principal, all agree that the agent may buy part, and the principal is bound by what he bought; the Hanbalis and one Shafi'i view restrict this to the case where the principal did not say 'buy it all in one deal'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} If custom forbids splitting, or it harms the principal, the Hanafis and Malikis make the purchase suspended on the principal's approval. The majority of Hanafis hold that buying the rest before the principal sues the agent in court binds the principal, since the partial purchase was a means of carrying out the order; Zufar holds that the purchase falls on the agent alone. If the principal sues first and the judge binds the agent, a later purchase of the rest binds the agent alone, by Hanafi agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775}\n\nIf the principal orders the purchase of a described good, the agent may buy only a sound one, since an unqualified sale implies freedom from defects. If he buys a defective one, the Hanafis hold, by agreement, that it does not bind the principal where the description is not met: for example, a blind or a one-handed slave girl bought when he was told to buy a servant, or a stallion bought when he was told to buy a riding mount. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17776}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} If the principal named the goods, and the agent bought them defective without knowing it, the purchase binds the principal, who may return it. If the agent knew, it does not bind the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} The Hanafis add that if the agent takes the purchase and finds a defect while it is in his hand, he may return it; but if he has handed it to the principal, he may return it only with the principal's permission, since the agency has ended on delivery. If the agent accepts the defect, it binds him, and the principal may accept it or hold the agent liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}\n\nThe Malikis hold that the agent who buys a defective good knowingly is bound if he bought outright or on the seller's option; if he bought on his own option, it does not bind him and he may return it. The purchase binds the principal only if the defect is slight and customarily tolerated and the purchase is a bargain, as with a cheap beast with a short tail, unlike a noble beast with a cut tail, which does not bind him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} The Shafi'is, for a purchase on the agent's credit, hold that if the defective good is worth the price paid, and the agent did not know, the purchase falls on the principal; if he knew, the sounder view says it does not fall on the principal. If the defect makes it worth less than the price, the sounder view makes it bind the principal if he did not know, and not if he knew. If he bought with the principal's own money, it binds the principal if the agent did not know, and not if he did. If the principal expressly required soundness, al-Isnawi says it does not bind the principal, since it was not authorised. Either the principal or the agent may return the good, if the agent did not know of the defect, and the agent may not return it where the principal has accepted the defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778}\n\nThe Hanbalis: if the agent knew the defect, the purchase on his credit does not bind the principal; if he did not know, the purchase is allowed and both the agent and the principal may return it. The Azjiyy raised whether a purchase with the principal's money with knowledge of the defect falls on the principal; if the goods are equal to the price, the apparent view is that he accepts it, but he may not. If the principal named a defective item and the agent knew before buying, the agent may not buy it; if he buys, the purchase binds him and binds the principal only if the principal accepts; if he did not know, he may return it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17779}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780}\n\nThe agent and an invalid contract. If the principal authorised an invalid contract, the agent may not conclude a sound contract in its place; this is the view of the Shafi'is, Hanbalis, Muhammad and Zufar. Abu Hanifa and Abu Yusuf, by istihsan, allow the sound contract to bind the principal where it is better for him, as with an agent to sell for a thousand who sells for two thousand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}\n\nThe agent and the stipulation of an option. The Hanafis hold that if the principal ordered a sale with a three-day option for himself and the agent sold without it or with less, the sale is void and he is liable as a usurper. If he was told to stipulate an option of a month and stipulated three days, Abu Hanifa allows it by istihsan, but his two companions do not, since in their view the option of a month is valid with the sale. The Shafi'is hold that a sale on a stated option is void if the agent sells without it. The Hanbalis allow the agent to stipulate an option for himself and for his principal, but not for the other party, since that binds the principal to what he did not agree to. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}\n\nThe agent in litigation making an admission. The Malikis, Shafi'is, Hanbalis and Zufar do not allow it, since an admission ends the dispute, which the agent may not do, and the command to contend does not include its opposite. Abu Hanifa and Muhammad allow it before the judge only, excluding the hudud and retaliation; their analogy allows it elsewhere too, and Abu Yusuf allows it in every case. If the principal excluded admission, the admission is void and takes the agent out of the agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}\n\nSettlement, release, sale, gift and postponement by the litigation agent are not his, by agreement; the Hanafis add that he may not sell, give or postpone the right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}\n\nThe agent to collect a debt, when the debtor denies it. The Hanbali school view and one Shafi'i view make him an agent in litigation for proof, since he cannot collect without proving the right, so that this is permission by custom; the agent is so whether the right is a specific thing or a debt, and whether the principal knows the debtor's willingness to pay or his denial or delay. Abu Yusuf, Muhammad, the Malikis, one Hanbali view and one Shafi'i view deny him this power. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}\n\nPermission to collect is not permission to litigate, either in words or by custom, since a person one accepts for collecting need not be one accepted for litigation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} Abu Hanifa distinguishes the agent who collects a specific thing, who is not a party to the principal's dispute over a purchase or the like, from the agent who collects a debt, who is a party, since collecting a debt is an exchange that the litigation agent may conduct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} On whether an agent for litigation may collect what he was appointed to litigate over: the Shafi'is, the school view of the Hanbalis, Zufar, and the view reported from Abu Yusuf hold he may not, since a principal may accept a man for litigation whom he would not accept for collection. The other Hanafis, and one Hanbali view that Ibn al-Banna relied on, allow it, since whoever is appointed to a matter is appointed to complete it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}\n\nAppointment of another by a litigation agent. If the principal permits it, the agent may appoint another; if he forbids it, he may not. Where the principal says nothing, the Hanafis, Malikis and the school view of the Hanbalis forbid it, because people differ in eloquence and skill in litigation. The Malikis and Hanbalis limit this to matters that befit the agent himself; if the matter is beneath him or beyond his skill, he may appoint another, and the Malikis add that where the litigation is heavy he may appoint a partner to help him, though not another in his stead. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786} Ibn Qudama says that where the agency is unrestricted, the agent may appoint another if the work is beneath the agent or beyond his capacity in volume; for work he can do himself, there are two narrations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} If two parties appoint one agent to litigate against each other, the Hanafis hold the appointment invalid; if the two appoint one agent against a third party, it is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}\n\nPayment of a debt by an agent. If the principal says 'pay it and do not take witnesses', the agent is not liable if the creditor denies payment; if the principal orders witnesses and the agent takes none, the agent is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} If he is told to pay without a stated instruction on witnesses and does not take witnesses, the Hanafis, Malikis, Shafi'is and the school view of the Hanbalis hold him liable, since he failed to take care; his word is not accepted against the creditor without proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} He is not liable if he paid in the principal's presence, by the Malikis, the school view of the Hanbalis and the sounder Shafi'i view, since the principal's silence is consent; a Shafi'i view holds him liable, since a neglect is not removed by the presence of the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}\n\nThe agent to collect a debt. Once he collects, the debtor is discharged, the money is the principal's and it is held by the agent as a trust, bound by the rules of a deposit. The agent to collect may not give the debt away, defer it or release it. The Hanafis add that he may not take a pledge for it, but may take a surety; the Malikis and Hanbalis add that he may not compromise over it without the principal's permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}\n\nDelivery of a right to one who claims to be an absent owner's agent. All agree that if the claimant proves the agency by evidence, the judge compels the debtor to pay him. If no evidence is given, the Malikis, Shafi'is and the school view of the Hanbalis hold that the debtor is not bound to pay the claimant unless he confirms the agency; if the debtor pays voluntarily and the creditor denies the agency, the creditor may recover from the payer only, and the payer may recover from the agent if the money is lost through his fault or neglect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790} The Hanafis distinguish a debt from a specific thing: if the debtor confirms the claimant's agency he is ordered to pay, and if he denies it, the agent alone is held to what he collected. When the absent owner later confirms the agency, the debtor is discharged; if he denies it, the debtor pays again and may recover from the agent if the money remains in his hand, and if it was lost in his hand the debtor may not recover from the agent unless he has made himself liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17791}\n\nIf the debtor proves that the claimant denied the agency and took the money from him, the proof is accepted, because it establishes that the claimant's right to the sum has ended by his own collection, and so the agent's hold is ended by necessity. If the right is a specific thing, such as a deposit, and the depositary confirms the claimant's agency, he is not ordered to deliver it, since that would be an admission that he surrendered another's property; a debt is different, and he is ordered to pay it, since he admits that the sum is the creditor's own property, debts being discharged by equal sums. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792} If the depositary hands the deposit to one who claims agency, it is lost in his hand and the owner denies the agency, the depositary is liable; he may make the owner swear, and he may not recover from the agent unless he made him liable at the time of delivery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}\n\nSeveral agents. The principal may appoint more than one agent for a particular disposal other than litigation. If he appoints them in one word at one time, none may act alone, unless the principal allows it. The Hanafis hold that where the disposal calls for judgement and counsel, such as sale, marriage and collecting a debt, none may act alone; where it does not, such as delivering a gift, returning a deposit or paying a debt, each may act alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793} Two agents for a sale, a marriage, a khul' or any contract with a sum in it likewise do not act alone, since the principal relied on the judgement of both. The two agents to collect a debt may not collect one without the other, though their collection is complete once what one collected reaches the other or the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794} The Hanafis and Malikis allow either of two agents appointed by separate words to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} For two agents in litigation, each may act alone according to the Hanafis (other than Zufar), one Hanbali view and one Shafi'i view, since litigation aims at informing the judge and the two voices confuse it; Zufar, the sounder Shafi'i view and the school view of the Hanbalis forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795}\n\nAn agent appointing another. With permission, it is allowed by agreement. With prohibition, it is not allowed by agreement. Where the principal says 'do as you like' or 'act on your judgement', the Hanafis, Malikis and Hanbalis allow it, while the Shafi'is forbid it, since such words admit many possibilities. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796} Where nothing is said, the majority forbid it, since the principal relied on the agent's judgement and people differ in judgement. Some allow two cases: where the work is beneath the agent or beyond his skill, and where he could do it himself but cannot do all of it because it is great in volume. In the second case, the school view of the Hanbalis and one Shafi'i view allow him to delegate all of it; the Malikis and the school view of the Shafi'is allow only the excess beyond his capacity. Ahmad and Ibn Abi Layla allow it in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17797}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}\n\nThe trust of the one an agent appoints. Whoever the agent appoints must be trustworthy, unless the principal named an untrustworthy person, in which case the agent follows the principal's choice. If the agent's appointee becomes a wrongdoer, the Hanbalis and one Shafi'i view require the agent to remove him, and the sounder Shafi'i view says the agent may not remove him, since he was allowed to appoint but not to remove. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}\n\nThe kind of agency the appointee holds. If the principal says 'appoint on my behalf' or 'delegate to him', the appointee is the principal's agent, is not dismissed by the first agent's removal, and both lose their office on the principal's death. If the principal says 'appoint on your behalf', the appointee is the first agent's agent, and falls with the first's removal or death; the Shafi'is and Hanbalis allow the principal to remove the sub-agent, since he is a branch of a branch. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} If the principal says only 'appoint', the Hanafis, Malikis, the sounder Shafi'i view and the school view of the Hanbalis make the appointee the principal's agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} Appointment without any permission is not valid according to the majority; Ahmad and Ibn Abi Layla validate it in one case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799}\n\nThe agent is a trustee for what is in his hand of his principal's property. It is like a deposit: he is not liable for a loss unless he transgresses or is negligent, whether he works for a wage or as a volunteer, since his hand is the principal's hand, and agency is a contract of kindness and assistance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800} As a trustee his word is accepted on his own discharge from liability with his oath, since agency rests on leniency and easy dealing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}\n\nStipulating liability or its absence. Ibn Qudama says that what is a trust does not become a liability by stipulation, and what is a liability cannot be removed by stipulation; a narration of Ahmad seems to allow removal of liability by stipulation, but the first view is the apparent school view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}\n\nTransgression and negligence. The agent is liable if he overloads a beast, wears a garment without permission, loses the money without knowing how, mixes the principal's money with his own so that it cannot be separated, refuses to return it without excuse, or delays return after the excuse has ended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} If the principal paid the debt himself and the agent then paid it too, the agent is not liable if he did not know; if he knew, he is liable, since the principal's payment was a removal of the agent that the agent knew of. Abu Hanifa holds the agent liable for a double payment of zakat whether he knew or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} If an agent to sell on credit delivers the goods before collecting the price and the buyer denies payment, he is liable for the goods' value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} If he delays paying the price he has received without excuse until it is lost, he is liable; with an excuse, he is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}\n\nIf he slaughters a beast by mistake and it dies unlawfully, he is liable, since error and intent are the same for people's property. If he was told to collect a deposit in full but collected part, he is liable, and the liability falls away if he collects the rest before the first part is lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}\n\nMeasure of liability. For a fungible thing he pays its like; for a thing valued individually he pays its value; if a fungible thing has no like, he pays its value. The value is taken on the day of transgression or loss, not any other day. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nDuty to account. The agent must give the principal the information he asks for about what he has done, and Ibn Hajar says that any trusted person who is asked for an account must give it; what counts is the answer and the claim, not the handwriting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nReturn of what is in the agent's hand. He must return to the principal what he holds. If he refuses when asked, without excuse, until it is lost, he is liable; and so if an excuse ends and he delays return until the loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804}\n\nIf the principal and the agent agree on a wage, the wage is due by agreement. If they do not agree, the Hanafis distinguish: an agent who does not work for a wage acts as a volunteer, since the agency is originally gratuitous; an agent of a trade whose people work for a wage, such as a broker or a dealer, is due the customary wage. Article 1467 of the Majalla al-Ahkam al-'Adliyya states this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}\n\nWhen the wage is due. The agent earns it by handing over what was entrusted to him, where handing over is possible, as a cloth he weaves or sews; if he was appointed to sell, buy or perform the pilgrimage, he earns the agreed wage on completing the work, even if the price was not yet collected. But if the principal stipulated that the price be handed over first and the agent did not hand it over, he has no wage, since the condition failed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}\n\nConditions for the wage. The work must be known, the wage must be known in amount, the wage must not be part of the object of the agency according to some jurists, and the agent must carry out the agency validly. An unknown reward, such as 'a tenth of its price', gives only the customary wage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806} If the agent makes a defective sale, he has no reward, since a general permission to sell permits only a valid sale; if he makes a valid sale and the price is lost in his hand, he has the reward because the work was done. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}\n\nRecovery from the principal of what the agent paid. If the principal orders him to pay a debt and he pays from his own money, he recovers it whether or not the principal stipulated recovery. If the agent buys without the principal's money and pays the price from his own money, the Hanafis except Zufar let him hold the goods until he collects the price from the principal, since he is the contracting party to whom the price is due. Zufar says he may not hold them, since the goods are a trust in his hand. The liability for holding them is, for Abu Hanifa and Muhammad, like the liability of a seller; for Abu Yusuf, like a pledge; for Zufar, like usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}\n\nWhose rights a contract made by the agent concerns. Contracts are of two kinds: those that may be made in the agent's name, such as sale and hire, whose rights return to the agent, who delivers the goods, receives the price, and sues for the price as though he were the owner; and those that must be made in the principal's name, such as marriage, khul' and compromise over wilful killing, whose rights return to the principal, so that the husband's agent is not sued for the dower. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} The Shafi'is and a narration of Ahmad hold that the rights of every contract return to the agent; the school view of the Hanbalis holds that they return to the principal in every case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}\n\nIf the principal orders the agent to collect the price, the agent has the right to demand it, and the buyer is compelled to pay whichever of them he asks. If the principal forbids the agent to collect, the prohibition is valid; but if the buyer pays the price to the principal, he is discharged by istihsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} If the goods are seized from the buyer, he recovers the price from whichever of them he paid, the agent or the principal; and a defect is pursued against the agent if he is the one who received the goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}\n\nContracts that must be made in the principal's name, such as marriage, khul', manumission for a payment, writing of manumission and compromise over wilful killing, have their rights for and against the principal; the agent is a messenger and a conveyor. So the husband's agent is not sued for the dower, and the wife's agent may not receive it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} The Malikis hold that the agent in a sale sues for and collects the price, and the agent in a purchase receives and delivers the goods; he returns a defect if he did not know it, and is bound for the price unless he expressly disclaims it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}\n\nHow the effect of the contract reaches the principal. The majority (the sounder Hanafi and Shafi'i views, the Malikis and the Hanbalis) hold that the effect passes directly to the principal, since the contract was made for him. Al-Karkhi holds that it first falls on the agent and then passes to the principal. Abu Zayd holds that the agent is a deputy for the ruling and a principal for the rights. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}\n\nDisputes between agent and principal. On the existence of the agency, the principal's word is accepted, since the original state is that there is no agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} On its terms (a sale for a price or on credit, a particular object), the principal's word is accepted by the Hanafis, Malikis, Shafi'is and in one Hanbali view; the Malikis add two cases where the agent's oath prevails; the school view of the Hanbalis accepts the agent's word, since he is trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} On the loss of what the agent holds without negligence, the agent's word with oath is accepted by agreement, since he is a trustee and cannot easily prove the loss. The Malikis limit this to an agent who is not suspected; the Hanbalis to a hidden cause, such as theft; if the cause is evident, such as fire or plunder, the Hanbali judge (al-Qadi) requires proof of the event first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} On a claim of transgression or negligence in keeping, the agent's word with oath is accepted, since he denies what is alleged against him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812}\n\nDisputes over the sale and the collection of the price. The Hanafis work through cases, depending on whether the object was delivered to the agent or not. If the principal confirms the sale and the collection but not the loss or delivery, the agent's word with oath is accepted on the loss. If the principal denies the sale and the collection, the agent is believed about the sale but not about the collection as against the principal; the buyer may pay again to the principal and take the goods, or rescind; if the principal confirms the sale and the agent says the buyer paid the principal, the buyer is discharged on the agent's acknowledgement, but the agent is liable if he then cannot prove it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} The summary is compressed here. The Malikis hold that if the agent says 'I acted as you permitted', his word is accepted, since he is trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} The Shafi'is hold that if the dispute arises after the agent's removal, his word is not accepted without proof; if before, there are two views, the more accepted of which gives the principal's word; the other gives the agent's word where he can act alone (as in divorce and manumission) with oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} The Hanbalis in the school view accept the agent's word that he sold and collected and the price was lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nOn the claim to have returned what the agent holds, the majority accept the agent's word with oath, whether the agency is paid or not, according to the Hanafis and Malikis; the Shafi'is and Hanbalis require proof when he is paid, and accept his oath when he is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nThe end of agency. The first way is removal. Agency is a non-binding contract, so either party may end it by dismissal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816}\n\nThe end of agency. The first cause is removal. The principal may dismiss his agent and forbid him the act, and the agent may dismiss himself; the jurists agree on this in general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}\n\nConditions for a valid removal by the principal. The first is that the agent knows of the removal. The Hanafis, a view of the Malikis, a Shafi'i view and a Hanbali narration require it, since removal dissolves the contract and cannot bind without knowledge. The majority of the Malikis, the sounder Shafi'i view and the school view of the Hanbalis do not. For the Hanafis, knowledge comes by being present at the removal, by the principal's letter, by a messenger (whether trustworthy or not, adult or minor), or by the report of two trustworthy men or one trustworthy man, and a report from an untrustworthy man counts if the agent believes it. Abu Hanifa holds that if the agent denies the report, he is not removed even if it proves true, since reporting a removal resembles testimony; Abu Yusuf and Muhammad disagree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818} The second is that no right of a third party is attached to the agency. The Hanafis hold that removal without the right-holder's consent is not valid, as with a pledge given to a creditor with the agent appointed to sell it, or with a defendant's agent in a suit appointed at the claimant's request. The Shafi'is allow removal if the agency was requested by the opposing party; the Malikis forbid removal once the agent has sat with the opponent three times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} The third is that the agency is not a hire, since a hired agency binds both parties. The fourth is that removal must not cause harm; the Shafi'i Sharwani says that removal is forbidden if it would let a wrongdoer seize the property of a ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}\n\nThe agent's removal of himself does not require the principal's knowledge, by the majority, except that the Hanafis require it where the agency is for litigation or the purchase of a named thing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820}\n\nDeath. The agency ends on the death of the principal or of the agent, by agreement, since death ends capacity and the property passed to the heirs. The Hanafis, Shafi'is and the school view of the Hanbalis do not require the agent's knowledge of the death. The Malikis hold that if the person dealing with the agent was in the town of death and knew of the agency, the agent is not removed until he knows of the death; otherwise the agent is removed only on knowledge of the death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820}\n\nInsanity. The Hanafis end the agency by permanent insanity, taking a month according to Abu Yusuf and a year according to Muhammad; once it is permanent, the agency does not return on recovery. The Shafi'is and the school view of the Hanbalis end it by insanity; the Malikis do not, unless the principal's insanity is long, in which case the judge considers it; a Hanbali narration says it does not end. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17821}\n\nFainting. Most jurists do not end the agency by it; the sounder Shafi'i view does, by analogy with insanity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}\n\nInterdiction. The Hanafis hold that interdiction of the principal or the agent ends the agency, but specify that interdiction of the principal ends it only where the agency concerns contracts and litigation, not payment of debts or collection of a deposit. The Hanbalis end it by interdiction for prodigality, and by the principal's insolvency in what he is restrained from. The Shafi'is end it by interdiction for prodigality or insolvency in any disposal that does not take effect. The Malikis end it by the principal's narrow insolvency, a judicial order to take the debtor's goods for his creditors, not by general insolvency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}\n\nApostasy. The Hanafis hold that if the apostate is ruled to have joined the enemy's land, the agency ends and does not return on his return to Islam in the school view. His acts before joining are suspended in Abu Hanifa's view and binding in the view of Abu Yusuf and Muhammad. The Malikis hold that the agent is removed by his principal's apostasy after the period of asking to repent. The Shafi'is base the matter on whether the apostate's property passes out of his ownership, with several views, the most apparent being that it is suspended. The Hanbalis hold that the agency is not ended by the agent's apostasy in the school view, and is ended by the principal's apostasy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17824}\n\nImmorality (fisq). The Hanbalis hold that agency is not ended by the agent's immorality, except in matters that immorality contradicts, such as the offer in a marriage, where an agent is removed by his own or his principal's immorality. An agent for matters requiring trust, such as the agent of a guardian of an orphan or the administrator of an endowment, is removed by his own immorality or his principal's. The Shafi'is end it by the principal's immorality in matters that require integrity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}\n\nDrunkenness. The Shafi'is hold that if either party becomes drunk without fault the agent is removed; if by fault, the Shafi'is say it may or may not end the agency. The Hanbalis hold it does not end the agency except in matters it contradicts, such as the marriage offer. The Hanafis hold that it never ends the agency: an agent appointed to divorce who divorces while drunk has not divorced; an agent who sells while drunk does not bind the principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}\n\nThe object leaving the principal's ownership. If the principal does the act himself, as by selling the goods before the agent does, or if the goods are claimed by another, or if he marries the woman himself, the agency ends. The Malikis hold that if the principal sold to one buyer and the agent sold to another, the first sale binds, and the second is an unauthorised sale, unless the second buyer has taken possession, in which case the second stands and the first is undone, unless the second buyer and seller knew of the first. The Hanbalis hold that the agent's admission that he received what he was appointed to collect ends the agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}\n\nIf the object returns to the principal. Muhammad holds that the agency returns, since what comes back by rescission is the first ownership with its rights; the Shafi'is and Abu Yusuf hold that it does not, since the principal's own act implies the agent's removal. Ibn 'Abidin says it returns if the ownership returns by rescission, not otherwise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827}\n\nThe agent's transgression in what he was appointed to do. The sounder Shafi'i view and the school view of the Hanbalis hold that agency is not ended by transgression, since the act was done by permission: the trust is lost by transgression, but the act stands, as with a pledge. The opposite Shafi'i view and one Hanbali view end it, since agency is a trust contract, like a deposit. Al-Mardawi says that if the agent destroys the thing he was appointed for, the agency ends, and if it remains, it does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827}\n\nDenial. The Hanbalis and a view of the Hanafis hold that the agency is not ended by the agent's or principal's denial, since denial does not show a withdrawal of earlier permission; the Hanafi fatwa and one Hanbali view hold that it is ended. The Shafi'is hold that denial for forgetfulness or to hide something is not removal; if either denies deliberately with no reason, it removes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nLoss of the object. The agency ends when the object is lost, and when the woman whose divorce was entrusted dies. The Hanafis hold that the agency of two partners ends when they part, even if the agent does not know. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nCompletion of the act. The Hanafis hold that the agent is removed when the matter entrusted is completed, as when he collects a debt or contracts a marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828}\n\nImplied withdrawal. The Hanbalis hold that agency ends by implied withdrawal of the principal, as by intercourse with a wife whose divorce he entrusted, or by implied withdrawal of the agent, as by accepting the agency to free a slave when he had been appointed to buy him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17829}"
  es: "Wakala, con sus variantes vocálicas, significa en el idioma protección, como en el nombre divino al-Wakil que significa el Guardián, y en tawakkul ('hemos confiado nuestros asuntos a Dios'); tawkil es la delegación de una disposición a otro. El agente es llamado wakil porque su principal le ha confiado la conducción de su asunto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} Los juristas lo definen de varias maneras. Los hanafíes: poner a otro en el lugar de uno en una disposición lícita y conocida, por facilidad o incapacidad. Los malikíes: la delegación de una persona con derecho, que no tiene mandato ni culto, por otra en lo que no está condicionado a su muerte. Los shafi'ís: la delegación por parte de una persona de lo que puede hacer y que admite delegación, a otra para que lo haga durante su vida. Los Hanbalis: la delegación de una persona capaz de disponer de la propiedad, como él mismo, en lo que la delegación admite de derechos de Dios y derechos de los hombres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720} El Mawsu'a distingue wakala de términos vecinos: delegación (niyaba), que para algunos juristas es más amplio que wakala y para otros su sinónimo; autoridad (wilaya), el cumplimiento de una palabra sobre otro lo quiera o no, que es una delegación legal u obligatoria, mientras que wakala es acordada; legado (iya'), la colocación de otro en el lugar de uno en la disposición después de la muerte, mientras que wakala es en vida; y tutela (qiwama), un poder otorgado por el juez a un adulto para actuar en interés de un menor, o la autoridad del marido sobre su esposa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720} Los juristas concuerdan en que el wakala es lícito. Citan el Corán: el relato de la Gente de la Cueva enviando a uno de ellos con su plata a la ciudad, y el versículo de los dos árbitros en Surat al-Nisa, que se toma para mostrar que cada árbitro actúa como agente de uno de los cónyuges. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} Citan la Sunna: el relato de 'Urwa ibn Abi al-Ja'd al-Bariqi, a quien el Profeta dio un dinar para comprar una oveja; el relato de Hakim ibn Hizam sobre la compra de un sacrificio; el relato de Jabir sobre el agente en Khaybar; y el relato de Abu Rafi' de que fue el intermediario en el matrimonio del Profeta con Maymuna. Los juristas coinciden en su legalidad desde la época del Profeta hasta el presente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} Por razón, la necesidad de ello es clara, ya que una persona puede ser incapaz de actuar por sí misma debido a una enfermedad, edad o rango, y sin ello se producirían dificultades, las cuales el texto elimina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} Los pilares de la wakala: la mayoría sostiene que son la fórmula, las dos partes (principal y agente) y el objeto de la agencia. Los hanafíes sostienen que el pilar es la oferta y la aceptación, ya que su presencia implica los otros dos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} La fórmula es la oferta y la aceptación, a través de las cuales se expresa el consentimiento mutuo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} La oferta. La mayoría sostiene que es lo que viene del principal y muestra su permiso para nombrar a un agente; los hanafíes sostienen que es lo que viene primero de una de las partes contratantes para mostrar su deseo de hacer el contrato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Puede hacerse mediante cualquier signo de consentimiento, en palabras, por escrito, por mensaje o por el signo de un hombre mudo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Las palabras explícitas incluyen 'yo te nombré', 'yo te confié', 'yo te hice mi adjunto', 'yo te permití', 'yo te puse en mi lugar' y 'tú eres mi agente'. Una orden como 'véndelo' es válida para los hanafíes, shafi'ís y hanbalíes, y para los malikíes donde la costumbre así lo trata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} Las palabras 'yo te nombraré', 'yo te nombro' y 'yo he confiado en ti' no hacen una agencia válida para los shafi'ís, ya que son ambiguas, a menos que se agregue un término claro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} La agencia puede concluirse mediante un mensaje, según los hanafíes, malikíes y shafiíes: el agente se convierte en agente una vez que la noticia le llega y la acepta, sea o no digno de confianza el portador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} La oferta también puede hacerse por escrito claro, por el signo tácito de un hombre mudo, por un acto que muestre permiso (para los hanbalíes) y por lo que la costumbre trata como una oferta, como cuando un marido dispone de la propiedad de su mujer mientras ella lo sabe y guarda silencio (los malikíes). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} El silencio no es una oferta para los hanafíes, shafi'ís y hanbalíes: quien ve a un extraño vender su propiedad y no dice nada no se convierte en agente por su silencio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} La aceptación puede darse con palabras, como «acepto» o palabras que muestren aceptación. Los hanafíes y shafi'ís añaden que el agente no debe rechazar; si rechaza después de la oferta, no se concluye la agencia aunque acepte más tarde, a menos que la oferta y la aceptación se renueven. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Sobre la aceptación por acto hay tres puntos de vista. La mayoría (Hanafis, Malikis, el punto de vista Shafi'i más sólido y los Hanbalis) sostienen que se completa con cualquier acto que la demuestre, como que el agente haga lo que se le dijo; los Shafi'is en un punto de vista, los Hanbalis en otro y Zufar entre los Hanafis sostienen que requiere palabras; un tercer punto de vista Shafi'i distingue: si la oferta es en forma de una orden como 'vender y comprar', la aceptación por acto es suficiente, pero si es en forma de contrato como 'te nombré', se necesitan palabras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} La aceptación también es válida en un escrito claro y dirigido, y por el signo tácito de un hombre mudo; los hanafíes sostienen que el silencio de un agente es aceptación, la cual se anula con su negativa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Si la aceptación se demora después de la oferta, la mayoría (hanafíes, hanbalíes, la escuela shafi'í y una visión malikí) sostienen que es válida, ya que el permiso permanece mientras el principal no lo retire, y es como un permiso para actuar. Los shafi'íes limitan esto a los casos en que el tiempo del acto no está fijado; si está fijado y hay temor de que pase, la aceptación debe ser inmediata, como también cuando el juez ofrece la agencia a un hombre una vez establecida ante él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} La segunda visión malikí y Abu Hamid al-Marwarudhi entre los shafi'ís sostienen que la aceptación debe ser inmediata, porque la wakala es un contrato hecho en vida, y como la venta requiere aceptación inmediata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Al-Mazari dijo que el asunto vuelve a la intención y la costumbre: si las palabras en cuestión exigen una respuesta inmediata, o permiten una pronta o una diferida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Las formas de la fórmula de la wakala, según el momento en que surgen sus efectos, son: la forma inmediata, que no está condicionada a una condición ni vinculada a un tiempo; la forma condicional; la forma adjunta al futuro; y la forma limitada en el tiempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} La fórmula inmediata, que no está condicionada a una condición ni vinculada a un tiempo, como en el principal diciendo 'Te nombré para vender esa casa', es válida por acuerdo de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} La fórmula condicionada a una condición. Los juristas difieren en dos puntos de vista. El primero, sostenido por los Hanafi, el punto de vista Hanbali más sólido y, en contra del punto de vista más sólido, los Shafi'is, es que es válida, como en 'si el peregrino llega, vende esta comida'. Citan el informe de Ibn 'Umar de que el Profeta nombró a Zayd ibn Haritha para comandar en Mu'ta, luego a Ja'far, luego a Ibn Rawaha si los dos primeros morían; y argumentan que la agencia es un contrato cuyo efecto sobre el agente, el permiso para actuar, es reconocido, por lo que es como un legado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} La segunda, sostenida por la opinión shafi'í más sólida y una opinión hanbalí, es que es inválida; al-Mawardi dice que condicionar una agencia a condiciones o términos es nulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} Los shafi'íes permiten que el principal concluya la agencia ahora y que el acto mismo esté sujeto a una condición, como en 'véndelo después de un mes', ya que eso es un aplazamiento, no un condicionamiento. Al-Ghazali informa que los iraquíes sostenían que 'Te nombro ahora, pero no actúes hasta que pase un mes o llegue cierto hombre' es válido, ya que es una demora, y el agente debe cumplir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} La fórmula periódica: el principal dice 'Te nombré para vender esta propiedad, y cada vez que te destituya, volverás a ser mi agente', por lo que la agencia se renueva cada vez que destituye al agente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} Los hanafíes y la visión hanbalí más sólida la consideran válida, basándose en que la agencia admite condicionamiento; para los hanafíes el principal puede destituir a su agente en cualquier momento, y para los hanbalíes la destitución se efectúa mediante sus palabras 'Te destituí, y cada vez que te nombro, te he destituido'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} Ibn Taymiyya lo considera inválido, ya que convertiría un contrato permisivo en uno vinculante; el propósito de la condición es impedir el nombramiento, no disolver un contrato antes de que exista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} Los shafi'ís tienen dos opiniones sobre su validez a la vez; la más sólida es que es válida, porque existe permiso. Si él elimina al agente, y el agente no sabía, o sabía, hay dos opiniones sobre si la agencia regresa después de la eliminación; la más sólida es que no regresa. Si las palabras son 'siempre que te elimine', la agencia regresa una vez; si son 'cada vez que te elimine', regresa cada vez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} La fórmula adjunta a un tiempo futuro, como en 'Te nombré para vender mis bestias en Ramadán', o 'Te nombré para vender esta casa mañana'. Los Hanafis y Hanbalis la consideran válida, ya que la agencia admite estar adjunta al futuro; los Hanafis agregan que el agente se convierte en agente a partir de mañana y no antes. Los Shafi'is están de acuerdo en que es válida, ya que la agencia se concluye ahora y solo el acto está vinculado a un tiempo futuro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} La fórmula condicionada a un tiempo, como en 'cuando llegue el nuevo mes, te nombré para vender mi casa': en la visión más sólida de Shafi'i es nula, ya que condicionar una agencia a términos es inválido; Los hanafíes, los hanbalíes y la postura opuesta shafi'í lo consideran válido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} Los hanafíes distinguen la vinculación (idafa) del condicionamiento (ta'liq). Una fórmula vinculada es una causa que concluye el contrato ahora, mientras que su efecto se difiere al tiempo; una fórmula condicionada no puede ser causa del efecto ahora, por lo que la agencia no se concluye hasta que se cumple la condición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} La fórmula con límite de tiempo, como en \"eres mi agente por un mes\", es válida según los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} Difieren en cuanto a si sobrevive al período. Los shafi'ís sostienen que no sobrevive al período. Los hanafíes informan dos opiniones sobre alguien a quien se le dijo \"vende mi casa hoy\" y lo hizo mañana: la opinión más sólida es que el mandato no sobrevive al día, pero algunos hanafíes sostienen que sí sobrevive, ya que nombrar el día es para apresurarse, no para limitar el mandato a ese día. Al-Bazzaziyya, citado por el autor de Minhat al-Khaliq, sostiene que un mandato por diez días no termina cuando pasan los diez días, según la opinión más sólida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} Condiciones adjuntas al mandato. Si la condición es inválida, los hanafíes, Ahmad en la aparente de sus dos informes, e Ibn Abi Layla sostienen que el mandato no se invalida por ninguna condición inválida. Los shafi'íes sostienen que una condición inválida lo invalida, como cuando el principal dice \"impide que el comprador tome los bienes\", ya que impedir que un titular de derechos tome posesión está prohibido; la venta en sí es válida por permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Al-Zarkashi dice que los contratos permisivos (asociación, agencia y mudaraba) no dejan de tener efecto por la autorización cuando son inválidos, pero pierden sus propias características. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} El efecto de la invalidez es que una tarifa nombrada desaparece y se debe la tarifa consuetudinaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Algunos hanbalíes sostienen que la agencia es nula, como un depósito, porque la confianza se ha perdido; y Abu Muhammad entre los shafi'ís dice que la autorización no está separada de la agencia, por lo que su invalidez significa que la autorización es nula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} La naturaleza del contrato de agencia, si es vinculante o permisivo. La primera opinión, sostenida por los Hanafis, Shafi'is, Hanbalis y algunos Malikis, es que es permisivo para ambas partes, ya que es un regalo y los regalos no son vinculantes: el principal puede ver que es mejor dejar el asunto, o nombrar a otro, y el agente puede no ser libre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} Los Hanafis y Malikis excepto cuando un derecho de un tercero se adjunta a la agencia, que entonces es vinculante, como con un agente en un juicio nombrado a solicitud del demandante, o un agente para vender una prenda en presencia del acreedor prendario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} Los hanafíes dicen que de su naturaleza no vinculante se derivan tres reglas: no entra en ella una opción de estipulación; la agencia no es válida como reclamación principal; y el agente puede renunciar cuando lo desee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} La segunda opinión: si la agencia es por una tarifa en forma de alquiler, vincula a ambas partes y debe cumplir las condiciones del alquiler; los shafi'ís y, en una opinión, los malikíes lo afirman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} La tercera opinión, de algunos malikíes posteriores, es que obliga a la parte del agente incluso sin una tarifa, por analogía con un regalo que obliga una vez dado, aunque no recibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} Si la agencia es a modo de recompensa (ju'ala), los malikíes tienen tres opiniones: vinculante para ambas partes; permisiva para ambas partes, que es la opinión en la que se basan los shafi'íes; y vinculante para la parte de quien ofrece la recompensa una vez que el otro comienza a trabajar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} El segundo pilar, las dos partes, el principal y el agente. Primero, el principal: aquel que pone a otro en su lugar en una disposición legal conocida, quien debe tener el poder para hacer esa disposición y estar obligado por sus reglas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} Los juristas concuerdan en que la agencia no puede ser realizada por una persona demente, un imbécil, una persona bajo anestesia, un durmiente o un menor que no pueda discernir, en ninguna disposición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} Un menor discernidor puede ser designado para actos que sean puramente beneficiosos para él, por acuerdo. Para actos que están entre beneficio y pérdida, los Hanafis, Malikis y Hanbalis lo permiten con el permiso del tutor, mientras que los Shafi'is lo anulan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} Un derrochador puesto bajo restricción no puede ser designado en lo que no puede hacer de forma independiente, pero sí en lo que puede. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} La mayoría de los juristas no permiten que una mujer sea designada en un matrimonio, ya que ella no se casa por sí misma y, por lo tanto, no puede ser agente del mismo; los Hanafis lo permiten, y los Malikis lo permiten en algunos casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} Sobre el nombramiento de un apóstata hay tres puntos de vista. La primera postura, sostenida por la mayoría (la opinión shafi'í más sólida, los hanbalíes y Abu Hanifa), es que queda suspendida al regresar al Islam: si regresa, el mandato surte efecto, y si muere, es asesinado o se une al enemigo como apóstata, queda anulado. La segunda postura, sostenida por los dos compañeros de Abu Hanifa y por una opinión shafi'í, es que es válida y vinculante; los hanafíes añaden que una mujer apóstata puede ser designada por acuerdo entre ellos, ya que sus actos tienen efecto. La tercera postura, una opinión shafi'í que Zakariyya al-Ansari y al-Shibramallisi consideraban la más sólida, es que queda anulada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Sobre un musulmán que designa a un dhimmi para vender vino o cerdo: los shafi'is, malikíes, hanbalíes y los dos compañeros lo consideran inválido, porque una condición de la agencia es que el principal mismo posee el acto que delega, y un musulmán no puede vender vino o cerdo; uno no puede dar lo que le falta. Abu Hanifa lo considera válido, ya que es suficiente que el principal tenga la capacidad de actuar que le da derecho a designar a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Sobre un peregrino (muhrim) que designa a un no peregrino para contraer matrimonio: la mayoría no lo permite, ya que el peregrino no lleva a cabo el contrato durante su peregrinación; Los hanafíes lo permiten en todos los casos, ya que él mismo podría llevar a cabo el contrato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Los hanbalíes dicen que la agencia es inválida si el agente no conoce a su principal, como cuando se le dice 'Zayd te ha designado' sin un nombre o una descripción que lo identifique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} El agente debe tener la misma cordura que el principal, por lo que una persona demente, un imbécil o un menor que no puede discernir no puede ser un agente, por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Sobre la pubertad como condición: los hanafíes y los hanbalíes permiten que un menor discernidor que entiende el contrato y tiene la intención de que sea un agente, y los derechos del contrato regresan al principal, no a él; Su evidencia incluye el informe de que el Profeta se casó con Umm Salama a través de 'Amr ibn Umm Salama, que era un niño. Los shafi'íes lo prohíben, porque un menor no es responsable y no puede disponer de su propio derecho, por lo que no puede disponer del de otro por designación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} El agente debe ser nombrado: si alguien dice 'He designado a una de las personas para vender estos bienes', la agencia es nula, porque el agente es desconocido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} Ibn Najim dice que las palabras de un acreedor a su deudor, 'quien venga a ti con cierta señal, y tome tu dedo, o te diga tal y cual cosa, págame lo que le debo', son una agencia desconocida que no libera al deudor si paga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17739} Conocimiento de la agencia. Para los Hanafíes, el conocimiento de la agencia es una condición, ya sea por parte del agente o de la parte que trata con él. Si el agente vende antes de saberlo y el comprador lo sabe, la venta no es válida hasta que el principal o el agente la ratifiquen después de tener conocimiento. Si un hombre de confianza informa al agente, y el agente acepta, es un agente; si alguien que no es de confianza le informa y él acepta, es un agente; si no acepta, Abu Hanifa sostiene que no es un agente, mientras que Abu Yusuf y Muhammad sostienen que sí lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Los Hanbalíes no requieren conocimiento, ya que la cuestión de los contratos es lo que realmente sucede; la opinión Shafi'i más sólida está de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} La justicia en el agente no se requiere en general, excepto en ciertos contratos como el matrimonio; ni el sexo masculino, excepto en algunos contratos como el matrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} El objeto de la agencia es la disposición que el principal permite al agente, en propiedad o en tutela. Los shafi'is establecen tres condiciones: debe ser conocido en algunos aspectos; debe admitir la destitución; y el principal debe poseerlo en el momento de la agencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} La agencia es especial, cuando se refiere a una disposición específica y el agente solo puede actuar en ella, por acuerdo; o general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} En cuanto a la representación general, los hanafíes y los malikíes la permiten con detalle. Los hanafíes dicen que \"eres mi agente en todo asunto pequeño y grande\" solo da el poder de retener; \"eres mi agente en todo asunto que tu orden permita\" hace que el agente sea competente para todas las disposiciones monetarias, como venta, compra, donación y limosna; difieren en cuanto al divorcio, la emancipación y el waqf, y la opinión adoptada es que el agente no tiene esos, lo cual también sostiene el autor de al-Bazzaziyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} Los malikíes dicen que una representación general no se concluye con las simples palabras \"te he designado\"; Debe delegarse en palabras como \"una agencia delegada\" o \"en todos mis asuntos\". Lo que aumenta la propiedad está permitido; los regalos, la emancipación y las limosnas para la recompensa de la otra vida no lo están, a menos que el principal los permita verbalmente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} Los shafi'ís y los hanbalíes consideran que una agencia general es inválida debido al riesgo. \"Te nombré en todos mis asuntos pequeños y grandes\" o \"Te delegué todo\" es, por lo tanto, inválido, mientras que \"Te nombré para vender mis bienes y cobrar mis deudas\" es válido incluso si los bienes y las deudas son desconocidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} La regla general sobre lo que puede ser el objeto de una agencia es que cualquier contrato que una persona pueda hacer por sí misma, puede nombrar a otra para que lo haga, porque una persona puede ser incapaz de actuar por sí misma en algunas circunstancias y por lo tanto necesita nombrar a otra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} Los juristas concuerdan en que la agencia en la compraventa es válida, porque hay una necesidad de ella. El Profeta mismo designó a 'Urwa al-Bariqi para comprar una oveja y le dio un dinar a Hakim ibn Hizam para comprar un sacrificio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} También concuerdan en que la agencia es válida en la cesión de deuda (hawala), prenda, fianza, sociedad, depósito, mudaraba, contratos de recompensa (ju'ala), sociedad de irrigación (musaqa), alquiler, préstamo, legado, rescisión, liberación, intercambio (musarafa), cancelación (iqala) y pretibiería, ya que todos estos son como la venta en su necesidad de un agente; Asimismo, fianza, acuerdo y donación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} Los juristas coinciden en que un hombre puede nombrar un agente en un contrato matrimonial, citando el nombramiento por parte del Profeta de 'Amr ibn Umayya y Abu Rafi' para aceptar un matrimonio en su nombre; la necesidad de ello, puesto que un hombre puede desear casarse desde un lugar lejano y no puede viajar hasta allí; y el matrimonio del Profeta con Umm Habiba mientras ella se encontraba en la tierra de Abisinia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Coinciden en que la agencia es válida en actos financieros de adoración, como el zakat, la caridad, los votos y las expiaciones, puesto que el Profeta envió a sus agentes a recolectar y distribuir la caridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} También están de acuerdo en que la agencia es válida en el divorcio, la revocación y el khul', ya que la necesidad es como la necesidad de agencia en la venta y el matrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Actos que la agencia puede no cubrir, por acuerdo. Testimonio: la agencia no es válida en él, porque depende del propio testigo, que informa lo que vio u oyó, y porque se basa en la devoción y la certeza; si un testigo designa a otro para testificar, el segundo actúa como testigo del testimonio del primer testigo y no como agente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Juramentos y votos, ya que dependen del juramentador o votante mismo; así también los juramentos de maldición mutua, el voto de abstinencia de esposas y el juramento de compurgación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Pecados, tales como matar, robar, usurpar y calumniar, que están prohibidos y no pueden ser cometidos por el principal o el agente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Y culto puramente corporal, tales como la oración, el ayuno y la purificación de impurezas menores, ya que dependen del cuerpo de quien está obligado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Asuntos en los que difieren los juristas. La peregrinación: no se permite la representación para una persona que puede hacerla por sí misma; el caso de la persona incapaz se expone en otra parte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} La peregrinación menor (umra) generalmente puede realizarse en nombre de otra persona por representación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Matrimonio de una mujer: la mayoría de los juristas prohíben que una mujer designe o sea designada en matrimonio, ya que no puede contraerlo por sí misma; los hanafíes lo permiten para una mujer adulta libre y cuerda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Zihar: la mayoría prohíbe la agencia en él, la opinión shafi'í más sólida lo prohíbe, y una opinión shafi'í lo permite; Ibn 'Abd al-Salam de los malikíes sostuvo que el zihar es como el divorcio, ya que ambos son meras declaraciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Asegurar actos permitidos, como revivir tierra muerta, sacar agua, cazar, recoger hierba o cavar una mina: los malikíes, la opinión shafi'í más sólida y los hanbalíes lo permiten, ya que la propiedad proviene de una causa que no obliga a la persona; los hanafíes, algunos shafi'íes y algunos hanbalíes lo prohíben, ya que la causa de la propiedad, tomar posesión, ha ocurrido para el agente y una intención no puede desviarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Reconocimiento de derechos: los hanafíes, malikíes, hanbalíes y una visión shafi'í no más sólida lo permiten, ya que establece un derecho en la obligación por medio de palabras, como lo hace la venta; la visión shafi'í más sólida y al-Tahawi lo prohíben, ya que es un informe sobre un derecho, como el testimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} Litigios: los malikíes, shafi'íes, hanbalíes y los dos compañeros de Abu Hanifa permiten la representación en litigios sobre deudas, bienes específicos y todos los derechos, ya sea que el principal esté presente o ausente, enfermo o sano, y ya sea que el oponente consienta o no; los malikíes excluyen a un agente que sea hostil al oponente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} Citan el consenso de los Compañeros, como 'Ali designó a 'Aqil ante Abu Bakr y dijo 'lo que se decida a su favor es mío, y lo que se decida en su contra es mío'; y la necesidad de ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} Abu Hanifa sostiene que el litigio por representación es válido solo con el consentimiento del oponente, a menos que el principal esté enfermo o ausente tres días de viaje o más, ya que la presencia del principal en el tribunal es un derecho de su oponente. Su razón es que una reclamación es un informe que puede ser verdadero o falso, por lo que su respuesta se requiere solo por necesidad; esa necesidad surge cuando el principal está enfermo o viajando. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} Al-Jassas informa que la visión aparente no establece distinción entre un hombre y una mujer, ni entre una virgen y una mujer casada; posteriormente, los hanafíes aprueban la agencia de una mujer recluida que no aparece en público; Ibn Abi Layla la sostuvo válida solo para una virgen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} Prueba y ejecución de la represalia (qisas). Los malikíes, shafi'ís, hanbalíes, Abu Hanifa y Muhammad al-Shaybani permiten la agencia en la prueba de qisas, ya sea que el principal esté presente o ausente, ya que qisas es un derecho humano; Abu Yusuf no lo permite, y la evidencia se acepta solo del propio principal, debido a la duda que debe protegerse contra la represalia y el hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} Sobre la ejecución del qisas: los malikíes, shafi'ís y la visión de la escuela de los hanbalíes lo permiten tanto si el principal está presente como si está ausente. Los hanafíes, algunos shafi'ís y algunos hanbalíes lo permiten solo cuando el principal está presente, puesto que puede perdonar en su ausencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} Prueba y ejecución del hudud. Los shafi'ís y los hanbalíes distinguen los dos. La visión de la escuela de los hanbalíes permite la agencia en la prueba del adulterio, a partir de la historia de Unays; Abu al-Khattab, entre ellos, dice que es inválido. Los shafi'ís no permiten la intervención de terceros para probar el hudud de Dios, excepto el hadd de la calumnia, ya que el derecho es de Dios y se ordena evitarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} En cuanto a la ejecución, los malikíes, shafi'ís y hanbalíes permiten la intervención de terceros, citando la orden del Profeta de apedrear a Ma'iz y el nombramiento de 'Uthman de 'Ali para llevar a cabo la flagelación por beber de al-Walid ibn 'Uqba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} Los hanafíes dicen que hay dos tipos de derechos de Dios: la prueba, donde la representación no está permitida para los hudud que no necesitan litigio, como el adulterio y la bebida, y está permitida para aquellos que la necesitan, como el robo y la calumnia, según Abu Hanifa y Muhammad, pero Abu Yusuf lo prohíbe; y la ejecución de la calumnia y el robo es válida cuando la parte perjudicada está presente, mientras que si está ausente los shaykhs hanafíes difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Las reglas de la representación. Obligan al agente a llevarla a cabo dentro de los límites permitidos por el principal o que la ley o la costumbre imponen, a informar al principal de la información necesaria y rendir cuentas, y a devolver lo que pertenece al principal que está en su poder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Una agencia especial puede ser emitida sin restricciones o con restricciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Entre sus formas está la agencia en la venta. Para Abu Hanifa, el agente en una venta sin restricciones no está sujeto a ninguna restricción a menos que sea sospechoso; puede vender por poco o mucho, al contado o a crédito, y por bienes, ya que la palabra sin restricciones mantiene su sentido sin restricciones, y una venta a una subvaloración bruta para comprar algo más rentable también es costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} La agencia sin restricciones en la venta. Los juristas difieren en cuanto a si está restringida, en dos puntos de vista. El primero, el de Abu Hanifa, es que un agente en una venta sin restricciones no está sujeto a ninguna restricción a menos que sea sospechoso; puede vender por poco o mucho, al contado o a crédito, y por bienes, ya que la palabra sin restricciones mantiene su sentido sin restricciones, y una venta a una subvaloración bruta para comprar algo más rentable es costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} El segundo, el de la mayoría (Malikis, Shafi'is y Hanbalis), es que el agente sin restricciones está restringido por varios límites. Solo puede vender por la moneda de la ciudad, ya que una moneda sin restricciones significa la moneda local. Solo puede vender al precio de mercado en bienes que la gente no venda a una notable subvaloración; si vende por debajo de él, los Malikis le dan al principal una opción, incluso por una pequeña pérdida, que fijan en media décima parte o menos; los Hanbalis consideran válida la venta y hacen al agente responsable por el déficit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} No puede vender en bienes en lugar de dinero, según los Malikis, los Hanbalis y los dos compañeros; no puede vender a crédito, según los Malikis, los Shafi'is y los Hanbalis, aunque una deducción Hanbali lo permite; y no puede vender para obtener un beneficio, según los Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} El agente que se vende a sí mismo. La mayoría (Hanafis, Shafi'is, la opinión de la escuela de los Hanbalis y la opinión establecida de Maliki) lo prohíben, ya que la costumbre en la venta es que un hombre le venda a otro, y hay sospecha de parcialidad. Los Malikis y los Hanbalis lo permiten si el principal lo autoriza, y los Malikis excluyen los casos en que las ofertas han sido altas o cuando la venta se realiza en presencia del principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} Una narración de Ahmad permite que el agente compre si supera la oferta en una subasta pública y alguien más dirige la subasta; al-Qadi dijo que la segunda condición puede ser obligatoria y puede ser recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} Una opinión malikí lo permite si no se favorece a sí mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} El agente vende a alguien cuyo testimonio no puede ser aceptado para él. Para los hanafíes, una venta a tal persona por encima del valor es válida; por debajo del valor por una subvaloración grave es inválida por acuerdo; al valor hay dos narraciones de Abu Hanifa. Los dos compañeros permiten una venta a ellos al valor, excepto a su propio esclavo o al esclavo que ha comprado su libertad a plazos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} Los malikíes sostienen, en la opinión establecida, que el agente no puede vender a su pupilo, ya sea un menor, un derrochador o un esclavo no autorizado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} Los shafi'ís prohíben la venta a su hijo pequeño incluso si está permitida, y la opinión más sólida permite la venta a sus ascendientes y sus descendientes no tutelados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} Los hanbalíes en la opinión de la escuela prohíben la venta a su hijo, su padre o su mukatab (un esclavo contratado para comprar su libertad a plazos); la otra opinión lo permite; la diferencia surge cuando el principal no lo permitió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} Agencia restringida en la venta. El agente debe atenerse a las restricciones que el principal estableció, por acuerdo. Los hanafíes dicen que si va en contra de una restricción, la venta no obliga al principal a menos que la ratifique, a menos que la diferencia sea para mejor, lo que es un acuerdo en el sentido. Si se le dice 'vende mi prenda por mil dirhams' y vende por menos, o por algo distinto a los dirhams, la venta no es vinculante, incluso si los bienes valen más; si vende por más, es vinculante. Si se le dice que venda a crédito y vende al contado, la venta es vinculante; si se le dice que venda al contado y vende a crédito, queda suspendida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} Los malikíes sostienen que exceder el precio en una venta, o pagar menos en una compra, no le da al principal una opción, puesto que es deseado; solo una diferencia que afecte un propósito válido lo hace. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} Los shafiíes y hanbalíes dicen que el agente solo puede actuar en lo que el permiso del principal requiere por palabra o costumbre. Si uno de dos actos perjudica al principal, no puede hacerlo, citando el dicho de que no debe haber daño ni daño recíproco; si uno beneficia al principal, debe hacerlo, ya que ese es el consejo sincero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} Un permiso limitado a un tiempo no se extiende antes ni después de él; uno limitado a un lugar con interés en él, como un mercado conocido por su moneda o precio, se limita a ese lugar, y cuando el lugar tiene igual interés, el permiso se extiende a él. Cuando se nombra al comprador, el agente no puede vender a nadie más, a menos que sepa que el principal no tiene interés en ese comprador en particular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758} Incumplimiento de los términos del precio. En cuanto a la descripción del precio: si el principal dice 'vender a crédito' y el agente vende al contado, la mayoría sostiene que la venta obliga al principal, puesto que obtiene su objeto y el agente le ha dado más; una visión hanbalí hace que la venta sea nula cuando el principal tiene un interés definido en el aplazamiento, y los shafi'ís la prohíben cuando el principal tiene un interés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} Si se le ordena vender a crédito por un precio fijo y vende al contado por menos, los hanafíes, shafi'ís y hanbalíes no permiten la venta, y los malikíes la suspenden con la aprobación del principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} Si se le ordena vender al contado y vende a crédito, los hanafíes, shafi'ís y hanbalíes no lo permiten, ya que el pago inmediato puede ser el interés del principal; los malikíes la suspenden con la aprobación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} Si el principal dijo vender por mil ahora y el agente vendió por mil a crédito, la venta no es vinculante sino suspendida a la aprobación del principal; esta es la opinión de al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} Incumplimiento de la moneda. Si se le dice que venda por dinares y vende por dirhams o por bienes, los hanafíes, los shafi'ís y al-Qadi entre los hanbalíes no permiten la venta, incluso si vale más, ya que el permiso en un tipo no es permiso en otro. La opinión hanbalí más sólida es que si se le dice que venda por un dirham y vende por un dinar, es válido, ya que es costumbre: quien acepta un dirham acepta su equivalente en dinares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} Al-Kasani sostiene la venta suspendida, y el principal elige entre la aprobación y la cancelación. Para los malikíes, cuando las dos monedas son la moneda de la ciudad y tienen el mismo valor, hay dos puntos de vista sobre si el principal elige o aprueba; de lo contrario, elige según uno de ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} Si se le pide que venda por dinero y vende por tela u otros bienes, los hanbalíes y los malikíes lo consideran inválido, ya que los bienes no son un tipo de precio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} Incumplimiento del monto. Si vende por más del precio acordado, en la misma moneda, la mayoría considera válida la venta, puesto que la infracción es para mejor; los shafi'ís añaden que se rechaza si el principal ha prohibido expresamente el exceso, y una opinión shafi'í la prohíbe por completo, puesto que el principal puede tener interés en cumplir su juramento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} Si vende por menos del precio acordado, los malikíes la suspenden con la aprobación del principal: este puede recuperar los bienes si quedan, o su valor si se pierden. Los shafi'ís y una narración hanbalí la anulan, puesto que el principal no aceptó desprenderse de su propiedad en esos términos. La opinión hanbalí establecida valida la venta y hace al agente responsable de la diferencia, y existen dos opiniones hanbalíes sobre cómo se calcula dicha diferencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762} Incumplimiento del lugar. Si nombra un lugar y el agente vende en otro, los shafi'ís, hanbalíes e Ibn Shas, entre los malikíes, exigen que se mantenga en él cuando el lugar tenga un interés particular, como un mercado conocido por su buena moneda o sus altos precios. Algunos hanbalíes y una opinión shafi'í permiten la venta en otro lugar cuando ambos lugares tienen el mismo interés. Los hanafíes exigen que se mantenga en el lugar, y el agente es responsable si rompe la regla; el principal no está obligado por la venta. Los malikíes hacen que la venta esté suspendida a aprobación, y la opinión shafi'í más sólida lo prohíbe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762} Incumplimiento del tiempo. Si se fija un tiempo y el agente vende en otro momento, los hanafíes, shafi'ís y hanbalíes prohíben la venta y no obliga al principal, ya que puede querer la venta en el momento de su necesidad y no antes ni después; los malikíes dejan que el principal elija entre aprobarla y rechazarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763} Incumplimiento del comprador designado. Si el principal dice 'vender solo a él' y el agente vende a otro, la mayoría (hanafíes, shafi'ís, hanbalíes) lo prohíbe, sea cual sea el precio, ya que el principal puede tener interés en ese comprador y no en otro. Los shafi'ís y hanbalíes lo permiten si el agente sabe por una señal clara o por palabras que el principal no tiene interés en ese comprador en particular. Los malikíes dejan que el principal elija. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763} División de la venta. Si el agente vende parte de los bienes y deja el resto, o vende una parte y luego el resto, la regla depende de si la división perjudica al principal. Si no lo perjudica, como con dos casas o dos animales, la venta es válida para los hanafíes, shafi'ís y hanbalíes, y los hanbalíes añaden que es válida a menos que el principal prohíba la división. Los malikíes establecen una regla general según la cual, siempre que el agente se aparte de los términos de su principal o de la costumbre, el principal puede elegir entre aprobar la venta y rechazarla, si los bienes permanecen, y entre aprobarla y responsabilizar al agente si se pierden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} Si la división le perjudica, los juristas dan tres puntos de vista: los shafi'is y hanbalis anulan la venta; los malikíes, Abu Yusuf y Muhammad la suspenden, y se completa si el agente vende el resto; Abu Hanifa permite que la venta surta efecto contra el principal, puesto que el agente está en su lugar y el principal posee parte de los bienes como si poseyera el todo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} Incumplimiento del tipo de objeto. Si el agente vende una cosa diferente en lugar de la nombrada, el punto de vista shafi'i y hanbali más sólido anula la venta, porque ha roto los términos del permiso; Los malikíes y una narración hanbalí permiten que el principal elija. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} Agencia en la compra. Puede emitirse sin restricciones, como en 'compra para mí lo que quieras'. Los hanafíes, los malikíes y una narración de Ahmad lo permiten, ya que el principal ha delegado su juicio; los hanbalíes en la visión de la escuela y los shafi'íes lo prohíben, ya que el agente puede comprar lo que no puede pagar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} El agente que compra para su principal de su propia propiedad o de aquellos cuyo testimonio no puede ser aceptado para él: los hanafíes prohíben comprar de sí mismo incluso con permiso, ya que los derechos de venta regresan al agente y eso haría que una persona fuera tanto pagador como beneficiario; prohíben comprar de su hijo menor incluso con permiso. Abu Hanifa prohíbe comprar a su padre, abuelo, hijo adulto o esposa; Abu Yusuf y Muhammad lo permiten por el valor o menos, o con un pequeño excedente. Si la agencia es general, los Hanafis están de acuerdo en que la compra está permitida, ya que la causa de la prohibición es la sospecha, que las palabras generales eliminan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766} Los Malikis en la opinión establecida y los Hanbalis en la opinión de la escuela prohíben comprar de su propia propiedad, y lo permiten si el principal lo permite; los Malikis permiten comprar de sus parientes si no hay sospecha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} Los shafi'íes prohíben comprar de su propia propiedad o de su hijo menor en todos los casos, y en la opinión más sólida permiten comprar de sus ascendientes y descendientes adultos e independientes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} Agencia restringida en la compra. Es válido, los hanafíes (sobre istihsan), los malikíes y la escuela hanbalí coinciden, incluso si no se nombra el tipo de bienes: 'cómprame una prenda' es válido, por analogía con la sociedad de lucro. Los hanafíes citan el hecho de que el Profeta le diera un dinar a Hakim ibn Hizam para comprar un sacrificio, lo que demuestra que una pequeña incertidumbre no impide la agencia, ya que la agencia se basa en la indulgencia y no en la estricta negociación de la venta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} Compra restringida y sus incumplimientos. Si el principal ordenó una compra a plazos y el agente compró al contado, la mayoría (hanafíes, malikíes, una opinión shafi'í y la opinión de la escuela de los hanbalíes) permiten la compra y la hacen vinculante para el principal si el agente no ha aumentado el precio, ya que el incumplimiento es solo formal y coincide en el significado. Los shafi'íes en la opinión establecida no lo permiten, ya que el principal quería que no tuviera deudas; una opinión hanbalí lo prohíbe cuando el principal resulta perjudicado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} Si el agente compró a crédito cuando se le dijo que pagara en efectivo, los Hanafis obligan solo al agente, los Malikis dan al principal la opción, los Shafi'is anulan la compra si fue con el propio dinero del principal, y los Hanbalis la hacen suspendida a aprobación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} Incumplimiento del tipo de precio en la compra. Los Shafi'is y una visión Hanbali lo anulan. La visión de la escuela de los Hanbalis permite el intercambio de dirhams por dinares y viceversa, ya que quien acepta un dirham acepta un dinar en su lugar, pero no bienes en lugar de las dos monedas. Los hanafíes sostienen que si se le dijo que comprara con dinares y compra con otros bienes, la compra obliga solo al agente; según la opinión transmitida por al-Karkhi, la compra tampoco es vinculante para el principal por dirhams en lugar de dinares. Los malikíes la suspenden con aprobación, y hay dos opiniones bien conocidas sobre si los dirhams en lugar de dinares obligan al principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770} Incumplimiento del monto del precio. Si el incumplimiento es para la ventaja del principal, como comprar una bestia por menos del precio acordado, la compra obliga al principal, ya que el incumplimiento es solo en la forma. Los shafi'ís y hanbalíes exceptúan el caso en que el principal prohibió pagar menos. Si el incumplimiento es en desventaja del principal, los hanafíes obligan solo al agente; Los malikíes obligan al principal por un pequeño exceso, como uno en veinte, y hacen que un gran exceso quede suspendido en su aprobación, obligando al agente si lo toma por sí mismo; los shafi'ís y una visión hanbalí lo anulan; la visión de la escuela de los hanbalíes lo valida y hace al agente responsable del exceso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771} Incumplimiento del objeto comprado. Si el agente compra algo distinto de lo que se le dijo, los hanafíes hacen que la compra recaiga sobre el agente y no obligue al principal. Los malikíes dejan que el principal elija; si lo rechaza, la compra recae sobre el agente, quien paga el precio con su propio dinero. Los shafi'ís lo anulan si compra con el dinero del principal; Si compra a su propio crédito sin nombrar al principal, la responsabilidad recae sobre el agente, incluso si su intención era que el principal fuera él. Los hanbalíes validan la compra a crédito del agente, con dos puntos de vista sobre si vincula al principal, y sostienen que una compra con dinero del principal es nula en el punto de vista sólido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773} Los shafi'ís (sobre un nombre dicho en la aceptación) sostienen que el nombre se ignora y la compra recae sobre el agente en el punto de vista más sólido, mientras que el otro punto de vista anula el contrato.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772} Incumplimiento de la cantidad comprada. Cuando el agente compra más de lo mismo que el principal, por el mismo precio, los hanafíes distinguen: para las cosas valoradas individualmente (qiyyamiyyat), el excedente no obliga al principal en absoluto, puesto que se desconoce el precio de cada una. Para las cosas medidas por peso, Abu Hanifa, y Muhammad en algunas narraciones, obligan al principal solo por la cantidad ordenada; Abu Yusuf y Muhammad lo obligan por la totalidad. Los hanbalíes, y los malikíes en la opinión opuesta a la establecida (la de Asbagh), obligan al principal si el agente compra dos ovejas por un dinar y cada una vale un dinar; los hanbalíes añaden que es válido si una de ellas vale un dinar, mientras que si ninguna lo vale, es inválido según la opinión de la escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774} Los shafi'ís distinguen si el principal describió la oveja o no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774} División de la compra. Si la cosa ordenada puede dividirse por costumbre sin daño al principal, todos concuerdan en que el agente puede comprar una parte, y el principal está obligado por lo que compró; los hanbalíes y una opinión shafi'í restringen esto al caso en que el principal no dijo 'cómpralo todo en una sola transacción'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} Si la costumbre prohíbe la división, o perjudica al principal, los hanafíes y los malikíes hacen que la compra se suspenda con la aprobación del principal. La mayoría de los hanafíes sostienen que comprar el resto antes de que el principal demande al agente en el tribunal vincula al principal, ya que la compra parcial fue un medio para ejecutar la orden; Zufar sostiene que la compra recae solo sobre el agente. Si el principal demanda primero y el juez vincula al agente, una compra posterior del resto vincula solo al agente, por acuerdo hanafí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} Si el principal ordena la compra de un bien descrito, el agente solo puede comprar uno sano, ya que una venta sin condiciones implica la ausencia de defectos. Si compra uno defectuoso, los Hanafis sostienen, por acuerdo, que no obliga al principal cuando no se cumple la descripción: por ejemplo, una esclava ciega o manca comprada cuando se le dijo que comprara un sirviente, o un semental comprado cuando se le dijo que comprara un caballo de montar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17776}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} Si el principal nombró los bienes, y el agente los compró defectuosos sin saberlo, la compra obliga al principal, quien puede devolverlo. Si el agente lo sabía, no obliga al principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} Los Hanafis agregan que si el agente toma la compra y encuentra un defecto mientras está en su mano, puede devolverlo; pero si se lo ha entregado al principal, puede devolverlo solo con el permiso del principal, ya que la agencia ha terminado con la entrega. Si el agente acepta el defecto, lo obliga, y el principal puede aceptarlo o hacer responsable al agente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} Los malikíes sostienen que el agente que compra un bien defectuoso a sabiendas está obligado si lo compró directamente o a opción del vendedor; si lo compró a su propia opción, no lo obliga y puede devolverlo. La compra obliga al principal solo si el defecto es leve y habitualmente tolerado y la compra es una ganga, como con una bestia barata con la cola corta, a diferencia de una bestia noble con la cola cortada, que no lo obliga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} Los shafi'ís, para una compra a crédito del agente, sostienen que si el bien defectuoso vale el precio pagado, y el agente no lo sabía, la compra recae sobre el principal; si lo sabía, la opinión más sólida dice que no recae sobre el principal. Si el defecto hace que valga menos que el precio, la opinión más sólida hace que sea vinculante para el principal si no lo sabía, y no si lo sabía. Si compró con el propio dinero del principal, es vinculante para el principal si el agente no lo sabía, y no si lo sabía. Si el principal exigió expresamente que estuviera en buen estado, al-Isnawi dice que no es vinculante para el principal, ya que no estaba autorizado. Tanto el principal como el agente pueden devolver el bien, si el agente desconocía el defecto, y el agente no puede devolverlo si el principal lo ha aceptado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} Los Hanbalis: si el agente conocía el defecto, la compra a su crédito no obliga al principal; si no lo conocía, la compra está permitida y tanto el agente como el principal pueden devolverlo. Los Azjiyy plantearon si una compra con el dinero del principal con conocimiento del defecto recae sobre el principal; si los bienes son iguales al precio, la opinión aparente es que lo acepta, pero puede que no. Si el principal nombró un artículo defectuoso y el agente lo sabía antes de comprarlo, el agente no puede comprarlo; si lo compra, la compra lo obliga a él y obliga al principal solo si este la acepta; si no lo sabía, puede devolverlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17779}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780} El agente y un contrato inválido. Si el principal autorizó un contrato inválido, el agente no puede celebrar un contrato válido en su lugar; esta es la opinión de los shafi'is, hanbalis, Muhammad y Zufar. Abu Hanifa y Abu Yusuf, por istihsan, permiten que el contrato válido obligue al principal cuando sea mejor para él, como con un agente que vende por mil y vende por dos mil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781} El agente y la estipulación de una opción. Los Hanafis sostienen que si el principal ordenó una venta con una opción de tres días para sí mismo y el agente vendió sin ella o con menos, la venta es nula y es responsable como usurpador. Si se le dijo que estipulara una opción de un mes y estipuló tres días, Abu Hanifa lo permite por istihsan, pero sus dos compañeros no, ya que en su opinión la opción de un mes es válida con la venta. Los Shafi'is sostienen que una venta con una opción declarada es nula si el agente vende sin ella. Los Hanbalis permiten que el agente estipule una opción para sí mismo y para su principal, pero no para la otra parte, ya que eso obliga al principal a lo que no acordó. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782} El agente en litigio haciendo una admisión. Los malikíes, shafi'ís, hanbalíes y zufar no lo permiten, ya que una admisión termina la disputa, lo cual el agente no puede hacer, y el mandato de contender no incluye su opuesto. Abu Hanifa y Muhammad lo permiten solo ante el juez, excluyendo el hudud y la represalia; su analogía lo permite también en otros lugares, y Abu Yusuf lo permite en todos los casos. Si el principal excluyó la admisión, la admisión es nula y deja al agente fuera de la agencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783} El acuerdo, liberación, venta, donación y aplazamiento por parte del agente litigante no le pertenecen, por acuerdo; los hanafíes añaden que no puede vender, dar o aplazar el derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783} El agente para cobrar una deuda, cuando el deudor la niega. La escuela Hanbali y una escuela Shafi'i lo consideran un agente en litigio para la prueba, ya que no puede cobrar sin probar el derecho, por lo que esto es un permiso por costumbre; el agente es como tal ya sea que el derecho sea una cosa específica o una deuda, y ya sea que el principal conozca la voluntad del deudor de pagar o su negación o demora. Abu Yusuf, Muhammad, los Malikis, una escuela Hanbali y una escuela Shafi'i le niegan este poder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} El permiso para cobrar no es permiso para litigar, ni de palabra ni por costumbre, puesto que una persona aceptada para cobrar no tiene por qué ser aceptada para litigar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} Abu Hanifa distingue al agente que cobra una cosa específica, que no es parte en la disputa del principal sobre una compra o similar, del agente que cobra una deuda, que sí es parte, puesto que cobrar una deuda es un intercambio que el agente litigante puede realizar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} Sobre si un agente de litigio puede cobrar lo que fue designado para litigar: los shafi'ís, la opinión de la escuela de los hanbalíes, Zufar y la opinión transmitida por Abu Yusuf sostienen que no puede, ya que un principal puede aceptar a un hombre para litigar que no aceptaría para cobrar. Los demás hanafíes, y una opinión hanbalí en la que se basó Ibn al-Banna, lo permiten, ya que quien es designado para un asunto es designado para completarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} Designación de otro por un agente de litigio. Si el principal lo permite, el agente puede designar a otro; si lo prohíbe, no puede. Cuando el principal no dice nada, los Hanafi, los Maliki y la visión de la escuela de los Hanbali lo prohíben, porque las personas difieren en elocuencia y habilidad en litigios. Los Maliki y los Hanbali limitan esto a asuntos que corresponden al agente mismo; si el asunto está por debajo de él o más allá de su habilidad, puede nombrar a otro, y los Maliki agregan que cuando el litigio es pesado puede nombrar a un socio para que lo ayude, aunque no a otro en su lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786} Ibn Qudama dice que cuando la agencia no está restringida, el agente puede nombrar a otro si el trabajo está por debajo del agente o más allá de su capacidad en volumen; para el trabajo que puede hacer él mismo, hay dos narraciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} Si dos partes designan a un agente para litigar una contra la otra, los Hanafis consideran que la designación es inválida; si las dos designan a un agente contra un tercero, es válida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} Pago de una deuda por un agente. Si el principal dice 'páguelo y no tome testigos', el agente no es responsable si el acreedor niega el pago; si el principal ordena testigos y el agente no toma ninguno, el agente es responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} Si se le ordena pagar sin una instrucción explícita sobre testigos y no los toma, los hanafíes, malikíes, shafi'ís y la opinión de la escuela de los hanbalíes lo hacen responsable, puesto que no tuvo cuidado; su palabra no se acepta contra el acreedor sin prueba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} No es responsable si pagó en presencia del principal, según los malikíes, la opinión de la escuela de los hanbalíes y la opinión shafi'í más sólida, puesto que el silencio del principal es consentimiento; una opinión shafi'í lo hace responsable, puesto que una negligencia no se elimina con la presencia del principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} El agente para cobrar una deuda. Una vez que cobra, el deudor queda liberado, el dinero es del principal y el agente lo mantiene en fideicomiso, sujeto a las reglas de un depósito. El agente para cobrar no puede regalar la deuda, aplazarla ni liberarla. Los hanafíes añaden que no puede tomar una prenda por ella, pero sí puede tomar un fiador; los malikíes y hanbalíes añaden que no puede transigir sobre ella sin el permiso del principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789} Entrega de un derecho a quien afirma ser agente de un propietario ausente. Todos coinciden en que si el reclamante prueba la agencia mediante evidencia, el juez obliga al deudor a pagarle. Si no se presenta evidencia, los Malikis, Shafi'is y la visión de la escuela de los Hanbalis sostienen que el deudor no está obligado a pagar al reclamante a menos que confirme la agencia; si el deudor paga voluntariamente y el acreedor niega la agencia, el acreedor puede recuperar solo del pagador, y el pagador puede recuperar del agente si el dinero se pierde por su culpa o negligencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790} Los Hanafis distinguen una deuda de una cosa específica: si el deudor confirma la agencia del reclamante, se le ordena pagar, y si la niega, solo el agente está obligado por lo que cobró. Cuando el propietario ausente confirma posteriormente la agencia, el deudor queda liberado; Si lo niega, el deudor paga de nuevo y puede recuperarlo del agente si el dinero permanece en su poder, y si se perdió en su poder, el deudor no puede recuperarlo del agente a menos que se haya hecho responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17791} Si el deudor prueba que el reclamante negó la agencia y tomó el dinero de él, la prueba es aceptada, porque establece que el derecho del reclamante a la suma ha terminado por su propia cobranza, y por lo tanto la retención del agente termina por necesidad. Si el derecho es una cosa específica, como un depósito, y el depositario confirma la agencia del reclamante, no se le ordena entregarlo, ya que eso sería una admisión de que entregó la propiedad de otro; una deuda es diferente, y se le ordena pagarla, puesto que admite que la suma es propiedad del acreedor, siendo las deudas canceladas por sumas iguales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792} Si el depositario entrega el depósito a alguien que reclama agencia, se pierde en su mano y el propietario niega la agencia, el depositario es responsable; puede hacer jurar al propietario, y no puede recuperar del agente a menos que lo haya hecho responsable en el momento de la entrega. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792} Varios agentes. El principal puede nombrar a más de un agente para una disposición particular que no sea un litigio. Si los nombra de una sola palabra a la vez, ninguno puede actuar solo, a menos que el principal lo permita. Los Hanafis sostienen que cuando la disposición requiere juicio y asesoramiento, como la venta, el matrimonio y el cobro de una deuda, ninguno puede actuar solo; Cuando no lo hace, como entregar un regalo, devolver un depósito o pagar una deuda, cada uno puede actuar solo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793} Dos agentes para una venta, un matrimonio, un khul' o cualquier contrato con una suma de por medio tampoco actúan solos, ya que el principal confió en el juicio de ambos. Los dos agentes para cobrar una deuda no pueden cobrar uno sin el otro, aunque su cobro se completa una vez que lo cobrado por uno llega al otro o al principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794} Los hanafíes y los malikíes permiten que cualquiera de los dos agentes designados por palabras separadas actúe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} Para dos agentes en litigio, cada uno puede actuar solo según los Hanafis (excepto Zufar), una visión Hanbali y una visión Shafi'i, ya que el litigio apunta a informar al juez y las dos voces lo confunden; Zufar, la visión Shafi'i más sólida y la visión de la escuela de los Hanbalis lo prohíben. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} Un agente que designa a otro. Con permiso, está permitido por acuerdo. Con prohibición, no está permitido por acuerdo. Cuando el principal dice \"haz lo que quieras\" o \"actúa según tu criterio\", los hanafíes, malikíes y hanbalíes lo permiten, mientras que los shafiíes lo prohíben, ya que tales palabras admiten muchas posibilidades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796} Cuando no se dice nada, la mayoría lo prohíbe, ya que el principal confió en el criterio del agente y las personas difieren en criterio. Algunos permiten dos casos: cuando el trabajo está por debajo de la capacidad del agente o excede sus habilidades, y cuando podría hacerlo él mismo pero no puede hacerlo todo porque es muy extenso. En el segundo caso, la opinión de la escuela de los hanbalíes y una opinión shafií le permiten delegar todo el trabajo; los malikíes y la opinión de la escuela de los shafiíes permiten solo el exceso que exceda su capacidad. Ahmad e Ibn Abi Layla lo permiten en todos los casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17797}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798} La confianza de aquel a quien designa un agente. Quienquiera que designe el agente debe ser digno de confianza, a menos que el principal haya designado a una persona indigna de confianza, en cuyo caso el agente sigue la elección del principal. Si el designado por el agente se convierte en un malhechor, los Hanbalis y una opinión Shafi'i exigen que el agente lo destituya, y la opinión Shafi'i más sólida dice que el agente no puede destituirlo, ya que se le permitió designar pero no destituir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798} El tipo de agencia que tiene el designado. Si el principal dice 'nombra en mi nombre' o 'delega en él', el designado es el agente del principal, no es destituido por la remoción del primer agente, y ambos pierden su cargo a la muerte del principal. Si el principal dice 'nombra en tu nombre', el designado es el agente del primer agente, y cae con la remoción o muerte del primero; los shafi'ís y los hanbalíes permiten que el principal revoque al subagente, ya que es una rama de una rama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} Si el principal dice solo 'nombra', los hanafíes, los malikíes, la opinión shafi'í más sólida y la opinión de la escuela de los hanbalíes hacen que el designado sea el agente del principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} El nombramiento sin permiso no es válido según la mayoría; Ahmad e Ibn Abi Layla lo validan en un caso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} El agente es un fideicomisario de lo que está en su poder de la propiedad de su principal. Es como un depósito: no es responsable de una pérdida a menos que transgreda o sea negligente, ya sea que trabaje por un salario o como voluntario, ya que su mano es la mano del principal, y la agencia es un contrato de bondad y asistencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800} Como fideicomisario, su palabra es aceptada en su propia liberación de responsabilidad con su juramento, ya que la agencia se basa en la indulgencia y la facilidad de trato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801} Responsabilidad estipulada o su ausencia. Ibn Qudama dice que lo que es un fideicomiso no se convierte en responsabilidad por estipulación, y lo que es una responsabilidad no puede eliminarse por estipulación; una narración de Ahmad parece permitir la eliminación de la responsabilidad por estipulación, pero la primera opinión es la opinión aparente de la escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801} Transgresión y negligencia. El agente es responsable si sobrecarga a un animal, usa una prenda sin permiso, pierde el dinero sin saber cómo, mezcla el dinero del principal con el suyo de manera que no se pueda separar, se niega a devolverlo sin excusa, o retrasa la devolución después de que la excusa haya terminado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} Si el principal pagó la deuda él mismo y el agente luego también la pagó, el agente no es responsable si no lo sabía; si lo sabía, es responsable, ya que el pago del principal fue una remoción del agente del cual el agente tenía conocimiento. Abu Hanifa considera al agente responsable de un doble pago de zakat ya sea que lo supiera o no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} Si un agente de ventas a crédito entrega los bienes antes de cobrar el precio y el comprador niega el pago, es responsable del valor de los bienes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} Si retrasa el pago del precio que ha recibido sin excusa hasta que se pierde, es responsable; con una excusa, no lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} Si sacrifica una bestia por error y muere ilegalmente, es responsable, ya que el error y la intención son lo mismo para la propiedad de las personas. Si se le dijo que cobrara un depósito completo pero cobró una parte, es responsable, y la responsabilidad desaparece si cobra el resto antes de que se pierda la primera parte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} Medida de la responsabilidad. Por una cosa fungible paga su equivalente; por una cosa valorada individualmente paga su valor; si una cosa fungible no tiene equivalente, paga su valor. El valor se toma el día de la transgresión o pérdida, no en ningún otro día. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804} Deber de rendir cuentas. El agente debe dar al principal la información que este solicita sobre lo que ha hecho, e Ibn Hajar dice que cualquier persona de confianza a la que se le pida una cuenta debe darla; Lo que cuenta es la respuesta y la reclamación, no la letra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804} Devolución de lo que está en la mano del agente. Debe devolver al principal lo que tiene. Si se niega cuando se le pide, sin excusa, hasta que se pierde, es responsable; y así también si una excusa termina y retrasa la devolución hasta la pérdida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804} Si el principal y el agente acuerdan un salario, el salario es debido por acuerdo. Si no acuerdan, los Hanafis distinguen: un agente que no trabaja por un salario actúa como voluntario, ya que la agencia es originalmente gratuita; un agente de un oficio cuyas personas trabajan por un salario, como un corredor o un comerciante, tiene derecho al salario habitual. El artículo 1467 de la Majalla al-Ahkam al-'Adliyya establece esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805} Cuándo se debe el salario. El agente lo gana entregando lo que se le confió, cuando la entrega es posible, como una tela que teje o cose; si fue designado para vender, comprar o realizar la peregrinación, gana el salario acordado al completar el trabajo, incluso si el precio aún no se ha cobrado. Pero si el principal estipuló que el precio se entregara primero y el agente no lo entregó, no tiene salario, ya que la condición no se cumplió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806} Condiciones para el salario. El trabajo debe ser conocido, el salario debe ser conocido en cantidad, el salario no debe ser parte del objeto de la agencia según algunos juristas, y el agente debe llevar a cabo la agencia válidamente. Una recompensa desconocida, como 'una décima parte de su precio', da solo el salario habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806} Si el agente hace una venta defectuosa, no tiene recompensa, ya que un permiso general para vender permite solo una venta válida; si hace una venta válida y el precio se pierde en su mano, tiene la recompensa porque el trabajo fue hecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807} Recuperación del principal de lo que el agente pagó. Si el principal le ordena pagar una deuda y él paga con su propio dinero, la recupera independientemente de que el principal haya estipulado o no la recuperación. Si el agente compra sin el dinero del principal y paga el precio con su propio dinero, los hanafíes, excepto Zufar, le permiten retener la mercancía hasta que cobre el precio del principal, puesto que este es la parte contratante a quien se le debe el precio. Zufar afirma que no puede retenerla, ya que la mercancía está en custodia. La responsabilidad por retenerla es, para Abu Hanifa y Muhammad, como la de un vendedor; para Abu Yusuf, como una prenda; para Zufar, como una usurpación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808} De quién son los derechos que afectan un contrato realizado por el agente. Los contratos son de dos tipos: los que pueden hacerse en nombre del agente, como la compraventa y el alquiler, cuyos derechos regresan al agente, quien entrega los bienes, recibe el precio y demanda por el precio como si fuera el propietario; y los que deben hacerse en nombre del principal, como el matrimonio, el khul' y el acuerdo sobre homicidio intencional, cuyos derechos regresan al principal, de modo que el agente del marido no es demandado por la dote. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} Los shafi'ís y una narración de Ahmad sostienen que los derechos de todo contrato regresan al agente; la opinión de la escuela hanbalí sostiene que regresan al principal en todos los casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808} Si el principal ordena al agente que cobre el precio, el agente tiene derecho a exigirlo, y el comprador está obligado a pagar cualquiera de ellos que le pida. Si el principal prohíbe al agente cobrar, la prohibición es válida; pero si el comprador paga el precio al principal, queda liberado por istihsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} Si los bienes son embargados al comprador, este recupera el precio de quienquiera que haya pagado, el agente o el principal; y se reclama un defecto contra el agente si es él quien recibió los bienes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} Los contratos que deben hacerse en nombre del principal, como el matrimonio, el khul', la manumisión por pago, el escrito de manumisión y el acuerdo sobre homicidio intencional, tienen sus derechos a favor y en contra del principal; el agente es un mensajero y un transportista. Así, el agente del marido no es demandado por la dote, y el agente de la esposa no puede recibirla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} Los malikíes sostienen que el agente en una venta reclama y cobra el precio, y el agente en una compra recibe y entrega los bienes; devuelve un defecto si no lo conocía, y está obligado por el precio a menos que lo rechace expresamente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} Cómo el efecto del contrato llega al principal. La mayoría (las opiniones más sólidas de los hanafíes y shafi'íes, los malikíes y los hanbalíes) sostienen que el efecto pasa directamente al principal, ya que el contrato se hizo para él. Al-Karkhi sostiene que primero recae sobre el agente y luego pasa al principal. Abu Zayd sostiene que el agente es un representante del dictamen y un principal de los derechos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} Disputas entre agente y principal. Sobre la existencia de la agencia, se acepta la palabra del principal, puesto que el estado original es que no hay agencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} En sus términos (una venta por un precio o a crédito, un objeto en particular), la palabra del principal es aceptada por los Hanafi, Maliki, Shafi'i y en una opinión Hanbali; los Maliki añaden dos casos en los que prevalece el juramento del agente; la opinión de la escuela de los Hanbali acepta la palabra del agente, puesto que es digno de confianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} En caso de pérdida de lo que el agente posee sin negligencia, la palabra del agente bajo juramento se acepta por acuerdo, ya que es un fideicomisario y no puede probar fácilmente la pérdida. Los malikíes limitan esto a un agente que no es sospechoso; los hanbalíes a una causa oculta, como el robo; si la causa es evidente, como el incendio o el saqueo, el juez hanbalí (al-Qadi) requiere primero la prueba del evento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} En caso de una reclamación de transgresión o negligencia en la custodia, la palabra del agente bajo juramento se acepta, ya que niega lo que se le alega. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} Disputas sobre la venta y el cobro del precio. Los hanafíes analizan los casos, dependiendo de si el objeto fue entregado al agente o no. Si el principal confirma la venta y el cobro, pero no la pérdida o la entrega, se acepta la palabra del agente bajo juramento respecto de la pérdida. Si el principal niega la venta y el cobro, se cree al agente respecto de la venta, pero no respecto del cobro frente al principal; el comprador puede volver a pagar al principal y tomar la mercancía, o rescindir el contrato; si el principal confirma la venta y el agente dice que el comprador pagó al principal, el comprador queda liberado por el reconocimiento del agente, pero el agente es responsable si luego no puede probarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} El resumen se condensa aquí. Los malikíes sostienen que si el agente dice 'Actué como me permitiste', su palabra es aceptada, puesto que es digno de confianza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} Los shafi'ís sostienen que si la disputa surge después de la remoción del agente, su palabra no es aceptada sin prueba; si es antes, hay dos puntos de vista, el más aceptado de los cuales da la palabra del principal; el otro da la palabra del agente cuando puede actuar solo (como en el divorcio y la manumisión) con juramento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} Los hanbalíes en la visión de la escuela aceptan la palabra del agente de que vendió y cobró y el precio se perdió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816} En la reclamación de haber devuelto lo que el agente tiene, la mayoría acepta la palabra del agente con juramento, ya sea que se pague la agencia o no, según los hanafíes y malikíes; los shafiíes y hanbalíes requieren prueba cuando se le paga, y aceptan su juramento cuando no se le paga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816} El fin de la agencia. La primera forma es la remoción. La agencia es un contrato no vinculante, por lo que cualquiera de las partes puede terminarla por despido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816} El fin de la agencia. La primera causa es la remoción. El principal puede despedir a su agente y prohibirle el acto, y el agente puede despedirse a sí mismo; los juristas están de acuerdo en esto en general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817} Condiciones para una remoción válida por parte del principal. La primera es que el agente tenga conocimiento de la remoción. Los hanafíes, una opinión de los malikíes, una opinión shafi'í y una narración hanbalí lo requieren, ya que la remoción disuelve el contrato y no puede vincular sin conocimiento. La mayoría de los malikíes, la opinión shafi'í más sólida y la opinión de la escuela de los hanbalíes no lo requieren. Para los Hanafis, el conocimiento se obtiene estando presente en la remoción, por carta del principal, por un mensajero (sea confiable o no, adulto o menor), o por el informe de dos hombres confiables o un hombre confiable, y un informe de un hombre no confiable cuenta si el agente lo cree. Abu Hanifa sostiene que si el agente niega el informe, no es removido incluso si resulta ser cierto, ya que informar una remoción se asemeja a un testimonio; Abu Yusuf y Muhammad discrepan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818} El segundo es que ningún derecho de un tercero está vinculado a la agencia. Los Hanafis sostienen que la remoción sin el consentimiento del titular del derecho no es válida, como con una prenda dada a un acreedor con el agente designado para venderla, o con un agente de un demandado en un juicio designado a solicitud del demandante. Los shafi'ís permiten la remoción si la agencia fue solicitada por la parte contraria; los malikíes prohíben la remoción una vez que el agente se ha reunido con el oponente tres veces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} El tercero es que la agencia no es un contrato de alquiler, ya que una agencia contratada vincula a ambas partes. El cuarto es que la remoción no debe causar daño; el Shafi'i Sharwani dice que la remoción está prohibida si permitiría que un malhechor se apoderara de la propiedad de un pupilo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} La remoción del agente no requiere el conocimiento del principal, por la mayoría, excepto que los Hanafi lo requieren cuando la agencia es para litigio o la compra de una cosa específica. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820} Muerte. La agencia termina con la muerte del principal o del agente, por acuerdo, ya que la muerte termina la capacidad y la propiedad pasa a los herederos. Los Hanafi, Shafi'i y la visión de la escuela de los Hanbali no requieren el conocimiento del agente sobre la muerte. Los malikíes sostienen que si la persona que trata con el agente estaba en la ciudad de la muerte y sabía de la agencia, el agente no es removido hasta que sepa de la muerte; de lo contrario, el agente es removido solo al saber de la muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820} Locura. Los hanafíes terminan la agencia por locura permanente, tomando un mes según Abu Yusuf y un año según Muhammad; una vez que es permanente, la agencia no regresa al recuperarse. Los shafi'ís y la visión de la escuela de los hanbalíes terminan con ella por locura; los malikíes no, a menos que la locura del principal sea larga, en cuyo caso el juez la considera; una narración hanbalí dice que no termina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17821} Desmayo. La mayoría de los juristas no terminan la agencia por ella; La opinión shafi'í más sólida lo hace, por analogía con la locura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822} Interdicción. Los hanafíes sostienen que la interdicción del principal o del agente termina la agencia, pero especifican que la interdicción del principal la termina solo cuando la agencia se refiere a contratos y litigios, no al pago de deudas o al cobro de un depósito. Los hanbalíes la terminan por interdicción por prodigalidad, y por la insolvencia del principal en aquello de lo que se le restringe. Los shafi'íes la terminan por interdicción por prodigalidad o insolvencia en cualquier disposición que no surta efecto. Los malikíes la terminan por la insolvencia estricta del principal, una orden judicial para tomar los bienes del deudor para sus acreedores, no por insolvencia general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823} Apostasía. Los hanafíes sostienen que si se determina que el apóstata se unió a la tierra del enemigo, la agencia termina y no se renueva con su regreso al Islam, según la visión de la escuela. Sus actos antes de unirse quedan suspendidos según la visión de Abu Hanifa y son vinculantes según la visión de Abu Yusuf y Muhammad. Los malikíes sostienen que el agente es removido por la apostasía de su principal después del período de solicitud de arrepentimiento. Los shafi'íes basan el asunto en si la propiedad del apóstata pasa de ser de su propiedad, con varias opiniones, siendo la más evidente que queda suspendida. Los hanbalíes sostienen que la agencia no termina con la apostasía del agente, según la visión de la escuela, sino con la apostasía del principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17824} Inmoralidad (fisq). Los hanbalíes sostienen que la agencia no termina por la inmoralidad del agente, excepto en asuntos que la inmoralidad contradice, como la oferta en un matrimonio, donde un agente es removido por su propia inmoralidad o la de su principal. Un agente para asuntos que requieren confianza, como el agente de un tutor de un huérfano o el administrador de una dotación, es removido por su propia inmoralidad o la de su principal. Los shafi'ís terminan por la inmoralidad del principal en asuntos que requieren integridad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825} Embriaguez. Los shafi'ís sostienen que si cualquiera de las partes se emborracha sin culpa el agente es removido; Si es por culpa, los shafi'is dicen que puede o no terminar la agencia. Los hanbalis sostienen que no termina la agencia excepto en asuntos que contradice, como la oferta de matrimonio. Los hanafis sostienen que nunca termina la agencia: un agente designado para divorciarse que se divorcia estando ebrio no se ha divorciado; un agente que vende estando ebrio no obliga al principal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826} El objeto deja de ser propiedad del principal. Si el principal hace el acto él mismo, como al vender los bienes antes que el agente, o si los bienes son reclamados por otro, o si él mismo se casa con la mujer, la agencia termina. Los malikíes sostienen que si el principal vendió a un comprador y el agente vendió a otro, la primera venta es vinculante y la segunda es una venta no autorizada, a menos que el segundo comprador haya tomado posesión, en cuyo caso la segunda se mantiene y la primera se anula, a menos que el segundo comprador y el vendedor supieran de la primera. Los hanbalíes sostienen que la admisión del agente de que recibió lo que se le encargó cobrar termina la agencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826} Si el objeto regresa al principal. Muhammad sostiene que la agencia regresa, ya que lo que regresa por rescisión es la primera propiedad con sus derechos; los shafi'ís y Abu Yusuf sostienen que no, ya que el propio acto del principal implica la remoción del agente. Ibn 'Abidin dice que regresa si la propiedad regresa por rescisión, no de otra manera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827} La transgresión del agente en lo que se le encomendó hacer. La opinión shafi'í más sólida y la opinión de la escuela hanbalí sostienen que la agencia no termina por transgresión, puesto que el acto se realizó con permiso: la confianza se pierde por transgresión, pero el acto permanece, como con una prenda. La opinión shafi'í opuesta y una opinión hanbalí la terminan, puesto que la agencia es un contrato de confianza, como un depósito. Al-Mardawi dice que si el agente destruye aquello para lo que fue designado, la agencia termina, y si permanece, no termina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827} Negación. Los hanbalíes y una visión de los hanafíes sostienen que la agencia no termina por la negación del agente o del principal, ya que la negación no muestra una revocación del permiso anterior; la fatwa hanafí y una visión hanbalí sostienen que termina. Los shafiíes sostienen que la negación por olvido o para ocultar algo no es una eliminación; si alguno niega deliberadamente sin razón, se elimina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828} Pérdida del objeto. La agencia termina cuando se pierde el objeto y cuando muere la mujer cuyo divorcio fue confiado. Los hanafíes sostienen que la agencia de dos socios termina cuando se separan, incluso si el agente no lo sabe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828} Finalización del acto. Los hanafíes sostienen que el agente queda relevado cuando se completa el asunto encomendado, como cuando cobra una deuda o contrae matrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828} Retiro implícito. Los hanbalíes sostienen que la agencia termina por el retiro implícito del principal, como cuando mantiene relaciones sexuales con una esposa cuyo divorcio le fue encomendado, o por el retiro implícito del agente, como cuando acepta la agencia para liberar a un esclavo cuando había sido designado para comprarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17829}"
  fr: "Le terme « wakala », avec ses variantes vocaliques, signifie protection dans la langue kuwati, comme dans le nom divin « al-Wakil », qui signifie « le Gardien », et dans « tawakkul » (« nous avons confié nos affaires à Dieu »). Le tawakkul est la délégation d'une disposition à une autre. Le mandataire est appelé wakil car son mandant lui a confié la gestion de ses affaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} Les juristes le définissent de plusieurs manières. Les Hanafites: désigner une autre personne pour exercer une disposition licite et connue, par nécessité ou incapacité. Les Malikites: la délégation d'une personne ayant un droit, mais n'ayant ni autorité ni culte, à une autre personne pour ce qui n'est pas conditionné par son décès. Les Shafi'ites: la délégation par une personne à une autre, de ce qu'elle peut faire et qui admet la délégation, pour l'accomplir de son vivant. Les Hanbalites: la délégation d'une personne capable de disposer de biens, comme elle-même, dans ce que cette délégation admet en matière de droits divins et de droits humains. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720} Le Mawsu'a distingue la wakala des termes voisins: la délégation (niyaba), qui, pour certains juristes, est plus large que la wakala et, pour d'autres, son synonyme; l'autorité (wilaya), l'exécution d'une décision sur autrui, qu'il le veuille ou non, ce qui constitue une délégation légale ou obligatoire, tandis que la wakala est consentie; le legs (iya'), la désignation d'une autre personne pour disposer de ses biens après le décès, tandis que la wakala s'exerce du vivant; et la tutelle (qiwama), un pouvoir conféré par le juge à un adulte pour agir dans l'intérêt d'un mineur, ou l'autorité du mari sur son épouse. Les juristes s'accordent à dire que la wakala est licite. Ils se fondent sur le Coran: le récit des Gens de la Caverne envoyant l'un des leurs avec leur argent à la ville, et le verset des deux arbitres dans la sourate An-Nisa, interprété comme démontrant que chaque arbitre agit comme mandataire de l'un des époux. Ils citent également la Sunna: le récit d'Urwa ibn Abi al-Ja'd al-Bariqi, à qui le Prophète donna un dinar pour l'achat d'un mouton; le récit de Hakim ibn Hizam concernant l'achat d'un sacrifice; le récit de Jabir concernant l'intermédiaire à Khaybar; et le récit d'Abu Rafi', qui affirmait avoir servi d'intermédiaire lors du mariage du Prophète avec Maymuna. Les juristes s'accordent sur sa licéité depuis l'époque du Prophète jusqu'à nos jours. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} La nécessité de la wakala est évidente: une personne peut être incapable d'agir elle-même pour cause de maladie, d'âge ou de statut social, et son absence engendrerait des difficultés que le texte permet d'éviter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} Les piliers de la wakala: la majorité considère qu'il s'agit de la formule, des deux parties (mandant et mandataire) et de l'objet du contrat. Les hanafites, quant à eux, estiment que le pilier est l'offre et l'acceptation, car leur présence implique celle des deux autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} La formule est celle de l'offre et de l'acceptation, par lesquelles s'exprime le consentement mutuel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} L'offre. La majorité considère qu'il s'agit de l'acte émanant du mandant et manifestant son autorisation de désigner un mandataire; les hanafites, quant à eux, estiment qu'il s'agit de l'acte initial émanant de l'une des parties contractantes, manifestant ainsi sa volonté de conclure le contrat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Ce consentement peut être exprimé par tout signe, verbalement, par écrit, par message ou même par le signe d'une personne muette. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Les expressions explicites incluent « Je vous ai nommé », « Je vous ai confié », « Je vous ai désigné comme mon adjoint », « Je vous ai autorisé », « Je vous ai placé à ma place » et « Vous êtes mon mandataire ». Un ordre tel que « vendez-le » est valable pour les écoles hanafite, chaféite et hanbalite, ainsi que pour l'école malikite lorsque la coutume le prévoit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} Les expressions « Je vous nommerai », « Je vous nomme » et « Je compte sur vous » ne constituent pas un mandat valable pour l'école chaféite, car elles sont ambiguës, à moins qu'un terme précis ne soit ajouté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} Selon les écoles hanafite, malikite et chaféite, le mandat peut être conclu par message: le mandataire devient mandataire dès lors qu’il reçoit la nouvelle et l’accepte, que le messager soit digne de confiance ou non. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} L’offre peut également être faite par écrit, par le signe implicite d’un homme muet, par un acte manifestant son consentement (pour les hanbalites), et par ce que la coutume considère comme une offre, comme lorsqu’un mari dispose des biens de sa femme en son absence et sans qu’elle s’en aperçoive (pour les malikites). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} Pour les écoles hanafite, shafi'ite et hanbalite, le silence ne vaut pas offre: celui qui voit un étranger vendre sa propriété et ne dit rien n'est pas désigné comme mandataire par son silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} L'acceptation peut être exprimée verbalement, par exemple par « J'accepte » ou par des paroles manifestant l'acceptation. Les écoles hanafite et shafi'ite précisent que le mandataire ne doit pas refuser; s'il refuse après l'offre, aucun mandat n'est conclu, même s'il accepte ultérieurement, à moins que l'offre et l'acceptation ne soient renouvelées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Concernant l'acceptation par acte, trois avis s'affrontent. La majorité (Hanafi'ites, Malikites, l'avis shafi'ite le plus solide et les Hanbalites) considère qu'elle est complète dès lors qu'un acte la manifeste, comme l'exécution par le mandataire des instructions reçues; les Shafi'ites (d'une part), les Hanbalites (d'autre part) et Zufar (au sein des Hanafites) estiment qu'elle requiert des paroles; un troisième avis shafi'ite établit une distinction: si l'offre prend la forme d'un ordre tel que « vendre et acheter », l'acceptation par acte suffit; mais si elle prend la forme d'un contrat tel que « je vous ai mandaté », des paroles sont nécessaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} L'acceptation est également valable par écrit, adressée clairement, et par le signe implicite d'une personne muette; les Hanafites considèrent que le silence du mandataire vaut acceptation, laquelle est annulée par son refus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Si l'acceptation est différée après l'offre, la majorité (Hanafis, Hanbalites, école Shafi'ite et une opinion Malikite) estime qu'elle est valable, car l'autorisation demeure tant que le mandant ne la retire pas, et elle s'apparente à une permission d'agir. Les Shafi'ites limitent cette interprétation aux cas où le délai d'exécution n'est pas fixé; s'il est fixé et qu'il existe un risque de dépassement, l'acceptation doit être immédiate, de même que lorsque le juge propose le mandat à un homme après que celui-ci a été établi devant lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Selon l'école malikite secondaire et, parmi les chaféites, Abu Hamid al-Marwarudhi, l'acceptation doit être immédiate, car la wakala est un contrat conclu du vivant de l'assuré et, à l'instar d'une vente, elle requiert une acceptation immédiate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Al-Mazari a déclaré que la question se résume à l'intention et à la coutume: les termes en question appellent-ils une réponse immédiate, ou permettent-ils une réponse immédiate ou différée ? {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Les formes de la formule de la wakala, selon le moment où ses effets se manifestent, sont les suivantes: la forme immédiate, qui n'est ni conditionnée par une condition ni liée à un délai; la forme conditionnelle; la forme liée au futur; et la forme à durée déterminée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} La formule immédiate, qui n'est ni conditionnée par une condition ni liée à un délai, comme dans la formule principale « Je t'ai chargé de vendre cette maison », est valide de l'avis unanime des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} La formule conditionnée par une condition. Les juristes divergent sur deux points de vue. Le premier, soutenu par les hanafites, l'avis hanbalite le plus solide et, à l'inverse, par les chaféites, est qu'elle est valide, comme dans « si le pèlerin arrive, vends cette nourriture ». Ils citent le hadith d'Ibn 'Umar selon lequel le Prophète a désigné Zayd ibn Haritha pour commander à Mu'ta, puis Ja'far, puis Ibn Rawaha si les deux premiers étaient tués; Ils soutiennent que le mandat est un contrat dont l'effet sur le mandataire, à savoir l'autorisation d'agir, est reconnu; il s'apparente donc à un legs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} La seconde opinion, défendue par l'école shafi'ite, plus solide, et une école hanbalite, est qu'il est invalide; al-Mawardi affirme que subordonner un mandat à des conditions est nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} Les shafi'ites autorisent le mandant à conclure le mandat immédiatement et à subordonner l'acte lui-même à une condition, comme « vendre dans un mois », car il s'agit d'un report et non d'une condition. Al-Ghazali rapporte que les Irakiens considéraient que la formule « Je vous ai mandaté maintenant, mais n'agissez pas avant qu'un mois ne se soit écoulé ou qu'une certaine personne ne se présente » était valable, car il s'agit d'un délai auquel le mandataire est tenu de se conformer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} La formule périodique: le mandant déclare: « Je vous ai mandaté pour vendre ce bien, et chaque fois que je vous révoque, vous redevenez mon mandataire », de sorte que le mandat se renouvelle à chaque révocation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} Les écoles hanafite et hanbalite, plus rigoureuse, la considèrent comme valide, car le mandat admet des conditions; pour les hanafites, le mandant peut révoquer son mandataire à tout moment, tandis que pour les hanbalites, la révocation s’effectue par ses paroles: « Je vous ai révoqué, et chaque fois que je vous nomme, je vous révoque ». Ibn Taymiyya considère cette clause comme invalide, car elle transformerait un contrat permissif en un contrat contraignant; le but de la clause conditionnelle est d'empêcher la nomination, et non de dissoudre un contrat avant même sa conclusion. Les Shafi'ites ont deux avis simultanés sur sa validité; le plus solide est qu'elle est valide, car l'autorisation existe. Si le mandant révoque le mandataire, que ce dernier en ait été informé ou non, deux avis divergent quant à la réintégration du mandat après révocation; le plus solide est qu'il ne l'est pas. Si la clause stipule « chaque fois que je vous révoque », le mandat est réintégré une seule fois; si elle stipule « à chaque fois que je vous révoque », il est réintégré systématiquement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} La formule attachée à un moment futur, comme dans « Je t'ai chargé de vendre mes bêtes pendant le Ramadan » ou « Je t'ai chargé de vendre cette maison demain », est valide selon les écoles hanafite et hanbalite. En effet, le mandat admet d'être lié au futur; les hanafites précisent que le mandataire n'agit qu'à partir de demain et pas avant. Les chaféites, quant à eux, la considèrent également valide, car le mandat est conclu dès maintenant et seul l'acte est lié au futur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} La formule subordonnée à une échéance, comme dans « lorsque le nouveau mois arrivera, je vous ai chargé de vendre ma maison », est nulle selon l'avis shafi'ite, plus solide, car subordonner un mandat à des conditions est invalide; les hanafites, les hanbalites et l'avis shafi'ite opposé la considèrent comme valide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} Les hanafites distinguent l'attachement (idafa) de la condition (ta'liq). Une formule attachée est une cause qui conclut le contrat immédiatement, tandis que son effet est différé; une formule conditionnelle ne peut être la cause de l'effet immédiat, de sorte que le mandat n'est conclu que lorsque la condition est remplie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} La formule à durée limitée, telle que « tu es mon mandataire pour un mois », est valide selon les juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} Leurs avis divergent quant à la validité de ce mandat après son expiration. Les chaféites estiment qu'il ne survit pas. Les hanafites rapportent deux avis concernant une personne à qui l'on a demandé de « vendre ma maison aujourd'hui » et qui l'a fait le lendemain: l'avis le plus solide est que le mandat ne survit pas au-delà de ce jour, tandis que certains hanafites estiment qu'il survit, car la mention d'une date précise est motivée par la hâte, et non par la limitation du mandat à ce seul jour. Al-Bazzaziyya, cité par l'auteur de Minhat al-Khaliq, soutient, selon l'avis le plus solide, qu'un mandat de dix jours ne prend pas fin à l'expiration de ce délai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} Conditions attachées au mandat. Si une condition est invalide, les Hanafites, Ahmad (dans ses deux hadiths apparents) et Ibn Abi Layla estiment que le mandat n'est pas invalidé par une condition invalide. Les Shafi'ites, quant à eux, considèrent qu'une condition invalide l'invalide, comme lorsque le mandant dit « empêcher l'acheteur de prendre possession des marchandises », car il est interdit d'empêcher un titulaire de droit de prendre possession; la vente elle-même est valable par permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Al-Zarkashi affirme que les contrats permissifs (partenariat, mandat et mudaraba) ne sont pas empêchés de produire leurs effets par permission lorsqu'ils sont invalides, mais perdent leurs caractéristiques propres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} L'effet de la nullité est que les honoraires spécifiés disparaissent et que les honoraires habituels sont dus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Certains hanbalites considèrent que le mandat est nul, comme un dépôt, car la confiance est rompue; et Abu Muhammad, parmi les shafi'ites, affirme que l'autorisation n'est pas dissociable du mandat, donc sa nullité entraîne la nullité de l'autorisation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} La nature du contrat de mandat, qu'il soit contraignant ou permissif. La première opinion, partagée par les écoles hanafite, shafi'ite, hanbalite et certains malikites, est que le mandat est permissif des deux côtés, puisqu'il s'agit d'une donation et que les donations ne sont pas contraignantes: le mandant peut juger préférable de se désister ou de désigner un autre mandataire, et le mandataire peut ne pas être libre de ses actes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} Les hanafites et les malikites, sauf lorsqu'un droit d'un tiers est attaché au mandat, celui-ci devient alors contraignant, comme dans le cas d'un mandataire désigné à la demande du demandeur dans une action en justice, ou d'un mandataire chargé de vendre un gage en présence du créancier gagiste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} Les hanafites affirment que, de par sa nature non contraignante, trois règles découlent: le mandat ne comporte pas d'option ni de stipulation; il ne constitue pas une créance du mandant; et le mandataire peut démissionner à tout moment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} La deuxième opinion: si le mandat est rémunéré sous forme de location, il lie les deux parties et doit respecter les conditions de la location; c’est l’avis des Shafi’ites et, selon une certaine opinion, des Malikites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} La troisième opinion, celle de certains Malikites plus tardifs, est qu’il lie la partie mandataire même sans rémunération, par analogie avec un don qui lie une fois offert, même s’il n’est pas reçu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} Si le mandat est effectué à titre de récompense (ju’ala), les Malikites ont trois avis: il lie les deux parties; Le mandat est permissif des deux côtés, selon l'avis des Shafi'ites, et contraignant pour celui qui offre la récompense une fois que l'autre a commencé à travailler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} Le second pilier concerne les deux parties: le mandant et le mandataire. Le mandant est celui qui désigne une autre personne pour une disposition licite et connue, et qui doit avoir le pouvoir de prendre cette disposition et être lié par ses règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} Les juristes s'accordent à dire qu'un mandat ne peut être établi par une personne atteinte de troubles mentaux, une personne souffrant d'imbécillité, une personne sous anesthésie, une personne endormie ou un mineur incapable de discernement, pour quelque disposition que ce soit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} Un mineur capable de discernement peut être désigné, par accord, pour des actes qui lui sont exclusivement bénéfiques. Pour les actes se situant entre bénéfice et perte, les écoles hanafite, malikite et hanbalite l'autorisent avec la permission du tuteur, tandis que l'école chaféite l'interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} Un dépensier placé sous tutelle ne peut être désigné pour les actes qu'il ne peut accomplir seul, mais peut l'être pour ceux qu'il peut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} La majorité des juristes n'autorisent pas la désignation d'une femme dans un mariage, puisqu'elle ne se marie pas elle-même et ne peut donc être mandataire; les hanafites l'autorisent, et les malikites dans certains cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} Concernant la désignation d'un apostat, trois avis divergent. La première opinion, partagée par la majorité (l'avis shafi'ite le plus solide, les hanbalites et Abou Hanifa), stipule que le mandat est suspendu au retour de l'époux à l'islam: s'il revient, le mandat prend effet; s'il meurt, est tué ou rejoint l'ennemi en tant qu'apostat, il est nul. La seconde opinion, défendue par les deux compagnons d'Abou Hanifa et par une opinion shafi'ite, affirme que le mandat est valide et contraignant; les hanafites ajoutent qu'une femme apostate peut être désignée d'un commun accord, puisque ses actes sont valides. La troisième opinion, une opinion shafi'ite considérée comme la plus solide par Zakariyya al-Ansari et al-Shibramallisi, conclut à la nullité du mandat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Concernant la désignation par un musulman d'un dhimmi pour vendre du vin ou du porc: les écoles chaféite, malikite, hanbalite et les deux compagnons la considèrent invalide, car une condition du mandat est que le mandant soit lui-même propriétaire de l'acte qu'il délègue, et un musulman ne peut vendre de vin ou de porc; on ne peut donner ce qui nous manque. Abou Hanifa la considère valide, car il suffit que le mandant ait la capacité d'agir qui l'autorise à désigner un autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Concernant la désignation par un pèlerin (muhrim) d'un non-pèlerin pour contracter un mariage: la majorité ne l'autorise pas, car le pèlerin ne conclut pas le contrat pendant son pèlerinage; Les Hanafites l'autorisent dans tous les cas, puisqu'il pourrait conclure le contrat lui-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Les Hanbalites affirment que le mandat est invalide si le mandataire ne connaît pas son mandant, par exemple lorsqu'on lui dit « Zayd vous a désigné » sans nom ni description permettant de l'identifier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Le mandataire doit avoir la même capacité mentale que le mandant; par conséquent, une personne atteinte de troubles mentaux, un imbécile ou un mineur incapable de discernement ne peut être mandataire, de plein droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} Concernant la puberté comme condition: les Hanafites et les Hanbalites admettent qu'un mineur capable de discernement, qui comprend le contrat et souhaite le conclure, peut être mandataire, et les droits contractuels reviennent au mandant, et non au mandataire. Leurs preuves incluent le récit selon lequel le Prophète a épousé Umm Salama par l'intermédiaire d'Amr ibn Umm Salama, alors mineur. Les chaféites l'interdisent, car un mineur n'est pas responsable et ne peut disposer de ses propres droits; il ne peut donc disposer de ceux d'autrui par mandat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} Le mandataire doit être nommé: si quelqu'un dit « J'ai désigné quelqu'un pour vendre ces marchandises », le mandat est nul, car le mandataire est inconnu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} Ibn Najim affirme que les paroles d'un créancier à son débiteur, « Quiconque se présente à toi avec un certain signe, te prend le doigt ou te dit ceci ou cela, paie-lui ce que je te dois », constituent un mandat inconscient qui ne libère pas le débiteur de sa dette, même s'il paie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17739} Connaissance du mandat. Pour les Hanafites, la connaissance du mandat est une condition, soit par le mandataire, soit par la partie qui traite avec lui. Si le mandataire vend avant d'en avoir connaissance et que l'acheteur en ait connaissance, la vente n'est valable que si le mandant ou le mandataire la ratifie après en avoir eu connaissance. Si une personne digne de confiance informe le mandataire et que celui-ci accepte, il est mandataire; si une personne non digne de confiance l'informe et qu'il accepte, il est mandataire; s'il n'accepte pas, Abou Hanifa considère qu'il n'est pas mandataire, tandis qu'Abou Yusuf et Muhammad considèrent qu'il l'est. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Les Hanbalites n'exigent pas la connaissance, car la question des contrats repose sur les faits; l'avis plus solide des Shafi'ites est du même avis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} La justice n'est généralement pas requise chez le mandataire, sauf dans certains contrats comme le mariage; de même, le sexe masculin n'est pas requis, sauf dans certains contrats comme le mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} L'objet du mandat est la disposition que le mandant autorise le mandataire à exercer, que ce soit en propriété ou en tutelle. Les Shafi'ites ont établi trois conditions: le bien doit être connu sous certains aspects; il doit permettre la délégation; et le mandant doit en être propriétaire au moment du mandat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Le mandat est spécial lorsqu'il porte sur une disposition nommée et que le mandataire ne peut agir que dans ce cadre, par convention; ou général. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} Concernant le mandat général, les Hanafites et les Malikites l'admettent avec des précisions. Les Hanafites affirment que la formule « tu es mon mandataire pour toute affaire, petite ou grande » confère uniquement le pouvoir de conserver; la formule « tu es mon mandataire pour toute affaire que ton ordre permet » rend le mandataire compétent pour toutes les dispositions financières, telles que la vente, l'achat, la donation et l'aumône; ils divergent sur le divorce, l'émancipation et le waqf, et l'avis majoritaire est que le mandataire n'a pas ces pouvoirs, avis également partagé par l'auteur d'al-Bazzaziyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} Les Malikites, quant à eux, estiment qu'un mandat général ne se conclut pas par la simple déclaration « je t'ai désigné ». La délégation doit être formulée en termes tels que « mandat » ou « pour toutes mes affaires ». Seuls les biens qui augmentent le patrimoine sont autorisés; les donations, l'affranchissement et les aumônes en vue de la récompense de la vie future ne le sont pas, sauf autorisation expresse du mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} Les écoles chaféite et hanbalite considèrent le mandat général comme invalide en raison du risque qu'il comporte. Ainsi, la formule « Je vous ai désigné pour toutes mes affaires, petites et grandes » ou « Je vous ai tout délégué » est invalide, tandis que la formule « Je vous ai désigné pour vendre mes biens et recouvrer mes créances » est valable, même si la nature des biens et des créances est inconnue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} La règle générale concernant l'objet d'un mandat est que, quel que soit le contrat qu'une personne puisse conclure elle-même, elle peut désigner un mandataire pour le conclure, car il peut arriver qu'une personne soit dans l'incapacité d'agir elle-même et doive alors désigner un autre mandataire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} Les juristes s'accordent à dire que le mandat est valable en matière de vente et d'achat, car il répond à un besoin. Le Prophète lui-même a mandaté 'Urwa al-Bariqi pour acheter un mouton et a donné un dinar à Hakim ibn Hizam pour l'achat d'un animal sacrificiel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} Ils s'accordent également sur la validité du mandat dans les cessions de créances (hawala), les gages, les cautions, les partenariats, les dépôts, les mudaraba, les contrats à rémunération (ju'ala), les partenariats d'irrigation (musaqa), les locations, les prêts, les legs, les rescisions, les libérations, les échanges (musarafa), les annulations (iqala) et les préemptions, car tous ces actes s'apparentent à une vente et nécessitent un mandataire; il en va de même pour les cautions, les règlements et les donations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} Les juristes s'accordent sur la validité du mandat dans un contrat de mariage, citant la désignation par le Prophète de 'Amr ibn Umayya et d'Abu Rafi' pour accepter une union en son nom; cette désignation se justifie par le fait qu'un homme peut souhaiter épouser une personne résidant loin et ne peut s'y rendre. et le mariage du Prophète avec Umm Habiba alors qu'elle se trouvait en Abyssinie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Ils s'accordent à dire que le mandat est valable pour les actes financiers d'adoration, tels que la zakat, les aumônes, les vœux et les expiations, puisque le Prophète a envoyé ses mandataires pour collecter et distribuer les aumônes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Ils s'accordent également à dire que le mandat est valable en cas de divorce, de révocation et de khul', car le besoin est similaire à celui du mandat pour la vente et le mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Actes que le mandat ne peut couvrir, par accord. Le témoignage: le mandat n’est pas valable en la matière, car il repose sur le témoin lui-même, qui rapporte ce qu’il a vu ou entendu, et sur la dévotion et la certitude; si un témoin désigne une autre personne pour témoigner, cette dernière agit comme témoin du témoignage du premier et non comme mandataire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Les serments et les vœux, puisqu’ils dépendent de celui qui jure ou fait le vœu lui-même; il en va de même pour les serments de malédiction mutuelle, le vœu d’abstinence conjugale et le serment de pénitence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Les péchés, tels que le meurtre, le vol, l’usurpation et la calomnie, sont interdits et ne peuvent être commis ni par le mandant ni par le mandataire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Et le culte purement corporel, tel que la prière, le jeûne et la purification des impuretés mineures, puisqu'ils dépendent du corps de celui qui est tenu de l'accomplir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Points sur lesquels les juristes divergent. Le pèlerinage: le mandat n'est pas autorisé pour une personne capable de l'accomplir elle-même; le cas de la personne incapable est traité ailleurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Le petit pèlerinage (umra) peut généralement être accompli pour le compte d'autrui par mandat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Mariage par une femme: la plupart des juristes interdisent à une femme de désigner ou d'être désignée en mariage, puisqu'elle ne peut contracter elle-même un mariage; Les Hanafites l'autorisent pour une femme adulte, libre et saine d'esprit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Zihar: la majorité interdit toute forme de représentation, l'avis shafi'ite le prohibe également, tandis qu'un autre avis shafi'ite l'autorise. Ibn 'Abd al-Salam, de l'école malikite, considérait le zihar comme un divorce, car tous deux ne sont que des paroles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Acquisition de droits pour des actes licites, tels que la remise en culture de terres incultes, le puisage d'eau, la chasse, la cueillette d'herbe ou le creusement d'une mine: les Malikites, l'avis shafi'ite le plus solide et les Hanbalites l'autorisent, car la propriété découle d'une cause qui n'engage pas la personne. Les hanafites, certains chaféites et certains hanbalites l'interdisent, car la cause de la propriété, une fois acquise, est née pour l'agent et une intention ne peut l'annuler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Reconnaissance des droits: les hanafites, les malikites, les hanbalites et une opinion chaféite moins rigoureuse l'autorisent, car elle établit un droit sur l'obligation par des mots, comme le fait une vente; l'opinion chaféite plus rigoureuse et al-Tahawi l'interdisent, car il s'agit d'un rapport concernant un droit, comme un témoignage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} Litiges: les écoles malikite, chaféite, hanbalite et les deux compagnons d’Abu Hanifa autorisent le mandat dans les litiges relatifs aux dettes, aux biens spécifiques et à tous les droits, que le mandant soit présent ou absent, malade ou en bonne santé, et que la partie adverse y consente ou non; les malikites excluent toutefois un mandataire hostile à la partie adverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} Ils citent le consensus des Compagnons, selon lequel Ali a désigné 'Aqil avant Abu Bakr et a déclaré: « Ce qui est décidé en sa faveur est à moi, et ce qui est décidé contre lui est à moi », et la nécessité de ce mandat. Abu Hanifa soutient que le recours par mandat n'est valable qu'avec le consentement de la partie adverse, sauf si le mandant est malade ou absent pour une durée de voyage de trois jours ou plus, car la présence du mandant au tribunal est un droit de la partie adverse. Il justifie sa position en expliquant qu'une allégation est un rapport qui peut être vrai ou faux, et que sa réponse n'est donc requise qu'en cas de nécessité; cette nécessité se présente lorsque le mandant est malade ou en voyage. Al-Jassas rapporte que l'avis apparent ne fait aucune distinction entre un homme et une femme, ni entre une vierge et une femme mariée; les hanafites postérieurs approuvent le recours par mandat d'une femme recluse qui ne se montre pas en public; Ibn Abi Layla le jugeait valable uniquement pour une vierge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} Preuve et application de la vengeance (qisas). Les écoles malikite, chaféite, hanbalite, Abou Hanifa et Muhammad al-Shaybani admettent la possibilité d'un mandataire pour prouver la qisas, que le mandant soit présent ou absent, car la qisas est un droit humain; Abou Yusuf ne l'admet pas, et la preuve n'est acceptée que du mandant lui-même, en raison du doute qu'il convient de prévenir en matière de vengeance et de hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} Concernant l'application de la qisas: les écoles malikite, chaféite et l'école hanbalite l'autorisent, que le mandant soit présent ou absent. Les hanafites, certains chaféites et certains hanbalites l'autorisent uniquement en présence du principal, car il peut pardonner en son absence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} Preuve et exécution des hudud. Les chaféites et les hanbalites font une distinction entre les deux. L'école hanbalite autorise le recours à un tiers pour prouver l'adultère, en se basant sur l'histoire d'Unays; Abu al-Khattab, parmi eux, considère cette pratique comme invalide. Les chaféites n'autorisent aucun recours à un tiers pour prouver les hudud de Dieu, sauf le hadd de la calomnie, car le droit appartient à Dieu et il est ordonné de s'en abstenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} Concernant l'exécution, les écoles malikite, chaféite et hanbalite autorisent la représentation, citant l'ordre du Prophète de lapider Ma'iz et la désignation par 'Uthman d'Ali pour infliger la flagellation à al-Walid ibn 'Uqba pour ivresse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} Les hanafites distinguent deux types de droits divins: la preuve, pour laquelle la représentation est interdite pour les hudud ne nécessitant pas de procès, comme l'adultère et l'ivresse, mais autorisée pour ceux qui en requièrent une, comme le vol et la calomnie (selon Abu Hanifa et Muhammad, mais interdit par Abu Yusuf); et l'exécution pour calomnie et vol, valable en présence de la victime, tandis que les cheikhs hanafites divergent en son absence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Les règles du mandat. Elles obligent le mandataire à agir dans les limites autorisées par le mandant ou imposées par la loi ou la coutume, à informer le mandant des renseignements nécessaires, à rendre compte de ses actes et à restituer au mandant ce qui est en sa possession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Un mandat spécial peut être établi sans restriction ou avec restrictions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Parmi ses formes figure le mandat de vente. Selon Abu Hanifa, le mandataire dans une vente sans restriction n'est soumis à aucune restriction, sauf s'il est soupçonné. Il peut vendre à bas prix ou à prix élevé, au comptant ou à crédit, et pour des marchandises, car le terme « mandat » conserve son sens général; une vente à un prix nettement inférieur à la valeur réelle afin d'acquérir un bien plus rentable est également courante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Le mandat sans restriction dans la vente. Les juristes divergent quant à savoir s'il est restreint, selon deux points de vue. Le premier, celui d'Abu Hanifa, est qu'un agent dans une vente sans restriction n'est soumis à aucune restriction, sauf s'il est soupçonné; il peut vendre à bas prix ou à prix élevé, au comptant ou à crédit, et pour des marchandises, car le terme « mandat » conserve son sens général; une vente à un prix nettement inférieur à la valeur réelle afin d'acquérir un bien plus rentable est courante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} La seconde, la plus répandue (Malikites, Chafi'ites et Hanbalites), stipule que l'agent non restreint est soumis à plusieurs limitations. Il ne peut vendre qu'en monnaie locale, car une monnaie non restreinte désigne la monnaie locale. Il ne peut vendre qu'au prix du marché pour les biens qui ne sont pas vendus à un prix sensiblement inférieur à leur valeur. S'il vend en dessous de ce prix, les Malikites laissent le choix au mandant, même pour une faible perte, qu'ils fixent à un demi-dixième ou moins. Les Hanbalites, quant à eux, considèrent la vente comme valide et rendent l'agent responsable du manque à gagner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} Il ne peut vendre en nature au lieu d'argent, selon les Malikites, les Hanbalites et les deux Compagnons. Il ne peut vendre à crédit, selon les Malikites, les Shafi'ites et les Hanbalites, bien qu'une déduction hanbalite l'autorise. Enfin, il ne peut vendre à profit, selon les Hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} L'agent qui vend à lui-même. La majorité des écoles (hanafites, chaféites, l'école hanbalite et l'école malikite établie) l'interdit, car la coutume veut qu'une personne vende à une autre, et il existe un soupçon de partialité. Les malikites et les hanbalites l'autorisent si le mandant y consent, et les malikites excluent les cas où les enchères ont atteint un niveau élevé ou lorsque la vente a lieu en présence du mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} Un hadith d'Ahmad autorise l'agent à acheter s'il surenchérit lors d'une vente aux enchères publiques et que celle-ci est dirigée par une autre personne; al-Qadi a déclaré que la seconde condition peut être obligatoire et recommandée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} Selon l'école malikite, la vente est autorisée si le vendeur n'y trouve pas son compte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} L'agent peut vendre à une personne dont le témoignage ne peut être retenu. Pour les hanafites, une vente à une telle personne à un prix supérieur à la valeur est valable; une vente à un prix inférieur à la valeur, par sous-évaluation flagrante, est invalide par convention; à la valeur, il existe deux versions d'Abu Hanifa. Les deux compagnons autorisent une vente à leur profit à la valeur, sauf à son propre esclave ou à l'esclave qui a racheté sa liberté par versements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} Les malikites, selon l'avis établi, ne peuvent vendre à leur pupille, qu'il soit mineur, dépensier ou esclave sans titre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} Les chaféites interdisent la vente à son jeune fils, même si elle est autorisée, tandis que l'avis le plus solide autorise la vente à ses ascendants et à ses descendants non pupilles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} Les hanbalites, dans leur école de pensée, interdisent la vente à son fils, à son père ou à son mukatab (un esclave ayant conclu un contrat de rachat de sa liberté par versements); l'autre avis l'autorise; la divergence apparaît lorsque le mandant ne l'a pas permise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} Mandat restreint en matière de vente. Le mandataire doit respecter les restrictions fixées par le mandant, conformément à l'accord conclu. Les hanafites affirment que s'il enfreint une restriction, la vente n'engage pas le mandant, sauf si celui-ci la ratifie, à moins que la différence ne soit avantageuse, ce qui équivaut à un accord. Si un agent reçoit l'ordre de « vendre mon vêtement pour mille dirhams » et le vend à un prix inférieur ou à un autre prix, la vente n'est pas contraignante, même si la valeur du bien est supérieure; s'il le vend à un prix supérieur, la vente est contraignante. S'il reçoit l'ordre de vendre à crédit et le vend au comptant, la vente est contraignante; s'il reçoit l'ordre de vendre au comptant et le vend à crédit, la vente est suspendue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} Les Malikites estiment que le fait de dépasser le prix lors d'une vente ou de payer moins cher lors d'un achat ne confère pas d'option au mandant, car cela est souhaité; seule une différence ayant un but légitime en confère une. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} Les Shafi'ites et les Hanbalites affirment que l'agent ne peut agir que dans les limites de l'autorisation du mandant, qu'elle soit verbale ou coutumière. Si l'un des deux actes porte préjudice au mandant, celui-ci ne peut l'accomplir, conformément au principe selon lequel il ne doit y avoir ni préjudice ni préjudice réciproque; si l'un des actes est bénéfique au mandant, il doit l'accomplir, car tel est le conseil sincère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} Une autorisation limitée dans le temps ne s'étend ni avant ni après cette période; une autorisation limitée à un lieu présentant un intérêt, tel qu'un marché réputé pour sa monnaie ou ses prix, est confinée à ce lieu, et si le lieu présente un intérêt équivalent, l'autorisation s'y étend. Lorsque l'acheteur est nommément désigné, le mandataire ne peut vendre à quiconque d'autre, à moins qu'il ne sache que le mandant n'a aucun intérêt pour cet acheteur en particulier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758} Violation des conditions de prix. Concernant la description du prix: si le mandant dit « vente à crédit » et que le mandataire vend au comptant, la majorité considère que la vente lie le mandant, puisqu’il obtient ce qu’il voulait et que le mandataire lui a apporté un avantage supplémentaire; une opinion hanbalite annule la vente lorsque le mandant a un intérêt certain au report, et les shafi’ites l’interdisent lorsque le mandant a un intérêt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} Si un vendeur reçoit l'ordre de vendre à crédit à un prix fixe et qu'il vend au comptant à un prix inférieur, les écoles hanafite, chaféite et hanbalite interdisent la vente, tandis que l'école malikite la suspend jusqu'à approbation du donneur d'ordre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} Si un vendeur reçoit l'ordre de vendre au comptant et qu'il vend à crédit, les écoles hanafite, chaféite et hanbalite interdisent la vente, car le paiement immédiat pourrait constituer les intérêts du donneur d'ordre; l'école malikite la suspend jusqu'à approbation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} Si le mandant ordonne de vendre immédiatement pour mille dinars et que l'agent vend à crédit pour mille dinars, la vente n'est pas contraignante et reste suspendue jusqu'à l'approbation du mandant; c'est l'avis d'al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17760} Violation de la règle monétaire. Si l'on ordonne de vendre en dinars et que l'on vend en dirhams ou contre des marchandises, les hanafites, les chaféites et al-Qadi, parmi les hanbalites, n'autorisent pas la vente, même si la valeur est supérieure, car une autorisation dans un cas n'en vaut pas une autre. L'avis hanbalite le plus solide est que si l'on ordonne de vendre en dirhams et que l'on vend en dinars, la vente est valable, car c'est la coutume: celui qui accepte un dirham accepte son équivalent en dinars. Al-Kasani considère la vente comme suspendue, le mandant ayant le choix entre l'approbation et l'annulation. Chez les Malikites, lorsque les deux monnaies sont la monnaie locale et de valeur égale, deux avis divergent quant au choix du mandant: approuver ou non; sinon, il choisit selon un seul avis. Si le mandant reçoit l'ordre de vendre contre de l'argent et vend en réalité contre des tissus ou d'autres biens, les Hanbalites et les Malikites invalident la vente, car les biens ne constituent pas un prix. Non-respect du montant. Si le vendeur vend à un prix supérieur à celui convenu, dans la même devise, la majorité considère la vente valable, car la différence est avantageuse pour le vendeur. Les chaféites ajoutent qu'elle est refusée si le mandant a expressément interdit le dépassement, et une opinion chaféite l'interdit totalement, car le mandant peut avoir intérêt à respecter son serment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} Si le vendeur vend à un prix inférieur à celui convenu, les malikites suspendent la vente avec l'accord du mandant: celui-ci peut reprendre possession des biens s'ils sont encore là, ou leur valeur s'ils sont perdus. Les chaféites et une tradition hanbalite annulent la vente, car le mandant n'a pas consenti à céder son bien à ces conditions. L'opinion hanbalite établie valide la vente et rend le vendeur responsable du manque à gagner; il existe deux avis hanbalites sur la manière de calculer ce manque à gagner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762} Violation du lieu. Si le mandant désigne un lieu et que l'agent vend ailleurs, les écoles chaféite, hanbalite et Ibn Shas parmi les malikites exigent le respect du lieu initial lorsque celui-ci présente un intérêt particulier, comme un marché réputé pour ses devises de qualité ou ses prix élevés. Certains hanbalites et une opinion chaféite autorisent la vente ailleurs lorsque les deux lieux présentent un intérêt équivalent. Les hanafites exigent le respect du lieu initial, et l'agent est responsable s'il enfreint cette règle; le mandant n'est pas lié par la vente. Les malikites suspendent la vente jusqu'à approbation, et l'opinion chaféite, plus rigoureuse, l'interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762} Violation du délai. Si une date est fixée et que le mandataire vend à un autre moment, les écoles hanafite, chaféite et hanbalite interdisent la vente, qui n'engage pas le mandant, car celui-ci peut souhaiter la vente au moment opportun et ni avant ni après. L'école malikite laisse au mandant le choix d'approuver ou de refuser la vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763} Violation du contrat d'achat désigné. Si le mandant ordonne de vendre uniquement à lui et que le mandataire vend à un autre, la majorité des écoles (hanafite, chaféite et hanbalite) l'interdit, quel que soit le prix, car le mandant peut avoir un intérêt particulier pour cet acheteur. Les écoles chaféite et hanbalite l'autorisent si le mandataire sait, par un signe clair ou par des paroles, que le mandant n'a aucun intérêt pour cet acheteur en particulier. L'école malikite laisse le choix au mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763} Fractionnement de la vente. Si le mandataire vend une partie des biens et laisse le reste, ou en vend une partie puis le reste ultérieurement, la règle applicable dépend du préjudice que ce fractionnement cause au mandant. Si ce préjudice ne lui cause aucun préjudice, comme dans le cas de deux maisons ou de deux animaux, la vente est valable selon les écoles hanafite, chaféite et hanbalite. Les hanbalites ajoutent qu'elle est valable sauf si le mandant s'y est opposé. Les malikites énoncent une règle générale selon laquelle, lorsque le mandataire s'écarte des conditions de son mandant ou de la coutume, le mandant peut choisir d'approuver ou de refuser la vente si les biens restent, et d'approuver la vente et d'engager la responsabilité du mandataire en cas de perte des biens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} Si le fractionnement lui cause un préjudice, les juristes proposent trois avis: les chaféites et les hanbalites annulent la vente; les malikites, Abou Yusuf et Muhammad la suspendent, et elle est accomplie si le mandataire vend le reste; Abou Hanifa laisse la vente s’appliquer au mandant, puisque le mandataire se substitue à lui et que le mandant possède une partie des biens comme il en possède la totalité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} Violation de la nature de l’objet. Si le mandataire vend un bien différent de celui désigné, l’avis le plus solide des chaféites et des hanbalites annule la vente, car il a enfreint les termes de l’autorisation. Les Malikites, et une narration hanbalite, laissent le choix au mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17764} Mandat d'achat. Il peut être donné sans restriction, comme dans « achetez pour moi ce que vous voulez ». Les Hanafites, les Malikites et une narration d'Ahmad l'autorisent, puisque le mandant a délégué son jugement; les Hanbalites, dans leur avis majoritaire, et les Shafi'ites l'interdisent, car le mandataire pourrait acheter ce qu'il ne peut pas payer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} Le mandataire achète pour son mandant à partir de ses propres biens ou auprès de personnes dont le témoignage ne peut être accepté en sa faveur: les Hanafites interdisent d'acheter à lui-même, même avec permission, car les droits de vente reviennent au mandataire et cela ferait d'une seule personne à la fois payeur et acheteur; ils interdisent d'acheter à son fils mineur, même avec permission. Abou Hanifa interdit d'acheter auprès de son père, de son grand-père, de son fils aîné ou de son épouse; Abou Yusuf et Muhammad l'autorisent à la valeur du bien ou à un prix inférieur, ou avec un léger excédent. Si l'agent est général, les Hanafites admettent que l'achat est permis, car l'interdiction repose sur la suspicion, que des termes généraux lèvent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766} Les Malikites, dans leur avis définitif, et les Hanbalites, dans leur avis d'école, interdisent d'acheter auprès de son propre propriétaire, et l'autorisent si le mandant y consent; les Malikites autorisent l'achat auprès de ses proches s'il n'y a pas de suspicion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} Les chaféites interdisent systématiquement l'achat de biens appartenant à leur propriétaire ou à leur fils mineur, et autorisent, selon une opinion plus saine, l'achat auprès de leurs ascendants et descendants adultes et indépendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} Mandat restreint lors d'un achat. Il est valable, de l'avis des hanafites (sur l'istihsan), des malikites et des hanbalites, même si la nature du bien n'est pas précisée: « achète-moi un vêtement » est valable, par analogie avec une association à but lucratif. Les hanafites citent l'exemple du Prophète donnant un dinar à Hakim ibn Hizam pour l'achat d'un sacrifice, ce qui montre qu'une légère incertitude n'empêche pas la conclusion d'un contrat de mandat, celui-ci reposant sur la souplesse et non sur la stricte négociation de la vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17767} Achat à crédit et ses violations. Si le mandant a ordonné un achat à terme et que le mandataire a payé comptant, la majorité des juristes (hanafites, malikites, une opinion chaféite et l'école hanbalite) autorisent l'achat et le rendent opposable au mandant si le mandataire n'a pas augmenté le prix, la violation étant alors purement formelle et le sens étant respecté. Les chaféites, dans leur opinion établie, ne l'autorisent pas, car le mandant entendait être libre de toute dette; une opinion hanbalite l'interdit lorsque le mandant en subit un préjudice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} Si l'agent a acheté à crédit alors qu'il était censé payer comptant, les Hanafites engagent seul l'agent, les Malikites laissent le choix au mandant, les Chafi'ites annulent l'achat s'il a été effectué avec les fonds propres du mandant, et les Hanbalites le suspendent jusqu'à approbation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} En cas de non-respect du prix convenu lors de l'achat, les Chafi'ites et une école hanbalite annulent la transaction. L'école hanbalite autorise l'échange de dirhams contre des dinars et inversement, car celui qui accepte un dirham accepte un dinar en échange, mais non des biens en échange des deux pièces. Les Hanafites estiment que si un mandataire a reçu l'ordre d'acheter en dinars et achète avec d'autres biens, l'achat n'engage que le mandataire. Selon l'avis rapporté d'al-Karkhi, l'achat n'engage pas non plus le mandant si le paiement est effectué en dirhams au lieu de dinars. Les Malikites suspendent l'engagement jusqu'à approbation, et deux avis bien connus existent quant à savoir si le paiement en dirhams au lieu de dinars engage le mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770} En cas de non-respect du prix convenu, si ce non-respect est à l'avantage du mandant, par exemple en achetant un animal à un prix inférieur au prix convenu, l'achat engage le mandant, car le non-respect est purement formel. Les Shafi'ites et les Hanbalites font exception au cas où le mandant a interdit de payer moins. Si le manquement est préjudiciable au mandant, les Hanafites n'engagent que le mandataire; les Malikites engagent le mandant pour un faible excédent, par exemple un vingtième, et suspendent tout excédent important jusqu'à son approbation, engageant le mandataire s'il le prend en charge; les Chafi'ites et une école hanbalite l'annulent; l'école hanbalite le valide et rend le mandataire responsable de l'excédent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771} Manquement relatif à l'objet de l'achat. Si le mandataire achète autre chose que ce qui lui a été indiqué, les Hanafites imputent l'achat au mandataire et n'engagent pas le mandant. Les Malikites laissent le choix au mandant; s'il refuse, l'achat incombe au mandataire, qui en paie le prix sur ses propres fonds. Les Chafi'ites l'annulent s'il achète avec l'argent du mandant; S’il achète à crédit sans mentionner le mandant, la responsabilité incombe à l’agent même s’il avait l’intention d’agir en son nom. Les Hanbalites valident l'achat au crédit de l'agent, avec deux interprétations quant à la question de savoir si cet achat engage le mandant. Selon l'interprétation la plus saine, un achat effectué avec les fonds du mandant est nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773} Les Shafi'ites (concernant la mention d'un nom lors de l'acceptation) estiment que ce nom est ignoré et que l'achat engage l'agent selon l'interprétation la plus saine, tandis que l'autre interprétation annule le contrat.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17772} Non-respect de la quantité achetée. Lorsque l'agent achète une quantité supérieure à celle commandée par le mandant, pour le même prix, les Hanafites font la distinction suivante: pour les biens évalués individuellement (qiyyamiyyat), l'excédent n'engage pas le mandant, puisque le prix de chaque bien est inconnu. Pour les biens mesurés au poids, Abou Hanifa et, dans certaines versions, Mahomet n'engagent le mandant que pour la quantité commandée; Abou Yusuf et Mahomet l'engagent pour la totalité. Les Hanbalites et les Malikites, dans l'avis contraire à celui d'Asbagh, engagent le mandant si l'agent achète deux moutons pour un dinar et que chacun vaut un dinar; les Hanbalites ajoutent que cela est valable si l'un des moutons vaut un dinar, mais invalide dans le cas contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774} Les shafi'ites font une distinction selon que le mandant a décrit ou non le mouton. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774} Fractionnement de l'achat. Si la coutume autorise le fractionnement de la marchandise commandée sans préjudice pour le mandant, tous s'accordent à dire que le mandataire peut en acquérir une partie, le mandant étant lié par ce qu'il a acheté; les hanbalites et une opinion shafi'ite limitent cette possibilité au cas où le mandant n'a pas expressément demandé l'achat de la totalité en une seule fois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17774}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} Si la coutume interdit le fractionnement ou si celui-ci porte préjudice au mandant, les écoles hanafite et malikite suspendent l'achat jusqu'à l'approbation de ce dernier. La majorité des hanafites considèrent que l'achat du solde avant que le mandant n'intente une action en justice contre le mandataire engage ce dernier, puisque l'achat partiel constituait un moyen d'exécuter l'ordre; Zufar, quant à lui, estime que l'achat incombe au seul mandataire. Si le mandant intente une action en justice en premier et que le juge engage le mandataire, l'achat ultérieur du solde engage ce dernier seul, conformément à l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} Si le mandant ordonne l'achat d'un bien décrit, le mandataire ne peut acheter qu'un bien en bon état, car une vente sans réserve implique l'absence de défauts. Si le mandant achète un bien défectueux, les Hanafites estiment, par consensus, que l'achat n'engage pas le mandant lorsque la description ne correspond pas: par exemple, une esclave aveugle ou manchote achetée alors qu'il avait été demandé d'acheter une servante, ou un étalon acheté alors qu'il avait été demandé d'acheter une monture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17776}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} Si le mandant a spécifié la nature du bien et que le mandataire l'a acheté défectueux sans le savoir, l'achat engage le mandant, qui peut le retourner. Si le mandataire était au courant du défaut, l'achat n'engage pas le mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} Les Hanafites ajoutent que si le mandataire reçoit le bien et constate un défaut en le déposant, il peut le retourner. Mais s'il a remis le bien au mandant, il ne peut le restituer qu'avec l'autorisation de ce dernier, le mandat prenant fin à la livraison. Si le mandataire accepte le défaut, il est lié par ce défaut, et le mandant peut soit l'accepter, soit engager la responsabilité du mandataire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} Les Malikites estiment que le mandataire qui achète sciemment un bien défectueux est lié s'il l'a acheté de gré à gré ou sur option du vendeur; s'il l'a acheté de son propre chef, il n'est pas lié et peut le restituer. L'achat n'engage le mandant que si le défaut est mineur et d'usage courant, et s'il s'agit d'une bonne affaire, comme pour un animal bon marché à la queue courte, contrairement à un animal noble à la queue coupée, ce qui ne l'engage pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} Selon l'école shafi'ite, en cas d'achat à crédit par un mandataire, si le bien défectueux vaut le prix payé et que le mandataire n'en avait pas connaissance, la responsabilité incombe au mandant; s'il en avait connaissance, l'avis le plus solide est que la responsabilité n'incombe pas au mandant. Si le défaut rend le bien d'une valeur inférieure au prix, l'avis le plus solide est que la responsabilité incombe au mandant s'il n'en avait pas connaissance, et non s'il en avait connaissance. Si le mandataire a acheté avec les fonds propres du mandant, la responsabilité incombe à ce dernier s'il n'en avait pas connaissance, et non s'il en avait connaissance. Si le mandant a expressément exigé la conformité du bien, al-Isnawi est d'avis que la responsabilité n'incombe pas au mandant, car l'achat n'était pas autorisé. Le mandant ou le mandataire peut retourner le bien si le mandataire ignorait le défaut, mais le mandataire ne peut le retourner si le mandant a accepté le défaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} Selon l'école hanbalite: si le mandataire connaissait le défaut, l'achat à crédit n'engage pas le mandant; s'il l'ignorait, l'achat est autorisé et le mandataire comme le mandant peuvent retourner le bien. L'école azjiyy s'est interrogée sur la responsabilité du mandant dans un achat effectué avec les fonds du mandant en connaissance de cause du défaut; si le bien est conforme au prix, il semblerait qu'il l'accepte, mais cela n'est pas garanti. Si le mandant a signalé un article défectueux et que le mandataire en avait connaissance avant l'achat, ce dernier ne peut pas l'acheter; s'il l'achète, l'achat l'engage et n'engage le mandant que si celui-ci l'accepte; s'il ignorait le défaut, il peut retourner le bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17779}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780} Le mandataire et le contrat nul. Si le mandant a autorisé un contrat nul, le mandataire ne peut conclure un contrat valable en remplacement; c’est l’avis des écoles chaféite, hanbalite, Muhammad et Zufar. Abou Hanifa et Abou Yusuf, par istihsan, permettent au contrat valable d’engager le mandant lorsque cela est plus avantageux pour lui, comme dans le cas d’un mandataire qui vend pour mille et qui vend pour deux mille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781} Le mandataire et la stipulation d’une option. L'école hanafite considère que si le mandant a ordonné une vente assortie d'une option de trois jours pour lui-même et que le mandataire a vendu sans cette option ou avec une option réduite, la vente est nulle et le mandataire est passible de poursuites pour usurpation d'identité. Si le mandant a reçu l'instruction de stipuler une option d'un mois et a stipulé trois jours, Abou Hanifa l'autorise par istihsan, mais ses deux compagnons ne l'autorisent pas, car selon eux, l'option d'un mois est valable avec la vente. L'école shafi'ite considère qu'une vente avec option est nulle si le mandataire vend sans cette option. L'école hanbalite autorise le mandataire à stipuler une option pour lui-même et pour son mandant, mais pas pour l'autre partie, car cela lie le mandant à ce à quoi il n'a pas consenti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782} Le mandataire, dans un litige, fait une admission. Les écoles malikite, chaféite, hanbalite et zufar ne l'autorisent pas, car un aveu met fin au litige, ce que le mandataire ne peut faire, et l'injonction de contester n'inclut pas son contraire. Abou Hanifa et Muhammad l'autorisent uniquement devant le juge, à l'exclusion de la peine de mort (hudud) et des représailles; leur analogie l'autorise également ailleurs, et Abou Yusuf l'autorise en toutes circonstances. Si le mandant a exclu l'aveu, celui-ci est nul et le mandataire est démis de ses fonctions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783} Le règlement, la libération, la vente, la donation et le report par le mandataire ne lui appartiennent pas, de par convention; les hanafites ajoutent qu'il ne peut ni vendre, ni donner, ni reporter ce droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783} Le mandataire peut recouvrer une créance lorsque le débiteur la conteste. Selon l'école hanbalite et une opinion shafi'ite, il est mandataire en cas de litige, car il ne peut recouvrer une créance sans avoir prouvé le droit de payer. Cette autorisation est donc accordée par la coutume. Le mandataire jouit de ce pouvoir que le droit porte sur un bien spécifique ou sur une dette, et que le mandant connaisse ou non la volonté de payer du débiteur, son refus ou son retard de paiement. Abou Yusuf, Muhammad, les Malikites, une opinion hanbalite et une opinion shafi'ite lui refusent ce pouvoir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} L'autorisation de recouvrer une créance n'implique pas nécessairement l'autorisation d'intenter une action en justice, ni en paroles ni en coutume, car une personne acceptée pour le recouvrement n'est pas forcément une personne acceptée pour un litige. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} Abu Hanifa distingue l'agent qui recouvre un bien précis, lequel n'est pas partie au litige du mandant relatif à un achat ou autre, de l'agent qui recouvre une créance, lequel est partie au litige, le recouvrement d'une créance constituant un échange que l'agent chargé du litige peut effectuer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} Concernant la possibilité pour un mandataire de recouvrer les créances pour lesquelles il a été désigné: les chaféites, l’école hanbalite, Zufar et l’avis rapporté d’Abu Yusuf estiment qu’il ne le peut pas, car un mandant peut accepter un mandataire pour le litige sans pour autant l’accepter pour le recouvrement. Les autres hanafites, ainsi qu’un avis hanbalite sur lequel s’appuyait Ibn al-Banna, l’autorisent, car quiconque est désigné pour une affaire est désigné pour la mener à terme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} Nomination d’un mandataire par un mandataire: si le mandant l’y autorise, le mandataire peut désigner un mandataire; s’il l’interdit, il ne le peut pas. Lorsque le mandant ne dit rien, les écoles hanafite, malikite et hanbalite l'interdisent, car l'éloquence et les compétences en matière de litige varient d'une personne à l'autre. Les malikites et les hanbalites limitent cette pratique aux affaires relevant de la compétence du mandataire lui-même; si l'affaire est indigne de lui ou dépasse ses compétences, il peut désigner un autre mandataire. Les malikites ajoutent que, si le litige est complexe, il peut désigner un associé pour l'assister, mais non un autre mandataire à sa place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786} Ibn Qudama indique que, lorsque le mandat est sans restriction, le mandataire peut désigner un autre mandataire si la tâche est indigne de lui ou dépasse ses capacités par son ampleur; pour les tâches qu'il peut accomplir lui-même, deux versions existent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} Si deux parties désignent un mandataire pour intenter une action en justice l'une contre l'autre, les Hanafites considèrent cette désignation comme nulle; si les deux parties désignent un mandataire contre un tiers, la désignation est valable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} Paiement d'une dette par un mandataire: si le mandant dit « payez sans témoins », le mandataire n'est pas responsable si le créancier refuse le paiement; si le mandant exige des témoins et que le mandataire n'en cite aucun, le mandataire est responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} Si un débiteur reçoit l'ordre de payer sans instruction précise concernant les témoins et qu'il ne s'en procure pas, les écoles hanafite, malikite, chaféite et l'école hanbalite le tiennent pour responsable, car il a manqué à son devoir de diligence; sa parole n'est pas recevable contre le créancier sans preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} Selon les écoles malikite, l'école hanbalite et l'école chaféite, plus rigoureuse, il n'est pas responsable s'il a payé en présence du débiteur, car le silence de ce dernier vaut consentement; l'école chaféite le tient pour responsable, car la négligence n'est pas levée par la présence du débiteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} Le mandataire chargé du recouvrement d'une créance. Une fois la créance recouvrée, le débiteur est libéré de sa dette, les fonds appartiennent au mandant et sont détenus par le mandataire à titre de dépôt fiduciaire, soumis aux règles applicables aux dépôts. Le mandataire ne peut céder, différer ni annuler la créance. Les Hanafites précisent qu'il ne peut prendre de nantissement, mais peut exiger une caution; les Malikites et les Hanbalites ajoutent qu'il ne peut transiger sur la créance sans l'accord du mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789} Remise d'un droit à celui qui se prétend mandataire d'un propriétaire absent. Tous s'accordent à dire que si le demandeur prouve le mandat par des preuves, le juge ordonne au débiteur de lui payer. En l'absence de preuve, les écoles malikite, chaféite et hanbalite estiment que le débiteur n'est pas tenu de payer le créancier tant que celui-ci n'a pas confirmé le mandat. Si le débiteur paie volontairement et que le créancier conteste le mandat, le créancier ne peut se retourner contre le payeur que si celui-ci a perdu l'argent par sa faute ou sa négligence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790} Les hanafites distinguent la dette du bien spécifique: si le débiteur confirme le mandat du créancier, il est tenu de payer; s'il le conteste, seul le mandataire est tenu de payer la somme qu'il a perçue. Lorsque le propriétaire absent confirme ultérieurement le mandat, le débiteur est libéré de son obligation. Si le mandataire nie les faits, le débiteur paie à nouveau et peut se faire rembourser par ce dernier si l'argent est toujours en sa possession. S'il l'a perdu, le débiteur ne peut se faire rembourser par le mandataire que s'il s'est engagé lui-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17791} Si le débiteur prouve que le mandataire a nié le mandat et a pris l'argent, la preuve est acceptée, car elle établit que le droit du mandataire sur la somme s'est éteint du fait de son encaissement, et que, par conséquent, le mandat prend fin de plein droit. Si le droit porte sur un bien spécifique, tel qu'un dépôt, et que le dépositaire confirme le mandat du mandataire, il n'est pas tenu de le remettre, car cela reviendrait à admettre qu'il a remis le bien d'autrui. Une dette est différente, et il est ordonné de la payer, puisqu'il admet que la somme appartient au créancier, les dettes étant acquittées par des sommes égales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792} Si le dépositaire remet le dépôt à une personne qui prétend être mandataire, que celui-ci le perd et que le propriétaire nie le mandat, le dépositaire est responsable; il peut faire jurer le propriétaire et ne peut se retourner contre le mandataire que s'il l'a engagé au moment de la remise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792} Plusieurs mandataires. Le mandant peut désigner plusieurs mandataires pour une opération particulière autre qu'un litige. S'il les désigne en une seule fois, aucun ne peut agir seul, sauf autorisation du mandant. Les Hanafites estiment que lorsque l'opération requiert un jugement et des conseils, comme la vente, le mariage et le recouvrement d'une dette, nul ne peut agir seul. Dans les cas où cela n'est pas nécessaire, comme pour la remise d'un cadeau, le remboursement d'un acompte ou le paiement d'une dette, chacun peut agir seul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793} De même, deux mandataires pour une vente, un mariage, un khul' ou tout autre contrat impliquant une somme d'argent n'agissent pas seuls, car le mandant s'est fié au jugement des deux. Les deux mandataires chargés du recouvrement d'une dette ne peuvent recouvrer l'un sans l'autre, bien que leur recouvrement soit complet dès que la somme recouvrée par l'un parvient à l'autre ou au mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17793}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794} Les écoles hanafite et malikite autorisent chacun des deux mandataires désignés par des actes distincts à agir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} Dans un litige, deux mandataires peuvent agir individuellement selon l'école hanafite (à l'exception de Zufar), une opinion hanbalite et une opinion shafi'ite, considérant que le but d'un litige est d'informer le juge et que la divergence des opinions risque de créer une confusion. Zufar, l'opinion shafi'ite la plus solide et l'école hanbalite majoritaire l'interdisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} La désignation d'un mandataire par un autre est autorisée par accord, avec permission. Elle est interdite par accord. Lorsque le mandant dit « faites comme bon vous semble » ou « agissez selon votre jugement », les écoles hanafite, malikite et hanbalite l'autorisent, tandis que l'école chaféite l'interdit, car de telles expressions laissent place à de nombreuses interprétations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796} En l'absence de toute formulation explicite, la majorité l'interdit, car le mandant s'est fié au jugement du mandataire, et les avis divergent. Deux cas sont admis: lorsque la tâche est indigne du mandataire ou dépasse ses compétences, et lorsqu'il pourrait l'accomplir lui-même mais ne peut la réaliser intégralement en raison de son volume important. Dans ce dernier cas, l'école hanbalite et une école chaféite autorisent la délégation complète; l'école malikite et l'école chaféite n'autorisent que la partie excédant ses capacités. Ahmad et Ibn Abi Layla l'autorisent dans tous les cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17797}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798} La confiance accordée à la personne désignée par le mandataire. La personne désignée par le mandataire doit être digne de confiance, sauf si le mandant a désigné une personne indigne de confiance, auquel cas le mandataire suit le choix du mandant. Si le mandataire commet une faute, les écoles hanbalite et une opinion shafi'ite exigent que le mandataire le révoquer, tandis que l'opinion shafi'ite la plus solide stipule que le mandataire ne peut le révoquer, puisqu'il était autorisé à le désigner mais non à le révoquer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798} La nature du mandat détenu par le mandataire. Si le mandant dit « nommer en mon nom » ou « déléguer à lui », le mandataire est son représentant, n'est pas destitué par la révocation du premier mandataire, et tous deux perdent leur mandat au décès du mandant. Si le mandant dit « nommer en votre nom », le mandataire est le mandataire du premier mandataire et perd son mandat en cas de révocation ou de décès de ce dernier; les écoles shafi'ite et hanbalite autorisent le mandant à révoquer le sous-mandataire, car il est une branche d'une branche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} Si le mandant dit seulement « nommer », les écoles hanafite, malikite, l'avis shafi'ite le plus solide et l'école hanbalite considèrent le mandataire comme le représentant du mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} La nomination sans autorisation préalable est considérée comme nulle par la majorité; Ahmad et Ibn Abi Layla la valident toutefois dans un cas précis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} L’agent est un dépositaire des biens de son mandant qui lui sont confiés. Il s’agit d’un dépôt: il n’est responsable d’une perte que s’il commet une faute ou fait preuve de négligence, qu’il agisse contre rémunération ou à titre bénévole, car il agit pour le compte du mandant et le mandat est un contrat de bienveillance et d’assistance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800} En tant que dépositaire, sa parole est acceptée sur la base de sa décharge de responsabilité par serment, le mandat reposant sur la souplesse et la facilité de transaction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801} Stipulation de la responsabilité ou de son absence. Ibn Qudama affirme que ce qui constitue une fiducie ne devient pas une responsabilité par stipulation, et que ce qui constitue une responsabilité ne peut être écarté par stipulation; un hadith rapporté par Ahmad semble autoriser l’écart de responsabilité par stipulation, mais la première opinion est l’opinion majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801} Transgression et négligence. L'agent est responsable s'il surcharge un animal, porte un vêtement sans autorisation, perd de l'argent sans savoir comment, mélange l'argent du mandant avec le sien de manière à ce qu'il soit impossible de les distinguer, refuse de le restituer sans excuse valable, ou tarde à le faire après que l'excuse ait expiré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} Si le mandant a payé lui-même la dette et que l'agent l'a ensuite payée également, l'agent n'est pas responsable s'il n'en avait pas connaissance; s'il en avait connaissance, il est responsable, car le paiement du mandant constituait un retrait de l'agent dont ce dernier avait connaissance. Abu Hanifa tient l'agent responsable d'un double paiement de la zakat, qu'il en ait eu connaissance ou non. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} Si un agent de vente à crédit livre la marchandise avant d'en avoir perçu le prix et que l'acheteur refuse de payer, il est responsable de la valeur de la marchandise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} S'il tarde à payer le prix reçu sans excuse valable jusqu'à ce que celui-ci soit perdu, il est responsable; en cas d'excuse valable, il ne l'est pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} S'il abat un animal par erreur et que celui-ci meurt illégalement, il est responsable, car l'erreur et l'intention sont assimilables en matière de biens d'autrui. S'il a reçu l'ordre de percevoir un acompte en totalité et qu'il n'en a perçu qu'une partie, il est responsable. Cette responsabilité s'éteint s'il perçoit le solde avant la perte de la première partie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} Mesure de la responsabilité. Pour un bien fongible, il paie son équivalent; pour un bien ayant une valeur individuelle, il paie sa valeur; si un bien fongible est inestimable, il paie sa valeur. La valeur est celle du jour de la transgression ou de la perte, et non à un autre moment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804} Obligation de rendre compte. Le mandataire doit fournir au mandant les informations demandées concernant ses actes. Ibn Hajar précise que toute personne de confiance à qui l'on demande des comptes doit les fournir; ce qui importe, c'est la réponse et la demande, non l'écriture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804} Restitution de ce qui est en possession du mandataire. Il doit restituer au mandant ce qu'il détient. S'il refuse, sans excuse, de le faire à la demande, jusqu'à ce que le bien soit perdu, il est responsable; il en va de même si son excuse cesse et qu'il tarde à restituer le bien jusqu'à ce que la perte survienne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17804} Si le mandant et le mandataire conviennent d'une rémunération, celle-ci est due de plein droit. En cas de désaccord, les Hanafites font la distinction suivante: le mandataire qui ne perçoit pas de salaire agit comme un bénévole, puisque le mandat est initialement gratuit; le mandataire d'une profession dont les membres sont salariés, tel qu'un courtier ou un négociant, a droit à la rémunération habituelle. L'article 1467 de la Majalla al-Ahkam al-'Adliyya énonce cette règle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805} Lorsque le salaire est dû, l'agent le perçoit en remettant la marchandise qui lui a été confiée, lorsque cette remise est possible, comme un tissu qu'il tisse ou coud; s'il a été mandaté pour vendre, acheter ou accomplir le pèlerinage, il perçoit le salaire convenu une fois le travail accompli, même si le prix n'a pas encore été perçu. Toutefois, si le mandant a stipulé que le prix devait être remis au préalable et que l'agent ne l'a pas fait, il n'a droit à aucun salaire, la condition n'ayant pas été remplie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806} Conditions du salaire. Le travail doit être connu, le montant de la rémunération doit être connu, et, selon certains juristes, cette rémunération ne doit pas faire partie de l'objet du mandat. L'agent doit exécuter le mandat valablement. Une rémunération indéterminée, telle qu'un « dixième du prix », ne donne droit qu'à la rémunération habituelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806} Si l'agent effectue une vente irrégulière, il ne perçoit aucune rémunération, car une autorisation générale de vente ne permet qu'une vente valable. En revanche, s'il effectue une vente valable et que le prix est perdu, il perçoit la rémunération car le travail a été accompli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807} Le mandant doit recouvrer auprès de lui les sommes versées par l'agent. Si le mandant ordonne à un mandataire de payer une dette et que celui-ci paie de ses propres deniers, il recouvre la somme due, que le mandant ait ou non stipulé un mécanisme de recouvrement. Si le mandataire achète sans l'argent du mandant et paie le prix de ses propres deniers, les hanafites, à l'exception de Zufar, l'autorisent à conserver la marchandise jusqu'à ce qu'il ait recouvré le prix auprès du mandant, car il est la partie contractante à qui le prix est dû. Zufar soutient qu'il ne peut pas la conserver, car la marchandise est un dépôt en fiducie. La responsabilité liée à cette détention est, pour Abou Hanifa et Muhammad, semblable à celle d'un vendeur; pour Abou Yusuf, semblable à un gage; et pour Zufar, semblable à une usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808} Les droits d'un contrat conclu par un mandataire sont de deux sortes: ceux qui peuvent être conclus au nom du mandataire, comme la vente et la location, dont les droits reviennent au mandataire, qui livre les biens, reçoit le prix et peut intenter une action en paiement comme s'il était le propriétaire; et ceux qui doivent être conclus au nom du mandant, comme le mariage, le khul' et le compromis relatif à un homicide volontaire, dont les droits reviennent au mandant, de sorte que le mandataire du mari ne peut être poursuivi pour la dot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} Les Shafi'ites et une narration d'Ahmad soutiennent que les droits de tout contrat reviennent au mandataire; l'école hanbalite, quant à elle, affirme qu'ils reviennent systématiquement au mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808} Si le mandant ordonne au mandataire de percevoir le prix, ce dernier est en droit de l'exiger, et l'acheteur est tenu de payer le montant réclamé. Si le mandant interdit au mandataire de percevoir le prix, cette interdiction est valable; mais si l'acheteur paie le prix au mandant, ce dernier est libéré de ses obligations par istihsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} Si les marchandises sont saisies chez l'acheteur, celui-ci recouvre le prix auprès de celui ou celle qui a payé, soit l'agent, soit le mandant; et une action en justice peut être intentée contre l'agent s'il est celui qui a reçu les marchandises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809} Les contrats qui doivent être conclus au nom du mandant, tels que le mariage, le khul', l'affranchissement contre paiement, l'acte d'affranchissement et le compromis relatif à un homicide volontaire, confèrent des droits au mandant et à son encontre; l'agent n'est qu'un messager et un transmetteur. Ainsi, l'agent du mari ne peut être poursuivi pour la dot, et l'agent de la femme ne peut la percevoir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} Les Malikites estiment que, dans une vente, le mandataire intente une action en recouvrement du prix, et que, dans un achat, il reçoit et livre la marchandise; il renvoie un bien défectueux s’il n’en avait pas connaissance, et est tenu au prix, sauf renonciation expresse de sa part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} Concernant la transmission des effets du contrat au mandant, la majorité (les avis les plus solides des écoles hanafite et chaféite, les Malikites et les Hanbalites) considère que les effets sont transmis directement au mandant, puisque le contrat a été conclu pour son compte. Al-Karkhi soutient que les effets incombent d’abord au mandataire, puis sont transmis au mandant. Abu Zayd considère que le mandataire est un représentant pour la décision et un mandant pour les droits. Litiges entre mandataire et mandant. Concernant l'existence du mandat, la parole du mandant est acceptée, puisque, à l'origine, il n'y a pas de mandat. Quant aux modalités (vente à prix fixe ou à crédit, portant sur un objet précis), la parole du mandant est acceptée par les écoles hanafite, malikite, shafi'ite et, selon une opinion hanbalite, les malikites ajoutent deux cas où le serment du mandataire prévaut. L'école hanbalite, quant à elle, accepte la parole du mandataire, car il est digne de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} En cas de perte d'un bien détenu sans négligence, la parole du mandataire, attestée sous serment, est acceptée d'office, puisqu'il est un dépositaire et ne peut facilement prouver la perte. Les Malikites limitent cette acceptation à un mandataire non soupçonné; les Hanbalites à une cause cachée, telle qu'un vol; si la cause est évidente, comme un incendie ou un pillage, le juge hanbalite (al-Qadi) exige d'abord une preuve de l'événement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} En cas d'allégation de transgression ou de négligence, la parole du mandataire, attestée sous serment, est acceptée, puisqu'il nie les faits reprochés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} Litiges relatifs à la vente et au recouvrement du prix. Les Hanafites statuent au cas par cas, selon que l'objet a été livré ou non à l'agent. Si le mandant confirme la vente et le recouvrement, mais conteste la perte ou la livraison, la déclaration sous serment de l'agent est acceptée concernant la perte. Si le mandant conteste la vente et le recouvrement, la déclaration de l'agent est crue quant à la vente, mais non quant au recouvrement, à l'encontre du mandant; l'acheteur peut alors payer à nouveau le mandant et reprendre possession des biens, ou résilier la vente. Si le mandant confirme la vente et que l'agent affirme que l'acheteur a payé le mandant, l'acheteur est libéré de ses obligations sur la base de l'accusé de réception de l'agent, mais ce dernier est responsable s'il ne peut ensuite le prouver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} Voici un résumé. Les Malikites estiment que si le mandataire déclare « J'ai agi conformément à vos instructions », sa parole est acceptée, car il est digne de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} Les Chafi'ites estiment que si le différend survient après la révocation du mandataire, sa parole n'est pas acceptée sans preuve; si le différend survient avant, deux avis s'opposent: le plus répandu privilégie la parole du mandant; l'autre privilégie la parole du mandataire lorsqu'il peut agir seul (comme dans le cas du divorce et de l'affranchissement) sous serment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} Selon l'école hanbalite, on accepte la parole de l'agent attestant avoir vendu et encaissé le prix, et que ce dernier a été perdu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816} Concernant la restitution des biens détenus par l'agent, la majorité des juristes, selon les écoles hanafite et malikite, se fie à sa parole sous serment, que l'agence soit rémunérée ou non; les écoles chaféite et hanbalite exigent une preuve lorsque l'agent est rémunéré, et acceptent son serment dans le cas contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816} Fin du mandat. La première voie est la révocation. Le mandat étant un contrat non contraignant, chaque partie peut y mettre fin par révocation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17816} La fin du mandat. La première cause est la révocation. Le mandant peut révoquer son mandataire et lui interdire l'acte, et le mandataire peut se révoquer lui-même; les juristes s'accordent généralement sur ce point. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817} Conditions de validité de la révocation par le mandant. La première est que le mandataire ait connaissance de la révocation. Les hanafites, une opinion malikite, une opinion chaféite et une tradition hanbalite l'exigent, car la révocation dissout le contrat et ne peut lier sans connaissance de cause. La majorité des malikites, l'opinion chaféite la plus solide et l'école hanbalite ne l'exigent pas. Pour les Hanafites, la connaissance du mandat s'acquiert par la présence du mandat lors de la cession, par la lettre du mandant, par un messager (qu'il soit digne de confiance ou non, majeur ou mineur), ou par le témoignage de deux hommes dignes de confiance ou d'un seul. Le témoignage d'une personne non digne de confiance est valable si le mandataire y croit. Abou Hanifa soutient que si le mandataire conteste le témoignage, la cession n'est pas effective, même si celui-ci s'avère véridique, car le fait de rapporter une cession s'apparente à un témoignage. Abou Yusuf et Muhammad sont d'un avis contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818} Deuxièmement, aucun droit d'un tiers n'est attaché au mandat. Les Hanafites estiment qu'une cession sans le consentement du titulaire du droit est nulle, comme c'est le cas pour un gage consenti à un créancier avec un mandataire chargé de le vendre, ou pour un mandataire du défendeur désigné à la demande du demandeur. Les chaféites autorisent la révocation si le mandat a été demandé par la partie adverse; les malikites l'interdisent dès lors que le mandataire a rencontré la partie adverse à trois reprises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} Troisièmement, le mandat n'est pas un contrat de mandat, car un mandat de mandat engage les deux parties. Quatrièmement, le retrait du mandataire ne doit pas causer de préjudice; l’école shafi’ite Sharwani interdit tout retrait susceptible de permettre à un malfaiteur de s’emparer des biens du pupille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} Selon la majorité des juristes, le retrait du mandataire ne requiert pas l’accord du mandant, sauf chez les hanafites où cet accord est requis lorsque le mandat concerne un litige ou l’acquisition d’un bien nommé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820} Décès. Le mandat prend fin au décès du mandant ou du mandataire, ou d’un commun accord, car le décès entraîne la perte de la capacité juridique et la transmission des biens aux héritiers. Les hanafites, les shafi’ites et l’école hanbalite estiment que le mandataire n’a pas besoin d’être informé du décès. Les Malikites estiment que si le mandant se trouvait dans la ville du décès et avait connaissance du mandat, le mandat n'est pas révoqué tant qu'il n'a pas appris le décès; sinon, le mandat n'est révoqué qu'à la connaissance du décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17820} Folie. Les Hanafites mettent fin au mandat par une folie permanente, d'une durée d'un mois selon Abou Yusuf et d'un an selon Muhammad; une fois la folie installée, le mandat ne reprend pas après la guérison. Les Shafi'ites et l'école hanbalite y mettent fin par la folie; les Malikites ne le font pas, sauf si la folie du mandant est longue, auquel cas le juge en tient compte; une narration hanbalite indique que le mandat ne prend pas fin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17821} Évanouissement. La plupart des juristes ne mettent pas fin au mandat par cet événement. L'avis plus solide de l'école shafi'ite, par analogie avec la folie, établit une distinction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822} Interdiction. Les hanafites considèrent que l'interdiction du mandant ou du mandataire met fin au mandat, mais précisent que l'interdiction du mandant n'y met fin que lorsque le mandat concerne les contrats et les litiges, et non le paiement des dettes ou l'encaissement d'un acompte. Les hanbalites y mettent fin par interdiction pour prodigalité, et par insolvabilité du mandant dans l'objet de l'interdiction. Les shafi'ites y mettent fin par interdiction pour prodigalité ou insolvabilité dans toute disposition qui reste sans effet. Les malikites y mettent fin par l'insolvabilité limitée du mandant, c'est-à-dire une décision de justice ordonnant la saisie des biens du débiteur pour le compte de ses créanciers, et non par insolvabilité générale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17822}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823} Apostasie. Les Hanafites estiment que si l'apostat est considéré comme ayant rejoint le territoire ennemi, le mandat prend fin et ne reprend pas lors de son retour à l'islam. Ses actes antérieurs à la conversion sont suspendus selon l'école d'Abou Hanifa et restent valides selon les écoles d'Abou Yusuf et de Muhammad. Les Malikites considèrent que le mandataire est démis de ses fonctions par l'apostasie de son mandant après la période de demande de repentance. Les Chafi'ites fondent leur décision sur la question de savoir si les biens de l'apostat lui échappent, avec plusieurs avis, le plus courant étant celui de la suspension du mandat. Les Hanbalites estiment que le mandat ne prend pas fin par l'apostasie du mandataire, mais par celle du mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17824} Immoralité (fisq). Les Hanbalites estiment que le mandat ne prend pas fin du fait de l'immoralité du mandataire, sauf dans les cas où l'immoralité est incompatible avec la sienne, comme la proposition de mariage, où le mandataire est révoqué par sa propre immoralité ou celle de son mandant. Un mandataire agissant dans des affaires exigeant la confiance, comme le mandataire d'un tuteur d'orphelin ou l'administrateur d'une dotation, est révoqué par sa propre immoralité ou celle de son mandant. Les Chafi'ites, quant à eux, y mettent fin du fait de l'immoralité du mandant dans les affaires exigeant l'intégrité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825} Ivresse. Les Chafi'ites estiment que si l'une des parties s'enivre sans faute de sa part, le mandat est révoqué. Selon l'école shafi'ite, si la faute du mandataire entraîne sa résiliation, celle-ci peut ou non prendre fin. L'école hanbalite considère qu'elle ne met fin au mandat que dans les cas où elle est contradictoire, comme une demande en mariage. L'école hanafite, quant à elle, estime qu'elle ne met jamais fin au mandat: un mandataire chargé de divorcer qui divorce en état d'ivresse n'a pas divorcé; un mandataire qui vend en état d'ivresse n'engage pas le mandant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17825}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826} Le bien quitte la propriété du mandant. Si le mandant accomplit lui-même l'acte, par exemple en vendant les biens avant le mandataire, ou si les biens sont revendiqués par un tiers, ou encore s'il épouse lui-même la femme, le mandat prend fin. Les Malikites estiment que si le mandant vend à un acheteur et le mandataire à un autre, la première vente est valable et la seconde est nulle, sauf si le second acheteur a pris possession du bien. Dans ce cas, la seconde vente est maintenue et la première est annulée, à moins que le second acheteur et le second vendeur n'aient eu connaissance de la première. Les Hanbalites considèrent que la reconnaissance par le mandataire de la réception du bien pour lequel il avait été désigné met fin au mandat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826} Si le bien retourne au mandant, Muhammad soutient que le mandat est rétabli, car la restitution du bien par rescision correspond à la propriété initiale et aux droits qui y sont attachés. Les Shafi'ites et Abu Yusuf estiment le contraire, car l'acte du mandant implique la révocation du mandataire. Ibn 'Abidin affirme que le mandat est rétabli uniquement si la propriété est restituée par rescision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827} La transgression du mandataire dans l'exercice de ses fonctions. L'avis shafi'ite, plus solide, et l'école hanbalite soutiennent que le mandat ne prend pas fin en cas de transgression, puisque l'acte a été accompli avec permission: la confiance est rompue par la transgression, mais l'acte demeure, comme un gage. L'avis shafi'ite opposé et un avis hanbalite y mettent fin, car le mandat est un contrat de confiance, tel un dépôt. Al-Mardawi affirme que si le mandataire détruit la chose pour laquelle il a été désigné, le mandat prend fin; s'il subsiste, il ne prend pas fin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827} Déni. Les Hanbalites et une opinion hanafite considèrent que le mandat ne prend pas fin par le déni du mandataire ou du mandant, car le déni n'entraîne pas le retrait d'une autorisation antérieure; la fatwa hanafite et une opinion hanbalite, quant à elles, estiment qu'il prend fin. Les Shafi'ites considèrent que le déni par oubli ou par dissimulation n'entraîne pas la révocation du mandat; en revanche, tout déni délibéré et sans motif y met fin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828} Perte de l'objet. Le mandat prend fin lorsque l'objet est perdu ou lorsque la femme dont le divorce a été confié décède. Les Hanafites considèrent que le mandat entre deux associés prend fin lors de leur séparation, même si le mandataire n'en a pas connaissance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828} Accomplissement de l'acte. Les Hanafites considèrent que le mandat prend fin lorsque l'objet confié est accompli, par exemple lorsqu'il recouvre une dette ou contracte un mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17828} Retrait implicite. Les Hanbalites considèrent que le mandat prend fin par le retrait implicite du mandant, par exemple par des relations sexuelles avec une épouse dont il avait confié le divorce, ou par le retrait implicite du mandataire, par exemple en acceptant le mandat d'affranchir un esclave alors qu'il avait été désigné pour l'acheter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17829}"
  ur: "وکالہ، اس کے سر کی مختلف حالتوں کے ساتھ، زبان کی حفاظت میں معنی رکھتا ہے، جیسا کہ الہی نام الوکیل میں جس کا مطلب ہے سرپرست، اور توکل میں ⁦('ہم نے اپنے معاملات خدا کے سپرد کر دیے ہیں')⁩؛ توکل کسی دوسرے کو تصرف کرنے کا وفد ہے۔ ایجنٹ کو وکیل اس لیے کہا جاتا ہے کہ اس کے پرنسپل نے اسے اس کے معاملات کی ذمہ داری سونپی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17719} فقہاء اس کی کئی طریقوں سے تعریف کرتے ہیں۔ حنفیہ: کسی کو حلال، معلوم تصرف میں، آسانی یا عاجزی سے اپنی جگہ پر رکھنا۔ مالکیہ: کسی ایسے شخص کو حق کے ساتھ معزول کرنا، جس کا کوئی حکم یا عبادت نہ ہو، دوسرے کے لیے اس کی موت کی شرط نہ ہو۔ شافعی: ایک شخص کی طرف سے وفد جو کہ وہ کر سکتا ہے اور جو کسی دوسرے کو اپنی زندگی کے دوران کرنے کے لیے وفد کو تسلیم کرتا ہے۔ حنبلی: کسی ایسے شخص کو معزول کرنا جو جائیداد میں تصرف کرنے کی صلاحیت رکھتا ہو، جیسا کہ وہ خود، جس میں خدا کے حقوق اور انسانوں کے حقوق کا اقرار کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17719} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17720} موصوف وکالہ کو ہمسایہ اصطلاحات سے ممتاز کرتا ہے: ڈیپٹائزنگ ⁦(نیابہ)⁩، جو کہ بعض فقہا کے لیے اس کے مترادف اور وسیع تر ہے۔ اختیار ⁦(ولایہ)⁩، کسی لفظ کو دوسرے پر لے جانا چاہے وہ چاہے یا نہ چاہے، جو کہ قانونی یا لازمی ڈیپوٹائزنگ ہے، جبکہ وکالہ پر اتفاق ہے۔ وصیت ⁦(یا)⁩، موت کے بعد دوسرے کو اپنی جگہ پر رکھنا، جبکہ وکالہ زندگی میں ہے۔ اور سرپرستی ⁦(قیواما)⁩، ایک اختیار جو جج کی طرف سے کسی بالغ کو نابالغ کے مفاد کے لیے کام کرنے کے لیے دیا جاتا ہے، یا اپنی بیوی پر شوہر کا اختیار۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص17720} فقہاء اس بات پر متفق ہیں کہ وکلاء حلال ہے۔ وہ قرآن کا حوالہ دیتے ہیں: غار والوں کی طرف سے ان میں سے ایک کو چاندی کے ساتھ شہر بھیجنے کا واقعہ، اور سورۃ النساء میں دو ثالثوں کی آیت، جو یہ ظاہر کرنے کے لیے لی گئی ہے کہ ہر ثالث میاں بیوی میں سے کسی ایک کے ایجنٹ کے طور پر کام کرتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17721} وہ سنت کا حوالہ دیتے ہیں: عروہ بن ابی الجعد الباریقی کی روایت، جسے نبی نے بھیڑ خریدنے کے لیے دینار دیا تھا۔ قربانی خریدنے کے بارے میں حکیم بن حزام کی روایت؛ خیبر کے ایجنٹ کے بارے میں جابر کی رپورٹ؛ اور ابو رافع کی روایت ہے کہ وہ میمونہ سے نبی کے نکاح میں شریک تھے۔ فقہا اس کے حلال ہونے پر عہد نبوی سے لے کر آج تک متفق ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17721} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17722} وجہ سے، اس کی ضرورت واضح ہے، کیونکہ کوئی شخص بیماری، عمر یا مرتبے کے اعتبار سے خود عمل کرنے سے عاجز ہو سکتا ہے، اور اس کے بغیر مشقت دور ہو جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17722} وکالہ کے ستون: اکثریت انہیں فارمولہ، دو فریق ⁦(پرنسپل اور ایجنٹ)⁩ اور ایجنسی کا مقصد مانتی ہے۔ احناف کا خیال ہے کہ ستون پیش کش اور قبولیت ہے، کیونکہ ان کی موجودگی باقی دو کو شامل کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17722} فارمولا پیشکش اور قبولیت ہے، جس کے ذریعے باہمی رضامندی کا اظہار کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17722} پیشکش۔ اکثریت کا خیال ہے کہ یہ وہی ہے جو پرنسپل کی طرف سے آتا ہے اور اسے ایجنٹ مقرر کرنے کی اجازت ظاہر کرتا ہے۔ حنفیہ کا خیال ہے کہ معاہدہ کرنے والے فریقین میں سے کسی ایک کی طرف سے معاہدہ کرنے کی خواہش ظاہر کرنے کے لیے سب سے پہلے کیا آتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17723} یہ رضامندی کے کسی بھی نشان سے، لفظوں میں، تحریری طور پر، پیغام کے ذریعے یا کسی گونگے آدمی کے اشارے سے بنایا جا سکتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17723} صریح الفاظ میں 'میں نے آپ کو مقرر کیا'، 'میں نے آپ کے سپرد کیا'، 'میں نے آپ کو اپنا نائب بنایا'، 'میں نے آپ کو اجازت دی'، 'میں نے آپ کو اپنی جگہ مقرر کیا' اور 'آپ میرے ایجنٹ ہیں' شامل ہیں۔ حنفیہ، شافعیہ اور حنبلیوں کے لیے 'بیچنے' جیسا حکم صحیح ہے، اور مالکیوں کے لیے جہاں رواج ایسا ہی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17724} 'میں آپ کو مقرر کروں گا'، 'میں آپ کو مقرر کرتا ہوں' اور 'میں نے آپ پر بھروسہ کیا ہے' کے الفاظ شافعیوں کے لیے ایک درست ایجنسی نہیں بناتے ہیں، کیونکہ وہ مبہم ہیں، جب تک کہ کوئی واضح اصطلاح شامل نہ کی جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17724} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17725} حنفیہ، مالکیہ اور شافعیہ کے نزدیک ایجنسی کا اختتام پیغام کے ذریعے کیا جا سکتا ہے: ایجنٹ قابل اعتماد ہو جاتا ہے، خواہ وہ خبر پہنچ جائے یا اس کے پاس خبر پہنچ جائے نہیں {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17724} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17725} یہ پیشکش بھی واضح تحریر کے ذریعے کی جا سکتی ہے، گونگے آدمی کی سمجھ میں آنے والی نشانی کے ذریعے، کسی ایسے عمل سے جو اجازت ظاہر کرتا ہو ⁦(شوہر کی طرف سے، جب اس کے شوہر کی طرف سے پیش کش کو حنبلی کی مرضی کے مطابق سمجھا جاتا ہے)⁩۔ بیوی کا مال جبکہ وہ جانتی ہے اور خاموش رہتی ہے ⁦(مالکیوں)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17725} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17726} حنفیہ، شافعیہ اور حنبلیوں کے لیے خاموشی پیش کش نہیں ہے: جو شخص کسی اجنبی کو دیکھے اس نے اپنا مال بیچ کر خاموشی اختیار نہیں کی اور یہ کہتا ہے کہ اس نے اپنا مال فروخت نہیں کیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17726} قبولیت الفاظ میں دی جا سکتی ہے، جیسے 'میں قبول کرتا ہوں' یا قبولیت کو ظاہر کرنے والے الفاظ۔ حنفیہ اور شافعی کہتے ہیں کہ ایجنٹ کو انکار نہیں کرنا چاہیے۔ اگر وہ پیشکش کے بعد انکار کر دیتا ہے، تو کوئی ایجنسی ختم نہیں کی جاتی چاہے وہ بعد میں قبول کر لے، جب تک کہ پیشکش اور قبولیت کی تجدید نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17726} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17727} عمل کے ذریعے قبول کرنے پر تین آراء ہیں۔ جمہور ⁦(حنفی، مالکیہ، شافعی کا قول، اور حنبلی)⁩ کا خیال ہے کہ یہ کسی بھی عمل سے مکمل ہوتا ہے جو اسے ظاہر کرتا ہے، جیسے کہ ایجنٹ وہی کرتا ہے جو اسے کہا گیا تھا۔ شافعی ایک قول میں، حنبلی ایک قول میں اور حنفیہ میں سے زفر کہتے ہیں کہ اس کے لیے الفاظ کی ضرورت ہے۔ تیسرا شافعی نظریہ امتیاز کرتا ہے: اگر پیشکش کسی حکم کی شکل میں ہو جیسے کہ 'بیچو اور خریدو' تو عمل کے ذریعے قبول کرنا کافی ہے، لیکن اگر یہ معاہدہ کی شکل میں ہو جیسے 'میں نے تمہیں مقرر کیا' تو الفاظ کی ضرورت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17727} واضح مکتوب تحریر اور گونگے آدمی کی سمجھ میں آنے والی علامت سے بھی قبولیت درست ہے۔ احناف کا خیال ہے کہ ایجنٹ کی خاموشی قبولیت ہے جو اس کے انکار سے ختم ہو جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17727} اگر پیشکش کے بعد قبولیت میں تاخیر ہو جائے تو جمہور ⁦(حنفیہ، حنبلی، شافعی مکتب اور ایک مالکی کا قول)⁩ اسے صحیح سمجھتے ہیں، کیونکہ اجازت باقی رہتی ہے جب کہ پرنسپل اجازت کو واپس نہیں لیتے، اور یہ ایک عمل جیسا ہے۔ شافعی اس کو ان صورتوں تک محدود کرتے ہیں جہاں فعل کا وقت متعین نہ ہو۔ اگر یہ طے شدہ ہے اور اس کے گزر جانے کا اندیشہ ہے تو فوری طور پر قبول ہونا ضروری ہے، جیسا کہ جب جج کسی شخص کو ایجنسی پیش کرتا ہے جب اس کے سامنے اس کے قائم ہونے پر۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17728} دوسرا مالکی قول اور ابو حامد المروضی شافعیوں میں سے قبولیت کا فوری ہونا ضروری ہے، کیونکہ وکالہ زندگی میں کیا جانے والا معاہدہ ہے، اور فروخت کی طرح اس کی بھی فوری قبولیت ضروری ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17728} المزاری نے کہا کہ معاملہ نیت اور رواج کی طرف لوٹتا ہے: آیا سوال میں الفاظ فوری جواب طلب کرتے ہیں، یا فوری اجازت دیتے ہیں یا مؤخر کرنے کی اجازت دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17728} وکالہ فارمولہ کی شکلیں، جس وقت تک اس کے اثرات مرتب ہوتے ہیں، یہ ہیں: فوری شکل، جو نہ کسی شرط پر منحصر ہے اور نہ ہی کسی وقت سے منسلک ہے۔ مشروط شکل؛ مستقبل سے منسلک فارم؛ اور وقت کی محدود شکل۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17728} فوری فارمولہ جو نہ تو کسی شرط پر ہے اور نہ ہی کسی وقت سے جڑا ہوا ہے جیسا کہ اصول میں کہا گیا ہے کہ 'میں نے تمہیں وہ مکان بیچنے کے لیے مقرر کیا ہے'، فقہاء کے اتفاق سے درست ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17729} فارمولہ شرط پر مشروط ہے۔ فقہاء کا دو قول پر اختلاف ہے۔ حنفیہ کا پہلا قول حنبلی کا ہے اور شافعیوں کا قول یہ ہے کہ یہ صحیح ہے، جیسا کہ 'اگر حاجی آئے تو اس کھانے کو بیچ دو'۔ وہ ابن عمر کی روایت کا حوالہ دیتے ہیں کہ نبی نے زید بن حارثہ کو موطا پر حکم دیا، پھر جعفر کو، پھر ابن رواحہ کو اگر پہلے دو قتل کر دیے گئے۔ اور وہ دلیل دیتے ہیں کہ ایجنسی ایک معاہدہ ہے جس کے ایجنٹ پر اثر، عمل کرنے کی اجازت کو تسلیم کیا جاتا ہے، لہذا یہ وصیت کی طرح ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17729} دوسرا، شافعی کا قول اور ایک حنبلی کا قول یہ ہے کہ یہ باطل ہے۔ الماوردی کہتے ہیں کہ کسی ایجنسی کو شرائط یا شرائط پر کنڈیشنگ کرنا باطل ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17729} شافعی پرنسپل کو اجازت دیتے ہیں کہ وہ ابھی ایجنسی کا نتیجہ نکالیں اور ایکٹ کو خود ایک شرط کے ساتھ مشروط کریں، جیسا کہ 'ایک مہینے کے بعد اسے فروخت کریں'، کیونکہ یہ ملتوی ہے، کنڈیشننگ نہیں۔ الغزالی نے بیان کیا ہے کہ عراقیوں نے کہا کہ 'میں نے تمہیں ابھی مقرر کیا ہے، لیکن اس وقت تک عمل نہ کرو جب تک کہ ایک مہینہ گزر جائے یا کوئی خاص آدمی نہ آجائے' درست ہے، کیونکہ یہ تاخیر ہے، اور ایجنٹ کو اس کی تعمیل کرنی چاہیے۔ متواتر فارمولہ: پرنسپل کہتا ہے کہ 'میں نے آپ کو اس پراپرٹی کو فروخت کرنے کے لیے مقرر کیا ہے، اور جب بھی میں آپ کو ہٹاتا ہوں، آپ دوبارہ میرے ایجنٹ ہیں'، لہذا جب بھی وہ ایجنٹ کو ہٹاتا ہے، ایجنسی اپنے آپ کی تجدید کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17729} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17730} حنفیہ اور صحیح حنبلی اس کو صحیح سمجھتے ہیں، اس بنیاد پر کہ ایجنسی کنڈیشننگ کو تسلیم کرتی ہے۔ حنفیوں کے لیے اصولی کسی بھی وقت اپنے ایجنٹ کو ہٹا سکتا ہے، اور حنبلیوں کے لیے ہٹانے کا اثر ان کے الفاظ 'میں نے تمہیں ہٹایا، اور جب بھی میں نے تمہیں مقرر کیا ہے، میں نے تمہیں ہٹا دیا ہے'۔ ابن تیمیہ نے اسے باطل قرار دیا ہے، کیونکہ یہ جائز معاہدہ کو پابند بناتا ہے۔ مشروط کا مقصد تقرری کو روکنا ہے، کسی معاہدے کو موجود ہونے سے پہلے اسے تحلیل کرنا نہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17730} اس کے صحیح ہونے کے بارے میں شافعیہ کے دو قول ہیں۔ آواز دینے والا یہ ہے کہ یہ درست ہے، کیونکہ اجازت موجود ہے۔ اگر وہ ایجنٹ کو ہٹاتا ہے، اور ایجنٹ نہیں جانتا تھا، یا جانتا تھا، اس بارے میں دو آراء ہیں کہ آیا ایجنسی ہٹانے کے بعد واپس آتی ہے۔ آواز دینے والا یہ ہے کہ ایسا نہیں ہے۔ اگر الفاظ 'جب بھی میں آپ کو ہٹاتا ہوں' ہوں، ایجنسی ایک بار واپس آجاتی ہے۔ اگر وہ 'جب بھی میں آپ کو ہٹاتا ہوں' ہیں، تو یہ ہر بار واپس آجاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17730} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17731} مستقبل کے وقت سے منسلک فارمولہ، جیسا کہ 'میں نے تمہیں رمضان میں اپنے جانور بیچنے کے لیے مقرر کیا ہے'، یا 'میں نے یہ گھر تمہیں کل فروخت کرنے کے لیے مقرر کیا ہے'۔ حنفیہ اور حنبلی اسے درست سمجھتے ہیں، کیونکہ ایجنسی مستقبل سے منسلک ہونے کا اعتراف کرتی ہے۔ احناف کہتے ہیں کہ ایجنٹ کل سے ایجنٹ بن جاتا ہے پہلے نہیں۔ شافعی اس بات پر متفق ہیں کہ یہ درست ہے، کیونکہ ایجنسی ابھی ختم ہو چکی ہے اور صرف فعل مستقبل کے وقت سے منسلک ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17731} فارمولہ ایک وقت کے ساتھ مشروط ہے، جیسا کہ 'جب نیا مہینہ آئے گا، میں نے آپ کو اپنا مکان بیچنے کے لیے مقرر کیا ہے': شافعی کے نزدیک یہ باطل ہے، کیونکہ کسی ایجنسی کو شرائط سے مشروط کرنا ناجائز ہے۔ حنفیہ، حنبلی اور مخالف شافعی اسے صحیح سمجھتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17731} احناف ملحقہ ⁦(اعداف)⁩ کو کنڈیشنگ ⁦(تعلیق)⁩ سے الگ کرتے ہیں۔ منسلک فارمولہ ایک ایسا سبب ہے جو معاہدہ کو ابھی ختم کرتا ہے جبکہ اس کا اثر وقت تک موخر کر دیا جاتا ہے۔ ایک مشروط فارمولہ اب اثر کا سبب نہیں ہو سکتا، لہذا جب تک شرط پوری نہ ہو جائے ایجنسی کو نتیجہ نہیں نکالا جاتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17731} محدود وقت کا فارمولا، جیسا کہ 'تم ایک مہینے کے لیے میرے ایجنٹ ہو'، فقہاء کے نزدیک درست ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17732} ان میں اختلاف ہے کہ آیا یہ مدت باقی ہے۔ شافعیوں کا خیال ہے کہ یہ مدت باقی نہیں رہتی۔ احناف نے ایک کے بارے میں دو قول بیان کیے ہیں جس سے کہا گیا تھا کہ 'میرا گھر آج بیچ دو' اور کل کر دیا: صحیح قول یہ ہے کہ ایجنسی اس دن زندہ نہیں رہتی لیکن بعض احناف کے نزدیک اس دن کا نام رکھنا جلد بازی کے لیے ہے، ایجنسی کو اس دن تک محدود کرنے کے لیے نہیں۔ منحت الخالق کے مصنف کے حوالے سے البزازیہ کا کہنا ہے کہ دس دن کا ادارہ جب دس دن گزر جائے تو ختم نہیں ہوتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17732} ایجنسی سے منسلک شرائط۔ اگر شرط باطل ہے تو احناف، احمد اپنی دونوں روایتوں کے ظاہر میں اور ابن ابی لیلیٰ کا موقف ہے کہ ادارہ کسی باطل شرط سے باطل نہیں ہوتا۔ شافعیوں کا خیال ہے کہ ناجائز شرط اسے باطل کر دیتی ہے، جیسا کہ جب پرنسپل کہتا ہے کہ خریدار کو سامان لینے سے روکے، کیونکہ حق دار کو قبضے سے روکنا حرام ہے۔ فروخت خود اجازت کے ذریعہ درست ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17732} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17733} الزرقاشی کہتے ہیں کہ جائز معاہدوں ⁦(شراکت، ایجنسی اور مضاربہ)⁩ کو روکا نہیں جاتا ہے جب کہ وہ اپنی اجازت سے نافذ العمل ہوتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17733} باطل ہونے کا اثر یہ ہے کہ ایک مقررہ فیس ختم ہو جائے اور رواجی فیس واجب الادا ہو جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17733} بعض حنبلیوں کا خیال ہے کہ ایجنسی باطل ہے، امانت کی طرح، کیونکہ امانت جاتی ہے۔ اور ابو محمد شافعیوں میں سے کہتے ہیں کہ اجازت ایجنسی سے الگ نہیں ہے، اس لیے اس کے باطل ہونے کا مطلب ہے کہ اجازت باطل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17733} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17734} ایجنسی کے معاہدے کی نوعیت، چاہے وہ پابند ہو یا اجازت دینے والا۔ حنفیہ، شافعی، حنبلی اور بعض مالکیوں کا پہلا قول یہ ہے کہ یہ دونوں طرف جائز ہے، کیونکہ یہ تحفہ ہے اور تحفہ واجب نہیں ہے: پرنسپل دیکھ سکتا ہے کہ اس معاملے کو چھوڑنا بہتر ہے یا کسی اور کو مقرر کرنا، اور عامل آزاد نہیں ہو سکتا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17734} حنفیہ اور مالکیہ سوائے اس کے کہ جہاں فریق ثالث کا حق ایجنسی کے ساتھ منسلک ہوتا ہے، جو پھر پابند ہوتا ہے، جیسا کہ دعویدار کی درخواست پر مقرر کردہ سوٹ میں ایک ایجنٹ کے ساتھ، یا گروی رکھنے والے کی موجودگی میں ایک گروی کو بیچنے کے لیے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17734} احناف کہتے ہیں کہ اس کی غیر پابند فطرت سے تین اصول ہیں: شرط کا اختیار اس میں داخل نہیں ہے۔ ایجنسی ایک پرنسپل دعوی کے طور پر درست نہیں ہے؛ اور ایجنٹ جب چاہے استعفیٰ دے سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17734} دوسرا قول: اگر ایجنسی کرایہ کی شکل میں فیس کے لیے ہے، تو یہ دونوں فریقوں کو پابند کرتی ہے اور کرایہ کی شرائط کو پورا کرنا ضروری ہے۔ شافعی اور ایک نظر میں مالکیہ ایسا کہتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17734} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17735} تیسرا قول، بعد میں آنے والے کچھ مالکیوں کا، یہ ہے کہ یہ ایجنٹ کے فریق کو بغیر فیس کے پابند کرتا ہے، اگرچہ ایک بار ملنے والے تحفے کے ساتھ مشابہت نہیں رکھتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17735} اگر ایجنسی اجر ⁦(جوالا)⁩ کے ذریعہ ہے، تو مالکیوں کے تین نظریات ہیں: دونوں طرف پابند؛ دونوں طرف سے جائز ہے، جس پر شافعیوں کا خیال ہے؛ اور دوسرے کے کام شروع کرنے کے بعد ثواب کی پیشکش کرنے والے کی طرف پابند۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17735} دوسرا ستون، دو فریق، پرنسپل اور ایجنٹ۔ سب سے پہلے، پرنسپل: وہ جو اپنی جگہ کسی دوسرے کو جائز معلوم تصرف میں رکھتا ہے، جس کے پاس اس تصرف کا اختیار ہونا چاہیے اور اس کے قوانین کا پابند ہونا چاہیے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17735} فقہاء اس بات پر متفق ہیں کہ ایجنسی کسی دیوانے، بے ہودہ، بے ہوشی کا شکار شخص، سونے والا، یا ایسا نابالغ جو کسی بھی تصرف میں نہیں سمجھ سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17735} ایک سمجھدار نابالغ کو ان کاموں کے لیے مقرر کیا جا سکتا ہے جو اس کے لیے خالصتاً فائدہ مند ہوں۔ فائدے اور نقصان کے درمیان حنفیہ، مالکی اور حنبلی اس کی اجازت ولی کی اجازت سے دیتے ہیں، جبکہ شافعی اسے باطل کرتے ہیں۔ فقہ الموسوعۃ النور v3 صفحہ 17736} جو فضول خرچی روکے ہوئے ہو اسے اس کام میں مقرر نہیں کیا جا سکتا جو وہ آزادانہ طور پر نہیں کر سکتا، بلکہ اس میں ہو سکتا ہے جو وہ کر سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17736} جمہور فقہاء نے عورت کو نکاح میں مقرر کرنے کی اجازت نہیں دی، کیونکہ وہ خود سے شادی نہیں کرتی اور اس لیے اس کا ایجنٹ نہیں ہو سکتی۔ احناف اس کی اجازت دیتے ہیں اور مالکی بعض صورتوں میں اس کی اجازت دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص17736} مرتد کی تقرری کے بارے میں تین آراء ہیں۔ پہلا، جو کہ جمہور کے نزدیک ہے ⁦(صحیح شافعی، حنبلی اور ابو حنیفہ)⁩، یہ ہے کہ اس کے اسلام میں واپس آنے پر اسے معطل کر دیا جاتا ہے: اگر وہ واپس آجائے تو ادارہ نافذ ہو جائے گا، اور اگر وہ مر جائے، قتل ہو جائے یا دشمن کے ساتھ مرتد ہو جائے، تو یہ باطل ہے۔ دوسرا جسے ابوحنیفہ کے دو اصحاب اور ایک شافعی کا نظریہ ہے، یہ صحیح اور پابند ہے۔ احناف کہتے ہیں کہ مرتد عورت کو ان کے معاہدے کے مطابق مقرر کیا جا سکتا ہے، کیونکہ اس کے اعمال نافذ ہوتے ہیں۔ تیسرا، شافعی کا قول جس کو زکریا الانصاری اور الشبرملیسی نے صحیح قرار دیا ہے، یہ باطل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17736} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17737} کسی مسلمان پر شراب یا خنزیر کا گوشت بیچنے کے لیے ذمی کا تقرر: شافعی، مالکیہ، حنبلی، اس لیے کہ اس کو دو شرطوں میں قرار دیا گیا ہے۔ پرنسپل خود اس ایکٹ کا مالک ہے جسے وہ پیش کرتا ہے، اور ایک مسلمان شراب یا سور کا گوشت نہیں بیچ سکتا۔ جو کمی ہے وہ نہیں دے سکتا۔ ابوحنیفہ اسے صحیح قرار دیتے ہیں، کیونکہ یہ کافی ہے کہ پرنسپل کے پاس عمل کرنے کی صلاحیت ہے جو اسے دوسرے کو مقرر کرنے کا حق دیتی ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17737} کسی حاجی ⁦(محرم)⁩ پر کسی غیر حاجی کو عقد نکاح کے لیے مقرر کرنا: جمہور اس کی اجازت نہیں دیتے، کیونکہ حاجی اپنے حج کے دوران عقد نہیں کرتا؛ احناف ہر حال میں اس کی اجازت دیتے ہیں، کیونکہ وہ خود معاہدہ کر سکتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17737} حنبلی کہتے ہیں کہ اگر ایجنٹ اپنے پرنسپل کو نہ جانتا ہو، جیسا کہ جب اسے کہا جاتا ہے کہ 'زید نے تمہیں مقرر کیا ہے' بغیر کسی نام یا اس کی شناخت کے بیان کے۔ {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17737} ایجنٹ کے پاس وہی عقلمندی ہونی چاہیے جو پرنسپل کی ہوتی ہے، لہٰذا ایک پاگل، نادان یا نابالغ جو سمجھ نہ سکتا ہو، معاہدے کے مطابق ایجنٹ نہیں ہو سکتا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17737} بلوغت پر شرط کے طور پر: حنفیہ اور حنبلی سمجھدار نابالغ کو اجازت دیتے ہیں جو معاہدہ کو سمجھتا ہو اور اس کا ایجنٹ بننے کا ارادہ رکھتا ہو، اور عقد کے حقوق پرنسپل کو واپس جائیں، نہ کہ اسے۔ ان کے شواہد میں یہ رپورٹ بھی شامل ہے کہ نبی نے ام سلمہ سے عمرو بن ام سلمہ سے شادی کی تھی جو کہ لڑکا تھا۔ شافعی اس سے منع کرتے ہیں، کیونکہ نابالغ جوابدہ نہیں ہے اور اپنے حق میں تصرف نہیں کر سکتا، اس لیے وہ کسی دوسرے کے حق میں تصرف نہیں کر سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17738} ایجنٹ کا نام ہونا چاہیے: اگر کوئی کہے کہ 'میں نے اس سامان کو بیچنے کے لیے لوگوں میں سے ایک کو مقرر کیا ہے'، تو ایجنسی باطل ہے، کیونکہ ایجنٹ نامعلوم ہے۔ ابن نجیم کہتے ہیں کہ قرض خواہ کا اپنے مقروض سے یہ قول کہ 'جو شخص آپ کے پاس کوئی نشانی لے کر آئے اور آپ کی انگلی لے یا آپ کو فلاں فلاں کہے تو میرا قرض ادا کر دے'، ایک نامعلوم ادارہ ہے جو قرض دار کو ادا کرنے کی صورت میں قرض ادا نہیں کرتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17739} ایجنسی کا علم۔ احناف کے لیے ایجنسی کا علم شرط ہے، خواہ ایجنٹ کے ذریعہ یا اس کے ساتھ معاملہ کرنے والے فریق کے ذریعہ۔ اگر ایجنٹ اپنے علم اور خریدار کے علم ہونے سے پہلے فروخت کرتا ہے تو فروخت اس وقت تک درست نہیں ہے جب تک کہ پرنسپل یا ایجنٹ علم کے بعد اس کی توثیق نہ کرے۔ اگر کوئی قابل اعتماد آدمی ایجنٹ کو مطلع کرتا ہے، اور ایجنٹ قبول کرتا ہے، تو وہ ایجنٹ ہے۔ اگر کوئی قابل بھروسہ نہ ہو اسے اطلاع دے اور وہ مان لے تو وہ ایجنٹ ہے۔ اگر وہ نہ مانے تو ابو حنیفہ کے نزدیک وہ ایجنٹ نہیں ہے جبکہ ابو یوسف اور محمد کے نزدیک وہ ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17740} حنبلی علم کی ضرورت نہیں رکھتے، کیونکہ معاہدوں کا معاملہ اصل میں ہے۔ شافعی کا قول متفق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17740} عام طور پر ایجنٹ میں انصاف کی ضرورت نہیں ہے، سوائے شادی جیسے بعض معاہدوں کے۔ اور نہ ہی مردانہ جنس ہے، سوائے شادی جیسے کچھ معاہدوں کے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17740} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17741} ایجنسی کا مقصد یہ ہے کہ پرنسپل ایجنٹ کو ملکیت میں یا سرپرستی میں اجازت دیتا ہے۔ شافعی نے تین شرطیں رکھی ہیں: بعض لحاظ سے معلوم ہونا ضروری ہے۔ یہ deputising کو تسلیم کرنا ضروری ہے؛ اور ایجنسی کے وقت پرنسپل کو اس کا مالک ہونا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17740} ایجنسی خاص ہے، جہاں یہ ایک نامزد تصرف سے متعلق ہے اور ایجنٹ صرف معاہدے کے ذریعے اس میں کام کر سکتا ہے۔ یا جنرل. {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17741} عمومی ایجنسی پر احناف اور مالکیہ اس کی تفصیل کے ساتھ اجازت دیتے ہیں۔ حنفیہ کہتے ہیں کہ تم ہر چھوٹے بڑے معاملے میں میرے کارندے ہو، صرف رکھنے کا اختیار دیتے ہیں۔ 'آپ ہر معاملے میں میرے ایجنٹ ہیں آپ کے آرڈر کی اجازت' ایجنٹ کو تمام رقم کے معاملات، جیسے فروخت، خریداری، تحفہ اور خیرات کے لیے اہل بناتا ہے۔ ان کا طلاق، آزادی اور وقف کے بارے میں اختلاف ہے، اور یہ نظریہ ہے کہ عامل کے پاس وہ نہیں ہے، جسے البزازیہ کا مصنف بھی رکھتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} مالکیوں کا کہنا ہے کہ 'میں نے آپ کو مقرر کیا ہے' کے ننگے الفاظ سے کوئی عام ادارہ ختم نہیں ہوتا۔ اسے 'ایک ڈیلیگیٹڈ ایجنسی' یا 'میرے تمام معاملات میں' جیسے الفاظ میں تفویض کیا جانا چاہیے۔ جائیداد میں اضافہ کرنے کی اجازت ہے؛ اگلی زندگی کے انعام کے لیے تحفے، رہائی اور خیرات نہیں ہیں، جب تک کہ پرنسپل ان کی اجازت الفاظ میں نہ دیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17742} شافعی اور حنبلی خطرے کی وجہ سے ایک عمومی ایجنسی کو باطل قرار دیتے ہیں۔ 'میں نے آپ کو اپنے تمام چھوٹے بڑے معاملات میں مقرر کیا ہے' یا 'میں نے آپ کو ہر چیز سونپ دی ہے' اس لیے باطل ہے، جب کہ 'میں نے آپ کو اپنا مال بیچنے اور اپنے قرضوں کی وصولی کے لیے مقرر کیا ہے' جائز ہے اگرچہ مال اور قرض نامعلوم ہوں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17742} کسی ایجنسی کا کیا مقصد ہو سکتا ہے اس کا عمومی اصول یہ ہے کہ جو بھی معاہدہ کوئی شخص خود کرے، وہ کسی دوسرے کو مقرر کر سکتا ہے، کیونکہ ایک شخص بعض حالات میں خود عمل کرنے سے قاصر ہو سکتا ہے اور اس لیے کسی دوسرے کو مقرر کرنے کی ضرورت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17742} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17743} فقہاء اس بات پر متفق ہیں کہ خرید و فروخت میں ایجنسی جائز ہے، کیونکہ اس کی ضرورت ہے۔ خود نبی نے عروہ الباریقی کو بھیڑ خریدنے کے لیے مقرر کیا اور ایک دینار حکیم بن حزام کو قربانی خریدنے کے لیے دیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17743} وہ اس بات پر بھی متفق ہیں کہ ایجنسی قرض کی تفویض ⁦(حوالہ)⁩، بیع، ضامن، شراکت، جمع، مضاربہ، انعامی معاہدے ⁦(جوالا)⁩، آبپاشی شراکت ⁦(موسیقہ)⁩، کرایہ، قرض، قرض، وصیت کے تبادلے میں درست ہے۔ ⁦(اقلا)⁩ اور پری ایمپشن، چونکہ یہ سب ایک ایجنٹ کی ضرورت میں فروخت کی طرح ہیں۔ اسی طرح ضمانت، تصفیہ اور تحفہ۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17743} فقہاء اس بات پر متفق ہیں کہ کوئی شخص عقد نکاح میں ایک ایجنٹ مقرر کر سکتا ہے، رسول اللہ نے عمرو بن امیہ اور ابو رافع کی تقرری کا حوالہ دیتے ہوئے اس کے لیے نکاح قبول کیا تھا۔ اس کی ضرورت، کیونکہ آدمی دور دراز سے شادی کرنا چاہتا ہے اور وہاں سفر نہیں کرسکتا۔ اور ام حبیبہ سے نبی کا نکاح اس وقت ہوا جب وہ حبشہ کی سرزمین میں تھیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17744} وہ اس بات پر متفق ہیں کہ ایجنسی مالی عبادات جیسے زکوٰۃ، صدقہ، نذر اور کفارہ میں درست ہے، چونکہ نبی نے صدقہ جمع کرنے اور تقسیم کرنے کے لیے اپنے ایجنٹ بھیجے تھے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17744} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17745} وہ اس بات پر بھی متفق ہیں کہ طلاق، فسخ اور خلع میں ایجینسی جائز ہے، کیونکہ ضرورت نکاح کی ضرورت کی طرح ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17744} ایسے اعمال جن کا ایجنسی معاہدے کے ذریعہ احاطہ نہیں کرسکتی ہے۔ گواہی: ایجنسی اس میں درست نہیں ہے، کیونکہ یہ خود گواہ پر منحصر ہے، جو اس نے جو کچھ دیکھا یا سنا اسے رپورٹ کرتا ہے، اور کیونکہ یہ عقیدت اور یقین پر منحصر ہے؛ اگر ایک گواہ دوسرے کو گواہی دینے کے لیے مقرر کرتا ہے، تو دوسرا پہلے گواہ کی گواہی پر بطور گواہ کام کرتا ہے نہ کہ ایجنٹ کے طور پر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17744} قسمیں اور نذریں، کیونکہ وہ قسم کھانے والے یا قسم کھانے والے پر منحصر ہیں۔ اسی طرح باہمی لعنت کی قسمیں، ازواج سے پرہیز کی قسم اور تعارض کی قسمیں کھاتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17745} گناہ، جیسے قتل، چوری، غصب اور بہتان، جو حرام ہیں اور پرنسپل یا ایجنٹ کے ذریعہ نہیں کیے جاسکتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17745} اور خالص جسمانی عبادات جیسے نماز، روزہ اور معمولی نجاست سے پاک ہونا، کیونکہ ان کا انحصار واجب الادا کے جسم پر ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17745} وہ امور جن میں فقہاء کا اختلاف ہے۔ حج: کسی شخص کے لیے ایجنسی کی اجازت نہیں ہے کہ وہ اسے خود کر سکے۔ نااہل شخص کا مقدمہ کہیں اور ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17745} کم عمرہ ⁦(عمرہ)⁩ عام طور پر ایجنسی کے ذریعہ کسی دوسرے کی طرف سے کیا جاسکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17745} عورت سے نکاح: اکثر فقہاء نے عورت کو نکاح میں مقرر کرنے یا مقرر کرنے سے منع کیا ہے، کیونکہ وہ خود اس کا عقد نہیں کر سکتی۔ احناف اس کی اجازت مفت بالغ عاقل عورت کے لیے کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص17746} ظہار: جمہور اس میں ایجنسی کو حرام قرار دیتا ہے، شافعی کا قول اسے منع کرتا ہے، اور شافعی کا قول اس کی اجازت دیتا ہے۔ مالکیوں میں سے ابن عبدالسلام کا خیال ہے کہ ظہار طلاق کی طرح ہے کیونکہ دونوں محض قول ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص17746} جائز کاموں کا تحفظ، جیسے مردہ زمین کو زندہ کرنا، پانی نکالنا، شکار کرنا، گھاس اکٹھا کرنا یا کان کھودنا: مالکیہ، شافعی کا قول اور حنبلی اس کی اجازت دیتے ہیں، کیونکہ ملکیت کسی شخص کی طرف سے نہیں آتی۔ احناف، بعض شافعی اور بعض حنبلی اس سے منع کرتے ہیں، کیونکہ ملکیت کا سبب، پکڑنا عامل کے لیے واقع ہوا ہے اور ارادہ اسے رد نہیں کر سکتا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17746} حقوق کا اقرار: حنفیہ، مالکیہ، حنبلی اور غیر صریح شافعی اس کی اجازت دیتے ہیں، کیونکہ یہ الفاظ کے ذریعے فرض میں حق قائم کرتا ہے، جیسا کہ فروخت ہوتا ہے۔ شافعی کا قول اور الطحاوی اس سے منع کرتے ہیں، کیونکہ یہ گواہی کی طرح حق کے بارے میں ایک خبر ہے۔ قانونی چارہ جوئی: مالکیہ، شافعی، حنبلی اور ابو حنیفہ کے دو اصحاب قرض، مخصوص جائیداد اور تمام حقوق کے لیے قانونی چارہ جوئی کی اجازت دیتے ہیں، خواہ پرنسپل موجود ہو یا غائب، بیمار ہو یا ٹھیک نہ ہو، اور خواہ رضامند ہو۔ مالکیوں نے ایسے ایجنٹ کو خارج کر دیا جو مخالف سے دشمنی رکھتا ہو۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17747} وہ صحابہ کے اجماع کا حوالہ دیتے ہیں، جیسا کہ 'علی نے عاقل کو ابوبکر سے پہلے مقرر کیا اور کہا 'جو اس کے حق میں فیصلہ کیا جائے وہ میرا ہے اور جو اس کے خلاف فیصلہ کیا جائے وہ میرا ہے'۔ اور اس کی ضرورت. {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17747} ابو حنیفہ کے نزدیک ایجنسی کی طرف سے قانونی چارہ جوئی صرف مخالف کی رضامندی سے ہی درست ہے، الا یہ کہ پرنسپل بیمار ہو یا تین دن یا اس سے زیادہ سفر سے غائب ہو، کیونکہ پرنسپل کی عدالت میں حاضری مخالف کا حق ہے۔ اس کی وجہ یہ ہے کہ دعویٰ ایک رپورٹ ہے جو صحیح یا غلط ہو سکتی ہے، اس لیے اس کا جواب صرف ضرورت کے مطابق مطلوب ہے۔ یہ ضرورت اس وقت پیدا ہوتی ہے جب پرنسپل بیمار ہو یا سفر کر رہا ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17748} الجصاص بیان کرتا ہے کہ ظاہری نظریہ مرد اور عورت، یا کنواری اور شادی شدہ عورت میں کوئی فرق نہیں کرتا۔ بعد میں حنفیوں نے ایک الگ تھلگ عورت کی ایجنسی کو منظور کیا جو عوام میں ظاہر نہیں ہوتی ہے۔ ابن ابی لیلیٰ نے اسے صرف کنواری کے لیے جائز قرار دیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17748} انتقام ⁦(قصاص)⁩ کا ثبوت اور عمل۔ مالکیہ، شافعی، حنبلی، ابو حنیفہ اور محمد الشیبانی قصاص کو ثابت کرنے میں ایجنسی کی اجازت دیتے ہیں، چاہے اصل موجود ہو یا غائب، چونکہ قصاص ایک انسانی حق ہے۔ ابو یوسف اس کی اجازت نہیں دیتے، اور ثبوت صرف پرنسپل سے قبول کیا جاتا ہے، اس شک کی وجہ سے کہ انتقامی کارروائی اور حدود سے بچنا ضروری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17748} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17749} قصاص کے متعلق: مالکیہ، شافعیہ اور حنبلیوں کا مسلک اس کی اجازت دیتا ہے خواہ وہ موجود ہوں یا ابلیس۔ حنفیہ، بعض شافعی اور بعض حنبلی اس کی اجازت صرف اس وقت دیتے ہیں جب پرنسپل موجود ہو، کیونکہ وہ اس کی غیر موجودگی میں معاف کر سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17749} حدود کا ثبوت اور عمل۔ شافعی اور حنبلی دونوں میں فرق کرتے ہیں۔ حنبلیوں کا مکتبہ نظریہ انیس کی کہانی سے زنا ثابت کرنے کی ایجنسی کو اجازت دیتا ہے۔ ان میں سے ابو الخطاب کہتے ہیں کہ یہ باطل ہے۔ شافعی حدث الٰہی کے علاوہ خدا کی حد کو ثابت کرنے میں کسی کام کی اجازت نہیں دیتے کیونکہ حق خدا کا ہے اور اسے ٹالنے کا حکم ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17749} پھانسی پر، مالکیہ، شافعی اور حنبلی ایجنسی کی اجازت دیتے ہیں، رسول اللہ کے معاذ کو سنگسار کرنے کا حکم دیتے ہیں اور حضرت عثمان کے علی کو ولید میں شراب پینے پر کوڑے مارنے کا حکم دیتے ہیں۔ حنفیہ کہتے ہیں کہ خدا کے حقوق کی دو قسمیں ہیں: ثبوت، جس میں ہد کے لیے ایجنسی جائز نہیں ہے جس کے لیے کوئی قانونی چارہ جوئی کی ضرورت نہیں ہے، مثلاً زنا اور شراب پینا، اور ان کے لیے جائز ہے، جیسے چوری اور غیبت، لیکن ابوحنیفہ، ابوحنیفہ کے نزدیک۔ اور غیبت اور چوری اس وقت درست ہے جب زخمی فریق موجود ہو، اور اگر وہ غیر حاضر ہو تو حنفی شیوخ کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17750} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17751} ایجنسی کے قواعد۔ وہ ایجنٹ کو پابند کرتے ہیں کہ پرنسپل کی طرف سے اجازت دی گئی حدود کے اندر یا اس قانون یا کسٹم کے ذریعے نافذ کیا جائے، پرنسپل کو ضروری معلومات سے آگاہ کرے اور اکاؤنٹ پیش کرے، اور جو پرنسپل کا ہے اسے واپس کرے جو اس کے ہاتھ میں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17751} ایک خصوصی ایجنسی کو غیر محدود یا محدود کیا جا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17751} اس کی شکلوں میں ایجنسی برائے فروخت ہے۔ ابو حنیفہ کے لیے، غیر محدود فروخت کرنے والا ایجنٹ کسی پابندی کا پابند نہیں ہے جب تک کہ اس پر شبہ نہ ہو۔ وہ تھوڑا یا زیادہ، نقد یا ادھار پر، اور سامان کے لیے فروخت کر سکتا ہے، کیونکہ غیر محدود لفظ اپنے غیر محدود معنی کو برقرار رکھتا ہے، اور زیادہ منافع بخش چیز خریدنے کے لیے مجموعی طور پر کم قیمت پر فروخت کرنا بھی رواج ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17751} فروخت میں غیر محدود ایجنسی۔ فقہا کا اس پر ممانعت ہے یا نہیں، دو قول پر اختلاف ہے۔ پہلا، ابو حنیفہ کا، یہ ہے کہ غیر محدود فروخت کرنے والا ایجنٹ کسی پابندی کا پابند نہیں ہے جب تک کہ اس پر شبہ نہ ہو۔ وہ تھوڑی یا زیادہ قیمت پر، نقد یا ادھار پر، اور سامان کے لیے فروخت کر سکتا ہے، کیونکہ غیر محدود لفظ اپنے غیر محدود معنی کو برقرار رکھتا ہے، اور زیادہ منافع بخش چیز خریدنے کے لیے مجموعی طور پر کم قیمت پر فروخت کا رواج ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17752} دوسرا، اکثریت ⁦(مالک، شافعی اور حنبلی)⁩ یہ ہے کہ غیر ممنوع ایجنٹ کو کئی حدود سے محدود کیا جاتا ہے۔ وہ صرف شہر کی کرنسی کے لیے فروخت کر سکتا ہے، کیونکہ غیر محدود کرنسی کا مطلب مقامی کرنسی ہے۔ وہ صرف بازار کی قیمت پر ایسی اشیاء فروخت کر سکتا ہے جسے لوگ قابل ذکر کم قیمت پر نہیں بیچتے۔ اگر وہ اس سے کم فروخت کرتا ہے، تو مالکی اصل کو انتخاب دیتے ہیں، یہاں تک کہ چھوٹے نقصان کے لیے، جسے وہ نصف دسواں یا اس سے کم مقرر کرتے ہیں۔ حنبلی فروخت کو جائز قرار دیتے ہیں اور ایجنٹ کو کمی کا ذمہ دار بناتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17752} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17753} مالکیہ، حنبلی اور دونوں اصحاب کے نزدیک وہ مال کے بدلے مال میں فروخت نہیں کر سکتا۔ مالکیوں، شافعیوں اور حنبلیوں کے نزدیک وہ ادھار پر فروخت نہیں کر سکتا، حالانکہ حنبلی کٹوتی اس کی اجازت دیتی ہے۔ اور حنبلیوں کے مطابق وہ کسی فائدے کے لیے فروخت نہیں کر سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17753} اپنے آپ کو بیچنے والا ایجنٹ۔ جمہور ⁦(حنفی، شافعی، حنبلیوں کا مکتبہ فکر اور مالکی مسلک)⁩ اسے منع کرتے ہیں، کیونکہ فروخت کا رواج یہ ہے کہ آدمی دوسرے کو بیچے، اور اس میں تعصب کا شبہ ہے۔ اگر پرنسپل اجازت دے تو مالکی اور حنبلی اس کی اجازت دیتے ہیں، اور مالکی ایسے معاملات کو خارج کرتے ہیں جہاں بولیاں زیادہ چلی ہوں یا جہاں پرنسپل کی موجودگی میں فروخت ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} احمد کی ایک روایت ایجنٹ کو خریدنے کی اجازت دیتی ہے اگر وہ عوامی نیلامی میں بولی لگاتا ہے اور کوئی اور نیلامی کرتا ہے۔ القادی نے کہا کہ دوسری شرط واجب ہو سکتی ہے اور تجویز کی جا سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17754} مالکی کا قول اس کی اجازت دیتا ہے اگر وہ اپنے آپ پر احسان نہ کرے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17754} وہ ایجنٹ جس کی گواہی اس کے لیے قابل قبول نہ ہو۔ احناف کے نزدیک ایسے شخص کو قیمت سے زیادہ فروخت کرنا درست ہے۔ مجموعی کم تشخیص کی طرف سے قیمت سے نیچے یہ معاہدے کے ذریعہ غلط ہے؛ قدر میں ابو حنیفہ کی دو روایتیں ہیں۔ دونوں ساتھی ان کو قیمت پر فروخت کرنے کی اجازت دیتے ہیں، سوائے اس کے اپنے غلام یا اس غلام کے جس نے قسطوں میں آزادی خریدی ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17754} مالکیہ طے شدہ نقطہ نظر پر یہ سمجھتے ہیں کہ ایجنٹ اپنے وارڈ کو فروخت نہیں کر سکتا، خواہ وہ نابالغ ہو، فضول خرچ ہو یا غیر مجاز غلام۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17755} شافعی اجازت کے باوجود اپنے جوان بیٹے کو فروخت کرنے سے منع کرتے ہیں، اور صحیح قول اس کے بعد اور اس کی غیر وارث اولاد کو فروخت کرنے کی اجازت دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17755} مکتب کے نظریہ میں حنبلی اپنے بیٹے، اس کے باپ یا اس کے مکاتب کو فروخت کرنے سے منع کرتے ہیں ⁦(ایک غلام جس سے اس کی آزادی قسطوں میں خریدنے کا معاہدہ ہو)⁩؛ دوسرا نقطہ نظر اس کی اجازت دیتا ہے؛ فرق وہاں پیدا ہوتا ہے جہاں پرنسپل نے اجازت نہیں دی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17755} فروخت میں ممنوعہ ایجنسی۔ ایجنٹ کو ان پابندیوں کو برقرار رکھنا چاہیے جو اصول کے مطابق طے کی گئی ہیں۔ احناف کا کہنا ہے کہ اگر وہ کسی پابندی کے خلاف جاتا ہے تو فروخت پرنسپل کو پابند نہیں کرتی جب تک کہ وہ اس کی توثیق نہ کردے، جب تک کہ فرق بہتر کے لیے ہو، جو کہ معنی میں معاہدہ ہے۔ اگر اسے کہا جائے کہ 'میرا لباس ہزار درہم میں بیچ دو' اور اس سے کم میں بیچے یا درہم کے علاوہ کسی اور چیز پر فروخت کرے تو اس کی فروخت واجب نہیں ہے، خواہ مال کی قیمت زیادہ ہو۔ اگر وہ زیادہ کے لئے فروخت کرتا ہے، تو یہ پابند ہے. اگر اسے کہا جاتا ہے کہ وہ ادھار پر فروخت کرے اور نقد رقم میں فروخت کرے، تو فروخت کا پابند ہوتا ہے۔ اگر اسے کہا جاتا ہے کہ وہ نقد رقم میں فروخت کرے اور کریڈٹ پر فروخت کرے تو اسے معطل کر دیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17756} مالکیوں کا خیال ہے کہ خرید و فروخت میں قیمت سے زیادہ یا کم قیمت ادا کرنا اصل کو اختیار نہیں دیتا، کیونکہ یہ مطلوب ہے۔ صرف ایک فرق جو ایک درست مقصد کو متاثر کرتا ہے۔ شافعی اور حنبلی کہتے ہیں کہ ایجنٹ صرف وہی کام کر سکتا ہے جس میں پرنسپل کی اجازت لفظی یا رواج کے لحاظ سے ضروری ہو۔ اگر دو میں سے ایک کام پرنسپل کو نقصان پہنچاتا ہے تو وہ ایسا نہیں کر سکتا، اس قول کا حوالہ دیتے ہوئے کہ کوئی نقصان یا باہمی نقصان نہیں ہونا چاہئے؛ اگر کوئی پرنسپل کو فائدہ پہنچاتا ہے تو اسے ضرور کرنا چاہیے کیونکہ یہ مخلصانہ مشورہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17756}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17757} ایک وقت تک محدود اجازت اس سے پہلے یا بعد میں توسیع نہیں کرتی۔ ایک ایسی جگہ تک محدود ہے جس میں اس میں دلچسپی ہو، جیسے کہ بازار اپنی کرنسی یا قیمت کے لیے جانا جاتا ہے، اس جگہ تک محدود ہے، اور جہاں وہ جگہ سود میں برابر ہے، اجازت اس تک پہنچ جاتی ہے۔ جہاں خریدار کا نام ہے، ایجنٹ کسی اور کو فروخت نہیں کر سکتا، جب تک کہ اسے معلوم نہ ہو کہ پرنسپل کو اس خاص خریدار میں کوئی دلچسپی نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17757} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17758} قیمت کی شرائط کی خلاف ورزی۔ قیمت کی تفصیل کے بارے میں: اگر پرنسپل کہتا ہے کہ 'کریڈٹ پر فروخت کریں' اور ایجنٹ نقد رقم میں فروخت کرتا ہے، تو اکثریت کا خیال ہے کہ فروخت پرنسپل کو پابند کرتی ہے، کیونکہ اسے اپنا اعتراض مل جاتا ہے اور ایجنٹ نے اسے زیادہ دیا ہے۔ حنبلی کا قول اس فروخت کو باطل کر دیتا ہے جہاں پرنسپل کی التوا میں قطعی دلچسپی ہو اور شافعی اس سے منع کرتے ہیں جہاں پرنسپل کا مفاد ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} اگر اسے کہا جائے کہ وہ ایک مقررہ قیمت پر ادھار پر فروخت کرے اور اس سے کم قیمت پر نقد فروخت کرے تو حنفیہ، شافعیہ اور مالکان اس کی اجازت نہیں دیتے، اور حنبلی اس کی اجازت نہیں دیتے۔ پرنسپل کی منظوری {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17759} اگر اسے کہا جائے کہ وہ نقدی پر فروخت کرے اور ادھار پر فروخت کرے تو احناف، شافعی اور حنبلی اس کی اجازت نہیں دیتے، کیونکہ فوری ادائیگی اصل سود ہو سکتی ہے۔ مالکیوں نے اسے منظوری کے بعد معطل کر دیا۔ اگر پرنسپل نے کہا کہ اب ایک ہزار میں بیچنا ہے اور ایجنٹ نے کریڈٹ پر ایک ہزار میں فروخت کیا ہے، تو فروخت کا پابند نہیں ہے بلکہ پرنسپل کی منظوری پر روک دیا جائے گا۔ یہ کاسانی کا قول ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17760} کرنسی کی خلاف ورزی۔ اگر اس سے کہا جائے کہ وہ دینار میں بیچے اور درہم یا مال میں بیچے تو حنفیہ، شافعی اور حنبلی میں سے القادی اس کی فروخت کی اجازت نہیں دیتے، چاہے اس کی قیمت زیادہ ہی کیوں نہ ہو، کیونکہ ایک قسم کی اجازت دوسری میں جائز نہیں۔ صحیح حنبلی کا قول ہے کہ اگر اس سے کہا جائے کہ وہ ایک درہم میں بیچے اور دینار میں بیچے تو یہ صحیح ہے، کیونکہ یہ روایت ہے: جو ایک درہم قبول کرتا ہے وہ اس کے برابر دینار قبول کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17760} الکاسانی نے فروخت کو معطل کر رکھا ہے، جس میں پرنسپل منظوری اور منسوخی کے درمیان انتخاب کرے گا۔ مالکیوں کے لیے، جہاں دو کرنسیاں شہر کی کرنسی ہیں اور مساوی قدر کی ہیں، اس بارے میں دو آراء ہیں کہ آیا پرنسپل منتخب کرتا ہے یا منظور کرتا ہے۔ دوسری صورت میں وہ ایک نقطہ نظر پر انتخاب کرتا ہے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17760} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17761} اگر اسے کہا جائے کہ وہ پیسے کے عوض بیچے اور کپڑا یا دیگر سامان بیچے تو حنبلی اور مالکیہ اسے ناجائز قرار دیتے ہیں، کیونکہ مال کی قیمت نہیں ہے۔ رقم کی خلاف ورزی اگر وہ مقرر کردہ قیمت سے زیادہ قیمت پر فروخت کرتا ہے، اسی کرنسی میں، اکثریت فروخت کو درست سمجھتی ہے، کیونکہ خلاف ورزی بہتر کے لیے ہوتی ہے۔ شافعی کہتے ہیں کہ اگر پرنسپل نے صراحت کے ساتھ زیادتی سے منع کیا ہو تو اس سے انکار کیا جاتا ہے، اور شافعی کا ایک قول اسے مکمل طور پر حرام قرار دیتا ہے، کیونکہ پرنسپل کو اپنی قسم کی پاسداری میں دلچسپی ہو سکتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17761} اگر وہ مقرر کردہ قیمت سے کم میں فروخت کرتا ہے تو مالکیہ اسے پرنسپل کی منظوری پر معطل کر دیتے ہیں: پرنسپل اگر سامان باقی رہ جائے تو واپس لے سکتا ہے، یا اگر وہ گم ہو جائے تو اس کی قیمت واپس لے سکتا ہے۔ شافعی اور ایک حنبلی روایت اس کو باطل کرتی ہے، کیونکہ پرنسپل ان شرائط پر اپنی جائیداد میں حصہ لینے پر راضی نہیں تھا۔ طے شدہ حنبلی نظریہ فروخت کی توثیق کرتا ہے اور ایجنٹ کو کمی کا ذمہ دار بناتا ہے، اور حنبلی کے دو نظریات ہیں کہ کس طرح کمی کی پیمائش کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17761} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17762} جگہ کی خلاف ورزی۔ اگر وہ کسی جگہ کا نام بتاتا ہے اور ایجنٹ کسی اور جگہ فروخت کرتا ہے تو مالکیوں میں سے شافعی، حنبلی اور ابن شاس اس جگہ کو برقرار رکھنے کا تقاضا کرتے ہیں جہاں اس جگہ کا کوئی خاص مفاد ہو، جیسے کہ اچھی کرنسی یا زیادہ قیمتوں کے لیے مشہور بازار۔ بعض حنبلی اور شافعی کا قول دوسری جگہ فروخت کی اجازت دیتا ہے جہاں دونوں جگہیں سود میں برابر ہوں۔ احناف کے نزدیک اس جگہ پر رکھنا ضروری ہے، اور اگر ایجنٹ قاعدہ کو توڑتا ہے تو وہ ذمہ دار ہے۔ پرنسپل فروخت کا پابند نہیں ہے۔ مالکی منظوری کے بعد فروخت کو روک دیتے ہیں اور شافعی کا قول اس سے منع کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17762} وقت کی خلاف ورزی۔ اگر ایک وقت مقرر ہو اور ایجنٹ دوسرے وقت پر فروخت کرے تو حنفیہ، شافعی اور حنبلی اس فروخت سے منع کرتے ہیں اور اس کا اصل پابند نہیں ہے، کیونکہ وہ اپنی ضرورت کے وقت فروخت کرنا چاہتا ہے اور اس سے پہلے یا بعد میں نہیں۔ مالکیوں نے پرنسپل کو اس کی منظوری اور رد کرنے کے درمیان انتخاب کرنے کی اجازت دی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17762} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17763} نامزد خریدار کی خلاف ورزی۔ اگر پرنسپل کہے کہ 'صرف اسی کو بیچو' اور ایجنٹ کسی دوسرے کو فروخت کرتا ہے تو جمہور ⁦(حنفیہ، شافعی، حنبلی)⁩ اس سے منع کرتے ہیں، چاہے قیمت کچھ بھی ہو، کیونکہ پرنسپل کا اس خریدار میں دلچسپی ہو سکتی ہے نہ کہ دوسرے۔ شافعی اور حنبلی اس کی اجازت دیتے ہیں اگر ایجنٹ کو واضح نشانی یا الفاظ سے معلوم ہو کہ پرنسپل کو خاص طور پر اس خریدار میں کوئی دلچسپی نہیں ہے۔ مالکیوں نے پرنسپل کو منتخب کرنے دیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17763} فروخت کو تقسیم کرنا۔ اگر ایجنٹ سامان کا کچھ حصہ بیچتا ہے اور باقی چھوڑ دیتا ہے، یا کچھ حصہ بیچتا ہے اور پھر بقیہ بعد میں، قاعدہ اس بات پر منحصر ہے کہ آیا تقسیم کرنے سے پرنسپل کو نقصان ہوتا ہے۔ اگر اس سے اسے کوئی نقصان نہ پہنچے جیسا کہ دو مکانات یا دو جانور ہیں تو حنفیہ، شافعیہ اور حنبلیوں کے لیے اس کی خریدوفروخت درست ہے، اور حنبلی کہتے ہیں کہ یہ جائز ہے جب تک کہ اصول تقسیم کرنے سے منع نہ کرے۔ مالکیوں نے ایک عام اصول بیان کیا ہے کہ جب بھی ایجنٹ اپنے پرنسپل کی شرائط سے یا اپنی مرضی کے مطابق چلا جاتا ہے تو پرنسپل فروخت کی منظوری دینے اور اسے مسترد کرنے، اگر سامان باقی رہتا ہے، اور اگر وہ گم ہو جائے تو ایجنٹ کو منظور کرنے اور اسے ذمہ دار ٹھہرانے کے درمیان انتخاب کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17763} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17764} اگر تقسیم کرنے سے اسے نقصان پہنچتا ہے تو فقہاء تین آراء دیتے ہیں: شافعی اور حنبلی فروخت کو باطل کرتے ہیں۔ مالکیوں، ابو یوسف اور محمد نے اسے معطل کر دیا ہے، اور اگر ایجنٹ باقی بیچ دے تو یہ مکمل ہو جاتا ہے۔ ابوحنیفہ پرنسپل کے خلاف فروخت کو لاگو کرنے دیتا ہے، کیونکہ ایجنٹ اپنی جگہ کھڑا ہوتا ہے اور پرنسپل سامان کے کچھ حصے کا مالک ہوتا ہے جیسا کہ وہ پوری کا مالک ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17764} چیز کی قسم کی خلاف ورزی۔ اگر ایجنٹ نام کی جگہ کوئی دوسری چیز بیچتا ہے تو شافعی اور حنبلی کا قول فروخت کو باطل کرتا ہے، کیونکہ اس نے اجازت کی شرائط کو توڑا ہے۔ مالکی اور حنبلی روایت پرنسپل کو منتخب کرنے دیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17764} خریداری میں ایجنسی۔ یہ بلا روک ٹوک جاری کیا جا سکتا ہے، جیسا کہ 'میرے لیے جو چاہیں خریدیں'۔ احناف، مالکیہ اور احمد کی ایک روایت اس کی اجازت دیتے ہیں، چونکہ پرنسپل نے اپنا فیصلہ دیا ہے۔ مکتب کے نزدیک حنبلی اور شافعی اس سے منع کرتے ہیں، کیونکہ ایجنٹ وہ چیز خرید سکتا ہے جس کی وہ ادائیگی نہیں کر سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17765} وہ ایجنٹ جو اپنے اصل کے لیے اس کی اپنی جائیداد سے خریدے یا ان لوگوں سے جن کی گواہی اس کے لیے قابل قبول نہ ہو: احناف اجازت لے کر بھی خریدنا منع کرتے ہیں، کیونکہ فروخت کے حقوق ایجنٹ کو لوٹتے ہیں اور اس سے ایک شخص ادا کرنے والا اور ادا کرنے والا ہو جاتا ہے۔ وہ اجازت لے کر بھی اس کے نابالغ بیٹے سے خریدنے سے منع کرتے ہیں۔ ابوحنیفہ نے اپنے باپ، دادا، بڑے بیٹے یا بیوی سے خرید و فروخت سے منع کیا ہے۔ ابو یوسف اور محمد اس کی اجازت دیتے ہیں قیمت یا اس سے کم، یا تھوڑی زیادہ۔ اگر ایجنسی عام ہے تو احناف اس بات پر متفق ہیں کہ خریدوفروخت کی اجازت ہے، کیونکہ بار کا سبب شک ہے، جسے عام الفاظ حذف کر دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17765} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17766} مقتدر نظریہ میں مالکیہ اور مکتب کے نقطہ نظر میں حنبلی اپنی جائیداد سے خریدنا منع کرتے ہیں، اور اگر اجازت دے تو اس کی اجازت دیتے ہیں۔ مالکی اپنے رشتہ داروں سے خریدنے کی اجازت دیتے ہیں اگر کوئی شک نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17766}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17767} شافعی اپنی جائیداد سے یا اپنے نابالغ بیٹے سے ہر صورت میں خریدنے سے منع کرتے ہیں، اور صحیح خیال میں بالغوں سے خرید و فروخت کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17767} خریداری میں ممنوعہ ایجنسی۔ یہ صحیح ہے، احناف ⁦(استحسان پر)⁩، مالکیہ اور حنبلی مسلک کا اتفاق ہے، خواہ اس قسم کے سامان کا نام نہ بھی دیا گیا ہو: 'میرے لیے لباس خریدو'، نفع کی شراکت سے مشابہہ ہے۔ احناف نے نبی کے حکیم بن حزام کو قربانی خریدنے کے لیے دینار دینے کا حوالہ دیا ہے، جس سے معلوم ہوتا ہے کہ ایک چھوٹی سی غیر یقینی صورتحال ایجنسی کو نہیں روکتی، کیونکہ ایجنسی نرمی پر منحصر ہے نہ کہ فروخت کے سخت سودے پر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17767} ممنوع خریداری اور اس کی خلاف ورزیاں۔ اگر پرنسپل نے موخر شرائط پر خریداری کا حکم دیا اور ایجنٹ نے نقد رقم میں خریدا تو اکثریت ⁦(حنفیوں، مالکیوں، ایک شافعی کا نظریہ اور حنبلیوں کا مکتبہ نظریہ)⁩ خریداری کی اجازت دیتی ہے اور اگر ایجنٹ نے قیمت نہیں بڑھائی ہے تو اسے پرنسپل کو پابند کرتا ہے، کیونکہ خلاف ورزی صرف شکل میں ہے اور معنی میں متفق ہے۔ شافعی مقتدی کے نزدیک اس کی اجازت نہیں دیتے، کیونکہ اصل کا مطلب یہ ہے کہ اس پر کوئی قرض نہیں ہونا چاہیے۔ حنبلی مسلک اس سے منع کرتا ہے جہاں پرنسپل کو نقصان پہنچے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17769} اگر ایجنٹ کو نقد ادا کرنے کے لئے کہا جاتا ہے تو قرض پر خریدا جاتا ہے، حنفیہ اس ایجنٹ کو اکیلے پابند کرتے ہیں، مالکیہ اس کی خریداری پرنسپل کے ساتھ کرتے ہیں، اگر شافعی اس کا انتخاب کرتے ہیں۔ پرنسپل کی اپنی رقم، اور حنبلی منظوری پر اسے معطل کر دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17769} خریداری میں قیمت کی قسم کی خلاف ورزی۔ شافعی اور ایک حنبلی کا قول باطل ہے۔ حنبلیوں کا مکتبہ فکر دینار کے بدلے درہم کے تبادلے کی اجازت دیتا ہے اور اس کے برعکس، کیونکہ جو ایک درہم قبول کرتا ہے وہ اس کی جگہ دینار قبول کرتا ہے، لیکن دو سکوں کی جگہ سامان نہیں۔ احناف کا موقف ہے کہ اگر اسے دینار سے خریدنے کو کہا جائے اور دوسرے سامان سے خریدے تو خرید صرف ایجنٹ کو پابند کرتی ہے۔ الکرخی سے منقول نظریہ کے مطابق خریدنا اصل پر دینار کے بدلے درہم کا بھی پابند نہیں ہے۔ مالکی منظوری پر اسے معطل کر دیتے ہیں، اور اس بارے میں دو معروف آراء ہیں کہ آیا دینار کی جگہ درہم پرنسپل کو پابند کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17769}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17770} قیمت کی رقم کی خلاف ورزی۔ اگر خلاف ورزی پرنسپل کے فائدے کے لیے ہے، جیسے کہ نامزد قیمت سے کم قیمت پر جانور خریدنا، تو خریداری پرنسپل کو پابند کرتی ہے، کیونکہ خلاف ورزی صرف شکل میں ہوتی ہے۔ شافعیہ اور حنبلیوں کے علاوہ اس صورت میں جہاں پرنسپل نے کم ادائیگی سے منع کیا ہو۔ اگر خلاف ورزی پرنسپل کے نقصان میں ہے تو حنفیہ صرف ایجنٹ کو پابند کرتے ہیں۔ مالکی پرنسپل کو معمولی اضافی کے لیے پابند کرتے ہیں، جیسے کہ بیس میں سے ایک، اور اس کی منظوری پر ایک بڑی زیادتی کو معطل کر دیتے ہیں، اگر ایجنٹ اسے اپنے اوپر لے جائے تو اسے پابند کر دیتے ہیں۔ شافعی اور ایک حنبلی کا قول باطل ہے۔ حنبلیوں کا مکتبہ فکر اس کی توثیق کرتا ہے اور ایجنٹ کو زیادتی کا ذمہ دار ٹھہراتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17771} خریدی گئی چیز کی خلاف ورزی۔ اگر ایجنٹ اس کے کہے جانے کے علاوہ کوئی چیز خریدتا ہے تو احناف اس خریداری کو ایجنٹ پر ڈال دیتے ہیں اور پرنسپل کو پابند نہیں کرتے۔ مالکیوں نے پرنسپل کو منتخب کرنے دیا۔ اگر وہ اسے مسترد کرتا ہے، تو خریداری ایجنٹ پر آتی ہے، جو اپنے پیسے سے قیمت ادا کرتا ہے۔ شافعی اگر پرنسپل کے پیسے سے خریدے تو اسے باطل ہے۔ اگر وہ پرنسپل کا نام لیے بغیر اپنے کریڈٹ پر خریدتا ہے، تو یہ ایجنٹ پر آتا ہے چاہے اس نے پرنسپل کا ارادہ کیا ہو۔ حنبلی ایجنٹ کے کریڈٹ پر خریداری کی توثیق کرتے ہیں، اس پر دو آراء کے ساتھ کہ آیا یہ پرنسپل کو پابند کرتا ہے، اور پرنسپل کی رقم سے خریداری کو صوتی نقطہ نظر پر باطل قرار دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17771}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17772}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17773} شافعی نے کہا کہ اسم کو خریدنا اور قبول کرنا ہے جس کا نام خریدنا ہے) ساؤنڈر ویو میں ایجنٹ پر پڑتا ہے، جبکہ دوسرا قول معاہدہ کو کالعدم قرار دیتا ہے۔ جہاں ایجنٹ ایک ہی چیز کو پرنسپل کے حکم سے زیادہ خریدتا ہے، اسی قیمت پر، حنفیہ فرق کرتے ہیں: انفرادی طور پر قیمتی چیزوں کے لیے ⁦(قیامیت)⁩، زائد قیمت اصل کو پابند نہیں کرتی، کیونکہ ہر ایک کی قیمت معلوم نہیں ہے۔ وزن سے ناپی جانے والی چیزوں کے لیے، ابوحنیفہ، اور محمد نے بعض روایات میں، صرف حکم کی مقدار کے لیے اصول کا پابند کیا ہے۔ ابو یوسف اور محمد نے اسے اس سب کے لیے باندھ دیا۔ حنبلی اور مالکیوں کے نزدیک اصباغ کے متضاد قول میں، اگر ایجنٹ ایک دینار میں دو بھیڑیں خریدے اور ہر ایک دینار کی ہو تو پرنسپل کو پابند کریں۔ حنبلی کہتے ہیں کہ اگر ان میں سے کسی ایک کی قیمت ایک دینار ہو تو صحیح ہے اور اگر دونوں میں سے نہ ہو تو مکتب کے نزدیک باطل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17773}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17774} شافعی فرق کرتے ہیں کہ پرنسپل نے بھیڑ کو بیان کیا ہے یا نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17774} خرید کو تقسیم کرنا۔ اگر آرڈر کی گئی چیز پرنسپل کو نقصان پہنچائے بغیر اپنی مرضی کے مطابق تقسیم کی جا سکتی ہے، تو سبھی متفق ہیں کہ ایجنٹ حصہ خرید سکتا ہے، اور پرنسپل اس چیز کا پابند ہے جو اس نے خریدا ہے۔ حنبلی اور ایک شافعی کا قول اسے صرف اسی صورت تک محدود رکھتا ہے جہاں پرنسپل نے یہ نہیں کہا کہ 'یہ سب ایک سودا میں خریدو'۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17774}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17775} اگر حسب ضرورت تقسیم کو منع کرتی ہے، یا اس سے پرنسپل کو نقصان پہنچتا ہے، تو حنفیہ اور مالکیہ principal app پر خریداری کو معطل کر دیتے ہیں۔ حنفیوں کی اکثریت کا خیال ہے کہ پرنسپل کے ایجنٹ کے خلاف عدالت میں مقدمہ کرنے سے پہلے بقیہ خریدنا پرنسپل کو پابند کرتا ہے، کیونکہ جزوی خریداری حکم کی تعمیل کا ایک ذریعہ تھی۔ ظفر کا کہنا ہے کہ خریداری صرف ایجنٹ پر آتی ہے۔ اگر پرنسپل پہلے مقدمہ کرتا ہے اور جج ایجنٹ کو پابند کرتا ہے، باقی کی خریداری بعد میں حنفی معاہدے کے ذریعے ایجنٹ کو اکیلے پابند کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17775} اگر پرنسپل بیان کردہ سامان کی خریداری کا حکم دیتا ہے، تو ایجنٹ صرف ایک اچھی چیز خرید سکتا ہے، کیونکہ نا اہل فروخت کا مطلب نقائص سے آزادی ہے۔ اگر وہ عیب دار چیز خریدتا ہے تو احناف اس بات پر متفق ہیں کہ اس پر اصول کا پابند نہیں ہے جہاں تفصیل پوری نہ ہوئی ہو: مثال کے طور پر، ایک نابینا یا ایک ہاتھ والی لونڈی خریدی گئی جب اسے نوکر خریدنے کے لیے کہا گیا، یا گھوڑا خریدا گیا جب اسے سواری خریدنے کا کہا گیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17776}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17777} اگر پرنسپل نے سامان کا نام دیا، اور ایجنٹ نے اسے جانے بغیر اسے ناقص خرید لیا، تو خریداری اس کو پابند کرتی ہے کہ کون اسے واپس کر سکتا ہے۔ اگر ایجنٹ جانتا تھا، تو یہ پرنسپل کو پابند نہیں کرتا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17777} احناف کہتے ہیں کہ اگر ایجنٹ خرید لے اور اس کے ہاتھ میں ہونے کے دوران کوئی عیب پائے تو وہ اسے واپس کر سکتا ہے۔ لیکن اگر اس نے اسے پرنسپل کو دیا ہے، تو وہ اسے صرف پرنسپل کی اجازت سے واپس کر سکتا ہے، کیونکہ ایجنسی کی ترسیل ختم ہو چکی ہے۔ اگر ایجنٹ عیب کو قبول کرتا ہے، تو یہ اسے پابند کرتا ہے، اور پرنسپل اسے قبول کر سکتا ہے یا ایجنٹ کو ذمہ دار ٹھہرا سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17777} مالکیوں کا خیال ہے کہ جو ایجنٹ ناقص چیز کو جان بوجھ کر خریدتا ہے وہ اس کا پابند ہے اگر اس نے صریح خریدی ہو یا بیچنے والے کے اختیار پر۔ اگر اس نے اپنی مرضی سے خریدا ہے تو اس کا پابند نہیں ہے اور وہ اسے واپس کر سکتا ہے۔ خریداری صرف اس صورت میں اصل کو پابند کرتی ہے جب عیب معمولی ہو اور حسب روایت برداشت کیا جائے اور خرید ایک سودا ہے، جیسا کہ چھوٹی دم والا سستا جانور، اس کے برعکس کٹی ہوئی دُم والا مہذب جانور، جو اسے پابند نہیں کرتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17777}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17778} شافعی، ایجنٹ کے کریڈٹ پر خریداری کے لیے، یہ مانتے ہیں کہ اگر ناقص مال اس کی قیمت کے برابر ہے، اور خریدار کو رقم کی ادائیگی کا علم نہیں تھا۔ اگر وہ جانتا تھا، آواز دینے والا قول کہتا ہے کہ یہ پرنسپل پر نہیں آتا۔ اگر عیب اسے قیمت سے کم بناتا ہے، تو آواز والا نقطہ نظر اسے پرنسپل کو پابند کرتا ہے اگر وہ نہیں جانتا تھا، اور اگر وہ جانتا تھا تو نہیں۔ اگر اس نے پرنسپل کے اپنے پیسوں سے خریدا ہے، تو یہ پرنسپل کو پابند کرتا ہے اگر ایجنٹ کو نہیں معلوم تھا، اور اگر اس نے نہیں کیا۔ اگر پرنسپل کو واضح طور پر درستگی کی ضرورت ہے، تو الاسناوی کہتے ہیں کہ یہ پرنسپل کو پابند نہیں کرتا، کیونکہ یہ مجاز نہیں تھا۔ یا تو پرنسپل یا ایجنٹ اچھی چیز کو واپس کر سکتا ہے، اگر ایجنٹ کو عیب کا علم نہ ہو، اور جہاں پر پرنسپل نے عیب کو قبول کیا ہو وہاں ایجنٹ اسے واپس نہ کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17778} حنبلی: اگر ایجنٹ کو عیب معلوم ہو تو اس کے کریڈٹ پر خریدنا اصل کا پابند نہیں ہے۔ اگر وہ نہیں جانتا تھا، تو خریداری کی اجازت ہے اور ایجنٹ اور پرنسپل دونوں اسے واپس کر سکتے ہیں۔ عجزی نے سوال کیا کہ کیا پرنسپل کی رقم سے خریدی گئی جس میں عیب کا علم ہو، پرنسپل پر پڑتا ہے؟ اگر مال قیمت کے برابر ہو تو ظاہری نظریہ یہ ہے کہ وہ اسے قبول کرتا ہے، لیکن نہیں ہوسکتا۔ اگر پرنسپل نے کسی عیب دار چیز کا نام دیا اور ایجنٹ کو خریدنے سے پہلے معلوم ہو تو ایجنٹ اسے خرید نہیں سکتا۔ اگر وہ خریدتا ہے تو خریداری اسے پابند کرتی ہے اور پرنسپل کو صرف اس صورت میں پابند کرتی ہے جب پرنسپل قبول کرے؛ اگر اسے معلوم نہ ہو تو وہ اسے واپس کر سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17779}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17780} ایجنٹ اور ایک ناجائز معاہدہ۔ اگر پرنسپل نے ایک غلط معاہدہ کی اجازت دی ہے، تو ایجنٹ اس کی جگہ پر کوئی صحیح معاہدہ نہیں کر سکتا ہے۔ یہ شافعی، حنبلی، محمد اور زفر کا قول ہے۔ ابوحنیفہ اور ابو یوسف بذریعہ استحسن، صوتی معاہدہ کو اصول کے پابند کرنے کی اجازت دیتے ہیں جہاں یہ اس کے لیے بہتر ہے، جیسا کہ ایک ایجنٹ کو ہزار میں بیچنا ہے جو دو ہزار میں بیچتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17780}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17781} ایجنٹ اور اختیار کی شرط۔ احناف کا موقف ہے کہ اگر پرنسپل نے اپنے لیے تین دن کے اختیار کے ساتھ فروخت کا حکم دیا اور ایجنٹ نے اس کے بغیر یا اس سے کم میں فروخت کیا تو فروخت باطل ہے اور وہ غاصب کے طور پر ذمہ دار ہے۔ اگر اس سے کہا جائے کہ ایک مہینہ کا اختیار اور تین دن مقرر کیا جائے تو ابوحنیفہ استحسان کے ذریعہ اجازت دیتے ہیں لیکن ان کے دونوں اصحاب اس کی اجازت نہیں دیتے کیونکہ ان کے نزدیک مہینہ کا اختیار فروخت کے ساتھ صحیح ہے۔ شافعیوں کا خیال ہے کہ بیان کردہ اختیار پر فروخت باطل ہے اگر ایجنٹ اس کے بغیر فروخت کرے۔ حنبلی ایجنٹ کو اجازت دیتے ہیں کہ وہ اپنے لیے اور اپنے پرنسپل کے لیے ایک اختیار مقرر کرے، لیکن دوسرے فریق کے لیے نہیں، کیونکہ یہ پرنسپل کو اس بات کا پابند کرتا ہے جس سے وہ متفق نہیں تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17781}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17782} قانونی چارہ جوئی کرنے والا ایجنٹ۔ مالکیہ، شافعی، حنبلی اور زفر اس کی اجازت نہیں دیتے، کیونکہ اقرار سے جھگڑا ختم ہو جاتا ہے، جو عامل نہیں کر سکتا، اور جھگڑے کا حکم اس کے مخالف کو شامل نہیں کرتا۔ ابو حنیفہ اور محمد اس کی اجازت صرف جج کے سامنے دیتے ہیں، سوائے حدود اور انتقام کے۔ ان کی مشابہت دوسری جگہوں پر بھی اس کی اجازت دیتی ہے اور ابو یوسف ہر حال میں اس کی اجازت دیتے ہیں۔ اگر پرنسپل نے داخلہ خارج کر دیا تو داخلہ کالعدم ہو جائے گا اور ایجنٹ کو ایجنسی سے باہر لے جائے گا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17783} قانونی چارہ جوئی کے ایجنٹ کی طرف سے تصفیہ، رہائی، فروخت، تحفہ اور التوا اس کے نہیں ہیں، معاہدے کے ذریعے؛ احناف کہتے ہیں کہ وہ حق فروخت نہیں کر سکتا، نہ دے سکتا ہے اور نہ ہی ملتوی کر سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17783} جب مقروض اس سے انکار کردے تو قرض وصول کرنے والا ایجنٹ۔ حنبلی مکتب اور ایک شافعی کا قول اسے ثبوت کے لیے قانونی چارہ جوئی کا ایجنٹ بناتا ہے، کیونکہ وہ حق کو ثابت کیے بغیر جمع نہیں کرسکتا، اس لیے یہ حسب روایت اجازت ہے۔ ایجنٹ ایسا ہے کہ آیا حق ایک مخصوص چیز ہے یا قرض، اور آیا پرنسپل قرض دار کی ادائیگی کے لیے رضامندی یا اس کے انکار یا تاخیر کو جانتا ہے۔ ابو یوسف، محمد، مالکیہ، ایک حنبلی اور ایک شافعی مسلک اس کی اس طاقت کا انکار کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17783}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17784} جمع کرنے کی اجازت لفظوں میں یا رسم و رواج سے مقدمہ چلانے کی اجازت نہیں ہے، کیونکہ جو شخص جمع کرنا قبول کرتا ہے اسے قبول کرنے کی ضرورت نہیں ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17784} ابو حنیفہ کسی خاص چیز کو جمع کرنے والے ایجنٹ کو، جو خرید و فروخت کے معاملے میں پرنسپل کے جھگڑے کا فریق نہیں ہے، قرض وصول کرنے والے ایجنٹ سے، جو فریق ہے، اس لیے کہ قرض جمع کرنا ایک تبادلے کا عمل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17784}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17785} اس بارے میں کہ آیا مقدمہ کرنے والا وہ چیز جمع کر سکتا ہے جس پر اسے مقدمہ چلانے کے لیے مقرر کیا گیا تھا: شافعی، مکتب کا نظریہ، ابو حنبلی کا قول ہے، کیونکہ وہ ابو حنبلی کا قول نہیں رکھتے، پرنسپل کسی ایسے شخص کو قانونی چارہ جوئی کے لیے قبول کر سکتا ہے جسے وہ وصولی کے لیے قبول نہیں کرے گا۔ دوسرے حنفیہ اور ایک حنبلی کا قول جس پر ابن البنا کا اعتبار ہے، اس کی اجازت دیتے ہیں، کیونکہ جو شخص کسی کام کے لیے مقرر ہوتا ہے وہ اسے مکمل کرنے کے لیے مقرر کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17785} قانونی چارہ جوئی کے ایجنٹ کے ذریعہ دوسرے کی تقرری۔ اگر پرنسپل اس کی اجازت دیتا ہے، تو ایجنٹ کسی دوسرے کو مقرر کر سکتا ہے۔ اگر وہ منع کرتا ہے تو نہیں کر سکتا۔ جہاں پرنسپل کچھ نہیں کہتا، وہاں حنفیہ، مالکیہ اور حنبلیوں کا مکتبہ فکر اس سے منع کرتا ہے، کیونکہ لوگ فصاحت و بلاغت میں اختلاف رکھتے ہیں۔ مالکیہ اور حنبلی اس کو ان امور تک محدود رکھتے ہیں جو خود ایجنٹ کے لیے موزوں ہیں۔ اگر معاملہ اس کے نیچے یا اس کی مہارت سے باہر ہو تو وہ کسی اور کو مقرر کر سکتا ہے، اور مالکیوں نے یہ اضافہ کیا کہ جہاں مقدمہ زیادہ ہو وہ اس کی مدد کے لیے کسی شریک کو مقرر کر سکتا ہے، اگرچہ اس کی جگہ کوئی دوسرا نہ ہو۔ ابن قدامہ کہتے ہیں کہ جہاں ایجنسی غیر محدود ہو، اگر کام اس کی گنجائش سے کم ہو تو ایجنٹ کسی اور کو مقرر کر سکتا ہے۔ جو کام وہ خود کر سکتا ہے اس کی دو روایتیں ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17786}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17787} اگر دو فریق ایک دوسرے کے خلاف قانونی چارہ جوئی کے لیے ایک ایجنٹ مقرر کریں تو احناف تقرری کو باطل قرار دیتے ہیں۔ اگر دونوں فریق ثالث کے خلاف ایک ایجنٹ کا تقرر کرتے ہیں تو یہ درست ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17787} ایجنٹ کے ذریعہ قرض کی ادائیگی۔ اگر پرنسپل کہتا ہے کہ 'ادا کرو اور گواہ نہ لو'، اگر قرض دہندہ ادائیگی سے انکار کرتا ہے تو ایجنٹ ذمہ دار نہیں ہے۔ اگر پرنسپل گواہوں کا حکم دیتا ہے اور ایجنٹ کسی کو نہیں لیتا ہے، تو ایجنٹ ذمہ دار ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17787} اگر اس سے کہا جائے کہ وہ گواہوں کی ہدایت کے بغیر ادائیگی کرے اور وہ گواہ نہ لے تو حنفیہ، مالکیہ، شافعی اور حنبلی مسلک کے نزدیک اس کو ذمہ دار ٹھہرایا جاتا ہے، کیونکہ وہ خیال رکھنے میں ناکام رہتا ہے۔ قرض خواہ کے خلاف اس کی بات بغیر ثبوت کے قبول نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17787}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17788} اگر اس نے پرنسپل کی موجودگی میں ادائیگی کی ہو تو وہ ذمہ دار نہیں ہے، مالکیوں کی طرف سے، حنبلیوں کا مکتب کا نظریہ اور شافعی کا قول ہے؛ شافعی کا نظریہ اسے ذمہ دار ٹھہراتا ہے، کیونکہ پرنسپل کی موجودگی سے غفلت دور نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17788} قرض وصول کرنے والا ایجنٹ۔ ایک بار جب وہ جمع کر لیتا ہے، تو مقروض کو ڈسچارج کر دیا جاتا ہے، رقم پرنسپل کی ہوتی ہے اور یہ ایجنٹ کے پاس بطور امانت رکھی جاتی ہے، جو کہ ڈپازٹ کے اصولوں کا پابند ہوتا ہے۔ جمع کرنے والا ایجنٹ قرض نہیں دے سکتا، اسے موخر نہیں کر سکتا یا اسے جاری نہیں کر سکتا۔ احناف کہتے ہیں کہ وہ اس کے لیے بیعت نہیں لے سکتا لیکن ضامن لے سکتا ہے۔ مالکیوں اور حنبلیوں کا مزید کہنا ہے کہ وہ پرنسپل کی اجازت کے بغیر اس پر سمجھوتہ نہیں کر سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17788}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17789} اس شخص کو حق کی فراہمی جو مالک کے غائب ہونے کا دعویٰ کرتا ہے۔ سبھی اس بات پر متفق ہیں کہ اگر دعویدار ثبوت کے ذریعہ ایجنسی کو ثابت کرتا ہے، تو جج مقروض کو اسے ادا کرنے پر مجبور کرتا ہے۔ اگر کوئی ثبوت نہیں دیا جاتا ہے تو، مالکیوں، شافعیوں اور حنبلیوں کے مکتب کا نظریہ یہ ہے کہ مقروض دعویدار کو ادا کرنے کا پابند نہیں ہے جب تک کہ وہ ایجنسی کی تصدیق نہ کرے۔ اگر مقروض رضاکارانہ طور پر ادائیگی کرتا ہے اور قرض دہندہ ایجنسی سے انکار کرتا ہے، تو قرض دہندہ صرف ادا کنندہ سے وصولی کرسکتا ہے، اور اگر رقم اس کی غلطی یا کوتاہی کی وجہ سے ضائع ہوجاتی ہے تو ادا کنندہ ایجنٹ سے وصولی کرسکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17790} احناف قرض کو ایک خاص چیز سے الگ کرتے ہیں: اگر مقروض دعویٰ کرنے والے کی ایجنسی کی تصدیق کرتا ہے تو اسے اکیلے ادا کرنے کا حکم دیا جاتا ہے، اور اگر اسے ادا کرنے کا حکم دیا جاتا ہے تو اسے ادا کیا جاتا ہے۔ جب غیر حاضر مالک بعد میں ایجنسی کی تصدیق کرتا ہے، تو مقروض کو فارغ کر دیا جاتا ہے۔ اگر وہ اس سے انکار کرتا ہے، تو مقروض دوبارہ ادا کرتا ہے اور اگر رقم اس کے ہاتھ میں رہتی ہے تو وہ ایجنٹ سے وصول کر سکتا ہے، اور اگر اس کے ہاتھ میں گم ہو جائے تو مقروض ایجنٹ سے اس وقت تک واپس نہیں ہو سکتا جب تک کہ وہ خود کو ذمہ دار نہ بنا دے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17791} اگر مقروض ثابت کرتا ہے کہ مدعی نے ایجنسی سے انکار کیا اور اس سے رقم لی، تو ثبوت قبول کیا جاتا ہے، کیونکہ اس نے جمع کرنے کا حق حاصل کیا ہے، اس لیے کہ اس نے دعویٰ کا حق ادا کیا ہے ایجنٹ کی ہولڈ ضرورت سے ختم ہو جاتی ہے۔ اگر حق ایک مخصوص چیز ہے، جیسے کہ ڈپازٹ، اور ڈپازٹری دعویدار کی ایجنسی کی تصدیق کرتا ہے، تو اسے اس کی فراہمی کا حکم نہیں دیا جاتا ہے، کیونکہ یہ اس بات کا اقرار ہوگا کہ اس نے کسی دوسرے کی جائیداد سپرد کر دی ہے۔ ایک قرض مختلف ہے، اور اسے اسے ادا کرنے کا حکم دیا گیا ہے، کیونکہ وہ تسلیم کرتا ہے کہ رقم قرض دہندہ کی اپنی ملکیت ہے، قرضوں کو مساوی رقم سے ادا کیا جاتا ہے۔ {حوالہ:فقہ الموسوعۃ النور-v3 صفحہ 17792} اگر امانت دینے والا ایجنسی کا دعویٰ کرنے والے کو امانت دے دیتا ہے تو وہ اس کے ہاتھ میں چلا جاتا ہے اور مالک ایجنسی سے انکار کرتا ہے تو امانت دار ذمہ دار ہے۔ وہ مالک سے قسم کھا سکتا ہے، اور وہ ایجنٹ سے اس وقت تک بازیاب نہیں ہو سکتا جب تک کہ وہ اسے ڈیلیوری کے وقت ذمہ دار نہ بنائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17792} متعدد ایجنٹ۔ پرنسپل قانونی چارہ جوئی کے علاوہ کسی خاص تصرف کے لیے ایک سے زیادہ ایجنٹ مقرر کر سکتا ہے۔ اگر وہ ان کو ایک وقت میں ایک لفظ میں مقرر کرتا ہے، تو کوئی بھی اکیلے کام نہیں کر سکتا، جب تک کہ پرنسپل اس کی اجازت نہ دے۔ احناف کا خیال ہے کہ جہاں تصرف فیصلہ اور مشورہ کا مطالبہ کرتا ہے، جیسے کہ فروخت، شادی اور قرض جمع کرنا، کوئی بھی اکیلے کام نہیں کرسکتا۔ جہاں ایسا نہیں ہوتا ہے، جیسے تحفہ دینا، رقم جمع کرنا یا قرض ادا کرنا، ہر ایک اکیلے کام کرسکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17792}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.17793} فروخت کے لیے دو ایجنٹ، نکاح، خلع یا کوئی معاہدہ جس میں رقم ہو اسی طرح دونوں پر اکیلے عمل نہ کریں، چونکہ صیغہ پر رجوع کیا گیا ہے۔ قرض جمع کرنے والے دو ایجنٹ دوسرے کے بغیر ایک جمع نہیں کر سکتے ہیں، حالانکہ ان کی وصولی مکمل ہو جاتی ہے جب ایک نے جمع کیا ہوا دوسرے یا پرنسپل تک پہنچ جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17793}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17794} حنفیہ اور مالکیہ الگ الگ الفاظ کے ذریعہ مقرر کردہ دو ایجنٹوں میں سے کسی ایک کو کام کرنے کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17795} قانونی چارہ جوئی میں دو ایجنٹوں کے لیے، ہر ایک حنفیہ ⁦(زفر کے علاوہ)⁩ کے مطابق اکیلے کام کر سکتا ہے، ایک حنبلی کا قول ہے اور دوسرا شافعی کے نزدیک۔ دو آوازیں اسے الجھاتی ہیں۔ زفر، شافعی کا قول اور حنبلیوں کا مکتب نظر اس سے منع کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17795} ایک ایجنٹ دوسرے کو مقرر کرتا ہے۔ اجازت کے ساتھ، معاہدے کے ذریعہ اس کی اجازت ہے۔ ممانعت کے ساتھ، معاہدے کے ذریعہ اس کی اجازت نہیں ہے۔ جہاں پرنسپل کہتا ہے کہ 'جیسا چاہو کرو' یا 'اپنے فیصلے پر عمل کرو'، احناف، مالکیہ اور حنبلی اس کی اجازت دیتے ہیں، جبکہ شافعی اس سے منع کرتے ہیں، کیونکہ اس طرح کے الفاظ بہت سے امکانات کو تسلیم کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17796} جہاں کچھ نہیں کہا گیا، جمہور اس سے منع کرتے ہیں، کیونکہ پرنسپل ایجنٹ کے فیصلے پر انحصار کرتا ہے اور لوگ فیصلے میں اختلاف کرتے ہیں۔ کچھ دو صورتوں کی اجازت دیتے ہیں: جہاں کام ایجنٹ کے نیچے یا اس کی مہارت سے باہر ہے، اور جہاں وہ خود کر سکتا ہے لیکن یہ سب نہیں کر سکتا کیونکہ اس کا حجم بہت زیادہ ہے۔ دوسری صورت میں، حنبلیوں کا مکتب کا نظریہ اور ایک شافعی کا نظریہ اسے اجازت دیتا ہے کہ وہ سب کچھ دے سکے۔ مالکیوں اور شافعیوں کا مکتب فکر صرف اس کی استطاعت سے زیادہ کی اجازت دیتا ہے۔ احمد اور ابن ابی لیلیٰ ہر حال میں اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17796}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17797}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17798} کسی کی امانت۔ جس کو بھی ایجنٹ مقرر کرتا ہے وہ قابل اعتماد ہونا چاہیے، جب تک کہ پرنسپل نے کسی ناقابل اعتماد شخص کا نام نہ دیا ہو، اس صورت میں ایجنٹ پرنسپل کی پسند کی پیروی کرتا ہے۔ اگر ایجنٹ کا مقرر کرنے والا فاسق ہو جائے تو حنبلی اور ایک شافعی کا قول ہے کہ وہ ایجنٹ کو ہٹائے، اور شافعی کا قول ہے کہ ایجنٹ اسے ہٹا نہیں سکتا، کیونکہ اسے مقرر کرنے کی اجازت تھی لیکن ہٹانے کی نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17798} جس قسم کا ادارہ مقرر کرتا ہے۔ اگر پرنسپل کہتا ہے کہ 'میری طرف سے تقرری کریں' یا 'اس کے لیے نمائندہ'، تقرری کرنے والا پرنسپل کا ایجنٹ ہے، پہلے ایجنٹ کی برطرفی سے برخاست نہیں ہوتا، اور دونوں پرنسپل کی موت پر اپنا عہدہ کھو دیتے ہیں۔ اگر پرنسپل کہتا ہے کہ 'آپ کی طرف سے تقرری کریں'، مقرر کرنے والا پہلا ایجنٹ کا ایجنٹ ہے، اور پہلے کی برطرفی یا موت کے ساتھ آتا ہے۔ شافعی اور حنبلی پرنسپل کو سب ایجنٹ کو ہٹانے کی اجازت دیتے ہیں، کیونکہ وہ ایک شاخ کی شاخ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17799} اگر پرنسپل صرف 'مقرر' کہے تو حنفیہ، مالکیہ، شافعی کا قول اور مکتبہ دار حنبلی کا قول ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17799} بغیر کسی اجازت کے تقرر جمہور کے مطابق درست نہیں ہے۔ احمد اور ابن ابی لیلیٰ نے اسے ایک صورت میں صحیح قرار دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17799} ایجنٹ اس کے پرنسپل کی جائیداد میں سے جو کچھ اس کے ہاتھ میں ہے اس کا ٹرسٹی ہے۔ یہ ایک امانت کی طرح ہے: وہ نقصان کا ذمہ دار نہیں ہے جب تک کہ وہ حد سے تجاوز نہ کرے یا غفلت نہ کرے، چاہے وہ اجرت پر کام کرے یا رضاکار کے طور پر، کیونکہ اس کا ہاتھ پرنسپل کا ہاتھ ہے، اور ایجنسی احسان اور امداد کا معاہدہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17800} بطور ٹرسٹی اس کی بات اس کے حلف کے ساتھ ذمہ داری سے خود خارج ہونے پر قبول کی جاتی ہے کیونکہ ایجنسی نرمی اور آسانی سے کام کرنے پر منحصر ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17800}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17801} ذمہ داری یا اس کی عدم موجودگی۔ ابن قدامہ کہتے ہیں کہ جو چیز امانت ہے وہ شرط سے ذمہ داری نہیں بنتی اور جو چیز واجب ہوتی ہے وہ شرط سے ختم نہیں ہوتی۔ ایسا لگتا ہے کہ احمد کی ایک روایت شرط کے ذریعہ ذمہ داری کو ہٹانے کی اجازت دیتی ہے، لیکن پہلا نظریہ ظاہری اسکول کا نظریہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17800}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17801} زیادتی اور غفلت۔ ایجنٹ ذمہ دار ہے اگر وہ کسی حیوان کو اوور لوڈ کرتا ہے، بغیر اجازت کے لباس پہنتا ہے، یہ جانے بغیر رقم کھو دیتا ہے، پرنسپل کی رقم کو اپنے ساتھ ملاتا ہے تاکہ الگ نہ ہو سکے، بغیر عذر کے واپس کرنے سے انکار کر دے، یا عذر ختم ہونے کے بعد واپسی میں تاخیر کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17802} اگر پرنسپل نے خود قرض ادا کیا اور ایجنٹ نے بھی ادا کیا تو ایجنٹ ذمہ دار نہیں ہے اگر اسے علم نہ ہو۔ اگر وہ جانتا تھا، تو وہ ذمہ دار ہے، کیونکہ پرنسپل کی ادائیگی اس ایجنٹ کو ہٹانا تھی جس کے بارے میں ایجنٹ جانتا تھا۔ ابو حنیفہ ایجنٹ کو زکوٰۃ کی دوہری ادائیگی کا ذمہ دار ٹھہراتا ہے چاہے وہ جانتا ہو یا نہ جانتا ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17802} اگر کریڈٹ پر فروخت کرنے والا ایجنٹ قیمت جمع کرنے سے پہلے سامان فراہم کرتا ہے اور خریدار ادائیگی سے انکار کرتا ہے تو وہ سامان کی قیمت کا ذمہ دار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17803} اگر وہ بغیر عذر کے وصول شدہ قیمت کی ادائیگی میں تاخیر کرے جب تک کہ وہ ضائع نہ ہو جائے تو وہ ذمہ دار ہے۔ ایک عذر کے ساتھ، وہ نہیں ہے. {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17803} اگر وہ غلطی سے کسی جانور کو ذبح کر لے اور وہ ناجائز طور پر مر جائے تو وہ ذمہ دار ہے، کیونکہ غلطی اور نیت لوگوں کے مال میں یکساں ہے۔ اگر اس سے کہا گیا کہ جمع شدہ رقم کو پورا لیکن جمع کیا جائے تو وہ ذمہ دار ہے، اور اگر اس نے پہلا حصہ ضائع ہونے سے پہلے باقی جمع کر لیا تو ذمہ داری ختم ہو جائے گی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17803} ذمہ داری کا پیمانہ۔ فنگبل چیز کے لیے وہ اس کی طرح ادا کرتا ہے۔ انفرادی طور پر قیمتی چیز کے لیے وہ اس کی قیمت ادا کرتا ہے۔ اگر کسی فنگی چیز کو پسند نہ ہو تو وہ اس کی قیمت ادا کرتا ہے۔ قیمت گناہ یا نقصان کے دن لی جاتی ہے، کسی اور دن نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17803}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17804} حساب کا فرض۔ ایجنٹ کو پرنسپل کو وہ معلومات دینی چاہیے جو وہ اپنے کیے کے بارے میں مانگتا ہے، اور ابن حجر کہتے ہیں کہ جس بھی قابل اعتماد شخص سے حساب مانگا جائے اسے ضرور دینا چاہیے۔ کیا شمار ہوتا ہے جواب اور دعویٰ، ہاتھ کی تحریر نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17804} جو ایجنٹ کے ہاتھ میں ہے اس کی واپسی۔ اسے پرنسپل کو واپس کرنا ہوگا جو اس کے پاس ہے۔ اگر وہ بغیر عذر کے پوچھے جانے سے انکار کر دے یہاں تک کہ وہ ضائع ہو جائے تو وہ ذمہ دار ہے۔ اور اس طرح اگر کوئی عذر ختم ہو جائے اور وہ نقصان تک واپسی میں تاخیر کرے۔ اگر پرنسپل اور ایجنٹ اجرت پر راضی ہوں تو اجرت معاہدے کے مطابق واجب الادا ہے۔ اگر وہ متفق نہ ہوں تو حنفیہ فرق کرتے ہیں: ایک ایجنٹ جو اجرت کے لیے کام نہیں کرتا ہے وہ رضاکار کے طور پر کام کرتا ہے، کیونکہ ایجنسی اصل میں بلاجواز ہے۔ تجارت کا ایک ایجنٹ جس کے لوگ اجرت کے لیے کام کرتے ہیں، جیسے بروکر یا ڈیلر، روایتی اجرت واجب الادا ہے۔ مجلہ الاحکام العدلیہ کی دفعہ 1467 میں یہ بیان کیا گیا ہے۔ جب اجرت واجب ہو ایجنٹ اسے اس کے سپرد کر کے کماتا ہے، جہاں حوالے کرنا ممکن ہو، کپڑے کے طور پر وہ بُنتا ہے یا سلائی کرتا ہے۔ اگر اسے فروخت کرنے، خریدنے یا حج کرنے کے لیے مقرر کیا گیا تھا، تو وہ کام مکمل کرنے پر متفقہ اجرت حاصل کرتا ہے، چاہے قیمت ابھی جمع نہ ہوئی ہو۔ لیکن اگر پرنسپل نے یہ شرط رکھی کہ قیمت پہلے حوالے کی جائے اور ایجنٹ نے اس کے حوالے نہ کیا تو اس کی کوئی اجرت نہیں ہے کیونکہ شرط ناکام ہوگئی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17805}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17806} اجرت کی شرائط۔ کام کا معلوم ہونا چاہیے، اجرت کی مقدار معلوم ہونی چاہیے، بعض فقہا کے مطابق اجرت ایجنسی کے مقصد کا حصہ نہیں ہونی چاہیے، اور ایجنٹ کو ایجنسی کو درست طریقے سے انجام دینا چاہیے۔ ایک نامعلوم انعام، جیسے 'اس کی قیمت کا دسواں حصہ'، صرف روایتی اجرت دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17806} اگر ایجنٹ عیب دار فروخت کرتا ہے، تو اس کے لیے کوئی اجر نہیں ہے، کیونکہ فروخت کرنے کی عام اجازت صرف جائز فروخت ہوتی ہے۔ اگر اس نے صحیح فروخت کیا اور قیمت اس کے ہاتھ سے چلی گئی تو اس کے لیے اجر ہے کیونکہ کام ہو چکا تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17807} ایجنٹ نے جو ادا کیا اس کی اصل رقم سے وصولی۔ اگر پرنسپل اسے قرض ادا کرنے کا حکم دیتا ہے اور وہ اپنی رقم سے ادا کرتا ہے تو وہ اسے وصول کرتا ہے خواہ پرنسپل نے وصولی کی شرط رکھی ہو یا نہ ہو۔ اگر عامل پرنسپل کے پیسے کے بغیر خریدے اور اپنی ہی رقم سے قیمت ادا کرے تو زفر کے علاوہ حنفیہ اسے اس وقت تک سامان رکھنے دیتے ہیں جب تک کہ وہ پرنسپل سے قیمت وصول نہ کر لے، کیونکہ وہ معاہدہ کرنے والا فریق ہے جس پر قیمت واجب ہے۔ ظفر کا کہنا ہے کہ ہو سکتا ہے وہ انہیں نہ پکڑے، کیونکہ سامان اس کے ہاتھ میں امانت ہے۔ ان کو رکھنے کی ذمہ داری ابو حنیفہ اور محمد کے لیے ہے، جیسا کہ بیچنے والے کی ذمہ داری ہے۔ ابو یوسف کے لیے، ایک عہد کی طرح؛ غفار کے لیے، جیسے غصب کرنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17806}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17808} جن کے حقوق سے متعلق ایک معاہدہ کیا گیا ہے۔ معاہدے دو طرح کے ہوتے ہیں: وہ جو کہ ایجنٹ کے نام پر کیے جاسکتے ہیں، جیسے کہ فروخت اور کرایہ، جن کے حقوق ایجنٹ کو واپس آتے ہیں، جو سامان فراہم کرتا ہے، قیمت وصول کرتا ہے، اور قیمت کے لیے اس طرح مقدمہ کرتا ہے جیسے وہ مالک ہو۔ اور جو کہ پرنسپل کے نام پر ہونا ضروری ہے، جیسے شادی، خلع اور جان بوجھ کر قتل پر سمجھوتہ، جن کے حقوق پرنسپل کو واپس آتے ہیں، تاکہ مہر کے لیے شوہر کے ایجنٹ پر مقدمہ نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17808}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17809} شافعی اور احمد کی ایک روایت کا خیال ہے کہ ہر معاہدہ کے حقوق ایجنٹ کو لوٹتے ہیں۔ حنبلیوں کا مکتبہ فکر یہ ہے کہ وہ ہر حال میں پرنسپل کی طرف رجوع کرتے ہیں۔ اگر پرنسپل ایجنٹ کو قیمت وصول کرنے کا حکم دے تو ایجنٹ کو اس کا مطالبہ کرنے کا حق حاصل ہے، اور خریدار ان میں سے جو بھی مانگے ادا کرنے پر مجبور ہے۔ اگر پرنسپل ایجنٹ کو جمع کرنے سے منع کرتا ہے، تو ممانعت درست ہے۔ لیکن اگر خریدار پرنسپل کو قیمت ادا کردے تو استحسان سے رخصت ہو جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17809} اگر خریدار سے سامان ضبط کر لیا جائے تو وہ ان میں سے جو بھی ادا کرے، ایجنٹ یا پرنسپل سے قیمت وصول کرتا ہے۔ اور ایجنٹ کے خلاف عیب کا تعاقب کیا جاتا ہے اگر وہ وہی ہے جس نے سامان وصول کیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17809} وہ معاہدے جو پرنسپل کے نام پر ہونے چاہئیں، جیسے کہ نکاح، خلع، ادائیگی کے لیے دستبرداری، جان بوجھ کر قتل پر سمجھوتہ کرنا، پرنسپل کے حق اور خلاف ان کے حقوق ہیں۔ ایجنٹ ایک میسنجر اور کنویئر ہے۔ لہٰذا شوہر کے ایجنٹ پر مہر کے لیے مقدمہ نہیں ہے، اور بیوی کا ایجنٹ اسے وصول نہیں کر سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17810} مالکیوں کا خیال ہے کہ فروخت کرنے والا ایجنٹ قیمت کا مقدمہ کرتا ہے اور وصول کرتا ہے، اور خریدار میں ایجنٹ سامان وصول کرتا ہے اور پہنچاتا ہے۔ اگر وہ اسے نہیں جانتا تھا تو وہ عیب واپس کرتا ہے، اور قیمت کا پابند ہے جب تک کہ وہ واضح طور پر اس کا اعلان نہ کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17810} معاہدہ کا اثر اصل تک کیسے پہنچتا ہے۔ اکثریت ⁦(حنفی اور شافعی کے نظریات، مالکیہ اور حنبلی)⁩ کا خیال ہے کہ اس کا اثر براہ راست پرنسپل تک پہنچتا ہے، کیونکہ معاہدہ اسی کے لیے کیا گیا تھا۔ الکرخی کا خیال ہے کہ یہ سب سے پہلے ایجنٹ پر آتا ہے اور پھر پرنسپل کو جاتا ہے۔ ابو زید کا خیال ہے کہ ایجنٹ حکمران کا نائب اور حقوق کا پرنسپل ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17810} ایجنٹ اور پرنسپل کے درمیان تنازعات۔ ایجنسی کے وجود پر پرنسپل کی بات مان لی جاتی ہے کیونکہ اصل حالت یہ ہے کہ کوئی ایجنسی نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17811} اس کی شرائط پر ⁦(قیمت پر فروخت یا ادھار پر، کسی خاص چیز)⁩ پر اصولی بات کو حنفیہ اور مالکیہ کے نزدیک قبول کیا گیا ہے۔ مالکیوں نے دو صورتوں کا اضافہ کیا ہے جہاں ایجنٹ کا حلف غالب ہے۔ حنبلیوں کا مکتبہ فکر ایجنٹ کی بات کو قبول کرتا ہے، کیونکہ وہ ثقہ ہے۔ {حوالہ:فقہ الموسوعۃ کویتیہ-نور-v3 ص17811} ایجنٹ کے پاس بغیر کسی غفلت کے جو نقصان ہوتا ہے اس کے نقصان پر ایجنٹ کا حلف کے ساتھ کہا جاتا ہے، کیونکہ وہ امانت دار ہے اور آسانی سے نقصان کو ثابت نہیں کرسکتا۔ مالکیوں نے اسے ایک ایسے ایجنٹ تک محدود کر دیا جس پر کوئی شبہ نہ ہو۔ حنبلی کسی پوشیدہ وجہ سے، جیسے چوری؛ اگر وجہ واضح ہو، جیسے آگ یا لوٹ مار، حنبلی جج ⁦(القادی)⁩ کو پہلے واقعہ کا ثبوت درکار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17812} خلاف ورزی یا کوتاہی کے دعوے پر، ایجنٹ کا حلف کے ساتھ قول قبول کیا جاتا ہے، کیونکہ وہ اس کے خلاف الزام کی تردید کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17812} فروخت اور قیمت کی وصولی پر تنازعات۔ حنفیہ مقدمات کے ذریعے کام کرتے ہیں، اس بات پر منحصر ہے کہ اعتراض ایجنٹ تک پہنچایا گیا یا نہیں۔ اگر پرنسپل فروخت اور وصولی کی تصدیق کرتا ہے لیکن نقصان یا ترسیل کی نہیں، تو نقصان پر ایجنٹ کا حلف کے ساتھ لفظ قبول کیا جاتا ہے۔ اگر پرنسپل فروخت اور جمع کرنے سے انکار کرتا ہے، تو ایجنٹ کو فروخت کے بارے میں یقین کیا جاتا ہے لیکن پرنسپل کے خلاف مجموعہ کے بارے میں نہیں؛ خریدار پرنسپل کو دوبارہ ادائیگی کر سکتا ہے اور سامان لے سکتا ہے، یا واپس لے سکتا ہے۔ اگر پرنسپل فروخت کی تصدیق کرتا ہے اور ایجنٹ کہتا ہے کہ خریدار نے اصل رقم ادا کر دی ہے، تو خریدار کو ایجنٹ کے اقرار پر ڈسچارج کر دیا جاتا ہے، لیکن اگر ایجنٹ اسے ثابت نہیں کر سکتا تو اس کا ذمہ دار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17815} خلاصہ یہاں دیا گیا ہے۔ مالکیوں کا خیال ہے کہ اگر ایجنٹ کہے کہ میں نے آپ کی اجازت کے مطابق کام کیا تو اس کی بات قبول ہوتی ہے کیونکہ وہ ثقہ ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17815} شافعیوں کا موقف ہے کہ اگر ایجنٹ کے ہٹانے کے بعد تنازعہ پیدا ہو جائے تو اس کی بات بغیر ثبوت کے قبول نہیں کی جاتی۔ اگر اس سے پہلے، دو نظریات ہیں، جن میں سے زیادہ قبول کرنے سے پرنسپل کا لفظ ملتا ہے؛ دوسرا ایجنٹ کا لفظ دیتا ہے جہاں وہ حلف کے ساتھ تنہا کام کرسکتا ہے ⁦(جیسا کہ طلاق اور دستبرداری میں)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17815} مکتب کے نقطہ نظر میں حنبلی اس ایجنٹ کی بات کو قبول کرتے ہیں جسے اس نے بیچا اور جمع کیا اور قیمت ضائع ہوگئی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17816} ایجنٹ کے پاس جو کچھ ہے اسے واپس کرنے کے دعوے پر، اکثریت ایجنٹ کی بات کو حلف کے ساتھ قبول کرتی ہے، خواہ ایجنسی کو ادائیگی کی گئی ہو یا نہ ہو، احناف اور مالکیوں کے نزدیک؛ شافعی اور حنبلی جب اسے معاوضہ دیا جائے تو ثبوت کی ضرورت ہے، اور جب وہ نہیں ہے تو اس کی قسم قبول کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17816} ایجنسی کا خاتمہ۔ پہلا طریقہ ہٹانا ہے۔ ایجنسی ایک غیر پابند معاہدہ ہے، لہذا کوئی بھی فریق اسے برخاست کر کے ختم کر سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17816} ایجنسی کا خاتمہ۔ پہلی وجہ ہٹانا ہے۔ پرنسپل اپنے ایجنٹ کو برخاست کر سکتا ہے اور اسے اس کام سے منع کر سکتا ہے، اور ایجنٹ خود کو برخاست کر سکتا ہے۔ اس پر فقہاء کا اتفاق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17817} پرنسپل کی طرف سے جائز ہٹانے کی شرائط۔ پہلا یہ کہ ایجنٹ کو ہٹانے کا علم ہوتا ہے۔ حنفیہ، مالکیوں کا قول، شافعی کا قول اور حنبلی روایت اس کا تقاضا کرتے ہیں، کیونکہ ہٹانے سے عقد تحلیل ہو جاتا ہے اور علم کے بغیر پابند نہیں ہو سکتا۔ مالکیوں کی اکثریت، شافعی کا قول اور حنبلیوں کا مکتب نظر نہیں ہے۔ احناف کے نزدیک علم برطرفی کے وقت، پرنسپل کے خط، قاصد ⁦(چاہے ثقہ ہو یا نہ ہو، بالغ ہو یا نابالغ)⁩ کے ذریعہ یا دو ثقہ آدمیوں یا ایک ثقہ آدمی کی رپورٹ سے، اور غیر ثقہ آدمی کی رپورٹ کو شمار کیا جاتا ہے اگر ایجنٹ اس پر یقین کر لے۔ ابوحنیفہ کا موقف ہے کہ اگر ایجنٹ رپورٹ کی تردید کرتا ہے تو اسے ہٹایا نہیں جاتا چاہے یہ درست ثابت ہو، کیونکہ ہٹانے کی اطلاع گواہی کے مشابہ ہے۔ ابو یوسف اور محمد اس سے متفق نہیں ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17818} دوسرا یہ کہ ایجنسی کے ساتھ تیسرے فریق کا کوئی حق منسلک نہیں ہے۔ حنفیہ کا خیال ہے کہ حقدار کی رضامندی کے بغیر ہٹانا درست نہیں ہے، جیسا کہ قرض دہندہ کو اس کے بیچنے کے لیے مقرر کردہ ایجنٹ کے ساتھ یا مدعا علیہ کے ایجنٹ کے ساتھ مدعی کی درخواست پر مقرر کردہ مقدمے میں دیا گیا عہد۔ اگر فریق مخالف کی طرف سے ایجنسی کی درخواست کی گئی ہو تو شفیع ہٹانے کی اجازت دیتے ہیں۔ ایک بار جب ایجنٹ تین بار مخالف کے ساتھ بیٹھ جائے تو مالکی ہٹانے سے منع کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17819} تیسرا یہ ہے کہ ایجنسی کرائے پر نہیں ہے، کیونکہ کرائے پر لی گئی ایجنسی دونوں فریقوں کو پابند کرتی ہے۔ چوتھا یہ کہ ہٹانے سے نقصان نہیں ہونا چاہیے۔ شافعی شروانی کہتے ہیں کہ اگر کوئی فاسق کسی وارڈ کی جائیداد پر قبضہ کر لے تو ہٹانا حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17819} ایجنٹ کے خود کو ہٹانے کے لیے اکثریت کے نزدیک پرنسپل کے علم کی ضرورت نہیں ہے، سوائے اس کے کہ احناف اس کی ضرورت ہے جہاں ایجنسی قانونی چارہ جوئی یا کسی نامی چیز کی خریداری کے لیے ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17819}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17820} وفات۔ ایجنسی پرنسپل یا ایجنٹ کی موت پر، معاہدے کے ذریعے ختم ہو جاتی ہے، کیونکہ موت سے صلاحیت ختم ہو جاتی ہے اور جائیداد ورثاء کو منتقل ہو جاتی ہے۔ حنفیہ، شافعی اور حنبلیوں کے مکتب فکر کو موت کے بارے میں ایجنٹ کے علم کی ضرورت نہیں ہے۔ مالکیوں کا خیال ہے کہ اگر ایجنٹ کے ساتھ معاملہ کرنے والا شخص موت کے شہر میں تھا اور اسے ایجنسی کے بارے میں معلوم تھا، تو ایجنٹ کو اس وقت تک ہٹایا نہیں جاتا جب تک کہ اسے موت کا علم نہ ہو جائے۔ بصورت دیگر ایجنٹ کو موت کے علم پر ہی ہٹا دیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17820} پاگل پن۔ احناف اس ایجنسی کو مستقل پاگل پن سے ختم کرتے ہیں، ابو یوسف کے مطابق ایک مہینہ اور محمد کے مطابق ایک سال۔ ایک بار مستقل ہونے کے بعد، ایجنسی ریکوری پر واپس نہیں آتی ہے۔ شافعی اور مکتب حنبلی اس کا خاتمہ پاگل پن پر کرتے ہیں۔ مالکی ایسا نہیں کرتے جب تک کہ پرنسپل کا پاگل پن لمبا نہ ہو، اس صورت میں جج اس پر غور کرتا ہے۔ حنبلی روایت کہتی ہے کہ یہ ختم نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17821} بے ہوشی۔ اکثر فقہا اس کے ذریعے ایجنسی کو ختم نہیں کرتے۔ صوتی شافعی کا نظریہ پاگل پن کے ساتھ مشابہت رکھتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17822} ممانعت۔ احناف کا خیال ہے کہ پرنسپل یا ایجنٹ کی ممانعت ایجنسی کو ختم کر دیتی ہے، لیکن صراحت کرتے ہیں کہ پرنسپل کی ممانعت صرف اس صورت میں ختم ہوتی ہے جب ایجنسی معاہدوں اور قانونی چارہ جوئی سے متعلق ہو، نہ کہ قرض کی ادائیگی یا جمع کی وصولی سے۔ حنبلی اس کا خاتمہ فضول خرچی کی ممانعت کے ذریعہ اور پرنسپل کی دیوالیہ پن کے ذریعہ کرتے ہیں جس سے اسے روکا گیا ہے۔ شافعی اس کو کسی ایسے تصرف میں خرچ کرنے یا دیوالیہ ہونے کی ممانعت کے ذریعہ ختم کرتے ہیں جو اثر نہیں کرتا ہے۔ مالکی اسے پرنسپل کی تنگ دیوالیہ پن سے ختم کرتے ہیں، ایک عدالتی حکم کہ قرض دار کا سامان اس کے قرض دہندگان کے لیے لے جائے، نہ کہ عام دیوالیہ پن سے۔ ارتداد احناف کا خیال ہے کہ اگر مرتد کو دشمن کی سرزمین میں شامل ہونے کا حکم دیا جاتا ہے، تو ایجنسی ختم ہوجاتی ہے اور اسکول کے نقطہ نظر میں اسلام کی طرف واپسی پر واپس نہیں آتی۔ شمولیت سے پہلے اس کے اعمال ابو حنیفہ کے نزدیک معطل اور ابو یوسف اور محمد کے نزدیک پابند ہیں۔ مالکیوں کا خیال ہے کہ توبہ کی درخواست کی مدت کے بعد ایجنٹ کو اس کے پرنسپل کے ارتداد سے ہٹا دیا جاتا ہے۔ شافعی اس معاملے کی بنیاد اس بات پر رکھتے ہیں کہ آیا مرتد کی جائیداد اس کی ملکیت سے نکل جاتی ہے، متعدد آراء کے ساتھ، سب سے زیادہ ظاہر یہ ہے کہ یہ معطل ہے۔ حنبلیوں کا خیال ہے کہ ایجنسی اسکول کے نقطہ نظر میں ایجنٹ کے ارتداد سے ختم نہیں ہوتی، بلکہ پرنسپل کے ارتداد سے ختم ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17823}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17824} بے حیائی ⁦(فسق)⁩۔ حنبلیوں کا خیال ہے کہ ایجنٹ کی بے حیائی سے ایجنسی ختم نہیں ہوتی، سوائے ان معاملات کے جو بے حیائی سے متصادم ہوں، جیسے کہ شادی کی پیشکش، جہاں ایک ایجنٹ کو اس کی اپنی یا اس کے پرنسپل کی بد اخلاقی سے ہٹا دیا جاتا ہے۔ امانت کی ضرورت کے معاملات کے لیے ایک ایجنٹ، جیسے کہ یتیم کے سرپرست کا ایجنٹ یا اوقاف کا منتظم، اس کی اپنی بد اخلاقی یا اس کے پرنسپل کی وجہ سے ہٹا دیا جاتا ہے۔ شافعی اس کا خاتمہ ان امور میں پرنسپل کی بد اخلاقی سے کرتے ہیں جن میں دیانت داری کی ضرورت ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17825} شرابی شافعیوں کا خیال ہے کہ اگر کوئی فریق بغیر عیب کے شرابی ہو جائے تو ایجنٹ کو ہٹا دیا جاتا ہے۔ اگر غلطی سے، شافعی کہتے ہیں کہ یہ ایجنسی کو ختم کر سکتا ہے یا نہیں کر سکتا۔ حنبلیوں کا خیال ہے کہ یہ ایجنسی کو ختم نہیں کرتا سوائے ان معاملات میں جو اس سے متصادم ہے، جیسے کہ شادی کی پیشکش۔ احناف کا خیال ہے کہ یہ ایجنسی کبھی ختم نہیں ہوتی: طلاق کے لیے مقرر کردہ ایک ایجنٹ جو نشے میں ہو کر طلاق نہیں دیتا۔ ایک ایجنٹ جو نشے میں بیچتا ہے پرنسپل کو پابند نہیں کرتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17825}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17826} پرنسپل کی ملکیت کو چھوڑنے والی چیز۔ اگر پرنسپل خود یہ کام کرتا ہے، جیسا کہ ایجنٹ کے کرنے سے پہلے سامان بیچنے سے، یا اگر سامان پر کسی دوسرے کے ذریعہ دعویٰ کیا جاتا ہے، یا اگر وہ خود اس عورت سے شادی کرتا ہے، تو ایجنسی ختم ہوجاتی ہے۔ مالکیوں کا خیال ہے کہ اگر اصل ایک خریدار کو فروخت کیا جائے اور ایجنٹ نے دوسرے کو فروخت کیا تو پہلی فروخت کا پابند ہے، اور دوسری غیر مستند فروخت ہے، جب تک کہ دوسرا خریدار قبضہ نہ کر لے، اس صورت میں دوسرا کھڑا ہو جائے اور پہلا منسوخ ہو جائے، جب تک کہ دوسرے خریدار اور بیچنے والے کو پہلے کا علم نہ ہو۔ حنبلیوں کا خیال ہے کہ ایجنٹ کا اعتراف کہ اس نے جو کچھ وصول کیا تھا وہ وصول کرنے کے لیے مقرر کیا گیا تھا اس سے ایجنسی ختم ہو جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17826} اگر اعتراض اصل کی طرف لوٹتا ہے۔ محمد کا خیال ہے کہ ایجنسی واپس آتی ہے، کیونکہ جو چیز تنسیخ کے ذریعے واپس آتی ہے وہ اس کے حقوق کے ساتھ پہلی ملکیت ہے۔ شافعی اور ابو یوسف کا خیال ہے کہ ایسا نہیں ہے، کیونکہ پرنسپل کا اپنا عمل ایجنٹ کو ہٹانے پر دلالت کرتا ہے۔ ابن عابدین کہتے ہیں کہ اگر ملکیت منقطع ہو جائے تو واپس ہو جاتی ہے، دوسری صورت میں نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17826}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17827} ایجنٹ کی سرکشی جس کے لیے اسے مقرر کیا گیا تھا۔ شافعی کا قول اور حنبلیوں کا مکتب کا نظریہ ہے کہ فسق و فجور سے ادارہ ختم نہیں ہوتا، کیونکہ یہ عمل اجازت سے کیا گیا تھا: فسق سے امانت ضائع ہو جاتی ہے، لیکن عمل اسی طرح قائم رہتا ہے جیسے عہد کے ساتھ ہو۔ شافعی کا مخالف اور ایک حنبلی قول اس کو ختم کرتا ہے، کیونکہ ایجنسی ایک امانت کا معاہدہ ہے، جیسا کہ امانت ہے۔ المردوی کہتے ہیں کہ اگر ایجنٹ اس چیز کو تباہ کر دے جس کے لیے اسے مقرر کیا گیا تھا تو ایجنسی ختم ہو جاتی ہے اور اگر باقی رہے تو نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17827} انکار۔ حنبلی اور حنفیہ کا نظریہ ہے کہ ایجنسی ایجنٹ یا پرنسپل کے انکار سے ختم نہیں ہوتی، کیونکہ انکار پہلے کی اجازت سے دستبردار نہیں ہوتا ہے۔ حنفی فتویٰ اور ایک حنبلی کا قول ہے کہ یہ ختم ہو گیا ہے۔ شافعیوں کا خیال ہے کہ بھول جانے یا کسی چیز کو چھپانے کے لیے انکار کرنا ہٹانا نہیں ہے۔ اگر یا تو بغیر کسی وجہ کے جان بوجھ کر انکار کرتا ہے تو اسے ہٹا دیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17828} چیز کا نقصان۔ ایجنسی اس وقت ختم ہو جاتی ہے جب چیز گم ہو جاتی ہے، اور جب وہ عورت مر جاتی ہے جس کو طلاق سونپی گئی تھی۔ احناف کا خیال ہے کہ دو شراکت داروں کے الگ ہونے پر ان کی ایجنسی ختم ہو جاتی ہے، چاہے ایجنٹ کو علم نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17828} عمل کی تکمیل۔ احناف کا خیال ہے کہ جب سپرد معاملہ مکمل ہو جاتا ہے تو ایجنٹ کو ہٹا دیا جاتا ہے، جیسا کہ جب وہ قرض جمع کرتا ہے یا نکاح کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17828} حنبلیوں کا خیال ہے کہ اس ایجنسی کا خاتمہ پرنسپل کے صریح دستبرداری سے ہوتا ہے، جیسا کہ اس بیوی کے ساتھ جماع کرنے سے جس کی طلاق اس نے سونپی تھی، یا ایجنٹ کے مضمر دستبرداری سے، جیسا کہ اس نے ایجنسی کو خریدنے کے لیے آزادانہ طور پر مقرر کیا تھا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17829}"
  tr: "Fetha ve kasra ile yapılan söz söz muhafaza anlamına gelir ve Allah'ın adlarında 'vekil' anlamına gelir; bundan tawakkul ve yetkinin başkalarına devredilmesi gelir. Vekil, işlerinin yürütülmesi için ona yetki devri verdiği için 'vekil' olarak adlandırılır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17719} Terminolojide tanımlar farklılık gösterir: Hanefiler, bunu başkasının yasal ve bilinen bir eylemde, ister lüks ister yetersiz olsun, temsil edilmesi olarak tanımlar; Malikiler bunu, yetki veya ibadet olmadan, bir başkasına temsil edilmesi, ölümüne bağlı olmadan; Şafi'ler ise bir kişiyi, başkasının yaşamı boyunca hareket etmesine izin veren bir şeyi yapmaya yetki vermek olarak tanımlar; Hanbaliler ise bunu Allah ve insan hakları konusunda müdahil edilen kişinin görevlendirilmesi olarak tanımlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17720} Kitap, irade ile ilgili terimler arasında ayrım yapar: irade, bir kişinin başkaları üzerindeki yetki eylemidir; bazıları bunu iradeden daha genel kabul ederken, diğerleri eşanlamlıdır; vasilik, başkaları tarafından istemedikleri fark etmeksizin bir kelimenin yerine getirilmesi, yasal veya zorunlu bir etkenliktir, irade ise rızaya dayalı bir eylemdir; irade, kişinin ölümünden sonra hareket ederken kendisinin yerini ifade eder, irade ise hayattayken; ve vasilik, yargıç tarafından bir yetişkine küçüğün yararına hareket etmek için devredilen vesayet veya kocanın eşi üzerindeki vasiliği. {cit:fiqh-mawsua-kuwaitiyya-noor-v3 s.17720} Hukukçular ajansın meşruiyeti konusunda hemfikir oldular ve bunu Kur'an'dan kanıt olarak sundular: mağara sahabelerinin birini Medine'ye göndermesinin hikayesi, En-Nisa Suresi'ndeki iki hükmeden ayet ve hüküm, tek bir görüşe göre eşler adına bir vekil olarak verilmiş bir hükümdür. {alıntı:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.17721} Ve Sünnet'te: Urva ibn Ebi el-Ca'd Bariki'nin koyun satın almak için dinar verdiği hadis, Hakim ibn Hizam'ın kurban hayvanı satın almaya dair hadisi, Cabir'in Haybar'daki vekil hakkındaki hadisi ve Ebu Rafi'nin Peygamber'in Peygamber'in Meymunah ile evliliği hakkındaki hadisi Peygamber'in aralarında olduğu dönemde; fıhiller, Peygamber'in zamanından günümüze kadar bunun mücaizliği konusunda oybirliğiyle hemfikirdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17722} Akıl kullandılar, yani ihtiyaç ona çağrıdır, çünkü bir kişi hastalık, yaşlılık veya prestij nedeniyle kendi başına hareket edemeyebilir; eğer bu izin verilmezse, sürgün zorluklarına yol açar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17722} Ajansın sütunları. Hukukçuların çoğunluğu, bunun biçim, yüklenici (asıl ve vekil) ve sözleşmenin konusu (principal) olduğuna inanırken, Hanefi okulu bunun unsurunun teklif ve kabul olduğunu savunur, çünkü varlıkları diğer iki sütunu içerir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17722} Formül, karşılıklı anlaşmayı ifade eden teklif ve kabuldür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17722} Teklif. Çoğunluk, bunu asıl kişinin verdiği ve aracılık yapma izni olarak kabul ederken, Hanefi bunu sözleşmeyi kurma isteğini belirtmek için taraflardan birinin ilk verdiği şey olarak görür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17723} ve ajansın onayını gösteren her şey, söz, yazı, mesaj veya dilsiz kişinin jesti ile yerine getirilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17723} Açık ifadeden: 'Sizi görevlendirdim,' 'Sana emanet ettim', 'izin verdim', 'Seni yetkilendirdim', ya da 'Seni temsilcim olarak atadım' ya da 'sen benim vekillerimsin.' 'Sat' meselesine gelince, Hanefi, Şafii, Hanbali ve Malikilere göre geçerli, eğer adettiğin bir şeyse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17724} 'Seni atayacağım', 'Sana emanet edeceğim', 'Sana güvendim' ve 'Sana güvendim' ifadelerine gelince, Shafi'ler tarafından bu tür ifadeler açıkça belirtilmedikçe mümkün olduğu için sonuçlandırılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17725} Ajans, Hanefiler, Malikiler ve Şafiilere göre mektupla kurulur ve haber ne zaman haber ulaştığında ve kabul edildiğinde, ister adil ister haksız olsun, vekil bir ajandır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17725} Teklif, açık yazı ile, dilsizin anlaşılır jestiyle, Hanbali'ye göre izin belirten fiille ve Malikiler arasında bir onay olarak kabul edilen bir durumla, örneğin sessiz bir âlim olan eşinin mal varlığından kocanın tasarrufu gibi kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17726} Hanefiler, Şafi'ler ve Hanbalilere göre sessizlik teyit olarak kabul edilmez; bir yabancının malını sattığını görüp sessiz kalan kişi, sessizliğiyle vekil sayılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17726} Kabul. Bu, sözlü olarak, örneğin vekil 'Kabul ettim' dediğinde veya kabul edilmiş hissettiği sözlerle sağlanır; Hanafi ve Şafi'ler ise vekilin bunu reddetmemesi gerektiğini, çünkü tekliften sonra geri verirse söz hakkı kurulmadığını, kabul ederse teklif ve kabul yenilenmedikçe bunu reddetmemesi gerektiğini eklerler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17726}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17727} Eylemin kabulüne ilişkin üç görüş vardır: çoğunluk (en doğru görüşte Hanefiler, Malikiler ve Şafi'ler ile Hanbaliler) eylemin bunu gösteren her eylemle yerine getirildiğini, örneğin vekilin emrettiği eylemin gerçekleştiğini savunur; Şafiiler bir görüşte, Hanbeliler ise bunun yalnızca ifadeyle gerçekleştiğini düşünür; Şafiiler ise üçüncü görüşte farklıdır: teklifin biçimi \"sat ve al\" ifadesi gibi bir emir ise, kabul eylemle sağlanır; eğer \"ve senin ajansın\" gibi bir sözleşme formu ise, o zaman ifade gereklidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17727} Kabul yalnızca açık yazılı adres ve dilsiz kişinin bilinen işaretiyle geçerlidir. Hanefilere göre, vekilin sessizliği kabul edilir ve reddi reddedilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17727} Eğer kabulü geciktirirse, çoğu hukukçu (okulda Hanafi, Hanbali, Şafi'i ve iki görüşten birinde Maliki) bunu düzeltir, çünkü müdür izin geri çekmediği sürece geçerlidir, bu da caizedilebilirlik gibidir; Şafiiler ise eylemin zamanı belirtilmezse ve kaçırma korkusu varsa, hemen kabul edilir, aynı şekilde hakim onay verdiğinde kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17728} Malikiler ikinci görüşte ve Şafi'lerden Abu Hamid al-Marwudhi, kabulün anında olduğunu, çünkü ajansın ömür boyu bir sözleşme olduğunu, dolayısıyla kabulün satış gibi hemen gerçekleştiğini savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17728} Al-Mazari soruşturmanın niyet ve geleneklere bağlı olduğunu söyledi: Bu terimlerin amacı cevabı hemen çağırmak mı, yoksa hızlandırmak mı yoksa geciktirmek mi? {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17728} Etkisi ortaya çıkan zamana göre ajans türleri: tamamlanmış, koşullu olmayan veya zamana eklenmeyen olan, askıya alınmış, geleceğe eklenen ve geçici. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17728} Tamamlanmış ifade, bir koşula bağlı veya zamana eklenmemiştir; örneğin mükrizin \"Şu ve şu evi satma yetkiniz\" ifadesi gibi, ki bu hukukçuların mutabakatıyla doğrudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17729} Metin koşulludur. Hukukçular, geçerliliği konusunda iki görüşle farklı görüşler sergilemiştir. İlki Hanafiye göre ve Hanbaliler doğru görüşe göre, Şafiiler ise en doğru görüşe sahiptir; örneğin \"Hacı geldiğinde bu yemeği sat.\" Mühâh, önce öldürülmüşse Zayd bin Haritha'nın emriyle ilgili İbn Ömer'in hadislerini alıntıladılar. Eğer Zeyd bin Haritha'nın Mu'tah Savaşı'nda emredilmesine izin verildi, sonra Cafer, sonra Abdullah ibn Rawaha, eğer ondan önce öldürüldüyse, bu bir sözleşme olduğu için, vekil için bir hüküm olarak kabul edilir, bu yüzden daha çok bir vasiyetname gibidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17729} İkincisi Şafii'lere göre en doğru görüştedir, Hanbaliler ise geçersiz olduğunu söyler; Al-Mawardi ise ajansı koşullandırmanın geçersiz olduğunu söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17729} Şafi'ler, asıl kişinin acenteliği tamamlamasına ve işlem için bir koşul koymasına izin verilir; örneğin \"bir ay sonra sat\" ifadesi gibi, çünkü bu gecikme ve yorum yok; El-Gazali, Iraklılara şöyle bir şey yaptı: falancının gelişi veya bir ayın geçmesi işlemin bir koşuludur, sözleşme için değil, bu yüzden temsilcinin uyması gerekir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17729} Döngüsel biçim ve biçimi, asıl kişinin \"Bu mülkü satmanıza izin verdim, sizi işten çıkardığımda siz benim temsilcimsiniz\" dediği ve her görevden alındığında ajansın yenilendiği zamandır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17730} ve Hanafi ve Hanbaliler tarafından, ajansın askıya almayı kabul ettiği ve asıl kişinin Hanefilere göre istediği zaman temsilciyi görevden alma hakkına sahip olduğu gerçeğine göre doğrulanmıştır; görevden alma Hanbalilerin şu ifadesine göre gerçekleşir: \"Sizi görevden aldım, ne zaman atarsam, sizi görevden aldım.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17730} İbn Teymiye, sözleşmenin geçerliliğini reddetti çünkü bu sözleşme izin verilen sözleşmeyi bağlayıcı hale getirir. Askıya alma amacı, ajansın yetki verilmesini engellemektir, sözleşme imzalanmadan önce iptal etmek değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17730} Şafi'ler bunun iki şekilde hemen geçerli olduğunu söyler. En doğru olanı doğrudur: eğer görevden alınırsa ve vekil veya vekil bunu bilirse, işten çıkarıldıktan sonra tekrarlanmanın iki yolu vardır, en doğru olanı yasaklamadır. Eğer \"seni ne zaman çıkarsam\" dediğinde tekrarlama tekrarlanır, \"eğer\" veya \"ne zaman\" derse, sadece bir kez olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17730} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 17731} Geleceğe eklenen form, örneğin müdürün \"Ramazan ayında hayvanlarımı satmanı sana emanet ettim\" veya \"Bu evi yarın satman için yetki verdim\" ifadesi gibi, Hanafi ve Hanbaliler tarafından izin verilmiştir. Hanafiler, ajanın yarından itibaren vekil olduğunu, öncesinde değil, kabul eder. Şafiiler onlarla aynı fikirde olur çünkü görev hemen tamamlanır ve işlem gelecekteki bir zamana bağlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17731} Zamana bağlı form, örneğin \"Ay başladığında, evimi satmana izin verdim\" ifadesi gibi, Şafiilere göre geçersizdir çünkü ajansın son tarihlerde askıya alınması geçersizdir ve Hanefiler, Hanbaliler ve Şafiilere göre doğrudur, daha doğru görüşün aksine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17731} Hanefi arasındaki toplama ile askıya alma arasındaki fark: ekleme, sözleşmenin kararı zaman nedeniyle gecikirse hemen sonuçlanması, koşullu ise, hemen karar verilmesinin engellenmesi nedeniyle ajans ancak koşul mevcut olduğunda sonuçlanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17731} Geçici biçim, örneğin \"Bir ay boyunca benim vekilimsin\" ifadesi gibi, hukukçular arasında doğrudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17732} Zamandan sonra devam edeceği konusunda farklı görüşler vardı: Şafiiler bundan sonra kalmazlar. Hanefilere göre, evi \"bugün\" satmakla görevlendirilen ve yarın satan birine dair iki rivayet vardır. Doğru görüş, evin kalmadığıdır ve günün zamanlama için değil, hızlandırma için anıldığı için kalmıştır. Manhat al-Khaliq yazarı, Al-Bazzaziyya'nın görev süresinin on gün sürdüğünü ve on gün geçmediğini söylediğini aktarmıştır; bu daha doğrudur. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17732} Ajansın bir şartla birleşimi. Eğer koşul geçersizse, Hanefi, Ahmed ve İbn Ebi Leyla, en belirgin rivayetlerinde bu koşulun geçersiz bir durumu geçersiz kılmadığını, Şafiiler ise geçersiz bir şartın ajansı geçersiz kıldığını savunmuştur; örneğin asıl kişinin \"Satılan ürünü alıcıdan alıkoyun\" demesi, çünkü mülkiyet hakkını elinde bulundurmayı hak eden birinden mahrum bırakmak yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17732}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17733} Al-Zarkashi, ortaklık, ajans ve spekülasyon gibi izin verilen sözleşmelerin; geçersizliğinin izin yoluyla elden çıkarılma etkisini engellemediğini, ancak geçersizlikleriyle özelliklerini geçersiz kıldığını söyledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17733} Yolsuzluğun faydası, adı geçen ücretin kaybı ve eşdeğer ücrete geri dönüş sağlamasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17733} Bazı Hanbalılar, ajansın kredi kaybı nedeniyle depozito olarak geçersiz olduğunu savunurdu. Ebu Muhammed el-Şafii, iznin acentelikten ayrı olmadığını, bu yüzden geçersizliğinin yetkinin geçersiz olması anlamına geldiğini söylemiştir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.17733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17734} Ajans sözleşmesinin niteliği, yani bağlayıcı mı yoksa izin verilebilir mi olduğu. Hanefiler, Şafi'ler, Hanbaliler ve bazı Malikilere göre ilk görüş, bunun her iki taraf için geçerli bir sözleşme olduğudur çünkü gönüllü ve gereksiz bir bağıştır. Asıl kişi, kendisine verilen şeyi bırakmanın veya başkasına yetki vermenin faydasını görebilir ve vekil tam olarak ulaşılabilir olmayabilir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17734} Hanafiler ve Malikiler, ajans başkalarının hakkını ilgilendiriyorsa istisna yaparlardı; bu nedenle, uyuşmazlık vekili gibi indirim talep etmekle yükümlüdür ve temsilci ipotek sahibinin huzurunda rehin satmakla yükümlüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17734} Hanafiler, üç konunun zorunlu olmaya kadar uzandığını söyledi: bir koşul seçeneği onları kapsamaz, kasıtlı bir ajansla yönetilmez ve vekil istediği zaman istifa edebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17734} İkinci görüşe göre, eğer kira olarak kiralanıyorsa, her iki taraf için de bağlayıcıdır ve kira koşulları birleştirilmelidir. Bu, Şafi'ler ve Malikilerin bu görüşteki açık görüşüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17735} Üçüncü görüş, bazı sonraki Malikiler tarafından benimsenmiştir ve bu, ödeme yapılmasa bile hediye yükümlülüğüne dayanarak vekilin zorunlu olduğudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17735} Komisyon biçimi içinse, Malikiler arasında üç görüş vardır: her iki tarafın yükümlülüğü, her iki tarafın da kabul edilebilirliği (Şafiiler arasında kabul görmüş görüş) ve verilmiş taraf tarafından bağlayıcı olan, verilen taraf tarafından değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17735} İkinci direk: müteahhit, asıl ve vekil. Birincisi: Bilinen yasal bir işlemde kendi yerine başka birini atayan ve bu işlemin sahibi olması ve kurallarının kendisine bağlı olması gereken kişidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17735} Hukukçular, akıl hastası, bilinçsiz, uyuyan veya fark edilmeyen bir çocuğa söz hakkı verilmesinin kesinlikle kabul edilmediği konusunda hemfikirdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17735} Ayrıcalıklı bir çocuğun fayda işlemlerinde yalnızca anlaşmayla devredilmesi mümkündür; fayda ve zarar içeren işlemler ise Hanefi, Maliki ve Hanbali'lere göre vasi izniyle geçerlidir ve Şafi'ler bunları geçersiz kılar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17736} Bağımsız olmayan konularda aptal bir kişinin vesayet altında olması caiz değildir, ancak bu tür konularda bağımsız olanlar için caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17736} Hukukçuların çoğunluğuna göre, bir kadının kendisi evlenmediği ve bu nedenle evlenmediği için evlenmediği için evlendirilmesi caiz değildir. Bu, bazı durumlarda Hanafi ve Malikiler tarafından izin verilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17736} Dinden dönenin yetkilendirilmesiyle ilgili olarak üç görüş vardır: birincisi, çoğu fıhile (en açık görüşlerde Şafiiler, Hanbaliler ve Ebu Hanifa) göre, bu onun İslam'a dönüşüne bağlıdır; eğer İslam'a geçerse geçersizdir; ölürse, öldürülürse ya da dinden dönmüş olarak savaşa giderse geçersizdir; ikincisi, iki Sahabe ve Şafiilere göre geçerli, Hanefi ise dinden dönenin anlaşmalarıyla yetkilendirilebileceğini ekler; üçüncüsü ise, Şafiilere göre, Zakeriye el-Ensari ve el-Şebramlsi'nin aktardığı görüşe göre, geçersizdir. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.17736} {cite:Fiqh-mawsua-Kuwaitiyya-Noor-v3 s.17737} Zimmi Müslümanının şarap ve domuz eti satma yetkisi hakkında: Şafi'ler, Malikiler, Hanbaliler ve iki Sahib bunun geçerli olmadığını belirttiler; çünkü temsilcilik şartı, asıl kişinin devredilecek yetkiye sahip olması, Müslümanın onları satma hakkı olmaması ve kaybeden kişinin vermemesidir. Abu Hanifa doğru görüşteydi çünkü asıl kişinin başkalarını devretme hakkını veren görevleri yerine getirme kapasitesine sahip olması yeterlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17737} Mahramın evlilikte yasal olmasına izin verilmesi konusunda: hukukçuların çoğunluğuna göre, bu izin verilmez çünkü asıl ihram iken sözleşmeye girmez ve Hanefi makamları buna kesinlikle izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17737} Hanbalılar, ajanın prensibini bilmemesi durumunda ajanın geçerli olmadığını belirtir; ona \"Sen senin ajansın\" diyerek ve onu ayırt ettiği ne atfedilir ne de tanımlanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17737} Ajan. Akıl ilkesinden beklenenleri gerektirir; bir deli, akıl hastası ya da fark edilemeyen bir çocuğu anlaşmayla atamak yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17737} Ergenlik durumu hakkında: Hanafi ve Hanbaliler, sözleşmeyi anlayan ve niyet eden seçkin bir çocuğun aracılığına izin verdiler ve sözleşmenin hakları ona değil, asıl kişiye döndü. Onların argümanı, Peygamber'in Um Salama'yı çocukken Amr ibn um Salama ile evlendirdiği; Şafi'lerin onu yasakladığı çünkü onun sorumlu olmadığı ve kendi haklarını yönetme yetkisi olmadığı için başkaları üzerinde kontrol edemediği yönündedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17738} Vekilin spesifik olması gerekir. Birisi \"Bir kişiye mal satma yetkisi verdim\" derse, ajanın cehaleti nedeniyle bu kurum geçersizdir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s. 17738} İbn Najim, şehrinin alacaklısının \"Size şu işaret getiren varsa, elimdekini ödesin\" ifadesinin alacaklısının bilinmeyen ve geçersiz bir vekaletname olduğunu, bu yüzden borçlu ona ödeme yaparak beraat etmediğini belirtmiştir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17739} Ajanın ajans hakkındaki bilgisi. Hanefilere göre, ajanlık hakkında bilgi genellikle bir koşuldur: ya ajans ya da onunla ilgilenen kişi bilir; eğer ajan kendisi bilmeden önce satarsa ve alıcı da acenteyi öğrendikten sonra izin verene kadar satış mümkün değildir. Eğer acente aracılığıyla söylerse, uzlaşmaya göre vekil olur. Birisi ona adil olmamasını söylerse, vekil olur. İnanmazsa, Abu Hanifa'ya göre vekil değildir, Ebu Hanifa'ya göre o ise Ebu Yusuf ve Muhammed'e göre vekildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17740} Hanbaliler, sözleşmelerdeki bedelin aynı konu için olduğunu ve Şafi'lere göre en açık görüşten alındığını savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17740} Temsilcinin adaleti genel durumda, evlilik gibi özel sözleşmeler dışında zorunlu değildir ve erkekliği genel durumda, evlilik gibi bazı sözleşmeler dışında zorunlu değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17741}, ajansın konusudur; bu, asıl kişinin mülkiyet veya vasilik sahibi temsilciye verdiği yetkili eylemdir. Şafii'lere göre koşulu üç yönlüdür: bazı açılardan bilinmeli, ajans kabul edilmeli ve temsilcinin bulunduğu anda asıl acente ona sahip olmalıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17740} Ajans, iş yeri tarafından özel ve kamu olarak ikiye ayrılır. Uzmanlaşmış, ajansın belirli bir yetkiyle yetkilendirilmesi ve temsilcinin sadece anlaşmayla hareket etmesidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17741} ve genel görüş birliği arasında bir görüş ayrılığı vardır: Hanafiler ve Malikiler genel olarak detaylarla buna izin verirler. Hanafiler, \"Her küçük ve çok kişide benim aracımsın\" ifadesinin sadece ezberle hareket ettiğini, \"her şeyde senin işin izinlidir\" derse, satış, satın alma, hediye ve hayır gibi tüm finansal işlemlerde bir ajan olduğunu söyler. Boşanma, özgürleşme ve vakıf konularında farklılık gösterirler ve hükmleri onun sahip olmadığıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17741} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17742} Malikiler, meselenin sadece 'Seni atadım' demekle sonuçlanmadığını, işin yetki devriyle devredildiğini söyler. Servetin artmasını içeren şeyler caizdir ve ahiret ödülü için yapılanlar açık izin olmadan izinlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17742} Şafiiler ve Hanbaliler için genel delegasyon belirsizlik çokluğu nedeniyle geçerli değildir. Bu nedenle, 'Sizi her küçük ve çok şeyle atadım' ifadesi geçerli değildir ve 'Servetimi satmayı ve borçlarımı tahsil etmeyi sana emanet ettim' demek de doğrudur, servet ve borçlardan habersiz olsam bile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17742} Ajansa tabi olmanın geçerli olduğu kuralı: Bir kişinin kendi başına yaptığı herhangi bir sözleşme, belirli durumlarda hareket edemeyebileceği için başka biri tarafından yetkilendirilebilir, çünkü bu nedenle yetkilendirilmesi gerekir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17743} Hukukçular, alım-satımda söz hakkının izinliliği konusunda hemfikirdirler çünkü zorunluluk bir zorunluluktur. Peygamber bunu, Urwah al-Bariqi'yi koyun satın alması için görevlendirdiğinde ve Hakim bin Hizam'a bir kurban satın alması için bir dinar verdiğinde bunu yaptı. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 17743} Ayrıca, devretme, ipotekler, garantiler, ortaklıklar, mevduatlar, mudarabah, ceala, musaqah, kiralama, krediler, vasiyetler, iptal, tahliye, takas, taşıma ve ön alım işlemlerinde de söz hakkının kabul edilebilirliği konusunda anlaştılar; ayrıca teminat, anlaşma ve hediye işlemlerinde de geçerlidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17743} Hukukçular, bir erkekle yapılan evlilik sözleşmelerinde adilliğin geçerliliği konusunda hemfikir oldular; evliliği kabul ederken Peygamber Amr bin Umeyye ve Ebu Rafi'nin vekaletnamesine dayanarak, asıl kişinin uzak bir yerden evlenmesi gerekebileceğini ve Peygamber'in o zamanlar Habeşistan'da olan um Habiba ile evlenmesini gösterdiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17744} Peygamber, sadakat, yemin ve kefaret gibi mali ibadet işlemlerinde söz hakkının kabul edilebilirliği konusunda anlaştılar; çünkü Peygamber yardımı toplamak ve dağıtmak için vekillerini göndermişti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17745} Boşanma, iade ve hula'da vekaletnamenin kabul edilebilirliği konusunda anlaştılar, çünkü buna olan ihtiyaç, satış ve evlilikte vekaletnameye olan ihtiyaç gibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17744} Vekaletnamenin anlaşmayla geçerli olmadığı durumlarda. Tanıklık: Burada delege etmek yasaktır, çünkü tanık gördüğü veya duyduğu şeyle ilgilidir ve bağlılık ve kesinlik üzerine kurulur; eğer temsilci olarak atanırsa, temsilci tanıklık eder ve orijinal tanıktan duyduklarını yerine getirir, vekil olarak değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17744} Ve yemin ve yeminler, çünkü bunlar yemin edenin ve yemin edenin gözüyle ilgilidir, ayrıca lanet, ira' ve yemin de vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17745} Cinayet, hırsızlık, gasp ve iftira gibi günahlar yasaktır ve ne baş ne de vekil tarafından işlenemez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17745} ve dua, oruç tutma ve kirlilikten arınma gibi tamamen fiziksel ibadet eylemleri, çünkü bunlar zorunlu olan kişinin bedeniyle ilgilidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17745} Tartışmalı olan. Hac: Hacı kendisi yapabilen birine vekaletname devretmek yasaktır, ancak engelliler için bu yetkisi onun yerine ayrıntılı olarak belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17745} Ve Umre: Başkaları adına vekaletle vekaletle icra etmek genellikle caizdir. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 17745} Kadının evlenmesi: Çoğu hukukçu bir kadına evliliğe emanet edilmesini veya ona bağlanmasını yasaklarken, Hanafiler bunu özgür, olgun ve aklı başında bir kadına izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17746} Zihar: çoğunluk tarafından yasaktır, ancak Şafi'ler buna daha doğru görüşün aksine, buna izin verir. Malikilerden İbn Abdülselam bunu boşanma olarak kabul etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17746} Ve ölü toprakları canlandırmak, avlanmak, metal kazmak gibi izin verilen şeyleri elde etmek: Ezher ve Hanbali mezhebindeki Malikiler ve Şafiiler tarafından izin verilmiş, Hanafi ve bazı Şafiiler ise bunu yasaklamıştır çünkü mülkiyet el koyan ajana aittir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17746} Ve hakların tanınması: Hanefiler, Malikiler, Hanbaliler ve Şafi'ler tarafından izin verilen en gerçek görüşün aksine, Şafi'ler ise en doğru ve Tahawi'ye göre bunu yasaklamıştır çünkü bu, şahit gibi bir doğruluk ifadesidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17747} Anlaşmazlık: Malikiler, Şafiiler, Hanbaliler ve iki sahibi tarafından din, mülk ve tüm haklar, ister var olsun ister olmasın, muhalif rıza gösterse de kabul etmese izin verir. Maliki okulu, aracın rakibin düşmanı olması durumunda istisna yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17747} Ali ibn Ebi Talib ve her 'Aqila'nın Ebu Bekir ile birlikte olduğunu ve ihtiyacın buna çağrı olduğunu savundular. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17747} Abu Hanifa, vekaletnamenin itirazda ancak itirazın onayı olmadan kabul edilemeyeceğini, ancak asıl kişinin hasta veya üç gün veya daha fazla süreyle yokluğunda mümkün olduğunu, çünkü asıl kişinin tahkim kuruluna katılımının rakibinin hakkı olduğunu söyledi; onun yöneli, davanın doğru ya da yanlış olabileceği bir rapor olmasıdır, bu nedenle cevabın yalnızca zorunluluk durumlarında verilmesi zorunludur ve asıl kişinin hastalığı veya seyahati durumunda zorunluluk vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17748} Al-Jassas, rivayette erkek ve kadın arasında belirgin bir ayrım olmadığını belirtmiştir ve sonraki alimler bir kadını uyuşturucu etkisi altında olan kadına devretmeyi tercih etmiştir. İbn Ebi Leyla, yalnızca bakireye izin verilebileceğini söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17748} İntikamın kurulması ve tamamlanması: Malikiler, Şafiiler, Hanbaliler, Ebu Hanife ve Muhammed ibn al-Hasan bunu kanıtlamak için bir araç verdiler, ancak Ebu Yusuf buna katılmadı ve sadece madde sahibinden izin verdi, çünkü hudud ve kısa davalarında şüphe önlenir. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17748} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17749} İstifya el-Qisa'da: Okuldaki Malikiler, Şafi'ler ve Hanbaliler, müdürün huzurunda ve yokluğunda buna izin vermiştir; Hanafiler ve bazı Şafi'ler ile Hanbaliler, müdür af ihtimali nedeniyle yoksa izin vermezler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17749} Hududun kurulması ve yerine getirilmesi: Okuldaki Hanbalılar, Anis'in hikayesine dayanarak zina hadd cezasını koymaya izin verdiler. Aralarından Ebu El-Hattab bunun geçerli olmadığını söyledi; Şafiiler Allah'ın bölgesinde buna sadece iftira cezası için izin verirler, çünkü gerçek Allah'a aittir ve O'nun ondan uzak durmasını emrettiği için. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17749} Yenileme konusunda, Malikiler, Şafiiler ve Hanbaliler buna izin verdi ve Peygamber'in keçiyi taşlama emrini ve Osman Ali'nin al-Welid bin Uqbe'ye içme cezasını koymakla görevlendirmesini örnek gösterdiler. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17750} Hanafiler, Allah'ın haklarının iki türden olduğunu söylemiştir: onaylama: zina ve alkol cezası gibi anlaşmazlık gerektirmeyen konularda devretmek yasaktır ve Ebu Hanifa ve Muhammed'e göre hırsızlık ve iftira cezası gibi Ebu Yusuf'un yasakladığı durumlarda da izin verilir; ve iftira ve hırsızlık işleminin tamamlanması, sanık veya ondan çalınan kişi varsa kabul edilir, öğretmenleri ise yoksa farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17751} Ajans Hükümleri. Temsilci, bunu asıl kişinin yetkilendirdiği veya Şeriat ya da gelenek tarafından kısıtlanan sınırlar içinde yürütmesi, asıla gerekli bilgileri sağlaması, ajansın hesabını sunması ve elindeki şeyi asıl kişiye geri vermesi ile ilgilidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17751} Özel ajans mutlak ve kısıtlı olarak verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17751} Türlerinden biri satış yoluyla acenteliktir. Abu Hanifa'ya göre, temsilci suçlanmadıkça bir kısıtlamaya bağlı değildir. Satmak için az ya da çok karşı, nakit ve nakit satma hakkına sahiptir, çünkü varsayılan olarak kesin ifadenin kesinlikle yapılması ve satışın daha karlı ve geleneksel olanı satın almak amacıyla ağır dolandırıcılıkla yapılmasıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17751} Satışta mutlak ajans. Hukukçular bunu iki görüşle sınırlar. İlki, Abu Hanifa'ya göre, mutlak vekil suçlanmadıkça hiçbir kısıtlamaya bağlı değildir, bu yüzden az ya da çok ile, nakit ve nakit ile ve hediyeyle satma hakkına sahiptir, çünkü mutlak kelime ona kesinlikle uygulanır ve daha karlı olanı almak amacıyla büyük haksızlıkla satmak adedindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17752} İkincisi, çoğu hukukçu (Maliki, Şafi'ler ve Hanbali) için mutlak vekilin kısıtlamalarla sınırlanmasıdır; bunlar arasında: genel para birimi yerel para birimini ifade ettiği için yerel para birimiyle satış yapmak ve benzer fiyattan satmak, kimse aynı paraya itiraz etmediği durumlarda. Malikilere göre, daha ucuza satılırsa, ana para küçük olsa bile seçenek, küçük miktarlarda ise yarım ondalık veya daha az olur. Hanbalilere göre satış geçerlidir ve eksiklikten vekil sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17752} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17753} Malikiler, Haneliler ve iki Sahabe'ye göre tesadüfi değil, para karşılığında satmayı da içerir; Malikiler, Şafi'ler ve Hanbalilere göre hediye olarak satmamak ve Hanbalilere göre izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17753} ve Hanbalilere göre kâr amacıyla satılmamalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17753} Kendisi için satan ajan. Çoğu hukukçu (okulda Hanefi, Şafii ve Hanbali okulları ile güvenilen okulda Malikis) bunu yasaklar, çünkü satışta gelenek bir kişinin başkasından satmasıdır ve bu bir suçlama içerir; Maliki ve Hanbaliler, müdür izin verirse izin verir, Maliki okulu ise istekler sınırlıysa veya satış müdürün huzurunda yapılırsa istisna yapar. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17754} Ahmad'dan, bir rivayet vardır; eğer tutar çağrıdaki fiyatı aşarsa ve başka biri çağrıyı devralırsa ve hakim ikinci teklifin zorunlu olabileceğine hükmeder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17754} Malikilere göre, kendisini sevmezse bu caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17754} Aracı, tanıklığı kabul edilmeyen birine satmak. Hanefilere göre, tanıklığı değerinden fazla kabul edilmeyen birinden satarsa, bu izinlidir; daha azına ise uzlaşmayla izin verilmez ve aynı değer için iki anlatı vardır; her iki sahibi de onlardan aynı değere satmaya izin vermiştir, ancak kölesinden veya görevinden hariç. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17754} Malikilere göre, bilinen görüşe göre, ajan vasisine reşit olmayan, aptal veya yetkisiz bir köleyi satamaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17755} Şafi'lere göre, küçük çocuğuna izin verilse bile satılması caiz değildir. Doğru görüş, onun mal varlığı ve engelsiz şubeleri için satılmasının da caiz olduğudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17755} Hanbali okuluna göre, çocuğuna, babasına veya görev pozisyonlarına satmak yasaktır, ancak ikinci durumda izin verilir ve tartışma konusu müdür izin vermezse geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17755} Satışta kısıtlı ajans. Temsilci, başkanının koşullarına bağlı olarak anlaşma ile bağlıdır. Hanafiler, vekil asıl kişinin kısıtlamasını ihlal ederse, anlaşmazlık daha iyiye olmadıkça ancak onun izni olmadan bunu uygulayamayacağını, bu durumda anlaşmanın anlamlı bir anlaşma olarak kabul edildiğini söylemiştir. \"Giysimi bin dirhem için satın\" derse ve daha az ya da daha az dirhem karşılığında satarsa, geçerli değildir; daha yüksek fiyata satarsa geçerli; \"krediyle sat\" derse hemen geçerlidir; indirimle satılmasını emrederse durdurulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17756} Malikis, satışın artırılması veya azaltılması opsiyonu getirmez, çünkü bu istenen şeydir ve ihlalin geçerli bir amaç için olmadıkça opsiyonu haklı çıkarmadığını savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17756} Şafi'iler ve Hanbaliler şöyle derler: Vekil, sözlü veya geleneksel olarak izin alınmadıkça hareket etme yetkisine sahiptir. Eylemlerden biri asıl kişiye zarar verirse, 'Zarar veya karşılıklı zarar yoktur' dediği için bu durumdan kaçınır; buna karşılık verilse bile, bu tavsiye anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17757} Süreyi aşmayan, belirli bir amaca bağlı bir yere ve belirli bir alıcıya sınırlı olan izin, temsilci asıl kişinin kendi amacı olmadığını bilmediği sürece başka bir alıcıya da geçerli değildir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17758} Temsilcinin fiyatı ihlali. Açıklamada: Eğer ona krediyle satmasını emrederse, hemen satar. Çoğu hukukçu satışa izin verir ve asıl amaç amaca ulaştığı ve vekil bunu iyi artırdığı için asıl aleyhine uygulanır. Hanbaliler, esas ertelemede belirli bir amacı varsa satışın geçersiz olduğunu ve Şafi'lerin ana kişinin bir amacı varsa satışı yasakladığını belirtir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17759} Eğer bir nasi'id eşyasını belirli bir fiyata satması emredilirse ve o da onu nakit olarak daha ucuza satarsa, Hanefiler, Şafiiler ve Hanbaliler satışa izin vermezken, Malikiler bunu asıl yetkilinin yetkili iznine bağlı kılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17759} Eğer bir nes'id olarak satılmasını emrederse, Hanefiler, Şafiiler ve Hanbaliler satışa izin vermez çünkü hızlandırmanın bir amacı vardır, Malikiler ise bunu izin şartına bağlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17759} Şafi'ler ve Hanbali'lere göre, vekil yalnızca asıl kişinin izniyle gereken, sözlü veya geleneksel olarak hareket etme yetkisine sahiptir. İki eylemden biri asıl kişiye zarar verirse, müdür ve bunun karşılığında karşılık verilirse, bağlayıcıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17757} İzin, süresi aşmayan süreyle sınırlıdır, amacı olan bir yere sınırlı izin başkalarına uygulanmaz ve belirli bir alıcıya verilen izin, temsilci ana kişinin kendi amacı olmadığını bilmediği sürece başkalarına uygulanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17758} Eğer ona malı hemen bin taksite satmasını emrederse ve o da bin taksitle satarsa, bunu yerine getirmez; bunun yerine asıl kişinin iznine bağlıdır ve bu Al-Kasani'nin görüşüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17760} Ajanın fiyat türü konusundaki ihlali. Eğer ona malı dinara satmasını emrederse ve dirhem veya açık artırmaya satarsa, Hanefi, Şafii ve Hanbali yargıçları değeri yüksek olsa bile satışa izin vermezler; çünkü bir tür için izin başka bir tür için izin değildir. Hanbalılar okulda, birine dirhem için satmak emrederse ve kendisi bunu bir dinara satarsa, bunun geçerli olduğu görüşüne sahiptir, çünkü geleneksel olarak izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17760} Maliki okulu okulu, iki paranın yerel para biriminden olması ve değerleri eşitse iki parayı imzalamak ya da iptal etmek arasında seçim yapar; aksi takdirde bir görüş tercih edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17761} Eğer ona nakit göndermesini emreder ve teklif karşılığında satarsa, bu Hanbali ve Malikilere göre geçerli değildir, çünkü teklifler fiyatlarla aynı türde değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17761} Temsilcinin fiyatı ihlal etmesi. Eğer fiyatın üzerinde satarsa ve artış aynı türdense, çoğunluk ihlalin daha iyi olduğu için satışı geçerlileştirir; Şafi'ler ise asıl kişinin artışı açıkça yasaklarsa bu tekliften kaçınması gerektiğini ekler, ancak onlara göre kesinlikle izin verilmez çünkü mal sahibinin paylaşımını haklı çıkarma amacı vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17761} Eğer belirtilen miktardan daha düşük bir fiyata satarsa, Malikiler temsilcinin izniyle askıya alır ve varsa ürünü geri verir, eksikse değerini geri verir. Şafi'ler ve Hanbaliler bir rivayette ürünü geçersiz kılar; okuldaki Hanbalılar ise eksiklikten sorumlu olarak acentelerin sorumluluğunu belirtirler. Eksikliğin boyutu konusunda iki görüşleri vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17762} Yerinde vekil ihlali. Belirli bir yer belirlenmişse ve başka yerde satarsa: Malikilerden Şafiiler, Hanbaliler ve İbn Şaslar, yerin belirli bir amacı varsa, örneğin yüksek değeri veya fiyatıyla bilinen bir pazar gibi; Hanbaliler ve Şafi'ler amaç olarak eşitse başka yerlerde satış yapmaya izin verir; Hanefiler uyum şartı koşar ve acente ihlal ederse sorumludur; Malikiler satışı izin koşullu kılar; ve Şafiiler buna izin vermez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17762} Ajanın zamanında ihlali. Belirli bir zaman belirlenip başka yerde satılırsa, Hanefiler, Şafiiler ve Hanbaliler satışı yasaklar ve asıl kişiyi bağlamazlar, çünkü asıl kişi ihtiyaç anında başka bir şeye tercih edebilir; Malikiler ise asıl kişiye onay veya iade arasında seçim hakkı verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17762}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17763} Temsilcinin belirli alıcıya karşı ihlali. Eğer \"Sadece ona\" derse ve başka birine satarsa, çoğunluk (Hanefi, Şafi'i ve Hanbaliler) izin vermez; Şafiiler ve Hanbaliler ise temsilcinin alıcının gözünde asıl kişinin amacı olmadığını bilirse izin verir; Malikiler ana alıcıyı tercih eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17763} Anlaşmanın dağıtılması. Bazı malları satıp kalanını satmazsa ve ayrılık ana malıya zarar vermezse, satış Hanefi, Şafiî ve Hanelilere göre geçerlidir, ancak Hanbaliler tarafından yasaklanmadığı sürece. Maliki ilkesi, prensibin izin ile geri verme arasında seçim hakkı olduğudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17764} Zarar verse bile, Şafiiler ve Hanbaliler bunu geçersiz kılar, Malikiler, Ebu Yusuf ve Muhammed bunu durdurulmuş (mawsuf) sayır ve Ebu Hanifa bunu geçerli sayar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17764} Ajanın satılan üründeki ihlali. Belirtilen eşyanın yerine başka bir eşya satarsa, Sahih'teki Şafiiler ve Hanbaliler satışı geçersiz kılar çünkü temsilci sadece izin gerektiren şeylere sahiptir. Bir rivayette Maliki ve Hanbaliler asıl kişiyi serbest bir rahatlatıcı yapar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17764} Satın alma yoluyla acentelik. Genel olarak kullanılması izinlidir, örneğin Hanefiler, Malikiler ve Ahmad'a göre başka bir rivayette \"İstediğini bana al\" ifadesinde olduğu gibi, çünkü başlıca kararı devreder; Haneliler ve Şafi'ler bunu yasaklar çünkü parası mümkün olmadığını satın alabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17765} ve temsilcinin ana parasını kendi parasından veya özel bölgesinden satın alması: Hanafiler bunu engeller, Abu Yusuf ve Muhammed ise eşit değerde, daha az veya daha fazla ise izin verir, bu yüzden insanlar aynı şekilde tartışır; ajans genel olsa bile, anlaşmalarıyla izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17766} Al-Mu'tamid ve Hanbali mezhebindeki Malikiler, sahip olduklarından satın almayı yasaklar ve müdür izin verirse izin verirler; Malikler ise suçlama olmadıkça akrabalarından satın almaya izin verirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17767} Şafi'ler onu mülkünden veya küçük çocuğundan kesinlikle alıkoyur ve en doğru görüşe göre, bağımsız yetişkin köklerinden ve dallarından izin verirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17767} Sınırlı satın alma ajansı. Hanefilere göre, okulda istihsan, Malikiyye ve Hanbali'de, malların türü belirtilmese bile, örneğin \"Bana bir giysi al\" demek, borç vermeye benzetilebilir. Kanıtları, Hakim bin Hizam'a bir dinar verme hadisidir; çünkü biraz bilgisizlik tartışmaya yol açmaz, çünkü temeli genişliktir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17767} Kısıtlı acente ile satın alma ve ihlali. Eğer alıcıya ertelenmiş fiyatla satın almasını emrederse, nakit satın alır. Çoğunluk (Hanefi, Maliki, Şafi'i görüşünde ve Hanbaliler okulda) satın almaya izin verir ve vekil fiyatı artırmazsa müdür yükümlüdür, çünkü ihlal anlam açısından uzlaşmadır; Şafiiler ise asıl borç olmamak istediği için düzeltmezler; Hanbalılar ise asıl borç zarar görürse bunu engellediklerini savunurlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17769} Eğer ertelenmiş satın alırsa ve izin vermesi emredilirse, Hanafiler yalnızca temsilciyi ister, Malikiler opsiyonu ana olarak kabul eder, Şafi'ler satın alma kendi mülkleriyle birlikteyse geçersiz kılar ve Hanbaliler ise bunu yetkilendirmeye tabi sayar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17769} Satın alma fiyatının türünün ihlali. Şafiiler ve Hanbaliler bu görüşü reddederken, okuldaki Hanbalılar dirhem dinara ve tam tersi şekilde değiş tokuş etmesine izin verirler; çünkü dirhem kabul eden dinardan memnundur ve iki madeni parayla teklif değiştirmek yasaktır. Hanefiler, alıcıya dinar almasını emrederse ve başka paralarla alırsa, müdüre bağlı değildir. El-Karkhi'nin bilinen görüşü, dirhem dinara almak da ana borçlu değildir; Malikiler bunu izin için bir koşul olarak görür ve asıl kişinin dinar için dirhem ödemesini zorunlu kılmasıyla ilgili iki iyi bilinen görüş vardır. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.17769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17770} Fiyatın eşdeğerinin ihlali. İhlal iyi bir sebepten kaynaklanıyorsa, örneğin bir hayvanı belirtilen fiyattan daha düşük fiyata satın almak gibi, satın alma geçerlidir ve vekil sorumludur. Şafiiler ve Hanbaliler, müdür eksik bırakmayı yasaklarsa istisna yapar. Eğer kalıcı değilse, Hanafiler temsilciyi ister, ancak asıl kişiyi değil; Malikiler ise asıl kişinin yirmide biri gibi küçük bir artış ödemesini ister ve büyük zamı onun iznine bağlı kılar; Şafiiler ve Hanbaliler bunu geçersiz kılar, ancak okuldaki Hanbalılar düzeltir ve zamdan vekil sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17771} Alıcının ihlali. Satın almaya yetkili olmayan bir şey satın alırsa, Hanafiler satın almayı vekâlser için kabul eder ve asıl mecbur değildir; Malikiler asıl sahibin mülkiyeti acenteye geri verip kendi parasından ödeyip ödemediğini seçmesine izin verir; Şafiiler ise ana parayla satın aldıysa ve kendi mülkiyetinde satın aldıysa ve asıl kişinin adını vermediyse, bu satın vekil için geçerlidir, asıl niyetli olsa bile. Hanbaliler, asıl borçlunun yükümlülüğüne ilişkin iki anlatımla satın alma işlemini doğrular, ancak mülkün mülkiyetinde yapılan satın alma doğru görüşe göre geçersizdir. {alıntı: fiqh-mawsua-kuwaitiyya-noor-v3 s.17771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17773} Alıcının Temerrürü. Hanefiler kayymiyyat (geleneksel değerler) arasında ayrım yaparlar, bu yüzden fazlalık ana ve ağırlıklı değerler için geçerli değildir, bu nedenle ana değer Ebu Hanife'nin ve Muhammed'in bazı rivayetlerinin emrettiği doğrultuda bağlıdır ve hepsi Ebu Yusuf ve Muhammed'e göre zorunludur. Haneliler ve Malikiler, bilinen görüşün aksine, iki koyun bir dinara alırsa başlıyı yükümlü tutarlar; Hanbalılar ise bunu birinin bir dinara eşit olduğunu söyleyerek sınırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17774} ve Şafi'ler, atanan kişinin koyun tanımını ayırt ederler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17774} Satın alma işlemini farklılaştırmak. Eğer emir verilen kişi genellikle ayrılması imkansız değilse ve asıl kişiye zarar vermiyorsa, hukukçular boyun eğdirmenin izin verilebilirliği konusunda anlaşmıştır, böylece asıl temsilcinin satın aldığı şeye bağlıdır. Hanbaliler ve Şafi'ler bir durumda 'o işlemi satın al' demeyerek bunu kısıtlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17775} Gelenek ayrımcılığı yasaklıyorsa veya zarar veriyorsa, Hanafi ve Malikiler bunu temsilcinin iznine bağlar. Hanefi çoğunluğu, kalan satın alınmayı asıl mahkemede itiraz etmeden önce onaylar, Zafar ise satın almanın yalnızca vekil için olduğunu savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17775} Tanımlanan bir eşyanın satın alınmasını emrederse, sadece satış kusursuzdur; kusurlu satın alırsa, Hanefilere göre, statü yerine getirilmezse (örneğin bir köle kız satın alıp kör veya kesik bir el satın almak, ya da atlı hayvan satın alıp çeyiz satın almak gibi, anlaşmayla asıl para yükümlü değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17777} Eğer temsilciye eşya atanmış ve kusurlu olduğu halde satın alırsa ve vekân kusurdan habersizdirse, asıl borçludur ve geri verme hakkına sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17777} Temsilci kusuru biliyorsa, asıl sorumlu değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17777} Eğer temsilci alıcıya teslim eder ve ardından bir kusur keşfederse, kusur elinde kaldığı sürece geri verme hakkına sahiptir; eğer amaç asıla teslim ederse, ancak onun izni olmadan geri vermez. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 17777} Malikilere göre, vekil kusuru fark edip mülk üzerinden satın alırsa kusurdan sorumludur, ancak asıl sadece kusur küçük ve genellikle affedilirse ve satın alma bir zevkse sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17778} Şafi'lere göre, satın alma sorumluluğu hakkında: kusur, vekilin haberi olmadan satın alınan ile eşitse, ana kişidir; biliniyorsa doğru görüş ona uygulanmaz; eğer bunu yapmazsa ve vekil bilgilendirilirse, doğru olan asıldır; bilirse doğru olan asıldır; bilmiyorsa ve vekil bilmiyorsa, doğru olan asıldır; bilirse asıldır; bilirse geçerli değildir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17778} Eğer ana parayla satın alırsa ve kusuru bilmezse, kusur asıl kişinin üzerine düşer, ancak bilirse geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17778} Hanbalis'e göre: Eğer temsilci kusuru biliyorsa, asıl satın aldığı şeyden sorumlu değildir; bilmiyorsa, satın alma izinlidir ve temsilci ile asıl borç geri verebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17779} Eğer temsilci eşyayı atar ve kusurlu halde satın alırsa, satın alma öncesinde kusurdan haberdarsa, bu onun için izin verilemez. Satın alırsa, borçludur ve asıl ancak onay verirse yükümlüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17779} Yozlaşmış bir sözleşmede temsilci. Eğer yozlaşmış bir sözleşmede atanmışsa, vekilin yerine Şafi'ler, Hanbaliler, Muhammed ve Zafar'a göre geçerli bir sözleşmesi yoktur. Abu Hanifa ve Abu Yusuf, ana para için iyi olup olmadığını tercih olarak kabul ettiler; tıpkı bir temsilcinin iki bin dolara satılması gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17781} Vekil ve opsiyon şartını ihlal etmesi. Hanefilere göre, eğer ona üç günlük opsiyonla ana makul satmasını emrederse ve o opsiyonsuz ya da daha düşük opsiyonla satarsa, satış geçersizdir ve sorumludur. Eğer bir aylık seçenek hakkı verilmişse ve üç gün şart koşulmuşsa, bu Ebu Hanife'ye göre tercih olarak kabul edilebilirdi, ancak onlar için değil. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17781} Şafii'lere göre, \"opsiyon şartıyla sat\" denip kesin olarak satarsa, geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17782} Hanbalilere göre, vekil kendisi ve temsilcisi için opsiyon belirleyebilir, ancak sözleşme tarafı için şartı yoktur, çünkü asıl kişinin yapmak zorunda olmadığı şey onu bağlayıcıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17782} Temsilcinin anlaşmazlığı kabul etmesi. Malikiler, Şafiiler, Hanbaliler ve Zafer bunu engeller, çünkü kabul anlaşmazlığı çözer, bu nedenle vekilin üzerinde yetkisi yoktur ve konu ona uygulanmaz. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17782} Ebu Hanifa ve Muhammed bunu yalnızca hakim önünde izin verdiler, hudud ve kısaları hariç tuttular. Benzerlikleri diğerleriyle de kabul edilebilir ve Ebu Yusuf buna kesinlikle izin verdi; eğer ilke kabulü dışlıyorsa, vekilin kabulü geçerli değildir ve ajansın kabulü hariç tutulur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17783} Anlaşmazlık konusu vekil, hakkı uzlaştırma, feragat etme, satma, hediye etme veya erteleme hakkına sahip değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17783} Hakkın el koyması hakkı reddedilir. Hanbali okulundaki Hanbaliler ve Şafiiler bir taraftadır: Anlaşmazlıktaki sorumlu vekil, hakkı kanıtlamak için görevlendirilir çünkü sadece onun aracılığıyla mülkiyet elde edebilir. Ebu Yusuf, Muhammed, Malikiler ve Hanbaliler bir davada onu engellemiş, Şafiiler ise başka bir durumda engellemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17784} El alma izni, ne sözlü ne de geleneksel olarak anlaşmazlık durumunda izin değildir, çünkü almayı kabul eden kişi mutlaka anlaşmazlıkla tatmin olmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17784} Abu Hanifa, malvarlığı alan temsilci arasında, yani davalının satın alma iddiasında taraf değildir, borç alma hakkındaki vekil arasında ayrım yapar; bu nedenle borç, uyuşmazlıktaki temsilciye ait bir işlem olduğu için sorumludur. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17785} Vekilin kendisine emanet edilen şeyi alma hakkı hakkına gelince: düşünce okulunda Şafiiler ve Hanbaliler ve Zafar ile Ebu Yusuf'tan rivayet edilenler bunu yasaklar; çünkü müdürün anlaşmazlığa sahip olmak istemeyen biriyle anlaşmazlığı kabul edebilir; Hanefiler Zafer değildir ve Hanbalılar buna izin verir, çünkü vekil bunu tamamlamada vekildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17785} Ve vekilin başkasıyla itiraz etme yetkisi hakkına gelince: müdür izin verirse ona aittir; yasaklarsa almaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17786} Genel olarak: okuldaki Hanefiler, Malikiler ve Hanbaliler bunu yasaklar; çünkü insanlar anlaşmazlıkta farklılık gösterir; Maliki ve Hanbaliler bunu vekil için uygun olanla sınırlar, bu yüzden uygunsuz ya da iyi değilse ona devretmek caizdir. Malikiler ise anlaşmazlık sık yaşanırsa birini ataması gerektiğini eklemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17786} İbn Qudamah şöyle dedi: Eğer yetki verilmişse ve eylem genellikle vekilin üzerinde ise veya yapamıyorsa, devretmek caizdir; eğer kendisi tarafından yapılırsa ve bolluk nedeniyle hepsini yapamazsa, bu izinlidir. Aksi takdirde iki anlatı vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17787} Eğer iki kişi bir anlaşmazlığa karışıyorsa ve biri anlaşmazlık içindeyse, vekaletname Hanefilere göre geçersizdir; ve tüm taraflar aynı taraftaysa, bu mümkündür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17787} Ve vekilin borç ödemesi konusunda: asıl borç 'Kapat ve tanıklık etme' derse, vekil alacaklı reddederse sorumlu değildir, tanıklık etmesi emredilirse sorumludur. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 17787} Eğer ona tanıklık olmadan yargılama emrettiyse, bunu yaptı ve ifade vermedi; bu, okuldaki Hanefiler, Malikler, Şafiiler ve Hanelilere göre geçerli sayılır çünkü aşırıya kaçmıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17788} Maliki ve Hanbali okullarına göre okulun ve Şafiilerin en doğru şekilde müdürün huzurunda hüküm vermesi halinde sorumlu değildir, ancak diğer durumda Şafiilere göre sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17788} Borcun zorunlu kılınması yoluyla vekaletname. Vekil borcu ele geçirirse, borçlu serbest bırakılır ve alınan mal asıl sahibine ait olup vekilin elinde bir güven haline gelir. Temsilcinin borcu hediye etmesi, geciktirmesi veya affetmesi yasaktır; Hanefilere göre borcu teminat olarak alamaz, kefil alabilir; ancak Maliki ve Hanbali'ye göre, borcu ancak asıl kişinin izni olmadan kapatabilir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17789} Devamsızın vekalet hakkını talep eden kişiye verilen hakkın ödenmesi. Vali, davacı ajansa karşı anlaşmayla delil sunarsa borçluyu ödemeye zorlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17789} Delil sunulmasa bile, Malikiler, Şafi'ler ve Hanbaliler, borçlunun ajansın hak sahibine ödeme yapmak zorunda olmadığını, ancak buna inandığını belirtirler. Borçlu gönüllü olarak reddeder ve alacaklı acentiyi reddederse, alacaklı yalnızca ödeyiciyi geri alır ve ihmal veya ihmal nedeniyle zarar görürse vekili geri alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17790} Ancak Hanefiler, borç ile mal arasında ayrım yapar ve borçlu hak sahibi hakkında dürüst olursa ödemeyi emrettiğine, ancak yalan söylerse sadece vekilin aldığı ödemeyi ödemekle yükümlü olduğuna inanırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17791} Eğer rakip, davacının acenteliği reddettiğine ve ondan para aldığına dair kanıt sunarsa, bu kabul edilir, çünkü bu, davacının alıcıya olan hakkının kesildiğini kanıtlar ve böylece temsilcinin mülkiyetini zorunlu olarak geçersiz kılar. Ancak hak ayni ise, örneğin depozito gibi, mevduat sahibinin dürüstlüğü ona ödenmez, çünkü bu, başkasının malını aldığının bir kabulüdür, borç ise ödemeye emredilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17792} Eğer mevduat sahibi depozitoyu ajansın talep sahibine verirse, depozito kaybolur ve mal sahibi, mevduat sahibi içindeki vekaletnameyi reddeder; kendisi yemin edebilir ve ödeme sırasında garanti vermedikçe vekalete karşı geri talep edemez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17792} Birden fazla temsilci. Asıl kişinin, uyuşmazlıklar dışındaki belirli bir işlem için birden fazla vekil ataması mümkündür; çünkü temsilcisi aynı anda bir temsilcidir, bu yüzden hiçbiri sadece temsilci izin vermedikçe hareket edemez. Hanefilere göre, işlem görüş ve danışma gerektiriyorsa, örneğin satış, evlilik veya borç tahsilatı gibi, ikisi de tek başına kabul edilmez. Ancak, hediye teslim etmek, depozito iadesi veya borç kapatmak gibi gerekli değilse, her biri yalnızdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17793} Ve hepsi iki sıralı kelimeyle yazılır, hangisi Hanafi ve Maliki'ye göre izin verilirse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17794} {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 17795} Anlaşmazlık konusu olan iki ajana gelince, her biri Hanefilere göre benzersizdir, Zafar hariç, Hanbaliler ise bir görüşte ve Şafi'ler daha doğru görüşe zıt olarak amaç hakimi bilgilendirmektir ve Zafar bunu yasaklar. Şafiiler bunu en doğru görüşte, Haneliler ise okulda en doğru görüştedir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17795} Ajanı yetkilendirmek anlaşmayla mümkündür. A- İzinle, anlaşmayla izin verilmez. B- Yasakla, anlaşmayla izin verilmez. C- Yetki devri ile, örneğin 'İstediğini yap' veya 'fikrine göre hareket et' demek, Hanefiler, Malikiler ve Hanelilere göre caizdir, ancak Şafiiler olası ifadeler nedeniyle bunu yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17796} D- Genelleme lehine: Çoğu hukukçu, ilkânın vekilin görüşünden memnun olduğu için bunu yasaklar ve insanlar farklı görüşlere sahiptir. Bazıları iki istisna yapmıştır: vekil işi yapamayabilir veya yapamaz olabilir, bu izindir; ve iş kendisi tarafından yapılabilir ama bolluğu nedeniyle hepsini yapamaz. Böylece, Hanbali ve Şafii'lere göre kabul edilirken, Malikiler ve Şafiiler bunu kapasitesi aşmakla sınırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17797} ve Ahmad ile İbn Ebı Leyla kesinlikle izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17798} Temsilci tarafından atanan kişinin güvenilirliği gerekliliği. Temsilci güvenilir olmalıdır, ancak asıl kişi güvenilir olmayan birini atarsa, bu durumda vekil onun atamasını takip eder; ve ikinci vekil hain olursa, Hanbaliler ve Şafiiler vekilin görevden alınması gerektiğini, Şafiilerin ise daha doğru görüşe göre onu görevden alma yetkisine sahip olmadığını kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17798} Temsilci tarafından atanan birinin temsilciliğinin sınıflandırılması. Eğer müdür \"ve bana devret\" ya da \"ona devret\" derse, ikinci vekil müdürün temsilcisidir ve birinci görevden alınmasıyla görevden alınmaz; ve eğer \"ve seninle ilgili her şey\" derse, ikinci vekil birinci vekildir ve görevden alınması ve ölümüyle görevden alınır. Şafi'ler ve Hanbalilere göre, müdür şubeyi kaldırır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17799} Ve eğer 've atayım' derse ve 'benden' ya da 'sizden' demezse, Hanefiler, Malikiler ve Şafi'ler en doğru görüşe göre ve okuldaki Hanbalılar onu müdürün vekili yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17799} İzinsiz vekaletname çoğunluğa göre geçerli değildir ve Ahmed ile İbn Abi Layla tarafından bir rivayetle doğrulanır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17799} Ajan, asıl parası üzerinde güvenilirdir, bu yüzden depozito gibidir. Kaybedilen şeyden sorumlu değildir; ancak ücret veya bağış yoluyla ihmal ederse veya ihmal ederse, çünkü eli asılın elindedir ve aday bir haciz sözleşmesidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17800} Güvenilirliğinden, yeminiyle kendi adına teminat verilmemesinde beyanı kabul edilir, çünkü ajansın temeli hoşgörü ve merhamettir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17800}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17801} Sorumluluğun koşulu veya reddi. İbn Qudamah, güvenin koşuluyla garanti edilmediğini, garanti edilenin ise koşuluyla geçersiz kılınmadığını söyledi; Ahmed ise sorumluluğun koşulla reddedilmesini gösteren şeyleri bildirdi ve ilki görünür görüştür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17801} İhlal ve ihmalkarlık. Hayvan kapasitesini aşarsa, giysiyi izinsiz giyerse, nasıl kaybedildiğini bilmeden para kaybederse, asıl malını kendi malıyla karıştırırsa, mazeretsiz geri dönmeyi reddederse veya mazeret geçtikten sonra geri dönmeyi geciktirirse vekil sorumludur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17801} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17802} Eğer asıl borç kendisi öder ve ardından vekil öderse, vekil bilmezse sorumlu değildir; bilirse, asılın eylemini bilmesi işten çıkarma olarak kabul edilir; Abu Hanifa'ya göre, vekil genel olarak zekatta sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17802} Eğer temsilci sözleşme yoluyla satarsa ve satılan ürünü fiyatı almadan teslim ederse, alıcı satılan değerin bir parçası olarak reddeder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17803} Eğer fiyatı mazeretsiz ödemeyi erteleyip mülkiyetinde ölene kadar ertelerse sorumludur; mazeretli varsa sorumluluk olmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17803} Koyunu yanlışlıkla kesen kişi sorumludur çünkü hata ve niyet insanların malında aynıdır. Eğer tüm depozitoyu tahsil etmesi emredilirse, bir kısmı için sorumludur ve kalan para ilk kişinin ölümünden önce alınırsa sorumluluktan muaf tutulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17803} Nasıl sorumlu tutulur. Eşdeğer, eşdeğerinin değerinden, değerin değerinden ve eşdeğer için mümkün değilse eşdeğerinden sorumludur. Değer, ihlal veya yok edilme günü dikkate alınır, başka hiçbir şey olmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17803} {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 17804} Beyannamenin sunulması. Temsilci, asıl kişinin eylemleri hakkında istenen bilgileri sağlamakla yükümlüdür. İbn Hajar, her vekilin ifade ve hesap talep edilmesi gerektiğini ve önceliğin cevabın ve davanın el yazısı değil, olduğunu söyledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17804} Temsilcinin elindeki şeyi iade etmek. Sahip olduğu şeyi asılına iade etmek zorundadır; zarar görene kadar mazeretsiz bir talep ile geri dönmeyi reddederse, ödeme yükümlüdür. Benzer şekilde, mazeret kaldırılırsa, iade zarar görene kadar geciktirilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17804} Eğer asıl ve vekil bir ücret üzerinde anlaşırsa, ücret anlaşmayla ödenir. Eğer kabul etmezlerse: Hanefi okuluna göre, temsilciye iş için ücret ödenmezse ajans gönüllüdür; ancak eğer profesyoneli bir meslek sahibiyse, örneğin aracılık veya aracılık gibi, ücret karşılığında çalışırsa, eşdeğer ücret almaya hak kazanır. Yargı Kararları Kanunu'nun (1467) maddesi bunu belirtir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17805} Ücret alma hakkı zamanı. Temsilci, kendisine emanet edilen şeyi ana makama teslim etme hakkına sahiptir; eğer bu teslim edilebilen bir şeyse, örneğin dokuduğu veya diktiği giysi gibi; ve eğer Hac satışı, satın alma veya gerçekleştirmekle görevlendirilmişse, iş tamamlandığında üzerinde anlaşılan ücreti almaya hak kazanır; ancak asıl kişi önce bedelin ödenmesini şart koşarsa ve vekil ücreti teslim etmezse, o zaman ücreti olmaz. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17806} Ücret alma hakkı koşulları: iş bilinmeli, ücret miktar olarak bilinmeli, ücret bazı hukukçulara göre sözleşmenin parçası olmamalı ve temsilci acentiyi doğru şekilde yürütmelidir. Bilinmeyen vakalar arasında \"Fiyatının onda birini yaptı\" ifadesi vardır, böylece adil bir ödül alacaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17806} Eğer temsilci yozlaşmış bir satış satarsa, bunu yapmasına izin verilmemelidir, çünkü sadece doğru kişiyi satmak için mutlak izin gereklidir. Doğru şekilde satarsa ve fiyat kaybolursa, işin varlığı nedeniyle ödül alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17806} {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 17807} Ajanın ödediği paranın ana paraya iadesi. Eğer ona borcunu ödemesini emrederse ve borcu kendi parasından öderse, geri ödeme şartı geri verilir ya da hiçbir şart yerine getirilmez; ancak satın alma yetkisi verilir ve fiyat kendisine ödenmezse, kendi parasından öder. Hanefilere göre, Zafar hariç, satıcı fiyatı ödeyene kadar satılan malı tutma hakkına sahiptir, çünkü kendisi bir müteahhittir ve fiyatı ödemekle yükümlüdür. Zafar, satılan malın elinde bir güven olduğunu düşünerek alıkoymaması gerektiğine inanır. Abu Yusuf ipotekten, Zafar ise gasp etmekten sorumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17806} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17808} Temsilci tarafından yapılan sözleşmenin haklarının ilgili olduğu varlık. İki tür sözleşme vardır: temsilciye atfedilebilecek satış ve kiralama gibi, hakları acenteye geri dönen, satılan eşyayı teslim eden, fiyatı toplayan ve talep eden sözleşmeler; ve ana paraya eklenmesi gerekenler, evlilik, hula ve kasıtlı kan karşılığında anlaşma, çünkü hakları ana kişiye geri döner ve kocanın temsilcisi çeyizi talep etmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17808} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17809} ve Şafi'ler ile Ahmad, bir rivayette sözleşmenin haklarını mutlak olarak vekil ile ilişkili olarak kabul ederlerken, Hanbali düşünce okulundaki Hanbaliler temel hakı mutlak olarak kabul ederler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17808} Eğer vekil fiyatın ödenmesini emrederse, talep sahibi talep eden kişinin hakkına sahiptir; ve eğer asıl temsilcinin almasını yasaklarsa, yasak geçerlidir, ancak alıcı parayı ana tarafa öderse tercihle beraat eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17809} Satılan eşya alıcının elindeyse, alıcı fiyatı satan kişiye, temsilciye veya asıl kişiye geri verir; aynı şekilde, eğer alıcı ise, kusur temsilci tarafından itiraz edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17809} Asıl eşyaya eklenmesi gereken sözleşmeler, evlilik, khul', mülk üzerindeki özgürlük, yazı ve kasıtlı kanla yerleşim gibi, hem asıl hem de onun için haklar taşır ve temsilci elçi ve vekildir. Kocanın temsilcisi çeyizi talep etmez, eşin temsilcisi de bunun velayetine sahip değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17810} Malikilere göre, satış temsilcisi ödeme ve fiyatın alınmasını ister, satın alma temsilcisi satılan ürünü alıp teslim ettiğini iddia eder ve kaçakçı kusuru bilmezse kusuru giderir ve feragatname bildirmedikçe fiyat talep eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17810} Sözleşme kararının asıl kişiye nasıl aktarıldığı. Çoğu hukukçu (Sahih'te Hanefi, Sahih'te Şafi'ler, Maliki ve Hanbalis) kararın doğrudan asıla devredildiğine inanır çünkü sözleşme ona aittir. Al-Karkhi, kararın önce temsilci için verildiğine, sonra asıla devredildiğine inanır. Abu Zayd onu yasal otoritede asıl olarak kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17810} Ajan ile asıl arasındaki fark. Ajanlığın kökeninde: ifade prensibin ifadesidir çünkü varsayılan olan etkenin yokluğudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17811} Ve 'ayn, fiyat, nakit ve nisah' gibi ajansın niteliği konusunda: Hanefiler, Malikiler, Şafiiler ve Hanbaliler arasında atanan kişinin görüşü bir görüşe göre; Malikiler, iki durumda görüş vekilin yemini olduğunda istisna yapmıştır ve Hanbali okulundaki Hanbalilere göre vekil güvenilir kişidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17811} Vekilin elindeki şeye ihmal olmaksızın verilen zarar: vekilin güvenilir olduğu ve tanıklık edemediği için yemin ettiği kabul beyanı. Malikiler onu sadece suçlamayla sınırlar, Hanbaliler ise bunu hırsızlık gibi gizli bir neden olarak adlandırır; eğer zarar yangın veya yağma gibi bariz bir eylemden kaynaklanıyorsa, Hanbali hakimine göre görünürdeki olayı kanıtlamak ve ardından yemin etmek zorundadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17812} Korumada ihlal ve ihmal: Temsilcinin yeminini içeren beyanı, çünkü reddedilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17812} Yetkili elden çıkarma ile fiyatın alınmasında fark: Hanafi, acentenin satışı, fiyatın alınması ve imha ile ilgili detayları verir. Satılan eşya acenteye teslim edilebilir veya teslim edilmez; eğer vekil satış ve imha olmadan teslim etme konusunda dürüstse, vekilin kayıp hakkı yeminiyle birlikte olur; eğer vekil tüm bunlarda yalan söylerse, vekilin alma hakkına inanmaz. Alıcı isterse ikinci bir fiyat ödeme, isterse feragat etme seçeneğine sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17813}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17815} Malikilere göre, vekil \"İzin verdiğim gibi davrandım\" derse, bu ifade onun kendi ifadesidir, çünkü güvenilirdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17815} Şafi'lere göre, ayrılıktan sonra bir anlaşmazlık olursa, ifade ancak kanıtla kabul edilir. Eğer bu ayrılıktan önce gerçekleşirse, iki görüş açıktır: en belirgin olanlar müsade görüşüdür ve vekilin dayandığı şeyin yeminiyle kabul edildiği söylenir. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 17815} Hanbali düşünce okuluna göre: eğer vekil, 'Giysiyi sattım, fiyatını aldım ve zarar gördü' derse, görüş onun görüşüdür. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17816} Temsilcinin elinde olanı geri verme talebi. Görüş, temsilcinin çoğunluğa göre yeminiyle birlikte ifadesidir; Hanafi ve Malikilere göre ödenmiş ya da ücretsiz olsun; Şafii'lere göre, daha doğru ve Hanbali okullarının aksine, ücret karşılığında çalışıyorsa ancak kanıtla birlikte ifadesi kabul edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17816} Temsilciliğin sona erdirilmesi. Birinci: Görevden çıkarma, çünkü ajans bağlayıcı olmayan bir sözleşmedir, bu nedenle taraflardan herhangi biri sözleşmeyi işten çıkarma ile sona erdirebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17816} Ajansın sonu, işten çıkarma ile başlar. Müdür, temsilciyi görevden alabilir ve hareket etmesini yasaklayabilir, vekil ise genel hukukçuların mutabakatıyla kendini işten çıkarabilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17817} Ajanı müdüründen korumanın geçerliliği koşulları: Birincisi, vekil görevden alınmayı bilir, bu yüzden Hanafiler bunu Maliki ve Şafii görüşlerine göre ister, Hanbaliler arasında rivayet yapılır, ancak Maliki görüşüne göre değil, Şafiiler en doğru görüşe göre ve Hanbaliler ise düşünce okuluna göre değildir. Hanefilere göre, vekil işten çıkarılmanın varlığıyla, yok olan müdürün mektubuyla, kendisine ulaşan elçi tarafından, adil ya da küçük olmasa bile, ya da iki adil ya da adil kişinin raporuyla tanınır. Eğer haber haksızsa, onun gerçeği reddedilir; Ebu Hanife, yalan söylerse ve haberin doğruluğu ortaya çıkarsa onu izole saymaz, çünkü işten çıkarma raporu tanıklığa benzer, Ebu Yusuf ve Muhammed ise ona katılmazlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17818} İkincisi, ajans başka birinin hakkını ilgilendirmez. Hanefilere göre, ipoteği satmaya yetkili olan ipotek sahibi veya davacıyı uyuşmazlığa devreden davacı gibi hak sahibinin onayı olmadan işten çıkarma mümkün değildir; Şafi'ler, ajans itirazdan istenerek yapılırsa vekilin işten çıkarılmasına izin verirken, Malikiler taraf üç yaşından sonra işten çıkarmayı engeller. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17819} Üçüncüsü, ajans kira yoluyla olmamalıdır, çünkü bağlayıcıdır. Dördüncü olarak, bu görevden alma zarar vermemelidir; eğer vesinin malına haksız el koyulmasına yol açıyorsa görevden alma yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17819} Temsilcinin kendisinin görevden alınması, çoğu hukukçu tarafından müdür hakkında bilgi sahibi olmak için zorunlu değildir; ancak Hanefi okuluna göre ajans anlaşmazlık veya belirli bir eşya satın alınmasıyla gerçekleşirse geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17820} Ölüm. Vekaletname, asıl veya vekilin anlaşmayla ölümüyle geçersizdir, çünkü ölüm ehliyeti geçersiz kılar ve mal varislere geçer. Hanefiler, Şafiiler ve Hanbalilere göre, düşünce okulunda ajanın ölümü bilmesi zorunlu değildir. Malikilere göre, mütebe, sözleşmeli taraf ölüm şehrinde bulunuyorsa ve ölümü biliyorsa aracı devre dışı bırakır; aksi takdirde, ölüm bilgisi olmadan görevden alınır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17820} Akıl hastalığı. Hanafiler, akıl hastalığını mutlak delilikle geçersiz kılar; sadece Ebu Yusuf'a ay, Muhammed'e ise Sünnet'e göre. Mutabak uyanarak akıl hakkını iptal etmez; okuldaki Şafiiler ve Hanbalılar akıl hastalığı nedeniyle geçersiz kılar, Malikiler ise atanan kişinin akıl hastalığı uzadıkça ve hakim inceledikçe izole etmezler. Hanbalılar bunu geçersiz saymazlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17821} Bayılma. Çoğu hukukçu bunu bununla geçersiz kılmazken, Şafi'ler daha doğru bir ifadeyle akıl hastalığı nedeniyle geçersiz kılar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17822} Karantina. Hanefiler, asıl veya vekil üzerindeki yasaklanmanın ajansı geçersiz kıldığını, ancak Hanefi'nin sözleşme ve anlaşmazlıklarda olduğunu, borç kararı veya depozito değil, asıl kişinin yasaklanmasıyla geçersiz kıldığını belirtir. Hanbaliler, vasiyi önemsiz bir ihlal ve asıl kişinin kısıtlanan miktarıyla geçersiz kılar; Şafiiler ise aptallık veya icra edilemeyen herhangi bir işlemde bir kuruş bile yapmadıkları için hükümsüz kılar; Malikiler ise bunu genel değil, asıl kişinin hükümleriyle geçersiz kılar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17822}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17823} Dinden dönme. Hanefiler: Eğer dinden dönenin savaş bölgesine katıldığına hükmederse, iradesi geçersiz sayılır ve düşünce okuluna geri dönmez. Katılmadan önceki eylemleri Ebu Hanifa'ya göre askıya alınırken, Ebu Yusuf ve Muhammed'e göre geçerlidir. Maliki okulu ajanı günlerce tövbe ettikten sonra ajanın peleriniyle görevden alırken, Şafiiler bunu dinden dönenin mülkiyetini kaybetmesine dayandırır; bu görüşlerin en bariz olanı mülkiyetinin askıya alınmasıdır. Hanbali okulu ise, ajanın cübbesini geçersiz kılmaz, vekilin cübbesi de geçersiz kılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17824} Ahlaksızlık. Hanbaliler, ajanın ahlaksızlığını geçersiz kılmaz, ancak evlilik sözleşmesindeki teklif gibi ahlaksızlığa aykırı durumlar dışında geçersiz kılar; böylece ahlaksızlığı veya asıl kişinin ahlaksızlığı nedeniyle ayrılır; yetimin vasisi veya vakıf yöneticisi gibi güvenle gerekli konularda vekil olsa bile, kendi ahlaksızlığı ve asıl adamının ahlaksızlığı nedeniyle izole edilir. Şafi, ahlaksızlıktan korunma gerektiren durumlarda prensibin ahlaksızlığı nedeniyle geçersiz sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17825} Alkol. Şafii'lere göre, vekil vekil biri suçsuz içmeden sarhoşsa ayrılır; eğer sarhoşsa sayımla ayrılır ya da yoktur. Hanbalilere göre, sarhoşluk bunu geçersiz kılmaz, ancak evlilikteki zorunluluk gibi ona aykırı durumlar hariçtir. Hanefilere göre, sarhoşluk bunu geçersiz kılmaz; sarhoşken boşanan boşanma vekili yürürlüğe girmez ve sarhoşken satılan satış vekili bunu asıl kişiye karşı uygulamaz. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17826} Elden çıkarma yeri artık asıl kişiye ait değildir. Eğer asıl kişi dükkanı kendisi elden çıkarırsa, örneğin malları temsilci satmadan önce satarsa veya başkalarına hak kazanırsa ya da kadın kendisi evlenirse, acente geçersizdir. Maliki okuluna göre, müdür birine, temsilci diğerine satarsa, ilk satış bağlayıcıdır, ikinci satış ise tersiyetsizdir; ikinci kişi eşyayı ele geçirirse, bu durumda birinci kişi devam eder ve ikinci kişi ile alıcı ilk satıştan haberdar değilse birinci kişi geri verir. Hanbalis'e göre, temsilci, temsilcinin mülkünün kaybını kabul ettiği için asıl kişinin kendisine emanet edilen şeyi almasını kabul ederse, acente geçersiz sayılır. {alıntı:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.17826} Dükkan asıl kişiye geri dönerse ajans geri verir. Muhammed şöyle dedi: Geri döner, çünkü iptal yoluyla geri dönen kişi ilk sahibin sahibidir ve haklarını geri kazanır. Şafi'ler ve Ebu Yusuf, iptal edilmediğini çünkü asıl kişinin eyleminin ajanı işten çıkarmayı içerdiğini söylediler. İbn Abidin, mülk sahibi iptal edilenlere geri dönerse geri döndüğünü söyledi, geri alınmamış olana değil. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 17826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17827} Vekilin devrettiği şeye müdahalesi. Şafi'ler en doğru görüştedir, Hanbalılar ise düşünce okulunda: Hareket ihlal ile geçersiz sayılmaz, çünkü işlem izinle yapılmıştır ve güven ihlal ile geçersiz olur, tasarruf ise ipotek gibi kalır. Şafiiler ise daha doğru görüşün aksine, Hanbalılar ise bunun geçersiz olduğunu söyler, çünkü bu, depozito gibi bir emanet sözleşmesidir. Al-Mardawi şöyle dedi: Eğer vekil bir eşyaya müdahale ederek zarar görür ve ona tahsis edilirse, ajans geçersiz sayılır, ancak mülk kalırsa geçersiz sayılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17827} İnkar. Hanbalılar ve Hanefiler, vekilin veya asıl kişinin reddinin bunu geçersiz kılmadığını, çünkü reddin önceden izin reddi anlamına gelmediğini; Hanefiler fetvanın görüşünü savunur, Hanefiler ise fetvanı geçersiz kılar. Şafiiler şöyle derler: Unutkanlık veya gizlenme amacıyla yapılan inkar işten çıkarma değildir; eğer biri kasıtlı olarak amaçsızca reddederse, izole edilir. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.17828} Ajans yeri kaybedilmiştir. Ajans, asıl kişinin gözüne verilen zarar ve boşanma nedeniyle atanan kadının ölümüyle geçersiz sayılır. Hanefilere göre, ajans, vekil habersiz olsa bile, yetkili iki ortağın ayrılmasıyla ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17828} İşlemin tamamlanması. Ajan, emrin tamamlanmasıyla Hanefi okuluna göre izole edilir; örneğin borcu tahsil ettiğinde veya evlilik yaptığında. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17828} Çekilme belirtilir. Hanbalilere göre, ajans, patronun geri dönmesi, örneğin boşanmak üzere atanan eşin ilişkisi veya vekilin geri dönmesi, örneğin satın alma görevi verilen bir köleyi serbest bırakmak için acentelik kabul etmesi gibi bir gösterge olarak geçersiz sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17829}"
  id: "Agensi dengan fatha dan kasra dalam bahasa berarti pelestarian, dan dari sana 'al-Wakil' dalam nama Allah berarti 'penjaga'; dari sana lahir tawakkul, dan pendelegasian wewenang kepada orang lain. Agen disebut 'wakeel' karena prinsipnya menugaskan dia untuk melaksanakan urusannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17719} Dalam terminologi, definisi berbeda-beda: Hanafi mendefinisikannya sebagai representasi orang lain dalam tindakan yang sah dan diketahui, baik mewah maupun tidak mampu; Malikis mendefinisikannya sebagai representasi orang yang sah, tanpa otoritas atau ibadah, untuk orang lain di dalamnya, tanpa syarat kematiannya; Shafi'i mendefinisikannya sebagai memberi wewenang kepada seseorang melakukan sesuatu yang memungkinkan agen bertindak selama hidupnya; dan Hanbalis mendefinisikannya sebagai delegasi orang yang diizinkan mengenai hak Allah dan manusia yang ditangani oleh agensi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17720} Buku ini membedakan antara agensi dan istilah terkait: agensi, yaitu tindakan otoritas seseorang atas orang lain, yang dianggap lebih umum daripada agensi, sementara yang lain sinonim; wali, yaitu pelaksanaan kata oleh orang lain, baik mereka menginginkannya atau tidak, yang merupakan agensi hukum atau wajib, sementara agensi adalah agensi yang disepakati; kehendak, yang merupakan posisi diri seseorang dalam bertindak setelah kematian, selama agensi masih hidup; dan perwalian, yaitu wali yang didelegasikan oleh hakim kepada orang dewasa untuk bertindak demi kepentingan anak di bawah umur, atau perwalian suami atas istrinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 17720} Para ahli hukum sepakat tentang legitimasi agensi dan mengutipnya sebagai bukti dari Al-Qur'an: kisah sahabat Gua yang mengirim salah satu dari mereka ke Madinah, ayat dari dua putusan dalam Surah An-Nisa, dan putusan adalah agen atas nama pasangan menurut satu pendapat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17721} Dan dalam Sunnah: hadis Urwah ibn Abi al-Ja'd al-Bariqi yang memberinya dinar untuk membeli domba, hadis Hakim ibn Hizam tentang pembelian hewan kurban, hadis Jabir tentang agen di Khaybar, dan hadis Abu Rafi' tentang pernikahan Nabi dengan Maimunah ketika Rasul berada di antara mereka; para ahli hukum sepakat bulat tentang diperbolehkannya sejak zaman Nabi hingga hari ini. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17722} Mereka menggunakan akal, yaitu kebutuhan adalah panggilan terhadapnya, karena seseorang mungkin tidak mampu bertindak sendiri akibat sakit, usia tua, atau prestise; jika tidak diperbolehkan, hal itu akan mengakibatkan kesulitan di pengasingan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17722} Pilar agensi. Mayoritas ahli hukum percaya bahwa itu adalah bentuk, kontraktor (kepala sekolah dan agen), dan subjek kontrak (prinsipal), sementara aliran Hanafi berpendapat bahwa elemennya adalah tawaran dan penerimaan, karena keberadaannya mencakup dua pilar lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17722} Rumusnya adalah penawaran dan penerimaan, yang menyatakan kesepakatan bersama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17722} Penawaran. Mayoritas menganggap ini yang dikeluarkan oleh prinsipal dan menunjukkan izin untuk bertindak sebagai agensi, sementara Hanafi melihatnya sebagai apa yang pertama kali dikeluarkan oleh salah satu pihak kontrak untuk menunjukkan keinginannya untuk menetapkan kontrak. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17723} dan dipenuhi dengan segala sesuatu yang menunjukkan persetujuan dari agensi, melalui kata-kata, tulisan, pesan, atau isyarat orang bisu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17723} Dari kata-kata eksplisit: 'Saya telah mendelegasikan Anda,' 'Saya telah mempercayakan Anda,' 'Saya telah memberi izin,' 'Saya telah memberi wewenang kepada Anda,' atau 'Saya telah menunjuk Anda sebagai wakil saya,' atau 'Anda adalah agen saya.' Adapun masalah 'menjualnya,' hal ini berlaku menurut Hanafi, Shafi'i, Hanbali, dan Maliki jika memang adat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17724} Adapun kata-kata 'Saya akan mengangkatmu,' 'Saya akan mempercayakan Anda,' 'Saya telah mengandalkan Anda,' dan 'Saya telah mengandalkan Anda,' keputusan tidak diputuskan oleh Syafi'i karena kemungkinan mereka, kecuali ada kata eksplisit yang ditambahkan ke dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17725} Lembaga ini didirikan melalui surat menurut Hanafi, Maliki, dan Shafi'i, dan agen adalah agen setiap kali berita sampai dan diterima, baik informan itu adil maupun tidak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17725} Tawaran ini dipenuhi dengan tulisan yang jelas, dengan gestur yang dapat dimengerti dari orang bisu, dengan kata kerja yang menunjukkan izin menurut Hanbali, dan dengan apa yang biasa dianggap sebagai pernyataan di antara Maliki, seperti suami yang membuang harta istrinya, yang merupakan sarjana diam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17726} Diam tidak dianggap sebagai penegasan menurut Hanafi, Shafi'i, dan Hanbali; siapa pun yang melihat orang asing menjual propertinya dan tetap diam tidak menjadi agen karena diamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17726} Penerimaan. Penerimaan dicapai secara lisan, seperti ketika agen mengatakan 'Saya menerima,' atau dengan kata-kata yang terasa diterima; Hanafi dan Shafi'is menambahkan bahwa agen tidak boleh menolaknya, karena jika ia mengembalikannya setelah tawaran, agensi tidak ditetapkan, dan jika ia menerima kemudian, kecuali tawaran dan penerimaan diperbarui. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17727} Ada tiga pendapat mengenai penerimaan tindakan tersebut: mayoritas (Hanafi, Maliki, dan Shafi'i dalam pendapat yang paling benar, dan Hanbali) berpendapat bahwa tindakan tersebut dipenuhi oleh setiap tindakan yang menunjukkannya, seperti tindakan agen yang diperintahkan oleh prinsipal; Shafi'i dalam satu pandangan, dan Hanbalis menurut Wazafir bahwa tindakan hanya diwujudkan melalui kata-kata; dan Shafi'i berbeda dalam pandangan ketiga: jika bentuk tawaran adalah perintah seperti frasa \"jual dan beli,\" penerimaan dicapai oleh tindakan, dan jika itu adalah bentuk kontrak seperti \"dan agensi Anda,\" maka kata-kata itu diperlukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17727} Penerimaan hanya berlaku dengan alamat tertulis yang jelas dan tanda yang diketahui dari orang bisu. Menurut Hanafi, diam agen diterima dan penolakannya ditolak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17727} Jika penerimaan tawaran tertunda, mayoritas ahli hukum (Hanafi, Hanbali, Shafi'i di sekolah dan Maliki dalam salah satu dari dua pendapat) mengoreksinya, karena izin tetap ada selama kepala sekolah tidak menariknya, yang juga diperbolehkan; Shafi'i membatasi ini dengan tidak mensyaratkan waktu tindakan, dan jika ditentukan dan ada kekhawatiran kelewatan, penerimaan segera diberikan, demikian pula jika hakim menyerahkannya setelah dikonfirmasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17728} Malikis dalam pendapat kedua dan Abu Hamid al-Marwudhi dari Sy'i berpendapat bahwa penerimaan adalah segera karena agensi tersebut adalah kontrak seumur hidup, sehingga penerimaan adalah segera seperti penjualan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17728} Al-Mazari mengatakan bahwa penyelidikan bergantung pada niat dan adat: Apakah maksud istilah-istilah ini adalah untuk segera mendapatkan jawaban, atau harus dipercepat atau ditunda? {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17728} Jenis agensi berdasarkan waktu yang dampaknya muncul: tercapai, yang tidak bersyarat atau ditambahkan waktu, ditangguhkan, ditambahkan ke masa depan, dan sementara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17728} Kata-kata yang telah selesai, yang tidak melekat pada suatu syarat maupun ditambahkan pada waktu, seperti pernyataan kepala sekolah \"Otoritas Anda untuk menjual rumah ini-dan-itu,\" yang benar berdasarkan kesepakatan para ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17729} Kata-katanya bersifat bersyarat. Para ahli hukum berbeda pendapat tentang keabsahannya dengan dua pendapat. Yang pertama menurut Hanafi dan Hanbalis menurut pandangan yang benar, sementara Shafi'i memegang pandangan paling benar bahwa itu otentik, seperti pepatah \"Ketika peziarah tiba, jual makanan ini.\" Mereka mengutip hadits Ibn Umar mengenai perintah Zayd ibn Haritha selama Pertempuran Mu'tah, kemudian Ja'far, kemudian Abdullah ibn Rawaha, jika dia tewas sebelum dia. Karena ini adalah kontrak, ini dianggap sebagai keputusan bagi agen, yaitu kelayakan disposisi, sehingga lebih mirip wasiat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17729} Yang kedua menurut Shafi'i adalah pandangan paling benar, sementara Hanbal mengatakan itu tidak sah; Al-Mawardi mengatakan bahwa membuat agensi bergantung pada syarat dan tenggat waktu adalah tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17729} Shafi'i mengizinkan prinsipal menyelesaikan agensi dan menetapkan syarat untuk transaksi, seperti frasa \"jual setelah sebulan,\" karena itu adalah penundaan dan tidak ada komentar; Al-Ghazali mengutip orang Irak bahwa kedatangan si anu atau berlalu satu bulan adalah syarat untuk transaksi, bukan kontrak, jadi agen harus mematuhi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17729} Bentuk siklikal, dan bentuknya adalah ketika prinsipal berkata, \"Saya telah mengizinkan Anda menjual properti ini, dan setiap kali saya memecatmu, Anda adalah agen saya,\" dan agensi diperbarui setiap kali ia dicopot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17730} dan disahkan oleh Hanafi dan Hanbalis sesuai dengan pandangan yang benar, berdasarkan fakta bahwa lembaga menerima penangguhan, dan prinsipal berhak memberhentikan agen kapan pun ia menginginkan menurut Hanafi; pemecatan dilakukan sesuai pernyataan Hanbali: \"Saya telah memberhentikan Anda, dan setiap kali saya mengangkatmu, saya telah memberhentikan Anda.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17730} Ibn Taymiyyah menyangkal keabsahannya karena membuat kontrak yang diperbolehkan menjadi mengikat. Tujuan penangguhan adalah untuk mencegah lembaga diberikan kekuasaan, bukan untuk membatalkan kontrak sebelum kontrak disepakati. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17730} Syafi'i mengatakan bahwa itu berlaku dalam dua cara segera. Yang paling benar adalah yang benar: jika dia dipecat dan agen atau agen tahu, maka ada dua cara untuk mengulang setelah pemecatan, yang paling benar adalah larangan. Jika dia mengatakan \"setiap kali aku melepaskanmu,\" pengulangan itu diulang, dan jika dia mengatakan \"jika\" atau \"ketika,\" hanya sekali. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17731} Formulir yang ditambahkan ke masa depan, seperti pernyataan kepala sekolah, \"Saya telah mempercayakan Anda untuk menjual ternak saya pada bulan Ramadan\" atau \"Saya telah memberi izin kepada Anda untuk menjual rumah ini besok,\" yang diizinkan oleh Hanafi dan Hanbali. Hanafi mengakui bahwa agen menjadi agen mulai besok, bukan sebelumnya. Syafi'i setuju dengan mereka karena lembaga tersebut segera selesai dan transaksi bersyarat pada waktu yang akan datang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17731} Formulir bergantung pada waktu, seperti frasa \"Ketika awal bulan tiba, saya telah mengizinkan Anda menjual rumah saya,\" yang tidak sah menurut Shafi'i karena menangguhkan kekuasaan pada batas waktu tidak sah, dan benar menurut Hanafi, Hanbali, dan Shafi'i, bertentangan dengan pandangan yang lebih benar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17731} Perbedaan Hanafi antara penjumlahan dan penangguhan: penambahan adalah sebab di mana kontrak segera disepakati jika keputusannya tertunda oleh waktu, sedangkan syarat tidak dapat menjadi penyebab keputusan segera, sehingga agensi hanya diselesaikan ketika kondisi tersebut ada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17731} Bentuk sementara, seperti frasa \"Anda adalah agenku selama sebulan,\" yang benar di kalangan ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17732} Mereka berbeda pendapat tentang kelanjutannya setelah waktu: para Syafi'i tidak tinggal setelahnya. Menurut Hanafi, ada dua narasi tentang seseorang yang dipercaya menjual rumah \"hari ini\" dan menjualnya besok. Pandangan yang benar adalah bahwa rumah itu tidak tetap ada, dan tetap ada karena hari itu disebut untuk mempercepat, bukan waktu. Penulis Manhat al-Khaliq mengutip Al-Bazzaziyya yang mengatakan bahwa agensi berlangsung sepuluh hari dan tidak berakhir dengan berlalunya sepuluh hari, yang lebih tepat. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17732} Penggabungan antara agensi dengan kondisi. Jika syarat tersebut tidak sah, maka Hanafi, Ahmad dalam narasi paling menonjol mereka, dan Ibn Abi Layla menyatakan bahwa agensi tidak membatalkan kondisi tidak sah, sementara Shafi'i berpendapat bahwa syarat batal membatalkan agensi, seperti pepatah prinsipal, \"Tahan barang yang dijual dari pembeli,\" karena menahan hak dari seseorang yang layak dimiliki adalah dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17733} Al-Zarkashi mengatakan bahwa kontrak yang diperbolehkan seperti kemitraan, agensi, dan spekulasi; ketidakabsahannya tidak menghalangi pengaruh untuk melepaskannya dengan izin, tetapi karakteristiknya dibatalkan oleh ketidakabsahannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17733} Manfaat korupsi adalah hilangnya upah yang disebutkan dan kembali ke upah yang setara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17733} Beberapa Hanbal percaya bahwa kewenangan batal sebagai deposit karena hilangnya kredit. Abu Muhammad al-Shafi'i berkata bahwa izin tidak terpisah dari keagen, jadi ketidakberlakuannya berarti ketidakabsahan otorisasi tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17734} Sifat kontrak agensi, yaitu, apakah kontrak itu mengikat atau diperbolehkan. Pendapat pertama, menurut Hanafi, Shafi'i, Hanbali, dan beberapa Maliki, adalah bahwa kontrak itu sah dari kedua belah pihak karena merupakan donasi sukarela dan tidak perlu. Prinsipal mungkin melihat manfaat meninggalkan apa yang telah ditugaskan atau memberi wewenang kepada orang lain, dan karena agen mungkin tidak sepenuhnya tersedia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17734} Hanafi dan Malik membuat pengecualian jika lembaga berkaitan dengan hak orang lain, sehingga mereka berkewajiban, seperti agen sengketa, untuk meminta diskon, dan agen menjual gadai di hadapan penagih hipotek. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17734} Para Hanafi mengatakan bahwa tiga isu bercabang untuk tidak wajib: opsi suatu syarat tidak mencakupnya, juga tidak diatur oleh agensi yang disengaja, dan agen dapat mengundurkan diri kapan pun ia mau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17734} Pendapat kedua adalah bahwa jika itu untuk disewa sebagai sewa, maka mengikat kedua belah pihak, dan syarat sewa harus digabungkan. Ini adalah pendapat eksplisit dari para Shafi'i dan Malik dalam pandangan ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17735} Pendapat ketiga, yang dipegang oleh beberapa Maliki kemudian, adalah bahwa hal itu wajib bagi agen meskipun tanpa pembayaran, berdasarkan kewajiban hadiah meskipun tidak diterima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17735} Jika untuk bentuk komisi, ada tiga pendapat di antara Maliki: kewajiban dari kedua pihak, izin dari kedua pihak, yang merupakan pandangan yang diterima di antara para Syafi'i, dan mengikat dari pihak pembuat, bukan dari pihak yang diterima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17735} Pilar kedua: kontraktor, yang merupakan prinsipal dan agen. Pertama: Prinsipal, yaitu seseorang yang mengangkat orang lain menggantikan posisinya dalam transaksi yang sah dan diketahui, dan diwajibkan bahwa dia memiliki tindakan tersebut dan aturannya terikat olehnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17735} Para ahli hukum sepakat bahwa tidak diperbolehkan memberikan agensinya kepada orang yang sakit jiwa, gangguan jiwa, tidak sadarkan diri, anak yang tertidur, atau anak yang tidak diketahui sama sekali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17735} Diperbolehkan mendelegasikan anak yang memiliki hak istimewa dalam transaksi yang menguntungkan semata-mata berdasarkan kesepakatan, sementara transaksi yang melibatkan manfaat dan kerugian sah menurut Hanafi, Maliki, dan Hanbalis dengan izin wali, dan Shafi'i membatalkan mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17736} Tidak diperbolehkan bagi orang bodoh untuk berada di bawah wali dalam urusan yang tidak independen, tetapi diperbolehkan bagi mereka yang independen dalam urusan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17736} Menurut mayoritas ahli hukum, tidak diperbolehkan mendelegasikan seorang wanita untuk menikah karena dia tidak menikah sendiri dan oleh karena itu tidak menunjuk seorang pun dalam hal itu. Hal ini diizinkan oleh Hanafi dan Maliki dalam beberapa kasus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17736} Mengenai pemberitahuan kepada murtad, ada tiga pendapat: pertama, menurut mayoritas ahli hukum (Shafi'i dalam pendapat yang paling jelas, Hanbali, dan Abu Hanifa), bahwa itu tergantung pada kembalinya dia ke Islam; jika dia memeluk Islam, itu sah, dan jika dia mati, dibunuh, atau berperang sebagai murtad, itu tidak sah; kedua, menurut dua Sahabat dan para Shafi'i, yang menyatakan bahwa itu sah dan sah, dan Hanafi menambahkan bahwa murtad dapat diberi wewenang berdasarkan kesepakatan mereka; dan ketiga, menurut para Shafi'i, menurut pandangan yang dikutip oleh Zakariya al-Ansari dan al-Shabramlsi, bahwa itu tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17737} Mengenai izin seorang Muslim dhimmi untuk menjual anggur dan daging babi: para Shafi'i, Maliki, Hanbali, dan kedua Sahib berpendapat bahwa hal itu tidak sah, karena syarat agensi adalah prinsipal memiliki hak untuk didelegasikan, Muslim tidak berhak menjualnya, dan yang kehilangan barang tersebut tidak memberikannya. Abu Hanifa memegang pandangan yang benar karena cukup bahwa prinsipal memiliki kapasitas untuk melaksanakan tugas yang memberinya hak untuk mendelegasikan orang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17737} Mengenai mengizinkan mahram untuk sah dalam pernikahan: menurut mayoritas ahli hukum, hal itu tidak diperbolehkan karena prinsipal tidak membuat kontrak selama prinsipal berada di ihram, dan otoritas Hanafi mengizinkannya secara mutlak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17737} Hanbalis menyatakan bahwa agensi tidak sah jika agen tidak mengenal prinsipnya, dengan mengatakan kepadanya \"Kamu adalah agenmu,\" dan dia tidak diatribusikan maupun digambarkan sebagai pembeda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17737} Agen. Ia membutuhkan apa yang diminta dari prinsip akal; tidak diperbolehkan menunjuk orang gila, orang dengan gangguan jiwa, atau anak yang tidak dapat dikenali berdasarkan kesepakatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17737} Mengenai kondisi pubertas: Hanafi dan Hanbal mengizinkan hak seorang anak terhormat yang memahami dan berniat kontrak, dan hak kontrak kembali kepada prinsipal, bukan kepadanya. Argumen mereka adalah bahwa Nabi menikahkan um Salama dengan Amr ibn um Salama saat ia masih anak-anak; syafi'i melarangnya karena ia tidak bertanggung jawab dan tidak memiliki wewenang untuk mengatur haknya sendiri, sehingga ia tidak dapat mengendalikannya atas orang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17738} Diperlukan agar agen tersebut spesifik. Jika seseorang berkata, \"Saya telah memberi wewenang kepada salah satu orang untuk menjual barang,\" agensi tersebut tidak sah karena ketidaktahuan agen tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 17738} Ibn Najim menyebutkan bahwa kreditur atas pernyataan kotanya, \"Siapa pun yang membawa tanda sekian ini, bayarlah apa yang aku miliki kepadanya\" adalah surat kuasa yang tidak diketahui dan tidak sah, sehingga debitur tidak dibebaskan dengan membayar kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17739} Pengetahuan agen tentang agensi. Menurut Hanafi, pengetahuan tentang agen umumnya adalah syarat: baik agen maupun orang yang berurusan dengannya tahu; jika agen menjual sebelum dia tahu dan pembeli mengetahui agen itu, penjualan tidak diperbolehkan sampai agen atau agen mengizinkannya setelah mengetahui hal itu. Jika dia memberitahunya melalui agensi, dia menjadi agen berdasarkan kesepakatan. Jika seseorang memberitahunya untuk tidak adil, dia menjadi agen. Jika dia tidak mempercayainya, dia bukan agen menurut Abu Hanifa, yang menurut Abu Yusuf dan Muhammad adalah agen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17740} Hanbalis berpendapat bahwa pengetahuan tidak diperlukan, karena pertimbangan dalam kontrak adalah untuk hal yang sama, yang diambil dari sudut pandang paling jelas menurut para Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17740} Keadilan agen tidak diperlukan dalam kasus umum kecuali dalam kontrak khusus seperti pernikahan, dan maskulinitasnya tidak diperlukan dalam kasus umum kecuali dalam beberapa kontrak seperti pernikahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17741} adalah subjek agensi, yang merupakan tindakan yang diizinkan oleh prinsipal kepada agen dengan kepemilikan atau perwalian. Syaratnya menurut Shafi'i adalah tiga: bahwa harus diketahui dalam beberapa hal, bahwa lembaga harus diterima, dan bahwa prinsipal memilikinya pada saat delegasi diwakili. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17740} Agensi dibagi berdasarkan tempat usaha menjadi swasta dan publik. Khusus adalah ketika agensi diberi wewenang oleh suatu disposisi tertentu, dan agen hanya bertindak berdasarkan kesepakatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17741} dan konsensus umum, ada perbedaan pendapat: Hanafi dan Maliki mengizinkannya secara umum dengan rincian. Hanafi mengatakan bahwa frasa \"Engkau adalah agenku dalam setiap kecil dan banyak\" adalah agen hanya melalui hafalan, dan jika dikatakan \"dalam segala hal, masalahmu diperbolehkan,\" maka menjadi agen dalam semua transaksi keuangan seperti penjualan, pembelian, hadiah, dan amal. Mereka berbeda pendapat mengenai perceraian, pembebasan, dan wakaf, dan putusan mereka adalah bahwa dia tidak memilikinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17741} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17742} Keluarga Malik berkata bahwa masalah ini tidak hanya diselesaikan dengan mengatakan 'Aku telah menunjukmu,' tetapi perkara ini didelegasikan melalui delegasi. Apa yang melibatkan pertumbuhan kekayaan diperbolehkan, dan apa yang dilakukan demi imbalan akhirat tidak diperbolehkan kecuali dengan izin yang jelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17742} Adapun para Shafi'i dan Hanbali, delegasi umum tidak sah karena banyaknya ketidakpastian. Oleh karena itu, frasa 'Aku telah menunjukmu dalam segala hal kecil dan banyak untukku' tidak valid, dan juga benar untuk mengatakan 'Aku telah mempercayakan kamu untuk menjual kekayaanku dan menagih utangku,' meskipun aku tidak mengetahui kekayaan dan hutangnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17742} Aturan tentang apa yang sah untuk tunduk pada agensi: Setiap kontrak yang dibuat seseorang sendiri dapat diotorisasi oleh orang lain, karena seseorang mungkin tidak dapat bertindak dalam situasi tertentu dan oleh karena itu perlu didelegasikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17743} Para ahli hukum telah sepakat tentang diperbolehkannya agensi dalam membeli dan menjual karena kebutuhan adalah suatu keharusan. Nabi melakukan ini ketika ia menunjuk Urwah al-Bariqi untuk membeli domba dan memberikan Hakim ibn Hizam sebuah dinar untuk membeli kurban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17743} Mereka juga sepakat tentang diperbolehkannya agen dalam transfer, hipotek, jaminan, kemitraan, deposito, mudarabah, ja'ala, musaqah, leasing, pinjaman, wasiat, pembatalan, pembebasan, pertukaran, penghilangan, dan preemption, karena itu berarti penjualan dalam kasus kebutuhan agensi; serta dalam jaminan, penyelesaian, dan hadiah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17743} Para ahli hukum sepakat tentang keabsahan agensi dalam kontrak pernikahan dengan seorang pria, dengan mengutip kuasa Nabi Amr ibn Umayyah dan Abu Rafi' dalam menerima pernikahan untuknya, dan bahwa kebutuhan tersebut adalah suatu keharusan baginya karena prinsipal mungkin perlu menikah dari tempat yang tidak dapat dia kunjungi, dan pernikahan Nabi dengan um Habiba, yang saat itu berada di Abyssinia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17744} Mereka sepakat tentang diperbolehkannya agensi dalam tindakan ibadah keuangan seperti zakat, amal, janji, dan penebusan, karena Nabi mengirim agen-agennya untuk mengumpulkan dan membagikan sedekah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17745} Mereka sepakat tentang kelayakan kuasa dalam perceraian, pengembalian, dan khula, karena kebutuhannya seperti kebutuhan surat kuasa dalam penjualan dan pernikahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17744} Di mana surat kuasa tidak berlaku berdasarkan kesepakatan. Kesaksian: Tidak diperbolehkan mendelegasikan di dalamnya, karena menyangkut saksi mata atas apa yang ia lihat atau dengar, dan karena didasarkan pada pengabdian dan kepastian; jika ia ditunjuk sebagai wakil, perwakilan tersebut menjadi saksi atas kesaksiannya dan melakukan apa yang didengarnya dari saksi asli, bukan sebagai agen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17744} Dan sumpah serta sumpah, karena berkaitan dengan mata pengucap sumpah dan pengucap sumpah, serta sumpah serapah, ira, dan sumpah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17745} Dan dosa seperti pembunuhan, pencurian, pengambilalihan, dan fitnah, karena dilarang dan tidak dapat dilakukan oleh pihak utama atau agen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17745} dan tindakan ibadah fisik seperti shalat, puasa, dan penyucian dari ketidaksucian, karena berkaitan dengan tubuh orang yang wajib melakukannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17745} Apa yang diperdebatkan. Haji: Tidak diperbolehkan mendelegasikan kuasa kepada seseorang yang mampu melaksanakan Haji sendiri, tetapi untuk yang tidak mampu, surat kuasa dijelaskan sebagai gantinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17745} Dan Umrah: Secara umum diperbolehkan untuk melakukannya atas nama orang lain secara tidak langsung. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.. 17745} Pernikahan oleh seorang wanita: Mayoritas ahli hukum melarang seorang wanita dipercayakan atau bergantung padanya dalam pernikahan, sementara Hanafi mengizinkannya untuk wanita yang bebas, dewasa, dan waras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17746} Dan zihar: dilarang oleh mayoritas, tetapi Shafi'i mengizinkannya berbeda dengan pandangan yang lebih benar. Ibn Abd al-Salam dari Malikis menganggapnya seperti perceraian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17746} Dan memperoleh hal-hal yang diperbolehkan seperti menghidupkan kembali tanah mati, berburu, dan menggali logam: hal ini diizinkan oleh Maliki dan Shafi'i dalam mazhab Azhar dan Hanbali, dan Hanafi serta beberapa Shafi'i dan Hanbal melarangnya karena kepemilikan menjadi milik agen dalam meletakkan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17746} Dan pengakuan hak: diizinkan oleh Hanafi, Maliki, Hanbali, dan Shafi'i bertentangan dengan pandangan paling otentik, dan Shafi'i melarangnya menurut yang paling benar dan Tahawi karena merupakan pernyataan kebenaran seperti kesaksian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17747} Perselisihan: diizinkan oleh Maliki, Shafi'i, Hanbali, dan dua pemilik dalam agama, properti, dan semua hak, baik yang hadir maupun tidak ada, apakah lawan setuju atau tidak. Aliran Maliki membuat pengecualian jika agen adalah musuh lawan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17747} Mereka berargumen bahwa Ali ibn Abi Talib dan setiap 'Aqila bersama Abu Bakr, dan bahwa kebutuhan itu adalah panggilan untuk itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17747} Abu Hanifa mengatakan bahwa surat kuasa tidak diperbolehkan dalam sengketa kecuali dengan persetujuan pihak lawan, kecuali prinsipal sakit atau absen selama tiga hari atau lebih, karena kehadiran kepala sekolah di dewan arbitrase adalah hak bagi lawannya; arahannya adalah bahwa gugatan adalah laporan yang bisa benar atau salah, sehingga jawabannya hanya wajib dalam kasus kebutuhan, dan kebutuhan ada dalam kasus sakit atau perjalanan kepala sekolah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17748} Al-Jassas menyebutkan bahwa tidak ada pemisahan yang jelas dalam narasi antara pria dan wanita, dan ulamawan kemudian lebih memilih mendelegasikan wanita kepada wanita yang dibius. Ibn Abi Layla mengatakan hanya diperbolehkan mengizinkan seorang perawan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17748} Menetapkan dan menyelesaikan pembalasan: Maliki, syafi'i, Hanbali, Abu Hanifa, dan Muhammad ibn al-Hasan mengizinkan hak untuk membuktikannya, tetapi Abu Yusuf tidak setuju dan hanya mengizinkan dari kepala sekolah, karena keraguan dapat dihindari dalam kasus hudud dan qisas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17748} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17749} Dalam Istifya al-Qisas: Maliki, Shafi'i, dan Hanbal di sekolah mengizinkan hal ini di hadapan kepala sekolah dan saat ia tidak hadir; Hanafi dan beberapa Shafi'i serta Hanbal tidak mengizinkan jika kepala sekolah tidak hadir karena kemungkinan pengampunan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17749} Mendirikan dan melaksanakan hudud: Para Hanbal di sekolah mengizinkan badan untuk menetapkan hukuman hadd perzinahan, berdasarkan kisah Anis. Abu Al-Khattab di antara mereka mengatakan hukuman itu tidak sah; para Syafi'i tidak mengizinkannya dalam hudud Allah kecuali untuk hukuman fitnah, karena kebenaran adalah milik Allah dan Dia memerintahkan untuk mengusirnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17749} Dalam hal pengisian ulang, Maliki, Shafi'i, dan Hanbal mengizinkannya, dan mereka mengutip perintah Nabi untuk melempari kambing dan penugasan Uthman Ali untuk menetapkan hukuman minum pada al-Walid ibn Uqbah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17750} Hanafi mengatakan bahwa hak Allah ada dua jenis: penegasan: tidak diperbolehkan mendelegasikan dalam hal yang tidak memerlukan perselisihan, seperti hukuman perselingkuhan dan alkohol, dan diperbolehkan dalam kasus yang memerlukannya, seperti hukuman pencurian dan fitnah menurut Abu Hanifa dan Muhammad, yang dilarang Abu Yusuf; dan penyelesaian dalam pencemaran nama baik dan pencurian diperbolehkan jika terdakwa atau yang dicuri hadir, dan guru-gurunya berbeda jika tidak ada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17751} Ketentuan Agensi. Tugas ini adalah agen untuk melaksanakannya dalam batas yang diizinkan oleh prinsipal atau dibatasi oleh Syariah atau adat, memberikan informasi yang diperlukan kepada prinsipal, menyediakan akun agensi, dan mengembalikan apa yang dimilikinya kepada prinsipal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17751} Agen swasta diterbitkan secara mutlak dan terbatas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17751} Salah satu jenisnya adalah agen berdasarkan penjualan. Menurut Abu Hanifa, agen tidak terikat oleh pembatasan kecuali dia dituduh. Dia berhak menjual dengan sedikit atau banyak, tunai dan tunai, dan untuk dijual, karena kelalaian adalah bahwa kata-kata mutlak dilakukan secara mutlak, dan karena penjualan dilakukan dengan penipuan berat untuk tujuan membeli apa yang lebih menguntungkan dan adat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17751} Kuasa mutlak dalam penjualan. Para ahli hukum berbeda pendapat dalam membatasinya dengan dua pendapat. Yang pertama menurut Abu Hanifa, yaitu agen mutlak tidak terikat oleh pembatasan apa pun kecuali dia dituduh, sehingga dia berhak menjual dengan sedikit atau banyak, dengan uang tunai dan hadiah, karena kata mutlak berlaku sepenuhnya untuknya, dan karena menjual dengan ketidakadilan besar demi membeli apa yang lebih menguntungkan adalah kebiasaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17752} Yang kedua adalah untuk mayoritas ahli hukum (Maliki, Shafi'i, dan Hanbali), yaitu agen mutlak dibatasi oleh pembatasan, termasuk: menjual dengan mata uang lokal, karena mata uang umum merujuk pada mata uang lokal, dan menjual dengan harga serupa di mana orang tidak mempersengketakan hal yang sama. Jika dijual dengan harga lebih rendah, menurut Maliki, pokok diberikan opsi meskipun kecil, dan untuk jumlah kecil, setengah persepuluhan atau kurang. Menurut Hanbali, penjualan sah dan agen bertanggung jawab atas kekurangan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17753} termasuk menjual untuk uang, bukan untuk kebetulan menurut Maliki, Hanbali, dan dua Sahabat, dan tidak menjual sebagai hadiah menurut Maliki, Shafi'i, dan Hanbali, dan diperbolehkan menurut Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17753} dan tidak menjual untuk keuntungan menurut Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17753} Agen menjual untuk dirinya sendiri. Mayoritas ahli hukum (sekolah Hanafi, Shafi'i, dan Hanbali di sekolah tersebut serta Malik di sekolah yang dipercaya) melarang hal ini, karena kebiasaan dalam penjualan adalah seseorang menjual dari orang lain, dan karena hal ini melibatkan tuduhan; Malili dan Hanbal mengizinkannya jika kepala sekolah mengizinkan, dan sekolah Maliki membuat pengecualian jika keinginan terbatas atau penjualan dilakukan di hadapan kepala sekolah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17754} Dan dari Ahmad, ada narasi yang mengizinkan jika jumlah melebihi harga dalam panggilan dan orang lain mengambil alih panggilan tersebut, dan hakim memutuskan bahwa yang kedua mungkin wajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17754} Menurut Malikis, diperbolehkan jika ia tidak menyukai dirinya sendiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17754} Menjual agen kepada seseorang yang kesaksiannya tidak diterima. Menurut Hanafi, jika ia menjual dari seseorang yang kesaksiannya tidak diterima lebih dari nilainya, maka diperbolehkan; dengan harga lebih rendah, tidak diperbolehkan secara konsensus, dan ada dua narasi dengan nilai yang sama; kedua pemilik diizinkan menjual dari mereka dengan nilai yang sama kecuali dari budak atau jabatannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17754} Menurut Maliki, menurut pandangan terkenal, agen tidak boleh menjual kepada anak di bawah umur, orang bodoh, atau budak yang tidak berwenang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17755} Menurut para syafi'i, tidak diperbolehkan menjual kepada anaknya yang masih di bawah umur meskipun ia memiliki izin. Pandangan yang benar adalah bahwa diperbolehkan menjual anaknya demi aset dan cabang-cabangnya yang tidak cacat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17755} Menurut aliran pemikiran Hanbali, tidak diperbolehkan menjual kepada anak, ayah, atau jabatannya, tetapi diperbolehkan dalam kasus terakhir, dan titik perselisihan adalah jika prinsipal tidak memberikan izin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17755} Agen terbatas dalam penjualan. Agen terikat oleh syarat prinsipalnya melalui perjanjian. Hanafi mengatakan bahwa jika agen melanggar pembatasan prinsipalnya, ia tidak dapat menegakkannya kecuali dengan izinnya, kecuali perselisihan itu adalah kebaikan, dalam hal ini dianggap sebagai perjanjian yang bermakna. Jika ia berkata, \"Jual pakaian saya seharga seribu dirham,\" dan ia menjualnya kurang atau kurang dirham, maka itu tidak sah; jika ia menjualnya dengan harga lebih, maka itu sah; jika ia mengatakan \"jual dengan kredit,\" maka itu langsung berlaku; jika ia memerintahkan untuk dijual dengan diskon, maka itu berhenti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17756} Keluarga Malik berpendapat bahwa meningkatkan atau mengurangi penjualan tidak berarti opsi tersebut, karena itulah yang diinginkan, dan pelanggaran itu tidak membenarkan opsi kecuali untuk tujuan yang sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17756} Para Shafi'i dan Hanbalis berkata: Agen tidak memiliki wewenang untuk bertindak kecuali jika diwajibkan dengan izin, baik secara lisan maupun adat. Jika salah satu tindakan menyebabkan kerugian pada prinsipal, ia menahan diri, karena pepatahnya 'Tidak ada kerugian atau kerugian yang dibalas,' meskipun ada pertimbangan untuk itu, yang berarti nasihat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17756} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17757} Izin yang dibatasi pada waktu yang tidak melebihi waktu tersebut, terbatas pada tempat yang terkait dengan tujuan, dan terbatas pada pembeli tertentu tidak berlaku untuk orang lain kecuali agen tahu bahwa prinsipal tidak memiliki tujuan secara mandiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17758} Pelanggaran harga oleh agen. Dalam deskripsi: Jika ia memerintahkan agen untuk menjual secara kredit, ia langsung menjual. Mayoritas ahli hukum mengizinkan penjualan dan hal itu ditegakkan terhadap prinsipal karena prinsipal mencapai tujuan yang diinginkan dan agen meningkatkannya dengan baik. Hanbalis berpendapat bahwa jika prinsipal memiliki tujuan khusus dalam penundaan, penjualan dianggap tidak sah, dan Sy'i melarangnya jika prinsipal memiliki tujuan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17758} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17759} Jika ia diperintahkan untuk menjual barang nasi'id dengan harga tertentu dan menjualnya dengan uang tunai dengan harga lebih rendah, Hanafi, Shafi'i, dan Hanbalis tidak mengizinkan penjualan tersebut, sementara Malikis mengsyaratkan otorisasi resmi dari prinsipal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17759} Jika ia memerintahkan barang tersebut dijual sebagai nis'id, Hanafi, Shafi'i, dan Hanbal tidak mengizinkan penjualan karena mempercepat memiliki tujuan, sementara Maliki membuatnya bersyarat pada izin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17759} Menurut Shafi'i dan Hanbalis, agen hanya memiliki wewenang untuk bertindak sesuai dengan izin prinsipal, baik secara lisan maupun adat. Jika salah satu dari dua tindakan tersebut menyebabkan kerugian pada prinsipal, ia menahan diri, dan jika ada pertimbangan untuk itu, maka hal itu mengikat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17756} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17757} Izin dibatasi pada waktu yang tidak melebihi waktu tersebut, izin yang dibatasi pada tempat dengan tujuan tertentu tidak berlaku untuk orang lain, dan izin yang dibatasi untuk pembeli tertentu tidak berlaku untuk orang lain kecuali agen tahu bahwa prinsipal tidak memiliki tujuan secara mandiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17758} Jika dia memerintahkan dia untuk segera menjual komoditas itu seharga seribu dan menjualnya dengan seribu cicilan, dia tidak melaksanakannya; melainkan tergantung pada izin prinsipal, dan ini adalah pendapat Al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17760} Pelanggaran agen terkait jenis harga. Jika ia memerintahkan Hanafi, Shafi'i, dan Hanbali tidak mengizinkan penjualan tersebut dengan harga dinar dan dilelang, hakim Hanafi, Shafi'i, dan Hanbali tidak mengizinkan penjualan meskipun nilainya lebih tinggi, karena izin untuk satu jenis tidak sama dengan izin untuk jenis lain. Masyarakat Hanbal berpendapat bahwa jika ia memerintahkan seseorang menjual dengan dirham dan menjualnya dengan dinar, maka hal itu sah, karena secara kebiasaan diizinkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17760} Aliran pemikiran Maliki memberikan pilihan kepada kepala sekolah antara menandatangani dan mencabut dua jenis uang kertas adalah dua pendapat jika kedua koin berasal dari mata uang lokal dan nilainya sama; jika tidak, satu pendapat lebih disukai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17760} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17761} Jika ia memerintahkan agen untuk mencairkan dan menjualnya untuk penawaran, maka menurut Hanbalis dan Malikis, hal itu tidak berlaku karena penawaran tidak sama dengan harga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17761} Pelanggaran harga oleh agen. Jika ia menjual dengan harga lebih tinggi dari harga yang ditentukan dan kenaikan tersebut sama, mayoritas memvalidasi penjualan karena pelanggaran itu untuk kebaikan; para Shafi'i menambahkan bahwa ia harus menahan diri jika prinsipal secara eksplisit melarang kenaikan tersebut, tetapi menurut mereka, hal itu sama sekali tidak diperbolehkan karena pemilik memiliki tujuan untuk membenarkan pembagian harganya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17761} Jika dia menjual dengan harga kurang dari jumlah yang ditentukan, keluarga Malik akan menangguhkannya dengan izin agen, dan mengembalikan barang jika ada, atau nilainya jika terlewat. Para Shafi'i dan Hanbalis dalam satu narasi membatalkannya; Hanbal di sekolah mengoreksinya dengan tanggung jawab agen atas kekurangan tersebut. Mereka memiliki dua pendapat mengenai tingkat kekurangan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17761} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17762} Pelanggaran agen di lokasi. Jika tempat tertentu ditunjuk untuknya dan ia menjual di tempat lain: Shafi'i, Hanbali, dan Ibn Shas dari Malikis mensyaratkan kepatuhan jika tempat tersebut memiliki tujuan tertentu, seperti pasar yang dikenal dengan nilai tinggi atau harga tinggi; Hanbalis dan Shafi'i mengizinkan penjualan di tempat lain jika kedua tempat tersebut setara tujuan; Hanafi mensyaratkan kepatuhan dan bertanggung jawab kepada agen jika ia melanggar; Maliki membuat penjualan bergantung pada izin; dan Shafi'i menurut pandangan yang dipercaya tidak mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17762} Pelanggaran agen dalam waktu. Jika waktu tertentu ditetapkan dan dijual di tempat lain, Hanafi, Shafi'i, dan Hanbalis melarang penjualan dan tidak mengikat prinsipal, karena prinsipal mungkin lebih memilih penjualan selama waktu membutuhkannya daripada yang lain; Malikis memberikan pilihan kepada prinsipal antara pengesahan atau pengembalian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17763} Pelanggaran agen terhadap pembeli tertentu. Jika dia berkata, \"Hanya kepadanya,\" dan menjual kepada orang lain, mayoritas (Hanafi, Shafi'i, dan Hanbali) tidak mengizinkannya, sementara Shafi'i dan Hanbalis mengizinkannya jika agen tahu prinsipal tidak memiliki tujuan di mata pembeli; keluarga Malik lebih memilih prinsipal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17763} Pembubaran kesepakatan. Jika ia menjual beberapa barang tetapi tidak menjual sisanya, dan pemisahan tidak merugikan prinsipal, penjualan tersebut sah menurut Hanafi, Shafi'i, dan Hanbali, kecuali dilarang oleh Hanbali. Prinsip Maliki adalah prinsipal memiliki pilihan antara izin dan pengembalian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17764} Meskipun menyebabkan kerugian, Shafi'i dan Hanbalis membatalkannya, Maliki, Abu Yusuf, dan Muhammad menganggapnya dihentikan (mawsuf), dan Abu Hanifa mengizinkannya sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17764} Pelanggaran agen terhadap barang yang dijual. Jika ia menjual barang lain menggantikan barang yang ditentukan, Shafi'i dan Hanbal di Sahih membatalkan penjualan karena agen hanya memiliki apa yang diperlukan dengan izin. Mali dan Hanbal dalam satu narasi menjadikan prinsipal sebagai pelempar gratis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17764} Agensi dengan pembelian. Diperbolehkan menggunakannya secara umum, seperti dalam frasa \"Belikan apa yang kau inginkan,\" menurut Hanafi, Maliki, dan Ahmad dalam narasi lain, karena prinsipal mendelegasikan keputusan; Hanbalis dan Shafi'i melarangnya karena ia boleh membeli apa yang tidak mampu ia beli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17765} dan pembelian agen untuk pokoknya dari uang sendiri atau dari bagian pribadinya: kaum Hamalie melarangnya, dan Abu Yusuf serta Muhammad mengizinkan jika nilainya sama, lebih kecil, atau lebih, sehingga orang memperselisihan hal yang sama; meskipun agen itu umum, itu diperbolehkan berdasarkan kesepakatan mereka. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17765} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17766} Keluarga Malik dalam aliran pemikiran Al-Mu'tamid dan Hanbali melarang membeli dari apa yang mereka miliki dan mengizinkannya jika prinsipal mengizinkan, sementara Malikis mengizinkan membelinya dari kerabat kecuali itu adalah tuduhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17767} Para Shafi'i sepenuhnya melarangnya dari properti atau anaknya yang masih kecil, dan menurut pandangan yang paling benar, mereka mengizinkannya dari akar dan cabang dewasa yang mandiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17767} Agensi pembelian terbatas. Menurut Hanafi, diperbolehkan di istihsan, Malikiyya, dan Hanbalis di sekolah meskipun jenis barang tidak disebutkan, seperti mengatakan \"Belikan aku pakaian,\" sebagai analogi dengan pinjaman. Bukti mereka adalah hadits memberikan dinar kepada Hakim ibn Hizam untuk membeli korban, karena sedikit ketidaktahuan dalam agensi tidak menimbulkan perselisihan, karena dasarnya adalah luas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17767} Pembelian dengan agen terbatas dan pelanggarannya. Jika ia memerintahkan pembeli membeli dengan harga tertunda untuk menunda orang yang berlisensi, maka ia membeli secara tunai. Mayoritas (Hanafi, Maliki, Shafi'i menurut pandangan, dan Hanbalis di sekolah) mengizinkan pembelian dan prinsipal wajib jika agen tidak menaikkan harga, karena pelanggaran dalam bentuk tersebut adalah konsensus dalam makna; Shafi'i dalam pandangan yang dipercaya tidak memperbaikinya karena prinsipal tidak bermaksud berutang; dan Hanbalis berpendapat bahwa mereka mencegahnya jika prinsipal dirugikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17769} Jika dia membeli dengan ditunda dan diperintahkan untuk mengizinkan, Hanafi hanya mengharuskan agen, Maliki menganggap opsi sebagai pokok, Shafi'i membatalkan pembelian jika itu dengan propertinya, dan Hanbalis menganggapnya tunduk pada otorisasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17769} Pelanggaran jenis harga pembelian. Syafi'i dan Hanbal menolak pandangan ini, sementara Hanbal di sekolah mengizinkan menukar dirham dengan dinar dan sebaliknya, karena siapa pun yang setuju dengan dirham sudah puas dengan dinar yang ada, dan tidak diperbolehkan menukar tawaran dengan dua koin. Hanafi mengatakan bahwa jika ia memerintahkan pembeli membeli dalam dinar dan membeli dengan koin lain, ia tidak berkewajiban kepada prinsipal. Pandangan terkenal al-Karkhi adalah bahwa membeli dirham untuk dinar juga tidak mewajibkan prinsipal; Maliki menganggap ini sebagai syarat izin, dan ada dua pendapat terkenal mengenai kewajiban prinsipal membayar dirham untuk dinar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17770} pelanggaran setara harga. Jika pelanggaran dilakukan dengan alasan yang baik, seperti membeli hewan dengan harga kurang dari harga yang disebutkan, pembelian tersebut sah dan agen bertanggung jawab. Shafi'i dan Hanbalis membuat pengecualian jika prinsipal melarang kekurangannya. Jika tidak untuk kebaikan, Hanafi mengharuskan agen tetapi bukan prinsipal; Maliki mengharuskan prinsipal membayar kenaikan kecil, seperti satu banding dua puluh, dan membuat kenaikan besar bergantung pada izinnya, dan agen wajib jika mematuhinya; Shafi'i dan Hanbalis membatalkannya, tetapi Hanbal di sekolah mengoreksi dan agen bertanggung jawab atas kenaikan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17770} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17771} Pelanggaran pembeli. Jika ia membeli sesuatu selain yang diizinkan untuk dibeli, Hanafi menganggap pembelian tersebut untuk agen dan prinsipal tidak berkewajiban; Malikis membiarkan prinsipal memilih apakah ia mengembalikannya kepada agen dan membayar harga dari uangnya sendiri; Shafi'i membatalkannya jika ia membelinya dengan prinsipal, dan jika ia membelinya sendiri dan prinsipal tidak menunjukkannya, maka pembelian itu berlaku bagi agen meskipun prinsipal yang bermaksud. Hanbal mengoreksi pembelian dalam kewajiban dengan dua narasi mengenai kewajiban prinsipal, tetapi pembelian atas properti tersebut tidak sah menurut pandangan yang benar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17773} Default Pembeli. Hanafi membedakan antara qayymiyyat (nilai tradisional), sehingga kelebihan tidak berlaku untuk nilai utama dan nilai berbobot, sehingga prinsipal terikat sesuai dengan perintah Abu Hanifa dan beberapa riwayat Muhammad, dan semuanya wajib menurut Abu Yusuf dan Muhammad. Hanbal dan Maliki, bertentangan dengan pendapat yang terkenal, memegang prinsipal wajib jika ia membeli dua domba untuk satu dinar, masing-masing sama dengan satu dinar, sementara Hanbal membatasi ini dengan menyatakan bahwa salah satunya sama dengan satu dinar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17773} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17774} dan para Shafi'i membedakan antara deskripsi domba oleh orang yang ditunjuk atau tidak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17774} Membedakan transaksi dalam pembelian. Jika orang yang diperintahkan tidak biasanya mustahil dipisahkan dan tidak merugikan prinsipal, maka ahli hukum telah sepakat tentang diperbolehkannya penaklukan, sehingga prinsipal terikat oleh apa yang dibeli oleh agen. Hanbalis dan Shafi'i dalam satu kasus membatasinya dengan tidak mengatakan 'beli transaksi itu.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17774} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17775} Jika adat melarang diskriminasi atau menyebabkan kerugian, Hanafi dan Maliki membuatnya bergantung pada izin agen. Mayoritas Hanafi memvalidasi pembelian sisanya sebelum prinsipal membantah di pengadilan, sementara Zafar berpendapat bahwa pembelian hanya untuk agen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17775} Jika ia memerintahkan pembelian barang yang disebutkan, hanya diperbolehkan membelinya utuh, karena penjualan bebas dari cacat; jika ia membelinya secara cacat, menurut Hanafi, prinsipal tidak wajib jika status tersebut tidak terpenuhi, seperti membeli budak perempuan untuk melayani dan membeli tangan buta atau terputus, atau membeli hewan berkuda dan membeli mas kawin, melalui perjanjian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17777} Jika agen diberikan barang tersebut dan ia membelinya saat barang tersebut cacat dan agen tidak menyadari cacat tersebut, prinsipal wajib dan berhak mengembalikannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17777} Jika agen mengetahui cacat tersebut, prinsipal tidak berkewajiban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17777} Jika agen mengambil alih pembeli dan kemudian menemukan cacat, ia berhak mengembalikannya selama barang tersebut masih ada di tangannya; jika ia menyerahkannya kepada prinsipal, ia tidak mengembalikannya kecuali dengan izinnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 17777} Menurut Malikis, agen bertanggung jawab atas cacat jika ia mengetahui cacat tersebut dan membelinya atas properti, tetapi prinsipal hanya bertanggung jawab jika cacat tersebut kecil dan biasanya dimaafkan, serta pembelian tersebut merupakan kesenangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17778} Menurut Shafi'i mengenai pembelian dalam tanggung jawab: jika cacat sama dengan yang dibeli tanpa diketahui agen, maka prinsipalnya; jika diketahui, pandangan yang benar tidak berlaku untuknya; jika ia tidak melakukannya dan agen diberitahu, maka yang benar adalah prinsipal; jika ia tahu, maka yang benar adalah prinsipal; jika ia tahu, maka tidak berlaku. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17778} Jika ia membeli dengan uang prinsipal dan tidak mengetahui cacat tersebut, cacat jatuh pada prinsipal, tetapi jika ia tahu, cacat tersebut tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17778} Menurut Hanbalis: Jika agen mengetahui cacat tersebut, maka prinsipal tidak bertanggung jawab atas apa yang dibelinya sebagai kewajiban atas kewajiban tersebut; jika ia tidak tahu, pembelian diperbolehkan, dan agen serta prinsipal dapat mengembalikannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17779} Jika agen menunjuk barang dan membelinya saat cacat, jika agen mengetahui cacat sebelum pembelian, maka tidak diperbolehkan baginya. Jika ia membeli, ia wajib dan pokok tidak wajib kecuali jika ia setuju. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17779} Agen dalam kontrak korup. Jika ia diangkat dalam kontrak korup, agen tersebut tidak memiliki kontrak yang sah menggantikannya menurut Shafi'i, Hanbali, Muhammad, dan Zafar. Abu Hanifa dan Abu Yusuf mengizinkan sebagai preferensi jika menguntungkan prinsipal, seperti agen yang menjual seribu jika dijual seharga dua ribu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17781} Agen dan pelanggarannya terkait syarat opsi. Menurut Hanafi, jika ia memerintahkan agen untuk menjual dengan opsi selama tiga hari kepada prinsipal dan menjualnya tanpa opsi atau opsi yang lebih rendah, penjualan tersebut tidak sah dan ia bertanggung jawab. Jika ia diperintahkan untuk memiliki pilihan selama sebulan dan menetapkan tiga hari, menurut Abu Hanifa hal itu diperbolehkan sebagai preferensi, tetapi tidak untuk mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17781} Menurut syafi'i, jika seseorang mengatakan \"jual dengan syarat opsi\" dan menjual secara mutlak, maka itu tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17782} Menurut Hanbalis, agen dapat menetapkan opsi untuk dirinya dan agennya, tetapi ia tidak memiliki syarat untuk pihak kontrak, karena mengikat prinsipalnya apa yang tidak ia wajibkan untuk lakukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17782} Pengakuan agen atas sengketa. Maliki, Shafi'i, Hanbali, dan Zafar mencegahnya, karena pengakuan menyelesaikan perselisihan, sehingga agen tidak memiliki otoritas atasnya, dan karena masalah tersebut tidak berlaku untuknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17782} Abu Hanifa dan Muhammad hanya mengizinkannya di hadapan hakim, kecuali hudud dan qisa. Analogi mereka juga diperbolehkan dengan yang lain, dan Abu Yusuf mengizinkannya mutlak; jika prinsipal menolak pengakuan, pengakuan agen tidak sah dan mengecualikan agensi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17783} Agen yang disengketakan tidak memiliki hak untuk mendamaikan, membebaskan, menjual, memberikan, atau menunda hak tersebut berdasarkan kesepakatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17783} Agen untuk mengambil alih hak tersebut ditolak oleh haknya. Hanbalis dalam mazhab Hanbali dan Shafi'i berada di satu pihak: Mereka membuat agen yang bertanggung jawab membuktikan hak tersebut karena ia hanya bisa memperoleh kepemilikan melalui dirinya. Abu Yusuf, Muhammad, Maliki, dan Hanbal telah mencegahnya dalam satu kasus, dan Shafi'i memiliki kasus lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17784} Izin untuk mengambil alih bukanlah izin dalam sengketa, baik secara lisan maupun kebiasaan, karena siapa pun yang setuju untuk mengambil tidak selalu puas dengan sengketa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17784} Abu Hanifa membedakan antara agen dengan menerima properti, sehingga ia bukan pihak dalam klaim pembelian atau sejenisnya oleh tergugat, dan agen dalam menerima utang, sehingga ia bertanggung jawab karena utang tersebut adalah transaksi yang dimiliki oleh agen dalam sengketa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17785} Mengenai hak agen untuk bersengketa dalam menerima apa yang telah dipercayakan kepadanya melalui sengketa: Shafi'i dan Hanbalis dalam aliran pemikiran, dan Zafar serta narasi dari Abu Yusuf melarangnya karena kepala sekolah dapat menyetujui sengketa dengan seseorang yang tidak mau mengambil alih; Hafani bukan Zafar, dan Hanbal mengizinkannya, karena agen adalah agen dalam menyelesaikannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17785} Dan mengenai wewenang agen untuk bersengketa dengan orang lain: jika prinsipal mengizinkannya, dia memilikinya; jika dia melarangnya, dia tidak memilikinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17786} Dan secara umum: Hafi, Maliki, dan Hanbalis di sekolah melarangnya karena orang berbeda dalam perselisihan; Malikis dan Hanbalis membatasi ini hanya pada apa yang sesuai bagi agen, jadi jika tidak tepat atau tidak baik, diperbolehkan mendelegasikan dia. Malikis menambahkan bahwa dia menunjuk seseorang untuk mengangkatnya jika perselisihan sering terjadi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17786} Ibn Qudamah berkata: Jika agensi diberikan dan tindakan biasanya di atas agen atau tidak mampu melakukannya, diperbolehkan untuk mendelegasikan diri; jika dilakukan sendiri dan dia tidak dapat melakukan semuanya karena kelimpahan, maka diperbolehkan. Jika tidak, ada dua narasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17787} Jika dua orang terlibat dalam perselisihan dan salah satu berselisih, maka surat kuasa tidak sah menurut Hanafi; dan jika semua pihak berada di pihak yang sama, maka diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17787} Dan mengenai pembayaran utang oleh agen: jika prinsipal berkata, 'Selesaikan dan jangan bersaksi,' agen tidak bertanggung jawab jika kreditur menyangkal, dan jika diperintahkan untuk bersaksi, maka ia bertanggung jawab. {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17787} Jika ia memerintahkannya untuk mengadili tanpa kesaksian, ia melakukannya dan tidak bersaksi, hal ini dianggap sah menurut Hanafi, Maliki, Shafi'i, dan Hanbal di sekolah karena dianggap berlebihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17788} Ia tidak bertanggung jawab jika memerintah di hadapan kepala sekolah, menurut sekolah Maliki dan Hanbali di sekolah dan Shafi'i dengan cara yang paling benar, tetapi ia bertanggung jawab menurut Shafi'i dalam kasus lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17788} Kuasa hukum dengan mewajibkan utang. Jika agen mengambil alih utang tersebut, debitur dibebaskan, dan properti yang diterima menjadi milik prinsipal dan menjadi trust di tangan agen. Agen tidak diperbolehkan memberikan, menunda, atau melunasi utang; menurut Hanafi, ia tidak boleh mengambil sebagai jaminan, dan ia boleh mengambil penjamin; tetapi menurut Malikis dan Hanbalis, ia tidak boleh melunasi utang kecuali dengan izin prinsipal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17788} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17789} Pembayaran hak kepada orang yang mengklaim agen dari pihak yang tidak hadir. Gubernur memaksa debitur membayar jika penggugat dapat bukti melawan agen melalui perjanjian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17789} Meskipun tidak ada bukti yang diberikan, Maliki, Shafi'i, dan Hanbalis berpendapat bahwa debitur tidak berkewajiban membayar penggugat agen kecuali ia mempercayainya. Jika debitur secara sukarela menolak dan kreditur menolak agensi, kreditur akan menuntut kembali pembayar sendiri, dan pembayar akan mereklamasi agen jika dirugikan oleh kelalaian atau kelalaian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17790} Namun, Hanian membedakan antara utang dan properti, dan percaya bahwa jika debitur jujur tentang penggugat, ia memerintahkan pembayaran, tetapi jika ia palsu, hanya agen yang wajib membayar apa yang diterimanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17790} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17791} Jika pihak lawan memberikan bukti bahwa penggugat menolak agensi dan mengambil uang darinya, maka bukti itu diterima, karena membuktikan pemisahan hak penggugat atas penerima, sehingga secara keharusan membatalkan kepemilikan agen. Namun jika hak tersebut berupa barang seperti deposit, maka kejujuran penyimpan tidak diperintahkan untuk dibayarkan kepadanya, karena itu adalah pengakuan menerima properti orang lain, berbeda dengan utang di mana ia diperintahkan untuk membayarnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17792} Jika penyetor menyerahkan deposit kepada pengklaim agensi, maka deposit tersebut hilang, dan pemilik menolak surat kuasa di dalam detor, dan ia dapat bersumpah kepadanya dan tidak dapat mengklaim kembali terhadap agen kecuali ia menjamin pada saat pembayaran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17792} Beberapa agen. Prinsipal diperbolehkan menunjuk lebih dari satu agen untuk transaksi tertentu selain sengketa, karena delegasinya adalah satu sekaligus, sehingga tidak ada yang dapat bertindak secara eksklusif kecuali prinsipal mengizinkan. Menurut Hanafi, jika transaksi memerlukan pendapat dan konsultasi, seperti penjualan, pernikahan, atau penagihan utang, keduanya tidak diperbolehkan sendiri. Namun, jika tidak diperlukan, seperti memberikan hadiah, mengembalikan deposit, atau melunasi hutang, masing-masing dari mereka sendiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17793} Dan semuanya dalam dua kata yang diatur, jadi mana pun diperbolehkan menurut Hanafi dan Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 17795} Adapun dua agen yang dipersengketakan, masing-masing unik menurut Hanafi, kecuali Zafar, dan menurut Hanbalis dalam satu pendapat, dan Shafi'i berbeda dengan pandangan yang lebih benar, karena tujuannya adalah untuk memberitahu hakim, dan Zafar melarangnya. Syafi'i memegang pandangan yang paling benar dan Hanbalis di sekolah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17795} Memberi izin kepada agen diizinkan berdasarkan kesepakatan. A- Dengan izin, tidak diperbolehkan berdasarkan kesepakatan. B- Dengan larangan, tidak diperbolehkan berdasarkan kesepakatan. C- Dengan delegasi, seperti mengatakan 'Lakukan apa pun yang Anda inginkan' atau 'bertindak sesuai pendapat Anda', diperbolehkan menurut Hanafi, Maliki, dan Hanbali, tetapi Shafi'i melarangnya karena kemungkinan kata-katanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17796} D- Mendukung generalisasi: Mayoritas ahli hukum melarangnya karena prinsipal puas dengan pendapat agen, dan pendapat orang berbeda. Beberapa membuat dua pengecualian: agen mungkin dibebaskan atau tidak mampu melakukan pekerjaan yang diperbolehkan; dan pekerjaan dapat dilakukan sendiri tetapi tidak mampu melakukan semuanya karena kelimpahannya. Dengan demikian, pekerjaan diperbolehkan menurut pendapat Hanbal dan Shafi'i, sementara Malikis dan Shafi'i membatasinya hanya melebihi kapasitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17797} dan Ahmad serta Ibn Abi Layla mengizinkannya secara mutlak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17798} Persyaratan dapat dipercaya pada orang yang ditunjuk oleh agen. Dia harus dapat dipercaya, kecuali prinsipal menunjuk seseorang yang tidak dapat dipercaya, dalam hal ini agen mengikuti pengangkatannya; dan jika agen kedua menjadi pengkhianat, Hanbalis dan Shafi'i berpendapat bahwa agen harus diberhentikan, sementara Shafi'i, dalam pandangan yang lebih tepat, tidak memiliki wewenang untuk memberhentikannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17798} Mengklasifikasikan keberatan seseorang yang ditunjuk oleh agen. Jika kepala sekolah mengatakan \"dan mendelegasikan kepada saya\" atau \"mendelegasikan kepadanya,\" agen kedua adalah agen kepala sekolah dan tidak dicopot oleh pemecatan kepala sekolah pertama, dan keduanya dicopot setelah kepala sekolah meninggal; dan jika dia berkata \"dan segala sesuatu tentang kamu,\" yang kedua adalah agen pertama, dan dia dicopot oleh pemecatan dan kematiannya. Menurut Shafi'i dan Hanbali, kepala sekolah memiliki penghapusan cabang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17799} Dan jika dia mengatakan 'dan menunjuk' tetapi tidak mengatakan 'dari saya' atau 'dari kamu,' Hanafi, Maliki, dan Shafi'is menurut pandangan yang paling benar dan Hanbal di sekolah menjadikannya agen kepala sekolah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17799} Surat kuasa tanpa izin tidak sah menurut mayoritas, dan disahkan oleh Ahmad dan Ibn Abi Layla dalam sebuah narasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17799} Agen dapat dipercaya atas uang di tangan prinsipalnya, sehingga ia seperti deposit. Ia tidak bertanggung jawab atas apa yang hilang kecuali jika ia melanggar atau lalai, baik dengan upah maupun sumbangan, karena tangannya berada di tangan prinsipal dan karena agensi tersebut adalah kontrak penyitaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17800} Dari kepercayaannya dapat disimpulkan bahwa pernyataannya diterima dalam menolak jaminan atas namanya sendiri melalui sumpahnya, karena dasar agensi adalah keringanan dan belas kasih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17801} Syarat tanggung jawab atau penyangkalan. Ibn Qudamah mengatakan bahwa apa yang disebut trust tidak dijamin oleh kondisinya, dan apa yang dijamin tidak dibatalkan oleh kondisinya; dan Ahmad melaporkan apa yang menunjukkan penolakan tanggung jawab berdasarkan kondisi, dan yang pertama adalah pendapat yang tampak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17801} Pelanggaran dan kelalaian. Agen bertanggung jawab jika hewan melebihi kapasitasnya, mengenakan pakaian tanpa izin, kehilangan uang tanpa mengetahui bagaimana kain itu hilang, mencampuradukkan harta utama dengan miliknya sendiri, menolak mengembalikan tanpa alasan, atau menunda pengembalian setelah alasan itu berlalu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17802} Jika prinsipal membayar utang sendiri lalu agen membayarnya, maka agen tidak bertanggung jawab jika tidak tahu; jika dia tahu, maka dia bertanggung jawab karena pengetahuannya tentang tindakan prinsipal dianggap sebagai pemecatan; menurut Abu Hanifa, agen bertanggung jawab secara zakat secara umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17802} Jika agen menjual melalui kontrak dan menyerahkan barang yang terjual sebelum menerima harga, pembeli menolaknya sebagai bagian dari nilai jual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17802} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17803} Jika dia menunda membayar harga tanpa alasan sampai meninggal dalam kepemilikannya, dia bertanggung jawab, dan jika dia punya alasan, tidak ada tanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17803} Siapa pun yang secara keliru menyembelih domba bertanggung jawab karena kesalahan dan niat sama dalam harta manusia. Jika diperintahkan untuk mengumpulkan seluruh deposit, dia bertanggung jawab sebagian, dan tanggung jawab dihapus jika sisanya diambil sebelum kematian orang pertama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17803} Cara bertanggung jawab. Yang setara bertanggung jawab atas nilai setara yang dinilai nilainya, dan setara jika nilai setara tidak mungkin untuk nilainya. Nilai tersebut dipertimbangkan pada hari pelanggaran atau kehancuran dan tidak ada yang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17804} Mengajukan pernyataan. Agen berkewajiban memberikan informasi yang diminta kepada prinsipal tentang tindakan mereka. Ibn Hajar mengatakan bahwa setiap wali amanat yang diminta pernyataan dan laporan wajib melakukannya, dan jawaban serta gugatan adalah prioritas, bukan tulisan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17804} Mengembalikan apa yang dimiliki agen. Ia harus mengembalikan apa yang dimilikinya kepada prinsipal; jika menolak mengembalikan dengan tuntutan tanpa alasan sampai rusak, ia bertanggung jawab membayar. Demikian pula, jika alasan dihapus, ia menunda pengembalian hingga rusak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17804} Jika prinsipal dan agen sepakat atas biaya, biaya harus dibayar berdasarkan kesepakatan. Jika mereka tidak setuju: menurut aliran Hanafi, jika agen tidak dibayar untuk pekerjaan, maka agen tersebut bersifat sukarela; tetapi jika ia adalah profesional yang profesionalnya bekerja dengan bayaran, seperti perantara atau perantara, ia berhak atas upah yang setara. Pasal (1467) dari Kode Putusan Yudisial menetapkan hal ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17805} Waktu hak atas upah. Agen berhak menyerahkan apa yang dipercayakan kepadanya kepada prinsipal jika itu sesuatu yang dapat diserahkan, seperti pakaian yang ia tenun atau jahit; dan jika ia dipercayakan untuk menjual, membeli, atau melaksanakan Haji, ia berhak atas upah yang disepakati setelah pekerjaan selesai, kecuali prinsipal menetapkan bahwa harga harus dibayar terlebih dahulu dan agen tidak menyerahkannya, dalam hal ini ia tidak menerima upah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17806} Syarat hak atas upah: pekerjaan harus diketahui, upah harus diketahui dalam jumlah, upah tidak boleh menjadi bagian dari kontrak yang dikontrak oleh beberapa ahli hukum, dan agen harus melaksanakan agen dengan benar. Di antara kasus yang tidak diketahui adalah ungkapan \"Dia memberimu sepersepuluh dari harganya,\" sehingga dia akan menerima imbalan yang adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17806} Jika agen menjual penjualan yang korup, dia tidak boleh diizinkan melakukannya, karena izin mutlak hanya diperlukan untuk menjual orang yang benar. Jika dia menjual dengan benar dan harga hilang dalam kepemilikannya, dia menerima imbalan karena keberadaan pekerjaan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17806} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 17807} Pengembalian agen kepada pokok atas apa yang telah dibayar. Jika ia memerintahkan agen untuk melunasi utang dan membayar dari uangnya, syarat untuk mengajukan hukum dikembalikan, atau tidak ada syarat yang terpenuhi; tetapi jika ia diberi wewenang membeli dan harga tidak dibayarkan, ia membayarnya dari uangnya sendiri. Menurut Hanafi, kecuali Zafar, ia berhak menahan barang yang terjual sampai pokok membayar harga, karena ia adalah kontraktor yang wajib membayar harga tersebut. Zafar percaya ia tidak boleh menahan utang tersebut, karena barang yang dijual adalah trust di tangannya. Abu Yusuf bertanggung jawab atas hipotek, dan Zafar bertanggung jawab atas perebutan kekuasaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17806} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17808} Entitas yang terkait dengan hak-hak kontrak yang dibuat oleh agen. Ada dua jenis kontrak: yang dapat diberikan kepada agen, seperti jual beli dan sewa, di mana haknya kembali kepada agen seperti pemilik, yang menyerahkan barang yang terjual, mengambil harga dan mengklaimnya; dan yang harus ditambahkan ke pokok, seperti pernikahan, khula, dan penyelesaian darah sengaja, karena haknya kembali kepada prinsipal, sehingga agen suami tidak menuntut mas kawin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17809} dan para Shafi'i serta Ahmad dalam sebuah narasi menganggap hak kontrak sepenuhnya terkait dengan agen, sementara Hanbalis dalam aliran pemikiran Hanbali menganggap prinsipal mutlak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17808} Jika agen memerintahkan pembayaran harga, pemilik klaim berhak atas permintaan apa pun, pembeli terpaksa menyerahkannya kepadanya; dan jika prinsipal melarang agen mengambil, maka larangan itu sah, tetapi jika pembeli membayar harga kepada prinsipal, ia dibebaskan berdasarkan preferensi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17809} Jika barang yang dijual berada dalam kepemilikan pembeli, pembeli mengembalikan harga kepada orang yang menjualnya, agen atau prinsipal; demikian pula, cacat tersebut dipersengketakan oleh agen jika dia adalah penerima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17809} Kontrak yang harus ditambahkan ke pokok, seperti pernikahan, khul', pembebasan properti, penulisan, dan penyelesaian dengan darah sengaja, memiliki hak atas prinsipal dan dia, dan agen tersebut adalah duta besar dan agen. Agen suami tidak menuntut mas kawin, begitu juga agen istri tidak memiliki hak asuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17810} Menurut Malikis, agen penjualan menuntut pembayaran dan penerimaan harga, agen pembeli mengklaim menerima dan menyerahkan barang yang terjual, dan pembelot menghapus cacat jika tidak mengetahui cacat tersebut, serta menuntut harga kecuali ia menyatakan penolakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17810} Bagaimana putusan kontrak dialihkan kepada prinsipal. Mayoritas ahli hukum (Hanafi dalam Sahih, Shafi'i dalam Sahih, Maliki dan Hanbali) percaya bahwa putusan dialihkan langsung ke prinsipal karena kontrak itu miliknya. Al-Karkhi percaya bahwa putusan tersebut ditetapkan terlebih dahulu untuk agen dan kemudian dialihkan ke prinsipal. Abu Zayd menganggapnya sebagai prinsipal dalam otoritas hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17810} Perbedaan antara agen dan prinsipal. Dalam asal usul agensi: pernyataan adalah pernyataan prinsipal karena defaultnya adalah tidak adanya agensi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17811} Dan mengenai atribut agen seperti 'ayn, harga, uang, dan nisah': pendapat orang yang ditunjuk di antara Hanafi, Maliki, Shafi'i, dan Hanbalis adalah satu pandangan; Maliki membuat pengecualian dalam dua kasus di mana opini adalah sumpah agen, dan menurut Hanbalis dalam aliran Hanbali, agen adalah orang yang dapat dipercaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17811} Kerusakan pada apa yang ada di tangan agen tanpa kelalaian: pernyataan agen dengan sumpahnya yang setuju karena dia dapat dipercaya dan tidak dapat bersaksi. Malikis membatasi dia pada tuduhan, dan Hanbalis menyebutnya sebagai penyebab tersembunyi seperti pencurian; jika kerusakan disebabkan oleh tindakan jelas seperti kebakaran atau penjarahan, maka menurut hakim Hanbali, dia harus membuktikan kejadian yang tampak dan kemudian bersumpah. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.17811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17812} Pelanggaran dan kelalaian dalam pelestarian: pernyataan agen beserta sumpahnya, karena ditolak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17812} Perbedaan dalam penjualan yang sah dan penerimaan harga: Hanafi merinci mengenai penjualan agen, penerimaan harga, dan penghancurannya. Barang yang dijual dapat diserahkan kepada agen atau tidak; jika agen jujur dalam penjualan dan kepemilikan tanpa kehancuran, pernyataan agen tentang kerugian disertai dengan sumpahnya; jika agen berbohong dalam semua ini, agen tidak percaya hak agen untuk mengambil. Pembeli memiliki opsi untuk membayar harga kedua jika ia mau, dan jika ia mau, ia membatalkan. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17815} Menurut Malikis, jika agen berkata, \"Saya bertindak sesuai izin,\" pernyataan itu adalah pernyataannya sendiri, karena dia dapat dipercaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17815} Menurut syafi'i, jika terjadi perselisihan setelah pemisahan, pernyataannya hanya diterima dengan bukti. Jika terjadi sebelum pernyataan, dua pendapat jelas: yang paling jelas adalah pendapat prinsipal, dan dikatakan bahwa apa yang menjadi dasar agen diterima oleh sumpahnya. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm.. 17815} Menurut aliran pemikiran Hanbali: jika agen berkata, 'Saya menjual pakaian dan menerima harga dan rusak,' pendapat itu adalah pendapatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17816} Klaim untuk mengembalikan apa yang ada di tangan agen. Pendapat tersebut adalah pernyataan agen dengan sumpahnya menurut mayoritas, baik dibayar maupun tanpa gaji menurut Hanafi dan Maliki; menurut Shafi'i, bertentangan dengan aliran yang lebih benar dan Hanbali, pernyataannya tidak diterima jika dia bekerja dengan bayaran kecuali dengan bukti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17816} Penghentian kekuasaan. Pertama: Pemecatan, karena agen adalah kontrak yang tidak mengikat, maka salah satu pihak dapat mengakhirinya dengan pemecatan. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.17816} Akhir dari agensi, dimulai dengan pemecatan. Prinsipal dapat memberhentikan agen dan melarangnya bertindak, dan agen dapat memberhentikan dirinya sendiri, berdasarkan kesepakatan para ahli hukum secara umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17817} Syarat keabsahan pemecatan agen dari prinsipnya: Pertama, agen mengetahui tentang pemecatan tersebut, sehingga Hanafi mewajibkannya, menurut pendapat Maliki dan Shafi'i, serta narasi di antara Hanbali, tetapi tidak menurut pendapat Maliki, Shafi'i menurut pendapat yang paling benar, dan Hanbalis dalam aliran pemikiran. Menurut Hanafi, agen dikenal melalui kehadiran pemecatan tersebut, atau melalui surat kepala sekolah yang tidak hadir, atau oleh utusan yang mendapatkannya, meskipun ia bukan anak yang adil atau di bawah umur, atau dari laporan dua orang yang adil atau adil. Jika laporan itu tidak adil, maka kebenarannya ditolak; Abu Hanifa tidak menganggapnya terisolasi jika ia berbohong dan kebenaran laporan itu menjadi jelas, karena pelaporan tentang pemecatan mirip dengan kesaksian, dan Abu Yusuf serta Muhammad tidak setuju dengannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17818} Kedua, lembaga tidak berkaitan dengan hak pihak lain. Menurut Hanafi, pemecatan tidak diperbolehkan tanpa persetujuan pemegang hak, seperti pemegang hipotek yang berwenang menjual hipotek, atau penggugat yang mendelegasikan tergugat dalam sengketa; Shafi'i mengizinkan memberhentikan agen jika agen dilakukan dengan meminta pihak lawan, sementara Malikis mencegah pemecatan setelah pihak berusia tiga tahun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17819} Ketiga, agen tidak boleh disewa, karena bersifat mengikat. Keempat, pemecatan tersebut tidak boleh menimbulkan kerugian besar; pemecatan dilarang jika menyebabkan penyitaan tidak adil atas harta wali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17819} Pemecatan agen itu sendiri tidak diwajibkan oleh mayoritas ahli hukum untuk mengetahui prinsipal, kecuali menurut aliran Hanafi jika lembaga tersebut dilakukan karena sengketa atau pembelian barang tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17819} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17820} Kematian. Surat kuasa batal setelah pihak utama atau agen meninggal berdasarkan kesepakatan, karena kematian membatalkan kapasitas dan harta berpindah ke ahli waris. Menurut Hanafi, Shafi'i, dan Hanbali, dalam aliran pemikiran, agen tidak diwajibkan mengetahui kematian tersebut. Menurut Maliki, agen dicopot jika pihak yang dikontrak hadir di kota kematian dan mengetahui tentang keberadaan jika mengetahui kematian; jika tidak, ia tidak dicopot kecuali dengan pengetahuan tentang kematian tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17820} Kegilaan. Hanafi membatalkan agensi dengan kegilaan mutlak, hanya menurut Abu Yusuf berdasarkan bulan, dan Muhammad oleh Sunnah. Mutabaq tidak mencabut hak hukum dengan terbangun; Syafi'i dan Hanbal di sekolah membatalkannya karena kegilaan, sementara Maliki tidak mengisolasinya kecuali kegilaan orang yang ditunjuk berlanjut dan hakim meninjaunya. Hanbal menganggap itu tidak sah menurut pandangan mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17821} Pingsan. Mayoritas ahli hukum tidak membatalkannya dengan keinginan, sementara Shafi'i, lebih tepatnya, membatalkannya karena kegilaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17822} Karantina. Hanafi berpendapat bahwa interdiksi pada prinsipal atau agen membatalkan agensi, tetapi Hanafi menyatakan bahwa larangan itu dibatalkan dengan interdiksi pada prinsipal jika itu dalam kontrak dan sengketa, bukan dalam putusan utang atau deposit. Hanbalis membatalkan wali karena pelanggaran yang tidak signifikan dan dengan penny prinsipal dalam apa yang dibatasi; Shafi'i membatalkannya karena ketidakmampuan untuk kebodohan atau sepeser dalam transaksi yang tidak dapat ditegakkan; Malikis membatalkannya oleh fils prinsipal, bukan jenderal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17823} Murtad. Hanafi: Jika ia memutuskan bahwa murtad bergabung dengan zona perang, kekuasaannya tidak sah dan tidak kembali ke aliran pemikiran. Tindakannya sebelum bergabung ditangguhkan menurut Abu Hanifa, sementara menurut Abu Yusuf dan Muhammad, tindakan tersebut sah. Mazhab Maliki memberhentikan agen dengan jubah agennya setelah berhari-hari bertobat, sementara Syafi mendasarkan ini pada hilangnya kepemilikan murtad, yang memiliki beberapa pendapat, yang paling jelas adalah kepemilikannya ditangguhkan. Mazhab Hanbali berpendapat bahwa agensi tidak membatalkan jubah agen, begitu pula jubah agen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17824} Ketidakmoralan. Para Hanbal menyatakan bahwa agensi tidak membatalkan ketidakmoralan agen kecuali dalam kasus yang bertentangan dengan ketidakmoralan, seperti tawaran dalam kontrak pernikahan, sehingga ia terpisah karena ketidakmoralannya atau ketidakmoralan prinsipalnya; meskipun ia adalah agen dalam hal-hal yang diwajibkan oleh kepercayaan, seperti wali anak yatim atau pengawas wakaf, ia terisolasi karena ketidakmoralannya sendiri dan prinsipalnya. Syafi'i membatalkannya oleh ketidakmoralan prinsipal dalam kasus di mana keselamatan dari ketidakmoralan diperlukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17825} Alkohol. Menurut syafi'i, agen dipisahkan jika salah satu dari mereka mabuk tanpa pelanggaran, dan jika ia mabuk dengan menghitung, pemisahan itu mungkin atau tidak. Menurut Hanbali, mabuk tidak membatalkannya kecuali dalam kasus yang bertentangan, seperti kewajiban dalam pernikahan. Menurut Hanafi, mabuk sama sekali tidak membatalkannya; agen perceraian jika bercerai saat mabuk tidak berlaku, dan agen penjualan jika dijual dalam keadaan mabuk tidak menegakkannya terhadap prinsipalnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17826} Tempat pembuangan tidak lagi dimiliki oleh prinsipal. Jika prinsipal menjual toko sendiri, seperti menjual barang sebelum agen menjualnya atau menjadi hak atas orang lain, atau jika wanita menikah sendiri, maka agen tersebut batal. Menurut aliran Maliki, jika prinsipal menjual kepada satu pihak dan agen kepada yang lain, penjualan pertama bersifat mengikat, dan yang kedua tidak bersifat pengetahuan, kecuali yang kedua mengambil alih barang tersebut, dalam hal ini pihak pertama melanjutkan dan orang pertama mengembalikannya jika pihak kedua dan pembeli tidak mengetahui penjualan pertama. Menurut Hanbalis, agen dibatalkan jika agen mengakui bahwa prinsipal menerima apa yang dipercayakan kepadanya, karena pengakuan kehilangan tempat agen tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17826} Badan mengembalikan jika toko kembali kepada pemilik utama. Muhammad berkata: Itu kembali, karena orang yang kembali dengan pembatalan adalah pemilik pemilik pertama, sehingga ia mendapatkan kembali haknya. Syafi'i dan Abu Yusuf mengatakan bahwa itu tidak mencabut, karena tindakan prinsipal melibatkan pemecatan agen. Ibn Abidin mengatakan bahwa tindakan itu kembali jika pemilik kembali ke apa yang dibatalkan, bukan apa yang tidak dicabut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 17826} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17827} Pelanggaran agen atas apa yang telah ia delegasikan. Shafi'i dalam pandangan paling benar dan Hanbalis dalam aliran pemikiran: agensi tidak dibatalkan oleh pelanggaran, karena transaksi dilakukan dengan izin, dan trust dibatalkan oleh pelanggaran, dan disposisi tetap ada, seperti hipotek. Shafi'i, berbeda dengan pandangan yang lebih benar, dan Hanbalis mengatakan itu dibatalkan, karena itu adalah kontrak trust seperti deposit. Al-Mardawi berkata: Jika agen dirugikan karena melanggar suatu barang dan ditugaskan padanya, agensi dibatalkan, tetapi jika properti itu tetap ada, tidak dibatalkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17827} Penolakan. Hanbalis dan Hanafis berpendapat bahwa penolakan agen atau prinsipal tidak membatalkannya, karena penolakan tidak berarti penolakan izin sebelumnya; Hanafi memegang pendapat fatwa, dan Hanbal membatalkannya. Para Shafi'i berkata: Penolakan karena lupa atau untuk tujuan menyembunyikan bukanlah pemecatan; jika salah satu dari mereka sengaja menyangkal tanpa tujuan, ia diisolasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17828} Tempat agensi hilang. Jabatan menjadi tidak sah karena kerusakan pada mata prinsipal dan kematian wanita yang ditunjuk oleh perceraiannya. Menurut Hanafi, agensi dipisahkan oleh pemisahan dua pasangan yang berwenang, meskipun agen tidak menyadarinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17828} Penyelesaian transaksi. Agen diisolasi menurut aliran Hanafi setelah menyelesaikan komando, misalnya saat ia menagih utang atau mengadakan pernikahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17828} Penarikan diri ditandai. Menurut Hanbali, agen dibatalkan oleh kembalinya kepala sekolah sebagai indikasi, seperti hubungan istri yang ditunjuk untuk menceraikannya, atau kembalinya agen sebagai indikasi, seperti menerima kehendaknya untuk membebaskan budak yang dipercayakan untuk membelinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17829}"
