id: concept/wakala-fiqh
class: concept
kind: legal
label:
  ar: "وَكالة"
  en: "Wakala (agency, fiqh)"
summary:
  ar: "الوكالة بالفتح والكسر في اللغة الحفظ، ومنه الوكيل في أسماء الله بمعنى الحافظ، ومنه التوكل، والتوكيل تفويض التصرف إلى الغير، وسُمّي الوكيل وكيلاً لأن موكّله فوّض إليه القيام بأمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} وفي الاصطلاح تعددت التعريفات: فعرّفها الحنفية بأنها إقامة الغير مقام نفسه في تصرف جائز معلوم، ترفّهاً أو عجزاً؛ وعرّفها المالكية بأنها نيابة ذي حق، غير ذي إمرة ولا عبادة، لغيره فيه غير مشروطة بموته؛ وعرّفها الشافعية بأنها تفويض شخص ما له فعله مما يقبل النيابة إلى غيره ليفعله في حياته؛ وعرّفها الحنابلة بأنها استنابة جائز التصرف مثله فيما تدخله النيابة من حقوق الله وحقوق الآدميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nيفرّق الكتاب بين الوكالة وألفاظ قريبة منها: النيابة، وهي قيام الإنسان عن غيره بفعل أمر، وهي عند بعضهم أعم من الوكالة، وعند آخرين مترادفة؛ والولاية، وهي تنفيذ القول على الغير شاء أو أبى، وهي نيابة شرعية أو إجبارية، بينما الوكالة نيابة اتفاقية؛ والإيصاء، وهو إقامة الإنسان غيره مقام نفسه في التصرف بعد الموت، بينما الوكالة في الحياة؛ والقوامة، وهي ولاية يفوضها القاضي إلى راشد للتصرف لمصلحة القاصر، أو ولاية الزوج على زوجته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nاتفق الفقهاء على مشروعية الوكالة، واستدلوا عليها بالقرآن: بقصة أصحاب الكهف في بعث أحدهم بورقهم إلى المدينة، وبآية الحكمين في سورة النساء، والحكم وكيل عن الزوجين على رأي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} وبالسنة: حديث عروة بن أبي الجعد البارقي الذي أعطاه النبي ديناراً ليشتري به شاة، وحديث حكيم بن حزام في شراء الأضحية، وحديث جابر في الوكيل بخيبر، وحديث أبي رافع في زواج النبي بميمونة وكان الرسول بينهما؛ وأجمع الفقهاء على جوازها من عصر النبي إلى اليوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} واستدلوا بالمعقول، وهو أن الحاجة داعية إليها، لأن الإنسان قد يعجز عن المباشرة بنفسه لمرض أو كبر أو وجاهة، فلو لم تجز لوقع الحرج المنفيّ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nأركان الوكالة. يرى جمهور الفقهاء أنها الصيغة والعاقدان (الموكل والوكيل) ومحل العقد (الموكل فيه)، ويرى الحنفية أن ركنها الإيجاب والقبول، لأن وجودهما يستلزم الركنين الآخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} والصيغة هي الإيجاب والقبول، يُعبّر بهما عن التراضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nالإيجاب. يرى الجمهور أنه ما يصدر من الموكل ويدل على إذنه بالتوكيل، ويرى الحنفية أنه ما صدر أولاً من أحد المتعاقدين للدلالة على رغبته في إنشاء العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} ويتحقق بكل ما يدل على الرضا بالوكالة، باللفظ أو الكتابة أو الرسالة أو إشارة الأخرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} فمن اللفظ الصريح: وكلتك، أو فوضت إليك، أو أنبتك، أو أذنت لك، أو أقمتك مقامي، أو أنت وكيلي؛ وأما الأمر كقوله بعه، فيصح عند الحنفية والشافعية والحنابلة، وعند المالكية إذا جرى العرف به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} أما ألفاظ «سأوكلك» و«أوكلك» و«قد عولت عليك» و«قد اعتمدت عليك» فلا تنعقد بها الوكالة عند الشافعية لاحتمالها، إلا أن يُضم إليها لفظ صريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nوتنعقد الوكالة بالرسالة عند الحنفية والمالكية والشافعية، ويكون الوكيل وكيلاً متى بلغه الخبر وقبل، سواء كان المخبر عادلاً أو غير عادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} ويتحقق الإيجاب بالكتابة المستبينة، وبالإشارة المفهومة من الأخرس، وبالفعل الدال على الإذن عند الحنابلة، وبما جرت العادة باعتباره إيجاباً عند المالكية، كتصرف الزوج في مال زوجته وهي عالمة ساكتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} ولا يكون السكوت إيجاباً عند الحنفية والشافعية والحنابلة؛ فمن رأى أجنبياً يبيع ماله فسكت لم يصبح وكيلاً بسكوته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nالقبول. يتحقق باللفظ، كأن يقول الوكيل قبلت، أو بكلام يشعر بالقبول؛ وزاد الحنفية والشافعية أنه لا بد ألا يرده الوكيل، فإن رده بعد الإيجاب لم تنعقد الوكالة وإن قبل بعد ذلك، ما لم يجدد الإيجاب والقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} وفي القبول بالفعل ثلاثة آراء: الجمهور (الحنفية والمالكية والشافعية في أصح الوجهين والحنابلة) يرون أنه يتحقق بكل فعل دال عليه، كفعل الوكيل ما أمره به الموكل؛ والشافعية في وجه والحنابلة في قول وزفر من الحنفية يرونه لا يتحقق إلا باللفظ؛ والشافعية في وجه ثالث يفرّقون: إن كانت صيغة الإيجاب أمراً كقوله «بع واشترِ» تحقق القبول بالفعل، وإن كانت صيغة عقد كـ«وكلتك» فلا بد من اللفظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} ويصح القبول بالكتابة المستبينة المعنونة، وبإشارة الأخرس المعلومة، وعند الحنفية يكون سكوت الوكيل قبولاً ويرتد برده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nوإذا تراخى القبول عن الإيجاب، فجمهور الفقهاء (الحنفية والحنابلة والشافعية في المذهب والمالكية في أحد القولين) يصححونه، لأن الإذن قائم ما لم يرجع عنه الموكل، فأشبه الإباحة؛ وقيّد الشافعية ذلك بألا يتعين زمان العمل، فإن تعين وخيف فواته كان القبول على الفور، وكذا إذا عرضه الحاكم عليه عند ثبوتها عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وذهب المالكية في القول الثاني وأبو حامد المروروذي من الشافعية إلى أن القبول على الفور، لأن الوكالة عقد في حال الحياة فيكون القبول فيه على الفور كالبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وقال المازري إن التحقيق يرجع إلى القصد والعوائد: هل المراد من هذه الألفاظ استدعاء الجواب فوراً، أم معجلاً أو مؤجلاً؟ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nأقسام صيغة الوكالة بحسب وقت ترتّب آثارها: المنجّزة، وهي ألا تكون معلقة بشرط ولا مضافة إلى وقت، والمعلقة، والمضافة إلى المستقبل، والموقتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nالصيغة المنجزة، وهي ألا تُعلّق بشرط ولا تُضاف إلى وقت، كقول الموكل «وكّلتك ببيع الدار الفلانية»، وهي صحيحة باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nالصيغة المعلقة على شرط. اختلف الفقهاء في صحتها على رأيين. الأول، للحنفية والحنابلة على الصحيح عندهم وللشافعية في مقابل الأصح، أنها صحيحة، كقول «إذا قدم الحاج فبع هذا الطعام»، واستدلوا بحديث ابن عمر في إمرة زيد بن حارثة في غزوة مؤتة، ثم جعفر، ثم عبد الله بن رواحة إن قُتل من قبله، ولأنه عقد اعتبر في حق الوكيل حكمه وهو إباحة التصرف، فهو أشبه بالوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} والثاني، للشافعية في الأصح وللحنابلة في قول، أنها فاسدة؛ قال الماوردي إن تعليق الوكالة بالشروط والآجال فاسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} وأجاز الشافعية أن ينجز الموكل الوكالة ويشترط للتصرف شرطاً، كقوله «بعها بعد شهر»، لأن ذلك تأخير لا تعليق؛ ونقل الغزالي عن العراقيين أن قدوم فلان أو مضي شهر شرط للتصرف لا للعقد فيجب على الوكيل الامتثال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nالصيغة الدورية، وصورتها أن يقول الموكل «وكّلتك ببيع هذا المال، وكلما عزلتك فأنت وكيلي»، فتتجدد الوكالة كلما عُزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} وصحّحها الحنفية والحنابلة على الصحيح، بناءً على أن الوكالة تقبل التعليق، ويملك الموكل عزل الوكيل متى شاء عند الحنفية؛ ويحصل العزل عند الحنابلة بقول الموكل «عزلتك، وكلما وكلتك فقد عزلتك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} ومنع ابن تيمية صحتها لأنها تجعل العقد الجائز لازماً، والمقصود من التعليق المنع من التوكيل لا فسخ عقد قبل انعقاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} وقال الشافعية في صحتها في الحال وجهان، أصحهما الصحة، فإن عزله ولم يعلم الوكيل أو علم، ففي عوده بعد العزل وجهان، أصحهما المنع؛ وإن قال «كلما عزلتك» تكرر العود أبداً، وإن قال «إذا» أو «متى» فمرة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المضافة إلى المستقبل، كقول الموكل «وكّلتك على أن تبيع دوابي في شهر رمضان» أو «وكّلتك في بيع هذه الدار غداً»، وقد أجازها الحنفية والحنابلة، ويُقرّ الحنفية أن الوكيل يصبح وكيلاً من الغد فما بعده لا قبله، ويوافقهم الشافعية لأن الوكالة نُجّزت في الحال وعُلّق التصرف على وقت في المستقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المعلقة على وقت، كقوله «إذا جاء رأس الشهر فقد وكّلتك في بيع داري»، وهي باطلة في الأصح عند الشافعية لأن تعليق الوكالة بالآجال فاسد، وصحيحة عند الحنفية والحنابلة والشافعية في مقابل الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} وفرّق الحنفية بين الإضافة والتعليق: فالمضاف سبب ينعقد به العقد في الحال مع تأخّر حكمه إلى الوقت، أما المعلّق ففيه مانع من أن يكون سبباً للحكم في الحال، فلا تنعقد الوكالة إلا عند وجود الشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المؤقتة، كقوله «أنت وكيلي شهراً»، وهي صحيحة عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} واختلفوا في بقائها بعد الوقت: فالشافعية لا تبقى بعده. وعند الحنفية روايتان فيمن وُكّل ببيع الدار «اليوم» فباعها غداً، فقيل الصحيح أنها لا تبقى، وقيل تبقى لأن ذكر اليوم للتعجيل لا للتوقيت؛ ونقل صاحب منحة الخالق عن البزازية أن الوكالة إلى عشرة أيام لا تنتهي بمضيّ العشرة في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}\n\nاقتران الوكالة بشرط. إن كان الشرط فاسداً، فذهب الحنفية وأحمد في أظهر روايتيه وابن أبي ليلى إلى أن الوكالة لا تبطل بأي شرط فاسد، وذهب الشافعية إلى أن الشرط الفاسد يُفسد الوكالة، كأن يقول الموكل «امنع المبيع من المشتري»، لأن منع الحق عمّن يستحق إثبات اليد عليه حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} وقال الزركشي إن العقود الجائزة كالشركة والوكالة والمضاربة، فاسدها لا يمنع نفوذ التصرف فيها بالإذن، لكن خصائصها تزول بفسادها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} وفائدة الفساد سقوط المسمى من الأجرة والرجوع إلى أجرة المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} ورأى بعض الحنابلة أن الوكالة تبطل كالوديعة لزوال الائتمان، وقال أبو محمد الشافعي إن الإذن ليس منفصلاً عن الوكالة فمعنى فسادها بطلان الإذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}\n\nصفة عقد الوكالة، أي هل هو لازم أو جائز. الرأي الأول، للحنفية والشافعية والحنابلة وبعض المالكية، أنها عقد جائز من الجانبين لأنها تبرّع لا لزوم فيه، فقد يرى الموكل المصلحة في ترك ما وكّل فيه أو في توكيل غيره، ولأن الوكيل قد لا يتفرغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} واستثنى الحنفية والمالكية ما إذا تعلّق بالوكالة حق الغير، فتلزم، كوكيل الخصومة بطلب الخصم، والوكيل ببيع الرهن في حضور المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} وقال الحنفية إن على عدم لزومها تتفرع ثلاث مسائل: لا يدخلها خيار الشرط، ولا يُحكم بالوكالة مقصودة، وللوكيل أن يستقيل منها متى أراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} الرأي الثاني، إن كانت بأجرة على سبيل الإجارة فهي لازمة من الطرفين، ويجب أن تجتمع فيها شرائط الإجارة، وبهذا صرح الشافعية والمالكية في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} الرأي الثالث، لبعض المتأخرين من المالكية، أنها لازمة من جانب الوكيل وإن كانت بغير أجرة، قياساً على لزوم الهبة وإن لم تُقبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} وإن كانت على سبيل الجعالة ففيها ثلاثة أقوال عند المالكية: اللزوم من الطرفين، والجواز من الطرفين وهو المعتمد عند الشافعية، واللزوم من جهة الجاعل دون المجعول له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nالركن الثاني: العاقدان، وهما الموكل والوكيل. أولاً: الموكل، وهو من يقيم غيره مقام نفسه في تصرف جائز معلوم، ويُشترط أن يملك ذلك التصرف وأن تلزمه أحكامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} واتفق الفقهاء على أنه لا تجوز الوكالة من المجنون والمعتوه والمغمى عليه والنائم والصبي غير المميز مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nيجوز توكيل الصبي المميز في التصرفات النافعة له نفعاً محضاً باتفاق، أما التصرفات الدائرة بين النفع والضرر فتصح عند الحنفية والمالكية والحنابلة بإذن الولي، وأبطلها الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} ولا تجوز الوكالة من السفيه المحجور عليه فيما لا يستقل به، ويجوز فيما يستقل به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nولا يجوز عند جمهور الفقهاء توكيل المرأة في النكاح، لأنها لا تزوج نفسها فلا توكل فيه، وأجازه الحنفية، وأجازه المالكية في بعض الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nوفي توكيل المرتد ثلاثة أقوال: الأول، لجمهور الفقهاء (الشافعية في أظهر الأقوال، والحنابلة، وأبي حنيفة)، أنها متوقفة على عودته إلى الإسلام، فإن أسلم نفذت، وإن مات أو قُتل أو لحق بدار الحرب مرتداً بطلت؛ والثاني، للصاحبين وللشافعية في قول، أنها صحيحة نافذة، وزاد الحنفية أن المرتدة يجوز توكيلها باتفاقهم؛ والثالث، للشافعية في قول استوجهه زكريا الأنصاري والشبراملسي، أنها باطلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nوفي توكيل المسلم الذمي في بيع الخمر والخنزير: ذهب الشافعية والمالكية والحنابلة والصاحبان إلى أنه لا يصح، لأن شرط الوكالة أن يملك الموكل التصرف الذي يوكّل فيه، والمسلم لا يملك بيعهما، وفاقد الشيء لا يعطيه؛ وذهب أبو حنيفة إلى الصحة، لأنه يكفي أن يكون للموكل أهلية أداء تخوّله توكيل الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nوفي توكيل المحرم لحلال في النكاح: لا يجوز عند جمهور الفقهاء لأنه لا يباشر العقد حال إحرام الموكل، وأجازه الحنفية مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} ونص الحنابلة على أنه لا تصح الوكالة إذا لم يعرف الوكيل موكله، بأن قيل له «وكّلك زيد» ولم يُنسب ولم يُوصف بما يميّزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nالوكيل. يشترط فيه ما يشترط في الموكل من العقل، فلا يجوز توكيل المجنون والمعتوه والصبي غير المميز باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} وفي اشتراط البلوغ: الحنفية والحنابلة أجازوا وكالة الصبي المميز الذي يعقل العقد ويقصده، وتعود حقوق العقد إلى الموكل لا إليه، وحجتهم أثر أن النبي زوّج أم سلمة بعمرو بن أم سلمة وكان صبياً؛ ومنعه الشافعية لأنه غير مكلف ولا يملك التصرف في حق نفسه فلا يملكه في حق غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} ويشترط أن يكون الوكيل معيناً، فإذا قال شخص «وكّلت أحد الناس في بيع سلعة» بطلت الوكالة لجهالة الوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} وذكر ابن نجيم أن قول الدائن لمدينه «من جاءك بعلامة كذا فادفع ما لي إليه» توكيل مجهول لا يصح، فلا يبرأ المدين بالدفع إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17739}\n\nعلم الوكيل بالوكالة. عند الحنفية العلم بالتوكيل في الجملة شرط، إما علم الوكيل وإما علم من يعامله؛ فلو باع الوكيل قبل علمه وعلم المشتري بالتوكيل لم يجز البيع حتى يجيزه الموكل أو الوكيل بعد العلم. وإذا أخبره بالوكالة عدل صار وكيلاً عند الإجماع، فإن أخبره واحد غير عدل فصدّقه صار وكيلاً، وإن لم يصدّقه فليس بوكيل عند أبي حنيفة، وهو وكيل عند أبي يوسف ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وذهب الحنابلة إلى عدم اشتراط العلم، لأن الاعتبار في العقود بما في نفس الأمر، وهو ما يؤخذ من الأظهر عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وعدالة الوكيل لا تشترط في الجملة، إلا في عقود معينة كالنكاح، وذكورته لا تشترط في الجملة إلا في بعض العقود كالنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}\n\nمحل الوكالة، وهو التصرف المأذون فيه من الموكل للوكيل بملك أو ولاية. وشرطه عند الشافعية ثلاثة: أن يكون معلوماً من بعض الوجوه، وأن يقبل النيابة، وأن يملكه الموكل حال التوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} وتنقسم الوكالة باعتبار المحل إلى خاصة وعامة. فالخاصة ما كان فيها التوكيل بتصرف معين، ولا يتصرف الوكيل إلا فيه باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} والعامة، ففيها خلاف: الحنفية والمالكية يجيزونها في الجملة مع تفصيل، فقال الحنفية إن قوله «أنت وكيلي في كل قليل وكثير» وكالة بالحفظ فقط، وإن قال «في كل شيء جائز أمرك» صار وكيلاً في جميع التصرفات المالية كالبيع والشراء والهبة والصدقة، واختلفوا في الطلاق والعتاق والوقف، والمفتى به عندهم أنه لا يملكها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} وقال المالكية لا تنعقد بمجرد قوله «وكلتك»، بل يُفوَّض الأمر تفويضاً، وما كان فيه تنمية المال جاز، وما كان كالعتق والهبة والصدقة لثواب الآخرة لا يجوز إلا بإذن صريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} أما الشافعية والحنابلة فلا يصحون التوكيل العام، لكثرة الغرر، فلا يصح قوله «وكلتك في كل قليل وكثير لي»، ويصح قوله «وكلتك في بيع أموالي وقبض ديوني» وإن جُهلت الأموال والديون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}\n\nضابط ما يصح أن يكون محلاً للوكالة: كل عقد جاز أن يعقده الإنسان بنفسه جاز أن يوكّل فيه غيره، لأن الإنسان قد يعجز عن المباشرة لبعض الأحوال فيحتاج إلى التوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} وقد اتفق الفقهاء على جواز التوكيل في البيع والشراء، لأن الحاجة داعية إليه، وفعل النبي ذلك حين وكّل عروة البارقي في شراء الشاة، ودفع إلى حكيم بن حزام ديناراً ليشتري به أضحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} واتفقوا أيضاً على جواز التوكيل في الحوالة والرهن والكفالة والشركة والوديعة والمضاربة والجعالة والمساقاة والإجارة والقرض والوصية والفسخ والإبراء والمصارفة والإقالة والشفعة، لأنها في معنى البيع في الحاجة إلى التوكيل؛ وكذلك في الضمان والصلح والهبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743}\n\nاتفق الفقهاء على صحة التوكيل في عقد النكاح من الرجل، واستدلوا بتوكيل النبي عمرو بن أمية وأبا رافع في قبول النكاح له، وبأن الحاجة داعية إليه إذ قد يحتاج الموكل إلى الزواج من مكان بعيد لا يستطيع السفر إليه، وبزواج النبي أم حبيبة وهي يومئذ بأرض الحبشة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nواتفقوا على جواز التوكيل في العبادات المالية كالزكاة والصدقات والمنذورات والكفارات، لأن النبي بعث عماله لقبض الصدقات وتفريقها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} واتفقوا على جواز التوكيل في الطلاق والرجعة والخلع، لأن الحاجة إليه كالحاجة إلى التوكيل في البيع والنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nما لا يصح التوكيل فيه باتفاق. الشهادة: لا يجوز التوكيل فيها، لأنها تتعلق بعين الشاهد فيما رآه أو سمعه، ولأنها مبنية على التعبد واليقين؛ فإن استناب فيها كان النائب شاهداً على شهادته يؤدي ما سمع من شاهد الأصل لا وكيلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} والأيمان والنذور، لأنها تتعلق بعين الحالف والناذر، وكذلك اللعان والإيلاء والقسامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والمعاصي كالقتل والسرقة والغصب والقذف، لأنها محرمة لا يصح فعلها من الموكل ولا من الوكيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والعبادات البدنية المحضة كالصلاة والصيام والطهارة من الحدث، لأنها تتعلق ببدن من وجبت عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745}\n\nما اختلف فيه. الحج: لا يجوز التوكيل فيه لمن يقدر على الحج بنفسه، أما العاجز فتفصيله في موضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والعمرة: يجوز في الجملة أداؤها عن الغير بالوكالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} والنكاح من المرأة: جمهور الفقهاء يمنعون أن توكل المرأة في الزواج أو تتوكل فيه، والحنفية يجيزونه للحرة البالغة العاقلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} والظهار: منعه الجمهور، وأجازه الشافعية في مقابل الأصح، ورأى ابن عبد السلام من المالكية أنه كالطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} وتحصيل المباحات كإحياء الموات والاصطياد وحفر المعدن: أجازه المالكية والشافعية في الأظهر والحنابلة، ومنعه الحنفية وبعض الشافعية والحنابلة لأن الملك للوكيل بوضع اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} والإقرار بالحقوق: أجازه الحنفية والمالكية والحنابلة والشافعية في مقابل الأصح، ومنعه الشافعية في الأصح والطحاوي لأنه إخبار عن حق كالشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747}\n\nالخصومة: أجازها المالكية والشافعية والحنابلة والصاحبان في الدين والعين وسائر الحقوق، حاضراً كان الموكل أو غائباً، رضي الخصم أو لم يرضَ، واستثنى المالكية ما إذا كان الوكيل عدواً للخصم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} واستدلوا بأن علي بن أبي طالب وكّل عقيلاً عند أبي بكر، وبأن الحاجة داعية إليها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} وقال أبو حنيفة لا تجوز الوكالة بالخصومة إلا برضا الخصم، إلا إذا كان الموكل مريضاً أو غائباً مسيرة ثلاثة أيام فأكثر، لأن حضور الموكل لمجلس الحكم حق لخصمه؛ ووجهه أن الدعوى خبر يحتمل الصدق والكذب، فلا يلزم جوابه إلا للضرورة، والضرورة قائمة عند مرض الموكل أو سفره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} وذكر الجصاص أنه لا فصل في ظاهر الرواية بين الرجل والمرأة، واستحسن المتأخرون توكيل المرأة المخدّرة، وقال ابن أبي ليلى لا يجوز إلا توكيل البكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}\n\nإثبات القصاص واستيفاؤه: أجاز المالكية والشافعية والحنابلة وأبو حنيفة ومحمد بن الحسن التوكيل في إثباته، وخالف أبو يوسف فلم يجزه إلا من الموكل لأن الشبهة يُتحرز عنها في الحدود والقصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} وفي استيفاء القصاص: المالكية والشافعية والحنابلة في المذهب أجازوه في حضرة الموكل وغيبته؛ والحنفية وبعض الشافعية والحنابلة لا يجيزونه إن كان الموكل غائباً لاحتمال العفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749}\n\nإثبات الحدود واستيفاؤها: الحنابلة في المذهب أجازوا التوكيل في إثبات حد الزنا مستندين إلى قصة أُنيس، وقال أبو الخطاب منهم لا يصح؛ والشافعية لا يجيزونه في حدود الله إلا حد القذف لأن الحق لله وقد أُمر بالدرء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} وفي الاستيفاء أجازه المالكية والشافعية والحنابلة، واستدلوا بأمر النبي برجم ماعز وبتوكيل عثمان علياً في إقامة حد الشرب على الوليد بن عقبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} وقال الحنفية إن حقوق الله نوعان، فالإثبات: لا يجوز التوكيل فيما لا يحتاج إلى خصومة كحد الزنا والخمر، ويجوز فيما يحتاج إليها كحد السرقة والقذف عند أبي حنيفة ومحمد، ومنعه أبو يوسف؛ والاستيفاء في القذف والسرقة يجوز إن كان المقذوف أو المسروق منه حاضراً، واختلف مشايخهم إن كان غائباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nأحكام الوكالة. تتعلق بالوكيل بأن ينفذها في الحدود التي أذن بها الموكل أو قيّده الشرع أو العرف، وأن يوافي الموكل بالمعلومات الضرورية ويقدم حساب الوكالة، وأن يرد ما للموكل في يده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} والوكالة الخاصة تصدر مطلقة وتصدر مقيدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} ومن صورها الوكالة بالبيع، فعند أبي حنيفة الوكيل بالبيع المطلق لا يتقيد بقيد إلا إذا كان متهماً، فيملك البيع بالقليل والكثير وبالنقد والنسيئة وبالعرض، لأن الأصل في اللفظ المطلق أن يجري على إطلاقه، ولأن البيع بغبن فاحش لغرض شراء ما هو أربح متعارف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nالوكالة المطلقة في البيع. اختلف الفقهاء في تقييدها على رأيين. الأول لأبي حنيفة، وهو أن الوكيل المطلق لا يتقيد بأي قيد إلا إذا كان متهماً، فيملك البيع بالقليل والكثير وبالنقد والنسيئة وبالعرض، لأن اللفظ المطلق يجري على إطلاقه، ولأن البيع بغبن فاحش لغرض شراء ما هو أربح متعارف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} والثاني لجمهور الفقهاء (المالكية والشافعية والحنابلة) وهو أن الوكيل المطلق مقيد بقيود، منها: أن يبيع بنقد البلد، لأن إطلاق النقد ينصرف إلى نقد البلد، وأن يبيع بثمن المثل فيما لا يتغابن الناس بمثله، فإن باع دونه فعند المالكية يخير الموكل ولو يسيراً، واليسير نصف العشر فأقل، وعند الحنابلة يصح البيع ويضمن الوكيل النقص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} ومنها أن يبيع بالنقود لا بالعرض عند المالكية والحنابلة والصاحبين، وأن لا يبيع نسيئة عند المالكية والشافعية والحنابلة، ويتخرج عند الحنابلة جواز ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} وأن لا يبيع بمنفعة عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}\n\nبيع الوكيل لنفسه. جمهور الفقهاء (الحنفية والشافعية والحنابلة في المذهب والمالكية في المعتمد) يمنعون ذلك، لأن العرف في البيع أن يبيع الإنسان من غيره، ولأن فيه تهمة؛ وأجازه المالكية والحنابلة إذا أذن له الموكل، واستثنى المالكية ما إذا تناهت الرغبات أو كان البيع بحضرة الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعن أحمد رواية بالجواز إذا زاد على الثمن في النداء وتولى النداء غيره، ورأى القاضي أن الثاني قد يكون واجباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعند المالكية في قول: يجوز إن لم يحاب نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754}\n\nبيع الوكيل لمن لا تُقبل شهادته له. عند الحنفية إن باع ممن لا تُقبل شهادته له بأكثر من القيمة جاز، وبأقل بغبن فاحش لا يجوز بالإجماع، وبمثل القيمة فيه روايتان؛ وأجاز الصاحبان البيع منهم بمثل القيمة إلا من عبده أو مكاتبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} وعند المالكية على المشهور لا يجوز للوكيل أن يبيع لمحجوره من صغير أو سفيه أو رقيق غير مأذون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} وعند الشافعية لا يجوز أن يبيع لولده الصغير ولو أُذن له، والأصح جواز بيعه لأصوله ولفروعه غير المحجورين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} وعند الحنابلة في المذهب لا يجوز أن يبيع لولده أو والده أو مكاتبه، ويجوز في الوجه الثاني، ومحل الخلاف إن لم يأذن الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755}\n\nالوكالة المقيدة في البيع. يلتزم الوكيل بقيود موكله باتفاق. قال الحنفية إن الوكيل إذا خالف قيد موكله لا ينفذ على الموكل إلا بإجازته، إلا أن يكون الخلاف إلى خير، فيكون ذلك موافقة معنى. فإذا قال «بع ثوبي بألف درهم» فباعه بأقل أو بغير الدراهم لم ينفذ، وإن باعه بأكثر نفذ، وإن قال «بع نسيئة» فباعه حالاً نفذ، وإن أمره بالحلول فباعه نسيئة توقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} ورأى المالكية أن الزيادة في البيع أو النقص في الشراء لا توجب الخيار، لأن ذلك مما يرغب فيه، وأن المخالفة لا توجب الخيار إلا إذا تعلق بها غرض صحيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} وقال الشافعية والحنابلة: لا يملك الوكيل من التصرف إلا ما يقتضيه الإذن نطقاً أو عرفاً، فإن كان في أحد التصرفين ضرر بالموكل امتنع، لقوله «لا ضرر ولا ضرار»، وإن كان فيه نظر له لزم، وهو مقتضى النصيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} والإذن المقيد بزمان لا يتعداه، والمقيد بمكان يتعلق به غرض، والمقيد بمشترٍ معين لا يتعدى إلى غيره إلا إذا علم الوكيل أن الموكل لا غرض له في عينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}\n\nمخالفة الوكيل في الثمن. في الوصف: إذا أمره ببيع نسيئة فباع حالاً، فجمهور الفقهاء يجيزون البيع وينفذ في حق الموكل لأن الموكل حصل مقصوده وزاده الوكيل خيراً؛ ويرى الحنابلة في قول أنه إن كان للموكل غرض معين في التأجيل بطل البيع، ومنعه الشافعية إن كان للموكل غرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} وإذا أمره ببيع نسيئة بثمن محدد فباعها نقداً بأقل، فالحنفية والشافعية والحنابلة لا يجيزون البيع، والمالكية يجعلونه موقوفاً على إجازة الموكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} وإذا أمره بالحلول فباع نسيئة، فالحنفية والشافعية والحنابلة لا يجيزون البيع لأن للتعجيل غرضاً، والمالكية يجعلونه موقوفاً على الإجازة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759}\n\nوللشافعية والحنابلة أن الوكيل لا يملك من التصرف إلا ما يقتضيه إذن الموكل نطقاً أو عرفاً، فإن كان في أحد التصرفين ضرر بالموكل امتنع، وإن كان فيه نظر له لزم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} والإذن المقيد بزمان لا يتعداه، والمقيد بمكان ذي غرض لا يُتعدّى إلى غيره، والمقيد بمشترٍ معين لا يُتعدى إلى غيره إلا إذا علم الوكيل أن الموكل لا غرض له في عينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}"
  en: "Wakala, with its vowel variants, means in the language protection, as in the Divine name al-Wakil meaning the Guardian, and in tawakkul ('we have entrusted our affairs to God'); tawkil is the delegation of a disposal to another. The agent is called wakil because his principal has entrusted him with the conduct of his affair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} The jurists define it in several ways. The Hanafis: setting another in one's place in a lawful, known disposal, out of ease or incapacity. The Malikis: the deputising of a person with a right, who has no command or worship, for another in what is not conditioned on his death. The Shafi'is: the delegation by a person of what he may do and that admits delegation, to another to do it during his life. The Hanbalis: the deputising of a person capable of disposing of property, like himself, in what deputising admits of rights of God and rights of men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe Mawsu'a distinguishes wakala from neighbouring terms: deputising (niyaba), which is for some jurists wider than wakala and for others its synonym; authority (wilaya), the carrying out of a word over another whether he wills it or not, which is a legal or compulsory deputising, while wakala is agreed; bequest (iya'), the setting of another in one's place in disposal after death, while wakala is in life; and guardianship (qiwama), a power given by the judge to an adult to act for a minor's interest, or the husband's authority over his wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe jurists agree that wakala is lawful. They cite the Qur'an: the account of the People of the Cave sending one of them with their silver to the city, and the verse of the two arbiters in Surat al-Nisa, which is taken to show that each arbiter acts as agent of one of the spouses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} They cite the Sunna: the report of 'Urwa ibn Abi al-Ja'd al-Bariqi, to whom the Prophet gave a dinar to buy a sheep; the report of Hakim ibn Hizam about buying a sacrifice; the report of Jabir about the agent at Khaybar; and the report of Abu Rafi' that he was the go-between in the Prophet's marriage to Maymuna. The jurists agree on its lawfulness from the time of the Prophet to the present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} By reason, the need for it is clear, since a person may be unable to act himself by illness, age or rank, and without it hardship would follow, which the text removes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe pillars of wakala: the majority hold them to be the formula, the two parties (principal and agent) and the object of the agency. The Hanafis hold that the pillar is the offer and acceptance, since their presence entails the other two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} The formula is the offer and acceptance, through which mutual consent is expressed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe offer. The majority hold it is what comes from the principal and shows his permission to appoint an agent; the Hanafis hold it is what comes first from one of the contracting parties to show his desire to make the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} It may be made by any sign of consent, in words, in writing, by message or by the sign of a mute man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Explicit words include 'I appointed you', 'I entrusted to you', 'I made you my deputy', 'I permitted you', 'I set you in my place' and 'you are my agent'. An order such as 'sell it' is valid for the Hanafis, Shafi'is and Hanbalis, and for the Malikis where custom so treats it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} The words 'I will appoint you', 'I appoint you' and 'I have relied on you' do not make a valid agency for the Shafi'is, since they are ambiguous, unless a clear term is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nAgency may be concluded by message, according to the Hanafis, Malikis and Shafi'is: the agent becomes agent once the news reaches him and he accepts, whether the bearer is trustworthy or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} The offer may also be made by clear writing, by the understood sign of a mute man, by an act that shows permission (for the Hanbalis), and by what custom treats as an offer, as when a husband disposes of his wife's property while she knows and keeps silent (the Malikis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} Silence is not an offer for the Hanafis, Shafi'is and Hanbalis: one who sees a stranger sell his property and says nothing is not made an agent by his silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nThe acceptance may be given in words, such as 'I accept' or words showing acceptance. The Hanafis and Shafi'is add that the agent must not refuse; if he refuses after the offer, no agency is concluded even if he accepts later, unless the offer and acceptance are renewed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} On acceptance by act there are three views. The majority (Hanafis, Malikis, the sounder Shafi'i view, and the Hanbalis) hold that it is complete by any act that shows it, such as the agent doing what he was told; the Shafi'is in one view, the Hanbalis in one view and Zufar among the Hanafis hold that it requires words; a third Shafi'i view distinguishes: if the offer is in the form of a command such as 'sell and buy', acceptance by act suffices, but if it is in the form of a contract such as 'I appointed you', words are needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Acceptance is also valid in clear addressed writing and by the understood sign of a mute man; the Hanafis hold that an agent's silence is acceptance, which is undone by his refusal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nIf acceptance is delayed after the offer, the majority (Hanafis, Hanbalis, the Shafi'i school view, and one Maliki view) hold that it is valid, since the permission remains while the principal does not withdraw it, and it is like a permission to act. The Shafi'is limit this to cases where the time of the act is not fixed; if it is fixed and there is fear of its passing, acceptance must be immediate, as also when the judge offers the agency to a man on its being established before him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} The second Maliki view and Abu Hamid al-Marwarudhi among the Shafi'is hold acceptance must be immediate, because wakala is a contract made in life, and like sale it requires immediate acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Al-Mazari said the matter returns to intention and custom: whether the words in question call for an immediate reply, or allow a prompt or a deferred one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe forms of the wakala formula, by the time at which its effects arise, are: the immediate form, which is neither conditioned on a condition nor linked to a time; the conditional form; the form attached to the future; and the time-limited form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe immediate formula, which is neither conditioned on a condition nor linked to a time, as in the principal saying 'I appointed you to sell that house', is valid by agreement of the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nThe formula conditioned on a condition. The jurists differ on two views. The first, held by the Hanafis, the sounder Hanbali view and, against the sounder view, the Shafi'is, is that it is valid, as in 'if the pilgrim arrives, sell this food'. They cite the report of Ibn 'Umar that the Prophet appointed Zayd ibn Haritha to command at Mu'ta, then Ja'far, then Ibn Rawaha if the first two were killed; and they argue that the agency is a contract whose effect on the agent, the permission to act, is recognised, so it is like a bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} The second, held by the sounder Shafi'i view and one Hanbali view, is that it is invalid; al-Mawardi says conditioning an agency on conditions or terms is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} The Shafi'is allow the principal to conclude the agency now and to make the act itself subject to a condition, as in 'sell it after a month', since that is postponement, not conditioning. Al-Ghazali reports that the Iraqis held that 'I appointed you now, but do not act until a month passes or a certain man arrives' is valid, since it is a delay, and the agent must comply. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nThe periodic formula: the principal says 'I appointed you to sell this property, and whenever I remove you, you are my agent again', so the agency renews itself each time he removes the agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} The Hanafis and the sounder Hanbali view hold it valid, on the ground that agency admits conditioning; for the Hanafis the principal may remove his agent at any time, and for the Hanbalis removal is effected by his words 'I removed you, and whenever I appoint you, I have removed you'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} Ibn Taymiyya holds it invalid, since it would turn a permissive contract into a binding one; the purpose of the conditional is to prevent appointment, not to dissolve a contract before it exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} The Shafi'is have two views on its validity at once; the sounder is that it is valid, because permission exists. If he removes the agent, and the agent did not know, or knew, there are two views on whether the agency returns after removal; the sounder is that it does not. If the words are 'whenever I remove you', the agency returns once; if they are 'every time I remove you', it returns each time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe formula attached to a future time, as in 'I appointed you to sell my beasts in Ramadan', or 'I appointed you to sell this house tomorrow'. The Hanafis and Hanbalis hold it valid, since agency admits being attached to the future; the Hanafis add that the agent becomes agent from tomorrow onward and not before. The Shafi'is agree that it is valid, since the agency is concluded now and only the act is linked to a future time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe formula conditioned on a time, as in 'when the new month comes, I appointed you to sell my house': on the sounder Shafi'i view it is void, since conditioning an agency on terms is invalid; the Hanafis, Hanbalis and the opposite Shafi'i view hold it valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} The Hanafis distinguish attachment (idafa) from conditioning (ta'liq). An attached formula is a cause that concludes the contract now while its effect is deferred to the time; a conditioned formula cannot be a cause of the effect now, so the agency is not concluded until the condition is met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe time-limited formula, as in 'you are my agent for a month', is valid by the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} They differ whether it survives the period. The Shafi'is hold that it does not survive the period. The Hanafis report two views on one who was told 'sell my house today' and did it tomorrow: the sounder view is that the agency does not survive the day, but some Hanafis hold it survives, since naming the day is for haste, not for limiting the agency to that day. Al-Bazzaziyya, quoted by the author of Minhat al-Khaliq, holds that an agency for ten days does not end when the ten days pass, on the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}\n\nConditions attached to the agency. If the condition is invalid, the Hanafis, Ahmad in the apparent of his two reports, and Ibn Abi Layla hold that the agency is not invalidated by any invalid condition. The Shafi'is hold that an invalid condition invalidates it, as when the principal says 'prevent the buyer from taking the goods', since to prevent a right-holder from taking possession is forbidden; the sale itself is valid by permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Al-Zarkashi says that the permissive contracts (partnership, agency and mudaraba) are not stopped from taking effect by permission when they are invalid, but lose their own features. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} The effect of invalidity is that a named fee falls away and the customary fee is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Some Hanbalis hold that the agency is void, like a deposit, because the trust is gone; and Abu Muhammad among the Shafi'is says the permission is not separate from the agency, so its invalidity means the permission is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}\n\nThe nature of the agency contract, whether binding or permissive. The first view, held by the Hanafis, Shafi'is, Hanbalis and some Malikis, is that it is permissive on both sides, since it is a gift and gifts are not binding: the principal may see that it is better to leave the matter, or to appoint another, and the agent may not be free. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The Hanafis and Malikis except where a third party's right attaches to the agency, which then binds, as with an agent in a suit appointed at the claimant's request, or an agent to sell a pledge in the presence of the pledgee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The Hanafis say that from its non-binding nature three rules follow: an option of stipulation does not enter it; agency is not valid as a principal claim; and the agent may resign whenever he wishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The second view: if the agency is for a fee in the form of a hire, it binds both sides and must meet the conditions of hire; the Shafi'is and in one view the Malikis say so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} The third view, of some later Malikis, is that it binds the agent's side even without a fee, by analogy with a gift that binds once given, though not received. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} If the agency is by way of a reward (ju'ala), the Malikis hold three views: binding on both sides; permissive on both sides, which is the view relied upon by the Shafi'is; and binding on the side of the one who offers the reward once the other starts work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nThe second pillar, the two parties, the principal and the agent. First, the principal: one who sets another in his place in a lawful known disposal, who must have the power to make that disposal and be bound by its rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} The jurists agree that agency may not be made by an insane person, an imbecile, a person under anaesthesia, a sleeper, or a minor who cannot discern, in any disposal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nA discerning minor may be appointed to acts that are purely beneficial to him, by agreement. For acts that are between benefit and loss, the Hanafis, Malikis and Hanbalis allow it with the guardian's permission, while the Shafi'is void it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} A spendthrift placed under restraint may not be appointed in what he cannot do independently, but may be in what he can. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nThe majority of jurists do not allow a woman to be appointed in a marriage, since she does not marry herself and so cannot be an agent for it; the Hanafis allow it, and the Malikis allow it in some cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736}\n\nOn the appointment of an apostate there are three views. The first, held by the majority (the sounder Shafi'i view, the Hanbalis and Abu Hanifa), is that it is suspended on his return to Islam: if he returns the agency takes effect, and if he dies, is killed or joins the enemy as an apostate, it is void. The second, held by the two companions of Abu Hanifa and by one Shafi'i view, is that it is valid and binding; the Hanafis add that an apostate woman may be appointed by their agreement, since her acts take effect. The third, a Shafi'i view that Zakariyya al-Ansari and al-Shibramallisi regarded as the sound one, is that it is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nOn a Muslim appointing a dhimmi to sell wine or pork: the Shafi'is, Malikis, Hanbalis and the two companions hold it invalid, because a condition of the agency is that the principal himself owns the act he delegates, and a Muslim cannot sell wine or pork; one cannot give what one lacks. Abu Hanifa holds it valid, since it is enough that the principal has the capacity to act that entitles him to appoint another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nOn a pilgrim (muhrim) appointing a non-pilgrim to contract a marriage: the majority do not allow it, since the pilgrim does not conduct the contract during his pilgrimage; the Hanafis allow it in every case, since he could conduct the contract himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} The Hanbalis say that agency is invalid if the agent does not know his principal, as when he is told 'Zayd has appointed you' without a name or a description that identifies him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737}\n\nThe agent must have the same sanity as the principal, so an insane person, an imbecile or a minor who cannot discern may not be an agent, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17737} On puberty as a condition: the Hanafis and Hanbalis allow a discerning minor who understands the contract and intends it to be an agent, and the rights of the contract return to the principal, not to him; their evidence includes the report that the Prophet married Umm Salama through 'Amr ibn Umm Salama, who was a boy. The Shafi'is forbid it, because a minor is not accountable and cannot dispose of his own right, so he cannot dispose of another's by appointment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} The agent must be named: if someone says 'I appointed one of the people to sell this goods', the agency is void, because the agent is unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17738} Ibn Najim says that a creditor's words to his debtor, 'whoever comes to you with a certain sign, and takes your finger, or says such and such to you, pay what I owe him', are an unknown agency that does not discharge the debtor if he pays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17739}\n\nKnowledge of the agency. For the Hanafis, knowledge of the agency is a condition, either by the agent or by the party dealing with him. If the agent sells before he knows and the buyer knows, the sale is not valid until the principal or the agent ratifies it after knowledge. If a trustworthy man informs the agent, and the agent accepts, he is an agent; if one who is not trustworthy informs him and he accepts, he is an agent; if he does not accept, Abu Hanifa holds he is not an agent, while Abu Yusuf and Muhammad hold he is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} The Hanbalis do not require knowledge, since the matter of contracts is what is actually the case; the sounder Shafi'i view agrees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Justice in the agent is not required in general, except in certain contracts such as marriage; nor is the male sex, except in some contracts such as marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}\n\nThe object of the agency is the disposal the principal permits the agent, in ownership or in guardianship. The Shafi'is set three conditions: it must be known in some respects; it must admit deputising; and the principal must own it at the time of the agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17740} Agency is special, where it concerns a named disposal and the agent may act only in that, by agreement; or general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741} On general agency the Hanafis and Malikis allow it with detail. The Hanafis say that 'you are my agent in every small and great matter' gives only the power to keep; 'you are my agent in every matter your order permits' makes the agent competent for all money dispositions, such as sale, purchase, gift and alms; they differ on divorce, emancipation and waqf, and the view taken is that the agent does not have those, which the author of al-Bazzaziyya also holds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17741}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} The Malikis say that a general agency is not concluded by the bare words 'I appointed you'; it must be delegated in words such as 'a delegated agency' or 'in all my affairs'. What increases property is allowed; gifts, emancipation and alms for the reward of the next life are not, unless the principal permits them in words. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} The Shafi'is and Hanbalis hold a general agency invalid because of the risk. 'I appointed you in all my small and great matters' or 'I delegated to you everything' is therefore invalid, while 'I appointed you to sell my goods and collect my debts' is valid even if the goods and debts are unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742}\n\nThe general rule for what may be the object of an agency is that whatever contract a person may make himself, he may appoint another to make, because a person may be unable to act himself in some circumstances and so needs to appoint another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} The jurists agree that agency in sale and purchase is valid, because there is a need for it. The Prophet himself appointed 'Urwa al-Bariqi to buy a sheep, and gave a dinar to Hakim ibn Hizam to buy a sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743} They also agree that agency is valid in assignment of debt (hawala), pledge, surety, partnership, deposit, mudaraba, reward contracts (ju'ala), irrigation partnership (musaqa), hire, loan, bequest, rescission, release, exchange (musarafa), cancellation (iqala) and pre-emption, since all of these are like sale in their need for an agent; likewise surety, settlement and gift. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17743}\n\nThe jurists agree that a man may appoint an agent in a marriage contract, citing the Prophet's appointment of 'Amr ibn Umayya and Abu Rafi' to accept a marriage for him; the need for it, since a man may wish to marry from a far place and cannot travel there; and the Prophet's marriage to Umm Habiba while she was in the land of Abyssinia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nThey agree that agency is valid in financial acts of worship, such as zakat, charity, vows and expiations, since the Prophet sent his agents to collect and distribute charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} They also agree that agency is valid in divorce, revocation and khul', since the need is like the need for agency in sale and marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744}\n\nActs that agency may not cover, by agreement. Testimony: agency is not valid in it, because it depends on the witness himself, who reports what he saw or heard, and because it rests on devotion and certainty; if a witness appoints another to testify, the second acts as a witness on the first witness's testimony and not as an agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17744} Oaths and vows, since they depend on the swearer or vower himself; so do the oaths of mutual cursing, the vow of abstinence from wives and the oath of compurgation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Sins, such as killing, theft, usurpation and slander, which are forbidden and may not be done by the principal or the agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} And purely bodily worship, such as prayer, fasting and the purification from minor impurity, since they depend on the body of the one obliged. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745}\n\nMatters on which the jurists differ. The pilgrimage: agency is not allowed for a person able to make it himself; the incapable person's case is set out elsewhere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} The lesser pilgrimage (umra) may generally be performed on behalf of another by agency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17745} Marriage by a woman: most jurists forbid a woman to appoint or be appointed in marriage, since she may not contract it herself; the Hanafis allow it for a free adult sane woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Zihar: the majority forbid agency in it, the sounder Shafi'i view forbids it, and a Shafi'i view allows it; Ibn 'Abd al-Salam of the Malikis held that zihar is like divorce, since both are mere utterances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Securing permitted acts, such as reviving dead land, drawing water, hunting, gathering grass or digging a mine: the Malikis, the sounder Shafi'i view and the Hanbalis allow it, since the ownership comes from a cause that does not bind the person; the Hanafis, some Shafi'is and some Hanbalis forbid it, since the cause of ownership, taking hold, has occurred for the agent and an intention cannot turn it aside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17746} Acknowledgement of rights: the Hanafis, Malikis, Hanbalis and a non-sounder Shafi'i view allow it, since it establishes a right in the obligation by words, as sale does; the sounder Shafi'i view and al-Tahawi forbid it, since it is a report about a right, like testimony. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747}\n\nLitigation: the Malikis, Shafi'is, Hanbalis and the two companions of Abu Hanifa allow agency in litigation over debts, specific property and all rights, whether the principal is present or absent, sick or well, and whether the opponent consents or not; the Malikis exclude an agent who is hostile to the opponent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} They cite the consensus of the Companions, as 'Ali appointed 'Aqil before Abu Bakr and said 'what is decided for him is mine, and what is decided against him is mine'; and the need for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17747} Abu Hanifa holds that litigation by agency is valid only with the opponent's consent, unless the principal is sick or absent three days' journey or more, since the principal's presence at the court is a right of his opponent. His reason is that a claim is a report that may be true or false, so its answer is required only by necessity; that necessity arises when the principal is sick or travelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} Al-Jassas reports that the apparent view draws no distinction between a man and a woman, or a virgin and a married woman; later Hanafis approve the agency of a secluded woman who does not appear in public; Ibn Abi Layla held it valid only for a virgin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748}\n\nProof and execution of retaliation (qisas). The Malikis, Shafi'is, Hanbalis, Abu Hanifa and Muhammad al-Shaybani allow agency in proving qisas, whether the principal is present or absent, since qisas is a human right; Abu Yusuf does not allow it, and the evidence is accepted only from the principal himself, because of the doubt that must be guarded against in retaliation and the hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17748} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} On the execution of qisas: the Malikis, Shafi'is and the school view of the Hanbalis allow it whether the principal is present or absent. The Hanafis, some Shafi'is and some Hanbalis allow it only when the principal is present, since he may pardon in his absence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749}\n\nProof and execution of the hudud. The Shafi'is and Hanbalis distinguish the two. The school view of the Hanbalis allows agency in proving adultery, from the story of Unays; Abu al-Khattab among them says it is invalid. The Shafi'is do not allow agency in proving the hudud of God except the hadd of slander, since the right is God's, and it is commanded to avert it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17749} On execution, the Malikis, Shafi'is and Hanbalis allow agency, citing the Prophet's order to stone Ma'iz and 'Uthman's appointment of 'Ali to carry out the flogging for drinking on al-Walid ibn 'Uqba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} The Hanafis say there are two kinds of rights of God: proof, where agency is not allowed for the hudud that need no litigation, such as adultery and drinking, and is allowed for those that need it, such as theft and slander, according to Abu Hanifa and Muhammad, but Abu Yusuf forbids it; and execution of slander and theft is valid when the injured party is present, while if he is absent the Hanafi shaykhs differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17750} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nThe rules of agency. They bind the agent to carry it out within the limits the principal permitted or that law or custom imposes, to inform the principal of necessary information and render an account, and to return what belongs to the principal that is in his hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} A special agency may be issued unrestricted or restricted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751} Among its forms is agency in sale. For Abu Hanifa, the agent in an unrestricted sale is not bound by any restriction unless he is suspected; he may sell for little or much, for cash or on credit, and for goods, since the unrestricted word keeps its unrestricted sense, and a sale at a gross undervaluation in order to buy something more profitable is also customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17751}\n\nThe unrestricted agency in sale. The jurists differ on whether it is restricted, on two views. The first, Abu Hanifa's, is that an agent in an unrestricted sale is not bound by any restriction unless he is suspected; he may sell for little or much, for cash or on credit, and for goods, since the unrestricted word keeps its unrestricted sense, and a sale at a gross undervaluation in order to buy something more profitable is customary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} The second, the majority (Malikis, Shafi'is and Hanbalis), is that the unrestricted agent is restricted by several limits. He may sell only for the currency of the town, since an unrestricted currency means the local currency. He may sell only at the market price in goods that people do not sell at a notable undervaluation; if he sells below it, the Malikis give the principal a choice, even for a small loss, which they set at half a tenth or less; the Hanbalis hold the sale valid and make the agent liable for the shortfall. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17752} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753} He may not sell in goods instead of money, according to the Malikis, Hanbalis and the two companions; he may not sell on credit, according to the Malikis, Shafi'is and Hanbalis, though a Hanbali deduction allows it; and he may not sell for a benefit, according to the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}\n\nThe agent selling to himself. The majority (Hanafis, Shafi'is, the school view of the Hanbalis and the settled Maliki view) forbid it, since custom in sale is that a man sells to another, and there is a suspicion of bias. The Malikis and Hanbalis allow it if the principal permits, and the Malikis exclude cases where the bids have run high or where the sale is in the principal's presence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} A narration of Ahmad allows the agent to buy if he outbids in a public auction and someone else conducts the auction; al-Qadi said the second condition may be obligatory and may be recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} A Maliki view allows it if he does not favour himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754}\n\nThe agent selling to one whose testimony cannot be accepted for him. For the Hanafis, a sale to such a person above the value is valid; below the value by gross undervaluation it is invalid by agreement; at the value there are two narrations of Abu Hanifa. The two companions allow a sale to them at the value, except to his own slave or the slave who has bought his freedom by instalments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17754} The Malikis hold, on the settled view, that the agent may not sell to his ward, whether a minor, a spendthrift or an unauthorised slave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} The Shafi'is forbid a sale to his young son even if permitted, and the sounder view allows sale to his ascendants and his non-ward descendants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755} The Hanbalis in the school view forbid a sale to his son, his father or his mukatab (a slave contracted to buy his freedom by instalments); the other view allows it; the difference arises where the principal did not permit it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17755}\n\nRestricted agency in sale. The agent must keep to the restrictions the principal set, by agreement. The Hanafis say that if he goes against a restriction the sale does not bind the principal unless he ratifies it, unless the difference is for the better, which is agreement in meaning. If he is told 'sell my garment for a thousand dirhams' and sells for less, or for something other than dirhams, the sale is not binding, even if the goods are worth more; if he sells for more, it binds. If he is told to sell on credit and sells for cash, the sale binds; if he is told to sell for cash and sells on credit, it is suspended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} The Malikis hold that exceeding the price in a sale, or paying less in a purchase, does not give the principal an option, since it is desired; only a difference which affects a valid purpose does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756} The Shafi'is and Hanbalis say the agent may act only in what the principal's permission requires by word or custom. If one of two acts harms the principal he may not do it, citing the saying that there should be no harm nor reciprocal harm; if one benefits the principal, he must do it, since that is the sincere counsel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} A permission limited to a time does not extend before or after it; one limited to a place with an interest in it, such as a market known for its currency or price, is confined to that place, and where the place is equal in interest, the permission extends to it. Where the buyer is named, the agent may not sell to anyone else, unless he knows the principal has no interest in that particular buyer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}\n\nBreach of the price terms. As to the description of the price: if the principal says 'sell on credit' and the agent sells for cash, the majority hold that the sale binds the principal, since he gets his object and the agent has given him more; a Hanbali view makes the sale void where the principal has a definite interest in the deferral, and the Shafi'is forbid it where the principal has an interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} If he is told to sell on credit for a fixed price and sells for cash at less, the Hanafis, Shafi'is and Hanbalis do not allow the sale, and the Malikis make it suspended on the principal's approval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759} If he is told to sell for cash and sells on credit, the Hanafis, Shafi'is and Hanbalis do not allow it, since immediate payment may be the principal's interest; the Malikis make it suspended on approval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17759}"
