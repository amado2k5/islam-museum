id: concept/wakala-fiqh
class: concept
kind: legal
label:
  ar: "وَكالة"
  en: "Wakala (agency, fiqh)"
summary:
  ar: "الوكالة بالفتح والكسر في اللغة الحفظ، ومنه الوكيل في أسماء الله بمعنى الحافظ، ومنه التوكل، والتوكيل تفويض التصرف إلى الغير، وسُمّي الوكيل وكيلاً لأن موكّله فوّض إليه القيام بأمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} وفي الاصطلاح تعددت التعريفات: فعرّفها الحنفية بأنها إقامة الغير مقام نفسه في تصرف جائز معلوم، ترفّهاً أو عجزاً؛ وعرّفها المالكية بأنها نيابة ذي حق، غير ذي إمرة ولا عبادة، لغيره فيه غير مشروطة بموته؛ وعرّفها الشافعية بأنها تفويض شخص ما له فعله مما يقبل النيابة إلى غيره ليفعله في حياته؛ وعرّفها الحنابلة بأنها استنابة جائز التصرف مثله فيما تدخله النيابة من حقوق الله وحقوق الآدميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nيفرّق الكتاب بين الوكالة وألفاظ قريبة منها: النيابة، وهي قيام الإنسان عن غيره بفعل أمر، وهي عند بعضهم أعم من الوكالة، وعند آخرين مترادفة؛ والولاية، وهي تنفيذ القول على الغير شاء أو أبى، وهي نيابة شرعية أو إجبارية، بينما الوكالة نيابة اتفاقية؛ والإيصاء، وهو إقامة الإنسان غيره مقام نفسه في التصرف بعد الموت، بينما الوكالة في الحياة؛ والقوامة، وهي ولاية يفوضها القاضي إلى راشد للتصرف لمصلحة القاصر، أو ولاية الزوج على زوجته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nاتفق الفقهاء على مشروعية الوكالة، واستدلوا عليها بالقرآن: بقصة أصحاب الكهف في بعث أحدهم بورقهم إلى المدينة، وبآية الحكمين في سورة النساء، والحكم وكيل عن الزوجين على رأي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} وبالسنة: حديث عروة بن أبي الجعد البارقي الذي أعطاه النبي ديناراً ليشتري به شاة، وحديث حكيم بن حزام في شراء الأضحية، وحديث جابر في الوكيل بخيبر، وحديث أبي رافع في زواج النبي بميمونة وكان الرسول بينهما؛ وأجمع الفقهاء على جوازها من عصر النبي إلى اليوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} واستدلوا بالمعقول، وهو أن الحاجة داعية إليها، لأن الإنسان قد يعجز عن المباشرة بنفسه لمرض أو كبر أو وجاهة، فلو لم تجز لوقع الحرج المنفيّ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nأركان الوكالة. يرى جمهور الفقهاء أنها الصيغة والعاقدان (الموكل والوكيل) ومحل العقد (الموكل فيه)، ويرى الحنفية أن ركنها الإيجاب والقبول، لأن وجودهما يستلزم الركنين الآخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} والصيغة هي الإيجاب والقبول، يُعبّر بهما عن التراضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nالإيجاب. يرى الجمهور أنه ما يصدر من الموكل ويدل على إذنه بالتوكيل، ويرى الحنفية أنه ما صدر أولاً من أحد المتعاقدين للدلالة على رغبته في إنشاء العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} ويتحقق بكل ما يدل على الرضا بالوكالة، باللفظ أو الكتابة أو الرسالة أو إشارة الأخرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} فمن اللفظ الصريح: وكلتك، أو فوضت إليك، أو أنبتك، أو أذنت لك، أو أقمتك مقامي، أو أنت وكيلي؛ وأما الأمر كقوله بعه، فيصح عند الحنفية والشافعية والحنابلة، وعند المالكية إذا جرى العرف به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} أما ألفاظ «سأوكلك» و«أوكلك» و«قد عولت عليك» و«قد اعتمدت عليك» فلا تنعقد بها الوكالة عند الشافعية لاحتمالها، إلا أن يُضم إليها لفظ صريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nوتنعقد الوكالة بالرسالة عند الحنفية والمالكية والشافعية، ويكون الوكيل وكيلاً متى بلغه الخبر وقبل، سواء كان المخبر عادلاً أو غير عادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} ويتحقق الإيجاب بالكتابة المستبينة، وبالإشارة المفهومة من الأخرس، وبالفعل الدال على الإذن عند الحنابلة، وبما جرت العادة باعتباره إيجاباً عند المالكية، كتصرف الزوج في مال زوجته وهي عالمة ساكتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} ولا يكون السكوت إيجاباً عند الحنفية والشافعية والحنابلة؛ فمن رأى أجنبياً يبيع ماله فسكت لم يصبح وكيلاً بسكوته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nالقبول. يتحقق باللفظ، كأن يقول الوكيل قبلت، أو بكلام يشعر بالقبول؛ وزاد الحنفية والشافعية أنه لا بد ألا يرده الوكيل، فإن رده بعد الإيجاب لم تنعقد الوكالة وإن قبل بعد ذلك، ما لم يجدد الإيجاب والقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} وفي القبول بالفعل ثلاثة آراء: الجمهور (الحنفية والمالكية والشافعية في أصح الوجهين والحنابلة) يرون أنه يتحقق بكل فعل دال عليه، كفعل الوكيل ما أمره به الموكل؛ والشافعية في وجه والحنابلة في قول وزفر من الحنفية يرونه لا يتحقق إلا باللفظ؛ والشافعية في وجه ثالث يفرّقون: إن كانت صيغة الإيجاب أمراً كقوله «بع واشترِ» تحقق القبول بالفعل، وإن كانت صيغة عقد كـ«وكلتك» فلا بد من اللفظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} ويصح القبول بالكتابة المستبينة المعنونة، وبإشارة الأخرس المعلومة، وعند الحنفية يكون سكوت الوكيل قبولاً ويرتد برده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nوإذا تراخى القبول عن الإيجاب، فجمهور الفقهاء (الحنفية والحنابلة والشافعية في المذهب والمالكية في أحد القولين) يصححونه، لأن الإذن قائم ما لم يرجع عنه الموكل، فأشبه الإباحة؛ وقيّد الشافعية ذلك بألا يتعين زمان العمل، فإن تعين وخيف فواته كان القبول على الفور، وكذا إذا عرضه الحاكم عليه عند ثبوتها عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وذهب المالكية في القول الثاني وأبو حامد المروروذي من الشافعية إلى أن القبول على الفور، لأن الوكالة عقد في حال الحياة فيكون القبول فيه على الفور كالبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وقال المازري إن التحقيق يرجع إلى القصد والعوائد: هل المراد من هذه الألفاظ استدعاء الجواب فوراً، أم معجلاً أو مؤجلاً؟ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nأقسام صيغة الوكالة بحسب وقت ترتّب آثارها: المنجّزة، وهي ألا تكون معلقة بشرط ولا مضافة إلى وقت، والمعلقة، والمضافة إلى المستقبل، والموقتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nالصيغة المنجزة، وهي ألا تُعلّق بشرط ولا تُضاف إلى وقت، كقول الموكل «وكّلتك ببيع الدار الفلانية»، وهي صحيحة باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nالصيغة المعلقة على شرط. اختلف الفقهاء في صحتها على رأيين. الأول، للحنفية والحنابلة على الصحيح عندهم وللشافعية في مقابل الأصح، أنها صحيحة، كقول «إذا قدم الحاج فبع هذا الطعام»، واستدلوا بحديث ابن عمر في إمرة زيد بن حارثة في غزوة مؤتة، ثم جعفر، ثم عبد الله بن رواحة إن قُتل من قبله، ولأنه عقد اعتبر في حق الوكيل حكمه وهو إباحة التصرف، فهو أشبه بالوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} والثاني، للشافعية في الأصح وللحنابلة في قول، أنها فاسدة؛ قال الماوردي إن تعليق الوكالة بالشروط والآجال فاسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} وأجاز الشافعية أن ينجز الموكل الوكالة ويشترط للتصرف شرطاً، كقوله «بعها بعد شهر»، لأن ذلك تأخير لا تعليق؛ ونقل الغزالي عن العراقيين أن قدوم فلان أو مضي شهر شرط للتصرف لا للعقد فيجب على الوكيل الامتثال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nالصيغة الدورية، وصورتها أن يقول الموكل «وكّلتك ببيع هذا المال، وكلما عزلتك فأنت وكيلي»، فتتجدد الوكالة كلما عُزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} وصحّحها الحنفية والحنابلة على الصحيح، بناءً على أن الوكالة تقبل التعليق، ويملك الموكل عزل الوكيل متى شاء عند الحنفية؛ ويحصل العزل عند الحنابلة بقول الموكل «عزلتك، وكلما وكلتك فقد عزلتك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} ومنع ابن تيمية صحتها لأنها تجعل العقد الجائز لازماً، والمقصود من التعليق المنع من التوكيل لا فسخ عقد قبل انعقاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} وقال الشافعية في صحتها في الحال وجهان، أصحهما الصحة، فإن عزله ولم يعلم الوكيل أو علم، ففي عوده بعد العزل وجهان، أصحهما المنع؛ وإن قال «كلما عزلتك» تكرر العود أبداً، وإن قال «إذا» أو «متى» فمرة واحدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المضافة إلى المستقبل، كقول الموكل «وكّلتك على أن تبيع دوابي في شهر رمضان» أو «وكّلتك في بيع هذه الدار غداً»، وقد أجازها الحنفية والحنابلة، ويُقرّ الحنفية أن الوكيل يصبح وكيلاً من الغد فما بعده لا قبله، ويوافقهم الشافعية لأن الوكالة نُجّزت في الحال وعُلّق التصرف على وقت في المستقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المعلقة على وقت، كقوله «إذا جاء رأس الشهر فقد وكّلتك في بيع داري»، وهي باطلة في الأصح عند الشافعية لأن تعليق الوكالة بالآجال فاسد، وصحيحة عند الحنفية والحنابلة والشافعية في مقابل الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} وفرّق الحنفية بين الإضافة والتعليق: فالمضاف سبب ينعقد به العقد في الحال مع تأخّر حكمه إلى الوقت، أما المعلّق ففيه مانع من أن يكون سبباً للحكم في الحال، فلا تنعقد الوكالة إلا عند وجود الشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nالصيغة المؤقتة، كقوله «أنت وكيلي شهراً»، وهي صحيحة عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} واختلفوا في بقائها بعد الوقت: فالشافعية لا تبقى بعده. وعند الحنفية روايتان فيمن وُكّل ببيع الدار «اليوم» فباعها غداً، فقيل الصحيح أنها لا تبقى، وقيل تبقى لأن ذكر اليوم للتعجيل لا للتوقيت؛ ونقل صاحب منحة الخالق عن البزازية أن الوكالة إلى عشرة أيام لا تنتهي بمضيّ العشرة في الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}\n\nاقتران الوكالة بشرط. إن كان الشرط فاسداً، فذهب الحنفية وأحمد في أظهر روايتيه وابن أبي ليلى إلى أن الوكالة لا تبطل بأي شرط فاسد، وذهب الشافعية إلى أن الشرط الفاسد يُفسد الوكالة، كأن يقول الموكل «امنع المبيع من المشتري»، لأن منع الحق عمّن يستحق إثبات اليد عليه حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} وقال الزركشي إن العقود الجائزة كالشركة والوكالة والمضاربة، فاسدها لا يمنع نفوذ التصرف فيها بالإذن، لكن خصائصها تزول بفسادها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} وفائدة الفساد سقوط المسمى من الأجرة والرجوع إلى أجرة المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} ورأى بعض الحنابلة أن الوكالة تبطل كالوديعة لزوال الائتمان، وقال أبو محمد الشافعي إن الإذن ليس منفصلاً عن الوكالة فمعنى فسادها بطلان الإذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}\n\nصفة عقد الوكالة، أي هل هو لازم أو جائز. الرأي الأول، للحنفية والشافعية والحنابلة وبعض المالكية، أنها عقد جائز من الجانبين لأنها تبرّع لا لزوم فيه، فقد يرى الموكل المصلحة في ترك ما وكّل فيه أو في توكيل غيره، ولأن الوكيل قد لا يتفرغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} واستثنى الحنفية والمالكية ما إذا تعلّق بالوكالة حق الغير، فتلزم، كوكيل الخصومة بطلب الخصم، والوكيل ببيع الرهن في حضور المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} وقال الحنفية إن على عدم لزومها تتفرع ثلاث مسائل: لا يدخلها خيار الشرط، ولا يُحكم بالوكالة مقصودة، وللوكيل أن يستقيل منها متى أراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} الرأي الثاني، إن كانت بأجرة على سبيل الإجارة فهي لازمة من الطرفين، ويجب أن تجتمع فيها شرائط الإجارة، وبهذا صرح الشافعية والمالكية في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} الرأي الثالث، لبعض المتأخرين من المالكية، أنها لازمة من جانب الوكيل وإن كانت بغير أجرة، قياساً على لزوم الهبة وإن لم تُقبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} وإن كانت على سبيل الجعالة ففيها ثلاثة أقوال عند المالكية: اللزوم من الطرفين، والجواز من الطرفين وهو المعتمد عند الشافعية، واللزوم من جهة الجاعل دون المجعول له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nالركن الثاني: العاقدان، وهما الموكل والوكيل. أولاً: الموكل، وهو من يقيم غيره مقام نفسه في تصرف جائز معلوم، ويُشترط أن يملك ذلك التصرف وأن تلزمه أحكامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} واتفق الفقهاء على أنه لا تجوز الوكالة من المجنون والمعتوه والمغمى عليه والنائم والصبي غير المميز مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}"
  en: "Wakala, with its vowel variants, means in the language protection, as in the Divine name al-Wakil meaning the Guardian, and in tawakkul ('we have entrusted our affairs to God'); tawkil is the delegation of a disposal to another. The agent is called wakil because his principal has entrusted him with the conduct of his affair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} The jurists define it in several ways. The Hanafis: setting another in one's place in a lawful, known disposal, out of ease or incapacity. The Malikis: the deputising of a person with a right, who has no command or worship, for another in what is not conditioned on his death. The Shafi'is: the delegation by a person of what he may do and that admits delegation, to another to do it during his life. The Hanbalis: the deputising of a person capable of disposing of property, like himself, in what deputising admits of rights of God and rights of men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe Mawsu'a distinguishes wakala from neighbouring terms: deputising (niyaba), which is for some jurists wider than wakala and for others its synonym; authority (wilaya), the carrying out of a word over another whether he wills it or not, which is a legal or compulsory deputising, while wakala is agreed; bequest (iya'), the setting of another in one's place in disposal after death, while wakala is in life; and guardianship (qiwama), a power given by the judge to an adult to act for a minor's interest, or the husband's authority over his wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe jurists agree that wakala is lawful. They cite the Qur'an: the account of the People of the Cave sending one of them with their silver to the city, and the verse of the two arbiters in Surat al-Nisa, which is taken to show that each arbiter acts as agent of one of the spouses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} They cite the Sunna: the report of 'Urwa ibn Abi al-Ja'd al-Bariqi, to whom the Prophet gave a dinar to buy a sheep; the report of Hakim ibn Hizam about buying a sacrifice; the report of Jabir about the agent at Khaybar; and the report of Abu Rafi' that he was the go-between in the Prophet's marriage to Maymuna. The jurists agree on its lawfulness from the time of the Prophet to the present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} By reason, the need for it is clear, since a person may be unable to act himself by illness, age or rank, and without it hardship would follow, which the text removes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe pillars of wakala: the majority hold them to be the formula, the two parties (principal and agent) and the object of the agency. The Hanafis hold that the pillar is the offer and acceptance, since their presence entails the other two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} The formula is the offer and acceptance, through which mutual consent is expressed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe offer. The majority hold it is what comes from the principal and shows his permission to appoint an agent; the Hanafis hold it is what comes first from one of the contracting parties to show his desire to make the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} It may be made by any sign of consent, in words, in writing, by message or by the sign of a mute man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Explicit words include 'I appointed you', 'I entrusted to you', 'I made you my deputy', 'I permitted you', 'I set you in my place' and 'you are my agent'. An order such as 'sell it' is valid for the Hanafis, Shafi'is and Hanbalis, and for the Malikis where custom so treats it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} The words 'I will appoint you', 'I appoint you' and 'I have relied on you' do not make a valid agency for the Shafi'is, since they are ambiguous, unless a clear term is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nAgency may be concluded by message, according to the Hanafis, Malikis and Shafi'is: the agent becomes agent once the news reaches him and he accepts, whether the bearer is trustworthy or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} The offer may also be made by clear writing, by the understood sign of a mute man, by an act that shows permission (for the Hanbalis), and by what custom treats as an offer, as when a husband disposes of his wife's property while she knows and keeps silent (the Malikis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} Silence is not an offer for the Hanafis, Shafi'is and Hanbalis: one who sees a stranger sell his property and says nothing is not made an agent by his silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nThe acceptance may be given in words, such as 'I accept' or words showing acceptance. The Hanafis and Shafi'is add that the agent must not refuse; if he refuses after the offer, no agency is concluded even if he accepts later, unless the offer and acceptance are renewed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} On acceptance by act there are three views. The majority (Hanafis, Malikis, the sounder Shafi'i view, and the Hanbalis) hold that it is complete by any act that shows it, such as the agent doing what he was told; the Shafi'is in one view, the Hanbalis in one view and Zufar among the Hanafis hold that it requires words; a third Shafi'i view distinguishes: if the offer is in the form of a command such as 'sell and buy', acceptance by act suffices, but if it is in the form of a contract such as 'I appointed you', words are needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Acceptance is also valid in clear addressed writing and by the understood sign of a mute man; the Hanafis hold that an agent's silence is acceptance, which is undone by his refusal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nIf acceptance is delayed after the offer, the majority (Hanafis, Hanbalis, the Shafi'i school view, and one Maliki view) hold that it is valid, since the permission remains while the principal does not withdraw it, and it is like a permission to act. The Shafi'is limit this to cases where the time of the act is not fixed; if it is fixed and there is fear of its passing, acceptance must be immediate, as also when the judge offers the agency to a man on its being established before him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} The second Maliki view and Abu Hamid al-Marwarudhi among the Shafi'is hold acceptance must be immediate, because wakala is a contract made in life, and like sale it requires immediate acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Al-Mazari said the matter returns to intention and custom: whether the words in question call for an immediate reply, or allow a prompt or a deferred one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe forms of the wakala formula, by the time at which its effects arise, are: the immediate form, which is neither conditioned on a condition nor linked to a time; the conditional form; the form attached to the future; and the time-limited form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe immediate formula, which is neither conditioned on a condition nor linked to a time, as in the principal saying 'I appointed you to sell that house', is valid by agreement of the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nThe formula conditioned on a condition. The jurists differ on two views. The first, held by the Hanafis, the sounder Hanbali view and, against the sounder view, the Shafi'is, is that it is valid, as in 'if the pilgrim arrives, sell this food'. They cite the report of Ibn 'Umar that the Prophet appointed Zayd ibn Haritha to command at Mu'ta, then Ja'far, then Ibn Rawaha if the first two were killed; and they argue that the agency is a contract whose effect on the agent, the permission to act, is recognised, so it is like a bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} The second, held by the sounder Shafi'i view and one Hanbali view, is that it is invalid; al-Mawardi says conditioning an agency on conditions or terms is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} The Shafi'is allow the principal to conclude the agency now and to make the act itself subject to a condition, as in 'sell it after a month', since that is postponement, not conditioning. Al-Ghazali reports that the Iraqis held that 'I appointed you now, but do not act until a month passes or a certain man arrives' is valid, since it is a delay, and the agent must comply. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729}\n\nThe periodic formula: the principal says 'I appointed you to sell this property, and whenever I remove you, you are my agent again', so the agency renews itself each time he removes the agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17729} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} The Hanafis and the sounder Hanbali view hold it valid, on the ground that agency admits conditioning; for the Hanafis the principal may remove his agent at any time, and for the Hanbalis removal is effected by his words 'I removed you, and whenever I appoint you, I have removed you'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} Ibn Taymiyya holds it invalid, since it would turn a permissive contract into a binding one; the purpose of the conditional is to prevent appointment, not to dissolve a contract before it exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} The Shafi'is have two views on its validity at once; the sounder is that it is valid, because permission exists. If he removes the agent, and the agent did not know, or knew, there are two views on whether the agency returns after removal; the sounder is that it does not. If the words are 'whenever I remove you', the agency returns once; if they are 'every time I remove you', it returns each time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17730} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe formula attached to a future time, as in 'I appointed you to sell my beasts in Ramadan', or 'I appointed you to sell this house tomorrow'. The Hanafis and Hanbalis hold it valid, since agency admits being attached to the future; the Hanafis add that the agent becomes agent from tomorrow onward and not before. The Shafi'is agree that it is valid, since the agency is concluded now and only the act is linked to a future time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe formula conditioned on a time, as in 'when the new month comes, I appointed you to sell my house': on the sounder Shafi'i view it is void, since conditioning an agency on terms is invalid; the Hanafis, Hanbalis and the opposite Shafi'i view hold it valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731} The Hanafis distinguish attachment (idafa) from conditioning (ta'liq). An attached formula is a cause that concludes the contract now while its effect is deferred to the time; a conditioned formula cannot be a cause of the effect now, so the agency is not concluded until the condition is met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17731}\n\nThe time-limited formula, as in 'you are my agent for a month', is valid by the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} They differ whether it survives the period. The Shafi'is hold that it does not survive the period. The Hanafis report two views on one who was told 'sell my house today' and did it tomorrow: the sounder view is that the agency does not survive the day, but some Hanafis hold it survives, since naming the day is for haste, not for limiting the agency to that day. Al-Bazzaziyya, quoted by the author of Minhat al-Khaliq, holds that an agency for ten days does not end when the ten days pass, on the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732}\n\nConditions attached to the agency. If the condition is invalid, the Hanafis, Ahmad in the apparent of his two reports, and Ibn Abi Layla hold that the agency is not invalidated by any invalid condition. The Shafi'is hold that an invalid condition invalidates it, as when the principal says 'prevent the buyer from taking the goods', since to prevent a right-holder from taking possession is forbidden; the sale itself is valid by permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Al-Zarkashi says that the permissive contracts (partnership, agency and mudaraba) are not stopped from taking effect by permission when they are invalid, but lose their own features. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} The effect of invalidity is that a named fee falls away and the customary fee is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} Some Hanbalis hold that the agency is void, like a deposit, because the trust is gone; and Abu Muhammad among the Shafi'is says the permission is not separate from the agency, so its invalidity means the permission is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17733} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734}\n\nThe nature of the agency contract, whether binding or permissive. The first view, held by the Hanafis, Shafi'is, Hanbalis and some Malikis, is that it is permissive on both sides, since it is a gift and gifts are not binding: the principal may see that it is better to leave the matter, or to appoint another, and the agent may not be free. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The Hanafis and Malikis except where a third party's right attaches to the agency, which then binds, as with an agent in a suit appointed at the claimant's request, or an agent to sell a pledge in the presence of the pledgee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The Hanafis say that from its non-binding nature three rules follow: an option of stipulation does not enter it; agency is not valid as a principal claim; and the agent may resign whenever he wishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} The second view: if the agency is for a fee in the form of a hire, it binds both sides and must meet the conditions of hire; the Shafi'is and in one view the Malikis say so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17734} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} The third view, of some later Malikis, is that it binds the agent's side even without a fee, by analogy with a gift that binds once given, though not received. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} If the agency is by way of a reward (ju'ala), the Malikis hold three views: binding on both sides; permissive on both sides, which is the view relied upon by the Shafi'is; and binding on the side of the one who offers the reward once the other starts work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}\n\nThe second pillar, the two parties, the principal and the agent. First, the principal: one who sets another in his place in a lawful known disposal, who must have the power to make that disposal and be bound by its rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735} The jurists agree that agency may not be made by an insane person, an imbecile, a person under anaesthesia, a sleeper, or a minor who cannot discern, in any disposal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17735}"
