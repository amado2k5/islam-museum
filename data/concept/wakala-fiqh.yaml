id: concept/wakala-fiqh
class: concept
kind: legal
label:
  ar: "وَكالة"
  en: "Wakala (agency, fiqh)"
summary:
  ar: "الوكالة بالفتح والكسر في اللغة الحفظ، ومنه الوكيل في أسماء الله بمعنى الحافظ، ومنه التوكل، والتوكيل تفويض التصرف إلى الغير، وسُمّي الوكيل وكيلاً لأن موكّله فوّض إليه القيام بأمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} وفي الاصطلاح تعددت التعريفات: فعرّفها الحنفية بأنها إقامة الغير مقام نفسه في تصرف جائز معلوم، ترفّهاً أو عجزاً؛ وعرّفها المالكية بأنها نيابة ذي حق، غير ذي إمرة ولا عبادة، لغيره فيه غير مشروطة بموته؛ وعرّفها الشافعية بأنها تفويض شخص ما له فعله مما يقبل النيابة إلى غيره ليفعله في حياته؛ وعرّفها الحنابلة بأنها استنابة جائز التصرف مثله فيما تدخله النيابة من حقوق الله وحقوق الآدميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nيفرّق الكتاب بين الوكالة وألفاظ قريبة منها: النيابة، وهي قيام الإنسان عن غيره بفعل أمر، وهي عند بعضهم أعم من الوكالة، وعند آخرين مترادفة؛ والولاية، وهي تنفيذ القول على الغير شاء أو أبى، وهي نيابة شرعية أو إجبارية، بينما الوكالة نيابة اتفاقية؛ والإيصاء، وهو إقامة الإنسان غيره مقام نفسه في التصرف بعد الموت، بينما الوكالة في الحياة؛ والقوامة، وهي ولاية يفوضها القاضي إلى راشد للتصرف لمصلحة القاصر، أو ولاية الزوج على زوجته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nاتفق الفقهاء على مشروعية الوكالة، واستدلوا عليها بالقرآن: بقصة أصحاب الكهف في بعث أحدهم بورقهم إلى المدينة، وبآية الحكمين في سورة النساء، والحكم وكيل عن الزوجين على رأي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} وبالسنة: حديث عروة بن أبي الجعد البارقي الذي أعطاه النبي ديناراً ليشتري به شاة، وحديث حكيم بن حزام في شراء الأضحية، وحديث جابر في الوكيل بخيبر، وحديث أبي رافع في زواج النبي بميمونة وكان الرسول بينهما؛ وأجمع الفقهاء على جوازها من عصر النبي إلى اليوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} واستدلوا بالمعقول، وهو أن الحاجة داعية إليها، لأن الإنسان قد يعجز عن المباشرة بنفسه لمرض أو كبر أو وجاهة، فلو لم تجز لوقع الحرج المنفيّ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nأركان الوكالة. يرى جمهور الفقهاء أنها الصيغة والعاقدان (الموكل والوكيل) ومحل العقد (الموكل فيه)، ويرى الحنفية أن ركنها الإيجاب والقبول، لأن وجودهما يستلزم الركنين الآخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} والصيغة هي الإيجاب والقبول، يُعبّر بهما عن التراضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nالإيجاب. يرى الجمهور أنه ما يصدر من الموكل ويدل على إذنه بالتوكيل، ويرى الحنفية أنه ما صدر أولاً من أحد المتعاقدين للدلالة على رغبته في إنشاء العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} ويتحقق بكل ما يدل على الرضا بالوكالة، باللفظ أو الكتابة أو الرسالة أو إشارة الأخرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} فمن اللفظ الصريح: وكلتك، أو فوضت إليك، أو أنبتك، أو أذنت لك، أو أقمتك مقامي، أو أنت وكيلي؛ وأما الأمر كقوله بعه، فيصح عند الحنفية والشافعية والحنابلة، وعند المالكية إذا جرى العرف به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} أما ألفاظ «سأوكلك» و«أوكلك» و«قد عولت عليك» و«قد اعتمدت عليك» فلا تنعقد بها الوكالة عند الشافعية لاحتمالها، إلا أن يُضم إليها لفظ صريح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nوتنعقد الوكالة بالرسالة عند الحنفية والمالكية والشافعية، ويكون الوكيل وكيلاً متى بلغه الخبر وقبل، سواء كان المخبر عادلاً أو غير عادل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} ويتحقق الإيجاب بالكتابة المستبينة، وبالإشارة المفهومة من الأخرس، وبالفعل الدال على الإذن عند الحنابلة، وبما جرت العادة باعتباره إيجاباً عند المالكية، كتصرف الزوج في مال زوجته وهي عالمة ساكتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} ولا يكون السكوت إيجاباً عند الحنفية والشافعية والحنابلة؛ فمن رأى أجنبياً يبيع ماله فسكت لم يصبح وكيلاً بسكوته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nالقبول. يتحقق باللفظ، كأن يقول الوكيل قبلت، أو بكلام يشعر بالقبول؛ وزاد الحنفية والشافعية أنه لا بد ألا يرده الوكيل، فإن رده بعد الإيجاب لم تنعقد الوكالة وإن قبل بعد ذلك، ما لم يجدد الإيجاب والقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} وفي القبول بالفعل ثلاثة آراء: الجمهور (الحنفية والمالكية والشافعية في أصح الوجهين والحنابلة) يرون أنه يتحقق بكل فعل دال عليه، كفعل الوكيل ما أمره به الموكل؛ والشافعية في وجه والحنابلة في قول وزفر من الحنفية يرونه لا يتحقق إلا باللفظ؛ والشافعية في وجه ثالث يفرّقون: إن كانت صيغة الإيجاب أمراً كقوله «بع واشترِ» تحقق القبول بالفعل، وإن كانت صيغة عقد كـ«وكلتك» فلا بد من اللفظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} ويصح القبول بالكتابة المستبينة المعنونة، وبإشارة الأخرس المعلومة، وعند الحنفية يكون سكوت الوكيل قبولاً ويرتد برده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nوإذا تراخى القبول عن الإيجاب، فجمهور الفقهاء (الحنفية والحنابلة والشافعية في المذهب والمالكية في أحد القولين) يصححونه، لأن الإذن قائم ما لم يرجع عنه الموكل، فأشبه الإباحة؛ وقيّد الشافعية ذلك بألا يتعين زمان العمل، فإن تعين وخيف فواته كان القبول على الفور، وكذا إذا عرضه الحاكم عليه عند ثبوتها عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وذهب المالكية في القول الثاني وأبو حامد المروروذي من الشافعية إلى أن القبول على الفور، لأن الوكالة عقد في حال الحياة فيكون القبول فيه على الفور كالبيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} وقال المازري إن التحقيق يرجع إلى القصد والعوائد: هل المراد من هذه الألفاظ استدعاء الجواب فوراً، أم معجلاً أو مؤجلاً؟ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nأقسام صيغة الوكالة بحسب وقت ترتّب آثارها: المنجّزة، وهي ألا تكون معلقة بشرط ولا مضافة إلى وقت، والمعلقة، والمضافة إلى المستقبل، والموقتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}"
  en: "Wakala, with its vowel variants, means in the language protection, as in the Divine name al-Wakil meaning the Guardian, and in tawakkul ('we have entrusted our affairs to God'); tawkil is the delegation of a disposal to another. The agent is called wakil because his principal has entrusted him with the conduct of his affair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} The jurists define it in several ways. The Hanafis: setting another in one's place in a lawful, known disposal, out of ease or incapacity. The Malikis: the deputising of a person with a right, who has no command or worship, for another in what is not conditioned on his death. The Shafi'is: the delegation by a person of what he may do and that admits delegation, to another to do it during his life. The Hanbalis: the deputising of a person capable of disposing of property, like himself, in what deputising admits of rights of God and rights of men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17719} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe Mawsu'a distinguishes wakala from neighbouring terms: deputising (niyaba), which is for some jurists wider than wakala and for others its synonym; authority (wilaya), the carrying out of a word over another whether he wills it or not, which is a legal or compulsory deputising, while wakala is agreed; bequest (iya'), the setting of another in one's place in disposal after death, while wakala is in life; and guardianship (qiwama), a power given by the judge to an adult to act for a minor's interest, or the husband's authority over his wife. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17720}\n\nThe jurists agree that wakala is lawful. They cite the Qur'an: the account of the People of the Cave sending one of them with their silver to the city, and the verse of the two arbiters in Surat al-Nisa, which is taken to show that each arbiter acts as agent of one of the spouses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} They cite the Sunna: the report of 'Urwa ibn Abi al-Ja'd al-Bariqi, to whom the Prophet gave a dinar to buy a sheep; the report of Hakim ibn Hizam about buying a sacrifice; the report of Jabir about the agent at Khaybar; and the report of Abu Rafi' that he was the go-between in the Prophet's marriage to Maymuna. The jurists agree on its lawfulness from the time of the Prophet to the present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} By reason, the need for it is clear, since a person may be unable to act himself by illness, age or rank, and without it hardship would follow, which the text removes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe pillars of wakala: the majority hold them to be the formula, the two parties (principal and agent) and the object of the agency. The Hanafis hold that the pillar is the offer and acceptance, since their presence entails the other two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722} The formula is the offer and acceptance, through which mutual consent is expressed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17722}\n\nThe offer. The majority hold it is what comes from the principal and shows his permission to appoint an agent; the Hanafis hold it is what comes first from one of the contracting parties to show his desire to make the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} It may be made by any sign of consent, in words, in writing, by message or by the sign of a mute man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17723} Explicit words include 'I appointed you', 'I entrusted to you', 'I made you my deputy', 'I permitted you', 'I set you in my place' and 'you are my agent'. An order such as 'sell it' is valid for the Hanafis, Shafi'is and Hanbalis, and for the Malikis where custom so treats it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} The words 'I will appoint you', 'I appoint you' and 'I have relied on you' do not make a valid agency for the Shafi'is, since they are ambiguous, unless a clear term is added. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725}\n\nAgency may be concluded by message, according to the Hanafis, Malikis and Shafi'is: the agent becomes agent once the news reaches him and he accepts, whether the bearer is trustworthy or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17724} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} The offer may also be made by clear writing, by the understood sign of a mute man, by an act that shows permission (for the Hanbalis), and by what custom treats as an offer, as when a husband disposes of his wife's property while she knows and keeps silent (the Malikis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17725} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} Silence is not an offer for the Hanafis, Shafi'is and Hanbalis: one who sees a stranger sell his property and says nothing is not made an agent by his silence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726}\n\nThe acceptance may be given in words, such as 'I accept' or words showing acceptance. The Hanafis and Shafi'is add that the agent must not refuse; if he refuses after the offer, no agency is concluded even if he accepts later, unless the offer and acceptance are renewed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17726} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} On acceptance by act there are three views. The majority (Hanafis, Malikis, the sounder Shafi'i view, and the Hanbalis) hold that it is complete by any act that shows it, such as the agent doing what he was told; the Shafi'is in one view, the Hanbalis in one view and Zufar among the Hanafis hold that it requires words; a third Shafi'i view distinguishes: if the offer is in the form of a command such as 'sell and buy', acceptance by act suffices, but if it is in the form of a contract such as 'I appointed you', words are needed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727} Acceptance is also valid in clear addressed writing and by the understood sign of a mute man; the Hanafis hold that an agent's silence is acceptance, which is undone by his refusal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17727}\n\nIf acceptance is delayed after the offer, the majority (Hanafis, Hanbalis, the Shafi'i school view, and one Maliki view) hold that it is valid, since the permission remains while the principal does not withdraw it, and it is like a permission to act. The Shafi'is limit this to cases where the time of the act is not fixed; if it is fixed and there is fear of its passing, acceptance must be immediate, as also when the judge offers the agency to a man on its being established before him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} The second Maliki view and Abu Hamid al-Marwarudhi among the Shafi'is hold acceptance must be immediate, because wakala is a contract made in life, and like sale it requires immediate acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728} Al-Mazari said the matter returns to intention and custom: whether the words in question call for an immediate reply, or allow a prompt or a deferred one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}\n\nThe forms of the wakala formula, by the time at which its effects arise, are: the immediate form, which is neither conditioned on a condition nor linked to a time; the conditional form; the form attached to the future; and the time-limited form. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17728}"
