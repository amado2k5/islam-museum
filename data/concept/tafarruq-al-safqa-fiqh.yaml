id: concept/tafarruq-al-safqa-fiqh
class: concept
kind: legal
label:
  ar: تفرق الصفقة
  en: Tafarruq al-safqa (partition of a contract)
  ur: تفرقِ صفقہ
summary:
  ar: 'تفرق الصفقة: أن لا يتناول حكم العقد جميع المعقود عليه، أو يتناوله ثم ينحسر عنه؛ والصفقة لغة الضرب باليد عند البيع، ومنه استعمالها لعقد البيع نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7903} يتميز عن تعدد الصفقة: فالتفريق لا يكون إلا في صفقة واحدة، وتتعدد الصفقة بتفصيل الثمن على شيئين معا، أو بتعدد العاقد من بائع أو مشتر؛ وعن البيعتين في بيعة، وهو جمع بيعتين في عقد واحد باعتبار تعدد الثمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904} الحنفية عرضوا التفريق لحالة هلاك بعض المبيع، واستقصوا أحكامه في رد المعيب، واعتبروا الاستحقاق في البيوع؛ والشافعية قسموا التعدد إلى ابتداء ودوام، والحنابلة ذكروا صورا للصفقة بتعدد المشتملات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904} بيع ملكه وملك غيره، وبيع خل وخمر: يصح في الملك ويتوقف في غيره على الإجازة عند أبي حنيفة ومالك؛ وفي الحنابلة روايتان؛ والشافعية يجعلون الصحة بقسط الثمن؛ ويثبت الخيار للمشتري إن جهل، ولا خيار للبائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7905} موجب الخيار: الإجازة أو الفسخ؛ وإذا اختار الإمضاء في الباقي يلزمه قسطه من الثمن عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7905} خيار الاستحقاق الجزئي: إذا استحق بعض المعقود عليه قبل القبض فحكم الجزء المستحق البطلان، والباقي خيار للمشتري؛ وبعد القبض يفترق الحكم بحسب كون المبيع من القيميات أو المتماثلات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7907} خيار الهلاك الجزئي قبل القبض: للمشتري الإمضاء أو الرد لتفرق الصفقة، ويسقط من الثمن حصة الفائت إن كان نقص قدر؛ وعند الشافعية إذا تلف أحد المعقودين قبل القبض لا ينفسخ العقد، وللمشتري الخيار؛ وانقطاع بعض المسلم فيه عند المحل له الفسخ أو الإجازة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7909}'
  en: 'Partition of the deal (tafarruq al-safqa): the ruling of the contract does not reach the whole of what is contracted, or reaches it and then leaves part of it; safqa lexically is the clapping of hands at sale and so the contract itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7903} Distinguished from plurality of deals, which can arise by splitting the price between two items or by several parties, and from selling at two prices in one contract; partition is only in one deal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904} The Hanafis treat partition in the loss of part of the goods, in the defective goods and in eviction; the Shafiis split plurality into the initial and the continuing; the Hanbalis give cases of mixed goods. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904} Selling what one owns with what one does not: valid in what one owns and suspended in the rest, for Abu Hanifa and Malik; the Hanbalis have two views; the Shafiis split the price by parts; the buyer, if ignorant, has the option, the seller has none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7905} Effect of the option: confirm or annul; if he confirms the rest he pays its share of the price, in the Shafii view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7905} Option of partial eviction: if part of the goods is evicted before receipt, the evicted part is void and the buyer has an option over the rest; after receipt the rule depends on whether the goods are valued or uniform. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7907} Option of partial loss before receipt: the buyer may confirm or annul, and the price drops by the lost share if the loss is in quantity; for the Shafiis, if one of two goods perishes before receipt the contract stands and the buyer has the option; a missing share of a deferred delivery gives the option to annul or confirm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7909}'
  ur: 'تفریقِ صفقہ: حکمِ عقد کا تمام معقود علیہ کو شامل نہ ہونا یا شامل ہو کر جزوی طور پر ہٹ جانا؛ صفقہ لغت میں بیع کے وقت ہاتھ مارنا ہے، پھر خود عقد کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7903} تعدد صفقہ سے مختلف: تفریق صرف ایک عقد میں ہوتی ہے، اور صفقہ دو چیزوں پر ثمن کی تقسیم یا متعدد عاقدین سے متعدد ہو جاتا ہے؛ اور بیعتان فی بیعۃ (ایک عقد میں دو ثمن) سے بھی مختلف۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904} حنفیہ ہلاکتِ بعض، عیب اور استحقاق میں تفریق بیان کرتے ہیں؛ شافعیہ ابتداء اور دوام کی تقسیم کرتے ہیں؛ حنابلہ مختلف مشمولات کی صورتیں بتاتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904} اپنی ملکیت اور غیر کی ملکیت کی بیع: اپنی ملکیت میں صحیح، غیر میں ابو حنیفہ اور مالک کے نزدیک اجازت پر موقوف؛ حنابلہ کی دو روایات؛ شافعیہ ثمن کو حصوں میں بانٹتے ہیں؛ جاہل خریدار کو خیار، بائع کو نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7904}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7905} خیار کا اثر: برقرار رکھنا یا فسخ؛ باقی برقرار رکھے تو شافعیہ کے نزدیک اس کا حصہ ثمن ادا کرے گا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7905} جزوی استحقاق کا خیار: قبضے سے پہلے بعض معقود علیہ کا استحقاق ہو تو وہ حصہ باطل، باقی میں خریدار کو خیار؛ قبضے کے بعد حکم اس پر منحصر کہ مبیع قیمتی ہے یا یکساں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7906}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7907} قبضے سے پہلے جزوی ہلاکت کا خیار: خریدار کو اجازت یا رد؛ مقدار کی کمی پر ثمن کا وہ حصہ کم؛ شافعیہ کے نزدیک دو میں سے ایک تلف ہو تو عقد نہیں ٹوٹتا؛ ادھار سپردگی کا بعض حصہ کم ہو تو فسخ یا اجازت کا خیار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7908}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7909}'
