id: concept/husn-wa-qubh
class: concept
kind: doctrine
label:
  ar: "الحسن والقبح"
  en: "Good and ugly: beauty and ugliness in acts (husn and qubh)"
  fr: "Le beau et le laid, le bien et le mal (husn et qubh)"
  es: "Lo bueno y lo malo, lo bello y lo feo (husn y qubh)"
  ur: "حسن اور قبح ⁦(خوبی اور برائی کا ادراک)⁩"
summary:
  ar: "يعرض عبده في باب أفعال العباد أن التمييز بين الجميل والقبيح أمر يدركه كل ذي حس في المحسوسات، وأن العقل يدرك مثله في المعقولات، وأن الأفعال الاختيارية نوع من الموجودات يقع عليها هذا التمييز كما يقع على سائرها{cite:abduh-risalat-tawhid-imara-1994 p.68}{cite:abduh-risalat-tawhid-imara-1994 p.69}. ويقول إن الفعل القبيح قد يكتسب جمالا من جمال أثره، وإن الجميل قد يقبح بما يقترن به{cite:abduh-risalat-tawhid-imara-1994 p.70}. ولا يحدد الكتاب في هذا الموضع ماهية الحسن والقبح تحديدا جامعا، وإنما يقرر أن التمييز بينهما من خصائص الإنسان، وأن الصناعات والعمران قامت عليه."
  en: "In the section on the goodness and ugliness of acts, Abduh says voluntary human acts belong to the things perceived by the senses and the mind, and move the soul as other things do{cite:abduh-risalat-tawhid-imara-1994 p.68}. People discern beauty and ugliness in what they perceive, and the same discernment applies to acts; an act may be beautiful through its effect, and a beautiful act may turn ugly through what accompanies it{cite:abduh-risalat-tawhid-imara-1994 p.69}{cite:abduh-risalat-tawhid-imara-1994 p.70}. The passage does not define beauty or ugliness in full. It states that this discernment is a human faculty on which the arts and civilisation rest."
  fr: "Dans la section sur la bonté et la laideur des actes, Abduh soutient que les actes humains volontaires font partie des choses perçues par les sens et l’intellect, et qu’ils émeuvent l’âme comme les autres choses{cite:abduh-risalat-tawhid-imara-1994 p.68}. Les hommes discernent le beau et le laid dans ce qu’ils perçoivent, et ce discernement vaut pour les actes; un acte peut être beau par son effet, et un acte beau peut devenir laid par ce qui l’accompagne{cite:abduh-risalat-tawhid-imara-1994 p.69}{cite:abduh-risalat-tawhid-imara-1994 p.70}. Le passage ne définit pas pleinement le beau et le laid; il affirme que ce discernement est une faculté humaine sur laquelle reposent les arts et la civilisation."
  es: "En la sección sobre la bondad y la fealdad de los actos, Abduh sostiene que los actos humanos voluntarios forman parte de lo que perciben los sentidos y la mente, y que mueven el alma como lo hacen otras cosas{cite:abduh-risalat-tawhid-imara-1994 p.68}. Las personas distinguen lo bello de lo feo en lo que perciben, y ese discernimiento vale también para los actos: un acto puede ser bello por su efecto, y un acto bello puede volverse feo por lo que lo acompaña{cite:abduh-risalat-tawhid-imara-1994 p.69}{cite:abduh-risalat-tawhid-imara-1994 p.70}. El pasaje no define por completo lo bello y lo feo; afirma que este discernimiento es una facultad humana sobre la que descansan las artes y la civilización."
  ur: "عبدہ افعالِ انسانی کی خوبی اور برائی کے باب میں کہتے ہیں کہ اختیاری انسانی افعال بھی ان موجودات میں شامل ہیں جنہیں حواس اور عقل پہچانتے ہیں، اور وہ نفس کو اسی طرح متاثر کرتے ہیں جیسے دوسری چیزیں{cite:abduh-risalat-tawhid-imara-1994 p.68}۔ انسان جو کچھ محسوس کرتا ہے اس میں خوبی اور برائی کا فرق پہچانتا ہے، اور یہی فرق افعال پر بھی لاگو ہوتا ہے؛ کوئی فعل اپنے اثر سے خوبصورت ہو سکتا ہے اور کوئی خوبصورت فعل اپنے ساتھ لگی ہوئی چیز سے بدصورت ہو سکتا ہے{cite:abduh-risalat-tawhid-imara-1994 p.69}{cite:abduh-risalat-tawhid-imara-1994 p.70}۔ عبارت خوبی اور برائی کی مکمل تعریف نہیں کرتی؛ وہ یہ بیان کرتی ہے کہ یہ فرق ایک انسانی صلاحیت ہے جس پر فنون اور تہذیب کی بنیاد ہے۔"
