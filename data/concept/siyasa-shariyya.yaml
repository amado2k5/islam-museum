label:
  ar: السياسة الشرعية
  en: Siyasa shar'iyya (governance by the public interest)
  es: "Siyasa shar'iyya (gobernanza por el interés público)"
  fr: "Siyasa shar'iyya (gouvernance par l'intérêt public)"
  ur: "سیاسہ شریعت ⁦(عوامی مفاد کے مطابق حکمرانی)⁩"
  tr: "Şeriat Politikası"
  id: "Kebijakan Syariah"
summary:
  ar: "السياسة الشرعية في عرف المؤلف تدخّل الحاكم لمصلحة فيما لا نص فيه، أو فيما فيه نص غير قطعي الدلالة، أو فيما يخيّر فيه الحاكم بين بدائل، أو فيما فيه نص مستند إلى عرف أو مصلحة أو زمن {cite:usul-iqtisad-islami-0660 p. 93} {cite:usul-iqtisad-islami-0660 p. 94}. وتقابل ما لا يتغير من الأحكام كالعقائد والعبادات وتحريم الربا والسرقة والقتل {cite:usul-iqtisad-islami-0660 p. 93}. ومن أمثلتها في عهد النبي تصرفه في تأبير النخل، ونهيه عن ادخار لحوم الأضاحي من أجل الدافة، وفي عهد الصحابة سياسة أبي بكر وعمر في حد شارب الخمر، وإسقاط عمر حد السرقة في عام المجاعة، وفرض عشور التجارة على الأجانب بالمثل {cite:usul-iqtisad-islami-0660 p. 94}. ويقول المؤلف إن السياسة الشرعية «فقه المتغيرات» والفقه «فقه الثوابت» {cite:usul-iqtisad-islami-0660 p. 94}، وإن المصلحة المرسلة هي ما لم يرد في الشرع دليل بإلغائه ولا باعتباره بخصوصه، فيقدّر الحاكم مصلحته بمشورة أهل الحل والعقد {cite:usul-iqtisad-islami-0660 p. 92}. يرى المؤلف أن ما يبدو من مخالفة النصوص لأجل المصلحة مخالفة ظاهرية، وأن سلطة ولي الأمر في تقييد المباح جزء من السياسة الشرعية، ويرى أن للحاكم أن يوظف على الأغنياء في الظروف الاستثنائية توظيفات إضافية."
  tr: "Yazarın görüşüne göre, Şeriat politikası, hükümdarın açıkça belirtilmemiş konulara müdahalesidir; ya da anlamı kesin olmayan bir metnin olduğu durumlarda, ya da hükümdarın alternatifler arasında seçim yaptığı durumlarda, ya da gelenek, çıkar veya zamana dayalı bir metinde {cite:usul-iqtisad-islami-0660 s. 93} {cite:usul-iqtisad-islami-0660 s. 94}. İnançlar, ibadet eylemleri, tefecilik, hırsızlık ve cinayet yasağı gibi değişmeyen hükümlere karşılık gelir {cite:usul-iqtisad-islami-0660 s. 93}. Örnekler arasında Peygamber'in zamanında palmiye ağaçlarını budaması ve ısınmak için kurban etinin saklanmasının yasaklanması, Ebu Bekir ve Ömer'in şarap içenlerin sınırı politikası, kıtlık yılında hırsızlık cezasını kaldırması ve yabancılara ticaret için ondalık vergisi koyması gibi örnekler verilebilir {cite:usul-iqtisad-islami-0660 s. 94}. Yazar, Şeriat politikasının \"değişkenlerin fıkıhı\" ve fıkıhın \"sabit şeylerin fıkıhı\" olduğunu belirtir {cite:usul-iqtisad-islami-0660 s. 94} ve mursal menfaatin, açıkça geçersiz sayılmamış veya Şeriatla ilgili olarak dikkate alınmayan şey olduğunu, bu nedenle hükümdarın izin veren ve sözleşme yapanlarla görüşerek menfaatini değerlendirdiğini {cite:usul-iqtisad-islami-0660 s. 92} belirtir. Yazar, çıkar uğruna metinlerin görünürde ihlal edilmesinin açık olduğunu, hükümdarın izin verilenleri sınırlama yetkisinin Şeriat politikasının bir parçası olduğunu ve hükümdarın istisnai durumlarda zenginleri ek istihdam ile istihdam edebileceğini düşünür."
  id: "Menurut penulis, kebijakan Syariah adalah intervensi penguasa untuk kepentingan hal-hal yang tidak eksplisit, atau dalam hal-hal di mana terdapat teks yang tidak definitif dalam makna, atau di mana penguasa memilih antara alternatif, atau dalam teks berdasarkan adat, kepentingan, atau waktu {cite:usul-iqtisad-islami-0660 hlm. 93} {cite:usul-iqtisad-islami-0660 hlm. 94}. Ini sesuai dengan putusan yang tidak berubah seperti kepercayaan, ibadah, larangan riba, pencurian, dan pembunuhan {cite:usul-iqtisad-islami-0660 hlm. 93}. Contohnya termasuk perilakunya pada masa Nabi dalam memangkas pohon palem dan larangan menyimpan daging korban untuk menghangatkan diri, kebijakan Abu Bakr dan Umar mengenai batas peminum anggur, penghapusan hukuman pencurian pada tahun kelaparan oleh Umar, dan pemaksaan persepuluhan untuk perdagangan kepada orang asing secara serupa {cite:usul-iqtisad-islami-0660 hlm. 94}. Penulis menyatakan bahwa kebijakan Syariah adalah \"yurisprudensi variabel\" dan yurisprudensi \"yurisprudensi tentang hal-hal tetap\" {cite:usul-iqtisad-islami-0660 hlm. 94}, dan bahwa kepentingan mursal adalah yang tidak secara eksplisit dibatalkan atau dipertimbangkan terkait Syariah, sehingga penguasa menilai kepentingannya dengan berkonsultasi dengan mereka yang mengizinkan dan mengikat {cite:usul-iqtisad-islami-0660 hlm. 92}. Penulis percaya bahwa pelanggaran teks yang tampak demi kepentingan memang jelas, dan bahwa kewenangan penguasa untuk membatasi apa yang diperbolehkan adalah bagian dari kebijakan Syariah, dan bahwa penguasa dapat mempekerjakan orang kaya dalam keadaan luar biasa dengan tambahan pekerjaan."
