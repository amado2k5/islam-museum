label:
  ar: السياسة الشرعية
  en: Siyasa shar'iyya (governance by the public interest)
summary:
  ar: "السياسة الشرعية في عرف المؤلف تدخّل الحاكم لمصلحة فيما لا نص فيه، أو فيما فيه نص غير قطعي الدلالة، أو فيما يخيّر فيه الحاكم بين بدائل، أو فيما فيه نص مستند إلى عرف أو مصلحة أو زمن {cite:usul-iqtisad-islami-0660 p. 93} {cite:usul-iqtisad-islami-0660 p. 94}. وتقابل ما لا يتغير من الأحكام كالعقائد والعبادات وتحريم الربا والسرقة والقتل {cite:usul-iqtisad-islami-0660 p. 93}. ومن أمثلتها في عهد النبي تصرفه في تأبير النخل، ونهيه عن ادخار لحوم الأضاحي من أجل الدافة، وفي عهد الصحابة سياسة أبي بكر وعمر في حد شارب الخمر، وإسقاط عمر حد السرقة في عام المجاعة، وفرض عشور التجارة على الأجانب بالمثل {cite:usul-iqtisad-islami-0660 p. 94}. ويقول المؤلف إن السياسة الشرعية «فقه المتغيرات» والفقه «فقه الثوابت» {cite:usul-iqtisad-islami-0660 p. 94}، وإن المصلحة المرسلة هي ما لم يرد في الشرع دليل بإلغائه ولا باعتباره بخصوصه، فيقدّر الحاكم مصلحته بمشورة أهل الحل والعقد {cite:usul-iqtisad-islami-0660 p. 92}. يرى المؤلف أن ما يبدو من مخالفة النصوص لأجل المصلحة مخالفة ظاهرية، وأن سلطة ولي الأمر في تقييد المباح جزء من السياسة الشرعية، ويرى أن للحاكم أن يوظف على الأغنياء في الظروف الاستثنائية توظيفات إضافية."
