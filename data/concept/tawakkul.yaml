id: concept/tawakkul
class: concept
kind: doctrine
label:
  ar: التوكل
  en: Trust in God (tawakkul)
  es: "Confía en Dios (tawakkul)"
  fr: "Confiance en Dieu (tawakkul)"
  ur: "خدا پر توکل ⁦(توکل)⁩"
summary:
  ar: "التوكل في الحديث التاسع والأربعين من زيادات ابن رجب عبادة القلب التي يجاب بها الرزق: «لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير تغدو خماصاً وتروح بطاناً» — فحق التوكل اعتماد القلب على الله في جلب المطلوب مع الأخذ بالأسباب كخروج الطير في غدوها، لا ترك السعي؛ إذ الطير نفسها تغدو وتروح فتجمع بين العمل والتفويض ⁦(جامع العلوم والحكم ص 914)⁩. ويجمعرياض الصالحين للنووي في بابه في اليقين والتوكل قول النبي في دعائه «اللهم لك أسلمت وبك آمنت وعليك توكلت وإليك أنبت وبك خاصمت» المتفق عليه، ولفظ «حسبنا الله ونعم الوكيل» التي قالها إبراهيم حين أُلقي في النار وقالها النبي حين قال المشركون «إن الناس قد جمعوا لكم فاخشوهم» يوم أحد، والسبعين ألفاً الذين يدخلون الجنة بغير حساب ولا عذاب وهم «الذين لا يرقون ولا يسترقون ولا يتطيرون وعلى ربهم يتوكلون» {cite:riyad-salihin p.30}{cite:riyad-salihin p.31}"
  en: "Tawakkul in the forty-ninth hadith of Ibn Rajab's additions is the heart's worship answered with provision: 'were you to put your trust in God as He deserves, He would provide for you as He provides for the birds — they set out hungry in the morning and return full in the evening' — true tawakkul is the heart's reliance on God for obtaining what is sought together with taking the means, as the birds' own morning flight shows, not the abandoning of effort; the birds themselves set out and return, joining work with entrustment (Jami' al-Ulum wal-Hikam p. 914). Riyad al-Salihin collects in its chapter on certainty and trust the Prophet's own words: the prayer «Allahumma laka aslamtu wa-bika amantu wa-alayka tawakkaltu wa-ilaayka anabtu wa-bika khasamtu» agreed upon by both Sahihs, the phrase «hasbunallahu wa-nimma al-wakil» spoken by Ibrahim when cast into the fire and by the Prophet when the polytheists said «the people have gathered against you, so fear them» at Uhud, and the seventy thousand who enter paradise without reckoning or punishment — «those who do not practise ruqya nor seek it, do not take omens, and rely on their Lord» {cite:riyad-salihin p.30}{cite:riyad-salihin p.31}"
  es: "En el hadiz número cuarenta y nueve de las adiciones de Ibn Rajab, el tawakkul es la adoración del corazón respondida con provisión: \"Si pusieras tu confianza en Dios como Él merece, Él te proveería como provee a los pájaros: salen hambrientos por la mañana y regresan saciados por la tarde\". El verdadero tawakkul es la confianza del corazón en Dios para obtener lo que se busca, junto con la toma de los medios, como lo demuestra el vuelo matutino de los pájaros, no el abandono del esfuerzo; los pájaros mismos salen y regresan, uniendo el trabajo con la confianza (Jami' al-Ulum wal-Hikam, pág. 914). Riyad al-Salihin recopila en su capítulo sobre la certeza y la confianza las propias palabras del Profeta: la oración «Allahumma laka aslamtu wa-bika amantu wa-alayka tawakkaltu wa-ilaayka anabtu wa-bika khasamtu», acordada por ambos Sahihs; la frase «hasbunallahu wa-nimma al-wakil», pronunciada por Ibrahim al ser arrojado al fuego y por el Profeta cuando los politeístas dijeron «la gente se ha reunido contra ti, así que témeles» en Uhud; y los setenta mil que entran al paraíso sin rendir cuentas ni ser castigados: «aquellos que no practican la ruqya ni la buscan, no toman presagios y confían en su Señor». {cite:riyad-salihin p.30}{cite:riyad-salihin p.31}"
  fr: "Le tawakkul, dans le quarante-neuvième hadith ajouté par Ibn Rajab, est l'adoration du cœur exaucée par la provision: « Si vous placiez votre confiance en Dieu comme Il le mérite, Il pourvoirait à vos besoins comme Il pourvoit aux besoins des oiseaux — ils partent affamés le matin et reviennent rassasiés le soir » — le vrai tawakkul est la confiance du cœur en Dieu pour obtenir ce que l'on désire, ainsi que la mise en œuvre des moyens nécessaires, comme le montre le vol matinal des oiseaux, et non l'abandon de l'effort; les oiseaux eux-mêmes partent et reviennent, unissant le travail à la confiance (Jami' al-Ulum wal-Hikam p. 914). Riyad al-Salihin rassemble dans son chapitre sur la certitude et la confiance les paroles mêmes du Prophète: la prière « Allahumma laka aslamtu wa-bika amantu wa-alayka tawakkaltu wa-ilaayka anabtu wa-bika khasamtu », approuvée par les deux Sahihs; la phrase « hasbunallahu wa-nimma al-wakil », prononcée par Ibrahim lorsqu’il fut jeté dans le feu et par le Prophète lorsque les polythéistes dirent à Uhud: « Le peuple s’est rassemblé contre toi, crains-les donc »; et les soixante-dix mille qui entreront au Paradis sans jugement ni châtiment: « ceux qui ne pratiquent pas la roqya, ne la recherchent pas, ne tiennent pas compte des présages et s’en remettent à leur Seigneur ». {cite:riyad-salihin p.30}{cite:riyad-salihin p.31}"
  ur: "ابن رجب کی اضافت کی اڑتالیسویں حدیث میں توکل دل کی عبادت کا جواب رزق کے ساتھ دیا گیا ہے: 'اگر تم خدا پر بھروسہ کرو جیسا کہ وہ مستحق ہے تو وہ تمہیں اس طرح مہیا کرے گا جیسا کہ وہ پرندوں کو فراہم کرتا ہے - وہ صبح کو بھوکے نکلتے ہیں اور شام کو پیٹ بھر کر لوٹتے ہیں' - حقیقی توکل وہی ہے جس کا مطلب ہے کہ دل کا بھروسہ اور بھروسہ کرنا خدا پر بھروسہ کرنا۔ پرندوں کی اپنی صبح کی پرواز کے شو، کوشش کو ترک کرنے سے نہیں۔ پرندے خود روانہ ہوتے ہیں اور واپس آتے ہیں، ذمہ داری کے ساتھ کام میں شامل ہوتے ہیں ⁦(جامع العلوم والحکم ص 914)⁩۔ ریاض الصالحین نے اپنے باب میں یقین اور اعتماد کے بارے میں نبی کے اپنے الفاظ کو جمع کیا ہے: دعا \"اللہم لکا اسلمت و بکا امانت و علیکا توکل توکلت و علائق انبتو و بکا خصمتو\" جس پر دونوں صحیحین نے اتفاق کیا ہے، یہ جملہ \"حسب النبی جب بولا گیا\"۔ آگ میں اور نبی کی قسم جب مشرکین نے کہا کہ \"لوگ تمہارے خلاف جمع ہو گئے ہیں، لہٰذا ان سے ڈرو\" احد کے موقع پر، اور ستر ہزار وہ لوگ جو بغیر حساب و عذاب کے جنت میں داخل ہوں گے - \"جو لوگ نہ رکوع کرتے ہیں اور نہ اس کے طالب ہوتے ہیں، نہ شگون لیتے ہیں اور نہ اپنے رب پر توکل کرتے ہیں\"۔"
