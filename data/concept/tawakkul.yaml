label:
  ar: التوكل
  en: Trust in God (tawakkul)
summary:
  ar: "التوكل في الحديث التاسع والأربعين من زيادات ابن رجب عبادة القلب التي يجاب بها الرزق: «لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير تغدو خماصاً وتروح بطاناً» — فحق التوكل اعتماد القلب على الله في جلب المطلوب مع الأخذ بالأسباب كخروج الطير في غدوها، لا ترك السعي؛ إذ الطير نفسها تغدو وتروح فتجمع بين العمل والتفويض ⁦(جامع العلوم والحكم ص 914)⁩. ويجمعرياض الصالحين للنووي في بابه في اليقين والتوكل قول النبي في دعائه «اللهم لك أسلمت وبك آمنت وعليك توكلت وإليك أنبت وبك خاصمت» المتفق عليه، ولفظ «حسبنا الله ونعم الوكيل» التي قالها إبراهيم حين أُلقي في النار وقالها النبي حين قال المشركون «إن الناس قد جمعوا لكم فاخشوهم» يوم أحد، والسبعين ألفاً الذين يدخلون الجنة بغير حساب ولا عذاب وهم «الذين لا يرقون ولا يسترقون ولا يتطيرون وعلى ربهم يتوكلون» {cite:riyad-salihin p.30}{cite:riyad-salihin p.31}"
  en: "Tawakkul in the forty-ninth hadith of Ibn Rajab's additions is the heart's worship answered with provision: 'were you to put your trust in God as He deserves, He would provide for you as He provides for the birds — they set out hungry in the morning and return full in the evening' — true tawakkul is the heart's reliance on God for obtaining what is sought together with taking the means, as the birds' own morning flight shows, not the abandoning of effort; the birds themselves set out and return, joining work with entrustment (Jami' al-Ulum wal-Hikam p. 914). Riyad al-Salihin collects in its chapter on certainty and trust the Prophet's own words: the prayer «Allahumma laka aslamtu wa-bika amantu wa-alayka tawakkaltu wa-ilaayka anabtu wa-bika khasamtu» agreed upon by both Sahihs, the phrase «hasbunallahu wa-nimma al-wakil» spoken by Ibrahim when cast into the fire and by the Prophet when the polytheists said «the people have gathered against you, so fear them» at Uhud, and the seventy thousand who enter paradise without reckoning or punishment — «those who do not practise ruqya nor seek it, do not take omens, and rely on their Lord» {cite:riyad-salihin p.30}{cite:riyad-salihin p.31}"
