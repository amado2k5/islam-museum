label:
  ar: التوكل
  en: Trust in God (tawakkul)
summary:
  ar: "التوكل في الحديث التاسع والأربعين من زيادات ابن رجب عبادة القلب التي يجاب بها الرزق: «لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير تغدو خماصاً وتروح بطاناً» — فحق التوكل اعتماد القلب على الله في جلب المطلوب مع الأخذ بالأسباب كخروج الطير في غدوها، لا ترك السعي؛ إذ الطير نفسها تغدو وتروح فتجمع بين العمل والتفويض (جامع العلوم والحكم ص 914)."
  en: "Tawakkul in the forty-ninth hadith of Ibn Rajab's additions is the heart's worship answered with provision: 'were you to put your trust in God as He deserves, He would provide for you as He provides for the birds — they set out hungry in the morning and return full in the evening' — true tawakkul is the heart's reliance on God for obtaining what is sought together with taking the means, as the birds' own morning flight shows, not the abandoning of effort; the birds themselves set out and return, joining work with entrustment (Jami' al-Ulum wal-Hikam p. 914)."
