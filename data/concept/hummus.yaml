  ur: "چنا ⁦(حمص)⁩"
  es: "Garbanzos (hummus)"
summary:
  ar: "الحمّص أصناف: الأبيض والأحمر والأسود والكرسنّي والبرّي؛ الأبيض حار يابس في الأولى والأسود أقوى، وفيه تفتيح وتليين، ويُذكر أنه يُغذي الرئة، وينفع الاستسقاء واليرقان وسدد الكبد والطحال، ومنه في الباه والمثانة والحصاة مُعلَّمات."
  en: "Chickpea comes in kinds: white, red, black, the kursunni and wild. The white is hot and dry in the first degree and the black is stronger. Both open and soften; the book says it nourishes the lung better than most foods, and lists uses for dropsy, jaundice and obstruction of liver and spleen. Some claims on sexual power and bladder stones are labelled listings."
  ur: "چنے کی کئی قسمیں ہیں: سفید، سرخ، سیاہ، کرسنی اور جنگلی۔ سفید پہلے درجے میں گرم اور خشک ہے اور سیاہ زیادہ قوی ہے؛ دونوں کھولتے اور نرم کرتے ہیں۔ کتاب کہتی ہے کہ یہ پھیپھڑے کو کسی بھی خوراک سے بہتر غذا دیتا ہے، اور استسقاء، یرقان اور جگر و تلی کی رکاوٹ میں فائدہ بتاتی ہے۔ جنسی قوت اور مثانے کی پتھری کے کچھ دعوے مُعلَّم فہرست ہیں۔"
  es: "El garbanzo se presenta en varias variedades: blanco, rojo, negro, kursunni y silvestre. El blanco es picante y seco en primer grado, mientras que el negro es más fuerte. Ambos se abren y se suavizan; el libro afirma que nutre los pulmones mejor que la mayoría de los alimentos y enumera sus usos para la hidropesía, la ictericia y la obstrucción del hígado y el bazo. Algunas afirmaciones sobre la potencia sexual y los cálculos vesicales se presentan en listas."
