      ar: "القرآن محفوظ بحفظ الله، ولا يتعارض مع حقيقة ثابتة في الكون"
      en: "The Qur'an is preserved by God, and no established fact in the universe conflicts with it"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يستدل الشعراوي بالآية التي تنص على حفظ الذكر، ويرى أن الله حفظ كلامه ليكون حجة، فلا توجد حقيقة في الكون تتعارض مع القرآن {cite:tafsir-sharawi-khawatir-scan p.233}."
      en: "Sha'rawi cites the verse on God's guarding of the reminder and holds that God preserved His speech as a proof, so that no fact of the universe conflicts with the Qur'an {cite:tafsir-sharawi-khawatir-scan p.233}."
