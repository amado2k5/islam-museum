id: concept/hifz-allah-lil-quran
class: concept
kind: doctrine
label:
  ar: "حفظ الله للقرآن"
  en: "God's preservation of the Qur'an"
  ur: "قرآن کی اللہ کی حفاظت"
summary:
  ar: "يرى الشعراوي أن الله حفظ كلامه ليكون حجة على الناس، وأنه لا تقوم حقيقة في الكون تتصادم مع القرآن، لأن الخالق هو القائل {cite:tafsir-sharawi-khawatir-scan p.233}."
  en: "Sha'rawi holds that God preserved His speech so that it would be a proof for people, and that no fact in the universe can collide with the Qur'an, because the Creator is its speaker {cite:tafsir-sharawi-khawatir-scan p.233}."
  ur: "شعراوی کے نزدیک اللہ نے اپنے کلام کی حفاظت کی تاکہ وہ لوگوں پر حجت ہو، اور کائنات میں کوئی حقیقت قرآن کے خلاف نہیں ہو سکتی، کیونکہ خالق ہی اس کا کہنے والا ہے {cite:tafsir-sharawi-khawatir-scan p.233}۔"
