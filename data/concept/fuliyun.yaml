summary:
  ar: "فليلون في الكتاب نبات ينبت في مواضع صخرية على قول ديسقوريدوس، منه صنف يسمى بلعون أي الأنثى ويشبه الطحلب وورقه أشد خضرة من ورق الزيتون وله زهر أبيض وبزر صغار، وآخر يسمى أريبوعيون أي المولد ذكرا ثمرته شبيهة بثمرة الزيتون في شكل عنقود، ويذكر الكتاب قولا في تحديد جنس الولد ويحتاط فيه فيقول إنه يوشك أن يكون قولا فقط، وبه يختم حرف الفاء {cite:canon-ibn-sina-print-v1 637}"
  en: "Fuliyun is in the book a plant that grows in rocky places on the word of Dioscorides, of which one kind is called bal'un, the female, resembling moss, with a leaf greener than the olive leaf, a white flower and small seeds, and another called aribu'ayun, the one that begets a male, with a fruit like the olive's in the shape of a cluster; the book gives a saying on determining the child's sex and cautions that it may be only a saying, and with it the letter fa ends {cite:canon-ibn-sina-print-v1 637}"
  ur: "فلیلون کتاب میں دیسقوریدوس کے قول پر پتھریلی جگہوں میں اگنے والا پودا ہے، جس کی ایک قسم بلعون یعنی مادہ کہلاتی ہے، کائی سے ملتی ہے، پتا زیتون کے پتے سے زیادہ ہرا، پھول سفید اور بیج چھوٹے؛ دوسری اریبوعیون یعنی نر بیٹا پیدا کرنے والی، جس کا پھل زیتون کے پھل جیسا اور خوشے کی شکل میں ہے؛ کتاب بچے کی جنس کے تعین کے بارے میں ایک قول دیتی ہے اور احتیاط سے کہتی ہے کہ ممکن ہے محض ایک قول ہو، اور اسی پر حرف فاء ختم ہوتا ہے {cite:canon-ibn-sina-print-v1 637}۔"
  es: "Fuliyun es en el libro una planta que crece en lugares rocosos en la palabra de Dioscórides, de la cual una especie se llama bal'un, la hembra, parecida al musgo, con una hoja más verde que la hoja de olivo, una flor blanca y semillas pequeñas, y otra llamada aribu'ayun, la que engendra un macho, con un fruto como el de la aceituna en forma de racimo; el libro da un dicho para determinar el sexo del niño y advierte que puede ser solo un dicho, y con él termina la letra fa {cite:canon-ibn-sina-print-v1 637}"
  fr: "Le Fuliyun est, selon Dioscoride, une plante qui pousse dans les lieux rocailleux. Une variété, appelée bal'un (la femelle), ressemble à de la mousse, avec une feuille plus verte que celle de l'olivier, une fleur blanche et de petites graines. Une autre variété, appelée aribu'ayun, donne naissance à un mâle, avec un fruit semblable à celui de l'olivier, en forme de grappe. Le livre donne un dicton pour déterminer le sexe de l'enfant, tout en précisant qu'il ne s'agit peut-être que d'un dicton. C'est ainsi que se termine la lettre fa. {cite:canon-ibn-sina-print-v1 637}"
  tr: "Kitapta, Dioscorides'e göre kayalık yerlerde yetişen bir bitki vardır. Bunlar arasında, yosuna benzeyen, zeytin yapraklarından daha yeşil yapraklı, beyaz çiçekli ve küçük tohumlu dişi anlamına gelen 'bal'on' adlı bir çeşit vardır. Bir diğeri ise Aribu'iyyun olarak adlandırılır; bu, meyvesi zeytin meyvesine benzeyen bir küme halinde olan erkek anlamına gelir. Kitapta çocuğun cinsiyetini belirten bir ifade yer alır ve temkinli davranır; bunun sadece bir kelime olacağını, 'fa' harfinin sonunda olduğunu söyler {cite:canon-ibn-sina-print-v1 637}"
  id: "Dalam buku tersebut, terdapat tanaman yang tumbuh di tempat berbatu, menurut Dioscorides. Di antaranya terdapat varietas yang disebut 'bal'on,' yang berarti betina, menyerupai lumut, dengan daun lebih hijau dari daun zaitun dan bunga putih serta biji kecil. Yang lain disebut Aribu'iyyun, yang berarti jantan yang buahnya menyerupai buah zaitun dalam kelompok. Buku ini menyebutkan pernyataan yang menentukan jenis kelamin anak laki-laki dan berhati-hati, mengatakan bahwa itu hanya akan menjadi sebuah kata, mengakhiri huruf 'fa' {cite:canon-ibn-sina-print-v1 637}"
