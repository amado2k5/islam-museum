summary:
  ar: "الكرش قليل الغذاء رديء الكيموس بطيء الانهضام، وكذلك ما يشاكله من الأحشاء، وهو أكثر غذاء من الرئة، وبطون الطير أفضل {cite:canon-ibn-sina-print-v1 p.530}."
  en: "Tripe gives little nourishment, makes a poor chyme and is slow to digest, like similar innards, though more nourishing than the lung; the stomachs of birds, especially hens and geese, are better {cite:canon-ibn-sina-print-v1 p.530}."
  ur: "کرش کی غذائیت کم ہے، اس سے کیموس خراب بنتا ہے اور ہضم سست ہے، دوسری ملتی جلتی انتڑیوں کی طرح، مگر پھیپھڑے سے زیادہ غذا دیتا ہے؛ پرندوں کے پیٹ، خصوصاً مرغی اور راج ہنس کے، بہتر ہیں {cite:canon-ibn-sina-print-v1 p.530}۔"
  es: "Las tripas aportan pocos nutrientes, producen un quimo pobre y son de digestión lenta, al igual que otras vísceras similares, aunque son más nutritivas que el pulmón; los estómagos de las aves, especialmente las gallinas y los gansos, son mejores {cite:canon-ibn-sina-print-v1 p.530}."
  fr: "Les tripes apportent peu de nutriments, produisent un chyme de mauvaise qualité et sont lentes à digérer, comme les abats similaires, bien que plus nourrissantes que les poumons; les estomacs des oiseaux, en particulier des poules et des oies, sont meilleurs {cite:canon-ibn-sina-print-v1 p.530}."
  tr: "Rumen zayıf beslenir, kimler yavaş sindirilir, benzer bağırsaklar da akciğerlerden daha besleyicidir ve kuş karınları daha iyidir {cite:canon-ibn-sina-print-v1 s.530}."
  id: "Rumen kurang nutrisi, kima lambat dicerna, begitu juga isi perut serupa yang lebih bergizi daripada paru-paru, dan perut burung lebih baik {cite:canon-ibn-sina-print-v1 hlm.530}."
