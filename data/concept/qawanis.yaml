summary:
  ar: "القوانص في الكتاب قوانص الطير كثيرة الغذاء، والتي للدجاج لا تنهضم بسرعة، ويزعمون أن الطبقة الداخلة من القانصة مجففة تنفع فم المعدة ووجعها، ينقل ذلك عن ابن ماسويه {cite:canon-ibn-sina-print-v1 p.658}"
  en: "Qawanis in the book are the gizzards of birds, rich in nourishment, and those of hens are not digested quickly; they claim that the inner layer of the gizzard is drying and benefits the mouth of the stomach and its pain, which is reported from Ibn Masawayh {cite:canon-ibn-sina-print-v1 p.658}"
  ur: "قوانص کتاب میں پرندوں کے سنگدانے ہیں، بہت غذا دینے والے، اور مرغیوں کے سنگدانے جلد ہضم نہیں ہوتے؛ وہ دعویٰ کرتے ہیں کہ سنگدانے کی اندرونی تہہ خشک کرنے والی ہے اور معدے کے منہ اور اس کے درد میں نافع ہے، یہ ابن ماسویہ سے منقول ہے {cite:canon-ibn-sina-print-v1 p.658}۔"
