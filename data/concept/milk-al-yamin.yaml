id: concept/milk-al-yamin
class: concept
kind: legal
label:
  ar: ملك اليمين
  en: What the right hand owns (milk al-yamin)
  ur: ملکِ یمین
summary:
  ar: "ملك اليمين في تفسير الشعراوي حكم يتصل بتصفية الرق: يرى أن الإسلام وسّع مصارف العتق، وأن الجارية تُطعَم وتُكسى ولا تُكلَّف ما لا تطيق، وأن الولد من السيد حُرّ، وأنه لم يعد لملك اليمين مصدر في زمانه {cite:tafsir-sharawi-khawatir-scan p. 2007}{cite:tafsir-sharawi-khawatir-scan p. 2008}."
  en: "For al-Sha'rawi, what the right hand owns belongs to the aim of ending slavery. He holds that Islam widened the ways of manumission, that a concubine must be fed, clothed and not burdened beyond her capacity, and that no source of such ownership remains in his own time {cite:tafsir-sharawi-khawatir-scan p. 2007}{cite:tafsir-sharawi-khawatir-scan p. 2008}."
  ur: "شعراوی کے نزدیک ملکِ یمین کا حکم غلامی کے خاتمے سے جڑا ہے۔ ان کے نزدیک اسلام نے آزادی کے ذرائع بڑھائے، لونڈی کو کھلانا پہنانا اور اس پر طاقت سے زیادہ بوجھ نہ ڈالنا لازم ہے، اور ان کے زمانے میں ایسی ملکیت کا کوئی ذریعہ باقی نہیں {cite:tafsir-sharawi-khawatir-scan p. 2007}{cite:tafsir-sharawi-khawatir-scan p. 2008}۔"
wings: [ideas]
themes: [family-marriage-kinship, law-and-courts]
issue:
  ar: "هل بقي لملك اليمين مصدر اليوم، وكيف تُعامل المملوكة في أثناء إنهاء هذا النظام؟"
  en: "Does the right hand's ownership still have a source today, and how is the owned woman treated while the institution is being ended?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-abolition
    stance:
      ar: "ملك اليمين مبني على تصفية الرق، ومعاملة المملوكة حق لها"
      en: "Ownership by the right hand is framed by the ending of slavery, and good treatment of the owned woman is her right"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الإسلام جعل مصارف متعددة لتحرير الرقاب، كالكفارات، وأن مصدر الرق في زمانه لم يعد قائماً، وأن إطعام الجارية وكسوتها وعدم تكليفها ما لا تطيق من حقها، وأن الولد الذي يأتي من السيد يحرر الأم والولد معاً. ولفظ «حررت ولدها» مقروء من المسح ويحتاج إلى التحقق من الصورة {cite:tafsir-sharawi-khawatir-scan p. 2007}{cite:tafsir-sharawi-khawatir-scan p. 2008}."
      en: "Sha'rawi holds that Islam widened the ways of freeing slaves, such as the expiations, that the source of slavery no longer exists in his time, that feeding and clothing the concubine and not overburdening her are her due, and that a child born to the master is freed together with the mother. The phrase on that point is read from the scan and needs checking against the image {cite:tafsir-sharawi-khawatir-scan p. 2007}{cite:tafsir-sharawi-khawatir-scan p. 2008}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "قراءة تاريخية لنظام الرق وإنهائه لم تُضف بعد"
      en: "A historical reading of slavery and its ending is still to be added"
    summary:
      ar: "لم يُعرض في هذا الجزء رأي أكاديمي في الرق وإنهائه؛ يحتاج إلى مرجع محدد (needs_source)."
      en: "No academic reading of slavery and its ending is set out in this part of the book; a named source is needed (needs_source)."
    sources: []
