id: concept/hubb-allah
class: concept
kind: belief
label:
  ar: "محبة الله"
  en: "Love for God (hubb Allah)"
  ur: "اللہ کی محبت"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن محبة الله تبلغ حقيقة الإيمان حين يكون القلب أحب إليه من الغنى والشرف. ويذكر منابع المحبة، ومنها التدبر في القول وأكل الحلال والتفقه في نعم الله، وعلاماتها، ومنها فعل المعروف لوجه الله واقشعرار القلب عند قراءة القرآن."
  en: "Sheikh Omar Abdelkafy says that love for God reaches the reality of faith when the heart holds God dearer than wealth and honour. He names its sources as pondering one's speech, eating lawful food and understanding God's favours, and its signs as doing good for God's sake and the heart shivering at the Qur'an."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ اللہ کی محبت اس وقت ایمان کی حقیقت کو پہنچتی ہے جب دل مال اور عزت سے زیادہ اللہ کو عزیز ہو۔ وہ اس محبت کے منبع بتاتے ہیں، جیسے سوچ سمجھ کر بات کرنا، حلال کھانا اور اللہ کی نعمتوں کو سمجھنا، اور اس کی علامات میں اللہ کی رضا کے لیے بھلائی کرنا اور قرآن کی تلاوت پر دل کا کانپ اٹھنا شامل ہیں۔"
