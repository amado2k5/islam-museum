id: concept/hubb-allah
class: concept
kind: belief
label:
  ar: "محبة الله"
  en: "Love for God (hubb Allah)"
  ur: "اللہ کی محبت"
  es: "Amor por Dios (hubb Allah)"
  fr: "L'amour pour Dieu (hubb Allah)"
  tr: "Tanrı sevgisi"
  id: "Kasih Tuhan"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن محبة الله تبلغ حقيقة الإيمان حين يكون القلب أحب إليه من الغنى والشرف. ويذكر منابع المحبة، ومنها التدبر في القول وأكل الحلال والتفقه في نعم الله، وعلاماتها، ومنها فعل المعروف لوجه الله واقشعرار القلب عند قراءة القرآن."
  en: "Sheikh Omar Abdelkafy says that love for God reaches the reality of faith when the heart holds God dearer than wealth and honour. He names its sources as pondering one's speech, eating lawful food and understanding God's favours, and its signs as doing good for God's sake and the heart shivering at the Qur'an."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ اللہ کی محبت اس وقت ایمان کی حقیقت کو پہنچتی ہے جب دل مال اور عزت سے زیادہ اللہ کو عزیز ہو۔ وہ اس محبت کے منبع بتاتے ہیں، جیسے سوچ سمجھ کر بات کرنا، حلال کھانا اور اللہ کی نعمتوں کو سمجھنا، اور اس کی علامات میں اللہ کی رضا کے لیے بھلائی کرنا اور قرآن کی تلاوت پر دل کا کانپ اٹھنا شامل ہیں۔"
  es: "El jeque Omar Abdelkafy afirma que el amor a Dios alcanza la verdadera fe cuando el corazón lo considera más valioso que la riqueza y el honor. Menciona como fuentes de este amor la reflexión sobre las propias palabras, el consumo de alimentos lícitos y la comprensión de los favores divinos, y como señales de este amor la acción de hacer el bien por amor a Dios y la emoción que se siente al leer el Corán."
  fr: "Le cheikh Omar Abdelkafy affirme que l'amour de Dieu atteint le stade de la foi lorsque le cœur place Dieu au-dessus des richesses et des honneurs. Il cite comme sources la réflexion sur ses paroles, la consommation d'aliments licites et la conscience des bienfaits divins, et comme signes les bonnes actions accomplies par dévotion envers Dieu et la profonde émotion ressentie à la lecture du Coran."
  tr: "Şeyh Ömer Abdul Kafi, Allah sevgisinin, kalbin zenginlik ve onurdan daha değerli olduğunda gerçek iman özüne ulaştığını söyler. Sevginin kaynaklarından bahseder; konuşmayı düşünmek, yasal yemek yemek, Allah'ın nimetlerini ve işaretlerini anlamak, ayrıca Tanrı için iyilik yapmak ve Kur'an okunurken kalbin ürpermesini içerir."
  id: "Sheikh Omar Abdul Kafi mengatakan bahwa kasih kepada Tuhan mencapai esensi sejati iman ketika hati lebih berharga darinya daripada kekayaan dan kehormatan. Ia menyebutkan sumber cinta, termasuk kontemplasi dalam berbicara, makan makanan yang sah, memahami berkat Tuhan dan tanda-tandanya, serta berbuat baik demi Tuhan dan membuat hati merinding saat membaca Al-Qur'an."
