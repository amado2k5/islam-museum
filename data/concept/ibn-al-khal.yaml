label: { ar: "ابن الخال", en: "Maternal uncle's son" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن الخال بأنه ابن أخي الأم، وهو إما ابن خال من النسب، وهو المراد عند الإطلاق، أو من الرضاع. واتفق الفقهاء على أنه من الرحم غير المحرّمة، فيسري عليه ما يسري على غير المحارم، من جواز النكاح في حقه، ومنع الخلوة به للأنثى، وعدم وجوب النفقة عليه إلا إذا كان وارثاً. واتفقوا على أنه من ذوي الأرحام، لهم أحكام في الميراث وإمامة صلاة الجنازة وصلة الرحم والولاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462}"
  en: "The Kuwaiti encyclopedia defines a maternal uncle's son as the son of the mother's brother. He is either a blood cousin, which is the meaning when used alone, or a foster cousin. The jurists agree that he is within the non-prohibited kin, so the rules for those who are not mahrams apply to him: marriage to him is permitted, a woman may not be alone with him, and maintenance is not due from him unless he is an heir. They also agree that he is among those with blood-ties through a female, with rules in inheritance, leading the funeral prayer, the bond of kinship and guardianship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462}"
