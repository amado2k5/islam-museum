id: concept/al-asbab-wal-qudra
class: concept
kind: doctrine
label:
  ar: "الأسباب والقدرة الإلهية"
  en: "Causes and divine power (al-asbab wal-qudra)"
  ur: "اسباب اور الہی قدرت"
summary:
  ar: "يرى الشعراوي أن الإنسان يرى الأشياء تستجيب له فيظن أن له سيطرة عليها، كالأرض والكهرباء والطائرة والتلفاز، وينسى أن الله خلق لها قوانينها وخصائصها. ويقرر أن الذاتية لله وحده، وأن الإنسان لا يملك ذاتية، لأنه يبدأ محتاجاً ويختم محتاجاً، وأن الأشياء مسخرة بقدرة الله لا بقدرة أحد {cite:tafsir-sharawi-khawatir-scan p.139} {cite:tafsir-sharawi-khawatir-scan p.140}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that a person sees things respond to him and thinks he has mastery over them, as with the earth, electricity, the aircraft and television, forgetting that God created their laws and properties. He holds that self-sufficiency belongs to God alone, since a person starts in need and ends in need, and that things are subjected by God's power and not by anyone's power {cite:tafsir-sharawi-khawatir-scan p.139} {cite:tafsir-sharawi-khawatir-scan p.140}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی کے نزدیک انسان دیکھتا ہے کہ چیزیں اس کے لیے کام کرتی ہیں، جیسے زمین، بجلی، ہوائی جہاز اور ٹیلی ویژن، تو وہ سمجھتا ہے کہ وہ ان پر قابو رکھتا ہے، اور بھول جاتا ہے کہ اللہ نے ان کے قوانین اور خصوصیات بنائیں۔ ان کا کہنا ہے کہ ذاتی بے نیازی صرف اللہ کی ہے، کیونکہ انسان محتاج پیدا ہوتا ہے اور محتاج ہی رہتا ہے، اور چیزیں اللہ کی قدرت سے مسخر ہیں، کسی انسان کی قدرت سے نہیں {cite:tafsir-sharawi-khawatir-scan p.139} {cite:tafsir-sharawi-khawatir-scan p.140}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
wings: [ideas]
themes: []
regions: [global]
periods: [period/prophetic-era]
issue:
  ar: "هل للأسباب تأثير ذاتي، أم أنها تعمل بقدرة الله؟"
  en: "Do causes act by their own nature, or by God's power?"
  ur: "کیا اسباب اپنی ذات سے اثر رکھتے ہیں، یا اللہ کی قدرت سے کام کرتے ہیں؟"
perspectives:
  - tradition: sunni
    id: sharawi-asbab
    stance:
      ar: "الأسباب لا تعمل بذاتها، وإنما بقدرة الله وتسخيره"
      en: "Causes do not act by themselves, but by God's power and subjection"
      ur: "اسباب اپنی ذات سے کام نہیں کرتے، بلکہ اللہ کی قدرت اور تسخیر سے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الكون يعمل بقدرة خالقه الذي إن شاء أجراه وإن شاء أوقفه {cite:tafsir-sharawi-khawatir-scan p.44} {cite:tafsir-sharawi-khawatir-scan p.139}."
      en: "Sha'rawi holds that the cosmos works by its Creator's power, who sets it running or halts it as He wills {cite:tafsir-sharawi-khawatir-scan p.44} {cite:tafsir-sharawi-khawatir-scan p.139}."
      ur: "شعراوی کے مطابق کائنات اپنے خالق کی قدرت سے چلتی ہے، جو چاہے تو اسے چلائے اور چاہے تو روک دے {cite:tafsir-sharawi-khawatir-scan p.44} {cite:tafsir-sharawi-khawatir-scan p.139}۔"
