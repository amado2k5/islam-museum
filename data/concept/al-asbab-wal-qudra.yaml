id: concept/al-asbab-wal-qudra
class: concept
kind: doctrine
label:
  ar: "الأسباب والقدرة الإلهية"
  en: "Causes and divine power (al-asbab wal-qudra)"
  fr: "Les causes et la puissance divine (al-asbab wal-qudra)"
  ur: "اسباب اور الہی قدرت"
  es: "Causas y poder divino (al-asbab wal-qudra)"
  tr: "Nedenler ve İlahi Güç"
  id: "Penyebab dan Kekuatan Ilahi"
summary:
  ar: "يرى الشعراوي أن الإنسان يرى الأشياء تستجيب له فيظن أن له سيطرة عليها، كالأرض والكهرباء والطائرة والتلفاز، وينسى أن الله خلق لها قوانينها وخصائصها. ويقرر أن الذاتية لله وحده، وأن الإنسان لا يملك ذاتية، لأنه يبدأ محتاجاً ويختم محتاجاً، وأن الأشياء مسخرة بقدرة الله لا بقدرة أحد {cite:tafsir-sharawi-khawatir-scan p.139} {cite:tafsir-sharawi-khawatir-scan p.140}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that a person sees things respond to him and thinks he has mastery over them, as with the earth, electricity, the aircraft and television, forgetting that God created their laws and properties. He holds that self-sufficiency belongs to God alone, since a person starts in need and ends in need, and that things are subjected by God's power and not by anyone's power {cite:tafsir-sharawi-khawatir-scan p.139} {cite:tafsir-sharawi-khawatir-scan p.140}. This is Sha'rawi's reading and is attributed to him."
  fr: "Selon Sha'rawi, l’être humain voit les choses lui obéir et croit les maîtriser, qu’il s’agisse de la terre, de l’électricité, de l’avion ou de la télévision. Il oublie que Dieu en a créé les lois et les propriétés. Pour Sha'rawi, Dieu seul se suffit à lui-même, puisque l’être humain commence et finit sa vie dans le besoin, et c’est la puissance de Dieu, non celle de quiconque, qui soumet les choses {cite:tafsir-sharawi-khawatir-scan p.139} {cite:tafsir-sharawi-khawatir-scan p.140}. Cette lecture est celle de Sha'rawi et lui est attribuée."
  ur: "شعراوی کے نزدیک انسان دیکھتا ہے کہ چیزیں اس کے لیے کام کرتی ہیں، جیسے زمین، بجلی، ہوائی جہاز اور ٹیلی ویژن، تو وہ سمجھتا ہے کہ وہ ان پر قابو رکھتا ہے، اور بھول جاتا ہے کہ اللہ نے ان کے قوانین اور خصوصیات بنائیں۔ ان کا کہنا ہے کہ ذاتی بے نیازی صرف اللہ کی ہے، کیونکہ انسان محتاج پیدا ہوتا ہے اور محتاج ہی رہتا ہے، اور چیزیں اللہ کی قدرت سے مسخر ہیں، کسی انسان کی قدرت سے نہیں {cite:tafsir-sharawi-khawatir-scan p.139} {cite:tafsir-sharawi-khawatir-scan p.140}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "Sha'rawi sostiene que una persona ve que las cosas responden a ella y cree tener dominio sobre ellas, como ocurre con la tierra, la electricidad, los aviones y la televisión, olvidando que Dios creó sus leyes y propiedades. Afirma que la autosuficiencia pertenece solo a Dios, puesto que una persona comienza y termina en la necesidad, y que las cosas están sujetas al poder de Dios y no al de nadie más {cite:tafsir-sharawi-khawatir-scan p.139} {cite:tafsir-sharawi-khawatir-scan p.140}. Esta es la interpretación de Sha'rawi y se le atribuye."
  tr: "Al-Shaarawi, insanların kendisine tepki veren şeyleri gördüğüne ve dünya, elektrik, uçaklar ve televizyon gibi şeyler üzerinde kontrol sahibi olduğunu düşündüğünü düşünür; ancak Tanrı'nın onlar için yasalarını ve özelliklerini yarattığını unutur. Öznelliğin yalnızca Tanrı'ya ait olduğunu, insanın öznelliğe sahip olmadığını, çünkü muhtaç başlayıp muhtaç olarak bittiğini, her şeyin Tanrı'nın gücüne bağlı olduğunu, kimsenin yeteneğine değil {cite:tafsir-sharawi-khawatir-scan s.139} {cite:tafsir-sharawi-khawatir-scan s.140} Bu onun yorumudur ve ona atfedilir."
  id: "Al-Shaarawi berpikir bahwa manusia melihat hal-hal yang bereaksi terhadap mereka dan berpikir mereka mengendalikan hal-hal seperti dunia, listrik, pesawat, dan televisi; namun, ia lupa bahwa Allah menciptakan hukum dan sifat-Nya untuk mereka. Subjektivitas hanya milik Tuhan, bahwa manusia tidak memiliki subjektivitas karena orang yang membutuhkan dimulai dan berakhir sebagai yang membutuhkan, bahwa segalanya bergantung pada kekuatan Tuhan, bukan pada kemampuan siapa pun {cite:tafsir-sharawi-khawatir-scan hlm.139} {cite:tafsir-sharawi-khawatir-scan hlm.140} Ini adalah interpretasinya dan dikaitkan dengannya."
