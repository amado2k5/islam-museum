label:
  ar: "التعديل"
  en: "Ta'dil (certifying a witness's probity; equalising shares; correcting postures in prayer; the value-based division)"
  ur: "تعدیل (گواہ کی عدالت کی تصدیق، حصص کی برابری، نماز میں ارکان کا اعتدال)"
summary:
  ar: "التعديل التسوية والتقويم، وفي الفقه التزكية بنسبة الشاهد أو الراوي إلى العدالة. ويجب على القاضي تعديل الشهود إن لم يعلم عدالتهم عند الشافعية والحنابلة والمالكية وأبي يوسف ومحمد، وقال أبو حنيفة يقبل الظاهر العدالة إلا في الحدود والقصاص. وتعديل الأركان في الصلاة واجب، وفرض عند الجمهور، وواجب عند الحنفية. وقسمة التعديل تقسم العين المشتركة بالقيمة لا بالأجزاء، وكذا جزاء الصيد المثلي يجوز العدول فيه عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5406}"
  en: "Ta'dil is equalising or setting straight; in law it is certifying a witness or narrator as upright. A judge must seek the probity of the witnesses if he does not know it, according to the Shafiis, Hanbalis, Malikis, Abu Yusuf and Muhammad; Abu Hanifa accepts the apparently upright, except in penalties and retaliation. Settling the postures in prayer is obligatory: a pillar for the majority and a duty short of obligation for the Hanafis. Division by value divides a common thing by worth rather than by parts; the majority also allow a change of value in the fixed penalty for hunting in pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5406}"
