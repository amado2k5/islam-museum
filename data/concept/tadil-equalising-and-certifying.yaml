label:
  ar: "التعديل"
  en: "Ta'dil (certifying a witness's probity; equalising shares; correcting postures in prayer; the value-based division)"
  ur: "تعدیل ⁦(گواہ کی عدالت کی تصدیق، حصص کی برابری، نماز میں ارکان کا اعتدال)⁩"
  es: "Ta'dil (certificar la probidad de un testigo; igualar las partes; corregir las posturas en la oración; la división basada en valores)"
  fr: "Ta'dil (certification de la probité d'un témoin; égalisation des parts; correction des postures dans la prière; le partage fondé sur les valeurs)"
summary:
  ar: "التعديل التسوية والتقويم، وفي الفقه التزكية بنسبة الشاهد أو الراوي إلى العدالة. ويجب على القاضي تعديل الشهود إن لم يعلم عدالتهم عند الشافعية والحنابلة والمالكية وأبي يوسف ومحمد، وقال أبو حنيفة يقبل الظاهر العدالة إلا في الحدود والقصاص. وتعديل الأركان في الصلاة واجب، وفرض عند الجمهور، وواجب عند الحنفية. وقسمة التعديل تقسم العين المشتركة بالقيمة لا بالأجزاء، وكذا جزاء الصيد المثلي يجوز العدول فيه عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5406}"
  en: "Ta'dil is equalising or setting straight; in law it is certifying a witness or narrator as upright. A judge must seek the probity of the witnesses if he does not know it, according to the Shafiis, Hanbalis, Malikis, Abu Yusuf and Muhammad; Abu Hanifa accepts the apparently upright, except in penalties and retaliation. Settling the postures in prayer is obligatory: a pillar for the majority and a duty short of obligation for the Hanafis. Division by value divides a common thing by worth rather than by parts; the majority also allow a change of value in the fixed penalty for hunting in pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5406}"
  es: "Ta'dil significa igualar o corregir; en derecho, certificar la rectitud de un testigo o narrador. Según los shafiíes, hanbalíes, malikíes, Abu Yusuf y Muhammad, un juez debe buscar la probidad de los testigos si la desconoce; Abu Hanifa acepta a los aparentemente íntegros, excepto en lo que respecta a penas y represalias. La postura correcta en la oración es obligatoria: un pilar para la mayoría y un deber, aunque no una obligación, para los hanafíes. La división por valor divide una cosa común según su valor en lugar de por sus partes; la mayoría también permite un cambio de valor en la pena fija por cazar durante la peregrinación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5406}"
  fr: "Le ta'dil consiste à égaliser ou à rectifier; en droit, il s'agit de certifier la probité d'un témoin ou d'un narrateur. Un juge doit s'assurer de la probité des témoins s'il ne la connaît pas, selon les écoles chaféite, hanbalite, malikite, Abou Yusuf et Muhammad; Abou Hanifa accepte les personnes apparemment intègres, sauf en matière de sanctions et de représailles. L'adoption des postures de prière est obligatoire: un pilier pour la majorité et un devoir, sans être une obligation, pour les hanafites. La division par la valeur consiste à diviser un bien commun selon sa valeur intrinsèque plutôt que par ses parties; la majorité autorise également une variation de valeur dans l'amende forfaitaire pour la chasse en pèlerinage."
