id: concept/al-aql-wal-qalb
class: concept
kind: doctrine
label:
  ar: العقل والقلب
  en: Reason and heart
  fr: "La raison et le cœur"
  es: "Razón y corazón"
  ur: "دلیل اور دل"
summary:
  ar: "يرى محمد فريد وجدي أن الإنسان مكلف بتوازن العقل والقلب معاً: فالعقل يدرك الحق والباطل، والقلب يمنح رهافة الشعور ونبل العاطفة التي تردع عن المنكر حتى حين يعلم المرء ضرره. ويستشهد بأن التقدم العلمي وحده لم يمنع الحروب والدمار، فيرى أن الإسلام جمع بين تربية العقل والقلب، ودعا إلى النظر في الآفاق والنفس {cite:muhimmat-al-islam-azhar p. 32} {cite:muhimmat-al-islam-azhar p. 33} {cite:muhimmat-al-islam-azhar p. 35}. هذا تحليل المؤلف لا حكم للمتحف."
  en: "Wajdi holds that a person must balance reason and heart together. Reason discerns truth from falsehood, while the heart gives the sensitivity that restrains a person from wrongdoing even when he knows its harm. He argues that scientific progress alone did not prevent wars, and that Islam educates both reason and heart and calls to reflection on the world and the self {cite:muhimmat-al-islam-azhar p. 32} {cite:muhimmat-al-islam-azhar p. 33} {cite:muhimmat-al-islam-azhar p. 35}. This is the author's analysis, not the museum's verdict."
  fr: "Wajdi estime qu’il incombe à chacun de trouver un équilibre entre la raison et le cœur. La raison distingue le vrai du faux, tandis que le cœur donne la sensibilité qui retient de mal agir, même lorsqu’on sait le tort que cela cause. Selon lui, le progrès scientifique n’a pas à lui seul empêché les guerres, et l’islam éduque à la fois la raison et le cœur et invite à réfléchir au monde et à soi-même {cite:muhimmat-al-islam-azhar p. 32} {cite:muhimmat-al-islam-azhar p. 33} {cite:muhimmat-al-islam-azhar p. 35}. C’est l’analyse de l’auteur, et non un jugement du musée."
  es: "Wajdi sostiene que una persona debe equilibrar la razón y el corazón. La razón distingue la verdad de la falsedad, mientras que el corazón otorga la sensibilidad que frena a la persona de obrar mal aun cuando conoce su daño. Argumenta que el progreso científico por sí solo no evitó las guerras, y que el Islam educa tanto la razón como el corazón, e invita a la reflexión sobre el mundo y sobre uno mismo {cite:muhimmat-al-islam-azhar p. 32} {cite:muhimmat-al-islam-azhar p. 33} {cite:muhimmat-al-islam-azhar p. 35}. Este es el análisis del autor, no el veredicto del museo."
  ur: "وجدی کا خیال ہے کہ انسان کو عقل اور دل کو ایک ساتھ متوازن کرنا چاہیے۔ عقل حق کو جھوٹ سے پہچانتی ہے، جب کہ دل وہ حساسیت عطا کرتا ہے جو انسان کو غلط کام سے روکتا ہے حالانکہ وہ اس کا نقصان جانتا ہے۔ وہ استدلال کرتا ہے کہ صرف سائنسی ترقی ہی جنگوں کو نہیں روک سکتی، اور یہ کہ اسلام عقل اور دل دونوں کو تعلیم دیتا ہے اور دنیا اور نفس پر غور و فکر کرنے کی دعوت دیتا ہے۔ 32} {حوالہ: محمّت الاسلام ازہر ص۔ 33} {حوالہ: محمّت الاسلام اظہر ص۔ 35}۔ یہ مصنف کا تجزیہ ہے، میوزیم کا فیصلہ نہیں۔"
