label:
  ar: العقل والقلب
  en: Reason and heart
summary:
  ar: "يرى محمد فريد وجدي أن الإنسان مكلف بتوازن العقل والقلب معاً: فالعقل يدرك الحق والباطل، والقلب يمنح رهافة الشعور ونبل العاطفة التي تردع عن المنكر حتى حين يعلم المرء ضرره. ويستشهد بأن التقدم العلمي وحده لم يمنع الحروب والدمار، فيرى أن الإسلام جمع بين تربية العقل والقلب، ودعا إلى النظر في الآفاق والنفس {cite:muhimmat-al-islam-azhar p. 32} {cite:muhimmat-al-islam-azhar p. 33} {cite:muhimmat-al-islam-azhar p. 35}. هذا تحليل المؤلف لا حكم للمتحف."
  en: "Wajdi holds that a person must balance reason and heart together. Reason discerns truth from falsehood, while the heart gives the sensitivity that restrains a person from wrongdoing even when he knows its harm. He argues that scientific progress alone did not prevent wars, and that Islam educates both reason and heart and calls to reflection on the world and the self {cite:muhimmat-al-islam-azhar p. 32} {cite:muhimmat-al-islam-azhar p. 33} {cite:muhimmat-al-islam-azhar p. 35}. This is the author's analysis, not the museum's verdict."
