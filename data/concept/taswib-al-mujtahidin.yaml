issue:
  ar: "إذا اختلف مجتهدان في مسألة، أهما مصيبان أم أحدهما مخطئ؟"
  en: "When two mujtahids differ on a question, are both right or is one mistaken?"
  ur: "جب دو مجتہد کسی مسئلے میں مختلف ہوں تو کیا دونوں درست ہیں یا ایک خطا پر ہے؟"
