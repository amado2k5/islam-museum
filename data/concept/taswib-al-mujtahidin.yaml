id: concept/taswib-al-mujtahidin
class: concept
kind: doctrine
label:
  ar: "التصويب والتخطئة: هل كل مجتهد مصيب؟"
  en: "Is every mujtahid right? (taswib and takhti'a)"
  ur: "کیا ہر مجتہد درست ہے؟ ⁦(تصویب و تخطئہ)⁩"
term: { ar: "التصويب والتخطئة", en: "taswib wa-takhti'a" }
summary:
  ar: "مسألة أصولية: إذا اجتهد مجتهدان في مسألة فاختلفا، أهما مصيبان أم أحدهما مصيب والآخر مخطئ؟ تروي ترجمة الكاساني في مقدمة طبعة البدائع أنه ناظر فقيهاً في بلاد الروم فيها، فنسب الفقيه إلى أبي حنيفة أن كل مجتهد مصيب، فقال الكاساني إن الصحيح عن أبي حنيفة أن أحدهما مصيب والآخر مخطئ والحق في جهة واحدة، وإن القول الآخر مذهب المعتزلة. {cite:badai-sanai-ilmiyya-v1 p.74}"
  en: "A question of legal theory: when two mujtahids reason on a question and reach different answers, are both right, or is one right and the other mistaken? The life of al-Kasani in the introduction to the Bada'i' edition relates that he debated it with a jurist in the land of Rum: the jurist ascribed to Abu Hanifa the view that every mujtahid is right; al-Kasani answered that the sound report from Abu Hanifa is that one is right and the other mistaken, the truth lying on one side, and that the other view is the Mu'tazila's."
  ur: "اصولِ فقہ کا مسئلہ: جب دو مجتہد کسی مسئلے میں اجتہاد کریں اور مختلف نتیجے پر پہنچیں تو کیا دونوں درست ہیں، یا ایک درست اور دوسرا خطا پر؟ بدائع کے ایڈیشن کے مقدمے میں کاسانی کے ترجمے میں ہے کہ انہوں نے بلادِ روم میں ایک فقیہ سے اس پر مناظرہ کیا: فقیہ نے امام ابو حنیفہ کی طرف یہ قول منسوب کیا کہ ہر مجتہد درست ہے؛ کاسانی نے کہا کہ امام ابو حنیفہ سے صحیح روایت یہ ہے کہ ایک درست اور دوسرا خطا پر ہے اور حق ایک ہی جانب ہے، اور دوسرا قول معتزلہ کا مذہب ہے۔"
wings: [ideas]
