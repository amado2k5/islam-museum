id: concept/weapons-mounts-and-belongings-of-the-prophet
tags: [wasaya-browser, wasaya-legacy, wasaya-mirath, wasaya-athar]
class: concept
kind: term
label:
  ar: "سلاح النبي ودوابه وأمتعته كما تعدّها كتب السيرة"
  en: "The Prophet's weapons, mounts and belongings as the sira books list them"
  ur: "نبی کے ہتھیار، سواریاں اور سامان جیسا سیرت کی کتابیں گنواتی ہیں"
  es: "Las armas, monturas y pertenencias del Profeta, tal como las enumeran los libros de la sira."
summary:
  ar: "تعدّ كتب السيرة للنبي تسعة أسياف وسبعة أدرع وستة قسي ومجموعة أرماح وتروس، منها ذو الفقار وذات الفضول {cite:zad-al-maad scan vol. 1 p. 43}، وخيلاً أشهرها السكب والمرتجز، وبغالاً أشهرها دلدل، ومن الإبل القصواء والعضباء والجدعاء {cite:zad-al-maad scan vol. 1 p. 44}. وتختلف القوائم بين المصنفين؛ فعند علي بن أبي طالب فرس اسمه المرتجز وحمار عفير وبغلة دلدل وسيف ذو الفقار ودرع ذو الفضول {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}. ويقول البيهقي، في نقل ابن كثير، إنه ليس في شيء من الروايات أنه مات عنها إلا البغلة البيضاء والسلاح والأرض {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}."
  en: "The sira books credit the Prophet with nine swords, seven coats of mail, six bows and a number of spears and shields, among them Dhu l-Fiqar and Dhat al-Fudul {cite:zad-al-maad scan vol. 1 p. 43}, with horses of which al-Sakb and al-Murtajiz are the best known, mules of which Duldul is best known, and the she-camels al-Qaswa', al-'Adba' and al-Jad'a {cite:zad-al-maad scan vol. 1 p. 44}. The lists differ from book to book; in the report from 'Ali ibn Abi Talib he had a horse named al-Murtajiz, a donkey 'Ufayr, a mule Duldul, the sword Dhu l-Fiqar and the armour Dhu l-Fudul {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}. Al-Bayhaqi, as Ibn Kathir quotes him, says no report says he died leaving any of them except the white mule, the weapons and the land {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}."
  ur: "سیرت کی کتابیں نبی کے لیے نو تلواریں، سات زرہیں، چھ کمانیں اور متعدد نیزے اور ڈھالیں گنواتی ہیں، جن میں ذوالفقار اور ذات الفضول مشہور ہیں {cite:zad-al-maad scan vol. 1 p. 43}؛ گھوڑوں میں سکب اور مرتجز، خچروں میں دلدل، اور اونٹنیوں میں قصواء، عضباء اور جدعاء {cite:zad-al-maad scan vol. 1 p. 44}۔ فہرستیں کتاب کتاب مختلف ہیں؛ علی بن ابی طالب کی روایت میں مرتجز نام کا گھوڑا، عفیر گدھا، دلدل خچر، ذوالفقار تلوار اور ذوالفضول زرہ ہے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}۔ بیہقی، ابن کثیر کے نقل کے مطابق، کہتے ہیں کہ کسی روایت میں یہ نہیں کہ آپ ان میں سے کچھ چھوڑ کر فوت ہوئے ہوں، سوائے سفید خچر، ہتھیاروں اور زمین کے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}۔"
  es: "Los libros de la sira le atribuyen al Profeta nueve espadas, siete cotas de malla, seis arcos y varias lanzas y escudos, entre ellos Dhu l-Fiqar y Dhat al-Fudul {cite:zad-al-maad scan vol. 1 p. 43}, con caballos de los cuales al-Sakb y al-Murtajiz son los más conocidos, mulas de las cuales Duldul es la más conocida, y las camellas al-Qaswa', al-'Adba' y al-Jad'a {cite:zad-al-maad scan vol. 1 p. 44}. Las listas difieren de un libro a otro; en el informe de 'Ali ibn Abi Talib tenía un caballo llamado al-Murtajiz, un burro 'Ufayr, una mula Duldul, la espada Dhu l-Fiqar y la armadura Dhu l-Fudul {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}. Al-Bayhaqi, como lo cita Ibn Kathir, dice que ningún informe dice que murió dejando a ninguno de ellos excepto la mula blanca, las armas y la tierra {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}."
