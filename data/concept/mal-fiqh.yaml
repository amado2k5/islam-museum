id: concept/mal-fiqh
class: concept
kind: legal
label:
  ar: "المَال"
  en: "Mal (property) in fiqh: definitions, kinds, usufruct and debt as property"
  ur: "مال (فقہی اصطلاح): تعریف، اقسام، منفعت اور دین کی مالیت"
summary:
  ar: "المال في اللغة كل ما تملكه الإنسان من الأشياء، وعند الحنفية ما يميل إليه الطبع ويمكن ادخاره لوقت الحاجة، وعند المالكية ما يقع عليه الملك ويستبد به المالك، وعند الحنابلة ما يباح نفعه مطلقاً أو يباح اقتناؤه بلا حاجة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800-13801}. واختلف الفقهاء في مالية المنافع: الحنفية لا يرونها أموالاً متقومة في ذاتها إلا إذا وردت عليها عقد معاوضة كالإجارة، والجمهور من الشافعية والمالكية والحنابلة يرونها أموالاً بذاتها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13801-13802}. وفي مالية الدين: الحنفية يرونه مالاً مجازاً لا حقيقة، وقول الشافعية أنه مال حقيقة أو حق مطالبة يصير مالاً في المآل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13802-13803}. وقسم الفقهاء المال تقسيمات كثيرة: المتقوم وغير المتقوم عند الحنفية، والمثلي والقيمي، وما تعلق به حق الغير، والمنقول والعقار، والنقود والعروض، والضمار والمرجو، والنامي وللقنية، والظاهر والباطن في الزكاة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13803-13810}. ومن أحكامه تحريم مال المسلم والذمي وأكله بالباطل، ولا يسلم مال الصغير حتى يؤنس منه الرشد، ويجب اكتساب ما يكفي المرء ومن تجب نفقته، والتخلص من المال الحرام المختلط {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13809-13810}. والأموال الربوية ستة أصناف وردت في الحديث، وما عداها غير ربوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13810-13811}."
  en: "Mal, in lexicon, is anything a person owns. The Hanafis define it as what human nature inclines to and can be kept for need; the Malikis, as what can be owned and the owner may exclusively control; the Hanbalis, as what it is lawful to benefit from in every case, or lawful to keep without need {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800-13801}. The jurists differ on whether usufructs are property: the Hanafis hold they are not in themselves property, except when they are the object of a contract of exchange such as hire; most Shafi'is, Malikis and Hanbalis hold they are property in themselves {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13801-13802}. On debt as property, the Hanafis treat it as property in a figurative sense; one Shafi'i view says it is property in fact, another that it is a right to claim which becomes property in the end {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13802-13803}. The jurists divide property in many ways: valued and unvalued (Hanafi), fungible and non-fungible, goods subject to another's right, movables and immovables, cash and goods, property lost or hoped for, growing and held, and apparent and hidden property for zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13803-13810}. Its rulings include the prohibition on taking or consuming another's property, the rule that a minor's property is not handed over until he is proved of sound judgement, the duty to earn enough for oneself and dependants, and the duty to rid oneself of mixed unlawful property {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13809-13810}. The six kinds of ribawi goods are fixed by a hadith; other goods are not ribawi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13810-13811}."
  ur: "مال لغت میں ہر اس چیز کو کہتے ہیں جس کا انسان مالک ہو۔ حنفیہ کے نزدیک وہ چیز جس کی طرف طبیعت مائل ہو اور جسے ضرورت کے وقت جمع رکھا جا سکے؛ مالکیہ کے نزدیک وہ جس پر ملکیت ہو اور مالک اسے دوسروں سے الگ رکھ کر تصرف کر سکے؛ حنابلہ کے نزدیک وہ جس سے ہر حال میں نفع اٹھانا جائز ہو، یا جسے بلا ضرورت رکھنا جائز ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800-13801}۔ منافع کی مالیت میں اختلاف ہے: حنفیہ انہیں اپنی ذات سے مال نہیں مانتے، سوائے اس کے کہ وہ اجارہ جیسے معاوضے کا موضوع ہوں؛ جمہور شافعیہ، مالکیہ اور حنابلہ انہیں بذاتِ خود مال کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13801-13802}۔ دین کی مالیت میں حنفیہ اسے مجازاً مال کہتے ہیں؛ شافعیہ کا ایک قول یہ ہے کہ یہ حقیقتاً مال ہے، اور دوسرا یہ کہ یہ مطالبے کا حق ہے جو انجام کار مال بن جاتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13802-13803}۔ فقہاء نے مال کی کئی تقسیمات کی ہیں: حنفیہ کی متقوم اور غیر متقوم، مثلی اور قیمی، وہ مال جس میں دوسرے کا حق ہو، منقول اور غیر منقول، نقود اور عروض، ضمار اور مرجو، نامی اور قنیہ، اور زکات کے لحاظ سے ظاہر اور باطن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13803-13810}۔ اس کے احکام میں کسی کا مال ناحق کھانا حرام ہے، نابالغ کا مال رشد ثابت ہونے سے پہلے حوالے نہیں کیا جاتا، آدمی پر اتنا کمانا فرض ہے جو اسے اور اس کے زیر کفالت افراد کو کافی ہو، اور مخلوط حرام مال سے بری ہونا لازم ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13809-13810}۔ سود کے چھ اصناف حدیث میں آئے ہیں، ان کے علاوہ چیزیں سودی نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13810-13811}۔"
