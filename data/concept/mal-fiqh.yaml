id: concept/mal-fiqh
class: concept
kind: legal
label:
  ar: "المَال"
  en: "Mal (property) in fiqh: definitions, kinds, usufruct and debt as property"
  ur: "مال ⁦(فقہی اصطلاح)⁩: تعریف، اقسام، منفعت اور دین کی مالیت"
  es: "Mal (propiedad) en fiqh: definiciones, tipos, usufructo y deuda como propiedad"
  fr: "Le mal (propriété) en fiqh: définitions, catégories, usufruit et dette en tant que propriété"
  tr: "Para"
  id: "Uang"
summary:
  ar: "المال في اللغة كل ما تملكه الإنسان من الأشياء، وعند الحنفية ما يميل إليه الطبع ويمكن ادخاره لوقت الحاجة، وعند المالكية ما يقع عليه الملك ويستبد به المالك، وعند الحنابلة ما يباح نفعه مطلقاً أو يباح اقتناؤه بلا حاجة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800-13801}. واختلف الفقهاء في مالية المنافع: الحنفية لا يرونها أموالاً متقومة في ذاتها إلا إذا وردت عليها عقد معاوضة كالإجارة، والجمهور من الشافعية والمالكية والحنابلة يرونها أموالاً بذاتها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13801-13802}. وفي مالية الدين: الحنفية يرونه مالاً مجازاً لا حقيقة، وقول الشافعية أنه مال حقيقة أو حق مطالبة يصير مالاً في المآل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13802-13803}. وقسم الفقهاء المال تقسيمات كثيرة: المتقوم وغير المتقوم عند الحنفية، والمثلي والقيمي، وما تعلق به حق الغير، والمنقول والعقار، والنقود والعروض، والضمار والمرجو، والنامي وللقنية، والظاهر والباطن في الزكاة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13803-13810}. ومن أحكامه تحريم مال المسلم والذمي وأكله بالباطل، ولا يسلم مال الصغير حتى يؤنس منه الرشد، ويجب اكتساب ما يكفي المرء ومن تجب نفقته، والتخلص من المال الحرام المختلط {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13809-13810}. والأموال الربوية ستة أصناف وردت في الحديث، وما عداها غير ربوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13810-13811}."
  en: "Mal, in lexicon, is anything a person owns. The Hanafis define it as what human nature inclines to and can be kept for need; the Malikis, as what can be owned and the owner may exclusively control; the Hanbalis, as what it is lawful to benefit from in every case, or lawful to keep without need {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800-13801}. The jurists differ on whether usufructs are property: the Hanafis hold they are not in themselves property, except when they are the object of a contract of exchange such as hire; most Shafi'is, Malikis and Hanbalis hold they are property in themselves {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13801-13802}. On debt as property, the Hanafis treat it as property in a figurative sense; one Shafi'i view says it is property in fact, another that it is a right to claim which becomes property in the end {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13802-13803}. The jurists divide property in many ways: valued and unvalued (Hanafi), fungible and non-fungible, goods subject to another's right, movables and immovables, cash and goods, property lost or hoped for, growing and held, and apparent and hidden property for zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13803-13810}. Its rulings include the prohibition on taking or consuming another's property, the rule that a minor's property is not handed over until he is proved of sound judgement, the duty to earn enough for oneself and dependants, and the duty to rid oneself of mixed unlawful property {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13809-13810}. The six kinds of ribawi goods are fixed by a hadith; other goods are not ribawi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13810-13811}."
  ur: "مال لغت میں ہر اس چیز کو کہتے ہیں جس کا انسان مالک ہو۔ حنفیہ کے نزدیک وہ چیز جس کی طرف طبیعت مائل ہو اور جسے ضرورت کے وقت جمع رکھا جا سکے؛ مالکیہ کے نزدیک وہ جس پر ملکیت ہو اور مالک اسے دوسروں سے الگ رکھ کر تصرف کر سکے؛ حنابلہ کے نزدیک وہ جس سے ہر حال میں نفع اٹھانا جائز ہو، یا جسے بلا ضرورت رکھنا جائز ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800-13801}۔ منافع کی مالیت میں اختلاف ہے: حنفیہ انہیں اپنی ذات سے مال نہیں مانتے، سوائے اس کے کہ وہ اجارہ جیسے معاوضے کا موضوع ہوں؛ جمہور شافعیہ، مالکیہ اور حنابلہ انہیں بذاتِ خود مال کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13801-13802}۔ دین کی مالیت میں حنفیہ اسے مجازاً مال کہتے ہیں؛ شافعیہ کا ایک قول یہ ہے کہ یہ حقیقتاً مال ہے، اور دوسرا یہ کہ یہ مطالبے کا حق ہے جو انجام کار مال بن جاتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13802-13803}۔ فقہاء نے مال کی کئی تقسیمات کی ہیں: حنفیہ کی متقوم اور غیر متقوم، مثلی اور قیمی، وہ مال جس میں دوسرے کا حق ہو، منقول اور غیر منقول، نقود اور عروض، ضمار اور مرجو، نامی اور قنیہ، اور زکات کے لحاظ سے ظاہر اور باطن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13803-13810}۔ اس کے احکام میں کسی کا مال ناحق کھانا حرام ہے، نابالغ کا مال رشد ثابت ہونے سے پہلے حوالے نہیں کیا جاتا، آدمی پر اتنا کمانا فرض ہے جو اسے اور اس کے زیر کفالت افراد کو کافی ہو، اور مخلوط حرام مال سے بری ہونا لازم ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13809-13810}۔ سود کے چھ اصناف حدیث میں آئے ہیں، ان کے علاوہ چیزیں سودی نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13810-13811}۔"
  es: "Mal, en léxico, es todo aquello que una persona posee. Los hanafíes lo definen como aquello a lo que la naturaleza humana se inclina y que puede conservarse por necesidad; los malikíes, como aquello que puede poseerse y que el propietario puede controlar exclusivamente; los hanbalíes, como aquello de lo que es lícito beneficiarse en todos los casos, o lícito conservar sin necesidad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13800-13801}. Los juristas difieren en cuanto a si los usufructos son propiedad: los hanafíes sostienen que no son propiedad en sí mismos, excepto cuando son objeto de un contrato de intercambio como el alquiler; la mayoría de los shafiíes, malikíes y hanbalíes sostienen que son propiedad en sí mismos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13801-13802}. Sobre la deuda como propiedad, los hanafíes la tratan como propiedad en sentido figurado; Una postura shafi'í afirma que se trata de propiedad de hecho, mientras que otra sostiene que es un derecho a reclamar que, al final, se convierte en propiedad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13802-13803}. Los juristas dividen la propiedad de diversas maneras: valorada y no valorada (Hanafi), fungible y no fungible, bienes sujetos al derecho de otro, muebles e inmuebles, efectivo y bienes, propiedad perdida o esperada, en crecimiento y poseída, y propiedad aparente y oculta para el zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13803-13810}. Sus normas incluyen la prohibición de tomar o consumir la propiedad ajena, la regla de que la propiedad de un menor no se entrega hasta que se demuestre su buen juicio, el deber de ganar lo suficiente para uno mismo y sus dependientes, y el deber de deshacerse de la propiedad mixta ilícita {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13809-13810}. Los seis tipos de bienes ribawi están fijados por un hadiz; otros bienes no son ribawi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13810-13811}."
  fr: "En terminologie juridique, le terme « mal » désigne tout ce qu'une personne possède. Les hanafites le définissent comme ce vers quoi la nature humaine tend et que l'on peut conserver par nécessité; les malikites, comme ce qui peut être possédé et dont le propriétaire a le contrôle exclusif; les hanbalites, comme ce dont il est licite de bénéficier en toutes circonstances, ou ce qu'il est licite de conserver sans nécessité (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13800-13801). Les juristes divergent quant à la nature de l'usufruit: les hanafites estiment qu'il ne s'agit pas d'une propriété en soi, sauf lorsqu'il fait l'objet d'un contrat d'échange tel qu'un bail; la plupart des shafi'ites, des malikites et des hanbalites le considèrent comme une propriété en soi (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13801-13802). Concernant la dette en tant que propriété, les hanafites la traitent comme telle au sens figuré. Selon une opinion chaféite, il s'agit d'une propriété de fait, tandis qu'une autre considère qu'il s'agit d'un droit à revendiquer qui devient propriété par la suite {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13802-13803}. Les juristes classent les biens de diverses manières: biens ayant une valeur et biens n'en ayant pas (Hanafi), biens fongibles et non fongibles, biens soumis au droit d'autrui, biens meubles et immeubles, espèces et marchandises, biens perdus ou espérés, biens en croissance et biens détenus, et biens apparents et biens cachés pour la zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13803-13810}. Ses règles comprennent l'interdiction de s'approprier ou de consommer le bien d'autrui, la règle selon laquelle les biens d'un mineur ne peuvent lui être remis qu'après validation de sa capacité de discernement, l'obligation de subvenir à ses besoins et à ceux des personnes à sa charge, et l'obligation de se débarrasser de tout bien illicite mixte {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13809-13810}. Les six catégories de biens ribawi sont définies par un hadith; les autres biens ne sont pas ribawi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13810-13811}."
  tr: "Dilde servet, bir kişinin sahip olduğu her şeydir; Hanefilere göre doğanın eğilimli olduğu ve ihtiyaç anlarında saklanabileceği şeydir; Malikilere göre mülkiyet dayatıldığı ve sahibinin sahip olduğu şeydir; ve Hanbalilere göre, faydası kesinlikle izin verilen ya da ihtiyaç olmadan elde edilmesi caiz olan bir şeydir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13800-13801}. Hukukçular, faydaların finansal durumu konusunda farklı görüşlere sahipti: Hanefiler, onu kira gibi bir değişim sözleşmesine tabi olmadıkça özünde geçerli para olarak görmezken, Şafii, Maliki ve Hanbalilerin çoğu bunu kendi başına para olarak kabul eder {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13801-13802}. Borç finansmanı söz konusu olduğunda: Hanafiler bunu gerçek değil, mecazi bir servet olarak görürler ve Şafiiler bunun gerçek ya da hak hakkı olduğunu, nihai terimde mülkiyete dönüştüğünü söyler {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13802-13803}. Hukukçular serveti birçok kategoriye ayırmışlardır: Hanefilere göre neyin yerleşmiş ve ne yerleşmediği, neyin eşdeğer ve değerli olduğunu, başkalarının hakkıyla ilgili olanları, taşınabilir mal ve mülkiyet, para ve teklifleri, 'maar' ve 'mara' olarak kabul edilenleri, neyin geliştiğini ve neyin kaderde olduğunu, ayrıca zekatta neyin açık ve gizli olduğunu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13803-13810}. Hükümleri arasında Müslümanların ve zimmilerin servetinin yasak olarak tüketilmesi ve bunların yasadışı tüketilmesi yer alır; reşit olmayanın malını olgunluğa ulaşana kadar korumak yasaktır. Bir kişi ve harcama yapmak zorunda olanlar için yeterli miktarda para edinmek ve karışık yasadışı servetten kurtulmak gerekir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13809-13810}. Tefeci servet hadislerde adı geçen altı türden gelir ve diğerleri tefecilik değildir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13810-13811}."
  id: "Dalam bahasa, kekayaan adalah segala sesuatu yang dimiliki seseorang; menurut Hanafi, itulah yang diarahkan alam dan dapat disimpan untuk saat membutuhkan; menurut Maliki, itulah harta yang dipaksakan dan dimiliki pemiliknya; dan menurut Hanbali, kekayaan adalah sesuatu yang manfaatnya sepenuhnya diperbolehkan atau diperbolehkan untuk diperoleh tanpa kebutuhan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13800-13801}. Para ahli hukum berbeda pendapat mengenai keuangan manfaat: Hanafi tidak menganggapnya uang yang sah secara intrinsik kecuali tunduk pada kontrak pertukaran seperti sewa, sementara mayoritas Shafi'i, Maliki, dan Hanbal menganggapnya uang itu sendiri {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13801-13802}. Dalam hal pembiayaan utang: Hanafi menganggapnya kekayaan metaforis, bukan kenyataan, dan para Syafi'i mengatakan bahwa itu nyata atau hak klaim yang menjadi properti pada akhir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13802-13803}. Para ahli hukum telah membagi kekayaan ke dalam banyak kategori: apa yang ditetapkan dan apa yang tidak ditetapkan menurut Hanafi, apa yang setara dan bernilai, apa yang terkait dengan hak orang lain, harta bergerak dan properti, uang dan tawaran, apa yang dianggap sebagai 'maar' dan 'mara', apa yang dikembangkan dan apa yang ditakdirkan, dan apa yang tampak dan tersembunyi dalam zakat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13803-13810}. Di antara keputusannya adalah larangan kekayaan Muslim dan dhimmi serta penggunaannya secara tidak sah, dan seseorang tidak boleh melindungi harta anak di bawah umur sampai mereka mencapai kedewasaan. Perlu memperoleh cukup untuk seseorang dan mereka yang wajib membelanjakannya, serta menyingkirkan campuran kekayaan yang tidak sah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13809-13810}. Kekayaan riba terdiri dari enam jenis yang disebutkan dalam hadits, dan sisanya tidak riba {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13810-13811}."
