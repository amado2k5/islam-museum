tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "مثل «سبق السيف العذل»"
  en: "The proverb 'The sword preceded the blame'"
  ur: "مثل «سبق السیف العذل»"
  fr: "Le proverbe « Le sabre a devancé le blâme »"
  es: "El proverbio «La espada se adelantó al reproche»"
summary:
  ar: "مثل يُضرب فيما فات ولا يُستدرك، وقصته أن أباً عرف سيف ابنه المقتول عند رجل في الحج فقتله فلامه الناس فقال إن السيف سبق اللوم {cite:rafed-library-majma-al-amthal-p341}."
  en: "A proverb for what is done and cannot be undone; its tale is of a father who knew his murdered son's sword in a man's hands at the pilgrimage, killed him, and answered the reproach that the sword had gone before the blame {cite:rafed-library-majma-al-amthal-p341}."
  ur: "وہ مثل جو ہو چکی بات کے لیے کہی جاتی ہے جس کا تدارک نہیں؛ اس کا قصہ ایک باپ کا ہے جس نے حج میں مقتول بیٹے کی تلوار ایک شخص کے پاس پہچانی، اسے قتل کیا اور ملامت پر کہا کہ تلوار ملامت سے آگے نکل گئی {cite:rafed-library-majma-al-amthal-p341}۔"
  fr: "Proverbe dit de ce qui est fait et ne se rattrape pas ; son histoire est celle d'un père qui reconnut au pèlerinage le sabre de son fils assassiné aux mains d'un homme, le tua, et répondit au blâme que le sabre avait devancé la censure {cite:rafed-library-majma-al-amthal-p341}."
  es: "Proverbio que se dice de lo hecho que no se remedia; su relato es el de un padre que reconoció en la peregrinación la espada de su hijo asesinado en manos de un hombre, lo mató y respondió al reproche que la espada se había adelantado a la censura {cite:rafed-library-majma-al-amthal-p341}."
