id: concept/dhawq-fiqh
class: concept
kind: legal
label:
  ar: "الذوق (في الفقه)"
  en: "Taste (dhawq) in the rulings: fasting, injury to it, and oaths"
  ur: "ذوق (فقہی احکام: روزہ، جنایت اور قسم)"
summary:
  ar: "الذوق إدراك طعم الشيء بواسطة الرطوبة المنبثة بالعصب المفروش على عضل اللسان، وهو أحد الحواس الخمس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} لا يبطل الصوم بذوق الطعام ما لم يصل إلى الجوف، والأفضل تجنبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} وفي إذهاب الذوق بالجناية دية كاملة باتفاق، واختلفوا في القصاص فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} وفي اليمين: من حلف ألا يذوق فأكل أو شرب حنث، ومن حلف ألا يأكل أو يشرب فذاق لم يحنث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501}"
  en: "Dhawq is perceiving the taste of a thing through the moisture spread on the nerve over the tongue; it is one of the five senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} Tasting food does not break the fast unless it reaches the body inside, though it is better avoided. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} For injury that takes away taste a full diya is due by agreement; the schools differ on retaliation for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} In oaths, one who swears not to taste and then eats or drinks breaks the oath, while one who swears not to eat or drink and then tastes does not, because all eating is tasting but not every tasting is eating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501}"
  ur: "ذوق زبان کے عصب سے طعم کا ادراک ہے، اور یہ پانچ حواس میں سے ایک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} ذائقہ چکھنے سے روزہ نہیں ٹوٹتا جب تک چیز پیٹ تک نہ پہنچے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501}"
