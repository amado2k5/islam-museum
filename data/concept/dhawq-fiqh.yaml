id: concept/dhawq-fiqh
class: concept
kind: legal
label:
  ar: "الذوق ⁦(في الفقه)⁩"
  en: "Taste (dhawq) in the rulings: fasting, injury to it, and oaths"
  ur: "ذوق ⁦(فقہی احکام: روزہ، جنایت اور قسم)⁩"
  es: "Gusto (dhawq) en las normas: ayuno, daño al mismo y juramentos."
  fr: "Goût (dhawq) dans les décisions: jeûne, atteinte à celui-ci et serments"
summary:
  ar: "الذوق إدراك طعم الشيء بواسطة الرطوبة المنبثة بالعصب المفروش على عضل اللسان، وهو أحد الحواس الخمس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} لا يبطل الصوم بذوق الطعام ما لم يصل إلى الجوف، والأفضل تجنبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} وفي إذهاب الذوق بالجناية دية كاملة باتفاق، واختلفوا في القصاص فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} وفي اليمين: من حلف ألا يذوق فأكل أو شرب حنث، ومن حلف ألا يأكل أو يشرب فذاق لم يحنث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501}"
  en: "Dhawq is perceiving the taste of a thing through the moisture spread on the nerve over the tongue; it is one of the five senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} Tasting food does not break the fast unless it reaches the body inside, though it is better avoided. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} For injury that takes away taste a full diya is due by agreement; the schools differ on retaliation for it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} In oaths, one who swears not to taste and then eats or drinks breaks the oath, while one who swears not to eat or drink and then tastes does not, because all eating is tasting but not every tasting is eating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501}"
  ur: "ذوق زبان کے عصب سے طعم کا ادراک ہے، اور یہ پانچ حواس میں سے ایک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} ذائقہ چکھنے سے روزہ نہیں ٹوٹتا جب تک چیز پیٹ تک نہ پہنچے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501}"
  es: "Dhawq es percibir el sabor de algo a través de la humedad que se extiende por el nervio sobre la lengua; es uno de los cinco sentidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} Probar la comida no rompe el ayuno a menos que llegue al interior del cuerpo, aunque es mejor evitarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} Por una lesión que quita el gusto se debe, por acuerdo, una diya completa; las escuelas difieren en cuanto a la represalia por ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} En los juramentos, quien jura no probar y luego come o bebe rompe el juramento, mientras que quien jura no comer ni beber y luego prueba no lo hace, porque todo comer es probar, pero no todo probar es comer. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501}"
  fr: "Le dhawq est la perception du goût d'une chose par l'humidité répartie sur le nerf de la langue; c'est l'un des cinq sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} Goûter un aliment ne rompt pas le jeûne, sauf s'il est ingéré, bien qu'il soit préférable de l'éviter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} Pour une blessure qui altère le goût, une diya complète est due d'un commun accord; les écoles divergent quant à la riposte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501} Dans les serments, celui qui jure de ne pas goûter et mange ou boit ensuite rompt son serment, tandis que celui qui jure de ne pas manger ni boire et goûte ensuite ne le rompt pas, car manger implique de goûter, mais goûter n'implique pas nécessairement manger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8501}"
