label:
  ar: القلاع والقروح الخبيثة
  en: Thrush and the malignant ulcers
  fr: "Le muguet et les ulcères malins"
  ur: قلاع اور خبیث زخم
  es: "Candidiasis oral y úlceras malignas"
  tr: "Kaleler ve kötü huylu yaralar"
  id: "Kastil dan luka ganas"
summary:
  ar: القلاع قرحة تتكون في جلدة الفم واللسان مع انتشار واتساع وقد يعرض للصبيان كثيراً بل أكثر ما يعرض لهم إنما يعرض لرداءة اللبن أو سوء انهضامه في المعدة، وقد يعرض من كل خلط فالأبيض من بلغم مالح في الأكثر والأصفر صفراوي ويكون أشد تلهباً من غيره والأسود سوداوي والأحمر الناصع دموي وأخبث الجميع السوداوي، وقد يكون من أصنافه ما هو شديد التأكل ومنه ما هو أمكن وقد يكون مع ورم أو مفرداً، ومن عادة جالينوس أن يسميها قلاعاً ما دامت في السطح فإذا تعفنت وغاصت لم يسمها قلاعاً بل قروحاً خبيثة وهي التي تحتاج إلى أدوية كاوية ⁦(عادة منسوبة إلى جالينوس)⁩ وقد يكثر القلاع إذا كثرت الأمطار ويكثر في الحميات الوبائية، وعلاجه استفراغ الخلط الغالب ثم من العضو واستعمال الأدوية البثرية بالقوي للقوي والمعتدل للمعتدل والضعيف للضعيف ومراعاة السن وللصبيان أدوية أضعف وإصلاح لبنهم {cite:canon-ibn-sina-print-v2 p.262} {cite:canon-ibn-sina-print-v2 p.263}
  en: 'Thrush is an ulcer forming in the skin of the mouth and tongue with spreading and widening; it occurs much in children — most of what occurs in them occurs for bad milk or its bad digestion in the stomach. It may come from every humour: the white mostly salty phlegm, the yellow bilious and the most inflamed, the black melancholic — the worst of all — and the bright-red sanguine. Some kinds corrode much, some are contained; it may come with a tumour or singly. Galen''s custom is to call it thrush while it stays in the surface, and when it putrefies and sinks he calls it not thrush but hidden malignant ulcers needing caustic drugs (a habit ascribed to Galen). Thrush grows common when rains are many, and in the epidemic fevers. Its treatment evacuates the dominant humour, then from the organ, and uses the pustule-medicines — the strong for the strong, the moderate for the moderate, the weak for the weak — with age regarded, children having weaker drugs and their milk rectified (the recipes, drug names and vein sites left out) {cite:canon-ibn-sina-print-v2 p.262} {cite:canon-ibn-sina-print-v2 p.263}'
  fr: "Dans le Canon, le muguet est un ulcère qui se forme dans le revêtement de la bouche et de la langue, s’étend et s’élargit. Il est fréquent chez les enfants, le plus souvent à cause d’un lait de mauvaise qualité ou de sa mauvaise digestion dans l’estomac. Il peut provenir de toute humeur : le blanc surtout de la pituite salée ; le jaune, bilieux, est le plus enflammé ; le noir, mélancolique, est le pire de tous ; le rouge vif est sanguin. Certaines formes sont très corrosives, d’autres restent circonscrites. Le muguet peut s’accompagner d’une tuméfaction ou survenir seul. Galien l’appelle muguet tant qu’il reste en surface. Quand il se putréfie et s’enfonce, il parle plutôt d’ulcères malins cachés, qui demandent des remèdes caustiques (usage attribué à Galien). Le muguet devient fréquent lorsque les pluies abondent et lors des fièvres épidémiques. Le traitement décrit évacue l’humeur dominante du corps puis de l’organe et recourt aux remèdes contre les pustules, forts pour les formes fortes, modérés pour les formes modérées et faibles pour les formes faibles. Il tient compte de l’âge : les enfants reçoivent des remèdes plus faibles et leur lait est corrigé (les recettes, les noms de remèdes et les sites de saignée ne sont pas reproduits) {cite:canon-ibn-sina-print-v2 p.262} {cite:canon-ibn-sina-print-v2 p.263}"
  ur: 'قلاع ایک زخم ہے جو منہ اور زبان کی کھال میں پھیلتے اور وسیع ہوتے ہوئے بنتا ہے؛ لڑکوں میں بہت ہوتا ہے اور ان میں جو کچھ ہوتا ہے اس کا اکثر سبب خراب دودھ یا معدہ میں اس کا خراب ہضم ہونا ہے؛ یہ ہر خلط سے ہو سکتا ہے: سفید اکثر نمکین بلغم سے، زرد صفراوی اور سب سے زیادہ بھڑکنے والا، سیاہ سوداوی — سب سے خبیث — اور تازہ سرخ دموی؛ بعض اقسام بہت کھاتی ہیں بعض محدود رہتی ہیں؛ ورم کے ساتھ بھی ہو سکتا ہے اور تنہا بھی؛ جالینوس کی عادت ہے کہ جب تک سطح پر رہے اسے قلاع کہے اور جب بوسیدہ ہو کر دھنس جائے تو قلاع نہیں بلکہ خبیث غائب زخم کہے جنہیں جلانے والی ادویہ چاہیے ⁦(جالینوس سے منسوب عادت)⁩؛ بارشیں بڑھنے پر اور وبائی بخاروں میں قلاع بڑھتا ہے؛ علاج میں پہلے غالب خلط کا استفراغ پھر عضو سے، اور دانوں کی ادویہ قوی کو قوی، معتدل کو معتدل اور کمزور کو کمزور سے، عمر کی رعایت کے ساتھ، بچوں کی ادویہ کمزور اور ان کا دودھ درست کیا جائے ⁦(نسخے، ادویہ کے نام اور رگ کے مقامات مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.262} {cite:canon-ibn-sina-print-v2 p.263}'
  es: "La candidiasis oral es una úlcera que se forma en la piel de la boca y la lengua, extendiéndose y ensanchándose progresivamente. Es muy común en niños, principalmente debido a la ingesta de leche en mal estado o a una mala digestión. Puede ser causada por cualquiera de los humores: la flema blanca, mayormente salada; la biliosa amarilla, la más inflamada; la melancólica negra, la más grave; y la sanguínea, de color rojo brillante. Algunos tipos corroen mucho, otros son localizados; puede presentarse con un tumor o de forma aislada. Galeno solía llamarla candidiasis oral mientras permanecía en la superficie, y cuando se pudría y se hundía, la denominaba úlcera maligna oculta que requería medicamentos cáusticos (una costumbre atribuida a Galeno). La candidiasis oral se vuelve frecuente durante las lluvias abundantes y las epidemias de fiebre. Su tratamiento consiste en evacuar el humor dominante del órgano y utilizar medicamentos para las pústulas: los fuertes para los fuertes, los moderados para los moderados y los débiles para los débiles, teniendo en cuenta la edad; a los niños se les administran fármacos más suaves y se les rectifica la leche (se omiten las recetas, los nombres de los fármacos y los puntos de punción). {cite:canon-ibn-sina-print-v2 p.262} {cite:canon-ibn-sina-print-v2 p.263}"
  tr: "Tırtılcıklar, ağız ve dil derisinde yayılma ve genişleme ile oluşan ülserdir. Erkeklerde sıkça yaygındır ve çoğunlukla kötü süt veya mide sindiriminin kötü olması nedeniyle ortaya çıkar. Herhangi bir karışımdan kaynaklanabilir: beyaz çoğunlukla tuzlu balgamdır, sarı safra ve diğerlerinden daha ateşlidir, siyah siyahtır ve parlak kırmızı kanlı ve en kötü huyludur. Bazı çeşitleri oldukça aşındırıcı olabilir, bazıları daha fazla olabilir ve bazıları tümörlü veya tek başına olabilir. Galen'de yaygındır Yüzeyde oldukları sürece onlara kale demeli, çürüyüp batarlarsa, kale değil, aşındırıcı ilaçlar gerektiren kötü huylu yaralar denir (genellikle Galen'e atfedilir). Yağmur bol yağıyorsa kale artabilir ve salgın ateşlerde tedavi, baskın humor kusmayı ve ardından organdan kusmayı, güçlüler için ılımlı, zayıflar için ılımlı, yaş ve erkek çocuklar için zayıf ilaçlar ve sütlerini onarmayı içerir {cite:canon-ibn-sina-print-v2 s.262} {cite:canon-ibn-sina-print-v2 s.263}"
  id: "Larva adalah borok yang berkembang dengan penyebaran dan ekspansi pada kulit mulut dan lidah. Ular ini umum terjadi pada manusia dan sebagian besar terjadi akibat susu yang buruk atau pencernaan lambung yang buruk. Bisa terjadi akibat campuran apa pun: putih sebagian besar dahak asin, empedu kuning lebih menyala dari yang lain, hitam dan merah terang dengan darah, dan merupakan yang paling ganas. Beberapa varietas bisa sangat korosif, beberapa lebih parah, dan beberapa mungkin tumor atau solitari. Umum pada Galen Selama mereka berada di permukaan, mereka harus disebut benteng; jika membusuk dan tenggelam, mereka disebut luka ganas yang memerlukan obat abrasif daripada penguatan (sering dikaitkan dengan Galen). Jika hujan deras, kastil dapat meningkat, dan pengobatan demam epidemi meliputi muntah dengan humor dominan diikuti dengan muntah organ, obat sedang untuk yang kuat, sedang untuk yang lemah, dan obat lemah untuk anak muda dan laki-laki serta memperbaiki ASI mereka. {cite:canon-ibn-sina-print-v2 hlm.262} {cite:canon-ibn-sina-print-v2 hlm.263} {cite:canon-ibn-sina-print-v2 hlm.263}"
