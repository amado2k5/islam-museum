  en: "Hamar (the ass)"
  ur: "حمار ⁦(گدھا)⁩"
  es: "Hamar (el asno)"
summary:
  ar: "الحمار وحشي وغير وحشي. رماد لحمه وكبده بالزيت نافع للتشقّق من البرد، ورماد كبده بالزيت على الخنازير. ويذكر الكتاب أن كبده المشوية تنفع من الصرع، وأن بوله ينفع من وجع الكلى، وأن بول الوحشي يفتّت الحصاة في المثانة. والجرعات متروكة."
  en: "The ass comes wild and tame. Ash of its flesh and liver with oil is good for cracked skin from cold, and ash of its liver with oil is used on scrofula. The book says its roasted liver helps epilepsy, its urine helps kidney pains, and the urine of the wild ass breaks bladder stone. Doses are left out."
  ur: "گدھا جنگلی بھی ہوتا ہے اور پالتو بھی۔ اس کے گوشت اور جگر کی راکھ تیل کے ساتھ سردی سے پھٹی جلد میں مفید ہے، اور جگر کی راکھ تیل کے ساتھ غدودی سوجن ⁦(خنازیر)⁩ پر۔ کتاب کہتی ہے کہ اس کا بھنا ہوا جگر مرگی میں مفید ہے، اس کا پیشاب گردے کے درد میں مفید ہے، اور جنگلی گدھے کا پیشاب مثانے کی پتھری توڑتا ہے۔ خوراکیں چھوڑ دی گئی ہیں۔"
  es: "El asno es salvaje y manso. La ceniza de su carne e hígado con aceite es buena para la piel agrietada por el frío, y la ceniza de su hígado con aceite se usa para la escrófula. El libro dice que su hígado asado ayuda con la epilepsia, su orina alivia los dolores renales y la orina del asno salvaje disuelve los cálculos de la vejiga. Las dosis no se especifican."
