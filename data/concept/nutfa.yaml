label: { ar: "النُّطْفَة", en: "Nutfa (seminal drop)", ur: "نطفہ" }
summary:
  ar: "النطفة في اللغة ماء الرجل والمرأة، وتطلق على القليل من الماء، وهي أول مراحل الجنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} ولا تنقضي بها العدة عند جمهور الفقهاء لأنها لا تثبت ولداً ولا حملاً، وتفصيل ذلك في مصطلح العدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} وإسقاط النطفة قبل نفخ الروح مختلف فيه، والإسقاط بعد النفخ محرم باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} ولا شيء على الجاني إذا ألقت المرأة بسببه نطفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
  en: "Nutfa, in the lexicon, is the fluid of a man or a woman, and also a small quantity of water; it is the first stage of the foetus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} Most jurists hold that a waiting period does not end by a nutfa, since it is not proven to be a child or a pregnancy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} Jurists differ on expelling a nutfa before ensoulment; all forbid expelling a foetus after ensoulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} If an injury causes a woman to expel a nutfa, the aggressor owes nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
  ur: "نطفہ لغت میں مرد اور عورت کے پانی کو کہتے ہیں، اور تھوڑے پانی کو بھی۔ یہ جنین کا پہلا مرحلہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} جمہور فقہاء کے نزدیک نطفہ سے عدت ختم نہیں ہوتی، کیونکہ وہ نہ بچہ ثابت ہوتا ہے اور نہ حمل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} نفخِ روح سے پہلے نطفہ گرانے کے بارے میں اختلاف ہے، جبکہ نفخِ روح کے بعد حمل گرانا حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} کسی زیادتی سے عورت کا نطفہ ساقط ہو جائے تو جانی پر کوئی ضمان نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
