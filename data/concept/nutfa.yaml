label: { ar: "النُّطْفَة", en: "Nutfa (seminal drop)", ur: "نطفہ", es: "Nutfa (gota seminal)", fr: "Nutfa (goutte séminale)", tr: "sperm", id: "sperma" }
summary:
  ar: "النطفة في اللغة ماء الرجل والمرأة، وتطلق على القليل من الماء، وهي أول مراحل الجنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} ولا تنقضي بها العدة عند جمهور الفقهاء لأنها لا تثبت ولداً ولا حملاً، وتفصيل ذلك في مصطلح العدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} وإسقاط النطفة قبل نفخ الروح مختلف فيه، والإسقاط بعد النفخ محرم باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} ولا شيء على الجاني إذا ألقت المرأة بسببه نطفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
  en: "Nutfa, in the lexicon, is the fluid of a man or a woman, and also a small quantity of water; it is the first stage of the foetus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} Most jurists hold that a waiting period does not end by a nutfa, since it is not proven to be a child or a pregnancy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} Jurists differ on expelling a nutfa before ensoulment; all forbid expelling a foetus after ensoulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} If an injury causes a woman to expel a nutfa, the aggressor owes nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
  ur: "نطفہ لغت میں مرد اور عورت کے پانی کو کہتے ہیں، اور تھوڑے پانی کو بھی۔ یہ جنین کا پہلا مرحلہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} جمہور فقہاء کے نزدیک نطفہ سے عدت ختم نہیں ہوتی، کیونکہ وہ نہ بچہ ثابت ہوتا ہے اور نہ حمل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} نفخِ روح سے پہلے نطفہ گرانے کے بارے میں اختلاف ہے، جبکہ نفخِ روح کے بعد حمل گرانا حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} کسی زیادتی سے عورت کا نطفہ ساقط ہو جائے تو جانی پر کوئی ضمان نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
  es: "Nutfa, en el léxico, es el fluido de un hombre o una mujer, y también una pequeña cantidad de agua; es la primera etapa del feto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} La mayoría de los juristas sostienen que un período de espera no termina con una nutfa, ya que no se prueba que sea un niño o un embarazo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} Los juristas difieren sobre la expulsión de una nutfa antes de la infusión del alma; todos prohíben la expulsión de un feto después de la infusión del alma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} Si una lesión hace que una mujer expulse un nutfa, el agresor no debe nada. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
  fr: "Dans le lexique, le terme « nutfa » désigne les fluides corporels d'un homme ou d'une femme, ainsi qu'une petite quantité d'eau; il s'agit du premier stade du développement fœtal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} La plupart des juristes estiment que le délai d'attente ne prend pas fin avec l'expulsion d'un « nutfa », car il n'est pas prouvé qu'il s'agisse d'un enfant ou d'une grossesse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} Les juristes divergent quant à l'expulsion d'un « nutfa » avant l'animation; tous interdisent l'expulsion d'un fœtus après l'animation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758} Si une blessure amène une femme à expulser un nutfa, l'agresseur ne doit rien. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
  tr: "Dilde 'naffa' hem erkeklerin hem kadınların suyunu ifade eder, az miktarda suyu ifade eder ve fetüsün ilk evresidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15758} Çoğu hukukçuya göre bekleme süresi sona ermemiştir çünkü çocuk veya gebelik kanıtlamaz. Bu, 'iddah' teriminde detaylandırılmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15758} Ruh solulmadan önce spermin kürtajı tartışmalıdır ve nefes sonrası kürtaj oybirliğiyle yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15758} Ve kadın onun yüzünden sperm verirse, suçluya hiçbir şey düşmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15758}"
  id: "Dalam bahasa tersebut, 'naffa' merujuk pada air baik pria maupun wanita, dan merujuk pada sejumlah kecil air, dan ini adalah tahap pertama janin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15757} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15758} Masa tunggu tidak berakhir menurut mayoritas ahli hukum karena tidak menetapkan adanya anak atau kehamilan. Hal ini dijelaskan dalam istilah 'iddah'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15758} Aborsi sperma sebelum jiwa dihembuskan masih diperdebatkan, dan aborsi setelah bernapas dilarang secara bulat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15758} Dan tidak ada hukum atas pelaku jika wanita menyerahkan sperma karena dirinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15758}"
