summary:
  ar: "منى بليدة قرب مكة يؤدي فيها الحجاج رمي الجمار وذبح الهدي والحلق أو التقصير، وهي موضع المبيت ليالي أيام التشريق. وجمهور الفقهاء على وجوب المبيت بها، وخالف الحنفية فجعلوه سنة، ولهم شروط ورخص، ويستحب فيها الإكثار من الذكر."
  en: "Mina is a town a few miles from Mecca where pilgrims stone the pillars, slaughter the offering, shave or trim the hair, and spend the nights of the days of tashriq. The majority hold the night spent there obligatory and pay a fine for leaving it; the Hanafis call it a sunna. It has conditions, excuses and recommended acts."
  ur: "منیٰ مکہ کے قریب ایک بستی ہے جہاں حاجی رمی جمار، قربانی، حلق یا تقصیر کرتے ہیں اور ایام تشریق کی راتیں گزارتے ہیں۔ جمہور کے نزدیک یہ راتیں گزارنا واجب ہے، جبکہ حنفیہ کے نزدیک سنت۔"
