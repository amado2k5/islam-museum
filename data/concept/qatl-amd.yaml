- tradition: sunni
  id: sunni-ibn-abbas-reported
  stance:
    ar: "أجاب ابن عباس مرة بأنه لا توبة لقاتل العمد، ومرة بأن له توبة، والفرق بحال السائل"
    en: "Ibn Abbas first said there is no repentance for a wilful killer and later that there is, the difference lying in the questioner's state"
  summary:
    ar: "ينقل الشعراوي أن ابن عباس قال لمن سأله قبل أن يقع القتل إنه لا توبة له، وقال لمن سأله بعد أن قتل إن له توبة، وعلّل ذلك بأن الأول أراد القتل فأرهبه، والثاني قتل بالفعل فلم يُقنطه من رحمة ربه {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2550}. ولم يذكر الشعراوي سنداً أو مصدراً لهذه الروايتين في هذا الموضع (needs_source)."
    en: "Sha'rawi reports that Ibn Abbas told a questioner who asked before a killing that there was no repentance, and told one who asked after a killing that there was, explaining that the first was intent on killing and was frightened, while the second had killed and was not made to despair of his Lord's mercy {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2550}. He gives no chain or named book for these two answers at this point (needs_source)."
