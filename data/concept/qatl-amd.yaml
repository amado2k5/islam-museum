perspectives:
- tradition: sunni
  id: sunni-sharawi-no-expiation
  stance:
    ar: "جزاؤه جهنم ولا كفارة له، والتعمّد أن يغيب الله عن باله حين يدبّر القتل"
    en: "The penalty is Jahannam with no expiation; wilfulness means that God was absent from his mind while he planned the killing"
  summary:
    ar: "يرى الشعراوي أن قتل المؤمن عمداً جزاؤه جهنم ولا كفارة له، وأن التعمد يعني أن القاتل عاش فكرة القتل في تخيله ثم فعله، فغاب عن باله الوازع الديني، ومن غاب عن باله الله غيّبه عن رحمته {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2549}. ويذكر قصة مقيس بن ضبابة، وأن النبي أهدر دمه ثم أمر بقتله يوم الفتح حين وُجد متعلقاً بأستار الكعبة {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2549}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2550}. وهذا رأيه في موضع تفسيره."
    en: "Sha'rawi holds that wilful killing of a believer is punished by Jahannam with no expiation; wilfulness means the killer lived the idea of the killing in his imagination before doing it, so his inner restraint was absent, and whoever is absent from God's mind is absent from His mercy {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2549}. He tells the story of Miqyas ibn Dubaba, whose blood the Prophet declared lawful to shed and who was ordered killed at the conquest when found holding the Ka'ba's curtains {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2549}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2550}. This is his view at this point in the commentary."
