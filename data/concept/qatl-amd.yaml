- tradition: academic
  id: academic
  stance:
    ar: "لم يُعرض بعد"
    en: "Not yet set out"
  summary:
    ar: "لم تُضف بعد أقوال الفقهاء والمفسرين في توبة القاتل عمداً من مصدر محدد، ولم يسمِّ الشعراوي العلماء الذين اختلفوا (needs_source)."
    en: "The views of jurists and exegetes on the repentance of a wilful killer have not been added from a named source, and Sha'rawi does not name the scholars who disagreed (needs_source)."
  sources: []
- tradition: other
  id: amr-ibn-ubayd-reported
  stance:
    ar: "لا توبة لقاتل العمد، ثم رجع عنه بعد رؤيا"
    en: "No repentance for a wilful killer; later he was moved to reconsider after a vision"
  summary:
    ar: "يروي الشعراوي عن قيس بن أنس أن عمرو بن عبيد كان يقول إن قاتل العمد لا توبة له، ثم رأى في منامه أنه يُسأل عن ذلك يوم القيامة، فعدّ الشعراوي ذلك إشارة إلى أن للقاتل توبة، ونقل أن قيس بن أنس قال إنه لم يجد جواباً عندما احتج بالآية {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2552}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2553}. ولم يذكر الشعراوي مرجع عمرو بن عبيد في هذه الحكاية، فلم يُعرف مذهبه من مصدر محدد (needs_source)."
    en: "Sha'rawi reports, through Qays ibn Anas, that Amr ibn Ubayd held that a wilful killer has no repentance, and that he then saw in a dream that he would be questioned about this on the Day of Judgement; Sha'rawi reads this as a sign that the killer has repentance, and records that Qays had no answer to Amr's reply {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2552}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2553}. Sha'rawi does not give Amr's source for the opinion, so his school is not identified here (needs_source)."
