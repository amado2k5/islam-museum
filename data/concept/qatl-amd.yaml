label:
  ar: قتل المؤمن عمداً
  en: Wilful killing of a believer
summary:
  ar: "يبيّن الشعراوي في تفسير الآية أن جزاء قتل المؤمن عمداً جهنم، وأنه لا كفارة له، وأن العذاب فيه درجات: الخلود والغضب واللعنة والعذاب العظيم. وينقل أن العلماء اختلفوا في توبة القاتل عمداً، وأن ابن عباس أجاب بجوابين مختلفين بحسب حال السائل {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2549}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2550}."
  en: "In his commentary on the verse about wilful killing of a believer, Sha'rawi says the penalty is Jahannam with no expiation, and that the punishment has grades: eternity in the fire, God's wrath and curse, and a great chastisement. He reports that scholars disagreed about whether a wilful killer can repent, and that Ibn Abbas gave two different answers according to the questioner's state {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2549}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2550}."
