label:
  ar: "إراقة"
  en: "Iraqa (shedding: the blood of sacrificial animals, lawful and unlawful bloodshed, and of impurities)"
  ur: "اراقہ ⁦(بہانا: قربانی کا خون، جائز اور ناجائز خونریزی، اور نجاستیں)⁩"
  es: "Iraqa (derramamiento: la sangre de los animales sacrificados, el derramamiento de sangre lícito e ilícito y las impurezas)"
  fr: "Iraqa (effusion: le sang des animaux sacrificiels, l'effusion de sang licite et illicite, et des impuretés)"
  tr: "Dökülme"
  id: "Tumpahan"
summary:
  ar: "الإراقة في الفقه الصب، وأشهر استعمالها إراقة دم الأنعام قربة في الهدي والأضحية والعقيقة، ولا يقوم غيرها مقامها. وتباح إراقة الدم لدفع الصيال وقصاصا وحدا وفي القتال، وتحرم بغير حق، ويطلب إتلاف النجاسات، ويعبر عن إراقة المني بالعزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2088}"
  en: "In law, iraqa is pouring out. Its best-known use is shedding the blood of animals as an act of worship in the offering, the sacrifice and the aqiqa, which nothing else can replace. Bloodshed is permitted to repel an aggressor, for retaliation and the prescribed penalties, and in fighting; it is forbidden without right. Impurities are to be destroyed, and pouring out semen outside the vagina is called coitus interruptus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2088}"
  ur: "فقہ میں اراقہ بہانے کو کہتے ہیں، اور اس کا سب سے مشہور استعمال مویشیوں کا خون بہانا ہے جو ہدی، قربانی اور عقیقہ میں عبادت ہے اور جس کی جگہ کوئی اور چیز نہیں لے سکتی۔ دفعِ صیال، قصاص، حد اور جنگ میں خون بہانا مباح ہے، اور بغیر حق حرام ہے؛ نجاست کو ضائع کرنا مطلوب ہے، اور عزل کو منی بہانے کے معنی میں لیا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2088}"
  es: "En derecho, iraqa significa derramar. Su uso más conocido es el derramamiento de sangre de animales como acto de culto en la ofrenda, el sacrificio y la aqiqa, que nada más puede reemplazar. El derramamiento de sangre está permitido para repeler a un agresor, como represalia y para las penas prescritas, y en la lucha; está prohibido sin justificación. Las impurezas deben ser destruidas, y derramar semen fuera de la vagina se denomina coitus interruptus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2088}"
  fr: "En droit, l'iraqa signifie « versement ». Son usage le plus connu est l'effusion du sang d'animaux comme acte d'adoration lors de l'offrande, du sacrifice et de l'aqiqa, actes irremplaçables. L'effusion de sang est permise pour repousser un agresseur, pour la vengeance et l'application des peines prescrites, ainsi que lors des combats; elle est interdite sans raison valable. Les impuretés doivent être détruites, et l'éjaculation hors du vagin est appelée coït interrompu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2088}"
  tr: "Fıkıhta, kan dökmek, hayvan kanının bir kurban, kurban ve akikah biçimi olarak dökülmesidir ve başka hiçbir yöntem bunun yerini tutamaz. Kurbanlardan, misillemeden ve savaştan kaçınmak için kan dökmek caizdir, ancak haksız olarak yasaktır, kirlerin yok edilmesini gerektirir ve meninin izole olarak dökülmesini ifade eder. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2088}"
  id: "Dalam hukum, pertumpahan darah adalah penumpahan darah ternak sebagai bentuk pengorbanan, pengorbanan, dan aqiqah, dan tidak ada cara lain yang dapat menggantikannya. Diperbolehkan menumpahkan darah untuk menghindari pengorbanan, pembalasan, dan dalam pertarungan, tetapi dilarang tanpa hak, memerlukan penghancuran kotoran, dan merujuk pada penghapusan sperma secara terpisah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2087} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.2088}"
