label:
  ar: "إراقة"
  en: "Iraqa (shedding: the blood of sacrificial animals, lawful and unlawful bloodshed, and of impurities)"
  ur: "اراقہ (بہانا: قربانی کا خون، جائز اور ناجائز خونریزی، اور نجاستیں)"
summary:
  ar: "الإراقة في الفقه الصب، وأشهر استعمالها إراقة دم الأنعام قربة في الهدي والأضحية والعقيقة، ولا يقوم غيرها مقامها. وتباح إراقة الدم لدفع الصيال وقصاصا وحدا وفي القتال، وتحرم بغير حق، ويطلب إتلاف النجاسات، ويعبر عن إراقة المني بالعزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2088}"
  en: "In law, iraqa is pouring out. Its best-known use is shedding the blood of animals as an act of worship in the offering, the sacrifice and the aqiqa, which nothing else can replace. Bloodshed is permitted to repel an aggressor, for retaliation and the prescribed penalties, and in fighting; it is forbidden without right. Impurities are to be destroyed, and pouring out semen outside the vagina is called coitus interruptus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2088}"
  ur: "فقہ میں اراقہ بہانے کو کہتے ہیں، اور اس کا سب سے مشہور استعمال مویشیوں کا خون بہانا ہے جو ہدی، قربانی اور عقیقہ میں عبادت ہے اور جس کی جگہ کوئی اور چیز نہیں لے سکتی۔ دفعِ صیال، قصاص، حد اور جنگ میں خون بہانا مباح ہے، اور بغیر حق حرام ہے؛ نجاست کو ضائع کرنا مطلوب ہے، اور عزل کو منی بہانے کے معنی میں لیا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2088}"
