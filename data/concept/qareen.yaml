summary:
  ar: "القرين في الحديث ما وُكل بكل إنسان من الجن؛ روى مسلم «ما منكم من أحد إلا وقد وكل به قرينه من الجن» {cite:sahih-muslim}."
  en: "The qareen in hadith is the jinn companion assigned to every person; Muslim reports 'there is not one of you but is assigned a qareen from the jinn' {cite:sahih-muslim}."
  es: "El qareen en hadiz es el compañero jinn asignado a cada persona; Muslim informa que \"no hay uno de vosotros que no tenga asignado un qareen de entre los jinn\" {cite:sahih-muslim}."
  fr: "Le qareen dans les hadiths est le djinn compagnon assigné à chaque personne; Muslim rapporte: « Il n'y a pas un seul d'entre vous qui n'ait un qareen assigné parmi les djinns » {cite: sahih-muslim}."
  ur: "حدیث میں قرین ہر شخص کے لیے متعین جنوں کا ساتھی ہے۔ مسلم کا بیان ہے کہ تم میں سے کوئی ایسا نہیں ہے جسے جنات میں سے کوئی قرین مقرر کیا گیا ہو۔"
  tr: "Hadisteki sahabe, cinler arasında her insanı emanet eden biri değildir; Müslüm şöyle anlatmıştır: \"Aranızda tek bir kişi yoktur, cinden gelen yoldaşı emanet edilendir.\" {alıntı:sahih-müslim}."
  id: "Sahabat dalam hadits bukanlah orang yang mempercayakan setiap manusia di antara jin; Muslim menceritakan: \"Tidak ada satu pun di antara kalian kecuali dia telah dipercayakan kepada sahabatnya dari jin.\" {cite:sahih-muslim}."
