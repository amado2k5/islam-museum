summary:
  ar: "قراءة الشيخ عمر عبد الكافي لسورة العصر بوصفها ميزانا للربح والخسارة في عمر الإنسان: الإنسان في خسارة إلا من جمع الإيمان والعمل الصالح والدعوة إلى الحق والصبر، ويقارنها بسورة الضحى."
  en: "Sheikh Omar Abdelkafy's reading of Sura al-Asr as a measure of gain and loss in a person's life: a person is in loss unless he combines faith, righteous deeds, the call to truth and patience; he compares it with Sura al-Duha."
  ur: "شیخ عمر عبدالکافی کی سورۃ العصر کی قرأت، جو انسان کی زندگی میں نفع اور نقصان کا پیمانہ ہے: انسان خسارے میں ہے سوائے اس کے جو ایمان، نیک عمل، حق کی نصیحت اور صبر کو جمع کرے؛ وہ اس کا موازنہ سورۃ الضحیٰ سے کرتے ہیں۔"
