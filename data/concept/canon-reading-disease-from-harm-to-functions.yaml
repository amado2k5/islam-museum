id: concept/canon-reading-disease-from-harm-to-functions
class: concept
kind: scientific
label:
  ar: "الاستدلال من مضار الأفعال عند ابن سينا"
  en: "Reading disease from harm to functions in the Canon"
  fr: "Reconnaître la maladie par l’atteinte des fonctions dans le Canon"
  ur: "افعال کے ضرر سے استدلال، قانون کے مطابق"
  es: "Interpretación de la enfermedad desde el daño hasta las funciones en el Canon"
  tr: "İbn Sina'ya göre eylemlerin zararlarından çıkarım"
  id: "Inferensi dari kerugian tindakan menurut Ibn Sina"
summary:
  ar: "يقول ابن سينا إن العضو إذا لم يجر فعله على المجرى الطبيعي دل على أن القوة أصابتها آفة، وآفة القوة تتبع مرضاً في العضو، ومضار الأفعال ثلاثة وجوه: النقص والتغير والبطلان {cite:canon-ibn-sina-print-v1 pp.156-157}."
  en: "Ibn Sina says that when an organ's function does not run its natural course, the faculty has been struck, and harm to a faculty follows disease in the organ; the harm to functions takes three forms: diminished, altered and abolished {cite:canon-ibn-sina-print-v1 pp.156-157}."
  fr: "Pour Ibn Sina, une fonction organique qui ne suit plus son cours naturel indique une faculté atteinte, elle-même consécutive à une maladie de l’organe ; l’atteinte fonctionnelle est diminution, altération ou abolition {cite:canon-ibn-sina-print-v1 pp.156-157}."
  es: "Ibn Sina dice que cuando la función de un órgano no sigue su curso natural, la facultad se ha visto afectada, y el daño a una facultad sigue a la enfermedad en el órgano; el daño a las funciones toma tres formas: disminuida, alterada y abolida {cite:canon-ibn-sina-print-v1 pp.156-157}."
  ur: "ابن سینا کا کہنا ہے کہ جب کسی عضو کا فعل اپنا فطری عمل نہیں کرتا ہے تو فیکلٹی کو نقصان پہنچا ہے، اور عضو میں بیماری کے بعد فیکلٹی کو نقصان پہنچتا ہے۔ افعال کو پہنچنے والے نقصان کی تین صورتیں ہوتی ہیں: گھٹا ہوا، تبدیل شدہ اور ختم کر دیا گیا"
  tr: "İbn Sina, eğer uzuv doğal olarak hareket etmezse, bu kuvvetin onu bir kusurla etkilediğini ve kuvvetin hastalığının uzuvdaki bir hastalığı takip ettiğini gösterir. Eylemlerin zararlarının üç yönü vardır: eksiklik, değişim ve geçersizlik {cite:canon-ibn-sina-print-v1 s.156-157}."
  id: "Ibn Sina mengatakan bahwa jika anggota tubuh tidak bertindak secara alami, itu menunjukkan bahwa kekuatan telah menyebabkan cacat, dan gangguan kekuatan itu mengikuti penyakit pada anggota tubuh. Kerugian dari tindakan memiliki tiga aspek: kekurangan, perubahan, dan kebatalan {cite:canon-ibn-sina-print-v1 hlm.156-157}."
