summary:
  ar: "يقول ابن سينا إن العضو إذا لم يجر فعله على المجرى الطبيعي دل على أن القوة أصابتها آفة، وآفة القوة تتبع مرضاً في العضو، ومضار الأفعال ثلاثة وجوه: النقص والتغير والبطلان {cite:canon-ibn-sina-print-v1 pp.156-157}."
  en: "Ibn Sina says that when an organ's function does not run its natural course, the faculty has been struck, and harm to a faculty follows disease in the organ; the harm to functions takes three forms: diminished, altered and abolished {cite:canon-ibn-sina-print-v1 pp.156-157}."
