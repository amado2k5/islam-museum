id: concept/suhuf-al-amal
class: concept
kind: belief
label:
  ar: "الصحف وأخذ الكتاب"
  en: "The scrolls and the handing of the record"
  ur: "صحائف اور کتاب دینا"
summary:
  ar: "تُنشر الصحف يوم القيامة وتطاير بين أيدي أصحابها: فمن أوتي كتابه بيمينه فحساب يسير ومرجع مسرور، ومن أوتيه بشماله أو وراء ظهره فحساب عسير ومصير سعير {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}."
  en: "The scrolls are spread on the Day and fly into their owners' hands: who is given his record in his right has an easy reckoning and a joyful return; who is given it in his left or behind his back has a hard reckoning and a burning end {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}."
  ur: "قیامت کے دن صحائف کھولے جائیں گے اور اپنے مالکوں کے ہاتھوں میں اڑیں گے: جسے دائیں ہاتھ میں ملے اس کا آسان حساب اور خوشی کی واپسی، جسے بائیں ہاتھ میں یا پیٹھ کے پیچھے ملے اس کا سخت حساب اور دوزخ کا انجام {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}۔"
