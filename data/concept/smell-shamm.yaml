id: concept/smell-shamm
class: concept
kind: legal
label:
  ar: "الشَّمّ"
  en: "Shamm (smelling: its rulings in fasting and pilgrimage, hiring for scent, injury to the sense of smell, and proof of drinking wine)"
summary:
  ar: "الشم إدراك الروائح بحاسة الأنف، ويكون واجبا كشم الشهود فم السكران لمعرفة رائحة الخمر، ومحرما أو مكروها كشم الطيب للمحرم عند من يقول بذلك، ومباحا كشم الزهور المباحة. والحنفية والمالكية يرون أن الصائم إذا أوصل البخور إلى حلقه أفطر، وشم الهواء الذي فيه الورد لا يفطر. وتختلف المذاهب في إجارة الشيء للشم، وفي الجناية على حاسة الشم، ففيها القصاص إن أمكن وإلا الدية الكاملة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10185}"
  en: "Shamm is the perception of scents by the nose. It may be obligatory, as when witnesses smell the mouth of a drunkard to find the smell of wine; forbidden or disliked, as the use of perfume by a pilgrim according to some; or permitted, as the smelling of lawful flowers and perfumes, except that smelling a perfume worn by a foreign woman is forbidden. The Hanafis and Malikis hold that a fasting person who lets incense reach his throat breaks his fast, while smelling air carrying the scent of roses does not. The schools differ on hiring something for its smell and on injury to the sense of smell, where retaliation is due if possible and otherwise full blood money in the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10185}"
