id: concept/smell-shamm
class: concept
kind: legal
label:
  ar: "الشَّمّ"
  en: "Shamm (smelling: its rulings in fasting and pilgrimage, hiring for scent, injury to the sense of smell, and proof of drinking wine)"
  es: "Shamm (olfato: sus normas en el ayuno y la peregrinación, la contratación de perfumados, las lesiones en el sentido del olfato y la prueba de haber bebido vino)"
  fr: "Shamm (l'odorat: ses règles en matière de jeûne et de pèlerinage, de rémunération pour le parfum, d'atteinte à l'odorat et de preuve de consommation de vin)"
  ur: "شمم ⁦(سنگنا: روزے اور حج میں اس کے احکام، خوشبو کے لیے کام کرنا، سونگھنے کی حس کو مجروح کرنا، اور شراب پینے کا ثبوت)⁩"
  tr: "kokmak"
  id: "mencium"
summary:
  ar: "الشم إدراك الروائح بحاسة الأنف، ويكون واجبا كشم الشهود فم السكران لمعرفة رائحة الخمر، ومحرما أو مكروها كشم الطيب للمحرم عند من يقول بذلك، ومباحا كشم الزهور المباحة. والحنفية والمالكية يرون أن الصائم إذا أوصل البخور إلى حلقه أفطر، وشم الهواء الذي فيه الورد لا يفطر. وتختلف المذاهب في إجارة الشيء للشم، وفي الجناية على حاسة الشم، ففيها القصاص إن أمكن وإلا الدية الكاملة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10185}"
  en: "Shamm is the perception of scents by the nose. It may be obligatory, as when witnesses smell the mouth of a drunkard to find the smell of wine; forbidden or disliked, as the use of perfume by a pilgrim according to some; or permitted, as the smelling of lawful flowers and perfumes, except that smelling a perfume worn by a foreign woman is forbidden. The Hanafis and Malikis hold that a fasting person who lets incense reach his throat breaks his fast, while smelling air carrying the scent of roses does not. The schools differ on hiring something for its smell and on injury to the sense of smell, where retaliation is due if possible and otherwise full blood money in the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10185}"
  es: "Shamm es la percepción de olores por la nariz. Puede ser obligatorio, como cuando los testigos huelen la boca de un borracho para percibir el olor a vino; prohibido o desaconsejado, como el uso de perfume por parte de un peregrino según algunos; o permitido, como oler flores y perfumes lícitos, excepto que oler un perfume usado por una mujer extranjera está prohibido. Los hanafíes y los malikíes sostienen que una persona en ayuno que deja que el incienso llegue a su garganta rompe su ayuno, mientras que oler el aire con aroma a rosas no lo hace. Las escuelas difieren en cuanto a alquilar algo por su olor y en cuanto a las lesiones al sentido del olfato, donde se debe tomar represalia si es posible y, de lo contrario, se debe pagar una indemnización completa por la sangre derramada, según la opinión mayoritaria. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10181} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10182} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10183} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10184} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10185}"
  fr: "Le shamm est la perception des odeurs par l'odorat. Il peut être obligatoire, comme lorsque des témoins sentent l'haleine d'un ivrogne pour y déceler une odeur de vin; interdit ou déconseillé, comme l'usage de parfum par un pèlerin selon certains; ou permis, comme le fait de sentir des fleurs et des parfums licites, à l'exception du parfum porté par une femme étrangère, qui est interdit. Les écoles hanafite et malikite considèrent qu'une personne qui jeûne et laisse l'encens atteindre sa gorge rompt son jeûne, tandis que le fait de sentir l'air parfumé aux roses ne le rompt pas. Les écoles divergent quant à la question de la location d'un bien pour son odeur et des atteintes à l'odorat: la vengeance est-elle due si possible, sinon, selon l'avis majoritaire, il faut verser l'intégralité du prix du sang ? {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10185}"
  ur: "شام ناک سے خوشبوؤں کا ادراک ہے۔ یہ واجب ہو سکتا ہے، جیسا کہ جب گواہ شراب کی بو تلاش کرنے کے لیے شرابی کا منہ سونگھتے ہیں۔ حرام یا ناپسندیدہ، جیسا کہ بعض کے نزدیک حجاج کی طرف سے عطر کا استعمال؛ یا حلال پھولوں اور عطروں کو سونگھنے کی اجازت ہے، سوائے اس کے کہ کسی اجنبی عورت کے پہننے والے عطر کو سونگھنا حرام ہے۔ احناف اور مالکیہ کا خیال ہے کہ جو روزہ دار اپنے گلے تک بخور پہنچاتا ہے وہ روزہ افطار کر دیتا ہے، جب کہ گلاب کی خوشبو والی ہوا سونگھنے سے روزہ ٹوٹ جاتا ہے۔ اسکولوں میں اس کی بو کے لیے کسی چیز کی خدمات حاصل کرنے اور سونگھنے کی حس کو مجروح کرنے پر اختلاف ہے، جہاں ممکن ہو تو انتقامی کارروائی کی جائے اور بصورت دیگر اکثریت کے خیال میں خون کی پوری رقم۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10181} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10182} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10183} صفحہ 10184} {حوالہ: فقہ الموسوعہ کویتیہ نور v3 صفحہ 10185}"
  tr: "Koku almak, burun duyusuyla kokuları algılamaktır ve tanıkların sarhoş birinin ağzını koklaması gibi alkol kokusunu algılamak zorunludur; ihramda parfüm koklamak gibi yasak veya sevilmez, çiçek koklamak gibi de kabul edilir. Hanafiler ve Malikiler, oruç tutan kişi boğazına ulaştığında orucunu bozur ve gül içeren hava koklaması orucu bozmaz. Okullar, koklamak için bir şey kiralama ve koku alma duyusuna dayalı suçlar konusunda farklılık göstermektedir; bu durumda mümkünse intikam gerekir, aksi takdirde çoğunluğa göre tam kan parası verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10185}"
  id: "Mencium adalah mencium bau melalui indra hidung, dan wajib seperti saksi mencium bau mulut orang yang mabuk untuk mencium bau alkohol, dan dilarang atau tidak disukai seperti mencium parfum bagi orang tersebut dalam ihram menurut mereka yang mengatakan demikian, dan diperbolehkan seperti mencium bunga yang diperbolehkan. Hanafi dan Malik berpendapat bahwa jika orang yang berpuasa mencapai tenggorokannya, mereka memutus puasa, dan mencium bau udara yang mengandung mawar tidak memutus puasa. Aliran berbeda mengenai menyewa sesuatu untuk dicium, dan mengenai tindak pidana berdasarkan indera penciuman; dalam kasus ini, pembalasan diperlukan jika memungkinkan, jika tidak uang darah penuh menurut mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10181} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10183} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10185}"
