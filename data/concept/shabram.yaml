summary:
  ar: "الشبرم في الكتاب ينبت في البساتين، له قصب دقيق مستو وزغب وورق ولبن، وقال حنين حار في أول الثانية يابس في آخر الثالثة ولبنه أشد، وفيه قبض وحدة وتفجير لأفواه العروق وهو بالجملة ضار خصوصا بالأمزجة الحارة، ولبنه معين في قلع الأسنان، ويضر بالمعدة والكبد ويسقى في علاج الاستسقاء، ويسهل السوداء والبلغم والماء، وقد هجر لتوليده الحميات ولأضراره، ويذكر الكتاب نقلا موسوما ضرره بالباه والمني {cite:canon-ibn-sina-print-v1 pp.678-679}"
  en: "Shabram is in the book a plant that grows in gardens, with a fine straight stalk, down, leaves and a milk; Hunayn said it is hot at the beginning of the second degree and dry at the end of the third, its milk stronger still; it has astringency, sharpness and a bursting of the mouths of the veins and is on the whole harmful, especially to hot temperaments; its milk helps in pulling teeth, it harms the stomach and liver and is given in treating dropsy, it purges black bile, phlegm and water, and it was abandoned for generating fevers and for its harms; the book lists, as a labelled report, its harm to desire and semen {cite:canon-ibn-sina-print-v1 pp.678-679}"
  ur: "شبرم کتاب میں ایک پودا ہے جو باغوں میں اگتا ہے، اس کی باریک سیدھی ڈنڈی، روئیں، پتے اور دودھ ہے؛ حنین نے کہا کہ یہ دوسرے درجے کے آغاز میں گرم اور تیسرے کے آخر میں خشک ہے اور اس کا دودھ اس سے بھی شدید؛ اس میں قبض، تیزی اور رگوں کے منہ کو پھاڑنے کی صفت ہے اور مجموعی طور پر مضر ہے، خاص طور پر گرم مزاجوں کے لیے؛ اس کا دودھ دانت اکھاڑنے میں مدد دیتا ہے، معدے اور جگر کو نقصان دیتا ہے اور استسقا کے علاج میں پلایا جاتا ہے، سودا، بلغم اور پانی کو خارج کرتا ہے، اور بخار پیدا کرنے اور نقصانات کی وجہ سے چھوڑ دیا گیا؛ اور کتاب منقول فہرست کے طور پر باہ اور منی کو اس کا نقصان درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.678-679}۔"
  es: "En el libro, Shabram es una planta que crece en jardines, con un tallo fino y recto, pelusa, hojas y savia; Hunayn dijo que es caliente al comienzo del segundo grado y seca al final del tercero, siendo su savia aún más fuerte; tiene astringencia, agudeza y provoca la ruptura de las venas y, en general, es perjudicial, especialmente para los temperamentos calientes; su savia ayuda a extraer dientes, daña el estómago y el hígado y se administra para tratar la hidropesía, purga la bilis negra, la flema y el agua, y fue abandonada por generar fiebres y por sus efectos nocivos; el libro enumera, como un informe detallado, su daño al deseo y al semen {cite:canon-ibn-sina-print-v1 pp.678-679}"
  fr: "Le Shabram est décrit dans le livre comme une plante qui pousse dans les jardins, avec une tige fine et droite, du duvet, des feuilles et un latex. Hunayn dit qu'elle est chaude au début du deuxième degré et sèche à la fin du troisième, son latex étant encore plus fort. Elle est astringente, piquante et provoque la dilatation des veines. Globalement, elle est nuisible, surtout pour les tempéraments chauds. Son latex est utilisé pour arracher les dents, mais il est nocif pour l'estomac et le foie et est employé pour traiter l'hydropisie. Il purge la bile noire, les mucosités et l'eau. Son usage a été abandonné en raison de sa nocivité et de sa capacité à provoquer des fièvres. Le livre mentionne, sous forme de rapport détaillé, son effet néfaste sur le désir et le sperme. {cite:canon-ibn-sina-print-v1 pp.678-679}"
  tr: "Kitaptaki 'şabrüm' meyve bahçelerinde yetişir, unlu şeker kamışı, yapraklar ve süt içerir. İkinci şabramın başında sıcak, üçüncünün sonunda kuru bir hassasiyete sahip olduğu, sütünün daha güçlü olduğu söylenir. Ayrıca keskin bir daralma ve damarların patlaması vardır. Genellikle özellikle sıcak huylara zararlıdır, sütü diş çekimine yardımcı olur, mide ve karaciğere zarar verir, asit için ilaç olarak verilir ve kara safra, balgam ve suyu kolaylaştırır. Ateş ve zararları nedeniyle terk edilmiştir. Kitapta, zararı 'bah ve sperm' olarak adlandırılan bir aktarımdan bahsedilir {cite:canon-ibn-sina-print-v1 s.678-679}"
  id: "'Shabrum' dalam buku ini tumbuh di kebun, memiliki tebu tepung halus, daun bulu, dan susu. Dikatakan memiliki kelembutan panas di awal abad kedua dan kering di akhir yang ketiga, serta susunya lebih kuat. Ia juga memiliki penyempitan tajam dan ledakan pembuluh darah. Umumnya berbahaya terutama bagi temperamen panas, dan susunya membantu dalam pencabutan gigi, merusak lambung dan hati, diberikan sebagai obat untuk ascites, serta memudahkan hembusan empedu, dahak, dan air. Shabrum ditinggalkan karena menyebabkan demam dan bahayanya. Buku ini menyebutkan sebuah penularan yang bahaya disebut 'bah dan semen' {cite:canon-ibn-sina-print-v1 hlm.678-679}"
