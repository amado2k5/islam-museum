label:
  ar: "الأنس بالله"
  en: "Intimacy with God (uns billah)"
  ur: "اللہ سے انس"
summary:
  ar: "يتحدث الشيخ عمر عبد الكافي عن أنس القلب بالله، ويقول إنه يظهر بين الناس وفي الخلوة معا. ومن وجده في الحالين فهو محبوب عند الله، ومن فقده فيهما فهو محروم منه."
  en: "Sheikh Omar Abdelkafy speaks of the heart's intimacy with God, which he says shows both among people and in solitude. Whoever finds it in both is beloved to God, and whoever lacks it in both is deprived of it."
  ur: "شیخ عمر عبدالکافی دل کے اللہ سے انس کی بات کرتے ہیں، جو ان کے بقول لوگوں کے درمیان بھی ظاہر ہوتا ہے اور تنہائی میں بھی۔ جو شخص دونوں جگہوں پر یہ انس پا لے وہ اللہ کا محبوب ہے، اور جو دونوں جگہوں پر اسے نہ پائے وہ اس سے محروم ہے۔"
