id: concept/al-uns-bi-allah
class: concept
kind: ethical
label:
  ar: "الأنس بالله"
  en: "Intimacy with God (uns billah)"
  fr: "Intimité avec Dieu (uns billah)"
  ur: "اللہ سے انس"
  es: "Intimidad con Dios (uns billah)"
summary:
  ar: "يتحدث الشيخ عمر عبد الكافي عن أنس القلب بالله، ويقول إنه يظهر بين الناس وفي الخلوة معا. ومن وجده في الحالين فهو محبوب عند الله، ومن فقده فيهما فهو محروم منه."
  en: "Sheikh Omar Abdelkafy speaks of the heart's intimacy with God, which he says shows both among people and in solitude. Whoever finds it in both is beloved to God, and whoever lacks it in both is deprived of it."
  fr: "Le cheikh Omar Abdelkafy évoque l’intimité du cœur avec Dieu, qui, selon lui, se manifeste en société comme dans la solitude. Celui qui la trouve dans les deux cas est aimé de Dieu ; celui qui ne la trouve ni dans l’un ni dans l’autre en est privé."
  ur: "شیخ عمر عبدالکافی دل کے اللہ سے انس کی بات کرتے ہیں، جو ان کے بقول لوگوں کے درمیان بھی ظاہر ہوتا ہے اور تنہائی میں بھی۔ جو شخص دونوں جگہوں پر یہ انس پا لے وہ اللہ کا محبوب ہے، اور جو دونوں جگہوں پر اسے نہ پائے وہ اس سے محروم ہے۔"
  es: "El jeque Omar Abdelkafy habla de la intimidad del corazón con Dios, que, según él, se manifiesta tanto en compañía de otras personas como en la soledad. Quien la encuentra en ambos ámbitos es amado por Dios, y quien carece de ella, está privado de ella."
