  ar: المحشر
  en: The Gathering Place
  fr: "Le lieu du Rassemblement"
  ur: محشر
  es: "El lugar de encuentro"
  tr: "Toplantı"
  id: "Pertemuan"
summary:
  ar: "المحشر في القرآن والسنة: الموضع الذي يُجمع فيه الناس يوم القيامة للحساب، يذكر أنه صعيد واحد تبيض وجوههم وتسود وجوههم، وأن الناس يُحشرون على أقدامهم، وي differing في صفوفهم."
  en: "The Gathering Place in Qur'an and Sunnah: the place where people are gathered on the Day of Resurrection for reckoning — a single expanse where faces are white or black, and people are gathered on foot in ranks."
  fr: "Le lieu du Rassemblement dans le Coran et la Sunna : le lieu où les gens sont rassemblés au Jour de la Résurrection pour la reddition des comptes — une étendue unique où des visages sont blancs et d’autres noirs, et où les gens sont rassemblés à pied, en rangs."
  ur: "محشر قرآن و سنت میں: وہ جگہ جہاں یوم قیامت کو لوگ حساب کے لیے جمع کیے جاتے ہیں — ایک صحرائی زمین جہاں چہرے سفید یا کالے ہوتے ہیں، اور لوگ پیدل قطاروں میں جمع کیے جاتے ہیں۔"
  es: "El lugar de reunión en el Corán y la Sunnah: el lugar donde la gente se reúne el Día de la Resurrección para el juicio final; una sola extensión donde los rostros son blancos o negros, y la gente se reúne a pie en filas."
  tr: "Kur'an ve Sünnet'te Haşr: Kıyamet Günü'nde insanların hesap için toplanacağı yer. Tek bir düzlük, yüzleri beyaz, yüzleri kararmış ve insanların ayakta toplanacağı ve saflarında farklılık olduğu belirtilir."
  id: "Dalam Al-Qur'an dan Sunnah, Hashr: Tempat di mana orang-orang akan berkumpul untuk perhitungan pada Hari Penghakiman. Disebutkan bahwa satu dataran, dengan wajah putih dan wajah gelap, akan berkumpul berdiri, dan akan ada perbedaan pangkat."
