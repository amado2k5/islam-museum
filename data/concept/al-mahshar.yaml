summary:
  ar: "المحشر في القرآن والسنة: الموضع الذي يُجمع فيه الناس يوم القيامة للحساب، يذكر أنه صعيد واحد تبيض وجوههم وتسود وجوههم، وأن الناس يُحشرون على أقدامهم، وي differing في صفوفهم."
  en: "The Gathering Place in Qur'an and Sunnah: the place where people are gathered on the Day of Resurrection for reckoning — a single expanse where faces are white or black, and people are gathered on foot in ranks."
  ur: "محشر قرآن و سنت میں: وہ جگہ جہاں یوم قیامت کو لوگ حساب کے لیے جمع کیے جاتے ہیں — ایک صحرائی زمین جہاں چہرے سفید یا کالے ہوتے ہیں، اور لوگ پیدل قطاروں میں جمع کیے جاتے ہیں۔"
