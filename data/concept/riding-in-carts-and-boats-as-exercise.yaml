label: { ar: "ركوب العجل والزواريق رياضة عند ابن سينا", en: "Riding in carts and boats as exercise in the Canon", ur: "قانون میں گاڑی اور کشتی کی سواری بطور ورزش", es: "Montar en carros y botes como ejercicio en el Canon", fr: "Se promener en charrette et en bateau comme exercice dans le Canon" }
summary:
  ar: "يذكر ابن سينا أن ركوب العجل أشد إثارة من الترجيح وأن ركوبه والوجه إلى خلف ينفع ضعف البصر، وأن ركوب الزواريق والسفن قرب الشطوط ينفع الجذام والاستسقاء والسكتة وبرد المعدة ونفختها، وأن الركوب في البحر المتلاطم أقوى في قلع هذه الأمراض لما يختلف على النفس من فرح وحزن {cite:canon-ibn-sina-print-v1 p.223}."
  en: "Ibn Sina says riding in a cart stirs more than swinging, and riding it facing backward greatly helps weak sight; riding in small boats and ships near the shore helps leprosy, dropsy, apoplexy and cold and bloated stomach, and going out on the open sea is stronger against these diseases because of the joy and sorrow that alternate in the soul {cite:canon-ibn-sina-print-v1 p.223}."
  es: "Ibn Sina dice que viajar en un carro agita más que columpiarse, y viajar en él mirando hacia atrás ayuda mucho a la vista débil; viajar en botes pequeños y barcos cerca de la costa ayuda a la lepra, la hidropesía, la apoplejía y el estómago frío e hinchado, y salir a mar abierto es más fuerte contra estas enfermedades debido a la alegría y la tristeza que se alternan en el alma {cite:canon-ibn-sina-print-v1 p.223}."
  fr: "Ibn Sina dit que monter dans une charrette est plus stimulant que de se balancer, et que monter dos à la route est très bénéfique pour la vue faible; monter dans de petites embarcations et des navires près du rivage aide à lutter contre la lèpre, l'hydropisie, l'apoplexie et les maux d'estomac, et aller en haute mer est plus efficace contre ces maladies en raison de la joie et de la tristesse qui alternent dans l'âme {cite:canon-ibn-sina-print-v1 p.223}."
