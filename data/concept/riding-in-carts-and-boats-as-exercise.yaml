label: { ar: "ركوب العجل والزواريق رياضة عند ابن سينا", en: "Riding in carts and boats as exercise in the Canon", ur: "قانون میں گاڑی اور کشتی کی سواری بطور ورزش" }
summary:
  ar: "يذكر ابن سينا أن ركوب العجل أشد إثارة من الترجيح وأن ركوبه والوجه إلى خلف ينفع ضعف البصر، وأن ركوب الزواريق والسفن قرب الشطوط ينفع الجذام والاستسقاء والسكتة وبرد المعدة ونفختها، وأن الركوب في البحر المتلاطم أقوى في قلع هذه الأمراض لما يختلف على النفس من فرح وحزن {cite:canon-ibn-sina-print-v1 p.223}."
  en: "Ibn Sina says riding in a cart stirs more than swinging, and riding it facing backward greatly helps weak sight; riding in small boats and ships near the shore helps leprosy, dropsy, apoplexy and cold and bloated stomach, and going out on the open sea is stronger against these diseases because of the joy and sorrow that alternate in the soul {cite:canon-ibn-sina-print-v1 p.223}."
