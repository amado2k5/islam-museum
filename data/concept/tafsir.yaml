summary:
  ar: "التفسير في درس الشيخ عمر عبد الكافي قراءة لجزء عمّ تبدأ بسورة النبأ ثم النازعات، تقوم على ربط الآيات بعضها ببعض، والرجوع إلى دلالات الألفاظ، وقراءة مشاهد القيامة معا لا من سورة واحدة. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:05:00}"
  en: "Tafsir in Sheikh Omar Abdelkafy's course is a reading of Juz' 'Amma that begins with Surat An-Naba' and then An-Nazi'at. It joins verses to one another, returns to the sense of words, and reads the scenes of Judgement together rather than from a single surah. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:05:00}"
  ur: "شیخ عمر عبدالکافی کے درس میں تفسیر جزء عم کا مطالعہ ہے جو سورۃ النبأ سے شروع ہوکر سورۃ النازعات تک جاتا ہے؛ اس میں آیات کو ایک دوسرے سے جوڑا جاتا ہے، الفاظ کے معنی کی طرف لوٹا جاتا ہے، اور قیامت کے مناظر کو ایک سورت کے بجائے مل کر پڑھا جاتا ہے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep01 00:05:00}"
