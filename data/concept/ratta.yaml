summary:
  ar: "الرتة في الكتاب هو البندق الهندي، ثمرة في عظم البندق متخشخش تنفلق عن حب كالنارجيل، حارة يابسة، تطلى على الخنازير بالخل، وتنفع من الجرب والحكة، وتكسر الرياح المؤذية في الظهر، ويسعط بها في اللقوة والشقيقة والصداع {cite:canon-ibn-sina-print-v1 p.662}"
  en: "Ratta is in the book the Indian hazelnut, a fruit in a rattling shell of the hazelnut that splits open on a seed like the coconut; it is hot and dry, smeared with vinegar on scrofula, it benefits scab and itching, breaks the harmful winds in the back, and is used as a snuff for facial palsy, migraine and headache {cite:canon-ibn-sina-print-v1 p.662}"
  ur: "رتہ کتاب میں ہندی بندق ہے، بندق کے خول میں کھڑکھڑانے والا ایک پھل جو ناریل جیسے دانے پر پھٹتا ہے؛ گرم خشک ہے، سرکے کے ساتھ خنازیر پر لگایا جاتا ہے، خارش اور کھجلی میں نافع ہے، پیٹھ کی تکلیف دہ ریاح کو توڑتا ہے، اور لقوے، آدھے سر کے درد اور سر درد میں نسوار کے طور پر استعمال ہوتا ہے {cite:canon-ibn-sina-print-v1 p.662}۔"
  es: "En el libro, Ratta es la avellana india, un fruto con una cáscara crujiente que se abre al rasgar una semilla como el coco; es caliente y seca, se aplica con vinagre sobre la escrófula, alivia la costra y el picor, rompe los gases nocivos en la espalda y se usa como rapé para la parálisis facial, la migraña y el dolor de cabeza {cite:canon-ibn-sina-print-v1 p.662}"
  fr: "Le ratta est décrit dans le livre comme la noisette indienne, un fruit à la coque bruyante qui s'ouvre sur une graine comme la noix de coco; il est chaud et sec, enduit de vinaigre sur la scrofule, il est bénéfique pour la croûte et les démangeaisons, il chasse les vents nocifs dans le dos et est utilisé comme tabac à priser contre la paralysie faciale, la migraine et les maux de tête {cite:canon-ibn-sina-print-v1 p.662}"
  tr: "Kitaptaki ratta, fındık kemiğinde bulunan ve hindistancevizi gibi çatlayan bir meyve, domuzların üzerinde sirke ile kaplanmış kuru sıcak bir ottur, uyuz ve kaşıntı için faydalı, sırtta zararlı rüzgarlar bozar ve bulantı, migren ve baş ağrısına neden olur {cite:canon-ibn-sina-print-v1 s.662}"
  id: "Ratta dalam buku ini adalah Indian hazelnut, buah dalam tulang hazelnut yang retak seperti kelapa, herbal kering panas, dilapisi cuka pada babi, bermanfaat untuk kudis dan gatal, memecah angin berbahaya di punggung, dan digunakan untuk menyebabkan mual, migrain, dan sakit kepala {cite:canon-ibn-sina-print-v1 hlm.662}"
