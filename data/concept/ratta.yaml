label:
  ar: "رتة"
  en: "Ratta"
  ur: "رتّہ"
summary:
  ar: "الرتة في الكتاب هو البندق الهندي، ثمرة في عظم البندق متخشخش تنفلق عن حب كالنارجيل، حارة يابسة، تطلى على الخنازير بالخل، وتنفع من الجرب والحكة، وتكسر الرياح المؤذية في الظهر، ويسعط بها في اللقوة والشقيقة والصداع {cite:canon-ibn-sina-print-v1 p.662}"
  en: "Ratta is in the book the Indian hazelnut, a fruit in a rattling shell of the hazelnut that splits open on a seed like the coconut; it is hot and dry, smeared with vinegar on scrofula, it benefits scab and itching, breaks the harmful winds in the back, and is used as a snuff for facial palsy, migraine and headache {cite:canon-ibn-sina-print-v1 p.662}"
  ur: "رتہ کتاب میں ہندی بندق ہے، بندق کے خول میں کھڑکھڑانے والا ایک پھل جو ناریل جیسے دانے پر پھٹتا ہے؛ گرم خشک ہے، سرکے کے ساتھ خنازیر پر لگایا جاتا ہے، خارش اور کھجلی میں نافع ہے، پیٹھ کی تکلیف دہ ریاح کو توڑتا ہے، اور لقوے، آدھے سر کے درد اور سر درد میں نسوار کے طور پر استعمال ہوتا ہے {cite:canon-ibn-sina-print-v1 p.662}۔"
