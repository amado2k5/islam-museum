id: concept/waswasa-through-heedlessness
class: concept
kind: doctrine
label: { ar: "الوسوسة من باب الغفلة", en: "Whispering that enters through heedlessness" }
summary:
  ar: "يعرض الشعراوي قصة إبليس مع آدم، ويرى أن إبليس بدأ بالمعصية حين رفض السجود لآدم وردّ الأمر على الآمر، وأن إغواءه لآدم كان من باب الغفلة، فأوهمه بالخلد والملك في شجرة حرمها الله، ثم يدخل على بني آدم من الباب نفسه {cite:tafsir-sharawi-khawatir-scan p.29} {cite:tafsir-sharawi-khawatir-scan p.30} {cite:tafsir-sharawi-khawatir-scan p.31}. ويستدل بقسم إبليس بعزة الله لأغوين الخلق أجمعين، ويرى أن الله طرده من رحمته فلن يدخل فيها أبداً، وأن الإغواء لا يتقدم إلى من أراد الله هدايته. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi recounts Iblis's dealings with Adam. He holds that Iblis's sin began when he refused to prostrate to Adam and turned the command back on its Giver, and that he tempted Adam through heedlessness by promising immortality and kingship in a forbidden tree. He holds that Iblis enters the children of Adam by the same route, and he cites Iblis's oath by God's might to mislead all of them, while God's expulsion of Iblis from mercy means he never returns to it {cite:tafsir-sharawi-khawatir-scan p.29} {cite:tafsir-sharawi-khawatir-scan p.30} {cite:tafsir-sharawi-khawatir-scan p.31}. This is his reading and is attributed to him."
