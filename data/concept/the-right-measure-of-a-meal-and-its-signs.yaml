label: { ar: "مقدار الطعام الصالحة وعلاماتها", en: "The right measure of a meal and its signs", ur: "کھانے کی درست مقدار اور اس کی علامات" }
summary:
  ar: "يقول ابن سينا إن تقدير الطعام بحسب العادة والقوة، وإن المقدار الصالح ما لا يثقل ولا يمدد الشراسيف ولا ينفخ ولا يقرقر ولا يطفو ولا يعرض معه غثي ولا شهوة كلبية ولا سقوط ولا بلادة ذهن ولا أرق، وإن الطعم إذا بقي في الفم بعد مدة طويلة كان أردأ {cite:canon-ibn-sina-print-v1 p.229}."
  en: "Ibn Sina says the amount of food is set by habit and strength, and the right amount is that which brings no heaviness, stretching of the flanks, bloating, rumbling, floating, nausea, ravenous hunger, collapse, dullness of mind or sleeplessness; a taste lingering long afterwards marks worse food {cite:canon-ibn-sina-print-v1 p.229}."
