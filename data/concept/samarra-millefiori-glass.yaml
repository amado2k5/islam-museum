summary:
  ar: "بلاطات زجاجية ملونة بطريقة «الألف زهرة» (ميلفيوري) يُعتقد أنها زينت قاعة الاستقبال في دار الخلافة بسامراء في القرن التاسع، وتنتمي بحسب نادين شيبيل إلى مجموعة «سامراء 2» من زجاج رماد النباتات العراقي {cite:schibille-islamic-glass-2022 p. 146}."
  en: "Brightly coloured millefiori glass tiles believed to have adorned the audience hall of the Dar al-Khilafa at ninth-century Samarra; Nadine Schibille assigns them to the Samarra 2 group of Mesopotamian plant-ash glass {cite:schibille-islamic-glass-2022 p. 146}."
  ur: "ملی فیوری طرز کی رنگین شیشے کی ٹائلیں جن کے بارے میں خیال ہے کہ نویں صدی کے سامرا میں دار الخلافہ کے دیوانِ عام کو سجاتی تھیں؛ نادین شیبل انہیں عراقی راکھ والے شیشے کے «سامرا 2» گروہ میں رکھتی ہیں {cite:schibille-islamic-glass-2022 p. 146}."
