label:
  ar: "نَهْب"
  en: "Nahb (plunder)"
  ur: "نہب (لوٹ مار)"
summary:
  ar: "النهب في اللغة الأخذ بالغلبة والعلانية، وعند الفقهاء الأخذ بالقهر والغلبة علانية، أو الأخذ مما أباحه صاحبه كالذي ينثر في الولائم، وهو يفارق الاختلاس والغصب والسرقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16208}"
  en: "Nahb is, in the lexicon, taking by force and dominance in the open. The jurists use it for taking by force in the open, and for taking what the owner has permitted, such as what is scattered at feasts. It differs from embezzlement, usurpation and theft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16208}"
  ur: "نہب لغت میں غلبے اور زور سے علانیہ لینا ہے؛ فقہاء کے نزدیک زور سے علانیہ لینا، یا وہ چیز لینا جسے مالک نے مباح کیا ہو، جیسے ولیمے میں بکھیری ہوئی چیز۔ یہ اختلاس، غصب اور سرقہ سے مختلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16208}"
