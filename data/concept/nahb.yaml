id: concept/nahb
class: concept
kind: legal
label:
  ar: "نَهْب"
  en: "Nahb (plunder)"
  ur: "نہب ⁦(لوٹ مار)⁩"
  es: "Nahb (saqueo)"
  fr: "Nahb (pillage)"
  tr: "yağma"
  id: "menjarah"
summary:
  ar: "النهب في اللغة الأخذ بالغلبة والعلانية، وعند الفقهاء الأخذ بالقهر والغلبة علانية، أو الأخذ مما أباحه صاحبه كالذي ينثر في الولائم، وهو يفارق الاختلاس والغصب والسرقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16208}"
  en: "Nahb is, in the lexicon, taking by force and dominance in the open. The jurists use it for taking by force in the open, and for taking what the owner has permitted, such as what is scattered at feasts. It differs from embezzlement, usurpation and theft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16208}"
  ur: "نہب لغت میں غلبے اور زور سے علانیہ لینا ہے؛ فقہاء کے نزدیک زور سے علانیہ لینا، یا وہ چیز لینا جسے مالک نے مباح کیا ہو، جیسے ولیمے میں بکھیری ہوئی چیز۔ یہ اختلاس، غصب اور سرقہ سے مختلف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16208}"
  es: "En el léxico, nahb significa tomar por la fuerza y dominar públicamente. Los juristas lo utilizan para referirse a tomar por la fuerza públicamente y a tomar aquello que el propietario ha permitido, como lo que se esparce en los banquetes. Se diferencia de la malversación, la usurpación y el robo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16208}"
  fr: "Le terme « nahb » désigne, dans le lexique, la prise de force et l'appropriation manifeste. Les juristes l'emploient pour désigner la prise de force en public, ainsi que la prise de ce que le propriétaire a autorisé, comme les offrandes distribuées lors des fêtes. Il se distingue du détournement de fonds, de l'usurpation et du vol. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16208}"
  tr: "Dilbilimde yağma, hakimiyet ve açıklıkla almak anlamına gelir ve hukukçulara göre, zorla ve egemenlikle almak açıktır, ya da sahibinin izin verdiği şeyleri almak, örneğin ziyafetlerde dağıtılan şeyler gibi, zimmete geçirme, gasp ve hırsızlıktan farklıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16208}"
  id: "Dalam linguistik, penjarahan berarti mengambil dengan dominasi dan keterbukaan, dan menurut ahli hukum, mengambil dengan kekuatan dan dominasi adalah terbuka, atau mengambil apa yang diizinkan pemiliknya, seperti apa yang tersebar di jamuan makan, yang berbeda dengan penggelapan, pengambilalihan, dan pencurian. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16208}"
