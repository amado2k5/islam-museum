  id: sunni-imamate-choice
  stance:
    ar: الإمامة عند أهل السنة اختيار من الأمة لا نص معصوم
    en: The Sunni view is that the imamate rests on the community's choice, not on a designation
    ur: اہل سنت کے نزدیک امامت امت کے انتخاب پر ہے، کسی تعیین پر نہیں
  summary:
    ar: أهل السنة يجعلون الإمامة مفوضة إلى اختيار الأمة وشوراها {cite:duha-islam p. 850}.
    en: Sunnis place the imamate in the community's choice and consultation {cite:duha-islam p. 850}.
    ur: اہل سنت امامت کو امت کے انتخاب اور مشورے کے سپرد کرتے ہیں {cite:duha-islam p. 850}۔
  sources:
