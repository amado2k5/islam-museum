id: concept/imamate-conditions-in-the-preface-of-sirat-al-hadi
class: concept
kind: doctrine
label:
  ar: الإمامة وشروطها في مقدمة سيرة الهادي، الموقف الزيدي
  en: The imamate and its conditions in the preface of Sirat al-Hadi, the Zaydi position
  ur: سیرت الہادی کے مقدمے میں امامت اور اس کی شرائط، زیدی موقف
summary:
  ar: 'تعرض مقدمة الكتاب، برواية محمد بن سليمان الكوفي، موقفاً زيدياً: الإمامة في ولد الحسن والحسين، وتجب طاعة من قام منهم بالسيف داعياً إلى الكتاب والسنة وعدلاً زاهداً شجاعاً، ومن قعد في بيته تحت حكم الظالمين فليس إمام حق.'
  en: 'The book''s preface, narrated through Muhammad ibn Sulayman al-Kufi, sets out a Zaydi position: the imamate belongs to the descendants of al-Hasan and al-Husayn, obedience is due to the one of them who rises with the sword calling to the Book and the sunna, just, ascetic and brave, and one who sits at home under unjust rulers is not a rightful imam.'
  ur: 'کتاب کا مقدمہ، محمد بن سلیمان کوفی کی روایت سے، ایک زیدی موقف پیش کرتا ہے: امامت حسن اور حسین کی اولاد میں ہے، ان میں سے جو تلوار کے ساتھ اٹھ کر کتاب اور سنت کی طرف بلائے، عادل، زاہد اور بہادر ہو اس کی اطاعت واجب ہے، اور جو ظالموں کی حکومت میں گھر بیٹھا رہے وہ حق کا امام نہیں۔'
