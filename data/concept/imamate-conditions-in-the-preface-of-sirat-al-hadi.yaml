- tradition: shia-zaydi
  id: zaydi-preface-sira-hadi
  stance:
    ar: الإمامة في ولد الحسن والحسين لمن قام منهم بالسيف داعياً إلى الكتاب والسنة
    en: The imamate belongs to those of the line of al-Hasan and al-Husayn who rise with the sword calling to the Book and the sunna
    ur: امامت حسن اور حسین کی اولاد میں سے اس کے لیے ہے جو تلوار کے ساتھ اٹھ کر کتاب اور سنت کی طرف بلائے
  summary:
    ar: تنص مقدمة سيرة الهادي على أن من استوفى هذه الصفة من ولد الحسن والحسين فهو الإمام المفترضة طاعته، وأن من جلس في بيته وأرخى ستره ولم يأمر بمعروف ولم ينه عن منكر فليس إماماً حقاً {cite:sira-hadi-ila-al-haqq p.27} {cite:sira-hadi-ila-al-haqq p.28}.
    en: The preface of Sirat al-Hadi states that whoever of the line of al-Hasan and al-Husayn meets these qualities is the imam whose obedience is obligatory, and that one who sits at home behind a drawn curtain and neither enjoins good nor forbids wrong is not a rightful imam {cite:sira-hadi-ila-al-haqq p.27} {cite:sira-hadi-ila-al-haqq p.28}.
    ur: سیرت الہادی کا مقدمہ کہتا ہے کہ حسن اور حسین کی اولاد میں سے جو ان صفات کو پورا کرے وہی امام ہے جس کی اطاعت فرض ہے، اور جو گھر میں بیٹھ کر پردہ لٹکا لے اور نہ نیکی کا حکم دے نہ برائی سے روکے وہ حق کا امام نہیں {cite:sira-hadi-ila-al-haqq p.27} {cite:sira-hadi-ila-al-haqq p.28}۔
