id: concept/imamat-al-salat
class: concept
kind: legal
label: { ar: "إمامة الصلاة", en: "Imamat al-salat (leading the prayer, the lesser imamate)" }
summary:
  ar: "إمامة الصلاة ارتباط صلاة المصلي بصلاة غيره بشروط بينها الشرع، وهي الإمامة الصغرى، وتمييزا عن الإمامة الكبرى وهي الخلافة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341} وهي من أفضل الأعمال، وتشترط فيها شروط كالإسلام والعقل والذكورة والسلامة من الأعذار، ويختلف الفقهاء في البلوغ والنية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3342}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3345} وتقدم في الإمامة القارئ والأعلم والأتقى والأكبر سنا، والسلطان أولى من غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3347}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3348}"
  en: "Imamat al-salat is the attaching of one person's prayer to another's on conditions set by the Law; it is the lesser imamate, as opposed to the great imamate of the caliphate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341} Leading prayer is among the best deeds, and conditions include Islam, sanity, maleness and freedom from excuses; the jurists differ on puberty and on intention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3342}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3345} The priority goes to the best reciter, the most learned, the most pious and the eldest, and a ruler present takes precedence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3347}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3348}"
