id: concept/imamat-al-salat
class: concept
kind: legal
label: { ar: "إمامة الصلاة", en: "Imamat al-salat (leading the prayer, the lesser imamate)", es: "Imamat al-salat (dirigir la oración, el imamato menor)", fr: "Imamat al-salat (diriger la prière, le petit imamat)", ur: "امامت الصلاۃ ⁦(نماز کی امامت، چھوٹی امامت)⁩", tr: "Duayı Yönetmek", id: "Memimpin Doa" }
summary:
  ar: "إمامة الصلاة ارتباط صلاة المصلي بصلاة غيره بشروط بينها الشرع، وهي الإمامة الصغرى، وتمييزا عن الإمامة الكبرى وهي الخلافة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341} وهي من أفضل الأعمال، وتشترط فيها شروط كالإسلام والعقل والذكورة والسلامة من الأعذار، ويختلف الفقهاء في البلوغ والنية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3342}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3345} وتقدم في الإمامة القارئ والأعلم والأتقى والأكبر سنا، والسلطان أولى من غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3347}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3348}"
  en: "Imamat al-salat is the attaching of one person's prayer to another's on conditions set by the Law; it is the lesser imamate, as opposed to the great imamate of the caliphate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341} Leading prayer is among the best deeds, and conditions include Islam, sanity, maleness and freedom from excuses; the jurists differ on puberty and on intention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3342}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3343}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3345} The priority goes to the best reciter, the most learned, the most pious and the eldest, and a ruler present takes precedence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3347}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3348}"
  es: "El imamat al-salat es la unión de la oración de una persona a la de otra bajo las condiciones establecidas por la Ley; es el imamato menor, en contraposición al gran imamato del califato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341} Dirigir la oración es una de las mejores obras, y las condiciones incluyen el Islam, la cordura, ser hombre y no tener excusas; los juristas difieren en cuanto a la pubertad y la intención. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3342}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3343}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3345} La prioridad es para el mejor recitador, el más sabio, el más piadoso y el mayor, y un gobernante presente tiene prioridad. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3346}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3347}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3348}"
  fr: "L'imamat al-salat consiste à lier la prière d'une personne à celle d'une autre, sous réserve des conditions fixées par la Loi; il s'agit de l'imamat mineur, par opposition à l'imamat majeur du califat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341} Diriger la prière est considéré comme l'une des meilleures actions, et les conditions requises incluent la pratique de l'islam, la santé mentale, le sexe masculin et l'absence d'excuses; les juristes divergent quant à la puberté et à l'intention. } La priorité va au meilleur récitant, au plus érudit, au plus pieux et au plus âgé, et un dirigeant présent a préséance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3346}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3347}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3348}"
  ur: "امامت الصلاۃ ایک شخص کی نماز کو دوسرے کی شرعی شرائط پر جوڑنا ہے۔ یہ خلافت کی عظیم امامت کے مقابلے میں چھوٹی امامت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3340}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3341} نماز کی امامت کرنا افضل ترین اعمال میں سے ہے، اور شرائط میں اسلام، عقل، مردانگی اور عذر سے آزادی شامل ہے۔ بلوغت اور نیت میں فقہاء کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3341}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3342}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3343}{cite:فقہ-موسوع-کویتیہ-نور-v3 p.3343}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3342}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3343}{cite:fiqh-vuatiyya-noor-v3 p.3342} ترجیح بہترین تلاوت کرنے والے، سب سے زیادہ عالم، سب سے زیادہ متقی اور بزرگ کو جاتی ہے، اور ایک حاکم موجود ہے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3346}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3347}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3348}"
  tr: "Namazı yöneten, dua edenin duasının başkalarının dualarıyla, Şeriat (küçük imamat) ve büyük imam olan halifelikten ayrım olarak başkalarının dualarıyla bağlantılıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3341} En iyi amallardan biridir ve İslam, akıl, erkeklik ve bahanelerden korunma gibi koşullar gerektirir. Hukukçular ergenlik ve niyet konusunda farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3343}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3345} İmamatlıkta öncelik en karşılıklı, bilgili olan, en dindar ve en eski olanıdır ve otorite diğerlerinden daha layıktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3348}"
  id: "Memimpin shalat adalah hubungan antara doa orang yang berdoa dengan shalat orang lain dalam kondisi termasuk Syariah, yang merupakan imamat minor, dan sebagai pembeda dari imamat utama, yaitu kekhalifahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3341} Ini adalah salah satu perbuatan terbaik, dan membutuhkan syarat seperti Islam, kecerdasan, maskulinitas, dan perlindungan dari alasan. Para ahli hukum berbeda pendapat mengenai pubertas dan niat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3343} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3345} Kedudukan utama dalam Imamate adalah yang paling timbal balik, berpengetahuan, saleh, dan yang tertua, dan otoritasnya lebih layak daripada yang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3348}"
