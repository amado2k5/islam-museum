id: concept/al-luwa
class: concept
kind: scientific
label:
  ar: "اللُّوى"
  en: "Al-luwa (stretching with yawning)"
  fr: "Al-luwa (étirement accompagné de bâillements)"
  ur: "لُوی"
  es: "Al-luwa (estiramiento con bostezo)"
summary:
  ar: "يذكر ابن سينا حالاً تعرض للبدن من تواتر الامتلاء في العضل والعروق كالإعياء، تتمدد له العروق ويكثر التثاؤب والتمطي ويحمر الوجه والعين، وأنها إذا كثرت دلت على امتلاء {cite:canon-ibn-sina-print-v2 p.117}"
  en: "Ibn Sina describes a state that comes to the body from the recurrence of fullness in the muscles and vessels, like fatigue, with stretching of the vessels, much yawning and stretching and a red face and eye, and says that when frequent it points to fullness {cite:canon-ibn-sina-print-v2 p.117}"
  fr: "Ibn Sina décrit un état qui survient au corps du fait de la récurrence de la plénitude dans les muscles et les vaisseaux, semblable à la fatigue, avec tension des vaisseaux, bâillements et étirements fréquents, visage et œil rouges, et dit que, lorsqu’il est fréquent, il indique la plénitude {cite:canon-ibn-sina-print-v2 p.117}"
  ur: "ابن سینا ایک حالت بیان کرتا ہے جو پٹھوں اور رگوں میں بھراؤ کے بار بار ہونے سے بدن کو تھکن کی طرح لاحق ہوتی ہے، رگیں کھنچتی ہیں، جمائی اور انگڑائی بہت آتی ہے اور چہرہ اور آنکھ سرخ ہو جاتے ہیں، اور کہتا ہے کہ جب وہ بار بار ہو تو بھراؤ کی دلیل ہے {cite:canon-ibn-sina-print-v2 p.117}۔"
  es: "Ibn Sina describe un estado que se produce en el cuerpo por la recurrencia de la plenitud en los músculos y vasos, como fatiga, con distensión de los vasos, muchos bostezos y estiramientos, y enrojecimiento de la cara y los ojos, y dice que cuando es frecuente apunta a la plenitud {cite:canon-ibn-sina-print-v2 p.117}."
