id: concept/zij-sabi-mediterranean-and-its-islands
class: concept
kind: scientific
label: { ar: "بحر مصر والروم وجزائره في الزيج الصابي", en: "The sea of Egypt and the Romans and its islands", ur: "بحر مصر و روم اور اس کے جزیرے", es: "El mar de Egipto y los romanos y sus islas", fr: "La mer d'Égypte, les Romains et ses îles", tr: "Mısır Denizi, Romalılar ve Sabian Zij'deki adaları", id: "Laut Mesir dan bangsa Romawi serta pulau-pulau di Sabian Zij" }
summary:
  ar: "يصف البتاني بحر مصر والروم، وهو البحر المتوسط، خارجاً من الخليج الذي يخرج من بحر أوقيانس عند غديرة مقابل الأندلس إلى صور وصيدا في الشرق، وطوله خمسة آلاف ميل وعرضه يختلف من ستمائة إلى سبعمائة وثمانمائة في مواضع. ويذكر فيه مائة واثنتين وستين جزيرة عامرة منها خمس عظام: سردانية وقبرس وصقلية وإقريطش وجزيرة أخرى، وخليجين أحدهما إلى الشمال والآخر نحو أرض لا يتضح اسمها في المسح. {cite:zij-sabi-nallino-byblion pp.30-31}."
  en: "Al-Battani describes the sea of Egypt and the Romans, the Mediterranean, running from the strait that leaves Oceanus at Gadira opposite al-Andalus east to Tyre and Sidon, five thousand miles long and varying from six hundred to seven hundred and eight hundred miles wide in places. He counts in it one hundred and sixty-two inhabited islands, five of them great: Sardinia, Cyprus, Sicily, Crete and one more, and two gulfs, one to the north and one toward a land whose name is unclear in the scan. {cite:zij-sabi-nallino-byblion pp.30-31}."
  ur: "البتانی بحر مصر و روم یعنی بحر متوسط کو بیان کرتے ہیں جو اس آبنائے سے نکلتا ہے جو بحر اوقیانس سے غدیرہ پر اندلس کے مقابل نکلتی ہے اور مشرق میں صور و صیدا تک جاتا ہے، پانچ ہزار میل لمبا اور مقامات پر چھ سو، سات سو اور آٹھ سو میل چوڑا۔ وہ اس میں ایک سو باسٹھ آباد جزیرے گنتے ہیں جن میں پانچ بڑے ہیں: سردانیہ، قبرص، صقلیہ، اقریطش اور ایک اور، اور دو خلیج، ایک شمال کی طرف اور دوسرا ایک ایسی سرزمین کی طرف جس کا نام اسکین میں واضح نہیں۔ {cite:zij-sabi-nallino-byblion pp.30-31}۔"
  es: "Al-Battani describe el mar de Egipto y los romanos, el Mediterráneo, que se extiende desde el estrecho que separa Océano en Gadira, frente a al-Ándalus, hacia el este, hasta Tiro y Sidón, con una longitud de cinco mil millas y una anchura que varía entre seiscientas y setecientas ochocientas millas en algunos puntos. En él enumera ciento sesenta y dos islas habitadas, cinco de ellas importantes: Cerdeña, Chipre, Sicilia, Creta y una más, y dos golfos, uno al norte y otro hacia una tierra cuyo nombre no se distingue claramente en el escaneo. {cite:zij-sabi-nallino-byblion pp.30-31}."
  fr: "Al-Battani décrit la mer d'Égypte et des Romains, la Méditerranée, s'étendant du détroit qui sépare Océan à Gadira, face à al-Andalus, à l'est jusqu'à Tyr et Sidon. Elle mesure cinq mille milles de long et sa largeur varie par endroits de six cents à sept cents milles de large. Il y dénombre cent soixante-deux îles habitées, dont cinq grandes: la Sardaigne, Chypre, la Sicile, la Crète et une autre, ainsi que deux golfes, l'un au nord et l'autre vers une terre dont le nom est indéchiffrable dans le scan. {cite:zij-sabi-nallino-byblion pp.30-31}."
  tr: "El-Battani, Mısır ve Romalıların denizi olan Akdeniz'i, Endülüs'ün karşısındaki Gadir'de Okyanusya Denizi'nden açılan körfezden doğuda Sur ve Sidon'a kadar uzanan bir deniz olarak tanımlar. Uzunluğu beş bin mil, genişliği ise bazı yerlerde altı yüz, yedi yüz ve sekiz yüz mil arasında değişmektedir. Beş büyük ada da dahil olmak üzere yüz altmış iki yerleşim yeri olan adadan bahseder: Sardinya, Kıbrıs, Sicilya, Girit ve bir başka ada; ayrıca biri kuzeyde, diğeri ise haritada adı net olmayan bir kara parçasına doğru olmak üzere iki körfezden söz eder. {cite:zij-sabi-nallino-byblion pp.30-31}."
  id: "Al-Battani menggambarkan laut Mesir dan Romawi, yaitu Laut Mediterania, yang membentang dari teluk yang terbuka dari Laut Oseania di Ghadir, di seberang Andalusia, hingga Tirus dan Sidon di timur. Panjangnya lima ribu mil, dan lebarnya bervariasi antara enam ratus dan tujuh ratus delapan ratus mil di beberapa tempat. Ia menyebutkan seratus enam puluh dua pulau berpenghuni, termasuk lima pulau besar: Sardinia, Siprus, Sisilia, Kreta, dan satu pulau lainnya, serta dua teluk, satu di utara dan yang lainnya menuju daratan yang namanya tidak jelas dalam survei tersebut. {cite:zij-sabi-nallino-byblion pp.30-31}."
