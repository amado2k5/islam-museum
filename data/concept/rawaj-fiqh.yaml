id: concept/rawaj-fiqh
class: concept
kind: legal
label:
  ar: "الرواج"
  en: "Rawaj: the currency in circulation and its effect on an unspecified price in a sale"
  ur: "رواج ⁦(رائج کرنسی اور ثمن کی تعیین)⁩"
  es: "Rawaj: la moneda en circulación y su efecto sobre un precio no especificado en una venta"
  fr: "Rawaj: la monnaie en circulation et son effet sur un prix non spécifié lors d'une vente"
  tr: "Popülerlik"
  id: "Popularitas"
summary:
  ar: "الرواج لغة الإسراع في الشيء، ويقال راج الشيء إذا نفق وكثر طلابه، وراجت الدراهم إذا كثر التعامل بها، والمعنى الاصطلاحي لا يخرج عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} وللرواج أثر في تعيين النقد عند إطلاق الثمن في البيوع، لأن الثمن يشترط فيه العلم وإلا فسد العقد للمنازعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} فإذا ذكر مقدار الثمن دون نوعه، وكان في البلد نقد واحد يتعامل به الناس صح العقد وانصرف إلى ذلك النقد، وكذلك إذا تعددت النقود وغلب أحدها رواجا فإنه ينصرف إليه بدلالة الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} أما إذا تساوت النقود في الرواج والقيمة فيخير المشتري في أيها يؤدي، ويجبر البائع على قبوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} وإذا اختلفت في القيمة وتساوت في الرواج فالبيع فاسد باتفاق، لأن الجهالة تفضي إلى المنازعة، وقال الحنفية: يصح إن ارتفعت الجهالة في المجلس ببيان أحدها برضا الطرف الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037}"
  en: "Rawaj means speed in something; in the lexicon, a thing that sells and is in demand, and coins that are much used in dealing. The technical sense does not differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} Circulation affects which currency is meant when a sale states a price without naming it. The price must be known, or the contract is void because the uncertainty leads to dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} If a sum is named without its currency and the town has one currency in use, the sale is valid and that currency is meant; the same holds when several currencies circulate but one predominates, since the known custom is treated as stated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} If several currencies are equal in value and in circulation, the buyer chooses which to pay and the seller must accept it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} If they differ in value but are equal in circulation, the sale is void by consensus, since the uncertainty leads to dispute; the Hanafis hold that it is valid if the uncertainty is removed in the session by one party's statement and the other's consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037}"
  ur: "رواج کا مطلب چیز کا نفاذ اور مانگ میں ہونا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} بیع میں ثمن کی مقدار بتائی جائے اور کرنسی کا ذکر نہ ہو تو جو کرنسی شہر میں رائج ہو وہی مراد ہوتی ہے؛ اگر کئی کرنسیاں ہوں اور قیمت میں برابر ہوں تو خریدار کو اختیار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} قیمت میں فرق ہو تو بیع فاسد ہے، حنفیہ کے نزدیک مجلس میں تعیین ہو جائے تو درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037}"
  es: "Rawaj significa velocidad en algo; en el léxico, una cosa que se vende y tiene demanda, y monedas que se usan mucho en el comercio. El sentido técnico no difiere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} La circulación afecta a qué moneda se refiere cuando una venta indica un precio sin nombrarlo. El precio debe ser conocido, o el contrato es nulo porque la incertidumbre lleva a la disputa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} Si se nombra una suma sin su moneda y la ciudad tiene una moneda en uso, la venta es válida y se refiere a esa moneda; lo mismo ocurre cuando circulan varias monedas pero una predomina, ya que la costumbre conocida se trata como establecida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} Si varias monedas tienen el mismo valor y están en circulación, el comprador elige cuál pagar y el vendedor debe aceptarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} Si difieren en valor pero tienen la misma circulación, la venta es nula por consenso, ya que la incertidumbre genera disputa; los hanafíes sostienen que es válida si la incertidumbre se elimina en la sesión mediante la declaración de una de las partes y el consentimiento de la otra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037}"
  fr: "Rawaj signifie rapidité; dans le lexique, il désigne un bien qui se vend et est demandé, ainsi que des pièces de monnaie couramment utilisées dans les transactions commerciales. Le sens technique reste le même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} La circulation monétaire influence la devise concernée lorsqu'un prix est mentionné sans la préciser. Le prix doit être connu, faute de quoi le contrat est nul, car l'incertitude engendre des litiges. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} Si une somme est mentionnée sans indication de devise et que la ville utilise une seule monnaie, la vente est valable et c'est cette monnaie qui est concernée; il en va de même lorsque plusieurs monnaies circulent mais qu'une prédomine, car c'est la coutume établie qui prévaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} Si plusieurs monnaies ont la même valeur et sont en circulation, l'acheteur choisit celle qu'il souhaite payer et le vendeur est tenu de l'accepter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} Si des biens diffèrent par leur valeur mais sont de même valeur marchande, la vente est nulle par consensus, car l'incertitude engendre un litige; les hanafites estiment qu'elle est valable si l'incertitude est levée lors de la séance par une déclaration de l'une des parties et le consentement de l'autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037}"
  tr: "Rawaj kelimenin tam anlamıyla bir şeyi hızlandırmaktır. Bir şeyin harcandığında ve çok sayıda arayıcı olduğunda 'raja' olduğu söylenir, 'rajat al-dirham' ise kapsamlı işlemler anlamına gelir. Teknik anlamı bundan öteye geçmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9036} Fiyat satışta kullanıldığında kullanım paranın belirlenmesini etkiler, çünkü fiyat bilgi gerektirir; aksi takdirde anlaşmazlık nedeniyle sözleşme geçersiz olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9036} Fiyatın tutarı türü olmadan belirtilirse ve ülkede sadece bir para birimi kullanılırsa, sözleşme geçerlidir ve nakit kullanılır. Benzer şekilde, birden fazla para birimi varsa ve biri popülerse, bu belirli duruma işaret eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9037} Ancak para kullanım ve değer olarak eşitse, alıcı ödeyeceği şeyi seçer ve satıcı kabul etmek zorunda kalır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9037} Değer farkı varsa ama kullanım eşitse, satış oybirliğiyle geçersizdir, çünkü cehalet anlaşmazlığa yol açar. Hanafiler şöyle demiştir: Bir tarafın diğer tarafın rızasıyla mahkemede cehalet artarsa geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9037}"
  id: "Rawaj secara harfiah mempercepat sesuatu. Dikatakan bahwa sesuatu disebut 'raja' ketika digunakan dan banyak pencari terlibat, dan 'rajat al-dirham' berarti transaksi yang luas. Makna teknisnya tidak lebih dari itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9036} Penggunaan memengaruhi penentuan uang ketika harga digunakan untuk penjualan, karena harga membutuhkan pengetahuan; jika tidak, kontrak menjadi tidak sah karena perselisihan. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.9036} Jika jumlah harga disebutkan tanpa jenisnya, dan hanya ada satu mata uang di negara yang digunakan oleh masyarakat, kontrak berlaku dan uang tunai digunakan. Demikian pula, jika ada beberapa mata uang dan salah satunya populer, kontrak merujuk pada kasus spesifik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9037} Tetapi jika uang sama dalam penggunaan dan nilai, pembeli memilih mana yang akan membayar, dan penjual terpaksa menerimanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9037} Jika ada perbedaan nilai tetapi sama dalam penggunaan, maka penjualan tidak sah berdasarkan konsensus, karena ketidaktahuan menyebabkan perselisihan. Hanafi berkata: Sah jika ketidaktahuan meningkat di pengadilan oleh satu pihak dengan persetujuan pihak lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9037}"
