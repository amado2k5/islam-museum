id: concept/rawaj-fiqh
class: concept
kind: legal
label:
  ar: "الرواج"
  en: "Rawaj: the currency in circulation and its effect on an unspecified price in a sale"
  ur: "رواج (رائج کرنسی اور ثمن کی تعیین)"
summary:
  ar: "الرواج لغة الإسراع في الشيء، ويقال راج الشيء إذا نفق وكثر طلابه، وراجت الدراهم إذا كثر التعامل بها، والمعنى الاصطلاحي لا يخرج عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} وللرواج أثر في تعيين النقد عند إطلاق الثمن في البيوع، لأن الثمن يشترط فيه العلم وإلا فسد العقد للمنازعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} فإذا ذكر مقدار الثمن دون نوعه، وكان في البلد نقد واحد يتعامل به الناس صح العقد وانصرف إلى ذلك النقد، وكذلك إذا تعددت النقود وغلب أحدها رواجا فإنه ينصرف إليه بدلالة الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} أما إذا تساوت النقود في الرواج والقيمة فيخير المشتري في أيها يؤدي، ويجبر البائع على قبوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} وإذا اختلفت في القيمة وتساوت في الرواج فالبيع فاسد باتفاق، لأن الجهالة تفضي إلى المنازعة، وقال الحنفية: يصح إن ارتفعت الجهالة في المجلس ببيان أحدها برضا الطرف الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037}"
  en: "Rawaj means speed in something; in the lexicon, a thing that sells and is in demand, and coins that are much used in dealing. The technical sense does not differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} Circulation affects which currency is meant when a sale states a price without naming it. The price must be known, or the contract is void because the uncertainty leads to dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} If a sum is named without its currency and the town has one currency in use, the sale is valid and that currency is meant; the same holds when several currencies circulate but one predominates, since the known custom is treated as stated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} If several currencies are equal in value and in circulation, the buyer chooses which to pay and the seller must accept it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} If they differ in value but are equal in circulation, the sale is void by consensus, since the uncertainty leads to dispute; the Hanafis hold that it is valid if the uncertainty is removed in the session by one party's statement and the other's consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037}"
  ur: "رواج کا مطلب چیز کا نفاذ اور مانگ میں ہونا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036} بیع میں ثمن کی مقدار بتائی جائے اور کرنسی کا ذکر نہ ہو تو جو کرنسی شہر میں رائج ہو وہی مراد ہوتی ہے؛ اگر کئی کرنسیاں ہوں اور قیمت میں برابر ہوں تو خریدار کو اختیار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037} قیمت میں فرق ہو تو بیع فاسد ہے، حنفیہ کے نزدیک مجلس میں تعیین ہو جائے تو درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9037}"
