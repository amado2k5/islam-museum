label: { ar: "الحسبة", en: "Hisba (market supervision and enjoining good)" }
summary:
  ar: "نظام إداري وفقهي نشأ في الدولة الإسلامية، أصله الأمر بالمعروف والنهي عن المنكر، ويتولاه المحتسب بالإشراف على الأسواق والموازين والمكاييل وصيانة الآداب العامة ومحاربة الغش في البيوع. وتذكر مقدمة محققي معالم القربة أن الحلفاء الراشدين تولوها بأنفسهم في بداية الأمر، ثم أنابوا عنهم المحتسبين مع اتساع الفتوح {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}."
  en: "An administrative and juristic institution of the Islamic state, rooted in enjoining good and forbidding wrong. The holder, the muhtasib, supervises markets, weights and measures, public morals and fraud in sales. The editors of Maʿalim al-Qurba note that the rightly guided caliphs held it themselves at first, then appointed deputies as the conquests grew {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}."
sources: [source/maalim-qurba-edition-1976]
