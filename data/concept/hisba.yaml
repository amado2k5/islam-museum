id: concept/hisba
education:
  did_you_know:
    ar: "الحسبة نظام إداري وفقهي أصله الأمر بالمعروف والنهي عن المنكر؛ يشرف المحتسب على الأسواق والموازين والمكاييل وصيانة الآداب العامة."
    en: "The hisba is the administrative-juristic office rooted in enjoining right and forbidding wrong; the muhtasib oversees markets, weights and measures and the keeping of public morals."
    ur: "حسبہ ایک انتظامی و فقہی ادارہ ہے جس کی جڑ امر بالمعروف و نہی عن المنکر ہے؛ محتسب بازاروں، تول ناپ اور اخلاقِ عامہ کی حفاظت کی نگرانی کرتا ہے۔"
    sources: [source/maalim-qurba-edition-1976, source/usul-iqtisad-islami-0660]
class: concept
kind: legal
label: { ar: "الحسبة", en: "Hisba (market supervision and enjoining good)" }
summary:
  ar: "نظام إداري وفقهي نشأ في الدولة الإسلامية، أصله الأمر بالمعروف والنهي عن المنكر، ويتولاه المحتسب بالإشراف على الأسواق والموازين والمكاييل وصيانة الآداب العامة ومحاربة الغش في البيوع. وتذكر مقدمة محققي معالم القربة أن الحلفاء الراشدين تولوها بأنفسهم في بداية الأمر، ثم أنابوا عنهم المحتسبين مع اتساع الفتوح {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}. ويعدّ المؤلف من وظائف الحسبة مراقبة الأسواق لمنع الغش في السلع والخدمات، ومنع التطفيف في المكاييل والموازين، ومنع الاحتكار، وتسعير السلع والأجور والمنافع عند اللزوم، والحفاظ على الصحة والبيئة باختيار مواقع الحرف والصنائع {cite:usul-iqtisad-islami-0660 p. 90}، ويدرجها في وظائف الدولة الاقتصادية {cite:usul-iqtisad-islami-0660 p. 89}. الحسبة عند المؤلف الأمر بالمعروف والنهي عن المنكر بغير تجسس، وبالمعنى الضيق شرطة الأسواق، ويعدّ حديث الصبرة من أول الاحتساب، ومن نطاقها مراقبة الموازين والصحة والربا والغش، وللحسبة درجات تبدأ بالتعريف وتنتهي بالتعزير. ويعرّف مدخل «حسبة» في الموسوعة الحسبة اصطلاحاً بأنها الأمر بالمعروف إذا ظهر تركه والنهي عن المنكر إذا ظهر فعله، ويقيسها الماوردي إلى القضاء وولاية المظالم: فهي توافق القضاء في قبول الدعاوى في حقوق الآدميين وإلزام المقر الموسر بالخروج من الحق، وتقصر عنه في عموم الدعاوى والحقوق التي يتداخلها إنكار، وتزيد عليه في التعرض للمنكر بلا خصم مستعد وفي الاكتفاء بما يظهر، وولاية المظالم أعلى منها وولاية الحسبة أخفضها. {cite:fiqh-mawsua-noor-doc p.223-226} ويقرر المدخل أن الحسبة واجبة في الجملة لا بالنظر إلى متعلقها على قول ابن القيم في الطرق الحكمية، فإذا تعلقت بمندوب أو مكروه كانت مندوبة تبعاً لمتعلقها، وقد يحوّلها ما يترتب عليها من مفسدة إلى محظور. {cite:fiqh-mawsua-noor-doc p.228-229} ويشترط للمتولي توليها أن يكون مكلفاً عاقلاً وأن يعلم أحكام الشريعة المأمور بها والمنهي عنها وأن يعلم صفة التغيير، ويشترط في صاحب الولاية العدالة خلافاً للمتطوع عند الجمهور، وذهب أبو سعيد الأصطخري إلى اشتراط الاجتهاد الشرعي في المحتسب ليجتهد برأيه فيما اختلف فيه. {cite:fiqh-mawsua-noor-doc p.234-238}"
  en: "An administrative and juristic institution of the Islamic state, rooted in enjoining good and forbidding wrong. The holder, the muhtasib, supervises markets, weights and measures, public morals and fraud in sales. The editors of Maʿalim al-Qurba note that the rightly guided caliphs held it themselves at first, then appointed deputies as the conquests grew {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}. The encyclopedia's hisba entry defines it technically as enjoining what is good when its abandonment is manifest and forbidding what is evil when its commission is manifest. Al-Mawardi measures it against the judiciary and the office of redressing grievances: it agrees with adjudication in hearing claims about human rights and compelling the solvent wrongdoer, falls short in the generality of suits and rights involving denial, and exceeds it in acting against evil without a ready claimant and in relying on outward signs, while the office of grievances ranks above it and hisba below. {cite:fiqh-mawsua-noor-doc p.223-226} On Ibn al-Qayyim's authority the entry records that hisba is obligatory in general rather than according to its object; attached to a recommended or disliked act it becomes recommended in kind, and what it entails of harm may turn it forbidden. {cite:fiqh-mawsua-noor-doc p.228-229} Its conditions include legal capacity and knowledge of the rules of the Shari'a; the jurists dispute whether justice is required of the officeholder, and Abu Sa'id al-Istakhri of the Shafi'is holds that the muhtasib must reach the level of juridical ijtihad so as to bind people to his view in contested matters. {cite:fiqh-mawsua-noor-doc p.234-238}"
