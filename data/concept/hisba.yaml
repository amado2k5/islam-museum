id: concept/hisba
education:
  did_you_know:
    ar: "الحسبة نظام إداري وفقهي أصله الأمر بالمعروف والنهي عن المنكر؛ يشرف المحتسب على الأسواق والموازين والمكاييل وصيانة الآداب العامة."
    en: "The hisba is the administrative-juristic office rooted in enjoining right and forbidding wrong; the muhtasib oversees markets, weights and measures and the keeping of public morals."
    ur: "حسبہ ایک انتظامی و فقہی ادارہ ہے جس کی جڑ امر بالمعروف و نہی عن المنکر ہے؛ محتسب بازاروں، تول ناپ اور اخلاقِ عامہ کی حفاظت کی نگرانی کرتا ہے۔"
    sources: [source/maalim-qurba-edition-1976, source/usul-iqtisad-islami-0660]
class: concept
kind: legal
label: { ar: "الحسبة", en: "Hisba (market supervision and enjoining good)" }
summary:
  ar: "نظام إداري وفقهي نشأ في الدولة الإسلامية، أصله الأمر بالمعروف والنهي عن المنكر، ويتولاه المحتسب بالإشراف على الأسواق والموازين والمكاييل وصيانة الآداب العامة ومحاربة الغش في البيوع. وتذكر مقدمة محققي معالم القربة أن الحلفاء الراشدين تولوها بأنفسهم في بداية الأمر، ثم أنابوا عنهم المحتسبين مع اتساع الفتوح {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}. ويعدّ المؤلف من وظائف الحسبة مراقبة الأسواق لمنع الغش في السلع والخدمات، ومنع التطفيف في المكاييل والموازين، ومنع الاحتكار، وتسعير السلع والأجور والمنافع عند اللزوم، والحفاظ على الصحة والبيئة باختيار مواقع الحرف والصنائع {cite:usul-iqtisad-islami-0660 p. 90}، ويدرجها في وظائف الدولة الاقتصادية {cite:usul-iqtisad-islami-0660 p. 89}. الحسبة عند المؤلف الأمر بالمعروف والنهي عن المنكر بغير تجسس، وبالمعنى الضيق شرطة الأسواق، ويعدّ حديث الصبرة من أول الاحتساب، ومن نطاقها مراقبة الموازين والصحة والربا والغش، وللحسبة درجات تبدأ بالتعريف وتنتهي بالتعزير."
  en: "An administrative and juristic institution of the Islamic state, rooted in enjoining good and forbidding wrong. The holder, the muhtasib, supervises markets, weights and measures, public morals and fraud in sales. The editors of Maʿalim al-Qurba note that the rightly guided caliphs held it themselves at first, then appointed deputies as the conquests grew {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}."
