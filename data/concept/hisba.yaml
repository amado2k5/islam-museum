label: { ar: "الحسبة", en: "Hisba (market supervision and enjoining good)", es: "Hisba (supervisión del mercado y fomento del bien)", fr: "Hisba (surveillance du marché et injonction sur les biens)", ur: "حسبہ ⁦(مارکیٹ کی نگرانی اور نیکی کا حکم دینا)⁩" }
summary:
  ar: "نظام إداري وفقهي نشأ في الدولة الإسلامية، أصله الأمر بالمعروف والنهي عن المنكر، ويتولاه المحتسب بالإشراف على الأسواق والموازين والمكاييل وصيانة الآداب العامة ومحاربة الغش في البيوع. وتذكر مقدمة محققي معالم القربة أن الحلفاء الراشدين تولوها بأنفسهم في بداية الأمر، ثم أنابوا عنهم المحتسبين مع اتساع الفتوح {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}. ويعدّ المؤلف من وظائف الحسبة مراقبة الأسواق لمنع الغش في السلع والخدمات، ومنع التطفيف في المكاييل والموازين، ومنع الاحتكار، وتسعير السلع والأجور والمنافع عند اللزوم، والحفاظ على الصحة والبيئة باختيار مواقع الحرف والصنائع {cite:usul-iqtisad-islami-0660 p. 90}، ويدرجها في وظائف الدولة الاقتصادية {cite:usul-iqtisad-islami-0660 p. 89}. الحسبة عند المؤلف الأمر بالمعروف والنهي عن المنكر بغير تجسس، وبالمعنى الضيق شرطة الأسواق، ويعدّ حديث الصبرة من أول الاحتساب، ومن نطاقها مراقبة الموازين والصحة والربا والغش، وللحسبة درجات تبدأ بالتعريف وتنتهي بالتعزير. ويعرّف مدخل «حسبة» في الموسوعة الحسبة اصطلاحاً بأنها الأمر بالمعروف إذا ظهر تركه والنهي عن المنكر إذا ظهر فعله، ويقيسها الماوردي إلى القضاء وولاية المظالم: فهي توافق القضاء في قبول الدعاوى في حقوق الآدميين وإلزام المقر الموسر بالخروج من الحق، وتقصر عنه في عموم الدعاوى والحقوق التي يتداخلها إنكار، وتزيد عليه في التعرض للمنكر بلا خصم مستعد وفي الاكتفاء بما يظهر، وولاية المظالم أعلى منها وولاية الحسبة أخفضها. {cite:fiqh-mawsua-noor-doc p.223-226} ويقرر المدخل أن الحسبة واجبة في الجملة لا بالنظر إلى متعلقها على قول ابن القيم في الطرق الحكمية، فإذا تعلقت بمندوب أو مكروه كانت مندوبة تبعاً لمتعلقها، وقد يحوّلها ما يترتب عليها من مفسدة إلى محظور. {cite:fiqh-mawsua-noor-doc p.228-229} ويشترط للمتولي توليها أن يكون مكلفاً عاقلاً وأن يعلم أحكام الشريعة المأمور بها والمنهي عنها وأن يعلم صفة التغيير، ويشترط في صاحب الولاية العدالة خلافاً للمتطوع عند الجمهور، وذهب أبو سعيد الأصطخري إلى اشتراط الاجتهاد الشرعي في المحتسب ليجتهد برأيه فيما اختلف فيه. {cite:fiqh-mawsua-noor-doc p.234-238}"
  en: "An administrative and juristic institution of the Islamic state, rooted in enjoining good and forbidding wrong. The holder, the muhtasib, supervises markets, weights and measures, public morals and fraud in sales. The editors of Maʿalim al-Qurba note that the rightly guided caliphs held it themselves at first, then appointed deputies as the conquests grew {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}. The encyclopedia's hisba entry defines it technically as enjoining what is good when its abandonment is manifest and forbidding what is evil when its commission is manifest. Al-Mawardi measures it against the judiciary and the office of redressing grievances: it agrees with adjudication in hearing claims about human rights and compelling the solvent wrongdoer, falls short in the generality of suits and rights involving denial, and exceeds it in acting against evil without a ready claimant and in relying on outward signs, while the office of grievances ranks above it and hisba below. {cite:fiqh-mawsua-noor-doc p.223-226} On Ibn al-Qayyim's authority the entry records that hisba is obligatory in general rather than according to its object; attached to a recommended or disliked act it becomes recommended in kind, and what it entails of harm may turn it forbidden. {cite:fiqh-mawsua-noor-doc p.228-229} Its conditions include legal capacity and knowledge of the rules of the Shari'a; the jurists dispute whether justice is required of the officeholder, and Abu Sa'id al-Istakhri of the Shafi'is holds that the muhtasib must reach the level of juridical ijtihad so as to bind people to his view in contested matters. {cite:fiqh-mawsua-noor-doc p.234-238}"
  es: "Una institución administrativa y jurídica del estado islámico, basada en ordenar el bien y prohibir el mal. Su titular, el muhtasib, supervisa los mercados, los pesos y medidas, la moral pública y el fraude en las ventas. Los editores de Maʿalim al-Qurba señalan que los califas bien guiados la ejercieron ellos mismos al principio, y luego nombraron delegados a medida que crecían las conquistas {cite:maalim-qurba-edition-1976 p.5} {cite:maalim-qurba-edition-1976 p.6}. La entrada hisba de la enciclopedia la define técnicamente como ordenar lo que es bueno cuando su abandono es manifiesto y prohibir lo que es malo cuando su comisión es manifiesta. Al-Mawardi lo compara con el poder judicial y la oficina de reparación de agravios: coincide con la adjudicación al escuchar reclamos sobre derechos humanos y obligar al infractor solvente, se queda corto en la generalidad de demandas y derechos que implican negación, y lo supera al actuar contra el mal sin un reclamante dispuesto y al confiar en signos externos, mientras que la oficina de agravios se sitúa por encima de él y la hisba por debajo. {cite:fiqh-mawsua-noor-doc p.223-226} En la autoridad de Ibn al-Qayyim, la entrada registra que la hisba es obligatoria en general más que según su objeto; adjunta a un acto recomendado o desaconsejable se vuelve recomendada en especie, y lo que implica de daño puede convertirla en prohibida. {cite:fiqh-mawsua-noor-doc p.228-229} Sus condiciones incluyen capacidad legal y conocimiento de las reglas de la Sharia; Los juristas discrepan sobre si se exige justicia al titular del cargo, y Abu Sa'id al-Istakhri, de la escuela Shafi'i, sostiene que el muhtasib debe alcanzar el nivel de ijtihad jurídica para vincular a la gente con su opinión en asuntos controvertidos. {cite:fiqh-mawsua-noor-doc p.234-238}"
  fr: "Institution administrative et juridique de l'État islamique, la hisba repose sur l'injonction au bien et l'interdiction du mal. Son titulaire, le muhtasib, supervise les marchés, les poids et mesures, les mœurs publiques et la fraude commerciale. Les éditeurs de Maʿalim al-Qurba notent que les califes bien guidés la détenaient eux-mêmes à l'origine, puis nommèrent des représentants à mesure que les conquêtes s'étendaient (voir: maalim-qurba-edition-1976, p. 5 et p. 6). L'article consacré à la hisba dans l'encyclopédie la définit techniquement comme l'obligation d'ordonner le bien lorsque son abandon est manifeste et d'interdire le mal lorsque sa commission est manifeste. Al-Mawardi compare la hisba au pouvoir judiciaire et à l'office des griefs: elle s'accorde avec l'adjudication pour entendre les plaintes relatives aux droits de l'homme et contraindre le contrevenant solvable à agir, elle est moins étendue quant à la portée des actions et des droits impliquant un déni, et elle la surpasse dans la lutte contre le mal sans plaignant immédiat et dans le recours aux signes extérieurs, tandis que l'office des griefs la place au-dessus et la hisba en dessous. {cite:fiqh-mawsua-noor-doc p.223-226} Selon Ibn al-Qayyim, l'entrée indique que la hisba est obligatoire en général, indépendamment de son objet; attachée à un acte recommandé ou désapprouvé, elle devient recommandée par nature, et ce qu'elle implique en termes de préjudice peut la rendre interdite. {cite:fiqh-mawsua-noor-doc p.228-229} Ses conditions comprennent la capacité juridique et la connaissance des règles de la charia; Les juristes débattent de l'obligation de rendre justice au titulaire de la charge, et Abu Sa'id al-Istakhri, de l'école chaféite, soutient que le muhtasib doit atteindre le niveau de l'ijtihad juridique afin de contraindre les personnes à suivre son avis dans les affaires litigieuses. {cite:fiqh-mawsua-noor-doc p.234-238}"
  ur: "اسلامی ریاست کا ایک انتظامی اور فقہی ادارہ جس کی جڑیں نیکی کا حکم دینے اور برائی سے منع کرنے میں ہیں۔ ہولڈر، محتسب، بازاروں، تول و پیمانوں، عوامی اخلاقیات اور فروخت میں دھوکہ دہی کی نگرانی کرتا ہے۔ معلم القربا کے مدیران نوٹ کرتے ہیں کہ صحیح رہنمائی کرنے والے خلفاء نے پہلے خود اس کا انعقاد کیا، پھر فتوحات کے بڑھنے کے ساتھ ساتھ نائب مقرر کیے انسائیکلو پیڈیا کا ہسبا اندراج تکنیکی طور پر اس کی تعریف کرتا ہے کہ جب اس کا ترک کرنا ظاہر ہو تو نیکی کا حکم دینا اور جب اس کا کام ظاہر ہو تو برائی سے منع کرنا۔ الماوردی اسے عدلیہ اور شکایات کے ازالے کے دفتر کے خلاف اقدام کرتا ہے: یہ انسانی حقوق کے بارے میں دعووں کی سماعت میں فیصلے سے اتفاق کرتا ہے اور غلط مجرم کو مجبور کرتا ہے، اس سے انکار کرنے والے مقدموں اور حقوق کی عمومیت میں کمی کرتا ہے، اور کسی تیار دعویدار کے بغیر برائی کے خلاف کام کرنے میں اس سے بڑھ جاتا ہے اور دفتر کے اوپر بھروسہ کرتا ہے اور اس پر اعتماد کرتا ہے۔ ذیل میں hisba. {حوالہ: فقہ الموسوعہ نور دستاویز ص 223-226} ابن قیم کی سند میں درج ہے کہ حسبہ اپنے مقصد کے مطابق عام طور پر واجب ہے۔ کسی تجویز کردہ یا ناپسندیدہ عمل سے منسلک ہو کر اس کی سفارش کی جاتی ہے، اور اس سے جو نقصان ہوتا ہے وہ اسے حرام کر سکتا ہے۔ {حوالہ: فقہ الموسوعہ نور دستاویز ص 228-229} اس کی شرائط میں شرعی صلاحیت اور شریعت کے احکام کا علم شامل ہے۔ فقہاء اس بات پر اختلاف کرتے ہیں کہ آیا عہدہ دار سے انصاف کا تقاضا ہے، اور شافعیوں کے ابو سعید الاستخری کا خیال ہے کہ محتسب کو فقہی اجتہاد کے درجے تک پہنچنا چاہیے تاکہ متنازعہ معاملات میں لوگوں کو اس کے نقطہ نظر کا پابند کیا جا سکے۔ {حوالہ: فقہ معاصہ نور دستاویز ص234-238}"
