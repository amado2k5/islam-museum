id: concept/tashrik-associating-in-acts
class: concept
kind: legal
label:
  ar: "التشريك"
  en: "Tashrik (associating another in a sale, an act of worship or a divorce)"
  ur: "تشریک ⁦(کسی کو شریک کرنا: خرید، عبادت یا طلاق میں)⁩"
  es: "Tashrik (asociar a otra persona en una venta, un acto de culto o un divorcio)"
  fr: "Tashrik (associer une autre personne à une vente, un acte de culte ou un divorce)"
  tr: "Paylaşım"
  id: "Berbagi"
summary:
  ar: "التشريك إدخال الغير في الأمر ليكون شريكاً فيه، كأن يشرك المشتري غيره في الشراء. والتشريك في الشراء ونحوه جائز بالاتفاق، ويجوز تشريك ما لا يحتاج إلى نية في نية العبادة كالتجارة مع الحج، ويجوز تشريك عبادتين يدخل بعضهما في بعض كغسلي الجمعة والجنابة، ولا يصح تشريك عبادتين مقصودتين بذاتهما في نية واحدة. وإذا قال لنسائه الأربع: أوقعت عليكن طلقة، وقعت على كل واحدة طلقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5188}"
  en: "Tashrik is bringing another into an affair so that he becomes a partner in it, as when a buyer takes a partner in a purchase. Taking a partner in a sale is lawful by consensus; mixing a purpose that needs no intention into an act of worship is lawful, as trade with the pilgrimage; combining two worships where one falls within the other, as the Friday and the major-impurity washing, is lawful; combining two independent acts of worship under one intention is not. In a divorce addressed to four wives at once, a single pronouncement of one talaq falls on each. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5188}"
  es: "Tashrik consiste en incorporar a otra persona a un asunto para que se convierta en socio, como cuando un comprador incorpora a un socio en una compra. Incorporar a un socio en una venta es lícito por consenso; mezclar un propósito que no requiere intención con un acto de culto es lícito, como el comercio con la peregrinación; combinar dos cultos donde uno se incluye dentro del otro, como el lavado del viernes y el lavado de impureza mayor, es lícito; combinar dos actos de culto independientes bajo una misma intención no lo es. En un divorcio dirigido a cuatro esposas a la vez, una sola declaración de talaq recae sobre cada una. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5188}"
  fr: "Le terme « tashrik » désigne l’implication d’une autre personne dans une affaire, de sorte qu’elle en devienne associée, comme lorsqu’un acheteur prend un partenaire pour un achat. Prendre un partenaire dans une vente est licite par consensus; il est licite d’associer un but ne nécessitant aucune intention à un acte d’adoration, comme le commerce et le pèlerinage; il est licite de combiner deux adorations dont l’une est incluse dans l’autre, comme le vendredi et les ablutions majeures; en revanche, il est illicite de combiner deux actes d’adoration indépendants sous une même intention. Dans le cadre d’un divorce adressé simultanément à quatre épouses, un seul talaq est prononcé pour chacune d’elles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5188}"
  ur: "تشریق کسی دوسرے کو معاملہ میں لاتا ہے تاکہ وہ اس میں شریک ہو جائے جیسا کہ خریدار کسی خریدار میں شریک کرتا ہے۔ فروخت میں شراکت دار لینا اتفاق رائے سے حلال ہے۔ کسی ایسے مقصد کو ملانا جس کی نیت کی ضرورت نہ ہو عبادت میں حلال ہے، جیسا کہ حج کے ساتھ تجارت۔ دو عبادتوں کو جمع کرنا جہاں ایک دوسرے کے اندر آجائے، جیسا کہ جمعہ اور بڑی نجاست کا دھونا، حلال ہے۔ دو آزاد عبادات کو ایک نیت کے تحت جمع کرنا نہیں ہے۔ ایک ہی وقت میں چار بیویوں سے مخاطب ہونے والی طلاق میں، ہر ایک پر ایک ہی طلاق پڑتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5186} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5187}"
  tr: "Ortaklık, alıcının başkalarını da satın alma işine dahil etmesi gibi, bir konuda ortak olmak için başkalarını da dahil etmektir. Satın alma ve benzeri konularda ortak olmak anlaşmayla mümkündür ve ibadet niyeti gerektirmeyen şeyleri paylaşmak da caizdir, örneğin Hac ile ticaret yapmak gibi. Ayrıca, birbirinin parçası olan iki ibadet eylemini paylaşmak da caizdir; örneğin Cuma ghusl ve janabah. Aynı amaçla yapılan iki ibadet eylemini ilişkilendirmek geçerli değildir. Eğer dört eşine 'Üzerinize bir kurşun düştü,' derse, her birine de bir kurşun düşmüştür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5188}"
  id: "Kemitraan adalah melibatkan orang lain dalam suatu hal untuk menjadi mitra di dalamnya, seperti pembeli yang melibatkan orang lain dalam pembelian. Berbagi dalam pembelian dan hal-hal serupa diperbolehkan berdasarkan kesepakatan, dan diperbolehkan berbagi apa yang tidak memerlukan niat untuk beribadah, seperti berdagang dengan Haji. Juga diperbolehkan berbagi dua ibadah yang merupakan bagian dari satu sama lain, seperti Jumat ghusl dan janabah. Tidak sah mengaitkan dua ibadah yang dimaksudkan dengan cara yang sama. Jika dia berkata kepada keempat istrinya: 'Sebuah tembakan telah jatuh pada kalian,' maka satu tembakan telah jatuh pada masing-masing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5188}"
