id: concept/tashrik-associating-in-acts
class: concept
kind: legal
label:
  ar: "التشريك"
  en: "Tashrik (associating another in a sale, an act of worship or a divorce)"
  ur: "تشریک (کسی کو شریک کرنا: خرید، عبادت یا طلاق میں)"
summary:
  ar: "التشريك إدخال الغير في الأمر ليكون شريكاً فيه، كأن يشرك المشتري غيره في الشراء. والتشريك في الشراء ونحوه جائز بالاتفاق، ويجوز تشريك ما لا يحتاج إلى نية في نية العبادة كالتجارة مع الحج، ويجوز تشريك عبادتين يدخل بعضهما في بعض كغسلي الجمعة والجنابة، ولا يصح تشريك عبادتين مقصودتين بذاتهما في نية واحدة. وإذا قال لنسائه الأربع: أوقعت عليكن طلقة، وقعت على كل واحدة طلقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5188}"
  en: "Tashrik is bringing another into an affair so that he becomes a partner in it, as when a buyer takes a partner in a purchase. Taking a partner in a sale is lawful by consensus; mixing a purpose that needs no intention into an act of worship is lawful, as trade with the pilgrimage; combining two worships where one falls within the other, as the Friday and the major-impurity washing, is lawful; combining two independent acts of worship under one intention is not. In a divorce addressed to four wives at once, a single pronouncement of one talaq falls on each. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5188}"
