label:
  ar: يوم الحساب
  en: The Day of Reckoning
  ur: یوم حساب
summary:
  ar: "يوم الحساب في القرآن والسنة: اليوم الذي يُحاسب فيه الناس على أعمالهم، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يحاسب كل إنسان على عمله."
  en: "The Day of Reckoning in Qur'an and Sunnah: the day people are reckoned for their deeds — a sign of the Hour, a day of indescribable terror, when God reckons every person for their deeds."
  ur: "یوم حساب قرآن و سنت میں: وہ دن جب لوگوں کو ان کے اعمال کا حساب دیا جاتا ہے — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ ہر انسان کو اس کے عمل کا حساب دیتا ہے۔"
