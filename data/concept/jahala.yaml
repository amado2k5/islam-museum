label: { ar: "الجهالة", en: "Jahala (uncertainty in a contract or claim)", ur: "جہالت" }
summary:
  ar: "الجهالة في العقود والدعاوى عدم العلم بالمعقود عليه أو المقر له أو المدعى به. وتقسمها الموسوعة إلى ثلاث مراتب: الفاحشة التي تفضي إلى النزاع فتبطل العقد، ومنها بيع الملامسة والمنابذة، وبيع الجزاف الجائز للحاجة، ويختلف الفقهاء في الأجل المجهول والكفالة والوكالة والإقرار والدعوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6638}"
  en: "Jahala in contracts and claims is ignorance of the thing contracted for, of the person in whose favour an acknowledgement is made, or of the claim itself. The encyclopedia divides it into three degrees. The gross kind, which leads to dispute, voids a contract; examples are the sales of touching and throwing, and the sale of goods by lot without weighing, which is allowed out of need. The schools differ on an unknown term, on guarantees, agency, acknowledgement and claims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6638}"
