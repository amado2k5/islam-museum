label: { ar: "الجهالة", en: "Jahala (uncertainty in a contract or claim)", ur: "جہالت", es: "Jahala (incertidumbre en un contrato o reclamación)", fr: "Jahala (incertitude dans un contrat ou une réclamation)", tr: "cehalet", id: "ketidaktahuan" }
summary:
  ar: "الجهالة في العقود والدعاوى عدم العلم بالمعقود عليه أو المقر له أو المدعى به. وتقسمها الموسوعة إلى ثلاث مراتب: الفاحشة التي تفضي إلى النزاع فتبطل العقد، ومنها بيع الملامسة والمنابذة، وبيع الجزاف الجائز للحاجة، ويختلف الفقهاء في الأجل المجهول والكفالة والوكالة والإقرار والدعوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6638}"
  en: "Jahala in contracts and claims is ignorance of the thing contracted for, of the person in whose favour an acknowledgement is made, or of the claim itself. The encyclopedia divides it into three degrees. The gross kind, which leads to dispute, voids a contract; examples are the sales of touching and throwing, and the sale of goods by lot without weighing, which is allowed out of need. The schools differ on an unknown term, on guarantees, agency, acknowledgement and claims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6638}"
  es: "En contratos y reclamaciones, la ignorancia (jahala) se refiere al desconocimiento del objeto del contrato, de la persona a cuyo favor se realiza el reconocimiento o de la reclamación misma. La enciclopedia la divide en tres grados. El grado grave, que da lugar a disputas, anula el contrato; ejemplos de ello son las ventas sin conocimiento previo de los términos y la venta de mercancías por sorteo sin pesarlas, permitida por necesidad. Las distintas escuelas discrepan sobre términos desconocidos, garantías, representación, reconocimiento y reclamaciones. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6626} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6628} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6630} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6632} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6636} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6638}"
  fr: "L'ignorance, en matière de contrats et de créances, désigne la méconnaissance de l'objet du contrat, de la personne en faveur de laquelle une reconnaissance est faite, ou de la créance elle-même. L'encyclopédie la divise en trois degrés. Le degré le plus grave, qui engendre un litige, entraîne la nullité du contrat; on peut citer comme exemples la vente par contact et par jet, et la vente de marchandises par tirage au sort sans pesée, tolérée par nécessité. Les écoles de pensée divergent quant à la notion de clause inconnue, aux garanties, au mandat, à la reconnaissance et aux créances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6638}"
  ur: "معاہدوں اور دعووں میں جہل جس چیز کے لیے معاہدہ کیا گیا ہے، اس شخص کی جس کے حق میں اقرار کیا گیا ہے، یا خود دعویٰ سے لاعلمی ہے۔ انسائیکلوپیڈیا اسے تین درجوں میں تقسیم کرتا ہے۔ مجموعی قسم، جو تنازعہ کا باعث بنتی ہے، معاہدے کو باطل کر دیتی ہے۔ مثالیں چھونے اور پھینکنے کی فروخت، اور بغیر تولے کے سامان کی فروخت، جس کی ضرورت کے بغیر اجازت ہے۔ اسکول ایک نامعلوم اصطلاح، ضمانتوں، ایجنسی، اعتراف اور دعووں پر مختلف ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6626} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6628} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6630} صفحہ 6632} {حوالہ: فقہ الموسوعہ کویتیہ نور v3 ص6636}"
  tr: "Sözleşmelerde ve davalarda cehalet, neyin sözleşme yapıldığını, kabul edildiğini veya talep edildiğini bilmemektir. Ansiklopedi bunları üç seviyeye ayırır: anlaşmazlığa yol açan ve sözleşmeyi geçersiz kılan ahlaksızlık; bunlar arasında temas ve anlaşmazlık satışı; ve ihtiyaç için izin verilen tesadüfi malların satışı. Hukukçular bilinmeyen süre, garanti, vekillik, onay ve dava konusunda farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6638}"
  id: "Ketidaktahuan dalam kontrak dan gugatan berarti tidak mengetahui apa yang dikontrakkan, diakui, atau diklaim. Ensiklopedia membaginya menjadi tiga tingkat: ketidakmoralan yang menyebabkan perselisihan dan membatalkan kontrak; di antaranya adalah penjualan kontak dan sengketa; serta penjualan barang yang tidak sengaja yang diperbolehkan karena kebutuhan. Para ahli hukum berbeda pendapat mengenai periode yang tidak diketahui, jaminan, agensi, pengakuan, dan gugatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6626} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.6628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6636} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6638}"
