label:
  ar: "عكر الزيت"
  en: "Ukr al-zayt (the lees of olive oil)"
  ur: "عکر الزیت"
  es: "Ukr al-zayt (los posos del aceite de oliva)"
  fr: "Ukr al-zayt (les lies d'huile d'olive)"
  tr: "Yağ bulanıklığı"
  id: "Kekeruhan minyak"
summary:
  ar: "عكر الزيت في الكتاب ثفل الزيت، إذا طبخ في إناء من نحاس قبرسي حتى يثخن صلح لما يصلح له الحضض ويفضل عليه، وقد يقع في أخلاط أدوية العين، وإذا عتق كان أجود ويصلح منه حقنة، ومنه الحديث غير المطبوخ على المفاصل لوجع النقرس {cite:canon-ibn-sina-print-v1 pp.623-624}"
  en: "Ukr al-zayt is in the book the lees of olive oil, which, cooked in a vessel of Cyprian copper until thick, serves for what hudud serves and is better than it; it enters mixtures of eye drugs, is better when aged and is made into an enema, and the fresh, uncooked lees is applied on the joints for the pain of gout {cite:canon-ibn-sina-print-v1 pp.623-624}"
  ur: "عکر الزیت کتاب میں زیتون کے تیل کی تلچھٹ ہے جو قبرصی تانبے کے برتن میں گاڑھا ہونے تک پکائی جائے تو ان کاموں کے لیے موزوں ہے جن کے لیے حضض موزوں ہے اور اس سے بہتر ہے؛ آنکھ کی دواؤں کے مرکبات میں شامل ہوتی ہے، پرانی ہو تو بہتر ہے اور اس سے حقنہ بنتا ہے، اور تازہ بغیر پکی ہوئی تلچھٹ جوڑوں پر نقرس کے درد کے لیے لگائی جاتی ہے {cite:canon-ibn-sina-print-v1 pp.623-624}۔"
  es: "Ukr al-zayt es en el libro las posos del aceite de oliva, que, cocinadas en un recipiente de cobre chipriota hasta espesar, sirven para lo que sirve el hudud y son mejores que este; se incorporan a mezclas de medicamentos para los ojos, mejoran con el tiempo y se utilizan para hacer enemas, y los posos frescos, sin cocinar, se aplican en las articulaciones para el dolor de gota {cite:canon-ibn-sina-print-v1 pp.623-624}"
  fr: "L'ukr al-zayt désigne, dans le livre, la lie d'huile d'olive qui, cuite dans un récipient en cuivre chypriote jusqu'à épaississement, remplace le hudud et lui est supérieure; elle entre dans la composition de préparations pour les yeux, est meilleure après vieillissement et sert à la préparation de lavements. La lie fraîche et non cuite est appliquée sur les articulations pour soulager les douleurs de la goutte. {cite:canon-ibn-sina-print-v1 pp.623-624}"
  tr: "Kitaptaki yağ, Kıbrıs bakır kabında kalınlaşana kadar pişirildiğinde 'akar' (yağ posası) olarak kullanılır; mide için uygun olana uygundur ve tercih eder. Göz ilacı karışımlarıyla karıştırılabilir, ancak serbest bırakıldığında daha iyidir ve enjeksiyonlar için uygundur. Bunlar arasında, gut ağrısı için eklemlerde pişmeyen hadis vardır {cite:canon-ibn-sina-print-v1 s.623-624}"
  id: "Minyak dalam buku ini adalah 'akar' (ampas minyak) ketika dimasak dalam wadah tembaga Siprus hingga mengental, cocok untuk yang sesuai untuk lambung dan lebih disukai. Minyak ini dapat dicampur dengan campuran obat mata, tetapi jika dibebaskan, lebih baik dan cocok untuk suntikan. Di antaranya adalah hadits yang tidak dimasak di sendi untuk nyeri asam urat {cite:canon-ibn-sina-print-v1 hlm.623-624}"
