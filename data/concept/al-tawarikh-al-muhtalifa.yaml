  en: "al-Farghani lists five eras in order: Nabonassar, Philip, Alexander, the Hijra and Yazdegerd, with the intervals between them in years and days. The first is called Bukhtansar in the Arabic and Nabonassar in the Latin {cite:farghani-elements-astronomy p. 125}{cite:farghani-elements-astronomy p. 126}{cite:farghani-elements-astronomy p. 138}{cite:farghani-elements-astronomy p. 139}."
