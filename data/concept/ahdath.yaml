id: concept/ahdath
class: concept
kind: term
label:
  ar: "الأحداث"
  en: "Ahdath (urban militias of Syria and Upper Mesopotamia)"
  fr: "Ahdath (milices urbaines de Syrie et de Haute-Mésopotamie)"
  es: "Ahdath (milicias urbanas de Siria y la Alta Mesopotamia)"
summary:
  ar: "الأحداث، أي «الفتيان»، ميليشيات حضرية كان لها دور كبير في مدن الشام وأعالي الجزيرة من القرن الرابع إلى السادس الهجري ⁦(العاشر إلى الثاني عشر الميلادي)⁩، وأشهرها في حلب ودمشق، تعمل شرطةً وتدافع عن المدينة عند الحاجة، وكثيرًا ما كانت القوة النشطة في المعارضة البلدية للأمراء {cite:encyclopaedia-of-islam-2 vol. 1 p. 278}."
  en: "Ahdath, 'young men', were urban militias in the cities of Syria and Upper Mesopotamia from the 4th/10th to the 6th/12th centuries, best known at Aleppo and Damascus. They worked as a police force, defended the city in emergencies, and often became the active side of municipal opposition to the princes {cite:encyclopaedia-of-islam-2 vol. 1 p. 278}."
  fr: "Les ahdath, « jeunes hommes », étaient des milices urbaines des villes de Syrie et de Haute-Mésopotamie du IVe au VIe siècle hégirien / Xe au XIIe siècle ap. J.-C., surtout connues à Alep et à Damas. Ils assuraient des fonctions de police, défendaient la ville en cas d’urgence et devenaient souvent le bras actif de l’opposition municipale aux princes {cite:encyclopaedia-of-islam-2 vol. 1 p. 278}."
  es: "Los Ahdath, o «jóvenes», eran milicias urbanas en las ciudades de Siria y la Alta Mesopotamia desde el siglo IV/X hasta el VI/XII, siendo especialmente conocidas en Alepo y Damasco. Funcionaban como fuerza policial, defendían la ciudad en situaciones de emergencia y, a menudo, se convertían en el bando activo de la oposición municipal a los príncipes {cite:encyclopaedia-of-islam-2 vol. 1 p. 278}."
