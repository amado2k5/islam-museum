label:
  ar: "الأحداث"
  en: "Ahdath (urban militias of Syria and Upper Mesopotamia)"
summary:
  ar: "الأحداث، أي «الفتيان»، ميليشيات حضرية كان لها دور كبير في مدن الشام وأعالي الجزيرة من القرن الرابع إلى السادس الهجري (العاشر إلى الثاني عشر الميلادي)، وأشهرها في حلب ودمشق، تعمل شرطةً وتدافع عن المدينة عند الحاجة، وكثيرًا ما كانت القوة النشطة في المعارضة البلدية للأمراء {cite:encyclopaedia-of-islam-2 vol. 1 p. 278}."
  en: "Ahdath, 'young men', were urban militias in the cities of Syria and Upper Mesopotamia from the 4th/10th to the 6th/12th centuries, best known at Aleppo and Damascus. They worked as a police force, defended the city in emergencies, and often became the active side of municipal opposition to the princes {cite:encyclopaedia-of-islam-2 vol. 1 p. 278}."
