summary:
  ar: "القمر قد يكسف سائر الكواكب ويسترها عن الأبصار إذا وافقت طريقته المرئية في الطول والعرض، وقد تكسف الكواكب بعضها بعضاً إذا مرّ الأدنى منها تحت ما فوقه. {cite:zij-sabi-nallino-byblion p.83}."
  en: "The Moon can hide other stars and planets from sight when its apparent path matches theirs in longitude and latitude. Planets can likewise hide one another when the lower one passes beneath the higher. {cite:zij-sabi-nallino-byblion p.83}."
  ur: "چاند دوسرے ستاروں اور سیاروں کو نظر سے چھپا سکتا ہے جب اس کا ظاہری راستہ طول اور عرض میں ان کے مطابق ہو۔ اسی طرح سیارے بھی ایک دوسرے کو ڈھانپ سکتے ہیں جب نچلا سیارہ اوپر والے کے نیچے سے گزرے۔ {cite:zij-sabi-nallino-byblion p.83}۔"
