id: concept/istidlal-min-thiql-al-ras-wa-hararatih-wa-awjaih
class: concept
kind: scientific
label:
  ar: "الاستدلال من ثقل الرأس وحرارته وبرودته وأوجاعه"
  en: "Inference from the heaviness, heat, cold and pains of the head"
  ur: "سر کے بھاری پن، گرمی، سردی اور دردوں سے استدلال"
summary:
  ar: "يبين ابن سينا أن ثقل الرأس يدل دائماً على مادة، ويفرق بين الصفراء والسوداء والدم والبلغم في الثقل والوجع والنوم، ويذكر ما تدل عليه أصناف الوجع {cite:canon-ibn-sina-print-v2 pp.19-20}"
  en: "Ibn Sina shows that heaviness of the head always indicates a matter, tells yellow bile, black bile, blood and phlegm apart by heaviness, pain and sleep, and gives what the kinds of pain indicate {cite:canon-ibn-sina-print-v2 pp.19-20}"
  ur: "ابن سینا بتاتا ہے کہ سر کا بھاری پن ہمیشہ مادے پر دلالت کرتا ہے، اور بھاری پن، درد اور نیند سے صفرا، سودا، خون اور بلغم میں فرق کرتا ہے، اور دردوں کی قسموں کی دلالت ذکر کرتا ہے {cite:canon-ibn-sina-print-v2 pp.19-20}۔"
