id: concept/al-masalah
class: concept
kind: ethical
label:
  ar: "المسألة (سؤال الناس)"
  en: "Asking people for help (al-masala)"
  ur: "لوگوں سے مانگنا (المسألہ)"
summary:
  ar: "المسألة هي سؤال الناس العطاء. يعرض الشيخ عمر عبد الكافي تعليم النبي في أن الفقر ليس حرفة يحترفها الإنسان، وأن الإسلام يعطي الفقير المحتاج حقه في العون لا شرف الفقر، وأن المسألة لا تحل إلا في حالات الضرورة، وأن الشكوى تكون إلى الله لا إلى الناس."
  en: "Asking people for help (al-masala) means asking others for gifts. In Sheikh Omar Abdelkafy's account of the Prophet's teaching, poverty is not a trade a person follows; Islam gives the needy their right to help, not the honour of poverty; asking is lawful only in cases of real need; and complaint is made to God, not to people."
  ur: "المسألہ یعنی لوگوں سے عطیہ مانگنا۔ شیخ عمر عبدالکافی نبی کی تعلیم بیان کرتے ہیں کہ غربت کوئی پیشہ نہیں جسے انسان اپنائے؛ اسلام محتاج کو مدد کا حق دیتا ہے، غربت کی عزت نہیں؛ مانگنا صرف حقیقی ضرورت کی حالت میں جائز ہے؛ اور شکایت لوگوں سے نہیں بلکہ اللہ سے کی جائے۔"
