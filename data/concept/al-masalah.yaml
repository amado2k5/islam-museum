id: concept/al-masalah
class: concept
kind: ethical
label:
  ar: "المسألة ⁦(سؤال الناس)⁩"
  en: "Asking people for help (al-masala)"
  fr: "Solliciter l'aide d'autrui (al-masala)"
  ur: "لوگوں سے مانگنا ⁦(المسألہ)⁩"
  es: "Pedir ayuda a la gente (al-masala)"
  tr: "Sorun (Halkın Sorusu)"
  id: "Masalah (Pertanyaan Orang)"
summary:
  ar: "المسألة هي سؤال الناس العطاء. يعرض الشيخ عمر عبد الكافي تعليم النبي في أن الفقر ليس حرفة يحترفها الإنسان، وأن الإسلام يعطي الفقير المحتاج حقه في العون لا شرف الفقر، وأن المسألة لا تحل إلا في حالات الضرورة، وأن الشكوى تكون إلى الله لا إلى الناس."
  en: "Asking people for help (al-masala) means asking others for gifts. In Sheikh Omar Abdelkafy's account of the Prophet's teaching, poverty is not a trade a person follows; Islam gives the needy their right to help, not the honour of poverty; asking is lawful only in cases of real need; and complaint is made to God, not to people."
  fr: "Solliciter l'aide d'autrui (al-masala), c'est demander des dons. D'après l'exposé du cheikh Omar Abdelkafy sur l'enseignement du Prophète, la pauvreté n'est pas une profession que l'on choisit d'exercer ; l'islam reconnaît aux nécessiteux le droit d'être aidés, sans faire de la pauvreté un titre d'honneur ; demander n'est licite qu'en cas de besoin réel ; c'est à Dieu et non aux gens que l'on confie ses plaintes."
  ur: "المسألہ یعنی لوگوں سے عطیہ مانگنا۔ شیخ عمر عبدالکافی نبی کی تعلیم بیان کرتے ہیں کہ غربت کوئی پیشہ نہیں جسے انسان اپنائے؛ اسلام محتاج کو مدد کا حق دیتا ہے، غربت کی عزت نہیں؛ مانگنا صرف حقیقی ضرورت کی حالت میں جائز ہے؛ اور شکایت لوگوں سے نہیں بلکہ اللہ سے کی جائے۔"
  es: "Pedir ayuda (al-masala) significa pedir regalos a los demás. Según el relato del jeque Omar Abdelkafy sobre las enseñanzas del Profeta, la pobreza no es un oficio; el Islam otorga a los necesitados el derecho a recibir ayuda, no el honor de la pobreza; pedir ayuda solo es lícito en casos de verdadera necesidad; y la queja se dirige a Dios, no a las personas."
  tr: "Sorun, insanların cömertlikle ilgili sorularıdır. Şeyh Ömer Abdulkafi, Peygamber'in öğretisini sunar: yoksulluk bir kişinin ustalaşabileceği bir meslek değildir, İslam'ın ihtiyaç sahibi yoksullara yardım hakkı verdiğini, yoksulluğun onurunu değil, sorunun sadece ihtiyaç duyulduğunda çözüldüğünü ve şikayetlerin insanlara değil, Allah'a yapılması gerektiğini."
  id: "Masalahnya adalah pertanyaan masyarakat tentang kemurahan hati. Sheikh Umar Abdulkafi menyampaikan ajaran Nabi: kemiskinan bukanlah profesi yang bisa dikuasai seseorang; Islam memberikan hak untuk membantu yang membutuhkan, bukan martabat kemiskinan, tetapi masalah hanya diselesaikan ketika diperlukan, dan keluhan harus diajukan kepada Allah, bukan kepada manusia."
