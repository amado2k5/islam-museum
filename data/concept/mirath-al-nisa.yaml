id: concept/mirath-al-nisa
class: concept
kind: legal
label:
  ar: "ميراث النساء"
  en: "Women's inheritance"
  ur: "خواتین کی وراثت"
summary:
  ar: "يذكر الشعراوي أن الآية «يا أيها الذين آمنوا لا يحل لكم أن ترثوا النساء كرهاً» تبطل عادة الجاهلية في منع النساء من الميراث وفي ورثتهن كرهاً، وأن الميراث كان في الجاهلية لمن يقاتل ويدافع. ويرى أن الآية تتكلم عن الحرائر لأن لفظ النساء ينصرف إليهن، وأن الإماء يدخلن في الموروث بحكم آخر {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2078}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2046}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}."
  en: "Al-Sha'rawi notes that the verse 'O you who believe, it is not lawful for you to inherit women by force' ends the pre-Islamic practice of denying women inheritance and of taking them as inheritance against their will, and that in the past inheritance went only to those who fought and defended. He reads the verse as addressing free women, since the word 'women' points to them, and says that slave women fall under another ruling {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2078}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2046}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}."
  ur: "شعراوی بیان کرتے ہیں کہ آیت «اے ایمان والو! تمہارے لیے جائز نہیں کہ عورتوں کے وارث زبردستی بنو» جاہلیت کی اس رسم کو ختم کرتی ہے جس میں عورتوں کو میراث سے محروم رکھا جاتا تھا، اور وہ کہتے ہیں کہ میراث اس وقت صرف لڑنے والوں کو ملتی تھی {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2078}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2046}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "ما الذي أبطلته آية النهي عن ورث النساء كرهاً، وهل تتناول الإماء؟"
  en: "What did the verse forbidding the forced inheriting of women abolish, and does it cover slave women?"
  ur: "خواتین کی زبردستی وراثت سے روکنے والی آیت نے کیا منسوخ کیا، اور کیا وہ لونڈیوں کو بھی شامل ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-abolished-custom
    stance:
      ar: "الآية أبطلت عادة الجاهلية في منع النساء من الميراث ووراثتهن كرهاً، وأعطت النساء نصيباً محدداً"
      en: "The verse abolished the pre-Islamic custom of denying women inheritance and inheriting them against their will, and gave women a fixed share"
      ur: "آیت نے جاہلیت کی رسم کو ختم کیا کہ خواتین کو میراث سے محروم رکھا جائے یا ان کی زبردستی وراثت ہو، اور خواتین کا مقررہ حصہ دیا"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الإسلام شرع للنساء نصيباً محدداً يختلف عن نصيب الرجال، وأن الآية تبطل العادة القديمة {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}."
      en: "Sha'rawi holds that Islam fixed for women a share distinct from men's, and that the verse abolishes the old custom {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}."
      ur: "شعراوی کے مطابق اسلام نے خواتین کے لیے مردوں سے مختلف مقررہ حصہ رکھا، اور یہ آیت پرانی رسم کو ختم کرتی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
