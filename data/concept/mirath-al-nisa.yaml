id: concept/mirath-al-nisa
class: concept
kind: legal
label:
  ar: "ميراث النساء"
  en: "Women's inheritance"
  ur: "خواتین کی وراثت"
  es: "La herencia de las mujeres"
  fr: "L'héritage des femmes"
  tr: "Kadınların mirası"
  id: "Warisan wanita"
summary:
  ar: "يذكر الشعراوي أن الآية «يا أيها الذين آمنوا لا يحل لكم أن ترثوا النساء كرهاً» تبطل عادة الجاهلية في منع النساء من الميراث وفي ورثتهن كرهاً، وأن الميراث كان في الجاهلية لمن يقاتل ويدافع. ويرى أن الآية تتكلم عن الحرائر لأن لفظ النساء ينصرف إليهن، وأن الإماء يدخلن في الموروث بحكم آخر {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2078}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2046}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}."
  en: "Al-Sha'rawi notes that the verse 'O you who believe, it is not lawful for you to inherit women by force' ends the pre-Islamic practice of denying women inheritance and of taking them as inheritance against their will, and that in the past inheritance went only to those who fought and defended. He reads the verse as addressing free women, since the word 'women' points to them, and says that slave women fall under another ruling {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2078}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2046}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}."
  ur: "شعراوی بیان کرتے ہیں کہ آیت «اے ایمان والو! تمہارے لیے جائز نہیں کہ عورتوں کے وارث زبردستی بنو» جاہلیت کی اس رسم کو ختم کرتی ہے جس میں عورتوں کو میراث سے محروم رکھا جاتا تھا، اور وہ کہتے ہیں کہ میراث اس وقت صرف لڑنے والوں کو ملتی تھی {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2078}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2046}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}۔"
  es: "Al-Sha'rawi señala que el versículo «¡Oh, creyentes! No os es lícito heredar mujeres por la fuerza» pone fin a la práctica preislámica de negar la herencia a las mujeres y de tomarlas como herencia contra su voluntad, y que en el pasado la herencia solo se otorgaba a quienes luchaban y defendían. Interpreta el versículo como dirigido a las mujeres libres, puesto que la palabra «mujeres» apunta a ellas, y afirma que las mujeres esclavas se rigen por otra norma {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2077}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2078}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2046}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2047}."
  fr: "Al-Sha'rawi souligne que le verset « Ô vous qui croyez, il ne vous est pas permis d'hériter de femmes par la force » met fin à la pratique préislamique consistant à refuser l'héritage aux femmes et à les leur prendre contre leur gré. Il précise qu'autrefois, l'héritage était réservé à ceux qui avaient combattu et défendu leur patrie. Il interprète ce verset comme s'adressant aux femmes libres, puisque le mot « femmes » les désigne, et indique que les femmes esclaves relèvent d'une autre règle (voir Tafsir Shari Khawatir, vol. 2, p. 2077; Tafsir Shari Khawatir, vol. 2, p. 2078; Tafsir Shari Khawatir, vol. 2, p. 2046; Tafsir Shari Khawatir, vol. 2, p. 2047)."
  tr: "El-Şaarawi, \"Ey iman edenler, kadınları iradesiz miras almak yasal değildir\" ayetinin, kadınların ve varislerinin zorla miras almasını engelleme geleneğini geçersiz kıldığını ve İslam öncesi dönemde mirasın savaşan ve savunanlar için olduğunu belirtir. Ayetin özgür kadınlara atıfta bulunduğuna, çünkü 'kadınlar' teriminin onlara atıfta bulunduğuna ve köle kadınların başka bir hükümle mirasa dahil edildiğine inanır {cite:tafsir-sharawi-khawatir-scan-vol-2 s. 2077}{cite:tafsir-sharawi-khawatir-scan-cilt 2 s. 2047}{cite:tafsir-sharawi-khawatir-scan-vol-2 s. 2047}{cite:tafsir-sharawi-khawatir-scan-vol-2 s. 2047}."
  id: "Al-Shaarawi menyebutkan bahwa ayat \"Wahai kalian yang percaya, tidak sah bagi kalian untuk mewarisi wanita tanpa kehendak\" membatalkan kebiasaan pra-Islam yang mencegah wanita mewarisi dan ahli warisnya dengan paksa, dan warisan pada era pra-Islam itu untuk mereka yang berjuang dan membela. Dia percaya bahwa ayat tersebut merujuk pada wanita merdeka karena istilah 'wanita' merujuk pada mereka, dan bahwa wanita budak termasuk dalam warisan oleh aturan lain {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm. 2077}{cite:tafsir-sharawi-khawatir-scan-scan-vol-2 hlm. 2047}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm. 2047} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm. 2047}."
