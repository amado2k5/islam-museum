id: concept/dud-al-asnan
class: concept
kind: scientific
label:
  ar: دود الأسنان
  en: The tooth-worms
  ur: دانتوں کے کیڑے
  es: "Los gusanos dentarios"
  fr: "Les vers dentaires"
  tr: "diş kurdları"
  id: "cacing gigi"
summary:
  ar: يذكر لدود الأسنان تحبيباً من بزور وشحم يبخر منه بحبة مع تغطية لرأس القمع ⁦(الأسماء والمقادير مطروحة والتبخير محمول على أنه وصف الكتاب لا عملية)⁩ {cite:canon-ibn-sina-print-v2 p.278}
  en: For the tooth-worms he gives a pellet-making of seeds and a fat, one grain of which is fumed under a covered funnel-head (the names and measures left out; the fumigation carried as the book's description, not a procedure) {cite:canon-ibn-sina-print-v2 p.278}
  ur: دانتوں کے کیڑوں کے لیے وہ بیجوں اور ایک چربی سے گولیاں بنانے کا ذکر کرتا ہے جن میں سے ایک دانے سے قمع کا سر ڈھانپ کر دھونی دی جاتی ہے ⁦(نام اور مقداریں مطروح؛ دھونی کتاب کے وصف پر محمول، طریقہ نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.278}
  es: "Para los gusanos dentarios, proporciona una preparación de gránulos con semillas y grasa, un grano de la cual se fumiga bajo un embudo cubierto (se omiten los nombres y las medidas; la fumigación se presenta como una descripción del libro, no como un procedimiento) {cite:canon-ibn-sina-print-v2 p.278}"
  fr: "Pour les vers dentaires, il donne une recette de boulettes à base de graines et de graisse, dont un grain est fumigé sous un entonnoir couvert (les noms et les quantités sont omis; la fumigation est présentée comme une description du livre, et non comme une procédure) {cite:canon-ibn-sina-print-v2 p.278}"
  tr: "Diş kurdları, bir tanenin kapsülle buharlaştırıldığı tohum ve yağ tanesi olarak belirtilir (isimler ve miktarlar verilir, buharlaşma kitabın bir tanımı olarak alınır, bir süreç olarak değil) {cite:canon-ibn-sina-print-v2 s.278}"
  id: "Cacing gigi disebutkan sebagai butir biji dan lemak yang menguapkan biji-bijian dengan kapsul (nama dan jumlahnya diberikan, dan penguapan dianggap sebagai deskripsi buku, bukan proses) {cite:canon-ibn-sina-print-v2 hlm.278}"
