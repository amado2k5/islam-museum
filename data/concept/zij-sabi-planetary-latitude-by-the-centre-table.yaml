id: concept/zij-sabi-planetary-latitude-by-the-centre-table
class: concept
kind: scientific
label: { ar: "عرض الكواكب الخمسة المتحيرة من جدول المركز", en: "The latitude of the five wandering planets from the centre table", ur: "پانچ متحیر سیاروں کا عرض مرکز کے جدول سے", es: "La latitud de los cinco planetas errantes desde la mesa central", fr: "La latitude des cinq planètes errantes par rapport à la table centrale", tr: "Ortadaki sehpadan beş şaşkın gezegenin görüntüsü.", id: "Tampilan lima planet yang kebingungan dari meja tengah" }
summary:
  ar: "يُدخل مركز أحد الكواكب المعدل بالجدول الثالث في سطري العدد من جداول عروض الكواكب الخمسة المتحيرة المتفاضلين بستة أجزاء، بعد أن يُزاد على مركز زحل خمسون، ويُنقص من مركز المشتري عشرون، ويبقى مركز المريخ على حاله. ثم يُؤخذ ما بإزاء ذلك من دقائق حصص العرض للجميع المرسومة في الجدول التاسع من تلك الجداول. {cite:zij-sabi-nallino-byblion pp.178-179}"
  en: "The corrected centre of the planet from the third table is entered in the two rows, six parts apart, of the tables of latitude for the five wandering planets. For Saturn fifty is added to the centre, for Jupiter twenty is subtracted, and Mars is left unchanged. The matching minutes of latitude are then taken from the ninth table, the table of latitude parts for all the planets. {cite:zij-sabi-nallino-byblion pp.178-179}"
  ur: "متحیر سیاروں کے عرض کے جدولوں کی چھ اجزا کے فرق سے دو قطاروں میں تیسرے جدول سے تصحیح شدہ مرکز داخل کیا جاتا ہے۔ زحل کے مرکز میں پچاس جمع کیے جاتے ہیں، مشتری کے مرکز میں سے بیس منہا کیے جاتے ہیں، اور مریخ کا مرکز جوں کا توں رہتا ہے۔ پھر ان کے مقابل عرض کے دقائق نو یں جدول سے لیے جاتے ہیں، جو سب سیاروں کے عرض کے حصے دیتا ہے۔ {cite:zij-sabi-nallino-byblion pp.178-179}"
  es: "El centro corregido del planeta, según la tercera tabla, se introduce en las dos filas, separadas por seis partes, de las tablas de latitud de los cinco planetas errantes. A Saturno se le suman cincuenta al centro, a Júpiter se le restan veinte y Marte permanece sin cambios. Los minutos de latitud correspondientes se toman entonces de la novena tabla, la tabla de partes de latitud para todos los planetas. {cite:zij-sabi-nallino-byblion pp.178-179}"
  fr: "Le centre corrigé de la planète, tiré du troisième tableau, est inscrit dans les deux lignes, espacées de six parties, des tableaux de latitude des cinq planètes errantes. On ajoute cinquante au centre de Saturne, on en soustrait vingt pour Jupiter, et on laisse Mars inchangé. Les minutes de latitude correspondantes sont ensuite relevées dans le neuvième tableau, le tableau des parties de latitude pour toutes les planètes. {cite:zij-sabi-nallino-byblion pp.178-179}"
  tr: "Tablo 3'te ayarlandığı gibi, gezegenlerden birinin merkezi, altı parça arayla yerleştirilmiş beş gezici gezegenin enlem tablolarının iki sayı doğrusuna girilir. Satürn'ün merkezine elli eklenir, Jüpiter'in merkezinden yirmi çıkarılır ve Mars'ın merkezi değişmeden kalır. Daha sonra, bu tabloların Tablo 9'unda çizildiği gibi, tüm gezegenler için karşılık gelen enlem dakikaları alınır. {cite:zij-sabi-nallino-byblion pp.178-179}"
  id: "Pusat salah satu planet, sebagaimana disesuaikan dalam Tabel 3, dimasukkan ke dalam dua baris angka tabel lintang dari lima planet pengembara, yang berjarak enam bagian. Lima puluh ditambahkan ke pusat Saturnus, dua puluh dikurangi dari pusat Jupiter, dan pusat Mars tetap tidak berubah. Kemudian, menit lintang yang sesuai untuk semua planet, sebagaimana digambarkan dalam Tabel 9 dari tabel tersebut, diambil. {cite:zij-sabi-nallino-byblion pp.178-179}"
