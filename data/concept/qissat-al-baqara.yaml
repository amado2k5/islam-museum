id: concept/qissat-al-baqara
class: concept
kind: term
label:
  ar: "قصة البقرة وتسمية السورة"
  en: "The story of the cow and the naming of al-Baqara"
  ur: "گائے کا واقعہ اور سورۂ بقرہ کا نام"
  es: "La historia de la vaca y el origen del nombre de al-Baqara."
  fr: "L'histoire de la vache et du nom d'al-Baqara"
  tr: "İneğin hikayesi ve surenin adlandırılması"
  id: "Kisah sapi dan penamaan surah"
summary:
  ar: "يرى الشعراوي أن سورة البقرة سُميت بقصة البقرة، وهي قصة القتيل الذي ضُرب ببعض البقرة فبُعث ونطق باسم قاتله، وفيها إثبات البعث في الدنيا. ويروي قصة الرجل الصالح الذي استودع بقرته عند الله، ثم عاد ابنه فوجدها فباعها بملء جلدها ذهباً، ويربطها بقصة الجدار في سورة الكهف {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96} {cite:tafsir-sharawi-khawatir-scan p.97}. والتفصيل الذي يسرده عن الرجل الصالح وابنه من روايته هو، لا من نص الآيات. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that al-Baqara takes its name from the story of the cow: a murdered man, struck with part of the cow, rose and named his killer, which is proof of resurrection in this world. He tells of a righteous man who entrusted his cow to God, of his son who found it and sold it for its hide's weight in gold, and he links this to the wall in al-Kahf {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96} {cite:tafsir-sharawi-khawatir-scan p.97}. The detail of the righteous man and his son is Sha'rawi's own narration, not the text of the verses. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی کے مطابق سورۂ بقرہ کا نام گائے کے واقعے سے ہے: ایک مقتول کو گائے کے کسی حصے سے مارا گیا تو وہ زندہ ہو کر اپنے قاتل کا نام بتا گیا، جو دنیا میں قیامت کے ثبوت کے طور پر ہے۔ وہ ایک نیک آدمی کا واقعہ بھی بیان کرتے ہیں جس نے اپنی گائے اللہ کے سپرد کی، پھر اس کے بیٹے نے گائے پائی اور اس کی کھال بھر سونے کے بدلے بیچی، اور وہ اسے سورۂ کہف کی دیوار کے واقعے سے جوڑتے ہیں {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96} {cite:tafsir-sharawi-khawatir-scan p.97}۔ نیک آدمی اور اس کے بیٹے کی تفصیل شعراوی کا اپنا بیان ہے، آیات کا متن نہیں۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "Sha'rawi sostiene que al-Baqara toma su nombre de la historia de la vaca: un hombre asesinado, golpeado con parte de la vaca, resucitó y nombró a su asesino, lo cual es prueba de la resurrección en este mundo. Narra la historia de un hombre justo que encomendó su vaca a Dios, de su hijo que la encontró y la vendió por el peso de su piel en oro, y relaciona esto con el muro en al-Kahf {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96} {cite:tafsir-sharawi-khawatir-scan p.97}. El detalle del hombre justo y su hijo es una narración propia de Sha'rawi, no el texto de los versículos. Esta es la lectura de Sha'rawi y se le atribuye."
  fr: "Sha'rawi soutient qu'al-Baqara tire son nom de l'histoire de la vache: un homme assassiné, frappé par une partie de la vache, se releva et nomma son meurtrier, preuve de la résurrection en ce monde. Il relate l'histoire d'un homme pieux qui confia sa vache à Dieu, et de son fils qui la trouva et la vendit au prix de l'or correspondant au poids de sa peau. Il établit un lien avec le mur mentionné dans al-Kahf (voir Tafsir Sha'rawi-Khawatir, p. 95, 96 et 97). Le détail concernant l'homme pieux et son fils est une narration de Sha'rawi lui-même, et non le texte des versets. Cette interprétation lui est attribuée."
  tr: "El-Şaarawi, Bakarah Suresi'nin adını, bir inekle vurulan ve dirilişe yol açan öldürülenin katilinin adını söylediği hikayeden aldığına inanır; bu hikaye bu dünyada dirilişi onaylar. O, doğru adamın ineğini Allah'a emanet ettiğini, ardından oğlunun geri dönüp ineği bulup derisiyle altınla sattığını, bunu Sure'deki duvar hikayesiyle ilişkilendirir {cite:tafsir-sharawi-khawatir-s.95} {cite:tafsir-sharawi-khawatir-s.96} {cite:tafsir-sharawi-khawatir-s.97} hikayesini anlatır. Doğru adam ve oğlu hakkında anlattığı detay, ayetlerin metninden değil, kendi rivayetinden alınmıştır. Bu onun yorumudur ve ona atfedilmiştir."
  id: "Al-Shaarawi percaya bahwa Surah Al-Baqarah dinamai berdasarkan kisah sapi, yaitu kisah orang yang terbunuh yang dipukul dengan seekor sapi, yang menyebabkan kebangkitan dan menyebut nama pembunuhnya, dan menegaskan kebangkitan di dunia ini. Ia menceritakan kisah orang benar yang mempercayakan sapinya kepada Tuhan, lalu putranya kembali dan menemukannya lalu menjualnya dengan kulit emas penuh kulitnya, mengaitkannya dengan kisah tembok dalam Surah Al-Kahf {cite:tafsir-sharawi-khawatir-scan hlm.95} {cite:tafsir-sharawi-khawatir-scan hlm.96} {cite:tafsir-sharawi-khawatir-scan hlm.97}. Detail yang ia ceritakan tentang orang benar dan putranya berasal dari riwayatnya, bukan dari teks ayat-ayat tersebut. Ini adalah tafsir-sharawi-khawatir-scan yang dikaitkan dengannya."
