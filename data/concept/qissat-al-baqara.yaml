issue:
  ar: "لماذا سُميت السورة بالبقرة، وما القصة التي ترتبط بها؟"
  en: "Why is the surah named al-Baqara, and what story is tied to it?"
  ur: "سورۂ بقرہ کا نام کیوں رکھا گیا، اور اس سے کون سا واقعہ جڑا ہے؟"
perspectives:
  - tradition: sunni
    id: sharawi-baqara
    stance:
      ar: "القصة دليل على البعث، وتسمية السورة تثبت هذه القضية"
      en: "The story is proof of resurrection, and the naming of the surah affirms this"
      ur: "یہ واقعہ حشر کا ثبوت ہے، اور سورت کا نام اسی حقیقت کو ثابت کرتا ہے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن تسمية السورة بالبقرة تثبت قضية البعث، وأن قصة القتيل تجربة رأى فيها بنو إسرائيل البعث وهم في الدنيا {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96}."
      en: "Sha'rawi holds that naming the surah after the cow affirms the question of resurrection, and that the story of the murdered man is an experience in which the Children of Israel saw resurrection while still in this world {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96}."
      ur: "شعراوی کے مطابق سورت کا گائے کے نام پر رکھا جانا حشر کے مسئلے کو ثابت کرتا ہے، اور مقتول کا واقعہ وہ تجربہ ہے جس میں بنی اسرائیل نے دنیا میں رہتے ہوئے حشر دیکھا {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96}۔"
    sources: [source/tafsir-sharawi-khawatir-scan]
