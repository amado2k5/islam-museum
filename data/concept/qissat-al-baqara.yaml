id: concept/qissat-al-baqara
class: concept
kind: term
label:
  ar: "قصة البقرة وتسمية السورة"
  en: "The story of the cow and the naming of al-Baqara"
  ur: "گائے کا واقعہ اور سورۂ بقرہ کا نام"
summary:
  ar: "يرى الشعراوي أن سورة البقرة سُميت بقصة البقرة، وهي قصة القتيل الذي ضُرب ببعض البقرة فبُعث ونطق باسم قاتله، وفيها إثبات البعث في الدنيا. ويروي قصة الرجل الصالح الذي استودع بقرته عند الله، ثم عاد ابنه فوجدها فباعها بملء جلدها ذهباً، ويربطها بقصة الجدار في سورة الكهف {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96} {cite:tafsir-sharawi-khawatir-scan p.97}. والتفصيل الذي يسرده عن الرجل الصالح وابنه من روايته هو، لا من نص الآيات. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that al-Baqara takes its name from the story of the cow: a murdered man, struck with part of the cow, rose and named his killer, which is proof of resurrection in this world. He tells of a righteous man who entrusted his cow to God, of his son who found it and sold it for its hide's weight in gold, and he links this to the wall in al-Kahf {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96} {cite:tafsir-sharawi-khawatir-scan p.97}. The detail of the righteous man and his son is Sha'rawi's own narration, not the text of the verses. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی کے مطابق سورۂ بقرہ کا نام گائے کے واقعے سے ہے: ایک مقتول کو گائے کے کسی حصے سے مارا گیا تو وہ زندہ ہو کر اپنے قاتل کا نام بتا گیا، جو دنیا میں قیامت کے ثبوت کے طور پر ہے۔ وہ ایک نیک آدمی کا واقعہ بھی بیان کرتے ہیں جس نے اپنی گائے اللہ کے سپرد کی، پھر اس کے بیٹے نے گائے پائی اور اس کی کھال بھر سونے کے بدلے بیچی، اور وہ اسے سورۂ کہف کی دیوار کے واقعے سے جوڑتے ہیں {cite:tafsir-sharawi-khawatir-scan p.95} {cite:tafsir-sharawi-khawatir-scan p.96} {cite:tafsir-sharawi-khawatir-scan p.97}۔ نیک آدمی اور اس کے بیٹے کی تفصیل شعراوی کا اپنا بیان ہے، آیات کا متن نہیں۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
