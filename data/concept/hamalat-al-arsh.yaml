id: concept/hamalat-al-arsh
class: concept
kind: angel
label:
  ar: حملة العرش
  en: The Throne-Bearers
  ur: عرش اٹھانے والے
summary:
  ar: ملائكة يصفهم القرآن بأنهم الذين يحملون العرش ومن حوله يسبحون بحمد ربهم [[passage/quran-40-7|غافر 7]]، ويذكرهم في سورة الحاقة في قوله [[passage/quran-69-17|الحاقة
    17]]؛ وتختلف الروايات في عددهم، فالمشهور ثمانية.
  en: Angels the Qur'an describes as those who carry the Throne and those around it glorify their Lord [[passage/quran-40-7|Ghafir 7]], named
    in al-Haqqah [[passage/quran-69-17|69:17]]; reports differ on their number, the common view being eight.
  ur: فرشتے جنہیں قرآن عرش اٹھانے والے اور اس کے گرد تسبیح کرنے والے کہتا ہے [[passage/quran-40-7|غافر 7]] اور سورت الحاقہ میں بھی ان کا ذکر ہے
    [[passage/quran-69-17|الحاقہ 17]]؛ ان کی تعداد میں روایات مختلف ہیں اور مشہور قول آٹھ ہے۔
