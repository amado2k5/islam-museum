id: concept/al-tasbih-wal-taqdis
class: concept
kind: term
label:
  ar: "التسبيح والتقديس"
  en: "Tasbih and taqdis (glorifying and sanctifying God)"
  fr: "Tasbih et taqdis (glorification et sanctification de Dieu)"
  ur: "تسبیح و تقدیس"
  es: "Tasbih y taqdis (glorificar y santificar a Dios)"
  tr: "Övgü ve Kutsanma"
  id: "Pujian dan Berkat"
summary:
  ar: "يرى الشعراوي أن التسبيح تنزيه الله عما لا يليق بجلاله، وأن التقديس تطهيره من كل ما لا يليق، وأن هذا اللفظ لا يُقال لبشر، وأن قول الملائكة يتضمن الاعتراف بأن العلم كله من الله {cite:tafsir-sharawi-khawatir-scan p.243} {cite:tafsir-sharawi-khawatir-scan p.244}."
  en: "Sha'rawi holds that tasbih is declaring God far from anything unfitting to His majesty, and taqdis is purifying Him of everything unfitting. He says the phrase is not said of any human, and that the angels' words acknowledge that all knowledge comes from God {cite:tafsir-sharawi-khawatir-scan p.243} {cite:tafsir-sharawi-khawatir-scan p.244}."
  fr: "Selon al-Sha'rawi, le tasbih consiste à déclarer Dieu exempt de tout ce qui ne sied pas à sa majesté, et le taqdis à le déclarer pur de tout ce qui ne lui sied pas. Cette formule, dit-il, ne se dit d’aucun être humain, et les paroles des anges reconnaissent que tout savoir vient de Dieu {cite:tafsir-sharawi-khawatir-scan p.243} {cite:tafsir-sharawi-khawatir-scan p.244}."
  ur: "شعراوی کے نزدیک تسبیح کا مطلب ہے اللہ کو ہر اس بات سے پاک ماننا جو اس کی شان کے لائق نہیں، اور تقدیس کا مطلب ہے ہر ایسی چیز سے پاک کرنا۔ ان کے نزدیک یہ لفظ کسی انسان کے لیے نہیں بولا جاتا، اور فرشتوں کا قول اس بات کا اقرار ہے کہ سارا علم اللہ کی طرف سے ہے {cite:tafsir-sharawi-khawatir-scan p.243} {cite:tafsir-sharawi-khawatir-scan p.244}۔"
  es: "Sha'rawi sostiene que tasbih es declarar a Dios alejado de todo lo que sea impropio de Su majestad, y taqdis es purificarlo de todo lo impropio. Afirma que esta frase no se aplica a ningún ser humano, y que las palabras de los ángeles reconocen que todo conocimiento proviene de Dios {cite:tafsir-sharawi-khawatir-scan p.243} {cite:tafsir-sharawi-khawatir-scan p.244}."
  tr: "El-Şaarawi, yüceltmenin Tanrı'nın yüceliğine yakışmayan şeyden yükseltilmesi olduğuna, kutsallaşmanın uygun olmayan her şeyden arınma olduğuna, bu ifadenin insanlara söylenmediğine ve meleklerin ifadesinin tüm bilginin Tanrı'dan geldiğini kabul ettiğine inanır {atıf:tafsir-sharawi-khawatir-scan s.243} {cite:tafsir-sharawi-khawatir-scan s.244}."
  id: "El-Shaarawi percaya bahwa pengangkatan adalah pengangkatan dari apa yang tidak layak atas pengagungan Tuhan, bahwa penyucian adalah penyucian dari segala sesuatu yang tidak pantas, bahwa ungkapan ini tidak diucapkan kepada manusia, dan bahwa ungkapan para malaikat mengakui bahwa semua pengetahuan berasal dari Tuhan {citation:tafsir-sharawi-khawatir-scan hlm.243} {cite:tafsir-sharawi-khawatir-scan hlm.244}."
