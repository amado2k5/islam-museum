id: concept/al-tasbih-wal-taqdis
class: concept
kind: term
label:
  ar: "التسبيح والتقديس"
  en: "Tasbih and taqdis (glorifying and sanctifying God)"
  ur: "تسبیح و تقدیس"
summary:
  ar: "يرى الشعراوي أن التسبيح تنزيه الله عما لا يليق بجلاله، وأن التقديس تطهيره من كل ما لا يليق، وأن هذا اللفظ لا يُقال لبشر، وأن قول الملائكة يتضمن الاعتراف بأن العلم كله من الله {cite:tafsir-sharawi-khawatir-scan p.243} {cite:tafsir-sharawi-khawatir-scan p.244}."
  en: "Sha'rawi holds that tasbih is declaring God far from anything unfitting to His majesty, and taqdis is purifying Him of everything unfitting. He says the phrase is not said of any human, and that the angels' words acknowledge that all knowledge comes from God {cite:tafsir-sharawi-khawatir-scan p.243} {cite:tafsir-sharawi-khawatir-scan p.244}."
  ur: "شعراوی کے نزدیک تسبیح کا مطلب ہے اللہ کو ہر اس بات سے پاک ماننا جو اس کی شان کے لائق نہیں، اور تقدیس کا مطلب ہے ہر ایسی چیز سے پاک کرنا۔ ان کے نزدیک یہ لفظ کسی انسان کے لیے نہیں بولا جاتا، اور فرشتوں کا قول اس بات کا اقرار ہے کہ سارا علم اللہ کی طرف سے ہے {cite:tafsir-sharawi-khawatir-scan p.243} {cite:tafsir-sharawi-khawatir-scan p.244}۔"
