summary:
  ar: "يقع مركز فلك التدوير على نقطة البُعد الأبعد مرتين في الشهر القمري: مرة عند الاجتماع الأوسط ومرة عند المقابلة الوسطى، فلا يتركب الاختلاف المفرد عندئذ مع الثاني. {cite:zij-sabi-nallino-byblion p.77}."
  en: "The epicycle's centre sits on the far point twice in a lunar month, once at mean conjunction and once at mean opposition. At those moments the single inequality does not combine with the second one. {cite:zij-sabi-nallino-byblion p.77}."
  ur: "مہینے میں دو بار فلکِ تدویر کا مرکز بُعدِ اَبعد کے نقطے پر ہوتا ہے، ایک بار اوسط اجتماع پر اور ایک بار اوسط مقابلے پر۔ ان لمحوں میں واحد اختلاف دوسرے کے ساتھ جڑتا نہیں۔ {cite:zij-sabi-nallino-byblion p.77}۔"
  es: "El centro del epiciclo se sitúa en el punto más alejado dos veces en un mes lunar, una vez en la conjunción media y otra en la oposición media. En esos momentos, la desigualdad simple no se combina con la segunda. {cite:zij-sabi-nallino-byblion p.77}."
