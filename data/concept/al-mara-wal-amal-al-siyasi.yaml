  summary:
    ar: "رأي طارق السويدان (رأي المتكلم): النساء شقائق الرجال والتفريق يحتاج دليلاً صريحاً لا خلاف عليه، والحديث خاص بحالة الفرس، ولا يصح منع نصف المجتمع من المشاركة السياسية بدليل مختلف فيه؛ وقال إنه بعد تأمل طويل، وكان له رأي آخر من قبل، صار مقتنعاً بأن من حقها أن تصل إلى جميع المناصب بما فيها رئاسة الدولة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:10:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:12:30}."
    en: "Tareq al-Suwaidan's view (the speaker's opinion): women are the full counterparts of men, and distinguishing between them needs clear, undisputed evidence; the hadith concerns the Persian case; and half of society should not be barred from political participation on disputed evidence; he said that after long reflection, having once held another view, he became convinced that she may reach every office, head of state included {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:10:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:12:30}."
