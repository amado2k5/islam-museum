    en: "The view of two guest specialists in the sharia, Dr Ruhayyil Gharaiba and Dr Muthanna: the sharia's address came to men and women alike in every field of life; the presence of two women at the second pledge of 'Aqaba, Umm Salama's counsel at al-Hudaybiyya and the women's pledge were political acts; and Abu Bakra's hadith is the only sound text on the question and has its historical circumstance {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:38:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:39:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:40:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:44:00}."
