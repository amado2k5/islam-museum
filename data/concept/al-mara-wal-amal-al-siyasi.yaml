id: concept/al-mara-wal-amal-al-siyasi
class: concept
kind: political
sensitivity: contested
label:
  ar: "المرأة والعمل السياسي"
  en: "Women and political work"
  ur: "عورت اور سیاسی عمل"
issue:
  ar: "هل تصلح المرأة للعمل السياسي، وهل يجيز الشرع ترشّحها وتولّيها المناصب السياسية، وإلى أي حد، ولماذا بقي دورها السياسي ضعيفاً؟"
  en: "Is a woman suited to political work, does the sharia allow her to stand for and hold political office, how far, and why has her political role stayed weak?"
  ur: "کیا عورت سیاسی عمل کی اہل ہے، کیا شریعت اسے امیدوار بننے اور سیاسی مناصب سنبھالنے کی اجازت دیتی ہے، کس حد تک، اور اس کا سیاسی کردار کمزور کیوں رہا؟"
summary:
  ar: "حلقة «الوسطية» عن المرأة والعمل السياسي، وضيفها الرئيس الدكتور عدنان حسن باحارث الذي يرى أن الأنوثة تمنع المرأة من الولاية السياسية، يحاوره متخصصون في الشريعة ونائبة برلمانية وجمهور أغلبه من الطالبات. أيّد 76% من جمهور الاستوديو ترشيح المرأة للمناصب السياسية مقابل 24%، واختار 54% المرأة و46% الرجل لو تكافأ مرشحان. وختم طارق السويدان برأيه أن من حق المرأة أن تصل إلى جميع المناصب بما فيها رئاسة الدولة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:12:30}"
  en: "The 'Al-Wasatiyya' episode on women and political work. Its main guest, Dr Adnan Hasan Baharith, holds that femininity bars a woman from political authority; specialists in the sharia, a woman member of parliament and an audience made up mostly of women students argue with him. Seventy-six percent of the studio audience supported women standing for political office against 24%, and with two equal candidates 54% chose the woman and 46% the man. Tareq al-Suwaidan closed with his own view that a woman may reach every office, head of state included. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:12:30}"
  ur: "«الوسطیہ» کی وہ قسط جو عورت اور سیاسی عمل پر ہے۔ اس کے مرکزی مہمان ڈاکٹر عدنان حسن باحارث کی رائے ہے کہ نسوانیت عورت کو سیاسی ولایت سے روکتی ہے؛ شریعت کے ماہرین، ایک خاتون رکنِ پارلیمان اور زیادہ تر طالبات پر مشتمل حاضرین ان سے بحث کرتے ہیں۔ اسٹوڈیو حاضرین میں سے 76% نے عورت کے سیاسی مناصب کے لیے امیدوار بننے کی تائید کی اور 24% نے نہیں، اور دو برابر امیدواروں میں 54% نے عورت اور 46% نے مرد کو چنا۔ طارق السویدان نے اپنی رائے پر اختتام کیا کہ عورت کو ہر منصب تک، سربراہِ مملکت سمیت، پہنچنے کا حق ہے۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:02:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 01:12:30}"
perspectives:
- tradition: sunni
  id: femininity-bars-authority
  stance:
    ar: "الأنوثة تمنع المرأة من الولاية السياسية"
    en: "Femininity bars a woman from political authority"
  summary:
    ar: "رأي الدكتور عدنان حسن باحارث: السلطة السياسية يُشترط لها الذكورة، ويقول إن علماء شبه مجمعين على أن المرأة لا تترأس؛ ويستدل بأن النبي لم يولّ امرأة عملاً سياسياً، وبفهم أبي بكرة للحديث الوارد في تولية الفرس امرأة، وبأن خروج عائشة كان إصلاحاً وكانت فيه رمزاً لا رئيسة ثم ندمت، ويرى أن وظيفة المرأة الكبرى في حفظ النوع ووظيفة الرجل في عمارة الأرض {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:30:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:13:30}."
    en: "The view of Dr Adnan Hasan Baharith: political authority requires maleness, and he says scholars are close to unanimous that a woman does not take the headship; he argues from the Prophet never appointing a woman to political work, from Abu Bakra's understanding of the hadith on the Persians making a woman their ruler, and from 'A'isha's going out being an effort at reconciliation in which she was a symbol, not a leader, and which she later regretted; he sees the woman's great function in preserving the species and the man's in building up the earth {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:30:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep22 00:13:30}."
