  ar: "جوز هندي"
  en: "Jawz hindi (the coconut)"
  ur: "جوز ہندی ⁦(ناریل)⁩"
summary:
  ar: "النارجيل؛ جيّده الطري الشديد البياض العذب الماء، ثقيل على المعدة، ودهنه العتيق ينفع أوجاع الظهر والوركين، ويزيد في الباه ودهنه للبواسير {cite:canon-ibn-sina-print-v1 p.422}."
  en: "The coconut. The good one is fresh, very white and sweet in its water. It is heavy on the stomach; its old oil helps back and hip pains; the book lists it for stirring desire, and its oil for piles {cite:canon-ibn-sina-print-v1 p.422}."
  ur: "یہ ناریل ہے۔ اچھا وہ ہے جو تازہ، نہایت سفید اور پانی میٹھا ہو۔ یہ معدے پر بھاری ہے، اس کا پرانا تیل کمر اور کولھوں کے درد میں مفید ہے؛ کتاب اسے جماع کی خواہش بڑھانے والا اور اس کا تیل بواسیر میں مفید بتاتی ہے {cite:canon-ibn-sina-print-v1 p.422}۔"
