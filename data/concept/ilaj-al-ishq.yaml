label:
  ar: "علاج العشق"
  en: "Treatment of ishq"
  ur: "عشق کا علاج"
  es: "Tratamiento de ishq"
  fr: "Traitement de l'ishq"
  tr: "Aşkın tedavisi"
  id: "Obat cinta"
summary:
  ar: "يذكر ابن سينا مبادئ علاج العشق؛ وجميع ما في الفصل موضوع في قسم موسوم معلق لحكم المؤسس، ولا تُنقل الوصفات ولا الأساليب {cite:canon-ibn-sina-print-v2 p.112} {cite:canon-ibn-sina-print-v2 p.113}"
  en: "Ibn Sina gives the principles of treating ishq; everything in the chapter is placed in a labelled section held for the founder's ruling, and recipes and devices are not reproduced {cite:canon-ibn-sina-print-v2 p.112} {cite:canon-ibn-sina-print-v2 p.113}"
  ur: "ابن سینا عشق کے علاج کے اصول بتاتا ہے؛ فصل کا سارا بیان ایک موسوم قسم میں ہے جو بانی کے فیصلے کے لیے موقوف ہے، اور نسخے اور تدبیریں نقل نہیں کی گئیں {cite:canon-ibn-sina-print-v2 p.112} {cite:canon-ibn-sina-print-v2 p.113}۔"
  es: "Ibn Sina expone los principios del tratamiento del ishq; todo en el capítulo se ubica en una sección etiquetada reservada para la decisión del fundador, y las recetas y los dispositivos no se reproducen {cite:canon-ibn-sina-print-v2 p.112} {cite:canon-ibn-sina-print-v2 p.113}"
  fr: "Ibn Sina expose les principes du traitement de l'ishq; chaque élément du chapitre est classé dans une section intitulée « Décision du fondateur », et les recettes et les remèdes ne sont pas reproduits. {cite:canon-ibn-sina-print-v2 p.112} {cite:canon-ibn-sina-print-v2 p.113}"
  tr: "İbn Sina aşkın ele alınma ilkelerinden bahseder; bölümdeki her şey Kurucu Kuralı Üzerine Askıya Bırakılmış başlıklı bir bölümde yer alır ve ne tarifler ne de yöntemler {cite:canon-ibn-sina-print-v2 s.112}} {cite:canon-ibn-sina-print-v2 s.113}"
  id: "Ibn Sina menyebutkan prinsip-prinsip dalam memperlakukan cinta; segala sesuatu dalam bab ditempatkan dalam bagian berjudul Suspended on the Founder's Rule, dan baik resep maupun metode {cite:canon-ibn-sina-print-v2 hlm.112} {cite:canon-ibn-sina-print-v2 hlm.113}"
