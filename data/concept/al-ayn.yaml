summary:
  ar: "العين حق كما في الحديث؛ تصيب المحسود بإذن الله بغير تماس، وتدفع بالرقية الشرعية والأذكار لا بالتمائم المخالفة {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  en: "The evil eye is real, as the hadith states; it strikes the envied by God's leave without touch, and is repelled by lawful ruqya and remembrance, not by amulets {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  ur: "نظر حق ہے جیسا کہ حدیث میں آیا ہے؛ یہ اللہ کے اذن سے بغیر چھوے متاثر کرتی ہے، اور شرعی رقیہ اور اذکار سے دفع ہوتی ہے نہ کہ تعویذوں سے {cite:sahih-muslim} {cite:sahih-al-bukhari}۔"
