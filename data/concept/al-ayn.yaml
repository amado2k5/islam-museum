id: concept/al-ayn
class: concept
kind: belief
label:
  ar: العين
  en: The evil eye
  fr: "Le mauvais œil"
  ur: نظر
  es: "Mal de ojo"
  tr: "El Ayn"
  id: "El Ayn"
summary:
  ar: "العين حق كما في الحديث؛ تصيب المحسود بإذن الله بغير تماس، وتدفع بالرقية الشرعية والأذكار لا بالتمائم المخالفة {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  en: "The evil eye is real, as the hadith states; it strikes the envied by God's leave without touch, and is repelled by lawful ruqya and remembrance, not by amulets {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  fr: "Le hadith affirme que le mauvais œil est réel : avec la permission de Dieu, il atteint sans contact la personne enviée. Selon cette tradition, on le repousse par la ruqya licite et le rappel de Dieu, non par des amulettes {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  ur: "نظر حق ہے جیسا کہ حدیث میں آیا ہے؛ یہ اللہ کے اذن سے بغیر چھوے متاثر کرتی ہے، اور شرعی رقیہ اور اذکار سے دفع ہوتی ہے نہ کہ تعویذوں سے {cite:sahih-muslim} {cite:sahih-al-bukhari}۔"
  es: "El mal de ojo es real, como afirma el hadiz; ataca a los envidiados con el permiso de Dios sin contacto físico, y es repelido por la ruqya lícita y el recuerdo, no por amuletos {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  tr: "Nazar, hadislerde belirtildiği gibi gerçek bir biçimdir; Allah'ın izniyle kıskanılan kişiye temas etmeden vurur ve karşıt muskalarla değil, meşru rukhya ve anma tarafından uzaklaştırılır. {atıf:sahih-al-bukhari} tarafından değil."
  id: "Mata jahat adalah bentuk nyata seperti yang dinyatakan dalam hadits; Dengan izin Allah, mata itu mengenai orang iri tanpa menyentuhnya dan dihilangkan bukan dengan jimat yang berlawanan tetapi dengan rukhya dan peringatan yang sah. {atribusi: sahih al-bukhari} bukan oleh}."
