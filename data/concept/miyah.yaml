summary:
  ar: "تقسم الموسوعة الفقهية المياه باعتبار وصفها إلى مطلق ومستعمل ومسخن ومختلط، والمطلق هو ما صدق عليه اسم ماء بلا قيد، وهو طاهر مطهر عند الجمهور، وخالفهم الحنفية فجعلوا الطهور بمعنى الطاهر. وتشمل أنواعه ماء السماء والبحر والنهر والعين والثلج والبرد والبئر وزمزم والآجن، وفيها خلاف في الكراهة والصحة. والمستعمل خلاف في تعريفه وحكمه بين الحنفية والمالكية والشافعية والحنابلة، والمشمس خلاف في كراهته، والمختلط بطاهر أو بنجس، وحكم الماء القليل والكثير بالقلتين، وطهارة الماء النجس بالمكاثرة أو النزح، واشتباه الأواني الطهور بالنجس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15344}"
  en: "The encyclopedia divides water by its quality into four kinds: pure water (mutlaq), used water (musta'mal), water warmed by the sun or by fire (musakhkhan, mushammas), and mixed water (mukhtalit). Pure water is, for the majority, both pure and purifying; the Hanafis read the word tahur as meaning clean. Its kinds include rain, sea, river, spring, snow, hail, well, zamzam and stagnant water, with differences over disliking and validity. Used water is defined differently by the Hanafis, Malikis, Shafi'is and Hanbalis. Sun-warmed water is disliked by some. Mixed water is ruled differently when mixed with clean or unclean matter. The two-qullah line decides whether still water is little or much, and the rules cover the purification of unclean water and the mixing of pure and impure vessels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15344}"
  ur: "فقہاء پانی کو اس کی حالت کے لحاظ سے چار اقسام میں بانٹتے ہیں: مطلق، مستعمل، مشمس یا مسخن، اور مختلط۔ جمہور کے نزدیک مطلق پانی پاک اور پاک کرنے والا ہے، جبکہ حنفیہ طہور کو طاہر کے معنی میں لیتے ہیں۔ دو قلتوں کی حد سے ٹھہرے ہوئے پانی کے قلیل و کثیر ہونے کا فیصلہ ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15338}"
  es: "La enciclopedia divide el agua según su calidad en cuatro tipos: agua pura (mutlaq), agua usada (musta'mal), agua calentada por el sol o por el fuego (musakhkhan, mushammas) y agua mezclada (mukhtalit). Para la mayoría, el agua pura es tanto pura como purificadora; los hanafíes interpretan la palabra tahur como limpia. Sus tipos incluyen agua de lluvia, mar, río, manantial, nieve, granizo, pozo, zamzam y agua estancada, con diferencias en cuanto a su desagrado y validez. El agua usada se define de manera diferente por los hanafíes, malikíes, shafi'íes y hanbalíes. Algunos desaprueban el agua calentada por el sol. El agua mezclada se rige de manera diferente cuando se mezcla con materia limpia o impura. La línea de dos qullah determina si el agua estancada es poca o mucha, y las reglas abarcan la purificación del agua impura y la mezcla de recipientes puros e impuros. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15321} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15322} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15337} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15344}"
  fr: "L'encyclopédie classe l'eau en quatre catégories selon sa qualité: eau pure (mutlaq), eau usée (musta'mal), eau chauffée par le soleil ou par le feu (musakhkhan, mushammas) et eau mélangée (mukhtalit). L'eau pure est, pour la majorité, à la fois pure et purificatrice; les hanafites interprètent le mot tahur comme signifiant « propre ». Parmi ces eaux figurent l'eau de pluie, de mer, de rivière, de source, de neige, de grêle, de puits, de Zamzam et l'eau stagnante, avec des différences quant à leur appréciation et leur validité. L'eau usée est définie différemment par les écoles hanafite, malikite, chaféite et hanbalite. L'eau chauffée par le soleil est mal vue par certains. L'eau mélangée est soumise à des règles différentes selon qu'elle est mélangée à des matières pures ou impures. La règle des deux qullah détermine si l'eau stagnante est considérée comme peu ou beaucoup, et les règles couvrent la purification de l'eau impure et le mélange d'eau provenant de récipients purs et impurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15344}"
