summary:
  ar: "تقسم الموسوعة الفقهية المياه باعتبار وصفها إلى مطلق ومستعمل ومسخن ومختلط، والمطلق هو ما صدق عليه اسم ماء بلا قيد، وهو طاهر مطهر عند الجمهور، وخالفهم الحنفية فجعلوا الطهور بمعنى الطاهر. وتشمل أنواعه ماء السماء والبحر والنهر والعين والثلج والبرد والبئر وزمزم والآجن، وفيها خلاف في الكراهة والصحة. والمستعمل خلاف في تعريفه وحكمه بين الحنفية والمالكية والشافعية والحنابلة، والمشمس خلاف في كراهته، والمختلط بطاهر أو بنجس، وحكم الماء القليل والكثير بالقلتين، وطهارة الماء النجس بالمكاثرة أو النزح، واشتباه الأواني الطهور بالنجس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15344}"
  en: "The encyclopedia divides water by its quality into four kinds: pure water (mutlaq), used water (musta'mal), water warmed by the sun or by fire (musakhkhan, mushammas), and mixed water (mukhtalit). Pure water is, for the majority, both pure and purifying; the Hanafis read the word tahur as meaning clean. Its kinds include rain, sea, river, spring, snow, hail, well, zamzam and stagnant water, with differences over disliking and validity. Used water is defined differently by the Hanafis, Malikis, Shafi'is and Hanbalis. Sun-warmed water is disliked by some. Mixed water is ruled differently when mixed with clean or unclean matter. The two-qullah line decides whether still water is little or much, and the rules cover the purification of unclean water and the mixing of pure and impure vessels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15344}"
  ur: "فقہاء پانی کو اس کی حالت کے لحاظ سے چار اقسام میں بانٹتے ہیں: مطلق، مستعمل، مشمس یا مسخن، اور مختلط۔ جمہور کے نزدیک مطلق پانی پاک اور پاک کرنے والا ہے، جبکہ حنفیہ طہور کو طاہر کے معنی میں لیتے ہیں۔ دو قلتوں کی حد سے ٹھہرے ہوئے پانی کے قلیل و کثیر ہونے کا فیصلہ ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15338}"
