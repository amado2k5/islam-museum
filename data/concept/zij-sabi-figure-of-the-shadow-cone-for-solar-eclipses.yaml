summary:
  ar: "يرسم البتاني شكلاً يضم دوائر متعددة متحاذية المراكز على خط مستقيم: دائرة الأرض، ودائرة القمر، ودائرة الشمس، ودائرة الظل، ويصل بالخطوط المماسة والشعاعات إلى نسب الأقطار والظل. {cite:zij-sabi-nallino-byblion p.88}."
  en: "Al-Battani draws a figure of several circles whose centres lie on one straight line: the Earth's circle, the Moon's, the Sun's and the shadow's. Through the tangent lines and rays he reaches the ratios of the diameters and of the shadow. {cite:zij-sabi-nallino-byblion p.88}."
  ur: "البتانی ایک ایسی شکل بناتے ہیں جس میں ایک سیدھی لکیر پر کئی دائرے ہیں: زمین، چاند، سورج اور سائے کا دائرہ۔ مماسی خطوط اور شعاعوں کے ذریعے وہ قطروں اور سائے کی نسبتوں تک پہنچتے ہیں۔ {cite:zij-sabi-nallino-byblion p.88}۔"
  es: "Al-Battani dibuja una figura formada por varios círculos cuyos centros se encuentran sobre una misma línea recta: el círculo de la Tierra, el de la Luna, el del Sol y el de su sombra. Mediante líneas tangentes y rayos, obtiene las proporciones de los diámetros y de la sombra. {cite:zij-sabi-nallino-byblion p.88}."
