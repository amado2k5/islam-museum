summary: { ar: "الميسر: القمار عند الجاهلية بضرب القداح على الجزور؛ أنكره القرآن مع الخمر: «قل فيهما إثم كبير».", en: "Maysar: arrow-casting gambling on slaughtered camels — the Qurʾan condemned it with wine as a great sin.", es: "Maysar: apostar con flechas sobre camellos sacrificados; el Corán lo condenó con vino como un gran pecado.", fr: "Maysar: jeu de hasard consistant à lancer des flèches sur des chameaux abattus — le Coran le condamne, ainsi que le vin, comme un grand péché.", ur: "میسر: ذبح شدہ اونٹوں پر تیر چلانے والا جوا - قرآن نے شراب کے ساتھ اسے گناہ عظیم قرار دیا ہے۔", tr: "El-Maysar: İslam öncesi dönemde kumar oynamak için sokaklara kumar vurmak; Kur'an, şarabla birlikte bunu kınadı: \"Deyin, 'Her ikisinde de büyük günah vardır.'", id: "Al-Maysar: Berjudi di era pra-Islam dengan memukul cangkir di gang; Al-Qur'an mengutuknya bersama anggur: \"Katakanlah, 'Ada dosa besar dalam keduanya.'\"" }
