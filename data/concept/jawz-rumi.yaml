id: concept/jawz-rumi
class: concept
kind: natural
label:
  ar: "جوز رومي"
  en: "Jawz rumi (the book's akiros, amber)"
  ur: "جوز رومی ⁦(اکیروس، کہربا)⁩"
  es: "Jawz rumi (los akiros del libro, ámbar)"
  fr: "Jawz rumi (akiros du livre, ambre)"
summary:
  ar: "ويسمّى أكيروس، وهو صمغ شجرة الجوز الرومي الذي يجمد في النهر، ويُسمّى الكهربا عند المحقق؛ حار شديد التسخين، وينفع من الصرع بثمره مع الخل ومن الضربان النقرسي بورقه، ويمنع سيلان الأمعاء بصمغه {cite:canon-ibn-sina-print-v1 p.422} {cite:canon-ibn-sina-print-v1 p.423}."
  en: "Also called akiros. The book says the Roman walnut tree grows by a river and its gum hardens in the water. The editor's footnote identifies the gum as amber (kahraba) and says the name akiros is unexplained. The book, citing Dioscorides, lists its fruit with vinegar for epilepsy, its leaf with vinegar for gouty pulsing, and its gum for flux of the intestines {cite:canon-ibn-sina-print-v1 p.422} {cite:canon-ibn-sina-print-v1 p.423}."
  ur: "اسے اکیروس بھی کہتے ہیں۔ کتاب کے مطابق رومی اخروٹ کا درخت دریا کے کنارے اگتا ہے اور اس کا صمغ پانی میں جم جاتا ہے؛ حاشیے کے مطابق یہ کہربا ہے، اور اکیروس کا معنی معلوم نہیں ہو سکا۔ کتاب دیوسقوریدوس کے حوالے سے اس کا پھل سرکے کے ساتھ مرگی میں، پتا سرکے کے ساتھ نقرسی ضربان میں، اور صمغ آنتوں کے سیلان میں بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.422} {cite:canon-ibn-sina-print-v1 p.423}۔"
  es: "También llamado akiros. El libro dice que el nogal romano crece junto a un río y su resina se endurece en el agua. La nota al pie del editor identifica la resina como ámbar (kahraba) y dice que el nombre akiros no tiene explicación. El libro, citando a Dioscórides, enumera su fruto con vinagre para la epilepsia, su hoja con vinagre para la gota y su resina para el flujo intestinal {cite:canon-ibn-sina-print-v1 p.422} {cite:canon-ibn-sina-print-v1 p.423}."
  fr: "Également appelé akiros. Le livre indique que le noyer romain pousse au bord d'une rivière et que sa gomme durcit dans l'eau. Une note de bas de page de l'éditeur identifie cette gomme comme étant de l'ambre (kahraba) et précise que l'origine du nom akiros reste inexpliquée. Le livre, citant Dioscoride, mentionne l'utilisation de son fruit avec du vinaigre contre l'épilepsie, de sa feuille avec du vinaigre contre les crises de goutte, et de sa gomme contre la diarrhée (voir: canon d'Ibn Sina, vol. 1, p. 422 et 423)."
