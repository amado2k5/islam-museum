id: "concept/mabadi-ilaj-da-f-al-basar"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ علاج ضعف البصر"
  en: "Principles of treating weakness of sight"
  ur: "بینائی کے ضعف کے علاج کے اصول"
  es: "Principios del tratamiento de la debilidad visual"
summary:
  ar: "إن كان سبب الضعف يبوسة نفع المرطب والنوم والراحة، وإن كان عن رطوبة استعمل ما يحلل بعد الاستفراغات، والقيء الرقيق نافع وخصوصاً للمشايخ والعتيق يضر جداً، والغراغر والمخوطات والعطوسات نافعة، وتنفع رياضة الأطراف ودلكها، ومن التدبير تمشيط الرأس وفتح العينين {cite:canon-ibn-sina-print-v2 p.204} {cite:canon-ibn-sina-print-v2 p.206}"
  en: "If the cause of the weakness is dryness, moistening, sleep and rest benefit; if from moisture, what dissolves is used after evacuations — thin vomiting benefits, especially the elderly, while stale wine harms greatly — and gargles, mouth-soaks and sternutatories benefit, and exercise and rubbing of the limbs benefit, and among its regimen combing the head and opening the eyes wide {cite:canon-ibn-sina-print-v2 p.204} {cite:canon-ibn-sina-print-v2 p.206}"
  ur: "اگر ضعف کا سبب خشکی ہو تو تر کرنے والی چیز، نیند اور آرام نفع دیتے ہیں؛ اور اگر رطوبت سے ہو تو استفراغات کے بعد محلل استعمال ہوتا ہے — پتلی قی نفع دیتی ہے خصوصاً بزرگوں کو اور پرانی شراب بہت ضرر دیتی ہے — اور غرارے، منہ میں رکھی چیزیں اور چھینک آور نفع دیتے ہیں، اور اعضا کی ورزش اور مالش نفع دیتی ہے، اور تدبیر میں سر کنگھی کرنا اور آنکھیں پوری کھولنا شامل ہے {cite:canon-ibn-sina-print-v2 p.204} {cite:canon-ibn-sina-print-v2 p.206}۔"
  es: "Si la causa de la debilidad es la sequedad, la humectación, el sueño y el descanso son beneficiosos; si es por humedad, se utiliza lo que se disuelve después de las evacuaciones; el vómito ligero es beneficioso, especialmente para los ancianos, mientras que el vino rancio es muy perjudicial; y los gargarismos, los baños bucales y los estornudatorios son beneficiosos, y el ejercicio y el masaje de las extremidades también son beneficiosos, y entre su régimen se incluye peinarse la cabeza y abrir bien los ojos {cite:canon-ibn-sina-print-v2 p.204} {cite:canon-ibn-sina-print-v2 p.206}"
