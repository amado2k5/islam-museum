id: concept/al-nadm-wal-hasra
class: concept
kind: belief
label:
  ar: "الندم والحسرة يوم القيامة"
  en: "Regret and remorse on the Day"
  fr: "Le regret et le remords au Jour"
  ur: "قیامت کے دن ندامت اور حسرت"
  es: "Arrepentimiento y remordimiento en el día"
  tr: "Kıyamet Günü'nde pişmanlık ve pişmanlık"
  id: "Penyesalan dan penyesalan di Hari Penghakiman"
summary:
  ar: "يوم الحسرة يوم يندم المسيء على تقصيره: تتمنى الكافر لو كان ترابًا، وتقول اليد أليست كنت جعلت لله، وتعض اليد يدها التي عملت بها {cite:tafsir-ibn-kathir}."
  en: "The day of remorse, when the wrongdoer regrets his falling short: the disbeliever wishes he were dust, and the hands speak and the hands bite — the day regret profits nothing {cite:tafsir-ibn-kathir}."
  fr: "Le jour du remords, où l'injuste regrette ses manquements : le mécréant souhaite être poussière, les mains parlent et les mains sont mordues, le jour où le regret ne sert à rien {cite:tafsir-ibn-kathir}."
  ur: "حسرت کا دن جب ظالم اپنی کوتاہی پر پچھتائے گا: کافر تمنا کرے گا کاش مٹی ہوتا، اور ہاتھ اپنی عمل کی وجہ سے کاٹا جائے گا — جس دن ندامت کام نہ آئے گی {cite:tafsir-ibn-kathir}۔"
  es: "El día del remordimiento, cuando el malhechor lamenta su falta: el incrédulo desea ser polvo, y las manos hablan y las manos muerden; el día del arrepentimiento no aprovecha nada {cite:tafsir-ibn-kathir}."
  tr: "Pişmanlık Günü, suçlunun eksikliklerinden pişman olduğu gündür: kâfir toprak olmayı diler, el ise 'Tanrı için yaratılmış mıydı' der, el ise çalıştığı eli ısırır {atıf:tafsir-ibn-kathir}."
  id: "Hari Pertobatan adalah hari ketika pelaku menyesali kekurangannya: orang kafir ingin menjadi debu, tangan berkata, 'Apakah ia diciptakan untuk Tuhan?' dan tangan menggigit tangan yang telah dikerjakan {atribusi: tafsir ibn-kathir}."
