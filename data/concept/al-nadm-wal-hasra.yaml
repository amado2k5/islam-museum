label:
  ar: "الندم والحسرة يوم القيامة"
  en: "Regret and remorse on the Day"
  ur: "قیامت کے دن ندامت اور حسرت"
summary:
  ar: "يوم الحسرة يوم يندم المسيء على تقصيره: تتمنى الكافر لو كان ترابًا، وتقول اليد أليست كنت جعلت لله، وتعض اليد يدها التي عملت بها {cite:tafsir-ibn-kathir}."
  en: "The day of remorse, when the wrongdoer regrets his falling short: the disbeliever wishes he were dust, and the hands speak and the hands bite — the day regret profits nothing {cite:tafsir-ibn-kathir}."
  ur: "حسرت کا دن جب ظالم اپنی کوتاہی پر پچھتائے گا: کافر تمنا کرے گا کاش مٹی ہوتا، اور ہاتھ اپنی عمل کی وجہ سے کاٹا جائے گا — جس دن ندامت کام نہ آئے گی {cite:tafsir-ibn-kathir}۔"
