summary:
  ar: "فرع من الرياضيات يحل المسائل بالمجهول ويعالج المعادلات بطرق عامة، وسُمّي باسم «الجبر» الذي جعله الخوارزمي عنواناً لكتابه في عهد المأمون {cite:khwarizmi-jabr-cairo-1939 p.25}. يقوم في كتاب الخوارزمي على عمليتي الجبر ⁦(إكمال الناقص)⁩ والمقابلة ⁦(إلقاء المتماثل من الطرفين)⁩ وعلى الضروب الستة للمعادلات {cite:khwarizmi-jabr-cairo-1939 p.35}."
  en: "The branch of mathematics that solves problems with an unknown quantity by general methods, named after al-jabr, the word al-Khwarizmi used as the title of his book under al-Ma'mun. In his book it rests on the operations of al-jabr (restoring a deficient quantity) and al-muqabala (cancelling like terms on both sides) and on the six types of equation."
