label:
  ar: علم الجبر
  en: Algebra (al-jabr)
  fr: "Algèbre (al-jabr)"
  es: "Álgebra (al-jabr)"
  ur: "الجبرا ⁦(الجبر)⁩"
  tr: "cebir"
  id: "cebir"
summary:
  ar: "فرع من الرياضيات يحل المسائل بالمجهول ويعالج المعادلات بطرق عامة، وسُمّي باسم «الجبر» الذي جعله الخوارزمي عنواناً لكتابه في عهد المأمون {cite:khwarizmi-jabr-cairo-1939 p.25}. يقوم في كتاب الخوارزمي على عمليتي الجبر ⁦(إكمال الناقص)⁩ والمقابلة ⁦(إلقاء المتماثل من الطرفين)⁩ وعلى الضروب الستة للمعادلات {cite:khwarizmi-jabr-cairo-1939 p.35}."
  en: "The branch of mathematics that solves problems with an unknown quantity by general methods, named after al-jabr, the word al-Khwarizmi used as the title of his book under al-Ma'mun. In his book it rests on the operations of al-jabr (restoring a deficient quantity) and al-muqabala (cancelling like terms on both sides) and on the six types of equation."
  fr: "Branche des mathématiques qui résout des problèmes comportant une inconnue par des méthodes générales. Elle tire son nom d’al-jabr, le mot qu’al-Khwarizmi a donné pour titre à son livre sous al-Ma’mun. Dans cet ouvrage, elle repose sur les opérations d’al-jabr (rétablir une quantité diminuée) et d’al-muqabala (supprimer les termes semblables des deux côtés), ainsi que sur les six types d’équations."
  es: "La rama de las matemáticas que resuelve problemas con una cantidad desconocida mediante métodos generales, llamada así por al-jabr, palabra que al-Juarismi utilizó como título de su libro bajo al-Ma'mun. En su libro, se basa en las operaciones de al-jabr (restitución de una cantidad faltante) y al-muqabala (cancelación de términos semejantes en ambos lados) y en los seis tipos de ecuaciones."
  ur: "ریاضی کی وہ شاخ جو عام طریقوں سے نامعلوم مقدار کے ساتھ مسائل کو حل کرتی ہے، جس کا نام الجبر کے نام پر رکھا گیا ہے، الخوارزمی کا لفظ المامون نے اپنی کتاب کے عنوان کے طور پر استعمال کیا ہے۔ اس کی کتاب میں یہ الجبر ⁦(کم مقدار کو بحال کرنا)⁩ اور المقابلہ ⁦(دونوں طرف سے اصطلاحات کو منسوخ کرنا)⁩ اور چھ قسم کی مساوات پر منحصر ہے۔"
  tr: "Bilinmeyenle problemleri çözen ve denklemleri genel şekillerde ele alan bir matematik dalı olan bu dalı 'cebir' olarak adlandırılmıştır; el-Horezmi, el-Me'mun döneminde kitabının başlığını bu konuda yapmıştır {atıf:Khwarizmi-jabr-cairo-1939 s.25}. Al-Khwarizmi'nin kitabı, cebir işlemlerine (kusurun tamamlanması) ve karşılığı (simetrinin her iki taraftan da karışması) ile denklemlerin altı çarpımına dayanmaktadır {cite:khwarizmi-jabr-cairo-1939 s.35}."
  id: "Bilinmeyenle problemleri çözen ve denklemleri genel şekillerde ele alan bir matematik dalı olan bu dalı 'cebir' olarak adlandırılmıştır; el-Horezmi, el-Me'mun döneminde kitabının başlığını bu konuda yapmıştır {atıf:Khwarizmi-jabr-cairo-1939 s.25}. Al-Khwarizmi'nin kitabı, cebir işlemlerine (kusurun tamamlanması) ve karşılığı (simetrinin her iki taraftan da karışması) ile denklemlerin altı çarpımına dayanmaktadır {cite:khwarizmi-jabr-cairo-1939 s.35}."
