id: concept/tul-al-amal
class: concept
kind: ethical
label:
  ar: "طول الأمل"
  en: "Long hope (tul al-amal)"
  ur: "طولِ امید"
  es: "Larga esperanza (tul al-amal)"
  fr: "Long espoir (tul al-amal)"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن إضاعة الوقت تأتي من طول الأمل، لأن الإنسان يظن أن الغد سيأتي. ويرى أن اتباع الهوى يصرف عن الحق، وأن طول الأمل ينسي الآخرة."
  en: "Sheikh Omar Abdelkafy says that wasting time comes from long hope, because a person assumes that tomorrow will come. He holds that following desire turns one from the truth, and that long hope makes one forget the Hereafter."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ وقت کا ضیاع طولِ امید سے آتا ہے، کیونکہ آدمی یہ گمان رکھتا ہے کہ کل آئے گا۔ ان کی رائے ہے کہ خواہش کی پیروی آدمی کو حق سے پھیر دیتی ہے، اور طولِ امید آخرت کو بھلا دیتی ہے۔"
  es: "El jeque Omar Abdelkafy afirma que perder el tiempo proviene de una esperanza infundada, pues uno da por sentado que el mañana llegará. Sostiene que dejarse llevar por el deseo aleja a la persona de la verdad, y que una esperanza prolongada hace olvidar la vida después de la muerte."
  fr: "Le cheikh Omar Abdelkafy affirme que le gaspillage de temps provient d'un espoir démesuré, car on présume que demain viendra. Il soutient que céder à ses désirs détourne de la vérité et qu'un espoir démesuré fait oublier l'au-delà."
