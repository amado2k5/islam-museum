  en: "Long hope (tul al-amal)"
  ur: "طولِ امید"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن إضاعة الوقت تأتي من طول الأمل، لأن الإنسان يظن أن الغد سيأتي. ويرى أن اتباع الهوى يصرف عن الحق، وأن طول الأمل ينسي الآخرة."
  en: "Sheikh Omar Abdelkafy says that wasting time comes from long hope, because a person assumes that tomorrow will come. He holds that following desire turns one from the truth, and that long hope makes one forget the Hereafter."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ وقت کا ضیاع طولِ امید سے آتا ہے، کیونکہ آدمی یہ گمان رکھتا ہے کہ کل آئے گا۔ ان کی رائے ہے کہ خواہش کی پیروی آدمی کو حق سے پھیر دیتی ہے، اور طولِ امید آخرت کو بھلا دیتی ہے۔"
