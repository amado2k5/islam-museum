id: concept/al-kaba-ir
class: concept
kind: ethical
label:
  ar: "الكبائر"
  en: "Greater sins (kaba'ir)"
  ur: "کبیرہ گناہ"
summary:
  ar: "يعرض الشعراوي تعريف الكبيرة عند العلماء بأنها ما جاء فيه وعيد بعذاب الآخرة أو عقوبة مقدرة كالحد، ويقرر أن من اجتنب الكبائر كُفّرت عنه الصغائر، وأن الإصرار على الصغيرة يجعلها كبيرة. ويعرض قائمة من الكبائر استخرجها من القرآن، كما ينقل حواراً بين عمرو بن عبيد وجعفر الصادق يعدّد فيه الأخير الكبائر {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}."
  en: "Al-Sha'rawi gives the scholars' definition of a greater sin: one for which God threatens punishment in the next life or which carries a prescribed penalty. He holds that avoiding greater sins expiates lesser ones, and that persistence in a lesser sin makes it grave. He sets out a list of greater sins drawn from the Qur'an, and recounts an exchange in which Ja'far al-Sadiq enumerates them for Amr ibn Ubayd {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}."
  ur: "شعراوی علماء کی تعریف بیان کرتے ہیں کہ کبیرہ وہ گناہ ہے جس پر آخرت کے عذاب کی وعید ہو یا جس کی مقررہ سزا ہو۔ ان کے مطابق کبیرہ سے بچنے سے صغیرہ معاف ہوتے ہیں، اور صغیرہ پر اصرار اسے کبیرہ بنا دیتا ہے۔ وہ قرآن سے نکالی ہوئی فہرست اور جعفر صادق کی بیان کردہ فہرست نقل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}۔"
wings: [ideas]
themes: [ethics-and-character]
issue:
  ar: "ما الكبيرة، وما الفرق بينها وبين الصغيرة، وهل يكفّر اجتناب الكبائر ما دونها؟"
  en: "What is a greater sin, how does it differ from a lesser one, and does avoiding greater sins expiate the rest?"
  ur: "کبیرہ کیا ہے، صغیرہ سے کیسے مختلف ہے، اور کیا کبیرہ سے بچنا باقی گناہوں کا کفارہ ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-scholars-definition
    stance:
      ar: "الكبيرة ما فيه وعيد أو حد، ولا كبيرة مع الاستغفار، ولا صغيرة مع الإصرار"
      en: "A greater sin is one with a threat or a prescribed penalty; no sin is grave with repentance, and no lesser sin is excused with persistence"
      ur: "کبیرہ وہ ہے جس پر وعید یا حد ہو؛ استغفار کے ساتھ کوئی گناہ کبیرہ نہیں، اور اصرار کے ساتھ کوئی صغیرہ معاف نہیں"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي تعريف «العلماء» ويقول إن الإصرار على الصغيرة يجعلها كبيرة، وإن الاستغفار يخفف الكبيرة، وينسب الحكم إلى العلماء دون تسمية {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}."
      en: "Sha'rawi gives the definition attributed to 'the scholars' and says persistence makes a lesser sin grave; he attributes the rule to the scholars without naming them {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}."
      ur: "شعراوی «علماء» کی طرف منسوب تعریف بیان کرتے ہیں اور کہتے ہیں کہ اصرار صغیرہ کو کبیرہ بنا دیتا ہے؛ وہ علماء کا نام نہیں لیتے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: academic
    id: academic
    stance:
      ar: "تحرير علمي لتعريف الكبيرة وترتيب القوائم لم يُضف بعد"
      en: "A scholarly treatment of the definition of a greater sin and of the lists has not yet been added"
      ur: "کبیرہ کی تعریف اور فہرستوں پر علمی تحقیق ابھی شامل نہیں کی گئی"
    summary:
      ar: "لم يُعرض في هذه الصفحات رأي أكاديمي؛ يحتاج إلى مرجع محدد (needs_source)."
      en: "No academic reading is set out in these pages; it needs a named source (needs_source)."
      ur: "ان صفحات میں کوئی علمی رائے پیش نہیں کی گئی؛ اسے کسی متعین ماخذ کی ضرورت ہے (needs_source)۔"
    sources: []
  - tradition: other
    id: jafar-al-sadiq-list-as-reported
    stance:
      ar: "القائمة المنسوبة إلى جعفر الصادق في حواره مع عمرو بن عبيد، كما يرويها الشعراوي"
      en: "The list attributed to Ja'far al-Sadiq in his exchange with Amr ibn Ubayd, as Sha'rawi reports it"
      ur: "جعفر صادق سے منسوب فہرست، عمرو بن عبید کے ساتھ ان کے مکالمے میں، جیسا کہ شعراوی نقل کرتے ہیں"
    summary:
      ar: "يذكر الشعراوي أن جعفر الصادق عدّد الكبائر بالآيات مثل الشرك واليأس من رحمة الله والأمن من مكره وعقوق الوالدين والقتل والقذف والربا وأكل مال اليتيم والفرار من الزحف والزنا وشهادة الزور وشرب الخمر وترك الصلاة ونقض العهد وقطيعة الرحم {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}."
      en: "Sha'rawi reports that Ja'far al-Sadiq listed greater sins with verses: shirk, despair of God's mercy, feeling safe from God's plan, disobedience to parents, murder, false accusation, usury, eating orphans' wealth, flight from battle, adultery, false witness, perjury, deceit in booty, wine, neglecting prayer, breaking covenants and severing ties of kinship {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}."
      ur: "شعراوی بیان کرتے ہیں کہ جعفر صادق نے آیات کے ساتھ کبیرہ گناہ گنوائے: شرک، اللہ کی رحمت سے مایوسی، اللہ کی تدبیر سے بے خوف، والدین کی نافرمانی، قتل، تہمت، سود، یتیم کا مال کھانا، میدان سے فرار، زنا، جھوٹی گواہی، جھوٹی قسم، مالِ غنیمت میں خیانت، شراب، نماز چھوڑنا، عہد توڑنا اور قطع رحمی {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
