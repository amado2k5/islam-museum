id: concept/al-kaba-ir
class: concept
kind: ethical
label:
  ar: "الكبائر"
  en: "Greater sins (kaba'ir)"
  fr: "Péchés majeurs (kaba’ir)"
  ur: "کبیرہ گناہ"
  es: "Pecados mayores (kaba'ir)"
  tr: "Büyük günahlar"
  id: "Dosa besar"
summary:
  ar: "يعرض الشعراوي تعريف الكبيرة عند العلماء بأنها ما جاء فيه وعيد بعذاب الآخرة أو عقوبة مقدرة كالحد، ويقرر أن من اجتنب الكبائر كُفّرت عنه الصغائر، وأن الإصرار على الصغيرة يجعلها كبيرة. ويعرض قائمة من الكبائر استخرجها من القرآن، كما ينقل حواراً بين عمرو بن عبيد وجعفر الصادق يعدّد فيه الأخير الكبائر {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}."
  en: "Al-Sha'rawi gives the scholars' definition of a greater sin: one for which God threatens punishment in the next life or which carries a prescribed penalty. He holds that avoiding greater sins expiates lesser ones, and that persistence in a lesser sin makes it grave. He sets out a list of greater sins drawn from the Qur'an, and recounts an exchange in which Ja'far al-Sadiq enumerates them for Amr ibn Ubayd {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}."
  fr: "Al-Sha’rawi donne la définition des savants : un péché majeur est un péché pour lequel Dieu menace d’un châtiment dans l’au-delà ou auquel est attachée une peine prescrite. Il estime qu’éviter les péchés majeurs expie les péchés mineurs et que persister dans un péché mineur le rend grave. Il dresse une liste de péchés majeurs tirée du Coran et relate un échange au cours duquel Ja’far al-Sadiq les énumère pour Amr ibn Ubayd {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}."
  ur: "شعراوی علماء کی تعریف بیان کرتے ہیں کہ کبیرہ وہ گناہ ہے جس پر آخرت کے عذاب کی وعید ہو یا جس کی مقررہ سزا ہو۔ ان کے مطابق کبیرہ سے بچنے سے صغیرہ معاف ہوتے ہیں، اور صغیرہ پر اصرار اسے کبیرہ بنا دیتا ہے۔ وہ قرآن سے نکالی ہوئی فہرست اور جعفر صادق کی بیان کردہ فہرست نقل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}۔"
  es: "Al-Sha'rawi da la definición de los eruditos de un pecado mayor: uno por el cual Dios amenaza con castigo en la otra vida o que conlleva una pena prescrita. Sostiene que evitar los pecados mayores expía los menores, y que la persistencia en un pecado menor lo hace grave. Presenta una lista de pecados mayores extraídos del Corán y relata un intercambio en el cual Ja'far al-Sadiq los enumera para Amr ibn Ubayd {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2155}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2157}{citar:tafsir-sharawi-khawatir-scan-vol-2 p. 2159}."
  tr: "Al-Shaarawi, alimlere göre büyük günahların tanımını, ahirette ceza uyarısı veya hadd cezası gibi önceden belirlenmiş bir ceza içeren günahlar olarak sunar ve büyük günahlardan kaçınanın küçük günahları kefaret ettiğini, küçük günahlarda ısrar etmenin ise onları büyük günah haline getirdiğini belirtir. Kur'an'dan alınan büyük günahların bir listesini sunar ve ayrıca Amr ibn Ubayd ile Ja'far al-Sadiq'in başlıca günahları sıraladığı bir diyaloğu aktarır {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-vol-2 s. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s. 2159}."
  id: "Menurut para ulama, Al-Shaarawi memaparkan definisi dosa besar sebagai dosa yang mencakup hukuman yang telah ditentukan seperti peringatan hukuman atau hukuman hadd di akhirat, menyatakan bahwa mereka yang menghindari dosa besar menebus dosa kecil, sementara tetap berdosa kecil menjadikannya dosa besar. Ia menyajikan daftar dosa besar yang diambil dari Al-Qur'an dan juga menceritakan dialog di mana Amr ibn Ubayd dan Ja'far al-Sadiq mencantumkan dosa utama {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm. 2150}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm. 2156}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm. 2157}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm. 2159}}."
