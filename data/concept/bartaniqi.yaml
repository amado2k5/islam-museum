id: concept/bartaniqi
class: concept
kind: natural
label:
  ar: "برطانيقي"
  en: "Bartaniqi (a leaf that binds and heals)"
  fr: "Bartaniqi (feuille astringente et cicatrisante)"
  ur: "برطانیقی"
  es: "Bartaniqi (una hoja que une y cura)"
summary:
  ar: "ورقه قابض في غاية، يدمل الجراحات والقروح، وعصارته أجود شيء للقروح الفموية العتيقة والقلاع، ويُتّخذ منها رُبّ ينفع من القلاع غاية النفع {cite:canon-ibn-sina-print-v1 p.404}."
  en: "Its leaf is extremely astringent and heals wounds and ulcers. Its juice is the best remedy for old mouth ulcers and thrush, and a syrup made of it helps thrush very much {cite:canon-ibn-sina-print-v1 p.404}."
  fr: "Sa feuille est extrêmement astringente et guérirait plaies et ulcères. Son suc serait le meilleur remède aux vieux ulcères buccaux et au muguet ; un sirop préparé avec elle aiderait fortement contre le muguet {cite:canon-ibn-sina-print-v1 p.404}."
  ur: "اس کا پتا انتہائی قابض ہے اور زخموں اور چھالوں کو بھرتا ہے۔ اس کا رس پرانے منہ کے چھالوں اور منہ کی پھپھوندی کے لیے بہترین ہے، اور اس سے بنا رب منہ کی پھپھوندی میں بے حد مفید ہے {cite:canon-ibn-sina-print-v1 p.404}۔"
  es: "Sus hojas son extremadamente astringentes y curan heridas y úlceras. Su jugo es el mejor remedio para las úlceras bucales crónicas y la candidiasis oral, y un jarabe hecho con él ayuda mucho a combatirla {cite:canon-ibn-sina-print-v1 p.404}."
