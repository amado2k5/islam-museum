id: concept/paralysis-shalal
class: concept
kind: legal
label:
  ar: "الشَّلَل"
  en: "Shalal (paralysis: its rulings for touch, prayer, injury, retaliation and marriage)"
summary:
  ar: "الشلل فساد العضو وذهاب حركته، ولا يشترط زوال الحس بالكلية. ويتعلق به أحكام: فالمالكية والحنابلة يقيدون نقض الوضوء باللمس بالشهوة، والأشل يصلي بما يستطيع من الأركان، فإن عجز عن القيام صلى قاعدا، فإن عجز أومأ. ولا تقطع اليد الصحيحة باليد الشلاء، وفي الشلاء حكومة عدل، والشلل في عضو الذكر يثبت الخيار للزوجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10181}"
  en: "Shalal is the corruption of a limb and the loss of its movement; the loss of feeling entirely is not required. Several rulings attach to it. The Malikis and Hanbalis limit breach of ablution by touch to touch with desire. A paralysed person prays with whatever pillars he can perform: if he cannot stand he prays seated, and if he cannot bow or prostrate he signals with his head. A sound hand is not cut for a paralysed hand; the paralysed hand carries a fair assessment of damages, and paralysis of the male organ gives the wife the right to annul the marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10180} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10181}"
