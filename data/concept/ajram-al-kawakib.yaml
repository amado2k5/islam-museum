label: { ar: "أحجام الأجرام السماوية", en: "Sizes of the heavenly bodies", es: "Tamaños de los cuerpos celestes", fr: "Tailles des corps célestes", ur: "آسمانی جسموں کے سائز", tr: "Gök cisimlerinin boyutları", id: "Ukuran benda langit" }
summary:
  ar: "يقدّر الفرغاني أقطار الشمس والقمر والكواكب ونجوم الثوابت وأحجامها بالنسبة إلى الأرض، ويرتب الأجرام بحسب حجمها من الشمس إلى عطارد. أرقام الأحجام كثيرة الإشكال في النص المطبوع، وتُعد قراءات مشكوكاً فيها ما لم تُراجع على الصورة {cite:farghani-elements-astronomy p. 215}{cite:farghani-elements-astronomy p. 217}."
  en: "al-Farghani estimates the apparent and true sizes of the Sun, Moon, planets and fixed stars relative to the Earth, and ranks the bodies from the Sun down to Mercury. Many of the printed figures are garbled in the OCR and are flagged."
  es: "Al-Farghani estima los tamaños aparentes y reales del Sol, la Luna, los planetas y las estrellas fijas en relación con la Tierra, y clasifica los cuerpos celestes desde el Sol hasta Mercurio. Muchas de las cifras impresas aparecen distorsionadas en el OCR y se marcan como incorrectas."
  fr: "Al-Farghani estime les tailles apparentes et réelles du Soleil, de la Lune, des planètes et des étoiles fixes par rapport à la Terre, et classe ces astres du Soleil à Mercure. De nombreuses figures imprimées sont illisibles suite à la reconnaissance optique de caractères et sont signalées."
  ur: "الفرغانی زمین کی نسبت سورج، چاند، سیاروں اور مقررہ ستاروں کے ظاہری اور حقیقی سائز کا تخمینہ لگاتا ہے، اور سورج سے نیچے عطارد تک جسموں کی درجہ بندی کرتا ہے۔ بہت سے پرنٹ شدہ اعداد و شمار کو OCR میں گڑبڑ کر کے جھنڈا لگا دیا گیا ہے۔"
  tr: "Al-Farghani, güneş, ay, gezegenler ve sabitlerin çaplarını ve boyutlarını Dünya'ya göre tahmin eder ve cisimleri Güneş'ten Merkür'e kadar boyutlarına göre düzenler. Cilt numaraları basılı metinde oldukça sorunludur ve {cite:farghani-elements-astronomy s. 215} görüntüsünde referans verilmedikçe tartışmalı okumalar olarak kabul edilir."
  id: "Al-Farghani memperkirakan diameter dan ukuran matahari, bulan, planet, dan konstanta relatif terhadap Bumi, serta mengatur objek berdasarkan ukurannya dari Matahari hingga Merkurius. Nomor volume cukup bermasalah dalam teks cetak dan dianggap sebagai pembacaan kontroversial kecuali disebutkan dalam {cite:farghani-elements-astronomy hlm. 215}."
