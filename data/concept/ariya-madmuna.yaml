label: { ar: "العارية المضمونة", en: "Guaranteed loan (ariya madmuna)", fr: "Prêt garanti (ariya madmuna)", es: "Préstamo garantizado (ariya madmuna)", ur: "ضمانت شدہ قرض ⁦(اریہ مدمونہ)⁩", tr: "Garantili çıplak", id: "Jaminan telanjang" }
summary:
  ar: "مفهوم فقهي في الضمان المالي استقر في السنة النبوية حين استعار النبي مائة درع من صفوان بن أمية قبل حنين، فسأله صفوان: «أغصباً يا محمد؟»، فقال: «بل عارية مضمونة مؤداة»."
  en: "A legal principle of property liability established in prophetic tradition when the Prophet borrowed one hundred coats of mail from Safwan ibn Umayya before Hunayn, assuring him: 'Not by force, but a guaranteed loan to be returned.'"
  fr: "Un principe juridique de responsabilité patrimoniale établi dans la tradition prophétique lorsque le Prophète emprunta cent cottes de mailles à Safwan ibn Umayya avant Hunayn, en lui assurant : « Non de force, mais comme un prêt garanti à rendre. »"
  es: "Un principio jurídico de responsabilidad patrimonial establecido en la tradición profética cuando el Profeta pidió prestadas cien cotas de malla a Safwan ibn Umayya ante Hunayn, asegurándole: \"No por la fuerza, sino como un préstamo garantizado que será devuelto\"."
  ur: "جائیداد کی ذمہ داری کا ایک قانونی اصول پیشن گوئی کی روایت میں اس وقت قائم ہوا جب نبی نے حنین سے پہلے صفوان بن امیہ سے میل کے ایک سو کوٹ ادھار لیے، انہیں یقین دلایا: 'زبردستی سے نہیں، بلکہ ایک ضمانت شدہ قرض واپس کیا جائے گا۔'"
  tr: "Peygamberin Sünnet'te Peygamber'in Hunayn önünde Safvan bin Umeyye'den yüz kalkan ödünç aldığı Fıkhih Sünnetinde kurulan bir mali teminat kavramı. Safvan ona sordu: \"Zorla mı yaptın, ey Muhammed?\" Şöyle dedi: \"Aksine, bu çıplak, garantili bir kalkandır.\""
  id: "Konsep Yurisprudensi tentang Jaminan Keuangan yang Ditetapkan dalam Sunnah Nabi Ketika Nabi meminjam seratus perisai dari Safwan ibn Umayyah sebelum Hunayn. Safwan bertanya kepadanya: \"Apakah engkau memaksanya, wahai Muhammad?\" Ia berkata: \"Sebaliknya, itu adalah perisai yang polos dan dijamin.\""
