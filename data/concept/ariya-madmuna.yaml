summary:
  ar: "مفهوم فقهي في الضمان المالي استقر في السنة النبوية حين استعار النبي مائة درع من صفوان بن أمية قبل حنين، فسأله صفوان: «أغصباً يا محمد؟»، فقال: «بل عارية مضمونة مؤداة»."
  en: "A legal principle of property liability established in prophetic tradition when the Prophet borrowed one hundred coats of mail from Safwan ibn Umayya before Hunayn, assuring him: 'Not by force, but a guaranteed loan to be returned.'"
