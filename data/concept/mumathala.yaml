label: { ar: "المُمَاثَلة", en: "Equivalence (mumathala) in exchange, retaliation, shares and inheritance", ur: "مماثلت (برابری)" }
summary:
  ar: "المماثلة في اللغة المشابهة بين المتفقين، والمساواة تكون بين المختلفين والمتفقين. ولها أحكام: اشتراط التماثل في بيع الربوي بجنسه، والتماثل في خصال القصاص، واستيفاء الحق المالي بعينه أو مثله أو قيمته، والتماثل في حساب الفرائض بين عددين متساويين."
  en: "Mumathala in the lexicon is resemblance between things that agree; equality (musawat) may hold between things that differ. Its rulings cover equal exchange of goods of the same ribawi kind, equivalence in the features required for retaliation, the recovery of a monetary right in kind or its equivalent or value, and equal numbers in the arithmetic of shares."
  ur: "مماثلت کا مطلب ہم جنس چیزوں میں مشابہت ہے۔ اس کے احکام سود کی ہم جنس اشیاء کے تبادلے، قصاص، مالی حق کی وصولی اور میراث کے حساب میں ہیں۔"
