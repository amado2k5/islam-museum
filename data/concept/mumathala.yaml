label: { ar: "المُمَاثَلة", en: "Equivalence (mumathala) in exchange, retaliation, shares and inheritance", ur: "مماثلت ⁦(برابری)⁩", es: "Equivalencia (mumathala) en intercambio, represalia, participaciones y herencia", fr: "Équivalence (mumathala) en matière d'échange, de représailles, de parts et d'héritage", tr: "Benzer", id: "Serupa" }
summary:
  ar: "المماثلة في اللغة المشابهة بين المتفقين، والمساواة تكون بين المختلفين والمتفقين. ولها أحكام: اشتراط التماثل في بيع الربوي بجنسه، والتماثل في خصال القصاص، واستيفاء الحق المالي بعينه أو مثله أو قيمته، والتماثل في حساب الفرائض بين عددين متساويين."
  en: "Mumathala in the lexicon is resemblance between things that agree; equality (musawat) may hold between things that differ. Its rulings cover equal exchange of goods of the same ribawi kind, equivalence in the features required for retaliation, the recovery of a monetary right in kind or its equivalent or value, and equal numbers in the arithmetic of shares."
  ur: "مماثلت کا مطلب ہم جنس چیزوں میں مشابہت ہے۔ اس کے احکام سود کی ہم جنس اشیاء کے تبادلے، قصاص، مالی حق کی وصولی اور میراث کے حساب میں ہیں۔"
  es: "En el léxico, mumathala significa semejanza entre cosas que concuerdan; la igualdad (musawat) puede darse entre cosas que difieren. Sus normas abarcan el intercambio equitativo de bienes del mismo tipo ribawi, la equivalencia en las características requeridas para la represalia, la recuperación de un derecho monetario en especie o su equivalente o valor, y la igualdad en el cálculo de participaciones."
  fr: "Le terme « mumathala » désigne, dans le lexique, la ressemblance entre des choses qui s'accordent; l'égalité (musawat) peut exister entre des choses qui diffèrent. Ses règles couvrent l'échange équitable de biens de même nature (ribawi), l'équivalence des conditions requises pour la rétorsion, le recouvrement d'un droit monétaire en nature ou son équivalent, et l'égalité des parts dans le calcul."
  tr: "Dildeki benzerlik, üzerinde anlaşanlar arasında benzerdir ve eşitlik, farklılaşanlarla anlaşanlar arasında geçerlidir. Kuralları vardır: tefeciliğin türüne göre satışında benzerlik gerekliliği, misilleme özelliklerinde benzerlik, mali hakkın türü, eşdeğeri veya değeri bakımından yerine getirilmesi ve iki eşit sayı arasında zorunlu payların hesaplanmasında benzerlik."
  id: "Kesamaan dalam bahasa serupa antara mereka yang sepakat tentangnya, dan kesetaraan adalah antara mereka yang berbeda dan mereka yang sepakat tentangnya. Ada keputusan: persyaratan kesamaan dalam penjualan riba berdasarkan jenisnya, kesamaan dalam karakteristik pembalasan, pemenuhan hak finansial dalam jenis, ekuivalen, atau nilainya, dan kesamaan dalam menghitung pembagian wajib antara dua jumlah yang sama."
