id: concept/al-shawk-fi-al-halq
class: concept
kind: scientific
label:
  ar: "الشوك وما يجري مجراه"
  en: "Thorns and the like in the throat"
  ur: "حلق میں کانٹا اور اس جیسی چیزیں"
summary:
  ar: "الشوك وشظايا العود والعظم وما أشبه ذلك إذا نشب نظر فإن كان الحس يدركه أو نالته الآلة الناقشة له فالصواب استخراجه على ما يصف ⁦(محمول على أنه وصف الكتاب لا عملية)⁩، وإن فات الحس تحسى عليه الأحساء المزلقة فإن لم ينجع هيّج الفواق والقيء بما وصف وقد يشد خيط قوي بما وصف فيبلع ثم يجذب فيخرج الناشب وقد يغرغر بما وصف فيبين الناشب عن موضعه وقد يضمد الحلق من خارج بأضمدة فيها إنضاج وتفتيح رقيق لينفتح الموضع وتخرج الشوكة أو ما يجري مجراها بذاتها ⁦(الأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.286}"
  en: "Thorns, splinters of wood and bone and the like: when one sticks fast it is looked to — if the sense reaches it or the extracting tool reaches it (the feather, the slip of bamboo, the bowstring doubled), the right is to draw it out as he describes (carried as the book's description, not a procedure); if it escapes the sense, the slippery broths are sipped over it, and if that does not work the hiccup and the vomit are stirred by what he described; a strong thread may be tied to what he described and swallowed then pulled so the stuck thing comes out, and he may gargle with what he described so it parts from its place, and the throat may be poulticed from outside with poultices holding a light ripening and opening so the place opens and the thorn or its like comes out of itself (the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.286}"
  ur: "کانٹے لکڑی اور ہڈی کے ٹکڑے اور اس جیسی چیزیں: جب کوئی پھنس جائے تو دیکھا جاتا ہے — اگر حِس اسے پہچان لے یا نکالنے والا آلہ اسے پہنچ لے ⁦(تطواق، خیزراں کا ٹکڑا، دوہرا کیا ہوا اور کا پردہ)⁩ تو صواب اس کے بیان کردہ طریقے سے نکالنا ہے ⁦(کتاب کے وصف پر محمول، طریقہ نہیں)⁩؛ اگر وہ حِس سے باہر ہو تو اس پر پھسلن شوربے چوسے جاتے ہیں اور اگر وہ نہ چلے تو بیان کردہ چیز سے ہچکی اور قے اُبھاری جاتی ہے؛ بیان کردہ چیز سے مضبوط دھاگا باندھ کر نگل کر کھینچا جا سکتا ہے تو پھنسی چیز نکل آئے، اور بیان کردہ چیز سے غرارہ کیا جا سکتا ہے تو وہ اپنے مقام سے الگ ہو، اور حلق پر باہر سے ایسے ضماد باندھے جا سکتے ہیں جن میں ہلکا پکانا اور کھولنا ہو کہ مقام کھل جائے اور کانٹا یا اس جیسی چیز خود بخود نکل آئے ⁦(اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.286}"
