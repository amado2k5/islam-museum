id: concept/al-shawk-fi-al-halq
class: concept
kind: scientific
label:
  ar: "الشوك وما يجري مجراه"
  en: "Thorns and the like in the throat"
  fr: "Épines et autres corps étrangers dans la gorge"
  ur: "حلق میں کانٹا اور اس جیسی چیزیں"
  es: "Espinas y cosas parecidas en la garganta"
  tr: "Dikenler ve seyrleri"
  id: "Duri dan alurnya"
summary:
  ar: "الشوك وشظايا العود والعظم وما أشبه ذلك إذا نشب نظر فإن كان الحس يدركه أو نالته الآلة الناقشة له فالصواب استخراجه على ما يصف ⁦(محمول على أنه وصف الكتاب لا عملية)⁩، وإن فات الحس تحسى عليه الأحساء المزلقة فإن لم ينجع هيّج الفواق والقيء بما وصف وقد يشد خيط قوي بما وصف فيبلع ثم يجذب فيخرج الناشب وقد يغرغر بما وصف فيبين الناشب عن موضعه وقد يضمد الحلق من خارج بأضمدة فيها إنضاج وتفتيح رقيق لينفتح الموضع وتخرج الشوكة أو ما يجري مجراها بذاتها ⁦(الأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.286}"
  en: "Thorns, splinters of wood and bone and the like: when one sticks fast it is looked to — if the sense reaches it or the extracting tool reaches it (the feather, the slip of bamboo, the bowstring doubled), the right is to draw it out as he describes (carried as the book's description, not a procedure); if it escapes the sense, the slippery broths are sipped over it, and if that does not work the hiccup and the vomit are stirred by what he described; a strong thread may be tied to what he described and swallowed then pulled so the stuck thing comes out, and he may gargle with what he described so it parts from its place, and the throat may be poulticed from outside with poultices holding a light ripening and opening so the place opens and the thorn or its like comes out of itself (the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.286}"
  fr: "Pour une épine, une esquille de bois ou d’os ou tout corps semblable resté fiché, le livre indique qu’on vérifie si on peut le percevoir ou l’atteindre avec un instrument d’extraction (une plume, une lamelle de bambou ou une corde d’arc doublée). Si c’est le cas, il préconise de le retirer comme il le décrit (il s’agit de la description du livre, non d’une procédure à suivre). Si le corps échappe aux sens, le livre évoque des bouillons glissants bus à petites gorgées et, en cas d’échec, le déclenchement du hoquet et du vomissement par les moyens qu’il décrit. Il mentionne aussi un fil solide noué à l’objet qu’il décrit : celui-ci était avalé, puis le fil tiré pour dégager le corps fiché. Il évoque aussi un gargarisme avec ce qu’il décrit pour le déloger, et des cataplasmes appliqués sur la gorge, auxquels il prête une légère action maturative et une action d’ouverture, pour que l’endroit s’ouvre et que l’épine ou le corps semblable sorte de lui-même (les noms de ce genre ne sont pas repris) {cite:canon-ibn-sina-print-v2 p.286}"
  ur: "کانٹے لکڑی اور ہڈی کے ٹکڑے اور اس جیسی چیزیں: جب کوئی پھنس جائے تو دیکھا جاتا ہے — اگر حِس اسے پہچان لے یا نکالنے والا آلہ اسے پہنچ لے ⁦(تطواق، خیزراں کا ٹکڑا، دوہرا کیا ہوا اور کا پردہ)⁩ تو صواب اس کے بیان کردہ طریقے سے نکالنا ہے ⁦(کتاب کے وصف پر محمول، طریقہ نہیں)⁩؛ اگر وہ حِس سے باہر ہو تو اس پر پھسلن شوربے چوسے جاتے ہیں اور اگر وہ نہ چلے تو بیان کردہ چیز سے ہچکی اور قے اُبھاری جاتی ہے؛ بیان کردہ چیز سے مضبوط دھاگا باندھ کر نگل کر کھینچا جا سکتا ہے تو پھنسی چیز نکل آئے، اور بیان کردہ چیز سے غرارہ کیا جا سکتا ہے تو وہ اپنے مقام سے الگ ہو، اور حلق پر باہر سے ایسے ضماد باندھے جا سکتے ہیں جن میں ہلکا پکانا اور کھولنا ہو کہ مقام کھل جائے اور کانٹا یا اس جیسی چیز خود بخود نکل آئے ⁦(اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.286}"
  es: "Espinas, astillas de madera y hueso y similares: cuando una se clava firmemente, se busca; si el sentido la alcanza o la herramienta de extracción la alcanza (la pluma, la tira de bambú, la cuerda del arco doblada), lo correcto es extraerla como él describe (se presenta como la descripción del libro, no como un procedimiento); si escapa al sentido, se sorben los caldos resbaladizos sobre ella, y si eso no funciona, el hipo y el vómito se agitan con lo que él describió; se puede atar un hilo fuerte a lo que él describió y tragarlo, luego tirar para que salga lo atascado, y se puede hacer gárgaras con lo que él describió para que se separe de su lugar, y se puede aplicar una cataplasma en la garganta desde afuera con cataplasmas que contienen una ligera maduración y apertura para que el lugar se abra y la espina o similar salga por sí sola (se omiten los nombres de este tipo) {cite:canon-ibn-sina-print-v2 p.286}"
  tr: "Dikenler, çubuk parçaları, kemik ve benzerleri, eğer görme ortaya çıkarsa ve duyu ona ulaşırsa veya onu tartışan cihaz ona ulaşırsa, doğru bakış açısı onu anlatıldığı gibi çıkarmaktır (kitabın bir tanımı olarak alınır, bir uygulama olarak değil). Duyular eksikse, kayganlaştırıcı his hissedilir. Histeri ve kusma anlatıldığı gibi çalışmazsa, güçlü bir ip sıkılır ve yutulursa, sonra çekilir ve kıvılcım çıkarılırsa, kıvılcım yerinden çıkar. Boğaz dışarıdan ince yumuşatma ve hafifletme ile bandajlarla sarılır, bölge açılır ve diken ya da akıntısı kendiliğinden çıkar (bu cinsin isimleri de dahil edilmiştir) {cite:canon-ibn-sina-print-v2 s.286}"
  id: "Duri, fragmen ranting, tulang, dan benda serupa, jika penglihatan muncul dan indra mencapainya atau alat yang membahas itu mencapainya, perspektif yang benar adalah menghilangkannya seperti yang dijelaskan (diambil sebagai definisi buku, bukan sebagai aplikasi). Jika indera hilang, sensasi pelumas akan dirasakan. Jika histeria dan muntah tidak bekerja seperti yang dijelaskan, tali kuat dikencangkan dan ditelan, lalu ditarik dan percikan api padam, percikan keluar dari tempatnya. Tenggorokan dibalut secara eksternal dengan perban dengan pelunakan halus dan pecerahan, area dibuka, dan duri atau cairan keluar secara spontan (nama genus ini juga termasuk) {cite:canon-ibn-sina-print-v2 hlm.286}"
