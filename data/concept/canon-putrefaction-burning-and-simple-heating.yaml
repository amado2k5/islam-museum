summary:
  ar: "يميز ابن سينا في فصل المسخنات بين العفونة والإحراق والتسخين الساذج، فالعفونة تحدث حرارة غريبة وفعلها التسخين المطلق، والإحراق تمييز الجوهر الرطب عن اليابس بالتصعيد والترسيب، والتسخين الساذج بقاء الرطوبات على طبائعها مع زيادة سخونتها {cite:canon-ibn-sina-print-v1 p.143}."
  en: "In the chapter on warming agents Ibn Sina distinguishes putrefaction, burning and simple heating: putrefaction yields a foreign heat and its action is plain warming; burning separates the moist from the dry substance by raising one and settling the other; simple heating leaves the moistures in their natures but hotter {cite:canon-ibn-sina-print-v1 p.143}."
