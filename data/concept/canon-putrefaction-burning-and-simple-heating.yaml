id: concept/canon-putrefaction-burning-and-simple-heating
class: concept
kind: scientific
label:
  ar: "العفونة والإحراق والتسخين الساذج عند ابن سينا"
  en: "Putrefaction, burning and simple heating in the Canon"
  fr: "Putréfaction, combustion et simple échauffement dans le Canon"
  ur: "عفونت، جلانا اور سادہ گرم کرنا، قانون کے مطابق"
  es: "Putrefacción, combustión y calentamiento simple en el Canon"
  tr: "İbn Sina'ya göre çürüme, yanma ve saf ısınma"
  id: "Pembusukan, terbakar, dan pemanasan naif menurut Ibn Sina"
summary:
  ar: "يميز ابن سينا في فصل المسخنات بين العفونة والإحراق والتسخين الساذج، فالعفونة تحدث حرارة غريبة وفعلها التسخين المطلق، والإحراق تمييز الجوهر الرطب عن اليابس بالتصعيد والترسيب، والتسخين الساذج بقاء الرطوبات على طبائعها مع زيادة سخونتها {cite:canon-ibn-sina-print-v1 p.143}."
  en: "In the chapter on warming agents Ibn Sina distinguishes putrefaction, burning and simple heating: putrefaction yields a foreign heat and its action is plain warming; burning separates the moist from the dry substance by raising one and settling the other; simple heating leaves the moistures in their natures but hotter {cite:canon-ibn-sina-print-v1 p.143}."
  fr: "Au chapitre des agents réchauffants, Ibn Sina distingue putréfaction, combustion et simple échauffement : la première produit une chaleur étrangère et réchauffe simplement ; la combustion sépare substance humide et sèche, élevant l’une et déposant l’autre ; le simple échauffement conserve la nature des humidités mais accroît leur chaleur {cite:canon-ibn-sina-print-v1 p.143}."
  es: "En el capítulo sobre agentes de calentamiento, Ibn Sina distingue entre putrefacción, combustión y calentamiento simple: la putrefacción produce un calor extraño y su acción es simplemente calentar; la combustión separa la sustancia húmeda de la seca elevando una y depositando la otra; el calentamiento simple deja las humedades en su naturaleza pero más calientes {cite:canon-ibn-sina-print-v1 p.143}."
  ur: "وارمنگ ایجنٹس کے باب میں ابن سینا نے پٹریفیکشن، جلنے اور سادہ حرارت میں فرق کیا ہے: پٹریفیکشن ایک غیر ملکی حرارت پیدا کرتا ہے اور اس کا عمل سادہ گرمی ہے۔ جلانے سے ایک کو اٹھا کر اور دوسرے کو حل کرکے خشک مادے سے نمی الگ ہوجاتی ہے۔ سادہ حرارت ان کی فطرت میں نمی چھوڑ دیتی ہے لیکن زیادہ گرم {حوالہ:کینن ابن سینا پرنٹ-v1 p.143}۔"
  tr: "İbn Sina, ısıtıcılar bölümünde çürüme, yanma ve saf ısınma arasında ayrım yapar. Bozunma garip ısı oluşturur ve mutlak ısınmaya neden olur. Yanma, ıslak özü kuru maddeden yükselme ve tortul olarak ayırırken, naif ısınma ise nemin doğasında tutulması ve ısısını artırmasıdır. {cite:canon-ibn-sina-print-v1 s.143}."
  id: "Ibn Sina membedakan antara peluruhan, pembakaran, dan pemanasan naif, dalam bab tentang pemanas. Peluruhan menyebabkan panas aneh dan menyebabkan pemanasan absolut. Pembakaran membedakan esensi basah dari bahan kering melalui kenaikan dan sedimentasi, dan pemanasan naif adalah penahanan kelembapan dalam sifatnya sambil meningkatkan panasnya. {cite:canon-ibn-sina-print-v1 hlm.143}."
