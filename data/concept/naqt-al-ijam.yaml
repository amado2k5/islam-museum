id: concept/naqt-al-ijam
class: concept
kind: term
label:
  ar: "نقط الإعجام: نقط الحروف على عهد عبد الملك والحجاج"
  en: Dotting of letters (naqt al-i'jam) under Abd al-Malik and al-Hajjaj
  ur: "نقطِ اعجام: عبد الملک اور حجاج کے عہد میں حروف کے نقطے"
summary:
  ar: "الإعجام نقط الحروف المتشابهة لتمييزها، وعلى المشهور أن المصاحف لم تُعجم إلا في عهد عبد الملك بن مروان حين ندب الحجاج نصر بن عاصم ويحيى بن يعمر، تلميذي أبي الأسود، فأعجما المصحف ولا يزيدان النقط على ثلاث في الحرف {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}."
  en: "I'jam is the dotting of similar letters to tell them apart; on the best-known account the codices were not dotted until Abd al-Malik ibn Marwan's time, when al-Hajjaj commissioned Nasr ibn Asim and Yahya ibn Ya'mar, students of Abu al-Aswad, who dotted the codex, putting no more than three dots on any letter {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}."
  ur: "اعجام مشابہ حروف میں فرق کے لیے ان پر نقطے لگانا ہے؛ مشہور یہ ہے کہ مصاحف کو عبد الملک بن مروان کے عہد ہی میں اعجام ہوا جب حجاج نے ابو الاسود کے شاگردوں نصر بن عاصم اور یحییٰ بن یعمر کو مقرر کیا اور انھوں نے مصحف پر نقطے لگائے اور کسی حرف پر تین سے زیادہ نہ ہونے دیے {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}۔"
