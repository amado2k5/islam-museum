id: concept/alya
class: concept
kind: legal
label: { ar: "الألية", en: "Alya (the rump, and its rulings)", fr: "Alya (la fesse et les avis juridiques qui s’y rapportent)", es: "Alya (el remanente y sus decisiones)" }
summary:
  ar: "الألية العجيزة أو اللحم والشحم الذي يركب العجز، وتتعلق بها أحكام في الوضوء والنوم والأضحية والجناية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332} ويرى الحنفية والشافعية أن نوم المتوضئ ممكنا أليته من الأرض لا ينقض وضوءه، وفي إجزاء الشاة البتراء في الأضحية أقوال، وفي الجناية على الألية القصاص عند جمهور الفقهاء، وفي الخطأ نصف الدية، والدية الكاملة في الأليتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}"
  en: "Alya is the rump, the flesh and fat that sit over the buttock. Rulings on it touch ablution, sleep, sacrifice and injury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332} The Hanafis and Shafi'is hold that sleeping with the rump on the ground does not break ablution; the views on a sacrifice with its rump-fat cut off differ; for injury to the rump, qisas is due in the majority view, and in an accident half a diya, with the full diya for both rumps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}"
  fr: "L’alya est la fesse, faite de chair et de graisse au niveau du postérieur. Les règles qui s’y rapportent concernent les ablutions, le sommeil, le sacrifice et les blessures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332} Les hanafites et les chaféites estiment que dormir assis à même le sol n’annule pas les ablutions ; les avis divergent sur la validité d’un sacrifice lorsque la graisse de la croupe de l’animal a été coupée. Pour une blessure à la fesse, le qisas est dû selon la majorité ; en cas d’accident, il est dû une demi-diya pour une fesse et la diya entière pour les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}"
  es: "Alya es la grupa, la carne y la grasa que se asienta sobre las nalgas. Las normas al respecto abarcan la ablución, el sueño, el sacrificio y las lesiones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332} Los hanafíes y los shafiíes sostienen que dormir con la grupa en el suelo no invalida la ablución; las opiniones sobre un sacrificio con la grasa de la grupa cortada difieren; por lesiones en la grupa, se debe qisas según la opinión mayoritaria, y en caso de accidente media diya, con la diya completa para ambas grupas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}"
