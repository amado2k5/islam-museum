label: { ar: "الألية", en: "Alya (the rump, and its rulings)" }
summary:
  ar: "الألية العجيزة أو اللحم والشحم الذي يركب العجز، وتتعلق بها أحكام في الوضوء والنوم والأضحية والجناية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332} ويرى الحنفية والشافعية أن نوم المتوضئ ممكنا أليته من الأرض لا ينقض وضوءه، وفي إجزاء الشاة البتراء في الأضحية أقوال، وفي الجناية على الألية القصاص عند جمهور الفقهاء، وفي الخطأ نصف الدية، والدية الكاملة في الأليتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}"
  en: "Alya is the rump, the flesh and fat that sit over the buttock. Rulings on it touch ablution, sleep, sacrifice and injury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332} The Hanafis and Shafi'is hold that sleeping with the rump on the ground does not break ablution; the views on a sacrifice with its rump-fat cut off differ; for injury to the rump, qisas is due in the majority view, and in an accident half a diya, with the full diya for both rumps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3333}"
