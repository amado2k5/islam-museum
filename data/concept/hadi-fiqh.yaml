id: concept/hadi-fiqh
class: concept
kind: legal
label: { ar: "هادي", en: "Hadi (the whitish fluid before childbirth: its ruling on ablution and purity)", es: "Hadi (el líquido blanquecino antes del parto: su normativa sobre la ablución y la pureza)", fr: "Hadi (le liquide blanchâtre avant l'accouchement: son importance pour les ablutions et la pureté)" }
summary:
  ar: "الهادي في الاصطلاح الفقهي خاص بالمالكية، وهو ماء أبيض يخرج من الحامل قرب الولادة، أو دم أبيض يخرج منها، ويُعرّفه بعضهم بأنه ماء يخرج عند وضع الحمل أو موجب السقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} وهو يفترق عن المذي والودي والمني والحيض والنفاس بالخروج من القبل أو الفرج، وأن الحيض يوجب الغسل والهادي لا يوجبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} وعند المالكية قولان في نقض الوضوء بالهادي: المعتمد أنه ناقض، والقول الآخر أنه ليس بشيء ولا يُتوضأ منه، لأنه غير معتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} واتفق المالكية على نجاسته، وكذلك الحنفية والشافعية والحنابلة في ما يخرج من الحامل قبل الولادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768}"
  en: "Hadi, in the technical sense, is a term of the Malikis: a whitish fluid that comes from a pregnant woman near childbirth; some define it as a fluid coming at the birth or at a miscarriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} It differs from madhi, wadi, semen, menses and postpartum bleeding in its outflow from the womb, and menses requires bathing while hadi does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} The Malikis have two views on whether hadi breaks ablution: the accepted one says it does, the other says it is nothing, since it is not habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} The Malikis hold hadi impure, and the Hanafis, Shafi'is and Hanbalis agree on the impurity of what comes from a pregnant woman before the birth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768}"
  es: "Hadi, en sentido técnico, es un término de los Malikis: un fluido blanquecino que sale de una mujer embarazada cerca del parto; algunos lo definen como un fluido que sale en el parto o en un aborto espontáneo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} Se diferencia de madhi, wadi, semen, menstruación y sangrado posparto en su salida del útero, y la menstruación requiere baño mientras que hadi no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} Los malikíes tienen dos puntos de vista sobre si el hadi anula la ablución: el aceptado dice que sí, el otro dice que no es nada, ya que no es habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} Los malikíes consideran el hadi impuro, y los hanafíes, shafi'ís y hanbalíes coinciden en la impureza de lo que proviene de una mujer embarazada antes del parto. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768}"
  fr: "Le terme « hadi », au sens technique, est un terme malikite désignant un liquide blanchâtre s'écoulant d'une femme enceinte en fin de grossesse; certains le définissent comme un liquide émis lors de l'accouchement ou d'une fausse couche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} Il se distingue du madhi, du wadi, du sperme, des menstruations et des saignements post-partum par son écoulement hors de l'utérus, et par le fait que les menstruations nécessitent une toilette, contrairement au hadi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} Les Malikites ont deux avis sur la question de savoir si le hadi annule les ablutions: l’avis majoritaire est qu’il les annule, l’autre est qu’il n’y a pas lieu de s’inquiéter, car il n’est pas habituel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} Les Malikites considèrent le hadi comme impur, et les Hanafites, les Shafi’ites et les Hanbalites s’accordent sur l’impureté de ce qui provient d’une femme enceinte avant l’accouchement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768}"
