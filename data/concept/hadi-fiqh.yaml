label: { ar: "هادي", en: "Hadi (the whitish fluid before childbirth: its ruling on ablution and purity)" }
summary:
  ar: "الهادي في الاصطلاح الفقهي خاص بالمالكية، وهو ماء أبيض يخرج من الحامل قرب الولادة، أو دم أبيض يخرج منها، ويُعرّفه بعضهم بأنه ماء يخرج عند وضع الحمل أو موجب السقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} وهو يفترق عن المذي والودي والمني والحيض والنفاس بالخروج من القبل أو الفرج، وأن الحيض يوجب الغسل والهادي لا يوجبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} وعند المالكية قولان في نقض الوضوء بالهادي: المعتمد أنه ناقض، والقول الآخر أنه ليس بشيء ولا يُتوضأ منه، لأنه غير معتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} واتفق المالكية على نجاسته، وكذلك الحنفية والشافعية والحنابلة في ما يخرج من الحامل قبل الولادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768}"
  en: "Hadi, in the technical sense, is a term of the Malikis: a whitish fluid that comes from a pregnant woman near childbirth; some define it as a fluid coming at the birth or at a miscarriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} It differs from madhi, wadi, semen, menses and postpartum bleeding in its outflow from the womb, and menses requires bathing while hadi does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} The Malikis have two views on whether hadi breaks ablution: the accepted one says it does, the other says it is nothing, since it is not habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} The Malikis hold hadi impure, and the Hanafis, Shafi'is and Hanbalis agree on the impurity of what comes from a pregnant woman before the birth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16767} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16768}"
