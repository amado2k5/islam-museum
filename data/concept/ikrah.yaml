  id: sunni-sharawi-no-compulsion
  stance:
    ar: لا إكراه في الدين؛ والقتال شُرع لتقرير حرية اختيار الدين لا لفرضه
    en: No compulsion in religion; fighting was legislated to secure freedom to choose a religion, not to impose one
  summary:
    ar: 'يستدل الشعراوي بالآية المعروفة في نفي الإكراه في الدين [[passage/quran-2-256|البقرة 256]] {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2513}، ويرى أن الإسلام جاء ليرفع التسلط عن اختيار الفرد لدينه، وأن البلاد التي فُتحت بالسيف بقي فيها قوم على دياناتهم، ولو كان القتال لفرض الدين لما وُجد فيها غير المسلم {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2513}. وهذا رأيه في موضع تفسيره، ولم تُعرض بعد أقوال غيره في معنى الإكراه والقتال من مصدر محدد (needs_source).'
    en: 'Sha''rawi cites the verse on there being no compulsion in religion [[passage/quran-2-256|Q. 2:256]] {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2513}. He holds that Islam came to lift domination over a person''s choice of religion, and that in lands opened by the sword some people kept their faiths, which would not be so if fighting were to impose a religion {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2513}. This is his view at this point in the commentary; other opinions on compulsion and fighting are not yet set out from a named source (needs_source).'
