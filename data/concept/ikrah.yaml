label:
  ar: الإكراه
  en: Compulsion (ikrah)
summary:
  ar: "الإكراه في حديث ابن عباس — التاسع والثلاثون من الأربعين — ثالث ما تجاوز الله به عن الأمة: «وما استكرهوا عليه» — وهو إلجاء الغير بالتهديد المحقق إلى فعل أو قول، ويترتب عليه عند الشرح اختلاف الأحكام بحسب محله: ففي كلمة الكفر خصصه قوله تعالى إلا من أكره وقلبه مطمئن بالإيمان، وفي المعاملات والأقوال أثر في الصحة واللزوم، والجامع أن الإكراه ينتفي به الرضا القاصد فلا يستقر الحكم على صاحبه استقرار الاختياري (جامع العلوم والحكم ص 796)."
  en: "Compulsion in Ibn Abbas's hadith — the thirty-ninth of the Forty — is the third thing God lifted from the community: 'and what they were coerced into' — another's forcing one, by credible threat, into a deed or utterance; its rulings in the commentary differ by subject: in the word of unbelief it was excepted by His saying 'except one compelled while his heart is at rest in faith', and in transactions and utterances it affects validity and bindingness, the unifying principle being that compulsion removes deliberate assent so the ruling does not settle upon its subject as it settles on the willing actor (Jami' al-Ulum wal-Hikam p. 796)."
