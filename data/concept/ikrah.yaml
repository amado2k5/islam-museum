label: { ar: "الإكراه", en: "Ikrah (duress or compulsion)", es: "Ikrah (coacción o presión)", fr: "Ikrah (contrainte ou obligation)", ur: "اکراہ ⁦(زبردستی یا مجبوری)⁩" }
summary:
  ar: "الإكراه فعل يفعله المرء بغيره فينتفي به رضاه أو يفسد به اختياره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} والإكراه بغير حق من الكبائر، وينقسم إلى ملجئ وغير ملجئ، ويتفرد الحنفية بهذا التقسيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244} والإكراه يعدم الرضا ويفسد الاختيار عند الحنفية؛ والإقرار المكره عليه باطل، وعقود البيع المكره عليها فاسدة، وتصح معه الأنكحة والطلاق والنذر واليمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3245} وشرط الإكراه قدرة المكره على ما هدد به، وخوف المكره، وأن يكون التهديد بالقتل أو بإتلاف عضو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3241} ويسقط الحد عن المكره لشبهة الإكراه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3248}"
  en: "Duress is an act done to another that removes his consent or spoils his choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} Coercion without right is a major sin, and the Hanafis alone divide it into compelling and non-compelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244} For the Hanafis, duress removes consent and corrupts choice: a confession made under it is void, a sale made under it is defective, while marriages, divorces, vows and oaths made under it stand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3245} The conditions are the coercer's power to carry out the threat, the victim's fear, and a threat of killing or of losing a limb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3241} Duress removes the hadd penalty from the one compelled, because it is a doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3248}"
  es: "La coacción es un acto realizado a otro que elimina su consentimiento o anula su elección. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} La coacción sin derecho es un pecado grave, y solo los Hanafis la dividen en coacción obligatoria y no obligatoria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244} Para los Hanafis, la coacción elimina el consentimiento y corrompe la elección: una confesión hecha bajo ella es nula, una venta hecha bajo ella es defectuosa, mientras que los matrimonios, divorcios, votos y juramentos hechos bajo ella son válidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3245} Las condiciones son el poder del coaccionador para llevar a cabo la amenaza, el miedo de la víctima y la amenaza de matar o perder un miembro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3241} La coacción elimina la pena hadd del obligado, porque es una duda. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3247}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3248}"
  fr: "La contrainte est un acte commis sur autrui qui prive quelqu'un de son consentement ou altère sa liberté de choix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} La coercition sans fondement est un péché majeur, et seuls les hanafites la distinguent en contrainte réelle et contrainte réelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244} Pour les hanafites, la contrainte prive quelqu'un de son consentement et corrompt sa liberté de choix: une confession faite sous sa contrainte est nulle, une vente conclue sous sa contrainte est viciée, tandis que les mariages, divorces, vœux et serments prononcés sous sa contrainte sont valides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3245} Les conditions sont le pouvoir du coerciteur de mettre à exécution la menace, la peur de la victime et la menace de tuer ou de perdre un membre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3241} La contrainte supprime la pénalité hadd de celui qui est contraint, car il s'agit d'un doute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3248}"
  ur: "دباؤ ایک ایسا عمل ہے جو کسی دوسرے کے ساتھ کیا جاتا ہے جو اس کی رضامندی کو ختم کرتا ہے یا اس کی پسند کو خراب کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3237} بغیر حق کے زبردستی کرنا کبیرہ گناہ ہے، اور اکیلے احناف اسے مجبور اور غیر مجبور میں تقسیم کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244} احناف کے نزدیک جبر رضامندی کو ختم کرتا ہے اور انتخاب کو بگاڑ دیتا ہے: اس کے تحت کیا گیا اقرار باطل ہے، اس کے تحت کیا گیا اقرار باطل ہے، جب کہ اس کے تحت فروخت اور نکاح باطل ہے۔ اس کے نیچے کھڑا ہے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3245} شرائط یہ ہیں کہ دھمکی، شکار کا خوف، اور جان سے مارنے یا ایک عضو کھونے کی دھمکی پر عمل کرنے کے لیے مجبور کرنے والے کی طاقت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3241} جبر مجبور سے حد کی سزا کو ہٹا دیتا ہے، کیونکہ یہ شک ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3247}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3248}"
