label: { ar: "الإكراه", en: "Ikrah (duress or compulsion)" }
summary:
  ar: "الإكراه فعل يفعله المرء بغيره فينتفي به رضاه أو يفسد به اختياره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} والإكراه بغير حق من الكبائر، وينقسم إلى ملجئ وغير ملجئ، ويتفرد الحنفية بهذا التقسيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244} والإكراه يعدم الرضا ويفسد الاختيار عند الحنفية؛ والإقرار المكره عليه باطل، وعقود البيع المكره عليها فاسدة، وتصح معه الأنكحة والطلاق والنذر واليمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3245} وشرط الإكراه قدرة المكره على ما هدد به، وخوف المكره، وأن يكون التهديد بالقتل أو بإتلاف عضو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3241} ويسقط الحد عن المكره لشبهة الإكراه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3248}"
  en: "Duress is an act done to another that removes his consent or spoils his choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3237} Coercion without right is a major sin, and the Hanafis alone divide it into compelling and non-compelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244} For the Hanafis, duress removes consent and corrupts choice: a confession made under it is void, a sale made under it is defective, while marriages, divorces, vows and oaths made under it stand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3245} The conditions are the coercer's power to carry out the threat, the victim's fear, and a threat of killing or of losing a limb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3241} Duress removes the hadd penalty from the one compelled, because it is a doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3248}"
