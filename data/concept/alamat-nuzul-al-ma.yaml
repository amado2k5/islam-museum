id: "concept/alamat-nuzul-al-ma"
class: "concept"
kind: "scientific"
label:
  ar: "علامات نزول الماء"
  en: "The signs of the descent of water"
  fr: "Signes de la descente de l’eau"
  ur: "پانی کے نزول کی علامتیں"
  es: "Las señales del descenso del agua"
summary:
  ar: "العلامة المنذرة بالماء الخيالات المذكورة التي ليست عن أسباب أخرى، وأن تحدث معها كدورة محسوسة خصوصاً إذا كان في إحدى العينين، وأن تتخيل الأشياء المضيئة كالأسرجة مضاعفة؛ ويفرق بين الماء والسدة الباطنة بأن إحدى العينين إذا غمضت اتسعت الأخرى في الماء ولم تتسع في السدة، وفي الانتشار لا يكون شيء من ذلك ⁦⁦(وفيه خبر رجل عالج نفسه منقول كخبر الكتاب موسوماً)⁩⁩ {cite:canon-ibn-sina-print-v2 p.214}"
  en: "The sign heralding the water is the known phantasms not from other causes, a sensible turbidity arising with them especially in one eye, and luminous things imagined doubled like lamps; the water is told from the inner occlusion in that when one eye is closed the other widens in the water and not in the occlusion, and in intishar none of this occurs ⁦(it includes the report of a man who treated himself, carried as the book's transmitted report and labelled)⁩ {cite:canon-ibn-sina-print-v2 p.214}"
  fr: "La descente de l’eau s’annonce par les phénomènes visuels connus, lorsqu’ils n’ont pas d’autre cause, par un trouble perceptible qui les accompagne, surtout dans un seul œil, et par la perception en double d’objets lumineux comme les lampes. On distingue l’eau de l’occlusion interne en fermant un œil : l’autre se dilate dans le premier cas, mais non dans le second. Rien de tel ne se produit dans l’intishar. ⁦(La fiche comprend le récit d’un homme qui s’est soigné lui-même, signalé comme un récit transmis par le livre.)⁩ {cite:canon-ibn-sina-print-v2 p.214}"
  ur: "پانی کی پیش بندی کرنے والی علامت وہ معروف خیالات ہیں جو دیگر اسباب سے نہ ہوں، ان کے ساتھ محسوس کدورت پیدا ہو خصوصاً ایک آنکھ میں، اور روشن چیزیں چراغوں کی طرح دوہری محسوس ہوں؛ اور پانی اور باطنی سدے میں فرق یہ ہے کہ ایک آنکھ بند کرنے سے دوسری پانی میں پھیل جاتی ہے اور سدے میں نہیں، اور انتشار میں ان میں سے کچھ نہیں ہوتا ⁦⁦(اس میں ایک شخص کے اپنے علاج کی خبر بھی ہے جو کتاب کی منقولہ خبر کے طور پر موسوم منقول ہے)⁩⁩ {cite:canon-ibn-sina-print-v2 p.214}"
  es: "La señal que anuncia el agua son los fantasmas conocidos que no provienen de otras causas, una turbidez perceptible que surge con ellos especialmente en un ojo, y cosas luminosas imaginadas duplicadas como lámparas; el agua se menciona por la oclusión interna en que cuando un ojo está cerrado, el otro se dilata en el agua y no en la oclusión, y en intishar nada de esto ocurre (incluye el relato de un hombre que se trató a sí mismo, llevado como el relato transmitido del libro y etiquetado) {cite:canon-ibn-sina-print-v2 p.214}"
