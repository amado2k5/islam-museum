label: { ar: "ضوء القمر من الشمس وأطواره", en: "The Moon shines by the Sun's light, and its phases", ur: "چاند کی روشنی سورج سے ہے اور اس کے اطوار", es: "La Luna brilla con la luz del Sol y sus fases", fr: "La Lune brille grâce à la lumière du Soleil et à ses phases.", tr: "Güneşten gelen ay ışığı ve ayın evreleri", id: "Cahaya bulan dari matahari dan fase-fasenya" }
summary:
  ar: "يبين البتاني أن القمر يقبل الضوء من الشمس، وأن نصف كرته المواجه للشمس هو المضيء؛ فإذا كان النصف المواجه للأرض هو المضيء ظهر القمر كاملاً في منتصف الشهر، وإذا كان المضيء في الجهة البعيدة عن الأرض صار محاقاً. {cite:zij-sabi-nallino-byblion p.92}."
  en: "Al-Battani explains that the Moon receives light from the Sun, and that the half facing the Sun is the lit half. When the half facing the Earth is the lit one the Moon appears full in the middle of the month; when the lit half faces away from the Earth it is new. {cite:zij-sabi-nallino-byblion p.92}."
  ur: "البتانی بتاتے ہیں کہ چاند سورج سے روشنی لیتا ہے، اور اس کا سورج کی طرف والا نصف کرہ روشن ہوتا ہے۔ جب زمین کی طرف والا نصف روشن ہو تو مہینے کے وسط میں چاند پورا دکھائی دیتا ہے، اور جب روشن حصہ زمین سے دور ہو تو وہ محاق ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.92}۔"
  es: "Al-Battani explica que la Luna recibe luz del Sol, y que la mitad que mira hacia el Sol es la iluminada. Cuando la mitad que mira hacia la Tierra es la iluminada, la Luna aparece llena a mediados de mes; cuando la mitad iluminada mira en dirección opuesta a la Tierra, es luna nueva. {cite:zij-sabi-nallino-byblion p.92}."
  fr: "Al-Battani explique que la Lune reçoit la lumière du Soleil et que la moitié qui lui est tournée vers le Soleil est éclairée. Lorsque c'est la moitié tournée vers la Terre qui est éclairée, la Lune apparaît pleine au milieu du mois; lorsque c'est la moitié éclairée qui est tournée vers l'extérieur, c'est la nouvelle Lune. {cite:zij-sabi-nallino-byblion p.92}."
  tr: "El-Battani, ayın güneşten ışık aldığını ve küresinin güneşe bakan yarısının aydınlık taraf olduğunu açıklıyor. Eğer dünyaya bakan taraf aydınlık taraf ise, ay ayın ortasında dolunay olarak görünür; eğer aydınlık taraf dünyaya en uzak tarafta ise, bu yeni aydır. {cite:zij-sabi-nallino-byblion s.92}"
  id: "Al-Battani menjelaskan bahwa bulan menerima cahaya dari matahari, dan separuh bola bulan yang menghadap matahari adalah separuh yang diterangi. Jika separuh yang menghadap bumi adalah separuh yang diterangi, bulan tampak purnama di tengah bulan, dan jika separuh yang diterangi berada di sisi yang paling jauh dari bumi, itu adalah bulan baru. {cite:zij-sabi-nallino-byblion p.92}."
