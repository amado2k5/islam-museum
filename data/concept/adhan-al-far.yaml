label:
  ar: "آذان الفار"
  en: "Adhan al-far (mouse-ear, a group of herbs)"
  ur: "اذان الفار"
summary:
  ar: "آذان الفار حشيشة لها أصناف كثيرة، ينفع أكثرها من السموم والأورام؛ الذي ذكره ديسقوريدوس يخرج الشوك ويلحم الجراحات، وينفع من الصرع سقياً ومن اللقوة سعوطاً {cite:canon-ibn-sina-print-v1 p.370} {cite:canon-ibn-sina-print-v1 p.371}."
  en: "Adhan al-far is a herb with many kinds, most of which help poisons and swellings. The kind Dioscorides described draws out thorns, joins wounds, helps epilepsy when drunk and facial palsy when inhaled {cite:canon-ibn-sina-print-v1 p.370} {cite:canon-ibn-sina-print-v1 p.371}."
  ur: "اذان الفار ایک جڑی بوٹی ہے جس کی بہت سی اقسام ہیں، جن میں سے زیادہ تر زہروں اور سوجن میں مفید ہیں؛ ڈیسقوریدوس کی بیان کردہ قسم کانٹے نکالتی، زخم جوڑتی، پینے سے مرگی اور سونگھنے سے لقوہ میں مفید ہے {cite:canon-ibn-sina-print-v1 p.370} {cite:canon-ibn-sina-print-v1 p.371}۔"
