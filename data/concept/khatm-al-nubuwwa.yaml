  stance:
    ar: خاتم النبيين وسيد المرسلين، ولا يصح إيمان عبد حتى يؤمن برسالته
    en: The seal of the prophets and master of the messengers; no servant's belief is sound until he believes in his message
  summary:
    ar: 'يقول ابن قدامة: «ومحمد رسول الله خاتم النبيين وسيد المرسلين، لا يصح إيمان عبد حتى يؤمن برسالته، ويشهد بنبوته»، وإن أمته خير الأمم وأصحابه خير أصحاب الأنبياء.'
    en: Ibn Qudama says Muhammad is the Messenger of God, seal of the prophets and master of the messengers, no servant's belief is sound until he believes in his message and testifies to his prophethood, and that his community is the best of communities and his companions the best of the prophets' companions.
