id: concept/khatm-al-nubuwwa
education:
  did_you_know:
    ar: "العقيدة أن محمداً خاتم الأنبياء فكل دعوى للنبوة بعده ضلال؛ وشهد الصحابة خاتماً بين كتفيه عُدّ من آيات نبوته."
    en: "The creed: Muhammad is the seal of the prophets, so every prophetic claim after him is astray; the companions witnessed a seal between his shoulders counted among his signs."
    ur: "عقیدہ یہ ہے کہ محمد آخری نبی ہیں، اس کے بعد نبوت کا ہر دعویٰ گمراہی ہے؛ صحابہ نے ان کے کندھوں کے درمیان ایک مہر دیکھی جو نبوت کی نشانی شمار ہوئی۔"
    sources: [source/aqida-tahawiyya, source/sahih-muslim]
class: concept
kind: doctrine
label:
  ar: ختم النبوة
  en: Finality of prophethood
summary:
  ar: "عقيدة أن محمداً خاتم الأنبياء وأن كل دعوى للنبوة بعده ضلال، كما يصوغها الطحاوي في العقيدة الطحاوية. وفي باب الشمائل شهد الصحابة خاتماً ظاهراً بين كتفيه عُدّ من آيات نبوته: رآه جابر بن سمرة «كأنه بيضة حمام» {cite:sahih-muslim 2344} ونظر إليه السائب بن يزيد غلاماً «بين كتفيه مثل زر الحجلة» {cite:sahih-muslim 2345}."
  en: The doctrine that Muhammad is the last of the prophets and that any claim to prophethood after him is error, as al-Tahawi states it.
