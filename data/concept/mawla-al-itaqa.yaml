label: { ar: "مَوْلَى العَتَاقَة (ولاء المعتق)", en: "The patron of manumission (mawla al-'itaqa) and the right of ascription (wala')", ur: "مولیٰ العتاقہ (آزاد کرنے والے کا ولاء)" }
summary:
  ar: "مولى العتاقة هو المعتِق الذي له ولاء العتاقة على من أعتقه، ويطلق على من عتق عليه رقيق بإعتاق منجز أو بعوض أو بالكتابة أو التدبير أو الاستيلاد أو بقرابة. ومن أحكامه أن ولاءه يورث، فيقدم في الإرث على الرد، وتقدم عصبة النسب عليه، وثبوت الولاء للكافر، والميراث بالولاء، وترتيب المعتِق وعصبته فيه، وحكم السائبة."
  en: "The mawla al-'itaqa is the one who frees a slave and holds the right of patronage (wala') over him. The term also covers one whose slave becomes free by purchase, bargain, writing of manumission, promise of freedom after death, a mother's child, or a kinsman he buys. Its rules cover inheritance, which gives the patron a share after the shares fixed by the Qur'an and before the return on the sharers; the precedence of blood-kin; the patronage of an unbeliever; the freed ward who was left unclaimed (sa'iba); and the order of the patron and his heirs."
  ur: "مولیٰ العتاقہ وہ معتِق (آزاد کرنے والا) ہے جسے غلام پر ولاء حاصل ہو۔ وراثت میں اس کا حصہ مقررہ حصص کے بعد اور رد سے پہلے ہوتا ہے، اور نسب کے عصبہ کو اس پر فوقیت حاصل ہے۔ کافر کا ولاء، اور سائبہ کا حکم بھی بیان ہوا ہے۔"
