label: { ar: "مَوْلَى العَتَاقَة ⁦(ولاء المعتق)⁩", en: "The patron of manumission (mawla al-'itaqa) and the right of ascription (wala')", ur: "مولیٰ العتاقہ ⁦(آزاد کرنے والے کا ولاء)⁩", es: "El patrón de la manumisión (mawla al-'itaqa) y el derecho de adscripción (wala')", fr: "Le patron de l'affranchissement (mawla al-'itaqa) et du droit d'attribution (wala')", tr: "Özgür bırakılan köle (Wala'a al-Mu'taq)", id: "Budak yang dibebaskan (Wala'a al-Mu'taq)" }
summary:
  ar: "مولى العتاقة هو المعتِق الذي له ولاء العتاقة على من أعتقه، ويطلق على من عتق عليه رقيق بإعتاق منجز أو بعوض أو بالكتابة أو التدبير أو الاستيلاد أو بقرابة. ومن أحكامه أن ولاءه يورث، فيقدم في الإرث على الرد، وتقدم عصبة النسب عليه، وثبوت الولاء للكافر، والميراث بالولاء، وترتيب المعتِق وعصبته فيه، وحكم السائبة."
  en: "The mawla al-'itaqa is the one who frees a slave and holds the right of patronage (wala') over him. The term also covers one whose slave becomes free by purchase, bargain, writing of manumission, promise of freedom after death, a mother's child, or a kinsman he buys. Its rules cover inheritance, which gives the patron a share after the shares fixed by the Qur'an and before the return on the sharers; the precedence of blood-kin; the patronage of an unbeliever; the freed ward who was left unclaimed (sa'iba); and the order of the patron and his heirs."
  ur: "مولیٰ العتاقہ وہ معتِق ⁦(آزاد کرنے والا)⁩ ہے جسے غلام پر ولاء حاصل ہو۔ وراثت میں اس کا حصہ مقررہ حصص کے بعد اور رد سے پہلے ہوتا ہے، اور نسب کے عصبہ کو اس پر فوقیت حاصل ہے۔ کافر کا ولاء، اور سائبہ کا حکم بھی بیان ہوا ہے۔"
  es: "El mawla al-'itaqa es quien libera a un esclavo y ostenta el derecho de patronazgo (wala') sobre él. El término también abarca a aquel cuyo esclavo se libera mediante compra, negociación, escritura de manumisión, promesa de libertad tras la muerte, hijo de la madre o pariente que compra. Sus normas incluyen la herencia, que otorga al patrono una parte después de las partes fijadas por el Corán y antes de la retribución a los copartícipes; la precedencia de los parientes consanguíneos; el patronazgo de un incrédulo; el pupilo liberado que quedó sin reclamar (sa'iba); y el orden del patrono y sus herederos."
  fr: "Le mawla al-'itaqa est celui qui affranchit un esclave et exerce sur lui un droit de patronage (wala'). Ce terme englobe également celui dont l'esclave est affranchi par achat, négociation, acte d'affranchissement, promesse d'affranchissement après décès, par filiation ou par acquisition d'un parent. Ses règles concernent l'héritage, qui confère au patronage une part après celles fixées par le Coran et avant le retour des héritiers; la priorité des liens du sang; le patronage d'un non-croyant; le pupille affranchi laissé sans protection (sa'iba); et l'ordre de succession du patronage et de ses héritiers."
  tr: "Özgür bırakılan köle, özgürleştiricinin onu özgürleştirenin kendisine karşı sadakatine sahip olan özgür bırakılmış adamdır. 'Köle' terimi, tamamlanmış veya ödenmiş bir özgürleşme ile, yazılı bir kurtuluş, yazılı yönetim, doğum veya akrabalık yoluyla verilir. Hükümlerinden biri, sadakatinin miras yoluyla geçtiği, dolayısıyla mirasın geri dönüşten önce olduğu, akrabalığın engelliliğin önüne geçmesi, gayrimüslimlere sadakatin tesis edilmesi, sadakatle miras, özgür bırakılan kişi ve akrabalarının içinde düzenlenmesi ve sa'ibah üzerindeki hükmüdür."
  id: "Budak yang dibebaskan adalah orang yang dibebaskan yang memiliki kesetiaan sebagai pembebasan dibandingkan dengan orang yang membebaskannya. Istilah 'budak' diberikan kepadanya melalui pembebasan yang telah selesai atau dibayar, atau melalui penulisan, manajemen, kelahiran, atau kekerabatan. Di antara keputusannya adalah bahwa kesetiaannya diwariskan, sehingga warisan lebih diutamakan daripada kembali, prioritas kekerabatan daripada disabilitas, penetapan kesetiaan kepada non-Muslim, warisan melalui kesetiaan, pengaturan orang yang dibebaskan dan kerabatnya di dalamnya, serta aturan tentang sa'ibah."
