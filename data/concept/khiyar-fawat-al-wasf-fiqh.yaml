class: concept
kind: legal
label:
  ar: خيار فوات الوصف
  en: Khiyar fawat al-wasf (option for loss of a stipulated quality)
  ur: خیار فوات الوصف
summary:
  ar: 'خيار فوات الوصف حق الفسخ لتخلف وصف مرغوب اشترطه العاقد في المعقود عليه، كمن اشترى حصانا على أنه عربي أصيل فإذا هو هجين، أو جوادا على أنه هملاج فإذا هو طيء، أو بقرة على أنها حلوب، ومنه اشتراط كون الكلب صائدا وشرط كون الثمن مكفولا به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003} يسمى أيضا خيار خلف الوصف المشروط وخيار الخلف وتخلف الصفة، وتسميته خيار الوصف موهمة لأن ذلك يطلق غالبا على مطابقة المبيع الغائب للوصف، وبحثه بعضهم مستقلا وآخرون ألحقوه بخيار العيب أو خيار الشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003} مشروعيته مبنية على صحة اشتراط الوصف وهو واقع في نطاق لا خلاف فيه وهو الشرط المعتبر من مصالح العقد، وأنزل الحنفية اشتراط الوصف منزلة الشرط الذي يقتضيه العقد إذا كان لا غرر فيه، وذهب الجمهور إلى أن أثر الإخلال التخيير لا فساد العقد لأن تخلف الوصف لا يختلف به الجنس وإنما النوع فصار كفوات وصف السلامة في خيار العيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8004} أثبته الحنفية والمالكية والحنابلة والشافعية في الأصح، واستنده ثبوت خيار العيب إذ فوات الوصف المرغوب بعد التزام البائع به في معنى فوات وصف السلامة، غير أن الشرط في العيب ثابت دلالة وفي الوصف ثابت نصا كما قال الكاساني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8004} شرائط الوصف المعتبر: أن يكون المطلوب وصفا لا ملكية عين أو منفعة ومنه قضاء الحنفية بفساد اشتراط كون الشاة حاملا، وأن يكون مباحا في الشرع فاشتراط نطاح الكبش أو صائل الديك لغو، وأن يكون منضبطا لا غرر فيه، وأن يكون مرغوبا فيه عادة فإن تحقق في المبيع أفضل منه كاشتراط البعير فإذا هو ناقة لم يكن له خيار، والمالكية يضبطون المرغوب بما فيه غرض للعاقد مالية كان أو لا، والشافعية بما فيه مالية، وأن يشترطه المشتري ويوافق البائع فلا تكفي حال المشتري قرينة عن الاشتراط وإن اعتبرت في تفسيره، وفي منزلة الشرط ما يصدر من البائع من المناداة على السلعة بأنها كذا وكذا فترد بعدمه إلا تلفيق السمسار المعتاد عند الدسوقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8005}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8006} شرائط تخلف الوصف: أن يكون التخلف داخلا تحت جنس المبيع فاشتراط القطن فإذا هو كتان يفسد العقد لاختلاف الجنس، وضابط ابن الهمام أن ما فحش التفاوت بين أغراضه فهو أجناس كالكتان والقطن والذكر مع الأنثى، وما لم يفحش فجنس واحد تختلف أنواعه كلحم المعز ولحم الضأن، وأن يبلغ الفوات حد عدم انطلاق اسم الوصف عليه فإن وجد أدناه كالكلب الذي يصيد بصورة ناقصة فلا رد، وألا يكون فوات الوصف عيبا وإلا فالقضية من باب خيار العيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8007}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8008} موجبه الخيار بين رد المبيع وأخذه بجميع الثمن دون أرش للوصف الفائت، فإن امتنع الرد رجع المشتري على البائع بحصة الوصف الفائت من الثمن بتقويمه موصوفا وغير موصوف والرجوع بالتفاوت، وفي رواية عن أبي حنيفة لا يرجع بشيء والصحيح الأولى لأن البائع عجز عن تسليم وصف السلامة، وعلة انحصار الخيار في الرد أو الأخذ بالثمن كاملا أن الأوصاف لا يقابلها شيء من الثمن لكونها تابعة تدخل في العقد من غير ذكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8008}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} مجاله مجال خيار العيب فيكون العقد على ما يتعين فلا يثبت في المبيع غير المعين الثابت في الذمة ولا في المبيع الغائب لأن له خيار الرؤية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} توقيته: يثبت على التراخي عند الحنفية والحنابلة إلى أن يوجد ما يسقطه، ويوقته المالكية بيوم أو يومين، وهو عند الشافعية على الفور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} يورث بموت مستحقه فينتقل إلى ورثته كما صرح الحنفية وقرره غيرهم فيه وفي أمثاله، ويسقط بما يسقط به خيار العيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009}'
  en: 'Khiyar fawat al-wasf is the right of rescission for the failure of a desired quality the contractor stipulated in the object of the contract, as when one buys a horse stipulated as a purebred Arab and it proves a hybrid, a steed stipulated as smooth-gaited (hamlaj) and it proves jerky-paced, a cow stipulated as giving much milk, a dog stipulated as a hunter, or a price stipulated as guaranteed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003} It is also called the option of the failed stipulated quality, the option of failure, and the failure of the attribute; the name "option of the quality" is misleading because that is mostly used for the conformity of an unseen sold thing to its description, and some treat it independently while others annex it to the option of defect or the option of stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003} Its lawfulness rests on the validity of stipulating the quality, which falls in the undisputed zone of conditions counted among the contract''s benefits; the Hanafis liken it to a condition the contract itself requires when free of gharar, and the majority hold the effect of breach is the option, not corruption of the contract, since the failure changes the kind not the genus, making it like the loss of the quality of soundness in the option of defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8004} It is affirmed by the Hanafis, Malikis and Hanbalis and by the Shafiis on the sound view, resting on the option of defect, since the loss of a desired quality after the seller undertook it equals the loss of the quality of soundness, except that the condition in the option of defect is implied while here it is express, as al-Kasani says. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8004} Conditions of the quality that counts: it must be a quality, not the ownership of another thing or a benefit — hence the Hanafi ruling that stipulating a sheep as pregnant corrupts the sale; it must be lawful, so stipulating a butting ram or a fighting cock is idle; it must be determinate and free of gharar; and it must be desirable by custom, so if the thing proves better than stipulated, as a camel stipulated male turning out female for a desert buyer who wants milk and offspring, he has no option — the Malikis define the desirable as whatever serves the contractor''s purpose whether financial or not, the Shafiis as what carries value; and the buyer must stipulate it with the seller''s assent, his circumstances not being a sufficient presumption though they aid interpretation, while the seller''s own cry over the goods that they are such and such ranks as a stipulation, save the broker''s customary puffery in al-Dusuqi''s view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8005}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8006} Conditions of the failure: it must fall within the same genus — stipulating cotton and finding linen corrupts the sale for change of genus — and Ibn al-Humam''s criterion is that what shows gross disparity of purposes counts as genera, like linen and cotton and male and female, while what does not is one genus differing in kind like goat meat and lamb meat; the loss must reach the point where the quality''s name no longer applies, so the dog that hunts deficiently gives no return, while one that does not hunt at all does; and the lost quality must not itself be a defect, else the matter belongs to the option of defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8007}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8008} Its effect is the option between returning the goods and keeping them for the full price without arsh for the lost quality; if return is barred the buyer recovers the lost quality''s share of the price by valuing the goods with and without it, though a transmission from Abu Hanifa grants no recovery and the sounder is the first since the seller failed to deliver the quality of soundness; the option is confined to return or keeping at full price because qualities meet nothing of the price, being annexed and entering the contract without mention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8008}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} Its field is that of the option of defect: the contract must be over a determinate object, so it does not stand in the unindividualised debt-based sold thing nor in the unseen one which has the option of sight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} Its timing is deferred at the Hanafis and Hanbalis until something lapses it, a day or two at the Malikis and immediate at the Shafiis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} It is inherited on the death of the entitled party and passes to the heirs as the Hanafis state and others establish for it and its like, and it lapses by whatever lapses the option of defect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009}'
  ur: 'خیار فوات الوصف فسخ کا وہ حق ہے جو معقود علیہ میں عاقد کی شرط کی ہوئی مرغوب صفت کے تخلف پر ثابت ہوتا ہے، جیسے عربی اصیل گھوڑا خریدنا جو ہجین نکلے، ہملاج جوار جو ٹیع (اضطراب سے تیز چلنے والا) نکلے، حلوب گائے، شکاری کتے کی شرط، یا ثمن کی کفالت کی شرط۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003} اسے خیار خلف الوصف المشروط، خیار الخلف اور تخلف الصفہ بھی کہتے ہیں؛ خیار الوصف کی تسمية موہم ہے کیونکہ یہ عموماً غائب مبیع کے وصف سے مطابقت پر بولا جاتا ہے، اور بعض نے اسے آزاد موضوع، بعض نے خیار العیب یا خیار الشرط سے ملحق کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003} اس کی مشروعیت اشتراطِ وصف کی صحت پر مبنی ہے جو بلا خلاف دائرے میں ہے یعنی وہ شرط جو عقد کے مفاد میں شمار ہو؛ حنفیہ نے اسے اس شرط کے منزل پر رکھا جسے خود عقد تقاضا کرے بشرط غرر نہ ہو، اور جمہور کے نزدیک اخلال کا اثر تخییر ہے نہ کہ عقد کا فساد، کیونکہ تخلفِ وصف جنس نہیں بدلتا بلکہ نوع بدلتا ہے تو وہ خیار العیب میں وصفِ سلامت کے فوات جیسا بنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8003}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8004} اسے حنفیہ، مالکیہ، حنابلہ اور شافعیہ کا اصح قول ثابت کرتے ہیں اور اس کا سند خیار العیب ہے کیونکہ بائع کی ذمہ داری کے بعد مرغوب وصف کا فوات وصفِ سلامت کے فوات کے معنوں میں ہے، سوائے اس کے کہ عیب میں شرط دلالت سے ثابت ہے اور وصف میں نصاً جیسا کاسانی نے کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8004} معتبر وصف کی شرائط: مطلوب چیز وصف ہو نہ کہ کسی اور عین کی ملکیت یا منفعت — اسی بنا پر حنفیہ نے بھینٹ کے حاملہ ہونے کی شرط کو مفسد قرار دیا؛ شرعاً مباح ہو تو بکری کے نطاح یا مرغ کے صائل ہونے کی شرط باطل ہے؛ منضبط اور بے غرر ہو؛ اور عرفاً مرغوب ہو، تو اگر مبیع شرط سے بہتر نکلے جیسے اونٹ نر چاہا اور مادہ نکلی اور خریدار بادیہ کا ہو جسے دودھ اور نسل چاہیے تو اسے خیار نہیں — مالکیہ مرغوب کو ہر وہ چیز مانتے ہیں جس میں عاقد کا غرض ہو مالی ہو یا نہ ہو، شافعیہ اسے جس میں مالیت ہو؛ اور مشتری شرط لگائے اور بائع قبول کرے، مشتری کی حالت اشتراط کی کافی قرینہ نہیں مگر اس کی تعبیر میں معتبر ہے، اور بائع کا بیع کے وقت سلعہ پر یہ و یہ نعرہ لگانا بھی شرط کے مقام میں ہے سوائے دسوقی کے نزدیک سمسار کی معمولی مبالغہ آمیز تشبیہات کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8005}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8006} تخلف کی شرائط: تخلف اسی جنس کے اندر ہو — سوت کی شرط پر کتان نکلنا جنس کے اختلاف سے عقد فساد کرتا ہے — اور ابن الہمام کا ضابط یہ ہے کہ جس میں اغراض کا تفاوت فاحش ہو وہ اجناس ہیں جیسے کتان و سوت اور نر و مادہ، اور جس میں فاحش نہ ہو وہ ایک جنس ہے جس کی انواع مختلف ہیں جیسے بکری کا گوشت اور میمنے کا؛ اور فوات اس حد تک پہنچے کہ وصف کا نام اس پر صادق نہ آئے، تو ناقص شکاری کتے پر رد نہیں مگر جو سرے سے شکار نہ کرے اس پر رد ہے؛ اور فوت جانے والا وصف خود عیب نہ ہو ورنہ معاملہ خیار العیب کا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8007}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8008} اس کا موجب مبیع واپس کرنے یا پورے ثمن پر رکھنے میں اختیار ہے بغیر فائت وصف کے ارش کے؛ اگر رد ممکن نہ ہو تو مشتری بائع سے فائت وصف کے حصہ ثمن کی وصولی کرتا ہے، مبیع کو موصوف اور غیر موصوف تقویم کر کے تفاوت وصول کرے گا؛ ابو حنیفہ سے ایک روایت میں کچھ وصولی نہیں اور صحیح پہلی روایت ہے کیونکہ بائع وصفِ سلامت کی تسلیم سے عاجز رہا؛ اور اختیار کے صرف رد یا پورے ثمن تک محدود ہونے کی علت یہ ہے کہ اوصاف کے مقابل ثمن کا کوئی حصہ نہیں کیونکہ وہ تابع ہیں اور بغیر ذکر عقد میں داخل ہوتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8008}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} اس کا مجال خیار العیب کا مجال ہے: عقد معین چیز پر ہو، تو ذمے میں ثابت غیر معین مبیع میں نہیں اور نہ ہی غائب مبیع میں کیونکہ اس کا اپنا خیار الرؤیت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} اس کا وقت حنفیہ و حنابلہ کے نزدیک مؤخر ہے جب تک ساقط کرنے والا سبب نہ آئے، مالکیہ ایک دو دن کا وقت دیتے ہیں، اور شافعیہ کے نزدیک فوری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009} مستحق کی وفات پر میراث ہو کر ورثہ کو منتقل ہوتا ہے جیسا حنفیہ نے صراحت کی اور دیگر نے اسے اور اس کے مشابہ کو مقرر کیا، اور وہ سب اسے ساقط کرتا ہے جو خیار العیب کو ساقط کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8009}'
