id: concept/shart-al-shaykhayn
class: concept
kind: term
label:
  ar: "شرط الشيخين"
  en: "The condition of the two Shaykhs (al-Bukhari and Muslim)"
  ur: "شرطِ شیخین"
summary:
  ar: "ما اشترطه البخاري ومسلم في الأحاديث التي أخرجاها في صحيحيهما؛ ولم ينقل عن واحد منهما تصريح بشرطه، وإنما عُرف من سبر كتابيهما، فاختلف العلماء في تحديده: فوصفه الحاكم بأن يكون للصحابي راويان ثقتان فصاعداً في كل طبقة، ونقضه ابن طاهر المقدسي والحازمي بأمثلة من الصحيحين؛ ويتصل به الكلام على ترجيح صحيح البخاري على صحيح مسلم، كما يعرضه القسطلاني في مقدمة إرشاد الساري {cite:irshad-sari-amiriyya-1323 p. 21-22}."
  en: "What al-Bukhari and Muslim required of the hadiths in their Sahihs. Neither stated his condition; it was inferred from studying their books, so scholars disagreed in defining it: al-Hakim described it as a Companion with two trustworthy transmitters and so on at each level, which Ibn Tahir al-Maqdisi and al-Hazimi refuted with examples from the Sahihs; connected with it is the question of preferring al-Bukhari's Sahih to Muslim's, as al-Qastallani sets it out in the introduction to Irshad al-Sari {cite:irshad-sari-amiriyya-1323 p. 21-22}."
  ur: "وہ شرائط جو بخاری اور مسلم نے اپنی صحیحین کی احادیث میں رکھیں؛ دونوں میں سے کسی نے اپنی شرط کی تصریح نہیں کی، بلکہ ان کی کتابوں کے مطالعے سے اخذ کی گئی، اس لیے علماء نے اس کی تعیین میں اختلاف کیا: حاکم نے کہا کہ صحابی کے دو ثقہ راوی ہوں اور ہر طبقے میں یہی ہو، جس کی ابن طاہر مقدسی اور حازمی نے صحیحین کی مثالوں سے تردید کی؛ اسی سے صحیح بخاری کو صحیح مسلم پر ترجیح کا مسئلہ جڑا ہے، جیسا کہ قسطلانی ارشاد الساری کے مقدمے میں بیان کرتے ہیں {cite:irshad-sari-amiriyya-1323 p. 21-22}۔"
