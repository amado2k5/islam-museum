issue:
  ar: "ما شرط البخاري ومسلم في صحيحيهما؟"
  en: "What were al-Bukhari's and Muslim's conditions in their Sahihs?"
  ur: "بخاری اور مسلم کی اپنی صحیحین میں کیا شرائط تھیں؟"
perspectives:
  - tradition: sunni
    id: hakim
    stance:
      ar: "شرطهما راويان ثقتان عن الصحابي فصاعداً في كل طبقة"
      en: "Their condition: two trustworthy transmitters from the Companion, and so on at every level"
      ur: "ان کی شرط: صحابی سے دو ثقہ راوی، اور ہر طبقے میں یہی"
    summary:
      ar: "الحاكم في المدخل إلى الإكليل: الدرجة الأولى من الصحيح، وهي اختيار البخاري ومسلم، أن يروي الحديث صحابي مشهور له راويان ثقتان، ثم يرويه عنه من أتباع التابعين حافظ متقن مشهور له رواة، ثم يكون شيخ البخاري ومسلم حافظاً متقناً مشهوراً بالعدالة."
      en: "Al-Hakim in al-Madkhal ila al-Iklil: the first degree of sound hadith, chosen by al-Bukhari and Muslim, is a report by a well-known Companion with two trustworthy transmitters, then transmitted by a precise, well-known hafiz of the next generations with transmitters of his own, down to a teacher of al-Bukhari and Muslim known for precision and uprightness."
      ur: "حاکم «المدخل الی الاکلیل» میں: صحیح کا پہلا درجہ، جو بخاری و مسلم کا اختیار ہے، یہ ہے کہ حدیث کسی مشہور صحابی سے ہو جس کے دو ثقہ راوی ہوں، پھر بعد کے طبقات میں پختہ مشہور حافظ اسے روایت کرے جس کے اپنے راوی ہوں، یہاں تک کہ بخاری و مسلم کا شیخ پختہ اور عدالت میں مشہور ہو۔"
    holders: [person/al-hakim-al-nisaburi]
    sources: [source/irshad-sari-amiriyya-1323]
  - tradition: sunni
    id: ibn-tahir-hazimi
    stance:
      ar: "لم يشترطا ذلك، والقاعدة منتقضة في الصحيحين"
      en: "They set no such condition; the rule is contradicted in the two Sahihs"
      ur: "انہوں نے ایسی شرط نہیں رکھی؛ صحیحین میں یہ قاعدہ ٹوٹتا ہے"
    summary:
      ar: "ابن طاهر المقدسي: لم يُنقل عن أحدهما أنه صرّح بشرطه، وشرطهما الحديث المتفق على ثقة نقلته إلى الصحابي المشهور متصلاً، وقد أخرجا عن صحابة ليس لهم إلا راو واحد؛ والحازمي: هذا قول من لم يمعن الغوص في خبايا الصحيح."
      en: "Ibn Tahir al-Maqdisi: neither is reported to have stated his condition; their condition is a report whose transmitters are agreed to be trustworthy back to a well-known Companion, with a connected chain, and they included Companions with only one transmitter; al-Hazimi: al-Hakim's view is that of one who did not dig deep into the Sahih."
      ur: "ابن طاہر مقدسی: کسی سے منقول نہیں کہ اس نے اپنی شرط کی تصریح کی؛ ان کی شرط وہ حدیث ہے جس کے ناقلین کی ثقاہت مشہور صحابی تک متفق علیہ ہو اور سند متصل ہو، اور انہوں نے ایسے صحابہ سے بھی روایت لی جن کا صرف ایک راوی ہے؛ حازمی: یہ اس شخص کا قول ہے جس نے صحیح کی گہرائی میں غوطہ نہیں لگایا۔"
