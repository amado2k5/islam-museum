id: concept/muql-al-yahud
class: concept
kind: natural
label:
  ar: "مقل اليهود"
  en: "Muql al-yahud (Jewish bdellium) and the Meccan muql"
  ur: "مقل الیہود"
  es: "Muql al-yahud (bedelio judío) y el muql de La Meca"
  fr: "Muql al-yahud (bdellium juif) et le muql mecquois"
  tr: "Yahudi Azınlık"
  id: "Minoritas Yahudi"
summary:
  ar: "مقل اليهود والمقل المكي صمغان، حار الأول ليّن والمكي بارد يابس، يحلل الأورام الصلبة والباردة ويلين ويضج وينفع المفاصل والصدر والبواسير والحصاة {cite:canon-ibn-sina-print-v1 p.556} {cite:canon-ibn-sina-print-v1 p.557}."
  en: "Muql al-yahud and the Meccan muql are two gums, the first hot and softening, the Meccan cold and dry; they dissolve hard and cold swellings, soften and ripen, and are listed for the joints, the chest, piles and stone {cite:canon-ibn-sina-print-v1 p.556} {cite:canon-ibn-sina-print-v1 p.557}."
  ur: "مقل الیہود اور مقل مکی دو گوند ہیں، پہلا گرم اور نرم کرنے والا اور مکی سرد خشک؛ سخت اور سرد سوجنوں کو تحلیل کرتے، نرم کرتے اور پکاتے ہیں اور جوڑوں، سینے، بواسیر اور پتھری میں مذکور ہیں {cite:canon-ibn-sina-print-v1 p.556} {cite:canon-ibn-sina-print-v1 p.557}۔"
  es: "Muql al-yahud y el muql de La Meca son dos gomas, la primera caliente y suavizante, la de La Meca fría y seca; disuelven las hinchazones duras y frías, suavizan y maduran, y se enumeran para las articulaciones, el pecho, las hemorroides y los cálculos {cite:canon-ibn-sina-print-v1 p.556} {cite:canon-ibn-sina-print-v1 p.557}."
  fr: "Muql al-yahud et le muql mecquois sont deux gommes, la première chaude et adoucissante, la seconde froide et sèche; elles dissolvent les gonflements durs et froids, adoucissent et mûrissent, et sont indiquées pour les articulations, la poitrine, les hémorroïdes et les calculs {cite:canon-ibn-sina-print-v1 p.556} {cite:canon-ibn-sina-print-v1 p.557}."
  tr: "Yahudilerin ve Mekke'nin yumuşaklıkları renklidir; ilki sıcak ve yumuşaktır, Mekke ise soğuk ve kurudur. Sert ve soğuk tümörleri analiz eder, eklemleri, göğüsleri, hemoroidleri ve taşları yumuşatır, karıştırır ve fayda sağlar {cite:canon-ibn-sina-print-v1 s.556} {cite:canon-ibn-sina-print-v1 s.557}."
  id: "Pelunak Yahudi dan Mekah berwarna; yang pertama panas dan lembut, sedangkan Mekah dingin dan kering. Sitter ini menganalisis tumor keras dan dingin, melunakkan, mengaduk, dan memberi manfaat pada sendi, dada, wasir, dan batu {cite:canon-ibn-sina-print-v1 hlm.556} {cite:canon-ibn-sina-print-v1 hlm.557}."
