id: concept/kalam-allah
education:
  did_you_know:
    ar: "عند الطحاوي القرآن كلام الله منه بدا بلا كيفية قولاً، أنزله على رسوله وحياً، وليس بمخلوق ككلام البشر."
    en: "For al-Tahawi the Qur'an is God's own speech, issuing from Him without modality — sent down on His messenger as revelation, not created like human speech."
    ur: "طحاوی کے نزدیک قرآن اللہ کا کلام ہے جو اسی سے بلا کیف صادر ہوا، رسول پر وحی کر کے نازل ہوا — بشر کے کلام کی طرح مخلوق نہیں۔"
    sources: [source/aqida-tahawiyya, source/lumat-al-itiqad-ibn-uraiyir-2022]
class: concept
