- tradition: sunni-hanbali
  id: aqida-wasitiyya
  stance:
    ar: القرآن كلام الله حروفه ومعانيه، منزل غير مخلوق، تكلم الله به حقيقة
    en: The Qur'an is the speech of God, its letters and meanings, sent down and uncreated; God spoke it in reality
  summary:
    ar: يقول ابن تيمية إن القرآن «كلام الله منزل غير مخلوق، منه بدأ وإليه يعود»، وإن الله تكلم به حقيقة، ولا يجوز عنده إطلاق القول بأنه حكاية عن كلام الله أو عبارة عنه، وهو «كلام الله حروفه ومعانيه».
    en: Ibn Taymiyya says the Qur'an is the speech of God, sent down and uncreated, from Him it began and to Him it returns, that God spoke it in reality, and that it may not be said without qualification
      to be a narration of God's speech or an expression of it; it is the speech of God, its letters and its meanings.
  holders:
  - person/ibn-taymiyya
  - work/aqida-wasitiyya
  evidence:
  - ref: source/aqida-wasitiyya
    note:
      ar: ص 17 و18
      en: pp. 17 and 18
  sources:
  - source/aqida-wasitiyya
- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: القرآن كلام الله غير مخلوق، والكلام في اللفظ والوقف بدعة
    en: The Qur'an is the speech of God, uncreated, and speaking about pronunciation and stopping is an innovation
  summary:
    ar: يذكر الأشعري أنهم يقولون إن القرآن كلام الله غير مخلوق، وأن من قال باللفظ أو بالوقف فهو مبتدع عندهم، فلا يقال إن اللفظ بالقرآن مخلوق ولا غير مخلوق.
    en: Al-Ash'ari reports they say the Qur'an is the speech of God, uncreated, and that whoever speaks of the utterance or of stopping is an innovator in their view, so it is not said that the utterance
      of the Qur'an is created or uncreated.
