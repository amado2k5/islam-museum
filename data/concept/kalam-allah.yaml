  stance:
    ar: القرآن كلام الله منه بدا بلا كيفية وليس بمخلوق
    en: The Qur'an is God's speech, from Him it began without how, and it is not created
  summary:
    ar: يقول الطحاوي إن القرآن كلام الله منه بدا بلا كيفية قولاً، أنزله على رسوله وحياً، وليس بمخلوق ككلام البرية، ويحكم بالكفر على من زعم أنه كلام البشر.
