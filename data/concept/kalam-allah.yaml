  id: lumat-al-itiqad
  stance:
    ar: الله متكلم بكلام قديم والقرآن منزل غير مخلوق وهو حروف وكلمات
    en: God speaks with an eternal speech, and the Qur'an is sent down, uncreated, and consists of letters and words
  summary:
    ar: يقول ابن قدامة إن الله «متكلم بكلام قديم، يسمعه منه من شاء من خلقه»، سمعه موسى من غير واسطة، وإن القرآن «منزل غير مخلوق، منه بدأ وإليه يعود»، وهو سور وآيات وحروف وكلمات، «متلو بالألسنة، محفوظ في
      الصدور، مسموع بالآذان، مكتوب في المصاحف»، ويحتج بأن جاحد حرف منه كافر.
    en: Ibn Qudama says God speaks with an eternal speech that whoever He wills of His creatures hears, that Musa heard it without an intermediary, and that the Qur'an is sent down, uncreated, from Him
      it began and to Him it returns, made of suras, verses, letters and words, recited by tongues, kept in hearts, heard by ears and written in copies, and he argues that whoever denies one letter of it
      is an unbeliever.
  holders:
