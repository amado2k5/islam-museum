label:
  ar: القرآن كلام الله (في العقيدة الطحاوية)
  en: The Qur'an as the speech of God (in the Tahawi creed)
summary:
  ar: قول الطحاوي إن القرآن كلام الله منه بدا بلا كيفية قولاً، أنزله على رسوله وحياً، وليس بمخلوق ككلام البشر.
  en: al-Tahawi's statement that the Qur'an is the speech of God, which began from Him without how, sent down on His messenger as revelation, and is not created like human speech.
