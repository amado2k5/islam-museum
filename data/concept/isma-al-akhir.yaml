id: concept/isma-al-akhir
class: concept
kind: term
label:
  ar: أسماء الآخرة
  en: The Names of the Hereafter
  ur: آخرت کے نام
  es: "Los nombres del más allá"
  fr: "Les Noms de l'Au-delà"
  tr: "Öteki İsimler"
  id: "Nama-nama Akhirat"
summary:
  ar: "أسماء الآخرة في القرآن والسنة: الأيام والأحوال والمواطن التي يُذكر بها يوم القيامة والبرزخ والجنة والنار، يذكر أن فيها أسماء كثيرة مثل: يوم القيامة، يوم البعث، يوم النشور، يوم الحساب، يوم الميزان، يوم الصراط، يوم الحوض، يوم المحشر، يوم الدين، يوم الفصل، يوم الحسرة."
  en: "The names of the Hereafter in Qur'an and Sunnah: the days, states and stations by which the Day of Resurrection, the barzakh, paradise and fire are named — many names such as the Day of Resurrection, the Day of Spreading, the Day of Reckoning, the Day of the Scale, the Day of the Bridge, the Day of the Basin, the Day of Gathering, the Day of Religion, the Day of Separation, the Day of Regret."
  ur: "آخرت کے نام قرآن و سنت میں: وہ دن، حالات اور مقامات جن سے یوم قیامت، برزخ، جنت اور آگ کا ذکر کیا جاتا ہے — بہت سے نام جیسے یوم بعث، یوم نشر، یوم حساب، یوم میزان، یوم صراط، یوم حوض، یوم محشر، یوم الدین، یوم فصل، یوم حسرت۔"
  es: "Los nombres del Más Allá en el Corán y la Sunnah: los días, estados y estaciones con los que se nombran el Día de la Resurrección, el barzakh, el paraíso y el fuego: muchos nombres como el Día de la Resurrección, el Día de la Expansión, el Día del Juicio, el Día de la Balanza, el Día del Puente, el Día de la Cuenca, el Día de la Reunión, el Día de la Religión, el Día de la Separación, el Día del Arrepentimiento."
  fr: "Les noms de l'Au-delà dans le Coran et la Sunna: les jours, les états et les stations par lesquels sont nommés le Jour de la Résurrection, le barzakh, le paradis et le feu — de nombreux noms tels que le Jour de la Résurrection, le Jour de la Dispersion, le Jour du Jugement, le Jour de la Balance, le Jour du Pont, le Jour du Bassin, le Jour du Rassemblement, le Jour de la Religion, le Jour de la Séparation, le Jour du Regret."
  tr: "Kur'an ve Sünnet'te Ahiret isimleri: Diriliş Günü, Barzak, Cennet ve Cehennemde bahsedilen günler, koşullar ve yerler. Bunlar arasında Diriliş Günü, Diriliş Günü, Diriliş Günü, Kıyamet Günü, Denge Günü, Yol Günü, Havuz Günü, Diriliş Günü, Kıyamet Günü ve Pişman Günü gibi birçok isim yer almaktadır."
  id: "Nama-nama Akhirat dalam Al-Qur'an dan Sunnah: hari, kondisi, dan tempat yang disebutkan pada Hari Kebangkitan, Barzakh, Surga, dan Neraka. Disebutkan bahwa nama-nama ini memuat banyak nama seperti: Hari Kebangkitan, Hari Kebangkitan, Hari Kebangkitan, Hari Penghakiman, Hari Keseimbangan, Hari Jalan, Hari Kolam, Hari Kebangkitan, Hari Penghakiman, dan Hari Penyesalan."
