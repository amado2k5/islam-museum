id: concept/isma-al-akhir
class: concept
kind: term
label:
  ar: أسماء الآخرة
  en: The Names of the Hereafter
  ur: آخرت کے نام
summary:
  ar: "أسماء الآخرة في القرآن والسنة: الأيام والأحوال والمواطن التي يُذكر بها يوم القيامة والبرزخ والجنة والنار، يذكر أن فيها أسماء كثيرة مثل: يوم القيامة، يوم البعث، يوم النشور، يوم الحساب، يوم الميزان، يوم الصراط، يوم الحوض، يوم المحشر، يوم الدين، يوم الفصل، يوم الحسرة."
  en: "The names of the Hereafter in Qur'an and Sunnah: the days, states and stations by which the Day of Resurrection, the barzakh, paradise and fire are named — many names such as the Day of Resurrection, the Day of Spreading, the Day of Reckoning, the Day of the Scale, the Day of the Bridge, the Day of the Basin, the Day of Gathering, the Day of Religion, the Day of Separation, the Day of Regret."
  ur: "آخرت کے نام قرآن و سنت میں: وہ دن، حالات اور مقامات جن سے یوم قیامت، برزخ، جنت اور آگ کا ذکر کیا جاتا ہے — بہت سے نام جیسے یوم بعث، یوم نشر، یوم حساب، یوم میزان، یوم صراط، یوم حوض، یوم محشر، یوم الدین، یوم فصل، یوم حسرت۔"
