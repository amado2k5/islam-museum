summary:
  ar: 'القوي: القوي الكامل القوة الذي لا يعجزه شيء. الاسم رقم 53 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Qawiyy — The Strong. Name 53 in the enumeration of the most beautiful names in the Tirmidhi hadith.
