  tr: "El-Kavi: Tam Güçlü, hiçbir şeyin yenemeyeceği güç. El-Tirmidi'nin Allah'ın En Güzel İsimleri hadislerinde bahsedilen 53 numaralı sayıyı belirtin."
  id: "Al-Qawi: Yang Kuat Sempurna, kekuatan yang tidak bisa dikalahkan oleh apa pun. Nama nomor 53 dalam enumerasi yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Terindah Allah."
