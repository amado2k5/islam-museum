label: { ar: "عدّ الساعات من انتصاف النهار بالرقة", en: "Counting the hours from noon at Raqqa", ur: "رقہ میں دوپہر سے گھنٹوں کی گنتی", es: "Contando las horas desde el mediodía en Raqqa", fr: "Compter les heures à partir de midi à Raqqa" }
summary:
  ar: "تُعدّ الساعة الأولى من اليوم الذي يلي انتصاف النهار، فتكون الساعة السادسة عند غروب الشمس، والثانية عشرة عند الانتقال إلى الليل، ثم تُعدّ الساعات من طلوع الشمس إلى انتصاف النهار من الغد. {cite:zij-sabi-nallino-byblion p.108}."
  en: "The first hour is counted from the noon that begins the day; the sixth hour falls at sunset, the twelfth at the change to night, and the count then runs from sunrise to the next noon. {cite:zij-sabi-nallino-byblion p.108}."
  ur: "پہلا گھنٹہ اس دن سے گنا جاتا ہے جو دوپہر کے بعد شروع ہوتا ہے؛ چھٹا گھنٹہ غروب آفتاب پر آتا ہے، بارہواں رات میں داخل ہونے پر، اور پھر گنتی اگلے دن طلوع آفتاب سے دوپہر تک چلتی ہے۔ {cite:zij-sabi-nallino-byblion p.108}۔"
  es: "La primera hora se cuenta desde el mediodía que da comienzo al día; la sexta hora cae al atardecer, la duodécima al anochecer, y el conteo continúa desde el amanecer hasta el mediodía siguiente. {cite:zij-sabi-nallino-byblion p.108}."
  fr: "La première heure est comptée à partir du midi qui marque le début du jour; la sixième heure tombe au coucher du soleil, la douzième au passage à la nuit, et le décompte se poursuit ensuite du lever du soleil au midi suivant. {cite:zij-sabi-nallino-byblion p.108}."
