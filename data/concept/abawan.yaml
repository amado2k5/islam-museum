label: { ar: "الأبوان", en: "Abawan (the two parents)", es: "Abawan (los dos padres)", fr: "Abawan (les deux parents)", ur: "ابوان ⁦(دونوں والدین)⁩" }
summary:
  ar: "الأبوان تثنية أب، وهو على الحقيقة الأبُ والأمّ، وقد يُستعمل في الجد والجدّة مجازاً كما ورد في القرآن الكريم في سورة يوسف. ويُحمل لفظ الأبوين عند الإطلاق في الوصية والوقف والأمان والقذف وغيرها على الأب والأم، ما لم تقم قرينة لفظية أو حالية على خلاف ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469}"
  en: "Abawan is the dual of father. Literally it means a father and a mother; figuratively it can mean a grandfather and a grandmother, as in one verse of Surat Yusuf. When the word is used without qualification in a will, an endowment, a grant of safe conduct, an accusation of slander or similar acts, it means the father and the mother, unless a verbal or situational sign shows otherwise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469}"
  es: "Abawan es el dual de padre. Literalmente significa padre y madre; figurativamente puede significar abuelo y abuela, como en un versículo de la Sura Yusuf. Cuando la palabra se usa sin especificación en un testamento, una donación, una concesión de salvoconducto, una acusación de calumnia o actos similares, significa padre y madre, a menos que una señal verbal o situacional indique lo contrario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469}"
  fr: "Abawan est le duel de père. Littéralement, il signifie père et mère; au sens figuré, il peut désigner grand-père et grand-mère, comme dans un verset de la sourate Yusuf. Lorsqu'il est employé sans autre précision dans un testament, un acte de donation, une autorisation de sauf-conduit, une accusation de calomnie ou des actes similaires, il désigne le père et la mère, sauf indication contraire verbale ou situationnelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469}"
  ur: "اباوان باپ کا دوہرا ہے۔ لفظی طور پر اس کا مطلب ہے باپ اور ماں۔ علامتی طور پر اس کا مطلب دادا اور دادی ہو سکتا ہے جیسا کہ سورۃ یوسف کی ایک آیت میں ہے۔ جب یہ لفظ وصیت، وقف، محفوظ طرز عمل، بہتان یا اسی طرح کے کاموں کے الزام میں بغیر اہلیت کے استعمال کیا جاتا ہے، تو اس کا مطلب باپ اور ماں ہے، جب تک کہ کوئی زبانی یا حالاتی علامت دوسری صورت میں ظاہر نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1468}"
