label: { ar: "الأبوان", en: "Abawan (the two parents)" }
summary:
  ar: "الأبوان تثنية أب، وهو على الحقيقة الأبُ والأمّ، وقد يُستعمل في الجد والجدّة مجازاً كما ورد في القرآن الكريم في سورة يوسف. ويُحمل لفظ الأبوين عند الإطلاق في الوصية والوقف والأمان والقذف وغيرها على الأب والأم، ما لم تقم قرينة لفظية أو حالية على خلاف ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469}"
  en: "Abawan is the dual of father. Literally it means a father and a mother; figuratively it can mean a grandfather and a grandmother, as in one verse of Surat Yusuf. When the word is used without qualification in a will, an endowment, a grant of safe conduct, an accusation of slander or similar acts, it means the father and the mother, unless a verbal or situational sign shows otherwise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469}"
