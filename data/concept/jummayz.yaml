id: concept/jummayz
class: concept
kind: natural
label:
  ar: "جمّيز"
  en: "Jummayz (the tree the book compares to the fig)"
  ur: "جمیز ⁦(انجیر سے مشابہ درخت)⁩"
  es: "Jummayz (el árbol que el libro compara con la higuera)"
  fr: "Jummayz (l'arbre auquel le livre compare le figuier)"
summary:
  ar: "شجرة عظيمة تشبه التين، لها لبن كثير، تثمر أكثر من مرة في السنة؛ قليلة الغذاء رديئة للمعدة عند ديسقوريدوس، وفيها قوة مليّنة محلّلة، ونُسب إليها تلطيف الأورام العسرة وتطهير الجراح والإسهال وإقشعرار الحمّيات {cite:canon-ibn-sina-print-v1 p.425} {cite:canon-ibn-sina-print-v1 p.426}."
  en: "A great tree like the fig, with much milky sap, bearing several times a year. Dioscorides says it gives little nourishment and is bad for the stomach. It has a softening and dissolving power; its sap is said to soften stubborn swellings and wounds, purge the belly and help the shivering of fevers {cite:canon-ibn-sina-print-v1 p.425} {cite:canon-ibn-sina-print-v1 p.426}."
  ur: "انجیر سے مشابہ ایک بڑا درخت، جس میں بہت سا دودھیا رس ہوتا ہے اور جو سال میں کئی بار پھل دیتا ہے۔ دیسقوریدوس کے مطابق اس کی غذا کم ہے اور معدے کے لیے بری ہے؛ اس میں نرم کرنے اور تحلیل کرنے کی قوت ہے، اور کہا گیا ہے کہ اس کا رس سخت ورموں اور زخموں کو نرم کرتا، پیٹ کو مسہل کرتا اور بخار کی کپکپی میں مفید ہے {cite:canon-ibn-sina-print-v1 p.425} {cite:canon-ibn-sina-print-v1 p.426}۔"
  es: "Un gran árbol como la higuera, con mucha savia lechosa, que da frutos varias veces al año. Dioscórides dice que aporta poco alimento y es malo para el estómago. Tiene propiedades suavizantes y disolventes; se dice que su savia ablanda hinchazones y heridas persistentes, purga el estómago y ayuda a aliviar los escalofríos de la fiebre {cite:canon-ibn-sina-print-v1 p.425} {cite:canon-ibn-sina-print-v1 p.426}."
  fr: "Un grand arbre semblable au figuier, à la sève abondante et laiteuse, qui fructifie plusieurs fois par an. Dioscoride dit qu'il est peu nourrissant et mauvais pour l'estomac. Il possède des propriétés adoucissantes et dissolvantes; sa sève est réputée ramollir les gonflements et les plaies tenaces, purifier l'estomac et soulager les frissons de la fièvre {cite:canon-ibn-sina-print-v1 p.425} {cite:canon-ibn-sina-print-v1 p.426}."
