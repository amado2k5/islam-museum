id: concept/fasad-al-dhikr
class: concept
kind: scientific
label:
  ar: "فساد الذكر"
  en: "Corruption of memory (fasad al-dhikr)"
  ur: "یاد کا بگاڑ ⁦(فساد الذكر)⁩"
  es: "Corrupción de la memoria (fasad al-dhikr)"
summary:
  ar: "يذكر ابن سينا أن فساد الذكر نظير الرعونة لكنه في مؤخر الدماغ، وسببه الأول عند جالينوس البرد، وعلاماته بحسب اليبس أو الرطوبة، وأن النسيان مع الصحة ينذر بأمراض الدماغ القوية {cite:canon-ibn-sina-print-v2 p.99}"
  en: "Ibn Sina says corruption of memory is the counterpart of ru'una but in the back of the brain, its first cause according to Galen cold, with signs according to dryness or moisture, and that forgetfulness arising with health warns of grave diseases of the brain {cite:canon-ibn-sina-print-v2 p.99}"
  ur: "ابن سینا کہتا ہے کہ یاد کا بگاڑ رعونت کا ہم مثل ہے مگر دماغ کے پچھلے حصے میں، جالینوس کے نزدیک اس کا پہلا سبب سردی ہے، اس کی علامات خشکی یا تری کے مطابق ہیں، اور صحت کے ساتھ بھول بڑی دماغی بیماریوں کی خبر دیتی ہے {cite:canon-ibn-sina-print-v2 p.99}۔"
  es: "Ibn Sina afirma que la corrupción de la memoria es la contraparte de la ru'una, pero en la parte posterior del cerebro, siendo su primera causa, según Galeno, el frío, con signos que varían según la sequedad o la humedad, y que el olvido que surge con la salud advierte de enfermedades graves del cerebro {cite:canon-ibn-sina-print-v2 p.99}."
