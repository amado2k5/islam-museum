summary:
  ar: 'الشهيد: الشاهد على خلقه الحاضر الذي لا يغيب عنه شيء. الاسم رقم 50 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: ash-Shahid — The Witness. Name 50 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "ash-Shahid — Le Témoin. Nom 50 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'الشهيد: شہید — حاضر و ناظر، جس سے کوئی چیز غائب نہیں۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 50۔'
  es: "ash-Shahid — El Testigo. Ocupa el puesto número 50 en la enumeración de los nombres más bellos del hadiz de Tirmidhi."
  tr: "Şehit: O'nun yaratılışına tanık, O'ndan asla eksik olmayan bugünkü. El-Tirmidi'nin Allah'ın Güzel İsimleri hakkındaki hadislerde adı 50."
  id: "Sang Syuhada: saksi atas ciptaan-Nya, yang kini yang tidak pernah jauh dari-Nya. Nama nomor 50 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Indah Allah."
