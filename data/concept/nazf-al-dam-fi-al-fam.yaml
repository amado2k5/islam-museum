id: concept/nazf-al-dam-fi-al-fam
class: concept
kind: scientific
label:
  ar: نزف الدم في الفم
  en: Oozing of blood in the mouth
  ur: منہ میں خون کا رسنا
  es: "Supuración de sangre en la boca"
  fr: "Écoulement de sang dans la bouche"
summary:
  ar: نزف الدم إن كان خروجه من جوهر الفم وجلدته فعلاجه بالقوابض المذكورة في باب البثور وغيرها ولطبيخ أغصان من هذا الجنس منفعة عظيمة وإن كان من موضع آخر فقد أفرد له باباً بل أبواباً {cite:canon-ibn-sina-print-v2 p.264}
  en: 'If the blood''s oozing comes out of the mouth''s substance and skin its treatment is by the astringents named in the pustule chapter and others, and a decoction of twigs of this kind has great benefit; if it is from another place, a chapter — indeed chapters — have been set apart for it (the names left out) {cite:canon-ibn-sina-print-v2 p.264}'
  ur: 'اگر خون کا رسنا منہ کے جوہر اور کھال سے نکلتا ہو تو اس کا علاج دانوں والے باب اور دوسروں میں مذکور قابضوں سے ہے اور اسی جنس کی ڈالیوں کے جوشاندے کو بڑا نفع ہے؛ اور اگر کسی اور مقام سے ہو تو اس کے لیے الگ باب بلکہ ابواب رکھے گئے ہیں ⁦(نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.264}'
  es: "Si el sangrado proviene de la boca y la piel, su tratamiento consiste en los astringentes mencionados en el capítulo sobre pústulas y otros, y una decocción de ramitas de este tipo resulta muy beneficiosa; si proviene de otro lugar, se le ha dedicado un capítulo —de hecho, varios— (los nombres se omiten) {cite:canon-ibn-sina-print-v2 p.264}"
  fr: "Si le sang suinte de la muqueuse buccale et de la peau, son traitement repose sur les astringents mentionnés dans le chapitre sur les pustules et d'autres, et une décoction de brindilles de ce genre est très bénéfique; si l'écoulement provient d'ailleurs, un chapitre – voire des chapitres – lui sont consacrés (les noms sont omis). {cite:canon-ibn-sina-print-v2 p.264}"
