summary:
  ar: "يعد ابن سينا من المسهلات عظيمة الغائلة الخربق الأسود والتربد الأصفر والغاريقون الأسود والمازريون، ويأمر عند ظهور أعراض رديئة بدفع الدواء بقيء أو إحدار والمعالجة بالترياق وبسقي الماء البارد جداً وبما يكسر الحدة بالتغرية والتليين والدسومة {cite:canon-ibn-sina-print-v1 p.284}."
  en: "Ibn Sina counts among harmful purgatives black hellebore, yellowish turbith, blackish agaric and mazarion, and when bad signs appear orders the drug be driven out by vomiting or purging and treated with theriac, very cold water and what breaks the sharpness by gluing, softening and fattiness {cite:canon-ibn-sina-print-v1 p.284}."
