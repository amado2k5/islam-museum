id: concept/canon-dangerous-purgatives-and-their-antidotes
class: concept
kind: scientific
label:
  ar: "الأدوية المسهلة الخطرة وترياقها عند ابن سينا"
  en: "Dangerous purgatives and their antidotes in the Canon"
  fr: "Purgatifs dangereux et antidotes dans le Canon"
  ur: "خطرناک مسہلات اور ان کا تریاق قانون میں"
  es: "Purgatorios peligrosos y sus antídotos en el Canon"
summary:
  ar: "يعد ابن سينا من المسهلات عظيمة الغائلة الخربق الأسود والتربد الأصفر والغاريقون الأسود والمازريون، ويأمر عند ظهور أعراض رديئة بدفع الدواء بقيء أو إحدار والمعالجة بالترياق وبسقي الماء البارد جداً وبما يكسر الحدة بالتغرية والتليين والدسومة {cite:canon-ibn-sina-print-v1 p.284}."
  en: "Ibn Sina counts among harmful purgatives black hellebore, yellowish turbith, blackish agaric and mazarion, and when bad signs appear orders the drug be driven out by vomiting or purging and treated with theriac, very cold water and what breaks the sharpness by gluing, softening and fattiness {cite:canon-ibn-sina-print-v1 p.284}."
  fr: "Ibn Sina compte parmi les purgatifs nuisibles hellébore noir, turbith jaunâtre, agaric noirâtre et mazarion. Aux mauvais signes, il préconise expulsion par vomissement ou purge, thériaque, eau très froide et substances collantes, adoucissantes et grasses contre leur âcreté {cite:canon-ibn-sina-print-v1 p.284}."
  es: "Ibn Sina incluye entre los purgantes dañinos el eléboro negro, el turbith amarillento, el agarico negruzco y el mazarion, y cuando aparecen malos signos ordena que el medicamento sea expulsado mediante el vómito o la purga y tratado con teriaca, agua muy fría y lo que rompe la agudeza mediante la adhesión, el ablandamiento y la engrasación {cite:canon-ibn-sina-print-v1 p.284}."
  ur: "ابن سینا بلیک ہیلبور، زرد ٹربیتھ، بلیک ایگرک اور مزاریون کو نقصان دہ رفع کرنے والوں میں شمار کرتا ہے اور جب برے علامات ظاہر ہوں تو قے کرکے یا صاف کرکے دوا کو خارج کرنے کا حکم دیتا ہے اور اس کا علاج تھیریاک، انتہائی ٹھنڈے پانی سے کیا جاتا ہے اور جو چپکنے، نرم کرنے اور چکنائی کو توڑ دیتی ہے: صفحہ 284}۔"
