id: concept/ilaj-lithargus
class: concept
kind: scientific
label:
  ar: "علاج ليثرغس"
  en: "Treatment of lithargus"
  ur: "لیثرغس کا علاج"
  es: "Tratamiento del litargo"
summary:
  ar: "يذكر ابن سينا مبادئ علاج ليثرغس: الاستفراغ بالدم إن لم يمنع مانع، وجذب المواد إلى أسفل، والقيء، وإسكانه بيتاً مضيئاً ومنعه من الاستغراق في السبات، والتحليل القوي، وتلطيف الغذاء، وتدبير الناقه؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.85} {cite:canon-ibn-sina-print-v2 p.86}"
  en: "Ibn Sina gives the principles of treating lithargus: evacuation of blood if nothing prevents, drawing the matters downward, vomiting, lodging him in a bright house and keeping him from sinking into coma, strong dissolving, lightening the food, and the regimen of the convalescent; recipes and methods of application are left out {cite:canon-ibn-sina-print-v2 p.85} {cite:canon-ibn-sina-print-v2 p.86}"
  ur: "ابن سینا لیثرغس کے علاج کے اصول بتاتا ہے: خون کا استفراغ اگر کوئی رکاوٹ نہ ہو، مادوں کو نیچے کھینچنا، قے، اسے روشن گھر میں رکھنا اور غنودگی میں ڈوبنے سے روکنا، قوی تحلیل، غذا ہلکی کرنا، اور صحت یاب کی تدبیر؛ نسخے اور استعمال کے طریقے چھوڑ دیے گئے ہیں {cite:canon-ibn-sina-print-v2 p.85} {cite:canon-ibn-sina-print-v2 p.86}۔"
  es: "Ibn Sina expone los principios para tratar al litargo: evacuación de la sangre si nada lo impide, descenso de la materia, vómito, alojamiento en una casa luminosa y prevención del coma, disolución fuerte, aligeramiento de la alimentación y el régimen del convaleciente; se omiten recetas y métodos de aplicación {cite:canon-ibn-sina-print-v2 p.85} {cite:canon-ibn-sina-print-v2 p.86}"
