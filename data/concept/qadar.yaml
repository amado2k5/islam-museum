- tradition: sunni-hanbali
  id: ibn-rajab-jami
  stance:
    ar: السعادة والشقاوة سبق بهما الكتاب وهي مقدرة بحسب الأعمال، وكل ميسر لما خلق له، والخواتيم ميراث السوابق
    en: Happiness and wretchedness were written beforehand and are measured out according to deeds; each is eased toward what he was created for, and endings are the legacy of what preceded
  summary:
    ar: 'يجمع ابن رجب في شرح حديث ابن مسعود بين سبق الكتاب بالسعادة والشقاوة وبين الأمر بالعمل: فعن علي بن أبي طالب أن الصحابة سألوا «أفلا نمكث على كتابنا وندع العمل؟» فكان الجواب «اعملوا فكل ميسر لما خلق
      له»، فيقرر أن التقدير بحسب الأعمال وأن كلاً ميسر للأعمال التي هي سبب سعادته أو شقاوته؛ ثم يبين أن العبرة بالخواتيم التي هي «ميراث السوابق»، وأن خاتمة السوء تكون بدسيسة باطنة خفية لا يطلع عليها الناس.'
    en: 'In his commentary on Ibn Masud''s hadith Ibn Rajab joins the prior writing of happiness and wretchedness to the command to act: when the Companions asked, through Ali ibn Abi Talib''s report, "shall
      we not rely on what is written for us and abandon deeds?", the answer was "act, for each is eased toward what he was created for"; he concludes the decree is measured according to deeds and each is
      eased toward the deeds that bring his happiness or wretchedness, and that what counts is the endings — "the legacy of what preceded" — an evil ending coming through a hidden inward corrupting trait
      people do not see.'
