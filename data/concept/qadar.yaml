- tradition: sunni
  id: sunni-sharawi-two-attributes
  stance:
    ar: لا تعارض بين قدرة الله وعدله، والخلاف فيها تمسك بصفة دون أخرى
    en: God's power and justice do not conflict; the dispute holds to one attribute and drops the other
  summary:
    ar: 'ينقل الشعراوي خلافاً بين من يقول إن الله خالق كل شيء فيجعل القدرة مطلقة، ومن يقول إن الله عدل فلا يخلق الكفر ثم يعذب عليه؛ ويرى أن كلاً منهما تعصب لصفة واحدة، وأن الصفات كلها لذات الله فهو قادر وعادل معاً {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2522}. ويعدّ الفعل توجيه جارحة لإحداث حدث، فيكون للعبد فعل، ويرى أن الآية في أركاس المنافقين [[passage/quran-4-88|النساء 88]] تبيّن أن الله لم يقهرهم بل أخذهم بكسبهم {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2518}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2519}. ويتعجب من أن العلماء جعلوا المسألة محل خلاف بين المعتزلة وأهل السنة، ويرى أنها تُفهم على أساس الفطرة {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2520}. وينقل الشعراوي هذا كله رأياً له، ولم تُعرض بعد آراء أهل الكلام في المسألة من مصدر محدد (needs_source).'
    en: 'Sha''rawi reports a dispute between those who say God creates everything and so makes power absolute, and those who say God is just and so does not create disbelief and then punish it; he holds that each clings to one attribute, and that all the attributes belong to God, who is both capable and just {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2522}. He defines an act as the direction of a limb to bring about an event, so the servant has an act; he reads the verse on the overturning of the hypocrites [[passage/quran-4-88|Q. 4:88]] as showing that God did not force them but took them by what they earned {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2518}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2519}. He is surprised that scholars made the matter a dispute between the Mu''tazila and the Sunnis, and holds it should be understood on the basis of human nature {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2520}. This is his view; the positions of the kalam scholars are not yet set out from a named source (needs_source).'
