class: concept
kind: doctrine
label:
  ar: القدر
  en: Qadar (divine decree)
summary:
  ar: إيمان العقيدة الطحاوية بأن الله خلق الخلق بعلمه وقدّر لهم أقداراً وآجالاً، وأن كل شيء يجري بمشيئته وقضائه، مع النهي عن التعمق في سر القدر؛ ويجمع جامع الترمذي في أبواب القدر أصول هذا الاعتقاد من النصوص، بدءاً بالتحذير من التنازع فيه وأن من كان قبله هلك به {cite:jami-al-tirmidhi p.490}، وقول آدم في حجته مع موسى إنه عمل كتب الله عليه قبل خلق السماوات والأرض {cite:jami-al-tirmidhi p.490}، وأن الرزق والأجل والعمل والشقاوة والسعادة يكتبها الملك حين ينفخ الروح وأن كل ميسر لما خلق له {cite:jami-al-tirmidhi p.491}، وأن الأعمال بالخواتيم فيسبق الكتابُ على من أوشك على الجنة أو النار فيُختم له بما عمل آخرُه {cite:jami-al-tirmidhi p.491}، وأن لا يرد القضاء إلا الدعاء ولا يزيد في العمر إلا البر {cite:jami-al-tirmidhi p.492}، وأن الله كتب كتابا لأهل الجنة وكتابا لأهل النار فقال فرغ ربكم من العباد {cite:jami-al-tirmidhi p.492}، وأنه كتب لكل نفس حياتها ورزقها ومصائبها فلا عدوى ولا هامة ولا صفر {cite:jami-al-tirmidhi p.493}، وأن صنفي المرجئة والقدرية ليس لهما في الإسلام نصيب {cite:jami-al-tirmidhi p.494}، وأن أول ما خلق الله القلم فأمره أن يكتب القدر ما كان وما هو كائن إلى الأبد {cite:jami-al-tirmidhi p.495}، وأنه قدر المقادير قبل خلق السماوات والأرض بخمسين ألف سنة {cite:jami-al-tirmidhi p.496}، وأن الآية التي جمعت خلق كل شيء بقدر نزلت في مشركي قريش حين خاصموا في القدر {cite:jami-al-tirmidhi p.496}؛ ويجمع مشكاة المصابيح في كتاب الإيمان أبواب الإيمان بالقدر من صحيح البخاري ومسلم والسنن، أن الله كتب مقادير الخلق قبل خلق السماوات والأرض بخمسين ألف سنة وأن كل شيء بقدر حتى المجاز والكيس {cite:mishkat-al-masabih p.30}، وحجة آدم وموسى أن الله كتب له العمل قبل خلقه بأربعين سنة {cite:mishkat-al-masabih p.30}، وأن الملك يكتب في بطن الأم عمل الإنسان وأجله ورزقه وشقاءه وسعادته {cite:mishkat-al-masabih p.31}، وأن كل ميسر لما خلق له {cite:mishkat-al-masabih p.32}، وأن القلوب بين أصبعين من أصابع الله يَقلبها كيف يشاء {cite:mishkat-al-masabih p.33}، وأن كل مولود يولد على الفطرة {cite:mishkat-al-masabih p.33}، وأن عبادة بن الصامت روى أن القدر خيره وشره وأنه كتب ما كان وما هو كائن إلى الأبد {cite:mishkat-al-masabih p.34}، وأن الرقى والدواء من القدر {cite:mishkat-al-masabih p.36}، وأن لا يؤمن عبد حتى يؤمن بأربع وأن صنفي المرجئة والقدرية ليس لهما في الإسلام نصيب وأن القدرية مجوس هذه الأمة {cite:mishkat-al-masabih p.37} و{cite:mishkat-al-masabih p.38}، وأن عائشة روت أن ستة لعنهم الله ومنهم المكذب بالقدر {cite:mishkat-al-masabih p.38}.
  en: The Tahawi creed's belief that God created by His knowledge and decreed measures and terms, that all things happen by His will and judgement, with a warning against probing the secret of the decree; Jami' al-Tirmidhi gathers the foundations of this belief in its Book of Decree, beginning with the warning against disputing it, those before us having perished thereby {cite:jami-al-tirmidhi p.490}; Adam's argument with Moses that it was a deed God had written upon him before creating the heavens and the earth {cite:jami-al-tirmidhi p.490}; that provision, term, deed, wretchedness and felicity are written by the angel when the spirit is breathed in, and that everyone is eased to what he was created for {cite:jami-al-tirmidhi p.491}; that deeds are judged by their endings, the Book overtaking one on the verge of Paradise or the Fire {cite:jami-al-tirmidhi p.491}; that only supplication turns back decree and only righteousness lengthens life {cite:jami-al-tirmidhi p.492}; that God wrote a book for the people of Paradise and a book for the people of the Fire, then declared His servants finished {cite:jami-al-tirmidhi p.492}; that He wrote every soul's life, provision and calamities, so there is no contagion, omen or unlucky star {cite:jami-al-tirmidhi p.493}; that the two groups of the Murji'a and the Qadariyya have no share in Islam {cite:jami-al-tirmidhi p.494}; that the first thing God created was the Pen, charged to write the decree of what was and what is to come forever {cite:jami-al-tirmidhi p.495}; that He decreed the measures fifty thousand years before creating the heavens and the earth {cite:jami-al-tirmidhi p.496}; and that the verse gathering all creation under His measure was revealed regarding the polytheists of Quraysh when they disputed about decree {cite:jami-al-tirmidhi p.496}; and Mishkat al-Masabih gathers the Book of Faith's chapters on belief in the decree from the Sahihayn and the Sunan collections, that God wrote the measures of creation fifty thousand years before creating the heavens and the earth, and that everything is by decree, even endowment and cleverness {cite:mishkat-al-masabih p.30}; Adam's argument with Moses that God had written the deed upon him forty years before creating him {cite:mishkat-al-masabih p.30}; that the angel writes in the womb the person's deed, term, provision, wretchedness and felicity {cite:mishkat-al-masabih p.31}; that everyone is eased toward what he was created for {cite:mishkat-al-masabih p.32}; that hearts lie between two of God's fingers which He turns as He wills {cite:mishkat-al-masabih p.33}; that every newborn is born upon the fitra {cite:mishkat-al-masabih p.33}; that Ubayda ibn al-Samit reported that the decree, its good and its ill, was written — what was and what is to come forever {cite:mishkat-al-masabih p.34}; that incantations and medicine are of the decree {cite:mishkat-al-masabih p.36}; that no servant believes until he believes in four things, and that the two groups of the Murji'a and the Qadariyya have no share in Islam, the Qadariyya being the Magians of this community {cite:mishkat-al-masabih p.37} and {cite:mishkat-al-masabih p.38}; and that A'isha reported six people God cursed, among them the denier of the decree {cite:mishkat-al-masabih p.38}.
