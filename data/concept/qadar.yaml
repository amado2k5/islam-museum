  id: aqida-wasitiyya
  stance:
    ar: 'القدر على درجتين: العلم والكتابة، والمشيئة والخلق، والعباد فاعلون حقيقة والله خالق أفعالهم'
    en: 'Decree has two degrees: knowledge and writing, and will and creation; servants truly act and God creates their acts'
  summary:
    ar: 'يقول ابن تيمية إن الإيمان بالقدر على درجتين: علم الله بما الخلق عاملون وكتابته في اللوح المحفوظ، ومشيئته النافذة وقدرته الشاملة وخلقه لكل شيء، ثم يقول: «والعباد فاعلون حقيقة والله خالق أفعالهم»،
      وللعباد قدرة وإرادة، والله خالق قدرتهم وإرادتهم.'
    en: 'Ibn Taymiyya says belief in decree has two degrees: God''s knowledge of what creatures will do and its writing in the preserved tablet, and His effective will, all-embracing power and creation
      of everything; he then says the servants truly act and God is the creator of their acts, the servants having power and will which God created.'
  holders:
  - person/ibn-taymiyya
