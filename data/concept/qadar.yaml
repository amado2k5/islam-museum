- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: لا يكون شيء إلا بمشيئة الله، وأعمال العباد يخلقها الله، والخير والشر بقضائه وقدره
    en: Nothing happens except by God's will, God creates the acts of the servants, and good and evil are by His judgement and decree
  summary:
    ar: 'يذكر الأشعري أنهم يقولون: «إنه لا يكون في الأرض من خير ولا شر إلا ما شاء الله»، وأنه «لا خالق إلا الله» وأن أعمال العباد يخلقها الله، وأن الخير والشر بقضاء الله وقدره، وأن الله وفّق المؤمنين وخذل
      الكافرين.'
    en: Al-Ash'ari says they hold that no good or evil occurs on earth except what God wills, that there is no creator but God and that God creates the servants' acts, that good and evil are by God's judgement
      and decree, and that God granted success to the believers and forsook the unbelievers.
