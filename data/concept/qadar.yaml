  id: lumat-al-itiqad
  stance:
    ar: القدر مع بقاء الحجة على العبد وأن له فعلاً وكسباً
    en: Decree with the servant's accountability and his own act and acquisition
  summary:
    ar: يقول ابن قدامة إنه «لا يكون شيء إلا بإرادته، ولا يخرج شيء عن مشيئته»، وإن الله «خلق الخلق وأفعالهم، وقدر أرزاقهم وآجالهم»، ثم يقول إنا «لا نجعل قضاء الله وقدره حجة لنا في ترك أوامره»، وإنه لم يجبر
      أحداً على معصية، وإن «للعبد فعلاً وكسباً» يُجزى عليه.
    en: Ibn Qudama says nothing happens except by God's will and nothing escapes His decree, that He created the creatures and their acts and decreed their provisions and terms, that God's judgement and
      decree are no excuse for abandoning His commands, that He compelled no one to disobey, and that the servant has an act and an acquisition for which he is rewarded or punished.
