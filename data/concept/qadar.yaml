issue:
  ar: ما علاقة مشيئة الله وقدره بأفعال العباد؟
  en: How do God's will and decree relate to the acts of His servants?
perspectives:
- tradition: sunni-hanafi
  id: aqida-tahawiyya
  stance:
    ar: كل شيء بتقدير الله ومشيئته، مع النهي عن التعمق في سر القدر
    en: Everything is by God's decree and will, with a warning against probing the secret of the decree
  summary:
    ar: يقول الطحاوي إن الله خلق الخلق بعلمه وقدّر لهم أقداراً وآجالاً وإن كل شيء يجري بتقديره ومشيئته، ويرى أن أصل القدر سر الله في خلقه وأن التعمق فيه ذريعة الخذلان.
