id: concept/qadar
education:
  did_you_know:
    ar: "يعلّم الاعتقاد الطحاوي أن الله خلق الخلق بعلمه وقدّر لهم الأقدار والآجال، مع النهي عن الخوض في سر القدر."
    en: "Tahawi's creed teaches that God created creatures by His knowledge and decreed their fates and life-spans, while forbidding probing the mystery of decree."
    ur: "عقیدۂ طحاویہ سکھاتا ہے کہ اللہ نے مخلوق کو اپنے علم سے پیدا کیا اور ان کی تقدیریں اور آجال مقرر کیں، اور سرِ قدر میں کھدائی سے منع کیا۔"
    sources: [source/aqida-tahawiyya, source/aqida-wasitiyya]
class: concept
kind: doctrine
label:
  ar: القدر
  en: Qadar (divine decree)
summary:
  ar: إيمان العقيدة الطحاوية بأن الله خلق الخلق بعلمه وقدّر لهم أقداراً وآجالاً، وأن كل شيء يجري بمشيئته وقضائه، مع النهي عن التعمق في سر القدر.
  en: The Tahawi creed's belief that God created by His knowledge and decreed measures and terms, that all things happen by His will and judgement, with a warning against probing the secret of the decree.
