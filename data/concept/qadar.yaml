  did_you_know:
    ar: "يعلّم الاعتقاد الطحاوي أن الله خلق الخلق بعلمه وقدّر لهم الأقدار والآجال، مع النهي عن الخوض في سر القدر."
    en: "Tahawi's creed teaches that God created creatures by His knowledge and decreed their fates and life-spans, while forbidding probing the mystery of decree."
    ur: "عقیدۂ طحاویہ سکھاتا ہے کہ اللہ نے مخلوق کو اپنے علم سے پیدا کیا اور ان کی تقدیریں اور آجال مقرر کیں، اور سرِ قدر میں کھدائی سے منع کیا۔"
