summary:
  ar: "المران ثمر شجرة يؤكل على شدة عفوصته، فيه قبض وتجفيف، وثمرته تدمل الجراحات الغليظة، وعصارته بالشراب نافعة من نهشة الأفعى، وقيل إن نشارة خشبه تقتل إذا شربت {cite:canon-ibn-sina-print-v1 p.567}."
  en: "Murran is the fruit of a tree, eaten despite its extreme astringency, with astringency and drying; its fruit heals thick wounds, its juice with wine is said to help a viper's bite, and the sawdust of its wood is said to kill if drunk {cite:canon-ibn-sina-print-v1 p.567}."
  ur: "مران ایک درخت کا پھل ہے جو سخت کسیلے پن کے باوجود کھایا جاتا ہے، قبض اور خشک کرنے کی صفت رکھتا ہے؛ اس کا پھل گہرے زخم بھر دیتا ہے، اس کا رس شراب کے ساتھ سانپ کے ڈسنے میں مفید بتایا گیا ہے، اور کہا گیا ہے کہ اس کی لکڑی کا برادہ پیا جائے تو مار دیتا ہے {cite:canon-ibn-sina-print-v1 p.567}۔"
  es: "Murran es el fruto de un árbol, que se come a pesar de su extrema astringencia, con astringencia y sequedad; su fruto cura heridas profundas, se dice que su jugo con vino ayuda a la mordedura de una víbora, y se dice que el aserrín de su madera mata si se bebe {cite:canon-ibn-sina-print-v1 p.567}."
