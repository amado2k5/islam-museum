summary:
  ar: "يذكر ابن سينا أن الشعري ينعقد في الكلية من رطوبة مستطيلة بفعل حرارة، وأن الشبيه بقطع الخمير المنقوع يدل على ضعف المعدة والأمعاء وسوء الهضم وربما على تناول اللبن والجبن. {cite:canon-ibn-sina-print-v1 p.195}."
  en: "Ibn Sina says hairlike sediment is set in the kidney from a lengthened moisture worked on by heat, and that sediment like bits of soaked leaven shows weakness of stomach and bowels and poor digestion, perhaps from taking milk and cheese. {cite:canon-ibn-sina-print-v1 p.195}."
