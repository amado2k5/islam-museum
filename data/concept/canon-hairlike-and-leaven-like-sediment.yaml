id: concept/canon-hairlike-and-leaven-like-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب الشعري والشبيه بقطع الخمير عند ابن سينا"
  en: "Hairlike sediment and sediment like bits of leaven in the Canon"
  fr: "Sédiments capillaires et semblables au levain dans le Canon"
  ur: "بال نما اور خمیر کے ٹکڑوں جیسی تلچھٹ قانون میں"
  es: "Sedimentos parecidos a cabellos y sedimentos con forma de trozos de levadura en el cañón."
summary:
  ar: "يذكر ابن سينا أن الشعري ينعقد في الكلية من رطوبة مستطيلة بفعل حرارة، وأن الشبيه بقطع الخمير المنقوع يدل على ضعف المعدة والأمعاء وسوء الهضم وربما على تناول اللبن والجبن. {cite:canon-ibn-sina-print-v1 p.195}."
  en: "Ibn Sina says hairlike sediment is set in the kidney from a lengthened moisture worked on by heat, and that sediment like bits of soaked leaven shows weakness of stomach and bowels and poor digestion, perhaps from taking milk and cheese. {cite:canon-ibn-sina-print-v1 p.195}."
  fr: "Ibn Sina situe le capillaire au rein, humidité allongée figée par chaleur ; les fragments de levain trempé signaleraient faiblesse gastrique et intestinale et mauvaise digestion, parfois après lait et fromage. {cite:canon-ibn-sina-print-v1 p.195}."
  es: "Ibn Sina afirma que la acumulación de sedimentos finos en el riñón se produce por la acción prolongada de la humedad y el calor, y que la presencia de sedimentos con aspecto de trozos de levadura remojada indica debilidad estomacal e intestinal y mala digestión, posiblemente debido al consumo de leche y queso. {cite:canon-ibn-sina-print-v1 p.195}."
