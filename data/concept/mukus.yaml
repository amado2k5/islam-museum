id: concept/mukus
class: concept
kind: legal
label: { ar: "المُكُوس", en: "Unlawful tolls and levies (mukus)", ur: "مَکوس (ناجائز محصول و ٹیکس)" }
summary:
  ar: "المكوس جمع مكس، وأصله في اللغة النقص والظلم، وهي ما كان يؤخذ من بائعي السلع في الأسواق في الجاهلية، أو الضريبة التي يأخذها المكاس من التجار عند دخول البلد، والماكس العشار. وتميز الفقهاء بينها وبين العشور والجباية والضرائب والخراج. وهي عند الفقهاء على قسمين: مذمومة منهي عنها، وما لا يدخل في ذلك كنصف العشر الذي فرضه عمر على تجارة أهل الذمة. وفي الأحكام أن الزكاة لا يحتسب فيها ما دفع مكسا عند جمهور الفقهاء، وأن الحج قد يسقط بالمكس في المالكية على تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14942}"
  en: "Mukus is the plural of maks, which in the lexicon means loss and injustice. It names the dues taken from sellers in markets in the pre-Islamic period, and the toll that a collector takes from merchants entering a town. The jurists distinguish it from the tithe on trade, the general collection, the levies and the kharaj on land. Some levies are blameworthy and forbidden, the hadith on Uqba ibn 'Amir stating that the one who takes a toll does not enter Paradise; others are not, such as the half tithe Umar imposed on the trade of the protected people. Most jurists hold that a toll paid cannot be counted as zakat; the Malikis allow a pilgrim to be excused from pilgrimage when the toll is heavy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14942}"
  ur: "مَکوس محصول وصول کرنے والوں کے ناجائز ٹیکس کو کہتے ہیں۔ فقہاء ان میں سے بعض کو مذموم اور حرام، اور بعض، جیسے عمر کا ذمیوں کی تجارت پر نصف عشر، جائز مانتے ہیں۔ جمہور کے نزدیک مکس دی گئی رقم زکات میں شمار نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941}"
