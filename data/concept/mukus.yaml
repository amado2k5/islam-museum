label: { ar: "المُكُوس", en: "Unlawful tolls and levies (mukus)", ur: "مَکوس ⁦(ناجائز محصول و ٹیکس)⁩", es: "Peajes y gravámenes ilegales (mukus)", fr: "Péages et prélèvements illégaux (mukus)", tr: "özel tüketim vergisi", id: "Cukai" }
summary:
  ar: "المكوس جمع مكس، وأصله في اللغة النقص والظلم، وهي ما كان يؤخذ من بائعي السلع في الأسواق في الجاهلية، أو الضريبة التي يأخذها المكاس من التجار عند دخول البلد، والماكس العشار. وتميز الفقهاء بينها وبين العشور والجباية والضرائب والخراج. وهي عند الفقهاء على قسمين: مذمومة منهي عنها، وما لا يدخل في ذلك كنصف العشر الذي فرضه عمر على تجارة أهل الذمة. وفي الأحكام أن الزكاة لا يحتسب فيها ما دفع مكسا عند جمهور الفقهاء، وأن الحج قد يسقط بالمكس في المالكية على تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14942}"
  en: "Mukus is the plural of maks, which in the lexicon means loss and injustice. It names the dues taken from sellers in markets in the pre-Islamic period, and the toll that a collector takes from merchants entering a town. The jurists distinguish it from the tithe on trade, the general collection, the levies and the kharaj on land. Some levies are blameworthy and forbidden, the hadith on Uqba ibn 'Amir stating that the one who takes a toll does not enter Paradise; others are not, such as the half tithe Umar imposed on the trade of the protected people. Most jurists hold that a toll paid cannot be counted as zakat; the Malikis allow a pilgrim to be excused from pilgrimage when the toll is heavy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14942}"
  ur: "مَکوس محصول وصول کرنے والوں کے ناجائز ٹیکس کو کہتے ہیں۔ فقہاء ان میں سے بعض کو مذموم اور حرام، اور بعض، جیسے عمر کا ذمیوں کی تجارت پر نصف عشر، جائز مانتے ہیں۔ جمہور کے نزدیک مکس دی گئی رقم زکات میں شمار نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941}"
  es: "Mukus es el plural de maks, que en el léxico significa pérdida e injusticia. Se refiere a los tributos que se cobraban a los vendedores en los mercados en el período preislámico, y al peaje que un recaudador cobraba a los comerciantes que entraban en una ciudad. Los juristas lo distinguen del diezmo sobre el comercio, la recaudación general, los impuestos y el kharaj sobre la tierra. Algunos impuestos son censurables y están prohibidos; el hadiz de Uqba ibn 'Amir afirma que quien cobra un peaje no entra en el Paraíso; otros no lo son, como el medio diezmo que Umar impuso al comercio de las personas protegidas. La mayoría de los juristas sostienen que un peaje pagado no puede considerarse zakat; los malikíes permiten que un peregrino quede eximido de la peregrinación cuando el peaje es elevado. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14939} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14940} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14942}"
  fr: "Mukus est le pluriel de maks, qui signifie perte et injustice dans le lexique. Ce terme désigne les droits perçus auprès des vendeurs sur les marchés à l'époque préislamique, ainsi que le péage exigé des marchands entrant dans une ville. Les juristes le distinguent de la dîme sur le commerce, de la collecte générale, des prélèvements et du kharaj foncier. Certains prélèvements sont blâmables et interdits; le hadith relatif à Uqba ibn 'Amir stipule que celui qui perçoit un péage n'entrera pas au Paradis. D'autres ne le sont pas, comme la demi-dîme imposée par Umar sur le commerce des personnes protégées. La plupart des juristes estiment qu'un péage acquitté ne peut être considéré comme de la zakat; les malikites autorisent un pèlerin à être dispensé du pèlerinage lorsque le péage est élevé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14942}"
  tr: "Vergi, 'mix' kelimesinin çoğuludur,, başlangıçta 'eksiklik' ve 'adaletsizlik' dillerinde, İslam öncesi dönemde pazarlarda mal satıcılarından toplanan vergiyi veya ülkeye girişte tüccarlardan alınan vergi ile vergi vergisini ifade eder. Hukukçular bunu ondalık, vergi, vergiler ve kharaj ile ayırt etmiştir. Hukukçulara göre bu iki kategoriye ayrılır: suçlu ve yasaklı olanlar ile Ömer'in ahit halkının ticaretine uyguladığı yarım ondalık gibi uygulanmayanlar. Hükümlerde, zekat, çoğu hukukçuya göre ödenen vergi olarak sayılmaz; Maliki okuluna göre Hac vergiden muaf tutulabilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14942}"
  id: "Pajak adalah bentuk jamak dari 'campuran,' yang awalnya dalam bahasa 'kekurangan' dan 'ketidakadilan,' merujuk pada apa yang dikumpulkan dari penjual barang di pasar pada era pra-Islam, atau pajak yang dikumpulkan dari pedagang saat memasuki negara, dan pajak pajak. Para ahli hukum membedakan antara itu dan persepuluhan, perpajakan, pajak, dan kharaj. Menurut ahli hukum, pajak dibagi menjadi dua kategori: tersalah dan dilarang, dan apa yang tidak berlaku, seperti setengah persepuluhan yang dikenakan oleh Umar pada perdagangan umat perjanjian. Dalam putusan, zakat tidak dihitung sebagai pajak menurut mayoritas ahli hukum, dan Haji dapat dibebaskan melalui pajak di Malikis menurut mazhab Maliki, secara rinci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14942}"
