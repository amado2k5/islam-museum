id: concept/dhuwaba
class: concept
kind: legal
label:
  ar: "الذؤابة"
  en: "Dhu'aba (the plaited lock of hair, and the loose end of a turban)"
  ur: "ذؤابہ (بالوں کی لٹ اور عمامے کا لٹکتا ہوا سرا)"
summary:
  ar: "الذؤابة في اللغة الضفيرة من الشعر إذا كانت مرسلة، وطرف العمامة، ويستعملها الفقهاء بالمعنيين، والذؤابة في الشرع طرف العمامة المرسل على العنق فأسفل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8374} واتخاذ شعر الرأس أفضل من إزالته، ولا بأس بجعله ذؤابة، وعند الجمهور لا يجب على المرأة نقض ضفائرها عند الغسل إذا بلغ الماء أصول الشعر، وفي نقض الشعر للغسل من الحيض خلاف عند الحنابلة، والأصح أنه مستحب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8376} وإرخاء ذؤابة العمامة من السنة، والمستحب عند الحنفية والحنابلة وأكثر الشافعية أن تكون بين الكتفين، وعند الإطالة الفاحشة يكون من الإسبال المنهي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8378}"
  en: "Dhu'aba in the lexicon is a plait of hair when it is left loose, and the loose end of a turban; jurists use it in both senses, and in law it is the turban's end let fall over the neck and below. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8374} Keeping the hair is better than shaving it, and making it into a plait is allowed; the majority hold that a woman need not unplait her locks at washing once the water reaches the roots, while the Hanbalis differ on unplaiting after menstruation, the sounder view being that it is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8376} Letting the turban's end fall is a sunna; the Hanafis, Hanbalis and most Shafi'is prefer it between the shoulders, and excessive length is the forbidden trailing of garments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8378}"
  ur: "ذؤابہ لغت میں کھلی ہوئی چوٹی کو کہتے ہیں اور عمامہ کے لٹکتے ہوئے سرے کو بھی۔ فقہاء کے نزدیک عمامہ کا وہ سرا جو گردن پر اور اس کے نیچے لٹکتا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8374}"
