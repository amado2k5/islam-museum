label:
  ar: البينة واليمين في الخصومات
  en: Burden of proof and oath
  fr: "Charge de la preuve et serment"
  es: "Carga de la prueba y juramento"
summary:
  ar: "قاعدة الترافع التي أرساها حديث ابن عباس — الثالث والثلاثون من الأربعين — «البينة على المدعي واليمين على من أنكر»: فلو أُعطي الناس بمجرد دعواهم لادعى بعضهم دماء وأموال بعض، فتعين أن يقوم البيِّنُ بالدليل على ما ادعاه، ويستحلف المنكر على نفي ما نسب إليه؛ وفي لفظ الصحيحين «ولكن اليمين على المدعى عليه» وقضى النبي بذلك في رواية نافع بن عمر الجمحي، وفي لفظ الإسماعيلي «البينة على الطالب واليمين على المطلوب»، وهي أصل نظام الإثبات في القضاء الإسلامي ⁦(جامع العلوم والحكم ص 684)⁩."
  en: "The rule of litigation founded by Ibn Abbas's hadith — the thirty-third of the Forty — 'proof lies on the claimant and the oath on the one who denies': were people given by mere claims, some would claim others' blood and wealth, so the claimant must produce evidence for what he alleges and the denier swear to the negation of what is imputed to him; the two Sahihs word it 'but the oath is on the one against whom claim is made', the Prophet so ruling in Nafi' ibn Umar al-Jumahi's route, and al-Isma'ili's wording has 'proof on the seeker and the oath on the one sought from' — the root of the Islamic evidentiary order in judgment (Jami' al-Ulum wal-Hikam p. 684)."
  fr: "Règle judiciaire fondée sur le hadith d’Ibn Abbas, trente-troisième des Quarante : la preuve incombe au demandeur et le serment à celui qui nie. Accorder sur simples prétentions permettrait de réclamer le sang et les biens d’autrui ; le demandeur est donc tenu de prouver et le défendeur de jurer qu’il nie ce qui lui est imputé. Les deux Sahihs placent le serment sur celui contre lequel la demande est faite ; la voie de Nafi' ibn Umar al-Jumahi rapporte ce jugement du Prophète ; al-Isma'ili parle du demandeur et du sollicité. C’est le fondement du système probatoire judiciaire islamique (Jami' al-Ulum wal-Hikam, p. 684)."
  es: "La regla de litigio fundada por el hadiz de Ibn Abbas —el trigésimo tercero de los Cuarenta— \"la prueba recae sobre el demandante y el juramento sobre el que niega\": si las personas se basaran en meras reclamaciones, algunos reclamarían la sangre y la riqueza de otros, por lo que el demandante debe presentar pruebas de lo que alega y el negador jurar la negación de lo que se le imputa; los dos Sahihs lo expresan como \"pero el juramento recae sobre aquel contra quien se hace la reclamación\", el Profeta dictaminó así en la ruta de Nafi' ibn Umar al-Jumahi, y la formulación de al-Isma'ili es \"la prueba recae sobre el que busca y el juramento sobre aquel de quien se busca\" —la raíz del orden probatorio islámico en el juicio (Jami' al-Ulum wal-Hikam p. 684)."
