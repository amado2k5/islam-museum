label:
  ar: البينة واليمين في الخصومات
  en: Burden of proof and oath
summary:
  ar: "قاعدة الترافع التي أرساها حديث ابن عباس — الثالث والثلاثون من الأربعين — «البينة على المدعي واليمين على من أنكر»: فلو أُعطي الناس بمجرد دعواهم لادعى بعضهم دماء وأموال بعض، فتعين أن يقوم البيِّنُ بالدليل على ما ادعاه، ويستحلف المنكر على نفي ما نسب إليه؛ وفي لفظ الصحيحين «ولكن اليمين على المدعى عليه» وقضى النبي بذلك في رواية نافع بن عمر الجمحي، وفي لفظ الإسماعيلي «البينة على الطالب واليمين على المطلوب»، وهي أصل نظام الإثبات في القضاء الإسلامي (جامع العلوم والحكم ص 684)."
  en: "The rule of litigation founded by Ibn Abbas's hadith — the thirty-third of the Forty — 'proof lies on the claimant and the oath on the one who denies': were people given by mere claims, some would claim others' blood and wealth, so the claimant must produce evidence for what he alleges and the denier swear to the negation of what is imputed to him; the two Sahihs word it 'but the oath is on the one against whom claim is made', the Prophet so ruling in Nafi' ibn Umar al-Jumahi's route, and al-Isma'ili's wording has 'proof on the seeker and the oath on the one sought from' — the root of the Islamic evidentiary order in judgment (Jami' al-Ulum wal-Hikam p. 684)."
