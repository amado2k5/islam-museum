summary:
  ar: "خروع في الكتاب شجرة صغيرة في مقدار شجرة صغيرة من التين، ينقل الكتاب وصفها عن ديسقوريدوس ويقول إن دهنها المسمى أقنقس لا يصلح للطعام؛ وعن الدمشقي أنه محلل مليّن؛ ويذكر الكتاب نفعا للثآليل والكلف والأورام البلغمية والجرب والقروح الرطبة؛ وفيه نقل موسوم عن أورام الثدي في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.718-719}"
  en: "Khirwa' is in the book a small tree about the size of a small fig tree; the book quotes its description from Dioscorides and says that its oil, called aqanqus, is not fit for food; it quotes al-Dimashqi that it is dissolving and softening; and it records benefit for warts, freckles, phlegmatic swellings, scab and moist ulcers; it has a labelled listing on swellings of the breast in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.718-719}"
  ur: "خروع کتاب میں ایک چھوٹا درخت ہے جو چھوٹے انجیر کے درخت کے برابر ہے؛ کتاب اس کا وصف دیسقوریدوس سے نقل کرتی ہے اور کہتی ہے کہ اس کا تیل، جسے اقنقس کہا جاتا ہے، کھانے کے لائق نہیں؛ دمشقی سے نقل کرتی ہے کہ یہ تحلیل کرنے والا اور نرم کرنے والا ہے؛ اور مسوں، جھائیوں، بلغمی ورموں، جرب اور تر زخموں میں فائدہ بیان کرتی ہے؛ سینے کے ورموں کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.718-719}۔"
