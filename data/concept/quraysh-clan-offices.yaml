label: { ar: "الولايات العامة لقبائل قريش في الجاهلية", en: "The Clan Offices of Jahiliya Quraysh" }
summary:
  ar: "أورد السيوطي عن ابن إسحاق أن قريشاً لم يكن لها ملك ترجع الأمور كلها إليه بل كان في كل قبيلة ولاية عامة تكون لرئيسها فكانت في بني هاشم السقاية والرفادة ومعنى ذلك أنه لا يأكل ولا يشرب أحد إلا من طعامهم وشرابهم وكانت في بني عبد الدار الحجابة واللواء والندوة أي لا يدخل البيت أحد إلا بإذنهم وإذا عقدت قريش راية حرب عقدها لهم بنو عبد الدار وإذا اجتمعوا لأمر إبراماً أو نقضاً لا يكون اجتماعهم لذلك إلا في دار الندوة وكان لأبي بكر في الجاهلية أمر الديات والغرم."
  en: "Suyuti cites Ibn Ishaq: Quraysh had no single king to whom all affairs returned; each clan held a general office under its head. Banu Hashim held the siqaya and rifada — none ate or drank save of their food and drink; Banu Abd al-Dar held the hijaba, the liwa' and the nadwa — none entered the House save by their leave, they bound Quraysh's war banners, and the assembly met for binding or loosing only at Dar al-Nadwa. And Abu Bakr's Jahiliya charge was the diya and ghamara — bloodwit and the heavy debts."
