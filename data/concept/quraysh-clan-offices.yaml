label: { ar: "الولايات العامة لقبائل قريش في الجاهلية", en: "The Clan Offices of Jahiliya Quraysh", es: "Las oficinas del clan de Jahiliya Quraysh", fr: "Les bureaux du clan Jahiliya Quraysh", ur: "جاہلیہ قریش کے قبیلہ کے دفتر", tr: "İslam Öncesi Dönemde Kureyş Kabilelerinin Genel Eyaletleri", id: "Provinsi Umum Suku Quraisy pada Era Pra-Islam" }
summary:
  ar: "أورد السيوطي عن ابن إسحاق أن قريشاً لم يكن لها ملك ترجع الأمور كلها إليه بل كان في كل قبيلة ولاية عامة تكون لرئيسها فكانت في بني هاشم السقاية والرفادة ومعنى ذلك أنه لا يأكل ولا يشرب أحد إلا من طعامهم وشرابهم وكانت في بني عبد الدار الحجابة واللواء والندوة أي لا يدخل البيت أحد إلا بإذنهم وإذا عقدت قريش راية حرب عقدها لهم بنو عبد الدار وإذا اجتمعوا لأمر إبراماً أو نقضاً لا يكون اجتماعهم لذلك إلا في دار الندوة وكان لأبي بكر في الجاهلية أمر الديات والغرم."
  en: "Suyuti cites Ibn Ishaq: Quraysh had no single king to whom all affairs returned; each clan held a general office under its head. Banu Hashim held the siqaya and rifada — none ate or drank save of their food and drink; Banu Abd al-Dar held the hijaba, the liwa' and the nadwa — none entered the House save by their leave, they bound Quraysh's war banners, and the assembly met for binding or loosing only at Dar al-Nadwa. And Abu Bakr's Jahiliya charge was the diya and ghamara — bloodwit and the heavy debts."
  es: "Suyuti cita a Ibn Ishaq: Quraysh no tenía un solo rey al que todos los asuntos regresaran; cada clan tenía un cargo general bajo su cabeza. Banu Hashim tenía el cargo de siqaya y rifada —nadie comía ni bebía salvo su comida y bebida—; Banu Abd al-Dar tenía el cargo de hijaba, liwa' y nadwa —nadie entraba en la Casa salvo con su permiso—, ataban los estandartes de guerra de Quraysh, y la asamblea se reunía para atar o desatar solo en Dar al-Nadwa. Y el cargo jahiliya de Abu Bakr era el diya y ghamara —sangre sabia y grandes deudas—."
  fr: "Suyuti cite Ibn Ishaq: les Qurayshites n’avaient pas de roi unique auquel toutes les affaires étaient rattachées; chaque clan détenait une charge générale sous son autorité. Les Banu Hashim exerçaient la siqaya et la rifada – nul ne mangeait ni ne buvait en dehors de leurs propres biens; les Banu Abd al-Dar détenaient la hijaba, la liwa’ et la nadwa – nul n’entrait dans la Maison sans leur permission, ils nouaient les bannières de guerre des Qurayshites, et l’assemblée ne se réunissait pour nouer ou dénouer les bannières qu’à Dar al-Nadwa. Quant à Abu Bakr, durant la Jahiliya, il était chargé de la diya et de la ghamara – le sang versé et les lourdes dettes."
  ur: "سیوطی نے ابن اسحاق کا حوالہ دیا ہے: قریش کا کوئی ایک بادشاہ نہیں تھا جس کے پاس تمام معاملات واپس ہوتے۔ ہر قبیلہ اپنے سربراہ کے تحت ایک عام دفتر رکھتا تھا۔ بنو ہاشم نے سقع اور رفاد کو تھام رکھا تھا - ان کے کھانے پینے کے علاوہ کسی نے کچھ نہیں کھایا اور نہ پیا۔ بنو عبد الدار نے حجاب، لیوا اور ندوہ پکڑے ہوئے تھے - ان کی رخصت کے علاوہ کوئی بھی ایوان میں داخل نہیں ہوا تھا، انہوں نے قریش کے جنگی جھنڈے باندھے تھے، اور مجلس صرف دار الندوہ میں پابند ہونے یا کھونے کے لیے ہوتی تھی۔ اور ابوبکر کی جاہلیت کا الزام دیا اور غمارہ تھا - خون خرابہ اور بھاری قرض۔"
  tr: "El-Suyuti, İbn İshak'tan Kureyş'in tüm meselelerin geri döndüğü bir krallığa sahip olmadığını; her kabilenin lideri için genel bir otoritesi olduğunu anlatmıştır. Banu Haşimler arasında su temini ve destek vardı; yani kimse yiyecek ve içecekten başka yiyip içmezdi. Banu Abdüldar'da bir muhafız, bayrak ve bir toplanma vardı; yani kimse eve ancak onların izniyle giremezdi. Qureyş bir savaş bayrağı koyduğunda, Banu Abdüldar onlar için bunu yapardı. Eğer bir anlaşma veya iptal için toplanırlarsa, toplanmaları sadece Dar al-Nadwa'da yapılırdı. Ebu Bekir, İslam öncesi dönemde kan parası ve para cezası konusunda yetkiye sahipti."
  id: "Al-Suyuti menceritakan dari Ibn Ishaq bahwa Quraisy tidak memiliki kerajaan yang kembali ke mana semua urusan kembali; melainkan, setiap suku memiliki otoritas umum untuk pemimpinnya. Di antara Banu Hashim, terdapat pasokan air dan dukungan, artinya tidak ada yang makan atau minum kecuali dari makanan dan minuman mereka. Di antara Banu Abd al-Dar, ada penjaga, panji, dan perkumpulan, artinya tidak ada yang masuk ke rumah kecuali dengan izin mereka. Ketika Quraisy mendirikan panji perang, Banu Abd al-Dar akan melakukannya untuk mereka. Jika mereka berkumpul untuk kesepakatan atau pembatalan, pertemuan mereka hanya akan berlangsung di Dar al-Nadwa. Abu Bakr memiliki wewenang atas uang darah dan denda pada era pra-Islam."
