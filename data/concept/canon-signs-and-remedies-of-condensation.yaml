summary:
  ar: "يفرق ابن سينا بين التكاثف من برد وقبض وعلامته بياض اللون وإبطاء التسخن والتعرق وعود اللون إلى الحمرة عند الرياضة، وبين ما كان من رياضة وعلامته عدم تلك العلامات وتوسخ الجلد، وبين ما كان من غبار أو قوة دلك، ويصف لكل منها علاجه {cite:canon-ibn-sina-print-v1 pp.246-247}."
  en: "Ibn Sina distinguishes condensation from cold and astringency, whose sign is pallor, slow warming and sweating and a return of the red colour on exercise, from that due to exercise, whose sign is the absence of those signs and a dirty skin, and from that due to dust or hard rubbing, and describes a remedy for each {cite:canon-ibn-sina-print-v1 pp.246-247}."
