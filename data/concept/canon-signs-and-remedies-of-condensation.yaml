id: concept/canon-signs-and-remedies-of-condensation
class: concept
kind: scientific
label:
  ar: "علامات التكاثف وعلاجه عند ابن سينا"
  en: "Signs and remedies of condensation in the Canon"
  fr: "Signes et remèdes de la condensation dans le Canon"
  ur: "سکڑاؤ کی علامات اور علاج قانون میں"
  es: "Signos y remedios de condensación en el Canon"
  tr: "İbn Sina'ya göre yoğuşma belirtileri ve tedavisi"
  id: "Tanda-tanda kondensasi dan pengobatannya menurut Ibn Sina"
summary:
  ar: "يفرق ابن سينا بين التكاثف من برد وقبض وعلامته بياض اللون وإبطاء التسخن والتعرق وعود اللون إلى الحمرة عند الرياضة، وبين ما كان من رياضة وعلامته عدم تلك العلامات وتوسخ الجلد، وبين ما كان من غبار أو قوة دلك، ويصف لكل منها علاجه {cite:canon-ibn-sina-print-v1 pp.246-247}."
  en: "Ibn Sina distinguishes condensation from cold and astringency, whose sign is pallor, slow warming and sweating and a return of the red colour on exercise, from that due to exercise, whose sign is the absence of those signs and a dirty skin, and from that due to dust or hard rubbing, and describes a remedy for each {cite:canon-ibn-sina-print-v1 pp.246-247}."
  fr: "Ibn Sina distingue la condensation par froid et astringence — pâleur, lenteur à se réchauffer et à transpirer, retour de la rougeur à l’exercice — de celle par exercice, sans ces signes mais avec peau sale, puis de celle par poussière ou friction forte ; il décrit un remède pour chacune {cite:canon-ibn-sina-print-v1 pp.246-247}."
  es: "Ibn Sina distingue la condensación del frío y la astringencia, cuyo signo es palidez, calentamiento lento y sudoración y retorno del color rojo con el ejercicio, de la debida al ejercicio, cuyo signo es la ausencia de esos signos y una piel sucia, y de la debida al polvo o al roce fuerte, y describe un remedio para cada una {cite:canon-ibn-sina-print-v1 pp.246-247}."
  ur: "ابن سینا نے گاڑھاپن کو سردی اور سختی سے ممتاز کیا ہے، جس کی علامت پیلا ہونا، آہستہ گرمی اور پسینہ آنا اور ورزش کرنے پر سرخ رنگ کا لوٹ جانا ہے، جس کی علامت ان علامات کا نہ ہونا اور جلد کی گندگی ہے، اور اس کی وجہ گردوغبار یا سخت رگڑ ہے، اور ہر ایک کے لیے ایک علاج بیان کیا ہے: صفحہ 246-247}۔"
  tr: "İbn Sina, egzersiz sırasında beyazlık, yavaşlayan ısınma, terleme ve kızarıklıkla karakterize edilen soğuk ve kramp gibi kalınlaşmaları; bu belirtilerin yokluğu ve cilt kiriyle karakterize edilen egzersiz ile toz veya güçlü sürtünme arasındaki farkı ayırır ve her {cite:canon-ibn-sina-print-v1 s.246-247} için tedavi edildiğini açıklar."
  id: "Ibn Sina membedakan antara penebalan seperti dingin dan kram, yang ditandai dengan kulit putih, pemanasan yang lambat, keringat, dan kemerahan saat berolahraga; antara olahraga, yang ditandai dengan tidak adanya tanda-tanda ini dan kotoran kulit; dan debu atau gesekan kuat, serta menjelaskan perlakuannya untuk setiap {cite:canon-ibn-sina-print-v1 hlm.246-247}."
