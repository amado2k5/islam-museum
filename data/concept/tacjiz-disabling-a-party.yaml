id: concept/tacjiz-disabling-a-party
class: concept
kind: legal
label:
  ar: "التعجيز"
  en: "Ta'jiz (declaring a party unable: a slave under a writing, or a party who fails to produce proof)"
  ur: "تعجیز (کسی کو عاجز قرار دینا: مکاتب یا گواہی سے عاجز فریق)"
summary:
  ar: "التعجيز نسبة الشخص إلى العجز، ولم يستعمله الفقهاء إلا في حالتين: تعجيز المكاتَب، وتعجيز أحد الخصمين عن إقامة البينة. فالكتابة لازمة من جانب السيد، ولا يجوز تعجيز المكاتب قبل العجز، وإذا عجز بعد حلول النجم فلجمهور الحنفية والشافعية والحنابلة أن يفسخ السيد بنفسه، وعند المالكية بحكم الحاكم. وعند المالكية يعجز القاضي المدعي بانقضاء الآجال، والشافعية والحنابلة يمهلون المدعي ولا يمهلون المدعى عليه أكثر من ثلاثة أيام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5384}"
  en: "Ta'jiz is ascribing inability to a person; the jurists use it only for a slave under a writing of manumission and for a party who cannot produce proof. The Hanafis, Shafiis and Hanbalis let the master cancel the writing after default, the Malikis through the judge; the Malikis have the judge declare a claimant unable when the set terms run out, while the Shafiis and Hanbalis give a defendant no more than three days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5384}"
