id: concept/tacjiz-disabling-a-party
class: concept
kind: legal
label:
  ar: "التعجيز"
  en: "Ta'jiz (declaring a party unable: a slave under a writing, or a party who fails to produce proof)"
  ur: "تعجیز ⁦(کسی کو عاجز قرار دینا: مکاتب یا گواہی سے عاجز فریق)⁩"
  es: "Ta'jiz (declarar a una parte incapaz: un esclavo bajo escritura, o una parte que no presenta pruebas)"
  fr: "Ta'jiz (déclarer une partie incapable: un esclave sous contrat écrit, ou une partie qui ne parvient pas à produire de preuve)"
  tr: "Hareketsizleştirme"
  id: "Imobilisasi"
summary:
  ar: "التعجيز نسبة الشخص إلى العجز، ولم يستعمله الفقهاء إلا في حالتين: تعجيز المكاتَب، وتعجيز أحد الخصمين عن إقامة البينة. فالكتابة لازمة من جانب السيد، ولا يجوز تعجيز المكاتب قبل العجز، وإذا عجز بعد حلول النجم فلجمهور الحنفية والشافعية والحنابلة أن يفسخ السيد بنفسه، وعند المالكية بحكم الحاكم. وعند المالكية يعجز القاضي المدعي بانقضاء الآجال، والشافعية والحنابلة يمهلون المدعي ولا يمهلون المدعى عليه أكثر من ثلاثة أيام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5384}"
  en: "Ta'jiz is ascribing inability to a person; the jurists use it only for a slave under a writing of manumission and for a party who cannot produce proof. The Hanafis, Shafiis and Hanbalis let the master cancel the writing after default, the Malikis through the judge; the Malikis have the judge declare a claimant unable when the set terms run out, while the Shafiis and Hanbalis give a defendant no more than three days. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5384}"
  es: "Ta'jiz consiste en atribuir incapacidad a una persona; los juristas lo utilizan únicamente para un esclavo bajo un contrato de manumisión y para una parte que no puede presentar pruebas. Los hanafíes, shafiíes y hanbalíes permiten que el amo cancele el contrato tras el incumplimiento, mientras que los malikíes lo hacen a través del juez. Los malikíes disponen que el juez declare incapacitado al demandante cuando se agotan los plazos establecidos, mientras que los shafiíes y hanbalíes conceden al demandado un plazo máximo de tres días. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5384}"
  fr: "Le ta'jiz consiste à imputer l'incapacité à une personne; les juristes ne l'utilisent que pour un esclave affranchi et pour une partie incapable d'en apporter la preuve. Les écoles hanafite, chaféite et hanbalite permettent au maître d'annuler l'acte après défaut de paiement, tandis que les malikites le font par l'intermédiaire du juge. Chez les malikites, le juge déclare le demandeur incapable à l'expiration du délai imparti, tandis que les chaféites et les hanbalites n'accordent au défendeur que trois jours au maximum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5384}"
  ur: "تعجّز کسی شخص کی نااہلی کو قرار دینا ہے۔ فقہاء اس کا استعمال صرف ایک غلام کے لیے لکھتے ہیں اور اس جماعت کے لیے جو ثبوت پیش نہیں کر سکتا۔ حنفیہ، شافعی اور حنبلی نے آقا کو پہلے سے طے شدہ تحریر کو منسوخ کرنے کی اجازت دی ہے، مالکی قاضی کے ذریعے؛ مالکیوں کے نزدیک جج دعویدار کو مقررہ شرائط کے ختم ہونے پر نااہل قرار دیتا ہے، جبکہ شافعی اور حنبلی مدعا علیہ کو تین دن سے زیادہ نہیں دیتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5383}"
  tr: "İşesizlik iddiası, bir kişiyi yetersizlikle ilişkilendirmektir ve hukukçular bunu sadece iki durumda kullanmıştır: makamları yetersiz kılmak veya tartışmacılardan birinin delil sunamamasını sağlamak. Usta tarafından yazı gereklidir ve yıldız düşmeden önce görev yapamayan görevlerin yapılmasına izin verilmez. Yıldız ortaya çıktıktan sonra görev yapamazsa, Hanefi, Şafii ve Hanbali mezheblerinin çoğu ustayı kendisi feshedebilir ve Malikilere göre karar karardır. Malikilere göre, hakim son tarihler dolduktan sonra davacıyı talep edemez, Şafi'ler ve Hanbaliler ise davacıya üç günü geçmeden bir süre tanır. {atıf:) fiqh-mawsua-kuwaitiyya-noor-v3 s.5383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5384}"
  id: "Mengklaim ketidakmampuan berarti mengaitkan seseorang dengan ketidakmampuan, dan ahli hukum hanya menggunakannya dalam dua kasus: membuat jabatan tidak mampu, atau membuat salah satu pihak yang bersengketa tidak dapat memberikan bukti. Penulisan diperlukan dari pihak guru, dan tidak diperbolehkan menjatuhkan jabatan sebelum bintang jatuh. Jika jabatan tidak dapat dilakukan setelah bintang muncul, mayoritas aliran Hanafi, Syafi'i, dan Hanbali dapat membubarkan guru sendiri, dan menurut Maliki, putusan adalah keputusan. Menurut Maliki, hakim tidak dapat mengklaim penggugat setelah tenggat waktu berakhir, sementara Shafi'i dan Hanbal memberikan penggugat jangka waktu tetapi tidak lebih dari tiga hari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5384}"
