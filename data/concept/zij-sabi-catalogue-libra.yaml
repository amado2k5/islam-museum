summary:
  ar: "يذكر الفهرس كواكب صورة الميزان، فيبدأ بالكواكب التي في الكفة الجنوبية، ثم الكواكب التي في طرف الكفة الشمالية، والمواضع في جدول الطول والعرض لم تُنقل. {cite:zij-sabi-nallino-byblion pp.260}"
  en: "The catalogue gives the figure of al-Mizan, the Scale, beginning with the stars of the southern pan and then the stars at the edge of the northern pan. Positions are in a table that is not transcribed here. {cite:zij-sabi-nallino-byblion pp.260}"
  ur: "فہرست میزان کی صورت دیتی ہے، جنوبی پلڑے کے ستاروں سے شروع کرتے ہوئے، پھر شمالی پلڑے کے کنارے کے ستارے۔ مواضع جدول میں ہیں اور یہاں نقل نہیں ہوئے۔ {cite:zij-sabi-nallino-byblion pp.260}"
  es: "El catálogo presenta la figura de al-Mizan, la Escala, comenzando con las estrellas del sur del mar y luego con las estrellas del borde del norte. Las posiciones se encuentran en una tabla que no se transcribe aquí. {cite:zij-sabi-nallino-byblion pp.260}"
  fr: "Le catalogue donne la figure d'al-Mizan, la Balance, en commençant par les étoiles du pan sud puis celles situées à la limite du pan nord. Les positions sont indiquées dans un tableau non transcrit ici. {cite:zij-sabi-nallino-byblion pp.260}"
