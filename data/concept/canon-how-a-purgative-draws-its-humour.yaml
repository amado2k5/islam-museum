label: { ar: "كيف يجذب المسهل خلطه عند ابن سينا", en: "How a purgative draws its humour in the Canon", ur: "مسہل اپنے خلط کو کیسے کھینچتا ہے قانون میں" }
summary:
  ar: "يرد ابن سينا على من قال إن المسهل يولد ما يجذبه أو يجذب الأرق أولاً، وعلى رأي جالينوس في المشاكلة في الجوهر، ويرى أن للمسهل قوة جاذبة، وأن الجذب في طريق الأمعاء ومنها تدفع الطبيعة إلى خارج، وأن أكثر ما يجذب من العروق {cite:canon-ibn-sina-print-v1 pp.278-279}."
  en: "Ibn Sina answers those who say the purgative generates what it draws or draws the thinnest first, and answers Galen's view of likeness in substance, holding that the purgative has a drawing power, that the drawing is along the route to the intestines from which nature pushes outward, and that most of what is drawn comes from the vessels {cite:canon-ibn-sina-print-v1 pp.278-279}."
