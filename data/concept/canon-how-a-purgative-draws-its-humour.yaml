id: concept/canon-how-a-purgative-draws-its-humour
class: concept
kind: scientific
label:
  ar: "كيف يجذب المسهل خلطه عند ابن سينا"
  en: "How a purgative draws its humour in the Canon"
  fr: "Attraction humorale par le purgatif dans le Canon"
  ur: "مسہل اپنے خلط کو کیسے کھینچتا ہے قانون میں"
  es: "Cómo un purgante extrae su humor del Canon"
summary:
  ar: "يرد ابن سينا على من قال إن المسهل يولد ما يجذبه أو يجذب الأرق أولاً، وعلى رأي جالينوس في المشاكلة في الجوهر، ويرى أن للمسهل قوة جاذبة، وأن الجذب في طريق الأمعاء ومنها تدفع الطبيعة إلى خارج، وأن أكثر ما يجذب من العروق {cite:canon-ibn-sina-print-v1 pp.278-279}."
  en: "Ibn Sina answers those who say the purgative generates what it draws or draws the thinnest first, and answers Galen's view of likeness in substance, holding that the purgative has a drawing power, that the drawing is along the route to the intestines from which nature pushes outward, and that most of what is drawn comes from the vessels {cite:canon-ibn-sina-print-v1 pp.278-279}."
  fr: "Ibn Sina conteste que le purgatif produise l’humeur ou attire la plus fluide d’abord, et la ressemblance substantielle de Galien. Il propose une force attractive suivant la voie intestinale d’expulsion naturelle, surtout depuis les vaisseaux {cite:canon-ibn-sina-print-v1 pp.278-279}."
  es: "Ibn Sina responde a quienes dicen que el purgante genera lo que extrae o extrae primero lo más delgado, y responde a la visión de Galeno sobre la semejanza en sustancia, sosteniendo que el purgante tiene un poder de atracción, que la atracción se produce a lo largo del camino hacia los intestinos desde donde la naturaleza empuja hacia afuera, y que la mayor parte de lo que se extrae proviene de los vasos {cite:canon-ibn-sina-print-v1 pp.278-279}."
