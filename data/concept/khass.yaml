summary:
  ar: "خس في الكتاب بقلة البري منها في قوة الخشخاش الأسود؛ ينقل الكتاب عن جالينوس أن برودة البستاني ليست بالغة وأنه في الثانية في رأي المؤلف، لا جلاء فيه ولا قبض ولا إطلاق، سريع الهضم، وينفع من اختلاف المياه والعطش وحرارة المعدة واليرقان وبعض الأورام الحارة، وينوم ويزيل السهر، ولبن البري يجلو قروح القرنية، وإدامة أكله تظلم العين؛ وفيه نقل موسوم عن اللبن والمني والشهوة والاحتلام والطمث في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.707-708}"
  en: "Khass is in the book a vegetable of which the wild kind is in the strength of black poppy; the book quotes Galen that the coldness of the garden kind is not great, and in its author's view it is in the second degree, with no cleansing, astringency or loosening in it, quick to digest, and it benefits watery flux, thirst, heat of the stomach, jaundice and some hot swellings, brings sleep and removes sleeplessness, the milk of the wild kind cleanses ulcers of the cornea, and eating it continually darkens the eye; it has a labelled listing on milk, semen, desire, nocturnal emission and menses in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.707-708}"
  ur: "خس کتاب میں ایک ترکاری ہے جس کی جنگلی قسم قوت میں سیاہ خشخاش کی طرح ہے؛ کتاب جالینوس سے نقل کرتی ہے کہ باغی قسم کی ٹھنڈک بہت زیادہ نہیں، اور مصنف کی رائے میں وہ دوسرے درجے میں ہے، اس میں نہ صفائی ہے نہ قبض نہ اطلاق، جلد ہضم ہوتا ہے، اور پانی جیسے دست، پیاس، معدے کی گرمی، یرقان اور بعض گرم ورموں میں نافع ہے، نیند لاتا ہے اور بے خوابی دور کرتا ہے، جنگلی کا دودھ قرنیہ کے زخموں کو صاف کرتا ہے، اور اسے ہمیشہ کھانے سے آنکھ تاریک ہوتی ہے؛ دودھ، منی، شہوت، احتلام اور حیض کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.707-708}۔"
  es: "En el libro, el khass es una verdura cuya variedad silvestre es similar a la amapola negra; el libro cita a Galeno, quien afirma que la frescura de la variedad cultivada no es muy intensa, y en opinión de su autor es de segundo grado, sin propiedades limpiadoras, astringentes ni suavizantes, de fácil digestión, y beneficiosa para la diarrea, la sed, el calor estomacal, la ictericia y algunas inflamaciones, induce el sueño y elimina el insomnio; la leche de la variedad silvestre limpia las úlceras de la córnea, y su consumo continuo oscurece el ojo; tiene una lista etiquetada sobre la leche, el semen, el deseo, la emisión nocturna y la menstruación en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.707-708}."
  fr: "Le khass est décrit dans le livre comme un légume dont la variété sauvage a la force du pavot noir. Le livre cite Galien selon lequel la fraîcheur de la variété cultivée est modérée, et l'auteur la classe au second degré, sans propriétés purifiantes, astringentes ou laxatives, facile à digérer, et bénéfique en cas de diarrhée aqueuse, de soif, de chaleurs d'estomac, de jaunisse et de certains œdèmes. Il favorise le sommeil et combat l'insomnie. Le lait de la variété sauvage purifie les ulcères de la cornée, mais sa consommation régulière fonce l'œil. Le livre contient une liste commentée sur le lait, le sperme, le désir, les éjaculations nocturnes et les menstruations, dans une section réservée à l'avis du fondateur. {cite:canon-ibn-sina-print-v1 pp.707-708}"
  tr: "Kitapta marul, siyah haşhaşın gücüne kıyasla vahşiliği açısından azdır; kitapta Galen'in alıntısı yapılır ki, bahçıvanın soğuğu şiddetli değildir ve yazarın görüşüne göre bahçıvanda açıklama, kasılma ve serbest bırakma yoktur, hızlı sindirilir, su farkları, susuzluk, mide ısısı, sarılık ve bazı sıcak tümörler için faydalıdır, uyku giderir ve uyku halini giderir, yabani süt kornea ülserlerini temizler ve tüketimi kötü gözlere yol açar; ayrıca kurucunun kuralı hakkında yorum yapan bir bölümde 'Süt, Sperma, Arzu, Gece Rüyaları ve Adet Dönemi' başlıklı bir alıntı da yer alır {cite:canon-ibn-sina-print-v1 s.707-708}"
  id: "Dalam buku ini, selada sangat liar dibandingkan dengan kekuatan poppy hitam; buku ini mengutip Galen bahwa dinginnya tukang kebun tidak parah, dan menurut penulis, dalam yang terakhir, selada tidak memiliki klarifikasi, tidak kontraksi, dan pelepasan, cepat dicerna, bermanfaat untuk perbedaan air, haus, panas perut, kuning, dan beberapa tumor panas, tidur dan meredakan kantuk, dan susu liar membersihkan borok kornea, dan konsumsi berkelanjutan menyebabkan mata jahat; juga menyertakan kutipan berjudul 'Susu, Semen, Keinginan, Mimpi Malam, dan Menstruasi' dalam bagian yang mengomentari aturan pendiri {cite:canon-ibn-sina-print-v1 hlm.707-708}"
