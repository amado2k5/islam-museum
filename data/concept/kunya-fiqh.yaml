id: concept/kunya-fiqh
class: concept
kind: legal
label:
  ar: "الكُنْيَة"
  en: "Kunya (teknonym, fiqh rulings)"
  ur: "کنیت (فقہی احکام)"
summary:
  ar: "الكنية ما صدّر بأب أو أم، كأبي عبد الله وأم الخير، وزاد الجرجاني: أو ابن أو بنت؛ وهي علم غير الاسم واللقب، تُستعمل معهما أو دونهما تفخيماً لصاحبها، وتكون لأشراف الناس، وقد اشتهرت عند العرب حتى غلبت على الأسماء كأبي طالب وأبي لهب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13538}."
  en: "A kunya is a name that begins with ab (father) or umm (mother), such as Abu Abd Allah or Umm al-Khayr; al-Jurjani adds ibn or bint. It is a name besides the given name and the laqab, used with them or alone to honour its bearer, and belongs to notable people; among the Arabs kunyas were so common that they sometimes overcame the proper names, as Abu Talib and Abu Lahab {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13538}."
  ur: "کنیت وہ نام ہے جو اب (باپ) یا ام (ماں) سے شروع ہو، جیسے ابو عبد اللہ یا ام الخیر؛ جرجانی نے ابن یا بنت کا اضافہ کیا۔ یہ اسم اور لقب کے علاوہ ایک نام ہے جو صاحبِ نام کی تعظیم کے لیے ان کے ساتھ یا تنہا استعمال ہوتا ہے، اور یہ معزز لوگوں کے لیے ہے؛ عربوں میں کنیتیں اتنی مشہور تھیں کہ بعض اوقات اسموں پر غالب آ گئیں، جیسے ابو طالب اور ابو لہب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13538}۔"
