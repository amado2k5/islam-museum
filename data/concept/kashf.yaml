id: concept/kashf
class: concept
kind: legal
label:
  ar: "كَشْف"
  en: "Uncovering (kashf)"
  ur: "کھولنا ⁦(کشف)⁩"
  es: "Descubriendo (kashf)"
  fr: "Découverte (kashf)"
summary:
  ar: "الكشف في اللغة رفع الحجاب، وفي الفقه يتعلق بكشف العورة. وستر العورة شرط لصحة الصلاة، ويحرم على البالغ العاقل أن يكشف عورته أمام غيره، وكشف المغلظة أشد. ويستثنى ما بين الزوجين، وما دعت إليه الضرورة أو الحاجة كالعلاج والختان والشهادة بقدر الحاجة. وفي الخلوة اختلف الفقهاء، فجمهورهم لا يجيزه إلا لحاجة، وأجازه بعضهم لأدنى غرض. ويجب كشف الرأس للرجل المحرم، والوجه للمرأة المحرمة عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13275}"
  en: "Kashf in the lexicon is lifting a veil; in law it concerns uncovering the private parts ('awra). Covering the 'awra is a condition of valid prayer. An adult of sound mind may not uncover his 'awra before others; the stricter 'awra is more grave to uncover. Exceptions are between spouses and what need or necessity requires, such as treatment, circumcision and testimony, kept within the need. The jurists differ on uncovering in privacy: most forbid it without need, while some allow it for a small purpose. A man in the sacred state must uncover his head and a woman her face, according to some jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13275}"
  ur: "کشف لغت میں پردہ ہٹانا ہے، اور فقہ میں اس کا تعلق ستر کھولنے سے ہے۔ نماز میں ستر ڈھانپنا صحتِ نماز کی شرط ہے، اور بالغ عاقل شخص کا دوسروں کے سامنے اپنا ستر کھولنا حرام ہے، جس میں مغلظہ زیادہ سخت ہے۔ میاں بیوی کے درمیان اور ضرورت یا حاجت ⁦(علاج، ختنہ، گواہی)⁩ میں بقدرِ حاجت کھولنا مستثنیٰ ہے۔ خلوت میں کھولنے میں اختلاف ہے: جمہور بلا حاجت منع کرتے ہیں اور بعض معمولی غرض کے لیے جائز کہتے ہیں۔ بعض فقہاء کے نزدیک احرام کی حالت میں مرد سر اور عورت چہرہ کھولے گی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13275}"
  es: "En el léxico, kashf significa levantar un velo; en derecho, se refiere a descubrir las partes íntimas (awra). Cubrir la awra es condición para una oración válida. Un adulto en pleno uso de sus facultades mentales no debe descubrir su awra ante otros; cuanto más estricta sea la awra, más grave será descubrirla. Existen excepciones entre cónyuges y según lo requiera la necesidad, como por ejemplo, para recibir tratamiento médico, circuncisión o dar testimonio, siempre dentro de los límites de la necesidad. Los juristas difieren en cuanto a descubrirse en privado: la mayoría lo prohíbe sin necesidad, mientras que algunos lo permiten para un propósito menor. Según algunos juristas, un hombre en estado sagrado debe descubrirse la cabeza y una mujer el rostro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13275}"
  fr: "Le terme « kashf » désigne le fait de lever un voile; en droit, il concerne le fait de découvrir les parties intimes (ʿawra). Couvrir l’ʿawra est une condition de validité de la prière. Un adulte sain d’esprit ne peut découvrir son ʿawra en public; plus l’ʿawra est stricte, plus il est grave de la découvrir. Des exceptions existent entre époux et pour les besoins essentiels, tels que les soins médicaux, la circoncision et le témoignage, dans la limite de la nécessité. Les juristes divergent quant au fait de se découvrir en privé: la plupart l’interdisent sans nécessité, tandis que certains l’autorisent pour un motif mineur. Selon certains juristes, un homme en état de sacralisation doit se découvrir la tête et une femme le visage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13275}"
