label:
  ar: "كَشْف"
  en: "Uncovering (kashf)"
  ur: "کھولنا (کشف)"
summary:
  ar: "الكشف في اللغة رفع الحجاب، وفي الفقه يتعلق بكشف العورة. وستر العورة شرط لصحة الصلاة، ويحرم على البالغ العاقل أن يكشف عورته أمام غيره، وكشف المغلظة أشد. ويستثنى ما بين الزوجين، وما دعت إليه الضرورة أو الحاجة كالعلاج والختان والشهادة بقدر الحاجة. وفي الخلوة اختلف الفقهاء، فجمهورهم لا يجيزه إلا لحاجة، وأجازه بعضهم لأدنى غرض. ويجب كشف الرأس للرجل المحرم، والوجه للمرأة المحرمة عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13275}"
  en: "Kashf in the lexicon is lifting a veil; in law it concerns uncovering the private parts ('awra). Covering the 'awra is a condition of valid prayer. An adult of sound mind may not uncover his 'awra before others; the stricter 'awra is more grave to uncover. Exceptions are between spouses and what need or necessity requires, such as treatment, circumcision and testimony, kept within the need. The jurists differ on uncovering in privacy: most forbid it without need, while some allow it for a small purpose. A man in the sacred state must uncover his head and a woman her face, according to some jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13275}"
  ur: "کشف لغت میں پردہ ہٹانا ہے، اور فقہ میں اس کا تعلق ستر کھولنے سے ہے۔ نماز میں ستر ڈھانپنا صحتِ نماز کی شرط ہے، اور بالغ عاقل شخص کا دوسروں کے سامنے اپنا ستر کھولنا حرام ہے، جس میں مغلظہ زیادہ سخت ہے۔ میاں بیوی کے درمیان اور ضرورت یا حاجت (علاج، ختنہ، گواہی) میں بقدرِ حاجت کھولنا مستثنیٰ ہے۔ خلوت میں کھولنے میں اختلاف ہے: جمہور بلا حاجت منع کرتے ہیں اور بعض معمولی غرض کے لیے جائز کہتے ہیں۔ بعض فقہاء کے نزدیک احرام کی حالت میں مرد سر اور عورت چہرہ کھولے گی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13273} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13274} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13275}"
