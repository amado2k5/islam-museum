label:
  ar: "التصحيح"
  en: "Tashih (correction and validation: of a hadith, a contract, an act of worship, and inheritance shares)"
  ur: "تصحیح (درستگی: حدیث، عقد، عبادت اور وراثت کے حصص)"
summary:
  ar: "التصحيح في اللغة إزالة الخطأ، وعند المحدثين الحكم على الحديث بالصحة بعد استيفاء شروطها، وعند أهل الفرائض تزيل الكسور بين السهام والرؤوس، وعند الفقهاء رفع ما يفسد العبادة أو العقد. وتصحيح الفساد واجب متى عُرف. وفي الحديث اختلف في الشروط، وعمل العالم بالحديث لا يعد تصحيحاً له. وأما العقد الفاسد فالجمهور غير الحنفية لا يصححونه برفع المفسد، والحنفية يصححون الفاسد الضعيف دون الباطل. وتصحيح العبادة إذا طرأ عليها ما يفسدها، كتغير الاجتهاد في القبلة أو انكشاف العورة أو النجاسة، ممكن بالإزالة السريعة. ومسائل الفرائض تصحح بالضرب بحسب الموافقة والتباين والتداخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5232}"
  en: "Tashih means removing an error. For the hadith scholars it is ruling a hadith sound once its conditions are met; for the experts in inheritance it removes fractions between shares and heads; for the jurists it is removing what spoils a worship or a contract. Correcting a defect is a duty once known. On hadith the conditions are disputed, and a scholar's practice in line with a hadith is not a ruling that it is sound. A defective contract is not made valid by removing its defect, according to the non-Hanafi jurists; the Hanafis hold that a weak defect may be removed while a void one may not. A worship spoiled in the course of it can be corrected by removing the fault quickly, as when a worshipper's judgement of the qibla changes or a garment slips or an impurity falls on him. Inheritance shares are corrected by multiplication according to the agreement, overlap and separateness of the numbers of heads. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5232}"
