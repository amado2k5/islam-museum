label:
  ar: "التصحيح"
  en: "Tashih (correction and validation: of a hadith, a contract, an act of worship, and inheritance shares)"
  ur: "تصحیح ⁦(درستگی: حدیث، عقد، عبادت اور وراثت کے حصص)⁩"
  es: "Tashih (corrección y validación: de un hadiz, un contrato, un acto de culto y participaciones en una herencia)"
  fr: "Tashih (correction et validation: d'un hadith, d'un contrat, d'un acte de culte et de parts d'héritage)"
summary:
  ar: "التصحيح في اللغة إزالة الخطأ، وعند المحدثين الحكم على الحديث بالصحة بعد استيفاء شروطها، وعند أهل الفرائض تزيل الكسور بين السهام والرؤوس، وعند الفقهاء رفع ما يفسد العبادة أو العقد. وتصحيح الفساد واجب متى عُرف. وفي الحديث اختلف في الشروط، وعمل العالم بالحديث لا يعد تصحيحاً له. وأما العقد الفاسد فالجمهور غير الحنفية لا يصححونه برفع المفسد، والحنفية يصححون الفاسد الضعيف دون الباطل. وتصحيح العبادة إذا طرأ عليها ما يفسدها، كتغير الاجتهاد في القبلة أو انكشاف العورة أو النجاسة، ممكن بالإزالة السريعة. ومسائل الفرائض تصحح بالضرب بحسب الموافقة والتباين والتداخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5232}"
  en: "Tashih means removing an error. For the hadith scholars it is ruling a hadith sound once its conditions are met; for the experts in inheritance it removes fractions between shares and heads; for the jurists it is removing what spoils a worship or a contract. Correcting a defect is a duty once known. On hadith the conditions are disputed, and a scholar's practice in line with a hadith is not a ruling that it is sound. A defective contract is not made valid by removing its defect, according to the non-Hanafi jurists; the Hanafis hold that a weak defect may be removed while a void one may not. A worship spoiled in the course of it can be corrected by removing the fault quickly, as when a worshipper's judgement of the qibla changes or a garment slips or an impurity falls on him. Inheritance shares are corrected by multiplication according to the agreement, overlap and separateness of the numbers of heads. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5232}"
  es: "Tashih significa corregir un error. Para los eruditos del hadiz, consiste en declarar válido un hadiz una vez que se cumplen sus condiciones; para los expertos en herencia, corrige las discrepancias entre las partes y los herederos; para los juristas, elimina aquello que invalida un acto religioso o un contrato. Corregir un defecto es un deber una vez conocido. En el hadiz, las condiciones son objeto de debate, y la práctica de un erudito conforme a un hadiz no implica su validez. Según los juristas no hanafíes, un contrato defectuoso no se vuelve válido simplemente corrigiendo su defecto; los hanafíes sostienen que un defecto leve puede corregirse, mientras que uno nulo no. Un acto religioso que se ve afectado durante su realización puede corregirse eliminando rápidamente la falta, como cuando el juicio del devoto sobre la qibla cambia, se le resbala una prenda o le cae una impureza. Las partes de la herencia se corrigen mediante la multiplicación según la concordancia, la superposición y la separación del número de herederos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5219} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5221} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5222} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5224} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5226} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5229} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5232}"
  fr: "Le terme « tashih » désigne la correction d'une erreur. Pour les spécialistes du hadith, il s'agit de déclarer un hadith valide une fois ses conditions remplies; pour les experts en droit successoral, il s'agit d'éliminer les fractions entre les parts et les héritiers; pour les juristes, il s'agit de corriger ce qui altère un acte de culte ou un contrat. Corriger un défaut est un devoir dès lors qu'il est connu. Les conditions relatives au hadith sont sujettes à controverse, et la pratique d'un savant conforme à un hadith ne constitue pas une déclaration de validité. Un contrat défectueux n'est pas validé par la simple correction de son défaut, selon les juristes non hanafites; les hanafites estiment qu'un défaut mineur peut être corrigé, tandis qu'un contrat nul ne le peut pas. Un acte de culte perturbé en cours de route peut être corrigé en éliminant rapidement le défaut, par exemple lorsque le fidèle se trompe dans son appréciation de la qibla, qu'un vêtement glisse ou qu'une impureté tombe sur lui. Les parts d'héritage sont corrigées par multiplication selon l'accord, le chevauchement et la séparation des nombres d'héritiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5232}"
