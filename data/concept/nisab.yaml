summary:
  ar: "النصاب في الفقه القدر الذي يجب به الزكاة؛ تعالج الموسوعة الفقهية الكويتية اشتراط إتمام النصاب والنصاب في الركاز ووقت اعتبار وجوده {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Nisab in fiqh is the wealth threshold that obliges zakat; the Kuwaiti Fiqh Encyclopedia treats the requirement of completing the nisab, the nisab of rikaz, and the time at which its existence counts {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "El nisab en fiqh es el umbral de riqueza que obliga al zakat; la Enciclopedia de Fiqh de Kuwait trata el requisito de completar el nisab, el nisab del rikaz y el momento en que su existencia cuenta {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Le nisab en fiqh est le seuil de richesse qui oblige à verser la zakat; l'Encyclopédie koweïtienne de fiqh traite de l'exigence d'atteindre le nisab, du nisab de rikaz et du moment où son existence compte {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "فقہ میں نصاب مال کی حد ہے جس پر زکوٰۃ واجب ہوتی ہے۔ کویتی فقہ انسائیکلو پیڈیا نصاب کی تکمیل کے تقاضے، نصاب کے نصاب اور اس کے وجود میں آنے کے وقت کا ذکر کرتا ہے۔"
  tr: "Hukukta nisab, zekatın zorunlu olduğu miktardır; Kuveyt Fıkıh Ansiklopedisi, nisab ve nisabın kayadaki tamamlanması gerekliliğini ve bunun varlığını dikkate aldığı süreyi ele alır {atıf:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Nisab dalam yurisprudensi adalah jumlah kewajiban zakat; Ensiklopedia Yurisprudensi Kuwait membahas persyaratan untuk menyelesaikan nisab dan nisab dalam batu serta waktu yang diperhitungkan dengan keberadaannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
