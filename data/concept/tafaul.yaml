summary:
  ar: "يرى الشيخ عمر عبد الكافي أن الإسلام يقوم على التفاؤل في مقابل تشاؤم العرب قبل الإسلام، وأن القرآن والسنة يدفعان إلى التفاؤل ويعارضان اليأس، وأن المسلم متفائل بطبعه."
  en: "Sheikh Omar Abdelkafy holds that Islam rests on optimism, in contrast with the pessimism of the Arabs before Islam, that the Qur'an and the Sunna push towards optimism against despair, and that the Muslim is optimistic by nature."
  ur: "شیخ عمر عبدالکافی کی رائے ہے کہ اسلام تفاؤل پر قائم ہے، جو زمانۂ جاہلیت کے عربوں کی بدفالی کے مقابل ہے، اور قرآن و سنت تفاؤل اور مایوسی کے خلاف ہونے کی طرف لے جاتے ہیں، اور مسلمان فطری طور پر پرامید ہوتا ہے۔"
