summary:
  ar: "لفظ الخدم المشاة في البيوت الكبيرة في الدولة العثمانية المتأخرة، وكانوا غالباً من أرمن فان؛ وقد وُجّه أمر سنة 1751م بإبدالهم بالمسلمين {cite:encyclopaedia-of-islam-2 vol. 1 p. 841}."
  en: "The term for the footmen of great households in the later Ottoman Empire, generally Armenians of Van. A decree of 1751 ordered that Armenian and Greek dhimmis be replaced by Muslims in such houses {cite:encyclopaedia-of-islam-2 vol. 1 p. 841}."
  fr: "Terme désignant les domestiques des grandes maisons à la fin de l’Empire ottoman, généralement des Arméniens de Van. Un décret de 1751 ordonna d’y remplacer les dhimmis arméniens et grecs par des musulmans {cite:encyclopaedia-of-islam-2 vol. 1 p. 841}."
  es: "El término utilizado para referirse a los lacayos de las grandes casas en el Imperio Otomano tardío, generalmente armenios de Van. Un decreto de 1751 ordenó que los dhimmis armenios y griegos fueran reemplazados por musulmanes en dichas casas {cite:encyclopaedia-of-islam-2 vol. 1 p. 841}."
  ur: "بعد کی سلطنت عثمانیہ میں عظیم گھرانوں کے پیروں کے لیے اصطلاح، عام طور پر وان کے آرمینیائی۔ 1751 کے ایک فرمان میں حکم دیا گیا کہ ایسے گھروں میں آرمینیائی اور یونانی ذمیوں کی جگہ مسلمانوں کو رکھا جائے {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد 1 ص۔ 841}۔"
  tr: "Geç Osmanlı devletinde, çoğunluğu Ermenilerden oluşan büyük evlerde 'ayak hizmetçileri' terimi çıkarıldı; 1751'de onların yerine Müslümanlar geçmeleri emredildi {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 841}."
  id: "Istilah 'pelayan kaki' di rumah-rumah besar di akhir negara Ottoman, yang sebagian besar adalah orang Armenia, dikeluarkan; pada tahun 1751, perintah dikeluarkan untuk menggantikan mereka dengan Muslim {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 841}."
