id: concept/sukkar-al-ushar
class: concept
kind: natural
label:
  ar: "سكر العشر"
  en: "Sukkar al-ushar (the sugar of the ushar tree)"
  ur: "سکر العشر"
  es: "Sukkar al-ushar (el azúcar del árbol ushar)"
  fr: "Sukkar al-ushar (le sucre de l'arbre ushar)"
  tr: "On şeker"
  id: "Sepuluh gula"
summary:
  ar: "سكر العشر في الكتاب مَنٌّ يقع على شجر العشر كقطع الملح، فيه مع الحلاوة قليل عفوصة ومرارة، منه يماني أبيض ومنه حجازي إلى السواد، جلاء يحد البصر وينفع الرئة والكلى والمثانة، ونافع من الاستسقاء مع لبن النوق ولا يعطش كسائر أنواع السكر، وهو جيد للمعدة والكبد {cite:canon-ibn-sina-print-v1 p.602}."
  en: "Sukkar al-ushar is in the book a manna falling on the ushar tree like pieces of salt, with a little astringency and bitterness along with its sweetness, a white Yemeni kind and a Hijazi kind turning toward black; cleansing, it sharpens sight and helps the lung, kidneys and bladder, is useful for dropsy with she-camel's milk and does not cause thirst like the other sugars, and is good for the stomach and liver {cite:canon-ibn-sina-print-v1 p.602}."
  ur: "سکر العشر کتاب میں ایک من ⁦(شیرہ)⁩ ہے جو عشر کے درخت پر نمک کے ٹکڑوں کی طرح گرتا ہے، اس میں مٹھاس کے ساتھ تھوڑی کسیلی اور کڑواہٹ ہے، ایک یمنی سفید اور ایک حجازی سیاہی کی طرف مائل؛ جلا دینے والا، نظر کو تیز کرتا ہے اور پھیپھڑے، گردے اور مثانے کو فائدہ دیتا ہے، اونٹنی کے دودھ کے ساتھ استسقا میں مفید ہے اور دوسری شکروں کی طرح پیاس نہیں لگاتا، اور معدے اور جگر کے لیے اچھا ہے {cite:canon-ibn-sina-print-v1 p.602}۔"
  es: "Sukkar al-ushar es en el libro un maná que cae del árbol ushar como trozos de sal, con un poco de astringencia y amargor junto con su dulzura, una variedad blanca yemení y una variedad hijazi que tiende al negro; purifica, agudiza la vista y ayuda a los pulmones, riñones y vejiga, es útil para la hidropesía con leche de camella y no causa sed como los otros azúcares, y es bueno para el estómago y el hígado {cite:canon-ibn-sina-print-v1 p.602}."
  fr: "Le Sukkar al-ushar est décrit dans le livre comme une manne tombant sur l'arbre ushar comme des morceaux de sel, avec un peu d'astringence et d'amertume en plus de sa douceur, une variété blanche yéménite et une variété du Hedjaz virant au noir; purifiant, il aiguise la vue et aide les poumons, les reins et la vessie, est utile contre l'hydropisie avec le lait de chamelle et ne provoque pas la soif comme les autres sucres, et est bon pour l'estomac et le foie {cite:canon-ibn-sina-print-v1 p.602}."
  tr: "Kitaptaki on şeker, tuz parçaları gibi on ağacında bulunur. Biraz acı ve acılık ile tatlılık içerir; bazıları Yamani beyazı, bazıları Hijazi ile siyah arasındadır. Görüşü sınırlayan berraklıktır ve akciğerler, böbrekler ile mesaneye faydalıdır. Deve sütüyle damlamasından faydalıdır ve diğer şeker türleri gibi susuzluk yapmaz. Mide ve karaciğer için iyidir {cite:canon-ibn-sina-print-v1 s.602}."
  id: "Gula sepuluh dalam buku ini ditemukan pada pohon sepuluh seperti potongan garam. Mengandung sedikit kepahitan dan kepahitan bersama dengan manis, beberapa berwarna putih Yamani dan beberapa berwarna Hijazi hitam. Ini adalah kejernihan yang membatasi penglihatan dan bermanfaat bagi paru-paru, ginjal, dan kandung kemih. Ini bermanfaat dari tetesan susu unta dan tidak menyebabkan haus seperti jenis gula lainnya. Baik untuk lambung dan hati {cite:canon-ibn-sina-print-v1 hlm.602}."
