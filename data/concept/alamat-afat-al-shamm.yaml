id: concept/alamat-afat-al-shamm
class: concept
kind: scientific
label:
  ar: علامات آفة الشم
  en: The signs of the disorder of smell
  fr: "Les signes du trouble de l’odorat"
  ur: شمّ کی آفت کی علامات
summary:
  ar: إذا فقد الإنسان الروائح وكان سيلان الفضول جارياً على العادة فلا سدة في المصفاة، وإن امتنع نفوذ النفس في الأنف مع غنة في الكلام فهناك سدة غائرة، وإن كان السيلان على العادة ولا سدة فضعف في الشم ونقصان، وإن وجد ريح عفونة واستنشق نتناً فخلط متعفن في بعض هذه المواضع؛ وإذا اشتم في الأمراض الحادة روائح غير معتادة لا عن شيء حاضر كرائحة السمك أو الطين المبلول أو السمن ومعها علامات رديئة فالموت مظلّ ⁦(كما طبعت)⁩ {cite:canon-ibn-sina-print-v2 p.235} {cite:canon-ibn-sina-print-v2 p.236}
  en: If a man loses odours while the catarrhal flow runs as usual, there is no occlusion in the sieve; if breath cannot pass the nose and speech is nasal, there is a deep occlusion; if the flow is normal and there is no occlusion, it is a weakness and lessening of smell; if he finds a smell of putrefaction and inhales foulness, a putrid humour is in one of these places. If in acute diseases he smells unfamiliar odours from nothing present — like fish, wet clay or fat — with bad signs attending, death is to be feared ⁦(as printed)⁩ {cite:canon-ibn-sina-print-v2 p.235} {cite:canon-ibn-sina-print-v2 p.236}
  fr: "Si un homme perd les odeurs alors que l’écoulement catarrhal suit son cours habituel, il n’y a pas d’obstruction dans le crible ; si le souffle ne peut passer par le nez et que la parole est nasillarde, il y a une obstruction profonde ; si l’écoulement est normal et qu’il n’y a pas d’obstruction, c’est une faiblesse et une diminution de l’odorat ; s’il perçoit une odeur de putréfaction et respire une puanteur, une humeur putride se trouve en l’un de ces lieux. Si, dans les maladies aiguës, il sent des odeurs inhabituelles ne provenant de rien de présent, comme celles du poisson, de l’argile mouillée ou de la graisse, et que de mauvais signes les accompagnent, la mort est à craindre ⁦(tel qu’imprimé)⁩ {cite:canon-ibn-sina-print-v2 p.235} {cite:canon-ibn-sina-print-v2 p.236}"
  ur: اگر انسان بو محسوس نہ کرے مگر فضول کا بہاؤ معمول کے مطابق ہو تو چھالنی میں سدہ نہیں؛ اگر سانس ناک سے نہ گزرے اور بولی میں گن گن ہو تو گہری سدہ ہے؛ اگر بہاؤ معمول پر ہو اور سدہ نہ ہو تو شمّ میں کمزوری و کمی ہے؛ اور اگر سڑان کی بو اور بدبو محسوس کرے تو ان مقامات میں سے کہیں سڑا ہوا خلط ہے؛ اور اگر شدید امراض میں بغیر موجود شے کے غیر معمولی بو محسوس کرے — مچھلی، بھیگی مٹی یا روغن جیسی — اور ساتھ بری علامتیں ہوں تو موت کا خدشہ ہے ⁦(جیسا چھپا ہے)⁩ {cite:canon-ibn-sina-print-v2 p.235} {cite:canon-ibn-sina-print-v2 p.236}
