id: concept/bayt-al-mamur
class: concept
kind: belief
label:
 ar: البيت المعمور
 en: Al-Bayt al-Ma'mur
 ur: بیت المعمور
summary:
 ar: "بيت في السماء السابعة بحذاء الكعبة يدخله كل يوم سبعون ألف ملك يصلون فيه ثم لا يعودون إليه أبداً، رآه النبي ليلة المعراج وإليه أسند إبراهيم ظهره {cite:sahih-al-bukhari} {cite:sahih-muslim}."
 en: "A house in the seventh heaven directly above the Ka'ba; seventy thousand angels enter it daily to pray and never return. The Prophet saw it on the Night of the Ascent, with Ibrahim leaning his back against it {cite:sahih-al-bukhari} {cite:sahih-muslim}."
 ur: "ساتویں آسمان پر ایک گھر جو کعبہ کے بالکل اوپر ہے؛ روزانہ ستر ہزار فرشتے اس میں داخل ہو کر نماز پڑھتے ہیں اور پھر کبھی نہیں لوٹتے۔ نبی نے اسے معراج کی رات دیکھا اور ابراہیم اس سے کمر لگائے تھے {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
