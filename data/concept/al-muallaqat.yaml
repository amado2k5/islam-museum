tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "المعلقات: السبع والعشر وشعراؤها"
  en: "The Mu'allaqat: the seven, the ten and their poets"
  ur: "معلقات: سات، دس اور ان کے شاعر"
  fr: "Les Mu'allaqat : les sept, les dix et leurs poètes"
  es: "Las Mu'allaqat: las siete, las diez y sus poetas"
  tr: "Mu'allaqat: Yedi ve On ve Şairleri"
  id: "Mu'allaqat: Tujuh dan Sepuluh serta Para Penyair"
summary:
  ar: "سبعة شعراء تعرضهم رواية المعلقات السبع كما نقلها ابن عبد ربه وشرحها الزوزني، وثلاثة آخرون تضمهم روايات المعلقات العشر، مع قبيلة كل شاعر وتاريخه التقريبي كما يجدولها ملخص بحثي قُدّم إلى المتحف {cite:britannica-al-muallaqat}."
  en: "The seven poets of the Mu'allaqat as transmitted by Ibn Abd Rabbih and commented on by al-Zawzani, and the three more added in the ten-ode recensions, each with tribe and approximate date as a research summary supplied to the museum tabulates them {cite:britannica-al-muallaqat}."
  ur: "معلقات کی روایت کے سات شاعر جیسے ابن عبد ربہ نے نقل کیے اور زوزنی نے شرح کی، اور دس قصیدوں کی روایتوں کے تین مزید شاعر، ہر ایک کے قبیلے اور تخمینی زمانے کے ساتھ جیسا میوزیم کو دیا گیا تحقیقی خلاصہ جدول بناتا ہے {cite:britannica-al-muallaqat}۔"
  fr: "Les sept poètes des Mu'allaqat tels que transmis par Ibn Abd Rabbih et commentés par al-Zawzani, et les trois autres ajoutés dans les recensions à dix odes, chacun avec sa tribu et sa date approximative comme les tabule une synthèse de recherche remise au musée {cite:britannica-al-muallaqat}."
  es: "Los siete poetas de las Mu'allaqat tal como los transmitió Ibn Abd Rabbih y los comentó al-Zawzani, y los tres añadidos en las recensiones de diez odas, cada uno con su tribu y fecha aproximada como los tabula un resumen de investigación entregado al museo {cite:britannica-al-muallaqat}."
  tr: "Yedi şaire, İbn Abd Rabbih tarafından aktarılan ve Al-Zevzani tarafından açıklanan Yedi Muallaqat romanı ile sunulur; üç şair ise on Muallaqat anlatısına dahil edilir; her şairin kabilesi ve yaklaşık tarihi müzeye sunulan bir araştırma özetinde listelenmiştir {cite:britannica-al-muallaqat}."
  id: "Tujuh penyair diperkenalkan dengan novel Tujuh Muallaqat, yang dinarasikan oleh Ibn Abd Rabbih dan dijelaskan oleh Al-Zawzani; tiga penyair termasuk dalam sepuluh narasi Muallaqat; suku dan sejarah perkiraan masing-masing penyair dicantumkan dalam ringkasan penelitian yang disajikan ke museum {cite:Britannica-al-muallaqat}."
