label:
  ar: "الزبل"
  en: "Zibl (dung)"
  ur: "زبل ⁦(گوبر اور فضلات)⁩"
  es: "Zibl (estiércol)"
  fr: "Zibl (fumier)"
  tr: "gübre"
  id: "pupuk"
summary:
  ar: "الزبل يختلف باختلاف الحيوان؛ زبل البط مفرط الحرارة فقلما يُستعمل، وزبل الحمام أسخن الأزبال المستعملة، وبعر الماعز الجبلي يُستعمل على كل سيلان دم، وفيه منافع للعين والأذن والصدر والمفاصل والقولنج؛ وتُذكر فيه أيضاً منافع للحمل والطمث تُعرض على الحكم. {cite:canon-ibn-sina-print-v1 p.467}"
  en: "Dung differs with the animal. Duck dung is too hot to be used, pigeon dung is the hottest in use, and wild goat dung is used on every flow of blood. Dungs are used for the eyes, ears, chest, joints and colic; the book also records uses touching the womb, the menses and conception, which are listed for the founder's ruling. {cite:canon-ibn-sina-print-v1 p.467}"
  ur: "گوبر جانور کے لحاظ سے مختلف ہوتا ہے؛ بطخ کا گوبر بہت گرم ہے اس لیے کم استعمال ہوتا ہے، کبوتر کا گوبر استعمال ہونے والے گوبروں میں سب سے گرم ہے، اور پہاڑی بکری کا گوبر ہر طرح کے خون کے بہاؤ پر استعمال ہوتا ہے۔ آنکھ، کان، سینے، جوڑوں اور قولنج کے لیے گوبر کام آتے ہیں؛ کتاب رحم، حیض اور حمل سے متعلق استعمالات بھی درج کرتی ہے جو بانیِ ادارہ کے فیصلے کے لیے درج کیے گئے ہیں۔ {cite:canon-ibn-sina-print-v1 p.467}"
  es: "El estiércol varía según el animal. El estiércol de pato es demasiado caliente para usarse, el de paloma es el más caliente y el de cabra montesa se usa para cualquier hemorragia. Los estiércoles se usan para los ojos, oídos, pecho, articulaciones y cólicos; el libro también registra usos relacionados con el útero, la menstruación y la concepción, que se enumeran para la regla del fundador. {cite:canon-ibn-sina-print-v1 p.467}"
  fr: "L'usage des excréments varie selon l'animal. Les excréments de canard sont trop chauds pour être utilisés, ceux de pigeon sont les plus chauds et les plus utilisés, tandis que ceux de chèvre sauvage sont employés en cas de saignement. Les excréments sont utilisés pour les yeux, les oreilles, la poitrine, les articulations et les coliques; le livre mentionne également des usages liés à l'utérus, aux menstruations et à la conception, qui sont consignés dans la décision du fondateur. {cite:canon-ibn-sina-print-v1 p.467}"
  tr: "Hayvana göre gübrenin içeriği değişir; ördek gübresi son derece sıcaktır ve bu nedenle nadiren kullanılır, güvercin gübresi en sıcak gübredir ve dağ keçisi gübresi her türlü kanama için kullanılır. Ayrıca gözler, kulaklar, göğüs, eklemler ve kolik için de faydaları olduğu söylenir. Hamilelik ve adet dönemleri için de faydaları olduğu belirtilir, ancak bunlar bir hakime danışılmalıdır. {cite:canon-ibn-sina-print-v1 s.467}"
  id: "Kotoran hewan bervariasi tergantung jenis hewannya; kotoran bebek sangat panas dan karena itu jarang digunakan, kotoran merpati adalah kotoran terpanas yang digunakan, dan kotoran kambing gunung digunakan untuk semua jenis pendarahan. Konon juga bermanfaat untuk mata, telinga, dada, persendian, dan kolik. Manfaat untuk kehamilan dan menstruasi juga disebutkan, tetapi hal ini harus dirujuk kepada hakim. {cite:canon-ibn-sina-print-v1 p.467}"
