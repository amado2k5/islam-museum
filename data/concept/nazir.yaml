id: concept/nazir
class: concept
kind: legal
label: { ar: "النَّاظِر (ناظر الوقف)", en: "The supervisor of an endowment (nazir)", ur: "ناظر (وقف کا نگران)" }
summary:
  ar: "الناظر على الوقف في اصطلاح الفقهاء هو الذي يلي الوقف وحفظه وحفظ ريعه وتنفيذ شرط واقفه. ويفترق عن القيم الذي يعينه الحاكم لتنفيذ الوصايا وأمر المحجورين، وعن المتولي الذي فوض إليه التصرف في مال الوقف، فهذه الألفاظ متقاربة عند ابن عابدين، والوصي أعم من الناظر. وأحكام الناظر، من يعينه وشروطه وصلاحياته وعزله وتعدده، تفصل في مصطلح الوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15437}"
  en: "A nazir of an endowment, in the jurists' usage, is the one who manages the endowment, guards it and its yield, and carries out the stipulations of the founder. He differs from the qayyim, appointed by the judge to carry out bequests and manage the affairs of minors and the insane, and from the mutawalli, to whom the disposal of the endowment's property is entrusted; Ibn Abidin treats these as one in usage. The wasi is wider than the nazir. The rules on who appoints him, his conditions, powers, removal and plurality are treated under the entry on endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15437}"
  ur: "وقف کا ناظر وہ شخص ہے جو وقف کی دیکھ بھال، اس کی آمدنی کی حفاظت اور واقف کی شرط پوری کرنے کا ذمہ دار ہو۔ وصی اس سے وسیع ہے۔ تفصیلی احکام وقف کے مضمون میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15436} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15437}"
