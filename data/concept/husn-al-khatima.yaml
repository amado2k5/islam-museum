id: concept/husn-al-khatima
class: concept
kind: doctrine
label:
  ar: "حسن الخاتمة"
  en: "A good ending (husn al-khatima)"
  ur: "حسنِ خاتمہ"
summary:
  ar: "يتناول الشيخ عمر عبد الكافي في درسه حسن الخاتمة وسوءها، ويقول إن الناس يموتون على ما عاشوا عليه ويُبعثون على ما ماتوا عليه {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:23:30}. ويذكر أن أبا حامد الغزالي أفرد باباً لحسن الخاتمة وسوئها {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:30}. ويحكي أمثلة لمن جرى على لسانه عند النزع ما اعتاد عليه في حياته، كمطربة وصاحب مزادات ولاعب شطرنج (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:23:00}."
  en: "In his lesson Sheikh Omar Abdelkafy takes up good and bad endings of life, and says that people die on what they lived by and are raised on what they died on {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:23:30}. He mentions that Abu Hamid al-Ghazali devoted a chapter to good and bad endings {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:30}. He tells of people on whose tongues, in the death throes, came what they were used to in life, such as a singer, an auctioneer and a chess player (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:23:00}."
  ur: "شیخ عمر عبد الکافی اپنے درس میں اچھے اور برے خاتمے پر بات کرتے ہیں اور کہتے ہیں کہ لوگ اسی حال پر مرتے ہیں جس پر وہ جیتے رہے اور اسی حال پر اٹھائے جاتے ہیں جس پر مرے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:23:30}۔ وہ ذکر کرتے ہیں کہ ابو حامد غزالی نے اچھے اور برے خاتمے کے لیے ایک باب مخصوص کیا {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:30}۔ وہ ایسے لوگوں کی مثالیں بیان کرتے ہیں جن کی زبان پر جان کنی کے وقت وہی آیا جس کے وہ زندگی میں عادی تھے، جیسے ایک گلوکارہ، ایک نیلامی کرنے والا اور ایک شطرنج کھیلنے والا (needs_source) {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:00} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:22:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep09 00:23:00}۔"
