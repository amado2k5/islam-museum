label: { ar: "الانعزال", en: "Inizal (the ceasing of an office when its holder loses qualification)", es: "Inizal (el cese de un cargo cuando su titular pierde la cualificación)", fr: "Inizal (cessation d'une fonction lorsque son titulaire perd ses qualifications)" }
summary:
  ar: "الانعزال انفعال من العزل، والعزل فصل الشيء عن غيره، وعند الفقهاء خروج ذي الولاية عما كان له من حق التصرف، وقد يكون بالعزل، وقد يكون حكميا كانعزال المرتد والمجنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} والأصل أن من تولى عملا بأهلية معينة أو شروط خاصة ثم فقد الأهلية أو شرطا أساسيا من شروطه ينعزل حكما دون حاجة إلى عزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} ويفارق ذلك استحقاق العزل، وهو أن يرتكب ذو الولاية ما يوجب العزل، كفسق القاضي أو حكمه بالهوى أو أخذه الرشوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  en: "Inizal is the passive form of the verb for dismissal (azl), which is separating one thing from another; in fiqh it is the loss by a holder of authority of his right to act. It may come through dismissal or by operation of law, as with the apostate or the insane. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} The principle is that one who takes an office by a fixed competence or specific conditions, and then loses that competence or an essential condition, is dismissed by law without need of a decision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} This differs from the entitlement to dismissal (istihqaq al-azl), which arises when the holder commits what requires his removal, such as a judge who is corrupt, rules by whim or takes bribes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  es: "Inizal es la forma pasiva del verbo de destitución (azl), que es separar una cosa de otra; en fiqh es la pérdida por parte de quien ostenta una autoridad de su derecho a actuar. Puede ocurrir por destitución o por aplicación de la ley, como en el caso del apóstata o el demente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} El principio es que quien asume un cargo por una competencia fija o condiciones específicas, y luego pierde esa competencia o una condición esencial, es destituido por ley sin necesidad de una decisión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} Esto difiere del derecho a la destitución (istihqaq al-azl), que surge cuando quien lo ostenta comete una falta que requiere su remoción, como un juez corrupto, que gobierna por capricho o acepta sobornos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  fr: "Inizal est la forme passive du verbe « démission » (azl), qui signifie séparer une chose d'une autre; en fiqh, il s'agit de la perte, pour un détenteur d'autorité, de son droit d'agir. Cette perte peut résulter d'une destitution ou d'une décision de justice, comme dans le cas de l'apostat ou de la personne atteinte de troubles mentaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} Le principe est que celui qui accède à une fonction par une compétence fixe ou des conditions spécifiques, et qui perd ensuite cette compétence ou une condition essentielle, est destitué de plein droit, sans qu'une décision soit nécessaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} Ceci diffère du droit à la destitution (istihqaq al-azl), qui naît lorsque le titulaire commet un acte justifiant sa révocation, comme un juge corrompu, qui rend des décisions arbitraires ou qui accepte des pots-de-vin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
