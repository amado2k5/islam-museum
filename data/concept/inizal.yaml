id: concept/inizal
class: concept
kind: legal
label: { ar: "الانعزال", en: "Inizal (the ceasing of an office when its holder loses qualification)" }
summary:
  ar: "الانعزال انفعال من العزل، والعزل فصل الشيء عن غيره، وعند الفقهاء خروج ذي الولاية عما كان له من حق التصرف، وقد يكون بالعزل، وقد يكون حكميا كانعزال المرتد والمجنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} والأصل أن من تولى عملا بأهلية معينة أو شروط خاصة ثم فقد الأهلية أو شرطا أساسيا من شروطه ينعزل حكما دون حاجة إلى عزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} ويفارق ذلك استحقاق العزل، وهو أن يرتكب ذو الولاية ما يوجب العزل، كفسق القاضي أو حكمه بالهوى أو أخذه الرشوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
  en: "Inizal is the passive form of the verb for dismissal (azl), which is separating one thing from another; in fiqh it is the loss by a holder of authority of his right to act. It may come through dismissal or by operation of law, as with the apostate or the insane. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} The principle is that one who takes an office by a fixed competence or specific conditions, and then loses that competence or an essential condition, is dismissed by law without need of a decision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509} This differs from the entitlement to dismissal (istihqaq al-azl), which arises when the holder commits what requires his removal, such as a judge who is corrupt, rules by whim or takes bribes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3509}"
