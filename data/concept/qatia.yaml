label: { ar: "القطيعة", en: "Qati'a (Land Grant)" }
summary:
  ar: "القطيعة في البصرة والسواد أرض يقطعها السلطان أو الوالي لرجل فيحييها ويستخرجها؛ وكان زياد بن أبي سفيان يقطع الرجل القطيعة ويدعه سنتين فإن عمرها وإلا أخذها منه وكان يقول إني لا أنفذ إلا ما عمر تم؛ وأول من قلع العثم بالبصرة زياد وأقطع الناس في القرى التي مات أهلها بأيام الأجناد والسباخ؛ وبلغت قطائع بعض الأمراء آلاف الجرابيب كقطيعة هلال بن أحوز ثمانية آلاف جريب وقطيعة عبد الله بن عمير ثمانية آلاف؛ ومسح مساحو المنصور قطيعة آل أبي بكرة ذات المائة جريب فإذا هي ألف فأقروا في أيديهم مائة وقبضوا الباقي."
  en: "The qati'a in Basra and the Sawad: land the ruler grants a man to reclaim and cultivate — Ziyad would grant a tract, allow two years, then seize it if unimproved ('I execute only what is brought to life'); he was the first to clear the thorn-land and grant folk the villages emptied by the plagues and the salt-flats. Grants ran to thousands of jarib — Hilal ibn Ahwaz's eight thousand, Ibn Umayr's eight thousand — and al-Mansur's surveyors, measuring the Abu Bakra family's hundred-jarib holding at a thousand, left them their hundred and seized the rest."
