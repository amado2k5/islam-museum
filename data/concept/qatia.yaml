label: { ar: "القطيعة", en: "Qati'a (Land Grant)", es: "Qati'a (Concesión de tierras)", fr: "Qati'a (Concession de terres)" }
summary:
  ar: "القطيعة في البصرة والسواد أرض يقطعها السلطان أو الوالي لرجل فيحييها ويستخرجها؛ وكان زياد بن أبي سفيان يقطع الرجل القطيعة ويدعه سنتين فإن عمرها وإلا أخذها منه وكان يقول إني لا أنفذ إلا ما عمر تم؛ وأول من قلع العثم بالبصرة زياد وأقطع الناس في القرى التي مات أهلها بأيام الأجناد والسباخ؛ وبلغت قطائع بعض الأمراء آلاف الجرابيب كقطيعة هلال بن أحوز ثمانية آلاف جريب وقطيعة عبد الله بن عمير ثمانية آلاف؛ ومسح مساحو المنصور قطيعة آل أبي بكرة ذات المائة جريب فإذا هي ألف فأقروا في أيديهم مائة وقبضوا الباقي."
  en: "The qati'a in Basra and the Sawad: land the ruler grants a man to reclaim and cultivate — Ziyad would grant a tract, allow two years, then seize it if unimproved ('I execute only what is brought to life'); he was the first to clear the thorn-land and grant folk the villages emptied by the plagues and the salt-flats. Grants ran to thousands of jarib — Hilal ibn Ahwaz's eight thousand, Ibn Umayr's eight thousand — and al-Mansur's surveyors, measuring the Abu Bakra family's hundred-jarib holding at a thousand, left them their hundred and seized the rest."
  es: "Las qati'a en Basora y el Sawad: tierras que el gobernante concede a un hombre para que las recupere y cultive. Ziyad concedía una extensión de tierra, le daba dos años y luego la confiscaba si no se mejoraba (\"Solo ejecuto lo que se cultiva\"). Fue el primero en desbrozar la tierra espinosa y conceder a la gente las aldeas deshabitadas por las plagas y las salinas. Las concesiones ascendían a miles de jarib (ocho mil para Hilal ibn Ahwaz, ocho mil para Ibn Umayr), y los agrimensores de al-Mansur, al medir la propiedad de cien jarib de la familia Abu Bakra en mil, les dejaron sus cien y confiscaron el resto."
  fr: "Les qati'a à Bassora et dans le Sawad: terres que le souverain concède à un homme pour qu'il les défriche et les cultive. Ziyad accordait une parcelle, laissait deux ans, puis la reprenait si elle n'était pas mise en valeur (« Je ne fais pousser que ce qui est cultivé »). Il fut le premier à défricher les terres infestées d'épines et à distribuer aux populations les villages vidés par les épidémies et les marais salants. Les concessions s'étendaient sur des milliers de jaribs – huit mille pour Hilal ibn Ahwaz, huit mille pour Ibn Umayr – et les arpenteurs d'al-Mansur, estimant la propriété de la famille Abu Bakra à mille jaribs, leur laissèrent leurs cent jaribs et s'emparèrent du reste."
