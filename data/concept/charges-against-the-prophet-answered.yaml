      en: "Sha'rawi holds that the charges contradict themselves, citing 'By the grace of your Lord you are not a madman' and 'It is the word of a noble messenger' {cite:tafsir-sharawi-khawatir-scan p.23} {cite:tafsir-sharawi-khawatir-scan p.24}."
