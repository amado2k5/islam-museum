id: concept/charges-against-the-prophet-answered
class: concept
kind: doctrine
label: { ar: "الاتهامات الموجهة إلى النبي والرد عليها في تفسير الشعراوي", en: "Charges against the Prophet and the answers in Sha'rawi's commentary" }
summary:
  ar: "يعرض الشعراوي حجج القرآن على أن النبي لم يكن من أهل الشعر والخطابة قبل البعثة، وأنه أمي لا يقرأ ولا يكتب، ثم يذكر ما نسبه المعارضون إليه من السحر والجنون والشعر والكهانة، ويرد على كل منها بالمنطق والآيات: فالمسحور لا يسحر من يتحداه، والجنون لا يثبت له خلق عظيم، والشعر لا تأتي الملكة فيه فجأة، والكاهن ينسى ويتخبط، والنبي يتلو ما نزل عليه دون تغيير {cite:tafsir-sharawi-khawatir-scan p.20} {cite:tafsir-sharawi-khawatir-scan p.21} {cite:tafsir-sharawi-khawatir-scan p.23} {cite:tafsir-sharawi-khawatir-scan p.24}. هذه حجج الشعراوي ويُنسب إليه ترتيبها، ولم تُعرض بعد الروايات التاريخية والدراسات الحديثة عن هذه الاتهامات."
  en: "Sha'rawi sets out the Quran's argument that the Prophet had no reputation for poetry or oratory before his mission and was unlettered, then takes the charges reported against him (sorcery, madness, poetry, soothsaying) and answers each with reasoning and verses. A bewitched man cannot resist a sorcerer whom he claims to fear, a madman cannot be consistently of noble character, a gift for poetry does not appear suddenly at forty, and a soothsayer forgets and contradicts himself, while the Prophet recited what was revealed without changing a letter {cite:tafsir-sharawi-khawatir-scan p.20} {cite:tafsir-sharawi-khawatir-scan p.21} {cite:tafsir-sharawi-khawatir-scan p.23} {cite:tafsir-sharawi-khawatir-scan p.24}. The ordering of these arguments is attributed to Sha'rawi; the historical reports and modern studies of these charges are not yet presented."
