id: concept/mi-sam
class: concept
kind: legal
label:
  ar: المِعْصَم
  en: Mi'sam (the wrist)
  ur: معصم ⁦(کلائی)⁩
  es: "Mi'sam (la muñeca)"
  fr: "Mi'sam (le poignet)"
  tr: "Bilek"
  id: "Pergelangan tangan"
summary:
  ar: "المعصم في اللغة موضع السوار من الساعد، وهو مفصل الكف من الساعد، ولا يخرج المعنى الاصطلاحي عن اللغوي. يجب غسله في الوضوء، ويُقطع منه اليد في السرقة والحرابة عند جمهور الفقهاء، ويقتصّ الشافعية بالقطع من المعصم عند القطع من الساعد، ولا خلاف في وجوب دية كاملة لقطع اليدين من المعصم ونصفها لقطع إحداهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14767}"
  en: "In the Kuwaiti encyclopedia's account the wrist (mi'sam) is the joint between the forearm and the palm, the place where a bracelet sits; the technical sense is the same as the lexical one. Its rulings concern washing in ablution, the cut in theft and banditry, retaliation for a severed hand, and the blood-money for a hand cut at the wrist. The page citations are given in the Arabic summary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14767}"
  ur: "کلائی ⁦(معصم)⁩ کا لغوی مفہوم وہ جوڑ ہے جہاں ہتھیلی بازو سے ملتی ہے، اور اصطلاحی مفہوم بھی یہی ہے۔ اس کے احکام وضو میں دھونے، چوری اور ڈاکے میں ہاتھ کاٹنے، قصاص اور دیت سے متعلق ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14767}"
  es: "En la enciclopedia kuwaití, la muñeca (mi'sam) es la articulación entre el antebrazo y la palma de la mano, donde se coloca una pulsera; el significado técnico es el mismo que el léxico. Sus normas se refieren al lavado durante la ablución, el corte en el robo y el bandidaje, la represalia por una mano amputada y la indemnización por una mano cortada a la altura de la muñeca. Las citas de las páginas se incluyen en el resumen en árabe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14767}"
  fr: "Dans l'encyclopédie koweïtienne, le poignet (mi'sam) est l'articulation entre l'avant-bras et la paume, l'endroit où se fixe un bracelet; le sens technique est identique au sens lexical. Ses règles concernent les ablutions rituelles, les blessures infligées lors de vols et de bandits, les représailles pour une main coupée et le prix du sang pour une main coupée au poignet. Les références bibliographiques figurent dans le résumé en arabe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14767}"
  tr: "Dilsel olarak, bilek bileklik yeridir ve avuç içi eklemi ön koldur. Teknik anlamı dilsel anlamdan sapmaz. Çoğu hukukçuya göre abdest alma sırasında yıkanmalıdır ve hırsızlık ya da soygun durumunda el kesilmelidir. Şafiiler, ön kol kesilirken bileğin kesildiğini savunur. Bileklerin kesilmesi için tam kan parası verilmesi, birinin kesilmesi için ise yarısı kesilmesi gerektiği konusunda bir anlaşmazlık yoktur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14767}"
  id: "Secara linguistik, pergelangan tangan adalah tempat gelang pergelangan tangan, dan merupakan sendi telapak tangan dari lengan bawah. Makna teknisnya tidak menyimpang dari makna linguistik. Pergelangan tangan harus dicuci saat wudhu, dan tangan harus dipotong dalam kasus pencurian dan perampokan menurut mayoritas ahli hukum. Syafi'i berpendapat bahwa pergelangan tangan dipotong saat memotong lengan bawah. Tidak ada perbedaan pendapat mengenai kewajiban membayar uang darah penuh untuk memotong pergelangan tangan dan setengahnya untuk memotong pergelangan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14767}"
