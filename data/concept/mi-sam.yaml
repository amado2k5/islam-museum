id: concept/mi-sam
class: concept
kind: legal
label:
  ar: المِعْصَم
  en: Mi'sam (the wrist)
  ur: معصم (کلائی)
summary:
  ar: "المعصم في اللغة موضع السوار من الساعد، وهو مفصل الكف من الساعد، ولا يخرج المعنى الاصطلاحي عن اللغوي. يجب غسله في الوضوء، ويُقطع منه اليد في السرقة والحرابة عند جمهور الفقهاء، ويقتصّ الشافعية بالقطع من المعصم عند القطع من الساعد، ولا خلاف في وجوب دية كاملة لقطع اليدين من المعصم ونصفها لقطع إحداهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14767}"
  en: "In the Kuwaiti encyclopedia's account the wrist (mi'sam) is the joint between the forearm and the palm, the place where a bracelet sits; the technical sense is the same as the lexical one. Its rulings concern washing in ablution, the cut in theft and banditry, retaliation for a severed hand, and the blood-money for a hand cut at the wrist. The page citations are given in the Arabic summary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14767}"
  ur: "کلائی (معصم) کا لغوی مفہوم وہ جوڑ ہے جہاں ہتھیلی بازو سے ملتی ہے، اور اصطلاحی مفہوم بھی یہی ہے۔ اس کے احکام وضو میں دھونے، چوری اور ڈاکے میں ہاتھ کاٹنے، قصاص اور دیت سے متعلق ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14767}"
