label: { ar: "الظرفاء والمغفلون", en: "The wits and the fools (zurafa and mughaffalun)", ur: "ظرفاء اور مغفلین", fr: "Les beaux esprits et les sots (zurafa et mughaffalun)", es: "Los ingeniosos y los necios (zurafa y mughaffalun)", tr: "Zeki ve aptal olanlar", id: "Yang pintar dan yang bodoh" }
summary:
  ar: "الظرفاء والمغفلون هم أبطال النوادر في التراث: الظريف صاحب الجواب الحاضر، والمغفل أو الأحمق الذي يُضحك بغفلته، ومعهما الطامع والطفيلي والبخيل. أشهرهم جحا أبو الغصن الذي يُضرب به المثل في الغفلة {cite:juha-nawadir-kubra-djuwaydi p. 4-5}، وأشعب بن جبير ظريف المدينة الذي يروي النويري أخباره {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}، ونصر الدين خوجة الذي ينسب إليه الأتراك أخبار جحا {cite:juha-nawadir-kubra-djuwaydi p. 6-8}. وفي كتب الحديث ذكر نعيمان في خبر عند البخاري {cite:sahih-al-bukhari 6775}."
  en: "The wits and the fools are the heroes of the anecdote tradition: the zarif with the ready answer, the mughaffal or fool who raises a laugh by his heedlessness, and beside them the greedy man, the party-crasher and the miser. The best known are Juha Abu al-Ghusn, proverbial for heedlessness {cite:juha-nawadir-kubra-djuwaydi p. 4-5}, Ash'ab ibn Jubayr, the wit of Medina whose reports al-Nuwayri tells {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}, and Nasreddin Hoca, to whom the Turks attribute the Juha stories {cite:juha-nawadir-kubra-djuwaydi p. 6-8}. In the hadith books Nu'ayman is named in a report in al-Bukhari {cite:sahih-al-bukhari 6775}."
  ur: "ظرفاء اور مغفلین تراث کے نوادر کے مرکزی کردار ہیں: ظریف جو حاضر جواب ہو، مغفل یا احمق جو اپنی غفلت سے ہنسائے، اور ان کے ساتھ لالچی، طفیلی اور بخیل۔ ان میں سب سے مشہور جحا ابو الغصن ہیں جن کی غفلت ضرب المثل ہے {cite:juha-nawadir-kubra-djuwaydi p. 4-5}، اشعب بن جبیر مدینہ کے ظریف جن کی خبریں نویری بیان کرتے ہیں {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}، اور نصر الدین خواجہ جن سے ترک جحا کی حکایات منسوب کرتے ہیں {cite:juha-nawadir-kubra-djuwaydi p. 6-8}۔ کتبِ حدیث میں نعیمان کا ذکر بخاری کی ایک خبر میں ہے {cite:sahih-al-bukhari 6775}۔"
  fr: "Les beaux esprits et les sots sont les héros de la tradition des anecdotes : le zarif à la repartie prompte, le mughaffal ou sot qui fait rire par son étourderie, et à leurs côtés le cupide, le pique-assiette et l'avare. Les plus connus sont Juha Abu al-Ghusn, proverbial pour son étourderie {cite:juha-nawadir-kubra-djuwaydi p. 4-5}, Ash'ab ibn Jubayr, le bel esprit de Médine dont al-Nuwayri rapporte les récits {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}, et Nasreddin Hoca, à qui les Turcs attribuent les histoires de Juha {cite:juha-nawadir-kubra-djuwaydi p. 6-8}. Dans les livres de hadith, Nu'ayman est nommé dans un récit d'al-Bukhari {cite:sahih-al-bukhari 6775}."
  es: "Los ingeniosos y los necios son los héroes de la tradición de las anécdotas: el zarif de respuesta pronta, el mughaffal o necio que hace reír por su descuido, y junto a ellos el codicioso, el gorrón y el avaro. Los más conocidos son Juha Abu al-Ghusn, proverbial por su descuido {cite:juha-nawadir-kubra-djuwaydi p. 4-5}, Ash'ab ibn Jubayr, el ingenioso de Medina cuyos relatos cuenta al-Nuwayri {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}, y Nasreddin Hoca, a quien los turcos atribuyen las historias de Juha {cite:juha-nawadir-kubra-djuwaydi p. 6-8}. En los libros de hadiz se nombra a Nu'ayman en un relato de al-Bujari {cite:sahih-al-bukhari 6775}."
  tr: "Zeki ve aptal, mirasta nadir hikayelerin kahramanlarıdır: şu anda cevabı veren esprili olan, cehaletine gülen aptal ya da aptal, açgözlü, parazit ve cimri olanlarla birlikte. Bunların en ünlüsü, dikkatsizliğiyle atasözü olan Juha Abu al-Ghusn'dur {alıntı:juha-nawadir-kubra-djuwaydi s. 4-5}, şehrin esprili adamı Ash'ab bin Jubayr, haberleri al-Nuwayri tarafından anlatılan {cite:nihayat-al-arab-nuwayri-vol4-scan s. 27-29}} ve Nasr al-Din Khoja, Türklerin Juha haberini ona atfettiği {cite:Juha-nawadir-kubra-djuwaydi s. 6-8}. Hadis kitaplarında Nu'eyman, al-Bukhari'nin bir raporunda anılır {cite:sahih-al-bukhari 6775}."
  id: "Yang cerdas dan yang bodoh adalah pahlawan dalam cerita langka dalam warisan: yang cerdas yang menjawab momen itu, yang bodoh menertawakan kebodohannya, atau yang bodoh, serakah, parasit, dan pelit. Yang paling terkenal adalah Juha Abu al-Ghusn, dikenal karena kecerobohannya {kutipan: juha-nawadir-kubra-djuwaydi hlm. 4-5}, pria cerdas kota Ash'ab bin Jubayr, yang beritanya diceritakan oleh al-Nuwayri {cite:nihayat-al-arab-nuwayri-vol4-scan hlm. 27-29}, dan Nasr al-Din Khoja, yang oleh orang Turki dikaitkan dengan berita Juha {cite:Juha-nawadir-kubra-djuwaydi hlm. 6-8}. Dalam kitab-kitab hadis, Nu'ayman disebutkan dalam laporan oleh al-Bukhari {cite:sahih-al-bukhari 6775}."
