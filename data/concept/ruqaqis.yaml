summary:
  ar: "الرقاقس في الكتاب قيل إنه دواء فارسي يشبه الثوم ملتو رأسه مشقق، ويذكر الكتاب نقلا موسوما أنه يزيد في المني جدا {cite:canon-ibn-sina-print-v1 pp.669-670}"
  en: "Ruqaqis is in the book said to be a Persian drug resembling garlic, twisted, its head split; and the book lists, as a labelled report, that it adds greatly to semen {cite:canon-ibn-sina-print-v1 pp.669-670}"
  ur: "رقاقس کتاب میں کہا گیا ہے کہ یہ ایک فارسی دوا ہے جو لہسن سے مشابہ ہے، مڑی ہوئی، اس کا سر پھٹا ہوا ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ یہ منی میں بہت اضافہ کرتا ہے {cite:canon-ibn-sina-print-v1 pp.669-670}۔"
  es: "En el libro se dice que el ruqaqis es una droga persa parecida al ajo, retorcida y con la cabeza partida; y el libro enumera, como un informe etiquetado, que aumenta considerablemente el semen {cite:canon-ibn-sina-print-v1 pp.669-670}."
  fr: "Le livre décrit le ruqaqis comme une drogue persane ressemblant à de l'ail, tordu et fendu; et le livre indique, sous forme de rapport légendé, qu'il augmente considérablement la qualité du sperme {cite:canon-ibn-sina-print-v1 pp.669-670}"
  tr: "Kitapta, Raqqların sarımsağa benzeyen, başı bükülmüş ve çatlamış bir Fars ilacı olduğu söylenir. Kitapta bir anlatımda meniyi büyük ölçüde artırdığı belirtilir {cite:canon-ibn-sina-print-v1 s.669-670}"
  id: "Dalam buku tersebut, Raqaq dikatakan sebagai obat Persia yang menyerupai bawang putih, dengan kepala yang terpelintir dan retak. Dalam sebuah narasi disebutkan bahwa obat ini sangat meningkatkan sperma {cite:canon-ibn-sina-print-v1 hlm.669-670}"
