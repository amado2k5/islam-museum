id: concept/lams-fiqh
class: concept
kind: legal
label:
  ar: "اللَّمْس"
  en: "Touch (lams), fiqh rulings"
  ur: "لمس (فقہی احکام)"
summary:
  ar: "اللمس في اللغة الجس والإدراك بظاهر البشرة كالمس، ويكنى به وبالملامسة عن الجماع، واللمس اصطلاحاً ملاقاة جسم لجسم لطلب معنى فيه كحرارة أو برودة أو علم حقيقة، والمس ملاقاة جسم لآخر على أي وجه كان، فاللمس أخص من المس؛ والمباشرة الإفضاء بالبشرتين، وتُكنى بها عن الجماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13703}."
  en: "Lams, in lexicon, is feeling and perceiving with the surface of the skin, like mass, and it is a euphemism for intercourse, as is mubashara, contact of skins. In law lams is the meeting of one body with another for a purpose such as warmth, cold, hardness, softness or knowledge of a thing's truth; mass is the meeting of two bodies in any way, so lams is narrower {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13703}."
  ur: "لمس لغت میں جسم کو چھونا اور ظاہری جلد کے ذریعے جاننا ہے، جیسے مس، اور جماع سے کنایہ بھی ہے، اور مباشرت بھی بشرتین کے ملنے کو کہتے ہیں؛ اصطلاح میں لمس کسی جسم کو دوسرے جسم سے کسی غرض سے ملانا ہے، جیسے گرمی، سردی، سختی، نرمی یا حقیقت جاننا؛ مس ہر طرح کے ملنے کو کہتے ہیں، اس لیے لمس مس سے خاص ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13703}۔"
