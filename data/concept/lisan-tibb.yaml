summary:
  ar: "اللسان في الكتاب عضو، جوهره مركب من لحم رخو تنفذ فيه عروق وعصب وعضل {cite:canon-ibn-sina-print-v1 p.543}."
  en: "In the book the tongue is an organ whose substance is a soft flesh run through by vessels, nerves and muscles {cite:canon-ibn-sina-print-v1 p.543}."
  ur: "کتاب میں زبان ایک عضو ہے جس کا جوہر نرم گوشت سے مرکب ہے اور اس میں رگیں، اعصاب اور پٹھے گزرتے ہیں {cite:canon-ibn-sina-print-v1 p.543}۔"
  es: "En el libro, la lengua es un órgano cuya sustancia es una carne blanda atravesada por vasos, nervios y músculos {cite:canon-ibn-sina-print-v1 p.543}."
  fr: "Dans le livre, la langue est un organe dont la substance est une chair molle parcourue de vaisseaux, de nerfs et de muscles {cite:canon-ibn-sina-print-v1 p.543}."
  tr: "Kitaptaki dil bir organdır; özü yumuşak etten oluşur ve damarlar, sinirler ve kaslar bu etten geçer {cite:canon-ibn-sina-print-v1 s.543}."
  id: "Lidah dalam buku ini adalah sebuah organ, esensinya terdiri dari daging lunak yang melalui mana pembuluh darah, saraf, dan otot menembus {cite:canon-ibn-sina-print-v1 hlm.543}."
