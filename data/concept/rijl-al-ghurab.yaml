summary:
  ar: "رجل الغراب في الكتاب أصل هذه الحشيشة إذا طبخ نفع من الإسهال المزمن، وذكر بولس وغيره أنه ينفع من القولنج أيضا ويعمل عمل السورنجان من غير مضرة {cite:canon-ibn-sina-print-v1 p.666}"
  en: "Rijl al-ghurab is in the book a herb whose root, when boiled, benefits chronic diarrhoea; Paulus and others mention that it also benefits colic and acts like surinjan without harm {cite:canon-ibn-sina-print-v1 p.666}"
  ur: "رجل الغراب کتاب میں ایک گھاس ہے جس کی جڑ پکائی جائے تو پرانے اسہال میں نافع ہے؛ پولس اور دوسروں نے ذکر کیا کہ یہ قولنج میں بھی نافع ہے اور بغیر نقصان کے سورنجان کا سا عمل کرتی ہے {cite:canon-ibn-sina-print-v1 p.666}۔"
  es: "En el libro, Rijl al-ghurab es una hierba cuya raíz, al hervirse, beneficia la diarrea crónica; Paulus y otros mencionan que también beneficia el cólico y actúa como surinjan sin causar daño {cite:canon-ibn-sina-print-v1 p.666}."
  fr: "Le Rijl al-ghurab est décrit dans le livre comme une plante dont la racine, bouillie, est bénéfique contre la diarrhée chronique; Paul et d’autres mentionnent qu’elle est également bénéfique contre les coliques et qu’elle agit comme le surinjan sans ses effets nocifs {cite:canon-ibn-sina-print-v1 p.666}"
  tr: "Kitaptaki Crowman's Man, bu haşişin kaynağının pişirildiğinde kronik ishal için faydalı olduğunu belirtir. Paul ve diğerleri, koliklere karşı da etkili olduğunu ve zararsız bir soringan olarak etkili olduğunu belirtmiştir {cite:canon-ibn-sina-print-v1 s.666}"
  id: "The Crowman's Man dalam buku tersebut menyatakan bahwa asal mula ganja ini, jika dimasak, bermanfaat untuk diare kronis. Paul dan lainnya menyebutkan bahwa ganja juga efektif melawan kolik dan bekerja sebagai soringan tanpa bahaya {cite:canon-ibn-sina-print-v1 hlm.666}"
