summary:
  ar: "يقسم ابن سينا القوى الطبيعية إلى خادمة ومخدومة، والمخدومة جنسان: جنس يتصرف في الغذاء لبقاء الشخص وفيه الغاذية والنامية، وجنس لبقاء النوع وفيه المولدة والمصورة {cite:canon-ibn-sina-print-v1 p.95}."
  en: "Ibn Sina divides the natural faculties into serving and served; the served are two genera: one governing food for the survival of the individual, with the nutritive and growing faculties, and one for the survival of the species, with the generative and moulding {cite:canon-ibn-sina-print-v1 p.95}."
