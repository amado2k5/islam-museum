id: concept/natural-faculties-served
class: concept
kind: scientific
label: { ar: "القوى الطبيعية المخدومة عند ابن سينا", en: "The served natural faculties in the Canon", ur: "قانون میں مخدوم طبعی قوتیں", es: "Las facultades naturales servidas en el Canon", fr: "Les facultés naturelles servies dans le Canon", tr: "İbn Sinna'nın hizmet ettiği doğal güçler", id: "Pasukan alam yang dilayani oleh Avicenna" }
summary:
  ar: "يقسم ابن سينا القوى الطبيعية إلى خادمة ومخدومة، والمخدومة جنسان: جنس يتصرف في الغذاء لبقاء الشخص وفيه الغاذية والنامية، وجنس لبقاء النوع وفيه المولدة والمصورة {cite:canon-ibn-sina-print-v1 p.95}."
  en: "Ibn Sina divides the natural faculties into serving and served; the served are two genera: one governing food for the survival of the individual, with the nutritive and growing faculties, and one for the survival of the species, with the generative and moulding {cite:canon-ibn-sina-print-v1 p.95}."
  es: "Ibn Sina divide las facultades naturales en servidas y servidas; las servidas son dos géneros: uno que gobierna el alimento para la supervivencia del individuo, con las facultades nutritiva y de crecimiento, y otro para la supervivencia de la especie, con las facultades generativa y de moldeo {cite:canon-ibn-sina-print-v1 p.95}."
  fr: "Ibn Sina divise les facultés naturelles en servant et servies; les servies sont deux genres: l'un régissant la nourriture pour la survie de l'individu, avec les facultés nutritives et de croissance, et l'autre pour la survie de l'espèce, avec les facultés génératives et de modelage {cite:canon-ibn-sina-print-v1 p.95}."
  ur: "ابن سینا نے قدرتی صلاحیتوں کو خدمت اور خدمت میں تقسیم کیا ہے۔ پیش کی جانے والی دو نسلیں ہیں: ایک فرد کی بقا کے لیے خوراک، غذائیت اور بڑھتی ہوئی صلاحیتوں کے ساتھ، اور ایک انواع کی بقا کے لیے، جنریٹیو اور مولڈنگ کے ساتھ۔"
  tr: "İbn Sina doğal güçleri hizmet ve hizmet edilen olarak ikiye ayırır ve hizmetkar iki türden oluşur: biri kişinin hayatta kalması için yiyeceği yönetir, diğeri cins ve geliştiriciyi içerir, diğeri ise cins ve görüntüyü içerir {cite:canon-ibn-sina-print-v1 s.95}."
  id: "Ibn Sina membagi kekuatan alam menjadi pelayan dan pelayan, dan pelayan terdiri dari dua jenis: satu yang mengelola makanan demi kelangsungan hidup seseorang, dan satu genus yang berisi genus dan pengembang, serta satu lagi yang memuat genus dan gambar {cite:canon-ibn-sina-print-v1 hlm.95}."
