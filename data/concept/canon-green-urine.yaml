id: concept/canon-green-urine
class: concept
kind: scientific
label:
  ar: "البول الأخضر عند ابن سينا"
  en: "Green urine in the Canon"
  fr: "Urine verte dans le Canon"
  ur: "سبز پیشاب قانون میں"
  es: "Orina verde en el cañón"
  tr: "İbn Sina'ya göre yeşil idrar"
  id: "Urin hijau menurut Avicenna"
summary:
  ar: "يعد ابن سينا طبقات الخضرة في البول من الفستقي إلى الكراثي ويبين دلالة كل منها، فالفستقي يدل على برد، والزنجاري والكراثي على احتراق شديد، والأخضر في الصبيان على تشنج {cite:canon-ibn-sina-print-v1 p.185}."
  en: "Ibn Sina lists the shades of green in urine from pistachio to leek and states what each shows: pistachio shows cold, verdigris and leek severe burning, and green urine in children shows spasm {cite:canon-ibn-sina-print-v1 p.185}."
  fr: "Ibn Sina classe les verts du pistache au poireau : pistache, froid ; vert-de-gris et poireau, combustion intense ; urine verte de l’enfant, spasme {cite:canon-ibn-sina-print-v1 p.185}."
  es: "Ibn Sina enumera los tonos de verde en la orina desde el pistacho hasta el puerro y afirma lo que muestra cada uno: el pistacho muestra frío, el cardenillo y el puerro ardor severo, y la orina verde en los niños muestra espasmos {cite:canon-ibn-sina-print-v1 p.185}."
  ur: "ابن سینا پستے سے لیکر تک پیشاب میں سبز رنگ کے رنگوں کی فہرست بناتا ہے اور بتاتا ہے کہ ہر ایک کیا ظاہر کرتا ہے: پستہ سردی، ورڈیگریس اور لیک میں شدید جلن کو ظاہر کرتا ہے، اور بچوں میں سبز پیشاب اینٹھن کو ظاہر کرتا ہے۔"
  tr: "İbn Sina, idrarda fıstıktan pırasaya kadar olan yeşillik katmanlarını sıralar ve her birinin anlamını açıklar: antep fıstığı soğuk, tahriş edici ve pırasa şiddetli yanmayı, erkek çocuklarda yeşil ise spazmı gösterir {cite:canon-ibn-sina-print-v1 s.185}."
  id: "Ibn Sina mencantumkan lapisan hijau dalam urine dari pistachio hingga daun bawang dan menjelaskan makna masing-masing: pistachio menunjukkan dingin, iritasi dan bawang daun menandakan terbakar parah, dan hijau pada anak laki-laki menunjukkan kejang {cite:canon-ibn-sina-print-v1 hlm.185}."
