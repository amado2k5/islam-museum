education:
  did_you_know:
    ar: "يرى أبو الوفا المراغي أن العمل واجب تدل عليه سلوك الأنبياء والصالحين: داود كان يعمل بالخوص، وإدريس خياطاً، وزكريا نجاراً، وموسى أجيراً."
    en: "Abu al-Wafa al-Maraghi holds work a duty shown by the conduct of prophets and the righteous: Dawud wove palm fronds, Idris was a tailor, Zakariyya a carpenter, Musa a hired hand."
    ur: "ابوالوفا مراغی کے نزدیک کام ایک واجب ہے جسے انبیا اور نیکوں کے طرزِ عمل سے ثابت کیا جا سکتا ہے: داؤد کھجور کے پتے بٹتے تھے، ادریس درزی، زکریا بڑھئی اور موسیٰ مزدور تھے۔"
