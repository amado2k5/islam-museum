label:
  ar: العمل في الإسلام
  en: Work in Islam
summary:
  ar: "يرى أبو الوفا المراغي أن العمل واجب، تدل عليه قواعد الإسلام وسلوك الأنبياء والصالحين {cite:min-qadaya-al-mal-wal-amal-azhar p. 14}. ويذكر أن داود كان يعمل بالخوص، وإدريس خياطًا، وزكريا نجارًا، وموسى أجيرًا {cite:min-qadaya-al-mal-wal-amal-azhar p. 14}. ويفرّق بين التوكل، وهو الاعتماد على الله بعد بذل الجهد، والتواكل الذي يعدّه عجزًا {cite:min-qadaya-al-mal-wal-amal-azhar p. 14}. ويقيّد العمل بحدود الشرع، فلا يمسّ حقوق الآخرين ولا يضرّ بمصالحهم {cite:min-qadaya-al-mal-wal-amal-azhar p. 16}. ويستشهد بحديث في كسب الرجل بعمل يده {cite:min-qadaya-al-mal-wal-amal-azhar p. 37}. وينبّه الكتاب في حاشيته إلى أن حديث «يد لا تمسها النار» الذي يُروى في فضل العمل موضوع عند بعض المحدثين، وهو يورده مع ذلك {cite:min-qadaya-al-mal-wal-amal-azhar p. 15}. يعرض المؤلف الترغيب في العمل وذم البطالة والسؤال، وأن الأعمال التي يحتاجها المسلمون فروض كفاية، والمعيار في اختيار العاملين الخبرة والأمانة، ويرى أن التخصص وتقسيم العمل ضرورة للإنتاج بحسب الاستعداد والتعاون بين الناس."
  en: "Al-Maraghi holds work to be a duty, shown by the rules of Islam and the conduct of prophets and the righteous (p. 14). He lists the trades of David, Idris, Zakariya and Musa (p. 14), and separates trust in God after striving (tawakkul) from passive dependence (tawakkul-less reliance), which he rejects (p. 14). Work is bounded by the law and must not violate others' rights (p. 16). The book's own footnote calls one hadith on the calloused hand fabricated, though it still cites it (p. 15). This is the author's reading."
