label:
  ar: العمل في الإسلام
  en: Work in Islam
  es: "Trabajo en el Islam"
  fr: "Travailler dans l'Islam"
  ur: "اسلام میں کام کریں۔"
  tr: "İslam'da Çalışmak"
  id: "Bekerja di bidang Islam"
summary:
  ar: "يرى أبو الوفا المراغي أن العمل واجب، تدل عليه قواعد الإسلام وسلوك الأنبياء والصالحين {cite:min-qadaya-al-mal-wal-amal-azhar p. 14}. ويذكر أن داود كان يعمل بالخوص، وإدريس خياطًا، وزكريا نجارًا، وموسى أجيرًا {cite:min-qadaya-al-mal-wal-amal-azhar p. 14}. ويفرّق بين التوكل، وهو الاعتماد على الله بعد بذل الجهد، والتواكل الذي يعدّه عجزًا {cite:min-qadaya-al-mal-wal-amal-azhar p. 14}. ويقيّد العمل بحدود الشرع، فلا يمسّ حقوق الآخرين ولا يضرّ بمصالحهم {cite:min-qadaya-al-mal-wal-amal-azhar p. 16}. ويستشهد بحديث في كسب الرجل بعمل يده {cite:min-qadaya-al-mal-wal-amal-azhar p. 37}. وينبّه الكتاب في حاشيته إلى أن حديث «يد لا تمسها النار» الذي يُروى في فضل العمل موضوع عند بعض المحدثين، وهو يورده مع ذلك {cite:min-qadaya-al-mal-wal-amal-azhar p. 15}. يعرض المؤلف الترغيب في العمل وذم البطالة والسؤال، وأن الأعمال التي يحتاجها المسلمون فروض كفاية، والمعيار في اختيار العاملين الخبرة والأمانة، ويرى أن التخصص وتقسيم العمل ضرورة للإنتاج بحسب الاستعداد والتعاون بين الناس."
  en: "Al-Maraghi holds work to be a duty, shown by the rules of Islam and the conduct of prophets and the righteous (p. 14). He lists the trades of David, Idris, Zakariya and Musa (p. 14), and separates trust in God after striving (tawakkul) from passive dependence (tawakkul-less reliance), which he rejects (p. 14). Work is bounded by the law and must not violate others' rights (p. 16). The book's own footnote calls one hadith on the calloused hand fabricated, though it still cites it (p. 15). This is the author's reading."
  es: "Al-Maraghi considera el trabajo un deber, como lo demuestran las normas del Islam y la conducta de los profetas y los justos (p. 14). Enumera los oficios de David, Idris, Zacarías y Moisés (p. 14) y distingue entre la confianza en Dios tras el esfuerzo (tawakkul) y la dependencia pasiva (confianza sin tawakkul), la cual rechaza (p. 14). El trabajo está sujeto a la ley y no debe violar los derechos de los demás (p. 16). La propia nota al pie del libro califica de inventado un hadiz sobre la mano callosa, aunque lo cita (p. 15). Esta es la interpretación del autor."
  fr: "Al-Maraghi considère le travail comme un devoir, comme en témoignent les préceptes de l'islam et la conduite des prophètes et des pieux (p. 14). Il cite les métiers de David, Idris, Zacharie et Moïse (p. 14) et distingue la confiance en Dieu après l'effort (tawakkul) de la dépendance passive (absence de tawakkul), qu'il rejette (p. 14). Le travail est encadré par la loi et ne doit pas empiéter sur les droits d'autrui (p. 16). L'ouvrage, dans une note de bas de page, qualifie de forgé un hadith relatif à la main calleuse, tout en le citant (p. 15). Il s'agit là de l'interprétation de l'auteur."
  ur: "المراثی کام کو ایک فرض سمجھتا ہے، جو اسلام کے احکام اور انبیاء اور صالحین کے طرز عمل سے ظاہر ہوتا ہے ⁦(صفحہ 14)⁩۔ وہ داؤد، ادریس، زکریا اور موسیٰ کی تجارتوں کی فہرست دیتا ہے ⁦(ص 14)⁩، اور کوشش ⁦(توکل)⁩ کے بعد خدا پر اعتماد کو غیر فعال انحصار ⁦(توکل سے کم بھروسہ)⁩ سے الگ کرتا ہے، جسے وہ مسترد کرتا ہے ⁦(ص 14)⁩۔ کام قانون کا پابند ہے اور اسے دوسروں کے حقوق کی خلاف ورزی نہیں کرنی چاہیے ⁦(ص 16)⁩۔ کتاب کے اپنے حاشیہ میں ایک حدیث کو ہاتھ سے من گھڑت کہا گیا ہے، حالانکہ وہ اب بھی اس کا حوالہ دیتی ہے ⁦(صفحہ 15)⁩۔ یہ مصنف کا پڑھنا ہے۔"
  tr: "Ebu el-Vafe el-Maraghi, İslam prensipleri, peygamberlerin ve salih insanların davranışlarıyla kanıtlandığı üzere, çalışmanın farz olduğuna inanır {kaynak:min-qadaya-al-mal-wal-amal-azhar s. 14}. Davud'un hurma dallarıyla, İdris'in terzilikle, Zekeriya'nın marangozlukla ve Musa'nın işçilikle çalıştığını belirtir {kaynak:min-qadaya-al-mal-wal-amal-azhar s. 14}. Çaba gösterdikten sonra Allah'a güvenmek anlamına gelen Allah'a tevekkül ile, bir tür çaresizlik olarak gördüğü kadercilik arasında ayrım yapar {kaynak:min-qadaya-al-mal-wal-amal-azhar s. 14}. Çalışmayı, başkalarının haklarını ihlal etmeyecek veya çıkarlarına zarar vermeyecek şekilde İslam hukukunun sınırları içinde tutar {kaynak:min-qadaya-al-mal-wal-amal-azhar s. 16}. Yazar, kendi emeğiyle geçimini sağlayan bir adam hakkında bir hadis aktarıyor (kaynak: min-qadaya-al-mal-wal-amal-azhar, s. 37). Kitabın dipnotunda, çalışmayı öven \"ateşin dokunmayacağı el\" hadisinin bazı hadis âlimleri tarafından uydurma olarak kabul edildiği, ancak yine de metne dahil edildiği belirtiliyor (kaynak: min-qadaya-al-mal-wal-amal-azhar, s. 15). Yazar, çalışmayı teşvik ediyor ve tembelliği ve dilenciliği kınıyor; Müslümanların ihtiyaç duyduğu işin toplumsal bir yükümlülük (farz-ı kifaye) olduğunu belirtiyor. İşçi seçiminde ölçütlerin deneyim ve güvenilirlik olduğunu, bireysel yeteneklere ve insanlar arasındaki işbirliğine dayalı uzmanlaşma ve iş bölümünün verimlilik için şart olduğunu savunuyor."
  id: "Abu al-Wafa al-Maraghi meyakini bahwa bekerja adalah wajib, sebagaimana dibuktikan oleh prinsip-prinsip Islam dan perilaku para nabi serta orang-orang saleh {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 14}. Ia menyebutkan bahwa Daud bekerja dengan pelepah kurma, Idris sebagai penjahit, Zakharia sebagai tukang kayu, dan Musa sebagai buruh {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 14}. Ia membedakan antara berserah kepada Allah, yaitu bergantung kepada Allah setelah berusaha, dan fatalisme, yang dianggapnya sebagai bentuk ketidakberdayaan {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 14}. Ia membatasi pekerjaan dalam batas-batas hukum Islam, sehingga tidak melanggar hak orang lain atau merugikan kepentingan mereka {cite:min-qadaya-al-mal-wal-amal-azhar hlm. 16}. Ia mengutip sebuah hadits tentang seorang pria yang mencari nafkah melalui kerja kerasnya sendiri {kutipan:min-qadaya-al-mal-wal-amal-azhar hlm. 37}. Buku ini mencatat dalam catatan kakinya bahwa hadits \"tangan yang tidak akan tersentuh api,\" yang diriwayatkan sebagai pujian terhadap kerja, dianggap palsu oleh sebagian ulama hadits, namun tetap dimasukkan dalam teks {kutipan:min-qadaya-al-mal-wal-amal-azhar hlm. 15}. Penulis mendorong kerja dan mengecam kemalasan dan mengemis, menyatakan bahwa kerja yang dibutuhkan oleh umat Islam adalah kewajiban bersama (fard kifayah). Ia berpendapat bahwa kriteria untuk memilih pekerja adalah pengalaman dan kepercayaan, dan bahwa spesialisasi dan pembagian kerja sangat penting untuk produktivitas, berdasarkan kemampuan individu dan kerja sama antar orang."
