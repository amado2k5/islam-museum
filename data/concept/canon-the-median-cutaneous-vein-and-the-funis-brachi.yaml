label: { ar: "الأكحل وحبل الذراع في الفصد عند ابن سينا", en: "The median cutaneous vein and the funis brachi in venesection in the Canon", ur: "قانون میں فصد میں اکحل اور حبل الذراع", es: "La vena cutánea media y el funis brachi en la flebotomía en el Canon", fr: "La veine cutanée médiane et le muscle brachial lors de la phlébographie dans le Canon", tr: "İbn Sina'ya göre flebitomada kohl ve kol bağı", id: "Kohl dan tali tangan pada phlebitoma menurut Ibn Sina" }
summary:
  ar: "يحذر ابن سينا من خطر العصب تحت الأكحل ويبين ما يفعل إن أصيب، ويذكر أن حبل الذراع الأصوب فيه الفصد المورب إلا إذا كان مراوغاً من الجانبين {cite:canon-ibn-sina-print-v1 p.294}."
  en: "Ibn Sina warns of the danger to the nerve beneath the median cutaneous vein and says what is done if it is struck, and says that the funis brachi is best opened obliquely unless it rolls from both sides {cite:canon-ibn-sina-print-v1 p.294}."
  es: "Ibn Sina advierte del peligro para el nervio debajo de la vena cutánea mediana y dice qué hacer si se golpea, y dice que el funis brachi se abre mejor oblicuamente a menos que se enrolle desde ambos lados {cite:canon-ibn-sina-print-v1 p.294}."
  fr: "Ibn Sina met en garde contre le danger pour le nerf situé sous la veine cutanée médiane et explique ce qu'il faut faire s'il est touché, et dit que le funis brachi est mieux ouvert obliquement à moins qu'il ne roule des deux côtés {cite:canon-ibn-sina-print-v1 p.294}."
  ur: "ابن سینا درمیانی جلد کی رگ کے نیچے اعصاب کے خطرے سے خبردار کرتے ہیں اور کہتے ہیں کہ اگر اس پر ضرب لگ جائے تو کیا کیا جائے، اور کہا کہ فنس بریچی کو ترچھا طور پر کھولا جاتا ہے جب تک کہ وہ دونوں اطراف سے نہ گھومے۔"
  tr: "İbn Sina, subaquin sinirinin tehlikesi konusunda uyarır ve yaralanırsa ne yapılması gerektiğini açıklar; kol kordonun, yan yana değilse fnea eğikliğinde daha doğru olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.294}."
  id: "Ibn Sina memperingatkan bahaya saraf subaquin dan menjelaskan apa yang harus dilakukan jika terluka, menyebutkan bahwa tali tangan lebih akurat jika phnea miring kecuali jika berada berdampingan {cite:canon-ibn-sina-print-v1 hlm.294}."
