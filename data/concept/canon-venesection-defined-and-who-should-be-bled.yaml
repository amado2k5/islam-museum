label: { ar: "تعريف الفصد ومن ينبغي أن يفصد عند ابن سينا", en: "Venesection defined and who should be bled in the Canon", ur: "قانون میں فصد کی تعریف اور کن کا فصد کھولا جائے", es: "Definición de flebotomía y quiénes deben ser sangrados según el canon", fr: "Définition de la saignée et des personnes devant en bénéficier selon le canon", tr: "Flebitomun Tanımı ve İbn Sina'ya göre Flebiti Kimde Olmalı", id: "Definisi Phlebitoma dan Siapa yang Harus Phlebitis menurut Ibn Sina" }
summary:
  ar: "يفتتح ابن سينا فصل الفصد بتعريفه استفراغاً كلياً يستفرغ الكثرة، ثم يحصر من ينبغي أن يفصد في نفسين، المتهيئ للأمراض والواقع فيها، ويعدد المستعدين لأمراض الدم، ويذكر أن ألوان بعضهم لا تدل على وجوب الفصد {cite:canon-ibn-sina-print-v1 pp.289-290}."
  en: "Ibn Sina opens the chapter on venesection by defining it as a general evacuation that drains plethora, then limits those to be bled to two kinds, the one prone to diseases and the one already in them, lists those prone to diseases of the blood, and notes that the complexion of some of them does not show that bleeding is due {cite:canon-ibn-sina-print-v1 pp.289-290}."
  es: "Ibn Sina abre el capítulo sobre la venesección definiéndola como una evacuación general que drena la plenitud, luego limita a los que deben ser sangrados a dos tipos, los propensos a enfermedades y los que ya las padecen, enumera a los propensos a enfermedades de la sangre y señala que la tez de algunos de ellos no muestra que se deba sangrar {cite:canon-ibn-sina-print-v1 pp.289-290}."
  fr: "Ibn Sina ouvre le chapitre sur la saignée en la définissant comme une évacuation générale qui draine la pléthore, puis limite ceux qui doivent être saignés à deux sortes, ceux sujets aux maladies et ceux qui en sont déjà atteints, énumère ceux sujets aux maladies du sang et note que le teint de certains d'entre eux ne montre pas que le saignement est dû {cite:canon-ibn-sina-print-v1 pp.289-290}."
  ur: "ابن سینا نے خون کے اخراج کے باب کو عام انخلاء کے طور پر بیان کرتے ہوئے کھولا ہے جو کہ بہتات کو ختم کرتا ہے، پھر خون بہنے والوں کو دو قسموں تک محدود کرتا ہے، ایک بیماریوں کا شکار اور وہ جو پہلے سے موجود ہیں، خون کی بیماریوں کے شکار افراد کی فہرست دیتا ہے، اور نوٹ کرتا ہے کہ ان میں سے بعض کی رنگت یہ ظاہر نہیں کرتی ہے کہ خون بہہ رہا ہے: 1۔ صفحہ 289-290}۔"
  tr: "İbn Sina, flebiti tamamen dışlama olarak tanımlayarak flebiti bolluğu dışarı atan bir durum olarak tanımlar, ardından flebiti uygulayan kişilerin hastalıklara yatkın olanlarla ve bu hastalıkta olanlarla sınırlar, kan hastalıklarına hazır olanları sayar. Bazılarının renklerinin flebitin gerekliliğini göstermediğini belirtir {cite:canon-ibn-sina-print-v1 s.289-290}."
  id: "Ibn Sina membuka bab tentang flebitis dengan mendefinisikannya sebagai pengusiran total yang mengusir kelimpahan, kemudian ia membatasi siapa yang seharusnya mempraktikkan flebitis hanya pada dua jiwa, yang rentan terhadap penyakit dan yang ada di dalamnya, serta menyebutkan mereka yang siap untuk penyakit darah. Ia menyebutkan bahwa warna beberapa orang tidak menunjukkan perlunya phlebitis {cite:canon-ibn-sina-print-v1 hlm.289-290}."
