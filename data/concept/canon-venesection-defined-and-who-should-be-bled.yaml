label: { ar: "تعريف الفصد ومن ينبغي أن يفصد عند ابن سينا", en: "Venesection defined and who should be bled in the Canon", ur: "قانون میں فصد کی تعریف اور کن کا فصد کھولا جائے" }
summary:
  ar: "يفتتح ابن سينا فصل الفصد بتعريفه استفراغاً كلياً يستفرغ الكثرة، ثم يحصر من ينبغي أن يفصد في نفسين، المتهيئ للأمراض والواقع فيها، ويعدد المستعدين لأمراض الدم، ويذكر أن ألوان بعضهم لا تدل على وجوب الفصد {cite:canon-ibn-sina-print-v1 pp.289-290}."
  en: "Ibn Sina opens the chapter on venesection by defining it as a general evacuation that drains plethora, then limits those to be bled to two kinds, the one prone to diseases and the one already in them, lists those prone to diseases of the blood, and notes that the complexion of some of them does not show that bleeding is due {cite:canon-ibn-sina-print-v1 pp.289-290}."
