summary:
  ar: "التوسل جعل الوسيلة في الدعاء؛ تفصّل الموسوعة الفقهية الكويتية أنواعه: التوسل بأسماء الله وصفاته، وبالإيمان والأعمال الصالحة، وبالنبي في الحياة ويوم القيامة، وخلاف العلماء في التوسل به بعد وفاته {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Tawassul is making a means in supplication; the Kuwaiti Fiqh Encyclopedia details its kinds — through God's names and attributes, through faith and righteous works, and through the Prophet in life and on Judgment Day — and the scholars' disagreement over tawassul through him after his death {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
