id: concept/mualajat-al-lisan
class: concept
kind: scientific
label:
  ar: معالجات اللسان على الجملة
  en: The general treatment of the tongue
  ur: زبان کی مجموعی معالجات
  es: "El tratamiento general de la lengua"
  fr: "Le traitement général de la langue"
  tr: "Cümle üzerindeki dil işlemcileri"
  id: "Prosesor lidah pada kalimat"
summary:
  ar: قد تكون معالجة اللسان بمشاركة مع رأس أو معدة بما يصلحها في بابها وقد تكون خاصة بالمشروبات المستفرغة بالإسهال وهي أنفع من المقيئة أو القابضة أو المحللة المقطعة الملطفة التي إذا أشربت تأدت قوتها إليه وأولى ما يشرب أمثالها بعد الطعام وقد يعالج بالمضمضات والدلوكات والغراغر والأدهان والحبوب الممسكة في الفم والأجود أن تتخذ مفرطحة ويجب أن يحترس في استعمال أدوية الفم واللسان إذا كانت مما يضر الحلق والرئة كيلا يتحلب شيء من سيلاناتها إليها {cite:canon-ibn-sina-print-v2 p.255}
  en: 'The tongue''s treatment may be with a partner — the head or the stomach — set right by what is taught in their chapters, or it may be specific: drinks evacuated by loosening are the most useful of it, beyond the emetics, the astringents and the dissolving-cutting-mollifying kinds whose strength reaches it when drunk — and such are best drunk after food. It is also treated with rinses, rubs, gargles, oils held in the mouth and mouth-held pills made from drugs of the named powers as needed, best made finely ground; and care must be taken with mouth-and-tongue drugs of the kind that harms the throat and the lung, lest some of their flow trickle down to them {cite:canon-ibn-sina-print-v2 p.255}'
  ur: 'زبان کا علاج کسی شریک کے ساتھ بھی ہو سکتا ہے — سر یا معدہ — جنہیں اپنے اپنے باب کے بتائے طریقے سے درست کیا جائے، اور خاص بھی: اسہال سے استفراغ کرنے والے مشروبات سب سے زیادہ نفع دیتے ہیں، مقیئات اور قابضات اور محلل مفرّق ملطفات سے جن کی قوت پینے پر اس تک پہنچتی ہے — اور ایسے مشروبات کھانے کے بعد پینا اولیٰ ہے؛ اور مضمضوں، ملیدوں، غرغروں، منہ میں روکے جانے والے تیلوں اور منہ میں رکھنے والی گولیوں سے بھی علاج ہوتا ہے اور بہترین یہ ہے کہ باریک پیس کر بنائی جائیں؛ اور منہ اور زبان کی ادویہ کے استعمال میں احتیاط واجب ہے اگر وہ حلق اور پھیپھڑے کو نقصان دینے والی جنس سے ہوں، کہ ان کا بہاؤ ان تک نہ رسِب جائے {cite:canon-ibn-sina-print-v2 p.255}'
  es: "El tratamiento de la lengua puede realizarse junto con el de la cabeza o el estómago, siguiendo las enseñanzas de sus respectivos capítulos, o puede ser específico: las bebidas que facilitan su evacuación son las más útiles, además de los eméticos, los astringentes y los fármacos que disuelven, cortan y suavizan, cuya potencia llega a la lengua al ser ingeridos; y es mejor tomarlos después de las comidas. También se trata con enjuagues, frotaciones, gárgaras, aceites que se mantienen en la boca y pastillas orales elaboradas con fármacos de las propiedades indicadas, según sea necesario, preferiblemente finamente molidas; y debe tenerse cuidado con los medicamentos para la boca y la lengua que dañan la garganta y los pulmones, para evitar que parte de su contenido se filtre hacia ellos {cite:canon-ibn-sina-print-v2 p.255}"
  fr: "Le traitement de la langue peut être associé à celui de la tête ou de l'estomac, en suivant les enseignements de leurs chapitres respectifs, ou il peut être spécifique: les boissons évacuées par laxation sont les plus bénéfiques, outre les émétiques, les astringents et les remèdes dissolvants, coupants et adoucissants dont l'effet se manifeste par l'ingestion – et il est préférable de les consommer après les repas. On la traite également par des bains de bouche, des frictions, des gargarismes, des huiles buccales et des pilules orales préparées à partir de substances aux propriétés mentionnées, de préférence finement broyées; il convient d'être prudent avec les remèdes buccaux et linguaux susceptibles d'affecter la gorge et les poumons, afin d'éviter qu'une partie de leur contenu ne s'y infiltre. {cite:canon-ibn-sina-print-v2 p.255}"
  tr: "Dil tedavisi, baş veya mide ile uygun şekilde birlikte yapılabilir ve ishal kaynaklı kusma içeceklerine özgü olabilir. İçildiklerinde güçlendiren kusturucu, büzücü veya yatıştırıcı eriticilerden daha etkilidirler. İlk tür, öğünlerden sonra içilmelidir. Ağızda tutulan durulama, ovma, gargara yapma, merhemler ve haplarla tedavi edilebilir. Aşırı almak en iyisidir. Ağız yoluyla alınan ve dil ilaçları boğaz ve akciğerlere zarar veriyorsa, salgılarının sağılmasını önlemek için dikkatli olunmalıdır {cite:canon-ibn-sina-print-v2 s.255}"
  id: "Perawatan lidah dapat dilakukan bersamaan dengan kepala atau lambung dengan cara yang sesuai, dan bisa juga spesifik untuk minuman muntah akibat diare. Obat ini lebih efektif daripada bahan pelarut emetik, astringen, atau penenang, yang jika diminum akan memperkuatnya. Jenis pertama adalah diminum setelah makan. Obat ini dapat diobati dengan bilasan, gosok, kumur, salep, dan pil yang ditahan di mulut. Sebaiknya konsumsi berlebihan. Seseorang harus berhati-hati saat menggunakan obat oral dan lidah jika merusak tenggorokan dan paru-paru agar cairan cairannya tidak diperah {cite:canon-ibn-sina-print-v2 hlm.255}"
