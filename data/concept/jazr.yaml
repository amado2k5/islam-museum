summary:
  ar: "معروف، وأقوى بزره البري. يُذكر له ثلاثة أصناف: برّي ورقه كورق الرازيانج، وبستاني شبيه بالكرفس الرومي، وثالث ورقه كورق الكزبرة. طبعه حار في آخر الثانية رطب في الأولى. ينفع القروح المتأكلة وذات الجنب والسعال المزمن، ويُذكر أنه يُدرّ الطمث ويهيّج الباه {cite:canon-ibn-sina-print-v1 p.429} {cite:canon-ibn-sina-print-v1 p.430}."
  en: "Known, and its wild seed is the strongest. The book names three kinds: a wild one whose leaf resembles fennel, a garden one like Roman parsley, and a third whose leaf resembles coriander. Hot at the end of the second degree and moist in the first. It is listed for eating ulcers, pleurisy and chronic cough; the book also says it brings on the menses and stirs desire {cite:canon-ibn-sina-print-v1 p.429} {cite:canon-ibn-sina-print-v1 p.430}."
  ur: "معروف ہے، اور اس کا جنگلی بیج سب سے زیادہ قوی ہے۔ کتاب اس کی تین قسمیں بیان کرتی ہے: جنگلی جس کا پتا رازیانج جیسا ہے، باغی جو رومی کرفس سے مشابہ ہے، اور تیسری جس کا پتا دھنیے جیسا ہے۔ طبع دوسرے درجے کے آخر میں گرم اور پہلے میں تر۔ کھانے والے زخموں، ذات الجنب اور پرانی کھانسی کے لیے بیان ہوا ہے؛ کتاب کہتی ہے کہ یہ حیض جاری کرتا ہے اور شہوت بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.429} {cite:canon-ibn-sina-print-v1 p.430}۔"
  es: "Conocida, y su semilla silvestre es la más fuerte. El libro nombra tres tipos: uno silvestre cuya hoja se asemeja al hinojo, uno de jardín como el perejil romano y un tercero cuya hoja se asemeja al cilantro. Caliente al final del segundo grado y húmedo en el primero. Se menciona para comer úlceras, pleuresía y tos crónica; el libro también dice que provoca la menstruación y despierta el deseo {cite:canon-ibn-sina-print-v1 p.429} {cite:canon-ibn-sina-print-v1 p.430}."
