label:
  ar: "الرجعة"
  en: "Raj'a (return of a divorced wife in the waiting period): its ruling, its conditions, its forms and its effects"
  ur: "رجعت"
  es: "Raj'a (regreso de una esposa divorciada durante el período de espera): su normativa, sus condiciones, sus formas y sus efectos."
  fr: "Raj'a (retour d'une épouse divorcée pendant la période d'attente): son régime, ses conditions, ses formes et ses effets"
  tr: "Dönüş"
  id: "Kembali"
summary:
  ar: "الرجعة في اللغة الرجوع، وفي الاصطلاح استدامة ملك النكاح القائم، أو إعادة المطلقة الرجعية إلى العصمة في العدة دون عقد جديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} وقد أجمع الفقهاء على مشروعيتها بالكتاب والسنة، وهي مباحة في الأصل وحق للزوج، وتجب عند الحنفية والمالكية إذا طلق في الحيض، وتسن عند الشافعية والحنابلة في تلك الحال، وتندب عند الندم والصلح، وتحرم إذا قصد الإضرار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} ومن شروطها أن تكون بعد طلاق رجعي، وبعد الدخول، وفي العدة، وألا تكون عن فسخ، ولا بعوض، وأن تكون منجزة غير معلقة، وأن يكون المرتجع أهلا للنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} وتصح بالقول الصريح، وفيه ألفاظ صريحة وكنايات، وتصح بالفعل عند الحنفية والمالكية بشروط، ولا تصح بالفعل عند الشافعية، وتصح بالوطء عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8636} والإشهاد عليها مستحب عند الجمهور، وإعلام الزوجة بها مستحب، وللمطلقة الرجعية أن تتزين عند الحنابلة والحنفية، وتمنع الشافعية ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8639} ويقع الخلاف في دعوى الرجعة بعد انقضاء العدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8640}"
  en: "Raj'a in the lexicon is return; in the jurists' sense it is the continuation of a marriage that still stands, or the restoration of a revocably divorced wife to the marriage during her waiting period without a new contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} The jurists agree on its lawfulness from the Qur'an and the Sunna. In principle it is permitted and is the husband's right; it is obligatory for the Hanafis and Malikis when he divorced during menstruation, recommended for the Shafi'is and Hanbalis in that case, recommended on regret and reconciliation, and forbidden if the purpose is harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} Its conditions are a revocable divorce, consummation, that it occur within the waiting period, that the divorce was not by annulment or for a consideration, that it be immediate and not conditional, and that the one who takes her back be competent to marry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} It is valid by explicit words and by allusion, and by act for the Hanafis and Malikis under conditions; the Shafi'is hold it invalid by act; the Hanbalis hold intercourse valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8636} Witnessing it is recommended for most jurists, informing the wife is recommended, the Hanbalis and Hanafis allow the divorced wife to adorn herself, and the Shafi'is forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8639} Disputes arise over a claim of return made after the waiting period has ended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8640}"
  ur: "رجعت طلاقِ رجعی دی ہوئی بیوی کو عدت کے اندر بغیر نئے نکاح کے واپس زوجیت میں لانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} اس کی شرائط میں طلاق رجعی، دخول، عدت کے اندر ہونا اور فوری ہونا شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8632}"
  es: "Raj'a en el léxico es retorno; en el sentido de los juristas es la continuación de un matrimonio que aún existe, o la restitución de una esposa revocablemente divorciada al matrimonio durante su período de espera sin un nuevo contrato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} Los juristas coinciden en su licitud según el Corán y la Sunna. En principio está permitido y es un derecho del marido; es obligatorio para los Hanafi y Malikis cuando se divorció durante la menstruación, recomendado para los Shafi'is y Hanbalis en ese caso, recomendado en caso de arrepentimiento y reconciliación, y prohibido si el propósito es el daño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} Sus condiciones son un divorcio revocable, consumación, que ocurra dentro del período de espera, que el divorcio no haya sido por anulación o por contraprestación, que sea inmediato y no condicional, y que quien la tome de vuelta sea competente para casarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} Es válido por palabras explícitas y por alusión, y por acto para los Hanafis y Malikis bajo condiciones; los Shafi'is lo consideran inválido por acto; los Hanbalis consideran válidas las relaciones sexuales. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8634} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8635} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8636} La mayoría de los juristas recomiendan ser testigos, se recomienda informar a la esposa, los Hanbalis y Hanafis permiten que la esposa divorciada se adorne, y los Shafi'is lo prohíben. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8639} Surgen disputas sobre un reclamo de devolución realizado una vez finalizado el período de espera. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8640}"
  fr: "Le terme « raj'a » signifie littéralement « retour ». Pour les juristes, il désigne la continuation d'un mariage toujours valide, ou la réintégration d'une épouse ayant divorcé de manière révocable au sein de son mariage pendant son délai d'attente, sans nouveau contrat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} Les juristes s'accordent sur sa licéité, se fondant à la fois sur le Coran et la Sunna. En principe, le retour est permis et constitue un droit pour le mari; il est obligatoire pour les écoles hanafite et malikite lorsque le divorce a été prononcé pendant les menstruations, recommandé pour les écoles chaféite et hanbalite dans ce cas, recommandé en cas de regret et de réconciliation, et interdit s'il est motivé par le désir de nuire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} Ses conditions sont un divorce révocable, consommé, qu'il intervienne dans le délai d'attente, que le divorce ne soit pas annulé ou à titre onéreux, qu'il soit immédiat et non conditionnel, et que celui qui la reprend soit apte à se remarier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} Il est valable par paroles explicites et par allusion, et par acte pour les Hanafis et Malikis sous conditions; les Shafi'ites le tiennent pour invalide par acte; les Hanbalis considèrent les relations sexuelles comme valides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8636} En être témoin est recommandé à la plupart des juristes, en informer l'épouse est recommandé, les Hanbalis et les Hanafis permettent à l'épouse divorcée de se parer, et les Shafi'ites l'interdisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8639} Des litiges surviennent concernant une demande de retour faite après la fin du délai d'attente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8640}"
  tr: "Dilbilimde 'geri çekme' geri dönmek anlamına gelirken, terminolojide mevcut evliliğin statüsünü korumak veya boşanmış kadını bekleme süresi boyunca yeni bir sözleşme olmadan yanılmazlığa geri döndürmek anlamına gelir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8629} Hukukçular, Kur'an ve Sünnet tarafından meşruiyeti konusunda oybirliğiyle hemfikirdir. Başlangıçta koca için bir haktır ve Hanafi ile Maliki'ye göre adet sırasında boşanırsa zorunludur, bu tür durumlarda Şafi'ler ve Hanbalilere göre Sünnet, pişmanlık ve uzlaşma durumlarında önerilir ve zarar vermek amacıyla yapılırsa yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8631} Şartları arasında, iptal edilebilir boşanmadan sonra, tamamlandıktan sonra, bekleme süresi içinde olması, iptal veya tazminat yoluyla değil, taviz olmadan tamamlanması ve geri dönen kişinin evlenmeye uygun olması yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8633} Açık konuşma ile geçerlidir, açık kelimeler ve metaforlar içerir ve Hanafi ve Malikilere göre belirli koşullarla pratikte geçerlidir, ancak Şafiiler tarafından geçerli değildir ve Hanbalilere göre cinsel ilişki yoluyla geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8636} ve çoğunluk tarafından ona tanıklık edilmesi, eşine bildirilmesi önerilir. Geri alınabilir boşanmış bir kadın Hanbali ve Hanefi'lere göre süslenebilir, ancak Şafiiler bunu yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8639} Anlaşmazlık, bekleme süresi sona erdikten sonra geri dönüş talebinde ortaya çıkar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8640}"
  id: "Dalam linguistik, 'penarikan' berarti kembali, dan dalam istilah berarti mempertahankan status pernikahan yang ada, atau mengembalikan wanita yang telah bercerai yang dapat dibatalkan ke ketidaksalahan selama masa tunggu tanpa kontrak baru. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8629} Para ahli hukum telah sepakat secara bulat tentang legitimasinya oleh Al-Qur'an dan Sunnah. Awalnya diperbolehkan dan merupakan hak bagi suami, dan wajib menurut Hanafi dan Malik jika bercerai saat menstruasi, Sunnah menurut Shafi'i dan Hanbali dalam kasus seperti itu, direkomendasikan dalam kasus penyesalan dan rekonsiliasi, dan dilarang jika dimaksudkan untuk menimbulkan bahaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8631} Di antara syaratnya adalah perceraian harus setelah perceraian yang dapat dibatalkan, setelah penyelesaian, selama masa tunggu, bukan dengan pembatalan atau kompensasi, harus diselesaikan tanpa konsesi, dan yang kembali harus memenuhi syarat untuk menikah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8633} Ini sah melalui ucapan eksplisit, mengandung kata-kata dan metafora eksplisit, dan sah dalam praktik menurut Hanafi dan Malik dengan syarat tertentu, tetapi tidak sah oleh Shafi'i, dan berlaku berdasarkan hubungan seksual menurut Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8633} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8636} dan memberikan kesaksian kepadanya dianjurkan oleh mayoritas, dan memberitahukan kepada istrinya tentang hal itu dianjurkan. Seorang wanita yang telah bercerai dapat dibatalkan dapat mengenakan pakaian sesuai dengan Hanbal dan Hanafi, tetapi para Shafi'i melarang hal ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8638} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8639} Perselisihan muncul dalam klaim pengembalian setelah masa tunggu berakhir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8640}"
