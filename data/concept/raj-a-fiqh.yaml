id: concept/raj-a-fiqh
class: concept
kind: legal
label:
  ar: "الرجعة"
  en: "Raj'a (return of a divorced wife in the waiting period): its ruling, its conditions, its forms and its effects"
  ur: "رجعت"
summary:
  ar: "الرجعة في اللغة الرجوع، وفي الاصطلاح استدامة ملك النكاح القائم، أو إعادة المطلقة الرجعية إلى العصمة في العدة دون عقد جديد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} وقد أجمع الفقهاء على مشروعيتها بالكتاب والسنة، وهي مباحة في الأصل وحق للزوج، وتجب عند الحنفية والمالكية إذا طلق في الحيض، وتسن عند الشافعية والحنابلة في تلك الحال، وتندب عند الندم والصلح، وتحرم إذا قصد الإضرار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} ومن شروطها أن تكون بعد طلاق رجعي، وبعد الدخول، وفي العدة، وألا تكون عن فسخ، ولا بعوض، وأن تكون منجزة غير معلقة، وأن يكون المرتجع أهلا للنكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} وتصح بالقول الصريح، وفيه ألفاظ صريحة وكنايات، وتصح بالفعل عند الحنفية والمالكية بشروط، ولا تصح بالفعل عند الشافعية، وتصح بالوطء عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8636} والإشهاد عليها مستحب عند الجمهور، وإعلام الزوجة بها مستحب، وللمطلقة الرجعية أن تتزين عند الحنابلة والحنفية، وتمنع الشافعية ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8639} ويقع الخلاف في دعوى الرجعة بعد انقضاء العدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8640}"
  en: "Raj'a in the lexicon is return; in the jurists' sense it is the continuation of a marriage that still stands, or the restoration of a revocably divorced wife to the marriage during her waiting period without a new contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} The jurists agree on its lawfulness from the Qur'an and the Sunna. In principle it is permitted and is the husband's right; it is obligatory for the Hanafis and Malikis when he divorced during menstruation, recommended for the Shafi'is and Hanbalis in that case, recommended on regret and reconciliation, and forbidden if the purpose is harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} Its conditions are a revocable divorce, consummation, that it occur within the waiting period, that the divorce was not by annulment or for a consideration, that it be immediate and not conditional, and that the one who takes her back be competent to marry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} It is valid by explicit words and by allusion, and by act for the Hanafis and Malikis under conditions; the Shafi'is hold it invalid by act; the Hanbalis hold intercourse valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8635} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8636} Witnessing it is recommended for most jurists, informing the wife is recommended, the Hanbalis and Hanafis allow the divorced wife to adorn herself, and the Shafi'is forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8639} Disputes arise over a claim of return made after the waiting period has ended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8640}"
  ur: "رجعت طلاقِ رجعی دی ہوئی بیوی کو عدت کے اندر بغیر نئے نکاح کے واپس زوجیت میں لانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8629} اس کی شرائط میں طلاق رجعی، دخول، عدت کے اندر ہونا اور فوری ہونا شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8632}"
