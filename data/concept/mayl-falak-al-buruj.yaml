label: { ar: "ميل فلك البروج", en: "The obliquity of the ecliptic" }
summary:
  ar: "ميل فلك البروج هو البعد الأعظم بين فلك البروج ومعدل النهار، ويقدّره بطليموس بثلاثة وعشرين جزءاً وواحد وخمسين دقيقة، ويقدّره القياس الذي أمر المأمون بامتحانه واجتمع عليه العلماء بثلاثة وعشرين جزءاً وخمس وثلاثين دقيقة {cite:farghani-elements-astronomy p. 112}{cite:farghani-elements-astronomy p. 150}. والقراءة الرقمية في الصفحتين مستقرة، ومع ذلك تبقى مراجعتها على الصورة واجبة."
  en: "The obliquity of the ecliptic is the greatest distance between the zodiac and the equinoctial circle. Ptolemy's value, as al-Farghani gives it, is 23 degrees 51 minutes; the value from the measurement made under al-Ma'mun is 23 degrees 35 minutes {cite:farghani-elements-astronomy p. 112}{cite:farghani-elements-astronomy p. 150}."
