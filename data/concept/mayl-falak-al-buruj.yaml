id: concept/mayl-falak-al-buruj
class: concept
kind: scientific
label: { ar: "ميل فلك البروج", en: "The obliquity of the ecliptic", es: "La oblicuidad de la eclíptica", fr: "L'obliquité de l'écliptique", ur: "چاند گرہن کا ترچھا پن", tr: "Burç eğimi", id: "Kemiringan zodiak" }
summary:
  ar: "ميل فلك البروج هو البعد الأعظم بين فلك البروج ومعدل النهار، ويقدّره بطليموس بثلاثة وعشرين جزءاً وواحد وخمسين دقيقة، ويقدّره القياس الذي أمر المأمون بامتحانه واجتمع عليه العلماء بثلاثة وعشرين جزءاً وخمس وثلاثين دقيقة {cite:farghani-elements-astronomy p. 112}{cite:farghani-elements-astronomy p. 150}. والقراءة الرقمية في الصفحتين مستقرة، ومع ذلك تبقى مراجعتها على الصورة واجبة."
  en: "The obliquity of the ecliptic is the greatest distance between the zodiac and the equinoctial circle. Ptolemy's value, as al-Farghani gives it, is 23 degrees 51 minutes; the value from the measurement made under al-Ma'mun is 23 degrees 35 minutes {cite:farghani-elements-astronomy p. 112}{cite:farghani-elements-astronomy p. 150}."
  es: "La oblicuidad de la eclíptica es la mayor distancia entre el zodíaco y el círculo equinoccial. El valor de Ptolomeo, según lo proporciona al-Farghani, es de 23 grados 51 minutos; el valor de la medición realizada bajo al-Ma'mun es de 23 grados 35 minutos {cite:farghani-elements-astronomy p. 112}{cite:farghani-elements-astronomy p. 150}."
  fr: "L'obliquité de l'écliptique correspond à la plus grande distance entre le zodiaque et le cercle équinoxial. La valeur de Ptolémée, telle que rapportée par al-Farghani, est de 23 degrés 51 minutes; celle issue de la mesure effectuée sous al-Ma'mun est de 23 degrés 35 minutes {cite:farghani-elements-astronomy p. 112}{cite:farghani-elements-astronomy p. 150}."
  ur: "چاند گرہن کا ترچھا ہونا رقم اور استوائی دائرے کے درمیان سب سے بڑا فاصلہ ہے۔ بطلیموس کی قدر، جیسا کہ الفرغانی بتاتا ہے، 23 ڈگری 51 منٹ ہے۔ المامون کے تحت کی گئی پیمائش سے قیمت 23 ڈگری 35 منٹ ہے 112}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 150}۔"
  tr: "Burçun eğimi, burç ile günün ortalaması arasındaki en büyük mesafedir; Ptolemaios tarafından yirmi üç parça elli bir dakika olarak tahmin edilmiştir ve al-Ma'mun'un bilim insanları tarafından yirmi üç parça otuz beş dakikada test edilip üzerinde anlaşılmasını emrettiği ölçümle {cite:farghani-elements-astronomy s. 112} {cite:farghani-elements-astronomy, s. 150}. Her iki sayfadaki dijital okuma stabildir, ancak bunu görüntüde gözden geçirmek gerekmektedir."
  id: "Kemiringan zodiak adalah jarak terbesar antara zodiak dan rata-rata hari, diperkirakan oleh Ptolemaios pada dua puluh tiga bagian lima puluh satu menit, dan oleh pengukuran yang diperintahkan al-Ma'mun untuk diuji dan disepakati oleh para sarjana pada dua puluh tiga bagian dan tiga puluh lima menit {cite:farghani-elements-astronomy hlm. 112} {cite:farghani-elements-astronomy, hlm. 150}. Pembacaan digital pada kedua halaman stabil, namun tetap perlu untuk meninjaunya dalam gambar."
