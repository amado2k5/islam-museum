id: concept/fasad-al-dhawq
class: concept
kind: scientific
label:
  ar: فساد الذوق
  en: Corruption of taste (dysgeusia)
  ur: ذائقہ کا فساد
summary:
  ar: تدخل الآفة في الذوق على الوجوه الثلاثة المعلومة وكل ذلك قد يكون بمشاركة وقد يكون لمرض خاص من سوء مزاج أو مرض آلي أو مشترك فيستدل عليه بما أشير إليه، وعلاجه إن كان بمشاركة فأن تتعرف حال الدماغ فتصلحه بما عرف في باب علله أو حال المعدة وإن كان من غير مشاركة اشتغل باللسان نفسه وإذا كان السبب امتلاء وخلطاً رديئاً وجب أن يستفرغ {cite:canon-ibn-sina-print-v2 p.255}
  en: 'The disorder enters taste on the three known ways, and all of it may come by sharing or from a disease of its own — a bad temperament, an organic or a shared disease — and is inferred as taught. If it is by sharing, the brain''s state is examined and set right as taught in the chapter of its disorders, or the stomach''s; if without sharing the tongue itself is treated; and if the cause is fullness and a bad humour it must be evacuated, the sharp foods of the book''s list fed to its owner {cite:canon-ibn-sina-print-v2 p.255}'
  ur: 'ذائقہ میں آفہ تین معلوم طریقوں سے داخل ہوتی ہے اور یہ سب شراکت سے بھی ہو سکتا ہے اور کسی خاص مرض سے بھی — سوء مزاج یا آلی یا مشترک — اور اسی طریقے سے پہچانا جاتا ہے؛ اگر شراکت سے ہو تو دماغ کی حالت جانچ کر اس باب میں بتائے گئے سے درست کی جائے یا معدہ کی، اور بغیر شراکت ہو تو خود زبان کا علاج ہو؛ اور اگر سبب امتلاء اور برا خلط ہو تو اس کا استفراغ واجب ہے اور کتاب کی شمار کردہ حریف خوراکیں کھلائی جائیں {cite:canon-ibn-sina-print-v2 p.255}'
