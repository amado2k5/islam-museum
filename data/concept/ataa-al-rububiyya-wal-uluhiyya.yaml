id: concept/ataa-al-rububiyya-wal-uluhiyya
class: concept
kind: doctrine
label:
  ar: "عطاء الربوبية وعطاء الألوهية"
  en: "The gift of lordship and the gift of godhead"
  ur: "ربوبیت کا عطا اور الوہیت کا عطا"
summary:
  ar: "يفرّق الشعراوي بين عطاء الربوبية، وهو ما يعطيه الله لجميع خلقه في الدنيا كالشمس والمطر والهواء، ويشمل المؤمن والكافر، وعطاء الألوهية، وهو للمؤمنين في الدنيا والآخرة. ويرى أن عطاء الربوبية يكفي ليؤمن الناس ويعبدوا الله، وأن قوله «يا أيها الناس اعبدوا ربكم» خطاب عام، و«يا أيها الذين آمنوا» خطاب للمؤمنين {cite:tafsir-sharawi-khawatir-scan p.183} {cite:tafsir-sharawi-khawatir-scan p.184} {cite:tafsir-sharawi-khawatir-scan p.185} {cite:tafsir-sharawi-khawatir-scan p.186}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi separates the gift of lordship, which God gives to all creatures in this world such as the sun, rain and air, to believer and unbeliever alike, from the gift of godhead, which is for believers in this world and the next. He holds that the gift of lordship suffices to lead people to faith and worship, and that 'O people, worship your Lord' is addressed to all, while 'O you who believe' addresses believers {cite:tafsir-sharawi-khawatir-scan p.183} {cite:tafsir-sharawi-khawatir-scan p.184} {cite:tafsir-sharawi-khawatir-scan p.185} {cite:tafsir-sharawi-khawatir-scan p.186}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی ربوبیت کے عطا کو، جو اللہ دنیا میں سب مخلوق کو دیتا ہے جیسے سورج، بارش اور ہوا، اور جو مومن اور کافر دونوں کو ملتا ہے، الوہیت کے عطا سے الگ کرتے ہیں، جو مومنین کے لیے دنیا اور آخرت دونوں میں ہے۔ ان کے نزدیک ربوبیت کا عطا ہی لوگوں کو ایمان اور عبادت کی طرف لانے کے لیے کافی ہے، اور «يا أيها الناس» عام خطاب ہے جبکہ «يا أيها الذين آمنوا» مومنین سے خطاب ہے {cite:tafsir-sharawi-khawatir-scan p.183} {cite:tafsir-sharawi-khawatir-scan p.184} {cite:tafsir-sharawi-khawatir-scan p.185} {cite:tafsir-sharawi-khawatir-scan p.186}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
