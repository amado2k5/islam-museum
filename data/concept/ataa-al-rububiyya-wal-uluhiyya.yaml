id: concept/ataa-al-rububiyya-wal-uluhiyya
class: concept
kind: doctrine
label:
  ar: "عطاء الربوبية وعطاء الألوهية"
  en: "The gift of lordship and the gift of godhead"
  fr: "Le don de la seigneurie et le don de la divinité"
  ur: "ربوبیت کا عطا اور الوہیت کا عطا"
  es: "El don del señorío y el don de la divinidad"
  tr: "Lordluk Verme ve İlahi Verme"
  id: "Pemberian Penguasaan dan Pemberian Keilahian"
summary:
  ar: "يفرّق الشعراوي بين عطاء الربوبية، وهو ما يعطيه الله لجميع خلقه في الدنيا كالشمس والمطر والهواء، ويشمل المؤمن والكافر، وعطاء الألوهية، وهو للمؤمنين في الدنيا والآخرة. ويرى أن عطاء الربوبية يكفي ليؤمن الناس ويعبدوا الله، وأن قوله «يا أيها الناس اعبدوا ربكم» خطاب عام، و«يا أيها الذين آمنوا» خطاب للمؤمنين {cite:tafsir-sharawi-khawatir-scan p.183} {cite:tafsir-sharawi-khawatir-scan p.184} {cite:tafsir-sharawi-khawatir-scan p.185} {cite:tafsir-sharawi-khawatir-scan p.186}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi separates the gift of lordship, which God gives to all creatures in this world such as the sun, rain and air, to believer and unbeliever alike, from the gift of godhead, which is for believers in this world and the next. He holds that the gift of lordship suffices to lead people to faith and worship, and that 'O people, worship your Lord' is addressed to all, while 'O you who believe' addresses believers {cite:tafsir-sharawi-khawatir-scan p.183} {cite:tafsir-sharawi-khawatir-scan p.184} {cite:tafsir-sharawi-khawatir-scan p.185} {cite:tafsir-sharawi-khawatir-scan p.186}. This is Sha'rawi's reading and is attributed to him."
  fr: "Sha'rawi distingue le don de la seigneurie, que Dieu accorde à toutes les créatures en ce monde, tels le soleil, la pluie et l’air, aux croyants comme aux non-croyants, du don de la divinité, réservé aux croyants en ce monde et dans l’autre. Il estime que le don de la seigneurie suffit à conduire les gens à la foi et au culte, et que l’appel aux hommes à adorer leur Seigneur s’adresse à tous, tandis que l’adresse aux croyants les vise particulièrement {cite:tafsir-sharawi-khawatir-scan p.183} {cite:tafsir-sharawi-khawatir-scan p.184} {cite:tafsir-sharawi-khawatir-scan p.185} {cite:tafsir-sharawi-khawatir-scan p.186}. Cette lecture est celle de Sha'rawi et lui est attribuée."
  ur: "شعراوی ربوبیت کے عطا کو، جو اللہ دنیا میں سب مخلوق کو دیتا ہے جیسے سورج، بارش اور ہوا، اور جو مومن اور کافر دونوں کو ملتا ہے، الوہیت کے عطا سے الگ کرتے ہیں، جو مومنین کے لیے دنیا اور آخرت دونوں میں ہے۔ ان کے نزدیک ربوبیت کا عطا ہی لوگوں کو ایمان اور عبادت کی طرف لانے کے لیے کافی ہے، اور «يا أيها الناس» عام خطاب ہے جبکہ «يا أيها الذين آمنوا» مومنین سے خطاب ہے {cite:tafsir-sharawi-khawatir-scan p.183} {cite:tafsir-sharawi-khawatir-scan p.184} {cite:tafsir-sharawi-khawatir-scan p.185} {cite:tafsir-sharawi-khawatir-scan p.186}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "Sha'rawi distingue entre el don de la soberanía, que Dios otorga a todas las criaturas de este mundo, como el sol, la lluvia y el aire, tanto a creyentes como a no creyentes, y el don de la divinidad, que es para los creyentes en este mundo y en el venidero. Sostiene que el don de la soberanía basta para guiar a las personas a la fe y la adoración, y que «¡Oh, gente!, adorad a vuestro Señor» se dirige a todos, mientras que «¡Oh, vosotros que creéis!» se dirige a los creyentes {cite:tafsir-sharawi-khawatir-scan p.183} {cite:tafsir-sharawi-khawatir-scan p.184} {cite:tafsir-sharawi-khawatir-scan p.185} {cite:tafsir-sharawi-khawatir-scan p.186}. Esta es la lectura de Sha'rawi y se le atribuye."
  tr: "El-Şaarawi, Allah'ın bu dünyadaki tüm yaratıklarına verdiği ve hem inananları hem de inamsızları kapsayan efendilik armağanı ile bu dünyada ve ahirette inananlar için olan ilahi armağan arasında ayrım yapar. Tanrı'nın Allah'a inanması ve ibadet etmesi için lordluk armağanının yeterli olduğuna inanır ve \"Ey insanlar, Rabbine ibadet et\" sözünün genel bir hitap olduğuna, \"Ey iman edenler\" genel bir hitap ve \"Ey iman edenler\" imanlılara hitap ettiğine {cite:tafsir-sharawi-khawatir-scan s.183} {cite:tafsir-sharawi-khawatir-scan s.184} {cite:tafsir-sharawi-khawatir-scan s.186} Bu onun yorumudur ve ona atfedilmiştir."
  id: "Al-Shaarawi membedakan antara karunia kekuasaan, yang merupakan apa yang Allah berikan kepada semua makhluk-Nya di dunia ini, seperti matahari, hujan, dan udara, dan mencakup baik orang beriman maupun kafir, serta karunia ketuhanan, yang diberikan kepada orang beriman di dunia ini dan akhirat. Ia percaya bahwa karunia kekuasaan sudah cukup bagi orang untuk percaya dan menyembah Allah, dan bahwa perkataan-Nya, \"Wahai manusia, beribadahlah kepada Tuhanmu\" adalah ucapan umum, dan \"Wahai kalian yang telah beriman\" adalah ucapan umum, dan \"Wahai kalian yang telah beriman\" adalah alamat kepada para mukmin {cite:tafsir-sharawi-khawatir-scan hlm.183} {cite:tafsir-sharawi-khawatir-scan hlm.184} {cite:tafsir-sharawi-khawatir-scan hlm.186}. Ini adalah interpretasinya dan dikaitkan dengannya."
