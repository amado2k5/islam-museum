id: concept/al-itikaf
class: concept
kind: legal
label:
  ar: "الاعتكاف"
  en: "Retreat in the mosque (i'tikaf)"
summary:
  ar: "يرى الشعراوي أن الاعتكاف حصر الحركة في زمن ومكان، وأن المسجد مكان للعبادة لا لأمور الدنيا، وأن المعتكف يترك أقداره مع نعله، ويجلس حيث ينتهي به المجلس، وأن المباشرة محرمة على المعتكف، وأن حدود الله هي محارمه. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.793}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.794}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.795}"
  en: "Sha'rawi holds that i'tikaf confines one's movement to a time and a place, that the mosque is a place of worship and not for worldly business, that the one in retreat leaves his worldly standing with his shoes, sits where the gathering ends, that intimacy is forbidden to him, and that God's limits are His prohibitions {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.793}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.794}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.795}."
wings: [ideas]
themes: [worship-and-the-pillars, spirituality-and-sufism]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "ما حدود الاعتكاف في المسجد وآدابه، وهل يصح خارج المسجد؟"
  en: "What are the limits and manners of i'tikaf in the mosque, and is it valid outside the mosque?"
perspectives:
  - tradition: sunni
    id: sharawi-itikaf-manners
    stance:
      ar: "الاعتكاف حصر الحركة في المسجد للعبادة، وآدابه ترك أمور الدنيا والجلوس حيث ينتهي المجلس"
      en: "I'tikaf confines movement to the mosque for worship; its manners are to leave worldly matters and to sit where the gathering ends"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الاعتكاف الكامل في المسجد لأنه يجمع الزمان والمكان، وإن الاعتكاف يصح في أي مكان لكنه أكمل في المسجد، وإن الكلام في أمور الدنيا في المسجد لا ينفع، ويذكر قول الصحابي في خلع الدنيا مع النعل، ويرى أن على الداخل أن يترك مكانه لمن يخدمه أو لا يتخطى الرقاب. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.793}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.794}"
      en: "Sha'rawi says the full retreat is in the mosque because it joins time and place, that it may be valid elsewhere but is most complete in the mosque, that worldly talk in the mosque does not benefit, and recounts a companion's saying about leaving the world with the shoe; he holds that one should not climb over people's necks but sit where the gathering places him {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.793}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.794}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-jurists-itikaf
    stance:
      ar: "خلاف الفقهاء في شروط الاعتكاف ومدته لم يُدخل من مصدر مراجَع في هذه الدفعة"
      en: "The jurists' disagreement on the conditions and length of i'tikaf is not entered from a checked source in this batch"
    holders: []
    summary:
      ar: "ينقل الشعراوي أن بعض العلماء اشترطوا الصيام والمدة والمسجد، ولم تُدخل أقوالهم بأسمائها، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.793}"
      en: "Sha'rawi reports that some scholars required fasting, a set length and the mosque; their views are not entered by name, nor the academic view or other views {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.793}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
