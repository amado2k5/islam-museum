id: concept/al-maslaha-al-mursala
class: concept
kind: legal
label: { ar: "المصلحة المرسلة ⁦(الاستصلاح)⁩", en: "Unattested interest (al-maslaha al-mursala, istislah)", ur: "مصلحتِ مرسلہ ⁦(استصلاح)⁩" }
summary:
  ar: "المصلحة التي لم يشهد لها من الشرع نص معين بالاعتبار ولا بالإلغاء. يجعل الغزالي في «المستصفى» الاستصلاح رابع «الأصول الموهومة»، ويقسم المصلحة بحسب شهادة الشرع إلى معتبرة ⁦(ترجع إلى القياس)⁩، وملغاة ⁦(باطلة)⁩، ومرسلة هي محل النظر؛ ويعرّف المصلحة بأنها المحافظة على مقصود الشرع في حفظ الدين والنفس والعقل والنسل والمال، ويجيز الأخذ بالمرسلة الواقعة في رتبة الضرورات إذا كانت ضرورية قطعية كلية، ويقرر أنها ليست أصلاً خامساً بل راجعة إلى الكتاب والسنة والإجماع {cite:mustasfa-tijariyya-1356-v1 p. 143} {cite:mustasfa-tijariyya-1356-v1 p. 144} {cite:mustasfa-tijariyya-1356-v1 p. 145} {cite:mustasfa-tijariyya-1356-v1 p. 147} {cite:mustasfa-tijariyya-1356-v1 p. 148}."
  en: "An interest for which no specific text of the law testifies either for or against. In al-Mustasfa al-Ghazali makes istislah the fourth of the 'supposed sources', dividing interests by the law's testimony into those it confirms (which reduce to analogy), those it cancels (void), and unattested ones, which are open to reasoning; he defines interest as preserving the law's purpose in protecting religion, life, intellect, progeny and property, allows acting on an unattested interest at the level of necessities when it is necessary, certain and universal, and holds that it is not a fifth source but returns to the Book, the sunna and consensus."
  ur: "وہ مصلحت جس کے اعتبار یا الغا کی شریعت میں کوئی معین نص گواہی نہ دے۔ غزالی «المستصفیٰ» میں استصلاح کو چوتھا «اصلِ موہوم» بناتے ہیں، اور مصلحت کو شریعت کی گواہی کے اعتبار سے تین قسموں میں بانٹتے ہیں: معتبر ⁦(جو قیاس کی طرف لوٹتی ہے)⁩، ملغیٰ ⁦(باطل)⁩، اور مرسل جو محلِ نظر ہے؛ وہ مصلحت کی تعریف یوں کرتے ہیں: دین، جان، عقل، نسل اور مال کی حفاظت میں شریعت کے مقصود کی حفاظت؛ ضروریات کے مرتبے کی مرسل مصلحت پر عمل کو جائز کہتے ہیں جب وہ ضروری، قطعی اور کلی ہو، اور کہتے ہیں کہ یہ پانچواں اصل نہیں بلکہ کتاب، سنت اور اجماع کی طرف لوٹتی ہے۔"
