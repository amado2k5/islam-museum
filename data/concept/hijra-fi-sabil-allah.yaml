perspectives:
- tradition: sunni
  id: sunni-sharawi-hijra
  stance:
    ar: "الهجرة إلى أرض يأمن فيها المؤمن على دينه، ولا هجرة بعد الفتح إلا لمعونة الطاعة"
    en: "Migration to a land where the believer is safe in his religion; no hijra after the conquest except to help obedience"
  summary:
    ar: "يذكر الشعراوي أن المسلمين الأوائل هاجروا إلى الحبشة لأنها أرض لا يُظلم فيها أحد، فسمّوها دار أمن وإن لم تكن دار إيمان {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2583}. ويرى أن الهجرة إلى المدينة كانت إلى دار إيمان، وأن الهجرة بعد الفتح لا تكون إلا لمن يقصد المعونة على الطاعة، ويستشهد بقول النبي إن المهاجر من هجر ما نهى الله عنه {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2583}. ويعدّ هجرات باقية الحج وطلب العلم والانتقال إلى مكان يتيسر فيه أداء الفرائض {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2583}. ويفسّر أن المهاجر الذي يدركه الموت قبل أن يبلغ السعة أجره واقع على الله، لأنه ذهب إلى رب السبب {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2587}. وهذا رأيه في تفسير الآيات، ولم تُعرض بعد أحكام الفقهاء في وجوب الهجرة وانقطاعها من مصدر محدد (needs_source)."
    en: "Sha'rawi says the early Muslims migrated to Abyssinia because no one was wronged there, so they called it a land of safety though not a land of faith {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2583}. He holds that migration to Medina was to a land of faith, and that after the conquest migration is only for one who seeks help in obedience, citing the saying that the emigrant is one who leaves what God forbade {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2583}. He counts as continuing hijras the pilgrimage, the pursuit of knowledge and moving to a place where the duties can be performed {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2583}. He reads the verse on one who dies on the way as meaning that his reward falls on God, since he has gone to the Lord of the cause {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2587}. This is his reading; the jurists' rules on the duty of migration and whether it has ended are not yet set out from a named source (needs_source)."
