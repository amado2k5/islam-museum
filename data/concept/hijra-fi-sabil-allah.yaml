id: concept/hijra-fi-sabil-allah
class: concept
kind: doctrine
label:
  ar: الهجرة في سبيل الله
  en: Migration in the way of God (hijra)
summary:
  ar: "يشرح الشعراوي آيات النساء 97 إلى 100 بأن الهجرة من أرض يُستضعف فيها المسلم إلى أرض يأمن فيها على دينه، فكانت الحبشة دار أمن والمدينة دار إيمان. ويرى أنه لا هجرة بعد الفتح إلا لمن يقصد المعونة على طاعة الله، ويعدّ الحج وطلب العلم والانتقال من مكان يُمنع فيه العبد من الطاعة هجرات إلى الله {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2578}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2583}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2587}."
  en: "Sha'rawi reads Q. 4:97 to 4:100 as migration from a land where the believer is oppressed to a land where he is safe in his religion: Abyssinia was a land of safety and Medina a land of faith. He holds that there is no hijra after the conquest except for one who seeks help in obeying God, and counts the pilgrimage, the pursuit of knowledge, and moving from a place where a servant is kept from obedience as hijras to God {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2578}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2583}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2587}."
