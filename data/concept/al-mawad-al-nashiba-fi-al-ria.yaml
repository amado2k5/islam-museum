id: concept/al-mawad-al-nashiba-fi-al-ria
class: concept
kind: scientific
label:
  ar: "المواد الناشبة في الرئة"
  en: "The matters sticking in the lung"
  fr: "Les matières retenues dans le poumon"
  ur: "پھیپھڑے میں پھنسی مواد"
  es: "Las cosas que se quedan atascadas en el pulmón"
summary:
  ar: "المواد التي تحصل في الرئة قد تكون من جنس الرطوبة وقد تكون من جنس القيح وقد تكون من جنس الدم والمواد الحارة الرقيقة، والمواد الناشبة في الرئة قد يعسر انتفاؤها إما لغلظها ولزوجتها فلا تنتفت وإما لرقتها فلا يلزمها الرطوبة الدافعة إياها بالسعال بل تنعقد الرطوبة غير قالعة وإما لشدة كثرتها، وإذا كانت الأخلاط الصدرية غليظة فلا يباشر التجفيف بل يشتغل بالتليين والتقطيع مع تحليل بمداراة ويكون أهم الأمرين التقطيع أي تكون العناية بالتقطيع أكثر منها بالتحليل ⁦(وقد ذكر في الباب ماء العسل وكيفية استعماله ولا ينقل بحسب القاعدة)⁩ {cite:canon-ibn-sina-print-v2 p.305}"
  en: "The matters that form in the lung may be of the kind of moisture, of the kind of pus, or of the kind of blood and the thin hot matters. The matters sticking in the lung may be hard to expel: either for their thickness and stickiness, so they are not spat; or for their thinness, so the moistness that would drive them up by coughing does not grip them — rather the moistness sets without uprooting; or for the greatness of their quantity. If the chest humours are thick, drying is not tackled directly; softening and cutting are worked at, together with a gentle dissolving, the weightier of the two being the cutting — the care for cutting exceeding the care for dissolving (the book names honey-water and its manner of use in this chapter; it is not carried, per the rule) {cite:canon-ibn-sina-print-v2 p.305}"
  fr: "Dans cette description ancienne, les matières qui se forment dans le poumon peuvent être de la nature de l'humidité, du pus, du sang ou des matières chaudes et fluides. Les matières retenues dans le poumon peuvent être difficiles à expulser parce qu'elles sont trop épaisses et visqueuses pour être crachées, parce qu'elles sont trop fluides pour que l'humidité censée les faire remonter avec la toux puisse les saisir — cette humidité se fige alors sans les déloger —, ou parce qu'elles sont trop abondantes. Lorsque les humeurs de la poitrine sont épaisses, le texte ne décrit pas d'emblée leur dessèchement : il privilégie le ramollissement et la désagrégation, avec une dissolution progressive, en accordant plus d'attention à la désagrégation qu'à la dissolution. (Le livre mentionne dans ce chapitre l'eau miellée et son mode d'emploi, qui ne sont pas reproduits ici conformément à la règle.) {cite:canon-ibn-sina-print-v2 p.305}"
  ur: "پھیپھڑے میں بننے والی مواد رطوبت کی جنس کی بھی ہو سکتی ہیں صديد کی بھی اور خون اور باریک گرم مواد کی بھی؛ پھیپھڑے میں پھنسی مواد کو نکالنا مشکل ہو سکتا ہے: یا ان کی گاڑھی اور چپچپاہٹ سے کہ وہ تھوکی نہ جائیں یا ان کی باریکی سے کہ انہیں کھانسی سے اوپر دھکیلنے والی رطوبت ان پر گرفت نہ رکھے بلکہ رطوبت بغیر جڑ کھودے جم جائے یا ان کی بہتات کی شدت سے؛ اگر صدری اخلاط گاڑھے ہوں تو خشک کرنے کا سیدھا مباشرت نہیں بلکہ نرم کرنے اور کاٹنے میں مشغول رہا جاتا ہے ساتھ مؤدب تحلیل کے اور دونوں میں اہم تر کاٹنا ہے یعنی کاٹنے کی عنايت تحلیل سے زیادہ ہو ⁦(اس باب میں ماء العسل اور اس کے استعمال کا ذکر ہے جو اصول کے مطابق نہیں لایا گیا)⁩ {cite:canon-ibn-sina-print-v2 p.305}"
  es: "Las sustancias que se forman en los pulmones pueden ser de tipo húmedo, de tipo pus, de tipo sangre o de tipo líquido caliente. Las sustancias que se adhieren a los pulmones pueden ser difíciles de expulsar: bien por su espesor y viscosidad, impidiendo su expulsión; bien por su delgadez, de modo que la humedad que las expulsaría con la tos no las atrapa, sino que se asienta sin ser expulsadas; o bien por su gran cantidad. Si los humores del pecho son espesos, no se procede directamente al secado; se trabaja en el ablandamiento y la eliminación, junto con una disolución suave, siendo la eliminación la más importante, con mayor cuidado que la disolución (el libro menciona el agua con miel y su modo de uso en este capítulo; no se lleva consigo, según la regla). {cite:canon-ibn-sina-print-v2 p.305}"
