id: "concept/mabadi-ilaj-al-kazaz"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ علاج الكزاز"
  en: "Principles of the treatment of tetanus"
  ur: "كزاز کے علاج کے اصول"
summary:
  ar: "علاج الكزاز بعينه علاج التشنج، والكزاز أولى بأن يبادر إلى علاجه من التشنج لأن الكزاز مؤذ خانق قاتل؛ ويستعمل من المحاجم ما تسترجع به الحرارة خاصة على عضل العنق والفقارات والشراسيف، وإذا غذي أصحاب الكزاز لم يلقموا إلا لقماً صغاراً ضعافاً جداً وأزجوا بالحسو الرقيق لأن البلع يصعب عليهم {cite:canon-ibn-sina-print-v2 p.153} {cite:canon-ibn-sina-print-v2 p.154}"
  en: "Tetanus's treatment is convulsion's own treatment, and tetanus deserves hastening to its treatment more than convulsion, for tetanus is hurtful, suffocating, killing; of the cupping-glasses is used what restores heat, especially on the neck muscles, vertebrae and ribs' tips; when the tetanus patients are fed they are given only very small weak mouthfuls and thin sips, for swallowing is hard for them {cite:canon-ibn-sina-print-v2 p.153} {cite:canon-ibn-sina-print-v2 p.154}"
  ur: "کزاز کا علاج عین تشنج کا علاج ہے، اور کزاز تشنج سے زیادہ مستحق ہے کہ اس کے علاج میں جلدی کی جائے، کیونکہ کزاز مؤذی، دم گھونٹنے والا، قاتل ہے؛ اور محاجم میں سے وہ استعمال ہو جس سے حرارت واپس آئے خصوصاً گردن کی عضلوں، مہروں اور شراسیف پر؛ اور جب کزاز والوں کو غذا دی جائے تو انہیں بہت چھوٹے کمزور نوالے اور باریک جرعے دیے جائیں، کیونکہ ان کے لیے نگلنا مشکل ہے {cite:canon-ibn-sina-print-v2 p.153} {cite:canon-ibn-sina-print-v2 p.154}۔"
