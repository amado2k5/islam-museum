label:
  ar: "الولاية على المال"
  en: "Wilaya over property (fiqh)"
summary:
  ar: "الولاية على المال هي قدرة الشخص شرعاً على التصرف في ماله أو في مال غيره. وتتصل بالولاية على النفس، فكلتاهما تشتركان في تنفيذ القول على الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}\n\nسبب هذه الولاية عند الكاساني شيئان في التحقيق: الأبوة، والقضاء؛ فالجد من قبل الأب أب بواسطة، ووصي الأب والجد يستفيد الولاية منهما فهي ولاية الأبوة معنى، ووصي القاضي يستفيدها من القاضي فهي ولاية القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17901}"
  en: "Authority over property (al-wilaya 'ala al-mal) is, in the jurists' usage, the capacity under the law to dispose of one's own property or of another's. It is linked to authority over the person, since both carry the power to execute an order over another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}\n\nThe cause of this authority, in al-Kasani's analysis, is in truth two things: fatherhood and judgeship. The paternal grandfather is a father through an intermediary; the executor of the father or grandfather derives his authority from them, so it is in substance the authority of fatherhood; the judge's executor derives his from the judge, so it is the authority of judgeship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17901}"
