id: concept/wilaya-ala-al-mal
class: concept
kind: legal
label:
  ar: "الولاية على المال"
  en: "Wilaya over property (fiqh)"
  es: "Wilaya sobre la propiedad (fiqh)"
  fr: "Wilaya sur la propriété (fiqh)"
  ur: "ولایت پر جائیداد ⁦(فقہ)⁩"
summary:
  ar: "الولاية على المال هي قدرة الشخص شرعاً على التصرف في ماله أو في مال غيره. وتتصل بالولاية على النفس، فكلتاهما تشتركان في تنفيذ القول على الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}\n\nسبب هذه الولاية عند الكاساني شيئان في التحقيق: الأبوة، والقضاء؛ فالجد من قبل الأب أب بواسطة، ووصي الأب والجد يستفيد الولاية منهما فهي ولاية الأبوة معنى، ووصي القاضي يستفيدها من القاضي فهي ولاية القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17901}"
  en: "Authority over property (al-wilaya 'ala al-mal) is, in the jurists' usage, the capacity under the law to dispose of one's own property or of another's. It is linked to authority over the person, since both carry the power to execute an order over another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900}\n\nThe cause of this authority, in al-Kasani's analysis, is in truth two things: fatherhood and judgeship. The paternal grandfather is a father through an intermediary; the executor of the father or grandfather derives his authority from them, so it is in substance the authority of fatherhood; the judge's executor derives his from the judge, so it is the authority of judgeship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17901}"
  es: "La autoridad sobre la propiedad (al-wilaya 'ala al-mal) es, en el uso de los juristas, la capacidad, conforme a la ley, de disponer de la propia propiedad o de la ajena. Está vinculada a la autoridad sobre la persona, ya que ambas conllevan la facultad de ejecutar una orden sobre otra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900} La causa de esta autoridad, según el análisis de al-Kasani, reside en realidad en dos aspectos: la paternidad y la función judicial. El abuelo paterno es padre a través de un intermediario; el albacea del padre o abuelo deriva su autoridad de ellos, por lo que se trata, en esencia, de la autoridad de la paternidad; el albacea del juez deriva la suya del juez, por lo que se trata de la autoridad de la función judicial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17901}"
  fr: "L'autorité sur les biens (al-wilaya 'ala al-mal) est, selon l'usage des juristes, la capacité légale de disposer de ses propres biens ou de ceux d'autrui. Elle est liée à l'autorité sur la personne, car toutes deux confèrent le pouvoir d'exécuter un ordre sur autrui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17900} Selon l'analyse d'al-Kasani, cette autorité trouve son origine dans deux éléments: la filiation et la fonction de juge. Le grand-père paternel est un père par l'intermédiaire d'un autre; l'exécuteur testamentaire du père ou du grand-père tire son autorité de lui, il s'agit donc, en substance, de l'autorité de la filiation paternelle; l'exécuteur testamentaire du juge tire la sienne du juge, il s'agit donc de l'autorité de la fonction de juge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17901}"
  ur: "فقہا کے استعمال میں جائیداد پر اختیار ⁦(الولایۃ الا المال)⁩، قانون کے تحت اپنی یا کسی دوسرے کی ملکیت میں تصرف کرنے کی صلاحیت ہے۔ یہ شخص پر اختیار سے منسلک ہے، کیونکہ دونوں ایک دوسرے پر حکم چلانے کا اختیار رکھتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17900} الکاسانی کے تجزیے میں اس اختیار کا سبب درحقیقت دو چیزیں ہیں: ولدیت اور قضاوت۔ دادا ایک ثالث کے ذریعے باپ ہوتا ہے۔ باپ یا دادا کا عمل کرنے والا اپنا اختیار ان سے اخذ کرتا ہے، لہذا یہ اصل میں باپ کا اختیار ہے۔ جج کا عملدار جج سے اخذ کرتا ہے، لہذا یہ جج شپ کا اختیار ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 17901}"
