id: concept/absolute-poison-in-the-canon
class: concept
kind: scientific
label: { ar: "السم المطلق عند ابن سينا", en: "Absolute poison in the Canon", ur: "قانون میں مطلق زہر" }
summary:
  ar: "السم المطلق عند ابن سينا ما لا يتغير عن البدن في صورته الطبيعية، بل لا يزال يفعل وهو ثابت القوة والصورة حتى يفسد البدن. ولا يعني بذلك أنه لا يسخن في البدن بفعل الحار الغريزي، فأكثر السموم لا تؤثر ما لم تسخن في البدن بفعله {cite:canon-ibn-sina-print-v1 p.133}."
  en: "Absolute poison, for Ibn Sina, is what is not changed in its natural form by the body but keeps acting with its power and form unchanged until the body is corrupted. He does not mean that it is not warmed in the body by the innate heat, since most poisons have no effect until so warmed {cite:canon-ibn-sina-print-v1 p.133}."
