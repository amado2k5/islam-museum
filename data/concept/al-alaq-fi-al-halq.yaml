label:
  ar: "العلق في الحلق"
  en: "The leech in the throat"
  fr: "La sangsue dans la gorge"
  ur: "حلق میں جونک"
  es: "La sanguijuela en la garganta"
  tr: "Boğaz sülüğü"
  id: "Lintah tenggorokan"
summary:
  ar: "العلق قد يتفق أن يكون بعض المياه عالقة علقاً صغاراً خفية يذهل خفاؤها عن التحرز منها فتبلع وربما علقت في ظاهر الحلق وربما في باطن المريء وربما في المعدة فإذا امتصت من الدم مقداراً صالحاً ربت وظهر حجمها، ويعرض لمن علق به العلق غم وكرب ونفث دم فإذا رأيت الصحيح ينفث دماً رقيقاً أو يقيئه أحياناً تأمل حال حلقه فربما كانت به علقة، ويعالج المدرك منها بالبصر بعلاج الأخذ والنزع على ما يصف وبالأدوية من الغراغر إن كانت بقرب الحلق والبخورات ومنها السعوطات إن مالت إلى الأنف وبالمقيئات والمسهلات إن وقعت في الغور وفي المعدة ⁦(الأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.286}"
  en: "A leech: it may happen that some waters carry little hidden leeches whose smallness makes one heedless of guarding against them, so they are swallowed — perhaps clinging in the outer throat, perhaps inside the oesophagus, perhaps in the stomach; once they have sucked up a fair amount of blood they grow and their bulk shows. The one a leech has fastened on gets gloom, distress and spitting of blood; if you see a healthy man spitting thin blood or vomiting it sometimes, examine his throat — there may be a leech in it. What is perceived of it by sight is treated by the treatment of taking and pulling out as he describes, and by drugs of the gargles if near the throat, the fumigations — among them the snuffs if it leans to the nose — and the emetics and laxatives if it fell into the depth and the stomach (the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.286}"
  fr: "La sangsue : il peut arriver que certaines eaux portent de petites sangsues cachées dont la petitesse fait négliger de s’en garder, si bien qu’on les avale — tantôt elles s’accrochent dans la partie externe de la gorge, tantôt à l’intérieur de l’œsophage, tantôt dans l’estomac ; une fois qu’elles ont sucé une bonne quantité de sang, elles grossissent et leur volume devient visible. Celui à qui une sangsue s’est attachée éprouve de l’accablement, de l’angoisse et crache du sang ; si tu vois un homme en bonne santé cracher un sang ténu ou parfois en vomir, examine sa gorge — il peut s’y trouver une sangsue. Ce qu’on en perçoit à la vue se traite par la prise et l’extraction qu’il décrit, et par des remèdes de la famille des gargarismes si elle est près de la gorge, des fumigations — parmi elles les prises nasales si elle penche vers le nez — et des vomitifs et laxatifs si elle est tombée dans la profondeur et l’estomac (les noms de ce genre omis) {cite:canon-ibn-sina-print-v2 p.286}"
  ur: "جونک: ہو سکتا ہے کچھ پانیوں میں چھوٹی چھپی جونکیں ہوں جن کی خفیّت احتیاط سے غافل کر دے تو وہ نگل جائیں — کبھی ظاہر حلق میں کبھی مریء کے باطن میں کبھی معدے میں لگ جائیں؛ جب وہ خون کی مناسب مقدار چوس لیں تو بڑھی ہوں اور ان کا حجم ظاہر ہو؛ جس پر جونک لگے اسے غم کرب اور خون تھوکنا ہوتا ہے؛ اگر صحیح آدمی کو پتلا خون تھوکتے یا کبھی کبھار قے میں دیکھو تو اس کے حلق کی حال دیکھو کہ شاید اس میں جونک ہو؛ جو بصر سے پہچانی جائے اس کا علاج اس کے بیان کردہ پکڑ اور کھینچ کے علاج سے ہے اور ادویہ سے — قرب حلق ہو تو غراروں سے، ان میں سے سعوط اگر ناک کی طرف جھکے، اور مقیئات اور مسہلات سے اگر وہ گہرائی اور معدے میں اتر گئی ہو ⁦(اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.286}"
  es: "Una sanguijuela: puede ocurrir que algunas aguas contengan pequeñas sanguijuelas ocultas cuya pequeñez hace que uno se descuide al protegerse de ellas, por lo que se tragan, quizás adheridas a la garganta, quizás dentro del esófago, quizás en el estómago; una vez que han succionado una cantidad considerable de sangre, crecen y su tamaño se hace evidente. Quien tiene una sanguijuela adherida sufre decaimiento, angustia y expectoración de sangre; si ve a un hombre sano escupiendo sangre diluida o vomitándola ocasionalmente, examine su garganta: puede que tenga una sanguijuela. Lo que se percibe a simple vista se trata extrayéndola como él describe, y con medicamentos como gárgaras si está cerca de la garganta, fumigaciones —entre ellas el rapé si se inclina hacia la nariz— y eméticos y laxantes si cayó en el fondo del estómago (se omiten los nombres de estos últimos) {cite:canon-ibn-sina-print-v2 p.286}"
  tr: "Sülük, küçük ve gizli pençelerde bir su sıkışıp kaldığında ve gizlenmesi göz ardı edildiğinde yutulur. Ayrıca boğazın dışına yapışabilir, bazen yemek borusunun içinde, bazen midede de olabilir. Uygun miktarda kan emerse şişer ve boyutu görünür hale gelir. Sülükten etkilenen kişi keder, sıkıntı ve kan üfleme yaşayabilir. Doğru kişinin bazen ince kan üflediğini veya kusuyorsa, tıraş olurken bunu düşünmelisiniz ve sülük olabilir. Algılayan kişi görme ile tedavi edilir, boğaz yakınında ghugharr ve buruna doğru eğiliyorsa tütsü (soootat) gibi ilaçlar kullanılır (bu cinsin isimleri çıkarılmıştır) {cite:canon-ibn-sina-print-v2 s.286}"
  id: "Lintah ditelan ketika air terperangkap di kaki kecil dan tersembunyi dan persembunyian diabaikan. Lintah juga dapat menempel di bagian luar tenggorokan, kadang di dalam esofagus, kadang di perut. Jika menghisap darah dalam jumlah yang sesuai, lintah membengkak dan ukurannya menjadi terlihat. Orang yang terkena lintah mungkin mengalami kesedihan, stres, dan pendarahan. Jika orang yang tepat kadang-kadang meniup darah tipis atau muntah, Anda harus mempertimbangkan hal ini saat bercukur, dan bisa jadi itu lintah. Orang yang dirasakan diperlakukan dengan penglihatan, dan jika orang tersebut membungkuk ke arah tenggorokan, obat seperti ghugharr dan dupa (sooootat) digunakan di dekat tenggorokan (nama genus ini dihapus) {cite:canon-ibn-sina-print-v2 hlm.286}"
