id: "concept/ilaj-al-ramad-al-har"
class: "concept"
kind: "scientific"
label:
  ar: "علاج الرمد الحار والدموي والصفراوي والحمرة"
  en: "Treating hot, sanguineous, choleric ophthalmia and the humra"
  ur: "گرم، دموی، صفراوی رمد اور حمرہ کا علاج"
summary:
  ar: "التدبير المشترك لما كان من الرمد سببه مادة صفراوية أو دموية الفصد والاستفراغ ثم الروادع المبردة من العصارات وبياض البيض والألبان ثم تتدرج المنضجات مخلوطة بالروادع ثم المحللات كل على درجته ⁦(أسماء الأدوية والعصارات والمقادير لا تحمل)⁩ وإن كانت المادة دموية حجمت بعد الفصد وإن صفراوية استفرغت بما يخرج الصفراء والحمام بالماء العذب واجترأ على القابضات أولاً والحمرة يستعمل عليها الضماد القابض والتكميد الحار بعد الاستفراغ {cite:canon-ibn-sina-print-v2 p.173} {cite:canon-ibn-sina-print-v2 p.174}"
  en: "The shared regimen for ramad whose cause is a choleric or sanguineous matter is venesection and evacuation, then cooling repellents — the juices, white of egg and milks — then the maturatives graded, mixed at first with the repellents, then the dissolvents each in its turn ⁦(drug, juice names and measures are not carried)⁩; sanguineous matter gets cupping after venesection, choleric is evacuated by what expels the bile with fresh-water bathing and early boldness on astringents, and the humra after evacuation gets the astringent poultice and hot fomenting {cite:canon-ibn-sina-print-v2 p.173} {cite:canon-ibn-sina-print-v2 p.174}"
  ur: "اس رمد کی مشترک تدبیر جس کا سبب صفراوی یا دموی مادہ ہو فصد اور استفراغ ہے، پھر ٹھنڈے روادع — عصارے، انڈے کی سفیدی اور دودھ — پھر تدریجاً منضجات پہلے روادع سے ملے ہوئے، پھر محللات ہر ایک اپنے درجے پر ⁦(ادویہ، عصاروں کے نام اور مقدار منقول نہیں)⁩؛ دموی مادہ ہو تو فصد کے بعد حجامت؛ صفراوی ہو تو صفرا نکالنے والے سے استفراغ اور تازہ پانی کا حمام اور شروع میں قابضات پر اجتراء؛ اور حمرہ پر استفراغ کے بعد قابض ضماد اور گرم کمیدہ استعمال ہوتا ہے {cite:canon-ibn-sina-print-v2 p.173} {cite:canon-ibn-sina-print-v2 p.174}"
