summary:
  ar: "فلفلموية في الكتاب أقل الفلفل على ما قالوا، وخاصيته النفع من الأوجاع الباردة والتشنج وهو ينفع من النقرس، وفيه خاصية في القولنج والرياح الباردة فيما يقال {cite:canon-ibn-sina-print-v1 p.627}"
  en: "Filfilmuya is in the book, as they said, the least of the peppers; its special property is benefit in cold pains and spasm, it benefits gout, and it has a special property in colic and cold winds, as is said {cite:canon-ibn-sina-print-v1 p.627}"
  ur: "فلفلمویہ کتاب میں، جیسا کہ انہوں نے کہا، فلفل کی سب سے کم تر قسم ہے؛ اس کی خاصیت ٹھنڈے دردوں اور تشنج میں نفع ہے، نقرس میں نافع ہے، اور قولنج اور ٹھنڈی ہواؤں میں اس کی خاصیت ہے جیسا کہ کہا جاتا ہے {cite:canon-ibn-sina-print-v1 p.627}۔"
  es: "Filfilmuya está en el libro, como dijeron, la menor de las pimientas; su propiedad especial es beneficiosa para los dolores y espasmos causados por el frío, beneficia la gota y tiene una propiedad especial para los cólicos y los vientos fríos, como se dice {cite:canon-ibn-sina-print-v1 p.627}"
  fr: "Le piment Filfilmuya est, comme on le dit, le moins précieux des piments; sa propriété particulière est bénéfique contre les douleurs et les spasmes dus au froid, il est bénéfique contre la goutte, et il a une propriété particulière contre les coliques et les vents froids, comme il est dit {cite:canon-ibn-sina-print-v1 p.627}"
  tr: "Kitapta, 'Falmiyya' kelimesi biberler arasında en az olanıdır, denildiği gibi, soğuk ağrıları ve kramplar için faydalıdır, gut için de faydalıdır. Ayrıca kolik ve soğuk rüzgarlar için de özellikleri vardır, denildiği gibi. {cite:canon-ibn-sina-print-v1 s.627}"
  id: "Dalam buku, kata 'Falmiyya' adalah yang paling sedikit di antara cabai, seperti kata pepatah, dan sifatnya bermanfaat untuk nyeri dingin dan kram, serta bermanfaat untuk asam urat. Ia juga memiliki sifat untuk kolik dan angin dingin, seperti yang dikatakan. {cite:canon-ibn-sina-print-v1 hlm.627}"
