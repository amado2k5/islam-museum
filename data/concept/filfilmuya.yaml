summary:
  ar: "فلفلموية في الكتاب أقل الفلفل على ما قالوا، وخاصيته النفع من الأوجاع الباردة والتشنج وهو ينفع من النقرس، وفيه خاصية في القولنج والرياح الباردة فيما يقال {cite:canon-ibn-sina-print-v1 p.627}"
  en: "Filfilmuya is in the book, as they said, the least of the peppers; its special property is benefit in cold pains and spasm, it benefits gout, and it has a special property in colic and cold winds, as is said {cite:canon-ibn-sina-print-v1 p.627}"
  ur: "فلفلمویہ کتاب میں، جیسا کہ انہوں نے کہا، فلفل کی سب سے کم تر قسم ہے؛ اس کی خاصیت ٹھنڈے دردوں اور تشنج میں نفع ہے، نقرس میں نافع ہے، اور قولنج اور ٹھنڈی ہواؤں میں اس کی خاصیت ہے جیسا کہ کہا جاتا ہے {cite:canon-ibn-sina-print-v1 p.627}۔"
