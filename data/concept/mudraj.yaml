label:
  ar: "المدرج"
  en: "Mudraj (interpolated report)"
summary:
  ar: "المدرج عند ابن الصلاح أقسام: منها أن يُدرج في حديث النبي كلام بعض رواته فيُروى موصولاً به فيُتوهم أنه من الحديث، كقول ابن مسعود في آخر التشهد «فإذا قلت هذا فقد قضيت صلاتك» في رواية أبي خيثمة؛ ومنها أن يكون طرف من المتن عند الراوي بإسناد آخر فيُروى الجميع بالإسناد الأول، كحديث وائل بن حجر في صفة الصلاة؛ ومنها أن يُدرج في متن حديث بعض متن حديث آخر، كـ«ولا تنافسوا» في رواية ابن أبي مريم؛ ومنها أن يروي عن جماعة بينهم اختلاف في الإسناد فيسوقه على الاتفاق. ولا يجوز تعمد شيء من ذلك، وصنف فيه الخطيب «الفصل للوصل المدرج في النقل» {cite:muqaddima-ibn-salah-itr p. 95-98}."
  en: "Ibn al-Salah distinguishes several kinds of mudraj: words of a narrator inserted into the Prophet's hadith and transmitted as if part of it, like Ibn Mas'ud's 'when you have said this you have completed your prayer' at the end of the tashahhud in Abu Khaythama's version; part of a text that the narrator had through a second chain, transmitted with the first, as in Wa'il ibn Hujr's description of the prayer; part of another hadith's text inserted, like 'and do not compete' in Ibn Abi Maryam's version; and narrators whose chains differ presented as agreeing. None of this may be done deliberately; al-Khatib wrote al-Fasl li-l-Wasl al-Mudraj fi al-Naql on it."
