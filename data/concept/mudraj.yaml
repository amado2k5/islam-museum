label:
  ar: "المدرج"
  en: "Mudraj (interpolated report)"
  es: "Mudraj (informe interpolado)"
  fr: "Mudraj (rapport interpolé)"
  ur: "مدراج ⁦(انٹرپولیٹڈ رپورٹ)⁩"
  tr: "pist"
  id: "landasan pacu"
summary:
  ar: "المدرج عند ابن الصلاح أقسام: منها أن يُدرج في حديث النبي كلام بعض رواته فيُروى موصولاً به فيُتوهم أنه من الحديث، كقول ابن مسعود في آخر التشهد «فإذا قلت هذا فقد قضيت صلاتك» في رواية أبي خيثمة؛ ومنها أن يكون طرف من المتن عند الراوي بإسناد آخر فيُروى الجميع بالإسناد الأول، كحديث وائل بن حجر في صفة الصلاة؛ ومنها أن يُدرج في متن حديث بعض متن حديث آخر، كـ«ولا تنافسوا» في رواية ابن أبي مريم؛ ومنها أن يروي عن جماعة بينهم اختلاف في الإسناد فيسوقه على الاتفاق. ولا يجوز تعمد شيء من ذلك، وصنف فيه الخطيب «الفصل للوصل المدرج في النقل» {cite:muqaddima-ibn-salah-itr p. 95-98}."
  en: "Ibn al-Salah distinguishes several kinds of mudraj: words of a narrator inserted into the Prophet's hadith and transmitted as if part of it, like Ibn Mas'ud's 'when you have said this you have completed your prayer' at the end of the tashahhud in Abu Khaythama's version; part of a text that the narrator had through a second chain, transmitted with the first, as in Wa'il ibn Hujr's description of the prayer; part of another hadith's text inserted, like 'and do not compete' in Ibn Abi Maryam's version; and narrators whose chains differ presented as agreeing. None of this may be done deliberately; al-Khatib wrote al-Fasl li-l-Wasl al-Mudraj fi al-Naql on it."
  es: "Ibn al-Salah distingue varios tipos de mudraj: palabras de un narrador insertadas en el hadiz del Profeta y transmitidas como si formaran parte de él, como la frase de Ibn Mas'ud «cuando hayas dicho esto, habrás completado tu oración» al final del tashahhud en la versión de Abu Khaythama; parte de un texto que el narrador tenía a través de una segunda cadena, transmitido con la primera, como en la descripción de la oración de Wa'il ibn Hujr; parte del texto de otro hadiz insertado, como «y no compitas» en la versión de Ibn Abi Maryam; y narradores cuyas cadenas difieren, presentados como si coincidieran. Nada de esto puede hacerse deliberadamente; al-Khatib escribió al-Fasl li-l-Wasl al-Mudraj fi al-Naql al respecto."
  fr: "Ibn al-Salah distingue plusieurs types de mudraj: les paroles d'un narrateur insérées dans un hadith du Prophète et transmises comme faisant partie intégrante de celui-ci, à l'instar de la phrase d'Ibn Mas'ud: « Lorsque vous aurez dit cela, votre prière sera accomplie », à la fin du tashahhud dans la version d'Abu Khaythama; une partie d'un texte que le narrateur tenait par une seconde chaîne de transmission, transmise avec la première, comme dans la description de la prière par Wa'il ibn Hujr; une partie du texte d'un autre hadith insérée, comme « et ne rivalisez pas » dans la version d'Ibn Abi Maryam; et des narrateurs dont les chaînes de transmission divergent sont présentés comme étant d'accord. Aucun de ces mudraj ne peut être commis délibérément; al-Khatib a écrit à ce sujet dans son ouvrage al-Fasl li-l-Wasl al-Mudraj fi al-Naql."
  ur: "ابن الصلاح نے مدرج کی کئی قسموں میں فرق کیا ہے: ایک راوی کے الفاظ جو نبی کی حدیث میں داخل ہوتے ہیں اور گویا اس کا حصہ ہوتے ہیں، جیسے کہ ابن مسعود کا 'جب تم نے یہ کہا تو تم نے اپنی نماز مکمل کر لی' ابو خیثمہ کے نسخے میں تشہد کے آخر میں۔ ایک متن کا ایک حصہ جسے راوی نے دوسری زنجیر کے ذریعے منتقل کیا تھا، جیسا کہ وائل بن حجر کی نماز کی تفصیل میں ہے۔ ایک اور حدیث کے متن کا کچھ حصہ، جیسے ابن ابی مریم کے ورژن میں 'اور مقابلہ نہ کرو'؛ اور وہ راوی جن کی زنجیریں مختلف ہیں متفق کے طور پر پیش کی جاتی ہیں۔ اس میں سے کوئی بھی جان بوجھ کر نہیں کیا جا سکتا۔ الخطیب نے اس پر الفضل لل واصل المدرج فی النقل لکھا ہے۔"
  tr: "İbn al-Salah'a göre kategoriler vardır: bunlar arasında Peygamber'in hadislerine bazı rivayetçilerinin sözlerini eklemek ve bunlarla bağlantılı olarak rivayet etmek, kişinin yanlışlıkla bunun hadislerden geldiği sanmasını sağlamaktır; örneğin Ebu Haytame'nin rivayetinde İbn Mesud'un Taşahhud'un sonunda söylediği gibi: 'Bunu söylersen, namazını tamamlamış olursun'; metnin diğer bir kısmı anlatıcıyla birliktedir, bu yüzden herkes ilk zincirle rivayet edilir, örneğin Vebil bin Hacer'in duasını anlatan hadisleri; başka bir hadis metnine dahil edilen bir hadis, örneğin İbn Ebi Maryam'ın rivayetindeki 'Rekabet etmeyin' gibi; ve zincirinde farklı olan ve uzlaşma olarak yorumlayan bir gruptan rivayet edilmiştir. Bunların hiçbirini kasıtlı olarak atfetmek yasaktır ve vaiz 'El-Vesl Mesil-Medraj fi-el-Naql' (alıntı:) Muqaddima-ibn-Salah-itr s. 95-98}."
  id: "Menurut Ibn al-Salah, ada kategori: di antaranya adalah memasukkan kata-kata beberapa narator ke hadis Nabi, dan menceritakan yang terkait dengannya, sehingga seseorang keliru mengira bahwa itu berasal dari hadits, seperti pernyataan Ibn Mas'ud di akhir Tashahhud: 'Jika kamu mengatakan ini, kamu telah menyelesaikan doa' dalam riwayat Abu Khaythama; bagian lain dari teks ada di bagian narator, sehingga semua orang diceritakan dengan rantai pertama, seperti hadis Wa'il ibn Hajar yang menggambarkan doa; bagian lain dimasukkan dalam teks hadis lain, seperti 'Jangan bersaing' dalam riwayat Ibn Abi Maryam; dan diceritakan dari kelompok yang berbeda dalam rantainya dan menafsirkannya sebagai konsensus. Tidak diperbolehkan secara sengaja mengaitkan hal-hal ini, dan pendakwah menulis 'Al-Fasl li-Wasl al-Madraj fi al-Naql' {cite:Muqaddima-ibn-salah-itr hlm. 95-98}."
