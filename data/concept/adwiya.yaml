id: concept/adwiya
class: concept
kind: scientific
label:
  ar: "الأدوية"
  en: "Adwiya (drugs and materia medica in Islamic pharmacology)"
  fr: "Adwiya (drogues et matière médicale dans la pharmacologie islamique)"
  es: "Adwiya (fármacos y materia médica en la farmacología islámica)"
  ur: "عدویہ ⁦(اسلامی فارماکولوجی میں منشیات اور میٹیریا میڈیکا)⁩"
  tr: "İlaçlar"
  id: "İlaçlar"
summary:
  ar: "الأدوية جمع دواء، وهي كل ما يؤثر في بنية البدن من عقار يُستعمل علاجًا أو سمًّا؛ والصيدلة الإسلامية قامت على العلم اليوناني، وتُقسم الأدوية المفردة والمركبة، والنباتية والحيوانية والمعدنية {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}."
  en: "Adwiya, the plural of dawa, means every substance that affects the body, used as a remedy or a poison. Muslim pharmacology rested on Greek learning, distinguished simple from compound drugs and vegetable, animal and mineral drugs, and was enriched by Persian, Syriac and Indian names {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}."
  fr: "Adwiya, pluriel de dawa, désigne toute substance qui agit sur l’organisme, qu’elle serve de remède ou de poison. Fondée sur le savoir grec, la pharmacologie du monde musulman distinguait les drogues simples des composées ainsi que les drogues végétales, animales et minérales. Elle s’est enrichie de noms persans, syriaques et indiens {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}."
  es: "Adwiya, plural de dawa, significa toda sustancia que afecta al cuerpo, utilizada como remedio o veneno. La farmacología musulmana se basó en el saber griego, distinguió entre fármacos simples y compuestos, así como entre fármacos vegetales, animales y minerales, y se enriqueció con nombres persas, siríacos e indios {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}."
  ur: "عدویہ، دعوٰی کی جمع، کا مطلب ہے ہر وہ مادہ جو جسم کو متاثر کرتا ہے، علاج یا زہر کے طور پر استعمال ہوتا ہے۔ مسلم فارماکولوجی یونانی سیکھنے پر منحصر ہے، مرکب ادویات اور سبزیوں، جانوروں اور معدنی ادویات سے سادہ ممتاز ہے، اور اسے فارسی، سریانی اور ہندوستانی ناموں سے مالا مال کیا گیا ہے۔ 1 ص۔ 233}۔"
  tr: "İlaçlar, vücudun yapısını etkileyen her şeyi, örneğin tedavi veya zehir olarak kullanılan her şeyi ifade eden tıbbın çoğuludur; İslami eczacılık ise Yunan bilimine dayanır ve tek ile bileşik ilaçlar, bitkisel, hayvansal ve mineral ilaçlara ayrılmıştır {atıf:İslam Ansiklopedisi-2 cilt 1, s. 233}."
  id: "Obat adalah bentuk jamak dari obat yang merujuk pada segala sesuatu yang memengaruhi struktur tubuh, misalnya, apa pun yang digunakan sebagai pengobatan atau racun; Sementara itu, farmasi Islam didasarkan pada ilmu pengetahuan Yunani dan dibagi menjadi obat tunggal dan majemuk, obat herbal, hewan, dan mineral {kutipan: Ensiklopedia Islam-2, volume 1, hlm. 233}."
