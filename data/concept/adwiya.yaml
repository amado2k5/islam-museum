  ar: "الأدوية"
  en: "Adwiya (drugs and materia medica in Islamic pharmacology)"
summary:
  ar: "الأدوية جمع دواء، وهي كل ما يؤثر في بنية البدن من عقار يُستعمل علاجًا أو سمًّا؛ والصيدلة الإسلامية قامت على العلم اليوناني، وتُقسم الأدوية المفردة والمركبة، والنباتية والحيوانية والمعدنية {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}."
  en: "Adwiya, the plural of dawa, means every substance that affects the body, used as a remedy or a poison. Muslim pharmacology rested on Greek learning, distinguished simple from compound drugs and vegetable, animal and mineral drugs, and was enriched by Persian, Syriac and Indian names {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}."
