id: concept/marifat-al-ras-wa-ajzaih
class: concept
kind: scientific
label:
  ar: "معرفة الرأس وأجزائه"
  en: "The head and its parts"
  ur: "سر اور اس کے اجزا کی پہچان"
  es: "La cabeza y sus partes"
  fr: "La tête et ses parties"
  tr: "Başı ve parçalarını bilmek"
  id: "Mengenal kepala dan bagian-bagiannya"
summary:
  ar: "في أول الكتاب الثالث يذكر ابن سينا، نقلاً عن جالينوس، الغرض من خلقة الرأس، ثم أجزاءه الذاتية بالترتيب من الشعر إلى العظم الذي هو قاعدة الدماغ {cite:canon-ibn-sina-print-v2 p.5}"
  en: "At the start of Book III Ibn Sina gives, from Galen, the purpose for which the head was created, and then its own parts in order, from the hair to the bone that is the base of the brain {cite:canon-ibn-sina-print-v2 p.5}"
  ur: "کتاب سوم کے آغاز میں ابن سینا جالینوس کے حوالے سے سر کی تخلیق کا مقصد بیان کرتا ہے، پھر اس کے ذاتی اجزا ترتیب سے بتاتا ہے، بال سے لے کر اس ہڈی تک جو دماغ کی بنیاد ہے {cite:canon-ibn-sina-print-v2 p.5}۔"
  es: "Al comienzo del Libro III, Ibn Sina cita a Galeno para explicar el propósito de la creación de la cabeza y, a continuación, sus partes en orden, desde el cabello hasta el hueso que constituye la base del cerebro {cite:canon-ibn-sina-print-v2 p.5}."
  fr: "Au début du Livre III, Ibn Sina donne, d'après Galien, le but pour lequel la tête a été créée, puis ses différentes parties dans l'ordre, des cheveux à l'os qui constitue la base du cerveau {cite:canon-ibn-sina-print-v2 p.5}"
  tr: "Üçüncü kitabın başında, İbn Sina, Galen'den alıntı yaparak, beynin temeli olan saçtan kemiğe kadar başın ve ardından iç kısımlarının sırayla yaratılmasının amacından bahseder {atıf:kanon-ibn-sina-print-v2 s.5}"
  id: "Di awal buku ketiga, Avicenna, mengutip Galen, menyebutkan tujuan menciptakan kepala, lalu bagian dalamnya secara berurutan, dari rambut hingga tulang, yang merupakan dasar otak {cite:canon-ibn-sina-print-v2 hlm.5}"
