id: concept/motive-faculty
class: concept
kind: scientific
label: { ar: "القوة النفسانية المحركة عند ابن سينا", en: "The psychic motive faculty in the Canon", ur: "قانون میں نفسانی محرک قوت", es: "La facultad de motivación psíquica en el Canon", fr: "La faculté de motivation psychique dans le Canon", tr: "İbn Sina'nın Psikolojik İtici Gücü", id: "Kekuatan Pendorong Psikologis Ibn Sina" }
summary:
  ar: "في الفصل السادس يصف ابن سينا القوة المحركة بأنها التي تشنج الأوتار وترخيها فتحرك الأعضاء والمفاصل، وهي جنس يتنوع بحسب مبادئ الحركات وتابعة لحكم الوهم الموجب للإجماع {cite:canon-ibn-sina-print-v1 p.101}."
  en: "In the sixth chapter Ibn Sina describes the motive faculty as that which tightens and slackens the tendons and so moves the organs and joints; it is a genus that varies with the origins of movements and follows the judgment of estimation that brings about resolve {cite:canon-ibn-sina-print-v1 p.101}."
  es: "En el sexto capítulo, Ibn Sina describe la facultad motriz como aquella que tensa y afloja los tendones y así mueve los órganos y las articulaciones; es un género que varía con los orígenes de los movimientos y sigue el juicio de estimación que produce resolución {cite:canon-ibn-sina-print-v1 p.101}."
  fr: "Dans le sixième chapitre, Ibn Sina décrit la faculté motrice comme celle qui resserre et relâche les tendons et qui, de ce fait, met en mouvement les organes et les articulations; c'est un genre qui varie selon les origines des mouvements et qui suit le jugement d'estimation qui conduit à la résolution {cite:canon-ibn-sina-print-v1 p.101}."
  ur: "چھٹے باب میں ابن سینا نے محرک فیکلٹی کی وضاحت کی ہے جو کنڈرا کو سخت اور سست کرتی ہے اور اسی طرح اعضاء اور جوڑوں کو حرکت دیتی ہے۔ یہ ایک ایسی نسل ہے جو نقل و حرکت کی ابتداء کے ساتھ مختلف ہوتی ہے اور اندازے کے فیصلے کی پیروی کرتی ہے جو حل کو جنم دیتی ہے"
  tr: "Altıncı bölümde, İbn Sina, itici gücü telleri gerip gevşeterek uzuvların ve eklemlerin hareketine neden olan unsur olarak tanımlar. Bu, hareketlerin ilkelerine göre değişen ve oybirliğiyle yanılsama kuralına uyan bir cinstir {cite:canon-ibn-sina-print-v1 s.101}."
  id: "Pada bab keenam, Ibn Sina menggambarkan kekuatan pendorong sebagai apa yang menegangkan dan mengendurkan senar, menyebabkan gerakan anggota tubuh dan sendi. Ini adalah genus yang bervariasi menurut prinsip gerakan dan mengikuti aturan ilusi bulat {cite:canon-ibn-sina-print-v1 hlm.101}."
