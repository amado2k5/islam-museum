summary:
  ar: "في الفصل السادس يصف ابن سينا القوة المحركة بأنها التي تشنج الأوتار وترخيها فتحرك الأعضاء والمفاصل، وهي جنس يتنوع بحسب مبادئ الحركات وتابعة لحكم الوهم الموجب للإجماع {cite:canon-ibn-sina-print-v1 p.101}."
  en: "In the sixth chapter Ibn Sina describes the motive faculty as that which tightens and slackens the tendons and so moves the organs and joints; it is a genus that varies with the origins of movements and follows the judgment of estimation that brings about resolve {cite:canon-ibn-sina-print-v1 p.101}."
