label: { ar: "حبل الحبلة", en: "Habl al-habala (the offspring of the offspring)", ur: "حبل الحبلہ" }
summary:
  ar: "حبل الحبلة في اللغة ولد الجنين الذي في بطن الناقة، وفي الاصطلاح نتاج النتاج، وهو بيع ما سيحمله الحمل بعد أن يولد. وقد اتفق الفقهاء على أن بيعه حرام وأن العقد باطل، واختلفوا في المعنى المنهي عنه في حديث ابن عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6790}"
  en: "Habl al-habala means, in the lexicon, the young carried in a she-camel's womb, and in the technical sense the offspring of an offspring: a female animal bears, then her daughter bears. The jurists agree that selling it is forbidden and the contract void, and they differ on what the hadith of Ibn Umar forbids. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6790}"
  ur: "حبل الحبلہ لغت میں اونٹنی کے پیٹ کے بچے کو کہتے ہیں، اور اصطلاح میں نتاج النتاج یعنی جانور کا بچہ جنے، پھر اس کی بیٹی بچہ جنے۔ فقہاء کے نزدیک اس کی بیع حرام اور عقد باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6790}"
