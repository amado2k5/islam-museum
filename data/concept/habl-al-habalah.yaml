label: { ar: "حبل الحبلة", en: "Habl al-habala (the offspring of the offspring)", ur: "حبل الحبلہ", es: "Habl al-habala (la descendencia de la descendencia)", fr: "Habl al-habala (la descendance de la descendance)", tr: "halat ipi", id: "tali tali" }
summary:
  ar: "حبل الحبلة في اللغة ولد الجنين الذي في بطن الناقة، وفي الاصطلاح نتاج النتاج، وهو بيع ما سيحمله الحمل بعد أن يولد. وقد اتفق الفقهاء على أن بيعه حرام وأن العقد باطل، واختلفوا في المعنى المنهي عنه في حديث ابن عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6790}"
  en: "Habl al-habala means, in the lexicon, the young carried in a she-camel's womb, and in the technical sense the offspring of an offspring: a female animal bears, then her daughter bears. The jurists agree that selling it is forbidden and the contract void, and they differ on what the hadith of Ibn Umar forbids. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6790}"
  ur: "حبل الحبلہ لغت میں اونٹنی کے پیٹ کے بچے کو کہتے ہیں، اور اصطلاح میں نتاج النتاج یعنی جانور کا بچہ جنے، پھر اس کی بیٹی بچہ جنے۔ فقہاء کے نزدیک اس کی بیع حرام اور عقد باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6790}"
  es: "Habl al-habala significa, en el léxico, la cría gestada en el vientre de una camella, y en sentido técnico, la descendencia de una descendencia: una hembra parió, y luego su hija parió. Los juristas coinciden en que su venta está prohibida y el contrato es nulo, pero difieren en lo que prohíbe el hadiz de Ibn Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6790}"
  fr: "Habl al-habala signifie, dans le lexique, le petit porté dans le ventre d'une chamelle, et, au sens technique, la progéniture d'une progéniture: une femelle met bas, puis sa fille met bas. Les juristes s'accordent à dire que la vente de ce petit est interdite et le contrat nul, mais ils divergent quant à ce que le hadith d'Ibn Umar interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6790}"
  tr: "Dilbilimde 'hab al-habala' deve rahminde doğan fetüsü ifade ederken, terminolojide 'yavruların ürünü' yani fetüsün doğumdan sonra taşıyacağı şeyin satışını ifade eder. Hukukçular, satışın yasak olduğu ve sözleşmenin geçersiz olduğu konusunda hemfikir olmuş, İbn Ömer hadisindeki yasak anlam konusunda ise farklı görüşler bildirmişlerdir. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.6789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6790}"
  id: "Dalam linguistik, 'hab al-habala' merujuk pada janin yang lahir dalam rahim unta, dan dalam istilah 'produk keturunan,' yaitu penjualan apa yang akan dibawa janin setelah lahir. Para ahli hukum sepakat bahwa penjualannya dilarang dan kontrak batal, dan mereka berbeda pendapat mengenai makna yang dilarang dalam hadis Ibn Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6789} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.6790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6790}"
