label: { ar: "الأطلية والأضمدة عند ابن سينا", en: "Paints and plasters as treatments that reach the disease itself", ur: "قانون میں لیپ اور ضماد جو مرض تک پہنچتے ہیں" }
summary:
  ar: "يعد ابن سينا الطلاء من المعالجات الواصلة إلى نفس المرض، ويقول إن للدواء قوتين لطيفة وكثيفة والحاجة إلى اللطيفة أكثر، ويفرق بين الأضمدة المتماسكة والأطلية السيالة، ويذكر الخرق المبخرة بالعود الخام للأعضاء الرئيسة {cite:canon-ibn-sina-print-v1 p.289}."
  en: "Ibn Sina counts the paint among the treatments that reach the disease itself, says a drug may have a fine and a dense power and the fine is the more needed, distinguishes the cohesive plaster from the flowing paint, and notes cloths fumigated with raw aloeswood for the principal organs {cite:canon-ibn-sina-print-v1 p.289}."
