id: concept/canon-paints-and-plasters-as-treatment-reaching-the-disease
class: concept
kind: scientific
label:
  ar: "الأطلية والأضمدة عند ابن سينا"
  en: "Paints and plasters as treatments that reach the disease itself"
  fr: "Enduits et emplâtres atteignant la maladie dans le Canon"
  ur: "قانون میں لیپ اور ضماد جو مرض تک پہنچتے ہیں"
  es: "Pinturas y yesos como tratamientos que llegan a la enfermedad misma."
summary:
  ar: "يعد ابن سينا الطلاء من المعالجات الواصلة إلى نفس المرض، ويقول إن للدواء قوتين لطيفة وكثيفة والحاجة إلى اللطيفة أكثر، ويفرق بين الأضمدة المتماسكة والأطلية السيالة، ويذكر الخرق المبخرة بالعود الخام للأعضاء الرئيسة {cite:canon-ibn-sina-print-v1 p.289}."
  en: "Ibn Sina counts the paint among the treatments that reach the disease itself, says a drug may have a fine and a dense power and the fine is the more needed, distinguishes the cohesive plaster from the flowing paint, and notes cloths fumigated with raw aloeswood for the principal organs {cite:canon-ibn-sina-print-v1 p.289}."
  fr: "Ibn Sina compte l’enduit parmi les moyens atteignant le mal lui-même ; distingue forces subtile et dense, la première plus nécessaire, emplâtre cohésif et enduit coulant, et linges fumigés au bois d’aloès cru pour organes principaux {cite:canon-ibn-sina-print-v1 p.289}."
  es: "Ibn Sina incluye la pintura entre los tratamientos que llegan a la enfermedad misma, dice que un medicamento puede tener un poder fino y denso y que el fino es el más necesario, distingue el yeso cohesivo de la pintura fluida y señala telas fumigadas con madera de aloe cruda para los órganos principales {cite:canon-ibn-sina-print-v1 p.289}."
