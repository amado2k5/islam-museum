id: concept/inheritance-system
education:
  did_you_know:
    ar: "يرى محمد البهي أن نظام الإرث يقوم على تفتيت المال الموروث لا على حفظه، وأن الفرائض المحددة (النصف والثلث والربع والسدس) تمنع التكديس وتدفع الورثة إلى العمل."
    en: "Muhammad al-Bahi argues the inheritance system fragments rather than preserves an estate: the fixed shares — half, third, quarter, sixth — prevent hoarding and push the heirs to work."
    ur: "محمد البہی کے نزدیک وراثت کا نظام موروثہ مال کو تقسیم کرتا ہے سنبھال کر نہیں رکھتا — مقررہ حصے (آدھا، تہائی، چوتھائی، چھٹائی) ذخیرہ اندوزی روکتے ہیں اور وارثوں کو کام پر مائل کرتے ہیں۔"
    sources: [source/al-islam-fitrat-allah-azhar, source/usul-iqtisad-islami-0660]
class: concept
kind: legal
label:
  ar: نظام الإرث في الإسلام
  en: Islamic inheritance system
summary:
  ar: "يرى محمد البهي في «الإسلام فطرة الله» أن نظام الإرث يقوم على تفتيت المال الموروث لا على المحافظة عليه، وأن الفرائض المحددة بالوصف والكسر (النصف والثلث والربع والسدس) تمنع التكديس وتجعل الورثة يعملون ولا يعتمدون على المدخر وحده {cite:al-islam-fitrat-allah-azhar p. 135} {cite:al-islam-fitrat-allah-azhar p. 136}. ويقارن ذلك بنظام التوريث الأوروبي الذي حفظ اللقب والمال لواحد من الأبناء، ويصفه بأنه أقرب إلى تخليد الشخص {cite:al-islam-fitrat-allah-azhar p. 137}. وفي الوصية يرى أن الغاية من حديث «لا وصية لوارث» منع إخراج المال من التفتيت إلى الأقارب الوارثين، ويقرر أن الوصية تقف عند الثلث، وأن ترك الورثة أغنياء خير من تركهم عالة {cite:al-islam-fitrat-allah-azhar p. 140} {cite:al-islam-fitrat-allah-azhar p. 142}."
  en: "Al-Bahi reads the Islamic inheritance system as breaking up inherited wealth rather than keeping it whole: fixed shares stated in fractions prevent accumulation and push heirs to work (pp. 135-136). He contrasts it with a European system that kept a title and estate in one heir's hand (p. 137). On bequests he reads the hadith 'no bequest to an heir' as a rule against shifting wealth back toward heirs, and holds that the bequest stops at one third, citing the report of Sa'd ibn Abi Waqqas (pp. 140, 142). These are the author's readings."
