id: concept/fitra
education:
  did_you_know:
    ar: "الفطرة عند محمد فريد وجدي فطرة النفس على التدين، وأن الإسلام هو نفس تلك الفطرة، ويرى أن الدين شعور بالارتباط الطبيعي بين الإنسان وروح الكون."
    en: "For Muhammad Farid Wajdi the fitra is the soul's natural bent toward religion — Islam being that very fitra — and religion a felt natural bond between the human and the spirit of the cosmos."
    ur: "محمد فرید وجدی کے نزدیک فطرت روح کی مذہب کی طرف قدرتی رغبت ہے — اور اسلام اسی فطرت کا نام — اور دین انسان اور کائنات کی روح کے درمیان قدرتی تعلق کا شعور ہے۔"
    sources: [source/sufara-al-islam-azhar, source/al-islam-din-amm-khalid-azhar]
class: concept
kind: doctrine
label: { ar: "الفطرة", en: "Fitra (innate disposition)", es: "Fitra (disposición innata)", fr: "Fitra (prédisposition innée)" }
summary:
  ar: "الفطرة في الكتاب الذي عرضه محمد فريد وجدي فطرة النفس على التدين، وأن الإسلام هو نفس تلك الفطرة؛ ويرى المؤلف أن الدين شعور بالارتباط الطبيعي بين الإنسان وروح الكون، وأن الإنسان لا يستطيع أن يعيش بلا دين {cite:al-islam-din-amm-khalid-azhar p. 36}. هذه قراءة المؤلف الفلسفية، وتُعرض بوصفها رأيه، ولا تُنسب إلى الإجماع."
  en: "In Muhammad Farid Wajdi's book, fitra is the human soul's disposition to religion, which he identifies with Islam itself. He defines religion as a natural sense of connection between the human being and the spirit of the universe. This is the author's philosophical reading, presented as his view and not as a consensus {cite:al-islam-din-amm-khalid-azhar p. 36}."
  es: "En el libro de Muhammad Farid Wajdi, la fitra es la predisposición del alma humana hacia la religión, que él identifica con el Islam mismo. Define la religión como un sentido natural de conexión entre el ser humano y el espíritu del universo. Esta es la interpretación filosófica del autor, presentada como su punto de vista y no como un consenso {cite:al-islam-din-amm-khalid-azhar p. 36}."
  fr: "Dans son ouvrage, Muhammad Farid Wajdi définit la fitra comme la disposition de l'âme humaine à la religion, qu'il assimile à l'islam. Il conçoit la religion comme un lien naturel entre l'être humain et l'esprit de l'univers. Telle est l'interprétation philosophique de l'auteur, présentée comme son point de vue personnel et non comme un consensus (voir: al-islam-din-amm-khalid-azhar, p. 36)."
