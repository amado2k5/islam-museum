label: { ar: "الفطرة", en: "Fitra (innate disposition)" }
summary:
  ar: "الفطرة في الكتاب الذي عرضه محمد فريد وجدي فطرة النفس على التدين، وأن الإسلام هو نفس تلك الفطرة؛ ويرى المؤلف أن الدين شعور بالارتباط الطبيعي بين الإنسان وروح الكون، وأن الإنسان لا يستطيع أن يعيش بلا دين {cite:al-islam-din-amm-khalid-azhar p. 36}. هذه قراءة المؤلف الفلسفية، وتُعرض بوصفها رأيه، ولا تُنسب إلى الإجماع."
  en: "In Muhammad Farid Wajdi's book, fitra is the human soul's disposition to religion, which he identifies with Islam itself. He defines religion as a natural sense of connection between the human being and the spirit of the universe. This is the author's philosophical reading, presented as his view and not as a consensus {cite:al-islam-din-amm-khalid-azhar p. 36}."
