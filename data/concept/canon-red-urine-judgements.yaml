summary:
  ar: "يقارن ابن سينا في الأمراض الحادة بين الأحمر والمائي والأبيض، ويفرق بين الأحمر الدموي والصفراوي، ويذكر أن الأحمر القاني في أمراض الكلية رديء وأن بقاءه أحمر بلا رسوب مخوف {cite:canon-ibn-sina-print-v1 p.188}."
  en: "In acute diseases Ibn Sina compares red, watery and white urine and distinguishes blood-red from bile-red, saying that deep red in kidney diseases is bad and that urine that stays red with no sediment is fearful {cite:canon-ibn-sina-print-v1 p.188}."
