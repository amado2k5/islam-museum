id: concept/canon-red-urine-judgements
class: concept
kind: scientific
label:
  ar: "أحكام البول الأحمر عند ابن سينا"
  en: "Judgements on red urine in the Canon"
  fr: "Interprétation de l’urine rouge dans le Canon"
  ur: "سرخ پیشاب پر احکام قانون میں"
  es: "Juicios sobre la orina roja en el Canon"
  tr: "İbn Sina'ya göre Kırmızı İdrar Kararları"
  id: "Putusan tentang Urin Merah menurut Ibn Sina"
summary:
  ar: "يقارن ابن سينا في الأمراض الحادة بين الأحمر والمائي والأبيض، ويفرق بين الأحمر الدموي والصفراوي، ويذكر أن الأحمر القاني في أمراض الكلية رديء وأن بقاءه أحمر بلا رسوب مخوف {cite:canon-ibn-sina-print-v1 p.188}."
  en: "In acute diseases Ibn Sina compares red, watery and white urine and distinguishes blood-red from bile-red, saying that deep red in kidney diseases is bad and that urine that stays red with no sediment is fearful {cite:canon-ibn-sina-print-v1 p.188}."
  fr: "Dans les maladies aiguës, Ibn Sina compare urines rouge, aqueuse et blanche, distingue rouge sanguin et bilieux, juge défavorable le rouge foncé des maladies rénales et inquiétant un rouge persistant sans sédiment {cite:canon-ibn-sina-print-v1 p.188}."
  es: "En enfermedades agudas, Ibn Sina compara la orina roja, acuosa y blanca, y distingue el rojo sangre del rojo bilis, diciendo que el rojo intenso en enfermedades renales es malo y que la orina que permanece roja sin sedimento es temible {cite:canon-ibn-sina-print-v1 p.188}."
  ur: "شدید امراض میں ابن سینا سرخ، پانی دار اور سفید پیشاب کا موازنہ کرتے ہیں اور خون کے سرخ رنگ کو صفرا کے سرخ سے ممتاز کرتے ہیں اور کہتے ہیں کہ گردے کی بیماریوں میں گہرا سرخ رنگ برا ہے اور وہ پیشاب جو سرخ رہے بغیر تلچھٹ خوفناک ہے۔"
  tr: "İbn Sina, akut hastalıklarda kırmızı, sulu ve beyazı karşılaştırır; kanlı kırmızı ile safra kırmızısı arasında ayrım yapar; böbrek hastalıklarında belirgin kırmızının zayıf olduğunu ve birikintisiz kırmızı olarak kalıcılığının endişe verici olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.188}."
  id: "Ibn Sina membandingkan merah, berair, dan putih dalam penyakit akut, membedakan antara merah berdarah dan merah empedu, menyebutkan bahwa merah yang jelas pada penyakit ginjal buruk dan bahwa kebertahannya sebagai merah tanpa endapan sangat mengkhawatirkan {cite:canon-ibn-sina-print-v1 hlm.188}."
