  es: "Kahriba (ámbar)"
summary:
  ar: "الكهربا صمغ يشبه السندروس، مكسر إلى الصفرة والبياض، يجذب التبن والهشيم إلى نفسه، وسُمّي بالفارسية سالب التبن. وصفه الكتاب حارا قليلا يابسا في الثانية، قابضا خصوصا للدم."
  en: "Kahriba is a resin like sandarac, in colours from yellow to white and sometimes reddish, which draws straw and chaff to itself, and so is called by a Persian name meaning straw-taker. The book classes it as slightly hot and dry in the second degree, and as an astringent especially for blood."
  ur: "کہربا ایک گوند ہے جو سنڈراک جیسا ہوتا ہے، پیلا، سفید اور کبھی سرخی مائل، اور تنکوں اور بھوسے کو اپنی طرف کھینچتا ہے؛ اسی لیے فارسی میں اس کا نام تنکا کھینچنے والا ہے۔ کتاب اسے دوسرے درجے میں ہلکا گرم اور خشک بتاتی ہے، اور خاص کر خون کو روکنے والا کسیلا مانتی ہے۔"
  es: "La kahriba es una resina similar al sandáraca, de colores que van del amarillo al blanco y a veces rojizo, que atrae la paja y la cáscara, por lo que recibe un nombre persa que significa \"recolector de paja\". El libro la clasifica como ligeramente caliente y seca en segundo grado, y como astringente, especialmente para la sangre."
