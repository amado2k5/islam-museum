summary:
  ar: "المرارات جمع مرارة وهي مرارات الحيوان، حارة يابسة في الرابعة جلاءة، تختلف بحسب الحيوان والذكر والأنثى وحالة العطش والجوع، وينتفع بها في الجلد والجراحات والأذن والعين والبواسير والسموم {cite:canon-ibn-sina-print-v1 p.560} {cite:canon-ibn-sina-print-v1 p.562}."
  en: "Mararat are the galls of animals, hot and dry in the fourth degree and cleansing, varying with the animal, with sex and with thirst and hunger; the book lists them for the skin, wounds, the ear, eye, piles and poisons {cite:canon-ibn-sina-print-v1 p.560} {cite:canon-ibn-sina-print-v1 p.562}."
  ur: "مرارات جانوروں کے پتے ہیں، چوتھے درجے میں گرم خشک اور جلا دینے والے، جانور، نر و مادہ اور پیاس و بھوک کی حالت کے مطابق بدلتے ہیں؛ کتاب جلد، زخموں، کان، آنکھ، بواسیر اور زہروں میں ان کا ذکر کرتی ہے {cite:canon-ibn-sina-print-v1 p.560} {cite:canon-ibn-sina-print-v1 p.562}۔"
