id: concept/mararat
class: concept
kind: natural
label:
  ar: "مرارات"
  en: "Mararat (galls of animals)"
  ur: "مرارات"
  es: "Mararat (bilis de animales)"
  fr: "Mararat (galles d'animaux)"
  tr: "acılık"
  id: "kepahitan"
summary:
  ar: "المرارات جمع مرارة وهي مرارات الحيوان، حارة يابسة في الرابعة جلاءة، تختلف بحسب الحيوان والذكر والأنثى وحالة العطش والجوع، وينتفع بها في الجلد والجراحات والأذن والعين والبواسير والسموم {cite:canon-ibn-sina-print-v1 p.560} {cite:canon-ibn-sina-print-v1 p.562}."
  en: "Mararat are the galls of animals, hot and dry in the fourth degree and cleansing, varying with the animal, with sex and with thirst and hunger; the book lists them for the skin, wounds, the ear, eye, piles and poisons {cite:canon-ibn-sina-print-v1 p.560} {cite:canon-ibn-sina-print-v1 p.562}."
  ur: "مرارات جانوروں کے پتے ہیں، چوتھے درجے میں گرم خشک اور جلا دینے والے، جانور، نر و مادہ اور پیاس و بھوک کی حالت کے مطابق بدلتے ہیں؛ کتاب جلد، زخموں، کان، آنکھ، بواسیر اور زہروں میں ان کا ذکر کرتی ہے {cite:canon-ibn-sina-print-v1 p.560} {cite:canon-ibn-sina-print-v1 p.562}۔"
  es: "Las mararat son las bilis de los animales, calientes y secas en el cuarto grado y purificadoras, que varían según el animal, el sexo, la sed y el hambre; el libro las enumera para la piel, las heridas, el oído, el ojo, las hemorroides y los venenos {cite:canon-ibn-sina-print-v1 p.560} {cite:canon-ibn-sina-print-v1 p.562}."
  fr: "Les Mararat sont les galles des animaux, chaudes et sèches au quatrième degré et purifiantes, variant selon l'animal, le sexe et selon la soif et la faim; le livre les énumère pour la peau, les plaies, l'oreille, l'œil, les hémorroïdes et les poisons {cite:canon-ibn-sina-print-v1 p.560} {cite:canon-ibn-sina-print-v1 p.562}."
  tr: "Al-mararat, hayvanın acılığı olan acılığın çoğuludur. Dördüncü terim 'jala'a' olarak kuru, sıcak ve sıcak bir hayvandır. Hayvana, erkek, dişi ve susuzluk ile açlık durumuna göre değişir. Deri, ameliyat, kulak, gözler, hemoroidler ve zehirlerde kullanılır {cite:canon-ibn-sina-print-v1 s.560} {cite:canon-ibn-sina-print-v1 s.562}."
  id: "Al-mararat adalah bentuk jamak dari kepahitan, yaitu kepahitan hewan. Ini adalah hewan kering yang panas dan panas dalam istilah keempat 'jala'a'. Ia bervariasi tergantung pada hewan, jantan, betina, dan keadaan haus serta kelaparan. Digunakan dalam kulit, operasi, telinga, mata, wasir, dan racun {cite:canon-ibn-sina-print-v1 hlm.560} {cite:canon-ibn-sina-print-v1 hlm.562} {cite:canon-ibn-sina-print-v1 hlm.562}."
