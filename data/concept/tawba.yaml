id: concept/tawba
class: concept
kind: ethical
label: { ar: "التوبة", en: "Tawba (repentance)" }
summary:
  ar: "المفهوم الذي تدور عليه قصة الثلاثة المخلفين: توبة الله عليهم بعد خمسين ليلة، وما عدّه كعب بن مالك من توبته: الانخلاع من المال وترك الكذب."
  en: "The concept around which the story of the three left behind turns: God's acceptance of their repentance after fifty nights, and what Ka'b ibn Malik counted as his repentance: giving up his wealth and leaving lying."
wings: [ideas]
periods: [period/prophetic-era]
regions: [arabia]
perspectives:
- tradition: sunni
  id: sunni-sharawi-three-stages
  stance:
    ar: "التوبة من الله تشريع ثم قبول، ووسطها توبة العبد، وفي تشريعها حماية للمجتمع"
    en: "Repentance from God is first legislation and then acceptance, with the servant's repentance between them; its legislation protects society"
  summary:
    ar: "يذكر الشعراوي في تفسير آية كفارة القتل الخطأ أن «التوبة من الله» لها ثلاث مراحل: أن يشرّع الله التوبة، ثم أن يتوب العبد، ثم أن يقبل الله التوبة {cite:tafsir-sharawi-khawatir-scan p.2546}{cite:tafsir-sharawi-khawatir-scan p.2547}. ويرى أن تشريع التوبة يضيّق نوازع الشر ويحمي المجتمع من أهل المعصية الذين بدأوا بذنب واحد {cite:tafsir-sharawi-khawatir-scan p.2546}{cite:tafsir-sharawi-khawatir-scan p.2614}. وهذا رأيه في موضع تفسيره، ولم تُعرض بعد أقوال الفقهاء والمتكلمين في شروط التوبة من مصدر محدد (needs_source)."
    en: "In his commentary on the expiation verse, Sha'rawi reads 'repentance from God' as having three stages: God legislates repentance, the servant repents, and God accepts it {cite:tafsir-sharawi-khawatir-scan p.2546}{cite:tafsir-sharawi-khawatir-scan p.2547}. He holds that the legislation of repentance narrows the impulses to evil and protects society from those whose sin began with one wrong act {cite:tafsir-sharawi-khawatir-scan p.2546}{cite:tafsir-sharawi-khawatir-scan p.2614}. This is his view; the jurists' and theologians' conditions for repentance are not yet set out from a named source (needs_source)."
