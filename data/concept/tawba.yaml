label: { ar: "التوبة", en: "Tawba (repentance)" }
summary:
  ar: "المفهوم الذي تدور عليه قصة الثلاثة المخلفين: توبة الله عليهم بعد خمسين ليلة، وما عدّه كعب بن مالك من توبته: الانخلاع من المال وترك الكذب. ويوسّع باب التوبة في رياض الصالحين كلام العلماء في وجوبها وشروطها: فمن كانت معصيته بينه وبين الله فشروطها الإقلاع عنها والندم على فعلها والعزم على تركها أبداً، ومن تعلق ذنبها بآدمي زيد عليها براءة صاحبه برد ما له أو تمكينه من القصاص أو استحلاله منها {cite:riyad-salihin p.9}؛ ويذكر الباب أن الله أشدّ فرحاً بتوبة عبده حين يتوب إليه من أحدكم كان على راحلته بأرض فلاة ففلتت منه، وأنه يبسط يده بالليل ليتوب مسيء النهار ويبسطها بالنهار ليتوب مسيء الليل حتى تطلع الشمس من مغربها {cite:riyad-salihin p.10}{cite:riyad-salihin p.11}، ويختم بحديث «لو أن بني آدم وادياً من ذهب أحب أن يكون له واديان ولن يملأ فاه إلا التراب ويتوب الله على من تاب» المتفق عليه {cite:riyad-salihin p.16}"
  en: "The concept around which the story of the three left behind turns: God's acceptance of their repentance after fifty nights, and what Ka'b ibn Malik counted as his repentance: giving up his wealth and leaving lying. The chapter on repentance in Riyad al-Salihin sets out the scholars' conditions for its obligatoriness: where the sin is between a servant and God its conditions are abandoning it, regretting it and resolving never to return to it, and where it touches another person a fourth is added — clearing oneself with him by returning his due, enabling the penalty, seeking pardon or seeking forgiveness for backbiting {cite:riyad-salihin p.9}; the chapter also records that God rejoices most at His servant's repentance — the lost camel in the waste land — and that He spreads His hand by night for the day's sinner and by day for the night's until the sun rises from its west {cite:riyad-salihin p.10}{cite:riyad-salihin p.11} — and closes with the agreed-upon hadith that even if the sons of Adam had a valley of gold it would not fill his mouth but dust, and God relents toward whoever repents {cite:riyad-salihin p.16}"
