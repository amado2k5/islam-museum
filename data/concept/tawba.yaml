    ar: "قصة الثلاثة المخلفين تدور على التوبة: تاب الله عليهم بعد خمسين ليلة، وعدّ كعب بن مالك من توبته الانخلاع من المال وترك الكذب."
    en: "The story of the three who stayed behind turns on repentance: God relented toward them after fifty nights, and Ka'b ibn Malik counted giving away his wealth and quitting lies part of his own."
    ur: "تین پیچھے رہ جانے والوں کی کہانی توبہ کے گرد گھومتی ہے: پچاس راتوں کے بعد اللہ نے ان کی توبہ قبول کی، اور کعب بن مالک نے اپنی توبہ میں مال سے دستبرداری اور جھوٹ چھوڑنا شمار کیا۔"
