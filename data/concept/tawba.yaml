id: concept/tawba
education:
  did_you_know:
    ar: "قصة الثلاثة المخلفين تدور على التوبة: تاب الله عليهم بعد خمسين ليلة، وعدّ كعب بن مالك من توبته الانخلاع من المال وترك الكذب."
    en: "The story of the three who stayed behind turns on repentance: God relented toward them after fifty nights, and Ka'b ibn Malik counted giving away his wealth and quitting lies part of his own."
    ur: "تین پیچھے رہ جانے والوں کی کہانی توبہ کے گرد گھومتی ہے: پچاس راتوں کے بعد اللہ نے ان کی توبہ قبول کی، اور کعب بن مالک نے اپنی توبہ میں مال سے دستبرداری اور جھوٹ چھوڑنا شمار کیا۔"
    sources: [source/ibn-hisham-sira, source/sahih-al-bukhari]
class: concept
kind: ethical
label: { ar: "التوبة", en: "Tawba (repentance)" }
summary:
  ar: "المفهوم الذي تدور عليه قصة الثلاثة المخلفين: توبة الله عليهم بعد خمسين ليلة، وما عدّه كعب بن مالك من توبته: الانخلاع من المال وترك الكذب. ويوسّع باب التوبة في رياض الصالحين كلام العلماء في وجوبها وشروطها: فمن كانت معصيته بينه وبين الله فشروطها الإقلاع عنها والندم على فعلها والعزم على تركها أبداً، ومن تعلق ذنبها بآدمي زيد عليها براءة صاحبه برد ما له أو تمكينه من القصاص أو استحلاله منها {cite:riyad-salihin p.9}؛ ويذكر الباب أن الله أشدّ فرحاً بتوبة عبده حين يتوب إليه من أحدكم كان على راحلته بأرض فلاة ففلتت منه، وأنه يبسط يده بالليل ليتوب مسيء النهار ويبسطها بالنهار ليتوب مسيء الليل حتى تطلع الشمس من مغربها {cite:riyad-salihin p.10}{cite:riyad-salihin p.11}، ويختم بحديث «لو أن بني آدم وادياً من ذهب أحب أن يكون له واديان ولن يملأ فاه إلا التراب ويتوب الله على من تاب» المتفق عليه {cite:riyad-salihin p.16}؛ وتعرض دائرة المعارف الإسلامية التوبة رجوعاً إلى الله قوامه القرآن والحديث وأدب الصوفية، وتذكر عدّها أول مقام في طريقهم، وتعريف الهجويري لها بالندم والإقلاع والعزم، واختلاف الصوفية الأوائل في تذكّر الذنب أو نسيانه"
  en: "The concept around which the story of the three left behind turns: God's acceptance of their repentance after fifty nights, and what Ka'b ibn Malik counted as his repentance: giving up his wealth and leaving lying. The chapter on repentance in Riyad al-Salihin sets out the scholars' conditions for its obligatoriness: where the sin is between a servant and God its conditions are abandoning it, regretting it and resolving never to return to it, and where it touches another person a fourth is added — clearing oneself with him by returning his due, enabling the penalty, seeking pardon or seeking forgiveness for backbiting {cite:riyad-salihin p.9}; the chapter also records that God rejoices most at His servant's repentance — the lost camel in the waste land — and that He spreads His hand by night for the day's sinner and by day for the night's until the sun rises from its west {cite:riyad-salihin p.10}{cite:riyad-salihin p.11} — and closes with the agreed-upon hadith that even if the sons of Adam had a valley of gold it would not fill his mouth but dust, and God relents toward whoever repents {cite:riyad-salihin p.16}; the Encyclopaedia of Islam presents it as a return to God grounded in the Qur'an, the Hadith and Sufi piety, reports that it was widely counted the first station of the Sufi path, gives al-Hujwiri's definition as remorse, abandonment and resolve, and notes the early Sufi debate over remembering or forgetting the sin"
  ur: "توبہ گناہوں سے لوٹ کر اللہ کی طرف رجوع کرنا ہے۔ دائرۃ المعارف اسلامیہ کے مطابق اس کی تعلیم قرآن، حدیث اور صوفیانہ ادب پر قائم ہے، اسے عام طور پر صوفیہ کی راہ کا پہلا مقام سمجھا گیا، ہجویری نے اسے ندامت، ترکِ گناہ اور دوبارہ نہ کرنے کے عزم سے تعریف کیا، اور ابتدائی صوفیہ میں گناہ کو یاد رکھنے یا بھلانے پر اختلاف رہا۔ کعب بن مالک نے اپنی توبہ میں مال سے دستبرداری اور سچ بولنے کو شمار کیا۔"
