id: concept/tawba
education:
  did_you_know:
    ar: "قصة الثلاثة المخلفين تدور على التوبة: تاب الله عليهم بعد خمسين ليلة، وعدّ كعب بن مالك من توبته الانخلاع من المال وترك الكذب."
    en: "The story of the three who stayed behind turns on repentance: God relented toward them after fifty nights, and Ka'b ibn Malik counted giving away his wealth and quitting lies part of his own."
    ur: "تین پیچھے رہ جانے والوں کی کہانی توبہ کے گرد گھومتی ہے: پچاس راتوں کے بعد اللہ نے ان کی توبہ قبول کی، اور کعب بن مالک نے اپنی توبہ میں مال سے دستبرداری اور جھوٹ چھوڑنا شمار کیا۔"
    sources: [source/ibn-hisham-sira, source/sahih-al-bukhari]
class: concept
kind: ethical
label: { ar: "التوبة", en: "Tawba (repentance)", es: "Tawba (arrepentimiento)", fr: "Tawba (repentance)", ur: "توبہ ⁦(توبہ)⁩", tr: "Tövbe", id: "Pertobatan" }
summary:
  ar: "المفهوم الذي تدور عليه قصة الثلاثة المخلفين: توبة الله عليهم بعد خمسين ليلة، وما عدّه كعب بن مالك من توبته: الانخلاع من المال وترك الكذب. ويوسّع باب التوبة في رياض الصالحين كلام العلماء في وجوبها وشروطها: فمن كانت معصيته بينه وبين الله فشروطها الإقلاع عنها والندم على فعلها والعزم على تركها أبداً، ومن تعلق ذنبها بآدمي زيد عليها براءة صاحبه برد ما له أو تمكينه من القصاص أو استحلاله منها {cite:riyad-salihin p.9}؛ ويذكر الباب أن الله أشدّ فرحاً بتوبة عبده حين يتوب إليه من أحدكم كان على راحلته بأرض فلاة ففلتت منه، وأنه يبسط يده بالليل ليتوب مسيء النهار ويبسطها بالنهار ليتوب مسيء الليل حتى تطلع الشمس من مغربها {cite:riyad-salihin p.10}{cite:riyad-salihin p.11}، ويختم بحديث «لو أن بني آدم وادياً من ذهب أحب أن يكون له واديان ولن يملأ فاه إلا التراب ويتوب الله على من تاب» المتفق عليه {cite:riyad-salihin p.16}؛ وتعرض دائرة المعارف الإسلامية التوبة رجوعاً إلى الله قوامه القرآن والحديث وأدب الصوفية، وتذكر عدّها أول مقام في طريقهم، وتعريف الهجويري لها بالندم والإقلاع والعزم، واختلاف الصوفية الأوائل في تذكّر الذنب أو نسيانه"
  en: "The concept around which the story of the three left behind turns: God's acceptance of their repentance after fifty nights, and what Ka'b ibn Malik counted as his repentance: giving up his wealth and leaving lying. The chapter on repentance in Riyad al-Salihin sets out the scholars' conditions for its obligatoriness: where the sin is between a servant and God its conditions are abandoning it, regretting it and resolving never to return to it, and where it touches another person a fourth is added — clearing oneself with him by returning his due, enabling the penalty, seeking pardon or seeking forgiveness for backbiting {cite:riyad-salihin p.9}; the chapter also records that God rejoices most at His servant's repentance — the lost camel in the waste land — and that He spreads His hand by night for the day's sinner and by day for the night's until the sun rises from its west {cite:riyad-salihin p.10}{cite:riyad-salihin p.11} — and closes with the agreed-upon hadith that even if the sons of Adam had a valley of gold it would not fill his mouth but dust, and God relents toward whoever repents {cite:riyad-salihin p.16}; the Encyclopaedia of Islam presents it as a return to God grounded in the Qur'an, the Hadith and Sufi piety, reports that it was widely counted the first station of the Sufi path, gives al-Hujwiri's definition as remorse, abandonment and resolve, and notes the early Sufi debate over remembering or forgetting the sin"
  ur: "توبہ گناہوں سے لوٹ کر اللہ کی طرف رجوع کرنا ہے۔ دائرۃ المعارف اسلامیہ کے مطابق اس کی تعلیم قرآن، حدیث اور صوفیانہ ادب پر قائم ہے، اسے عام طور پر صوفیہ کی راہ کا پہلا مقام سمجھا گیا، ہجویری نے اسے ندامت، ترکِ گناہ اور دوبارہ نہ کرنے کے عزم سے تعریف کیا، اور ابتدائی صوفیہ میں گناہ کو یاد رکھنے یا بھلانے پر اختلاف رہا۔ کعب بن مالک نے اپنی توبہ میں مال سے دستبرداری اور سچ بولنے کو شمار کیا۔"
  es: "El concepto en torno al cual gira la historia de los tres que quedaron atrás: la aceptación de Dios de su arrepentimiento después de cincuenta noches, y lo que Ka'b ibn Malik consideró su arrepentimiento: renunciar a su riqueza y dejar de mentir. El capítulo sobre el arrepentimiento en Riyad al-Salihin establece las condiciones de los eruditos para su obligatoriedad: cuando el pecado es entre un siervo y Dios, sus condiciones son abandonarlo, arrepentirse de él y resolver no volver jamás a él, y cuando afecta a otra persona se añade una cuarta: limpiarse con él devolviéndole lo que le corresponde, permitiendo la pena, buscando el perdón o buscando el perdón por la calumnia {cite:riyad-salihin p.9}; El capítulo también registra que Dios se regocija sobre todo con el arrepentimiento de su siervo —el camello perdido en el desierto— y que extiende su mano de noche para el pecador del día y de día para el de la noche hasta que el sol sale por su oeste {cite:riyad-salihin p.10}{cite:riyad-salihin p.11} —y concluye con el hadiz consensuado de que incluso si los hijos de Adán tuvieran un valle de oro, no les llenaría la boca sino de polvo, y Dios se apiada de quien se arrepiente {cite:riyad-salihin p.16}; la Enciclopedia del Islam lo presenta como un retorno a Dios fundamentado en el Corán, el Hadiz y la piedad sufí, informa que se consideraba ampliamente la primera etapa del camino sufí, da la definición de al-Hujwiri como remordimiento, abandono y resolución, y señala el debate sufí inicial sobre recordar u olvidar el pecado."
  fr: "Le concept central de l'histoire des trois laissés-pour-compte est l'acceptation par Dieu de leur repentir après cinquante nuits, et ce que Ka'b ibn Malik considérait comme son propre repentir: renoncer à ses biens et cesser de mentir. Le chapitre sur le repentir dans Riyad al-Salihin expose les conditions, selon les savants, de son caractère obligatoire: lorsque le péché est commis entre un serviteur et Dieu, les conditions sont l'abandon du péché, le regret et la résolution de ne jamais y revenir; lorsqu'il touche une autre personne, une quatrième condition s'ajoute: se justifier auprès d'elle en lui rendant ce qui lui est dû, en permettant l'exécution de la peine, en implorant le pardon ou en demandant pardon pour la médisance {cite: Riyad al-Salihin, p. 9}. Le chapitre rapporte également que Dieu se réjouit le plus du repentir de Son serviteur – tel le chameau égaré dans le désert – et qu'Il étend Sa main la nuit pour le pécheur du jour et le jour pour celui de la nuit, jusqu'au lever du soleil (Riyad-Salihin, p. 10; Riyad-Salihin, p. 11). Il se conclut par le hadith reconnu selon lequel, même si les fils d'Adam possédaient une vallée d'or, elle ne remplirait pas leur bouche, mais seulement de la poussière, et Dieu fait grâce envers quiconque se repent (Riyad-Salihin, p. 16). L'Encyclopédie de l'Islam présente ce repentir comme un retour à Dieu fondé sur le Coran, les hadiths et la piété soufie. Elle indique qu'il était largement considéré comme la première étape du chemin soufi, donne la définition d'al-Hujwiri comme remords, abandon et résolution, et mentionne le débat soufi ancien sur le souvenir ou l'oubli du péché."
  tr: "Üç halefin hikayesinin etrafında döndüğü kavram: Tanrı'nın elli gece sonra tövbesi ve Ka'b ibn Malik'in tövbesini serveti terk etmek ve yalanı terk etmek olarak görmesi. Doğru Cennetlerde Tövbe Bölümü, alimlerin bu yükümlülük ve koşullar üzerine tartışmasını genişletir: Kendisiyle Allah arasında günah işleyen, günahı terk etmek, yaptığı şeyden pişman olmak ve sonsuza dek terk etmeye karar vermektir. Bir insana günahını yükleyen kişi, sahip olduğu şeyi geri vererek ya da ona intikam isteme imkanı sağlayarak ya da bunu kabul eder kılarak masum olarak aklanır {cite:riyad-salihin s.9}; bölümde belirtilir ki, Allah, kulunun tövbe ettiğinde, çölde bininde olup bu günah elinden kayıp giden sizlerden daha çok sevinir ve geceleri elini uzatıp suçlu biri olarak tövbe eder gündüz uzatır ki geceyi kötületen kişi batısından güneş doğana kadar tövbe etsin {cite:riyad-salihin s.10} {cite:riyad-salihin s.11} ve şu hadisle bitirir: \"Eğer Adem'in çocukları altın vadi olsaydı, iki vadisi olmasını ve ağzını sadece tozla doldurmasını isterdi; Allah da tövbe edenlerin tövbesini kabul ederdi\" (kabul edildi} {cite:riyad-salihin s.16}; İslami Ansiklopedi, tövbeyi Kur'an, hadis ve Sufilerin edebiyatına dayanarak Allah'a dönüş olarak sunar, yollarındaki ilk durağını belirtirken, Al-Hujwiri bunu pişmanlık, vazgeçiş ve kararlılık olarak tanıtır ve erken tasavvuflar arasındaki günahı hatırlama veya unutma konusundaki farkları belirtir"
  id: "Konsep yang menjadi pusat cerita tiga penerus itu: pertobatan Tuhan setelah lima puluh malam, dan apa yang dianggap Ka'b ibn Malik sebagai pertobatannya sebagai meninggalkan kekayaan dan meninggalkan kebohongan. Bab tentang pertobatan di taman orang benar memperluas diskusi para ulama tentang kewajiban dan syaratnya: Siapa pun yang berbuat dosa antara dirinya dan Allah, syaratnya adalah meninggalkannya, menyesali tindakannya, dan bertekad untuk meninggalkannya selamanya. Siapa pun yang mengaitkan dosanya kepada manusia akan diampuni dengan tidak bersalah dengan mengembalikan apa yang dimilikinya atau memberinya kesempatan untuk mencari pembalasan atau membuatnya diperbolehkan {cite:riyad-salihin hlm.9}; pasal ini menyebutkan bahwa Allah lebih bersukacita dalam pertobatan hamba-Nya ketika ia bertaubat kepada-Nya daripada siapa pun dari kalian yang berada di atas tunggangannya di padang gurun dan dosa itu terlepas darinya, dan bahwa ia mengulurkan tangan-Nya pada malam hari untuk bertobat sebagai pelaku kejahatan siang hari dan memperpanjangnya ke siang sehingga orang yang bersalah pada malam dapat bertobat sampai matahari terbit dari baratnya {cite:riyad-salihin hlm.10} {cite:riyad-salihin hlm.11}, dan mengakhiri dengan hadits: \"Jika anak-anak Adam adalah lembah emas, dia akan senang memiliki dua lembah dan hanya mengisi mulutnya dengan debu, dan Allah menerima pertobatan mereka yang bertobat\" (disepakati} {cite:riyad-salihin hlm.16}; Ensiklopedia Islam menyajikan pertobatan sebagai kembalinya kepada Tuhan, berdasarkan Al-Qur'an, hadits, dan literatur para Sufi, menyebutkan posisi pertamanya di jalan mereka, dan Al-Hujwiri memperkenalkannya sebagai penyesalan, penolakan, dan tekad, serta perbedaan di antara para Sufi awal mengenai mengingat atau melupakan dosa"
