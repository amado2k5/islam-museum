summary:
  ar: "عالوسيس في الكتاب نبات يشبه القريص ينقل أن أهل طبرستان يسمونه بربهم، قوته محللة، ينفع من القروح الخبيثة والآكلة والأورام السرطانية والخنازير وورم خلف الأذن واللوزتين {cite:canon-ibn-sina-print-v1 p.621}"
  en: "Alusis is in the book a plant like the nettle called by the people of Tabaristan barbaham, so it is reported; its power is dissolving, benefiting malignant and eating ulcers, cancerous swellings, scrofula and swellings behind the ear and of the tonsils {cite:canon-ibn-sina-print-v1 p.621}"
  fr: "Dans l’ouvrage, l’alusis est une plante semblable à l’ortie que les habitants du Tabaristan appelleraient barbaham. On lui prête une vertu résolutive contre les ulcères malins et rongeants, les tumeurs cancéreuses, les écrouelles et les tuméfactions derrière l’oreille ou aux amygdales {cite:canon-ibn-sina-print-v1 p.621}"
  ur: "عالوسیس کتاب میں ایک پودا ہے جو بچھوا بوٹی سے ملتا ہے اور نقل ہے کہ اہلِ طبرستان اسے بربہم کہتے ہیں؛ اس کی قوت تحلیل کرنے والی ہے، خبیث اور آکلہ قروح، سرطانی ورموں، خنازیر اور کان کے پیچھے اور لوزتین کے ورم میں نافع ہے {cite:canon-ibn-sina-print-v1 p.621}۔"
  es: "Alusis es en el libro una planta parecida a la ortiga llamada por la gente de Tabaristán barbaham, según se informa; su poder es disolvente, beneficioso para úlceras malignas y viscerales, inflamaciones cancerosas, escrófula e inflamaciones detrás de la oreja y de las amígdalas {cite:canon-ibn-sina-print-v1 p.621}"
  tr: "Kitaptaki el-Vasis, ısırgan otuna benzeyen bir bitkidir ve Tabaristan halkının ona 'Efendileri' dediği bildirilir. Gücü eşsizdir ve kötü huylu ve aşındırıcı ülserler, kanserli tümörler, domuzlar ve kulak ile bademciklerin arkasındaki tümörler için faydalıdır {cite:canon-ibn-sina-print-v1 s.621}"
  id: "Kitaptaki el-Vasis, ısırgan otuna benzeyen bir bitkidir ve Tabaristan halkının ona 'Efendileri' dediği bildirilir. Gücü eşsizdir ve kötü huylu ve aşındırıcı ülserler, kanserli tümörler, domuzlar ve kulak ile bademciklerin arkasındaki tümörler için faydalıdır {cite:canon-ibn-sina-print-v1 s.621}"
