label:
  ar: "بحرانات ذات الجنب"
  en: "The crises of pleurisy"
  fr: "Les crises de la pleurésie"
  ur: "ذات الجنب کے بحران"
  es: "Las crisis de pleuresía"
summary:
  ar: "وإذا نفث في اليوم الأول شيئاً رقيقاً غير نضيج فيتوقع أن ينضج في الرابع ويتحرز في السابع فإن لم ينضج في الرابع أو كان ابتداء النفث ليس من اليوم الأول فبحرانه في الحادي عشر أو الرابع عشر فإن لم ينفث إلى ما بعد الرابع ثم نفث وفيه نضج ما فالأمر متوسط وإن لم يكن فيه نضج فالعلة تطول مع رجاء وخصوصاً إذا كانت هناك علامات جيدة من القوة والشهوة والنبض، وأما إذا لم ينفث إلى السابع أو نفث بلا نضج البتة بل إنما هو خلط ساذج فإن وجدت القوة ضعيفة علمت أنها لا تنضج إلا بعد زمان فإنها تخور قبل ذلك ولا تجاوز الرابع عشر وربما هلك قبله لأن بحران مثل هذا إلى أربعين وستين والطبيعة الضعيفة لا تمتد سالمة إلى ذلك الوقت وإن وجدت القوة قوية ورأيت الشهوتين معتدلتين محمودتين ورأيت النوم والنفس على ما ينبغي ورأيت البول نضيجاً جيداً رجوت أن يجاوز الرابع عشر وكل هذا إذا كانت المادة التي توجب العلة حادة، وبالجملة فإن أطول بحران الخفيف منه أربعة عشر يوماً وربما امتد إلى عشرين يوماً وقد زعم جالينوس أنه ربما استسقى بالنفث إلى ثلاثين يوماً وصادف به بحران بحراناً تاماً ⁦(قول منسوب إلى جالينوس)⁩ وقد قلنا إن النفث الساذج البزاقي يدل على طول العلة وقد يتفق أن يكون توقع البحران لوقت بعرض دليل يجعله أقرب أو دليل فيجعله أبعد مثلاً إذا كان النفث والأحوال تدل على أن البحران يكون في الرابع عشر فيظهر بعد السابع نفث أسود وخصوصاً في يوم رديء كالثامن فإنه يدل على أن البحران الرديء يتقدم وإن ظهر يدل ذلك دليل جيد على نضج محمود دل على أن البحران الرديء يتأخر والجيد يتقدم {cite:canon-ibn-sina-print-v2 p.349}"
  en: "If he expectorates on the first day something thin, unripe, it is expected to ripen on the fourth and he is watched on the seventh; if it does not ripen on the fourth, or the expectoration's beginning was not on the first day, its crisis is on the eleventh or the fourteenth. If he does not expectorate till after the fourth, then expectorates with some ripeness in it, the matter is middling; if there is no ripeness in it the affliction lengthens with hope, especially if there are good signs of the power, the appetite and the pulse. But if he does not expectorate to the seventh, or expectorates with no ripeness at all — it being only a simple humour — then if the power is found weak, know that it will not ripen except after a time, so it falters before that and does not pass the fourteenth, and perhaps he perishes before it, for the crisis of such a one is to forty and sixty, and the weak nature does not reach that time whole; and if the power is found strong, and you see the two appetites moderate and praised, and the sleep and breath as they should be, and the urine well-ripened, hope that he passes the fourteenth. All this when the matter bringing the affliction is sharp. In sum, the lightest of it has its longest crisis at fourteen days, and it may stretch to twenty days; and Galen held that expectoration may keep on to thirty days and meet a complete crisis (a saying attributed to Galen). And we have said that the simple saliva-like expectoration indicates the affliction's length; and it may agree that the crisis's expectation for a time is made nearer or farther by an arising sign: for example if the expectoration and the states indicate the crisis will be on the fourteenth, then a black expectoration appears after the seventh — especially on a bad day like the eighth — it indicates that the bad crisis comes earlier; and if that appears, a good sign of praised ripeness indicates that the bad crisis retreats and the good advances {cite:canon-ibn-sina-print-v2 p.349}"
  fr: "Selon le livre, une expectoration ténue et non mûre au premier jour est censée mûrir au quatrième, puis le malade est surveillé au septième ; si elle ne mûrit pas au quatrième ou n’a pas commencé au premier, la crise est attendue au onzième ou au quatorzième. Si l’expectoration débute après le quatrième jour avec quelque maturité, la situation est moyenne ; sans maturité, la maladie se prolonge avec espoir, surtout si la force, l’appétit et le pouls présentent de bons signes. Mais sans expectoration avant le septième, ou si celle-ci reste entièrement non mûre, simple humeur, une force faible indique qu’elle ne mûrira qu’après un délai : elle défaillit auparavant, ne dépasse pas le quatorzième jour et le malade peut même mourir avant. La crise de ce cas survient vers quarante ou soixante jours, échéance qu’une nature faible n’atteint pas intacte. Si la force reste bonne, les deux appétits modérés et satisfaisants, le sommeil et la respiration convenables et l’urine bien mûre, on espère dépasser le quatorzième jour. Tout cela concerne une matière morbide aiguë. En somme, la forme la plus légère atteint sa crise au plus tard en quatorze jours, parfois vingt ; Galien estimait que l’expectoration pouvait durer trente jours et aboutir à une crise complète, selon le propos qui lui est attribué. Une expectoration simple, semblable à la salive, indique une longue maladie. Un signe nouveau peut avancer ou retarder la crise attendue : si les expectorations et les autres états indiquent le quatorzième jour, puis qu’une expectoration noire apparaît après le septième, surtout un jour défavorable comme le huitième, elle annonce une crise mauvaise plus précoce. Si cela apparaît, un bon signe de maturité favorable indique le recul de la mauvaise crise et l’avancée de la bonne {cite:canon-ibn-sina-print-v2 p.349}"
  ur: "اگر وہ پہلے دن کچھ پتلا غیر پکا نفث کرے تو چوتھے دن پکنے کی توقع اور ساتویں پر نگہبانی اگر چوتھے نہ پکے یا نفث کا آغاز پہلے دن سے نہ ہو تو بحران گیارہویں یا چودہویں؛ اگر چوتھے کے بعد نفث کرے اور اس میں کچھ پکاوٹ ہو تو معاملہ متوسط اگر اس میں پکاوٹ نہ ہو تو علت امید کے ساتھ لمبی ہوتی ہے خاص طور پر اگر قوت شہوت اور نبض کی اچھی علامتیں ہوں؛ اور اگر ساتویں تک نفث نہ کرے یا بالکل بغیر پکاوٹ نفث کرے صرف ساذج خلط ہو تو اگر قوت کمزور پائی جائے تو جان لو کہ وہ وقت سے پہلے نہ پکے گی اس سے پہلے ڈھیلے ہو جائے گی اور چودہویں نہ گزرے گی اور شاید اس سے پہلے ہلاک ہو جائے کیونکہ ایسے کا بحران چالیس اور ساٹھ تک ہوتا ہے اور کمزور فطرت اس وقت تک سالم نہیں پہنچتی اور اگر قوت قوی پائے اور دونوں شہوتیں معتدل پسندیدہ ہوں اور نیند اور سانس جیسا ہونا چاہیے اور پیشاب اچھا پکا ہوا ہو تو امید رکھے کہ وہ چودہویں گزار دے گا یہ سب اس وقت جب علت والا مادہ تیز ہو؛ خلاصہ اس کے ہلکے کا سب سے طویل بحران چودہ دن ہے اور بیس دن تک بھی جا سکتا ہے اور جالینوس نے کہا کہ نفث تیس دن تک جاری رہ سکتا ہے اور مکمل بحران سے مل سکتا ہے ⁦(جالینوس سے منسوب قول)⁩؛ اور ہم نے کہا کہ ساذج رال جیسا نفث علت کی طوالت کی دلیل ہے اور ایسا ہو سکتا ہے کہ بحران کی توقع کسی عارضی دلیل سے قریب یا دور ہو جائے مثلاً اگر نفث اور حالات دلیل ہوں کہ بحران چودہویں ہوگا پھر ساتویں کے بعد سیاہ نفث ظاہر ہو خاص طور پر آٹھویں جیسے برے دن تو یہ بری بحران کے جلد آنے کی دلیل ہے اور اگر اچھی پسندیدہ پکاوٹ کی دلیل ظاہر ہو تو بری بحران کے پیچھے اور اچھے کے آگے بڑھنے کی دلیل ہے {cite:canon-ibn-sina-print-v2 p.349}"
  es: "Si el primer día expectora algo fino e inmaduro, se espera que madure el cuarto y se le vigila el séptimo; si no madura el cuarto, o si la expectoración no comenzó el primer día, su crisis es el undécimo o el decimocuarto. Si no expectora hasta después del cuarto, y expectora con algo de madurez, la materia es regular; si no hay madurez, la aflicción se prolonga con esperanza, especialmente si hay buenos signos de fuerza, apetito y pulso. Pero si no expectora hasta el séptimo, o expectora sin ninguna madurez —siendo solo un humor simple— entonces si la fuerza se encuentra débil, sepa que no madurará sino después de un tiempo, por lo que flaquea antes de eso y no pasa el decimocuarto, y tal vez perezca antes de eso, porque la crisis de tal persona es a los cuarenta y sesenta, y la naturaleza débil no llega a ese tiempo completa; y si se encuentra el poder fuerte, y ve que los dos apetitos moderados y elogiados, y el sueño y la respiración como deben ser, y la orina bien madura, espere que pase el catorce. Todo esto cuando la materia que trae la aflicción es aguda. En resumen, la más leve tiene su crisis más larga a los catorce días, y puede extenderse a veinte días; y Galeno sostenía que la expectoración puede mantenerse hasta treinta días y encontrar una crisis completa (un dicho atribuido a Galeno). Y hemos dicho que la expectoración simple como saliva indica la duración de la aflicción; y puede coincidir en que la expectativa de la crisis por un tiempo se acerca o se aleja por un signo emergente: por ejemplo, si la expectoración y los estados indican que la crisis será el catorce, entonces una expectoración negra aparece después del séptimo —especialmente en un mal día como el octavo— indica que la crisis grave viene antes; y si eso aparece, una buena señal de madurez alabada indica que la mala crisis retrocede y la buena avanza {cite:canon-ibn-sina-print-v2 p.349}"
