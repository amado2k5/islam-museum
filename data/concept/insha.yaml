id: concept/insha
class: concept
kind: term
label: { ar: "الإنشاء", en: "Insha' (creative speech, and its legal application)" }
summary:
  ar: "الإنشاء لغة ابتداء الشيء ورفعه، وعند أهل البيان والأصول قسم من الكلام يقابل الخبر، فالخبر ما يحتمل الصدق والكذب لذاته، والإنشاء ما لا يحتمل ذلك لأنه لا يطابق خارجا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} وهو نوعان: طلبي كالاستفهام والأمر والنهي والتمني والنداء، وغير طلبي كأفعال المدح والذم والتعجب والقسم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} واختلف الفقهاء في ألفاظ العقود كبعت واشتريت، فقال الشافعية هي إنشاء، وقال الحنفية هي إخبار بالاقتضاء، ورجح التهانوي قول الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}"
  en: "Insha' is lexically the beginning and raising of a thing; in rhetoric and usul it is one of the two kinds of speech, against khabar. A khabar is that which admits truth or falsehood in itself, while an insha' does not, because it has no external fact to match. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} It is of two kinds: demanding (talabi), such as question, command, prohibition, wish and call, and non-demanding, such as praise, blame, surprise and oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} The jurists differ on contract words such as ‘I sold’ and ‘I bought’: the Shafi'is hold them insha', the Hanafis hold them khabar by implication, and al-Tahanawi preferred the Shafi'i view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}"
