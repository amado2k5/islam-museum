id: concept/insha
class: concept
kind: term
label: { ar: "الإنشاء", en: "Insha' (creative speech, and its legal application)", es: "Insha' (la expresión creativa y su aplicación legal)", fr: "Insha' (la parole créative et son application juridique)", ur: "انشاء' ⁦(تخلیقی تقریر، اور اس کا قانونی اطلاق)⁩", tr: "İnşaat", id: "Konstruksi" }
summary:
  ar: "الإنشاء لغة ابتداء الشيء ورفعه، وعند أهل البيان والأصول قسم من الكلام يقابل الخبر، فالخبر ما يحتمل الصدق والكذب لذاته، والإنشاء ما لا يحتمل ذلك لأنه لا يطابق خارجا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} وهو نوعان: طلبي كالاستفهام والأمر والنهي والتمني والنداء، وغير طلبي كأفعال المدح والذم والتعجب والقسم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} واختلف الفقهاء في ألفاظ العقود كبعت واشتريت، فقال الشافعية هي إنشاء، وقال الحنفية هي إخبار بالاقتضاء، ورجح التهانوي قول الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}"
  en: "Insha' is lexically the beginning and raising of a thing; in rhetoric and usul it is one of the two kinds of speech, against khabar. A khabar is that which admits truth or falsehood in itself, while an insha' does not, because it has no external fact to match. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} It is of two kinds: demanding (talabi), such as question, command, prohibition, wish and call, and non-demanding, such as praise, blame, surprise and oath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} The jurists differ on contract words such as ‘I sold’ and ‘I bought’: the Shafi'is hold them insha', the Hanafis hold them khabar by implication, and al-Tahanawi preferred the Shafi'i view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}"
  es: "Insha' es léxicamente el comienzo y la elevación de algo; en retórica y usul es uno de los dos tipos de discurso, en contraposición a khabar. Un khabar es aquello que admite verdad o falsedad en sí mismo, mientras que un insha' no lo hace, porque no tiene un hecho externo con el que coincidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} Es de dos tipos: exigente (talabi), como pregunta, mandato, prohibición, deseo y llamado, y no exigente, como alabanza, reproche, sorpresa y juramento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} Los juristas difieren en palabras contractuales como 'yo vendí' y 'yo compré': los shafi'ís las consideran insha', los hanafíes las consideran khabar por implicación, y al-Tahanawi prefirió la opinión shafi'í. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}"
  fr: "Insha' désigne le sens littéral du commencement et de l'élévation d'une chose; en rhétorique et en usul, il s'agit de l'une des deux formes de discours, par opposition à khabar. Un khabar est ce qui admet la vérité ou la fausseté en soi, tandis qu'un insha' ne le fait pas, car il n'a pas de fait extérieur auquel se référer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} Il en existe deux sortes: les formes exigeantes (talabi), telles que la question, l'ordre, l'interdiction, le souhait et l'appel, et les formes non exigeantes, telles que la louange, le blâme, la surprise et le serment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} Les juristes divergent quant aux termes contractuels tels que « j'ai vendu » et « j'ai acheté »: les chaféites les considèrent comme insha', les hanafites comme khabar par implication, et al-Tahanawi privilégiait l'avis chaféite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}"
  ur: "انشاء لغوی طور پر کسی چیز کا آغاز اور عروج ہے۔ بیان اور اصول میں یہ خبر کے خلاف دو قسم کی تقریر میں سے ایک ہے۔ خبر وہ ہے جو اپنے آپ میں سچ یا جھوٹ کو تسلیم کرتا ہے، جبکہ انشا نہیں، کیونکہ اس کا کوئی خارجی حقیقت نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص3501} یہ دو طرح کا ہے: طلبی ⁦(طالبی)⁩ جیسے سوال، حکم، ممانعت، تمنا اور پکار، اور غیر مطالبہ، جیسے تعریف، ملامت، تعجب اور قسم۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص3501} میں نے بیچا اور 'میں نے خریدا' جیسے لفظوں میں فقہاء کا اختلاف ہے: شافعی ان کو انشاء کہتے ہیں، حنفیہ نے ان کو خبر کہتے ہیں، اور الطحناوی نے شافعی کے قول کو ترجیح دی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3501}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3502}"
  tr: "Yaratılış, dilsel olarak bir şeyin başlangıcı ve nominatifi anlamına gelir. Retorik ve ilke bilginlerine göre, bu bir yüklemle karşılık gelen bir tür konuşmadır. Bir yüklem tek başına doğru ya da yanlış olamaz, yaratılış ise dışsal olarak karşılık gelmediği için tolere edilemez. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.3501} İki türden oluşur: sorgulama, emir, yasaklama, dilek ve çağrı gibi istek, ve övgü, suçlama, ünlem, ünlem ve yemin gibi isteme. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3501} Hukukçular, 'sati' ve 'ishtirat' gibi sözleşme şartları konusunda farklı görüşlere sahipti. Şafi'ler bunun 'inşa' olduğunu söylerken, Hanefiler bunun zorunluluktan kaynaklanan bir ifade olduğunu söylerken, El-Tahanawi Şafi'i görüşünü tercih etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3502}"
  id: "Penciptaan secara linguistik berarti awal dan nominatif dari sesuatu. Menurut para ahli retorika dan prinsip, ini adalah jenis ucapan yang sesuai dengan predikat. Predikat tidak bisa benar atau salah dengan sendirinya, sementara penciptaan tidak dapat ditoleransi karena tidak sesuai secara eksternal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3501} Ia terbagi dengan dua jenis: permintaan, seperti interogatif, perintah, larangan, keinginan, dan panggilan, dan non-permintaan, seperti tindakan pujian, menyalahkan, seruan, seruan, dan sumpah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3501} Para ahli hukum berbeda pendapat mengenai ketentuan kontrak, seperti 'sati' dan 'ishtirat'. Syafi'i mengatakan itu 'insha', Hanafi mengatakan itu adalah pernyataan karena kebutuhan, sementara Al-Tahanawi lebih memilih pandangan Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3501} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3502}"
