label:
  ar: "اللِّبَأ"
  en: "Colostrum (lubaʾ), fiqh rulings"
  ur: "لبأ (فقہی احکام)"
summary:
  ar: "اللبأ في اللغة أول ما ينزل من اللبن بعد الولادة، وقال أبو زيد إنه غالباً ثلاث حلبات، وأقله حلبة واحدة؛ والفصح ما يذهب عنه اللبأ فيصفو اللبن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13562}."
  en: "Lubaʾ, in lexicon, is the first milk that comes after birth; Abu Zayd said it is usually three milkings and at least one. Fisah is the time when the lubaʾ has passed and the milk clears {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13562}."
  ur: "لبأ لغت میں بچے کی پیدائش کے بعد سب سے پہلے نکلنے والا دودھ ہے؛ ابو زید کے نزدیک یہ عام طور پر تین بار دوہنا اور کم از کم ایک بار ہوتا ہے۔ فصح وہ وقت ہے جب لبأ ختم ہو کر دودھ صاف ہو جائے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13562}۔"
