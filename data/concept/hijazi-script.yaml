summary:
  ar: "خط غير رسمي كتبت به أقدم أوراق المصاحف بهيئة عمودية، سمي بالحجاز، ويتميز بميل قوائم الحروف إلى اليمين وانعطاف الياء الأخيرة إلى الخلف، وقلّة نقط الإعجام والحركات {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 63}."
  en: "An unofficial script used for the earliest Qur'an folios, in vertical format, named after the Hijaz; it is marked by right-slanting letter shafts, a final ya that turns back under the preceding letter, and scant consonant points and vowels {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 63}."
  ur: "ایک غیر سرکاری خط جس میں قدیم ترین مصاحف کے عمودی ورق لکھے گئے، حجاز کے نام سے موسوم؛ اس کی پہچان دائیں جھکی شاخیں، پیچھے مڑتی آخری یا، اور اعجام و حرکات کی کمی ہے {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 63}۔"
