kind: art_form
label: { ar: "الخط الحجازي", en: "Hijazi script", ur: "خطِ حجازی", es: "Escritura hiyazí", fr: "Écriture hijazi", tr: "Hejazi Hattı", id: "Garis Hejazi" }
summary:
  ar: "خط غير رسمي كتبت به أقدم أوراق المصاحف بهيئة عمودية، سمي بالحجاز، ويتميز بميل قوائم الحروف إلى اليمين وانعطاف الياء الأخيرة إلى الخلف، وقلّة نقط الإعجام والحركات {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 63}."
  en: "An unofficial script used for the earliest Qur'an folios, in vertical format, named after the Hijaz; it is marked by right-slanting letter shafts, a final ya that turns back under the preceding letter, and scant consonant points and vowels {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 63}."
  ur: "ایک غیر سرکاری خط جس میں قدیم ترین مصاحف کے عمودی ورق لکھے گئے، حجاز کے نام سے موسوم؛ اس کی پہچان دائیں جھکی شاخیں، پیچھے مڑتی آخری یا، اور اعجام و حرکات کی کمی ہے {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 63}۔"
  es: "Un sistema de escritura no oficial utilizado para los primeros folios del Corán, en formato vertical, que recibe su nombre del Hiyaz; se caracteriza por trazos de letras inclinados hacia la derecha, una ya final que se dobla bajo la letra precedente y escasos puntos consonánticos y vocales {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 63}."
  fr: "Une écriture non officielle utilisée pour les premiers feuillets du Coran, au format vertical, nommée d'après le Hedjaz; elle est marquée par des traits de lettres inclinés vers la droite, un ya final qui revient sous la lettre précédente, et des points consonantiques et des voyelles rares {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 63}."
  tr: "Kur'an'ın en eski sayfalarını dikey biçimde yazmak için kullanılan gayri resmi bir yazı sistemi olan Hicaz denir. Harf listelerinin sağa eğimlenmesi, son ya'nın geriye dönmesi ve birkaç diyakritik işaret ile ünlü işareti {cite:ekhtiar-how-to-read-islamic-calligraphy-2018, s. 63} ile karakterizedir."
  id: "Sebuah aksara informal yang digunakan untuk menulis halaman tertua Al-Qur'an dalam bentuk vertikal, disebut Hijaz. Tulisan ini ditandai dengan kemiringan ke kanan pada daftar huruf, pembalikan mundur pada kata ya, dan sedikit tanda diakritik serta vokal {cite:ekhtiar-how-to-read-islamic-calligraphy-2018, hlm. 63}."
