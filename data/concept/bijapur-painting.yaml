summary:
  ar: "مدرسة التصوير في سلطنة بني عادل شاه ببيجاپور، من «نجوم العلوم» ⁦(1570–1571م)⁩ إلى ذروتها في عهد إبراهيم عادل شاه الثاني ⁦(1579–1627م)⁩ ثم أسلوب البورتريه المتأثر بالمغول، وقطعها الفتح المغولي سنة 1686م {cite:zebrowski-deccani-painting-1983 p. 12} {cite:zebrowski-deccani-painting-1983 p. 66}."
  en: "The painting of the Adil Shahi sultanate of Bijapur, from the Nujum al-Ulum (1570–71) to its height under Ibrahim Adil Shah II (1579–1627) and a later Mughal-influenced portrait style, cut short by the Mughal conquest of 1686 {cite:zebrowski-deccani-painting-1983 p. 12} {cite:zebrowski-deccani-painting-1983 p. 66}."
  fr: "Peinture du sultanat Adil Shahi de Bijapur, du Nujum al-Ulum (1570–1571) à son apogée sous Ibrahim Adil Shah II (1579–1627), puis à un portrait influencé par les Moghols, évolution interrompue par leur conquête de 1686 {cite:zebrowski-deccani-painting-1983 p. 12} {cite:zebrowski-deccani-painting-1983 p. 66}."
  ur: "بیجاپور کی عادل شاہی سلطنت کی مصوری، نجوم العلوم ⁦(1570–71ء)⁩ سے ابراہیم عادل شاہ دوم ⁦(1579–1627ء)⁩ کے دور کے عروج اور پھر مغل اثر والی شبیہ نگاری تک، جسے 1686ء کی مغل فتح نے ختم کیا {cite:zebrowski-deccani-painting-1983 p. 12} {cite:zebrowski-deccani-painting-1983 p. 66}۔"
  es: "La pintura del sultanato Adil Shahi de Bijapur, desde el Nujum al-Ulum (1570–71) hasta su apogeo bajo Ibrahim Adil Shah II (1579–1627) y un estilo de retrato posterior influenciado por los mogoles, interrumpido por la conquista mogol de 1686 {cite:zebrowski-deccani-painting-1983 p. 12} {cite:zebrowski-deccani-painting-1983 p. 66}."
  tr: "Bijapur'daki Bani Adil Şah Sultanlığı'ndaki Resim Okulu, 'Bilimlerin Yıldızları'ndan (1570–1571) Ibrahim Adil Şah II'nin (1579–1627) saltanatındaki zirvesine kadar, ardından Moğol etkili portre tarzı ve 1686'daki Babür fethi ile sona eren {cite:zebrowski-deccani-painting-1983 s. 12} {cite:zebrowski-deccani-painting-1983 s. 66}."
  id: "Sekolah Lukisan di Kesultanan Bani Adil Shah di Bijapur, dari 'Bintang Ilmu Pengetahuan' (1570–1571 M) hingga puncaknya pada masa pemerintahan Ibrahim Adil Shah II (1579–1627 M), kemudian gaya potret yang dipengaruhi Mongol, yang terputus oleh penaklukan Mughal pada tahun 1686 {cite:zebrowski-deccani-painting-1983 hlm. 12} {cite:zebrowski-deccani-painting-1983 hlm. 66}."
