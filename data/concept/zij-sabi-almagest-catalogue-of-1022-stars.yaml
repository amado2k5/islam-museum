label: { ar: "فهرسة كواكب المجسطي: ألف واثنان وعشرون كوكباً في خمس وأربعين صورة", en: "The Almagest catalogue of 1,022 stars in forty-five figures", ur: "مجسطی کی فہرست: پینتالیس صورتوں میں ایک ہزار بائیس ستارے", es: "El catálogo del Almagesto de 1.022 estrellas en cuarenta y cinco cifras." }
summary:
  ar: "يذكر النص أن الكواكب التي ذكرها بطليموس في المجسطي ألف واثنان وعشرون كوكباً، تنقسم إلى صور: في الناحية الجنوبية خمس عشرة صورة وست صور من صور البروج الجنوبية، وهي الميزان والعقرب والقوس والجدي والدلو والحوت، وفي الناحية الشمالية ثماني عشرة صورة والست الصور الباقية من صور البروج. فالجميع خمس وأربعون صورة. وكواكب صور البروج ثلاثمائة وستة وأربعون كوكباً، وكواكب الصور الشمالية ثلاثمائة وستون، وكواكب الصور الجنوبية ثلاثمائة وستة عشر. {cite:zij-sabi-nallino-byblion pp.192-193}"
  en: "The text says the stars named by Ptolemy in the Almagest number one thousand and twenty-two. They fall into figures: in the southern region fifteen figures and six zodiacal figures of the south, namely Libra, Scorpio, Sagittarius, Capricorn, Aquarius and Pisces, and in the northern region eighteen figures and the remaining six zodiacal figures. The total is forty-five figures. The zodiacal figures hold three hundred and forty-six stars, the northern figures three hundred and sixty, and the southern figures three hundred and sixteen. {cite:zij-sabi-nallino-byblion pp.192-193}"
  ur: "متن کہتا ہے کہ بطلیموس نے مجسطی میں جن ستاروں کا ذکر کیا وہ ایک ہزار بائیس ہیں، اور وہ صورتوں میں بٹے ہوئے ہیں: جنوبی خطے میں پندرہ صورتیں اور جنوبی بروج کی چھ صورتیں، یعنی میزان، عقرب، قوس، جدی، دلو اور حوت؛ اور شمالی خطے میں اٹھارہ صورتیں اور باقی چھ بروج کی صورتیں۔ کل پینتالیس صورتیں ہیں۔ بروج کی صورتوں میں تین سو چالیس چھ ستارے، شمالی صورتوں میں تین سو ساٹھ، اور جنوبی صورتوں میں تین سو سولہ۔ {cite:zij-sabi-nallino-byblion pp.192-193}"
  es: "El texto indica que las estrellas nombradas por Ptolomeo en el Almagesto suman mil veintidós. Se dividen en figuras: en la región sur, quince figuras y seis figuras zodiacales del sur, a saber, Libra, Escorpio, Sagitario, Capricornio, Acuario y Piscis; y en la región norte, dieciocho figuras y las seis figuras zodiacales restantes. El total es de cuarenta y cinco figuras. Las figuras zodiacales contienen trescientas cuarenta y seis estrellas, las figuras del norte, trescientas sesenta, y las figuras del sur, trescientas dieciséis. {cite:zij-sabi-nallino-byblion pp.192-193}"
