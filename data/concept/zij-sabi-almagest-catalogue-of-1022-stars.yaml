label: { ar: "فهرسة كواكب المجسطي: ألف واثنان وعشرون كوكباً في خمس وأربعين صورة", en: "The Almagest catalogue of 1,022 stars in forty-five figures", ur: "مجسطی کی فہرست: پینتالیس صورتوں میں ایک ہزار بائیس ستارے", es: "El catálogo del Almagesto de 1.022 estrellas en cuarenta y cinco cifras.", fr: "Le catalogue Almageste de 1 022 étoiles en quarante-cinq chiffres", tr: "Batlamyus'un Almagest'indeki gezegenlerin dizini: Kırk beş resimde bin yirmi iki gezegen", id: "Indeks planet-planet dalam Almagest karya Ptolemy: Seribu dua puluh dua planet dalam empat puluh lima gambar." }
summary:
  ar: "يذكر النص أن الكواكب التي ذكرها بطليموس في المجسطي ألف واثنان وعشرون كوكباً، تنقسم إلى صور: في الناحية الجنوبية خمس عشرة صورة وست صور من صور البروج الجنوبية، وهي الميزان والعقرب والقوس والجدي والدلو والحوت، وفي الناحية الشمالية ثماني عشرة صورة والست الصور الباقية من صور البروج. فالجميع خمس وأربعون صورة. وكواكب صور البروج ثلاثمائة وستة وأربعون كوكباً، وكواكب الصور الشمالية ثلاثمائة وستون، وكواكب الصور الجنوبية ثلاثمائة وستة عشر. {cite:zij-sabi-nallino-byblion pp.192-193}"
  en: "The text says the stars named by Ptolemy in the Almagest number one thousand and twenty-two. They fall into figures: in the southern region fifteen figures and six zodiacal figures of the south, namely Libra, Scorpio, Sagittarius, Capricorn, Aquarius and Pisces, and in the northern region eighteen figures and the remaining six zodiacal figures. The total is forty-five figures. The zodiacal figures hold three hundred and forty-six stars, the northern figures three hundred and sixty, and the southern figures three hundred and sixteen. {cite:zij-sabi-nallino-byblion pp.192-193}"
  ur: "متن کہتا ہے کہ بطلیموس نے مجسطی میں جن ستاروں کا ذکر کیا وہ ایک ہزار بائیس ہیں، اور وہ صورتوں میں بٹے ہوئے ہیں: جنوبی خطے میں پندرہ صورتیں اور جنوبی بروج کی چھ صورتیں، یعنی میزان، عقرب، قوس، جدی، دلو اور حوت؛ اور شمالی خطے میں اٹھارہ صورتیں اور باقی چھ بروج کی صورتیں۔ کل پینتالیس صورتیں ہیں۔ بروج کی صورتوں میں تین سو چالیس چھ ستارے، شمالی صورتوں میں تین سو ساٹھ، اور جنوبی صورتوں میں تین سو سولہ۔ {cite:zij-sabi-nallino-byblion pp.192-193}"
  es: "El texto indica que las estrellas nombradas por Ptolomeo en el Almagesto suman mil veintidós. Se dividen en figuras: en la región sur, quince figuras y seis figuras zodiacales del sur, a saber, Libra, Escorpio, Sagitario, Capricornio, Acuario y Piscis; y en la región norte, dieciocho figuras y las seis figuras zodiacales restantes. El total es de cuarenta y cinco figuras. Las figuras zodiacales contienen trescientas cuarenta y seis estrellas, las figuras del norte, trescientas sesenta, y las figuras del sur, trescientas dieciséis. {cite:zij-sabi-nallino-byblion pp.192-193}"
  fr: "Le texte indique que les étoiles nommées par Ptolémée dans l'Almageste sont au nombre de mille vingt-deux. Elles se répartissent en figures: dans la région méridionale, quinze figures et six figures zodiacales du sud, à savoir la Balance, le Scorpion, le Sagittaire, le Capricorne, le Verseau et les Poissons; et dans la région septentrionale, dix-huit figures et les six figures zodiacales restantes. Le total est de quarante-cinq figures. Les figures zodiacales comprennent trois cent quarante-six étoiles, les figures septentrionales trois cent soixante et les figures méridionales trois cent seize. {cite:zij-sabi-nallino-byblion pp.192-193}"
  tr: "Metinde, Batlamyus'un Almagest'te bahsettiği gezegen sayısının 122 olduğu ve bunların takımyıldızlara ayrıldığı belirtiliyor: Güney yarımkürede 15 takımyıldız ve bunlardan altısı (Terazi, Akrep, Yay, Oğlak, Kova ve Balık); kuzey yarımkürede ise 18 takımyıldız ve kalan altı takımyıldız. Bu da toplam 45 takımyıldız yapar. Takımyıldızlardaki gezegen sayısı 346, kuzey takımyıldızlarındaki 360 ve güney takımyıldızlarındaki 316'dır. {cite:zij-sabi-nallino-byblion pp.192-193}"
  id: "Teks tersebut menyatakan bahwa planet-planet yang disebutkan oleh Ptolemy dalam Almagest berjumlah 122, dibagi menjadi rasi bintang: 15 rasi bintang di belahan bumi selatan, dan enam rasi bintang selatan (Libra, Scorpio, Sagittarius, Capricorn, Aquarius, dan Pisces); dan 18 rasi bintang di belahan bumi utara, dan enam rasi bintang sisanya. Ini menjadikan total 45 rasi bintang. Planet-planet dalam rasi bintang tersebut berjumlah 346, di rasi bintang utara 360, dan di rasi bintang selatan 316. {cite:zij-sabi-nallino-byblion pp.192-193}"
