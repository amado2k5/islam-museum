label: { ar: "مَوَاطِن الإِجَابَة", en: "Times and places when prayer is answered (mawatin al-ijaba)", ur: "قبولیت دعا کے مقامات و اوقات" }
summary:
  ar: "مواطن الإجابة هي المظان التي يغلب على الظن أن من دعا فيها استجيب له، وتحريها مستحب بنصوص الكتاب والسنة. وهي ثلاثة أنواع: أوقات شريفة كثلث الليل الآخر ويوم الجمعة وليلة القدر ورمضان، وأماكن كالملتزم وعرفة وبين الأذان والإقامة، وأحوال كالسجود وبعد الصلاة المكتوبة والصوم والسفر والقتال والمظلوم والمضطر وذكر الله والدعاء للأخ بظهر الغيب."
  en: "The places and times of answered prayer are those where it is likely that a supplication will be granted. Seeking them out is recommended in the Qur'an and the Sunna. They are of three kinds: times, such as the last third of the night, Friday and its hour, the nights of Ramadan and the Night of Power; places, such as al-Multazam and Arafat; and states, such as prostration, after the prescribed prayer, while fasting, on a journey, in battle, for the wronged and the distressed, in gatherings of remembrance, and for a brother in his absence. The entry also notes that the answer may be deferred for the good of the supplicant."
  ur: "قبولیت دعا کے مقامات و اوقات وہ ہیں جہاں دعا قبول ہونے کا گمان غالب ہو، اور ان کی تلاش مستحب ہے۔ یہ اوقات، مقامات اور احوال میں تقسیم ہیں، جیسے رات کا آخری تہائی حصہ، جمعہ، ملتزم، عرفات، سجدہ، فرض نماز کے بعد، سفر، مظلوم اور مضطر کی دعا۔"
