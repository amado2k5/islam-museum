label:
  ar: "باب الريان"
  en: "Bab al-Rayyan"
  ur: "باب الریان"
summary:
  ar: "باب من أبواب الجنة خصه الله للصائمين. قال رسول الله: «في الجنة باب يقال له الريان، يدخل منه الصائمون يوم القيامة، لا يدخل منه أحد غيرهم؛ يقال: أين الصائمون؟ فيقومون، لا يدخل منه أحد غيرهم؛ فإذا دخلوا أغلق فلم يدخل منه أحد»."
  en: "A gate of Paradise God reserved for the fasting. The Prophet said: «In Paradise there is a gate called al-Rayyan; the fasting enter through it on the Day of Resurrection — none but they enter it. It is said: where are the fasting? They rise, and none but they enter; when they have entered it is shut and none enters after them»."
  ur: "جنت کا ایک دروازہ جو اللہ نے روزہ داروں کے لیے مخصوص کیا۔ نبی نے فرمایا: «جنت میں ایک دروازہ ہے جسے الریان کہا جاتا ہے، قیامت کے دن روزہ دار اسی سے داخل ہوں گے، ان کے سوا کوئی اس سے داخل نہ ہوگا؛ جب وہ داخل ہو جائیں گے تو وہ بند کر دیا جائے گا»۔"
