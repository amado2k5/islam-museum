id: concept/belongings-of-the-prophet-kept-by-the-companions
tags: [wasaya-browser, wasaya-legacy, wasaya-athar, wasaya-mirath]
class: concept
kind: term
label:
  ar: "أمتعة النبي التي حفظها الصحابة بعده"
  en: "Belongings of the Prophet kept by the Companions after him"
  fr: "Objets du Prophète conservés après lui par les Compagnons"
  ur: "نبی کا وہ سامان جو صحابہ نے آپ کے بعد محفوظ رکھا"
  es: "Pertenencias del Profeta conservadas por los Compañeros después de él."
  tr: "Peygamber'in eşyaları, sahabelerin ondan sonra koruduğu"
  id: "Barang-barang Nabi yang disimpan oleh para sahabat setelah dia"
summary:
  ar: "تذكر الكتب من آثار النبي عند أصحابه قدحه عند أنس، وقد انصدع فسلسله بفضة {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397}، ونعلين لهما قبالان أخرجهما أنس وقال ثابت إنهما نعلا النبي {cite:al-bidaya-wal-nihaya scan vol. 3 p. 396}، وإزاراً غليظاً وكساءً أخرجتهما عائشة وأقسمت أنه قُبض فيهما {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3402} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3403}، وعنزة أعطى منها واحدة لعلي وأخرى لعمر {cite:subul-huda-salihi scan vol. 4 p. 4958}، ومنبراً من طرفاء الغابة {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 1123}. ويقول ابن كثير في ثلاثة منها إنه لا يُدرى ما كان من أمرها بعد ذلك {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}."
  en: "The books list among the Prophet's belongings kept by his Companions his cup with Anas, which had cracked and was bound with silver {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397}; two sandals with two straps that Anas brought out and Thabit said were the Prophet's {cite:al-bidaya-wal-nihaya scan vol. 3 p. 396}; a thick waist-wrap and a cloak 'A'isha brought out, swearing he was taken in them {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3402} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3403}; a short spear of which he gave one to 'Ali and one to 'Umar {cite:subul-huda-salihi scan vol. 4 p. 4958}; and a minbar of tamarisk from al-Ghaba {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 1123}. Ibn Kathir says of three of these that it is not known what became of them afterwards {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}."
  fr: "Les livres mentionnent sa coupe chez Anas, fendue et cerclée d’argent {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397} ; deux sandales à deux lanières présentées par Anas et identifiées par Thabit {cite:al-bidaya-wal-nihaya scan vol. 3 p. 396} ; un épais pagne et un manteau présentés par 'A'isha, jurant qu’il mourut vêtu de ces pièces {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3402} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3403} ; des lances courtes dont il donna une à 'Ali et une à 'Umar {cite:subul-huda-salihi scan vol. 4 p. 4958} ; un minbar en tamaris d’al-Ghaba {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 1123}. Ibn Kathir dit ignorer le devenir ultérieur de trois de ces éléments {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}."
  ur: "کتابیں اصحابِ نبی کے پاس محفوظ رہنے والے سامان میں انس کے پاس نبی کا پیالہ بتاتی ہیں، جو شق ہو گیا تھا تو چاندی سے جوڑا گیا {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397}؛ دو تسمے والے جوتے جو انس نے نکالے اور ثابت نے کہا کہ یہ نبی کے ہیں {cite:al-bidaya-wal-nihaya scan vol. 3 p. 396}؛ موٹا تہبند اور چادر جو عائشہ نے نکالے اور قسم کھائی کہ آپ کی روح انہی میں قبض ہوئی {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3402} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3403}؛ ایک چھوٹی برچھی جن میں سے ایک آپ نے علی کو اور ایک عمر کو دی {cite:subul-huda-salihi scan vol. 4 p. 4958}؛ اور غابہ کے جھاؤ کی لکڑی سے بنا منبر {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 1123}۔ ان میں سے تین کے بارے میں ابن کثیر کہتے ہیں کہ معلوم نہیں بعد میں ان کا کیا ہوا {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}۔"
  es: "Los libros enumeran entre las pertenencias del Profeta que conservaban sus Compañeros su copa con Anas, que se había agrietado y estaba encuadernada con plata {cite:al-bidaya-wal-nihaya scan vol. 3 p. 397}; dos sandalias con dos correas que Anas sacó y Thabit dijo que eran del Profeta {cite:al-bidaya-wal-nihaya scan vol. 3 p. 396}; un grueso chal y una capa que 'A'isha sacó, jurando que fue llevado con ellos {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3402} {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3403}; una lanza corta de la cual le dio una a 'Ali y otra a 'Umar {cite:subul-huda-salihi scan vol. 4 p. 4958}; y un minbar de tamarisco de al-Ghaba {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 1123}. Ibn Kathir dice de tres de estos que se desconoce qué sucedió con ellos después {cite:al-bidaya-wal-nihaya scan vol. 3 p. 398}."
  tr: "Kitaplarda Peygamber'in sahabeleriyle birlikte kadehi Anas'ın olduğu kâsesi olarak geçer; kadeh çatlıydı ve zinciri gümüşten yapılmıştı {atıf:al-bidaya-wal-nihaya tarama cilt 3, s. 397} ve Anas'ın çıkardığı iki sandalet vardır; Thabit bunların Peygamber'in sandaletleri olduğunu söyler {atıf:al-bidaya-wal-nihaya tarama cilt 3, s. 396} ve Aişe'nin çıkardığı kalın bir giysi ve pelerin olduğunu söyler; Aişe onlara yakalandığına yemin eder {atıf:dalail-al-nubuwwa-bayhaki taraması cilt 1, s. 3402} {alıntı: dalail-al-nubuwwa-bayhaqi taraması cilt 1 s. 3403} ve bir keçi (birini Ali'ye, diğerini Umar'a verdi {atıf:subul-huda-salihi taraması cilt 4 s. 4958} ve orman kenarlarından bir vaaz kürsüsü {cite:dalail-al-nubuwwa-bayhaqi taraması cilt 1 s. 1123} bulundu. İbn Kathir, üçü hakkında o {cite:al-bidaya-wal-nihaya taraması cilt 3, s. 398} sonrasında ne olduğunu bilmediğini söyler."
  id: "Buku-buku menyebutkan cawan Nabi bersama sahabatnya sebagai cawan bersama Anas, yang retak dan rantainya terbuat dari perak {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 397}, dan dua sandal untuk mereka yang diambil Anas, dan Thabit mengatakan itu adalah sandal Nabi {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 396}, dan sebuah pakaian tebal serta jubah yang diambil oleh Aisha, yang bersumpah bahwa ia tertangkap memakainya {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1, hlm. 3402} {cite: Dalail-al-Nubuwwa-Bayhaqi Scan Vol. 1 hlm. 3403}, dan seekor kambing yang satu diberikan kepada Ali dan satu lagi kepada Umar {cite:subul-huda-salihi scan vol. 4 hlm. 4958}, serta mimbar dari pinggiran hutan {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 hlm. 1123}. Ibn Kathir mengatakan tentang tiga di antaranya bahwa ia tidak tahu apa yang terjadi setelah itu {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 398}."
