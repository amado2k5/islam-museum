id: concept/shirb-water-rights
class: concept
kind: legal
label:
  ar: "الشِّرب"
  en: "Shirb (the right to water: public and owned waters, distribution, cleaning of canals, and sale of water rights)"
summary:
  ar: "الشرب لغة التناول والتصيب من الماء، ويطلق على الماء وعلى النوبة المحددة لاستحقاق الشرب، وعلى المورد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943} وتنقسم المياه إلى عامة لا يملكها أحد، وجارية في أنهار مملوكة، ومنبع مملوك، ومحرزة في الأواني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9947} وتقسم المياه العامة بين أصحاب الأراضي بحسب السبق والقرب من أول النهر، وتكرى الأنهار العامة من بيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} وجمهور الفقهاء يجيزون التصرف في الشرب بالبيع والإجارة والصلح، والحنفية لا يجيزون بيعه منفردا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9951}"
  en: "In language shirb is taking one's share of water; the word also names water, the turn fixed for the right to draw it, and the watering-place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943} Waters are of four kinds: public water owned by none; water flowing in owned canals; water from an owned spring; and water collected in vessels, which is owned by the one who collects it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9947} Public water is shared among landowners by priority and nearness to the head of the stream, and public canals are cleaned from the treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} Most jurists allow the right to water to be sold, let, or made the subject of settlement, and the Hanafis do not allow selling it apart from land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9951}"
