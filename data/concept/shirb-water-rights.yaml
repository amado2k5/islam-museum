id: concept/shirb-water-rights
class: concept
kind: legal
label:
  ar: "الشِّرب"
  en: "Shirb (the right to water: public and owned waters, distribution, cleaning of canals, and sale of water rights)"
  es: "Shirb (el derecho al agua: aguas públicas y privadas, distribución, limpieza de canales y venta de derechos de agua)"
  fr: "Shirb (le droit à l'eau: eaux publiques et privées, distribution, nettoyage des canaux et vente des droits d'eau)"
  ur: "شرب ⁦(پانی کا حق: عوامی اور ملکیتی پانی، تقسیم، نہروں کی صفائی، اور پانی کے حقوق کی فروخت)⁩"
summary:
  ar: "الشرب لغة التناول والتصيب من الماء، ويطلق على الماء وعلى النوبة المحددة لاستحقاق الشرب، وعلى المورد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943} وتنقسم المياه إلى عامة لا يملكها أحد، وجارية في أنهار مملوكة، ومنبع مملوك، ومحرزة في الأواني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9947} وتقسم المياه العامة بين أصحاب الأراضي بحسب السبق والقرب من أول النهر، وتكرى الأنهار العامة من بيت المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} وجمهور الفقهاء يجيزون التصرف في الشرب بالبيع والإجارة والصلح، والحنفية لا يجيزون بيعه منفردا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9951}"
  en: "In language shirb is taking one's share of water; the word also names water, the turn fixed for the right to draw it, and the watering-place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943} Waters are of four kinds: public water owned by none; water flowing in owned canals; water from an owned spring; and water collected in vessels, which is owned by the one who collects it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9947} Public water is shared among landowners by priority and nearness to the head of the stream, and public canals are cleaned from the treasury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} Most jurists allow the right to water to be sold, let, or made the subject of settlement, and the Hanafis do not allow selling it apart from land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9951}"
  es: "En el idioma shirb es tomar la parte del agua que le corresponde; la palabra también nombra el agua, el turno fijado para el derecho a sacarla y el abrevadero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943} Las aguas son de cuatro tipos: agua pública que no pertenece a nadie; agua que fluye en canales propios; agua de un manantial propio; y agua recogida en recipientes, que pertenece a quien la recoge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9947} El agua pública se comparte entre los propietarios de tierras por prioridad y proximidad a la cabecera del arroyo, y los canales públicos se limpian con cargo al tesoro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} La mayoría de los juristas permiten que el derecho al agua se venda, alquile o sea objeto de asentamiento, y los hanafis no permiten venderlo aparte de la tierra. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9950} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9951}"
  fr: "En langue kuwaitiyya, « shirb » signifie prendre sa part d'eau; ce mot désigne également l'eau, le tour de rôle fixé pour le droit de la puiser et le point d'eau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9943} Il existe quatre types d'eaux: l'eau publique, qui n'appartient à personne; l'eau qui coule dans les canaux privés; l'eau d'une source privée; et l'eau recueillie dans des récipients, qui appartient à celui qui la recueille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9944} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9947} L'eau publique est partagée entre les propriétaires fonciers selon un ordre de priorité et la proximité de la source du cours d'eau, et les canaux publics sont entretenus grâce aux fonds publics. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9946} La plupart des juristes autorisent la vente, la location ou la colonisation du droit à l'eau, et les Hanafis n'autorisent pas sa vente en dehors de la terre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9951}"
  ur: "زبان میں شرب اپنے حصے کا پانی لے رہا ہے۔ یہ لفظ پانی کا نام بھی رکھتا ہے، اسے کھینچنے کے حق کے لیے مقرر کردہ موڑ، اور پانی دینے کی جگہ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9943} پانی چار قسم کے ہیں: عوامی پانی کسی کی ملکیت نہیں ہے۔ ملکیتی نہروں میں بہتا پانی؛ ایک ملکیتی چشمے سے پانی؛ اور برتنوں میں جمع پانی، جو اسے جمع کرنے والے کی ملکیت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9944} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9946} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9947} عوامی پانی کی تقسیم ہے عوامی پانی کے درمیان سر اور زمین کی ملکیت کے قریب خزانے سے نہریں صاف کی جاتی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9945} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9946} اکثر فقہاء پانی کے حق کو بیچنے، چھوڑنے، یا تصفیہ کا موضوع بنانے کی اجازت دیتے ہیں، اور احناف اسے زمین کے علاوہ بیچنے کی اجازت نہیں دیتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9950}"
