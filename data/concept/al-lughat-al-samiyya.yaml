id: concept/al-lughat-al-samiyya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-origins]
label:
  ar: "العربية بين اللغات السامية"
  en: "Arabic among the Semitic languages"
  ur: "عربی سامی زبانوں کے درمیان"
  fr: "L'arabe parmi les langues sémitiques"
  es: "El árabe entre las lenguas semíticas"
summary:
  ar: "ما تقوله دائرة المعارف البريطانية عن موضع العربية في الأسرة السامية: انتماؤها إلى الأفروآسيوية، وفروع الأسرة التي يتفق عليها الباحثون، والخلاف على تصنيف العربية بين السامية الوسطى وفرع مستقل أو الجنوبية، وما تشترك فيه مع أخواتها من جموع التكسير وصوت الفاء، ثم المالطية بوصفها لهجة عربية صارت لغة وطنية. وتبيّن الصفحة أن التصنيف ما زال موضع نقاش."
  en: "What the Encyclopaedia Britannica says about Arabic's place in the Semitic family: its membership of the Afro-Asiatic phylum, the clusters on which scholars largely agree, the debate over whether Arabic belongs to Central Semitic, to a branch of its own or to South Semitic, what it shares with its sister languages in broken plurals and the sound f, and then Maltese, a dialect of Arabic that became a national language. The page shows that classification remains a matter of debate."
  ur: "انسائیکلوپیڈیا برٹانیکا سامی خاندان میں عربی کے مقام کے بارے میں کیا کہتا ہے: افریقی ایشیائی گروہ سے اس کا تعلق، وہ شاخیں جن پر محققین بڑی حد تک متفق ہیں، اس بحث کہ عربی وسطی سامی میں ہے، الگ شاخ ہے یا جنوبی سامی میں، ٹوٹی ہوئی جمعوں اور حرف ف میں بہن زبانوں سے اس کا اشتراک، اور پھر مالٹی جو عربی کی ایک بولی تھی اور قومی زبان بنی۔ صفحہ بتاتا ہے کہ درجہ بندی اب بھی بحث کا موضوع ہے۔"
  fr: "Ce que dit l'Encyclopaedia Britannica de la place de l'arabe dans la famille sémitique : son appartenance au phylum afro-asiatique, les groupes sur lesquels les savants s'accordent largement, le débat sur le rattachement de l'arabe au sémitique central, à une branche propre ou au sémitique méridional, ce qu'il partage avec ses langues sœurs en pluriels brisés et en son f, puis le maltais, dialecte arabe devenu langue nationale. La page montre que la classification reste un sujet de débat."
  es: "Lo que dice la Encyclopaedia Britannica sobre el lugar del árabe en la familia semítica: su pertenencia al filo afroasiático, los grupos en los que los estudiosos concuerdan en gran medida, el debate sobre si el árabe pertenece al semítico central, a una rama propia o al semítico meridional, lo que comparte con sus lenguas hermanas en plurales rotos y en el sonido f, y luego el maltés, un dialecto árabe convertido en lengua nacional. La página muestra que la clasificación sigue siendo objeto de debate."
