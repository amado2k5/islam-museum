label:
  ar: "العشاء"
  en: "Night blindness (al-'asha)"
  fr: "La cécité nocturne (al-'asha)"
  ur: "شب کوری ⁦(عشاء)⁩"
  es: "ceguera nocturna (al-'asha)"
summary:
  ar: "العشاء أن يتعطل البصر ليلاً ويبصر نهاراً ويضعف في آخره، وسببه كثرة رطوبات، ويعرض للكحل دون الزرق ولصغار الحدق ولمن تكثر الألوان والتعاريج في عينه فإن ذلك يدل على قلة الروح الباصر في خلقته {cite:canon-ibn-sina-print-v2 p.206}"
  en: "Night blindness is the disabling of sight at night while it sees by day and weakens toward day's end; its cause is abundance of moistures, and it befalls the kohl-eyed rather than the blue-eyed, the small-pupilled, and those whose eye holds many colours and streaks, which points to a scant visual spirit in their constitution {cite:canon-ibn-sina-print-v2 p.206}"
  fr: "La cécité nocturne est l’impossibilité de voir la nuit, alors que la vue fonctionne le jour et faiblit en fin de journée. Ibn Sina l’attribue à un excès d’humidité. Selon lui, elle touche les personnes aux yeux noirs plutôt qu’aux yeux bleus, celles dont les pupilles sont petites et celles dont les yeux présentent de nombreuses couleurs et stries, signes que leur constitution manque d’esprit visuel {cite:canon-ibn-sina-print-v2 p.206}"
  ur: "شب کوری یہ ہے کہ بینائی رات کو معطل ہو جائے اور دن میں دیکھے اور دن کے آخر میں کمزور ہو؛ اس کا سبب رطوبتوں کی کثرت ہے، اور یہ سرمہ آنکھوں کو نیلوں کے بجائے، چھوٹی پتلی والوں کو اور جن کی آنکھ میں رنگ اور دھاریاں بہت ہوں، کو عرض کرتا ہے، کیونکہ یہ خلقت میں باصر روح کی قلت پر دلالت کرتا ہے {cite:canon-ibn-sina-print-v2 p.206}۔"
  es: "La ceguera nocturna es la pérdida de la vista durante la noche, mientras que la visión se mantiene durante el día y se debilita hacia el final del día; su causa es el exceso de humedad y afecta más a las personas de ojos delineados con kohl que a las de ojos azules, a las de pupilas pequeñas y a aquellas cuyos ojos presentan muchos colores y vetas, lo que indica una escasa capacidad visual en su constitución {cite:canon-ibn-sina-print-v2 p.206}"
