id: concept/canon-signs-by-what-they-indicate
class: concept
kind: scientific
label:
  ar: "العلامات الدالة على المرض وموضعه وسببه عند ابن سينا"
  en: "Signs that point to the disease, its place and its cause in the Canon"
  fr: "Signes de la maladie, de son lieu et de sa cause dans le Canon"
  ur: "مرض، اس کی جگہ اور سبب پر دلالت کرنے والی علامات، قانون کے مطابق"
  es: "Signos que señalan la enfermedad, su lugar y su causa en el Canon"
  tr: "İbn Sina'ya göre hastalığı, konumunu ve nedenini gösteren belirtiler"
  id: "Tanda-tanda yang menunjukkan penyakit, lokasinya, dan penyebabnya menurut Avicenna"
summary:
  ar: "يقسم ابن سينا الأعراض الدالة على الأمراض بحسب ما تدل عليه: نفس المرض، أو موضعه، أو سببه، ويضرب لكل منها مثالاً من النبض والامتلاء {cite:canon-ibn-sina-print-v1 p.154}."
  en: "Ibn Sina sorts the symptoms that point to diseases by what they indicate: the disease itself, its place, or its cause, with examples from the pulse and from fullness {cite:canon-ibn-sina-print-v1 p.154}."
  fr: "Ibn Sina classe les symptômes selon ce qu’ils indiquent : maladie même, son lieu ou sa cause, avec des exemples du pouls et de la pléthore {cite:canon-ibn-sina-print-v1 p.154}."
  es: "Ibn Sina clasifica los síntomas que apuntan a enfermedades según lo que indican: la enfermedad en sí, su lugar o su causa, con ejemplos del pulso y de la plenitud {cite:canon-ibn-sina-print-v1 p.154}."
  ur: "ابن سینا ان علامات کو ترتیب دیتے ہیں جو بیماریوں کی طرف اشارہ کرتے ہیں: بیماری خود، اس کی جگہ، یا اس کی وجہ، نبض اور مکمل ہونے کی مثالوں کے ساتھ۔"
  tr: "İbn Sina, hastalığı gösteren belirtileri hastalığın kendisi, yeri veya nedeni gibi belirtilere göre ayırır ve her birine nabız ve doluluk örnekleri verir {cite:canon-ibn-sina-print-v1 s.154}."
  id: "Ibn Sina membagi gejala yang menunjukkan penyakit berdasarkan apa yang ditandai: penyakit itu sendiri, lokasinya, atau penyebabnya, dan memberikan masing-masing contoh denyut nadi dan kepenuhan {cite:canon-ibn-sina-print-v1 hlm.154}."
