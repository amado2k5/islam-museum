label: { ar: "أشد تحيّر الكواكب عند البُعد الأبعد والأوسط والأقرب", en: "The planets' greatest irregularity at the far, mean and near points", ur: "سیاروں کا سب سے زیادہ تحیر بُعدِ اَبعد، اوسط اور اقرب پر", es: "La mayor irregularidad de los planetas en los puntos lejano, medio y cercano.", fr: "La plus grande irrégularité des planètes aux points lointains, moyens et proches", tr: "Gezegenlerin en büyük karışıklığı en uzak, orta ve en yakın mesafelerde meydana gelir.", id: "Kekacauan terbesar antar planet terjadi pada jarak terjauh, menengah, dan terdekat." }
summary:
  ar: "تتحير الكواكب الخمسة كثيراً في ثلاثة مواضع من أفلاك تدويرها: إذا وافق الكوكب نقطة البعد الأبعد، وإذا وافق نقطة البعد الأوسط، وإذا وافق نقطة البعد الأقرب، وفي غير ذلك من المواضع يكون مركز فلك التدوير على الفلك الخارج بين البعدين. {cite:zij-sabi-nallino-byblion p.99}."
  en: "The five planets are most irregular at three points on their epicycles: when the planet reaches the far point, when it reaches the mean point, and when it reaches the near point. Elsewhere the epicycle's centre lies between the two apsides on the eccentric. {cite:zij-sabi-nallino-byblion p.99}."
  ur: "پانچوں سیارے اپنے فلکِ تدویر کے تین مقامات پر سب سے زیادہ متحیر ہوتے ہیں: جب سیارہ بُعدِ اَبعد کے نقطے پر ہو، جب وہ بُعدِ اوسط کے نقطے پر ہو، اور جب بُعدِ اقرب کے نقطے پر ہو؛ باقی مقامات پر فلکِ تدویر کا مرکز خارج المرکز پر دونوں بُعدوں کے درمیان ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.99}۔"
  es: "Los cinco planetas presentan mayor irregularidad en tres puntos de sus epiciclos: cuando alcanzan el punto más alejado, cuando alcanzan el punto medio y cuando alcanzan el punto más cercano. En los demás casos, el centro del epiciclo se sitúa entre las dos ápsides del eje excéntrico. {cite:zij-sabi-nallino-byblion p.99}."
  fr: "Les cinq planètes présentent les irrégularités les plus marquées en trois points de leurs épicycles: lorsque la planète atteint le point le plus éloigné, lorsqu’elle atteint le point moyen et lorsqu’elle atteint le point le plus proche. Ailleurs, le centre de l’épicycle se situe entre les deux apsides de l’excentrique. {cite:zij-sabi-nallino-byblion p.99}."
  tr: "Beş gezegen, episikllerinin üç konumunda oldukça karmaşık bir durum sergiler: bir gezegen en uzak noktasıyla çakıştığında, orta noktasıyla çakıştığında ve en yakın noktasıyla çakıştığında. Diğer tüm konumlarda, episikl merkezi iki mesafe arasındaki en dıştaki küre üzerinde yer alır. {cite:zij-sabi-nallino-byblion s.99}."
  id: "Kelima planet tersebut sangat membingungkan dalam tiga posisi epikikelnya: ketika sebuah planet bertepatan dengan titik terjauhnya, ketika bertepatan dengan titik tengahnya, dan ketika bertepatan dengan titik terdekatnya. Pada semua posisi lainnya, pusat epikikel terletak pada bola terluar di antara kedua jarak tersebut. {cite:zij-sabi-nallino-byblion p.99}."
