id: concept/al-suda-min-al-awram
class: concept
kind: scientific
label:
  ar: "الصداع الكائن عن الأورام"
  en: "Headache from swellings"
  fr: "Céphalée due aux gonflements"
  ur: "ورموں سے ہونے والا صداع"
  es: "Dolor de cabeza por hinchazón"
  tr: "Tümörlerin neden olduğu baş ağrısı"
  id: "Sakit kepala yang disebabkan oleh tumor"
summary:
  ar: "يعدّ ابن سينا الأورام التي يحدث عنها الصداع في حجب الدماغ وفي جوهره، حارةً وباردةً ومركبةً وصلبة، ويسمّي بعضها بأسمائها، ويبيّن أنها كثيراً ما تنحل بخروج مادة من الرأس {cite:canon-ibn-sina-print-v2 p.48}"
  en: "Ibn Sina lists the swellings that bring about headache in the membranes of the brain and in its substance, hot, cold, compound and hard, names some of them, and says that they often dissolve by a matter coming out of the head {cite:canon-ibn-sina-print-v2 p.48}"
  fr: "Ibn Sina énumère les gonflements qui provoquent une céphalée dans les membranes du cerveau ou dans sa substance : chauds, froids, composés et durs. Il donne le nom de certains et dit qu’ils se résorbent souvent lorsqu’une matière s’écoule hors de la tête {cite:canon-ibn-sina-print-v2 p.48}"
  ur: "ابن سینا ان ورموں کو گنتا ہے جن سے دماغ کی جھلیوں اور اس کے جوہر میں صداع ہوتا ہے، گرم، ٹھنڈے، مرکب اور سخت، ان میں سے بعض کے نام لیتا ہے، اور بتاتا ہے کہ وہ اکثر سر سے کسی مادے کے نکلنے سے تحلیل ہو جاتے ہیں {cite:canon-ibn-sina-print-v2 p.48}۔"
  es: "Ibn Sina enumera las inflamaciones que provocan dolor de cabeza en las membranas del cerebro y en su sustancia, calientes, frías, compuestas y duras, nombra algunas de ellas y dice que a menudo se disuelven por una sustancia que sale de la cabeza {cite:canon-ibn-sina-print-v2 p.48}."
  tr: "İbn Sina, beyin zarı ve çekirdeğinde baş ağrısına neden olan tümörleri sıcak, soğuk, bileşik ve sert olarak görür, bazılarına isimleriyle isimler verir ve genellikle bir madde kafadan çıktığında çözündüklerini açıklar {cite:canon-ibn-sina-print-v2 s.48}"
  id: "Ibn Sina menganggap tumor yang menyebabkan sakit kepala di meninges dan inti sebagai panas, dingin, majemuk, dan keras, memberikan beberapa nama, dan biasanya menjelaskan bahwa tumor tersebut larut ketika suatu zat meninggalkan kepala {cite:canon-ibn-sina-print-v2 hlm.48}"
