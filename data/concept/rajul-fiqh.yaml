id: concept/rajul-fiqh
class: concept
kind: legal
label:
  ar: "الرجل"
  en: "Rajul (the adult male): the rules that set men apart from women"
  ur: "مرد"
summary:
  ar: "الرجل في الاصطلاح الذكر من بني آدم إذا جاوز حد الصغر بالبلوغ، وفي الميراث يُطلق على الذكر من حين يولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8641} ويختص الرجل بأحكام، منها تحريم لبس الحرير، وتحريم الذهب عليه، وإباحة الفضة في الخاتم، وعورته ما بين السرة والركبة، واختصاصه بالأذان وإمامة الرجال وصلاة الجمعة، ودية الحر المسلم مائة من الإبل، ووجوب الجهاد عليه إذا كان فرض كفاية، ويختص بالشهادة في القود والحدود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8641} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8642} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8643} وفي الميراث والولاية يقدم الرجل في كل ولاية هو أقوم بمصالحها، وتقدم المرأة في الحضانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8644}"
  en: "In the technical sense a rajul is a male of mankind who has passed childhood by puberty; for inheritance the word covers a male from birth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8641} Men are distinguished by several rules: silk and gold are forbidden to them, a silver ring is allowed, their nakedness runs from navel to knees, the call to prayer, leading men in prayer and the Friday prayer are theirs, the blood-money of a free Muslim man is one hundred camels, and jihad is obligatory on them when it is a collective duty. Only men give testimony in retaliation and hudud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8641} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8642} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8643} In inheritance and guardianship the man precedes where he is better placed to protect the interests, while the woman precedes in custody. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8644}"
  ur: "رجل سے مراد بالغ مرد ہے؛ مردوں کے لیے ریشم اور سونا حرام ہے، اور اذان، امامت اور جمعہ کے کچھ احکام انہی سے مخصوص ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8641} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8643}"
