  ar: "تعظيم صوت حروف الاستعلاء والإطباق وتصغير صوت المستفلة، مع أحكام الراءات ولام اسم الجلالة كما يفصلها بابا الراءات واللامات من الجزرية {cite:ar-wikisource}."
  en: "The magnifying of the isti'la and itbaq letters and the lightening of the mustafil ones, together with the rulings of the ra letters and the lam of the divine name as the Jazariyya's chapters of the ra and the lam set them out {cite:ar-wikisource}."
