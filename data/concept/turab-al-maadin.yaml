label:
  ar: "تراب المعادن"
  en: "Dust of ores (turab al-maadin)"
  ur: "کانوں کی مٹی (تراب المعادن)"
summary:
  ar: "تراب المعادن ما يتساقط من جوهر المعدن نفسه دون اختلاط بغيره، وأحكامه تتعلق بتغير الماء، والتيمم، والزكاة، وبيع بعضه ببعض. وتختلف المذاهب في التيمم بالمعادن: فالحنفية يجيزونه بما لا ينطبع ولا يلين، والشافعية والحنابلة لا يجيزونه إلا بتراب طاهر أو برمل له غبار، والمالكية يجيزونه ما لم تنقل من محالها. والزكاة تجب في الذهب والفضة باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4921}"
  en: "Dust of ores is what falls from the ore itself without mixing with another substance. Its rulings concern water changed by it, tayammum, zakat and selling one part for another. The schools differ on tayammum with ores: the Hanafis allow it with what neither melts nor softens; the Shafi'is and Hanbalis allow only clean earth or sand with dust; the Malikis allow it while the ore is not moved from its place. Zakat is due on gold and silver by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4921}"
