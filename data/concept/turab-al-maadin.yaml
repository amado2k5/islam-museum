label:
  ar: "تراب المعادن"
  en: "Dust of ores (turab al-maadin)"
  ur: "کانوں کی مٹی ⁦(تراب المعادن)⁩"
  es: "Polvo de minerales (turab al-maadin)"
  fr: "Poussière de minerais (turab al-maadin)"
summary:
  ar: "تراب المعادن ما يتساقط من جوهر المعدن نفسه دون اختلاط بغيره، وأحكامه تتعلق بتغير الماء، والتيمم، والزكاة، وبيع بعضه ببعض. وتختلف المذاهب في التيمم بالمعادن: فالحنفية يجيزونه بما لا ينطبع ولا يلين، والشافعية والحنابلة لا يجيزونه إلا بتراب طاهر أو برمل له غبار، والمالكية يجيزونه ما لم تنقل من محالها. والزكاة تجب في الذهب والفضة باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4921}"
  en: "Dust of ores is what falls from the ore itself without mixing with another substance. Its rulings concern water changed by it, tayammum, zakat and selling one part for another. The schools differ on tayammum with ores: the Hanafis allow it with what neither melts nor softens; the Shafi'is and Hanbalis allow only clean earth or sand with dust; the Malikis allow it while the ore is not moved from its place. Zakat is due on gold and silver by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4921}"
  es: "El polvo de los minerales es lo que cae del propio mineral sin mezclarse con otra sustancia. Sus normas se refieren al agua alterada por él, el tayammum, el zakat y la venta de una parte por otra. Las escuelas difieren en cuanto al tayammum con los minerales: los hanafíes lo permiten con lo que no se funde ni se ablanda; los shafiíes y los hanbalíes lo permiten solo con tierra o arena limpia con polvo; los malikíes lo permiten siempre que el mineral no se mueva de su lugar. El zakat se debe sobre el oro y la plata por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4921}"
  fr: "La poussière de minerai est ce qui se détache du minerai sans se mélanger à une autre substance. Ses règles concernent l'eau qu'elle modifie, le tayammum, la zakat et la vente d'une partie du minerai contre une autre. Les écoles divergent quant au tayammum des minerais: les hanafites l'autorisent pour les matières qui ne fondent ni ne ramollissent; les chaféites et les hanbalites l'autorisent uniquement pour la terre ou le sable propres contenant de la poussière; les malikites l'autorisent tant que le minerai reste sur place. La zakat est due sur l'or et l'argent par convention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4921}"
  ur: "کچ دھاتوں کی دھول وہ ہے جو کسی دوسرے مادے کے ساتھ اختلاط کیے بغیر خود دھات سے گرتی ہے۔ اس کے احکام میں پانی کی تبدیلی، تیمم، زکوٰۃ اور ایک حصہ دوسرے کے بدلے بیچنا ہے۔ مکاتب میں کچ دھاتوں کے ساتھ تیمم پر اختلاف ہے: احناف اس کی اجازت دیتے ہیں جو نہ پگھلتی ہے اور نہ نرم ہوتی ہے۔ شافعی اور حنبلی صرف مٹی یا ریت کو صاف کرنے کی اجازت دیتے ہیں۔ مالکی اس کی اجازت دیتے ہیں جبکہ کچ دھات اپنی جگہ سے نہیں ہٹائی جاتی ہے۔ سونا چاندی پر زکوٰۃ واجب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4918} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4919} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4920} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4919} صفحہ 4921}"
