id: concept/rafd-fiqh
class: concept
kind: legal
label:
  ar: "الرفض"
  en: "Rafd (abandoning an act of worship or an intention in it): its effect on ablution, prayer, fasting, the state of ihram and the pilgrimage"
  ur: "ترکِ عبادت (رفض)"
summary:
  ar: "الرفض في اللغة الترك، وفي الاصطلاح جعل ما وُجد من العبادة والنية كالمعدوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8802} والرفض يختلف عن الفسخ والإفساد والإبطال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8803} وذهب جمهور الفقهاء إلى أن رفض نية الوضوء بعد تمامه لا يؤثر، ورفض نية الصلاة في أثنائها مبطل لها، وذهب المالكية والحنابلة والشافعية في قول إلى أن رفض نية الصوم يبطله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8803} وذهب الحنفية إلى أن رفض الإحرام لا يبطله، وإذا رفض المكي أحد النسكين عند الإحرام بالحج مع العمرة لزمه دم الرفض والقضاء عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8806}"
  en: "Rafd in the lexicon is abandonment; in the jurists' usage it is treating what has been done of the act and its intention as if it had not been. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8802} It differs from annulment, from defect and from voiding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8803} For the majority, abandoning the intention of ablution after it is complete has no effect, while abandoning the intention of prayer during it voids it; the Malikis, Hanbalis and one Shafi'i view hold that abandoning the intention of fasting voids the fast. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8803} The Hanafis hold that abandoning ihram does not void it, and if a Meccan who has begun the lesser pilgrimage adds the greater one, the Hanafis require him to abandon one of them with a sacrifice and a makeup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8806}"
  ur: "رفض کسی عبادت یا اس کی نیت کو ترک کرنا ہے؛ نماز کی نیت کا ترک نماز کو باطل کرتا ہے، اور حنفی احرام کے رفض کو باطل نہیں مانتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8804}"
