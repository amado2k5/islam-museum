id: concept/intercession-shafaa
class: concept
kind: legal
label:
  ar: "الشَّفاعة"
  en: "Shafa'a (intercession: good and bad, in the hereafter, for prescribed penalties, and the gift it may bring)"
  es: "Shafa'a (intercesión: buena y mala, en el más allá, por las penas prescritas y el don que pueda traer)"
  fr: "Shafa'a (intercession: bonne et mauvaise, dans l'au-delà, pour les peines prescrites, et le don qu'elle peut apporter)"
  ur: "شفاعت ⁦(شفاعت: اچھے اور برے، آخرت میں، مقررہ سزاؤں کے لیے، اور اس سے ملنے والا تحفہ)⁩"
  tr: "Aracılık"
  id: "Perantaraan"
summary:
  ar: "الشفاعة توسط القول لوصول شخص إلى منفعة أو دفع مضرة، وهي حسنة إذا كانت فيما استحسنه الشرع، وسيئة إذا كانت فيما كرهه وحرمه. وأجمع أهل السنة على وقوع الشفاعة في الآخرة لمذنبي المسلمين، وذكر العلماء لها خمسة أقسام. وتحرم الشفاعة في الحد بعد بلوغ الحاكم، وتجوز قبل ذلك، وتجوز في التعزير ويستحب إذا لم يكن المشفوع له من أهل الشر. وأخذ الهدية على الشفاعة حرام إن كانت لمحرم أو إسقاط حق أو إعانة على ظلم، ويختلف الفقهاء فيها إذا كانت لرفع مظلمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10107}"
  en: "Intercession is speaking on another's behalf so that a person gains a benefit or is spared harm. It is good when the law approves it, and bad when it is for what the law dislikes or forbids. The Sunni community agree that intercession will take place in the hereafter for believers who have sinned, and the scholars list five kinds of it. Intercession for a prescribed penalty is forbidden once the case has reached the ruler and permitted before that; it is allowed, and even recommended, for discretionary penalties unless the person interceded for is a wicked one. Taking a gift for intercession is unlawful when it is for a forbidden purpose, to drop a right, or to aid oppression, and the jurists differ where it lifts a wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10107}"
  es: "La intercesión consiste en interceder por otra persona para que obtenga un beneficio o se libre de un daño. Es buena cuando la ley la aprueba y mala cuando se realiza para lo que la ley desaprueba o prohíbe. La comunidad sunita coincide en que la intercesión tendrá lugar en el más allá por los creyentes que han pecado, y los eruditos enumeran cinco tipos de intercesión. La intercesión por una pena prescrita está prohibida una vez que el caso ha llegado al gobernante y permitida antes de eso; está permitida, e incluso recomendada, para penas discrecionales, a menos que la persona por la que se intercede sea malvada. Aceptar un regalo por la intercesión es ilícito cuando se hace con un propósito prohibido, para renunciar a un derecho o para ayudar a la opresión, y los juristas difieren en cuanto a si se hace para levantar una injusticia. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10103} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10104} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10105} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10106} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10107}"
  fr: "L'intercession consiste à parler en faveur d'autrui afin qu'il obtienne un avantage ou soit épargné d'un préjudice. Elle est louable lorsqu'elle est approuvée par la loi, et illicite lorsqu'elle vise quelque chose qu'elle désapprouve ou interdit. La communauté sunnite reconnaît que l'intercession aura lieu dans l'au-delà pour les croyants ayant péché, et les savants en recensent cinq types. L'intercession pour une peine prescrite est interdite une fois que l'affaire est parvenue au souverain, mais permise auparavant; elle est autorisée, voire recommandée, pour les peines discrétionnaires, sauf si la personne pour laquelle on intercède est une personne perverse. Accepter un don en échange d'une intercession est illicite lorsqu'il sert un but interdit, vise à renoncer à un droit ou à soutenir l'oppression; les juristes divergent quant à son application lorsqu'il s'agit de réparer un tort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10107}"
  ur: "شفاعت کسی دوسرے کی طرف سے بات کرنا ہے تاکہ کسی شخص کو فائدہ پہنچے یا نقصان سے بچ جائے۔ یہ اچھا ہے جب قانون اسے منظور کرے، اور برا جب وہ اس کے لیے ہو جس کو قانون ناپسند کرتا ہے یا منع کرتا ہے۔ سنی برادری اس بات پر متفق ہے کہ آخرت میں ان مومنین کی شفاعت ہوگی جنہوں نے گناہ کیا ہے، اور علماء نے اس کی پانچ اقسام کی فہرست دی ہے۔ جب معاملہ حاکم تک پہنچ جائے اور اس سے پہلے اجازت دے دی جائے تو مقررہ جرمانے کی شفاعت حرام ہے۔ صوابدیدی سزاؤں کے لیے اس کی اجازت ہے، اور یہاں تک کہ سفارش کی جاتی ہے، جب تک کہ شفاعت کرنے والا شخص بدکار نہ ہو۔ شفاعت کے لیے ہدیہ لینا حرام ہے جب وہ کسی حرام مقصد کے لیے ہو، حق چھوڑنے کے لیے ہو، یا ظلم کی مدد کے لیے ہو، اور فقہاء کا اختلاف ہے کہ یہ کہاں سے برائی کو اٹھاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10103} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10104} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10105} صفحہ 10106} {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 10107}"
  tr: "Aracılık, bir kişinin fayda sağlaması veya zararı önlemesi için kullanılan ılımlı ifadedir; Şeriat'ın onayladığı şeyde iyi, hoşlanmadığı ve yasakladığı şeylerde gerçekleşiyorsa kötüdür. Ehl-sünnet, ahirette Müslümanlar arasında günahkarlara karşı aracılığın geçerli olduğunu oybirliğiyle kabul eder ve alimler bunun için beş tür belirtmiştir. Rahmet ergenliğine ulaştıktan sonra hudud durumunda aracılık yasaktır, ondan önce de izin verilir, takdire bağlı cezalarda da izin verilir ve aracılık edilen kişi kötü kişilerden değilse tavsiye edilir. Eğer yasak bir kişi için, hakkını kaybetmek veya haksızlığa yardım etmek için aracılık armağanı almak yasaktır. Hukukçular, şikayeti gidermek için farklılık gösterir. {alıntı:atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.10103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10107}"
  id: "Perantaraan adalah pernyataan moderat bagi seseorang untuk mendapatkan manfaat atau mencegah kerugian; baik jika itu dalam apa yang disetujui oleh Syariah, dan buruk jika terjadi dalam apa yang tidak disukai dan dilarangnya. Ahl al-Sunnah sepakat bulat bahwa perantaraan berlaku di akhirat bagi orang berdosa di kalangan Muslim, dan para ulama telah menyebutkan lima jenisnya. Perantaraan dilarang dalam kasus hudud setelah hakim mencapai masa pubertas, dan diperbolehkan sebelum itu, serta diperbolehkan dalam hukuman yang disesuaikan, dan direkomendasikan jika orang yang dimohon tidak berada di antara umat jahat. Mengambil hadiah untuk perantaraan dilarang jika itu untuk orang yang dilarang, untuk kehilangan hak, atau untuk membantu dalam ketidakadilan. Para ahli hukum berbeda pendapat jika itu untuk menghilangkan keluhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10107}"
