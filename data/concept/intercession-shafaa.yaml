id: concept/intercession-shafaa
class: concept
kind: legal
label:
  ar: "الشَّفاعة"
  en: "Shafa'a (intercession: good and bad, in the hereafter, for prescribed penalties, and the gift it may bring)"
summary:
  ar: "الشفاعة توسط القول لوصول شخص إلى منفعة أو دفع مضرة، وهي حسنة إذا كانت فيما استحسنه الشرع، وسيئة إذا كانت فيما كرهه وحرمه. وأجمع أهل السنة على وقوع الشفاعة في الآخرة لمذنبي المسلمين، وذكر العلماء لها خمسة أقسام. وتحرم الشفاعة في الحد بعد بلوغ الحاكم، وتجوز قبل ذلك، وتجوز في التعزير ويستحب إذا لم يكن المشفوع له من أهل الشر. وأخذ الهدية على الشفاعة حرام إن كانت لمحرم أو إسقاط حق أو إعانة على ظلم، ويختلف الفقهاء فيها إذا كانت لرفع مظلمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10107}"
  en: "Intercession is speaking on another's behalf so that a person gains a benefit or is spared harm. It is good when the law approves it, and bad when it is for what the law dislikes or forbids. The Sunni community agree that intercession will take place in the hereafter for believers who have sinned, and the scholars list five kinds of it. Intercession for a prescribed penalty is forbidden once the case has reached the ruler and permitted before that; it is allowed, and even recommended, for discretionary penalties unless the person interceded for is a wicked one. Taking a gift for intercession is unlawful when it is for a forbidden purpose, to drop a right, or to aid oppression, and the jurists differ where it lifts a wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10103} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10107}"
