summary:
  ar: "الكرفس أصناف: جبلي وبري وبستاني ومائي وسمرنيون، حار في أول الدرجة يابس في الثانية، محلل للنفخ مفتح للسدد معرق مسكن للأوجاع، ويُحذر للمصروع والحامل {cite:canon-ibn-sina-print-v1 p.529} {cite:canon-ibn-sina-print-v1 p.530}."
  en: "Celery has many kinds: mountain, wild, garden, water, and the smyrnion. It is hot in the first degree and dry in the second, dispels wind, opens obstructions, brings sweat and soothes pains; the book warns against it for the epileptic and the pregnant {cite:canon-ibn-sina-print-v1 p.529} {cite:canon-ibn-sina-print-v1 p.530}."
  ur: "کرفس کی کئی قسمیں ہیں: پہاڑی، جنگلی، باغی، پانی کی اور سمرنیون۔ پہلے درجے میں گرم اور دوسرے میں خشک ہے، ریاح کو تحلیل کرتا ہے، رکاوٹیں کھولتا ہے، پسینہ لاتا ہے اور دردوں کو تسکین دیتا ہے؛ کتاب مرگی والے اور حاملہ کے لیے اس سے خبردار کرتی ہے {cite:canon-ibn-sina-print-v1 p.529} {cite:canon-ibn-sina-print-v1 p.530}۔"
  es: "El apio tiene muchas variedades: de montaña, silvestre, de jardín, de agua y de Esmirna. Es caliente en el primer grado y seco en el segundo, disipa el viento, abre obstrucciones, provoca sudoración y alivia dolores; el libro advierte contra su consumo para epilépticos y embarazadas {cite:canon-ibn-sina-print-v1 p.529} {cite:canon-ibn-sina-print-v1 p.530}."
  fr: "Le céleri se présente sous de nombreuses formes: de montagne, sauvage, de jardin, d’eau et le céleri-smyrnion. Il est chaud au premier degré et sec au second; il dissipe le vent, débloque les voies respiratoires, favorise la transpiration et soulage les douleurs. Le livre le déconseille aux épileptiques et aux femmes enceintes {cite:canon-ibn-sina-print-v1 p.529} {cite:canon-ibn-sina-print-v1 p.530}."
  tr: "Kereviz çeşitleri: dağ, yabani, bahçecilik, sucul ve Samarnon. İlk derecede sıcak, ikinci derece kuru, şişirilebilir, anti-inflamatuar, ağrı kesici ve hasta ile hamile olanlar için uyarı {cite:canon-ibn-sina-print-v1 s.529} {cite:canon-ibn-sina-print-v1 s.530}."
  id: "Varietas seledri: gunung, liar, hortikultura, akuatik, dan Samarnon. Panas pada derajat pertama, keringkan derajat kedua, dapat dikembangkan, anti-inflamasi, pereda nyeri, dan peringatan untuk yang sakit dan hamil {cite:canon-ibn-sina-print-v1 hlm.529} {cite:canon-ibn-sina-print-v1 hlm.530}."
