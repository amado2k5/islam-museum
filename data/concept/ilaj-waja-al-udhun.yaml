label:
  ar: "معالجة وجع الأذن"
  en: "The treatment of earache"
  ur: "کان کے درد کا علاج"
summary:
  ar: "يحفظ القانون في تقطير ما يقطر في الأذن أن يكون غير شديد الحر والبرد؛ فإن كان السبب امتلاء في البدن أو الرأس استفرغت ناحية الرأس من جنس ذلك الامتلاء، وإن كان السبب حرارة مفرطة برّد الدماغ بالمطفئات المعروفة، وإن كان السبب برودة متمكنة في العمق أو من خارج كانت القطورات من الأدهان الحارة، وإن كان ريحاً باردة نفع ما يذكر في باب الدوي والطنين، وإن كان ورماً حاراً غائصاً وهو مخاطرة لقربه من الدماغ فبعد الفصد والاستفراغ تستعمل الملينات المبردات أولاً ثم ما ينضج، وربما احتيج إلى المخدرات فيؤخر ذلك إلى أن يخاف الغشي ⁦⁦(أسماء الأدوية والأدهان والشيافات والمراهم والمخدرات ومقاديرها لا تحمل، وسطور لبن النساء أسطر موسومة مطروحة لحكم المؤسس)⁩⁩ {cite:canon-ibn-sina-print-v2 p.223} {cite:canon-ibn-sina-print-v2 p.224} {cite:canon-ibn-sina-print-v2 p.225}"
  en: "The rule is kept that whatever is dropped in the ear be neither very hot nor very cold. If the cause is repletion in body or head, the head region is evacuated of that kind of repletion; if extreme heat, the brain is cooled by the known extinguishers; if a settled cold deep in or from outside, the drops are the hot oils; if a cold wind, what is said in the ringing and buzzing chapter helps; if a deep-lying hot swelling — a hazard for nearness to the brain — then after venesection and evacuation the cooling lenitives are used first, then what ripens; narcotics may be needed and are delayed until fainting is feared ⁦(drug, oil, suppository, ointment and narcotic names and their measures are not carried; the woman's-milk lines are labelled listings for the founder's ruling)⁩ {cite:canon-ibn-sina-print-v2 p.223} {cite:canon-ibn-sina-print-v2 p.224} {cite:canon-ibn-sina-print-v2 p.225}"
  ur: "قاعدہ یہ رکھا جاتا ہے کہ جو کان میں ٹپکایا جائے وہ نہ بہت گرم ہو نہ بہت ٹھنڈا؛ اگر سبب بدن یا سر میں امتلاء ہو تو سر کی طرف سے اسی جنس کے امتلاء کا استفراغ کیا جائے؛ اگر نہایت گرمی ہو تو دماغ کو معروف بجھانے والی چیزوں سے ٹھنڈا کیا جائے؛ اگر اندر یا باہر سے مستحکم ٹھنڈ ہو تو قطرے گرم تیلوں کے ہوں؛ اگر سرد ہوا ہو تو گونج اور بھنبھناہٹ کے باب کی چیز نفع دیتی ہے؛ اور اگر گہرا گرم ورم ہو — جو دماغ کی قربت سے خطرناک ہے — تو فصد اور استفراغ کے بعد پہلے ٹھنڈے ملین استعمال ہوں پھر پکانے والے؛ اور مخدروں کی حاجت پڑے تو اسے اس وقت تک مؤخر رکھیں کہ غش کا خوف ہو ⁦⁦(ادویہ، تیلوں، شیافات، مرہموں اور مخدروں کے نام اور مقدار منقول نہیں؛ عورتوں کے دودھ کی سطریں بانی کے فیصلے کے لیے موسوم فہرست ہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.223} {cite:canon-ibn-sina-print-v2 p.224} {cite:canon-ibn-sina-print-v2 p.225}"
