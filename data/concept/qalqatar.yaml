label:
  ar: "قلقطار"
  en: "Qalqatar (yellow vitriol, per the editor's note)"
  ur: "قلقطار"
  es: "Qalqatar (vitriolo amarillo, según la nota del editor)"
  fr: "Qalqatar (vitriol jaune, selon la note de l'éditeur)"
summary:
  ar: "القلقطار في الكتاب حار يابس في الثالثة، فيه إحراق شديد وقبض للسيلانات الدموية وتجفيف، وفي الحاشية أنه الزاج الأصفر، وينفع من النملة والحمرة والرعاف وأورام اللثة {cite:canon-ibn-sina-print-v1 pp.651-652}"
  en: "Qalqatar is in the book hot and dry in the third degree, with a strong burning power and a binding of flows of blood and a drying; the editor's note says it is yellow vitriol; it benefits erysipelas, nosebleed and swellings of the gums {cite:canon-ibn-sina-print-v1 pp.651-652}"
  ur: "قلقطار کتاب میں تیسرے درجے میں گرم خشک ہے، اس میں سخت جلانے کی قوت، خونی بہاؤ کو روکنے اور خشک کرنے کی صلاحیت ہے؛ حاشیے کے مطابق یہ زاج اصفر ہے؛ نملہ، حمرہ، نکسیر اور مسوڑھوں کے ورم میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.651-652}۔"
  es: "En el libro, Qalqatar es caliente y seco en tercer grado, con un fuerte poder de quemazón y que detiene los flujos sanguíneos y produce sequedad; la nota del editor dice que es vitriolo amarillo; beneficia la erisipela, las hemorragias nasales y la inflamación de las encías {cite:canon-ibn-sina-print-v1 pp.651-652}"
  fr: "Qalqatar est décrit dans le livre comme chaud et sec au troisième degré, avec un fort pouvoir brûlant, un effet stoppant les saignements et un asséchant; la note de l'éditeur indique qu'il s'agit de vitriol jaune; il est bénéfique pour l'érysipèle, les saignements de nez et les gonflements des gencives {cite:canon-ibn-sina-print-v1 pp.651-652}"
