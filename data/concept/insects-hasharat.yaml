summary:
  ar: "الحشرات صغار دواب الأرض وهوامها، وقيل هي هوام الأرض مما لا سم له، وتختلف عن تعريفها عند علماء الحيوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} وفي أكلها اتجاهان: الحنفية والشافعية والحنابلة يحرمونها إلا الجراد، واستثنى الشافعية والحنابلة الضب واليربوع وغيرهما، والمالكية يحلون جميع الحشرات إلا الخنزير، وبعضهم يحرمها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7093} ومن أكلها إذا كان لها نفس سائلة وجبت تذكيتها، وما لا نفس سائلة له كالجراد فلا تشترط تذكيته عند جمهور القائلين بإباحته، وقال المالكية: لا بد من تذكيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7094} وقتل الحشرات ليس مأمورا به مطلقا ولا منهيا عنه مطلقا؛ فيندب قتل المؤذي منها كالفواسق الخمس والحيات والوزغ والفأر، ويحرم عند الشافعية قتل النمل السليماني والنحل والضفدع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7095} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} وللمحرم قتل الحشرات عند الحنفية والشافعية والحنابلة، لأنها لا تدخل في الصيد المحرم، والمالكية يجيزون قتل المؤذي لدفع الأذى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7098}"
  en: "Insects (hasharat) are the small creatures of the earth and its vermin; some say the earth's vermin without venom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} On eating them there are two views: the Hanafis, Shafi'is and Hanbalis forbid all except the locust, the Shafi'is and Hanbalis permit the lizard and similar small animals, and the Malikis permit all except the pig, while some Malikis forbid them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7093} Creatures with blood must be slaughtered before eating; the locust needs no slaughter according to the majority, but the Malikis require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7094} Killing insects is neither enjoined nor forbidden in general: the harmful ones, such as the five vermin, the snake, the gecko and the mouse, may be killed, while the Shafi'is forbid killing the Solomonic ant, the bee and the frog. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7095} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} The Hanafis, Shafi'is and Hanbalis do not count insects as game for the pilgrim in ihram, and the Malikis allow killing a harmful one to remove the harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7098}"
