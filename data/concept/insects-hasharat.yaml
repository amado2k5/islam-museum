label: { ar: "الحشرات", en: "Insects (hasharat)", ur: "حشرات", es: "Insectos (hasharat)", fr: "Insectes (hasharat)" }
summary:
  ar: "الحشرات صغار دواب الأرض وهوامها، وقيل هي هوام الأرض مما لا سم له، وتختلف عن تعريفها عند علماء الحيوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} وفي أكلها اتجاهان: الحنفية والشافعية والحنابلة يحرمونها إلا الجراد، واستثنى الشافعية والحنابلة الضب واليربوع وغيرهما، والمالكية يحلون جميع الحشرات إلا الخنزير، وبعضهم يحرمها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7093} ومن أكلها إذا كان لها نفس سائلة وجبت تذكيتها، وما لا نفس سائلة له كالجراد فلا تشترط تذكيته عند جمهور القائلين بإباحته، وقال المالكية: لا بد من تذكيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7094} وقتل الحشرات ليس مأمورا به مطلقا ولا منهيا عنه مطلقا؛ فيندب قتل المؤذي منها كالفواسق الخمس والحيات والوزغ والفأر، ويحرم عند الشافعية قتل النمل السليماني والنحل والضفدع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7095} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} وللمحرم قتل الحشرات عند الحنفية والشافعية والحنابلة، لأنها لا تدخل في الصيد المحرم، والمالكية يجيزون قتل المؤذي لدفع الأذى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7098}"
  en: "Insects (hasharat) are the small creatures of the earth and its vermin; some say the earth's vermin without venom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} On eating them there are two views: the Hanafis, Shafi'is and Hanbalis forbid all except the locust, the Shafi'is and Hanbalis permit the lizard and similar small animals, and the Malikis permit all except the pig, while some Malikis forbid them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7093} Creatures with blood must be slaughtered before eating; the locust needs no slaughter according to the majority, but the Malikis require it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7094} Killing insects is neither enjoined nor forbidden in general: the harmful ones, such as the five vermin, the snake, the gecko and the mouse, may be killed, while the Shafi'is forbid killing the Solomonic ant, the bee and the frog. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7095} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} The Hanafis, Shafi'is and Hanbalis do not count insects as game for the pilgrim in ihram, and the Malikis allow killing a harmful one to remove the harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7098}"
  es: "Los insectos (hasharat) son las pequeñas criaturas de la tierra y sus alimañas; algunos dicen que las alimañas de la tierra sin veneno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} Sobre comerlos hay dos puntos de vista: los hanafíes, shafi'ís y hanbalíes prohíben todos excepto la langosta, los shafi'ís y hanbalíes permiten el lagarto y animales pequeños similares, y los malikíes permiten todos excepto el cerdo, mientras que algunos malikíes los prohíben. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7093} Las criaturas con sangre deben ser sacrificadas antes de comerlas; La langosta no necesita ser sacrificada según la mayoría, pero los malikíes lo exigen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7094} Matar insectos no está ni prescrito ni prohibido en general: los dañinos, como los cinco parásitos, la serpiente, el gecko y el ratón, pueden ser eliminados, mientras que los shafi'íes prohíben matar la hormiga salomónica, la abeja y la rana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7095} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} Los Hanafis, Shafi'is y Hanbalis no cuentan los insectos como caza para el peregrino en ihram, y los Malikis permiten matar a alguien dañino para eliminar el daño. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7098}"
  fr: "Les insectes (hasharat) sont les petites créatures de la terre et ses vermines; certains disent les vermines de la terre non venimeuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} Concernant leur consommation, deux avis divergent: les hanafites, les chaféites et les hanbalites interdisent tous les insectes sauf la sauterelle; les chaféites et les hanbalites autorisent le lézard et les petits animaux similaires; et les malikites autorisent tous les insectes sauf le porc, tandis que certains malikites les interdisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7093} Les créatures à sang doivent être abattues avant d'être consommées. L'abattage du criquet n'est pas nécessaire selon la majorité, mais les Malikites l'exigent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7094} Tuer des insectes n'est ni prescrit ni interdit en général: les nuisibles, tels que les cinq vermines, le serpent, le gecko et la souris, peuvent être tués, tandis que les Chafi'ites interdisent de tuer la fourmi salomonique, l'abeille et la grenouille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7095} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7096} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} Les Hanafis, les Shafi'is et les Hanbalis ne comptent pas les insectes comme un gibier pour le pèlerin ihram, et les Malikis permettent de tuer quelqu'un de nuisible pour éliminer le mal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7097} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7098}"
  ur: "حشرات ⁦(حشرات)⁩ زمین کی چھوٹی مخلوق اور اس کے کیڑے ہیں۔ کچھ کہتے ہیں کہ زہر کے بغیر زمین کا کیڑا ہے۔ {حوالہ: فقہ الموسوعۃ النور ص3 ص7091} ان کے کھانے کے بارے میں دو قول ہیں: حنفیہ، شافعی اور حنبلی ٹڈی کے علاوہ باقی سب کو حرام قرار دیتے ہیں، شافعی اور حنبلی چھپکلی اور اس جیسے چھوٹے جانوروں کی اجازت دیتے ہیں، اور مالکیہ سور کے علاوہ باقی سب کو حلال دیتے ہیں، جب کہ بعض مالکی سور کے لیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7091} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7092} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7093} خون آلود مخلوق کو کھانے سے پہلے ضروری ہے ٹڈی کو اکثریت کے مطابق ذبح کرنے کی ضرورت نہیں ہے، لیکن مالکیوں کو اس کی ضرورت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7094} حشرات الارض کو مارنا نہ تو حکم ہے اور نہ ہی عام طور پر حرام ہے: ضرر رساں، جیسے پانچ کیڑے، سانپ، چھپکلی اور چوہے کو مارا جا سکتا ہے، جب کہ شافعی مارنے سے منع کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7095} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7096} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7097} حنفیہ اور شافعیہ اس کھیل کو حنفیہ میں شمار نہیں کرتے۔ احرام میں حاجی، اور مالکی نقصان کو دور کرنے کے لیے نقصان دہ کو قتل کرنے کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7097}"
