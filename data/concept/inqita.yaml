label: { ar: "الانقطاع", en: "Inqita (cessation, and the broken chain of a narration; the ending of blood, of an imam's prayer, and of a series)" }
summary:
  ar: "الانقطاع لغة التوقف والتفرق، ويستعمله الفقهاء بهذه المعاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} وعند المحدثين عدم اتصال سند الحديث، سواء سقط ذكر الراوي من أوله أو وسطه أو آخره، ويشمل المرسل والمعلق والمعضل والمدلس، وغالب استعماله في رواية من دون التابعي عن الصحابي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} ويختلف حكم الانقطاع بحسب ما يضاف إليه، فإذا انقطع دم الحيض أو النفاس حرم الوطء حتى الاغتسال أو التيمم عند الجمهور، وعند أبي حنيفة يحل في الحال إذا انقطع لأكثر الحيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} وينقطع الاقتداء إذا نوى المأموم مفارقة إمامه، وفي صحة صلاته خلاف وتفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546}"
  en: "Inqita' is lexically stopping and parting, and the jurists use it in these senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} For the hadith scholars it is the lack of connection in a chain of narration, whether a narrator falls out at the start, middle or end, which includes the mursal, mu'allaq, mu'dal and mudallas reports; it is mostly used of a report from a Companion by one who is not a Successor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Its ruling depends on what it is said of: when the blood of menstruation or of the postnatal period stops, intercourse is forbidden until washing or dry ablution for the majority, while Abu Hanifa allows it at once if the blood stops at the longest period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Following an imam ends when the follower intends to part from him, and the validity of that prayer is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546}"
