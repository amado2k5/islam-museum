id: concept/inqita
class: concept
kind: term
label: { ar: "الانقطاع", en: "Inqita (cessation, and the broken chain of a narration; the ending of blood, of an imam's prayer, and of a series)", es: "Inqita (cesación y ruptura de la cadena de una narración; el fin de la sangre, de la oración de un imán y de una serie)", fr: "Inqita (cessation, et rupture de la chaîne d'une narration; la fin du sang, de la prière d'un imam et d'une série)", ur: "انقطاع ⁦(منقطع، اور روایت کا ٹوٹا ہوا سلسلہ؛ خون کا خاتمہ، امام کی نماز، اور سلسلہ کا)⁩", tr: "Kesinti", id: "Gangguan" }
summary:
  ar: "الانقطاع لغة التوقف والتفرق، ويستعمله الفقهاء بهذه المعاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} وعند المحدثين عدم اتصال سند الحديث، سواء سقط ذكر الراوي من أوله أو وسطه أو آخره، ويشمل المرسل والمعلق والمعضل والمدلس، وغالب استعماله في رواية من دون التابعي عن الصحابي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} ويختلف حكم الانقطاع بحسب ما يضاف إليه، فإذا انقطع دم الحيض أو النفاس حرم الوطء حتى الاغتسال أو التيمم عند الجمهور، وعند أبي حنيفة يحل في الحال إذا انقطع لأكثر الحيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} وينقطع الاقتداء إذا نوى المأموم مفارقة إمامه، وفي صحة صلاته خلاف وتفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546}"
  en: "Inqita' is lexically stopping and parting, and the jurists use it in these senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} For the hadith scholars it is the lack of connection in a chain of narration, whether a narrator falls out at the start, middle or end, which includes the mursal, mu'allaq, mu'dal and mudallas reports; it is mostly used of a report from a Companion by one who is not a Successor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Its ruling depends on what it is said of: when the blood of menstruation or of the postnatal period stops, intercourse is forbidden until washing or dry ablution for the majority, while Abu Hanifa allows it at once if the blood stops at the longest period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Following an imam ends when the follower intends to part from him, and the validity of that prayer is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546}"
  es: "Inqita' es léxicamente parada y separación, y los juristas lo usan en estos sentidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Para los eruditos del hadiz es la falta de conexión en una cadena de narración, ya sea que un narrador se pierda al principio, en el medio o al final, lo que incluye los informes mursal, mu'allaq, mu'dal y mudallas; se usa principalmente para un informe de un Compañero por alguien que no es un Sucesor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Su dictamen depende de lo que se diga: cuando cesa la menstruación o el período posparto, se prohíbe el coito hasta el lavado o la ablución seca para la mayoría, mientras que Abu Hanifa lo permite de inmediato si la sangre cesa en el período más prolongado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Seguir a un imán termina cuando el seguidor tiene la intención de separarse de él, y la validez de esa oración es cuestionada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546}"
  fr: "Le terme « inqita » signifie littéralement « interruption » et « rupture », et les juristes l'emploient dans ce sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Pour les spécialistes du hadith, il désigne l'absence de connexion dans une chaîne de transmission, qu'un narrateur interrompe la transmission au début, au milieu ou à la fin. Ceci inclut les hadiths mursal, mu'allaq, mu'dal et mudallas; le terme est principalement utilisé pour un hadith rapporté par un Compagnon qui n'est pas un Successeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Son application dépend du contexte: lorsque les menstruations ou les règles cessent, les rapports sexuels sont interdits jusqu'à la purification (ablutions) pour la majorité des juristes, tandis qu'Abu Hanifa les autorise immédiatement si les règles ont cessé après la période la plus longue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546} Suivre un imam prend fin lorsque le fidèle a l'intention de s'en séparer, et la validité de cette prière est contestée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3546}"
  ur: "انقطاع لغوی طور پر رک جانا اور جدا ہونا ہے اور فقہاء اسے ان معنوں میں استعمال کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3545}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3546} محدثین کے نزدیک روایت کے سلسلہ میں ربط کا فقدان ہے، خواہ راوی شروع ہو جائے، درمیانی ہو یا آخر میں مؤلل، مصلح وغیرہ شامل ہوں۔ رپورٹس یہ زیادہ تر کسی صحابی کی رپورٹ کے لیے استعمال ہوتا ہے جو جانشین نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور ص3546} اس کا حکم اس بات پر منحصر ہے کہ اس کے بارے میں کیا کہا گیا ہے: جب حیض یا نفلی عدت کا خون بند ہو جائے تو جماع کرنا جمہور کے لیے دھونے یا خشک ہونے تک حرام ہے، جب کہ ابو حنیفہ نے اس کی اجازت دی ہے جب کہ خون بہت زیادہ رک جائے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3546} امام کی تقلید اس وقت ختم ہوجاتی ہے جب مقتدی اس سے الگ ہونے کا ارادہ کرتا ہے اور اس نماز کے صحیح ہونے میں اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3546}"
  tr: "Duraklama dili duraklama ve ayrılıktır ve hukukçular bunu bu anlamlarda kullanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3546} hadis âlimlerine göre, aktarım zinciri bağlantılı değildir; anlatıcının adı baştan, ortadan veya sondan atlanır. Mursal, mu'allaq, mu'allaq, mu'dallal ve mudallaları içerir. Kullanımı çoğunlukla rivayetlerde, arkadaşın takipçisi olmadan yapılır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3546} Bırakma kararı, eklenenlere bağlı olarak değişir. Adet kanaması veya doğum sonrası kanama durursa, çoğunluk tarafından ghusl veya tayammum yapılana kadar cinsel ilişki yasaktır ve Abu Hanifa'ya göre, regl çoğunlukta durmuşsa hemen izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3546} Takipçi imamını terk etmeyi düşünürse taklit sona erer ve namazının geçerliliği konusunda anlaşmazlık ve detay varsa. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3546}"
  id: "Bahasa penghentian adalah jeda dan pemisahan, dan para ahli hukum menggunakannya dalam arti ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3546} Menurut para ulama hadits, rantai transmisi tidak saling terkait, baik penyebutan narator dihilangkan dari awal, tengah, atau akhir. Rangkaian ini mencakup mursal, mu'allaq, mu'allaq, mu'dallal, dan mudalla. Penggunaannya sebagian besar dalam riwayat tanpa pengikut dari pendamping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3546} Aturan tentang penghentian bervariasi tergantung pada apa yang ditambahkan. Jika pendarahan menstruasi atau perdarahan pasca melahirkan berhenti, hubungan seksual dilarang sampai ghusl atau tayammum dilakukan oleh mayoritas, dan menurut Abu Hanifa, hal ini diperbolehkan segera jika menstruasi telah berhenti selama sebagian besar waktu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3546} Peniruan berhenti jika pengikutnya berniat meninggalkan imamnya, dan terdapat perbedaan serta rincian mengenai keabsahan doanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3546}"
