id: concept/al-nafs-al-barid-wa-al-muntin
class: concept
kind: scientific
label:
  ar: "النفس البارد والمنتن"
  en: "The cold breath and the fetid"
  fr: "La respiration froide et la fétide"
  ur: "ٹھنڈی اور بدبودار سانس"
summary:
  ar: "النفس البارد يدل على موت القوة وطفء الحرارة الغريزية واستحالة مزاج القلب معه نداوة فتتم دلالته على انحلال الغريزية، والنفس المنتن داخل في البخر ويفارق سائر أصناف البخر بأن تلك الأصناف قد تروح النتن في غير حال التنفس وهذا إنما ينتن عندما يخرج النفس وهذا يدل على أخلاط عفنة في أعضاء التنفس إما القصبة وإما الرئة إذا عفن فيها خلط {cite:canon-ibn-sina-print-v2 p.311}"
  en: "The cold breath points to the power's death, the inborn heat's quenching, and the heart's temperament changing, moistness attending it — completing its testimony to the inborn heat's dissolution. The fetid breath falls under bad breath; it parts from the other kinds of bad breath in that those may turn fetid outside the state of breathing, while this one is fetid only when the breath goes out — and it points to rotten humours in the breathing organs, either the windpipe or the lung, when a humour has rotted in it {cite:canon-ibn-sina-print-v2 p.311}"
  fr: "La respiration froide indique la mort de la force, l'extinction de la chaleur innée et le changement du tempérament du cœur, l'humidité l'accompagnant, ce qui achève son témoignage de la dissolution de la chaleur innée. La respiration fétide relève de la mauvaise haleine ; elle se distingue des autres genres de mauvaise haleine en ce que ceux-ci peuvent devenir fétides hors de l'état de respiration, tandis que celle-ci n'est fétide que lorsque le souffle sort ; et elle indique des humeurs putréfiées dans les organes de la respiration, la trachée ou le poumon, lorsqu'une humeur s'y est putréfiée {cite:canon-ibn-sina-print-v2 p.311}"
  ur: "ٹھنڈی سانس قوت کی موت فطری حرارت کے بجھنے اور دل کے مزاج کے بدلنے پر دلالت کرتی ہے جس کے ساتھ نمی ہوتی ہے — اس طرح اس کی گواہی فطری حرارت کے انحلال پر مکمل ہوتی ہے؛ بدبودار سانس بدبو والی سانسوں میں داخل ہے اور باقی اقسام سے اس میں فرق کرتی ہے کہ وہ تنفس کے بغیر بھی بدبودار ہو سکتی ہیں مگر یہ صرف نفس نکلنے پر بدبو دیتی ہے — اور یہ تنفس کے اعضاء میں باسی اخلاط پر دلالت کرتی ہے یا قصبہ میں یا پھیپھڑے میں جب اس میں کوئی خلط باسی ہو گیا ہو {cite:canon-ibn-sina-print-v2 p.311}"
