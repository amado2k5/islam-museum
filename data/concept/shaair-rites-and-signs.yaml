label:
  ar: "الشَّعائر"
  en: "Sha'a'ir (the outward rites and signs of Islam)"
summary:
  ar: "الشعائر جمع شعيرة، أي العلامة، وإذا أضيفت إلى الله فهي أعلام دينه وطاعته، وتشمل الصلاة والصوم والزكاة والحج ومناسكه، والأذان والجماعة والجمعة والعيدين والجهاد. ويجب على المسلمين إقامة شعائر الإسلام الظاهرة وإظهارها، ويقاتل أهل بلد يتفقون على تركها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10069} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071}"
  en: "Sha'a'ir is the plural of sha'ira, a sign or mark. When attributed to God the word means the signs of His religion and obedience. It covers prayer, fasting, zakat, the pilgrimage and its rites, and in other matters the call to prayer, congregational prayer, the Friday and festival prayers, and jihad. Muslims must establish and display the outward rites of Islam, and a community that agrees to abandon one of them may be fought. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10069} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071}"
