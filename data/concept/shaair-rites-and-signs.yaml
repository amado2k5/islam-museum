id: concept/shaair-rites-and-signs
class: concept
kind: legal
label:
  ar: "الشَّعائر"
  en: "Sha'a'ir (the outward rites and signs of Islam)"
  es: "Sha'a'ir (los ritos y signos externos del Islam)"
  fr: "Sha'a'ir (les rites et signes extérieurs de l'Islam)"
  ur: "شعائر ⁦(اسلام کے ظاہری عبادات اور علامات)⁩"
  tr: "ritüeller"
  id: "ritual"
summary:
  ar: "الشعائر جمع شعيرة، أي العلامة، وإذا أضيفت إلى الله فهي أعلام دينه وطاعته، وتشمل الصلاة والصوم والزكاة والحج ومناسكه، والأذان والجماعة والجمعة والعيدين والجهاد. ويجب على المسلمين إقامة شعائر الإسلام الظاهرة وإظهارها، ويقاتل أهل بلد يتفقون على تركها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10069} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071}"
  en: "Sha'a'ir is the plural of sha'ira, a sign or mark. When attributed to God the word means the signs of His religion and obedience. It covers prayer, fasting, zakat, the pilgrimage and its rites, and in other matters the call to prayer, congregational prayer, the Friday and festival prayers, and jihad. Muslims must establish and display the outward rites of Islam, and a community that agrees to abandon one of them may be fought. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10069} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071}"
  es: "Sha'a'ir es el plural de sha'ira, que significa signo o marca. Cuando se atribuye a Dios, la palabra significa los signos de Su religión y obediencia. Abarca la oración, el ayuno, el zakat, la peregrinación y sus ritos, y en otros asuntos, la llamada a la oración, la oración en congregación, las oraciones del viernes y de las festividades, y la yihad. Los musulmanes deben establecer y exhibir los ritos externos del Islam, y una comunidad que acepte abandonar alguno de ellos puede ser combatida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10069} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071}"
  fr: "Sha'a'ir est le pluriel de sha'ira, qui signifie signe ou marque. Attribué à Dieu, ce terme désigne les signes de Sa religion et de l'obéissance. Il englobe la prière, le jeûne, la zakat, le pèlerinage et ses rites, ainsi que l'appel à la prière, la prière en congrégation, les prières du vendredi et des fêtes, et le jihad. Les musulmans doivent observer et manifester les rites extérieurs de l'islam, et une communauté qui accepte d'en abandonner un seul peut être combattue."
  ur: "شعائر شعرا کی جمع ہے، نشان یا نشان۔ جب خدا کی طرف منسوب کیا جائے تو اس لفظ کا مطلب اس کے دین اور اطاعت کی نشانیاں ہیں۔ اس میں نماز، روزہ، زکوٰۃ، حج اور اس کے عبادات اور دیگر امور میں اذان، باجماعت نماز، جمعہ اور تہوار کی نماز اور جہاد شامل ہیں۔ مسلمانوں کو اسلام کی ظاہری رسومات کو قائم کرنا اور ظاہر کرنا چاہیے، اور جو کمیونٹی ان میں سے کسی ایک کو ترک کرنے پر راضی ہو اس سے جنگ کی جا سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10069} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10070}"
  tr: "Ritüeller, işaret anlamına gelen 'şa'ira'nın çoğuludur ve Allah'a atfedildiğinde, O'nun dininin ve itaatinin bayraklarıdır; namaz, oruç, zekat, Hac ve ribadetleri, ezan çağrısı, cemaat namazları, cuma namazları, iki bayram ve cihat gibi unsurları içerir. Müslümanlar İslam'ın görünürdeki ayinlerini uygulamalı ve sergilemelidir; bu ayinleri terk etmeyi kabul eden bir ülkenin halkı ise savaşmalıdır. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.10069} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.10070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10071}"
  id: "Ritual adalah bentuk jamak dari 'sha'ira,' yang berarti tanda, dan ketika dikaitkan dengan Allah, ritual tersebut adalah bendera agama dan ketaatan-Nya, termasuk shalat, puasa, zakat, Haji dan ritualnya, panggilan shalat, shalat berjamaah, shalat Jumat, dua Idul Fitri, dan jihad. Muslim harus menjalankan dan memamerkan upacara Islam yang jelas, dan masyarakat negara yang setuju untuk meninggalkannya harus berjuang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10069} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.10070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10071}"
