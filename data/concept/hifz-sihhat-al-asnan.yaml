id: concept/hifz-sihhat-al-asnan
class: concept
kind: scientific
label:
  ar: حفظ صحة الأسنان
  en: Keeping the health of the teeth
  ur: دانتوں کی صحت کی حفاظت
summary:
  ar: 'من أحب أن تسلم أسنانه راعى ثمانية أشياء: التحرز عن تواتر فساد الطعام والشراب في المعدة لقابليته الفساد سريعاً أو لسوء تدبير تناوله، وأن لا يلح على القيء وخصوصاً إذا كان المتقيأ حامضاً، واجتناب مضغ كل علك وخصوصاً الحلو، واجتناب كسر الصلب، واجتناب المضرسات، واجتناب كل شديد البرد على الحار وكل شديد الحر على البارد، وإدامة تنقية ما يتخلل الأسنان من غير استقصاء يضر بالعمور وباللحم الذي بين الأسنان، واجتناب ما يضر الأسنان بخاصيته كالكراث فإنه شديد الضرر بالأسنان واللثة، والسواك بالاعتدال من غير استقصاء يذهب ظلم الأسنان وماءها ويهيئها لقبول النوازل {cite:canon-ibn-sina-print-v2 p.266-268}'
  en: 'Whoever wants his teeth safe observes eight things: guarding against recurrent corruption of food and drink in the stomach — food quick to spoil or taken with bad regimen; not persisting in vomiting, especially when the vomit is sour; avoiding chewing every gum, especially the sweet kinds; avoiding breaking the hard; avoiding the grit-makers; avoiding every very cold thing after heat and every very hot after cold; keeping on clearing what lodges between the teeth without excess that harms the gums and the flesh between them; and avoiding what harms the teeth by its specific property, like the leek, very harmful to teeth and gum. The tooth-stick is used with moderation, not exhaustively enough to strip the teeth''s dark lustre and moisture and lay them open to descending matter {cite:canon-ibn-sina-print-v2 p.266-268}'
  ur: 'جو چاہے کہ اس کے دانت سلامت رہیں وہ آٹھ باتوں کا لحاظ رکھے: معدے میں کھانے پینے کے بار بار بگڑنے سے بچے جو جلد بگڑنے والا ہو یا لینے کا تدبیر برا ہو؛ قے پر اصرار نہ کرے خصوصاً جب قے کھٹی ہو؛ ہر علک چبانے سے بچے خصوصاً میٹھی؛ سخت چیز توڑنے سے بچے؛ مضرس کرنے والی چیزوں سے بچے؛ بہت سرد چیز گرم کے اوپر اور بہت گرم سرد کے اوپر نہ لے؛ دانتوں میں پھسی چیز مسلسل صاف رکھے مگر اس حد تک نہ کہ مسوڑھوں اور ان کے درمیان کے گوشت کو نقصان ہو؛ اور جو چیز خاصیت سے دانتوں کو ضرر دے اس سے بچے جیسے گندانا جو دانتوں اور مسوڑھے کو بہت ضرر دیتا ہے؛ اور مسواک اعتدال سے کرے نہ اس حد تک کہ دانتوں کی سیاہ چمک اور نم ختم ہو اور وہ اتردی مواد کے لیے کھل جائیں {cite:canon-ibn-sina-print-v2 p.266-268}'
