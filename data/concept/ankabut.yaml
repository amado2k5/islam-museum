summary:
  ar: "العنكبوت في الكتاب حيوان ينفع نسجه في قطع نزف الدم من الجراح ومنع ورمها، ويطبخ الغليظ النسج منه بدهن الورد لوجع الأذن، وينقل الكتاب عن قوم استعمال نسجه في الحمى، وينسب قول إلى ديسقوريدوس في حمى الربع {cite:canon-ibn-sina-print-v1 p.617}"
  en: "Ankabut is in the book the spider, whose web stops the flow of blood from wounds and keeps them from swelling; the thick-webbed white kind is cooked in rose oil for earache, and the book reports the use of the web against fevers, with a statement attributed to Dioscorides on the quartan fever {cite:canon-ibn-sina-print-v1 p.617}"
  ur: "عنکبوت کتاب میں مکڑی ہے جس کا جالا زخموں سے خون کا بہنا روکتا اور انہیں ورم سے بچاتا ہے، گھنے جالے والی سفید قسم کو روغنِ گل میں پکا کر کان کے درد میں استعمال کیا جاتا ہے، اور کتاب بخاروں میں جالے کے استعمال کو نقل کرتی ہے اور چوتھائی بخار کے بارے میں دیسقوریدوس سے منسوب قول بتاتی ہے {cite:canon-ibn-sina-print-v1 p.617}۔"
