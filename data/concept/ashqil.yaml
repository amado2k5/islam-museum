label:
  ar: "الأشقيل"
  en: "Ashqil (the mouse onion)"
  fr: "Ashqil (l’oignon des souris)"
  ur: "اشقیل ⁦(چوہا پیاز)⁩"
  es: "Ashqil (la cebolla ratón)"
  tr: "El-Eşqil"
  id: "Al-Ashqil"
summary:
  ar: "الأشقيل في الكتاب بصل الفار، سُمّي بذلك لأنه يقتل الفار، حريف قويّ، وقال قوم هو العنصل؛ حارّ في الثالثة يابس في حدود الثانية، محلّل جذّاب للدم محرق مقرّح مقطّع للكيموسات الغليظة؛ ينفع من الثآليل وداء الثعلب وأوجاع المفاصل والفالج وعرق النسا والصرع والربو والسعال العتيق وصلابة الطحال والاستسقاء واليرقان، ويدرّ البول، ويضرّ قروح الأحشاء مأكولاً؛ ويذكر الكتاب فيه أقوالاً عن الطمث والرحم في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.347-348}"
  en: "In the book ashqil is the mouse onion, so called because it kills mice, strongly pungent, and some said it is the unsul; it is hot in the third degree and dry near the second, resolving, drawing blood, burning, blistering and cutting thick humours; it is listed for warts, alopecia, joint pains, palsy, sciatica, epilepsy, asthma, chronic cough, hardness of the spleen, dropsy and jaundice, it promotes urine, and eaten it harms ulcers of the viscera; the book also gives statements on the menses and the womb in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.347-348}"
  fr: "Dans le livre, ashqil est l’oignon des souris, ainsi nommé parce qu’il les tue, fortement âcre, que certains identifient à l’unsul ; chaud au troisième degré et sec près du deuxième, il résout, attire le sang, brûle, vésique et coupe les humeurs épaisses ; il est cité pour les verrues, l’alopécie, les douleurs articulaires, la paralysie, la sciatique, l’épilepsie, l’asthme, la toux chronique, l’induration de la rate, l’hydropisie et la jaunisse ; il favorise l’urine et, mangé, nuit aux ulcères des viscères ; le livre donne aussi des affirmations sur les règles et la matrice dans une section signalée en attente de la décision du fondateur {cite:canon-ibn-sina-print-v1 pp.347-348}"
  ur: "اشقیل کتاب میں چوہا پیاز ہے، اس لیے کہ یہ چوہوں کو مارتا ہے، سخت تیز، اور بعض نے کہا کہ یہ عنصل ہے؛ تیسرے درجے میں گرم اور دوسرے کی حد تک خشک ہے، تحلیل کرنے والا، خون کو کھینچنے والا، جلانے والا، آبلے ڈالنے والا اور گاڑھے کیموسوں کو کاٹنے والا؛ مسوں، داء الثعلب، جوڑوں کے درد، فالج، عرق النسا، مرگی، دمہ، پرانی کھانسی، تلی کی سختی، استسقاء اور یرقان میں مذکور ہے، پیشاب جاری کرتا ہے، اور کھایا جائے تو اندرونی زخموں کو نقصان دیتا ہے؛ کتاب حیض اور رحم کے بارے میں اقوال موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.347-348}۔"
  es: "En el libro, ashqil es la cebolla de ratón, llamada así porque mata ratones, es muy picante y algunos decían que es unsul; es caliente en el tercer grado y seca cerca del segundo, disuelve, extrae sangre, quema, ampolla y corta los humores espesos; se menciona para verrugas, alopecia, dolores articulares, parálisis, ciática, epilepsia, asma, tos crónica, dureza del bazo, hidropesía e ictericia, promueve la micción y, consumida, daña las úlceras de las vísceras; el libro también da declaraciones sobre la menstruación y el útero en una sección etiquetada reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 pp.347-348}"
  tr: "Kitapta Ashqil, fareyi öldürdüğü için fare soğanı olarak adlandırılır. Güçlü bir otçuldur ve bazıları bunun 'ansal' olduğunu söyler; üçüncüsü sıcak, ikincisi civarında kuru, çekici bir kan analizörü, yanma, ülser, kaba kemositler için kesim; siğiller, tilki hastalığı, eklem ağrısı, felç, siyatik, epilepsi, astım, yaşlı öksürük, dalak sertliği, asit, sarılık, idrar söktürücüler için faydalıdır ve yemek yiyerek iç ülserlere zarar verir. Kitap, Kurucunun Kuralı Üzerine Askıya Alınmış başlıklı bölümde adet ve rahim hakkında ifadelerden bahseder {cite:canon-ibn-sina-print-v1 s.347-348}"
  id: "Dalam buku ini, Ashqil disebut bawang tikus, dinamai demikian karena membunuh tikus. Ini adalah herbivora yang kuat, dan beberapa orang mengatakan itu adalah 'ansal'; panas pada yang ketiga dan kering sekitar yang kedua, adalah alat analisis darah yang menarik, terbakar, tukak lambung, dipotong untuk kemosit kasar; obat ini bermanfaat untuk kutil, penyakit rubah, nyeri sendi, kelumpuhan, sciatica, epilepsi, asma, batuk tua, kekerasan limpa, ascites, penyakit kuning, diuretik, dan merusak borok dalam dengan makan. Buku ini menyebutkan pernyataan tentang menstruasi dan rahim dalam bagian berjudul Suspended on the Founder's Rule {cite:canon-ibn-sina-print-v1 hlm.347-348}"
