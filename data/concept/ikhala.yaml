id: concept/ikhala
class: concept
kind: legal
label:
  ar: إخالة
  en: Ikhala (suggestiveness of a cause in analogy)
summary:
  ar: الإخالة مناسبة الوصف للحكم بحيث تتعين عليته بمجرد إبدائها، وهي مناط المصلحة في القياس والمصلحة المرسلة؛ والوصف المناسب أعم من المخيل، والوصف الطردي ليس مخيلاً، ومثال المخيل قتل المسلم المتترس به، وفي تعليل الأصل بالوصف المخيل خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1902}.
  en: 'Ikhala: a description is suggestive when its fitness to the ruling is so plain that its causal role is fixed at once; it is the ground of benefit in analogy and of open interest. The appropriate is wider than the suggestive; an accidental description is not suggestive; the killing of a Muslim used as a shield is an example; the explaining of a ruling by a suggestive description is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1902}.'
