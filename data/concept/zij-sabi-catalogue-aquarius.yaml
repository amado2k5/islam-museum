summary:
  ar: "يذكر الجدول الثالث للكواكب الثابتة صورة الدلو بعنوانها، ثم يعدّ كواكبها مرتبة على مصبّ الماء: أوّله، ووسطه، وآخره. مواضع هذه الكواكب في جدول الطول والعرض لم تُنقل. {cite:zij-sabi-nallino-byblion pp.279}"
  en: "The third fixed-star table gives the figure of al-Dalw, the Bucket, under its own heading and lists its stars in order along the outflow of water: the first, the middle and the last. Their positions in the longitude and latitude table are not transcribed here. {cite:zij-sabi-nallino-byblion pp.279}"
  ur: "تیسرے ثابت ستاروں کے جدول میں دلو کی صورت اپنے عنوان کے تحت ہے، اور اس کے ستارے پانی کے بہاؤ کے ساتھ ترتیب سے درج ہیں: پہلا، درمیانی اور آخری۔ طول و عرض کے جدول میں ان کے مواضع یہاں نقل نہیں ہوئے۔ {cite:zij-sabi-nallino-byblion pp.279}"
  es: "La tercera tabla de estrellas fijas presenta la figura de al-Dalw, el Cubo, bajo su propio encabezado y enumera sus estrellas en orden según el flujo de agua: la primera, la del medio y la última. Sus posiciones en la tabla de longitud y latitud no se transcriben aquí. {cite:zij-sabi-nallino-byblion pp.279}"
