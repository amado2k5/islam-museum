label:
  ar: "العَضْل"
  en: "Obstructing a marriage (adl): the guardian and the husband"
  ur: "عضل (نکاح میں رکاوٹ)"
summary:
  ar: "العضل في اللغة المنع، ويقال عضل الرجل حرمته التزويج، واستعمله الفقهاء في النكاح بمعنى منع التزويج، وفي الخلع بمعنى الإضرار بالزوجة لتفتدي نفسها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11650}. والأصل أن عضل الولي من تزويج موليته من كفئها حرام، وأن عضل الزوج زوجته بالإضرار بها لتفتدي حرام، وقد يباح عضل الولي لمصلحة المرأة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11651}. ويكون الولي عاضلاً إذا دعت المرأة إلى الزواج من كفء أو خطبها كفء فامتنع دون سبب مقبول، سواء طلبت مهر مثلها أو دونه عند الشافعية والحنابلة، والحنفية لا يعدون الامتناع عن مهر المثل عضلاً، وذهب المالكية إلى أن الأب المجبر لا يعد عاضلاً بردّ الخطاب لشفقته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11651}. وإذا ثبت العضل عند الحاكم أمره بالتزويج، فإن امتنع انتقلت الولاية، فذهب الحنفية والشافعية والمالكية وأحمد في رواية إلى انتقالها إلى السلطان، وذهب الحنابلة إلى انتقالها إلى الولي الأبعد، وإن عضل الجميع زوج الحاكم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11652}."
  en: "In the lexicon, adl means to prevent, and the jurists use it of a guardian who prevents his ward's marriage, and in the case of divorce for ransom of a husband who harms his wife so that she will pay him back {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11650}. In principle it is forbidden for a guardian to prevent a ward's marriage to a suitable husband, and for a husband to harm his wife to force her to ransom herself; a guardian may be permitted to refuse for the woman's own benefit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11651}. A guardian is an obstructer when a woman asks for a suitable husband, or a suitable man proposes, and he refuses without a valid reason, whether or not she asks for her proper dower; the Hanafis do not count refusing a dower below the usual amount as obstruction, and the Malikis do not count a compelling father's rejection of suitors as obstruction unless harm is intended {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11651}. Once obstruction is proven before the judge, he orders the marriage; if the guardian still refuses, guardianship passes to the ruler according to the Hanafis, Shafi'is, most Malikis and one Hanbali narration, or to the next guardian according to the main Hanbali view; if all guardians obstruct, the judge contracts the marriage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11652}."
