id: concept/nafs-al-marad
class: concept
kind: scientific
label:
  ar: "نفس الوجع والضيق وأصحاب المدة والذبحة"
  en: "The breath of pain, of the straitened, of the pus-possessed and of the quinsy"
  ur: "درد تنگی صديد والے اور ذبح کی سانس"
summary:
  ar: "نفس الوجع في أعضاء الصدر إلى الصغر والقصر وربما تضاعف وربما عسر وقد يبطؤ إذا لم يكن تلهب وتواتر ويكون صغره وقصره أكثر من بطئه لأن داعيه إلى الاحتباس وقلة الانبساط أكثر من داعيه إلى الرفق والتأدي بعظم الانبساط أشد من التأدي بالسرعة فإن التهب القلب وسخن لم يكن بد من سرعة وإن تؤدى بها، ونفس من ضاق نفسه لأي سبب كان ونفس صاحب الربو يحتاج أن يتلافى ما يكون بالضيق تلافياً من جهة السرعة والتواتر فيكون نفسه صغيراً ضيقاً متواتراً، ونفس أصحاب المدة قد يتكلفون بسط الصدر كله مع حرارة ونفخة ولا يكون هناك عظم ولا موجبات القوة لأن صاحب هذه العلة يكون قد أمعن في الضعف والقوة في أصحاب ذات الرئة والربو باقية، ونفس أصحاب الذبحة والاختناق يكون مع بسط عظيم ومع سرعة وتواتر للحاجة وغور المادة ولا يكون لهم نفخة {cite:canon-ibn-sina-print-v2 p.315}"
  en: "The breath of pain in the chest's organs tends to smallness and shortness, sometimes doubling, sometimes hardening, and it may slow if there is no flaming and frequency — its smallness and shortness being more than its slowness, for its urging to holding-in and little expanding is more than its urging to gentleness, and suffering a great expansion is harsher than suffering swiftness; but if the heart flames and heats, swiftness is a must however borne. The breath of the one whose breath is straitened for any cause, and the asthmatic's breath, needs to make up what narrowness costs by way of swiftness and frequency, so his breath is small, narrow and frequent. The pus-possessed may labour to expand the whole chest with heat and puffing, yet without greatness and without the power's requisites, for the man of this illness has gone far in weakness, while the power in the pneumonic and the asthmatic stays. The breath of the quinsied and the strangled comes with a great expansion, and with swiftness and frequency for the need and the matter's deepness — and they have no puff {cite:canon-ibn-sina-print-v2 p.315}"
  ur: "سینے کے اعضاء میں درد کی سانس چھوٹائی اور کٹائی کی طرف ہوتی ہے کبھی دہری کبھی دشوار اور اگر بھڑکاؤ اور تواتر نہ ہو تو سست بھی ہو سکتی ہے اور اس کی چھوٹائی اور کٹائی اس کی سستی سے زیادہ ہوتی ہے کیونکہ اس کی تحریک روکے رکھنے اور کم پھیلنے کی طرف سہولت سے زیادہ ہوتی ہے اور بڑے پھیلاؤ کا اٹھانا تیزی اٹھانے سے سخت تر ہے مگر اگر دل بھڑکے اور گرماۓ تو تیزی لازم ہے؛ اور جس کی سانس کسی بھی سبب سے تنگ ہو اس کی اور ربو والے کی سانس کو تنگی کا نقصان تیزی اور تواتر سے پورا کرنا ہوتا ہے اس لیے اس کی سانس چھوٹی تنگ اور متواتر ہوتی ہے؛ صديد والے سارے سینے کو پھیلانے کی زحمت گرمی اور پھونک کے ساتھ کر سکتے ہیں مگر بڑائی اور قوت کی لوازم کے بغیر کیونکہ اس علت کا صاحب کمزوری میں انتہا کو ہوتا ہے جب کہ ذات الرئة اور ربو والوں میں قوت باقی رہتی ہے؛ اور ذبح اور گھٹن والوں کی سانس بڑے پھیلاؤ کے ساتھ اور ضرورت اور مادہ کی گہرائی کے لیے تیزی اور تواتر کے ساتھ ہوتی ہے اور ان میں پھونک نہیں ہوتی {cite:canon-ibn-sina-print-v2 p.315}"
