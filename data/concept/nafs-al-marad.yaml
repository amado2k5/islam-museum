label:
  ar: "نفس الوجع والضيق وأصحاب المدة والذبحة"
  en: "The breath of pain, of the straitened, of the pus-possessed and of the quinsy"
  ur: "درد تنگی صديد والے اور ذبح کی سانس"
  es: "El aliento del dolor, de los oprimidos, de los infectados con pus y de los amigdalinos"
  fr: "Le souffle de la douleur, des opprimés, des possédés par le pus et des angines"
  tr: "Aynı acı ve sıkıntı ve sürenin sahipleri ile anjina"
  id: "Rasa sakit dan tekanan yang sama serta pemilik durasi dan angina"
summary:
  ar: "نفس الوجع في أعضاء الصدر إلى الصغر والقصر وربما تضاعف وربما عسر وقد يبطؤ إذا لم يكن تلهب وتواتر ويكون صغره وقصره أكثر من بطئه لأن داعيه إلى الاحتباس وقلة الانبساط أكثر من داعيه إلى الرفق والتأدي بعظم الانبساط أشد من التأدي بالسرعة فإن التهب القلب وسخن لم يكن بد من سرعة وإن تؤدى بها، ونفس من ضاق نفسه لأي سبب كان ونفس صاحب الربو يحتاج أن يتلافى ما يكون بالضيق تلافياً من جهة السرعة والتواتر فيكون نفسه صغيراً ضيقاً متواتراً، ونفس أصحاب المدة قد يتكلفون بسط الصدر كله مع حرارة ونفخة ولا يكون هناك عظم ولا موجبات القوة لأن صاحب هذه العلة يكون قد أمعن في الضعف والقوة في أصحاب ذات الرئة والربو باقية، ونفس أصحاب الذبحة والاختناق يكون مع بسط عظيم ومع سرعة وتواتر للحاجة وغور المادة ولا يكون لهم نفخة {cite:canon-ibn-sina-print-v2 p.315}"
  en: "The breath of pain in the chest's organs tends to smallness and shortness, sometimes doubling, sometimes hardening, and it may slow if there is no flaming and frequency — its smallness and shortness being more than its slowness, for its urging to holding-in and little expanding is more than its urging to gentleness, and suffering a great expansion is harsher than suffering swiftness; but if the heart flames and heats, swiftness is a must however borne. The breath of the one whose breath is straitened for any cause, and the asthmatic's breath, needs to make up what narrowness costs by way of swiftness and frequency, so his breath is small, narrow and frequent. The pus-possessed may labour to expand the whole chest with heat and puffing, yet without greatness and without the power's requisites, for the man of this illness has gone far in weakness, while the power in the pneumonic and the asthmatic stays. The breath of the quinsied and the strangled comes with a great expansion, and with swiftness and frequency for the need and the matter's deepness — and they have no puff {cite:canon-ibn-sina-print-v2 p.315}"
  ur: "سینے کے اعضاء میں درد کی سانس چھوٹائی اور کٹائی کی طرف ہوتی ہے کبھی دہری کبھی دشوار اور اگر بھڑکاؤ اور تواتر نہ ہو تو سست بھی ہو سکتی ہے اور اس کی چھوٹائی اور کٹائی اس کی سستی سے زیادہ ہوتی ہے کیونکہ اس کی تحریک روکے رکھنے اور کم پھیلنے کی طرف سہولت سے زیادہ ہوتی ہے اور بڑے پھیلاؤ کا اٹھانا تیزی اٹھانے سے سخت تر ہے مگر اگر دل بھڑکے اور گرماۓ تو تیزی لازم ہے؛ اور جس کی سانس کسی بھی سبب سے تنگ ہو اس کی اور ربو والے کی سانس کو تنگی کا نقصان تیزی اور تواتر سے پورا کرنا ہوتا ہے اس لیے اس کی سانس چھوٹی تنگ اور متواتر ہوتی ہے؛ صديد والے سارے سینے کو پھیلانے کی زحمت گرمی اور پھونک کے ساتھ کر سکتے ہیں مگر بڑائی اور قوت کی لوازم کے بغیر کیونکہ اس علت کا صاحب کمزوری میں انتہا کو ہوتا ہے جب کہ ذات الرئة اور ربو والوں میں قوت باقی رہتی ہے؛ اور ذبح اور گھٹن والوں کی سانس بڑے پھیلاؤ کے ساتھ اور ضرورت اور مادہ کی گہرائی کے لیے تیزی اور تواتر کے ساتھ ہوتی ہے اور ان میں پھونک نہیں ہوتی {cite:canon-ibn-sina-print-v2 p.315}"
  es: "La respiración dolorosa en los órganos del pecho tiende a ser pequeña y corta, a veces duplicándose, a veces endureciéndose, y puede ralentizarse si no hay ardor ni frecuencia; su pequeña y corta es más importante que su lentitud, pues su impulso a contener y expandirse poco es mayor que su impulso a la suavidad, y sufrir una gran expansión es más duro que sufrir rapidez; pero si el corazón arde y se calienta, la rapidez es imprescindible, por mucho que se soporte. La respiración de quien tiene la respiración estrecha por cualquier causa, y la del asmático, necesita compensar lo que la estrechez le cuesta con rapidez y frecuencia, por lo que su respiración es pequeña, estrecha y frecuente. El que padece pus puede esforzarse por expandir todo el pecho con calor y soplos, pero sin grandeza y sin la fuerza necesaria, pues el hombre con esta enfermedad ha llegado muy debilitado, mientras que la fuerza en el neumónico y el asmático permanece. El aliento de los afligidos y los estrangulados llega con gran expansión, y con rapidez y frecuencia para la necesidad y la profundidad del asunto, y no tienen soplo {cite:canon-ibn-sina-print-v2 p.315}"
  fr: "La respiration douloureuse dans les organes thoraciques tend à être faible et courte, parfois doublante, parfois s'engourdissant, et elle peut ralentir en l'absence de chaleur et de fréquence – sa faiblesse et sa courte durée étant plus importantes que sa lenteur, car la tendance à retenir et à peu d'expansion est plus forte que la tendance à la douceur, et subir une grande expansion est plus pénible que de subir une respiration rapide; mais si le cœur est en feu et brûlant, la rapidité est impérative, quelle que soit la difficulté. La respiration de celui dont le souffle est comprimé pour une raison quelconque, et celle de l'asthmatique, doivent compenser ce que coûte l'étroitesse par la rapidité et la fréquence, c'est pourquoi leur respiration est faible, courte et fréquente. Le malade du pus peut s'efforcer de dilater toute sa poitrine avec chaleur et halètement, mais sans ampleur et sans la force nécessaire, car l'homme atteint de cette maladie est très affaibli, tandis que la force demeure chez le pneumonique et l'asthmatique. Le souffle de celui qui est atteint d'une angine et de celui qui est étranglé s'élève avec une grande ampleur, et avec une rapidité et une fréquence à la mesure du besoin et de la profondeur de la souffrance — et ils n'ont pas de souffle {cite:canon-ibn-sina-print-v2 p.315}"
  tr: "Göğüs organlarındaki aynı küçülme ve kısalık ağrısı çoğalabilir veya bazen zorlaşabilir, iltihaplanmazsa ve sık olmazsa yavaşlayabilir. Küçüklüğü ve kısalığı yavaşlığından daha büyüktür, çünkü sıkışma ve gevşememe sebebi sadece naziklik çağrısından daha fazladır. Genişleme kemiğine neden olmak, hızlı hareket etmekten daha şiddetlidir, çünkü kalp iltihabı ve ısı mutlaka hız gerektirmez, hatta yapılsa bile. Herhangi bir nedenle dar olan birinin ruhu, astımlı birinin ruhu ise hızdan kaçınmak için sıkı olandan kaçınmalıdır. Ve mutawatir, yani ruh küçük, dar ve tekrarlayıcıdır. Süreli olanlarla aynı şekilde, tüm göğsün ısı ve şişlikle gerilmesini gerektirebilir, kemik veya güç gereksinimi yoktur, çünkü bu durumda kişi zayıflamıştır ve zatürre ile astımı olanlarda güç devam eder. Anjina ve boğulma hastalarının aynı nefesi, ihtiyaç ve madde daldırma nedeniyle büyük esneme, hız ve sıklıkla alınır ve nefes alamazlar {cite:canon-ibn-sina-print-v2 s.315}"
  id: "Nyeri yang sama di organ dada hingga kecil dan pendek bisa berlipat ganda atau kadang menjadi sulit, dan bisa melambat jika tidak meradang dan sering terjadi. Kecil dan pendeknya lebih besar daripada kelambatannya, karena penyebab keterbatasan dan kurangnya relaksasi lebih dari sekadar panggilan untuk kelembutan. Menyebabkan tulang melebar lebih parah daripada melakukan dengan cepat, karena peradangan jantung dan panas tidak selalu membutuhkan kecepatan, bahkan jika dilakukan dengan itu. Jiwa seseorang yang sempit karena alasan apapun, dan jiwa penderita asma perlu menghindari yang sempit agar tidak cepat. Dan mutawatir, jadi jiwa kecil, sempit, dan berulang. Sama seperti mereka yang memiliki durasi ini mungkin membutuhkan seluruh dada untuk meregang karena panas dan bengkak, dan tidak ada kebutuhan tulang atau kekuatan, karena orang dengan kondisi ini memiliki kelemahan yang dalam, dan kekuatan pada penderita pneumonia dan asma tetap ada. Napas yang sama pada penderita angina dan sesak napas adalah dengan peregangan, kecepatan, dan frekuensi yang tinggi karena kebutuhan dan perendaman zat, dan mereka tidak memiliki napas {cite:canon-ibn-sina-print-v2 hlm.315}"
