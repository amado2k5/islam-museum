id: concept/hudna-fiqh
class: concept
kind: legal
label: { ar: "هُدْنَة", en: "Hudna (truce with non-Muslims)", es: "Hudna (tregua con los no musulmanes)", fr: "Hudna (trêve avec les non-musulmans)", ur: "ہدنا ⁦(غیر مسلموں کے ساتھ صلح)⁩" }
summary:
  ar: "الهدنة في اللغة السكون، وهي في الاصطلاح عقد على ترك القتال مدة مع أهل الحرب، يسميه الحنفية صلحاً بمال أو بغير مال إذا رأى الإمام مصلحة، ويسميه الحنابلة عقد الإمام أو نائبه على ترك القتال مع غير المسلمين مدة معلومة بقدر الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} وتفرق عن الأمان، وهو رفع استباحة دم الحربي وماله لمدة، وعن عقد الذمة بأن الهدنة أمان مؤقت وعقد الذمة أمان مؤبد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} وأصل مشروعيتها في الكتاب ⁦(سورة التوبة، وسورة الأنفال: وإن جنحوا للسلم فاجنح لها)⁩ وفي مهادنة النبي قريشاً عام الحديبية عشر سنين، وفي إجماع الأمة على جوازها في الجملة، وقد تجب عند الضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16462}"
  en: "Hudna, in the lexical sense, is calm; as a technical term it is an agreement to refrain from fighting with the enemy for a period. The Hanafis call it a settlement for money or without money when the imam sees benefit; the Hanbalis define it as a contract by the imam or his deputy to cease fighting non-Muslims for a known period matching the need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} It differs from aman, the lifting of the licence to kill a belligerent and take his property for a time, and from the dhimma contract, which is a permanent safe-conduct while hudna is temporary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} Its legitimacy rests on the Qur'an (Surat al-Tawba, and Surat al-Anfal 61), on the Prophet's truce with Quraysh at Hudaybiyya for ten years, and on consensus that it is permitted in general, and may be obligatory in necessity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16462}"
  es: "Hudna, en sentido léxico, es calma; como término técnico es un acuerdo para abstenerse de luchar contra el enemigo durante un período. Los hanafíes lo llaman un acuerdo con o sin dinero cuando el imán ve beneficio; los hanbalíes lo definen como un contrato por el imán o su adjunto para cesar la lucha contra los no musulmanes durante un período determinado que se ajuste a la necesidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} Se diferencia del aman, el levantamiento de la licencia para matar a un beligerante y tomar su propiedad por un tiempo, y del contrato dhimma, que es un salvoconducto permanente mientras que hudna es temporal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} Su legitimidad se basa en el Corán (Sura al-Tawba y Sura al-Anfal 61), en la tregua del Profeta con los Quraysh en Hudaybiyya durante diez años y en el consenso de que está permitido en general y puede ser obligatorio en caso de necesidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16462}"
  fr: "Hudna, au sens littéral, signifie calme; techniquement, il s’agit d’un accord de non-combat avec l’ennemi pendant une période déterminée. Les hanafites le qualifient de règlement, avec ou sans compensation financière, selon ce que l’imam juge opportun; les hanbalites le définissent comme un contrat par lequel l’imam ou son adjoint s’engage à cesser les combats contre les non-musulmans pendant une période déterminée, en fonction des besoins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} Il diffère de l’aman, qui consiste à lever temporairement l’autorisation de tuer un belligérant et de s’emparer de ses biens, et du contrat de dhimma, qui est un sauf-conduit permanent, tandis que la hudna est temporaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} Sa légitimité repose sur le Coran (Sourate At-Tawba et Sourate Anfal 61), sur la trêve conclue par le Prophète avec les Quraysh à Hudaybiyya pour une durée de dix ans, et sur le consensus selon lequel elle est généralement permise et peut devenir obligatoire en cas de nécessité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16462}"
  ur: "ہڈنا، لغوی معنی میں، پرسکون ہے؛ ایک تکنیکی اصطلاح کے طور پر یہ ایک مدت تک دشمن کے ساتھ لڑنے سے باز رہنے کا معاہدہ ہے۔ حنفیہ اسے رقم کے عوض یا بغیر پیسے کے تصفیہ کہتے ہیں جب امام فائدہ دیکھے۔ حنبلی اسے امام یا اس کے نائب کی طرف سے ایک معاہدہ کے طور پر بیان کرتے ہیں جو ضرورت کے مطابق معلوم مدت کے لیے غیر مسلموں سے لڑنا بند کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16460} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16461} یہ امان سے مختلف ہے، جنگجو کو مارنے اور ایک وقت کے لیے اس کی جائیداد لینے کے لائسنس کو اٹھانا، اور اس سے ایک مستقل معاہدہ ہے، جس سے یہ معاہدہ محفوظ ہے۔ عارضی {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 16461} اس کا جواز قرآن ⁦(سورۃ التوبہ، اور سورۃ الانفال 61)⁩ پر ہے، حدیبیہ میں قریش کے ساتھ نبی کی دس سال تک کی صلح پر ہے، اور اس پر اجماع واجب ہے اور عام طور پر اس پر واجب ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16462}"
