id: concept/hudna-fiqh
class: concept
kind: legal
label: { ar: "هُدْنَة", en: "Hudna (truce with non-Muslims)" }
summary:
  ar: "الهدنة في اللغة السكون، وهي في الاصطلاح عقد على ترك القتال مدة مع أهل الحرب، يسميه الحنفية صلحاً بمال أو بغير مال إذا رأى الإمام مصلحة، ويسميه الحنابلة عقد الإمام أو نائبه على ترك القتال مع غير المسلمين مدة معلومة بقدر الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} وتفرق عن الأمان، وهو رفع استباحة دم الحربي وماله لمدة، وعن عقد الذمة بأن الهدنة أمان مؤقت وعقد الذمة أمان مؤبد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} وأصل مشروعيتها في الكتاب (سورة التوبة، وسورة الأنفال: وإن جنحوا للسلم فاجنح لها) وفي مهادنة النبي قريشاً عام الحديبية عشر سنين، وفي إجماع الأمة على جوازها في الجملة، وقد تجب عند الضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16462}"
  en: "Hudna, in the lexical sense, is calm; as a technical term it is an agreement to refrain from fighting with the enemy for a period. The Hanafis call it a settlement for money or without money when the imam sees benefit; the Hanbalis define it as a contract by the imam or his deputy to cease fighting non-Muslims for a known period matching the need. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} It differs from aman, the lifting of the licence to kill a belligerent and take his property for a time, and from the dhimma contract, which is a permanent safe-conduct while hudna is temporary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16461} Its legitimacy rests on the Qur'an (Surat al-Tawba, and Surat al-Anfal 61), on the Prophet's truce with Quraysh at Hudaybiyya for ten years, and on consensus that it is permitted in general, and may be obligatory in necessity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16462}"
