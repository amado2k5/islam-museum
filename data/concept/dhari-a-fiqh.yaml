label:
  ar: "الذريعة"
  en: "Dhari'a (the means that lead to an end; see blocking the means)"
  ur: "ذریعہ (وسیلہ جو مقصد تک پہنچائے)"
summary:
  ar: "الذريعة لغة الوسيلة المفضية إلى الشيء، واصطلاحا ما يتوصل به إلى الشيء، وتكون إلى المفاسد المحرمة وإلى المصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8421} وحكمها يتعلق بها من جهتين: سدها وفتحها، وتفصيل ذلك في مادة سد الذرائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422}"
  en: "Dhari'a in the lexicon is the means that leads to a thing; as a term it is whatever leads to a further end. It may lead to forbidden harms or to goods; the ruling on it has two sides, blocking and opening, treated under the entry on blocking the means. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422}"
  ur: "ذریعہ لغت میں اس وسیلے کو کہتے ہیں جو کسی چیز تک پہنچائے۔ اس کا حکم دو پہلوؤں سے ہے: سد اور فتح، جس کی تفصیل سد الذرائع کے باب میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422}"
