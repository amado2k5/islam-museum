id: concept/dhari-a-fiqh
class: concept
kind: legal
label:
  ar: "الذريعة"
  en: "Dhari'a (the means that lead to an end; see blocking the means)"
  ur: "ذریعہ ⁦(وسیلہ جو مقصد تک پہنچائے)⁩"
  es: "Dhari'a (los medios que conducen a un fin; véase bloquear los medios)"
  fr: "Dhari'a (les moyens qui mènent à une fin; voir bloquer les moyens)"
  tr: "Al-Ari'ah"
  id: "Al-Ari'ah"
summary:
  ar: "الذريعة لغة الوسيلة المفضية إلى الشيء، واصطلاحا ما يتوصل به إلى الشيء، وتكون إلى المفاسد المحرمة وإلى المصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8421} وحكمها يتعلق بها من جهتين: سدها وفتحها، وتفصيل ذلك في مادة سد الذرائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422}"
  en: "Dhari'a in the lexicon is the means that leads to a thing; as a term it is whatever leads to a further end. It may lead to forbidden harms or to goods; the ruling on it has two sides, blocking and opening, treated under the entry on blocking the means. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422}"
  ur: "ذریعہ لغت میں اس وسیلے کو کہتے ہیں جو کسی چیز تک پہنچائے۔ اس کا حکم دو پہلوؤں سے ہے: سد اور فتح، جس کی تفصیل سد الذرائع کے باب میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422}"
  es: "En el léxico, Dhari'a se refiere al medio que conduce a algo; como término, es todo aquello que lleva a un fin ulterior. Puede conducir a daños prohibidos o a bienes; la norma al respecto tiene dos vertientes: bloqueo y apertura, tratadas en la entrada sobre el bloqueo de los medios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422}"
  fr: "Dans le lexique, le terme « dhari'a » désigne les moyens qui mènent à une chose; il s'agit de tout ce qui conduit à une fin ultérieure. Cela peut mener à des méfaits interdits ou à des biens; la règle à ce sujet comporte deux aspects, le blocage et l'ouverture, traités dans l'entrée relative au blocage des moyens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422}"
  tr: "'al-dhari'ah' ifadesi, dilsel anlamda bir şeye götürmenin ve teknik olarak bir şeye götürenin ne olduğunu, yasak zararlara ve faydalara yol açmasını ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8421} Hüküm iki açıdan ilişkilidir: engellemek ve açmak; bu da 'kaynakları engelleme' makalesinde ayrıntılı olarak belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8422}"
  id: "Frasa 'al-dhari'ah' adalah cara linguistik yang mengarah ke sesuatu, dan secara teknis yang mengarah pada sesuatu, dan mengarah pada bahaya terlarang dan manfaat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8421} Aturannya berkaitan dengannya dari dua aspek: memblokir dan membukanya, dan ini dijelaskan dalam artikel 'blocking the sources.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8422}"
