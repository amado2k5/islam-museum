id: concept/tadbir-asnaf-al-suda-bi-al-musharaka
class: concept
kind: scientific
label:
  ar: "تدبير أصناف الصداع الكائن بالمشاركة"
  en: "The regimen of the kinds of headache by sharing"
  ur: "مشارکت سے ہونے والے صداع کی قسموں کی تدبیر"
  es: "El régimen de los tipos de dolor de cabeza compartiendo"
  fr: "Le traitement des différents types de maux de tête par le partage"
  tr: "Katılımdan kaynaklanan baş ağrısı türlerinin yönetimi"
  id: "Pengelolaan Jenis Sakit Kepala yang Disebabkan oleh Partisipasi"
summary:
  ar: "يقرر ابن سينا أن تدبير الصداع بالمشاركة بالعناية بالعضو المشارك واستفراغه وتبديل مزاجه مع تقوية الرأس، ثم يفصل ما يخص المعدة والكبد وصعود الأبخرة؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.70-71}"
  en: "Ibn Sina lays down that the regimen of headache by sharing is care for the sharing organ, evacuating it and changing its temperament while strengthening the head, then details what is particular to the stomach, the liver and the rising of vapours; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.70-71}"
  ur: "ابن سینا طے کرتا ہے کہ مشارکت سے ہونے والے صداع کی تدبیر شریک عضو کی دیکھ بھال، اس کے استفراغ اور مزاج بدلنے میں ہے، سر کو قوت دیتے ہوئے، پھر معدے، جگر اور بخارات کے چڑھنے کی خصوصی باتیں بتاتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.70-71}۔"
  es: "Ibn Sina establece que el régimen para el dolor de cabeza mediante la compartición consiste en cuidar el órgano afectado, vaciándolo y modificando su temperamento mientras se fortalece la cabeza; luego detalla lo que es particular para el estómago, el hígado y la elevación de los vapores; el registro tiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 pp.70-71}"
  fr: "Ibn Sina explique que le traitement des maux de tête par le partage consiste à prendre soin de l'organe concerné, à le vider et à modifier son état tout en fortifiant la tête; il détaille ensuite les spécificités de l'estomac, du foie et de la montée des vapeurs. Le texte comporte une ligne annotée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.70-71}."
  tr: "İbn Sina, baş ağrılarını yönetmenin ilgili organın bakımı, kusma ve ruh hali değişiklikleriyle ilgilenmeyi ve başın güçlendirilmesini gerektirdiğine karar verir; ardından mide, karaciğer ve buharların yükselmesiyle ilgili konuları detaylandırır; bu bölümde kurucunun kuralı hakkında bir satır vardır {cite:canon-ibn-sina-print-v2 s.70-71}"
  id: "Ibn Sina memutuskan bahwa mengelola sakit kepala melibatkan perawatan organ yang berpartisipasi, muntah, dan perubahan suasana hati sambil memperkuat kepala, lalu merinci hal-hal yang berkaitan dengan lambung, hati, dan kenaikan uap; di dalamnya, terdapat sebuah baris berjudul di bagian tentang aturan pendiri {cite:canon-ibn-sina-print-v2 hlm.70-71}"
