id: concept/tadbir-asnaf-al-suda-bi-al-musharaka
class: concept
kind: scientific
label:
  ar: "تدبير أصناف الصداع الكائن بالمشاركة"
  en: "The regimen of the kinds of headache by sharing"
  ur: "مشارکت سے ہونے والے صداع کی قسموں کی تدبیر"
summary:
  ar: "يقرر ابن سينا أن تدبير الصداع بالمشاركة بالعناية بالعضو المشارك واستفراغه وتبديل مزاجه مع تقوية الرأس، ثم يفصل ما يخص المعدة والكبد وصعود الأبخرة؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.70-71}"
  en: "Ibn Sina lays down that the regimen of headache by sharing is care for the sharing organ, evacuating it and changing its temperament while strengthening the head, then details what is particular to the stomach, the liver and the rising of vapours; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.70-71}"
  ur: "ابن سینا طے کرتا ہے کہ مشارکت سے ہونے والے صداع کی تدبیر شریک عضو کی دیکھ بھال، اس کے استفراغ اور مزاج بدلنے میں ہے، سر کو قوت دیتے ہوئے، پھر معدے، جگر اور بخارات کے چڑھنے کی خصوصی باتیں بتاتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.70-71}۔"
