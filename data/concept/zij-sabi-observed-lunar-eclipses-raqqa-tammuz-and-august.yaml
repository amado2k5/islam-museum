label: { ar: "كسوفان قمريان رُصدا بالرقة في تموز وآب", en: "Two observed lunar eclipses at Raqqa in Tammuz and August", ur: "رقہ میں تموز اور آب میں رصد شدہ دو قمری کسوف", es: "Se observaron dos eclipses lunares en Raqqa en Tamuz y agosto." }
summary:
  ar: "يذكر البتاني كسوفين قمريين قريبين: الأول في الثالث والعشرين من تموز بالرقة، انكسف فيه أكثر من نصف القطر وثلثه، والثاني في الثاني من آب، وكان أقل من قطره، وأُعطيت فيه أوقات الوسط بالساعات بعد الظهر. {cite:zij-sabi-nallino-byblion p.86}."
  en: "Al-Battani records two nearby lunar eclipses. The first, on 23 Tammuz at Raqqa, covered more than half and a third of the Moon's diameter; the second, on 2 August, covered less than its full diameter, and its middle is given in hours after noon. {cite:zij-sabi-nallino-byblion p.86}."
  ur: "البتانی دو قریبی قمری کسوفات درج کرتے ہیں: پہلا تموز کی تیئس تاریخ کو رقہ میں، جس میں چاند کے قطر کا آدھے اور ایک تہائی سے زیادہ حصہ ڈھکا؛ دوسرا دو اگست کو، جو قطر سے کم تھا، اور اس کا وسط دوپہر کے بعد گھنٹوں میں دیا گیا ہے۔ {cite:zij-sabi-nallino-byblion p.86}۔"
  es: "Al-Battani registra dos eclipses lunares cercanos. El primero, el 23 de Tamuz en Raqqa, cubrió más de la mitad y un tercio del diámetro de la Luna; el segundo, el 2 de agosto, cubrió menos de su diámetro total, y su punto medio se indica en horas después del mediodía. {cite:zij-sabi-nallino-byblion p.86}."
