id: concept/zij-sabi-observed-lunar-eclipses-raqqa-tammuz-and-august
class: concept
kind: scientific
label: { ar: "كسوفان قمريان رُصدا بالرقة في تموز وآب", en: "Two observed lunar eclipses at Raqqa in Tammuz and August", ur: "رقہ میں تموز اور آب میں رصد شدہ دو قمری کسوف", es: "Se observaron dos eclipses lunares en Raqqa en Tamuz y agosto.", fr: "Deux éclipses lunaires ont été observées à Raqqa en Tammuz et en août.", tr: "Temmuz ve Ağustos aylarında Rakka'da iki ay tutulması gözlemlendi.", id: "Dua gerhana bulan diamati di Raqqa pada bulan Juli dan Agustus." }
summary:
  ar: "يذكر البتاني كسوفين قمريين قريبين: الأول في الثالث والعشرين من تموز بالرقة، انكسف فيه أكثر من نصف القطر وثلثه، والثاني في الثاني من آب، وكان أقل من قطره، وأُعطيت فيه أوقات الوسط بالساعات بعد الظهر. {cite:zij-sabi-nallino-byblion p.86}."
  en: "Al-Battani records two nearby lunar eclipses. The first, on 23 Tammuz at Raqqa, covered more than half and a third of the Moon's diameter; the second, on 2 August, covered less than its full diameter, and its middle is given in hours after noon. {cite:zij-sabi-nallino-byblion p.86}."
  ur: "البتانی دو قریبی قمری کسوفات درج کرتے ہیں: پہلا تموز کی تیئس تاریخ کو رقہ میں، جس میں چاند کے قطر کا آدھے اور ایک تہائی سے زیادہ حصہ ڈھکا؛ دوسرا دو اگست کو، جو قطر سے کم تھا، اور اس کا وسط دوپہر کے بعد گھنٹوں میں دیا گیا ہے۔ {cite:zij-sabi-nallino-byblion p.86}۔"
  es: "Al-Battani registra dos eclipses lunares cercanos. El primero, el 23 de Tamuz en Raqqa, cubrió más de la mitad y un tercio del diámetro de la Luna; el segundo, el 2 de agosto, cubrió menos de su diámetro total, y su punto medio se indica en horas después del mediodía. {cite:zij-sabi-nallino-byblion p.86}."
  fr: "Al-Battani rapporte deux éclipses lunaires proches. La première, le 23 Tammuz à Raqqa, a couvert plus de la moitié et du tiers du diamètre lunaire; la seconde, le 2 août, a couvert moins de son diamètre total, et son milieu est indiqué en heures après midi. {cite:zij-sabi-nallino-byblion p.86}."
  tr: "El-Battani, birbirine yakın iki ay tutulmasından bahseder: İlki 23 Temmuz'da Rakka'da meydana gelmiş olup, yarıçapın yarısından fazlası ve üçte biri tutulmuştur; ikincisi ise 2 Ağustos'ta meydana gelmiş olup, yarıçapı daha azdır ve tutulma saatleri öğle vakti ve öğleden sonra olarak verilmiştir. {cite:zij-sabi-nallino-byblion s.86}."
  id: "Al-Battani menyebutkan dua gerhana bulan yang terjadi berdekatan: yang pertama pada tanggal 23 Juli di Raqqa, di mana lebih dari setengah dan sepertiga jari-jari bulan tertutupi, dan yang kedua pada tanggal 2 Agustus, yang kurang dari jari-jari bulan, dan waktu tengah hari di sore hari disebutkan. {cite:zij-sabi-nallino-byblion p.86}."
