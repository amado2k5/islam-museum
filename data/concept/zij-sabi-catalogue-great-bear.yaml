label:
  ar: "الدب الأكبر"
  en: "The Great Bear"
  ur: "دب اکبر"
summary:
  ar: "يعرض فهرس الكواكب الثابتة في آخر الزيج صورة الدب الأكبر بعد صورة الدب الأصغر، ويذكر كواكبها واحداً واحداً بمواضعها من الطول والعرض. وتُعرف كواكبها في الفهرس بمواضعها من أجزاء الصورة: الخطم، والركبة، والظهر، ومراق البطن، وأصل الذنب، وأصل الفخذ. ولم تُنقل الأرقام هنا. {cite:zij-sabi-nallino-byblion pp.245}"
  en: "The star catalogue at the end of al-Battani's Zij lists the stars of the Great Bear after those of the Lesser Bear, each with its position in longitude and latitude. The entries name the stars by part of the figure: the muzzle, the knee, the back, the lower belly, the root of the tail and the root of the thigh. The figures in the table are not transcribed here. {cite:zij-sabi-nallino-byblion pp.245}"
  ur: "زیج کے آخر میں ستاروں کی فہرست میں دب اکبر کے ستارے دب اصغر کے بعد آتے ہیں، اور ہر ستارہ اپنے طول اور عرض کے ساتھ درج ہے۔ ستارے صورت کے اعضا کے حوالے سے پہچانے گئے ہیں: تھوتھنی، گھٹنا، پشت، پیٹ کا نچلا حصہ، دم کی جڑ اور ران کی جڑ۔ جدول کے عددی مواضع یہاں نقل نہیں کیے گئے۔ {cite:zij-sabi-nallino-byblion pp.245}"
