id: concept/zij-sabi-the-latitude-of-a-star-and-its-direction
class: concept
kind: scientific
label: { ar: "عرض الكوكب وجهة عرضه", en: "The latitude of a star and its direction", ur: "ستارے کا عرض اور اس کی جہت", es: "La latitud de una estrella y su dirección", fr: "La latitude d'une étoile et sa direction", tr: "Gezegen kendi bakış açısını sundu.", id: "Planet tersebut menyampaikan sudut pandangnya." }
summary:
  ar: "لمعرفة عرض الكوكب يُضرب وتر بعده عن معدل النهار في وتر تمام ميل الدرجة التي وُجد فيها الكوكب، ويُقسم الحاصل على وتر تمام الميل الكلي، ويُقوَّس الناتج. فإن كانت القوس أكثر من ميل تلك الدرجة نُقص منها ذلك الميل، وإن كانت أقل نُقصت من الميل، والباقي بعد الزيادة أو النقص هو عرض الكوكب. {cite:zij-sabi-nallino-byblion pp.60-61}."
  en: "To find a star's latitude the chord of its distance from the equator is multiplied by the chord of the complement of the declination of the degree in which the star was found, the result is divided by the chord of the complement of the full obliquity, and the quotient is turned into an arc. If the arc is greater than the declination of that degree the declination is taken from it, and if less it is taken from the declination; the remainder is the latitude of the star. {cite:zij-sabi-nallino-byblion pp.60-61}."
  ur: "ستارے کا عرض جاننے کے لیے اس کے معدل النہار سے بعد کے وتر کو اس درجے کے میل کے تمام کے وتر سے ضرب دی جاتی ہے جس میں ستارہ پایا گیا، حاصل کو کل میل کے تمام کے وتر پر تقسیم کیا جاتا ہے، اور خارجِ قسمت کی قوس بنائی جاتی ہے۔ اگر قوس اس درجے کے میل سے بڑی ہو تو اس میں سے وہ میل گھٹایا جاتا ہے، اور چھوٹی ہو تو اسے میل میں سے گھٹایا جاتا ہے؛ جو بچے وہی ستارے کا عرض ہے۔ {cite:zij-sabi-nallino-byblion pp.60-61}۔"
  es: "Para hallar la latitud de una estrella, se multiplica la cuerda que representa su distancia al ecuador por la cuerda del complemento de la declinación del grado en el que se encontró la estrella. El resultado se divide por la cuerda del complemento de la oblicuidad máxima, y el cociente se convierte en un arco. Si el arco es mayor que la declinación de ese grado, se toma la declinación del arco; si es menor, se toma de la declinación. El resto es la latitud de la estrella. {cite:zij-sabi-nallino-byblion pp.60-61}."
  fr: "Pour déterminer la latitude d'une étoile, on multiplie la corde correspondant à sa distance à l'équateur par la corde du complément de la déclinaison du degré auquel l'étoile a été trouvée. Le résultat est divisé par la corde du complément de l'obliquité totale, et le quotient est transformé en arc de cercle. Si cet arc est supérieur à la déclinaison de ce degré, on soustrait la déclinaison de l'arc; s'il est inférieur, on soustrait la déclinaison de l'arc. Le reste correspond à la latitude de l'étoile. {cite:zij-sabi-nallino-byblion pp.60-61}."
  tr: "Bir gezegenin enlemini belirlemek için, gezegenin günün ekvatorundan uzaklığının kirişini, gezegenin bulunduğu derece eğiminin kirişiyle çarpın. Sonucu toplam eğimin kirişine bölün ve sonucu yukarı yuvarlayın. Yuvarlama sonucu derece eğiminden büyükse, o eğimi çıkarın; küçükse, eğimi çıkarın. Artış veya azalıştan sonra kalan, gezegenin enlemidir. {cite:zij-sabi-nallino-byblion pp.60-61}."
  id: "Untuk menentukan garis lintang suatu planet, kalikan panjang tali busur jaraknya dari khatulistiwa pada hari itu dengan panjang tali busur inklinasi derajat tempat planet tersebut berada. Bagi hasilnya dengan panjang tali busur inklinasi total, lalu bulatkan hasilnya ke atas. Jika pembulatan lebih besar dari inklinasi derajat, kurangi inklinasi tersebut; jika lebih kecil, kurangi inklinasi tersebut. Sisa setelah penambahan atau pengurangan adalah garis lintang planet tersebut. {cite:zij-sabi-nallino-byblion pp.60-61}."
