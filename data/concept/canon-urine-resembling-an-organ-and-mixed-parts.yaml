summary:
  ar: "يختم ابن سينا الفصل الثالث بأن البول الذي يشبه لون عضو دوامه يدل على علة بذلك العضو، وبذكر الغيم والدخان في أسفله، وبالفرق بين الخام والمدة بالنتن، وبحال المختلف الأجزاء {cite:canon-ibn-sina-print-v1 p.192}."
  en: "Ibn Sina ends the third chapter by saying that urine resembling the colour of an organ, if lasting, shows an ailment of that organ, by the cloud or smoke in its lower part, by telling raw matter from pus by stench, and by the state of urine of mixed parts {cite:canon-ibn-sina-print-v1 p.192}."
