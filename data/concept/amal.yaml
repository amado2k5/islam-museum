label:
  ar: "العَمَل"
  en: "Action (amal) and the five rulings that govern it"
  fr: "L’action (amal) et ses cinq qualifications juridiques"
  ur: "عمل ⁦(فعل)⁩"
  es: "La acción (amal) y las cinco normas que la rigen."
  tr: "Çalışmaları"
  id: "Çalışmaları"
summary:
  ar: "العمل في اللغة المهنة والفعل، ويعم عند الكليات أفعال الجوارح والقلوب، وقيل هو إحداث أمر قولاً كان أو فعلاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. وتعتريه الأحكام الخمسة: فما طلبه الشارع طلب إلزام فواجب، وما طلبه دون إلزام فمندوب، وما نهى عنه نهي إلزام فحرام، وما نهى عنه دون إلزام فمكروه، وما خيّر فيه بين فعله وتركه فمباح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. ويثاب العبد على الطاعات ويعاقب على المعاصي إلا أن يعفو الله {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}."
  en: "In the lexicon, 'amal is a trade and an act; in the scholars' general usage it covers the acts of the limbs and of the heart, and some define it as bringing a thing about by speech or by deed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. The five rulings govern it: what the Lawgiver requires as binding is obligatory, what he requires without binding is recommended, what he forbids bindingly is forbidden, what he discourages without binding is disliked, and what he leaves to choice is permitted {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. The servant is rewarded for obedience and punished for disobedience, unless God pardons him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}."
  fr: "Dans le lexique, ‘amal désigne un métier et un acte ; dans l’usage général des savants, il recouvre les actes des membres comme ceux du cœur, et certains le définissent comme le fait de produire quelque chose par la parole ou par l’action {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. Il relève des cinq qualifications juridiques : ce que le Législateur exige impérativement est obligatoire ; ce qu’il demande sans l’imposer est recommandé ; ce qu’il défend impérativement est interdit ; ce qu’il déconseille sans l’interdire est réprouvé ; ce qu’il laisse au choix de chacun est permis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. Le serviteur est récompensé pour son obéissance et puni pour sa désobéissance, à moins que Dieu ne lui pardonne {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}."
  es: "En el léxico, 'amal' es un oficio y un acto; en el uso general de los eruditos abarca los actos de los miembros y del corazón, y algunos lo definen como lograr algo mediante la palabra o la acción {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. Se rige por cinco reglas: lo que el Legislador exige como vinculante es obligatorio, lo que exige sin vincular es recomendable, lo que prohíbe vinculantemente está prohibido, lo que desaconseja sin vincular es desaconsejable, y lo que deja a elección está permitido {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. El siervo es recompensado por la obediencia y castigado por la desobediencia, a menos que Dios lo perdone {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}."
  ur: "لغت میں، 'عمل ایک تجارت اور ایک عمل ہے؛ علماء کے عام استعمال میں یہ اعضاء اور دل کے افعال کا احاطہ کرتا ہے اور بعض نے اس کی تعریف قول یا عمل سے کسی چیز کو لانے کے طور پر کی ہے۔ اس پر پانچ احکام نافذ ہیں: قانون دینے والا جس چیز کا تقاضا کرتا ہے وہ واجب ہے، جس چیز کا وہ بغیر پابندی کے تقاضا کرتا ہے وہ مستحب ہے، جس چیز سے وہ پابندی سے منع کرے وہ حرام ہے، جس چیز کی پابندی کے بغیر اس کی حوصلہ شکنی کرے وہ ناپسندیدہ ہے، اور جس چیز کو وہ پسند کرنے کے لیے چھوڑ دے وہ جائز ہے۔ بندے کو اطاعت کا بدلہ دیا جاتا ہے اور نافرمانی پر سزا دی جاتی ہے، الا یہ کہ خدا اسے معاف کر دے۔"
  tr: "Dilde eylem hem meslek hem eylemdir ve genel olarak uzuvların ve kalplerin eylemlerini içerir. Bir emrin, ister sözle ister eylemle olsun, bir emrin yaratılması olduğu söylenir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11839}. Beş hükümle kapsanır: Kanun Uygulayanın istediği zorunludur; Kanun Vericinin istediği zorunludur; zorunlu olmadan istenen tavsiye edilir; yasak olan yasaktır; zorunluluk olmadan yasak olan sevilmezdir; ve bunu yapmak ile ondan kaçınmak arasında seçim hakkı verilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11839}. Bir hizmetkâr, itaat eylemleri için ödüllendirilir ve günahları için cezalandırılır, Tanrı affetmedikçe {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11839}."
