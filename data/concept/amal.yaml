id: concept/amal
class: concept
kind: legal
label:
  ar: "العَمَل"
  en: "Action (amal) and the five rulings that govern it"
  ur: "عمل (فعل)"
summary:
  ar: "العمل في اللغة المهنة والفعل، ويعم عند الكليات أفعال الجوارح والقلوب، وقيل هو إحداث أمر قولاً كان أو فعلاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. وتعتريه الأحكام الخمسة: فما طلبه الشارع طلب إلزام فواجب، وما طلبه دون إلزام فمندوب، وما نهى عنه نهي إلزام فحرام، وما نهى عنه دون إلزام فمكروه، وما خيّر فيه بين فعله وتركه فمباح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. ويثاب العبد على الطاعات ويعاقب على المعاصي إلا أن يعفو الله {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}."
  en: "In the lexicon, 'amal is a trade and an act; in the scholars' general usage it covers the acts of the limbs and of the heart, and some define it as bringing a thing about by speech or by deed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. The five rulings govern it: what the Lawgiver requires as binding is obligatory, what he requires without binding is recommended, what he forbids bindingly is forbidden, what he discourages without binding is disliked, and what he leaves to choice is permitted {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}. The servant is rewarded for obedience and punished for disobedience, unless God pardons him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11839}."
