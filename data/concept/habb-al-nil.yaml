label:
  ar: "حبّ النيل"
  en: "Habb al-nil (Indian safflower seed)"
  ur: "حب النیل ⁦(ہندی قرطم)⁩"
summary:
  ar: "حبّ النيل هو القرطم الهندي في تعريف الكتاب، وأجوده الرزين الأملس الحديث. طبعه حار يابس، والصحيح عند الكتاب أنه في الثانية. ينفع من البرص والبهق الأبيض، ويسهّل الأخلاط الغليظة والسوداء والبلغم بقوة. ومقادير بدائله بالأوزان متروكة."
  en: "Habb al-nil is, in the book's words, Indian qurtum (safflower). The best is heavy, smooth and fresh. The book gives it as hot and dry, and the correct view is the second degree. It is said to help leukoderma and white vitiligo, and it strongly purges thick humours, black bile and phlegm. The weights of its substitutes are left out."
  ur: "حب النیل کتاب کے بیان کے مطابق ہندی قرطم ہے۔ اس کی بہترین قسم بھاری، ملائم اور تازہ ہے۔ کتاب اسے گرم اور خشک بتاتی ہے، اور صحیح رائے کے مطابق دوسرے درجے میں۔ کہا جاتا ہے کہ یہ برص اور سفید بہق میں مفید ہے، اور گاڑھے اخلاط، سودا اور بلغم کو زور سے نکالتا ہے۔ اس کے بدلوں کے وزن چھوڑ دیے گئے ہیں۔"
