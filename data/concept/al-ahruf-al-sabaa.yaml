id: concept/al-ahruf-al-sabaa
class: concept
kind: doctrine
label: {ar: "الأحرف السبعة", en: "The seven ahruf", fr: "Les sept ahruf", ur: "احرفِ سبعہ", es: "Los siete ahruf", tr: "Yedi Mektup", id: "Tujuh Surat"}
summary:
  ar: "قول النبي «إن القرآن أنزل على سبعة أحرف فاقرؤوا منه ما تيسر» — رواها عمر لما سمع هشام بن حكيم يقرأ الفرقان على غير قراءته فقاد به إلى النبي فأقرأ كلاً منهما وقال لكلٍّ هكذا أنزلت {cite:sahih-al-bukhari 2419}. وقد اختلف العلماء في ماهيتها اختلافاً واسعاً: فمن أهل العلم من عدّها سبعة أوجه من الحروف في الأمر والنهي والوعد والوعيد والجدل والقصص والمثل، ومنهم من جعلها الاختلاف في الحركات والحذف والتقديم والتأخير والإبدال، ومنهم من ربطها بقراءات الأعراب — وهي مسألة من أدق مسائل علوم القرآن وأوسعها جدلاً."
  en: "The Prophet's saying 'the Qur'an was revealed in seven ahruf, so read of it what is easy' — narrated through Umar's dispute with Hisham ibn Hakim over Surat al-Furqan {cite:sahih-al-bukhari 2419}; its exact meaning is one of the widest debates in Qur'anic sciences."
  fr: "La parole du Prophète « le Coran a été révélé selon sept ahruf, récitez-en donc ce qui est facile » — transmise à travers la dispute d’Umar avec Hisham ibn Hakim au sujet de la sourate al-Furqan {cite:sahih-al-bukhari 2419} ; son sens exact est l’un des débats les plus vastes des sciences du Coran."
  es: "El dicho del Profeta \"el Corán fue revelado en siete ahruf, así que lee de él lo que te sea fácil\" — narrado a través de la disputa de Umar con Hisham ibn Hakim sobre la Sura al-Furqan {cita:sahih-al-bukhari 2419}; su significado exacto es uno de los debates más amplios en las ciencias coránicas."
  ur: "نبی کا یہ فرمان 'قرآن سات احرفوں میں نازل ہوا ہے، لہٰذا اس میں سے جو آسان ہو اسے پڑھو' - سورۃ الفرقان پر ہشام بن حکیم کے ساتھ عمر کے تنازعہ سے روایت ہے {حوالہ: صحیح البخاری 2419}؛ اس کا صحیح مفہوم قرآنی علوم کی وسیع ترین بحثوں میں سے ایک ہے۔"
  tr: "Peygamber'in \"Gerçekten Kur'an yedi harfle indirilmiştir, mümkün olanı ondan oku\" sözü, Hisham bin Hakim'in el-Furqan'ı farklı bir şekilde okuduğunu duyduğunda Ömer tarafından rivayet edilmiştir; bu yüzden onu Peygamber'e götürmüştür; Kur'an her birini okuyarak her birine \"İşte böyle vahyedilmiştir\" demiştir {atıf:sahih-al-bukhari 2419}. Âlimler doğası konusunda büyük farklılıklar göstermiştir: bazı alimler onu komut veren yedi biçim parçacık, yasaklama, vaat, uyarı, tartışma, hikaye ve atasözleri olarak görmüştür; bazıları ünlü, eksiklik, öncelik, gecikme ve ikame farklılıkları olarak kabul etmiştir; diğerleri ise bunu bedevi okumalarıyla ilişkilendirir — bu, Kur'an bilimlerinde en kesin ve en çok tartışılan konulardan biridir."
  id: "Pernyataan Nabi, \"Sesungguhnya, Al-Qur'an diwahyukan dengan tujuh huruf, maka bacalah apa yang mungkin darinya\" diceritakan oleh Umar ketika ia mendengar Hisham ibn Hakim melafalkan al-Furqan dengan cara yang berbeda; oleh karena itu, ia membawanya kepada Nabi; Al-Qur'an membacakan masing-masing dan berkata kepada masing-masing, \"Demikianlah ia diwahyukan\" {atribusi: sahih al-bukhari 2419}. Para ulama menunjukkan perbedaan besar dalam sifatnya: beberapa melihatnya sebagai tujuh bentuk partikel perintah, larangan, janji, peringatan, debat, cerita, dan perisalan; beberapa menerimanya sebagai perbedaan vokal, kekurangan, prioritas, penundaan, dan penggantian; yang lain mengaitkan ini dengan bacaan Badui — ini adalah salah satu topik paling definitif dan paling banyak diperdebatkan dalam ilmu Al-Qur'an."
