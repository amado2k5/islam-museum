id: concept/al-ahruf-al-sabaa
class: concept
kind: doctrine
label: { ar: "الأحرف السبعة", en: "The seven ahruf" }
summary:
  ar: "قول النبي «إن القرآن أنزل على سبعة أحرف فاقرؤوا منه ما تيسر» — رواها عمر لما سمع هشام بن حكيم يقرأ الفرقان على غير قراءته فقاد به إلى النبي فأقرأ كلاً منهما وقال لكلٍّ هكذا أنزلت {cite:sahih-al-bukhari 2419}. وقد اختلف العلماء في ماهيتها اختلافاً واسعاً: فمن أهل العلم من عدّها سبعة أوجه من الحروف في الأمر والنهي والوعد والوعيد والجدل والقصص والمثل، ومنهم من جعلها الاختلاف في الحركات والحذف والتقديم والتأخير والإبدال، ومنهم من ربطها بقراءات الأعراب — وهي مسألة من أدق مسائل علوم القرآن وأوسعها جدلاً."
  en: "The Prophet's saying 'the Qur'an was revealed in seven ahruf, so read of it what is easy' — narrated through Umar's dispute with Hisham ibn Hakim over Surat al-Furqan {cite:sahih-al-bukhari 2419}; its exact meaning is one of the widest debates in Qur'anic sciences."
