id: concept/ihtiyat
class: concept
kind: legal
label: { ar: "احتياط", en: "Caution, precaution (ihtiyat)" }
summary:
  ar: "الاحتياط في اللغة الأخذ في الأمور بالأحزم والأوثق، ومحاذرة الخطأ واتقاؤه، ويستعمله الفقهاء بهذه المعاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} والورع اجتناب الشبهات خوفاً من الوقوع في الحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} ومن القواعد المبنية على الاحتياط تغليب الحرام عند اجتماع الحرام والحلال، وتفصيله في كتب القواعد الفقهية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} وتُبحث مسألة جريان الاحتياط في الواجب والمندوب والمحرم في الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750}"
  en: "Ihtiyat in the lexicon is taking the most prudent and secure course, and guarding against error. Jurists use it in these senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} Scrupulousness (wara') is avoiding doubtful matters for fear of falling into what is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} One of the rules built on caution is that the forbidden prevails when the lawful and the forbidden are mixed; its scope is treated in the books of legal maxims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Whether caution applies to obligatory, recommended and forbidden acts is treated in the usul appendix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Note: the heading in the scan is spelled اختياط."
