label: { ar: "احتياط", en: "Caution, precaution (ihtiyat)", es: "Precaución, precaución (ihtiyat)", fr: "Attention, précaution (ihtiyat)", ur: "احتیاط، احتیاط ⁦(احتیاط)⁩", tr: "Önlem", id: "Tindakan pencegahan" }
summary:
  ar: "الاحتياط في اللغة الأخذ في الأمور بالأحزم والأوثق، ومحاذرة الخطأ واتقاؤه، ويستعمله الفقهاء بهذه المعاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} والورع اجتناب الشبهات خوفاً من الوقوع في الحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} ومن القواعد المبنية على الاحتياط تغليب الحرام عند اجتماع الحرام والحلال، وتفصيله في كتب القواعد الفقهية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} وتُبحث مسألة جريان الاحتياط في الواجب والمندوب والمحرم في الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750}"
  en: "Ihtiyat in the lexicon is taking the most prudent and secure course, and guarding against error. Jurists use it in these senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} Scrupulousness (wara') is avoiding doubtful matters for fear of falling into what is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} One of the rules built on caution is that the forbidden prevails when the lawful and the forbidden are mixed; its scope is treated in the books of legal maxims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Whether caution applies to obligatory, recommended and forbidden acts is treated in the usul appendix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Note: the heading in the scan is spelled اختياط."
  es: "Ihtiyat en el léxico es tomar el camino más prudente y seguro, y protegerse contra el error. Los juristas lo usan en estos sentidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} Escrupulosidad (wara') es evitar asuntos dudosos por temor a caer en lo prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} Una de las reglas basadas en la precaución es que lo prohibido prevalece cuando lo lícito y lo prohibido se mezclan; su alcance se trata en los libros de máximas legales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Si la precaución se aplica a actos obligatorios, recomendados y prohibidos se trata en el apéndice usul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Nota: el título en el escaneo se escribe اختياط."
  fr: "Dans le lexique, « ihtiyat » signifie adopter la conduite la plus prudente et la plus sûre, et se prémunir contre l'erreur. Les juristes l'emploient dans ce sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} La scrupulosité (wara') consiste à éviter les choses douteuses par crainte de tomber dans l'interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1749} L'une des règles fondées sur la prudence est que l'interdit prévaut lorsque le licite et l'illicite sont mêlés; sa portée est traitée dans les recueils de maximes juridiques. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} La question de savoir si la prudence s'applique aux actes obligatoires, recommandés et interdits est abordée dans l'appendice usul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Remarque: le titre de l'analyse est orthographié اختياط."
  ur: "لغت میں احتیاط سب سے زیادہ محتاط اور محفوظ طریقہ اختیار کرنا ہے، اور غلطی سے بچنا ہے۔ فقہاء اسے ان معنوں میں استعمال کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1749} بے وقوفی مشتبہ امور سے اجتناب کرنا ہے اس ڈر سے کہ حرام چیزوں میں پڑ جائیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1749} احتیاط پر بنائے گئے اصولوں میں سے ایک یہ ہے کہ جب حلال اور حرام کو ملایا جائے تو حرام غالب آتا ہے۔ اس کے دائرہ کار کو قانونی ماخذ کی کتابوں میں بیان کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1750} آیا احتیاط واجب، مستحب اور حرام کاموں پر لاگو ہوتی ہے اس کا علاج ضمیمہ اصول میں کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1750} نوٹ: اسکین میں سرخی کی ہجے ہے اختیاط۔"
  tr: "Dilde önlem, işleri en kararlı ve güvenilir şekilde ele almak, hatalardan kaçınmak ve onlardan kaçınmak demektir ve hukukçular bunu bu anlamda kullanırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1749} Ve dindarlık, yasak olanlara düşmekten korkarak şüpheli şeylerden kaçınmaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1749} Önlem temelli kurallar arasında, yasak ve izin verilenin bir arada var olması durumunda yasak olanın tercih edilmesi yer alır; bu, fıkıh kuralları kitaplarında ayrıntılı olarak belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1750} Zorunlu görevlerde, önerilen ve yasaklı görevlerde önlemin uygulanması konusu Usuli ekinde tartışılmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1750}"
  id: "Kehati-hatian dalam bahasa berarti mengambil sesuatu dengan pendekatan yang paling tegas dan dapat diandalkan, menghindari dan menghindarinya, dan para ahli hukum menggunakannya dalam arti ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1749} Dan kesalehan adalah menghindari hal-hal yang meragukan karena takut jatuh ke dalam hal terlarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1749} Di antara aturan yang didasarkan pada kehati-hatian adalah preferensi terhadap yang terlarang ketika yang terlarang dan yang diperbolehkan hidup berdampingan, yang dirinci dalam buku aturan yurisprudensial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1750} Isu penerapan kehati-hatian dalam kewajiban wajib, yang direkomendasikan, dan yang dilarang dibahas dalam lampiran Usuli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750}"
