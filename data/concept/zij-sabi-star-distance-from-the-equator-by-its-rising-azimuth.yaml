id: concept/zij-sabi-star-distance-from-the-equator-by-its-rising-azimuth
class: concept
kind: scientific
label: { ar: "بعد الكوكب عن معدل النهار من سمت مطلعه ومغيبه", en: "The distance of a star from the equator from the azimuth of its rising or setting", ur: "ستارے کا معدل النہار سے بعد اس کے طلوع و غروب کی سمت سے", es: "La distancia de una estrella al ecuador medida a partir del acimut de su salida o puesta.", fr: "La distance d'une étoile par rapport à l'équateur, calculée à partir de l'azimut de son lever ou de son coucher.", tr: "Gezegenin ortalama gündüz süresine, doğuş ve batış noktalarına olan uzaklığı.", id: "Jarak planet dari rata-rata waktu siang hari, dari titik terbit dan terbenamnya." }
summary:
  ar: "يبدأ الباب الرابع والعشرون بمعرفة بعد الكوكب عن فلك معدل النهار والجزء الذي يتوسط السماء معه من قبل سمت مطلعه ومغيبه، إذا كان ذلك معلوماً بقياس. يُضرب وتر ارتفاع أول الحمل في ذلك البلد في وتر سمت مطلع الكوكب أو مغيبه، ويُقسم على نصف القطر، وقوس الحاصل هو بعد الكوكب عن معدل النهار في جهة السمت. {cite:zij-sabi-nallino-byblion p.58}."
  en: "Chapter 24 begins with finding the star's distance from the equator and the part that culminates with it from the azimuth of its rising or setting, when that is known by measurement. The chord of the altitude of the first of Aries in that place is multiplied by the chord of the azimuth of the star's rising or setting and divided by the radius, and the arc of the result is the star's distance from the equator in the direction of the azimuth. {cite:zij-sabi-nallino-byblion p.58}."
  ur: "چوبیسواں باب ستارے کا فلک معدل النہار سے بعد اور وسط السماء میں اس کے ساتھ آنے والا جزء، اس کے طلوع و غروب کی سمت سے جاننے سے شروع ہوتا ہے، جب یہ سمت پیمائش سے معلوم ہو۔ اس شہر میں حمل کے آغاز کے ارتفاع کے وتر کو ستارے کے طلوع یا غروب کی سمت کے وتر سے ضرب دی جاتی ہے، نصف قطر پر تقسیم کیا جاتا ہے، اور حاصل کی قوس سمت کی جہت میں ستارے کا معدل النہار سے بعد ہے۔ {cite:zij-sabi-nallino-byblion p.58}۔"
  es: "El capítulo 24 comienza con el cálculo de la distancia de la estrella al ecuador y de la parte que culmina con ella a partir del acimut de su salida o puesta, cuando este se conoce mediante medición. La cuerda de la altitud del primer Aries en ese lugar se multiplica por la cuerda del acimut de la salida o puesta de la estrella y se divide por el radio; el arco resultante es la distancia de la estrella al ecuador en la dirección del acimut. {cite:zij-sabi-nallino-byblion p.58}."
  fr: "Le chapitre 24 commence par la détermination de la distance de l'étoile à l'équateur et de la partie de l'arc qui y aboutit, en fonction de l'azimut de son lever ou de son coucher, lorsque celui-ci est connu par la mesure. La corde de la hauteur du premier point du Bélier à cet endroit est multipliée par la corde de l'azimut du lever ou du coucher de l'étoile, puis divisée par le rayon. L'arc ainsi obtenu correspond à la distance de l'étoile à l'équateur dans la direction de l'azimut. {cite:zij-sabi-nallino-byblion p.58}."
  tr: "24. Bölüm, gezegenin ekliptikten uzaklığını ve gökyüzünde kapladığı alanı, eğer ölçülebiliyorsa, doğuş ve batış azimutlarına dayanarak belirleyerek başlar. Bu konumdaki ilk gök cisminin irtifa kirişi, gezegenin doğuş veya batış azimut kirişiyle çarpılır ve yarıçapa bölünür. Elde edilen yay, gezegenin azimut yönündeki ekliptikten uzaklığıdır. {cite:zij-sabi-nallino-byblion s.58}."
  id: "Bab 24 dimulai dengan menentukan jarak planet dari ekliptika dan bagian langit yang ditempatinya, berdasarkan azimut terbit dan terbenamnya, jika ini dapat diukur. Tali busur ketinggian benda langit pertama di lokasi tersebut dikalikan dengan tali busur azimut terbit atau terbenam planet, dan dibagi dengan jari-jari. Busur yang dihasilkan adalah jarak planet dari ekliptika ke arah azimut. {cite:zij-sabi-nallino-byblion p.58}."
