id: concept/zij-sabi-star-distance-from-the-equator-by-its-rising-azimuth
class: concept
kind: scientific
label: { ar: "بعد الكوكب عن معدل النهار من سمت مطلعه ومغيبه", en: "The distance of a star from the equator from the azimuth of its rising or setting", ur: "ستارے کا معدل النہار سے بعد اس کے طلوع و غروب کی سمت سے" }
summary:
  ar: "يبدأ الباب الرابع والعشرون بمعرفة بعد الكوكب عن فلك معدل النهار والجزء الذي يتوسط السماء معه من قبل سمت مطلعه ومغيبه، إذا كان ذلك معلوماً بقياس. يُضرب وتر ارتفاع أول الحمل في ذلك البلد في وتر سمت مطلع الكوكب أو مغيبه، ويُقسم على نصف القطر، وقوس الحاصل هو بعد الكوكب عن معدل النهار في جهة السمت. {cite:zij-sabi-nallino-byblion p.58}."
  en: "Chapter 24 begins with finding the star's distance from the equator and the part that culminates with it from the azimuth of its rising or setting, when that is known by measurement. The chord of the altitude of the first of Aries in that place is multiplied by the chord of the azimuth of the star's rising or setting and divided by the radius, and the arc of the result is the star's distance from the equator in the direction of the azimuth. {cite:zij-sabi-nallino-byblion p.58}."
  ur: "چوبیسواں باب ستارے کا فلک معدل النہار سے بعد اور وسط السماء میں اس کے ساتھ آنے والا جزء، اس کے طلوع و غروب کی سمت سے جاننے سے شروع ہوتا ہے، جب یہ سمت پیمائش سے معلوم ہو۔ اس شہر میں حمل کے آغاز کے ارتفاع کے وتر کو ستارے کے طلوع یا غروب کی سمت کے وتر سے ضرب دی جاتی ہے، نصف قطر پر تقسیم کیا جاتا ہے، اور حاصل کی قوس سمت کی جہت میں ستارے کا معدل النہار سے بعد ہے۔ {cite:zij-sabi-nallino-byblion p.58}۔"
