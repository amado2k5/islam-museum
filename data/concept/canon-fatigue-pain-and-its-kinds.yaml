summary:
  ar: "يقسّم ابن سينا الوجع الإعيائي بحسب سببه إلى إعياء تعبي، وتمددي من خلط ممدّد، ونافخ من ريح، وقروحي من خلط لاذع، ويذكر أن منها تراكيب مثل البورقي المركب من التمددي والقروحي {cite:canon-ibn-sina-print-v1 p.150}."
  en: "Ibn Sina divides fatigue pain by its cause into exertional fatigue, tensive fatigue from a stretching humour, inflative fatigue from wind and ulcerative fatigue from an irritating humour, and notes compounds such as the boric kind, a mix of tensive and ulcerative {cite:canon-ibn-sina-print-v1 p.150}."
