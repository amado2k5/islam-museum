label:
  ar: "الركوع"
  en: "Rukuh (the bow in prayer): its ruling as a pillar, the calm in it, its posture, the raising of the hands, the glorifications, and the prohibition of bowing to a creature"
  ur: "رکوع"
summary:
  ar: "الركوع لغة الانحناء، وفي الصلاة طأطأة الرأس مع انحناء الظهر على هيئة مخصوصة بحيث تنال الراحتان الركبتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} وهو ركن بالإجماع لقوله تعالى: اركعوا واسجدوا، وحديث المسيء صلاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} وذهب الجمهور إلى أن الطمأنينة فيه فرض، وذهب الحنفية إلى أنها واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} والهيئة المجزئة أن ينحني حتى تبلغ الراحتان الركبتين، والأكمل أن يستوي الظهر والعنق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8975} ويرفع المصلي يديه عند تكبيرة الركوع عند الجمهور، ويكبر عند الركوع، وقال الحنفية يرفع اليدين عند الإحرام فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8977} ويشرع التسبيح في الركوع، وتختلف المذاهب في حكمه وعدده، وتكره القراءة في الركوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8979} ويكره للإمام تطويل الركوع انتظارا للداخل إذا شق على المأمومين، ويكره الانحناء لغير الله، وإن قصد التعظيم كفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8981}"
  en: "Rukuh (bowing) in the lexicon is inclining; in prayer it is lowering the head with the back bent in a fixed posture until the palms reach the knees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} It is a pillar by agreement, from the verse 'bow and prostrate' and the hadith of the one who prays badly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} The majority hold the calm in it obligatory; the Hanafis hold it a duty of lesser force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} The minimum is the bend until the palms reach the knees; the perfect form is the back and neck level. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8975} The majority have the hands raised at the bow and the takbir said as one goes down; the Hanafis raise the hands only at the opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8977} Glorification at the bow is a sunna; its number is disputed, and recitation of the Qur'an in the bow is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8979} An imam should not lengthen the bow to wait for a latecomer where it burdens the congregation, and bowing to a creature in honour is unlawful, and it is unbelief if meant as worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8981}"
  ur: "رکوع نماز کا رکن ہے؛ اس میں اطمینان جمہور کے نزدیک فرض ہے اور حنفی اسے واجب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} مخلوق کے سامنے تعظیم کے طور پر رکوع کرنا جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8981}"
