label:
  ar: "الركوع"
  en: "Rukuh (the bow in prayer): its ruling as a pillar, the calm in it, its posture, the raising of the hands, the glorifications, and the prohibition of bowing to a creature"
  ur: "رکوع"
  es: "Rukuh (la inclinación en la oración): su función como pilar, la calma que encierra, su postura, la elevación de las manos, las glorificaciones y la prohibición de inclinarse ante una criatura."
  fr: "Rukuh (l'inclinaison en prière): son rôle de pilier, le calme qu'elle inspire, la posture, le lever des mains, les glorifications et l'interdiction de s'incliner devant une créature"
  tr: "diz çökmüş"
  id: "berlutut"
summary:
  ar: "الركوع لغة الانحناء، وفي الصلاة طأطأة الرأس مع انحناء الظهر على هيئة مخصوصة بحيث تنال الراحتان الركبتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} وهو ركن بالإجماع لقوله تعالى: اركعوا واسجدوا، وحديث المسيء صلاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} وذهب الجمهور إلى أن الطمأنينة فيه فرض، وذهب الحنفية إلى أنها واجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} والهيئة المجزئة أن ينحني حتى تبلغ الراحتان الركبتين، والأكمل أن يستوي الظهر والعنق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8975} ويرفع المصلي يديه عند تكبيرة الركوع عند الجمهور، ويكبر عند الركوع، وقال الحنفية يرفع اليدين عند الإحرام فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8977} ويشرع التسبيح في الركوع، وتختلف المذاهب في حكمه وعدده، وتكره القراءة في الركوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8979} ويكره للإمام تطويل الركوع انتظارا للداخل إذا شق على المأمومين، ويكره الانحناء لغير الله، وإن قصد التعظيم كفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8981}"
  en: "Rukuh (bowing) in the lexicon is inclining; in prayer it is lowering the head with the back bent in a fixed posture until the palms reach the knees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} It is a pillar by agreement, from the verse 'bow and prostrate' and the hadith of the one who prays badly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} The majority hold the calm in it obligatory; the Hanafis hold it a duty of lesser force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} The minimum is the bend until the palms reach the knees; the perfect form is the back and neck level. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8975} The majority have the hands raised at the bow and the takbir said as one goes down; the Hanafis raise the hands only at the opening. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8977} Glorification at the bow is a sunna; its number is disputed, and recitation of the Qur'an in the bow is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8979} An imam should not lengthen the bow to wait for a latecomer where it burdens the congregation, and bowing to a creature in honour is unlawful, and it is unbelief if meant as worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8981}"
  ur: "رکوع نماز کا رکن ہے؛ اس میں اطمینان جمہور کے نزدیک فرض ہے اور حنفی اسے واجب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} مخلوق کے سامنے تعظیم کے طور پر رکوع کرنا جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8981}"
  es: "Rukuh (inclinación) en el léxico es inclinarse; en la oración es bajar la cabeza con la espalda doblada en una postura fija hasta que las palmas toquen las rodillas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} Es un pilar por acuerdo, del versículo 'inclínate y postra' y del hadiz de quien ora mal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} La mayoría sostiene que la calma en ella es obligatoria; los Hanafis la consideran un deber de menor fuerza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} El mínimo es la flexión hasta que las palmas alcancen las rodillas; la forma perfecta es la espalda y el cuello nivelados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8975} La mayoría tiene las manos levantadas en la reverencia y el takbir dicho al bajar; los hanafíes levantan las manos solo en la apertura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8977} La glorificación en el arco es una sunna; su número es disputado, y la recitación del Corán en el arco es desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8979} Un imán no debe alargar el arco para esperar a un rezagado, ya que esto supone una carga para la congregación, y la reverencia a una criatura en honor es ilícita, y es incredulidad si se pretende adorarla. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8980} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8981}"
  fr: "Le terme « rukuh » (inclinaison) désigne, dans le lexique, une inclinaison du corps; en prière, il s'agit de baisser la tête en gardant le dos courbé dans une posture fixe jusqu'à ce que les paumes des mains touchent les genoux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} C'est un pilier, de l'avis général, d'après le verset « incline-toi et prosterne-toi » et le hadith de celui qui prie mal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} La majorité considère le calme qui caractérise cette inclinaison comme une obligation; les hanafites, quant à eux, y voient une obligation de moindre importance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} La posture minimale consiste à fléchir les mains jusqu'à ce que les paumes atteignent les genoux; la posture parfaite exige que le dos et la nuque soient alignés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8975} La majorité des pratiquants lèvent les mains lors de l'inclinaison et prononcent le takbir en descendant; les hanafites ne lèvent les mains qu'à l'ouverture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8977} La glorification lors de la prosternation est une sunna; son nombre est sujet à controverse, et la récitation du Coran lors de la prosternation est déconseillée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8979} Un imam ne doit pas prolonger la prosternation pour attendre un retardataire, car cela gêne l'assemblée; se prosterner devant une créature en signe d'honneur est illicite, et c'est de l'incroyance si cela est fait dans un but d'adoration. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8981}"
  tr: "Ruku', eğilme ve dua ederken, başı belirli bir şekilde eğerek dizlerin dizlere ulaşacağı şekilde eğilmesi dilidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8972} Bu, Allah'ın dediği 'Eğil ve secde' ve namazına haksızlık edenin hadisi olarak oybirliğiyle kabul edilen bir sütundur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8973} Çoğunluk huzurun zorunlu olduğunu savunurken, Hanafiler bunun zorunlu olduğunu savunuyordu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8974} Segmentli form, avuç içleri dizlere kadar bükülür ve en tamamlanı, sırt ve boynu düzleştirmektir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8975} Dua eden kişi, cemaatin önünde eğilme açılış tekbirini söylerken ellerini kaldırır ve eğilirken takbir söyler. Hanefi okulu ellerini sadece ihram sırasında kaldırdığını söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8977} Tasbih eğilmede belirtilir, ancak okullar düzeni ve sayısı bakımından farklılık gösterir ve eğilirken okunma sevilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8979} İmamın içe doğru beklerken eğilmesini uzatması hoş karşılanmaz, eğer takipçiler için zorsa, Allah'tan başka kimseye eğilmek de hoş karşılanmaz, amaç saygı göstermek olsa bile, bu inançsızlıktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8980}"
  id: "Ruku' adalah bahasa membungkuk, dan dalam doa, menundukkan kepala dengan punggung ditekuk secara khusus sehingga lutut mencapai lutut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8972} Ini adalah tiang yang disepakati secara bulat seperti yang Allah katakan: 'Tunduk dan sujud,' serta hadis orang yang salah dalam doanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8973} Mayoritas berpendapat bahwa ketenangan adalah kewajiban di dalamnya, sementara para Hanafi memegangnya wajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8974} Bentuk tersegmentasi adalah membungkuk hingga telapak tangan mencapai lutut, dan yang paling lengkap adalah meluruskan punggung dan leher. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8975} Orang yang berdoa mengangkat tangan saat mengucapkan takbir pembuka membungkuk di depan jemaat, dan mengucapkan takbir saat membungkuk. Aliran Hanafi mengatakan dia hanya mengangkat tangan saat Ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.. 8977} Tasbih diwajibkan dalam membungkuk, tetapi aliran berbeda dalam aturan dan jumlahnya, dan pembacaan saat membungkuk tidak disukai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8978} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8979} Tidak disukai bagi imam untuk memperpanjang sujud sambil menunggu yang tertutup jika sulit bagi para pengikut, dan tidak suka membungkuk kepada siapa pun selain Allah, meskipun niatnya adalah untuk menghormati, yaitu ketidakpercayaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8981}"
