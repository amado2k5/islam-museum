summary:
  ar: "التراضي اتفاق العاقدين على إنشاء العقد دون إكراه، وهو أساس انعقاد العقود. ويختل بالإكراه والهزل والمواضعة والتغرير. وخلاف في لزوم العقد بالإيجاب والقبول أو بافتراق الأبدان: فالحنفية والمالكية يلزم بالإيجاب والقبول، والشافعية والحنابلة لا يلزم إلا بالافتراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930}"
  en: "Taradi is the agreement of the two parties to make a contract without compulsion, and it is the basis of valid contracts. It fails through compulsion, jest, pretence and deception. The Hanafis and Malikis hold a contract binding on offer and acceptance; the Shafi'is and Hanbalis hold it binding only when the parties part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930}"
