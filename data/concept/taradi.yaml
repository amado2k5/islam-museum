id: concept/taradi
class: concept
kind: legal
label:
  ar: "التراضي"
  en: "Taradi (mutual consent in a contract)"
  ur: "تراضی ⁦(باہمی رضامندی)⁩"
  es: "Taradi (consentimiento mutuo en un contrato)"
  fr: "Taradi (consentement mutuel dans un contrat)"
summary:
  ar: "التراضي اتفاق العاقدين على إنشاء العقد دون إكراه، وهو أساس انعقاد العقود. ويختل بالإكراه والهزل والمواضعة والتغرير. وخلاف في لزوم العقد بالإيجاب والقبول أو بافتراق الأبدان: فالحنفية والمالكية يلزم بالإيجاب والقبول، والشافعية والحنابلة لا يلزم إلا بالافتراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930}"
  en: "Taradi is the agreement of the two parties to make a contract without compulsion, and it is the basis of valid contracts. It fails through compulsion, jest, pretence and deception. The Hanafis and Malikis hold a contract binding on offer and acceptance; the Shafi'is and Hanbalis hold it binding only when the parties part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930}"
  es: "Taradi es el acuerdo de las dos partes para celebrar un contrato sin coacción, y es la base de los contratos válidos. Fracasa por coacción, broma, simulación y engaño. Los hanafíes y malikíes consideran que un contrato es vinculante tras la oferta y la aceptación; los shafiíes y hanbalíes lo consideran vinculante solo cuando las partes se separan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4930}"
  fr: "Le taradi est l'accord libre et éclairé entre les deux parties pour conclure un contrat, et il constitue le fondement de la validité des contrats. Il est caduc en cas de contrainte, de plaisanterie, de dol ou de tromperie. Les écoles hanafite et malikite considèrent qu'un contrat est contraignant dès l'offre et l'acceptation; les écoles chaféite et hanbalite le considèrent comme contraignant uniquement lorsque les parties se séparent."
  ur: "ترادی دونوں فریقین کا معاہدہ ہے کہ بغیر مجبوری کے معاہدہ کیا جائے، اور یہ درست معاہدوں کی بنیاد ہے۔ یہ مجبوری، مذاق، دکھاوا اور فریب کے ذریعے ناکام ہو جاتا ہے۔ حنفیہ اور مالکیوں کے نزدیک پیشکش اور قبولیت کا پابند ہے؛ شافعی اور حنبلی اسے صرف اس وقت پابند کرتے ہیں جب فریقین الگ ہوجائیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4927} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4928} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4929} {حوالہ: فقہ-معسویہ-کویتیہ-نور-v3 صفحہ4928} صفحہ 4930}"
