"summary":
  "ar": "هذه القروح إما أن تكون في الصدر وإما أن تكون في الحجاب وإما أن تكون في الرئة\
    \ وهذا القسم الأخير هو السل وإما أن تكون في القصبة وقد ذكرناها. وأسلم هذه القروح\
    \ قروح الصدر لأن جوهر الصدر أصغر وأجزاءه أصلب فلا يعظم فيها الشر ولأن الصديد لا\
    \ يبقى فيها بل يسيل إلى فضاء الصدر وليس كذلك حال الرئة ولأن حركته غير قوية محسوسة\
    \ كحركة الرئة بل يكاد أن يكون ساكناً لأنه لحمي واللحمي أقبل للالتحام. وأما قروح\
    \ الحجاب فإن النافذ فيها لا يلتحم ألبتة وغير النافذ إما أن يقع في الأجزاء العصبية\
    \ فلا يلتحم وإما أن يقع في الأجزاء اللحمية فيلتحم إن تدارك في الابتداء ولم يترك\
    \ أن يرم، وأما إذا تورمت أو أزمنت فلا تبرأ. وأما قروح الرئة فقد اختلفت الأطباء\
    \ في أنها تبرأ أو لا تبرأ فقال قوم إنها لا تبرأ البتة لأن الالتحام يفتقر إلى السكون\
    \ ولا سكون هناك، وجالينوس يخالفهم ويزعم أن الحركة وحدها لا تمنع الالتحام إن لم\
    \ تنصف إليها سائر الموانع والدليل على ذلك أن الحجاب أيضاً متحرك ومع ذلك فقد تبرأ\
    \ قروحه. وأما جالينوس نفسه فإن قوله في قروح الرئة هو إنها إن عرضت عن انحلال الفرد\
    \ ليس عن ورم أو عن تأكل من خلط أكال بل لعلة أخرى فما دام جرحها لم يتقيح بعد ولا\
    \ تورم فإنه قابل للبرء وكذلك ما كان من القروح التي يحدث فيها نفث ولم تتقيح، وما\
    \ كان عن ورم أو تأكل لم يقبل البرء لأن القرحة المنضجة المتقيحة حينئذ لا يمكن أن\
    \ تبرأ إلا بتنقية المدة وذلك بالسعال والسعال يزيد في توسع القرحة وخرقها والدغدغة\
    \ الكائنة منها تزيد في الوجع والوجع يزيد في جذب المواد إلى الناحية والأدوية المجففة\
    \ مانعة النفث والمنقية مرطبة ملينة للقرحة والكائنة عن خلط أكال لا تبرأ دون إصلاحه\
    \ وذلك لا يتأتى إلا في مدة يجب في مثلها إما تخرق القرحة ومصيرها ⁦(اللازم في مثل\
    \ هذا الموضع حمل السطر كما هو في النسخة)⁩ {cite:canon-ibn-sina-print-v2 p.354}"
  "en": "These ulcers are either in the chest, or in the diaphragm, or in the lung\
    \ — this last kind is consumption — or in the windpipe, which we have already\
    \ mentioned. The safest of these ulcers are the ulcers of the chest, for the chest's\
    \ substance is smaller and its parts harder, so the evil does not grow great in\
    \ them; and because the pus does not stay in them but drains into the chest cavity,\
    \ which is not the lung's case; and because its movement is not strong and sensible\
    \ like the lung's — it is almost still, being fleshy, and the fleshy is most ready\
    \ for adhesion. As for the diaphragm's ulcers: a penetrating one never heals at\
    \ all, and the non-penetrating either falls on the nervous parts and does not\
    \ heal, or falls on the fleshy parts and heals if it is caught at the start and\
    \ not left to fester — but if they swell or become chronic they do not heal. As\
    \ for the lung's ulcers, the physicians have differed whether they heal: some\
    \ said they never heal at all, for adhesion requires stillness and there is no\
    \ stillness there; Galen opposes them and holds that movement alone does not prevent\
    \ adhesion unless the other hindrances join it — the proof being that the diaphragm\
    \ also moves and yet its ulcers do heal. And Galen's own saying on the lung's\
    \ ulcers is that if they arise from a dissolution of continuity — not from a tumour\
    \ nor from the erosion of a corrosive humour, but from another cause — then so\
    \ long as the wound has not yet suppurated nor swollen it is receptive of cure;\
    \ likewise ulcers in which expectoration occurs without suppuration; while what\
    \ arises from a tumour or an erosion does not accept cure, for the ripened suppurated\
    \ ulcer can then only be healed by cleansing the matter, and that by the cough\
    \ — and the cough widens the ulcer and breaches it, the tickling it causes increases\
    \ the pain, the pain increases the drawing of matters to that region, the drying\
    \ drugs prevent expectoration, the cleansing ones moisten and soften the ulcer,\
    \ and the ulcer arising from a corrosive humour is not healed without its correction,\
    \ and that cannot be effected except over a time in which the like of it must\
    \ either breach the ulcer — and its outcome (the line is carried as printed in\
    \ the copy) {cite:canon-ibn-sina-print-v2 p.354}"
  "ur": "یہ زخم یا تو سینے میں ہوتے ہیں یا حجاب میں یا پھیپھڑے میں اور یہ آخری قسم\
    \ سل ہے یا نالی میں جس کا ذکر ہو چکا۔ ان میں سب سے محفوظ سینے کے زخم ہیں کیونکہ\
    \ سینے کا جوہر چھوٹا اور حصے سخت ہیں اس لیے شر انہیں زیادہ نقصان نہیں پہنچاتی\
    \ اور پیپ ان میں نہیں ٹھہرتی بلکہ سینے کی فضا میں بہہ جاتی ہے اور پھیپھڑے کی حالت\
    \ ایسی نہیں اور اس کی حرکت پھیپھڑے جیسی مضبوط محسوس نہیں بلکہ تقریباً ساکن ہے\
    \ کیونکہ وہ گوشتی ہے اور گوشتی التحام کے زیادہ قریب ہے۔ حجاب کے زخموں میں سے گہرا\
    \ زخم بالکل التحام نہیں پاتا اور غیر گہرا یا اعصابی حصوں میں پڑتا ہے تو التحام\
    \ نہیں پاتا یا گوشتی حصوں میں اور ابتداء میں سمبھال لیا جائے تو التحام پاتا ورنہ\
    \ اگر ورم یا پرانا ہو جائے تو شفا نہیں پاتا۔ اور پھیپھڑے کے زخموں میں اطباء اختلاف\
    \ کرتے ہیں کہ شفا پاتے ہیں یا نہیں بعض نے کہا بالکل نہیں کیونکہ التحام سکون چاہتا\
    \ ہے اور وہاں سکون نہیں جالینوس ان کی مخالفت کرتا ہے اور کہتا ہے کہ حرکت اکیلی\
    \ التحام نہیں روکتی اگر باقی رکاوٹیں اس کے ساتھ نہ ہوں اور دلیل یہ کہ حجاب بھی\
    \ متحرک ہے مگر اس کے زخم شفا پاتے ہیں۔ اور خود جالینوس کا قول یہ ہے کہ اگر زخم\
    \ انحلال الفرد سے ہو نہ ورم سے نہ کورا خلط کے گلانے سے بلکہ کسی اور علت سے تو\
    \ جب تک زخم نہ پیپ دار ہوا نہ ورم ہوا وہ شفا قبول کرتا ہے اور ایسے ہی وہ زخم جن\
    \ میں نفث ہو اور تقيح نہ ہو اور جو ورم یا گلانے سے ہو وہ شفا نہیں پاتا کیونکہ\
    \ پکی پیپ والی قرحة صرف مادہ کی تنقیہ سے شفا پا سکتی ہے اور وہ کھانسی سے ہوتی\
    \ ہے اور کھانسی زخم کو چوڑا اور پھاڑتی ہے اور اس سے ہونے والی خشکاری درد بڑھاتی\
    \ ہے اور درد مواد کی طرف کھینچ بڑھاتا ہے اور خشک کرنے والی ادویہ نفث روکتی ہیں\
    \ اور صاف کرنے والی قرحة کو تر اور نرم کرتی ہیں اور کورا خلط سے ہونے والی اصلاح\
    \ کے بغیر شفا نہیں پاتی اور وہ مدت میں ہی ممکن ہے جس میں ایسی قرحة پھٹ جائے اور\
    \ اس کا انجام ⁦(اس مقام پر سطر جوں نسخے میں ہے رکھا گیا)⁩ {cite:canon-ibn-sina-print-v2\
    \ p.354}"
  "es": "Estas úlceras se localizan en el tórax, el diafragma, los pulmones (este último tipo es la tisis) o la tráquea, como ya hemos mencionado. Las más seguras son las del tórax, pues su tejido es más pequeño y sus partes más duras, por lo que la infección no se desarrolla con facilidad; además, el pus no se acumula en ellas, sino que drena hacia la cavidad torácica, a diferencia de los pulmones; y su movimiento es menos intenso y perceptible, ya que, al ser carnoso, es casi inmóvil, y la carne es más propensa a la adherencia. En cuanto a las úlceras del diafragma: una penetrante nunca cicatriza, y una no penetrante, o bien afecta a las partes nerviosas y no cicatriza, o bien afecta a las partes carnosas y cicatriza si se detecta a tiempo y no se deja supurar; pero si se inflaman o se cronifican, no cicatrizan. En cuanto a las úlceras pulmonares, los médicos han discrepado sobre si sanan: algunos decían que nunca sanan, pues la adhesión requiere quietud y allí no hay quietud; Galeno se opone a ellos y sostiene que el movimiento por sí solo no impide la adhesión a menos que se le unan otros impedimentos; la prueba es que el diafragma también se mueve y, sin embargo, sus úlceras sanan. Y el propio dicho de Galeno sobre las úlceras pulmonares es que si surgen de una disolución de la continuidad —no de un tumor ni de la erosión de un humor corrosivo, sino de otra causa— entonces mientras la herida no haya supurado ni inflamado, es susceptible de curación; asimismo, las úlceras en las que se produce expectoración sin supuración; mientras que lo que surge de un tumor o una erosión no admite curación, pues la úlcera supurante madura solo puede sanar limpiando la materia, y eso mediante la tos; y la tos ensancha la úlcera y la perfora, el cosquilleo que causa aumenta el dolor, el dolor aumenta la acumulación de materia en esa región, los medicamentos secantes impiden la expectoración, los limpiadores humedecen y ablandan la úlcera, y la úlcera que surge de un humor corrosivo no sana sin su corrección, y eso no puede efectuarse excepto con el tiempo en que algo similar debe perforar la úlcera; y su resultado (la línea se reproduce tal como está impresa en la copia) {cite:canon-ibn-sina-print-v2 p.354}"
  "fr": "Ces ulcères se situent soit dans la poitrine, soit dans le diaphragme, soit dans le poumon (ce dernier type étant la tuberculose), soit dans la trachée, comme nous l'avons déjà mentionné. Les ulcères de la poitrine sont les moins graves, car la substance de la poitrine y est plus fine et ses parties plus dures, ce qui limite le développement de l'infection. De plus, le pus ne stagne pas dans la poitrine mais s'écoule dans la cavité thoracique, contrairement à celle du poumon. Enfin, les mouvements de la paroi thoracique sont moins importants et moins sensibles que ceux du poumon; la paroi diaphragmatique, étant charnue, est plus sujette aux adhérences. Quant aux ulcères du diaphragme: un ulcère pénétrant ne guérit jamais, tandis qu'un ulcère non pénétrant, soit atteint les parties nerveuses et ne guérit pas, soit atteint les parties charnues et guérit s'il est traité dès son apparition et n'est pas laissé à s'envenimer. Cependant, s'ils s'enflamment ou deviennent chroniques, ils ne guérissent pas. Concernant les ulcères pulmonaires, les médecins ont divergé quant à leur guérison: certains affirmaient qu’ils ne guérissaient jamais, car l’adhérence requiert l’immobilité, laquelle fait défaut au niveau du poumon; Galien s’y opposait, soutenant que le mouvement seul ne suffit pas à empêcher l’adhérence, à moins que d’autres obstacles ne s’y ajoutent – la preuve en étant que le diaphragme, lui aussi mobile, guérit pourtant de ses ulcères. Quant aux ulcères pulmonaires, Galien lui-même affirmait que s’ils résultent d’une rupture de la continuité – non d’une tumeur ni de l’érosion par une humeur corrosive, mais d’une autre cause –, alors, tant que la plaie n’a pas suppuré ni enflé, elle est réceptive à la guérison; il en va de même pour les ulcères où l’expectoration survient sans suppuration. Tandis que ce qui résulte d'une tumeur ou d'une érosion est incurable, car l'ulcère suppuré et mûr ne peut alors guérir que par nettoyage, et cela par la toux — or la toux élargit l'ulcère et le rompt, les picotements qu'elle provoque augmentent la douleur, la douleur accroît l'afflux de matières vers cette région, les médicaments asséchants empêchent l'expectoration, les médicaments purifiants humidifient et ramollissent l'ulcère, et l'ulcère résultant d'une humeur corrosive ne guérit pas sans correction, et cela ne peut être effectué qu'au terme d'un laps de temps pendant lequel un élément similaire doit soit rompre l'ulcère — et son résultat (la ligne est reproduite telle qu'imprimée dans la copie) {cite:canon-ibn-sina-print-v2 p.354}"
  "tr": "Bu yaralar göğüste, diyaframda veya akciğerlerde olabilir. Son tip tüberkülozdur veya daha önce belirttiğimiz gibi trakeada olabilir. Bu yaralar göğüs ülserleri olarak kabul edilir çünkü göğsün çekirdeği daha küçüktür ve parçaları daha serttir, bu yüzden zarar daha büyük değildir. İti içeride kalmaz, akciğer boşluğuna akar, akciğerlerde bu durum geçerli değildir. Hareketi güçlü değildir ve akciğerinki gibi fark edilir, ancak neredeyse hareketsizdir çünkü etlidir ve etli ülserler daha çok kaynamaya yatkındır. Diyafram ülserleri ise hiç kaynamaz, nüfuz edenler ya sinir bölgelerinde bulunur ve kaynaşmaz, ya da başta çözülür ve çıkarılmazsa etli bölgelere düşer ve kaynaşır. Ancak şişerler veya uzarlarsa iyileşmezler. Akciğer ülserleri konusunda ise doktorlar iyileşip iyileşmedikleri konusunda farklı görüşlere sahiptir. Bazıları, birleşmenin orada durgunluk ve dinlenme eksikliği nedeniyle hiç iyileşmediğini söyler. Galen ise buna katılmaz ve sadece hareketin birleşmeyi engellemediğini, diğer tüm engeller gerekçelendirilmedikçe belirtir. Bunun kanıtı, örtünün de hareketli olması, ancak ülserlerinin iyileşmiş olmasıdır. Galen'in kendisi için ise, akciğer ülserleri kişinin dejenerasyonuna neden oluyorsa, bunun bir tümörden ya da yiyecekleri karıştırmaktan yemekten değil, başka bir nedenle olduğunu belirtir. Yara henüz çözülmemiş veya şişmemişse tedavi edilebilir. Aynı şekilde, ablasyon yapılmayan kabarık yaralar ile tümör veya yeme sonucu oluşan yaralar iyileşmeye kabul edilmez, çünkü olgun, arınmış bir ülser ancak öksürme yoluyla arındırarak iyileşebilir ve öksürme artar Ülserin genişlemesi ve nüfuz etmesi ile bunun neden olduğu gıdıklanma ağrıyı artırır ve ağrı maddelerin yan tarafa çekilmesini artırır. Üflemeyi önleyen kuru ilaçlar, arıtıcı, nemlendirici ve yumuşatan ilaçlar, iyileşmeyen yiyeceklerin karıştırılmasıyla oluşur. Bu ancak ülserin nüfuz edilmesi gereken ve kaderinin gerçekleştiği dönemde sağlanabilir (versiyondaki gibi satırı okunması gereken bir yerde gereklidir) {cite:canon-ibn-sina-print-v2 s.354}"
  "id": "Luka ini bisa berada di dada, diafragma, atau paru-paru. Jenis terakhir adalah tuberkulosis, atau bisa berada di trakea, seperti yang telah kami sebutkan. Luka ini dianggap sebagai tukak dada karena inti dada lebih kecil dan bagian-bagiannya lebih keras, sehingga tidak ada bahaya yang lebih besar. Nanah tidak tetap di dalam tetapi mengalir ke rongga dada, yang tidak terjadi pada paru-paru. Gerakannya tidak kuat dan terlihat seperti paru-paru, tetapi hampir diam karena berdaging, dan berdaging lebih rentan untuk menyatu. Untuk ulkus diafragma, yang penetrasi sama sekali tidak menyatu, dan yang menembus biasanya terjadi di bagian saraf dan tidak menyatu, atau jatuh ke bagian daging dan menyatu jika awalnya sembuh dan tidak dibiarkan untuk diangkat. Namun, jika bengkak atau lama, mereka tidak sembuh. Adapun tukak paru-paru, dokter berbeda pendapat apakah mereka sembuh atau tidak. Beberapa mengatakan mereka tidak sembuh sama sekali karena fusi tidak memiliki ketenangan dan tidak ada istirahat di sana. Galen tidak setuju dan berpendapat bahwa gerakan saja tidak mencegah penyatuan kecuali semua penghalang lain dibenarkan. Buktinya menunjukkan bahwa tirai juga dapat digerakkan, namun luka lambungnya telah sembuh. Adapun Galen sendiri, pernyataannya tentang tukak paru-paru adalah bahwa jika luka menyebabkan degenerasi individu, itu bukan karena tumor atau makan dari campuran makanan, melainkan karena alasan lain. Selama luka belum diambuskan atau bengkak, luka tersebut masih dapat disembuhkan. Demikian pula, luka yang memiliki puff yang tidak mengalami ablasi, dan yang disebabkan oleh tumor atau makan tidak diterima untuk sembuh, karena luka yang sudah matang dan murni hanya dapat sembuh dengan memurnikan durasinya, yaitu melalui batuk, dan batuk meningkat Ekspansi dan penetrasi tukak serta geli yang ditimbulkannya meningkatkan rasa sakit, dan rasa sakit meningkatkan daya tarik zat ke samping. Obat kering yang mencegah tiupan tukak dapat dibersihkan, melembapkan dan melunakkan tukak lambung, dan disebabkan oleh pencampuran makanan yang tidak sembuh tanpa perbaikan. Hal ini hanya dapat dilakukan selama periode di mana tukak harus ditembus dan nasibnya (perlu membaca baris seperti pada versi di tempat seperti ini) {cite:canon-ibn-sina-print-v2 hlm.354}"
