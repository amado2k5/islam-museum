  en: "Sheikh Omar Abdelkafy holds that public money is a trust in the hands of the ruler and official, and that accepting gifts because of one's office comes close to bribery {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:15:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep12 00:57:30}."
