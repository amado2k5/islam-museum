id: concept/hadaya-al-ummal
class: concept
kind: legal
label:
  ar: "هدايا العمال"
  en: "Gifts to officials (hadaya al-ummal) and the rule against them"
  ur: "عمال کو دیے گئے تحفے ⁦(ہدایا العمال)⁩"
  es: "Regalos a funcionarios (hadaya al-ummal) y la norma que los prohíbe."
  fr: "Les cadeaux aux fonctionnaires (hadaya al-ummal) et la règle qui les interdit"
  tr: "İşçi hediyeleri"
  id: "Hadiah pekerja"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن المال العام أمانة في يد الحاكم والموظف، وأن قبول الهدايا بسبب المنصب يقرب من الرشوة، ومحاسبة المسؤول من علامات الصلاح. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:15:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep12 00:57:30}"
  en: "Sheikh Omar Abdelkafy holds that public money is a trust in the hands of the ruler and official, and that accepting gifts because of one's office comes close to bribery {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:15:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep12 00:57:30}."
  ur: "شیخ عمر عبدالکافی کے نزدیک سرکاری مال حاکم اور اہلکار کے پاس امانت ہے، اور منصب کی وجہ سے تحفے قبول کرنا رشوت کے قریب ہے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:15:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep12 00:57:30}۔"
  es: "El jeque Omar Abdelkafy sostiene que el dinero público es un fideicomiso en manos del gobernante y del funcionario, y que aceptar regalos debido al cargo que se ocupa se acerca al soborno {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:15:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep12 00:57:30}."
  fr: "Le cheikh Omar Abdelkafy soutient que l'argent public est un dépôt entre les mains du dirigeant et du fonctionnaire, et qu'accepter des cadeaux en raison de sa fonction s'apparente à de la corruption {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:15:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep12 00:57:30}."
  tr: "Şeyh Ömer Abdulkafi, kamu fonlarının hükümdar ve çalışanın elinde bir emanet olduğuna, pozisyon nedeniyle hediye kabul etmenin rüşvetle yakın olduğuna, memurun hesap verebilir kılmasının ise doğruluk işareti olduğuna inanır. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:15:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep12 00:57:30}"
  id: "Sheikh Omar Abdul Kafi percaya bahwa dana publik adalah kepercayaan di tangan penguasa dan pegawai, dan menerima hadiah karena posisi hampir sama dengan suap, dan menuntut pertanggungjawaban pejabat adalah tanda kebenaran. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep05 00:15:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep12 00:57:30}"
