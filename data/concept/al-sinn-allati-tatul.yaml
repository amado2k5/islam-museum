id: concept/al-sinn-allati-tatul
class: concept
kind: scientific
label:
  ar: السن التي تطول
  en: The tooth that grows long
  fr: "La dent qui s’allonge"
  ur: لمبا ہوتا دانت
  es: "El diente que crece largo"
  tr: "Yaşlanma"
  id: "Penuaan"
summary:
  ar: السن التي تطول تؤخذ بالأصبعين أو بالآلة القابضة ثم تبرد بالمبرد ثم يستن بما وصف من القوابض ⁦(الأسماء مطروحة والأخذ والمبرد محمولان على أنهما وصف الكتاب لا عملية)⁩ {cite:canon-ibn-sina-print-v2 p.278}
  en: The tooth that grows long is taken with the two fingers or the gripping instrument, then brought down with the file, then rubbed with the astringent tooth-stick he described (the names left out; the gripping and the file carried as the book's description, not a procedure) {cite:canon-ibn-sina-print-v2 p.278}
  fr: "Le livre décrit comment la dent qui s’allonge était saisie entre deux doigts ou avec un instrument de préhension, puis raccourcie à la lime et frottée avec le bâtonnet dentaire astringent qu’il décrit (les noms ne sont pas repris ; la prise de la dent et le limage sont rapportés comme une description du livre, non comme une procédure) {cite:canon-ibn-sina-print-v2 p.278}"
  ur: لمبا ہوتا دانت دو انگلیوں یا پکڑنے والے اوزار سے پکڑا جاتا ہے پھر ریتی سے گھٹایا جاتا ہے پھر اس کے بیان کردہ قابض مسواک سے ملیا جاتا ہے ⁦(نام مطروح؛ پکڑنا اور ریتی کتاب کے وصف پر محمول، طریقہ نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.278}
  es: "El diente que crece demasiado se toma con los dos dedos o con el instrumento de agarre, luego se baja con la lima y se frota con el palillo dental astringente que describió (se omiten los nombres; el agarre y la lima se mencionan en el libro, no como un procedimiento) {cite:canon-ibn-sina-print-v2 p.278}"
  tr: "Uzun uzamış bir diş iki parmakla veya kavrama makinesiyle alınır, sonra soğutucu ile soğutulur, ardından tutucuların tarif ettiği şekilde kullanılır (isimler çıkarılır, alma ve kırpma kitabı tanımlar, bir süreç olarak değil) {cite:canon-ibn-sina-print-v2 s.278}"
  id: "Gigi panjang yang memanjang diambil dengan dua jari atau mesin kopling, kemudian didinginkan dengan pendingin, dan kemudian digunakan sesuai dengan penjelasan pemegang (nama dihapus, buku mendefinisikan pencabutan dan pemangkasan, bukan sebagai proses) {cite:canon-ibn-sina-print-v2 hlm.278}"
