summary:
  ar: "في الفصل السابع يقول ابن سينا إن لأكثر الأمراض أربعة أوقات: الابتداء والتزايد والمنتهى والانحطاط، لكل منها زمان محسوس وحكم مخصوص، وما خرج عنها فهو من أوقات الصحة {cite:canon-ibn-sina-print-v1 p.109}."
  en: "In the seventh chapter Ibn Sina says most diseases have four times: beginning, increase, peak and decline, each a sensible stretch of time with its own rule, and what falls outside them belongs to the times of health {cite:canon-ibn-sina-print-v1 p.109}."
