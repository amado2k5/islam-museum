id: concept/times-of-disease
class: concept
kind: scientific
label: { ar: "أوقات المرض عند ابن سينا", en: "The times of a disease in the Canon", ur: "قانون میں بیماری کے اوقات", es: "Los tiempos de una enfermedad en el Canon", fr: "Les temps d'une maladie dans le Canon", tr: "İbn Sina'ya göre Hastalık Zamanları", id: "Masa sakit menurut Ibn Sina" }
summary:
  ar: "في الفصل السابع يقول ابن سينا إن لأكثر الأمراض أربعة أوقات: الابتداء والتزايد والمنتهى والانحطاط، لكل منها زمان محسوس وحكم مخصوص، وما خرج عنها فهو من أوقات الصحة {cite:canon-ibn-sina-print-v1 p.109}."
  en: "In the seventh chapter Ibn Sina says most diseases have four times: beginning, increase, peak and decline, each a sensible stretch of time with its own rule, and what falls outside them belongs to the times of health {cite:canon-ibn-sina-print-v1 p.109}."
  es: "En el séptimo capítulo, Ibn Sina dice que la mayoría de las enfermedades tienen cuatro etapas: comienzo, aumento, pico y declive, cada una un lapso de tiempo sensato con su propia regla, y lo que queda fuera de ellas pertenece a los tiempos de salud {cite:canon-ibn-sina-print-v1 p.109}."
  fr: "Dans le septième chapitre, Ibn Sina dit que la plupart des maladies ont quatre temps: début, augmentation, pic et déclin, chacun une période de temps raisonnable avec sa propre règle, et ce qui se situe en dehors de ces temps appartient aux temps de santé {cite:canon-ibn-sina-print-v1 p.109}."
  ur: "ساتویں باب میں ابن سینا کہتے ہیں کہ اکثر بیماریوں کے چار مرتبہ ہوتے ہیں: ابتداء، اضافہ، عروج اور زوال، ہر ایک اپنے اپنے اصول کے ساتھ وقت کا ایک معقول حصہ ہے، اور جو کچھ ان سے باہر آتا ہے وہ صحت کے زمانے سے تعلق رکھتا ہے۔"
  tr: "Yedinci bölümde İbn Sina, çoğu hastalığın dört dönemi olduğunu belirtir: başlangıç, artış, son ve azalma. Her birinin belirli algılanabilir bir zamanı ve belirli bir hükmü vardır ve bundan çıkan bir sağlık dönemi olarak kabul edilir {atıf:kanon-ibn-sina-print-v1 s.109}."
  id: "Dalam bab tujuh, Ibn Sina menyatakan bahwa sebagian besar penyakit memiliki empat periode: awal, meningkat, akhir, dan menurun. Masing-masing memiliki waktu yang dapat dirasakan dan aturan tertentu, dan apa yang muncul darinya dianggap sebagai periode kesehatan {cite:canon-ibn-sina-print-v1 hlm.109}."
