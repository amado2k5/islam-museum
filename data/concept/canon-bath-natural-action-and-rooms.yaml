summary:
  ar: "يفتتح ابن سينا الفصل التاسع عشر من التعليم الثاني، في موجبات الاستحمام والتضحي بالشمس والاندفان في الرمل والتمرغ فيه والاستنقاع في الأدهان ورش الماء على الوجه، بتحديد الفعل الطبيعي للحمام وهو التسخين بهوائه أو الترطيب بمائه، وبيان طبع بيوته الثلاثة {cite:canon-ibn-sina-print-v1 p.140}."
  en: "Ibn Sina opens chapter 19 of the second lesson, on the causes that call for bathing, basking in the sun, burial in sand and rolling in it, soaking in oils and sprinkling water on the face, by naming the natural action of the bath, warming through its air or moistening through its water, and the nature of its three rooms {cite:canon-ibn-sina-print-v1 p.140}."
