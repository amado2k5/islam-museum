summary:
  ar: "يعرض شكيب أرسلان في فصل قصير رده على كتاب أوروبي عن التسامح، فيذكر أن الأوروبيين في زمن الحروب الصليبية لم يكونوا أقل تعصباً من الأتراك في زمن حصار فيينا سنة 1683، ويشير إلى ما نسبه إلى الصليبيين عند فتح القدس، وإلى ما جرى للمسلمين في الأندلس وصقلية. ويقول إنه لا يريد أن ينسب إلى صاحب الكتاب التحامل، وإنه يعدّه من أكثر المؤلفين الأوروبيين إنصافاً، لكنه يرى أن الأوروبي يغفل عن هذه الوقائع. هذا عرض لمحاجة المؤلف، وأرقامه في هذه الوقائع تحتاج إلى مراجعة."
  en: "A short piece in which Arslan answers a European author on tolerance. He argues that Europeans in the Crusades and after were no less intolerant than the Ottomans at the siege of Vienna in 1683, citing the Crusader capture of Jerusalem and the end of Muslim rule in Sicily and al-Andalus. He says he does not accuse the author of bias and regards him as fair, but that Europeans overlook these events. This is Arslan's rejoinder; his figures for these events need checking."
  es: "Un breve artículo en el que Arslan responde a un autor europeo sobre la tolerancia. Argumenta que los europeos durante las Cruzadas y posteriormente no fueron menos intolerantes que los otomanos durante el asedio de Viena en 1683, citando la conquista de Jerusalén por los cruzados y el fin del dominio musulmán en Sicilia y al-Ándalus. Afirma que no acusa al autor de parcialidad y lo considera imparcial, pero que los europeos suelen pasar por alto estos acontecimientos. Esta es la réplica de Arslan; sus cifras sobre estos eventos deben verificarse."
  fr: "Dans un court texte, Arslan répond à un auteur européen sur la question de la tolérance. Il soutient que les Européens, pendant et après les croisades, n'étaient pas moins intolérants que les Ottomans lors du siège de Vienne en 1683, citant la prise de Jérusalem par les croisés et la fin de la domination musulmane en Sicile et en al-Andalus. Il précise qu'il n'accuse pas l'auteur de partialité et le considère comme impartial, mais que les Européens ont tendance à oublier ces événements. Voici la réplique d'Arslan; ses chiffres concernant ces événements restent à vérifier."
  ur: "ایک مختصر تحریر جس میں ارسلان ایک یورپی مصنف کو رواداری پر جواب دیتا ہے۔ اس کا استدلال ہے کہ صلیبی جنگوں میں اور اس کے بعد کے یورپی باشندے 1683 میں ویانا کے محاصرے میں عثمانیوں سے کم عدم برداشت نہیں تھے، انہوں نے یروشلم پر صلیبی قبضے اور سسلی اور الاندلس میں مسلم حکمرانی کے خاتمے کا حوالہ دیتے ہوئے کہا۔ ان کا کہنا ہے کہ وہ مصنف پر تعصب کا الزام نہیں لگاتے اور انہیں منصفانہ سمجھتے ہیں، لیکن یورپی ان واقعات کو نظر انداز کرتے ہیں۔ یہ ارسلان کا جواب ہے۔ ان واقعات کے لئے اس کے اعداد و شمار کی جانچ پڑتال کی ضرورت ہے."
