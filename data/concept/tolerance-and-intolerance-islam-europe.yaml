summary:
  ar: "يعرض شكيب أرسلان في فصل قصير رده على كتاب أوروبي عن التسامح، فيذكر أن الأوروبيين في زمن الحروب الصليبية لم يكونوا أقل تعصباً من الأتراك في زمن حصار فيينا سنة 1683، ويشير إلى ما نسبه إلى الصليبيين عند فتح القدس، وإلى ما جرى للمسلمين في الأندلس وصقلية. ويقول إنه لا يريد أن ينسب إلى صاحب الكتاب التحامل، وإنه يعدّه من أكثر المؤلفين الأوروبيين إنصافاً، لكنه يرى أن الأوروبي يغفل عن هذه الوقائع. هذا عرض لمحاجة المؤلف، وأرقامه في هذه الوقائع تحتاج إلى مراجعة."
  en: "A short piece in which Arslan answers a European author on tolerance. He argues that Europeans in the Crusades and after were no less intolerant than the Ottomans at the siege of Vienna in 1683, citing the Crusader capture of Jerusalem and the end of Muslim rule in Sicily and al-Andalus. He says he does not accuse the author of bias and regards him as fair, but that Europeans overlook these events. This is Arslan's rejoinder; his figures for these events need checking."
