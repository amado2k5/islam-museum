summary:
  ar: "خانق النمر في الكتاب نبات ينقل الكتاب وصفه عن ديسقوريدوس، له قضبان دقاق طوال عسرة الرض وورق شبيه بورق اللبلاب إلا أنه ألين وأحد طرفا ثقيل الرائحة رطب برطوبة لزجة صفراء، وله حمل شبيه بغلف الباقلاء في طول أصبع وفي جوفه بزر صغار صلب أسود؛ ويقول الكتاب إن ورقه يقتل الذئاب والكلاب والثعالب والنمور ويضعف قواها، ولا يستعمل داخلا ولا خارجا، وهو سم قتال {cite:canon-ibn-sina-print-v1 p.711}"
  en: "Khaniq al-namir is in the book a plant whose description is taken from Dioscorides, with thin long stalks hard to crush and a leaf like the ivy leaf but softer and sharper at the tip, heavy in smell and wet with a sticky yellow moisture, and a fruit like the pods of the bean, a finger in length, with small hard black seeds inside; the book says that its leaf kills wolves, dogs, foxes and the nimr (leopard or tiger) and weakens their strength, that it is used neither inside nor outside, and that it is a deadly poison {cite:canon-ibn-sina-print-v1 p.711}"
  ur: "خانق النمر کتاب میں ایک نبات ہے جس کا وصف دیسقوریدوس سے نقل ہے، باریک لمبی ٹہنیاں جن کا کوٹنا مشکل ہے اور پتا لبلاب کے پتے جیسا مگر زیادہ نرم اور سرے پر زیادہ تیز، بھاری بو والا اور چپچپی زرد تری سے تر، اور پھل باقلا کی پھلیوں جیسا، ایک انگلی کی لمبائی کا، جس کے اندر چھوٹے سخت سیاہ بیج ہیں؛ کتاب کہتی ہے کہ اس کا پتا بھیڑیوں، کتوں، لومڑیوں اور چیتوں کو مار دیتا ہے اور ان کی قوت کمزور کرتا ہے، نہ اندر استعمال ہوتا ہے نہ باہر، اور یہ مہلک زہر ہے {cite:canon-ibn-sina-print-v1 p.711}۔"
