label:
  ar: "الصَّاع"
  en: "Sa' (the measure of dry goods in law: its size, the bath, zakat al-fitr and the related measures)"
  es: "Sa' (la medida de los bienes secos en la ley: su tamaño, el bath, el zakat al-fitr y las medidas relacionadas)"
  fr: "Sa' (la mesure des marchandises sèches en droit: sa taille, le bath, la zakat al-fitr et les mesures connexes)"
  ur: "ص' ⁦(شریعت میں خشک مال کا پیمانہ: اس کا سائز، غسل، فطرانہ اور متعلقہ اقدامات)⁩"
summary:
  ar: "الصاع مكيال معروف، وهو أربعة أمداد. وجمهور الفقهاء يرون أنه خمسة أرطال وثلث بالعراقي، واستدلوا بقوله لكعب بن عجرة تصدق بفرق بين ستة مساكين، والفرق ثلاثة آصع. وأبو حنيفة يرى ثمانية أرطال. ويجزئ الاغتسال بالصاع إذا حصل الإسباغ، وسنه الشافعية والحنابلة. وصدقة الفطر صاع من بر أو شعير أو تمر أو زبيب عند الجمهور، ونصف صاع من بر عند الحنفية والصحابة المذكورين، والصاع من تمر أو شعير أو زبيب عند الحنفية في الزبيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10277} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10280} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10281}"
  en: "The sa' is a known dry measure equal to four mudds. Most jurists say it is five and a third Iraqi pounds, citing the Prophet's words to Ka'b ibn 'Ujra: give a farq between six poor, the farq being three sa's. Abu Hanifa says eight pounds. A bath with a sa' suffices if it covers the whole body, and the Shafi'is and Hanbalis call it a sunna. Zakat al-fitr is a sa' of wheat, barley, dates or raisins according to the majority, half a sa' of wheat according to the Hanafis and certain Companions, and a full sa' of dates, barley or raisins for the Hanafis as regards raisins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10277} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10280} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10281}"
  es: "El sa' es una medida seca conocida equivalente a cuatro mudds. La mayoría de los juristas dicen que son cinco libras y un tercio iraquíes, citando las palabras del Profeta a Ka'b ibn 'Ujra: «Dad un farq entre seis pobres, siendo el farq tres sa's». Abu Hanifa dice ocho libras. Un baño con un sa' es suficiente si cubre todo el cuerpo, y los shafi'ís y hanbalíes lo consideran una sunna. El zakat al-fitr es un sa' de trigo, cebada, dátiles o pasas según la mayoría, medio sa' de trigo según los hanafíes y ciertos Compañeros, y un sa' completo de dátiles, cebada o pasas para los hanafíes en lo que respecta a las pasas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10277} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10278} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10279} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10280} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10281}"
  fr: "Le sa' est une mesure de poids sec connue, équivalente à quatre mudds. La plupart des juristes estiment sa valeur à cinq livres et un tiers irakiennes, citant les paroles du Prophète à Ka'b ibn 'Ujra: « Donne un farq à six pauvres », le farq étant de trois sa's. Abu Hanifa parle de huit livres. Un bain d'un sa' suffit s'il couvre tout le corps; les écoles chaféite et hanbalite le considèrent comme une sunna. La zakat al-fitr correspond à un sa' de blé, d'orge, de dattes ou de raisins secs selon la majorité, à un demi-sa' de blé selon les hanafites et certains Compagnons, et à un sa' entier de dattes, d'orge ou de raisins secs pour les hanafites en ce qui concerne les raisins secs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10277} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10280} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10281}"
  ur: "صاع ایک خشک پیمانہ ہے جو چار مٹی کے برابر ہے۔ اکثر فقہاء کہتے ہیں کہ یہ پانچ اور تہائی عراقی پونڈ ہے، کعب بن عجرہ کے بارے میں نبی کے اس قول کا حوالہ دیتے ہوئے: چھ مسکینوں کے درمیان ایک فرق دو، فرق تین صاع ہے۔ ابو حنیفہ آٹھ پونڈ کہتے ہیں۔ ایک صاع کا غسل اگر پورے جسم کو ڈھانپ لے تو کافی ہے اور شافعی اور حنبلی اسے سنت کہتے ہیں۔ فطرانہ جمہور کے نزدیک گندم، جو، کھجور یا کشمش کا ایک صاع، احناف اور بعض صحابہ کے نزدیک آدھا صاع گیہوں اور حنفیہ کے نزدیک کھجور، جو یا کشمش کا پورا صاع ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10276} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10277} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10278} p.10279} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10280} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ10281}"
