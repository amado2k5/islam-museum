id: concept/measure-sa
class: concept
kind: legal
label:
  ar: "الصَّاع"
  en: "Sa' (the measure of dry goods in law: its size, the bath, zakat al-fitr and the related measures)"
summary:
  ar: "الصاع مكيال معروف، وهو أربعة أمداد. وجمهور الفقهاء يرون أنه خمسة أرطال وثلث بالعراقي، واستدلوا بقوله لكعب بن عجرة تصدق بفرق بين ستة مساكين، والفرق ثلاثة آصع. وأبو حنيفة يرى ثمانية أرطال. ويجزئ الاغتسال بالصاع إذا حصل الإسباغ، وسنه الشافعية والحنابلة. وصدقة الفطر صاع من بر أو شعير أو تمر أو زبيب عند الجمهور، ونصف صاع من بر عند الحنفية والصحابة المذكورين، والصاع من تمر أو شعير أو زبيب عند الحنفية في الزبيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10277} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10280} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10281}"
  en: "The sa' is a known dry measure equal to four mudds. Most jurists say it is five and a third Iraqi pounds, citing the Prophet's words to Ka'b ibn 'Ujra: give a farq between six poor, the farq being three sa's. Abu Hanifa says eight pounds. A bath with a sa' suffices if it covers the whole body, and the Shafi'is and Hanbalis call it a sunna. Zakat al-fitr is a sa' of wheat, barley, dates or raisins according to the majority, half a sa' of wheat according to the Hanafis and certain Companions, and a full sa' of dates, barley or raisins for the Hanafis as regards raisins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10276} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10277} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10280} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10281}"
