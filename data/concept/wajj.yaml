label:
  ar: "وَجّ"
  en: "Wajj (iris root, per the editor)"
  ur: "وج ⁦(زنبق کی جڑ، حاشیہ کے مطابق)⁩"
  es: "Wajj (raíz de iris, según el editor)"
  fr: "Wajj (racine d'iris, selon l'éditeur)"
summary:
  ar: "الوجّ أصول نبات كالبردي ينبت في الحياض والمياه، حريفة، محلّلة للنفخ والرياح، تنفع من وجع السن وثقل اللسان، وتنفع الكبد البارد والمعدة، وتفتح سدد الأحشاء. {cite:canon-ibn-sina-print-v1 p.453}"
  en: "Wajj is the root of a papyrus-like plant that grows in ponds and waters; it is pungent, resolves wind and bloating, helps toothache and a heavy tongue, helps a cold liver and stomach, and opens blockages of the viscera. {cite:canon-ibn-sina-print-v1 p.453}"
  ur: "وج ایک پودے کی جڑ ہے جو کاغذ کے پودے جیسا ہے اور تالابوں اور پانی میں اگتا ہے؛ یہ تیز ہے، ہوا اور پھولنا تحلیل کرتی ہے، دانت کے درد اور بھاری زبان میں مفید ہے، ٹھنڈے جگر اور معدے کو فائدہ دیتی ہے، اور اعضا کی رکاوٹ کھولتی ہے۔ {cite:canon-ibn-sina-print-v1 p.453}"
  es: "El wajj es la raíz de una planta parecida al papiro que crece en estanques y aguas; es picante, alivia los gases y la hinchazón, ayuda con el dolor de muelas y la lengua pesada, ayuda con el hígado y el estómago fríos, y desbloquea las obstrucciones de las vísceras. {cite:canon-ibn-sina-print-v1 p.453}"
  fr: "Le wajj est la racine d'une plante ressemblant au papyrus qui pousse dans les étangs et les cours d'eau; son odeur est piquante, elle soulage les flatulences et les ballonnements, les maux de dents et la sensation de langue lourde, les affections du foie et de l'estomac, et débloque les viscères. {cite:canon-ibn-sina-print-v1 p.453}"
