  ur: "تریاق (زہر کا تریاق اور اس کا استعمال)"
summary:
  ar: "الترياق دواء يستعمل لدفع السم، ويكون في أنواع، وقد يدخل فيه لحم الحيات. والحنابلة لا يبيحون أكله ولا شربه إذا كان فيه لحم الحية لأنه محرم، والحنفية والشافعية في الظاهر يمنعون التداوي بالمحرم، وجوزه بعضهم عند العلم بالشفاء وعدم الدواء الآخر. والمالكية يجيزون أكل لحم الحية المذكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5004}"
  en: "Tiryaq is a medicine used against poison, of several kinds, and it may contain viper flesh. The Hanbalis do not allow eating or drinking it when the flesh of a viper is in it, since the flesh is forbidden and no forbidden thing may be used for cure. The Hanafis and Shafi'is forbid it in the apparent view, though some allow it when a cure is known and no other remedy exists. The Malikis allow eating a viper that is slaughtered properly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5004}"
