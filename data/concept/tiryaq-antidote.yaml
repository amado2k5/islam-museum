label:
  ar: "الترياق"
  en: "Tiryaq (antidote compound, and whether it may be taken)"
  ur: "تریاق ⁦(زہر کا تریاق اور اس کا استعمال)⁩"
  es: "Tiryaq (compuesto antídoto y si se puede tomar)"
  fr: "Tiryaq (composé antidote et indication de son utilisation)"
summary:
  ar: "الترياق دواء يستعمل لدفع السم، ويكون في أنواع، وقد يدخل فيه لحم الحيات. والحنابلة لا يبيحون أكله ولا شربه إذا كان فيه لحم الحية لأنه محرم، والحنفية والشافعية في الظاهر يمنعون التداوي بالمحرم، وجوزه بعضهم عند العلم بالشفاء وعدم الدواء الآخر. والمالكية يجيزون أكل لحم الحية المذكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5004}"
  en: "Tiryaq is a medicine used against poison, of several kinds, and it may contain viper flesh. The Hanbalis do not allow eating or drinking it when the flesh of a viper is in it, since the flesh is forbidden and no forbidden thing may be used for cure. The Hanafis and Shafi'is forbid it in the apparent view, though some allow it when a cure is known and no other remedy exists. The Malikis allow eating a viper that is slaughtered properly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5004}"
  es: "El tiryaq es un medicamento utilizado contra venenos de diversos tipos y puede contener carne de víbora. Los hanbalíes no permiten comerlo ni beberlo cuando contiene carne de víbora, ya que esta está prohibida y nada prohibido puede usarse para curar. Los hanafíes y shafiíes lo prohíben en principio, aunque algunos lo permiten cuando se conoce una cura y no existe otro remedio. Los malikíes permiten comer una víbora sacrificada adecuadamente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5004}"
  fr: "Le tiryaq est un remède utilisé contre les poisons de toutes sortes et peut contenir de la chair de vipère. Les hanbalites interdisent d'en manger ou d'en boire lorsqu'il contient de la chair de vipère, car cette chair est interdite et aucun remède interdit ne peut être utilisé à des fins thérapeutiques. Les hanafites et les chaféites l'interdisent également, bien que certains l'autorisent lorsqu'un remède est connu et qu'il n'existe aucun autre traitement. Les malikites autorisent la consommation d'une vipère abattue selon le rite rituel."
  ur: "تریاق زہر کے خلاف استعمال ہونے والی دوا ہے، کئی قسم کی، اور اس میں سانپ کا گوشت ہو سکتا ہے۔ حنبلی اس کے کھانے یا پینے کی اجازت نہیں دیتے جب اس میں سانپ کا گوشت ہو، کیونکہ گوشت حرام ہے اور کوئی بھی حرام چیز علاج کے لیے استعمال نہیں ہو سکتی۔ حنفیہ اور شافعیہ ظاہری طور پر اس سے منع کرتے ہیں، حالانکہ بعض اس کی اجازت اس وقت دیتے ہیں جب علاج معلوم ہو اور کوئی دوسرا علاج موجود نہ ہو۔ مالکی ایک سانپ کھانے کی اجازت دیتے ہیں جسے صحیح طریقے سے ذبح کیا گیا ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5003}"
