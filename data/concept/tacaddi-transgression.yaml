id: concept/tacaddi-transgression
class: concept
kind: legal
label:
  ar: "التعدي"
  en: "Ta'addi (transgression against persons, property, honour and the state, and the transfer of a cause)"
  ur: "تعدی (زیادتی: مال، جان، عزت اور انتقالِ علت)"
summary:
  ar: "التعدي الظلم ومجاوزة الحق، وله معنيان: الاعتداء على حق الغير، وانتقال الحكم إلى محل آخر. وهو بجميع أنواعه حرام، ويوجب الإثم والضمان، وقد يوجب الحد أو التعزير، فيضمن المغصوب والمتلف والوديعة إن فرط فيها أو تعدى عليها، والرهن والعارية حسب الخلاف، والوكيل أمين. ويوجب التعدي على النفس القصاص أو الدية، ويحرم التعدي على العرض ويبيح الدفاع عنه. وتعدي العلة هو انتقالها إلى الفروع، والسراية في الإيقاد بقدر ما يتعدى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5403}"
  en: "Ta'addi is injustice and overstepping of right. It has two senses: attack on another's right, and the transfer of a ruling to another place. Every kind is forbidden and carries sin and liability, and may bring a penalty or discipline. Usurpation, destruction and theft oblige return or the value; a depositee is liable only for negligence or wrong; a pledge and a loan are disputed; an agent is trusted. Attack on a person requires retaliation or blood-money; attack on honour is forbidden and may be resisted. The transfer of a cause (ta'addi al-'illa) is its extension to branches, and fire spreading beyond one's land is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5403}"
