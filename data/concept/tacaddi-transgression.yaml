id: concept/tacaddi-transgression
class: concept
kind: legal
label:
  ar: "التعدي"
  en: "Ta'addi (transgression against persons, property, honour and the state, and the transfer of a cause)"
  ur: "تعدی ⁦(زیادتی: مال، جان، عزت اور انتقالِ علت)⁩"
  es: "Ta'addi (transgresión contra personas, propiedades, honor y el Estado, y transferencia de una causa)"
  fr: "Ta'addi (transgression contre les personnes, les biens, l'honneur et l'État, et transfert d'une cause)"
  tr: "İhlal"
  id: "Pelanggaran"
summary:
  ar: "التعدي الظلم ومجاوزة الحق، وله معنيان: الاعتداء على حق الغير، وانتقال الحكم إلى محل آخر. وهو بجميع أنواعه حرام، ويوجب الإثم والضمان، وقد يوجب الحد أو التعزير، فيضمن المغصوب والمتلف والوديعة إن فرط فيها أو تعدى عليها، والرهن والعارية حسب الخلاف، والوكيل أمين. ويوجب التعدي على النفس القصاص أو الدية، ويحرم التعدي على العرض ويبيح الدفاع عنه. وتعدي العلة هو انتقالها إلى الفروع، والسراية في الإيقاد بقدر ما يتعدى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5403}"
  en: "Ta'addi is injustice and overstepping of right. It has two senses: attack on another's right, and the transfer of a ruling to another place. Every kind is forbidden and carries sin and liability, and may bring a penalty or discipline. Usurpation, destruction and theft oblige return or the value; a depositee is liable only for negligence or wrong; a pledge and a loan are disputed; an agent is trusted. Attack on a person requires retaliation or blood-money; attack on honour is forbidden and may be resisted. The transfer of a cause (ta'addi al-'illa) is its extension to branches, and fire spreading beyond one's land is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5403}"
  es: "Ta'addi es injusticia y extralimitación del derecho. Tiene dos sentidos: ataque al derecho ajeno y transferencia de una ley a otro lugar. Todo tipo de transgresión está prohibida y conlleva pecado y responsabilidad, pudiendo acarrear castigo o disciplina. La usurpación, la destrucción y el robo obligan a la devolución del valor; el depositario solo es responsable por negligencia o falta; una prenda y un préstamo son objeto de disputa; se confía en un agente. El ataque a una persona exige represalia o indemnización; el ataque al honor está prohibido y puede ser resistido. La transferencia de una causa (ta'addi al-'illa) es su extensión a otras ramas, y el fuego que se propaga más allá del propio territorio conlleva responsabilidad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5397} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5398} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5399} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5400} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5401} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5402} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5403}"
  fr: "Le ta'addi désigne l'injustice et l'abus de droit. Il a deux sens: l'atteinte au droit d'autrui et le transfert d'une décision à un autre lieu. Toute forme de ta'addi est interdite et entraîne péché et responsabilité, pouvant donner lieu à une peine ou une sanction disciplinaire. L'usurpation, la destruction et le vol obligent à restituer le bien ou sa valeur; un dépositaire n'est responsable qu'en cas de négligence ou de faute; un gage et un prêt sont contestables; un mandataire est digne de confiance. Une attaque contre une personne exige des représailles ou le prix du sang; une atteinte à l'honneur est interdite et peut faire l'objet d'une résistance. Le transfert d'une cause (ta'addi al-'illa) en est l'extension à des ramifications, et un incendie se propageant au-delà de ses terres engage sa responsabilité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5403}"
  ur: "تقدیر ناانصافی اور حق سے تجاوز ہے۔ اس کے دو حواس ہیں: دوسرے کے حق پر حملہ، اور حکم کو دوسری جگہ منتقل کرنا۔ ہر قسم حرام ہے اور گناہ اور ذمہ داری کا حامل ہے، اور سزا یا نظم و ضبط لا سکتا ہے۔ غصب، تباہی اور چوری واجب الادا واپسی یا قیمت؛ جمع کرنے والا صرف غفلت یا غلط کا ذمہ دار ہے۔ عہد اور قرض میں اختلاف ہے۔ ایک ایجنٹ قابل اعتماد ہے. کسی شخص پر حملہ کرنے کے لیے انتقامی کارروائی یا خونریزی کی ضرورت ہوتی ہے۔ عزت پر حملہ حرام ہے اور اس کی مزاحمت کی جا سکتی ہے۔ کسی وجہ کی منتقلی ⁦(تعدی الضلع)⁩ شاخوں تک اس کی توسیع ہے، اور کسی کی زمین سے باہر پھیلنے والی آگ ذمہ دار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5397} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5398} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5399} صفحہ 5400} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.5401} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ5402} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ5403}"
  tr: "Saldırganlık, haksızlık ve hakların ihlalidir ve iki anlamı vardır: başkasının hakkına müdahale etmek ve kararı başka bir yere taşımak. Her biçiminde yasaktır, günah ve sorumluluk getirir ve ayrıca ceza veya takdire bağlı ceza ile sonuçlanabilir. Gasp edilen, zarar gören ve depozito, ihmal veya müdahale eden kişiler, anlaşmazlığa göre ipotek ve ödünç alınan malları da sorumludur ve vekil güvenilirdir. Kişiye karşı saldırganlık intikam veya kan parası gerektirir, onura karşı ihlali yasaklar ve savunmaya izin verir. Davanın ihlali, davaların dallara aktarılması ve ateşin bu sınırı aştığı ölçüde bulaşmasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5403}"
  id: "Agresi adalah ketidakadilan dan pelanggaran hak, dan memiliki dua makna: melanggar hak orang lain dan memindahkan keputusan ke tempat lain. Itu dilarang dalam segala bentuknya, yang mengandung dosa dan tanggung jawab, dan juga dapat mengakibatkan hukuman atau hukuman yang tidak diterima. Yang direbut, yang dirusak, dan deposit bertanggung jawab jika mereka mengabaikan atau melanggar hak tersebut, serta menggadaikan dan meminjam properti sesuai dengan perselisihan, dan agen tersebut dapat dipercaya. Agresi terhadap seseorang memerlukan pembalasan atau uang darah, melarang pelanggaran terhadap kehormatan, dan memungkinkan pembelaannya. Pelanggaran terhadap sebab adalah pemindahan ke cabang, dan transmisi api sejauh api itu melebihi batas tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5399} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5400} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5403}"
