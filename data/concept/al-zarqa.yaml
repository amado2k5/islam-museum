id: "concept/al-zarqa"
class: "concept"
kind: "scientific"
label:
  ar: "الزرقة في العين"
  en: "Blueness of the eye (zarqa)"
  ur: "آنکھ کی زرقت"
summary:
  ar: "الزرقة تعرض إما بسبب في الطبقات وإما بسبب في الرطوبات، فإن كانت البيضية صافية قريبة الوضع إلى خارج ومعتدلة المقدار أو قليلته كانت العين بسببها زرقاء، والسبب في الطبقات في العنبية فإن كانت سوداء كانت العين بسببها كحلاء وإن كانت زرقاء صيرت العين زرقاء، والعنبية تصير زرقاء إما لعدم النضج ولهذا تكون عيون الأطفال زرقاً وشهلاً وإما لتحلل الرطوبة التي يتبعها الصبغ وهذه زرقة عن يبس غالب وبها تشهل أعين المرضى والمشايخ، والشهلة تحدث من اجتماع أسباب الكحل وأسباب الزرقة ⁦(ظن أمباذقلس في النارية منقول كقول منسوب إليه)⁩ {cite:canon-ibn-sina-print-v2 p.191} {cite:canon-ibn-sina-print-v2 p.192}"
  en: "Blueness occurs either from a cause in the coats or in the humours: if the vitreous is clear, near to the outside and moderate or little in amount, the eye is blue from it; the cause in the coats is in the uvea — if black the eye is kohl-dark from it, if blue it makes the eye blue; the uvea becomes blue either from unripeness — hence children's eyes are blue and shuhl — or from dissolution of the dye-following moisture, a blueness from dominant dryness by which the sick and aged get shuhl eyes; the shahla arises from the meeting of the kohl causes and the blue causes ⁦(Empedocles' supposition on the fiery element transmitted as a saying attributed to him)⁩ {cite:canon-ibn-sina-print-v2 p.191} {cite:canon-ibn-sina-print-v2 p.192}"
  ur: "زرقت یا تہوں کے سبب سے عرض ہوتی ہے یا رطوبتوں کے سبب سے: اگر بیضیہ صاف، باہر کے قریب اور معتدل یا کم مقدار ہو تو آنکھ اسی سے نیلی ہوتی ہے؛ اور تہوں کا سبب عنبیہ میں ہے — اگر سیاہ ہو تو آنکھ اس سے کہلی ہوتی ہے اور نیلی ہو تو آنکھ نیلی کرتی ہے؛ عنبیہ یا تو عدم پختگی سے نیلی ہوتی ہے اور اسی لیے بچوں کی آنکھیں نیلی اور شہل ہوتی ہیں، یا صبغ کے تابع رطوبت کے تحلل سے — یہ غالب خشکی کی زرقت ہے جس سے مریضوں اور بوڑھوں کی آنکھیں شہل ہوتی ہیں؛ اور شہلہ کہل کے اسباب اور زرقت کے اسباب کے اجتماع سے پیدا ہوتا ہے ⁦(امباذقلس کا ناریہ کے بارے میں گمان اس کی طرف منسوب قول کے طور پر منقول)⁩ {cite:canon-ibn-sina-print-v2 p.191} {cite:canon-ibn-sina-print-v2 p.192}"
