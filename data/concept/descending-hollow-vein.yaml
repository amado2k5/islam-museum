id: concept/descending-hollow-vein
class: concept
kind: scientific
label: { ar: "الأجوف النازل عند ابن سينا", en: "The descending hollow vein in the Canon", ur: "قانون میں اترنے والا اجوف", es: "La vena hueca descendente en el Canon", fr: "La veine creuse descendante du Canon" }
summary:
  ar: "في الفصل الخامس ينتقل ابن سينا إلى الجزء النازل من الأجوف، فيذكر شعبه إلى الكليتين والطالعين والأنثيين والصلب، ثم انقسامه عند آخر الفقار إلى قسمين نحو الفخذين {cite:canon-ibn-sina-print-v1 p.92}."
  en: "In the fifth chapter Ibn Sina turns to the descending part of the hollow vein and names its branches to the kidneys, the two renal veins, the testicles and the spine, then its division at the end of the vertebrae into two parts toward the thighs {cite:canon-ibn-sina-print-v1 p.92}."
  es: "En el quinto capítulo, Ibn Sina pasa a la parte descendente de la vena hueca y nombra sus ramas hacia los riñones, las dos venas renales, los testículos y la columna vertebral, luego su división al final de las vértebras en dos partes hacia los muslos {cite:canon-ibn-sina-print-v1 p.92}."
  fr: "Dans le cinquième chapitre, Ibn Sina se tourne vers la partie descendante de la veine creuse et nomme ses branches vers les reins, les deux veines rénales, les testicules et la colonne vertébrale, puis sa division à l'extrémité des vertèbres en deux parties vers les cuisses {cite:canon-ibn-sina-print-v1 p.92}."
  ur: "پانچویں باب میں ابن سینا کھوکھلی رگ کے نزول والے حصے کی طرف متوجہ ہوتا ہے اور اس کی شاخوں کو گردے یعنی گردوں کی دو رگوں، خصیے اور ریڑھ کی ہڈی کا نام دیتا ہے، پھر اس کے فقرے کے آخر میں رانوں کی طرف دو حصوں میں تقسیم ہوتے ہیں۔"
