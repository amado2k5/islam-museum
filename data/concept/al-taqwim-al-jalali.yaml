summary:
  ar: "تقويم شمسي فارسي أُصلح في عهد السلطان جلال الدولة ملكشاه السلجوقي على يد جماعة من المنجمين منهم عمر الخيام، وأُسّس على السنة الشمسية الحقيقية، وتُدخل فيه الكبيسة وفق قاعدة الأربع السنين مع تعديل بالسنة الثالثة والثلاثين. يذكره الفرغاني في تعليق غوليوس على أسماء الشهور الفارسية {cite:farghani-elements-astronomy p. 276}{cite:farghani-elements-astronomy p. 278}."
  en: "The Jalali (Malikshahi) solar calendar, reformed under the Seljuq sultan Malik-Shah with a group of astronomers including Omar Khayyam. It is described in Golius's note on the Persian months, not in the author's own text."
  es: "El calendario solar Jalali (Malikshahi), reformado bajo el sultán selyúcida Malik-Shah con un grupo de astrónomos, entre ellos Omar Khayyam, se describe en la nota de Golius sobre los meses persas, no en el texto del propio autor."
  fr: "Le calendrier solaire Jalali (Malikshahi), réformé sous le sultan seldjoukide Malik-Shah avec un groupe d'astronomes dont Omar Khayyam, est décrit dans la note de Golius sur les mois persans, et non dans le texte de l'auteur lui-même."
