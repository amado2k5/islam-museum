id: concept/andalusi-lead-glass
class: concept
kind: term
label: { ar: "زجاج الرصاص الأندلسي ⁦(شقندة)⁩", en: "Andalusi lead glass (Šaqunda)", ur: "اندلسی سیسے والا شیشہ ⁦(شقندہ)⁩" }
summary:
  ar: "زجاج غني بالرصاص صنع في قرطبة في أواخر القرن الثامن أو مطلع التاسع من نفايات المعادن، كشفت عنه تحاليل زجاج ربض شقندة، وتعده نادين شيبيل ابتكارًا أندلسيًا سبق صناعة زجاج رماد النباتات المحلية {cite:schibille-islamic-glass-2022 p. 184} {cite:schibille-islamic-glass-2022 p. 185} {cite:schibille-islamic-glass-2022 p. 235}."
  en: "High-lead glass made at Córdoba in the late eighth or early ninth century from metallurgical waste, revealed by analyses of glass from the suburb of Šaqunda; Nadine Schibille sees it as an Andalusi innovation preceding local plant-ash glassmaking {cite:schibille-islamic-glass-2022 p. 184} {cite:schibille-islamic-glass-2022 p. 185} {cite:schibille-islamic-glass-2022 p. 235}."
  ur: "آٹھویں صدی کے آخر یا نویں کے آغاز میں قرطبہ میں دھاتی فضلے سے بنا زیادہ سیسے والا شیشہ، جو شقندہ کے شیشے کے تجزیوں سے سامنے آیا؛ نادین شیبل اسے مقامی راکھ والی شیشہ سازی سے پہلے کی اندلسی ایجاد سمجھتی ہیں {cite:schibille-islamic-glass-2022 p. 185}."
