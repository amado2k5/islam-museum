  en: "Kamashir (a kind of Athamanta-like plant)"
  ur: "کماشیر"
summary:
  ar: "كماشير في أحواله كالجاوشير لكنه أقوى بكثير، وهو عند الكتاب حار يابس في الثانية بقوة، مذيب محلل ملطف، يدر البول والطمث، ويسقط الجنين، وليس له نظير في إسهال المائية."
  en: "Kamashir is like jawshir in its properties but much stronger. The book classes it as strongly hot and dry in the second degree, dissolving, resolving and thinning. It brings on urine and the menses, expels the foetus, and has no equal in purging watery matter."
  ur: "کماشیر کی خاصیتیں جاوشیر جیسی ہیں مگر بہت زیادہ قوی ہیں۔ کتاب اسے دوسرے درجے میں قوت کے ساتھ گرم اور خشک، گھولنے، تحلیل کرنے اور پتلا کرنے والا بتاتی ہے۔ یہ پیشاب اور حیض لاتا، جنین کو خارج کرتا، اور پانی جیسی رطوبت کو خارج کرنے میں اس کا کوئی ثانی نہیں۔"
