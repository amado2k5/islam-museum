id: concept/zij-sabi-moon-faster-or-slower-by-quadrant-of-anomaly
class: concept
kind: scientific
label: { ar: "زيادة سير القمر ونقصانه بحسب ربع الخاصة", en: "The Moon faster or slower according to the quadrant of its anomaly", ur: "چاند کی رفتار کا زیادہ یا کم ہونا خاصے کے ربع کے مطابق", es: "La Luna se mueve más rápido o más lento según el cuadrante de su anomalía." }
summary:
  ar: "إذا كانت الخاصة المعدّلة أقل من قد فالقمر زائد في السير، وإذا كانت أكثر فالقمر ناقص؛ وكذلك إذا كانت الخاصة في ربع معين كان سيره أقل من سيره الأوسط، وفي ربع آخر أكثر منه، والشمس على هذا الأسلوب أيضاً. {cite:zij-sabi-nallino-byblion p.112}."
  en: "If the corrected anomaly is less than a certain figure, the Moon is faster than its mean motion; if it is more, the Moon is slower. Likewise when the anomaly falls in one quadrant the Moon's motion is less than its mean, and in another quadrant more; the Sun follows the same pattern. {cite:zij-sabi-nallino-byblion p.112}."
  ur: "اگر تعدیل شدہ خاصہ ایک معین عدد سے کم ہو تو چاند اپنی اوسط حرکت سے تیز ہوتا ہے، اور زیادہ ہو تو سست؛ اسی طرح جب خاصہ ایک ربع میں ہو تو چاند کی حرکت اوسط سے کم ہوتی ہے، اور دوسرے ربع میں زیادہ؛ سورج کا بھی یہی انداز ہے۔ {cite:zij-sabi-nallino-byblion p.112}۔"
  es: "Si la anomalía corregida es menor que un valor determinado, la Luna se mueve más rápido que su velocidad media; si es mayor, se mueve más despacio. Del mismo modo, cuando la anomalía se encuentra en un cuadrante, el movimiento de la Luna es menor que su velocidad media, y en otro cuadrante, mayor; el Sol sigue el mismo patrón. {cite:zij-sabi-nallino-byblion p.112}."
