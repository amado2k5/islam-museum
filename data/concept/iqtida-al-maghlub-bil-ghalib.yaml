id: concept/iqtida-al-maghlub-bil-ghalib
class: concept
kind: term
label: { ar: "اقتداء المغلوب بالغالب", en: "The conquered imitating the conqueror" }
summary:
  ar: "من أشهر قواعد ابن خلدون أن المغلوب مولع أبداً بالاقتداء بالغالب في شعاره وزيه ونحلته وسائر أحواله وعوائده، والسبب أن النفس أبداً تعتقد الكمال في من غلبها وانقادت إليه إما لنظرها بالكمال بما وقر عندها من تعظيمه أو لما تغالط به من أن انقيادها ليس لغلب طبيعي إنما هو لكمال الغالب، فإذا غالطت بذلك واتصل لها حصل اعتقاداً فانتحلت جميع مذاهب الغالب وتشبهت به، وأن الأمة إذا غلبت وصارت في ملك غيرها أسرع إليها الفناء {cite:muqaddima-ibn-khaldun p. 144-145}."
  en: "The defeated adopt their victors' dress, manners and creeds, fancying them perfected — and conquest hastens a nation's extinction {cite:muqaddima-ibn-khaldun p. 144-145}."
wings: [ideas]
sources: [source/muqaddima-ibn-khaldun]
