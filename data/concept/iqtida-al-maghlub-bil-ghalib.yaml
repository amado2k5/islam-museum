id: concept/iqtida-al-maghlub-bil-ghalib
class: concept
kind: term
label: { ar: "اقتداء المغلوب بالغالب", en: "The conquered imitating the conqueror", es: "Los conquistados imitando al conquistador", fr: "Les vaincus imitent les conquérants", ur: "فاتح کی تقلید کرنے والا", tr: "Yenilginin örneğini takip etmek", id: "Mengikuti contoh yang kalah" }
summary:
  ar: "من أشهر قواعد ابن خلدون أن المغلوب مولع أبداً بالاقتداء بالغالب في شعاره وزيه ونحلته وسائر أحواله وعوائده، والسبب أن النفس أبداً تعتقد الكمال في من غلبها وانقادت إليه إما لنظرها بالكمال بما وقر عندها من تعظيمه أو لما تغالط به من أن انقيادها ليس لغلب طبيعي إنما هو لكمال الغالب، فإذا غالطت بذلك واتصل لها حصل اعتقاداً فانتحلت جميع مذاهب الغالب وتشبهت به، وأن الأمة إذا غلبت وصارت في ملك غيرها أسرع إليها الفناء {cite:muqaddima-ibn-khaldun p. 144-145}."
  en: "The defeated adopt their victors' dress, manners and creeds, fancying them perfected — and conquest hastens a nation's extinction {cite:muqaddima-ibn-khaldun p. 144-145}."
  es: "Los vencidos adoptan la vestimenta, los modales y las creencias de sus vencedores, creyendo que son perfectos, y la conquista acelera la extinción de una nación {cite:muqaddima-ibn-khaldun p. 144-145}."
  fr: "Les vaincus adoptent les vêtements, les manières et les croyances de leurs vainqueurs, les imaginant parfaits — et la conquête hâte l'extinction d'une nation {cite:muqaddima-ibn-khaldun p. 144-145}."
  ur: "شکست خوردہ اپنے فاتحوں کے لباس، آداب اور عقائد کو اپناتے ہیں، انہیں کامل تصور کرتے ہیں - اور فتح ایک قوم کی نابودی کو تیز کر دیتی ہے۔ 144-145}۔"
  tr: "İbn Haldun'un en ünlü ilkelerinden biri, yenilen kişinin amblemi, kıyafeti, görgü kuralları ve tüm durum ve geleneklerinde her zaman baskın olanı taklit etmeyi sevmesidir. Bunun nedeni, ruhun her zaman yendiği ve ona boyun eğdiği kişilerde mükemmelliğe inanmasıdır; ya değer verdiği şeyde mükemmelliği bir saygı olarak gördüğü için ya da teslimiyetin doğal yenilgi değil, baskın olanın mükemmelliği olduğuna yanlışlıkla inandığı için. Eğer hata yapar ve buna ulaşırsa, bir inanç gelişir, bu da egemen olanın tüm öğretilerine ve onu taklit etmeye yol açar. Bir millet yenilip başkalarının yönetimi altına düştüğünde, hızla yok edilir {atıf:mukaddima-ibn-khaldun, s. 144-145}."
  id: "Salah satu prinsip paling terkenal Ibn Khaldun adalah bahwa orang yang kalah selalu suka meniru dominan dalam lambang, pakaian, tata krama, dan semua keadaan serta kebiasaan mereka. Alasannya adalah jiwa selalu percaya pada kesempurnaan pada mereka yang dikalahkan dan tunduk kepadanya, baik karena memandang kesempurnaan dalam apa yang dihargainya sebagai penghormatan atau karena secara keliru percaya bahwa penyerahan bukanlah kekalahan alami melainkan kesempurnaan dominan. Jika ia salah dan mencapainya, sebuah kepercayaan berkembang, mengarah pada semua doktrin dominan dan menirunya. Ketika sebuah bangsa dikalahkan dan jatuh di bawah kekuasaan orang lain, ia dengan cepat dihancurkan {cite:muqaddima-ibn-khaldun, hlm. 144-145}."
