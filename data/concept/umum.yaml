label:
  ar: "العُمُوم"
  en: "Generality (umum) in the sources of law and what it covers"
  ur: "عموم"
  es: "Generalidad (umum) en las fuentes del derecho y lo que abarca."
  fr: "Généralité (umum) des sources du droit et de son champ d'application"
summary:
  ar: "العموم لغة مصدر من عم يعم، ومعناه الشمول والتناول {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875}. وعرّفه بعض الأصوليين بأنه إحاطة الأفراد دفعة، وعرفه المازري بأنه القول المشتمل على شيئين فصاعداً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875}. والعام لفظ يتناول أفراداً متفقة الحدود على سبيل الشمول، والخصوص ضد العموم، والمشترك لفظ له معنيان أو أكثر على سبيل البدل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. وذهب جمهور الأصوليين إلى أن اللفظ العام يوجب الحكم فيما يتناوله ما لم يقم دليل على خلافه، واختلفوا في أحكام التخصيص وغيرها في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}."
  en: "In the lexicon, 'umum is the act of covering and including, from 'amma, to cover. Some usulis define it as the inclusion of individuals at once; al-Mazari defines a general statement as one that includes two things or more {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875}. The general term (amm) is a word that applies to individuals of agreed limits in full, the particular (khusus) is its opposite, and the shared term (mushtarak) has two or more meanings used alternately {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. The majority of usulis hold that a general text establishes its ruling over everything it covers unless a proof says otherwise; the rules of exception and its disputes are treated in the legal-theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}."
  es: "En el léxico, 'umum es el acto de cubrir e incluir, de 'amma, cubrir. Algunos usulis lo definen como la inclusión de individuos a la vez; al-Mazari define una declaración general como aquella que incluye dos o más cosas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875}. El término general (amm) es una palabra que se aplica a individuos de límites acordados en su totalidad, el particular (khusus) es su opuesto, y el término compartido (mushtarak) tiene dos o más significados usados alternativamente {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. La mayoría de los usulis sostienen que un texto general establece su regla sobre todo lo que cubre a menos que una prueba diga lo contrario; Las reglas de excepción y sus controversias se tratan en el apéndice de teoría jurídica {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}."
  fr: "Dans le lexique, 'umum désigne l'action de couvrir et d'inclure, dérivé de 'amma, qui signifie « couvrir ». Certains usulis le définissent comme l'inclusion simultanée d'individus; al-Mazari définit une affirmation générale comme une affirmation qui inclut deux choses ou plus {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875}. Le terme général (amm) s'applique pleinement aux individus dont les limites sont convenues, le terme particulier (khusus) est son contraire, et le terme partagé (mushtarak) possède deux significations ou plus, utilisées alternativement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. La majorité des usulis estiment qu'un texte général établit sa règle sur tout ce qu'il couvre, sauf preuve contraire. Les règles d’exception et leurs litiges sont traités dans l’annexe de théorie juridique {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}."
