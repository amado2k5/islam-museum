label:
  ar: "العُمُوم"
  en: "Generality (umum) in the sources of law and what it covers"
  ur: "عموم"
summary:
  ar: "العموم لغة مصدر من عم يعم، ومعناه الشمول والتناول {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875}. وعرّفه بعض الأصوليين بأنه إحاطة الأفراد دفعة، وعرفه المازري بأنه القول المشتمل على شيئين فصاعداً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875}. والعام لفظ يتناول أفراداً متفقة الحدود على سبيل الشمول، والخصوص ضد العموم، والمشترك لفظ له معنيان أو أكثر على سبيل البدل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. وذهب جمهور الأصوليين إلى أن اللفظ العام يوجب الحكم فيما يتناوله ما لم يقم دليل على خلافه، واختلفوا في أحكام التخصيص وغيرها في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}."
  en: "In the lexicon, 'umum is the act of covering and including, from 'amma, to cover. Some usulis define it as the inclusion of individuals at once; al-Mazari defines a general statement as one that includes two things or more {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875}. The general term (amm) is a word that applies to individuals of agreed limits in full, the particular (khusus) is its opposite, and the shared term (mushtarak) has two or more meanings used alternately {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}. The majority of usulis hold that a general text establishes its ruling over everything it covers unless a proof says otherwise; the rules of exception and its disputes are treated in the legal-theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11876}."
