summary:
  ar: "الفلسفة في الحضارة الإسلامية؛ كان ابن باجة من فلاسفة الإسلام ومنسوباً إلى مذهب الحكماء {cite:al-aalam p. 868}، وعُني ابن رشد بكلام أرسطو فترجمه إلى العربية وصنّف فيه نحو خمسين كتاباً {cite:al-aalam p. 849}."
  en: "Philosophy in Islamic civilisation; Ibn Bajja was counted among the philosophers of Islam, and Ibn Rushd devoted himself to Aristotle, translating him into Arabic and writing some fifty works {cite:al-aalam p. 849}."
  es: "Filosofía en la civilización islámica; Ibn Bajja fue contado entre los filósofos del Islam, e Ibn Rushd se dedicó a Aristóteles, traduciéndolo al árabe y escribiendo unas cincuenta obras {cite:al-aalam p. 849}."
  fr: "La philosophie dans la civilisation islamique; Ibn Bajja était compté parmi les philosophes de l'Islam, et Ibn Rushd s'est consacré à Aristote, le traduisant en arabe et écrivant une cinquantaine d'ouvrages {cite:al-aalam p. 849}."
  ur: "اسلامی تہذیب میں فلسفہ؛ ابن باجہ کا شمار اسلام کے فلسفیوں میں ہوتا تھا، اور ابن رشد نے اپنے آپ کو ارسطو کے لیے وقف کر دیا، اس کا عربی میں ترجمہ کیا اور تقریباً پچاس کام لکھے۔ 849}۔"
  tr: "İslam Uygarlığında Felsefe; İbn Bacca, İslam'ın filozoflarından biriydi ve bilgeler okuluna atfedilir {cite:al-aalam s. 868}. İbn Rüşd, Aristoteles'in sözlerine dikkat etti, onları Arapçaya çevirdi ve yaklaşık elli kitap yazdı {cite:al-aalam s. 849}."
  id: "Filsafat dalam Peradaban Islam; Ibn Bajjah adalah salah satu filsuf Islam dan dikaitkan dengan aliran para bijak {cite:al-aalam hlm. 868}. Ibn Rushd memperhatikan kata-kata Aristoteles, menerjemahkannya ke dalam bahasa Arab, dan menulis sekitar lima puluh buku {cite:al-aalam hlm. 849}."
