  fr: "La philosophie dans la civilisation islamique; Ibn Bajja était compté parmi les philosophes de l'Islam, et Ibn Rushd s'est consacré à Aristote, le traduisant en arabe et écrivant une cinquantaine d'ouvrages {cite:al-aalam p. 849}."
