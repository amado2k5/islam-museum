id: concept/al-shir-al-jahili-ka-shahid-lughawi
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "الشعر الجاهلي شاهداً لغوياً"
  en: "Pre-Islamic poetry as linguistic evidence (shawahid)"
  ur: "جاہلی شعر بطور لسانی شاہد"
  fr: "La poésie préislamique comme témoin linguistique (shawahid)"
  es: "La poesía preislámica como testimonio lingüístico (shawahid)"
summary:
  ar: "كيف عدّ اللغويون والنحاة والمفسرون الأوائل الشعر الجاهلي ديوان العرب وشاهداً على المعنى والصيغة والإعراب: مسائل نافع بن الأزرق إلى ابن عباس في غريب القرآن، واستشهاد سيبويه بنحو ألف وخمسين بيتاً في الكتاب، كما ينقل ملخص بحثي قُدّم إلى المتحف {cite:routledge-quran-formative-interpretation-rippin} {cite:asjp-masail-nafi-ibn-al-azraq-article} {cite:archive-wansbrough-quranic-studies}."
  en: "How early philologists, grammarians and Qur'an commentators took pre-Islamic verse as the Arabs' register and as evidence for meaning, form and inflection: the questions of Nafi ibn al-Azraq to Ibn Abbas on rare Qur'anic words, and Sibawayh's citing of about 1,050 lines in al-Kitab, as a research summary supplied to the museum reports {cite:routledge-quran-formative-interpretation-rippin} {cite:asjp-masail-nafi-ibn-al-azraq-article} {cite:archive-wansbrough-quranic-studies}."
  ur: "قدیم لغویوں، نحویوں اور مفسروں نے جاہلی شعر کو عربوں کا دیوان اور معنی، صیغے اور اعراب پر شاہد کیسے مانا: نافع بن ازرق کے ابن عباس سے غریب القرآن کے سوالات، اور الکتاب میں سیبویہ کا تقریباً 1050 اشعار سے استشہاد، جیسا میوزیم کو دیا گیا تحقیقی خلاصہ نقل کرتا ہے {cite:routledge-quran-formative-interpretation-rippin} {cite:asjp-masail-nafi-ibn-al-azraq-article} {cite:archive-wansbrough-quranic-studies}۔"
  fr: "Comment les premiers philologues, grammairiens et commentateurs du Coran ont tenu la poésie préislamique pour le registre des Arabes et un témoin du sens, de la forme et de la flexion : les questions de Nafi ibn al-Azraq à Ibn Abbas sur les mots rares du Coran, et les quelque 1 050 vers cités par Sibawayh dans al-Kitab, selon une synthèse de recherche remise au musée {cite:routledge-quran-formative-interpretation-rippin} {cite:asjp-masail-nafi-ibn-al-azraq-article} {cite:archive-wansbrough-quranic-studies}."
  es: "Cómo los primeros filólogos, gramáticos y comentaristas del Corán tomaron la poesía preislámica como registro de los árabes y testimonio del sentido, la forma y la flexión: las preguntas de Nafi ibn al-Azraq a Ibn Abbas sobre palabras raras del Corán, y los unos 1050 versos que cita Sibawayh en al-Kitab, según un resumen de investigación entregado al museo {cite:routledge-quran-formative-interpretation-rippin} {cite:asjp-masail-nafi-ibn-al-azraq-article} {cite:archive-wansbrough-quranic-studies}."
