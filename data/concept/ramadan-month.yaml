class: concept
kind: legal
label:
  ar: "شهر رمضان"
  en: "Ramadan (the ninth month: the month of the Qur'an, the fast and the Night of Power)"
  es: "Ramadán (el noveno mes: el mes del Corán, el ayuno y la Noche del Destino)"
  fr: "Ramadan (le neuvième mois: le mois du Coran, du jeûne et de la Nuit du Destin)"
  ur: "رمضان ⁦(نواں مہینہ: قرآن کا مہینہ، روزہ اور شب قدر)⁩"
  tr: "Ramazan ayı"
  id: "Bulan Ramadan"
summary:
  ar: "رمضان تاسع شهور السنة وأشرفها، فرض صيامه في شعبان من السنة الثانية للهجرة، وفيه أنزل القرآن وفيه ليلة القدر خير من ألف شهر. وهو شهر الصبر والقرآن، وأوله رحمة وأوسطه مغفرة وآخره عتق من النار في الحديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  en: "Ramadan is the ninth and noblest month; its fast was imposed in Sha'ban of the second year of the hijra. In it the Qur'an was sent down and in it is the Night of Power, better than a thousand months. It is the month of patience and the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  ur: "رمضان نواں اور سب سے افضل مہینہ ہے؛ اس کا روزہ ہجرت کے دوسرے سال شعبان میں فرض ہوا۔ اسی میں قرآن نازل ہوا اور اسی میں لیلۃ القدر ہے جو ہزار مہینوں سے بہتر ہے۔ یہ صبر اور قرآن کا مہینہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  es: "Ramadán es el noveno y más noble mes; su ayuno fue impuesto en Sha'ban del segundo año de la Hégira. En él fue revelado el Corán y en él se encuentra la Noche del Destino, mejor que mil meses. Es el mes de la paciencia y del Corán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  fr: "Le Ramadan est le neuvième et le plus noble mois; son jeûne a été institué en Sha'ban de la deuxième année de l'Hégire. C'est durant ce mois que le Coran a été révélé et que se déroule la Nuit du Destin, meilleure que mille mois. C'est le mois de la patience et du Coran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  tr: "Ramazan, yılın dokuzuncu ve en onurlu ayıdır. Oruç tutmak Hicrat'tan sonraki ikinci yılın Şa'ban'ında zorunludur. Bu ayda Kur'an indirilmiştir ve Leylat Kadr bin aydan iyidir. Sabır ve Kur'an ayıdır; başlangıcı merhamet, ortası bağışlanmadır ve sonu hadiste ateşten kurtuluştur. {kaynak:fiqh-mawsua-kuveytiyya-noor-v3} {cit:mubarakpuri-raheeq}"
  id: "Ramadan adalah bulan kesembilan dan paling terhormat dalam setahun. Berpuasa wajib dalam Sha'ban tahun kedua setelah Hijrah. Pada bulan ini, Al-Qur'an diwahyukan, dan Laylat al-Qadr lebih baik daripada seribu bulan. Ini adalah bulan kesabaran dan Al-Qur'an; permulaannya adalah rahmat, tengahnya adalah pengampunan, dan akhirnya adalah pembebasan dari api dalam hadits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
