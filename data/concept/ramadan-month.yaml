label:
  ar: "شهر رمضان"
  en: "Ramadan (the ninth month: the month of the Qur'an, the fast and the Night of Power)"
summary:
  ar: "رمضان تاسع شهور السنة وأشرفها، فرض صيامه في شعبان من السنة الثانية للهجرة، وفيه أنزل القرآن وفيه ليلة القدر خير من ألف شهر. وهو شهر الصبر والقرآن، وأوله رحمة وأوسطه مغفرة وآخره عتق من النار في الحديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  en: "Ramadan is the ninth and noblest month; its fast was imposed in Sha'ban of the second year of the hijra. In it the Qur'an was sent down and in it is the Night of Power, better than a thousand months. It is the month of patience and the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  ur: "رمضان نواں اور سب سے افضل مہینہ ہے؛ اس کا روزہ ہجرت کے دوسرے سال شعبان میں فرض ہوا۔ اسی میں قرآن نازل ہوا اور اسی میں لیلۃ القدر ہے جو ہزار مہینوں سے بہتر ہے۔ یہ صبر اور قرآن کا مہینہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
