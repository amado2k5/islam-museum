summary:
  ar: "الوردينج هو الرمد العظيم المجاوز للحد في العظم الذي يربو فيه البياض على الحدقة فيغطيها ويمنع التغميض ويسمى باليونانية كيموسيس وكثيراً ما يعرض للصبيان لكثرة موادهم وضعف أعينهم وليس عن مادة حارة فقط، وعلاجه الاستفراغ والفصد والحجامة والرادعات اللينة الباردة والأضمدة والتقطير باللبن ثلاثة أيام ⁦(أسماء الأدوية والمجرّبات لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.167} {cite:canon-ibn-sina-print-v2 p.175}"
  en: "Wardinj is the great ramad beyond bounds in size, in which the white mounts over the pupil and covers it and prevents closing — in Greek chemosis; it often befalls boys for their abundant matter and weak eyes, and is not from hot matter alone; its treatment is evacuation, venesection, cupping, the soft cold repellents, poultices, and dripping milk three days ⁦(drug names and tried remedies are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.167} {cite:canon-ibn-sina-print-v2 p.175}"
  fr: "Le wardinj est un ramad d’ampleur excessive dans lequel le blanc de l’œil enfle, recouvre la pupille et empêche de fermer l’œil : c’est le chémosis en grec. Selon le Canon, il atteint souvent les garçons en raison de l’abondance de leurs matières et de la faiblesse de leurs yeux, et n’est pas dû à la seule matière chaude. Le texte indique comme traitements l’évacuation, la saignée, les ventouses, les répercussifs doux et froids, les cataplasmes et l’instillation de lait pendant trois jours (les noms des médicaments et remèdes éprouvés ne sont pas repris) {cite:canon-ibn-sina-print-v2 p.167} {cite:canon-ibn-sina-print-v2 p.175}"
  ur: "وردینج وہ عظیم رمد ہے جو اپنی بڑائی میں حد سے بڑھ جائے، جس میں سفیدی حدقہ پر چڑھ کر اسے ڈھانپ لیتی ہے اور پلک جھکنے سے روکتی ہے — یونانی میں کیموسس؛ یہ لڑکوں کو اکثر ہوتا ہے ان کے مادے کی کثرت اور آنکھوں کے کمزور ہونے کی وجہ سے، اور صرف گرم مادے سے نہیں ہوتا؛ اس کا علاج استفراغ، فصد، حجامت، نرم ٹھنڈے روادع، ضماد، اور تین دن دودھ کا ٹپکانا ہے ⁦(ادویہ کے نام اور آزمودہ علاج منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.167} {cite:canon-ibn-sina-print-v2 p.175}"
  es: "Wardinj es una gran ramad de tamaño desmesurado, en la que la parte blanca se acumula sobre la pupila, la cubre e impide que se cierre (en griego, quemosis); suele afectar a los niños por su abundante secreción y debilidad ocular, y no se debe únicamente a la secreción caliente; su tratamiento consiste en la evacuación, la flebectomía, la ventosaterapia, los repelentes fríos suaves, las cataplasmas y la aplicación de leche durante tres días (no se incluyen nombres de medicamentos ni remedios probados) {cite:canon-ibn-sina-print-v2 p.167} {cite:canon-ibn-sina-print-v2 p.175}"
  tr: "Kelime ifadesi, kemiğin beyazlatma bölgesinin büyüdüğü sınırı aşan büyük konjonktivittir; bu sınır göz bebeğini kapatır ve kapanmasını engeller. Yunanca'da buna kimozis denir. Sadece sıcak maddelerden değil, bol miktarda madde ve zayıf gözleri nedeniyle erkek çocuklarda sıklıkla kullanılır. Tedavisi kusma, flebit, kupa kullanma, yumuşak soğuk caydırıcılar, bandajlar ve üç gün boyunca sütle distilasyonu içerir (ilaç ve test edilen ilaçların isimleri dahil edilmemiştir) {cite:canon-ibn-sina-print-v2 s.167} {cite:canon-ibn-sina-print-v2 s.175}"
  id: "Istilah ini adalah konjungtivitis mayor yang melebihi batas tempat tulang memutihkan tumbuh; batas ini menutup pupil dan mencegahnya menutup. Dalam bahasa Yunani, ini disebut kimosis. Ini sering digunakan tidak hanya oleh zat panas tetapi juga oleh anak laki-laki karena banyaknya zat dan mata yang lemah. Pengobatan meliputi muntah, flebitis, penggunaan cangkir, pencegah dingin lembut, perban, dan distilasi dengan susu selama tiga hari (nama obat dan obat yang diuji tidak termasuk) {cite:canon-ibn-sina-print-v2 hlm.167} {cite:canon-ibn-sina-print-v2 hlm.175} {cite:canon-ibn-sina-print-v2 hlm.175}"
