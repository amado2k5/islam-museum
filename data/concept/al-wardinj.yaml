id: "concept/al-wardinj"
class: "concept"
kind: "scientific"
label:
  ar: "الوردينج"
  en: "Chemosis (wardinj)"
  ur: "وردینج"
summary:
  ar: "الوردينج هو الرمد العظيم المجاوز للحد في العظم الذي يربو فيه البياض على الحدقة فيغطيها ويمنع التغميض ويسمى باليونانية كيموسيس وكثيراً ما يعرض للصبيان لكثرة موادهم وضعف أعينهم وليس عن مادة حارة فقط، وعلاجه الاستفراغ والفصد والحجامة والرادعات اللينة الباردة والأضمدة والتقطير باللبن ثلاثة أيام ⁦(أسماء الأدوية والمجرّبات لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.167} {cite:canon-ibn-sina-print-v2 p.175}"
  en: "Wardinj is the great ramad beyond bounds in size, in which the white mounts over the pupil and covers it and prevents closing — in Greek chemosis; it often befalls boys for their abundant matter and weak eyes, and is not from hot matter alone; its treatment is evacuation, venesection, cupping, the soft cold repellents, poultices, and dripping milk three days ⁦(drug names and tried remedies are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.167} {cite:canon-ibn-sina-print-v2 p.175}"
  ur: "وردینج وہ عظیم رمد ہے جو اپنی بڑائی میں حد سے بڑھ جائے، جس میں سفیدی حدقہ پر چڑھ کر اسے ڈھانپ لیتی ہے اور پلک جھکنے سے روکتی ہے — یونانی میں کیموسس؛ یہ لڑکوں کو اکثر ہوتا ہے ان کے مادے کی کثرت اور آنکھوں کے کمزور ہونے کی وجہ سے، اور صرف گرم مادے سے نہیں ہوتا؛ اس کا علاج استفراغ، فصد، حجامت، نرم ٹھنڈے روادع، ضماد، اور تین دن دودھ کا ٹپکانا ہے ⁦(ادویہ کے نام اور آزمودہ علاج منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.167} {cite:canon-ibn-sina-print-v2 p.175}"
