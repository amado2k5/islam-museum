id: concept/lumbar-nerves
class: concept
kind: scientific
label: { ar: "أعصاب القطن عند ابن سينا", en: "Lumbar nerves in the Canon", ur: "قانون میں کمر کے اعصاب", es: "Nervios lumbares en el Canon", fr: "Nerfs lombaires dans le Canon" }
summary:
  ar: "في الفصل الخامس يبين ابن سينا أن أعصاب القطن، وهو أسفل الظهر، تذهب بجزء إلى عضل الصلب وبجزء إلى عضل البطن، وأن الزوجين السافلين يرسلان شعباً كباراً إلى الساقين {cite:canon-ibn-sina-print-v1 p.83}."
  en: "In the fifth chapter Ibn Sina shows that the lumbar nerves, those of the lower back, send one part to the back muscles and one to the abdominal muscles, and that the two lowest pairs send large branches to the legs {cite:canon-ibn-sina-print-v1 p.83}."
  es: "En el quinto capítulo, Ibn Sina muestra que los nervios lumbares, los de la parte baja de la espalda, envían una parte a los músculos de la espalda y otra a los músculos abdominales, y que los dos pares inferiores envían grandes ramas a las piernas {cite:canon-ibn-sina-print-v1 p.83}."
  fr: "Dans le cinquième chapitre, Ibn Sina montre que les nerfs lombaires, ceux du bas du dos, envoient une partie aux muscles du dos et une autre aux muscles abdominaux, et que les deux paires les plus basses envoient de grandes branches aux jambes {cite:canon-ibn-sina-print-v1 p.83}."
  ur: "پانچویں باب میں ابن سینا بتاتا ہے کہ کمر کے اعضاء، جو کمر کے نچلے حصے کے ہیں، ایک حصہ کمر کے پٹھوں اور ایک پیٹ کے پٹھوں میں بھیجتے ہیں، اور یہ کہ دو سب سے نیچے والے جوڑے ٹانگوں پر بڑی شاخیں بھیجتے ہیں۔"
