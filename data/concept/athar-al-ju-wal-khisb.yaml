id: concept/athar-al-ju-wal-khisb
class: concept
kind: term
label:
  ar: "أثر الخصب والجوع في البشر"
  en: "The effects of plenty and hunger"
  fr: "Les effets de l’abondance et de la faim"
  es: "Los efectos de la abundancia y el hambre"
  ur: "کثرت اور بھوک کے اثرات"
  tr: "Doğurganlık ve Açlığın İnsanlar Üzerindeki Etkisi"
  id: "Dampak Kesuburan dan Kelaparan pada Manusia"
summary:
  ar: "قرر ابن خلدون أن أهل القفار الفاقدين للحبوب والأدم المقتصرين على الألبان واللحوم أحسن حالاً في أجسامهم وأخلاقهم من أهل التلول المنغمسين في العيش، فألوانهم أصفى وأبدانهم أنقى وأذهانهم أثقب في المعارف، لأن كثرة الأغذية تولد في الجسم فضلات رديئة وبخارات تغطي الأذهان فتجيء البلادة والغفلة، واعتبر ذلك في حيوان القفر من الغزال والنعام والمها مع أمثالها من حيوان التلول، ويظهر أثر ذلك حتى في الدين والعبادة فنجد المتقشفين أحسن ديناً من أهل الترف ويختص وجود العباد والزهاد بالمتقشفين، وأن المخصبين إذا نزلت بهم المجاعات أسرع إليهم الهلاك مثل برابرة المغرب وأهل فاس ومصر خلافاً للعرب أهل القفر {cite:muqaddima-ibn-khaldun p. 86-88}."
  en: "Lean desert-dwellers outdo the well-fed in body, mind and piety — and famine kills the gorged first {cite:muqaddima-ibn-khaldun p. 86-88}."
  fr: "Les habitants frugaux du désert surpassent les bien nourris par le corps, l’esprit et la piété — et la famine tue d’abord ceux qui se sont gorgés {cite:muqaddima-ibn-khaldun p. 86-88}."
  es: "Los habitantes del desierto, delgados y sin apetito, superan a los bien alimentados en cuerpo, mente y piedad, y el hambre mata primero a los saciados {cite:muqaddima-ibn-khaldun p. 86-88}."
  ur: "دبلے صحرائی باشندے جسم، دماغ اور تقویٰ میں بہت زیادہ غذائیت رکھتے ہیں - اور قحط پہلے گھاٹیوں کو مار ڈالتا ہے۔ 86-88}۔"
  tr: "İbn Haldun, tahıl ve insan eksikliği olan, süt ve etle sınırlı olan çöl halkının, hayata gömülmüş dağ halkından daha iyi beden ve ahlak halinde olduklarını ortaya koymuştur. Tenleri daha berrak, bedenleri daha saf ve zihinleri bilgiyle daha delinmiştir; çünkü bol yiyecek kötü atık ve buharlar oluşturur, bu da zihni sarar, dikkatsizlik ve donukluğa yol açar. Bu durum, ceylan, devekuşu, oryx ve oryx gibi vahşi hayvanlar ile çölden gelen benzer hayvanlar için geçerlidir. Bunun etkisi din ve ibadette bile belirgindir; burada münzevilerin lüks insanlardan daha iyi bir dine sahip olduğu görülür ve ibadet edenlerin ve münzevilerin varlığı sadeliğe ayrılır. Kıtlık onları vurduğunda, verimli olanlar hızla yok olur; tıpkı Fas, Fez ve Mısır'daki barbarlar gibi, çöldeki Arapların aksine. {cit:) Muqaddima-ibn-Haldun, s. 86-88}."
  id: "Ibn Khaldun menetapkan bahwa penduduk gurun, yang kekurangan gandum dan manusia serta terbatas pada susu dan daging, berada dalam kondisi tubuh dan moral yang lebih baik dibandingkan orang-orang pegunungan yang tenggelam dalam kehidupan. Warna kulit mereka lebih bersih, tubuh mereka lebih murni, dan pikiran mereka lebih dipenuhi pengetahuan, karena kelimpahan makanan menghasilkan limbah dan uap yang tidak baik yang menutupi pikiran, menyebabkan kebosanan dan ketidakpedulian. Hal ini dianggap terjadi pada hewan liar seperti kijang, burung unta, oryx, dan oryx, bersama dengan hewan serupa dari padang gurun. Dampak ini bahkan terlihat dalam agama dan ibadah, di mana para pertapa ditemukan memiliki agama yang lebih baik daripada orang mewah, dan kehadiran para penyembah serta pertapa hanya untuk kesederhanaan. Ketika kelaparan melanda, yang subur dengan cepat binasa, seperti orang barbar Maroko, Fez, dan Mesir, tidak seperti orang Arab di gurun {cite:Muqaddima-ibn-Khaldun, hlm. 86-88}."
