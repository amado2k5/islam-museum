id: concept/athar-al-ju-wal-khisb
class: concept
kind: term
label: { ar: "أثر الخصب والجوع في البشر", en: "The effects of plenty and hunger" }
summary:
  ar: "قرر ابن خلدون أن أهل القفار الفاقدين للحبوب والأدم المقتصرين على الألبان واللحوم أحسن حالاً في أجسامهم وأخلاقهم من أهل التلول المنغمسين في العيش، فألوانهم أصفى وأبدانهم أنقى وأذهانهم أثقب في المعارف، لأن كثرة الأغذية تولد في الجسم فضلات رديئة وبخارات تغطي الأذهان فتجيء البلادة والغفلة، واعتبر ذلك في حيوان القفر من الغزال والنعام والمها مع أمثالها من حيوان التلول، ويظهر أثر ذلك حتى في الدين والعبادة فنجد المتقشفين أحسن ديناً من أهل الترف ويختص وجود العباد والزهاد بالمتقشفين، وأن المخصبين إذا نزلت بهم المجاعات أسرع إليهم الهلاك مثل برابرة المغرب وأهل فاس ومصر خلافاً للعرب أهل القفر {cite:muqaddima-ibn-khaldun p. 86-88}."
  en: "Lean desert-dwellers outdo the well-fed in body, mind and piety — and famine kills the gorged first {cite:muqaddima-ibn-khaldun p. 86-88}."
wings: [ideas]
sources: [source/muqaddima-ibn-khaldun]
