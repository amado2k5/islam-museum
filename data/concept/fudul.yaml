id: concept/fudul
class: concept
kind: ethical
label:
  ar: "الفضول"
  en: "Curiosity about others (fudul)"
  ur: "فضول ٹوہ (فضول)"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن الفضول، وهو التتبع والسؤال عما لا يعني المرء من شؤون غيره، آفة تصيب الناس. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:58:30} ويضرب مثلا بمن يلحّ في السؤال عن ساعة في يد غيره حتى يوقعه في الكذب، {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:58:30} ويدعو إلى تعليم الأولاد تركه منذ الصغر. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:59:00}"
  en: "Sheikh Omar Abdelkafy holds that fudul, following and asking about what does not concern a person in other people's affairs, is a plague among people. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:58:30} He gives the example of someone who keeps asking about a watch on another's wrist until he leads him into lying, {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:58:30} and he calls for teaching children from a young age to leave it. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:59:00}"
  ur: "شیخ عمر عبد الکافی کی رائے ہے کہ فضول، یعنی دوسروں کے ان معاملات کی ٹوہ اور سوال جن سے آدمی کا تعلق نہ ہو، لوگوں میں پھیلی ہوئی ایک آفت ہے۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:58:30} وہ مثال دیتے ہیں کہ کوئی دوسرے کی گھڑی کے بارے میں اصرار سے پوچھتا رہتا ہے یہاں تک کہ اسے جھوٹ میں ڈال دیتا ہے، {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:58:30} اور بچوں کو بچپن سے اسے چھوڑنا سکھانے کی دعوت دیتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep04 00:59:00}"
