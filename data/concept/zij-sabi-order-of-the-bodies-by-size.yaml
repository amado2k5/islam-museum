label: { ar: "ترتيب أجرام العالم بحسب عظمها", en: "The order of the bodies of the world by size", ur: "دنیا کے اجرام کی جسامت کے لحاظ سے ترتیب", es: "El orden de los cuerpos del mundo por tamaño" }
summary:
  ar: "يذكر النص ترتيب أجرام العالم بحسب عظمها: أعظمها الشمس، ثم الخمسة عشر كوكباً المذكورة في القدر الأول، ثم المشتري، ثم زحل، ثم باقي الكواكب الثابتة في العظم الثاني، ثم المريخ، ثم الأرض، ثم القمر، ثم الزهرة، وأصغرها عطارد. {cite:zij-sabi-nallino-byblion p.189}"
  en: "The text gives the order of the bodies of the world by size: the Sun first, then the fifteen stars named in the first magnitude, then Jupiter, then Saturn, then the other fixed stars of the second magnitude, then Mars, then the Earth, then the Moon, then Venus, and last Mercury, the smallest of the bodies of the world. {cite:zij-sabi-nallino-byblion p.189}"
  ur: "متن دنیا کے اجرام کی جسامت کی ترتیب دیتا ہے: سب سے بڑا سورج، پھر پہلے قدر کے پندرہ مذکورہ ستارے، پھر مشتری، پھر زحل، پھر دوسرے عظم کے باقی ثابت ستارے، پھر مریخ، پھر زمین، پھر چاند، پھر زہرہ، اور سب سے چھوٹا عطارد جو دنیا کے اجرام میں سب سے چھوٹا ہے۔ {cite:zij-sabi-nallino-byblion p.189}"
  es: "El texto ordena los cuerpos celestes por tamaño: primero el Sol, luego las quince estrellas de primera magnitud, después Júpiter, luego Saturno, luego las demás estrellas fijas de segunda magnitud, luego Marte, luego la Tierra, luego la Luna, luego Venus y, por último, Mercurio, el más pequeño de los cuerpos celestes. {cite:zij-sabi-nallino-byblion p.189}"
