summary:
  ar: "ذنب الخيل في الكتاب نبات ينبت في الحفائر والخنادق، بارد في الأولى يابس في الثانية، قابض وخصوصا عصارته شديدة التجفيف بلا لذع، نافع جدا لنزف الدم، يدمل القروح والجراحات ولو كان فيها عصب، وينفع من شدخ أوساط العضل ويضمر قيلة الأمعاء وأورام المعدة والكبد والاستسقاء {cite:canon-ibn-sina-print-v1 pp.719-720}"
  en: "Dhanab al-khayl is in the book a plant that grows in pits and ditches, cold in the first degree and dry in the second, astringent, its sap especially strongly drying without sting and very beneficial for bleeding; it heals ulcers and wounds even where a nerve is in them, and benefits bruising of the middle of the muscles, hernia of the intestines, and swellings of the stomach and liver, and dropsy {cite:canon-ibn-sina-print-v1 pp.719-720}"
  ur: "ذنب الخیل کتاب میں ایک پودا ہے جو گڑھوں اور خندقوں میں اگتا ہے، پہلے درجے میں ٹھنڈا اور دوسرے میں خشک، قابض، اور خاص طور پر اس کا رس بغیر چبھن کے بہت خشک کرنے والا ہے اور خون کے بہنے میں بہت نافع؛ زخموں اور جراحتوں کو بھر دیتا ہے چاہے ان میں عصب ہو، اور پٹھوں کے درمیانی حصے کے کچلنے، آنتوں کے فتق، اور معدے اور جگر کے ورموں اور استسقاء میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.719-720}۔"
  es: "Dhanab al-khayl es, según el libro, una planta que crece en hoyos y zanjas, fría en primer grado y seca en segundo, astringente, cuya savia seca con especial intensidad sin causar escozor y es muy beneficiosa para las hemorragias; cura úlceras y heridas, incluso cuando contienen nervios, y es beneficiosa para los hematomas musculares, las hernias intestinales, la hinchazón del estómago y el hígado, y la hidropesía {cite:canon-ibn-sina-print-v1 pp.719-720}"
  fr: "Dhanab al-khayl est décrit dans le livre comme une plante qui pousse dans les fosses et les fossés, froide au premier degré et sèche au second, astringente, dont la sève est particulièrement asséchante sans être irritante et très bénéfique en cas de saignement; elle guérit les ulcères et les plaies, même lorsqu'un nerf est touché, et est bénéfique en cas de contusions musculaires, de hernies intestinales, de gonflements de l'estomac et du foie, et d'hydropisie {cite:canon-ibn-sina-print-v1 pp.719-720}"
  tr: "Kitaptaki at kuyruğu, siperlerde ve hendeklerde yetişen, ilkinde soğuk, ikincisinde kuru, büzücü ve özellikle çok kuruyan suyu ile sokmayan bir bitkidir. Kanama için çok faydalıdır, sinir içerse bile ülser ve yaraları iyileştirir, kas liflerini sıkılaştırmak, bağırsak celesinin atrofisi, mide ve karaciğer tümörleri ile askit için faydalıdır {cite:canon-ibn-sina-print-v1 s.719-720}"
  id: "Ekor kuda dalam buku ini adalah tanaman yang tumbuh di parit dan parit, dingin di parit pertama dan kering di parit kedua, astringen, terutama jusnya yang sangat kering tanpa perih. Tanaman ini sangat berguna untuk pendarahan, menyembuhkan borok dan luka meskipun mengandung saraf, berguna untuk mengencangkan serat otot, mengecilkan tumor usus, lambung dan hati, serta mengalami asites {cite:canon-ibn-sina-print-v1 hlm.719-720}"
