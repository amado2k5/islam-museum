issue:
  ar: "هل في القرآن ألفاظ أصلها من غير لسان العرب؟"
  en: "Does the Qur'an contain words whose origin lies outside the tongue of the Arabs?"
  ur: "کیا قرآن میں ایسے الفاظ ہیں جن کی اصل عربوں کی زبان سے باہر ہے؟"
  fr: "Le Coran contient-il des mots dont l'origine est extérieure à la langue des Arabes ?"
  es: "¿Contiene el Corán palabras cuyo origen está fuera de la lengua de los árabes?"
perspectives:
  - tradition: sunni
    id: denial-of-foreign-words
    standing: main
    stance:
      ar: "كل ألفاظ القرآن عربية، وما يُظن أعجمياً فإما توارد لغات أو لفظ عربي خفي."
      en: "Every word of the Qur'an is Arabic; what is thought foreign is either a coincidence of languages or an Arabic word hidden from some."
      ur: "قرآن کے تمام الفاظ عربی ہیں؛ جو عجمی سمجھا جاتا ہے وہ یا زبانوں کا توارد ہے یا کوئی عربی لفظ جو بعض سے مخفی ہے۔"
      fr: "Tous les mots du Coran sont arabes ; ce que l'on croit étranger est soit une coïncidence de langues, soit un mot arabe caché à certains."
      es: "Todas las palabras del Corán son árabes; lo que se cree extranjero es una coincidencia de lenguas o una palabra árabe oculta a algunos."
    holders: [person/al-shafii, person/al-tabari, person/ibn-faris, person/al-baqillani, person/abu-ubayda-mammar]
    summary:
      ar: "يذكر السيوطي أن الأكثرين على عدم وقوع المعرَّب، وأن الشافعي كان شديد الإنكار على من قال به {cite:itqan-abu-al-fadl-1974 2 p.125}. ويحتج الشافعي في الرسالة بأن القرآن يدل على أنه ليس من كتاب الله شيء إلا بلسان العرب {cite:risala-shafii-shakir-1938 p.41}. ويرى ابن جرير أن ما قيل من فارسيته أو حبشيته توارد لغات {cite:itqan-abu-al-fadl-1974 2 p.125}."
      en: "Al-Suyuti states that the majority hold that the mu'arrab does not occur, and that al-Shafi'i was severe in rejecting whoever said it {cite:itqan-abu-al-fadl-1974 2 p.125}. In al-Risala al-Shafi'i argues that the Qur'an shows nothing of the Book of God to be other than in the tongue of the Arabs {cite:risala-shafii-shakir-1938 p.41}. Ibn Jarir holds that what is said of Persian or Abyssinian words is a coincidence of languages {cite:itqan-abu-al-fadl-1974 2 p.125}."
      ur: "سیوطی بتاتے ہیں کہ اکثریت کے نزدیک معرب واقع نہیں ہوتا، اور شافعی اس کے قائل پر سخت انکار کرتے تھے {cite:itqan-abu-al-fadl-1974 2 p.125}۔ الرسالہ میں شافعی استدلال کرتے ہیں کہ قرآن دلالت کرتا ہے کہ کتاب اللہ میں کوئی چیز عربوں کی زبان کے سوا نہیں {cite:risala-shafii-shakir-1938 p.41}۔ ابن جریر کے نزدیک فارسی یا حبشی ہونے کی جو بات کہی گئی وہ زبانوں کا توارد ہے {cite:itqan-abu-al-fadl-1974 2 p.125}۔"
      fr: "Al-Suyuti précise que la majorité tient que le mu'arrab n'y figure pas, et qu'al-Shafi'i était sévère envers qui le disait {cite:itqan-abu-al-fadl-1974 2 p.125}. Dans la Risala, al-Shafi'i soutient que le Coran montre que rien du Livre de Dieu n'est autre que dans la langue des Arabes {cite:risala-shafii-shakir-1938 p.41}. Ibn Jarir tient que ce qu'on dit de mots persans ou abyssins est une coïncidence de langues {cite:itqan-abu-al-fadl-1974 2 p.125}."
      es: "Al-Suyuti indica que la mayoría sostiene que el mu'arrab no ocurre, y que al-Shafi'i era severo con quien lo dijera {cite:itqan-abu-al-fadl-1974 2 p.125}. En la Risala al-Shafi'i sostiene que el Corán muestra que nada del Libro de Dios es sino en la lengua de los árabes {cite:risala-shafii-shakir-1938 p.41}. Ibn Jarir sostiene que lo que se dice de palabras persas o abisinias es una coincidencia de lenguas {cite:itqan-abu-al-fadl-1974 2 p.125}."
    sources: [source/itqan-abu-al-fadl-1974, source/risala-shafii-shakir-1938]
  - tradition: sunni
    id: occurrence-of-foreign-words
    stance:
      ar: "في القرآن ألفاظ قليلة من لغات أخرى، ولا يخرجه ذلك عن كونه عربياً."
      en: "The Qur'an has a few words from other languages, and this does not take it out of being Arabic."
      ur: "قرآن میں دوسری زبانوں کے چند الفاظ ہیں، اور اس سے اس کا عربی ہونا ختم نہیں ہوتا۔"
      fr: "Le Coran contient quelques mots d'autres langues, ce qui ne l'empêche pas d'être arabe."
      es: "El Corán tiene unas pocas palabras de otras lenguas, y eso no le quita ser árabe."
    holders: [person/al-suyuti]
    summary:
      ar: "يختار السيوطي القول بالوقوع، ويقول إن أقوى ما رآه ما رواه ابن جرير بسند صحيح عن أبي ميسرة أن في القرآن من كل لسان {cite:itqan-abu-al-fadl-1974 2 p.126}. ويردّ أصحاب هذا القول على آية يوسف بأن ألفاظاً قليلة لا تغير عربية الكلام {cite:itqan-abu-al-fadl-1974 2 p.126}. وفي رواية عن سعيد بن جبير أن الله أنزل في القرآن ألفاظاً من كل لسان {cite:tafsir-tabari-quran-com on 41:44}."
      en: "Al-Suyuti chooses the view of occurrence, saying the strongest he saw is what Ibn Jarir reports with a sound chain from Abu Maysara, that the Qur'an has something from every tongue {cite:itqan-abu-al-fadl-1974 2 p.126}. Holders of this view answer the verse of Yusuf by saying a few words do not change the Arabic character of the speech {cite:itqan-abu-al-fadl-1974 2 p.126}. A report from Sa'id ibn Jubayr says God sent down in it words from every tongue {cite:tafsir-tabari-quran-com on 41:44}."
      ur: "سیوطی وقوع کے قول کو اختیار کرتے ہیں اور کہتے ہیں کہ سب سے قوی بات جو انہوں نے دیکھی وہ ہے جو ابن جریر نے صحیح سند سے ابو میسرہ سے روایت کی کہ قرآن میں ہر زبان کا کچھ ہے {cite:itqan-abu-al-fadl-1974 2 p.126}۔ اس قول کے قائل آیت یوسف کا جواب دیتے ہیں کہ چند الفاظ سے کلام کا عربی ہونا نہیں بدلتا {cite:itqan-abu-al-fadl-1974 2 p.126}۔ سعید بن جبیر کی ایک روایت میں ہے کہ اللہ نے اس میں ہر زبان کے الفاظ اتارے {cite:tafsir-tabari-quran-com on 41:44}۔"
      fr: "Al-Suyuti choisit l'avis de la présence, disant que le plus fort qu'il ait vu est ce qu'Ibn Jarir rapporte avec une chaîne authentique d'Abu Maysara, que le Coran a quelque chose de chaque langue {cite:itqan-abu-al-fadl-1974 2 p.126}. Les tenants de cet avis répondent au verset de Yusuf que quelques mots ne changent pas le caractère arabe du discours {cite:itqan-abu-al-fadl-1974 2 p.126}. Un récit de Sa'id ibn Jubayr dit que Dieu y fit descendre des mots de chaque langue {cite:tafsir-tabari-quran-com on 41:44}."
      es: "Al-Suyuti elige la opinión de que ocurre, diciendo que lo más fuerte que vio es lo que Ibn Jarir transmite con cadena sólida de Abu Maysara, que el Corán tiene algo de cada lengua {cite:itqan-abu-al-fadl-1974 2 p.126}. Los que sostienen esta opinión responden al versículo de Yusuf que unas pocas palabras no cambian el carácter árabe del discurso {cite:itqan-abu-al-fadl-1974 2 p.126}. Un relato de Sa'id ibn Jubayr dice que Dios hizo descender en él palabras de cada lengua {cite:tafsir-tabari-quran-com on 41:44}."
    sources: [source/itqan-abu-al-fadl-1974, source/tafsir-tabari-quran-com]
  - tradition: sunni
    id: abu-ubayd-reconciliation
    stance:
      ar: "أصول هذه الألفاظ أعجمية، لكن العرب عرّبتها فصارت عربية قبل نزول القرآن، فالقولان صادقان."
      en: "These words are foreign in origin, but the Arabs arabised them before the Qur'an came down, so both sayings are true."
      ur: "ان الفاظ کی اصل عجمی ہے، لیکن عربوں نے قرآن کے نزول سے پہلے انہیں معرب کر لیا، اس لیے دونوں اقوال سچے ہیں۔"
      fr: "Ces mots sont d'origine étrangère, mais les Arabes les ont arabisés avant la descente du Coran, de sorte que les deux dires sont vrais."
      es: "Estas palabras son de origen extranjero, pero los árabes las arabizaron antes de que descendiera el Corán, de modo que ambos dichos son verdad."
    summary:
      ar: "ينقل السيوطي عن أبي عبيد القاسم بن سلام أن هذه الألفاظ أصولها أعجمية كما قال الفقهاء، لكنها وقعت للعرب فعرّبوها فصارت عربية، ثم نزل القرآن وقد اختلطت بكلامهم {cite:itqan-abu-al-fadl-1974 2 p.128}. فمن قال إنها عربية صدق، ومن قال إنها أعجمية صدق {cite:itqan-abu-al-fadl-1974 2 p.128}."
      en: "Al-Suyuti reports from Abu Ubayd al-Qasim ibn Sallam that these words are foreign in origin as the jurists said, but reached the Arabs, who arabised them so that they became Arabic, and then the Qur'an came down when they had mixed with their speech {cite:itqan-abu-al-fadl-1974 2 p.128}. So whoever says they are Arabic is truthful, and whoever says they are foreign is truthful {cite:itqan-abu-al-fadl-1974 2 p.128}."
      ur: "سیوطی ابو عبید قاسم بن سلام سے نقل کرتے ہیں کہ ان الفاظ کی اصل عجمی ہے جیسا کہ فقہاء نے کہا، لیکن وہ عربوں تک پہنچے تو انہوں نے انہیں معرب کیا اور وہ عربی ہو گئے، پھر قرآن نازل ہوا جب وہ ان کے کلام میں گھل مل چکے تھے {cite:itqan-abu-al-fadl-1974 2 p.128}۔ اس لیے جو انہیں عربی کہے وہ سچا ہے اور جو عجمی کہے وہ بھی سچا ہے {cite:itqan-abu-al-fadl-1974 2 p.128}۔"
      fr: "Al-Suyuti rapporte d'Abu Ubayd al-Qasim ibn Sallam que ces mots sont d'origine étrangère comme l'ont dit les juristes, mais parvinrent aux Arabes, qui les arabisèrent jusqu'à ce qu'ils deviennent arabes, puis que le Coran descendit alors qu'ils étaient mêlés à leur langage {cite:itqan-abu-al-fadl-1974 2 p.128}. Ainsi celui qui les dit arabes dit vrai, et celui qui les dit étrangers dit vrai {cite:itqan-abu-al-fadl-1974 2 p.128}."
      es: "Al-Suyuti transmite de Abu Ubayd al-Qasim ibn Sallam que estas palabras son de origen extranjero como dijeron los juristas, pero llegaron a los árabes, que las arabizaron hasta que fueron árabes, y luego descendió el Corán cuando ya estaban mezcladas con su habla {cite:itqan-abu-al-fadl-1974 2 p.128}. Así, quien las llama árabes dice verdad, y quien las llama extranjeras dice verdad {cite:itqan-abu-al-fadl-1974 2 p.128}."
