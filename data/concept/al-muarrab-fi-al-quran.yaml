id: concept/al-muarrab-fi-al-quran
class: concept
kind: doctrine
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "المعرَّب في القرآن: هل فيه ألفاظ من غير لغة العرب؟"
  en: "Foreign words in the Qur'an: are there words from outside Arabic?"
  ur: "قرآن میں معرب: کیا اس میں عربی کے سوا دوسری زبانوں کے الفاظ ہیں؟"
  fr: "Les mots étrangers dans le Coran : s'y trouve-t-il des mots venus d'ailleurs que de l'arabe ?"
  es: "Palabras extranjeras en el Corán: ¿hay en él palabras ajenas al árabe?"
summary:
  ar: "اختلف العلماء في وقوع ألفاظ معرَّبة في القرآن. فالأكثرون، ومنهم الشافعي والطبري وابن فارس، على عدم وقوعها، ويحتجون بآيتي يوسف وفصلت، ويرى السيوطي وقوعها اعتماداً على رواية عن أبي ميسرة وسعيد بن جبير، وجمع أبو عبيد بين القولين بأن أصولها أعجمية عرّبتها العرب قبل النزول. وتنقل الصفحة كل قول عن أصحابه."
  en: "Scholars differed on whether arabised words occur in the Qur'an. The majority, among them al-Shafi'i, al-Tabari and Ibn Faris, hold that they do not, arguing from the verses of Yusuf and Fussilat; al-Suyuti holds that they do, relying on a report from Abu Maysara and Sa'id ibn Jubayr; and Abu Ubayd joined the views by saying their origins are foreign but the Arabs arabised them before the revelation. The page gives each view under its holders."
  ur: "علماء نے قرآن میں معرب الفاظ کے وقوع میں اختلاف کیا۔ اکثریت، جن میں شافعی، طبری اور ابن فارس ہیں، عدم وقوع کی قائل ہے اور یوسف اور فصلت کی آیتوں سے استدلال کرتی ہے؛ سیوطی ابو میسرہ اور سعید بن جبیر کی روایت پر بنا کر وقوع کے قائل ہیں؛ اور ابو عبید نے دونوں اقوال کو یوں جمع کیا کہ ان کی اصل عجمی ہے مگر عربوں نے نزول سے پہلے انہیں معرب کر لیا۔ صفحہ ہر قول اس کے قائلین سے نقل کرتا ہے۔"
  fr: "Les savants divergèrent sur la présence de mots arabisés dans le Coran. La majorité, dont al-Shafi'i, al-Tabari et Ibn Faris, tient qu'il n'y en a pas, en argumentant des versets de Yusuf et de Fussilat ; al-Suyuti tient qu'il y en a, s'appuyant sur un récit d'Abu Maysara et de Sa'id ibn Jubayr ; et Abu Ubayd a uni les avis en disant que leur origine est étrangère mais que les Arabes les ont arabisés avant la révélation. La page donne chaque avis sous ses tenants."
  es: "Los sabios discreparon sobre si hay palabras arabizadas en el Corán. La mayoría, entre ellos al-Shafi'i, al-Tabari e Ibn Faris, sostiene que no, con argumentos de los versículos de Yusuf y Fussilat; al-Suyuti sostiene que sí, apoyándose en un relato de Abu Maysara y Sa'id ibn Jubayr; y Abu Ubayd unió las opiniones diciendo que su origen es extranjero pero los árabes las arabizaron antes de la revelación. La página da cada opinión bajo quienes la sostienen."
