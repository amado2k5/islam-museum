label: { ar: "الرياضة", en: "Spiritual training (riyada)", ur: "ریاضت" }
summary:
  ar: "المنزلة الحادية عشرة من منازل السالكين في مدارج السالكين لابن قيم الجوزية؛ يعرّفها بأنها تمرين النفس على الصدق والإخلاص، ويشرح تعريف الهروي لها بتمرين النفس على قبول الصدق، ودرجاتها الثلاث: تهذيب الأخلاق بالعلم وتصفية الأعمال بالإخلاص وتوفير الحقوق، ثم حسم التفرق وتسليط العلم على الحال، ثم تجريد الشهود والصعود إلى الجمع الذي يناقش فيه ابن القيم الهروي."
  en: "The eleventh of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin. He defines it as training the self in truthfulness and sincerity, explains al-Harawi's definition – training the self to accept truthfulness – and its three degrees: refining character by knowledge, purifying deeds by sincerity and rendering rights in full; then cutting off dispersion and letting knowledge govern the spiritual state; then detaching witnessing and rising to 'union', where Ibn al-Qayyim argues with al-Harawi."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی گیارہویں منزل۔ وہ اس کی تعریف نفس کو سچائی اور اخلاص کی مشق کرانا کرتے ہیں، ہروی کی تعریف – نفس کو سچائی قبول کرنے کی مشق کرانا – اور اس کے تین درجوں کی شرح کرتے ہیں: علم سے اخلاق کی تہذیب، اخلاص سے اعمال کی تصفیہ اور حقوق کی پوری ادائیگی؛ پھر پراگندگی کا خاتمہ اور علم کو حال پر حاکم بنانا؛ پھر شہود کی تجرید اور «جمع» کی طرف صعود، جس میں ابن القیم ہروی سے بحث کرتے ہیں۔"
