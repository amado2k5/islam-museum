label: { ar: "أسماء شهور العرب وأيامها في الزيج الصابي", en: "The Arab month names and their lengths in the Zij al-Sabi", ur: "زیج صابی میں عربی مہینوں کے نام اور ان کے دن", es: "Los nombres de los meses árabes y su duración en el Zij al-Sabi.", fr: "Les noms des mois arabes et leur durée dans le Zij al-Sabi" }
summary:
  ar: "يعدد البتاني شهور العرب من المحرم إلى ذي الحجة، ويبيّن أن الشهر القمري ثلاثون يوماً أو تسعة وعشرون، وأن ذا الحجة يحمل فضلاً من يوم وجزء من أجزاء السنة في الحساب. {cite:zij-sabi-nallino-byblion p.100}."
  en: "Al-Battani lists the Arab months from Muharram to Dhu al-Hijja, and states that a lunar month has thirty or twenty-nine days, with Dhu al-Hijja carrying an extra fraction of a day in the reckoning. {cite:zij-sabi-nallino-byblion p.100}."
  ur: "البتانی عربی مہینوں کو محرم سے ذو الحجہ تک گنواتے ہیں، اور بتاتے ہیں کہ قمری مہینہ تیس یا انتیس دن کا ہوتا ہے، اور حساب میں ذو الحجہ ایک دن کا ایک حصہ اضافی لیتا ہے۔ {cite:zij-sabi-nallino-byblion p.100}۔"
  es: "Al-Battani enumera los meses árabes desde Muharram hasta Dhu al-Hijja, y afirma que un mes lunar tiene treinta o veintinueve días, y que Dhu al-Hijja incluye una fracción de día adicional en el cálculo. {cite:zij-sabi-nallino-byblion p.100}."
  fr: "Al-Battani énumère les mois arabes de Muharram à Dhu al-Hijja et précise qu'un mois lunaire compte trente ou vingt-neuf jours, Dhu al-Hijja étant majoré d'une fraction de jour. {cite:zij-sabi-nallino-byblion p.100}."
