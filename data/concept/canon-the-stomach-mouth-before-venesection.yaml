label: { ar: "فم المعدة قبل الفصد عند ابن سينا", en: "The mouth of the stomach before venesection in the Canon", ur: "قانون میں فصد سے پہلے فم معدہ", es: "La boca del estómago antes de la venesección en el Canon" }
summary:
  ar: "يميز ابن سينا ثلاثة أحوال لفم المعدة يخاف فيها الفصد، فرط الحس وضعفه وقبوله للمرار، ويذكر علامة كل منها وما يلقم به كل واحد قبل أن يفصد {cite:canon-ibn-sina-print-v1 p.292}."
  en: "Ibn Sina distinguishes three states of the mouth of the stomach in which bleeding is feared, excess of sensation, weakness, and readiness to receive bile, gives the sign of each and what each is fed with before he is bled {cite:canon-ibn-sina-print-v1 p.292}."
  es: "Ibn Sina distingue tres estados de la boca del estómago en los que se teme una hemorragia: exceso de sensibilidad, debilidad y disposición para recibir bilis; da el signo de cada uno y con qué se alimenta a cada uno antes de la sangría {cite:canon-ibn-sina-print-v1 p.292}."
