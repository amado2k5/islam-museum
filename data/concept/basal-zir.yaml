id: concept/basal-zir
class: concept
kind: natural
label:
  ar: "بصل الزير"
  en: "Basal al-zir (a mouse-onion-like bulb)"
  fr: "Basal al-zir (bulbe proche de l’oignon de souris)"
  ur: "بصل الزیر"
  es: "Al-zir basal (un bulbo parecido a una cebolla ratón)"
summary:
  ar: "يشبه بصل الفار في قوته وطعمه ويُستعمل بدله، وهو أضعف منه، ينفع من السموم ولسع العقرب والرتيلاء إذا خُلط بالتين، ويسكّن أوجاع الرحم الباردة {cite:canon-ibn-sina-print-v1 p.414}."
  en: "Like the mouse onion in power and taste, used in its place, but weaker. It helps poisons and the stings of the scorpion and the tarantula when mixed with fig, and it eases cold pains of the womb {cite:canon-ibn-sina-print-v1 p.414}."
  fr: "Semblable à l’oignon de souris par son pouvoir et son goût, il le remplace, mais est plus faible. Mêlé à la figue, il serait utile aux poisons et piqûres de scorpion et de tarentule ; il apaiserait les douleurs froides de l’utérus {cite:canon-ibn-sina-print-v1 p.414}."
  ur: "اپنی قوت اور ذائقے میں چوہا پیاز جیسا، اس کی جگہ استعمال ہوتا ہے مگر کمزور ہے؛ انجیر کے ساتھ ملا کر بچھو اور رتیلے کے ڈنک اور زہروں میں مفید ہے، اور سرد رحم کے درد کو آرام دیتا ہے {cite:canon-ibn-sina-print-v1 p.414}۔"
  es: "Similar a la cebolla de ratón en potencia y sabor, se usa en su lugar, pero es más suave. Ayuda contra venenos y las picaduras de escorpión y tarántula cuando se mezcla con higo, y alivia los dolores de frío en el útero {cite:canon-ibn-sina-print-v1 p.414}."
