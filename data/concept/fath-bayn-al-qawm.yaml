id: concept/fath-bayn-al-qawm
class: concept
kind: term
label: { ar: "الفتح بين القوم", en: "Fath between the people (judgment)", es: "La ira entre las personas (juicio)", fr: "Le droit entre les peuples (jugement)", ur: "لوگوں کے درمیان فاش ⁦(فیصلہ)⁩", tr: "Halk arasında fetih", id: "Penaklukan di antara rakyat" }
issue:
  ar: "ما معنى «افتح بيننا وبين قومنا بالحق»، ومن أين جاء لفظ الفتح بهذا المعنى؟"
summary:
  ar: "الفتح في الدعاء الوارد على لسان شعيب بمعنى الحكم والفصل، وهو عند رضا كل فتح بين فريقين. ينقل رضا أثراً عن ابن عباس في أن الفتاحة في لغة اليمن والمقاضاة، ويرى أن الأثر يدل على أنها ليست قرشية بهذا المعنى، ويعرض قول السدي بأنها يمانية."
  en: "In Rida's reading, fath in Shu'ayb's prayer means judgment and decision between two sides. He reports a narration from Ibn Abbas that he had not understood the word until a woman of Yemen said 'come, let me judge with you', and an Arab woman said 'between me and you is the fattah'; he infers from the Arabic usage that the sense is not Quraysh's, and cites al-Suddi's view that the word is Yemeni."
  es: "Según la interpretación de Rida, en la oración de Shu'ayb, fath significa juicio y decisión entre dos partes. Relata una narración de Ibn Abbas en la que afirma que no había comprendido la palabra hasta que una mujer de Yemen le dijo: «Ven, déjame juzgar contigo», y una mujer árabe respondió: «Entre tú y yo está la fattah». Deduce del uso árabe que el significado no es propio de los Quraysh, y cita la opinión de al-Suddi de que la palabra es yemení."
  fr: "Selon l'interprétation de Rida, le terme « fath » dans la prière de Shu'ayb signifie jugement et décision entre deux parties. Il rapporte d'après Ibn Abbas que ce dernier n'avait pas compris le sens de ce mot jusqu'à ce qu'une Yéménite dise: « Viens, que je juge avec toi », et qu'une Arabe réponde: « Entre nous deux, il y a la fattah ». Rida en déduit de l'usage arabe que ce sens n'est pas propre aux Qurayshites et cite l'avis d'al-Suddi selon lequel le mot est yéménite."
  ur: "ردا کے پڑھنے میں، شعیب کی نماز میں فتح کا مطلب ہے فیصلہ اور دونوں فریقوں کے درمیان فیصلہ۔ وہ ابن عباس سے روایت کرتے ہیں کہ وہ اس لفظ کو اس وقت تک سمجھ نہیں پائے تھے جب تک یمن کی ایک عورت نے یہ نہ کہا کہ آؤ میں تمہارے ساتھ فیصلہ کروں، اور ایک عرب عورت نے کہا کہ میرے اور تمہارے درمیان فتویٰ ہے۔ اس نے عربی استعمال سے اندازہ لگایا کہ یہ معنی قریش کا نہیں ہے، اور السدی کے قول کا حوالہ دیتے ہیں کہ یہ لفظ یمنی ہے۔"
  tr: "Şuayb'a atfedilen duadaki El-Feth, yargı ve ayrılık anlamına gelir ve bu, Ridha'ya (iki grup arasındaki her fetihin görüşüne) göre doğrudur. Ridha, İbn Abbas'tan 'el-fetha'nın Yemen dilinde, 'muqadah' ise kelimesinin yer aldığını bildirir ve rivayetin bu anlamda Kureyş olmadığını gösterdiğine inanır; ayrıca El-Suddi'nin Yemenli olduğu görüşünü reddeder."
  id: "Al-Fath dalam doa yang dikaitkan dengan Shu'ayb berarti penghakiman dan pemisahan, dan menurut Ridha (pendapat setiap penaklukan antara dua kelompok). Ridha melaporkan dari Ibn Abbas bahwa 'al-fatha' dalam bahasa Yaman dan 'al-muqadah', dan ia percaya riwayat tersebut menunjukkan bahwa itu bukan Quraisy dalam arti ini, dan ia membantah pandangan Al-Suddi bahwa itu adalah bahasa Yaman."
