id: concept/fath-bayn-al-qawm
class: concept
kind: term
label: { ar: "الفتح بين القوم", en: "Fath between the people (judgment)" }
issue:
  ar: "ما معنى «افتح بيننا وبين قومنا بالحق»، ومن أين جاء لفظ الفتح بهذا المعنى؟"
summary:
  ar: "الفتح في الدعاء الوارد على لسان شعيب بمعنى الحكم والفصل، وهو عند رضا كل فتح بين فريقين. ينقل رضا أثراً عن ابن عباس في أن الفتاحة في لغة اليمن والمقاضاة، ويرى أن الأثر يدل على أنها ليست قرشية بهذا المعنى، ويعرض قول السدي بأنها يمانية."
  en: "In Rida's reading, fath in Shu'ayb's prayer means judgment and decision between two sides. He reports a narration from Ibn Abbas that he had not understood the word until a woman of Yemen said 'come, let me judge with you', and an Arab woman said 'between me and you is the fattah'; he infers from the Arabic usage that the sense is not Quraysh's, and cites al-Suddi's view that the word is Yemeni."
