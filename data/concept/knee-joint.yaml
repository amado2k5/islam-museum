label: { ar: "مفصل الركبة عند ابن سينا", en: "The knee joint in the Canon", ur: "قانون میں گھٹنے کا جوڑ", es: "La articulación de la rodilla en el Canon", fr: "L'articulation du genou dans le Canon" }
summary:
  ar: "يحدث مفصل الركبة بدخول الزائدتين اللتين على طرف الفخذ، وقد وُثقا برباط ملتف ورباط شاد في الغور ورباطين قويين من الجانبين، وتتهندم مقدمهما بالرصفة، وهي عين الركبة {cite:canon-ibn-sina-print-v1 p.59}."
  en: "The knee joint arises from the entry of the two processes at the end of the thigh bone. They are secured by a winding ligament, a binding ligament in the depth and two strong ligaments at the sides, and the front is fitted by the patella, the eye of the knee {cite:canon-ibn-sina-print-v1 p.59}."
  es: "La articulación de la rodilla se origina en la entrada de las dos apófisis en el extremo del fémur. Estas están fijadas por un ligamento sinuoso, un ligamento de unión en profundidad y dos ligamentos fuertes en los laterales, y la parte anterior está fijada por la rótula, el ojo de la rodilla {cite:canon-ibn-sina-print-v1 p.59}."
  fr: "L'articulation du genou résulte de l'insertion des deux processus situés à l'extrémité du fémur. Ces processus sont maintenus par un ligament croisé antérieur, un ligament conjonctif profond et deux ligaments latéraux robustes. La rotule, l'os du genou, s'emboîte en avant."
