summary:
  ar: "يحدث مفصل الركبة بدخول الزائدتين اللتين على طرف الفخذ، وقد وُثقا برباط ملتف ورباط شاد في الغور ورباطين قويين من الجانبين، وتتهندم مقدمهما بالرصفة، وهي عين الركبة {cite:canon-ibn-sina-print-v1 p.59}."
  en: "The knee joint arises from the entry of the two processes at the end of the thigh bone. They are secured by a winding ligament, a binding ligament in the depth and two strong ligaments at the sides, and the front is fitted by the patella, the eye of the knee {cite:canon-ibn-sina-print-v1 p.59}."
