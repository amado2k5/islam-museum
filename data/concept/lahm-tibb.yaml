  id: "Daging"
summary:
  ar: "اللحم غذاء مقوٍّ للبدن وأقرب غذاء استحالة إلى الدم، وأفضله لحم الضأن والفتي من الماعز والعجاجيل، ويختلف طبعه بحسب الحيوان والطبخ، وفي الكتاب ذكر ما يولده غليظه وما ينفع منه {cite:canon-ibn-sina-print-v1 p.550} {cite:canon-ibn-sina-print-v1 p.552}."
  en: "Meat is a food that strengthens the body and the nearest to turning into blood; the best is mutton, young goat and calves, and its temperament varies with the animal and the cooking; the book lists what thick meats breed and what some meats help {cite:canon-ibn-sina-print-v1 p.550} {cite:canon-ibn-sina-print-v1 p.552}."
  ur: "گوشت بدن کو قوت دینے والی غذا ہے اور خون میں بدلنے کے سب سے قریب؛ بہترین بھیڑ کا گوشت، بکری کا جوان اور بچھڑے ہیں، اور اس کا مزاج جانور اور پکانے کے لحاظ سے بدلتا ہے؛ کتاب میں ذکر ہے کہ گاڑھے گوشت کیا پیدا کرتے ہیں اور کون سے مفید ہیں {cite:canon-ibn-sina-print-v1 p.550} {cite:canon-ibn-sina-print-v1 p.552}۔"
  es: "La carne es un alimento que fortalece el cuerpo y es lo más cercano a convertirse en sangre; la mejor es la de cordero, cabra joven y terneros, y su temperamento varía según el animal y la cocción; el libro enumera qué carnes gruesas crían y qué carnes ayudan {cite:canon-ibn-sina-print-v1 p.550} {cite:canon-ibn-sina-print-v1 p.552}."
  fr: "La viande est un aliment qui fortifie le corps et se transforme en sang; les meilleures sont le mouton, le chevreau et les veaux, et son tempérament varie selon l'animal et la cuisson; le livre énumère les races de viandes épaisses et les bienfaits de certaines viandes {cite:canon-ibn-sina-print-v1 p.550} {cite:canon-ibn-sina-print-v1 p.552}."
  tr: "Et, vücudu güçlendiren ve kana en yakın besindir. En iyisi kuzu ve kuzu eti, özellikle keçi ve buzağıdır. Doğası hayvana ve pişirmeye göre değişir. Kitap, kalınlığının ne ürettiğini ve neyin fayda sağladığını belirtir {cite:canon-ibn-sina-print-v1 s.550} {cite:canon-ibn-sina-print-v1 s.552}."
  id: "Daging adalah makanan yang memperkuat tubuh dan merupakan makanan yang paling dekat dengan darah. Yang terbaik di antaranya adalah daging domba dan domba, terutama kambing dan anak sapi. Sifatnya bervariasi tergantung pada hewan dan masakannya. Buku ini menyebutkan apa yang dihasilkan ketebalannya dan manfaat darinya {cite:canon-ibn-sina-print-v1 hlm.550} {cite:canon-ibn-sina-print-v1 hlm.552}."
