id: concept/zij-sabi-altitude-from-the-hours-elapsed
class: concept
kind: scientific
label: { ar: "الارتفاع من قبل ما مضى من ساعات النهار في الزيج الصابي", en: "The altitude from the hours of the day that have passed", ur: "گزرے ہوئے گھنٹوں سے ارتفاع" }
summary:
  ar: "الباب السابع عشر عكس السادس عشر: يعرف البتاني الارتفاع من قبل ما مضى من الساعات منذ طلوع الشمس، فيحول الساعات إلى قوس بضربها في خمسة عشر إن كانت معتدلة أو في أزمان ساعات اليوم إن كانت زمانية، ثم يأخذ بعد الشمس عن وسط السماء، ويستعمل الوتر الراجع ووتر ارتفاع نصف النهار، فيخرج قوس الارتفاع قبل الزوال من ناحية المشرق وبعده من ناحية المغرب. {cite:zij-sabi-nallino-byblion p.50}."
  en: "Chapter 17 is the converse of chapter 16: al-Battani finds the altitude from the hours that have passed since sunrise. He turns the hours into an arc by multiplying by fifteen if they are equal or by the day's hour times if they are seasonal, then takes the Sun's distance from midheaven and uses the returned chord and the chord of the midday altitude, so that the arc of the altitude comes out, from the eastern side before midday and from the western after. {cite:zij-sabi-nallino-byblion p.50}."
  ur: "سترہواں باب سولہویں کا الٹ ہے: البتانی طلوع آفتاب کے بعد گزرے ہوئے گھنٹوں سے ارتفاع معلوم کرتے ہیں۔ وہ گھنٹوں کو قوس میں بدلتے ہیں، معتدل ہوں تو پندرہ سے ضرب دے کر اور زمانی ہوں تو اس دن کے گھنٹوں کے اوقات سے، پھر سورج کا وسط السماء سے بعد لیتے ہیں اور وتر راجع اور دوپہر کے ارتفاع کے وتر کو استعمال کرتے ہیں، یوں ارتفاع کی قوس نکلتی ہے جو زوال سے پہلے مشرق کی جانب اور بعد میں مغرب کی جانب ہوتی ہے۔ {cite:zij-sabi-nallino-byblion p.50}۔"
