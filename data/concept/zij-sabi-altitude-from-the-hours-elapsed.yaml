class: concept
kind: scientific
label: { ar: "الارتفاع من قبل ما مضى من ساعات النهار في الزيج الصابي", en: "The altitude from the hours of the day that have passed", ur: "گزرے ہوئے گھنٹوں سے ارتفاع", es: "La altitud de las horas del día que han pasado", fr: "L'altitude en fonction des heures de la journée qui se sont écoulées" }
summary:
  ar: "الباب السابع عشر عكس السادس عشر: يعرف البتاني الارتفاع من قبل ما مضى من الساعات منذ طلوع الشمس، فيحول الساعات إلى قوس بضربها في خمسة عشر إن كانت معتدلة أو في أزمان ساعات اليوم إن كانت زمانية، ثم يأخذ بعد الشمس عن وسط السماء، ويستعمل الوتر الراجع ووتر ارتفاع نصف النهار، فيخرج قوس الارتفاع قبل الزوال من ناحية المشرق وبعده من ناحية المغرب. {cite:zij-sabi-nallino-byblion p.50}."
  en: "Chapter 17 is the converse of chapter 16: al-Battani finds the altitude from the hours that have passed since sunrise. He turns the hours into an arc by multiplying by fifteen if they are equal or by the day's hour times if they are seasonal, then takes the Sun's distance from midheaven and uses the returned chord and the chord of the midday altitude, so that the arc of the altitude comes out, from the eastern side before midday and from the western after. {cite:zij-sabi-nallino-byblion p.50}."
  ur: "سترہواں باب سولہویں کا الٹ ہے: البتانی طلوع آفتاب کے بعد گزرے ہوئے گھنٹوں سے ارتفاع معلوم کرتے ہیں۔ وہ گھنٹوں کو قوس میں بدلتے ہیں، معتدل ہوں تو پندرہ سے ضرب دے کر اور زمانی ہوں تو اس دن کے گھنٹوں کے اوقات سے، پھر سورج کا وسط السماء سے بعد لیتے ہیں اور وتر راجع اور دوپہر کے ارتفاع کے وتر کو استعمال کرتے ہیں، یوں ارتفاع کی قوس نکلتی ہے جو زوال سے پہلے مشرق کی جانب اور بعد میں مغرب کی جانب ہوتی ہے۔ {cite:zij-sabi-nallino-byblion p.50}۔"
  es: "El capítulo 17 es el inverso del capítulo 16: al-Battani calcula la altitud a partir de las horas transcurridas desde el amanecer. Transforma las horas en un arco multiplicándolas por quince si son iguales o por las horas del día si son estacionales. Luego, toma la distancia del Sol al centro del cielo y utiliza la cuerda resultante y la cuerda de la altitud del mediodía, de modo que el arco de la altitud se obtiene desde el lado oriental antes del mediodía y desde el occidental después. {cite:zij-sabi-nallino-byblion p.50}."
  fr: "Le chapitre 17 est l'inverse du chapitre 16: al-Battani calcule la hauteur du soleil à partir des heures écoulées depuis le lever du soleil. Il transforme ces heures en un arc en les multipliant par quinze si elles sont égales, ou par le nombre d'heures du jour si elles varient selon la saison. Il prend ensuite la distance du soleil par rapport au milieu du ciel et utilise la corde obtenue par retour et la corde de la hauteur à midi pour tracer l'arc de la hauteur, à l'est avant midi et à l'ouest après. {cite:zij-sabi-nallino-byblion p.50}."
