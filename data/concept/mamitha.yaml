summary:
  ar: "ماميثا أمثال بلاليظ صفر اللون إلى السواد سهلة الكسر، فيها مرارة وجوهر مائي وأرضي، باردة يابسة في الأولى قابضة، تنفع الأورام الحارة الغليظة والحمرة، وفي أدوية الرمد في ابتدائه {cite:canon-ibn-sina-print-v1 p.567}."
  en: "Mamitha is a drug in lumps, yellow to black, easily broken, with bitterness and a watery and an earthy substance, cold and dry in the first degree and astringent; it helps thick hot swellings and erysipelas, and is used in remedies for ophthalmia at its onset {cite:canon-ibn-sina-print-v1 p.567}."
  ur: "مامیثا ڈلیوں کی صورت کی دوا ہے، زرد سے سیاہ رنگ کی، آسانی سے ٹوٹنے والی، جس میں کڑواہٹ اور پانی اور مٹی کا جوہر ہے؛ پہلے درجے میں ٹھنڈی خشک اور قابض ہے، موٹے گرم ورموں اور سرخ ہوا میں مفید ہے، اور آشوبِ چشم کی ابتدا کی دواؤں میں استعمال ہوتی ہے {cite:canon-ibn-sina-print-v1 p.567}۔"
  es: "Mamitha es un medicamento en terrones, de color amarillo a negro, que se rompe fácilmente, con sabor amargo y una sustancia acuosa y terrosa, fría y seca en primer grado y astringente; ayuda a las hinchazones espesas y calientes y a la erisipela, y se usa en remedios para la oftalmía en su inicio {cite:canon-ibn-sina-print-v1 p.567}."
  fr: "La Mamitha est un médicament en grumeaux, jaunes à noirs, facilement cassables, avec une amertume et une substance aqueuse et terreuse, froide et sèche au premier degré et astringente; elle aide les gonflements chauds et épais et l'érysipèle, et est utilisée dans les remèdes contre l'ophtalmie à son début {cite:canon-ibn-sina-print-v1 p.567}."
  tr: "Mametha, sarımsı siyaha kadar balaliz gibidir, kolayca kırılabilir, safra kesesi ve sulu ile topraksı öz içerir, ilki soğuk ve kurudur, büzücüdür, kalın ve kırmızı sıcak tümörler için faydalıdır ve başlangıçta göz hastalıkları ilaçlarında kullanılır {cite:canon-ibn-sina-print-v1 s.567}."
  id: "Mametha mirip balaliz kekuningan hingga hitam, mudah pecah, mengandung kantong empedu dan esensi berair serta tanah, dingin dan kering pada yang pertama, astringen, berguna untuk tumor tebal dan merah panas, dan dalam pengobatan oftalmologi di awal {cite:canon-ibn-sina-print-v1 hlm.567}."
