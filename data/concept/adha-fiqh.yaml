id: concept/adha-fiqh
class: concept
kind: legal
label:
  ar: "أذى"
  en: "Adha (harm of a slight kind: removing harmful things and the duty not to harm)"
  ur: "اذی (معمولی تکلیف: نقصان دہ چیزوں کو ہٹانا اور تکلیف نہ دینے کا حکم)"
summary:
  ar: "الأذى في اللغة المكروه اليسير، والفقهاء يفرقون بينه وبين الضرر الجسيم. وهو في الأصل حرام وتركه واجب بالاتفاق ما لم يعارض بما هو أشد، ويندب إزالة الأشياء المؤذية للمسلمين أينما وجدت، ويقتل الحيوان المؤذي دفعا لأذاه، ولا يقتل في بلاد الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2006}"
  en: "Adha in the lexicon is a slight unwelcome thing, and the jurists separate it from grave harm (darar). Harming is forbidden in principle and avoiding it is obligatory by agreement, unless it is set against a greater harm. Removing harmful things from Muslims wherever they are is recommended, a harmful animal may be killed to stop its harm even in the sanctuary, and it is not killed in enemy territory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2006}"
  ur: "اذی لغت میں ایسی ناپسندیدہ چیز کو کہتے ہیں جو معمولی ہو، اور فقہاء اسے بڑے نقصان (ضرر) سے الگ کرتے ہیں۔ تکلیف دینا اصلاً حرام ہے اور اس سے بچنا بالاتفاق واجب ہے، جب تک اس سے بڑا نقصان اس کے مقابل نہ ہو۔ مسلمانوں کے لیے نقصان دہ چیزوں کو جہاں بھی ہوں ہٹانا مستحب ہے، نقصان دہ جانور کو حرم میں بھی تکلیف رفع کرنے کے لیے مارا جا سکتا ہے، اور دارالحرب میں اسے نہیں مارا جاتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2006}"
