label:
  ar: الإسراف والتبذير
  en: Extravagance and waste (israf)
  es: "Extravagancia y despilfarro (israf)"
  fr: "Extravagance et gaspillage (israf)"
  ur: "اسراف اور فضول خرچی ⁦(اسراف)⁩"
  tr: "Savurganlık ve israf"
  id: "Kemewahan dan pemborosan"
summary:
  ar: "الإسراف عند قعدات تجاوز الحد في الاستهلاك والإنفاق، وهو الخط الذي يحذّر منه القرآن ضمن الاعتدال، فكل ما أحل الله مباح دون إسراف أو تقتير {cite:qadan-manhaj-iqtisad-quran p. 22}. ويعدّه من أمراض المجتمعات الرأسمالية والشيوعية، فالإسراف على النفس وتبديد الموارد أدّيا عنده إلى البطالة والتضخم وندرة السلع {cite:qadan-manhaj-iqtisad-quran p. 11}. ويعدّ سوء استخراج النفط وإهمال الحبوب مثالين على استنزاف الموارد الذي يحرم الأجيال القادمة {cite:qadan-manhaj-iqtisad-quran p. 58}، ويرى أن ثروة الكون ملك للإنسان عبر مسيرته الطويلة، وأن الأجيال القادمة تدخل في الحساب {cite:qadan-manhaj-iqtisad-quran p. 25}. يعرّف المؤلف الإسراف بأنه الإنفاق في حرام ولو قل، أو الإنفاق في مباح إذا زاد على الحد، ويجعل التبذير أشد منه، والترف أشد من التبذير وحرامًا، ويمنع التقتير أيضًا."
  tr: "Savurganlık, tüketim ve harcama sınırlarını aşan toplantılarda gerçekleşir; Kur'an, ölçülü bir şekilde buna karşı uyarır. Allah'ın izin verdiği her şey, savurganlık veya cimrilik olmadan kabul edilir {cite:qadan-manhaj-iqtisad-kur'an s. 22}. Bunu kapitalist ve komünist toplumların hastalıklarından biri olarak görür; çünkü savurganlık ve kaynakların israfı işsizlik, enflasyon ve mal kıtlığına yol açmıştır {cite:qadan-manhaj-iqtisad-kur'an s. 11}. Kötü petrol çıkarımı ve tahılların ihmal edilmesi, gelecek nesilleri yok eden kaynak tükenmesine örnektir {atıf:qadan-manhaj-iqtisad-kur'an s. 58} ve evrenin zenginliğinin uzun yolculukları boyunca insanlara ait olduğuna, gelecek nesillerin de bu hesaba dahil edildiğine inanır {cite:qadan-manhaj-iqtisad-kur'an s. 25}. Yazar, savurganlığı, yasak olan şeylere harcamak, az da olsa harcamak ya da sınırı aşan izin verilen şeylere harcamak olarak tanımlar; bu da savurganlığı daha ağır, lüksü israftan daha ağır yapar ve ayrıca cimriliği yasaklar."
  id: "Kemewahan terjadi dalam pertemuan yang melebihi batas konsumsi dan pengeluaran; Al-Qur'an memperingatkan hal ini dengan sewajarnya. Segala sesuatu yang Allah izinkan diterima tanpa boros atau kekikiran {cite:qadan-manhaj-iqtisad-qur'an hlm. 22}. Ia melihat ini sebagai salah satu penyakit masyarakat kapitalis dan komunis; karena kemewahan dan pemborosan sumber daya telah menyebabkan pengangguran, inflasi, dan kelangkaan barang {cite:qadan-manhaj-iqtisad-qur'an hlm. 11}. Ekstraksi minyak yang buruk dan pengabaian biji-bijian adalah contoh penipisan sumber daya yang menghancurkan generasi mendatang {sitasi: qadan-manhaj-iqtisad-qur'an hlm. 58} dan percaya bahwa kekayaan alam semesta adalah milik manusia sepanjang perjalanan panjang mereka, dan generasi mendatang termasuk dalam perhitungan ini {cite:qadan-manhaj-iqtisad-qur'an hlm. 25}. Penulis mendefinisikan kemewahan sebagai pengeluaran untuk hal-hal terlarang, pengeluaran sedikit, atau untuk hal-hal yang diperbolehkan melebihi batas; ini membuat kemewahan lebih berat, kemewahan lebih berat daripada pemborosan, dan juga melarang kekikikan."
