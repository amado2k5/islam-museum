label:
  ar: الإسراف والتبذير
  en: Extravagance and waste (israf)
summary:
  ar: "الإسراف عند قعدات تجاوز الحد في الاستهلاك والإنفاق، وهو الخط الذي يحذّر منه القرآن ضمن الاعتدال، فكل ما أحل الله مباح دون إسراف أو تقتير {cite:qadan-manhaj-iqtisad-quran p. 22}. ويعدّه من أمراض المجتمعات الرأسمالية والشيوعية، فالإسراف على النفس وتبديد الموارد أدّيا عنده إلى البطالة والتضخم وندرة السلع {cite:qadan-manhaj-iqtisad-quran p. 11}. ويعدّ سوء استخراج النفط وإهمال الحبوب مثالين على استنزاف الموارد الذي يحرم الأجيال القادمة {cite:qadan-manhaj-iqtisad-quran p. 58}، ويرى أن ثروة الكون ملك للإنسان عبر مسيرته الطويلة، وأن الأجيال القادمة تدخل في الحساب {cite:qadan-manhaj-iqtisad-quran p. 25}. يعرّف المؤلف الإسراف بأنه الإنفاق في حرام ولو قل، أو الإنفاق في مباح إذا زاد على الحد، ويجعل التبذير أشد منه، والترف أشد من التبذير وحرامًا، ويمنع التقتير أيضًا."
