  id: "Egyptian Fork"
summary:
  ar: "شوكة المصرية في الكتاب باردة في الأولى يابسة في الثانية، مجففة قاطعة للنوازل، أصلها وخاصة بزرها شديد الإدمال، وتنفع من ورم الحلق ومن ورم المعدة {cite:canon-ibn-sina-print-v1 p.685}"
  en: "Shawka misriyya is in the book cold in the first degree and dry in the second, drying and cutting catarrhs; its root, and especially its seed, is strongly healing of wounds, and it benefits swelling of the throat and swelling of the stomach {cite:canon-ibn-sina-print-v1 p.685}"
  ur: "شوکۃ المصریہ کتاب میں پہلے درجے میں سرد اور دوسرے میں خشک ہے، خشک کرنے والی اور نزلات کو کاٹنے والی؛ اس کی جڑ اور خاص طور پر بیج زخم بھرنے میں بہت شدید ہے، اور حلق کے ورم اور معدے کے ورم میں نافع ہے {cite:canon-ibn-sina-print-v1 p.685}۔"
  es: "Shawka misriyya es en el libro fría en primer grado y seca en segundo, secando y reduciendo los catarros; su raíz, y especialmente su semilla, es muy curativa para las heridas, y beneficia la inflamación de la garganta y del estómago {cite:canon-ibn-sina-print-v1 p.685}"
  fr: "Shawka misriyya est décrite dans le livre comme froide au premier degré et sèche au second, asséchante et coupant les catarrhes; sa racine, et surtout sa graine, est fortement cicatrisante pour les plaies, et elle est bénéfique en cas d'enflure de la gorge et d'enflure de l'estomac {cite:canon-ibn-sina-print-v1 p.685}"
  tr: "Kitaptaki Mısır dikeni ilkinde soğuk, ikincisinde kuru, ikincisinde kuru ve kesin, kökeni, özellikle tohumu, çok kanlıdır ve boğaz ağrısı ile mide tümörleri için faydalıdır {cite:canon-ibn-sina-print-v1 s.685}"
  id: "Duri Mesir dalam buku ini dingin pada yang pertama dan kering pada yang kedua, kering dan menentukan pada yang kedua, asal-usulnya, terutama bijinya, sangat berdarah, dan bermanfaat untuk sakit tenggorokan serta tumor lambung {cite:canon-ibn-sina-print-v1 hlm.685}"
