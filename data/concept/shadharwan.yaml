id: concept/shadharwan
class: concept
kind: legal
label:
  ar: "الشَّاذَرْوان"
  en: "Shadharwan (the ledge at the foot of the Kaaba wall)"
summary:
  ar: "الشاذروان الإفريز المسلّم الخارج عن عرض جدار البيت الحرام نحو ثلثي ذراع، تركته قريش عند تجديد البناء، ويسمى تأزيرا لأنه كالإزار للبيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} وذهب المالكية والشافعية والحنابلة إلى أنه من الكعبة، وذهب الحنفية إلى أنه بناء وضع أسفل الجدار احتياطا، وأنكر جماعة من المتأخرين كونه من البيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888} والجمهور يوجبون خروج جميع بدن الطائف عنه، والحنفية يصححون الطواف فوقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888}"
  en: "The shadharwan is the smooth ledge that projects from the base of the wall of the Sacred House by about two-thirds of a cubit; Quraysh left it when they rebuilt the house, and it is called ta'zir because it is like a waist-wrap for the house. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} The Malikis, Shafi'is and Hanbalis hold it part of the Kaaba; the Hanafis hold it a foundation built beneath the wall as a precaution, and some later Malikis deny it is part of the house. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888} The majority require that the whole body of the circumambulant be outside it; the Hanafis allow circling over it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888}"
