id: concept/shadharwan
class: concept
kind: legal
label:
  ar: "الشَّاذَرْوان"
  en: "Shadharwan (the ledge at the foot of the Kaaba wall)"
  es: "Shadharwan (la cornisa al pie del muro de la Kaaba)"
  fr: "Shadharwan (le rebord au pied du mur de la Kaaba)"
  ur: "شدھروان ⁦(دیوار کعبہ کے دامن میں کنارے)⁩"
summary:
  ar: "الشاذروان الإفريز المسلّم الخارج عن عرض جدار البيت الحرام نحو ثلثي ذراع، تركته قريش عند تجديد البناء، ويسمى تأزيرا لأنه كالإزار للبيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} وذهب المالكية والشافعية والحنابلة إلى أنه من الكعبة، وذهب الحنفية إلى أنه بناء وضع أسفل الجدار احتياطا، وأنكر جماعة من المتأخرين كونه من البيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888} والجمهور يوجبون خروج جميع بدن الطائف عنه، والحنفية يصححون الطواف فوقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888}"
  en: "The shadharwan is the smooth ledge that projects from the base of the wall of the Sacred House by about two-thirds of a cubit; Quraysh left it when they rebuilt the house, and it is called ta'zir because it is like a waist-wrap for the house. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} The Malikis, Shafi'is and Hanbalis hold it part of the Kaaba; the Hanafis hold it a foundation built beneath the wall as a precaution, and some later Malikis deny it is part of the house. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888} The majority require that the whole body of the circumambulant be outside it; the Hanafis allow circling over it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888}"
  es: "El shadharwan es la cornisa lisa que sobresale de la base del muro de la Casa Sagrada aproximadamente dos tercios de codo; los Quraysh la dejaron cuando reconstruyeron la casa, y se llama ta'zir porque es como una faja para la casa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} Los malikíes, shafi'ís y hanbalíes lo sostienen como parte de la Kaaba; los hanafíes sostienen que es una base construida debajo del muro como precaución, y algunos malikíes posteriores niegan que sea parte de la casa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888} La mayoría exige que todo el cuerpo del circunvalador esté fuera de él; los hanafíes permiten dar vueltas sobre él. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888}"
  fr: "Le shadharwan est le rebord lisse qui fait saillie d'environ deux tiers de coudée à la base du mur de la Kaaba. Les Qurayshites l'ont conservé lors de la reconstruction du temple; on l'appelle ta'zir car il forme une sorte de ceinture autour de la maison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} Les écoles malikite, chaféite et hanbalite le considèrent comme faisant partie intégrante de la Kaaba; les hanafites, quant à eux, le voient comme une fondation construite sous le mur par précaution, et certains malikites plus tardifs nient qu'il en fasse partie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888} La majorité des écoles de pensée exigent que le pèlerin se trouve entièrement à l'extérieur du shadharwan; les hanafites autorisent le passage au-dessus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9888}"
  ur: "شاداروان ایک ہموار کنارہ ہے جو مقدس گھر کی دیوار کی بنیاد سے تقریباً دو تہائی ایک ہاتھ سے نکلتا ہے۔ قریش نے گھر کو دوبارہ تعمیر کرتے وقت اسے چھوڑ دیا تھا اور اسے تذیر کہا جاتا ہے کیونکہ یہ گھر کے لیے کمر کی لپیٹ کی طرح ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9887} مالکیہ، شافعی اور حنبلی اسے کعبہ کا حصہ سمجھتے ہیں۔ احناف احتیاط کے طور پر اسے دیوار کے نیچے ایک بنیاد قرار دیتے ہیں، اور بعد میں کچھ مالکیوں نے اسے گھر کا حصہ قرار دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9887} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص9888} جمہور کا تقاضا ہے کہ طواف کرنے والے کا پورا جسم اس سے باہر ہو۔ احناف اس پر چکر لگانے کی اجازت دیتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص9888}"
