id: "concept/asbab-al-sakta"
class: "concept"
kind: "scientific"
label:
  ar: "أنواع السكتة وأسبابها"
  en: "Kinds and causes of apoplexy"
  fr: "Formes et causes de l’apoplexie"
  ur: "سکتہ کی اقسام اور اسباب"
  es: "Tipos y causas de la apoplejía"
  tr: "İnme türleri ve nedenleri"
  id: "Jenis-jenis stroke dan penyebabnya"
summary:
  ar: "انسداد السكتة إما لانطباق — أن يصل إلى الدماغ ما يؤذيه فينقبض أو تصله كيفية قابضة مكثفة كالبرد الشديد — وإما لامتلاء مورّم أو غير مورّم: خلط دموي أو بلغمي ينصبّ إلى البطون، أو انسداد الشرايين والعروق الصاعدة من شدة الامتلاء فتختنق الروح {cite:canon-ibn-sina-print-v2 p.131}"
  en: "Apoplexy's obstruction is either by compression — something harmful reaching the brain and contracting it, or a condensing quality like severe cold reaching it — or by fullness, with or without swelling: a sanguine or phlegmatic humour pouring into the ventricles, or the ascending arteries and veins blocked by extreme fullness so the pneuma chokes {cite:canon-ibn-sina-print-v2 p.131}"
  fr: "L’obstruction de l’apoplexie relève soit de la compression — quelque chose de nuisible atteint le cerveau et le contracte, ou une qualité condensante comme un froid intense l’atteint — soit de la plénitude, avec ou sans gonflement : une humeur sanguine ou flegmatique se déverse dans les ventricules, ou les artères et les veines ascendantes sont obstruées par une plénitude extrême, étouffant le pneuma {cite:canon-ibn-sina-print-v2 p.131}"
  ur: "سکتہ کا انسداد یا تو انطباق سے ہوتا ہے — دماغ تک کوئی نقصان پہنچانے والا پہنچ کر اسے قبض دے یا اس تک کوئی قابض مکثف کیفیت پہنچے جیسے سخت سردی — یا امتلاء سے، ورم کے ساتھ یا بغیر: دموی یا بلغمی خلط کا بطون کی طرف انصباب، یا صاعد شریانوں اور عروق کا شدت امتلاء سے بند ہونا تو روح دم گھٹے {cite:canon-ibn-sina-print-v2 p.131}۔"
  es: "La obstrucción de la apoplejía se produce por compresión —algo dañino que llega al cerebro y lo contrae, o una cualidad condensante como un frío intenso que lo alcanza— o por plenitud, con o sin hinchazón: un humor sanguíneo o flemático que se derrama en los ventrículos, o las arterias y venas ascendentes bloqueadas por una plenitud extrema, de modo que el pneuma se asfixia {cite:canon-ibn-sina-print-v2 p.131}"
  tr: "İnme tıkanıklığı ya daralma nedeniyle — beyne zarar veren ve şiddetli soğuk algınlığı gibi yoğun büzücü bir şekilde kasılan ya da şişmiş ya da şişmemiş dolgu içindir: karına ulaşan kanlı veya flegmatik bir karışım ya da dolgunluğun yoğunluğundan dolayı arterlerin ve yükselen damarların tıkanması, ruhu boğar {cite:canon-ibn-sina-print-v2 s.131}"
  id: "Penyumbatan stroke bisa disebabkan oleh penyempitan — sesuatu yang merusak otak dan mengkontraksi atau mencapai otak dengan cara yang sangat asam seperti flu parah — atau karena tambalan yang bengkak atau tidak bengkak: campuran berdarah atau berdahak yang mencapai perut, atau penyumbatan arteri dan pembuluh darah naik akibat intensitas kenyang, yang mencekik jiwa {cite:canon-ibn-sina-print-v2 hlm.131}"
