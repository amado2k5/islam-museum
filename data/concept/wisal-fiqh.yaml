  en: "Wisal (continuous fasting)"
summary:
  ar: "الوِصال في الصوم عند جمهور الفقهاء أن يصوم يومين فأكثر لا فِطرَ بينهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} وعند بعض الشافعية أن يصوم يومين فأكثر ولا يتناول ليلاً مطعوماً عمداً بلا عذر، فالجماع ونحوه لا يمنع الوصال عندهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} وقال بعض الحنفية: هو أن يصوم السنة كلها ولا يفطر في الأيام المنهي عن صيامها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17210} ذهب جمهور الفقهاء (الحنفية والمالكية والحنابلة وبعض الشافعية) إلى كراهة الوصال في حق الأمة، لأن النهي وقع رفقاً ورحمة، وعند الشافعية في الأصح أنه محرّم على الأمة، وهو في حق النبي مباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17210}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17211} ومن السلف من فصّل فأباحه لمن لم يشق عليه ولم يقصد التشبه بأهل الكتاب ولم يرغب عن السنة في تعجيل الفطر، ونُقل ذلك عن عبد الله بن الزبير وجماعة من التابعين، واستدلوا بأن النبي واصل بأصحابه بعد النهي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17211} وفي حق النبي ذهب الجمهور إلى إباحة الوصال، وقال إمام الحرمين إنه قربة في حقه. وفي معنى «أظل عند ربي يطعمني ويسقيني» أقوال: أن الله يطعمه من طعام الجنة، أو أنه يُعطى قوة الطاعم الشارب، أو أن محبة الله تشغله عن الطعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17211}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17212} ولا يكره الحنابلة الوصال إلى السحر، ويرون تركه أولى محافظة على تعجيل الفطر السنّي؛ والشافعية يرون أن تأخير الأكل إلى السحر لمقصد صحيح أو غيره ليس وصالاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17212}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17213} والحكمة من النهي عند الشافعية أن لا يضعف المواصل عن الصيام والصلاة والطاعات أو يسأم منها أو يتضرر بدنه، وعند الحنابلة النهي رفق ورحمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17213} والوصال لا يبطل الصوم عند الشافعية وعامة الفقهاء، لأن النهي لا يعود إلى ذات الصوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17213} وعند جمهور الفقهاء أن الجماع في ليل الوصال يمنعه، لأن المجامع لا يستديم جميع أوصاف الصائمين، وقال بعض الشافعية لا يخرجه عن حكم الوصال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17213}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17214} أما الوصال في الصلاة فلم يعرّفه كثير من الفقهاء، وقد نهى النبي عن المواصلة في الصلاة، وذكر الشافعي لأحمد صوراً منها: أن يصل المأموم «آمين» بقول الإمام «ولا الضالين»، وأن يصل الإمام القراءة بالتكبير، وأن يصل المأموم تكبيرة الإحرام بتكبيرة الإمام، وأن يصل تسليمتي الفرض بعضهما ببعض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17214} وذكر الغزالي خمس صور لذلك، وفصّل الفقهاء أحكامها: ومن ذلك أن وصل المأموم تكبيرة الإحرام بتكبيرة الإمام مختلف في صحة صلاته، وأن التأمين يُستحب أن يكون بعد سكتة لطيفة بعد الفاتحة، وأن الجمهور على أن الفصل بين تكبيرة الإحرام والقراءة بدعاء الاستفتاح سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17214}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17215}"
  en: "In fasting, wisal means, for most jurists, fasting two or more days with no break between them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} Some Shafi'is define it as fasting two or more days without taking any food on purpose during the night without excuse; by their view intercourse at night does not turn it into a different case. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} Some Hanafis define it as fasting the whole year and not breaking the fast on the days when fasting is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17210} Most jurists (Hanafis, Malikis, Hanbalis and some Shafi'is) hold wisal disliked for the community, because the prohibition was an act of mercy; the preferred Shafi'i view is that it is forbidden for the community and permitted for the Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17210}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17211} Some early authorities distinguished: permitted for one who is not harmed, who does not imitate the People of the Book and does not turn away from the sunna of breaking the fast early; this is reported of Ibn al-Zubayr and some Successors, who argued that the Prophet himself continued fasting with his companions after the prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17211} For the Prophet, most jurists hold wisal permitted; Imam al-Haramayn holds it an act of devotion for him. Among the views on his words that he is fed and watered by his Lord: the food is from Paradise; or he is given the strength of one who eats and drinks; or the love of God occupies him from food. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17211}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17212} The Hanbalis do not hold wisal until suhur disliked, though leaving it is better for keeping the sunna of early breaking; the Shafi'is hold that delaying the meal to suhur for any proper purpose is not wisal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17212}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17213} The Shafi'is give as the reason for the prohibition that the one who continues may grow weak in fasting, prayer and other acts, or tire of them, or harm his body; the Hanbalis say it is mercy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17213} Wisal does not void the fast, according to the Shafi'is and most jurists, because the prohibition does not concern the fast itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17213} Most jurists hold that intercourse on a night of wisal ends it, because the one who has intercourse does not keep all the features of a fasting person; some Shafi'is say it does not leave the case of wisal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17213}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17214} On wisal in prayer, few jurists define it; a hadith forbids continuing in prayer, and al-Shafi'i, as reported to Ahmad, lists cases such as the follower saying amin together with the imam's 'wa la al-dallin', the imam joining the takbir to the recitation, the follower joining his opening takbir to the imam's, and joining the two final salutations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17214} Al-Ghazali lists five cases and the jurists give rulings for them: whether a follower's opening takbir joined to the imam's invalidates his prayer is disputed; amin is recommended after a short pause following the Fatiha; and the majority hold that a pause between the opening takbir and the recitation, by the opening supplication, is sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17214}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17215}"
