id: concept/ghuraf-al-jannah
class: concept
kind: belief
label:
  ar: "غرفات الجنة"
  en: "The Chambers of Paradise"
  ur: "جنت کے غرفے"
  es: "Las Cámaras del Paraíso"
  fr: "Les Chambres du Paradis"
  tr: "Cennet Odaları"
  id: "Kamar Surga"
summary:
  ar: "الغرفات منازل مرتفعة في الجنة، قال تعالى: «أولئك يجزون الغرفة بما صبروا ويلقون فيها تحية وسلاما»، و«لكن الذين اتقوا ربهم لهم غرف من فوقها غرف مبنية تجري من تحتها الأنهار وعد الله لا يخلف الله الميعاد»، وقال رسول الله: «إن في الجنة لغرفة يظهر ظاهرها من باطنها وباطنها من ظاهرها»."
  en: "The chambers are lofty dwellings in Paradise. God says «those are recompensed with the chamber for what they patiently endured, and are greeted therein with greeting and peace», and «the godfearing have chambers above which are built chambers, beneath which rivers run — the promise of God; God does not fail the tryst». The Prophet said: «In Paradise there is a chamber whose outside shows from within and whose inside shows from without»."
  ur: "غرفے جنت میں بلند رہائشیں ہیں۔ اللہ فرماتا ہے «انہیں ان کے صبر کے بدلے غرفہ دیا جائے گا جس میں انہیں سلام کیا جائے گا» اور «پرہیزگاروں کے لیے غرفے ہیں جن کے اوپر بنے ہوئے غرفے ہیں جن کے نیچے نہریں بہتی ہیں»۔ نبی نے فرمایا: «جنت میں ایک غرفہ ہے جس کا باہر اندر سے اور اندر باہر سے دکھائی دیتا ہے»۔"
  es: "Las cámaras son moradas elevadas en el Paraíso. Dios dice: «Aquellos son recompensados con la cámara por lo que soportaron con paciencia, y allí son recibidos con saludo y paz», y «los temerosos de Dios tienen cámaras sobre las cuales se construyen cámaras, bajo las cuales corren ríos: la promesa de Dios; Dios no falta a la cita». El Profeta dijo: «En el Paraíso hay una cámara cuyo exterior se ve desde dentro y cuyo interior se ve desde fuera»."
  fr: "Les chambres sont de somptueuses demeures au Paradis. Dieu dit: « Ceux qui ont patiemment enduré reçoivent en récompense ces chambres, et y sont accueillis par la paix et la bienveillance. » Et: « Les pieux possèdent des chambres au-dessus desquelles sont construites d’autres chambres, sous lesquelles coulent des rivières – promesse de Dieu; Dieu ne manque jamais à sa parole. » Le Prophète a dit: « Au Paradis, il existe une chambre dont l’extérieur se voit de l’intérieur et dont l’intérieur se voit de l’extérieur. »"
  tr: "Odalar cennette yüksek makamlardır. Yüce Allah şöyle dedi: \"Sabretleri karşılanır ve orada selam ve selamla karşılanırlar.\" Ama Rablerinden korkanlar, üzerinde nehirlerin akar odaları vardır. Allah'ın vaatleri, Allah'ın vaatinden tutuklanmamasıdır. Allah Resulubu şöyle dedi: \"Cennette dış görünüşü içten, içi dıştan görünen bir oda vardır.\""
  id: "Kamar-kamar itu adalah tempat tinggi di Surga. Allah Yang Maha Tinggi berfirman: \"Mereka akan diberi ganjaran atas kesabaran mereka dan akan disambut di dalamnya dengan salam dan damai.\" Tetapi mereka yang takut kepada Tuhan mereka akan memiliki kamar di atasnya dibangun, di bawahnya sungai-sungai mengalir. Janji Allah adalah Allah tidak gagal menepati janji-Nya. Rasulullah berkata: \"Sesungguhnya, di Surga ada ruang yang penampilan luarnya muncul dari dalam, dan bagian dalamnya dari luar.\""
