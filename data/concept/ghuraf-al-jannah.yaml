id: concept/ghuraf-al-jannah
class: concept
kind: belief
label:
  ar: "غرفات الجنة"
  en: "The Chambers of Paradise"
  ur: "جنت کے غرفے"
summary:
  ar: "الغرفات منازل مرتفعة في الجنة، قال تعالى: «أولئك يجزون الغرفة بما صبروا ويلقون فيها تحية وسلاما»، و«لكن الذين اتقوا ربهم لهم غرف من فوقها غرف مبنية تجري من تحتها الأنهار وعد الله لا يخلف الله الميعاد»، وقال رسول الله: «إن في الجنة لغرفة يظهر ظاهرها من باطنها وباطنها من ظاهرها»."
  en: "The chambers are lofty dwellings in Paradise. God says «those are recompensed with the chamber for what they patiently endured, and are greeted therein with greeting and peace», and «the godfearing have chambers above which are built chambers, beneath which rivers run — the promise of God; God does not fail the tryst». The Prophet said: «In Paradise there is a chamber whose outside shows from within and whose inside shows from without»."
  ur: "غرفے جنت میں بلند رہائشیں ہیں۔ اللہ فرماتا ہے «انہیں ان کے صبر کے بدلے غرفہ دیا جائے گا جس میں انہیں سلام کیا جائے گا» اور «پرہیزگاروں کے لیے غرفے ہیں جن کے اوپر بنے ہوئے غرفے ہیں جن کے نیچے نہریں بہتی ہیں»۔ نبی نے فرمایا: «جنت میں ایک غرفہ ہے جس کا باہر اندر سے اور اندر باہر سے دکھائی دیتا ہے»۔"
