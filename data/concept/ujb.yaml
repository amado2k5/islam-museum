label: { ar: "العُجب", en: "Self-admiration (ujb)" }
summary:
  ar: "العُجب استعظام المرء عمله أو علمه أو رأيه، ورؤيته الفضل لنفسه. يذكر الصلابي قول علي: «الإعجاب آفة الألباب» {cite:sallabi-ali-vol1 p. 262}، وينقل عن ابن تيمية أن العجب قرين الرياء، لأن الرياء إشراك بالخلق والعجب إشراك بالنفس {cite:sallabi-ali-vol1 p. 263}. ويذكر أقوال الغزالي والقرافي وابن القيم وابن حزم في أسبابه وعلاجه {cite:sallabi-ali-vol1 p. 263}."
  en: "Self-admiration is taking pride in one's own deed, knowledge or opinion. Al-Sallabi quotes Ali: self-admiration is a plague of minds, and cites Ibn Taymiyya that it is the associating of the self, where show is the associating of creatures {cite:sallabi-ali-vol1 p. 263}."
