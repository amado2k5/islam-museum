label: { ar: "العُجب", en: "Self-admiration (ujb)", es: "Autoadmiración (ujb)", fr: "Admiration de soi (ujb)", ur: "خود تعریف ⁦(یو جے بی)⁩", tr: "hayret", id: "keajaiban" }
summary:
  ar: "العُجب استعظام المرء عمله أو علمه أو رأيه، ورؤيته الفضل لنفسه. يذكر الصلابي قول علي: «الإعجاب آفة الألباب» {cite:sallabi-ali-vol1 p. 262}، وينقل عن ابن تيمية أن العجب قرين الرياء، لأن الرياء إشراك بالخلق والعجب إشراك بالنفس {cite:sallabi-ali-vol1 p. 263}. ويذكر أقوال الغزالي والقرافي وابن القيم وابن حزم في أسبابه وعلاجه {cite:sallabi-ali-vol1 p. 263}."
  en: "Self-admiration is taking pride in one's own deed, knowledge or opinion. Al-Sallabi quotes Ali: self-admiration is a plague of minds, and cites Ibn Taymiyya that it is the associating of the self, where show is the associating of creatures {cite:sallabi-ali-vol1 p. 263}."
  es: "La autoadmiración es enorgullecerse de las propias acciones, conocimientos u opiniones. Al-Sallabi cita a Ali: la autoadmiración es una plaga para las mentes, y cita a Ibn Taymiyya que es la asociación del yo, mientras que la ostentación es la asociación de las criaturas {cite:sallabi-ali-vol1 p. 263}."
  fr: "L'auto-admiration consiste à s'enorgueillir de ses propres actes, connaissances ou opinions. Al-Sallabi cite Ali: « L'auto-admiration est un fléau pour l'esprit », et Ibn Taymiyya affirme qu'il s'agit de l'association de soi-même, tandis que la démonstration consiste à associer les créatures (cite: al-Sallabi-ali-vol1 p. 263)."
  ur: "خود تعریف کسی کے اپنے عمل، علم یا رائے پر فخر کرنا ہے۔ السلبی نے علی کا حوالہ دیا ہے: خود کی تعریف دماغوں کا طاعون ہے، اور ابن تیمیہ کا حوالہ دیتے ہیں کہ یہ نفس کا تعلق ہے، جہاں دکھاوا مخلوقات کا تعلق ہے۔ 263}۔"
  tr: "Hayranlık, kişinin eserinin, bilgisinin veya görüşünün büyüklüğü ve bunu kendisi için bir erdem olarak görmesidir. El-Sallabi, Ali'nin \"Hayranlık zihnin bir belasıdır\" sözünden bahseder {cite:sallabi-ali-cilt1, s. 262} ve İbn Teymiyye'den, şaşkınlığın ikiyüzlülükle birlikte olduğunu, çünkü gösterişin yaratılış, hayranlığın ise benliği içerdiğini alıntılar {cite:sallabi-ali-cilt, s. 263}. Ayrıca Al-Ghazali, Al-Karafi, İbn Al-Qayyim ve İbn Hazm'ın nedenleri ve çözümleri hakkında sözlerini de belirtir {cite:sallabi-ali-cilt, s. 263}."
  id: "Kekaguman adalah kebesaran karya, pengetahuan, atau pendapat seseorang, dan melihatnya sebagai kebajikan bagi diri sendiri. Al-Sallabi menyebutkan pepatah Ali: \"Kagum adalah wabah pikiran\" {cite:sallabi-ali-vol1, hlm. 262}, dan ia mengutip dari Ibn Taymiyyah bahwa keterkejutan disertai dengan kemunafikan, karena kemegahan melibatkan penciptaan dan keajaiban melibatkan diri {cite:sallabi-ali-vol1, hlm. 263}. Ia juga menyebutkan perkataan Al-Ghazali, Al-Qarafi, Ibn Al-Qayyim, dan Ibn Hazm mengenai penyebab dan solusinya {cite:sallabi-ali-vol1, hlm. 263}."
