label: { ar: "الحركة الأولى", en: "The first motion (diurnal rotation of the heavens)", fr: "Le premier mouvement (rotation diurne du ciel)", es: "El primer movimiento (rotación diurna de los cielos)", ur: "پہلی حرکت ⁦(آسمان کی روزانہ گردش)⁩", tr: "Birinci bölüm", id: "Episode pertama" }
summary:
  ar: "الحركة الأولى هي دوران الكل من المشرق إلى المغرب في كل يوم وليلة دورة واحدة بحال واحدة، يحمل فيها الشمس والقمر والكواكب والنجوم، وتكون بها الليل والنهار، وتدور على قطبين ثابتين يسمى أحدهما القطب الشمالي والآخر الجنوبي {cite:farghani-elements-astronomy p. 117}{cite:farghani-elements-astronomy p. 147}{cite:farghani-elements-astronomy p. 148}."
  en: "The first motion is the daily turning of the whole heavens from east to west, carrying sun, moon, planets and stars in one revolution each day and night, about two fixed poles, one north and one south {cite:farghani-elements-astronomy p. 117}{cite:farghani-elements-astronomy p. 147}{cite:farghani-elements-astronomy p. 148}."
  fr: "Le premier mouvement est la rotation quotidienne du ciel entier d’est en ouest. Il entraîne le Soleil, la Lune, les planètes et les étoiles dans un tour par jour et par nuit autour de deux pôles fixes, l’un au nord et l’autre au sud {cite:farghani-elements-astronomy p. 117}{cite:farghani-elements-astronomy p. 147}{cite:farghani-elements-astronomy p. 148}."
  es: "El primer movimiento es el giro diario de todo el firmamento de este a oeste, llevando el sol, la luna, los planetas y las estrellas en una revolución cada día y noche, alrededor de dos polos fijos, uno norte y otro sur {cite:farghani-elements-astronomy p. 117}{cite:farghani-elements-astronomy p. 147}{cite:farghani-elements-astronomy p. 148}."
  ur: "پہلی حرکت روزانہ پورے آسمانوں کا مشرق سے مغرب کی طرف موڑنا ہے، سورج، چاند، سیاروں اور ستاروں کو ہر دن اور رات میں ایک انقلاب میں لے جانا، تقریباً دو مقررہ قطبین، ایک شمال اور ایک جنوب۔ 117}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 147}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 148}۔"
  tr: "İlk hareket, her gün ve gece doğudan batıya her şeyin tek bir döngüde dönmesidir; güneşi, ayı, gezegenleri ve yıldızları taşır; bu gece ile gündüzdür ve iki sabit kutbun etrafında döner: biri Kuzey Kutbu, diğeri Güney Kutbu {cite:farghani-elements-astronomy s. 117}{cite:farghani-elements-astronomy s. 147}{cite:farghani-elements-astronomy s. 148}{cite:farghani-elements-astronomy s. 148}."
  id: "Gerakan pertama adalah rotasi segala sesuatu dari timur ke barat dalam satu siklus setiap hari dan malam; ia membawa matahari, bulan, planet, dan bintang; ini adalah malam dan siang dan berputar di sekitar dua kutub tetap: satu di Kutub Utara, satu lagi di Kutub Selatan {cite:farghani-elements-astronomy hlm. 117}{cite:farghani-elements-astronomy hlm. 147}{cite:farghani-elements-astronomy hlm. 148}{cite:farghani-elements-astronomy hlm. 148}{cite:farghani-elements-astronomy hlm. 148}{cite:farghani-elements-astronomy hlm. 148}."
