summary:
  ar: "الحركة الأولى هي دوران الكل من المشرق إلى المغرب في كل يوم وليلة دورة واحدة بحال واحدة، يحمل فيها الشمس والقمر والكواكب والنجوم، وتكون بها الليل والنهار، وتدور على قطبين ثابتين يسمى أحدهما القطب الشمالي والآخر الجنوبي {cite:farghani-elements-astronomy p. 117}{cite:farghani-elements-astronomy p. 147}{cite:farghani-elements-astronomy p. 148}."
  en: "The first motion is the daily turning of the whole heavens from east to west, carrying sun, moon, planets and stars in one revolution each day and night, about two fixed poles, one north and one south {cite:farghani-elements-astronomy p. 117}{cite:farghani-elements-astronomy p. 147}{cite:farghani-elements-astronomy p. 148}."
