id: concept/canon-regimen-when-the-humour-is-inside-the-vessels
class: concept
kind: scientific
label:
  ar: "تدبير الإعياء القروحي إذا كان الخلط داخل العروق عند ابن سينا"
  en: "Regimen when the humour is inside the vessels in the Canon"
  fr: "Régime lorsque l’humeur est dans les vaisseaux dans le Canon"
  ur: "جب خلط رگوں کے اندر ہو تو تدبیر قانون میں"
  es: "Régimen cuando el humor está dentro de los vasos en el Canon"
summary:
  ar: "يصف ابن سينا غذاء من الإعياء القروحي الذي خلطه في العروق بالشعير والحنطة ولحوم الطير اللطيفة والسكنجبين العسلي وماء العسل والشراب الأبيض الرقيق، ثم يفصل الاستفراغ إن لم يغن هذا التدبير، ويحذر منه إذا استضعفت القوة {cite:canon-ibn-sina-print-v1 p.248}."
  en: "Ibn Sina prescribes for ulcerous fatigue with its humour in the vessels barley, wheat, light bird meat, honey oxymel, honey water and thin white wine, then turns to evacuation if this regimen does not suffice, and warns against it when the strength is weak {cite:canon-ibn-sina-print-v1 p.248}."
  fr: "Pour la fatigue ulcéreuse dont l’humeur reste dans les vaisseaux, Ibn Sina décrit orge, blé, chair légère d’oiseaux, oxymel au miel, eau miellée et vin blanc fluide, puis évacuation si cela ne suffit pas, mais avec mise en garde si les forces sont faibles {cite:canon-ibn-sina-print-v1 p.248}."
  es: "Ibn Sina prescribe para la fatiga ulcerosa con su humor en los vasos cebada, trigo, carne de ave ligera, oxímel de miel, agua de miel y vino blanco ligero, luego pasa a la evacuación si este régimen no es suficiente, y advierte contra ella cuando la fuerza es débil {cite:canon-ibn-sina-print-v1 p.248}."
