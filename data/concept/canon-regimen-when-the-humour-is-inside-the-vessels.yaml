summary:
  ar: "يصف ابن سينا غذاء من الإعياء القروحي الذي خلطه في العروق بالشعير والحنطة ولحوم الطير اللطيفة والسكنجبين العسلي وماء العسل والشراب الأبيض الرقيق، ثم يفصل الاستفراغ إن لم يغن هذا التدبير، ويحذر منه إذا استضعفت القوة {cite:canon-ibn-sina-print-v1 p.248}."
  en: "Ibn Sina prescribes for ulcerous fatigue with its humour in the vessels barley, wheat, light bird meat, honey oxymel, honey water and thin white wine, then turns to evacuation if this regimen does not suffice, and warns against it when the strength is weak {cite:canon-ibn-sina-print-v1 p.248}."
