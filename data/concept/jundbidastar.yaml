id: concept/jundbidastar
class: concept
kind: natural
label:
  ar: "جندبيدستر"
  en: "Jundbidastar (the editor's aromatic fatty substance)"
  ur: "جندبیدستر ⁦(خوشبودار چکنی مادّہ)⁩"
  es: "Jundbidastar (la sustancia grasa aromática del editor)"
summary:
  ar: "خصية حيوان بحري تؤخذ زوجاً متعلقاً، وهي ألطف من كل مسخّن مجفف؛ تحلّل النفخ، وتنفع من الأورام الحارة والرعشة والتشنج والفالج والصداع البارد، ويذكر الكتاب فيها ما يدر الطمث ويخرج المشيمة ويخرج الجنين {cite:canon-ibn-sina-print-v1 p.417} {cite:canon-ibn-sina-print-v1 p.418}."
  en: "The book calls it the testicle of a sea animal, taken as a joined pair. It is finer and stronger than any hot, drying substance. It dissolves wind and helps hot swellings, tremor, convulsion, palsy and cold headache. The book also lists its use for the menses, for expelling the afterbirth and the foetus {cite:canon-ibn-sina-print-v1 p.417} {cite:canon-ibn-sina-print-v1 p.418}. The editor's footnote calls it an aromatic fatty substance {cite:canon-ibn-sina-print-v1 p.417}."
  ur: "کتاب اسے سمندری جانور کا خصیہ بتاتی ہے، جو ایک جڑ سے جڑے جوڑے کی صورت میں لیا جاتا ہے۔ یہ ہر گرم اور خشک کرنے والی چیز سے لطیف اور قوی ہے؛ ہوا کو تحلیل کرتا ہے اور گرم ورموں، کپکپی، اینٹھن، فالج اور سرد سردرد میں مفید ہے۔ کتاب اس کے حیض کو جاری کرنے، ساقط المشیمہ اور جنین کے اخراج کے بیانات بھی درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.417} {cite:canon-ibn-sina-print-v1 p.418}۔ حاشیے کے مطابق یہ خوشبودار چکنی مادّہ ہے {cite:canon-ibn-sina-print-v1 p.417}۔"
  es: "El libro lo llama testículo de un animal marino, tomado como un par unido. Es más fino y fuerte que cualquier sustancia caliente y secante. Disuelve el viento y ayuda con hinchazones calientes, temblores, convulsiones, parálisis y dolor de cabeza por frío. El libro también enumera su uso para la menstruación, para expulsar la placenta y el feto {cite:canon-ibn-sina-print-v1 p.417} {cite:canon-ibn-sina-print-v1 p.418}. La nota al pie del editor lo llama una sustancia grasa aromática {cite:canon-ibn-sina-print-v1 p.417}."
