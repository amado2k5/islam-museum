label: { ar: "أورام المفرغات والإنضاج عند ابن سينا", en: "Swellings of the emunctories, ripening and drawing out in the Canon", ur: "قانون میں مفرغ اعضا کے ورم، پکانا اور کھینچنا", es: "Hinchazones de los emuntorios, madurando y extendiéndose en el Canon", fr: "Les renflements des émoncoires, mûrissant et s'étirant dans le Canon", tr: "İbn Sina'da depo tümörleri ve olgunlaşma", id: "Tumor depositori dan pematangan pada Avicenna" }
summary:
  ar: "يخص ابن سينا أورام المواضع الغددية المفرغة للأعضاء الرئيسة بحكم مغاير، فلا يقرب إليها ما يردع، ثم يتناول الإنضاج والبط وجذب الورم الغائر {cite:canon-ibn-sina-print-v1 pp.304-305}."
  en: "Ibn Sina gives a different rule for swellings in the glandular places that serve as drains for the principal organs, so that nothing repelling is brought near them, and then turns to ripening, incision and drawing out a deep swelling {cite:canon-ibn-sina-print-v1 pp.304-305}."
  es: "Ibn Sina da una regla diferente para las hinchazones en los lugares glandulares que sirven como drenajes para los órganos principales, de modo que no se acerque nada repelente a ellos, y luego pasa a madurar, incidir y extraer una hinchazón profunda {cite:canon-ibn-sina-print-v1 pp.304-305}."
  fr: "Ibn Sina donne une règle différente pour les gonflements dans les lieux glandulaires qui servent de drains aux organes principaux, afin que rien de répulsif ne soit amené près d'eux, puis passe à la maturation, à l'incision et à l'extraction d'un gonflement profond {cite:canon-ibn-sina-print-v1 pp.304-305}."
  ur: "ابن سینا غدود کی جگہوں پر سوجن کے لیے ایک مختلف قاعدہ بتاتا ہے جو بنیادی اعضاء کے لیے نالیوں کا کام کرتے ہیں، تاکہ کوئی چیز ان کے قریب نہ آئے، اور پھر پکنے، چیرا لگانے اور گہری سوجن نکالنے کی طرف مڑ جاتا ہے۔"
  tr: "İbn Sina özellikle ana organların boş bez bölgelerindeki tümörlere farklı bir şekilde odaklanır, bu yüzden onlara caydırıcı bir şey atfetmez, ardından olgunlaşma, ördek yavrusu ve derin tümörün çekilmesini tartışır {cite:canon-ibn-sina-print-v1 s.304-305}."
  id: "Ibn Sina secara khusus memfokuskan pada tumor di situs kelenjar berongga organ utama dengan cara yang berbeda, sehingga ia tidak mengaitkan apa pun dengan tumor tersebut sebagai pencegah, lalu membahas pematangan, anak bebek, dan menarik tumor dalam {cite:canon-ibn-sina-print-v1 hlm.304-305}."
