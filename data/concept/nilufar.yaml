summary:
  ar: "النيلوفر في الكتاب كرنب الماء كما قال جالينوس، بارد في الثالثة، شرابه شديد التطفئة ملطف، ومنوم يسكن الصداع الحار، وينفع السعال والطحال والإسهال المزمن، ويذكر له نقلاً موسوماً في الباه والطمث {cite:canon-ibn-sina-print-v1 p.577}."
  en: "Nilufar is in the book the water cabbage, as Galen said, cold in the third degree, its syrup strongly quenching and thinning; it brings sleep, calms hot headache, helps cough, spleen and chronic diarrhoea, and the book gives it a labelled listing on desire and menses {cite:canon-ibn-sina-print-v1 p.577}."
  ur: "نیلوفر کتاب میں پانی کی گوبھی ہے جیسا جالینوس نے کہا، تیسرے درجے میں سرد؛ اس کا شربت بہت بجھانے والا اور لطیف ہے؛ نیند لاتا، گرم سردرد کو تسکین دیتا اور کھانسی، تلی اور پرانے اسہال میں مفید ہے، اور کتاب اس کے لیے باہ اور حیض کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.577}۔"
  es: "En el libro, Nilufar es la col de agua, como dijo Galeno, fría en tercer grado, su jarabe es muy calmante y diluyente; trae sueño, calma el dolor de cabeza intenso, ayuda con la tos, el bazo y la diarrea crónica, y el libro le da una entrada etiquetada sobre el deseo y la menstruación {cite:canon-ibn-sina-print-v1 p.577}."
