label:
  ar: "العجلة والتواني"
  en: "Haste and procrastination"
  ur: "جلد بازی اور سستی"
summary:
  ar: "يعدّ عمر عبد الكافي أربعة أمور إذا اجتنبها الإنسان قلّ أن يقع به مكروه كبير: العجلة التي تورث الندامة، واللجاجة أو كثرة الجدل التي تورث الحيرة، والتواني الذي يورث الذل، والعجب الذي يورث البغض."
  en: "Omar Abdelkafy lists four things which, if avoided, make a great misfortune unlikely: haste, which breeds regret; wrangling and much disputation, which breed confusion; procrastination, which breeds humiliation; and vanity, which breeds hatred."
  ur: "عمر عبد الکافی چار چیزیں گنواتے ہیں جن سے بچا جائے تو بڑی مصیبت کم ہی آتی ہے: جلد بازی جو ندامت پیدا کرتی ہے، جھگڑا اور کثرتِ بحث جو حیرت پیدا کرتے ہیں، سستی جو ذلت پیدا کرتی ہے، اور خود پسندی جو نفرت پیدا کرتی ہے۔"
