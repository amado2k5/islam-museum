label:
  ar: "العجلة والتواني"
  en: "Haste and procrastination"
  fr: "La hâte et la temporisation"
  ur: "جلد بازی اور سستی"
  es: "Prisa y dilación"
  tr: "Acele ve Gecikme"
  id: "Cepat dan Tunda"
summary:
  ar: "يعدّ عمر عبد الكافي أربعة أمور إذا اجتنبها الإنسان قلّ أن يقع به مكروه كبير: العجلة التي تورث الندامة، واللجاجة أو كثرة الجدل التي تورث الحيرة، والتواني الذي يورث الذل، والعجب الذي يورث البغض."
  en: "Omar Abdelkafy lists four things which, if avoided, make a great misfortune unlikely: haste, which breeds regret; wrangling and much disputation, which breed confusion; procrastination, which breeds humiliation; and vanity, which breeds hatred."
  fr: "Omar Abdelkafy énumère quatre choses qui, si on les évite, rendent un grand malheur improbable : la hâte, qui engendre le regret ; la querelle et l’abondance de disputes, qui engendrent la confusion ; la temporisation, qui engendre l’humiliation ; et la vanité, qui engendre la haine."
  ur: "عمر عبد الکافی چار چیزیں گنواتے ہیں جن سے بچا جائے تو بڑی مصیبت کم ہی آتی ہے: جلد بازی جو ندامت پیدا کرتی ہے، جھگڑا اور کثرتِ بحث جو حیرت پیدا کرتے ہیں، سستی جو ذلت پیدا کرتی ہے، اور خود پسندی جو نفرت پیدا کرتی ہے۔"
  es: "Omar Abdelkafy enumera cuatro cosas que, si se evitan, hacen improbable una gran desgracia: la prisa, que engendra arrepentimiento; las disputas y las constantes controversias, que generan confusión; la dilación, que engendra humillación; y la vanidad, que engendra odio."
  tr: "Omar Abdul Kafi, bir kişinin kaçındığı ve nadiren büyük bir hoşnutsuzluktan kaynaklanan dört şeyi düşünür: pişmanlık getiren acele; kafa karışıklığına yol açan inatçılık veya aşırı tartışmalar; aşağılanma doğuran erteleme; ve nefreti doğuran hayranlık."
  id: "Omar Abdul Kafi memikirkan empat hal yang dihindari seseorang dan jarang berasal dari ketidakpuasan besar: terburu-buru yang membawa penyesalan; keras kepala atau perdebatan berlebihan yang menyebabkan kebingungan; menunda-nunda yang menyebabkan penghinaan; dan kekaguman yang menumbuhkan kebencian."
