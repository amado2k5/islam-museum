summary:
  ar: "أفضل النفث وأسرعه وأسهله وأكثره وأنضجه الذي هو الأبيض الأملس المستوي الذي لا لزوجة فيه بل هو معتدل القوام وما كان قريباً من هذا النضج يسكن أخلاطاً إن كانت قبله أو سهراً أو عرضاً آخر رديئاً ويليه المائل إلى الحمرة في أول الأيام والمائل إلى الصفرة وبعد ذلك الزبدي، وسبب الزبدية أن يكون في الخلط شيء رقيق قليل يخالطه هواء كثير وتكون المخالطة شديدة جداً على أن الزبدي ليس بذلك الجيد بل هو أميل إلى الرداءة، وأردؤه في الأول الأحمر الصرف أو الأصفر الصرف الناري ومن الرديء جداً الأبيض اللزج المستدير، وأردأ الجميع الأسود وخصوصاً المنتن منه والأصفر خير من الأسود ومن الغليظ المدحرج المستدير وهذا المستدير خير من الأحمر وإن كان رديئاً ودليلاً على غلظ المادة واستيلاء الحرارة وينذر بطول من المرض يؤول إلى سل وذبول والأحمر خير من الأصفر لأن الدم الطبيعي وهو الأحمر والبلغم المعتدل ألين جانباً من الأصفر الأكال المحرق والأخضر يدل على جمود أو على احتراق شديد ولا يزيل حكم رداءة النفث في جوهره سهولة خروجه والمنتن رديء وانتفاث أمثال هذه الرديئة يكون للكثرة لا للنضج وكل نفث لا يسكن معه الأذى فليس بجيد، ومن عادتهم أنهم يسمون الساذج الذي لا يخالطه شيء غريب نضيج أو شيء من الدم أو شيء من الصفراء أو السوداء بزاقاً ولا يسمونه نفثاً ومثل هذا إذا دام ولم يختلط به شيء ولم يعرض له حال يدل على أن الأخلاط هي داء ينضج فإنه يدل على طول العلة وإذا كان مع عدم النضج رديئاً دل على الهلاك، وبالجملة فإن النفث يدل بلونه ويدل بقوامه من غلظه ورقته ويدل بشكله من استدارته وغير استدارته ويدل بمقداره في كثرته وقلته والنفث المالح يدل على نزلة أكالة ونفث الخلط الغليظ بل القيح قد لا يكون بسبب قروح الرئة بل بسبب رطوبة صديدية تتحلب من أبدان من جاوز الثلاثين إلى الخمسين وترك الرياضة فيندفع في فضاء الصدر وينتفث ويقع به الاستسقاء في مدة أربعين يوماً إلى ستين ولا يكون به كبير بأس {cite:canon-ibn-sina-print-v2 p.349}"
  en: "The best expectoration, the quickest, easiest, most copious and ripest, is the white, smooth, even one with no stickiness, of moderate consistency; what is near this ripeness calms the humours before it, or a sleeplessness or another bad symptom. After it comes the one inclining to redness in the first days, then the one inclining to yellowness, then the foamy — the foaminess's cause being a little thin thing in the humour that much air mixes with, the mixing being very strong; yet the foamy is not that good, rather it inclines to badness. Its worst at first is the pure red or the pure yellow fiery; among the very bad the white, sticky, rounded. The worst of all is the black, especially its fetid, and the yellow is better than the black; and among the thick, the rolling-rounded — this rounded is better than the red though bad, an indication of the matter's thickness and the heat's sway, and it warns of a length of disease resolving into consumption and wasting. The red is better than the yellow, the natural blood being the red, and the moderate phlegm is softer-sided than the corroding burning yellow; the green indicates congealing or a severe burning. The ease of its exit does not remove the judgement of an expectoration's badness in substance, and the fetid is bad; expectorating such bad kinds is for the abundance, not the ripeness, and every expectoration with which the harm is not stilled is not good. It is their custom to call the simple that no strange thing mixes with — nothing of blood, of yellow bile or of melancholy — 'saliva', not expectoration; such a one, if it lasts and nothing mixes in it and no state befalls it, indicates the humours being a disease ripening — it indicates the affliction's length, and if it is bad with the absence of ripeness it indicates destruction. In sum the expectoration indicates by its colour, by its consistency of thickness and thinness, by its shape of roundedness or otherwise, and by its measure in abundance and littleness; the salty expectoration indicates a corroding catarrh, and the expectoration of a thick humour — even pus — may not be for lung ulcers but for a purulent moisture gathering out of the bodies of those past thirty to fifty who have left exercise, so it pours into the chest's hollow and is spat out, and dropsy befalls him in forty to sixty days, with no great harm in it {cite:canon-ibn-sina-print-v2 p.349}"
  ur: "بہترین نفث سب سے جلد آسان کثیر اور پکا ہوا وہ ہے جو سفید چکنا ہموار ہو بغیر چپچپاہٹ معتدل قوام کا اور جو اس پکاوٹ کے قریب ہو وہ اس سے پہلے کے اخلاط یا بیداری یا دوسری بری علامت کو ٹھیرا دیتا ہے؛ اس کے بعد شروع کے دنوں میں سرخی مائل پھر زردی مائل پھر زبد دار زبد ہونے کا سبب خلط میں کوئی پتلی چیز ہونا ہے جس سے کثیر ہوا مل جائے اور ملنا بہت سخت ہو البتہ زبد دار اتنا اچھا نہیں بلکہ بدی کی طرف مائل ہے؛ شروع میں سب سے برا خالص سرخ یا خالص زرد آتشین اور بہت بروں میں سفید چپچپا گول؛ سب سے برا سیاہ خاص طور پر بدبودار اور زرد سیاہ سے بہتر اور گاڑھوں میں لڑھکتا گول یہ گول سرخ سے بہتر ہے اگرچہ برا اور مادے کے گاڑھے اور حرارت کے غلبے کی دلیل اور طویل مرض کی پیشگوئی جو سل اور مرجھانے میں ڈھلتا ہے؛ سرخ زرد سے بہتر کیونکہ فطری خون سرخ ہے اور معتدل بلغم جلانے والے کاری زرد سے نرم طرف ہے اور سبز جمود یا سخت جلنے کی دلیل اور نفث کی جوہری بدی کا حکم اس کے آسانی سے نکلنے سے نہیں اٹتا اور بدبودار برا ہے ایسی بری اقسام کا نکلنا کثرت کی وجہ سے ہے نہ پکاوٹ کی اور ہر وہ نفث جس کے ساتھ تکلیف نہ ٹھہرے وہ اچھا نہیں؛ ان کی عادت ہے کہ ساذج جس میں کوئی اجنبی نہ ملا ہو نہ خون نہ صفرا نہ سودا اسے رال کہتے ہیں نفث نہیں اور ایسا اگر برقرار رہے اور کچھ نہ ملے نہ کوئی حال عرض ہو تو یہ دلیل ہے کہ اخلاط ایسے داء ہیں جو پک رہے ہیں یہ علت کی طوالت کی دلیل ہے اور اگر پکاوٹ کے نہ ہونے کے ساتھ برا ہو تو ہلاکت کی دلیل؛ خلاصہ نفث اپنے رنگ سے اپنی گاڑھی پتلی کے قوام سے اپنی گولی یا غیر گولی کے شکل سے اور اپنی کثرت قلت کے مقدار سے دلالت کرتا ہے نمکین نفث کاری نزلة کی دلیل اور گاڑھے خلط بلکہ پیب کا نفث پھیپھڑے کے قروح سے نہیں بلکہ ایک صديدی رطوبت سے ہو سکتا ہے جو تیس سے پچاس کی عمر کے ان بدنوں سے ٹپکتی ہے جنہوں نے ورزش چھوڑ رکھی ہو تو وہ سینے کی خلا میں بہ کر نکالی جاتی ہے اور چالیس سے ساٹھ دن میں استسقاء ہو جاتا ہے اور اس میں بڑی بات نہیں {cite:canon-ibn-sina-print-v2 p.349}"
  es: "La mejor expectoración, la más rápida, fácil, abundante y madura, es la blanca, suave, uniforme, sin pegajosidad, de consistencia moderada; lo que se acerca a esta madurez calma los humores que la preceden, o el insomnio u otro síntoma negativo. Después viene la que tiende al enrojecimiento en los primeros días, luego la que tiende al amarilleamiento, y después la espumosa; la causa de la espumosidad es una pequeña sustancia delgada en el humor con la que se mezcla mucho aire, siendo la mezcla muy fuerte; sin embargo, la espumosa no es tan buena, más bien tiende a ser mala. La peor al principio es la roja pura o la amarilla pura ardiente; entre las muy malas está la blanca, pegajosa y redonda. La peor de todas es la negra, especialmente la fétida, y la amarilla es mejor que la negra; y entre las espesas, la redonda y ondulante; esta redonda es mejor que la roja aunque mala, un indicio de la densidad de la materia y el dominio del calor, y advierte de una enfermedad prolongada que se resolverá en tisis y emaciación. El rojo es mejor que el amarillo, siendo la sangre natural de color rojo, y la flema moderada es más suave que la amarilla corrosiva y ardiente; el verde indica coagulación o ardor intenso. La facilidad de su expulsión no elimina el juicio de la mala sustancia de una expectoración, y la fétida es mala; expectorar tales sustancias malas es por la abundancia, no por la madurez, y toda expectoración con la que no se calma el daño no es buena. Es su costumbre llamar \"saliva\" a la simple que no se mezcla con nada extraño —nada de sangre, de bilis amarilla o de melancolía—, no expectoración; tal expectoración, si dura y no se mezcla con nada y no le sucede ningún estado, indica que los humores están madurando una enfermedad —indica la duración de la aflicción, y si es mala sin madurez indica destrucción. En resumen, la expectoración se indica por su color, por su consistencia (espesor o fino), por su forma (redondeada o no) y por su cantidad (abundante o escasa); la expectoración salada indica un catarro corrosivo, y la expectoración de un humor espeso —incluso pus— puede no deberse a úlceras pulmonares, sino a una humedad purulenta que se acumula en el cuerpo de personas mayores de treinta a cincuenta años que han dejado de hacer ejercicio, de modo que se vierte en la cavidad torácica y se expulsa, y la hidropesía le sobreviene en cuarenta a sesenta días, sin mayor daño. {cite:canon-ibn-sina-print-v2 p.349}"
  fr: "La meilleure expectoration, la plus rapide, la plus facile, la plus abondante et la plus mûre, est blanche, lisse, homogène, non collante, de consistance modérée; ce qui s'approche de cette maturité calme les humeurs qui la précèdent, ou une insomnie ou un autre symptôme désagréable. Vient ensuite celle qui tend vers la rougeur les premiers jours, puis celle qui tend vers le jaune, puis la mousseuse – la mousse étant due à une petite substance fluide dans l'humeur avec laquelle l'air se mélange vigoureusement; pourtant, la mousseuse n'est pas bonne, elle tend plutôt à être mauvaise. La pire au début est la rougeur pure ou le jaune vif; parmi les très mauvaises, la blanche, collante et ronde. La pire de toutes est la noire, surtout fétide, et la jaune est préférable à la noire; et parmi les épaisses, la ronde roulée – cette ronde est meilleure que la rouge, bien que mauvaise, signe de l'épaisseur de la matière et de l'influence de la chaleur, et elle annonce une longue maladie évoluant vers la tuberculose et le dépérissement. Le rouge est préférable au jaune, le sang naturel étant rouge, et le flegme modéré est plus doux que le jaune corrosif et brûlant; le vert indique une coagulation ou une brûlure intense. La facilité avec laquelle une expectoration s'écoule ne dissipe pas le jugement quant à sa nocivité intrinsèque, et la fétide est mauvaise; expectorer de telles choses nocives est bénéfique en cas d'abondance, non de maturité, et toute expectoration qui ne calme pas le mal est néfaste. On a coutume d'appeler « salive », et non expectoration, ce qui est simple et ne contient rien d'étranger — ni sang, ni bile jaune, ni mélancolie —; une telle expectoration, si elle persiste sans que rien ne s'y mêle et sans qu'elle ne subisse aucune altération, indique que les humeurs sont une maladie en maturation — cela indique la durée de l'affection, et si elle est mauvaise malgré l'absence de maturité, cela annonce la destruction. En résumé, l'expectoration se caractérise par sa couleur, sa consistance (épaisse ou fluide), sa forme (arrondie ou non) et son volume (abondant ou faible). Une expectoration salée indique un catarrhe corrosif, et une expectoration d'un liquide épais, voire purulent, peut ne pas être due à un ulcère pulmonaire, mais plutôt à une accumulation de pus chez les personnes de plus de trente à cinquante ans qui ont cessé toute activité physique. Ce liquide s'écoule alors dans la cavité thoracique et est expulsé, provoquant une hydropisie en quarante à soixante jours, sans gravité majeure. {cite:canon-ibn-sina-print-v2 p.349}"
