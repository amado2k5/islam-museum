label:
  ar: "الفرج بعد الشدة"
  en: "Relief after hardship (al-faraj ba'd al-shidda)"
  fr: "Le soulagement après l’épreuve (al-faraj ba’d al-shidda)"
  ur: "سختی کے بعد کشادگی"
  es: "Alivio después de las dificultades (al-faraj ba'd al-shidda)"
  tr: "zorluk sonrası rahatlama"
  id: "Bantuan pasca-tantangan"
summary:
  ar: "موضوع برنامج «بستان الأمل» لعمر عبد الكافي: أن الدنيا أغيار لا تدوم على حال، وأن المؤمن يعيش على الأمل وانتظار الفرج، وأن أبواب السماء لا تغلق في وجه من قال «يا رب»."
  en: "The theme of Omar Abdelkafy's programme 'Bustan al-Amal': the world is ever-changing and never stays in one state, the believer lives by hope and the awaiting of relief, and the gates of heaven are never closed to one who says 'O Lord'."
  fr: "Le thème de l’émission « Bustan al-Amal » d’Omar Abdelkafy : le monde change sans cesse et ne reste jamais dans le même état ; le croyant vit d’espoir et dans l’attente du soulagement, et les portes du ciel ne se ferment jamais à qui dit « Ô Seigneur »."
  ur: "عمر عبد الکافی کے پروگرام «بستان الامل» کا موضوع: دنیا بدلتی رہتی ہے اور ایک حال پر نہیں رہتی، مومن امید اور کشادگی کے انتظار پر جیتا ہے، اور جو «یا رب» کہے اس پر آسمان کے دروازے بند نہیں ہوتے۔"
  es: "El tema del programa de Omar Abdelkafy, 'Bustan al-Amal', es el siguiente: el mundo está en constante cambio y nunca permanece en un solo estado, el creyente vive de la esperanza y la espera del alivio, y las puertas del cielo nunca se cierran para quien dice '¡Oh, Señor!'."
  tr: "Ömer Abdelkafi'nin \"Umut Bahçesi\" programının konusu: dünya yabancıdır ve aynı kalmaz, inanan umut ve rahatlama bekler, ve gökyüzünün kapıları \"Ey Rabbim\" diyenlerin karşısında kapanmaz."
  id: "Tema program \"Taman Harapan\" Omar Abdelkafi: dunia itu asing dan tidak tetap sama; orang percaya mengharapkan harapan dan kelegaan, dan gerbang langit tidak tertutup di hadapan mereka yang berkata \"Ya Tuhanku.\""
