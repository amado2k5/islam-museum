  en: "Relief after hardship (al-faraj ba'd al-shidda)"
  ur: "سختی کے بعد کشادگی"
summary:
  ar: "موضوع برنامج «بستان الأمل» لعمر عبد الكافي: أن الدنيا أغيار لا تدوم على حال، وأن المؤمن يعيش على الأمل وانتظار الفرج، وأن أبواب السماء لا تغلق في وجه من قال «يا رب»."
  en: "The theme of Omar Abdelkafy's programme 'Bustan al-Amal': the world is ever-changing and never stays in one state, the believer lives by hope and the awaiting of relief, and the gates of heaven are never closed to one who says 'O Lord'."
  ur: "عمر عبد الکافی کے پروگرام «بستان الامل» کا موضوع: دنیا بدلتی رہتی ہے اور ایک حال پر نہیں رہتی، مومن امید اور کشادگی کے انتظار پر جیتا ہے، اور جو «یا رب» کہے اس پر آسمان کے دروازے بند نہیں ہوتے۔"
