label: { ar: "تاريخ سني ذي القرنين في سجلات الكسوف", en: "The years of Dhu al-Qarnayn in the eclipse records", ur: "کسوف کے ریکارڈ میں ذو القرنین کے سال", es: "Los años de Dhu al-Qarnayn en los registros de eclipses", fr: "Les années de Dhu al-Qarnayn dans les archives d'éclipses", tr: "Tutulma kayıtlarında Zülkarneyn'in Sünni tarihi", id: "Riwayat Sunni Dzulqarnain dalam Catatan Gerhana" }
summary:
  ar: "يؤرّخ البتاني كسوفاته بسنين يسميها سني ذي القرنين، ويذكر أنها تُعد من وفاة الإسكندر؛ فهي الحقبة التي تُوضع بها تواريخ الكسوفات الأربعة المذكورة في هذا الفصل. {cite:zij-sabi-nallino-byblion p.85}."
  en: "Al-Battani dates his eclipses by years he calls the years of Dhu al-Qarnayn, which he says are counted from the death of Alexander. This is the era in which the four eclipses in this chapter are dated. {cite:zij-sabi-nallino-byblion p.85}."
  ur: "البتانی اپنے کسوفات کی تاریخ ان سالوں سے لکھتے ہیں جنہیں وہ ذو القرنین کے سال کہتے ہیں، اور بتاتے ہیں کہ انہیں اسکندر کی وفات سے شمار کیا جاتا ہے۔ اسی حقبے میں اس فصل میں مذکور چاروں کسوفات کی تاریخیں درج ہیں۔ {cite:zij-sabi-nallino-byblion p.85}۔"
  es: "Al-Battani fecha sus eclipses en años que él denomina años de Dhu al-Qarnayn, los cuales, según afirma, se cuentan a partir de la muerte de Alejandro. Esta es la época en la que se fechan los cuatro eclipses mencionados en este capítulo. {cite:zij-sabi-nallino-byblion p.85}."
  fr: "Al-Battani date ses éclipses selon des années qu'il appelle les années de Dhu al-Qarnayn, qu'il précise compter à partir de la mort d'Alexandre. C'est à cette époque que se situent les quatre éclipses décrites dans ce chapitre. {cite:zij-sabi-nallino-byblion p.85}"
  tr: "El-Battani, tutulmaları Zülkarneyn yılları olarak adlandırdığı yıllarla tarihlendirir ve bunların İskender'in ölümünden itibaren sayıldığını belirtir; bu, bu bölümde bahsedilen dört tutulmanın tarihlerinin yerleştirildiği dönemdir. {cite:zij-sabi-nallino-byblion s.85}."
  id: "Al-Battani mencatat gerhana berdasarkan tahun yang disebutnya tahun Dzul-Qarnayn, dan menyatakan bahwa gerhana tersebut dihitung dari kematian Alexander; inilah era di mana tanggal keempat gerhana yang disebutkan dalam bab ini ditempatkan. {cite:zij-sabi-nallino-byblion p.85}."
