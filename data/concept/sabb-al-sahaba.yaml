id: concept/sabb-al-sahaba
class: concept
kind: ethical
label:
  ar: "سبّ الصحابة"
  en: "Reviling the Companions (sabb al-sahaba)"
  ur: "صحابہ کو برا کہنا"
  es: "Injuriar a los Compañeros (sabb al-sahaba)"
  fr: "Injurier les compagnons (sabb al-sahaba)"
  tr: "Yoldaşlara Hakaret Etmek"
  id: "Menghina Para Sahabat"
summary:
  ar: "يعدّ عمر عبد الكافي سبّ أحد من صحابة النبي آفة خطيرة من آفات اللسان، ويستدل بأحاديث في فضلهم والنهي عن سبّهم، ويرى أنهم الذين نقلوا الدين، وأن من يطعن فيهم يخرج من الدين ما لم يتب، وهذا حكمه هو."
  en: "Omar Abdelkafy counts reviling any of the Prophet's Companions as a grave fault of the tongue, cites hadiths on their merit and the prohibition of reviling them, holds that they transmitted the religion, and judges that whoever attacks them leaves the religion unless he repents; this judgement is his."
  ur: "عمر عبد الکافی نبی کے کسی صحابی کو برا کہنے کو زبان کی ایک سنگین آفت شمار کرتے ہیں، ان کی فضیلت اور انہیں برا کہنے کی ممانعت کی احادیث سے استدلال کرتے ہیں، ان کے نزدیک دین انہی نے منتقل کیا، اور ان کا حکم ہے کہ جو ان پر طعن کرے وہ توبہ نہ کرے تو دین سے نکل جاتا ہے؛ یہ حکم انہی کا ہے۔"
  es: "Omar Abdelkafy considera que insultar a cualquiera de los Compañeros del Profeta es una falta grave de la lengua, cita hadices sobre sus méritos y la prohibición de insultarlos, sostiene que transmitieron la religión y juzga que quien los ataca abandona la religión a menos que se arrepienta; este juicio es suyo."
  fr: "Omar Abdelkafy considère l'injure envers l'un des Compagnons du Prophète comme une grave faute de la langue, cite des hadiths sur leur mérite et l'interdiction de les injurier, soutient qu'ils ont transmis la religion et juge que quiconque les attaque quitte la religion à moins de se repentir; tel est son jugement."
  tr: "Ömer Abdülkafi, Peygamber'in sahabelerinden birine lanet etmeyi dil için ciddi bir bela olarak görür. Hadisleri erdemlerinin kanıtı ve hakaret etmeme yasağına göstererek, dini aktaranların onlar olduğuna inanır ve eleştirenlerin tövbe etmeden dinden ayrılacağına inanır. Bu onun hükmüdür."
  id: "Umar Abd al-Kafi menganggap mengutuk salah satu sahabat Nabi sebagai penyakit serius dalam lidah. Ia mengutip hadits sebagai bukti kebajikan dan larangan menghina mereka, dan ia percaya bahwa merekalah yang menularkan agama, dan siapa pun yang mengkritik mereka meninggalkan agama kecuali mereka bertobat. Inilah putusannya."
