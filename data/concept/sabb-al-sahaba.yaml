id: concept/sabb-al-sahaba
class: concept
kind: ethical
label:
  ar: "سبّ الصحابة"
  en: "Reviling the Companions (sabb al-sahaba)"
  ur: "صحابہ کو برا کہنا"
summary:
  ar: "يعدّ عمر عبد الكافي سبّ أحد من صحابة النبي آفة خطيرة من آفات اللسان، ويستدل بأحاديث في فضلهم والنهي عن سبّهم، ويرى أنهم الذين نقلوا الدين، وأن من يطعن فيهم يخرج من الدين ما لم يتب، وهذا حكمه هو."
  en: "Omar Abdelkafy counts reviling any of the Prophet's Companions as a grave fault of the tongue, cites hadiths on their merit and the prohibition of reviling them, holds that they transmitted the religion, and judges that whoever attacks them leaves the religion unless he repents; this judgement is his."
  ur: "عمر عبد الکافی نبی کے کسی صحابی کو برا کہنے کو زبان کی ایک سنگین آفت شمار کرتے ہیں، ان کی فضیلت اور انہیں برا کہنے کی ممانعت کی احادیث سے استدلال کرتے ہیں، ان کے نزدیک دین انہی نے منتقل کیا، اور ان کا حکم ہے کہ جو ان پر طعن کرے وہ توبہ نہ کرے تو دین سے نکل جاتا ہے؛ یہ حکم انہی کا ہے۔"
