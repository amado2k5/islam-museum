id: concept/umum-al-muqtada
class: concept
kind: legal
label:
  ar: "عُمُوم المُقْتَضَى"
  en: "The generality of the implied (umum al-muqtada) in the usage of texts"
  ur: "عمومِ مقتضیٰ"
summary:
  ar: "عموم المقتضى: ما استدعاه صدق الكلام أو صحته من أمر غير مذكور في اللفظ، فيكون مقدراً لأجل صحة الكلام، ولا يعمل النص إلا بعد تقديره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11880}. وذهب الحنفية إلى أن المقتضى لا عموم له، لأن العموم من عوارض الألفاظ، والمقتضى ليس لفظاً، وذهب الشافعية إلى أن للمقتضى عموماً وخصوصاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11881}. وعلى ذلك بنى الأصوليون حكم رفع الخطأ والنسيان في الحديث، فرفع الحكم عاماً في الآخرة وفي الدنيا من حيث الحكم الشرعي، فلا يلزم المكره والمخطئ والناسي الحكم، وقال بعض الحنفية إن الرفع في الآخرة لا غير {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11882}. ويفرق عن عموم المجاز، فعموم المجاز متعلق بشمول اللفظ، وعموم المقتضى متعلق بالحكم المقدر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11881}."
  en: "'Umum al-muqtada is the implied meaning that the truth or soundness of a speech requires, though it is not stated in the words; it must be supplied for the speech to be sound, and the text is applied only after it is supplied {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11880}. The Hanafis hold that an implied meaning has no generality, since generality belongs to words and the implied is not a word; the Shafi'is hold that it has generality and particularity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11881}. On this the usulis built the rule of the report that God has removed error, forgetting and compulsion: the ruling removed is general, in the hereafter and in the sharia's legal ruling, so the compelled, the mistaken and the forgetful bear no legal liability; some Hanafis hold that the removal applies only in the hereafter {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11882}. It differs from 'umum al-majaz, which concerns the scope of the word, while 'umum al-muqtada concerns the supplied ruling {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11881}."
