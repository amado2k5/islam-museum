label:
  ar: "الأذواء"
  en: "Al-Adhwa' (the dhu-lords of Yaman)"
summary:
  ar: "جمع تكسير لكلمة «ذو»، ويعني ملوك اليمن وأمراءها الذين تبدأ أسماؤهم بـ«ذو»، وأشهرهم الأذواء الثمانية من حمير الذين كان لهم حق التولية عند اختيار الملك {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  en: "The broken plural of dhu, denoting the kings and lords of Yaman whose names begin with dhu. The most famous are the Mathamina, the eight princes of Himyar with the right of investiture when a king was chosen {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
