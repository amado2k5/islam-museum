id: concept/al-adhwa
class: concept
kind: term
label:
  ar: "الأذواء"
  en: "Al-Adhwa' (the dhu-lords of Yaman)"
  fr: "Al-Adhwa' (les seigneurs dhu du Yaman)"
  es: "Al-Adhwa' (los señores dhu de Yemen)"
  ur: "الاضحوا ⁦(یمن کے ذو رب)⁩"
summary:
  ar: "جمع تكسير لكلمة «ذو»، ويعني ملوك اليمن وأمراءها الذين تبدأ أسماؤهم بـ«ذو»، وأشهرهم الأذواء الثمانية من حمير الذين كان لهم حق التولية عند اختيار الملك {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  en: "The broken plural of dhu, denoting the kings and lords of Yaman whose names begin with dhu. The most famous are the Mathamina, the eight princes of Himyar with the right of investiture when a king was chosen {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  fr: "Pluriel brisé de dhu, désignant les rois et seigneurs du Yaman dont les noms commencent par dhu. Les plus célèbres sont les Mathamina, les huit princes de Himyar qui détenaient le droit d’investiture lors du choix d’un roi {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  es: "El plural roto de dhu, que denota a los reyes y señores de Yaman cuyos nombres comienzan con dhu. Los más famosos son los Mathamina, los ocho príncipes de Himyar con derecho de investidura cuando se elegía un rey {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  ur: "ذو کی ٹوٹی ہوئی جمع، یمن کے بادشاہوں اور ربوں کو ظاہر کرتا ہے جن کے نام ذو سے شروع ہوتے ہیں۔ سب سے زیادہ مشہور متھامینہ ہیں، ہمیار کے آٹھ شہزادے جن کے پاس سرمایہ کاری کا حق تھا جب ایک بادشاہ کا انتخاب کیا گیا تھا۔ 1 ص۔ 213}۔"
