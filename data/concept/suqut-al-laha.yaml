id: concept/suqut-al-laha
class: concept
kind: scientific
label:
  ar: "سقوط اللهاة"
  en: "The falling of the uvula"
  ur: "لہات کا گرنا"
  es: "La caída de la úvula"
  fr: "La chute de la luette"
summary:
  ar: "سقوط اللهاة قد يكون بحمى وقد يكون بغير حمى وسقوطها أن تمتد إلى أسفل حتى لا ترجع إلى موضعها وربما احتاج المزدرد إلى الغمز بالإصبع حتى يسوغ ⁦(محمول على أنه وصف الكتاب لا عملية)⁩ {cite:canon-ibn-sina-print-v2 p.298}"
  en: "The uvula's falling may be with fever and may be without fever; its falling is that it stretches downward so it does not return to its place, and the swallower may need pressing with the finger to swallow (carried as the book's description, not a procedure) {cite:canon-ibn-sina-print-v2 p.298}"
  ur: "لہات کا گرنا بخار کے ساتھ بھی ہو سکتا ہے اور بغیر بخار بھی؛ اس کا گرنا یہ ہے کہ وہ نیچے بڑھ جائے یہاں تک کہ اپنی جگہ واپس نہ آئے اور نگلنے والے کو نگلنے کے لیے انگلی سے دبانے کی ضرورت پڑ سکتی ہے ⁦(کتاب کے وصف پر محمول، طریقہ نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.298}"
  es: "La caída de la úvula puede ocurrir con o sin fiebre; su caída consiste en que se estira hacia abajo y no regresa a su lugar, y puede ser necesario presionar con el dedo para tragar (según la descripción del libro, no como un procedimiento) {cite:canon-ibn-sina-print-v2 p.298}"
  fr: "La chute de la luette peut survenir avec ou sans fièvre; elle se caractérise par un étirement vers le bas qui l’empêche de reprendre sa place, et le patient peut avoir besoin d’appuyer dessus avec le doigt pour avaler (il s’agit d’une description du livre, et non d’une procédure) {cite:canon-ibn-sina-print-v2 p.298}"
