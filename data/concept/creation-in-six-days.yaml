id: concept/creation-in-six-days
class: concept
kind: term
label: { ar: "خلق السماوات والأرض في ستة أيام", en: "The creation of the heavens and the earth in six days", ur: "آسمانوں اور زمین کی چھ دنوں میں تخلیق", es: "La creación de los cielos y la tierra en seis días", fr: "La création des cieux et de la terre en six jours", tr: "Gökyüzünü ve yeri altı günde yarattı", id: "Dia menciptakan langit dan bumi dalam enam hari" }
summary:
  ar: "تذكر آيات متعددة أن الله خلق السماوات والأرض في ستة أيام وكان عرشه على الماء، واختلف المفسرون في معنى اليوم: أيام كأيامنا أم كل يوم ألف سنة، وفي حديث مسلم عن أبي هريرة تفصيل لأيام الخلق أعلّه البخاري وغيره بأنه من كلام كعب الأحبار {cite:tafsir-ibn-kathir on 7:54} {cite:sahih-muslim 2789}."
  en: "Several verses say God created the heavens and the earth in six days with His Throne upon the water; commentators differed on what a day means, days like ours or each a thousand years, and a hadith in Sahih Muslim from Abu Hurayra that apportions the creation across days was held by al-Bukhari and others to be Ka'b al-Ahbar's report {cite:tafsir-ibn-kathir on 7:54} {cite:sahih-muslim 2789}."
  ur: "متعدد آیات میں آیا ہے کہ اللہ نے آسمان اور زمین کو چھ دنوں میں پیدا کیا اور اس کا عرش پانی پر تھا؛ مفسرین نے دن کے معنی میں اختلاف کیا، ہمارے دنوں جیسے یا ہر دن ہزار سال کا، اور صحیح مسلم میں ابوہریرہ کی ایک حدیث تخلیق کے دنوں کی تفصیل دیتی ہے جسے بخاری اور دوسروں نے کعب الاحبار کی روایت قرار دیا {cite:tafsir-ibn-kathir on 7:54} {cite:sahih-muslim 2789}۔"
  es: "Varios versículos dicen que Dios creó los cielos y la tierra en seis días con Su Trono sobre el agua; los comentaristas difirieron en cuanto al significado de un día, días como los nuestros o cada uno de mil años, y un hadiz en Sahih Muslim de Abu Hurayra que reparte la creación en días fue considerado por al-Bukhari y otros como el informe de Ka'b al-Ahbar {cite:tafsir-ibn-kathir on 7:54} {cite:sahih-muslim 2789}."
  fr: "Plusieurs versets affirment que Dieu a créé les cieux et la terre en six jours, avec Son Trône sur l'eau; les commentateurs ont divergé sur la signification d'un jour, des jours comme les nôtres ou chacun de mille ans, et un hadith du Sahih Muslim d'Abu Hurayra qui répartit la création sur plusieurs jours a été considéré par al-Bukhari et d'autres comme étant le rapport de Ka'b al-Ahbar {cite:tafsir-ibn-kathir on 7:54} {cite:sahih-muslim 2789}."
  tr: "Birçok ayet, Allah'ın gökleri ve yeryüzünü altı günde yarattığını ve Tahtının suyun üzerinde olduğunu belirtir. Tercümenler günün anlamı konusunda farklı görüşteydi: bizim gibi günler mi yoksa her gün bin yıl mı? Ebu Hureyre'den Müslüman tarafından yazılmış bir hadiste, Kâb Yazımanların sözlerinden (atı:tefsir-ibn-kathir 7:54} {cite:sahih-müslim 2789} olarak belirtilen yaratılış günlerinin ayrıntılı bir tanımı."
  id: "Beberapa ayat menyebutkan bahwa Allah menciptakan langit dan bumi dalam enam hari, dan Takhta-Nya berada di atas air. Para penafsir berbeda pendapat mengenai makna hari itu: hari-hari seperti kita atau setiap hari seribu tahun. Dalam hadits oleh Muslim dari Abu Huraira, terdapat deskripsi rinci tentang hari-hari penciptaan, yang Al-Bukhari dan lainnya sebutkan dari kata-kata Ka'b para Ahli Kitab {cite:tafsir-ibn-kathir pada 7:54} {cite:sahih-muslim 2789}."
