id: concept/creation-in-six-days
class: concept
kind: term
label: { ar: "خلق السماوات والأرض في ستة أيام", en: "The creation of the heavens and the earth in six days", ur: "آسمانوں اور زمین کی چھ دنوں میں تخلیق" }
summary:
  ar: "تذكر آيات متعددة أن الله خلق السماوات والأرض في ستة أيام وكان عرشه على الماء، واختلف المفسرون في معنى اليوم: أيام كأيامنا أم كل يوم ألف سنة، وفي حديث مسلم عن أبي هريرة تفصيل لأيام الخلق أعلّه البخاري وغيره بأنه من كلام كعب الأحبار {cite:tafsir-ibn-kathir on 7:54} {cite:sahih-muslim 2789}."
  en: "Several verses say God created the heavens and the earth in six days with His Throne upon the water; commentators differed on what a day means, days like ours or each a thousand years, and a hadith in Sahih Muslim from Abu Hurayra that apportions the creation across days was held by al-Bukhari and others to be Ka'b al-Ahbar's report {cite:tafsir-ibn-kathir on 7:54} {cite:sahih-muslim 2789}."
  ur: "متعدد آیات میں آیا ہے کہ اللہ نے آسمان اور زمین کو چھ دنوں میں پیدا کیا اور اس کا عرش پانی پر تھا؛ مفسرین نے دن کے معنی میں اختلاف کیا، ہمارے دنوں جیسے یا ہر دن ہزار سال کا، اور صحیح مسلم میں ابوہریرہ کی ایک حدیث تخلیق کے دنوں کی تفصیل دیتی ہے جسے بخاری اور دوسروں نے کعب الاحبار کی روایت قرار دیا {cite:tafsir-ibn-kathir on 7:54} {cite:sahih-muslim 2789}۔"
