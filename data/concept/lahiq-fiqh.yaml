id: concept/lahiq-fiqh
class: concept
kind: legal
label:
  ar: "اللاحق"
  en: "Late joiner to prayer (lahiq), fiqh rulings"
  ur: "لاحق (فقہی احکام)"
summary:
  ar: "اللاحق في اصطلاح الحنفية من فاتته الركعات كلها أو بعضها بعد اقتدائه بعذر، كغفلة أو زحمة أو سبق حدث، أو بغير عذر بأن سبق إمامه في ركوع أو سجود؛ وعرّفه بعضهم بأنه من أدرك أول الصلاة وفاته آخرها بنوم أو حدث {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13556}."
  en: "For the Hanafis, a lahiq is one who missed all or some of the rak'at after joining the prayer with an excuse, such as heedlessness, crowding or a breach, or without excuse, as when he got ahead of the imam in bowing or prostration; others define him as one who caught the beginning of the prayer and missed its end through sleep or a breach {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13556}."
  ur: "حنفیہ کے نزدیک لاحق وہ شخص ہے جس کی تمام یا بعض رکعات امام کے ساتھ اقتدا کے بعد عذر کی وجہ سے فوت ہو گئی ہوں، جیسے غفلت، ہجوم یا وضو ٹوٹنا، یا بغیر عذر، جیسے امام سے پہلے رکوع یا سجدہ کرنا؛ بعض فقہاء نے کہا کہ جس نے نماز کا شروع امام کے ساتھ پایا اور آخر نیند یا حدث کی وجہ سے فوت ہو گیا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13556}۔"
