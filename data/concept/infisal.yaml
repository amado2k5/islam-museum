id: concept/infisal
class: concept
kind: legal
label: { ar: "الانفصال", en: "Infisal (separation of parts of the body, of the foetus and of the spouses, and its rulings)", es: "Infisal (separación de las partes del cuerpo, del feto y de los cónyuges, y sus normas)", fr: "Infisal (séparation des parties du corps, du fœtus et des époux, et ses règles)" }
summary:
  ar: "الانفصال لغة الانقطاع، وهو مطاوع فصل وضد الاتصال، ويكون ظاهرا وخافيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} وتتغير أحكام بعض الأجزاء بالانفصال، فما يحرم النظر إليه قبل الانفصال يحرم بعده، وما انفصل من الميت يغسل ويصلى عليه ويدفن عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} والسقط إن انفصل حيا ثم مات أخذ حكم الكبير، وإن انفصل ميتا فلا يصلى عليه ويدفن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} ولا يرث من انفصل ميتا باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} وينفصل الزوجان بالفسخ أو الانفساخ، أو الطلاق، أو الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537}"
  en: "Infisal is lexically cutting off, the reflexive of fasl, and the opposite of joining, whether visibly or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} Some parts change their ruling on separation: what is forbidden to look at before it separates remains forbidden after, and some jurists wash, pray over and bury what separates from a dead body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} A miscarriage born alive and then dying takes the ruling of an adult; one born dead is not prayed over but buried. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} One who is born dead does not inherit, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} Spouses are separated by dissolution, by divorce, or by death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537}"
  es: "Infisal es léxicamente cortar, el reflexivo de fasl, y lo opuesto a unir, ya sea visible o no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} Algunas partes cambian su dictamen sobre la separación: lo que está prohibido mirar antes de que se separe sigue estando prohibido después, y algunos juristas lavan, rezan y entierran lo que se separa de un cuerpo muerto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} Un aborto espontáneo nace vivo y luego muere toma el dictamen de un adulto; uno que nace muerto no es rezado sino enterrado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} Uno que nace muerto no hereda, por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} Los cónyuges están separados por disolución, divorcio o muerte. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537}"
  fr: "Infisal signifie « couper », le pronom réfléchi de fasl, et l'opposé de « joindre », que ce soit visible ou non. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} Certaines régions modifient leur interprétation de la séparation: ce qu'il est interdit de regarder avant la séparation le reste après, et certains juristes lavent, prient et enterrent ce qui se sépare d'un corps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} Un enfant mort-né, issu d'une fausse couche, est traité comme un adulte; un enfant mort-né n'est pas couvert de prières mais enterré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} Celui qui est mort-né n'hérite pas, par convention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} Les conjoints sont séparés par dissolution, par divorce ou par décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537}"
