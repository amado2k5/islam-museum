id: concept/infisal
class: concept
kind: legal
label: { ar: "الانفصال", en: "Infisal (separation of parts of the body, of the foetus and of the spouses, and its rulings)" }
summary:
  ar: "الانفصال لغة الانقطاع، وهو مطاوع فصل وضد الاتصال، ويكون ظاهرا وخافيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} وتتغير أحكام بعض الأجزاء بالانفصال، فما يحرم النظر إليه قبل الانفصال يحرم بعده، وما انفصل من الميت يغسل ويصلى عليه ويدفن عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} والسقط إن انفصل حيا ثم مات أخذ حكم الكبير، وإن انفصل ميتا فلا يصلى عليه ويدفن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} ولا يرث من انفصل ميتا باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} وينفصل الزوجان بالفسخ أو الانفساخ، أو الطلاق، أو الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537}"
  en: "Infisal is lexically cutting off, the reflexive of fasl, and the opposite of joining, whether visibly or not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} Some parts change their ruling on separation: what is forbidden to look at before it separates remains forbidden after, and some jurists wash, pray over and bury what separates from a dead body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3536} A miscarriage born alive and then dying takes the ruling of an adult; one born dead is not prayed over but buried. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} One who is born dead does not inherit, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537} Spouses are separated by dissolution, by divorce, or by death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3537}"
