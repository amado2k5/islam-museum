label: { ar: "اتحاد الحكم", en: "Unity of the ruling (ittihad al-hukm)", es: "Unidad del gobierno (ittihad al-hukm)", fr: "Unité de la décision (ittihad al-hukm)", ur: "اتحاد حکم ⁦(اتحاد الحکم)⁩", tr: "Hakem Birliği", id: "Serikat Wasit" }
summary:
  ar: "الاتحاد في اللغة صيرورة الشيئين شيئاً واحداً، والحكم خطاب الله المتعلق بأفعال المكلفين بالاقتضاء أو التخيير أو الوضع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} ويتناول الأصوليون اتحاد الحكم في موضعين: عند ورود اللفظ مطلقاً في موضع ومقيداً في آخر، وعند تعدد العلة للحكم الواحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} وجوّز الجمهور أن يُعلّل الحكم الواحد بعلتين فأكثر، وادّعوا وقوعه كالحدث بالمس واللمس والبول، فكل منها يمنع الصلاة. وجوّزه ابن فورك والرازي في العلة المنصوصة دون المستنبطة، ورأى صاحب جمع الجوامع امتناعه عقلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472}"
  en: "Literally ittihad is two things becoming one, and the ruling (hukm) is God's address concerning the acts of responsible persons, by demand, by choice or by stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} The usulis treat unity of the ruling in two places: when a word appears unrestricted in one text and restricted in another, and when one ruling has several causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} The majority allow one ruling to have two or more causes, and they hold that this occurs: touching, contact and urination each prevent prayer. Ibn Furak and al-Razi allowed it only for causes stated in the text and not for derived ones; the author of Jam' al-Jawami' held that it is rationally impossible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472}"
  es: "Literalmente, ittihad significa dos cosas que se convierten en una, y la norma (hukm) es la intervención de Dios respecto a los actos de las personas responsables, ya sea por exigencia, elección o estipulación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} Los usulis tratan la unidad de la norma en dos casos: cuando una palabra aparece sin restricciones en un texto y restringida en otro, y cuando una norma tiene varias causas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} La mayoría permite que una norma tenga dos o más causas, y sostienen que esto ocurre: tocar, el contacto y orinar impiden la oración. Ibn Furak y al-Razi lo permitieron solo para las causas indicadas en el texto y no para las derivadas; el autor de Jam' al-Jawami' sostuvo que es racionalmente imposible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472}"
  fr: "Littéralement, l'ittihad signifie l'union de deux choses en une seule, et la règle (hukm) est l'avis de Dieu concernant les actes des personnes responsables, par exigence, par choix ou par stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} Les usulis traitent de l'unité de la règle en deux points: lorsqu'un mot apparaît sans restriction dans un texte et avec restriction dans un autre, et lorsqu'une règle a plusieurs causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} La majorité admet qu'une règle puisse avoir deux causes ou plus, et considère que cela se produit: toucher, entrer en contact et uriner empêchent chacun la prière. Ibn Furak et al-Razi ne l'admettaient que pour les causes énoncées dans le texte et non pour les causes dérivées; l'auteur de Jam' al-Jawami' estimait que c'était rationnellement impossible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472}"
  ur: "لفظی طور پر اتحاد دو چیزوں کا ایک ہو جانا ہے، اور حکم ⁦(حکم)⁩ ذمہ داروں کے اعمال کے بارے میں خدا کا خطاب ہے، مطالبہ، انتخاب یا شرط کے ذریعہ۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1472} اصول دو جگہوں پر حکم کی توحید کو کہتے ہیں: جب کوئی لفظ ایک متن میں غیر محدود اور دوسرے میں محدود ہو اور جب ایک حکم کے کئی اسباب ہوں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1472} جمہور ایک حکم کو دو یا زیادہ اسباب کی اجازت دیتے ہیں، اور ان کے نزدیک ایسا ہوتا ہے: چھونا، رابطہ اور پیشاب ہر ایک نماز کو روکتا ہے۔ ابن فراق اور الرازی نے اس کی اجازت صرف متن میں بیان کردہ وجوہات کے لیے دی ہے نہ کہ اخذ کردہ وجوہات کے لیے۔ جام الجوامی کے مصنف کا خیال ہے کہ یہ عقلی طور پر ناممکن ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1472}"
  tr: "Dilde birlik, iki şeyin bir şeye dönüşmesidir; yönetim, zorunluluk, seçim veya belirleme sorumlularının eylemleriyle ilgili Tanrı'nın söylemidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1472} Usul (usul) bilginleri, hükümlerin birliğini iki yerde ele alır: kelimenin bir yerde mutlak olarak ortaya çıkıp başka bir yerde kısıtlandığında ve tek bir hükmün nedeni çoğaldığında. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1472} Çoğunluk, tek bir hükmü iki veya daha fazla gerekçeyle haklı çıkarabilir; bunun dokunma, dokunma veya idrar yoluyla yapılan kirlilik gibi ortaya çıktığını ve her birinin namazı engellediğini iddia eder. İbn Furak ve Al-Razi, açık nedenler için izin verdiler ama türemiş nedenler için değil, Jami'Al-Jami'nin yazarı bunu mantıklı olarak uygun bulmamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1472}"
  id: "Dalam bahasa, kesatuan adalah transformasi dua hal menjadi satu hal, dan pemerintahan adalah wacana Tuhan yang berkaitan dengan tindakan mereka yang bertanggung jawab atas kebutuhan, pilihan, atau penunjukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1472} Para sarjana usul (usul) membahas kesatuan aturan dalam dua tempat: ketika kata muncul secara mutlak di satu tempat dan dibatasi di tempat lain, dan ketika penyebab satu keputusan berganda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1472} Mayoritas dapat membenarkan satu keputusan dengan dua atau lebih alasan, mengklaim bahwa itu terjadi seperti ketidakmurnian dengan menyentuh, menyentuh, atau buang air kecil, yang masing-masing menghalangi doa. Ibn Furak dan Al-Razi mengizinkannya terkait sebab eksplisit tetapi bukan yang turunan, dan penulis Jami' Al-Jami' menganggapnya tidak tepat secara rasional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472}"
