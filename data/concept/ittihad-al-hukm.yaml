id: concept/ittihad-al-hukm
class: concept
kind: legal
label: { ar: "اتحاد الحكم", en: "Unity of the ruling (ittihad al-hukm)" }
summary:
  ar: "الاتحاد في اللغة صيرورة الشيئين شيئاً واحداً، والحكم خطاب الله المتعلق بأفعال المكلفين بالاقتضاء أو التخيير أو الوضع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} ويتناول الأصوليون اتحاد الحكم في موضعين: عند ورود اللفظ مطلقاً في موضع ومقيداً في آخر، وعند تعدد العلة للحكم الواحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} وجوّز الجمهور أن يُعلّل الحكم الواحد بعلتين فأكثر، وادّعوا وقوعه كالحدث بالمس واللمس والبول، فكل منها يمنع الصلاة. وجوّزه ابن فورك والرازي في العلة المنصوصة دون المستنبطة، ورأى صاحب جمع الجوامع امتناعه عقلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472}"
  en: "Literally ittihad is two things becoming one, and the ruling (hukm) is God's address concerning the acts of responsible persons, by demand, by choice or by stipulation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} The usulis treat unity of the ruling in two places: when a word appears unrestricted in one text and restricted in another, and when one ruling has several causes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} The majority allow one ruling to have two or more causes, and they hold that this occurs: touching, contact and urination each prevent prayer. Ibn Furak and al-Razi allowed it only for causes stated in the text and not for derived ones; the author of Jam' al-Jawami' held that it is rationally impossible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472}"
