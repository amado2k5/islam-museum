id: concept/zij-sabi-the-stars-place-on-the-ecliptic-same-side
class: concept
kind: scientific
label: { ar: "موضع الكوكب من فلك البروج إذا اتفقت الجهتان", en: "The place of a star on the ecliptic when the two directions agree", ur: "ستارے کا فلک البروج میں مقام جب دونوں جہتیں ایک ہوں", es: "La posición de una estrella en la eclíptica cuando las dos direcciones coinciden.", fr: "La position d'une étoile sur l'écliptique lorsque les deux directions coïncident." }
summary:
  ar: "يأخذ البتاني ميل الجزء الذي يتوسط السماء مع الكوكب وبعد الكوكب عن معدل النهار. فإن كانا في جهة واحدة نُقص الأقل من الأكثر والباقي هو البعد المعدّل، ثم تُجرى سلسلة طويلة من ضرب الأوتار وقسمتها تدخل فيها تمامات البعد المعدّل وتمام الميل الكلي والوتر الأطول والوتر الزائد، وتنتهي بقوس هي اختلاف الكوكب. {cite:zij-sabi-nallino-byblion pp.59-60}."
  en: "Al-Battani takes the declination of the part that culminates with the star and the star's distance from the equator. If they are in one direction, the smaller is taken from the larger and the remainder is the corrected distance; a long chain of multiplications and divisions of chords then follows, bringing in the complements of the corrected distance and of the full obliquity, the longest chord and the added chord, and ends in an arc that is the difference of the star. {cite:zij-sabi-nallino-byblion pp.59-60}."
  ur: "البتانی اس جزء کا میل لیتے ہیں جو ستارے کے ساتھ وسط السماء میں آتا ہے اور ستارے کا معدل النہار سے بعد۔ اگر دونوں ایک جہت میں ہوں تو چھوٹے کو بڑے میں سے گھٹایا جاتا ہے اور باقی بعدِ معدّل ہے؛ پھر اوتار کے ضرب و تقسیم کا ایک لمبا سلسلہ آتا ہے جس میں بعدِ معدّل اور کل میل کے تمام، سب سے لمبا وتر اور وترِ زائد شامل ہیں، اور وہ ایک قوس پر ختم ہوتا ہے جو ستارے کا اختلاف ہے۔ {cite:zij-sabi-nallino-byblion pp.59-60}۔"
  es: "Al-Battani toma la declinación de la parte que culmina con la estrella y la distancia de esta al ecuador. Si apuntan en la misma dirección, se resta la menor de la mayor y el resto es la distancia corregida; a continuación, sigue una larga cadena de multiplicaciones y divisiones de cuerdas, que incorpora los complementos de la distancia corregida y de la oblicuidad total, la cuerda más larga y la cuerda añadida, y termina en un arco que representa la diferencia de la estrella. {cite:zij-sabi-nallino-byblion pp.59-60}."
  fr: "Al-Battani calcule la déclinaison du segment qui culmine avec l'étoile et la distance de cette étoile à l'équateur. Si ces distances sont dans la même direction, on soustrait la plus petite à la plus grande, et le résultat est la distance corrigée. S'ensuit une longue série de multiplications et de divisions de cordes, qui font intervenir les compléments de la distance corrigée et de l'obliquité totale, la corde la plus longue et la corde ajoutée, pour aboutir à un arc correspondant à la différence de l'étoile. {cite:zij-sabi-nallino-byblion pp.59-60}."
