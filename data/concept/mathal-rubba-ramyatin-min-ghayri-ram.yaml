tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "مثل «رب رمية من غير رام»"
  en: "The proverb 'Many a shot is from one who is no archer'"
  ur: "مثل «رب رمیة من غیر رام»"
  fr: "Le proverbe « Bien des tirs viennent de qui n'est pas archer »"
  es: "El proverbio «Muchos disparos vienen de quien no es arquero»"
summary:
  ar: "مثل يُضرب في نجاح غير متوقع من مبتدئ، وقصته أن رامياً مشهوراً أخفق مراراً فأصاب ابنه الصغير الهدف من أول رمية {cite:ketabonline-majma-al-amthal-p16} {cite:noonpost-16943}."
  en: "A proverb for unexpected success by a novice; its tale is of a renowned marksman who missed again and again while his young son hit the target with his first shot {cite:ketabonline-majma-al-amthal-p16} {cite:noonpost-16943}."
  ur: "وہ مثل جو نو آموز کی غیر متوقع کامیابی کے لیے کہی جاتی ہے؛ اس کا قصہ ایک مشہور تیرانداز کا ہے جو بار بار چوکا اور اس کے کم عمر بیٹے نے پہلے ہی تیر میں نشانہ لگا دیا {cite:ketabonline-majma-al-amthal-p16} {cite:noonpost-16943}۔"
  fr: "Proverbe dit d'un succès inattendu d'un débutant ; son histoire est celle d'un tireur renommé qui manqua encore et encore alors que son jeune fils atteignit la cible du premier coup {cite:ketabonline-majma-al-amthal-p16} {cite:noonpost-16943}."
  es: "Proverbio que se dice del éxito inesperado de un principiante; su relato es el de un tirador renombrado que falló una y otra vez mientras su joven hijo dio en el blanco al primer disparo {cite:ketabonline-majma-al-amthal-p16} {cite:noonpost-16943}."
