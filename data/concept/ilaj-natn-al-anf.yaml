id: concept/ilaj-natn-al-anf
class: concept
kind: scientific
label:
  ar: علاج النتن في الأنف
  en: The treatment of the stench in the nose
  ur: ناک کی بدبو کا علاج
  es: "El tratamiento del mal olor en la nariz"
summary:
  ar: يتقدم بتنقية ما اجتمع من الخلط الرديء إن كان في غير الخيشوم ثم يستعمل الفتائل والسعوطات والنفوخات والنشوقات واللطوخات، والأصوب أن يغسل الأنف قبلها بالشراب، ومن المجرب فيه أقراص تحل في الشراب فتقطر وطبيخ يستعمل أياماً، ومنه أن يحس الطيب والنتن ⁦(أسماء الأدوية والفتائل والأقراص والأبوال المذكورة في الكتاب تحمل جنسها وقولها منقول، والكيتان على اليافوخ ووسط الرأس تحمل وصف الكتاب لا استعمال)⁩ {cite:canon-ibn-sina-print-v2 p.245} {cite:canon-ibn-sina-print-v2 p.246}
  en: 'First evacuate whatever bad humour has gathered, if it is outside the nasal fossa, then use the tents, snuffs, insufflations, inhalations and liniments — the nose best washed with wine beforehand. Among the book''s tried items: tablets dissolved in wine and dripped in, and a decoction used for days by inhalation ⁦(the drug, tent and tablet names are carried by kind, as is the book''s naming of donkey urines as the most useful snuff — a report carried as attributed; the two cauteries at the temple hollows or mid-head are carried as the book''s description, not as instruction)⁩ {cite:canon-ibn-sina-print-v2 p.245} {cite:canon-ibn-sina-print-v2 p.246}'
  ur: پہلے اس بری خلط کی تنقية کی جائے جو جمع ہوئی ہے اگر وہ خیشوم کے باہر ہو، پھر فتائل، سعوط، نفوخ، نشوق اور لیپ استعمال ہوں — اور پہلے ناک کو شراب سے دھونا بہتر ہے؛ کتاب کے مجربات میں شراب میں گھول کر ٹپکائی جانے والی گولیاں اور ایک ایسا طبیخ ہے جو کئی دن نشوق کے طور پر استعمال ہو ⁦(ادویہ، فتائل اور گولیوں کے نام جنس کے اعتبار سے، اور گدھوں کے پیشاب کو کتاب کا سب سے مفید سعوط کہنا منقول قول ہے؛ یافوخ کی دونوں طرف کی دو داغیں یا سر کے وسط کی داغ کتاب کے بیان کے طور پر ہیں، طریقہ کار نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.245} {cite:canon-ibn-sina-print-v2 p.246}
  es: "Primero, expulse cualquier mal humor acumulado, si se encuentra fuera de la fosa nasal, luego use las tiendas de campaña, rapés, insuflaciones, inhalaciones y linimentos; lo mejor es lavar la nariz con vino previamente. Entre los elementos probados en el libro: tabletas disueltas en vino y administradas gota a gota, y una decocción utilizada durante días por inhalación (los nombres del medicamento, la tienda de campaña y las tabletas se indican por tipo, al igual que la denominación de la orina de burro como el rapé más útil en el libro; un informe que se presenta como atribuido; las dos cauterizaciones en las sienes o en la parte media de la cabeza se presentan como descripción del libro, no como instrucción) {cite:canon-ibn-sina-print-v2 p.245} {cite:canon-ibn-sina-print-v2 p.246}"
