label:
  ar: "كمثرى"
  en: "Kummathra (pear)"
  ur: "کمثریٰ"
summary:
  ar: "الكمثرى فيها أرضية ومائية، قابضة تدخل في ضمادات حبس المواد، والصيني بارد يابس في الأولى والثانية، والشاه أمرود الخراساني معتدل رطب مليّن، وفيها خاصية إحداث القولنج {cite:canon-ibn-sina-print-v1 p.534} {cite:canon-ibn-sina-print-v1 p.535}."
  en: "The pear has earthy and watery parts and is astringent, entering poultices that hold back matter. The Chinese kind is cold in the first degree and dry in the second; the Khurasani shah amrud is moderate and moist and loosening. The book names a property of bringing on colic {cite:canon-ibn-sina-print-v1 p.534} {cite:canon-ibn-sina-print-v1 p.535}."
  ur: "ناشپاتی میں ارضی اور آبی اجزا ہیں اور یہ قابض ہے، مادوں کو روکنے والے لیپوں میں داخل ہوتی ہے۔ چینی قسم پہلے درجے میں ٹھنڈی اور دوسرے میں خشک ہے؛ خراسانی شاہ امرود معتدل، تر اور نرم کرنے والا ہے۔ کتاب اس کی ایک خاصیت قولنج پیدا کرنا بتاتی ہے {cite:canon-ibn-sina-print-v1 p.534} {cite:canon-ibn-sina-print-v1 p.535}۔"
