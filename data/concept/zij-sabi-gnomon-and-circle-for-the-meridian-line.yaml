label: { ar: "تهيئة الموضع والدائرة والعود لمعرفة خط نصف النهار في الزيج الصابي", en: "Preparing the site, circle and rod for the meridian line", ur: "خط نصف النہار کے لیے جگہ، دائرے اور سلاخ کی تیاری", es: "Preparación del sitio, círculo y vara para la línea meridiana." }
summary:
  ar: "يفتتح البتاني الباب الثاني عشر بمعرفة خط نصف النهار، وهو سمت الجنوب، في أي بلد وفي أي وقت من السنة إذا لم يكن موضع الشمس معلوماً. وأول العمل تهيئة المكان: أرض مكشوفة الأفق، سطحها موزون غير مائل، تُدار فيها دائرة بأي قدر شئت ويُثبّت في مركزها عود مستقيم محدود الرأس. {cite:zij-sabi-nallino-byblion p.38}."
  en: "Al-Battani opens chapter 12 with the means of finding the meridian line, the line of the south, in any country and at any season, when the Sun's place is not known. The first step is to prepare the ground: a site with an open horizon, a level surface that does not slope, a circle drawn on it of any size, and an upright rod with a pointed head fixed at its centre. {cite:zij-sabi-nallino-byblion p.38}."
  ur: "البتانی بارہویں باب کا آغاز خط نصف النہار یعنی جنوب کی سمت معلوم کرنے سے کرتے ہیں، کسی بھی شہر میں اور سال کے کسی بھی وقت، جب سورج کی جگہ معلوم نہ ہو۔ پہلا کام جگہ کی تیاری ہے: کھلے افق والی زمین، ہموار اور غیر مائل سطح، اس پر کسی بھی ناپ کا دائرہ اور اس کے مرکز میں سیدھی نوک دار سلاخ۔ {cite:zij-sabi-nallino-byblion p.38}۔"
  es: "Al-Battani inicia el capítulo 12 con los métodos para hallar la línea meridiana, la línea del sur, en cualquier país y en cualquier estación del año, cuando se desconoce la posición del sol. El primer paso consiste en preparar el terreno: un lugar con horizonte despejado, una superficie nivelada y sin pendiente, un círculo dibujado sobre ella de cualquier tamaño y una vara vertical con punta fijada en su centro. {cite:zij-sabi-nallino-byblion p.38}."
