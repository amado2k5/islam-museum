id: concept/shajarat-tuba
class: concept
kind: belief
label:
  ar: "شجرة طوبى"
  en: "The Tree of Tuba"
  ur: "طوبٰی کا درخت"
  es: "El árbol de la tuba"
  fr: "L'arbre du tuba"
  tr: "Tuba ağacı"
  id: "Pohon Tuba"
summary:
  ar: "قال تعالى: «الذين آمنوا وعملوا الصالحات طوبى لهم وحسن مآب»، وفسّرها السلف بشجرة في الجنة، منها حلل أهل الجنة. وروي أنها شجرة في الجنة أصلها في دار رسول الله، ليس فيها غصن إلا وأعلاه بيت لأهل الجنة."
  en: "God says «those who believe and do righteous deeds — tuba is theirs and a goodly return», and the salaf read Tuba as a tree in Paradise from which the garments of its people come. It is reported that it is a tree whose trunk is in the Prophet's dwelling, with no branch that does not carry a dwelling of the people of Paradise at its tip."
  ur: "اللہ فرماتا ہے «جو ایمان لائے اور نیک عمل کیے ان کے لیے طوبٰی ہے اور اچھا ٹھکانا»۔ سلف نے طوبٰی کو جنت کا ایک درخت کہا ہے جس سے اہل جنت کے لباس آتے ہیں؛ روایت ہے کہ اس کی جڑ نبی کی رہائش میں ہے اور ہر شاخ کے سرے اہل جنت کا گھر ہے۔"
  es: "Dios dice: «Quienes creen y obran rectamente, recibirán la tuba y una buena recompensa». Los salaf interpretan la tuba como un árbol del Paraíso del que brotan las vestiduras de sus habitantes. Se narra que es un árbol cuyo tronco se encuentra en la morada del Profeta, y que cada rama que desciende de su copa lleva una morada de los habitantes del Paraíso."
  fr: "Dieu dit: « Ceux qui croient et accomplissent de bonnes œuvres, le tuba leur appartiendra, ainsi qu’une belle récompense. » Les pieux prédécesseurs (salaf) ont interprété le terme « tuba » comme désignant un arbre du Paradis d’où proviennent les vêtements de ses habitants. Il est rapporté que c’est un arbre dont le tronc se trouve dans la demeure du Prophète, et dont chaque branche porte à son extrémité une demeure des gens du Paradis."
  tr: "Yüce Allah şöyle buyurdu: \"İnanıp doğru işler yapanlar, onlara iyilik ve iyi bir karşılık getirmektir.\" İlk nesiller bunu, cennette bir ağaç olarak yorumlamışlardır; bu ağacın cennet halkının yaşadığı yerdir. Rivayete göre, bu ağacın cennette bir ağaçtır; başlangıçta Allah'ın Resulef'inin evindedir, üzerinde dal yoktur, sadece tepesi cennet ahliyetine ait bir evdir."
  id: "Allah Yang Maha Kuasa berfirman: \"Mereka yang beriman dan berbuat adil—baik bagi mereka dan balasan yang baik.\" Generasi awal menafsirkannya sebagai pohon di Surga, dari mana orang-orang surga berhuni. Diceritakan bahwa itu adalah pohon di Surga, awalnya di rumah Rasulullah, tanpa cabang kecuali puncaknya adalah rumah bagi umat Surga."
