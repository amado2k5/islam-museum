id: concept/shajarat-tuba
class: concept
kind: belief
label:
  ar: "شجرة طوبى"
  en: "The Tree of Tuba"
  ur: "طوبٰی کا درخت"
summary:
  ar: "قال تعالى: «الذين آمنوا وعملوا الصالحات طوبى لهم وحسن مآب»، وفسّرها السلف بشجرة في الجنة، منها حلل أهل الجنة. وروي أنها شجرة في الجنة أصلها في دار رسول الله، ليس فيها غصن إلا وأعلاه بيت لأهل الجنة."
  en: "God says «those who believe and do righteous deeds — tuba is theirs and a goodly return», and the salaf read Tuba as a tree in Paradise from which the garments of its people come. It is reported that it is a tree whose trunk is in the Prophet's dwelling, with no branch that does not carry a dwelling of the people of Paradise at its tip."
  ur: "اللہ فرماتا ہے «جو ایمان لائے اور نیک عمل کیے ان کے لیے طوبٰی ہے اور اچھا ٹھکانا»۔ سلف نے طوبٰی کو جنت کا ایک درخت کہا ہے جس سے اہل جنت کے لباس آتے ہیں؛ روایت ہے کہ اس کی جڑ نبی کی رہائش میں ہے اور ہر شاخ کے سرے اہل جنت کا گھر ہے۔"
