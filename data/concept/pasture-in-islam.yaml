summary:
  ar: "الكلأ عند المؤلف ما ينبت بنفسه من أخضر أو يابس، وهو عام في الأرض العامة لا يجوز لأحد أن يستأثر به بحمى خاص أو بحيلة كمنع فضل الماء {cite:usul-iqtisad-islami-0660 p. 221}. وفي أرض الدولة حمى عام ترعى فيه خيل الجهاد وسوائم الصدقة ورب الصريمة والغنيمة {cite:usul-iqtisad-islami-0660 p. 221}. وفي الأرض الخاصة يختلف الفقهاء في ملكيته لصاحب الأرض {cite:usul-iqtisad-islami-0660 p. 221}."
