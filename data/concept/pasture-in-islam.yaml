label:
  ar: "الكلأ"
  en: "Pasture (kala) in Islam"
  es: "Pastizal (kala) en el Islam"
  fr: "Le pâturage (kala) en islam"
  ur: "اسلام میں چراگاہ ⁦(کالا)⁩"
  tr: "Çim"
  id: "Rumput"
summary:
  ar: "الكلأ عند المؤلف ما ينبت بنفسه من أخضر أو يابس، وهو عام في الأرض العامة لا يجوز لأحد أن يستأثر به بحمى خاص أو بحيلة كمنع فضل الماء {cite:usul-iqtisad-islami-0660 p. 221}. وفي أرض الدولة حمى عام ترعى فيه خيل الجهاد وسوائم الصدقة ورب الصريمة والغنيمة {cite:usul-iqtisad-islami-0660 p. 221}. وفي الأرض الخاصة يختلف الفقهاء في ملكيته لصاحب الأرض {cite:usul-iqtisad-islami-0660 p. 221}."
  tr: "Yazara göre, yem, yeşil ya da kuru olsun, kendi kendine yetişen yem yemidir ve kamu arazisinde geneldir; kimse özel bir sebep veya hile nedeniyle, örneğin fazla suyu alıkoymak gibi tekelleştirilemez {cite:usul-iqtisad-islami-0660 s. 221}. Devlet arazisinde, cihat atlarının, yardım atlarının ve ganimet ve ganimetin efendisinin otlatıldığı genel bir terimdir {cite:usul-iqtisad-islami-0660 s. 221}. Özel arazide, hukukçular arazinin mülkiyeti konusunda farklı görüşler bildirir {cite:usul-iqtisad-islami-0660 s. 221}."
  id: "Menurut penulis, pakan adalah apa yang tumbuh sendiri, baik hijau maupun kering, dan umum di tanah publik; tidak ada yang boleh memonopolinya karena alasan atau trik khusus, seperti menahan air berlebih {cite:usul-iqtisad-islami-0660 hlm. 221}. Di tanah negara, istilah umum adalah di mana kuda jihad, kuda amal, dan penguasa rampasan dan rampasan digembalakan {cite:usul-iqtisad-islami-0660 hlm. 221}. Di tanah pribadi, ahli hukum berbeda pendapat mengenai kepemilikan tanah {cite:usul-iqtisad-islami-0660 hlm. 221}."
