id: concept/tashrih-al-anf
class: concept
kind: scientific
label:
  ar: تشريح الأنف
  en: The anatomy of the nose
  ur: ناک کی تشریح
  es: "La anatomía de la nariz"
summary:
  ar: مجريا الأنف ينفذان إلى المصفاة الموضوعة تحت الجسمين المشبهين بحلمتي الثدي، ويثقب الحجاب الدماغي ثقباً بإزاء ثقبة المصفاة لتنفذ الريح، وينتهي كل مجرى إلى الحلق؛ وآلة الشمّ هي الزائدتان الحلميتان في مقدم الدماغ المستمدتان من البطنين المقدمين، وبهما تنقى الفضول وينشق الهواء حامل الرائحة؛ والدماغ نفسه يتنفس ليحفظ الحار الغريزي فيربو كالنابض، وفي أقصى الأنف مجريان إلى الماقين ولذلك يذاق طعم الكحل بنزوله إلى اللسان {cite:canon-ibn-sina-print-v2 p.234}
  en: The two channels of the nose reach the sieve set under the two nipple-like bodies, and the brain's membrane is pierced opposite the sieve's hole so the pneuma passes; each channel ends at the pharynx. The instrument of smell is the two mamillary processes at the front of the brain, drawing from the two front ventricles, through which wastes are sifted and the odour-bearing air is inhaled. The brain itself breathes to keep its innate heat, swelling like a pulse; at the nose's far end two passages run to the eyes, so the taste of kohl is felt descending to the tongue {cite:canon-ibn-sina-print-v2 p.234}
  ur: ناک کے دو راستے چھالنی تک پہنچتے ہیں جو چوچی نما دو جسموں کے نیچے رکھی گئی ہے، اور دماغی پردہ چھالنی کے سوراخ کے سامنے چھیدا ہوا ہے کہ روحانی ہوا گزرے؛ ہر راستہ حلق پر ختم ہوتا ہے۔ شمّ کی آلہ دماغ کے اگلے حصے میں دو چوچی نما زائدے ہیں جو دماغ کے اگلے دو بطینوں سے مادہ لیتے ہیں اور جن کے سوراخوں سے فضول چھنی جاتی ہے اور بو والی ہوا اندر کھینچی جاتی ہے؛ دماغ خود تنفس کرتا ہے کہ اپنے فطری حار کو محفوظ رکھے اور نبض کی طرح پھولتا ہے؛ ناک کے آخری سرے سے آنکھوں کی طرف دو راستے ہیں، اسی لیے کحل کا ذائقہ زبان تک اترتا محسوس ہوتا ہے {cite:canon-ibn-sina-print-v2 p.234}
  es: "Los dos conductos nasales llegan al filtro situado bajo los dos cuerpos con forma de pezón, y la membrana del cerebro se perfora frente al orificio del filtro para que pase el aire; cada conducto termina en la faringe. El órgano del olfato son los dos procesos mamilares en la parte frontal del cerebro, que extraen aire de los dos ventrículos anteriores, a través de los cuales se filtran los desechos y se inhala el aire que contiene el olor. El cerebro mismo respira para mantener su calor innato, hinchándose como un pulso; en el extremo distal de la nariz, dos conductos se dirigen a los ojos, por lo que el sabor del kohl se siente descendiendo hasta la lengua {cite:canon-ibn-sina-print-v2 p.234}"
