summary:
  ar: "الريباس في الكتاب نبات ينبت في الربيع على الجبل وله قوة حماض الأترج والحصرم، بارد يابس في الثانية، مطفئ قاطع للدم مسكن للحرارة، ينفع من الطاعون ويحد البصر إذا اكتحل بعصارته، وينفع من الإسهال الصفراوي ومن الحصبة والجدري والطاعون {cite:canon-ibn-sina-print-v1 pp.667-668}"
  en: "Ribas is in the book a plant that grows in spring on the mountain, with the power of the sourness of the citron and of the unripe grape, cold and dry in the second degree, quenching, cutting blood and calming heat; it benefits plague, sharpens sight when used as kohl with its juice, and benefits bilious diarrhoea and measles, smallpox and plague {cite:canon-ibn-sina-print-v1 pp.667-668}"
  ur: "ریباس کتاب میں ایک پودا ہے جو بہار میں پہاڑ پر اگتا ہے اور اس میں ترنج اور کچے انگور کی کھٹاس کی قوت ہے، دوسرے درجے میں ٹھنڈا خشک، بجھانے والا، خون کو روکنے والا اور حرارت کو سکون دینے والا؛ طاعون میں نافع ہے، اس کے عرق کا سرمہ لگانے پر بینائی تیز کرتا ہے، اور صفراوی اسہال اور خسرہ، چیچک اور طاعون میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.667-668}۔"
  es: "En el libro, Ribas es una planta que crece en primavera en la montaña, con el poder de la acidez del cidro y de la uva verde, fría y seca en segundo grado, que calma y refresca la sangre y alivia el calor; es beneficiosa para la peste, agudiza la vista cuando se usa como kohl con su jugo, y es beneficiosa para la diarrea biliosa y el sarampión, la viruela y la peste {cite:canon-ibn-sina-print-v1 pp.667-668}"
  fr: "Le ribas est décrit dans le livre comme une plante qui pousse au printemps sur la montagne, possédant la puissance de l'acidité du citron et du raisin vert, froide et sèche au second degré, désaltérante, transpirante et apaisante; elle est bénéfique contre la peste, améliore la vue lorsqu'elle est utilisée comme khôl avec son jus, et est bénéfique contre la diarrhée bilieuse et la rougeole, la variole et la peste {cite:canon-ibn-sina-print-v1 pp.667-668}"
  tr: "Kitaptaki Rabas, dağda baharda yetişen ve taraj ile hasram asitlerinin gücüne sahip, ikinci asitlerinde soğuk-kuru olan, kanı yatıştırıcı ve ısıyı hafifletici olarak işlev gören, vebaya karşı faydalıdır ve suyuna bulaştığında görüşü kısıtlar, ayrıca kolerik ishal, kızamık, çiçek hastalığı ve veba için faydalıdır {cite:canon-ibn-sina-print-v1 s.667-668}"
  id: "Rabas dalam buku ini adalah tanaman yang tumbuh di musim semi di gunung dan memiliki kekuatan asam taraj dan hasram, dingin kering pada tanaman kedua, bertindak sebagai agen penenangkan darah dan pereda panas, bermanfaat melawan wabah dan membatasi penglihatan jika ternoda oleh jusnya, serta bermanfaat untuk diare koleri, campak, cacar, dan wabah {cite:canon-ibn-sina-print-v1 hlm.667-668}"
