# Verification: one source (Arslan's commentary, scan pages 313-316, book pp. 296-299). The programme is Arslan's account and must be checked against Sanusi writings and studies of the order (for example the work of Knut Vikør or Ahmad Sidqi al-Dajani). The founder's death date (1859) and the move to Jaghbub need a second source. The reported refusal to aid the Mahdist revolt rests on a single anecdote and needs confirmation.
