label: { ar: "خطة السنوسية للجامعة الإسلامية", en: "The Sanusi plan for Pan-Islamic unity" }
summary:
  ar: "يعرض شكيب أرسلان في فصل الجامعة الإسلامية الخطة التي يعدّها المؤلف للطريقة السنوسية في شمال أفريقيا: إعداد الوسائل للإصلاح الديني والأخلاقي، ثم فتح البلاد الأفريقية، ثم سائر البلاد الإسلامية، وجعل العالم الإسلامي مملكة واحدة تحت خليفة واحد. ويذكر أن السنوسي يرى أن التحرر السياسي من الهيمنة الغربية يسبقه التجدد الروحي وتهذيب أخلاق الأتباع. ويذكر أيضاً أن الحكومة العثمانية في طرابلس تخوفت من نفوذ الطريقة فنقلها الشيخ إلى جغبوب، وأن موقف السنوسيين من ثورة المهدية في السودان كان الرفض. يعرض ما نقله المؤلف من خطة، ولم يُتحقق من نصها هنا، ولا تُعدّ الخطة نفسها أمراً ثابتاً في مصادر السنوسية."
  en: "Arslan describes what he presents as the Sanusi order's programme in North Africa: prepare religious and moral reform first, then open the African lands, then the wider Muslim world, aiming at a single Muslim state under one caliph. He says the Sanusi leader held that spiritual renewal and moral discipline had to precede political liberation. He also notes Ottoman unease in Tripoli that led the order to move to Jaghbub, and that the Sanusi declined to back the Mahdist revolt in Sudan. This is the plan as Arslan reports it; the wording was not checked here and should not be taken as settled Sanusi doctrine."
