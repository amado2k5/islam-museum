label: { ar: "خطة السنوسية للجامعة الإسلامية", en: "The Sanusi plan for Pan-Islamic unity", es: "El plan Sanusi para la unidad panislámica", fr: "Le plan Sanusi pour l'unité panislamique", ur: "پان اسلامی اتحاد کے لیے سنوسی منصوبہ" }
summary:
  ar: "يعرض شكيب أرسلان في فصل الجامعة الإسلامية الخطة التي يعدّها المؤلف للطريقة السنوسية في شمال أفريقيا: إعداد الوسائل للإصلاح الديني والأخلاقي، ثم فتح البلاد الأفريقية، ثم سائر البلاد الإسلامية، وجعل العالم الإسلامي مملكة واحدة تحت خليفة واحد. ويذكر أن السنوسي يرى أن التحرر السياسي من الهيمنة الغربية يسبقه التجدد الروحي وتهذيب أخلاق الأتباع. ويذكر أيضاً أن الحكومة العثمانية في طرابلس تخوفت من نفوذ الطريقة فنقلها الشيخ إلى جغبوب، وأن موقف السنوسيين من ثورة المهدية في السودان كان الرفض. يعرض ما نقله المؤلف من خطة، ولم يُتحقق من نصها هنا، ولا تُعدّ الخطة نفسها أمراً ثابتاً في مصادر السنوسية."
  en: "Arslan describes what he presents as the Sanusi order's programme in North Africa: prepare religious and moral reform first, then open the African lands, then the wider Muslim world, aiming at a single Muslim state under one caliph. He says the Sanusi leader held that spiritual renewal and moral discipline had to precede political liberation. He also notes Ottoman unease in Tripoli that led the order to move to Jaghbub, and that the Sanusi declined to back the Mahdist revolt in Sudan. This is the plan as Arslan reports it; the wording was not checked here and should not be taken as settled Sanusi doctrine."
  es: "Arslan describe lo que presenta como el programa de la orden Sanusí en el norte de África: primero, preparar la reforma religiosa y moral; luego, abrir los territorios africanos y, posteriormente, el resto del mundo musulmán, con el objetivo de establecer un único estado musulmán bajo un solo califa. Afirma que el líder Sanusí sostenía que la renovación espiritual y la disciplina moral debían preceder a la liberación política. También menciona el malestar otomano en Trípoli, que llevó a la orden a trasladarse a Jaghbub, y que los Sanusíes se negaron a apoyar la revuelta mahdista en Sudán. Este es el plan tal como lo relata Arslan; la redacción no se ha verificado y no debe considerarse como la doctrina Sanusí definitiva."
  fr: "Arslan décrit ce qu'il présente comme le programme de l'ordre Sanoussi en Afrique du Nord: préparer d'abord une réforme religieuse et morale, puis ouvrir les territoires africains, puis le monde musulman dans son ensemble, dans le but d'établir un État musulman unique sous un calife. Il affirme que le chef Sanoussi estimait que le renouveau spirituel et la discipline morale devaient précéder la libération politique. Il note également le malaise ottoman à Tripoli, qui a conduit l'ordre à se réfugier à Jaghbub, et le refus des Sanoussi de soutenir la révolte mahdiste au Soudan. Tel est le plan rapporté par Arslan; le texte n'a pas été vérifié et ne doit pas être considéré comme faisant partie intégrante de la doctrine Sanoussi."
  ur: "ارسلان بیان کرتا ہے کہ وہ شمالی افریقہ میں سانوسی آرڈر کے پروگرام کے طور پر کیا پیش کرتا ہے: پہلے مذہبی اور اخلاقی اصلاحات کی تیاری کریں، پھر افریقی سرزمین کو کھولیں، پھر وسیع تر مسلم دنیا، جس کا مقصد ایک خلیفہ کے تحت ایک واحد مسلم ریاست ہے۔ وہ کہتے ہیں کہ سنوسی رہنما کا خیال تھا کہ سیاسی آزادی سے پہلے روحانی تجدید اور اخلاقی نظم و ضبط ضروری ہے۔ اس نے طرابلس میں عثمانیوں کی بے چینی کو بھی نوٹ کیا جس کی وجہ سے جگبوب منتقل ہونے کا حکم دیا گیا، اور یہ کہ سنوسی نے سوڈان میں مہدی بغاوت کی حمایت کرنے سے انکار کردیا۔ ارسلان کی رپورٹ کے مطابق یہ منصوبہ ہے۔ یہاں الفاظ کی جانچ نہیں کی گئی اور اسے سنوسی نظریے کے طور پر نہیں لیا جانا چاہیے۔"
