id: concept/tazayyun-adornment
class: concept
kind: legal
label:
  ar: "التزين"
  en: "Tazayyun (adornment, and its rules)"
  ur: "تزئین ⁦(زیبائی اور سجاوٹ کے احکام)⁩"
  es: "Tazayyun (adorno y sus reglas)"
  fr: "Tazayyun (ornement et ses règles)"
summary:
  ar: "التزين اتخاذ الزينة، والأصل فيه الاستحباب، ويحرم منه تشبه الرجال بالنساء والعكس، وتزين الرجل بالذهب والحرير، ويجب على الزوجة التزين لزوجها إذا أمرها، وتمتنع المعتدة للوفاة، وتحرم الجراحة المغيرة لخلق الله كالوشم والنمص، وتحرم زخرفة المساجد بمال الوقف عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5044} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5046}"
  en: "Tazayyun is taking adornment. The rule is recommendation. It is forbidden for a man or woman to imitate the other, for a man to wear gold or silk, and to decorate mosques with endowed funds, and it is obligatory for a wife to adorn herself for her husband when he asks. The widow in her waiting period may not adorn herself, and bodily alterations that change God's creation, such as tattooing and plucking, are forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5044} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5046}"
  es: "Tazayyun se refiere al adorno personal. La regla es la recomendación. Está prohibido que un hombre o una mujer imiten al otro, que un hombre use oro o seda y que decore mezquitas con fondos donados. Es obligatorio que una esposa se adorne para su esposo cuando él se lo pida. La viuda en su período de espera no puede adornarse, y están prohibidas las alteraciones corporales que alteran la creación de Dios, como los tatuajes y la depilación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5035} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5036} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5037} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5038} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5042} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5043} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5044} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5046}"
  fr: "Le tazayyun consiste à se parer. Il s'agit d'une recommandation. Il est interdit à un homme ou une femme d'imiter l'autre, à un homme de porter de l'or ou de la soie, et de décorer les mosquées avec des dons. Il est obligatoire pour une épouse de se parer pour son mari lorsqu'il le lui demande. La veuve, durant sa période d'attente, ne doit pas se parer. Les modifications corporelles qui altèrent la création divine, telles que le tatouage et l'épilation, sont interdites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5044} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5046}"
