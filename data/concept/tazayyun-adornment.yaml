label:
  ar: "التزين"
  en: "Tazayyun (adornment, and its rules)"
  ur: "تزئین (زیبائی اور سجاوٹ کے احکام)"
summary:
  ar: "التزين اتخاذ الزينة، والأصل فيه الاستحباب، ويحرم منه تشبه الرجال بالنساء والعكس، وتزين الرجل بالذهب والحرير، ويجب على الزوجة التزين لزوجها إذا أمرها، وتمتنع المعتدة للوفاة، وتحرم الجراحة المغيرة لخلق الله كالوشم والنمص، وتحرم زخرفة المساجد بمال الوقف عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5044} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5046}"
  en: "Tazayyun is taking adornment. The rule is recommendation. It is forbidden for a man or woman to imitate the other, for a man to wear gold or silk, and to decorate mosques with endowed funds, and it is obligatory for a wife to adorn herself for her husband when he asks. The widow in her waiting period may not adorn herself, and bodily alterations that change God's creation, such as tattooing and plucking, are forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5036} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5042} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5043} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5044} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5046}"
