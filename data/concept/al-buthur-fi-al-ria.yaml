"summary":
  "ar": "وقد يعرض في الرئة بثور، وعلامته أن يحس ثقل وضيق نفس مع سرعة وتواتر في الصدر\
    \ ⁦(السطر الأخير من الفصل غير مستبين في النسخة المحفوظة وحمل كما طبع)⁩ {cite:canon-ibn-sina-print-v2\
    \ p.352}"
  "en": "Pustules may occur in the lung; their sign is that he feels a weight and\
    \ a shortness of breath with rapidity and frequency in the chest (the chapter's\
    \ closing words are indistinct in the preserved copy and are carried as printed)\
    \ {cite:canon-ibn-sina-print-v2 p.352}"
  fr: "Des pustules peuvent apparaître dans le poumon ; leur signe est une sensation de pesanteur et d’essoufflement accompagnée de rapidité et de fréquence dans la poitrine (les derniers mots du chapitre sont indistincts dans l’exemplaire conservé et sont reproduits tels qu’imprimés) {cite:canon-ibn-sina-print-v2 p.352}"
  "ur": "پھیپھڑے میں دانے ہو سکتے ہیں اور اس کی علامت یہ ہے کہ وہ بوجھ اور تنگی نفس\
    \ محسوس کرے ساتھ سرعت اور سینے میں تواتر کے ⁦(فصل کا آخری سطر محفوظ نسخے میں واضح\
    \ نہیں اور جوں چھپا ہے لیا گیا)⁩ {cite:canon-ibn-sina-print-v2 p.352}"
  "es": "Pueden aparecer pústulas en el pulmón; su síntoma es una sensación de pesadez y dificultad para respirar con rapidez y frecuencia en el pecho (las palabras finales del capítulo son indistintas en la copia conservada y se reproducen tal como están impresas) {cite:canon-ibn-sina-print-v2 p.352}"
  "tr": "Akciğerlerde su toplaması oluşabilir ve bunun belirtisi, hızlı ve sık göğüs ağrısı ile birlikte ağır ve nefes darlığı hissetmedir (bölümün son satırı korunan kopyada gösterilmemiştir ve basılı olarak taşınır) {cite:canon-ibn-sina-print-v2 s.352}"
  "id": "Penumpukan cairan dapat terjadi di paru-paru, dan gejalanya adalah perasaan sesak napas yang parah serta nyeri dada yang cepat dan sering (baris terakhir bab tidak ditampilkan dalam salinan yang dilindungi dan tercetak) {cite:canon-ibn-sina-print-v2 hlm.352}"
