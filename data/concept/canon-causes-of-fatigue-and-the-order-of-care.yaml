summary:
  ar: "يبين ابن سينا أن الإعياء إما أن يحدث عن رياضة وهو أسلم، أو عن ذاته وهو مقدمة مرض، وأن الأصناف تتركب، ويضع قاعدة أن تصرف فضل العناية أولاً إلى الأهم، والأهم يكون أهم لأجل القوة أو الشرف أو الجوهر {cite:canon-ibn-sina-print-v1 p.243}."
  en: "Ibn Sina says fatigue arises either from exercise, which is safer, or of itself, which is a prelude to disease, that the kinds combine, and sets down the rule that extra care goes first to what matters most, importance coming from strength, nobility or substance {cite:canon-ibn-sina-print-v1 p.243}."
