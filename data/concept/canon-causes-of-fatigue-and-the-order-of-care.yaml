id: concept/canon-causes-of-fatigue-and-the-order-of-care
class: concept
kind: scientific
label:
  ar: "حدوث الإعياء وترتيب العناية عند ابن سينا"
  en: "How fatigue arises and the order of care in the Canon"
  fr: "Origine de la fatigue et ordre des soins dans le Canon"
  ur: "تھکن کے پیدا ہونے کا طریقہ اور توجہ کی ترتیب قانون میں"
  es: "Cómo surge la fatiga y el orden de los cuidados en el Canon"
summary:
  ar: "يبين ابن سينا أن الإعياء إما أن يحدث عن رياضة وهو أسلم، أو عن ذاته وهو مقدمة مرض، وأن الأصناف تتركب، ويضع قاعدة أن تصرف فضل العناية أولاً إلى الأهم، والأهم يكون أهم لأجل القوة أو الشرف أو الجوهر {cite:canon-ibn-sina-print-v1 p.243}."
  en: "Ibn Sina says fatigue arises either from exercise, which is safer, or of itself, which is a prelude to disease, that the kinds combine, and sets down the rule that extra care goes first to what matters most, importance coming from strength, nobility or substance {cite:canon-ibn-sina-print-v1 p.243}."
  fr: "Ibn Sina distingue fatigue d’exercice, plus sûre, et spontanée, annonçant la maladie ; leurs types peuvent se combiner. Il privilégie les soins de ce qui importe le plus par force, noblesse ou substance {cite:canon-ibn-sina-print-v1 p.243}."
  es: "Ibn Sina dice que la fatiga surge del ejercicio, que es más seguro, o por sí misma, que es un preludio de la enfermedad, que ambos tipos se combinan, y establece la regla de que se debe prestar mayor atención a lo que más importa, siendo la importancia derivada de la fuerza, la nobleza o la sustancia {cite:canon-ibn-sina-print-v1 p.243}."
