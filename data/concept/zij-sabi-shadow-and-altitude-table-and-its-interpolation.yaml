label: { ar: "جدول الارتفاع والظل وتعديله في الزيج الصابي", en: "The altitude and shadow table and its interpolation", ur: "ارتفاع اور سایہ کا جدول اور اس کی تعدیل" }
summary:
  ar: "يعلّم البتاني أن يُستخرج الظل المبسوط من الارتفاع بالجدول بطلب الارتفاع في سطور الارتفاع وأخذ ما بإزائه من الظل، وأن يُعرف الارتفاع من الظل بطلب مثل الظل في عمود الظل وأخذ ما بإزائه. وإن كان مع الأعداد دقائق أخذها بالتعديل على ما رسم في باب الميل، وللظل القائم يُنقص الارتفاع من تسعين. والجدول مرسوم على مقياس اثني عشر جزءاً. {cite:zij-sabi-nallino-byblion pp.36-37}."
  en: "Al-Battani teaches reading the horizontal shadow from the altitude in the table by finding the altitude in the altitude rows and taking the shadow beside it, and the altitude from the shadow by finding the shadow's like in the shadow column and taking what stands beside it. If minutes accompany the numbers they are handled by proportional correction as laid down in the chapter on declination, and for the standing shadow the altitude is first taken from ninety. The table is drawn for a gnomon of twelve parts. {cite:zij-sabi-nallino-byblion pp.36-37}."
  ur: "البتانی سکھاتے ہیں کہ افقی سایہ ارتفاع سے جدول میں یوں معلوم کیا جائے کہ ارتفاع کو ارتفاع کی سطروں میں ڈھونڈا جائے اور اس کے برابر والا سایہ لیا جائے، اور ارتفاع سایے سے یوں کہ سایے کا مثل سایے کے ستون میں ڈھونڈا جائے اور اس کے برابر والا لیا جائے۔ اگر اعداد کے ساتھ دقیقے ہوں تو انہیں اس تعدیل سے لیا جائے جو باب المیل میں بیان ہوئی، اور کھڑے سائے کے لیے ارتفاع کو پہلے نوے میں سے گھٹایا جائے۔ جدول بارہ جز کے مقیاس پر بنا ہے۔ {cite:zij-sabi-nallino-byblion pp.36-37}۔"
