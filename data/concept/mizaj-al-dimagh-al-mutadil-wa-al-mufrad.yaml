id: concept/mizaj-al-dimagh-al-mutadil-wa-al-mufrad
class: concept
kind: scientific
label:
  ar: "دلائل مزاج الدماغ المعتدل والأمزجة المفردة"
  en: "The signs of the moderate temperament of the brain and of the simple temperaments"
  ur: "دماغ کے معتدل مزاج اور سادہ مزاجوں کی علامات"
  es: "Los signos del temperamento moderado del cerebro y de los temperamentos simples."
  fr: "Les signes du tempérament modéré du cerveau et des tempéraments simples"
  tr: "Orta Düzey Beyin Ruh Hali ve Tek Ruh Halinin Göstergeleri"
  id: "Indikator Suasana Hati Otak Sedang dan Suasana Hati Tunggal"
summary:
  ar: "يذكر ابن سينا دلائل الدماغ المعتدل، ثم قول جالينوس في أثر الحرارة والبرودة واليبوسة والرطوبة، ثم دلائل المزاج الحار والبارد واليابس والرطب بالشعر والنوم والفضول والحواس؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.23-24}"
  en: "Ibn Sina gives the signs of the moderate brain, then Galen's view of the effect of heat, cold, dryness and moisture, and then the signs of the hot, cold, dry and moist temperaments in the hair, sleep, superfluities and senses; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.23-24}"
  ur: "ابن سینا معتدل دماغ کی علامات بتاتا ہے، پھر گرمی، سردی، خشکی اور تری کے اثر کے بارے میں جالینوس کا قول، پھر گرم، ٹھنڈے، خشک اور تر مزاج کی علامات بالوں، نیند، فضلات اور حواس میں؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.23-24}۔"
  es: "Ibn Sina da los signos del cerebro moderado, luego la visión de Galeno sobre el efecto del calor, el frío, la sequedad y la humedad, y luego los signos de los temperamentos caliente, frío, seco y húmedo en el cabello, el sueño, las superfluidades y los sentidos; el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 pp.23-24}"
  fr: "Ibn Sina donne les signes d'un cerveau modéré, puis l'avis de Galien sur l'effet de la chaleur, du froid, de la sécheresse et de l'humidité, et enfin les signes des tempéraments chaud, froid, sec et humide dans les cheveux, le sommeil, les superfluités et les sens; le document comporte une ligne légendée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.23-24}"
  tr: "İbn Sina, ılımlı bir zihnin belirtilerinden, ardından Galenos'un sıcaklık, soğuk, kuruluk ve nemin etkilerinden bahseder; ardından saç, uyku, merak ve duyularla ilgili sıcak, soğuk, kuru ve nemli ruh hallerinin belirtilerini belirtir; ve kurucunun kuralı başlıklı bir bölümde {cite:canon-ibn-sina-print-v2 s.23-24}"
  id: "Ibn Sina menyebutkan tanda-tanda pikiran yang moderat, lalu Galen mengenai efek panas, dingin, kekeringan, dan kelembapan, lalu tanda-tanda suasana hati panas, dingin, kering, dan lembap dengan rambut, tidur, rasa ingin tahu, dan indera; dan ada baris berjudul dalam bagian tentang aturan pendiri {cite:canon-ibn-sina-print-v2 hlm.23-24}"
