id: concept/al-udw-alladhi-yalam-al-dimagh-bi-musharakatih
class: concept
kind: scientific
label:
  ar: "الاستدلال على العضو الذي يألم الدماغ بمشاركته"
  en: "Inference about the organ with which the brain suffers by sharing"
  ur: "اس عضو پر استدلال جس کی مشارکت سے دماغ دکھ پاتا ہے"
summary:
  ar: "يقول ابن سينا إن أكثر الأعضاء إيذاء للدماغ بالمشاركة المعدة، ويبين كيف يعرف ذلك من الشهوة والجشاء والهضم والخواء والامتلاء وموضع الوجع، ويحذر من الخلط بين العلة الدماغية والمشاركة؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.22-23}"
  en: "Ibn Sina says the organ that most harms the brain by sharing is the stomach, and shows how this is known from appetite, belching, digestion, emptiness and fullness and the place of the pain, and warns against mistaking a brain complaint for one by sharing; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.22-23}"
  ur: "ابن سینا کہتا ہے کہ دماغ کو مشارکت سے سب سے زیادہ ایذا دینے والا عضو معدہ ہے، اور بتاتا ہے کہ یہ بھوک، ڈکار، ہضم، خالی پن اور بھراؤ اور درد کی جگہ سے کیسے پہچانا جاتا ہے، اور دماغی علت اور مشارکت کی علت کو گڈمڈ کرنے سے خبردار کرتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.22-23}۔"
