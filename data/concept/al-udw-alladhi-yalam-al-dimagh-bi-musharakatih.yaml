id: concept/al-udw-alladhi-yalam-al-dimagh-bi-musharakatih
class: concept
kind: scientific
label:
  ar: "الاستدلال على العضو الذي يألم الدماغ بمشاركته"
  en: "Inference about the organ with which the brain suffers by sharing"
  fr: "Reconnaître l’organe dont le trouble affecte le cerveau par sympathie"
  ur: "اس عضو پر استدلال جس کی مشارکت سے دماغ دکھ پاتا ہے"
  es: "Inferencia sobre el órgano con el que el cerebro sufre al compartir"
  tr: "Beyni inciten organı paylaşarak çıkarım yapmak"
  id: "Inferensi dengan berbagi organ yang melukai otak"
summary:
  ar: "يقول ابن سينا إن أكثر الأعضاء إيذاء للدماغ بالمشاركة المعدة، ويبين كيف يعرف ذلك من الشهوة والجشاء والهضم والخواء والامتلاء وموضع الوجع، ويحذر من الخلط بين العلة الدماغية والمشاركة؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.22-23}"
  en: "Ibn Sina says the organ that most harms the brain by sharing is the stomach, and shows how this is known from appetite, belching, digestion, emptiness and fullness and the place of the pain, and warns against mistaking a brain complaint for one by sharing; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.22-23}"
  fr: "Selon Ibn Sina, l’organe qui nuit le plus au cerveau par sympathie est l’estomac. Il montre comment le reconnaître à l’appétit, aux éructations, à la digestion, à l’état de vacuité ou de réplétion et au siège de la douleur. Il met en garde contre le risque de confondre une affection du cerveau avec une affection par sympathie. La notice contient une mention signalée dans une section en attente de la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.22-23}"
  ur: "ابن سینا کہتا ہے کہ دماغ کو مشارکت سے سب سے زیادہ ایذا دینے والا عضو معدہ ہے، اور بتاتا ہے کہ یہ بھوک، ڈکار، ہضم، خالی پن اور بھراؤ اور درد کی جگہ سے کیسے پہچانا جاتا ہے، اور دماغی علت اور مشارکت کی علت کو گڈمڈ کرنے سے خبردار کرتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.22-23}۔"
  es: "Ibn Sina afirma que el órgano que más perjudica al cerebro al compartir es el estómago, y muestra cómo esto se conoce a partir del apetito, los eructos, la digestión, la sensación de vacío y plenitud, y la localización del dolor. Advierte contra la confusión de una dolencia cerebral con una causada por compartir; el registro contiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 pp.22-23}."
  tr: "İbn Sina, beyne en çok zarar veren organların mide çekirdeği olduğunu söyler ve bunu arzu, çapak, sindirim, boşluk, tokluk ve acının yerinden nasıl bildiğini açıklar. Beyin hastalığını katılımla karıştırmamaya karşı uyarıda bulunur; bu metinde, kurucunun kararıyla ilgili bir bölümde başlıklı bir satır vardır {cite:canon-ibn-sina-print-v2 s.22-23}"
  id: "Ibn Sina mengatakan bahwa organ yang paling merusak otak adalah inti lambung dan menjelaskan bagaimana ia mengetahuinya dari tempat-tempat hasrat, durr, pencernaan, kekosongan, rasa kenyang, dan rasa sakit. Ia memperingatkan agar tidak mencampuradukkan penyakit otak dengan partisipasi; dalam teks ini, terdapat satu baris berjudul di bagian tentang keputusan pendiri {cite:canon-ibn-sina-print-v2 hlm.22-23}"
