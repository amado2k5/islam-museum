id: concept/aqidah-and-shariah
class: concept
kind: doctrine
label:
  ar: العقيدة والشريعة
  en: Creed and law (aqida and shari'a)
  fr: "Croyance et loi (aqida et shari’a)"
  es: "Credo y ley (aqida y sharia)"
  ur: "عقیدہ اور قانون ⁦(عقیدہ اور شریعت)⁩"
  tr: "İnanç ve Şeriat"
  id: "Kredo dan Syariah"
summary:
  ar: "قسمة يعرض بها محمود شلتوت الإسلام شعبتين لا يتحقق معناه إلا بهما: العقيدة، وهي الجانب النظري الذي يُطلب الإيمان به أولاً، والشريعة، وهي النظم التي شرعها الله لعلاقة الإنسان بربه وبأخيه المسلم وبأخيه الإنسان وبالكون وبالحياة؛ والعقيدة أصل تُبنى عليه الشريعة."
  en: "The division in which Mahmud Shaltut sets out Islam as two parts that cannot be realised without each other: creed, the theoretical part that must be believed first, and law, the regulations God set for a person's relation to God, fellow Muslims, other people, the cosmos and life; creed is the root on which law is built."
  fr: "La division par laquelle Mahmud Shaltut présente l’islam en deux parties qui ne peuvent se réaliser l’une sans l’autre : la croyance, partie théorique à laquelle il faut d’abord croire, et la loi, les règles établies par Dieu pour les rapports d’une personne avec Dieu, ses coreligionnaires musulmans, les autres personnes, le cosmos et la vie ; la croyance est la racine sur laquelle la loi est construite."
  es: "La división que Mahmud Shaltut establece en el Islam lo divide en dos partes que no pueden realizarse sin la otra: el credo, la parte teórica que debe creerse primero, y la ley, las normas que Dios estableció para la relación de una persona con Dios, con los demás musulmanes, con otras personas, con el cosmos y con la vida; el credo es la raíz sobre la que se construye la ley."
  ur: "وہ تقسیم جس میں محمود شلتوت نے اسلام کو دو حصوں کے طور پر متعین کیا ہے جو ایک دوسرے کے بغیر حاصل نہیں ہو سکتے: عقیدہ، وہ نظریاتی حصہ جس پر پہلے یقین کیا جانا چاہیے، اور قانون، وہ ضابطے جو خدا نے کسی شخص کے خدا، ساتھی مسلمانوں، دوسرے لوگوں، کائنات اور زندگی سے تعلق کے لیے مقرر کیے ہیں۔ عقیدہ وہ جڑ ہے جس پر قانون بنایا گیا ہے۔"
  tr: "Mahmoud Shaltout, İslam'ın ancak iki dalda gerçekleşebileceği iki dalı sunar: inanç (inanç öncelikli) teorik yönü olan inanç ve Şeriat, Tanrı'nın insan ile Müslüman kardeşi, insanlık kardeşi, evren ve yaşam arasındaki ilişkiyi yasalaştırdığı sistemdir; inanç ise Şeriat'ın temelidir."
  id: "Mahmoud Shaltout menyajikan dua cabang di mana Islam hanya dapat diwujudkan dalam dua cabang: kredo, yang merupakan aspek teoretis yang menuntut iman terlebih dahulu, dan Syariah, yang merupakan sistem yang diatur Allah untuk hubungan antara manusia dan saudara Muslimnya, sesama manusia, alam semesta, dan kehidupan; kredo adalah dasar yang menjadi dasar Syariah."
