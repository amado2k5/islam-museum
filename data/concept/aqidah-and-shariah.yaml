id: concept/aqidah-and-shariah
class: concept
kind: doctrine
label:
  ar: العقيدة والشريعة
  en: Creed and law (aqida and shari'a)
summary:
  ar: "قسمة يعرض بها محمود شلتوت الإسلام شعبتين لا يتحقق معناه إلا بهما: العقيدة، وهي الجانب النظري الذي يُطلب الإيمان به أولاً، والشريعة، وهي النظم التي شرعها الله لعلاقة الإنسان بربه وبأخيه المسلم وبأخيه الإنسان وبالكون وبالحياة؛ والعقيدة أصل تُبنى عليه الشريعة."
  en: "The division in which Mahmud Shaltut sets out Islam as two parts that cannot be realised without each other: creed, the theoretical part that must be believed first, and law, the regulations God set for a person's relation to God, fellow Muslims, other people, the cosmos and life; creed is the root on which law is built."
wings: [ideas]
themes:
- creed
periods:
- period/modern-era
regions:
- global
issue:
  ar: "هل تقوم الشريعة على العقيدة وحدها، أم تُعد العقيدة والشريعة شعبتين متلازمتين؟"
  en: "Does the law stand on creed alone, or are creed and law two inseparable parts of Islam?"
perspectives:
- tradition: sunni
  id: shaltut-modern-sunni
  stance:
    ar: الإسلام عقيدة وشريعة معاً، والعقيدة أصل والشريعة فرع، ومن أخذ بإحداهما وأهدر الأخرى لم يكن مسلماً في حكم الإسلام
    en: Islam is creed and law together; creed is the root and law the branch, and whoever keeps one and discards the other is not a Muslim under Islam's rule
  summary:
    ar: "يعرض شلتوت هذه القسمة في تمهيد الكتاب ويجعل القرآن أصلها الجامع، ويقرر أن الشريعة بلا عقيدة لا تستند إلى قوة معنوية تحملها على الطاعة؛ وهذا عرض المؤلف لرأيه في تقرير المذهب السني المعاصر، وليس حكماً نهائياً للمدارس الأخرى."
    en: "Shaltut sets out this division in the book's opening and makes the Qur'an its unifying source, holding that law without creed lacks the inner force that makes people keep it; this is the author's own presentation of the view, not a final ruling for every school."
