summary:
  ar: "الجنائز في الفقه: أحكام الميت من لحظة الاحتضار إلى الدفن، ومنها إغماضه وتسجيته وإعلام الناس بموته وقضاء دينه، وتجهيزه وغسله وتكفينه، وحمله وتشييعه، ثم الصلاة عليه ودفنه. تبيّن الموسوعة اختلاف المذاهب الأربعة في تفاصيل ذلك، ومن ذلك كراهية النوح والصياح وشق الجيوب، وحكم الصلاة في المسجد والمقبرة، ومن له حق التقدم في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6505}"
  en: "Funerals in the jurisprudence cover the rules for the dying person from the moment of death's approach until burial: closing the eyes, covering the body, announcing the death, settling debts, preparing the body, washing and shrouding it, carrying and following the bier, and then the funeral prayer and burial. The Kuwaiti encyclopedia records how the four schools differ on the details, for instance on wailing and tearing garments, on praying in a mosque or a cemetery, and on who has the right to lead the prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6505}"
