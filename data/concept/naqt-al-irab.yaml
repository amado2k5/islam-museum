id: concept/naqt-al-irab
class: concept
kind: term
label:
  ar: "نقط الإعراب: نقط أبي الأسود الدؤلي"
  en: "Dotting for case and vowel (naqt al-i'rab): Abu al-Aswad's dots"
  ur: "نقطِ اعراب: ابو الاسود دؤلی کے نقطے"
  es: "Puntos para indicar caso y vocal (naqt al-i'rab): Puntos de Abu al-Aswad"
  fr: "Points pour les cas et les voyelles (naqt al-i'rab): points d'Abu al-Aswad"
summary:
  ar: "نقط الإعراب علامات الحركات بالنقط: الفتحة نقطة فوق الحرف والكسرة نقطة تحته والضمة نقطة بين أجزائه والسكون نقطتان، ويُنسب وضعها إلى أبي الأسود الدؤلي بطلب زياد والي البصرة بعد أن سمع قارئاً يلحن؛ وأقرّ الداني أن الشكل كان نقطاً في الصدر الأول {cite:manahil-irfan-sabt p. 330} {cite:itqan-suyuti p. 2249}."
  en: "Dotting for case and vowel marks the vowels by dots: a dot above the letter for fatha, below for kasra, between its parts for damma and two dots for sukun; its invention is attributed to Abu al-Aswad al-Du'ali at the request of Ziyad, governor of Basra, after he heard a reader make a grammatical error; al-Dani records that vowelling was by dots in the first age {cite:manahil-irfan-sabt p. 330} {cite:itqan-suyuti p. 2249}."
  ur: "نقطِ اعراب حرکات کو نقطوں سے ظاہر کرنا ہے: فتحہ حرف کے اوپر نقطہ، کسرہ نیچے، ضمہ اس کے اجزاء کے بیچ اور سکون دو نقطے؛ اس کی ایجاد ابو الاسود دؤلی کی طرف منسوب ہے جو بصرہ کے والی زیاد کی درخواست پر ایک قاری کو لحن کرتے سن کر کی گئی؛ دانی کہتے ہیں کہ پہلے دور میں شکل نقطوں سے تھا {cite:manahil-irfan-sabt p. 330} {cite:itqan-suyuti p. 2249}۔"
  es: "El sistema de puntos para el caso y la vocal marca las vocales con puntos: un punto encima de la letra para fatha, debajo para kasra, entre sus partes para damma y dos puntos para sukun; su invención se atribuye a Abu al-Aswad al-Du'ali a petición de Ziyad, gobernador de Basora, después de que oyera a un lector cometer un error gramatical; al-Dani registra que la vocalización se hacía con puntos en la primera época {cite:manahil-irfan-sabt p. 330} {cite:itqan-suyuti p. 2249}."
  fr: "Le système de pointage pour les cas et les voyelles marque les voyelles par des points: un point au-dessus de la lettre pour la fatha, en dessous pour la kasra, entre ses parties pour la damma et deux points pour le sukun; son invention est attribuée à Abu al-Aswad al-Du'ali à la demande de Ziyad, gouverneur de Bassora, après qu'il eut entendu un lecteur commettre une erreur grammaticale; al-Dani rapporte que la vocalisation se faisait par points au premier âge {cite:manahil-irfan-sabt p. 330} {cite:itqan-suyuti p. 2249}."
