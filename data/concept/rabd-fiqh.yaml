id: concept/rabd-fiqh
class: concept
kind: legal
label:
  ar: "الربض"
  en: "Rabd (the outskirts of a city, and a sheep pen): its place in travel-shortening and Friday prayer, and the reviving of land"
  ur: "ربض (شہر کے اطراف)"
summary:
  ar: "الربض في اللغة مأوى الغنم، ويُطلق في اصطلاح الفقهاء على ما حول المدينة من بيوت ومساكن، وعلى مأوى الغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8612} الربض في حكم المصر عند قصر الصلاة في السفر، وكذا القرى المتصلة به، بخلاف البساتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} وتصح الجمعة والعيدان في الأرباض التابعة للبلد عند توفر شروطهما، ولا تصح في الأرباض الخارجة عنه عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} والأرباض لا تعد مواتا فلا يجوز إحياؤها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} واتفق الفقهاء على جواز الصلاة في مرابض الغنم إذا أمنت النجاسة، والكراهة في أعطان الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614}"
  en: "Rabd in the lexicon is a sheep pen; the jurists use it for the houses and dwellings around a city, and for the pen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8612} For shortening the prayer on a journey, the outskirts count as the city, and villages joined to them do too, but orchards do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} Friday and Eid prayers are valid in outskirts that belong to the city when the conditions are met, and most jurists hold them invalid in outskirts outside it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} Outskirts are not dead land and cannot be revived. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} Prayer in sheep pens is allowed when free of impurity, while prayer in camel resting places is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614}"
  ur: "ربض لغت میں بکریوں کا باڑا ہے، اور فقہاء کے ہاں شہر کے گرد کے مکانات کو بھی کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8612}"
