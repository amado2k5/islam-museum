id: concept/rabd-fiqh
class: concept
kind: legal
label:
  ar: "الربض"
  en: "Rabd (the outskirts of a city, and a sheep pen): its place in travel-shortening and Friday prayer, and the reviving of land"
  ur: "ربض ⁦(شہر کے اطراف)⁩"
  es: "Rabd (las afueras de una ciudad y un redil): su lugar en el acortamiento de viajes y la oración del viernes, y la reactivación de la tierra."
  fr: "Rabd (la périphérie d'une ville et un enclos à moutons): son rôle dans le raccourcissement des trajets et la prière du vendredi, et la revitalisation des terres"
  tr: "El-Rabad"
  id: "Al-Rabad"
summary:
  ar: "الربض في اللغة مأوى الغنم، ويُطلق في اصطلاح الفقهاء على ما حول المدينة من بيوت ومساكن، وعلى مأوى الغنم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8612} الربض في حكم المصر عند قصر الصلاة في السفر، وكذا القرى المتصلة به، بخلاف البساتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} وتصح الجمعة والعيدان في الأرباض التابعة للبلد عند توفر شروطهما، ولا تصح في الأرباض الخارجة عنه عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} والأرباض لا تعد مواتا فلا يجوز إحياؤها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} واتفق الفقهاء على جواز الصلاة في مرابض الغنم إذا أمنت النجاسة، والكراهة في أعطان الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614}"
  en: "Rabd in the lexicon is a sheep pen; the jurists use it for the houses and dwellings around a city, and for the pen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8612} For shortening the prayer on a journey, the outskirts count as the city, and villages joined to them do too, but orchards do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} Friday and Eid prayers are valid in outskirts that belong to the city when the conditions are met, and most jurists hold them invalid in outskirts outside it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} Outskirts are not dead land and cannot be revived. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} Prayer in sheep pens is allowed when free of impurity, while prayer in camel resting places is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614}"
  ur: "ربض لغت میں بکریوں کا باڑا ہے، اور فقہاء کے ہاں شہر کے گرد کے مکانات کو بھی کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8612}"
  es: "Rabd en el léxico es un redil de ovejas; los juristas lo usan para las casas y viviendas alrededor de una ciudad, y para el corral. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8612} Para acortar la oración en un viaje, las afueras cuentan como la ciudad, y las aldeas unidas a ellas también, pero los huertos no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} Las oraciones del viernes y del Eid son válidas en las afueras que pertenecen a la ciudad cuando se cumplen las condiciones, y la mayoría de los juristas las consideran inválidas en las afueras fuera de ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} Las afueras no son tierra muerta y no pueden ser revividas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} Se permite la oración en rediles de ovejas cuando están libres de impureza, mientras que no se permite la oración en lugares de descanso de camellos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614}"
  fr: "Dans le lexique, « Rabd » désigne une bergerie; les juristes l'emploient pour désigner les maisons et habitations situées aux abords d'une ville, ainsi que la bergerie elle-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8612} Pour abréger la prière en voyage, la périphérie de la ville est considérée comme faisant partie de celle-ci, de même que les villages qui y sont rattachés, mais pas les vergers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} Les prières du vendredi et de l'Aïd sont valides dans la périphérie de la ville lorsque les conditions requises sont remplies, et la plupart des juristes les considèrent invalides dans la périphérie située hors de la ville. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} Les périphéries ne sont pas des terres mortes et ne peuvent pas être réanimées. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} La prière dans les bergeries est autorisée lorsqu'elle est exempte d'impureté, tandis que la prière dans les aires de repos des chameaux n'est pas appréciée. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8614}"
  tr: "Dilsel olarak 'kuduz' koyunların barınağı anlamına gelir ve fiqih terminolojisinde şehir çevresindeki evler ve konutlar ile koyun barınağı anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8612} Banliyö, Mısır'da seyahat sırasında namazın kısaltılması ve bahçelerin aksine, ona bağlı köylerde de banliyö olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8613} Cuma namazları ve sopalar, koşulları sağlandığında şehrin banliyölerinde geçerlidir, ancak genel halk için geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8614} Ve topraklar ölü sayılmaz, bu nedenle yeniden canlandırılmamalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8614} Hukukçular, kirlilik güvenliyse koyun dinlenme yerlerinde namaz kılmanın izin verildiği konusunda hemfikir oldular ve deve vermekten hoşlanmadılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8614}"
  id: "Secara linguistik, 'rabid' berarti tempat berlindung domba, dan dalam istilah yurisprudensi, merujuk pada rumah dan tempat tinggal di sekitar kota, serta tempat berlindung domba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8611} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8612} Pinggiran kota ini dianggap di Mesir ketika doa dipersingkat selama perjalanan, serta di desa-desa yang terhubung dengannya, berbeda dengan kebun buah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8613} Doa Jumat dan tongkat sah di pinggiran kota ketika syaratnya terpenuhi, tetapi tidak untuk masyarakat umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8614} Dan tanah-tanah tersebut tidak dianggap mati sehingga tidak boleh dihidupkan kembali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8614} Para ahli hukum sepakat bahwa berdoa di tempat peristirahatan domba jika kotoran aman, dan tidak suka memberikan unta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8614}"
