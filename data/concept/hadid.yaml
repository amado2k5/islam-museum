summary:
  ar: "الحديد عند الكتاب ثلاثة أصناف: السابورقان وهو الفولاذ الطبيعي، والبرماهن، والفولاذ المصنوع من البرماهن. زنجاره قابض أكّال، وصدؤه بالشراب ينفع الجمرة والبثور والنقرس، وسحقه بخلّ ثقيف ينفع القيح المزمن من الأذن. وما يذكره الكتاب عن نزف الرحم والحيض والباه تقرير مُعلَّم يُعرض على الحكم."
  en: "The book names three kinds of iron: sabur-qan, which is natural steel; barmahn; and wrought steel made from barmahn. Its rust is binding and biting. Its rust with wine helps the carbuncle, pustules and gout; crushed and boiled in strong vinegar, the vinegar helps chronic discharge from the ear. The book's report on bleeding of the womb, menses and sexual power is a labelled listing set aside for the founder's ruling."
  ur: "کتاب لوہے کی تین قسمیں بتاتی ہے: سابورقان، جو قدرتی فولاد ہے؛ برماہن؛ اور برماہن سے بنا ہوا فولاد۔ اس کا زنگار قابض اور کاٹنے والا ہے۔ شراب کے ساتھ زنگ جمرہ، پھنسیوں اور گٹھیا میں مفید ہے؛ تیز سرکے میں کوٹ کر ابالنے سے وہ سرکہ کان کی دیرینہ رطوبت میں مفید ہے۔ رحم کے خون، حیض اور باہ کے بارے میں کتاب کا بیان نشان زدہ ہے اور بانی کے فیصلے کے لیے رکھا گیا ہے۔"
  es: "El libro menciona tres tipos de hierro: sabur-qan, que es acero natural; barmahn; y acero forjado hecho de barmahn. Su óxido es adherente y corrosivo. Su óxido mezclado con vino ayuda con los forúnculos, las pústulas y la gota; triturado y hervido en vinagre fuerte, el vinagre ayuda con la secreción crónica del oído. El informe del libro sobre el sangrado uterino, la menstruación y la potencia sexual es una lista etiquetada reservada para la decisión del fundador."
  fr: "Le livre mentionne trois types de fer: le sabur-qan, l’acier naturel; le barmahn; et l’acier forgé à partir de barmahn. Sa rouille est corrosive et agressive. Mélangée à du vin, elle soigne les anthrax, les pustules et la goutte; broyée et bouillie dans du vinaigre fort, elle soulage les écoulements auriculaires chroniques. Le chapitre consacré aux saignements utérins, aux menstruations et à la libido est une liste commentée, réservée à l’avis du fondateur."
  tr: "Kitaptaki demir üç türden oluşur: doğal çelik olan saburqan, Barmahin ve Barmahin'den yapılan çelik. Pas korozif ve paslıdır, şurup şarbon, sivilce ve gut gibi avantajlar sağlar ve kaba sirkesiyle ezilmesi kulaktaki kronik irinleri iyileştirir. Kitapta rahim kanaması, adet ve bah hakkında bahsedilenler hakime sunulan dönüm noktası niteliğinde bir rapordur."
  id: "Besi dalam buku ini terdiri dari tiga jenis: saburqan, yang merupakan baja alami, Barmahin, dan baja yang terbuat dari Barmahin. Karatnya bersifat korosif dan berkarat dengan sirup yang bermanfaat bagi antraks, jerawat, dan asam urat, serta penghancurannya dengan cuka preman menyembuhkan nanah kronis dari telinga. Apa yang disebutkan dalam buku tentang pendarahan rahim, menstruasi, dan bah adalah laporan penting yang disampaikan kepada hakim."
