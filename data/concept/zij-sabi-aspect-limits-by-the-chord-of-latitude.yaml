label: { ar: "حدود الاتصال بوتر العرض", en: "The limits of an aspect by the chord of latitude", ur: "عرض کے وتر سے اتصال کی حدود", es: "Los límites de un aspecto por la cuerda de latitud" }
summary:
  ar: "لمعرفة على كم جزءاً يلقي الكوكب شعاعه من التسديس والتثليث على دائرة البروج إذا كان له عرض، يُؤخذ وتر ما بقي من الضلع الثاني في الجداول المنصفة، ويُضرب في نفسه، ويُؤخذ وتر عرض الكوكب التام، فيُطرح من مربع التسديس، فيخرج الضلع الثاني المعدل، ثم يُعرف الوتر المعدل ويُقوَّس فيخرج التسديس والتثليث على دائرة البروج. {cite:zij-sabi-nallino-byblion pp.200-201}"
  en: "To find how many parts a body throws its ray of sextile or trine onto the ecliptic when it has a latitude, the chord of the remainder of the second side is taken from the half-chord tables, squared, and the full chord of the latitude is found and squared as well. The corrected second side is obtained by subtraction from the square of the full chord of the aspect, and the corrected chord is then turned into an arc, giving the sextile and trine on the ecliptic. {cite:zij-sabi-nallino-byblion pp.200-201}"
  ur: "یہ معلوم کرنے کے لیے کہ جب ستارے کا عرض ہو تو وہ اپنی شعاع کا تسدیس اور تثلیث دائرۂ البروج پر کتنے اجزا پر ڈالتا ہے، نصف وتر جداول سے دوسرے ضلع کے باقی حصے کا وتر لیا جاتا ہے، اسے مربع کیا جاتا ہے، اور عرض کا کامل وتر لیا جاتا ہے اور اس کا مربع بھی۔ تصحیح شدہ دوسرا ضلع تسدیس کے کامل وتر کے مربع میں سے تفریق سے نکلتا ہے، پھر تصحیح شدہ وتر کو قوس میں بدلا جاتا ہے، تو دائرۂ البروج پر تسدیس اور تثلیث حاصل ہوتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.200-201}"
  es: "Para determinar cuántas partes proyecta un cuerpo su rayo de sextil o trígono sobre la eclíptica cuando tiene una latitud, se toma la cuerda del resto del segundo lado de las tablas de semicuerdas, se eleva al cuadrado y se halla y eleva también al cuadrado la cuerda completa de la latitud. El segundo lado corregido se obtiene restando del cuadrado de la cuerda completa del aspecto, y la cuerda corregida se transforma en un arco, lo que da como resultado el sextil y el trígono sobre la eclíptica. {cite:zij-sabi-nallino-byblion pp.200-201}"
