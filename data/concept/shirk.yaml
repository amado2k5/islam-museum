id: concept/shirk
class: concept
kind: doctrine
label: { ar: "الشرك", en: "Shirk (associating partners with God)" }
summary:
  ar: "يرى ابن قيم الجوزية، في منتخب «إغاثة اللهفان»، أن الشرك أعظم الظلم وأن دعاء الأموات والتوسل بهم والشفاعة عندهم من أبوابه، وأن الشفاعة لا تُنال باتخاذ الشفعاء بل بإذن الله ورضاه."
  en: "As the extract presents Ibn Qayyim's view, shirk is the gravest wrong; calling on the dead, seeking their intercession and making them intermediaries are among its doors; and intercession is granted only by God's permission and acceptance, not by taking intercessors."
themes: [creed]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "ما الذي يجعل التعلق بالصالحين والموتى والشفعاء شركاً؟"
  en: "What makes attachment to the righteous, the dead and intercessors into shirk?"
perspectives:
  - tradition: sunni
    id: ighathat-lahfan
    stance:
      ar: "الشرك ضد التوحيد، وأن تعظيم القبور وطلب الشفاعة من أصحابها من أبوابه، وأن الشفاعة بإذن الله لا باتخاذ الشفعاء"
      en: "Shirk is the opposite of tawhid; venerating graves and seeking intercession from their occupants are among its doors; intercession is by God's permission, not by taking intercessors"
    summary:
      ar: "يستدل ابن قيم الجوزية بقوله تعالى عن قوم نوح، وبأن الشفاعة في القرآن مقيدة بالإذن والرضا، وبأن المشرك لا تنفعه شفاعة. ويرى أن المبتدع المعظّم لأصحاب القبور يضيّع تعظيم النبي ويجعل الشفاعة سبباً للشرك، وأن الشرك تنقّص لربوبية الله."
      en: "Ibn Qayyim cites the Qur'anic account of the people of Noah, the Qur'anic limit of intercession to those God permits and approves, and the lack of benefit to the polytheist from any intercession. He argues that whoever venerates the occupants of graves diminishes the honour owed to the Prophet, and that shirk is a diminishing of God's lordship."
