label: { ar: "الشرك", en: "Shirk (associating partners with God)", es: "Shirk (asociar copartícipes con Dios)", fr: "Shirk (associer des partenaires à Dieu)", ur: "شرک ⁦(خدا کے ساتھ شرک کرنا)⁩" }
summary:
  ar: "يرى ابن قيم الجوزية، في منتخب «إغاثة اللهفان»، أن الشرك أعظم الظلم وأن دعاء الأموات والتوسل بهم والشفاعة عندهم من أبوابه، وأن الشفاعة لا تُنال باتخاذ الشفعاء بل بإذن الله ورضاه."
  en: "As the extract presents Ibn Qayyim's view, shirk is the gravest wrong; calling on the dead, seeking their intercession and making them intermediaries are among its doors; and intercession is granted only by God's permission and acceptance, not by taking intercessors."
  es: "Tal como lo presenta el extracto, según la opinión de Ibn Qayyim, el shirk es la falta más grave; invocar a los muertos, buscar su intercesión y convertirlos en intermediarios son algunas de sus causas; y la intercesión se concede solo con el permiso y la aceptación de Dios, no tomando intercesores."
  fr: "Selon l'extrait présenté par Ibn Qayyim, le shirk est le péché le plus grave; invoquer les morts, solliciter leur intercession et les prendre comme intermédiaires en font partie; et l'intercession n'est accordée que par la permission et l'acceptation de Dieu, et non par le recours à des intercesseurs."
  ur: "جیسا کہ اقتباس ابن قیم کا قول پیش کرتا ہے، شرک سب سے بڑا غلط ہے۔ مُردوں کو پکارنا، ان کی شفاعت طلب کرنا اور ان کو ثالث بنانا اس کے دروازوں میں سے ہیں۔ اور شفاعت صرف خدا کی اجازت اور قبولیت سے ملتی ہے، سفارشی لینے سے نہیں۔"
