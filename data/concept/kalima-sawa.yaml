id: concept/kalima-sawa
class: concept
kind: doctrine
label:
  ar: الكلمة السواء ⁦(الدعوة إلى التوحيد المشترك)⁩
  en: The common word (the shared call to monotheism)
  es: "La palabra común (el llamado compartido al monoteísmo)"
  fr: "Le mot commun (l'appel partagé au monothéisme)"
  ur: "مشترکہ لفظ ⁦(توحید کی مشترکہ دعوت)⁩"
  tr: "Ortak Kelime (Ortak Birleşme Çağrısı)"
  id: "Kata Umum (Seruan untuk Penyatuan Bersama)"
summary:
  ar: "يرى الشعراوي أن الآية التي تدعو أهل الكتاب إلى كلمة مستوية بين المسلمين وبينهم تقرر توحيد الله دون شريك، وأن الشرك لا يستقيم عقلاً لأن الخلق لا يشارك الخالق في الخلق، ولا يُقبل من أحد أن يشارك في التدبير بعد أن أنزل الله منهجه، وأن المؤمنين إن أُعرض عنهم يشهدون بإسلامهم وخضوعهم لله {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1522}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1523}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1524}."
  en: "Sha'rawi reads the verse that invites the People of the Book to a word common to both sides as a call to worship God alone. He argues that shirk does not hold up to reason, since creation shares nothing with the Creator, and that no one may share in governing once God has sent his law. If the invitation is refused, the believers are to testify to their own submission to God {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1522}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1523}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1524}."
  es: "Sha'rawi interpreta el versículo que invita a la Gente del Libro a una palabra común a ambos bandos como un llamado a adorar solo a Dios. Argumenta que el shirk (idolatría) no se sostiene ante la razón, ya que la creación no comparte nada con el Creador, y que nadie puede participar en el gobierno una vez que Dios ha enviado su ley. Si se rechaza la invitación, los creyentes deben dar testimonio de su propia sumisión a Dios {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1522}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1523}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1524}."
  fr: "Sha'rawi interprète le verset qui invite les Gens du Livre à une parole commune aux deux camps comme un appel à adorer Dieu seul. Il soutient que le shirk (associationnisme) est irrationnel, car la création ne partage rien avec le Créateur, et que nul ne peut participer au gouvernement une fois que Dieu a donné sa loi. Si l'invitation est refusée, les croyants doivent témoigner de leur soumission à Dieu."
  ur: "شعراوی اس آیت کو پڑھتے ہیں جو اہل کتاب کو ایک ایسے لفظ کی طرف دعوت دیتی ہے جو دونوں طرف مشترک ہے اور صرف خدا کی عبادت کی دعوت دیتا ہے۔ وہ استدلال کرتا ہے کہ شرک استدلال پر قائم نہیں رہتا، کیونکہ تخلیق خالق کے ساتھ کسی چیز کا اشتراک نہیں کرتی، اور یہ کہ خدا نے اپنا قانون بھیجنے کے بعد کوئی بھی حکومت میں شریک نہیں ہو سکتا۔ اگر دعوت سے انکار کر دیا جائے تو مومنین کو خدا کے سامنے اپنے سر تسلیم خم کرنے کی گواہی دینا ہوگی"
  tr: "El-Şaarawi, Müslümanlar arasında ve aralarında Kitap Ahlini dengeli bir söze çağıran ayetin Allah'ın ortaksız birliğini onayladığına ve çoktanrıcılığın mantıksal olarak sağlam olmadığını, çünkü yaratılışın yaratılışta Yaratıcıyı paylaşmadığını, Allah yöntemini vahyettiğinden sonra kimsenin yönetime katılmaya kabul edilmediğini düşünür. Ve inananlar onlardan yüz çevirirse, İslamlarını ve Allah'a itaatlerini tanıklık ettiklerini {cite:tafsir-sharawi-khawatir-scan-cilt 2 s.1522}{cite:tafsir-sharawi-khawatir-scan-vol-cilt 2 s.1523}{cite:tafsir-sharawi-khawatir-scan-vol-cül-2 s.1524}."
  id: "Al-Shaarawi percaya bahwa ayat yang menyerukan umat Kitab kepada firman yang seimbang di antara Muslim dan di antara mereka menegaskan kesatuan Allah tanpa mitra, dan bahwa politeisme tidak masuk akal secara rasional karena ciptaan tidak berbagi Pencipta dalam penciptaan, dan tidak ada yang diterima untuk ikut serta dalam pengelolaan setelah Allah mewahyukan metodologi-Nya. Dan jika orang beriman menjauh dari mereka, mereka bersaksi akan Islam dan penyerahan mereka kepada Allah {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1522}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1523}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1524}."
