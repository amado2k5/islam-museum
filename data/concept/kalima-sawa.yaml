id: concept/kalima-sawa
class: concept
kind: doctrine
label:
  ar: الكلمة السواء (الدعوة إلى التوحيد المشترك)
  en: The common word (the shared call to monotheism)
summary:
  ar: "يرى الشعراوي أن الآية التي تدعو أهل الكتاب إلى كلمة مستوية بين المسلمين وبينهم تقرر توحيد الله دون شريك، وأن الشرك لا يستقيم عقلاً لأن الخلق لا يشارك الخالق في الخلق، ولا يُقبل من أحد أن يشارك في التدبير بعد أن أنزل الله منهجه، وأن المؤمنين إن أُعرض عنهم يشهدون بإسلامهم وخضوعهم لله {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1522}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1523}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1524}."
  en: "Sha'rawi reads the verse that invites the People of the Book to a word common to both sides as a call to worship God alone. He argues that shirk does not hold up to reason, since creation shares nothing with the Creator, and that no one may share in governing once God has sent his law. If the invitation is refused, the believers are to testify to their own submission to God {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1522}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1523}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1524}."
