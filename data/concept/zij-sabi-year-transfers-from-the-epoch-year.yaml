id: concept/zij-sabi-year-transfers-from-the-epoch-year
class: concept
kind: scientific
label: { ar: "تحاويل السنين من سنة الأصل", en: "Year transfers from the epoch year", ur: "سنوں کی تحاویل اصل سال سے", es: "Transferencias de año desde el año de la época", fr: "Transferts d'année à partir de l'année d'époque", tr: "Orijinal yıldan yıl dönüşümleri", id: "Konversi tahun dari tahun aslinya" }
summary:
  ar: "تُعرف السنة التي كان فيها الابتداء من سني ذي القرنين والسنة المطلوبة، ثم يُنقص الأقل من الأكثر فيبقى عدد السنين التامة. تُضرب هذه السنين في ست وثمانين درجة وست وثلاثين دقيقة، وهي زيادة زمان السنة على الأيام التامة، فيُلقى منها الأدوار، ويُقسم الباقي على العدد الذي يذكره النص لساعة واحدة، وهو مشوش، فيخرج ساعات معتدلة يُزاد بها على ساعات التقويم في الأصل. فإن بلغت أكثر من أربع وعشرين ساعة أُلقي منها أربع وعشرون وزيد يوم على الأيام الماضية من الشهر. {cite:zij-sabi-nallino-byblion pp.196-197}"
  en: "The year of the epoch in the era of Dhu al-Qarnayn and the wanted year are taken, and the smaller is subtracted from the larger to leave the whole years elapsed. These years are multiplied by eighty-six degrees and thirty-six minutes, which is the excess of the solar year over whole days; the full revolutions are discarded and the rest is divided by the figure the text gives for one hour, garbled in the scan, into equal hours that are added to the calendar hours of the original. If the sum passes twenty-four hours, twenty-four are removed and one day added to the days elapsed in the month. {cite:zij-sabi-nallino-byblion pp.196-197}"
  ur: "ذوالقرنین کے سنین میں اصل سال اور مطلوبہ سال لیے جاتے ہیں، چھوٹے کو بڑے میں سے گھٹا کر گزرے ہوئے پورے سال معلوم ہوتے ہیں۔ ان سالوں کو چھیاسی درجے اور چھتیس دقیقے سے ضرب دیا جاتا ہے، جو شمسی سال کا پورے دنوں سے زائد حصہ ہے؛ دور کاٹ کر باقی کو گھنٹوں میں تقسیم کیا جاتا ہے اور اصل کے تقویمی گھنٹوں میں جمع کیا جاتا ہے۔ اگر مجموعہ چوبیس گھنٹوں سے بڑھ جائے تو چوبیس نکال کر مہینے کے گزرے ہوئے دنوں میں ایک دن جمع کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.196-197}"
  es: "Se toma el año de la época en la era de Dhu al-Qarnayn y el año deseado, y se resta el menor del mayor para obtener los años transcurridos. Estos años se multiplican por ochenta y seis grados y treinta y seis minutos, que es el exceso del año solar sobre días completos; se descartan las revoluciones completas y el resto se divide por la cifra que el texto da para una hora, distorsionada en el escaneo, en horas iguales que se suman a las horas del calendario original. Si la suma supera las veinticuatro horas, se restan veinticuatro y se añade un día a los días transcurridos en el mes. {cite:zij-sabi-nallino-byblion pp.196-197}"
  fr: "On prend l'année de l'époque de Dhu al-Qarnayn et l'année recherchée, puis on soustrait la plus petite de la plus grande pour obtenir le nombre d'années écoulées. Ces années sont multipliées par quatre-vingt-six degrés et trente-six minutes, ce qui correspond à la durée de l'année solaire en jours entiers. On supprime les révolutions complètes et on divise le résultat par la valeur donnée pour une heure dans le texte (valeur altérée par la numérisation), afin d'obtenir des heures égales qui sont ajoutées aux heures du calendrier original. Si la somme dépasse vingt-quatre heures, on en soustrait vingt-quatre et on ajoute un jour au nombre de jours écoulés dans le mois. {cite:zij-sabi-nallino-byblion pp.196-197}"
  tr: "Takvimin başladığı yıl, Zilhicce-Karneyn yılı ve istenen yıla göre belirlenir. Bu yıllardan daha küçük olanı daha büyük olandan çıkarılır ve tam yıl sayısı elde edilir. Bu yıllar, tam günlere göre bir yılın fazladan uzunluğunu temsil eden 86 derece ve 36 dakika ile çarpılır. Daha sonra periyotlar atılır ve kalan kısım, metinde bir saat için belirtilen saat sayısına bölünür (bu biraz kafa karıştırıcıdır). Bu, standart saatleri verir ve bunlar daha sonra orijinal takvim saatlerine eklenir. Toplam 24 saati aşarsa, 24 saat atılır ve ayın mevcut günlerine bir gün eklenir. {cite:zij-sabi-nallino-byblion pp.196-197}"
  id: "Tahun dimulainya kalender diketahui berdasarkan tahun Dzul-Qarnayn dan tahun yang diinginkan. Tahun yang lebih kecil kemudian dikurangi dari tahun yang lebih besar, sehingga tersisa jumlah tahun penuh. Tahun-tahun ini dikalikan dengan 86 derajat dan 36 menit, yang mewakili panjang tambahan satu tahun dibandingkan dengan hari penuh. Periode kemudian dibuang, dan sisanya dibagi dengan jumlah jam yang disebutkan dalam teks untuk satu jam (yang agak membingungkan). Ini menghasilkan jam standar, yang kemudian ditambahkan ke jam kalender asli. Jika totalnya melebihi 24 jam, 24 jam dibuang, dan satu hari ditambahkan ke jumlah hari yang ada dalam bulan tersebut. {cite:zij-sabi-nallino-byblion pp.196-197}"
