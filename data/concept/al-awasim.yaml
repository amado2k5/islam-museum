label: { ar: "العواصم" }
summary:
  ar: "العواصم منطقة حدودية أنشأها هارون الرشيد داخل وحدة إدارية تتمتع بحرية ذاتية، فصلها عن مناطق الثغور الجزرية والشامية، وسميت بالعواصم لأنها تعصم الحدود من الوقوع في قبضة العدو — وللتمييز بينها وبين الحصون الشمالية الخارجية المعروفة بالثغور؛ وتمتد من إنطاكية إلى الفرات، وكانت منبج عاصمتها ثم أصبحت إنطاكية، واختار الرشيد ابنه القاسم أميراً عليها، ومهمتها مساندة مناطق الثغور وإمدادها بالعتاد والرجال والمؤن فجهزت بالحاميات الدائمة والمؤن والأعتدة الخاصة بضرورات الدفاع {cite:tarikh-dawla-abbasiyya-taqqush p. 101-102}. وفي المقابل وضع البيزنطيون خطاً دفاعياً يضم سلسلتي جبال طوروس ممتداً من الفرات حتى كيليكيا في قسمين: من ملطية إلى عين زربة لمواجهة نشاط المسلمين من شمالي العراق، والثاني لنشاطهم من جهة الشام {cite:tarikh-dawla-abbasiyya-taqqush p. 102}."
  en: "al-Awasim — al-Rashid's self-governing frontier district 'that shields the borders', from Antioch to the Euphrates, charged with supplying the thughur; matched by the Byzantines' own Taurus defence line {cite:tarikh-dawla-abbasiyya-taqqush p. 101-102}."
