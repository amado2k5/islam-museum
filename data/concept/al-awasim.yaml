label: { ar: "العواصم", en: "al-Awasim", fr: "Al-Awasim", es: "al-Awasim", ur: "العوسیم", tr: "Başkentler", id: "Kapital" }
summary:
  ar: "العواصم منطقة حدودية أنشأها هارون الرشيد داخل وحدة إدارية تتمتع بحرية ذاتية، فصلها عن مناطق الثغور الجزرية والشامية، وسميت بالعواصم لأنها تعصم الحدود من الوقوع في قبضة العدو — وللتمييز بينها وبين الحصون الشمالية الخارجية المعروفة بالثغور؛ وتمتد من إنطاكية إلى الفرات، وكانت منبج عاصمتها ثم أصبحت إنطاكية، واختار الرشيد ابنه القاسم أميراً عليها، ومهمتها مساندة مناطق الثغور وإمدادها بالعتاد والرجال والمؤن فجهزت بالحاميات الدائمة والمؤن والأعتدة الخاصة بضرورات الدفاع {cite:tarikh-dawla-abbasiyya-taqqush p. 101-102}. وفي المقابل وضع البيزنطيون خطاً دفاعياً يضم سلسلتي جبال طوروس ممتداً من الفرات حتى كيليكيا في قسمين: من ملطية إلى عين زربة لمواجهة نشاط المسلمين من شمالي العراق، والثاني لنشاطهم من جهة الشام {cite:tarikh-dawla-abbasiyya-taqqush p. 102}."
  en: "al-Awasim — al-Rashid's self-governing frontier district 'that shields the borders', from Antioch to the Euphrates, charged with supplying the thughur; matched by the Byzantines' own Taurus defence line {cite:tarikh-dawla-abbasiyya-taqqush p. 101-102}."
  fr: "Al-Awasim, district frontalier autonome établi par Al-Rashid, « protège les frontières ». Il s’étend d’Antioche à l’Euphrate et a pour charge de ravitailler les thughur. Les Byzantins lui opposent leur propre ligne de défense dans le Taurus {cite:tarikh-dawla-abbasiyya-taqqush p. 101-102}."
  es: "al-Awasim — distrito fronterizo autónomo de al-Rashid 'que protege las fronteras', desde Antioquía hasta el Éufrates, encargado de abastecer al thughur; equivalente a la propia línea defensiva del Tauro de los bizantinos {cite:tarikh-dawla-abbasiyya-taqqush p. 101-102}."
  ur: "الاعواسم — الرشید کا خود مختار سرحدی ضلع 'جو سرحدوں کی حفاظت کرتا ہے'، انطاکیہ سے فرات تک، جس پر تھغور کی فراہمی کا الزام ہے۔ بازنطینیوں کی اپنی ٹورس ڈیفنس لائن سے مماثل ہے 101-102}۔"
  tr: "Başkentler, Harun el-Raşid tarafından adadan ve Levant sınır bölgelerinden ayrı, özerkliğe sahip idari bir birim içinde kurulan sınır bölgeleridir. 'al-Wasim' olarak adlandırılmıştır çünkü sınırları düşman tarafından ele geçirilmesinden korur ve kuzeydeki dış kaleler olan sınırlardan ayırt etmek içindir. Antakya'dan Fırat'a kadar uzanır, başkenti Manbij ve daha sonra Antakya olmuştur. El-Reşid, oğlu Al-Kasim'i emiri olarak seçmiştir. Görevi, sınır bölgelerini desteklemek, onlara ekipman, adam ve erzak sağlamak, kalıcı garnizonlar, erzaklar ve savunma ihtiyaçları için ekipman sağlamaktı {cite:History-dawla-abbasiyya-taqqush, s. 101-102}. Buna karşılık, Bizanslılar Fırat'tan Kilikya'ya uzanan Toros dağ sırasını iki bölümde kapsayan bir savunma hattı kurmuşlardır: Malatya'dan Ayn Zarba'ya kadar kuzey Irak'tan gelen Müslüman faaliyetlerine karşı koymak için ve ikinci bölüm Levant'tan {atıf:Tarikh-dawla-abbasiyya-taqqush, s. 102}."
  id: "Ibu kota adalah wilayah perbatasan yang didirikan oleh Harun al-Rashid dalam unit administratif otonom yang terpisah dari pulau dan wilayah perbatasan Levant. Mereka disebut 'al-Wasim' karena melindungi perbatasan dari penaklukan musuh dan membedakannya dari benteng luar di utara. Wilayah ini membentang dari Antiokhia hingga Sungai Efrat, dengan Manbij sebagai ibu kotanya dan kemudian Antiokhia. Al-Rashid memilih putranya Al-Qasim sebagai emirnya. Tugasnya adalah mendukung wilayah perbatasan, menyediakan peralatan, personel, dan persediaan, serta menyediakan garnisun permanen, persediaan, dan peralatan untuk kebutuhan pertahanan {cite:History-dawla-abbasiyya-taqqush, hlm. 101-102}. Sebaliknya, Bizantium membentuk garis pertahanan yang meliputi pegunungan Taurus dari Efrat hingga Kilikia dalam dua bagian: dari Malatya ke Ayn Zarba untuk melawan aktivitas Muslim yang datang dari Irak utara, dan bagian kedua dari Levant {kutipan: Tarikh-dawla-abbasiyya-taqqush, hlm. 102}."
