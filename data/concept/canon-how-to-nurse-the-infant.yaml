summary:
  ar: "يفصل ابن سينا في كل إرضاعة: حلب شيء من اللبن، وإعانة الطفل بالغمز، وإلعاق عسل، والإرضاع قليلاً قليلاً، وتدبير التمدد والنفخة، وتغيير المرضعة عند علتها أو دوائها، وعدم تحريك المهد بعنف، وأن مدة الرضاع الطبيعية سنتان {cite:canon-ibn-sina-print-v1 p.210}."
  en: "Ibn Sina sets out for each nursing: drawing off a little milk, helping the child by pressing, a lick of honey, nursing little by little, handling distension and wind, changing the nurse when she is ill or taking a drug, not rocking the cradle roughly, and that the natural period of nursing is two years {cite:canon-ibn-sina-print-v1 p.210}."
