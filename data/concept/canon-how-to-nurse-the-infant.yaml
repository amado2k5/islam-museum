id: concept/canon-how-to-nurse-the-infant
class: concept
kind: scientific
label:
  ar: "كيفية الإرضاع وأحكامه"
  en: "How to nurse the infant and its rules"
  fr: "Allaitement du nourrisson et règles décrites dans le Canon"
  ur: "دودھ پلانے کا طریقہ اور اس کے آداب"
  es: "Cómo amamantar al bebé y sus reglas"
  tr: "Emzirme Nasıl Yapılır ve Kuralları"
  id: "Cara menyusui dan aturannya"
summary:
  ar: "يفصل ابن سينا في كل إرضاعة: حلب شيء من اللبن، وإعانة الطفل بالغمز، وإلعاق عسل، والإرضاع قليلاً قليلاً، وتدبير التمدد والنفخة، وتغيير المرضعة عند علتها أو دوائها، وعدم تحريك المهد بعنف، وأن مدة الرضاع الطبيعية سنتان {cite:canon-ibn-sina-print-v1 p.210}."
  en: "Ibn Sina sets out for each nursing: drawing off a little milk, helping the child by pressing, a lick of honey, nursing little by little, handling distension and wind, changing the nurse when she is ill or taking a drug, not rocking the cradle roughly, and that the natural period of nursing is two years {cite:canon-ibn-sina-print-v1 p.210}."
  fr: "Ibn Sina décrit retrait initial de lait, aide par pression, miel léché, petites tétées, gestion du gonflement et des vents, changement de nourrice malade ou sous remède, bercement doux et durée naturelle de deux ans {cite:canon-ibn-sina-print-v1 p.210}."
  es: "Ibn Sina establece para cada lactancia: extraer un poco de leche, ayudar al niño presionando, un lametón de miel, amamantar poco a poco, tratar la distensión y los gases, cambiar a la nodriza cuando está enferma o tomando un medicamento, no mecer la cuna bruscamente, y que el período natural de lactancia es de dos años {cite:canon-ibn-sina-print-v1 p.210}."
  ur: "ابن سینا نے ہر دودھ پلانے کے لیے مقرر کیا ہے: تھوڑا سا دودھ نکالنا، دبا کر بچے کی مدد کرنا، شہد چاٹنا، تھوڑا تھوڑا کرکے دودھ پلانا، تناؤ اور ہوا کو سنبھالنا، نرس کو تبدیل کرنا جب وہ بیمار ہو یا دوائی لیتی ہے، جھولا جھولا نہیں ہلانا، اور یہ کہ دودھ پلانے کی فطری مدت دو سال کی ہوتی ہے۔ صفحہ 210}۔"
  tr: "İbn Sina, her emzirmede şunları detaylandırır: biraz süt sağmak, bebeğe göz kırpmaya yardım etmek, bal emdirmek, yavaş yavaş emzirmek, esneme ve nefes nefese kalma kontrolü, hasta veya tedavi altındayken emzirmeyi değiştirmek, beşiği şiddetle hareket ettirmemek ve emzirme süresinin iki yıl olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.210}."
  id: "Ibn Sina merinci dalam setiap menyusui hal-hal berikut: memerah susu, membantu bayi mengedipkan mata, menyusu madu, menyusui sedikit demi sedikit, mengelola peregangan dan terengah-engah, mengubah cara menyusui saat sakit atau dalam perawatan, tidak menggerakkan buaian dengan kasar, dan bahwa durasi menyusui adalah dua tahun {cite:canon-ibn-sina-print-v1 hlm.210}."
