id: concept/ilaj-al-subat-al-suhari
class: concept
kind: scientific
label:
  ar: "علاج السبات السهري"
  en: "Treatment of the sleepless coma"
  ur: "جاگتی غنودگی کا علاج"
  es: "Tratamiento del coma insomne"
  fr: "Traitement du coma sans sommeil"
summary:
  ar: "يذكر ابن سينا مبادئ علاج السبات السهري: الاستفراغ بالدم ثم الاستفراغ بالإسهال بقدر غلبة المرة أو البلغم، ومنع الغذاء، وتقيئة من كان سببه إكثار الطعام، وأن علاج السكر ينتظر زواله، وأن أدويته مركبة من البرد والسخونة بحسب الغالب؛ ولا تُنقل الوصفات {cite:canon-ibn-sina-print-v2 p.88}"
  en: "Ibn Sina gives the principles of treating the sleepless coma: evacuation of blood and then purging in the measure of whether bile or phlegm prevails, withholding food, making the patient vomit when overeating is the cause, waiting for drunkenness to pass, and remedies compounded of cold and warmth according to which prevails; recipes are left out {cite:canon-ibn-sina-print-v2 p.88}"
  ur: "ابن سینا جاگتی غنودگی کے علاج کے اصول بتاتا ہے: خون کا استفراغ پھر اسہال سے استفراغ اس کے مطابق کہ صفراء غالب ہے یا بلغم، غذا روکنا، جس کا سبب زیادہ کھانا ہو اسے قے کرانا، نشے کے علاج میں اس کے اترنے کا انتظار، اور ایسی دوائیں جو غالب کے مطابق سردی اور گرمی سے مرکب ہوں؛ نسخے چھوڑ دیے گئے ہیں {cite:canon-ibn-sina-print-v2 p.88}۔"
  es: "Ibn Sina expone los principios para tratar el coma insomne: evacuación de la sangre y posterior purga según predomine la bilis o la flema, restricción alimentaria, inducción del vómito cuando la causa es la sobrealimentación, espera a que pase la embriaguez y remedios compuestos de frío y calor según predomine; se omiten las recetas {cite:canon-ibn-sina-print-v2 p.88}"
  fr: "Ibn Sina énonce les principes du traitement du coma sans sommeil: évacuation du sang suivie d’une purge en fonction de la prédominance de la bile ou du flegme, jeûne, vomissements provoqués en cas de suralimentation, attente de la dissipation de l’ivresse et préparation de remèdes composés de froid et de chaleur selon la prédominance; les recettes ne sont pas incluses. {cite:canon-ibn-sina-print-v2 p.88}"
