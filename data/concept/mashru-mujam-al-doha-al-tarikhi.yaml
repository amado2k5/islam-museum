label:
  ar: "مشروع معجم الدوحة التاريخي للغة العربية (2013)"
  en: "The Doha Historical Dictionary project (2013)"
  ur: "دوحہ تاریخی لغت کا منصوبہ (2013)"
  fr: "Le projet du Dictionnaire historique de Doha (2013)"
  es: "El proyecto del Diccionario Histórico de Doha (2013)"
summary:
  ar: "معجم الدوحة التاريخي للغة العربية، أُعلن وأُطلق رسمياً سنة 2013 تحت المركز العربي للأبحاث ودراسة السياسات برعاية الشيخ تميم بن حمد آل ثاني، معجم تاريخي شامل يتتبع الألفاظ والجذور والدلالات عبر نحو عشرين قرناً على مدونة رقمية نحو مليار كلمة، بنحو 300 ألف مدخل وعشرة آلاف جذر، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:dohadictionary-org-home}."
  en: "The Doha Historical Dictionary of the Arabic Language, officially announced and launched in 2013 under the Arab Center for Research and Policy Studies with the patronage of Sheikh Tamim bin Hamad Al Thani, a comprehensive historical dictionary tracing words, roots and meanings across about twenty centuries on a digital corpus of about a billion words, with about 300,000 entries and 10,000 roots, as a research file supplied to the museum summarises it {cite:dohadictionary-org-home}."
  ur: "عربی زبان کی دوحہ تاریخی لغت، جس کا باضابطہ اعلان اور آغاز 2013 میں عرب مرکزِ تحقیق و مطالعۂ پالیسی کے تحت شیخ تمیم بن حمد آل ثانی کی سرپرستی میں ہوا، ایک جامع تاریخی لغت ہے جو تقریباً بیس صدیوں میں الفاظ، جڑوں اور معانی کا سراغ لگاتی ہے، تقریباً ایک ارب الفاظ کے ڈیجیٹل ذخیرۂ الفاظ پر قائم ہے، اور اس میں تقریباً 300,000 اندراجات اور 10,000 جڑیں ہیں، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل اس کا خلاصہ کرتی ہے {cite:dohadictionary-org-home}."
  fr: "Le Dictionnaire historique de Doha de la langue arabe, annoncé et lancé officiellement en 2013 sous l'égide du Centre arabe de recherches et d'études politiques avec le patronage du cheikh Tamim ben Hamad Al Thani, est un dictionnaire historique complet qui retrace les mots, les racines et les sens sur environ vingt siècles à partir d'un corpus numérique d'environ un milliard de mots, avec environ 300 000 entrées et 10 000 racines, comme le résume un dossier de recherche remis au musée {cite:dohadictionary-org-home}."
  es: "El Diccionario Histórico de Doha de la lengua árabe, anunciado y lanzado oficialmente en 2013 bajo el Centro Árabe de Investigación y Estudios de Políticas con el patrocinio del jeque Tamim bin Hamad Al Thani, es un diccionario histórico exhaustivo que rastrea palabras, raíces y significados a lo largo de unos veinte siglos sobre un corpus digital de unos mil millones de palabras, con unas 300 000 entradas y 10 000 raíces, tal como lo resume un expediente de investigación entregado al museo {cite:dohadictionary-org-home}."
