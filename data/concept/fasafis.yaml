summary:
  ar: "فسافس في الكتاب حيوان كالقراد معروف بالشام يكون في الأسرة، وفي حاشية المحقق أنه البق، ويذكر الكتاب فيه أخبارا في إخراج العلق من الحلق واختناق الرحم وعسر البول وحمى الربع ولسع الهوام، تنقل هنا منسوبة إلى الكتاب لا نصيحة {cite:canon-ibn-sina-print-v1 635}"
  en: "Fasafis is in the book an animal like the tick, known in Syria, found in beds, and the editor's footnote says it is the bedbug; the book gives reports on it for bringing a leech out of the throat, for suffocation of the womb, difficulty in urination, quartan fever and the stings of vermin, passed on here as the book's attributed reports, not advice {cite:canon-ibn-sina-print-v1 635}"
  ur: "فسافس کتاب میں چیچڑی جیسا جانور ہے جو شام میں معروف ہے اور بستروں میں ہوتا ہے، اور مدقق کے حاشیے میں ہے کہ یہ کھٹمل ہے؛ کتاب اس کے بارے میں جونک کو حلق سے نکالنے، رحم کے گھٹنے، پیشاب کی دشواری، چوتھیا بخار اور زہریلے جانوروں کے ڈنک کی خبریں دیتی ہے، جو یہاں کتاب سے منسوب اطلاعات کے طور پر نقل ہیں، نصیحت کے طور پر نہیں {cite:canon-ibn-sina-print-v1 635}۔"
  es: "En el libro, Fasafis es un animal parecido a la garrapata, conocido en Siria, que se encuentra en las camas, y la nota al pie del editor dice que es la chinche de cama; el libro da informes sobre ella para extraer una sanguijuela de la garganta, para la asfixia del útero, dificultad para orinar, fiebre cuartana y picaduras de alimañas, transmitidos aquí como informes atribuidos al libro, no como consejos {cite:canon-ibn-sina-print-v1 635}"
  fr: "Fasafis est décrit dans le livre comme un animal ressemblant à la tique, connu en Syrie et présent dans les lits. La note de bas de page de l'éditeur précise qu'il s'agit de la punaise de lit. Le livre rapporte que Fasafis pouvait provoquer l'extraction d'une sangsue de la gorge, l'asphyxie utérine, des difficultés à uriner, la fièvre quarte et les piqûres de vermine. Ces informations sont rapportées ici comme des témoignages attribués au livre, et non comme des conseils. {cite:canon-ibn-sina-print-v1 635}"
  tr: "Kitapta, Levant'ta bilinen ve ailede bulunan kene benzeri bir hayvan vardır ve editörün dipnotunda bu tahtakurusudur. Kitapta boğazdan sülüklerin alınması, rahim boğulması, idrar yapma zorluğu, dörtlü ateş ve uzuvlarda sokma gibi raporlar yer alır. Bu durum burada kitaba atfedilen olarak aktarılmıştır, tavsiye olarak değil {cite:canon-ibn-sina-print-v1 635}"
  id: "Dalam buku ini, ada hewan mirip kutu yang dikenal di Levant yang merupakan bagian dari keluarga, dan dalam catatan kaki editor, itu adalah kutu kasur. Buku ini menyebutkan laporan tentang pengangkatan lintah dari tenggorokan, tersedak rahim, kesulitan buang air kecil, demam kuadrupeal, dan sengatan pada anggota tubuh. Hal ini disampaikan di sini sebagai atribut pada buku, bukan sebagai nasihat {cite:canon-ibn-sina-print-v1 635}"
