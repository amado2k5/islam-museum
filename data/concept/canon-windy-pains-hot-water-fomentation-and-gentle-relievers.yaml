label: { ar: "الأوجاع الريحية والتكميد والمسكنات اللطيفة عند ابن سينا", en: "Windy pains, hot water, fomentation and the gentle relievers in the Canon", ur: "قانون میں ہوائی درد، گرم پانی، ٹکور اور ہلکی مسکن چیزیں", es: "Dolores causados por gases, agua caliente, fomentación y los suaves analgésicos del Canon", fr: "Douleurs dues aux gaz, eau chaude, fomentation et les remèdes doux du Canon", tr: "İbn Sina'ya göre rüzgar sancıları, sıkıştırma ve hafif ağrı kesiciler", id: "Nyeri angin, remas, dan obat pereda nyeri ringan menurut Ibn Sina" }
summary:
  ar: "يختم ابن سينا الفصل الثلاثين بما يسكن الأوجاع الريحية، فيذكر صب الماء الحار وخطره، والتكميد وأنواعه، والمحاجم بالنار، ثم المشي والشحوم والغناء الطيب {cite:canon-ibn-sina-print-v1 pp.310-311}."
  en: "Ibn Sina closes chapter 30 with what calms windy pains: pouring hot water and its danger, fomentation and its kinds, cupping glasses with fire, then walking, fats and pleasant song {cite:canon-ibn-sina-print-v1 pp.310-311}."
  es: "Ibn Sina cierra el capítulo 30 con lo que calma los dolores del viento: verter agua caliente y su peligro, la fomentación y sus tipos, calentar vasos con fuego, luego caminar, grasas y canciones agradables {cite:canon-ibn-sina-print-v1 pp.310-311}."
  fr: "Ibn Sina conclut le chapitre 30 avec ce qui calme les douleurs dues au vent: verser de l'eau chaude et son danger, la fomentation et ses sortes, couper des verres avec du feu, puis marcher, les graisses et le chant agréable {cite:canon-ibn-sina-print-v1 pp.310-311}."
  ur: "ابن سینا باب 30 کو اس کے ساتھ بند کرتا ہے جو ہوا کے درد کو پرسکون کرتی ہے: گرم پانی ڈالنا اور اس کا خطرہ، فومینٹیشن اور اس کی قسمیں، شیشے کو آگ سے پینا، پھر چلنا، چربی اور خوشگوار گیت"
  tr: "İbn Sina, otuzuncu bölümü rüzgar ağrılarını yatıştıran şeyle bitirir; sıcak su dökmenin, yutma ve ateşle dökme türlerinin, ardından yürüyüşün, yağların ve hoş şarkı söylemenin tehlikelerinden bahseder {cite:canon-ibn-sina-print-v1 s.310-311}."
  id: "Ibn Sina menutup bab ketiga puluh dengan apa yang meredakan rasa sakit angin, menyebutkan bahaya menuangkan air panas, jenis-jenis menelan dan tumpah dengan api, lalu berjalan, lemak, dan nyanyian yang menyenangkan {cite:canon-ibn-sina-print-v1 hlm.310-311}."
