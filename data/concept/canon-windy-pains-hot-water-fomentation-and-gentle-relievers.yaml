  fr: "Ibn Sina clôt le chapitre 30 par les moyens de calmer les douleurs venteuses : versement d'eau chaude et danger de ce procédé, fomentations et leurs variétés, ventouses à feu, puis marche, corps gras et chant agréable {cite:canon-ibn-sina-print-v1 pp.310-311}."
