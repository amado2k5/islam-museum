id: concept/qawaid-al-tafsir
class: concept
kind: discipline
label:
  ar: "أصول التفسير وقواعده"
  en: "Principles and rules of exegesis (usul and qawa'id al-tafsir)"
  ur: "اصول و قواعدِ تفسیر"
summary:
  ar: "القواعد الكلية التي يستعين بها المفسر في فهم ألفاظ القرآن ومعانيه، كعموم النكرة في سياق النفي، وأن العبرة بعموم اللفظ لا بخصوص السبب، ودلالة الحذف على التعميم، ولوازم المعاني؛ ومن أمثلتها الملحق الذي ختم به عبد الرحمن بن ناصر السعدي تفسيره «تيسير الكريم الرحمن» بعنوان «أصول وكليات من أصول التفسير وكلياته لا يستغني عنها المفسر للقرآن»."
  en: "The general rules that help the exegete understand the words and meanings of the Qur'an — such as the generality of an indefinite noun after a negation, that the general wording governs rather than the particular occasion, that omission signals generality, and that meanings carry their necessary implications. One example is the appendix with which Abd al-Rahman ibn Nasir al-Sa'di closed his Taysir al-Karim al-Rahman: 'Principles and generalities of exegesis that no exegete of the Qur'an can do without'."
  ur: "وہ کلی قواعد جن سے مفسر قرآن کے الفاظ و معانی سمجھنے میں مدد لیتا ہے، جیسے نفی کے سیاق میں نکرہ کا عموم، یہ کہ اعتبار لفظ کے عموم کا ہے نہ کہ سبب کے خصوص کا، حذف کا تعمیم پر دلالت کرنا، اور معانی کے لوازم؛ ان کی ایک مثال وہ ضمیمہ ہے جس پر عبد الرحمن بن ناصر سعدی نے اپنی تفسیر «تیسیر الکریم الرحمن» ختم کی: «تفسیر کے وہ اصول و کلیات جن سے قرآن کا مفسر بے نیاز نہیں»۔"
