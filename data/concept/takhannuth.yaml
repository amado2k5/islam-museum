label:
  ar: "التخنث"
  en: "Takhannuth (effeminacy in a man)"
  ur: "تخنث ⁦(مردوں کا عورتوں کی مشابہت اختیار کرنا)⁩"
  es: "Takhannuth (afeminamiento en un hombre)"
  fr: "Takhannuth (effémination chez un homme)"
summary:
  ar: "التخنث التثني والتكسر في الكلام والمشي واللباس على هيئة النساء. ويحرم تعمده، وفيه لعن النبي للمتشبهين من الرجال بالنساء، ويعاقب عليه بالتعزير. وتختلف الأحكام بين المخنث بالخلقة والمتعمد: فالمخنث بالخلقة لا يتعلق به الذم إذا لم يقدر على الترك، وتصح إمامته عند الجمهور، أما المتعمد فيفسق عند جماهير الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836}"
  en: "Takhannuth is the swaying and softening of a man's speech, walk and dress in the manner of women. Deliberate effeminacy is forbidden, and a narration has the Prophet cursing men who imitate women; it draws a ta'zir penalty. The rulings differ between the naturally effeminate and the one who does it on purpose: a naturally effeminate man who cannot give it up is not blamed and may lead prayer by most jurists, while one who does it deliberately is counted a sinner, and his imamate is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836}"
  es: "Takhannuth es la adaptación y suavización del habla, el andar y la vestimenta de un hombre a la manera femenina. La afeminación deliberada está prohibida, y una narración relata que el Profeta maldijo a los hombres que imitan a las mujeres, lo que conlleva una pena de ta'zir. Las normas difieren entre el hombre naturalmente afeminado y el que lo hace a propósito: un hombre naturalmente afeminado que no puede abandonar esta conducta no es censurado y puede dirigir la oración según la mayoría de los juristas, mientras que quien lo hace deliberadamente es considerado pecador y su imamato es cuestionado. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4833} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4834} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4835} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836}"
  fr: "Le takhannout consiste à adoucir et à imiter la façon de parler, de marcher et de s'habiller d'un homme à la manière des femmes. L'efféminement délibéré est interdit, et un hadith rapporte que le Prophète a maudit les hommes qui imitent les femmes; cela entraîne une peine de ta'zir. Les avis divergent selon que l'homme est naturellement efféminé ou non: un homme naturellement efféminé qui ne peut s'en défaire n'est pas blâmé et peut diriger la prière selon la plupart des juristes, tandis que celui qui agit délibérément est considéré comme un pécheur, et son imamat est contesté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836}"
  ur: "تَقَنُوت ایک مرد کی بول چال، چلنا پھرنا اور عورتوں کے انداز میں لباس کو ہلانا اور نرم کرنا ہے۔ جان بوجھ کر عفت حرام ہے، اور ایک روایت میں نبی نے عورتوں کی مشابہت کرنے والے مردوں پر لعنت بھیجی ہے۔ یہ تعزیر کی سزا دیتا ہے۔ فطری طور پر عاجزی کرنے والے اور جان بوجھ کر کرنے والے کے درمیان احکام میں فرق ہے: فطری طور پر متواضع آدمی جو اسے ترک نہ کر سکے اس پر کوئی الزام نہیں ہے اور اکثر فقہاء اس کی امامت کر سکتے ہیں، جبکہ جان بوجھ کر ایسا کرنے والا گنہگار شمار ہوتا ہے، اور اس کی امامت میں اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4833} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4834} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4835} صفحہ 4836}"
