label:
  ar: "التخنث"
  en: "Takhannuth (effeminacy in a man)"
  ur: "تخنث (مردوں کا عورتوں کی مشابہت اختیار کرنا)"
summary:
  ar: "التخنث التثني والتكسر في الكلام والمشي واللباس على هيئة النساء. ويحرم تعمده، وفيه لعن النبي للمتشبهين من الرجال بالنساء، ويعاقب عليه بالتعزير. وتختلف الأحكام بين المخنث بالخلقة والمتعمد: فالمخنث بالخلقة لا يتعلق به الذم إذا لم يقدر على الترك، وتصح إمامته عند الجمهور، أما المتعمد فيفسق عند جماهير الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836}"
  en: "Takhannuth is the swaying and softening of a man's speech, walk and dress in the manner of women. Deliberate effeminacy is forbidden, and a narration has the Prophet cursing men who imitate women; it draws a ta'zir penalty. The rulings differ between the naturally effeminate and the one who does it on purpose: a naturally effeminate man who cannot give it up is not blamed and may lead prayer by most jurists, while one who does it deliberately is counted a sinner, and his imamate is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4836}"
