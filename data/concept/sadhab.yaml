summary:
  ar: "السذاب في الكتاب منه بستاني ومنه بري ومنه جبلي، والجبلي أحد وأشد حرافة ولا يؤكل، والبزر هو المستعمل، حار يابس في الثانية ويابسه في الثالثة والبري في الرابعة فيما يقال، مقطع محلل مفش منق للعروق، ينفع من البهق والثآليل وداء الثعلب والفالج وعرق النسا والصداع ووجع الأذن وضعف البصر ووجع الصدر والاستسقاء والمغص والديدان، ويقاوم السموم، والإكثار من البري قاتل، وفي الكتاب نقل موسوم في المني والباه والرحم {cite:canon-ibn-sina-print-v1 p.600}."
  en: "Sadhab is in the book of a garden kind, a wild kind and a mountain kind, the mountain sharper and more pungent and not eaten, the seed being what is used; hot and dry in the second degree, the dried hot and dry in the third and the wild in the fourth, as is said; it cuts, dissolves and disperses and cleanses the vessels, and the book lists it for vitiligo, warts, alopecia, palsy, sciatica, headache, earache, weak sight, chest pain, dropsy, colic and worms, resisting poisons, while much of the wild kind is deadly, with a labelled listing on semen, desire and the womb {cite:canon-ibn-sina-print-v1 p.600}."
  ur: "سذاب کتاب میں باغی، جنگلی اور پہاڑی تینوں قسموں کا ہے؛ پہاڑی زیادہ تیز اور زیادہ چرپرا ہے اور کھانے میں نہیں کھایا جاتا، اور بیج ہی برتا جاتا ہے؛ دوسرے درجے میں گرم خشک، خشک تیسرے میں اور جنگلی چوتھے میں، جیسا کہ کہا جاتا ہے؛ کاٹنے، گھلانے اور منتشر کرنے والا اور رگوں کو صاف کرنے والا؛ کتاب اسے برص، مسوں، ثعلب، فالج، عرق النسا، سر درد، کان کے درد، کمزور نظر، سینے کے درد، استسقا، قولنج اور کیڑوں کے لیے گنواتی ہے، زہروں کا مقابلہ کرتا ہے، جبکہ جنگلی کا زیادہ کھانا مہلک ہے، اور منی، باہ اور رحم کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.600}۔"
  es: "Sadhab está en el libro de una especie de jardín, una especie silvestre y una especie de montaña, la de montaña más afilada y picante y no se come, siendo la semilla lo que se usa; caliente y seca en el segundo grado, la seca caliente y seca en el tercero y la silvestre en el cuarto, como se dice; corta, disuelve y dispersa y limpia los vasos, y el libro la enumera para el vitíligo, verrugas, alopecia, parálisis, ciática, dolor de cabeza, dolor de oído, visión débil, dolor de pecho, hidropesía, cólicos y gusanos, resistencia a venenos, mientras que gran parte de la especie silvestre es mortal, con una lista etiquetada sobre el semen, el deseo y el útero {cite:canon-ibn-sina-print-v1 p.600}."
  fr: "Le livre mentionne trois espèces de Sadhab: une espèce de jardin, une espèce sauvage et une espèce de montagne. Cette dernière, plus piquante et plus acérée, n'est pas consommée, seules ses graines sont utilisées. Elle est dite chaude et sèche au deuxième degré, la sèche chaude et sèche au troisième, et l'espèce sauvage au quatrième. Elle coupe, dissout, disperse et purifie les vaisseaux. Le livre la mentionne pour le vitiligo, les verrues, l'alopécie, la paralysie, la sciatique, les maux de tête, les otites, la faiblesse de la vue, les douleurs thoraciques, l'hydropisie, les coliques et les vers, et elle résiste aux poisons. En revanche, une grande partie de l'espèce sauvage est mortelle, avec une mention spécifique concernant le sperme, le désir et l'utérus {cite:canon-ibn-sina-print-v1 p.600}."
