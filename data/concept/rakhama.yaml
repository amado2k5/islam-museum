summary:
  ar: "الرخمة في الكتاب يقطر من مرارتها مع دهن البنفسج للشقيقة ووجع الأذن، ويكتحل بالمرارة لبياض العين، وينقل عن ابن البطريق أن المرارة المجففة تكتحل لنهشة الأفعى فيرد المؤلف ذلك بأنه لا يصدقه، ويذكر الكتاب نقلا موسوما عن الجنين وزبلها {cite:canon-ibn-sina-print-v1 p.668}"
  en: "Rakhama is in the book an animal whose gall is dropped with violet oil for migraine and earache, and is used as kohl for the white of the eye; it reports from Ibn al-Batriq that the dried gall is used as kohl for the bite of the viper, and the author answers that he does not credit it; the book also lists, as a labelled report on the foetus, something about its droppings {cite:canon-ibn-sina-print-v1 p.668}"
  ur: "رخمہ کتاب میں ایک جانور ہے جس کی پتے کی تھیلی کا مادہ بنفشے کے تیل کے ساتھ آدھے سر کے درد اور کان کے درد کے لیے ٹپکایا جاتا ہے، اور آنکھ کی سفیدی کے لیے سرمے کی طرح لگایا جاتا ہے؛ ابن البطریق سے نقل ہے کہ خشک کیا ہوا مادہ افعی کے ڈنک کے لیے لگایا جائے، اور مصنف جواب دیتا ہے کہ وہ اسے نہیں مانتا؛ کتاب جنین سے متعلق منقول فہرست کے طور پر اس کی بیٹ کے بارے میں بھی ایک بات درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.668}۔"
  es: "En el libro, Rakhama es un animal cuya bilis se expulsa con aceite de violeta para la migraña y el dolor de oído, y se usa como kohl para la esclerótica; se informa que Ibn al-Batriq dice que la bilis seca se usa como kohl para la mordedura de la víbora, y el autor responde que no lo cree; el libro también incluye, como un informe etiquetado sobre el feto, algo sobre sus excrementos {cite:canon-ibn-sina-print-v1 p.668}"
