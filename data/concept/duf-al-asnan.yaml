label:
  ar: ضعف الأسنان
  en: The weakness of the teeth
  ur: دانتوں کی کمزوری
  es: "La debilidad de los dientes"
  fr: "La fragilité des dents"
summary:
  ar: لضعف الأسنان ينفع القوابض المذكورة من هذا الجنس والسنونات الفاضلة ويصف لذلك سنونات جيدة ⁦(الأسماء والمقادير مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.279}
  en: For the teeth's weakness the named astringents of this kind help, and the excellent dentifrices — he gives several good dentifrice (sanun) recipes for it (names and measures left out) {cite:canon-ibn-sina-print-v2 p.279}
  ur: دانتوں کی کمزوری میں مذکورہ قابض اسی جنس کی سودا کرتی ہیں اور بہترین سنونات بھی، جس کے لیے وہ کئی اچھے سنون کے نسخے بیان کرتا ہے ⁦(نام اور مقداریں مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.279}
  es: "Para la debilidad de los dientes ayudan los astringentes de este tipo mencionados, y los excelentes dentífricos; él proporciona varias buenas recetas de dentífricos (sanun) para ello (se omiten nombres y medidas) {cite:canon-ibn-sina-print-v2 p.279}"
  fr: "Pour la faiblesse des dents, les astringents de ce genre mentionnés sont utiles, ainsi que les excellents dentifrices — il donne plusieurs bonnes recettes de dentifrice (sanun) (noms et quantités omis) {cite:canon-ibn-sina-print-v2 p.279}"
