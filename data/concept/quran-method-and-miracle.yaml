issue:
  ar: "ما الفرق بين منهج الرسالة ومعجزتها في القرآن وفي رسالات سابقة؟"
  en: "How do a message's method and its miracle relate, and how does the Quran differ from earlier revelations?"
perspectives:
  - tradition: sunni
    id: sharawi-method-and-miracle
    stance:
      ar: "المنهج والمعجزة واحد في القرآن، وهو باقٍ"
      en: "In the Quran the method and the miracle are one, and both remain"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن معجزات الرسل السابقين كانت حسية ومنهجهم شيء آخر، أما القرآن فمنهجه ومعجزته معاً، فيستطيع كل تابع أن يقول إن محمداً رسول الله وهذه معجزته {cite:tafsir-sharawi-khawatir-scan p.17}."
      en: "Sha'rawi says the earlier messengers had a method and a separate, sensory miracle, while the Quran is method and miracle together, so every follower can say that Muhammad is the messenger of God and that this is his miracle {cite:tafsir-sharawi-khawatir-scan p.17}."
