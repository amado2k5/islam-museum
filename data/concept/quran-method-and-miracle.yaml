id: concept/quran-method-and-miracle
class: concept
kind: doctrine
label: { ar: "القرآن منهجٌ ومعجزةٌ معاً", en: "The Quran as method and miracle at once" }
summary:
  ar: "يرى الشعراوي أن القرآن تميّز عن الرسالات السابقة بأن المنهج والمعجزة فيه شيء واحد، فقد أُنزلت المناهج السابقة على نية التغيير، وكانت معجزات الرسل حسية تنقضي بانقضاء من رآها، أما القرآن فأُنزل على نية الثبات إلى يوم القيامة فاقتضى أن تكون معجزته باقية مع منهجه {cite:tafsir-sharawi-khawatir-scan p.16} {cite:tafsir-sharawi-khawatir-scan p.17}. هذا رأيه وينسب إليه، ولم تُعرض بعد آراء غيره في المسألة."
  en: "Sha'rawi holds that the Quran differs from earlier revelations in that its method and its miracle are one. The earlier methods were sent with the intention that they would be changed, and the miracles of earlier messengers were sensory and ended with those who saw them; the Quran was sent with the intention of lasting until the Day of Resurrection, so its miracle lasts with its method {cite:tafsir-sharawi-khawatir-scan p.16} {cite:tafsir-sharawi-khawatir-scan p.17}. This is his view and is attributed to him; the views of other commentators are not yet presented."
