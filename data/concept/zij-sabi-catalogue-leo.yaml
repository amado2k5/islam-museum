summary:
  ar: "يذكر الفهرس كواكب صورة الأسد، ويضيف إليها في الصفحة نفسها كواكب الذؤابة، ويقول النص إنها ليست من صورة الأسد. {cite:zij-sabi-nallino-byblion pp.258}"
  en: "The catalogue gives the stars of the figure of al-Asad, the Lion, and on the same page adds the stars of the Tuft, al-Dhu'aba, which the text says are not part of the Lion's figure. {cite:zij-sabi-nallino-byblion pp.258}"
  ur: "فہرست اسد یعنی شیر کی صورت کے ستارے دیتی ہے، اور اسی صفحے پر ذؤابہ کے ستارے بھی، جن کے بارے میں متن کہتا ہے کہ وہ اسد کی صورت کا حصہ نہیں۔ {cite:zij-sabi-nallino-byblion pp.258}"
  es: "El catálogo incluye las estrellas de la figura de al-Asad, el León, y en la misma página añade las estrellas del Mechón, al-Dhu'aba, que según el texto no forman parte de la figura del León. {cite:zij-sabi-nallino-byblion pp.258}"
  fr: "Le catalogue donne les étoiles de la figure d'al-Asad, le Lion, et sur la même page ajoute les étoiles du Touffe, al-Dhu'aba, qui, selon le texte, ne font pas partie de la figure du Lion. {cite:zij-sabi-nallino-byblion pp.258}"
