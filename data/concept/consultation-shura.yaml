id: concept/consultation-shura
class: concept
kind: ethical
label:
  ar: "الشُّورى"
  en: "Shura (consultation: its ruling, the Prophet's consultation, consultation of judges, the duty of the adviser, and the succession by council)"
summary:
  ar: "الشورى مراجعة الرأي وطلبه، ويختلف الفقهاء في حكمها: فالنووي وابن عطية وغيرهما يرون وجوبها، ويراها آخرون مندوبة. وشاور النبي أصحابه فيما ليس فيه نص، كالأذان ومكائد الحروب وأسارى بدر، ولا تكون المشاورة فيما فيه نص. وللقاضي أن يستشير فيما اختلف فيه الفقهاء، ولا يلزمه رأي المستشارين. وعلى المستشار أن يصدق في مشورته، فيذكر المحاسن والمساوئ. وجاز للإمام أن يجعل الأمر شورى بين عدد محصور، كما فعل عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10255} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10256}"
  en: "Shura is seeking and reviewing opinion. The jurists differ on its ruling: al-Nawawi and Ibn 'Atiyya hold it obligatory, others recommended. The Prophet consulted his companions in matters without a text, such as the call to prayer, war stratagems and the captives of Badr, but not where the law is clear. A judge may consult on points on which the jurists differ, and is not bound to the advice he receives. The adviser must be sincere, naming the good and the faults, including faults that make a marriage or partnership unlawful. The head of state may make succession a matter for a fixed council, as 'Umar did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10255} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10256}"
