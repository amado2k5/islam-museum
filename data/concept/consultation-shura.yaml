id: concept/consultation-shura
class: concept
kind: ethical
label:
  ar: "الشُّورى"
  en: "Shura (consultation: its ruling, the Prophet's consultation, consultation of judges, the duty of the adviser, and the succession by council)"
  es: "Shura (consulta: su dictamen, la consulta del Profeta, la consulta de los jueces, el deber del consejero y la sucesión por consejo)"
  fr: "La Shura (consultation: son jugement, la consultation du Prophète, la consultation des juges, le devoir du conseiller et la succession par le conseil)"
  ur: "شوریٰ ⁦(مشاورت: اس کا حکم، نبی کی مشاورت، ججوں کی مشاورت، مشیر کا فرض، اور کونسل کی جانشینی)⁩"
summary:
  ar: "الشورى مراجعة الرأي وطلبه، ويختلف الفقهاء في حكمها: فالنووي وابن عطية وغيرهما يرون وجوبها، ويراها آخرون مندوبة. وشاور النبي أصحابه فيما ليس فيه نص، كالأذان ومكائد الحروب وأسارى بدر، ولا تكون المشاورة فيما فيه نص. وللقاضي أن يستشير فيما اختلف فيه الفقهاء، ولا يلزمه رأي المستشارين. وعلى المستشار أن يصدق في مشورته، فيذكر المحاسن والمساوئ. وجاز للإمام أن يجعل الأمر شورى بين عدد محصور، كما فعل عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10255} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10256}"
  en: "Shura is seeking and reviewing opinion. The jurists differ on its ruling: al-Nawawi and Ibn 'Atiyya hold it obligatory, others recommended. The Prophet consulted his companions in matters without a text, such as the call to prayer, war stratagems and the captives of Badr, but not where the law is clear. A judge may consult on points on which the jurists differ, and is not bound to the advice he receives. The adviser must be sincere, naming the good and the faults, including faults that make a marriage or partnership unlawful. The head of state may make succession a matter for a fixed council, as 'Umar did. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10255} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10256}"
  es: "Shura busca y revisa opiniones. Los juristas difieren en su dictamen: al-Nawawi e Ibn 'Atiyya la consideran obligatoria, otros la recomiendan. El Profeta consultó a sus compañeros en asuntos sin texto sagrado, como la llamada a la oración, las estrategias de guerra y los cautivos de Badr, pero no cuando la ley es clara. Un juez puede consultar sobre puntos en los que los juristas difieren y no está obligado por el consejo que recibe. El consejero debe ser sincero, nombrando tanto los aciertos como los errores, incluyendo aquellos que hacen ilícito un matrimonio o una unión. El jefe de Estado puede convertir la sucesión en un asunto de un consejo fijo, como hizo 'Umar. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10251} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10252} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10253} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10254} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10255} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10256}"
  fr: "La Shura sollicite et examine les avis juridiques. Les juristes divergent quant à son application: al-Nawawi et Ibn 'Atiyya la considèrent comme obligatoire, tandis que d'autres la recommandent. Le Prophète consultait ses compagnons sur les questions non textuelles, telles que l'appel à la prière, les stratégies militaires et le sort des captifs de Badr, mais pas lorsque la loi est claire. Un juge peut consulter sur les points de divergence entre les juristes et n'est pas tenu de suivre l'avis reçu. Le conseiller doit être sincère, en mentionnant les points positifs et négatifs, y compris ceux qui rendent un mariage ou une association illicite. Le chef de l'État peut confier la succession à un conseil permanent, comme l'a fait 'Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10255} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10256}"
  ur: "شوری رائے کی تلاش اور جائزہ لے رہی ہے۔ اس کے حکم میں فقہاء کا اختلاف ہے: النووی اور ابن عطیہ نے اسے واجب قرار دیا ہے، دوسروں نے اس کی سفارش کی ہے۔ نبی نے اپنے صحابہ سے بغیر کسی متن کے معاملات میں مشورہ کیا، جیسے کہ اذان، جنگی حکمت عملی اور بدر کے قیدی، لیکن جہاں قانون واضح نہ ہو۔ ایک جج ان نکات پر مشورہ کر سکتا ہے جن پر فقہا کا اختلاف ہے، اور وہ اس مشورے کا پابند نہیں ہے جو اسے ملتا ہے۔ مشیر کو مخلص ہونا چاہیے، اچھے اور عیوب کا نام دینا، بشمول وہ خرابیاں جو شادی یا شراکت کو غیر قانونی بناتی ہیں۔ ریاست کا سربراہ ایک مقررہ کونسل کے لیے جانشینی کا معاملہ بنا سکتا ہے، جیسا کہ عمر نے کیا تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10251} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10252} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10253} p.10254} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ10255} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ10256}"
