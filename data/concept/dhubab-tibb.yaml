summary:
  ar: "ذباب في الكتاب مدخل قصير ينقل عن عيسى أنه جربه مرارا فوجده نافعا، إذا دلك الذباب على لسع العقرب نفع نفعا بينا؛ نقل منسوب إلى الكتاب بلا توصية {cite:canon-ibn-sina-print-v1 p.720}"
  en: "Dhubab is in the book a short entry that reports from Isa that he tried it repeatedly and found it beneficial, that when flies are rubbed on the sting of a scorpion it benefits clearly; a report attributed to the book, without recommendation {cite:canon-ibn-sina-print-v1 p.720}"
  ur: "ذباب کتاب میں ایک مختصر اندراج ہے جو عیسیٰ سے نقل کرتا ہے کہ اس نے اسے بار بار آزمایا اور نافع پایا، کہ جب مکھیوں کو بچھو کے ڈنک پر ملا جائے تو واضح فائدہ ہوتا ہے؛ کتاب سے منسوب نقل، بلا سفارش {cite:canon-ibn-sina-print-v1 p.720}۔"
  es: "Dhubab es en el libro una breve entrada que informa que Isa lo probó repetidamente y lo encontró beneficioso, que cuando se frotan moscas en el aguijón de un escorpión, claramente es beneficioso; un informe atribuido al libro, sin recomendación {cite:canon-ibn-sina-print-v1 p.720}"
