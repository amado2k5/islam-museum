id: concept/adam-before-adam-in-later-readings
class: concept
kind: term
label: { ar: "آدم قبل آدم في القراءات المتأخرة", en: "An Adam before Adam in later readings", fr: "Un Adam avant Adam dans des lectures tardives", ur: "متاخر قراءات میں آدم سے پہلے آدم", es: "Un Adán antes de Adán en lecturas posteriores", tr: "Adem'den önceki okumalarda", id: "Adam sebelum Adam dalam bacaan selanjutnya" }
summary:
  ar: "في تفسير المنار عند [[passage/quran-4-1|النساء 1]] ينقل رشيد رضا عن الألوسي في روح المعاني أن الإمامية والصوفية نُقل عنهم وجود آدمين كثيرين قبل آدم المعروف، ومنه ما ينسب إلى ابن عربي في الفتوحات مما يقتضي بظاهره آدم آخر قبل آدم بأربعين ألف سنة؛ ثم يذكر رأي محمد عبده أنه ليس في القرآن نص قاطع على أن البشر كلهم من ذرية آدم {cite:tafsir-manar-v04 pp. 264-265}. وهي آراء صوفية وإمامية وحديثة تُعرض بنسبتها، لا حكم فيها."
  en: "In Tafsir al-Manar on [[passage/quran-4-1|al-Nisa 4:1]], Rashid Rida relays from al-Alusi's Ruh al-Ma'ani that the Imamis and the Sufis are reported to have spoken of many Adams before the Adam known to the People of the Book, including what is attributed to Ibn Arabi in the Futuhat, which on its face implies another Adam forty thousand years earlier; he then gives Muhammad Abduh's view that the Qur'an has no decisive text that all humans descend from Adam {cite:tafsir-manar-v04 pp. 264-265}. These are Sufi, Imami and modern views, set out with their attribution and without a verdict."
  fr: "Dans le Tafsir al-Manar, à propos de [[passage/quran-4-1|al-Nisa 4:1]], Rashid Rida rapporte d’après le Ruh al-Ma’ani d’al-Alusi que les imamites et les soufis auraient évoqué de nombreux Adams avant celui que connaissent les gens du Livre. Il cite notamment ce qui est attribué à Ibn Arabi dans les Futuhat et qui, à première vue, suppose qu’un autre Adam aurait vécu quarante mille ans plus tôt. Il donne ensuite l’avis de Muhammad Abduh : aucun texte décisif du Coran n’établit que tous les humains descendent d’Adam {cite:tafsir-manar-v04 pp. 264-265}. Ces lectures soufies, imamites et modernes sont présentées avec leur attribution, sans trancher entre elles."
  ur: "تفسیر المنار میں [[passage/quran-4-1|النساء 4:1]] کے تحت رشید رضا آلوسی کی روح المعانی سے نقل کرتے ہیں کہ امامیہ اور صوفیہ سے مشہور آدم سے پہلے بہت سے آدموں کا ذکر منقول ہے، جن میں ابن عربی سے فتوحات کی وہ بات بھی ہے جو ظاہراً چالیس ہزار سال پہلے ایک اور آدم کا تقاضا کرتی ہے؛ پھر محمد عبدہ کی یہ رائے لاتے ہیں کہ قرآن میں کوئی قطعی نص نہیں کہ تمام انسان آدم کی اولاد ہیں {cite:tafsir-manar-v04 pp. 264-265}۔ یہ صوفی، امامی اور جدید آراء ہیں جو نسبت کے ساتھ پیش کی گئی ہیں، بغیر فیصلے کے۔"
  es: "En Tafsir al-Manar sobre [[passage/quran-4-1|al-Nisa 4:1]], Rashid Rida relata de Ruh al-Ma'ani de al-Alusi que se dice que los imamíes y los sufíes hablaron de muchos Adanes antes del Adán conocido por la Gente del Libro, incluyendo lo que se atribuye a Ibn Arabi en el Futuhat, lo cual a primera vista implica otro Adán cuarenta mil años antes; luego presenta la opinión de Muhammad Abduh de que el Corán no tiene un texto decisivo que indique que todos los humanos descienden de Adán {cite:tafsir-manar-v04 pp. 264-265}. Estas son opiniones sufíes, imamíes y modernas, expuestas con su atribución y sin un veredicto."
  tr: "Tefsir-el-Manar'da [[pasaj/kuran-4-1|An-Nisa 1]'de, Raşid Rida, Ruh al-Ma'ani'de El-Alusi'den alıntı yapar; İmamiyye ve Sufiler, bilinen Adem'den önce birçok insanın varlığını onlardan bildirmiştir ve bazıları fetihlerde İbn Arapi'ye atfedilir; bu da görünüşe göre Adem'den kırk bin yıl önce başka bir Adem'i ima eder; ardından Muhammed Abduh'un, Kur'an'da tüm insanların Adem'in soyundan geldiğine dair kesin bir metin olmadığı görüşünden bahseder {cite:tafsir-manar-v04 s. 264-265}. Bunlar, atıf yoluyla sunulan Sufi, İmam ve Hadis görüşleridir ve üzerinde herhangi bir hükmü yoktur."
  id: "Dalam Tafsir al-Manar di [[passage/quran-4-1|An-Nisa 1]], Rashid Rida mengutip dari Al-Alusi dalam Ruh al-Ma'ani bahwa Imamiyyah dan para Sufi melaporkan dari mereka keberadaan banyak manusia sebelum Adam yang dikenal, dan beberapa dikaitkan dengan Ibn Arabi dalam penaklukan, yang tampaknya mengisyaratkan Adam lain empat puluh ribu tahun sebelum Adam; kemudian ia menyebutkan pendapat Muhammad Abduh bahwa tidak ada teks pasti dalam Al-Qur'an bahwa semua manusia adalah keturunan Adam {cite:tafsir-manar-v04 hlm. 264-265}. Ini adalah pendapat Sufi, Imami, dan Hadis yang disampaikan melalui atribusi mereka, tanpa ada keputusan apa pun yang ditetapkan."
