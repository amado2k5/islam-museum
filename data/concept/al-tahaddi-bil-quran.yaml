id: concept/al-tahaddi-bil-quran
class: concept
kind: doctrine
label:
  ar: "التحدي بالقرآن"
  en: "The Quranic challenge (al-tahaddi bil-Quran)"
  ur: "قرآن کا چیلنج"
summary:
  ar: "يعرض الشعراوي التحدي في قوله تعالى «فأتوا بسورة من مثله»، ويرى أن الله تدرج فيه من مثل القرآن كله، إلى عشر سور، إلى سورة واحدة، وأنه طلب المثيل لا النص، وأذن لهم أن يستعينوا بشهداء من دون الله، وأن الإعجاز ليس في الاستبعاد وإنما في عجز الخلق. ويقرر أن الحكم بعدم الإتيان ثابت، وأن الشك الذي يبررون به مفتعل {cite:tafsir-sharawi-khawatir-scan p.192} {cite:tafsir-sharawi-khawatir-scan p.197} {cite:tafsir-sharawi-khawatir-scan p.198} {cite:tafsir-sharawi-khawatir-scan p.200}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi presents the challenge in 'bring a surah like it', and holds that God graded it from the whole Quran, to ten surahs, to one surah, asking for a like rather than the same text, and allowing the challenged to call witnesses other than God. He holds that the verdict of their inability stands, and that the doubt they use to justify rejection is fabricated {cite:tafsir-sharawi-khawatir-scan p.192} {cite:tafsir-sharawi-khawatir-scan p.197} {cite:tafsir-sharawi-khawatir-scan p.198} {cite:tafsir-sharawi-khawatir-scan p.200}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی «فأتوا بسورة من مثله» کے چیلنج کو پیش کرتے ہیں، اور کہتے ہیں کہ اللہ نے اسے پورے قرآن سے دس سورتوں تک اور پھر ایک سورت تک درجہ بدرجہ رکھا، اور نص کی بجائے مثل مانگا، اور مخالفین کو اللہ کے سوا گواہ بلانے کی اجازت دی۔ ان کے نزدیک نہ لا سکنے کا فیصلہ قائم ہے، اور جس شک کو وہ انکار کا جواز بناتے ہیں وہ گھڑا ہوا ہے {cite:tafsir-sharawi-khawatir-scan p.192} {cite:tafsir-sharawi-khawatir-scan p.197} {cite:tafsir-sharawi-khawatir-scan p.198} {cite:tafsir-sharawi-khawatir-scan p.200}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
wings: [ideas]
