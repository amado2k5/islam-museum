periods: [period/prophetic-era]
issue:
  ar: "ما معنى التحدي بالمثل، ولماذا تدرج التحدي من القرآن كله إلى سورة واحدة؟"
  en: "What does the challenge to produce a like mean, and why did it narrow from the whole Quran to one surah?"
  ur: "مثل لانے کے چیلنج کا کیا مطلب ہے، اور یہ پورے قرآن سے ایک سورت تک کیوں سکڑا؟"
perspectives:
  - tradition: sunni
    id: sharawi-tahaddi
    stance:
      ar: "التحدي ثابت، والعجز عنه دليل على إعجاز القرآن"
      en: "The challenge stands, and the inability to meet it shows the Quran's inimitability"
      ur: "چیلنج قائم ہے، اور اس کا جواب نہ دے سکنا قرآن کے اعجاز کی دلیل ہے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الله طلب المثيل لا النص، وأن الكفار عاجزون، وأن الشك في القرآن مفتعل {cite:tafsir-sharawi-khawatir-scan p.198} {cite:tafsir-sharawi-khawatir-scan p.200}."
      en: "Sha'rawi holds that God asked for a like and not the same text, that the disbelievers are unable, and that their doubt is contrived {cite:tafsir-sharawi-khawatir-scan p.198} {cite:tafsir-sharawi-khawatir-scan p.200}."
      ur: "شعراوی کے مطابق اللہ نے نص نہیں بلکہ مثل مانگا، کفار عاجز ہیں، اور ان کا شک گھڑا ہوا ہے {cite:tafsir-sharawi-khawatir-scan p.198} {cite:tafsir-sharawi-khawatir-scan p.200}۔"
