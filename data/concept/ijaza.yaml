id: concept/ijaza
class: concept
kind: legal
label: { ar: "إجازة", en: "Ratification, licence (ijaza)" }
summary:
  ar: "الإجازة في اللغة الإنفاذ، وهي عند الفقهاء إنفاذ تصرف صدر من غير مالك أو من غير ولي، ولا تكون إلا لاحقة للتصرف، بخلاف الإذن الذي يكون سابقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1576} ومن أركانها أن يكون المجاز تصرفه معروفاً، وأن يكون المجيز مالكاً للتصرف، وأن يعلم ببقاء محل التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1577} وتكون الإجازة بالقول، أو بالفعل، أو بمضي المدة في التصرفات الموقوتة، أو بالقرائن القوية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1581} وتطلق الإجازة أيضاً على العطية، وعلى الإذن بالإفتاء أو التدريس، وعلى الإذن بالرواية، وهي عند جماهير أهل الحديث جائزة ويجب العمل بالمروي بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1583}"
  en: "Ijaza in the lexicon means to put into effect. For jurists it is the ratification of a transaction made by someone who lacked the right to make it, and it always follows the act, unlike permission (idhn), which comes before it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1576} Its elements are a transaction that can be ratified, a ratifier who has the power to dispose of the matter, and knowledge that the object of the transaction still exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1577} Ratification may be by word, by act, by the passage of a fixed period in a time-limited transaction, or by strong circumstantial signs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1581} The word also means a gift from a ruler, licence to issue fatwas or teach, and permission to transmit a report; the majority of hadith scholars allow transmission by licence and hold that the transmitted report must be acted on. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1583}"
