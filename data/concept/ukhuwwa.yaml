label:
  ar: الأخوة الإسلامية
  en: Muslim brotherhood
summary:
  ar: "الأخوة بين المسلمين في الحديث الخامس والثلاثين من الأربعين: «كونوا عباد الله إخواناً، المسلم أخو المسلم لا يظلمه ولا يخذله ولا يكذبه ولا يحقره» ثم تحريم دمه وماله وعرضه بعضهم على بعض — فهي أخوة تحفظ الحقوق لا مجرد شعور: تنهي عن الحسد والنجش والتباغض والتدابر والبيع على بيع الأخ؛ وفي حديث ابن عمر — الحديث السابع والثلاثين — «من كان في حاجة أخيه كان الله في حاجته» وكفى بالمسلم شراً أن يحقر أخاه، وحقق ابن رجب في شرحه أن الإخاء شرطه كمال في إيثار الأخ ومحبته وتفقد حاله (جامع العلوم والحكم ص 710–711). وفي صحيح مسلم من حديث أبي موسى «المؤمن للمؤمن كالبنيان يشد بعضه بعضاً» {cite:sahih-muslim 2585} ومن حديث النعمان بن بشير «مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد» {cite:sahih-muslim 2586}."
  en: "The brotherhood between Muslims in the thirty-fifth hadith of the Forty: 'be servants of God, brothers — a Muslim is a Muslim's brother, he does not wrong him, fail him, lie to him or despise him', followed by the prohibition of each one's blood, property and honour for another — a brotherhood that preserves rights, not a mere sentiment, forbidding envy, artificial bidding, mutual hatred, turning away and selling upon a brother's sale; and in Ibn Umar's hadith — the thirty-seventh — 'whoever attends to his brother's need, God attends to his need', while despising a Muslim brother is declared 'enough evil' — in his commentary Ibn Rajab develops brotherhood as requiring preferring one's brother, loving him and looking to his state (Jami' al-Ulum wal-Hikam pp. 710–711)."
