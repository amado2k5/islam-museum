id: concept/ukhuwwa
class: concept
kind: social
label:
  ar: الأخوة الإسلامية
  en: Muslim brotherhood
  es: "Hermandad musulmana"
  fr: "Frères musulmans"
  ur: "مسلم بھائی چارہ"
summary:
  ar: "الأخوة بين المسلمين في الحديث الخامس والثلاثين من الأربعين: «كونوا عباد الله إخواناً، المسلم أخو المسلم لا يظلمه ولا يخذله ولا يكذبه ولا يحقره» ثم تحريم دمه وماله وعرضه بعضهم على بعض — فهي أخوة تحفظ الحقوق لا مجرد شعور: تنهي عن الحسد والنجش والتباغض والتدابر والبيع على بيع الأخ؛ وفي حديث ابن عمر — الحديث السابع والثلاثين — «من كان في حاجة أخيه كان الله في حاجته» وكفى بالمسلم شراً أن يحقر أخاه، وحقق ابن رجب في شرحه أن الإخاء شرطه كمال في إيثار الأخ ومحبته وتفقد حاله ⁦(جامع العلوم والحكم ص 710–711)⁩. وفي صحيح مسلم من حديث أبي موسى «المؤمن للمؤمن كالبنيان يشد بعضه بعضاً» {cite:sahih-muslim 2585} ومن حديث النعمان بن بشير «مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد» {cite:sahih-muslim 2586}."
  en: "The brotherhood between Muslims in the thirty-fifth hadith of the Forty: 'be servants of God, brothers — a Muslim is a Muslim's brother, he does not wrong him, fail him, lie to him or despise him', followed by the prohibition of each one's blood, property and honour for another — a brotherhood that preserves rights, not a mere sentiment, forbidding envy, artificial bidding, mutual hatred, turning away and selling upon a brother's sale; and in Ibn Umar's hadith — the thirty-seventh — 'whoever attends to his brother's need, God attends to his need', while despising a Muslim brother is declared 'enough evil' — in his commentary Ibn Rajab develops brotherhood as requiring preferring one's brother, loving him and looking to his state (Jami' al-Ulum wal-Hikam pp. 710–711)."
  es: "La hermandad entre musulmanes en el hadiz número treinta y cinco de los Cuarenta: \"sed siervos de Dios, hermanos: un musulmán es hermano de otro musulmán, no le hace daño, no le falla, no le miente ni lo desprecia\", seguido de la prohibición de que cada uno interponga su sangre, propiedad y honor por otro: una hermandad que preserva los derechos, no un mero sentimiento, prohibiendo la envidia, las pujas artificiales, el odio mutuo, el desprecio y la venta de los bienes de un hermano; y en el hadiz de Ibn Umar, el número treinta y siete: \"quien atiende la necesidad de su hermano, Dios atiende la suya\", mientras que despreciar a un hermano musulmán se declara \"suficiente maldad\". En su comentario, Ibn Rajab desarrolla la hermandad como algo que requiere preferir al hermano, amarlo y velar por su estado (Jami' al-Ulum wal-Hikam, págs. 710-711)."
  fr: "La fraternité entre musulmans est évoquée dans le trente-cinquième hadith des Quarante: « Soyez serviteurs de Dieu, frères – un musulman est le frère d’un autre musulman; il ne lui fait pas de tort, ne le trahit pas, ne lui ment pas et ne le méprise pas », suivi de l’interdiction de partager le sang, les biens et l’honneur d’un frère avec un autre – une fraternité qui préserve les droits, et non un simple sentiment, interdisant l’envie, les surenchères artificielles, la haine mutuelle, le fait de se détourner de son frère et de vendre ce qu’il a vendu; et dans le hadith d’Ibn Umar – le trente-septième – « Quiconque prend soin du besoin de son frère, Dieu prend soin du sien », tandis que mépriser un frère musulman est déclaré « un mal suffisant » – dans son commentaire, Ibn Rajab développe la fraternité comme exigeant de préférer son frère, de l’aimer et de se soucier de son bien-être (Jami’ al-Ulum wal-Hikam pp. 710–711)."
  ur: "چالیسویں کی پینتیسویں حدیث میں مسلمانوں کے درمیان بھائی چارہ: 'خدا کے بندے بھائی بھائی بنو - مسلمان مسلمان کا بھائی ہے، وہ اس پر ظلم نہیں کرتا، اس سے جھوٹ نہیں بولتا، اس سے جھوٹ نہیں بولتا یا اسے حقیر نہیں سمجھتا'، اس کے بعد ہر ایک کے خون، جائیداد اور دوسرے کے لیے عزت کی ممانعت - ایک اخوت جو حقوق کا تحفظ کرتی ہے، نہ کہ محض رسم و رواج کے لیے۔ نفرت، منہ پھیرنا اور بھائی کی فروخت پر بیچنا؛ اور ابن عمر کی حدیث میں - سینتیسویں - 'جو اپنے بھائی کی ضرورت کو پورا کرتا ہے، خدا اس کی ضرورت کو پورا کرتا ہے'، جب کہ ایک مسلمان بھائی کو حقیر سمجھنے کو 'کافی برائی' قرار دیا گیا ہے - اپنی تفسیر میں ابن رجب نے بھائی چارے کو فروغ دینے کے لیے اپنے بھائی کو ترجیح دینے، اس سے محبت کرنے اور اس کی حالت کی طرف دیکھنے کی ضرورت قرار دیا ہے۔ 710-711)۔"
