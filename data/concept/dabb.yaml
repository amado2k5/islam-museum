summary:
  ar: "ضب في الكتاب غير الورل الموجود في بلادنا وإن كان يشبهه وقريب الأحوال والقوى منه، ويقل إلا في بادية العرب، ويطلى بعره على الكلف والنمش فينتفع، وزبله نافع لبياض العين ونزول الماء؛ نقل منسوب إلى الكتاب بلا توصية {cite:canon-ibn-sina-print-v1 p.722}"
  en: "Dabb is in the book other than the waral found in our lands although it resembles it and is close to it in conditions and powers, and it is scarce except in the desert of the Arabs; its droppings are applied to freckles and spots and benefit, and its dung is beneficial for whiteness of the eye and descent of water; a report attributed to the book, without recommendation {cite:canon-ibn-sina-print-v1 p.722}"
  ur: "ضب کتاب میں اس ورل سے الگ ہے جو ہمارے ملکوں میں پایا جاتا ہے اگرچہ وہ اس سے مشابہ ہے اور احوال اور قوتوں میں اس کے قریب ہے، اور عربوں کے بادیہ کے سوا کم ہوتا ہے؛ اس کی مینگنیاں جھائیوں اور دھبوں پر لگائی جاتی ہیں تو فائدہ ہوتا ہے، اور اس کی لید آنکھ کی سفیدی اور پانی اترنے میں نافع ہے؛ کتاب سے منسوب نقل، بلا سفارش {cite:canon-ibn-sina-print-v1 p.722}۔"
  es: "En el libro se menciona a Dabb, distinto del waral que se encuentra en nuestras tierras, aunque se asemeja a él y es similar en características y poderes, y es escaso excepto en el desierto de los árabes; sus excrementos se aplican a las pecas y manchas y son beneficiosos, y su estiércol es beneficioso para blanquear los ojos y favorecer la menstruación; un informe atribuido al libro, sin recomendación {cite:canon-ibn-sina-print-v1 p.722}"
  fr: "Le dabb est mentionné dans le livre, à l'exception du waral que l'on trouve sur nos terres, bien qu'il lui ressemble et soit proche de lui par ses caractéristiques et ses propriétés. Il est rare, sauf dans le désert arabe. Ses excréments sont appliqués sur les taches de rousseur et les imperfections et sont bénéfiques, et ses déjections sont bénéfiques pour blanchir les yeux et favoriser la descente d'eau. (Rapport attribué au livre, sans recommandation) {cite:canon-ibn-sina-print-v1 p.722}"
