summary:
  ar: 'البارئ: المنشئ لخلقه بلا مثال سابق. الاسم رقم 12 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Bari — The Maker. Name 12 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Bari — Celui qui façonne. Nom 12 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'البارئ: پیدا کرنے والا — جو اپنی مخلوق کو بغیر کسی نمونے کے بنائے۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 12۔'
  es: "al-Bari — El Hacedor. Nombre número 12 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Bari': Yaratılışının Yaratıcısı, önceden bir örnek olmadan Yaratıcısı. El-Tirmidi'nin Allah'ın En Güzel İsimleri hakkındaki hadislerinde bahsedilen sayımda 12 numaralı isimdir."
  id: "Al-Bari': Pencetus ciptaan-Nya tanpa contoh sebelumnya. Nama nomor 12 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Terindah Allah."
