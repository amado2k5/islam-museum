id: concept/iqtisar
class: concept
kind: legal
label: { ar: "اقتصار", en: "Iqtisar (a ruling taking effect only at the moment it arises)" }
summary:
  ar: "الاقتصار عند الفقهاء أن يثبت الحكم عند حدوث علته، لا قبل ذلك ولا بعده، كالطلاق المنجَّز، ويعرّفه ابن عابدين بأنه ثبوت الحكم في الحال. ومن طرق ثبوت الأحكام عند الحصكفي أربعة: الانقلاب والاقتصار والاستناد والتبيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3177} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3178} والاستناد له أثر رجعي بخلاف الاقتصار، وقد اقترح بعض الباحثين المعاصرين تسمية الحل في الاستناد فسخا وانفساخا، وفي الاقتصار إنهاء وانتهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3179} وفرّق الشافعية بين الفسخ الذي يرفع العقد من أصله والفسخ الذي يرفعه من حينه، ومثّلوا للثاني بفسخ البيع بخيار العيب والفلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180} ويشمل الاقتصار العقود المنجزة كالبيع والسلم والإجارة والقراض، والفسوخ المنجزة كالطلاق والعتاق، أما ما له أثر رجعي فيدخل في الاستناد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180}"
  en: "In the jurists' usage, iqtisar means that a ruling takes effect when its cause arises, and not before or after, as with an immediate divorce. Ibn 'Abidin defines it as the ruling taking effect now. The Hanafi scholar al-Haskafi lists four ways a ruling takes effect: inqilab (a non-cause becoming a cause), iqtisar, istinad (taking effect now and tracing back to an earlier time), and tabyin (showing that the ruling had held earlier). Istinad has retroactive effect, while iqtisar does not. Some modern writers propose the terms fasakh and infisakh for dissolution by istinad, and inha' and intiha' for dissolution by iqtisar. The Shafi'is distinguish between a dissolution that removes a contract from its origin and one that removes it from its time, the latter including dissolution for a defect or bankruptcy. Iqtisar covers immediate contracts such as sale, salam, hire and qirad, and immediate dissolutions such as divorce and manumission. Those with retroactive effect fall under istinad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3177} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180}"
