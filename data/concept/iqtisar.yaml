id: concept/iqtisar
class: concept
kind: legal
label: { ar: "اقتصار", en: "Iqtisar (a ruling taking effect only at the moment it arises)", es: "Iqtisar (una norma que entra en vigor solo en el momento en que surge)", fr: "Iqtisar (une décision qui ne prend effet qu'au moment où elle survient)" }
summary:
  ar: "الاقتصار عند الفقهاء أن يثبت الحكم عند حدوث علته، لا قبل ذلك ولا بعده، كالطلاق المنجَّز، ويعرّفه ابن عابدين بأنه ثبوت الحكم في الحال. ومن طرق ثبوت الأحكام عند الحصكفي أربعة: الانقلاب والاقتصار والاستناد والتبيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3177} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3178} والاستناد له أثر رجعي بخلاف الاقتصار، وقد اقترح بعض الباحثين المعاصرين تسمية الحل في الاستناد فسخا وانفساخا، وفي الاقتصار إنهاء وانتهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3179} وفرّق الشافعية بين الفسخ الذي يرفع العقد من أصله والفسخ الذي يرفعه من حينه، ومثّلوا للثاني بفسخ البيع بخيار العيب والفلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180} ويشمل الاقتصار العقود المنجزة كالبيع والسلم والإجارة والقراض، والفسوخ المنجزة كالطلاق والعتاق، أما ما له أثر رجعي فيدخل في الاستناد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180}"
  en: "In the jurists' usage, iqtisar means that a ruling takes effect when its cause arises, and not before or after, as with an immediate divorce. Ibn 'Abidin defines it as the ruling taking effect now. The Hanafi scholar al-Haskafi lists four ways a ruling takes effect: inqilab (a non-cause becoming a cause), iqtisar, istinad (taking effect now and tracing back to an earlier time), and tabyin (showing that the ruling had held earlier). Istinad has retroactive effect, while iqtisar does not. Some modern writers propose the terms fasakh and infisakh for dissolution by istinad, and inha' and intiha' for dissolution by iqtisar. The Shafi'is distinguish between a dissolution that removes a contract from its origin and one that removes it from its time, the latter including dissolution for a defect or bankruptcy. Iqtisar covers immediate contracts such as sale, salam, hire and qirad, and immediate dissolutions such as divorce and manumission. Those with retroactive effect fall under istinad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3177} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180}"
  es: "En el uso de los juristas, iqtisar significa que una resolución entra en vigor cuando surge su causa, y no antes ni después, como en el caso de un divorcio inmediato. Ibn 'Abidin la define como la resolución que entra en vigor ahora. El erudito hanafí al-Haskafi enumera cuatro formas en que una resolución entra en vigor: inqilab (una no-causa que se convierte en causa), iqtisar, istinad (entrada en vigor ahora y retroactividad a un momento anterior) y tabyin (demostración de que la resolución ya era válida anteriormente). Istinad tiene efecto retroactivo, mientras que iqtisar no. Algunos autores modernos proponen los términos fasakh e infisakh para la disolución por istinad, e inha' e intiha' para la disolución por iqtisar. Los shafi'íes distinguen entre una disolución que elimina un contrato de su origen y una que lo elimina de su tiempo, incluyendo esta última la disolución por defecto o quiebra. Iqtisar cubre contratos inmediatos como venta, salam, alquiler y qirad, y disoluciones inmediatas como divorcio y manumisión. Las que tienen efecto retroactivo se incluyen en la istinad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3177} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3178} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3179} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180}"
  fr: "Dans l'usage des juristes, l'iqtisar signifie qu'une décision prend effet au moment où sa cause survient, et non avant ou après, comme c'est le cas pour un divorce immédiat. Ibn 'Abidin la définit comme la décision prenant effet dès maintenant. Le savant hanafite al-Haskafi recense quatre modes d'application d'une décision: l'inqilab (une cause qui n'existait pas auparavant), l'iqtisar, l'istinad (application immédiate et rétroactivité), et le tabyin (preuve que la décision était déjà en vigueur). L'istinad a un effet rétroactif, contrairement à l'iqtisar. Certains auteurs modernes proposent les termes fasakh et infisakh pour la dissolution par istinad, et inha' et intiha' pour la dissolution par iqtisar. Les chaféites distinguent la dissolution qui annule un contrat à son origine de celle qui l'annule à son époque, cette dernière incluant la dissolution pour vice ou faillite. L'iqtisar couvre les contrats immédiats tels que la vente, le salam, la location et le qirad, ainsi que les dissolutions immédiates telles que le divorce et l'affranchissement. Ceux qui ont un effet rétroactif relèvent de l'istinad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3177} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3178} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3179} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3180}"
