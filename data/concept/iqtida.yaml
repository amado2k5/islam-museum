id: concept/iqtida
class: concept
kind: legal
label: { ar: "اقتداء", en: "Iqtida' (following an imam in prayer)", es: "Iqtida' (siguiendo a un imán en oración)", fr: "Iqtida' (suivre un imam dans la prière)", ur: "اقتداء ⁦(نماز میں امام کی اقتداء کرنا)⁩", tr: "Taklit", id: "Tiruan" }
summary:
  ar: "الاقتداء لغة الفعل مثل فعل الغير تأسيا، وعند الفقهاء في الصلاة متابعة المأموم الإمامَ في أفعال الصلاة، أو ربط صلاة المأموم بصلاة الإمام بشروط بينها الشرع. ويسمى الائتمام بمعناه في الصلاة، وهو أعم من الاقتداء عندهم لأنه يكون في الصلاة وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} وللاقتداء خارج الصلاة معنى التأسي، كاقتداء الأمة بالنبي في أقواله وأفعاله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} وتشترط عند الجمهور شروط للإمام، منها الإسلام والعقل والبلوغ، والسلامة من الأعذار الظاهرة لمن يقتدي به الأصحاء، ولا يصح اقتداء القوي بالضعيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3160} وتشترط للمقتدي النية، وألا يتقدم على إمامه في الموقف عند الجمهور، واتحاد صلاتيهما عند الجمهور خلافا للشافعية، وألا يفصل بينهما فاصل كبير، وأن يعلم انتقالات الإمام، وأن تكون صلاة الإمام صحيحة في نظر المقتدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3161} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3166} وتختلف الأحكام في اقتداء المتوضئ بالمتيمم، والمفترض بالمتنفل، والبالغ بالصبي، والمقيم بالمسافر، والسليم بالمعذور، والمكتسي بالعاري، والقادر بالعاجز، والفاسق، ومخالف الفروع، وتفصيلها في مواضعها من المسألة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3175} وتنقسم أحوال المقتدي إلى مدرك ومسبوق ولاحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3168} ومتابعة الإمام في الأفعال واجبة، ومقارنة المأموم للإمام في تكبيرة الإحرام تبطل الاقتداء عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3169}"
  en: "In the language, iqtida' means to act as someone acts, taking him as a model. In the jurists' usage in prayer it is the follower's following of the imam in the actions of the prayer, or the binding of the follower's prayer to the imam's under conditions the Law set out. The related term al-i'timam ⁦(ائتمام)⁩ has the same sense in prayer and is wider than iqtida' in their usage, since it applies to prayer and to other things. Outside prayer, iqtida' has the sense of imitation, as the community follows the Prophet in his words and deeds. The majority require conditions of the imam: Islam, reason, and puberty, and freedom from visible excuses when healthy people follow him; a stronger person may not follow a weaker one. The follower must intend to follow, must not stand ahead of the imam in place (the majority), must share the same prayer (the majority, against the Shafi'is), must not be separated by a large barrier, must know the imam's movements, and the imam's prayer must be valid in the follower's view. Rulings differ on following someone in a different state: a person who performed ablution behind one who performed dry ablution, a washer behind one who wiped, a fard prayer behind a supererogatory one, an adult behind a child, a resident behind a traveller, a clothed person behind a naked one, a capable person behind one unable to perform a pillar, a person behind a sinner, and a follower of one school behind an imam of another; the details are given where each case arises in the article. The follower is classed as one who catches the whole prayer with the imam (mudrik), one who misses some of it (masbuq), or one who falls behind the imam's movements (lahiq). Following the imam in actions is required, and joining him in the opening takbir in the majority view invalidates the follower's prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3169} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3175}"
  es: "En el idioma, iqtida' significa actuar como alguien actúa, tomándolo como modelo. En el uso que le dan los juristas a la oración, se refiere a que el seguidor imita al imán en los actos de la oración, o a que la oración del seguidor se supedita a la del imán bajo las condiciones establecidas por la Ley. El término relacionado al-i'timam ⁦(ائتمام)⁩ tiene el mismo sentido en la oración y es más amplio que iqtida' en su uso, ya que se aplica tanto a la oración como a otras cosas. Fuera de la oración, iqtida' tiene el sentido de imitación, ya que la comunidad sigue al Profeta en sus palabras y acciones. La mayoría exige que el imán cumpla con las condiciones: Islam, razón y madurez, y que no haya excusas visibles cuando personas sanas lo siguen; una persona más fuerte no puede seguir a una más débil. El seguidor debe tener la intención de seguir, no debe colocarse delante del imán en su lugar (la mayoría), debe compartir la misma oración (la mayoría, en contra de los shafi'ís), no debe estar separado por una gran barrera, debe conocer los movimientos del imán, y la oración del imán debe ser válida a juicio del seguidor. Las normas difieren en cuanto a seguir a alguien en un estado diferente: una persona que realizó la ablución detrás de alguien que realizó la ablución seca, un lavador detrás de alguien que se limpió, una oración obligatoria (fard) detrás de una supererogatoria, un adulto detrás de un niño, un residente detrás de un viajero, una persona vestida detrás de una desnuda, una persona capaz detrás de alguien incapaz de realizar un pilar, una persona detrás de un pecador, y un seguidor de una escuela detrás de un imán de otra; los detalles se dan donde surge cada caso en el artículo. El seguidor se clasifica como aquel que capta toda la oración con el imán (mudrik), aquel que se pierde parte de ella (masbuq), o aquel que se queda atrás en los movimientos del imán (lahiq). Según la opinión mayoritaria, es necesario seguir al imán en sus acciones, y unirse a él en el takbir inicial invalida la oración del seguidor. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3159} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3160} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3166} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3167} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3169} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3171} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3175}"
  fr: "Dans la langue, iqtida' signifie agir comme quelqu'un, en le prenant pour modèle. Dans l'usage juriste relatif à la prière, il désigne le fait pour le fidèle de suivre l'imam dans les rites, ou encore l'obligation pour le fidèle de lier sa prière à celle de l'imam selon les conditions établies par la Loi. Le terme apparenté al-i'timam ⁦(ائتمام)⁩ a le même sens dans le contexte de la prière et son usage est plus large qu'iqtida', puisqu'il s'applique à la prière et à d'autres domaines. En dehors de la prière, iqtida' a le sens d'imitation, la communauté suivant le Prophète dans ses paroles et ses actes. La majorité exige de l'imam qu'il soit musulman, raisonnable et mature, et qu'il ne présente aucun prétexte apparent lorsque des personnes saines le suivent; une personne forte ne peut suivre une personne plus faible. Le fidèle doit avoir l'intention de suivre l'imam, ne pas se placer devant lui (avis majoritaire), accomplir la même prière (avis majoritaire, contrairement à l'école shafi'ite), ne pas être séparé de lui par une barrière importante, connaître ses mouvements et la prière de l'imam doit être valide à ses yeux. Les règles divergent quant au fait de suivre une personne dans un état différent: une personne ayant accompli ses ablutions derrière une personne ayant accompli ses ablutions sèches, une personne ayant fait ses ablutions derrière une personne ayant essuyé ses mains, une prière obligatoire derrière une prière surérogatoire, un adulte derrière un enfant, un résident derrière un voyageur, une personne vêtue derrière une personne nue, une personne capable derrière une personne incapable d'accomplir un pilier, une personne derrière un pécheur, et un fidèle d'une école derrière un imam d'une autre; les détails sont fournis dans l'article lorsque chaque cas se présente. Le fidèle est classé comme celui qui accomplit la prière en entier avec l'imam (mudrik), celui qui en manque une partie (masbuq) ou celui qui est en retard sur les mouvements de l'imam (lahiq). Il est requis de suivre l'imam dans ses actions, et, selon l'avis majoritaire, le fait de se joindre à lui pour le takbir initial invalide la prière du fidèle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3169} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3175}"
  ur: "زبان میں اقتداء کا مطلب ہے وہ عمل کرنا جس طرح کوئی عمل کرتا ہے، اسے نمونہ بنا کر لے جانا۔ نماز میں فقہاء کے استعمال میں یہ ہے کہ پیروکار کا نماز کے اعمال میں امام کی پیروی، یا مقتدی کی نماز کو امام کی ان شرائط کے ساتھ پابند کرنا جو شریعت نے بیان کی ہیں۔ متعلقہ اصطلاح الاعتمام نماز میں ایک ہی معنی رکھتی ہے اور ان کے استعمال میں اقتداء سے زیادہ وسیع ہے، کیونکہ اس کا اطلاق نماز اور دیگر چیزوں پر ہوتا ہے۔ نماز سے باہر، اقتداء میں تقلید کا احساس ہوتا ہے، جیسا کہ معاشرہ اپنے قول و فعل میں پیغمبر کی پیروی کرتا ہے۔ اکثریت کو امام کی شرائط کی ضرورت ہوتی ہے: اسلام، عقل اور بلوغت، اور ظاہری عذر سے آزادی جب صحت مند لوگ اس کی پیروی کریں۔ ایک طاقتور شخص کمزور کی پیروی نہیں کرسکتا۔ مقتدی کو تقلید کا ارادہ کرنا چاہیے، امام کی جگہ ⁦(اکثریت)⁩ سے آگے نہیں کھڑا ہونا چاہیے، ایک ہی نماز میں شریک ہونا چاہیے ⁦(اکثریت، شافعیوں کے خلاف)⁩، کسی بڑی رکاوٹ سے الگ نہیں ہونا چاہیے، امام کی حرکات کا علم ہونا چاہیے، اور امام کی نماز مقتدی کے نزدیک صحیح ہونی چاہیے۔ مختلف حالتوں میں کسی کی اقتداء کرنے کے احکام مختلف ہیں: خشک وضو کرنے والے کے پیچھے وضو کرنے والا، مسح کرنے والے کے پیچھے دھونے والا، فرض نماز پڑھنے والے کے پیچھے، بالغ بچے کے پیچھے، مسافر کے پیچھے رہنے والا، کپڑے والے شخص کے پیچھے، برہنہ شخص کے پیچھے، استطاعت رکھنے والا ستون کے پیچھے، ایک امام کے پیچھے، امام کے پیچھے ایک شخص اور امام کے پیچھے۔ تفصیلات اس مضمون میں دی گئی ہیں جہاں ہر ایک کیس پیدا ہوتا ہے۔ مقتدی کا درجہ اس شخص کے طور پر ہے جو امام کے ساتھ پوری نماز پڑھتا ہے، اس میں سے کچھ ⁦(مسبوق)⁩ چھوٹ جاتا ہے، یا وہ جو امام کی حرکت ⁦(لحق)⁩ کے پیچھے پڑ جاتا ہے۔ اعمال میں امام کی اقتداء ضروری ہے اور جمہور کے نزدیک ابتدائی تکبیر میں اس کے ساتھ شامل ہونا مقتدی کی نماز کو باطل کر دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3157} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3158} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3159} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3158} صفحہ 3160} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3166} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3167} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3169} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3171}"
  tr: "Taklit, fiilin dilsel biçimidir ve başkalarının eylemine benzer ve hukukçulara göre, duada, dua sırasında takipçinin imama gitmesini veya takipçinin duasını şeriatta belirtilen koşullarla imamın duasına bağlamak anlamına gelir. Duadaki anlamı 'al-i'titam' olarak adlandırılır ve dua ve diğerlerinde geçtiği için imamı takip etmekten daha geniştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3158} Dua dışındaki taklit, örneğin milletin Peygamber'in sözleri ve eylemlerini takip etmesi gibi taklit anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3158} Çoğunluk, imam için İslam, akıl, ergenlik ve sağlıklı olanı takip edenler için görünürde mazeretlerden arınmış koşullar şart koşar. Güçlülerin zayıfı takip etmesi kabul edilemez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3160} Takipçinin niyeti (niyeti) olması gerektiğini, imamının önünde toplantıda çoğunlukla birlikte gelmemesini, dualarının cemaatte birleşmiş olmasını (Şafii'lerin aksine), aralarında önemli bir ayrım olmamasını, imamın hareketlerini bilmesini ve imamın namazının takipçinin gözünde doğru sayılmasını şart koşar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3161} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3166} Hükümler, abdest yapanın takliti ile tayammum yapan, zorunlu olan gönüllü uygulayıcı, yetişkin çocukla, yolcuyla birlikte olan, sağlıklı ile muaf tutulan, sağlıklı ile muaf olan, sağlam olan çıplak, engelli, günahkar ve dalları ihlal edenlerin hakkı konusunda kararlar farklılık gösterir ve bunlar ilgili yerlerinde ayrıntılı olarak belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3175} Takipçinin koşulları algılayan, önceden belirlenmiş ve sonuç olarak ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3168} İmamı eylemde takip etmek zorunludur ve İhramın açılış tekbirinde takipçiyi imamla karşılaştırmak, çoğunluğu takip etmeyi geçersiz kılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3169}"
  id: "Meniru adalah bentuk linguistik dari kata kerja, mirip dengan tindakan orang lain, dan menurut para ahli hukum, dalam doa berarti mengikuti pengikut kepada imam dalam tindakan shalat, atau mengaitkan shalat pengikut dengan shalat imam dengan syarat yang ditetapkan dalam Syariah. Disebut 'al-i'titam' dalam maknanya dalam doa, dan lebih luas daripada mengikuti imam karena terjadi dalam shalat dan lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3158} Meniru di luar shalat berarti meniru, seperti bangsa mengikuti Nabi dalam kata-kata dan tindakannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3158} Mayoritas mensyaratkan syarat bagi imam, termasuk Islam, intelek, pubertas, dan bebas dari alasan yang tampak bagi mereka yang mengikuti yang sehat. Tidak diperbolehkan bagi yang kuat mengikuti yang lemah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3160} Ketentuan ini menetapkan bahwa pengikut harus memiliki niat (niat), bahwa dia tidak boleh mendahului imamnya dalam pertemuan dengan mayoritas, bahwa shalat mereka harus bersatu dalam jamaah, berbeda dengan para Syafi, bahwa tidak boleh ada pemisahan signifikan di antara mereka, bahwa dia mengetahui gerakan imam, dan bahwa shalat imam dianggap benar di mata pengikut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3161} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3166} Putusan berbeda mengenai peniruan orang yang melakukan wudhu dengan yang melakukan tayammum, yang wajib dengan pelaku sukarela, orang dewasa dengan anak, yang tinggal bersama pengembara, yang sehat dengan yang dimaafkan, yang sehat dengan yang telanjang, yang mampu dengan yang cacat, yang berdosa, dan mereka yang melanggar ranting, dan semuanya dirinci di tempat-tempat masing-masing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3175} Kondisi pengikut dibagi menjadi perseptif, didahului, dan konsekuensi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3168} Mengikuti imam dalam tindakan adalah wajib, dan membandingkan pengikut dengan imam dalam takbir pembuka Ihram membatalkan mengikuti mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3169}"
