label: { ar: "اقتداء", en: "Iqtida' (following an imam in prayer)" }
summary:
  ar: "الاقتداء لغة الفعل مثل فعل الغير تأسيا، وعند الفقهاء في الصلاة متابعة المأموم الإمامَ في أفعال الصلاة، أو ربط صلاة المأموم بصلاة الإمام بشروط بينها الشرع. ويسمى الائتمام بمعناه في الصلاة، وهو أعم من الاقتداء عندهم لأنه يكون في الصلاة وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} وللاقتداء خارج الصلاة معنى التأسي، كاقتداء الأمة بالنبي في أقواله وأفعاله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} وتشترط عند الجمهور شروط للإمام، منها الإسلام والعقل والبلوغ، والسلامة من الأعذار الظاهرة لمن يقتدي به الأصحاء، ولا يصح اقتداء القوي بالضعيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3160} وتشترط للمقتدي النية، وألا يتقدم على إمامه في الموقف عند الجمهور، واتحاد صلاتيهما عند الجمهور خلافا للشافعية، وألا يفصل بينهما فاصل كبير، وأن يعلم انتقالات الإمام، وأن تكون صلاة الإمام صحيحة في نظر المقتدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3161} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3166} وتختلف الأحكام في اقتداء المتوضئ بالمتيمم، والمفترض بالمتنفل، والبالغ بالصبي، والمقيم بالمسافر، والسليم بالمعذور، والمكتسي بالعاري، والقادر بالعاجز، والفاسق، ومخالف الفروع، وتفصيلها في مواضعها من المسألة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3175} وتنقسم أحوال المقتدي إلى مدرك ومسبوق ولاحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3168} ومتابعة الإمام في الأفعال واجبة، ومقارنة المأموم للإمام في تكبيرة الإحرام تبطل الاقتداء عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3169}"
  en: "In the language, iqtida' means to act as someone acts, taking him as a model. In the jurists' usage in prayer it is the follower's following of the imam in the actions of the prayer, or the binding of the follower's prayer to the imam's under conditions the Law set out. The related term al-i'timam (ائتمام) has the same sense in prayer and is wider than iqtida' in their usage, since it applies to prayer and to other things. Outside prayer, iqtida' has the sense of imitation, as the community follows the Prophet in his words and deeds. The majority require conditions of the imam: Islam, reason, and puberty, and freedom from visible excuses when healthy people follow him; a stronger person may not follow a weaker one. The follower must intend to follow, must not stand ahead of the imam in place (the majority), must share the same prayer (the majority, against the Shafi'is), must not be separated by a large barrier, must know the imam's movements, and the imam's prayer must be valid in the follower's view. Rulings differ on following someone in a different state: a person who performed ablution behind one who performed dry ablution, a washer behind one who wiped, a fard prayer behind a supererogatory one, an adult behind a child, a resident behind a traveller, a clothed person behind a naked one, a capable person behind one unable to perform a pillar, a person behind a sinner, and a follower of one school behind an imam of another; the details are given where each case arises in the article. The follower is classed as one who catches the whole prayer with the imam (mudrik), one who misses some of it (masbuq), or one who falls behind the imam's movements (lahiq). Following the imam in actions is required, and joining him in the opening takbir in the majority view invalidates the follower's prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3166} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3167} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3169} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3171} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3175}"
