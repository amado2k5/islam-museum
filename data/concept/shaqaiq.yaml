  en: "Shaqa'iq (the shaqa'iq al-nu'man, per the editor's note)"
  ur: "شقائق"
  es: "Shaqa'iq (el shaqa'iq al-nu'man, según la nota del editor)"
summary:
  ar: "الشقائق في الكتاب صنفان بري وبستاني، ينقل عن ديسقوريدوس أن من الناس من يسميه أرميون وعامينون، وفي الحاشية أنه شقائق النعمان، حار في الثانية رطب جلاء محلل، وعند جالينوس جال غسال جاذب منضج، ويسود الشعر مع قشور الجوز، وينقي القروح الوسخة، وعصارته سعوط لتنقية الرأس، وتنفع من ظلمة العين، ويذكر الكتاب نقلا موسوما أنه يدر الطمث {cite:canon-ibn-sina-print-v1 pp.670-671}"
  en: "Shaqa'iq is in the book of two kinds, wild and garden; the book reports from Dioscorides that some people call it armiyun and also amiyun, and the editor's note says it is the shaqa'iq al-nu'man; it is hot in the second degree and moist, cleansing and dissolving, and for Galen cleansing, washing, drawing and ripening; it blackens the hair with walnut husks, cleans dirty ulcers, its juice is a snuff for cleansing the head, and it benefits dimness of the eye; the book also lists, as a labelled report, that it brings on the menses {cite:canon-ibn-sina-print-v1 pp.670-671}"
  ur: "شقائق کتاب میں دو قسم کی ہے، جنگلی اور باغی؛ کتاب دیسقوریدوس سے نقل کرتی ہے کہ بعض لوگ اسے ارمیون اور عامینون کہتے ہیں، اور حاشیے میں ہے کہ یہ شقائق النعمان ہے؛ دوسرے درجے میں گرم اور تر ہے، جلا دینے والی اور تحلیل کرنے والی، اور جالینوس کے نزدیک جلا دینے، دھونے، کھینچنے اور پکانے والی؛ اخروٹ کے چھلکوں کے ساتھ بالوں کو سیاہ کرتی ہے، میلے قرحوں کو صاف کرتی ہے، اس کا رس سر کی صفائی کے لیے نسوار ہے، اور آنکھ کی تاریکی میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ یہ حیض جاری کرتی ہے {cite:canon-ibn-sina-print-v1 pp.670-671}۔"
  es: "El shaqa'iq se encuentra en el libro en dos tipos: silvestre y de jardín; el libro informa, según Dioscórides, que algunas personas lo llaman armiyun y también amiyun, y la nota del editor dice que es el shaqa'iq al-nu'man; es caliente en segundo grado y húmedo, limpiador y disolvente, y para Galeno limpia, lava, extrae y madura; ennegrece el cabello con cáscaras de nuez, limpia úlceras sucias, su jugo es un rapé para limpiar la cabeza y beneficia la visión borrosa; el libro también enumera, como un informe etiquetado, que provoca la menstruación {cite:canon-ibn-sina-print-v1 pp.670-671}"
