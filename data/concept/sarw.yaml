summary:
  ar: "السرو في الكتاب شجرة طويلة معروفة لا يسقط ورقها في الخريف والشتاء، حار في الأولى يابس في الثانية، قابض محلل للرطوبات مع إلزاق وقطع للدم، وجوزه أقوى من ورقه، ينفع الجراحات والحمرة والفتق والأعصاب والأسنان وأورام العين ونفث الدم والسعال المزمن وعسر البول {cite:canon-ibn-sina-print-v1 p.586}."
  en: "Sarw is in the book the tall, well-known tree whose leaf does not fall in autumn and winter, hot in the first degree and dry in the second, astringent and dissolving moistures with a gluing and blood-stopping power; its cone is stronger than its leaf; it helps wounds, erysipelas, hernia, the sinews, the teeth, swellings of the eye, spitting of blood, old cough and difficulty of urine {cite:canon-ibn-sina-print-v1 p.586}."
  ur: "سرو کتاب میں ایک لمبا معروف درخت ہے جس کا پتا خزاں اور سردی میں نہیں گرتا، پہلے درجے میں گرم اور دوسرے میں خشک، قابض، رطوبتوں کو تحلیل کرتا ہے، جوڑنے اور خون روکنے کی قوت رکھتا ہے؛ اس کا پھل پتے سے زیادہ قوی ہے؛ زخموں، حمرہ، فتق، پٹھوں، دانتوں، آنکھ کے ورموں، خون تھوکنے، پرانی کھانسی اور پیشاب کی دشواری میں مفید ہے {cite:canon-ibn-sina-print-v1 p.586}۔"
  es: "Sarw es en el libro el árbol alto y conocido cuya hoja no cae en otoño e invierno, caliente en primer grado y seco en segundo, astringente y disolvente de humedades con poder adhesivo y detenedor de sangre; su cono es más fuerte que su hoja; ayuda con heridas, erisipela, hernia, tendones, dientes, hinchazón de ojos, escupir sangre, tos crónica y dificultad para orinar {cite:canon-ibn-sina-print-v1 p.586}."
  fr: "Le Sarw est décrit dans le livre comme le grand arbre bien connu dont la feuille ne tombe pas en automne et en hiver, chaud au premier degré et sec au second, astringent et dissolvant les humidités avec un pouvoir collant et hémostatique; son cône est plus fort que sa feuille; il aide les plaies, l'érysipèle, les hernies, les tendons, les dents, les gonflements de l'œil, les crachats de sang, la vieille toux et les difficultés à uriner {cite:canon-ibn-sina-print-v1 p.586}."
  tr: "Kitaptaki servi, yaprakları sonbahar ve kış düşmeyen uzun bir ağaçtır; ilkinde sıcak, ikincisinde kurudur. Kanı bağlayan ve kesen bir büzücü ve nem analizi yapan bir maddedir. Kuru kısmı yapraklarından daha güçlüdür. Ameliyatlar, kızarıklık, fıtıklar, sinirler, dişler, göz tümörleri, hemoptiz, kronik öksürük ve dizuri için faydalıdır. {cite:canon-ibn-sina-print-v1 s.586}."
  id: "Cypress dalam buku ini adalah pohon tinggi yang terkenal dengan daun yang tidak gugur di musim gugur dan musim dingin; panas pada musim pertama dan kering di musim dingin. Ini adalah agen astringen dan penganalisis kelembapan yang mengikat dan memotong darah. Bijinya lebih kuat daripada daunnya. Pohon ini berguna untuk operasi, kemerahan, hernia, saraf, gigi, tumor mata, hemoptisis, batuk kronis, dan disuria. {cite:canon-ibn-sina-print-v1 hlm.586}."
