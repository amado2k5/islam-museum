id: concept/malak-al-mawt
class: concept
kind: angel
label:
  ar: ملك الموت
  en: Malak al-Mawt
  ur: فرشتہ موت
summary:
  ar: 'ملك سمّاه القرآن صراحة في قوله [[passage/quran-32-11|السجدة 11]]: «قل يتوفاكم ملك الموت الذي وكل بكم»، ويدل الحديث على أنه من الملائكة
    الموكلين بقبض الأرواح، ويأتي في رواية الإسراء في الصحيحين.'
  en: The angel the Qur'an names expressly in [[passage/quran-32-11|al-Sajdah 11]] — 'the angel of death who is entrusted with you' — and hadith
    indicates he is the angel charged with taking souls, appearing in the Isra' narration of the Two Sahihs.
  ur: وہ فرشتہ جس کا قرآن نے صراحتاً ذکر کیا [[passage/quran-32-11|السجدہ 11]] میں — «فرشتہ موت جو تم پر موکل ہے» — اور حدیث اس کی تصدیق کرتی
    ہے کہ وہ جانیں لینے کا فرشتہ ہے، اور اس کا ذکر صحیحین کی روایتِ اسرا میں ہے۔
