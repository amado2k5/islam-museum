id: concept/istighfar
class: concept
kind: belief
label: { ar: "الاستغفار", en: "Seeking forgiveness (istighfar)", ur: "استغفار" }
summary:
  ar: "يرى الشعراوي أن الله شرع التوبة والمغفرة لعلمه بأن النفوس تخون صاحبها، وأن قول المؤمنين «طلب المغفرة» يزيل الوجل ويقرب المؤمن من التكليف بمحبة، وأن التوبة رحمة يفتح بها الله الباب لمن أخطأ، وأن الندم على الذنب حسنة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1330} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1331}."
  en: "Sha'rawi holds that God legislated repentance and forgiveness because He knows that souls betray their owners. The believers' prayer 'forgive us' removes fear and draws the believer to duty with love. Repentance is a mercy that God opens for the one who has erred, and remorse for a sin is itself a good deed {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1330} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1331}."
  ur: "شعراوی کے نزدیک اللہ نے توبہ اور مغفرت اس لیے مقرر کی کہ وہ جانتا ہے کہ نفس اپنے مالک سے دغا کرتا ہے۔ مومنین کی دعا «طلب المغفرة» خوف دور کرتی ہے اور مومن کو محبت کے ساتھ فرض کی طرف لاتی ہے۔ توبہ وہ رحمت ہے جو اللہ خطاکار کے لیے کھولتا ہے، اور گناہ پر ندامت خود ایک نیکی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1330} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1331}۔"
