label:
  ar: "الحقوق والواجبات"
  en: "Rights and duties (huquq wal-wajibat)"
  ur: "حقوق و واجبات"
  es: "Derechos y deberes (huquq wal-wajibat)"
  fr: "Droits et devoirs (huquq wal-wajibat)"
  tr: "Haklar ve Görevler"
  id: "Hak dan Kewajiban"
summary:
  ar: "الحقوق والواجبات كما يعرضها الشيخ عمر عبد الكافي: ضياع الحقوق يحول دون الفوز، وأداء الواجب قبل المطالبة بالحق، وتأمل الحقوق بحسب الأدوار في الحياة."
  en: "Rights and duties as Sheikh Omar Abdelkafy presents them: the loss of rights blocks success, duties are discharged before claims are made, and rights are considered according to one's roles in life."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق حقوق و واجبات: حقوق کا ضیاع کامیابی میں رکاوٹ ہے، مطالبے سے پہلے واجب ادا کرنا، اور زندگی کے مختلف کرداروں کے مطابق حقوق پر غور۔"
  es: "Derechos y deberes tal como los presenta el jeque Omar Abdelkafy: la pérdida de derechos impide el éxito, los deberes se cumplen antes de que se presenten reclamaciones y los derechos se consideran según el papel que uno desempeña en la vida."
  fr: "Droits et devoirs selon le cheikh Omar Abdelkafy: la perte des droits entrave la réussite, les devoirs sont accomplis avant toute revendication, et les droits sont considérés en fonction du rôle de chacun dans la vie."
  tr: "Şeyh Ömer Abdelkafi tarafından sunulan haklar ve görevler: Hak kaybetmek, kazanmayı, haklarını talep etmeden önce görevini yerine getirmeyi ve hakları hayattaki rollere göre değerlendirmeyi engeller."
  id: "Hak dan kewajiban yang disampaikan oleh Sheikh Omar Abdelkafi: Kehilangan hak mencegah kemenangan, memenuhi kewajiban sebelum menuntut hak, dan merenungkan hak sesuai peran dalam hidup."
