kind: doctrine
label:
  ar: "الصَّابِئة"
  en: "Sabi'a (the Sabians: who they were, whether they are People of the Book, and the rulings on their land, blood money, food and marriage)"
  es: "Sabi'a (los sabeos: quiénes eran, si eran Gente del Libro y las normas sobre su tierra, la compensación por derramamiento de sangre, la comida y el matrimonio)"
  fr: "Les Sabéens (qui ils étaient, s'ils étaient des Gens du Livre, et les règles concernant leurs terres, le prix du sang, la nourriture et le mariage)"
  ur: "سبیعہ ⁦(صابی: وہ کون تھے، خواہ وہ اہل کتاب ہیں، اور ان کی زمین، خون کی رقم، خوراک اور شادی کے احکام)⁩"
summary:
  ar: "الصابئة قوم اختلف الفقهاء في حقيقة دينهم، أهم من أهل الكتاب أم لا. فأبو حنيفة وأحمد في رواية يعدونهم من أهل الكتاب، وأبو يوسف ومحمد وأكثر المالكية وفي رواية للشافعية يعدونهم من غير أهل الكتاب لعبادتهم الكواكب، والشافعية يفصلون بين من خالف النصارى في أصل دينهم ومن وافقهم، وذكر البيروني وابن تيمية وابن القيم أنهم فرقتان، الحرانيون عبدة الكواكب، وفرقة من أهل الكتاب بقيت في العراق. وفي أحكام ذبائحهم ونسائهم ودياتهم ووقفهم خلاف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10267} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10269} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10270} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10271} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273}"
  en: "The Sabians are a people whose religion the jurists classed in different ways: whether they are People of the Book. Abu Hanifa and Ahmad in one report count them among the People of the Book, while Abu Yusuf, Muhammad, most Malikis and one Shafi'i view count them among the others because they worship the stars; the Shafi'is distinguish those who differ from the Christians on the root of their religion from those who agree. Al-Biruni, Ibn Taymiyya and Ibn al-Qayyim hold that they are two groups: the Harranians, star-worshippers who came to be called Sabians under al-Ma'mun, and a group of the People of the Book in Iraq who baptise. Their land, their blood money, the lawfulness of their food and marriages and the validity of their endowments differ between the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10267} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10269} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10270} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10271} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273}"
  es: "Los sabeos son un pueblo cuya religión los juristas clasificaron de diferentes maneras: o bien son Gente del Libro. Abu Hanifa y Ahmad, en un relato, los incluyen entre la Gente del Libro, mientras que Abu Yusuf, Muhammad, la mayoría de los malikíes y una opinión shafi'í los incluyen entre los demás porque adoran las estrellas; los shafi'íes distinguen a quienes difieren de los cristianos en la raíz de su religión de quienes coinciden. Al-Biruni, Ibn Taymiyya e Ibn al-Qayyim sostienen que son dos grupos: los haranianos, adoradores de las estrellas que pasaron a ser llamados sabeos bajo al-Ma'mun, y un grupo de la Gente del Libro en Irak que practica el bautismo. Sus tierras, sus indemnizaciones por derramamiento de sangre, la licitud de sus alimentos y matrimonios, y la validez de sus donaciones difieren entre las escuelas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10265} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10266} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10267} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10268} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10269} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10270} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10271} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.10272} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273}"
  fr: "Les Sabéens sont un peuple dont la religion a été classée de diverses manières par les juristes: sont-ils considérés comme des Gens du Livre ? Abou Hanifa et Ahmad, dans un recueil, les comptent parmi les Gens du Livre, tandis qu’Abou Yusuf, Muhammad, la plupart des Malikites et une opinion chaféite les classent parmi les autres en raison de leur culte des astres; les chaféites distinguent ceux qui diffèrent des chrétiens sur le fondement de leur religion de ceux qui partagent leur foi. Al-Biruni, Ibn Taymiyya et Ibn al-Qayyim les considèrent comme deux groupes: les Harraniens, adorateurs des astres qui furent appelés Sabéens sous l’influence d’al-Ma’mun, et un groupe de Gens du Livre en Irak qui pratiquent le baptême. Leurs terres, le prix du sang, la licéité de leur nourriture et de leurs mariages, ainsi que la validité de leurs dotations varient selon les écoles de pensée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10267} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10269} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10270} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10271} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.10272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273}"
  ur: "صابی وہ لوگ ہیں جن کے مذہب کو فقہاء نے مختلف طریقوں سے درجہ بندی کیا ہے: چاہے وہ اہل کتاب ہوں۔ ابوحنیفہ اور احمد نے ایک روایت میں انہیں اہل کتاب میں شمار کیا ہے جبکہ ابو یوسف، محمد، اکثر مالکیوں اور ایک شافعی نے انہیں ستاروں کی پرستش کی وجہ سے دوسروں میں شمار کیا ہے۔ شافعی ان لوگوں کو جو عیسائیوں سے ان کے مذہب کی بنیاد پر اختلاف رکھتے ہیں ان لوگوں سے ممتاز کرتے ہیں جو متفق ہیں۔ البیرونی، ابن تیمیہ اور ابن القیم کا خیال ہے کہ وہ دو گروہ ہیں: حرانی، ستارہ پرست جو المامون کے دور میں صابی کہلاتے ہیں، اور عراق میں اہل کتاب کا ایک گروہ جو بپتسمہ دیتے ہیں۔ ان کی زمین، ان کے خون کا پیسہ، ان کے کھانے اور شادیوں کا حلال ہونا اور ان کے وقفوں کی درستی مکاتب کے درمیان مختلف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10265} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10266} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10267} p.10268} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10269} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10270} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص71} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10272}"
