label:
  ar: "الصَّابِئة"
  en: "Sabi'a (the Sabians: who they were, whether they are People of the Book, and the rulings on their land, blood money, food and marriage)"
summary:
  ar: "الصابئة قوم اختلف الفقهاء في حقيقة دينهم، أهم من أهل الكتاب أم لا. فأبو حنيفة وأحمد في رواية يعدونهم من أهل الكتاب، وأبو يوسف ومحمد وأكثر المالكية وفي رواية للشافعية يعدونهم من غير أهل الكتاب لعبادتهم الكواكب، والشافعية يفصلون بين من خالف النصارى في أصل دينهم ومن وافقهم، وذكر البيروني وابن تيمية وابن القيم أنهم فرقتان، الحرانيون عبدة الكواكب، وفرقة من أهل الكتاب بقيت في العراق. وفي أحكام ذبائحهم ونسائهم ودياتهم ووقفهم خلاف بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10267} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10269} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10270} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10271} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273}"
  en: "The Sabians are a people whose religion the jurists classed in different ways: whether they are People of the Book. Abu Hanifa and Ahmad in one report count them among the People of the Book, while Abu Yusuf, Muhammad, most Malikis and one Shafi'i view count them among the others because they worship the stars; the Shafi'is distinguish those who differ from the Christians on the root of their religion from those who agree. Al-Biruni, Ibn Taymiyya and Ibn al-Qayyim hold that they are two groups: the Harranians, star-worshippers who came to be called Sabians under al-Ma'mun, and a group of the People of the Book in Iraq who baptise. Their land, their blood money, the lawfulness of their food and marriages and the validity of their endowments differ between the schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10267} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10269} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10270} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10271} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10273}"
