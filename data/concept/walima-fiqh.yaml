  en: "Walima (wedding feast, fiqh)"
summary:
  ar: "الوليمة في اللغة من الولم وهو الجمع، وهي طعام العرس والإملاك، وتقع في الاصطلاح على كل طعام يُتخذ لسرور حادث. وأحكام وليمة العرس عند الفقهاء: هل هي سنة أو واجبة، وهل تُقضى، وحكمة إشهار النكاح، وحكم إجابة الدعوة إليها، وحكم الأكل للصائم والمفطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17947}"
  en: "Walima, from walm (gathering), is the feast of a wedding or betrothal, and technically any food made for a happy event. The rulings on the wedding feast cover whether it is a sunna or an obligation, whether it is enforced, the purpose of announcing the marriage, accepting the invitation, and eating by a fasting or non-fasting guest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17947}"
