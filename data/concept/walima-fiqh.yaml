id: concept/walima-fiqh
class: concept
kind: legal
label:
  ar: "وَليمة"
  en: "Walima (wedding feast, fiqh)"
  es: "Walima (banquete nupcial, fiqh)"
  fr: "Walima (fête de mariage, fiqh)"
  ur: "ولیمہ ⁦(شادی کی دعوت، فقہ)⁩"
summary:
  ar: "الوليمة في اللغة من الولم وهو الجمع، وهي طعام العرس والإملاك، وتقع في الاصطلاح على كل طعام يُتخذ لسرور حادث. وأحكام وليمة العرس عند الفقهاء: هل هي سنة أو واجبة، وهل تُقضى، وحكمة إشهار النكاح، وحكم إجابة الدعوة إليها، وحكم الأكل للصائم والمفطر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17947}"
  en: "Walima, from walm (gathering), is the feast of a wedding or betrothal, and technically any food made for a happy event. The rulings on the wedding feast cover whether it is a sunna or an obligation, whether it is enforced, the purpose of announcing the marriage, accepting the invitation, and eating by a fasting or non-fasting guest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17947}"
  es: "Walima, del latín walm (reunión), es el banquete de una boda o compromiso, y técnicamente cualquier comida preparada para un evento feliz. Las normas sobre el banquete nupcial abarcan si es una sunna o una obligación, si es obligatorio, el propósito de anunciar el matrimonio, la aceptación de la invitación y si un invitado ayuna o no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17947}"
  fr: "La walima, dérivée de walm (rassemblement), désigne le festin d'un mariage ou de fiançailles, et plus précisément tout mets préparé pour un événement heureux. Les règles relatives au festin de mariage portent sur son caractère sunna ou obligatoire, son application, le but de l'annonce du mariage, l'acceptation de l'invitation et la participation des convives, qu'ils jeûnent ou non. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17946}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17947}"
  ur: "ولیمہ، والم ⁦(اجتماع)⁩ سے ہے، شادی یا منگنی کی دعوت ہے، اور تکنیکی طور پر کوئی بھی کھانا خوشی کی تقریب کے لیے بنایا جاتا ہے۔ شادی کی دعوت کے احکام میں خواہ یہ سنت ہو یا فرض، خواہ اسے نافذ کیا گیا ہو، نکاح کا اعلان کرنے کا مقصد، دعوت قبول کرنا، اور روزہ دار یا غیر روزہ دار مہمان کا کھانا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17946}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17947}"
