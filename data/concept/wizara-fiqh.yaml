id: concept/wizara-fiqh
class: concept
kind: political
label:
  ar: وِزارة
  en: Wizara (vizierate and the minister's office)
  es: "Wizara (visir y oficina del ministro)"
  fr: "Wizara (vizirat et bureau du ministre)"
  ur: "وزیرا ⁦(وزیر اور وزیر کا دفتر)⁩"
  tr: "bakanlık"
  id: "kementerian"
summary:
  ar: 'الوزارة في اللغة من الوِزر أو الأَزْر أو الوَزَر، وهي نوع من الولاية، فالوزير عون على الأمور وظهير في السياسة وملجأ عند النوازل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17169} وقد ورد في القرآن سؤال موسى ربه أن يجعل له وزيراً من أهله هارون، فأجابه، وفي السنة قوله: وزيراي من السماء جبريل وميكائيل، ومن أهل الأرض أبو بكر وعمر، وحديث عائشة في أن الله إذا أراد بالأمير خيراً جعل له وزير صدق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17171} وعدّ الماوردي جواز الوزارة في النبوة دليلاً على جوازها في الإمامة من باب أولى، لأن الإمام لا يقدر على تدبير شؤون الأمة وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} والوزارة قسمان: وزارة التفويض، وهي أصل الولايات بعد الخلافة، إذ ينظر وزيرها في كل ما ينظر فيه الخليفة، ووزارة التنفيذ، وهي أضعف حكماً، يؤدي فيها الوزير عن الإمام ما أمر به ويبلغ عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}

    ويشترط في وزير التفويض الإسلام، فالطاعة مطلوبة لأولي الأمر منكم، والذكورة لقوله تعالى في القوامة، والعقل والرشد بكمال النضج والخبرة، ويرى بعض الفقهاء أن الرشد يبلغ بالأربعين، والعدالة، والأمانة في الأموال، والاجتهاد في الدين وإن لم يبلغ رتبة الاجتهاد المطلق، والكفاية في إدارة الأمور، وسلامة الحواس، والشجاعة، وألا يشتغل بالتجارة حتى يتفرغ لعمله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175}

    وينعقد تقليد الوزارة بلفظ صريح يسند إليه عموم النظر ويطلب منه النيابة، فلا يكفي الإذن المجرد ولا اللفظ المحتمل، ويصح بعض الألفاظ المعيّنة وتتفاوت الآراء فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}

    ويستقل وزير التفويض بالولايات العامة كتعيين القضاة والولاة وتجنيد الجند وصرف الأموال وبعث الجيوش، وكل ما صح للإمام يصح له إلا ولاية العهد، والاستعفاء من الإمامة، وعزل من قلّده الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}

    ولا يجوز تقليد وزيري تفويض معاً على الاجتماع؛ فإن أُشرك بينهما في النظر اتفقا على ما اتفقا عليه، وإن أُفرد كل منهما بعمل خاص فهو وال على عمل محدود لا وزير تفويض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}

    ويراجع وزير التفويض الإمام في مجامع الخطوب ويطلعه على ما أمضاه من التدبير، ويستعين بوزراء التنفيذ والأمراء والكتّاب والسعاة، ويختار المعاونين بالصفات الشرعية، ويتفقد أعمالهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180}

    وشروط وزير التنفيذ أخف: الثقة والأمانة وصدق اللهجة وقلة الطمع والسلامة من العداوة والذكاء والذكر والخبرة وعدم اتباع الهوى، ولا يشترط الاجتهاد ولا العلم بالأحكام لأنه لا يحكم، وفي الذكورة والإسلام خلاف: فأجاز الماوردي وأبو يعلى أن يكون ذمياً في التنفيذ دون التفويض، ومنع الجويني ذلك، وأنكر عمر على أبي موسى اتخاذه كاتباً نصرانياً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17182}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183}

    وتعيين الوزير عقد جائز يجوز لكل من الطرفين فسخه، فللإمام عزل الوزيرين لمصلحة الأمة، ولوزير التفويض عزل وزير التنفيذ الذي عيّنه، ولكل منهما أن يعزل نفسه مراعاة للمصلحة؛ وينعزل الوزير بخيانة ظهرت أو تقصير أو عجز، وقد يُنقل إلى عمل أسهل أو يُرقى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17184}'
  en: 'Wizara (vizierate) in the lexicon derives from burden, support or refuge, and is a kind of authority: the minister is a helper, an adviser and a refuge in trouble. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17169} The Qur''an reports Moses asking God for a minister from his family, Aaron, and the sunna reports the saying that the Prophet''s ministers in heaven are Gabriel and Michael and on earth Abu Bakr and Umar; a report from Aisha says that God gives a ruler a true minister when He wishes him well. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17171} Al-Mawardi argues that if a minister is lawful for a prophet it is more so for an imam, who cannot manage the community''s affairs alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} There are two kinds: the minister of delegation, the first office after the caliphate, who holds whatever authority the caliph holds; and the minister of execution, weaker in authority, who carries out and transmits the ruler''s orders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181} A minister of delegation must be a Muslim, a man, sound in mind and judgement (some say mature at forty), just, trustworthy in money, able to exercise independent judgement in religion though not at the level of the fully qualified jurist, capable in administration, sound in senses, brave, and not engaged in trade. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175} Appointment requires an express words conferring general authority and asking for deputyship; a bare permission or an ambiguous phrase does not suffice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177} A minister of delegation has general authority, such as appointing judges and governors, raising troops, disbursing funds and sending armies, except the designation of an heir, resignation from the imamate, and dismissal of the one who appointed him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178} Two ministers of delegation cannot be appointed with equal general power: if they are joined, they act only on what both agree; if each has a separate field, they are governors of a limited task rather than ministers of delegation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179} The minister must consult the imam in grave matters and report his decisions; he chooses assistants by the legal qualities and watches over their work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180} The executive minister needs trustworthiness, honesty, moderate greed, freedom from enmity, memory, intelligence, freedom from desire and experience; he need not be a jurist, since he does not judge. Al-Mawardi and Abu Ya''la allow a non-Muslim as executive minister, al-Juwayni refuses, and Umar rebuked Abu Musa for employing a Christian secretary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17182}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183} The appointment is a revocable contract: the ruler may dismiss either minister, a minister of delegation may dismiss his own executive minister, and either may resign; a minister is dismissed for proven betrayal, negligence or incapacity, or moved to a lighter post. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17184}'
  es: "Wizara (visir) en el léxico deriva de carga, apoyo o refugio, y es un tipo de autoridad: el ministro es un ayudante, un consejero y un refugio en la adversidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17169} El Corán informa que Moisés pidió a Dios un ministro de su familia, Aarón, y la Sunna informa que los ministros del Profeta en el cielo son Gabriel y Miguel y en la tierra Abu Bakr y Umar; un informe de Aisha dice que Dios le da a un gobernante un verdadero ministro cuando Él le desea lo mejor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17171} Al-Mawardi argumenta que si un ministro es lícito para un profeta, lo es más para un imán, quien no puede administrar los asuntos de la comunidad solo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} Hay dos tipos: el ministro de delegación, el primer cargo después del califato, que posee la misma autoridad que el califa; y el ministro de ejecución, de menor autoridad, que lleva a cabo y transmite las órdenes del gobernante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181} Un ministro de delegación debe ser musulmán, hombre, sano de mente y juicio (algunos dicen maduro a los cuarenta), justo, digno de confianza en el dinero, capaz de ejercer un juicio independiente en materia de religión, aunque no al nivel de un jurista plenamente cualificado, capaz en la administración, sano de sentidos, valiente y no dedicado al comercio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175} El nombramiento requiere palabras expresas que confieran autoridad general y soliciten la destitución; un simple permiso o una frase ambigua no basta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177} Un ministro de delegación tiene autoridad general, como nombrar jueces y gobernadores, reclutar tropas, desembolsar fondos y enviar ejércitos, excepto la designación de un heredero, la renuncia al imamato y la destitución de quien lo nombró. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178} Dos ministros de delegación no pueden ser nombrados con igual poder general: si están unidos, actúan solo sobre lo que ambos acuerdan; si cada uno tiene un campo separado, son gobernadores de una tarea limitada en lugar de ministros de delegación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179} El ministro debe consultar al imán en asuntos graves e informar sus decisiones; elige asistentes por las cualidades legales y supervisa su trabajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180} El ministro ejecutivo necesita confiabilidad, honestidad, codicia moderada, ausencia de enemistad, memoria, inteligencia, ausencia de deseo y experiencia; no necesita ser jurista, ya que no juzga. Al-Mawardi y Abu Ya'la permiten que un no musulmán sea ministro ejecutivo, al-Juwayni se niega, y Umar reprendió a Abu Musa por emplear a una secretaria cristiana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17182}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183} El nombramiento es un contrato revocable: el gobernante puede destituir a cualquiera de los ministros, un ministro de la delegación puede destituir al suyo ministro ejecutivo, y cualquiera de ellos puede dimitir; un ministro es destituido por traición, negligencia o incapacidad comprobadas, o trasladado a un puesto más ligero. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17184}"
  fr: "Le terme « wizara » (vizirat) dérive des mots « fardeau », « soutien » ou « refuge », et désigne une forme d'autorité: le ministre est un assistant, un conseiller et un refuge dans l'épreuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17169} Le Coran rapporte que Moïse demanda à Dieu de lui désigner un ministre parmi ses proches, Aaron. La Sunna rapporte également que les ministres du Prophète au ciel sont Gabriel et Michel, et sur terre Abou Bakr et Omar. Selon un hadith rapporté par Aïcha, Dieu donne à un dirigeant un véritable ministre lorsqu'Il lui veut du bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17171} Al-Mawardi soutient que si la présence d'un ministre est licite pour un prophète, elle l'est d'autant plus pour un imam, qui ne peut gérer seul les affaires de la communauté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} Il existe deux catégories de ministres: le ministre délégué, première fonction après le califat, qui détient les mêmes pouvoirs que le calife; et le ministre d'exécution, dont l'autorité est moindre, qui exécute et transmet les ordres du souverain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181} Un ministre délégué doit être musulman, un homme sain d'esprit et de jugement (certains disent qu'il atteint la maturité à quarante ans), juste, digne de confiance en matière financière, capable d'exercer un jugement indépendant en matière de religion, même s'il n'a pas la compétence d'un juriste pleinement qualifié, apte à administrer, sain de sens, courageux et ne pas exercer de commerce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175} La nomination requiert une déclaration expresse conférant une autorité générale et sollicitant une délégation; une simple autorisation ou une formulation ambiguë ne suffit pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177} Un ministre délégué dispose d’une autorité générale, notamment pour nommer les juges et les gouverneurs, lever des troupes, débloquer des fonds et envoyer des armées, à l’exception de la désignation d’un héritier, de la démission de l’imamat et de la révocation de celui qui l’a nommé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178} Deux ministres délégués ne peuvent être nommés avec des pouvoirs généraux égaux: s’ils sont conjoints, ils n’agissent que sur ce qui est convenu d’un commun accord; si chacun a un domaine distinct, ils sont des gouverneurs chargés d’une tâche limitée plutôt que des ministres délégués. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179} Le ministre doit consulter l’imam pour les questions graves et lui faire rapport de ses décisions; il choisit ses assistants en fonction de leurs compétences juridiques et supervise leur travail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180} Le ministre exécutif doit être digne de confiance, honnête, modéré dans ses ambitions, désintéressé, avoir une bonne mémoire, de l'intelligence, être libre de tout désir et posséder de l'expérience; il n'a pas besoin d'être juriste, puisqu'il n'a pas vocation à juger. Al-Mawardi et Abu Ya'la admettent qu'un non-musulman occupe cette fonction, al-Juwayni s'y oppose, et Umar réprimande Abu Musa pour avoir employé un secrétaire chrétien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17182}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183} La nomination est un contrat révocable: le dirigeant peut révoquer l'un ou l'autre des ministres, un ministre de délégation peut révoquer le sien ministre exécutif, et l'un ou l'autre peut démissionner; un ministre est démis de ses fonctions pour trahison, négligence ou incapacité avérée, ou transféré à un poste plus léger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17184}"
  ur: "لغت میں ویزارا بوجھ، مدد یا پناہ سے ماخوذ ہے، اور یہ ایک قسم کا اختیار ہے: وزیر ایک مددگار، مشیر اور مصیبت میں پناہ گاہ ہے۔ قرآن بیان کرتا ہے کہ موسیٰ نے خدا سے اپنے خاندان ہارون سے ایک وزیر طلب کیا تھا، اور سنت یہ بیان کرتی ہے کہ آسمان پر نبی کے وزیر جبرائیل اور میکائیل اور زمین پر ابوبکر و عمر ہیں۔ عائشہ ا سے روایت ہے کہ اللہ تعالیٰ ایک حکمران کو اس وقت سچا وزیر دیتا ہے جب وہ اس کی بھلائی چاہتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17171} الماوردی نے استدلال کیا ہے کہ اگر کوئی وزیر نبی کے لیے حلال ہے تو یہ امام کے لیے زیادہ ہے جو اکیلے معاشرے کا انتظام نہیں کر سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} دو قسم کے ہیں: وفد کا وزیر، خلیفہ کے بعد پہلا عہدہ، جو خلیفہ کے پاس جو بھی اختیار رکھتا ہو؛ اور پھانسی کا وزیر، اختیار میں کمزور، جو حکمران کے احکامات پر عمل کرتا ہے اور اسے منتقل کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181} وفد کے وزیر کا مسلمان ہونا ضروری ہے، ایک آدمی، عقل اور فیصلہ ⁦(کچھ کہتے ہیں کہ چالیس سال کی عمر میں بالغ)⁩ ہونا چاہئے، اگرچہ مذہب میں قابل اعتماد، انصاف کی سطح پر قابل اعتماد نہیں مکمل طور پر قابل فقیہ، نظم و نسق کے قابل، ہوش و حواس میں مضبوط، بہادر، اور تجارت میں مشغول نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175} تصنیف کے لیے عام الفاظ کی تقرری اور تقرری کی ضرورت ہے۔ ایک ننگی اجازت یا ایک مبہم جملہ کافی نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177} وفد کے وزیر کے پاس عمومی اختیارات ہوتے ہیں، جیسے ججوں اور گورنروں کی تقرری، فوجیں جمع کرنا، استعفیٰ دینا، فنڈز بھیجنا، اسلحے کی تقسیم کے علاوہ امامت سے، اور اسے مقرر کرنے والے کی برطرفی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178} وفود کے دو وزراء کو یکساں عمومی طاقت کے ساتھ مقرر نہیں کیا جا سکتا: اگر وہ شامل ہو جائیں تو وہ صرف اسی پر عمل کریں جس پر دونوں متفق ہوں۔ اگر ہر ایک کا الگ فیلڈ ہے، تو وہ وفد کے وزراء کے بجائے ایک محدود کام کے گورنر ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179} وزیر کو سنگین معاملات میں امام سے مشورہ کرنا چاہئے اور اس کے فیصلوں کی اطلاع دینا چاہئے۔ وہ قانونی خصوصیات کے مطابق معاونین کا انتخاب کرتا ہے اور ان کے کام پر نظر رکھتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180} ایگزیکٹو وزیر کو امانت، دیانت، اعتدال پسند لالچ، دشمنی سے آزادی، یادداشت، ذہانت اور خواہش سے آزادی، آزادی کی ضرورت ہوتی ہے۔ اسے فقیہ ہونے کی ضرورت نہیں کیونکہ وہ فیصلہ نہیں کرتا۔ الماوردی اور ابو یالہ نے ایک غیر مسلم کو ایگزیکٹو وزیر کے طور پر اجازت دی، الجوینی نے انکار کر دیا، اور عمر نے ابو موسی کو ایک عیسائی سیکرٹری کی ملازمت پر سرزنش کی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17181}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17182}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17183} وزیر کی تقرری کا قاعدہ: وزیر کا دوبارہ تقرر ایک معاہدہ ہو سکتا ہے وفد اپنے ہی ایگزیکٹو وزیر کو برطرف کر سکتا ہے، اور یا تو استعفیٰ دے سکتا ہے۔ وزیر کو دھوکہ دہی، غفلت یا نااہلی ثابت ہونے پر برطرف کیا جاتا ہے، یا ہلکے عہدے پر منتقل کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17183}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17184}"
  tr: "Arapçada \"bakanlık\" kelimesi, yük veya sorumluluk anlamına gelen \"wizr\" kökünden gelir. Bir tür otoritedir ve bakan, işlerde yardımcı, siyasette destekçi ve kriz zamanlarında sığınaktır. Kur'an'da Musa'nın Rabbinden ailesinden Harun'u bakan olarak atamasını istediği ve Allah'ın bu isteğini kabul ettiği belirtilir. Sünnet şöyle der: \"Gökyüzünden iki bakanım Cebrail ve Mikail'dir; yeryüzünden ise Ebu Bekir ve Ömer'dir.\" Aişe de, Allah bir yönetici için hayırlı bir şey dilediğinde, ona doğru sözlü bir bakan atadığını rivayet etmiştir. El-Mawardi, peygamberlikte bakanlığın caiz olduğunu, liderlikte de caiz olduğuna dair bir delil olarak görmüştür; çünkü lider, milletin işlerini tek başına yönetemez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} Bakanlık ikiye ayrılır: Halifelikten sonra eyaletlerin kökenini oluşturan ve vekili halifenin ilgilendiği her şeye bakan Vekalet Bakanlığı ve yetki bakımından daha zayıf olan, vekilin imamın emrettiği işleri onun adına yerine getirdiği ve onun adına rapor verdiği İcra Bakanlığı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181} Temsilcilik makamının Müslüman olması gerekir, zira aranızdaki yetkililere itaat edilmesi gerekir; ayrıca Allah Teala'nın vesayet konusunda buyurduğu gibi erkek olmalı; aklı başında, olgun ve deneyimli olmalıdır. Bazı hukukçular olgunluğun kırk yaşında kazanıldığına inanırlar; adalet, para konusunda güvenilirlik, mutlak gayret seviyesine ulaşmasa bile dinde gayret, işleri yönetmede yeterlilik, sağlam akıl, cesaret ve işine kendini adamadan ticarete girmemesi gerekir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175} Bakanın atanması, kendisine genel gözetim yetkisi veren ve temsilini talep eden açık bir ifadeyle belirlenir. Sadece izin veya belirsiz ifadeler yeterli değildir. Bazı özel ifadeler geçerlidir ve bunlar hakkındaki görüşler farklılık göstermektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17177} Vekil, hakim ve vali atama, asker toplama, fon dağıtma ve ordu gönderme gibi genel görevlerden bağımsızdır ve imam için geçerli olan her şey onun için de geçerlidir; ancak ahit emri, imamlıktan muafiyet ve imamın kendisini taklit ettiği kişilerin görevden alınması hariç. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17178} İki vekilin birlikte görüşme için görevlendirilmesi caiz değildir; Eğer değerlendirmeye dahil olurlarsa, üzerinde anlaştıkları konuda mutabık kalırlar ve her birine özel bir görev verilirse, o zaman o, yetkilendirilmiş bir bakan değil, sınırlı bir işin yöneticisidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17179} Vekalet Bakanı, vaaz meclislerinde İmam'ı denetler ve düzenlemelerden onayladığı hususları ona bildirir; yürütme bakanlarından, prenslerden, katiplerden ve elçilerden yardım ister; meşru niteliklere sahip yardımcılar seçer ve çalışmalarını denetler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180} İcra Bakanı'nın şartları daha hafiftir: güvenilirlik, dürüstlük, doğruluk, açgözlülükten uzaklık, düşmanlıktan korunma, zekâ, bilgi, tecrübe ve kendi arzularının peşinden gitmemek. Ne gayret ne de hükümler hakkında bilgi gereklidir çünkü o yönetmez. Erkek olmak ve Müslüman olmak konusunda görüş ayrılığı vardır: El-Mawardi ve Ebu Ya'la, infazda zimmi olmasına izin vermiş ancak yetki devrinde izin vermemiştir; El-Cüveyni ise bunu yasaklamış ve Ömer, Ebu Musa'nın Hristiyan bir kâtip almasını onaylamamıştır. Bir bakanın atanması, her iki tarafın da feshedebileceği caiz bir sözleşmedir. İmam, milletin yararı için her iki bakanı da görevden alabilir ve Temsilciler Bakanı da atadığı İcra Bakanını görevden alabilir. Her ikisi de kamu yararı gereği istifa edebilir. Bir bakan, kanıtlanmış ihanet, ihmal veya yetersizlik nedeniyle görevden alınabilir. Daha kolay bir göreve atanabilir veya terfi ettirilebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17183}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17184}"
  id: "Kata \"kementerian\" dalam bahasa Arab berasal dari akar kata \"wizr,\" yang berarti beban atau tanggung jawab. Ini adalah jenis wewenang, dan seorang menteri adalah penolong dalam berbagai urusan, pendukung dalam politik, dan tempat berlindung di saat krisis. Al-Quran menyebutkan Musa meminta Tuhannya untuk menunjuk Harun sebagai menterinya dari kalangan keluarganya, dan Allah mengabulkan permintaannya. Sunnah menyatakan: \"Dua menteri-Ku dari langit adalah Jibril dan Mikail, dan dari penduduk bumi adalah Abu Bakar dan Umar.\" Aisyah juga meriwayatkan bahwa ketika Allah menghendaki kebaikan bagi seorang penguasa, Dia menunjuk seorang menteri yang jujur untuknya. Al-Mawardi menganggap kebolehan jabatan menteri dalam kenabian sebagai bukti kebolehannya dalam kepemimpinan, terlebih lagi, karena pemimpin tidak dapat mengelola urusan negara sendirian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} Kementerian terbagi menjadi dua bagian: Kementerian Delegasi, yang merupakan asal mula provinsi-provinsi setelah kekhalifahan, karena menterinya mengurus segala sesuatu yang diurus oleh khalifah, dan Kementerian Pelaksana, yang lebih lemah dalam hal kewenangan, di mana menteri melaksanakan atas nama imam apa yang diperintahkannya dan melaporkan atas namanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181} Menteri delegasi haruslah seorang Muslim, karena ketaatan diwajibkan kepada mereka yang berwenang di antara kalian, dan laki-laki, sebagaimana firman Allah SWT mengenai perwalian, serta berakal sehat dan dewasa dengan kedewasaan dan pengalaman yang lengkap. Beberapa ahli hukum percaya bahwa kedewasaan dicapai pada usia empat puluh tahun, dan keadilan, kepercayaan dalam hal keuangan, dan ketekunan dalam beragama meskipun tidak mencapai tingkat ketekunan absolut, serta kecukupan dalam mengelola urusan, akal sehat, keberanian, dan bahwa seseorang tidak terlibat dalam perdagangan sampai ia mengabdikan dirinya pada pekerjaannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175} Pengangkatan menteri ditetapkan dengan pernyataan eksplisit yang menugaskannya pengawasan umum dan meminta perwakilannya. Izin semata atau kata-kata yang ambigu tidaklah cukup. Beberapa rumusan khusus sah, dan pendapat berbeda-beda mengenai hal tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177} Menteri Delegasi tidak terikat pada tugas-tugas umum seperti mengangkat hakim dan gubernur, merekrut tentara, menyalurkan dana, dan mengirim pasukan, dan segala sesuatu yang sah bagi imam juga sah baginya kecuali mandat perjanjian, pembebasan dari imamah, dan pencopotan orang-orang yang ditiru oleh Imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178} Tidak diperbolehkan mendelegasikan dua menteri sekaligus untuk bertemu; Jika mereka terlibat dalam pertimbangan, mereka menyepakati apa yang telah mereka sepakati, dan jika masing-masing dari mereka diberi tugas khusus, maka dia adalah penguasa pekerjaan terbatas, bukan menteri yang didelegasikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179} Menteri Delegasi meninjau Imam dalam majelis khutbah dan memberitahukan kepadanya apa yang telah disetujuinya tentang pengaturan tersebut, dan dia meminta bantuan para menteri eksekutif, pangeran, juru tulis dan utusan, dan dia memilih asisten dengan kualitas yang sah, dan dia memeriksa pekerjaan mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180} Syarat-syarat Menteri Pelaksana lebih ringan: dapat dipercaya, jujur, tulus, tidak serakah, aman dari permusuhan, cerdas, berpengetahuan, berpengalaman, dan tidak mengikuti hawa nafsu. Ketekunan maupun pengetahuan tentang hukum tidak diperlukan karena ia tidak memerintah. Terdapat perbedaan pendapat mengenai jenis kelamin laki-laki dan status sebagai Muslim: Al-Mawardi dan Abu Ya'la memperbolehkannya menjadi seorang dhimmi dalam pelaksanaan tetapi tidak dalam pendelegasian, sedangkan Al-Juwayni melarang hal itu, dan Umar tidak menyetujui Abu Musa mengambil seorang juru tulis Kristen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17182}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183} Pengangkatan seorang menteri adalah kontrak yang diperbolehkan dan dapat diakhiri oleh salah satu pihak. Imam dapat memberhentikan kedua menteri demi kepentingan negara, dan Menteri Delegasi dapat memberhentikan Menteri Pelaksana yang telah diangkatnya. Masing-masing juga dapat mengundurkan diri demi kepentingan umum. Seorang menteri dapat diberhentikan karena terbukti melakukan pengkhianatan, kelalaian, atau ketidakmampuan. Ia dapat dipindahkan ke posisi yang lebih mudah atau dipromosikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17183}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17184}"
