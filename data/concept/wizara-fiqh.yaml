class: concept
kind: political
label:
  ar: وِزارة
  en: Wizara (vizierate and the minister's office)
summary:
  ar: 'الوزارة في اللغة من الوِزر أو الأَزْر أو الوَزَر، وهي نوع من الولاية، فالوزير عون على الأمور وظهير في السياسة وملجأ عند النوازل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17169} وقد ورد في القرآن سؤال موسى ربه أن يجعل له وزيراً من أهله هارون، فأجابه، وفي السنة قوله: وزيراي من السماء جبريل وميكائيل، ومن أهل الأرض أبو بكر وعمر، وحديث عائشة في أن الله إذا أراد بالأمير خيراً جعل له وزير صدق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17171} وعدّ الماوردي جواز الوزارة في النبوة دليلاً على جوازها في الإمامة من باب أولى، لأن الإمام لا يقدر على تدبير شؤون الأمة وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} والوزارة قسمان: وزارة التفويض، وهي أصل الولايات بعد الخلافة، إذ ينظر وزيرها في كل ما ينظر فيه الخليفة، ووزارة التنفيذ، وهي أضعف حكماً، يؤدي فيها الوزير عن الإمام ما أمر به ويبلغ عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}

    ويشترط في وزير التفويض الإسلام، فالطاعة مطلوبة لأولي الأمر منكم، والذكورة لقوله تعالى في القوامة، والعقل والرشد بكمال النضج والخبرة، ويرى بعض الفقهاء أن الرشد يبلغ بالأربعين، والعدالة، والأمانة في الأموال، والاجتهاد في الدين وإن لم يبلغ رتبة الاجتهاد المطلق، والكفاية في إدارة الأمور، وسلامة الحواس، والشجاعة، وألا يشتغل بالتجارة حتى يتفرغ لعمله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175}

    وينعقد تقليد الوزارة بلفظ صريح يسند إليه عموم النظر ويطلب منه النيابة، فلا يكفي الإذن المجرد ولا اللفظ المحتمل، ويصح بعض الألفاظ المعيّنة وتتفاوت الآراء فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}

    ويستقل وزير التفويض بالولايات العامة كتعيين القضاة والولاة وتجنيد الجند وصرف الأموال وبعث الجيوش، وكل ما صح للإمام يصح له إلا ولاية العهد، والاستعفاء من الإمامة، وعزل من قلّده الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}

    ولا يجوز تقليد وزيري تفويض معاً على الاجتماع؛ فإن أُشرك بينهما في النظر اتفقا على ما اتفقا عليه، وإن أُفرد كل منهما بعمل خاص فهو وال على عمل محدود لا وزير تفويض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}

    ويراجع وزير التفويض الإمام في مجامع الخطوب ويطلعه على ما أمضاه من التدبير، ويستعين بوزراء التنفيذ والأمراء والكتّاب والسعاة، ويختار المعاونين بالصفات الشرعية، ويتفقد أعمالهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180}

    وشروط وزير التنفيذ أخف: الثقة والأمانة وصدق اللهجة وقلة الطمع والسلامة من العداوة والذكاء والذكر والخبرة وعدم اتباع الهوى، ولا يشترط الاجتهاد ولا العلم بالأحكام لأنه لا يحكم، وفي الذكورة والإسلام خلاف: فأجاز الماوردي وأبو يعلى أن يكون ذمياً في التنفيذ دون التفويض، ومنع الجويني ذلك، وأنكر عمر على أبي موسى اتخاذه كاتباً نصرانياً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17182}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183}

    وتعيين الوزير عقد جائز يجوز لكل من الطرفين فسخه، فللإمام عزل الوزيرين لمصلحة الأمة، ولوزير التفويض عزل وزير التنفيذ الذي عيّنه، ولكل منهما أن يعزل نفسه مراعاة للمصلحة؛ وينعزل الوزير بخيانة ظهرت أو تقصير أو عجز، وقد يُنقل إلى عمل أسهل أو يُرقى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17184}'
  en: 'Wizara (vizierate) in the lexicon derives from burden, support or refuge, and is a kind of authority: the minister is a helper, an adviser and a refuge in trouble. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17169} The Qur''an reports Moses asking God for a minister from his family, Aaron, and the sunna reports the saying that the Prophet''s ministers in heaven are Gabriel and Michael and on earth Abu Bakr and Umar; a report from Aisha says that God gives a ruler a true minister when He wishes him well. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17171} Al-Mawardi argues that if a minister is lawful for a prophet it is more so for an imam, who cannot manage the community''s affairs alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17170}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172} There are two kinds: the minister of delegation, the first office after the caliphate, who holds whatever authority the caliph holds; and the minister of execution, weaker in authority, who carries out and transmits the ruler''s orders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17172}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181} A minister of delegation must be a Muslim, a man, sound in mind and judgement (some say mature at forty), just, trustworthy in money, able to exercise independent judgement in religion though not at the level of the fully qualified jurist, capable in administration, sound in senses, brave, and not engaged in trade. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17173}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17174}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17175} Appointment requires an express words conferring general authority and asking for deputyship; a bare permission or an ambiguous phrase does not suffice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17176}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177} A minister of delegation has general authority, such as appointing judges and governors, raising troops, disbursing funds and sending armies, except the designation of an heir, resignation from the imamate, and dismissal of the one who appointed him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17177}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178} Two ministers of delegation cannot be appointed with equal general power: if they are joined, they act only on what both agree; if each has a separate field, they are governors of a limited task rather than ministers of delegation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17178}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179} The minister must consult the imam in grave matters and report his decisions; he chooses assistants by the legal qualities and watches over their work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17179}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17180} The executive minister needs trustworthiness, honesty, moderate greed, freedom from enmity, memory, intelligence, freedom from desire and experience; he need not be a jurist, since he does not judge. Al-Mawardi and Abu Ya''la allow a non-Muslim as executive minister, al-Juwayni refuses, and Umar rebuked Abu Musa for employing a Christian secretary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17181}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17182}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183} The appointment is a revocable contract: the ruler may dismiss either minister, a minister of delegation may dismiss his own executive minister, and either may resign; a minister is dismissed for proven betrayal, negligence or incapacity, or moved to a lighter post. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17183}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17184}'
