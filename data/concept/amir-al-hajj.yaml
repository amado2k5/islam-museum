id: concept/amir-al-hajj
class: concept
kind: term
label:
  ar: "أمير الحاج"
  en: "Amir al-hajj (leader of the pilgrim caravan)"
  fr: "Amir al-hajj (chef de la caravane des pèlerins)"
  es: "Amir al-hajj (líder de la caravana de peregrinos)"
  ur: "امیر الحج ⁦(حجاج کارواں کے رہنما)⁩"
summary:
  ar: "أمير الحاج، قائد قافلة الحجاج إلى مكة. أسند النبي إلى أبي بكر قيادة الحج سنة 9هـ/630م، وترأسه بنفسه سنة 10هـ/631م، ثم صار هذا المنصب للخلفاء، وعُيّن بعضهم أمراء عنهم، وفي مصر المملوكية تحول المنصب إلى تعيين من السلاطين {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
  en: "The amir al-hajj was the leader of the caravan of pilgrims to Mecca. In 9/630 the Prophet nominated Abu Bakr to conduct the pilgrimage, and in 10/631 he presided over it himself. Thereafter the duty belonged to the caliphs, who undertook it or appointed an official; under the Mamluks in Cairo it became a secular office filled by the sultans {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
  fr: "L’amir al-hajj était le chef de la caravane des pèlerins se rendant à La Mecque. En 9/630, le Prophète désigna Abu Bakr pour conduire le pèlerinage, et en 10/631 il le présida lui-même. Par la suite, la charge revint aux califes, qui l’assumaient eux-mêmes ou nommaient un dignitaire ; sous les Mamelouks du Caire, elle devint une charge séculière pourvue par les sultans {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
  es: "El amir al-hajj era el líder de la caravana de peregrinos a La Meca. En el año 9/630, el Profeta designó a Abu Bakr para dirigir la peregrinación, y en el año 10/631 la presidió personalmente. Posteriormente, esta función recayó en los califas, quienes la asumían o designaban a un funcionario; bajo el dominio de los mamelucos en El Cairo, se convirtió en un cargo secular desempeñado por los sultanes {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
  ur: "امیر الحج مکہ جانے والے حاجیوں کے قافلے کے رہنما تھے۔ 9/630 میں نبی نے ابوبکر کو حج کے لیے نامزد کیا، اور 10/631 میں آپ نے خود اس کی صدارت کی۔ اس کے بعد یہ ذمہ داری خلفائے راشدین کی تھی جنہوں نے اس کو انجام دیا یا کوئی اہلکار مقرر کیا۔ قاہرہ میں مملوکوں کے تحت یہ ایک سیکولر دفتر بن گیا جسے سلطانوں نے بھرا تھا۔ 1 ص۔ 465}۔"
