label:
  ar: "أمير الحاج"
  en: "Amir al-hajj (leader of the pilgrim caravan)"
summary:
  ar: "أمير الحاج، قائد قافلة الحجاج إلى مكة. أسند النبي إلى أبي بكر قيادة الحج سنة 9هـ/630م، وترأسه بنفسه سنة 10هـ/631م، ثم صار هذا المنصب للخلفاء، وعُيّن بعضهم أمراء عنهم، وفي مصر المملوكية تحول المنصب إلى تعيين من السلاطين {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
  en: "The amir al-hajj was the leader of the caravan of pilgrims to Mecca. In 9/630 the Prophet nominated Abu Bakr to conduct the pilgrimage, and in 10/631 he presided over it himself. Thereafter the duty belonged to the caliphs, who undertook it or appointed an official; under the Mamluks in Cairo it became a secular office filled by the sultans {cite:encyclopaedia-of-islam-2 vol. 1 p. 465}."
