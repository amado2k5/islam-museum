label: { ar: "تحويل الأيام المختلفة إلى الأيام الوسطى", en: "Converting unequal days to mean days", ur: "غیر مساوی دنوں کو وسطی دنوں میں بدلنا" }
summary:
  ar: "يضع البتاني قاعدة لتحويل الأيام المختلفة إلى الوسطى: يؤخذ ما بين موضع الشمس الأول الأوسط المفروض وموضعها الثاني الذي تصير إليه بالمسير الأوسط، فيحفظ، ثم ما بين موضعها الأول الحقيقي والموضع الثاني بحركتها الحقيقية بأزمان مطالع البروج في الفلك المستقيم، فإن زاد عدد هذه الأزمان على أجزاء الحركة الوسطى المحفوظة عُرف الفضل بالساعات المعتدلة وزيد على الأيام المختلفة المفروضة، وإن نقص نُقص منها {cite:zij-sabi-nallino-byblion p.79}."
  en: "Al-Battani gives a rule for turning unequal days into mean days: he takes the distance between the Sun's first assumed mean place and the second place it reaches by the mean motion and keeps it, and then the distance between its first true place and the second by its true motion, in times of the ascensions of the signs in the right sphere; if the number of these times exceeds the kept parts of mean motion, the excess is found in mean hours and added to the assumed unequal days, and if less it is subtracted {cite:zij-sabi-nallino-byblion p.79}."
  ur: "البتانی غیر مساوی دنوں کو وسطی دنوں میں بدلنے کا قاعدہ دیتے ہیں: سورج کے پہلے فرض کیے ہوئے وسطی مقام اور اس دوسرے مقام کے بیچ کا فرق لیا جاتا ہے جہاں وہ وسطی چال سے پہنچتا ہے اور اسے محفوظ کیا جاتا ہے، پھر اس کے پہلے حقیقی مقام اور دوسرے مقام کے بیچ کا فرق اس کی حقیقی حرکت سے مستقیم فلک میں بروج کے مطالع کے ازمان کے ساتھ لیا جاتا ہے؛ اگر ان ازمان کی تعداد محفوظ وسطی حرکت کے اجزا سے زیادہ ہو تو زیادتی معتدل گھنٹوں میں معلوم کر کے فرض کیے ہوئے غیر مساوی دنوں میں جمع کی جاتی ہے، اور کم ہو تو گھٹا دی جاتی ہے {cite:zij-sabi-nallino-byblion p.79}۔"
