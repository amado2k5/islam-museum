label: { ar: "النَّتْر", en: "Drawing out the last urine (natr)", ur: "نتر ⁦(پیشاب کے آخری قطرات نکالنا)⁩", es: "Extraer la última orina (natr)", fr: "Recueillir la dernière urine (natr)", tr: "nötrin", id: "Neutrin" }
summary:
  ar: "النتر في اللغة جذب الشيء بشدة، وفي الفقه هو جذب بقية البول من الذكر عند الاستنجاء. وهو مقدمة للاستنجاء، وهو أخص من الاستبراء. وفي وجوبه خلاف: فذهب القاضي حسين والبغوي والنووي من الشافعية إلى وجوبه، وقصره القاضي حسين على ما إذا غلب الظن بخروج شيء بعد الاستنجاء، والجمهور على استحبابه. وكيفيته عند الحنفية بعصر الذكر، وعند غيرهم بجذب الذكر برفق ولين، وعدده عند الجمهور ثلاث مرات، لحديث: إذا بال أحدكم فلينتر ذكره ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
  en: "Natr, in the lexicon, is to pull a thing hard. In law it is drawing out the last of the urine from the penis at the time of istinja. It comes before istinja and is narrower than istibra. Jurists differ on whether it is obligatory: al-Qadi Husayn, al-Baghawi and al-Nawawi among the Shafi'is hold it obligatory, al-Qadi Husayn limiting it to a case where one thinks something will come out after istinja; the majority hold it recommended. Its manner is pressing the penis for the Hanafis and drawing it gently for others, to be gentle lest the vigour be weakened. The majority of the Malikis, Shafi'is and Hanbalis hold that it is done three times, citing the hadith: when one of you urinates, let him draw out his penis three times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
  ur: "نتر کا مطلب پیشاب کے آخری قطرات کھینچ کر نکالنا ہے۔ جمہور کے نزدیک یہ تین بار مسنون ہے، جیسا کہ حدیث میں آیا ہے: جب تم میں سے کوئی پیشاب کرے تو تین بار ذکر کو کھینچے۔ حنفیہ کے نزدیک ذکر کو دبا کر نکالا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
  es: "Natr, en el léxico, significa tirar con fuerza de algo. En derecho, se refiere a extraer la última gota de orina del pene en el momento de la istinja. Se realiza antes de la istinja y es más preciso que la istibra. Los juristas difieren en cuanto a su obligatoriedad: al-Qadi Husayn, al-Baghawi y al-Nawawi, entre los shafi'ís, la consideran obligatoria; al-Qadi Husayn la limita a los casos en que se prevé que algo saldrá después de la istinja; la mayoría la considera recomendable. La forma de realizarla consiste en presionar el pene para los hanafíes y en extraerlo suavemente para otros, para no debilitar el vigor. La mayoría de los malikíes, shafi'ís y hanbalíes sostienen que debe realizarse tres veces, citando el hadiz: «Cuando uno de vosotros orine, que extraiga su pene tres veces». {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
  fr: "Dans le lexique, « natr » signifie tirer fort sur quelque chose. En droit, il s'agit d'extraire les dernières gouttes d'urine du pénis au moment de l'istinja. Ce mouvement précède l'istinja et est plus court que l'istibra. Les juristes divergent quant à son caractère obligatoire: parmi les chaféites, al-Qadi Husayn, al-Baghawi et al-Nawawi le considèrent comme obligatoire, al-Qadi Husayn le limitant au cas où l'on craint une éjaculation après l'istinja; la majorité le recommande. La manière de procéder consiste à presser le pénis pour les hanafites et à le retirer doucement pour les autres, afin de ne pas affaiblir la vigueur. La majorité des malikites, chaféites et hanbalites estiment que ce mouvement se répète trois fois, citant le hadith: « Quand l'un d'entre vous urine, qu'il retire son pénis trois fois. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
  tr: "Dilbilimde 'natr' bir şeyi güçlü şekilde çekmek anlamına gelirken, fihhârda istinja sırasında erkekten kalan idrarı çekmektir. İstinja'nın önsözü olup, istibradan daha özgüldür. Yükümlülüğü konusunda bir fark vardır: Şafi'lerden Kadi Hüseyin, El-Baghawi ve El-Nevavi bu yükümlülüğü kabul ederken, Kadi Hüseyin bunu istinja'dan sonra bir şeyin boşaltılması olasılığı en yüksek olanla sınırlarken, çoğunluk bunu tercih etti. Hanafilere göre yöntem, anmayı anma yoluyla yapılırken, diğerleri tarafından nazik ve nazik bir şekilde hatırlama çekmektir ve çoğunluk bunu üç kez sayar, bu hadise dayanarak: 'Biriniz kötü bir nefes hissederse, üç kez okusun.' {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15487}"
  id: "Dalam linguistik, 'natr' berarti menarik sesuatu dengan kuat, dan dalam hukum, itu adalah menarik sisa urin dari pria selama istinja. Ini adalah pendahuluan untuk istinja, dan lebih spesifik daripada istibra. Ada perbedaan terkait kewajibannya: Qadi Husayn, Al-Baghawi, dan Al-Nawawi dari Syafi'i memegang kewajibannya, dan Qadi Husayn membatasinya pada apa yang kemungkinan besar adalah pembuangan sesuatu setelah istinja, sementara mayoritas lebih memilihnya. Cara menurut Hanafi adalah dengan mengingat ingatan, dan oleh yang lain dengan menarik ingatan dengan lembut dan lembut, dan mayoritas menghitungnya tiga kali, berdasarkan hadits: 'Jika salah satu dari kalian merasakan napas tidak sedap, biarkan dia mengucapkannya tiga kali.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
