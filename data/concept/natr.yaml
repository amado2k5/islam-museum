label: { ar: "النَّتْر", en: "Drawing out the last urine (natr)", ur: "نتر (پیشاب کے آخری قطرات نکالنا)" }
summary:
  ar: "النتر في اللغة جذب الشيء بشدة، وفي الفقه هو جذب بقية البول من الذكر عند الاستنجاء. وهو مقدمة للاستنجاء، وهو أخص من الاستبراء. وفي وجوبه خلاف: فذهب القاضي حسين والبغوي والنووي من الشافعية إلى وجوبه، وقصره القاضي حسين على ما إذا غلب الظن بخروج شيء بعد الاستنجاء، والجمهور على استحبابه. وكيفيته عند الحنفية بعصر الذكر، وعند غيرهم بجذب الذكر برفق ولين، وعدده عند الجمهور ثلاث مرات، لحديث: إذا بال أحدكم فلينتر ذكره ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
  en: "Natr, in the lexicon, is to pull a thing hard. In law it is drawing out the last of the urine from the penis at the time of istinja. It comes before istinja and is narrower than istibra. Jurists differ on whether it is obligatory: al-Qadi Husayn, al-Baghawi and al-Nawawi among the Shafi'is hold it obligatory, al-Qadi Husayn limiting it to a case where one thinks something will come out after istinja; the majority hold it recommended. Its manner is pressing the penis for the Hanafis and drawing it gently for others, to be gentle lest the vigour be weakened. The majority of the Malikis, Shafi'is and Hanbalis hold that it is done three times, citing the hadith: when one of you urinates, let him draw out his penis three times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
  ur: "نتر کا مطلب پیشاب کے آخری قطرات کھینچ کر نکالنا ہے۔ جمہور کے نزدیک یہ تین بار مسنون ہے، جیسا کہ حدیث میں آیا ہے: جب تم میں سے کوئی پیشاب کرے تو تین بار ذکر کو کھینچے۔ حنفیہ کے نزدیک ذکر کو دبا کر نکالا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15487}"
