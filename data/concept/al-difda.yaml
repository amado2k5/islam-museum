id: concept/al-difda
class: concept
kind: scientific
label:
  ar: الضفدع
  en: The ranula (al-difda')
  fr: "La ranule (al-difda’)"
  ur: ضفدع
summary:
  ar: الضفدع شبه غدة صلبة تكون تحت اللسان شبيهة اللون المؤتلف من لون سطح اللسان والعروق التي فيه بالضفدع وسببه رطوبة غليظة لزجة، ويجرب عليه الأدوية الأكالة المقطعة المحللة والتي فيها أفضل تجفيف من هذا الجنس فإن لم ينجع استعملت الأدوية المذكورة في الأقراباذين وأدوية القلاع القوية فإن لم ينجع لم يكن بد من عمل اليد ⁦(عمل اليد مذكور على سبيل الخبر لا الصنع)⁩ {cite:canon-ibn-sina-print-v2 p.260}
  en: 'The ranula is a kind of hard gland that forms under the tongue, resembling the frog in the colour made of the tongue''s surface and its vessels'' hues; its cause is a thick viscid moisture. The corroding cutting dissolving drugs of the best drying of this kind are tried on it; if they fail, the drugs named in the Aqrabadhin and the strong thrush-drugs are used, and if those fail there is no escape from the hand''s work (the hand-work mentioned as a report, not a procedure; the drug names and tried recipes left out) {cite:canon-ibn-sina-print-v2 p.260}'
  fr: "La ranule est une sorte de glande dure qui se forme sous la langue, ressemblant à la grenouille par la couleur composée des teintes de la surface de la langue et de ses vaisseaux ; sa cause est une humidité épaisse et visqueuse. On y expérimente les médicaments corrosifs, incisifs et dissolvants de cette catégorie ayant le meilleur pouvoir desséchant ; s’ils échouent, on utilise les médicaments nommés dans l’Aqrabadhin et les médicaments puissants contre le muguet, et s’ils échouent, l’intervention manuelle est inévitable (l’intervention manuelle est mentionnée comme un récit, non comme une procédure ; les noms des médicaments et les recettes expérimentées sont omis) {cite:canon-ibn-sina-print-v2 p.260}"
  ur: 'ضفدع ایک سخت غدود نما چیز ہے جو زبان کے تلے بنتی ہے اور زبان کی سطح اور اس کی رگوں کے میل کے رنگ میں ضفدع سے مشابہ ہوتی ہے؛ اس کا سبب گاڑھی چپچپی رطوبت ہے؛ اس پر اسی جنس کی کھانے والی مفرّق محلل اور بہترین خشک کرنے والی ادویہ آزمائی جاتی ہیں؛ اگر نہ کارگر ہوں تو قراباذین میں مذکور ادویہ اور قلاع کی قوی ادویہ استعمال ہوتی ہیں اور اگر وہ بھی نہ کریں تو ہاتھ کے عمل کے سوا چارہ نہیں ⁦(ہاتھ کا عمل خبر کے طور پر مذکور ہے نہ کہ طریقہ کار؛ ادویہ کے نام اور آزمودہ نسخے مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.260}'
