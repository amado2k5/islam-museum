id: concept/canon-exercise-of-the-old
class: concept
kind: scientific
label: { ar: "رياضة المشايخ عند ابن سينا", en: "Exercise of the old in the Canon", ur: "بزرگوں کی ورزش قانون میں" }
summary:
  ar: "يجعل ابن سينا في الفصل السادس رياضة المشايخ تابعة لحال أبدانهم وما يعتادهم من العلل وعادتهم في الرياضة: المعتدلة لمن اعتدلت أبدانهم، وللرأس الذي يعتريه الدوار أو الصرع رياضة النصف الأسفل، ولمن آفته في الرجل الرياضة الفوقانية، ولمن آفته في الصدر الفوقانية وحدها {cite:canon-ibn-sina-print-v1 p.254}."
  en: "In the sixth chapter Ibn Sina makes the exercise of the old depend on the state of their bodies, the illnesses that beset them and their habit of exercise: moderate exercise for balanced bodies, exercise of the lower half for a head troubled by vertigo or epilepsy, upper exercise for a fault in the leg, and upper exercise alone for a fault in the chest {cite:canon-ibn-sina-print-v1 p.254}."
