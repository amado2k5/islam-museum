id: concept/canon-exercise-of-the-old
class: concept
kind: scientific
label:
  ar: "رياضة المشايخ عند ابن سينا"
  en: "Exercise of the old in the Canon"
  fr: "Exercice des vieillards dans le Canon"
  ur: "بزرگوں کی ورزش قانون میں"
  es: "Ejercicio de lo antiguo en el Canon"
summary:
  ar: "يجعل ابن سينا في الفصل السادس رياضة المشايخ تابعة لحال أبدانهم وما يعتادهم من العلل وعادتهم في الرياضة: المعتدلة لمن اعتدلت أبدانهم، وللرأس الذي يعتريه الدوار أو الصرع رياضة النصف الأسفل، ولمن آفته في الرجل الرياضة الفوقانية، ولمن آفته في الصدر الفوقانية وحدها {cite:canon-ibn-sina-print-v1 p.254}."
  en: "In the sixth chapter Ibn Sina makes the exercise of the old depend on the state of their bodies, the illnesses that beset them and their habit of exercise: moderate exercise for balanced bodies, exercise of the lower half for a head troubled by vertigo or epilepsy, upper exercise for a fault in the leg, and upper exercise alone for a fault in the chest {cite:canon-ibn-sina-print-v1 p.254}."
  fr: "Au chapitre 6, Ibn Sina adapte l’exercice des vieillards à constitution, maladies et habitudes : modéré pour les équilibrés, moitié inférieure pour vertiges ou épilepsie, supérieur pour atteinte de jambe et uniquement supérieur pour atteinte thoracique {cite:canon-ibn-sina-print-v1 p.254}."
  es: "En el sexto capítulo, Ibn Sina hace que el ejercicio de los ancianos dependa del estado de sus cuerpos, las enfermedades que los aquejan y su hábito de ejercicio: ejercicio moderado para cuerpos equilibrados, ejercicio de la parte inferior del cuerpo para una cabeza afectada por vértigo o epilepsia, ejercicio de la parte superior del cuerpo para una deficiencia en la pierna y ejercicio de la parte superior del cuerpo únicamente para una deficiencia en el pecho {cite:canon-ibn-sina-print-v1 p.254}."
  ur: "چھٹے باب میں ابن سینا نے بوڑھوں کی ورزش کو ان کے جسم کی حالت، ان کو گھیرنے والی بیماریوں اور ان کی ورزش کی عادت پر منحصر کیا ہے: متوازن جسم کے لیے اعتدال پسند ورزش، چکر یا مرگی سے پریشان سر کے لیے نصف کے نچلے حصے کی ورزش، ٹانگ میں خرابی کے لیے اوپری ورزش، اور سینے کی خرابی کے لیے اکیلے اوپری ورزش: صفحہ 254}۔"
