id: concept/thoracic-nerves
class: concept
kind: scientific
label: { ar: "أعصاب فقار الصدر عند ابن سينا", en: "Thoracic nerves in the Canon", ur: "قانون میں سینے کے مہروں کے اعصاب", es: "Nervios torácicos en el Canon", fr: "Les nerfs thoraciques dans le canon", tr: "İbn Sina'ya göre torasik omurga sinirleri", id: "Saraf vertebra toraks menurut Avicenna" }
summary:
  ar: "يخصص ابن سينا الفصل الرابع من جملة العصب لأعصاب فقار الصدر، فيذكر أن الأول منها يخرج بين الفقرتين الأولى والثانية ويرافق ثامن أعصاب العنق إلى اليد، وأن سائرها يتجه إلى عضل الكتف والصلب والأضلاع والبطن {cite:canon-ibn-sina-print-v1 pp.82-83}."
  en: "Ibn Sina gives the fourth chapter of the nerves group to the nerves of the thoracic vertebrae: the first leaves between the first and second vertebrae and travels with the eighth cervical nerve to the hand, and the rest go to the muscles of the shoulder, back, ribs and abdomen {cite:canon-ibn-sina-print-v1 pp.82-83}."
  es: "Ibn Sina dedica el cuarto capítulo del grupo de nervios a los nervios de las vértebras torácicas: el primero sale entre la primera y la segunda vértebra y viaja con el octavo nervio cervical hasta la mano, y el resto va a los músculos del hombro, la espalda, las costillas y el abdomen {cite:canon-ibn-sina-print-v1 pp.82-83}."
  fr: "Ibn Sina consacre le quatrième chapitre du groupe des nerfs aux nerfs des vertèbres thoraciques: le premier part entre la première et la deuxième vertèbre et voyage avec le huitième nerf cervical jusqu'à la main, et les autres vont aux muscles de l'épaule, du dos, des côtes et de l'abdomen {cite:canon-ibn-sina-print-v1 pp.82-83}."
  ur: "ابن سینا عصبی گروپ کا چوتھا باب چھاتی کے فقرے کے اعصاب کو دیتا ہے: پہلا پتے پہلے اور دوسرے فقرے کے درمیان ہوتا ہے اور آٹھویں سروائیکل عصب کے ساتھ ہاتھ کی طرف سفر کرتا ہے اور باقی کندھے، کمر، پسلیوں اور پیٹ کے پٹھوں میں جاتا ہے۔ صفحہ 82-83}۔"
  tr: "İbn Sina, sinir serisinin dördüncü bölümünü göğüs omurlarının sinirlerine adar; birinci omurun birinci ve ikinci omurlar arasında çıkıp boynun sekizinci sinirlerine el kadar uzandığını, geri kalanların ise omuz kası, sklera, kaburgalar ve karın bölgelerine kadar uzandığını belirtir {cite:canon-ibn-sina-print-v1 s.82-83}."
  id: "Ibn Sina mendedikasikan bab keempat dari rangkaian saraf ini untuk saraf vertebra toraks, menyebutkan bahwa bab pertama keluar antara vertebra pertama dan kedua dan mengikuti saraf kedelapan leher ke tangan, sementara sisanya meluas ke otot bahu, sklera, tulang rusuk, dan abdomen {cite:canon-ibn-sina-print-v1 hlm.82-83}."
