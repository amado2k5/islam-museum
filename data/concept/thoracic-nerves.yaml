summary:
  ar: "يخصص ابن سينا الفصل الرابع من جملة العصب لأعصاب فقار الصدر، فيذكر أن الأول منها يخرج بين الفقرتين الأولى والثانية ويرافق ثامن أعصاب العنق إلى اليد، وأن سائرها يتجه إلى عضل الكتف والصلب والأضلاع والبطن {cite:canon-ibn-sina-print-v1 pp.82-83}."
  en: "Ibn Sina gives the fourth chapter of the nerves group to the nerves of the thoracic vertebrae: the first leaves between the first and second vertebrae and travels with the eighth cervical nerve to the hand, and the rest go to the muscles of the shoulder, back, ribs and abdomen {cite:canon-ibn-sina-print-v1 pp.82-83}."
