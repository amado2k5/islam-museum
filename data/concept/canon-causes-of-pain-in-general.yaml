summary:
  ar: "في الفصل التاسع عشر من التعليم الثاني يعرّف ابن سينا الوجع بأنه الإحساس بالمنافي، ويحصر أسبابه في جنسين: ما يغيّر المزاج دفعة وهو سوء المزاج المختلف، وما يفرّق الاتصال، ويبيّن أن سوء المزاج المتفق المتمكن لا يؤلم {cite:canon-ibn-sina-print-v1 pp.147-148}."
  en: "In chapter 19 of the second lesson Ibn Sina defines pain as the sensing of what is unsuitable and limits its causes to two genera: what changes the temperament suddenly, which he calls unequal bad temperament, and what breaks continuity. He shows that a settled, concordant bad temperament does not hurt {cite:canon-ibn-sina-print-v1 pp.147-148}."
