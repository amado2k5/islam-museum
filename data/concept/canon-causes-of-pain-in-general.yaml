id: concept/canon-causes-of-pain-in-general
class: concept
kind: scientific
label:
  ar: "أسباب الوجع على الإطلاق عند ابن سينا"
  en: "The causes of pain in general in the Canon"
  fr: "Causes générales de douleur dans le Canon"
  ur: "درد کے اسباب بالاطلاق، قانون کے مطابق"
  es: "Las causas del dolor en general en el Canon"
summary:
  ar: "في الفصل التاسع عشر من التعليم الثاني يعرّف ابن سينا الوجع بأنه الإحساس بالمنافي، ويحصر أسبابه في جنسين: ما يغيّر المزاج دفعة وهو سوء المزاج المختلف، وما يفرّق الاتصال، ويبيّن أن سوء المزاج المتفق المتمكن لا يؤلم {cite:canon-ibn-sina-print-v1 pp.147-148}."
  en: "In chapter 19 of the second lesson Ibn Sina defines pain as the sensing of what is unsuitable and limits its causes to two genera: what changes the temperament suddenly, which he calls unequal bad temperament, and what breaks continuity. He shows that a settled, concordant bad temperament does not hurt {cite:canon-ibn-sina-print-v1 pp.147-148}."
  fr: "Au chapitre 19 de la deuxième leçon, Ibn Sina définit la douleur comme sensation de l’inapproprié et en distingue deux genres : changement soudain de tempérament, dit mauvais tempérament inégal, et rupture de continuité. Un mauvais tempérament établi et concordant ne ferait pas mal {cite:canon-ibn-sina-print-v1 pp.147-148}."
  es: "En el capítulo 19 de la segunda lección, Ibn Sina define el dolor como la percepción de lo inadecuado y limita sus causas a dos géneros: lo que altera el temperamento repentinamente, al que llama mal temperamento desigual, y lo que rompe la continuidad. Demuestra que un mal temperamento estable y concordante no causa dolor {cite:canon-ibn-sina-print-v1 pp.147-148}."
  ur: "دوسرے سبق کے باب 19 میں ابن سینا نے درد کی تعریف کیا ہے کہ وہ کیا ہے جو نا مناسب ہے اور اس کے اسباب کو دو نسلوں تک محدود کرتا ہے: اچانک مزاج میں کیا تبدیلی آتی ہے، جسے وہ غیر مساوی خراب مزاج کہتے ہیں، اور کون سی چیز تسلسل کو توڑتی ہے۔ وہ ظاہر کرتا ہے کہ ایک طے شدہ، ہم آہنگ خراب مزاج {حوالہ:کینن-ابن سینا-پرنٹ-v1 صفحہ 147-148} کو نقصان نہیں پہنچاتا۔"
