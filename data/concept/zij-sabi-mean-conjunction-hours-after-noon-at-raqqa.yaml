label: { ar: "ساعات الاجتماع الوسطى بعد انتصاف النهار بالرقة", en: "The mean conjunction hours after noon at Raqqa", ur: "رقہ میں دوپہر کے بعد اجتماع کے اوسط گھنٹے", es: "La conjunción media horas después del mediodía en Raqqa", fr: "L'heure moyenne de conjonction après midi à Raqqa", tr: "Rakka'da orta toplantı saatleri öğleden sonradır.", id: "Waktu pertemuan tengah hari adalah setelah tengah hari di Raqqa." }
summary:
  ar: "يحسب البتاني الاجتماع الأوسط من الأيام الماضية في الشهر وساعات معتدلة من انتصاف النهار بالرقة إلى وقت الاجتماع أو الاستقبال بمسيرهما الأوسط، ثم يُعرف وسط الشمس ووسط القمر وخاصة القمر وحركة العرض لذلك الوقت من الجداول الأربعة. {cite:zij-sabi-nallino-byblion p.139}."
  en: "Al-Battani reckons the mean conjunction from the days that have passed in the month and the equated hours from noon at Raqqa to the time of conjunction or opposition by their mean motions. The mean Sun, the mean Moon, the Moon's anomaly and its motion in latitude are then taken from the four tables for that time. {cite:zij-sabi-nallino-byblion p.139}."
  ur: "البتانی اوسط اجتماع کو مہینے کے گزرے ہوئے دنوں اور رقہ میں دوپہر سے اجتماع یا مقابلے تک کے معتدل گھنٹوں سے حساب کرتے ہیں، جو ان کی اوسط حرکت سے نکلتے ہیں۔ پھر اس وقت کے لیے چار جداولوں سے سورج کا اوسط، چاند کا اوسط، چاند کا خاصہ اور عرض کی حرکت لی جاتی ہے۔ {cite:zij-sabi-nallino-byblion p.139}۔"
  es: "Al-Battani calcula la conjunción media a partir de los días transcurridos del mes y las horas equivalentes desde el mediodía en Raqqa hasta el momento de la conjunción u oposición, utilizando sus movimientos medios. A continuación, se toman el Sol medio, la Luna media, la anomalía lunar y su movimiento en latitud de las cuatro tablas correspondientes a ese momento. {cite:zij-sabi-nallino-byblion p.139}."
  fr: "Al-Battani calcule la conjonction moyenne à partir des jours écoulés dans le mois et des heures équivalentes entre midi à Raqqa et le moment de la conjonction ou de l'opposition, en fonction de leurs mouvements moyens. La position moyenne du Soleil, la position moyenne de la Lune, l'anomalie lunaire et son mouvement en latitude sont ensuite relevés dans les quatre tables correspondantes. {cite:zij-sabi-nallino-byblion p.139}."
  tr: "El-Battani, ayın orta noktasını, önceki günlerden ve Rakka'daki öğle vaktinin en uygun saatlerinden, bu orta noktanın güneşin ve ayın orta noktalarının kesişme veya karşılanma zamanına kadar hesaplar; daha sonra güneşin ve ayın orta noktalarını, özellikle de ayın orta noktalarını ve o zamana ait enlemi dört tablodan belirler. {cite:zij-sabi-nallino-byblion s.139}."
  id: "Al-Battani menghitung titik tengah bulan dari hari-hari sebelumnya dan jam-jam tengah hari di Raqqa hingga waktu konjungsi atau penerimaan di titik tengahnya, kemudian ia menentukan titik tengah matahari dan titik tengah bulan, khususnya bulan, dan garis lintang untuk waktu itu dari empat tabel. {cite:zij-sabi-nallino-byblion p.139}."
