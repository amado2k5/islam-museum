label: { ar: "ساعات الاجتماع الوسطى بعد انتصاف النهار بالرقة", en: "The mean conjunction hours after noon at Raqqa", ur: "رقہ میں دوپہر کے بعد اجتماع کے اوسط گھنٹے" }
summary:
  ar: "يحسب البتاني الاجتماع الأوسط من الأيام الماضية في الشهر وساعات معتدلة من انتصاف النهار بالرقة إلى وقت الاجتماع أو الاستقبال بمسيرهما الأوسط، ثم يُعرف وسط الشمس ووسط القمر وخاصة القمر وحركة العرض لذلك الوقت من الجداول الأربعة. {cite:zij-sabi-nallino-byblion p.139}."
  en: "Al-Battani reckons the mean conjunction from the days that have passed in the month and the equated hours from noon at Raqqa to the time of conjunction or opposition by their mean motions. The mean Sun, the mean Moon, the Moon's anomaly and its motion in latitude are then taken from the four tables for that time. {cite:zij-sabi-nallino-byblion p.139}."
  ur: "البتانی اوسط اجتماع کو مہینے کے گزرے ہوئے دنوں اور رقہ میں دوپہر سے اجتماع یا مقابلے تک کے معتدل گھنٹوں سے حساب کرتے ہیں، جو ان کی اوسط حرکت سے نکلتے ہیں۔ پھر اس وقت کے لیے چار جداولوں سے سورج کا اوسط، چاند کا اوسط، چاند کا خاصہ اور عرض کی حرکت لی جاتی ہے۔ {cite:zij-sabi-nallino-byblion p.139}۔"
