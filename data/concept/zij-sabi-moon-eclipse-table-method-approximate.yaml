class: concept
kind: scientific
label: { ar: "كسوف القمر بالجدول تقريباً", en: "The approximate table method for a lunar eclipse", ur: "چاند گرہن کا جدول سے تقریبی طریقہ", es: "El método de tabla aproximada para un eclipse lunar" }
summary:
  ar: "لمعرفة كسوف القمر بالجدول تقريباً يُدخل عرض القمر الحقيقي لوقت الاستقبال في جدولي كسوف القمر، أحدهما للبعد الأبعد والآخر للبعد الأقرب. فإن وُجد في الجدول الأقرب وحده خُذ منه الأصابع ودقائق السقوط، ثم خذ من كل جدول بقدر دقائق الجدول الثالث المقابلة لخاصة القمر المعدلة، وأضفها إلى الجدول الأبعد. وإن وقع العرض في الجدولين معاً جمعت الفضل بينهما. {cite:zij-sabi-nallino-byblion pp.162-163}"
  en: "For an approximate reading from the tables the Moon's true latitude at the time of opposition is entered in the two lunar eclipse tables, one for the farthest distance and one for the nearest. If the latitude is found in the nearer table alone, the digits and the minutes of fall are taken from it. If it falls in both, the difference between the two rows is taken and the corrections from the third table are applied to the far row. {cite:zij-sabi-nallino-byblion pp.162-163}"
  ur: "جدول سے تقریبی گرہن معلوم کرنے کے لیے مقابلے کے وقت کا چاند کا حقیقی عرض گرہن کے دو جدولوں میں داخل کیا جاتا ہے، ایک دور ترین بُعد کے لیے اور دوسرا قریب ترین کے لیے۔ اگر یہ عرض صرف قریب والے جدول میں ملے تو انگلیاں اور سقوط کے دقائق اسی سے لیے جاتے ہیں۔ اگر دونوں میں ملے تو دونوں قطاروں کا فرق لیا جاتا ہے اور تیسرے جدول کی تصحیح دور والی قطار پر لگائی جاتی ہے۔ {cite:zij-sabi-nallino-byblion pp.162-163}"
  es: "Para una lectura aproximada de las tablas, se introduce la latitud real de la Luna en el momento de la oposición en las dos tablas de eclipses lunares: una para la distancia más lejana y otra para la más cercana. Si la latitud se encuentra solo en la tabla más cercana, se toman los dígitos y los minutos de la caída. Si aparece en ambas, se calcula la diferencia entre las dos filas y se aplican las correcciones de la tercera tabla a la fila más lejana. {cite:zij-sabi-nallino-byblion pp.162-163}"
