id: concept/head-muscles
class: concept
kind: scientific
label: { ar: "عضل الرأس عند ابن سينا", en: "Muscles that move the head in the Canon", ur: "قانون میں سر کو ہلانے والے پٹھے", es: "Músculos que mueven la cabeza en el Canon", fr: "Muscles qui bougent la tête dans le canon" }
summary:
  ar: "يقسّم ابن سينا حركات الرأس إلى خاصية له ومشتركة مع خمس من خرزات العنق، ويرتّب عضلها بحسب الاتجاه: تنكيس وقلب إلى خلف وإمالة إلى الجانبين {cite:canon-ibn-sina-print-v1 pp.64-65}."
  en: "Ibn Sina divides the head's movements into its own and those shared with five neck vertebrae, and orders its muscles by direction: bowing, turning back and tilting to the sides {cite:canon-ibn-sina-print-v1 pp.64-65}."
  es: "Ibn Sina divide los movimientos de la cabeza en propios y compartidos con cinco vértebras cervicales, y ordena sus músculos por dirección: inclinación, giro hacia atrás e inclinación hacia los lados {cite:canon-ibn-sina-print-v1 pp.64-65}."
  fr: "Ibn Sina divise les mouvements de la tête en mouvements propres et en mouvements partagés avec cinq vertèbres cervicales, et ordonne ses muscles par direction: s'incliner, se tourner en arrière et s'incliner sur les côtés {cite:canon-ibn-sina-print-v1 pp.64-65}."
  ur: "ابن سینا سر کی حرکات کو اپنے اور گردن کے پانچ ریڑھ کی ہڈیوں میں تقسیم کرتا ہے، اور اس کے عضلات کو سمت کے مطابق ترتیب دیتا ہے: جھکنا، پیچھے ہٹنا اور اطراف کی طرف جھکنا"
