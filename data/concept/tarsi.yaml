summary:
  ar: "ترسي في الكتاب إحالة فقط: يقول الكتاب إنه الوسن، وإنه فرغ من بيان أفعاله في فصل الألف عند ذكره للوسن، فلا يزيد هذا الموضع على ذلك {cite:canon-ibn-sina-print-v1 p.695}"
  en: "Tarsi is in the book a cross-reference only: the book says it is the wasan and that it has finished giving its actions in the chapter of alif at the entry for the wasan, so this place adds nothing to that {cite:canon-ibn-sina-print-v1 p.695}"
  ur: "ترسی کتاب میں صرف حوالہ ہے: کتاب کہتی ہے کہ یہ وسن ہے اور یہ کہ اس کے افعال حرف الف کے باب میں وسن کے ذکر پر بیان کر چکی، چنانچہ یہ مقام اس پر کچھ اضافہ نہیں کرتا {cite:canon-ibn-sina-print-v1 p.695}۔"
  es: "Tarsi aparece en el libro solo como referencia cruzada: el libro dice que es el wasan y que ha terminado de describir sus acciones en el capítulo de alif, en la entrada correspondiente al wasan, por lo que este lugar no añade nada a eso {cite:canon-ibn-sina-print-v1 p.695}."
  fr: "Tarsi n'est mentionné dans le livre qu'à titre de référence croisée: le livre indique qu'il s'agit du wasan et que ses actions ont été entièrement décrites dans le chapitre d'alif, à l'entrée qui lui est consacrée; ce passage n'y ajoute donc rien {cite:canon-ibn-sina-print-v1 p.695}"
  tr: "Kitapta sadece bir referans var: kitapta bunun al-wassan olduğu ve alif bölümünde al-wassan'dan bahsedildiğinde eylemlerini açıklamayı tamamladığı belirtiliyor, bu yüzden burası sadece {cite:canon-ibn-sina-print-v1 s.695}"
  id: "Anda hanya menetapkan referensi dalam buku: buku itu mengatakan bahwa ia adalah al-wassan, dan bahwa ia telah menyelesaikan penjelasan tindakannya di bagian alif saat menyebut al-wassan, jadi tempat ini tidak menambahkan lebih dari itu {cite:canon-ibn-sina-print-v1 hlm.695}"
