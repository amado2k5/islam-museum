id: concept/zij-sabi-epicycle-model-for-the-suns-equation
class: concept
kind: scientific
label: { ar: "فلك التدوير في تعديل الشمس", en: "The epicycle model of the Sun's equation", ur: "سورج کے تعدیل میں فلکِ تدویر کا نمونہ", es: "El modelo epicíclico de la ecuación del Sol", fr: "Le modèle épicyclique de l'équation du Soleil" }
summary:
  ar: "في صورة فلك التدوير يجعل البتاني نصف قطر فلك التدوير الخط الذي بين المركزين، وهو جزءان وأربع دقائق ونصف وربع، ويحرك الشمس على التدوير إلى خلاف توالي البروج كل يوم بمقدار حركة الشمس الوسطى، بينما يتحرك مركز التدوير إلى توالي البروج بتلك الحركة الوسطى نفسها {cite:zij-sabi-nallino-byblion pp.72-73}."
  en: "In the epicycle picture al-Battani makes the radius of the epicycle the line between the centres, two parts, four minutes and a half and a quarter, and moves the Sun on the epicycle against the order of the signs by the mean motion each day, while the centre of the epicycle moves with the order of the signs by that same mean motion {cite:zij-sabi-nallino-byblion pp.72-73}."
  ur: "فلکِ تدویر کی صورت میں البتانی فلکِ تدویر کا نصف قطر وہی خط رکھتے ہیں جو دونوں مرکزوں کے بیچ ہے، یعنی دو اجزا، چار دقیقے، آدھا اور ایک چوتھائی، اور سورج کو تدویر پر بروج کی ترتیب کے خلاف ہر روز وسطی حرکت کی مقدار سے حرکت دیتے ہیں، جبکہ تدویر کا مرکز اسی وسطی حرکت سے بروج کی ترتیب کے ساتھ چلتا ہے {cite:zij-sabi-nallino-byblion pp.72-73}۔"
  es: "En la imagen del epiciclo, al-Battani hace que el radio del epiciclo sea la línea entre los centros, dos partes, cuatro minutos y medio y un cuarto, y mueve el Sol en el epiciclo en contra del orden de los signos por el movimiento medio cada día, mientras que el centro del epiciclo se mueve con el orden de los signos por ese mismo movimiento medio {cite:zij-sabi-nallino-byblion pp.72-73}."
  fr: "Dans le schéma de l'épicycle, al-Battani fait du rayon de l'épicycle la ligne entre les centres, deux parties, quatre minutes et demie et un quart, et déplace le Soleil sur l'épicycle contre l'ordre des signes par le mouvement moyen chaque jour, tandis que le centre de l'épicycle se déplace avec l'ordre des signes par ce même mouvement moyen {cite:zij-sabi-nallino-byblion pp.72-73}."
