summary:
  ar: "يرى ابن سينا أن العروق إذا كانت نقية والخام في شحم المعي فإن الدلك قد ينضجه، خصوصاً إذا نفذت إليه قوة أدوية مسخنة، ويسمي أدهاناً نافعة في ذلك {cite:canon-ibn-sina-print-v1 p.244}."
  en: "Ibn Sina holds that when the vessels are clean and the raw matter lies in the fat of the intestine, rubbing may ripen it, above all when the force of heating remedies is carried to it, and he names oils that serve for this {cite:canon-ibn-sina-print-v1 p.244}."
