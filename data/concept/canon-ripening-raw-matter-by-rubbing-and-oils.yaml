id: concept/canon-ripening-raw-matter-by-rubbing-and-oils
class: concept
kind: scientific
label:
  ar: "إنضاج الخام بالدلك والأدهان عند ابن سينا"
  en: "Ripening raw matter by rubbing and oils in the Canon"
  fr: "Maturation des matières crues par frictions et huiles dans le Canon"
  ur: "کچے مادے کو مالش اور تیلوں سے پکانا قانون میں"
  es: "Maduración de la materia prima mediante frotamiento y aceites en el Canon"
  tr: "İbn Sina'ya göre çiğ pişirme, ovuşturma ve boyama"
  id: "Memasak mentah dengan menggosok dan mengecat menurut Ibn Sina"
summary:
  ar: "يرى ابن سينا أن العروق إذا كانت نقية والخام في شحم المعي فإن الدلك قد ينضجه، خصوصاً إذا نفذت إليه قوة أدوية مسخنة، ويسمي أدهاناً نافعة في ذلك {cite:canon-ibn-sina-print-v1 p.244}."
  en: "Ibn Sina holds that when the vessels are clean and the raw matter lies in the fat of the intestine, rubbing may ripen it, above all when the force of heating remedies is carried to it, and he names oils that serve for this {cite:canon-ibn-sina-print-v1 p.244}."
  fr: "Lorsque les vaisseaux sont nets et les matières crues dans la graisse intestinale, Ibn Sina estime que les frictions peuvent les mûrir, surtout en y portant la vertu de remèdes réchauffants ; il nomme les huiles correspondantes {cite:canon-ibn-sina-print-v1 p.244}."
  es: "Ibn Sina sostiene que cuando los vasos están limpios y la materia cruda se encuentra en la grasa del intestino, frotarla puede madurarla, sobre todo cuando se le aplica la fuerza de los remedios calientes, y nombra aceites que sirven para esto {cite:canon-ibn-sina-print-v1 p.244}."
  ur: "ابن سینا کا خیال ہے کہ جب برتن صاف ہوتے ہیں اور کچا مادہ آنت کی چربی میں ہوتا ہے تو رگڑنے سے یہ پک سکتا ہے، سب سے بڑھ کر جب اسے گرم کرنے کی طاقت پہنچائی جائے، اور اس نے ان تیلوں کا نام دیا جو اس کے لیے کام کرتے ہیں۔"
  tr: "İbn Sina, damarlar bağırsak yağında saf ve ham ise, özellikle ısıtıcı ilaçların gücü onları deldiğinde onları olgunlaştırabileceğine inanır ve bunlara faydalı merhemler der {cite:canon-ibn-sina-print-v1 s.244}."
  id: "Ibn Sina percaya bahwa jika pembuluh darah murni dan mentah di lemak usus, gosokan dapat membuatnya matang, terutama jika kekuatan obat pemanas menembusnya, dan ia menyebutnya salep yang bermanfaat {cite:canon-ibn-sina-print-v1 hlm.244}."
