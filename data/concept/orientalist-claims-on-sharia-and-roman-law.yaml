id: concept/orientalist-claims-on-sharia-and-roman-law
class: concept
kind: term
label:
  ar: "دعوى أخذ الشريعة من القانون الروماني عند المستشرقين"
  en: "The orientalist claim that Islamic law derives from Roman law"
  es: "La afirmación orientalista de que el derecho islámico deriva del derecho romano"
  fr: "L'affirmation orientaliste selon laquelle le droit islamique dérive du droit romain"
  ur: "مستشرقین کا دعویٰ ہے کہ اسلامی قانون رومن قانون سے ماخوذ ہے۔"
  tr: "Oryantalistler arasında Şeriatın Roma hukukundan türediği iddiası"
  id: "Klaim bahwa Syariah berasal dari hukum Romawi di kalangan Orientalis"
summary:
  ar: "يذكر زقزوق أن معظم المستشرقين يميلون إلى تأثر الشريعة الإسلامية بالقانون الروماني بدرجات متفاوتة، ويذكر منهم جولد تسيهر وفون كريمر وشيلدون آموس، وأن بعضهم يقول إن الشريعة مستمدة منه. يعرض الكتاب هذه الدعوى ويردّها، ولا يصدر المتحف حكماً فيها."
  en: "Zaqzuq reports that most orientalists think Islamic law was influenced by Roman law to varying degrees, and names Goldziher, von Kremer and Sheldon Amos, some of whom say it is derived from Roman law. The book presents the claim in order to answer it; the museum gives no ruling."
  es: "Zaqzuq informa que la mayoría de los orientalistas creen que el derecho islámico estuvo influenciado por el derecho romano en diversos grados, y menciona a Goldziher, von Kremer y Sheldon Amos, algunos de los cuales afirman que deriva del derecho romano. El libro presenta esta afirmación para refutarla; el museo no se pronuncia al respecto."
  fr: "Zaqzuq rapporte que la plupart des orientalistes estiment que le droit islamique a été influencé, à des degrés divers, par le droit romain, et cite Goldziher, von Kremer et Sheldon Amos, dont certains affirment qu'il en est issu. L'ouvrage présente cette thèse afin d'y répondre; le musée, quant à lui, ne se prononce pas."
  ur: "زقزوق نے رپورٹ کیا ہے کہ زیادہ تر مستشرقین کے خیال میں اسلامی قانون رومن قانون سے مختلف ڈگریوں تک متاثر ہوا تھا، اور گولڈزہر، وان کریمر اور شیلڈن آموس کے نام ہیں، جن میں سے کچھ کا کہنا ہے کہ یہ رومن قانون سے ماخوذ ہے۔ کتاب اس کا جواب دینے کے لیے دعویٰ پیش کرتی ہے۔ میوزیم کوئی حکم نہیں دیتا۔"
  tr: "Zaqzouq, çoğu oryantalistin Roma hukukundan farklı derecelerde etkilendiğini belirtir; bunlar arasında Goldziher, von Kremer ve Sheldon Amos da vardır ve bazıları Şeriat'ın da Şeriattan türediğini söyler. Kitap bu iddiayı sunar ve çürütür, müze ise bu konuda bir karar çıkarmaz."
  id: "Zaqzouq menyebutkan bahwa sebagian besar orientalis cenderung dipengaruhi oleh hukum Romawi dalam berbagai tingkat, termasuk Goldziher, von Kremer, dan Sheldon Amos, dan beberapa mengatakan bahwa Syariah berasal darinya. Buku ini menyajikan dan membantah klaim ini, dan museum tidak mengeluarkan keputusan tentangnya."
issue:
  ar: "هل الشريعة الإسلامية مستمدة من القانون الروماني؟"
  en: "Is Islamic law derived from Roman law?"
