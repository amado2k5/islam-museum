    stance:
      ar: "الشريعة الإسلامية مستمدة من القانون الروماني، بدرجات متفاوتة عند أصحابها"
      en: "Islamic law is derived from Roman law, to varying degrees according to its holders"
    summary:
      ar: "يذكر الكتاب أن جولد تسيهر وفون كريمر وشيلدون آموس يرون أن الشريعة مستمدة من القانون الروماني، وينقل عن شيلدون آموس قوله بصراحة إن الشرع مستمد منه {cite:al-istishraq-wal-khalfiyya-azhar p. 144} {cite:al-istishraq-wal-khalfiyya-azhar p. 145}. هذه نقول يعرضها المؤلف، ولم تُراجع على أصولها بعد."
      en: "The book names Goldziher, von Kremer and Sheldon Amos as holding that sharia is derived from Roman law, and quotes Amos stating it plainly. These are the author's quotations, not yet checked against the originals."
