id: concept/orientalist-claims-on-sharia-and-roman-law
class: concept
kind: term
label:
  ar: "دعوى أخذ الشريعة من القانون الروماني عند المستشرقين"
  en: "The orientalist claim that Islamic law derives from Roman law"
summary:
  ar: "يذكر زقزوق أن معظم المستشرقين يميلون إلى تأثر الشريعة الإسلامية بالقانون الروماني بدرجات متفاوتة، ويذكر منهم جولد تسيهر وفون كريمر وشيلدون آموس، وأن بعضهم يقول إن الشريعة مستمدة منه. يعرض الكتاب هذه الدعوى ويردّها، ولا يصدر المتحف حكماً فيها."
  en: "Zaqzuq reports that most orientalists think Islamic law was influenced by Roman law to varying degrees, and names Goldziher, von Kremer and Sheldon Amos, some of whom say it is derived from Roman law. The book presents the claim in order to answer it; the museum gives no ruling."
issue:
  ar: "هل الشريعة الإسلامية مستمدة من القانون الروماني؟"
  en: "Is Islamic law derived from Roman law?"
wings: [ideas]
themes: [law-and-courts, islam-and-christianity, polemic-and-apologetic]
periods: [period/modern-era]
sources: [source/al-istishraq-wal-khalfiyya-azhar]
perspectives:
  - tradition: sunni
    id: zaqzuq-on-roman-law-claim
    stance:
      ar: "الشريعة قائمة على أصولها الخاصة، والدعوى بأخذها من القانون الروماني تضعف الاعتقاد في أصول الإسلام"
      en: "Sharia rests on its own sources, and the claim that it is taken from Roman law undermines belief in Islam's foundations"
    summary:
      ar: "يرى زقزوق أن دعوى الأخذ من القانون الروماني من محاولات المستشرقين لهدم أصلين يقوم عليهما الإسلام، هما القرآن والسنة، وأن الشك فيهما يؤدي إلى الشك في الإسلام كله {cite:al-istishraq-wal-khalfiyya-azhar p. 144}."
      en: "Zaqzuq treats the Roman-law claim as part of an effort to undo the Qur'an and Sunna, the two foundations of Islam, and says doubt about them spreads to Islam as a whole."
    holders: [source/al-istishraq-wal-khalfiyya-azhar]
    evidence:
