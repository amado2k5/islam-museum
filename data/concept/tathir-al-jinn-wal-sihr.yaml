id: concept/tathir-al-jinn-wal-sihr
class: concept
kind: belief
sensitivity: contested
label:
  ar: "تأثير الجن والسحر في حياة الناس — بين الإنكار والإثبات"
  en: "The effect of jinn and magic on people's lives — between denial and affirmation"
  ur: "لوگوں کی زندگی پر جن اور جادو کا اثر — انکار اور اثبات کے درمیان"
issue:
  ar: "مع التسليم بوجود الجن والسحر، هل لهما تأثير مباشر في بدن الإنسان وعقله، وهل يتلبس الجني الإنسان، وما حدود العلاج بالرقية، وما نصيب الطب النفسي من الظواهر التي تُنسب إليهما؟"
  en: "Granting that jinn and magic exist, do they have a direct effect on a person's body and mind, can a jinn possess a person, what are the limits of treatment by ruqya, and how much of what is ascribed to them belongs to psychiatry?"
  ur: "جن اور جادو کے وجود کو تسلیم کرتے ہوئے، کیا ان کا انسان کے جسم اور عقل پر براہِ راست اثر ہے، کیا جن انسان پر حلول کر سکتا ہے، رقیہ سے علاج کی حدود کیا ہیں، اور جو کچھ ان سے منسوب کیا جاتا ہے اس میں نفسیاتی طب کا کتنا حصہ ہے؟"
summary:
  ar: "حلقة «الوسطية» عن تأثير الجن والسحر بين الإنكار والإثبات. قال المقدّم طارق السويدان إن المسألة فرعية لكنها انتشرت حتى صارت كتب السحر والجن الأكثر مبيعاً في معارض الكتب، وإن الحلقة لا تناقش وجود الجن والسحر فهو محسوم عند المسلمين بل تأثيرهما. صوّت 68% من جمهور الاستوديو أن لهما تأثيراً مباشراً في حياة الناس و32% لا، وقال 15% فقط إنهم تلقوا معلوماتهم عن الجن والسحر من علماء الشريعة. أثبت التأثير والتلبس معالج بالرقية ومتخصصان في العقيدة، ونفى التلبس أستاذ في التفسير وطبيب نفسي، وانتهى وقت الحلقة على أن يُستكمل الحوار في حلقة تالية. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:04:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:52:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:12:30}"
  en: "The 'Al-Wasatiyya' episode on the effect of jinn and magic, between denial and affirmation. The presenter, Tareq al-Suwaidan, said the question is a secondary one but has spread so widely that books on magic and jinn are the best sellers at book fairs, and that the episode does not debate whether jinn and magic exist, which is settled for Muslims, but what effect they have. Sixty-eight percent of the studio audience voted that they have a direct effect on people's lives and 32% that they do not, and only 15% said they took their knowledge of jinn and magic from scholars of the sharia. A ruqya practitioner and two specialists in creed affirmed the effect and possession; a professor of exegesis and a psychiatrist denied possession; time ran out with the debate to be continued in a later episode. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:04:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:52:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:12:30}"
  ur: "«الوسطیہ» کی وہ قسط جو جن اور جادو کے اثر پر، انکار اور اثبات کے درمیان، ہے۔ میزبان طارق السویدان نے کہا کہ یہ فروعی مسئلہ ہے مگر اتنا پھیل گیا ہے کہ کتاب میلوں میں جادو اور جن کی کتابیں سب سے زیادہ بکتی ہیں، اور قسط جن اور جادو کے وجود پر بحث نہیں کرتی جو مسلمانوں کے ہاں طے شدہ ہے، بلکہ ان کے اثر پر۔ اسٹوڈیو حاضرین میں سے 68% نے ووٹ دیا کہ لوگوں کی زندگی پر ان کا براہِ راست اثر ہے اور 32% نے نہیں، اور صرف 15% نے کہا کہ انہوں نے جن اور جادو کے بارے میں معلومات علمائے شریعت سے لیں۔ ایک رقیہ معالج اور عقیدہ کے دو ماہرین نے اثر اور حلول کا اثبات کیا؛ تفسیر کے ایک استاد اور ایک ماہرِ نفسیات نے حلول کا انکار کیا؛ وقت ختم ہوا اور بحث اگلی قسط میں جاری رکھنے کا اعلان ہوا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:04:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:52:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:12:30}"
perspectives:
- tradition: sunni
  id: direct-effect-and-possession
  stance:
    ar: "للجن والسحر تأثير مباشر، والجني قد يتلبس الإنسان"
    en: "Jinn and magic have a direct effect, and a jinn may possess a person"
    ur: "جن اور جادو کا براہِ راست اثر ہے، اور جن انسان پر حلول کر سکتا ہے"
  summary:
    ar: "رأي المعالج الدكتور إسماعيل أبو العلاء والدكتور محمد الخطيب والدكتور عبد الكريم عبيدات: الجن عالم خفي خُلق من مادة لطيفة يمكن أن تخترق الكثيف، ولهم سلطانان: الوسوسة والدخول في عالم الإنس؛ والسحر حقيقة بنص القرآن والسنة ويؤثر بإذن الله الكوني، وأكثره بواسطة الجن {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:12:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:32:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:42:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:43:00}."
    en: "The view of the practitioner Dr Isma'il Abu al-'Ala, Dr Muhammad al-Khatib and Dr Abd al-Karim Obeidat: the jinn are a hidden world created of a subtle substance that can pass through denser matter, with two powers, whispering and entering the human world; magic is real by the text of the Qur'an and Sunna and acts by God's decree, mostly through jinn {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:12:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:32:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:42:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:43:00}."
    ur: "معالج ڈاکٹر اسماعیل ابو العلاء، ڈاکٹر محمد الخطیب اور ڈاکٹر عبد الکریم عبیدات کی رائے: جن ایک مخفی عالم ہیں جو لطیف مادے سے بنے ہیں جو کثیف میں سرایت کر سکتا ہے، ان کے دو اختیار ہیں، وسوسہ اور انسانی عالم میں داخلہ؛ جادو قرآن و سنت کی نص سے حقیقت ہے اور اللہ کے تکوینی اذن سے اثر کرتا ہے، زیادہ تر جنوں کے ذریعے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:12:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:32:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:42:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:43:00}."
