- tradition: academic
  id: psychiatric-reading
  stance:
    ar: "الظواهر المنسوبة إلى الجن أمراض نفسية مصنفة"
    en: "The phenomena ascribed to jinn are classified psychiatric illnesses"
    ur: "جنوں سے منسوب مظاہر درجہ بند نفسیاتی امراض ہیں"
  summary:
    ar: "رأي الطبيب النفسي الدكتور محمود أبو دنون: كل من يذهبون إلى المعالجين من غير الأطباء يعانون أمراضاً نفسية مصنفة، وفي التصنيف الدولي أكثر من ألف عنوان، ولكل وظيفة مركز في الدماغ لا يصل إليه إلا المتخصص، فنسبة القدرة على العبث بها إلى الجن تحميل لهم ما لا يصح؛ ومعظم الأمراض النفسية لها علاجات دوائية أو كهربائية أو نفسية أو سلوكية {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:07:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:08:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:12:00}."
    en: "The view of the psychiatrist Dr Mahmud Abu Dannun: everyone who goes to non-medical healers suffers from a classified psychiatric illness, and the international classification has more than a thousand headings; every function has a centre in the brain that only a specialist can reach, so to credit jinn with tampering with them is to load them with what is not right; and most psychiatric illnesses have treatments by medication, electrical therapy, psychotherapy or behavioural therapy {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:07:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:08:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:12:00}."
    ur: "ماہرِ نفسیات ڈاکٹر محمود ابو دنون کی رائے: جو بھی غیر طبیب معالجوں کے پاس جاتے ہیں وہ درجہ بند نفسیاتی امراض میں مبتلا ہیں، اور بین الاقوامی درجہ بندی میں ایک ہزار سے زیادہ عنوانات ہیں؛ ہر فعل کا دماغ میں مرکز ہے جس تک صرف ماہر پہنچتا ہے، لہٰذا جنوں کو ان سے چھیڑ چھاڑ کی قدرت دینا ان پر ناروا بوجھ ڈالنا ہے؛ اور اکثر نفسیاتی امراض کا علاج دوا، برقی علاج، نفسیاتی یا سلوکی علاج سے ہے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:07:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:08:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:12:00}."
