- tradition: sunni
  id: magic-as-illusion
  stance:
    ar: "السحر تخييل نتائجه حقيقية، ولا يبلغ البدن"
    en: "Magic is illusion with real results, and does not reach the body"
    ur: "جادو تخییل ہے جس کے نتائج حقیقی ہیں، اور جسم تک نہیں پہنچتا"
  summary:
    ar: "رأي الدكتور محمد الخطيب في السحر: هو تخييل يقوم به جني على حواس الإنسان، ونتائجه حقيقية، يؤثر في الجانب النفسي كالتفريق بين الزوجين ولا يسبب مرضاً عضوياً كالورم {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:48:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:49:00}."
    en: "Dr Muhammad al-Khatib's view on magic: it is an illusion worked by a jinn on a person's senses, with real results; it affects the psychological side, such as separating spouses, and does not cause organic illness such as a tumour {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:48:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:49:00}."
    ur: "جادو کے بارے میں ڈاکٹر محمد الخطیب کی رائے: یہ وہ تخییل ہے جو جن انسان کے حواس پر کرتا ہے، اس کے نتائج حقیقی ہیں؛ یہ نفسیاتی پہلو پر اثر کرتا ہے، جیسے میاں بیوی میں جدائی، اور رسولی جیسی جسمانی بیماری پیدا نہیں کرتا {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:48:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:49:00}."
  holders: []
