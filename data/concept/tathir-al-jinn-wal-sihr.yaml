- tradition: sunni
  id: whispering-only
  stance:
    ar: "لا سلطان للشيطان إلا الوسوسة، ولا تلبس"
    en: "Satan's only power is whispering; there is no possession"
    ur: "شیطان کا اختیار صرف وسوسہ ہے؛ حلول نہیں"
  summary:
    ar: "رأي الدكتور جمال أبو حسان، أستاذ التفسير وعلوم القرآن: لم يسلّط الله الشيطان على الإنسان إلا بالوسوسة، ولا آية تدل صراحة على التلبس، والأحاديث في الباب إما صحيحة غير صريحة أو صريحة غير صحيحة، ولم يجد في اللغة تفسير المس بالدخول والتحكم، والرواية المنسوبة إلى الإمام أحمد في التلبس لم يجد لها سنداً صحيحاً {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:55:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:58:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:02:30}."
    en: "The view of Dr Jamal Abu Hassan, professor of exegesis and Qur'anic sciences: God gave Satan power over people only through whispering; no verse explicitly indicates possession; the hadiths on the subject are either sound but not explicit or explicit but not sound; he found no lexicographer who explained mass as entering and controlling; and he found no sound chain for the report attributed to Imam Ahmad on possession {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:55:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:58:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:02:30}."
    ur: "تفسیر اور علومِ قرآن کے استاد ڈاکٹر جمال ابو حسان کی رائے: اللہ نے شیطان کو انسان پر صرف وسوسے کا اختیار دیا؛ کوئی آیت صراحت سے حلول پر دلالت نہیں کرتی؛ اس باب کی احادیث یا صحیح ہیں مگر صریح نہیں، یا صریح ہیں مگر صحیح نہیں؛ انہیں کوئی لغوی نہیں ملا جس نے مس کی تفسیر داخل ہو کر قابو پانے سے کی ہو؛ اور امام احمد سے منسوب حلول کی روایت کی کوئی صحیح سند انہیں نہیں ملی {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:55:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 00:58:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep30 01:02:30}."
