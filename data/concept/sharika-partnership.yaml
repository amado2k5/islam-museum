id: concept/sharika-partnership
class: concept
kind: legal
label:
  ar: "الشَّرِكة"
  en: "Sharika (partnership: ownership and contract, its kinds, conditions, effects and end)"
summary:
  ar: "الشركة لغة خلط النصيبين واختلاطهما، واصطلاحا قسمان: شركة ملك، وهي اختصاص اثنين فصاعدا بشيء واحد أو ما في حكمه، وشركة عقد، وهي التي يتم بها خلط المالين أو الحكم لصحة تصرف كل شريك في مال صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} وتنقسم شركة العقد بحسب التساوي إلى المفاوضة والعنان، وبحسب محلها إلى شركة أموال وأعمال ووجوه، وتشترط شروط عامة وخاصة تختلف فيها المذاهب، ومنها أن يكون الربح معلوم النسبة، فإن جعل لأحدهما مقدار معين من الربح بطلت الشركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10017} وللشركة أحكام وآثار: اشتراك في الأصل والغلة، وعدم لزوم العقد عند غير المالكية، ويد الشريك يد أمانة، واستحقاق الربح بالمال أو العمل أو الضمان، وتنتهي بالفسخ والإنكار والجنون والموت والردة ونحوها، وتفسد إذا اختل شرط من شروطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064}"
  en: "Sharika in language is mixing two shares; in the technical sense there are two kinds: ownership partnership, in which two or more hold one thing or its equivalent in common, and contract partnership, in which two parties' properties are mixed or by ruling, so that each may dispose of the other's share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} Contract partnership divides by equality into mufawada (full partnership) and 'inan (limited), and by object into partnerships of capital, of labour and of joint standing. Its general and special conditions differ between the schools; among the general ones, the profit must be a known proportion, and a fixed sum of profit for one partner voids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10017} The partnership has effects: joint ownership of capital and income, a partner's hand is a trust, profit is due by capital, work or guarantee, and it ends by withdrawal, denial, madness, death, apostasy and similar causes; a partnership that lacks a condition is invalid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064}"
