id: concept/sharika-partnership
class: concept
kind: legal
label:
  ar: "الشَّرِكة"
  en: "Sharika (partnership: ownership and contract, its kinds, conditions and effects)"
summary:
  ar: "الشركة لغة خلط النصيبين واختلاطهما، واصطلاحا قسمان: شركة ملك، وهي اختصاص اثنين فصاعدا بشيء واحد أو ما في حكمه، وشركة عقد، وهي التي يتم بها خلط المالين أو الحكم لصحة تصرف كل شريك في مال صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} وتنقسم شركة الملك إلى شركة دين وشركة غير دين، وإلى اختيارية واضطرارية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9994} وتنقسم شركة العقد بحسب التساوي والتفاوت إلى المفاوضة والعنان، وبحسب محلها إلى شركة أموال وأعمال ووجوه، وشركة المفاوضة عند الحنفية تشترط المساواة في رأس المال والتصرف والربح والكفالة وأهلية التصرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10011} وتنعقد الشركة بالإيجاب والقبول، ويكفي عند المالكية والحنابلة دلالة الفعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10014} ومن شروطها العامة قابلية التصرف للوكالة، وأن يكون الربح معلوم النسبة، فإن جعل لأحدهما مقدار معين من الربح بطلت الشركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10017}"
  en: "Sharika in language is mixing two shares; in the technical sense there are two kinds: ownership partnership, in which two or more hold one thing or its equivalent in common, and contract partnership, in which two parties' properties are mixed or by ruling, so that each may dispose of the other's share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} Ownership partnership divides into debt and non-debt partnership, and into voluntary and compulsory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9994} Contract partnership divides by equality into mufawada (full partnership) and 'inan (limited partnership), by object into partnerships of capital, of labour and of credit, and the Hanafis require full equality in capital, disposal, profit, surety and capacity for mufawada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10011} The contract is formed by offer and acceptance, and the Malikis and Hanbalis accept an action that shows consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10014} Among its general conditions are that the thing contracted on be deputisable, and that the profit be a known proportion; if one partner is assigned a fixed sum of profit the partnership is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10017}"
