tags: [akhlaq-browser, akhlaq-sharika]
label:
  ar: "الشَّرِكة"
  en: "Sharika (partnership: ownership and contract, its kinds, conditions, effects and end)"
  es: "Sharika (sociedad colectiva: propiedad y contrato, sus tipos, condiciones, efectos y fin)"
  fr: "Sharika (partenariat: propriété et contrat, ses types, conditions, effets et fin)"
  ur: "شارق ⁦(شراکت: ملکیت اور معاہدہ، اس کی اقسام، شرائط، اثرات اور انجام)⁩"
  tr: "Şirket"
  id: "Perusahaan"
summary:
  ar: "الشركة لغة خلط النصيبين واختلاطهما، واصطلاحا قسمان: شركة ملك، وهي اختصاص اثنين فصاعدا بشيء واحد أو ما في حكمه، وشركة عقد، وهي التي يتم بها خلط المالين أو الحكم لصحة تصرف كل شريك في مال صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} وتنقسم شركة العقد بحسب التساوي إلى المفاوضة والعنان، وبحسب محلها إلى شركة أموال وأعمال ووجوه، وتشترط شروط عامة وخاصة تختلف فيها المذاهب، ومنها أن يكون الربح معلوم النسبة، فإن جعل لأحدهما مقدار معين من الربح بطلت الشركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10017} وللشركة أحكام وآثار: اشتراك في الأصل والغلة، وعدم لزوم العقد عند غير المالكية، ويد الشريك يد أمانة، واستحقاق الربح بالمال أو العمل أو الضمان، وتنتهي بالفسخ والإنكار والجنون والموت والردة ونحوها، وتفسد إذا اختل شرط من شروطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064}"
  en: "Sharika in language is mixing two shares; in the technical sense there are two kinds: ownership partnership, in which two or more hold one thing or its equivalent in common, and contract partnership, in which two parties' properties are mixed or by ruling, so that each may dispose of the other's share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} Contract partnership divides by equality into mufawada (full partnership) and 'inan (limited), and by object into partnerships of capital, of labour and of joint standing. Its general and special conditions differ between the schools; among the general ones, the profit must be a known proportion, and a fixed sum of profit for one partner voids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10017} The partnership has effects: joint ownership of capital and income, a partner's hand is a trust, profit is due by capital, work or guarantee, and it ends by withdrawal, denial, madness, death, apostasy and similar causes; a partnership that lacks a condition is invalid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064}"
  es: "Sharika en lenguaje es mezclar dos partes; en el sentido técnico hay dos tipos: sociedad de propiedad, en la que dos o más poseen una cosa o su equivalente en común, y sociedad contractual, en la que las propiedades de dos partes se mezclan o por regla, de modo que cada una puede disponer de la parte de la otra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} La sociedad contractual se divide por igualdad en mufawada (sociedad plena) e 'inan (limitada), y por objeto en sociedades de capital, de trabajo y de posición conjunta. Sus condiciones generales y especiales difieren entre las escuelas; entre las generales, la ganancia debe ser una proporción conocida, y una suma fija de ganancia para un socio la anula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10017} La sociedad tiene efectos: propiedad conjunta del capital y de los ingresos, la mano de un socio es un fideicomiso, las ganancias se deben al capital, al trabajo o a la garantía, y termina por retiro, negación, locura, muerte, apostasía y causas similares; una sociedad que carece de una condición es inválida. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10029} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10032} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10060} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064}"
  fr: "Le terme « sharika » désigne, en langage courant, le mélange de deux parts. Techniquement, on distingue deux types de sociétés: la société de propriété, où deux ou plusieurs personnes détiennent un bien ou son équivalent en commun, et la société contractuelle, où les biens des deux associés sont mélangés, soit par un accord, soit par une convention, de sorte que chacun peut disposer de la part de l’autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9993} La société contractuelle se divise, par égalité, en mufawada (société en nom collectif) et 'inan (société à responsabilité limitée), et, selon son objet, en sociétés de capitaux, de travail et de personnes. Ses conditions générales et particulières varient selon les écoles juridiques; parmi les conditions générales, le profit doit être réparti de manière connue, et une somme fixe de profit pour un associé entraîne la nullité de la société. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10017} La société a des effets: propriété conjointe du capital et des revenus, la main d'un associé est une fiducie, le profit est dû par le capital, le travail ou la garantie, et elle prend fin par retrait, refus, folie, décès, apostasie et causes similaires; une société qui manque d'une condition est nulle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064}"
  ur: "زبان میں شارق دو حصص کو ملا رہی ہے۔ تکنیکی لحاظ سے دو قسمیں ہیں: ملکیت کی شراکت، جس میں دو یا زیادہ ایک چیز یا اس کے مساوی کو مشترک رکھتے ہیں، اور معاہدہ شراکت، جس میں دو فریقوں کی جائیدادیں مخلوط ہوں یا حکم کے ذریعے، تاکہ ہر ایک دوسرے کے حصے کا تصرف کر سکے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9992} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9993} معاہدہ کی شراکت کو مساوات کے لحاظ سے مفوادہ ⁦(مکمل شراکت)⁩ اور 'انان ⁦(محدود)⁩ میں تقسیم کیا جاتا ہے، اور سرمایہ کی مشترکہ شراکت اور مشترکہ محنت کے مقصد سے۔ اس کے عمومی اور خصوصی حالات اسکولوں کے درمیان مختلف ہیں۔ عام لوگوں میں، منافع کا ایک معلوم تناسب ہونا چاہیے، اور ایک پارٹنر کے لیے منافع کی ایک مقررہ رقم اسے باطل کر دیتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10015} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10017} شراکت کے اثرات ہوتے ہیں: سرمائے اور آمدنی کی مشترکہ ملکیت، شراکت دار کا ہاتھ ایک امانت ہے، منافع اس کا واجب الادا سرمایہ ہے، کام یا موت، موت کی ضمانت، دیوانہ وار ضمانت، واپسی اور قرض کے ذریعے۔ ارتداد اور اسی طرح کی وجوہات؛ ایسی شراکت جس میں شرط نہ ہو باطل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10029} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10032} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10060} صفحہ 10064}"
  tr: "Ortaklığın dili, iki hissenin karıştırılması ve karıştırılmasıdır ve teknik olarak iki tür vardır: mülkiyet ortaklığı, yani iki veya daha fazla eşdeğerin münhasır yargı yetkisi olan ve sözleşmeli şirket, iki varlığın veya her ortağın mülkün sahibinin tasarrufunun geçerliliğine ilişkin karardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9993} Sözleşmeli şirket, eşitlikle müzakere ve güçlendirme olarak bölünür ve konumuna göre para, işler ve yüzler şirketine ayrılır. Mezhepler arasında farklılık gösteren genel ve özel koşullar gerektirir; bunlardan birine belirli bir kâr verilirse, şirket geçersiz sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10017} Şirketin kuralları ve etkileri vardır: ana para ve gelirin paylaşılması, sözleşmenin Malikis olmayanlar için bağlayıcı olmaması, ortağın eli bir güven ve para, iş veya garanti yoluyla kâr etme hakkı, iptal, inkar, akıl hastalığı, ölüm, dinden dönme gibi durumlarla sonuçlanır ve herhangi bir şartı ihlal edilirse geçersiz olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10064}"
  id: "Bahasa kemitraan adalah pencampuran dan pencampuran dua saham, dan secara teknis ada dua jenis: kemitraan properti, yang merupakan yurisdiksi eksklusif dua atau lebih dari satu atau sesuatu yang setara, dan perusahaan kontrak, yang merupakan kasus dua aset atau keputusan tentang keabsahan disposisi masing-masing mitra atas properti pemilik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9992} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9993} Perusahaan kontrak dibagi secara setara menjadi negosiasi dan penguatan, dan menurut lokasinya, menjadi perusahaan uang, karya, dan wajah. Perusahaan ini memerlukan kondisi umum dan spesifik yang berbeda antar aliran, termasuk bahwa keuntungan harus diketahui secara proporsional; jika salah satu diberikan sejumlah keuntungan tertentu, perusahaan tersebut dibatalkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10017} Perusahaan memiliki aturan dan efek: berbagi pokok dan hasil, kontrak tidak mengikat bagi non-Malikis, tangan mitra adalah trust, dan hak atas keuntungan melalui uang, pekerjaan, atau jaminan, yang berakhir dengan pembatalan, penolakan, kegilaan, kematian, murtad, dan sejenisnya, dan menjadi tidak sah jika salah satu syaratnya dilanggar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10060} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10064}"
