summary:
  ar: "الصندل في الكتاب خشب غليظ يؤتى به من حد بلاد الصين وهو ثلاثة أصناف أصفر وأحمر وأصفر مائل إلى البياض يسمى المقاصيري، بارد في آخر الثانية يابس في الثانية، يمنع التحلب ويحلل الأورام الحارة وينفع من الصداع والخفقان في الحميات وضعف المعدة الحارة والحميات الحارة {cite:canon-ibn-sina-print-v1 pp.637-638}"
  en: "Sandal is in the book a thick wood brought from the edge of China, of three kinds, yellow, red, and a yellow inclining to white called maqasiri; cold at the end of the second degree and dry in the second, it checks flux, dissolves hot swellings and benefits headache, palpitation in fevers, weakness of a hot stomach and hot fevers {cite:canon-ibn-sina-print-v1 pp.637-638}"
  ur: "صندل کتاب میں موٹی لکڑی ہے جو چین کی سرحد سے لائی جاتی ہے، اس کی تین قسمیں ہیں، زرد، سرخ، اور سفیدی کی طرف مائل زرد جسے مقاصیری کہا جاتا ہے؛ دوسرے درجے کے آخر میں ٹھنڈا اور دوسرے میں خشک، رطوبت کے بہاؤ کو روکتا ہے، گرم ورموں کو تحلیل کرتا ہے اور سر درد، بخاروں میں دھڑکن، گرم معدے کی کمزوری اور گرم بخاروں میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.637-638}۔"
