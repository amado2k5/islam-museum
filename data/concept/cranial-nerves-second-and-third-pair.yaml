summary:
  ar: "الزوج الثاني ينقسم في عضل المقلة، والثالث له أربع شعب تذهب إلى الأحشاء والوجه والأسنان واللسان {cite:canon-ibn-sina-print-v1 pp.78-79}."
  en: "The second pair divides among the muscles of the eyeball; the third has four branches going to the viscera, face, teeth and tongue {cite:canon-ibn-sina-print-v1 pp.78-79}."
  es: "El segundo par se divide entre los músculos del globo ocular; el tercero tiene cuatro ramas que van a las vísceras, la cara, los dientes y la lengua {cite:canon-ibn-sina-print-v1 pp.78-79}."
  fr: "La deuxième paire se divise entre les muscles du globe oculaire; la troisième a quatre branches allant aux viscères, au visage, aux dents et à la langue {cite:canon-ibn-sina-print-v1 pp.78-79}."
  ur: "دوسرا جوڑا آنکھ کے بال کے پٹھوں میں تقسیم ہوتا ہے۔ تیسرے کی چار شاخیں ہیں جو عصب، چہرہ، دانت اور زبان تک جاتی ہیں"
  tr: "İkinci çift lifli kası ikiye ayırırken, üçüncü çift iç organlara, yüze, dişlere ve dile giden dört dalı vardır {cite:canon-ibn-sina-print-v1 s.78-79}."
  id: "Pasangan kedua terbagi pada otot berserat, dan yang ketiga memiliki empat cabang yang menuju ke organ perut, wajah, gigi, dan lidah {cite:canon-ibn-sina-print-v1 hlm.78-79}."
