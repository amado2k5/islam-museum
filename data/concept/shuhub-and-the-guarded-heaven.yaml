id: concept/shuhub-and-the-guarded-heaven
class: concept
kind: term
label:
  ar: "الشهب والسماء المحروسة"
  en: "The flares and the guarded heaven"
  ur: "شہاب اور محفوظ آسمان"
  es: "Las llamaradas y el cielo custodiado"
summary:
  ar: "تذكر الآيات في الجن والصافات والحجر والملك أن السماء الدنيا محروسة من كل شيطان وأن من استرق السمع أتبعه شهاب، وفي صحيح البخاري أن الملائكة تضرب بأجنحتها خضعاناً إذا قضى الله أمراً فيسمع مسترقو السمع كلمة يلقونها إلى الكهان {cite:sahih-al-bukhari 4701}، وأن الشياطين حيل بينها وبين خبر السماء وأُرسلت عليها الشهب عند بعثة النبي {cite:sahih-al-bukhari 4921}؛ واختلف المفسرون هل كانت الشهب قبل البعثة، ورجّح الرازي أنها كانت ثم زيدت وقويت {cite:mafatih-al-ghayb-dar-al-hadith-2012-v15 pp. 466-468}."
  en: "The verses in al-Jinn, al-Saffat, al-Hijr and al-Mulk say the lowest heaven is guarded against every devil and that whoever steals a hearing is followed by a flare; in Sahih al-Bukhari, when God decrees a matter the angels beat their wings in submission and those who steal the hearing catch a word that they cast to soothsayers {cite:sahih-al-bukhari 4701}, and at the time of the Prophet's mission the devils were barred from the heaven's news and flares were sent against them {cite:sahih-al-bukhari 4921}; the exegetes differed over whether the flares existed before the mission, and al-Razi judged that they did and were then increased and strengthened {cite:mafatih-al-ghayb-dar-al-hadith-2012-v15 pp. 466-468}."
  ur: "الجن، الصافات، الحجر اور الملک کی آیات بتاتی ہیں کہ آسمانِ دنیا ہر شیطان سے محفوظ ہے اور جو چوری سے سنے اس کے پیچھے شہاب لگتا ہے؛ صحیح بخاری میں ہے کہ اللہ جب کوئی حکم فیصلہ کرتا ہے تو فرشتے عاجزی سے پر مارتے ہیں اور چوری سننے والے ایک کلمہ پکڑ کر کاہنوں تک پہنچاتے ہیں {cite:sahih-al-bukhari 4701}، اور نبی کی بعثت کے وقت شیاطین کے لیے آسمان کی خبر سے رکاوٹ کھڑی ہوئی اور ان پر شہاب بھیجے گئے {cite:sahih-al-bukhari 4921}؛ مفسرین میں اختلاف ہوا کہ شہاب بعثت سے پہلے تھے یا نہیں، اور رازی نے ترجیح دی کہ وہ تھے پھر بڑھا کر مضبوط کیے گئے {cite:mafatih-al-ghayb-dar-al-hadith-2012-v15 pp. 466-468}۔"
  es: "Los versículos en al-Jinn, al-Saffat, al-Hijr y al-Mulk dicen que el cielo más bajo está protegido contra todo demonio y que quien roba una audición es perseguido por una llamarada; en Sahih al-Bukhari, cuando Dios decreta un asunto, los ángeles baten sus alas en sumisión y aquellos que roban la audición captan una palabra que lanzan a los adivinos {cite:sahih-al-bukhari 4701}, y en el momento de la misión del Profeta, los demonios fueron excluidos de las noticias del cielo y se enviaron llamaradas contra ellos {cite:sahih-al-bukhari 4921}; los exégetas discreparon sobre si las llamaradas existían antes de la misión, y al-Razi juzgó que sí existían y que luego se incrementaron y fortalecieron {cite:mafatih-al-ghayb-dar-al-hadith-2012-v15 pp. 466-468}."
