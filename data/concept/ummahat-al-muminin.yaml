id: concept/ummahat-al-muminin
class: concept
kind: legal
label: { ar: "أمهات المؤمنين", en: "Ummahat al-muminin (the mothers of the believers: the wives of the Prophet)" }
summary:
  ar: "أمهات المؤمنين نساء النبي اللاتي عقد عليهن ودخل بهن، وعددهن اثنتا عشرة، وتوفي عن تسع منهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404} ويشترط فيهن الإسلام والحرية وعدم الامتناع عن الهجرة والتنزه عن الزنى، وتحرم نكاحهن على التأبيد بنص القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407} وقد اختلف الفقهاء في دخولهن في أهل البيت، وفي عقوبة قذفهن، فقال بعضهم بالقتل في قذف عائشة، وقال آخرون بالحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409}"
  en: "The mothers of the believers are the women the Prophet married and consummated with, twelve in number; nine were with him at his death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404} The conditions for them are Islam, freedom, no refusal of the migration and chastity, and their marriage was forbidden to others for ever by the text of the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407} The jurists differ on whether they belong to the household of the Prophet and on the penalty for slandering them, some holding death for slander of Aisha and others a hadd penalty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409}"
