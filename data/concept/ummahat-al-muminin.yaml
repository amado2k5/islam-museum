class: concept
kind: legal
label: { ar: "أمهات المؤمنين", en: "Ummahat al-muminin (the mothers of the believers: the wives of the Prophet)" }
summary:
  ar: "أمهات المؤمنين نساء النبي اللاتي عقد عليهن ودخل بهن، وعددهن اثنتا عشرة، وتوفي عن تسع منهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404} ويشترط فيهن الإسلام والحرية وعدم الامتناع عن الهجرة والتنزه عن الزنى، وتحرم نكاحهن على التأبيد بنص القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407} وقد اختلف الفقهاء في دخولهن في أهل البيت، وفي عقوبة قذفهن، فقال بعضهم بالقتل في قذف عائشة، وقال آخرون بالحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} وتبحث رسالة عبد الرزاق بن عبد المحسن البدر «أزواج النبي أمهات المؤمنين» ⁦(دار ابن عفان⁩ فقه الآية في خمس عشرة مسألة، منها خلاف في دخول المؤمنات في عموم الأمومة: فروي عن عائشة أن الإضافة للرجال، وعن أم سلمة «أنا أم الرجال منكم والنساء»، وجُمع بينهما بأن الأولى للتحريم والثانية للتعظيم {cite:azwaj-nabi p.47}{cite:azwaj-nabi p.49}{cite:azwaj-nabi p.50}، وأن إخوة أزواج النبي وبناتهن لا يُلحقون بأحكام النسب كالأخوال والخالات وإنما ثبتت الحرمة دون سائر الأحكام كما في الرضاع، مع جواز إطلاق «خال المؤمنين» على معاوية بمعنى التعظيم لا النسب {cite:azwaj-nabi p.51}{cite:azwaj-nabi p.53}{cite:azwaj-nabi p.54}"
  en: "The mothers of the believers are the women the Prophet married and consummated with, twelve in number; nine were with him at his death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404} The conditions for them are Islam, freedom, no refusal of the migration and chastity, and their marriage was forbidden to others for ever by the text of the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407} The jurists differ on whether they belong to the household of the Prophet and on the penalty for slandering them, some holding death for slander of Aisha and others a hadd penalty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} Al-Badr's treatise «Azwaj al-Nabi ummahat al-muminin» (Dar Ibn Affan) examines the jurisprudence of the verse across fifteen issues, including the dispute over whether believing women are covered by the motherhood: Aisha is reported to restrict it to men while Umm Salama says «I am the mother of your men and your women», reconciled as the first meaning prohibition and the second honour {cite:azwaj-nabi p.47}{cite:azwaj-nabi p.49}{cite:azwaj-nabi p.50}, and that the wives' brothers and daughters are not attached to nasab rulings such as maternal uncles and aunts — only the prohibition is established, as in suckling — though «khal al-mu'minin» may be applied to Mu'awiya as a title of honour, not lineage {cite:azwaj-nabi p.51}{cite:azwaj-nabi p.53}{cite:azwaj-nabi p.54}"
