label: { ar: "أمهات المؤمنين", en: "Ummahat al-muminin (the mothers of the believers: the wives of the Prophet)", es: "Ummahat al-muminin (las madres de los creyentes: las esposas del Profeta)", fr: "Ummahat al-muminin (les mères des croyants: les épouses du Prophète)", ur: "امہات المومنین ⁦(مومنوں کی مائیں: نبی کی بیویاں)⁩", tr: "İnananların Anneleri", id: "Ibu-ibu Para Penganut" }
summary:
  ar: "أمهات المؤمنين نساء النبي اللاتي عقد عليهن ودخل بهن، وعددهن اثنتا عشرة، وتوفي عن تسع منهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404} ويشترط فيهن الإسلام والحرية وعدم الامتناع عن الهجرة والتنزه عن الزنى، وتحرم نكاحهن على التأبيد بنص القرآن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407} وقد اختلف الفقهاء في دخولهن في أهل البيت، وفي عقوبة قذفهن، فقال بعضهم بالقتل في قذف عائشة، وقال آخرون بالحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} وتبحث رسالة عبد الرزاق بن عبد المحسن البدر «أزواج النبي أمهات المؤمنين» ⁦(دار ابن عفان⁩ فقه الآية في خمس عشرة مسألة، منها خلاف في دخول المؤمنات في عموم الأمومة: فروي عن عائشة أن الإضافة للرجال، وعن أم سلمة «أنا أم الرجال منكم والنساء»، وجُمع بينهما بأن الأولى للتحريم والثانية للتعظيم {cite:azwaj-nabi p.47}{cite:azwaj-nabi p.49}{cite:azwaj-nabi p.50}، وأن إخوة أزواج النبي وبناتهن لا يُلحقون بأحكام النسب كالأخوال والخالات وإنما ثبتت الحرمة دون سائر الأحكام كما في الرضاع، مع جواز إطلاق «خال المؤمنين» على معاوية بمعنى التعظيم لا النسب {cite:azwaj-nabi p.51}{cite:azwaj-nabi p.53}{cite:azwaj-nabi p.54}"
  en: "The mothers of the believers are the women the Prophet married and consummated with, twelve in number; nine were with him at his death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404} The conditions for them are Islam, freedom, no refusal of the migration and chastity, and their marriage was forbidden to others for ever by the text of the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407} The jurists differ on whether they belong to the household of the Prophet and on the penalty for slandering them, some holding death for slander of Aisha and others a hadd penalty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} Al-Badr's treatise «Azwaj al-Nabi ummahat al-muminin» (Dar Ibn Affan) examines the jurisprudence of the verse across fifteen issues, including the dispute over whether believing women are covered by the motherhood: Aisha is reported to restrict it to men while Umm Salama says «I am the mother of your men and your women», reconciled as the first meaning prohibition and the second honour {cite:azwaj-nabi p.47}{cite:azwaj-nabi p.49}{cite:azwaj-nabi p.50}, and that the wives' brothers and daughters are not attached to nasab rulings such as maternal uncles and aunts — only the prohibition is established, as in suckling — though «khal al-mu'minin» may be applied to Mu'awiya as a title of honour, not lineage {cite:azwaj-nabi p.51}{cite:azwaj-nabi p.53}{cite:azwaj-nabi p.54}"
  es: "Las madres de los creyentes son las mujeres con las que el Profeta se casó y consumó el matrimonio, doce en total; nueve estaban con él a su muerte. Las condiciones para ellas son el Islam, la libertad, no rechazar la migración y la castidad, y su matrimonio fue prohibido a otros para siempre por el texto del Corán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407} Los juristas difieren en cuanto a si pertenecen a la casa del Profeta y en cuanto al castigo por calumniarlas, algunos sostienen la muerte por calumniar a Aisha y otros un castigo severo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407}{cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3408}{cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} Tratado de Al-Badr «Azwaj al-Nabi ummah al-muminin» (Dar Ibn Affan) examina la jurisprudencia del verso en quince cuestiones, incluida la disputa sobre si las mujeres creyentes están cubiertas por la maternidad: se informa que Aisha la restringe a los hombres, mientras que Umm Salama dice, reconciliado como primer significado prohibición y segundo honor {cite:azwaj-nabi p.47}{cite:azwaj-nabi p.49}{cite:azwaj-nabi p.50}, y que los hermanos e hijas de las esposas no están apegados a las normas nasab, como las relativas a la maternidad. tíos y tías —solo se establece la prohibición, como en la lactancia— aunque \"khal al-mu'minin\" puede aplicarse a Mu'awiya como un título de honor, no de linaje {cite:azwaj-nabi p.51}{cite:azwaj-nabi p.53}{cite:azwaj-nabi p.54}"
  fr: "Les mères des croyants sont les femmes avec lesquelles le Prophète s'est marié et a consommé son mariage, au nombre de douze; neuf d'entre elles étaient présentes à son décès. Les conditions requises pour elles sont l'islam, la liberté, l'acceptation de l'émigration et la chasteté. Leur mariage est interdit à tout autre par le texte du Coran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3404}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407} Les juristes divergent quant à leur appartenance à la famille du Prophète et quant à la peine encourue pour les calomnier; certains préconisent la peine de mort pour la calomnie d'Aïcha, tandis que d'autres imposent une peine sévère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3407}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3408}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3409} Traité d'Al-Badr «Azwaj al-Nabi ummah al-muminin» (Dar Ibn Affan) examine la jurisprudence du verset à travers quinze questions, y compris le différend sur la question de savoir si les femmes croyantes sont couvertes par la maternité: Aïcha la limiterait aux hommes tandis qu'Umm Salama dit, réconcilié comme le premier sens de l'interdiction et le deuxième honneur {cite:azwaj-nabi p.47}{cite:azwaj-nabi p.49}{cite:azwaj-nabi p.50}, et que les frères et filles des épouses ne sont pas attachés aux décisions du Nasab telles que les oncles maternels et tantes — seule l'interdiction est établie, comme pour l'allaitement — bien que « khal al-mu'minin » puisse être appliqué à Mu'awiya comme titre d'honneur, et non de lignée {cite:azwaj-nabi p.51}{cite:azwaj-nabi p.53}{cite:azwaj-nabi p.54}"
  ur: "مومنوں کی مائیں وہ عورتیں ہیں جن سے نبی نے شادی کی اور جن سے ان کی پیدائش ہوئی، ان کی تعداد بارہ ہے۔ ان کی موت کے وقت نو ان کے ساتھ تھے۔ ان کے لیے شرائط اسلام، آزادی، ہجرت سے انکار اور عفت و عصمت ہے، اور ان کی شادی کو قرآن کے متن سے ہمیشہ کے لیے حرام قرار دیا گیا تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3404}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.3405}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiy-noor-v3 p.3406}{cite:fiqh-mawsua-kuwaitiy-noor-v3 p.3405} فقہا کا اس میں اختلاف ہے کہ آیا ان کا تعلق نبی کے خاندان سے ہے اور ان پر غیبت کی سزا، کچھ کے لیے عائشہ ا کی غیبت کی سزا موت ہے اور کچھ کے لیے سخت سزا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3407}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3408}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3409} البدرۃ المنوعۃ المومنین۔ ⁦(دار ابن عفان)⁩ پندرہ مسائل میں آیت کے فقہ کا جائزہ لیتے ہیں، جس میں یہ تنازعہ بھی شامل ہے کہ آیا مومن عورتیں زچگی کے دائرے میں آتی ہیں: عائشہ ا نے اسے مردوں تک محدود کرنے کی روایت کی ہے جبکہ ام سلمہ ا کہتی ہیں، صلح کا پہلا معنی ممانعت اور دوسرا اعزاز ہے۔ صفحہ 49 {حوالہ: ازواج النبی ص 50}، اور یہ کہ بیویوں کے بھائی اور بیٹیاں ناصبی احکام جیسے ماموں اور پھوپھیوں سے وابستہ نہیں ہیں - صرف ممانعت قائم ہے، جیسا کہ دودھ پلانے میں - اگرچہ معاویہ پر \"خل المومنین\" کا اطلاق بطور اعزازی عنوان کے طور پر کیا جا سکتا ہے، نہیں صفحہ 51}{حوالہ:ازواج النبی ص53}{جواز نبوی صفحہ 54}"
  tr: "İnananların Anneleri, Peygamber'in evlenip tamamlandığı eşlerdi; toplamda on iki kişi vardı ve dokuz kişiden o öldü. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3404} İslam'a, özgürlüğe, göç etmemeye ve zinadan kaçınmaya tabi olmalıdırlar ve Kur'an metninde evliliklerinin sonsuza dek olması yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3407} Hukukçular, Ehl-Beyt arasında yer almaları ve karalamanın cezası konusunda farklı görüştedir; bazıları Aisha'ya iftira atmanın ölüm cezası, bazıları ise ceza olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3407} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3408} {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.3409} Abd al-Razzaq ibn Abd al-Muhsin al-Badr'ın risalesi, 'Peygamber'in eşleri, müminlerin anneleri' (Dar İbn Affan, Fiqh al-Ayah) (Dar İbn Affan, Fiqh al-Ayah) konusunda, inanan kadınların anneliğin genel terimine dahil edilmesi konusundaki anlaşmazlık da dahil olmak üzere, Aişe'den rivayet edilmiştir ki bu ekleme erkekler içindir, Um Selama'dan ise 'Ben sizin aranızda erkeklerin ve kadınların annesiyim' ve bunları ilkiyle yasaklama, ikincisini yüceltmek için birleştirmiştir. {atıf:azwaj-nabi s.47}{alıntı: azwaj-nabi s.49}{cite:azwaj-nabi s.50} ve Peygamber'in eşlerinin ve kızlarının kardeşleri ve kızları, anne tarafından amcalar ve teyzeler gibi soy kurallarına bağlı değildir, ancak kutsallık diğer kurallar üzerinde, örneğin emzirmede olduğu gibi, Muaviye'ye 'anne tarafından amca' denilmesinin soy değil, saygı anlamında kabul edilir. {cite:azwaj-nabi s.51}{cite:azwaj-nabi s.53}{cite:azwaj-nabi s.54}"
  id: "Para Ibu Orang Beriman adalah istri Nabi yang dinikahinya dan disempurnakan, berjumlah dua belas, dan ia meninggal dari sembilan di antaranya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3404} Mereka harus tunduk pada Islam, kebebasan, tidak menahan migrasi, dan menjauhi perselingkuhan, dan pernikahan mereka dilarang oleh teks Al-Qur'an untuk selamanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3406} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3407} Para ahli hukum berbeda pendapat mengenai pencantuman mereka dalam Ahl al-Bayt dan hukuman atas pencemaran nama baik mereka; ada yang bilang hukuman mati untuk mencemarkan nama baik Aisha, sementara yang lain bilang itu hukuman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3407} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3409} Risalah Abd al-Razzaq ibn Abd al-Muhsin al-Badr membahas 'Istri-istri Nabi, ibu-ibu para mukmin' (Dar Ibn Affan, Fiqh al-Ayah tentang lima belas isu, termasuk perbedaan pendapat tentang memasukkan perempuan beriman dalam istilah umum keibuan: diceritakan dari Aisha bahwa penambahan itu untuk laki-laki, dan dari um Salama 'Aku adalah ibu dari laki-laki di antara kamu dan perempuan,' lalu ia menggabungkan mereka dengan yang pertama untuk larangan dan yang kedua untuk pemuliaan. {cite:Azwaj-Nabi hlm.47}{cite: azwaj-nabi hlm.49}{cite:azwaj-nabi hlm.50}, dan bahwa saudara laki-laki dan perempuan istri dan putri Nabi tidak terikat oleh aturan garis keturunan seperti paman dan bibi dari pihak ibu, melainkan kesucian ditetapkan atas aturan lain, seperti dalam menyusui, dengan izin menyebut Muawiyah 'paman dari pihak ibu' dalam arti penghormatan, bukan garis keturunan. {cite:azwaj-nabi hlm.51}{cite:azwaj-nabi hlm.53}{cite:azwaj-nabi hlm.54}"
