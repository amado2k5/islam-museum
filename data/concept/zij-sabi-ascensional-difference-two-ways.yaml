class: concept
kind: scientific
label: { ar: "اختلاف النهار لدرجة من الفلك بطريقين في الزيج الصابي", en: "The difference of the day for a degree, in two ways", ur: "ایک درجے کے لیے اختلاف النہار دو طریقوں سے", es: "La diferencia del día para un título, en dos formas", fr: "La différence du jour pour un diplôme, de deux manières" }
summary:
  ar: "يعطي البتاني طريقتين لمعرفة حصة درجة من اختلاف النهار، أي الفرق بين مطلعها في البلد ومطلعها في الفلك المستقيم: الأولى بوتر مطالع الفلك المستقيم ووتر نصف زيادة النهار الأطول، والثانية بوتر عرض البلد ووتر ميل الدرجة. ثم يُنقص الناتج من مطالع الفلك المستقيم إن كان الميل شمالياً ويُزاد عليها إن كان جنوبياً. {cite:zij-sabi-nallino-byblion p.43}."
  en: "Al-Battani gives two ways of finding the share of a degree in the difference of the day, that is, the gap between its rising in the place and its rising in the right sphere: the first by the chord of the right-sphere risings and the chord of half the excess of the longest day, the second by the chord of the place's latitude and the chord of the degree's declination. The result is then subtracted from the right-sphere risings if the declination is northern and added to them if it is southern. {cite:zij-sabi-nallino-byblion p.43}."
  ur: "البتانی ایک درجے کا اختلاف النہار میں حصہ، یعنی شہر میں اس کے مطلع اور فلک مستقیم میں اس کے مطلع کا فرق، معلوم کرنے کے دو طریقے دیتے ہیں: پہلا فلک مستقیم کے مطالع کے وتر اور سب سے بڑے دن کی زیادتی کے نصف کے وتر سے، دوسرا شہر کے عرض کے وتر اور درجے کے میل کے وتر سے۔ پھر حاصل کو فلک مستقیم کے مطالع سے گھٹایا جاتا ہے اگر میل شمالی ہو اور بڑھایا جاتا ہے اگر جنوبی ہو۔ {cite:zij-sabi-nallino-byblion p.43}۔"
  es: "Al-Battani propone dos maneras de calcular la proporción de un grado en la diferencia del día, es decir, la diferencia entre su salida en el lugar y su salida en la esfera derecha: la primera, mediante la cuerda de las salidas en la esfera derecha y la cuerda de la mitad del exceso del día más largo; la segunda, mediante la cuerda de la latitud del lugar y la cuerda de la declinación del grado. El resultado se resta de las salidas en la esfera derecha si la declinación es norte y se suma a ellas si es sur. {cite:zij-sabi-nallino-byblion p.43}."
  fr: "Al-Battani propose deux méthodes pour calculer la contribution d'un degré à la différence de durée du jour, c'est-à-dire l'écart entre son lever dans le lieu et son lever dans la sphère droite: la première consiste à utiliser la corde des levers dans la sphère droite et la corde correspondant à la moitié de l'excédent du jour le plus long; la seconde, à utiliser la corde de la latitude du lieu et la corde de la déclinaison du degré. Le résultat est ensuite soustrait des levers dans la sphère droite si la déclinaison est nord, et ajouté à ces derniers si elle est sud. {cite:zij-sabi-nallino-byblion p.43}."
