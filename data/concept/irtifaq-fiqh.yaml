id: concept/irtifaq-fiqh
class: concept
kind: legal
label:
  ar: "ارتفاق"
  en: "Irtifaq (the rights of use attached to property: the public places, the house's amenities and the watercourses)"
  ur: "ارتفاق ⁦(جائیداد سے متعلق حقوقِ انتفاع: عام راستے، گھر کی سہولیات اور نالیاں)⁩"
  es: "Irtifaq (los derechos de uso asociados a la propiedad: los lugares públicos, las comodidades de la casa y los cursos de agua)"
  fr: "Irtifaq (les droits d'usage attachés à la propriété: les lieux publics, les équipements de la maison et les cours d'eau)"
  tr: "İrtifak hakkı"
  id: "Hak Guna"
summary:
  ar: "الارتفاق في الفقه حق الانتفاع المتصل بالعقار، لعقار آخر أو لعامة الناس، كالمرافق والمسيل والشرب، ويكون بإذن الشارع أو المالك أو بمقتضى التصرف، وأصله الإباحة ما لم يضر، ويرجع في مدته إلى الحد المعتاد أو المدة المعينة، ومن سبق إلى الانتفاع بالطريق العام فهو أحق به ما دام متاعه فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2093}"
  en: "In law, irtifaq is a right of use attached to property, either for another property or for the public, such as amenities, watercourses and water shares. It arises from the Lawgiver's leave, the owner's leave or the requirement of a transaction; its basic ruling is permissibility so long as no harm is done; its duration is fixed by the term or the customary measure; and whoever reaches a public place first has the better claim to it while his goods remain there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2093}"
  ur: "فقہ میں ارتفاق وہ حقِ انتفاع ہے جو جائیداد سے متصل ہو، دوسری جائیداد کے لیے ہو یا عام لوگوں کے لیے، جیسے مرافق، مسیل اور شرب۔ یہ شارع یا مالک کے اذن سے یا تصرف کے تقاضے سے ثابت ہوتا ہے؛ اس کا اصل حکم اباحت ہے جب تک نقصان نہ ہو؛ اس کی مدت مقررہ مدت یا معتاد حد سے طے ہوتی ہے، اور جو عام راستے کے انتفاع میں پہلے پہنچے وہ اپنے سامان کی موجودگی تک اس کا زیادہ حقدار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2093}"
  es: "En derecho, el irtifaq es un derecho de uso asociado a una propiedad, ya sea para otra propiedad o para el público, como servicios, cursos de agua y derechos de agua. Surge de la autorización del legislador, del propietario o de la exigencia de una transacción; su norma básica es la permisibilidad siempre que no se cause daño; su duración está fijada por el plazo o la medida consuetudinaria; y quien llega primero a un lugar público tiene mejor derecho sobre él mientras sus bienes permanezcan allí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2093}"
  fr: "En droit, l'irtifaq est un droit d'usage attaché à un bien, qu'il soit détenu par autrui ou destiné au domaine public, comme les équipements, les cours d'eau et les droits d'eau. Il découle de la permission du Législateur, de celle du propriétaire ou des exigences d'une transaction; son principe fondamental est la licéité tant qu'aucun préjudice n'est causé; sa durée est fixée par le terme convenu ou la mesure coutumière; et celui qui atteint un lieu public en premier a un droit prioritaire sur celui-ci tant que ses biens s'y trouvent."
  tr: "Hukukta, irtifak hakkı, başka bir mülk veya genel halk için gayrimenkul ile bağlantılı kullanım hakkıdır; örneğin kamu hizmetleri, su kanalları veya içme suyu gibi. Bu, yasa koyucu, mülk sahibi veya tasarruf işlemiyle izinlidir. Asıl ilkesi, zarar vermediği sürece izin verilir. Süresi olağan veya belirlenmiş sınırla sınırlıdır. Daha önce kamu yolundan yararlanan kişi, mülkü orada olduğu sürece bu yola hak kazanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2093}"
  id: "Dalam yurisprudensi, hak guna adalah hak usufruct yang terkait dengan properti untuk properti lain atau untuk masyarakat umum, seperti utilitas, saluran air, atau air minum. Hak ini diizinkan oleh pemberi undang-undang, pemilik, atau oleh tindakan pengurusan. Prinsip aslinya adalah diperbolehkan selama tidak menimbulkan kerugian. Durasinya dibatasi pada batas biasa atau yang ditentukan. Siapa pun yang sebelumnya telah mendapatkan manfaat dari jalan umum berhak atas hak tersebut selama propertinya masih ada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2093} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2093}"
