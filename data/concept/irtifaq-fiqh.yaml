id: concept/irtifaq-fiqh
class: concept
kind: legal
label:
  ar: "ارتفاق"
  en: "Irtifaq (the rights of use attached to property: the public places, the house's amenities and the watercourses)"
  ur: "ارتفاق (جائیداد سے متعلق حقوقِ انتفاع: عام راستے، گھر کی سہولیات اور نالیاں)"
summary:
  ar: "الارتفاق في الفقه حق الانتفاع المتصل بالعقار، لعقار آخر أو لعامة الناس، كالمرافق والمسيل والشرب، ويكون بإذن الشارع أو المالك أو بمقتضى التصرف، وأصله الإباحة ما لم يضر، ويرجع في مدته إلى الحد المعتاد أو المدة المعينة، ومن سبق إلى الانتفاع بالطريق العام فهو أحق به ما دام متاعه فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2093}"
  en: "In law, irtifaq is a right of use attached to property, either for another property or for the public, such as amenities, watercourses and water shares. It arises from the Lawgiver's leave, the owner's leave or the requirement of a transaction; its basic ruling is permissibility so long as no harm is done; its duration is fixed by the term or the customary measure; and whoever reaches a public place first has the better claim to it while his goods remain there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2093}"
  ur: "فقہ میں ارتفاق وہ حقِ انتفاع ہے جو جائیداد سے متصل ہو، دوسری جائیداد کے لیے ہو یا عام لوگوں کے لیے، جیسے مرافق، مسیل اور شرب۔ یہ شارع یا مالک کے اذن سے یا تصرف کے تقاضے سے ثابت ہوتا ہے؛ اس کا اصل حکم اباحت ہے جب تک نقصان نہ ہو؛ اس کی مدت مقررہ مدت یا معتاد حد سے طے ہوتی ہے، اور جو عام راستے کے انتفاع میں پہلے پہنچے وہ اپنے سامان کی موجودگی تک اس کا زیادہ حقدار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2090} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2091} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2092} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2093}"
