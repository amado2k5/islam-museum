label:
  ar: "الله"
  en: "Allah (God the Unique: the Qur'anic God, his Oneness and his Names)"
summary:
  ar: "الله، الإله الواحد الأحد الخالق ورب الحساب، محور الفكر الإسلامي وعلة وجوده؛ وقد عرفه عرب الجاهلية إلهًا من آلهة مكة، ولعله الإله الأعلى وخالق الكون، والمقال يرجح أن اللفظ من «الإله» بأل. وبدأ الوحي بصيغة الرب الخالق، ثم صار التوحيد المحور، وتجلّت صفاته في الأسماء الحسنى {cite:encyclopaedia-of-islam-2 vol. 1 p. 428-429}."
  en: "Allah, God the Unique, creator and Lord of judgment, is the centre of Islamic thought and its one reason for existing. The pre-Islamic Arabs knew him as one of the Meccan deities, probably the supreme god and certainly a creator-god. The Qur'anic preaching turned the vague notion of supreme divinity into the affirmation of the living God, one and unique, whose names are the 'most beautiful Names' {cite:encyclopaedia-of-islam-2 vol. 1 p. 428-429}."
