label:
  ar: "الله"
  en: "Allah (God the Unique: the Qur'anic God, his Oneness and his Names)"
  fr: "Allah (Dieu unique : le Dieu du Coran, son unicité et ses Noms)"
  es: "Allah (Dios el Único: el Dios del Corán, su Unicidad y sus Nombres)"
  ur: "اللہ ⁦(خدا منفرد: قرآنی خدا، اس کی وحدانیت اور اس کے نام)⁩"
summary:
  ar: "الله، الإله الواحد الأحد الخالق ورب الحساب، محور الفكر الإسلامي وعلة وجوده؛ وقد عرفه عرب الجاهلية إلهًا من آلهة مكة، ولعله الإله الأعلى وخالق الكون، والمقال يرجح أن اللفظ من «الإله» بأل. وبدأ الوحي بصيغة الرب الخالق، ثم صار التوحيد المحور، وتجلّت صفاته في الأسماء الحسنى {cite:encyclopaedia-of-islam-2 vol. 1 p. 428-429}."
  en: "Allah, God the Unique, creator and Lord of judgment, is the centre of Islamic thought and its one reason for existing. The pre-Islamic Arabs knew him as one of the Meccan deities, probably the supreme god and certainly a creator-god. The Qur'anic preaching turned the vague notion of supreme divinity into the affirmation of the living God, one and unique, whose names are the 'most beautiful Names' {cite:encyclopaedia-of-islam-2 vol. 1 p. 428-429}."
  fr: "Allah, Dieu unique, Créateur et Seigneur du Jugement, est le centre de la pensée islamique et sa seule raison d’être. Les Arabes préislamiques le connaissaient comme l’une des divinités de La Mecque, probablement le dieu suprême et certainement un dieu créateur. La prédication coranique a substitué à la notion vague d’une divinité suprême l’affirmation du Dieu vivant, un et unique, dont les noms sont les « plus beaux Noms » {cite:encyclopaedia-of-islam-2 vol. 1 p. 428-429}."
  es: "Allah, Dios Único, creador y Señor del juicio, es el centro del pensamiento islámico y su razón de ser. Los árabes preislámicos lo conocían como una de las deidades de La Meca, probablemente el dios supremo y, sin duda, un dios creador. La predicación coránica transformó la vaga noción de divinidad suprema en la afirmación del Dios viviente, uno y único, cuyos nombres son los «nombres más bellos» {cite:encyclopaedia-of-islam-2 vol. 1 p. 428-429}."
  ur: "اللہ، جو بے مثال، خالق اور مالک ہے، اسلامی فکر کا مرکز ہے اور اس کے موجود ہونے کی ایک وجہ ہے۔ اسلام سے پہلے کے عرب اسے مکی دیوتاؤں میں سے ایک کے طور پر جانتے تھے، غالباً سب سے اعلیٰ خدا اور یقینی طور پر ایک خالق خدا۔ قرآنی تبلیغ نے اعلیٰ الوہیت کے مبہم تصور کو زندہ خدا کے اثبات میں بدل دیا، ایک اور منفرد، جس کے نام 'سب سے خوبصورت نام' ہیں {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 428-429}۔"
