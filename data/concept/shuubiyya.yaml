label: { ar: "الشعوبية" }
summary:
  ar: "الشعوبية نزعة ظهرت في العصر العباسي الأول؛ يفرق أحمد أمين بين ثلاث نزعات في النزاع بين العرب والموالي: نزعة يقرون فيها للعرب بفضل إدخالهم الإسلام، ونزعة التسوية بين الشعوب في الشرف والخسة، ونزعة يحقرون فيها العرب ويقدمون غيرهم، وأُطلق اسم الشعوبية على أصحاب النزعتين الأخيرتين وأحق الناس به أهل التسوية، ففي العقد الفريد «الشعوبية وهم أهل التسوية» وفي الصحاح «فرقة لا تفضل العرب على العجم»، ثم انسحب الاسم على المعادين للعرب حتى صار أكثر ما يطلق على الصنف الثالث وفي اللسان «الشعوبي هو الذي يصغر شأن العرب». وأقدم ما وصل إلينا من الكتب التي استعملت اللفظ البيان والتبيين للجاحظ، ويستنتج أنها نزعة أكثر منها عقيدة ذات تعاليم محدودة، وساندتها النزعة الوطنية والعصبية، وفي الأندلس ظهر ابن غرسية ووضع رسالته في الشعوبية {cite:duha-islam p. 57-82}."
  en: "Shu'ubiyya — the anti-Arab-chauvinist tendency of the first Abbasid era: Ahmad Amin distinguishes three positions in the Arab–mawali quarrel and shows the name settled on those who denied Arab superiority, from 'people of equality' (al-Aqd al-Farid) to those who belittled the Arabs entirely (Lisan al-Arab) {cite:duha-islam p. 57-82}."
