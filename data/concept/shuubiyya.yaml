label: { ar: "الشعوبية", en: "Shu'ubiyya", es: "Shu'ubiyya", fr: "Shu'ubiyya", ur: "شعوبیہ", tr: "Popülizm", id: "Populisme" }
summary:
  ar: "الشعوبية نزعة ظهرت في العصر العباسي الأول؛ يفرق أحمد أمين بين ثلاث نزعات في النزاع بين العرب والموالي: نزعة يقرون فيها للعرب بفضل إدخالهم الإسلام، ونزعة التسوية بين الشعوب في الشرف والخسة، ونزعة يحقرون فيها العرب ويقدمون غيرهم، وأُطلق اسم الشعوبية على أصحاب النزعتين الأخيرتين وأحق الناس به أهل التسوية، ففي العقد الفريد «الشعوبية وهم أهل التسوية» وفي الصحاح «فرقة لا تفضل العرب على العجم»، ثم انسحب الاسم على المعادين للعرب حتى صار أكثر ما يطلق على الصنف الثالث وفي اللسان «الشعوبي هو الذي يصغر شأن العرب». وأقدم ما وصل إلينا من الكتب التي استعملت اللفظ البيان والتبيين للجاحظ، ويستنتج أنها نزعة أكثر منها عقيدة ذات تعاليم محدودة، وساندتها النزعة الوطنية والعصبية، وفي الأندلس ظهر ابن غرسية ووضع رسالته في الشعوبية {cite:duha-islam p. 57-82}."
  en: "Shu'ubiyya — the anti-Arab-chauvinist tendency of the first Abbasid era: Ahmad Amin distinguishes three positions in the Arab–mawali quarrel and shows the name settled on those who denied Arab superiority, from 'people of equality' (al-Aqd al-Farid) to those who belittled the Arabs entirely (Lisan al-Arab) {cite:duha-islam p. 57-82}."
  es: "Shu'ubiyya — la tendencia anti-chovinista árabe de la primera era abasí: Ahmad Amin distingue tres posiciones en la disputa árabe-mawali y muestra el nombre establecido para aquellos que negaban la superioridad árabe, desde \"gente de igualdad\" (al-Aqd al-Farid) hasta aquellos que menospreciaban por completo a los árabes (Lisan al-Arab) {cite:duha-islam p. 57-82}."
  fr: "Shu'ubiyya — la tendance anti-arabe-chauviniste de la première ère abbasside: Ahmad Amin distingue trois positions dans la querelle arabo-mawali et montre le nom attribué à ceux qui niaient la supériorité arabe, des « gens de l'égalité » (al-Aqd al-Farid) à ceux qui dénigraient entièrement les Arabes (Lisan al-Arab) {cite:duha-islam p. 57-82}."
  ur: "شعوبیہ - پہلے عباسی دور کا مخالف عرب شاونسٹ رجحان: احمد امین عرب-موالی جھگڑے میں تین پوزیشنوں کو ممتاز کرتے ہیں اور ان لوگوں کا نام ظاہر کرتے ہیں جنہوں نے عرب برتری کا انکار کیا، 'اہل مساوات' ⁦(العقد الفرید)⁩ سے لے کر العربلیان ⁦(العربیہ)⁩ تک۔ {حوالہ:دوحہ اسلام ص 57-82}۔"
  tr: "Şuubiyyah, erken Abbasi döneminde ortaya çıkan bir eğilimdir; Ahmed Amin, Araplar ile Mevaliler arasındaki çatışmada üç eğilimi ayırır: biri Arapları İslam'a girişlerinin erdemini kabul etmek; halkları onur ve aşağılık açısından eşit tutma eğilimi; ve Arapları küçümsemek ve başkalarını önceliklendirme eğilimi. Şuubiyyah adını son iki eğilimin takipçilerine ve buna en çok layık olanlara, eşitlik halkına vermiştir. El-Aqd Al-Farid'de, 'Şuubiyyah, onlar eşit halktır', El-Sihah'ta ise 'Arapları Arap olmayanlara tercih etmeyen bir mezhep' olarak adlandırılmıştır. Terim daha sonra Araplara karşı olanlara da yayıldı ve üçüncü kategoriye dönüştü; dilde ise 'Şuubi, Arapların statüsünü küçümseyen kişidir.' El-Cahiz'in 'açıklama ve açıklama' terimini kullanan bize ulaşan en erken kitaplar, bunun sınırlı öğretilere sahip bir doktrin değil, milliyetçilik ve fanatizmle desteklenen bir eğilim olduğunu sonucuna varır. Endülüs'te İbn Harsiyya ortaya çıkmış ve Şuubiye üzerine bir risale yazmıştır {atıf:Duha-İslam, s. 57-82}."
  id: "Shu'ubiyyah adalah kecenderungan yang muncul pada era Abbasiyah awal; Ahmed Amin membedakan antara tiga kecenderungan dalam konflik antara Arab dan Mawali: satu di mana mereka mengakui Arab atas jasa pengenalan mereka kepada Islam; kecenderungan menyamakan bangsa dalam kehormatan dan kerendahan; serta kecenderungan untuk merendahkan Arab dan memprioritaskan orang lain. Ia memberikan nama Shu'ubiyyah kepada para pengikut dua kecenderungan terakhir dan yang paling layak, yaitu orang-orang kesetaraan. Dalam Al-'Aqd Al-Farid, 'Shu'ubiyyah, mereka adalah umat kesetaraan,' dan dalam Al-Sihah, 'sebuah sekte yang tidak memihak Arab dibandingkan non-Arab.' Istilah ini kemudian diperluas kepada mereka yang menentang Arab hingga menjadi kategori ketiga, dan dalam bahasa tersebut, 'Shu'ubi adalah orang yang meremehkan status orang Arab.' Buku-buku paling awal yang sampai kepada kita yang menggunakan istilah 'klarifikasi dan klarifikasi' oleh Al-Jahiz menyimpulkan bahwa istilah ini lebih merupakan kecenderungan daripada doktrin dengan ajaran terbatas, didukung oleh nasionalisme dan fanatisme. Dalam al-Andalus, Ibn Gharsiyya muncul dan menulis risalahnya tentang Shu'ubiyyah {cite:Duha-Islam, hlm. 57-82}."
