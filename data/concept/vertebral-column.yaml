id: concept/vertebral-column
class: concept
kind: scientific
label: { ar: "الصلب والفقار عند ابن سينا", en: "The spine in the Canon", ur: "قانون میں ریڑھ کی ہڈی", es: "La columna vertebral en el Canon", fr: "La colonne vertébrale du canon", tr: "İbn Sina'ya göre zorluklar ve yoksulluk", id: "Kesulitan dan kemiskinan menurut Ibn Sina" }
summary:
  ar: "يعدّد ابن سينا للصلب، أي عمود الفقار، أربع منافع، ثم يصف الفقرة وزوائدها وثقوبها ومفاصلها، ويختم بكلام جامع في هيئة الصلب كله {cite:canon-ibn-sina-print-v1 pp.47-48} {cite:canon-ibn-sina-print-v1 p.52}."
  en: "Ibn Sina gives the spine (sulb, the column of vertebrae) four uses, then describes the vertebra, its processes, holes and joints, and closes with a summary on the form of the whole spine {cite:canon-ibn-sina-print-v1 pp.47-48} {cite:canon-ibn-sina-print-v1 p.52}."
  es: "Ibn Sina le da a la columna vertebral (sulb, la columna de vértebras) cuatro usos, luego describe la vértebra, sus procesos, agujeros y articulaciones, y cierra con un resumen sobre la forma de toda la columna vertebral {cite:canon-ibn-sina-print-v1 pp.47-48} {cite:canon-ibn-sina-print-v1 p.52}."
  fr: "Ibn Sina attribue quatre usages à la colonne vertébrale (sulb, la colonne de vertèbres), puis décrit la vertèbre, ses processus, ses trous et ses articulations, et termine par un résumé sur la forme de l'ensemble de la colonne vertébrale {cite:canon-ibn-sina-print-v1 pp.47-48} {cite:canon-ibn-sina-print-v1 p.52}."
  ur: "ابن سینا ریڑھ کی ہڈی ⁦(سلب، فقرے کا کالم)⁩ کو چار استعمال دیتا ہے، پھر ریڑھ کی ہڈی، اس کے عمل، سوراخ اور جوڑ کو بیان کرتا ہے، اور پوری ریڑھ کی ہڈی کی شکل کے خلاصے کے ساتھ بند کرتا ہے۔"
  tr: "İbn Sina, scle için dört fayda sağlar, yani omurga sütununu belirtir, ardından pasajı, eklemelerini, deliklerini ve eklemlerini tanımlar ve parçanın tüm formu hakkında kapsamlı bir açıklama ile bitirir {cite:canon-ibn-sina-print-v1 s.47-48} {cite:canon-ibn-sina-print-v1 s.52}."
  id: "Ibn Sina menyebutkan empat manfaat untuk scle, yaitu pilar tulang belakang, lalu menjelaskan bagian tersebut, penambahan, lubang, dan sambungannya, serta mengakhiri dengan pernyataan komprehensif tentang seluruh bentuk pecahan {cite:canon-ibn-sina-print-v1 hlm.47-48} {cite:canon-ibn-sina-print-v1 hlm.52}."
