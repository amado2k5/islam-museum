label: { ar: "الصلب والفقار عند ابن سينا", en: "The spine in the Canon", ur: "قانون میں ریڑھ کی ہڈی", es: "La columna vertebral en el Canon", fr: "La colonne vertébrale du canon" }
summary:
  ar: "يعدّد ابن سينا للصلب، أي عمود الفقار، أربع منافع، ثم يصف الفقرة وزوائدها وثقوبها ومفاصلها، ويختم بكلام جامع في هيئة الصلب كله {cite:canon-ibn-sina-print-v1 pp.47-48} {cite:canon-ibn-sina-print-v1 p.52}."
  en: "Ibn Sina gives the spine (sulb, the column of vertebrae) four uses, then describes the vertebra, its processes, holes and joints, and closes with a summary on the form of the whole spine {cite:canon-ibn-sina-print-v1 pp.47-48} {cite:canon-ibn-sina-print-v1 p.52}."
  es: "Ibn Sina le da a la columna vertebral (sulb, la columna de vértebras) cuatro usos, luego describe la vértebra, sus procesos, agujeros y articulaciones, y cierra con un resumen sobre la forma de toda la columna vertebral {cite:canon-ibn-sina-print-v1 pp.47-48} {cite:canon-ibn-sina-print-v1 p.52}."
  fr: "Ibn Sina attribue quatre usages à la colonne vertébrale (sulb, la colonne de vertèbres), puis décrit la vertèbre, ses processus, ses trous et ses articulations, et termine par un résumé sur la forme de l'ensemble de la colonne vertébrale {cite:canon-ibn-sina-print-v1 pp.47-48} {cite:canon-ibn-sina-print-v1 p.52}."
