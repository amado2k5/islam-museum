id: concept/rada-suckling-fiqh
class: concept
kind: legal
label:
  ar: "الرضاع"
  en: "Rada' (suckling): who nurses, the wage of the nurse, the bars of marriage by milk kinship, and how suckling is proved"
  ur: "رضاع (دودھ پلانا)"
summary:
  ar: "الرضاع في اللغة مص الثدي وشرب اللبن، وفي الشرع وصول لبن امرأة أو ما حصل من لبنها في جوف طفل بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} والإرضاع واجب على الأم ديانة عند الحنفية، ويجب على الأب استرضاع ولده عند الشافعية والحنابلة إذا تعينت الأم، والأم أحق بالرضاع إن رغبت فيه، وللمرضعة أجرة المثل عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8765} ويثبت التحريم بلبن المرأة، ولا يثبت بلبن الرجل أو البهيمة، وبلبن الميتة عند الجمهور، ويكفي وصول اللبن إلى الجوف ولو مشوبا عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8767} ويختلف الفقهاء في عدد الرضعات: فالحنفية والمالكية يكفي القليل والكثير، والشافعية والحنابلة يشترطون خمس رضعات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} ومدة الرضاع المحرمة حولان عند الشافعية والحنابلة وأبي يوسف ومحمد، وقال أبو حنيفة حولان ونصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} ويترتب على الرضاع تحريم المرضعة على الرضيع وفروعه وأصوله، وأولاد المرضعة من الرضاع إخوته، ولبن الفحل ينشر الحرمة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8773} ويثبت الرضاع بالإقرار أو بالبينة، ويختلف الفقهاء في نصابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8778} وللمرضعة حق على من أرضعته، ويستحب أن يكافئها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8780}"
  en: "Rada' is the sucking of the breast and drinking of milk; in law it is the arrival of a woman's milk, or what comes of it, into the belly of an infant under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} Nursing is a duty on the mother, in the Hanafi view a duty of religion and not of law; for the Shafi'is and Hanbalis the father must arrange it if the mother is not fit, and the nurse is paid the usual wage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8765} The bar of kinship comes from a woman's milk and not a man's or an animal's; from the milk of a dead woman by the majority; and from a mixed milk where its effect shows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8767} The schools differ on the number of sucks: the Hanafis and Malikis count any number, the Shafi'is and Hanbalis five. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} The period of suckling that bars marriage is two years by the Shafi'is, the Hanbalis, Abu Yusuf and Muhammad, and two and a half years in Abu Hanifa's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} By suckling the nurse and her line are barred to the child, and the nurse's children are his milk-siblings; the milk of the stallion (the husband of the nurse) bars by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8773} Suckling is proved by admission or evidence, and the schools differ on the number of witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8778} The nurse has a claim on the one she nursed, and it is recommended to reward her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8780}"
  ur: "رضاع بچے کو عورت کا دودھ پلانا ہے؛ پانچ دفعہ دودھ پینے سے رشتہ کی حرمت ثابت ہوتی ہے (شافعی و حنبلی)، جبکہ حنفی و مالکی ہر تعداد کو کافی سمجھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} دودھ پلانے کی مدت دو سال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771}"
