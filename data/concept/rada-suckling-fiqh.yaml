id: concept/rada-suckling-fiqh
class: concept
kind: legal
label:
  ar: "الرضاع"
  en: "Rada' (suckling): who nurses, the wage of the nurse, the bars of marriage by milk kinship, and how suckling is proved"
  ur: "رضاع ⁦(دودھ پلانا)⁩"
  es: "Rada' (lactancia): quién amamanta, el salario de la nodriza, las prohibiciones del matrimonio por parentesco de leche y cómo se demuestra la lactancia."
  fr: "Rada' (allaitement): qui allaite, le salaire de la nourrice, les obstacles au mariage par lien de lait, et comment l'allaitement est prouvé"
  tr: "Emzirme"
  id: "menyusui"
summary:
  ar: "الرضاع في اللغة مص الثدي وشرب اللبن، وفي الشرع وصول لبن امرأة أو ما حصل من لبنها في جوف طفل بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} والإرضاع واجب على الأم ديانة عند الحنفية، ويجب على الأب استرضاع ولده عند الشافعية والحنابلة إذا تعينت الأم، والأم أحق بالرضاع إن رغبت فيه، وللمرضعة أجرة المثل عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8765} ويثبت التحريم بلبن المرأة، ولا يثبت بلبن الرجل أو البهيمة، وبلبن الميتة عند الجمهور، ويكفي وصول اللبن إلى الجوف ولو مشوبا عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8767} ويختلف الفقهاء في عدد الرضعات: فالحنفية والمالكية يكفي القليل والكثير، والشافعية والحنابلة يشترطون خمس رضعات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} ومدة الرضاع المحرمة حولان عند الشافعية والحنابلة وأبي يوسف ومحمد، وقال أبو حنيفة حولان ونصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} ويترتب على الرضاع تحريم المرضعة على الرضيع وفروعه وأصوله، وأولاد المرضعة من الرضاع إخوته، ولبن الفحل ينشر الحرمة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8773} ويثبت الرضاع بالإقرار أو بالبينة، ويختلف الفقهاء في نصابها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8778} وللمرضعة حق على من أرضعته، ويستحب أن يكافئها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8780}"
  en: "Rada' is the sucking of the breast and drinking of milk; in law it is the arrival of a woman's milk, or what comes of it, into the belly of an infant under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} Nursing is a duty on the mother, in the Hanafi view a duty of religion and not of law; for the Shafi'is and Hanbalis the father must arrange it if the mother is not fit, and the nurse is paid the usual wage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8765} The bar of kinship comes from a woman's milk and not a man's or an animal's; from the milk of a dead woman by the majority; and from a mixed milk where its effect shows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8767} The schools differ on the number of sucks: the Hanafis and Malikis count any number, the Shafi'is and Hanbalis five. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} The period of suckling that bars marriage is two years by the Shafi'is, the Hanbalis, Abu Yusuf and Muhammad, and two and a half years in Abu Hanifa's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} By suckling the nurse and her line are barred to the child, and the nurse's children are his milk-siblings; the milk of the stallion (the husband of the nurse) bars by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8773} Suckling is proved by admission or evidence, and the schools differ on the number of witnesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8778} The nurse has a claim on the one she nursed, and it is recommended to reward her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8780}"
  ur: "رضاع بچے کو عورت کا دودھ پلانا ہے؛ پانچ دفعہ دودھ پینے سے رشتہ کی حرمت ثابت ہوتی ہے ⁦(شافعی و حنبلی)⁩، جبکہ حنفی و مالکی ہر تعداد کو کافی سمجھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} دودھ پلانے کی مدت دو سال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771}"
  es: "Rada' es la succión del pecho y la ingesta de leche; en derecho es la llegada de la leche de una mujer, o lo que proviene de ella, al vientre de un lactante bajo ciertas condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} La lactancia materna es un deber de la madre, en la visión Hanafi un deber religioso y no legal; para los Shafi'is y Hanbalis el padre debe proveerla si la madre no está en condiciones, y la nodriza recibe el salario habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8765} La barra de parentesco proviene de la leche de una mujer y no de un hombre o un animal; de la leche de una mujer muerta por la mayoría; y de una leche mixta donde se muestra su efecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8767} Las escuelas difieren en el número de succiones: los Hanafi y Maliki cuentan cualquier número, los Shafi'i y Hanbali cinco. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} El período de lactancia que impide el matrimonio es de dos años según los shafi'is, los hanbalis, Abu Yusuf y Muhammad, y de dos años y medio según la opinión de Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} Al amamantar, la nodriza y su linaje quedan excluidos del niño, y los hijos de la nodriza son sus hermanos de leche; la leche del semental (el marido de la nodriza) impide el matrimonio según la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8773} La lactancia se prueba mediante admisión o evidencia, y las escuelas difieren en cuanto al número de testigos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8778} La enfermera tiene un derecho sobre la persona que amamantó y se recomienda recompensarla. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8779} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8780}"
  fr: "Rada' désigne l'allaitement maternel; juridiquement, il s'agit de l'arrivée du lait maternel, ou de ce qui en provient, dans le ventre d'un nourrisson, sous certaines conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} L'allaitement est un devoir pour la mère, un devoir religieux et non légal selon l'école hanafite; pour les écoles chaféite et hanbalite, le père doit y pourvoir si la mère n'est pas en mesure de le faire, et la nourrice est rémunérée au salaire habituel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8765} Le lien de parenté provient du lait d'une femme et non de celui d'un homme ou d'un animal; du lait d'une femme décédée selon la majorité; et d'un lait mélangé lorsque son effet est manifeste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8767} Les écoles divergent quant au nombre de tétées: les hanafites et les malikites en comptent un nombre quelconque, les chaféites et les hanbalites cinq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} La période d'allaitement qui empêche le mariage est de deux ans selon les écoles chaféite, hanbalite, Abu Yusuf et Muhammad, et de deux ans et demi selon l'avis d'Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} L'allaitement rend la nourrice et sa lignée impropres au mariage pour l'enfant, et les enfants de la nourrice sont ses frères et sœurs de lait; le lait de l'étalon (le mari de la nourrice) est, selon la majorité, incompatible avec le mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8773} L'allaitement est prouvé par aveu ou par preuve, et les écoles diffèrent sur le nombre de témoins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8778} L'infirmière a un droit sur celle qu'elle a allaitée, et il est recommandé de la récompenser. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8780}"
  tr: "Dilde emzirme, emzirme emmek ve süt içmek anlamına gelir; İslam hukukunda ise kadının sütünün veya çocuğun rahmine giren sütünün gelmesi koşulludur. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.8762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8763} Hanefi okuluna göre anne emzirmek zorunludur. Baba, anne kararlıysa çocuğunu Şafi'ler ve Hanbali'lere göre emzirmekle yükümlüdür ve anne isterse emzirme hakkına sahiptir. Emziren anne Şafi'ler ve Hanbali'lere göre benzer bir ücret almaya hak kazanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8765} Yasak, çoğunluğa göre kadın sütüyle belirlenir, ancak çoğunluğa göre bir erkek, hayvan veya ölü bir hayvanın sütüyle değildir. Çoğunluğa göre süt, kirlenmiş olsa bile çukura ulaşması yeterlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8767} Hukukçular beslenme sayısı konusunda farklılık gösterir: Hanafiler ve Malikiler az ya da çok yeterlidir, Şafi'ler ve Hanbaliler ise beş besleme gerektirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8769} Yasak emzirmenin süresi, Şafi'ler, Hanbaliler, Ebu Yusuf ve Muhammed'e göre bir buçuk yıldır. Abu Hanifa bunun bir buçuk yıl olduğunu söyledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8771} Emzirme, emziricinin bebeğe yasaklanmasına, dallarına ve kökenlerine yol açar; süt annenin çocukları onun kardeşleridir ve aygır sütü kutsallığını halka yayar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8773} ve emzirme kabul veya kanıtla belirlenir, hukukçular ise yeterli çoğunluk konusunda farklı görüş bildirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8778} Emziren annenin, emzirdiği kişi üzerinde hakkı vardır ve ona ödüllendirilmesi tavsiye edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8780}"
  id: "Dalam bahasa tersebut, menyusui berarti mengisap payudara dan minum susu, dan dalam hukum Islam, kedatangan susu wanita atau apapun dari susunya yang masuk ke rahim anak bersifat bersyarat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8762} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8763} Menyusui wajib bagi ibu menurut mazhab Hanafi. Ayah wajib menyusui anaknya sesuai dengan Shafi'i dan Hanbalis jika ibu ditentukan, dan ibu berhak menyusui jika ia menginginkannya. Ibu menyusui berhak atas biaya yang sama menurut Shafi'i dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8763} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8764} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8765} Larangan ini ditetapkan dengan susu wanita, tetapi tidak dengan susu pria, hewan, atau susu hewan mati menurut mayoritas. Cukup jika susu mencapai lubang meskipun terkontaminasi menurut mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8767} Para ahli hukum berbeda pendapat mengenai jumlah pemberian makan: Hafi dan Maliki cukup dengan sedikit atau banyak, sementara Shafi'i dan Hanbal membutuhkan lima kali pemberian makan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8769} Durasi menyusui terlarang adalah satu setengah tahun menurut Shafi'i, Hanbali, Abu Yusuf, dan Muhammad. Abu Hanifa mengatakan itu satu setengah tahun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8769} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8771} Menyusui mengakibatkan larangan menyusui bayi itu, cabangnya, dan asal-usulnya, dan anak-anak pengasuh adalah saudara-saudaranya, dan susu pejantan menyebarkan kesuciannya di kalangan umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8773} dan menyusui ditentukan melalui pengakuan atau bukti, dan para ahli hukum berbeda pendapat tentang kuorumnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8776} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8777} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8778} Ibu menyusui berhak atas yang ia susui, dan disarankan untuk memberi hadiah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8779} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8780}"
