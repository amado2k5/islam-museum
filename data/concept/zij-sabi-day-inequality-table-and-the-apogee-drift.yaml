label: { ar: "جدول اختلاف الأيام وتغير بعد الشمس الأبعد", en: "The table of the inequality of days and the drift of the Sun's apogee", ur: "دنوں کے اختلاف کا جدول اور سورج کے اوج کی تبدیلی", es: "La tabla de desigualdad de días y la deriva del apogeo del Sol", fr: "Tableau de l'inégalité des jours et de la dérive de l'apogée du Soleil", tr: "En uzak güneşin uzaklığındaki değişimleri ve gün farklarını gösteren tablo.", id: "Tabel perbedaan hari dan perubahan jarak matahari terjauh" }
summary:
  ar: "يذكر البتاني أن قاعدته تبقى سليمة إلى انقضاء مدة طويلة يكثر فيها تغير موضع بعد الشمس الأبعد الذي وجده من فلك البروج، فيتغير لذلك ما يقع من قبل اختلاف حركة الشمس؛ وقد أضاف إلى موضع القمر الأوسط في أصل الحساب دقائق، وأخذ حصة كل جزء من أجزاء البروج من مقدار اختلاف الأيام بلياليها فأثبتها في جداول مطالع الفلك المستقيم في الجدول التالي للمطالع في كل برج {cite:zij-sabi-nallino-byblion p.79}."
  en: "Al-Battani states that his rule holds until a long span of time has passed in which the place of the Sun's apogee that he found on the zodiac changes much, and with it what arises from the variation in the Sun's motion; he added some minutes to the Moon's mean place in the base of the reckoning, and took the share of each degree of the signs from the amount of the inequality of days with their nights and entered it in the tables of ascensions of the right sphere, in the column following the ascensions in each sign {cite:zij-sabi-nallino-byblion p.79}."
  ur: "البتانی بتاتے ہیں کہ ان کا قاعدہ اس وقت تک درست رہتا ہے جب تک ایک طویل مدت نہ گزرے جس میں سورج کے اس اوج کا مقام، جو انہوں نے فلک البروج پر پایا، بہت بدل جائے، اور اس کے ساتھ وہ بھی بدل جائے جو سورج کی حرکت کے اختلاف سے پیدا ہوتا ہے؛ انہوں نے حساب کی بنیاد میں چاند کے وسطی مقام میں چند دقیقے بڑھائے، اور بروج کے ہر جز کا حصہ دنوں اور راتوں کے اختلاف کی مقدار سے لے کر اسے مستقیم فلک کے مطالع کے جدولوں میں، ہر برج کے مطالع کے بعد آنے والے خانے میں درج کیا {cite:zij-sabi-nallino-byblion p.79}۔"
  es: "Al-Battani afirma que su regla se mantiene hasta que haya transcurrido un largo período de tiempo en el que el lugar del apogeo del Sol que encontró en el zodíaco cambia mucho, y con ello lo que surge de la variación en el movimiento del Sol; añadió algunos minutos al lugar medio de la Luna en la base del cálculo, y tomó la parte de cada grado de los signos de la cantidad de desigualdad de los días con sus noches y la introdujo en las tablas de ascensiones de la esfera derecha, en la columna que sigue a las ascensiones en cada signo {cite:zij-sabi-nallino-byblion p.79}."
  fr: "Al-Battani affirme que sa règle reste valable jusqu'à ce qu'une longue période se soit écoulée, durant laquelle la position de l'apogée du Soleil qu'il a trouvée sur le zodiaque change beaucoup, et avec elle ce qui résulte de la variation du mouvement du Soleil; il a ajouté quelques minutes à la position moyenne de la Lune à la base du calcul, et a pris la part de chaque degré des signes de la quantité de l'inégalité des jours avec leurs nuits et l'a inscrite dans les tables des ascensions de la sphère droite, dans la colonne suivant les ascensions dans chaque signe {cite:zij-sabi-nallino-byblion p.79}."
  tr: "El-Battani, kuralının, ekliptikten bulduğu güneşin en uzak noktasının konumunun sık sık değiştiği uzun bir süre geçene kadar geçerli kaldığını ve dolayısıyla güneşin hareketindeki fark değişmeden önce ne olduğunu belirtir. Orijinal hesaplamada ayın orta konumuna dakikalar eklemiş ve zodyakın her bir bölümünün payını gün ve geceler arasındaki fark miktarından alarak bunları düz kürenin doğuş tablolarında, her burçtaki doğuşların aşağıdaki tablosunda belirlemiştir {cite:zij-sabi-nallino-byblion s.79}."
  id: "Al-Battani menyebutkan bahwa aturannya tetap berlaku sampai periode waktu yang lama berlalu di mana posisi bagian terjauh matahari, yang ia temukan dari ekliptika, sering berubah, dan oleh karena itu apa yang terjadi sebelum perbedaan pergerakan matahari berubah. Ia menambahkan menit ke posisi tengah bulan dalam perhitungan aslinya, dan mengambil bagian dari setiap bagian zodiak dari jumlah perbedaan siang dan malamnya, dan ia menetapkannya dalam tabel terbitan bola lurus dalam tabel terbitan di setiap tanda berikut {cite:zij-sabi-nallino-byblion p.79}."
