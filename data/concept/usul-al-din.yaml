label:
  ar: أصول الدين
  en: Usul al-Din (fundamentals of the religion)
  ur: اصول دین
  es: "Usul al-Din (fundamentos de la religión)"
  fr: "Usul al-Din (fondements de la religion)"
summary:
  ar: "أصول الدين مصطلح لما يعتقده المسلمون ويدينون به رب العالمين؛ يبين شراح العقيدة الطحاوية أن مقصود المتن «بيان ما يعتقدونه في أصول الدين، ويدينون به لرب العالمين» {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  en: "Usul al-din is the term for what Muslims believe and hold as religion before their Lord; commentators on the Tahawiyya explain the text's purpose as 'setting out what they believe in the fundamentals of the religion and hold before the Lord of the worlds' {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  es: "Usul al-din es el término que designa lo que los musulmanes creen y consideran su religión ante su Señor; los comentaristas de la Tahawiyya explican que el propósito del texto es \"exponer lo que creen en los fundamentos de la religión y lo que consideran ante el Señor de los mundos\" {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  fr: "Usul al-din est le terme désignant ce que les musulmans croient et considèrent comme religion devant leur Seigneur; les commentateurs de la Tahawiyya expliquent que le but du texte est de « présenter ce qu'ils croient dans les fondements de la religion et considèrent devant le Seigneur des mondes » {cite:sharh-tahawiyya-ibn-abi-al-izz}."
  ur: "اصول الدین اس کے لیے اصطلاح ہے جسے مسلمان مانتے ہیں اور اپنے رب کے سامنے دین کے طور پر رکھتے ہیں۔ طحاویہ کے مفسرین نے متن کا مقصد یہ بیان کیا ہے کہ 'وہ دین کے بنیادی اصولوں میں کیا عقیدہ رکھتے ہیں اور رب العالمین کے سامنے کیا رکھتے ہیں'۔"
