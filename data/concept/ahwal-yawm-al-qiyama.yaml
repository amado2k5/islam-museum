id: concept/ahwal-yawm-al-qiyama
class: concept
kind: belief
label:
  ar: "أهوال يوم القيامة"
  en: "The terrors of the Day"
  ur: "روزِ قیامت کے اہوال"
summary:
  ar: "ما بين النفخة والحساب من هول يوم القيامة: فزع يوم لا ينفع مال ولا بنون، شدة تدنو فيها الشمس، وانشقاق السماء وتكوير الشمس وانتثار الكواكب وسيور الجبال {cite:tafsir-ibn-kathir} {cite:sahih-muslim}."
  en: "The terrors between the blast and the reckoning: the fright of a day when wealth and sons avails nothing, the sun drawn near, the heaven split, the sun folded up, the stars scattered and the mountains set moving {cite:tafsir-ibn-kathir} {cite:sahih-muslim}."
  ur: "پھونک اور حساب کے درمیان قیامت کے اہوال: وہ دن جس میں مال اور اولاد کام نہ آئے، سورج قریب ہو، آسمان پھٹے، سورج لپیٹا جائے، ستارے بکھریں اور پہاڑ اڑائے جائیں {cite:tafsir-ibn-kathir} {cite:sahih-muslim}۔"
