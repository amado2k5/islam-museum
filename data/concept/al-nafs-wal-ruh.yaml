id: concept/al-nafs-wal-ruh
class: concept
sensitivity: contested
kind: doctrine
label:
  ar: "النفس والروح"
  en: "The soul (nafs) and the spirit (ruh)"
  fr: "L'âme (nafs) et l'esprit (ruh)"
  ur: "نفس اور روح"
  es: "El alma (nafs) y el espíritu (ruh)"
  tr: "Ruh ve Ruh"
  id: "Jiwa dan Jiwa"
summary:
  ar: "يرى الشعراوي أن النفس تتكون حين تتصل الروح بالمادة فتعطيها الحياة، وأن المادة والروح كلتيهما مسبحة لله قبل اتصالهما، وأن الحواس تشهد يوم القيامة لأنها لم تعد مسخرة لأمر الإنسان في المعصية {cite:tafsir-sharawi-khawatir-scan p.321} {cite:tafsir-sharawi-khawatir-scan p.322}."
  en: "Sha'rawi holds that the nafs is formed when the ruh joins matter and gives it life; that matter and ruh each glorify God before they join; and that the senses bear witness on the Day because they are no longer at the service of a person's disobedience {cite:tafsir-sharawi-khawatir-scan p.321} {cite:tafsir-sharawi-khawatir-scan p.322}."
  fr: "Sha'rawi estime que la nafs se forme lorsque la ruh rejoint la matière et lui donne la vie ; que la matière et la ruh glorifient chacune Dieu avant de se joindre ; et que les sens témoignent au Jour parce qu'ils ne sont plus au service de la désobéissance d'une personne {cite:tafsir-sharawi-khawatir-scan p.321} {cite:tafsir-sharawi-khawatir-scan p.322}."
  ur: "شعراوی کے نزدیک نفس اس وقت بنتی ہے جب روح مادے سے ملتی ہے اور اسے زندگی دیتی ہے۔ ان کے نزدیک مادہ اور روح دونوں ملنے سے پہلے اللہ کی تسبیح کرتے ہیں، اور حواس قیامت کے دن گواہی دیں گے کیونکہ وہ نافرمانی میں انسان کے تابع نہیں رہے {cite:tafsir-sharawi-khawatir-scan p.321} {cite:tafsir-sharawi-khawatir-scan p.322}۔"
  es: "Sha'rawi sostiene que el nafs se forma cuando el ruh se une a la materia y le da vida; que la materia y el ruh glorifican a Dios antes de unirse; y que los sentidos dan testimonio en el Día porque ya no están al servicio de la desobediencia de una persona {cite:tafsir-sharawi-khawatir-scan p.321} {cite:tafsir-sharawi-khawatir-scan p.322}."
  tr: "El-Şaarawi, ruhun maddeye bağlanıp ona hayat verdiğinde oluştuğuna, hem maddenin hem ruhun birleşmeden önce Tanrı'yı yücelttiğine, duyuların ise Kıyamet Günü'nde tanıklık ettiğine inanır çünkü artık insan günahına tabi değildirler {atıf:tafsir-sharawi-khawatir-scan s.321} {cite:tafsir-sharawi-khawatir-scan s.322}."
  id: "Al-Shaarawi percaya bahwa jiwa terbentuk ketika terikat dengan materi dan memberinya kehidupan, bahwa baik materi maupun jiwa meninggikan Tuhan sebelum bersatu, dan bahwa indra menjadi saksi pada Hari Penghakiman karena mereka tidak lagi tunduk pada dosa manusia {sitasi:tafsir-sharawi-khawatir-scan hlm.321} {kutip:tafsir-sharawi-khawatir-scan hlm.322}."
