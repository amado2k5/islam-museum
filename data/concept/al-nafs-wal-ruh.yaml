id: concept/al-nafs-wal-ruh
class: concept
sensitivity: contested
kind: doctrine
label:
  ar: "النفس والروح"
  en: "The soul (nafs) and the spirit (ruh)"
  ur: "نفس اور روح"
summary:
  ar: "يرى الشعراوي أن النفس تتكون حين تتصل الروح بالمادة فتعطيها الحياة، وأن المادة والروح كلتيهما مسبحة لله قبل اتصالهما، وأن الحواس تشهد يوم القيامة لأنها لم تعد مسخرة لأمر الإنسان في المعصية {cite:tafsir-sharawi-khawatir-scan p.321} {cite:tafsir-sharawi-khawatir-scan p.322}."
  en: "Sha'rawi holds that the nafs is formed when the ruh joins matter and gives it life; that matter and ruh each glorify God before they join; and that the senses bear witness on the Day because they are no longer at the service of a person's disobedience {cite:tafsir-sharawi-khawatir-scan p.321} {cite:tafsir-sharawi-khawatir-scan p.322}."
  ur: "شعراوی کے نزدیک نفس اس وقت بنتی ہے جب روح مادے سے ملتی ہے اور اسے زندگی دیتی ہے۔ ان کے نزدیک مادہ اور روح دونوں ملنے سے پہلے اللہ کی تسبیح کرتے ہیں، اور حواس قیامت کے دن گواہی دیں گے کیونکہ وہ نافرمانی میں انسان کے تابع نہیں رہے {cite:tafsir-sharawi-khawatir-scan p.321} {cite:tafsir-sharawi-khawatir-scan p.322}۔"
