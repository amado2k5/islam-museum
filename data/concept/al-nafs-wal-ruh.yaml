    stance:
      ar: "النفس نتاج اتصال الروح بالمادة، والروح في الملائكة كما في الوحي"
      en: "The nafs results from the joining of the ruh with matter; the ruh is found in the angels as in revelation"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن النفس تكون حين تلتقي الروح بالمادة وتبدأ الحياة، وأن الروح الملكية والروح في الوحي نقية، ويستشهد بآيات في الروح {cite:tafsir-sharawi-khawatir-scan p.322}."
      en: "Sha'rawi holds that the nafs comes into being when the ruh meets matter and life begins, that the angelic ruh and the ruh of revelation are pure, and he cites verses about the ruh {cite:tafsir-sharawi-khawatir-scan p.322}."
