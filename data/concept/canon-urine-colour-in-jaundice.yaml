id: concept/canon-urine-colour-in-jaundice
class: concept
kind: scientific
label: { ar: "لون البول في اليرقان عند ابن سينا", en: "The colour of urine in jaundice in the Canon", ur: "یرقان میں پیشاب کا رنگ قانون میں", es: "El color de la orina en la ictericia en el Canon", fr: "La couleur de l'urine en cas de jaunisse dans le Canon", tr: "İbn Sina'ya göre sarılıkta idrarın rengi", id: "Warna urin pada penyakit kuning menurut Avicenna" }
summary:
  ar: "يقول ابن سينا إن البول في اليرقان كلما اشتدت حمرته حتى يضرب إلى السواد ويصبغ الثوب كان أسلم إن كان كثيراً، وإن بقي أبيض أو قليل الحمرة مع بقاء اليرقان خيف الاستسقاء {cite:canon-ibn-sina-print-v1 p.185}."
  en: "Ibn Sina says that in jaundice urine that grows redder, toward black, and stains cloth is the safer when abundant, while white or faintly red urine with the jaundice persisting raises fear of dropsy {cite:canon-ibn-sina-print-v1 p.185}."
  es: "Ibn Sina dice que en la ictericia la orina que se vuelve más roja, hacia el negro, y mancha la ropa es más segura cuando es abundante, mientras que la orina blanca o ligeramente roja con ictericia persistente aumenta el temor a la hidropesía {cite:canon-ibn-sina-print-v1 p.185}."
  fr: "Ibn Sina dit que dans la jaunisse, l'urine qui devient plus rouge, vers le noir, et qui tache les vêtements est plus sûre lorsqu'elle est abondante, tandis que l'urine blanche ou légèrement rouge avec la jaunisse persistante suscite la crainte d'hydropisie {cite:canon-ibn-sina-print-v1 p.185}."
  ur: "ابن سینا کا کہنا ہے کہ یرقان میں پیشاب جو سرخ، سیاہ اور داغ دھبوں کی طرف بڑھتا ہے وہ زیادہ محفوظ ہے، جب کہ سفید یا ہلکا سرخ پیشاب جس میں یرقان برقرار رہتا ہے اس سے ڈروپسی کا خدشہ بڑھتا ہے۔"
  tr: "İbn Sina, sarılıkta idrarın kızarıklığı arttıkça siyaha döndüğünü ve giysi boyandığını, bol miktarda olursa daha güvenli olduğunu, beyaz veya hafif kırmızı kalırsa sarılık devam ederken asitizm riski olduğunu söyler {cite:canon-ibn-sina-print-v1 s.185}."
  id: "Ibn Sina mengatakan bahwa urin pada penyakit kuning, semakin merah hingga berubah menjadi hitam dan pakaian diwarnai, lebih aman jika urine melimpah, dan jika tetap putih atau sedikit merah, dengan kuning tetap ada risiko asisitisisme {cite:canon-ibn-sina-print-v1 hlm.185}."
