summary:
  ar: "يقول ابن سينا إن البول في اليرقان كلما اشتدت حمرته حتى يضرب إلى السواد ويصبغ الثوب كان أسلم إن كان كثيراً، وإن بقي أبيض أو قليل الحمرة مع بقاء اليرقان خيف الاستسقاء {cite:canon-ibn-sina-print-v1 p.185}."
  en: "Ibn Sina says that in jaundice urine that grows redder, toward black, and stains cloth is the safer when abundant, while white or faintly red urine with the jaundice persisting raises fear of dropsy {cite:canon-ibn-sina-print-v1 p.185}."
