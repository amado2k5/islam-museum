id: concept/zij-sabi-year-between-equinox-or-solstice-returns
class: concept
kind: scientific
label: { ar: "السنة بين عودتين إلى نقطة الاعتدال أو الانقلاب", en: "The year between returns to an equinox or solstice point", ur: "اعتدال یا انقلاب کے نقطے کی طرف دو واپسیوں کے درمیان سال" }
summary:
  ar: "يقرر البتاني أن زمان السنة إنما هو من مفارقة الشمس نقطة غير متحركة من الفلك إلى أن تعود إليها، إما من إحدى نقطتي الاعتدالين إلى مثلها، وإما من إحدى نقطتي الانقلابين إلى مثلها، لأنه لا مبادئ من فلك البروج أولى من هذه النقط {cite:zij-sabi-nallino-byblion p.65}."
  en: "Al-Battani states that the year is the time from the Sun's leaving an immovable point of the sphere until it returns to it, either from one of the two equinox points to the same point, or from one of the two solstice points to the same, since no beginnings on the zodiac are better than these points {cite:zij-sabi-nallino-byblion p.65}."
  ur: "البتانی بیان کرتے ہیں کہ سال وہ زمانہ ہے جو سورج کے فلک کے کسی غیر متحرک نقطے سے جدا ہونے سے اس کی طرف لوٹنے تک ہو، یا تو اعتدالین کے دو نقطوں میں سے ایک سے اسی نقطے تک، یا انقلابین کے دو نقطوں میں سے ایک سے اسی تک، کیونکہ فلک البروج پر ان نقطوں سے بہتر کوئی ابتدا نہیں {cite:zij-sabi-nallino-byblion p.65}۔"
