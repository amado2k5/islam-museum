id: concept/fard-kifaya
class: concept
kind: legal
label:
  ar: "فرض الكفاية"
  en: "The communal obligation (fard kifaya)"
  ur: "فرضِ کفایہ"
  fr: "L'obligation collective (fard kifaya)"
  es: "La obligación colectiva (fard kifaya)"
summary:
  ar: "فرض الكفاية ما يُطلب حصوله من جماعة المسلمين دون نظر إلى من يفعله: إذا قام به من فيه الكفاية خرج الباقون من الإثم. بسطه الشافعي في «الرسالة»، فجعله درجة لا تبلغها العامة ولم يُكلَّفها كل الخاصة {cite:risala-shafii p.475}، واستدل له بآيتي [[passage/quran-4-95|النساء 95]] و[[passage/quran-9-122|التوبة 122]] {cite:risala-shafii p.481}، ومثّل له بالجهاد والتفقه وشهود الجنائز ورد السلام {cite:risala-shafii p.483}. ويناقش الغزالي كيف يكون على الجميع مع سقوطه بفعل واحد {cite:mustasfa-hafiz-v1 p.309}."
  en: "The communal obligation (fard kifaya) is what is required to be brought about by the community of Muslims without regard to who does it: if those who suffice take it up, the rest are released from sin. Al-Shafi'i set it out in al-Risala, making it a degree that the general public does not reach and with which not every one of the specialists is charged {cite:risala-shafii p.475}, derived it from the two verses [[passage/quran-4-95|al-Nisa' 95]] and [[passage/quran-9-122|al-Tawba 122]] {cite:risala-shafii p.481}, and gave as examples fighting, gaining understanding, attending funerals and returning the greeting {cite:risala-shafii p.483}. Al-Ghazali discusses how it can be upon everyone while it lapses through the act of one {cite:mustasfa-hafiz-v1 p.309}."
  ur: "فرضِ کفایہ وہ ہے جس کا حاصل ہونا مسلمانوں کی جماعت سے مطلوب ہو، اس سے قطع نظر کہ کون کرتا ہے: اگر اسے وہ لوگ ادا کر لیں جن میں کفایت ہو تو باقی لوگ گناہ سے نکل جاتے ہیں۔ شافعی نے «الرسالہ» میں اسے بیان کیا اور اسے ایک ایسا درجہ بتایا جہاں عام لوگ نہیں پہنچتے اور جس کا مکلف ہر خاص بھی نہیں کیا گیا {cite:risala-shafii p.475}، اور اس پر آیات [[passage/quran-4-95|النساء 95]] اور [[passage/quran-9-122|التوبہ 122]] سے استدلال کیا {cite:risala-shafii p.481}، اور اس کی مثالیں جہاد، تفقہ، جنازوں میں حاضری اور سلام کا جواب دینا دیں {cite:risala-shafii p.483}۔ غزالی بحث کرتے ہیں کہ یہ سب پر کیسے ہو سکتا ہے جبکہ ایک کے کرنے سے ساقط ہو جاتا ہے {cite:mustasfa-hafiz-v1 p.309}۔"
  fr: "L'obligation collective (fard kifaya) est ce qui est demandé à la communauté des musulmans d'accomplir, sans considération de celui qui l'accomplit : si ceux qui suffisent s'en acquittent, les autres sont quittes du péché. Al-Shafi'i l'a exposée dans al-Risala, en en faisant un degré que le commun n'atteint pas et dont chaque spécialiste n'est pas chargé {cite:risala-shafii p.475}, l'a tirée des deux versets [[passage/quran-4-95|al-Nisa' 95]] et [[passage/quran-9-122|al-Tawba 122]] {cite:risala-shafii p.481}, et a donné comme exemples le combat, l'approfondissement du savoir, la présence aux funérailles et la réponse au salut {cite:risala-shafii p.483}. Al-Ghazali discute comment elle peut peser sur tous alors qu'elle tombe par l'acte d'un seul {cite:mustasfa-hafiz-v1 p.309}."
  es: "La obligación comunitaria (fard kifaya) es lo que se exige que realice la comunidad de los musulmanes, sin atender a quién lo hace: si lo cumplen quienes bastan, los demás quedan libres de pecado. Al-Shafi'i la expuso en al-Risala, haciendo de ella un grado que el común no alcanza y que no se encarga a cada uno de los especialistas {cite:risala-shafii p.475}, la dedujo de los dos versículos [[passage/quran-4-95|al-Nisa' 95]] y [[passage/quran-9-122|al-Tawba 122]] {cite:risala-shafii p.481}, y dio como ejemplos el combate, el cultivo del saber, la asistencia a los funerales y la respuesta al saludo {cite:risala-shafii p.483}. Al-Ghazali discute cómo puede recaer sobre todos cuando cae por el acto de uno solo {cite:mustasfa-hafiz-v1 p.309}."
