id: concept/al-shatranj
class: concept
kind: art_form
label: { ar: "الشطرنج", en: "Chess", fr: "Échecs", es: "Ajedrez", ur: "شطرنج", tr: "satranç", id: "Satranç" }
summary:
  ar: "ذكر المسعودي أن جميع آلات الشطرنج ست صور: المربعة المشهورة ثمانية أبيات في مثلها المنسوبة إلى قدماء الهند، والمستطيلة أربعة في ستة عشر، والمربعة عشرة في مثلها وفيها قطعتان تسميان الدبابتين، والمدورة المنسوبة إلى الروم، والمدورة النجومية الفلكية أبياتها اثنا عشر على عدد بروج الفلك وينقل فيها سبعة أمثلة على عدد السيارة والنيرين وألوانها، والجوارحية المستحدثة سبعة أبيات في ثمانية أمثلتها على أسماء جوارح الإنسان، وذكر أن واضع الشطرنج كان عدلياً مستطيعاً فيما يفعل وواضع النرد مجبراً، وقيل أرض مربعة حمراء من أدم ما بين فين موصوفين بالكرم تذاكرا الحرب فاحتالا لها شبهاً من غير أن يسعيا فيها بسفك دم {cite:muruj-al-dhahab p. 678-681}."
  en: "Six boards: the Indian 8x8, the oblong, the 10x10 with dabbabas, the Byzantine round, the zodiacal with planet-pieces, and the new jawarihiyya — chess's maker was a voluntarist, nard's a fatalist {cite:muruj-al-dhahab p. 678-681}."
  fr: "Six échiquiers : l’indien de 8 × 8 cases, le rectangulaire, celui de 10 × 10 cases avec des dabbabas, le circulaire byzantin, le zodiacal aux pièces planétaires et le nouveau jawarihiyya. L’inventeur des échecs aurait soutenu le libre arbitre, celui du nard le déterminisme {cite:muruj-al-dhahab p. 678-681}."
  es: "Seis tableros: el indio de 8x8, el oblongo, el de 10x10 con dabbabas, el redondo bizantino, el zodiacal con piezas planetarias y el nuevo jawarihiyya; el creador del ajedrez era voluntarista, el de nardo fatalista {cite:muruj-al-dhahab p. 678-681}."
  ur: "چھ تختیاں: ہندوستانی 8x8، لمبا، 10x10 دبابوں کے ساتھ، بازنطینی راؤنڈ، سیارے کے ٹکڑوں کے ساتھ رقم، اور نیا جواریہ - شطرنج کا بنانے والا رضاکار تھا، نارد ایک مہلک تھا {حوالہ: مروج الذہاب۔ 678-681}۔"
  tr: "Al-Mas'udi, tüm satranç makinelerinin altı biçimi olduğunu belirtti: Hindistan'ın eski halkına atfedilen sekiz dizeli ünlü kare; dörtlü on altı boyutunda dikdörtgen; iki taşlı kare, yani iki tank; yuvarlak olan, Romalılara atfedilen; astronomik yuvarlak, burç sayısına karşılık gelen on iki dize, araba, fener ve renklerinin yedi örneğini içeren; yeni tanıtılan uzuvlar, insan uzuvlarının sekiz isiminde yedi dize. Satranç oyuncusunun yaptığı işte adil ve yetenekli olduğunu belirtti ve zar oynayan kişi zorlandı. Adem'in kırmızı kare diyarının, cömert olarak tanımlandığı, savaşı hatırlatan ve kan dökmeden benzerlik tasarladığı söylenir {cite:muruj-al-dhahab s. 678-681}."
  id: "Al-Mas'udi menyatakan bahwa semua mesin catur memiliki enam bentuk: kotak delapan garis yang terkenal yang dikaitkan dengan bangsa kuno India; persegi panjang dengan empat dimensi enam belas; persegi panjang dengan dua batu, yaitu dua tangki; yang bulat, dikaitkan dengan Romawi; bundaran astronomi, berisi dua belas garis sesuai dengan jumlah zodiak, mobil, lentera, dan tujuh contoh warnanya; anggota tubuh yang baru diperkenalkan, tujuh garis dalam delapan nama anggota tubuh manusia. Ia menyatakan bahwa pemain catur itu adil dan terampil dalam pekerjaannya, dan pemain dadu ditantang. Dikatakan bahwa wilayah kotak merah Adam digambarkan sebagai murah hati, mengingatkan pada perang, dan dirancang kemiripan tanpa pertumpahan darah {cite:muruj-al-dhahab hlm. 678-681}."
