id: concept/al-shatranj
class: concept
kind: art_form
label: { ar: "الشطرنج", en: "Chess" }
summary:
  ar: "ذكر المسعودي أن جميع آلات الشطرنج ست صور: المربعة المشهورة ثمانية أبيات في مثلها المنسوبة إلى قدماء الهند، والمستطيلة أربعة في ستة عشر، والمربعة عشرة في مثلها وفيها قطعتان تسميان الدبابتين، والمدورة المنسوبة إلى الروم، والمدورة النجومية الفلكية أبياتها اثنا عشر على عدد بروج الفلك وينقل فيها سبعة أمثلة على عدد السيارة والنيرين وألوانها، والجوارحية المستحدثة سبعة أبيات في ثمانية أمثلتها على أسماء جوارح الإنسان، وذكر أن واضع الشطرنج كان عدلياً مستطيعاً فيما يفعل وواضع النرد مجبراً، وقيل أرض مربعة حمراء من أدم ما بين فين موصوفين بالكرم تذاكرا الحرب فاحتالا لها شبهاً من غير أن يسعيا فيها بسفك دم {cite:muruj-al-dhahab p. 678-681}."
  en: "Six boards: the Indian 8x8, the oblong, the 10x10 with dabbabas, the Byzantine round, the zodiacal with planet-pieces, and the new jawarihiyya — chess's maker was a voluntarist, nard's a fatalist {cite:muruj-al-dhahab p. 678-681}."
wings: [ideas, objects]
sources: [source/muruj-al-dhahab, source/sallabi-ali-vol1]
