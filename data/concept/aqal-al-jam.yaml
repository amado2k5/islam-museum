label: { ar: "أقل الجمع", en: "Aqal al-jam' (the least number that counts as plural)" }
summary:
  ar: "أقل الجمع في الاصطلاح عدد الاثنين أو الثلاثة، والأكثر من الفقهاء والأصوليين على أنه ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230} وفي الفرائض خالف الفرضيون في غير ابن عباس فجعلوا أقله اثنين، وكذلك في الوصية عند الحنفية، ويبنى الفقهاء أحكامهم في غير الميراث على أن أقله ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231} وأثر ذلك في الأيمان والوقف والإقرار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231}"
  en: "The least number of plural in the grammarians' sense is contested, and in the jurists' view most hold it to be three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230} In inheritance most scholars take two as the least, against Ibn Abbas, and the Hanafis take two for bequests; elsewhere the jurists build their rulings on three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231} The point affects oaths, endowments and acknowledgements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231}"
