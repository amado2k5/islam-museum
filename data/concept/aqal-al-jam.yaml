id: concept/aqal-al-jam
class: concept
kind: legal
label: { ar: "أقل الجمع", en: "Aqal al-jam' (the least number that counts as plural)", fr: "Aqal al-jam’ (le nombre minimal comptant comme pluriel)", es: "Aqal al-jam' (el número más pequeño que cuenta como plural)", ur: "اقل الجام ⁦(کم سے کم تعداد جو جمع کے طور پر شمار ہوتی ہے)⁩", tr: "Minimum Toplam", id: "Jumlah Minimum" }
summary:
  ar: "أقل الجمع في الاصطلاح عدد الاثنين أو الثلاثة، والأكثر من الفقهاء والأصوليين على أنه ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230} وفي الفرائض خالف الفرضيون في غير ابن عباس فجعلوا أقله اثنين، وكذلك في الوصية عند الحنفية، ويبنى الفقهاء أحكامهم في غير الميراث على أن أقله ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231} وأثر ذلك في الأيمان والوقف والإقرار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231}"
  en: "The least number of plural in the grammarians' sense is contested, and in the jurists' view most hold it to be three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230} In inheritance most scholars take two as the least, against Ibn Abbas, and the Hanafis take two for bequests; elsewhere the jurists build their rulings on three. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231} The point affects oaths, endowments and acknowledgements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231}"
  fr: "Le nombre minimal du pluriel au sens des grammairiens est contesté et, chez les juristes, la plupart le fixent à trois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230} En matière successorale, la plupart des savants prennent deux pour minimum, contre Ibn Abbas, et les hanafites retiennent deux pour les legs ; ailleurs, les juristes fondent leurs règles sur trois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231} La question touche les serments, les fondations pieuses et les reconnaissances. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231}"
  es: "El número mínimo de plural en el sentido de los gramáticos es objeto de debate, y en opinión de los juristas, la mayoría sostiene que es tres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230} En materia de herencias, la mayoría de los estudiosos consideran dos como el mínimo, en contra de Ibn Abbas, y los hanafíes consideran dos para los legados; en otros casos, los juristas basan sus decisiones en tres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231} Este punto afecta a los juramentos, las donaciones y los reconocimientos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231}"
  ur: "گرامر کے لحاظ سے جمع کی کم سے کم تعداد کا مقابلہ کیا جاتا ہے، اور فقہاء کے نزدیک زیادہ تر اسے تین مانتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3230} وراثت میں اکثر علماء ابن عباس کے مقابلے میں دو کو کم سے کم لیتے ہیں، اور احناف نے دو کو وصیت کے لیے لیا ہے۔ دوسری جگہوں پر فقہاء تین پر اپنے احکام قائم کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3230}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.3231} نقطہ حلف، اوقاف اور اعترافات کو متاثر کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3231}"
  tr: "Terimlerde minimum çoğul iki veya üç, hukukçular ve alimciler arasında en yaygın çoğul ise üçtür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3229}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3230} Miras yasalarında, varsayımsal hukukçular İbn Abbas'tan farklı olarak asgari iki olarak belirlemiş, vasiyetnamelerde ise Hanefilere göre en azını koymuşlardır. Hukukçular kararlarını miras almama en az üçe dayandırırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3231} ve bunun yeminler, duraklama ve kabul üzerindeki etkisi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3231}"
  id: "Jamak minimum dalam terminologi adalah dua atau tiga, sementara yang paling umum di antara ahli hukum dan usul adalah tiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3230} Dalam hukum warisan, para ahli hukum hipotetis berbeda dari Ibn Abbas dan menetapkan minimum menjadi dua, serta dalam wasiat menurut Hanafi. Para ahli hukum mendasarkan putusan mereka pada non-warisan sebagai minimum tiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3231} dan dampaknya terhadap sumpah, jeda, dan pengakuan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3231}"
