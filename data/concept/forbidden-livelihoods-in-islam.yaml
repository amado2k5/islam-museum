id: concept/forbidden-livelihoods-in-islam
class: concept
kind: legal
label:
  ar: العمل المحظور في الإسلام
  en: Forbidden livelihoods in Islam
summary:
  ar: "يرى المراغي أن الإسلام لا يحظر من العمل إلا ما فيه اعتداء على العقل والنفس والمال والعِرض {cite:min-qadaya-al-mal-wal-amal-azhar p. 17}. ويعدّ من المحظور: القتل بغير حق أو الاستئجار عليه، وصناعة الخمر وتجارتها، ومثلها المخدرات {cite:min-qadaya-al-mal-wal-amal-azhar p. 17} {cite:min-qadaya-al-mal-wal-amal-azhar p. 18}، والقمار بكل صوره، ويعدّ منه ما فيه تعذيب الحيوان {cite:min-qadaya-al-mal-wal-amal-azhar p. 18}، والسرقة {cite:min-qadaya-al-mal-wal-amal-azhar p. 18}، والسحر والكهانة والعرافة وقراءة الكف والفنجان {cite:min-qadaya-al-mal-wal-amal-azhar p. 19}، وشهادة الزور {cite:min-qadaya-al-mal-wal-amal-azhar p. 19}. وفي باب السؤال يكره الكتاب سؤال الناس للتكسب، ولا يبيحه إلا عند الإعواز التام {cite:min-qadaya-al-mal-wal-amal-azhar p. 21}، ويذكر قول أحمد بن حنبل في ذلك {cite:min-qadaya-al-mal-wal-amal-azhar p. 21}. وفي حاشية الكتاب أن بعض ما يُروى في تحريم الميسر حديث صحيح، وبعضه ضعيف {cite:min-qadaya-al-mal-wal-amal-azhar p. 18}."
  en: "Al-Maraghi says Islam forbids only work that attacks the mind, the person, property or honour (p. 17). He lists killing for hire, making and trading wine and drugs, all forms of gambling including tormenting animals, theft, sorcery and fortune-telling, and false testimony (pp. 17-19). On begging he allows it only in total need, citing Ahmad ibn Hanbal (p. 21). This is the author's classification."
