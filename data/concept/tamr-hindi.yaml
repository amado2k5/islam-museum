label:
  ar: "تمر هندي"
  en: "Tamr hindi"
  ur: "تمر ہندی"
  es: "Tamr hindi"
  fr: "Tamr hindi"
  tr: "tamarind"
  id: "asam jawa"
summary:
  ar: "تمر هندي في الكتاب معروف يؤتى به من الهند، أفضله الحديث الطري الذي لم يذبل ولم يتحشف وحموضته صادقة، بارد يابس في الثانية، مسهل ألطف من الإجاص وأقل رطوبة، ينفع من القيء والعطش في الحميات ويقبض المعدة المسترخية من كثرة القيء، ويسهل الصفراء، وينفع من الحميات ذات الغشي والكرب {cite:canon-ibn-sina-print-v1 p.686}"
  en: "Tamr hindi is in the book well known and brought from India; the best is the new, fresh one that has not withered or shrivelled and whose sourness is true; cold and dry in the second degree, a purgative subtler than the ijjas and less moist; it benefits vomiting and the thirst in fevers and tightens the stomach slackened by much vomiting, it loosens yellow bile, and it benefits fevers with fainting and distress {cite:canon-ibn-sina-print-v1 p.686}"
  ur: "تمر ہندی کتاب میں معروف ہے اور ہندوستان سے لایا جاتا ہے؛ سب سے اچھا نیا تازہ ہے جو مرجھایا نہ ہو اور سکڑا نہ ہو اور جس کی کھٹاس سچی ہو؛ دوسرے درجے میں سرد خشک ہے، اجاص سے زیادہ لطیف اور کم تر تری والا مسہل؛ قے اور بخاروں کی پیاس میں نافع ہے اور بہت قے سے ڈھیلے ہو جانے والے معدے کو سکیڑتا ہے، صفرا کو خارج کرتا ہے، اور غشی اور بے چینی والے بخاروں میں نافع ہے {cite:canon-ibn-sina-print-v1 p.686}۔"
  es: "Tamr hindi es bien conocido en el libro y traído de la India; el mejor es el nuevo, fresco, que no se ha marchitado ni arrugado y cuya acidez es auténtica; frío y seco en segundo grado, un purgante más sutil que el ijjas y menos húmedo; beneficia los vómitos y la sed en las fiebres y fortalece el estómago distendido por muchos vómitos, afloja la bilis amarilla y beneficia las fiebres con desmayos y angustia {cite:canon-ibn-sina-print-v1 p.686}"
  fr: "Le Tamr hindi est bien connu et importé d'Inde; le meilleur est le nouveau, frais, non flétri et dont l'acidité est authentique; froid et sec au second degré, c'est un purgatif plus subtil que les ijjas et moins humide; il soulage les vomissements et la soif lors des fièvres, resserre l'estomac relâché par de nombreux vomissements, fluidifie la bile jaune et est bénéfique en cas de fièvres accompagnées d'évanouissements et de détresse. {cite:canon-ibn-sina-print-v1 p.686}"
  tr: "Kitaptaki tamarind iyi bilinir ve Hindistan'dan getirilmiştir. En iyisi, ne solan ne de solan yumuşak hadistir; asiditesi samimidir. İkincisi soğuk ve kurudur, armutlardan daha hafif bir müshil ve daha az nemlidir, diyetlerde kusma ve susuzluk için faydalıdır, aşırı kusmaya karşı gevşek mideyi daraltır, safrayı hafifletir ve bayılma ile sıkıntı ile birlikte ateşler için faydalıdır {cite:canon-ibn-sina-print-v1 s.686}"
  id: "Asam jawa dalam buku ini dikenal luas dan dibawa dari India. Yang terbaik adalah hadits lembut yang tidak layu maupun pudar, dan keasamannya tulus. Asam jawa kering dingin pada hadits kedua, lebih ringan dari pir dan kurang lembap, bermanfaat untuk muntah dan haus dalam diet, menyempitkan perut yang rileks dari muntah berlebihan, meredakan empedu, dan bermanfaat untuk demam yang pingsan dan stres {cite:canon-ibn-sina-print-v1 hlm.686}"
