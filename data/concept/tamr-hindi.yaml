id: concept/tamr-hindi
class: concept
kind: natural
label:
  ar: "تمر هندي"
  en: "Tamr hindi"
  ur: "تمر ہندی"
summary:
  ar: "تمر هندي في الكتاب معروف يؤتى به من الهند، أفضله الحديث الطري الذي لم يذبل ولم يتحشف وحموضته صادقة، بارد يابس في الثانية، مسهل ألطف من الإجاص وأقل رطوبة، ينفع من القيء والعطش في الحميات ويقبض المعدة المسترخية من كثرة القيء، ويسهل الصفراء، وينفع من الحميات ذات الغشي والكرب {cite:canon-ibn-sina-print-v1 p.686}"
  en: "Tamr hindi is in the book well known and brought from India; the best is the new, fresh one that has not withered or shrivelled and whose sourness is true; cold and dry in the second degree, a purgative subtler than the ijjas and less moist; it benefits vomiting and the thirst in fevers and tightens the stomach slackened by much vomiting, it loosens yellow bile, and it benefits fevers with fainting and distress {cite:canon-ibn-sina-print-v1 p.686}"
  ur: "تمر ہندی کتاب میں معروف ہے اور ہندوستان سے لایا جاتا ہے؛ سب سے اچھا نیا تازہ ہے جو مرجھایا نہ ہو اور سکڑا نہ ہو اور جس کی کھٹاس سچی ہو؛ دوسرے درجے میں سرد خشک ہے، اجاص سے زیادہ لطیف اور کم تر تری والا مسہل؛ قے اور بخاروں کی پیاس میں نافع ہے اور بہت قے سے ڈھیلے ہو جانے والے معدے کو سکیڑتا ہے، صفرا کو خارج کرتا ہے، اور غشی اور بے چینی والے بخاروں میں نافع ہے {cite:canon-ibn-sina-print-v1 p.686}۔"
