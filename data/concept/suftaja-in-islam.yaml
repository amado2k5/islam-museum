summary:
  ar: "السفتجة وفاء الدين في بلد آخر غير بلد الدين، مكتوبة أو غير مكتوبة {cite:usul-iqtisad-islami-0660 p. 262}. يفرق المؤلف بين ما يشترط فيه المقرض مؤنة على المقترض فيحرم لأنه ربا، وما فيه منفعة للمقترض فيجوز، وما فيه منفعة للمقرض دون ضرر على المقترض فيجوز {cite:usul-iqtisad-islami-0660 p. 263} {cite:usul-iqtisad-islami-0660 p. 264}."
  tr: "Siftijah, borcun bulunduğu ülke dışındaki bir ülkede borç ödenmesidir; ister yazılı ister yazılı olsun {cite:usul-iqtisad-islami-0660 s. 262}. Yazar, borçlunun borçluya zorluk yaşatmasını istediği ve bunun tefecilik olduğu için yasak olan şeyle, borçluya zarar vermeden fayda sağladığı ve izin verilen şeyler arasında ayrım yapar {cite:usul-iqtisad-islami-0660 s. 263} {cite:usul-iqtisad-islami-0660 s. 264}."
  id: "Siftijah adalah pembayaran utang di negara selain negara utangnya, baik tertulis maupun tidak {cite:usul-iqtisad-islami-0660 hlm. 262}. Penulis membedakan antara apa yang diwajibkan pemberi pinjaman untuk kesulitan bagi peminjam dan dilarang karena itu riba, dan apa yang menguntungkan peminjam tanpa merugikan peminjam dan diperbolehkan {cite:usul-iqtisad-islami-0660 hlm. 263} {cite:usul-iqtisad-islami-0660 hlm. 264}."
