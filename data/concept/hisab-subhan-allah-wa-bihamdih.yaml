id: concept/hisab-subhan-allah-wa-bihamdih
class: concept
kind: doctrine
label:
  ar: "سبحان الله وبحمده مائة مرة في اليوم"
  en: "Subhan Allah wa bi-hamdih a hundred times in a day"
  ur: "دن میں سو بار سبحان اللہ وبحمدہ"
summary:
  ar: "من قال «سبحان الله وبحمده» في يوم مائة مرة حُطّت خطاياه وإن كانت مثل زبد البحر، في رواية مالك عن أبي هريرة عند البخاري [[passage/bukhari-api-6405]] وفي الموطأ [[passage/muwatta-1-561]]. النص هنا لا يعدّ المحو بعدد، بل يشبّهه بما لا يُحصى، ولذلك لا تجمعه الآلة الحاسبة رقما وإنما تعرضه نتيجة مكتوبة."
  en: "Whoever says \"Glory be to God and His is the praise\" a hundred times in a day has his sins shed even if they were like the foam of the sea, in Malik's narration from Abu Hurayra in al-Bukhari [[passage/bukhari-api-6405]] and in the Muwatta [[passage/muwatta-1-561]]. The text does not number the erasure; it likens it to what cannot be counted, so the calculator does not add it up as a figure and shows it as a written result."
  ur: "جو دن میں سو بار «سبحان اللہ وبحمدہ» کہے اس کی خطائیں جھڑ جاتی ہیں خواہ سمندر کی جھاگ کے برابر ہوں، مالک کی ابو ہریرہ سے روایت میں جو بخاری میں ہے [[passage/bukhari-api-6405]] اور مؤطا میں [[passage/muwatta-1-561]]۔ یہاں نص مٹنے کو کسی عدد میں نہیں گنتی بلکہ اسے بے شمار چیز سے تشبیہ دیتی ہے، اس لیے کیلکولیٹر اسے عدد کے طور پر جمع نہیں کرتا بلکہ لکھا ہوا نتیجہ دکھاتا ہے۔"
