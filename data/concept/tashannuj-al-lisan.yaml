id: concept/tashannuj-al-lisan
class: concept
kind: scientific
label:
  ar: تشنج اللسان
  en: The tongue's convulsion
  ur: زبان کی کھنچاؤ
  es: "La convulsión de la lengua"
  fr: "La convulsion de la langue"
  tr: "dil spazmı"
  id: "kejang lidah"
summary:
  ar: قد يكون تشنج اللسان من رطوبة لزجة تمدد عضله عرضاً وقد تكون من سوداء مقبضة وقد تكون في الأمراض الحادة إذا أحدثت تشنجاً في عضلة اللسان على طريق التجفيف والتشويه والتشنج قد يظهر ضرراً في الكلام، وليس يبعد علاجه في القانون من علاج التشنج وأما على طريق الأخص فالتكميدات لأصل العنق من هذا الجنس والغرغرة بأدهانها واحتساؤها ملء الفم وهي فاترة ثم إمساكها فيه مدة واستعمال أخبصة من هذا الجنس {cite:canon-ibn-sina-print-v2 p.257}
  en: 'The tongue''s convulsion may come from a viscid moisture stretching its muscle sideways, from a constricting melancholy, or in the acute diseases when they bring convulsion to the tongue''s muscle by drying and deforming; the convulsion may show harm in speech. Its treatment in the Canon is not far from the treatment of convulsion; more specifically, compresses at the neck''s root of this kind, gargling their oils and holding a mouthful of them lukewarm for a while, and using lozenge-forms of this kind (the names left out) {cite:canon-ibn-sina-print-v2 p.257}'
  ur: 'زبان کی کھنچاؤ چپچپی رطوبت سے ہو سکتی ہے جو اس کے پٹھے کو چوڑائی میں کھینچے، یا قبض کرنے والی سودا سے، یا حاد امراض میں جب وہ زبان کے پٹھے میں خشکی اور بے شکلی کے راستے کھنچاؤ پیدا کریں؛ اور کھنچاؤ کلام میں نقص دکھا سکتی ہے؛ قانون میں اس کا علاج کھنچاؤ کے علاج سے دور نہیں، اور خاص طور پر گردن کی جڑ پر اس جنس کے کمڈے، ان کے تیلوں سے غرغرہ اور فاتر حال میں منہ بھر منہ میں رکھنا، اور اس جنس کی اخبصہ استعمال کرنا ⁦(نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.257}'
  es: "La convulsión de la lengua puede deberse a una humedad viscosa que estira el músculo lateralmente, a una melancolía opresiva, o en enfermedades agudas que provocan convulsiones en el músculo de la lengua por sequedad y deformación; la convulsión puede afectar el habla. Su tratamiento en el Canon no difiere mucho del tratamiento de la convulsión; más específicamente, compresas de este tipo en la raíz del cuello, gárgaras con sus aceites y mantener un sorbo tibio durante un rato, y el uso de pastillas de este tipo (se omiten los nombres) {cite:canon-ibn-sina-print-v2 p.257}"
  fr: "Les convulsions de la langue peuvent être dues à une humidité visqueuse qui étire ses muscles latéralement, à une mélancolie constrictive, ou encore à des maladies aiguës qui provoquent des convulsions en asséchant et en déformant les muscles de la langue; ces convulsions peuvent entraîner des troubles de la parole. Le traitement décrit dans le Canon est similaire à celui des convulsions: il s’agit plus précisément d’appliquer des compresses à la base du cou, de se gargariser avec les huiles essentielles de ces plantes et d’en garder une gorgée tiède pendant un moment, ainsi que d’utiliser des pastilles de ce type (dont les noms sont omis). {cite:canon-ibn-sina-print-v2 p.257}"
  tr: "Dil spazmları, kası yan tarafa geren yapışkan nemden kaynaklanabilir veya siyah ve sıkışmış olabilir. Akut hastalıklarda, dil kasında kuruma, bozulma ve spazm yoluyla spazmlara neden olursa, konuşma hasarına yol açabilir. Tedavisi yasa gereği spazmdan uzak değildir. Ancak özellikle bu cinsin boyun kökü için, merhemini gargara ile gargara yapmak, ılıkken ağıza emmek ve bir süre tutmak ve bu tür bir bez kullanmak {cite:canon-ibn-sina-print-v2 s.257}"
  id: "Kejang lidah dapat disebabkan oleh kelembapan lengket yang meregangkan otot secara lateral, atau bisa menjadi hitam dan terjepit. Pada penyakit akut, jika menyebabkan kejang pada otot lidah melalui pengeringan, distorsi, dan kejang, dapat menyebabkan kerusakan bicara. Pengobatannya tidak jauh dari kejang menurut hukum. Namun, khususnya untuk akar leher genus ini, kumurlah dengan salepnya, dan sedotnya ke dalam mulut saat masih hangat kuku dan tahan untuk sementara waktu, serta gunakan kain jenis ini {cite:canon-ibn-sina-print-v2 hlm.257}"
