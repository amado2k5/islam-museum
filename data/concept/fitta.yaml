summary:
  ar: "فتة في الكتاب صمغ نبات يشبه القنا في شكله ينبت في بلاد الشام، صنفان زبدي خفيف وأكثف وأثقل، حار في الثانية مجفف في الثالثة، مليّن محلل يفش الرياح، ينفع من الخنازير والإعياء والكزاز والصداع والصرع ووجع الضرس والربو والسعال المزمن وعسر البول والسموم، وبدله السكبينج {cite:canon-ibn-sina-print-v1 pp.649-650}"
  en: "Fitta is in the book the gum of a plant like the reed in form that grows in Syria, of two kinds, a frothy light one and a denser, heavier one, hot in the second degree and drying in the third, softening and dissolving, dispersing winds; it benefits scrofula, fatigue, tetanus, headache, epilepsy, toothache, asthma, chronic cough, difficulty of urine and poisons, and its substitute is sakbinaj {cite:canon-ibn-sina-print-v1 pp.649-650}"
  ur: "فتہ کتاب میں ایک پودے کا گوند ہے جو شکل میں نیزے کی ڈنڈی جیسا ہے اور شام کے علاقے میں اگتا ہے، دو قسم کا، جھاگ دار ہلکا اور گاڑھا بھاری، دوسرے درجے میں گرم اور تیسرے میں خشک، نرم کرنے والا، گھلانے والا اور ہوائیں منتشر کرنے والا؛ خنازیر، تھکن، کزاز، سر درد، مرگی، داڑھ کے درد، دمے، پرانی کھانسی، پیشاب کی دشواری اور زہروں میں نافع ہے، اور اس کا بدل سکبینج ہے {cite:canon-ibn-sina-print-v1 pp.649-650}۔"
