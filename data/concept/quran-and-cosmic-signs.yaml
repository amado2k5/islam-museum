id: concept/quran-and-cosmic-signs
class: concept
kind: doctrine
label: { ar: "القرآن والآيات الكونية", en: "The Quran and cosmic signs", es: "El Corán y los signos cósmicos", fr: "Le Coran et les signes cosmiques", ur: "قرآن اور کائناتی نشانیاں", tr: "Kur'an ve Kozmik Ayetler", id: "Al-Quran dan Ayat-ayat Kosmik" }
summary:
  ar: "يرى الشعراوي أن القرآن لم يأت ليعلّم أسرار الكون، وأن النبي اكتفى من الكونيات بما علم، وترك بقيتها للأجيال، لئلا تنصرف العقول عن أحكام التكليف إلى جدل لا يُتوصل فيه إلى شيء. ويرى أن الإشارات الكونية في القرآن تُفهم كلما تقدم العلم {cite:tafsir-sharawi-khawatir-scan p.9}{cite:tafsir-sharawi-khawatir-scan p.10}{cite:tafsir-sharawi-khawatir-scan p.14}."
  en: "Sha'rawi holds that the Quran did not come to teach the secrets of the cosmos. The Prophet, in his view, confined himself to what was known of them and left the rest to later generations, so that minds would not turn from the duties of worship to disputes that reach no conclusion. He holds that the Quran's cosmic signs are understood as knowledge advances {cite:tafsir-sharawi-khawatir-scan p.9}{cite:tafsir-sharawi-khawatir-scan p.10}{cite:tafsir-sharawi-khawatir-scan p.14}."
  es: "Sha'rawi sostiene que el Corán no fue concebido para revelar los secretos del cosmos. En su opinión, el Profeta se limitó a lo que se conocía de ellos y dejó el resto para las generaciones posteriores, para que las mentes no se desviaran de los deberes del culto hacia disputas sin solución. Afirma que los signos cósmicos del Corán se entienden como avances del conocimiento {cite:tafsir-sharawi-khawatir-scan p.9}{cite:tafsir-sharawi-khawatir-scan p.10}{cite:tafsir-sharawi-khawatir-scan p.14}."
  fr: "Sha'rawi soutient que le Coran n'a pas été révélé pour enseigner les secrets du cosmos. Selon lui, le Prophète s'est limité à ce qui était connu et a laissé le reste aux générations futures, afin que les esprits ne se détournent pas des devoirs d'adoration pour se perdre dans des disputes stériles. Il considère que les signes cosmiques du Coran doivent être compris comme des progrès de la connaissance."
  ur: "شعراوی کا خیال ہے کہ قرآن کائنات کے راز سکھانے کے لیے نہیں آیا۔ نبی نے اپنے خیال میں اپنے آپ کو ان چیزوں تک محدود کر دیا جو ان کے بارے میں معلوم تھا اور باقی کو بعد کی نسلوں کے لیے چھوڑ دیا، تاکہ اذہان عبادت کے فرائض سے ان تنازعات کی طرف متوجہ نہ ہوں جو کسی نتیجے پر نہ پہنچیں۔ اس کا خیال ہے کہ قرآن کی کائناتی نشانیاں علم کی ترقی کے طور پر سمجھی جاتی ہیں {حوالہ:تفسیر-شعاوی-خوااتیر-سکین صفحہ 9}{cite:تفسیر-شعاوی-خوااتیر-سکین صفحہ 10}{cite:تفسیر-شعروی-خوااتیر-اسکین صفحہ 14}۔"
  tr: "El-Şaarawi, Kur'an'ın evrenin sırlarını öğretmek için gelmediğine, Peygamber'in kozmik konularda bildikleriyle yetindiğine ve geri kalanını gelecek nesillere bıraktığına, böylece zihinlerin görevin kararlarından sapıp tartışmaya gitmemesi için hiçbir şeye ulaşmadığını düşünür. Kur'an'daki kozmik referansların bilgi ilerlemesi olarak anlaşıldığına inanır {cite:tafsir-sharawi-khawatir-scan s.9}{cite:tafsir-sharawi-khawatir-scan s.10}{cite:tafsir-sharawi-khawatir-scan s.14}."
  id: "Al-Shaarawi percaya bahwa Al-Qur'an tidak datang untuk mengajarkan rahasia alam semesta, dan bahwa Nabi puas dengan apa yang diketahuinya tentang hal-hal kosmik dan menyerahkan sisanya kepada generasi mendatang, agar pikiran tidak menyimpang dari keputusan tugas untuk berdebat tanpa mencapai apa pun. Ia percaya bahwa referensi kosmik dalam Al-Qur'an dipahami sebagai kemajuan pengetahuan {cite:tafsir-sharawi-khawatir-scan hlm.9}{cite:tafsir-sharawi-khawatir-scan hlm.10}{cite:tafsir-sharawi-khawatir-scan hlm.14}."
