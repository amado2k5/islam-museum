id: concept/quran-and-cosmic-signs
class: concept
kind: doctrine
label: { ar: "القرآن والآيات الكونية", en: "The Quran and cosmic signs" }
summary:
  ar: "يرى الشعراوي أن القرآن لم يأت ليعلّم أسرار الكون، وأن النبي اكتفى من الكونيات بما علم، وترك بقيتها للأجيال، لئلا تنصرف العقول عن أحكام التكليف إلى جدل لا يُتوصل فيه إلى شيء. ويرى أن الإشارات الكونية في القرآن تُفهم كلما تقدم العلم {cite:tafsir-sharawi-khawatir-scan p.9}{cite:tafsir-sharawi-khawatir-scan p.10}{cite:tafsir-sharawi-khawatir-scan p.14}."
  en: "Sha'rawi holds that the Quran did not come to teach the secrets of the cosmos. The Prophet, in his view, confined himself to what was known of them and left the rest to later generations, so that minds would not turn from the duties of worship to disputes that reach no conclusion. He holds that the Quran's cosmic signs are understood as knowledge advances {cite:tafsir-sharawi-khawatir-scan p.9}{cite:tafsir-sharawi-khawatir-scan p.10}{cite:tafsir-sharawi-khawatir-scan p.14}."
wings: [ideas]
themes: []
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "كيف تُفهم الإشارات الكونية في القرآن، وهل يُفسَّر ما يتعلق بالكون بقدر ما يُفسَّر التكليف؟"
  en: "How are the Quran's cosmic references to be understood, and should they be explained as fully as the legal duties?"
perspectives:
  - tradition: sunni
    id: sharawi-restraint-and-later-understanding
    stance:
      ar: "القرآن للتكليف، والإشارات الكونية يكشفها الزمن"
      en: "The Quran is for the duties of worship, and time reveals its cosmic references"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الإشارات الكونية في القرآن تُفهم بالتدرج، وإن تركها للأجيال جعل تفسير القرآن متجدداً، فكان المنع عين العطاء {cite:tafsir-sharawi-khawatir-scan p.14}."
      en: "Sha'rawi says the cosmic references are understood gradually, and that leaving them for later generations keeps the explanation of the Quran renewed, so that restraint is itself a gift {cite:tafsir-sharawi-khawatir-scan p.14}."
