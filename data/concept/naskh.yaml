id: concept/naskh
class: concept
kind: legal
label: { ar: "النَّسْخ", en: "Abrogation (naskh) in legal theory", ur: "نسخ (منسوخ اور ناسخ احکام)" }
summary:
  ar: "النسخ في اللغة يطلق على النقل، كنسخ الكتاب، وعلى الإبطال والإزالة. وفي الاصطلاح ورود دليل شرعي متراخٍ عن دليل شرعي مقتضٍ خلاف حكمه، فهو تبديل بالنظر إلى علمنا، وبيان لمدة الحكم بالنظر إلى علم الله تعالى. ويفرّق عن التخصيص بأن النسخ رفع للحكم بعد ثبوته، والتخصيص إفراد لبعض الأفراد قبل ثبوت الحكم، ويفرّق عن الإحكام بأنه المغاير له. والنسخ ثلاثة أقسام: نسخ الحكم دون التلاوة، ونسخ التلاوة دون الحكم، ونسخ التلاوة والحكم معاً. وهو جائز عقلاً واقع سمعاً عند جمهور العلماء، وأنكره بعض المتأخرين. ويشترط لوقوعه أن يكون الحكم المنسوخ شرعياً لا عادةً أقرّ عليها الناس، وأن يكون الناسخ منفصلاً متأخراً لا مقترناً كالشرط والاستثناء، وأن يكون بخطاب شرعي، وأن يكون الناسخ أقوى أو مثله، وألا يكون الحكم من أصول التوحيد أو مما علم بالنص تأبيده، ولذلك لا نسخ في الأخبار. ويجوز نسخ الأثقل إلى الأخف وبالعكس، ونسخ الحكم إلى لا شيء، كنسخ صدقة النجوى. ويجوز نسخ المتواتر بالمتواتر والآحاد بالآحاد، ويمنع نسخ القرآن بالآحاد، ونسخه بالسنة المتواترة محل خلاف والجمهور على جوازه. ومنسوخ الحكم مع بقاء تلاوته يُصلّى به باتفاق الفقهاء، ويحرم على الحائض والجنب قراءته، أما منسوخ التلاوة فلا تجوز الصلاة به ولا تحرم قراءته عليهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15681}"
  en: "Naskh, in the lexicon, means copying one text from another, and also annulment or removal. In the technical sense it is a later legal proof arriving after an earlier one and prescribing a ruling contrary to it. It is a change as far as we know, and a statement of the ruling's term as far as God's knowledge is concerned. It differs from specification (takhsis), which excludes some cases before a ruling takes effect, whereas naskh lifts a ruling after it has taken effect. It also differs from the firm (muhkam) and from interpretation (ta'wil). Naskh has three kinds: abrogation of the ruling while the recitation stays, abrogation of the recitation while the ruling stays, and abrogation of both. Most scholars hold it is possible by reason and has occurred by revelation; a few later thinkers denied it. For it to occur, the abrogated ruling must be legislated and not a custom that people were left to keep; the abrogating proof must come separately and later, not joined to the ruling as a condition or exception; it must come by a legal address; the abrogating proof must be stronger or equal; the ruling must not belong to the roots of faith or be something the text has made permanent, which is why there is no naskh in reports. A heavier ruling may be replaced by a lighter one and the reverse, and a ruling may be lifted without any replacement. Abrogation of a Qur'anic ruling by a single report is refused, while abrogation by a widely transmitted Sunna is disputed, and the majority allow it. Prayer with a verse whose ruling is abrogated but whose recitation stays is agreed to be lawful, and a menstruating or impure person may not recite it. For a verse whose recitation is abrogated, prayer with it is not lawful, but reciting it is not forbidden to them. For the Qur'anic naskh debate in a modern commentary, see the separate entry on abrogation in the Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15681}"
  ur: "نسخ لغت میں نقل کرنے اور ختم کرنے دونوں معنوں میں آتا ہے۔ اصطلاح میں بعد میں آنے والی شرعی دلیل کا پہلے حکم کے خلاف حکم دینا، جو ہمارے علم کے اعتبار سے تبدیلی اور اللہ کے علم کے اعتبار سے حکم کی مدت کا بیان ہے۔ تخصیص سے یہ فرق ہے کہ نسخ ثابت شدہ حکم کو اٹھاتا ہے۔ نسخ کی تین قسمیں ہیں: حکم منسوخ اور تلاوت باقی، تلاوت منسوخ اور حکم باقی، اور دونوں منسوخ۔ جمہور عقلاً جائز اور شرعاً واقع مانتے ہیں۔ شرائط میں یہ ہے کہ منسوخ حکم شرعی ہو، ناسخ الگ اور بعد میں آئے، ناسخ قوی یا مثل ہو، اور توحید یا مؤبد خبروں میں نسخ نہ ہو۔ ہلکے حکم سے بھاری اور بھاری سے ہلکے کی طرف نسخ جائز ہے۔ قرآن کا نسخ خبرِ واحد سے ممنوع ہے، جبکہ متواتر سنت سے جمہور کے نزدیک جائز ہے۔ جس آیت کا حکم منسوخ مگر تلاوت باقی ہو اس سے نماز درست ہے، لیکن حائضہ اور جنبی کے لیے اس کی تلاوت حرام ہے۔ جس کی تلاوت منسوخ ہو اس سے نماز درست نہیں، مگر حائضہ اور جنبی کے لیے تلاوت حرام نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15681}"
