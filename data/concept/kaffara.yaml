summary:
  ar: "الكفارة لغة من الستر، وهي شرعاً واجبة جبراً لبعض الذنوب والمخالفات الشرعية، وفيها معنى العقوبة ومعنى العبادة. ومن أسبابها الحنث في اليمين، وتجب بالحنث لا باليمين، واختلف في اليمين الغموس واللغو، وفي تعدد الكفارات بتعدد الأيمان، وفي عدم جواز التكفير قبل الحنث. ومن أسبابها القتل، فلا خلاف في القتل شبه العمد والخطأ، واختلف في العمد وفي القتل بالتسبب وفي الجنين. ويكمل الباب بسببي الظهار والوطء في رمضان وغيرهما، وتتناول المادة بعد ذلك الإفطار في نهار رمضان وأحكام الجماع فيه، ومحظورات الحج والإحرام، وكفارة الظهار، وشروط الكفارات وخصالها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
  en: "Kaffara means covering, from the root of concealing. In law it is an expiation owed for certain sins and violations; it has both a penal and a devotional character. One cause is breaking an oath: it is owed on breaking the oath, not on swearing it; the schools differ on the oath of deception and on the vain oath, on whether several oaths on one matter need several expiations, and on expiating before breaking the oath. Another cause is killing: all agree on the expiation for killing by mistake and near-intentional killing; the schools differ on intentional killing, on killing by causation and on a foetus. The article then covers breaking the fast of Ramadan and the rules on intercourse in it, the prohibitions of the hajj and ihram, the expiation for zihar, and the conditions and kinds of expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
  ur: "کفارہ لغت میں ڈھانپنے سے ہے، اور شرعاً بعض گناہوں اور شرعی خلاف ورزیوں کی جبری تلافی ہے، جس میں سزا اور عبادت دونوں کا پہلو ہے۔ اس کا ایک سبب قسم توڑنا ہے، جو قسم کھانے پر نہیں بلکہ توڑنے پر واجب ہوتا ہے؛ یمین غموس اور لغو میں اختلاف ہے، اسی طرح ایک بات پر کئی قسموں کے کفارے کی تعداد اور حنث سے پہلے کفارہ دینے میں اختلاف ہے۔ دوسرا سبب قتل ہے: خطا اور شبہِ عمد میں اتفاق ہے، عمد، قتل بالتسبب اور جنین میں اختلاف ہے۔ اس کے بعد رمضان کے روزے کا توڑنا، حج اور احرام کے محظورات، ظہار کا کفارہ، اور کفاروں کی شرائط اور خصلتیں آتی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
  es: "Kaffara significa cubrir, de la raíz de ocultar. En derecho, es una expiación debida por ciertos pecados y transgresiones; tiene un carácter tanto punitivo como devocional. Una causa es romper un juramento: se debe al romper el juramento, no al prestarlo; las escuelas difieren en cuanto al juramento de engaño y al juramento vano, en si varios juramentos sobre un mismo asunto requieren varias expiaciones, y en cuanto a la expiación antes de romper el juramento. Otra causa es el homicidio: todos coinciden en la expiación por homicidio accidental y homicidio casi intencional; las escuelas difieren en cuanto al homicidio intencional, al homicidio por causalidad y al homicidio de un feto. El artículo luego aborda la ruptura del ayuno de Ramadán y las reglas sobre las relaciones sexuales durante el mismo, las prohibiciones del Hajj y el Ihram, la expiación por el Zihar, y las condiciones y tipos de expiación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13417} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13418} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
  fr: "La kaffara, qui signifie « couvrir » et provient de la racine « dissimuler », est une expiation due en droit pour certains péchés et transgressions. Elle revêt un caractère à la fois pénal et spirituel. L'une des causes est la rupture d'un serment: l'expiation est due dès la rupture du serment, et non dès sa prestation. Les écoles juridiques divergent quant au serment de mensonge et au serment vain, quant à la nécessité de plusieurs expiations pour plusieurs serments portant sur un même sujet, et quant à l'expiation préalable à la rupture du serment. Une autre cause est le meurtre: tous s'accordent sur l'expiation pour le meurtre involontaire et le meurtre quasi intentionnel; les écoles divergent quant au meurtre intentionnel, au meurtre par cause et au meurtre d'un fœtus. L'article traite ensuite de la rupture du jeûne du Ramadan et des règles relatives aux relations sexuelles pendant ce jeûne, des interdictions du hajj et de l'ihram, de l'expiation pour le zihar, ainsi que des conditions et des types d'expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
  tr: "Dilsel olarak aff, gizlemek anlamına gelir ve bazı günahlar ile dini ihlaller için yasal olarak tazminat etmek zorunludur. Ceza ve ibadet anlamını içerir. Nedenleri arasında, yemin ile değil, yemin bozarak zorunlu olan yemini bozmak yer alır. Daldırma ve boş konuşma içeren yeminler, yeminlerin çoklu kefaretleri ve yemin bozulmadan önce tekfirin kabul edilemezliği konusunda anlaşmazlıklar vardır. Nedenleri arasında öldürmek de vardır. Kasıtlı ya da kazara öldürme konusunda anlaşmazlık yoktur; kasıtlı öldürme, sebeple öldürme ve fetal eylem konusunda anlaşmazlık vardır. Bölüm, Ramazan ve diğer dönemlerde zihar ve cinsel ilişki nedenleriyle tamamlanır. Makale daha sonra Ramazan'da gündüz orucun kesilmesi, cinsel ilişkinin kuralları, Hac ve İhram yasakları, ziharın kefareti ve kefaretin koşulları ile niteliklerini ele alır. {alıntı:] fiqh-mawsua-kuwaitiyya-noor-v3 s.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13425}"
  id: "Penebusan secara linguistik berarti penyembunyian, dan secara hukum wajib mengganti beberapa dosa dan pelanggaran agama. Ini mencakup makna hukuman dan ibadah. Di antara penyebabnya adalah melanggar sumpah, yang wajib dengan melanggar sumpah, bukan dengan sumpah. Ada perbedaan pendapat tentang sumpah yang melibatkan pencelupan dan pembicaraan kosong, serta mengenai beberapa penebusan sumpah, serta ketidakbolehan takfir sebelum melanggar sumpah. Di antara penyebabnya adalah pembunuhan. Tidak ada perbedaan pendapat tentang pembunuhan baik yang disengaja maupun tidak disengaja, dan ada perbedaan pendapat tentang pembunuhan sengaja, pembunuhan karena sebab, dan tindakan janin. Bab ini diselesaikan dengan alasan zihar dan hubungan seksual dalam Ramadan dan lainnya. Artikel kemudian membahas pemutusan puasa pada siang hari di Ramadan, aturan hubungan seksual selama Ramadan, larangan Haji dan Ihram, penebusan untuk zihar, serta kondisi dan karakteristik penebusan dosa. {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
