label:
  ar: "كَفَّارة"
  en: "Expiation (kaffara)"
  ur: "کفارہ"
summary:
  ar: "الكفارة لغة من الستر، وهي شرعاً واجبة جبراً لبعض الذنوب والمخالفات الشرعية، وفيها معنى العقوبة ومعنى العبادة. ومن أسبابها الحنث في اليمين، وتجب بالحنث لا باليمين، واختلف في اليمين الغموس واللغو، وفي تعدد الكفارات بتعدد الأيمان، وفي عدم جواز التكفير قبل الحنث. ومن أسبابها القتل، فلا خلاف في القتل شبه العمد والخطأ، واختلف في العمد وفي القتل بالتسبب وفي الجنين. ويكمل الباب بسببي الظهار والوطء في رمضان وغيرهما، وتتناول المادة بعد ذلك الإفطار في نهار رمضان وأحكام الجماع فيه، ومحظورات الحج والإحرام، وكفارة الظهار، وشروط الكفارات وخصالها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
  en: "Kaffara means covering, from the root of concealing. In law it is an expiation owed for certain sins and violations; it has both a penal and a devotional character. One cause is breaking an oath: it is owed on breaking the oath, not on swearing it; the schools differ on the oath of deception and on the vain oath, on whether several oaths on one matter need several expiations, and on expiating before breaking the oath. Another cause is killing: all agree on the expiation for killing by mistake and near-intentional killing; the schools differ on intentional killing, on killing by causation and on a foetus. The article then covers breaking the fast of Ramadan and the rules on intercourse in it, the prohibitions of the hajj and ihram, the expiation for zihar, and the conditions and kinds of expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
  ur: "کفارہ لغت میں ڈھانپنے سے ہے، اور شرعاً بعض گناہوں اور شرعی خلاف ورزیوں کی جبری تلافی ہے، جس میں سزا اور عبادت دونوں کا پہلو ہے۔ اس کا ایک سبب قسم توڑنا ہے، جو قسم کھانے پر نہیں بلکہ توڑنے پر واجب ہوتا ہے؛ یمین غموس اور لغو میں اختلاف ہے، اسی طرح ایک بات پر کئی قسموں کے کفارے کی تعداد اور حنث سے پہلے کفارہ دینے میں اختلاف ہے۔ دوسرا سبب قتل ہے: خطا اور شبہِ عمد میں اتفاق ہے، عمد، قتل بالتسبب اور جنین میں اختلاف ہے۔ اس کے بعد رمضان کے روزے کا توڑنا، حج اور احرام کے محظورات، ظہار کا کفارہ، اور کفاروں کی شرائط اور خصلتیں آتی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13411} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13415} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13416} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13425}"
