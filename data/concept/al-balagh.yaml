id: concept/al-balagh
class: concept
kind: doctrine
label: { ar: "البلاغ وحدود مسؤولية الرسول", en: "Delivery of the message and the limit of the Prophet's charge", fr: "La transmission du message et les limites de la mission du Prophète", es: "La transmisión del mensaje y el alcance de la misión del Profeta", ur: "پیغام کی ترسیل اور پیغمبر کے چارج کی حد" }
summary:
  ar: "يقرر الشعراوي أن النبي بشير ونذير مكلّف بالبلاغ، لا يُسأل عن أصحاب الجحيم، ولا يُكره الناس على الإيمان، لأن الله خلقهم مختارين. ويذكر أن الرسالة بالحق لا تتناقض ولا تتغير. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}"
  en: "Sha'rawi holds that the Prophet is a bringer of good news and a warner whose charge is to deliver the message; he is not answerable for the people of the Fire, and no one is forced to believe, since God created people free to choose. He adds that a message of truth does not contradict itself or change {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}."
  fr: "Sha'rawi considère le Prophète comme un annonciateur de bonnes nouvelles et un avertisseur, dont la mission est de transmettre le message. Il n’a pas à répondre du sort des gens du Feu, et nul n’est contraint de croire, car Dieu a créé les êtres humains libres de choisir. Sha'rawi ajoute qu’un message de vérité ne se contredit pas et ne change pas {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}."
  es: "Sha'rawi sostiene que el Profeta es portador de buenas noticias y un amonestador cuya misión es transmitir el mensaje; no es responsable ante la gente del Infierno, y nadie está obligado a creer, puesto que Dios creó a las personas libres para elegir. Añade que un mensaje de verdad no se contradice ni cambia {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}."
  ur: "شعراوی کا خیال ہے کہ پیغمبر بشارت دینے والے اور ڈرانے والے ہیں جن کی ذمہ داری پیغام پہنچانا ہے۔ وہ جہنمیوں کے لیے جوابدہ نہیں ہے، اور کسی کو یقین کرنے پر مجبور نہیں کیا جاتا ہے، کیونکہ خدا نے لوگوں کو انتخاب کرنے کے لیے آزاد پیدا کیا ہے۔ انہوں نے مزید کہا کہ سچائی کا پیغام خود سے متصادم یا تبدیل نہیں ہوتا ہے {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}۔"
