id: concept/al-balagh
class: concept
kind: doctrine
label: { ar: "البلاغ وحدود مسؤولية الرسول", en: "Delivery of the message and the limit of the Prophet's charge" }
summary:
  ar: "يقرر الشعراوي أن النبي بشير ونذير مكلّف بالبلاغ، لا يُسأل عن أصحاب الجحيم، ولا يُكره الناس على الإيمان، لأن الله خلقهم مختارين. ويذكر أن الرسالة بالحق لا تتناقض ولا تتغير. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}"
  en: "Sha'rawi holds that the Prophet is a bringer of good news and a warner whose charge is to deliver the message; he is not answerable for the people of the Fire, and no one is forced to believe, since God created people free to choose. He adds that a message of truth does not contradict itself or change {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}."
wings: [ideas]
themes: [prophets, scripture-and-its-sciences]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "ما حدود مسؤولية الرسول عن هداية الناس، وهل يُكره أحد على الإيمان؟"
  en: "What are the limits of the Prophet's responsibility for guiding people, and can anyone be forced to believe?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-delivery
    stance:
      ar: "البلاغ واجب الرسول، والهداية بيد الله، والإكراه غير واقع"
      en: "Delivery is the Prophet's duty; guidance is in God's hand; compulsion does not occur"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الله أمر رسوله أن يبشر وينذر، ونهاه أن يُنهك نفسه حزناً على من لم يؤمن، وإن الله لو أراد القهر لقهر خلقه جميعاً، فالله يريد قلوباً تحبه لا قلوباً مقهورة على الإيمان. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}"
      en: "Sha'rawi says God commanded His messenger to bring good news and to warn, and forbade him to wear himself out in grief over those who do not believe; had God willed compulsion He would have compelled all creation, for He wants hearts that love Him, not hearts forced into belief {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.560}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "ما زالت أقوال المفسرين في قوله «لا تُسأل عن أصحاب الجحيم» دون مصدر في هذه الدفعة"
      en: "The exegetes' readings of «you will not be asked about the people of the Fire» are not yet entered from a source"
    holders: []
    summary:
      ar: "لم تُدخل بعد أقوال المفسرين في معنى نفي السؤال عن أصحاب الجحيم، ولا الرأي الأكاديمي أو الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.559}"
      en: "The exegetes' readings of the statement that the Prophet will not be asked about the people of the Fire, the academic view and other views are not yet entered."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
