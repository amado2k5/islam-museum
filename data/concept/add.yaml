label:
  ar: "العَضّ"
  en: "Biting and the liability for injury it causes (add)"
  ur: "کاٹنا (عض)"
summary:
  ar: "العض في اللغة الشد على الشيء بالأسنان والإمساك به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648}. ومن عض إنساناً بغير حق فحصل منه جرح ضمن العاض أرش الجرح، ويكون الضمان حكومة عدل يقدرها أهل الخبرة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648}. وإذا عض رجل يد آخر فجذبها المعضوض من فمه فوقعت ثنايا العاض فلا ضمان عند جمهور الفقهاء، لما ورد من قضاء في واقعة، وقيده الشافعية بأن يتخلص المعضوض بالأسهل فالأسهل، وذهب المالكية في المشهور إلى وجوب الضمان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11649}."
  en: "In the lexicon, add is gripping a thing with the teeth and holding it. If a person bites another without right and a wound results, the biter must pay the damages for the wound, assessed as a just award by experts {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648}. If one man bites another's hand and the bitten man pulls it free so that the biter's front teeth fall out, most jurists hold that there is no liability, relying on a prophetic judgement in such a case; the Shafi'is limit this to a bitten man who chose the easiest means of release, and the preferred Maliki view requires compensation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11649}."
