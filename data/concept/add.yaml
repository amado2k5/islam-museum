label:
  ar: "العَضّ"
  en: "Biting and the liability for injury it causes (add)"
  fr: "Morsure et responsabilité pour la blessure causée (add)"
  ur: "کاٹنا ⁦(عض)⁩"
  es: "Las mordeduras y la responsabilidad por las lesiones que provocan (añadir)"
  tr: "Isırmak"
  id: "Gigitan"
summary:
  ar: "العض في اللغة الشد على الشيء بالأسنان والإمساك به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648}. ومن عض إنساناً بغير حق فحصل منه جرح ضمن العاض أرش الجرح، ويكون الضمان حكومة عدل يقدرها أهل الخبرة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648}. وإذا عض رجل يد آخر فجذبها المعضوض من فمه فوقعت ثنايا العاض فلا ضمان عند جمهور الفقهاء، لما ورد من قضاء في واقعة، وقيده الشافعية بأن يتخلص المعضوض بالأسهل فالأسهل، وذهب المالكية في المشهور إلى وجوب الضمان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11649}."
  en: "In the lexicon, add is gripping a thing with the teeth and holding it. If a person bites another without right and a wound results, the biter must pay the damages for the wound, assessed as a just award by experts {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648}. If one man bites another's hand and the bitten man pulls it free so that the biter's front teeth fall out, most jurists hold that there is no liability, relying on a prophetic judgement in such a case; the Shafi'is limit this to a bitten man who chose the easiest means of release, and the preferred Maliki view requires compensation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11649}."
  fr: "Dans le lexique, add signifie saisir une chose entre les dents et la retenir. Si quelqu’un mord autrui sans en avoir le droit et lui cause une blessure, l’auteur de la morsure doit verser une indemnité dont le montant équitable est fixé par des experts {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648}. Si un homme mord la main d’un autre et que ce dernier la retire, faisant tomber les incisives de l’auteur de la morsure, la plupart des juristes estiment qu’aucune indemnité n’est due, en s’appuyant sur un jugement prophétique rendu dans un cas semblable ; les chaféites limitent cette règle au cas où la victime a choisi le moyen le plus facile de se dégager, tandis que l’avis privilégié chez les malikites exige une indemnité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11649}."
  es: "En el léxico, \"add\" significa agarrar algo con los dientes y sujetarlo. Si una persona muerde a otra sin derecho y resulta una herida, el mordedor debe pagar los daños por la herida, evaluados como una compensación justa por expertos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648}. Si un hombre muerde la mano de otro y el mordido la suelta de tal manera que los dientes frontales del mordedor se caen, la mayoría de los juristas sostienen que no hay responsabilidad, basándose en un juicio profético en tal caso; los shafi'ís limitan esto a un hombre mordido que eligió el medio más fácil de liberación, y la opinión preferida de Maliki exige compensación {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11649}."
  ur: "لغت میں add کسی چیز کو دانتوں سے پکڑ کر پکڑنا ہے۔ اگر کوئی شخص بغیر کسی حق کے دوسرے کو کاٹتا ہے اور زخم کا نتیجہ ہوتا ہے، تو کاٹنے والے کو زخم کا ہرجانہ ادا کرنا ہوگا، جسے ماہرین نے جائز قرار دیا ہے۔ اگر ایک آدمی دوسرے کا ہاتھ کاٹتا ہے اور کاٹنے والا اسے کھینچتا ہے تاکہ کاٹنے والے کے اگلے دانت گر جائیں، تو اکثر فقہاء کا خیال ہے کہ اس میں کوئی ذمہ داری نہیں ہے، ایسی صورت میں پیغمبرانہ فیصلے پر انحصار کرتے ہوئے؛ شافعی اس کو ایک کاٹے ہوئے آدمی تک محدود کرتے ہیں جس نے رہائی کا سب سے آسان ذریعہ منتخب کیا، اور مالکی کا پسندیدہ قول معاوضہ کا متقاضی ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11648}"
  tr: "Dilde 'ısırmak' dişleriyle bir şeyi çekip tutmak anlamına gelir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11648}. Ve birini haksızca ısırıp ısırığında yara açan kişi, yarayı serpecektir ve sorumluluk uzmanlarca değer verilen adil bir hükümettir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11648}. Bir adam başka bir elini ısırırsa ve ısıran kişi elini ağzından çeker ve ısıran dişler düşerse, çoğu hukukçuya göre, bir davada bildirilen karara göre sorumluluk yoktur. Şafi'ler, ısıran kişiyi en kolay şekilde uzaklaştırmanın en kolay yolu ile sınırlarken, bilinen görüşe göre Maliki görüşü sorumluluk yükümlülüğüdür {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11649}."
  id: "Dalam bahasa, 'menggigit' berarti menarik sesuatu dengan gigi dan memegangnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11648}. Dan siapa pun yang menggigit seseorang secara tidak adil dan menyebabkan luka di dalam gigitan itu, ia harus menaburkan luka itu, dan tanggung jawabnya adalah pemerintahan yang adil yang dinilai oleh para ahli {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11648}. Jika seorang pria menggigit tangan lain dan orang yang menggigit menariknya dari mulutnya dan gigi gigitan jatuh, tidak ada tanggung jawab menurut mayoritas ahli hukum, berdasarkan putusan yang dilaporkan dalam suatu kasus. Syafi membatasi cara termudah untuk mengeluarkan orang yang menggigit, dan pandangan Maliki dalam pandangan yang dikenal adalah kewajiban tanggung jawab {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11648} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11649}."
