id: concept/ilaj-ikhtilat-al-dhihn
class: concept
kind: scientific
label:
  ar: "علاج اختلاط الذهن"
  en: "Treatment of confusion of the mind"
  ur: "ذہن کی گڑبڑ کا علاج"
summary:
  ar: "يذكر ابن سينا مبادئ علاج اختلاط الذهن بحسب سببه: الإحالة إلى باب المالنخوليا، وتعديل الدم، والاستفراغ وتبديل المزاج في الصفراء، وتقوية الرأس عند مشاركة عضو، ويحيل صعبه إلى تدبير مانيا؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.98}"
  en: "Ibn Sina gives the principles of treating confusion of the mind by its cause: referral to the chapter on melancholia, tempering the blood, evacuation and change of temperament for yellow bile, strengthening the head where another organ shares, and treating the severe as mania; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.98}"
  ur: "ابن سینا ذہن کی گڑبڑ کے علاج کے اصول سبب کے مطابق بتاتا ہے: مالنخولیا کے باب کا حوالہ، خون کو معتدل کرنا، صفراء میں استفراغ اور مزاج کی تبدیلی، کسی عضو کی شرکت میں سر کو قوت دینا، اور شدید کو مانیا کی تدبیر پر رکھنا؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.98}۔"
