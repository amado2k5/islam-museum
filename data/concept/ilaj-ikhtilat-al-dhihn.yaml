id: concept/ilaj-ikhtilat-al-dhihn
class: concept
kind: scientific
label:
  ar: "علاج اختلاط الذهن"
  en: "Treatment of confusion of the mind"
  ur: "ذہن کی گڑبڑ کا علاج"
  es: "Tratamiento de la confusión mental"
  fr: "Traitement de la confusion mentale"
  tr: "Zihin Karıştırmanın Tedavisi"
  id: "Perlakuan Pencampuran Pikiran"
summary:
  ar: "يذكر ابن سينا مبادئ علاج اختلاط الذهن بحسب سببه: الإحالة إلى باب المالنخوليا، وتعديل الدم، والاستفراغ وتبديل المزاج في الصفراء، وتقوية الرأس عند مشاركة عضو، ويحيل صعبه إلى تدبير مانيا؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.98}"
  en: "Ibn Sina gives the principles of treating confusion of the mind by its cause: referral to the chapter on melancholia, tempering the blood, evacuation and change of temperament for yellow bile, strengthening the head where another organ shares, and treating the severe as mania; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.98}"
  ur: "ابن سینا ذہن کی گڑبڑ کے علاج کے اصول سبب کے مطابق بتاتا ہے: مالنخولیا کے باب کا حوالہ، خون کو معتدل کرنا، صفراء میں استفراغ اور مزاج کی تبدیلی، کسی عضو کی شرکت میں سر کو قوت دینا، اور شدید کو مانیا کی تدبیر پر رکھنا؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.98}۔"
  es: "Ibn Sina expone los principios para tratar la confusión mental según su causa: remite al capítulo sobre la melancolía, la moderación de la sangre, la evacuación y el cambio de temperamento en caso de bilis amarilla, el fortalecimiento de la cabeza cuando otro órgano comparte la función y el tratamiento de los casos graves como si fueran manía; las recetas y los métodos de aplicación no se reproducen {cite:canon-ibn-sina-print-v2 p.98}."
  fr: "Ibn Sina expose les principes du traitement de la confusion mentale en s'appuyant sur sa cause: référence au chapitre sur la mélancolie, purification du sang, évacuation et modification du tempérament en cas de bile jaune, renforcement de la tête lorsque d'autres organes sont touchés, et traitement des cas graves comme étant de la manie; les recettes et les méthodes d'application ne sont pas reproduites {cite:canon-ibn-sina-print-v2 p.98}"
  tr: "İbn Sina, zihinsel karmaşanın tedavisinin ilkelerini nedenine göre belirtir: melankolik kapıya yönlendirme, kan düzenlemesi, kusma ve safra ruh hali değişiklikleri, bir uzuv etkilendiğinde başın güçlendirilmesi ve zorluğunu manik yönetime bağlar; ne tarifler ne de kullanım yöntemleri {cite:canon-ibn-sina-print-v2 s.98}"
  id: "Ibn Sina menyebutkan prinsip penanganan kebingungan mental berdasarkan penyebabnya: rujukan ke gerbang melankolis, regulasi darah, muntah dan perubahan suasana hati pada empedu, memperkuat kepala saat anggota tubuh terlibat, dan mengaitkan kesulitannya dengan manajemen manik; baik resep maupun metode penggunaannya {cite:canon-ibn-sina-print-v2 hlm.98}"
