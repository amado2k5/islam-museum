label:
  ar: "نوعا النقل في التاريخ عند رشيد الدين"
  en: "Two classes of historical report in Rashid al-Din"
  ur: "رشید الدین کے نزدیک تاریخی نقل کی دو اقسام"
  fr: "Deux classes de rapports historiques chez Rashid al-Din"
  es: "Dos clases de relato histórico en Rashid al-Din"
  tr: "Rashid al-Din'e göre tarihte iki tür iletim"
  id: "Dua jenis penularan dalam sejarah menurut Rashid al-Din"
summary:
  ar: "يقسم رشيد الدين في مقدمة جامع التواريخ النقل التاريخي إلى نوعين، كما قسم أهل الحديث النقل إلى متواتر وآحاد. المتواتر يفضي إلى العلم ولا شبهة فيه، ومنه أخبار الرسل والملوك والعظماء في القرون القريبة وتاريخ البلاد البعيدة كمكة ومصر. وغير المتواتر يحتمل الصدق والكذب، وهو أكثر روايات التاريخ، فعلى المؤرخ أن يدرسه فيأخذ بما اطمأن إليه، ويطرح ما شك فيه أو يذكر شكه، وأن ينقل أخبار كل قوم كما وردت في كتبهم، تاركاً العهدة على الراوي {cite:jami-al-tawarikh-khashshab-1960 p. 15}{cite:jami-al-tawarikh-khashshab-1960 p. 16}{cite:jami-al-tawarikh-khashshab-1960 p. 17}."
  en: "In the introduction to the Jami' al-Tawarikh Rashid al-Din divides historical transmission into two kinds, as the scholars of hadith divide transmission into mass-transmitted and single-chain reports. The mass-transmitted kind yields knowledge without doubt, and includes the reports on messengers, kings and great men of recent centuries, and the histories of distant lands such as Mecca and Egypt. The other kind may be true or false, and it makes up most historical reports; the historian must study it, accept what he finds secure, reject or note what he doubts, and report each people's accounts as they stand in their own books, leaving responsibility on the narrator {cite:jami-al-tawarikh-khashshab-1960 p. 15}{cite:jami-al-tawarikh-khashshab-1960 p. 16}{cite:jami-al-tawarikh-khashshab-1960 p. 17}."
  es: "En la introducción al Jami' al-Tawarikh, Rashid al-Din divide la transmisión histórica en dos clases, como los estudiosos del hadiz dividen la transmisión en mutawatir y ahad. La clase mutawatir produce conocimiento sin duda y comprende los relatos sobre mensajeros, reyes y grandes hombres de los siglos recientes, y las historias de tierras lejanas como La Meca y Egipto. La otra clase puede ser verdadera o falsa, y constituye la mayor parte de los relatos históricos: el historiador debe estudiarla, aceptar lo que le parezca seguro, descartar o señalar lo que dude, y transmitir los relatos de cada pueblo tal como figuran en sus propios libros, dejando la responsabilidad al narrador {cite:jami-al-tawarikh-khashshab-1960 p. 15}{cite:jami-al-tawarikh-khashshab-1960 p. 16}{cite:jami-al-tawarikh-khashshab-1960 p. 17}."
  fr: "Dans l'introduction au Jami' al-Tawarikh, Rashid al-Din divise la transmission historique en deux sortes, à la manière dont les savants du hadith divisent la transmission en mutawatir et ahad. La première sorte conduit à la connaissance sans doute et comprend les récits sur les messagers, les rois et les grands hommes des siècles récents, ainsi que les histoires de pays lointains comme La Mecque et l'Égypte. L'autre sorte peut être vraie ou fausse et forme l'essentiel des récits historiques : l'historien doit l'étudier, retenir ce qui lui paraît sûr, écarter ou signaler ce qu'il doute, et rapporter les récits de chaque peuple tels qu'ils figurent dans leurs livres, en laissant la responsabilité au rapporteur {cite:jami-al-tawarikh-khashshab-1960 p. 15}{cite:jami-al-tawarikh-khashshab-1960 p. 16}{cite:jami-al-tawarikh-khashshab-1960 p. 17}."
  ur: "رشید الدین جامع التواریخ کے مقدمے میں تاریخی نقل کو دو اقسام میں تقسیم کرتے ہیں، جیسے محدثین نقل کو متواتر اور آحاد میں بانٹتے ہیں۔ متواتر نقل بلاشبہ علم دیتی ہے، اور اس میں رسولوں، بادشاہوں اور قریبی صدیوں کے عظیم لوگوں کی خبریں اور مکہ و مصر جیسے دور دراز ملکوں کی تاریخ شامل ہے۔ دوسری قسم سچ بھی ہو سکتی ہے اور جھوٹ بھی، اور تاریخی روایات کی اکثریت اسی قسم سے ہے؛ مؤرخ کو اس کا مطالعہ کرنا چاہیے، جو بات قابلِ اطمینان ہو اسے لے، جس میں شک ہو اسے چھوڑ دے یا اپنے شک کا ذکر کرے، اور ہر قوم کی روایات کو ویسے ہی نقل کرے جیسے ان کی اپنی کتابوں میں درج ہیں، ذمہ داری راوی پر چھوڑتے ہوئے {cite:jami-al-tawarikh-khashshab-1960 p. 15}{cite:jami-al-tawarikh-khashshab-1960 p. 16}{cite:jami-al-tawarikh-khashshab-1960 p. 17}۔"
  tr: "Rashid al-Din, Cami'l-Tawarikh'in girişinde, hadis âlimlerinin aktarımı mütevatir ve yalnız rivayetler olarak ayırdığı gibi, tarihsel aktarımı iki türe ayırır. Mutevatir, son yüzyıllardaki elçilerin, kralların ve büyük şahsiyetlerin haberleri ile Mekke ve Mısır gibi uzak diyarların tarihini içeren şüphesiz bilgiye götürür. Mutevatir ve mutevatir olmayan muhtemelen doğru ya da yanlış olabilir ve tarihte en yaygın anlatımdır. Tarihçi bunu incelemeli, kendisine güven verdiği şeyleri almalı ve her halkın haberini kitaplarında kayıtlı olarak iletmeli, sorumluluğu anlatıcıya bırakır {cite:jami-al-tawarikh-khashshab-1960 s. 15}{cite:jami-al-tawarikh-khashshab-1960 s. 17}."
  id: "Rashid al-Din, dalam pengantar Jami' al-Tawarikh, membagi transmisi sejarah menjadi dua jenis, sama seperti para ulama hadis membagi transmisi menjadi mutawatir dan narasi tunggal. Mutawatir membawa pengetahuan tanpa keraguan, termasuk laporan utusan, raja, dan tokoh besar dalam abad-abad terakhir serta sejarah negeri-negeri jauh seperti Mekah dan Mesir. Mutawatir dan non-mutawatir kemungkinan benar atau salah, dan ini adalah narasi yang paling umum dalam sejarah. Sejarawan harus mempelajarinya, menerima apa yang membuatnya yakin, menyingkirkan segala keraguan atau keraguan, dan menyampaikan berita dari setiap bangsa sebagaimana tercatat dalam buku mereka, menyerahkan tanggung jawab kepada narator {cite:jami-al-tawarikh-khashshab-1960 hlm. 15}{cite:jami-al-tawarikh-khashshab-1960 hlm. 17}."
