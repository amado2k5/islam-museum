label:
  ar: "بول"
  en: "Bawl (urine, used as a drug)"
  ur: "بول ⁦(پیشاب بطور دوا)⁩"
summary:
  ar: "أنفع الأبوال بول الجمل الأعرابي، وبول الإنسان أضعف الأبوال وأجلاها، وكله يجلو، ويُستعمل في القروح والجرب والبهق والحكّة، ولبول الخنزير والحمار والمعز والبقر مواضع في الحصاة والمثانة والأذن والحمّى وسيلان القيح، ويُذكر فيه ما يخصّ الأرحام فيُسجَّل كما ورد دون توصية {cite:canon-ibn-sina-print-v1 p.412}، {cite:canon-ibn-sina-print-v1 p.413}."
  en: "The most useful urine is that of the Bedouin camel. Human urine is the weakest, yet the clearest. All urines cleanse; they are used on sores, mange, white patches and itching. The book gives urines of pigs, asses, goats and cows uses for stones of the kidney and bladder, ear discharge, fever and flows of pus. Its listing on the womb is kept as the book's own, labelled, not as advice {cite:canon-ibn-sina-print-v1 p.412}, {cite:canon-ibn-sina-print-v1 p.413}."
  ur: "سب سے مفید پیشاب بدوی اونٹ کا ہے، انسانی پیشاب سب سے کمزور مگر سب سے زیادہ صاف کرنے والا ہے۔ سب پیشاب صاف کرتے ہیں؛ انہیں زخموں، خارش، برص اور کھجلی پر لگایا جاتا ہے۔ کتاب سور، گدھے، بکری اور گائے کے پیشاب کے لیے گردے اور مثانے کی پتھری، کان کے بہاؤ، بخار اور پیپ کے بہاؤ میں استعمال بتاتی ہے۔ رحم سے متعلق اس کی فہرست کو کتاب کی اپنی فہرست کے طور پر، نشان زد کر کے، نسخے کے بغیر لکھا گیا ہے {cite:canon-ibn-sina-print-v1 p.412}، {cite:canon-ibn-sina-print-v1 p.413}۔"
