label:
  ar: "بول"
  en: "Bawl (urine, used as a drug)"
  fr: "Bawl (urine employée comme remède)"
  ur: "بول ⁦(پیشاب بطور دوا)⁩"
  es: "Bawl (orina, usada como droga)"
  tr: "idrar"
  id: "urin"
summary:
  ar: "أنفع الأبوال بول الجمل الأعرابي، وبول الإنسان أضعف الأبوال وأجلاها، وكله يجلو، ويُستعمل في القروح والجرب والبهق والحكّة، ولبول الخنزير والحمار والمعز والبقر مواضع في الحصاة والمثانة والأذن والحمّى وسيلان القيح، ويُذكر فيه ما يخصّ الأرحام فيُسجَّل كما ورد دون توصية {cite:canon-ibn-sina-print-v1 p.412}، {cite:canon-ibn-sina-print-v1 p.413}."
  en: "The most useful urine is that of the Bedouin camel. Human urine is the weakest, yet the clearest. All urines cleanse; they are used on sores, mange, white patches and itching. The book gives urines of pigs, asses, goats and cows uses for stones of the kidney and bladder, ear discharge, fever and flows of pus. Its listing on the womb is kept as the book's own, labelled, not as advice {cite:canon-ibn-sina-print-v1 p.412}, {cite:canon-ibn-sina-print-v1 p.413}."
  fr: "L’urine la plus utile serait celle du chameau bédouin ; l’humaine est la plus faible, mais la plus claire. Toutes nettoient ; elles sont employées sur plaies, gale, taches blanches et démangeaisons. Le livre attribue aux urines de porc, d’âne, de chèvre et de vache des usages contre calculs rénaux et vésicaux, écoulements auriculaires, fièvre et pus. L’indication utérine reste attribuée au livre, non présentée comme un conseil {cite:canon-ibn-sina-print-v1 p.412}, {cite:canon-ibn-sina-print-v1 p.413}."
  ur: "سب سے مفید پیشاب بدوی اونٹ کا ہے، انسانی پیشاب سب سے کمزور مگر سب سے زیادہ صاف کرنے والا ہے۔ سب پیشاب صاف کرتے ہیں؛ انہیں زخموں، خارش، برص اور کھجلی پر لگایا جاتا ہے۔ کتاب سور، گدھے، بکری اور گائے کے پیشاب کے لیے گردے اور مثانے کی پتھری، کان کے بہاؤ، بخار اور پیپ کے بہاؤ میں استعمال بتاتی ہے۔ رحم سے متعلق اس کی فہرست کو کتاب کی اپنی فہرست کے طور پر، نشان زد کر کے، نسخے کے بغیر لکھا گیا ہے {cite:canon-ibn-sina-print-v1 p.412}، {cite:canon-ibn-sina-print-v1 p.413}۔"
  es: "La orina más útil es la del camello beduino. La orina humana es la más débil, pero la más clara. Todas las orinas limpian; se usan para llagas, sarna, manchas blancas y picazón. El libro menciona orinas de cerdos, asnos, cabras y vacas para cálculos renales y vesicales, secreción de oído, fiebre y supuración. Su descripción del útero se conserva como propia del libro, etiquetada, no como consejo {cite:canon-ibn-sina-print-v1 p.412}, {cite:canon-ibn-sina-print-v1 p.413}."
  tr: "En faydalı idrar bedevi devesinin idrarıdır, insan idrarı ise en zayıf ve en yaygın idrardır. Hepsi atılır ve ülser, uyuz, vitiligo ve kaşıntı için kullanılır. Domuz, eşek, keçi ve sığır idrarında taş, mesane, kulak, ateş ve irin akıntısı bulunur. Ayrıca rahmi ilgilendiren şeyleri belirtir ve tavsiye olmaksızın bildirildiğini kaydeder {cite:canon-ibn-sina-print-v1 s.412}, {cite:canon-ibn-sina-print-v1 s.413}."
  id: "Urine yang paling bermanfaat adalah urin unta Badui, sementara urin manusia adalah urine yang paling lemah dan paling umum. Semua urin tersebut dikeluarkan dan digunakan untuk tukak lambung, kudis, vitiligo, dan gatal. Urine babi, keledai, kambing, dan sapi memiliki tempat di batu, kandung kemih, telinga, demam, dan nanah. Juga disebutkan apa yang berkaitan dengan rahim dan mencatatnya sebagai dilaporkan tanpa rekomendasi {cite:canon-ibn-sina-print-v1 hlm.412}, {cite:canon-ibn-sina-print-v1 hlm.413}."
