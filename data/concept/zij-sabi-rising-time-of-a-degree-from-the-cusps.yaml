class: concept
kind: scientific
label: { ar: "زمن طلوع الدرجة بعد الوتد", en: "The rising time of a degree measured from a cusp", ur: "وتد سے درجے کے طلوع کا وقت", es: "El tiempo de ascenso de un grado medido desde una cúspide", fr: "Le temps de montée d'un degré mesuré à partir d'une cuspide" }
summary:
  ar: "تُعرف ساعات الدرجة من الوتد بأن تأخذ البعد عن وسط السماء أو الأرض بالساعات الزمانية، ثم تُعرف الفرق بين الطلوع في الفلك المستقيم وفي الإقليم، فيُقسم الفرق على ستة ويُضرب في ساعات البعد عن الوتد، فيكون ما بين الدرجتين. وإذا كان للجزء قوس على الفلك المستقيم تحسب بأزمان معدل النهار. {cite:zij-sabi-nallino-byblion pp.203-204}"
  en: "The hours of a degree from a cusp are found by taking its distance from the midheaven or the nadir in seasonal hours, then finding the difference between its rising on the straight sphere and its rising in the clime. The difference is divided by six and multiplied by the hours of the distance from the cusp, which gives the interval between the two degrees. {cite:zij-sabi-nallino-byblion pp.203-204}"
  ur: "وتد سے درجے کے گھنٹے یوں معلوم ہوتے ہیں کہ اس کا وسط السماء یا وتد الارض سے فاصلہ ساعات زمانیہ میں لیا جاتا ہے، پھر فلکِ مستقیم پر اور اقلیم میں اس کے طلوع کا فرق معلوم کیا جاتا ہے۔ فرق کو چھ سے تقسیم کر کے وتد سے فاصلے کے گھنٹوں سے ضرب دی جاتی ہے، جو دو درجوں کے درمیان فاصلہ دیتا ہے۔ {cite:zij-sabi-nallino-byblion pp.203-204}"
  es: "Las horas de un grado desde una cúspide se obtienen calculando su distancia al medio cielo o al nadir en horas estacionales, y luego hallando la diferencia entre su salida en la esfera recta y su salida en el clima. La diferencia se divide entre seis y se multiplica por las horas de la distancia a la cúspide, lo que da como resultado el intervalo entre los dos grados. {cite:zij-sabi-nallino-byblion pp.203-204}"
  fr: "On détermine la durée d'un degré à partir d'une cuspide en calculant sa distance au milieu du ciel ou au nadir en heures saisonnières, puis en déterminant la différence entre son lever sur la sphère droite et son lever selon le climat. Cette différence est divisée par six et multipliée par la durée de la distance à la cuspide, ce qui donne l'intervalle entre les deux degrés. {cite:zij-sabi-nallino-byblion pp.203-204}"
