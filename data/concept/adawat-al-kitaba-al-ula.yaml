id: concept/adawat-al-kitaba-al-ula
class: concept
kind: term
label:
  ar: "مواد كتابة القرآن الأول: العسب واللخاف والرقاع والأكتاف"
  en: "The first writing materials of the Qur'an: palm stems, thin stones, scraps and shoulder-blades"
  fr: "Les premiers supports d’écriture du Coran : tiges de palmier, pierres minces, fragments et omoplates"
  ur: "قرآن کی ابتدائی کتابت کا سامان: عسب، لخاف، رقاع اور اکتاف"
  es: "Los primeros materiales de escritura del Corán: tallos de palma, piedras delgadas, retazos y omóplatos."
  tr: "İlk Kur'an'ın yazımı konuları: El-Esb, El-Lakhaf, El-Raka ve El-Kataf"
  id: "Subjek untuk Menulis Al-Qur'an Pertama: Al-Asb, Al-Lakhaf, Al-Raqa, dan Al-Kataf"
summary:
  ar: "ذكر زيد بن ثابت أنه جمع القرآن من العسب واللخاف وصدور الرجال، وفي روايات أخرى الرقاع وقطع الأديم والأكتاف والأضلاع والأقتاب؛ والعسب جريد النخل واللخاف الحجارة الرقاق والرقاع جمع رقعة والأكتاف عظام الكتف {cite:itqan-suyuti p. 385} {cite:itqan-suyuti p. 386}."
  en: "Zayd ibn Thabit said he collected the Qur'an from palm stems, thin stones and men's chests; other reports add scraps, pieces of hide, shoulder-blades, ribs and saddle-wood; asib is the palm stem, likhaf thin stones, riqa' scraps and aktaf the shoulder-bones {cite:itqan-suyuti p. 385} {cite:itqan-suyuti p. 386}."
  fr: "Zayd ibn Thabit dit avoir recueilli le Coran sur des tiges de palmier, des pierres minces et dans la mémoire des hommes. D’autres récits ajoutent des fragments, des morceaux de peau, des omoplates, des côtes et des pièces de bois de selle. Asib désigne la tige de palmier, likhaf les pierres minces, riqa’ les fragments et aktaf les omoplates {cite:itqan-suyuti p. 385} {cite:itqan-suyuti p. 386}."
  ur: "زید بن ثابت نے بتایا کہ انھوں نے قرآن عسب، لخاف اور آدمیوں کے سینوں سے جمع کیا؛ دوسری روایات میں رقاع، چمڑے کے ٹکڑے، اکتاف، پسلیاں اور اقتاب بھی ہیں؛ عسب کھجور کی شاخ، لخاف پتلے پتھر، رقاع ٹکڑے اور اکتاف کندھے کی ہڈیاں ہیں {cite:itqan-suyuti p. 385} {cite:itqan-suyuti p. 386}۔"
  es: "Zayd ibn Thabit dijo que recolectó el Corán de tallos de palma, piedras delgadas y cofres de hombres; otros informes agregan retazos, pedazos de piel, omóplatos, costillas y madera de silla de montar; asib es el tallo de palma, likhaf piedras delgadas, riqa' retazos y aktaf los omóplatos {cite:itqan-suyuti p. 385} {cite:itqan-suyuti p. 386}."
  tr: "Zayd bin Tabit, Kur'an'ı 'asb', 'lakhaf' ve insan sandıklarından derlediğini belirtir. Diğer rivayetlerde 'raqa'a', 'ta'a' al-'adim, 'taf', 'al-dala' ve 'aqtab' anlamına gelir; 'asb' palmiye yapraklarını, 'lakhaf' taşları, 'riqa' ve 'ruqa'' 'rak'a'nın çoğuludur ve 'taf' omuz kemiklerini ifade eder {cite:itqan-suyuti, s. 385} {cite:itqan-suyuti, s. 386}."
  id: "Zayd ibn Thabit menyebutkan bahwa ia menyusun Al-Qur'an dari 'asb', 'lakhaf', dan peti manusia. Dalam riwayat lain, 'raqa'a' merujuk pada 'raqa', 'ta'a' al-'adim, 'taf', 'al-dala'', dan 'aqtab'; 'asb' merujuk pada daun palem, 'lakhaf' adalah batu, 'riqa', dan 'ruqa'' adalah jamak dari 'rak'a', dan 'taf' adalah tulang bahu {cite:itqan-suyuti, hlm. 385} {cite:itqan-suyuti, hlm. 386}."
