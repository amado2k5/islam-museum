label: { ar: "المذاهب الثمانية والعشرون عند المقدسي", en: "The twenty-eight schools in al-Muqaddasi", es: "Las veintiocho escuelas en al-Muqaddasi", fr: "Les vingt-huit écoles d'al-Muqaddasi", ur: "المقدسی میں اٹھائیس مکاتب" }
term: { ar: "المذاهب المستعملة", en: "al-madhahib al-musta'mala" }
summary:
  ar: "تصنيف المقدسي للمذاهب «المستعملة اليوم في الإسلام» في زمانه ثمانية وعشرين مذهباً في سبع رباعيات: أربعة في الفقه، وأربعة في الكلام، وأربعة لها فقه وكلام، وأربعة في الحديث، وأربعة مندرسة، وأربعة رستاقية، وأربعة غلب عليها أربعة من شكلها؛ وهو تصنيفه هو {cite:muqaddasi-ahsan-taqasim-bga-1877 p.47}."
  en: "Al-Muqaddasi's classification of the schools 'in use in Islam today' in his time into twenty-eight, in seven groups of four: four in law, four in theology, four with both law and theology, four of the hadith folk, four extinct, four rural, and four absorbed by four of their kind; the classification is his own."
  es: "La clasificación que hizo Al-Muqaddasi de las escuelas \"en uso en el Islam hoy en día\" en su época las divide en veintiocho, en siete grupos de cuatro: cuatro de derecho, cuatro de teología, cuatro con derecho y teología, cuatro de la tradición hadiz, cuatro extintas, cuatro rurales y cuatro absorbidas por otras cuatro de su tipo; esta clasificación es suya."
  fr: "La classification des écoles « en usage dans l'Islam aujourd'hui » par Al-Muqaddasi à son époque en vingt-huit, réparties en sept groupes de quatre: quatre en droit, quatre en théologie, quatre combinant droit et théologie, quatre en hadith, quatre éteintes, quatre rurales et quatre absorbées par quatre autres de leur genre; cette classification est la sienne."
  ur: "المقدسی نے اپنے زمانے میں 'آج اسلام میں مستعمل' مکاتب کی درجہ بندی اٹھائیس میں کی، سات گروہوں میں: چار قانون میں، چار دینیات میں، چار قانون اور الہیات دونوں کے ساتھ، چار حدیثی فنون، چار معدوم، چار دیہی، اور چار اپنی قسم کے چار سے جذب؛ درجہ بندی اس کی اپنی ہے۔"
