  ar: "تصنيف المقدسي للمذاهب «المستعملة اليوم في الإسلام» في زمانه ثمانية وعشرين مذهباً في سبع رباعيات: أربعة في الفقه، وأربعة في الكلام، وأربعة لها فقه وكلام، وأربعة في الحديث، وأربعة مندرسة، وأربعة رستاقية، وأربعة غلب عليها أربعة من شكلها؛ وهو تصنيفه هو {cite:muqaddasi-ahsan-taqasim-bga-1877 p.47}."
  en: "Al-Muqaddasi's classification of the schools 'in use in Islam today' in his time into twenty-eight, in seven groups of four: four in law, four in theology, four with both law and theology, four of the hadith folk, four extinct, four rural, and four absorbed by four of their kind; the classification is his own."
