summary:
  ar: "الولوغ في اللغة شرب السباع بألسنتها، ومنه ولوغ الكلب في الإناء. والفقهاء مختلفون في نجاسة الإناء بولوغ الكلب، وفي عدد الغسلات، وفي تعدد الولوغ، وفي قبول خبر الثقة عن ولوغ الكلب في أحد الإنائين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17943}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17945}"
  en: "Wulugh is the lapping of a beast of prey with its tongue; the word is used of a dog lapping from a vessel. The jurists differ on whether the vessel becomes impure, how many washings it needs, whether repeated lapping repeats the washing, and whether a trustworthy report of lapping in one of two vessels is accepted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17943}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17945}"
