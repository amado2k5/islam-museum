label:
  ar: "وُلوغ"
  en: "Wulugh (a dog lapping from a vessel, fiqh)"
  es: "Wulugh (un perro lamiendo de un recipiente, fiqh)"
  fr: "Wulugh (un chien qui lèche un récipient, fiqh)"
  ur: "ولوگ ⁦(برتن سے کتے کا گود لینا، فقہ)⁩"
  tr: "Wulgh"
  id: "Wulgh"
summary:
  ar: "الولوغ في اللغة شرب السباع بألسنتها، ومنه ولوغ الكلب في الإناء. والفقهاء مختلفون في نجاسة الإناء بولوغ الكلب، وفي عدد الغسلات، وفي تعدد الولوغ، وفي قبول خبر الثقة عن ولوغ الكلب في أحد الإنائين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17943}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17945}"
  en: "Wulugh is the lapping of a beast of prey with its tongue; the word is used of a dog lapping from a vessel. The jurists differ on whether the vessel becomes impure, how many washings it needs, whether repeated lapping repeats the washing, and whether a trustworthy report of lapping in one of two vessels is accepted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17943}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17945}"
  es: "Wulugh es el lamido que hace una bestia de presa con su lengua; la palabra se usa para describir a un perro lamiendo de un recipiente. Los juristas difieren en cuanto a si el recipiente se vuelve impuro, cuántos lavados necesita, si el lamido repetido repite el lavado y si se acepta un informe fidedigno de lamido en uno de dos recipientes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17943}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17945}"
  fr: "Le terme « wulugh » désigne le léchage d'un animal de proie avec sa langue; il est employé pour décrire un chien léchant un récipient. Les juristes divergent quant à la question de savoir si le récipient devient impur, combien de lavages sont nécessaires, si des léchages répétés entraînent une nouvelle purification, et si un témoignage fiable de léchage dans l'un ou l'autre des deux récipients est recevable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17943}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17945}"
  ur: "وولوگ شکاری جانور کو اپنی زبان سے گود میں لینا ہے۔ یہ لفظ برتن سے کتے کو لپیٹنے کے لیے استعمال ہوتا ہے۔ فقہا کا اختلاف ہے کہ آیا برتن نجس ہو جاتا ہے، کتنے دھونے کی ضرورت ہوتی ہے، کیا بار بار لیپ کرنے سے دھونے کا اعادہ ہوتا ہے، اور کیا دو برتنوں میں سے کسی ایک میں لیپ کرنے کی ثقہ روایت قبول ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17942}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17943}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17945}"
  tr: "Arapçada \"walugh\" kelimesi, vahşi hayvanların dilleriyle su içme eylemini ifade eder ve buradan \"walugh\" (köpeğin bir kabı yalaması) terimi türemiştir. Alimler, bir köpeğin bir kabı yalamasından sonra kabın necis olup olmadığı, gereken yıkama sayısı, yalama sayısı ve bir köpeğin iki kaptan birini yalamasıyla ilgili güvenilir bir rivayetin geçerliliği konusunda farklı görüşlere sahiptirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17943}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17945}"
  id: "Dalam bahasa Arab, kata \"walugh\" merujuk pada tindakan hewan liar minum dengan lidahnya, dan dari sinilah muncul istilah \"walugh\" (tindakan anjing menjilat) sebuah wadah. Para ulama berbeda pendapat mengenai apakah sebuah wadah menjadi najis setelah dijilat anjing, jumlah pencucian yang diperlukan, jumlah jilatan, dan keabsahan laporan yang dapat dipercaya mengenai anjing yang menjilat salah satu dari dua wadah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17942}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17943}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17945}"
