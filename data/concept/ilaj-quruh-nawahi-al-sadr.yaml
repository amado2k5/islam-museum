  "ar": "أما القرحة إذا كانت في قصبة الرئة فإن الدواء يسرع إليها ويجب أن يضطجع العليل\
    \ على قفاه ويمسك الدواء في فيه ويبلع ريقه قليلاً قليلاً من غير أن يرسل كثيراً\
    \ دفعة فيهيج سعال ويجب أن يكون مرخياً عضل حلقه حتى ينزل إلى حلقه من غير تهييج\
    \ بالمغريات المجففة التي تذكر أيضاً في السل، وأما القروح التي في الصدر والرئة\
    \ التي ذكرناها فإنه يحتاج أن ترزق فيها الأدوية الغسالة الجلاءة ويؤمر العليل أن\
    \ يضطجع على الجانب ويسعل ويهتز أو يهز هزاً رقيقاً وربما استخرج القيح منها بعد\
    \ إرسال ماء العسل في القرحة بالآلة الجاذبة للقيح فإذا نقينا المادة ورجوت أنه لم\
    \ يبق منها شيء فحينئذ تستعمل الأدوية الملحمة المدملة وليس في المنقيات الجلاءة\
    \ في مثل ذلك كالعسل فإنه منق وغذاء حبيب إلى الطبيعة لا يضر القروح، وأما قرحة الرئة\
    \ فإن تدبيرها أمران: أحدهما علاج حق والآخر مداراة، أما العلاج الحق فإنما يمكن\
    \ إذا كانت العلة قابلة للعلاج وقد وصفناها وذلك بتنقية القرحة وتجفيفها ودفع المواد\
    \ عنها ومنع النوازل وإعانتها على الالتحام وقد سلف لك تدبير أصل لك في هذا العلاج\
    \ وجملته تنقية البدن وجذب المادة عن الرأس إلى الأسافل وتقوية الرأس لئلا تكثر الفضول\
    \ فيه ومنع ما ينصب من الرأس إلى الرئة وجذبه إلى غير تلك الجهة، ويجب أن تكون التنقية\
    \ بالفصد وبأدوية تخرج الفضول المختلفة من هذا الجنس وربما احتيج إلى ما يخرج الأخلاط\
    \ السوداوية من هذا الجنس وربما احتجت إلى معاودات في الاستفراغ لتقلل الفضول وتستفرغ\
    \ بدواء وتفصد ثم ترفد ثم تعاود وخصوصاً في الأبدان القوية، ومما يعين على قبول الطبيعة\
    \ للتدبير أن ينتقل إلى بلاد فيها هواء جاف ويعالج ويسقى اللبن فيها، ويجب أن تكون\
    \ نصبته في الأكثر نصبة ممددة للعنق إلى فوق وقدام ليستوي وقوع أجزاء الرئة بعضها\
    \ على بعض ولا تزال أجزاء القرحة عن الانطباق والمحاذاة الطبيعية، ويجب أن لا يلح\
    \ عليه بتسكين السعال بموانع النفث فإن فيه خطراً عظيماً وإن أوهم خفة، وأما المداراة\
    \ فهي التدبير في تصليبها وتجفيفها حتى لا تفشو ولا تتسع وإن كان لا يرجى معها الالتحام\
    \ والاندمال وفي ذلك إرجاء في مهلة صاحبها وإن كانت عيشته غير راضية وكان يتأذى بأدنى\
    \ خطأ وهذه المجففات تقبض الرئة وتجففها وتضيق القرحة إن لم تدملها ومن سلك هذه السبيل\
    \ فلا يجب أن يستعمل اللبن البتة، والعسل مركب لأدوية السل ولا مضرة فيه بالقروح،\
    \ وأما تنقية القروح فبالمنقيات المذكورة وطبيخاً من هذا الجنس المذكور للسل في الأقراباذين\
    \ وأقوى من ذلك لعوقاً من هذا الجنس المذكور في الأقراباذين وربما احتيج أن تجمع\
    \ إليها الملزجات المغريات وربما أعينت بالمخدرات لتمنع السعال ويتمكن الدواء من\
    \ فعله، وحينئذ يحتاج إلى تدبير ناعش قوي وقد ذكرنا لك هذه المنقيات في أول الأبواب\
    \ وذكرناها أيضاً في باب التقيح والمعتاد منها الأحساء من هذا الجنس ومياه العسل\
    \ المطبوخة فيها المنقيات والملحمات وكل ذلك قد مضى لك والمعاجين المجففة من هذا\
    \ الجنس، وأما المشروبات العظيمة إذا استعملت في أوقات وخصوصاً في الأول وحين لا\
    \ يكون هزال شديد فهي نافعة وحين لا تكون حمى قد بالغت في الذبول والطين المختوم\
    \ أنفع شيء في كل وقت والطين الأرمني أيضاً وكذلك جميع ما ذكرنا من الضمادات والكمادات\
    \ والمروخات المنقية، وكلما سخن مزاجه فضل سخونة عولج بقرص من هذا الجنس أياماً وعود\
    \ بعدها التجفيف، وأما الأغذية فمن هذا الجنس من اللحوم الجيدة مطيباً ولا يمنع الشراب\
    \ الأبيض الصرف في أوله ويشمم دائماً الرياحين ويلزم النوم والدعة والسكون ويترك\
    \ الغضب والضجر ولا يورد عليه ما يغمه {cite:canon-ibn-sina-print-v2 p.367}"
  "en": "As for the ulcer when it is in the windpipe: the drug reaches it quickly;\
    \ the patient must lie on his back, hold the drug in his mouth and swallow his\
    \ saliva little by little, without sending down much at once lest it stir a cough;\
    \ and the muscle of his throat must be relaxed so it goes down into his throat\
    \ without provocation — by the drying glutinous drugs that are also named in consumption.\
    \ As for the ulcers in the chest and the lung we have mentioned: the washing cleansing\
    \ drugs must be conveyed into them; the patient is ordered to lie on his side,\
    \ to cough and to shake, or to be shaken, a gentle shake; the pus may be drawn\
    \ from them after honey-water is sent into the ulcer by the pus-drawing instrument;\
    \ then when we have cleansed the matter and you hope nothing remains of it, the\
    \ healing agglutinant drugs are used — and among the cleansing detergents there\
    \ is nothing like honey, for it cleanses and is a food beloved to nature, harming\
    \ no ulcers. As for the ulcer of the lung, its management is two things: a true\
    \ treatment and a palliation. The true treatment is only possible when the disease\
    \ is receptive of treatment, as we have described: cleansing the ulcer, drying\
    \ it, pushing the matters away from it, stopping the catarrhs and helping it to\
    \ adhesion; and a regimen has already come to you as a foundation in this treatment\
    \ — its sum being the cleansing of the body, drawing the matter away from the\
    \ head downward, strengthening the head lest superfluities abound in it, preventing\
    \ what pours from the head to the lung and drawing it to another quarter. The\
    \ cleansing must be by venesection and by drugs that bring out the differing superfluities\
    \ of this kind; what brings out the melancholic humours of this kind may be needed;\
    \ and repeated evacuations may be needed to lessen the superfluities — you evacuate\
    \ with a drug, bleed, then feed, then repeat — especially in strong bodies. What\
    \ helps nature accept the regimen is moving to a land of dry air, being treated\
    \ there and given milk there. His posture must mostly be with the neck stretched\
    \ upward and forward, so the parts of the lung lie evenly on one another and the\
    \ ulcer's edges are kept from closing and natural apposition. And he must not\
    \ be importuned with quieting the cough by the preventers of expectoration — there\
    \ is great danger in it, though it gives a semblance of relief. As for the palliation,\
    \ it is the management of hardening and drying it so it does not spread nor widen,\
    \ though adhesion and closure are not hoped with it; and in it there is a respite\
    \ in the patient's term, though his living is not pleasant and he is hurt by the\
    \ least error. These drying things astringe the lung and dry it and narrow the\
    \ ulcer if they do not heal it; and whoever walks this road must not use milk\
    \ at all. Honey is a base for the consumption drugs and does no harm to the ulcers.\
    \ The cleansing of the ulcers is by the said cleansers and a decoction of this\
    \ kind named for consumption in the pharmacopoeia, and stronger than that a lohoch\
    \ of this kind named in the pharmacopoeia; the astringent glutinous things may\
    \ need to be joined to them, and they may be aided by the stupefying drugs so\
    \ the cough is prevented and the drug enabled to act — and then a strong restoring\
    \ regimen is needed. We have named these cleansers for you at the first of the\
    \ chapters and again in the chapter of suppuration; the customary of them are\
    \ the gruels of this kind and the honey-waters in which the cleansers and agglutinants\
    \ are cooked — all that has gone before — and the drying electuaries of this kind.\
    \ As for the great drinks, if used in their seasons — especially at first, when\
    \ the emaciation is not severe and when no fever has gone far in the wasting —\
    \ they are beneficial. The stamped clay is the most beneficial thing at every\
    \ time, and the Armenian clay also, and likewise all the cleansing poultices,\
    \ compresses and liniments we named. Whenever his temperament grows hotter than\
    \ its heat warrants, he is treated with a tablet of this kind for days, then returned\
    \ to the drying. As for foods: of the good meats of this kind, seasoned; the pure\
    \ white drink is not forbidden at first; the flowers are always smelled; sleep,\
    \ repose and stillness are kept; anger and fretting are left; and nothing is brought\
    \ to him that grieves him {cite:canon-ibn-sina-print-v2 p.367}"
  "ur": "جب قرحة نالی میں ہو تو دوا اس تک جلد پہنچتی ہے مریض کو پیٹھ کے بل لٹنا چاہیے\
    \ دوا منہ میں روکے تھوڑا تھوڑا لعاب نگلتا رہے ایک دم زیادہ نہ نکالے کہ کھانسی\
    \ ابھرے اور گلے کے پٹھے کو ڈھیلا رکھنا چاہیے تاکہ وہ بغیر ابھارے گلے میں اترے\
    \ اسی سلسی لے میں وہ خشک چپکنے والی ادویہ جو سل میں بھی کہی جاتی ہیں۔ اور سینے\
    \ اور پھیپھڑے کے وہ زخم جو ہم نے کہے ان میں دھونے والی صاف کرنے والی ادویہ پہنچانا\
    \ ضروری ہے مریض کو حکم دیا جاتا ہے کہ پہلو پر لیٹے کھانسی کرے اور کانپے یا ہلکا\
    \ ہلایا جائے اور ان سے پیپ نکالی جا سکتی ہے جب شہد کا پانی پیپ کھینچنے والے آلہ\
    \ سے قرحة میں بھیجا جائے پھر جب مادہ صاف کر کے امید ہو کہ کچھ نہیں بچا تو ملحم\
    \ مجدل ادویہ استعمال ہوتی ہیں اور صاف کرنے والی جلاؤ میں اس جیسی کوئی نہیں جیسے\
    \ شہد کیونکہ وہ صاف کرنے والا اور طبیعت کی محبوب غذا ہے اور قروح کو ضرر نہیں دیتا\
    \ اور پھیپھڑے کے زخم کا تدبیر دو چیزیں ہیں ایک حقیقی علاج دوسرا مدارات۔ حقیقی\
    \ علاج صرف اس وقت ممکن ہے جب علت علاج قبول کرے جیسا ہم نے بیان کیا یعنی قرحة کی\
    \ تنقیہ اس کا خشک کرنا اس سے مواد دور کرنا نوازل روکنا اور التحام میں مدد اور\
    \ اس علاج میں تمہیں پہلے ہی بنیادی تدبیر مل چکا جس کا خلاصہ بدن کی تنقیہ سر سے\
    \ مادہ نیچے کھینچنا سر کی تقویت تاکہ اس میں فضولات نہ بڑھیں اور سر سے پھیپھڑے\
    \ میں بہنے والا روک کر دوسری طرف موڑنا اور تنقیہ فصد اور اسی جنس کی ادویہ سے ہو\
    \ جو مختلف فضولات خارج کریں اور اسی جنس کی وہ چیز درکار ہو سکتی ہے جو سوداوی اخلاط\
    \ نکالے اور فضولات کم کرنے کے لیے بار بار استفراغ درکار ہو سکتا ہے دوا سے استفراغ\
    \ کرو فصد کرو پھر غذا دو پھر دہراؤ خاص طور پر مضبوط بدنوں میں اور اس میں جو طبیعت\
    \ کے تدبیر قبول کرنے میں مدد دے وہ خشک ہوا والے ملک میں منتقل ہونا وہاں علاج اور\
    \ دودھ پلانا ہے اور اس کی پوزیشن اکثر گردن اوپر اور آگے کو تنائی ہوئی ہونی چاہیے\
    \ تاکہ پھیپھڑے کے حصے ایک دوسرے پر برابر پڑیں اور زخم کے کنارے بند ہونے اور قدرتی\
    \ ملاؤ سے دور رہیں اور اس پر کھانسی بجھانے کے لیے نفث روکنے والی چیزوں سے اصرار\
    \ نہ کیا جائے کیونکہ اس میں بڑا خطرہ ہے اگرچہ ہلکاہٹ کا وہم دے اور مدارات یہ ہے\
    \ کہ اسے سخت اور خشک رکھا جائے تاکہ نہ پھیلے نہ چوڑا ہو اگرچہ اس کے ساتھ التحام\
    \ اور بند ہونے کی امید نہ ہو اور اس میں مریض کی مہلت میں توسیع ہے اگرچہ اس کی\
    \ زندگی خوشگوار نہیں اور ہلکی سی بھول بھی اسے تکلیف دیتی ہے اور یہ خشک کرنے والی\
    \ چیزیں پھیپھڑے کو قبض کرتی خشک کرتی اور زخم کو تنگ کرتی ہیں اگر شفا نہ دیں اور\
    \ جو اس راستے پر چلے اسے ہرگز دودھ استعمال نہیں کرنا چاہیے اور شہد سل کی ادویہ\
    \ کی بنیاد ہے اور زخموں کو کوئی ضرر نہیں اور قروح کی تنقیہ مذکورہ صاف کرنے والوں\
    \ اور اقراباذين میں سل کے لیے کہے گئے اسی جنس کے جوشاندہ سے ہے اور اس سے مضبوط\
    \ اقراباذين میں کہا گیا اسی جنس کا لعوق اور کبھی ان میں قابض چپکنے والی چیزیں\
    \ ملانا درکار ہو اور کبھی مخدرات سے مدد لی جائے تاکہ کھانسی روکیں اور دوا اپنا\
    \ کام کر سکے اور اس وقت مضبوط جان بخش تدبیر درکار ہے اور ہم نے یہ صاف کرنے والے\
    \ ابتدائی ابواب میں اور تقيح کے باب میں بھی کہے ہیں اور معمول میں اسی جنس کی احساء\
    \ اور شہد کے وہ پانی ہیں جن میں صاف کرنے والی اور ملحم چیزیں پکی جاتی ہیں یہ سب\
    \ گزر چکا اور اسی جنس کے خشک معاجين بھی اور بڑے مشروبات اگر اپنے اوقات میں استعمال\
    \ ہوں خاص طور پر ابتداء میں جب ہزال شدید نہ ہو اور حمى مکاری میں حد نہ بڑھائی\
    \ ہو تو مفید ہیں اور مہر لگی مٹی ہر وقت سب سے مفید ہے اور ارمنی مٹی بھی اور ایسے\
    \ ہی وہ تمام صاف کرنے والے ضماد کماد اور مروخ جو ہم نے کہے اور جب بھی اس کا مزاج\
    \ اپنی حرارت سے زیادہ گرم ہو تو اسی جنس کی قرص سے کچھ دن علاج کرو پھر خشک کرنے\
    \ پر لوٹاؤ اور غذائیں اسی جنس کے اچھے گوشت سے مصالحہ کر کے اور ابتداء میں خالص\
    \ سفید مشروب منع نہیں اور ہمیشہ پھول سونگھائے جائیں اور نیند آرام اور سکون لازم\
    \ رہے اور غصہ اور بے چینی چھوڑے اور کوئی غم والی چیز اس پر نہ لائی جائے {cite:canon-ibn-sina-print-v2\
    \ p.367}"
  "es": "En cuanto a la úlcera cuando está en la tráquea: el medicamento llega rápidamente; el paciente debe acostarse boca arriba, mantener el medicamento en la boca y tragar su saliva poco a poco, sin tragar mucho de golpe para evitar la tos; y el músculo de su garganta debe estar relajado para que baje sin dificultad, mediante los medicamentos aglutinantes secantes que también se mencionan en la tuberculosis. En cuanto a las úlceras en el pecho y el pulmón que hemos mencionado: se deben administrar los medicamentos limpiadores; se le ordena al paciente que se acueste de lado, que tosa y se sacuda, o que lo sacudan suavemente; se puede extraer el pus después de introducir agua con miel en la úlcera con el instrumento de extracción de pus; luego, cuando hayamos limpiado la materia y esperemos que no quede nada, se utilizan los medicamentos aglutinantes curativos; y entre los detergentes limpiadores no hay nada como la miel, pues limpia y es un alimento apreciado por la naturaleza, que no daña las úlceras. En cuanto a la úlcera pulmonar, su manejo consta de dos partes: un tratamiento efectivo y cuidados paliativos. El tratamiento efectivo solo es posible cuando la enfermedad responde bien al tratamiento, como ya hemos descrito: limpiar la úlcera, secarla, eliminar las impurezas, detener los catarros y favorecer su adherencia. Un régimen ya establecido constituye la base de este tratamiento: la limpieza del organismo, la eliminación de las impurezas de la cabeza hacia abajo, el fortalecimiento de la cabeza para evitar la acumulación de impurezas, la prevención de la hemorragia de la cabeza a los pulmones y su derivación a otra zona. La limpieza debe realizarse mediante flebotomía y medicamentos que eliminen las impurezas; también puede ser necesario el uso de medicamentos para eliminar los humores melancólicos; y pueden ser necesarias evacuaciones repetidas para reducir las impurezas (se evacúa con un medicamento, se realiza una sangría, se alimenta y se repite el proceso), especialmente en personas con buena salud. Para facilitar la aceptación del régimen, es recomendable trasladarse a un lugar con aire seco, recibir tratamiento y leche allí. Su postura debe ser principalmente con el cuello estirado hacia arriba y hacia adelante, de modo que las partes del pulmón se asienten uniformemente y se evite que los bordes de la úlcera se cierren y se apongan naturalmente. Y no debe molestarse en calmar la tos con medicamentos que impidan la expectoración, ya que esto es muy peligroso, aunque dé una apariencia de alivio. En cuanto a la paliación, consiste en endurecer y secar la úlcera para que no se extienda ni se ensanche, aunque no se espera que se adhiera ni se cierre con este método; y en él hay un respiro en la vida del paciente, aunque su vida no sea placentera y se resienta ante el menor error. Estos métodos desecantes astringen el pulmón, lo resecan y estrechan la úlcera si no la curan; y quien siga este camino no debe consumir leche en absoluto. La miel es una base para el consumo de medicamentos y no daña las úlceras. La limpieza de las úlceras se realiza con los mencionados limpiadores y una decocción de este tipo, indicada en la farmacopea para su consumo, y más fuerte que un lohoch de este tipo también indicado en la farmacopea; puede ser necesario añadirles sustancias astringentes y glutinosas, y pueden complementarse con medicamentos estupefacientes para prevenir la tos y permitir que el medicamento actúe; luego se requiere un régimen de restauración fuerte. Hemos mencionado estos limpiadores al principio de los capítulos y nuevamente en el capítulo de la supuración; los más comunes son las papillas de este tipo y las aguas de miel en las que se cocinan los limpiadores y aglutinantes —todo lo anterior— y los electuarios secantes de este tipo. En cuanto a las bebidas fuertes, si se usan en su momento —especialmente al principio, cuando la emaciación no es severa y la fiebre no ha avanzado mucho en la desnutrición— son beneficiosas. La arcilla estampada es siempre lo más beneficioso, al igual que la arcilla armenia y todos los polvos, tabletas y linimentos limpiadores que mencionamos. Cuando su temperamento se exalta más de lo debido, se le trata con una tableta de este tipo durante varios días y luego se le vuelve a secar. En cuanto a la comida: se le ofrecen las buenas carnes de este tipo, sazonadas; no se le prohíbe al principio la bebida blanca pura; siempre se huelen las flores; se le mantiene en reposo, descanso y tranquilidad; se evitan la ira y la inquietud; y no se le trae nada que le cause dolor. {cite:canon-ibn-sina-print-v2 p.367}"
  "fr": "Concernant l'ulcère trachéal: le médicament agit rapidement; le patient doit s'allonger sur le dos, garder le médicament en bouche et avaler sa salive petit à petit, sans en avaler une grande quantité d'un coup pour éviter de provoquer une toux; les muscles de sa gorge doivent être détendus pour que le médicament descende sans difficulté – grâce aux médicaments asséchants et agglutinants également utilisés en cas de tuberculose. Concernant les ulcères de la poitrine et du poumon mentionnés précédemment: les médicaments lavants et purifiants doivent y être administrés; le patient doit s'allonger sur le côté, tousser et se secouer doucement, ou être secoué; le pus peut être aspiré après l'application d'eau miellée dans l'ulcère à l'aide d'un instrument de drainage; une fois le pus nettoyé et en espérant qu'il n'en reste plus aucune trace, on utilise les médicaments agglutinants cicatrisants – et parmi les détergents purifiants, rien n'égale le miel, car il purifie et est un aliment apprécié de la nature, sans danger pour les ulcères. Quant à l'ulcère du poumon, sa prise en charge comporte deux volets: un traitement curatif et des soins palliatifs. Le véritable traitement n'est possible que lorsque la maladie est réceptive, comme nous l'avons décrit: nettoyer l'ulcère, l'assécher, en évacuer les impuretés, arrêter les écoulements et favoriser l'adhérence. Un protocole vous a déjà été transmis comme base de ce traitement: il consiste à purifier l'organisme, à évacuer les impuretés de la tête vers le bas, à fortifier la tête pour éviter l'accumulation d'excès, à empêcher ce qui s'écoule de la tête vers les poumons et à le diriger vers une autre partie du corps. Cette purification doit être effectuée par saignées et par des médicaments qui éliminent les différents excès de ce type; il peut être nécessaire d'utiliser des substances qui favorisent l'élimination des humeurs mélancoliques; et des évacuations répétées peuvent être nécessaires pour réduire les excès: on évacue avec un médicament, on saigne, puis on nourrit, puis on répète, surtout chez les personnes robustes. Pour faciliter l'acceptation de ce traitement, il est conseillé de se rendre dans une région au climat sec, d'y être soigné et nourri au lait. Sa posture doit se faire le plus souvent avec le cou tendu vers le haut et vers l'avant, afin que les différentes parties du poumon reposent uniformément les unes sur les autres et que les bords de l'ulcère ne se referment pas naturellement. Il ne faut surtout pas le presser de calmer sa toux avec des remèdes anti-expectoration: c'est très dangereux, même si cela procure un soulagement illusoire. Quant au traitement palliatif, il consiste à durcir et à assécher l'ulcère pour qu'il ne s'étende pas, même si l'on n'espère ni adhésion ni fermeture. Il apporte un répit au patient, même si sa vie est pénible et qu'il est vulnérable à la moindre erreur. Ces remèdes asséchants astringent le poumon, l'assèchent et rétrécissent l'ulcère s'ils ne le guérissent pas; celui qui suit ce traitement ne doit absolument pas consommer de lait. Le miel est un excipient pour les médicaments et n'est pas nocif pour les ulcères. Le nettoyage des ulcères se fait avec lesdits nettoyants et une décoction de ce type, prescrite à la consommation dans la pharmacopée, et une décoction plus concentrée encore, également prescrite dans la pharmacopée. Il peut être nécessaire d'y associer des substances astringentes et agglutinantes, et de les potentialiser avec des stupéfiants afin de prévenir la toux et de permettre au médicament d'agir. Un traitement de rétablissement intensif est ensuite requis. Nous avons mentionné ces nettoyants au premier chapitre et de nouveau dans le chapitre consacré à la suppuration. On les utilise généralement sous forme de bouillies de ce type et d'eaux miellées dans lesquelles on cuit les nettoyants et les agglutinants (comme indiqué précédemment), ainsi que sous forme d'électuaires asséchants. Quant aux grandes boissons, utilisées à bon escient – surtout au début, lorsque l'émaciation n'est pas sévère et que la fièvre n'a pas encore entraîné de dépérissement important – elles sont bénéfiques. L'argile pressée est toujours la chose la plus bénéfique, de même que l'argile arménienne, et par conséquent tous les cataplasmes, compresses et liniments purificateurs que nous avons mentionnés. Lorsque son tempérament s'échauffe au-delà de ce que sa chaleur justifie, on le traite avec une tablette de ce genre pendant quelques jours, puis on le remet au séchage. Quant à la nourriture: on lui donne de bonnes viandes de ce genre, assaisonnées; la boisson blanche pure n'est pas interdite au début; on lui fait toujours humer le parfum des fleurs; on lui accorde le sommeil, le repos et la tranquillité; on évite la colère et l'agitation; et on ne lui apporte rien qui puisse l'attrister. {cite:canon-ibn-sina-print-v2 p.367}"
  "tr": "Trakeadaki ülsere gelince, ilaç aceleyle ona gönderilir. Hasta sırt üstü yatmalı, ilacı ağzında tutmalı ve tükürüğünü yavaş yavaş yutmalı, öksürüğü tahriş edecek kadar fazla itme yapmamalıdır. Boğaz kası, tüberkülozda da bahsedilen kuru yatıştırıcı maddelerle tahriş olmadan boğaza inmesi için gevşetilmelidir. Göğüs ve akciğerlerdeki yaralar için ise ilaçlar yıkanmalı ve boşaltılmalıdır, hastaya yan yatması talimatlandırılır Öksürür ve titrer ya da hafifçe titriyor; irin emici makineyle bal suyu gönderildikten sonra irin çıkarılabilir. Madde arıtılmışsa ve hiçbir şey kalmaması umuluyorsa, uzatılmış ilaçlar kullanılır ve bu tür giderimler, bal gibi arıtıcılarda kullanılmaz; çünkü bal arıtıcıdır ve ülserlere zarar vermeyen sevilen doğal bir gıdadır. Akciğer ülserleri için iki yol vardır: Biri gerçek bir tedavi, diğeri ise şefkatli bir tedavidir. Doğru tedavi ise ancak durumun tedavi edilebilir olması durumunda yapılabilir; daha önce anlattığımız gibi, ülserin arındırılması, kurutulması, içindeki maddelerin çıkarılması, felaketlerin önlenmesi ve bağlanmasına yardımcı olunmasıdır. Bu tedavi için temel plan, vücudu arındırmak, maddeyi baştan alt bölgelere çekmek, başı güçlendirerek merakın artmaması ve baştan akciğerlere akan ve başka yönlere doğru akan şeyleri engellemektir. Arınma, flebit ve çeşitli merakları gideren ilaçlarla yapılmalıdır. Bu tür, özellikle güçlü vücutlarda karanlık humorları gidermek için veya merakı azaltmak için tekrar eden kusma, ilaçla kusmak, sonra tekrar kusumak, ardından takviye edilmesi ve özellikle güçlü vücutlarda güçlendirilmesi gerekebilir. Doğanın yönetimi kabul etmesine yardımcı olan şey, kuru havalı topraklara taşınmasıdır; burada süt işlenir ve sulanır. Çoğu durumda, ereksiyonu yukarı ve öne doğru uzatılmalıdır ki akciğerlerin bazı kısımları eşit şekilde düşsün ve ülserin bazı kısımları hizalanmasın veya hizalanmasın. Öksürüğü üfleme aletleriyle yatıştırmaya ısrar etmemelidir, çünkü bu büyük tehlike taşır, hatta neşeli biri olsa bile. Ölçülü olarak, öksürüğü sertleştirip kurutmayı başarmak, yayılmaması veya genişlemesini engellemek, füzyona veya çökmeye yol açmasa bile, bu alıcının kabul süresini geciktirir, hayatı tatmin edici olmasa ve en ufak bir hata bile zarar görse bile. Bu kuru maddeler akciğerleri daraltır, kurutur ve haşlanmazsa ülserleri daraltır. Bu yolu izleyen kişi asla süt kullanmamalıdır. Bal tüberküloz ilaçları için bir bileşiktir, değil Ülserlere zararlıdır. Ülserlerin arındırılması için, bu tür arıtıcılar ve bu tür yemekler için akrabalarda tüberküloz için kullanılır, akrabalarda ise bu tür tıkanıklık için daha da güçlüdür. Yapıştırıcılar ve baştan çıkarıcı maddelerin toplanması ya da öksürüğü önlemeye yardımcı olmak ve ilacın bunu yapmasını sağlamak gerekebilir. Böyle durumlarda güçlü ve ferahlatıcı bir yönetim gereklidir. Bu arıtıcıları bölümlerin başında ve arındırma bölümünde de bahsettik, yaygın olanlar bu tür El-Ahsa'dır, içinde pişirilen bal suyu ise arıtıcılar ve destanlardır, ve benzeri. Bu tür macunları zaten kurutmuşsunuzdur. Büyük içecekler için, belirli zamanlarda, özellikle ilk başta ve ciddi zayıflama olmadığında tüketilirse faydalıdır; aşırı solmamış ateş yoksa, mühürlü kil her zaman en faydalıdır. Ermeni kili de, tüm bandajlar, kompresler ve arındırıcı benler gibi, ruh hali ne kadar sıcak olursa, o kadar sıcak olur, bu tür bir tabletle işlenir ve ardından tekrar kurur. Yiyecek ise bu iyi etten yapılır ve kokuludur. Beyaz içecek ilk başta akıntıyı önlemez, her zaman fesleğeni koklar, uykuya, sakinliğe ve hareketsizliğe bağlıdır, öfke ve can sıkıntısı bırakır ve onu rahatsız eden şeyi geri getirmez {cite:canon-ibn-sina-print-v2 s.367}"
  "id": "Sedangkan untuk tukak di trakea, obat diarahkan dengan terburu-buru. Pasien harus berbaring telentang, memegang obat di mulut, dan menelan air liur sedikit demi sedikit tanpa memberikan dorongan yang mengiritasi batuk. Otot tenggorokan harus dirilekskan agar turun ke tenggorokan tanpa iritasi dengan zat penenang kering yang juga disebutkan pada tuberkulosis. Untuk luka di dada dan paru-paru yang disebutkan, obat harus dicuci dan dikeringkan, dan pasien diperintahkan untuk berbaring miring Dia batuk dan menggoyangkan atau menggoyang perlahan, dan nanah dapat dikeluarkan setelah air madu dimasukkan ke dalam tukak dengan mesin penyerap nanah. Jika zat tersebut dimurnikan dan diharapkan tidak ada yang tersisa, maka obat memanjang digunakan, dan penghilangan tersebut tidak digunakan dalam pembersih seperti madu, karena merupakan pemurni dan makanan alami yang disukai yang tidak membahayakan tukak lambung. Untuk tukak paru, ada dua cara untuk mengelolanya: Satu adalah pengobatan sejati dan yang lain adalah perawatan penuh kasih. Adapun pengobatan yang tepat, hanya bisa dilakukan jika kondisinya dapat diobati, seperti yang telah kami jelaskan, dengan memurnikan luka, mengeringkannya, menghilangkan zat darinya, mencegah bencana, dan membantu agar terikat. Rencana dasar untuk pengobatan ini telah disebutkan sebelumnya, yaitu memurnikan tubuh, menarik zat dari kepala ke bagian bawah, memperkuat kepala agar rasa ingin tahu tidak meningkat, dan mencegah aliran dari kepala ke paru-paru serta menariknya ke arah lain. Pemurnian harus dilakukan melalui flebitis dan obat-obatan yang menghilangkan berbagai rasa ingin tahu dari Jenis ini mungkin perlu menghilangkan humor gelap dari spesies ini, atau mungkin perlu muntah berulang untuk mengurangi rasa ingin tahu, muntah dengan obat, kemudian diisi ulang, kemudian diperkuat, terutama pada tubuh yang kuat. Yang membantu alam menerima pengelolaan adalah bahwa ia bergerak ke tanah dengan udara kering, di mana susu diolah dan disiram. Dalam banyak kasus, ereksi harus diperpanjang ke atas dan ke depan sehingga bagian paru-paru jatuh merata dan bagian luka tidak sejajar atau sejajar. Ia tidak boleh memaksa batuk menenangkan dengan alat tiup, karena itu sangat berbahaya, bahkan jika ia bersikap ringan. Sedangkan untuk moderat, ia adalah berhasil mengeraskan dan mengeringkannya agar tidak menyebar atau mengembang, meskipun tidak menyebabkan fusi atau keruntuhan, yang akan menunda masa tenggang penerima, bahkan jika hidupnya tidak memuaskan dan ia dirugikan oleh kesalahan sekecil apapun. Zat kering ini menyempit dan mengeringkan paru-paru serta luka sempit jika tidak direbus. Siapa pun yang mengikuti jalan ini sebaiknya tidak pernah menggunakan susu. Madu adalah senyawa untuk obat tuberkulosis, bukan Obat ini berbahaya bagi luka. Untuk pemurnian borok, ini dilakukan dengan pembersih yang disebutkan dan memasak jenis ini untuk tuberkulosis pada kerabat, dan bahkan lebih kuat lagi untuk penyumbatan jenis ini yang disebutkan pada kerabat. Mungkin perlu mengumpulkan perekat dan zat menggoda, atau mungkin membantu mencegah batuk dan memungkinkan obat melakukannya. Dalam kasus seperti ini, diperlukan pengelolaan yang kuat dan menyegarkan. Kami telah menyebutkan pembersih ini di awal bab dan juga menyebutkannya di bab pemurnian, dan yang biasa adalah Al-Ahsa jenis ini, dan air madu yang dimasak di dalamnya adalah pembersih dan epik, dan semua itu. Anda sudah melewati dan pasta kering semacam ini. Adapun minuman besar, jika diminum pada waktu tertentu, terutama pada awalnya, dan ketika tidak mengalami penurunan berat badan, itu sangat bermanfaat; jika tidak ada demam yang telah layu berlebihan, tanah liat yang tersegel paling bermanfaat setiap saat. Tanah liat Armenia juga, serta semua perban, kompres, dan tahi lalat pemurnian, semakin panas suasana hati, semakin panas, diolah dengan tablet jenis ini, setelah itu akan kering kembali. Sedangkan makanan, itu berasal dari jenis daging yang baik ini dan harum. Minuman putih tidak mencegah cairan pada awalnya, selalu mencium bau basil, menempel pada tidur, ketenangan, dan ketenangan, meninggalkan kemarahan dan kebosanan, dan tidak mengembalikan apa yang membuatnya tertekan {cite:canon-ibn-sina-print-v2 hlm.367}"
