id: concept/athar-al-maasi
class: concept
kind: ethical
label:
  ar: "آثار المعصية"
  en: "Effects of sin (athar al-maasi)"
  ur: "گناہ کے اثرات"
summary:
  ar: "يذكر الشيخ عمر عبد الكافي آثار المعصية، من ظلمة في الوجه وفراغ في قلوب الناس وعدم رضا عن الله، ويقابلها بآثار الطاعة من نور في الوجه وزينة في القلب ومحبة في قلوب الناس. ويقول إن المعاصي تمحق البركة، وإن الإنسان ينبغي أن ينظر إلى عظم من عصاه لا إلى صغر الذنب."
  en: "Sheikh Omar Abdelkafy lists the effects of disobedience: darkness in the face, emptiness in people's hearts, and lack of contentment with God. He sets against them the effects of obedience, such as light in the face and love in people's hearts, and says that sins take away blessings. He holds that one should look at the greatness of the One disobeyed, not at the smallness of the sin."
  ur: "شیخ عمر عبدالکافی گناہ کے اثرات گنواتے ہیں، جیسے چہرے میں تاریکی، لوگوں کے دلوں میں خالی پن، اور اللہ کی رضا سے محرومی۔ ان کے مقابل اطاعت کے اثرات بیان کرتے ہیں، جیسے چہرے میں نور اور لوگوں کے دلوں میں محبت، اور کہتے ہیں کہ گناہ برکت کو مٹا دیتے ہیں، اور انسان کو گناہ کے چھوٹے ہونے کے بجائے اس ذات کی عظمت دیکھنی چاہیے جس کی نافرمانی ہوئی۔"
