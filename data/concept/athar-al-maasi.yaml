label:
  ar: "آثار المعصية"
  en: "Effects of sin (athar al-maasi)"
  fr: "Les effets du péché (athar al-maasi)"
  ur: "گناہ کے اثرات"
  es: "Efectos del pecado (athar al-maasi)"
  tr: "Günahın etkileri"
  id: "Dampak dosa"
summary:
  ar: "يذكر الشيخ عمر عبد الكافي آثار المعصية، من ظلمة في الوجه وفراغ في قلوب الناس وعدم رضا عن الله، ويقابلها بآثار الطاعة من نور في الوجه وزينة في القلب ومحبة في قلوب الناس. ويقول إن المعاصي تمحق البركة، وإن الإنسان ينبغي أن ينظر إلى عظم من عصاه لا إلى صغر الذنب."
  en: "Sheikh Omar Abdelkafy lists the effects of disobedience: darkness in the face, emptiness in people's hearts, and lack of contentment with God. He sets against them the effects of obedience, such as light in the face and love in people's hearts, and says that sins take away blessings. He holds that one should look at the greatness of the One disobeyed, not at the smallness of the sin."
  fr: "Le cheikh Omar Abdelkafy énumère les effets de la désobéissance : obscurité du visage, vide dans le cœur des gens et absence de contentement envers Dieu. Il leur oppose les effets de l’obéissance, tels la lumière du visage et l’amour dans le cœur des gens, et dit que les péchés font disparaître les bénédictions. Il estime qu’il convient de considérer la grandeur de Celui à qui l’on désobéit, non la petitesse du péché."
  ur: "شیخ عمر عبدالکافی گناہ کے اثرات گنواتے ہیں، جیسے چہرے میں تاریکی، لوگوں کے دلوں میں خالی پن، اور اللہ کی رضا سے محرومی۔ ان کے مقابل اطاعت کے اثرات بیان کرتے ہیں، جیسے چہرے میں نور اور لوگوں کے دلوں میں محبت، اور کہتے ہیں کہ گناہ برکت کو مٹا دیتے ہیں، اور انسان کو گناہ کے چھوٹے ہونے کے بجائے اس ذات کی عظمت دیکھنی چاہیے جس کی نافرمانی ہوئی۔"
  es: "El jeque Omar Abdelkafy enumera los efectos de la desobediencia: tristeza en el rostro, vacío en el corazón y falta de satisfacción con Dios. Contrapone estos efectos a los de la obediencia, como la alegría en el rostro y el amor en el corazón, y afirma que los pecados privan de bendiciones. Sostiene que debemos fijarnos en la grandeza de Aquel a quien desobedecemos, no en la pequeñez del pecado."
  tr: "Şeyh Ömer Abdulkafi, günahın etkilerinden bahseder; örneğin yüzünde karanlık, insanların kalplerinde boşluk ve Tanrı'dan memnuniyetsizlik gibi; bunları, itaatin yüzünde ışık, kalpte süsleme ve insanların kalplerinde sevgi gibi etkileriyle karşılaştırır. Günahların nimeti sildiğini ve bir kişinin günahlarının büyüklüğüne, küçük olmasına değil, bakması gerektiğini söyler."
  id: "Sheikh Omar Abdul Kafi menyebutkan dampak dosa, seperti kegelapan di wajah, kekosongan di hati orang, dan ketidakpuasan terhadap Tuhan, serta membandingkannya dengan efek ketaatan seperti cahaya di wajah, hiasan di hati, dan kasih di hati orang. Ia mengatakan bahwa dosa menghapus berkat, dan seseorang harus melihat besarnya dosanya, bukan kecilnya dosanya."
