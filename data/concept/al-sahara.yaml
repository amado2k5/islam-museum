id: concept/al-sahara
class: concept
kind: belief
label:
  ar: السحرة
  en: The sorcerers
  ur: جادوگر
summary:
  ar: "سحرة فرعون الذين جمعهم لمباراة موسى فألقوا حبالهم وعصيهم يُخيل إليه من سحرهم أنها تسعى؛ فألقى موسى عصاه فالتقمت ما يأفكون — ثم آمن السحرة برب العالمين {cite:tafsir-ibn-kathir} {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997}."
  en: "Pharaoh's sorcerers gathered to contest Musa; they threw their ropes and staffs which seemed to slither by their magic — Musa cast his staff and it swallowed their fabrications, and the sorcerers believed in the Lord of the worlds {cite:tafsir-ibn-kathir} {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997}."
  ur: "فرعون کے جادوگر جنھیں موسیٰ کے مقابلے کے لیے جمع کیا؛ انہوں نے رسییں اور لاٹھیاں ڈالیں جو ان کے جادو سے رینگتی ہوئی محسوس ہوئیں — موسیٰ نے لاٹھی ڈالی تو اس نے ان کی افسانوی چیزیں نگل لیا، پھر جادوگر رب العالمین پر ایمان لے آئے {cite:tafsir-ibn-kathir} {cite:qisas-al-anbiya-ibn-kathir-farmawi-1997}۔"
