id: concept/mal-qaranitus-wa-indhararatuh
class: concept
kind: scientific
label:
  ar: "مآل قرانيطس وانتقالاته"
  en: "Course and outlook of qaranitus"
  ur: "قرانیطس کا انجام اور اس کی منتقلیاں"
  es: "Curso y perspectivas de qaranitus"
  fr: "Évolution et perspectives de Qaranitus"
summary:
  ar: "يذكر ابن سينا مآل قرانيطس: أنه رديء إذا شارك الدماغ نفسه، وأن الاختلاط المركب من بكاء وضحك رديء، وما يُحمد من علاماته وما يُنذر منها بالموت، وأنه قد ينتقل إلى ليثرغس أو إلى دقّ أو جنون، وأن المشايخ قلّما يتخلصون منه {cite:canon-ibn-sina-print-v2 p.76} {cite:canon-ibn-sina-print-v2 p.77}"
  en: "Ibn Sina sets out the course of qaranitus: that it is bad when it shares in the brain itself, that confusion made of weeping and laughing is bad, which of its signs are praised and which foretell death, that it may pass into lethargus or into consumption or madness, and that old men seldom escape it {cite:canon-ibn-sina-print-v2 p.76} {cite:canon-ibn-sina-print-v2 p.77}"
  ur: "ابن سینا قرانیطس کا انجام بیان کرتا ہے: کہ جب یہ خود دماغ کو شریک کر لے تو برا ہے، کہ رونے اور ہنسنے سے مرکب اختلاط برا ہے، کون سی علامات پسندیدہ ہیں اور کون موت کی خبر دیتی ہیں، کہ یہ لیثرغس یا دق یا جنون میں بدل سکتا ہے، اور بوڑھے کم ہی اس سے بچتے ہیں {cite:canon-ibn-sina-print-v2 p.76} {cite:canon-ibn-sina-print-v2 p.77}۔"
  es: "Ibn Sina expone el curso de la qaranitus: que es mala cuando participa del cerebro mismo, que la confusión hecha de llanto y risa es mala, cuáles de sus signos son alabados y cuáles presagian la muerte, que puede derivar en letargo, tuberculosis o locura, y que los ancianos rara vez escapan a ella {cite:canon-ibn-sina-print-v2 p.76} {cite:canon-ibn-sina-print-v2 p.77}"
  fr: "Ibn Sina décrit l'évolution de la qaranitus: elle est néfaste lorsqu'elle touche directement le cerveau; la confusion causée par les pleurs et les rires est mauvaise; il précise quels signes sont louables et lesquels annoncent la mort; elle peut évoluer en léthargie, en tuberculose ou en folie; et les vieillards y échappent rarement. {cite:canon-ibn-sina-print-v2 p.76} {cite:canon-ibn-sina-print-v2 p.77}"
