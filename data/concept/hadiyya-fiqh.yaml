label: { ar: "هَدِيَّة", en: "Hadiyya (gift)" }
summary:
  ar: "الهدية في اللغة المال الذي يُتحف به الإنسان غيره إكراماً، وفي الاصطلاح تمليك عين بلا عوض، وهي نوع من الهبة تفارقها بأنها تُنقل إلى مكان الموهوب له إكراماً له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16508} وتثبت الهدية بالبعث من المُهدي وقبض المهدى إليه، ولا يُشترط فيها صيغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16511} وللمُهدي الرجوع فيها قبل القبض عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16512} والحكم في وعاء الهدية أن يُرد أو يبقى أمانة بحسب العادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16512} ويُفرّق في هدايا الختان والعرس بين ما يصلح للصغار وما يصلح لغيرهم، وبحسب قرابة المهدي من الأب أو من الأم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16512} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16513} وتحرم هدية العمال والقضاة لقاء الولاية، والحديث في ذلك «هدايا العمال غلول». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16514} ولا يجوز للإمام قبول الهدية عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16515} وتحل هدايا المفتي والواعظ، والأولى تركها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16516}"
  en: "Hadiyya in the lexical sense is a thing of value sent to another as an honour; technically it is the transfer of a thing to another without return, a kind of gift (hiba) that differs in that it is carried to the recipient as a courtesy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16507} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16508} It is complete when the giver sends it and the recipient takes it; no formula is required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16511} The giver may retract before receipt, in the view of the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16512} Where a gift comes in a container, the container is returned or held in trust depending on custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16511} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16512} At a circumcision or wedding, gifts suited to children go to the child, and others follow the kinship of the giver to the father or the mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16512} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16513} Gifts that officials and judges receive by virtue of office are forbidden; the Prophet's saying 'the gifts of officials are plunder' is cited. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16514} The imam may not accept gifts, according to the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16515} The mufti, preacher and teacher may accept, though it is better to refrain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16516}"
