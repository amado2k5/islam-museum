id: concept/al-iddikhar-al-mashru
class: concept
kind: ethical
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: الادخار المشروع
  en: "Legitimate saving (al-iddikhar al-mashru)"
  es: "Ahorro legítimo (al-iddikhar al-mashru)"
  fr: "Économie légitime (al-iddikhar al-mashru)"
  ur: "جائز بچت ⁦(الدخار المشرو)⁩"
  tr: "Tasarruf Projesi"
  id: "Proyek Tabungan"
summary:
  ar: "يقرر قعدات أن الاقتصاد الإسلامي يتسع للادخار، فالتوازن في الإنفاق يُبقي جزءاً يسيراً من الدخل يسمى الادخار {cite:qadan-manhaj-iqtisad-quran p. 128}. ويذكر أسباباً له: تأمين الحاجات المستقبلية، وتقلب الأسعار، والطوارئ التي يمر بها الإنسان والمشروع {cite:qadan-manhaj-iqtisad-quran p. 128}، {cite:qadan-manhaj-iqtisad-quran p. 129}. ويشترط أن يكون من مصدر مشروع كالمال الزائد عن الحاجة، وأن يستثمر في الإنتاج ويكون رأس مال عاملاً، لا أن يبقى جامداً فيصير اكتنازاً {cite:qadan-manhaj-iqtisad-quran p. 129}."
  tr: "Qaadat, İslam ekonomisinin tasarruf için geniş olduğunu, harcama dengesinin gelirin küçük bir kısmını tasarruf olarak adlandırdığını belirtir {cite:qadan-manhaj-iqtisad-kur'an s. 128}. Bunun nedenlerini belirtir: gelecekteki ihtiyaçların güvence altına alınması, fiyat dalgalanmaları ve hem bireyin hem de projenin yaşadığı acil durumlar {cite:qadan-manhaj-iqtisad-kur'an s. 128}, {cite:qadan-manhaj-iqtisad-kur'an s. 129}. Bunun meşru bir kaynaktan gelmesi, fazla para gibi bir kaynaktan gelmesi ve üretime yatırılması ve işletme sermayesi haline gelmesi gerekir; sabit kalıp biriktirme haline gelmez {cite:qadan-manhaj-iqtisad-qur'an s. 129}."
  id: "Qaadat menyatakan bahwa ekonomi Islam luas untuk tabungan, dan saldo pengeluaran merujuk pada sebagian kecil pendapatan sebagai tabungan {cite:qadan-manhaj-iqtisad-qur'an hlm. 128}. Ia menyatakan alasannya: menjamin kebutuhan masa depan, fluktuasi harga, dan keadaan darurat yang dialami baik oleh individu maupun proyek {cite:qadan-manhaj-iqtisad-qur'an hlm. 128}, {cite:qadan-manhaj-iqtisad-qur'an hlm. 129}. Modal tersebut harus berasal dari sumber yang sah, seperti uang berlebih, dan diinvestasikan dalam produksi serta menjadi modal kerja; modal tersebut tidak menjadi deposito tetap atau akumulasi {cite:qadan-manhaj-iqtisad-qur'an hlm. 129}."
