label:
  ar: الادخار المشروع
  en: "Legitimate saving (al-iddikhar al-mashru)"
summary:
  ar: "يقرر قعدات أن الاقتصاد الإسلامي يتسع للادخار، فالتوازن في الإنفاق يُبقي جزءاً يسيراً من الدخل يسمى الادخار {cite:qadan-manhaj-iqtisad-quran p. 128}. ويذكر أسباباً له: تأمين الحاجات المستقبلية، وتقلب الأسعار، والطوارئ التي يمر بها الإنسان والمشروع {cite:qadan-manhaj-iqtisad-quran p. 128}، {cite:qadan-manhaj-iqtisad-quran p. 129}. ويشترط أن يكون من مصدر مشروع كالمال الزائد عن الحاجة، وأن يستثمر في الإنتاج ويكون رأس مال عاملاً، لا أن يبقى جامداً فيصير اكتنازاً {cite:qadan-manhaj-iqtisad-quran p. 129}."
