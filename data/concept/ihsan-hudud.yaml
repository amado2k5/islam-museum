class: concept
kind: legal
label:
  ar: إحصان ⁦(في الحدود)⁩
  en: Ihsan in the hudud (marital status for stoning and slander)
  es: "Ihsan en el hudud (estado civil para la lapidación y la calumnia)"
  fr: "Ihsan dans le hudud (statut matrimonial pour la lapidation et la calomnie)"
  ur: "احد میں احسان ⁦( سنگساری اور غیبت کی ازدواجی حیثیت)⁩"
summary:
  ar: 'الإحصان في اللغة المنع، ومن معانيه العفة والتزوج والحرية، وفي الاصطلاح نوعان: إحصان الرجم في الزنى، وإحصان القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} أهم شروط إحصان الرجم التزوج، وأهم شروط إحصان القذف العفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} إحصان الرجم ثمانية شروط مجتمعة، وإحصان القذف صفات في المقذوف تجعل قاذفه مستحقاً للجلد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1872} ويشترط في الزاني المحصن: الحرية والعقل والبلوغ والإسلام عند الجمهور، وأن يكون وطؤه في نكاح صحيح في القبل، وخالف الحنفية والمالكية في تفاصيل كثيرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874}. وفي الإسلام والإثبات والقذف: الإسلام شرط عند الحنفية والمالكية لا عند الشافعي وأحمد وأبي يوسف، ويثبت الإحصان بالإقرار والشهادة، والرجم لا يبقى مشروطاً ببقاء النكاح، وفي قذف المحصنات الحد وإسقاط الشهادة، ويسقط الإحصان بفقد شرط منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1877}.'
  en: 'Ihsan (in the sense of marital status for the penalties) means in the lexicon restraint, and among its senses chastity, marriage and freedom; technically it has two kinds: ihsan for stoning for adultery, and ihsan for slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} The main condition of ihsan for stoning is marriage, and of ihsan for slander chastity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} Ihsan for stoning is eight conditions together; ihsan for slander is qualities in the one slandered that make the slanderer liable to flogging. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1872} The adulterer must be free, sane, adult and, by the majority, Muslim, and must have intercourse in the front passage in a valid marriage; the Hanafis and Malikis differ on many details. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874}. On Islam, proof and slander: Islam is a condition for the Hanafis and Malikis but not for al-Shafi''i, Ahmad or Abu Yusuf; ihsan is proved by confession and testimony; the stoning does not depend on the marriage continuing; slandering the chaste brings flogging and loss of testimony; the loss of any condition removes ihsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1877}.'
  es: "Ihsan (en el sentido de estado civil para las penas) significa en el léxico restricción, y entre sus sentidos castidad, matrimonio y libertad; técnicamente tiene dos tipos: ihsan para la lapidación por adulterio, e ihsan para la calumnia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} La condición principal de ihsan para la lapidación es el matrimonio, y de ihsan para la calumnia la castidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} Ihsan para la lapidación son ocho condiciones juntas; ihsan para la calumnia son cualidades en el calumniado que hacen que el calumniador sea susceptible de ser azotado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1872} El adúltero debe ser libre, cuerdo, adulto y, por la mayoría, musulmán, y debe tener relaciones sexuales en el pasaje anterior en un matrimonio válido; los hanafíes y los malikíes difieren en muchos detalles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874}. Sobre el Islam, prueba y calumnia: el Islam es una condición para los hanafíes y los malikíes, pero no para al-shafi'i, Ahmad o Abu Yusuf; el ihsan se prueba mediante la confesión y el testimonio; la lapidación no depende de que el matrimonio continúe; calumniar a la casta conlleva azotes y pérdida del testimonio; la pérdida de cualquier condición elimina el ihsan. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1875} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1876} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1877}."
  fr: "L'ihsan (au sens de l'état civil pour les peines) signifie, dans le lexique, contrainte et, parmi ses sens, chasteté, mariage et liberté; techniquement, il en existe deux types: l'ihsan pour la lapidation en cas d'adultère et l'ihsan pour la calomnie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} La principale condition de l'ihsan pour la lapidation est le mariage, et celle de l'ihsan pour la calomnie, la chasteté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} L'ihsan pour la lapidation comprend huit conditions; l'ihsan pour la calomnie concerne les qualités de la personne calomniée qui rendent le calomniateur passible de flagellation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1872} L'adultère doit être libre, sain d'esprit, majeur et, de l'avis majoritaire, musulman. Il doit avoir eu des rapports sexuels dans le cadre d'un mariage valide; les écoles hanafite et malikite divergent sur de nombreux points. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874}. Concernant l'islam, la preuve et la calomnie: l'islam est une condition pour les hanafites et les malikites, mais pas pour al-Shafi'i, Ahmad ou Abu Yusuf; l'ihsan est prouvé par l'aveu et le témoignage; la lapidation n'est pas conditionnée par la poursuite du mariage; calomnier une personne chaste entraîne la flagellation et la perte du témoignage; la perte de toute condition entraîne la perte de l'ihsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1877}."
  ur: "احسان ⁦(تعزیرات کے لیے ازدواجی حیثیت کے معنی میں)⁩ کا مطلب لغت میں پابندی ہے، اور اس کے حواس میں عفت، نکاح اور آزادی؛ تکنیکی طور پر اس کی دو قسمیں ہیں: زنا کے لیے رجم کے لیے احسان اور غیبت کے لیے احسان۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1871} رجم کے لیے احسان کی بنیادی شرط نکاح ہے اور احسان کی توہین عفت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص1871} رجم کے لیے احسان آٹھ شرطیں ہیں۔ غیبت کے لیے احسان، غیبت کرنے والے میں ایسی صفات ہیں جو غیبت کرنے والے کو کوڑے لگاتی ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1872} زانی کو آزاد، عاقل، بالغ اور اکثریت کے لحاظ سے مسلمان ہونا چاہیے، اور جائز نکاح میں سامنے والے حصے میں جماع کرنا چاہیے۔ حنفیہ اور مالکیہ کا بہت سی تفصیلات میں اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1873} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1874}۔ اسلام پر دلیل اور بہتان: احناف اور مالکیوں کے لیے اسلام شرط ہے لیکن شافعی، احمد یا ابو یوسف کے لیے نہیں۔ احسان اقرار اور گواہی سے ثابت ہے۔ سنگساری کا انحصار شادی کے جاری رہنے پر نہیں ہے۔ پاکیزہ پر تہمت لگانے سے کوڑے لگتے ہیں اور گواہی ضائع ہوتی ہے۔ کسی بھی حالت کا نقصان احسان کو دور کر دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1874} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1875} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1876} صفحہ 1877}۔"
