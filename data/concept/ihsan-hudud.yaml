label:
  ar: إحصان (في الحدود)
  en: Ihsan in the hudud (marital status for stoning and slander)
summary:
  ar: 'الإحصان في اللغة المنع، ومن معانيه العفة والتزوج والحرية، وفي الاصطلاح نوعان: إحصان الرجم في الزنى، وإحصان القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} أهم شروط إحصان الرجم التزوج، وأهم شروط إحصان القذف العفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} إحصان الرجم ثمانية شروط مجتمعة، وإحصان القذف صفات في المقذوف تجعل قاذفه مستحقاً للجلد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1872} ويشترط في الزاني المحصن: الحرية والعقل والبلوغ والإسلام عند الجمهور، وأن يكون وطؤه في نكاح صحيح في القبل، وخالف الحنفية والمالكية في تفاصيل كثيرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874}. وفي الإسلام والإثبات والقذف: الإسلام شرط عند الحنفية والمالكية لا عند الشافعي وأحمد وأبي يوسف، ويثبت الإحصان بالإقرار والشهادة، والرجم لا يبقى مشروطاً ببقاء النكاح، وفي قذف المحصنات الحد وإسقاط الشهادة، ويسقط الإحصان بفقد شرط منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1877}.'
  en: 'Ihsan (in the sense of marital status for the penalties) means in the lexicon restraint, and among its senses chastity, marriage and freedom; technically it has two kinds: ihsan for stoning for adultery, and ihsan for slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} The main condition of ihsan for stoning is marriage, and of ihsan for slander chastity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1871} Ihsan for stoning is eight conditions together; ihsan for slander is qualities in the one slandered that make the slanderer liable to flogging. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1872} The adulterer must be free, sane, adult and, by the majority, Muslim, and must have intercourse in the front passage in a valid marriage; the Hanafis and Malikis differ on many details. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874}. On Islam, proof and slander: Islam is a condition for the Hanafis and Malikis but not for al-Shafi''i, Ahmad or Abu Yusuf; ihsan is proved by confession and testimony; the stoning does not depend on the marriage continuing; slandering the chaste brings flogging and loss of testimony; the loss of any condition removes ihsan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1877}.'
