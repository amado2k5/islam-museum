label: { ar: "أبعاد الأجرام السماوية عن الأرض", en: "Distances of the heavenly bodies from the Earth", es: "Distancias de los cuerpos celestes a la Tierra", fr: "Distances des corps célestes par rapport à la Terre", ur: "زمین سے آسمانی اجسام کی دوری", tr: "Dünya'dan gök cisimlerinin boyutları", id: "Ukuran benda langit dari Bumi" }
summary:
  ar: "يقدّر الفرغاني أبعاد الشمس والقمر والكواكب الخمسة وفلك الثوابت من مركز الأرض بأنصاف قطرها، ويجعل قطر الأرض 6500 ميل ⁦(نصف قطرها 3250)⁩، فيبلغ أدنى بُعد للشمس 3.965.000 ميل وأقصى بُعد لزحل 65.357.500 ميل. أكثر الأرقام قراءة OCR ومتسقة مع نصف القطر، وأدنى بُعد للقمر مشكوك فيه {cite:farghani-elements-astronomy p. 213}."
  en: "al-Farghani gives the distances of the Moon, Sun and the five planets, and of the sphere of the fixed stars, in Earth radii and in miles, taking the Earth's diameter as 6500 miles. The figures are internally consistent with that radius; the least Moon distance is doubtful (OCR)."
  es: "Al-Farghani proporciona las distancias de la Luna, el Sol y los cinco planetas, así como de la esfera de las estrellas fijas, en radios terrestres y en millas, tomando el diámetro de la Tierra como 6500 millas. Las cifras son internamente consistentes con ese radio; la distancia mínima a la Luna es dudosa (OCR)."
  fr: "Al-Farghani donne les distances de la Lune, du Soleil et des cinq planètes, ainsi que de la sphère des étoiles fixes, en rayons terrestres et en miles, prenant pour diamètre terrestre 6 500 miles. Les valeurs sont cohérentes avec ce rayon; la plus petite distance de la Lune est incertaine (OCR)."
  ur: "الفرغانی نے چاند، سورج اور پانچوں سیاروں اور مقررہ ستاروں کے کرہ کا فاصلہ زمین کے ریڈیائی اور میلوں میں بیان کیا ہے، زمین کا قطر 6500 میل ہے۔ اعداد و شمار اندرونی طور پر اس رداس کے ساتھ مطابقت رکھتے ہیں۔ کم سے کم چاند کا فاصلہ مشکوک ہے (OCR)۔"
  tr: "Al-Farghani, Güneş, Ay, beş gezegen ve gök küresinin boyutlarını Dünya'nın merkezinden çaplarının yarısına kadar tahmin ederek, Dünya'nın çapını 6.500 mil (yarıçapı 3.250 metre) yapar, Güneş'in en düşük boyutu 3.965.000 mil ve Satürn'ün maksimum mesafesi 65.357.500 mil olur. En çok okunan rakamlar OCR olup, yarıçapla tutarlıdır; en düşük tartışmalı Ay boyutu {cite:Farghani-Elements-Astronomy, s. 213}."
  id: "Al-Farghani memperkirakan ukuran Matahari, Bulan, lima planet, dan bola langit dari pusat Bumi hingga setengah diameternya, menjadikan diameter Bumi 6.500 mil (radius 3.250 meter), ukuran minimum Matahari adalah 3.965.000 mil, dan jarak maksimum Saturnus adalah 65.357.500 mil. Angka yang paling sering dibaca adalah OCR, yang konsisten dengan jari-jari; ukuran Bulan yang paling tidak kontroversial {cite:Farghani-Elements-Astronomy, hlm. 213}."
