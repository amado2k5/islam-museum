summary:
  ar: "يفتتح فهرس البتاني مجموعة الصور البروجية بصورة الحمل. تُعدّ كواكبه من القرنين والفم إلى العنق والظهر والذيل والرجل الخلفية، ثم مجموعة يذكر الفهرس أنها ليست في الصورة، فوق الرأس. لا تُنقل المواضع. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  en: "The catalogue opens its zodiac group, headed Constellationes zodiaci, with Aries, al-Hamal, the ram. Its stars are listed from the horns and mouth through the neck, back, tail and hind leg, followed by a group the catalogue marks as not in the figure, above the head. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  ur: "فہرست کا برجی حصہ حمل سے شروع ہوتا ہے۔ اس کے ستارے سینگوں اور منہ سے گردن، پشت، دم اور پچھلی ٹانگ تک گنے گئے ہیں، اور سر کے اوپر کے ستارے، جو فہرست کے مطابق صورت میں نہیں، الگ درج ہیں۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.155}"
  es: "El catálogo inicia su grupo zodiacal, titulado Constellationes zodiaci, con Aries, al-Hamal, el carnero. Sus estrellas se enumeran desde los cuernos y la boca hasta el cuello, la espalda, la cola y la pata trasera, seguidas de un grupo que el catálogo marca como no incluido en la figura, por encima de la cabeza. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  fr: "Le catalogue ouvre son groupe zodiacal, intitulé Constellationes zodiaci, avec Aries, al-Hamal, le bélier. Ses étoiles sont énumérées des cornes et de la bouche jusqu'au cou, au dos, à la queue et à la patte arrière, suivies d'un groupe que le catalogue indique comme non représenté, au-dessus de la tête. Les positions ne sont pas transcrites ici. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  tr: "Al-Battani'nin kataloğu, zodyak imgeleri serisine Koç burcu imgesiyle başlıyor. Gezegenler boynuzlardan ve ağızdan başlayarak boyun, sırt, kuyruk ve arka bacağa doğru sıralanmış, ardından katalogda imgede bulunmadığı belirtilen, başın üstündeki bir grup yer alıyor. Pozisyonlar yer değiştirmiyor. {cite:nallino-albatenii-opus-astronomicum pp.155}"
  id: "Katalog Al-Battani membuka rangkaian gambar zodiak dengan gambar Aries. Planet-planetnya tercantum dari tanduk dan mulut hingga leher, punggung, ekor, dan kaki belakang, diikuti oleh kelompok yang menurut katalog tidak ada dalam gambar, di atas kepala. Posisi-posisi tersebut tidak dipertukarkan. {cite:nallino-albatenii-opus-astronomicum pp.155}"
