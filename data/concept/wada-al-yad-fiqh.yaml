id: concept/wada-al-yad-fiqh
class: concept
kind: legal
label:
  ar: "وَضْع اليد"
  en: "Wad' al-yad (possession and the hand, fiqh)"
summary:
  ar: "وَضْع اليد في اللغة الترك والإسقاط، ويُقال وضعت عنه دينه أي أسقطته. واليد النعمة والقدرة والحوز والملك، ويُقال هذا في يد فلان أي في حوزه وملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} وعند الفقهاء هو تصرّف ذي اليد في عين بالفعل، أو ثبوت تصرّفه فيها تصرّف الملاك. ويُطلق الفقهاء الوضع أيضاً على اليد الحسّية، وهي الجارحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}\n\nالحيازة في اللغة الضم والجمع، وفي الاصطلاح الاستيلاء على الشيء ووضع اليد عليه، ووضع اليد أعم منها. والغصب إزالة يد المالك عن ماله المتقوّم مجاهرةً ومغالبةً، ووضع اليد أعم من الغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}\n\nأولاً: الأحكام المتعلقة بوضع اليد على العين.\n\nاتفق الفقهاء في الجملة على أن وضع اليد دليل الملك، ولهم تفصيل بعد ذلك. قال الحنفية إن وضع اليد والتصرف من أقوى ما يُستدل به على الملك، فتصح الشهادة بأنه ملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352} وصرّح المالكية بأن وضع اليد إذا طال، ولم يُنازَع فيه، وصاحبه يتصرف تصرّف الملاك دلّ على الملك، وإن لم تطل المدة لم يثبت الملك. وفصّل ابن رشد الجواب عن سؤال الحائز من أين صار إليه الملك بحسب مدة الحيازة وثبوت الأصل للمدعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}\n\nكيفية وضع اليد تختلف باختلاف الشيء. ففي العقار يكون بالسكنى وبناء الأبنية، وفي العرصة بحفر البئر أو النهر أو القناة، أو غرس الأشجار أو زرع المزروعات، أو صنع اللبن؛ وفي الحرج والغاب بقطع الأشجار وبيعها والانتفاع بها؛ وفي المرعى بقطع الحشائش وبيعها أو رعي الحيوان فيها. ووجود المفتاح في يد أحد لا يجعله واضع اليد على الدار، فالساكن فيها هو صاحب اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} وفي المنقول يكون بكل ما يدل على حيازة الشخص له، كاستخدام الرقيق وركوب الدابة وحلب الماشية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}\n\nثانياً: وسائل إثبات وضع اليد. يفرّق الحنفية بين العقار وغيره: فإثبات اليد في العقار المتنازع فيه يكون بالبينة، ولا يُحكم فيه بتصادق الخصمين، ولا بعلم القاضي، لأن اليد فيه غير مشاهدة، فلعله في يد غيرهما تواضعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} ويُستثنى من لزوم إثبات اليد في العقار مسائل الشراء والغصب والسرقة، فإن دعوى الفعل تصح على ذي اليد وعلى غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} وأما المنقول فذو اليد هو من يوجد في يده، ويثبت الوضع بالبينة أو بالمشاهدة أو بالإقرار؛ وإذا أنكر المدعى عليه وجوده في يده وأقام المدعي البينة أن المنقول كان تحت يده منذ سنة، سُمعت البينة واعتُبر المدعى عليه ذا اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}\n\nثالثاً: وضع اليد على مال الغير. من أخذ مال غيره بغير إذنه عدواناً فهو غاصب، وتفصيله في باب الغصب. ومن أخذ مال غيره بغير إذنه خطأً، كأن ظن أنه ملكه، لزمه الضمان، ولا إثم عليه، لأن الخطأ مرفوع المؤاخذة، والكتاب يحتج بحديث في رفع الخطأ عن الأمة، وقد ذكر المعلّق أن ابن ماجه أخرجه وأن النووي حسّنه بحسب ما نقله ابن حجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}\n\nرابعاً: التنازع في وضع اليد. إذا تنازع شخصان في عقار وادّعى كل منهما أنه ذو اليد عليه، طُلبت البينة من كل منهما، فإن أقامها ثبتت يدهما معاً، وصار كل منهما مدعى عليه في القسم الذي يضع اليد عليه ومدعياً في القسم الذي يخرج فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} وإذا لم تكن لأحدهما بينة قُضي للأقوى يداً، أو اشتركا عند التساوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}\n\nخامساً: مراتب وضع اليد. ذكر الحنفية أمثلة للترجيح عند التنازع دون بينة: فاللابس للثوب أحق من آخذ كُمّه، والراكب أحق من آخذ اللجام، ومن في السرج أحق من رديفه في ظاهر الرواية، ومن على حمل الدابة أولى ممن علّق كوزه بها، والحائط لمن على جذوعه، وهم يفرّقون بين الاتصال والتربيع والنقب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} ورتّب المالكية مراتب اليد: أعظمها ثياب الإنسان ومنطقته، ثم البساط الذي يجلس عليه، ثم الدابة التي يركبها، ثم التي يسوقها أو يقودها، ثم الدار التي يسكنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} وقال الشافعية: إذا تداعيا دابة وعلى أحدهما حمل فالقول قول صاحب الحمل مع يمينه؛ وإذا تنازعا على حيوان ويد أحدهما عليه ويد الآخر على حمله، فهو لمن يده على الحيوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} وقال الحنابلة: الدابة التي يركبها أحدهما وعليها حمل له، وقد أخذ الآخر بزمامها، فهي للأول بيمينه لأنه تصرف أقوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358}\n\nسادساً: وضع اليد على اللقطة واللقيط. يحرم عند الحنفية أن يأخذ الملتقط اللقطة لنفسه لا لصاحبها، لأنه أخذ مال الغير بغير إذنه لنفسه فيكون في معنى الغصب، وذكر الكتاب حديثاً في تعريف الضالة أخرجه مسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} وقال الشافعية: إذا أخذها أحد المتماشيين بأمر الآخر، فالعبرة بقصد الآخذ، إن أخذها لنفسه فهي له، وإن قصد الآمر وحده فهي للآمر، وإن قصدهما فهي لهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} وقال الحنابلة: إذا رأيا اللقيط معاً فسبق أحدهما إلى أخذه أو وضع يده عليه فهو أحق به؛ وإن أمره صاحبه بمناولته فالعبرة بنيّة الآخذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}\n\nسابعاً: وضع المحرم يده على الصيد. يحرم على المحرم بحج أو عمرة وضع اليد على الصيد بشراء أو إجارة أو عارية أو نحوها، في الحرم وخارجه، لقوله تعالى في سورة المائدة، ويحرم كذلك وضع اليد على الصيد في الحرم على الحلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nثامناً: ما لا يدخل تحت اليد. قاعدة الفقهاء أن الحر لا يدخل تحت اليد، وتفصيلها في باب الحرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} وأن وضع اليد على مال الغير بلا سبب شرعي مفسدة موجبة للضمان، سواء كان الواضع حاكماً أو محكوماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nثانياً: الأحكام المتعلقة بوضع اليد الحسّية.\n\nفي الصلاة اختلف الفقهاء في وضع اليمنى على اليسرى على أقوال، وتفصيله في باب الإرسال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} واتفقوا على كراهة وضع اليد على الخاصرة في الصلاة، لنهي ورد عن أبي هريرة في الصلاة مختصراً، ولأن الهيئة تنافي هيئة الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nوالطائف يستلم الحجر الأسود بفيه إن قدر، وإلا وضع يده عليه ثم قبّل يده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nوفي وضع اليد على القبر: ذهب المالكية والحنفية في قول والشافعية في قول إلى أنه بدعة، ونقل الكتاب عن عدد من الفقهاء النهي عن مسّ القبور وتقبيلها لأنه عادة النصارى، ونقل عن ابن تيمية الاتفاق على أنه لا يُتمسّح بالقبر ولا يُقبّل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} ونقل الكتاب عن الشافعية في المذهب وأحمد في رواية كراهة استلام القبر باليد، واستثنى الجمل ما قُصد به التبرك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} وذهب الحنفية في قول، والحنابلة في المذهب، إلى أن وضع اليد على القبر لا بأس به، وعن أحمد في رواية استحباب لمسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}\n\nوفي التثاؤب يندب كظمه وأن يُوضع اليد على الفم إن لم يستطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} وفي العطاس السنة وضع اليد أو الثوب على الفم وخفض الصوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} وعند المالكية يندب وضع اليد على المريض عند الدعاء له إن لم يكن ذلك مكروهاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} وفي كيفية وضع يدي الميت: عند الحنفية تُوضع اليمنى على الجانب الأيمن واليسرى على الأيسر، ولا توضعان على الصدر؛ وأجاز الشافعية أن توضعا على الصدر أو تُرسلا في جنبي الميت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363}"
  en: "Wad' al-yad (literally, placing the hand) means leaving or dropping, as in the phrase that one dropped someone's debt, and the hand in the sense of favour, power, holding and ownership: 'the matter is in so-and-so's hand' means it is in his control. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} For the jurists it is a holder's act of control over a thing, or the holder's disposal of it in the way an owner disposes. The jurists also use the phrase for the physical hand itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}\n\nHiyaza is taking hold and gathering, and wad' al-yad is the broader term; ghasb is taking an owner's property by force and open contest, and wad' al-yad is broader than ghasb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}\n\nFirst, the rules on holding a thing for ownership. The jurists agree in general that holding is evidence of ownership, with differences of detail. The Hanafis call holding and disposal among the strongest proofs of ownership, so testimony that the holder owns the thing is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352} The Malikis hold that a holding which lasts, is not contested and is used as an owner uses a thing proves ownership, while a short holding does not. Ibn Rushd gives different answers on whether a third-party holder must say where the thing came from, depending on how long the holding has lasted and whether the claimant's root of title is established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}\n\nThe way of holding varies with the thing. For land it is living in a house, building on it, digging a well, canal or channel, planting trees, sowing, making bricks on open ground; for a thick wood or a reed thicket, cutting and selling wood and using it; for pasture, cutting and selling grass or grazing animals on it. A key held by someone else does not make him the holder of a house; the one who lives in it holds it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} For movables, holding is any sign that a person has the thing, such as using slaves, riding animals, milking livestock. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}\n\nSecond, proof of holding. The Hanafis distinguish land from other things: a disputed holding of land must be proved by witnesses and is not established by the admission of both parties, nor by the judge's knowledge, because the holding of land is not visible and both parties might be feigning it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Exceptions are claims of purchase, usurpation and theft, where proof of holding is not needed, because the claim of an act may be made against anyone who holds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} For movables, the one in whose hand the thing is found holds it, and holding may be shown by witnesses, sight or admission; if the defendant denies holding and the claimant shows by witnesses that the thing was in the defendant's hand for a year, the witnesses are heard and the defendant is treated as the holder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}\n\nThird, holding another's property. Taking another's property without permission in aggression is usurpation, detailed under ghasb. Taking it by mistake, as when a person thought it was his own, makes him liable for compensation but not sinful, because error is lifted from account. The book cites a hadith on the lifting of error from this community and notes that al-Nawawi graded a hadith on the subject as hasan, as Ibn Hajar reports; the grade is attributed and recorded here as attributed only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}\n\nFourth, disputes over holding. When two people contest land and each claims to hold it, each is asked for evidence; if both produce it, both are held to hold the land together, each the defendant for the part he holds and the claimant for the part he does not. If one shows he cannot prove his holding and the other proves it, the latter is treated as the holder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} Without evidence, the stronger holder is preferred, or they share if equal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}\n\nFifth, grades of holding. Without evidence the Hanafis give examples: the one wearing a garment has a better claim than the one holding its sleeve; the rider has a better claim than the one holding the bridle; the one seated in the saddle over the one behind him, in the apparent view; the one carrying the load on an animal over the one who hangs his jug on it; a wall belongs to the one whose beams rest on it, with the three-beam rule; and a wall joined by interlocking bricks or by a wooden piece set into another belongs to the one it is bonded with. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} The Malikis rank holding: first the clothes and belt a person wears, then the carpet he sits on, then the animal he rides, then the one he drives or leads, then the house he lives in. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} The Shafi'is: when two contest an animal and one has a load on it, the load-holder is believed with his oath; when one holds the animal and the other holds its load, the holder of the animal has the better claim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} The Hanbalis: when one rides an animal or has a load on it and the other holds its halter or drives it, the first has the better claim, on his oath, as his use is stronger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358}\n\nSixth, holding a lost thing and a foundling. The Hanafis forbid the finder to take a lost thing for himself and not for its owner; the book cites a hadith in Sahih Muslim on the one who shelters a stray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} The Shafi'is: when one of two walking companions finds a lost thing and the other tells him to pick it up, the intention of the one who picks it up decides who owns it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} The Hanbalis: when two see a foundling and one takes it or puts his hand on it first, he has the better claim; the taking, not the seeing, is what counts; if one asks the other to hand it to him, the intention of the taker decides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}\n\nSeventh, a pilgrim in the state of ihram laying hold of game. Jurists agree it is forbidden to a pilgrim for hajj or umra to take hold of game by purchase, hire, loan or similar means, inside the sanctuary or outside it, as the Qur'an forbids it in sura al-Ma'ida (cited by sura only); it is also forbidden to take hold of game within the sanctuary even for a non-pilgrim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nEighth, what does not come under holding. The rule is that a free person does not come under another's hold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Taking another's property without legal cause is a wrong that makes the taker liable, whether the taker is a ruler or one ruled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nSecond part, the physical hand. In prayer the jurists differ on placing the right hand on the left. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} They agree that placing the hand on the hip in prayer is disliked, for a hadith of Abu Hurayra against praying with the hip hold, and because the posture contradicts the prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} At the Black Stone the circumambulant kisses it with his mouth if able, and otherwise touches it with his hand and kisses his hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} On graves: the Malikis, a Hanafi view and a Shafi'i view hold touching graves to be an innovation; the book quotes several jurists against touching or kissing graves, as the custom of Christians, and Ibn Taymiyya as reporting consensus that a grave is not touched or kissed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} The Shafi'is in the school view and Ahmad in one report consider touching a grave with the hand disliked; al-Jamal excepts the case in which it is intended for blessing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} A Hanafi view and the Hanbali school view say touching a grave is not objectionable, and Ahmad in one report recommends it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}\n\nOn yawning, it is recommended to suppress it, and if one cannot, to place the hand on the mouth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} On sneezing, the sunna is to place the hand or garment on the mouth and lower the voice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} The Malikis recommend placing the hand on a sick person while praying for him, if the touch is not disliked to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} On the hands of the dead: the Hanafis place the right hand on the right side and the left on the left, and forbid placing both on the chest; the Shafi'is allow placing them on the chest, the right over the left, or leaving them along the sides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363}"
