id: concept/wada-al-yad-fiqh
class: concept
kind: legal
label:
  ar: "وَضْع اليد"
  en: "Wad' al-yad (possession and the hand, fiqh)"
  es: "Wad' al-yad (posesión y la mano, fiqh)"
  fr: "Wad' al-yad (possession et main, fiqh)"
  ur: "وَدُ الید ⁦(قبضہ اور ہاتھ، فقہ)⁩"
  tr: "El pozisyonu"
  id: "Posisi tangan"
summary:
  ar: "وَضْع اليد في اللغة الترك والإسقاط، ويُقال وضعت عنه دينه أي أسقطته. واليد النعمة والقدرة والحوز والملك، ويُقال هذا في يد فلان أي في حوزه وملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} وعند الفقهاء هو تصرّف ذي اليد في عين بالفعل، أو ثبوت تصرّفه فيها تصرّف الملاك. ويُطلق الفقهاء الوضع أيضاً على اليد الحسّية، وهي الجارحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}\n\nالحيازة في اللغة الضم والجمع، وفي الاصطلاح الاستيلاء على الشيء ووضع اليد عليه، ووضع اليد أعم منها. والغصب إزالة يد المالك عن ماله المتقوّم مجاهرةً ومغالبةً، ووضع اليد أعم من الغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}\n\nأولاً: الأحكام المتعلقة بوضع اليد على العين.\n\nاتفق الفقهاء في الجملة على أن وضع اليد دليل الملك، ولهم تفصيل بعد ذلك. قال الحنفية إن وضع اليد والتصرف من أقوى ما يُستدل به على الملك، فتصح الشهادة بأنه ملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352} وصرّح المالكية بأن وضع اليد إذا طال، ولم يُنازَع فيه، وصاحبه يتصرف تصرّف الملاك دلّ على الملك، وإن لم تطل المدة لم يثبت الملك. وفصّل ابن رشد الجواب عن سؤال الحائز من أين صار إليه الملك بحسب مدة الحيازة وثبوت الأصل للمدعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}\n\nكيفية وضع اليد تختلف باختلاف الشيء. ففي العقار يكون بالسكنى وبناء الأبنية، وفي العرصة بحفر البئر أو النهر أو القناة، أو غرس الأشجار أو زرع المزروعات، أو صنع اللبن؛ وفي الحرج والغاب بقطع الأشجار وبيعها والانتفاع بها؛ وفي المرعى بقطع الحشائش وبيعها أو رعي الحيوان فيها. ووجود المفتاح في يد أحد لا يجعله واضع اليد على الدار، فالساكن فيها هو صاحب اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} وفي المنقول يكون بكل ما يدل على حيازة الشخص له، كاستخدام الرقيق وركوب الدابة وحلب الماشية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}\n\nثانياً: وسائل إثبات وضع اليد. يفرّق الحنفية بين العقار وغيره: فإثبات اليد في العقار المتنازع فيه يكون بالبينة، ولا يُحكم فيه بتصادق الخصمين، ولا بعلم القاضي، لأن اليد فيه غير مشاهدة، فلعله في يد غيرهما تواضعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} ويُستثنى من لزوم إثبات اليد في العقار مسائل الشراء والغصب والسرقة، فإن دعوى الفعل تصح على ذي اليد وعلى غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} وأما المنقول فذو اليد هو من يوجد في يده، ويثبت الوضع بالبينة أو بالمشاهدة أو بالإقرار؛ وإذا أنكر المدعى عليه وجوده في يده وأقام المدعي البينة أن المنقول كان تحت يده منذ سنة، سُمعت البينة واعتُبر المدعى عليه ذا اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}\n\nثالثاً: وضع اليد على مال الغير. من أخذ مال غيره بغير إذنه عدواناً فهو غاصب، وتفصيله في باب الغصب. ومن أخذ مال غيره بغير إذنه خطأً، كأن ظن أنه ملكه، لزمه الضمان، ولا إثم عليه، لأن الخطأ مرفوع المؤاخذة، والكتاب يحتج بحديث في رفع الخطأ عن الأمة، وقد ذكر المعلّق أن ابن ماجه أخرجه وأن النووي حسّنه بحسب ما نقله ابن حجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}\n\nرابعاً: التنازع في وضع اليد. إذا تنازع شخصان في عقار وادّعى كل منهما أنه ذو اليد عليه، طُلبت البينة من كل منهما، فإن أقامها ثبتت يدهما معاً، وصار كل منهما مدعى عليه في القسم الذي يضع اليد عليه ومدعياً في القسم الذي يخرج فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} وإذا لم تكن لأحدهما بينة قُضي للأقوى يداً، أو اشتركا عند التساوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}\n\nخامساً: مراتب وضع اليد. ذكر الحنفية أمثلة للترجيح عند التنازع دون بينة: فاللابس للثوب أحق من آخذ كُمّه، والراكب أحق من آخذ اللجام، ومن في السرج أحق من رديفه في ظاهر الرواية، ومن على حمل الدابة أولى ممن علّق كوزه بها، والحائط لمن على جذوعه، وهم يفرّقون بين الاتصال والتربيع والنقب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} ورتّب المالكية مراتب اليد: أعظمها ثياب الإنسان ومنطقته، ثم البساط الذي يجلس عليه، ثم الدابة التي يركبها، ثم التي يسوقها أو يقودها، ثم الدار التي يسكنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} وقال الشافعية: إذا تداعيا دابة وعلى أحدهما حمل فالقول قول صاحب الحمل مع يمينه؛ وإذا تنازعا على حيوان ويد أحدهما عليه ويد الآخر على حمله، فهو لمن يده على الحيوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} وقال الحنابلة: الدابة التي يركبها أحدهما وعليها حمل له، وقد أخذ الآخر بزمامها، فهي للأول بيمينه لأنه تصرف أقوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358}\n\nسادساً: وضع اليد على اللقطة واللقيط. يحرم عند الحنفية أن يأخذ الملتقط اللقطة لنفسه لا لصاحبها، لأنه أخذ مال الغير بغير إذنه لنفسه فيكون في معنى الغصب، وذكر الكتاب حديثاً في تعريف الضالة أخرجه مسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} وقال الشافعية: إذا أخذها أحد المتماشيين بأمر الآخر، فالعبرة بقصد الآخذ، إن أخذها لنفسه فهي له، وإن قصد الآمر وحده فهي للآمر، وإن قصدهما فهي لهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} وقال الحنابلة: إذا رأيا اللقيط معاً فسبق أحدهما إلى أخذه أو وضع يده عليه فهو أحق به؛ وإن أمره صاحبه بمناولته فالعبرة بنيّة الآخذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}\n\nسابعاً: وضع المحرم يده على الصيد. يحرم على المحرم بحج أو عمرة وضع اليد على الصيد بشراء أو إجارة أو عارية أو نحوها، في الحرم وخارجه، لقوله تعالى في سورة المائدة، ويحرم كذلك وضع اليد على الصيد في الحرم على الحلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nثامناً: ما لا يدخل تحت اليد. قاعدة الفقهاء أن الحر لا يدخل تحت اليد، وتفصيلها في باب الحرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} وأن وضع اليد على مال الغير بلا سبب شرعي مفسدة موجبة للضمان، سواء كان الواضع حاكماً أو محكوماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nثانياً: الأحكام المتعلقة بوضع اليد الحسّية.\n\nفي الصلاة اختلف الفقهاء في وضع اليمنى على اليسرى على أقوال، وتفصيله في باب الإرسال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} واتفقوا على كراهة وضع اليد على الخاصرة في الصلاة، لنهي ورد عن أبي هريرة في الصلاة مختصراً، ولأن الهيئة تنافي هيئة الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nوالطائف يستلم الحجر الأسود بفيه إن قدر، وإلا وضع يده عليه ثم قبّل يده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nوفي وضع اليد على القبر: ذهب المالكية والحنفية في قول والشافعية في قول إلى أنه بدعة، ونقل الكتاب عن عدد من الفقهاء النهي عن مسّ القبور وتقبيلها لأنه عادة النصارى، ونقل عن ابن تيمية الاتفاق على أنه لا يُتمسّح بالقبر ولا يُقبّل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} ونقل الكتاب عن الشافعية في المذهب وأحمد في رواية كراهة استلام القبر باليد، واستثنى الجمل ما قُصد به التبرك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} وذهب الحنفية في قول، والحنابلة في المذهب، إلى أن وضع اليد على القبر لا بأس به، وعن أحمد في رواية استحباب لمسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}\n\nوفي التثاؤب يندب كظمه وأن يُوضع اليد على الفم إن لم يستطع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} وفي العطاس السنة وضع اليد أو الثوب على الفم وخفض الصوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} وعند المالكية يندب وضع اليد على المريض عند الدعاء له إن لم يكن ذلك مكروهاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} وفي كيفية وضع يدي الميت: عند الحنفية تُوضع اليمنى على الجانب الأيمن واليسرى على الأيسر، ولا توضعان على الصدر؛ وأجاز الشافعية أن توضعا على الصدر أو تُرسلا في جنبي الميت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363}"
  en: "Wad' al-yad (literally, placing the hand) means leaving or dropping, as in the phrase that one dropped someone's debt, and the hand in the sense of favour, power, holding and ownership: 'the matter is in so-and-so's hand' means it is in his control. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} For the jurists it is a holder's act of control over a thing, or the holder's disposal of it in the way an owner disposes. The jurists also use the phrase for the physical hand itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}\n\nHiyaza is taking hold and gathering, and wad' al-yad is the broader term; ghasb is taking an owner's property by force and open contest, and wad' al-yad is broader than ghasb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}\n\nFirst, the rules on holding a thing for ownership. The jurists agree in general that holding is evidence of ownership, with differences of detail. The Hanafis call holding and disposal among the strongest proofs of ownership, so testimony that the holder owns the thing is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352} The Malikis hold that a holding which lasts, is not contested and is used as an owner uses a thing proves ownership, while a short holding does not. Ibn Rushd gives different answers on whether a third-party holder must say where the thing came from, depending on how long the holding has lasted and whether the claimant's root of title is established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}\n\nThe way of holding varies with the thing. For land it is living in a house, building on it, digging a well, canal or channel, planting trees, sowing, making bricks on open ground; for a thick wood or a reed thicket, cutting and selling wood and using it; for pasture, cutting and selling grass or grazing animals on it. A key held by someone else does not make him the holder of a house; the one who lives in it holds it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} For movables, holding is any sign that a person has the thing, such as using slaves, riding animals, milking livestock. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}\n\nSecond, proof of holding. The Hanafis distinguish land from other things: a disputed holding of land must be proved by witnesses and is not established by the admission of both parties, nor by the judge's knowledge, because the holding of land is not visible and both parties might be feigning it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Exceptions are claims of purchase, usurpation and theft, where proof of holding is not needed, because the claim of an act may be made against anyone who holds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} For movables, the one in whose hand the thing is found holds it, and holding may be shown by witnesses, sight or admission; if the defendant denies holding and the claimant shows by witnesses that the thing was in the defendant's hand for a year, the witnesses are heard and the defendant is treated as the holder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}\n\nThird, holding another's property. Taking another's property without permission in aggression is usurpation, detailed under ghasb. Taking it by mistake, as when a person thought it was his own, makes him liable for compensation but not sinful, because error is lifted from account. The book cites a hadith on the lifting of error from this community and notes that al-Nawawi graded a hadith on the subject as hasan, as Ibn Hajar reports; the grade is attributed and recorded here as attributed only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}\n\nFourth, disputes over holding. When two people contest land and each claims to hold it, each is asked for evidence; if both produce it, both are held to hold the land together, each the defendant for the part he holds and the claimant for the part he does not. If one shows he cannot prove his holding and the other proves it, the latter is treated as the holder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} Without evidence, the stronger holder is preferred, or they share if equal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}\n\nFifth, grades of holding. Without evidence the Hanafis give examples: the one wearing a garment has a better claim than the one holding its sleeve; the rider has a better claim than the one holding the bridle; the one seated in the saddle over the one behind him, in the apparent view; the one carrying the load on an animal over the one who hangs his jug on it; a wall belongs to the one whose beams rest on it, with the three-beam rule; and a wall joined by interlocking bricks or by a wooden piece set into another belongs to the one it is bonded with. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} The Malikis rank holding: first the clothes and belt a person wears, then the carpet he sits on, then the animal he rides, then the one he drives or leads, then the house he lives in. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} The Shafi'is: when two contest an animal and one has a load on it, the load-holder is believed with his oath; when one holds the animal and the other holds its load, the holder of the animal has the better claim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} The Hanbalis: when one rides an animal or has a load on it and the other holds its halter or drives it, the first has the better claim, on his oath, as his use is stronger. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358}\n\nSixth, holding a lost thing and a foundling. The Hanafis forbid the finder to take a lost thing for himself and not for its owner; the book cites a hadith in Sahih Muslim on the one who shelters a stray. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} The Shafi'is: when one of two walking companions finds a lost thing and the other tells him to pick it up, the intention of the one who picks it up decides who owns it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} The Hanbalis: when two see a foundling and one takes it or puts his hand on it first, he has the better claim; the taking, not the seeing, is what counts; if one asks the other to hand it to him, the intention of the taker decides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}\n\nSeventh, a pilgrim in the state of ihram laying hold of game. Jurists agree it is forbidden to a pilgrim for hajj or umra to take hold of game by purchase, hire, loan or similar means, inside the sanctuary or outside it, as the Qur'an forbids it in sura al-Ma'ida (cited by sura only); it is also forbidden to take hold of game within the sanctuary even for a non-pilgrim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nEighth, what does not come under holding. The rule is that a free person does not come under another's hold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Taking another's property without legal cause is a wrong that makes the taker liable, whether the taker is a ruler or one ruled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}\n\nSecond part, the physical hand. In prayer the jurists differ on placing the right hand on the left. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} They agree that placing the hand on the hip in prayer is disliked, for a hadith of Abu Hurayra against praying with the hip hold, and because the posture contradicts the prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} At the Black Stone the circumambulant kisses it with his mouth if able, and otherwise touches it with his hand and kisses his hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} On graves: the Malikis, a Hanafi view and a Shafi'i view hold touching graves to be an innovation; the book quotes several jurists against touching or kissing graves, as the custom of Christians, and Ibn Taymiyya as reporting consensus that a grave is not touched or kissed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} The Shafi'is in the school view and Ahmad in one report consider touching a grave with the hand disliked; al-Jamal excepts the case in which it is intended for blessing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} A Hanafi view and the Hanbali school view say touching a grave is not objectionable, and Ahmad in one report recommends it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}\n\nOn yawning, it is recommended to suppress it, and if one cannot, to place the hand on the mouth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} On sneezing, the sunna is to place the hand or garment on the mouth and lower the voice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} The Malikis recommend placing the hand on a sick person while praying for him, if the touch is not disliked to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} On the hands of the dead: the Hanafis place the right hand on the right side and the left on the left, and forbid placing both on the chest; the Shafi'is allow placing them on the chest, the right over the left, or leaving them along the sides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363}"
  es: "Wad' al-yad (literalmente, poner la mano) significa dejar o soltar, como en la frase que uno dejó caer la deuda de alguien, y la mano en el sentido de favor, poder, posesión y propiedad: 'el asunto está en la mano de fulano' significa que está bajo su control. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} Para los juristas es el acto de control de un poseedor sobre una cosa, o la disposición del poseedor de ella como lo hace un propietario. Los juristas también usan la frase para la mano física misma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351} Hiyaza es tomar y reunir, y wad' al-yad es el término más amplio; ghasb es tomar la propiedad de un propietario por la fuerza y en disputa abierta, y wad' al-yad es más amplio que ghasb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351} Primero, las reglas sobre la posesión de una cosa para la propiedad. Los juristas coinciden en general en que la posesión es prueba de propiedad, con diferencias en los detalles. Los hanafíes consideran que la posesión y la disposición se encuentran entre las pruebas más sólidas de propiedad, por lo que el testimonio de que el poseedor es dueño de la cosa es válido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352} Los malikíes sostienen que una posesión que perdura, no es disputada y se usa como un propietario usa una cosa prueba la propiedad, mientras que una posesión breve no lo hace. Ibn Rushd da diferentes respuestas sobre si un poseedor tercero debe decir de dónde proviene la cosa, dependiendo de cuánto tiempo ha durado la posesión y si se establece la raíz del título del reclamante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353} La forma de poseer varía según la cosa. Para la tierra, es vivir en una casa, construir en ella, cavar un pozo, canal o acequia, plantar árboles, sembrar, hacer ladrillos en campo abierto; para un bosque denso o un juncal, cortar y vender madera y usarla; para pastos, cortar y vender hierba o pastorear animales en ellos. Una llave en posesión de otra persona no la convierte en la dueña de una casa; quien vive en ella la posee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Para los bienes muebles, la posesión es cualquier señal de que una persona tiene la cosa, como usar esclavos, montar animales, ordeñar ganado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Segundo, prueba de posesión. Los Hanafis distinguen la tierra de otras cosas: una posesión de tierra disputada debe ser probada por testigos y no se establece por la admisión de ambas partes, ni por el conocimiento del juez, porque la posesión de la tierra no es visible y ambas partes podrían estar fingiéndola. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Las excepciones son las reclamaciones de compra, usurpación y robo, donde no se necesita prueba de posesión, porque la reclamación de un acto puede hacerse contra cualquiera que posea. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Para los bienes muebles, quien en cuya mano se encuentra la cosa la posee, y la posesión puede demostrarse mediante testigos, vista o admisión; si el demandado niega poseer y el reclamante demuestra mediante testigos que la cosa estuvo en la mano del demandado durante un año, se escucha a los testigos y se considera al demandado como el poseedor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} Tercero, posesión de la propiedad de otro. Tomar la propiedad de otro sin permiso por agresión es usurpación, detallada en ghasb. Tomarla por error, como cuando una persona pensó que era suya, lo hace responsable de compensación pero no pecaminoso, porque el error se elimina de la cuenta. El libro cita un hadiz sobre la eliminación del error de esta comunidad y señala que al-Nawawi clasificó un hadiz sobre el tema como hasan, como informa Ibn Hajar; la clasificación se atribuye y se registra aquí solo como atribuida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} Cuarto, disputas sobre la tenencia. Cuando dos personas disputan tierras y cada una afirma poseerlas, se les pide a cada una que presente pruebas; si ambas las presentan, se considera que ambas poseen la tierra conjuntamente, cada una demandada por la parte que posee y reclamante por la parte que no posee. Si una muestra que no puede probar su tenencia y la otra la prueba, esta última es tratada como la poseedora. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} Sin evidencia, se prefiere al poseedor más fuerte, o lo comparten si son iguales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356} Quinto, grados de posesión. Sin evidencia, los Hanafis dan ejemplos: quien lleva una prenda tiene mejor derecho que quien sostiene su manga; el jinete tiene mejor derecho que quien sostiene la brida; quien está sentado en la silla de montar sobre quien está detrás de él, en la vista aparente; quien lleva la carga en un animal sobre quien cuelga su jarra en él; una pared pertenece a quien cuyas vigas descansan sobre ella, con la regla de las tres vigas; y una pared unida por ladrillos entrelazados o por una pieza de madera colocada en otra pertenece a quien está unido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} Los malikíes clasifican la posesión: primero la ropa y el cinturón que usa una persona, luego la alfombra en la que se sienta, luego el animal que monta, luego el que conduce o guía, luego la casa en la que vive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} Los shafi'íes: cuando dos disputan un animal y uno tiene una carga sobre él, se cree al que sostiene la carga con su juramento; cuando uno sostiene al animal y el otro sostiene su carga, el que sostiene al animal tiene mejor derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} Los Hanbalis: cuando uno monta un animal o tiene una carga sobre él y el otro sostiene su cabestro o lo conduce, el primero tiene mejor derecho, bajo juramento, ya que su uso es más fuerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} Sexto, tener una cosa perdida y un expósito. Los Hanafis prohíben al que encuentra tomar una cosa perdida para sí mismo y no para su dueño; el libro cita un hadiz en Sahih Muslim sobre el que da refugio a un vagabundo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} Los shafi'ís: cuando uno de dos compañeros de caminata encuentra algo perdido y el otro le dice que lo recoja, la intención de quien lo recoge decide quién es el dueño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} Los hanbalíes: cuando dos ven a un expósito y uno lo toma o pone su mano sobre él primero, tiene mejor derecho; lo que cuenta es tomarlo, no verlo; si uno le pide al otro que se lo entregue, la intención de quien lo toma decide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359} Séptimo, un peregrino en estado de ihram que toma una presa. Los juristas coinciden en que está prohibido para un peregrino del Hajj o la Umrah tomar posesión de caza mediante compra, alquiler, préstamo o medios similares, dentro o fuera del santuario, como lo prohíbe el Corán en la sura al-Ma'ida (citado solo por sura); también está prohibido tomar posesión de caza dentro del santuario incluso para un no peregrino. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Octavo, lo que no entra en posesión. La regla es que una persona libre no está bajo posesión de otra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Tomar la propiedad de otro sin causa legal es un delito que hace responsable al tomador, ya sea el tomador gobernante o gobernado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Segunda parte, la mano física. En la oración, los juristas difieren en cuanto a colocar la mano derecha sobre la izquierda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Coinciden en que colocar la mano en la cadera en la oración es desaconsejable, debido a un hadiz de Abu Hurayra en contra de orar con la cadera apoyada, y porque la postura contradice la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} En la Piedra Negra, el circunvalador la besa con la boca si puede, y de lo contrario la toca con la mano y besa su mano. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Sobre las tumbas: los malikíes, una visión hanafí y una visión shafi'í sostienen que tocar las tumbas es una innovación; el libro cita a varios juristas en contra de tocar o besar las tumbas, como costumbre de los cristianos, e Ibn Taymiyya informando del consenso de que una tumba no se toca ni se besa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} Los shafi'ís en la visión de la escuela y Ahmad en un informe consideran que tocar una tumba con la mano es desaconsejable; al-Jamal exceptúa el caso en que se pretende bendecir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} Una visión Hanafi y la visión de la escuela Hanbali dicen que tocar una tumba no es objetable, y Ahmad en un informe lo recomienda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} Al bostezar, se recomienda reprimirlo, y si uno no puede, colocar la mano sobre la boca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} Al estornudar, la sunna es colocar la mano o la prenda sobre la boca y bajar la voz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} Los malikíes recomiendan colocar la mano sobre una persona enferma mientras se reza por ella, si el contacto no le resulta desagradable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} Sobre las manos de los difuntos: los hanafíes colocan la mano derecha en el lado derecho y la izquierda en el izquierdo, y prohíben colocar ambas sobre el pecho; los shafiíes permiten colocarlas sobre el pecho, la derecha sobre la izquierda, o dejarlas a los lados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363}"
  fr: "Wad' al-yad (littéralement, poser la main) signifie laisser tomber ou abandonner, comme dans l'expression « on a laissé tomber la dette de quelqu'un », et la main au sens de faveur, de pouvoir, de détention et de propriété: « l'affaire est entre les mains de untel » signifie qu'elle est sous son contrôle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17350} Pour les juristes, il s'agit de l'acte par lequel un détenteur exerce un contrôle sur une chose, ou de la manière dont il en dispose, à la manière d'un propriétaire. Les juristes utilisent également cette expression pour désigner la main elle-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351} Hiyaza signifie s'emparer et rassembler, et wad' al-yad est le terme plus général; ghasb signifie prendre la propriété d'un propriétaire par la force et la contestation ouverte, et wad' al-yad est plus général que ghasb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351} Premièrement, les règles relatives à la détention d'un bien pour établir la propriété. Les juristes s'accordent généralement à dire que la détention constitue une preuve de propriété, avec toutefois des divergences sur les modalités. Les hanafites considèrent la détention et la disposition comme des preuves de propriété parmi les plus solides; par conséquent, le témoignage selon lequel le détenteur est propriétaire du bien est valable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17351}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352} Les malikites estiment qu'une détention durable, non contestée et effectuée conformément à l'usage qu'un propriétaire fait du bien prouve la propriété, tandis qu'une détention de courte durée ne l'est pas. Ibn Rushd propose des réponses différentes quant à l'obligation pour un tiers détenteur de préciser la provenance du bien, selon la durée de la détention et la validité du titre de propriété du demandeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353} La manière de posséder un bien varie selon sa nature. Pour une terre, il s'agit d'habiter une maison, d'y construire, de creuser un puits, un canal ou un fossé, de planter des arbres, de semer, de fabriquer des briques à même le sol; pour un bois dense ou un fourré de roseaux, il s'agit de couper et de vendre du bois et de l'utiliser; pour un pâturage, il s'agit de couper et de vendre de l'herbe ou d'y faire paître des animaux. La possession d'une clé par autrui ne fait pas de lui le propriétaire d'une maison; c'est celui qui y habite qui en est le propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Concernant les biens meubles, la possession se manifeste par tout signe indiquant qu'une personne en a la propriété, comme l'utilisation d'esclaves, le fait de monter des animaux ou de traire le bétail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Deuxièmement, la preuve de la possession. Les Hanafites distinguent la terre des autres biens: la possession contestée d'une terre doit être prouvée par des témoins et ne peut être établie par l'aveu des deux parties, ni par la connaissance du juge, car la possession de la terre n'est pas visible et les deux parties pourraient la simuler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Les exceptions concernent les actions en acquisition, usurpation et vol, pour lesquelles la preuve de la détention n'est pas requise, car l'action peut être intentée contre toute personne détenant le bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} Pour les biens meubles, celui qui les trouve en sa possession les détient, et la détention peut être prouvée par des témoins, par observation directe ou par aveu. Si le défendeur nie la détention et que le demandeur prouve par des témoins que le bien était en sa possession pendant un an, les témoins sont entendus et le défendeur est considéré comme le détenteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} Troisièmement, la détention du bien d'autrui. S'approprier le bien d'autrui sans permission, par agression, constitue une usurpation, détaillée sous la rubrique ghasb. S'approprier un bien par erreur, par exemple en le croyant sien, entraîne une obligation de réparation mais n'est pas considéré comme un péché, car l'erreur est alors écartée. L'ouvrage cite un hadith relatif à l'effacement de l'erreur au sein de cette communauté et note qu'al-Nawawi a qualifié de hasan un hadith sur ce sujet, comme le rapporte Ibn Hajar; cette attribution est mentionnée ici comme telle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} Quatrièmement, les litiges fonciers. Lorsque deux personnes se disputent une terre et que chacune prétend en être propriétaire, des preuves sont demandées à chacune. Si les deux en produisent, elles sont considérées comme copropriétaires, chacune étant le défendeur pour la partie qu'elle possède et le demandeur pour la partie qu'elle ne possède pas. Si l'une des personnes démontre son incapacité à prouver sa propriété et que l'autre y parvient, cette dernière est reconnue comme propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} En l'absence de preuve, le détenteur le plus fort prévaut, ou bien ils partagent en cas d'égalité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356} Cinquièmement, les degrés de possession. Sans preuve, les Hanafites donnent des exemples: celui qui porte un vêtement a un meilleur droit que celui qui en tient la manche; le cavalier a un meilleur droit que celui qui tient la bride; celui qui est assis en selle a un meilleur droit que celui qui est derrière lui, du point de vue apparent; celui qui porte la charge sur un animal a un meilleur droit que celui qui y suspend sa cruche; un mur appartient à celui dont les poutres reposent dessus, selon la règle des trois poutres; et un mur assemblé par des briques imbriquées ou par une pièce de bois encastrée dans un autre appartient à celui auquel il est lié. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} Selon l'école malikite, l'ordre de possession est le suivant: d'abord les vêtements et la ceinture que porte une personne, puis le tapis sur lequel elle s'assoit, ensuite l'animal qu'elle monte, ensuite celui qu'elle conduit ou mène, et enfin la maison qu'elle habite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} Selon l'école chaféite: lorsque deux personnes se disputent un animal et que l'une d'elles porte une charge, le serment de celui qui porte la charge est cru; lorsque l'une tient l'animal et l'autre sa charge, celui qui tient l'animal a un meilleur droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} Selon l'école hanbalite: lorsqu'une personne monte un animal ou transporte une charge, et qu'une autre tient sa bride ou le conduit, la première a un meilleur droit, sur son serment, car son usage est plus important. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} Sixièmement, le fait de détenir un objet perdu et un animal trouvé. L'école hanafite interdit à celui qui trouve un objet perdu de le garder pour lui-même et non pour son propriétaire; l'ouvrage cite un hadith du Sahih Muslim concernant celui qui abrite un animal errant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} Les Shafi'ites: lorsqu'un compagnon de marche trouve un objet perdu et que l'autre lui demande de le ramasser, l'intention de celui qui le ramasse détermine à qui il appartient. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} Les Hanbalites: lorsque deux personnes voient un enfant trouvé et que l'une le prend ou pose la main dessus en premier, c'est elle qui a le droit de le prendre, et non de le voir; si l'une demande à l'autre de le lui donner, c'est l'intention de celui qui le prend qui détermine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359} Septièmement, un pèlerin en état d'ihram qui s'empare d'un gibier. Les juristes s'accordent à dire qu'il est interdit au pèlerin effectuant le hajj ou la umra de s'emparer de gibier par achat, location, emprunt ou tout autre moyen similaire, que ce soit à l'intérieur ou à l'extérieur du sanctuaire, conformément à l'interdiction du Coran dans la sourate al-Ma'ida (citée par cette seule sourate). Il est également interdit de s'emparer de gibier à l'intérieur du sanctuaire, même pour un non-pèlerin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17359}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Huitièmement, ce qui n'est pas considéré comme de la possession. La règle est qu'une personne libre n'est pas soumise à la possession d'autrui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} S'approprier le bien d'autrui sans motif légitime est un délit qui engage la responsabilité de son auteur, qu'il soit gouvernant ou gouverné. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Deuxième partie: la position de la main. Les juristes divergent quant à la position de la main droite sur la gauche pendant la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Ils s’accordent à dire que poser la main sur la hanche est déconseillé, en raison d’un hadith d’Abu Hurayra contredisant cette posture, et parce qu’elle contredit le sens de la prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Au pied de la Pierre Noire, le pèlerin la baise avec la bouche s’il le peut; sinon, il la touche de la main et baise sa main. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360} Concernant les tombes: les Malikites, l’école Hanafite et l’école Chafi’ite considèrent que toucher les tombes est une innovation; l’ouvrage cite plusieurs juristes qui s’opposent à ce geste, le qualifiant de coutume chrétienne, et Ibn Taymiyya rapporte un consensus sur le fait qu’une tombe ne doit être ni touchée ni embrassée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} L’école Chafi’ite et Ahmad, dans un hadith rapporté, jugent déconseillé de toucher une tombe avec la main; al-Jamal fait exception lorsque ce geste est destiné à bénir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} Selon l'école hanafite et l'école hanbalite, toucher une tombe n'est pas répréhensible, et Ahmad, dans un hadith rapporté, le recommande. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362} En cas de bâillement, il est recommandé de se retenir et, si cela s'avère impossible, de porter la main à la bouche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} En cas d'éternuement, la sunna consiste à porter la main ou un vêtement à la bouche et à baisser la voix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} Les Malikites recommandent de poser la main sur le malade pendant la prière, si ce contact ne lui déplaît pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363} Concernant les mains des défunts: les Hanafites placent la main droite à droite et la gauche à gauche, et interdisent de les poser toutes les deux sur la poitrine; les Chafi'ites autorisent de les poser sur la poitrine, la droite sur la gauche, ou de les laisser le long du corps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17363}"
  ur: "وَدَ الید ⁦(لفظی طور پر ہاتھ رکھنا)⁩ کا مطلب چھوڑنا یا گرانا ہے، جیسا کہ اس فقرے میں ہے کہ کسی نے کسی کا قرض گرا دیا، اور ہاتھ احسان، طاقت، قبضہ اور ملکیت کے معنی میں: 'معاملہ فلاں کے ہاتھ میں ہے' کا مطلب ہے کہ وہ اس کے اختیار میں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17350} فقہاء کے نزدیک یہ کسی چیز پر مالک کا اختیار ہے یا مالک کا اس طرح سے تصرف ہے جس طرح مالک تصرف کرتا ہے۔ فقہاء نے خود جسمانی ہاتھ کے لیے بھی یہ جملہ استعمال کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17351} حیض پکڑنا اور جمع ہونا ہے، اور ودع الید وسیع تر اصطلاح ہے۔ غاصب مالک کی جائیداد کو زبردستی اور کھلے مقابلے کے ذریعے چھین رہا ہے، اور ود ید غاصب سے زیادہ وسیع ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17351} سب سے پہلے، کسی چیز کو ملکیت کے لیے رکھنے کے احکام۔ فقہا کا اتفاق ہے کہ ملکیت کا ثبوت ہے، تفصیل کے اختلاف کے ساتھ۔ حنفیہ ملکیت کے مضبوط ترین دلائل میں سے تصرف اور تصرف کو کہتے ہیں، اس لیے اس بات کی گواہی کہ مالک چیز کا مالک ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17351}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17352} مالکیوں کا خیال ہے کہ جو ہولڈنگ قائم رہے، اس میں مقابلہ نہیں کیا جاتا اور بطور مالک استعمال کیا جاتا ہے کسی چیز کو استعمال کرنے سے ملکیت ثابت ہوتی ہے، جبکہ مختصر ہولڈنگ سے ثابت نہیں ہوتا۔ ابن رشد اس بارے میں مختلف جوابات دیتے ہیں کہ آیا فریق ثالث کو یہ کہنا چاہیے کہ یہ چیز کہاں سے آئی ہے، اس بات پر منحصر ہے کہ اس کا انعقاد کتنے عرصے تک جاری رہا اور آیا دعویٰ کرنے والے کے عنوان کی جڑ قائم ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17352}{cite:fiqh-masua-kuwaitiyya-noor-v3 p.17353} چیز کے ساتھ انعقاد کا طریقہ مختلف ہوتا ہے۔ زمین کے لیے گھر میں رہنا، اس پر تعمیر کرنا، کنواں، نہر یا نالہ کھودنا، درخت لگانا، بونا، کھلی زمین پر اینٹیں بنانا۔ موٹی لکڑی یا سرکنڈے کی جھاڑی کے لیے، لکڑی کاٹنا اور بیچنا اور اسے استعمال کرنا؛ چراگاہ، گھاس کاٹنے اور بیچنے یا اس پر جانوروں کو چرانے کے لیے۔ کسی اور کے پاس چابی اسے گھر کا مالک نہیں بناتی۔ جو اس میں رہتا ہے وہ اسے رکھتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17353}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17354} منقولہ کے لیے، پکڑنا کسی بھی چیز کی علامت ہے، جیسے کہ غلاموں کا استعمال، جانوروں کی سواری، مویشیوں کو دودھ دینا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17353}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17354} دوسرا، انعقاد کا ثبوت۔ احناف زمین کو دوسری چیزوں سے ممتاز کرتے ہیں: زمین کا متنازعہ قبضہ گواہوں سے ثابت ہونا چاہیے اور یہ دونوں فریقوں کے اقرار سے ثابت نہیں ہوتا اور نہ ہی جج کے علم سے، کیونکہ زمین کا قبضہ نظر نہیں آتا اور دونوں فریق اس کا دعویٰ کر رہے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17354} مستثنیات خریداری، غصب اور چوری کے دعوے ہیں، جہاں پر قبضے کے ثبوت کی ضرورت نہیں ہے، کیونکہ کسی بھی شخص کے خلاف ایکٹ کا دعویٰ کیا جا سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17354} منقولہ کے لیے، جس کے ہاتھ میں چیز پائی جاتی ہے وہ اسے تھام لیتا ہے، اور پکڑنا گواہوں، نظروں یا اقرار سے ظاہر ہوسکتا ہے۔ اگر مدعا علیہ اپنے قبضے سے انکار کرتا ہے اور مدعی گواہوں کے ذریعے ظاہر کرتا ہے کہ یہ چیز مدعا علیہ کے ہاتھ میں ایک سال سے تھی، تو گواہوں کو سنا جاتا ہے اور مدعا علیہ کے ساتھ ہولڈر سمجھا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17354}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17355} تیسرا، دوسرے کی جائیداد رکھنا۔ جارحیت میں بغیر اجازت کسی کی جائیداد لینا غصب ہے جس کی تفصیل غاصب کے تحت ہے۔ غلطی سے اسے لے جانا، جیسا کہ کوئی شخص اسے اپنا سمجھتا ہے، اسے معاوضہ کا ذمہ دار بنا دیتا ہے لیکن گناہگار نہیں، کیونکہ غلطی حساب سے اٹھا لی جاتی ہے۔ اس کتاب میں اس جماعت سے غلطی کو دور کرنے پر ایک حدیث کا حوالہ دیا گیا ہے اور نوٹ کیا گیا ہے کہ النووی نے اس موضوع پر ایک حدیث کو حسن قرار دیا ہے جیسا کہ ابن حجر نے بیان کیا ہے۔ گریڈ یہاں صرف منسوب کے طور پر منسوب اور ریکارڈ کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17355} چوتھا، قبضہ کے تنازعات۔ جب دو لوگ زمین پر مقابلہ کرتے ہیں اور ہر ایک اس پر قبضہ کرنے کا دعویٰ کرتا ہے، تو ہر ایک سے ثبوت طلب کیا جاتا ہے۔ اگر دونوں اسے پیش کرتے ہیں تو دونوں کو زمین کو ایک ساتھ رکھنے کے لئے روک دیا جاتا ہے، ہر ایک مدعا علیہ کو اس حصے کا جو اس کے پاس ہے اور اس حصہ کا دعویدار جو اس کے پاس نہیں ہے۔ اگر ایک دکھاتا ہے کہ وہ اپنے انعقاد کو ثابت نہیں کر سکتا اور دوسرا اسے ثابت کرتا ہے، تو مؤخر الذکر کو ہولڈر سمجھا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17355} بغیر ثبوت کے، مضبوط ہولڈر کو ترجیح دی جاتی ہے، یا وہ برابر ہوتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17355}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17356} پانچویں، انعقاد کے درجات۔ بغیر ثبوت کے احناف مثال دیتے ہیں: لباس پہننے والا اپنی آستین پکڑنے والے سے بہتر دعویٰ کرتا ہے۔ سوار کے پاس لگام رکھنے والے سے بہتر دعویٰ ہے۔ اپنے پیچھے والے کے اوپر کاٹھی میں بیٹھا ہوا، ظاہری منظر میں؛ جانور پر بوجھ اٹھانے والا اس پر جو اپنا جگ لٹکائے۔ ایک دیوار اس کی ملکیت ہے جس کے شہتیر اس پر تین شہتیر کے اصول کے ساتھ ہوتے ہیں۔ اور ایک دیوار آپس میں جڑی ہوئی اینٹوں سے یا لکڑی کے کسی ٹکڑے سے جوڑی جاتی ہے جس سے اس کا تعلق ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17357} مالکیوں کا درجہ: پہلے کپڑے اور بیلٹ جو آدمی پہنتا ہے، پھر وہ قالین جس پر وہ بیٹھتا ہے، پھر جس جانور پر وہ سوار ہوتا ہے، پھر جس جانور کو چلاتا ہے، پھر جس پر سوار ہوتا ہے، اس کی رہنمائی کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17357} شافعی: جب دو جانور ایک دوسرے سے مقابلہ کرتے ہیں اور ایک اس پر بوجھ ہوتا ہے تو بوجھ اٹھانے والے کی قسم پر یقین کیا جاتا ہے۔ جب ایک جانور کو رکھتا ہے اور دوسرا اس کا بوجھ رکھتا ہے، تو جانور کو رکھنے والا بہتر دعویٰ کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17357}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17358} حنبلی: جب کوئی جانور پر سوار ہو یا اس پر بوجھ ہو اور دوسرا اس کی روک تھام کر یا اسے چلاتا ہو تو پہلے اس کا دعویٰ مضبوط ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17357}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17358} چھٹا، کھوئی ہوئی چیز اور بانی کو پکڑنا۔ احناف نے کھوئی ہوئی چیز تلاش کرنے والے کو اپنے لیے لینے سے منع کیا ہے نہ کہ اس کے مالک کے لیے۔ کتاب نے صحیح مسلم میں گمراہ کو پناہ دینے والے کے بارے میں ایک حدیث نقل کی ہے۔ شافعی: جب دو ساتھیوں میں سے ایک کو کھوئی ہوئی چیز ملے اور دوسرا اسے اٹھانے کو کہے تو اسے اٹھانے والے کی نیت فیصلہ کرتی ہے کہ اس کا مالک کون ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17358} حنبلی: جب دو ایک بانی دیکھیں اور کوئی اسے لے یا پہلے اس پر ہاتھ رکھے تو اس کا دعویٰ بہتر ہے۔ لینا، دیکھنا نہیں، اہمیت رکھتا ہے۔ اگر ایک دوسرے سے کہے کہ وہ اسے دے دے تو لینے والے کی نیت فیصلہ کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17359} ساتواں، احرام کی حالت میں حجاج کا کھیل پکڑنا۔ فقہاء اس بات پر متفق ہیں کہ حج یا عمرہ کے لیے حاجی کے لیے حرم کے اندر یا اس کے باہر خریداری، کرایہ، قرض یا اسی طرح کے ذرائع سے کھیل کھیلنا حرام ہے، جیسا کہ قرآن نے سورۃ المائدہ میں منع کیا ہے ⁦(صرف سورۃ کا حوالہ دیا گیا ہے)⁩؛ حرم کے اندر کھیل کھیلنا بھی حرام ہے یہاں تک کہ غیر حاجی کے لیے بھی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17359}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17360} آٹھواں، جو چیز زیر اثر نہیں آتی۔ قاعدہ یہ ہے کہ آزاد شخص دوسرے کی گرفت میں نہیں آتا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17360} بغیر شرعی وجہ کے کسی دوسرے کا مال لینا غلط ہے جس کی وجہ سے لینے والا ذمہ دار ہے، خواہ لینے والا حاکم ہو یا حاکم۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17360} دوسرا حصہ، جسمانی ہاتھ۔ نماز میں دایاں ہاتھ بائیں طرف رکھنے میں فقہاء کا اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17360} وہ اس بات پر متفق ہیں کہ نماز میں کولہے پر ہاتھ رکھنا ناپسندیدہ ہے، کیونکہ ابوہریرہ کی ایک حدیث کولہے کو پکڑ کر نماز پڑھنے کے خلاف ہے، اور اس لیے کہ حالت نماز کے خلاف ہے۔ حجر اسود پر طواف کرنے والا اگر استطاعت رکھتا ہو تو اسے اپنے منہ سے چومتا ہے اور بصورت دیگر اسے ہاتھ سے چھوتا ہے اور ہاتھ چومتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17360} قبروں کے بارے میں: مالکیہ، حنفی اور شافعی مسلک کے نزدیک قبروں کو چھونا بدعت ہے۔ کتاب میں متعدد فقہا کا حوالہ دیا گیا ہے کہ وہ قبروں کو چھونے یا چومنے کے خلاف ہیں، جیسا کہ عیسائیوں کی روایت ہے، اور ابن تیمیہ نے اس بات پر اتفاق کیا ہے کہ قبر کو چھوا یا بوسہ نہیں دیا جاتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17360}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17361}{cite:fiqh-masua-kuwaityya-nour-v3 p.17362} شافعی مکتب کی رپورٹ کو ایک ہاتھ میں دیکھ کر احمدیوں کو ہاتھ لگا کر دیکھتے ہیں۔ ناپسندیدہ الجمال سوائے اس صورت کے جس میں برکت کا ارادہ ہو۔ حنفی مسلک اور حنبلی مسلک کے مطابق قبر کو چھونا قابل اعتراض نہیں ہے، اور احمد نے ایک رپورٹ میں اس کی سفارش کی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17362} جمائی آنے پر اسے دبانا مستحب ہے اور اگر نہ کرسکے تو منہ پر ہاتھ رکھے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17362}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17363} چھینک آنے پر ہاتھ یا کپڑے کو منہ پر رکھنا اور آواز کو نیچی کرنا سنت ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17363} مالکیہ تجویز کرتے ہیں کہ بیمار کے لیے دعا کرتے وقت اس پر ہاتھ رکھیں، اگر لمس اس کے لیے ناپسندیدہ نہ ہو۔ میت کے ہاتھ پر: احناف داہنے ہاتھ کو داہنی طرف اور بائیں کو بائیں طرف رکھتے ہیں اور دونوں کو سینے پر رکھنے سے منع کرتے ہیں۔ شافعی انہیں سینے پر، دائیں بائیں، یا اطراف میں چھوڑنے کی اجازت دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17363}"
  tr: "Dilde 'eli koymak' terk etmek ve projeksiyon anlamına gelir ve 'Borcunu ona koydum', yani bıraktım denir. Ve 'el' bereket, güç, sahiplik ve sahiplik anlamına gelir. Ayrıca 'şu kişinin elinde' denir, yani onun alanı ve mülkiyeti anlamındadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17350} Hukukçulara göre, elin sahibinin fiili bir eylemde ya da sahibinin yerleşik eyleminde yaptığı eylemdir. Hukukçular ayrıca somut eli de ifade eder, yani yaralı eldir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17351} Dilde sahiplik damma ve çoğuldur; terminolojide bir şeyi ele geçirip elini üzerine koymak anlamına gelir, eli koymak ise daha genel bir terimdir. Gasp, mülkün mülkünden kamusal ve zorla alınmasıdır ve elin koyulması, gasptan daha geniştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17351} Birincisi: El koymanın mülkiyet üzerine konmasıyla ilgili kararlar. Hukukçular genellikle elin koyulmasının mülkiyet kanıtı olduğu konusunda hemfikirdir ve bundan sonra daha fazla ayrıntı vermektedirler. Hanafiler, elin koyulmasının ve elden çıkarılmasının mülkiyetin en güçlü kanıtlarından biri olduğunu, bu nedenle elin kendisine ait olduğuna dair tanıklığın geçerli olduğunu belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17352} Malikisler açıkça belirtmiştir: Eğer mülkiyet uzatılır ve anlaşmazlık olmazsa ve sahibi sahip olarak hareket ederse, bu mülkiyeti gösterir, ancak süre uzatılmazsa mülkiyet tespiti sayılmaz. İbn Rüşd, cevabı, sahibin mülkiyet süresine ve iddia sahibi için orijinalin yerleşimine göre nerede elde ettiğinden ayırmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17353} Elinizi nasıl yerleştireceğiniz öğeye göre değişir. Gayrimenkulde, konut ve bina inşa etmek için; meralarda kuyu, nehir veya kanal kazmak, ağaç dikmek, ürün ekmek veya süt üretmek için; ormanlarda ve ormanlarda ağaç kesmek, satmak ve bunlardan faydalanmak; ve meralarda ise çim biçmek, satmak veya hayvanları otlatmak içindir. Anahtarın birinin elinde olması, evin sahibi olduğu anlamına gelmez; çünkü sakin mülkün sahibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17354} İletilen raporlarda, bir kişinin mülkiyetini gösteren her şey dahil edilir; örneğin köle kullanmak, hayvan binmek ve hayvan sağmak gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17353}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17354} İkinci: Mülkiyetin kanıtlanma araçları. Hanefi okulu gayrimenkul ile diğerleri arasında ayrım yapar: tartışmalı mülkiyetin kanıtı, tarafların karşılıklı anlaşmasıyla veya hakimin bilgisiyle değil, kanıtla yapılır; çünkü mülkiyet görünür değildir, bu yüzden alçakgönüllülükten başkalarının elinde olabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17354} Satın alma, gasp ve hırsızlık vakaları, mülkiyet hakkını kanıtlama yükümlülüğünden muaftır, çünkü eylemin talebi mülkiyet sahibine veya başkalarına karşı geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17354} Taşınabilir mal sahipliğinde, mülkiyet sahibi onun mülkiyetinde olan kişidir ve statü delil, gözlem veya itirafla belirlenir; davalı varlığı reddederse ve davacı taşınmazın bir yıldır onun elinde olduğunu kanıtlarsa, delil dinlenir ve davalı mülkiyete sahip sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17354} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17355} Üçüncüsü: Başkasının malına el koymak. Başkasının malını izni olmadan alan gaspçı sayılır ve bunun ayrıntıları gaspçılık bölümünde yer alır. Başkasının malını izni olmadan yanlışlıkla alırsa, sanki bunu kendi malı sanırsa sorumludur ve günah taşımaz, çünkü hata suçlanabilir. Kur'an, ümmetten hatayı çıkarmak için bir hadis atıfta bulunur. Yorumcu, İbn Majah'ın bunu rivayet ettiğini ve el-Nevavi'nin İbn Hacer'in aktardıklarına göre iyi derecelendirdiğini belirtmiştir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17355} Dördüncü: Mülkiyet üzerindeki anlaşmazlık. İki kişi mal üzerinde tartışırsa ve her biri mülkiyete sahip olduğunu iddia ederse, her ikisinden de delil gereklidir. Eğer bunu kanıtlarlarsa, elleri birlikte oturur ve her biri mülkiyet koyduğu bölümde ve bıraktığı kısımda sanık olur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17355} Eğer hiçbirinin kanıtı yoksa, güçlü tarafa bir el verilir ya da eşitlik durumunda eşittirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17356} Beşinci: Elin pozisyonları. Hanafiler, kanıtsız anlaşmazlıklarda tercih örnekleri vermiştir: giysi giyenin kolunu tutan kişiden daha fazla hakkı vardır, binicinin dizgini tutan kişiden daha fazla hakkı vardır, eyerli olan kişi yoldaşından daha fazla hakka sahiptir, hayvanı taşıyan kişi, sürahisinin asıldığı hakktan daha fazla hak sahibidir ve duvar ise sandığını asan kişiye aittir. Bağlantı, kare ve batma arasında ayrım yaparlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17357} Malikiler elin sıralarını düzenler: en büyüğü kişinin kıyafetleri ve bölgesi, sonra oturduğu halı, sonra bindiği hayvan, sonra sürdüğü veya bindiği hayvan, sonra yaşadığı ev. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17357} Şafiiler şöyle der: Bir hayvan buluşursa ve biri hamileyse, görüş kuzunun sahibinin sağ elindedir; ve bir hayvan üzerinde tartışırlarsa, birinin eli üzerinde olur, diğeri elinin üzerinde olur, o zaman hayvanın üzerinde olan kişiye aittir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17358} Hanbalılar şöyle derdi: Birinin binip onun için yük taşıdığı, diğeri ise dizginini aldığı hayvan, sağ eliyle birinciye aittir çünkü bu daha güçlü bir davranıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17358} Altıncı: Elin avın ve buluntu çocuğun üzerine konması. Hanefilere göre, toplayıcının çalınanı kendisi için alması yasaktır, sahibine değil, çünkü başkasının malını izinsiz almıştır, bu yüzden bu gasp sayılır. Kur'an, Müslüman tarafından bildirilen kayıp malı tanımlayan bir hadisten bahsedilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17358} Şafiiler şöyle der: Birisi başkasının emriyle almak isterse, anlamı alanın niyetidir. Eğer kendisi alırsa, sadece emredene aittir, ikisini birden niyetle isterlerse o kişi onundur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17358} Hanbalılar şöyle demiştir: Eğer birlikte bir buluntu görürlerse ve biri onu ilk alan ya da elini koyarsa, ona daha fazla hakkı vardır; ancak yoldaşı onu teslim etmesini emrederse, anahtar alıcının niyetidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17359} Yedinci: Hacı elini oyuna koyar. Hac veya Umre sırasında hacının Haram içinde ve dışında avı satın alması, kiralaması, ödünç alması veya benzeri şeyler yapması yasaktır, Allah'ın Sure'si Mezide olarak belirttiği gibi. Haram'da avcılığa el koymak da yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17359} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17360} Sekizinci: Ele girmeyen şey. Hukukçuların kuralı, özgür bir kişinin ele girmediğidir ve bu özgürlük bölümünde detaylandırılmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17360} ve başkasının malına meşru bir sebep olmadan dokunmanın zarar verdiği ve sorumlu tutulması gerektiğini, ister bir hakim ister mahkum olsun, bunu koyduğu kişi fark etmeksizin sorumlu tutmaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17360} İkincisi: Elle ilgili kararlar. Dualarda, hukukçular sağ elin sol elin üzerine koyulması konusunda görüşlere göre farklı görüşler sergilerdir ve ayrıntılar mesajın gönderilmesiyle ilgili bölümde yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17360} Namaz sırasında elin beline koyulmasının hoşlanmaması konusunda hemfikirdiler; çünkü bu namazda Abu Huraira'dan kısaca bildirilmiştir ve görünüş duanın şekliyle çelişmektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17360} Taif, yapabilirse Kara Taş'ı ağzıyla alabilir; aksi takdirde elini üzerine koyar ve öper. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17360} Mezara el koyma konusunda: Malikiler ve Hanafi aynı görüşte, Şafiiler ise bunun bir yenilik olduğunu söyler. Kitap, mezara dokunmayı ve öpmeyi yasaklayan birkaç hukukçunun Hristiyan geleneği olduğunu belirtir. İbn Teymiyye ayrıca mezarın üzerine sililme ve öpücük verilmemesi gerektiği konusunda anlaşmayı bildirmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17362} Okuldaki Şafi'lerden ve Ahmad'dan alıntılanan kitap, mezara el ile dokunmayı sevmediklerini anlatır; deve hariç, kutsama için yapıldığı yerde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17362} Hanafiler tek bir görüşteydi ve okuldaki Hanbalılar mezara el koymanın izin olduğunu savunur, Ahmed ise mezara dokunulmasını tavsiye eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17362} Esneme sırasında elin ağıtlanması ve mümkünse elin ağzının önüne konması gerekir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17362} {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17363} Hapşırırken, elin veya bezin ağzının üzerine konması ve sesi kısılması sünnettir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17363} Malikilere göre, hastalar için dua ederken elin hasta için elin konması tavsiye edilir, eğer onlar hoşlanmadıkça. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17363} Ölenin ellerinin nasıl yerleştirileceğine ilişkin olarak: Hanefi okuluna göre sağ sağ tarafa, sol sol tarafa konur, göğsün üzerine değil; Şafi'ler elleri ölen kişinin göğsüne veya yanlarına koymaya izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17363}"
  id: "Dalam bahasa tersebut, 'meletakkan tangan' berarti meninggalkan dan memproyeksikan, dan dikatakan: 'Saya meletakkan hutangnya padanya,' artinya saya melepaskannya. Dan 'tangan' berarti berkat, kekuasaan, kepemilikan, dan kepemilikan. Juga dikatakan 'di tangan si anu,' yang berarti dalam wilayah dan kepemilikannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17350} Menurut ahli hukum, itu adalah tindakan pemilik tangan dalam tindakan nyata, atau tindakan yang telah ditetapkan oleh pemiliknya. Ahli hukum juga merujuk pada tangan yang nyata, yaitu tangan yang merugi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17351} Kepemilikan dalam bahasa ini adalah damma dan jamak; dalam terminologi, itu berarti meraih sesuatu dan meletakkan tangan di atasnya, dan meletakkan tangan lebih umum. Pengambilalihan adalah pengambilan kepemilikan pemilik dari propertinya secara publik dan paksa, dan meletakkan tangan lebih luas daripada pengambilalihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17351} Pertama: Putusan terkait penempatan tangan di atas properti. Para ahli hukum umumnya sepakat bahwa meletakkan tangan adalah bukti kepemilikan, dan mereka memiliki rincian lebih lanjut setelah itu. Para Hanafi mengatakan bahwa meletakkan tangan dan menjualnya adalah salah satu bukti kepemilikan yang paling kuat, sehingga kesaksian bahwa tangan itu adalah miliknya adalah sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17352} Malikis secara eksplisit menyatakan bahwa jika kepemilikan diperpanjang dan tidak ada perselisihan, dan pemilik bertindak sebagai pemilik, maka itu menunjukkan kepemilikan, tetapi jika periode tidak diperpanjang, kepemilikan tidak ditetapkan. Ibn Rushd memisahkan jawaban dari pertanyaan dari mana pemilik memperoleh pemilik, sesuai dengan durasi kepemilikan dan penetapan asli untuk pengklaim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17353} Cara meletakkan tangan berbeda-beda tergantung item. Dalam properti, ini untuk perumahan dan pembangunan bangunan; di padang rumput, menggali sumur, sungai, atau kanal, atau menanam pohon, menanam tanaman, atau membuat susu; di hutan dan hutan, menebang pohon, menjualnya, dan mendapatkan manfaat darinya; serta di padang rumput, memotong rumput, menjualnya, atau merumput hewan di dalamnya. Kehadiran kunci di tangan seseorang tidak berarti orang yang menempatkan kepemilikan rumah tersebut, karena penghuni adalah pemilik kepemilikan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17354} Dalam laporan yang dikirimkan, disertakan segala sesuatu yang menunjukkan kepemilikan seseorang, seperti menggunakan budak, menunggang binatang, dan memerah ternak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17354} Kedua: Cara membuktikan kepemilikan. Aliran Hanafi membedakan antara properti nyata dan lainnya: membuktikan kepemilikan properti yang dipersengketakan dilakukan melalui bukti, bukan atas kesepakatan bersama para pihak atau pengetahuan hakim, karena kepemilikan tidak terlihat, sehingga mungkin berada di tangan orang lain karena kerendahan hati. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17354} Kasus pembelian, pengambilalihan, dan pencurian dikecualikan dari kewajiban membuktikan kepemilikan properti, karena klaim atas tindakan tersebut sah terhadap pemilik properti atau pihak lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17354} Adapun barang bergerak, pemiliknya adalah orang yang dimilikinya, dan statusnya dibuktikan melalui bukti, pengamatan, atau pengakuan; jika tergugat menyangkal keberadaannya dan penggugat memberikan bukti bahwa barang bergerak telah berada dalam kepemilikannya selama setahun, bukti tersebut didengar dan terdakwa dianggap memiliki kepemilikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17354} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17355} Ketiga: Mengambil alih harta milik orang lain. Siapa pun yang mengambil harta orang lain tanpa izin dianggap sebagai perebutan kekuasaan, dan rinciannya ada dalam bab perebutan kekuasaan. Siapa pun mengambil harta orang lain tanpa izin secara keliru, seolah-olah ia mengira harta itu miliknya, ia bertanggung jawab dan tidak menanggung dosa, karena kesalahan itu dapat disalahkan. Al-Qur'an mengutip hadits untuk menghilangkan kesalahan dari umat. Sang komentator menyebutkan bahwa Ibn Majah yang menceritakannya dan al-Nawawi menilainya baik sesuai dengan apa yang dilaporkan Ibn Hajar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17355} Keempat: Sengketa tentang penempatan kepemilikan. Jika dua orang bersengketa atas properti dan masing-masing mengklaim memiliki harta tersebut, maka bukti diperlukan dari keduanya. Jika mereka membuktikannya, tangan mereka ditetapkan bersama, dan masing-masing menjadi tergugat dalam bagian tempat ia memiliki dan bagian yang dimilikinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17355} Jika tidak ada bukti, pihak yang lebih kuat diberi bantuan, atau mereka sama dalam kasus kesetaraan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17356} Kelima: Posisi tangan. Hanafi menyebutkan contoh preferensi dalam perselisihan tanpa bukti: orang yang mengenakan pakaian memiliki hak lebih besar daripada yang memegang lengan bajunya, penunggang memiliki hak lebih daripada yang memegang tali kekang, yang duduk di pelana memiliki hak lebih dari temannya menurut narasi yang jelas, yang membawa hewan memiliki hak lebih besar daripada yang digunakan untuk menggantung kendi itu, dan dinding milik orang yang menggantung batangnya. Mereka membedakan antara sambungan, persegi, dan tusukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17357} Keluarga Malik mengatur barisan tangan: yang terbesar adalah pakaian dan wilayah seseorang, lalu karpet tempat dia duduk, kemudian hewan yang dia tunggangi, kemudian yang dia kendarai atau tunggangi, lalu rumah tempat dia tinggal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17357} Para syafi berkata: Jika seekor hewan bertemu dan salah satu dari mereka hamil, pendapatnya adalah bahwa pemilik domba berada di tangan kanannya; dan jika mereka bertengkar tentang seekor hewan, satu tangan di atasnya dan yang lain memegang tangan di atas binatang itu, maka itu milik yang tangannya di atas hewan itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17358} Hanbalis berkata: Hewan yang ditunggangi dan diangkat oleh salah satu dari mereka dan membawa beban untuknya, dan yang lain memegang tali kekang, milik yang pertama dengan tangan kanannya karena perilaku itu lebih kuat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17358} Keenam: Meletakkan tangan di atas tangkapan dan anak yang ditemukan. Menurut Hanafi, dilarang bagi pemetik untuk mengambil barang curian untuk dirinya sendiri, bukan untuk pemiliknya, karena ia mengambil barang orang lain tanpa izinnya sendiri, sehingga dianggap sebagai pengambilalihan. Al-Qur'an menyebutkan hadits yang mendefinisikan barang yang hilang yang dilaporkan oleh Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17358} Syafi'i berkata: Jika salah satu dari mereka yang berniat mengambil barang itu atas perintah orang lain, maknanya adalah niat pengambil. Jika ia mengambilnya untuk dirinya sendiri, maka itu milik orang yang memerintahkannya sendiri, dan jika mereka bermaksud keduanya, maka itu milik mereka. {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17358} Para Hanbal berkata: Jika mereka melihat anak terantuk bersama dan salah satu dari mereka adalah yang pertama mengambil atau meletakkan tangannya di atasnya, maka ia lebih berhak mendapatkannya; tetapi jika temannya memerintahkan untuk menyerahkannya, maka kunci adalah niat pengambilnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17359} Ketujuh: Haji meletakkan tangannya di atas buruan. Dilarang bagi haji selama Haji atau Umrah untuk meletakkan tangan di buruan dengan membeli, menyewakan, meminjam, atau sejenisnya, di dalam dan di luar Haram, seperti yang dikatakan Allah dalam Surah Al-Ma'idah. Juga dilarang meletakkan tangan berburu di Haram sebagai hal yang sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17359} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17360} Kedelapan: Apa yang tidak berada di bawah tangan. Aturan para ahli hukum adalah bahwa orang bebas tidak berada di bawah tangan, dan aturan ini dijelaskan dalam bab tentang kebebasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17360} dan bahwa meletakkan tangan pada barang orang lain tanpa alasan yang sah menyebabkan kerugian dan memerlukan tanggung jawab, baik yang meletakkannya adalah hakim atau terpidana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17360} Kedua: Putusan terkait penempatan tangan yang nyata. Dalam doa, para ahli hukum berbeda pendapat mengenai meletakkan tangan kanan di atas tangan kiri sesuai pendapat, dan rincian ada dalam bab tentang mengirim (mengirim pesan). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17360} Mereka sepakat untuk tidak suka meletakkan tangan di pinggang saat berdoa, seperti yang dilaporkan secara singkat oleh Abu Huraira dalam doa, dan karena penampilannya bertentangan dengan bentuk doa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17360} Taif boleh menerima Batu Hitam dengan mulutnya jika bisa; jika tidak, ia meletakkan tangannya di atasnya dan menciumnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17360} Mengenai meletakkan tangan di makam: Malik dan Hanafi memiliki satu pendapat, dan para Shafi'i mengatakan itu adalah inovasi. Buku tersebut mengutip beberapa ahli hukum yang melarang menyentuh dan mencium makam karena itu adalah kebiasaan Kristen. Ibn Taymiyyah juga melaporkan kesepakatan bahwa seseorang tidak boleh menghapus atau mencium makam tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17362} Kitab yang dikutip dari para Shafi'i di sekolah dan Ahmad dalam narasi tentang ketidaksukaan menyentuh makam dengan tangan, kecuali unta yang seharusnya diberkati. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17362} Para Hahati memiliki satu pendapat, dan para Hanbal di sekolah berpendapat bahwa meletakkan tangan di makam diperbolehkan, dan Ahmad menceritakan bahwa mereka menyarankan untuk menyentuhnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17362} Saat menguap, seseorang harus meratapi tangan dan meletakkan tangan di mulut jika memungkinkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 17363} Dalam bersin, adalah Sunnah untuk menutupi mulut dengan tangan atau kain dan menurunkan suara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17363} Menurut Maliki, disarankan untuk meletakkan tangan di atas orang sakit saat berdoa untuk mereka, kecuali jika orang sakit tidak disukai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17363} Mengenai cara meletakkan tangan almarhum: menurut mazhab Hanafi, tangan kanan diletakkan di sisi kanan dan kiri di sisi kiri, bukan di dada; syafi'i diperbolehkan meletakkan tangan di dada atau sisi almarhum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17363}"
