label:
  ar: "الذود (في الزكاة)"
  en: "Dhawd (a small herd of three to ten camels, and its zakat)"
  ur: "ذود (اونٹوں کا چھوٹا ریوڑ اور اس کی زکوٰۃ)"
summary:
  ar: "الذود من الإبل من الثلاث إلى العشر، وأحكامه في زكاة الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8499} أقل نصاب تجب فيه الزكاة في الذود من الإبل خمس، فلا زكاة فيما دونها، وفي الخمس شاة، فإذا بلغت الذود عشرا ففيها شاتان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500} واختلف الفقهاء في إخراج الذكر أو قيمة الشاة في زكاة الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500}"
  en: "A dhawd is a small herd of camels from three to ten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8499} In the zakat of camels the least nisab is five camels: nothing is due on fewer, and on five one sheep is due, and on ten two sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500} The jurists differ over giving a male in place of a sheep and over giving its value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500}"
  ur: "ذود اونٹوں کے چھوٹے ریوڑ کو کہتے ہیں، جو تین سے دس تک ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8499} اونٹوں کی زکوٰۃ میں کم از کم نصاب پانچ اونٹ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500}"
