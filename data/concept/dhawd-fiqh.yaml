label:
  ar: "الذود ⁦(في الزكاة)⁩"
  en: "Dhawd (a small herd of three to ten camels, and its zakat)"
  ur: "ذود ⁦(اونٹوں کا چھوٹا ریوڑ اور اس کی زکوٰۃ)⁩"
  es: "Dhawd (una pequeña manada de tres a diez camellos, y su zakat)"
  fr: "Dhawd (un petit troupeau de trois à dix chameaux, et sa zakat)"
  tr: "Al-Dhud (Zakat'ta)"
  id: "Al-Dhud (dalam Zakat)"
summary:
  ar: "الذود من الإبل من الثلاث إلى العشر، وأحكامه في زكاة الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8499} أقل نصاب تجب فيه الزكاة في الذود من الإبل خمس، فلا زكاة فيما دونها، وفي الخمس شاة، فإذا بلغت الذود عشرا ففيها شاتان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500} واختلف الفقهاء في إخراج الذكر أو قيمة الشاة في زكاة الإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500}"
  en: "A dhawd is a small herd of camels from three to ten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8499} In the zakat of camels the least nisab is five camels: nothing is due on fewer, and on five one sheep is due, and on ten two sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500} The jurists differ over giving a male in place of a sheep and over giving its value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500}"
  ur: "ذود اونٹوں کے چھوٹے ریوڑ کو کہتے ہیں، جو تین سے دس تک ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8499} اونٹوں کی زکوٰۃ میں کم از کم نصاب پانچ اونٹ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500}"
  es: "Un dhawd es una pequeña manada de camellos de tres a diez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8499} En el zakat de los camellos, el nisab mínimo es de cinco camellos: no se debe nada por menos, y por cinco se debe una oveja, y por diez dos ovejas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500} Los juristas difieren sobre dar un macho en lugar de una oveja y sobre su valor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500}"
  fr: "Un dhawd désigne un petit troupeau de trois à dix chameaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8499} Pour la zakat sur les chameaux, le nisab minimal est de cinq chameaux: rien n'est dû pour un nombre inférieur, et pour cinq chameaux, une brebis est due, et pour dix, deux brebis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500} Les juristes divergent quant à la possibilité de donner un mâle à la place d'une brebis et quant à la prise en compte de sa valeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8500}"
  tr: "Develeri üç ila on kez savunur ve develer üzerindeki zekatla ilgili hükümleri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8499} Develere hak edilecek minimum nisab beştir, bu yüzden bundan daha azına zekat yoktur. Bir khumda koyunlar vardır. Develer ona ulaşırsa, içinde iki koyun vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8500} Hukukçular, erkeğin boşalması veya koyunun develer üzerindeki zekatı değeri konusunda farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8500}"
  id: "Mempertahankan unta dari tiga hingga sepuluh kali, dan putusan tentang zakat atas unta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8499} Nisab minimum yang harus dibayar zakat pada unta adalah lima, jadi tidak ada zakat untuk sesuatu yang kurang dari itu. Untuk khum, ada domba. Jika unta mencapai sepuluh, maka ada dua domba di dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8500} Para ahli hukum berbeda pendapat mengenai ejakulasi jantan atau nilai domba dalam zakat pada unta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8500}"
