label: { ar: "الجراحة وأعمال اليد", en: "Surgery, the work of the hand (al-jiraha)", fr: "La chirurgie, le travail de la main (al-jiraha)", ur: "جراحت اور ہاتھ کے اعمال", es: "La cirugía, el trabajo de la mano (al-jiraha)", tr: "Cerrahi ve El Sanatları", id: "Bedah dan Kerajinan Tangan" }
summary:
  ar: "يجعل ابن سينا في «القانون» استعمال أعمال اليد ثالث وجوه العلاج بعد التدبير والدواء {cite:canon-ibn-sina-print-v1 p.267}. ويضمّ هذا الباب عنده البطّ وقطع العضو الفاسد والكيّ وعلاج تفرّق الاتصال في اللحم والعظم، وفصد العروق {cite:canon-ibn-sina-print-v1 pp.289-310}. ويشترط في الباطّ أن يعرف تشريح العصب والأوردة والشرايين، وأن يكون معه ما يحبس الدم من الأدوية {cite:canon-ibn-sina-print-v1 p.306}."
  en: "In the Canon Ibn Sina makes the use of manual operations the third mode of treatment, after regimen and drugs {cite:canon-ibn-sina-print-v1 p.267}. For him this heading takes in incision of abscesses, the cutting away of a corrupted organ, cautery, the treatment of breaks in the continuity of flesh and bone, and the opening of veins {cite:canon-ibn-sina-print-v1 pp.289-310}. He requires the operator to know the anatomy of nerves, veins and arteries, and to have blood-stopping drugs at hand {cite:canon-ibn-sina-print-v1 p.306}."
  fr: "Dans le Canon, Ibn Sina fait des opérations manuelles le troisième mode de traitement, après le régime et les remèdes {cite:canon-ibn-sina-print-v1 p.267}. Il y range l’incision des abcès, l’ablation d’un organe putréfié, la cautérisation, le traitement des ruptures de continuité de la chair et des os, et l’ouverture des veines {cite:canon-ibn-sina-print-v1 pp.289-310}. L’opérateur doit, selon lui, connaître l’anatomie des nerfs, des veines et des artères et avoir sous la main des remèdes qui arrêtent le saignement {cite:canon-ibn-sina-print-v1 p.306}."
  ur: "ابن سینا «قانون» میں ہاتھ کے اعمال کے استعمال کو تدبیر اور دوا کے بعد علاج کا تیسرا طریقہ قرار دیتے ہیں {cite:canon-ibn-sina-print-v1 p.267}۔ ان کے ہاں اس عنوان میں پھوڑے کا چیرنا، فاسد عضو کا کاٹنا، داغنا، گوشت اور ہڈی میں اتصال ٹوٹنے کا علاج اور رگ کھولنا شامل ہیں {cite:canon-ibn-sina-print-v1 pp.289-310}۔ وہ شرط لگاتے ہیں کہ جراح اعصاب، وریدوں اور شریانوں کی تشریح جانتا ہو اور اس کے پاس خون روکنے والی دوائیں موجود ہوں {cite:canon-ibn-sina-print-v1 p.306}۔"
  es: "En el Canon, Ibn Sina considera las intervenciones manuales como el tercer método de tratamiento, después de los tratamientos convencionales y farmacológicos {cite:canon-ibn-sina-print-v1 p.267}. Para él, este apartado abarca la incisión de abscesos, la extirpación de órganos dañados, la cauterización, el tratamiento de roturas de la integridad de la carne y el hueso, y la apertura de venas {cite:canon-ibn-sina-print-v1 pp.289-310}. Exige que el cirujano conozca la anatomía de nervios, venas y arterias, y que disponga de fármacos para detener la hemorragia {cite:canon-ibn-sina-print-v1 p.306}."
  tr: "İbn Sina, Kanon'da el emeğinin kullanımı yönetim ve tıptan sonra üçüncü tedavi biçimi olarak kabul edilir {cite:canon-ibn-sina-print-v1 s.267}. Bu bölüm ördekler, çürümüş bir organın amputasyonu, koterizasyon, et ile kemik arasındaki ayrıştırıcı temasın tedavisi ve anevrizmaları içerir {cite:canon-ibn-sina-print-v1 s.289-310}. Boşluğun sinir, damar ve arter anatomisini bilmesi ve kan tutucu ilaçlarla birlikte olması gerekir {cite:canon-ibn-sina-print-v1 s.306}."
  id: "Dalam Ibn Sina, penggunaan tenaga kerja manual dianggap sebagai bentuk pengobatan ketiga setelah manajemen dan pengobatan {cite:canon-ibn-sina-print-v1 hlm.267}. Bagian ini mencakup bebek, amputasi organ yang membusuk, kauterisasi, pengobatan kontak disosiatif antara daging dan tulang, dan aneurisma {cite:canon-ibn-sina-print-v1 hlm.289-310}. Rongga harus mengetahui anatomi saraf, pembuluh darah, dan arteri serta disertai dengan obat penampung darah {cite:canon-ibn-sina-print-v1 hlm.306}."
