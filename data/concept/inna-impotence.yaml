id: concept/inna-impotence
class: concept
kind: legal
label:
  ar: "العِنّة"
  en: "Impotence (inna) as a ground for the wife's option to end the marriage"
  ur: "عنہ (نامردی)"
summary:
  ar: "العنة في اصطلاح الفقهاء العجز عن الوطء في القبل مع سلامة الآلة، وسمي العنين لليونة في ذكره وانعطافه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11884}. وعيب العنة يخير به الزوجة عند جمهور الفقهاء، فتطلب الفرقة، ويؤجل الحاكم الزوج سنة قمرية من يوم الترافع، اقتداء بعمر بن الخطاب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11889}. ويحتسب الأجل إلا ما يمنع من الوطء كالحيض والصوم والمرض والحج والسفر على تفاصيل المذاهب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11891}. وتثبت العنة بإقرار الزوج أو بيمينه أو بالبينة، ويعتبر الحاكم أو من ينوب عنه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11888}. فإذا انقضى الأجل ولم يصل إليها خيرت، فتختار الفرقة، وقال الحنفية هي طلاق بائن، وقال الشافعية والحنابلة فسخ، وللمالكية تفصيل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11894}. وللزوجة المهر كاملاً عند المالكية والحنفية في الجملة، وعليها العدة عند الحنفية والحنابلة والمالكية احتياطاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11900}."
  en: "In the jurists' usage, 'inna is the inability to have intercourse through the front passage while the organ is sound; the man is called 'anin for the softness and bending of his organ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11884}. Impotence is a defect that gives the wife the right to ask for separation, according to the majority; the judge gives the husband a lunar year from the day of the claim, after the practice of 'Umar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11886} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11889}. The time is not counted while a lawful barrier stops intercourse, such as menstruation, fasting, sickness, pilgrimage or travel, on the detail set by each school {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11891}. Impotence is established by the husband's admission, by his oath, or by evidence before the judge; the judge or his deputy takes the decision {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11887} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11888}. If the year ends without consummation, the wife chooses; the Hanafis hold the separation is an irrevocable divorce, the Shafi'is and Hanbalis hold it an annulment, and the Malikis draw distinctions {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11894}. The wife is due the full dower according to the Malikis and, in general, the Hanafis; she observes a waiting period, which the Hanafis, Hanbalis and Malikis hold as a precaution {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11900}."
