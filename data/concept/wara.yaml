label:
  ar: الورع
  en: Wara' (scrupulosity)
summary:
  ar: "الوقوف عند الشبهات واتقاؤها وترك ما يُريب إلى ما لا يُريب؛ يرد هذا المعنى في شرح ابن رجب لحديثين من الأربعين: حديث النعمان بن بشير «الحلال بين والحرام بين وبينهما أمور مشتبهات» وقوله «من اتقى الشبهات فقد استبرأ لدينه وعرضه»، وحديث الحسن بن علي «دع ما يريبك إلى ما لا يريبك» الذي يقول ابن رجب إن معناه يرجع إلى الوقوف عند الشبهات واتقائها، ويعضده في رواية ضعيفة عن واثلة بن الأسقع سؤال «فمن الورع؟ قال: الذي يقف عند الشبهة»، وفي رواية ضعيفة أخرى «إن المسلم الورع يدع الصغيرة مخافة الكبيرة» ووصف القلب بأنه يضطرب للحرام ويسكن للحلال؛ ومن أقوال السلف عند ابن مسعود «ما تريد إلى ما يريبك وحولك أربعة آلاف لا تريبك؟» وقول عمر «دعوا الربا والريبة» أي ما ارتبتم فيه وإن لم تتحققوا أنه رباً."
  en: "Stopping at doubtful matters, guarding against them, and leaving what causes unease for what does not; this meaning appears in Ibn Rajab's commentary on two of the Forty hadiths: al-Nu'man ibn Bashir's 'the lawful is clear and the unlawful is clear and between them are doubtful matters' with 'whoever guards against the doubtful has cleared his religion and honour', and al-Hasan ibn Ali's 'leave what makes you doubt for what does not', whose meaning Ibn Rajab says reduces to standing fast at the doubtful and avoiding it; it is supported by a weak report from Wathila ibn al-Asqa' in which, asked who is scrupulous, the Prophet answered 'the one who stops at the doubtful', and by another weak report that 'the scrupulous Muslim leaves the lesser sin for fear of the greater' and that the heart is agitated by the unlawful and rests in the lawful; among the sayings of the early generations he cites Ibn Masud's 'why turn to what troubles you when four thousand things around you do not?' and Umar's 'leave both usury and suspicion', meaning what you suspect to be usury even without certainty."
