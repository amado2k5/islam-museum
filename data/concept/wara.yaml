label:
  ar: الورع
  en: Wara' (scrupulosity)
summary:
  ar: 'الوقوف عند الشبهات واتقاؤها وترك ما يُريب إلى ما لا يُريب؛ يرد هذا المعنى في شرح ابن رجب لحديثين من الأربعين: حديث النعمان بن بشير «الحلال بين والحرام بين وبينهما أمور مشتبهات» وقوله «من اتقى الشبهات فقد استبرأ لدينه وعرضه»، وحديث الحسن بن علي «دع ما يريبك إلى ما لا يريبك» الذي يقول ابن رجب إن معناه يرجع إلى الوقوف عند الشبهات واتقائها، ويعضده في رواية ضعيفة عن واثلة بن الأسقع سؤال «فمن الورع؟ قال: الذي يقف عند الشبهة»، وفي رواية ضعيفة أخرى «إن المسلم الورع يدع الصغيرة مخافة الكبيرة» ووصف القلب بأنه يضطرب للحرام ويسكن للحلال؛ ومن أقوال السلف عند ابن مسعود «ما تريد إلى ما يريبك وحولك أربعة آلاف لا تريبك؟» وقول عمر «دعوا الربا والريبة» أي ما ارتبتم فيه وإن لم تتحققوا أنه رباً. في الفقه: الورع في اللغة الكف، وفي الاصطلاح عند ابن الهمام والنووي اجتناب الشبهات، وعند الدسوقي ترك بعض المباحات خوف الوقوع في الشبهات، وأدخل الغزالي وابن القيم فيه ترك المحرمات المعلوم تحريمها خوفاً من الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154} وفرّق الفقهاء بينه وبين التقوى والزهد والاحتياط: فالتقوى أعم، والاحتياط أعم من الورع، والزهد ترك ما زاد على الحاجة ويكون في القلب، والورع يكون في أفعال الجوارح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155} والورع مندوب إليه عند القرافي، ويكون عند اشتباه الحكم لخفاء الدليل أو تعارضه، أو عند الشك في وجود سبب التحريم، أو للخروج من خلاف العلماء بحسب الإمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17156} وأنكر ابن الشاط والشاطبي أن يكون الخروج من كل خلاف ورعاً، لأنه يؤدي إلى الحرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17158}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159} وذكر ابن تيمية ثلاثة مداخل للغلط في الورع: قصره على ترك الحرام دون أداء الواجب، واعتبار النفور الطبعي حكماً شرعياً، وترجيح جهة المفسدة وإهمال المصلحة الراجحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17160} ورتّب الغزالي درجات الورع أربعاً: ورع العدول، وورع الصالحين، وورع المتقين، وورع الصديقين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17161}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17162} ويقدّم الحنفية الأورع في إمامة الصلاة بعد الأعلم بأحكامها والأحسن تلاوة، وعند الشافعية قولان في تقديم الأورع على الأفقه، وعند الحنابلة يقدم الأورع بعد السلطان ورب البيت وإمام المسجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164} ويستحب في الولاة والمحتسب والمفتي أن يكونوا ظاهري الورع، وقدّم ابن تيمية في القضاء الأعلم الأورع الأكفأ بحسب ما يظهر فيه حكمه أو يدق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}'
  en: 'Stopping at doubtful matters, guarding against them, and leaving what causes unease for what does not; this meaning appears in Ibn Rajab''s commentary on two of the Forty hadiths: al-Nu''man ibn Bashir''s ''the lawful is clear and the unlawful is clear and between them are doubtful matters'' with ''whoever guards against the doubtful has cleared his religion and honour'', and al-Hasan ibn Ali''s ''leave what makes you doubt for what does not'', whose meaning Ibn Rajab says reduces to standing fast at the doubtful and avoiding it; it is supported by a weak report from Wathila ibn al-Asqa'' in which, asked who is scrupulous, the Prophet answered ''the one who stops at the doubtful'', and by another weak report that ''the scrupulous Muslim leaves the lesser sin for fear of the greater'' and that the heart is agitated by the unlawful and rests in the lawful; among the sayings of the early generations he cites Ibn Masud''s ''why turn to what troubles you when four thousand things around you do not?'' and Umar''s ''leave both usury and suspicion'', meaning what you suspect to be usury even without certainty. In fiqh: the lexical sense of wara'' is restraint. Ibn al-Humam and al-Nawawi define it as avoiding doubtful matters; al-Dusuqi as leaving some permitted things for fear of falling into doubt; al-Ghazali and Ibn al-Qayyim add leaving what is known to be forbidden, out of fear of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154} Jurists separate it from piety (taqwa), which is wider, from precaution (ihtiyat), which is wider still, and from asceticism (zuhd), which is about the heart rather than conduct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155} Al-Qarafi holds wara'' recommended; it applies where a ruling is unclear because the evidence is hidden or conflicting, where the cause of prohibition is doubtful, or, as far as possible, to leave a scholarly disagreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17156} Ibn al-Shatt and al-Shatibi deny that leaving every disagreement is wara'', since it would lead to hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17158}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159} Ibn Taymiyya lists three ways scrupulosity goes wrong: restricting it to avoiding the forbidden and neglecting duties, treating a natural distaste as a legal ruling, and weighing the harm of an act while ignoring a greater good it serves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17160} Al-Ghazali sets four grades: the wara'' of the upright, of the righteous, of the pious and of the truthful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17161}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17162} In leading prayer the Hanafis put the more scrupulous after the most learned in its rules and the best reciter; the Shafi''is have two views on placing him before the most learned in jurisprudence; the Hanbalis put him after the ruler, the householder and the regular imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164} Scrupulousness is recommended for rulers, judges and the market inspector; Ibn Taymiyya prefers, for judgeship, the most learned and most scrupulous, depending on whether the matter is plain or delicate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}'
