id: concept/wara
class: concept
kind: ethical
label:
  ar: الورع
  en: Wara' (scrupulosity)
  es: "Wara' (escrupulosidad)"
  fr: "Wara' (scrupulosité)"
  ur: "واڑہ ⁦(بدتمیزی)⁩"
  tr: "dindarlık"
  id: "kesalehan"
summary:
  ar: 'الوقوف عند الشبهات واتقاؤها وترك ما يُريب إلى ما لا يُريب؛ يرد هذا المعنى في شرح ابن رجب لحديثين من الأربعين: حديث النعمان بن بشير «الحلال بين والحرام بين وبينهما أمور مشتبهات» وقوله «من اتقى الشبهات فقد استبرأ لدينه وعرضه»، وحديث الحسن بن علي «دع ما يريبك إلى ما لا يريبك» الذي يقول ابن رجب إن معناه يرجع إلى الوقوف عند الشبهات واتقائها، ويعضده في رواية ضعيفة عن واثلة بن الأسقع سؤال «فمن الورع؟ قال: الذي يقف عند الشبهة»، وفي رواية ضعيفة أخرى «إن المسلم الورع يدع الصغيرة مخافة الكبيرة» ووصف القلب بأنه يضطرب للحرام ويسكن للحلال؛ ومن أقوال السلف عند ابن مسعود «ما تريد إلى ما يريبك وحولك أربعة آلاف لا تريبك؟» وقول عمر «دعوا الربا والريبة» أي ما ارتبتم فيه وإن لم تتحققوا أنه رباً. في الفقه: الورع في اللغة الكف، وفي الاصطلاح عند ابن الهمام والنووي اجتناب الشبهات، وعند الدسوقي ترك بعض المباحات خوف الوقوع في الشبهات، وأدخل الغزالي وابن القيم فيه ترك المحرمات المعلوم تحريمها خوفاً من الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154} وفرّق الفقهاء بينه وبين التقوى والزهد والاحتياط: فالتقوى أعم، والاحتياط أعم من الورع، والزهد ترك ما زاد على الحاجة ويكون في القلب، والورع يكون في أفعال الجوارح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155} والورع مندوب إليه عند القرافي، ويكون عند اشتباه الحكم لخفاء الدليل أو تعارضه، أو عند الشك في وجود سبب التحريم، أو للخروج من خلاف العلماء بحسب الإمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17156} وأنكر ابن الشاط والشاطبي أن يكون الخروج من كل خلاف ورعاً، لأنه يؤدي إلى الحرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17158}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159} وذكر ابن تيمية ثلاثة مداخل للغلط في الورع: قصره على ترك الحرام دون أداء الواجب، واعتبار النفور الطبعي حكماً شرعياً، وترجيح جهة المفسدة وإهمال المصلحة الراجحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17160} ورتّب الغزالي درجات الورع أربعاً: ورع العدول، وورع الصالحين، وورع المتقين، وورع الصديقين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17161}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17162} ويقدّم الحنفية الأورع في إمامة الصلاة بعد الأعلم بأحكامها والأحسن تلاوة، وعند الشافعية قولان في تقديم الأورع على الأفقه، وعند الحنابلة يقدم الأورع بعد السلطان ورب البيت وإمام المسجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164} ويستحب في الولاة والمحتسب والمفتي أن يكونوا ظاهري الورع، وقدّم ابن تيمية في القضاء الأعلم الأورع الأكفأ بحسب ما يظهر فيه حكمه أو يدق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}'
  en: 'Stopping at doubtful matters, guarding against them, and leaving what causes unease for what does not; this meaning appears in Ibn Rajab''s commentary on two of the Forty hadiths: al-Nu''man ibn Bashir''s ''the lawful is clear and the unlawful is clear and between them are doubtful matters'' with ''whoever guards against the doubtful has cleared his religion and honour'', and al-Hasan ibn Ali''s ''leave what makes you doubt for what does not'', whose meaning Ibn Rajab says reduces to standing fast at the doubtful and avoiding it; it is supported by a weak report from Wathila ibn al-Asqa'' in which, asked who is scrupulous, the Prophet answered ''the one who stops at the doubtful'', and by another weak report that ''the scrupulous Muslim leaves the lesser sin for fear of the greater'' and that the heart is agitated by the unlawful and rests in the lawful; among the sayings of the early generations he cites Ibn Masud''s ''why turn to what troubles you when four thousand things around you do not?'' and Umar''s ''leave both usury and suspicion'', meaning what you suspect to be usury even without certainty. In fiqh: the lexical sense of wara'' is restraint. Ibn al-Humam and al-Nawawi define it as avoiding doubtful matters; al-Dusuqi as leaving some permitted things for fear of falling into doubt; al-Ghazali and Ibn al-Qayyim add leaving what is known to be forbidden, out of fear of God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154} Jurists separate it from piety (taqwa), which is wider, from precaution (ihtiyat), which is wider still, and from asceticism (zuhd), which is about the heart rather than conduct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155} Al-Qarafi holds wara'' recommended; it applies where a ruling is unclear because the evidence is hidden or conflicting, where the cause of prohibition is doubtful, or, as far as possible, to leave a scholarly disagreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17156} Ibn al-Shatt and al-Shatibi deny that leaving every disagreement is wara'', since it would lead to hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17158}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159} Ibn Taymiyya lists three ways scrupulosity goes wrong: restricting it to avoiding the forbidden and neglecting duties, treating a natural distaste as a legal ruling, and weighing the harm of an act while ignoring a greater good it serves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17160} Al-Ghazali sets four grades: the wara'' of the upright, of the righteous, of the pious and of the truthful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17161}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17162} In leading prayer the Hanafis put the more scrupulous after the most learned in its rules and the best reciter; the Shafi''is have two views on placing him before the most learned in jurisprudence; the Hanbalis put him after the ruler, the householder and the regular imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164} Scrupulousness is recommended for rulers, judges and the market inspector; Ibn Taymiyya prefers, for judgeship, the most learned and most scrupulous, depending on whether the matter is plain or delicate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}'
  es: "Detenerse en asuntos dudosos, protegerse de ellos y dejar lo que causa inquietud por lo que no la causa; este significado aparece en el comentario de Ibn Rajab sobre dos de los Cuarenta hadices: el de al-Nu'man ibn Bashir, \"lo lícito es claro y lo ilícito es claro y entre ellos hay asuntos dudosos\", con \"quien se protege de lo dudoso ha purificado su religión y su honor\", y el de al-Hasan ibn Ali, \"deja lo que te hace dudar por lo que no\", cuyo significado, según Ibn Rajab, se reduce a mantenerse firme en lo dudoso y evitarlo; está respaldado por un informe débil de Wathila ibn al-Asqa' en el que, al preguntársele quién es escrupuloso, el Profeta respondió \"el que se detiene en lo dudoso\", y por otro informe débil que dice que \"el musulmán escrupuloso deja el pecado menor por temor al mayor\" y que el corazón se agita por lo ilícito y descansa en lo lícito; Entre los dichos de las primeras generaciones cita a Ibn Masud: \"¿Por qué recurrir a lo que te preocupa cuando cuatro mil cosas a tu alrededor no lo hacen?\" y a Umar: \"Deja tanto la usura como la sospecha\", refiriéndose a lo que sospechas que es usura incluso sin certeza. En fiqh: el sentido léxico de wara' es moderación. Ibn al-Humam y al-Nawawi la definen como evitar asuntos dudosos; al-Dusuqi como dejar algunas cosas permitidas por temor a caer en la duda; al-Ghazali e Ibn al-Qayyim añaden dejar lo que se sabe que está prohibido, por temor a Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154} Los juristas la separan de la piedad (taqwa), que es más amplia, de la precaución (ihtiyat), que es aún más amplia, y del ascetismo (zuhd), que se refiere al corazón más que a la conducta. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154}{cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155} Al-Qarafi mantiene recomendada la guerra; se aplica cuando una sentencia no es clara porque la evidencia está oculta o es contradictoria, cuando la causa de la prohibición es dudosa o, en la medida de lo posible, para dejar un desacuerdo académico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17156} Ibn al-Shatt y al-Shatibi niegan que abandonar todo desacuerdo sea wara', ya que conduciría a dificultades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17158}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159} Ibn Taymiyya enumera tres maneras en que la escrupulosidad se equivoca: restringirla a evitar lo prohibido y descuidar los deberes, tratar una aversión natural como una norma legal y sopesar el daño de un acto ignorando un bien mayor que sirve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17160} Al-Ghazali establece cuatro grados: el wara' de los rectos, de los justos, de los piadosos y de los veraces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17161}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17162} Al dirigir la oración, los hanafíes colocan al más escrupuloso después del más versado en sus reglas y el mejor recitador; los shafi'ís tienen dos puntos de vista sobre colocarlo antes del más versado en jurisprudencia; los hanbalíes lo colocan después del gobernante, el cabeza de familia y el imán regular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164} Se recomienda la escrupulosidad para los gobernantes, los jueces y el inspector del mercado; Ibn Taymiyya prefiere, para el cargo de juez, al más erudito y escrupuloso, dependiendo de si el asunto es sencillo o delicado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}"
  fr: "S’arrêter sur les points douteux, s’en prémunir et laisser ce qui cause le trouble pour ce qui n’en cause pas; cette signification apparaît dans le commentaire d’Ibn Rajab sur deux des Quarante hadiths: celui d’al-Nu’man ibn Bashir: « Le licite est clair et l’illicite est clair, et entre les deux se trouvent les points douteux », avec la précision: « Quiconque se prémunit contre le doute a purifié sa religion et son honneur », et celui d’al-Hasan ibn Ali: « Laissez ce qui vous fait douter pour ce qui ne vous fait pas douter », dont Ibn Rajab dit que le sens se réduit à rester ferme face au doute et à l’éviter; cela est soutenu par un récit faible de Wathila ibn al-Asqa’ dans lequel, interrogé sur qui est scrupuleux, le Prophète a répondu: « Celui qui s’arrête sur le doute », et par un autre récit faible selon lequel « le musulman scrupuleux abandonne le moindre péché par crainte du plus grand » et que le cœur est agité par l’illicite et se repose sur le licite; Parmi les paroles des générations anciennes, il cite Ibn Mas'ud: « Pourquoi s'intéresser à ce qui vous trouble alors que quatre mille choses autour de vous ne le font pas ? » et Umar: « Abandonnez l'usure et le soupçon », c'est-à-dire ce que vous soupçonnez d'être de l'usure, même sans certitude. En fiqh, le sens lexical de wara' est la retenue. Ibn al-Humam et al-Nawawi la définissent comme le fait d'éviter les choses douteuses; al-Dusuqi comme le fait de s'abstenir de certaines choses permises par crainte du doute; al-Ghazali et Ibn al-Qayyim ajoutent le fait de s'abstenir de ce qui est connu comme étant interdit, par crainte de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154} Les juristes la distinguent de la piété (taqwa), qui est plus large, de la précaution (ihtiyat), qui est encore plus large, et de l'ascétisme (zuhd), qui concerne le cœur plutôt que la conduite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155} Al-Qarafi détient le wara' recommandé; elle s'applique lorsqu'une décision n'est pas claire parce que les preuves sont cachées ou contradictoires, lorsque la cause de l'interdiction est douteuse ou, dans la mesure du possible, pour laisser un désaccord entre chercheurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17156} Ibn al-Shatt et al-Shatibi nient que quitter tout désaccord est une guerre, car cela conduirait à des difficultés. Ibn Taymiyya recense trois écueils dans la scrupulosité: la restreindre à l’évitement de l’interdit et à la négligence des devoirs, considérer une aversion naturelle comme une règle juridique, et évaluer la gravité d’un acte en ignorant le bien supérieur qu’il sert. Al-Ghazali distingue quatre degrés de scrupulosité: celle du droit, celle du vertueux, celle du pieux et celle du véridique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17161}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17162} Pour la direction de la prière, les Hanafites placent le plus scrupuleux après le plus érudit en matière de règles et le meilleur récitant; les Shafi'ites ont deux avis quant à son placement avant le plus érudit en jurisprudence; les Hanbalites le placent après le souverain, le chef de famille et l'imam titulaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164} La scrupulosité est recommandée pour les souverains, les juges et l'inspecteur du marché; Ibn Taymiyya préfère, pour la magistrature, le plus érudit et le plus scrupuleux, selon que l'affaire soit simple ou délicate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}"
  ur: "مشتبہ امور سے رک جانا، ان سے بچنا، اور جو چیز نہیں ہے اس کے لیے پریشانی کا باعث بننا چھوڑنا؛ ابن رجب کی چالیس احادیث میں سے دو کی تفسیر میں یہ معنی ظاہر ہوتا ہے: نعمان بن بشیر کی 'حلال واضح اور حرام واضح اور ان کے درمیان مشتبہ معاملات ہیں' کے ساتھ 'جس نے مشتبہ سے حفاظت کی اس نے اپنے دین اور عزت کو صاف کر دیا'، اور حسن بن علی کا 'رجب' کا مطلب ہے کہ جس چیز کے لیے میں شک کو کم نہیں کرتا، اس کا مطلب یہ ہے کہ جس چیز کی اجازت نہیں ہے وہ اس کے لیے راجع ہے۔ مشتبہ پر تیزی سے کھڑے ہونا اور اس سے اجتناب کرنا؛ اس کی تائید وثیلہ بن اسقع کی ایک ضعیف روایت سے ہوتی ہے جس میں پوچھا گیا کہ بدکردار کون ہے تو نبی نے جواب دیا 'وہ جو شک کرنے والے پر رک جاتا ہے' اور ایک اور ضعیف روایت سے کہ 'بے ایمان مسلمان بڑے کے خوف سے چھوٹے گناہ کو چھوڑ دیتا ہے' اور یہ کہ دل حرام سے مشتعل ہوتا ہے اور حلال میں رہتا ہے۔ ابتدائی نسلوں کے اقوال میں سے اس نے ابن مسعود کے اقوال کا حوالہ دیا کہ 'جب آپ کے ارد گرد چار ہزار چیزیں نہیں ہیں تو آپ کو کس چیز کی طرف متوجہ ہوں؟' اور عمر کا 'سود اور شبہ دونوں کو چھوڑ دو'، یعنی جس چیز پر آپ کو یقین کے بغیر بھی سود کا شبہ ہے۔ فقہ میں: وار کا لغوی معنی تحمل ہے۔ ابن الحمام اور النووی نے اس کی تعریف مشتبہ امور سے اجتناب کے طور پر کی ہے۔ الدسوقی شک میں پڑنے کے خوف سے کچھ جائز چیزوں کو چھوڑنا۔ الغزالی اور ابن القیم نے خدا کے خوف کی وجہ سے حرام ہونے والی چیزوں کو چھوڑنے کا اضافہ کیا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17154} فقہاء اسے تقویٰ ⁦(تقویٰ)⁩ سے جو وسیع ہے، احتیاط ⁦(احتیاط)⁩ سے جو اب بھی وسیع ہے اور زہد ⁦(زہد)⁩ سے الگ کرتے ہیں جو اخلاق کے بجائے دل کے متعلق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17154}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17155} القرافی نے وار' کی سفارش کی ہے۔ یہ وہاں لاگو ہوتا ہے جہاں کوئی حکم واضح نہ ہو کیونکہ ثبوت پوشیدہ یا متضاد ہے، جہاں ممانعت کی وجہ مشکوک ہو، یا جہاں تک ممکن ہو، علمی اختلاف کو چھوڑنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17155}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17156} ابن الشاط اور الشاطبی نے اس بات کی تردید کی ہے کہ ہر اختلاف کو چھوڑنا وراثت کا باعث ہے، کیونکہ یہ مشقت کا باعث ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17158}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159} ابن تیمیہ نے تین طریقوں کی فہرست دی ہے جو بدگمانی کے غلط ہو جاتے ہیں: اسے حرام سے بچنے تک محدود رکھنا اور شرعی طور پر ناجائز سلوک کرنا کسی ایکٹ کے نقصان کو تولنا جبکہ اس سے بڑی بھلائی کو نظر انداز کرنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17159}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17160} الغزالی نے چار درجات متعین کیے ہیں: راستبازوں کا، صالح کا، متقی کا اور سچوں کا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17161}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17162} امامت کی نماز میں احناف اس کے قواعد میں سب سے زیادہ علم رکھنے والے اور بہترین قاری کے بعد زیادہ احتیاط کرتے ہیں۔ اسے فقہ کے سب سے زیادہ عالم کے سامنے رکھنے کے بارے میں شافعیوں کے دو نظریات ہیں۔ حنبلیوں نے اسے حاکم، گھر والے اور باقاعدہ امام کے بعد رکھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164} حکمرانوں، ججوں اور مارکیٹ انسپکٹر کے لیے بے احتیاطی کی سفارش کی جاتی ہے۔ ابن تیمیہ فیصلہ کرنے کے لیے سب سے زیادہ علم والے اور سب سے زیادہ محتاط کو ترجیح دیتے ہیں، اس بات پر منحصر ہے کہ معاملہ سادہ ہے یا نازک۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17164}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17165}"
  tr: "Şüpheli konularda durmak, onlardan kaçınmak ve şüpheli olanı şüphe götürmeyen şeylere bırakmak; bu anlam, İbn Receb'in Kırk Hadis'ten ikisinin açıklamasında geçmektedir: Nu'man ibn Beşir'in hadisi, \"Helal apaçıktır, haram apaçıktır ve bunların arasında şüpheli konular vardır\" ve onun sözü, \"Şüpheli konulardan kaçınan, dinini ve şerefini korumuştur\" ve Hasan ibn Ali'nin hadisi, \"Şüpheye düşüren şeyleri şüpheye düşürmeyen şeylere bırak\", İbn Receb bunun da şüpheli konularda durmak ve onlardan kaçınmak anlamına geldiğini söyler. Bu, Vatila ibn el-Eska'dan gelen zayıf bir rivayetle de desteklenmektedir; kendisine \"Takva sahibi kimdir?\" diye sorulduğunda, \"Şüpheli olandan kaçınandır\" demiştir. Başka bir zayıf rivayette ise, \"Takva sahibi Müslüman, büyükten korkarak küçüğü bırakır\" denilmiş ve kalbin haram olandan dolayı huzursuz, helal olandan dolayı ise sakin olduğu belirtilmiştir. İbn Mes'ud'a göre Selef'in sözlerinden biri de şudur: \"Çevrenizde sizi şüpheye düşürmeyen dört bin kişi varken, sizi şüpheye düşüren bir şeyi neden istiyorsunuz?\" Ömer'in sözü ise şudur: \"Faiz ve şüpheyi bırakın,\" yani faiz olduğundan emin olmasanız bile şüphe ettiğiniz şeyden uzak durun. İslam hukukunda (fıkıhta) takva (wara') kelimenin tam anlamıyla kısıtlama anlamına gelir. İbn el-Hümme ve el-Nevevi'ye göre İslam hukuk terminolojisinde şüpheli konulardan kaçınmak anlamına gelir. El-Dasuki ise bunu, şüpheli konulara düşme korkusuyla bazı helal şeylerden uzak durmak olarak tanımlamıştır. El-Gazali ve İbn el-Kayyim ise buna, Allah korkusuyla bilinen yasaklardan uzak durmayı da dahil etmişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17154} Fıkıhçılar takva, zühd ve ihtiyat arasında ayrım yapmışlardır: takva daha geniş kapsamlıdır, ihtiyat takvadan daha geniş kapsamlıdır, zühd gerekli olandan fazlasından kaçınmaktır ve kalple ilgili bir meseledir, takva ise bedenlerin hareketlerinde kendini gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17154}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17155} Al-Qarafi'ye göre takva tavsiye edilir ve bu, hükmün delillerin gizlenmesi veya çelişkisi nedeniyle şüpheye düştüğü durumlarda, veya yasağın sebebinin varlığı konusunda şüphe olduğunda, veya âlimler arasında mümkün olduğunca ihtilaftan kaçınmak için yapılır. İbn el-Şat ve el-Şatibi, her türlü ihtilaftan vazgeçmenin dindarlık olmadığını, çünkü bunun utanç verici durumlara yol açtığını belirtmişlerdir. İbn Taymiyyah, dindarlıkta hata yapmanın üç yaklaşımını şöyle sıralamıştır: haram olanı terk edip farz olan görevi yerine getirmemekle sınırlamak, doğal nefreti hukuki bir hüküm olarak kabul etmek, yozlaşmışların tarafını tutmak ve daha büyük menfaati göz ardı etmek. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17160} Gazali, takva derecelerini dört kategoriye ayırmıştır: adaletli takva, salih takva, dindar takva ve doğru takva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17161}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17162} Hanefiler, namazı kıldırmada, hükümlerini en iyi bilen ve Kur'an okumada en iyi olan kişiden sonra, en takva sahibine öncelik verirler. Şafiîler, en dindar olana en bilge olandan önce öncelik verme konusunda iki görüşe sahiptir; Hanbelilere göre ise en dindar olan, Sultan, hanedan reisi ve imamdan sonra gelir. Cami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17164} Valilerin, muhtasiblerin ve müftünün dış görünüş olarak dindar olmaları arzu edilir ve İbn Taymiyyah, yargıda, hükmünün açık veya doğru olduğuna göre en bilgili, en dindar ve en yetkin kişiyi sunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17164}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17165}"
  id: "Berhenti pada perkara-perkara yang meragukan dan menghindarinya, serta meninggalkan apa yang meragukan untuk apa yang tidak meragukan; makna ini disebutkan dalam penjelasan Ibnu Rajab tentang dua dari Empat Puluh Hadits: hadits Nu'man ibn Bashir, \"Yang halal itu jelas dan yang haram itu jelas, dan di antara keduanya terdapat perkara-perkara yang meragukan,\" dan sabdanya, \"Barangsiapa menghindari perkara-perkara yang meragukan, maka ia telah melindungi agamanya dan kehormatannya,\" dan hadits al-Hasan ibn Ali, \"Tinggalkanlah apa yang membuatmu ragu untuk apa yang tidak membuatmu ragu,\" yang menurut Ibnu Rajab berarti bahwa hal itu kembali pada berhenti pada perkara-perkara yang meragukan dan menghindarinya. Hal ini didukung oleh sebuah riwayat lemah dari Wathila ibn al-Asqa', yang ditanya, \"Siapakah orang yang bertakwa?\" Beliau menjawab, \"Orang yang berhenti pada apa yang meragukan.\" Dan dalam riwayat lemah lainnya, \"Muslim yang bertakwa meninggalkan yang kecil karena takut akan yang besar,\" dan beliau menggambarkan hati yang gelisah karena apa yang haram dan tenang karena apa yang halal. Dan di antara ucapan para Salaf, menurut Ibnu Mas'ud, adalah, \"Mengapa kamu menginginkan sesuatu yang membuatmu ragu, padahal ada empat ribu orang di sekitarmu yang tidak membuatmu ragu?\" Dan ucapan Umar, \"Tinggalkan riba dan keraguan,\" yang berarti apa yang kamu ragukan, meskipun kamu tidak yakin bahwa itu adalah riba. Dalam yurisprudensi Islam (fiqh), ketakwaan (wara') secara harfiah berarti pengendalian diri. Dalam terminologi hukum Islam, menurut Ibnu al-Humam dan al-Nawawi, itu berarti menghindari hal-hal yang meragukan. Al-Dasuqi mendefinisikannya sebagai menjauhi beberapa hal yang diperbolehkan karena takut terjerumus ke dalam hal-hal yang meragukan. Al-Ghazali dan Ibnu al-Qayyim memasukkannya sebagai menjauhi larangan yang diketahui karena takut kepada Allah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154} Para ahli fiqih membedakan antara ketakwaan dan ketakwaan (taqwa), kezuhud, dan kehati-hatian (ihtiyat): ketakwaan lebih luas, kehati-hatian lebih luas daripada ketakwaan, kezuhud adalah menjauhi lebih dari yang diperlukan dan merupakan urusan hati, sedangkan ketakwaan diwujudkan dalam tindakan anggota tubuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17154}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155} Ketakwaan dianjurkan menurut Al-Qarafi, dan dilakukan ketika hukum diragukan karena adanya penyembunyian atau kontradiksi bukti, atau ketika ada keraguan tentang keberadaan alasan larangan, atau untuk menghindari perselisihan di antara para ulama sebisa mungkin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17155}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17156} Ibn al-Shat dan al-Shatibi menyangkal bahwa meninggalkan setiap perselisihan adalah perbuatan saleh, karena hal itu menyebabkan rasa malu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17158}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159} Ibn Taymiyyah menyebutkan tiga pendekatan terhadap kesalahan dalam kesalehan: membatasinya pada meninggalkan apa yang dilarang tanpa melaksanakan kewajiban yang wajib, menganggap rasa jijik alami sebagai hukum yang sah, memihak pihak yang korup, dan mengabaikan kepentingan yang lebih besar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17159}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17160} Al-Ghazali mengelompokkan tingkatan ketakwaan menjadi empat: ketakwaan orang yang adil, ketakwaan orang yang benar, ketakwaan orang yang saleh, dan ketakwaan orang yang jujur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17161}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17162} Mazhab Hanafi mendahulukan orang yang paling saleh dalam memimpin salat setelah orang yang paling berpengetahuan tentang hukum-hukumnya dan yang paling baik dalam membaca Al-Quran. Mazhab Syafi'i memiliki dua pendapat dalam mendahulukan orang yang paling saleh daripada orang yang paling bijaksana, dan menurut mazhab Hanbali, orang yang paling saleh didahulukan setelah Sultan, kepala keluarga, dan imam. Masjid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17163}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164} Dianjurkan bagi gubernur, muhtasib, dan mufti untuk memiliki kesalehan lahiriah, dan Ibnu Taymiyyah menampilkan dalam bidang peradilan orang yang paling berilmu, paling saleh, paling kompeten, sesuai dengan apa yang terbukti atau akurat dalam keputusannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17164}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17165}"
