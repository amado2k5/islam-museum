id: concept/mann-and-adha
class: concept
kind: belief
label: { ar: "المنّ والأذى في الصدقة", en: "Reminder and harm after giving (mann and adha)", ur: "احسان جتانا اور ایذا دینا", es: "Recordatorio y daño después de dar (mann y adha)", fr: "Rappel et préjudice après avoir donné (mann et adha)", tr: "Manna ve hayır işlerinde zarar", id: "Manna dan bahaya dalam amal" }
summary:
  ar: "يرى الشعراوي أن المنّ والأذى يبطلان الصدقة ويفسدان أثرها في الفقير، وأن المنّ يمتد إلى ما بعد العطاء بزمن، وأن القول المعروف والمغفرة خير من صدقة يتبعها أذى {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1154}."
  en: "Sha'rawi holds that reminding and harming after giving nullify charity and spoil its effect on the poor, that reminding may continue long after the gift, and that a kind word and forgiveness are better than charity followed by harm {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1154}."
  ur: "شعراوی کے نزدیک احسان جتانا اور ایذا دینا صدقے کو باطل کر دیتے ہیں اور فقیر پر اس کا اثر خراب کر دیتے ہیں، احسان جتانا عطا کے بعد بھی دیر تک جاری رہ سکتا ہے، اور نرمی سے بات اور درگزر اس صدقے سے بہتر ہے جس کے بعد ایذا ہو {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1154}۔"
  es: "Sha'rawi sostiene que recordar y dañar después de dar anula la caridad y estropea su efecto en los pobres, que recordar puede continuar mucho después del regalo, y que una palabra amable y el perdón son mejores que la caridad seguida de daño {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1154}."
  fr: "Sha'rawi soutient que rappeler et nuire après avoir donné annulent la charité et gâchent son effet sur les pauvres, que le rappel peut continuer longtemps après le don, et qu'une parole aimable et le pardon sont meilleurs que la charité suivie de mal {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1154}."
  tr: "Al-Shaarawi, hayırseverlik ve zararın hayırseverliği geçersiz kıldığına ve yoksullar üzerindeki etkisini bozduğuna, hayırseverliğin sadece vermekle sınırlı olmadığına, iyi sözler ve affetmenin, ardından gelen zarardan daha iyi olduğuna inanır {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1148} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1149} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1154}."
  id: "Al-Shaarawi percaya bahwa kasih dan bahaya membatalkan amal dan merusak dampaknya pada orang miskin, dan bahwa kasih melampaui sekadar memberi, dan bahwa kata-kata baik dan pengampunan lebih baik daripada sekadar amal diikuti oleh bahaya {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1154}."
