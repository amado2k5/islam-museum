id: concept/mann-and-adha
class: concept
kind: belief
label: { ar: "المنّ والأذى في الصدقة", en: "Reminder and harm after giving (mann and adha)", ur: "احسان جتانا اور ایذا دینا" }
summary:
  ar: "يرى الشعراوي أن المنّ والأذى يبطلان الصدقة ويفسدان أثرها في الفقير، وأن المنّ يمتد إلى ما بعد العطاء بزمن، وأن القول المعروف والمغفرة خير من صدقة يتبعها أذى {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1154}."
  en: "Sha'rawi holds that reminding and harming after giving nullify charity and spoil its effect on the poor, that reminding may continue long after the gift, and that a kind word and forgiveness are better than charity followed by harm {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1154}."
  ur: "شعراوی کے نزدیک احسان جتانا اور ایذا دینا صدقے کو باطل کر دیتے ہیں اور فقیر پر اس کا اثر خراب کر دیتے ہیں، احسان جتانا عطا کے بعد بھی دیر تک جاری رہ سکتا ہے، اور نرمی سے بات اور درگزر اس صدقے سے بہتر ہے جس کے بعد ایذا ہو {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1148} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1149} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1154}۔"
