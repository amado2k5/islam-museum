summary:
  ar: "الحلبة في آخر الأولى يابسة، قوّتها منضجة مليّنة، وفيها حرارة مع لزوجة تمنع غلبة أذاها؛ دقيقها ينضج الأورام البلغمية والصلبة، وطبيخها ينفع السعال والربو والصدر والحلق، ويُذكر أنها تزيد الباه، وطبيخها بالخلّ لضعف المعدة، ونفعها في العين والصدر والرحم والقولنج، وفي الرحم منها مُعلَّمات."
  en: "Halba is dry at the end of the first degree. Its strength ripens and softens; it has warmth with stickiness that keeps its harm from prevailing. Its flour ripens phlegmy and hard swellings; its decoction helps cough, asthma and the chest and throat, and it is said to increase sexual power. Its decoction in vinegar suits weak stomach; it helps the eye, the chest, the bowels, and the womb, with a labelled womb listing."
  ur: "حلبہ پہلے درجے کے آخر میں خشک ہے، اس کی قوت پکانے اور نرم کرنے والی ہے؛ اس میں گرمی کے ساتھ لیس داری ہے جو اس کے نقصان کو غالب آنے سے روکتی ہے۔ اس کا آٹا بلغمی اور سخت سوجن پکاتا ہے؛ اس کا جوشاندہ کھانسی، دمہ، سینے اور حلق کو فائدہ دیتا اور کہا گیا ہے کہ جنسی قوت بڑھاتا ہے۔ سرکے میں ابالا ہوا کمزور معدے کے موافق ہے؛ آنکھ، سینے، آنتوں اور رحم میں نفع دیتا ہے، اور رحم کے بارے میں ایک مُعلَّم فہرست ہے۔"
  es: "Halba es seco al final del primer grado. Su fuerza madura y se suaviza; posee una calidez pegajosa que evita que prevalezca su daño. Su harina alivia las flemas y las hinchazones duras; su decocción ayuda con la tos, el asma y el pecho y la garganta, y se dice que aumenta la potencia sexual. Su decocción en vinagre es adecuada para estómagos débiles; beneficia los ojos, el pecho, los intestinos y el útero, con una mención específica para el útero."
  fr: "Halba est sèche à la fin du premier degré. Sa force s'affine et s'adoucit; sa chaleur et sa texture onctueuse empêchent ses effets néfastes de prévaloir. Sa farine dissout les mucosités et les gonflements indurés; sa décoction soulage la toux, l'asthme et les affections de la poitrine et de la gorge, et on dit qu'elle accroît la vigueur sexuelle. Sa décoction dans du vinaigre est bénéfique pour les estomacs fragiles; elle est utile pour les yeux, la poitrine, les intestins et l'utérus, ce dernier étant particulièrement recommandé."
