  fr: "Tashbih (comparaison dans le discours juridique: zihar, calomnie, abus)"
summary:
  ar: "حكم التشبيه يختلف بحسب موضعه. فتشبيه الزوجة أو جزء شائع منها بمحرم عليه تأبيداً ظهار، وهو حرام بالنص، ويحرم وطؤها قبل التكفير بالاتفاق، ويحرم التلذذ بما دون الجماع عند الجمهور. وفي القذف، إذا صرّح القاذف بالزنى فهو قذف موجب للحد، وإذا عرّض فمالك يعدّه قذفاً، وأبو حنيفة والشافعي لا يعدّانه قذفاً إلا بقصد القذف. ولا يجوز تشبيه المسلم أخاه بما يكرهه، ويعزَّر من سبّ بألفاظ مؤذية، ويعزّر عند الجمهور من شبّه غيره بالحيوانات الدنيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5185}"
  en: "The ruling on tashbih depends on where it is used. Likening one's wife, or a common part of her, to a woman forbidden to him for ever is zihar: forbidden by the text, with intercourse forbidden before expiation by consensus and, for most jurists, any sensual contact short of intercourse. In slander, an explicit accusation of adultery is slander that carries the hadd penalty; an allusive one is slander for Malik, but not for Abu Hanifa and al-Shafii unless the slanderer meant slander. It is not lawful to liken a fellow Muslim to something he dislikes; the abuser is punished with ta'zir, and most jurists punish likening a person to base animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5185}"
  es: "La norma sobre tashbih depende del contexto. Comparar a la esposa, o una parte común de ella, con una mujer prohibida para siempre es zihar: prohibido por el texto, con la prohibición de la relación sexual antes de la expiación por consenso y, para la mayoría de los juristas, cualquier contacto sensual que no sea la relación sexual. En la calumnia, una acusación explícita de adulterio es calumnia que conlleva la pena hadd; una alusiva es calumnia para Malik, pero no para Abu Hanifa y al-Shafii, a menos que el calumniador tuviera la intención de calumniar. No es lícito comparar a un compañero musulmán con algo que le desagrada; el agresor es castigado con ta'zir, y la mayoría de los juristas castigan la comparación de una persona con animales viles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5185}"
  fr: "La règle concernant le tashbih dépend du contexte. Comparer sa femme, ou une partie de son corps, à une femme interdite à jamais constitue un zihar: interdit par le texte, les rapports sexuels étant prohibés avant expiation par consensus et, pour la plupart des juristes, tout contact sensuel autre que la pénétration étant prohibé. En matière de calomnie, une accusation explicite d’adultère est passible de la peine de hadd; une accusation allusive est également calomnieuse selon Malik, mais pas selon Abu Hanifa et al-Shafi’i, sauf si le calomniateur avait l’intention de diffamer. Il est interdit de comparer un autre musulman à quelque chose qu’il n’aime pas; l’auteur de cette insulte est puni de ta’zir, et la plupart des juristes punissent la comparaison d’une personne à des animaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5185}"
