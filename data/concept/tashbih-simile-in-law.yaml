label:
  ar: "التشبيه"
  en: "Tashbih (comparison in legal speech: zihar, slander, abuse)"
  ur: "تشبیہ (فقہی کلام میں تشبیہ: ظہار، قذف، سب)"
summary:
  ar: "حكم التشبيه يختلف بحسب موضعه. فتشبيه الزوجة أو جزء شائع منها بمحرم عليه تأبيداً ظهار، وهو حرام بالنص، ويحرم وطؤها قبل التكفير بالاتفاق، ويحرم التلذذ بما دون الجماع عند الجمهور. وفي القذف، إذا صرّح القاذف بالزنى فهو قذف موجب للحد، وإذا عرّض فمالك يعدّه قذفاً، وأبو حنيفة والشافعي لا يعدّانه قذفاً إلا بقصد القذف. ولا يجوز تشبيه المسلم أخاه بما يكرهه، ويعزَّر من سبّ بألفاظ مؤذية، ويعزّر عند الجمهور من شبّه غيره بالحيوانات الدنيئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5185}"
  en: "The ruling on tashbih depends on where it is used. Likening one's wife, or a common part of her, to a woman forbidden to him for ever is zihar: forbidden by the text, with intercourse forbidden before expiation by consensus and, for most jurists, any sensual contact short of intercourse. In slander, an explicit accusation of adultery is slander that carries the hadd penalty; an allusive one is slander for Malik, but not for Abu Hanifa and al-Shafii unless the slanderer meant slander. It is not lawful to liken a fellow Muslim to something he dislikes; the abuser is punished with ta'zir, and most jurists punish likening a person to base animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5184} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5185}"
