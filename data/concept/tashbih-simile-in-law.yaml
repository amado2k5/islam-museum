label:
  ar: "التشبيه"
  en: "Tashbih (comparison in legal speech: zihar, slander, abuse)"
  ur: "تشبیہ ⁦(فقہی کلام میں تشبیہ: ظہار، قذف، سب)⁩"
  es: "Tashbih (comparación en el discurso legal: zihar, calumnia, abuso)"
  fr: "Tashbih (comparaison dans le discours juridique: zihar, calomnie, abus)"
