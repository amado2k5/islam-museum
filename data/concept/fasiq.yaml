summary:
  ar: "الفاسق في الفقه والمصطلح الشرعي الخارج عن الطاعة بكبيرة أو بإصرار؛ تعالج الموسوعة الفقهية الكويتية الفسق في أبواب الشهادة والإمامة والحجر {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Fasiq in fiqh is one who departs from obedience through a grave sin or persistence in sin; the Kuwaiti Fiqh Encyclopedia treats fisq in the chapters on testimony, leading prayer and interdiction {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Fasiq en fiqh es aquel que se aparta de la obediencia por un pecado grave o por persistencia en el pecado; la Enciclopedia de Fiqh de Kuwait trata el fisq en los capítulos sobre testimonio, dirección de la oración e interdicción {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "En matière de fiqh, le terme « fasiq » désigne celui qui s’écarte de l’obéissance par un péché grave ou par la persistance dans le péché; l’Encyclopédie koweïtienne de fiqh traite du terme « fisq » dans les chapitres sur le témoignage, la direction de la prière et l’interdiction {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "فقہ میں فاسق وہ ہے جو کبیرہ گناہ یا گناہ پر استقامت کے ذریعے اطاعت سے الگ ہو جائے؛ کویتی فقہ انسائیکلو پیڈیا فسق کو گواہی، امامت کی نماز اور پابندی کے ابواب میں پیش کرتا ہے"
  tr: "Hukukta yozlaşmış ve hukuki terminolojide büyük bir eylem veya ısrarla itaatten sapan kişiler; Kuveyt Fıkıh Ansiklopedisi, tanıklık, imamat ve hapis bölümlerinde ahlaksızlığı ele alır {atıf:fiqh-mawsua-kuwaitiyya-noor-v3}."
  id: "Orang korup dalam hukum dan terminologi hukum yang menyimpang dari ketaatan karena tindakan besar atau ketekunan; Ensiklopedia Yurisprudensial Kuwait membahas ketidakmoralan dalam bab kesaksian, imamat, dan penahanan {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
