label: { ar: "هَتْماء", en: "Hatma' (a sacrificial animal with its front teeth gone: its fitness)", es: "Hatma' (un animal de sacrificio al que le faltan los dientes delanteros: su aptitud)", fr: "Hatma' (un animal sacrificiel dont on a enlevé les dents de devant: son état physique)" }
summary:
  ar: "الهتماء في اللغة التي ذهبت ثناياها من أصلها وانقلعت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} واختلف الفقهاء في إجزائها في الأضحية: فالحنفية في الصحيح يجيزون الهتماء إن كانت ترعى وتعلف، والمالكية يرون فقد السن الواحدة لا يضر، والشافعية يرجحون المنع، والحنابلة لا يجزئون الهتماء التي ذهبت ثناياها، فإن بقي من الثنايا بقية أجزأت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809}"
  en: "Hatma', in the lexical sense, is an animal whose front teeth have fallen out from the root. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} The jurists differ on whether it is fit for sacrifice: the Hanafis in the sounder view allow it if it grazes and feeds; the Malikis hold that losing one tooth does not harm; the Shafi'is mostly forbid it; the Hanbalis forbid one whose front teeth are gone, and allow it if some remain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809}"
  es: "Hatma', en sentido léxico, es un animal cuyos dientes frontales se han caído de raíz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} Los juristas difieren sobre si es apto para el sacrificio: los hanafíes, en la opinión más sólida, lo permiten si pasta y se alimenta; los malikíes sostienen que perder un diente no causa daño; los shafiíes, en su mayoría, lo prohíben; los hanbalíes prohíben el sacrificio de un animal cuyos dientes frontales han desaparecido, y lo permiten si aún conserva algunos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809}"
  fr: "Le terme « hatma' », au sens littéral, désigne un animal dont les incisives sont tombées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} Les juristes divergent quant à son aptitude au sacrifice: les hanafites, de l’avis le plus solide, l’autorisent s’il broute et se nourrit; les malikites estiment que la perte d’une seule dent n’est pas préjudiciable; les chaféites l’interdisent généralement; les hanbalites interdisent le sacrifice d’un animal édenté et l’autorisent s’il lui en reste quelques-unes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809}"
