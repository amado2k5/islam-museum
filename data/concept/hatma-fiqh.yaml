label: { ar: "هَتْماء", en: "Hatma' (a sacrificial animal with its front teeth gone: its fitness)" }
summary:
  ar: "الهتماء في اللغة التي ذهبت ثناياها من أصلها وانقلعت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} واختلف الفقهاء في إجزائها في الأضحية: فالحنفية في الصحيح يجيزون الهتماء إن كانت ترعى وتعلف، والمالكية يرون فقد السن الواحدة لا يضر، والشافعية يرجحون المنع، والحنابلة لا يجزئون الهتماء التي ذهبت ثناياها، فإن بقي من الثنايا بقية أجزأت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809}"
  en: "Hatma', in the lexical sense, is an animal whose front teeth have fallen out from the root. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} The jurists differ on whether it is fit for sacrifice: the Hanafis in the sounder view allow it if it grazes and feeds; the Malikis hold that losing one tooth does not harm; the Shafi'is mostly forbid it; the Hanbalis forbid one whose front teeth are gone, and allow it if some remain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16809}"
