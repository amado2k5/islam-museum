label:
  ar: "أخبار سماع القرآن في سيرة ابن هشام"
  en: "Accounts of hearing the Qur'an in Ibn Hisham's Sira"
  ur: "سیرت ابن ہشام میں قرآن سننے کے بیانات"
  fr: "Récits d'écoute du Coran dans la Sira d'Ibn Hisham"
  es: "Relatos de la audición del Corán en la Sira de Ibn Hisham"
  tr: "İbn Hişam'ın Biyografisinde Kur'an Dinleme Haberleri"
  id: "Mendengarkan Berita Al-Qur'an dalam Biografi Ibn Hisham"
summary:
  ar: "خمسة أخبار في سيرة ابن هشام عن أثر سماع القرآن في أهل الفصاحة: الوليد بن المغيرة يرفض أن يسميه شعراً أو سحراً أو جنوناً أو كهانة، وعتبة بن ربيعة يعود من عنده، والثلاثة الذين استمعوا ليلاً، وإسلام عمر على صحيفة فيها طه، وإسلام الطفيل بن عمرو. ثم ما رُوي عن لبيد وتركه الشعر. ويُبين لكل خبر كيف يقدمه ابن إسحاق، بلا إسناد أو بقوله حُدِّثت أو بلغني."
  en: "Five accounts in Ibn Hisham's Sira about the effect of hearing the Qur'an on masters of speech: al-Walid ibn al-Mughira refuses to call it poetry, magic, madness or soothsaying; Utba ibn Rabia returns from visiting the Prophet; three men listen by night; Umar becomes a Muslim over a sheet containing Ta-Ha; and al-Tufayl ibn Amr accepts Islam. Then what is reported of Labid giving up poetry. Each account is shown with how Ibn Ishaq introduces it, with no chain, or with I was told or it reached me."
  ur: "سیرت ابن ہشام کے پانچ بیانات اہل فصاحت پر قرآن سننے کے اثر کے بارے میں: ولید بن مغیرہ اسے شعر، سحر، جنون یا کہانت کہنے سے انکار کرتا ہے، عتبہ بن ربیعہ نبی کے پاس سے لوٹتا ہے، تین آدمی رات کو سنتے ہیں، عمر طہ والے صحیفے پر مسلمان ہوتے ہیں، اور طفیل بن عمرو اسلام لاتے ہیں۔ پھر لبید کے شعر چھوڑنے کی روایت۔ ہر بیان کے ساتھ ابن اسحاق کا صیغۂ روایت بتایا گیا ہے۔"
  fr: "Cinq récits de la Sira d'Ibn Hisham sur l'effet d'entendre le Coran chez des maîtres de la parole : al-Walid ibn al-Mughira refuse d'y voir de la poésie, de la magie, de la folie ou de la divination ; Utba ibn Rabia revient de chez le Prophète ; trois hommes écoutent de nuit ; Umar se convertit sur une feuille contenant Ta-Ha ; al-Tufayl ibn Amr embrasse l'islam. Puis ce qui est rapporté de Labid renonçant à la poésie. Chaque récit indique comment Ibn Ishaq l'introduit."
  es: "Cinco relatos de la Sira de Ibn Hisham sobre el efecto de oír el Corán en maestros de la palabra: al-Walid ibn al-Mughira se niega a llamarlo poesía, magia, locura o adivinación; Utba ibn Rabia vuelve de visitar al Profeta; tres hombres escuchan de noche; Umar se hace musulmán ante una hoja con Ta-Ha; al-Tufayl ibn Amr abraza el islam. Luego lo que se cuenta de Labid dejando la poesía. Cada relato indica cómo lo introduce Ibn Ishaq."
  tr: "İbn Hişam'ın biyografisinde, Kur'an'ı dinlemenin etkili kişiler arasında etkisiyle ilgili beş rapor vardır: El-Velid bin el-Muğira ona şiir, sihir, delilik veya fal demeyi reddeder; Utbah bin Rabi'ah ondan döner; gece dinleyen üç kişi; Taha içeren bir kağıtta Ömer'in İslamı; ve el-Tufey bin Amr'in İslamı. Sonra Labid'den ve şiirden vazgeçmesinden anlatılanlar. İbn İshaq'ın her haberi aktarım zinciri olmadan ya da 'Aktardım' ya da 'Ulaştım' diyerek nasıl sunduğunu açıklar."
  id: "Dalam biografi Ibn Hisham, terdapat lima laporan tentang pengaruh mendengarkan Al-Qur'an di kalangan orang-orang berpengaruh: Al-Walid ibn al-Mughirah menolak menyebutnya puisi, sihir, kegilaan, atau ramalan; Utbah ibn Rabi'ah berpaling darinya; tiga orang yang mendengarkan di malam hari; Islam Umar di atas kertas yang berisi Taha; dan Islam al-Tufay ibn Amr. Kemudian ada catatan tentang Labid dan penolakannya terhadap puisi. Ia menjelaskan bagaimana Ibn Ishaq menyampaikan setiap berita tanpa rantai transmisi atau dengan mengatakan 'Saya mengirimkan' atau 'Saya telah mencapainya.'"
