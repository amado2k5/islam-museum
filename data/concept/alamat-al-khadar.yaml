label:
  ar: "علامات الخدر"
  en: "Signs of numbness"
  fr: "Les signes de l’engourdissement"
  ur: "خدر کی علامات"
  es: "Signos de entumecimiento"
summary:
  ar: "علامات الخدر بعينها هي الأسباب وهي ظاهرة، ويدل عليها زيادة الخدر بزيادة السبب ونقصانه بنقصانه، فإن كان عن دم غالب قامت دلالة من امتلاء العروق وانتفاخ الأوداج وثقل البدن والنوم وحمرة الوجه والعين {cite:canon-ibn-sina-print-v2 p.158} {cite:canon-ibn-sina-print-v2 p.159}"
  en: "The very signs of numbness are its causes, and they are evident; the numbness's increase with the cause's increase and its lessening with the cause's lessening point to it; if it is from prevailing blood there are the proofs of vein-fulness, swelling jugulars, heaviness of body, sleep and redness of face and eye {cite:canon-ibn-sina-print-v2 p.158} {cite:canon-ibn-sina-print-v2 p.159}"
  fr: "Les signes mêmes de l’engourdissement sont ses causes, et ils sont évidents ; l’augmentation de l’engourdissement avec l’augmentation de la cause et sa diminution avec la diminution de la cause l’indiquent ; s’il vient d’une prédominance du sang, on trouve les preuves de la plénitude des veines, des jugulaires gonflées, une lourdeur du corps, le sommeil et la rougeur du visage et de l’œil {cite:canon-ibn-sina-print-v2 p.158} {cite:canon-ibn-sina-print-v2 p.159}"
  ur: "خدر کی علامات خود اس کے اسباب ہیں اور وہ ظاہر ہیں؛ سبب کے بڑھنے سے خدر کا بڑھنا اور اس کے گھٹنے سے خدر کا گھٹنا اس پر دلالت کرتا ہے؛ اگر وہ غالب خون سے ہو تو عروق کے امتلاء، ودجوں کے سوجھنے، بدن کے بھاری پن، نیند اور چہرے و آنکھ کی سرخی جیسی دلیلیں قائم ہوتی ہیں {cite:canon-ibn-sina-print-v2 p.158} {cite:canon-ibn-sina-print-v2 p.159}"
  es: "Los propios signos de entumecimiento son sus causas, y son evidentes; el aumento del entumecimiento con el aumento de la causa y su disminución con la disminución de la causa lo indican; si se debe a la sangre predominante, existen pruebas de congestión venosa, hinchazón de las yugulares, pesadez corporal, sueño y enrojecimiento de la cara y los ojos {cite:canon-ibn-sina-print-v2 p.158} {cite:canon-ibn-sina-print-v2 p.159}"
