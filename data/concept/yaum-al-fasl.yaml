label:
  ar: يوم الفصل
  en: The Day of Separation
  ur: یوم فصل
  es: "El día de la separación"
  fr: "Le jour de la séparation"
  tr: "Kıyamet Günü"
  id: "Hari Penghakiman"
summary:
  ar: "يوم الفصل في القرآن والسنة: اليوم الذي يفصل فيه الله بين الخلائق، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يفصل بين أهل الجنة وأهل النار."
  en: "The Day of Separation in Qur'an and Sunnah: the day God separates creation — a sign of the Hour, a day of indescribable terror, when God separates the people of paradise from the people of fire."
  ur: "یوم فصل قرآن و سنت میں: وہ دن جب اللہ مخلوق کے درمیان فرق کرتا ہے — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ جنت والوں اور آگ والوں کے درمیان فرق کرتا ہے۔"
  es: "El Día de la Separación en el Corán y la Sunnah: el día en que Dios separa la creación, una señal de la Hora, un día de terror indescriptible, cuando Dios separa a la gente del paraíso de la gente del fuego."
  fr: "Le Jour de la Séparation dans le Coran et la Sunna: le jour où Dieu sépare la création — signe de l’Heure, jour d’une terreur indescriptible, où Dieu sépare les habitants du paradis des habitants du feu."
  tr: "Kur'an ve Sünnette Kıyamet Günü: Allah'ın yaratıklar arasında hüküm vereceği gün. Kıyametin alametlerinden biri olduğu, tarifsiz bir dehşet taşıdığı ve Allah'ın cennet ehli ile cehennem ehli arasında hüküm vereceği belirtilmiştir."
  id: "Hari Kiamat dalam Al-Qur'an dan Sunnah: Hari di mana Allah akan menghakimi makhluk-makhluk-Nya. Disebutkan bahwa hari itu adalah salah satu tanda-tanda Kiamat, dan bahwa ada kengerian yang tak terlukiskan di dalamnya, dan bahwa Allah akan menghakimi penghuni Surga dan penghuni Neraka."
