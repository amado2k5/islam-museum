label:
  ar: يوم الفصل
  en: The Day of Separation
  ur: یوم فصل
summary:
  ar: "يوم الفصل في القرآن والسنة: اليوم الذي يفصل فيه الله بين الخلائق، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يفصل بين أهل الجنة وأهل النار."
  en: "The Day of Separation in Qur'an and Sunnah: the day God separates creation — a sign of the Hour, a day of indescribable terror, when God separates the people of paradise from the people of fire."
  ur: "یوم فصل قرآن و سنت میں: وہ دن جب اللہ مخلوق کے درمیان فرق کرتا ہے — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ جنت والوں اور آگ والوں کے درمیان فرق کرتا ہے۔"
