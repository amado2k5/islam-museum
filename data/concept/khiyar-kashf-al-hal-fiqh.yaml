id: concept/khiyar-kashf-al-hal-fiqh
class: concept
kind: legal
label:
  ar: خيار كشف الحال
  en: Khiyar kashf al-hal (option upon disclosure of the quantity)
  ur: خیار کشف الحال
summary:
  ar: 'خيار كشف الحال حق الفسخ لمن ظهر له مقدار المبيع على غير ما ظنه، والكشف في اللغة الإظهار ورفع الشيء عما يواريه، وسماها الحنفية كشف الحال وانكشاف الحال والتكشف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} مجاله المقاييس الشخصية التي يلجأ إليها المتعاقدان بدلا من المقاييس المتعارفة من وسائل الكيل أو الوزن، كبيع ما يباع بالكيل أو الوزن بإناء بعينه لا يعرف مقداره كصندوق أو كيس أو بوزن حجر بعينه، فالبيع صحيح بشروط خاصة ومستتبع حق الخيار للمشتري أي أن البيع غير لازم، وفي صحته خلاف عنيت بذكره كتب الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} أخذ به الحنفية في رواية وذكروه في عداد خياراتهم المسماة، وأثبته الشافعية وإن أطلقوا عليه غير هذه التسمية وأحيانا عبروا عنه دون تسمية، وذكر ابن حجر أن البيع بملء كوز أو بيت من صبرة أو بوزنة حصاة من ذهب صحيح لإمكان الأخذ من المعين قبل تلفه ولا يشترط العلم بالقدر المعين بخلاف ما لو قال في ذمتي صفته كذا، ومنعه المالكية وعدوه من بيوع الغرر المنهية، والمنع رواية الحسن بن زياد عن أبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} وجه الجواز أن الجهالة الثابتة في هذا العقد لا تفضي إلى المنازعة لأن تسليمه يتعجل في المجلس وإنما تمنع الصحة الجهالة المفضية للنزاع، وقال ابن الهمام إن الوجه يقتضي ثبوت الخيار إذا كال به أو وزن للمشتري ونصت كتب النوازل على ثبوته إذا علم بالوزن، وأقرب نظائره عنده قول أبي حنيفة في بيع الصبرة كل قفيز بدرهم أنه إذا كال في المجلس حتى عرف المقدار صح وثبت الخيار للمشتري كما لو رآه ولم يكن رآه وقت البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} وجه المنع أن البيع في المكيلات والموزونات إما مجازفة فالمعقود عليه ما يشار إليه وإما بذكر القدر فالمعقود عليه المسمى ولم يوجد هنا أحدهما إذ لم يكن المكيال معلوما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} شرائط صحة العقد معه: بقاء المكيال أو الميزان غير المعروف على حالهما فلو تلفا قبل التسليم فسد البيع لأنه لا يعلم مبلغ ما باعه؛ وتعجيل تسليم المبيع في مجلس العقد كما تفيده عبارات الفقهاء كلها ومنها عبارة السرخسي؛ وألا يحتمل المكيال الشخصي النقصان في الكيل خاصة بأن لا ينكبس ولا ينقبض كالخشب والحديد فلا يجوز الزنبيل والجوالق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} ومن هذا القبيل بيع ملء قربة بعينها أو راوية فعن أبي حنيفة أنه لا يجوز لأن الماء ليس عنده ولا يعرف قدر القربة لكنه أطلق في المعين جوازه مع اعتبار القرب المتعارفة في البلد لدى غالب السقائين، وعن أبي يوسف أنه إذا ملأها ثم تراضيا جاز، وقال ابن الهمام إن القياس ما روي عن أبي حنيفة والاستحسان الثابت بالتعامل مقتضاه الجواز بعد تسمية نوع القربة إذا لم تكن معينة ثم التفاوت يسير أهدر في الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8012}'
  en: 'Khiyar kashf al-hal is the right of rescission for one to whom the amount of the sold thing proves other than he supposed; kashf in language is disclosure, the lifting of a thing from what covers it, and the Hanafis name it kashf al-hal, inkishaf al-hal and takashshuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} Its field is the personal measures the parties resort to instead of the customary measures of volume or weight, as when one sells what is sold by measure or weight by a particular vessel of unknown capacity, such as a box or a bag, or by the weight of a particular stone; the sale is valid under special conditions and carries the buyer''s right of option, the sale being non-binding, and its validity is disputed in the Hanafi books. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} The Hanafis take it in a transmission and list it among their named options; the Shafiis affirm it too though under another name and at times unnamed, and Ibn Hajar states that selling the fill of a jug or a houseful from a heap, or a pebble''s weight of gold, is valid because taking from the determinate is possible before it perishes and knowledge of the determinate amount is not required, unlike saying "in my liability is such-and-such of it"; the Malikis forbid it counting it among the forbidden gharar sales, and the prohibition is the transmission of al-Hasan ibn Ziyad from Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} The ground for permission is that the ignorance present in this contract does not lead to dispute because its delivery is prompt in the session, only dispute-breeding ignorance barring validity; Ibn al-Humam held that the principle requires the option whenever he measured or weighed for the buyer, and the fatwa books state it when the amount is learned by weighing, and its closest parallel for him is Abu Hanifa''s view on selling a heap at a dirham the qafiz: if it is measured in the session until the amount is known the sale is valid and the buyer holds the option, as though he had seen it without having seen it at the time of the sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} The ground for prohibition is that a sale of measurables and weighables is either by estimate, the object being what is pointed at, or by naming the amount, the object being the named amount, and neither is found here since the measure was not known. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} Conditions of the contract''s validity with it: the unknown vessel or scale must remain as it was, for if it perishes before delivery the sale corrupts since the amount sold cannot be known; delivery of the goods must be prompt in the contract''s session, as the jurists'' wordings all state including al-Sarakhsi''s; and in measuring only, the personal measure must not admit shrinkage, neither collapsing nor contracting, such as wood or iron, so the wicker basket and the sack do not serve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} Of this kind is selling the fill of a particular waterskin or a large one: from Abu Hanifa that it is not allowed because the water is not with him nor is the skin''s capacity known, though he unqualifiedly allowed it for a specified skin with the town''s customary skins among most water-carriers being the measure; from Abu Yusuf that if it is filled and they then agree it is allowed; and Ibn al-Humam said the analogical rule is Abu Hanifa''s transmission while the juristic preference established by practice implies permission after the skin''s kind is named when it is not specified, the disparity then being slight and wasted in water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8012}'
  ur: 'خیار کشف الحال فسخ کا وہ حق ہے جس کے سامنے مبیع کی مقدار اس کے گمان کے برعکس ظاہر ہو؛ کشف لغت میں ظاہر کرنا اور چھپے ہوئے سے پردہ اٹھانا ہے، اور حنفیہ اسے کشف الحال، انکشاف الحال اور تکشف کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} اس کا مجال وہ شخصی پیمانے ہیں جنہیں متعاقدین رائج کیلی اور وزنی پیمانوں کے بجائے اپنا لیتے ہیں، جیسے ناپے یا تولے جانے والی چیز کو کسی خاص برتن سے بیچنا جس کی گنجائش معلوم نہ ہو جیسے صندوق یا بوری، یا کسی خاص پتھر کے وزن سے؛ ایسی بیع خاص شرطوں پر صحیح ہوتی ہے اور خریدار کو خیار کا حق دیتی ہے یعنی بیع لازم نہیں، اور اس کی صحت پر حنفی کتب میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} حنفیہ نے اسے ایک روایت میں لیا اور اپنی گنی ہوئی خیارات میں شمار کیا؛ شافعیہ نے بھی اسے ثابت کیا اگرچہ دوسرے نام سے اور کبھی بغیر نام کے، اور ابن حجر نے کہا کہ کسی کوزے کی بھرائی یا صبرے کے ایک گھر بھر یا کسی کنکری کے وزن سونا بیچنا صحیح ہے کیونکہ معین سے لینا اس کے تلف ہونے سے پہلے ممکن ہے اور قدرِ معین کا علم شرط نہیں بعکس یہ کہنے کے کہ میری ذمے میں اس کی اتنی مقدار ہے؛ مالکیہ نے اسے منع کیا اور منع شدہ غرر بیعوں میں گنا، اور یہ منع حسن بن زیاد کی ابو حنیفہ سے روایت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8010} جواز کا رخ یہ ہے کہ اس عقد میں موجود جہالت تنازع کی طرف نہیں لے جاتی کیونکہ اس کی تسلیم مجلس میں فوراً ہو جاتی ہے اور صحت صرف وہی جہالت روکتی ہے جو نزاع پیدا کرے؛ ابن الہمام کا کہنا ہے کہ یہ اصول اس پر خیار کے ثبوت کا تقاضا کرتا ہے جب بھی خریدار کے لیے ناپا یا تولا جائے اور کتبِ نوازل نے وزن سے علم ہونے پر اس کے ثبوت کی صراحت کی ہے، اور اس کا قریب ترین مشابہ ان کے نزدیک ابو حنیفہ کا وہ قول ہے کہ صبرہ فی قبیز درہم میں بیچنے پر اگر مجلس ہی میں ناپ کر مقدار معلوم ہو جائے تو بیع صحیح اور خریدار کو خیار ثابت ہے گویا اس نے بیع کے وقت نہ دیکھی ہوئی چیز کو دیکھ لیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} منع کا رخ یہ ہے کہ ناپے تولے جانے والوں کی بیع یا جزافہ ہوتی ہے جس میں معقود علیہ اشارہ کی ہوئی چیز ہے یا قدر کے ذکر کے ساتھ جس میں معقود علیہ مسمی مقدار ہے، اور یہاں دونوں میں سے کوئی موجود نہیں کیونکہ ناپنے کا پیمانہ معلوم نہ تھا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} اس کے ساتھ عقد کی صحت کی شرائط: نامعلوم ناپنے یا تولنے کا آلہ اپنی حالت پر باقی رہے کیونکہ تسلیم سے پہلے تلف ہو جائے تو بیع فاسد ہو جاتی ہے کہ بیچی گئی مقدار معلوم نہیں ہو سکتی؛ مبیع کی تسلیم مجلسِ عقد میں فوری ہو جیسا فقہاء کی تمام عبارات کہتی ہیں جن میں سرخسی کی عبارت بھی ہے؛ اور صرف ناپنے میں شرط یہ ہے کہ شخصی پیمانہ سکڑنے کا امکان نہ رکھتا ہو یعنی نہ ڈھیلا ہو نہ جمع ہونے والا جیسے لکڑی یا لوہے کا ہو، لہٰذا ٹوکرا اور گونی بوری درست نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8011} اسی باب میں ہے کسی خاص مشک یا روایہ کی بھرائی بیچنا: ابو حنیفہ سے ہے کہ جائز نہیں کیونکہ پانی اس کے پاس نہیں اور مشک کی گنجائش معلوم نہیں، البتہ معین مشک میں انہوں نے مطلقاً جواز دیا بشرط شہر کے سقاؤں میں رائج مشکیں معیار ہوں؛ ابو یوسف سے ہے کہ اگر وہ بھری جائے پھر دونوں راضی ہوں تو جائز؛ ابن الہمام کے نزدیک قیاس ابو حنیفہ کی روایت ہے اور تعامل سے ثابت استحسان کا تقاضا غیر معین صورت میں مشک کی جنس بتانے کے بعد جواز ہے، پھر تفاوت اتنا معمولی ہے کہ پانی میں ضائع سمجھا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8012}'
