id: concept/charitable-lands-of-the-prophet
tags: [wasaya-browser, wasaya-legacy, wasaya-mirath, wasaya-athar]
class: concept
kind: legal
label:
  ar: "صدقات النبي: أرض بني النضير وخيبر وفدك"
  en: "The Prophet's charitable lands: Banu al-Nadir, Khaybar and Fadak"
  ur: "نبی کی صدقہ زمینیں: بنو نضیر، خیبر اور فدک"
summary:
  ar: "ترد في حديث عمر الطويل، الذي رواه مالك بن أوس، ثلاث صفايا للنبي: أرض بني النضير حبساً لنوائبه، وخيبر جزّأها على ثلاثة أجزاء، وفدك لأبناء السبيل {cite:sahih-al-bukhari 4033} {cite:fath-al-bari scan vol. 2 p. 238}. وكان ينفق على أهله منها نفقة سنتهم ثم يجعل ما بقي في الكراع والسلاح {cite:al-bidaya-wal-nihaya scan vol. 3 p. 315}. فلما توفي ولي أبو بكر ثم عمر ما كان النبي يليه وعملا بما عمل به، ثم دفع عمر ما بالمدينة إلى علي والعباس ليعملا فيه بما عمل النبي وأبو بكر وعمر، ولم يقض لهما بغير ذلك {cite:al-bidaya-wal-nihaya scan vol. 3 p. 316}."
  en: "In the long report of 'Umar, narrated by Malik ibn Aws, the Prophet had three special properties: the land of Banu al-Nadir, kept for his needs; Khaybar, which he divided in three parts; and Fadak, for wayfarers {cite:sahih-al-bukhari 4033} {cite:fath-al-bari scan vol. 2 p. 238}. He spent from them on his family for a year's maintenance and put the remainder into horses and weapons {cite:al-bidaya-wal-nihaya scan vol. 3 p. 315}. After his death Abu Bakr and then 'Umar took charge of what he had administered and acted as he had; 'Umar then handed the Medina property to 'Ali and al-'Abbas to act on it as the Prophet, Abu Bakr and he had, and gave no other ruling {cite:al-bidaya-wal-nihaya scan vol. 3 p. 316}."
  ur: "عمر کی طویل روایت میں، جسے مالک بن اوس نے بیان کیا، نبی کی تین خاص جائیدادیں بتائی گئی ہیں: بنو نضیر کی زمین جو آپ کی ضروریات کے لیے محفوظ تھی؛ خیبر جسے آپ نے تین حصوں میں بانٹا؛ اور فدک جو مسافروں کے لیے تھا {cite:sahih-al-bukhari 4033} {cite:fath-al-bari scan vol. 2 p. 238}۔ آپ ان سے اپنے گھر والوں پر سال بھر کا خرچ کرتے اور باقی گھوڑوں اور ہتھیاروں پر لگا دیتے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 315}۔ آپ کے بعد ابوبکر اور پھر عمر نے وہ ذمہ داری سنبھالی جو آپ کے پاس تھی اور اسی طرح عمل کیا؛ پھر عمر نے مدینہ کی جائیداد علی اور عباس کو اس شرط پر دی کہ وہ اس میں اسی طرح عمل کریں جیسے نبی، ابوبکر اور عمر نے کیا، اور اس کے سوا کوئی فیصلہ نہ کیا {cite:al-bidaya-wal-nihaya scan vol. 3 p. 316}۔"
