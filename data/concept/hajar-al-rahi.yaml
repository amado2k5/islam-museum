summary:
  ar: "حجر الرحى هو ما تُجرش به الحبوب، وهكذا يعرّفه المحقّق. بخار الخلّ عنه يمنع النزف، ويمنع الأورام الحارة."
  en: "The millstone is the stone that grinds grain, as the editor states. The vapour of vinegar over it stops bleeding and prevents hot swellings."
  ur: "چکی کا پتھر وہ ہے جس سے غلہ پیسا جاتا ہے، جیسا کہ مدوّن نے بتایا ہے۔ اس پر سرکے کی بھاپ خون بہنا روکتی ہے اور گرم سوجن کو روکتی ہے۔"
  es: "La piedra de molino es la piedra que muele el grano, como afirma el editor. El vapor de vinagre sobre ella detiene el sangrado y previene la hinchazón."
