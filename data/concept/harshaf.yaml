summary:
  ar: "الحرشف من أصناف الكَركَند في الكتاب؛ طبعه بين الحرارة والبرودة، ويُذكر أنه ينقّي قليلاً ويجفّف، وفيه لطافة، وماؤه يقتل القمل ويزيل نتن الإبط وحزاز الرأس، وينفع من الاستسقاء وتنقية البول، وتقرير الخوزي المتعلق بتوليد السوداء موضع خلاف مذكور."
  en: "In the book harshaf is one of the kinds of kerkand. Its temperament is between heat and cold. It cleanses a little and dries, and it has fineness. Its water kills lice, removes armpit stench and scalp scurf, and helps urine and dropsy. The claim of al-Khuzi that it breeds black bile is recorded as a disputed statement."
  ur: "کتاب میں حرشف کرکند کی اقسام میں سے ہے؛ اس کی طبع گرمی اور ٹھنڈک کے درمیان ہے۔ یہ کچھ صاف کرتا اور خشک کرتا ہے، اور اس میں لطافت ہے۔ اس کا پانی جوؤں کو مارتا، بغل کی بو اور سر کے حزاز کو دور کرتا ہے، اور پیشاب اور استسقاء میں مفید ہے۔ خوزی کا قول کہ یہ سودا پیدا کرتا ہے، اختلافی بیان کے طور پر درج ہے۔"
  es: "En el libro, el harshaf es uno de los tipos de kerkand. Su temperamento es intermedio entre el calor y el frío. Limpia ligeramente y seca, y es fino. Su agua mata los piojos, elimina el mal olor de las axilas y la caspa del cuero cabelludo, y ayuda con la micción y la hidropesía. La afirmación de al-Khuzi de que produce bilis negra se registra como una declaración controvertida."
  fr: "Dans le livre, le harshaf est mentionné comme une sorte de kerkand. Son tempérament est intermédiaire entre le chaud et le froid. Il purifie légèrement, assèche et possède une texture fine. Son eau tue les poux, élimine les odeurs des aisselles et les pellicules du cuir chevelu, et facilite la miction et soulage l'hydropisie. L'affirmation d'al-Khuzi selon laquelle il engendrerait de la bile noire est rapportée comme une déclaration controversée."
