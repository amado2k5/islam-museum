id: concept/arteries
class: concept
kind: scientific
label: { ar: "الشرايين عند ابن سينا", en: "Arteries in the Canon", fr: "Les artères dans le Canon", ur: "قانون میں شریانیں", es: "Arterias en el Canon" }
summary:
  ar: "الجملة الرابعة من تشريح الأعضاء المفردة عند ابن سينا في الشرايين، وهي العروق الضوارب، في خمسة فصول؛ وهي ذات غشاءين إلا واحداً، ومنبتها من التجويف الأيسر للقلب {cite:canon-ibn-sina-print-v1 pp.83-84}."
  en: "The fourth group of the anatomy of the simple organs in Ibn Sina is the arteries, the pulsing vessels, in five chapters; they have two coats, with one exception, and spring from the left cavity of the heart {cite:canon-ibn-sina-print-v1 pp.83-84}."
  fr: "Le quatrième ensemble de l’anatomie des organes simples chez Ibn Sina porte sur les artères, les vaisseaux pulsatiles, en cinq chapitres ; elles ont deux tuniques, à une exception près, et naissent de la cavité gauche du cœur {cite:canon-ibn-sina-print-v1 pp.83-84}."
  es: "El cuarto grupo de la anatomía de los órganos simples en Ibn Sina son las arterias, los vasos pulsátiles, en cinco capítulos; tienen dos capas, con una excepción, y nacen de la cavidad izquierda del corazón {cite:canon-ibn-sina-print-v1 pp.83-84}."
  ur: "ابن سینا میں سادہ اعضاء کی اناٹومی کا چوتھا گروپ پانچ ابواب میں شریانیں، نبض کرنے والی نالیاں ہیں۔ ان کے دو پرت ہیں، ایک استثناء کے ساتھ، اور دل کی بائیں گہا سے بہار ہے {حوالہ: کینن ابن سینا پرنٹ-v1 صفحہ 83-84}۔"
