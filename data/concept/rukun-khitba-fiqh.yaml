id: concept/rukun-khitba-fiqh
class: concept
kind: legal
label:
  ar: "الركون ⁦(في الخطبة)⁩"
  en: "Rukun (inclining to a suitor): the approval that precedes marriage, and retraction from it"
  ur: "رکون ⁦(نکاح کی بات پکی ہونا)⁩"
  es: "Rukun (inclinación hacia un pretendiente): la aprobación que precede al matrimonio y la retractación del mismo."
  fr: "Rukun (préférence pour un prétendant): l’approbation qui précède le mariage et le retrait de cette approbation."
  tr: "Al-Rukun (vaazda)"
  id: "Al-Rukun (dalam khotbah)"
summary:
  ar: "الركون في اللغة الميل والسكون والاطمئنان، وفي الفقه الميل إلى الخاطب وظهور الرضى به من المرأة أو من ذويها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982} ويباح للولي وللمرأة الرجوع عن الركون لغرض صحيح، لأن النكاح عقد يدوم ضرره، أما الرجوع بلا غرض صحيح فمكروه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982}"
  en: "Rukun in the lexicon is inclining, settling and feeling at ease; in law it is the inclination toward a suitor and the appearance of the woman's or her guardians' consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982} Retraction from it is allowed for a valid reason, since marriage is a lasting contract whose harm endures; retraction without a valid reason is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982}"
  ur: "رکون نکاح کی منگنی میں رضامندی ظاہر کرنے کو کہتے ہیں؛ کسی صحیح وجہ سے رجوع جائز ہے اور بغیر وجہ مکروہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982}"
  es: "Rukun, en el léxico, significa inclinación, asentamiento y sensación de comodidad; en derecho, es la inclinación hacia un pretendiente y la apariencia del consentimiento de la mujer o sus tutores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982} Se permite la retractación por una razón válida, ya que el matrimonio es un contrato duradero cuyo daño perdura; la retractación sin una razón válida es desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982}"
  fr: "Le terme « rukun » dans le lexique signifie être enclin, s'installer et se sentir à l'aise; en droit, il désigne l'inclination envers un prétendant et l'apparence du consentement de la femme ou de ses tuteurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982} La rétractation est permise pour un motif valable, car le mariage est un contrat durable dont les conséquences sont irréversibles; la rétractation sans motif valable est déconseillée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982}"
  tr: "Dilde 'rakun' eğilim, durgunluk ve güven anlamına gelir; hukuk alanında ise talibe eğilim ve kadın ya da akrabalarının ona gösterdiği görünür rızadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8982} Vasi ve kadının geçerli bir amaç için dayanmaktan vazgeçmesi mümkündür, çünkü evlilik zararı kalıcı bir sözleşmedir, geçerli bir amaç olmadan geri çekilme ise hoş karşılanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8982}"
  id: "Dalam bahasa, 'rakun' berarti kecenderungan, ketenangan, dan kepastian; dalam yurisprudensi, kecenderungan terhadap pelamar dan persetujuan yang tampak dari wanita atau kerabatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8982} Diperbolehkan bagi wali dan wanita untuk menarik diri dari ketergantungan untuk tujuan yang sah, karena pernikahan adalah kontrak yang kerugian bertahan, sedangkan penarikan tanpa tujuan yang sah tidak disukai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8982}"
