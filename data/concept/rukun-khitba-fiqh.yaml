id: concept/rukun-khitba-fiqh
class: concept
kind: legal
label:
  ar: "الركون (في الخطبة)"
  en: "Rukun (inclining to a suitor): the approval that precedes marriage, and retraction from it"
  ur: "رکون (نکاح کی بات پکی ہونا)"
summary:
  ar: "الركون في اللغة الميل والسكون والاطمئنان، وفي الفقه الميل إلى الخاطب وظهور الرضى به من المرأة أو من ذويها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982} ويباح للولي وللمرأة الرجوع عن الركون لغرض صحيح، لأن النكاح عقد يدوم ضرره، أما الرجوع بلا غرض صحيح فمكروه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982}"
  en: "Rukun in the lexicon is inclining, settling and feeling at ease; in law it is the inclination toward a suitor and the appearance of the woman's or her guardians' consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982} Retraction from it is allowed for a valid reason, since marriage is a lasting contract whose harm endures; retraction without a valid reason is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982}"
  ur: "رکون نکاح کی منگنی میں رضامندی ظاہر کرنے کو کہتے ہیں؛ کسی صحیح وجہ سے رجوع جائز ہے اور بغیر وجہ مکروہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8982}"
