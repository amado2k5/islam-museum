label:
  ar: الخفاء
  en: Khafa' (hidden meaning in usul)
  ur: خفاء
summary:
  ar: 'الخفاء لغة من خفيت الشيء أي كتمته أو أظهرته، وهو من الأضداد، وخفي عليه الأمر إذا استتر؛ والفقهاء يستعملونه بمعنى الاستتار وعدم الظهور، وعند الأصوليين هو ما يخفى المراد فيه بسبب في الصيغة أو خارج عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} يتصل بالاشتباه وهو الالتباس، والجهل وهو اعتقاد الشيء على خلاف ما هو عليه، فالخفاء قد يورث الجهل بالوجود أو بالمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} يقسم الأصوليون الألفاظ باعتبار خفاء المعنى أربع مراتب، أولاها الخفي: ما اشتبه مراده بعارض غير الصيغة، كلفظ السارق الذي يخفى على الطرار والنباش؛ وقد يكون الخفاء زيادة أو نقصانا في المعنى الذي تعلق به الحكم، ومثاله النباش فاختلف فيه: يقطع عند الجمهور ولا يقطع عند أبي حنيفة ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} الثانية المشكل: ما اشتبه المراد منه بدخوله في أشكال لا يعرف المراد إلا بدليل يميزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} الأدنى في الخفاء الخفي ويكفيه الطلب بالفكر القليل، ثم المشكل ويحتاج إلى التكلف والاجتهاد، ثم المجمل ويحتاج إلى الاستفسار عن بيان الشارع، وأشدها المتشابه ويكون فيه التوقف والتسليم؛ وغير الحنفية يجعلون ذلك كله من المجمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7734} المشكل في مثل «فأتوا حرثكم أنى شئتم»: اللفظ مشترك بين الأين والكيف، وظهر بالقرينة أن المراد الكيف. والمجمل كالصلاة والزكاة والربا، ومرجعه بيان الشارع. والمتشابه كالحروف المقطعة في أوائل السور وبعض صفات الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7734} أثر الخفاء في سماع الدعوى: لا تسمع دعوى فيها تناقض، ويغتفر التناقض فيما كان مبنيا على خفاء، كدعوى زوال ملك لم يعلمه الورثة، ودعوى النسب والحرية والطلاق؛ والحنابلة لا تسمع البينة بعد الإنكار إلا إن ادعى أنه لا بينة له ثم ظهرت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7735} خفاء النجاسة: إذا خفي موضعها في الثوب أو البدن وجب غسل الجميع عند الجمهور، والحنفية يحكمون بطهارة الباقي إذا غسل موضع منه في قول؛ وفي المكان الواسع يكفي النضح أو يصلى حيث شاء عند الشافعية والحنابلة، والمالكية في الغسل أو النضح قولان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7736}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7737} إن شك في وجود النجاسة مع تيقن الطهارة جازت الصلاة عند الحنفية والشافعية والحنابلة؛ والمالكية يفرقون بين البدن والثوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7737} خفاء العيب في المبيع: العيوب الخفية كالداخلية في البطيخ والجوز والبيض، ويثبت بها الرد عند الشروط؛ الحنفية يرجعون بالأرش إن انتفع بالمكسور، ويرجعون بالثمن كله إن لم ينتفع به؛ والمالكية لا يردون بعيب باطن إلا بتغير الذات، ويفرقون بين ما يعرف فساده قبل الكسر وما لا يعرف؛ والشافعية والحنابلة يفصلون بحسب القيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7738} ظهور دين خفي على التركة بعد القسمة: إذا قضى الورثة مضت القسمة، وإن امتنعوا طلب نقضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}'
  en: 'Khafa\'' is lexically concealment or disclosure of a thing, one of the words with two opposite senses, and the jurists use it for being hidden; for the usulis it is a word whose meaning is hidden by something in the form of the word or outside it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} It is near to ishtibah, confusion, and to jahl, belief in a thing contrary to what it is; hiddenness may cause ignorance of existence or of place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} The usulis divide words by the degree of hidden meaning into four ranks; the first, the hidden (khafi), is one whose meaning is obscured by something outside the form, as with the word thief which is hidden for the pickpocket and the grave-robber; the hiddenness may add or lessen what the ruling depends on, and the grave-robber is disputed: cut by the majority, not cut by Abu Hanifa and Muhammad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} The second rank, the ambiguous (mushkil), is one whose meaning is obscured by entering a form that is not known except by a sign that marks it off. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} The hidden is the lowest rank and needs a little reflection; the ambiguous needs effort and inquiry; the general needs a clarifying statement from the lawgiver, and the unclear is the highest rank, calling for suspension and submission; the non-Hanafi schools treat all these as the general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7734} Example of the ambiguous: the verse on coming to your tilth as you wish has a word shared by where and how; context shows "how". The general includes prayer, zakat and usury. The unclear includes the disjoined letters at the head of some chapters and some divine attributes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7734} Hidden meaning and claims: a claim that contradicts itself is not heard, but contradictions born of hidden matters are forgiven, as with heirs who did not know a sale of the rest of a house by their father; claims of descent, freedom or divorce are heard on the same ground. The Hanbalis do not hear evidence after denial, unless the claimant then finds it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7735} Hidden impurity: if the place of an impurity on cloth or body is unknown, the whole is washed by the majority; the Hanafis accept washing one part in one view; on a wide place the Shafiis and Hanbalis allow sprinkling or praying anywhere, and the Malikis have two views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7736}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7737} If one doubts impurity while sure of prior purity, prayer is valid by the Hanafis, Shafiis and Hanbalis; the Malikis distinguish the body and cloth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7737} Hidden defects in sale: defects inside melons, nuts and eggs give the right to return the goods; the Hanafis award the shortfall if the goods can still be used; the Malikis do not return for an inner defect unless the thing is changed; the Shafiis and Hanbalis separate by value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7738} A hidden debt appearing after the estate has been divided: if the heirs settle it, the division stands; if they refuse, the division is annulled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}'
  ur: 'خفاء لغت میں کسی چیز کو چھپانا یا ظاہر کرنا دونوں کے لیے آتا ہے، اور فقہاء اسے پوشیدگی کے معنی میں بولتے ہیں؛ اصولیین کے نزدیک یہ وہ لفظ ہے جس کا مراد صیغے یا خارج کے کسی سبب سے پوشیدہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} یہ اشتباہ (الجھن) اور جہل (چیز کو خلاف حقیقت سمجھنا) سے قریب ہے؛ پوشیدگی وجود یا مقام کی جہالت کا سبب بن سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} اصولیین مراتبِ خفاء کو چار حصوں میں بانٹتے ہیں؛ پہلا خفی: جس کا مراد صیغے کے علاوہ کسی عارض سے پوشیدہ ہو، جیسے لفظ چور جو جیب کترے اور قبر کھودنے والے پر مخفی ہے؛ اور خفاء معنیٔ حکم میں زیادتی یا کمی کی وجہ سے بھی ہو سکتا ہے، قبر کھودنے والے (نباش) کے قطع میں جمہور قطع کے قائل ہیں اور ابو حنیفہ اور محمد نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} دوسرا مشکل: جس کا مراد ایسی صورت میں داخل ہو جائے کہ اس کا تعین کسی دلیل کے بغیر نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} خفی سب سے کم مرتبہ ہے، اس میں ہلکا غور کافی ہے؛ پھر مشکل جس میں کوشش و اجتہاد درکار ہے؛ پھر مجمل جس میں شارع کے بیان کی ضرورت ہے؛ اور سب سے سخت متشابہ جس میں توقف اور تسلیم ہے؛ غیر حنفیہ ان سب کو مجمل میں شمار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7734} مشکل کی مثال «فأتوا حرثكم أنى شئتم» میں لفظ «أنّی» کا این اور کیف دونوں کے لیے مشترک ہونا، جس میں قرینہ سے کیف مراد ظاہر ہوا؛ مجمل کی مثال نماز، زکوٰۃ اور سود؛ متشابہ مثلاً سورتوں کے آغاز کے حروفِ مقطعات اور اللہ کی بعض صفات۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7734} دعوے میں خفاء کا اثر: متناقض دعویٰ نہیں سنا جاتا، مگر جو خفاء پر مبنی ہو اس میں تناقض معاف ہے، جیسے ورثاء کا لاعلمی میں مکان کی باقی حصہ کی فروخت کا دعویٰ؛ نسب، آزادی اور طلاق کے دعوے بھی اسی بنیاد پر سنے جاتے ہیں؛ حنابلہ انکار کے بعد گواہ نہیں سنتے جب تک مدعی یہ نہ کہے کہ گواہ نہیں تھا اور پھر ظاہر ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7735} نجاست کا مقام پوشیدہ ہو تو جمہور کے نزدیک کپڑے یا بدن کا سارا حصہ دھویا جائے؛ حنفیہ ایک قول میں ایک حصہ دھو کر باقی کو پاک کہتے ہیں؛ وسیع جگہ میں شافعیہ اور حنابلہ چھینٹے کافی کہتے ہیں یا جہاں چاہے نماز پڑھے؛ مالکیہ کے دو قول ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7736}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7737} پاکی کا یقین اور نجاست کا شک ہو تو نماز حنفیہ، شافعیہ اور حنابلہ کے نزدیک درست ہے؛ مالکیہ بدن اور کپڑے میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7737} مبیع کا پوشیدہ عیب: تربوز، اخروٹ اور انڈے کے اندر کا عیب رد کا حق دیتا ہے؛ حنفیہ قابلِ استعمال ہونے کی صورت میں کمی کا تاوان لیتے ہیں؛ مالکیہ اندرونی عیب پر رد نہیں کرتے جب تک ذات نہ بدلے؛ شافعیہ اور حنابلہ قیمت کے لحاظ سے فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7738} تقسیم کے بعد ترکے پر ظاہر ہونے والا قرض: ورثاء ادا کریں تو تقسیم برقرار، انکار کریں تو تقسیم ختم ہو سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7739}'
