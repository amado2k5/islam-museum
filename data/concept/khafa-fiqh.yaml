label:
  ar: الخفاء
  en: Khafa' (hidden meaning in usul)
  ur: خفاء
summary:
  ar: 'الخفاء لغة من خفيت الشيء أي كتمته أو أظهرته، وهو من الأضداد، وخفي عليه الأمر إذا استتر؛ والفقهاء يستعملونه بمعنى الاستتار وعدم الظهور، وعند الأصوليين هو ما يخفى المراد فيه بسبب في الصيغة أو خارج عنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} يتصل بالاشتباه وهو الالتباس، والجهل وهو اعتقاد الشيء على خلاف ما هو عليه، فالخفاء قد يورث الجهل بالوجود أو بالمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} يقسم الأصوليون الألفاظ باعتبار خفاء المعنى أربع مراتب، أولاها الخفي: ما اشتبه مراده بعارض غير الصيغة، كلفظ السارق الذي يخفى على الطرار والنباش؛ وقد يكون الخفاء زيادة أو نقصانا في المعنى الذي تعلق به الحكم، ومثاله النباش فاختلف فيه: يقطع عند الجمهور ولا يقطع عند أبي حنيفة ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} الثانية المشكل: ما اشتبه المراد منه بدخوله في أشكال لا يعرف المراد إلا بدليل يميزه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733}'
  en: 'Khafa\'' is lexically concealment or disclosure of a thing, one of the words with two opposite senses, and the jurists use it for being hidden; for the usulis it is a word whose meaning is hidden by something in the form of the word or outside it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} It is near to ishtibah, confusion, and to jahl, belief in a thing contrary to what it is; hiddenness may cause ignorance of existence or of place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} The usulis divide words by the degree of hidden meaning into four ranks; the first, the hidden (khafi), is one whose meaning is obscured by something outside the form, as with the word thief which is hidden for the pickpocket and the grave-robber; the hiddenness may add or lessen what the ruling depends on, and the grave-robber is disputed: cut by the majority, not cut by Abu Hanifa and Muhammad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} The second rank, the ambiguous (mushkil), is one whose meaning is obscured by entering a form that is not known except by a sign that marks it off. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733}'
  ur: 'خفاء لغت میں کسی چیز کو چھپانا یا ظاہر کرنا دونوں کے لیے آتا ہے، اور فقہاء اسے پوشیدگی کے معنی میں بولتے ہیں؛ اصولیین کے نزدیک یہ وہ لفظ ہے جس کا مراد صیغے یا خارج کے کسی سبب سے پوشیدہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732} یہ اشتباہ (الجھن) اور جہل (چیز کو خلاف حقیقت سمجھنا) سے قریب ہے؛ پوشیدگی وجود یا مقام کی جہالت کا سبب بن سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7732}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} اصولیین مراتبِ خفاء کو چار حصوں میں بانٹتے ہیں؛ پہلا خفی: جس کا مراد صیغے کے علاوہ کسی عارض سے پوشیدہ ہو، جیسے لفظ چور جو جیب کترے اور قبر کھودنے والے پر مخفی ہے؛ اور خفاء معنیٔ حکم میں زیادتی یا کمی کی وجہ سے بھی ہو سکتا ہے، قبر کھودنے والے (نباش) کے قطع میں جمہور قطع کے قائل ہیں اور ابو حنیفہ اور محمد نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733} دوسرا مشکل: جس کا مراد ایسی صورت میں داخل ہو جائے کہ اس کا تعین کسی دلیل کے بغیر نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7733}'
