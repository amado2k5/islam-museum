id: concept/canon-general-regimen-of-the-traveller
class: concept
kind: scientific
label:
  ar: "التدبير الكلي للمسافر عند ابن سينا"
  en: "The general regimen of the traveller in the Canon"
  fr: "Régime général du voyageur dans le Canon"
  ur: "مسافر کی عمومی تدبیر قانون میں"
  es: "El régimen general del viajero en el Canon"
summary:
  ar: "يقرر ابن سينا أن المسافر ينقطع عن عاداته ويصيبه تعب ووصب، فعليه أن يعني بالغذاء والإعياء، فيجعل غذاءه جيد الجوهر قريب القدر، ولا يركب ممتلئاً بل يؤخر الغذاء إلى وقت النزول، ولا يسافر ممتلئاً من دم أو غيره، ويتدرج في الرياضة ويعتاد السهر والجوع قبل أن يعرضا له {cite:canon-ibn-sina-print-v1 p.261}."
  en: "Ibn Sina notes that the traveller is cut off from habits he kept at home and meets weariness and pain, so he must look to food and fatigue: his food is of good substance and moderate quantity, he does not ride full but puts off the meal until the halt, does not set out full of blood or other matter, and trains gradually in exercise, wakefulness and hunger before they befall him {cite:canon-ibn-sina-print-v1 p.261}."
  fr: "Éloigné de ses habitudes et confronté à fatigue et douleur, le voyageur doit, selon Ibn Sina, soigner alimentation et fatigue : aliments de bonne substance en quantité modérée, repas à l’étape plutôt qu’équitation à satiété, absence de réplétion sanguine ou autre au départ, préparation progressive à exercice, veille et faim {cite:canon-ibn-sina-print-v1 p.261}."
  es: "Ibn Sina señala que el viajero se ve separado de los hábitos que mantenía en casa y se enfrenta al cansancio y al dolor, por lo que debe prestar atención a la comida y la fatiga: su comida es de buena sustancia y en cantidad moderada, no viaja con el estómago lleno sino que pospone la comida hasta la parada, no parte con el estómago lleno de sangre u otra materia, y se entrena gradualmente en ejercicio, vigilia y hambre antes de que le sobrevengan {cite:canon-ibn-sina-print-v1 p.261}."
  ur: "ابن سینا نے لکھا ہے کہ مسافر اپنے گھر میں رہنے والی عادتوں سے کٹ جاتا ہے اور اسے تھکاوٹ اور تکلیف کا سامنا کرنا پڑتا ہے، اس لیے اسے کھانے اور تھکاوٹ کی طرف دیکھنا چاہیے: اس کا کھانا عمدہ اور معتدل مقدار کا ہو، وہ سواری سے بھر پور نہیں ہوتا بلکہ کھانا رکنے تک چھوڑ دیتا ہے، خون یا دیگر چیزوں سے بھرا ہوا نہیں نکلتا، اور اسے مشقت اور مشقت سے پہلے بتدریج تربیت دیتا ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 261}۔"
