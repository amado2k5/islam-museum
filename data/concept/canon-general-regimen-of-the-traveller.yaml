label: { ar: "التدبير الكلي للمسافر عند ابن سينا", en: "The general regimen of the traveller in the Canon", ur: "مسافر کی عمومی تدبیر قانون میں" }
summary:
  ar: "يقرر ابن سينا أن المسافر ينقطع عن عاداته ويصيبه تعب ووصب، فعليه أن يعني بالغذاء والإعياء، فيجعل غذاءه جيد الجوهر قريب القدر، ولا يركب ممتلئاً بل يؤخر الغذاء إلى وقت النزول، ولا يسافر ممتلئاً من دم أو غيره، ويتدرج في الرياضة ويعتاد السهر والجوع قبل أن يعرضا له {cite:canon-ibn-sina-print-v1 p.261}."
  en: "Ibn Sina notes that the traveller is cut off from habits he kept at home and meets weariness and pain, so he must look to food and fatigue: his food is of good substance and moderate quantity, he does not ride full but puts off the meal until the halt, does not set out full of blood or other matter, and trains gradually in exercise, wakefulness and hunger before they befall him {cite:canon-ibn-sina-print-v1 p.261}."
