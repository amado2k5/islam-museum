id: concept/canon-when-an-emetic-purges-and-a-purgative-vomits
class: concept
kind: scientific
label: { ar: "متى يسهل المقيئ ويتقيأ المسهل عند ابن سينا", en: "When an emetic purges and a purgative vomits in the Canon", ur: "قے آور دوا کب مسہل بنتی ہے اور مسہل کب قے آور، قانون میں", es: "Cuando un emético purga y un purgante vomita en el Canon", fr: "Quand un émétique purge et qu'un purgatif vomit dans le Canon" }
summary:
  ar: "يذكر ابن سينا أن الدواء المقيء قد يعود مسهلاً إذا كانت المعدة قوية أو شرب على جوع شديد أو كان الدواء ثقيلاً سريع النزول، وأن المسهل يصير مقيئاً لضعف المعدة أو يبوسة الثقل أو كراهة الدواء، وأن المسهل الذي لم ينضج استفراغه يثير الخلط ويكثره {cite:canon-ibn-sina-print-v1 pp.277-278}."
  en: "Ibn Sina lists when an emetic turns into a purgative, with a strong stomach, a drink taken in great hunger or a heavy fast-descending drug, and when a purgative turns into an emetic, with a weak stomach, dry waste or a repugnant drug, and warns that a purgative that fails to purge stirs the humour and multiplies it {cite:canon-ibn-sina-print-v1 pp.277-278}."
  es: "Ibn Sina enumera cuándo un emético se convierte en purgante, con un estómago fuerte, una bebida tomada con mucha hambre o un medicamento pesado de rápida digestión, y cuándo un purgante se convierte en emético, con un estómago débil, desechos secos o un medicamento repugnante, y advierte que un purgante que no purga agita el humor y lo multiplica {cite:canon-ibn-sina-print-v1 pp.277-278}."
  fr: "Ibn Sina énumère les cas où un émétique se transforme en purgatif, avec un estomac fort, une boisson prise en cas de grande faim ou un médicament lourd à descente rapide, et les cas où un purgatif se transforme en émétique, avec un estomac faible, des déchets secs ou un médicament répugnant, et avertit qu'un purgatif qui ne parvient pas à purger agite l'humeur et la multiplie {cite:canon-ibn-sina-print-v1 pp.277-278}."
  ur: "ابن سینا نے یہ ذکر کیا ہے کہ جب ایک ایمیٹک معدہ کے مضبوط ہونے کے ساتھ، شدید بھوک میں پینے والا مشروب یا تیزی سے اترنے والی دوائی میں تبدیل ہو جاتا ہے، اور جب رفع حاجت کمزور معدہ، خشک فضلہ یا مکروہ دوائی کے ساتھ، رفع حاجت میں بدل جاتا ہے، اور تنبیہ کرتا ہے کہ ایسا رفع حاجت جو صاف کرنے میں ناکام ہو جاتی ہے اسے مزاح اور کثرت سے ابھارتا ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 277-278}۔"
