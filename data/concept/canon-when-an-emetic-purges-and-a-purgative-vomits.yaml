label: { ar: "متى يسهل المقيئ ويتقيأ المسهل عند ابن سينا", en: "When an emetic purges and a purgative vomits in the Canon", ur: "قے آور دوا کب مسہل بنتی ہے اور مسہل کب قے آور، قانون میں" }
summary:
  ar: "يذكر ابن سينا أن الدواء المقيء قد يعود مسهلاً إذا كانت المعدة قوية أو شرب على جوع شديد أو كان الدواء ثقيلاً سريع النزول، وأن المسهل يصير مقيئاً لضعف المعدة أو يبوسة الثقل أو كراهة الدواء، وأن المسهل الذي لم ينضج استفراغه يثير الخلط ويكثره {cite:canon-ibn-sina-print-v1 pp.277-278}."
  en: "Ibn Sina lists when an emetic turns into a purgative, with a strong stomach, a drink taken in great hunger or a heavy fast-descending drug, and when a purgative turns into an emetic, with a weak stomach, dry waste or a repugnant drug, and warns that a purgative that fails to purge stirs the humour and multiplies it {cite:canon-ibn-sina-print-v1 pp.277-278}."
