class: concept
kind: political
label: { ar: "لقب خوارزمشاه", en: "Khwarazmshah (title)", ur: "خوارزم شاہ ⁦(لقب)⁩", es: "Khwarazmshah (título)", fr: "Khwarazmshah (titre)", tr: "Khwarazmshah unvanı", id: "Gelar Khwarazmshah" }
summary:
  ar: "لقب ملوك خوارزم، حمله الأفريغيون والمأمونيون وآل ألتونتاش والأنوشتكينيون، ويضيف إليهم شاهرخ ميرزا إسماعيلوف الأمير الأوغوزي شاه ملك بيتًا خامسًا {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 32} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  en: "Title of the kings of Khwarazm, borne by the Afrighids, Ma'munids, Altuntashids and Anushtegins, to whom Shohruxmirzo Ismoilov adds the Oghuz ruler Shah Malik as a fifth house {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 32} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  ur: "خوارزم کے بادشاہوں کا لقب، جو آفریغیوں، مامونیوں، آلِ آلتونتاش اور انوشتگینیوں نے رکھا، اور شاہرخ میرزا اسماعیلوف ان میں اوغوز حکمران شاہ ملک کو پانچویں خاندان کے طور پر شامل کرتے ہیں {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 32} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}۔"
  es: "Título de los reyes de Khwarazm, a cargo de los afrighids, ma'munids, altuntashids y anushtegins, a quienes Shohruxmirzo Ismoilov añade al gobernante oghuz Shah Malik como quinta casa {cita:ismoilov-xorazmshohlar-tangalari-2025 p. 32} {cita:ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  fr: "Titre des rois du Khwarazm, porté par les Afrighids, Ma'munides, Altuntashids et Anushtegins, auxquels Shohruxmirzo Ismoilov ajoute le souverain Oghuz Shah Malik comme cinquième maison {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 32} {cite: ismoilov-xorazmshohlar-tangalari-2025 p. 224}."
  tr: "Harezm krallarının unvanı Afrighis, Ma'munidler, Altuntalar ve Anuştakinidler ile beşinci hanedanın kralı Oğuz prensi Şah Şahrukh Mirza İsmailov tarafından taşınmıştır {cite:ismoilov-xorazmshohlar-tangalari-2025, s. 32} {cite:ismoilov-xorazmshohlar-tangalari-2025, s. 224}."
  id: "Gelar raja Khwarezm dipegang oleh Afrighi, Ma'munid, Altunta, dan Anushtakinid, serta Shahrukh Mirza Ismailov, pangeran Oghuz Shah, raja rumah kelima {cite:ismoilov-xorazmshohlar-tangalari-2025, hlm. 32} {cite:ismoilov-xorazmshohlar-tangalari-2025, hlm. 224}."
