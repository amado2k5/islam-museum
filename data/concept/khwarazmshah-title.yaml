  ur: "خوارزم کے بادشاہوں کا لقب، جو آفریغیوں، مامونیوں، آلِ آلتونتاش اور انوشتگینیوں نے رکھا، اور شاہرخ میرزا اسماعیلوف ان میں اوغوز حکمران شاہ ملک کو پانچویں خاندان کے طور پر شامل کرتے ہیں {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 32} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 224}۔"
