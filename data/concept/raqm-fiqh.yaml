tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "الرقم"
  en: "Raqm (the marking of a price on goods, and pictures on cloth): sale by the written price, and the decorated cloth"
  ur: "رقم ⁦(قیمت کا نشان)⁩"
  es: "Raqm (la marcación de un precio en los productos y dibujos en la tela): venta por el precio escrito y la tela decorada."
  fr: "Raqm (marquage du prix sur les marchandises et images sur les tissus): vente au prix indiqué et au tissu décoré"
  tr: "Sayı"
  id: "Jumlah"
summary:
  ar: "الرقم في الأصل وشي الثوب، ويطلق على العلامة التي يُعرف بها مقدار ما يقع به البيع، أو على الثمن المكتوب على الثوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} والبيع بالرقم صحيح إذا علم الطرفان قدره، وإذا جهلاه فسد عند الجمهور، وإذا علم الجاهل قبل الافتراق صح عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941} وورد في الحديث النهي عن الصور في البيوت، واستثناء الرقم في الثوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
  en: "Raqm in the lexicon is the weaving of cloth; technically it is the mark that shows the price for which a sale takes place, or the price written on the cloth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} A sale by the written price is valid when both know the price; when both are ignorant it is void according to the majority, and the Hanbalis hold it valid if the ignorant party learns the price before they part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941} A hadith forbids images in houses but excepts a mark on cloth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
  ur: "رقم کپڑے یا سامان پر لکھی قیمت کی علامت ہے؛ دونوں کے علم کے ساتھ اس پر بیع درست ہے، اور لاعلمی میں جمہور کے نزدیک بیع فاسد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
  es: "Raqm en el léxico es el tejido de tela; técnicamente es la marca que muestra el precio por el cual se realiza una venta, o el precio escrito en la tela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} Una venta por precio escrito es válida cuando ambas partes conocen el precio; cuando ambas lo ignoran es nula según la mayoría, y los Hanbalis la consideran válida si la parte ignorante se entera del precio antes de separarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941} Un hadiz prohíbe las imágenes en las casas pero exceptúa una marca en la tela. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
  fr: "Le terme « raqm » désigne, dans le lexique, le tissage d'un tissu; techniquement, il s'agit de la marque indiquant le prix d'une vente, ou du prix inscrit sur le tissu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} Une vente au prix inscrit est valable lorsque les deux parties connaissent le prix; si elles l'ignorent, elle est nulle selon la majorité, tandis que les Hanbalites la considèrent valable si la partie ignorante apprend le prix avant la transaction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941} Un hadith interdit les images dans les maisons, mais autorise une marque sur un tissu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
  tr: "Numara aslında giysiyi işaretler ve satış tutarını veya giysinin üzerindeki fiyatı belirtmek için kullanılan işareti ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8940} Her iki taraf da değerini biliyorsa numara ile satışa göre geçerlidir; cahillerse çoğunluğa göre geçersizdir; cahil kişi ayrılmadan önce biliyorsa, Hanbali'ye göre geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8941} Hadis, kıyafetlerdeki sayı hariç evlerde resimleri yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8941}"
  id: "Angka tersebut awalnya menandai pakaian, dan merujuk pada tanda yang digunakan untuk menunjukkan jumlah penjualan atau harga yang tertulis pada pakaian tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8940} Penjualan berdasarkan angka sah jika kedua pihak mengetahui nilainya; jika mereka tidak tahu, maka dianggap tidak sah menurut mayoritas; jika orang yang tidak tahu sebelum perpisahan, maka sah menurut Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8941} Hadis melarang gambar di rumah, kecuali nomor pada pakaian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
