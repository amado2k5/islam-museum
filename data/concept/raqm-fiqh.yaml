label:
  ar: "الرقم"
  en: "Raqm (the marking of a price on goods, and pictures on cloth): sale by the written price, and the decorated cloth"
  ur: "رقم (قیمت کا نشان)"
summary:
  ar: "الرقم في الأصل وشي الثوب، ويطلق على العلامة التي يُعرف بها مقدار ما يقع به البيع، أو على الثمن المكتوب على الثوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} والبيع بالرقم صحيح إذا علم الطرفان قدره، وإذا جهلاه فسد عند الجمهور، وإذا علم الجاهل قبل الافتراق صح عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941} وورد في الحديث النهي عن الصور في البيوت، واستثناء الرقم في الثوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
  en: "Raqm in the lexicon is the weaving of cloth; technically it is the mark that shows the price for which a sale takes place, or the price written on the cloth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} A sale by the written price is valid when both know the price; when both are ignorant it is void according to the majority, and the Hanbalis hold it valid if the ignorant party learns the price before they part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941} A hadith forbids images in houses but excepts a mark on cloth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
  ur: "رقم کپڑے یا سامان پر لکھی قیمت کی علامت ہے؛ دونوں کے علم کے ساتھ اس پر بیع درست ہے، اور لاعلمی میں جمہور کے نزدیک بیع فاسد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8941}"
