label:
  ar: "العَمَى"
  en: "Blindness (ama): capacity, worship, testimony and contract"
  ur: "نابینائی (عمی)"
summary:
  ar: "العمى في اللغة ذهاب البصر كله، ويطلق على ذهاب البصيرة. ولا خلاف بين الفقهاء في أن العمى لا يزيل الأهلية، فلا تسقط عن الأعمى التكاليف إلا ما أسقطه عذر أو ضرر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. وتجب الجمعة على الأعمى عند جمهور الفقهاء إذا كان يهتدي بنفسه أو وجد من يقوده، وقال أبو حنيفة لا تجب عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803}. وفي أذان الأعمى وإمامته خلاف، فكرهه الشافعية والحنابلة في الأذان إلا مع بصير يعلمه الوقت، وأجازه المالكية، وكره الحنفية والحنابلة إمامته للصلاة إلا إن كان أعلم القوم، {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. ولا تقبل شهادة الأعمى على ما يُرى، وتقبل فيما يُدرك بالذوق والشم واللمس والسماع في بعض الأقوال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. وصح بيع الأعمى بالصفة عند الحنفية والحنابلة والمالكية، ومنعه الشافعية في العقود التي يشترط فيها الرؤية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. ويصح لعان الأعمى بزنا تيقنه بلمس أو سماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}."
  en: "In the lexicon, ama is the loss of sight, and it is also used for loss of insight. The jurists agree that blindness does not remove legal capacity, and obligations fall away only where an excuse or harm requires it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. Most jurists hold that the Friday prayer is obligatory on the blind man who can guide himself or has a guide; Abu Hanifa holds it not obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803}. On the call to prayer and leading the prayer the schools differ: the Shafi'is and Hanbalis dislike the blind man calling the prayer unless a sighted person tells him the time, the Malikis allow it; the Hanafis and Hanbalis dislike his leading the prayer unless he is the most learned, {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. The testimony of a blind man is not accepted for what is seen, but is accepted for what is touched, smelt, tasted or heard in some views {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. The sale of a blind man by description is valid for the Hanafis, Malikis and Hanbalis, while the Shafi'is forbid contracts that require sight {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. A blind man may validly swear lian for an adultery he is sure of by touch or hearing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}."
