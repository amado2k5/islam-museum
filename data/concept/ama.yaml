label:
  ar: "العَمَى"
  en: "Blindness (ama): capacity, worship, testimony and contract"
  fr: "Cécité (ama) : capacité juridique, culte, témoignage et contrat"
  ur: "نابینائی ⁦(عمی)⁩"
  es: "Ceguera (ama): capacidad, culto, testimonio y contrato"
summary:
  ar: "العمى في اللغة ذهاب البصر كله، ويطلق على ذهاب البصيرة. ولا خلاف بين الفقهاء في أن العمى لا يزيل الأهلية، فلا تسقط عن الأعمى التكاليف إلا ما أسقطه عذر أو ضرر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. وتجب الجمعة على الأعمى عند جمهور الفقهاء إذا كان يهتدي بنفسه أو وجد من يقوده، وقال أبو حنيفة لا تجب عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803}. وفي أذان الأعمى وإمامته خلاف، فكرهه الشافعية والحنابلة في الأذان إلا مع بصير يعلمه الوقت، وأجازه المالكية، وكره الحنفية والحنابلة إمامته للصلاة إلا إن كان أعلم القوم، {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. ولا تقبل شهادة الأعمى على ما يُرى، وتقبل فيما يُدرك بالذوق والشم واللمس والسماع في بعض الأقوال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. وصح بيع الأعمى بالصفة عند الحنفية والحنابلة والمالكية، ومنعه الشافعية في العقود التي يشترط فيها الرؤية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. ويصح لعان الأعمى بزنا تيقنه بلمس أو سماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}."
  en: "In the lexicon, ama is the loss of sight, and it is also used for loss of insight. The jurists agree that blindness does not remove legal capacity, and obligations fall away only where an excuse or harm requires it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. Most jurists hold that the Friday prayer is obligatory on the blind man who can guide himself or has a guide; Abu Hanifa holds it not obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803}. On the call to prayer and leading the prayer the schools differ: the Shafi'is and Hanbalis dislike the blind man calling the prayer unless a sighted person tells him the time, the Malikis allow it; the Hanafis and Hanbalis dislike his leading the prayer unless he is the most learned, {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. The testimony of a blind man is not accepted for what is seen, but is accepted for what is touched, smelt, tasted or heard in some views {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. The sale of a blind man by description is valid for the Hanafis, Malikis and Hanbalis, while the Shafi'is forbid contracts that require sight {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. A blind man may validly swear lian for an adultery he is sure of by touch or hearing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}."
  fr: "Dans le lexique, ama désigne la perte de la vue ; le terme s’emploie aussi pour la perte du discernement. Les juristes s’accordent à dire que la cécité ne supprime pas la capacité juridique et que seules les obligations pour lesquelles un empêchement ou un préjudice le justifie sont levées {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. Pour la plupart des juristes, la prière du vendredi est obligatoire pour un homme aveugle qui peut s’orienter seul ou dispose d’un guide ; Abu Hanifa ne la juge pas obligatoire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803}. Les écoles divergent sur l’appel à la prière et sur la direction de la prière : les chaféites et les hanbalites déconseillent qu’un homme aveugle fasse l’appel à moins qu’une personne voyante ne lui indique l’heure ; les malikites le permettent. Les hanafites et les hanbalites déconseillent qu’il dirige la prière, sauf s’il est le plus savant {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. Son témoignage n’est pas admis pour les faits constatés par la vue, mais certains avis l’admettent pour ceux qu’il connaît par le toucher, l’odorat, le goût ou l’ouïe {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. La vente sur description qu’il conclut est valable pour les hanafites, les malikites et les hanbalites, tandis que les chaféites interdisent les contrats qui exigent la vue {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. Il peut valablement prêter le serment de li‘an pour un adultère dont le toucher ou l’ouïe lui donnent la certitude {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}."
  es: "En el léxico, ama es la pérdida de la vista, y también se usa para la pérdida de la intuición. Los juristas coinciden en que la ceguera no elimina la capacidad legal, y las obligaciones caducan solo cuando una excusa o daño lo requiere {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. La mayoría de los juristas sostienen que la oración del viernes es obligatoria para el ciego que puede guiarse a sí mismo o tiene un guía; Abu Hanifa sostiene que no es obligatoria {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11803}. En cuanto a la llamada a la oración y la dirección de la oración, las escuelas difieren: los shafi'is y los hanbalis desaprueban que el ciego llame a la oración a menos que una persona vidente le diga la hora, los malikíes lo permiten; Los hanafíes y hanbalíes desaprueban que dirija la oración a menos que sea el más erudito, {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. El testimonio de un ciego no se acepta por lo que se ve, sino por lo que se toca, huele, saborea u oye en algunas opiniones {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804}. La venta de un ciego por descripción es válida para los hanafíes, malikíes y hanbalíes, mientras que los shafiíes prohíben los contratos que requieren la vista {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11804} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. Un hombre ciego puede jurar válidamente por un adulterio del que esté seguro por el tacto o el oído {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}."
