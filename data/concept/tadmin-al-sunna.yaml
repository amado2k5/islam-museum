id: concept/tadmin-al-sunna
class: concept
kind: legal
label:
  ar: "تضمين الصنّاع ⁦(ضمان الأجير المشترك)⁩"
  en: "Liability of craftsmen (the common hired worker)"
  ur: "کاری گروں کا ضمان ⁦(اجیرِ مشترک کی ذمہ داری)⁩"
term: { ar: "تضمين الصُّنّاع، الأجير المشترك", en: "tadmin al-sunna'" }
summary:
  ar: "مسألة: إذا هلك المتاع عند الخياط أو القصّار أو الصبّاغ أو الغسّال ونحوهم من غير جناية منهم، فهل يضمنونه؟ ينقل الشافعي في «اختلاف العراقيين» أن أبا حنيفة لا يضمّنهم إلا فيما جنت أيديهم، وأن ابن أبي ليلى يضمّنهم، وأن أبا يوسف يضمّنهم إلا أن يجيء شيء غالب، ويرى الشافعي أنه لا يصح فيها إلا أحد قولين: أن يضمن كل من أخذ أجراً، أو ألا يضمن بحال كالوديعة، ويذكر أن ما روي عن علي وعمر في التضمين لا يثبت عند أهل الحديث. {cite:kitab-al-umm-wafa-v8 p.217} {cite:kitab-al-umm-wafa-v8 p.218}"
  en: "The question: if goods are lost with a tailor, fuller, dyer, washer or similar worker without his fault, is he liable? Al-Shafi'i reports in the Disagreement of the Iraqis that Abu Hanifa held them liable only for what their hands damaged, Ibn Abi Layla held them liable, and Abu Yusuf held them liable unless something overwhelming happened; al-Shafi'i holds that only one of two views is coherent, that whoever takes a wage is liable, or that none is liable at all, as with a deposit, and notes that the reports from Ali and Umar on liability are not established by the hadith scholars."
  ur: "مسئلہ: اگر درزی، دھوبی، رنگریز وغیرہ کے پاس سامان ان کی کسی زیادتی کے بغیر ضائع ہو جائے تو کیا وہ ضامن ہیں؟ امام شافعی «اختلاف العراقیین» میں نقل کرتے ہیں کہ امام ابو حنیفہ انہیں صرف اس کا ضامن ٹھہراتے ہیں جو ان کے ہاتھوں سے خراب ہو، ابن ابی لیلیٰ انہیں ضامن ٹھہراتے ہیں، اور ابو یوسف ضامن ٹھہراتے ہیں سوائے اس کے کہ کوئی غالب آفت آ جائے؛ امام شافعی کی رائے میں اس میں دو ہی قول درست ہو سکتے ہیں: یا تو جو اجرت لے وہ ضامن ہے، یا امانت کی طرح کسی حال میں ضامن نہیں؛ اور وہ بتاتے ہیں کہ علی اور عمر سے تضمین کی روایات اہلِ حدیث کے نزدیک ثابت نہیں۔"
wings: [ideas, made]
themes: [law-and-courts, trade-and-finance]
regions: [global]
issue:
  ar: "هل يضمن الصانع المتاع إذا هلك عنده بغير جنايته؟"
  en: "Is a craftsman liable for goods lost with him without his fault?"
  ur: "کیا کاری گر اس سامان کا ضامن ہے جو اس کی زیادتی کے بغیر اس کے پاس ضائع ہو جائے؟"
perspectives:
  - tradition: sunni-hanafi
    id: abu-hanifa
    stance: { ar: "لا ضمان إلا فيما جنت يده", en: "No liability except for what his hand damaged", ur: "صرف اپنے ہاتھ کی زیادتی کا ضمان" }
    summary:
      ar: "أبو حنيفة كما ينقله الشافعي: لا ضمان على الخياط ولا القصار ولا الصباغ إلا فيما جنت أيديهم، وبلغه عن علي أنه قال لا ضمان عليهم. {cite:kitab-al-umm-wafa-v8 p.217}"
      en: "Abu Hanifa, as al-Shafi'i reports: no liability on the tailor, fuller or dyer except for what their hands damaged; a report reached him from Ali that they bear no liability."
      ur: "امام ابو حنیفہ، جیسا کہ امام شافعی نقل کرتے ہیں: درزی، دھوبی اور رنگریز پر کوئی ضمان نہیں سوائے اس کے جو ان کے ہاتھوں سے خراب ہو؛ ان تک علی سے روایت پہنچی کہ ان پر ضمان نہیں۔"
    holders: [person/abu-hanifa]
    sources: [source/kitab-al-umm-wafa-v8]
  - tradition: sunni-hanafi
    id: abu-yusuf
    stance: { ar: "يضمنون إلا أن يجيء شيء غالب", en: "Liable unless something overwhelming happens", ur: "ضامن ہیں سوائے غالب آفت کے" }
    summary:
      ar: "أبو يوسف كما في الكتاب: هم ضامنون إلا أن يجيء شيء غالب. {cite:kitab-al-umm-wafa-v8 p.217}"
      en: "Abu Yusuf, as in the book: they are liable unless something overwhelming happens."
      ur: "ابو یوسف، جیسا کہ کتاب میں ہے: وہ ضامن ہیں سوائے اس کے کہ کوئی غالب آفت آ جائے۔"
    holders: [person/abu-yusuf-al-qadi]
    sources: [source/kitab-al-umm-wafa-v8]
  - tradition: sunni
    id: ibn-abi-layla
    stance: { ar: "يضمنون ما هلك عندهم", en: "Liable for what is lost with them", ur: "جو ان کے پاس ضائع ہو اس کے ضامن" }
    summary:
      ar: "ابن أبي ليلى كما ينقله الشافعي: هم ضامنون لما هلك عندهم وإن لم تجن أيديهم فيه؛ ويذكر الشافعي أن شريحاً ضمّن قصّاراً احترق بيته. {cite:kitab-al-umm-wafa-v8 p.217} {cite:kitab-al-umm-wafa-v8 p.218}"
      en: "Ibn Abi Layla, as al-Shafi'i reports: they are liable for what is lost with them even if their hands did nothing to it; al-Shafi'i notes that Shurayh held a fuller liable whose house had burned."
      ur: "ابن ابی لیلیٰ، جیسا کہ امام شافعی نقل کرتے ہیں: جو ان کے پاس ضائع ہو اس کے ضامن ہیں اگرچہ ان کے ہاتھ نے کچھ نہ کیا ہو؛ امام شافعی ذکر کرتے ہیں کہ شریح نے ایک دھوبی کو ضامن ٹھہرایا جس کا گھر جل گیا تھا۔"
    holders: [person/muhammad-ibn-abd-al-rahman-ibn-abi-layla, person/shurayh-al-qadi]
    sources: [source/kitab-al-umm-wafa-v8]
  - tradition: sunni-shafii
    id: shafii
    stance: { ar: "لا يصح إلا أحد قولين: ضمان كل أجير أو لا ضمان", en: "Only two coherent views: every paid worker is liable, or none is", ur: "دو ہی قول درست: ہر اجیر ضامن، یا کوئی نہیں" }
    summary:
      ar: "الشافعي: سواء ضاع المتاع بغرق أو حرق أو سرقة، فلا يجوز فيه إلا أحد قولين: أن يضمن كل من أخذ أجراً، ومن قاله قاسه على العارية، أو ألا يضمن بحال كالوديعة؛ ويعترض على القياس بالعارية بأن المستعير ينتفع بالشيء نفسه بلا عوض، والصانع ليس كذلك. {cite:kitab-al-umm-wafa-v8 p.217} {cite:kitab-al-umm-wafa-v8 p.218}"
      en: "Al-Shafi'i: whether goods are lost by drowning, fire or theft, only one of two views can hold: that whoever takes a wage is liable, which its holders draw by analogy from a loan for use, or that none is liable, as with a deposit; he objects to the analogy with a loan for use that the borrower benefits from the thing itself without payment, which is not the craftsman's case."
      ur: "امام شافعی: سامان ڈوبنے، جلنے یا چوری سے ضائع ہو، اس میں دو ہی قول جائز ہیں: یا جو اجرت لے وہ ضامن ہے، جسے اس کے قائلین عاریت پر قیاس کرتے ہیں، یا امانت کی طرح کسی حال میں ضامن نہیں؛ وہ عاریت پر قیاس پر اعتراض کرتے ہیں کہ عاریت لینے والا خود چیز سے بلا عوض نفع اٹھاتا ہے، اور کاری گر ایسا نہیں۔"
