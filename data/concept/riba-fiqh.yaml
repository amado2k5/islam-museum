id: concept/riba-fiqh
class: concept
kind: legal
label:
  ar: "الربا (في الفقه)"
  en: "Riba in the rulings: the forbidden excess in exchange and in delay, its kinds, its causes and its rulings"
  ur: "ربا (فقہی احکام)"
summary:
  ar: "الربا في اللغة الزيادة، وفي اصطلاح الفقهاء زيادة في أحد العوضين في المعاوضة أو زيادة في الدين مقابل الأجل، وعبارات المذاهب متفاوتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8574} وهو محرم بالكتاب والسنة والإجماع، من الكبائر، وعُدّ من الموبقات السبع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8576} قسم الحنفية والمالكية والحنابلة الربا في البيع إلى ربا الفضل وربا النسيئة، وقسمه الشافعية إلى ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8582} الأعيان الستة المنصوص عليها هي الذهب والفضة والبر والشعير والتمر والملح، وعدّى عامة الفقهاء الحكم إلى ما وجدت فيه العلة، واختلفت العلل بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8592} وعُدّ من مسائله بيع العينة والمحاقلة والمزابنة ومسألة مد عجوة، والربا في دار الحرب، وفيها خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600}"
  en: "Riba is excess in the lexical sense; in the jurists' usage it is an excess on one of two counter-values in an exchange, or an excess on a debt in return for delay, and the schools define it differently. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8574} It is forbidden by the Qur'an, the Sunna and consensus, is a major sin, and is counted among the seven destructive sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8576} The Hanafis, Malikis and Hanbalis divide riba of sale into excess and delay, and the Shafi'is into three kinds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8582} The six items named in the hadith are gold, silver, wheat, barley, dates and salt; most jurists extend the rule to other items sharing its cause, and the schools differ on that cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8592} Related questions include 'inah, muhaqala and muzabana, the mud 'ajwa case, and riba in the abode of war, where the jurists differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600}"
  ur: "ربا لغت میں زیادتی ہے، اور فقہاء کی اصطلاح میں ایسی زیادتی جو عوض کے تبادلے میں ہو یا مدت کے بدلے قرض پر ہو، جو حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8575}"
