label:
  ar: "الربا ⁦(في الفقه)⁩"
  en: "Riba in the rulings: the forbidden excess in exchange and in delay, its kinds, its causes and its rulings"
  ur: "ربا ⁦(فقہی احکام)⁩"
  es: "La usura en las resoluciones judiciales: el exceso prohibido en el intercambio y en la demora, sus tipos, sus causas y sus resoluciones."
  fr: "Le riba dans les décisions: l’excès interdit dans l’échange et le retard, ses types, ses causes et ses décisions"
  tr: "Tefecilik (Fıkıh'ta)"
  id: "Riba (dalam Jurisprudensi)"
summary:
  ar: "الربا في اللغة الزيادة، وفي اصطلاح الفقهاء زيادة في أحد العوضين في المعاوضة أو زيادة في الدين مقابل الأجل، وعبارات المذاهب متفاوتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8574} وهو محرم بالكتاب والسنة والإجماع، من الكبائر، وعُدّ من الموبقات السبع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8576} قسم الحنفية والمالكية والحنابلة الربا في البيع إلى ربا الفضل وربا النسيئة، وقسمه الشافعية إلى ثلاثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8582} الأعيان الستة المنصوص عليها هي الذهب والفضة والبر والشعير والتمر والملح، وعدّى عامة الفقهاء الحكم إلى ما وجدت فيه العلة، واختلفت العلل بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8592} وعُدّ من مسائله بيع العينة والمحاقلة والمزابنة ومسألة مد عجوة، والربا في دار الحرب، وفيها خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600}"
  en: "Riba is excess in the lexical sense; in the jurists' usage it is an excess on one of two counter-values in an exchange, or an excess on a debt in return for delay, and the schools define it differently. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8574} It is forbidden by the Qur'an, the Sunna and consensus, is a major sin, and is counted among the seven destructive sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8576} The Hanafis, Malikis and Hanbalis divide riba of sale into excess and delay, and the Shafi'is into three kinds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8582} The six items named in the hadith are gold, silver, wheat, barley, dates and salt; most jurists extend the rule to other items sharing its cause, and the schools differ on that cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8592} Related questions include 'inah, muhaqala and muzabana, the mud 'ajwa case, and riba in the abode of war, where the jurists differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600}"
  ur: "ربا لغت میں زیادتی ہے، اور فقہاء کی اصطلاح میں ایسی زیادتی جو عوض کے تبادلے میں ہو یا مدت کے بدلے قرض پر ہو، جو حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8575}"
  es: "Riba es exceso en el sentido léxico; en el uso de los juristas es un exceso en uno de dos contravalores en un intercambio, o un exceso en una deuda a cambio de una demora, y las escuelas lo definen de manera diferente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8574} Está prohibido por el Corán, la Sunnah y el consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8575} Los hanafíes, malikíes y hanbalíes dividen la riba de la venta en exceso y demora, y los shafiíes en tres tipos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8582} Los seis elementos mencionados en el hadiz son oro, plata, trigo, cebada, dátiles y sal; la mayoría de los juristas extienden la regla a otros elementos que comparten su causa, y las escuelas difieren en esa causa. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8585} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8587} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8589} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8592} Las preguntas relacionadas incluyen 'inah, muhaqala y muzabana, el caso mud 'ajwa y riba en la morada de la guerra, donde los juristas difieren. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8596} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8599} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600}"
  fr: "Le riba, au sens littéral, désigne un excès; en droit juridique, il s'agit d'un excès sur l'une des deux contreparties d'un échange, ou d'un excès sur une dette en contrepartie d'un délai de paiement. Les écoles de pensée le définissent différemment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8574} Il est interdit par le Coran, la Sunna et le consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8575} Les écoles hanafite, malikite et hanbalite distinguent le riba de la vente en excès et en retard, tandis que l'école chaféite en distingue trois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8582} Les six éléments mentionnés dans le hadith sont l'or, l'argent, le blé, l'orge, les dattes et le sel; la plupart des juristes étendent la règle à d'autres éléments partageant sa cause, et les écoles divergent sur cette cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8592} Les questions connexes incluent 'inah, muhaqala et muzabana, le cas de la boue 'ajwa et le riba dans le lieu de la guerre, où les juristes diffèrent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8600}"
  tr: "Dilbilimde riba artış anlamına gelirken, hukuk terminolojisinde ise iki tazminattan birinin karşılığında veya belirli bir süre karşılığında borcun artması anlamına gelir. Düşünce okullarının ifadeleri farklılık gösterir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8574} ve Kur'an, Sünnet ve uzlaşma tarafından yasaktır, büyük günahlardan biri ve yedi ölümcül felaketten biridir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8576} Hanefiler, Malikiler ve Hanbaliler tefeciliği satışta lütuf ve nis'ah tefeciliği olarak ikiye bölmüş, Şafi'ler ise bunu üçe bölmüştür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8582} Belirtilen altı madde altın, gümüş, arpa, arpa, hurma ve tuzdur. Hukukçuların çoğunluğu kararı nedenin ne olduğuna genişletmiş ve nedenler okullar arasında farklılık göstermektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8592} Konuları arasında örnek satışı, muhaqqala, mazabanah, Ajwa'nın uzatılması meselesi ve savaş ülkesinde tefecilik yer aldı ve bu konularda anlaşmazlıklar vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8600}"
  id: "Dalam linguistik, riba berarti kenaikan, dan dalam terminologi yurisprudensi, berarti peningkatan salah satu dari dua kompensasi sebagai imbalan atau peningkatan utang sebagai imbalan untuk jangka waktu tetap. Ungkapan aliran pemikiran bervariasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8574} dan dilarang oleh Al-Qur'an, Sunnah, dan konsensus, salah satu dosa besar, dan salah satu dari tujuh bencana mematikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8576} Hanafi, Maliki, dan Hanbal membagi riba dalam penjualan menjadi riba rahmat dan riba nis'ah, dan Shafi'i membaginya menjadi tiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8582} Enam item yang ditentukan adalah emas, perak, jelai, jelai, kurma, dan garam. Mayoritas ahli hukum telah memperluas putusan ini ke apa yang ditemukan, dan alasannya berbeda antar aliran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8592} Ia mencantumkan di antara isu-isu tersebut adalah penjualan sampel, muhaqqala, mazabanah, isu perluasan Ajwa, dan riba di tanah perang, dan ada perbedaan pendapat mengenai hal-hal tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8600}"
