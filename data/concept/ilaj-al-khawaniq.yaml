summary:
  ar: "علاج الذبح والخوانيق وكل اختناق من كل سبب: أما الحار فيبدأ فيه بالفصد ولا يخرج الدم الكثير دفعة وخصوصاً إذا أخذت القوة في الضعف بل يؤخذ بالتفاريق المتوالية إلى اليوم الثالث ويجب أن يراعى فيه حفظ القوة ودفع الغشي وخصوصاً وهم مؤاخذون بتقليل الغذاء، وربما كان سبب غلبة الورم احتباساً لا سيما من معتاد كدم حيض ودم بواسير فيجب أن يكون الفصد من جانب يجذب إلى الجهة التي وقع عنها الاحتباس كما يجب ههنا من فصد ما وصف، وإن كان الخناق ليس بمشاركة من امتلاء البدن كله بل كانت الفضلة في ناحية الحلق فقط جاز أن لا يفصد ويمنع الغذاء ليستعمل بدنه دمه في الاغتذاء ويصرفه عن جهة الورم ثم يقبل على التحليل والإنضاج ⁦(الفصد وأوعيته محمولة كما سماها الكتاب لا عملية)⁩ {cite:canon-ibn-sina-print-v2 p.292}"
  en: "The treatment of the strangling and the quinsies and every suffocation from every cause: in the hot one venesection is begun with, and not much blood is taken out at once — above all when the strength has begun to weaken — rather it is taken in repeated successive lettings to the third day, and preserving the strength and fending off faintness must be watched, they being bound to lessened food. The tumour's prevailing may come of a retention, above all of an accustomed one like menses-blood or piles-blood; then the venesection must be from a side drawing toward the quarter from which the retention lapsed, as is required here of the named vein. And if the quinsy is not by sharing of the whole body's fullness but the residue is in the throat's quarter only, it is allowable not to bleed; food is withheld so the body uses its blood in nourishment and spends it away from the tumour's quarter, then one turns to resolving and ripening (the venesection and its vessels carried as the book names them, not a procedure) {cite:canon-ibn-sina-print-v2 p.292}"
  ur: "ذبح اور خناق اور ہر سبب کی ہر گھٹن کا علاج: گرم میں آغاز فصد سے ہوتا ہے اور ایک دم میں زیادہ خون نہیں نکالا جاتا — خصوصاً جب قوت کمزور ہونے لگی ہو — بلکہ تیسرے دن تک مسلسل مرتبہ وار نکالا جاتا ہے اور قوت کے بچاؤ اور غشی کی دفع کا لحاظ رکھا جاتا ہے اور وہ کم خوراک کے پابند ہوتے ہیں؛ سوجن کی غلبہ کا سبب کبھی احتباس ہوتا ہے خصوصاً معمول کا جیسے حیض کا خون یا بواسیر کا خون؛ تو فصد اس طرف سے ہونا چاہیے جو اس جانب کھینچے جہاں سے احتباس ہوا جیسے یہاں بیان کردہ رگ کا فصد مقصود ہے؛ اور اگر خناق پورے بدن کے امتلاء کی مشارکت سے نہ ہو بلکہ فضل صرف حلق کی طرف ہو تو فصد نہ کرنا جائز ہے اور خوراک روکی جائے کہ بدن اپنا خون غذائیت میں استعمال کرے اور اسے سوجن کی طرف سے ہٹائے، پھر تحلیل اور پکانے کی طرف آیا جائے ⁦(فصد اور اس کی رگیں کتاب کے نام پر محمول، طریقہ نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.292}"
  es: "El tratamiento de la estrangulación y los amigdalitis y toda asfixia de cualquier causa: en la caliente se comienza con la flebotomía, y no se extrae mucha sangre de una vez, sobre todo cuando la fuerza ha comenzado a debilitarse, sino que se extrae en repetidas extracciones sucesivas hasta el tercer día, y se debe vigilar la conservación de la fuerza y evitar el desmayo, estando obligados a comer menos. El tumor predominante puede ser por una retención, sobre todo de una habitual como la sangre menstrual o la sangre de las hemorroides; entonces la flebotomía debe hacerse desde un lado tirando hacia el cuadrante del que cesó la retención, como se requiere aquí de la vena indicada. Y si la amigdalitis no es por compartir la plenitud de todo el cuerpo sino que el residuo está solo en el cuadrante de la garganta, está permitido no sangrar; Se retiene la comida para que el cuerpo use su sangre para nutrirse y la gaste lejos del área del tumor, luego se procede a la resolución y maduración (la venopunción y sus vasos se llevan como los llama el libro, no como un procedimiento) {cite:canon-ibn-sina-print-v2 p.292}"
  fr: "Le traitement de l'étranglement, des angines et de toute suffocation, quelle qu'en soit la cause: en cas de forte fièvre, on commence par une saignée, en ne prélevant qu'une petite quantité de sang en une seule fois – surtout lorsque le patient commence à faiblir – mais plutôt par saignées successives jusqu'au troisième jour. Il faut veiller à maintenir le patient en bonne santé et à prévenir tout évanouissement, en lui imposant une alimentation réduite. La tumeur peut être due à une rétention, surtout une rétention habituelle comme le sang des menstrues ou des hémorroïdes; dans ce cas, la saignée doit être pratiquée du côté où la rétention s'est produite, comme indiqué ici pour la veine mentionnée. Et si l'angine ne provient pas d'une accumulation de sang dans tout le corps, mais que le résidu se situe uniquement dans la région de la gorge, il n'est pas nécessaire de la faire saigner. On prive le corps de nourriture afin qu'il utilise son sang pour se nourrir et l'éloigne de la zone affectée par la tumeur; ensuite, on passe à la résolution et à la maturation (la saignée et ses vaisseaux sont décrits dans le livre, il ne s'agit pas d'une procédure) {cite:canon-ibn-sina-print-v2 p.292}"
  tr: "Kesim, boğulma ve herhangi bir nedenle boğulma tedavisi: Sıcak vakalarda flebitoma ile başlar ve aşırı kan aniden akmaz, özellikle güç zayıfladığında, üçüncü güne kadar ardışık aralıklarla alınır. Gücü korumak ve bayılmayı önlemek gerekir, özellikle beslenmenin azalmasından sorumlu tutuldukları için. Tümör baskınlığının nedeni, özellikle adet kanı veya hemoroid kanamasına alışkın olanlarda tutulma olabilir. Flebitom, tıkanıklığın oluştuğu bölgeye doğru çekilen tarafta olmalıdır, burada da yapılması gerektiği gibi Anlatılanları reddetti; balgam tüm vücudun dolgunluğundan değil, sadece atık boğaz bölgesinde olsa da, yiyeceği almak ve tutmamak caizdir; böylece vücudu kanını ıslatmak için kullanır ve tümörün yanından uzaklaştırır, ardından analiz ve olgunlaşmaya geçer (flebit ve damarları kitapta belirtildiği gibi taşınır, bir süreç değil) {cite:canon-ibn-sina-print-v2 s.292}"
  id: "Pengobatan untuk penyembelihan, sesak napas, dan penyebab tersedak apa pun: Untuk kasus panas, dimulai dengan flesitoma dan darah berlebihan tidak mengalir secara tiba-tiba, terutama jika kekuatan melemah, melainkan diminum secara bertahap hingga hari ketiga. Perlu menjaga kekuatan dan mencegah pingsan, terutama karena mereka disalahkan sebagai penyebab mengurangi nutrisi. Mungkin penyebab dominasi tumor adalah retensi, terutama dari mereka yang terbiasa dengan darah menstruasi atau pendarahan wasir. Phlebitoma harus berada di sisi yang menarik ke arah area tempat penyumbatan terjadi, seperti yang harus dilakukan di sini Ia menolak apa yang dijelaskan, meskipun dahak bukan disebabkan oleh seluruh tubuh yang penuh, melainkan hanya limbah yang berada di area tenggorokan, diperbolehkan untuk tidak mengambil dan menahan makanan sehingga tubuhnya menggunakan darahnya untuk merendam dan mengalihkannya dari sisi tumor lalu melanjutkan analisis dan pematangan (flebitis dan pembuluh darahnya dibawa seperti yang disebut buku, bukan proses) {cite:canon-ibn-sina-print-v2 hlm.292}"
