label:
  ar: "علاج الذبح والخوانيق"
  en: "The treatment of the strangling and the quinsies"
  ur: "ذبح اور خناق کا علاج"
summary:
  ar: "علاج الذبح والخوانيق وكل اختناق من كل سبب: أما الحار فيبدأ فيه بالفصد ولا يخرج الدم الكثير دفعة وخصوصاً إذا أخذت القوة في الضعف بل يؤخذ بالتفاريق المتوالية إلى اليوم الثالث ويجب أن يراعى فيه حفظ القوة ودفع الغشي وخصوصاً وهم مؤاخذون بتقليل الغذاء، وربما كان سبب غلبة الورم احتباساً لا سيما من معتاد كدم حيض ودم بواسير فيجب أن يكون الفصد من جانب يجذب إلى الجهة التي وقع عنها الاحتباس كما يجب ههنا من فصد ما وصف، وإن كان الخناق ليس بمشاركة من امتلاء البدن كله بل كانت الفضلة في ناحية الحلق فقط جاز أن لا يفصد ويمنع الغذاء ليستعمل بدنه دمه في الاغتذاء ويصرفه عن جهة الورم ثم يقبل على التحليل والإنضاج ⁦(الفصد وأوعيته محمولة كما سماها الكتاب لا عملية)⁩ {cite:canon-ibn-sina-print-v2 p.292}"
  en: "The treatment of the strangling and the quinsies and every suffocation from every cause: in the hot one venesection is begun with, and not much blood is taken out at once — above all when the strength has begun to weaken — rather it is taken in repeated successive lettings to the third day, and preserving the strength and fending off faintness must be watched, they being bound to lessened food. The tumour's prevailing may come of a retention, above all of an accustomed one like menses-blood or piles-blood; then the venesection must be from a side drawing toward the quarter from which the retention lapsed, as is required here of the named vein. And if the quinsy is not by sharing of the whole body's fullness but the residue is in the throat's quarter only, it is allowable not to bleed; food is withheld so the body uses its blood in nourishment and spends it away from the tumour's quarter, then one turns to resolving and ripening (the venesection and its vessels carried as the book names them, not a procedure) {cite:canon-ibn-sina-print-v2 p.292}"
  ur: "ذبح اور خناق اور ہر سبب کی ہر گھٹن کا علاج: گرم میں آغاز فصد سے ہوتا ہے اور ایک دم میں زیادہ خون نہیں نکالا جاتا — خصوصاً جب قوت کمزور ہونے لگی ہو — بلکہ تیسرے دن تک مسلسل مرتبہ وار نکالا جاتا ہے اور قوت کے بچاؤ اور غشی کی دفع کا لحاظ رکھا جاتا ہے اور وہ کم خوراک کے پابند ہوتے ہیں؛ سوجن کی غلبہ کا سبب کبھی احتباس ہوتا ہے خصوصاً معمول کا جیسے حیض کا خون یا بواسیر کا خون؛ تو فصد اس طرف سے ہونا چاہیے جو اس جانب کھینچے جہاں سے احتباس ہوا جیسے یہاں بیان کردہ رگ کا فصد مقصود ہے؛ اور اگر خناق پورے بدن کے امتلاء کی مشارکت سے نہ ہو بلکہ فضل صرف حلق کی طرف ہو تو فصد نہ کرنا جائز ہے اور خوراک روکی جائے کہ بدن اپنا خون غذائیت میں استعمال کرے اور اسے سوجن کی طرف سے ہٹائے، پھر تحلیل اور پکانے کی طرف آیا جائے ⁦(فصد اور اس کی رگیں کتاب کے نام پر محمول، طریقہ نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.292}"
