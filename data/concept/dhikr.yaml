label:
  ar: الذكر
  en: Remembrance of God (dhikr)
summary:
  ar: "الذكر في الحديث الخمسين — خاتمة زيادات ابن رجب — الباب الجامع للتمسك به حين كثرت الشرائع: «لا يزال لسانك رطباً من ذكر الله عز وجل»، وفي حديث معاذ المؤيد «أن تموت ولسانك رطب من ذكر الله»؛ قال ابن رجب قد سبق في هذا الكتاب مفرقاً ذكر كثير من فضائل الذكر وذكر ههنا فضل إدامته والإكثار منه — بآيات الأمر بذكر الله ذكراً كثيراً ومدح الذاكرين والذاكرات بالمغفرة والأجر العظيم — فالذكر أيسر الأعمال وأشرفها وأقربها إلى الله لا يحتاج إلى موضع ولا حال ولا وضوء ولا استقبال قبلة ولا غير ذلك من الشرائط ⁦(جامع العلوم والحكم ص 927)⁩. ويخصّص له النووي في رياض الصالحين باباً في فضل الذكر والحث عليه: حديث «كلمتان خفيفتان على اللسان تقيلتان في الميزان حبيبتان إلى الرحمن سبحان الله وبحمده سبحان الله العظيم» متفق عليه {cite:riyad-salihin p.276}، وحديث مسلم أن من قال «لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شيء قدير» مائة مرة في يوم كانت له عدل عشر رقاب وكُتبت له مائة حسنة ومُحيت عنه مائة سيئة وحرز من الشيطان حتى يمسي {cite:riyad-salihin p.276}، وقول أبي ذر «ألا أخبرك بأحب الكلام إلى الله إن أحب الكلام إلى الله سبحان الله وبحمده» {cite:riyad-salihin p.277}، وصفتا ابن الزبير لدبر كل صلاة مكتوبة يهلل بهن رسول الله {cite:riyad-salihin p.277}"
  en: "Remembrance of God in the fiftieth hadith — the seal of Ibn Rajab's additions — is the comprehensive gate to hold to when the laws grow many: 'keep your tongue moist with the remembrance of God', with Mu'adh's corroborant 'that you die with your tongue moist with the remembrance of God'; Ibn Rajab notes that many excellences of remembrance were scattered through the book and treats here the merit of its constancy and abundance — through the verses commanding much remembrance and praising the remembering men and women with forgiveness and a great reward — so dhikr is the easiest of works and the noblest, the nearest to God, needing no place, state, ablution, facing of the qibla or any other condition (Jami' al-Ulum wal-Hikam p. 927). Al-Nawawi devotes a chapter of Riyad al-Salihin to the excellence of dhikr and urging it: the agreed-upon hadith 'two words light on the tongue, heavy in the scale, beloved to the Merciful — glory be to God and praise be to Him, glory be to God the Great' {cite:riyad-salihin p.276}; Muslim's report that whoever says 'there is no god but God alone, without partner; His is the dominion and His the praise, and He is over all things able' a hundred times in a day earns the freeing of ten necks, a hundred good deeds written, a hundred bad deeds erased and protection from Satan until evening {cite:riyad-salihin p.276}; Abu Dharr's 'shall I tell you the most beloved speech to God — glory be to God and praise be to Him' {cite:riyad-salihin p.277}; and Ibn al-Zubayr's formulas of glorification recited after every prescribed prayer {cite:riyad-salihin p.277}"
