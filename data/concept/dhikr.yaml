label:
  ar: الذكر
  en: Remembrance of God (dhikr)
summary:
  ar: "الذكر في الحديث الخمسين — خاتمة زيادات ابن رجب — الباب الجامع للتمسك به حين كثرت الشرائع: «لا يزال لسانك رطباً من ذكر الله عز وجل»، وفي حديث معاذ المؤيد «أن تموت ولسانك رطب من ذكر الله»؛ قال ابن رجب قد سبق في هذا الكتاب مفرقاً ذكر كثير من فضائل الذكر وذكر ههنا فضل إدامته والإكثار منه — بآيات الأمر بذكر الله ذكراً كثيراً ومدح الذاكرين والذاكرات بالمغفرة والأجر العظيم — فالذكر أيسر الأعمال وأشرفها وأقربها إلى الله لا يحتاج إلى موضع ولا حال ولا وضوء ولا استقبال قبلة ولا غير ذلك من الشرائط (جامع العلوم والحكم ص 927)."
  en: "Remembrance of God in the fiftieth hadith — the seal of Ibn Rajab's additions — is the comprehensive gate to hold to when the laws grow many: 'keep your tongue moist with the remembrance of God', with Mu'adh's corroborant 'that you die with your tongue moist with the remembrance of God'; Ibn Rajab notes that many excellences of remembrance were scattered through the book and treats here the merit of its constancy and abundance — through the verses commanding much remembrance and praising the remembering men and women with forgiveness and a great reward — so dhikr is the easiest of works and the noblest, the nearest to God, needing no place, state, ablution, facing of the qibla or any other condition (Jami' al-Ulum wal-Hikam p. 927)."
