id: concept/diq-al-nafs
class: concept
kind: scientific
label:
  fr: "Étroitesse du souffle"
  ar: "ضيق النفس"
  en: "The narrowness of the breath"
  ur: "سانس کی تنگی"
summary:
  fr: "L'étroitesse du souffle survient lorsque l'air ne trouve, dans son mouvement, qu'une issue étroite où il passe peu à peu. Les causes sont tuméfactions des voies, larynx, trachée et branches, artères ou tissu spongieux pulmonaire, surtout les dures ; humeurs épaisses, visqueuses ou aqueuses dans le poumon ; pression voisine, tuméfaction chaude du foie ou de l'estomac, hydropisie ou rupture de tuméfactions basses gênant l'expansion ; tassement par sécheresse, contraction ou froid au poumon et diaphragme ; cause nerveuse et diaphragmatique, mieux nommée souffle difficile ; vapeurs fumeuses resserrant les entrées. Le thorax lui-même peut être trop étroit pour les organes respiratoires. Le phénomène peut accompagner la crise ou l'écoulement de matières de tuméfactions internes vers la tête, annoncé par des tuméfactions derrière les oreilles dans le cas plus sûr, ou dans le cerveau {cite:canon-ibn-sina-print-v2 p.312}."
  ar: "ضيق النفس هو أن لا يجد الهواء المتصرف فيه بالنفس منفذاً في جهة حركته إلا ضيقاً لا يتسرب فيه إلا قليلاً قليلاً وأسبابه إما أورام في تلك المنافذ التي هي الحنجرة والقصبة وشعبها والشرايين وفي نفس خلخلة الرئة وأشد أورامها تضييقاً للنفس ما كان صلباً أو أخلاط كثيرة فيها غليظة أو لزجة أو مائية تجتمع في الرئة أو انطباق يعرض لها من ضاغط مجاور من ورم حار في كبد أو معدة أو انتفاخ لاستسقاء أو غيره مثل ما يكون من انفجار أورام في الجوف الأسفل تحول دون الانبساط أو تكاثف عن يبس أو قبض أو عن برد يصيب الرئة والحجاب أو عن سبب في العصب والحجاب وهو أولى بأن يسمى عسر النفس أو عن أبخرة دخانية تضيق مداخل النفس في المواضع الضيقة، وقد يكون سببه ضيق الصدر فلا تجد الأعضاء المنبسطة للنفس مجالاً وقد يكون بسبب البحران وقد يكون بسبب سيلان المواد عن الأورام الباطنة منتقلة إلى نواحي الرأس وتنذر بأورام خلف الأذنين إن كان الأمر أسلم أو في الدماغ {cite:canon-ibn-sina-print-v2 p.312}"
  en: "The narrowness of the breath is that the air handled by the breath finds no outlet in the direction of its motion but a narrow one through which it seeps only little by little. Its causes are either tumours in those passages — the larynx, the windpipe and its branches, the arteries, and in the lung's sponginess itself, the hardest-narrowing of them the hard kind — or many thick, sticky or watery humours gathering in the lung; or an apposition befalling them from a neighbouring presser — a hot tumour in liver or stomach, a swelling for dropsy, or the like, as the bursting of tumours in the lower cavity barring expansion; or a packing from dryness or contraction, or from a cold striking lung and diaphragm; or from a cause in the nerve and the diaphragm — which is better called the hard breath; or from smoky vapours narrowing the breath's entries in the narrow places. Its cause may be the chest's own narrowness, so the organs opening for the breath find no room; it may be for the crisis; and it may be from a flowing of matters off the inward tumours, passing toward the head's quarters — foretold by tumours behind the ears if the affair is safer, or in the brain {cite:canon-ibn-sina-print-v2 p.312}"
  ur: "سانس کی تنگی یہ ہے کہ نفس کے ہاتھ میں آنے والی ہوا اپنی حرکت کے رخ میں کوئی راستہ نہ پائے سواے تنگ جس میں وہ قلیلاً قلیلاً رسے؛ اس کے اسباب یا تو ان راستوں میں سوجنیں ہیں — حنجرہ قصبہ اور اس کی شاخیں شرائین اور خود پھیپھڑے کے متخلخل جسم میں اور ان میں سب سے زیادہ تنگ کرنے والی سخت سوجن ہے — یا بہت سے گاڑھے چپچپے یا آبی اخلاط جو پھیپھڑے میں جمع ہوں؛ یا قریبی دبانے والے سے انطباق — جگر یا معدے میں گرم سوجن استسقا کی پھولائی یا اس جیسا جیسے ہیٹھلے بطن میں سوجنوں کا پھٹنا جو پھیلاؤ سے روکے؛ یا خشکی یا قبض سے گنجان ہونا یا پھیپھڑے اور حجاب کو لگنے والی ٹھنڈ سے؛ یا عصب اور حجاب میں سبب سے — اور اسے عسر النفس کہنا اولیٰ ہے؛ یا دھوئیں سے بخارات جو تنگ جگہوں میں نفس کے داخلے تنگ کریں؛ اس کا سبب خود سینے کی تنگی بھی ہو سکتی ہے کہ نفس کے پھیلنے والے اعضاء کو جگہ نہ ملے؛ بحران سے بھی ہو سکتی ہے؛ اور اندرونی سوجنوں سے مواد کے بہ کر سر کی طرف منتقل ہونے سے بھی جس کی پیشگوئی کانوں کے پیچھے سوجنیں کرتی ہیں اگر معاملہ سالم ہو یا دماغ میں {cite:canon-ibn-sina-print-v2 p.312}"
