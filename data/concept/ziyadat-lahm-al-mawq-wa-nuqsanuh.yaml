id: "concept/ziyadat-lahm-al-mawq-wa-nuqsanuh"
class: "concept"
kind: "scientific"
label:
  ar: "زيادة لحم الموق ونقصانه"
  en: "Increase and decrease of the canthus flesh"
  ur: "مآق کے گوشت کا بڑھنا اور گھٹنا"
summary:
  ar: "قد تعظم لحمة الموق حتى تمنع البصر وقد تنقص جداً حتى تخفى فلا تمنع الدمعة، وأكثره عند خطأ الطبيب في قطع الظفرة؛ فأما الزيادة فتعالج بأدوية الظفرة ولا تستأصل فتحدث الدمعة، وأما النقصان الحادث عن القطع فلا علاج له، وإن كان من جهة أخرى فربما أمكن أن يعالج بالأدوية المنبتة للحم التي فيها قبض وتجفيف ⁦(أسماء الأدوية لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
  en: "The canthus flesh may enlarge till it blocks sight, and may decrease till it hides and no longer bars the tears; most of it comes at the physician's error in cutting the pterygium. The increase is treated with the pterygium drugs and is not extirpated lest tearing occur; the decrease caused by cutting has no treatment; if from another cause it may perhaps be treated with the flesh-growing drugs in which there is astringency and drying ⁦(the drug names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
  ur: "مآق کا گوشت اتنا بڑھ سکتا ہے کہ بینائی روک دے، اور اتنا گھٹ سکتا ہے کہ چھپ جائے تا آنسو نہ روکے؛ اور یہ اکثر ظفرہ کاٹنے میں طبیب کی غلطی سے ہوتا ہے۔ بڑھا ہوا ظفرہ کی ادویہ سے علاج ہوتا ہے اور جڑ سے نہیں کاٹا جاتا تا آنسو نہ ہونے لگے؛ اور کاٹنے سے ہونے والے گھٹاؤ کا کوئی علاج نہیں؛ اور اگر دوسری طرف سے ہو تو شاید گوشت اگانے والی قابض و مجفف ادویہ سے علاج ممکن ہو ⁦(ادویہ کے نام منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
