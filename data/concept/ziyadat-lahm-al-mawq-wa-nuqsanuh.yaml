id: "concept/ziyadat-lahm-al-mawq-wa-nuqsanuh"
class: "concept"
kind: "scientific"
label:
  ar: "زيادة لحم الموق ونقصانه"
  en: "Increase and decrease of the canthus flesh"
  ur: "مآق کے گوشت کا بڑھنا اور گھٹنا"
  es: "Aumento y disminución de la carne del canto"
  fr: "Augmentation et diminution de la chair du canthus"
  tr: "Ağız etinin artması ve azalması"
  id: "Peningkatan dan penurunan daging mulut"
summary:
  ar: "قد تعظم لحمة الموق حتى تمنع البصر وقد تنقص جداً حتى تخفى فلا تمنع الدمعة، وأكثره عند خطأ الطبيب في قطع الظفرة؛ فأما الزيادة فتعالج بأدوية الظفرة ولا تستأصل فتحدث الدمعة، وأما النقصان الحادث عن القطع فلا علاج له، وإن كان من جهة أخرى فربما أمكن أن يعالج بالأدوية المنبتة للحم التي فيها قبض وتجفيف ⁦(أسماء الأدوية لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
  en: "The canthus flesh may enlarge till it blocks sight, and may decrease till it hides and no longer bars the tears; most of it comes at the physician's error in cutting the pterygium. The increase is treated with the pterygium drugs and is not extirpated lest tearing occur; the decrease caused by cutting has no treatment; if from another cause it may perhaps be treated with the flesh-growing drugs in which there is astringency and drying ⁦(the drug names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
  ur: "مآق کا گوشت اتنا بڑھ سکتا ہے کہ بینائی روک دے، اور اتنا گھٹ سکتا ہے کہ چھپ جائے تا آنسو نہ روکے؛ اور یہ اکثر ظفرہ کاٹنے میں طبیب کی غلطی سے ہوتا ہے۔ بڑھا ہوا ظفرہ کی ادویہ سے علاج ہوتا ہے اور جڑ سے نہیں کاٹا جاتا تا آنسو نہ ہونے لگے؛ اور کاٹنے سے ہونے والے گھٹاؤ کا کوئی علاج نہیں؛ اور اگر دوسری طرف سے ہو تو شاید گوشت اگانے والی قابض و مجفف ادویہ سے علاج ممکن ہو ⁦(ادویہ کے نام منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
  es: "El tejido del canto puede agrandarse hasta obstruir la visión y disminuir hasta ocultarlo y dejar de contener las lágrimas; la mayoría de las veces se debe a un error del médico al cortar el pterigión. El aumento se trata con medicamentos para el pterigión y no se extirpa para evitar el lagrimeo; la disminución causada por el corte no tiene tratamiento; si se debe a otra causa, tal vez se pueda tratar con medicamentos que estimulan el crecimiento del tejido, los cuales tienen efecto astringente y secante (no se incluyen los nombres de los medicamentos) {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
  fr: "La chair du canthus peut s'hypertrophier jusqu'à obstruer la vue, et s'atrophier jusqu'à masquer les larmes; le plus souvent, cela résulte d'une erreur du médecin lors de l'incision du ptérygion. L'hypertrophie est traitée avec des médicaments contre le ptérygion et n'est pas excisée afin d'éviter les larmoiements; l'atrophie causée par l'incision ne se soigne pas; si elle a une autre origine, elle peut éventuellement être traitée avec des médicaments favorisant la croissance des tissus, présentant des propriétés astringentes et asséchantes (les noms de ces médicaments ne sont pas mentionnés). {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
  tr: "Gözün iç köşesindeki doku o kadar büyüyebilir ki görmeyi engelleyebilir veya o kadar küçülebilir ki kaybolabilir ve göz yaşarmasını engellemez. Bu durum çoğunlukla doktorun pterygium'u kesmede yaptığı bir hatadan kaynaklanır. Fazlalık durumunda, pterygium ilaçlarıyla tedavi edilir ve çıkarılmaz, böylece göz yaşarması meydana gelir. Kesimden kaynaklanan eksiklik durumunda ise tedavi yoktur. Başka bir kaynaktan kaynaklanıyorsa, büzücü ve kurutucu özelliklere sahip doku büyümesi ilaçlarıyla tedavi edilebilir (ilaçların isimleri verilmemiştir). {cite:canon-ibn-sina-print-v2 s.183} {cite:canon-ibn-sina-print-v2 s.184}"
  id: "Jaringan di sudut dalam mata dapat membesar hingga menghalangi penglihatan, atau menyusut hingga menghilang dan tidak mencegah keluarnya air mata. Hal ini paling sering disebabkan oleh kesalahan dokter dalam memotong pterygium. Untuk kelebihan jaringan, diobati dengan obat-obatan pterygium dan tidak diangkat, sehingga air mata tetap keluar. Sedangkan untuk kekurangan jaringan akibat pemotongan, tidak ada pengobatan. Jika berasal dari sumber lain, mungkin dapat diobati dengan obat-obatan penumbuh jaringan yang memiliki sifat astringen dan pengering (nama obat tidak disebutkan). {cite:canon-ibn-sina-print-v2 p.183} {cite:canon-ibn-sina-print-v2 p.184}"
