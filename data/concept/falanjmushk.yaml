  fr: "Falanjmushk (basilic sauvage)"
summary:
  ar: "فلنجمشك في الكتاب الحبق البري، ينقل قوم أنه أغذى من المرزنجوش والنمام وأقل يبسا، يفتح السدد العارضة في الدماغ والمنخرين شما وطلاء وأكلا، وينفع الخفقان العارض من البلغم والسوداء، وجيد للبواسير {cite:canon-ibn-sina-print-v1 p.625}"
  en: "Falanjmushk is in the book wild basil, said by some to be more nourishing than marjoram and mint and less dry; it opens obstructions in the brain and nostrils by smelling, anointing and eating, benefits palpitation from phlegm and black bile in the heart, and is good for piles {cite:canon-ibn-sina-print-v1 p.625}"
  ur: "فلنجمشک کتاب میں جنگلی تلسی ہے، کچھ کے مطابق مرزنجوش اور پودینے سے زیادہ غذائیت والی اور کم خشک؛ دماغ اور نتھنوں کے سدے سونگھنے، لیپ اور کھانے سے کھولتی ہے، بلغم اور سودا سے دل میں ہونے والی دھڑکن میں نافع ہے، اور بواسیر کے لیے اچھی ہے {cite:canon-ibn-sina-print-v1 p.625}۔"
  es: "Falanjmushk es la albahaca silvestre del libro, que según algunos es más nutritiva que la mejorana y la menta, y menos seca; abre las obstrucciones en el cerebro y las fosas nasales al olerla, ungirla y comerla, alivia las palpitaciones causadas por la flema y la bilis negra en el corazón, y es buena para las hemorroides {cite:canon-ibn-sina-print-v1 p.625}"
  fr: "Le falanjmushk est mentionné dans le livre comme étant du basilic sauvage, considéré par certains comme plus nourrissant et moins desséchant que la marjolaine et la menthe; il dégage les obstructions du cerveau et des narines par inhalation, application locale et ingestion, soulage les palpitations dues aux mucosités et à la bile noire dans le cœur, et est bénéfique en cas d’hémorroïdes {cite:canon-ibn-sina-print-v1 p.625}"
