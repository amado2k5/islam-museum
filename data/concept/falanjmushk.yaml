summary:
  fr: "Certains le disent plus nourrissant que marjolaine et menthe, et moins sec. Une note de l'éditeur l'identifie au basilic sauvage {cite:canon-ibn-sina-print-v1 p.625}."
  ar: "فلنجمشك في الكتاب الحبق البري، ينقل قوم أنه أغذى من المرزنجوش والنمام وأقل يبسا، يفتح السدد العارضة في الدماغ والمنخرين شما وطلاء وأكلا، وينفع الخفقان العارض من البلغم والسوداء، وجيد للبواسير {cite:canon-ibn-sina-print-v1 p.625}"
  en: "Falanjmushk is in the book wild basil, said by some to be more nourishing than marjoram and mint and less dry; it opens obstructions in the brain and nostrils by smelling, anointing and eating, benefits palpitation from phlegm and black bile in the heart, and is good for piles {cite:canon-ibn-sina-print-v1 p.625}"
  ur: "فلنجمشک کتاب میں جنگلی تلسی ہے، کچھ کے مطابق مرزنجوش اور پودینے سے زیادہ غذائیت والی اور کم خشک؛ دماغ اور نتھنوں کے سدے سونگھنے، لیپ اور کھانے سے کھولتی ہے، بلغم اور سودا سے دل میں ہونے والی دھڑکن میں نافع ہے، اور بواسیر کے لیے اچھی ہے {cite:canon-ibn-sina-print-v1 p.625}۔"
