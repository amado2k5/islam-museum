id: concept/sun-prostrates-under-the-throne
class: concept
kind: term
label: { ar: "سجود الشمس تحت العرش ومستقرها", en: "The sun's prostration under the Throne and its resting place", ur: "سورج کا عرش کے نیچے سجدہ اور اس کا مستقر", es: "La postración del sol bajo el Trono y su lugar de descanso" }
summary:
  ar: "روى البخاري ومسلم عن أبي ذر أن الشمس تذهب بعد غروبها حتى تسجد تحت العرش وتستأذن في الطلوع، ثم يأتي يوم لا يُؤذن لها فتطلع من مغربها؛ واختلف الشراح في معنى المستقر وفي كيفية السجود، وأورد ابن كثير قولين في المستقر، المكاني تحت العرش والزماني إلى القيامة {cite:sahih-al-bukhari 3199} {cite:sahih-muslim 159} {cite:tafsir-ibn-kathir on 36:38}."
  en: "Al-Bukhari and Muslim relate from Abu Dharr that after setting the sun travels until it prostrates under the Throne and asks leave to rise, until a day comes when it is not permitted and rises from its west; commentators differed on the meaning of its resting place and on how it prostrates, and Ibn Kathir gives two readings of the resting place, one of place under the Throne and one of time until the Day of Resurrection {cite:sahih-al-bukhari 3199} {cite:sahih-muslim 159} {cite:tafsir-ibn-kathir on 36:38}."
  ur: "بخاری اور مسلم نے ابوذر سے روایت کی ہے کہ سورج غروب کے بعد چلتا ہے یہاں تک کہ عرش کے نیچے سجدہ کرتا اور طلوع کی اجازت مانگتا ہے، یہاں تک کہ ایک دن آئے گا جب اجازت نہ ملے گی اور وہ مغرب سے نکلے گا؛ شارحین نے اس کے مستقر اور سجدے کی کیفیت میں اختلاف کیا، اور ابن کثیر نے مستقر کے دو معنی ذکر کیے، مکانی یعنی عرش کے نیچے اور زمانی یعنی قیامت تک {cite:sahih-al-bukhari 3199} {cite:sahih-muslim 159} {cite:tafsir-ibn-kathir on 36:38}۔"
  es: "Al-Bujari y Muslim relatan de Abu Dharr que después de ponerse el sol viaja hasta que se postra bajo el Trono y pide permiso para levantarse, hasta que llega un día en que no se le permite y se levanta desde su oeste; los comentaristas difirieron en el significado de su lugar de descanso y en cómo se postra, e Ibn Kathir da dos lecturas del lugar de descanso, una del lugar bajo el Trono y otra del tiempo hasta el Día de la Resurrección {cita:sahih-al-bujari 3199} {cita:sahih-muslim 159} {cita:tafsir-ibn-kathir en 36:38}."
