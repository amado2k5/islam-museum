id: concept/rida-bil-qada
class: concept
kind: ethical
label: { ar: "الرضا بالقضاء", en: "Contentment with God's decree (rida)", ur: "قضا پر رضا" }
summary:
  ar: "مقام من مقامات المحبين يعرضه الغزالي في كتاب المحبة والشوق والأنس والرضا من إحياء علوم الدين: يرى أن الرضا بما يخالف الهوى متصوَّر لمن ثبت عنده حب الله، إما ببطلان الإحساس بالألم وإما بالرضا به عقلاً مع كراهته طبعاً، وأن الدعاء وكراهة المعاصي لا يناقضانه {cite:ihya-shamela-dar-al-marifa p. 7969} {cite:ihya-shamela-dar-al-marifa p. 7972} {cite:ihya-shamela-dar-al-marifa p. 7991}."
  en: "A station of the lovers of God that al-Ghazali presents in the Book of Love, Longing, Intimacy and Contentment of the Ihya': contentment with what goes against desire is possible for one who truly loves God, either because the pain is no longer felt or because it is accepted by reason while disliked by nature; supplication and hating sin do not contradict it {cite:ihya-shamela-dar-al-marifa p. 7969} {cite:ihya-shamela-dar-al-marifa p. 7972} {cite:ihya-shamela-dar-al-marifa p. 7991}."
  ur: "محبینِ الٰہی کا ایک مقام جسے غزالی احیاء کی کتاب المحبۃ والشوق والانس والرضا میں پیش کرتے ہیں: خواہش کے خلاف باتوں پر رضا اس کے لیے ممکن ہے جو اللہ سے سچی محبت رکھے، یا تو اس طرح کہ درد محسوس ہی نہ ہو یا اس طرح کہ طبیعت ناپسند کرے مگر عقل قبول کرے؛ دعا اور گناہ سے نفرت اس کے منافی نہیں {cite:ihya-shamela-dar-al-marifa p. 7969} {cite:ihya-shamela-dar-al-marifa p. 7972} {cite:ihya-shamela-dar-al-marifa p. 7991}۔"
