id: concept/rida-bil-qada
class: concept
kind: ethical
label: { ar: "الرضا بالقضاء", en: "Contentment with God's decree (rida)", ur: "قضا پر رضا", es: "Contentamiento con el decreto de Dios (rida)", fr: "Contentement face au décret de Dieu (rida)", tr: "Yargıdan memnuniyet", id: "Kepuasan terhadap peradilan" }
summary:
  ar: "مقام من مقامات المحبين يعرضه الغزالي في كتاب المحبة والشوق والأنس والرضا من إحياء علوم الدين: يرى أن الرضا بما يخالف الهوى متصوَّر لمن ثبت عنده حب الله، إما ببطلان الإحساس بالألم وإما بالرضا به عقلاً مع كراهته طبعاً، وأن الدعاء وكراهة المعاصي لا يناقضانه {cite:ihya-shamela-dar-al-marifa p. 7969} {cite:ihya-shamela-dar-al-marifa p. 7972} {cite:ihya-shamela-dar-al-marifa p. 7991}."
  en: "A station of the lovers of God that al-Ghazali presents in the Book of Love, Longing, Intimacy and Contentment of the Ihya': contentment with what goes against desire is possible for one who truly loves God, either because the pain is no longer felt or because it is accepted by reason while disliked by nature; supplication and hating sin do not contradict it {cite:ihya-shamela-dar-al-marifa p. 7969} {cite:ihya-shamela-dar-al-marifa p. 7972} {cite:ihya-shamela-dar-al-marifa p. 7991}."
  ur: "محبینِ الٰہی کا ایک مقام جسے غزالی احیاء کی کتاب المحبۃ والشوق والانس والرضا میں پیش کرتے ہیں: خواہش کے خلاف باتوں پر رضا اس کے لیے ممکن ہے جو اللہ سے سچی محبت رکھے، یا تو اس طرح کہ درد محسوس ہی نہ ہو یا اس طرح کہ طبیعت ناپسند کرے مگر عقل قبول کرے؛ دعا اور گناہ سے نفرت اس کے منافی نہیں {cite:ihya-shamela-dar-al-marifa p. 7969} {cite:ihya-shamela-dar-al-marifa p. 7972} {cite:ihya-shamela-dar-al-marifa p. 7991}۔"
  es: "Una posición de los amantes de Dios que al-Ghazali presenta en el Libro del Amor, Anhelo, Intimidad y Contentamiento del Ihya': el contentamiento con lo que va en contra del deseo es posible para quien verdaderamente ama a Dios, ya sea porque el dolor ya no se siente o porque es aceptado por la razón aunque desagrade por naturaleza; la súplica y el odio al pecado no lo contradicen {cite:ihya-shamela-dar-al-marifa p. 7969} {cite:ihya-shamela-dar-al-marifa p. 7972} {cite:ihya-shamela-dar-al-marifa p. 7991}."
  fr: "Une étape des amoureux de Dieu qu'al-Ghazali présente dans le Livre de l'Amour, du Désir, de l'Intimité et du Contentement de l'Ihya': le contentement avec ce qui va à l'encontre du désir est possible pour celui qui aime véritablement Dieu, soit parce que la douleur n'est plus ressentie, soit parce qu'elle est acceptée par la raison bien que détestée par la nature; la supplication et la haine du péché ne la contredisent pas {cite:ihya-shamela-dar-al-marifa p. 7969} {cite:ihya-shamela-dar-al-marifa p. 7972} {cite:ihya-shamela-dar-al-marifa p. 7991}."
  tr: "Âşıklar mezhebinin makamını, Al-Gazali tarafından 'İhya'dan Sevgi, Özlem, Yakınlık ve Memnuniyet İhya'dan Mutluluk ve Memnuniyet' adlı kitabında sunulmuştur. Arzularla çelişenlere olan yetinin, acı hissetmenin geçersiz olması ya da doğal olarak sevmemesine rağmen entelektüel olarak kabul etmesi yoluyla Tanrı'ya olan sevgiyi sıkı sıkıya tutanlar için düşünülebilir olduğuna ve günahlara olan yalvarış ve hoşnutsuzluğun buna aykırı olmadığını savunur {cite:ihya-şamela-dar-al-marifa s. 7969} {cite:ihya-shamela-dar-al-marifa s. 7991}."
  id: "Seorang maqam dari kalangan kekasih dipresentasikan oleh Al-Ghazali dalam bukunya 'Cinta, Kerinduan, Keintiman, dan Kepuasan dari Ihya' Ulum al-Din.' Ia percaya bahwa kepuasan dengan apa yang bertentangan dengan keinginan dapat dibayangkan bagi mereka yang teguh memegang cinta kepada Tuhan, baik karena merasakan sakit tidak sah atau menerimanya secara intelektual meskipun secara alami tidak menyukainya, dan bahwa permohonan dan kebencian terhadap dosa tidak bertentangan dengannya {cite:ihya-shamela-dar-al-marifa hlm. 7969} {cite:ihya-shamela-dar-al-marifa hlm. 7991}."
