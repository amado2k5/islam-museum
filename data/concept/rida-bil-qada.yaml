issue:
  ar: "هل يجب الرضا بالمعاصي لأنها من قضاء الله، وهل يناقض الدعاءُ الرضا؟"
  en: "Must one be content with sins because they are part of God's decree, and does supplication contradict contentment?"
  ur: "کیا گناہوں پر رضا واجب ہے کیونکہ وہ اللہ کی قضا سے ہیں، اور کیا دعا رضا کے منافی ہے؟"
perspectives:
  - tradition: sunni
    id: ghazali-dua-not-contrary
    standing: main
    stance:
      ar: "الدعاء وإنكار المعاصي وكراهتها لا تناقض الرضا"
      en: "Supplication and rejecting and hating sins do not contradict contentment"
      ur: "دعا اور گناہوں کا انکار و کراہت رضا کے منافی نہیں"
    summary:
      ar: "يرى الغزالي أن من زعم وجوب الرضا بالمعاصي والكفر لأنها من القضاء «غلط»، وأن الدعاء مما تُعُبّد به، وأن كراهة المنكر مأمور بها، ويستدل بكثرة دعاء النبي والأنبياء وبالآثار في من رضي بالمنكر."
      en: "Al-Ghazali holds that those who claimed one must be content with sin and unbelief because they are decreed 'erred', that supplication is an act of worship, and that hating wrong is commanded, citing the Prophet's and the prophets' many supplications and reports about one who approves of a wrong."
      ur: "غزالی کی رائے ہے کہ جنہوں نے کہا کہ گناہ اور کفر پر رضا واجب ہے کیونکہ وہ قضا سے ہیں انہوں نے «غلطی کی»، دعا عبادت ہے اور منکر سے نفرت کا حکم ہے؛ وہ نبی اور انبیا کی کثرتِ دعا اور منکر پر راضی ہونے والے کے بارے میں آثار سے استدلال کرتے ہیں۔"
