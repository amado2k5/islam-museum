id: concept/canon-day-sleep-and-night-sleep
class: concept
kind: scientific
label:
  ar: "نوم النهار ونوم الليل عند ابن سينا"
  en: "Day sleep and night sleep in the Canon"
  fr: "Sommeil diurne et nocturne dans le Canon"
  ur: "دن کی نیند اور رات کی نیند قانون میں"
  es: "Sueño diurno y sueño nocturno en el Canon"
  tr: "İbn Sina'ya göre gündüz uykusu ve gece uykusu"
  id: "Tidur siang dan tidur malam menurut Ibn Sina"
summary:
  ar: "يعد ابن سينا نوم النهار رديئاً يورث الأمراض الرطوبية والنوازل ويفسد اللون ويورث الطحال ويرخي العصب ويكسل ويضعف الشهوة ويورث الأورام، ويفضل نوم الليل لأنه تام مستمر غرق، مع ألا يهجر معتاد نوم النهار نومه دفعة {cite:canon-ibn-sina-print-v1 p.241}."
  en: "Ibn Sina holds day sleep poor, since it brings moist diseases and catarrhs, spoils the colour, brings spleen trouble, slackens the nerve, makes sluggish, weakens appetite and brings tumours, and prefers night sleep as complete, continuous and deep, while one used to day sleep is not to give it up all at once {cite:canon-ibn-sina-print-v1 p.241}."
  fr: "Ibn Sina juge le sommeil diurne mauvais : maladies humides, catarrhes, mauvais teint, trouble splénique, relâchement nerveux, torpeur, faible appétit et tumeurs. Il préfère le sommeil nocturne complet, continu et profond, sans abandon brutal d’une habitude diurne {cite:canon-ibn-sina-print-v1 p.241}."
  es: "Ibn Sina considera que dormir durante el día es malo, ya que trae enfermedades húmedas y catarros, estropea el color, causa problemas de bazo, debilita los nervios, provoca letargo, debilita el apetito y causa tumores, y prefiere el sueño nocturno por ser completo, continuo y profundo, mientras que quien está acostumbrado a dormir durante el día no debe abandonarlo de golpe {cite:canon-ibn-sina-print-v1 p.241}."
  ur: "ابن سینا دن کی نیند کو ناقص قرار دیتا ہے کیونکہ یہ مرطوب بیماریاں اور نزلہ لاتا ہے، رنگ خراب کرتا ہے، تلی کی تکلیف لاتا ہے، اعصاب کو سست کرتا ہے، سست بناتا ہے، بھوک کو کمزور کرتا ہے اور رسولیاں لاتا ہے، اور رات کی نیند کو مکمل، مسلسل اور گہری سمجھتا ہے، جب کہ دن کی نیند کو ایک ہی وقت میں ترک کرنے کا عادی نہیں ہے: صفحہ 241}۔"
  tr: "İbn Sina, gündüz uykusunu kötü bulur; nem ve hastalıklara yol açar, renk bozar, dalak oluşturur, siniri gevşetir, tembellik, arzu zayıflatır ve tümörler oluşturur. Gece uykusunu tercih eder çünkü uyku tam ve sürekli olarak dalgındır, ancak gündüz uykusuna alışkın kişi uykusunu hemen bırakmazsa {cite:canon-ibn-sina-print-v1 s.241}."
  id: "Ibn Sina menganggap tidur siang hari kurang baik, menyebabkan kelembapan dan penyakit, merusak warna, menyebabkan limpa, merilekskan saraf, malas, melemahkan hasrat, dan menyebabkan tumor. Ia lebih memilih tidur malam karena tidur malam penuh dan terus-menerus terbenam, asalkan seseorang yang terbiasa tidur siang hari tidak langsung meninggalkan tidurnya {cite:canon-ibn-sina-print-v1 hlm.241}."
