label: { ar: "نوم النهار ونوم الليل عند ابن سينا", en: "Day sleep and night sleep in the Canon", ur: "دن کی نیند اور رات کی نیند قانون میں" }
summary:
  ar: "يعد ابن سينا نوم النهار رديئاً يورث الأمراض الرطوبية والنوازل ويفسد اللون ويورث الطحال ويرخي العصب ويكسل ويضعف الشهوة ويورث الأورام، ويفضل نوم الليل لأنه تام مستمر غرق، مع ألا يهجر معتاد نوم النهار نومه دفعة {cite:canon-ibn-sina-print-v1 p.241}."
  en: "Ibn Sina holds day sleep poor, since it brings moist diseases and catarrhs, spoils the colour, brings spleen trouble, slackens the nerve, makes sluggish, weakens appetite and brings tumours, and prefers night sleep as complete, continuous and deep, while one used to day sleep is not to give it up all at once {cite:canon-ibn-sina-print-v1 p.241}."
