summary:
  ar: "ضيمران في الكتاب قيل هو شاهسفرم الحماحم، وتعليق المحقق أنه حبق الماء؛ ينقل الكتاب عن ابن ماسويه أن فيه حرارة وهو يابس في الثانية، ويرجح أن قوته مركبة من حرارة مع برودة، نافع للمحرورين خصوصا إذا رش عليه ماء ورد، ويضمد به الاحتراق، ونافع جدا من القلاع والحماحم ومفتح لسدد الدماغ {cite:canon-ibn-sina-print-v1 p.721}"
  en: "Daymaran is in the book said to be shahsfarm al-hamahim, and the editor's note says it is habaq al-ma'; the book quotes Ibn Masawayh that there is heat in it and that it is dry in the second degree, and judges more sound that its power is compounded of heat with coldness, beneficial for those of hot temperament especially when rose water is sprinkled on it; it is laid as a poultice on burning, and is very beneficial for qala' and al-hamahim and opens obstructions of the brain {cite:canon-ibn-sina-print-v1 p.721}"
  ur: "ضیمران کتاب میں کہا گیا ہے کہ یہ شاہسفرم الحماحم ہے، اور محقق کا حاشیہ کہتا ہے کہ یہ حبق الماء ہے؛ کتاب ابن ماسویہ سے نقل کرتی ہے کہ اس میں حرارت ہے اور یہ دوسرے درجے میں خشک ہے، اور زیادہ صحیح یہ ٹھہراتی ہے کہ اس کی قوت حرارت اور برودت سے مرکب ہے، گرم مزاج والوں کے لیے نافع خصوصاً جب اس پر گلاب کا پانی چھڑکا جائے، جلنے پر اس کا ضماد کیا جاتا ہے، اور قلاع اور الحماحم میں بہت نافع ہے اور دماغ کی رکاوٹیں کھولتا ہے {cite:canon-ibn-sina-print-v1 p.721}۔"
  es: "En el libro se dice que Daymaran es shahsfarm al-hamahim, y la nota del editor dice que es habaq al-ma'; el libro cita a Ibn Masawayh diciendo que tiene calor y que es seco en segundo grado, y considera más acertado que su poder se compone de calor con frío, beneficioso para aquellos de temperamento cálido, especialmente cuando se rocía agua de rosas sobre él; se aplica como cataplasma sobre quemaduras, y es muy beneficioso para qala' y al-hamahim y desbloquea obstrucciones del cerebro {cite:canon-ibn-sina-print-v1 p.721}"
  fr: "Le Daymaran est mentionné dans le livre comme étant le shahsfarm al-hamahim, et la note de l'éditeur indique qu'il s'agit du habaq al-ma'. Le livre cite Ibn Masawayh qui affirme qu'il contient de la chaleur et qu'il est sec au deuxième degré. Il est plus juste de dire que son pouvoir est une combinaison de chaleur et de fraîcheur, bénéfique pour les personnes de tempérament chaud, surtout lorsqu'on y vaporise de l'eau de rose. Appliqué en cataplasme sur les brûlures, il est très bénéfique pour le qala' et l'al-hamahim et débloque les blocages cérébraux. {cite:canon-ibn-sina-print-v1 p.721}"
  tr: "Kitaptaki iki Dhimiran'ın Hamahim'in Şahsaframı olduğu söylenir ve editörün yorumu bunun su fesleğeni olduğudur; kitapta İbn Masawayh'in alıntısı vardır ve bunun sıcaklık ve soğuklukla güçlendiği belirtilir. Özellikle gül suyu serpildiğinde, yanıkları sarmak için kullanılırsa, ardıç ve hammahemden çok faydalıdır ve beyin açıcı olarak kullanılır {cite:canon-ibn-sina-print-v1 s.721}"
  id: "Dua Dhimiran dalam buku ini dikatakan sebagai Shahsafram dari Hamahim, dan komentar editor adalah bahwa itu adalah basil air; buku ini mengutip Ibn Masawayh bahwa ia mengandung panas dan kering setiap detik, dan kemungkinan kekuatannya diperkuat oleh panas dan dingin. Ini bermanfaat bagi yang bebas, terutama jika ditaburi air mawar, digunakan untuk membalut luka bakar, sangat bermanfaat dari burung thrush dan hammahem, serta pembuka otak {cite:canon-ibn-sina-print-v1 hlm.721}"
