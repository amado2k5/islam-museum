class: concept
kind: scientific
label:
  ar: علاج القروح في الأنف
  en: The treatment of the ulcers in the nose
  ur: ناک کے چھالوں کا علاج
  es: "El tratamiento de las úlceras en la nariz"
  fr: "Le traitement des ulcères nasaux"
  tr: "Burun ülserlerinin tedavisi"
  id: "Pengobatan tukak hidung"
summary:
  ar: الأنف عضو أرطب من الأذن وأيبس من العين فيجب أن يكون علاج قروحه بين علاجي قروح الأذن والعين ويجفف الرأس أولاً ويقوى ثم تفصد المنخران ⁦(بوصف الكتاب)⁩، والقروح اليابسة تعالج بمسوح من جنس ما يعرف، والتي تسيل إليها مادة حريفة أو رديئة أو منتنة علاجها يصعب ولا بد من الاستفراغ والفصد وربما الإسهال وتدام غسلها بجنس النطرون والصابون ومنه المنسوب إلى اسقليبادس وإلى قسطيطبونس ⁦(منسوبان كما في الكتاب)⁩ ثم الأدوية الشديدة التجفيف ومنها دواء روفس المجرب ⁦(النسخ والأسماء تحمل جنسها وقولها منقول)⁩ {cite:canon-ibn-sina-print-v2 p.246} {cite:canon-ibn-sina-print-v2 p.247}
  en: 'The nose is a member moister than the ear and drier than the eye, so the treatment of its ulcers must stand between the treatments of ear and eye ulcers: the head is first dried and strengthened, then the nostrils are bled ⁦(as the book describes)⁩. Dry ulcers are treated with ointments of the known kind; ulcers to which a sharp, bad or stinking matter flows are hard to treat — evacuation and venesection are indispensable, and perhaps great laxatives, with continual washing by the natron-and-soap kind, including the soaps ascribed to Asclepiades and to Quintus ⁦(carried as the book''s attributions)⁩, then strong drying drugs, among them a tried drug ascribed to Rufus ⁦(the recipes and names are carried by kind and attribution)⁩ {cite:canon-ibn-sina-print-v2 p.246} {cite:canon-ibn-sina-print-v2 p.247}'
  ur: 'ناک کان سے زیادہ تر اور آنکھ سے زیادہ خشک عضو ہے، اس لیے اس کے چھالوں کا علاج کان اور آنکھ کے چھالوں کے علاج کے درمیان ہونا چاہیے: پہلے سر خشک اور مضبوط کیا جاتا ہے پھر نتھنے فصد کیے جاتے ہیں ⁦(کتاب کے بیان کے طور پر)⁩؛ خشک چھالے معروف جنس کے مرہموں سے علاج ہوتے ہیں؛ اور جن تک تیز، بری یا بدبو دار مادہ بہتا ہو ان کا علاج مشکل ہے — استفراغ اور فصد لازم اور شاید بڑے مسہل بھی، اور نطرون اور صابن کی جنس سے مسلسل دھونا جس میں اسقليبادس اور قسطيطبونس سے منسوب صابن بھی ہیں ⁦(کتاب کے انتساب کے طور پر)⁩، پھر سخت خشک کرنے والے ادویہ جن میں روفس سے منسوب مجرب دوا بھی ہے ⁦(نسخے اور نام جنس اور انتساب کے اعتبار سے)⁩ {cite:canon-ibn-sina-print-v2 p.246} {cite:canon-ibn-sina-print-v2 p.247}'
  es: "La nariz es un órgano más húmedo que la oreja y más seco que el ojo, por lo que el tratamiento de sus úlceras debe situarse entre el de las úlceras de oído y ojo: primero se seca y fortalece la cabeza, luego se sangran las fosas nasales (como describe el libro). Las úlceras secas se tratan con ungüentos conocidos; las úlceras que supuran una sustancia irritante, fétida o maloliente son difíciles de tratar: la evacuación y la flebotomía son indispensables, y quizás también los laxantes fuertes, con lavados continuos con natrón y jabón, incluidos los jabones atribuidos a Asclepiades y a Quinto (que se citan como atribuciones del libro), y luego medicamentos secantes fuertes, entre ellos un medicamento probado atribuido a Rufo (las recetas y los nombres se citan por tipo y atribución). {cite:canon-ibn-sina-print-v2 p.246} {cite:canon-ibn-sina-print-v2 p.247}"
  fr: "Le nez étant un organe plus humide que l'oreille et plus sec que l'œil, le traitement de ses ulcères doit se situer entre celui des ulcères de l'oreille et celui des ulcères oculaires: on commence par sécher et fortifier la tête, puis on saigne les narines (comme le décrit l'ouvrage). Les ulcères secs sont traités avec des onguents classiques; les ulcères suintants, nauséabonds ou purulents sont difficiles à soigner: l'évacuation et la saignée sont indispensables, ainsi que parfois de puissants laxatifs, et des lavages continus au savon natron-savon, notamment ceux attribués à Asclépiade et à Quintus (mentionnés dans les attributions de l'ouvrage), puis des remèdes asséchants puissants, parmi lesquels un remède éprouvé attribué à Rufus (les recettes et les noms sont indiqués par type et attribution). {cite:canon-ibn-sina-print-v2 p.246} {cite:canon-ibn-sina-print-v2 p.247}"
  tr: "Burun, kulaktan daha nemli ve gözden daha ağrılı nemli bir organdır, bu yüzden ülser tedavisi kulak ve göz ülserleri arasında yapılmalı, önce başı kurutmalı, güçlendirmeli ve sonra burun deliklerini delmelidir (kitapta anlatıldığı gibi). Kuru ülserler, bilinen tipte sürüntülerle tedavi edilir; bu sürüntüler keskin, kötü veya kirli bir maddeyle boşaltılır, tedavi edilmesi zordur ve kusmak, geri almak ve muhtemelen ishal yapmak gerekir. Yıkanma, Asclepades ve Constantiphones'a atfedilenler dahil olan natron cinsi ve sabunla devam eder (her ikisi de kitapta olduğu gibi belirtilir), ardından ciddi şekilde kurutucu ilaçlar, denenmiş Rufus ilacı da dahil olmak üzere (kopyaları ve isimleri cinslerini taşır ve alıntılandığı söylenir) {cite:canon-ibn-sina-print-v2 s.246} {cite:canon-ibn-sina-print-v2 s.247}"
  id: "Hidung adalah organ yang lembap, lebih lembap dari telinga dan lebih sakit daripada mata, sehingga pengobatan luka harus dilakukan di antara telinga dan luka mata, mengeringkan kepala terlebih dahulu, menguatkannya, lalu menusuk lubang hidung (seperti yang dijelaskan dalam buku). Tukak kering diobati dengan usapan jenis yang diketahui, yang dilepaskan dengan zat menyengat, buruk, atau kotor yang sulit diobati, dan harus muntah, mengambil, dan mungkin diare. Pencucian mereka berlanjut dengan genus natron dan sabun, termasuk yang dikaitkan dengan Asclepades dan Constantiphones (keduanya dikaitkan seperti dalam buku), kemudian obat yang sangat mengeringkan, termasuk obat Rufus yang sudah dicoba (salinan dan nama memuat genusnya dan dikatakan dikutip) {cite:canon-ibn-sina-print-v2 hlm.246} {cite:canon-ibn-sina-print-v2 hlm.247}"
