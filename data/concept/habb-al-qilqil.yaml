label:
  ar: "حبّ القلقل"
  en: "Habb al-qilqil (the qilqil seed)"
  ur: "حب القلقل"
  es: "Habb al-qilqil (la semilla de qilqil)"
  fr: "Habb al-qilqil (la graine de qilqil)"
summary:
  ar: "حبّ القلقل بزر أبيض أكبر من القرطم، ينكسر عن لبّ دهنيّ طيّب الطعم. يقوّي الأبدان المسترخية، ومقليّه أخفّ وأجود هضماً، ويذكر الكتاب أنه مصدّع إذا تُنقل به على الشراب العتيق، والإكثار منه يتخم ويهيض. وقيل هو بزر الرمّان البرّي، وحسب حاشية المحقّق هو حبّ الرمان."
  en: "Habb al-qilqil is a white seed larger than safflower, breaking into an oily, pleasant kernel. It strengthens slack bodies. The roasted kind is lighter and easier to digest. The book says it causes headache, especially when taken with aged wine, and that too much of it causes repletion and indigestion. Some say it is wild pomegranate seed; the editor's note identifies it as pomegranate seed."
  ur: "حب القلقل ایک سفید دانہ ہے جو قرطم سے بڑا ہوتا ہے اور تیلی، لذیذ مغز میں کھلتا ہے۔ یہ ڈھیلے بدن کو قوت دیتا ہے؛ بھونا ہوا ہلکا اور ہضم میں آسان ہے۔ کتاب کہتی ہے کہ یہ سر درد پیدا کرتا ہے، خاص کر پرانی شراب کے ساتھ لیا جائے تو، اور زیادہ کھانے سے تخمہ اور بدہضمی ہوتی ہے۔ بعض کے نزدیک یہ جنگلی انار کا بیج ہے؛ مدوّن کے حاشیے کے مطابق یہ انار کا بیج ہے۔"
  es: "Habb al-qilqil es una semilla blanca, más grande que la del cártamo, que al descomponerse se convierte en un grano aceitoso y agradable. Fortalece los cuerpos débiles. La variedad tostada es más ligera y fácil de digerir. El libro indica que provoca dolor de cabeza, especialmente al tomarla con vino añejo, y que un consumo excesivo causa sensación de plenitud e indigestión. Algunos afirman que se trata de semilla de granada silvestre; la nota del editor la identifica como tal."
  fr: "Le habb al-qilqil est une graine blanche plus grosse que celle du carthame, qui s'ouvre en un noyau huileux et agréable. Il est réputé fortifiant. Grillé, il est plus léger et plus digeste. Selon le livre, il provoque des maux de tête, surtout consommé avec du vin vieux, et une trop grande quantité entraîne des ballonnements et des indigestions. Certains le confondent avec la graine de grenade sauvage; la note de l'éditeur le précise."
