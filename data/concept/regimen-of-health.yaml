id: concept/regimen-of-health
class: concept
kind: scientific
label: { ar: "التدبير وحفظ الصحة", en: "Regimen of health (al-tadbir)", es: "Régimen de salud (al-tadbir)", fr: "Régime de santé (al-tadbir)", ur: "صحت کا طریقہ ⁦(التدبیر)⁩", tr: "Yönetim ve Sağlık Koruma", id: "Manajemen dan Pelestarian Kesehatan" }
summary:
  ar: "يذكر ابن سينا أن حفظ الصحة وإزالة المرض يحتاجان إلى موضوعات أخرى، منها التدبير بالمأكول والمشروب واختيار الهواء وتقدير الحركة والسكون {cite:canon-ibn-sina-print-v1 p.15}. وفي الفن الثالث من الكتاب الأول يعرض التدبير المشترك للبالغين، وهو سبعة عشر فصلاً، ويبدأ بالرياضة لأن معظم تدبير حفظ الصحة هو أن يُرتاض، ثم تدبير الغذاء، ثم تدبير النوم {cite:canon-ibn-sina-print-v1 p.221}."
  en: "Ibn Sina says that keeping health and removing disease need further subjects, among them the regimen of food and drink, the choice of air, and the measure of movement and rest {cite:canon-ibn-sina-print-v1 p.15}. In Fann 3 of Book I he treats the common regimen for adults, in seventeen chapters, beginning with exercise, since most of keeping health lies in exercise, then diet, then sleep {cite:canon-ibn-sina-print-v1 p.221}."
  es: "Ibn Sina afirma que mantener la salud y prevenir las enfermedades requiere otros aspectos, entre ellos la alimentación, la elección del aire y la cantidad de ejercicio y descanso {cite:canon-ibn-sina-print-v1 p.15}. En el Fann 3 del Libro I, trata el régimen común para adultos en diecisiete capítulos, comenzando con el ejercicio, ya que gran parte de la salud reside en él, seguido de la dieta y, finalmente, el sueño {cite:canon-ibn-sina-print-v1 p.221}."
  fr: "Ibn Sina affirme que le maintien d'une bonne santé et la guérison des maladies nécessitent d'autres sujets, notamment le régime alimentaire, la qualité de l'air et la juste proportion d'activité physique et de repos (voir: canon d'Ibn Sina, vol. 1, p. 15). Dans le chapitre 3 du livre I, il traite du régime alimentaire général des adultes en dix-sept chapitres, en commençant par l'exercice physique, car la santé repose en grande partie sur l'activité physique, puis l'alimentation et enfin le sommeil (voir: canon d'Ibn Sina, vol. 1, p. 221)."
  ur: "ابن سینا کا کہنا ہے کہ صحت کو برقرار رکھنے اور بیماری کو دور کرنے کے لیے مزید مضامین کی ضرورت ہے، ان میں کھانے پینے کا طریقہ، ہوا کا انتخاب، حرکت و آرام کا پیمانہ۔ کتاب I کی فین 3 میں وہ بالغوں کے لیے عام طرز عمل کا علاج کرتے ہیں، سترہ ابواب میں، ورزش سے شروع کرتے ہیں، کیونکہ صحت کی حفاظت کا زیادہ تر حصہ ورزش، پھر خوراک، پھر نیند میں ہے۔"
  tr: "İbn Sina, sağlığı korumak ve hastalıkları ortadan kaldırmak için yiyecek ve içeceği yönetmek, hava seçimi ve hareket ile hareketsizliği tahmin etmek gibi başka konular gerektiğini belirtir {cite:canon-ibn-sina-print-v1 s.15}. İlk kitabın üçüncü sanatında, yetişkinler için ortak yönetimi sunar; bu bölüm on yedi bölümden oluşur ve sporla başlar; çünkü çoğu sağlık yönetimi dinlenmeyi, sonra yiyeceği yönetmeyi, ardından uyku yönetimini içerir {cite:canon-ibn-sina-print-v1 s.221}."
  id: "Ibn Sina menyebutkan bahwa menjaga kesehatan dan menghilangkan penyakit membutuhkan topik lain, termasuk mengelola makanan dan minuman, memilih udara, serta memperkirakan gerakan dan keheningan {cite:canon-ibn-sina-print-v1 hlm.15}. Dalam seni ketiga buku pertama, ia mempresentasikan manajemen bersama untuk orang dewasa, yang terdiri dari tujuh belas bab, dan dimulai dengan olahraga, karena sebagian besar manajemen kesehatan melibatkan istirahat, kemudian mengelola makanan, kemudian mengelola tidur {cite:canon-ibn-sina-print-v1 hlm.221}."
