label: { ar: "التدبير وحفظ الصحة", en: "Regimen of health (al-tadbir)" }
summary:
  ar: "يذكر ابن سينا أن حفظ الصحة وإزالة المرض يحتاجان إلى موضوعات أخرى، منها التدبير بالمأكول والمشروب واختيار الهواء وتقدير الحركة والسكون {cite:canon-ibn-sina-print-v1 p.15}. وفي الفن الثالث من الكتاب الأول يعرض التدبير المشترك للبالغين، وهو سبعة عشر فصلاً، ويبدأ بالرياضة لأن معظم تدبير حفظ الصحة هو أن يُرتاض، ثم تدبير الغذاء، ثم تدبير النوم {cite:canon-ibn-sina-print-v1 p.221}."
  en: "Ibn Sina says that keeping health and removing disease need further subjects, among them the regimen of food and drink, the choice of air, and the measure of movement and rest {cite:canon-ibn-sina-print-v1 p.15}. In Fann 3 of Book I he treats the common regimen for adults, in seventeen chapters, beginning with exercise, since most of keeping health lies in exercise, then diet, then sleep {cite:canon-ibn-sina-print-v1 p.221}."
