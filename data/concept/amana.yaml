id: concept/amana
class: concept
kind: legal
label: { ar: "الأمانة", en: "Amana (trust, deposit and what is entrusted)" }
summary:
  ar: "الأمانة ضد الخيانة، وتطلق على التكاليف الشرعية وعلى ما يعهد به إلى الإنسان من وديعة ومال وأهل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375} ويستعملها الفقهاء بمعنى الشيء الموجود عند الأمين، كالوديعة والعارية والمضاربة والرهن واللقطة، وبمعنى الصفة كالأمانة في بيع المرابحة والوصي والقاضي والشاهد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376} ويجب حفظ الأمانة وردها عند الطلب، ويجب الضمان بالجحود أو التعدي أو التفريط، ويسقط إذا تلفت دون تعد أو تفريط، ويعزر من يترك أداءها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3377}"
  en: "Amana is the opposite of betrayal. It names the religious duties and whatever is entrusted to a person, such as a deposit, property or family. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375} The jurists use it in two senses: as a thing held by the trustee, such as a deposit, a loan, a silent partnership, a pledge or a found object, and as a quality, such as trustworthiness in a cost-plus sale, in a guardian, a judge or a witness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376} The trust must be kept and returned on demand; liability arises from denial, transgression or neglect, and falls away if the thing is lost without transgression or neglect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3377}"
