label: { ar: "الأمانة", en: "Amana (trust, deposit and what is entrusted)", fr: "Amana (confiance, dépôt et ce qui est confié)", es: "Amana (confianza, depósito y lo que se confía)", ur: "آمنہ ⁦(امانت، امانت اور جو کچھ سپرد کیا جاتا ہے)⁩" }
summary:
  ar: "الأمانة ضد الخيانة، وتطلق على التكاليف الشرعية وعلى ما يعهد به إلى الإنسان من وديعة ومال وأهل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375} ويستعملها الفقهاء بمعنى الشيء الموجود عند الأمين، كالوديعة والعارية والمضاربة والرهن واللقطة، وبمعنى الصفة كالأمانة في بيع المرابحة والوصي والقاضي والشاهد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376} ويجب حفظ الأمانة وردها عند الطلب، ويجب الضمان بالجحود أو التعدي أو التفريط، ويسقط إذا تلفت دون تعد أو تفريط، ويعزر من يترك أداءها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3377}"
  en: "Amana is the opposite of betrayal. It names the religious duties and whatever is entrusted to a person, such as a deposit, property or family. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375} The jurists use it in two senses: as a thing held by the trustee, such as a deposit, a loan, a silent partnership, a pledge or a found object, and as a quality, such as trustworthiness in a cost-plus sale, in a guardian, a judge or a witness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376} The trust must be kept and returned on demand; liability arises from denial, transgression or neglect, and falls away if the thing is lost without transgression or neglect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3377}"
  fr: "L’amana est l’opposé de la trahison. Elle désigne les devoirs religieux et ce qui est confié à une personne : un dépôt, des biens ou sa famille, par exemple. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375} Les juristes l’emploient en deux sens : comme un bien confié au dépositaire, qu’il s’agisse d’un dépôt, d’un prêt, d’une commandite, d’un gage ou d’un objet trouvé ; et comme une qualité, telle que la probité dans une vente au prix de revient majoré, ou chez un tuteur, un juge ou un témoin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376} Le bien confié doit être gardé et restitué sur demande ; la responsabilité est engagée en cas de dénégation, d’abus ou de négligence, et ne l’est pas si le bien se perd sans abus ni négligence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3377}"
  es: "Amana es lo opuesto a la traición. Nombra los deberes religiosos y todo aquello que se confía a una persona, como un depósito, una propiedad o la familia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375} Los juristas lo usan en dos sentidos: como una cosa en poder del fideicomisario, como un depósito, un préstamo, una sociedad silenciosa, una prenda o un objeto encontrado, y como una cualidad, como la confiabilidad en una venta de costo más margen, en un tutor, un juez o un testigo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376} La confianza debe mantenerse y devolverse a petición; la responsabilidad surge de la negación, la transgresión o la negligencia, y desaparece si la cosa se pierde sin transgresión ni negligencia. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3377}"
  ur: "آمنہ خیانت کے مخالف ہے۔ یہ مذہبی فرائض اور جو کچھ بھی کسی شخص کو سونپا جاتا ہے، جیسے کہ جمع، جائیداد یا خاندان کا نام ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3375} فقہاء اسے دو معنوں میں استعمال کرتے ہیں: امانت دار کے پاس رکھی ہوئی چیز کے طور پر، جیسے کہ امانت، قرض، خاموش شراکت، کوئی عہد یا کوئی چیز، اور معیار کے طور پر، جیسے قیمت کے علاوہ فروخت میں امانت داری، محافظ یا قاضی کے ساتھ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3375}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3376} امانت کو برقرار رکھا جائے اور مطالبہ پر واپس کیا جائے۔ ذمہ داری انکار، زیادتی یا کوتاہی سے پیدا ہوتی ہے، اور اگر چیز بغیر کسی زیادتی یا کوتاہی کے ضائع ہو جائے تو وہ گر جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3376}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3377}"
