label:
  ar: "آيات الإنسان"
  en: "The signs in the human being (ayat al-insan)"
  fr: "Les signes dans l’être humain (ayat al-insan)"
  ur: "انسان میں نشانیاں"
  es: "Los signos en el ser humano (ayat al-insan)"
  tr: "İnsanın Belirtileri"
  id: "Tanda-tanda Manusia"
summary:
  ar: "ما يعرضه الشيخ عمر عبد الكافي من آيات الله في الإنسان: قامته المنتصبة وبصمته الفريدة، والتنفس وتناسق الخلق، والكمال والنقص في الجسد والنفس {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep12 00:22:00}."
  en: "The signs of God in the human being, as Sheikh Omar Abdelkafy presents them: the upright stature and the unique fingerprint, breathing and the harmony of creation, and perfection and decline in the body and the soul {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep12 00:22:00}."
  fr: "Les signes de Dieu dans l’être humain selon le cheikh Omar Abdelkafy : la station droite et l’empreinte digitale unique, la respiration et l’harmonie de la création, la perfection et le déclin du corps et de l’âme {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep12 00:22:00}."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق انسان میں اللہ کی نشانیاں: سیدھا قد اور منفرد فنگر پرنٹ، سانس اور تخلیق کا توازن، اور جسم و نفس میں کمال و زوال {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep12 00:22:00}۔"
  es: "Los signos de Dios en el ser humano, como los presenta el jeque Omar Abdelkafy: la postura erguida y la huella dactilar única, la respiración y la armonía de la creación, y la perfección y el declive en el cuerpo y el alma {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep12 00:22:00}."
  tr: "Şeyh Ömer Abdulkafi'nin insanlarda Tanrı'nın işaretlerini sunduğu şeyler: dik duruşu, benzersiz izi, nefesi ve yaratılışın uyumu, beden ve ruhtaki mükemmellik ve eksiklik {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep12 00:22:00}."
  id: "Apa yang disajikan Sheikh Omar Abdulkafi tentang tanda-tanda Tuhan dalam manusia: postur tegaknya, jejak uniknya, pernapasan dan harmoni ciptaan, kesempurnaan dan kekurangan tubuh dan jiwa {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep12 00:22:00}."
