id: concept/miqadir
class: concept
kind: legal
label:
  ar: المَقَادِير
  en: Measures (miqadir)
  ur: مقادیر (پیمائشیں)
summary:
  ar: "المقادير جمع مقدار، وهي ما يُعرف به الشيء من معدود أو مكيل أو موزون أو مذروع، وأجناسها الكيل والوزن والذرع والعدد. والوحدة الأساسية في المكاييل الصاع والمد، والجمهور على أن الصاع الشرعي صاع أهل المدينة، وهو أربعة أمداد، بينما ذهب أبو حنيفة إلى أن الصاع الشرعي صاع العراق. ويتعلق بالصاع زكاة الفطر وكفارات الصيام والظهار والفدية في الإحرام ونفقة الزوجة. وتذكر الفقهاء كذلك العرق والفرق والقدح والقربة والقسط والقفيز والقلة، ولكل منها تقدير وأحكام تُذكر في مواضعها. هذه المادة مستوفاة بين صفحتي 14857 و14887، وتنتهي بالميل قبل مدخل «مُقَارَضَة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14862}"
  en: "Miqadir are measures: the means by which a thing is known as counted, measured by volume, weight or length. Their four kinds are volume (kayl), weight (wazn), length (dhar') and number ('adad). The basic units are the sa' and the mudd. Most jurists hold that the legal sa' is the sa' of Medina, four mudds, while Abu Hanifa holds it is the Iraqi sa'. The sa' fixes the zakat al-fitr, the expiation for deliberately breaking the Ramadan fast, the expiation for zihar, the ransom for ihram, the wife's maintenance and the water for ablution. Jurists also name the 'araq, the faraq, the qadah, the qirba, the qist, the qafiz and the qullah, each with its own quantity and rulings. The entry is complete from p.14857 to p.14887. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14861} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14862}"
  ur: "مقادیر مقدار کی جمع ہیں، یعنی وہ پیمانے جن سے گنتی، ماپ، وزن یا لمبائی معلوم ہو۔ صاع اور مد بنیادی اکائیاں ہیں، اور جمہور کے نزدیک شرعی صاع مدینہ کا صاع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14859}"
