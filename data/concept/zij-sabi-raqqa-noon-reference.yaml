label: { ar: "الرقة وانتصاف النهار مرجعاً لجداول الزيج الصابي", en: "Raqqa and its noon as the reference of the zij's tables", ur: "رقہ اور اس کا دوپہر زیج کے جدولوں کا مرجع", es: "Raqqa y su mediodía como referencia de las tablas del zij", fr: "Raqqa et son midi comme référence des tables du zij" }
summary:
  ar: "يذكر البتاني في فقرة الختام من مقدمة الباب الأول أنه جعل استخراج حركات الكواكب في جداول زيجه لوقت انتصاف النهار من اليوم الذي يُحسب فيه بمدينة الرقة، لأنها المدينة التي كان فيها الرصد والامتحان على تحقيق ذلك كله. {cite:zij-sabi-nallino-byblion p.11}."
  en: "In the closing lines of the foreword al-Battani says he made the extraction of the planets' motions in his tables for the moment of noon of the day being reckoned at the city of al-Raqqa, because that was where the observation and testing took place to verify all this. {cite:zij-sabi-nallino-byblion p.11}."
  ur: "پہلے باب کے آخری حصے میں البتانی کہتے ہیں کہ انہوں نے اپنی زیج کے جدولوں میں سیاروں کی حرکات کی تخریج اس دن کی دوپہر کے وقت کے لیے رکھی جو رقہ شہر میں شمار ہوتا ہے، کیونکہ وہی شہر تھا جہاں اس سب کی تحقیق کے لیے رصد اور امتحان ہوا۔ {cite:zij-sabi-nallino-byblion p.11}۔"
  es: "En las últimas líneas del prólogo, al-Battani afirma que extrajo los movimientos de los planetas en sus tablas para el momento del mediodía del día que se calculaba en la ciudad de al-Raqqa, porque allí se realizaban las observaciones y las pruebas para verificar todo esto. {cite:zij-sabi-nallino-byblion p.11}."
  fr: "Dans les dernières lignes de son avant-propos, al-Battani explique avoir établi les mouvements des planètes dans ses tables pour le moment du midi du jour calculé à Raqqa, car c'est là que les observations et les tests ayant permis de vérifier ces mouvements ont eu lieu. {cite:zij-sabi-nallino-byblion p.11}"
