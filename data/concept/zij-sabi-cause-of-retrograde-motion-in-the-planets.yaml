label: { ar: "علة رجوع الكواكب المتحيّرة", en: "The cause of retrograde motion in the wandering planets", ur: "متحیر سیاروں کی الٹی حرکت کی علت", es: "La causa del movimiento retrógrado en los planetas errantes", fr: "La cause du mouvement rétrograde des planètes errantes", tr: "Gezgin gezegenlerin geri dönüşünün sebebi", id: "Alasan kembalinya planet-planet pengembara" }
summary:
  ar: "يبيّن البتاني أن الكوكب المتحيّر يبدو راجعاً حين يكون في النصف الأقرب من فلك تدويره، وهو النصف الأسفل، إذ يتغير تعديله في اليوم الواحد أكثر من سيره الأوسط بالتعديل المحسوب، فيقع موضعه في فلك البروج أقل من الموضع السابق، ثم يعود إلى السير المقدَّم بعد أن يتجاوز نقطة مماسّ الفلك. {cite:zij-sabi-nallino-byblion p.98}."
  en: "Al-Battani shows that a wandering planet appears to go backward when it is in the nearer, lower half of its epicycle, because its equation changes in one day by more than its mean motion. Its place on the zodiac then falls behind its earlier place, and it resumes forward motion after passing the tangent point of the epicycle. {cite:zij-sabi-nallino-byblion p.98}."
  ur: "البتانی بتاتے ہیں کہ متحیر سیارہ اس وقت الٹا چلتا دکھائی دیتا ہے جب وہ اپنے فلکِ تدویر کے قریب تر، یعنی نچلے، نصف میں ہو، کیونکہ اس کا تعدیل ایک دن میں اس کی اوسط حرکت سے زیادہ بدلتا ہے؛ تو اس کا مقام بروجی فلک پر پہلے کے مقام سے پیچھے رہ جاتا ہے، اور فلکِ تدویر کے مماسی نقطے سے گزرنے کے بعد وہ آگے کی حرکت پر لوٹ آتا ہے۔ {cite:zij-sabi-nallino-byblion p.98}۔"
  es: "Al-Battani demuestra que un planeta errante parece retroceder cuando se encuentra en la mitad inferior y más cercana de su epiciclo, debido a que su ecuación cambia en un día en una cantidad mayor que su movimiento medio. Su posición en el zodíaco queda entonces rezagada con respecto a su posición anterior, y retoma su movimiento hacia adelante tras pasar el punto de tangencia del epiciclo. {cite:zij-sabi-nallino-byblion p.98}."
  fr: "Al-Battani démontre qu'une planète errante semble reculer lorsqu'elle se trouve dans la moitié inférieure et la plus proche de son épicycle, car son équation change en un jour de plus que sa vitesse moyenne. Sa position sur le zodiaque se retrouve alors en arrière par rapport à sa position précédente, et elle reprend son mouvement direct après avoir franchi le point de tangence de l'épicycle. {cite:zij-sabi-nallino-byblion p.98}."
  tr: "Al-Battani, gezegenin geriye doğru hareket etmesinin nedeninin, ekliptiğin daha yakın yarısında, yani alt yarısında bulunması olduğunu açıklıyor; çünkü sapması, hesaplanan ortalama sapmasından daha fazla bir günde değişiyor. Dolayısıyla, ekliptikteki konumu önceki konumundan daha aşağıya düşüyor, ardından ekliptiğe teğet noktasını geçtikten sonra ileri hareketine geri dönüyor. {cite:zij-sabi-nallino-byblion s.98}."
  id: "Al-Battani menjelaskan bahwa planet yang mengembara tampak retrograde ketika berada di bagian ekliptika yang lebih dekat, yaitu bagian bawah, karena deklinasinya berubah lebih banyak dalam satu hari daripada deklinasi rata-rata yang dihitung. Dengan demikian, posisinya di ekliptika turun lebih rendah daripada posisi sebelumnya, kemudian kembali ke gerakan maju setelah melewati titik singgung ekliptika. {cite:zij-sabi-nallino-byblion p.98}."
