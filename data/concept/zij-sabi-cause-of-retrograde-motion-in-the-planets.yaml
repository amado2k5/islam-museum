class: concept
kind: scientific
label: { ar: "علة رجوع الكواكب المتحيّرة", en: "The cause of retrograde motion in the wandering planets", ur: "متحیر سیاروں کی الٹی حرکت کی علت" }
summary:
  ar: "يبيّن البتاني أن الكوكب المتحيّر يبدو راجعاً حين يكون في النصف الأقرب من فلك تدويره، وهو النصف الأسفل، إذ يتغير تعديله في اليوم الواحد أكثر من سيره الأوسط بالتعديل المحسوب، فيقع موضعه في فلك البروج أقل من الموضع السابق، ثم يعود إلى السير المقدَّم بعد أن يتجاوز نقطة مماسّ الفلك. {cite:zij-sabi-nallino-byblion p.98}."
  en: "Al-Battani shows that a wandering planet appears to go backward when it is in the nearer, lower half of its epicycle, because its equation changes in one day by more than its mean motion. Its place on the zodiac then falls behind its earlier place, and it resumes forward motion after passing the tangent point of the epicycle. {cite:zij-sabi-nallino-byblion p.98}."
  ur: "البتانی بتاتے ہیں کہ متحیر سیارہ اس وقت الٹا چلتا دکھائی دیتا ہے جب وہ اپنے فلکِ تدویر کے قریب تر، یعنی نچلے، نصف میں ہو، کیونکہ اس کا تعدیل ایک دن میں اس کی اوسط حرکت سے زیادہ بدلتا ہے؛ تو اس کا مقام بروجی فلک پر پہلے کے مقام سے پیچھے رہ جاتا ہے، اور فلکِ تدویر کے مماسی نقطے سے گزرنے کے بعد وہ آگے کی حرکت پر لوٹ آتا ہے۔ {cite:zij-sabi-nallino-byblion p.98}۔"
