id: concept/canon-pulse-of-swellings-by-organ
class: concept
kind: scientific
label:
  ar: "نبض الأورام بحسب العضو عند ابن سينا"
  en: "The pulse of swellings by organ in the Canon"
  fr: "Pouls des gonflements selon l’organe dans le Canon"
  ur: "عضو کے لحاظ سے سوجنوں کی نبض قانون میں"
  es: "El pulso de las hinchazones por órgano en el Canon"
summary:
  ar: "يذكر ابن سينا أن تغير الورم للنبض يختلف بحسب عضوه، فالأعضاء العصبانية والعرقية والرطبة اللينة لها أحكامها، وبعض الأعضاء يعطي نبضاً مسمى {cite:canon-ibn-sina-print-v1 p.182}."
  en: "Ibn Sina notes that a swelling changes the pulse according to its organ: the nervous, the vascular and the moist soft organs each have their rulings, and some organs give a named pulse {cite:canon-ibn-sina-print-v1 p.182}."
  fr: "Ibn Sina distingue effets des organes nerveux, vasculaires et mous humides, certains donnant un pouls nommé {cite:canon-ibn-sina-print-v1 p.182}."
  es: "Ibn Sina señala que una hinchazón cambia el pulso según el órgano afectado: los órganos nerviosos, vasculares y blandos húmedos tienen cada uno sus propias reglas, y algunos órganos dan un pulso con nombre {cite:canon-ibn-sina-print-v1 p.182}."
  ur: "ابن سینا نوٹ کرتے ہیں کہ سوجن نبض کو اس کے عضو کے مطابق بدل دیتی ہے: اعصابی، عروقی اور نم نرم اعضاء میں سے ہر ایک کے اپنے احکام ہوتے ہیں، اور بعض اعضاء نامی نبض دیتے ہیں۔"
