summary:
  ar: "العنصل في الكتاب هو بصل الفأر، ورقه كورق السوسن وزهره إلى السواد، حار يابس في الثانية، مقطع فيه لزوجة، وفيه نفع للصدر والربو والسعال المزمن وللقوباء ولداء الثعلب {cite:canon-ibn-sina-print-v1 p.611}"
  en: "Unsul is in the book the mouse onion, its leaf like that of the iris and its flower inclining to black, hot and dry in the second degree, cutting with some viscosity, with benefit for the chest, asthma and chronic cough, and for ringworm and alopecia {cite:canon-ibn-sina-print-v1 p.611}"
  ur: "عنصل کتاب میں چوہے کا پیاز ہے، اس کا پتا سوسن کے پتے جیسا اور پھول سیاہی کی طرف مائل ہے، دوسرے درجے میں گرم خشک، کاٹنے والا جس میں لزوجت ہے، اور سینے، دمے، پرانی کھانسی، دادر اور داء الثعلب میں اس کا فائدہ ہے {cite:canon-ibn-sina-print-v1 p.611}۔"
