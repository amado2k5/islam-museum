summary:
  ar: "يوم المحشر في القرآن والسنة: اليوم الذي يُجمع فيه الناس إلى المحشر، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يجمع خلقه فيه."
  en: "The Day of Gathering in Qur'an and Sunnah: the day people are gathered to the Gathering Place — a sign of the Hour, a day of indescribable terror, when God gathers His creation there."
  ur: "یوم محشر قرآن و سنت میں: وہ دن جب لوگ محشر میں جمع کیے جاتے ہیں — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ اپنی مخلوق کو وہاں جمع کرتا ہے۔"
