id: concept/asbab-al-malinkhuliya-min-al-qalb
class: concept
kind: scientific
label:
  ar: "أسباب المالنخوليا من القلب"
  en: "Causes of melancholia from the heart"
  ur: "دل سے مالنخولیا کے اسباب"
summary:
  ar: "يذكر ابن سينا أن المالنخوليا الباردة اليابسة سببها سوء مزاج سوداوي في القلب يشركه فيه الدماغ لاتصال الروح النفساني بالحيواني، ولذلك يجمع علاج القلب مع علاج الدماغ، وأنها في آخر الأمراض المادية الحادة علامة موت {cite:canon-ibn-sina-print-v2 p.104} {cite:canon-ibn-sina-print-v2 p.105}"
  en: "Ibn Sina says the cold, dry melancholia comes from a black-bile bad temperament in the heart in which the brain shares, because the psychic pneuma is joined to the vital one, so the treatment of the heart goes with the treatment of the brain, and that at the end of material acute illnesses it is a sign of death {cite:canon-ibn-sina-print-v2 p.104} {cite:canon-ibn-sina-print-v2 p.105}"
  ur: "ابن سینا کہتا ہے کہ سرد خشک مالنخولیا کا سبب دل کی سوداوی بدمزاجی ہے جس میں دماغ شریک ہوتا ہے کیونکہ روحِ نفسانی روحِ حیوانی سے متصل ہے، اس لیے دل کا علاج دماغ کے علاج کے ساتھ ہوتا ہے، اور مادی تیز بیماریوں کے آخر میں یہ موت کی علامت ہے {cite:canon-ibn-sina-print-v2 p.104} {cite:canon-ibn-sina-print-v2 p.105}۔"
