id: concept/canon-causes-of-weakness-of-organs
class: concept
kind: scientific
label:
  ar: "أسباب ضعف الأعضاء عند ابن سينا"
  en: "The causes of weakness of the organs in the Canon"
  fr: "Causes de faiblesse des organes dans le Canon"
  ur: "اعضا کی کمزوری کے اسباب، قانون کے مطابق"
  es: "Las causas de debilidad de los órganos en el Canon"
summary:
  ar: "في الفصل التاسع والعشرين يقسّم ابن سينا ضعف الأعضاء بحسب موضع السبب إلى ما يرد على جرم العضو وما يرد على الروح الحامل للقوة وما يرد على القوة نفسها، ثم يذكر الأسباب البعيدة كفساد الهواء والماء والمأكل {cite:canon-ibn-sina-print-v1 p.152}."
  en: "In chapter 29 Ibn Sina classes weakness of the organs by where the cause falls: on the organ's body, on the spirit that bears the power, or on the power itself, and then names remote causes such as spoiled air, water and food {cite:canon-ibn-sina-print-v1 p.152}."
  fr: "Au chapitre 29, Ibn Sina classe la faiblesse selon le siège de sa cause : corps de l’organe, esprit portant la faculté, ou faculté même ; puis il cite des causes éloignées, air, eau et aliments corrompus {cite:canon-ibn-sina-print-v1 p.152}."
  es: "En el capítulo 29, Ibn Sina clasifica la debilidad de los órganos según dónde recae la causa: en el cuerpo del órgano, en el espíritu que posee el poder o en el poder mismo, y luego nombra causas remotas como el aire, el agua y los alimentos contaminados {cite:canon-ibn-sina-print-v1 p.152}."
