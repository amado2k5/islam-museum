summary:
  ar: "في الفصل التاسع والعشرين يقسّم ابن سينا ضعف الأعضاء بحسب موضع السبب إلى ما يرد على جرم العضو وما يرد على الروح الحامل للقوة وما يرد على القوة نفسها، ثم يذكر الأسباب البعيدة كفساد الهواء والماء والمأكل {cite:canon-ibn-sina-print-v1 p.152}."
  en: "In chapter 29 Ibn Sina classes weakness of the organs by where the cause falls: on the organ's body, on the spirit that bears the power, or on the power itself, and then names remote causes such as spoiled air, water and food {cite:canon-ibn-sina-print-v1 p.152}."
