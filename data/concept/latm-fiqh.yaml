id: concept/latm-fiqh
class: concept
kind: legal
label:
  ar: "اللَّطْم"
  en: "Slapping (latm), fiqh rulings"
  ur: "تھپڑ مارنا ⁦(فقہی احکام)⁩"
  es: "Bofetadas (latm), resoluciones del fiqh"
  fr: "Gifles (latm), décisions de fiqh"
  tr: "Tokat atmak"
  id: "Menampar"
summary:
  ar: "اللطم في اللغة الضرب على الخد ببسط الكف، واللطمة المرة منه، وهو عند الفقهاء بالمعنى نفسه؛ والصفع الضرب على القفا بالكف، والوكز الدفع والضرب بجمع الكف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13616}."
  en: "Latm, in lexicon, is striking the cheek with the open palm, and a single blow is a latmah; the jurists keep the same sense. Safʿ is a blow on the nape with the palm, and wakz is a push or a blow with the fist closed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13616}."
  ur: "لطم لغت میں ہتھیلی پھیلا کر رخسار پر مارنا ہے، اور ایک بار کو لطمہ کہتے ہیں، اور فقہاء یہی معنی لیتے ہیں؛ صفع گدی پر ہتھیلی سے مارنا ہے، اور وکز مٹھی بند کر کے دھکا دینا یا مارنا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13616}۔"
  es: "Latm, en el léxico, es golpear la mejilla con la palma abierta, y un solo golpe es un latmah; los juristas mantienen el mismo sentido. Safʿ es un golpe en la nuca con la palma, y wakz es un empujón o un golpe con el puño cerrado {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13616}."
  fr: "Le terme « latm », dans le lexique, désigne un coup porté à la joue avec la paume ouverte, et un seul coup est appelé « latmah »; les juristes conservent cette même signification. « Safʿ » désigne un coup porté à la nuque avec la paume, et « wakz » désigne une poussée ou un coup porté avec le poing fermé {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13616}."
  tr: "Dil olarak, 'al-latm' avuç içi uzatarak yanağa vurmak anlamına gelir ve 'slap' 'al-latmah' (tokat) ile aynı anlamda ifade edilir; 'slap' avuç içi ile sırtın arkasına vurmak, 'al-waqz' ise avuç içi çoğul olarak itmek ve vurmak anlamına gelir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13616}."
  id: "Dalam bahasa, 'al-latm' berarti memukul pipi dengan mengulurkan telapak tangan, dan 'tamparan' berarti sama dengan 'al-latmah' (tamparan), yang merupakan arti yang sama di kalangan ahli hukum; 'tamparan' berarti memukul punggung dengan telapak tangan, dan 'al-waqz' berarti mendorong dan memukul dengan mengjamakkan telapak tangan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13616}."
