id: concept/latm-fiqh
class: concept
kind: legal
label:
  ar: "اللَّطْم"
  en: "Slapping (latm), fiqh rulings"
  ur: "تھپڑ مارنا (فقہی احکام)"
summary:
  ar: "اللطم في اللغة الضرب على الخد ببسط الكف، واللطمة المرة منه، وهو عند الفقهاء بالمعنى نفسه؛ والصفع الضرب على القفا بالكف، والوكز الدفع والضرب بجمع الكف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13616}."
  en: "Latm, in lexicon, is striking the cheek with the open palm, and a single blow is a latmah; the jurists keep the same sense. Safʿ is a blow on the nape with the palm, and wakz is a push or a blow with the fist closed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13616}."
  ur: "لطم لغت میں ہتھیلی پھیلا کر رخسار پر مارنا ہے، اور ایک بار کو لطمہ کہتے ہیں، اور فقہاء یہی معنی لیتے ہیں؛ صفع گدی پر ہتھیلی سے مارنا ہے، اور وکز مٹھی بند کر کے دھکا دینا یا مارنا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13616}۔"
