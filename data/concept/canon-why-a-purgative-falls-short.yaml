id: concept/canon-why-a-purgative-falls-short
class: concept
kind: scientific
label: { ar: "لماذا يقصر الدواء المسهل عند ابن سينا", en: "Why a purgative falls short in the Canon", ur: "مسہل کیوں کوتاہی کرتا ہے قانون میں", es: "Por qué un purgante no cumple con los requisitos del Canon", fr: "Pourquoi un purgatif est insuffisant dans le canon", tr: "İbn Sina'ya göre müshil ilaç neden kısaltır?", id: "Mengapa obat pencahar dipersingkat menurut Avicenna?" }
summary:
  ar: "يذكر ابن سينا من أسباب تقصير الدواء ضيق المجاري خلقة أو لمزاج أو لمجاورة علة كما في الفالج، ويحذر من جمع مسهلين في يوم واحد، ويقول إن الدواء الخاص بخلط إن لم يجده شوش وأسهل بعسر، وإنه يسهل أولاً ما يخصه ثم ما يليه، إلا الدم فيؤخره، وإن جذب الخلط البعيد صعب {cite:canon-ibn-sina-print-v1 p.281}."
  en: "Ibn Sina lists as causes of a drug falling short narrowness of the channels by make, temperament or a neighbouring illness, as in palsy, warns against two purgatives in one day, says a drug for a particular humour that does not find it disturbs and purges with difficulty, purges first what it is specific to and then what follows, but holds blood back, and says drawing a distant humour is hard {cite:canon-ibn-sina-print-v1 p.281}."
  es: "Ibn Sina enumera como causas de que un medicamento no sea efectivo la estrechez de los canales por constitución, temperamento o una enfermedad vecina, como la parálisis, advierte contra dos purgantes en un día, dice que un medicamento para un humor particular que no lo encuentra perturbado y purga con dificultad, purga primero lo que es específico y luego lo que sigue, pero retiene la sangre, y dice que extraer un humor distante es difícil {cite:canon-ibn-sina-print-v1 p.281}."
  fr: "Ibn Sina cite comme causes d'échec d'un médicament l'étroitesse des canaux due à la constitution, au tempérament ou à une maladie voisine, comme dans le cas de la paralysie, met en garde contre deux purgatifs dans la même journée, dit qu'un médicament destiné à une humeur particulière qui ne la trouve pas perturbe et purge avec difficulté, purge d'abord ce à quoi il est spécifique puis ce qui suit, mais retient le sang, et dit qu'extraire une humeur éloignée est difficile {cite:canon-ibn-sina-print-v1 p.281}."
  ur: "ابن سینا بناوٹ، مزاج یا پڑوسی بیماری کی وجہ سے نالیوں کے تنگ ہونے کے اسباب کے طور پر درج کرتا ہے، جیسا کہ فالج میں ہے، ایک دن میں دو رفع حاجت کے خلاف تنبیہ کرتا ہے، ایک خاص مزاح کے لیے ایسی دوا کہتا ہے جو اسے پریشان نہیں کرتا اور مشکل سے صاف کرتا ہے، پہلے اس چیز کو صاف کرتا ہے جس سے وہ مخصوص ہے اور پھر خون کو روکتا ہے، اور اس کے بعد یہ کہتا ہے کہ اس کے بعد سختی ہوتی ہے، اور اس کے بعد کیا ہوتا ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 281}۔"
  tr: "İbn Sina, ilacın kısalmasının nedenlerinden birinin, doğuştan veya ruh hali ya da bir hastalık nedeniyle kanalların daralması olduğunu belirtir; örneğin felç durumunda olduğu gibi. Bir günde iki müshilin birleştirilmesine karşı uyarıda bulunur. Karıştırma ilacının bulunmazsa karıştırıcı olduğunu, zorlukla daha kolay olduğunu, önce ona ait olanı kolaylaştırdığını, sonra kan hariç, bunun geciktirdiğini söyler. Uzak karışım çıkarmak zordur {cite:canon-ibn-sina-print-v1 s.281}."
  id: "Ibn Sina menyebutkan bahwa salah satu penyebab pemendekan obat adalah penyempitan saluran akibat bawaan atau suasana hati, atau karena penyakit, seperti dalam kasus stroke. Ia memperingatkan agar tidak menggabungkan dua pencahar dalam satu hari. Ia mengatakan bahwa obat pencampuran akan membingungkan jika tidak ditemukan dan lebih mudah dengan kesulitan, dan pertama-tama memudahkan apa yang termasuk, lalu apa yang terjadi selanjutnya, kecuali darah, yang menundanya. Menarik campuran jauh itu sulit {cite:canon-ibn-sina-print-v1 hlm.281}."
