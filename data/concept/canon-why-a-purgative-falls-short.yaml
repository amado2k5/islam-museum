label: { ar: "لماذا يقصر الدواء المسهل عند ابن سينا", en: "Why a purgative falls short in the Canon", ur: "مسہل کیوں کوتاہی کرتا ہے قانون میں" }
summary:
  ar: "يذكر ابن سينا من أسباب تقصير الدواء ضيق المجاري خلقة أو لمزاج أو لمجاورة علة كما في الفالج، ويحذر من جمع مسهلين في يوم واحد، ويقول إن الدواء الخاص بخلط إن لم يجده شوش وأسهل بعسر، وإنه يسهل أولاً ما يخصه ثم ما يليه، إلا الدم فيؤخره، وإن جذب الخلط البعيد صعب {cite:canon-ibn-sina-print-v1 p.281}."
  en: "Ibn Sina lists as causes of a drug falling short narrowness of the channels by make, temperament or a neighbouring illness, as in palsy, warns against two purgatives in one day, says a drug for a particular humour that does not find it disturbs and purges with difficulty, purges first what it is specific to and then what follows, but holds blood back, and says drawing a distant humour is hard {cite:canon-ibn-sina-print-v1 p.281}."
