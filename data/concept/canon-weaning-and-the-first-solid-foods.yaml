summary:
  ar: "يذكر ابن سينا أن الطفل إذا اشتهى غير اللبن أعطي بالتدريج، وأول ذلك خبز تمضغه المرضع ثم خبز بماء وعسل أو شراب أو لبن، ثم ينقل بعد الفطام إلى الأحساء واللحوم الخفيفة، ويكون الفطام بالتدريج {cite:canon-ibn-sina-print-v1 p.210}."
  en: "Ibn Sina says that when the child wants something besides milk it is given gradually, first bread chewed by the nurse, then bread in water and honey, wine or milk; after weaning it moves to gruels and light meats, and weaning is done gradually {cite:canon-ibn-sina-print-v1 p.210}."
