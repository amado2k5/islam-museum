id: concept/canon-weaning-and-the-first-solid-foods
class: concept
kind: scientific
label: { ar: "الفطام والتغذية الأولى بغير اللبن", en: "Weaning and the first foods besides milk", ur: "دودھ چھڑانا اور دودھ کے علاوہ پہلی غذا", es: "El destete y los primeros alimentos además de la leche", fr: "Le sevrage et les premiers aliments autres que le lait", tr: "Sütten kesilme ve sütsüz ilk beslenme", id: "Penyapihan dan nutrisi pertama tanpa susu" }
summary:
  ar: "يذكر ابن سينا أن الطفل إذا اشتهى غير اللبن أعطي بالتدريج، وأول ذلك خبز تمضغه المرضع ثم خبز بماء وعسل أو شراب أو لبن، ثم ينقل بعد الفطام إلى الأحساء واللحوم الخفيفة، ويكون الفطام بالتدريج {cite:canon-ibn-sina-print-v1 p.210}."
  en: "Ibn Sina says that when the child wants something besides milk it is given gradually, first bread chewed by the nurse, then bread in water and honey, wine or milk; after weaning it moves to gruels and light meats, and weaning is done gradually {cite:canon-ibn-sina-print-v1 p.210}."
  es: "Ibn Sina dice que cuando el niño quiere algo además de leche, se le da gradualmente, primero pan masticado por la nodriza, luego pan con agua y miel, vino o leche; después del destete pasa a papillas y carnes ligeras, y el destete se hace gradualmente {cite:canon-ibn-sina-print-v1 p.210}."
  fr: "Ibn Sina dit que lorsque l'enfant veut autre chose que du lait, on le lui donne progressivement, d'abord du pain mâché par la nourrice, puis du pain dans de l'eau et du miel, du vin ou du lait; après le sevrage, on passe aux bouillies et aux viandes légères, et le sevrage se fait progressivement {cite:canon-ibn-sina-print-v1 p.210}."
  ur: "ابن سینا کا کہنا ہے کہ جب بچہ دودھ کے علاوہ کچھ چاہتا ہے تو اسے بتدریج دیا جاتا ہے، پہلے نرس کی طرف سے چبائی ہوئی روٹی، پھر پانی اور شہد، شراب یا دودھ میں روٹی۔ دودھ چھڑانے کے بعد یہ ہلکے اور ہلکے گوشت کی طرف جاتا ہے، اور دودھ چھڑانا آہستہ آہستہ کیا جاتا ہے"
  tr: "İbn Sina, bir çocuk süt dışında bir şey isterse, ona yavaş yavaş verildiğini, önce emziren annenin çiğnediği ekmekle başladığını, ardından su, bal, şurup veya sütle ekmek verildiğini belirtir. Sütten kesildikten sonra Al-Ahsa'ya ve hafif etlere aktarılır ve sütten kesilme kademeli olarak yapılır {cite:canon-ibn-sina-print-v1 s.210}."
  id: "Ibn Sina menyebutkan bahwa jika seorang anak menginginkan sesuatu selain susu, ia diberikan secara bertahap, dimulai dengan roti yang dikunyah oleh ibu menyusui, lalu roti dengan air, madu, sirup, atau susu. Setelah disapih, ia dipindahkan ke Al-Ahsa dan daging ringan, dan penyapihan dilakukan secara bertahap {cite:canon-ibn-sina-print-v1 hlm.210}."
