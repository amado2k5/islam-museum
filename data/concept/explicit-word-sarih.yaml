id: concept/explicit-word-sarih
class: concept
kind: legal
label:
  ar: "الصَّرِيح"
  en: "Sarih (the explicit word in law: its meaning, its sources, the difference from the allusive word, and its rules across the chapters of law)"
summary:
  ar: "الصريح في اللغة الخالص من تعلقات غيره، وفي الاصطلاح اسم لكلام مكشوف المراد به بكثرة الاستعمال، حقيقة كان أو مجازا، وقيل ما غلب استعماله في معنى بحيث يتبادر، وقيل اللفظ الموضوع لمعنى لا يفهم منه غيره عند الإطلاق، ويقابله الكناية. والفرق أن الصريح يدرك مراده بالنطق دون نية، والكناية تحتاج إلى نية، والتعريض لفظ يفهم منه المراد دون تصريح. ومأخذ الصريح الشرع أو شيوع الاستعمال، وللسبكي مراتب فيه. ومن قواعده أن الصريح فيه معنى التعبد، وأن الصريح لا يحتاج إلى نية، وأن الصرائح تعمل بنفسها، وأن الصريح في بابه إذا نفذ في موضوعه لا يكون كناية في غيره. وقد وقع الصريح والكناية في أبواب الفقه، ومنها البيع والوقف والهبة والخطبة والنكاح والخلع والطلاق والظهار والقذف والنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10370} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10379}"
  en: "In language sarih is what is free of the attachments of others; as a term it is an utterance whose meaning is open through frequent use, whether literal or figurative. The allusive word (kinaya) is its opposite: the explicit word is understood without intention, the allusion needs it, and an indirect hint (ta'ridh) conveys a meaning without stating it. Its source is either the law or common use. Its rules include: the explicit word carries a sense of worship and is not left to private intention; it does not need intention while the allusion does; and once a word takes effect in its own field it does not become an allusion elsewhere. Explicit and allusive wording occurs in the chapters on sale, endowment, gift, betrothal, marriage, release, divorce, zihar, slander and vows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10370} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10371} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10378} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10379}"
