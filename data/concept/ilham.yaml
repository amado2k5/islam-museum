label: { ar: "الإلهام", en: "Ilham (inspiration)", es: "Ilham (inspiración)", fr: "Ilham (inspiration)", ur: "الہام ⁦(الہام)⁩", tr: "İlham", id: "Inspirasi" }
summary:
  ar: "الإلهام في اللغة أن يلقي الله في النفس أمرا يبعث على الفعل أو الترك، وهو عند الأصوليين إيقاع شيء في القلب يطمئن له الصدر يختص الله به بعض أصفيائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327} إلهام الأنبياء حق وحجة عليهم وعلى أمتهم، أما إلهام غير الأنبياء فليس حجة عند جمهور أهل العلم، ويفرق عن الوسوسة والتحري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3328}"
  en: "Ilham is, in the lexical sense, God putting into the soul a matter that moves to act or to refrain; for the usulis it is a thing cast on the heart that quiets the breast, reserved by God for some of His chosen servants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327} The ilham of the prophets is true and binding on them and on their community; the ilham of others is not binding for most scholars, and it differs from whispering and from careful search. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3328}"
  es: "Ilham es, en sentido léxico, la presencia divina que infunde en el alma una materia que impulsa a actuar o a abstenerse; para los usulis, es algo que Dios deposita en el corazón, que aquieta el pecho, reservado para algunos de sus siervos escogidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327} El ilham de los profetas es verdadero y vinculante para ellos y su comunidad; el ilham de otros no es vinculante para la mayoría de los eruditos y difiere de un susurro y de una búsqueda minuciosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3328}"
  fr: "L'ilham, au sens lexical, est ce que Dieu insuffle à l'âme, ce qui la pousse à agir ou à s'abstenir; pour les usulis, c'est une chose déposée sur le cœur qui apaise la poitrine, réservée par Dieu à certains de Ses serviteurs élus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327} L'ilham des prophètes est vraie et contraignante pour eux et leur communauté; l'ilham des autres n'est pas contraignante pour la plupart des savants, et elle diffère du murmure et de la recherche approfondie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3328}"
  ur: "الہام، لغوی معنوں میں، خدا نے روح میں ایک ایسا معاملہ ڈالنا ہے جو عمل کرنے یا باز رہنے کی طرف لے جاتا ہے۔ اسولیوں کے لیے یہ دل پر پڑنے والی چیز ہے جو سینہ کو سکون دیتی ہے، جسے خدا نے اپنے چند چنے ہوئے بندوں کے لیے مخصوص کر رکھا ہے۔ انبیاء کا الہام سچا اور ان پر اور ان کی امت پر واجب ہوتا ہے۔ دوسروں کا الہام اکثر علماء کے لیے پابند نہیں ہے، اور یہ سرگوشی اور احتیاط سے تلاش کرنے سے مختلف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3327}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3328}"
  tr: "Dilde ilham, Tanrı'nın ruha eylem veya ihmal hareketini tetikleyen bir şey göndermesidir. İlke bilginlerine göre, göğsü rahatlatan kalbe bir şeyin yerleştirilmesidir ve Tanrı bazı seçtiklerine özgüdür. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3327} Peygamberlerin ilhamı, onlara ve uluslarına karşı bir hak ve kanıttır; oysa peygamber olmayanlardan gelen ilham, çoğu alimin görüşüne göre bir kanıt değildir ve fısıldama ile araştırmadan farklıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3328}"
  id: "Dalam bahasa, inspirasi adalah ketika Tuhan melemparkan sesuatu ke dalam jiwa yang mendorong tindakan atau kelalaian. Menurut para sarjana prinsip, penempatan sesuatu di hati yang menenangkan dada, dan Tuhan khusus untuk beberapa orang pilihan-Nya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3327} Inspirasi para nabi adalah hak dan bukti terhadap mereka dan bangsa mereka, sedangkan inspirasi dari non-nabi bukanlah bukti menurut mayoritas sarjana dan berbeda dengan bisikan dan penyelidikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3328}"
