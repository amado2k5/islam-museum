label: { ar: "الإلهام", en: "Ilham (inspiration)" }
summary:
  ar: "الإلهام في اللغة أن يلقي الله في النفس أمرا يبعث على الفعل أو الترك، وهو عند الأصوليين إيقاع شيء في القلب يطمئن له الصدر يختص الله به بعض أصفيائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327} إلهام الأنبياء حق وحجة عليهم وعلى أمتهم، أما إلهام غير الأنبياء فليس حجة عند جمهور أهل العلم، ويفرق عن الوسوسة والتحري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3328}"
  en: "Ilham is, in the lexical sense, God putting into the soul a matter that moves to act or to refrain; for the usulis it is a thing cast on the heart that quiets the breast, reserved by God for some of His chosen servants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327} The ilham of the prophets is true and binding on them and on their community; the ilham of others is not binding for most scholars, and it differs from whispering and from careful search. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3327}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3328}"
