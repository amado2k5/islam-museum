id: concept/riwaya-wa-tariq
class: concept
kind: term
label:
  ar: الرواية والطريق في القراءات
  en: "Riwaya and tariq: reader, transmitter and path"
  ur: "روایت اور طریق: قاری، راوی اور راستہ"
  es: "Riwaya y tariq: lector, transmisor y camino"
summary:
  ar: "القراءة تُنسب إلى إمام القراءة، وتنقلها عنه رواة، وتصل إلينا من الراوي بطرق؛ ويعرض ابن الجزري مثلاً قراءة قنبل من طريقي ابن مجاهد وابن شنبوذ، ويذكر أن كتابه جمع ثمانين طريقاً بينما في الشاطبية والتيسير أربعة عشر {cite:nashr-dahman-damascus-1345-v1 p. 64} {cite:nashr-dahman-damascus-1345-v1 p. 66}."
  en: "A reading is attributed to an imam of recitation, carried from him by transmitters, and reaches us from each transmitter by paths; Ibn al-Jazari gives as an example Qunbul's reading by the paths of Ibn Mujahid and Ibn Shannabudh, and says his book gathers eighty paths where al-Shatibiyya and al-Taysir have fourteen {cite:nashr-dahman-damascus-1345-v1 p. 64} {cite:nashr-dahman-damascus-1345-v1 p. 66}."
  ur: "قراءت امامِ قراءت کی طرف منسوب ہوتی ہے، اس سے راوی نقل کرتے ہیں، اور ہر راوی سے ہم تک مختلف طرق سے پہنچتی ہے؛ ابن الجزری مثال میں قنبل کی قراءت کو ابن مجاہد اور ابن شنبوذ کے دو طریقوں سے دیتے ہیں، اور بتاتے ہیں کہ ان کی کتاب میں اسی طرق ہیں جبکہ شاطبیہ اور تیسیر میں چودہ {cite:nashr-dahman-damascus-1345-v1 p. 64} {cite:nashr-dahman-damascus-1345-v1 p. 66}۔"
  es: "Una lectura se atribuye a un imán de recitación, transmitida desde él por transmisores, y nos llega desde cada transmisor por caminos; Ibn al-Jazari da como ejemplo la lectura de Qunbul por los caminos de Ibn Mujahid e Ibn Shannabudh, y dice que su libro reúne ochenta caminos donde al-Shatibiyya y al-Taysir tienen catorce {cite:nashr-dahman-damascus-1345-v1 p. 64} {cite:nashr-dahman-damascus-1345-v1 p. 66}."
