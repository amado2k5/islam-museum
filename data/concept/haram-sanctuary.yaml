label: { ar: "الحرم", en: "The sacred sanctuary (haram)", ur: "حرم ⁦(مقدس علاقہ)⁩", es: "El santuario sagrado (haram)", fr: "Le sanctuaire sacré (haram)" }
summary:
  ar: "الحرم في الاصطلاح مكة وما حولها، ويطلق أيضا على المدينة وما حولها، والحرم المكي له حدود تُحدّ من جهات عدة بالأميال، ويبدأ حسابها من الحجر الأسود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6999} وتحريم مكة بالكتاب والسنة، ومن أحكامه أن من أراد دخول الحرم بقصد الحج أو العمرة أحرم من الميقات، ومن جاوزه بغير إحرام لزمه دم، وعلى الآفاقي إذا أراد الحرم لغير النسك الإحرام عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7000} ومنع غير المسلم من السكنى في الحرم بالإجماع، وخالف الحنفية فلم يمنعوا الذمي من الدخول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} ويحرم القتال في الحرم إلا ما بدأه المعتدي، وخلاف في قتال الكفار والبغاة إذا لم يبدءوا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7003} ويحرم قطع النبات الرطب مما لا يستنبته الناس، ويستثنى الإذخر، وفي الضمان عن القطع خلاف بين شاة وبقرة بحسب الشجرة، ويحرم صيد البري في الحرم، ويجوز قتل الغراب والحدأة والعقرب والحية والفأرة والكلب العقور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} ويحرم نقل تراب الحرم وأحجاره إلى الحل عند الشافعية، والحنابلة يكرهون ذلك، وفي كراء بيوت مكة خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7010} وفي الحرم أحكام أخرى: اللقطة تُعرّف أبدا عند الشافعية، ويسن الغسل لدخوله، ويؤاخذ الإنسان بهمّ السيئة فيه، ومجاورته مستحبة عند الجمهور، ولا تمتع ولا قران على أهل مكة، ويجوز ذبح الهدي في الحرم، وقد تغلظ الدية فيه عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} وحرم المدينة عند الجمهور له حد ما بين ثور وعير، ويحرم صيدها وشجرها عند الشافعية والمالكية والحنابلة، ولا جزاء فيه عند جمهورهم، والحنفية يرون لها الزينة لا الحرمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018}"
  en: "The sanctuary (haram) in the technical sense is Mecca and its surroundings; the name is also used for Medina and its surroundings. Mecca's sanctuary has boundaries measured in miles from several directions, reckoned from the Black Stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6999} Its sanctity rests on the Qur'an and the Sunna. A pilgrim who enters it for hajj or umra must take ihram at the station; one who passes a station without ihram owes a sacrifice; a traveller from outside who enters for another purpose must, according to the majority, take ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7000} By consensus a non-Muslim may not settle there, though the Hanafis do not bar a protected non-Muslim from entering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} Fighting in the sanctuary is lawful only in reply to attack, and the jurists differ on fighting unbelievers or rebels who do not begin the fight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7003} It is forbidden to cut moist plants that people do not cultivate, with idhkhir excepted, and the liability differs between a sheep and a cow by the size of the tree; hunting land game in the sanctuary is forbidden, while the crow, the kite, the scorpion, the snake, the rat and the rabid dog may be killed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} Removing the soil or stones of the sanctuary is forbidden by the Shafi'is and disliked by the Hanbalis; renting its houses is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7010} Other rules: a found object is kept and announced forever according to the Shafi'is; it is recommended to wash on entering; a man is held to account for an evil intention there; living there is recommended by the majority; there is no tamattu' or qiran for the people of Mecca; the offering may be sacrificed within the sanctuary; and the blood-money is sometimes raised there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} Medina's sanctuary, for the majority, lies between Thawr and 'Ir; its game and trees are protected for the Shafi'is, Malikis and Hanbalis, though the majority impose no penalty for them, while the Hanafis hold that Medina has no sanctuary but an honour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018}"
  es: "El santuario (haram) en sentido técnico es La Meca y sus alrededores; el nombre también se usa para Medina y sus alrededores. El santuario de La Meca tiene límites medidos en millas desde varias direcciones, contados desde la Piedra Negra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6999} Su santidad se basa en el Corán y la Sunna. Un peregrino que entra para el Hajj o la Umrah debe tomar el ihram en la estación; quien pasa una estación sin ihram debe un sacrificio; un viajero de fuera que entra con otro propósito debe, según la mayoría, tomar el ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7000} Por consenso, un no musulmán no puede establecerse allí, aunque los hanafíes no prohíben la entrada a un no musulmán protegido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} Luchar en el santuario es lícito solo en respuesta a un ataque, y los juristas difieren en cuanto a luchar contra infieles o rebeldes que no inician la lucha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7003} Está prohibido cortar plantas húmedas que la gente no cultiva, con la excepción de idhkhir, y la responsabilidad difiere entre una oveja y una vaca por el tamaño del árbol; la caza de animales terrestres en el santuario está prohibida, mientras que el cuervo, el milano, el escorpión, la serpiente, la rata y el perro rabioso pueden ser asesinados. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7004} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7005} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7006} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} Quitar la tierra o las piedras del santuario está prohibido por los Shafi'is y no es del agrado de los Hanbalis; el alquiler de sus casas está en disputa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7010} Otras reglas: un objeto encontrado se guarda y se anuncia para siempre según los shafi'is; se recomienda lavarse al entrar; un hombre es considerado responsable de una mala intención allí; vivir allí es recomendado por la mayoría; no hay tamattu' ni qiran para la gente de La Meca; la ofrenda puede ser sacrificada dentro del santuario; y a veces se recauda allí el dinero de sangre. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7011} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7012} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7013} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} El santuario de Medina, para la mayoría, se encuentra entre Thawr e 'Ir; Su fauna y sus árboles están protegidos para los shafiíes, malikíes y hanbalíes, aunque la mayoría no impone ninguna sanción por ello, mientras que los hanafíes sostienen que Medina no tiene santuario, sino honor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018}"
  fr: "Le sanctuaire (haram), au sens strict, désigne La Mecque et ses environs; ce terme est également employé pour Médine et ses environs. Les limites du sanctuaire de La Mecque sont mesurées en milles depuis la Pierre Noire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6999} Sa sainteté repose sur le Coran et la Sunna. Le pèlerin qui y entre pour le hajj ou la umra doit revêtir l'ihram à chaque station; celui qui franchit une station sans ihram doit accomplir un sacrifice; le voyageur venant de l'extérieur et y entrant pour un autre motif doit, selon l'avis majoritaire, revêtir l'ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7000} Par consensus, un non-musulman ne peut s'y installer, bien que les hanafites n'interdisent pas à un non-musulman protégé d'y entrer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} Combattre dans le sanctuaire n'est licite qu'en riposte à une attaque, et les juristes divergent quant à la possibilité de combattre des infidèles ou des rebelles qui n'ont pas initié le combat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7003} Il est interdit de couper des plantes humides que les gens ne cultivent pas, à l'exception de l'idhkhir, et la responsabilité diffère entre un mouton et une vache selon la taille de l'arbre; la chasse au gibier terrestre dans le sanctuaire est interdite, tandis que le corbeau, le milan, le scorpion, le serpent, le rat et le chien enragé peuvent être tués. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} Enlever la terre ou les pierres du sanctuaire est interdit par les Shafi'is et détesté par les Hanbalis; la location de ses maisons est contestée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7010} Autres règles: selon l’école shafi’ite, un objet trouvé est conservé et déclaré à perpétuité; il est recommandé de se laver les mains en y entrant; une personne est tenue responsable de toute mauvaise intention commise dans ce lieu; la majorité recommande d’y vivre; il n’y a ni tamattu’ ni qiran pour les habitants de La Mecque; l’offrande peut être sacrifiée à l’intérieur du sanctuaire; et le prix du sang y est parfois collecté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} Le sanctuaire de Médine, pour la majorité, se situe entre Thawr et 'Ir; Le gibier et les arbres de Médine sont protégés pour les chaféites, les malikites et les hanbalites, bien que la majorité n'impose aucune sanction à leur encontre, tandis que les hanafites considèrent que Médine n'offre aucun sanctuaire, mais seulement un honneur."
