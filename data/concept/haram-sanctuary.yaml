label: { ar: "الحرم", en: "The sacred sanctuary (haram)", ur: "حرم (مقدس علاقہ)" }
summary:
  ar: "الحرم في الاصطلاح مكة وما حولها، ويطلق أيضا على المدينة وما حولها، والحرم المكي له حدود تُحدّ من جهات عدة بالأميال، ويبدأ حسابها من الحجر الأسود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6999} وتحريم مكة بالكتاب والسنة، ومن أحكامه أن من أراد دخول الحرم بقصد الحج أو العمرة أحرم من الميقات، ومن جاوزه بغير إحرام لزمه دم، وعلى الآفاقي إذا أراد الحرم لغير النسك الإحرام عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7000} ومنع غير المسلم من السكنى في الحرم بالإجماع، وخالف الحنفية فلم يمنعوا الذمي من الدخول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} ويحرم القتال في الحرم إلا ما بدأه المعتدي، وخلاف في قتال الكفار والبغاة إذا لم يبدءوا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7003} ويحرم قطع النبات الرطب مما لا يستنبته الناس، ويستثنى الإذخر، وفي الضمان عن القطع خلاف بين شاة وبقرة بحسب الشجرة، ويحرم صيد البري في الحرم، ويجوز قتل الغراب والحدأة والعقرب والحية والفأرة والكلب العقور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} ويحرم نقل تراب الحرم وأحجاره إلى الحل عند الشافعية، والحنابلة يكرهون ذلك، وفي كراء بيوت مكة خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7010} وفي الحرم أحكام أخرى: اللقطة تُعرّف أبدا عند الشافعية، ويسن الغسل لدخوله، ويؤاخذ الإنسان بهمّ السيئة فيه، ومجاورته مستحبة عند الجمهور، ولا تمتع ولا قران على أهل مكة، ويجوز ذبح الهدي في الحرم، وقد تغلظ الدية فيه عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} وحرم المدينة عند الجمهور له حد ما بين ثور وعير، ويحرم صيدها وشجرها عند الشافعية والمالكية والحنابلة، ولا جزاء فيه عند جمهورهم، والحنفية يرون لها الزينة لا الحرمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018}"
  en: "The sanctuary (haram) in the technical sense is Mecca and its surroundings; the name is also used for Medina and its surroundings. Mecca's sanctuary has boundaries measured in miles from several directions, reckoned from the Black Stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6999} Its sanctity rests on the Qur'an and the Sunna. A pilgrim who enters it for hajj or umra must take ihram at the station; one who passes a station without ihram owes a sacrifice; a traveller from outside who enters for another purpose must, according to the majority, take ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7000} By consensus a non-Muslim may not settle there, though the Hanafis do not bar a protected non-Muslim from entering. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} Fighting in the sanctuary is lawful only in reply to attack, and the jurists differ on fighting unbelievers or rebels who do not begin the fight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7003} It is forbidden to cut moist plants that people do not cultivate, with idhkhir excepted, and the liability differs between a sheep and a cow by the size of the tree; hunting land game in the sanctuary is forbidden, while the crow, the kite, the scorpion, the snake, the rat and the rabid dog may be killed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} Removing the soil or stones of the sanctuary is forbidden by the Shafi'is and disliked by the Hanbalis; renting its houses is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7010} Other rules: a found object is kept and announced forever according to the Shafi'is; it is recommended to wash on entering; a man is held to account for an evil intention there; living there is recommended by the majority; there is no tamattu' or qiran for the people of Mecca; the offering may be sacrificed within the sanctuary; and the blood-money is sometimes raised there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} Medina's sanctuary, for the majority, lies between Thawr and 'Ir; its game and trees are protected for the Shafi'is, Malikis and Hanbalis, though the majority impose no penalty for them, while the Hanafis hold that Medina has no sanctuary but an honour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7016} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7017} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7018}"
