id: concept/action-by-whole-substance
class: concept
kind: scientific
label: { ar: "الفعل بجملة الجوهر عند ابن سينا", en: "Action by the whole substance in the Canon", fr: "L'action par la substance entière dans le Canon", ur: "قانون میں پورے جوہر کے ذریعے عمل", es: "Acción de toda la sustancia en el Canon", tr: "İbn Sina'ya göre öz cümlesindeki fiil", id: "Kata kerja dalam kalimat esensi menurut Ibn Sina" }
summary:
  ar: "الفاعل بجوهره هو الفاعل بصورته النوعية التي هو بها، لا بكيفيته. وهذه الصورة تحدث بعد المزاج وليست حرارة ولا برودة ولا رطوبة ولا يبوسة، بل تشبه اللون والرائحة والنفس. ويسمي ابن سينا هذا الفعل فعلاً بجملة الجواهر، أي بصورة النوع لا بالكيفيات الأربع ولا بالمزاج الناشئ عنها {cite:canon-ibn-sina-print-v1 p.132}."
  en: "What acts by its substance acts by the specific form that makes it what it is, not by its quality. This form arises after the temperament and is neither heat, cold, moisture nor dryness but resembles colour, smell and soul. Ibn Sina calls this action by the whole of the substances, meaning by the form of the species and not by the four qualities or the temperament that comes from them {cite:canon-ibn-sina-print-v1 p.132}."
  fr: "Ce qui agit par sa substance agit par la forme spécifique qui fait qu'il est ce qu'il est, et non par sa qualité. Cette forme apparaît après le tempérament ; elle n'est ni chaleur, ni froid, ni humidité, ni sécheresse, mais ressemble à la couleur, à l'odeur et à l'âme. Ibn Sina appelle cela l'action par la totalité des substances, c'est-à-dire par la forme de l'espèce, et non par les quatre qualités ou par le tempérament qui en résulte {cite:canon-ibn-sina-print-v1 p.132}."
  es: "Lo que actúa por su sustancia, actúa por la forma específica que la define, no por su cualidad. Esta forma surge tras el temperamento y no es ni calor, ni frío, ni humedad, ni sequedad, sino que se asemeja al color, al olor y al alma. Ibn Sina denomina a esta acción «por la totalidad de las sustancias», es decir, por la forma de la especie y no por las cuatro cualidades ni por el temperamento que de ellas emana {cite:canon-ibn-sina-print-v1 p.132}."
  ur: "جو چیز اس کے مادہ سے کام کرتی ہے وہ اس مخصوص شکل سے کام کرتی ہے جو اسے بناتی ہے، اس کے معیار سے نہیں۔ یہ شکل مزاج کے بعد پیدا ہوتی ہے اور نہ گرمی، سردی، نمی اور خشکی نہیں بلکہ رنگ، بو اور روح سے مشابہت رکھتی ہے۔ ابن سینا اس عمل کو تمام مادوں سے کہتے ہیں، یعنی انواع کی شکل سے، نہ کہ ان چار صفات یا مزاج سے جو ان سے آتی ہے۔"
  tr: "Özünde ajan, içinde bulunduğu özgün formdaki etkendir, tavrıyla değil. Bu biçim, sıcaklık, soğuk, nem veya kuruluktan değil, ruh halinden sonra ortaya çıkar; renk, koku ve nefese benzer. İbn Sina bu eyleme madde kümesi olarak adlandırılır; yani tür biçiminde, dört nitelikten veya onlardan kaynaklanan ruh halinden değil {cite:canon-ibn-sina-print-v1 s.132}."
  id: "Agen secara esensi adalah agen dalam bentuk spesifiknya di mana ia berada, bukan berdasarkan sikapnya. Bentuk ini muncul setelah suasana hati, bukan panas, dingin, kelembapan, atau kekeringan, melainkan menyerupai warna, bau, dan napas. Ibn Sina menyebut tindakan ini sebagai tindakan yang disebut himpunan zat, yaitu dalam bentuk tipe, bukan oleh empat kualitas atau suasana hati yang muncul darinya {cite:canon-ibn-sina-print-v1 hlm.132}."
