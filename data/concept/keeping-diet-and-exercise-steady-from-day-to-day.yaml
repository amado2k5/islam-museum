label: { ar: "ثبات الغذاء والرياضة من يوم إلى يوم عند ابن سينا", en: "Keeping diet and exercise steady from day to day in the Canon", ur: "قانون میں غذا اور ورزش کو روز بروز یکساں رکھنا", es: "Mantener una dieta y un ejercicio constantes día tras día en el Canon", fr: "Maintenir une alimentation et une activité physique stables au quotidien dans le Canon" }
summary:
  ar: "يختم ابن سينا الفصل الثالث بقاعدة عملية: إذا وقع المرء في اليوم الأول على حد رياضته وغذوته وعرف المقدار الذي احتمله من الغذاء فلا يغير في اليوم الثاني شيئاً، بل يقدر غذاءه ورياضته على حدهما في اليوم الأول {cite:canon-ibn-sina-print-v1 p.225}."
  en: "Ibn Sina closes chapter 3 with a practical rule: once a person has found in the first day the measure of his exercise and his meal and knows how much food he bore, he changes nothing the next day but sets food and exercise at the same measure {cite:canon-ibn-sina-print-v1 p.225}."
  es: "Ibn Sina cierra el capítulo 3 con una regla práctica: una vez que una persona ha encontrado en el primer día la medida de su ejercicio y su comida y sabe cuánto alimento toleró, no cambia nada al día siguiente, sino que establece la comida y el ejercicio en la misma medida {cite:canon-ibn-sina-print-v1 p.225}."
  fr: "Ibn Sina conclut le chapitre 3 par une règle pratique: une fois qu'une personne a trouvé le premier jour la mesure de son exercice et de son repas et sait quelle quantité de nourriture elle a ingérée, elle ne change rien le lendemain mais fixe la nourriture et l'exercice à la même mesure {cite:canon-ibn-sina-print-v1 p.225}."
