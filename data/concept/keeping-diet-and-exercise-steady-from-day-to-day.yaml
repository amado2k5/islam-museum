summary:
  ar: "يختم ابن سينا الفصل الثالث بقاعدة عملية: إذا وقع المرء في اليوم الأول على حد رياضته وغذوته وعرف المقدار الذي احتمله من الغذاء فلا يغير في اليوم الثاني شيئاً، بل يقدر غذاءه ورياضته على حدهما في اليوم الأول {cite:canon-ibn-sina-print-v1 p.225}."
  en: "Ibn Sina closes chapter 3 with a practical rule: once a person has found in the first day the measure of his exercise and his meal and knows how much food he bore, he changes nothing the next day but sets food and exercise at the same measure {cite:canon-ibn-sina-print-v1 p.225}."
