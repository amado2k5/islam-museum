summary:
  ar: "أما علاج المزاج البارد فإن كان خفيفاً ومن سبب باد خارجي أصلحه حصر النفس فإنه يسخن الرئة بسهولة في الحال وإن احتيج إلى أقوى فمن علاجه أدوية من هذا الجنس وأغذية من هذا الجنس ⁦(أسماؤها ونسخها ومقاديرها مستثناة بحسب القاعدة)⁩، وأما علاج السعال الحار فبالملطفات المعروفة أطلية ومروخات ⁦(وسقيات ولعوقات ونسخ مستثناة بالاسم)⁩، وأما علاج المزاج الرطب والرطوبة في نفس الرئة فبالمجففات اليابسة مخلوطة بالجالية ⁦(تركيب مستثنى)⁩، وأما علاج المزاج اليابس فإن لم يكن حمى فأوفق الأشياء ألبان من هذا الجنس ⁦(سطر موسوم من الألبان)⁩ مع سائر التدبير وإن كان حمى فالمرطبات المشروبة والقيروطيات المبرّدة وماء الشعير وترطيب الغذاء بالأدهان والأحساء المرطبة، وإن كان مزاج مركب فركب التدبير، وإن كان هناك مادة رقيقة أنضجها بما من هذا الجنس وإن كانت غليظة حللتها وجلوتها على الشرط المذكور من أن لا يسخن إلا باعتدال وأن تلين وتقطع وتزلق ⁦(والمقادير والأسماء مستثناة)⁩، والصبيان يكفيهم ما يطبخ بلبن من هذا الجنس ⁦(سطر موسوم)⁩، وإن كان السبب نزلة عولجت النزلة، وأما الكائن عن الأورام والقروح في الرئة والصدر فليرجع إلى باب ذات الرئة وذات الكبد والسل، وقد يتخذ للسعال حبوب تمسك في الفم منها للحار ومنها للبارد ومنها ما يزاد فيه التخدير ⁦(أسماء أجزائها مستثناة وفيها مخدرات بأسمائها مستثناة وسطر موسوم من الدخن والألبان والحبوب المجربة على قول الكتاب)⁩، وأما السعال الكائن في الحميات فقد أفرد له تدبير عند أعراض الحميات {cite:canon-ibn-sina-print-v2 p.329}"
  en: "As for the cold temperament's treatment: if it is light of degree and from an external remote cause, holding the breath mends it, for it warms the lung easily on the spot; and if a stronger treatment is needed, among its treatment are drugs of this kind and foods of this kind (their names, copies and measures excluded per the rule). The hot cough's treatment is by the known lightening things, washes and liniments (and draughts and lozenges and copies excluded by name). The moist temperament's and the moisture's in the lung's own self is by the dry driers mixed with the cleansers (a compound excluded). The dry temperament's: if there is no fever the fittest of things is milks of this kind (a labelled line of the milks) with the rest of the regimen; if there is fever, the moistening drinks, the known cooled cerates, barley-water, always moistening the food with oils and the moistening gruels. If the temperament is compound, compound the regimen; if there is a thin matter, ripen it with means of this kind; if thick, dissolve and scour it on the mentioned condition — that it not be heated but moderately, and that one strive to soften, cut and lubricate (the measures and names excluded). Boys are sufficed by what is cooked in a milk of this kind (a labelled line). If the cause is a catarrh, the catarrh is treated; if needed to stop it a poultice of this kind is used on the head, and a lozenge of this kind is held under the tongue at all times, especially at night, and one gargles with astringents that have no sour or acrid taste. As for what is from the tumours and ulcers in the lung and chest, its treatment is referred back to the chapters of peripneumonia, hepatitis and consumption. Pills may be made for the cough, held in the mouth: among them pills for the hot cough, among them for the cold, and among them pills in which stupefaction is increased (their components' names excluded, and among them stupefying drugs by name, excluded; a labelled line of the fumigations, milks and tried pills on the book's saying). As for the cough existing in the fevers, a regimen was singled out for it at the fevers' symptoms {cite:canon-ibn-sina-print-v2 p.329}"
  ur: "سرد مزاج کا علاج: اگر ہلکا ہو اور بیرونی بعید سبب سے ہو تو سانس روکنا اسے درست کر دیتا ہے کیونکہ وہ فوراً پھیپھڑے کو گرم کرتا ہے؛ اور اگر مضبوط تر علاج درکار ہو تو اس کے علاج میں اسی جنس کی ادویہ اور اسی جنس کی خوراکیں ہیں ⁦(نام نسخے مقداریں اصول کے مطابق مستثنیٰ)⁩؛ گرم کھانسی کا علاج معروف ملطف چیزوں سے دھلائوں اور مرہموں میں ⁦(اور پلانے والی لعوق اور نسخے نام کے ساتھ مستثنیٰ)⁩؛ تر مزاج اور پھیپھڑے کے اندر کی رطوبت کا علاج خشک خشک کرنے والی چیزوں سے صاف کرنے والوں کے ملا کر ⁦(ترکیب مستثنیٰ)⁩؛ خشک مزاج کا: اگر بخار نہ ہو تو بہترین اسی جنس کے دودھ ہیں ⁦(دودھوں کی موسوم سطر)⁩ باقی تدبیر کے ساتھ؛ اگر بخار ہو تو پینے والے مرطبات ٹھنڈے قیروطی جو اور ترکھ کا پانی خوراک ہمیشہ روغنوں سے مرطب اور مرطب احساء؛ اگر مزاج مرکب ہو تو تدبیر بھی مرکب کرے؛ اگر پتلا مادہ ہو تو اس جنس سے پکائے اگر گاڑھا ہو تو اس شرط پر تحلیل اور صاف کرے کہ صرف اعتدال سے گرم ہو اور نرم کاٹ اور پھسلا کرنے کی کوشش ہو ⁦(مقداریں اور نام مستثنیٰ)⁩؛ بچوں کے لیے اسی جنس کے دودھ میں پکایا ہوا کافی ہے ⁦(موسوم سطر)⁩؛ اگر سبب نزلة ہو تو نزلة کا علاج ہو؛ اور اگر سینے اور پھیپھڑے کی سوجنوں اور قروح سے ہو تو ذات الرئة اور ذات الکبد اور سل کے باب کی طرف رجوع ہو؛ اور کھانسی کے لیے منہ میں رکھی جانے والی گولیاں بنائی جاتی ہیں ان میں گرم کھانسی کی اور سرد کی اور ایسی بھی جن میں تخدیر بڑھایا گیا ہو ⁦(اجزا کے نام مستثنیٰ اور ان میں نام کے ساتھ مخدرات مستثنیٰ اور دھونیوں دودھوں اور آزمائی گولیوں کی موسوم سطریں کتاب کے قول پر)⁩؛ اور بخاروں میں ہونے والی کھانسی کا تدبیر بخاروں کی علامتوں کے مقام پر الگ بیان ہوا {cite:canon-ibn-sina-print-v2 p.329}"
  es: "En cuanto al tratamiento del temperamento frío: si es leve y de una causa externa remota, contener la respiración lo alivia, ya que calienta el pulmón fácilmente en el lugar; y si se necesita un tratamiento más fuerte, entre sus tratamientos están los medicamentos de este tipo y los alimentos de este tipo (sus nombres, copias y medidas excluidos según la regla). El tratamiento de la tos caliente es con los conocidos productos para aliviar la tos, lavados y linimentos (y los brebajes y pastillas y copias excluidos por nombre). El temperamento húmedo y la humedad en el propio pulmón se tratan con los secantes mezclados con los limpiadores (un compuesto excluido). El temperamento seco: si no hay fiebre lo más adecuado son las leches de este tipo (una línea etiquetada de las leches) con el resto del régimen; si hay fiebre, las bebidas humectantes, los conocidos ceratos fríos, agua de cebada, humedeciendo siempre los alimentos con aceites y las papillas humectantes. Si el temperamento es compuesto, compón el régimen; Si la materia es líquida, se debe madurar con este tipo de medios; si es espesa, se debe disolver y frotar con la condición mencionada: que no se caliente sino moderadamente, y que se procure ablandarla, cortarla y lubricarla (se excluyen las medidas y los nombres). A los niños les basta con lo que se cocina en una leche de este tipo (una línea etiquetada). Si la causa es un catarro, se trata el catarro; si es necesario detenerlo, se aplica una cataplasma de este tipo en la cabeza, y se mantiene una pastilla de este tipo debajo de la lengua en todo momento, especialmente por la noche, y se hacen gárgaras con astringentes que no tengan sabor agrio ni picante. En cuanto a lo que proviene de los tumores y úlceras en el pulmón y el pecho, su tratamiento se remite a los capítulos de perineumonía, hepatitis y tisis. Se pueden elaborar pastillas para la tos, que se mantienen en la boca: entre ellas, pastillas para la tos caliente, entre ellas, para el resfriado, y entre ellas, pastillas que aumentan el efecto estupefaciente (se omiten los nombres de sus componentes, y entre ellas, los fármacos estupefacientes por su nombre; una lista etiquetada de fumigaciones, leches y pastillas probadas en el libro). En cuanto a la tos presente en las fiebres, se estableció un régimen específico para ella según los síntomas de las fiebres {cite:canon-ibn-sina-print-v2 p.329}"
  fr: "Concernant le traitement du tempérament froid: s’il est léger et d’origine externe, retenir sa respiration le soulage, car cela réchauffe facilement les poumons sur place; si un traitement plus fort est nécessaire, on utilise certains médicaments et aliments (leurs noms, copies et doses sont exclus par la règle). Le traitement de la toux chaude repose sur les remèdes éclaircissants, les lotions et les liniments connus (les potions, pastilles et copies sont exclues par leur nom). Le traitement du tempérament humide et de l’humidité pulmonaire naturelle consiste à utiliser des asséchants mélangés à des nettoyants (un composé est exclu). En cas de tempérament sec: s’il n’y a pas de fièvre, le meilleur remède est un lait de ce type (une gamme de laits étiquetée) associé au reste du traitement; s’il y a fièvre, on utilise des boissons hydratantes, les cérates rafraîchissants connus, l’eau d’orge, en hydratant toujours les aliments avec des huiles et des bouillies hydratantes. Si le tempérament est complexe, adapter le régime alimentaire; si la substance est liquide, la faire mûrir avec ce type de préparation; si elle est épaisse, la dissoudre et la nettoyer à la condition mentionnée: ne la chauffer que modérément et s’efforcer de l’adoucir, de la couper et de la lubrifier (les quantités et les noms sont omis). Les garçons se contentent de ce qui est cuit dans un lait de ce type (une gamme étiquetée). Si la cause est un catarrhe, traiter le catarrhe; si nécessaire, pour l’arrêter, appliquer un cataplasme de ce type sur la tête et garder une pastille de ce type sous la langue en permanence, surtout la nuit, en se gargariser avec des astringents sans goût acide ni âcre. Quant aux affections dues aux tumeurs et aux ulcères du poumon et de la poitrine, leur traitement est renvoyé aux chapitres consacrés à la péripneumonie, à l’hépatite et à la tuberculose. On pouvait préparer des pilules contre la toux, à garder dans la bouche: des pilules contre la toux chaude, d’autres contre le rhume, et d’autres encore qui accentuaient la stupéfaction (leurs composants étaient exclus, de même que les stupéfiants nommément cités; une liste des fumigations, laits et pilules éprouvées était fournie dans le livre). Quant à la toux survenant lors des épisodes fébriles, un traitement spécifique était prévu en fonction des symptômes de la fièvre {cite:canon-ibn-sina-print-v2 p.329}"
  tr: "Soğuk ruh hali tedavisi ise hafif ve dışsal bir nedenden kaynaklanıyorsa, akciğerleri hemen kolayca ısıttığı için nefesi kısıtlayan bir durum olarak değerlendirilebilir. Daha güçlü bir ruh hali gerekirse, tedavi bu tür ilaçları ve bu tür yiyecekleri içerir (isimleri, versiyonları ve miktarları kurala göre hariç tutulur). Sıcak öksürüğün tedavisinde ise, 'Atli' ve 'Markha' adı verilen iyi bilinen yatıştırıcı ilaçlarla yapılır (sulanma, tükürük ve isim dışı kopyalar). Nemli ruh hali ve akciğerlerdeki nemi tedavi etmek ise, kuru kuru yiyecekler ile 'jali' (istisna) karıştırılır. Kuru ruh halinin tedavisi için ise, Ateşi yoktu, bu yüzden en iyi şeyler bu tür süt ürünleridir (sütle işaretlenmiş bir çizgi) ve diğer tüm önlemlerdir. Ateş varsa, içilebilir ikramlar, soğutulmuş karuti, arpa suyu ve yağlar ile nemlendirici yiyecekler kullanılır. Eğer bileşik bir mizaçsa, yöntem kullanılır. Bu tür bir madde ile pişirilen hassas bir madde varsa ve yoğunsa, belirtilen koşula göre izin verilir ve rafine edilir; örneğin sadece orta derecede ısıtma, yumuşatma, kesme ve kaydırma (malzemeler ve isimler hariçtir). Çocuklar bu sütle pişirilen şeyden memnun olurlar Cinsiyet (etiketli bir çizgi). Eğer neden soğuk algınlığıysa, soğuk algınlığı tedavi edilir. Akciğer ve göğüste tümör ve ülser yaşayanlar ise zatürre, karaciğer hastalığı ve tüberküloz kategorilerine girer. Öksürük için öksürük hapları ağızda tutulur, bazıları sıcak yiyecekler, bazıları soğuk için ve bazıları ek anestezi için alınır (parça isimleri muaf tutulur, bazı narkotikler ise isimleri muaf tutulur ve kitaba göre darı, süt ürünleri ve denenmiş tahıllarla işaretlenmiş bir çizgi). Ateşte ortaya çıkan öksürük ise özellikle ateş belirtileri için yönetilir {cite:canon-ibn-sina-print-v2 s.329}"
  id: "Untuk mengobati suasana hati dingin, jika ringan dan disebabkan oleh penyebab eksternal, dapat dianggap membatasi napas, karena mudah memanaskan paru-paru secara langsung. Jika diperlukan dosis yang lebih kuat, pengobatan termasuk obat jenis ini dan makanan sejenis (nama, versi, dan jumlahnya dikecualikan sesuai aturan). Untuk pengobatan batuk panas, obat penenangkan terkenal disebut 'Atli' dan 'Markha' (penyiraman, air liur, dan salinan yang tidak disebutkan namanya). Untuk mengobati suasana hati lembap dan kelembapan di paru-paru, dilakukan dengan makanan kering yang dicampur dengan 'jali' (pengecualian). Untuk mengatasi suasana hati kering, Dia tidak demam, jadi yang terbaik adalah produk susu jenis ini (garis yang ditandai susu) dengan semua ukuran lainnya. Jika demam, maka minuman yang bisa diminum, qaruti dingin, air jelai, dan makanan pelembap dengan minyak dan minyak pelembap. Jika temperamen majemuk, maka metode yang digunakan. Jika ada zat halus yang dimasak dengan jenis ini, dan jika kental, dia membuatnya diperbolehkan dan dimurnikan sesuai kondisi tersebut, seperti dipanaskan hanya sedang, melunakkan, memotong, dan memotong (bahan dan nama tidak termasuk). Anak-anak puas dengan apa yang dimasak dengan susu dari ini Jenis kelamin (baris berlabel). Jika penyebabnya flu, flu tersebut diobati. Adapun mereka yang menderita tumor dan borok di paru-paru dan dada, mereka merujuk pada kategori pneumonia, penyakit hati, dan tuberkulosis. Untuk batuk, obat batuk dapat diminum untuk menahan di dalam mulut, sebagian untuk makanan panas, sebagian untuk pilek, dan beberapa untuk anestesi tambahan (nama bagian-bagiannya dikecualikan, dan beberapa narkotika dengan nama mereka dikecualikan, serta garis yang ditandai dengan millet, susu, dan biji-bijian yang sudah dicoba menurut buku). Adapun batuk yang terjadi pada demam, obat ini secara khusus dikelola untuk gejala demam {cite:canon-ibn-sina-print-v2 hlm.329}"
