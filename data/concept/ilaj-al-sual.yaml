  en: "The cough's treatment"
  ur: "کھانسی کا علاج"
summary:
  ar: "أما علاج المزاج البارد فإن كان خفيفاً ومن سبب باد خارجي أصلحه حصر النفس فإنه يسخن الرئة بسهولة في الحال وإن احتيج إلى أقوى فمن علاجه أدوية من هذا الجنس وأغذية من هذا الجنس ⁦(أسماؤها ونسخها ومقاديرها مستثناة بحسب القاعدة)⁩، وأما علاج السعال الحار فبالملطفات المعروفة أطلية ومروخات ⁦(وسقيات ولعوقات ونسخ مستثناة بالاسم)⁩، وأما علاج المزاج الرطب والرطوبة في نفس الرئة فبالمجففات اليابسة مخلوطة بالجالية ⁦(تركيب مستثنى)⁩، وأما علاج المزاج اليابس فإن لم يكن حمى فأوفق الأشياء ألبان من هذا الجنس ⁦(سطر موسوم من الألبان)⁩ مع سائر التدبير وإن كان حمى فالمرطبات المشروبة والقيروطيات المبرّدة وماء الشعير وترطيب الغذاء بالأدهان والأحساء المرطبة، وإن كان مزاج مركب فركب التدبير، وإن كان هناك مادة رقيقة أنضجها بما من هذا الجنس وإن كانت غليظة حللتها وجلوتها على الشرط المذكور من أن لا يسخن إلا باعتدال وأن تلين وتقطع وتزلق ⁦(والمقادير والأسماء مستثناة)⁩، والصبيان يكفيهم ما يطبخ بلبن من هذا الجنس ⁦(سطر موسوم)⁩، وإن كان السبب نزلة عولجت النزلة، وأما الكائن عن الأورام والقروح في الرئة والصدر فليرجع إلى باب ذات الرئة وذات الكبد والسل، وقد يتخذ للسعال حبوب تمسك في الفم منها للحار ومنها للبارد ومنها ما يزاد فيه التخدير ⁦(أسماء أجزائها مستثناة وفيها مخدرات بأسمائها مستثناة وسطر موسوم من الدخن والألبان والحبوب المجربة على قول الكتاب)⁩، وأما السعال الكائن في الحميات فقد أفرد له تدبير عند أعراض الحميات {cite:canon-ibn-sina-print-v2 p.329}"
  en: "As for the cold temperament's treatment: if it is light of degree and from an external remote cause, holding the breath mends it, for it warms the lung easily on the spot; and if a stronger treatment is needed, among its treatment are drugs of this kind and foods of this kind (their names, copies and measures excluded per the rule). The hot cough's treatment is by the known lightening things, washes and liniments (and draughts and lozenges and copies excluded by name). The moist temperament's and the moisture's in the lung's own self is by the dry driers mixed with the cleansers (a compound excluded). The dry temperament's: if there is no fever the fittest of things is milks of this kind (a labelled line of the milks) with the rest of the regimen; if there is fever, the moistening drinks, the known cooled cerates, barley-water, always moistening the food with oils and the moistening gruels. If the temperament is compound, compound the regimen; if there is a thin matter, ripen it with means of this kind; if thick, dissolve and scour it on the mentioned condition — that it not be heated but moderately, and that one strive to soften, cut and lubricate (the measures and names excluded). Boys are sufficed by what is cooked in a milk of this kind (a labelled line). If the cause is a catarrh, the catarrh is treated; if needed to stop it a poultice of this kind is used on the head, and a lozenge of this kind is held under the tongue at all times, especially at night, and one gargles with astringents that have no sour or acrid taste. As for what is from the tumours and ulcers in the lung and chest, its treatment is referred back to the chapters of peripneumonia, hepatitis and consumption. Pills may be made for the cough, held in the mouth: among them pills for the hot cough, among them for the cold, and among them pills in which stupefaction is increased (their components' names excluded, and among them stupefying drugs by name, excluded; a labelled line of the fumigations, milks and tried pills on the book's saying). As for the cough existing in the fevers, a regimen was singled out for it at the fevers' symptoms {cite:canon-ibn-sina-print-v2 p.329}"
  ur: "سرد مزاج کا علاج: اگر ہلکا ہو اور بیرونی بعید سبب سے ہو تو سانس روکنا اسے درست کر دیتا ہے کیونکہ وہ فوراً پھیپھڑے کو گرم کرتا ہے؛ اور اگر مضبوط تر علاج درکار ہو تو اس کے علاج میں اسی جنس کی ادویہ اور اسی جنس کی خوراکیں ہیں ⁦(نام نسخے مقداریں اصول کے مطابق مستثنیٰ)⁩؛ گرم کھانسی کا علاج معروف ملطف چیزوں سے دھلائوں اور مرہموں میں ⁦(اور پلانے والی لعوق اور نسخے نام کے ساتھ مستثنیٰ)⁩؛ تر مزاج اور پھیپھڑے کے اندر کی رطوبت کا علاج خشک خشک کرنے والی چیزوں سے صاف کرنے والوں کے ملا کر ⁦(ترکیب مستثنیٰ)⁩؛ خشک مزاج کا: اگر بخار نہ ہو تو بہترین اسی جنس کے دودھ ہیں ⁦(دودھوں کی موسوم سطر)⁩ باقی تدبیر کے ساتھ؛ اگر بخار ہو تو پینے والے مرطبات ٹھنڈے قیروطی جو اور ترکھ کا پانی خوراک ہمیشہ روغنوں سے مرطب اور مرطب احساء؛ اگر مزاج مرکب ہو تو تدبیر بھی مرکب کرے؛ اگر پتلا مادہ ہو تو اس جنس سے پکائے اگر گاڑھا ہو تو اس شرط پر تحلیل اور صاف کرے کہ صرف اعتدال سے گرم ہو اور نرم کاٹ اور پھسلا کرنے کی کوشش ہو ⁦(مقداریں اور نام مستثنیٰ)⁩؛ بچوں کے لیے اسی جنس کے دودھ میں پکایا ہوا کافی ہے ⁦(موسوم سطر)⁩؛ اگر سبب نزلة ہو تو نزلة کا علاج ہو؛ اور اگر سینے اور پھیپھڑے کی سوجنوں اور قروح سے ہو تو ذات الرئة اور ذات الکبد اور سل کے باب کی طرف رجوع ہو؛ اور کھانسی کے لیے منہ میں رکھی جانے والی گولیاں بنائی جاتی ہیں ان میں گرم کھانسی کی اور سرد کی اور ایسی بھی جن میں تخدیر بڑھایا گیا ہو ⁦(اجزا کے نام مستثنیٰ اور ان میں نام کے ساتھ مخدرات مستثنیٰ اور دھونیوں دودھوں اور آزمائی گولیوں کی موسوم سطریں کتاب کے قول پر)⁩؛ اور بخاروں میں ہونے والی کھانسی کا تدبیر بخاروں کی علامتوں کے مقام پر الگ بیان ہوا {cite:canon-ibn-sina-print-v2 p.329}"
