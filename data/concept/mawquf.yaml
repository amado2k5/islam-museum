label: { ar: "المَوْقُوف ⁦(العقد الموقوف على إجازة أو شرط)⁩", en: "The suspended contract (mawquf): valid in principle but held until a condition or consent", ur: "موقوف ⁦(معلق عقد جو اجازت یا شرط پر موقوف ہو)⁩", es: "El contrato suspendido (mawquf): válido en principio pero mantenido hasta que se cumpla una condición o se dé el consentimiento.", fr: "Le contrat suspendu (mawquf): valable en principe mais maintenu jusqu'à la réalisation d'une condition ou l'obtention d'un consentement.", tr: "Askıya alınmış (izinli veya şartlı olarak askıya alınmış bir sözleşme)", id: "Diskors (kontrak yang ditangguhkan karena cuti atau syarat)" }
summary:
  ar: "الموقوف في اصطلاح الفقهاء عقد أو تصرف مشروع في أصله، يفيد الملك على سبيل التوقف، ولا يتم إلا بإجازة من له حق الإجازة، كبيع الفضولي والصبي والعبد المحجورين، ويحدث في العبادات وفي العقود. وقسمه الحنفية إلى موقوف قابل للصحة وموقوف فاسد، وضبط الشافعية أنواعه الستة، ومن أمثلته تصرف الغاصب وبيع مال المورث ظانا حياته وتصرف المريض بالمحاباة."
  en: "In the law, a mawquf is a transaction valid in its origin that gives ownership only in suspension, completed only by the consent of the person who may consent, as the sale of an unauthorised agent, of a minor or of a slave under restraint; it occurs in acts of worship and in contracts. The Hanafis divide suspended transactions into those capable of validity and those invalid; the Shafi'is list six kinds, among them the sale of a dead man's property in the belief he is alive, the seller's act that the buyer's permission will ratify, and the favour of a sick man beyond a third."
  ur: "موقوف فقہاء کے نزدیک وہ تصرف ہے جو اصلاً جائز ہو مگر اجازت یا شرط پوری ہونے تک معلق رہے، جیسے فضولی یا محجور کی بیع۔ حنفیہ اسے قابل صحت اور فاسد میں تقسیم کرتے ہیں، اور شافعیہ کے نزدیک اس کی چھ قسمیں ہیں۔"
  es: "En derecho, un mawquf es una transacción válida en su origen que otorga la propiedad solo en suspenso, y que se completa únicamente con el consentimiento de la persona que puede consentir, como la venta de un agente no autorizado, de un menor o de un esclavo bajo restricción; se da en actos de culto y en contratos. Los hanafíes dividen las transacciones suspendidas en aquellas que pueden ser válidas y aquellas que no lo son; los shafiíes enumeran seis tipos, entre ellos la venta de la propiedad de un difunto creyendo que está vivo, el acto del vendedor que el permiso del comprador ratificará y el favor de un enfermo que excede un tercio."
  fr: "En droit, un mawquf est une transaction valable à l'origine, mais dont la propriété n'est que provisoire et ne peut être pleinement réalisée qu'avec le consentement de la personne habilitée, comme par exemple la vente par un mandataire non autorisé, par un mineur ou par un esclave sous contrainte. Il se rencontre dans les actes de culte et les contrats. Les hanafites distinguent les transactions provisoires valides de celles invalides; les chaféites en recensent six, parmi lesquelles la vente des biens d'un défunt en croyant qu'il est vivant, l'acte du vendeur dont la ratification dépendra de l'accord de l'acheteur, et la faveur accordée à un malade au-delà d'un tiers."
  tr: "Fıkıh terminolojisinde mawquf, kökeni bakımından bir sözleşme veya meşru bir düzenlemedir; mülkiyeti bir ayrıcalık biçimi olarak gösterir ve yalnızca yetki hakkı olan kişinin izniyle, örneğin kullanılabilir bir kişi, bir çocuk veya yasal olarak engelli bir kölenin satılmasıyla tamamlanır. Bu durum ibadet ve sözleşmelerde gerçekleşir. Hanefi okulu bunu geçerli ve geçersiz bir makf olarak ayırmıştır. Şafi'ler ise altı türünü tanımlar. Örnekler arasında gaspçının eğilimi, ölen kişinin mal varlığının hayatına göre satılması ve hastaya kayırmacılık yoluyla davranılması yer alır."
  id: "Dalam terminologi hukum, mawquf adalah kontrak atau disposisi yang sah asalnya, yang menunjukkan kepemilikan sebagai bentuk konsesi, dan hanya diselesaikan dengan izin dari orang yang berhak mendapatkan otorisasi, seperti menjual orang yang dapat dibuang, anak, atau budak yang secara hukum tidak mampu. Mawquf terjadi dalam tindakan ibadah dan kontrak. Aliran Hanafi membaginya menjadi maqf yang sah dan tidak sah. Shafi'i mendefinisikan enam jenisnya. Contohnya termasuk disposisi pengguling, penjualan harta almarhum dengan mengingat hidupnya, dan perlakuan terhadap orang sakit dengan pilih kasih."
