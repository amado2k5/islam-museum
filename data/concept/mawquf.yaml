label: { ar: "المَوْقُوف (العقد الموقوف على إجازة أو شرط)", en: "The suspended contract (mawquf): valid in principle but held until a condition or consent", ur: "موقوف (معلق عقد جو اجازت یا شرط پر موقوف ہو)" }
summary:
  ar: "الموقوف في اصطلاح الفقهاء عقد أو تصرف مشروع في أصله، يفيد الملك على سبيل التوقف، ولا يتم إلا بإجازة من له حق الإجازة، كبيع الفضولي والصبي والعبد المحجورين، ويحدث في العبادات وفي العقود. وقسمه الحنفية إلى موقوف قابل للصحة وموقوف فاسد، وضبط الشافعية أنواعه الستة، ومن أمثلته تصرف الغاصب وبيع مال المورث ظانا حياته وتصرف المريض بالمحاباة."
  en: "In the law, a mawquf is a transaction valid in its origin that gives ownership only in suspension, completed only by the consent of the person who may consent, as the sale of an unauthorised agent, of a minor or of a slave under restraint; it occurs in acts of worship and in contracts. The Hanafis divide suspended transactions into those capable of validity and those invalid; the Shafi'is list six kinds, among them the sale of a dead man's property in the belief he is alive, the seller's act that the buyer's permission will ratify, and the favour of a sick man beyond a third."
  ur: "موقوف فقہاء کے نزدیک وہ تصرف ہے جو اصلاً جائز ہو مگر اجازت یا شرط پوری ہونے تک معلق رہے، جیسے فضولی یا محجور کی بیع۔ حنفیہ اسے قابل صحت اور فاسد میں تقسیم کرتے ہیں، اور شافعیہ کے نزدیک اس کی چھ قسمیں ہیں۔"
