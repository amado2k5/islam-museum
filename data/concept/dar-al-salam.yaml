summary:
  ar: "دار السلام اسم من أسماء الجنة، قال تعالى: «لهم دار السلام عند ربهم»، وقال: «والله يدعو إلى دار السلام ويهدي من يشاء إلى صراط مستقيم»، سمّيت دار السلام لأن السلام هو الله، فهي دار الله التي أعدّها لأوليائه."
  en: "Dar al-Salam — the Abode of Peace — is one of the names of Paradise. God says «for them is the abode of peace with their Lord» and «God invites to the abode of peace and guides whom He wills to a straight path». It is called the abode of peace because al-Salam is God Himself: it is His house prepared for His friends."
  ur: "دار السلام جنت کا ایک نام ہے۔ اللہ فرماتا ہے «ان کے لیے اپنے رب کے پاس دار السلام ہے» اور «اللہ دار السلام کی طرف بلاتا ہے اور جسے چاہے سیدھی راہ دکھاتا ہے»۔ اسے دار السلام اس لیے کہا جاتا ہے کہ السلام خود اللہ کا نام ہے۔"
