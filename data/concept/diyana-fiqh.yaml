id: concept/diyana-fiqh
class: concept
kind: legal
label:
  ar: "الديانة ⁦(في الفقه)⁩"
  en: "Diyana (the rule that a person's own intention is judged before God, not by the court)"
  ur: "دیانت ⁦(فقہی اصطلاح)⁩"
  es: "Diyana (la regla de que la intención de una persona es juzgada ante Dios, no ante un tribunal)."
  fr: "Diyana (la règle selon laquelle l'intention d'une personne est jugée devant Dieu et non par un tribunal)"
summary:
  ar: "الديانة في الاصطلاح الفقهي قبول دعوى الحالف أو المطلق ونحوهما بنيته إذا كان لفظه صريحا واحتمل ما ادعاه احتمالا بعيدا، ولا يقبل ذلك قضاء إذا خالف ظاهر اللفظ، ويترك الأمر فيما بينه وبين الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8307} وتتفاوت المذاهب في ضبط ما يُدان فيه وما يقبل ظاهرا، ومن ذلك الطلاق واليمين والإيلاء والظهار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8308}"
  en: "As a term, diyana means accepting a swearer's or divorcer's stated intention, when the words are clear and the claimed meaning is a remote possibility, though a judge does not accept it against the apparent meaning of the words; the matter is left between the person and God. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8307} The schools differ on which claims are accepted in diyana and which are accepted in court too; the same applies to oaths, the vow of abstinence, the zihar formula and similar cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8308}"
  ur: "دیانت فقہی اصطلاح میں اس بات کو کہتے ہیں کہ قسم کھانے یا طلاق دینے والے کی وہ نیت قبول کی جائے جس کا لفظ صریح ہو اور جس معنی کا وہ دعوی کرتا ہے وہ بعید احتمال کے طور پر لفظ میں ہو۔ عدالت ظاہر کے خلاف ایسی بات قبول نہیں کرتی، اور معاملہ اللہ کے سپرد رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8306}"
  es: "El término diyana significa aceptar la intención declarada de quien jura o se divorcia, cuando las palabras son claras y el significado alegado es una posibilidad remota, aunque un juez no lo acepte en contra del significado aparente de las palabras; el asunto queda entre la persona y Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8307} Las escuelas difieren en cuanto a qué afirmaciones se aceptan en diyana y cuáles se aceptan también en los tribunales; lo mismo se aplica a los juramentos, el voto de abstinencia, la fórmula zihar y casos similares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8308}"
  fr: "Le terme diyana désigne l'acceptation de l'intention déclarée d'une personne qui jure ou divorce, lorsque les paroles sont claires et que la signification invoquée est peu probable, même si un juge ne l'accepte pas au regard du sens apparent des mots; la question reste alors entre la personne et Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8307} Les écoles divergent quant aux déclarations recevables en diyana et à celles qui le sont également devant les tribunaux; il en va de même pour les serments, le vœu d'abstinence, la formule du zihar et les cas similaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8308}"
