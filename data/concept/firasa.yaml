label:
  ar: "الفراسة"
  en: "Believer's insight (firasa)"
  ur: "فراست"
summary:
  ar: "الفراسة في درس الشيخ عمر عبد الكافي نوع من الإلهام يكون للمؤمن الذي صفّى قلبه من الحقد والحسد والغل، وهي دون مرتبة النبوة، ويسميها بعض الغرب «الحاسة السادسة» {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. ويرى أن الصحابة بلغوها لصفاء أرواحهم، وأن كثرة المعاصي تحجبها {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
  en: "In Sheikh Omar Abdelkafy's lesson, firasa is a kind of inspiration given to the believer who has cleansed his heart of rancor, envy and spite; it ranks below prophethood, and some in the West call it the «sixth sense» {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. He holds that the Companions reached it through the purity of their souls, and that many sins block it {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
  ur: "شیخ عمر عبد الکافی کے درس میں فراست الہام کی ایک قسم ہے جو اس مومن کو ملتی ہے جس نے اپنے دل کو کینے، حسد اور بغض سے پاک کر لیا ہو؛ یہ نبوت کے درجے سے کم ہے، اور مغرب میں بعض لوگ اسے «چھٹی حس» کہتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. ان کا خیال ہے کہ صحابہ اپنی روحوں کی پاکیزگی کی وجہ سے اس تک پہنچے، اور بہت سے گناہ اسے روک دیتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
