label:
  ar: "الفراسة"
  en: "Believer's insight (firasa)"
  ur: "فراست"
  es: "La visión del creyente (firasa)"
  fr: "Vision du croyant (firasa)"
  tr: "İçgörü"
  id: "Wawasan"
summary:
  ar: "الفراسة في درس الشيخ عمر عبد الكافي نوع من الإلهام يكون للمؤمن الذي صفّى قلبه من الحقد والحسد والغل، وهي دون مرتبة النبوة، ويسميها بعض الغرب «الحاسة السادسة» {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. ويرى أن الصحابة بلغوها لصفاء أرواحهم، وأن كثرة المعاصي تحجبها {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
  en: "In Sheikh Omar Abdelkafy's lesson, firasa is a kind of inspiration given to the believer who has cleansed his heart of rancor, envy and spite; it ranks below prophethood, and some in the West call it the «sixth sense» {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. He holds that the Companions reached it through the purity of their souls, and that many sins block it {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
  ur: "شیخ عمر عبد الکافی کے درس میں فراست الہام کی ایک قسم ہے جو اس مومن کو ملتی ہے جس نے اپنے دل کو کینے، حسد اور بغض سے پاک کر لیا ہو؛ یہ نبوت کے درجے سے کم ہے، اور مغرب میں بعض لوگ اسے «چھٹی حس» کہتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. ان کا خیال ہے کہ صحابہ اپنی روحوں کی پاکیزگی کی وجہ سے اس تک پہنچے، اور بہت سے گناہ اسے روک دیتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
  es: "En la lección del Sheikh Omar Abdelkafy, la firasa es una especie de inspiración que se le da al creyente que ha limpiado su corazón de rencor, envidia y malicia; se sitúa por debajo de la profecía, y algunos en Occidente la llaman el «sexto sentido» {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. Él sostiene que los Compañeros la alcanzaron a través de la pureza de sus almas, y que muchos pecados la bloquean {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
  fr: "Dans l'enseignement du cheikh Omar Abdelkafy, la firasa est une forme d'inspiration accordée au croyant qui a purifié son cœur de toute rancœur, envie et malice; elle se situe en deçà de la prophétie, et certains en Occident la désignent comme le « sixième sens » {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. Il soutient que les Compagnons y sont parvenus grâce à la pureté de leurs âmes, et que de nombreux péchés en font obstacle {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
  tr: "Şeyh Ömer Abdülkafi'nin dersindeki içgörüş, kalbi nefret, kıskançlık ve kötülükten arınmış bir mümin için bir tür ilham kaynağıdır. Peygamberlik seviyesinin altındadır ve Batı'da bazıları buna 'altıncı his' der {cite:assabile-omar-abdelkafy tafsir-al-quran-al-kareem/ep08 00:08:00}. Sahabelerin ruhlarının saflığı sayesinde buna ulaştıklarına ve günahların bolluğunun bunu gizlediğine inanır {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-kareem/ep08 00:30:30}."
  id: "Wawasan dalam pelajaran Sheikh Omar Abd al-Kafi adalah semacam inspirasi bagi seorang mukmin yang hatinya telah disucikan dari kebencian, iri hati, dan kebencian. Ia berada di bawah tingkat kenabian, dan beberapa orang di Barat menyebutnya 'indra keenam' {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:08:00}. Dia percaya bahwa para Sahabat mencapainya karena kemurnian jiwa mereka, dan kelimpahan dosa menutupinya {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:07:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:30:30}."
