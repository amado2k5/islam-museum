issue:
  ar: "هل يُقضى على من نكل عن اليمين، وماذا يعني نكوله؟"
  en: "Does refusing an oath decide the case against the refuser, and what does refusal mean?"
  ur: "کیا قسم سے انکار پر فیصلہ منکر کے خلاف ہو گا، اور انکار کا کیا مطلب ہے؟"
