label:
  ar: "نُكُول"
  en: "Nukul (refusal to swear)"
  ur: "نکول (قسم سے انکار)"
summary:
  ar: "النكول امتناع من وجبت عليه اليمين عن أدائها، وفيه أقوال في حقيقته: بذل، أو إقرار فيه شبهة، أو كالبينة، وفي القضاء به خلاف بين الحنفية والمالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16190}"
  en: "Nukul is refusing to swear an oath that has been required. The jurists differ over its nature (a surrender, an admission with doubt, or like producing evidence) and over whether a case may be decided by it, with the Hanafi, Maliki, Shafi'i and Hanbali accounts differing by kind of claim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16190}"
  ur: "نکول قسم سے انکار ہے جو واجب ہو۔ فقہاء اس کی حقیقت (بذل، شبہ والا اقرار، یا گواہی کی مانند) اور اس پر فیصلے میں مختلف ہیں، اور دعوے کی قسم کے مطابق حنفیہ، مالکیہ، شافعیہ اور حنابلہ کے اقوال الگ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16188} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16190}"
