tags: [islamic-economy-browser, islamic-economy-money]
label: { ar: "النَّاضّ", en: "Liquid cash from goods (nadd)", ur: "ناض ⁦(نقد میں تبدیل شدہ مال)⁩", es: "Efectivo líquido procedente de mercancías (nadd)", fr: "Encaissements liquides provenant des marchandises (nadd)" }
summary:
  ar: "الناضّ في اللغة ما تحول من المتاع إلى دراهم أو دنانير. وعند المالكية يشترط في زكاة عروض التجارة للمدير أن ينض له شيء من المال ولو درهم، فإن لم ينض شيء فلا زكاة. وعند الشافعية يضم ربح التجارة إلى الأصل إن لم ينض، وإذا نض الكل من جنس رأس المال أفرد الربح بحوله. ويؤثر النضوض في فسخ الشركة وفسخ المضاربة وإتمامها بعد موت أحد المتعاقدين، وفي تعدد المضاربة عند المالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15433} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15435}"
  en: "In the lexicon, nadd is goods turned into dirhams or dinars. The Malikis require, for zakat on trade goods held by a dealer, that some money has come in, even a single dirham; without that, no zakat. The Shafi'is add the profit to the capital unless it has been realised, and once the whole is realised in capital's kind the profit has its own year. Realisation affects the dissolution of a partnership, the dissolution of a profit-sharing partnership (mudaraba), its continuation after a party's death, and the making of a second mudaraba, according to the Malikis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15433} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15435}"
  ur: "ناض وہ مال ہے جو سامان سے بدل کر درہم یا دینار بن جائے۔ مالکیہ کے نزدیک تجارتی سامان کی زکوٰۃ کے لیے کچھ نقد آنا شرط ہے۔ شافعیہ کے نزدیک منافع اصل مال میں شامل ہوتا ہے جب تک نقد نہ ہو جائے۔ شراکت اور مضاربت کے فسخ اور تعدد پر بھی اس کا اثر ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15433} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15435}"
  es: "En el léxico, nadd se refiere a bienes convertidos en dirhams o dinares. Los malikíes exigen, para el zakat sobre los bienes comerciales en poder de un comerciante, que haya ingresado algún dinero, aunque sea un solo dirham; sin eso, no hay zakat. Los shafiíes suman la ganancia al capital, a menos que ya se haya realizado, y una vez que la totalidad se realiza en especie, la ganancia tiene su propio año. La realización afecta la disolución de una sociedad, la disolución de una sociedad de reparto de beneficios (mudaraba), su continuación tras el fallecimiento de una de las partes y la constitución de una segunda mudaraba, según los malikíes y los hanbalíes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15428} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15429} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15430} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15431} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15432} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15433} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15434} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 pág. 15435}"
  fr: "Dans le lexique, le terme « nadd » désigne les biens convertis en dirhams ou en dinars. Les Malikites exigent, pour le calcul de la zakat sur les marchandises détenues par un commerçant, qu'un revenu, même d'un seul dirham, ait été perçu; à défaut, la zakat n'est pas due. Les Chafi'ites ajoutent le profit au capital, sauf s'il a été réalisé; une fois le capital intégralement réalisé, le profit est imposé sur une année distincte. La réalisation a des conséquences sur la dissolution d'une société en nom collectif, la dissolution d'une société en participation aux bénéfices (mudaraba), sa continuation après le décès d'un associé et la constitution d'une seconde mudaraba, selon les écoles Malikite et Hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15433} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15434} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.15435}"
