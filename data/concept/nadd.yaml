id: concept/nadd
class: concept
kind: legal
label: { ar: "النَّاضّ", en: "Liquid cash from goods (nadd)", ur: "ناض (نقد میں تبدیل شدہ مال)" }
summary:
  ar: "الناضّ في اللغة ما تحول من المتاع إلى دراهم أو دنانير. وعند المالكية يشترط في زكاة عروض التجارة للمدير أن ينض له شيء من المال ولو درهم، فإن لم ينض شيء فلا زكاة. وعند الشافعية يضم ربح التجارة إلى الأصل إن لم ينض، وإذا نض الكل من جنس رأس المال أفرد الربح بحوله. ويؤثر النضوض في فسخ الشركة وفسخ المضاربة وإتمامها بعد موت أحد المتعاقدين، وفي تعدد المضاربة عند المالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15433} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15435}"
  en: "In the lexicon, nadd is goods turned into dirhams or dinars. The Malikis require, for zakat on trade goods held by a dealer, that some money has come in, even a single dirham; without that, no zakat. The Shafi'is add the profit to the capital unless it has been realised, and once the whole is realised in capital's kind the profit has its own year. Realisation affects the dissolution of a partnership, the dissolution of a profit-sharing partnership (mudaraba), its continuation after a party's death, and the making of a second mudaraba, according to the Malikis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15433} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15435}"
  ur: "ناض وہ مال ہے جو سامان سے بدل کر درہم یا دینار بن جائے۔ مالکیہ کے نزدیک تجارتی سامان کی زکوٰۃ کے لیے کچھ نقد آنا شرط ہے۔ شافعیہ کے نزدیک منافع اصل مال میں شامل ہوتا ہے جب تک نقد نہ ہو جائے۔ شراکت اور مضاربت کے فسخ اور تعدد پر بھی اس کا اثر ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15431} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15432} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15433} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15435}"
