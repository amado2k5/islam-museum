id: concept/radkh-fiqh
class: concept
kind: legal
label:
  ar: "الرضخ"
  en: "Radkh (a small gift from the spoils at the imam's discretion, to women, boys and others who help but do not fight)"
  ur: "رضخ (غنیمت سے معمولی حصہ)"
summary:
  ar: "الرضخ في اللغة العطاء القليل، وفي الاصطلاح عطية من الغنيمة يجتهد الإمام في قدرها لمن لم يلزمه القتال ويعمل عملا نافعا فيه، كالنساء والصبيان والذمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} وذهب جمهور الفقهاء إلى أنه حق واجب لمن قام بعمل نافع في القتال، وفي قول للشافعية أنه مستحب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} والدابة غير الفرس لا يسهم لها، ويُرضخ لراكبها بعد سهم الراجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} واختلف الفقهاء في محله، فقال الحنفية والحنابلة وقول الشافعية يُرضخ من أصل الغنيمة، وقال الشافعية في الأظهر من أربعة الأخماس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} وقدره ما دون قيمة السهم عند الجمهور، وهو موكول للإمام عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784}"
  en: "Radkh in the lexicon is a small gift; in the jurists' usage it is a gift from the spoils whose amount the imam judges, given to those who are not bound to fight but do useful work in the war, such as women, boys and a dhimmi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} Most jurists hold it a binding right for one who has done useful work, and a view of the Shafi'is makes it recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} A mount other than a horse has no share, but its rider is given a radkh after the foot-soldier's share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} The jurists differ on where it comes from: the Hanafis and Hanbalis, and one Shafi'i view, take it from the whole booty, and the preferred Shafi'i view takes it from four-fifths. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} Its amount is less than a full share according to the majority, and is left to the imam by the Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784}"
  ur: "رضخ غنیمت سے دیا جانے والا معمولی حصہ ہے جو امام کی صوابدید پر ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782}"
