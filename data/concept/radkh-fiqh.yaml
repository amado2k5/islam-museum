id: concept/radkh-fiqh
class: concept
kind: legal
label:
  ar: "الرضخ"
  en: "Radkh (a small gift from the spoils at the imam's discretion, to women, boys and others who help but do not fight)"
  ur: "رضخ ⁦(غنیمت سے معمولی حصہ)⁩"
  es: "Radkh (un pequeño obsequio del botín, a discreción del imán, para mujeres, niños y otros que ayudan pero no luchan)."
  fr: "Radkh (un petit cadeau prélevé sur le butin, à la discrétion de l'imam, aux femmes, aux garçons et à ceux qui aident mais ne combattent pas)"
  tr: "Teslim"
  id: "Pengajuan"
summary:
  ar: "الرضخ في اللغة العطاء القليل، وفي الاصطلاح عطية من الغنيمة يجتهد الإمام في قدرها لمن لم يلزمه القتال ويعمل عملا نافعا فيه، كالنساء والصبيان والذمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} وذهب جمهور الفقهاء إلى أنه حق واجب لمن قام بعمل نافع في القتال، وفي قول للشافعية أنه مستحب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} والدابة غير الفرس لا يسهم لها، ويُرضخ لراكبها بعد سهم الراجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} واختلف الفقهاء في محله، فقال الحنفية والحنابلة وقول الشافعية يُرضخ من أصل الغنيمة، وقال الشافعية في الأظهر من أربعة الأخماس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} وقدره ما دون قيمة السهم عند الجمهور، وهو موكول للإمام عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784}"
  en: "Radkh in the lexicon is a small gift; in the jurists' usage it is a gift from the spoils whose amount the imam judges, given to those who are not bound to fight but do useful work in the war, such as women, boys and a dhimmi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} Most jurists hold it a binding right for one who has done useful work, and a view of the Shafi'is makes it recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} A mount other than a horse has no share, but its rider is given a radkh after the foot-soldier's share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} The jurists differ on where it comes from: the Hanafis and Hanbalis, and one Shafi'i view, take it from the whole booty, and the preferred Shafi'i view takes it from four-fifths. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} Its amount is less than a full share according to the majority, and is left to the imam by the Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784}"
  ur: "رضخ غنیمت سے دیا جانے والا معمولی حصہ ہے جو امام کی صوابدید پر ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782}"
  es: "Radkh en el léxico es un pequeño obsequio; en el uso de los juristas es un obsequio del botín cuya cantidad juzga el imán, dado a aquellos que no están obligados a luchar pero hacen un trabajo útil en la guerra, como mujeres, niños y un dhimmi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} La mayoría de los juristas lo consideran un derecho vinculante para quien ha hecho un trabajo útil, y una opinión de los shafi'íes lo hace recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} Una montura que no sea un caballo no tiene parte, pero a su jinete se le da un radkh después de la parte del soldado de infantería. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} Los juristas difieren en cuanto a su origen: los hanafíes y los hanbalíes, y una opinión shafi'í, lo toman de todo el botín, mientras que la opinión shafi'í preferida lo toma de cuatro quintas partes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} Su cantidad es menor que una parte completa según la mayoría, y los malikíes la dejan al imán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784}"
  fr: "Le terme « radkh » désigne, dans le lexique, une petite offrande. Chez les juristes, il s'agit d'une offrande prélevée sur le butin, dont le montant est déterminé par l'imam, et accordée à ceux qui ne sont pas tenus de combattre mais qui accomplissent un travail utile pendant la guerre, tels que les femmes, les garçons et les dhimmis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} La plupart des juristes considèrent qu'il s'agit d'un droit acquis pour celui qui a accompli un travail utile, et l'avis des Shafi'ites le recommande. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8782} Une monture autre qu'un cheval ne donne pas droit à une part, mais son cavalier reçoit un radkh après la part du fantassin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} Les juristes divergent quant à son origine: les hanafites et les hanbalites, ainsi qu’une opinion shafi’ite, la prélèvent sur la totalité du butin, tandis que l’opinion shafi’ite privilégiée la prélève sur les quatre cinquièmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8783} Selon la majorité, son montant est inférieur à une part entière et, selon les malikites, il est laissé à l’imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784}"
  tr: "Dilbilimde teslimiyet, küçük bir bağış anlamına gelirken, terminolojide, imamın savaşta savaşmak zorunda olmayan ve faydalı işler yapmak zorunda olmayanlar, kadınlar, çocuklar ve zimmi (zimmi) için savaş ganimetlerinden aldığı bir armağandır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8781}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8782} Çoğu hukukçu, savaşta faydalı bir eylem yapan kişinin hak ve zorunlu olduğunu, Şafiilere göre ise bunun tavsiye edildiğini savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8782} At olmayan bir hayvana pay verilmez ve binicisi ayak oku sonrası teslim olmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8783} Hukukçular yerinde farklı görüşteydiler; Hanefiler ve Hanbaliler, Şafiilerin orijinal ganimetlerden boyun eğdiğini, Şafiilerin ise daha belirgin görüşte bunun beşte dörtten olduğunu söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8783} Değeri, çoğunluğa göre payın değerinden azdır ve Malikilere göre imama emanet edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8784}"
  id: "Dalam linguistik, penyerahan berarti pemberian kecil, dan dalam istilah itu, ini adalah hadiah dari rampasan perang yang berusaha diukur imam untuk mereka yang tidak wajib bertempur dan melakukan perbuatan baik di dalamnya, seperti wanita, anak-anak, dan dhimmi (dhimmi). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8782} Mayoritas ahli hukum berpendapat bahwa itu adalah hak dan kewajiban bagi seseorang yang melakukan perbuatan baik dalam pertempuran, sementara menurut Shafi'i hal itu direkomendasikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8782} Hewan non-kuda tidak diberikan bagian dan penunggangnya harus menyerah setelah panah kaki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8783} Para ahli hukum berbeda pendapat tentang tempatnya; Hanafi dan Hanbal mengatakan Shafi'i menyerah dari rampasan asli, sedangkan Shafi'i mengatakan dalam pandangan yang lebih jelas itu dari empat per lima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8783} Nilainya lebih kecil dari nilai saham menurut mayoritas, dan dipercayakan kepada imam menurut Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8784}"
