summary:
  ar: "سقولو قندريون في الكتاب نبات صخري ينبت في المكان الكثير الفيء، وقال قوم إنه ضرب من الأشقيل، حار في الأولى يابس في الثانية، لطيف محلل ينفع الطحال منفعة عجيبة وينفع من الفواق واليرقان ويفتت الحصاة، وفي الكتاب نقل موسوم في الحبل {cite:canon-ibn-sina-print-v1 p.596}."
  en: "Saquluqandriyun is in the book a rocky plant growing in a place of much shade, which some said is a kind of squill, hot in the first degree and dry in the second, fine and dissolving; the book says it helps the spleen wonderfully, helps hiccup and jaundice and breaks up stone, with a labelled listing on conception {cite:canon-ibn-sina-print-v1 p.596}."
  ur: "سقولوقندریون کتاب میں ایک پتھریلا پودا ہے جو بہت سایہ والی جگہ اگتا ہے، بعض نے کہا کہ یہ اشقیل ⁦(عنصل)⁩ کی ایک قسم ہے، پہلے درجے میں گرم اور دوسرے میں خشک، لطیف اور گھلانے والا؛ کتاب کے مطابق تلی کو حیرت انگیز فائدہ دیتا ہے، ہچکی اور یرقان میں مفید ہے اور پتھری توڑتا ہے، اور حمل کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.596}۔"
  es: "Saquluqandriyun es en el libro una planta rocosa que crece en un lugar muy sombreado, que algunos dicen que es una especie de escila, caliente en el primer grado y seca en el segundo, fina y disolvente; el libro dice que ayuda maravillosamente al bazo, ayuda al hipo y la ictericia y disuelve los cálculos, con una lista etiquetada sobre la concepción {cite:canon-ibn-sina-print-v1 p.596}."
  fr: "Le livre décrit le Saquluqandriyun comme une plante rocheuse poussant dans un endroit très ombragé, que certains décrivent comme une sorte de scille, chaude au premier degré et sèche au second, fine et dissolvante; le livre indique qu'elle aide merveilleusement la rate, soulage le hoquet et la jaunisse et dissout les calculs, avec une liste légendée sur la conception {cite:canon-ibn-sina-print-v1 p.596}."
