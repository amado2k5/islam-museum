label:
  ar: "التذكر"
  en: "Tadhakkur (remembering and its legal effect)"
  ur: "تذکر ⁦(یاد آنا اور اس کا حکم)⁩"
  es: "Tadhakkur (el recuerdo y sus efectos legales)"
  fr: "Tadhakkur (le souvenir et son effet juridique)"
  tr: "Hatırlatma"
  id: "Pengingat"
summary:
  ar: "التذكر في الفقه أثر النسيان والسهو في الأحكام: فعند الحنابلة والمالكية لا تبطل صلاة من أكل ناسيا، والحنفية يبطلونها، والشافعية يفرقون بين القليل والكثير. ويفطر من أكل أو شرب ناسيا عند المالكية، ولا يفطر عند جمهور الفقهاء. وفي حكم القاضي والشاهد يعتمد جمهور الفقهاء على التذكر لا على الخط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910}"
  en: "In law, tadhakkur is the recollection that governs the effect of forgetting and inattention on rulings. The Hanbalis and Malikis do not void the prayer of one who ate forgetfully, the Hanafis do, and the Shafi'is distinguish little from much. A fast is broken by eating forgetfully in the Maliki view, but not in the majority view. For a judge or a witness, most jurists rely on remembrance, not on handwriting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910}"
  es: "En derecho, el tadhakkur es el recuerdo que rige el efecto del olvido y la falta de atención en las decisiones judiciales. Los hanbalíes y los malikíes no invalidan la oración de quien comió por olvido, los hanafíes sí, y los shafiíes distinguen entre poco y mucho. Según la opinión malikí, comer por olvido rompe el ayuno, pero no según la opinión mayoritaria. Para un juez o un testigo, la mayoría de los juristas se basan en el recuerdo, no en la escritura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910}"
  fr: "En droit, le tadhakkur est le souvenir qui détermine l'effet de l'oubli et de l'inattention sur les décisions. Les hanbalites et les malikites ne considèrent pas comme nulle la prière de celui qui a mangé par inadvertance, contrairement aux hanafites, tandis que les chaféites font une distinction plus nette entre les cas mineurs et les cas importants. Selon l'avis malikite, manger par inadvertance rompt le jeûne, contrairement à l'avis majoritaire. Pour un juge ou un témoin, la plupart des juristes se fient au souvenir, et non à l'écriture."
  ur: "قانون میں، تذکر وہ یاد ہے جو احکام پر بھولنے اور عدم توجہی کے اثرات کو کنٹرول کرتی ہے۔ حنبلی اور مالکیہ اس کی نماز باطل نہیں کرتے جس نے بھول کر کھا لیا، حنفیہ کرتے ہیں، اور شافعی بہت سے کم فرق کرتے ہیں۔ مالکی کے نزدیک بھول کر کھانے سے روزہ ٹوٹ جاتا ہے لیکن جمہور کے نزدیک نہیں۔ جج یا گواہ کے لیے، زیادہ تر فقہا یاد پر انحصار کرتے ہیں، ہاتھ کی لکھائی پر نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4906} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4907} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4909} صفحہ 4910}"
  tr: "Fıkıhta unutkanlık ve unutmanın hükümlerdeki etkisini hatırlamak: Hanbali ve Maliki'ye göre, bir dua unutularak yemesi geçersiz sayılmaz, ancak Hanefiler onu geçersiz kılar, Şafi'ler ise küçük ile bol arasında ayrım yapar. Malikilere göre, unutkanlık yiyip içen kişi orucunu bozmaz. Hakim ve tanığın kararı konusunda, hukukçuların çoğu el yazısına değil, hatırlamaya dayanır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.4906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4910}"
  id: "Mengingat dalam yurisprudensi Dampak dari lupa dan lupa dalam putusan: Menurut Hanbalis dan Malikis, doa tidak dibatalkan jika seseorang makan dengan lupa, tetapi Hanafi membatalkannya, sementara Shafi'i membedakan antara kecil dan banyak. Menurut Maliki, seseorang yang makan atau minum dengan lupa, tetapi menurut mayoritas ahli hukum, dia tidak memutus puasanya. Mengenai putusan hakim dan saksi, mayoritas ahli hukum mengandalkan ingatan, bukan tulisan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910}"
