label:
  ar: "التذكر"
  en: "Tadhakkur (remembering and its legal effect)"
  ur: "تذکر (یاد آنا اور اس کا حکم)"
summary:
  ar: "التذكر في الفقه أثر النسيان والسهو في الأحكام: فعند الحنابلة والمالكية لا تبطل صلاة من أكل ناسيا، والحنفية يبطلونها، والشافعية يفرقون بين القليل والكثير. ويفطر من أكل أو شرب ناسيا عند المالكية، ولا يفطر عند جمهور الفقهاء. وفي حكم القاضي والشاهد يعتمد جمهور الفقهاء على التذكر لا على الخط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910}"
  en: "In law, tadhakkur is the recollection that governs the effect of forgetting and inattention on rulings. The Hanbalis and Malikis do not void the prayer of one who ate forgetfully, the Hanafis do, and the Shafi'is distinguish little from much. A fast is broken by eating forgetfully in the Maliki view, but not in the majority view. For a judge or a witness, most jurists rely on remembrance, not on handwriting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910}"
