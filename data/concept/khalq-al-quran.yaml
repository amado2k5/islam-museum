id: concept/khalq-al-quran
education:
  did_you_know:
    ar: "في مسألة خلق القرآن جرت المحنة أيام الإمام أحمد؛ يذكر ابن بدران موقف الإمام وموقف الفرق التي خالفته، وكيف تفرقت الجهمية في المسألة."
    en: "The 'created Qur'an' question brought the ordeal of Imam Ahmad's days; Ibn Badran records the Imam's stand, the opposing sects' stands, and how the Jahmiyya split over it."
    ur: "«مخلوق قرآن» کے سوال پر امام احمد کے زمانے کا امتحان ہوا؛ ابن بدران امام کا موقف، مخالف فرقوں کا موقف اور جہمیہ کا اس مسئلے میں بٹوارہ بیان کرتا ہے۔"
    sources: [source/madkhal-ibn-badran-turki, source/lumat-al-itiqad-ibn-uraiyir-2022]
class: concept
kind: doctrine
label:
  ar: خلق القرآن
  en: "The createdness of the Qur'an"
issue:
  ar: هل كلام الله المتلو في القرآن مخلوق أم غير مخلوق؟
summary:
  ar: مسألة في الاعتقاد جرت فيها المحنة في أيام الإمام أحمد؛ يذكر كتاب ابن بدران موقف الإمام وموقف الفرق التي خالفته، وكيف تفرقت الجهمية في المسألة.
  en: "A question of creed over which the mihna took place in the days of Imam Ahmad. Ibn Badran's book reports the Imam's position and the positions of the sects that opposed him, and how the Jahmiyya divided over the question."
