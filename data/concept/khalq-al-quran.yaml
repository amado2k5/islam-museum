  id: lalakai-sharh-usul
  stance:
    ar: القرآن كلام الله غير مخلوق، قاله خمسمائة وخمسون نفساً أو أكثر من التابعين ومن بعدهم
    en: The Qur'an is God's uncreated speech, as 550 or more Successors and later imams said
  summary:
    ar: يسرد اللالكائي في «شرح أصول اعتقاد أهل السنة» أسماء من قال إن القرآن كلام الله غير مخلوق ومن قال مخلوق فهو كافر، ويعدهم خمسمائة وخمسين نفساً أو أكثر سوى الصحابة، فيهم نحو مائة إمام، ويقول إنه لا خلاف بين الأمة أن أول من قال بخلقه الجعد بن درهم ثم الجهم بن صفوان، ثم يسوق من أفتى في القائل به من الفقهاء والخلفاء.
    en: Al-Lalaka'i in Sharh Usul I'tiqad Ahl al-Sunna lists those who said the Qur'an is God's uncreated speech and that whoever calls it created is an unbeliever, counting 550 or more besides the Companions, about a hundred of them imams; he says the community agrees that the first to call it created was al-Ja'd ibn Dirham, then al-Jahm ibn Safwan, and then lists the jurists and caliphs who gave rulings on whoever held it.
