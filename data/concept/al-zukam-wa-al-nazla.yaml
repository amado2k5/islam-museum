id: concept/al-zukam-wa-al-nazla
class: concept
kind: scientific
label:
  ar: الزكام والنزلة
  en: Catarrh and the descending catarrh
  fr: "Le coryza et le catarrhe descendant"
  ur: زکام اور نزلہ
  es: "Catarro y catarro descendente"
summary:
  ar: الزكام والنزلة علتان مشتركتان في أن كل واحدة سيلان المادة من الدماغ، ويخص بعضهم بالنزلة ما نزل وحده إلى الحلق وبالزكام ما كان من طريق الأنف منصباً إلى العين وجلدة الوجه؛ وقد تنتفض النزلة إلى الحلق والرئة والمريء والمعدة فتقرحها وتهيج الشهوة الكلبية وقد يتولد منها الخوانيق وذات الرئة وذات الجنب والسل خاصة والقولنج؛ وسببها حرارة مزاجية أو خارجية من شمس أو سموم أو شم أدوية مسخنة أو برودة مزاجية أو واردة من هواء بارد وشمال خصوصاً إذا كشف الرأس لهما وقد تخلخل الدماغ من حمام أو رياضة أو غضب أو فكر {cite:canon-ibn-sina-print-v2 p.240} {cite:canon-ibn-sina-print-v2 p.241}
  en: 'Zukam and nazla are two ailments sharing that each is a flowing of matter from the brain; some give the name nazla to what descends alone to the throat, and zukam to what comes by way of the nose toward the eye and the facial skin. The nazla may dart to the throat, lung, gullet and stomach, ulcerating them and stirring the canine appetite ⁦(the editor''s note: eating much after long hunger, then vomiting)⁩; from it may be bred quinsies, pneumonia, pleurisy and consumption above all, and colic, especially from its raw phlegmy kind. Its cause is a temperamental or external heat — sun, hot winds, smelling heating drugs — or a temperamental cold or one arriving from cold air and the north wind, especially if the head is bared to them while the brain is loosened by bath, exercise, anger or thought {cite:canon-ibn-sina-print-v2 p.240} {cite:canon-ibn-sina-print-v2 p.241}'
  fr: "Le zukam et la nazla sont deux affections qui ont en commun d’être chacune un écoulement de matière à partir du cerveau ; certains donnent le nom de nazla à ce qui descend seul vers la gorge, et celui de zukam à ce qui vient par la voie du nez vers l’œil et la peau du visage. La nazla peut se précipiter vers la gorge, le poumon, l’œsophage et l’estomac, les ulcérant et excitant l’appétit canin ⁦(note de l’éditeur : manger beaucoup après une longue faim, puis vomir)⁩ ; d’elle peuvent naître des angines, la pneumonie, la pleurésie et par-dessus tout la consomption, ainsi que la colique, surtout de son espèce crue et phlegmatique. Sa cause est une chaleur tempéramentale ou extérieure (le soleil, les vents chauds, l’inhalation de remèdes échauffants), ou un froid tempéramental ou venu de l’air froid et du vent du nord, surtout si la tête y est exposée nue alors que le cerveau est relâché par le bain, l’exercice, la colère ou la pensée {cite:canon-ibn-sina-print-v2 p.240} {cite:canon-ibn-sina-print-v2 p.241}"
  ur: 'زکام اور نزلہ دونوں امراض اس میں شریک ہیں کہ ہر ایک دماغ سے مادے کا بہنا ہے؛ بعض نزلہ اسے کہتے ہیں جو تنہا حلق تک اترے اور زکام اسے جو ناک کے راستے آنکھ اور چہرے کی کھل تک پہنچے؛ نزلہ حلق، پھیپھڑے، غذائی نالی اور معدے تک جھپٹ سکتا ہے اور انہیں چھالے دار کر کے کلبی اشتہا ⁦(محرر کا حاشیہ: لمبے بھوک کے بعد بہت کھانا پھر قے آنا)⁩ بھڑکا سکتا ہے؛ اور اس سے خوانق، ذات الرئة، ذات الجنب اور خاص طور پر سل اور قولنج پیدا ہو سکتے ہیں؛ اس کا سبب مزاجی یا بیرونی گرمی ہے — دھوپ، گرم ہوائیں، گرم کرنے والی ادویہ کا سونگھنا — یا مزاجی سردی یا ٹھنڈی ہوا اور شمالی باد سے آنے والی، خصوصاً جب سر کھلا ہو اور دماغ حمام، ورزش، غصے یا فکر سے ڈھیلا ہوا ہو {cite:canon-ibn-sina-print-v2 p.240} {cite:canon-ibn-sina-print-v2 p.241}'
  es: "Zukam y nazla son dos afecciones que comparten la característica de ser un flujo de materia desde el cerebro; algunos llaman nazla a lo que desciende solo a la garganta, y zukam a lo que llega por la nariz hacia el ojo y la piel de la cara. La nazla puede llegar a la garganta, los pulmones, el esófago y el estómago, ulcerándolos y estimulando el apetito del perro (nota del editor: comer mucho después de un largo periodo de hambre, seguido de vómitos); de ella pueden derivarse amigdalitis, neumonía, pleuresía y, sobre todo, tuberculosis, y cólicos, especialmente en su forma flemosa. Su causa es un calor externo o temperamental —sol, vientos cálidos, olor a drogas que generan calor— o un frío temperamental o uno que llega del aire frío y el viento del norte, especialmente si la cabeza está expuesta a ellos mientras el cerebro se relaja mediante el baño, el ejercicio, la ira o el pensamiento {cite:canon-ibn-sina-print-v2 p.240} {cite:canon-ibn-sina-print-v2 p.241}"
