id: concept/jalluz
class: concept
kind: natural
label:
  ar: "جلّوز"
  en: "Jalluz (the large pine nut)"
  ur: "جلّوز ⁦(بڑا صنوبر کا بیج)⁩"
  es: "Jalluz (el piñón grande)"
  fr: "Jalluz (la grosse pignon de pin)"
summary:
  ar: "حبّ الصنوبر الكبار، أفضل غذاء من الجوز لكنه أبطأ هضماً، معتدل فيه حرارة يسيرة؛ يغذو غذاء قوياً، وينفع أوجاع العصب والظهر وعرق النسا، وينقّي الرئة، ويهيّج الباه، وينفع من الحصاة في المثانة {cite:canon-ibn-sina-print-v1 p.419} {cite:canon-ibn-sina-print-v1 p.420}."
  en: "The large pine nut. It is a better food than the walnut but slower to digest; its temperament is balanced with a little heat. It nourishes strongly and eases pains of the nerve, back and sciatica, clears the lung, stirs desire and helps stone in the bladder {cite:canon-ibn-sina-print-v1 p.419} {cite:canon-ibn-sina-print-v1 p.420}."
  ur: "بڑا صنوبر کا بیج۔ یہ اخروٹ سے بہتر غذا ہے مگر ہضم میں دیر لگاتا ہے؛ مزاج معتدل ہے جس میں تھوڑی گرمی ہے۔ یہ قوی غذا دیتا ہے، اعصاب، کمر اور عرق النساء کے درد کو دور کرتا ہے، پھیپھڑے صاف کرتا ہے، جماع کی خواہش بڑھاتا ہے اور مثانے کی پتھری میں مفید ہے {cite:canon-ibn-sina-print-v1 p.419} {cite:canon-ibn-sina-print-v1 p.420}۔"
  es: "El piñón grande. Es un alimento mejor que la nuez, pero de digestión más lenta; su temperamento es equilibrado con un ligero calor. Nutre intensamente y alivia dolores nerviosos, de espalda y ciática, despeja los pulmones, estimula el deseo y ayuda a expulsar cálculos en la vejiga {cite:canon-ibn-sina-print-v1 p.419} {cite:canon-ibn-sina-print-v1 p.420}."
  fr: "La grosse pignon de pin. C'est un aliment de meilleure qualité que la noix, mais plus long à digérer; son tempérament est équilibré, avec une légère chaleur. Elle est très nourrissante et soulage les douleurs nerveuses, dorsales et sciatiques, purifie les poumons, stimule le désir et aide à dissoudre les calculs rénaux. {cite:canon-ibn-sina-print-v1 p.419} {cite:canon-ibn-sina-print-v1 p.420}."
