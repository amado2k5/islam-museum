id: concept/common-sense-and-imagination
class: concept
kind: scientific
label: { ar: "الحس المشترك والخيال عند ابن سينا", en: "Common sense and imagination in the Canon", ur: "قانون میں حس مشترک اور خیال", es: "El sentido común y la imaginación en el canon", fr: "Le bon sens et l'imagination dans le canon" }
summary:
  ar: "من قوى الإدراك الباطن الخمس عند ابن سينا قوة تسمى الحس المشترك والخيال، وهي عند الأطباء قوة واحدة وعند المحصلين من الحكماء قوتان، ومسكنها البطن المقدم من الدماغ {cite:canon-ibn-sina-print-v1 p.100}."
  en: "Among the five powers of inner perception in Ibn Sina is the one called common sense and imagination, which physicians count as one power and the philosophers who verify it as two, and whose seat is the front ventricle of the brain {cite:canon-ibn-sina-print-v1 p.100}."
  es: "Entre las cinco facultades de percepción interna en Ibn Sina se encuentra la llamada sentido común e imaginación, que los médicos cuentan como una facultad y los filósofos que la verifican como dos, y cuya sede es el ventrículo anterior del cerebro {cite:canon-ibn-sina-print-v1 p.100}."
  fr: "Parmi les cinq pouvoirs de perception intérieure chez Ibn Sina, il y a celui appelé bon sens et imagination, que les médecins comptent comme un seul pouvoir et les philosophes qui le vérifient comme deux, et dont le siège est le ventricule antérieur du cerveau {cite:canon-ibn-sina-print-v1 p.100}."
  ur: "ابن سینا میں باطنی ادراک کی پانچ طاقتوں میں سے ایک وہ ہے جسے عام فہم اور تخیل کہا جاتا ہے، جسے طبیب ایک طاقت شمار کرتے ہیں اور فلسفی جو اس کی تصدیق کرتے ہیں، اور جن کی نشست دماغ کا اگلا ویںٹرکل ہے {حوالہ: کینون ابن سینا پرنٹ v1 صفحہ 100}۔"
