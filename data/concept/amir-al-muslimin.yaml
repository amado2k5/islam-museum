id: concept/amir-al-muslimin
class: concept
kind: term
label:
  ar: "أمير المسلمين ⁦(لقب المرابطين)⁩"
  en: "Amir al-Muslimin ('commander of the Muslims', Almoravid title)"
  fr: "Amir al-Muslimin (« commandant des musulmans », titre almoravide)"
  es: "Amir al-Muslimin ('comandante de los musulmanes', título almorávide)"
  ur: "امیر المسلمین ⁦('مسلمانوں کا کمانڈر'، الموراوید لقب)⁩"
  tr: "Müslümanların Prensi (Almoravidlerin unvanı)"
  id: "Müslümanların Prensi (Almoravidlerin unvanı)"
summary:
  ar: "أمير المسلمين، لقب تبناه المرابطون أولًا تمييزًا له عن «أمير المؤمنين»، لأن الخلفاء العباسيين كانوا عندهم فوق كل سلطة، فأنشأوا لأنفسهم خلافة فرعية بلقب خاص، ثم حمل الأمراء الأفارقة والأندلسيون اللقبين، بحسب ما إذا طلبوا الخلافة المستقلة أو أقروا بسيادة أحد {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  en: "Amir al-Muslimin, 'lord of the Muslims', was first assumed by the Almoravids to distinguish it from amir al-mu'minin. The Almoravids recognized the Abbasids' supremacy and did not wish to take the caliphal title, so they set up a kind of sub-caliphate with a title of their own {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  fr: "Amir al-Muslimin, « seigneur des musulmans », fut d’abord adopté par les Almoravides pour le distinguer d’amir al-mu’minin. Les Almoravides reconnaissaient la suprématie des Abbassides et ne voulaient pas prendre le titre califal ; ils instituèrent donc une sorte de sous-califat doté d’un titre qui lui était propre {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  es: "El título de Amir al-Muslimin, «señor de los musulmanes», fue adoptado inicialmente por los almorávides para distinguirlo de amir al-mu'minin. Los almorávides reconocieron la supremacía de los abasíes y no desearon ostentar el título de califa, por lo que establecieron una especie de subcalifato con un título propio {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  ur: "امیر المومنین، 'مسلمانوں کے آقا' کو سب سے پہلے الموراویوں نے امیر المومنین سے ممتاز کرنے کے لیے فرض کیا تھا۔ الموراویوں نے عباسیوں کی بالادستی کو تسلیم کیا اور وہ خلیفہ کا لقب نہیں لینا چاہتے تھے، اس لیے انہوں نے اپنے عنوان کے ساتھ ایک قسم کی ذیلی خلافت قائم کی جس کا عنوان تھا۔ 1 ص۔ 467}۔"
  tr: "'Müslümanların Komutanı' unvanı ilk olarak Almoravidler tarafından 'İnananların Komutanı'ndan ayırt etmek için benimsenmiştir; çünkü Abbasi halifeleri onu tüm otoritelerin üstünde görürlerdi ve özel bir unvanla yan bir halifelik kurdular. Daha sonra, Afrika ve Endülüs prensleri, bağımsız bir halifelik isteyip istemediklerine veya birinin egemenliğini tanıyıp tanımadıklarına bağlı olarak her iki unvanı da taşıdılar {cite:encyclopaedia-of-Islam-2 cilt 1, s. 467}."
  id: "'Müslümanların Komutanı' unvanı ilk olarak Almoravidler tarafından 'İnananların Komutanı'ndan ayırt etmek için benimsenmiştir; çünkü Abbasi halifeleri onu tüm otoritelerin üstünde görürlerdi ve özel bir unvanla yan bir halifelik kurdular. Daha sonra, Afrika ve Endülüs prensleri, bağımsız bir halifelik isteyip istemediklerine veya birinin egemenliğini tanıyıp tanımadıklarına bağlı olarak her iki unvanı da taşıdılar {cite:encyclopaedia-of-Islam-2 cilt 1, s. 467}."
