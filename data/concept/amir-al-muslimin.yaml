label:
  ar: "أمير المسلمين (لقب المرابطين)"
  en: "Amir al-Muslimin ('commander of the Muslims', Almoravid title)"
summary:
  ar: "أمير المسلمين، لقب تبناه المرابطون أولًا تمييزًا له عن «أمير المؤمنين»، لأن الخلفاء العباسيين كانوا عندهم فوق كل سلطة، فأنشأوا لأنفسهم خلافة فرعية بلقب خاص، ثم حمل الأمراء الأفارقة والأندلسيون اللقبين، بحسب ما إذا طلبوا الخلافة المستقلة أو أقروا بسيادة أحد {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
  en: "Amir al-Muslimin, 'lord of the Muslims', was first assumed by the Almoravids to distinguish it from amir al-mu'minin. The Almoravids recognized the Abbasids' supremacy and did not wish to take the caliphal title, so they set up a kind of sub-caliphate with a title of their own {cite:encyclopaedia-of-islam-2 vol. 1 p. 467}."
