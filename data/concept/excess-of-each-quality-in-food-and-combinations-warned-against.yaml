label: { ar: "الإكثار من كل كيفية في الغذاء والمركبات المنهي عنها", en: "Excess of each quality in food, and combinations warned against", ur: "غذا کی ہر کیفیت کی زیادتی اور ممنوع امتزاج", es: "Exceso de cada cualidad en los alimentos y combinaciones que se advierten", fr: "L'excès de chaque qualité dans les aliments et les combinaisons déconseillées", tr: "Tüm gıda türleri ve yasaklı bileşiklerin artırılması", id: "Meningkatkan semua bentuk makanan dan senyawa terlarang" }
summary:
  ar: "يذكر ابن سينا أن الاستكثار من الأغذية اليابسة يسقط الشهوة ويفسد اللون، ومن الدسم يكسل، ومن البارد يفتر، ومن الحامض يجلب الهرم، ومن المالح يضر بالمعدة والعين، ويورد قول جالينوس في الغذاء الرطب، ثم ينقل عن أصحاب التجارب من أهل الهند وغيرهم نهيهم عن جمع اللبن مع الحموضات والسمك مع اللبن لأنهما يورثان أمراضاً مزمنة منها الجذام {cite:canon-ibn-sina-print-v1 p.235}."
  en: "Ibn Sina says too much dry food kills appetite and spoils colour, fatty food makes one sluggish, cold food slackens, sour food brings old age and salty food harms the stomach and the eye; he cites Galen on moist food, then relays the warnings of people of experience among the Indians and others against milk with sours and fish with milk, which they said bring chronic illness including leprosy {cite:canon-ibn-sina-print-v1 p.235}."
  es: "Ibn Sina dice que demasiada comida seca mata el apetito y estropea el color, la comida grasa hace que uno se sienta lento, la comida fría debilita, la comida ácida trae vejez y la comida salada daña el estómago y la vista; cita a Galeno sobre la comida húmeda, luego transmite las advertencias de personas con experiencia entre los indios y otros contra la leche con frutas ácidas y el pescado con leche, que decían que traían enfermedades crónicas, incluida la lepra {cite:canon-ibn-sina-print-v1 p.235}."
  fr: "Ibn Sina affirme qu'une trop grande quantité d'aliments secs coupe l'appétit et altère le teint, que les aliments gras rendent léthargique, que les aliments froids ralentissent, que les aliments acides accélèrent la vieillesse et que les aliments salés nuisent à l'estomac et aux yeux; il cite Galien au sujet des aliments humides, puis relate les avertissements de personnes d'expérience parmi les Indiens et d'autres contre le lait avec des aliments acides et le poisson avec du lait, qui, selon eux, provoquent des maladies chroniques, y compris la lèpre {cite:canon-ibn-sina-print-v1 p.235}."
  ur: "ابن سینا کا کہنا ہے کہ بہت زیادہ خشک کھانا بھوک کو ختم کرتا ہے اور رنگت کو خراب کرتا ہے، چکنائی والی غذا سستی کردیتی ہے، ٹھنڈا کھانا سست کردیتا ہے، کھٹا کھانا بڑھاپا لاتا ہے اور نمکین کھانا معدے اور آنکھ کو نقصان پہنچاتا ہے۔ اس نے گیلن کا مرطوب کھانے پر حوالہ دیا، پھر ہندوستانیوں اور دیگر لوگوں کے تجربہ کار لوگوں کی انتباہات کو دودھ کے ساتھ کھٹا اور مچھلی کے ساتھ دودھ کے خلاف پیش کیا، جس کے بارے میں انہوں نے کہا کہ کوڑھ سمیت دائمی بیماری لاتی ہے۔"
  tr: "İbn Sina, kuru gıdaların aşırı tüketiminin isteği azalttığını ve rengi bozduğunu; yağlı yiyeceklerin tembelliğe yol açtığını; soğuk yiyeceklerin yorgunluğa; asitlerin yaşlanmaya yol açtığını; tuzlu yiyeceklerin ise mide ve gözlere zarar verdiğini belirtir. Galen'in yaş mama hakkındaki görüşünü aktarır. Daha sonra Hindistan'dan ve diğerlerinden deney yapanların, sütün asitlerle ve balığın sütle birleştirilmesini yasakladığını çünkü bunun cüzzam gibi kronik hastalıklara neden olduğunu aktarır. {cite:canon-ibn-sina-print-v1 s.235}."
  id: "Ibn Sina menyebutkan bahwa konsumsi makanan kering yang berlebihan mengurangi hasrat dan merusak warna; makanan berlemak menyebabkan malas; makanan dingin menyebabkan kelelahan; asam menyebabkan penuaan; dan makanan asin merusak lambung dan mata. Ia mengutip pandangan Galen mengenai makanan basah. Ia kemudian mengutip peneliti dari India dan lainnya yang melarang menggabungkan susu dengan asam dan ikan dengan susu karena menyebabkan penyakit kronis seperti kusta. {cite:canon-ibn-sina-print-v1 hlm.235}."
