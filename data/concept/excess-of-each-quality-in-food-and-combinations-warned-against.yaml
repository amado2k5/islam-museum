summary:
  ar: "يذكر ابن سينا أن الاستكثار من الأغذية اليابسة يسقط الشهوة ويفسد اللون، ومن الدسم يكسل، ومن البارد يفتر، ومن الحامض يجلب الهرم، ومن المالح يضر بالمعدة والعين، ويورد قول جالينوس في الغذاء الرطب، ثم ينقل عن أصحاب التجارب من أهل الهند وغيرهم نهيهم عن جمع اللبن مع الحموضات والسمك مع اللبن لأنهما يورثان أمراضاً مزمنة منها الجذام {cite:canon-ibn-sina-print-v1 p.235}."
  en: "Ibn Sina says too much dry food kills appetite and spoils colour, fatty food makes one sluggish, cold food slackens, sour food brings old age and salty food harms the stomach and the eye; he cites Galen on moist food, then relays the warnings of people of experience among the Indians and others against milk with sours and fish with milk, which they said bring chronic illness including leprosy {cite:canon-ibn-sina-print-v1 p.235}."
