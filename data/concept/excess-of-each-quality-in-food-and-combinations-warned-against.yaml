summary:
  ar: "يذكر ابن سينا أن الاستكثار من الأغذية اليابسة يسقط الشهوة ويفسد اللون، ومن الدسم يكسل، ومن البارد يفتر، ومن الحامض يجلب الهرم، ومن المالح يضر بالمعدة والعين، ويورد قول جالينوس في الغذاء الرطب، ثم ينقل عن أصحاب التجارب من أهل الهند وغيرهم نهيهم عن جمع اللبن مع الحموضات والسمك مع اللبن لأنهما يورثان أمراضاً مزمنة منها الجذام {cite:canon-ibn-sina-print-v1 p.235}."
  en: "Ibn Sina says too much dry food kills appetite and spoils colour, fatty food makes one sluggish, cold food slackens, sour food brings old age and salty food harms the stomach and the eye; he cites Galen on moist food, then relays the warnings of people of experience among the Indians and others against milk with sours and fish with milk, which they said bring chronic illness including leprosy {cite:canon-ibn-sina-print-v1 p.235}."
  es: "Ibn Sina dice que demasiada comida seca mata el apetito y estropea el color, la comida grasa hace que uno se sienta lento, la comida fría debilita, la comida ácida trae vejez y la comida salada daña el estómago y la vista; cita a Galeno sobre la comida húmeda, luego transmite las advertencias de personas con experiencia entre los indios y otros contra la leche con frutas ácidas y el pescado con leche, que decían que traían enfermedades crónicas, incluida la lepra {cite:canon-ibn-sina-print-v1 p.235}."
  fr: "Ibn Sina affirme qu'une trop grande quantité d'aliments secs coupe l'appétit et altère le teint, que les aliments gras rendent léthargique, que les aliments froids ralentissent, que les aliments acides accélèrent la vieillesse et que les aliments salés nuisent à l'estomac et aux yeux; il cite Galien au sujet des aliments humides, puis relate les avertissements de personnes d'expérience parmi les Indiens et d'autres contre le lait avec des aliments acides et le poisson avec du lait, qui, selon eux, provoquent des maladies chroniques, y compris la lèpre {cite:canon-ibn-sina-print-v1 p.235}."
