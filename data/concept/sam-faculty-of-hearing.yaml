id: concept/sam-faculty-of-hearing
class: concept
kind: legal
label:
  ar: "السَّمْع"
  en: "Sam' (the faculty of hearing and compensation for its loss)"
summary:
  ar: "السمع في اللغة حس الأذن، ويأتي بمعنى الإجابة كقولهم «سمع الله لمن حمده»، والاصطلاح لا يخرج عن المعنى اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824} وهو من أشرف الحواس عند أكثر الفقهاء، ويشترط في الإمامة والقضاء أن يكون المتولي سميعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9825} وزوال السمع بجناية لا قصاص فيها يوجب الدية الكاملة باتفاق الفقهاء، أما إذا كانت الجناية فيها قصاص فالفقهاء مختلفون في ما يجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9826}"
  en: "In the lexicon sam' is the sense organ of the ear, and it also means answering, as in 'God hears whoever praises Him'; the technical sense does not depart from the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824} For most jurists hearing is among the noblest of the senses, and the holder of imamate or judgeship must be able to hear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9825} When hearing is lost through a wound that carries no retaliation, a full blood-money is owed by agreement of the jurists; when the wound carries retaliation the jurists differ about what is owed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9825} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9826}"
