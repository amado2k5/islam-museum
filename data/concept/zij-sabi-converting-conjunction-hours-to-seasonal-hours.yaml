label: { ar: "تحويل ساعات الاجتماع إلى ساعات زمانية", en: "Converting the conjunction hours into seasonal hours", ur: "اجتماع کے گھنٹوں کو موسمی گھنٹوں میں بدلنا", es: "Conversión de las horas de conjunción en horas estacionales" }
summary:
  ar: "يحول البتاني ساعات الاجتماع المعتدلة إلى ساعات زمانية بقسمتها على أزمان ساعات النهار أو الليل، فيخرج عدد الساعات الزمانية منذ طلوع الشمس أو غروبها، ويُحسب الجزء الباقي جزءاً من الساعة، ثم يُنقل إلى بلد آخر بفرق الطول في خمسة عشر. {cite:zij-sabi-nallino-byblion p.143}."
  en: "Al-Battani turns the equated conjunction hours into seasonal hours by dividing them by the lengths of the day or night hours; the count of seasonal hours from sunrise or sunset comes out, and the remainder is a fraction of an hour. The result is then moved to another place by the difference in longitude divided by fifteen. {cite:zij-sabi-nallino-byblion p.143}."
  ur: "البتانی معتدل اجتماعی گھنٹوں کو موسمی گھنٹوں میں بدلتے ہیں، انہیں دن یا رات کے گھنٹوں کے وقت پر تقسیم کر کے، تاکہ طلوعِ آفتاب یا غروبِ آفتاب سے موسمی گھنٹوں کی تعداد نکلے، اور باقی حصہ گھنٹے کا جزو ہو۔ پھر طول کے فرق کو پندرہ پر تقسیم کر کے نتیجہ کسی دوسرے شہر کی طرف منتقل کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.143}۔"
  es: "Al-Battani transforma las horas de conjunción equivalentes en horas estacionales dividiéndolas por la duración de las horas diurnas o nocturnas; se obtiene el conteo de horas estacionales desde el amanecer o el atardecer, y el resto es una fracción de hora. El resultado se traslada luego a otro lugar mediante la diferencia de longitud dividida por quince. {cite:zij-sabi-nallino-byblion p.143}."
