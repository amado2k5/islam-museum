summary:
  ar: "الكبيكج أربعة أنواع عند ديسقوريدوس، كلها حار يابس إلى الثانية، حاد مقرح جلاء لذاع للجلد، ويُقلع الجرب والثاليل، وينفع من ضربان الأسنان."
  en: "Kabikaj is, in Dioscorides' account, of four kinds, all hot and dry to the second degree, sharp, blistering, cleansing and irritant to the skin. It removes itch and warts, and its powder helps the throbbing of the teeth. The editor's footnote gives the name as warad al-habb."
  ur: "کبیکج دیسقوریدوس کے بیان کے مطابق چار قسموں کا ہے، جو سب دوسرے درجے تک گرم اور خشک ہیں، تیز، آبلہ ڈالنے والے، صاف کرنے والے اور جلد میں جلن پیدا کرنے والے ہیں۔ یہ خارش اور مسّوں کو دور کرتا ہے، اور اس کا سفوف دانتوں کی ٹیسیں کم کرتا ہے۔ حاشیے میں اسے ورد الحب لکھا گیا ہے۔"
  es: "Según Dioscórides, el kabikaj es de cuatro tipos, todos calientes y secos de segundo grado, punzantes, ampollantes, depurativos e irritantes para la piel. Elimina el picor y las verrugas, y su polvo alivia el dolor palpitante de los dientes. La nota al pie del editor lo denomina warad al-habb."
  fr: "Selon Dioscoride, le kabikaj se présente sous quatre formes, toutes chaudes et sèches au second degré, piquantes, vésicantes, purifiantes et irritantes pour la peau. Il soulage les démangeaisons et les verrues, et sa poudre apaise les maux de dents. La note de bas de page de l'éditeur indique son nom: warad al-habb."
  tr: "Dioskoridlerin dört türü vardır; hepsi sıcak, kuru ve ikincisi keskin, ülserli ve cilde tiksindiricidir. Uyuz ve siğilleri giderir, diş gıcırdatma için faydalıdır."
  id: "Dioscorides memiliki empat jenis, semuanya panas, kering, dan yang kedua tajam, borok, dan menjijikkan bagi kulit. Obat ini menghilangkan kudis dan kutil, serta berguna untuk menggemeretakkan gigi."
