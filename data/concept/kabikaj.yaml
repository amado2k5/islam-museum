  en: "Kabikaj (a plant the editor calls warad al-habb)"
  ur: "کبیکج"
summary:
  ar: "الكبيكج أربعة أنواع عند ديسقوريدوس، كلها حار يابس إلى الثانية، حاد مقرح جلاء لذاع للجلد، ويُقلع الجرب والثاليل، وينفع من ضربان الأسنان."
  en: "Kabikaj is, in Dioscorides' account, of four kinds, all hot and dry to the second degree, sharp, blistering, cleansing and irritant to the skin. It removes itch and warts, and its powder helps the throbbing of the teeth. The editor's footnote gives the name as warad al-habb."
  ur: "کبیکج دیسقوریدوس کے بیان کے مطابق چار قسموں کا ہے، جو سب دوسرے درجے تک گرم اور خشک ہیں، تیز، آبلہ ڈالنے والے، صاف کرنے والے اور جلد میں جلن پیدا کرنے والے ہیں۔ یہ خارش اور مسّوں کو دور کرتا ہے، اور اس کا سفوف دانتوں کی ٹیسیں کم کرتا ہے۔ حاشیے میں اسے ورد الحب لکھا گیا ہے۔"
