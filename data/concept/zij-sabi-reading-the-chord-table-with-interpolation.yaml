label: { ar: "قراءة جدول الأوتار المنصفة بالتفاضل في الزيج الصابي", en: "Reading the half-chord table with interpolation", ur: "منصّف اوتار کے جدول کو تفاضل کے ساتھ پڑھنا", es: "Lectura de la tabla de semicuerdas con interpolación", fr: "Lecture du tableau des demi-accords avec interpolation", tr: "Sabi'i astronomik tablolarında türev alma yoluyla açıortayların tablosunu okuma", id: "Membaca tabel garis bagi dua dengan diferensiasi pada tabel astronomi Sabi'i." }
summary:
  ar: "يعلّم البتاني كيف يُعرف وتر أي درجة من الجداول: فيُطلب العدد في سطر الأعداد المتفاضلة بنصف جزء ويؤخذ ما يقابله من الدرج والدقائق والثواني، وإذا كان مع الدرج دقائق فيؤخذ ما يقابل أقرب الدرج التامة أو أنصافها، ثم يُصحح بتناسب الدقائق الباقية من ثلاثين دقيقة مضروبة في الفضل بين الوترين المتتاليين. {cite:zij-sabi-nallino-byblion pp.19-20}."
  en: "Al-Battani teaches how to find the chord of any degree from the tables: the number is looked up in the row of numbers differing by half a degree and the degrees, minutes and seconds facing it are taken; when the degree carries minutes, the entry facing the nearest whole or half degree is taken and corrected by the share of the remaining minutes out of thirty, multiplied into the difference between the two successive chords. {cite:zij-sabi-nallino-byblion pp.19-20}."
  ur: "البتانی سکھاتے ہیں کہ کسی بھی درجے کا وتر جدولوں سے کیسے معلوم ہو: عدد کو نصف جزء کے فرق والی اعداد کی سطر میں ڈھونڈا جاتا ہے اور اس کے مقابل درجے، دقائق اور ثوانی لیے جاتے ہیں؛ اگر درجے کے ساتھ دقائق ہوں تو قریب ترین پورے یا آدھے درجے کے مقابل اندراج لے کر باقی دقائق کے تیس دقیقوں میں سے حصے کو دو متواتر اوتار کے فرق میں ضرب دے کر درست کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.19-20}۔"
  es: "Al-Battani enseña cómo hallar la cuerda de cualquier grado a partir de las tablas: se busca el número en la fila de números que difieren en medio grado y se toman los grados, minutos y segundos que aparecen frente a él; cuando el grado lleva minutos, se toma la entrada que aparece frente al grado entero o medio grado más cercano y se corrige con la parte proporcional de los minutos restantes de treinta, multiplicada por la diferencia entre las dos cuerdas sucesivas. {cite:zij-sabi-nallino-byblion pp.19-20}."
  fr: "Al-Battani explique comment trouver l'accord correspondant à n'importe quel degré à partir des tables: on consulte la ligne des nombres différant d'un demi-degré et on relève les degrés, minutes et secondes qui lui font face; lorsque le degré comporte des minutes, on relève l'entrée correspondant au degré entier ou au demi-degré le plus proche et on la corrige en fonction de la fraction de minutes restantes sur trente, multipliée par la différence entre les deux accords successifs. {cite:zij-sabi-nallino-byblion pp.19-20}."
  tr: "El-Battani, tablolardaki herhangi bir derecenin kirişini nasıl belirleyeceğini şöyle öğretir: Sayı, diferansiyel sayılar satırında yarım kısım ile bulunur ve buna karşılık gelen derece, dakika ve saniye değeri alınır. Derecelerle birlikte dakikalar da varsa, en yakın tam dereceye veya yarım dereceye karşılık gelen değer alınır, ardından iki ardışık kiriş arasındaki farkla çarpılan otuz dakikadan kalan dakikalar orantılı olarak eklenerek düzeltilir. {cite:zij-sabi-nallino-byblion pp.19-20}."
  id: "Al-Battani mengajarkan cara menentukan tali busur dari derajat apa pun dalam tabel: angka dicari dalam baris angka diferensial dengan setengah bagian, dan nilai yang sesuai dalam derajat, menit, dan detik diambil. Jika ada menit bersama dengan derajat, nilai yang sesuai dengan derajat bulat atau setengah derajat terdekat diambil, kemudian dikoreksi dengan menambahkan secara proporsional sisa menit dari tiga puluh menit dikalikan dengan selisih antara dua tali busur berurutan. {cite:zij-sabi-nallino-byblion pp.19-20}."
