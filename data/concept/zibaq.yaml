label:
  ar: "الزئبق"
  en: "Zibaq (mercury)"
  ur: "زئبق ⁦(پارہ)⁩"
summary:
  ar: "الزئبق يُستخرج من معدنه، أو من حجارته بالنار؛ بارد رطب في الثانية. مصعّده قابض، والمقتول منه يدخل في أدوية القمل والجرب، والمصعّد قاتل، وبخاره يحدث الفالج والرعشة. {cite:canon-ibn-sina-print-v1 p.458}"
  en: "Zibaq is drawn from its ore, or from its stone by fire. Cold and moist in the second degree. Its sublimate is astringent, the killed form enters remedies for lice and scabies, the sublimate is deadly, and its vapour causes palsy and tremor. {cite:canon-ibn-sina-print-v1 p.458}"
  ur: "زئبق اپنی کان سے نکلتا ہے، یا اس کے پتھروں سے آگ کے ذریعے؛ دوسرے درجے میں سرد اور تر۔ اس کا مصعّد قابض ہے، مارا ہوا پارہ جوؤں اور خارش کی دواؤں میں جاتا ہے، مصعّد قاتل ہے، اور اس کی بھاپ فالج اور کپکپی پیدا کرتی ہے۔ {cite:canon-ibn-sina-print-v1 p.458}"
