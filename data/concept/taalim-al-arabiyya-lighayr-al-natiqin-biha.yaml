id: concept/taalim-al-arabiyya-lighayr-al-natiqin-biha
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "تعليم العربية لغير الناطقين بها"
  en: "Teaching Arabic as a foreign language"
  ur: "غیر اہل زبان کو عربی سکھانا"
  fr: "L'enseignement de l'arabe langue étrangère"
  es: "La enseñanza del árabe como lengua extranjera"
summary:
  ar: "ما يقوله ملخص بحثي عن تعليم العربية لغير الناطقين بها اليوم: الانتقال من الترجمة النحوية إلى التعليم التواصلي والطريقة التكاملية كما في «الكتاب»، ومؤسسات مثل معهد اللغة العربية في الجامعة الأمريكية بالقاهرة ومدرسة ميدلبري وقاسد والأزهر، ومقاييس الكفاءة ACTFL وهمزة وALPT وCIMA واختبار ليبزيغ. لم يفتح المتحف الصفحات التي يستشهد بها."
  en: "What a research summary says of teaching Arabic as a foreign language today: the move from grammar-translation to communicative teaching and the integrated approach as in Al-Kitaab, institutions such as the Arabic Language Institute of the American University in Cairo, the Middlebury School of Arabic, Qasid and Al-Azhar, and the proficiency scales ACTFL, Hamzah, ALPT, CIMA and the Leipzig test. The museum did not open the pages it cites."
  ur: "ایک تحقیقی خلاصہ آج غیر اہل زبان کو عربی سکھانے کے بارے میں جو کہتا ہے: قواعد و ترجمہ کے طریقے سے رابطے کی تدریس اور «الکتاب» جیسے مربوط طریقے کی طرف انتقال، قاہرہ کی امریکن یونیورسٹی کے عربی انسٹی ٹیوٹ، مڈلبری کے عربی اسکول، قاسد اور ازہر جیسے ادارے، اور مہارت کے پیمانے ACTFL، ہمزہ، ALPT، CIMA اور لائپزگ کا امتحان۔ عجائب گھر نے جن صفحات کا حوالہ دیا انہیں نہیں کھولا۔"
  fr: "Ce que dit un résumé de recherche de l'enseignement de l'arabe langue étrangère aujourd'hui : le passage de la grammaire-traduction à l'enseignement communicatif et à l'approche intégrée comme dans Al-Kitaab, des institutions comme l'Institut de langue arabe de l'Université américaine du Caire, l'École d'arabe de Middlebury, Qasid et Al-Azhar, et les échelles de compétence ACTFL, Hamzah, ALPT, CIMA et le test de Leipzig. Le musée n'a pas ouvert les pages qu'il cite."
  es: "Lo que dice un resumen de investigación sobre la enseñanza del árabe como lengua extranjera hoy: el paso de la gramática-traducción a la enseñanza comunicativa y al enfoque integrado como en Al-Kitaab, instituciones como el Instituto de Lengua Árabe de la Universidad Americana de El Cairo, la Escuela de Árabe de Middlebury, Qasid y Al-Azhar, y las escalas de competencia ACTFL, Hamzah, ALPT, CIMA y la prueba de Leipzig. El museo no abrió las páginas que cita."
