summary:
  ar: "علامات أوقاته إذا لم يكن نفث أو كان النفث رقيقاً أو قليلاً أو الذي يسمى بزاقاً فهو الابتداء، وما تزداد الأعراض فيه ويزداد النفث ويأخذ في الرقة ويزداد في الخثورة وفي السهولة ويأخذ في الحمرة إن كانت إلى الاصفرار المناسب للحمرة فهو الازدياد، ثم إذا نفث العليل نفثاً سهلاً نضجاً على ما ذكر من النضج ويكون كثيراً ويكون الوجع خفيفاً فذلك هو وقت المنتهى ووقت موافاة النضج التام، ثم إذا أخذ النفث ينقص مع ذلك القوام وتلك السهولة ومع عدم الوجع ونقصان الأعراض فقد انحط، فإذا احتبس النفث عن زوال الأعراض البتة فقد انتهى الانحطاط، وعلامات أصنافه بحسب أسبابه أن النفث إذا كان إلى الحمرة دل على الدم وإذا كان إلى الصفرة دل على الصفراء والأشقر يدل على اجتماعهما وإذا كان إلى البياض ولم يكن للنضج دل على البلغم وإذا كان إلى السواد والكمودة ولم يكن لسبب صابغ من خارج دل على السوداء، وأيضاً فإن الوجع في البلغم والسوداء في أكثر الأمر يكون منسفلاً وإلى اللين وفي الآخرين متصعداً ملتهباً وأيضاً فإن الحمى إن كانت شديدة كانت من مواد حارة وإن كانت غير شديدة كانت من مواد إلى البرد ما هي وربما دلت بالنوائب دلالة جيدة، وعلامات انتقاله أنه إذا لم ينفث نفثاً محموداً سريعاً ولم يستنشق في أربعة عشر يوماً فقد انتقل إلى الجمع ويدل على ابتدائه في تصعده شدة الوجع وعسر النفس وضيقه وتضاغطه عند البسط مع صغر وشدة الحمى وخشونة اللسان خاصة ويبس السعال لتلزج المادة وكثافة الحجاب وضعف القوة وسقوط الشهوة والأخلاط والسهر ويقل نخسه في ذلك الموضع، وإذا جمع وتم الجمع سكنت الحمى والوجع وازداد الثقل فإذا انفجر عرض نافض مختلف واستعراض نبض مع اختلافه وتسقط القوة ويذبل النفس، وكثيراً ما تعرض حمى شديدة للذع المدة للأعضاء ولذع الورم فإذا انفجر ثم لم يستنق من يوم الانفجار إلى أربعين يوماً أدى إلى السل وانفجار المتقيح في اليوم السابع وأبعده في الأقل وأكثره بعد ذلك إلى العشرين والأربعين والستين، وكلما كانت عوارض الجمع أشد كان الانفجار أسرع وكلما كانت ألين كان الانفجار أبطأ وخصوصاً الحمى من جملة العوارض، وإذا ظهرت العلامات الظاهرة الهائلة وقد شوهدت دلائل محمودة في النفث وغيره فلا يجزع كل الجزع فإن عروضها بسبب الجمع لا بسبب آخر، وكل ذات جنب لا يسكن وجعه بنفث ولا فصد ولا إسهال ولا غير ذلك فتوقع منه تقيحاً أو قتلاً قبله بحسب سائر الدلائل، وإذا رؤي النبض يشتد تمدده وخصوصاً إذا اشتد تواتره فإن ذلك ينذر إن كانت القوة قوية بأنه ينتقل إلى ذات الرئة وإن سكن الوجع بنفث أو إسهال أو فصد وتكميد فهو آيل إلى التقيح، وأما إن لم تكن دلائل السلامة من ثبات القوة وثبات الشهوة وغير ذلك فإن ذلك ينذر بأنه قاتل وينذر بالغشي أولاً على أن الشهوة تسقط في أكثر الأمر عند الانفجار وتحمر الوجنتان لما يتصاعد إليهما من البخار وتسخن الأصابع لذلك أيضاً، وإذا انفجر إلى فضاء الصدر أوهم الخفة أياماً ثم يسوؤه حاله وإذا انفجر رؤي النبض على ما حكي قد ضعف واستعرض وأبطأ وتفاوت لانحلال القوة بالاستفراغ وانطفاء الحرارة الغريزية، ويعرض أيضاً نافض يتبعه حمى بسبب لذع الأخلاط فإن كانت المادة من المنفجر كثيرة والقوة ضعيفة أدت إلى الهلاك، واعلم أنه إذا كانت القوة ضعيفة واشتد التمدد والتواتر فإن ذلك ينذر بالغشي وإن كان التواتر دون ذلك ودون ما يوجبه نفس ذات الجنب فربما أنذر بالسبات أو التشنج أو بطء النضج وإنما يحدث السبات لقبول الدماغ الأبخرة الرطبة التي ليست بتلك الحادة وإلا لتواتر النبض قبولاً مع ضعفه عن دفعها في الأعصاب ويدل على بطء التقيح لغلظ المادة ولأنها ليست تنتقل وأن الدماغ والأعصاب قوية لا تقبله، وربما أنذرت بالتشنج وذلك إذا كان النفس يشتد ضيقه اشتداداً والحمى ليست بقوية، وإذا رؤيت العلة قد سكنت يسيراً وخفت ولم يكن هناك نفث فربما انتقصت المادة ببول أو براز وظهر اختلاف مراري رقيق أو ظهر بول غليظ فإن لم ير ذلك فسيظهر خراج فإن رؤي تمدد في المراق والشراسيف وحرارة وثقل أنذر ذلك بخراج عند الأربتين أو إلى الساقين وميله إلى الساقين شديد الدلالة على السلامة وفي مثل هذا يأمر أبقراط بالاستسهال بدواء من هذا الجنس ⁦(قول منسوب إليه والاسم مستثنى)⁩، فإن رؤي مع ذلك عسر نفس وضيق صدر وصداع وثقل في الترقوة والثدي والساعد وحرارة إلى فوق أنذر ذلك بميل المادة إلى ناحية الأذنين والرأس فإن كانت الحالة هذه ولم يظهر ورم ولا خراج في هذه الناحية فإن المادة تميل إلى الدماغ {cite:canon-ibn-sina-print-v2 p.346}"
  en: "The signs of its times: if there is no expectoration, or it is thin, little, or what is called saliva, that is the beginning; what the symptoms increase in, and the expectoration increases and grows thinner, then increases in thickness and in ease and takes on redness if it is toward the yellowing suitable to redness — that is the increase; then if the patient expectorates an easy, ripe expectoration on the described ripeness, copious, the pain light, that is the time of the end and of the full ripeness's arrival; then if the expectoration starts lessening with that consistency and ease, with the pain absent and the symptoms declining, it has descended; if the expectoration is withheld at the symptoms' entire removal, the descent has ended. The signs of its kinds by their causes: if the expectoration is toward redness it indicates blood, if toward yellowness it indicates yellow bile, the blond indicates their joining; if toward whiteness without being ripe it indicates phlegm; if toward blackness and duskiness, with no external dyeing cause, it indicates melancholy. And the pain in the phlegm and melancholy kinds is mostly downward and toward softness, in the other two ascending and inflamed; and the fever, if severe, is of hot matters, if not severe, of matters inclining to cold, and the paroxysms may give a good indication. The signs of its transition: if he does not expectorate a praised quick expectoration nor is relieved in fourteen days, it has passed into collection; its beginning in its ascent is indicated by the pain's severity, breath's hardness and narrowness and its tightness at expansion, with smallness and severity of the fever, the tongue's roughness especially, the cough's dryness for the matter's sticking, the diaphragm's density, the power's weakness, the appetite's fall, the humours and sleeplessness, and its pricking lessens in that place. If it collects and the collection completes, the fever and pain settle and the heaviness grows; when it bursts there arises a differing rigor and a pulse-disorder with its difference, the power falls and the breath withers. Often a severe fever arises for the pus's stinging the organs and the tumour's stinging; if it bursts then is not cleansed from the burst's day to forty days it leads to consumption; and the suppurated one's bursting is on the seventh day at soonest, mostly after that to the twentieth, fortieth and sixtieth. The severer the collection's concomitants the quicker the bursting, the milder the slower, especially the fever among the concomitants; and if the terrible apparent signs appear while praised indications in the expectoration and otherwise were seen, do not despair utterly — their arising is for the collection, not another cause. Every pleurisy whose pain is stilled neither by expectoration, venesection, diarrhoea nor otherwise is to be expected to suppurate or to kill before that, by the rest of the indications. If the pulse's stretching is seen intensifying, especially if its frequency intensifies, that warns — if the power is strong — that it passes into peripneumonia; and if the pain is stilled by expectoration, diarrhoea, venesection or compresses, it is on its way to suppuration; but if the safety indications of the power's and appetite's firmness and the rest are absent, that warns it is fatal and warns of syncope first — though the appetite falls mostly at the bursting, and the cheeks redden for the vapour rising to them and the fingers heat for that too. If it bursts into the chest's hollow it gives a false lightness for days, then his state worsens; when it has burst the pulse is seen, as told, weakened, disordered, slowed and uneven for the power's dissolving by the evacuation and the innate heat's quenching. There may also arise, as said, a rigor followed by fever for the humours' stinging; if the matter of the burst is copious and the power weak, it leads to destruction. And know that if the power is weak and the stretching and frequency intensify, that warns of syncope; if the frequency is below that and below what pleurisy itself requires, it may warn of the coma-vigil, or convulsion, or slow ripening — the coma arises for the brain's accepting the moist vapours, which are not that sharp else the pulse would frequent, accepting them while too weak to push them into the nerves; and it indicates slow suppuration for the matter's thickness, that it does not pass on, and that the brain and nerves are strong and do not accept it. It may warn of convulsion when the breath's narrowness intensifies greatly while the fever is not strong. If the affliction is seen to settle a little and lighten without expectoration, the matter may have lessened by urine or stool — a thin bilious irregularity appearing, or a thick urine; if that is not seen, an abscess will appear. If a stretching, heat and heaviness are seen in the hypochondrium and false ribs, that warns of an abscess at the armpits or toward the shanks — and its inclining to the shanks strongly indicates safety; and in such a case Hippocrates orders easing by a drug of this kind (a saying attributed to him, the name excluded). If with that there are seen breath's hardness, chest's narrowness, headache, heaviness in the collarbone, the breast and the forearm, and a heat above, that warns of the matter's inclining toward the ears' and head's region; if the state is thus and no tumour or abscess appears in that region, the matter is inclining to the brain {cite:canon-ibn-sina-print-v2 p.346}"
  fr: >-
    Selon Ibn Sina, l’absence d’expectoration ou une expectoration fluide, peu abondante ou de la nature de
    ce qu’on appelle salive signalent le début. Quand les symptômes augmentent et que l’expectoration devient
    plus abondante et plus fluide, puis plus épaisse et plus facile, et qu’elle rougit si elle tendait vers
    un jaune voisin du rouge, c’est la phase d’aggravation. Si le malade expectore ensuite facilement et
    abondamment une matière parvenue au degré de maturation décrit, avec une douleur faible, c’est la phase
    où le mal atteint son terme et la maturation est complète. Puis, si l’expectoration commence à diminuer
    tout en gardant sa consistance et sa facilité, sans douleur et avec des symptômes qui déclinent, le mal
    est entré dans sa phase de déclin. Si l’expectoration cesse quand les symptômes ont entièrement disparu,
    le déclin est achevé. Les formes se reconnaissent à leurs causes : une expectoration qui tire sur le
    rouge indique le sang ; sur le jaune, la bile jaune ; une teinte blonde indique leur mélange ; si elle
    blanchit sans avoir mûri, elle indique le flegme ; si elle tire sur le noir ou le sombre, sans cause
    colorante externe, elle indique l’humeur mélancolique. Dans les formes flegmatique et mélancolique, la
    douleur s’oriente le plus souvent vers le bas et tend à être sourde ; dans les deux autres, elle monte et
    brûle. Une fièvre forte relève des matières chaudes, une fièvre moins forte des matières qui tendent au
    froid ; les accès peuvent donner de bonnes indications. Quant aux signes d’évolution, si le malade n’a
    pas une expectoration prompte et de bon augure ou n’est pas soulagé en quatorze jours, la maladie évolue
    vers une collection. Le début de cette évolution, dans sa phase ascendante, se reconnaît à la violence de
    la douleur, à la difficulté et à l’étroitesse du souffle, à l’oppression quand la poitrine se dilate,
    ainsi qu’à une fièvre de faible ampleur mais sévère, surtout à la rugosité de la langue, à la sécheresse
    de la toux parce que la matière adhère, à la densité du diaphragme, à la faiblesse de la faculté, à la
    perte d’appétit, aux humeurs et à l’insomnie. La douleur piquante diminue à cet endroit. Quand la matière
    s’amasse et que la collection est complète, la fièvre et la douleur s’apaisent et la pesanteur augmente.
    À sa rupture, surviennent un frisson inégal et un dérèglement du pouls qui varie avec lui ; la faculté
    décline et le souffle faiblit. Souvent une forte fièvre survient parce que le pus irrite les organes et
    que la tuméfaction les pique. Si la collection se rompt et ne s’évacue pas entièrement au bout de
    quarante jours à compter de la rupture, elle conduit à la consomption. La rupture de la collection
    suppurée survient au plus tôt le septième jour, le plus souvent plus tard, jusqu’au vingtième, au
    quarantième ou au soixantième jour. Plus les manifestations qui accompagnent la collection sont sévères,
    plus la rupture est rapide ; plus elles sont bénignes, plus elle est lente, surtout s’il s’agit de la
    fièvre. Si des signes apparents alarmants surviennent alors qu’on a observé des indices favorables dans
    l’expectoration ou ailleurs, Ibn Sina dit qu’il n’y a pas lieu de désespérer entièrement : ils tiennent à
    la collection, non à une autre cause. Toute pleurésie dont la douleur n’est apaisée ni par
    l’expectoration, ni par la saignée, ni par la diarrhée, ni autrement risque de suppurer ou d’être
    mortelle avant cela, d’après les autres indices. Si le pouls se tend davantage, surtout s’il devient plus
    fréquent, cela annonce, si la faculté est forte, le passage à la péripneumonie. Si l’expectoration, la
    diarrhée, la saignée ou les compresses apaisent la douleur, la pleurésie évolue vers la suppuration. Mais
    si les signes favorables, dont la vigueur de la faculté et le maintien de l’appétit, font défaut, ils
    laissent présager une issue mortelle précédée de syncope. L’appétit baisse surtout au moment de la
    rupture, les joues rougissent sous l’effet de la vapeur qui y monte et les doigts s’échauffent pour la
    même raison. Si la collection se rompt dans la cavité thoracique, elle donne une fausse impression de
    soulagement pendant quelques jours, puis l’état du malade empire. Après la rupture, comme indiqué, le
    pouls s’affaiblit, se dérègle, ralentit et devient inégal, parce que l’évacuation dissipe la faculté et
    que la chaleur innée s’éteint. Comme on l’a dit, un frisson suivi de fièvre peut aussi survenir, parce
    que les humeurs irritent les organes. Si la matière libérée est abondante et la faculté faible, l’issue
    est fatale. Si la faculté est faible et que la tension et la fréquence du pouls augmentent, c’est un
    signe avant-coureur de syncope. Si sa fréquence est moindre, et inférieure à celle que la pleurésie
    elle-même devrait produire, elle peut annoncer un coma vigile, des convulsions ou une maturation lente.
    Le coma naît de ce que le cerveau reçoit des vapeurs humides, qui ne sont pas assez âcres pour accélérer
    le pouls, et qu’il est trop faible pour les repousser dans les nerfs. Une suppuration lente est indiquée
    par l’épaisseur de la matière, qui ne se déplace pas, et par la force du cerveau et des nerfs, qui ne la
    reçoivent pas. Des convulsions peuvent être annoncées lorsque le souffle se resserre beaucoup sans que la
    fièvre soit forte. Si le mal paraît un peu se calmer et s’alléger sans expectoration, la matière a pu
    diminuer par les urines ou les selles : on voit alors un dérèglement bilieux avec des selles fluides, ou
    des urines épaisses. Si rien de tel ne se voit, un abcès apparaîtra. Si l’on observe une tension, de la
    chaleur et une pesanteur à l’hypocondre et aux fausses côtes, cela annonce un abcès aux aisselles ou vers
    le bas des jambes. Le déplacement vers les jambes est un signe particulièrement favorable. Dans ce cas,
    Hippocrate préconise de soulager à l’aide d’un médicament de ce genre (propos qui lui est attribué ; le
    nom n’est pas repris). Si l’on observe aussi une respiration difficile, une oppression de la poitrine,
    une céphalée, une pesanteur à la clavicule, à la poitrine et à l’avant-bras, et une chaleur dans le haut
    du corps, cela annonce que la matière se porte vers la région des oreilles et de la tête. Si, dans cet
    état, il n’apparaît aucune tuméfaction ni aucun abcès dans cette région, la matière se dirige vers le
    cerveau {cite:canon-ibn-sina-print-v2 p.346}.
  ur: "اوقات کی علامتیں: اگر نفث نہ ہو یا پتلا ہو یا کم ہو یا وہ جسے رال کہتے ہیں تو یہ ابتدا ہے؛ جس میں علامتیں بڑھیں اور نفث بڑھے اور پتلا ہوتا جائے پھر گاڑھا اور آسان ہوتا جائے اور سرخی آئے اگر وہ زردی کی طرف ہو جو سرخی کو لائق ہے تو یہ بڑھوتری ہے؛ پھر اگر مریض آسان پکا ہوا کثیر نفث کرے مذکورہ پکاوٹ پر اور درد ہلکا ہو تو وہ انتہا اور کامل پکاوٹ کے پہنچنے کا وقت ہے؛ پھر اگر نفث اسی قوام اور آسانی کے ساتھ کم ہونے لگے اور درد نہ ہو اور علامتیں گھٹیں تو زوال ہے؛ اگر علامتیں بالکل مٹنے پر نفث رک جائے تو زوال مکمل ہوا؛ اسباب کے حساب سے اقسام کی علامتیں: نفث سرخی کی طرف ہو تو خون کی دلیل زردی کی طرف ہو تو صفرا کی اور مائل دونوں کے ملنے کی سفیدی کی طرف ہو اور پکا نہ ہو تو بلغم کی اور سیاہی اور مدہمی کی طرف ہو بغیر بیرونی رنگ دینے والے سبب کے تو سودا کی؛ اور بلغم اور سودا میں درد اکثر نیچے اور نرمی کی طرف ہوتا ہے اور دوسرے دونوں میں اوپر اور جلتا ہوا؛ اور بخار شدید ہو تو گرم مادوں سے نہ شدید ہو تو ٹھنڈ کی طرف مائل مادوں سے اور نوبے اچھی دلالت دے سکتے ہیں؛ انتقال کی علامتیں: اگر چودہ دن میں نہ اچھا جلد نفث ہو نہ راحت ملے تو جمع ہونے کی طرف گیا؛ ابتدا کی دلیل درد کی شدت سانس کی دقت اور تنگی اور پھیلاؤ پر گھٹنا بخار کا چھوٹا اور شدید ہونا خاص طور پر زبان کی خشونی مادے کے چپچپے سے کھانسی کی خشکی حجاب کی گاڑھی قوت کی کمزوری شہوت کا گرنا اخلاط اور بیداری اور اس مقام پر چبھن کم ہو جانا؛ جب جمع ہو اور مکمل ہو جائے تو بخار اور درد ٹھہر جائیں اور گرانی بڑھے جب پھٹے تو مختلف نافض اور نبض کا اختلال اس کے اختلاف کے ساتھ قوت گرے اور سانس مرجھائے؛ اکثر شدید بخار آتا ہے مدّہ کے اعضا اور ورم کو چبھنے سے اگر پھٹے پھر پھٹنے کے دن سے چالیس دن تک صاف نہ ہو تو سل کی طرف جاتا ہے اور متقیح کا پھٹنا جلد سے جلد ساتویں دن اکثر اس کے بعد بیسویں چالیسویں اور ساٹھویں؛ جتنی سخت جمع کی علامتیں اتنا جلد پھٹنا اور جتنی نرم اتنا دیر سے خاص طور پر بخار ان علامتوں میں؛ اور اگر خوفناک ظاہری علامتیں آئیں اور پہلے نفث وغیرہ میں اچھی دلیلیں دیکھی گئی ہوں تو بالکل مایوس نہ ہو ان کا ہونا جمع ہونے کی وجہ سے ہے نہ اور سبب سے؛ اور ہر وہ ذات الجنب جس کا درد نہ نفث سے نہ فصد سے نہ اسہال سے نہ کسی اور سے ٹھہرے تو اس سے تقيح یا اس سے پہلے ہلاکت کی توقع کرے باقی دلائل کے مطابق؛ اگر نبض کا کھنچنا بڑھتا دیکھے خاص طور پر اس کا تواتر اور قوت قوی ہو تو یہ ذات الرئة میں بدلنے کی پیشگوئی ہے اور اگر درد نفث یا اسہال یا فصد یا کمید سے ٹھہر جائے تو تقيح کی طرف جا رہی ہے؛ اور اگر قوت اور شہوت کی ثبات وغیرہ جیسی سلامت کی دلیلیں نہ ہوں تو ہلاکت بخش ہونے کی اور پہلے غشی کی پیشگوئی ہے اگرچہ شہوت اکثر پھٹنے پر گرتی ہے اور رخسار اس بخار سے سرخ ہوتے ہیں جو ان تک چڑھتا ہے اور انگلیاں بھی اسی سے گرم ہوتی ہیں؛ اگر سینے کی خلا میں پھٹے تو کئی دن جھوٹی ہلکاہٹ دکھائے پھر حال بگڑے اور پھٹنے پر نبض بیان کے مطابق کمزور بے ترتیب سست اور مختلف ہوتی ہے استفراغ سے قوت کے گھلنے اور فطری حرارت کے بجھنے سے؛ اور نافض بھی آ سکتا ہے جس کے بعد بخار ہو اخلاط کے چبھنے سے اگر منفجر کا مادہ کثیر ہو اور قوت کمزور تو ہلاکت تک پہنچاتا ہے؛ اور جان لو اگر قوت کمزور ہو اور کھنچاؤ اور تواتر سخت ہو تو غشی کی پیشگوئی اور اگر تواتر اس سے اور ذات الجنب کے مطلوب سے کم ہو تو شاید سبات یا تشنج یا دھیلے پکنے کی پیشگوئی ہو سبات دماغ کے تر بخارات قبول کرنے سے ہوتا ہے جو اتنے تیز نہیں ورنہ نبض تیز ہوتی قبول تو کرتا ہے مگر اعصاب میں دھکیلنے سے عاجز اور یہ دھیلے تقيح کی دلیل ہے مادے کی گاڑھی اور اس کے نہ منتقل ہونے کی اور دماغ و اعصاب کے قوی ہونے کی جو قبول نہیں کرتے؛ اور تشنج کی پیشگوئی ہو سکتی ہے جب سانس کی تنگی بہت سخت ہو اور بخار قوی نہ ہو؛ اگر علت تھوڑی ٹھہرتی اور ہلکی ہوتی دیکھے اور نفث نہ ہو تو شاید مادہ پیشاب یا براز سے گھٹا ہو پتلی صفراوی اختلاف یا گاڑھا پیشاب ظاہر ہو اگر نہ دیکھے تو خراج ظاہر ہوگا اگر مراق اور نازک پسلیوں میں کھنچاؤ گرمی اور بھاری دیکھے تو بغلوں یا پنڈلیوں کی طرف خراج کی پیشگوئی اور اس کا پنڈلیوں کی طرف جھکنا سلامت کی بہت مضبوط دلیل ہے اور ایسے میں ابقراط اسی جنس کی دواء سے تسہیل کا حکم دیتا ہے ⁦(اس سے منسوب قول نام مستثنیٰ)⁩؛ پھر اگر اس کے ساتھ عسر نفس سینے کی تنگی سر درد ترقوے چھاتی اور بازو میں بھاری اور اوپر حرارت ہو تو مادے کے کانوں اور سر کی طرف جھکنے کی پیشگوئی ہے اگر یہ حال ہو اور اس طرف نہ ورم نہ خراج ظاہر ہو تو مادہ دماغ کی طرف جھک رہا ہے {cite:canon-ibn-sina-print-v2 p.346}"
  es: "Los signos de sus tiempos: si no hay expectoración, o es delgada, poca, o lo que se llama saliva, ese es el comienzo; en lo que aumentan los síntomas, y la expectoración aumenta y se vuelve más delgada, luego aumenta en espesor y facilidad y toma enrojecimiento si tiende al amarilleamiento adecuado para el enrojecimiento, ese es el aumento; luego si el paciente expectora una expectoración fácil, madura en la madurez descrita, copiosa, el dolor leve, ese es el tiempo del final y de la llegada de la madurez completa; luego si la expectoración comienza a disminuir con esa consistencia y facilidad, con el dolor ausente y los síntomas disminuyendo, ha descendido; si la expectoración se retiene al eliminarse por completo los síntomas, el descenso ha terminado. Los signos de sus tipos por sus causas: si la expectoración tiende al enrojecimiento indica sangre, si tiende al amarilleamiento indica bilis amarilla, el rubio indica su unión; si tiende al blanquecino sin estar madura indica flema; Si se dirige hacia la oscuridad y la penumbra, sin causa de tinción externa, indica melancolía. Y el dolor en los tipos de flema y melancolía es mayormente descendente y hacia la suavidad, en los otros dos ascendente e inflamado; y la fiebre, si es severa, es de sustancias calientes, si no es severa, de sustancias que tienden al frío, y los paroxismos pueden dar una buena indicación. Los signos de su transición: si no expectora una expectoración rápida y elogiada ni se alivia en catorce días, ha pasado a la acumulación; su comienzo en su ascenso está indicado por la severidad del dolor, la dureza y estrechez de la respiración y su opresión al expandirla, con pequeña y severa fiebre, la aspereza de la lengua especialmente, la sequedad de la tos por la materia pegajosa, la densidad del diafragma, la debilidad de la fuerza, la caída del apetito, los humores y el insomnio, y su picazón disminuye en ese lugar. Si se acumula y la acumulación se completa, la fiebre y el dolor se calman y la pesadez aumenta; cuando se rompe surge un rigor diferente y un trastorno del pulso con su diferencia, la fuerza disminuye y la respiración se debilita. A menudo surge una fiebre alta por el escozor del pus en los órganos y el escozor del tumor; si se rompe y no se limpia desde el día de la rotura hasta los cuarenta días conduce a la tisis; y la rotura de la supurante es el séptimo día como muy pronto, generalmente después de eso hasta el vigésimo, cuadragésimo y sexagésimo. Cuanto más graves sean los concomitantes de la acumulación, más rápido se romperá, cuanto más leves, más lento, especialmente la fiebre entre los concomitantes; y si aparecen terribles signos aparentes mientras se observaban indicaciones alabadas en la expectoración y de otra manera, no desespere por completo: su aparición se debe a la acumulación, no a otra causa. Toda pleuresía cuyo dolor no se calma con expectoración, flebotomía, diarrea ni de ninguna otra manera, es de esperar que supure o sea mortal antes, según el resto de las indicaciones. Si se observa que el estiramiento del pulso se intensifica, especialmente si su frecuencia aumenta, eso advierte —si la fuerza es fuerte— que está pasando a perineumonía; y si el dolor se calma con expectoración, diarrea, flebotomía o compresas, está en camino a la supuración; pero si faltan las indicaciones de seguridad de la firmeza de la fuerza y el apetito y el resto, eso advierte que es fatal y advierte primero de síncope —aunque el apetito disminuye principalmente al estallar, y las mejillas se enrojecen por el vapor que sube hacia ellas y los dedos también se calientan por eso. Si estalla en la cavidad del pecho da una falsa ligereza durante días, luego su estado empeora; Cuando se produce la ruptura, el pulso se observa, como se ha dicho, debilitado, desordenado, lento e irregular debido a la disolución de la fuerza por la evacuación y la extinción del calor interno. También puede aparecer, como se ha dicho, un escalofrío seguido de fiebre por el ardor de los humores; si la materia de la ruptura es copiosa y la fuerza débil, conduce a la destrucción. Y sepa que si la fuerza es débil y la distensión y la frecuencia se intensifican, eso advierte de un síncope; si la frecuencia es inferior a eso y a lo que requiere la pleuresía misma, puede advertir de coma-vigilia, o convulsión, o maduración lenta: el coma surge porque el cerebro acepta los vapores húmedos, que no son tan agudos de otro modo el pulso se aceleraría, aceptándolos cuando está demasiado débil para impulsarlos hacia los nervios; e indica supuración lenta por la consistencia de la materia, que no se expulsa, y que el cerebro y los nervios son fuertes y no la aceptan. Puede advertir de convulsiones cuando la dificultad para respirar se intensifica mucho mientras la fiebre no es fuerte. Si se observa que la aflicción se calma un poco y se aligera sin expectoración, la materia puede haber disminuido con la orina o las heces: aparece una irregularidad biliar delgada, o una orina espesa; si no se observa eso, aparecerá un absceso. Si se observa estiramiento, calor y pesadez en el hipocondrio y las costillas falsas, eso advierte de un absceso en las axilas o hacia las piernas, y su inclinación hacia las piernas indica fuertemente seguridad; y en tal caso Hipócrates ordena aliviar con un medicamento de este tipo (un dicho que se le atribuye, se omite el nombre). Si con eso se observan dificultad para respirar, estrechez del pecho, dolor de cabeza, pesadez en la clavícula, el pecho y el antebrazo, y calor arriba, eso advierte de que la materia se inclina hacia la región de las orejas y la cabeza; Si el estado es así y no aparece ningún tumor o absceso en esa región, el asunto tiende a ser cerebral {cite:canon-ibn-sina-print-v2 p.346}"
