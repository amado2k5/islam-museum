id: concept/ilzam
class: concept
kind: legal
label: { ar: "الإلزام", en: "Ilzam (imposing an obligation on another)" }
summary:
  ar: "الإلزام في اللغة الإثبات والإدامة، وهو إيجاب الشيء على الغير، ويفترق عن الإيجاب والإجبار والالتزام، فالالتزام إلزام الشخص نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3321}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322} والأصل امتناع إلزام الناس بعضهم لبعض، وإنما يكون من الإمام أو القاضي بالولاية، فيجب عليه إلزام الناس بشريعة الإسلام، ومن امتنع من حقوق الآدميين أخذت منه جبرا، وإلزام الظلم حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}"
  en: "Ilzam is establishing and maintaining; it is making a thing binding on another, and it differs from iyjab (obligation by order) and ikrah (compulsion) and iltizam (binding oneself). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3321}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322} In principle one person may not impose on another, and compulsion comes from God or from the authority of the ruler, who must enforce the Law; whoever refuses a right owed to people is compelled to pay, and imposing injustice is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}"
