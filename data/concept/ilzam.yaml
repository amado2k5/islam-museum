id: concept/ilzam
class: concept
kind: legal
label: { ar: "الإلزام", en: "Ilzam (imposing an obligation on another)", es: "Ilzam (imponer una obligación a otro)", fr: "Ilzam (imposer une obligation à autrui)", ur: "الزم ⁦(دوسرے پر فرض عائد کرنا)⁩" }
summary:
  ar: "الإلزام في اللغة الإثبات والإدامة، وهو إيجاب الشيء على الغير، ويفترق عن الإيجاب والإجبار والالتزام، فالالتزام إلزام الشخص نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3321}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322} والأصل امتناع إلزام الناس بعضهم لبعض، وإنما يكون من الإمام أو القاضي بالولاية، فيجب عليه إلزام الناس بشريعة الإسلام، ومن امتنع من حقوق الآدميين أخذت منه جبرا، وإلزام الظلم حرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}"
  en: "Ilzam is establishing and maintaining; it is making a thing binding on another, and it differs from iyjab (obligation by order) and ikrah (compulsion) and iltizam (binding oneself). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3321}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322} In principle one person may not impose on another, and compulsion comes from God or from the authority of the ruler, who must enforce the Law; whoever refuses a right owed to people is compelled to pay, and imposing injustice is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}"
  es: "Ilzam es establecer y mantener; es hacer que algo sea vinculante para otro, y difiere de iyjab (obligación por orden), ikrah (coacción) e iltizam (autoobligación). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3321}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322} En principio, una persona no puede imponerse a otra, y la coacción proviene de Dios o de la autoridad del gobernante, quien debe hacer cumplir la Ley; quien niega un derecho debido a las personas está obligado a pagarlo, e imponer injusticia está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}"
  fr: "Ilzam consiste à établir et à maintenir; il s'agit de rendre une chose obligatoire pour autrui, et cela diffère de iyjab (obligation par ordre), d'ikrah (contrainte) et d'iltizam (s'engager soi-même). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3321}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322} En principe, nul ne peut imposer quoi que ce soit à autrui, et la contrainte émane de Dieu ou de l'autorité du souverain, qui doit faire appliquer la Loi; quiconque refuse un droit dû à autrui est tenu de s'en acquitter, et imposer l'injustice est interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3322}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3323}"
  ur: "Ilzam قائم اور برقرار ہے؛ یہ ایک چیز کو دوسری چیز کا پابند بنا رہا ہے، اور یہ اعجاب ⁦(حکم کے لحاظ سے فرض)⁩ اور اکراہ ⁦(مجبوری)⁩ اور التزام ⁦(خود کو پابند کرنے)⁩ سے مختلف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3321}{cite:fiqh-masua-kuwaitiyya-noor-v3 p.3322} اصولی طور پر ایک شخص دوسرے پر مسلط نہیں ہو سکتا، اور مجبوری خدا کی طرف سے یا حاکم کی طرف سے آتی ہے، جسے قانون کو نافذ کرنا چاہیے۔ جو شخص لوگوں کے واجب الادا حق سے انکار کرتا ہے وہ ادا کرنے پر مجبور ہے، اور ظلم کرنا حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3322}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3323}"
