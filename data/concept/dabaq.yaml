summary:
  fr: "Connu. Son fruit ressemble à un pois chiche noir, non rond, ridé et brisé, et colle à la main. Il pousse sur les chênes, pommiers et poiriers et possède une grande force aqueuse et aérienne. Chaud et sec au troisième degré, il dissout les humeurs épaisses, ramollit les vieux ulcères, aide contre les tuméfactions froides et l'urticaire et, avec la chaux, dissout la rate {cite:canon-ibn-sina-print-v1 p.434} {cite:canon-ibn-sina-print-v1 p.435}."
  ar: "معروف، وثمرته كالحمص الأسود غير المستدير، متغضّن ومتكسّر، تلتصق منه اليد، ومعدنه البلوط والتفاح والكمثرى، وفيه قوة مائية وهوائية كبيرة. حار يابس في الثالثة، محلّل للرطوبات الغليظة، ويليّن القروح العتيقة، وينفع الأورام الباردة والشرى، ويحلل الطحال مع النورة {cite:canon-ibn-sina-print-v1 p.434} {cite:canon-ibn-sina-print-v1 p.435}."
  en: "Known. Its fruit is like black chickpea, not round, wrinkled and broken, and sticks to the hand. It grows on oak, apple and pear trees and has great watery and airy strength. Hot and dry in the third degree; it dissolves thick humours, softens old ulcers and helps cold swellings and urticaria, and with lime it dissolves the spleen {cite:canon-ibn-sina-print-v1 p.434} {cite:canon-ibn-sina-print-v1 p.435}."
  ur: "معروف ہے؛ اس کا پھل سیاہ چنے جیسا ہے، گول نہیں، جھریوں دار اور ٹوٹا ہوا، اور چھونے سے ہاتھ کو چپکتا ہے۔ یہ بلوط، سیب اور ناشپاتی کے درختوں میں ہوتا ہے اور اس میں بڑی آبی اور ہوائی قوت ہے۔ تیسرے درجے میں گرم اور خشک؛ گاڑھی رطوبتوں کو تحلیل کرتا ہے، پرانے زخموں کو نرم کرتا ہے، ٹھنڈی سوجن اور شرا میں مفید ہے، اور چونے کے ساتھ تلی کو تحلیل کرتا ہے {cite:canon-ibn-sina-print-v1 p.434} {cite:canon-ibn-sina-print-v1 p.435}۔"
