- tradition: sunni
  id: independent-academies
  stance:
    ar: "مع المجامع — بشرط استقلالها عن الحكومات"
    en: "For academies — on condition of their independence from governments"
  summary:
    ar: "مال أستاذ للفقه وأصوله إلى المجامع ولجان الفتوى بشرط أن تكون مستقلة في مالها وإدارتها ورأيها، غير تابعة للحكومات ولا للإدارات الأمنية، وضرب مثلاً بالاتحاد العالمي لعلماء المسلمين بوصفه غير تابع لحكومة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:05:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:06:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:06:30} وردّ عضو مجمع الفقه بأن الظن بأن الحكام يملون على المجامع توهّم. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:10:00}"
