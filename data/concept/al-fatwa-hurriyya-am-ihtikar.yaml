- tradition: sunni
  id: no-restriction-keep-ijtihad-open
  stance:
    ar: "لا لحصر الفتوى — الحصر يعيد إغلاق باب الاجتهاد"
    en: "No restriction — restriction would close the door of ijtihad again"
  summary:
    ar: "رأى أستاذ الفقه المقارن أن الاجتهاد الجماعي أولى من الفردي، لكنه رفض حصر الفتوى في جهة واحدة لأن المجامع بعض العلماء لا كلهم، ولأن الحصر يعطّل ملكات فقهية أخرى ويعيد الأمة إلى إغلاق باب الاجتهاد؛ والمنع عنده للجاهل الذي تترتب على فتواه مفاسد لا لصاحب الرأي. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:58:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:58:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:59:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:59:30}"
  holders: []
  evidence:
