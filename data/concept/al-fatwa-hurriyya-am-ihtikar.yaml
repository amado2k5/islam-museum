  id: presenter-closing-view
  stance:
    ar: "رأي المقدّم: لا فوضى ولا احتكار — تُواجَه الحجة بالحجة"
    en: "The presenter's view: neither chaos nor monopoly — argument is met with argument"
  summary:
    ar: "رأي طارق السويدان (رأي المتحدث): اختيار المفتي واجب على من يريد الالتزام بالدين، ونشر «ثقافة الاستفتاء» مطلوب، والآراء الشاذة تُواجَه بالدليل والبرهان؛ ووجود المجامع مهم مع إبعاد السياسة عنها وثقة الناس بالعلماء، فقد يبيع فرد دينه لكن يستحيل أن يبيعه الجميع؛ ولا يُمنع الفكر بل يُواجَه بالحجة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:12:30}"
