  id: collective-ijtihad-for-public-questions
  stance:
    ar: "الاجتهاد الجماعي في المجامع أولى في النوازل العامة"
    en: "Collective ijtihad in academies is preferable for public questions"
  summary:
    ar: "رأى عضو في مجمع الفقه الإسلامي أن النوازل العصرية العامة تُترك للمجامع وهيئات الفتوى، لأنها تدرسها مع خبراء في الطب والاقتصاد والمحاسبة والهندسة، وقد يشارك في القرار الواحد من 80 إلى 120 عالماً ومختصاً، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:01:30} ورأى المفتي في ختام الحلقة أن اجتهاد المجامع في الأمور العامة أقل خطأ من الاجتهاد الشخصي مع بقاء الفتوى الشخصية مفتوحة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:08:00}"
  holders: []
