id: concept/al-fatwa-hurriyya-am-ihtikar
class: concept
kind: legal
sensitivity: contested
label:
  ar: "الفتوى بين الحرية والاحتكار"
  en: "Fatwa between freedom and monopoly"
  ur: "فتویٰ: آزادی اور اجارہ داری کے درمیان"
issue:
  ar: "من يحق له أن يفتي اليوم، وما الحد الأدنى لأهلية المفتي، وهل تُحصر الفتوى العامة في المجامع الفقهية ولجان الفتوى أم تبقى مفتوحة للعلماء المؤهلين؟"
  en: "Who may issue fatwas today, what is the minimum qualification of a mufti, and should general fatwas be restricted to fiqh academies and fatwa committees or stay open to qualified scholars?"
  ur: "آج فتویٰ دینے کا حق کس کو ہے، مفتی کی کم از کم اہلیت کیا ہے، اور کیا عمومی فتوے فقہی مجامع اور فتویٰ کمیٹیوں تک محدود کیے جائیں یا اہل علما کے لیے کھلے رہیں؟"
summary:
  ar: "حلقة «الوسطية» عن الفتوى بين الحرية والاحتكار. صوّت 86% من جمهور الاستوديو أن في الفتوى اليوم فوضى، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:05:00} وقال 60% إنهم لا يستفتون إلا علماء محددين مقابل 40% يستفتون أي مفتٍ يطمئنون إلى علمه، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:32:00} وأيّد 78% حصر الفتوى العامة في المجامع الفقهية ولجان الفتوى مقابل 22%. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:57:30} وناقش الضيوف تعريف الفتوى وشروط المفتي والفتاوى الشاذة وتتبّع الرخص واستقلال المجامع عن الحكومات، وختم المقدّم بأن الحل لا فوضى ولا احتكار بل مواجهة الرأي بالدليل. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:12:30}"
  en: "The 'Al-Wasatiyya' episode on fatwa between freedom and monopoly. Eighty-six percent of the studio audience voted that fatwa today is in chaos; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:05:00} 60% said they would consult only particular scholars against 40% who would ask any mufti whose knowledge they trust; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:32:00} and 78% supported restricting general fatwas to fiqh academies and fatwa committees against 22%. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:57:30} The guests debated the definition of fatwa, the conditions of the mufti, anomalous fatwas, the hunt for concessions and the independence of academies from governments; the presenter closed that the answer is neither chaos nor monopoly but meeting opinion with proof. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:12:30}"
  ur: "«الوسطیہ» کی وہ قسط جو آزادی اور اجارہ داری کے درمیان فتوے پر ہے۔ اسٹوڈیو حاضرین میں سے 86% نے ووٹ دیا کہ آج فتوے میں انتشار ہے؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:05:00} 60% نے کہا کہ وہ صرف مخصوص علما سے فتویٰ لیں گے جبکہ 40% کسی بھی ایسے مفتی سے جس کے علم پر انہیں اطمینان ہو؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:32:00} اور 78% نے عمومی فتووں کو فقہی مجامع اور فتویٰ کمیٹیوں تک محدود کرنے کی تائید کی، 22% نے مخالفت۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 00:57:30} مہمانوں نے فتوے کی تعریف، مفتی کی شرائط، شاذ فتووں، رخصتوں کی تلاش اور مجامع کی حکومتوں سے آزادی پر بحث کی؛ میزبان نے اختتام کیا کہ حل نہ انتشار ہے نہ اجارہ داری بلکہ رائے کا جواب دلیل سے دینا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep25 01:12:30}"
perspectives:
