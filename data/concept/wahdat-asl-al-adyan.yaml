label:
  ar: وحدة أصل الدين عند الرسل
  en: Common origin of the message of the prophets
summary:
  ar: "يرى محمد فريد وجدي أن الإسلام في أصوله الاجتماعية والاعتقادية ليس ديناً جديداً، بل هو الدين الذي أوحاه الله إلى نوح والأنبياء من بعده، وأن اختلاف الأديان في أصولها يرجع إلى تحريف أتباعها لما نزل {cite:muhimmat-al-islam-azhar p. 24}. ويجعل من خلافة الله في الأرض انتداباً مفتوحاً لكل شعب يؤمن بالمعروف وينهى عن المنكر، لا وقفاً على جنس بعينه {cite:muhimmat-al-islam-azhar p. 49}. هذا رأي المؤلف في كتابه، ويُنسب إليه."
  en: "Wajdi holds that Islam, in its social and creedal foundations, is not a new religion but the one revealed to Noah and the prophets after him, and that differences among religions come from the distortion of what was sent down {cite:muhimmat-al-islam-azhar p. 24}. He also reads the trust of God's vicegerency on earth as open to any people who command right and forbid wrong, not limited to one race {cite:muhimmat-al-islam-azhar p. 49}. This is the author's view and is attributed to him."
