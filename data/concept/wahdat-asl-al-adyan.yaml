id: concept/wahdat-asl-al-adyan
class: concept
kind: doctrine
label:
  ar: وحدة أصل الدين عند الرسل
  en: Common origin of the message of the prophets
  es: "Origen común del mensaje de los profetas"
  fr: "Origine commune du message des prophètes"
  ur: "پیغمبروں کے پیغام کی مشترکہ اصل"
summary:
  ar: "يرى محمد فريد وجدي أن الإسلام في أصوله الاجتماعية والاعتقادية ليس ديناً جديداً، بل هو الدين الذي أوحاه الله إلى نوح والأنبياء من بعده، وأن اختلاف الأديان في أصولها يرجع إلى تحريف أتباعها لما نزل {cite:muhimmat-al-islam-azhar p. 24}. ويجعل من خلافة الله في الأرض انتداباً مفتوحاً لكل شعب يؤمن بالمعروف وينهى عن المنكر، لا وقفاً على جنس بعينه {cite:muhimmat-al-islam-azhar p. 49}. هذا رأي المؤلف في كتابه، ويُنسب إليه."
  en: "Wajdi holds that Islam, in its social and creedal foundations, is not a new religion but the one revealed to Noah and the prophets after him, and that differences among religions come from the distortion of what was sent down {cite:muhimmat-al-islam-azhar p. 24}. He also reads the trust of God's vicegerency on earth as open to any people who command right and forbid wrong, not limited to one race {cite:muhimmat-al-islam-azhar p. 49}. This is the author's view and is attributed to him."
  es: "Wajdi sostiene que el Islam, en sus fundamentos sociales y doctrinales, no es una religión nueva, sino la revelada a Noé y a los profetas posteriores, y que las diferencias entre religiones provienen de la distorsión de lo revelado {cite:muhimmat-al-islam-azhar p. 24}. Asimismo, interpreta la responsabilidad de la vicerregencia divina en la Tierra como algo abierto a cualquier pueblo que ordene el bien y prohíba el mal, sin limitarse a una sola raza {cite:muhimmat-al-islam-azhar p. 49}. Esta es la opinión del autor y se le atribuye."
  fr: "Wajdi soutient que l'islam, dans ses fondements sociaux et doctrinaux, n'est pas une religion nouvelle mais celle révélée à Noé et aux prophètes qui lui ont succédé, et que les divergences entre les religions proviennent de la déformation du message révélé (cf. Muhimmat al-Islam Azhar, p. 24). Il considère également que la vicariat de Dieu sur terre est accessible à tout peuple qui prône le bien et interdit le mal, sans être limité à une seule ethnie (cf. Muhimmat al-Islam Azhar, p. 49). Cette opinion est celle de l'auteur et lui est attribuée."
  ur: "وجدی کا خیال ہے کہ اسلام اپنی سماجی اور مسلکی بنیادوں میں کوئی نیا مذہب نہیں ہے بلکہ وہ مذہب ہے جو نوح اور ان کے بعد کے انبیاء پر نازل ہوا ہے اور مذاہب کے درمیان اختلاف اس چیز کی تحریف سے پیدا ہوتا ہے جو نازل کیا گیا تھا۔ 24}۔ وہ زمین پر خدا کے نائب ہونے کے بھروسے کو بھی پڑھتا ہے جو کسی ایک نسل تک محدود نہیں بلکہ کسی بھی قوم کے لیے کھلا ہے جو حق کا حکم دیتے ہیں اور غلط سے منع کرتے ہیں۔ 49}۔ یہ مصنف کا نظریہ ہے اور اس کی طرف منسوب ہے۔"
