id: concept/belief-in-the-messengers-no-distinction
class: concept
kind: belief
label: { ar: "الإيمان بالرسل دون تفريق", en: "Belief in the messengers without distinction", ur: "رسولوں پر بلا تفریق ایمان" }
summary:
  ar: "يرى الشعراوي أن أصول العقيدة واحدة في كل الرسالات، وأن الأحكام تتغير بتغير أقضية الحياة، وأن الإيمان بالرسل دون تفريق يعني البلاغ عن الله في العقيدة، واختلاف الأحكام لا يُعد تفريقاً {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1239} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1240}."
  en: "Sha'rawi holds that the principles of belief are one in all revelations, while rulings change with the matters of each age. Belief in the messengers without distinction means accepting the same message of belief, and difference in rulings is not a distinction {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1239} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1240}."
  ur: "شعراوی کے نزدیک تمام رسالتوں میں عقیدے کے اصول ایک ہیں، اور احکام زمانے کے تقاضوں کے مطابق بدلتے ہیں۔ رسولوں پر بلا تفریق ایمان کا مطلب عقیدے کے ایک ہی پیغام کو ماننا ہے، اور احکام کا اختلاف تفریق نہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1239} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1240}۔"
