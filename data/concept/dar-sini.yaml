id: concept/dar-sini
class: concept
kind: natural
label:
  ar: "دار صيني"
  en: "Dar sini (cinnamon)"
  ur: "دار صینی"
summary:
  ar: "أصناف كثيرة تُعرف بأسماء أماكنها، وأجودها الطيب الرائحة الحادّ المذاق بلا لذع. طبعه حار يابس في الثالثة. يقول ديسقوريدوس إن كل دارصيني مسخّن ومفتّح، ودهنه محلّل حار جداً. وفيه منافع للكلف والنمش والقوابي والرعشة والرأس والعين والكبد والمعدة، وذُكر فيه أنه يدر البول والطمث وينفع أوجاع الأرحام {cite:canon-ibn-sina-print-v1 p.431} {cite:canon-ibn-sina-print-v1 p.432} {cite:canon-ibn-sina-print-v1 p.433}."
  en: "Many kinds, named after their places; the best is strongly fragrant, sharp to taste and without sting. Hot and dry in the third degree. Dioscorides says all cinnamon warms and opens, and its oil is strongly warming and dissolving. Listed for freckles, ringworm, tremor, the head, eye, liver and stomach; the book also lists it for womb pains and for the menses {cite:canon-ibn-sina-print-v1 p.431} {cite:canon-ibn-sina-print-v1 p.432} {cite:canon-ibn-sina-print-v1 p.433}."
  ur: "اس کی بہت سی قسمیں ہیں جن کے نام ان کی جگہوں سے ہیں؛ بہترین وہ ہے جو تیز خوشبو دار، تیز ذائقے والا اور بغیر جلن کے ہو۔ طبع تیسرے درجے میں گرم اور خشک۔ ڈیسقوریدوس کہتا ہے کہ ہر دارچینی گرم کرنے والی اور کھولنے والی ہے، اور اس کا تیل بہت گرم اور تحلیل کرنے والا ہے۔ کلف، دادی، رعشہ، سر، آنکھ، جگر اور معدے کے لیے بیان ہوئی ہے؛ کتاب اسے رحم کے درد اور حیض کے لیے بھی بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.431} {cite:canon-ibn-sina-print-v1 p.432} {cite:canon-ibn-sina-print-v1 p.433}۔"
