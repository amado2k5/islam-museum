id: "concept/alamat-al-sakta"
class: "concept"
kind: "scientific"
label:
  ar: "علامات السكتة وإنذاراتها"
  en: "Signs and warnings of apoplexy"
  ur: "سکتہ کی علامات اور پیشگی خبریں"
summary:
  ar: "تتقدّم السكتة في أكثر الأوقات انتفاخ الأوداج ودوار وسدر وظلمة البصر واختلاج في البدن كله وتصريف الأسنان في النوم وكسل وثقل وبول زنجاري أسود فيه رسوب؛ ويُعرف الدموي منها بحمرة الوجه والعينين وتمدد الأوداج والبلغمي بالسحنة ولون العين {cite:canon-ibn-sina-print-v2 p.132}"
  en: "Apoplexy is preceded in most times by swelling of the jugulars, vertigo, giddiness, darkness of sight, twitching of the whole body, grinding of teeth in sleep, laziness and heaviness, and dusky black urine with sediment; its sanguine kind is known by the redness of face and eyes and the distended jugulars, its phlegmatic by the build and the colour of the eye {cite:canon-ibn-sina-print-v2 p.132}"
  ur: "اکثر اوقات سکتہ سے پہلے اوداج کا پھولنا، دوار، سدر، نگاہ کی تاریکی، سارے بدن میں اختلاج، نیند میں دانت پیسنا، سستی اور گرانی اور زنجاری سیاہ پیشاب جس میں تلچھٹ ہو گزرتا ہے؛ اس کی دموی قسم چہرے اور آنکھوں کی سرخی اور تمدد یافتہ اوداج سے اور بلغمی قسم ساخت اور آنکھ کے رنگ سے پہچانی جاتی ہے {cite:canon-ibn-sina-print-v2 p.132}۔"
