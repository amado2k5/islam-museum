label:
  ar: "علم العروض"
  en: "Arabic prosody ('arud)"
  ur: "علم عروض"
  fr: "La prosodie arabe ('arud)"
  es: "La prosodia árabe ('arud)"
summary:
  ar: "العروض علم أوزان الشعر العربي، وينسب ابن خلكان وضعه إلى الخليل بن أحمد الفراهيدي، فيقول إنه استنبطه وحصر أقسامه في خمس دوائر يستخرج منها خمسة عشر بحراً، وزاد فيه الأخفش بحراً هو الخبب. ويذكر في نشأته تفسيرين بصيغة قيل: دعاء الخليل في مكة، أو سماعه وقع مطرقة على طست كما ينقل الذهبي. وتعدد الصفحة كتب الخليل وما قيل في كتاب العين."
  en: "'Arud is the science of the metres of Arabic poetry. Ibn Khallikan ascribes its setting down to al-Khalil ibn Ahmad al-Farahidi, saying he deduced it and confined its parts in five circles from which fifteen metres are derived, and that al-Akhfash added another, the khabab. Of its beginning he gives two explanations as reports, that al-Khalil prayed in Mecca, or heard a hammer's beat on a basin as al-Dhahabi relays. The page lists al-Khalil's works and what is said of Kitab al-Ayn."
  ur: "عروض عربی شعر کے اوزان کا علم ہے۔ ابن خلکان اس کا وضع کرنا خلیل بن احمد فراہیدی کی طرف منسوب کرتے ہیں، کہتے ہیں کہ انہوں نے اسے استنباط کیا اور اس کے اقسام کو پانچ دائروں میں محدود کیا جن سے پندرہ بحریں نکلتی ہیں، اور اخفش نے ایک اور بحر خبب بڑھائی۔ آغاز کی دو توضیحات «کہا جاتا ہے» کے صیغے میں ہیں: خلیل کی مکہ میں دعا، یا ہتھوڑے کی ضرب جیسا ذہبی نقل کرتے ہیں۔ صفحہ خلیل کی کتابیں گنتا ہے۔"
  fr: "L'arud est la science des mètres de la poésie arabe. Ibn Khallikan en attribue la mise en place à al-Khalil ibn Ahmad al-Farahidi, disant qu'il l'a déduite et en a enfermé les parties dans cinq cercles dont se tirent quinze mètres, et qu'al-Akhfash en ajouta un autre, le khabab. Pour son commencement il donne deux explications comme récits : la prière d'al-Khalil à La Mecque, ou le coup d'un marteau sur un bassin selon al-Dhahabi. La page énumère les œuvres d'al-Khalil et ce qui est dit du Kitab al-Ayn."
  es: "El 'arud es la ciencia de los metros de la poesía árabe. Ibn Jallikán atribuye su establecimiento a al-Khalil ibn Ahmad al-Farahidi, diciendo que la dedujo y encerró sus partes en cinco círculos de los que se derivan quince metros, y que al-Akhfash añadió otro, el khabab. Sobre su comienzo da dos explicaciones como relatos: la súplica de al-Khalil en La Meca, o el golpe de un martillo sobre una palangana según transmite al-Dhahabi. La página enumera las obras de al-Khalil y lo que se dice del Kitab al-Ayn."
