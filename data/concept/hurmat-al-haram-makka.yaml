id: concept/hurmat-al-haram-makka
class: concept
kind: term
label: { ar: "أمن الحرم ومكانته", en: "Security of the Sacred Precinct (amn al-haram)", es: "Seguridad del Recinto Sagrado (amn al-haram)", fr: "Sécurité de l'enceinte sacrée (amn al-haram)" }
issue:
  ar: "ما معنى قوله تعالى «ومن دخله كان آمناً»، وكيف يُفهم مع ما وقع في مكة من حروب واعتداءات؟"
summary:
  ar: "أمن من دخل البيت الحرام، وهو من الآيات التي ذكرها القرآن في البيت. يذكر محمد رشيد رضا أن العرب في الجاهلية اتفقت على احترام البيت، وأن الإسلام أقره، ويعرض اعتراضات على ذلك من فتح مكة ومن فعل الحجاج بن يوسف في الكعبة، مع ما قاله الأستاذ محمد عبده في الجواب عنها. وفي حاشية له يذكر رضا خوف الحجاج من السياسة، ويصف موقفه من الدخول إلى الحجاز في زمنه."
  en: "The security of whoever enters the Sacred House, one of the signs the Qur'an names for the House. Rashid Rida says the Arabs before Islam agreed to respect the House and that Islam confirmed this. He sets out two objections, the conquest of Mecca and the bombardment of the Ka'ba by al-Hajjaj ibn Yusuf, with the answers he gives in the name of Muhammad Abduh. In a footnote he describes the political obstacles to the pilgrimage in his time."
  es: "La seguridad de quien entra en la Casa Sagrada es uno de los símbolos que el Corán menciona para referirse a ella. Rashid Rida afirma que los árabes, antes del Islam, acordaron respetar la Casa y que el Islam confirmó este compromiso. Presenta dos objeciones: la conquista de La Meca y el bombardeo de la Kaaba por al-Hajjaj ibn Yusuf, a las que da respuesta en nombre de Muhammad Abduh. En una nota a pie de página, describe los obstáculos políticos que dificultaban la peregrinación en su época."
  fr: "La sécurité de quiconque pénètre dans la Maison Sacrée est l'un des signes que le Coran mentionne pour la désigner. Rashid Rida affirme que les Arabes, avant l'islam, s'étaient engagés à respecter la Maison et que l'islam a confirmé ce principe. Il évoque deux objections: la conquête de La Mecque et le bombardement de la Kaaba par al-Hajjaj ibn Yusuf, auxquelles il répond au nom de Muhammad Abduh. En note de bas de page, il décrit les obstacles politiques au pèlerinage à son époque."
