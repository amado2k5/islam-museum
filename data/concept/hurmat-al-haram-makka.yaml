id: concept/hurmat-al-haram-makka
class: concept
kind: term
label: { ar: "أمن الحرم ومكانته", en: "Security of the Sacred Precinct (amn al-haram)" }
issue:
  ar: "ما معنى قوله تعالى «ومن دخله كان آمناً»، وكيف يُفهم مع ما وقع في مكة من حروب واعتداءات؟"
summary:
  ar: "أمن من دخل البيت الحرام، وهو من الآيات التي ذكرها القرآن في البيت. يذكر محمد رشيد رضا أن العرب في الجاهلية اتفقت على احترام البيت، وأن الإسلام أقره، ويعرض اعتراضات على ذلك من فتح مكة ومن فعل الحجاج بن يوسف في الكعبة، مع ما قاله الأستاذ محمد عبده في الجواب عنها. وفي حاشية له يذكر رضا خوف الحجاج من السياسة، ويصف موقفه من الدخول إلى الحجاز في زمنه."
  en: "The security of whoever enters the Sacred House, one of the signs the Qur'an names for the House. Rashid Rida says the Arabs before Islam agreed to respect the House and that Islam confirmed this. He sets out two objections, the conquest of Mecca and the bombardment of the Ka'ba by al-Hajjaj ibn Yusuf, with the answers he gives in the name of Muhammad Abduh. In a footnote he describes the political obstacles to the pilgrimage in his time."
