label:
  ar: التسع آيات لموسى
  en: The nine signs given to Musa
  ur: موسیٰ کی نو آیات
summary:
  ar: "أرسل الله على فرعون وملئه تسع آيات بينات: الطوفان والجراد والقمل والضفادع والدم — آيات مفصلات قبل فلق البحر، فلما جاءتهم قالوا يا موسى ادع لنا ربك بما عهد عندك لئن كشفت عنا الرجز لنؤمنن لك."
  en: "God sent upon Pharaoh's people nine clear signs: the flood, locusts, lice, frogs and blood — detailed signs before the sea split; each time they begged Musa to pray the plague away and promised belief."
  ur: "اللہ نے فرعون اور اس کی قوم پر نو روشن آیتیں بھیجیں: طوفان، ٹڈیاں، جوئیں، مینڈک اور خون — سمندر پھاڑنے سے پہلے الگ الگ آیتیں؛ ہر بار انہوں نے موسیٰ سے آفت دور کرنے کی دعا مانگی اور ایمان کا وعدہ کیا۔"
