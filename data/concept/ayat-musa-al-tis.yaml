id: concept/ayat-musa-al-tis
class: concept
kind: belief
label:
  ar: التسع آيات لموسى
  en: The nine signs given to Musa
  fr: "Les neuf signes accordés à Moïse"
  ur: موسیٰ کی نو آیات
  es: "Las nueve señales dadas a Musa"
  tr: "Musa'nın Dokuz Ayeti"
  id: "Sembilan Ayat Musa"
summary:
  ar: "أرسل الله على فرعون وملئه تسع آيات بينات: الطوفان والجراد والقمل والضفادع والدم — آيات مفصلات قبل فلق البحر، فلما جاءتهم قالوا يا موسى ادع لنا ربك بما عهد عندك لئن كشفت عنا الرجز لنؤمنن لك."
  en: "God sent upon Pharaoh's people nine clear signs: the flood, locusts, lice, frogs and blood — detailed signs before the sea split; each time they begged Musa to pray the plague away and promised belief."
  fr: "Dieu envoya au peuple de Pharaon neuf signes manifestes : le déluge, les sauterelles, les poux, les grenouilles et le sang, signes distincts précédant l’ouverture de la mer ; chaque fois, ils supplièrent Moïse de prier pour éloigner le fléau et promirent de croire."
  ur: "اللہ نے فرعون اور اس کی قوم پر نو روشن آیتیں بھیجیں: طوفان، ٹڈیاں، جوئیں، مینڈک اور خون — سمندر پھاڑنے سے پہلے الگ الگ آیتیں؛ ہر بار انہوں نے موسیٰ سے آفت دور کرنے کی دعا مانگی اور ایمان کا وعدہ کیا۔"
  es: "Dios envió sobre el pueblo del faraón nueve señales claras: el diluvio, las langostas, los piojos, las ranas y la sangre; señales detalladas antes de que el mar se abriera; cada vez le rogaron a Musa que rezara para alejar la plaga y prometieron tener fe."
  tr: "Tanrı Firavun'a dokuz açık işaret gönderdi ve ona dokuz açık işaret verdi: tufan, çekirgeler, bitler, kurbağalar ve kan — denizin yarılmasından önceki ayrıntılı işaretler. Yanlarına geldiklerinde, 'Ey Musa, Rabbini sana vaat ettiği şeyi bizim için çağır. Ziyafeti bizden alırsan, sana kesinlikle inanırız.' dediler."
  id: "Allah mengirim kepada Firaun dan memberinya sembilan tanda yang jelas: banjir, belalang, kutu, katak, dan darah — tanda-tanda rinci sebelum laut terbelah. Ketika mereka datang kepada mereka, mereka berkata, 'Ya Musa, panggillah Tuhanmu untuk kami apa yang telah Dia janjikan kepadamu. Jika kamu menghilangkan jamuan dari kami, kami pasti akan percaya kepada-Mu.'"
