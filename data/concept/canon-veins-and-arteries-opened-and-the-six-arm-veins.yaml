id: concept/canon-veins-and-arteries-opened-and-the-six-arm-veins
class: concept
kind: scientific
label: { ar: "العروق المفصودة وأوردة اليد الستة عند ابن سينا", en: "The vessels that are opened and the six veins of the arm in the Canon", ur: "قانون میں کھولی جانے والی رگیں اور بازو کی چھ رگیں", es: "Los vasos que se abren y las seis venas del brazo en el Canon", fr: "Les vaisseaux qui sont ouverts et les six veines du bras dans le Canon", tr: "İbn Sina'ya göre ayrılmış damarlar ve elin altı damarı", id: "Pembuluh darah yang terpisah dan enam urat tangan menurut Ibn Sina" }
summary:
  ar: "يبين ابن سينا أن العروق المفصودة بعضها أوردة وبعضها شرايين، وأن الشرايين تفصد في الأقل لخطر النزف، ثم يعد أوردة اليد الستة ويذكر موضع فتحها فوق المأبض {cite:canon-ibn-sina-print-v1 p.294}."
  en: "Ibn Sina explains that the vessels that are opened are some veins and some arteries, that arteries are opened least because of the danger of haemorrhage, then names the six veins of the arm and where they are opened, above the elbow {cite:canon-ibn-sina-print-v1 p.294}."
  es: "Ibn Sina explica que los vasos que se abren son algunas venas y algunas arterias, que las arterias se abren en menor medida debido al peligro de hemorragia, luego nombra las seis venas del brazo y dónde se abren, por encima del codo {cite:canon-ibn-sina-print-v1 p.294}."
  fr: "Ibn Sina explique que les vaisseaux qui sont ouverts sont des veines et des artères, que les artères sont ouvertes en moindre quantité en raison du risque d'hémorragie, puis nomme les six veines du bras et indique où elles sont ouvertes, au-dessus du coude {cite:canon-ibn-sina-print-v1 p.294}."
  ur: "ابن سینا وضاحت کرتے ہیں کہ جو برتن کھولے جاتے ہیں وہ کچھ رگیں اور کچھ شریانیں ہیں، یہ شریانیں خون بہنے کے خطرے کی وجہ سے کم سے کم کھلتی ہیں، پھر بازو کی چھ رگوں کے نام بتاتے ہیں اور کہنی کے اوپر کہاں کھلتے ہیں {حوالہ: کینون ابن سینا پرنٹ v1 صفحہ 294}۔"
  tr: "İbn Sina, arterlerin kısmen damar, bazılarının ise arter olduğunu ve en azından kanama riski nedeniyle arterlerin açık olduğunu açıklar. Sonra eldeki altı damarı sayar ve bunların citronusun üzerindeki açılış yerini belirtir {cite:canon-ibn-sina-print-v1 s.294}."
  id: "Ibn Sina menjelaskan bahwa vena arteri sebagian adalah vena dan sebagian adalah arteri, dan setidaknya arteri terbuka karena risiko pendarahan. Ia kemudian menghitung enam pembuluh darah tangan dan menyebutkan lokasi bukaan di atas citronus {cite:canon-ibn-sina-print-v1 hlm.294}."
