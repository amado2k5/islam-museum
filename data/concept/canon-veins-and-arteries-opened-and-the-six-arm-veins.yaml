label: { ar: "العروق المفصودة وأوردة اليد الستة عند ابن سينا", en: "The vessels that are opened and the six veins of the arm in the Canon", ur: "قانون میں کھولی جانے والی رگیں اور بازو کی چھ رگیں" , fr: "Les vaisseaux que l'on ouvre et les six veines du bras dans le Canon" }
summary:
  fr: "Ibn Sina explique que les vaisseaux que l'on ouvre comprennent certaines veines et certaines artères, ces dernières étant plus rarement ouvertes en raison du danger d'hémorragie. Il nomme ensuite les six veines du bras et situe leur ouverture au-dessus du coude {cite:canon-ibn-sina-print-v1 p.294}."
  ar: "يبين ابن سينا أن العروق المفصودة بعضها أوردة وبعضها شرايين، وأن الشرايين تفصد في الأقل لخطر النزف، ثم يعد أوردة اليد الستة ويذكر موضع فتحها فوق المأبض {cite:canon-ibn-sina-print-v1 p.294}."
  en: "Ibn Sina explains that the vessels that are opened are some veins and some arteries, that arteries are opened least because of the danger of haemorrhage, then names the six veins of the arm and where they are opened, above the elbow {cite:canon-ibn-sina-print-v1 p.294}."
