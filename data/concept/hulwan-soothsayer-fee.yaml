label: { ar: "حُلوان", en: "Hulwan (soothsayer's fee; a father's share of a dowry)", ur: "حُلوان" }
summary:
  ar: "الحُلوان بضم الحاء العطاء، وهو ما يعطى للكاهن على كهانته، ويطلق أيضا على ما يأخذه الأب من مهر ابنته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7274} ورد في الحديث النهي عن ثمن الكلب ومهر البغي وحلوان الكاهن، وقال الشراح إن المراد بحلوان الكاهن ما يعطاه من أجر على كهانته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7274} وأجمع المسلمون، كما ينقل النووي، على تحريم حلوان الكاهن، لأنه عوض عن محرم وأكل للمال بالباطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7275} والحباء، وهو أخذ الرجل من مهر ابنته لنفسه، اختلف فيه الفقهاء؛ فالحنفية والحنابلة يرون أن الشرط لازم والصداق صحيح، والمالكية يفرقون بين أن يكون الشرط عند العقد فهو للابنة أو بعده فهو للأب، والشافعية يرون الصداق فاسدا ولها مهر المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7275} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} ويحيل المدخل إلى مدخل «مهر» في الحلوان بمعنى الصداق، وإلى «أجل» و«جلف» في الألفاظ الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} ويفرق الجعل عن الحلوان بأن الجعل أخص، والحباء أخص من الحلوان بمعناه العام، والرشوة لغة الإعطاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7275} "
  en: "Hulwan means a gift; in the law it is the payment given to a soothsayer for his services, and it also names the sum a father takes from his daughter's dowry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7274} The hadith forbids the price of a dog, the fee of a prostitute and the soothsayer's hulwan; the commentators read the last as the fee for his divining. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7274} Following al-Nawawi, the scholars agree the soothsayer's hulwan is forbidden, as an exchange for what is unlawful and as eating property wrongly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7275} A father's taking of part of his daughter's dowry (hiba) divides the schools: the Hanafis and Hanbalis hold the condition binding and the dower valid; the Malikis distinguish a condition made at the contract, which belongs to the daughter, from one made later, which belongs to the father; the Shafiis hold the dower invalid and owed as the equivalent dower. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7275} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} Hulwan in the sense of dower is treated under the headword on dower, and the entry refers to related words such as ajal and jalaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} Ju'l differs from hulwan in being more specific, and hiba is a narrower sense of hulwan; rishwa (bribe) is lexically a giving. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7275} "
  ur: "حُلوان لغت میں عطیہ ہے، اور شرعاً وہ معاوضہ ہے جو کاہن کو اس کی کہانت پر دیا جائے؛ اور باپ کا بیٹی کے مہر میں سے لینا بھی اسی لفظ سے تعبیر ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7274} حدیث میں کتے کی قیمت، زانیہ کی اجرت اور کاہن کے حُلوان سے منع کیا گیا ہے؛ شارحین نے کاہن کے حُلوان کو اس کی کہانت کی اجرت قرار دیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7274} نووی کے مطابق کاہن کے حُلوان کی حرمت پر علماء کا اتفاق نقل کیا گیا ہے، کیونکہ یہ حرام کا عوض اور ناحق مال کھانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7275} باپ کا بیٹی کے مہر سے کچھ لینا (حِباء) مختلف فیہ ہے: حنفیہ اور حنابلہ شرط کو لازم اور مہر کو درست کہتے ہیں؛ مالکیہ نکاح کے وقت کی شرط کو بیٹی کا حق اور بعد کی شرط کو باپ کا حق سمجھتے ہیں؛ شافعیہ مہر کو فاسد کہتے ہیں اور بیوی کے لیے مہرِ مثل لازم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7275} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} مہر کے معنی میں حُلوان کے احکام «مہر» کے مدخل میں دیکھے جائیں، اور دیگر متعلقہ الفاظ «أجل» اور «جلف» کے تحت دیکھے جائیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7276} "
