summary:
  ar: "يفتتح ابن سينا الفصل الثاني، في معالجة أمراض سوء المزاج، بأن ما كان بلا مادة بدل مزاجه فقط، وما كان مع مادة استفرغت ثم بدل المزاج إن بقي سوؤه، ويقسم المعالجة إلى ثلاثة أصناف بحسب كون سوء المزاج مستحكماً أو في حد الكون أو مريداً أن يكون {cite:canon-ibn-sina-print-v1 pp.271-272}."
  en: "Ibn Sina opens the second chapter, on treating the diseases of bad temperament, saying that when there is no matter only the temperament is changed, and when there is matter it is evacuated and the temperament changed afterwards if the bad state remains, and he divides treatment into three kinds according to whether the bad temperament is established, coming into being, or about to come {cite:canon-ibn-sina-print-v1 pp.271-272}."
