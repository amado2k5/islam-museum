id: concept/canon-treating-bad-temperament-by-its-stage
class: concept
kind: scientific
label: { ar: "معالجة سوء المزاج بحسب مرتبته عند ابن سينا", en: "Treating bad temperament according to its stage in the Canon", ur: "سوء مزاج کا علاج اس کے مرتبے کے مطابق قانون میں", es: "Tratar el mal temperamento según su etapa en el Canon", fr: "Traiter le mauvais tempérament selon son stade dans le Canon", tr: "İbn Sina'ya göre kötü ruh halinin derecesine göre tedavisi", id: "Penanganan suasana hati buruk sesuai dengan peringkatnya menurut Ibn Sina" }
summary:
  ar: "يفتتح ابن سينا الفصل الثاني، في معالجة أمراض سوء المزاج، بأن ما كان بلا مادة بدل مزاجه فقط، وما كان مع مادة استفرغت ثم بدل المزاج إن بقي سوؤه، ويقسم المعالجة إلى ثلاثة أصناف بحسب كون سوء المزاج مستحكماً أو في حد الكون أو مريداً أن يكون {cite:canon-ibn-sina-print-v1 pp.271-272}."
  en: "Ibn Sina opens the second chapter, on treating the diseases of bad temperament, saying that when there is no matter only the temperament is changed, and when there is matter it is evacuated and the temperament changed afterwards if the bad state remains, and he divides treatment into three kinds according to whether the bad temperament is established, coming into being, or about to come {cite:canon-ibn-sina-print-v1 pp.271-272}."
  es: "Ibn Sina abre el segundo capítulo, sobre el tratamiento de las enfermedades del mal temperamento, diciendo que cuando no hay materia solo se cambia el temperamento, y cuando hay materia se evacua y el temperamento se cambia después si el mal estado persiste, y divide el tratamiento en tres tipos según si el mal temperamento está establecido, en desarrollo o a punto de desarrollarse {cite:canon-ibn-sina-print-v1 pp.271-272}."
  fr: "Ibn Sina ouvre le deuxième chapitre, sur le traitement des maladies du mauvais tempérament, en disant que lorsqu'il n'y a pas de matière, seul le tempérament est modifié, et lorsqu'il y a de la matière, elle est évacuée et le tempérament est modifié ensuite si le mauvais état persiste, et il divise le traitement en trois sortes selon que le mauvais tempérament est établi, en train de se former ou sur le point de se produire {cite:canon-ibn-sina-print-v1 pp.271-272}."
  ur: "ابن سینا نے دوسرا باب برے مزاج کی بیماریوں کے علاج پر کھولتے ہوئے کہا ہے کہ جب کوئی بات نہیں ہوتی تو صرف مزاج ہی بدل جاتا ہے اور جب مادہ ہوتا ہے تو اس کو نکال دیا جاتا ہے اور مزاج بدل جاتا ہے بعد میں اگر خراب حالت باقی رہتی ہے تو اس نے علاج کو تین قسموں میں تقسیم کیا ہے اس لحاظ سے کہ برے مزاج کے قائم ہونے، وجود میں آنے یا ہونے کے بارے میں: صفحہ 271-272}۔"
  tr: "İbn Sina, kötü mizaç hastalıklarının tedavisinde ikinci bölümü açar; maddesiz olanın sadece ruh halinin yerini aldığını, neyin ise kusan ve bozulması devam ederse ruh halinin yerini alan maddeyle olduğunu belirtir. Tedaviyi, ruh halinin evrenin sınırında mı kontrol altında olduğuna ya da {cite:canon-ibn-sina-print-v1 s.271-272} olarak üç kategoriye ayırır."
  id: "Ibn Sina membuka bab kedua, dalam mengobati penyakit temperamen buruk, dengan menyatakan bahwa apa yang tanpa substansi hanya menggantikan suasana hatinya, dan apa yang ada dengan zat yang memuntahkan dan kemudian menggantikan suasana hati jika kerusakannya tetap ada. Ia membagi perlakuan menjadi tiga kategori berdasarkan apakah suasana hati dikendalikan, di batas alam semesta, atau apakah ingin menjadi {cite:canon-ibn-sina-print-v1 hlm.271-272}."
