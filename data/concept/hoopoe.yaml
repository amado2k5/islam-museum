label:
  ar: "الهدهد"
  en: "The hoopoe"
  ur: "ہدہد"
summary:
  ar: "طير سليمان الذي غاب فتفقّده سليمان فجاء من سبأ بنبأ يقين: مملكة تسجد للشمس من دون الله فأرسله بكتاب إلى ملكتهم، ونهى النبي عن قتله. حمل الهدهد كتاب سليمان بسم الله الرحمن الرحيم ألا تعلوا عليّ وأتوني مسلمين فألقته الملكة إلى ملئها ثم أسلمت مع سليمان لله رب العالمين."
  en: "Solomon's bird which he missed one day; it returned from Sheba with certain news of a kingdom prostrating to the sun instead of God, and he sent it with his letter to their queen — 'rise not against me, but come to me in submission' — and she submitted with Solomon to the Lord of the worlds. The Prophet forbade killing it."
  ur: "سلیمان کا پرندہ جو ایک دن غائب ہوا؛ وہ سبا سے یقینی خبر لایا کہ ایک سلطنت الله کے بجائے سورج کو سجدہ کرتی ہے تو اس نے ملکہ کے نام خط بھیجا — 'مجھ پر سرکشی نہ کرو اور تسلیم ہو کر میرے پاس آؤ' — اور اس نے سلیمان کے ساتھ رب العالمین کے آگے سر تسلیم خم کیا۔ نبی نے اس کا قتل منع فرمایا۔"
