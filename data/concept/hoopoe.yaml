summary:
  ar: "طير سليمان الذي غاب فتفقّده سليمان فجاء من سبأ بنبأ يقين: مملكة تسجد للشمس من دون الله فأرسله بكتاب إلى ملكتهم، ونهى النبي عن قتله. حمل الهدهد كتاب سليمان بسم الله الرحمن الرحيم ألا تعلوا عليّ وأتوني مسلمين فألقته الملكة إلى ملئها ثم أسلمت مع سليمان لله رب العالمين."
  en: "Solomon's bird which he missed one day; it returned from Sheba with certain news of a kingdom prostrating to the sun instead of God, and he sent it with his letter to their queen — 'rise not against me, but come to me in submission' — and she submitted with Solomon to the Lord of the worlds. The Prophet forbade killing it."
  ur: "سلیمان کا پرندہ جو ایک دن غائب ہوا؛ وہ سبا سے یقینی خبر لایا کہ ایک سلطنت الله کے بجائے سورج کو سجدہ کرتی ہے تو اس نے ملکہ کے نام خط بھیجا — 'مجھ پر سرکشی نہ کرو اور تسلیم ہو کر میرے پاس آؤ' — اور اس نے سلیمان کے ساتھ رب العالمین کے آگے سر تسلیم خم کیا۔ نبی نے اس کا قتل منع فرمایا۔"
  es: "El ave de Salomón, que un día extrañó, regresó de Saba con noticias de un reino que se postraba ante el sol en lugar de ante Dios. Salomón la envió con una carta a su reina: «No te alces contra mí, sino ven a mí en sumisión». Ella se sometió con Salomón al Señor de los mundos. El profeta prohibió matarla."
  fr: "L'oiseau de Salomon, qu'il avait égaré un jour, revint de Saba porteur de la nouvelle qu'un royaume s'était prosterné devant le soleil plutôt que devant Dieu. Salomon l'envoya avec sa lettre à leur reine: « Ne te dresse pas contre moi, mais viens à moi en signe de soumission. » Et elle se soumit avec Salomon au Seigneur des mondes. Le Prophète interdit de le tuer."
  tr: "Süleyman'ın kuşu yoktu, bu yüzden Süleyman onu kontrol etti ve Şeba'dan bir haberle geldi: Allah yerine güneşe secde eden bir krallık. Onu kraliçelerine bir mektupla gönderdi ve Peygamber onu öldürmeyi yasakladı. Hoopoe Süleyman'ın kitabını taşıyordu: En Lütf, Merhametli Allah'ın adıyla. Üzerimden yükselip bana Müslüman olarak gelmiyor musunuz? Kraliçe kuşu tamamen attı, sonra ben de Süleyman ile birlikte dünyaların Rabbi Tanrı'ya teslim oldum."
  id: "Burung Salomo tidak ada, jadi Salomo memeriksanya dan datang dari Sheba dengan kabar pasti: sebuah kerajaan yang sujud kepada matahari menggantikan Tuhan. Dia mengirimnya dengan surat kepada ratu mereka, dan Nabi melarang membunuhnya. Hoopoe itu membawa buku Salomo: Dalam nama Allah, Yang Maha Penyayang, Yang Maha Penyayang. Apakah engkau tidak bangkit di atas aku dan datang kepadaku sebagai umat Muslim? Ratu melemparkannya sepenuhnya, lalu aku menyerahkan bersama Salomo kepada Tuhan, Tuhan segala jagaan."
