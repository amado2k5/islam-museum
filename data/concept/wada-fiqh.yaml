id: concept/wada-fiqh
class: concept
kind: legal
label: { ar: "وَدَاع", en: "Wada' (farewell: taking leave of the traveller, and the rites of departure)" }
summary:
  ar: "الوداع في اللغة اسم مصدر التوديع، وهو أن تشيّع المسافر عند سفره، والمودّع هو المسافر لأنه المفارق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} ويستحب للمسافر أن يودّع أهله وإخوانه وأصحابه ويسألهم الدعاء، وأن يقول له المودّع: «أستودعك الله الذي لا يضيع ودائعه»، وروي عن ابن عمر أن الرجل يُقال له: استودع الله دينك وأمانتك وخواتيم عملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} ويستحب أن يصلي المسافر ركعتين قبل خروجه، ومن يودّع المجاهدين يدعو لهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} وعند الحنفية يُكره تحريماً تقبيل الرجل فم الرجل أو شيئاً منه، أما المصافحة فجاءت فيها أحاديث، ويستحب عند الشافعية تقبيل القادم من سفر مع اتحاد الجنس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} ويودّع الحاج والمعتمر بيته بطواف الوداع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629}"
  en: "Wada' is the verbal noun of taking leave; the one who departs is the one who is taken leave of, since he is the one parting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} A traveller is advised to take leave of his family, brethren and friends and ask their prayers, and the one who sees him off says: 'I entrust you to God, who does not lose what is entrusted to Him'; Ibn Umar reported the words 'may God keep your faith, your trust and the last of your deeds'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} It is recommended to pray two rak'as before leaving, and to pray for those who go out to fight in God's way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} The Hanafis forbid a man kissing the mouth of another man; a Shafi'i view recommends kissing a returning traveller of the same sex. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} The pilgrim takes leave of the House by the farewell circuit (tawaf al-wada'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629}"
