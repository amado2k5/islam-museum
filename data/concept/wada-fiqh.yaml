label: { ar: "وَدَاع", en: "Wada' (farewell: taking leave of the traveller, and the rites of departure)", es: "Wada' (despedida: despedida del viajero y ritos de partida)", fr: "Wada' (adieu: prendre congé du voyageur et les rites de départ)", ur: "ودا ⁦(الوداعی: مسافر کی رخصت لینا، اور رخصتی کی رسم)⁩" }
summary:
  ar: "الوداع في اللغة اسم مصدر التوديع، وهو أن تشيّع المسافر عند سفره، والمودّع هو المسافر لأنه المفارق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} ويستحب للمسافر أن يودّع أهله وإخوانه وأصحابه ويسألهم الدعاء، وأن يقول له المودّع: «أستودعك الله الذي لا يضيع ودائعه»، وروي عن ابن عمر أن الرجل يُقال له: استودع الله دينك وأمانتك وخواتيم عملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} ويستحب أن يصلي المسافر ركعتين قبل خروجه، ومن يودّع المجاهدين يدعو لهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} وعند الحنفية يُكره تحريماً تقبيل الرجل فم الرجل أو شيئاً منه، أما المصافحة فجاءت فيها أحاديث، ويستحب عند الشافعية تقبيل القادم من سفر مع اتحاد الجنس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} ويودّع الحاج والمعتمر بيته بطواف الوداع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629}"
  en: "Wada' is the verbal noun of taking leave; the one who departs is the one who is taken leave of, since he is the one parting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} A traveller is advised to take leave of his family, brethren and friends and ask their prayers, and the one who sees him off says: 'I entrust you to God, who does not lose what is entrusted to Him'; Ibn Umar reported the words 'may God keep your faith, your trust and the last of your deeds'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} It is recommended to pray two rak'as before leaving, and to pray for those who go out to fight in God's way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} The Hanafis forbid a man kissing the mouth of another man; a Shafi'i view recommends kissing a returning traveller of the same sex. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} The pilgrim takes leave of the House by the farewell circuit (tawaf al-wada'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629}"
  es: "Wada' es el sustantivo verbal de despedirse; quien se va es de quien se despide, puesto que es quien se separa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} Se aconseja a un viajero que se despida de su familia, hermanos y amigos y les pida sus oraciones, y quien lo despide dice: 'Te encomiendo a Dios, quien no pierde lo que se le confía'; Ibn Umar informó las palabras 'que Dios guarde tu fe, tu confianza y el último de tus actos'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} Se recomienda rezar dos rak'as antes de partir y rezar por aquellos que salen a luchar en el camino de Dios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} Los hanafíes prohíben que un hombre bese la boca de otro hombre; una opinión shafi'í recomienda besar a un viajero que regresa del mismo sexo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} El peregrino se despide de la Casa por el circuito de despedida (tawaf al-wada'). {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629}"
  fr: "« Wada » est le nom verbal de l'action de prendre congé; celui qui part est celui dont on prend congé, puisqu'il est celui qui se sépare. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} Il est conseillé au voyageur de prendre congé de sa famille, de ses frères et sœurs et de ses amis, de leur demander de prier pour lui, et celui qui le raccompagne dit: « Je te confie à Dieu, qui ne perd jamais ce qui Lui est confié. » Ibn Umar a rapporté les paroles suivantes: « Que Dieu préserve ta foi, ta confiance et tes dernières actions. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} Il est recommandé d'accomplir deux rak'as avant de partir et de prier pour ceux qui partent combattre pour la cause de Dieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} L'école hanafite interdit à un homme d'embrasser la bouche d'un autre homme; l'école shafi'ite recommande d'embrasser un voyageur du même sexe de retour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16627} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16628} Le pèlerin prend congé de la Maison par le circuit d'adieu (tawaf al-wada'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629}"
  ur: "وڈا چھٹی لینے کا زبانی اسم ہے۔ رخصت ہونے والا وہی ہے جس سے رخصت لی جاتی ہے، کیونکہ وہ جدا ہونے والا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16625} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16626} مسافر کو نصیحت کی جاتی ہے کہ وہ اپنے اہل و عیال، بھائیوں اور دوستوں سے رخصت لے اور ان سے دعائیں مانگے، اور جو شخص اسے کھوتا ہوا دیکھتا ہے، وہ کہتا ہے کہ جس چیز کو کھوتا ہے، وہ کہتا ہے: اس کے پاس'؛ ابن عمر نے یہ الفاظ بیان کیے کہ 'خدا آپ کے ایمان، آپ کی امانت اور آپ کے آخری اعمال کو سلامت رکھے'۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16626} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16627} مستحب ہے کہ جانے سے پہلے دو رکعتیں پڑھیں، اور جو لوگ خدا کی راہ میں لڑنے کے لیے نکلیں ان کے لیے دعا کریں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16627} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16628} احناف نے ایک آدمی کو دوسرے آدمی کے منہ کو چومنے سے منع کیا ہے۔ ایک شافعی نظریہ ایک ہی جنس کے واپس آنے والے مسافر کو بوسہ دینے کی سفارش کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16627} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16628} حاجی الوداعی چکر ⁦(طواف الوداع)⁩ سے گھر سے نکلتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16629}"
