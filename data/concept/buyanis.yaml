label:
  ar: "بويانس"
  en: "Buyanis (a plant with a thick root)"
  fr: "Buyanis (plante à grosse racine)"
  ur: "بویانس"
  es: "Buyanis (una planta con una raíz gruesa)"
summary:
  ar: "يُستعمل أصله أكثر، وله صمغ وعصارة، وصمغه أقوى من عصارته. حار يابس في الثالثة، محلّل. يقشّر العظام الفاسدة وينقّي القروح، وموافق للعصب جداً، وينفع من الفضول الغليظة في الصدر ضماداً، وصلابة الطحال طلاءً أو مدوفاً بالماء الحار {cite:canon-ibn-sina-print-v1 p.393}."
  en: "Mostly its root is used, and it also has a gum and a juice; the gum is stronger than the juice. Hot and dry in the third degree; dissolving. It scales away diseased bone and cleanses ulcers, suits the nerves very well, helps thick humours of the chest as a poultice, and helps hardness of the spleen when applied as it is or dissolved in hot water {cite:canon-ibn-sina-print-v1 p.393}."
  fr: "La racine est surtout utilisée ; la plante possède aussi gomme et suc, la gomme étant plus forte. Chaude et sèche au troisième degré, résolutive. Selon le livre, elle détacherait les lamelles d’os malade, nettoierait les ulcères, conviendrait aux nerfs, aiderait les humeurs épaisses thoraciques en cataplasme et l’induration de la rate, appliquée telle quelle ou dissoute dans l’eau chaude {cite:canon-ibn-sina-print-v1 p.393}."
  ur: "زیادہ تر اس کی جڑ استعمال ہوتی ہے، اور اس کا گوند اور رس بھی ہوتا ہے؛ گوند رس سے زیادہ قوی ہے۔ تیسرے درجے میں گرم اور خشک، تحلیل کرنے والا۔ یہ خراب ہڈی کا چھلکا اتارتا اور زخموں کو صاف کرتا ہے، اعصاب کے لیے بہت موافق ہے، سینے کی گاڑھی رطوبتوں میں ضماد کے طور پر نفع دیتا ہے، اور تلی کی سختی میں جوں کا توں یا گرم پانی میں گھول کر لیپ کیا جاتا ہے {cite:canon-ibn-sina-print-v1 p.393}۔"
  es: "Se utiliza principalmente su raíz, que también contiene goma y jugo; la goma es más fuerte que el jugo. Es caliente y seca en tercer grado; disuelve. Elimina las escamas del hueso enfermo y limpia las úlceras, es muy beneficiosa para los nervios, ayuda a disolver los humores espesos del pecho en forma de cataplasma y ayuda a aliviar la dureza del bazo cuando se aplica tal cual o disuelta en agua caliente {cite:canon-ibn-sina-print-v1 p.393}."
