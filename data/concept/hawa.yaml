label:
  ar: الهوى
  en: Vain desire (hawa)
summary:
  ar: "الهوى في الحديث الحادي والأربعين من الأربعين ميل النفس الذي يجب إخضاعه للوحي: «لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به» — فاتباع الهوى نقيض اتباع الرسول وشرط الإيمان أن يكون ميل النفس تابعاً للشرع لا متبوعاً، ومنه فساد الاستبداد بالرأي وترجيح الشهوة على الدليل (جامع العلوم والحكم ص 824)."
  en: "Hawa in the forty-first hadith of the Forty is the soul's inclination that must be made subject to revelation: 'none of you believes until his desire is brought to follow what I have brought' — following vain desire is the opposite of following the Messenger, and a condition of faith is that the soul's bent be made a follower of the Law, not followed; from it grow the corruption of opinion ruling alone and the preferring of appetite over proof (Jami' al-Ulum wal-Hikam p. 824)."
