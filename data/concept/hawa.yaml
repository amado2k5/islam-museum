id: concept/hawa
class: concept
kind: ethical
label:
  ar: الهوى
  en: Vain desire (hawa)
  es: "Deseo vano (hawa)"
  fr: "Désir vain (hawa)"
  ur: "بیکار خواہش ⁦(ہوا)⁩"
  tr: "Aşk"
  id: "Cinta"
summary:
  ar: "الهوى في الحديث الحادي والأربعين من الأربعين ميل النفس الذي يجب إخضاعه للوحي: «لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به» — فاتباع الهوى نقيض اتباع الرسول وشرط الإيمان أن يكون ميل النفس تابعاً للشرع لا متبوعاً، ومنه فساد الاستبداد بالرأي وترجيح الشهوة على الدليل ⁦(جامع العلوم والحكم ص 824)⁩."
  en: "Hawa in the forty-first hadith of the Forty is the soul's inclination that must be made subject to revelation: 'none of you believes until his desire is brought to follow what I have brought' — following vain desire is the opposite of following the Messenger, and a condition of faith is that the soul's bent be made a follower of the Law, not followed; from it grow the corruption of opinion ruling alone and the preferring of appetite over proof (Jami' al-Ulum wal-Hikam p. 824)."
  es: "Hawa en el hadiz cuarenta y uno de los Cuarenta es la inclinación del alma que debe someterse a revelación: \"Ninguno de vosotros cree hasta que su deseo se vea llevado a seguir lo que yo he traído\" — seguir el deseo vano es lo opuesto a seguir al Mensajero, y una condición de la fe es que la inclinación del alma se convierta en seguidora de la Ley, no en seguida; de ello surgen la corrupción de la opinión que gobierna sola y la preferencia del apetito sobre la prueba (Jami' al-Ulum wal-Hikam p. 824)."
  fr: "Dans le quarante et unième hadith des Quarante, Hawa désigne l'inclination de l'âme qui doit être soumise à la révélation: « Nul d'entre vous ne croit tant que son désir n'est pas amené à suivre ce que J'ai apporté » — suivre un désir vain est l'opposé de suivre le Messager, et une condition de la foi est que l'inclination de l'âme soit faite pour suivre la Loi, et non pour la suivre; de là naît la corruption de l'opinion qui règne seule et la préférence pour l'appétit plutôt que pour la preuve (Jami' al-Ulum wal-Hikam p. 824)."
  ur: "چالیسویں کی اکتالیسویں حدیث میں حواء روح کا میلان ہے جسے وحی کے تابع کرنا ضروری ہے: 'تم میں سے کوئی اس وقت تک مومن نہیں ہو سکتا جب تک اس کی خواہش اس کی پیروی نہ کر دی جائے جو میں لایا ہوں' - باطل خواہش کی پیروی رسول کی پیروی کے خلاف ہے، اور ایمان کی شرط یہ ہے کہ روح کی جھکاؤ کو شریعت کا پابند بنایا جائے، پیروی نہ کی جائے۔ اس سے صرف رائے کے حکم کی بدعنوانی اور ثبوت پر بھوک کو ترجیح دینا ⁦(جامع العلوم والحکم ص 824)⁩۔"
  tr: "Ruhun kırk eğiliminin kırk birinci hadisinde arzu, vahyeye tabi tutulmalıdır: \"Hiçbiriniz gerçekten inanmazsınız, ta ki arzusu benim getirdiklerime uyana kadar.\" — Arzuları takip etmek, Elçi'yi takip etmenin tam tersidir ve iman koşulu ruhun eğiliminin kanuna uyması, takip etmemesidir. Bu, görüşte zorbalığın yozlaşmasına ve delil yerine arzuyu tercih etmesine yol açar (Jami' al-Ulum wal-Hikam, s. 824)."
  id: "Keinginan dalam hadis keempat puluh satu tentang empat puluh kecenderungan jiwa yang harus tunduk pada wahyu: \"Tidak ada dari kalian yang benar-benar percaya sampai keinginannya mengikuti apa yang telah Aku bawa.\" — Mengikuti keinginan adalah kebalikan dari mengikuti Rasulul, dan syarat iman adalah kecenderungan jiwa mengikuti hukum, bukan mengikuti. Ini menyebabkan korupsi tirani dalam pendapat dan keutamaan keinginan daripada bukti (Jami' al-Ulum wal-Hikam, hlm. 824)."
