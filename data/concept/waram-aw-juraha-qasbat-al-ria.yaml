"label":
  "ar": "الورم أو الجراحة العارضة لقصبة الرئة"
  "en": "The tumour or the wound befalling the windpipe"
  "ur": "نالی کی قصبہ میں ورم یا زخم"
  "es": "El tumor o la herida que afecta a la tráquea"
  "fr": "La tumeur ou la plaie touchant la trachée"
  "tr": "Trakeanın tümörü veya kazara yapılan cerrahi müdahalesi"
  "id": "Tumor atau pembedahan trakea yang tidak disengaja"
"summary":
  "ar": "علامات ذلك حمى ضعيفة وضربان في وسط الظهر ووجع، فإن القصبة ليست كالرئة في\
    \ أن لا تحس ولكنه وجع خفيف، ويعرض مع ذلك حكة الجسد وبحّة الصوت، فإن تقرحت كانت\
    \ نكهة سمكية ونفث نزر {cite:canon-ibn-sina-print-v2 p.352}"
  "en": "Its signs: a weak fever, a throbbing in the middle of the back, and a pain\
    \ — for the windpipe is not like the lung in lacking feeling — yet the pain is\
    \ light; body itching and hoarseness of the voice occur with it, and if it ulcerates\
    \ there is a fishy savour and a scant expectoration {cite:canon-ibn-sina-print-v2\
    \ p.352}"
  "ur": "اس کی علامات: کمزور حمى، پیٹھ کے درمیان دھڑکن اور درد کیونکہ نالی پھیپھڑے\
    \ کی طرح بے حس نہیں لیکن درد ہلکا ہوتا ہے اور اس کے ساتھ جسم کی خارش اور آواز\
    \ کا بیٹھنا ہوتا ہے اور اگر وہ زخمی ہو جائے تو مچھلی جیسا ذائقہ اور بہت کم نفث\
    \ ہوتا ہے {cite:canon-ibn-sina-print-v2 p.352}"
  "es": "Sus síntomas: fiebre leve, palpitaciones en la parte media de la espalda y dolor —pues la tráquea no carece de sensibilidad como el pulmón—, aunque el dolor es leve; se acompaña de picazón corporal y ronquera, y si se ulcera, hay sabor a pescado y escasa expectoración {cite:canon-ibn-sina-print-v2 p.352}"
  "fr": "Ses signes: une fièvre légère, des pulsations au milieu du dos et une douleur — car la trachée, contrairement au poumon, est sensible — mais la douleur est légère; des démangeaisons corporelles et un enrouement accompagnent la maladie, et en cas d'ulcération, un goût de poisson apparaît et les expectorations sont rares. {cite:canon-ibn-sina-print-v2 p.352}"
  "tr": "Bunun belirtileri hafif ateş, sırtın ortasında zonklama ve ağrıdır. Trakea, akciğer gibi hissedilemez, ancak hafif bir ağrıya neden olur. Bununla birlikte, vücutta kaşıntı ve ses kısıklığı da görülür. Ülserleşirse, balık gibi bir tadı olur ve az miktarda tükürük salgılanır. {cite:canon-ibn-sina-print-v2 s.352}"
  "id": "Gejalanya berupa demam ringan, denyutan di tengah punggung, dan nyeri. Trakea tidak seperti paru-paru karena tidak dapat diraba, tetapi terasa sedikit nyeri. Bersamaan dengan itu, terdapat gatal-gatal di sekujur tubuh dan suara serak. Jika terjadi ulserasi, rasanya seperti ikan dan terdapat sedikit air liur. {cite:canon-ibn-sina-print-v2 p.352}"
