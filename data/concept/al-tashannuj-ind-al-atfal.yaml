id: "concept/al-tashannuj-ind-al-atfal"
class: "concept"
kind: "scientific"
label:
  ar: "تشنج الصبيان"
  en: "Convulsion in children"
  fr: "Convulsions chez l’enfant"
  ur: "بچوں کا تشنج"
  es: "Convulsiones en niños"
  tr: "Erkek spazmları"
  id: "Kejang pria"
summary:
  ar: "الصبيان يسهل وقوعهم في التشنج لضعف قوى أدمغتهم وأعصابهم وضعف عضلهم، ويسهل خروجهم عنه لقوة قوى أكبادهم وقلوبهم ولأن أخلاطهم ليست بعاصية شديدة الغلظ؛ وأما من جاوز سبع سنين فلا يتشنج إلا لحمى صعبة جداً {cite:canon-ibn-sina-print-v2 p.143}"
  en: "Boys fall easily into convulsion for the weakness of the powers of their brains, nerves and muscles, and they come out of it easily for the strength of their livers' and hearts' powers and because their humours are not defiant and very gross; whoever passes seven years does not convulse except for a very hard fever {cite:canon-ibn-sina-print-v2 p.143}"
  fr: "Selon le Canon, les garçons sont facilement sujets aux convulsions à cause de la faiblesse de leur cerveau, de leurs nerfs et de leurs muscles. Ils s’en remettent facilement grâce à la vigueur du foie et du cœur et parce que leurs humeurs ne sont ni réfractaires ni très épaisses. Passé sept ans, seules les fièvres très graves provoquent des convulsions {cite:canon-ibn-sina-print-v2 p.143}"
  ur: "بچے آسانی سے تشنج میں گرتے ہیں اپنے دماغوں، اعصاب اور عضل کی قوتوں کے ضعف کے سبب، اور آسانی سے اس سے نکلتے ہیں اپنے جگروں اور دلوں کی قوتوں کی مضبوطی کے سبب اور اس لیے کہ ان کے اخلاط نافرمان اور سخت گاڑھے نہیں ہوتے؛ اور جو سات برس سے آگے ہو اسے سوائے بہت سخت بخار کے تشنج نہیں ہوتا {cite:canon-ibn-sina-print-v2 p.143}۔"
  es: "Los niños caen fácilmente en convulsiones debido a la debilidad de sus facultades cerebrales, nerviosas y musculares, y se recuperan fácilmente debido a la fortaleza de sus hígados y corazones, y porque sus humores no son rebeldes ni muy turbios; quien pasa de los siete años no sufre convulsiones excepto por una fiebre muy alta {cite:canon-ibn-sina-print-v2 p.143}"
  tr: "Erkek çocuklar, zayıf beyin ve sinir gücü ile kas zayıflığı nedeniyle nöbetlere daha yatkındır; karaciğer ve kalp gücü ve humorlarının çok inatçı olmaması ve çok sert olmaması nedeniyle daha kolay aşılırlar; yedi yaş üstü olanlarda ise sadece çok şiddetli ateş nedeniyle nöbet geçirirler {cite:canon-ibn-sina-print-v2 s.143}"
  id: "Anak laki-laki lebih rentan kejang karena kekuatan otak dan saraf yang lemah serta otot; mereka lebih mudah mengatasi karena kekuatan hati dan hati serta humor mereka tidak terlalu keras kepala atau terlalu keras; pada mereka yang berusia di atas tujuh tahun, mereka hanya mengalami kejang akibat demam yang sangat parah {cite:canon-ibn-sina-print-v2 hlm.143}"
