summary:
  ar: "خط ظهر أواخر القرن الثالث الهجري وسمّي تقليديًا الكوفي المشرقي أو المكسور، ويفضّل الباحثون اليوم تسميته «الأسلوب العباسي الجديد»؛ يتميز بشدة استقامة الحروف القائمة وحدة الزوايا والتباين بين الغليظ والرقيق {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 23}."
  en: "A script that emerged in the late ninth century, traditionally called eastern or broken kufic and now often termed the \"new Abbasid style\"; it is marked by very upright shafts, razor-sharp angles and a strong contrast of thick and thin strokes {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 23}."
  ur: "نویں صدی کے آخر میں ابھرنے والا خط جسے روایتی طور پر مشرقی یا شکستہ کوفی کہا گیا اور اب «نیا عباسی طرز» کہا جاتا ہے؛ اس کی پہچان سیدھی کھڑی شاخیں، تیز زاویے اور موٹی پتلی لکیروں کا تضاد ہے {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 23}۔"
