summary:
  ar: "ريحان سليمان في الكتاب نبات يوجد بجبال أصفهان يشبه الشبث الرطب، ويذكر الكتاب اختلافا في وصفه وإشارة إلى أنه الذي يسمى جمسفرم، لطيف مجفف، يطلى على الأورام والقروح وعلى النقرس وينفع من اللقوة ومن لدغ العقرب، ويذكر في الرحم نقلا موسوما {cite:canon-ibn-sina-print-v1 pp.661-662}"
  en: "Rayhan sulayman is in the book a plant found on the mountains of Isfahan that resembles fresh dill; the book notes a disagreement in its description and a pointer that it is the plant called jamsafram; it is subtle and drying, smeared on swellings, ulcers and gout, it benefits facial palsy and the sting of the scorpion, and the book also lists a labelled report on the womb {cite:canon-ibn-sina-print-v1 pp.661-662}"
  ur: "ریحان سلیمان کتاب میں ایک پودا ہے جو اصفہان کے پہاڑوں میں ملتا ہے اور تازہ سویا سے مشابہ ہے؛ کتاب اس کے وصف میں اختلاف اور اس طرف اشارہ ذکر کرتی ہے کہ وہ وہی ہے جسے جمسفرم کہا جاتا ہے؛ لطیف اور خشک کرنے والا ہے، ورموں، قرحوں اور نقرس پر لگایا جاتا ہے، لقوے اور بچھو کے ڈنک میں نافع ہے، اور کتاب رحم کے بارے میں منقول فہرست بھی درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.661-662}۔"
  es: "En el libro, Rayhan Sulayman menciona una planta que se encuentra en las montañas de Isfahán y que se asemeja al eneldo fresco; el libro señala una discrepancia en su descripción e indica que se trata de la planta llamada jamsafram; es sutil y secante, se aplica sobre hinchazones, úlceras y gota, beneficia la parálisis facial y la picadura de escorpión, y el libro también incluye un informe etiquetado sobre el útero {cite:canon-ibn-sina-print-v1 pp.661-662}."
  fr: "Le livre mentionne Rayhan Sulayman comme une plante des montagnes d'Ispahan ressemblant à de l'aneth fraîche; il y est fait mention d'une divergence dans sa description et d'une indication selon laquelle il s'agirait en réalité de la plante appelée jamsafram. Cette plante, aux propriétés subtiles et asséchantes, est appliquée sur les gonflements, les ulcères et la goutte. Elle serait bénéfique en cas de paralysie faciale et de piqûre de scorpion. Le livre fait également état d'un rapport commenté concernant l'utérus {cite:canon-ibn-sina-print-v1 pp.661-662}."
  tr: "Kitaptaki Fesleğen Süleyman, İsfahan dağlarında bulunan ve ıslak dereotu benzeri bir bitkidir. Kitapta çeşitli açıklamalardan bahsedilir ve Jamsfarm olarak adlandırılan, tümörleri, ülserleri ve gutu kaplayan nazik kuru bir bitkiye atıfta bulunur; sokma ve akrep sokmaları için faydalıdır ve rahimde bulaşan bir maddeden bahseder {cite:canon-ibn-sina-print-v1 s.661-662}"
  id: "Basil Suleiman dalam buku ini adalah tanaman yang ditemukan di pegunungan Isfahan yang menyerupai dill basah. Buku ini menyebutkan variasi dalam deskripsinya dan merujuk pada apa yang disebut Jamsfarm, tanaman kering lembut yang melapisi tumor, tukak lambung, dan asam urat, berguna untuk sengatan dan sengatan kalajengking, serta menyebutkan benda yang ditularkan di dalam kandungan {cite:canon-ibn-sina-print-v1 hlm.661-662}"
