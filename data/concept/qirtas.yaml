  es: "En el libro, Qirtas es caliente en el primer grado y seco en el segundo; su forma quemada previene la expectoración de sangre y las hemorragias nasales y beneficia la tiña {cite:canon-ibn-sina-print-v1 pp.654-655}"
  fr: "Le Qirtas est décrit dans le livre comme chaud au premier degré et sec au second; sa forme brûlée prévient les crachats de sang et les saignements de nez et est bénéfique en cas de teigne {cite:canon-ibn-sina-print-v1 pp.654-655}"
