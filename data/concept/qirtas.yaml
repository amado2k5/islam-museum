  ar: "القرطاس في الكتاب حار في الأولى يابس في الثانية، ومحرقه يمنع نفث الدم والرعاف وينفع من السعفة {cite:canon-ibn-sina-print-v1 pp.654-655}"
  en: "Qirtas is in the book hot in the first degree and dry in the second; its burnt form prevents the spitting of blood and nosebleed and benefits tinea {cite:canon-ibn-sina-print-v1 pp.654-655}"
