label:
  ar: "السعال"
  en: "The cough"
  fr: "La toux"
  ur: "کھانسی"
  es: "La tos"
summary:
  ar: "السعال من الحركات التي تدفع بها الطبيعة أذى عن عضو ما وهذا العضو يشاركها، والسعال للصدر كالعطاس للدماغ، ويتم بانبساط الصدر وانقباضه وحركة الحجاب، وهو إما لسبب خاص بالرئة وإما على سبيل المشاركة، والسبب الموجب إما باد وإما واصل وإما سابق: فالبادية منها برد يصيب الرئة والعضلات في الصدر أو شيء يشنجها أو ميبس أو مخشن مثل غبار أو دخان أو طعم حامض أو عفص أو حريف أو شيء غريب يقع في المجرى الذي لا يقبل غير النفس كما يعرض من سقوط شيء من الطعام أو الشراب في ذلك المجرى لغفلة أو اشتغال بكلام، والواصلة أسباب بدنية مسخنة أو مبرّدة أو مرطبة أو مجففة بغير مادة أو بمادة دموية أو صفراوية أو بلغمية رقيقة أو غليظة أو سوداوية والمادة إن كانت منصبة من فوق ما دامت تنزلق على القصبة لم تهيج كثير سعال فإذا أرادت أن تنصب في فضاء القصبة أو استقرت في الرئة هاج السعال وقد تكون مندفعة من المعدة أو الكبد أو من بعض أعضاء الصدر إلى بعضها ومتولدة فيه وقد تكون بسبب انحلال الفرد وبسبب الأورام والسدد في الحجاب أو في الرئة أو الحلقوم وجميع المواضع القابلة لهذه المواد والآفات من الرئة والحاجز وحجاب ما بين القلب والرئة، والسابقة الامتلاء وتقدم أسباب بدنية للواصلة، وأما الكائن بالمشاركة فمثل الذي يكون بمشاركة البدن كله في الحميات خصوصاً مع حمى محرقة أو حمى يوم تعبية أو وبائية أو بمشاركة البدن بغير حمى {cite:canon-ibn-sina-print-v2 p.327}"
  en: "The cough is one of the motions by which nature pushes a harm off an organ, and this organ shares with it; the cough is to the chest what the sneeze is to the brain, and it is done by the chest's expansion and contraction and the diaphragm's motion. It is either for a cause proper to the lung or by way of participation, and the bringing cause is either remote, proximate or preceding: among the remote, a cold striking the lung and the muscles in the chest, or something that cramps it, or a drier or a roughener like dust or smoke or a sour, astringent or acrid food-taste, or a foreign thing falling into the passage that admits nothing but the breath — as the cough arising when something of food or drink falls into that passage by heedlessness or preoccupation with talk. The proximate are bodily causes heating, cooling, moistening or drying the temperament, without matter or with a sanguine, bilious, thin or thick phlegmy, or melancholic matter; if that matter pours down from above, while it slides along the windpipe as a thing slides on a wall it stirs little cough, but when it would pour into the windpipe's hollow, or settles in the lung, the cough is stirred; it may be pushed from the stomach or the liver or from some chest organ to another and be engendered in it, and it may be by dissolution of the unity and by the tumours and obstructions in the diaphragm, the lung or the fauces, and all the sites receptive of these matters and afflictions, of the lung, the partition and the membrane between heart and lung. The preceding are the fullness and the bodily causes preceding the mentioned proximate ones; and the cough existing by participation is like what exists by the whole body's participation in the fevers, especially with a burning fever or a wearying ephemeral fever or an epidemic, or by the body's participation without fever {cite:canon-ibn-sina-print-v2 p.327}"
  fr: "Selon le livre, la toux est l’un des mouvements par lesquels la nature écarte d’un organe ce qui lui nuit, cet organe prenant part au mouvement. La toux est à la poitrine ce que l’éternuement est au cerveau. Elle se produit par la dilatation et la contraction de la poitrine et par le mouvement du diaphragme. Sa cause est propre au poumon ou tient à la participation d’un autre organe. La cause qui la déclenche peut être éloignée, prochaine ou antécédente. Parmi les causes éloignées figurent le froid qui frappe le poumon et les muscles de la poitrine, une substance qui les resserre, un agent desséchant ou irritant comme la poussière, la fumée ou la saveur aigre, astringente ou âcre d’un aliment, ou encore un corps étranger qui tombe dans le conduit qui ne laisse passer que le souffle. C’est le cas lorsqu’un aliment ou une boisson y pénètre par inattention ou parce que l’on est occupé à parler. Les causes prochaines sont corporelles et échauffent, refroidissent, humidifient ou assèchent le tempérament, sans matière ou avec une matière sanguine, bilieuse, flegmatique (fluide ou épaisse) ou mélancolique. Si cette matière descend d’en haut, elle ne provoque guère de toux tant qu’elle glisse le long de la trachée comme sur un mur ; la toux se déclenche lorsqu’elle tend à pénétrer dans la lumière de la trachée ou se dépose dans le poumon. La matière peut être chassée de l’estomac, du foie ou d’un organe de la poitrine vers un autre, ou se former dans cet autre organe. La toux peut aussi provenir d’une rupture de continuité ou de gonflements et d’obstructions dans le diaphragme, le poumon ou l’isthme du gosier, et dans tous les sièges susceptibles de recevoir ces matières et ces affections : ceux du poumon, de la cloison et de la membrane entre le cœur et le poumon. Les causes antécédentes sont la plénitude et les causes corporelles qui précèdent les causes prochaines déjà mentionnées. La toux par participation peut mettre en jeu l’ensemble du corps dans les fièvres, surtout une fièvre ardente, une fièvre éphémère épuisante ou une fièvre épidémique, ou faire intervenir le corps sans fièvre {cite:canon-ibn-sina-print-v2 p.327}"
  ur: "کھانسی ان حرکتوں میں سے ہے جن سے فطرت کسی عضو سے تکلیف دور کرتی ہے اور یہ عضو اس میں شریک ہوتا ہے؛ کھانسی سینے کے لیے وہی ہے جو چھینک دماغ کے لیے؛ یہ سینے کے پھیلنے سکڑنے اور حجاب کی حرکت سے ہوتی ہے؛ یہ یا تو پھیپھڑے کے خاص سبب سے ہوتی ہے یا شرکت کے طریق پر؛ اور سبب یا بعید ہے یا قریب یا سابق: بعید اسباب میں سے ٹھنڈ جو پھیپھڑے اور سینے کے پٹھوں کو لگے یا کوئی چیز جو اسے تشنج دے یا خشک کرنے والی یا خشن کرنے والی جیسے غبار دھواں یا ترش عفص یا تیز ذائقہ خوراک یا کوئی اجنبی چیز جو اس مجری میں گر جائے جس میں سانس کے سوا کچھ قبول نہیں جیسا کہ کھانے پینے کا کچھ غفلت یا بات میں مشغولیت سے اس مجری میں گر جانے سے ہوتا ہے؛ قریب اسباب جسمانی اسباب ہیں جو مزاج کو گرم ٹھنڈا مرطب یا خشک کرتے ہیں بغیر مادے یا دموہ صفراوی بلغمی پتلی یا گاڑھی یا سوداوی مادے کے ساتھ؛ اگر وہ مادہ اوپر سے بہتا ہو تو جب تک نالی پر پھسلتا رہتا ہے جیسے کوئی چیز دیوار پر پھسلتی ہے زیادہ کھانسی نہیں ابھارتا لیکن جب نالی کے خلا میں بہنے لگے یا پھیپھڑے میں ٹھہر جائے تو کھانسی ابھرتی ہے؛ اور یہ معدے یا جگر سے یا سینے کے کسی عضو سے دوسرے کی طرف دھکیلا ہوا اور اس میں پیدا ہوا ہو سکتا ہے اور وحدت کے انحلال سے اور حجاب یا پھیپھڑے یا حلقوم کی سوجنوں اور رکاوٹوں سے بھی ہو سکتی ہے اور ان تمام مقامات میں جو ان مادوں اور آفتوں کو قبول کرتے ہیں؛ سابقہ اسباب امتلاء اور قریب اسباب سے پہلے کے جسمانی اسباب ہیں؛ اور شرکت سے ہونے والی کھانسی جیسے پورے بدن کی شرکت سے بخاروں میں خاص طور پر جلانے والی بخار یا تھکا دینے والی روزانہ بخار یا وبائی کے ساتھ یا بغیر بخار کے بدن کی شرکت سے {cite:canon-ibn-sina-print-v2 p.327}"
  es: "La tos es uno de los movimientos por los cuales la naturaleza expulsa un daño de un órgano, y este órgano comparte con ella; la tos es al pecho lo que el estornudo es al cerebro, y se produce por la expansión y contracción del pecho y el movimiento del diafragma. Se debe a una causa propia del pulmón o por participación, y la causa que la provoca puede ser remota, próxima o precedente: entre las remotas, un resfriado que afecta al pulmón y a los músculos del pecho, o algo que lo acalambra, o un agente secante o áspero como el polvo o el humo o un sabor agrio, astringente o acre de la comida, o algo extraño que cae en el conducto que solo admite la respiración, como la tos que surge cuando algo de comida o bebida cae en ese conducto por descuido o preocupación por hablar. Las próximas son causas corporales que calientan, enfrían, humedecen o resecan el temperamento, sin materia o con una materia sanguínea, biliosa, flemática ligera o espesa, o melancólica; Si esa materia cae desde arriba, mientras se desliza por la tráquea como algo se desliza por una pared, provoca poca tos; pero cuando se vierte en la cavidad de la tráquea o se asienta en el pulmón, la tos se intensifica. Puede ser empujada desde el estómago o el hígado, o desde algún órgano del tórax a otro, y engendrarse en él. También puede deberse a la disolución de la unidad, a los tumores y obstrucciones en el diafragma, el pulmón o las fauces, y a todos los sitios receptivos a estas materias y afecciones, del pulmón, el tabique y la membrana entre el corazón y el pulmón. Lo anterior son la plenitud y las causas corporales que preceden a las próximas mencionadas; y la tos que existe por participación es como la que existe por la participación de todo el cuerpo en las fiebres, especialmente con una fiebre ardiente, una fiebre efímera y debilitante o una epidemia, o por la participación del cuerpo sin fiebre. {cite:canon-ibn-sina-print-v2 p.327}"
