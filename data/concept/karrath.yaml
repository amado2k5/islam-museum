label:
  ar: "كَرَّاث"
  en: "Leek (karrath)"
  ur: "گندنا (کراث)"
summary:
  ar: "الكراث بقل معروف خبيث الرائحة، وهو غير الثوم والبصل والفجل. واتفق الفقهاء على أن أكل ما له رائحة كريهة كالبصل والثوم والكراث والفجل عذر يبيح التخلف عن الجماعة إذا تعذر زوال رائحته، لحديث جابر، ويكره أكله لغير من يريد المسجد عند الجمهور. وللزوج منع زوجته من أكله عند الجمهور. وفي السلم فيه خلاف، فأجازه المالكية والشافعية وأبطله الحنفية، وأجمع الفقهاء في الجملة على صحة بيعه بعد بدو صلاحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
  en: "Karrath is a known plant of foul smell, distinct from garlic, onion and radish. The jurists agree that eating a strong-smelling plant such as onion, garlic, leek or radish is an excuse to stay away from congregational prayer when the smell cannot be removed, on the hadith of Jabir. Eating it without intending to go to the mosque is disliked. Most jurists allow the husband to stop his wife eating such things. On salam in leeks the Malikis and Shafi'is allow it and the Hanafis refuse it. The jurists in general accept the sale of leek once it has ripened, on the hadith forbidding the sale of fruit before its ripeness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
  ur: "کراث ایک معروف سبزی ہے جس کی بو ناگوار ہوتی ہے، اور یہ لہسن، پیاز اور مولی سے الگ ہے۔ فقہاء کا اتفاق ہے کہ پیاز، لہسن، کراث اور مولی جیسی تیز بو والی چیزیں کھانا جماعت سے پیچھے رہنے کا عذر ہے جب بو زائل ہونا ممکن نہ ہو، حضرت جابر کی حدیث کی بنیاد پر۔ جمہور کے نزدیک مسجد جانے کا ارادہ نہ ہو تب بھی اسے کھانا مکروہ ہے، اور شوہر بیوی کو ایسی چیزوں کے کھانے سے روک سکتا ہے۔ کراث کے سلم میں مالکیہ اور شافعیہ جواز کے قائل ہیں جبکہ حنفیہ منع کرتے ہیں، اور پکنے کے بعد بیع کا جواز عام طور پر تسلیم کیا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
