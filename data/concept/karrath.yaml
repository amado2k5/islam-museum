summary:
  ar: "الكراث بقل معروف خبيث الرائحة، وهو غير الثوم والبصل والفجل. واتفق الفقهاء على أن أكل ما له رائحة كريهة كالبصل والثوم والكراث والفجل عذر يبيح التخلف عن الجماعة إذا تعذر زوال رائحته، لحديث جابر، ويكره أكله لغير من يريد المسجد عند الجمهور. وللزوج منع زوجته من أكله عند الجمهور. وفي السلم فيه خلاف، فأجازه المالكية والشافعية وأبطله الحنفية، وأجمع الفقهاء في الجملة على صحة بيعه بعد بدو صلاحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
  en: "Karrath is a known plant of foul smell, distinct from garlic, onion and radish. The jurists agree that eating a strong-smelling plant such as onion, garlic, leek or radish is an excuse to stay away from congregational prayer when the smell cannot be removed, on the hadith of Jabir. Eating it without intending to go to the mosque is disliked. Most jurists allow the husband to stop his wife eating such things. On salam in leeks the Malikis and Shafi'is allow it and the Hanafis refuse it. The jurists in general accept the sale of leek once it has ripened, on the hadith forbidding the sale of fruit before its ripeness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
  ur: "کراث ایک معروف سبزی ہے جس کی بو ناگوار ہوتی ہے، اور یہ لہسن، پیاز اور مولی سے الگ ہے۔ فقہاء کا اتفاق ہے کہ پیاز، لہسن، کراث اور مولی جیسی تیز بو والی چیزیں کھانا جماعت سے پیچھے رہنے کا عذر ہے جب بو زائل ہونا ممکن نہ ہو، حضرت جابر کی حدیث کی بنیاد پر۔ جمہور کے نزدیک مسجد جانے کا ارادہ نہ ہو تب بھی اسے کھانا مکروہ ہے، اور شوہر بیوی کو ایسی چیزوں کے کھانے سے روک سکتا ہے۔ کراث کے سلم میں مالکیہ اور شافعیہ جواز کے قائل ہیں جبکہ حنفیہ منع کرتے ہیں، اور پکنے کے بعد بیع کا جواز عام طور پر تسلیم کیا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
  es: "El karrath es una planta de olor fétido, distinto del ajo, la cebolla y el rábano. Los juristas coinciden en que comer una planta de olor fuerte como la cebolla, el ajo, el puerro o el rábano es una excusa para no asistir a la oración en congregación cuando el olor es persistente, según el hadiz de Jabir. Comerlo sin intención de ir a la mezquita es desaconsejable. La mayoría de los juristas permiten que el marido impida a su esposa comer tales alimentos. Respecto al salam (saludo) en los puerros, los malikíes y shafiíes lo permiten, mientras que los hanafíes lo rechazan. En general, los juristas aceptan la venta de puerros una vez maduros, según el hadiz que prohíbe la venta de fruta antes de su maduración. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13242} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13243} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
  fr: "Le karrath est une plante connue pour son odeur nauséabonde, différente de l'ail, de l'oignon et du radis. Les juristes s'accordent à dire que la consommation d'une plante à forte odeur comme l'oignon, l'ail, le poireau ou le radis constitue une excuse pour s'abstenir de la prière en congrégation lorsque l'odeur persiste, conformément au hadith de Jabir. En revanche, il est déconseillé d'en consommer sans intention de se rendre à la mosquée. La plupart des juristes autorisent le mari à interdire à sa femme d'en consommer. Concernant le salam (samedi) dans les poireaux, les écoles malikite et chaféite l'autorisent, tandis que l'école hanafite le refuse. De manière générale, les juristes acceptent la vente de poireaux mûrs, conformément au hadith interdisant la vente de fruits avant maturité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
  tr: "Pırasa, sarımsak, soğan ve turplardan farklı olarak kötü kokuya sahip olduğu bilinir. Fahiller, soğan, sarımsak, pırasa ve turp gibi kötü kokan her şeyi yemenin, cemaatten uzak durma bahanesi olduğunu, kokusunu gideremeyecekse cemaatten uzak durmayı kabul ettiğini kabul etmişlerdir; bu bahane Cebir'in hadislerine göre ve çoğunluğun önünde camiye gitmek isteyenler dışında kimse tarafından sevilmez. Bir koca, karısının çoğunluğun önünde yemesini engelleyebilir. Cemaat konusunda görüş ayrılığı vardır: Malikiler ve Şafi'ler buna izin verirken, Hanafiler reddeder ve hukukçular oybirliğiyle sağlıklı hale geldikten sonra satılmasının geçerli olduğuna karar verirler. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13245}"
  id: "Bawang bawang diketahui memiliki bau tidak sedap, berbeda dengan bawang putih, bawang, dan lobak. Para ahli hukum sepakat bahwa memakan apa pun yang berbau tidak sedap, seperti bawang, bawang putih, daun bawang, dan lobak, adalah alasan yang memungkinkan pantang dari jamaah jika baunya tidak bisa dihilangkan, menurut hadits Jabir, dan tidak disukai oleh siapa pun selain mereka yang ingin pergi ke masjid di depan mayoritas. Seorang suami dapat melarang istrinya memakannya di depan mayoritas. Ada perbedaan pendapat mengenai jemaat: Malikis dan Shafi'i mengizinkannya dan Hanafi menolaknya, dan para ahli hukum sepakat bahwa penjualannya sah setelah menjadi sehat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13242} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13243} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245}"
