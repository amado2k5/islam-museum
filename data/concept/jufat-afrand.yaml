summary:
  ar: "شيء صنوبري الشكل، في رأسه كالشوكتين، ويشبه اللوز أحياناً، وربما ينشق وينفتح؛ وفي الهامش أنه لفظ فارسي لنبات، ويذكر الكتاب أنه يزيد الباه {cite:canon-ibn-sina-print-v1 p.423}."
  en: "A thing shaped like a pine cone, with two spines at its head, sometimes like an almond, and sometimes it splits open. The footnote says the word is Persian and names a plant. The book lists it for stirring desire {cite:canon-ibn-sina-print-v1 p.423}."
  ur: "ایک چیز جو صنوبر کی شکل کی ہے، جس کے سر پر دو کانٹوں جیسی ابھار ہیں، کبھی بادام سے ملتی ہے اور کبھی پھٹ جاتی ہے؛ حاشیے کے مطابق یہ فارسی لفظ ہے اور ایک پودے کا نام ہے۔ کتاب اسے جماع کی خواہش بڑھانے والا بیان کرتی ہے {cite:canon-ibn-sina-print-v1 p.423}۔"
