  en: "Secularism and Islam — conflict or concord"
issue:
  ar: "هل العلاقة بين العلمانية والإسلام صدام بالضرورة أم يمكن الالتقاء، وهل العلمانية نموذج واحد؟"
summary:
  ar: "حلقة «الوسطية» عن العلمانية والإسلام. صوّت الشباب: 43% يستطيعون تعريف العلمانية و57% لا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:06:00} وعلى انتشارها في العالم العربي: 24% ضعيف و42% متوسط والباقي قوي؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:27:00} وعلى إمكان الالتقاء: 65% يرون استحالة المعادلة وثلث يرونه ممكناً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:45:30} وفرّق المتحاورون بين حدٍّ أدنى (فصل الدين عن السياسة) وحدٍّ أعلى (فصله عن الحياة كلها)، وبيّن عمر الشوبكي أن العلمانية ليست نموذجاً واحداً: الفرنسي (اللايكية) يمنع أي مظهر ديني في المؤسسات العامة، والأنجلوساكسوني يسمح بالمظهر الشخصي ويمنع تبنّي الدولة، والتركي كان أقساها تطبيقاً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:18:00}"
  en: "The 'Al-Wasatiyya' episode on secularism and Islam. The studio youth voted: 43% could define secularism, 57% could not; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:06:00} on its spread in the Arab world: 24% weak, 42% medium, the rest strong; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:27:00} on whether the two can meet: 65% judged the equation impossible, a third possible. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:45:30} Panelists distinguished a minimum level (separating religion from politics) from a maximum (separating it from all of life), and Omar al-Shobaki showed secularism is not one model: the French (laïcité) bars every religious symbol in public institutions, the Anglo-Saxon permits personal observance but not state adoption, and the Turkish was the harshest in practice. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:18:00}"
