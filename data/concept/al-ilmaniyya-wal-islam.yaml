issue:
  ar: "هل العلاقة بين العلمانية والإسلام صدام بالضرورة أم يمكن الالتقاء، وهل العلمانية نموذج واحد؟"
summary:
  ar: "حلقة «الوسطية» عن العلمانية والإسلام. صوّت الشباب: 43% يستطيعون تعريف العلمانية و57% لا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:06:00} وعلى انتشارها في العالم العربي: 24% ضعيف و42% متوسط والباقي قوي؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:27:00} وعلى إمكان الالتقاء: 65% يرون استحالة المعادلة وثلث يرونه ممكناً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:45:30} وفرّق المتحاورون بين حدٍّ أدنى ⁦(فصل الدين عن السياسة)⁩ وحدٍّ أعلى ⁦(فصله عن الحياة كلها)⁩، وبيّن عمر الشوبكي أن العلمانية ليست نموذجاً واحداً: الفرنسي ⁦(اللايكية)⁩ يمنع أي مظهر ديني في المؤسسات العامة، والأنجلوساكسوني يسمح بالمظهر الشخصي ويمنع تبنّي الدولة، والتركي كان أقساها تطبيقاً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:18:00}"
  en: "The 'Al-Wasatiyya' episode on secularism and Islam. The studio youth voted: 43% could define secularism, 57% could not; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:06:00} on its spread in the Arab world: 24% weak, 42% medium, the rest strong; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:27:00} on whether the two can meet: 65% judged the equation impossible, a third possible. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:45:30} Panelists distinguished a minimum level (separating religion from politics) from a maximum (separating it from all of life), and Omar al-Shobaki showed secularism is not one model: the French (laïcité) bars every religious symbol in public institutions, the Anglo-Saxon permits personal observance but not state adoption, and the Turkish was the harshest in practice. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:18:00}"
  fr: "L'épisode d'« Al-Wasatiyya » sur la laïcité et l'islam. Les jeunes du studio ont voté : 43 % savaient définir la laïcité, 57 % non ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:06:00} sur sa diffusion dans le monde arabe : 24 % faible, 42 % moyenne, le reste forte ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:27:00} sur la possibilité que les deux se rencontrent : 65 % ont jugé l'équation impossible, un tiers possible. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:45:30} Les intervenants ont distingué un niveau minimal (séparer la religion de la politique) d'un niveau maximal (la séparer de toute la vie), et Omar al-Shobaki a montré que la laïcité n'est pas un modèle unique : le modèle français (laïcité) interdit tout symbole religieux dans les institutions publiques, le modèle anglo-saxon permet la pratique personnelle mais non l'adoption par l'État, et le modèle turc fut le plus dur dans la pratique. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:18:00}"
  es: "El episodio de 'Al-Wasatiyya' sobre el secularismo y el Islam. Los jóvenes del estudio votaron: el 43% pudo definir el secularismo, el 57% no; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:06:00} sobre su difusión en el mundo árabe: el 24% débil, el 42% medio, el resto fuerte; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:27:00} sobre si ambos pueden coexistir: el 65% consideró la ecuación imposible, un tercio posible. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:45:30} Los panelistas distinguieron un nivel mínimo (separar la religión de la política) de un máximo (separarla de todos los aspectos de la vida), y Omar al-Shobaki demostró que el secularismo no es un solo modelo: el francés (laïcité) prohíbe todo símbolo religioso en las instituciones públicas, el anglosajón permite la observancia personal pero no la adopción estatal, y el turco fue el más estricto en la práctica. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:18:00}"
  ur: "سیکولرازم اور اسلام پر 'الوصطیہ' قسط۔ اسٹوڈیو کے نوجوانوں نے ووٹ دیا: 43% سیکولرازم کی تعریف کر سکتے ہیں، 57% نہیں کر سکتے۔ عرب دنیا میں اس کے پھیلاؤ پر: 24% کمزور، 42% درمیانے، باقی مضبوط؛ {حوالہ:اسابیل-طارق-السویدان الوصیتیہ/ep05 00:27:00} اس بارے میں کہ آیا دونوں مل سکتے ہیں: 65% نے مساوات کو ناممکن سمجھا، ایک تہائی ممکن۔ {حوالہ: assabile-tareq-al-suwaidan al-wasitiya/ep05 00:45:30} پینلسٹس نے کم از کم سطح ⁦(مذہب کو سیاست سے الگ کرنا)⁩ کو زیادہ سے زیادہ ⁦(اسے تمام زندگی سے الگ کرنا)⁩ میں فرق کیا، اور عمر الشوبکی نے دکھایا کہ سیکولرازم ایک ماڈل نہیں ہے: فرانسیسی ⁦(عوامی علامت)⁩ میں ہر ایک مذہبی ادارہ ذاتی تعمیل کی اجازت دیتا ہے لیکن ریاست کو اپنانے کی نہیں، اور ترک عملی طور پر سب سے سخت تھا۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ایپ05 00:15:00} {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ایپ05 00:16:00} {حوالہ:اصابیل-طارق-السویدان الواصطیہ:08:08:08}"
  tr: "\"Ilımlılık\" bölümü, sekülerlik ve İslam hakkında. Gençlerin sesi: %43 laikliği tanımlayabilir, %57 tanımlayamaz; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:06:00} Arap dünyasındaki yaygınlığı hakkında: %24 zayıf, %42 ılımlı, geri kalanlar güçlü; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:27:00} Ve buluşma olasılığı hakkında: %65 denklemi imkansız, üçte biri ise mümkün görüyor. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:45:30} Muhatabarlar, dini siyasetten ayıran asgari bir sınır ile tüm yaşamdan ayıran daha yüksek bir sınır arasında ayrım yaptılar ve Omar Al-Shobaki laikliğin tek bir model olmadığını açıkladı: Fransızca (Laician) kamu kurumlarında herhangi bir dini görünümü yasaklar, Anglo-Saksonca kişisel görünümü ve devlet evlat edinmeyi yasaklar, Türkçe ise en sert uygulama yöntemidir. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:18:00}"
  id: "Bagian \"moderasi\" membahas sekularisme dan Islam. Suara pemuda: 43% dapat mendefinisikan sekularisme, 57% tidak bisa; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:06:00} Tentang prevalensinya di dunia Arab: 24% lemah, 42% moderat, sisanya kuat; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:27:00} Dan tentang kemungkinan tercapai: 65% menganggap persamaan itu mustahil, dan sepertiga menganggapnya mungkin. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:45:30} Para lawan bicara membedakan antara batas minimum yang memisahkan agama dari politik dan batas yang lebih tinggi yang memisahkannya dari semua kehidupan, dan Omar Al-Shobaki menjelaskan bahwa sekularisme bukanlah satu model tunggal: bahasa Prancis (Laician) melarang penampilan agama di institusi publik, Anglo-Saxon melarang penampilan pribadi dan adopsi negara, dan Turki adalah metode penegakan yang paling keras. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep05 00:18:00}"
