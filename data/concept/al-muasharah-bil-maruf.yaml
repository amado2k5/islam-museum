id: concept/al-muasharah-bil-maruf
class: concept
kind: ethical
label:
  ar: "المعاشرة بالمعروف"
  en: "Living with a spouse in kindness (mu'ashara bil-ma'ruf)"
  ur: "معروف کے ساتھ معاشرت"
summary:
  ar: "يفرّق الشعراوي بين المودة والمعروف: المودة ميل قلبي، والمعروف حسن معاملة تُبذل ولو لم يكن ميل. ويستدل على ذلك بقوله تعالى «عاشروهن بالمعروف»، وبأن الكراهية في جانب قد يقابلها خير في جوانب أخرى، ويذكر قصة عمر مع رجل أراد طلاق امرأته لأنه يكرهها {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2080}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2082}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2083}."
  en: "Al-Sha'rawi separates affection (mawadda), a feeling of the heart, from kindness (ma'ruf), good conduct owed even without affection. He reads the command 'live with them in kindness' this way, holds that a dislike in one respect may be matched by good in others, and recounts a story of Umar with a man who wished to divorce his wife because he disliked her {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2080}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2082}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2083}."
  ur: "شعراوی مودّت (دل کی محبت) اور معروف (اچھا برتاؤ جو محبت کے بغیر بھی لازم ہے) میں فرق کرتے ہیں۔ ان کے مطابق کسی ایک پہلو میں ناپسندیدگی کے باوجود دوسرے پہلوؤں میں بھلائی ہو سکتی ہے، اور وہ حضرت عمر کا ایک واقعہ نقل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2080}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2082}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2083}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "هل يشترط الزواج المحبة، وماذا يلزم الزوج إذا كرهت امرأته؟"
  en: "Does marriage require affection, and what does a husband owe when he dislikes his wife?"
  ur: "کیا نکاح کے لیے محبت شرط ہے، اور ناپسندیدگی کی صورت میں شوہر پر کیا لازم ہے؟"
