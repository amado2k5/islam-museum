id: concept/malaikat-zakariyya
class: concept
kind: angel
label:
  ar: ملائكة زكريا
  en: The Angels of Zakariya
  ur: زکریا کے فرشتے
  es: "Los ángeles de Zakariya"
  fr: "Les Anges de Zakariya"
  tr: "Zakeriye'nin Melekleri"
  id: "Malaikat Zachariah"
summary:
  ar: ملائكة نادوا زكريا في المحراب بالبشارة بيحيى، وهم الذين بشره الله به؛ وتروي القصة في سورة آل عمران [[passage/quran-3-39|آل عمران 39]] وسورة مريم [[passage/quran-19-17|مريم 17]] وسورة الأنبياء [[passage/quran-21-90|الأنبياء 90]].
  en: Angels who called out to Zakariya in the prayer niche with the glad tidings of Yahya, whom God had promised him; the story is told in Al 'Imran [[passage/quran-3-39|3:39]], Maryam [[passage/quran-19-17|19:17]] and al-Anbiya' [[passage/quran-21-90|21:90]].
  ur: وہ فرشتے جنہوں نے زکریا کو محراب میں پکار کر یحییٰ کی بشارت دی جو خدا نے اس سے وعدہ کی تھی؛ یہ کہانی آل عمران [[passage/quran-3-39|آل عمران 39]] اور مریم [[passage/quran-19-17|مریم 17]] اور الانبیاء [[passage/quran-21-90|الانبیاء 90]] میں آئی ہے۔
  es: "Ángeles que llamaron a Zacarías en el nicho de oración con las buenas nuevas de Yahya, a quien Dios le había prometido; la historia se cuenta en Al 'Imran [[passage/quran-3-39|3:39]], Maryam [[passage/quran-19-17|19:17]] y al-Anbiya' [[passage/quran-21-90|21:90]]."
  fr: "Des anges qui appelèrent Zakariya dans la niche de prière avec la bonne nouvelle de Yahya, que Dieu lui avait promis; l'histoire est racontée dans Al 'Imran [[passage/quran-3-39|3:39]], Maryam [[passage/quran-19-17|19:17]] et al-Anbiya' [[passage/quran-21-90|21:90]]."
  tr: "Melekler, Yahya'nın müjdesini namazda Zekeriye'yi çağırdı ve Allah'ın onlara müjde verdiği kişilerdi; hikaye İmran Suresi'nde [[pasaj/kuran-3-39|İmran 39], Meryem Suresi [[pasaj/kuran-19-17|Meryem 17] ve Enbiya Suresi'nde [[pasaj/kuran-21-90|El-Enbiya 90]]] anlatılır."
  id: "Malaikat memanggil Zakharia di ceruk doa dengan kabar baik Yahya, dan merekalah yang Allah berikan kabar gembira; kisah ini diceritakan dalam Surah Al-Imran [[ayat/al-quran-3-39|Al Imran 39], Surah Maryam [[ayat/al-quran-19-17|Maryam 17], dan Surah Al-Anbiya [[ayat/al-quran-21-90|Al-Anbiya 90]]."
