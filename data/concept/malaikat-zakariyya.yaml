label:
  ar: ملائكة زكريا
  en: The Angels of Zakariya
  ur: زکریا کے فرشتے
summary:
  ar: ملائكة نادوا زكريا في المحراب بالبشارة بيحيى، وهم الذين بشره الله به؛ وتروي القصة في سورة آل عمران [[passage/quran-3-39|آل عمران 39]] وسورة
    مريم [[passage/quran-19-17|مريم 17]] وسورة الأنبياء [[passage/quran-21-90|الأنبياء 90]].
  en: Angels who called out to Zakariya in the prayer niche with the glad tidings of Yahya, whom God had promised him; the story is told in Al
    'Imran [[passage/quran-3-39|3:39]], Maryam [[passage/quran-19-17|19:17]] and al-Anbiya' [[passage/quran-21-90|21:90]].
  ur: وہ فرشتے جنہوں نے زکریا کو محراب میں پکار کر یحییٰ کی بشارت دی جو خدا نے اس سے وعدہ کی تھی؛ یہ کہانی آل عمران [[passage/quran-3-39|آل عمران
    39]] اور مریم [[passage/quran-19-17|مریم 17]] اور الانبیاء [[passage/quran-21-90|الانبیاء 90]] میں آئی ہے۔
