summary:
  ar: "في الفصل الرابع يتتبع ابن سينا القيفال والإبطي في العضد والساعد، ويذكر الأكحل والباسليق والأسيلم وتفرعها إلى أصابع اليد {cite:canon-ibn-sina-print-v1 p.91}."
  en: "In the fourth chapter Ibn Sina follows the cephalic and axillary veins in the upper arm and forearm, and names the median cubital, the basilic and the salvatella and their branching to the fingers {cite:canon-ibn-sina-print-v1 p.91}."
  es: "En el cuarto capítulo, Ibn Sina sigue las venas cefálica y axilar en la parte superior del brazo y el antebrazo, y nombra la cubital mediana, la basílica y la salvatella y sus ramificaciones hacia los dedos {cite:canon-ibn-sina-print-v1 p.91}."
  fr: "Dans le quatrième chapitre, Ibn Sina suit les veines céphaliques et axillaires dans le bras et l'avant-bras, et nomme la veine médiane cubitale, la veine basilique et la veine salvatella et leurs ramifications vers les doigts {cite:canon-ibn-sina-print-v1 p.91}."
