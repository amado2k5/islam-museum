summary:
  ar: "خزف فارسي سلجوقي من القرن الثاني عشر، تُحفر زخارفه في العجينة البيضاء على طريقة الحجيرات وتملأ بطلاءات ملونة متجاورة، ثم تُرك لصعوبته {cite:lane-early-islamic-pottery-1947 p. 52}."
  en: "Twelfth-century Saljuq Persian ware whose designs were carved in the white body in a cloisonné manner and filled with adjacent coloured glazes, later abandoned as too difficult {cite:lane-early-islamic-pottery-1947 p. 52}."
  ur: "بارھویں صدی کے سلجوقی فارسی ظروف جن کی آرائش سفید خمیر میں خانہ دار انداز سے کندہ کر کے ساتھ ساتھ رنگین لعابوں سے بھری جاتی، اور مشکل کی وجہ سے بعد میں ترک ہو گئی {cite:lane-early-islamic-pottery-1947 p. 52}۔"
  es: "Cerámica persa selyúcida del siglo XII cuyos diseños fueron tallados en el cuerpo blanco al estilo cloisonné y rellenos con esmaltes de colores adyacentes, técnica que posteriormente se abandonó por ser demasiado difícil {cite:lane-early-islamic-pottery-1947 p. 52}."
  fr: "Céramique persane seldjoukide du XIIe siècle dont les motifs étaient sculptés dans le corps blanc à la manière du cloisonné et remplis de glaçures colorées adjacentes, abandonnée plus tard car trop difficile {cite:lane-early-islamic-pottery-1947 p. 52}."
  tr: "On ikinci yüzyıldan kalma Pers Selçuklu seramikleri; süslemeleri oda tarzında beyaz macun haline oyulmuş ve bitişik renkli kaplamalarla doldurulmuş, ardından zorluğuna bırakılmıştır {cite:lane-early-Islamic-pottery-1947 s. 52}."
  id: "Keramik Seljuk Persia dari abad kedua belas, yang dekorasinya diukir menjadi pasta putih bergaya kamar dan diisi dengan lapisan berwarna di sekitarnya, kemudian dibiarkan dalam kesulitannya {cite:lane-early-Islamic-pottery-1947 hlm. 52}."
