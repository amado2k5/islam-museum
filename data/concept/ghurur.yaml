id: concept/ghurur
class: concept
kind: ethical
label: { ar: "الغرور", en: "Self-delusion (ghurur)", ur: "غرور ⁦(فریبِ نفس)⁩" }
summary:
  ar: "سكون النفس إلى ما يوافق الهوى ويميل إليه الطبع عن شبهة وخدعة من الشيطان، وهو عند الغزالي نوع من الجهل وأمّ الشقاوات؛ وقد عقد له الكتاب العاشر من ربع المهلكات في إحياء علوم الدين، وقسم المغترين أربعة أصناف: العلماء والعباد والمتصوفة وأرباب الأموال {cite:ihya-shamela-dar-al-marifa p. 6068} {cite:ihya-shamela-dar-al-marifa p. 6071}."
  en: "The soul's resting in what agrees with desire and appeals to its nature, on the basis of a false proof and Satan's deceit; for al-Ghazali a kind of ignorance and 'the mother of miseries'. The tenth book of the quarter of destructive things in the Ihya' is devoted to it and divides the deluded into four classes: scholars, worshippers, Sufis and the wealthy {cite:ihya-shamela-dar-al-marifa p. 6068} {cite:ihya-shamela-dar-al-marifa p. 6071}."
  ur: "نفس کا اس چیز پر مطمئن ہو جانا جو خواہش کے موافق اور طبیعت کو مرغوب ہو، کسی شبہے اور شیطان کے فریب کی بنا پر؛ غزالی کے نزدیک یہ جہالت کی ایک قسم اور «بدبختیوں کی ماں» ہے۔ احیاء کے ربعِ مہلکات کی دسویں کتاب اسی پر ہے، جس میں فریب خوردہ لوگوں کی چار قسمیں ہیں: علما، عابد، صوفیہ اور مالدار {cite:ihya-shamela-dar-al-marifa p. 6068} {cite:ihya-shamela-dar-al-marifa p. 6071}۔"
