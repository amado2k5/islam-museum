label: { ar: "الغرور", en: "Self-delusion (ghurur)", ur: "غرور ⁦(فریبِ نفس)⁩", es: "Autoengaño (ghurur)", fr: "Auto-illusion (ghurur)", tr: "Vanity", id: "Kesombongan" }
summary:
  ar: "سكون النفس إلى ما يوافق الهوى ويميل إليه الطبع عن شبهة وخدعة من الشيطان، وهو عند الغزالي نوع من الجهل وأمّ الشقاوات؛ وقد عقد له الكتاب العاشر من ربع المهلكات في إحياء علوم الدين، وقسم المغترين أربعة أصناف: العلماء والعباد والمتصوفة وأرباب الأموال {cite:ihya-shamela-dar-al-marifa p. 6068} {cite:ihya-shamela-dar-al-marifa p. 6071}."
  en: "The soul's resting in what agrees with desire and appeals to its nature, on the basis of a false proof and Satan's deceit; for al-Ghazali a kind of ignorance and 'the mother of miseries'. The tenth book of the quarter of destructive things in the Ihya' is devoted to it and divides the deluded into four classes: scholars, worshippers, Sufis and the wealthy {cite:ihya-shamela-dar-al-marifa p. 6068} {cite:ihya-shamela-dar-al-marifa p. 6071}."
  ur: "نفس کا اس چیز پر مطمئن ہو جانا جو خواہش کے موافق اور طبیعت کو مرغوب ہو، کسی شبہے اور شیطان کے فریب کی بنا پر؛ غزالی کے نزدیک یہ جہالت کی ایک قسم اور «بدبختیوں کی ماں» ہے۔ احیاء کے ربعِ مہلکات کی دسویں کتاب اسی پر ہے، جس میں فریب خوردہ لوگوں کی چار قسمیں ہیں: علما، عابد، صوفیہ اور مالدار {cite:ihya-shamela-dar-al-marifa p. 6068} {cite:ihya-shamela-dar-al-marifa p. 6071}۔"
  es: "El descanso del alma en lo que concuerda con el deseo y apela a su naturaleza, sobre la base de una prueba falsa y el engaño de Satanás; para al-Ghazali, una especie de ignorancia y «la madre de las miserias». El décimo libro del cuarto de las cosas destructivas en el Ihya' está dedicado a ello y divide a los engañados en cuatro clases: eruditos, adoradores, sufíes y ricos {cite:ihya-shamela-dar-al-marifa p. 6068} {cite:ihya-shamela-dar-al-marifa p. 6071}."
  fr: "L'âme se complaît dans ce qui satisfait le désir et flatte sa nature, se fondant sur de fausses preuves et la tromperie de Satan; pour al-Ghazali, il s'agit d'une forme d'ignorance et de « la mère des malheurs ». Le dixième livre du chapitre consacré aux choses destructrices dans l'Ihya' y est dédié et divise les égarés en quatre catégories: les savants, les dévots, les soufis et les riches."
  tr: "Ruhun arzuya uygun olan ve şeytanın şüphe ve aldatması nedeniyle ona eğilimli olan hareketsizliği, el-Gazali'ye göre cehalet biçimi ve sefaletin annesidir. 'Al-Muhalakat fi Ihya' el-Ulum el-Din'in onuncu kitabını yazmış, yanlış yola sapmışları dört kategoriye ayırmıştır: âlimler, ibadet edenler, Sufiler ve zenginler {cite:ihya-şamela-dar-al-marifa s. 6068} {cite:ihya-şamela-dar-al-marifa s. 6071}."
  id: "Keheningan jiwa terhadap apa yang sejalan dengan hasrat dan cenderung ke arahnya karena keraguan dan penipuan dari Setan, yang menurut al-Ghazali adalah bentuk kebodohan dan ibu kemiskinan. Ia menulis kitab kesepuluh dari 'Al-Muhalakat fi Ihya' al-Ulum al-Din, membagi yang tersesat menjadi empat kategori: ulama, penyembah, Sufi, dan orang kaya {cite:ihya-shamela-dar-al-marifa hlm. 6068} {cite:ihya-shamela-dar-al-marifa hlm. 6071}."
