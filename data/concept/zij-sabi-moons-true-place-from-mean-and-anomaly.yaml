label: { ar: "الموضع الحقيقي للقمر من الوسط والخاصة", en: "The Moon's true place from the mean place and the anomaly", ur: "وسط اور خاصے سے چاند کا حقیقی مقام", es: "El verdadero lugar de la Luna desde el lugar medio y la anomalía" }
summary:
  ar: "لمعرفة موضع القمر الحقيقي من فلك البروج في أي وقت، يُستخرج وسط الشمس ووسط القمر وخاصته لليوم والساعة المطلوبة، ثم يُنقص وسط الشمس من وسط القمر فيكون الباقي بُعد القمر الأوسط، ويُعمل بالجداول حتى يُحصل التعديل. {cite:zij-sabi-nallino-byblion p.111}."
  en: "To find the Moon's true place on the zodiac at any time, one takes the mean Sun, the mean Moon and the Moon's anomaly for the day and hour sought. The mean Sun is subtracted from the mean Moon, the remainder is the Moon's mean elongation, and the tables then give the equation. {cite:zij-sabi-nallino-byblion p.111}."
  ur: "کسی بھی وقت چاند کا حقیقی مقام بروج میں نکالنے کے لیے مطلوبہ دن اور گھنٹے کا سورج کا اوسط، چاند کا اوسط اور چاند کا خاصہ لیا جاتا ہے۔ سورج کا اوسط چاند کے اوسط سے گھٹایا جاتا ہے، باقی چاند کا اوسط بُعد ہے، اور پھر جداول سے تعدیل نکالا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.111}۔"
  es: "Para hallar la posición real de la Luna en el zodíaco en cualquier momento, se toman la media solar, la media lunar y la anomalía lunar correspondientes al día y la hora buscados. A la media lunar se le resta la media solar, el resultado es la elongación media lunar, y las tablas proporcionan la ecuación. {cite:zij-sabi-nallino-byblion p.111}."
