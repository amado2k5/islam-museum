  ar: "السمات اللازمة لكل حرف عند النطق به، وقد عدّدتها الجزرية بالجهور والهمس والشدة والرخاوة والتوسط والاستعلاء والاستفال والإطباق والانفتاح وسواها {cite:ar-wikisource}."
