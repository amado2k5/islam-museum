id: concept/canon-natural-urine-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب الطبيعي المحمود في البول عند ابن سينا"
  en: "The natural, praiseworthy sediment of urine in the Canon"
  fr: "Sédiment urinaire naturel et louable dans le Canon"
  ur: "پیشاب کی فطری قابل تعریف تلچھٹ قانون میں"
  es: "El sedimento natural y loable de orina en el Canon"
  tr: "İbn Sina'ya göre normal idrar kaçırma"
  id: "Inkontinensia urin normal menurut Ibn Sina"
summary:
  ar: "يفتتح ابن سينا الفصل السادس في أنواع الرسوب، فيبين أن الرسوب الطبيعي المحمود أبيض متصل الأجزاء مستو مستدير أملس، ويدل على نضج المادة في البدن كله. {cite:canon-ibn-sina-print-v1 p.193}."
  en: "Opening chapter six on kinds of sediment, Ibn Sina describes the natural, praiseworthy sediment: white, continuous, even, round and smooth, a sign of the whole body's maturation of its matter. {cite:canon-ibn-sina-print-v1 p.193}."
  fr: "Au chapitre 6, Ibn Sina décrit blanc, continuité, égalité, rondeur et lissé du sédiment naturel louable, signe de maturation de la matière corporelle entière. {cite:canon-ibn-sina-print-v1 p.193}."
  es: "Al comenzar el capítulo seis sobre los tipos de sedimento, Ibn Sina describe el sedimento natural y digno de elogio: blanco, continuo, uniforme, redondo y liso, signo de la maduración de la materia de todo el cuerpo. {cite:canon-ibn-sina-print-v1 p.193}."
  ur: "ابن سینا نے تلچھٹ کی اقسام پر چھٹے باب کا آغاز کرتے ہوئے قدرتی، قابل تعریف تلچھٹ کی وضاحت کی ہے: سفید، مسلسل، یکساں، گول اور ہموار، اس کے پورے جسم کے مادے کی پختگی کی علامت ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 193}۔"
  tr: "İbn Sina, altıncı bölümü tortu türleri üzerine açar ve doğal olarak övgüye değer tortunun beyaz, parçalara bağlı olduğunu, düz, yuvarlak, pürüzsüz olduğunu ve maddenin vücut boyunca olgunluğunu gösterdiğini açıklar. {atıf:kanon-ibn-sina-baskı-v1 s.193}."
  id: "Ibn Sina membuka bab keenam tentang jenis-jenis sedimen, menjelaskan bahwa sedimen yang secara alami patut dipuji berwarna putih, terhubung di beberapa bagian, datar, bulat, halus, dan menunjukkan kematangan material di seluruh tubuh. {cite:canon-ibn-sina-print-v1 hlm.193}."
