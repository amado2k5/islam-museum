label: { ar: "هُدْب", en: "Hudb (eyelashes: injury and washing in ablution)" }
summary:
  ar: "الهُدْب شعر ينبت على أشفار العين، ويسمى الشعر الذي فوق العينين حاجباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} وفي الجناية على شعرة واحدة من الأهداب إذا قُلعت ولم تنبت، أوجب الحنفية والحنابلة دية كاملة، وذهب المالكية والشافعية إلى عدم وجوب القصاص أو الدية وإنما تجب فيها حكومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} وفي غسل الأهداب في الوضوء: إن كان الشعر كثيفاً لا يصف البشرة أجزأ غسل ظاهره عند المالكية والحنابلة، ويندب تخليله عند الحنابلة، والحنفية يوجبون إمرار الماء على الشعر دون غسل ما تحته، والشافعية يوجبون غسل الظاهر والباطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16451}"
  en: "Hudb is the hair growing on the eyelids; the hair above the eyes is called hajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} For injuring a single eyelash so that it is pulled out and does not regrow, the Hanafis and Hanbalis hold a full diya is due, while the Malikis and Shafi'is hold neither retaliation nor diya applies, only an assessed compensation (hukuma). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} On washing the eyelashes in ablution: if the hair is dense and does not show the skin, washing its outer surface suffices according to the Malikis and Hanbalis, with combing it recommended for the Hanbalis; the Hanafis require passing water over the hair without washing beneath it, while the Shafi'is require washing both outer and inner surfaces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16451}"
