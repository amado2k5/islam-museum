label: { ar: "هُدْب", en: "Hudb (eyelashes: injury and washing in ablution)", es: "Hudb (pestañas: lesiones y lavado durante la ablución)", fr: "Hudb (cils: blessure et lavage lors des ablutions)" }
summary:
  ar: "الهُدْب شعر ينبت على أشفار العين، ويسمى الشعر الذي فوق العينين حاجباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} وفي الجناية على شعرة واحدة من الأهداب إذا قُلعت ولم تنبت، أوجب الحنفية والحنابلة دية كاملة، وذهب المالكية والشافعية إلى عدم وجوب القصاص أو الدية وإنما تجب فيها حكومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} وفي غسل الأهداب في الوضوء: إن كان الشعر كثيفاً لا يصف البشرة أجزأ غسل ظاهره عند المالكية والحنابلة، ويندب تخليله عند الحنابلة، والحنفية يوجبون إمرار الماء على الشعر دون غسل ما تحته، والشافعية يوجبون غسل الظاهر والباطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16451}"
  en: "Hudb is the hair growing on the eyelids; the hair above the eyes is called hajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} For injuring a single eyelash so that it is pulled out and does not regrow, the Hanafis and Hanbalis hold a full diya is due, while the Malikis and Shafi'is hold neither retaliation nor diya applies, only an assessed compensation (hukuma). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} On washing the eyelashes in ablution: if the hair is dense and does not show the skin, washing its outer surface suffices according to the Malikis and Hanbalis, with combing it recommended for the Hanbalis; the Hanafis require passing water over the hair without washing beneath it, while the Shafi'is require washing both outer and inner surfaces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16451}"
  es: "Hudb es el pelo que crece en los párpados; el pelo sobre los ojos se llama hajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} Por dañar una sola pestaña de tal manera que se arranca y no vuelve a crecer, los Hanafis y Hanbalis sostienen que se debe una diya completa, mientras que los Malikis y Shafi'is sostienen que no se aplica ni represalia ni diya, solo una compensación evaluada (hukuma). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} Sobre el lavado de las pestañas en la ablución: si el pelo es denso y no muestra la piel, lavar su superficie externa es suficiente según los Malikis y Hanbalis, con peinarlo recomendado para los Hanbalis; Los hanafíes exigen pasar agua sobre el cabello sin lavar debajo, mientras que los shafiíes exigen lavar tanto la superficie externa como la interna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16451}"
  fr: "Le terme « hudb » désigne les poils qui poussent sur les paupières; les poils au-dessus des yeux sont appelés « hajib ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16449} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} Si un seul cil est arraché et ne repousse pas, les écoles hanafite et hanbalite estiment qu'une diya complète est due, tandis que les écoles malikite et shafi'ite n'imposent ni représailles ni diya, mais seulement une compensation (hukuma). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} Concernant le lavage des cils lors des ablutions: si les poils sont denses et ne laissent pas apparaître la peau, laver leur surface extérieure suffit selon les écoles malikite et hanbalite, les hanbalites recommandant de les peigner. Les hanafites exigent de passer l'eau sur les cheveux sans laver en dessous, tandis que les shafi'ites exigent de laver à la fois la surface extérieure et intérieure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16450} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16451}"
