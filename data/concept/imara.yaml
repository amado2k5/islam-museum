id: concept/imara
class: concept
kind: legal
label: { ar: "الإمارة", en: "Imara (the office of amir: delegated rule, the seized emirate and the emirate of the pilgrimage)" }
summary:
  ar: "الإمارة الولاية، وتنقسم إلى عامة هي الخلافة، وخاصة يُعيَّن فيها الأمير لأمر أو مكان أو زمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} وإمارة الاستكفاء تفويض من الإمام إلى من يتولى بلدا أو إقليما، وشروطها الإسلام والتكليف والذكورة، ومختلف فيها العدالة والاجتهاد والكفاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} وإمارة الاستيلاء تقرير الإمام لمن استبد بالسلطة للضرورة، وتسمى كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3337} وإمارة الحج قسمان: إقامة الحج وتسيير الحجيج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3338}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3339}"
  en: "Imara is the office of the amir, the authority that governs. It is general, the caliphate, or specific, when an amir is appointed for a task, a place or a time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} The delegated emirate is the ruler's commission to someone who governs a region; its conditions are Islam, sanity and being male, and justice, ijtihad and capacity are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} The seized emirate is the ruler's confirmation, for the sake of public order, of one who has taken power by force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3337} The emirate of the pilgrimage has two kinds: performing the rites and conducting the pilgrims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3338}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3339}"
