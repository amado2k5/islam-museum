id: concept/imara
class: concept
kind: legal
label: { ar: "الإمارة", en: "Imara (the office of amir: delegated rule, the seized emirate and the emirate of the pilgrimage)", es: "Imara (el cargo de emir: gobierno delegado, emirato tomado y emirato de peregrinación)", fr: "Imara (la fonction d'émir: pouvoir délégué, émirat conquis et émirat du pèlerinage)" }
summary:
  ar: "الإمارة الولاية، وتنقسم إلى عامة هي الخلافة، وخاصة يُعيَّن فيها الأمير لأمر أو مكان أو زمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} وإمارة الاستكفاء تفويض من الإمام إلى من يتولى بلدا أو إقليما، وشروطها الإسلام والتكليف والذكورة، ومختلف فيها العدالة والاجتهاد والكفاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} وإمارة الاستيلاء تقرير الإمام لمن استبد بالسلطة للضرورة، وتسمى كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3337} وإمارة الحج قسمان: إقامة الحج وتسيير الحجيج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3338}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3339}"
  en: "Imara is the office of the amir, the authority that governs. It is general, the caliphate, or specific, when an amir is appointed for a task, a place or a time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} The delegated emirate is the ruler's commission to someone who governs a region; its conditions are Islam, sanity and being male, and justice, ijtihad and capacity are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} The seized emirate is the ruler's confirmation, for the sake of public order, of one who has taken power by force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3337} The emirate of the pilgrimage has two kinds: performing the rites and conducting the pilgrims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3338}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3339}"
  es: "Imara es el cargo del emir, la autoridad que gobierna. Es general, el califato, o específico, cuando un emir es designado para una tarea, un lugar o un tiempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} El emirato delegado es la comisión del gobernante a alguien que gobierna una región; sus condiciones son Islam, cordura y ser hombre, y la justicia, ijtihad y capacidad son disputadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} El emirato tomado es la confirmación del gobernante, en aras del orden público, de alguien que ha tomado el poder por la fuerza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3337} El emirato de la peregrinación tiene dos tipos: realizar los ritos y guiar a los peregrinos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3338}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3339}"
  fr: "L'imara est la fonction d'émir, l'autorité qui gouverne. Elle est générale (le califat) ou spécifique (lorsqu'un émir est nommé pour une tâche, un lieu ou une période). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3335}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} L'émirat délégué est la mission confiée par le souverain à une personne chargée de gouverner une région; ses conditions sont l'islam, la santé mentale et le sexe masculin; la justice, l'ijtihad et la capacité font l'objet de controverses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3336} L'émirat conquis est la confirmation par le souverain, pour des raisons d'ordre public, de celui qui a pris le pouvoir par la force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3337} L'émirat du pèlerinage comporte deux aspects: l'accomplissement des rites et la conduite des pèlerins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3338}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3339}"
