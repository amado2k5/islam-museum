label: { ar: "فقار الصدر والقطن عند ابن سينا", en: "Thoracic and lumbar vertebrae in the Canon", ur: "قانون میں سینے اور کمر کی کڑیاں", es: "Vértebras torácicas y lumbares en el Canon", fr: "Vertèbres thoraciques et lombaires dans le Canon" }
summary:
  ar: "يخصّ ابن سينا فقار الصدر باثنتي عشرة فقرة تتصل بها الأضلاع، وفقار القطن بخمس فقرات تحمل عظم العانة وتنبت منها أعصاب الرجل {cite:canon-ibn-sina-print-v1 pp.51-52}."
  en: "Ibn Sina assigns to the chest twelve vertebrae to which the ribs attach, and to the lower back five lumbar vertebrae that carry the pubic bone and from which the nerves of the leg grow {cite:canon-ibn-sina-print-v1 pp.51-52}."
  es: "Ibn Sina asigna al tórax doce vértebras a las que se unen las costillas, y a la parte baja de la espalda cinco vértebras lumbares que sostienen el hueso púbico y de las que crecen los nervios de la pierna {cite:canon-ibn-sina-print-v1 pp.51-52}."
  fr: "Ibn Sina attribue à la poitrine douze vertèbres auxquelles les côtes s'attachent, et au bas du dos cinq vertèbres lombaires qui portent l'os pubien et d'où partent les nerfs de la jambe {cite:canon-ibn-sina-print-v1 pp.51-52}."
  ur: "ابن سینا نے سینے کے لیے بارہ فقرے مقرر کیے ہیں جن سے پسلیاں جڑی ہوئی ہیں، اور کمر کے نچلے حصے میں پانچ ریڑھ کی ہڈیاں ہیں جو زیرِ ناف کی ہڈی کو لے جاتی ہیں اور جن سے ٹانگ کے اعصاب بڑھتے ہیں۔"
