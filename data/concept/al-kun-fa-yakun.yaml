id: concept/al-kun-fa-yakun
class: concept
kind: doctrine
label: { ar: "كن فيكون: الخلق بالأمر لا بالقالب", en: "«Be, and it is» (kun fa-yakun): creation by command, not by a mould", fr: "« Sois, et elle est » (kun fa-yakun) : la création par l’ordre, non par un moule", es: "«Sé, y es» (kun fa-yakun): creación por mandato, no por molde.", ur: "\"ہو، اور یہ ہے\" ⁦(کن فا یقون)⁩: تخلیق حکم سے، نہ کہ سانچے سے", tr: "Ol, ve öyledir: kalıpla değil, emirle yaratılır", id: "Menjadi dan adalah: diciptakan bukan oleh pola, melainkan oleh perintah" }
summary:
  ar: "يشرح الشعراوي أن الله خلق الخلق دون قالب سابق، فكان التماثل بين الناس في الخلق بكلمة «كن» لا بقالب، ومع ذلك يختلف كل إنسان عن غيره في البصمات والصفات. ويفسّر «قضى» بالحكم والفصل والإتمام، ويقول إن الأمر المقضي موجود في علم الله قبل أن يُعلم. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.549}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.550}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}"
  en: "Sha'rawi explains that God created without a prior mould, so that the likeness among human beings comes from the word «be» and not from a shape cast in advance, while each person differs from others in fingerprints and traits. He reads qada' as judgment, decree and completion, and says the decreed matter exists in God's knowledge before it is known to people {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.549}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.550}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}."
  fr: "Sha'rawi explique que Dieu a créé sans moule préalable, de sorte que la ressemblance entre les êtres humains vient de la parole « sois » et non d’une forme coulée d’avance, tandis que chaque personne diffère des autres par ses empreintes digitales et ses traits. Il lit qada' comme jugement, décret et achèvement, et dit que la chose décrétée existe dans la science de Dieu avant d’être connue des gens {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.549}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.550}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}."
  es: "Sha'rawi explica que Dios creó sin un molde previo, de modo que la semejanza entre los seres humanos proviene de la palabra «ser» y no de una forma moldeada de antemano, mientras que cada persona difiere de las demás en huellas dactilares y rasgos. Él interpreta qada' como juicio, decreto y consumación, y dice que el asunto decretado existe en el conocimiento de Dios antes de que sea conocido por las personas {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.549}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.550}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}."
  ur: "شعراوی وضاحت کرتا ہے کہ خدا نے بغیر کسی پیشگی سانچے کے پیدا کیا، تاکہ انسانوں کے درمیان مشابہت لفظ «ہو» سے آتی ہے نہ کہ پہلے سے ڈالی گئی شکل سے، جب کہ ہر شخص انگلیوں کے نشانات اور خصلتوں میں دوسروں سے مختلف ہوتا ہے۔ وہ قضا کو فیصلہ، حکم اور تکمیل کے طور پر پڑھتا ہے، اور کہتا ہے کہ حکم شدہ معاملہ خدا کے علم میں موجود ہے اس سے پہلے کہ یہ لوگوں کو معلوم ہو p.550}{cite:tafsir-Sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-Sharawi-khawatir-scan-pp-501-1000 p.553}۔"
  tr: "Al-Shaarawi, Tanrı'nın yaratımı önceden kalıp olmadan yarattığını açıklar; bu nedenle yaratılışın insanlar arasındaki benzerlik kalıp ile değil, \"olmak\" kelimesiyle gerçekleşir; yine de her birey imzaları ve özellikleriyle diğerlerinden farklıdır. \"Karar\"ı yargı, ayrılık ve tamamlanma olarak yorumlar ve belirlenen maddenin Tanrı'nın bilgisinde O bilmeden önce var olduğunu söyler. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.549} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.550} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.552} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 s.553}"
  id: "Al-Shaarawi menjelaskan bahwa Tuhan menciptakan ciptaan tanpa pola sebelumnya; oleh karena itu, kesamaan penciptaan di antara manusia terjadi bukan berdasarkan pola tetapi oleh kata \"menjadi\"; namun setiap individu berbeda dari yang lain berdasarkan tanda tangan dan karakteristiknya. Dia menafsirkan \"penghakiman\" sebagai penghakiman, pemisahan, dan penyempurnaan, dan mengatakan bahwa materi yang ditentukan sudah ada dalam pengetahuan Tuhan sebelum Dia mengetahuinya. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 hlm.549} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 hlm.550} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 hlm.552} {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 hlm.553}"
