id: concept/al-kun-fa-yakun
class: concept
kind: doctrine
label: { ar: "كن فيكون: الخلق بالأمر لا بالقالب", en: "«Be, and it is» (kun fa-yakun): creation by command, not by a mould" }
summary:
  ar: "يشرح الشعراوي أن الله خلق الخلق دون قالب سابق، فكان التماثل بين الناس في الخلق بكلمة «كن» لا بقالب، ومع ذلك يختلف كل إنسان عن غيره في البصمات والصفات. ويفسّر «قضى» بالحكم والفصل والإتمام، ويقول إن الأمر المقضي موجود في علم الله قبل أن يُعلم. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.549}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.550}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}"
  en: "Sha'rawi explains that God created without a prior mould, so that the likeness among human beings comes from the word «be» and not from a shape cast in advance, while each person differs from others in fingerprints and traits. He reads qada' as judgment, decree and completion, and says the decreed matter exists in God's knowledge before it is known to people {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.549}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.550}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}."
wings: [ideas]
themes: [creed]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "كيف يُفهم الخلق بكلمة «كن» وتفاوت المخلوقات مع تشابهها، وما معنى القضاء؟"
  en: "How is creation by the word «be» understood, given that created beings are alike yet differ, and what does qada' mean?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-command-not-mould
    stance:
      ar: "الخلق بالأمر دون قالب، والتشابه في الصورة مع تفاوت الذوات"
      en: "Creation is by command without a mould; likeness in form with difference between persons"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الصانع البشري يحتاج إلى قالب ولا يبلغ الدقة، بينما خلق الله من آدم إلى قيام الساعة بكلمة «كن»، فجاء التشابه في الأعضاء والوظائف مع تمايز كل شخص بالبصمة والصوت. ويقرر أن البعث يعيد الإنسان بعناصره وصورته نفسها. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.549}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.550}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.551}"
      en: "Sha'rawi holds that a human maker needs a mould and cannot reach exact precision, whereas God's creation from Adam to the Hour came by the word «be», so likeness in limbs and functions is joined to each person's distinctness in fingerprint and voice. He holds that resurrection restores each person with the same elements and form {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.549}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.550}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.551}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-sharawi-qada-meanings
    stance:
      ar: "القضاء معان متعددة يجمعها الحكم، والأمر موجود في علم الله قبل ظهوره"
      en: "Qada' has several meanings, unified by judgment; the matter exists in God's knowledge before it appears"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يعدّد الشعراوي معاني «قضى» في القرآن: الفراغ من الشيء، والأمر بالفعل، والموت، والحكم والفصل، ويرى أن المعنى الجامع هو الحكم. ويقول إن قول الله «يقول له كن» يدل على أن الأمر موجود في علمه، ويتكلم فيه بلفظ الخطاب، ويبديه لنا حين نجهله. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}"
      en: "Sha'rawi lists the senses of qada' in the Qur'an: finishing a thing, commanding an act, death, and judgment and separation; he holds that judgment is the common root. He says that the words «He says to it, be» show that the matter already exists in God's knowledge, and that God makes known to people what they did not know {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.552}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "ما زالت آراء المفسرين وعلماء الكلام في القدرة والخلق والقضاء دون مصدر في هذه الدفعة"
      en: "Classical positions on power, creation and qada' are not yet entered from a source"
    holders: []
    summary:
      ar: "لم تُدخل بعد أقوال المفسرين وعلماء الكلام في تأويل «كن» والقضاء والقدر، ولا الآراء الأكاديمية أو الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.553}"
      en: "The positions of exegetes and theologians on «be», qada' and qadar, the academic view and other views are not yet entered."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
