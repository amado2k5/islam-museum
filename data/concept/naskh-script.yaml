id: concept/naskh-script
class: concept
kind: art_form
label: { ar: "خط النسخ", en: "Naskh script", ur: "خطِ نسخ", es: "Escritura Naskh", fr: "Écriture Naskh", tr: "Naskh yazısı", id: "Aksara Naskh" }
summary:
  ar: "أحد الأقلام الستة الموزونة، قرين الثلث الدقيق، استعمل لنسخ الكتب المعتادة والمصاحف الصغيرة، وطوّر في إيران صورة كبيرة منه سميت «النسخ المحيا» على يد أحمد النيريزي {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  en: "One of the six proportional pens, the small partner of thuluth, used for ordinary books and small Qur'ans; in Iran a large form, \"revival naskh\", was codified by Ahmad Nayrizi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  ur: "اقلامِ ستہ میں سے ایک، ثلث کا باریک جوڑی دار، عام کتابوں اور چھوٹے مصاحف کے لیے؛ ایران میں احمد نیریزی نے اس کی ایک بڑی صورت «احیائی نسخ» مرتب کی {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}۔"
  es: "Una de las seis plumas proporcionales, la pequeña compañera del thuluth, utilizada para libros comunes y Coranes pequeños; en Irán, una forma grande, \"naskh de renacimiento\", fue codificada por Ahmad Nayrizi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  fr: "L'un des six stylos proportionnels, le petit partenaire du thuluth, utilisé pour les livres ordinaires et les petits Corans; en Iran, une grande forme, le « naskh de renaissance », a été codifiée par Ahmad Nayrizi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 29}."
  tr: "Tam olarak üçüncüsüne bitişik olan altı ağırlıklı kalemden biri, sıradan kitapları ve küçük Kur'anları kopyalamak için kullanıldı ve İran'da Ahmad al-Nirizi tarafından \"yaşayan kopya\" olarak adlandırılan büyük bir versiyonunu geliştirdi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 29}."
  id: "Salah satu dari enam pena berbobot, yang bersebelahan dengan yang ketiga tepat, digunakan untuk menyalin buku biasa dan Al-Qur'an kecil, dan di Iran ia mengembangkan versi besar yang disebut \"salinan hidup\" oleh Ahmad al-Nirizi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 29}."
