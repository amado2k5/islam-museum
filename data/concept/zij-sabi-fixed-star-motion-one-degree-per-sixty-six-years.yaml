class: concept
kind: scientific
label: { ar: "حركة الكواكب الثابتة درجة في كل ست وستين سنة شمسية", en: "The motion of the fixed stars by one degree in every sixty-six solar years", ur: "ثابت ستاروں کی حرکت ہر چھیاسٹھ شمسی سال میں ایک درجہ", es: "El movimiento de las estrellas fijas es de un grado cada sesenta y seis años solares.", fr: "Le mouvement des étoiles fixes d'un degré tous les soixante-six ans solaires", tr: "Sabit gezegenlerin hareketi her altmış altı güneş yılında bir derecedir.", id: "Pergerakan planet-planet tetap adalah satu derajat setiap enam puluh enam tahun matahari." }
summary:
  ar: "يذكر النص أن مدار الكواكب الثابتة على قطبي فلك البروج لم تزل عنه منذ عُرفت لها حركة، وأن عرضها واحد لا يتغير، وأن أبعادها بعضها عن بعض ثابتة. فتتحرك بحركة واحدة على الفلك من المغرب إلى المشرق، ويُعرف ذلك بالمقارنة بين الرصدين، إذ تتحرك في كل ست وستين سنة شمسية درجة واحدة. وقد رسم البتاني جدولاً لحركاتها يُستخرج منه بالسنين المجموعة. {cite:zij-sabi-nallino-byblion pp.191-192}"
  en: "The text says the orbit of the fixed stars lies on the poles of the ecliptic and has not moved since its motion became known, that their latitude is constant, and that the distances between them are fixed. They move together round the sphere from west to east, which is known by comparing two observations: they advance one degree in every sixty-six solar years. Al-Battani drew up a table of their motions from which the values for the years are taken. {cite:zij-sabi-nallino-byblion pp.191-192}"
  ur: "متن کہتا ہے کہ ثابت ستاروں کا مدار دائرۂ البروج کے قطبوں پر ہے اور جب سے ان کی حرکت معلوم ہوئی وہ نہیں بدلا، ان کا عرض یکساں ہے، اور ان کے فاصلے ایک دوسرے سے مقرر ہیں۔ وہ فلک پر مغرب سے مشرق کی طرف ایک ساتھ حرکت کرتے ہیں، جو دو رصدوں کے موازنے سے معلوم ہوتا ہے: وہ ہر چھیاسٹھ شمسی سال میں ایک درجہ آگے بڑھتے ہیں۔ البتانی نے ان کی حرکات کا جدول بنایا جس سے سالوں کے لیے قیمتیں لی جاتی ہیں۔ {cite:zij-sabi-nallino-byblion pp.191-192}"
  es: "El texto afirma que la órbita de las estrellas fijas se sitúa en los polos de la eclíptica y no se ha movido desde que se conoció su movimiento, que su latitud es constante y que las distancias entre ellas son fijas. Se mueven juntas alrededor de la esfera de oeste a este, lo cual se conoce comparando dos observaciones: avanzan un grado cada sesenta y seis años solares. Al-Battani elaboró una tabla de sus movimientos a partir de la cual se obtienen los valores de los años. {cite:zij-sabi-nallino-byblion pp.191-192}"
  fr: "Le texte indique que l'orbite des étoiles fixes se situe aux pôles de l'écliptique et est restée inchangée depuis que son mouvement est connu, que leur latitude est constante et que les distances qui les séparent sont fixes. Elles se déplacent ensemble autour de la sphère d'ouest en est, ce qui est établi par comparaison de deux observations: elles avancent d'un degré tous les soixante-six ans solaires. Al-Battani a dressé une table de leurs mouvements à partir de laquelle les valeurs des années sont tirées. {cite:zij-sabi-nallino-byblion pp.191-192}"
  tr: "Metinde, ekliptiğin kutuplarındaki sabit gezegenlerin yörüngelerinin, hareketleri ilk gözlemlendiğinden beri değişmeden kaldığı, enlemlerinin sabit olduğu ve birbirlerinden uzaklıklarının da sabit olduğu belirtilmektedir. İki gözlemi karşılaştırarak bilindiği üzere, gök küresi boyunca batıdan doğuya doğru tek bir hareketle ilerlerler ve her altmış altı güneş yılında bir derece hareket ederler. El-Battani, hareketlerinin bir tablosunu hazırlamış ve bu tablodan yılların toplamı hesaplanabilmektedir. {cite:zij-sabi-nallino-byblion pp.191-192}"
  id: "Teks tersebut menyatakan bahwa orbit planet-planet tetap di kutub ekliptika tetap tidak berubah sejak pergerakannya pertama kali diamati, bahwa garis lintangnya konstan, dan bahwa jaraknya satu sama lain tetap. Mereka bergerak dalam satu gerakan di sepanjang bola langit dari barat ke timur, sebuah fakta yang diketahui dengan membandingkan dua pengamatan, karena mereka bergerak satu derajat setiap enam puluh enam tahun matahari. Al-Battani menyusun tabel pergerakan mereka yang darinya jumlah tahun dapat dihitung. {cite:zij-sabi-nallino-byblion pp.191-192}"
