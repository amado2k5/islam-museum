id: concept/abbasid-tin-glazed-ware
class: concept
kind: art_form
label: { ar: "الخزف العباسي ذو الطلاء القصديري", en: "Abbasid tin-glazed ware", fr: "Céramique abbasside à glaçure stannifère", ur: "عباسی قلعی دار لعاب والے ظروف", es: "Cerámica abasí vidriada con estaño", tr: "Kalay kaplamalı Abbasî seramikleri", id: "Keramik Abbasiyah dengan lapisan timah" }
summary:
  ar: "خزف عراقي من القرن التاسع غُطي بطلاء أبيض معتم بأكسيد القصدير ليشبه الخزف الصيني الأبيض، ثم رُسم عليه بالأزرق والأخضر والبنفسجي أو بالبريق المعدني {cite:lane-early-islamic-pottery-1947 p. 28} {cite:lane-early-islamic-pottery-1947 p. 29}."
  en: "Ninth-century Iraqi pottery covered with an opaque white glaze made with tin oxide to resemble white Chinese ware, then painted in blue, green and purple or in lustre {cite:lane-early-islamic-pottery-1947 p. 28} {cite:lane-early-islamic-pottery-1947 p. 29}."
  fr: "Céramique irakienne du IXe siècle recouverte d'une glaçure blanche opaque à l'oxyde d'étain pour imiter la céramique blanche chinoise, puis peinte en bleu, vert et violet ou à décor lustré {cite:lane-early-islamic-pottery-1947 p. 28} {cite:lane-early-islamic-pottery-1947 p. 29}."
  ur: "نویں صدی کے عراقی ظروف جن پر قلعی کے آکسائیڈ سے دھندلا سفید لعاب چڑھایا جاتا تاکہ سفید چینی ظروف جیسے لگیں، پھر ان پر نیلے، سبز اور بنفشی رنگ یا چمک دار نقاشی کی جاتی {cite:lane-early-islamic-pottery-1947 p. 28} {cite:lane-early-islamic-pottery-1947 p. 29}۔"
  es: "Cerámica iraquí del siglo IX cubierta con un esmalte blanco opaco hecho con óxido de estaño para imitar la cerámica blanca china, luego pintada en azul, verde y púrpura o con lustre {cite:lane-early-islamic-pottery-1947 p. 28} {cite:lane-early-islamic-pottery-1947 p. 29}."
  tr: "Dokuzuncu yüzyıldan kalma Irak seramikleri, beyaz Çin porselenini andıracak şekilde beyaz kalay oksit-opak bir kaplama ile kaplanmış, ardından mavi, yeşil, mor veya metalik parlaklıkla boyanmıştır {cite:lane-early-islamic-pottery-1947 s. 28} {cite:lane-early-islamic-pottery-1947 s. 29}."
  id: "Keramik Irak dari abad kesembilan dilapisi dengan lapisan timah-oksida putih yang menyerupai porselen putih Tiongkok, lalu dicat dengan kilau biru, hijau, ungu, atau logam {cite:lane-early-islamic-pottery-1947 hlm. 28} {cite:lane-early-islamic-pottery-1947 hlm. 29}."
