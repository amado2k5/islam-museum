id: concept/al-laana
class: concept
kind: doctrine
label:
  ar: "اللعن: الطرد والإبعاد من الرحمة"
  en: "Curse (la'na): expulsion from mercy"
summary:
  ar: "يرى الشعراوي أن اللعن هو الطرد والإبعاد من رحمة الله، وأنه إذا كان بغضب فهو طرد لا رجعة فيه، وإذا كان تأديباً فهو إبعاد دون غضب، وأن لعنة الله والملائكة والناس تشمل المكتمين، وأن الكائنات كلها تلعن من حُرم بسببها من النفع. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.673}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.674}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.675}"
  en: "Sha'rawi holds that la'na is expulsion and removal from God's mercy; when it comes with anger it is an expulsion with no return, and when it is disciplinary it is removal without anger; he holds that the curse of God, the angels and people covers those who conceal the truth, and that all creatures curse those who are deprived through them {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.673}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.674}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.675}."
wings: [ideas]
themes: [creed]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "كيف يُفهم اللعن في القرآن، وهل يُرجى بعده رجوع، وما الفرق بين اللعن الغضبي واللعن التأديبي؟"
  en: "How is la'na understood in the Qur'an, is return still possible after it, and how does the angry curse differ from the disciplinary one?"
perspectives:
  - tradition: sunni
    id: sharawi-laana-kinds
    stance:
      ar: "اللعن طرد وإبعاد؛ مع الغضب لا رجعة فيه، ومع التأديب إبعاد يُرجى بعده الرجوع"
      en: "La'na is expulsion and removal; with anger there is no return, while in discipline the removal may be followed by return"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن كلمة اللعن وردت في القرآن إحدى وأربعين مرة، وأن لعنة الغضب تفضي إلى الخلود، وأن التأديب لا يكون بغضب، وأن قصة المتخلفين عن تبوك مثال للإبعاد التأديبي حين لم يكلم المسلمون الثلاثة، ثم جاء الإفراج بعد عشرة أيام. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.673}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.675}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.676}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.677}"
      en: "Sha'rawi says the word la'na appears forty-one times in the Qur'an, that the angry curse leads to eternity, that discipline is not done in anger, and that the case of those who stayed behind from Tabuk is an example of disciplinary removal, when the three were not spoken to until their release after ten days {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.673}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.675}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.676}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.677}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-unsourced-anecdotes
    stance:
      ar: "حكايات الحيوانات والأمكنة في اللعن ونحوها لم تُعتمد لأنها بلا مصدر"
      en: "The anecdotes about animals and places cursing are not adopted, since they name no source"
    holders: []
    summary:
      ar: "يذكر الشعراوي أن النبات والحيوان والأمكنة تلعن من حُرم الماء بسببهم، دون ذكر مصدر، ولم تُدخل هذه الصورة إلا بوصفها تفسيره وحده. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.674}"
      en: "Sha'rawi says that plants, animals and places curse those deprived of water through them, without naming a source; this image is recorded only as his exposition {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.674}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
