  stance:
    ar: التصديق بكرامات الأولياء وما يجريه الله على أيديهم من خوارق العادات
    en: Believing in the marvels of the friends of God and the extraordinary things God brings about at their hands
  summary:
    ar: يقول ابن تيمية إن من أصول أهل السنة «التصديق بكرامات الأولياء وما يجري الله على أيديهم من خوارق العادات في العلوم والمكاشفات وأنواع القدرة والتأثيرات»، وإنها موجودة في هذه الأمة إلى يوم القيامة.
    en: Ibn Taymiyya says among the principles of Ahl al-Sunna is belief in the marvels of the friends of God and the extraordinary things God brings about at their hands in knowledge, unveilings and kinds of power and effect, and that they exist in this community until the Day of Resurrection.
