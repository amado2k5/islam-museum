id: concept/karamat-al-awliya
education:
  did_you_know:
    ar: "تقرر العقيدة الطحاوية كرامات الأولياء بما صح عن الثقات، ويبقى النبي الواحد أفضل من جميع الأولياء؛ ويفرّق ابن خلدون بينها وبين المعجزة بالتحدي."
    en: "Al-Tahawi affirms the saints' marvels as reliably reported, while a single prophet outranks all saints; Ibn Khaldun distinguishes marvel from miracle by the challenge."
    ur: "طحاوی اولیاء کے کرامات کو ثقہ روایات کے ساتھ مانتا ہے، جبکہ ایک نبی سب اولیاء سے افضل ہے؛ ابن خلدون کرامت اور معجزے کے فرق کو چیلنج سے بیان کرتا ہے۔"
    sources: [source/aqida-wasitiyya, source/maqalat-islamiyyin]
class: concept
kind: doctrine
label:
  ar: كرامات الأولياء
  en: Karamat (marvels of the friends of God)
summary:
  ar: "قول الطحاوي بالإيمان بما جاء من كرامات الأولياء وما صح عن الثقات من رواياتهم، مع بقاء النبي الواحد أفضل من جميع الأولياء، وقال ابن خلدون فارق الكرامة عن المعجزة عند المتكلمين التحدي إذ لا حاجة فيها إلى التصديق، وأنكرها المعتزلة إذ الخوارق عندهم ليست من أفعال العباد وأفعالهم معتادة فلا فرق، وفارقها عن معجزة النبي عند الحكماء أن خوارق الولي دون خوارق النبي فهي كتكثير القليل والحديث عن بعض المستقبل وخوارق النبي كالصعود إلى السماء والنفوذ في الأجسام الكثيفة وإحياء الموتى وتكليم الملائكة، وقد قرر ذلك المتصوفة {cite:muqaddima-ibn-khaldun p. 91-92}"
  en: al-Tahawi's statement that one believes in the marvels reported of the friends of God and what is sound from reliable narrators, while a single prophet remains better than all the friends of God.
