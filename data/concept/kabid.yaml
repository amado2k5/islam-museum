summary:
  ar: "الكبد غذاء دمه غليظ، وأصلحه كبد البط والدجاج المسمنين، وفيه ذكر لأكباد حيوانات أخرى في الدواء، ويعلّق المؤلف على بعضها بقول جالينوس {cite:canon-ibn-sina-print-v1 p.530} {cite:canon-ibn-sina-print-v1 p.531}."
  en: "The liver is a food whose blood is thick; the best is the liver of fattened duck and hen. The book also lists the livers of other animals as drugs, and sets some against Galen's remarks {cite:canon-ibn-sina-print-v1 p.530} {cite:canon-ibn-sina-print-v1 p.531}."
  ur: "کبد ایک غذا ہے جس سے پیدا ہونے والا خون گاڑھا ہے؛ سب سے بہتر پالے ہوئے بطخ اور مرغی کا کبد ہے۔ کتاب دوسرے جانوروں کے کبد کو بھی دوا کے طور پر گنواتی ہے اور بعض پر جالینوس کا قول رکھتی ہے {cite:canon-ibn-sina-print-v1 p.530} {cite:canon-ibn-sina-print-v1 p.531}۔"
  es: "El hígado es un alimento cuya sangre es espesa; el mejor es el hígado de pato y gallina engordados. El libro también enumera los hígados de otros animales como drogas y contrapone algunos a las observaciones de Galeno {cite:canon-ibn-sina-print-v1 p.530} {cite:canon-ibn-sina-print-v1 p.531}."
