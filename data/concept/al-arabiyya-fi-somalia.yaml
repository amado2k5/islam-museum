label:
  ar: "العربية في الصومال"
  en: "Arabic in Somalia"
  ur: "صومالیہ میں عربی"
  fr: "L'arabe en Somalie"
  es: "El árabe en Somalia"
summary:
  ar: "مكانة العربية في الصومال كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: الصومالية والعربية لغتان رسميتان، والصومالية يفهمها أهل البلاد جميعاً، والعربية تُتكلَّم في الشمال والمدن الساحلية، وللإيطالية والإنجليزية والسواحلية مواضع، وكُتبت الصومالية بالحرف اللاتيني سنة 1973. ولا تقول الصفحتان شيئاً عن لهجة عربية صومالية."
  en: "The place of Arabic in Somalia as the Encyclopaedia Britannica and The World Factbook state it: Somali and Arabic are official languages, Somali understood across the country and Arabic spoken mainly in the north and the coastal towns; Italian, English and Swahili have their places, and Somali was given a Latin orthography in 1973. The pages say nothing on a Somali Arabic dialect."
  ur: "صومالیہ میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: صومالی اور عربی سرکاری زبانیں ہیں، صومالی پورے ملک میں سمجھی جاتی ہے اور عربی زیادہ تر شمال اور ساحلی شہروں میں بولی جاتی ہے؛ اطالوی، انگریزی اور سواحلی کی اپنی جگہیں ہیں، اور صومالی کو 1973 میں لاطینی رسم الخط دیا گیا۔ دونوں صفحات کسی صومالی عربی لہجے کے بارے میں کچھ نہیں کہتے۔"
  fr: "La place de l'arabe en Somalie selon l'Encyclopaedia Britannica et The World Factbook : le somali et l'arabe sont langues officielles, le somali compris dans tout le pays et l'arabe parlé surtout dans le nord et les villes côtières ; l'italien, l'anglais et le swahili ont leurs places, et le somali a reçu une orthographe latine en 1973. Les pages ne disent rien d'un dialecte arabe somalien."
  es: "El lugar del árabe en Somalia según la Encyclopaedia Britannica y The World Factbook: el somalí y el árabe son lenguas oficiales, el somalí comprendido en todo el país y el árabe hablado sobre todo en el norte y las ciudades costeras; el italiano, el inglés y el suajili tienen sus lugares, y el somalí recibió una ortografía latina en 1973. Las páginas no dicen nada de un dialecto árabe somalí."
