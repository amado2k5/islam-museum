id: concept/al-arabiyya-fi-somalia
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في الصومال"
  en: "Arabic in Somalia"
  ur: "صومالیہ میں عربی"
  fr: "L'arabe en Somalie"
  es: "El árabe en Somalia"
summary:
  ar: "مكانة العربية في الصومال كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: الصومالية والعربية لغتان رسميتان، والصومالية يفهمها أهل البلاد جميعاً، والعربية تُتكلَّم في الشمال والمدن الساحلية، وللإيطالية والإنجليزية والسواحلية مواضع، وكُتبت الصومالية بالحرف اللاتيني سنة 1973. ولا تقول الصفحتان شيئاً عن لهجة عربية صومالية. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "The place of Arabic in Somalia as the Encyclopaedia Britannica and The World Factbook state it: Somali and Arabic are official languages, Somali understood across the country and Arabic spoken mainly in the north and the coastal towns; Italian, English and Swahili have their places, and Somali was given a Latin orthography in 1973. The pages say nothing on a Somali Arabic dialect. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "صومالیہ میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: صومالی اور عربی سرکاری زبانیں ہیں، صومالی پورے ملک میں سمجھی جاتی ہے اور عربی زیادہ تر شمال اور ساحلی شہروں میں بولی جاتی ہے؛ اطالوی، انگریزی اور سواحلی کی اپنی جگہیں ہیں، اور صومالی کو 1973 میں لاطینی رسم الخط دیا گیا۔ دونوں صفحات کسی صومالی عربی لہجے کے بارے میں کچھ نہیں کہتے۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "La place de l'arabe en Somalie selon l'Encyclopaedia Britannica et The World Factbook : le somali et l'arabe sont langues officielles, le somali compris dans tout le pays et l'arabe parlé surtout dans le nord et les villes côtières ; l'italien, l'anglais et le swahili ont leurs places, et le somali a reçu une orthographe latine en 1973. Les pages ne disent rien d'un dialecte arabe somalien. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "El lugar del árabe en Somalia según la Encyclopaedia Britannica y The World Factbook: el somalí y el árabe son lenguas oficiales, el somalí comprendido en todo el país y el árabe hablado sobre todo en el norte y las ciudades costeras; el italiano, el inglés y el suajili tienen sus lugares, y el somalí recibió una ortografía latina en 1973. Las páginas no dicen nada de un dialecto árabe somalí. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
