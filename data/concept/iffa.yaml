label:
  ar: "العِفّة"
  en: "Chastity and restraint (iffa)"
  ur: "عفت"
summary:
  ar: "العفة في اللغة الكف عما لا يحل ولا يجمل، يقال عف الرجل والمرأة عن المحارم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. والحصانة تطلق على العفة، وعلى الزواج، وعلى الحرية، وعلى الإسلام، فالحصانة أعم من العفة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. ويحرص الإسلام على صون الكرامة، فيحرم السؤال على من يملك ما يغنيه، ويجوز لمن احتاج بقدر الحاجة بشروط {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. وأمر الله المؤمنين بالعفة عن الزنا ونهاهم عن مقدماته، وأرشد من قدر على مؤنة النكاح إلى الزواج، ومن لم يستطع إلى الصوم وقاية، ويجب على من يجد الأهبة وتتوق نفسه ويخاف الوقوع في الزنا أن يتزوج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. واختلف الفقهاء في وجوب إعفاف الأصول والفروع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. وذهب جمهور الفقهاء إلى أن زنا أحد الزوجين لا يحرم نكاحه على العفيف، وذهب الحنابلة إلى اشتراط انقضاء العدة والتوبة في المرأة الزانية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}."
  en: "In the lexicon, iffa is restraint from what is unlawful or unbecoming; a man or woman is chaste when he or she refrains from forbidden things {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. The word ihsan (protection or chastity) has four senses: chastity, marriage, freedom and Islam, and is wider than chastity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. Islam guards human dignity, so begging is forbidden to one who has enough, and permitted to the truly needy within limits {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. Believers are praised for chastity and forbidden to approach what leads to adultery; the means of chastity are marriage for those able to bear its cost and fasting for those who cannot {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. The jurists hold that one who can afford marriage, whose desire is strong, and who fears adultery must marry {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. They differ on whether a man must provide chastity for his ascendants and descendants {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. The majority hold that one partner's adultery does not bar the chaste from marrying the other; the Hanbalis require, for a woman, that her waiting period end and that she repent {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}."
