label:
  ar: "العِفّة"
  en: "Chastity and restraint (iffa)"
  ur: "عفت"
  es: "Castidad y moderación (iffa)"
  fr: "Chasteté et retenue (iffa)"
summary:
  ar: "العفة في اللغة الكف عما لا يحل ولا يجمل، يقال عف الرجل والمرأة عن المحارم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. والحصانة تطلق على العفة، وعلى الزواج، وعلى الحرية، وعلى الإسلام، فالحصانة أعم من العفة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. ويحرص الإسلام على صون الكرامة، فيحرم السؤال على من يملك ما يغنيه، ويجوز لمن احتاج بقدر الحاجة بشروط {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. وأمر الله المؤمنين بالعفة عن الزنا ونهاهم عن مقدماته، وأرشد من قدر على مؤنة النكاح إلى الزواج، ومن لم يستطع إلى الصوم وقاية، ويجب على من يجد الأهبة وتتوق نفسه ويخاف الوقوع في الزنا أن يتزوج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. واختلف الفقهاء في وجوب إعفاف الأصول والفروع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. وذهب جمهور الفقهاء إلى أن زنا أحد الزوجين لا يحرم نكاحه على العفيف، وذهب الحنابلة إلى اشتراط انقضاء العدة والتوبة في المرأة الزانية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}."
  en: "In the lexicon, iffa is restraint from what is unlawful or unbecoming; a man or woman is chaste when he or she refrains from forbidden things {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. The word ihsan (protection or chastity) has four senses: chastity, marriage, freedom and Islam, and is wider than chastity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. Islam guards human dignity, so begging is forbidden to one who has enough, and permitted to the truly needy within limits {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. Believers are praised for chastity and forbidden to approach what leads to adultery; the means of chastity are marriage for those able to bear its cost and fasting for those who cannot {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. The jurists hold that one who can afford marriage, whose desire is strong, and who fears adultery must marry {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. They differ on whether a man must provide chastity for his ascendants and descendants {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. The majority hold that one partner's adultery does not bar the chaste from marrying the other; the Hanbalis require, for a woman, that her waiting period end and that she repent {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}."
  es: "En el léxico, iffa es la abstención de lo que es ilícito o impropio; un hombre o una mujer es casto cuando se abstiene de las cosas prohibidas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. La palabra ihsan (protección o castidad) tiene cuatro sentidos: castidad, matrimonio, libertad e Islam, y es más amplia que la castidad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. El Islam protege la dignidad humana, por lo que la mendicidad está prohibida para quien tiene suficiente y permitida para los verdaderamente necesitados dentro de ciertos límites {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. Los creyentes son elogiados por la castidad y se les prohíbe acercarse a lo que conduce al adulterio; Los medios de castidad son el matrimonio para aquellos que pueden costearlo y el ayuno para aquellos que no pueden {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. Los juristas sostienen que quien puede costear el matrimonio, cuyo deseo es fuerte y quien teme el adulterio debe casarse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. Difieren en si un hombre debe proporcionar castidad a sus ascendientes y descendientes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. La mayoría sostiene que el adulterio de uno de los cónyuges no impide que el casto se case con el otro; Los hanbalíes exigen, para una mujer, que termine su período de espera y que se arrepienta {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}."
  fr: "Dans le lexique, iffa désigne la retenue face à ce qui est illicite ou inconvenant; un homme ou une femme est chaste lorsqu’il ou elle s’abstient des choses interdites {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11670}. Le mot ihsan (protection ou chasteté) a quatre sens: chasteté, mariage, liberté et islam, et son sens est plus large que celui de la simple chasteté {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. L’islam protège la dignité humaine; ainsi, la mendicité est interdite à celui qui possède suffisamment, et permise au véritablement nécessiteux, dans certaines limites {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671}. Les croyants sont loués pour leur chasteté et il leur est interdit de s’approcher de ce qui conduit à l’adultère. Les moyens de chasteté sont le mariage pour ceux qui peuvent en supporter le coût et le jeûne pour ceux qui ne le peuvent pas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11671} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. Les juristes estiment que celui qui a les moyens de se marier, dont le désir est fort et qui craint l'adultère doit se marier {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. Ils divergent quant à savoir si un homme doit assurer la chasteté à ses ascendants et descendants {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}. La majorité considère que l'adultère d'un conjoint n'empêche pas le conjoint chaste d'épouser l'autre. Les Hanbalites exigent, pour une femme, que sa période d'attente prenne fin et qu'elle se repente {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11672}."
  ur: "لغت میں اففا غیر قانونی یا ناجائز چیز سے روکنا ہے۔ ایک مرد یا عورت پاکیزہ ہے جب وہ حرام چیزوں سے پرہیز کرے لفظ احسان ⁦(تحفظ یا عفت)⁩ کے چار حواس ہیں: عفت، نکاح، آزادی اور اسلام، اور عفت سے وسیع تر ہے۔ اسلام انسانی وقار کی حفاظت کرتا ہے، اس لیے بھیک مانگنا حرام ہے جس کے پاس کافی ہے، اور ضرورت مندوں کو حد کے اندر اجازت دی گئی ہے۔ مومنوں کی پاکدامنی کی تعریف کی جاتی ہے اور زنا کی طرف جانے والی چیزوں تک پہنچنے سے منع کیا جاتا ہے۔ عفت کا وسیلہ ان کے لیے نکاح ہے جو اس کے اخراجات برداشت کرنے کی استطاعت رکھتے ہیں اور ان کے لیے روزہ رکھنا ہے جو اس کی قیمت برداشت نہیں کر سکتے۔ فقہاء کا خیال ہے کہ جو شخص نکاح کی استطاعت رکھتا ہو، جس کی خواہش شدید ہو، اور جسے زنا کا خوف ہو اسے شادی کرنی چاہیے۔ ان میں اس بات پر اختلاف ہے کہ آیا آدمی کو اپنے آنے والوں اور نسلوں کے لیے عفت کا اہتمام کرنا چاہیے اکثریت کا خیال ہے کہ ایک ساتھی کا زنا پاکیزہ کو دوسرے سے شادی کرنے سے نہیں روکتا۔ حنبلیوں کا تقاضا ہے کہ عورت کے لیے اس کی عدت ختم ہو جائے اور وہ توبہ کرے۔"
