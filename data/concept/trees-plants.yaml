label:
  ar: "الأشجار والنبات"
  en: "Trees and plants"
  ur: "درخت اور نباتات"
  es: "Árboles y plantas"
  fr: "Arbres et plantes"
  tr: "Ağaçlar ve Bitkiler"
  id: "Pohon dan Tumbuhan"
summary:
  ar: "النجم والشجر يسجدان، وينبت الله الزرع والزيتون والنخيل والأعناب وكل الثمرات، ومثل ما أنزل من السماء من ماء فأحيا به الأرض بعد موتها، وفي حرمة مكة لا يقطع شجرها."
  en: "The stars and the trees both prostrate; God brings forth crops, olives, palms, vines and every fruit; the likeness of what He sends down is the rain by which He revives the earth after its death; and in the sanctity of Mecca its trees may not be cut."
  ur: "ستارے اور درخت دونوں سجدہ کرتے ہیں؛ اللہ فصلیں، زیتون، کھجور، انگور اور ہر پھل اگاتا ہے؛ اس کے نازل کردہ کی مثال بارش ہے جس سے وہ مردہ زمین کو زندہ کرتا ہے؛ اور مکہ کی حرمت میں اس کے درخت کاٹے نہیں جا سکتے۔"
  es: "Las estrellas y los árboles se postran; Dios hace brotar cosechas, olivos, palmeras, vides y toda clase de frutos; la semejanza de lo que Él envía es la lluvia con la que revive la tierra después de su muerte; y en la santidad de La Meca sus árboles no pueden ser cortados."
  fr: "Les étoiles et les arbres se prosternent; Dieu fait pousser les récoltes, les oliviers, les palmiers, les vignes et toutes sortes de fruits; ce qu'il envoie est semblable à la pluie par laquelle il fait revivre la terre après sa mort; et dans la sainteté de La Mecque, on ne peut couper ses arbres."
  tr: "Yıldızlar ve ağaçlar secde eder, Tanrı ürünlerin, zeytinlerin, palmiyelerin, üzümün ve tüm meyvelerin büyümesini sağlar; gökten indirilen su gibi, ölümünden sonra yeryüzünü canlandırdığı su gibi, Mekke'nin kutsallığında ağaçlar kesilmez."
  id: "Bintang dan pohon sujud, dan Tuhan membuat tanaman, zaitun, pohon palem, anggur, dan semua buah tumbuh, dan seperti air yang turun dari langit, yang digunakan Dia untuk menghidupkan bumi setelah kematiannya, dan di kesucian Mekah, pohon-pohonnya tidak ditebang."
