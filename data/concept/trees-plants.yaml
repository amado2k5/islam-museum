summary:
  ar: "النجم والشجر يسجدان، وينبت الله الزرع والزيتون والنخيل والأعناب وكل الثمرات، ومثل ما أنزل من السماء من ماء فأحيا به الأرض بعد موتها، وفي حرمة مكة لا يقطع شجرها."
  en: "The stars and the trees both prostrate; God brings forth crops, olives, palms, vines and every fruit; the likeness of what He sends down is the rain by which He revives the earth after its death; and in the sanctity of Mecca its trees may not be cut."
  ur: "ستارے اور درخت دونوں سجدہ کرتے ہیں؛ اللہ فصلیں، زیتون، کھجور، انگور اور ہر پھل اگاتا ہے؛ اس کے نازل کردہ کی مثال بارش ہے جس سے وہ مردہ زمین کو زندہ کرتا ہے؛ اور مکہ کی حرمت میں اس کے درخت کاٹے نہیں جا سکتے۔"
