label:
  ar: "علم البلاغة"
  en: "Rhetoric (balagha)"
  ur: "علمِ بلاغت"
  fr: "La rhétorique (balagha)"
  es: "La retórica (balagha)"
  tr: "retorik"
  id: "retorika"
summary:
  ar: "ما يقوله القزويني في الإيضاح عن بلاغة الكلام والمتكلم وتقسيم علم البلاغة إلى المعاني والبيان والبديع، وحدّا السكاكي في المفتاح للمعاني والبيان، ووصف ابن خلدون للأصناف الثلاثة وتاريخها وثمرتها في فهم الإعجاز، وما يقوله شارح الإيضاح خفاجي في نشأة التدوين وفي تفاوت بلاغة القرآن. وتنسب الصفحة كل قول إلى صاحبه."
  en: "What al-Qazwini says in al-Idah of the eloquence of speech and of the speaker and of the division of the science of rhetoric into ma'ani, bayan and badi'; al-Sakkaki's two definitions in the Miftah; Ibn Khaldun's account of the three kinds, their history and their fruit in understanding i'jaz; and what Khafaji, the commentator on al-Idah, says of the beginnings of writing on it and of whether the Qur'an's eloquence varies. The page ascribes each statement to its author."
  ur: "قزوینی کا الایضاح میں کلام اور متکلم کی فصاحت اور بلاغت کے بارے میں کہنا اور علمِ بلاغت کی معانی، بیان اور بدیع میں تقسیم؛ سکاکی کی مفتاح میں دو تعریفیں؛ ابن خلدون کا تینوں اصناف، ان کی تاریخ اور اعجازِ قرآن کے فہم میں ان کے ثمرے کا بیان؛ اور الایضاح کے شارح خفاجی کا اس پر لکھنے کی ابتدا اور اس بارے میں کہنا کہ قرآن کی بلاغت میں تفاوت ہے یا نہیں۔ صفحہ ہر بات اس کے صاحب کی طرف منسوب کرتا ہے۔"
  fr: "Ce que dit al-Qazwini dans al-Idah de l'éloquence du discours et du locuteur et de la division de la science de la rhétorique en ma'ani, bayan et badi' ; les deux définitions d'al-Sakkaki dans le Miftah ; l'exposé d'Ibn Khaldun sur les trois sortes, leur histoire et leur fruit dans la compréhension de l'i'jaz ; et ce que dit Khafaji, commentateur d'al-Idah, des débuts de l'écriture sur ce sujet et de la question de savoir si l'éloquence du Coran varie. La page attribue chaque propos à son auteur."
  es: "Lo que dice al-Qazwini en al-Idah sobre la elocuencia del discurso y del hablante y sobre la división de la ciencia de la retórica en ma'ani, bayan y badi'; las dos definiciones de al-Sakkaki en el Miftah; el relato de Ibn Jaldún sobre las tres clases, su historia y su fruto en la comprensión del i'jaz; y lo que dice Khafaji, comentarista de al-Idah, sobre los comienzos de la escritura sobre ella y sobre si la elocuencia del Corán varía. La página atribuye cada afirmación a su autor."
  tr: "El-Kazvini'nin El-İdayah'ta konuşma ve teologun etkililiği, retoriğin anlamlar, retorik ve retorik olarak ayrılması hakkında söyledikleri, ayrıca El-Sakkaki'nin 'El-Miftah küçük Ma'ani ve El-Bayan' adlı eserinde İbn Haldun'un bu üç türü, tarihlerini ve mucizeleri anlamadaki meyvelerini tanımını ve yorumcu El-İdha Hafaci'nin Kur'an'ın belgelerin kökeni ve söylemlerindeki çeşitlilik hakkında söylediklerini anlatır. Sayfa, her ifadeyi yazarına atfeder."
  id: "Apa yang dikatakan Al-Qazwini dalam Al-Idayah tentang kefasihan ucapan dan teolog, serta pembagian retorika menjadi makna, retorika, dan retorika, serta 'Al-Miftah lil-Ma'ani wa Al-Bayan' karya Al-Sakkaki, deskripsi Ibn Khaldun tentang tiga jenis tersebut, sejarahnya, dan buahnya dalam memahami mukjizat, serta apa yang dikatakan komentator Al-Idhah Khafaji tentang asal-usul dokumentasi dan variasi retorika Al-Qur'an. Halaman tersebut mengaitkan setiap pernyataan dengan penulisnya."
