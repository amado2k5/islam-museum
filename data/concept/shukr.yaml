id: concept/shukr
class: concept
kind: doctrine
label:
  ar: "الشكر على النعمة"
  en: "Gratitude for blessings (shukr)"
summary:
  ar: "يرى الشعراوي أن الذكر والشكر متلازمان، وأن الشكر يجعل الله يزيد النعمة، وأن نسبة النعمة إلى الله تحصّنها، وأن إضافتها إلى النفس تسلبها. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.646}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.647}"
  en: "Sha'rawi holds that remembrance and gratitude go together, that gratitude brings more blessing from God, that ascribing a blessing to God protects it, and that ascribing it to oneself makes it leave {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.646}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.647}."
wings: [ideas]
themes: [spirituality-and-sufism, worship-and-the-pillars]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "كيف يُشكر الله على النعمة حتى تدوم، وما الفرق بين الشكر والكفر بالنعمة في معناه القلبي؟"
  en: "How is God to be thanked for a blessing so that it lasts, and what is the difference between thankfulness and concealing blessings?"
perspectives:
  - tradition: sunni
    id: sharawi-gratitude-remembrance
    stance:
      ar: "الشكر ذكر المنعم والإقرار بفضله، والنعمة تدوم بنسبتها إليه"
      en: "Gratitude is remembering the giver and acknowledging His favour; a blessing lasts when it is ascribed to Him"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن النعمة إذا استُقبلت بذكر المنعم ونسبت إليه حُصّنت من المكروه، وأن نسبتها إلى النفس وإلى قوة الإنسان تجعلها تفارقه، ويقول إن الشكر يُذهب الغرور عن النفس. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.646}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.647}"
      en: "Sha'rawi says that a blessing received with the remembrance of its giver and ascribed to Him is guarded from harm, while ascribing it to oneself makes it leave, and that gratitude removes pride from the soul {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.646}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.647}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-unnamed-report
    stance:
      ar: "عمل مأثور يذكره الشعراوي دون مصدر مسمى لم يُعتمد هنا"
      en: "A practice Sha'rawi reports from an unnamed source is not adopted here"
    holders: []
    summary:
      ar: "يذكر الشعراوي عن بعض الصالحين أن يقسم شرب الماء إلى ثلاث جرعات يذكر الله قبل كل منها ويحمده بعدها، لكن النص لا يسمي المصدر، ولذلك لا يُعتمد هنا. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.646}"
      en: "Sha'rawi recounts a practice of sipping water in three draughts with God's name before and praise after, attributed to unnamed righteous people and a report he does not identify; this entry does not adopt it {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.646}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
