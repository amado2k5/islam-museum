label:
  ar: "الشكر"
  en: "Gratitude (shukr)"
  ur: "شکر"
summary:
  ar: "الشكر في درس الشيخ عمر عبد الكافي نعمة يغفل عنها الناس: نعم عامة كالهواء والماء والأمن والصحة، ونعم خاصة كالمال والبيت. ويرى الشيخ أن الصبر والشكر شطرا الإيمان (قوله، needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep05 00:12:30}"
  en: "In Sheikh Omar Abdelkafy's lessons, gratitude is owed for blessings people overlook: general ones such as air, water, security and health, and private ones such as wealth and a home. He holds that patience and gratitude are the two halves of faith (his statement, needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep05 00:12:30}"
  ur: "شیخ عمر عبدالکافی کے درسوں میں شکر ان نعمتوں پر واجب ہے جنہیں لوگ نظرانداز کرتے ہیں: عام نعمتیں جیسے ہوا، پانی، امن اور صحت، اور ذاتی نعمتیں جیسے مال اور گھر۔ ان کے نزدیک صبر اور شکر ایمان کے دو حصے ہیں (ان کا بیان، needs_source)۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep05 00:12:30}"
