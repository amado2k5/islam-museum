id: "concept/alamat-al-sar-al-mushtaraka"
class: "concept"
kind: "scientific"
label:
  ar: "العلامات المشتركة للصرع وإنذاراته"
  en: "Common and premonitory signs of epilepsy"
  fr: "Signes communs et avant-coureurs de l’épilepsie"
  ur: "صرع کی مشترک اور پیشگی علامات"
summary:
  ar: "العلامات المشتركة لأكثر أصناف المصروعين: ضفرة ألسنتهم وخضرة العروق التي تحتها، ويتقدّمه ثقل في الرأس ودوار وظلمة في العين وثقل في اللسان والحواس وأحلام رديئة {cite:canon-ibn-sina-print-v2 p.122} {cite:canon-ibn-sina-print-v2 p.123}"
  en: "The signs shared by most kinds of epileptics: fur on their tongues and greenness of the veins beneath them, preceded by heaviness of the head, dizziness, darkness of the eye, heaviness of tongue and senses, and bad dreams {cite:canon-ibn-sina-print-v2 p.122} {cite:canon-ibn-sina-print-v2 p.123}"
  fr: "Les signes qu’Ibn Sina retrouve dans la plupart des formes d’épilepsie sont un enduit sur la langue et une teinte verdâtre des veines situées dessous. Une pesanteur de la tête, des vertiges, un obscurcissement de la vue, une lourdeur de la langue et des sens et de mauvais rêves les précèdent {cite:canon-ibn-sina-print-v2 p.122} {cite:canon-ibn-sina-print-v2 p.123}."
  ur: "بیشتر اقسام کے صرع زدگان کی مشترک علامات: ان کی زبانوں پر جھاڑ اور اس کے نیچے کی رگوں کا سبز پن، اور اس سے پہلے سر کی گرانی، دوار، آنکھ کا تاریک ہونا، زبان اور حواس کی گرانی، اور برے خواب {cite:canon-ibn-sina-print-v2 p.122} {cite:canon-ibn-sina-print-v2 p.123}۔"
