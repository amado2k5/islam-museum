id: concept/canon-regimen-of-autumn
class: concept
kind: scientific
label: { ar: "تدبير الخريف عند ابن سينا", en: "The regimen of autumn in the Canon", ur: "موسم خزاں کی تدبیر قانون میں" }
summary:
  ar: "يعد ابن سينا الخريف أخطر الفصول تقلباً، فيلزم فيه أجود التدبير ويهجر المجففات كلها، ويحذر الجماع وكثرة شرب الماء البارد وصبه على الرأس والنوم على الامتلاء والفواكه الوقتية، ثم يستفرغ إذا استوى الليل والنهار {cite:canon-ibn-sina-print-v1 p.258}."
  en: "Ibn Sina treats autumn as the season of most changeable air, so the best regimen is kept, all drying things are avoided, and one guards against intercourse, much cold water and pouring it on the head, sleeping when full, and seasonal fruits, then evacuates when night and day are equal {cite:canon-ibn-sina-print-v1 p.258}."
