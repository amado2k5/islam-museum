id: concept/canon-regimen-of-autumn
class: concept
kind: scientific
label:
  ar: "تدبير الخريف عند ابن سينا"
  en: "The regimen of autumn in the Canon"
  fr: "Régime d’automne dans le Canon"
  ur: "موسم خزاں کی تدبیر قانون میں"
  es: "El régimen de otoño en el Canon"
  tr: "İbn Sina'ya göre Sonbaharı Yönetmek"
  id: "Mengelola Musim Gugur menurut Ibn Sina"
summary:
  ar: "يعد ابن سينا الخريف أخطر الفصول تقلباً، فيلزم فيه أجود التدبير ويهجر المجففات كلها، ويحذر الجماع وكثرة شرب الماء البارد وصبه على الرأس والنوم على الامتلاء والفواكه الوقتية، ثم يستفرغ إذا استوى الليل والنهار {cite:canon-ibn-sina-print-v1 p.258}."
  en: "Ibn Sina treats autumn as the season of most changeable air, so the best regimen is kept, all drying things are avoided, and one guards against intercourse, much cold water and pouring it on the head, sleeping when full, and seasonal fruits, then evacuates when night and day are equal {cite:canon-ibn-sina-print-v1 p.258}."
  fr: "Ibn Sina juge l’air automnal très changeant : régime particulièrement soigné, évitement des desséchants, des rapports sexuels, de l’eau froide abondante ou versée sur la tête, du sommeil après satiété et des fruits de saison ; évacuation à l’équinoxe {cite:canon-ibn-sina-print-v1 p.258}."
  es: "Ibn Sina considera el otoño como la estación del aire más variable, por lo que se mantiene el mejor régimen, se evitan todas las cosas que resecan y uno se protege de las relaciones sexuales, mucha agua fría y vertiéndola sobre la cabeza, dormir cuando se está satisfecho y frutas de temporada, luego evacuar cuando la noche y el día tienen la misma duración {cite:canon-ibn-sina-print-v1 p.258}."
  ur: "ابن سینا موسم خزاں کو سب سے زیادہ بدلنے والی ہوا کا موسم مانتے ہیں، اس لیے بہترین طریقہ کار رکھا جاتا ہے، تمام خشک ہونے والی چیزوں سے پرہیز کیا جاتا ہے، اور ایک جماع سے حفاظت کرتا ہے، بہت زیادہ ٹھنڈا پانی ڈال کر اسے سر پر ڈالتا ہے، جب پیٹ بھر کر سوتا ہے، اور موسمی پھل، پھر جب رات اور دن برابر ہوں تو باہر نکلتے ہیں۔"
  tr: "İbn Sina, sonbaharı değişim açısından en tehlikeli mevsim olarak görür, en iyi yönetime bağlı kalır ve tüm kuru yiyecekleri terk eder. Cinsel ilişkiye dikkat eder, aşırı soğuk su içip başına döker, tok uyur ve geçici meyveler verir, gece ve gündüz eşitlendiğinde kusur {cite:canon-ibn-sina-print-v1 s.258}."
  id: "Ibn Sina menganggap musim gugur sebagai musim paling berbahaya dalam hal perubahan, mematuhi pengelolaan terbaik dan meninggalkan semua makanan kering. Ia berhati-hati terhadap hubungan seksual, minum air dingin berlebihan dan menuangkannya ke kepala, tidur kenyang, dan buah sementara, lalu muntah ketika malam dan siang menjadi sama {cite:canon-ibn-sina-print-v1 hlm.258}."
