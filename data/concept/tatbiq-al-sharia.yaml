label:
  ar: "تطبيق الشريعة — بين الكلية والمرحلة"
  en: "Implementing the sharia — totality versus stages"
issue:
  ar: "هل تطبق الشريعة كاملة دفعة واحدة أم بالتدرج، وهل الداعون إليها يعرفون تفاصيلها؟"
summary:
  ar: "حلقة «الوسطية» عن تطبيق الشريعة بين الكلية والمرحلية. صوّت الجمهور أن المفهوم عند الداعين إليه واضح في العموم والتفاصيل عند 28% فقط، وواضح في العموم دون تفاصيل عند 69%، وغير واضح عند 3%. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:06:30} ولخص أحمد نوفل القاعدة: «التأصيل رباني والتفصيل إنساني» — العموميات منزلّة والتفاصيل اجتهاد يختبره الميدان. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:09:00}"
  en: "The 'Al-Wasatiyya' episode on implementing the sharia — wholesale or in stages. The audience voted the concept clear in both general and detail to only 28% of its advocates, clear in general but not in detail to 69%, and unclear to 3%. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:06:30} Ahmad Nawfal compressed the rule: 'the foundation is divine, the detailing human' — the generalities are revealed, the details are ijtihad tested in the field. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:09:00}"
perspectives:
- tradition: sunni
  id: gradualism-divine-sunna
  stance:
    ar: "التدرج سنة إلهية وضرورة واقعية"
  summary:
    ar: "جمع اللواء حمزة منصور وهايل عبد الحفيظ وأحمد نوفل على التدرج: «سنة إلهية» جاء بها القرآن منجّماً، وقصة عمر بن عبد العزيز مع ابنه — «لو حملنا الناس على الحق جملة لتركوه جملة» — وشرط الجدية في التماس البديل لا المماطلة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:24:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:26:30} والتفاصيل غائبة لغياب الإسلام عن الساحة، والاجتهاد يحتاج الميدان والسلطة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:23:30}"
