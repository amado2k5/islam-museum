  summary:
    ar: "أصرّ فخري أبو صفية أن الشريعة كلٌّ لا يؤخذ بعضها ويترك بعضها — «فتؤمنون ببعض الكتاب وتكفرون ببعض» — لكن الطريق ليس الإكراه بل التربية والتوجيه؛ والدستور الإسلامي موجود منذ 1200 سنة مطبَّقاً، والمطلوب صياغته القانونية المعاصرة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 01:04:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 01:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 01:06:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 01:07:00}"
