label:
  ar: "تطبيق الشريعة — بين الكلية والمرحلة"
  en: "Implementing the sharia — totality versus stages"
  es: "Implementación de la sharia: totalidad versus etapas."
  fr: "Mise en œuvre de la charia — totalité versus étapes"
  ur: "شریعت کا نفاذ - مجموعی بمقابلہ مراحل"
issue:
  ar: "هل تطبق الشريعة كاملة دفعة واحدة أم بالتدرج، وهل الداعون إليها يعرفون تفاصيلها؟"
summary:
  ar: "حلقة «الوسطية» عن تطبيق الشريعة بين الكلية والمرحلية. صوّت الجمهور أن المفهوم عند الداعين إليه واضح في العموم والتفاصيل عند 28% فقط، وواضح في العموم دون تفاصيل عند 69%، وغير واضح عند 3%. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:06:30} ولخص أحمد نوفل القاعدة: «التأصيل رباني والتفصيل إنساني» — العموميات منزلّة والتفاصيل اجتهاد يختبره الميدان. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:09:00}"
  en: "The 'Al-Wasatiyya' episode on implementing the sharia — wholesale or in stages. The audience voted the concept clear in both general and detail to only 28% of its advocates, clear in general but not in detail to 69%, and unclear to 3%. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:06:30} Ahmad Nawfal compressed the rule: 'the foundation is divine, the detailing human' — the generalities are revealed, the details are ijtihad tested in the field. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:09:00}"
  es: "El episodio de 'Al-Wasatiyya' sobre la implementación de la sharia, ya sea de forma integral o por etapas. La audiencia votó que el concepto era claro, tanto en general como en detalle, para solo el 28% de sus defensores; claro en general pero no en detalle para el 69%; y poco claro para el 3%. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:06:30} Ahmad Nawfal resumió la regla: \"el fundamento es divino, el detalle humano\": las generalidades se revelan, los detalles se prueban mediante ijtihad en la práctica. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:09:00}"
  fr: "L'épisode d'« Al-Wasatiyya » consacré à la mise en œuvre de la charia – intégralement ou progressivement – a suscité des interrogations. Seuls 28 % des participants ont jugé le concept clair, tant dans ses grandes lignes que dans ses détails; 69 % l'ont trouvé clair dans ses grandes lignes mais pas dans ses détails; et 3 % l'ont jugé flou. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:06:30} Ahmad Nawfal a résumé la règle ainsi: « Le fondement est divin, les détails humains » – les généralités sont révélées, les détails sont validés par l'ijtihad, l'expérience du terrain. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:09:00}"
  ur: "شریعت کے نفاذ سے متعلق 'الوصطیہ' ایپیسوڈ — تھوک یا مراحل میں۔ سامعین نے اس تصور کو عمومی اور تفصیل سے واضح طور پر صرف 28% کے حق میں ووٹ دیا، عام طور پر واضح لیکن 69% تک تفصیل سے نہیں، اور 3% کو غیر واضح۔ {حوالہ:اصابیل-طارق-السویدان الوصیتیہ/ep04 00:06:30} احمد نوفل نے اس اصول کو کمپریس کیا: 'بنیاد الہی ہے، تفصیل انسانی ہے' — عمومیات سامنے آتی ہیں، تفصیلات کو میدان میں اجتہاد پرکھا جاتا ہے۔ {حوالہ:اسابیل-طارق-السویدان الوصیتیہ/ep04 00:09:00}"
