    ar: "العموميات عندنا والقوانين العصرية غائبة"
  summary:
    ar: "شدّد محمد الخطيب على أن التفاصيل المقصودة هي «القوانين كيف تنفذ» — وأن لا أحد كتبها داخل الحركات الإسلامية إلا محاولة المودودي في الدستور الإسلامي؛ والبرامج التربوية والاجتماعية والاقتصادية والسياسية تحتاج صياغة بروح الشريعة العصرية. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:13:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep04 00:14:30}"
