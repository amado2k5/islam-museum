id: concept/duhn
class: concept
kind: natural
label:
  ar: "دهن"
  en: "Oils (duhn)"
  ur: "روغن ⁦(دہن)⁩"
  es: "Aceites (duhn)"
  fr: "Huiles (duhn)"
  tr: "şişman"
  id: "lemak"
summary:
  ar: "الدهن هو الزيوت كلها، فيها البلسان والخروع والفجل والسوسن والياسمين والورد والبابونج والآس والقسط، وفيها التبريد والتحليل والقبض والتفتيح على قدر كل دهن. {cite:canon-ibn-sina-print-v1 p.443}"
  en: "Duhn is the group of oils: balsam, castor, radish, iris, jasmine, rose, chamomile, myrtle and costus, with cooling, resolving, astringent and opening effects in varying degrees. {cite:canon-ibn-sina-print-v1 p.443}"
  ur: "دہن سے مراد تمام روغن ہیں: بلسان، ارنڈ، مولی، سوسن، چنبیلی، گلاب، بابونہ، آس اور قسط؛ ہر روغن کے مطابق ٹھنڈک، تحلیل، قبض اور کشادگی کی خاصیت ہے۔ {cite:canon-ibn-sina-print-v1 p.443}"
  es: "Duhn es el grupo de aceites: bálsamo, ricino, rábano, iris, jazmín, rosa, manzanilla, mirto y costus, con efectos refrescantes, resolutivos, astringentes y estimulantes en diversos grados. {cite:canon-ibn-sina-print-v1 p.443}"
  fr: "Duhn désigne le groupe d'huiles: baume, ricin, radis, iris, jasmin, rose, camomille, myrte et costus, aux effets rafraîchissants, résolutifs, astringents et ouvrants à des degrés variables. {cite:canon-ibn-sina-print-v1 p.443}"
  tr: "Yağ tüm yağlardır; mürver, hint ağacı, turp, iris, yasemin, gül, papatya, mersin ve qist dahil. Her yağa göre soğutma, çözünme, tutuşturma ve parlaklaştırma özelliklerine sahiptir. {cite:canon-ibn-sina-print-v1 s.443}"
  id: "Lemak adalah semua minyak, termasuk elderberry, jarak, lobak, iris, melati, mawar, chamomile, myrtle, dan qist. Lemak memiliki pendinginan, pelarutan, cengkeraman, dan pencerahan sesuai dengan setiap lemak. {cite:canon-ibn-sina-print-v1 hlm.443}"
