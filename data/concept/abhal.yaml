label:
  ar: "الأبهل"
  en: "Abhal (the juniper tree in the book's account)"
  ur: "ابہل"
summary:
  ar: "الأبهل في الكتاب شجرة العرعر، صنفان صغير وكبير يؤتى بهما من بلاد الروم، حادّ الرائحة؛ حارّ يابس في الثالثة عند بعضهم، شديد التحليل وفيه تجفيف مع لذع وقبض خفي، ويدخل في الأدهان المسخنة والطيبة؛ ذروره ينفع من الأكلة والقروح العفنة، ويجفّف ولا يدمل، وينفع جوزه من الصمم؛ ويذكر الكتاب فيه قولاً عن الجنين في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.351}"
  en: "In the book abhal is the juniper tree, in two kinds, small and large, brought from the land of Rum, sharp of smell; some say it is hot and dry in the third degree, strongly resolving, drying with a sting and a hidden astringency, and it enters the warming and the perfumed oils; its powder helps the eating ulcer and putrid ulcers, it dries and does not cicatrize, and its nuts are listed for deafness; the book also gives a statement on the foetus in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.351}"
  ur: "ابہل کتاب میں عرعر کا درخت ہے، دو قسمیں چھوٹی اور بڑی جو روم کے ملک سے لائی جاتی ہیں، تیز بو والا؛ بعض کے نزدیک تیسرے درجے میں گرم خشک ہے، سخت تحلیل کرنے والا، جلن کے ساتھ خشک کرنے والا اور خفیف قبض رکھنے والا، اور گرم کرنے والے اور خوشبو دار تیلوں میں داخل ہوتا ہے؛ اس کا سفوف اکلہ اور سڑے ہوئے زخموں میں مفید ہے، یہ خشک کرتا ہے اور زخم نہیں بھرتا، اور اس کے دانے بہرے پن میں مذکور ہیں؛ کتاب جنین کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.351}۔"
