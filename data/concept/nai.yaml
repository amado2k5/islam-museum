class: concept
kind: legal
label: { ar: "النَّعْي", en: "Nai (announcing a death)", ur: "نعی (موت کی خبر دینا)" }
summary:
  ar: "النعي في اللغة خبر الموت، والناعي من يأتي بخبره أو يذيعه، وكانت العرب ترسل راكباً ينعى الشريف إلى قبائله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15797} والندب والنوح يتصلان بالنعي ولا يلازمانه، فالنوح رفع الصوت بالبكاء مع الرنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15798} والنعي المستحب إعلام الجيران والأصدقاء والصلاح بالميت ليؤدوا حقه، والمباح الإعلام بغير صياح، والمكروه ما كان بنداء عند الحنابلة والمالكية، والمحرم ما اشتمل على النحيب وتعداد المحاسن مباهاة ونعي الجاهلية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803}"
  en: "Nai, in the lexicon, is news of a death; the announcer (nai) brings or spreads it. The Arabs used to send a rider to tell the tribes of the death of a noble man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15797} Lamentation and wailing are related but not necessarily part of the announcement. Wailing is raising the voice in weeping with a keen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15798} Informing neighbours, friends and the righteous is recommended; announcing quietly is permitted; calling it out is disliked by the Hanbalis and Malikis; wailing, boasting and the pre-Islamic form are forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803}"
  ur: "نعی لغت میں موت کی خبر کو کہتے ہیں، اور ناعی وہ ہے جو خبر لائے یا اسے پھیلائے۔ عرب کسی بڑے شخص کی موت پر قبیلوں میں سوار بھیجتے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15797} نوح اور ندب نعی سے متعلق ہیں مگر اس کے لازم نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15798} پڑوسیوں اور دوستوں کو خبر دینا مستحب ہے، آہستہ خبر دینا جائز ہے، پکار کر اعلان مکروہ ہے، اور نوحہ، فخر اور جاہلیت کا طریقہ حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15803}"
