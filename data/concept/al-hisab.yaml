id: concept/al-hisab
class: concept
kind: belief
label:
  ar: الحساب
  en: The Reckoning
  fr: "Le Jugement des comptes"
  ur: حساب
  es: "El ajuste de cuentas"
  tr: "Hesap"
  id: "Akun"
summary:
  ar: "وقوف الخلائق بين يدي الله يوم القيامة ليجازيهم بأعمالهم؛ يأخذ المؤمن كتابه بيمينه فيحاسب حسابًا يسيرًا ويرجع إلى أهله مسرورًا، ومن أوتي كتابه بشماله فحساب عسير {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  en: "The standing of creation before God on the Day of Resurrection to be judged for their deeds: the believer takes his book in his right hand and is reckoned an easy reckoning and returns to his people rejoicing; who takes it in his left faces a hard reckoning {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  fr: "La comparution des créatures devant Dieu le Jour de la Résurrection pour être jugées selon leurs actes : le croyant prend son livre de la main droite, subit un jugement facile et retourne joyeux auprès des siens ; celui qui le prend de la main gauche subit un jugement difficile {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  ur: "قیامت کے دن مخلوقات کا اللہ کے سامنے اعمال کا حساب؛ مومن اپنی کتاب دائیں ہاتھ میں پائے گا اور آسان حساب ہو کر خوش لوٹے گا، جسے بائیں ہاتھ میں ملے اس کا حساب سخت ہوگا {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}۔"
  es: "La posición de la creación ante Dios en el Día de la Resurrección para ser juzgada por sus obras: el creyente toma su libro en su mano derecha y se le considera un juicio fácil y regresa a su pueblo regocijándose; quien lo toma en su mano izquierda enfrenta un juicio difícil {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  tr: "Yaratıklar, Diriliş Günü'nde yaptıkları şeylerle karşılık vermek için Allah'ın huzurunda durur; inanan kitabını sağ eline alır, hafif bir hesapla hesap verir ve mutlu bir şekilde ailesine döner; kitabı sol eline verilenlere ise zor bir hesap verir {kaynak:sahih-al-bukhari} {alıntı:tefsir-ibn-kathir}."
  id: "Makhluk berdiri di hadapan Allah untuk menanggapi apa yang mereka lakukan pada Hari Kebangkitan; orang beriman mengambil kitabnya di tangan kanan, memberikannya dengan perhitungan ringan, dan dengan bahagia kembali kepada keluarganya; mereka yang diberi kitab di tangan kiri memberikan perhitungan yang sulit {sumber: Sahih-al-Bukhari} {kutipan: Tafsir ibn-kathir}."
