label:
  ar: الحساب
  en: The Reckoning
  ur: حساب
summary:
  ar: "وقوف الخلائق بين يدي الله يوم القيامة ليجازيهم بأعمالهم؛ يأخذ المؤمن كتابه بيمينه فيحاسب حسابًا يسيرًا ويرجع إلى أهله مسرورًا، ومن أوتي كتابه بشماله فحساب عسير {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  en: "The standing of creation before God on the Day of Resurrection to be judged for their deeds: the believer takes his book in his right hand and is reckoned an easy reckoning and returns to his people rejoicing; who takes it in his left faces a hard reckoning {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  ur: "قیامت کے دن مخلوقات کا اللہ کے سامنے اعمال کا حساب؛ مومن اپنی کتاب دائیں ہاتھ میں پائے گا اور آسان حساب ہو کر خوش لوٹے گا، جسے بائیں ہاتھ میں ملے اس کا حساب سخت ہوگا {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}۔"
