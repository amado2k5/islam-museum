label:
  ar: "ميعة"
  en: "Maya (a fragrant resin)"
  ur: "میعہ"
  es: "Maya (una resina fragante)"
  fr: "Maya (une résine parfumée)"
summary:
  ar: "الميعة رطبة ويابسة، منها ما يتحلب بنفسه صمغاً أصفر يضرب إلى الذهبية إذا عتق وهو عزيز، ومنها المستحلب بطبخ قشر الشجرة وهو الأسود، وفيها قبض وتجفيف {cite:canon-ibn-sina-print-v1 p.567}."
  en: "Maya is moist and dry: some flows by itself as a yellow gum that turns golden with age and is rare, and some is drawn out by boiling the bark of the tree and is black; it has astringency and drying {cite:canon-ibn-sina-print-v1 p.567}."
  ur: "میعہ تر اور خشک ہوتی ہے: کچھ خود بخود زرد گوند کی صورت میں بہتی ہے جو پرانی ہو کر سنہری ہو جاتی ہے اور نایاب ہے، اور کچھ درخت کی چھال کے جوشاندے سے نکالی جاتی ہے اور سیاہ ہوتی ہے؛ اس میں قبض اور خشک کرنے کی صفت ہے {cite:canon-ibn-sina-print-v1 p.567}۔"
  es: "Maya es húmeda y seca: parte fluye por sí sola como una goma amarilla que se vuelve dorada con la edad y es rara, y parte se extrae hirviendo la corteza del árbol y es negra; tiene astringencia y seca {cite:canon-ibn-sina-print-v1 p.567}."
  fr: "La gomme maya est à la fois humide et sèche: une partie coule d'elle-même sous forme de gomme jaune qui devient dorée avec l'âge et est rare, et une autre partie est extraite en faisant bouillir l'écorce de l'arbre et est noire; elle a des propriétés astringentes et asséchantes {cite:canon-ibn-sina-print-v1 p.567}."
