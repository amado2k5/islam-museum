label: { ar: "الانسحاب", en: "Insihab (the extension of an act or intention over successive moments)", es: "Insihab (la extensión de un acto o intención a lo largo de momentos sucesivos)", fr: "Insihab (l'extension d'un acte ou d'une intention sur des moments successifs)", ur: "انصاحب ⁦(مسلسل لمحوں میں کسی عمل یا ارادے کی توسیع)⁩", tr: "Çekilme", id: "Penarikan" }
summary:
  ar: "الانسحاب لغة مطاوعة السحب بمعنى الجر، وعند الفقهاء والأصوليين امتداد الفعل في أوقات متتالية امتدادا اعتباريا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} ومن أمثلته أن نية المتوضئ تنسحب على أركان الوضوء كلها إذا نواها في أول الركن الأول، ثم ذهل عنها بعد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} ويقع الانسحاب في الواجب الموسع، حيث يكفي العزم في أول الوقت ثم ينسحب على بقيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} وفي العبادة ذات الأفعال المتعددة يكتفى بالنية في أولها، ويتفاوت الفقهاء في ذلك كالحج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3474}"
  en: "Insihab is lexically the reflexive of sahb, to drag; in usul and fiqh it is the conventional extension of an act over successive moments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} Thus an intention formed at the start of the first pillar of ablution is taken to carry over all its pillars, though the mind wanders afterwards. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} It applies to a duty with a flexible time, where resolve at the beginning suffices until the time narrows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} In a worship of several acts one intention at the outset is enough, with the Hanafi treatment of the pilgrimage as a noted exception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3474}"
  es: "Insihab es léxicamente el reflexivo de sahb, arrastrar; en usul y fiqh es la extensión convencional de un acto a través de momentos sucesivos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} Así, una intención formada al comienzo del primer pilar de la ablución se considera que se extiende a todos sus pilares, aunque la mente divague después. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} Se aplica a un deber con un tiempo flexible, donde la resolución al principio basta hasta que el tiempo se reduce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} En un culto de varios actos, una intención al comienzo es suficiente, con el tratamiento hanafí de la peregrinación como una excepción notable. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3474}"
  fr: "Insihab est le pronom réfléchi de sahb, « traîner »; en usul et en fiqh, il désigne l’extension conventionnelle d’un acte sur plusieurs instants successifs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} Ainsi, une intention formée au début du premier pilier des ablutions est censée se prolonger tout au long des piliers suivants, même si l’esprit vagabonde ensuite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} Cela s’applique à un devoir dont la durée est flexible, où la résolution initiale suffit jusqu’à ce que le temps imparti se raccourcisse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} Dans un culte comportant plusieurs actes, une seule intention au départ suffit, le pèlerinage faisant figure d’exception notable selon l’école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3474}"
  ur: "Insihab لفظی طور پر صاحب کا اضطراری ہے، کھینچنا؛ اصول اور فقہ میں یہ متواتر لمحات پر کسی عمل کی روایتی توسیع ہے۔ اس طرح وضو کے پہلے ستون کے شروع میں جو نیت کی جاتی ہے اس کو اس کے تمام ستونوں کو سنبھالنے کے لیے لیا جاتا ہے، حالانکہ ذہن اس کے بعد بھٹک جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3473} یہ ایک لچکدار وقت کے ساتھ فرض پر لاگو ہوتا ہے، جہاں شروع میں عزم وقت کے تنگ ہونے تک کافی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3473} متعدد عبادات میں شروع میں ایک نیت کافی ہوتی ہے، حنفی حج کے ساتھ مستثنیٰ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص3474}"
  tr: "Dilsel olarak, 'mewawa'ah' 'uzaklaşmak' anlamına gelir, ve hukukçular ile ilke bilginlerine göre, eylem, eylemin ardışık zamanlarda kavramsal bir uzantı olarak ardışık bir uzantısıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3473} Bir örnek, abdest alma yapan kişinin niyeti, ilk sütunun başında niyetle niyetle kullanılıyorsa, ardından kaybolur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3473} Geri çekilme, genişletilmiş yükümlülükte gerçekleşir; burada karar başlangıçta yeterlidir ve sonra geri kalanına da uzanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3473} Çoklu eylemle yapılan ibadette, başlangıçta niyet yeterlidir, ancak hukukçular, örneğin Hac gibi, bu konuda farklı görüşe sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3474}"
  id: "Secara linguistik, 'mewawa'ah' berarti 'menarik diri,' dan menurut ahli hukum dan sarjana prinsip, tindakan tersebut merupakan perpanjangan berturut-turut dari tindakan pada waktu berturut-turut sebagai perluasan konseptual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3473} Contohnya adalah niat orang yang melakukan wudhu meluas ke semua pilar wudhu jika ia bermaksud pada awal pilar pertama, lalu memudar setelahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3473} Penarikan diri terjadi dalam kewajiban diperluas, di mana penentuan sudah cukup di awal dan kemudian meluas ke sisanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3473} Dalam ibadah dengan banyak tindakan, niat di awal sudah cukup, tetapi ahli hukum berbeda pendapat tentang hal ini, seperti Haji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3474}"
