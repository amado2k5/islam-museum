id: concept/insihab
class: concept
kind: term
label: { ar: "الانسحاب", en: "Insihab (the extension of an act or intention over successive moments)" }
summary:
  ar: "الانسحاب لغة مطاوعة السحب بمعنى الجر، وعند الفقهاء والأصوليين امتداد الفعل في أوقات متتالية امتدادا اعتباريا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} ومن أمثلته أن نية المتوضئ تنسحب على أركان الوضوء كلها إذا نواها في أول الركن الأول، ثم ذهل عنها بعد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} ويقع الانسحاب في الواجب الموسع، حيث يكفي العزم في أول الوقت ثم ينسحب على بقيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} وفي العبادة ذات الأفعال المتعددة يكتفى بالنية في أولها، ويتفاوت الفقهاء في ذلك كالحج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3474}"
  en: "Insihab is lexically the reflexive of sahb, to drag; in usul and fiqh it is the conventional extension of an act over successive moments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} Thus an intention formed at the start of the first pillar of ablution is taken to carry over all its pillars, though the mind wanders afterwards. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} It applies to a duty with a flexible time, where resolve at the beginning suffices until the time narrows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3473} In a worship of several acts one intention at the outset is enough, with the Hanafi treatment of the pilgrimage as a noted exception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3474}"
