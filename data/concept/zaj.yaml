summary:
  ar: "الزاجات أصناف تنحلّ في الماء ثم تنعقد؛ منها القلقطار المعتدل القبض، والسوري الأشدّ انعقاداً الذي لا ينحلّ في الماء. كلها محرقة، والقلقطار ينفع من الحمرة والأورام الساعية، والسوري مع الخمر ينفع من عرق النسا. {cite:canon-ibn-sina-print-v1 p.459}"
  en: "The vitriols are kinds that dissolve in water and firm up again. Qalqatar is balanced in its astringency; suri is the thickest and does not dissolve in water. All burn; qalqatar helps redness and running swellings, and suri, injected with wine, helps sciatica. {cite:canon-ibn-sina-print-v1 p.459}"
  ur: "زاجات وہ اقسام ہیں جو پانی میں گھل کر پھر جم جاتی ہیں؛ ان میں قلقطار متوازن قبض والا ہے، اور سوری سب سے گاڑھا ہے جو پانی میں نہیں گھلتا۔ سب جلانے والے ہیں؛ قلقطار سرخی اور بہنے والی سوجن میں، اور سوری شراب کے ساتھ اندر لگانے سے عرق النسا میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.459}"
  es: "Los vitriolos son de tipo soluble en agua y que luego se solidifican. El qalqatar tiene una astringencia equilibrada; el suri es el más espeso y no se disuelve en agua. Todos producen ardor; el qalqatar ayuda con el enrojecimiento y la hinchazón, y el suri, inyectado con vino, ayuda con la ciática. {cite:canon-ibn-sina-print-v1 p.459}"
  fr: "Les vitriols sont des substances qui se dissolvent dans l'eau et se solidifient à nouveau. Le qalqatar a une astringence équilibrée; le suri est le plus épais et ne se dissout pas dans l'eau. Tous provoquent des brûlures; le qalqatar soulage les rougeurs et les gonflements, et le suri, injecté avec du vin, soulage la sciatique. {cite:canon-ibn-sina-print-v1 p.459}"
  tr: "Göz içi sıvıları, suda çözünen ve daha sonra katılaşan çeşitli tiplerdedir; bunlar arasında orta derecede büzücü özelliğe sahip diş taşı ve suda çözünmeyen, daha güçlü katılaşmış Suriye diş taşı bulunur. Hepsi yakıcıdır. Diş taşı, erizipel ve yayılan tümörler için faydalıdır ve Suriye diş taşı şarapla birlikte siyatik için faydalıdır. {cite:canon-ibn-sina-print-v1 s.459}"
  id: "Cairan vitreus terdiri dari berbagai jenis yang larut dalam air lalu mengeras; di antaranya adalah kalkulus yang agak astringen, dan kalkulus Suriah yang lebih mengeras dan tidak larut dalam air. Semuanya bersifat kaustik. Kalkulus bermanfaat untuk erisipelas dan tumor yang menyebar, dan kalkulus Suriah dengan anggur bermanfaat untuk linu panggul. {cite:canon-ibn-sina-print-v1 p.459}"
