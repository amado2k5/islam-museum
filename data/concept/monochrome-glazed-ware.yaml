id: concept/monochrome-glazed-ware
class: concept
kind: art_form
label: { ar: "الخزف المزجج بلون واحد", en: "Monochrome glazed ware (Nishapur)", ur: "یک رنگ لعاب دار ظروف", es: "Cerámica esmaltada monocromática (Nishapur)", fr: "Céramique émaillée monochrome (Nishapur)", tr: "Tek renkli sırlı porselen", id: "Porselen glasir warna tunggal" }
summary:
  ar: "خزف مزجج بطلاء رصاصي من لون واحد على بطانة بيضاء أو ملونة أو على الطين مباشرة، دخل فخار شرق إيران في القرن التاسع، وأشيع ألوانه في نيسابور الأخضر ثم البني {cite:wilkinson-nishapur-pottery p. 271}."
  en: "Ware with a single-colour lead glaze over a white or coloured engobe or directly on the clay, an innovation in eastern Iranian pottery of the ninth century; at Nishapur green was by far the commonest colour, then brown {cite:wilkinson-nishapur-pottery p. 271}."
  ur: "سفید یا رنگین انگوب یا براہِ راست مٹی پر ایک رنگ کے سیسے کے لعاب والے ظروف، جو نویں صدی میں مشرقی ایران کے ظروف میں نئی چیز تھے؛ نیشاپور میں سبز سب سے عام رنگ تھا، پھر بھورا {cite:wilkinson-nishapur-pottery p. 271}."
  es: "Cerámica con un esmalte de plomo de un solo color sobre un engobe blanco o de color, o directamente sobre la arcilla, una innovación en la cerámica del este de Irán del siglo IX; en Nishapur, el verde era con mucho el color más común, seguido del marrón {cite:wilkinson-nishapur-pottery p. 271}."
  fr: "Céramique avec une glaçure au plomb d'une seule couleur sur un engobe blanc ou coloré ou directement sur l'argile, une innovation dans la poterie iranienne orientale du IXe siècle; à Nishapur, le vert était de loin la couleur la plus courante, puis le brun {cite:wilkinson-nishapur-pottery p. 271}."
  tr: "Beyaz, renkli veya kil astarlı tek renkli kurşun kaplamalı sırlı seramikler, dokuzuncu yüzyılda doğu İran çömleklerine girdi ve renkleri Nişapur'da, ardından kahverengide yaygınlaştı {atıf:Wilkinson-Nishapur-pottery s. 271}."
  id: "Keramik berlapis glasir dengan lapisan timbal warna tunggal pada lapisan putih, berwarna, atau tanah liat, masuk ke dalam tembikar Iran timur pada abad kesembilan, dan warnanya menjadi umum di Nishapur, kemudian coklat {cite:Wilkinson-Nishapur-pottery hlm. 271}."
