summary:
  ar: "خزف مزجج بطلاء رصاصي من لون واحد على بطانة بيضاء أو ملونة أو على الطين مباشرة، دخل فخار شرق إيران في القرن التاسع، وأشيع ألوانه في نيسابور الأخضر ثم البني {cite:wilkinson-nishapur-pottery p. 271}."
  en: "Ware with a single-colour lead glaze over a white or coloured engobe or directly on the clay, an innovation in eastern Iranian pottery of the ninth century; at Nishapur green was by far the commonest colour, then brown {cite:wilkinson-nishapur-pottery p. 271}."
  ur: "سفید یا رنگین انگوب یا براہِ راست مٹی پر ایک رنگ کے سیسے کے لعاب والے ظروف، جو نویں صدی میں مشرقی ایران کے ظروف میں نئی چیز تھے؛ نیشاپور میں سبز سب سے عام رنگ تھا، پھر بھورا {cite:wilkinson-nishapur-pottery p. 271}."
