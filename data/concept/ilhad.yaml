id: concept/ilhad
class: concept
kind: legal
label: { ar: "الإلحاد", en: "Ilhad (deviation from religion, and related terms)", es: "Ilhad (desviación de la religión y términos relacionados)", fr: "Ilhad (déviation de la religion et termes associés)", ur: "الہاد ⁦(دین سے انحراف، اور متعلقہ اصطلاحات)⁩", tr: "Ateizm", id: "ateisme" }
summary:
  ar: "الإلحاد في اللغة الميل والعدول عن الشيء، وفي الاصطلاح الميل عن الشرع القويم إلى جهة من جهات الكفر، أو الطعن في الدين مع ادعاء الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317} ويفرّق الفقهاء بينه وبين الردة والنفاق والزندقة والدهرية، فالملحد أوسع فرق الكفر حدا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} والإلحاد في الحرم هو الميل بالظلم فيه، وفيه أقوال عدة، ومن ألحد بعد إسلامه يأخذ حكم المرتد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3319}"
  en: "Ilhad means deviating from the straight path, and in the technical sense it is turning from the sound law toward some form of unbelief, or attacking the religion while claiming to be a Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317} The jurists distinguish it from apostasy, hypocrisy, heresy in the sense of hidden unbelief, and dahriyya (denial of the Creator). The ilhad is the widest category of unbelief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} Ilhad in the sacred precinct is injustice there, and the sayings on its meaning differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} A Muslim who commits ilhad takes the rulings of the apostate, while a dhimmi who attacks the religion breaks his covenant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3319}"
  es: "Ilhad significa desviarse del camino recto, y en el sentido técnico es apartarse de la ley sana hacia alguna forma de incredulidad, o atacar la religión mientras se afirma ser musulmán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317} Los juristas lo distinguen de la apostasía, la hipocresía, la herejía en el sentido de incredulidad oculta y la dahriyya (negación del Creador). El ilhad es la categoría más amplia de incredulidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} Ilhad en el recinto sagrado es injusticia allí, y los dichos sobre su significado difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} Un musulmán que comete ilhad toma las decisiones del apóstata, mientras que un dhimmi que ataca la religión rompe su pacto. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3319}"
  fr: "L'ilhad signifie s'écarter du droit chemin et, au sens technique, se détourner de la loi saine pour adopter une forme d'incroyance, ou attaquer la religion tout en se réclamant de l'islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317} Les juristes le distinguent de l'apostasie, de l'hypocrisie, de l'hérésie (au sens d'incroyance cachée) et de la dahriyya (reniement du Créateur). L'ilhad est la catégorie d'incroyance la plus large. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} Dans l'enceinte sacrée, l'ilhad est considéré comme une injustice, et les interprétations de sa signification divergent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} Un musulman qui commet un ilhad prend les décisions de l'apostat, tandis qu'un dhimmi qui attaque la religion rompt son alliance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3319}"
  ur: "الہاد کا مطلب ہے سیدھے راستے سے ہٹ جانا، اور تکنیکی لحاظ سے یہ صحیح قانون سے کسی نہ کسی قسم کے کفر کی طرف پلٹنا، یا مسلمان ہونے کا دعویٰ کرتے ہوئے مذہب پر حملہ کرنا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3316}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317} فقہا اسے ارتداد، منافقت، بدعت سے پوشیدہ کفر، اور دہریہ کے معنی میں ممتاز کرتے ہیں۔ الہاد کفر کا وسیع ترین طبقہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3317}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3318} حدود مقدس میں الہاد وہاں ظلم ہے، اور اس کے معنی میں اقوال مختلف ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3318} الھاد کرنے والا مسلمان مرتد کے احکام کو قبول کرتا ہے جب کہ ذمی جو مذہب پر حملہ کرتا ہے وہ عہد شکنی کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3319}"
  tr: "Dilbilimde ateizm, bir şeye eğilim ve sapma anlamına gelirken, terminolojide ise dürüst Şeriat'tan sapma, inançsızlığa veya İslam olduğunu iddia ederek dine saldırmaya yönelmektir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3317} Hukukçular bunu dinden dönme, ikiyüzlülük, sapkınlık ve sapkınlıkla ayırt ederler; ateist ise en şiddetli inançsızlığı sınırda ayırt eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3318} Haram'daki ateizm, içinde adaletsizliğe eğilimdir ve bununla ilgili çeşitli görüşler vardır. İslam'ı benimsedikten sonra ateizm yapan herkes dinden dönmüş sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3319}"
  id: "Dalam linguistik, ateisme berarti kecenderungan dan penyimpangan dari sesuatu, dan dalam terminologi, itu adalah penyimpangan dari Syariah yang tegas menuju sisi ketidakpercayaan, atau menyerang agama sambil mengklaim dirinya Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3317} Para ahli hukum membedakan antara itu dengan murtad, kemunafikan, bid'ah, dan bid'ah; ateis membedakan ketidakpercayaan yang paling parah sampai batas tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3318} Ateisme dalam Haram adalah kecenderungan terhadap ketidakadilan di dalamnya, dan ada beberapa pendapat tentangnya. Siapa pun yang berbuat ateisme setelah memeluk Islam dianggap murtad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3319}"
