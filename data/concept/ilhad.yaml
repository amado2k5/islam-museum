id: concept/ilhad
class: concept
kind: legal
label: { ar: "الإلحاد", en: "Ilhad (deviation from religion, and related terms)" }
summary:
  ar: "الإلحاد في اللغة الميل والعدول عن الشيء، وفي الاصطلاح الميل عن الشرع القويم إلى جهة من جهات الكفر، أو الطعن في الدين مع ادعاء الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317} ويفرّق الفقهاء بينه وبين الردة والنفاق والزندقة والدهرية، فالملحد أوسع فرق الكفر حدا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} والإلحاد في الحرم هو الميل بالظلم فيه، وفيه أقوال عدة، ومن ألحد بعد إسلامه يأخذ حكم المرتد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3319}"
  en: "Ilhad means deviating from the straight path, and in the technical sense it is turning from the sound law toward some form of unbelief, or attacking the religion while claiming to be a Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317} The jurists distinguish it from apostasy, hypocrisy, heresy in the sense of hidden unbelief, and dahriyya (denial of the Creator). The ilhad is the widest category of unbelief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3317}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} Ilhad in the sacred precinct is injustice there, and the sayings on its meaning differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3318} A Muslim who commits ilhad takes the rulings of the apostate, while a dhimmi who attacks the religion breaks his covenant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3319}"
