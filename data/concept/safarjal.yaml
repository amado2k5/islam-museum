summary:
  ar: "السفرجل في الكتاب ثمر معروف بارد في آخر الأولى يابس في أول الثانية، قابض مقوٍّ يمنع سيلان الفضول إلى الأحشاء، ينفع الصدر والمعدة ويمنع القيء والخمار ويقوي الشهوة الساقطة، وكثرة أكله تولد وجع العصب {cite:canon-ibn-sina-print-v1 p.607}"
  en: "Safarjal is in the book a well-known fruit, cold at the end of the first degree and dry at the start of the second, astringent and strengthening, preventing the flow of residues to the viscera; it benefits the chest and the stomach, prevents vomiting and hangover and strengthens a fallen appetite, while eating much of it generates nerve pain {cite:canon-ibn-sina-print-v1 p.607}"
  ur: "سفرجل کتاب میں ایک معروف پھل ہے، پہلے درجے کے آخر میں سرد اور دوسرے کے آغاز میں خشک، قابض اور قوت بخش، فضلات کے احشاء کی طرف بہنے کو روکتا ہے؛ سینے اور معدے کو فائدہ دیتا ہے، قے اور خمار کو روکتا اور گری ہوئی بھوک کو قوت دیتا ہے، اور اس کا زیادہ کھانا اعصاب کا درد پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 p.607}۔"
