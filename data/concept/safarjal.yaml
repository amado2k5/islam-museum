label:
  ar: "سفرجل"
  en: "Safarjal (the quince)"
  ur: "سفرجل"
  es: "Safarjal (el membrillo)"
  fr: "Safarjal (le coing)"
  tr: "ayva"
  id: "quince"
summary:
  ar: "السفرجل في الكتاب ثمر معروف بارد في آخر الأولى يابس في أول الثانية، قابض مقوٍّ يمنع سيلان الفضول إلى الأحشاء، ينفع الصدر والمعدة ويمنع القيء والخمار ويقوي الشهوة الساقطة، وكثرة أكله تولد وجع العصب {cite:canon-ibn-sina-print-v1 p.607}"
  en: "Safarjal is in the book a well-known fruit, cold at the end of the first degree and dry at the start of the second, astringent and strengthening, preventing the flow of residues to the viscera; it benefits the chest and the stomach, prevents vomiting and hangover and strengthens a fallen appetite, while eating much of it generates nerve pain {cite:canon-ibn-sina-print-v1 p.607}"
  ur: "سفرجل کتاب میں ایک معروف پھل ہے، پہلے درجے کے آخر میں سرد اور دوسرے کے آغاز میں خشک، قابض اور قوت بخش، فضلات کے احشاء کی طرف بہنے کو روکتا ہے؛ سینے اور معدے کو فائدہ دیتا ہے، قے اور خمار کو روکتا اور گری ہوئی بھوک کو قوت دیتا ہے، اور اس کا زیادہ کھانا اعصاب کا درد پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 p.607}۔"
  es: "En el libro se menciona que el safarjal es una fruta bien conocida, fría al final del primer grado y seca al comienzo del segundo, astringente y fortalecedora, que impide el paso de residuos a las vísceras; beneficia el pecho y el estómago, previene los vómitos y la resaca y fortalece el apetito disminuido, mientras que su consumo excesivo genera dolor nervioso {cite:canon-ibn-sina-print-v1 p.607}."
  fr: "Le safarjal est décrit dans le livre comme un fruit bien connu, froid à la fin du premier degré et sec au début du second, astringent et fortifiant, empêchant l'écoulement des résidus vers les viscères; il est bénéfique pour la poitrine et l'estomac, prévient les vomissements et la gueule de bois et stimule l'appétit, tandis qu'une consommation excessive peut provoquer des douleurs nerveuses {cite:canon-ibn-sina-print-v1 p.607}"
  tr: "Kitapta ayva, ilk sonunda soğuk, ilk saniyede kuru olan iyi bilinen bir meyvedir; merakın bağırsaklara akışını engelleyen, göğüs ve mideye fayda veren, kusmayı ve khimarı önleyen ve kaybedilen arzuyu güçlendiren güçlü bir büzücüdür. Sık sık yemek sinir ağrısına neden olur {cite:canon-ibn-sina-print-v1 s.607}"
  id: "Dalam buku, quince adalah buah yang terkenal, dingin di akhir yang pertama dan kering di detik pertama, astringen kuat yang mencegah aliran rasa ingin tahu ke usus, bermanfaat untuk dada dan perut, mencegah muntah dan khimar, serta memperkuat hilangnya hasrat. Memakannya sering menyebabkan nyeri saraf {cite:canon-ibn-sina-print-v1 hlm.607}"
