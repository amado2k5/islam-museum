label: { ar: "حركات القمر", en: "The motions of the moon", es: "Los movimientos de la luna", fr: "Les mouvements de la lune", ur: "چاند کی حرکات", tr: "Ay hareketleri", id: "Pergerakan bulan" }
summary:
  ar: "يُركّب الفرغاني حركة القمر الظاهرة في فلك البروج من خمس حركات دائرية: حركة الجرم في فلك التدوير، وحركة مركز فلك التدوير في الفلك الخارج المركز، وحركة مركز الفلك الخارج المركز في دائرة صغيرة حول مركز البروج، وحركة الفلك المائل الذي يحمل العقدتين، وحركة الكرة كلها التي تعادل حركة الكواكب الثابتة {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy p. 186}."
  en: "al-Farghani builds the moon's apparent motion along the zodiac from five circular motions: the body on its epicycle, the centre of the epicycle on the eccentric, the centre of the eccentric on a small circle, the inclined circle carrying the nodes, and the motion of the whole sphere equal to that of the fixed stars {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy p. 186}."
  es: "Al-Farghani construye el movimiento aparente de la luna a lo largo del zodíaco a partir de cinco movimientos circulares: el cuerpo sobre su epiciclo, el centro del epiciclo sobre la excéntrica, el centro de la excéntrica sobre un círculo pequeño, el círculo inclinado que lleva los nodos y el movimiento de toda la esfera igual al de las estrellas fijas {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy p. 186}."
  fr: "al-Farghani construit le mouvement apparent de la lune le long du zodiaque à partir de cinq mouvements circulaires: le corps sur son épicycle, le centre de l'épicycle sur l'excentrique, le centre de l'excentrique sur un petit cercle, le cercle incliné portant les nœuds, et le mouvement de la sphère entière égal à celui des étoiles fixes {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy p. 186}."
  ur: "الفرغانی رقم کے ساتھ چاند کی ظاہری حرکت کو پانچ سرکلر حرکات سے بناتا ہے: جسم اس کے ایپی سائیکل پر، ایپی سائیکل کا مرکز سنکی پر، سنکی کا مرکز ایک چھوٹے دائرے پر، مائل دائرہ جو نوڈس کو لے کر جاتا ہے، اور پورے کرہ کی حرکت ستاروں کے مساوی ہوتی ہے۔ ص 182}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 185}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 186}۔"
  tr: "Al-Farghani, ayın burçtaki hareketini beş dairesel hareketten birleştirir: yörüngesel küredeki cismin hareketi, eksantrik astrolojide dönme merkezinin hareketi, burçun merkezi etrafında eksantrik merkezin küçük bir daire hareketi, iki düğümün eğimli hareketi ve tüm kürenin hareketi, sabit gezegenlerin hareketine eşdeğer {cite:farghani-elements-astronomy s. 182}{cite:farghani-elements-astronomy s. 185}{cite:farghani-elements-astronomy s. 186}."
  id: "Al-Farghani menggabungkan gerakan bulan dalam zodiak dari lima gerakan melingkar: gerakan benda dalam bola orbital, gerakan pusat rotasi dalam astrologi eksentrik, gerakan pusat eksentrik dalam lingkaran kecil mengelilingi pusat zodiak, gerakan miring dua node, dan gerakan seluruh bola yang setara dengan gerakan planet stasioner {cite:farghani-elements-astronomy hlm. 182}{cite:farghani-elements-astronomy hlm. 185}{cite:farghani-elements-astronomy hlm. 185}{cite:farghani-elements-astronomy hlm. 186}."
