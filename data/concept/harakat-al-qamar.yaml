summary:
  ar: "يُركّب الفرغاني حركة القمر الظاهرة في فلك البروج من خمس حركات دائرية: حركة الجرم في فلك التدوير، وحركة مركز فلك التدوير في الفلك الخارج المركز، وحركة مركز الفلك الخارج المركز في دائرة صغيرة حول مركز البروج، وحركة الفلك المائل الذي يحمل العقدتين، وحركة الكرة كلها التي تعادل حركة الكواكب الثابتة {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy p. 186}."
  en: "al-Farghani builds the moon's apparent motion along the zodiac from five circular motions: the body on its epicycle, the centre of the epicycle on the eccentric, the centre of the eccentric on a small circle, the inclined circle carrying the nodes, and the motion of the whole sphere equal to that of the fixed stars {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy p. 186}."
