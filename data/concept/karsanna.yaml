label:
  ar: "كرسنّة"
  en: "Karsanna (the book's name for a seed plant)"
  ur: "کرسنہ"
  es: "Karsanna (el nombre que el libro le da a una planta con semillas)"
  fr: "Karsanna (nom donné dans le livre à une plante à graines)"
  tr: "Kursana"
  id: "Kursana"
summary:
  ar: "الكرسنّة حب أصغر من الملك في عظم العدس، مضلع لا مفرطح، وطعمه بين طعم الماش والعدس، وهو عند الكتاب مفتح جالٍ ذو خلط رديء، وينفع في تليين الصلابات وصلابة الثدي وطلاء البهق والكلف."
  en: "Karsanna is a seed smaller than al-malik, the size of a lentil, ribbed rather than flat, and with a taste between mung and lentil. The book holds that it opens and cleanses, has a bad humour in it, and is treated as lupin is. It softens hardness, especially of the breast, and is applied as a plaster to vitiligo and freckles. The editor's footnote calls it a kind of plant."
  ur: "کرسنہ ایک دانہ ہے جو الملک سے چھوٹا، مسور جتنا، چپٹا نہیں بلکہ دھاری دار ہوتا ہے، اور اس کا ذائقہ ماش اور مسور کے درمیان ہے۔ کتاب کے مطابق یہ کھولنے اور صاف کرنے والا ہے، اس میں بری رطوبت ہوتی ہے، اور اس کی اصلاح ترمس کی طرح کی جاتی ہے۔ یہ سختی، خاص کر سینے کی سختی کو نرم کرتا، اور برص اور جھائیوں پر لیپ کے طور پر لگایا جاتا ہے۔ حاشیے میں اسے ایک قسم کا پودا کہا گیا ہے۔"
  es: "La karsanna es una semilla más pequeña que la al-malik, del tamaño de una lenteja, estriada en lugar de plana, y con un sabor intermedio entre el mung y la lenteja. El libro afirma que abre y limpia, tiene un humor desagradable y se utiliza como el lupino. Suaviza la dureza, especialmente en el pecho, y se aplica como emplasto para el vitíligo y las pecas. La nota al pie del editor la describe como una especie de planta."
  fr: "La karsanna est une graine plus petite que l'al-malik, de la taille d'une lentille, striée plutôt que plate, et dont le goût se situe entre celui du haricot mungo et celui de la lentille. Selon l'ouvrage, elle purifie et ouvre l'esprit, possède une humeur néfaste et s'utilise comme le lupin. Elle adoucit les raideurs, notamment celles de la poitrine, et sert d'cataplasme contre le vitiligo et les taches de rousseur. La note de bas de page de l'éditeur la qualifie de plante."
  tr: "Carsaneh, mercimek kemiği bakımından kraldan daha küçük bir tanedir, aşırı kaburgalı değildir ve tadı biraz mung fasulyesi ve mercimek benzer. Kitaba göre, zayıf bir karışıma sahip bir hafifleticidir ve sertlik, göğüs sertliği, vitiligo ve melazma yumuşatmalarında faydalıdır."
  id: "Carsaneh adalah butir yang lebih kecil dari king dalam tulang lentil, beralur tidak berlebihan, dan rasanya agak mirip kacang hijau dan lentil. Menurut buku, ini adalah pepadhang dengan campuran yang kurang baik, dan berguna untuk melunakkan kekencangan, kekerasan dada, vitiligo, dan melasma."
