summary:
  ar: "الزهرة نبات يشبه العدس في ورقه، ينبت في الأرض المالحة، وفيه ملوحة في الطعم؛ يُذكر أنه يُدمل القروح، وأن نوعه الثاني ينفع من الصرع شرباً بالسكنجبين."
  en: "Zahra is a plant with lentil-like leaves that grows in salt ground and tastes salt. The book says it heals ulcers, and that its second kind helps epilepsy when drunk in oxymel. Parts of the entry are garbled and are left out."
  ur: "زہرہ ایک پودا ہے جس کے پتے مسور جیسے ہیں، جو نمکین زمین میں اگتا ہے اور ذائقے میں نمکین ہے؛ کتاب کہتی ہے کہ یہ زخموں کو بھرتا ہے، اور اس کی دوسری قسم سکنجبین کے ساتھ پینے سے مرگی میں نفع دیتی ہے۔ اندراج کے بعض حصے خراب OCR کی وجہ سے حذف ہیں۔"
  es: "La zahra es una planta con hojas parecidas a las lentejas que crece en suelos salinos y tiene sabor a sal. El libro afirma que cura las úlceras y que su segunda variedad ayuda a la epilepsia cuando se ingiere en oxímel. Partes de la entrada están ilegibles y se han omitido."
  fr: "Le zahra est une plante aux feuilles semblables à des lentilles qui pousse dans les sols salés et a un goût salé. Le livre affirme qu'il guérit les ulcères et que sa seconde variété, consommée dans de l'oxymel, soulage l'épilepsie. Certaines parties de l'entrée sont illisibles et ont été omises."
  tr: "Bu çiçek, yaprakları mercimeğe benzeyen, tuzlu topraklarda yetişen ve tuzlu bir tadı olan bir bitkidir; yaraları iyileştirdiği ve ikinci türünün oksimel ile birlikte içildiğinde epilepsiye iyi geldiği söylenmektedir."
  id: "Bunga ini adalah tanaman yang daunnya menyerupai lentil, tumbuh di tanah asin, dan memiliki rasa asin; konon dapat menyembuhkan luka, dan jenis keduanya bermanfaat untuk epilepsi jika diminum bersama oksimel."
