summary:
  ar: "الزنجفر قوّته قريبة من الإسفيداج أو السادنج عند بعض الناس، والأصح أنه حار يابس في آخر الثانية؛ يدمل الجراحات، وينبت اللحم في القروح، ويمنع تأكّل الأسنان. {cite:canon-ibn-sina-print-v1 p.461}"
  en: "Some say the power of zanjafr is close to isfidaj, and others say to sadanj; the most correct view is that it is hot and dry at the end of the second degree. It heals wounds, grows flesh in ulcers, and prevents the teeth from wearing away. {cite:canon-ibn-sina-print-v1 p.461}"
  ur: "بعض کے نزدیک زنجفر کی قوت اسفیداج جیسی ہے اور بعض کے نزدیک سادنج جیسی؛ درست تر رائے یہ ہے کہ یہ دوسرے درجے کے آخر میں گرم اور خشک ہے۔ یہ زخموں کو بھرتا، السر میں گوشت اگاتا، اور دانتوں کو گھسنے سے روکتا ہے۔ {cite:canon-ibn-sina-print-v1 p.461}"
