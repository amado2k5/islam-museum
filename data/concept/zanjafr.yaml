label:
  ar: "زنجفر"
  en: "Zanjafr (the zirqun, per the editor)"
  ur: "زنجفر ⁦(زرقون، حاشیے کے مطابق)⁩"
  es: "Zanjafr (el zirqun, según el editor)"
  fr: "Zanjafr (le zirqun, selon l'éditeur)"
  tr: "Cinnabar"
  id: "Kayu manis"
summary:
  ar: "الزنجفر قوّته قريبة من الإسفيداج أو السادنج عند بعض الناس، والأصح أنه حار يابس في آخر الثانية؛ يدمل الجراحات، وينبت اللحم في القروح، ويمنع تأكّل الأسنان. {cite:canon-ibn-sina-print-v1 p.461}"
  en: "Some say the power of zanjafr is close to isfidaj, and others say to sadanj; the most correct view is that it is hot and dry at the end of the second degree. It heals wounds, grows flesh in ulcers, and prevents the teeth from wearing away. {cite:canon-ibn-sina-print-v1 p.461}"
  ur: "بعض کے نزدیک زنجفر کی قوت اسفیداج جیسی ہے اور بعض کے نزدیک سادنج جیسی؛ درست تر رائے یہ ہے کہ یہ دوسرے درجے کے آخر میں گرم اور خشک ہے۔ یہ زخموں کو بھرتا، السر میں گوشت اگاتا، اور دانتوں کو گھسنے سے روکتا ہے۔ {cite:canon-ibn-sina-print-v1 p.461}"
  es: "Algunos dicen que el poder del zanjafr se asemeja al isfidaj, y otros al sadanj; la opinión más correcta es que es cálido y seco al final del segundo grado. Cura heridas, regenera la piel en úlceras y previene el desgaste dental. {cite:canon-ibn-sina-print-v1 p.461}"
  fr: "Certains disent que le pouvoir du zanjafr est proche de celui de l'isfidaj, d'autres de celui du sadanj; l'avis le plus juste est qu'il est chaud et sec à la fin du deuxième degré. Il guérit les plaies, favorise la cicatrisation des ulcères et prévient l'usure des dents. {cite:canon-ibn-sina-print-v1 p.461}"
  tr: "Bazı kaynaklara göre, cinnabarın gücü beyaz kurşun veya cinnabarınkine yakındır. Daha doğru bir ifadeyle, ikinci derecede sıcak ve kurudur; yaraları iyileştirir, yaralarda doku büyümesini destekler ve diş çürümesini önler. {cite:canon-ibn-sina-print-v1 s.461}"
  id: "Kekuatan cinnabar hampir sama dengan timbal putih atau cinnabar, menurut beberapa orang. Lebih tepatnya, ia bersifat panas dan kering tingkat kedua; menyembuhkan luka, mendorong pertumbuhan jaringan pada luka borok, dan mencegah kerusakan gigi. {cite:canon-ibn-sina-print-v1 p.461}"
