id: concept/luzum-al-jamaa
class: concept
kind: doctrine
label:
  ar: "لزوم الجماعة والإمام"
  en: "Holding to the community and its leader (luzum al-jama'a)"
  ur: "جماعت اور امام کے ساتھ وابستگی (لزوم الجماعة)"
summary:
  ar: "يعرض الشيخ عمر عبد الكافي حديثا يرويه البخاري، سأل فيه صحابي النبي عن الشر بعد الخير وعن الخير بعد الشر، وفيه أن النبي أمر بلزوم جماعة المسلمين وإمامهم. ويرى الشيخ أن هذا الحديث وصف لزمن الفتن الذي تعيشه الأمة."
  en: "In Sheikh Omar Abdelkafy's lesson, a narration he attributes to Sahih al-Bukhari has a Companion ask the Prophet about evil after good and good after evil; the answer tells Muslims to hold to the community of believers and its leader. The speaker reads it as a description of the time of trials in which the nation lives."
  ur: "شیخ عمر عبدالکافی کے درس میں صحیح بخاری کی ایک روایت کا ذکر ہے جس میں ایک صحابی نے نبی سے خیر کے بعد شر اور شر کے بعد خیر کے بارے میں پوچھا، اور جواب میں مسلمانوں کو جماعت اور اس کے امام کے ساتھ وابستہ رہنے کا حکم دیا گیا۔ شیخ اس روایت کو اس فتنے کے دور کی تصویر سمجھتے ہیں جس میں امت جی رہی ہے۔"
