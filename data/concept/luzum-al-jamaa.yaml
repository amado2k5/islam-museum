id: concept/luzum-al-jamaa
class: concept
kind: doctrine
label:
  ar: "لزوم الجماعة والإمام"
  en: "Holding to the community and its leader (luzum al-jama'a)"
  ur: "جماعت اور امام کے ساتھ وابستگی ⁦(لزوم الجماعة)⁩"
  es: "Mantenerse fiel a la comunidad y a su líder (luzum al-jama'a)"
  fr: "S'attacher à la communauté et à son chef (luzum al-jama'a)"
  tr: "Grubun ve İmamın Gerekliliği"
  id: "Kebutuhan kelompok dan Imam"
summary:
  ar: "يعرض الشيخ عمر عبد الكافي حديثا يرويه البخاري، سأل فيه صحابي النبي عن الشر بعد الخير وعن الخير بعد الشر، وفيه أن النبي أمر بلزوم جماعة المسلمين وإمامهم. ويرى الشيخ أن هذا الحديث وصف لزمن الفتن الذي تعيشه الأمة."
  en: "In Sheikh Omar Abdelkafy's lesson, a narration he attributes to Sahih al-Bukhari has a Companion ask the Prophet about evil after good and good after evil; the answer tells Muslims to hold to the community of believers and its leader. The speaker reads it as a description of the time of trials in which the nation lives."
  ur: "شیخ عمر عبدالکافی کے درس میں صحیح بخاری کی ایک روایت کا ذکر ہے جس میں ایک صحابی نے نبی سے خیر کے بعد شر اور شر کے بعد خیر کے بارے میں پوچھا، اور جواب میں مسلمانوں کو جماعت اور اس کے امام کے ساتھ وابستہ رہنے کا حکم دیا گیا۔ شیخ اس روایت کو اس فتنے کے دور کی تصویر سمجھتے ہیں جس میں امت جی رہی ہے۔"
  es: "En la lección del jeque Omar Abdelkafy, una narración que atribuye a Sahih al-Bukhari relata cómo un compañero preguntó al Profeta acerca del mal que sigue al bien y del bien que sigue al mal; la respuesta exhortó a los musulmanes a permanecer unidos a la comunidad de creyentes y a su líder. El orador la interpreta como una descripción de la época de pruebas que atraviesa la nación."
  fr: "Dans son enseignement, le cheikh Omar Abdelkafy cite un hadith qu'il attribue au Sahih al-Bukhari: un Compagnon interroge le Prophète sur la succession du mal et du bien; la réponse exhorte les musulmans à rester fidèles à la communauté des croyants et à son chef. L'orateur y voit une description des épreuves que traverse la nation."
  tr: "Şeyh Ömer Abdulkafi, el-Buhari'nin rivayet ettiği bir hadis sunar; bu hadiste Peygamber'in sahabelerine iyilikten sonra kötülükten sonra iyilikten sonra iyilik hakkında sorular sorar; bu hadis Peygamber'in Müslüman cemaatine ve liderlerine bağlı kalmalarını emrettiği bir hadistir. Şeyh, bu hadisin ulusun yaşadığı sınav zamanını anlattığına inanır."
  id: "Sheikh Omar Abdul Kafi menyampaikan hadits yang diceritakan oleh al-Bukhari, di mana ia menanyakan kepada para sahabat Nabi tentang kejahatan setelah kebaikan dan tentang kebaikan setelah kejahatan, di mana Nabi memerintahkan agar taat kepada komunitas Muslim dan pemimpin mereka. Sheikh percaya bahwa hadis ini menggambarkan masa ujian yang dialami bangsa tersebut."
