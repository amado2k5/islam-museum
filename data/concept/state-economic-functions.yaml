summary:
  ar: 'يعرض المؤلف تقسيم الجويني لوظائف الإمام بين نظر في الدين ونظر في الدنيا، ويتضمن الأخير الأمن وفصل الخصومات والعقوبات ورعاية الضعفاء وسد الحاجات {cite:usul-iqtisad-islami-0660 p. 82}. وعدّد الماوردي للإمام عشر وظائف، منها حفظ الدين وحماية البيضة وجباية الفيء والصدقات وتقدير العطايا وكفاية الأمناء ومباشرة الأمور بنفسه {cite:usul-iqtisad-islami-0660 p. 83} {cite:usul-iqtisad-islami-0660 p. 84}، وحدّد وظائف الدولة بسبعة أشياء، منها تقدير الأموال بسنن الدين وإقامة الحدود {cite:usul-iqtisad-islami-0660 p. 85}. ويعرض المؤلف الموازنة العامة عند الماوردي بثلاث حالات: فائض وعجز وتوازن {cite:usul-iqtisad-islami-0660 p. 88}. ويجمل المؤلف الوظائف الاقتصادية للدولة في توزيع الثروات الطبيعية، والمالية العامة، وإصدار النقود، والحسبة، والبنية الأساسية، وإدارة القطاع العام، والسياسات الشرعية، وصيانة القيم {cite:usul-iqtisad-islami-0660 p. 89} {cite:usul-iqtisad-islami-0660 p. 90}. ويجيز التخطيط في الحاجات الطارئة كالمجاعة، ويرى ألا يبلغ التخطيط المركزي الشامل للدولة الاشتراكية {cite:usul-iqtisad-islami-0660 p. 91} {cite:usul-iqtisad-islami-0660 p. 92}.'
  tr: "Yazar, el-Cüveyni'nin imamın görevlerini din ve dünyevi meseleler arasında paylaşmasını sunar; bunlar arasında güvenlik, anlaşmazlık ve cezaların çözümü, zayıflara bakım ve ihtiyaçların karşılanması yer alır {cite:usul-iqtisad-islami-0660 s. 82}. El-Mawardi, İmamın dini koruma, yumurtayı koruma, hediye ve sadaka toplama, armağanları tahmin etme, mütevellilerin yeterliliği ve işleri kendisinin yönetmesi gibi on işlevi sayar {cite:usul-iqtisad-islami-0660 s. 83} {cite:usul-iqtisad-islami-0660 s. 84} ve devletin işlevlerini yedi konuda tanımlar; bunlar arasında din sünnetine göre serveti değerlendirmek ve hududun (hudud) uygulanması da vardır {cite:usul-iqtisad-islami-0660 s. 85}. Yazar, Al-Mawardi'ye göre genel bütçeyi üç eyalette sunar: fazla, açık ve denge {cite:usul-iqtisad-islami-0660 s. 88}. Yazar, devletin doğal zenginliklerin dağıtımı, kamu maliyesi, para ihracı, aritmetik, altyapı, kamu sektörü yönetimi, Şeriat politikaları ve değerlerin korunmasındaki ekonomik işlevlerini özetler {cite:usul-iqtisad-islami-0660 s. 89} {cite:usul-iqtisad-islami-0660 s. 90}. Kıtlık gibi acil ihtiyaçlar için planlamaya izin verir ve sosyalist devletin kapsamlı merkezi planlamasının {cite:usul-iqtisad-islami-0660 s. 91} {cite:usul-iqtisad-islami-0660 s. 92} aşamasına ulaşmaması gerektiğini savunur."
  id: "Penulis menyajikan pembagian tugas Imam oleh al-Juwayni antara pertimbangan agama dan urusan duniawi, termasuk keamanan, penyelesaian perselisihan dan hukuman, merawat yang lemah, dan memenuhi kebutuhan {cite:usul-iqtisad-islami-0660 hlm. 82}. Al-Mawardi merinci sepuluh fungsi Imam, termasuk menjaga agama, melindungi telur, mengumpulkan hadiah dan sedekah, memperkirakan hadiah, kecukupan wali, dan mengelola urusan sendiri {cite:usul-iqtisad-islami-0660 hlm. 83} {cite:usul-iqtisad-islami-0660 hlm. 84}, dan mendefinisikan fungsi negara dalam tujuh hal, termasuk memperkirakan kekayaan menurut Sunnah agama dan menegakkan hudud (hudud) {cite:usul-iqtisad-islami-0660 hlm. 85}. Penulis menyajikan anggaran umum menurut Al-Mawardi dalam tiga status: surplus, defisit, dan keseimbangan {cite:usul-iqtisad-islami-0660 hlm. 88}. Penulis merangkum fungsi ekonomi negara dalam distribusi kekayaan alam, keuangan publik, penerbitan uang, aritmatika, infrastruktur, pengelolaan sektor publik, kebijakan Syariah, dan pelestarian nilai-{cite:usul-iqtisad-islami-0660 hlm. 89} {cite:usul-iqtisad-islami-0660 hlm. 90}. Ia mengizinkan perencanaan untuk kebutuhan darurat seperti kelaparan dan berargumen bahwa perencanaan pusat yang komprehensif dari negara sosialis tidak boleh mencapai {cite:usul-iqtisad-islami-0660 hlm. 91} {cite:usul-iqtisad-islami-0660 hlm. 92}."
