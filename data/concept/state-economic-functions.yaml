label:
  ar: وظائف الدولة الاقتصادية
  en: Economic functions of the state
summary:
  ar: 'يعرض المؤلف تقسيم الجويني لوظائف الإمام بين نظر في الدين ونظر في الدنيا، ويتضمن الأخير الأمن وفصل الخصومات والعقوبات ورعاية الضعفاء وسد الحاجات {cite:usul-iqtisad-islami-0660 p. 82}. وعدّد الماوردي للإمام عشر وظائف، منها حفظ الدين وحماية البيضة وجباية الفيء والصدقات وتقدير العطايا وكفاية الأمناء ومباشرة الأمور بنفسه {cite:usul-iqtisad-islami-0660 p. 83} {cite:usul-iqtisad-islami-0660 p. 84}، وحدّد وظائف الدولة بسبعة أشياء، منها تقدير الأموال بسنن الدين وإقامة الحدود {cite:usul-iqtisad-islami-0660 p. 85}. ويعرض المؤلف الموازنة العامة عند الماوردي بثلاث حالات: فائض وعجز وتوازن {cite:usul-iqtisad-islami-0660 p. 88}. ويجمل المؤلف الوظائف الاقتصادية للدولة في توزيع الثروات الطبيعية، والمالية العامة، وإصدار النقود، والحسبة، والبنية الأساسية، وإدارة القطاع العام، والسياسات الشرعية، وصيانة القيم {cite:usul-iqtisad-islami-0660 p. 89} {cite:usul-iqtisad-islami-0660 p. 90}. ويجيز التخطيط في الحاجات الطارئة كالمجاعة، ويرى ألا يبلغ التخطيط المركزي الشامل للدولة الاشتراكية {cite:usul-iqtisad-islami-0660 p. 91} {cite:usul-iqtisad-islami-0660 p. 92}.'
