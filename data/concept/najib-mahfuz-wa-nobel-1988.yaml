summary:
  ar: "أول أديب يكتب بالعربية ينال جائزة نوبل للأدب، سنة 1988، تكريماً من الأكاديمية السويدية على فن سردي عربي يصلح للإنسانية كلها، ومن الثلاثية الواقعية إلى «أولاد حارتنا» و«ميرامار»، كما يعرض ملخص بحثي قُدّم إلى المتحف {cite:nobelprize-literature-1988-summary} {cite:nobelprize-literature-1988-press-release}."
  en: "The first writer in Arabic to win the Nobel Prize in Literature, in 1988, honoured by the Swedish Academy for an Arabian narrative art applicable to all humanity, from the realist Trilogy to Awlad Haratina and Miramar, as a research summary supplied to the museum presents it {cite:nobelprize-literature-1988-summary} {cite:nobelprize-literature-1988-press-release}."
  ur: "عربی میں لکھنے والے پہلے ادیب جنھیں 1988 میں نوبیل ادب انعام ملا، سویڈش اکیڈمی نے انھیں ایسے عربی بیانیہ فن پر نوازا جو پوری انسانیت پر لاگو ہو، حقیقت پسند ثلاثیہ سے «اولاد حارتنا» اور «میرامار» تک، جیسا میوزیم کو دیا گیا تحقیقی خلاصہ پیش کرتا ہے {cite:nobelprize-literature-1988-summary} {cite:nobelprize-literature-1988-press-release}۔"
  fr: "Le premier écrivain de langue arabe à recevoir le prix Nobel de littérature, en 1988, honoré par l'Académie suédoise pour un art narratif arabe applicable à toute l'humanité, de la Trilogie réaliste à Awlad Haratina et Miramar, tel que le présente une synthèse de recherche remise au musée {cite:nobelprize-literature-1988-summary} {cite:nobelprize-literature-1988-press-release}."
  es: "El primer escritor en árabe en recibir el Premio Nobel de Literatura, en 1988, honrado por la Academia Sueca por un arte narrativo árabe aplicable a toda la humanidad, desde la Trilogía realista hasta Awlad Haratina y Miramar, tal como lo presenta un resumen de investigación entregado al museo {cite:nobelprize-literature-1988-summary} {cite:nobelprize-literature-1988-press-release}."
