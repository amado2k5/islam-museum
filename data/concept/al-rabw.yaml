summary:
  ar: "الربو علة رئوية لا يجد الوادع معها بدًا من تنفس متواتر مثل النفس الذي يحاوله المخنوق أو المكدود، وهذه العلة إذا عرضت للمشايخ لم تكد تبرأ ولا تنضج وفي الشباب عسرة البرء أيضاً وفي أكثر الأمر تزداد عند الاستلقاء وهي من العلل المتطاولة ولها نوائب حادة على مثال نوائب الصرع والتشنج، وقد تكون الآفة فيها في نفس الرئة وما يتصل بها لتلحج أخلاط غليظة في الشرايين وشعبها الصغار ورواضعها وربما كانت منصبة إليها من الرأس عند هبوب الرياح الجنوبية أو مندفعة إليها من مواضع أخرى أو بسبب توليدها فيها بردها فتبتدئ قليلاً قليلاً أو بسبب خلط ليس في الرئة وشرايينها بل في المعدة منصباً من الرأس والكبد أو متولداً في المعدة والبهر الحادث عند الإصعاد لمزاحمة المعدة للحجاب ومزاحمة الحجاب للرئة وقد تكون الكبد إذا بردت أو غلظت معينة على الربو، وهذه الأخلاط قد تؤذي بالكيفية وقد تؤذي بالكمية والكثرة وقد تكون في النادر من حراف الرئة ويبسها واجتماعها إلى نفسها أو من بردها أو لآفة مبادئ التنفس من العصب والنخاع والدماغ أو نوازل تندفع إليها منها أو بمشاركة أعضاء مجاورة تزاحم أعضاء النفس فلا ينبسط أو لكثرة البخار الدخاني إذا احتقن في الرئة أو لريح محتقن في أعضاء لا يسع الحاجة من النفس ويكون ذلك آفة في الغذاء من صغر المعدة، وقد يشتد الربو فيصير نفس الانتصاب وكثيراً ما ينتقل إلى ذات الرئة {cite:canon-ibn-sina-print-v2 p.315}"
  en: "Asthma is a lung illness with which the sufferer cannot but breathe a frequent breath, like the breath the choked or the exhausted tries. Befalling the old it hardly heals nor ripens, and in the young it is hard of healing too; most often it worsens lying down; it is of the long-lasting illnesses and has sharp onsets on the pattern of the onsets of epilepsy and convulsion. The harm in it may be in the lung itself and what joins it, thick humours sticking in the arteries and their small branches and channels; they may be poured into it from the head when the southerly winds blow, or driven to it from other places; or bred in it by its cold, starting little by little; or from a humour not in the lung and its arteries but in the stomach — poured from head and liver or bred in the stomach — and the panting arising on climbing is from the stomach's crowding the diaphragm and the diaphragm's crowding the lung; and the liver may help the asthma when it cools or thickens. These humours may harm by quality or by quantity and muchness; rarely it is from the lung's fierce heat, dryness and gathering to itself, or from its cold; or for a harm to the breath's sources — the nerve, the cord, the brain — or catarrhs driven down to it from them; or by the sharing of neighbouring organs crowding the breath's organs so they cannot open, or by much smoky vapour congested in the lung, or a congested wind in organs that does not meet the breath's need — that being a harm in the nourishment from the stomach's smallness. The asthma may grow strong and turn into the upright breath, and often passes into pneumonia {cite:canon-ibn-sina-print-v2 p.315}"
  fr: "L’asthme est une maladie du poumon avec laquelle le malade ne peut que respirer d’un souffle fréquent, semblable au souffle que tente celui qui étouffe ou celui qui est épuisé. Lorsqu’il atteint les vieillards, il ne guérit guère ni ne mûrit, et chez les jeunes aussi il guérit difficilement ; le plus souvent il s’aggrave en position couchée ; il fait partie des maladies de longue durée et a des accès aigus sur le modèle des accès de l’épilepsie et de la convulsion. Le mal peut se trouver dans le poumon lui-même et ce qui s’y rattache, des humeurs épaisses qui collent dans les artères et leurs petites branches et leurs canaux ; elles peuvent s’y déverser depuis la tête quand soufflent les vents du sud, ou y être poussées depuis d’autres endroits ; ou y naître de son froid, commençant peu à peu ; ou venir d’une humeur qui n’est pas dans le poumon et ses artères mais dans l’estomac — déversée depuis la tête et le foie ou née dans l’estomac —, et l’essoufflement qui survient lors de la montée vient de ce que l’estomac presse le diaphragme et le diaphragme presse le poumon ; et le foie peut aider l’asthme lorsqu’il se refroidit ou s’épaissit. Ces humeurs peuvent nuire par leur qualité ou par leur quantité et leur abondance ; rarement il vient de la chaleur intense du poumon, de sa sécheresse et de sa contraction sur lui-même, ou de son froid ; ou d’un dommage aux sources du souffle — le nerf, la moelle, le cerveau — ou de catarrhes qui en descendent vers lui ; ou par la participation d’organes voisins qui pressent les organes du souffle de sorte qu’ils ne peuvent s’ouvrir, ou par une abondante vapeur fumeuse congestionnée dans le poumon, ou un vent congestionné dans des organes qui ne répond pas au besoin du souffle — cela étant un dommage dans la nourriture dû à la petitesse de l’estomac. L’asthme peut se renforcer et se changer en respiration en position droite, et souvent il passe en pneumonie {cite:canon-ibn-sina-print-v2 p.315}"
  ur: "ربو پھیپھڑے کی علت ہے جس میں مبتلا کو متواتر سانس لینے کے سوا چارہ نہیں جیسی وہ سانس جو گھٹا ہوا یا تھکا ہوا لینے کی کوشش کرتا ہے؛ بڑھاپے والوں کو ہو تو شاید ہی شفا دے یا پکے اور جوانوں میں بھی شفا دشوار ہے؛ اکثر لیٹنے پر بڑھتی ہے اور وہ طولانی علتوں میں ہے اور اس کے سخت حملے ہوتے ہیں مرگی اور تشنج کے حملوں کے سانچے پر؛ اس میں آفت خود پھیپھڑے میں اور اس سے ملنے والوں میں ہو سکتی ہے گاڑھے اخلاط کے شرائین اور ان کی چھوٹی شاخوں اور نالوں میں لگ جانے سے؛ وہ سر سے اس میں بہ سکتے ہیں جب جنوبی ہوائیں چلیں یا دوسری جگہوں سے اس میں دھکیلے جائیں؛ یا اس کی ٹھنڈ سے اس میں پیدا ہو کر آہستہ آہستہ شروع ہوں؛ یا ایسے خلط سے جو پھیپھڑے اور اس کی شرائین میں نہ ہو بلکہ معدے میں ہو سر اور جگر سے بها ہوا یا معدے میں پیدا ہوا — اور چڑھائی پر ہونے والا ہانپنا معدے کے حجاب سے اور حجاب کے پھیپھڑے سے ٹکراؤ سے ہے؛ اور جگر بھی ربو کی مدد کر سکتا ہے جب وہ ٹھنڈا یا گاڑھا ہو جائے؛ یہ اخلاط کيفيت سے بھی نقصان دے سکتے ہیں اور مقدار اور کثرت سے بھی؛ اور کبھی کبھی پھیپھڑے کی شدید گرمی خشکی اور اپنے اندر سمیٹنے سے یا اس کی ٹھنڈ سے ہو سکتا ہے؛ یا تنفس کے مبادی — عصب نخاع دماغ — کی آفت سے یا ان سے اس میں دھکیلی ہوئی نوازل سے؛ یا ہمسایہ اعضاء کی مشارکت سے جو تنفس کے اعضاء سے ٹکرائیں کہ وہ نہ کھلیں؛ یا پھیپھڑے میں جمع دھوئیں سے بخار کی کثرت سے؛ یا ایسے اعضاء میں بند ہوا سے جو نفس کی ضرورت پوری نہ کرے — اور وہ معدے کی چھوٹائی سے خوراک میں آفت ہو؛ اور ربو سخت ہو کر کھڑی سانس بن سکتی ہے اور اکثر ذات الرئة میں منتقل ہوتی ہے {cite:canon-ibn-sina-print-v2 p.315}"
  es: "El asma es una enfermedad pulmonar que provoca en quien la padece una respiración frecuente, similar a la de quienes se ahogan o se agotan. En los ancianos, rara vez mejora, y en los jóvenes también es difícil de curar; suele empeorar al acostarse; es una enfermedad de larga duración y tiene inicios abruptos, similares a los de la epilepsia y las convulsiones. El daño puede estar en el propio pulmón y en lo que lo rodea, por humores densos que se adhieren a las arterias y sus pequeñas ramificaciones y conductos; estos pueden provenir de la cabeza cuando soplan los vientos del sur, o ser arrastrados desde otros lugares; o ser generados por el frío, poco a poco; o por un humor que no se encuentra en el pulmón y sus arterias, sino en el estómago —proveniente de la cabeza y el hígado o generado en el estómago— y la dificultad para respirar al levantarse se debe a la presión del estómago sobre el diafragma y de la presión del diafragma sobre el pulmón; y el hígado puede ayudar al asma cuando se enfría o espesa. Estos humores pueden ser dañinos por su calidad o por su cantidad y abundancia; rara vez se debe al calor intenso del pulmón, a la sequedad y a la acumulación de aire en sí mismo, o a su frío; o a un daño en las fuentes de la respiración —el nervio, la médula espinal, el cerebro— o a los catarros que descienden desde ellos; o a la compartimentación de órganos vecinos que comprimen los órganos respiratorios impidiendo su apertura, o a la gran cantidad de vapor humeante congestionado en el pulmón, o a un viento congestionado en los órganos que no satisface las necesidades respiratorias —lo cual constituye un daño en la nutrición debido a la estrechez del estómago—. El asma puede agravarse y convertirse en respiración vertical, y a menudo evoluciona a neumonía {cite:canon-ibn-sina-print-v2 p.315}"
