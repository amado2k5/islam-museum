id: concept/rational-economic-man
class: concept
kind: term
label:
  ar: الإنسان الاقتصادي الرشيد
  en: The rational economic man
  es: "El hombre económico racional"
  fr: "L'homme économique rationnel"
  ur: "عقلی معاشی آدمی"
  tr: "Ekonomik açıdan tedbirli kişi"
  id: "Orang yang ekonomis bijaksana"
summary:
  ar: يعرّف جمهور الأصوليين والفقهاء الرشد بأنه صلاح المال، وعكسه السفه والغفلة، وهو حسن التصرف في المال بالاقتصاد وعدم الإسراف والتبذير {cite:usul-iqtisad-islami-0660 p. 20} {cite:usul-iqtisad-islami-0660 p. 21}. ويتصل بالرشد إصلاح المال بحفظه وتنميته وحسن إدارته، وهو قريب من معنى العمران والتنمية {cite:usul-iqtisad-islami-0660 p. 20}. ويعرض المؤلف مفهوم «الإنسان الاقتصادي» عند الاقتصاديين الوضعيين، ويقارنه بقصة حي بن يقظان لابن طفيل، فيراه أصلح للاقتصاد الإسلامي من روبنسون كروزو لأنه يجمع الرشد والاستكشاف والخلق والإيمان، وإن ظل بعض سلوكه اقتصاديًّا {cite:usul-iqtisad-islami-0660 p. 32} {cite:usul-iqtisad-islami-0660 p. 35}. ويرى المؤلف أن الفرد المسلم مسؤول عن ماله أين أنفقه، والغني مبتلى بالغنى والفقير مبتلى بالفقر {cite:usul-iqtisad-islami-0660 p. 21} {cite:usul-iqtisad-islami-0660 p. 22}.
  tr: "Usul bilginlerinin ve hukukçuların çoğu, ihtiyatı servetin doğru arındırılması olarak tanımlarken, bunun karşıtı saflık ve dikkatsizliktir. Bu, servetin ekonomik ve savurganlık ya da israf olmadan doğru yönetimidir {cite:usul-iqtisad-islami-0660 s. 20} {cite:usul-iqtisad-islami-0660 s. 21}. Akılcılık, serveti iyi koruyarak, geliştirerek ve yöneterek reforme etmekle ilişkilidir ve kentsel gelişim ve gelişim anlamına yakındır {cite:usul-iqtisad-islami-0660 s. 20}. Yazar, pozitivist ekonomistler arasında 'ekonomik insan' kavramını sunar ve bunu İbn Tufail'in Hayy ibn Yaqzan hikayesiyle karşılaştırır; bunu Robinson Crusoe'dan daha uygun bulur çünkü bilgelik, keşif, karakter ve inancı birleştirir, ancak bazı davranışları ekonomik kalırsa da {cite:usul-iqtisad-islami-0660 s. 32} {cite:usul-iqtisad-islami-0660 s. 35}. Yazar, Müslüman bireyin parasını harcarsa harcasa harcasın sorumlu olduğuna, zenginlerin zenginlikten, fakirlerin ise yoksulluktan etkilendiğine inanır {cite:usul-iqtisad-islami-0660 s. 21} {cite:usul-iqtisad-islami-0660 s. 22}."
  id: "Mayoritas sarjana dan ahli hukum usul mendefinisikan kehati-hatian sebagai penyucian kekayaan yang tepat, sedangkan sebaliknya adalah kebodohan dan kelalaian. Ini adalah pengelolaan kekayaan yang tepat secara ekonomis tanpa boros atau pemborosan {cite:usul-iqtisad-islami-0660 hlm. 20} {cite:usul-iqtisad-islami-0660 hlm. 21}. Rasionalitas berkaitan dengan reformasi kekayaan dengan melestarikan, mengembangkan, dan mengelolanya dengan baik, dan dekat dengan makna pembangunan dan pembangunan perkotaan {cite:usul-iqtisad-islami-0660 hlm. 20}. Penulis menyajikan konsep 'manusia ekonomi' di kalangan ekonom positivis dan membandingkannya dengan kisah Hayy ibn Yaqzan karya Ibn Tufail, menganggapnya lebih cocok untuk ekonomi Islam daripada Robinson Crusoe karena menggabungkan kebijaksanaan, eksplorasi, karakter, dan iman, meskipun beberapa perilakunya tetap ekonomis {cite:usul-iqtisad-islami-0660 hlm. 32} {cite:usul-iqtisad-islami-0660 hlm. 35}. Penulis percaya bahwa individu Muslim bertanggung jawab atas uangnya di mana pun ia membelanjakannya, dan bahwa orang kaya dilanda kekayaan dan orang miskin menderita kemiskinan {cite:usul-iqtisad-islami-0660 hlm. 21} {cite:usul-iqtisad-islami-0660 hlm. 22}."
