label:
  ar: الإنسان الاقتصادي الرشيد
  en: The rational economic man
summary:
  ar: يعرّف جمهور الأصوليين والفقهاء الرشد بأنه صلاح المال، وعكسه السفه والغفلة، وهو حسن التصرف في المال بالاقتصاد وعدم الإسراف والتبذير {cite:usul-iqtisad-islami-0660 p. 20} {cite:usul-iqtisad-islami-0660 p. 21}. ويتصل بالرشد إصلاح المال بحفظه وتنميته وحسن إدارته، وهو قريب من معنى العمران والتنمية {cite:usul-iqtisad-islami-0660 p. 20}. ويعرض المؤلف مفهوم «الإنسان الاقتصادي» عند الاقتصاديين الوضعيين، ويقارنه بقصة حي بن يقظان لابن طفيل، فيراه أصلح للاقتصاد الإسلامي من روبنسون كروزو لأنه يجمع الرشد والاستكشاف والخلق والإيمان، وإن ظل بعض سلوكه اقتصاديًّا {cite:usul-iqtisad-islami-0660 p. 32} {cite:usul-iqtisad-islami-0660 p. 35}. ويرى المؤلف أن الفرد المسلم مسؤول عن ماله أين أنفقه، والغني مبتلى بالغنى والفقير مبتلى بالفقر {cite:usul-iqtisad-islami-0660 p. 21} {cite:usul-iqtisad-islami-0660 p. 22}.
