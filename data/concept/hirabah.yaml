label: { ar: "الحرابة ⁦(قطع الطريق)⁩", en: "Hirabah (highway robbery)", ur: "حرابہ ⁦(قطعِ طریق)⁩", es: "Hirabah (robo en carretera)", fr: "Hirabah (braquage de grand chemin)" }
summary:
  ar: "الحرابة في الاصطلاح، ويسميها أكثر الفقهاء قطع الطريق، وهي البروز لأخذ مال أو قتل أو إرعاب على سبيل المجاهرة والمكابرة، اعتمادا على القوة مع البعد عن الغوث، وزاد المالكية محاولة الاعتداء على العرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} والحرابة من الكبائر، وهي من الحدود باتفاق، وسمى القرآن مرتكبيها محاربين لله ورسوله وساعين في الأرض فسادا، وعقوبتهم القتل أو الصلب أو تقطيع الأيدي والأرجل من خلاف أو النفي من الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} وتفترق عن البغي بأن البغي خروج على تأويل، والمحاربين خرجوا بغير تأويل، وتفترق عن السرقة بالمجاهرة، وعن الغصب بالسلاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} ويشترط الجمهور في المحارب الالتزام بأحكام الشريعة والتكليف، وعند الحنفية والحنابلة أن يحمل السلاح، والمالكية والشافعية يكتفون بالقهر والغلبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} وذكورة المحارب شرط عند الحنفية، ويرى أبو يوسف أن الرجال الذين يشاركون المرأة في المباشرة يُحدّون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} والردء، وهو المعين، حكمه حكم المباشر عند الحنفية والمالكية والحنابلة، ويُعزّر عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971} وعقوبة المحارب حد لا يسقط بالعفو، وتسقط بالتوبة قبل القدرة عليهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971}"
  en: "Hirabah, which most jurists call highway robbery (qat' al-tariq), is the act of taking to the road, to take property or to kill or terrify, openly and by force, with no help near at hand; the Malikis add an assault on honour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} It is a grave sin and a fixed penalty by consensus; the Qur'an calls its perpetrators those who wage war on God and His messenger and run about the land in corruption, and the penalty is killing, crucifixion, cutting of hands and feet on opposite sides, or banishment from the land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} Hirabah differs from rebellion (baghy), which is revolt under an interpretation, while the highwaymen act without one; it differs from theft by openness, and from usurpation by the use of force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} The majority require the highwayman to be a legally bound adult; the Hanafis and Hanbalis require arms, counting stones and sticks as arms, while the Malikis and Shafi'is require only coercion and dominance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} For the Hanafis, manhood is required, while Abu Yusuf would penalise men who join a woman in the act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} An accessory who supports the act is treated as the perpetrator by the Hanafis, Malikis and Hanbalis, and disciplined by the Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971} The penalty is a fixed penalty that a pardon cannot remove, and repentance before capture removes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971}"
  es: "Hirabah, que la mayoría de los juristas denominan robo en caminos (qat' al-tariq), es el acto de tomar la carretera para apoderarse de bienes, matar o aterrorizar, abiertamente y por la fuerza, sin ayuda cercana; los malikíes añaden un ataque al honor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} Es un pecado grave y una pena fija por consenso; el Corán llama a sus perpetradores aquellos que hacen la guerra a Dios y a Su mensajero y sembrar la corrupción por toda la tierra, y la pena es la muerte, la crucifixión, la amputación de manos y pies de lados opuestos o el destierro de la tierra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} Hirabah se diferencia de la rebelión (baghy), que es una revuelta bajo una interpretación, mientras que los bandoleros actúan sin uno; se diferencia del robo por la franqueza y de la usurpación por el uso de la fuerza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} La mayoría exige que el bandolero sea un adulto legalmente obligado; Los hanafíes y hanbalíes requieren armas, contando piedras y palos como armas, mientras que los malikíes y shafi'ís solo requieren coerción y dominio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} Para los hanafíes, se requiere la virilidad, mientras que Abu Yusuf castigaría a los hombres que se unen a una mujer en el acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} Un cómplice que apoya el acto es tratado como autor por los Hanafis, Malikis y Hanbalis, y disciplinado por los Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971} La pena es una pena fija que el perdón no puede eliminar, y el arrepentimiento antes de la captura la elimina. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971}"
  fr: "La hirabah, que la plupart des juristes qualifient de vol de grand chemin (qat' al-tariq), consiste à prendre la route pour s'emparer de biens, tuer ou terroriser ouvertement et par la force, sans aucune aide à proximité; les malikites y ajoutent une atteinte à l'honneur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} Il s'agit d'un péché grave passible d'une peine fixe et unanimement reconnue; le Coran qualifie ses auteurs de ceux qui font la guerre à Dieu et à Son messager et qui errent dans la corruption sur terre, et la peine encourue est la mise à mort, la crucifixion, l'amputation des mains et des pieds opposés, ou l'exil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} Hirabah diffère de la rébellion (baghy), qui est une révolte selon une interprétation, tandis que les bandits agissent sans un; elle diffère du vol par la transparence et de l'usurpation par l'usage de la force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} La majorité exige que le bandit de grands chemins soit un adulte légalement lié; Les hanafites et les hanbalites exigent la présence d'armes, considérant les pierres et les bâtons comme tels, tandis que les malikites et les chaféites n'exigent que la contrainte et la domination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} Pour les hanafites, la virilité est requise, tandis qu'Abou Yusuf pénalisait les hommes qui participaient à l'acte avec une femme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} Un complice qui soutient l'acte est traité comme l'auteur de l'acte par les Hanafis, les Malikis et les Hanbalis, et discipliné par les Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971} La pénalité est une pénalité fixe qu'un pardon ne peut pas supprimer, et le repentir avant la capture la supprime. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971}"
