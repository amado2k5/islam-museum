label: { ar: "الحرابة (قطع الطريق)", en: "Hirabah (highway robbery)", ur: "حرابہ (قطعِ طریق)" }
summary:
  ar: "الحرابة في الاصطلاح، ويسميها أكثر الفقهاء قطع الطريق، وهي البروز لأخذ مال أو قتل أو إرعاب على سبيل المجاهرة والمكابرة، اعتمادا على القوة مع البعد عن الغوث، وزاد المالكية محاولة الاعتداء على العرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} والحرابة من الكبائر، وهي من الحدود باتفاق، وسمى القرآن مرتكبيها محاربين لله ورسوله وساعين في الأرض فسادا، وعقوبتهم القتل أو الصلب أو تقطيع الأيدي والأرجل من خلاف أو النفي من الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} وتفترق عن البغي بأن البغي خروج على تأويل، والمحاربين خرجوا بغير تأويل، وتفترق عن السرقة بالمجاهرة، وعن الغصب بالسلاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} ويشترط الجمهور في المحارب الالتزام بأحكام الشريعة والتكليف، وعند الحنفية والحنابلة أن يحمل السلاح، والمالكية والشافعية يكتفون بالقهر والغلبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} وذكورة المحارب شرط عند الحنفية، ويرى أبو يوسف أن الرجال الذين يشاركون المرأة في المباشرة يُحدّون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} والردء، وهو المعين، حكمه حكم المباشر عند الحنفية والمالكية والحنابلة، ويُعزّر عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971} وعقوبة المحارب حد لا يسقط بالعفو، وتسقط بالتوبة قبل القدرة عليهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971}"
  en: "Hirabah, which most jurists call highway robbery (qat' al-tariq), is the act of taking to the road, to take property or to kill or terrify, openly and by force, with no help near at hand; the Malikis add an assault on honour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} It is a grave sin and a fixed penalty by consensus; the Qur'an calls its perpetrators those who wage war on God and His messenger and run about the land in corruption, and the penalty is killing, crucifixion, cutting of hands and feet on opposite sides, or banishment from the land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} Hirabah differs from rebellion (baghy), which is revolt under an interpretation, while the highwaymen act without one; it differs from theft by openness, and from usurpation by the use of force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6967} The majority require the highwayman to be a legally bound adult; the Hanafis and Hanbalis require arms, counting stones and sticks as arms, while the Malikis and Shafi'is require only coercion and dominance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} For the Hanafis, manhood is required, while Abu Yusuf would penalise men who join a woman in the act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} An accessory who supports the act is treated as the perpetrator by the Hanafis, Malikis and Hanbalis, and disciplined by the Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971} The penalty is a fixed penalty that a pardon cannot remove, and repentance before capture removes it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6971}"
