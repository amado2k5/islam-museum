id: "concept/al-sakta-al-mushabbiha-lil-mawt"
class: "concept"
kind: "scientific"
label:
  ar: "السكتة المشبّهة بالموت"
  en: "Apoplexy that resembles death"
  fr: "Apoplexie qui ressemble à la mort"
  ur: "موت سے مشابہ سکتہ"
  es: "Apoplejía que se asemeja a la muerte"
  tr: "ölümcül felç"
  id: "kelumpuhan fatal"
summary:
  ar: "يعرض أن يسكت الإنسان فلا يُفرّق بينه وبين الميت ولا يظهر منه تنفس ولا شيء ثم يعيش ويسلم؛ ولذلك استحبّ ابن سينا أن يؤخّر دفن المشكل من الموتى إلى أن تستبين حاله ولا أقل من اثنتين وسبعين ساعة {cite:canon-ibn-sina-print-v2 p.131}"
  en: "A person may be struck dumb so that he cannot be told from the dead — no breath or anything appears from him — and then he lives and is safe; for this reason Ibn Sina recommends delaying the burial of the ambiguous dead until the state is clear, no less than seventy-two hours {cite:canon-ibn-sina-print-v2 p.131}"
  fr: "Une personne peut être frappée de mutisme au point qu’on ne peut la distinguer d’un mort — aucun souffle ni rien n’apparaît d’elle —, puis elle vit et se rétablit ; c’est pourquoi Ibn Sina recommande de retarder l’inhumation des morts dont l’état est douteux jusqu’à ce que cet état soit clair, pas moins de soixante-douze heures {cite:canon-ibn-sina-print-v2 p.131}"
  ur: "ایسا بھی گزرتا ہے کہ انسان مسکوت ہو جائے تو اس کا اور مردے کا فرق نہ ہو اور اس سے تنفس یا کوئی چیز ظاہر نہ ہو پھر وہ جی اٹھے اور سلامت رہے؛ اسی لیے ابن سینا نے مشکل مردوں کا دفن اس وقت تک مؤخر کرنا پسند کیا جب تک حالت واضح نہ ہو، اور کم از کم بہتر گھنٹے {cite:canon-ibn-sina-print-v2 p.131}۔"
  es: "Una persona puede quedar muda de tal manera que no se la pueda distinguir de los muertos —no emite aliento ni ningún otro sonido— y entonces vive y está a salvo; por esta razón, Ibn Sina recomienda retrasar el entierro de los muertos en estado ambiguo hasta que su estado sea claro, no menos de setenta y dos horas {cite:canon-ibn-sina-print-v2 p.131}."
  tr: "Bir kişinin sessiz kalması, böylece kendisiyle ölü arasında ayrım olmaması, nefes alma ya da başka bir şey görünmemesi önerilir; o zaman yaşar ve teslim olur; bu nedenle İbn Sina, ölen kişinin durumu netleşene kadar defin töreninin en az yetmiş iki saat ertelenmesini önermiştir {cite:canon-ibn-sina-print-v2 s.131}"
  id: "Disarankan agar seseorang tetap diam agar tidak ada perbedaan antara dirinya dan almarhum, dan tidak ada napas atau hal lain yang terlihat; kemudian mereka hidup dan menyerah; oleh karena itu, Ibn Sina menyarankan menunda upacara pemakaman setidaknya selama tujuh puluh dua jam sampai kondisi almarhum dijelaskan {cite:canon-ibn-sina-print-v2 hlm.131}"
