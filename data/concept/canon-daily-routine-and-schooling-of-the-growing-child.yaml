summary:
  ar: "يبين ابن سينا نظام يوم الصبي: الاستحمام بعد الانتباه واللعب ثم قليل من الطعام ثم لعب أطول ثم استحمام وغذاء، وتجنب شرب الماء على الطعام، وتقديمه إلى المؤدب في السادسة تدريجاً، وتجنيبه النبيذ، وتقليل رياضته العنيفة إلى الرابعة عشرة {cite:canon-ibn-sina-print-v1 p.220}."
  en: "Ibn Sina sets the child's daily order: a bath on waking and play, a little food, a longer play, a bath and a meal, no drinking of water on food; presenting the child gradually to a teacher at six; avoiding wine; and lessening violent exercise up to fourteen {cite:canon-ibn-sina-print-v1 p.220}."
