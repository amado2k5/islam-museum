id: concept/canon-daily-routine-and-schooling-of-the-growing-child
class: concept
kind: scientific
label:
  ar: "تدبير يوم الصبي وتأديبه إلى الرابعة عشرة عند ابن سينا"
  en: "The growing child's day, schooling and regimen to fourteen in the Canon"
  fr: "Journée, école et régime de l’enfant jusqu’à quatorze ans dans le Canon"
  ur: "قانون میں بڑھتے بچے کا روزانہ تدبیر، تعلیم اور چودہ برس تک نگہداشت"
  es: "El día a día del niño en crecimiento, su escolarización y su rutina hasta los catorce años en el Canon"
summary:
  ar: "يبين ابن سينا نظام يوم الصبي: الاستحمام بعد الانتباه واللعب ثم قليل من الطعام ثم لعب أطول ثم استحمام وغذاء، وتجنب شرب الماء على الطعام، وتقديمه إلى المؤدب في السادسة تدريجاً، وتجنيبه النبيذ، وتقليل رياضته العنيفة إلى الرابعة عشرة {cite:canon-ibn-sina-print-v1 p.220}."
  en: "Ibn Sina sets the child's daily order: a bath on waking and play, a little food, a longer play, a bath and a meal, no drinking of water on food; presenting the child gradually to a teacher at six; avoiding wine; and lessening violent exercise up to fourteen {cite:canon-ibn-sina-print-v1 p.220}."
  fr: "Ibn Sina ordonne bain au réveil et jeu, peu de nourriture, jeu prolongé, bain et repas sans eau sur les aliments ; école progressive à six ans, absence de vin et diminution des exercices violents jusqu’à quatorze ans {cite:canon-ibn-sina-print-v1 p.220}."
  es: "Ibn Sina establece el orden diario del niño: un baño al despertar y jugar, un poco de comida, un juego más largo, un baño y una comida, no beber agua con las comidas; presentar al niño gradualmente a un maestro a los seis años; evitar el vino; y disminuir el ejercicio violento hasta los catorce años {cite:canon-ibn-sina-print-v1 p.220}."
  ur: "ابن سینا نے بچے کی روزانہ کی ترتیب مقرر کی ہے: جاگنے اور کھیلنے پر غسل، تھوڑا سا کھانا، ایک طویل کھیل، غسل اور کھانا، کھانے پر پانی نہ پینا۔ چھ بجے بچے کو آہستہ آہستہ استاد کے سامنے پیش کرنا؛ شراب سے بچنا؛ اور پرتشدد ورزش کو چودہ تک کم کرنا {حوالہ:کینن-ابن سینا-پرنٹ-v1 p.220}۔"
