id: concept/al-mania-wa-dau-al-kalb
class: concept
kind: scientific
label:
  ar: "المانيا وداء الكلب"
  en: "Mania and the \"dog illness\" (al-mania wa dau al-kalb)"
  fr: "La manie et la « maladie du chien » (al-mania wa dau al-kalb)"
  ur: "مانیا اور داء الکلب ⁦(المانيا وداء الكلب)⁩"
  es: "La manía y la \"enfermedad del perro\" (al-mania wa dau al-kalb)"
  tr: "Almanya ve kuduz"
  id: "Jerman dan rabies"
summary:
  ar: "يعرّف ابن سينا المانيا بأنه الجنون السبعي وأن داء الكلب نوع منه، ويفرّق مادته عن مادة المالنخوليا وعن قرانيطس، ويذكر وقت غلبته وما يحلّه {cite:canon-ibn-sina-print-v2 p.101}"
  en: "Ibn Sina defines mania as beastly madness and the \"dog illness\" as a kind of it, sets its matter apart from the matter of melancholia and from qaranitus, and says when it prevails and what resolves it {cite:canon-ibn-sina-print-v2 p.101}"
  fr: "Ibn Sina définit la manie comme une folie bestiale et la « maladie du chien » comme l’une de ses espèces, distingue sa matière de celle de la mélancolie et du qaranitus, et dit quand elle prévaut et ce qui la résout {cite:canon-ibn-sina-print-v2 p.101}"
  ur: "ابن سینا مانیا کو درندہ صفت جنون بتاتا ہے اور داء الکلب کو اس کی ایک قسم، اس کے مادے کو مالنخولیا اور قرانیطس سے الگ کرتا ہے، اور بتاتا ہے کہ وہ کب غالب ہوتا ہے اور اسے کیا حل کرتا ہے {cite:canon-ibn-sina-print-v2 p.101}۔"
  es: "Ibn Sina define la manía como locura bestial y la \"enfermedad del perro\" como una forma de ella, distingue su naturaleza de la melancolía y de la qaranitus, y dice cuándo prevalece y qué la resuelve {cite:canon-ibn-sina-print-v2 p.101}"
  tr: "İbn Sina, Almanya'yı yedi katlı delilik olarak tanımlar ve kuduzun bunun bir türü olduğunu belirtir. Özünü melankoliden ve kornitlerden ayırır, hakimiyet zamanını ve çözümünü belirtir {atıf:kanon-ibn-sina-print-v2 s.101}"
  id: "Ibn Sina mendefinisikan Jerman sebagai kegilaan tujuh kali lipat dan menyatakan bahwa rabies adalah salah satu tipe dari kegilaan tersebut. Ia membedakan esensinya dari melankoli dan kornit, menunjukkan waktu dan resolusi dominasi {sitasi: kanon-ibn-sina-print-v2 hlm.101}"
