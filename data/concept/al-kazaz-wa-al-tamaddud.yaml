id: "concept/al-kazaz-wa-al-tamaddud"
class: "concept"
kind: "scientific"
label:
  ar: "الكزاز والتمدد"
  en: "Tetanus (kazaz) and extension"
  ur: "كزاز اور تمدد"
summary:
  ar: "التمدد مرض آلي يمنع القوة المحركة عن قبض الأعضاء التي من شأنها أن تنقبض لآفة في العضل؛ والتمدد بالحقيقة ضد التشنج، فإذا اجتمع تشنجان في جهتين متضادتين صارا تمدداً، ولما كان هذا التمدد تشنجاً مضاعفاً وجب أن يكون أحدّ من التشنج البسيط فيكون بحرانه أسرع {cite:canon-ibn-sina-print-v2 p.150}"
  en: "Extension is an instrumental disease barring the motive power from contracting the organs meant to contract, for a lesion in the muscles; extension in truth is the opposite of convulsion, so when two convulsions meet in two opposite directions they become extension, and since this extension is a doubled convulsion it must be sharper than the simple convulsion and its crisis quicker {cite:canon-ibn-sina-print-v2 p.150}"
  ur: "تمدد ایک آلی مرض ہے جو محرک قوت کو ان اعضا کے قبض سے روکتا ہے جن کا شان یہ ہے کہ منقبض ہوں، عضل میں آفت کے سبب؛ اور تمدد حقیقت میں تشنج کی ضد ہے، تو جب دو متضاد جهتوں میں دو تشنج جمع ہوں تو وہ تمدد بن جاتے ہیں، اور چونکہ یہ تمدد دوگنا تشنج ہے تو اسے سادہ تشنج سے زیادہ تیز ہونا چاہیے تو اس کا بحران جلد ہوتا ہے {cite:canon-ibn-sina-print-v2 p.150}۔"
