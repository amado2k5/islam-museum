id: concept/al-dua-ala-al-nafs-wal-awlad
class: concept
kind: ethical
label:
  ar: "الدعاء على النفس والأولاد"
  en: "Praying against oneself and one's children"
  fr: "Prier contre soi-même et contre ses enfants"
  ur: "اپنے اور اولاد کے خلاف بددعا"
  es: "Orar contra uno mismo y contra los hijos"
  tr: "Kendisi ve çocukları için dua etmek"
  id: "Berdoa untuk dirinya sendiri dan anak-anaknya"
summary:
  ar: "يعدّ عمر عبد الكافي الدعاء على النفس والأولاد والأموال من آفات اللسان، ويحذّر من أن يوافق ساعة إجابة، ويدعو إلى الدعاء للولد العاق والظالم بالهداية بدلًا من الدعاء عليهم."
  en: "Omar Abdelkafy counts praying against oneself, one's children and one's wealth among the faults of the tongue, warns that it may coincide with an hour of answer, and urges praying for guidance for the undutiful child and the wrongdoer instead of against them."
  fr: "Omar Abdelkafy compte le fait de prier contre soi-même, ses enfants et ses biens parmi les fautes de la langue, avertit que cela peut coïncider avec une heure d’exaucement et préconise de prier pour que l’enfant désobéissant et l’auteur d’un tort soient guidés plutôt que de prier contre eux."
  ur: "عمر عبد الکافی اپنے، اولاد اور مال کے خلاف بددعا کو زبان کی آفات میں شمار کرتے ہیں، خبردار کرتے ہیں کہ یہ قبولیت کی گھڑی سے مل سکتی ہے، اور نافرمان اولاد اور ظالم کے خلاف بددعا کے بجائے ان کی ہدایت کی دعا کی تلقین کرتے ہیں۔"
  es: "Omar Abdelkafy considera que orar contra uno mismo, los hijos y las riquezas se encuentran entre los pecados de la lengua, advierte que puede coincidir con la hora de la respuesta e insta a orar pidiendo guía para el hijo desobediente y el malhechor en lugar de orar contra ellos."
  tr: "Ömer Abdelkafi, dilin sıkıntıları arasında kendisi, çocuklar ve servet için dua etmeyi düşünür, bir saat cevap vermeye karşı uyarır ve itaatsiz, baskıcı çocuğun dua etmek yerine rehberlik edilmesi için dua edilmesini ister."
  id: "Omar Abdelkafi, di tengah kesulitan bahasa, memikirkan tentang berdoa untuk dirinya sendiri, anak-anaknya, dan kekayaan, memperingatkan agar tidak menjawab selama satu jam, dan meminta doa untuk membimbing anak yang tidak patuh dan menindas daripada berdoa."
