label:
  ar: "الدعاء على النفس والأولاد"
  en: "Praying against oneself and one's children"
  ur: "اپنے اور اولاد کے خلاف بددعا"
summary:
  ar: "يعدّ عمر عبد الكافي الدعاء على النفس والأولاد والأموال من آفات اللسان، ويحذّر من أن يوافق ساعة إجابة، ويدعو إلى الدعاء للولد العاق والظالم بالهداية بدلًا من الدعاء عليهم."
  en: "Omar Abdelkafy counts praying against oneself, one's children and one's wealth among the faults of the tongue, warns that it may coincide with an hour of answer, and urges praying for guidance for the undutiful child and the wrongdoer instead of against them."
  ur: "عمر عبد الکافی اپنے، اولاد اور مال کے خلاف بددعا کو زبان کی آفات میں شمار کرتے ہیں، خبردار کرتے ہیں کہ یہ قبولیت کی گھڑی سے مل سکتی ہے، اور نافرمان اولاد اور ظالم کے خلاف بددعا کے بجائے ان کی ہدایت کی دعا کی تلقین کرتے ہیں۔"
