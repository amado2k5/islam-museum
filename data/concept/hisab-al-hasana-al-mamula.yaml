id: concept/hisab-al-hasana-al-mamula
class: concept
kind: doctrine
label:
  ar: "الحسنة المعمولة بعشر أمثالها إلى سبعمائة ضعف"
  en: "A good deed done: ten to seven hundred"
  ur: "کیا ہوا نیک عمل: دس سے سات سو گنا"
summary:
  ar: "أصل العدّ كله: من همّ بحسنة فعملها كُتبت له عشر حسنات إلى سبعمائة ضعف إلى أضعاف كثيرة، كما في الحديث القدسي الذي يرويه ابن عباس [[passage/muslim-0131]] [[passage/bukhari-6491]]، وهو موافق لآية الأنعام التي تجعل للحسنة عشر أمثالها [[passage/quran-6-160]]. فالعشر حدّ أدنى مكتوب، وما فوقها إلى السبعمائة وما بعدها فضل لا يحدّه النص بعدد. ولذلك تعرض الآلة الحاسبة هذا السطر مدى بين عشر وسبعمائة، لا رقما واحدا."
  en: "The root of the whole count: whoever intends a good deed and does it has ten good deeds written for him, up to seven hundred times, up to many times more, in the hadith qudsi related by Ibn Abbas [[passage/muslim-0131]] [[passage/bukhari-6491]]; it agrees with the verse of al-An'am that gives a good deed ten like it [[passage/quran-6-160]]. Ten is the written minimum; what lies above it, to seven hundred and beyond, is a bounty the text does not cap. The calculator therefore shows this row as a range from ten to seven hundred, never as a single figure."
  ur: "سارے شمار کی بنیاد: جو نیکی کا ارادہ کرے اور اسے کر لے اس کے لیے دس نیکیاں لکھی جاتی ہیں، سات سو گنا تک اور اس سے بھی کئی گنا، جیسا کہ ابن عباس کی روایت کردہ حدیثِ قدسی میں ہے [[passage/muslim-0131]] [[passage/bukhari-6491]]، اور یہ سورۂ انعام کی اس آیت کے مطابق ہے جو نیکی کے لیے دس گنا بتاتی ہے [[passage/quran-6-160]]۔ دس لکھی ہوئی کم از کم حد ہے؛ اس سے اوپر سات سو اور اس کے بعد کا فضل نص نے کسی عدد میں بند نہیں کیا۔ اسی لیے کیلکولیٹر اس سطر کو دس سے سات سو کی حد کے طور پر دکھاتا ہے، ایک عدد کے طور پر نہیں۔"
