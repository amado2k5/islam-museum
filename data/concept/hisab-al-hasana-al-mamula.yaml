id: concept/hisab-al-hasana-al-mamula
class: concept
kind: doctrine
label:
  ar: "الحسنة المعمولة بعشر أمثالها إلى سبعمائة ضعف"
  en: "A good deed done: ten to seven hundred"
  ur: "کیا ہوا نیک عمل: دس سے سات سو گنا"
  es: "Una buena acción realizada: de diez a setecientos"
  fr: "Une bonne action accomplie: dix à sept cents"
  tr: "İyi bir iş on kat yedi yüz kata çıkar"
  id: "Perbuatan baik dikalikan sepuluh kali lipat hingga tujuh ratus kali"
summary:
  ar: "أصل العدّ كله: من همّ بحسنة فعملها كُتبت له عشر حسنات إلى سبعمائة ضعف إلى أضعاف كثيرة، كما في الحديث القدسي الذي يرويه ابن عباس [[passage/muslim-0131]] [[passage/bukhari-6491]]، وهو موافق لآية الأنعام التي تجعل للحسنة عشر أمثالها [[passage/quran-6-160]]. فالعشر حدّ أدنى مكتوب، وما فوقها إلى السبعمائة وما بعدها فضل لا يحدّه النص بعدد. ولذلك تعرض الآلة الحاسبة هذا السطر مدى بين عشر وسبعمائة، لا رقما واحدا."
  en: "The root of the whole count: whoever intends a good deed and does it has ten good deeds written for him, up to seven hundred times, up to many times more, in the hadith qudsi related by Ibn Abbas [[passage/muslim-0131]] [[passage/bukhari-6491]]; it agrees with the verse of al-An'am that gives a good deed ten like it [[passage/quran-6-160]]. Ten is the written minimum; what lies above it, to seven hundred and beyond, is a bounty the text does not cap. The calculator therefore shows this row as a range from ten to seven hundred, never as a single figure."
  ur: "سارے شمار کی بنیاد: جو نیکی کا ارادہ کرے اور اسے کر لے اس کے لیے دس نیکیاں لکھی جاتی ہیں، سات سو گنا تک اور اس سے بھی کئی گنا، جیسا کہ ابن عباس کی روایت کردہ حدیثِ قدسی میں ہے [[passage/muslim-0131]] [[passage/bukhari-6491]]، اور یہ سورۂ انعام کی اس آیت کے مطابق ہے جو نیکی کے لیے دس گنا بتاتی ہے [[passage/quran-6-160]]۔ دس لکھی ہوئی کم از کم حد ہے؛ اس سے اوپر سات سو اور اس کے بعد کا فضل نص نے کسی عدد میں بند نہیں کیا۔ اسی لیے کیلکولیٹر اس سطر کو دس سے سات سو کی حد کے طور پر دکھاتا ہے، ایک عدد کے طور پر نہیں۔"
  es: "La raíz de todo el conteo: quien tiene la intención de hacer una buena acción y la realiza, tiene diez buenas acciones escritas para él, hasta setecientas veces, e incluso muchas veces más, en el hadiz qudsi relatado por Ibn Abbas [[passage/muslim-0131]] [[passage/bukhari-6491]]; esto concuerda con el versículo de al-An'am que otorga a una buena acción diez como ella [[passage/quran-6-160]]. Diez es el mínimo escrito; lo que está por encima de él, hasta setecientas y más allá, es una recompensa que el texto no limita. Por lo tanto, la calculadora muestra esta fila como un rango de diez a setecientas, nunca como una sola cifra."
  fr: "Le principe fondamental de ce décompte est le suivant: quiconque a l’intention d’accomplir une bonne action et la réalise se voit attribuer dix bonnes actions, jusqu’à sept cents fois, voire bien plus, selon le hadith qudsi rapporté par Ibn Abbas [[passage/muslim-0131]] [[passage/bukhari-6491]]. Ceci concorde avec le verset d’al-An’am qui attribue dix bonnes actions pour une seule [[passage/quran-6-160]]. Dix est le minimum inscrit; au-delà, jusqu’à sept cents et plus, il s’agit d’une grâce non plafonnée par le texte. C’est pourquoi la calculatrice affiche cette ligne comme une plage de dix à sept cents, et jamais comme un chiffre unique."
  tr: "Tüm sayımın kökeni: İyi bir iş yapan kişi, İbn Abbas'ın [[pasaj/müslülim-0131]] [[Bukhari-6491]] tarafından anlatılan kutsal hadislerde olduğu gibi, onun için yedi yüz kez ve birçok kez kaydedilir; bu ayet, El-An'ayetine karşılık gelir ve on kat daha fazla kez atamıştır [[pasaj/kuran-6-160]]. On minimum yazılı sınırdır ve yedi yüz ve üzerine kadar olan her şey metinle sayı ile sınırlı olmayan bir erdemdir. Bu nedenle, hesaplayıcı bu satırı on ile yedi yüz arasında gösterir, tek bir sayı değil."
  id: "Asal mula seluruh hitungan: Siapa pun berbuat baik, sepuluh perbuatan baik dicatat untuknya hingga tujuh ratus kali dan berkali-kali, seperti dalam hadits suci yang diceritakan oleh Ibn Abbas [[ayat/muslim-0131]] [[ayat/Bukhari-6491]], yang sesuai dengan ayat Al-An'am, yang menetapkan sepuluh kali jumlah [[ayat/a-quran-6-160]]. Sepuluh adalah batas minimum tertulis, dan segala sesuatu di atasnya hingga tujuh ratus atau lebih adalah kebajikan yang tidak dibatasi oleh teks oleh angka. Oleh karena itu, kalkulator menunjukkan garis ini antara sepuluh dan tujuh ratus, bukan satu angka tunggal."
