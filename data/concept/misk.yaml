  es: "Misk (almizcle)"
summary:
  ar: "المسك سرة دابة كالظبي، حار يابس في الثانية، لطيف مقوٍّ، ينفع الصداع البارد والخفقان ويقوي العين والقلب ويعد ترياقاً للسموم {cite:canon-ibn-sina-print-v1 p.553}."
  en: "Musk is the navel of an animal like a deer, hot and dry in the second degree, fine and strengthening; it helps cold headache and palpitation, strengthens the eye and the heart, and is called an antidote to poisons {cite:canon-ibn-sina-print-v1 p.553}."
  ur: "مسک ہرن جیسے جانور کی ناف ہے، دوسرے درجے میں گرم خشک، لطیف اور قوت دینے والا؛ سرد سردرد اور دھڑکن میں مفید ہے، آنکھ اور دل کو قوت دیتا ہے اور زہروں کا تریاق کہا گیا ہے {cite:canon-ibn-sina-print-v1 p.553}۔"
  es: "El almizcle es el ombligo de un animal como un ciervo, caliente y seco en segundo grado, fino y fortalecedor; ayuda con el dolor de cabeza por frío y las palpitaciones, fortalece la vista y el corazón, y se llama un antídoto contra los venenos {cite:canon-ibn-sina-print-v1 p.553}."
