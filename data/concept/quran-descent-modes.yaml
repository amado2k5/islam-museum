id: concept/quran-descent-modes
class: concept
kind: belief
label: { ar: "نزول القرآن: الإنزال والتنزيل", en: "The descent of the Qur'an: sending down and gradual descent", ur: "قرآن کا نزول: انزال اور تنزیل" }
summary:
  ar: "يرى الشعراوي أن للقرآن نزولين: إنزالاً جملةً إلى السماء الدنيا في ليلة القدر، وتنزيلاً منجماً على الرسول حسب الأحداث في ثلاث وعشرين سنة، وأن التوراة والإنجيل أُنزلا مرة واحدة، وأن التنجيم كان لتثبيت النبي ولتعليم الأمة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1263} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1264} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1265}."
  en: "Sha'rawi holds that the Qur'an had two descents: a sending down, all at once, to the lowest heaven on the Night of Power, and a gradual descent to the Prophet over twenty-three years as events required. He holds that the Torah and the Gospel came down once, and that the gradual descent was to steady the Prophet and to teach the community {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1263} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1264} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1265}."
  ur: "شعراوی کے نزدیک قرآن کے دو نزول ہیں: ایک انزال، جو شبِ قدر میں پہلے آسمان تک یکبارگی ہوا، اور دوسرا تنزیل، جو تئیس سال میں واقعات کے مطابق نبی پر تھوڑا تھوڑا ہوا۔ ان کے نزدیک توراۃ اور انجیل ایک بار اتری، اور تدریجی نزول نبی کو ثابت رکھنے اور امت کو سکھانے کے لیے تھا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1263} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1264} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1265}۔"
