label:
  ar: "العربية في الأردن"
  en: "Arabic in Jordan"
  ur: "اردن میں عربی"
  fr: "L'arabe en Jordanie"
  es: "El árabe en Jordania"
summary:
  ar: "ما وُجد عن العربية في الأردن: المادة 2 من الدستور كما يعرضها Constitute، ووصف دراسة مكتبة الكونغرس لأشكال العربية والبدو واللهجة المشتركة مع الجيران وللجماعات الصغيرة، وتصنيف الشامية عند مانشستر وGlottolog، مع ما لم يُعثر عليه. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on Arabic in Jordan: Article 2 of the Constitution as the Constitute Project shows it, the Library of Congress study's account of the forms of Arabic, the Bedouin, the dialect shared with neighbours and the small communities, and the Levantine classification at Manchester and Glottolog, with what was not found. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "اردن میں عربی کے بارے میں جو ملا: دستور کی دفعہ 2 جیسا Constitute دکھاتا ہے، لائبریری آف کانگریس کی تحقیق کا عربی کی صورتوں، بدوؤں، پڑوسیوں سے مشترک بولی اور چھوٹی جماعتوں کا بیان، اور مانچسٹر اور Glottolog میں شامی گروہ کی درجہ بندی، اور جو نہیں ملا اس کے ساتھ۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur l'arabe en Jordanie : l'article 2 de la Constitution tel que le montre le Constitute Project, le compte rendu de l'étude de la Bibliothèque du Congrès sur les formes de l'arabe, les Bédouins, le dialecte partagé avec les voisins et les petites communautés, et la classification levantine chez Manchester et Glottolog, avec ce qui n'a pas été trouvé. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el árabe en Jordania: el artículo 2 de la Constitución tal como lo muestra el Constitute Project, el relato del estudio de la Biblioteca del Congreso sobre las formas del árabe, los beduinos, el dialecto compartido con los vecinos y las pequeñas comunidades, y la clasificación levantina en Manchester y Glottolog, con lo que no se halló. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
