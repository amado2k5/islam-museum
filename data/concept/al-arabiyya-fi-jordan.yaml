label:
  ar: "العربية في الأردن"
  en: "Arabic in Jordan"
  ur: "اردن میں عربی"
  fr: "L'arabe en Jordanie"
  es: "El árabe en Jordania"
summary:
  ar: "ما وُجد عن العربية في الأردن: المادة 2 من الدستور كما يعرضها Constitute، ووصف دراسة مكتبة الكونغرس لأشكال العربية والبدو واللهجة المشتركة مع الجيران وللجماعات الصغيرة، وتصنيف الشامية عند مانشستر وGlottolog، مع ما لم يُعثر عليه."
  en: "What was found on Arabic in Jordan: Article 2 of the Constitution as the Constitute Project shows it, the Library of Congress study's account of the forms of Arabic, the Bedouin, the dialect shared with neighbours and the small communities, and the Levantine classification at Manchester and Glottolog, with what was not found."
  ur: "اردن میں عربی کے بارے میں جو ملا: دستور کی دفعہ 2 جیسا Constitute دکھاتا ہے، لائبریری آف کانگریس کی تحقیق کا عربی کی صورتوں، بدوؤں، پڑوسیوں سے مشترک بولی اور چھوٹی جماعتوں کا بیان، اور مانچسٹر اور Glottolog میں شامی گروہ کی درجہ بندی، اور جو نہیں ملا اس کے ساتھ۔"
  fr: "Ce qui a été trouvé sur l'arabe en Jordanie : l'article 2 de la Constitution tel que le montre le Constitute Project, le compte rendu de l'étude de la Bibliothèque du Congrès sur les formes de l'arabe, les Bédouins, le dialecte partagé avec les voisins et les petites communautés, et la classification levantine chez Manchester et Glottolog, avec ce qui n'a pas été trouvé."
  es: "Lo que se encontró sobre el árabe en Jordania: el artículo 2 de la Constitución tal como lo muestra el Constitute Project, el relato del estudio de la Biblioteca del Congreso sobre las formas del árabe, los beduinos, el dialecto compartido con los vecinos y las pequeñas comunidades, y la clasificación levantina en Manchester y Glottolog, con lo que no se halló."
