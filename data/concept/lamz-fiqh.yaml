id: concept/lamz-fiqh
class: concept
kind: legal
label:
  ar: "اللَّمْز"
  en: "Blaming and mocking (lamz), rulings"
  ur: "لمز (طعن، احکام)"
summary:
  ar: "اللَّمْز في اللغة العيب في السر، وأصله الإشارة بالعين والرأس والشفة مع كلام خفي، وقيل العيب في الوجه والوقوع في الناس؛ والهمز الغمز والاغتياب، والغمز الإشارة بالعين أو الحاجب، والغيبة ذكر الإنسان بما يكره وإن كان حقاً؛ والصلة أن اللمز أعم من الهمز والغمز، وأن الغيبة أعم منه لأن اللمز من أقسامها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13700}."
  en: "Lamz, in lexicon, is blame in secret, its root being a sign with the eye, head and lip together with a low speech; some say it is blame to the face and attacking people. Hamz is pressing and backbiting, ghamz is a sign with the eye or brow, and ghiba is mentioning a person with what he dislikes even if true. Lamz is wider than hamz and ghamz, and ghiba is wider than it, since lamz is one of its kinds {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13700}."
  ur: "لمز لغت میں پوشیدہ عیب لگانے کو کہتے ہیں، جس کی اصل آنکھ، سر اور ہونٹ کے اشارے کے ساتھ آہستہ بات ہے؛ اور کہا گیا ہے کہ چہرے پر عیب لگانا اور لوگوں پر پڑنا ہے؛ همز دبانا اور غیبت، غمز آنکھ یا ابرو سے اشارہ کرنا، اور غیبت کسی کو ایسی بات سے یاد کرنا جو اسے ناپسند ہو، خواہ سچ ہو؛ لمز همز اور غمز سے عام ہے، اور غیبت لمز سے عام ہے کیونکہ لمز اس کی ایک قسم ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13700}۔"
