label:
  ar: "اللَّمْز"
  en: "Blaming and mocking (lamz), rulings"
  ur: "لمز ⁦(طعن، احکام)⁩"
  es: "Culpar y burlarse (lamz), dictamen"
  fr: "Blâmer et se moquer (lamz), décisions"
  tr: "Al-Lam"
  id: "Al-Lam"
summary:
  ar: "اللَّمْز في اللغة العيب في السر، وأصله الإشارة بالعين والرأس والشفة مع كلام خفي، وقيل العيب في الوجه والوقوع في الناس؛ والهمز الغمز والاغتياب، والغمز الإشارة بالعين أو الحاجب، والغيبة ذكر الإنسان بما يكره وإن كان حقاً؛ والصلة أن اللمز أعم من الهمز والغمز، وأن الغيبة أعم منه لأن اللمز من أقسامها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13700}."
  en: "Lamz, in lexicon, is blame in secret, its root being a sign with the eye, head and lip together with a low speech; some say it is blame to the face and attacking people. Hamz is pressing and backbiting, ghamz is a sign with the eye or brow, and ghiba is mentioning a person with what he dislikes even if true. Lamz is wider than hamz and ghamz, and ghiba is wider than it, since lamz is one of its kinds {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13700}."
  ur: "لمز لغت میں پوشیدہ عیب لگانے کو کہتے ہیں، جس کی اصل آنکھ، سر اور ہونٹ کے اشارے کے ساتھ آہستہ بات ہے؛ اور کہا گیا ہے کہ چہرے پر عیب لگانا اور لوگوں پر پڑنا ہے؛ همز دبانا اور غیبت، غمز آنکھ یا ابرو سے اشارہ کرنا، اور غیبت کسی کو ایسی بات سے یاد کرنا جو اسے ناپسند ہو، خواہ سچ ہو؛ لمز همز اور غمز سے عام ہے، اور غیبت لمز سے عام ہے کیونکہ لمز اس کی ایک قسم ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13700}۔"
  es: "Lamz, en el léxico, es culpa en secreto, su raíz es un signo con el ojo, la cabeza y el labio junto con un habla baja; algunos dicen que es culpar a la cara y atacar a la gente. Hamz es presionar y murmurar, ghamz es un signo con el ojo o la ceja, y ghiba es mencionar a una persona con lo que le disgusta incluso si es cierto. Lamz es más amplio que hamz y ghamz, y ghiba es más amplio que este, ya que lamz es uno de sus tipos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13700}."
  fr: "Le terme « lamz », dans le lexique, désigne un blâme tenu en secret. Sa racine est un signe impliquant l'œil, la tête et les lèvres, accompagné d'une voix basse. Certains l'interprètent comme un blâme direct et une attaque personnelle. « Hamz » signifie importuner et médiser, « ghamz » désigne un signe impliquant l'œil ou le front, et « ghiba » consiste à parler d'une personne en évoquant ce que l'on désapprouve, même si cela est vrai. « Lamz » a un sens plus large que « hamz » et « ghamz », et « ghiba » est encore plus large, car « lamz » est l'une de ses catégories {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13700}."
  tr: "Dilde al-lamz, gizli bir kusura atıfta bulunur; başlangıçta göz, baş veya dudak ile ince konuşma ile ifade edilir. Ayrıca kusurun yüzde veya insanların içine düşmekte olduğu söylenir; hamz göz kırpma ve yokluk, ima ise göz veya kaşla yapılan jesttir. Sırtından bağırmak, bir kişiyi sevmeyen bir şekilde anmayı ifade eder, doğru olsa bile; bağlantı şudur ki, lamz hamza ve ghamma'dan daha geniştir, sırtından isirlemenin ise ipuçlarının türleri arasında olması {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13700}."
  id: "Al-lamz dalam bahasa merujuk pada cacat rahasia, awalnya merujuk pada mata, kepala, atau bibir dengan ucapan halus. Juga dikatakan bahwa kesalahan ada pada wajah atau jatuh ke dalam manusia; hamz adalah mengedipkan mata dan tidak ada, dan memberi petunjuk adalah gestur dengan mata atau alis. Menyebut dengan menyebut seseorang dengan cara yang tidak disukai, meskipun itu benar; kaitannya adalah lamz lebih luas daripada hamza dan ghamma, dan cacian lebih luas karena petunjuk termasuk jenisnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13699} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.13700}."
