id: concept/month-shahr
class: concept
kind: legal
label:
  ar: "الشَّهْر"
  en: "Shahr (the month: the lunar month in law, the months of pilgrimage, the iddah in months, and the hire by the month)"
  es: "Shahr (el mes: el mes lunar en la ley, los meses de peregrinación, el iddah en meses y el alquiler por mes)"
  fr: "Shahr (le mois: le mois lunaire en droit, les mois de pèlerinage, l’iddah en mois et la location au mois)"
  ur: "شہر ⁦(مہینہ: قمری مہینہ، حج کے مہینے، مہینوں میں عدت، مہینے کے حساب سے اجرت)⁩"
summary:
  ar: "الشهر عند الإطلاق في الشرع هو الشهر الهلالي، لقوله تعالى في سورة التوبة (36) إن عدة الشهور عند الله اثنا عشر شهرا منها أربعة حرم. وأشهر الحج عند الجمهور شوال وذو القعدة وعشر من ذي الحجة، وعند المالكية وذو الحجة كله. وتعتد المرأة التي لا تحيض بالأشهر. وإذا آجر الشيء شهرا بشهر، فالحنفية والمالكية يصححون العقد، والشافعية يبطلونه في غير الشهر الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236}"
  en: "When the word is used without qualification in law, the month means the lunar month, as the verse of the Repentance (36) says: the number of months with God is twelve, four of them sacred. The months of the pilgrimage are, for most jurists, Shawwal, Dhu al-Qa'da and the first ten days of Dhu al-Hijja; for the Malikis, all of Dhu al-Hijja. A woman who no longer menstruates observes her waiting period in months. Where a thing is hired month by month, the Hanafis and Malikis validate the contract, the Shafi'is void it beyond the first month, and the jurists differ on how a month that does not begin on the first day is counted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236}"
  es: "Cuando la palabra se usa sin especificación en derecho, el mes se refiere al mes lunar, como dice el versículo del Arrepentimiento (36): el número de meses con Dios es doce, cuatro de ellos sagrados. Los meses de la peregrinación son, para la mayoría de los juristas, Shawwal, Dhu al-Qa'da y los primeros diez días de Dhu al-Hijja; para los Malikis, todo Dhu al-Hijja. Una mujer que ya no menstrúa observa su período de espera en meses. Cuando algo se alquila mes a mes, los Hanafi y los Malikis validan el contrato, los Shafi'is lo anulan después del primer mes, y los juristas difieren en cómo se cuenta un mes que no comienza el primer día. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10233} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10234} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10235} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236}"
  fr: "En droit, lorsque le terme est employé sans précision, il désigne le mois lunaire, conformément au verset 36 du Coran: « Le nombre de mois auprès de Dieu est de douze, dont quatre sont sacrés. » Pour la plupart des juristes, les mois du pèlerinage sont Shawwal, Dhu al-Qa'da et les dix premiers jours de Dhu al-Hijja; pour les Malikites, c'est tout le mois de Dhu al-Hijja. Une femme ménopausée observe une période de ménopause en mois. Concernant la location mensuelle, les Hanafites et les Malikites valident le contrat, les Chafi'ites l'annulent après le premier mois, et les juristes divergent sur le calcul d'un mois qui ne commence pas le premier jour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236}"
  ur: "جب یہ لفظ قانون میں قابلیت کے بغیر استعمال ہوتا ہے تو مہینہ کا مطلب قمری مہینہ ہے جیسا کہ توبہ کی آیت (36) کہتی ہے: خدا کے نزدیک مہینوں کی تعداد بارہ ہے، جن میں سے چار حرمت والے ہیں۔ اکثر فقہاء کے نزدیک حج کے مہینے شوال، ذی القعدہ اور ذی الحجہ کے پہلے دس دن ہیں۔ مالکیوں کے لیے، تمام ذی الحجہ۔ ایک عورت جس کو اب حیض نہیں آتا اس کی عدت مہینوں میں دیکھتی ہے۔ جہاں کسی چیز کو مہینہ بہ مہینہ کرایہ پر لیا جاتا ہے تو احناف اور مالکیہ عقد کو صحیح قرار دیتے ہیں، شافعی پہلے مہینے کے بعد اسے کالعدم قرار دیتے ہیں، اور فقہاء کا اس بات میں اختلاف ہے کہ وہ مہینہ جو پہلے دن سے شروع نہیں ہوتا اسے کیسے شمار کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10232} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10233} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10234} صفحہ 10235} {حوالہ: فقہ الموسوعہ کویتیہ نور v3 صفحہ 10236}"
