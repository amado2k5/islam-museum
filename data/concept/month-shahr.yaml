id: concept/month-shahr
class: concept
kind: legal
label:
  ar: "الشَّهْر"
  en: "Shahr (the month: the lunar month in law, the months of pilgrimage, the iddah in months, and the hire by the month)"
summary:
  ar: "الشهر عند الإطلاق في الشرع هو الشهر الهلالي، لقوله تعالى في سورة التوبة (36) إن عدة الشهور عند الله اثنا عشر شهرا منها أربعة حرم. وأشهر الحج عند الجمهور شوال وذو القعدة وعشر من ذي الحجة، وعند المالكية وذو الحجة كله. وتعتد المرأة التي لا تحيض بالأشهر. وإذا آجر الشيء شهرا بشهر، فالحنفية والمالكية يصححون العقد، والشافعية يبطلونه في غير الشهر الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236}"
  en: "When the word is used without qualification in law, the month means the lunar month, as the verse of the Repentance (36) says: the number of months with God is twelve, four of them sacred. The months of the pilgrimage are, for most jurists, Shawwal, Dhu al-Qa'da and the first ten days of Dhu al-Hijja; for the Malikis, all of Dhu al-Hijja. A woman who no longer menstruates observes her waiting period in months. Where a thing is hired month by month, the Hanafis and Malikis validate the contract, the Shafi'is void it beyond the first month, and the jurists differ on how a month that does not begin on the first day is counted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10233} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10234} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10236}"
