label: { ar: "لماذا لا يغذى المستفرغ دفعة عند ابن سينا", en: "Why refeeding after evacuation must be gradual in the Canon", ur: "استفراغ کے بعد یک دم غذا کیوں نہ دی جائے قانون میں" }
summary:
  ar: "يحذر ابن سينا من تغذية المستفرغين دفعة لتتمة حاجتهم لأن الغذاء غير المنهضم ينجذب إلى العروق لوجوه ثلاثة: بخل المعدة بالقليل ومنازعتها قوة الكبد الجاذبة، وأن الكثير لا يجود هضمه في المعدة، وأن الكثير يرسل إلى العروق فتعجز عن هضمه {cite:canon-ibn-sina-print-v1 p.250}."
  en: "Ibn Sina warns against feeding those who have been evacuated their full need at once, because undigested food is drawn into the vessels for three reasons: the stomach is stingy with a little and its retaining power contends with the liver's drawing power, much food is not digested well in the stomach, and much sent to the vessels is beyond their power to digest {cite:canon-ibn-sina-print-v1 p.250}."
