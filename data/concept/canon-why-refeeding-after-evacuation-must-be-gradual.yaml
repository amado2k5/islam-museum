id: concept/canon-why-refeeding-after-evacuation-must-be-gradual
class: concept
kind: scientific
label: { ar: "لماذا لا يغذى المستفرغ دفعة عند ابن سينا", en: "Why refeeding after evacuation must be gradual in the Canon", ur: "استفراغ کے بعد یک دم غذا کیوں نہ دی جائے قانون میں", es: "Por qué la realimentación después de la evacuación debe ser gradual en el Canon", fr: "Pourquoi la réalimentation après l'évacuation doit être progressive selon le canon" }
summary:
  ar: "يحذر ابن سينا من تغذية المستفرغين دفعة لتتمة حاجتهم لأن الغذاء غير المنهضم ينجذب إلى العروق لوجوه ثلاثة: بخل المعدة بالقليل ومنازعتها قوة الكبد الجاذبة، وأن الكثير لا يجود هضمه في المعدة، وأن الكثير يرسل إلى العروق فتعجز عن هضمه {cite:canon-ibn-sina-print-v1 p.250}."
  en: "Ibn Sina warns against feeding those who have been evacuated their full need at once, because undigested food is drawn into the vessels for three reasons: the stomach is stingy with a little and its retaining power contends with the liver's drawing power, much food is not digested well in the stomach, and much sent to the vessels is beyond their power to digest {cite:canon-ibn-sina-print-v1 p.250}."
  es: "Ibn Sina advierte contra alimentar a quienes han sido evacuados con todo lo que necesitan de una vez, porque los alimentos no digeridos son absorbidos por los vasos por tres razones: el estómago es tacaño con poco y su poder de retención compite con el poder de absorción del hígado, muchos alimentos no se digieren bien en el estómago y mucho de lo que se envía a los vasos está más allá de su capacidad de digestión {cite:canon-ibn-sina-print-v1 p.250}."
  fr: "Ibn Sina met en garde contre le fait de nourrir en une seule fois ceux qui ont été évacués la totalité de leurs besoins, car les aliments non digérés sont attirés dans les vaisseaux pour trois raisons: l'estomac est avare avec peu et son pouvoir de rétention est en conflit avec le pouvoir d'attraction du foie, une grande quantité d'aliments n'est pas bien digérée dans l'estomac, et une grande partie envoyée aux vaisseaux dépasse leur capacité de digestion {cite:canon-ibn-sina-print-v1 p.250}."
