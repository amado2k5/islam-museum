summary:
  ar: "الصدقة في الاصطلاح الشرعي ما يُعطى ابتغاء الأجر؛ يفصّل الفقهاء أحكامها في كتب الزكاة والنذور {cite:sabiq-fiqh-al-sunnah}."
  en: "Sadaqah in legal usage is what is given seeking the reward; the jurists detail its rulings in the chapters of zakat and vows {cite:sabiq-fiqh-al-sunnah}."
  es: "La sadaqah, en el uso legal, es lo que se da buscando la recompensa; los juristas detallan sus preceptos en los capítulos de zakat y votos {cite:sabiq-fiqh-al-sunnah}."
  fr: "Dans l'usage juridique, la sadaqa est ce qui est donné en vue d'obtenir une récompense; les juristes détaillent ses règles dans les chapitres de la zakat et des vœux {cite:sabiq-fiqh-al-sunnah}."
  ur: "شرعی استعمال میں صدقہ وہ ہے جو ثواب کے لیے دیا جاتا ہے۔ فقہاء زکوٰۃ اور نذر کے ابواب میں اس کے احکام کو تفصیل سے بیان کرتے ہیں۔"
  tr: "İslami terminolojide, sadaka ödül aramak için verilir; fihihler bunun hükümlerini zekat ve yeminlerde ayrıntılı olarak belirtirler {atıf:sabiq-fiqh-al-sunnah}."
  id: "Dalam terminologi Islam, amal diberikan untuk mencari ganjaran; para ahli hukum merinci keputusannya dalam kitab zakat dan sumpah {cite:sabiq-fiqh-al-sunnah}."
