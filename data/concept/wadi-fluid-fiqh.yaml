label: { ar: "وَدْي", en: "Wadi (the thick white fluid after urine: its purity, ablution and bath)" }
summary:
  ar: "الودي في اللغة الماء الثخين الأبيض الذي يخرج في إثر البول أو عند حمل شيء ثقيل، ويُطلق أيضاً على صغار الفسيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629} ويفترق عن المني بأن المني يخرج عند الشهوة، والودي يعقب البول، وعن المذي بأن المذي رقيق يخرج عند الشهوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} وذهب جمهور الفقهاء إلى نجاسة الودي، وذهب الحنابلة إلى أن ما لا يؤكل لحمه نجس، وأما ما يؤكل لحمه فطاهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} ويجب إزالة الودي عند الحاجة بالماء أو بالأحجار، ويوجب خروجه الوضوء دون الغسل، عملاً بأثر ابن عباس، وخروجه ينقض الوضوء بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} ومن استيقظ ووجد بللاً وشك في كونه منياً أو ودياً أو غيره، فلا غسل عليه عند جمهور الفقهاء، وعند الشافعية يتخير بين ما يحتمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16633}"
  en: "Wadi in the lexical sense is the thick white fluid that comes after urine or on lifting a heavy weight; it also means the young palm shoots. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629} It differs from semen, which comes with desire, and from madhi, which is thin and comes with desire; wadi comes after urine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} Most jurists hold wadi impure, and the Hanbalis hold that what is not eaten is impure, while the flesh of the animal eaten is pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} It must be removed when needed, by water or stones, and its exit requires only ablution, not bathing, on the report of Ibn Abbas; its exit breaks the ablution by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} One who wakes with a wet mark and is unsure whether it is semen or wadi or something else is not bound to bathe, according to most jurists; the Shafi'is let him choose the rule that fits the probable one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16633}"
