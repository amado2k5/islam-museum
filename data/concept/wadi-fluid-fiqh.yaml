label: { ar: "وَدْي", en: "Wadi (the thick white fluid after urine: its purity, ablution and bath)", es: "Wadi (el líquido blanco y espeso que queda después de orinar: su pureza, ablución y baño)", fr: "Wadi (le liquide blanc épais après l'urine: sa pureté, son ablution et son bain)" }
summary:
  ar: "الودي في اللغة الماء الثخين الأبيض الذي يخرج في إثر البول أو عند حمل شيء ثقيل، ويُطلق أيضاً على صغار الفسيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629} ويفترق عن المني بأن المني يخرج عند الشهوة، والودي يعقب البول، وعن المذي بأن المذي رقيق يخرج عند الشهوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} وذهب جمهور الفقهاء إلى نجاسة الودي، وذهب الحنابلة إلى أن ما لا يؤكل لحمه نجس، وأما ما يؤكل لحمه فطاهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} ويجب إزالة الودي عند الحاجة بالماء أو بالأحجار، ويوجب خروجه الوضوء دون الغسل، عملاً بأثر ابن عباس، وخروجه ينقض الوضوء بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} ومن استيقظ ووجد بللاً وشك في كونه منياً أو ودياً أو غيره، فلا غسل عليه عند جمهور الفقهاء، وعند الشافعية يتخير بين ما يحتمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16633}"
  en: "Wadi in the lexical sense is the thick white fluid that comes after urine or on lifting a heavy weight; it also means the young palm shoots. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629} It differs from semen, which comes with desire, and from madhi, which is thin and comes with desire; wadi comes after urine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} Most jurists hold wadi impure, and the Hanbalis hold that what is not eaten is impure, while the flesh of the animal eaten is pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} It must be removed when needed, by water or stones, and its exit requires only ablution, not bathing, on the report of Ibn Abbas; its exit breaks the ablution by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} One who wakes with a wet mark and is unsure whether it is semen or wadi or something else is not bound to bathe, according to most jurists; the Shafi'is let him choose the rule that fits the probable one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16633}"
  es: "Wadi, en sentido léxico, es el líquido blanco y espeso que sale después de orinar o al levantar un peso pesado; también significa los brotes jóvenes de palma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629} Se diferencia del semen, que viene con el deseo, y del madhi, que es líquido y viene con el deseo; wadi viene después de orinar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} La mayoría de los juristas consideran que wadi es impuro, y los hanbalíes sostienen que lo que no se come es impuro, mientras que la carne del animal que se come es pura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} Debe eliminarse cuando sea necesario, con agua o piedras, y su salida requiere solo ablución, no baño, según el informe de Ibn Abbas; su salida rompe la ablución por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} Quien se despierta con una marca húmeda y no está seguro de si es semen, wadi u otra cosa, no está obligado a bañarse, según la mayoría de los juristas; los shafi'is le permiten elegir la regla que se ajuste a lo probable. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16633}"
  fr: "Le terme « wadi », au sens littéral, désigne le liquide blanc et épais qui s'écoule après la miction ou lors d'un effort physique intense; il désigne également les jeunes pousses de palmier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16629} Il se distingue du sperme, qui est lié au désir, et du « madhi », liquide fluide également lié au désir; le wadi s'écoule après la miction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} La plupart des juristes considèrent le wadi comme impur, tandis que les Hanbalites estiment que ce qui n'est pas consommé est impur, la chair de l'animal consommé étant pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16630} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} Il faut l'enlever si nécessaire, avec de l'eau ou des pierres, et son écoulement ne requiert que les ablutions, sans bain, selon Ibn Abbas; son écoulement annule les ablutions par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} Celui qui se réveille avec une marque humide et qui n'est pas sûr qu'il s'agisse de sperme, de wadi ou d'autre chose n'est pas tenu de se baigner, selon la plupart des juristes; les Shafi'ites le laissent choisir la règle qui correspond le mieux à l'hypothèse la plus probable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16633}"
