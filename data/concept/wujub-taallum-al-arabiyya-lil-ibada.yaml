issue:
  ar: "هل يجب على المسلم أن يتعلم من العربية ما تتوقف عليه عبادته؟"
  en: "Must a Muslim learn the Arabic that his worship depends on?"
  ur: "کیا مسلمان پر اتنی عربی سیکھنا لازم ہے جس پر اس کی عبادت موقوف ہے؟"
  fr: "Un musulman doit-il apprendre l'arabe dont dépend son culte ?"
  es: "¿Debe un musulmán aprender el árabe de que depende su culto?"
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-interim-concession-for-incapacity
    stance:
      ar: "الإتيان بغير العربية رخصة مؤقتة للعاجز، ومن قدر على تعلم العربية الواجبة لزمه."
      en: "Non-Arabic recitation or takbir is an interim concession for incapacity; one able to learn the required Arabic must do so."
      ur: "غیر عربی قراءت یا تکبیر عاجز کے لیے عارضی رخصت ہے؛ جو واجب عربی سیکھنے پر قادر ہو اس پر سیکھنا لازم ہے۔"
      fr: "La récitation ou le takbir en autre langue est une concession provisoire pour l'incapable ; qui peut apprendre l'arabe requis doit le faire."
      es: "La recitación o el takbir en otra lengua es una concesión provisional para el incapaz; quien pueda aprender el árabe requerido debe hacerlo."
    holders: [person/abu-yusuf-al-qadi, person/muhammad-ibn-al-hasan-al-shaybani, person/ala-al-din-al-kasani, person/ibn-abidin]
    summary:
      ar: "عند أبي يوسف ومحمد، وعلى الفتوى المعتمدة عند الحنفية بعد رجوع أبي حنيفة، لا تكون القراءة أو التكبير بغير العربية إلا رخصة مرحلية للعجز، فمن قدر على تعلم القراءة العربية الواجبة لزمه ذلك {cite:ablibrary-badai-sanai-kasani-p113 on al-Kasani p.113} {cite:ablibrary-badai-sanai-kasani-p131 on al-Kasani p.131} {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}."
      en: "For Abu Yusuf and Muhammad, and on the relied-upon Hanafi fatwa following Abu Hanifa's retraction, non-Arabic recitation or takbir is an interim concession only for incapacity, and one able to learn the required Arabic recitation must do so {cite:ablibrary-badai-sanai-kasani-p113 on al-Kasani p.113} {cite:ablibrary-badai-sanai-kasani-p131 on al-Kasani p.131} {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}."
      ur: "ابو یوسف اور محمد کے نزدیک، اور ابو حنیفہ کے رجوع کے بعد حنفیہ کے معتمد فتوے پر، غیر عربی میں قراءت یا تکبیر صرف عجز کی عارضی رخصت ہے، اور جو واجب عربی قراءت سیکھنے پر قادر ہو اس پر سیکھنا لازم ہے {cite:ablibrary-badai-sanai-kasani-p113 on al-Kasani p.113} {cite:ablibrary-badai-sanai-kasani-p131 on al-Kasani p.131} {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}۔"
      fr: "Pour Abu Yusuf et Muhammad, et selon la fatwa retenue chez les hanafites après la rétractation d'Abu Hanifa, la récitation ou le takbir en autre langue n'est qu'une concession provisoire pour l'incapacité, et qui peut apprendre la récitation arabe requise doit le faire {cite:ablibrary-badai-sanai-kasani-p113 on al-Kasani p.113} {cite:ablibrary-badai-sanai-kasani-p131 on al-Kasani p.131} {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}."
      es: "Para Abu Yusuf y Muhammad, y según la fatwa asumida entre los hanafíes tras la retractación de Abu Hanifa, la recitación o el takbir en otra lengua es solo una concesión provisional por incapacidad, y quien pueda aprender la recitación árabe requerida debe hacerlo {cite:ablibrary-badai-sanai-kasani-p113 on al-Kasani p.113} {cite:ablibrary-badai-sanai-kasani-p131 on al-Kasani p.131} {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}."
    sources: [source/ablibrary-badai-sanai-kasani-p113, source/ablibrary-badai-sanai-kasani-p131, source/islamweb-fatwa-111542]
  - tradition: sunni-maliki
    id: maliki-utmost-effort-to-learn-al-fatiha
    stance:
      ar: "على كل مكلف أن يبذل جهده في تعلم الفاتحة بالعربية."
      en: "Every legally responsible Muslim must exert utmost effort to learn al-Fatiha in Arabic."
      ur: "ہر مکلف پر لازم ہے کہ فاتحہ عربی میں سیکھنے میں پوری کوشش کرے۔"
      fr: "Tout musulman responsable doit déployer un effort extrême pour apprendre al-Fatiha en arabe."
      es: "Todo musulmán responsable debe esforzarse al máximo por aprender al-Fatiha en árabe."
    summary:
      ar: "ينقل مقال مجلة IIUCS عن حاشية الدسوقي على الشرح الكبير أن كل مكلف يجب عليه أن يبذل غاية جهده في تعلم الفاتحة بالعربية للصلاة {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi}."
      en: "The IIUCS Journal article quotes al-Dasuqi's Hashiya on the Sharh al-Kabir: every legally responsible Muslim is obligated to exert utmost effort to learn al-Fatiha in Arabic for prayer {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi}."
      ur: "IIUCS جرنل کا مقالہ دسوقی کے حاشیہ علی الشرح الکبیر سے نقل کرتا ہے کہ ہر مکلف پر واجب ہے کہ نماز کے لیے فاتحہ عربی میں سیکھنے میں انتہائی کوشش کرے {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi}۔"
      fr: "L'article de l'IIUCS Journal cite la Hashiya d'al-Dasuqi sur le Sharh al-Kabir : tout musulman responsable est tenu de déployer un effort extrême pour apprendre al-Fatiha en arabe pour la prière {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi}."
      es: "El artículo del IIUCS Journal cita la Hashiya de al-Dasuqi sobre el Sharh al-Kabir: todo musulmán responsable está obligado a esforzarse al máximo por aprender al-Fatiha en árabe para la oración {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi}."
    sources: [source/banglajol-iiucs-arabic-prayer-article-2681]
  - tradition: sunni-shafii
    id: shafii-learn-to-ones-ability-and-communal-duty
    stance:
      ar: "على كل مسلم تعلم ما يؤدي به الواجب بقدر طاقته، ويلزم واحداً من الجماعة تعلم العربية للخطبة فرض كفاية."
      en: "Every Muslim must learn Arabic to the extent of his ability to perform the obligation; for the sermon, one person of the congregation must learn it as a communal duty."
      ur: "ہر مسلمان پر اپنی طاقت کے مطابق واجب کی ادائیگی کے لیے عربی سیکھنا لازم ہے؛ خطبے کے لیے جماعت میں سے ایک کا سیکھنا فرض کفایہ ہے۔"
      fr: "Tout musulman doit apprendre l'arabe dans la mesure de ses moyens pour accomplir l'obligation ; pour le prône, un membre de l'assemblée doit l'apprendre comme devoir collectif."
      es: "Todo musulmán debe aprender árabe en la medida de su capacidad para cumplir la obligación; para el sermón, uno de la congregación debe aprenderlo como deber colectivo."
    holders: [person/al-shafii]
    summary:
      ar: "تذكر فتوى إسلام ويب رقم 111542 أن الإمام الشافعي يقرر أن على كل مسلم أن يتعلم من لسان العرب ما بلغته طاقته لأداء القراءة الواجبة وأذكار الصلاة {cite:islamweb-fatwa-111542 on the Shafi'i position}. وفي خطبة الجمعة، يذكر البيجوري في حاشيته، الصفحة 228، كما تنقله فتوى دار الإفتاء رقم 2711، أنه إذا لم يكن في الجماعة من يعرف العربية لزم واحداً منهم تعلمها فرض كفاية إن قدر، وإلا أثموا جميعاً وبطلت جمعتهم {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}."
      en: "IslamWeb Fatwa 111542 states that Imam al-Shafi'i holds that every Muslim must learn of the Arabic language to the extent of his ability in order to perform the obligatory recitation and the adhkar of prayer {cite:islamweb-fatwa-111542 on the Shafi'i position}. For the Friday sermon, al-Bayjuri in his Hashiya, p. 228, as Dar al-Ifta Fatwa 2711 quotes him, says that at least one person in a non-Arabic congregation is communally obligated to learn Arabic if able, or else all sin and their Friday prayer is invalid {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}."
      ur: "اسلام ویب فتویٰ 111542 بتاتا ہے کہ امام شافعی کے نزدیک ہر مسلمان پر لازم ہے کہ نماز کی واجب قراءت اور اذکار کی ادائیگی کے لیے اپنی طاقت کے مطابق عربی زبان سیکھے {cite:islamweb-fatwa-111542 on the Shafi'i position}۔ جمعہ کے خطبے کے بارے میں بیجوری اپنے حاشیہ صفحہ 228 میں، جیسا کہ دارالافتاء فتویٰ 2711 انہیں نقل کرتا ہے، کہتے ہیں کہ غیر عربی جماعت میں سے کم از کم ایک پر عربی سیکھنا فرض کفایہ ہے اگر قادر ہو، ورنہ سب گناہ گار ہوں گے اور ان کی نماز جمعہ باطل ہو گی {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}۔"
      fr: "La fatwa 111542 d'IslamWeb indique que l'imam al-Shafi'i tient que tout musulman doit apprendre de la langue arabe dans la mesure de ses moyens pour accomplir la récitation obligatoire et les adhkar de la prière {cite:islamweb-fatwa-111542 on the Shafi'i position}. Pour le prône du vendredi, al-Bayjuri, dans sa Hashiya, p. 228, tel que la fatwa 2711 de Dar al-Ifta le cite, dit qu'au moins une personne d'une assemblée non arabophone est tenue, comme devoir collectif, d'apprendre l'arabe si elle le peut, sinon tous pèchent et leur prière du vendredi est invalide {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}."
      es: "La fatwa 111542 de IslamWeb indica que el imán al-Shafi'i sostiene que todo musulmán debe aprender de la lengua árabe en la medida de su capacidad para cumplir la recitación obligatoria y los adhkar de la oración {cite:islamweb-fatwa-111542 on the Shafi'i position}. Para el sermón del viernes, al-Bayjuri, en su Hashiya, p. 228, tal como lo cita la fatwa 2711 de Dar al-Ifta, dice que al menos una persona de una congregación no arabófona está obligada, como deber colectivo, a aprender árabe si puede, o de lo contrario todos pecan y su oración del viernes es inválida {cite:dar-alifta-fatwa-2711 on al-Bayjuri p.228}."
    sources: [source/islamweb-fatwa-111542, source/dar-alifta-fatwa-2711]
  - tradition: sunni-hanbali
    id: hanbali-prayer-invalid-if-able-and-not-learned
    stance:
      ar: "من عجز عن الفاتحة بالعربية وجب عليه تعلمها، فإن لم يتعلمها وهو قادر بطلت صلاته."
      en: "One who cannot recite al-Fatiha in Arabic must learn it; if he fails while able, his prayer is invalid."
      ur: "جو فاتحہ عربی میں نہ پڑھ سکے اس پر سیکھنا لازم ہے؛ قدرت کے باوجود نہ سیکھے تو اس کی نماز باطل ہے۔"
      fr: "Qui ne peut réciter al-Fatiha en arabe doit l'apprendre ; s'il ne le fait pas alors qu'il le peut, sa prière est invalide."
      es: "Quien no puede recitar al-Fatiha en árabe debe aprenderla; si no lo hace pudiendo, su oración es inválida."
    holders: [person/ibn-qudama-al-maqdisi]
    summary:
      ar: "يذكر ابن قدامة في المغني، الجزء الأول، الصفحة 352، أن من لا يحسن قراءة الفاتحة بالعربية يجب عليه تعلمها، فإن لم يتعلمها مع القدرة فصلاته باطلة {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:banglajol-iiucs-arabic-prayer-article-2681 on the Hanbali position}."
      en: "Ibn Qudama in al-Mughni, vol. 1, p. 352, states that whoever cannot recite al-Fatiha in Arabic is obligated to learn it, and if he fails to learn it while able, his prayer is invalid {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:banglajol-iiucs-arabic-prayer-article-2681 on the Hanbali position}."
      ur: "ابن قدامہ المغنی جلد 1 صفحہ 352 میں لکھتے ہیں کہ جو فاتحہ عربی میں نہ پڑھ سکے اس پر اسے سیکھنا واجب ہے، اور اگر قدرت کے باوجود نہ سیکھے تو اس کی نماز باطل ہے {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:banglajol-iiucs-arabic-prayer-article-2681 on the Hanbali position}۔"
      fr: "Ibn Qudama, dans al-Mughni, vol. 1, p. 352, indique que celui qui ne peut réciter al-Fatiha en arabe est tenu de l'apprendre, et que s'il ne l'apprend pas alors qu'il le peut, sa prière est invalide {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:banglajol-iiucs-arabic-prayer-article-2681 on the Hanbali position}."
      es: "Ibn Qudama, en al-Mughni, vol. 1, p. 352, indica que quien no puede recitar al-Fatiha en árabe está obligado a aprenderla, y que si no la aprende pudiendo, su oración es inválida {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:banglajol-iiucs-arabic-prayer-article-2681 on the Hanbali position}."
    sources: [source/ketabonline-mughni-ibn-qudama-v1-p352, source/banglajol-iiucs-arabic-prayer-article-2681]
