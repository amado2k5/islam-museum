id: concept/wujub-taallum-al-arabiyya-lil-ibada
class: concept
kind: doctrine
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "وجوب تعلم العربية للعبادة عند المذاهب الأربعة"
  en: "The duty to learn Arabic for worship: the four Sunni schools"
  ur: "عبادت کے لیے عربی سیکھنے کی فرضیت: چاروں سنی مذاہب"
  fr: "Le devoir d'apprendre l'arabe pour le culte : les quatre écoles sunnites"
  es: "El deber de aprender árabe para el culto: las cuatro escuelas suníes"
summary:
  ar: "تنقل الصفحة قول المذاهب السنية الأربعة فيمن يعجز عن العربية في الصلاة: يجعل الحنفية، على قول صاحبي أبي حنيفة وما استقر عليه الفتوى بعد رجوعه، الإتيان بغير العربية رخصة عاجز يلزمه التعلم إن قدر، ويوجب المالكية السعي البالغ في تعلم الفاتحة، ويوجب الشافعية على كل مسلم تعلم ما يؤدي به الواجب، وتعلم واحد من الجماعة فرض كفاية لخطبة الجمعة، ويبطل الحنابلة صلاة من ترك تعلم الفاتحة وهو قادر."
  en: "The page gives the views of the four Sunni schools on one who cannot recite Arabic in prayer: the Hanafis, on the view of Abu Hanifa's two companions and the relied-upon fatwa after his retraction, make non-Arabic recitation a concession for the unable who must learn if he can; the Malikis oblige utmost effort to learn al-Fatiha; the Shafi'is oblige every Muslim to learn what performs the obligation, and one person of the congregation to learn Arabic for the Friday sermon as a communal duty; and the Hanbalis hold the prayer invalid of one who fails to learn al-Fatiha while able."
  ur: "صفحہ چاروں سنی مذاہب کے اقوال نقل کرتی ہے اس شخص کے بارے میں جو نماز میں عربی نہ پڑھ سکے: حنفیہ، ابو حنیفہ کے دونوں شاگردوں کے قول اور ان کے رجوع کے بعد معتمد فتوے کے مطابق، غیر عربی کو عاجز کی رخصت بتاتے ہیں جس پر قدرت ہو تو سیکھنا لازم ہے؛ مالکیہ فاتحہ سیکھنے میں پوری کوشش واجب کرتے ہیں؛ شافعیہ ہر مسلمان پر واجب کی ادائیگی کے لیے درکار عربی سیکھنا اور جمعہ کے خطبے کے لیے جماعت میں سے ایک کا سیکھنا فرض کفایہ بتاتے ہیں؛ اور حنابلہ قدرت کے باوجود فاتحہ نہ سیکھنے والے کی نماز باطل کہتے ہیں۔"
  fr: "La page donne les avis des quatre écoles sunnites sur celui qui ne peut réciter l'arabe dans la prière : les hanafites, dans l'avis des deux compagnons d'Abu Hanifa et la fatwa retenue après sa rétractation, font de la récitation non arabe une concession pour l'incapable, qui doit apprendre s'il le peut ; les malikites imposent l'effort extrême pour apprendre al-Fatiha ; les chaféites imposent à tout musulman d'apprendre ce qui accomplit l'obligation, et à un membre de l'assemblée d'apprendre l'arabe pour le prône du vendredi comme devoir collectif ; et les hanbalites tiennent pour invalide la prière de qui n'apprend pas al-Fatiha alors qu'il le peut."
  es: "La página da las opiniones de las cuatro escuelas suníes sobre quien no puede recitar árabe en la oración: los hanafíes, en la opinión de los dos compañeros de Abu Hanifa y la fatwa asumida tras su retractación, hacen de la recitación no árabe una concesión para el incapaz, que debe aprender si puede; los malikíes imponen el máximo esfuerzo para aprender al-Fatiha; los shafi'íes imponen a todo musulmán aprender lo que cumple la obligación, y a uno de la congregación aprender árabe para el sermón del viernes como deber colectivo; y los hanbalíes tienen por inválida la oración de quien no aprende al-Fatiha pudiendo."
