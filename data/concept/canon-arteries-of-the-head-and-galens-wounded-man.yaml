id: concept/canon-arteries-of-the-head-and-galens-wounded-man
class: concept
kind: scientific
label:
  ar: "شرايين الرأس وقصة المجروح في الحلق عند ابن سينا"
  en: "The arteries of the head and the man wounded in the throat in the Canon"
  fr: "Artères de la tête et blessé à la gorge de Galien dans le Canon"
  ur: "قانون میں سر کی شریانیں اور گلے کے زخمی کا قصہ"
  es: "Las arterias de la cabeza y el hombre herido en la garganta en el Canon"
summary:
  ar: "يذكر ابن سينا شريان الصدغ والشريانين خلف الأذنين وما يفعل بها من الفصد والبتر والسل والكي، ثم يروي عن جالينوس حال مجروح في حلقه أصيب شريانه فاحتبس دمه بدواء {cite:canon-ibn-sina-print-v1 p.298}."
  en: "Ibn Sina names the artery of the temple and the two arteries behind the ears and what is done to them, opening, cutting, drawing out and cautery, then relates from Galen the case of a man wounded in the throat whose artery was struck and whose blood was stopped with a medicine {cite:canon-ibn-sina-print-v1 p.298}."
  fr: "Ibn Sina nomme l’artère temporale et les deux artères derrière les oreilles, puis leurs interventions : ouverture, section, extraction et cautérisation. Il rapporte de Galien le cas d’un homme blessé à la gorge dont une artère atteinte fut traitée par un remède arrêtant le sang {cite:canon-ibn-sina-print-v1 p.298}."
  es: "Ibn Sina nombra la arteria del templo y las dos arterias detrás de las orejas y lo que se hace con ellas, abrirlas, cortarlas, extraerlas y cauterizarlas, luego relata de Galeno el caso de un hombre herido en la garganta cuya arteria fue golpeada y cuya hemorragia se detuvo con un medicamento {cite:canon-ibn-sina-print-v1 p.298}."
  ur: "ابن سینا نے بیت المال کی شریانوں اور کانوں کے پیچھے کی دو شریانوں کا نام بتایا ہے اور ان کے ساتھ کیا کیا جاتا ہے، کھولنا، کاٹنا، نکالنا اور احتیاط کرنا، پھر گیلن سے ایک ایسے شخص کا واقعہ بیان کیا ہے جو گلے میں زخمی ہوا تھا جس کی شریان میں ضرب لگ گئی تھی اور اس کا خون دوائی سے بند ہو گیا تھا۔"
