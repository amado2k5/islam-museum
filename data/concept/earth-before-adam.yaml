id: concept/earth-before-adam
class: concept
kind: term
label: { ar: "من سكن الأرض قبل آدم", en: "Who held the earth before Adam", ur: "آدم سے پہلے زمین پر کون آباد تھا", es: "¿Quién sostenía la tierra antes de Adán?", fr: "Qui tenait la terre avant Adam ?" }
summary:
  ar: "سؤال الملائكة عن جعل خليفة في الأرض [[passage/quran-2-30|البقرة 30]] فتح بابًا في التفسير: روى الطبري عن ابن عباس أن الجن أول من سكن الأرض فأفسدوا وسفكوا الدماء فبعث الله إليهم إبليس في جند من الملائكة، ولم يعتمد الطبري هذا الخبر لأنه لم يجد فيه حجة قاطعة {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}؛ وأورده ابن كثير والقرطبي ضمن أقوال أخرى، منها أن الملائكة علمت من الله أو استنتجت من معنى الخلافة {cite:tafsir-ibn-kathir-alexandria-024188 pp. 70-71} {cite:jami-ahkam-quran-alam-kutub-bukhari pp. 274-275}."
  en: "The angels' question about a vicegerent on earth [[passage/quran-2-30|al-Baqara 30]] opened a line of exegesis: al-Tabari transmits from Ibn Abbas that the jinn were the first to dwell on earth, spread corruption and shed blood, so God sent Iblis with an army of angels against them; al-Tabari did not adopt the report because he found no conclusive proof for it {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}. Ibn Kathir and al-Qurtubi set it among other explanations, among them that the angels were told by God or inferred it from the meaning of vicegerency {cite:tafsir-ibn-kathir-alexandria-024188 pp. 70-71} {cite:jami-ahkam-quran-alam-kutub-bukhari pp. 274-275}."
  ur: "فرشتوں کا زمین میں خلیفہ بنانے پر سوال [[passage/quran-2-30|البقرہ 30]] تفسیر میں ایک باب کھول گیا: طبری ابن عباس سے روایت کرتے ہیں کہ زمین پر سب سے پہلے جن آباد ہوئے، انہوں نے فساد کیا اور خون بہایا، تو اللہ نے ابلیس کو فرشتوں کے لشکر کے ساتھ ان پر بھیجا؛ طبری نے اس روایت کو اختیار نہیں کیا کیونکہ ان کے نزدیک اس پر کوئی قطعی دلیل نہ تھی {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}۔ ابن کثیر اور قرطبی اسے دوسری توجیہات کے ساتھ ذکر کرتے ہیں، جن میں یہ بھی ہے کہ فرشتوں کو اللہ نے بتایا تھا یا انہوں نے خلافت کے معنی سے اندازہ لگایا {cite:tafsir-ibn-kathir-alexandria-024188 pp. 70-71} {cite:jami-ahkam-quran-alam-kutub-bukhari pp. 274-275}۔"
  es: "La pregunta de los ángeles acerca de un vicerregente en la tierra [[passage/quran-2-30|al-Baqara 30]] abrió una línea de exégesis: al-Tabari transmite de Ibn Abbas que los jinn fueron los primeros en habitar la tierra, propagar la corrupción y derramar sangre, por lo que Dios envió a Iblis con un ejército de ángeles contra ellos; al-Tabari no adoptó el relato porque no encontró pruebas concluyentes para ello {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}. Ibn Kathir y al-Qurtubi lo establecieron entre otras explicaciones, entre ellas que los ángeles fueron informados por Dios o lo infirieron del significado de vicerregencia {cite:tafsir-ibn-kathir-alexandria-024188 pp. 70-71} {cite:jami-ahkam-quran-alam-kutub-bukhari pp. 274-275}."
  fr: "La question des anges concernant un vicaire sur terre [[passage/quran-2-30|al-Baqara 30]] a ouvert une ligne d'exégèse: al-Tabari transmet d'Ibn Abbas que les djinns furent les premiers à habiter sur terre, à répandre la corruption et à verser le sang, et que Dieu envoya donc Iblis avec une armée d'anges contre eux; al-Tabari n'a pas adopté ce récit car il n'y a trouvé aucune preuve concluante {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}. Ibn Kathir et al-Qurtubi l'ont inclus parmi d'autres explications, parmi lesquelles le fait que les anges aient été informés par Dieu ou l'aient déduit de la signification de la vice-gérance {cite:tafsir-ibn-kathir-alexandria-024188 pp. 70-71} {cite:jami-ahkam-quran-alam-kutub-bukhari pp. 274-275}."
