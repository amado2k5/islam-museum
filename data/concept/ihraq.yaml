id: concept/ihraq
class: concept
kind: legal
label: { ar: "إحراق", en: "Burning (ihraq)" }
summary:
  ar: "الإحراق في الاستعمال الفقهي إذهاب النار الشيء بالكلية، أو تأثيرها فيه مع بقائه كالكي والشيّ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764} وإذا أصابت الأرض نجاسة فجفت بالشمس أو النار وذهب أثرها جازت الصلاة مكانها عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1765} والاستصباح بشحوم الميتة لا يجوز عند الحنابلة وظاهر الرواية عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1766} وكل ما أحرق حتى صار رماداً لا يجوز التيمم به بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1767} وفي الصلاة على المحترق المترمد خلاف، فجوّزها ابن حبيب والحنابلة وبعض الشافعية، ومنعها الحنفية وجمهور الشافعية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1768}"
  en: "In jurists' usage ihraq is the fire's removing a thing entirely, or its effect on a thing while it remains, as in branding and roasting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764} If ground stained with an impurity is dried by sun or fire and its trace is gone, prayer on it is lawful according to the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1765} Using the fat of carrion to light a lamp is forbidden according to the Hanbalis and the apparent Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1766} Whatever is burnt to ash may not be used for tayammum, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1767} On praying over a body burnt beyond washing the jurists differ: Ibn Habib, the Hanbalis and some Shafi'is allow it, while the Hanafis, most Shafi'is and the Malikis forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1768}"
