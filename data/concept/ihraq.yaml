id: concept/ihraq
class: concept
kind: legal
label: { ar: "إحراق", en: "Burning (ihraq)", es: "Quema (ihraq)", fr: "Incendie (ihraq)", ur: "جلنا ⁦(احراق)⁩", tr: "Yanma", id: "Pembakaran" }
summary:
  ar: "الإحراق في الاستعمال الفقهي إذهاب النار الشيء بالكلية، أو تأثيرها فيه مع بقائه كالكي والشيّ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764} وإذا أصابت الأرض نجاسة فجفت بالشمس أو النار وذهب أثرها جازت الصلاة مكانها عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1765} والاستصباح بشحوم الميتة لا يجوز عند الحنابلة وظاهر الرواية عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1766} وكل ما أحرق حتى صار رماداً لا يجوز التيمم به بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1767} وفي الصلاة على المحترق المترمد خلاف، فجوّزها ابن حبيب والحنابلة وبعض الشافعية، ومنعها الحنفية وجمهور الشافعية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1768} وفي مال الغال: لا يحرق الحيوان ولا ثيابه التي عليه ولا سلاحه ولا نفقته، ولا يحرق المال المغلول من الغنيمة، وما لم يُحرق يبقى على ملك صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777}"
  en: "In jurists' usage ihraq is the fire's removing a thing entirely, or its effect on a thing while it remains, as in branding and roasting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764} If ground stained with an impurity is dried by sun or fire and its trace is gone, prayer on it is lawful according to the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1765} Using the fat of carrion to light a lamp is forbidden according to the Hanbalis and the apparent Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1766} Whatever is burnt to ash may not be used for tayammum, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1767} On praying over a body burnt beyond washing the jurists differ: Ibn Habib, the Hanbalis and some Shafi'is allow it, while the Hanafis, most Shafi'is and the Malikis forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1768} On the property of a concealer of booty: his animals, the clothing he wears, his weapon and his provisions are not burnt, nor is property taken from the booty; what is not burnt stays with its owner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777}"
  es: "En el uso de los juristas, ihraq es la eliminación total de una cosa por el fuego, o su efecto sobre una cosa mientras permanece, como en el marcado y el asado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764} Si el suelo manchado con una impureza se seca con el sol o el fuego y su rastro desaparece, la oración sobre él es lícita según los Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1765} Usar la grasa de la carroña para encender una lámpara está prohibido según los Hanbali y la aparente visión Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1766} Todo lo que se quema hasta convertirse en ceniza no puede usarse para tayammum, por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1767} Sobre la oración por un cuerpo quemado hasta quedar irreparable, los juristas discrepan: Ibn Habib, los hanbalíes y algunos shafi'ís lo permiten, mientras que los hanafíes, la mayoría de los shafi'ís y los malikíes lo prohíben. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1768} Sobre la propiedad de quien oculta el botín: sus animales, la ropa que lleva, su arma y sus provisiones no se queman, ni se toma propiedad del botín; lo que no se quema permanece con su dueño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777}"
  fr: "En jurisme, l'ihraq désigne l'action du feu de détruire complètement une chose, ou son effet sur une chose encore présente, comme lors du marquage au fer rouge ou du rôtissage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1764} Si un sol souillé d'une impureté est séché par le soleil ou le feu et que toute trace de cette impureté a disparu, la prière sur ce sol est licite selon l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1765} L'utilisation de la graisse de charogne pour allumer une lampe est interdite selon l'école hanbalite et l'avis apparent de l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1766} Par consensus, tout ce qui est réduit en cendres ne peut être utilisé pour le tayammum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1767} Concernant la prière sur un corps brûlé au point de ne plus pouvoir être lavé, les juristes divergent: Ibn Habib, les Hanbalites et certains Shafi'ites l'autorisent, tandis que les Hanafites, la plupart des Shafi'ites et les Malikites l'interdisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1768} Concernant les biens du receleur de butin: ses animaux, ses vêtements, son arme et ses provisions ne sont pas brûlés, et aucun bien du butin n'est soustrait; ce qui n'est pas brûlé reste à son propriétaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1777}"
  ur: "فقہا کے استعمال میں احراق کا مطلب ہے آگ کا کسی چیز کو مکمل طور پر ہٹا دینا، یا کسی چیز پر اس کا اثر باقی رہ جانے کی طرح ہے جیسا کہ برانڈنگ اور بھوننے میں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص1764} اگر نجاست سے داغ دار زمین سورج یا آگ سے خشک ہو جائے اور اس کا نشان ختم ہو جائے تو احناف کے نزدیک اس پر نماز جائز ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص1765} چراغ جلانے کے لیے مردار کی چربی کا استعمال حنبلی اور ظاہری حنفی مسلک کے مطابق حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1766} جو کچھ جل کر راکھ ہو جائے وہ تیمم کے لیے استعمال نہیں کیا جا سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص1767} دھونے کے علاوہ جلے ہوئے جسم پر نماز پڑھنے میں فقہاء کا اختلاف ہے: ابن حبیب، حنبلی اور بعض شافعی اس کی اجازت دیتے ہیں جبکہ حنفیہ، اکثر شافعی اور مالکیہ اس سے منع کرتے ہیں۔ مالِ غنیمت چھپانے والے کے مال پر: اس کے جانور، جو لباس وہ پہنتا ہے، اس کا ہتھیار اور اس کے سامان کو جلایا نہیں جاتا اور نہ ہی مال غنیمت میں سے کوئی چیز لی جاتی ہے۔ جو نہیں جلتا وہ اپنے مالک کے پاس رہتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1777}"
  tr: "Fıkıh kullanımında yakmak, ateşin veya üzerindeki etkisinin tamamen ortadan kaldırılması demektir; o duman ve ateş olarak kalmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1764} Eğer toprak kirlenip güneş veya ateşle kuruyur ve etkisi kaybolursa, namaz Hanefilere göre geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1765} Hanbalilere göre ölü yağlı istishbah yasaktır, görünürdeki rivayet ise Hanefilere göredir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1766} Kül olana kadar yanan her şey, onunla oybirliğiyle teyammum yapmak yasaktır. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1767} Dinden dönmüş yakılan kişi için yapılan dua konusunda bir anlaşmazlık vardır; İbn Habib, Hanbaliler ve bazı Şafiiler buna izin verirken, Hanefiler, Şafiilerin çoğunluğu ve Malikiler bunu yasaklamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1768} Değerli mallarla ilgili olarak: hayvanlar veya giysileri, silahları veya masrafları yakılamaz, bağlı mal yakılmaz; yakılmayan mal sahibi olarak kalır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1777}"
  id: "Dalam penggunaan hukum, membakar berarti menghilangkan api sepenuhnya atau efeknya saat api tetap menjadi asap dan api. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1764} Jika bumi menjadi tidak murni dan kering oleh matahari atau api dan efeknya hilang, doa tersebut sah menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1765} Istishbah dengan lemak mati tidak diperbolehkan menurut Hanbali, dan narasi yang tampak menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1766} Apa pun yang dibakar hingga menjadi abu tidak diperbolehkan melakukan tayammum dengan nama itu secara konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1767} Mengenai doa untuk orang yang terbakar yang telah murtad, terdapat perselisihan, yang diizinkan oleh Ibn Habib, Hanbali, dan beberapa Shafi'i, sementara Hanafi, mayoritas Shafi'i, dan Malikis melarangnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1768} Mengenai harta benda berharga: hewan atau pakaian, senjata, atau pengeluaran mereka tidak boleh dibakar, dan harta yang terikat tidak boleh dibakar; apa yang tidak dibakar tetap menjadi milik pemilik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1777}"
