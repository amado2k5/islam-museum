id: concept/mushaf-illumination-and-sura-headings
class: concept
kind: art_form
label: { ar: "زخرفة المصحف وعناوين السور وفواصل الأجزاء", en: "Illumination, sura headings and divisions of the mushaf", ur: "مصحف کی آرائش، سورتوں کے عنوان اور اجزا کی علامات", es: "Iluminación, títulos de sura y divisiones del mushaf.", fr: "Illumination, titres de sourates et divisions du mushaf", tr: "Kur'an süslemeleri, surelerin başlıkları ve bölüm araları", id: "Dekorasi Al-Quran, judul surah, dan jeda bagian" }
summary:
  ar: "في المصحف أدوات زخرفية تبرز عناوين السور وتضبط النص وتدلّ القارئ على موضع الوقف والسجدة وتقسيم الأجزاء؛ ومن القرن الثامن حملت مصاحف الخط الحجازي عناوين مزخرفة للسور، وبعد القرن العاشر أضيفت أوسمة مزخرفة في الهوامش {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 65} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 66}."
  en: "A mushaf carries ornamental devices that highlight the headings of suras, mark the text, and cue the reciter where to pause, prostrate or keep count; as early as the eighth century Qur'ans in hijazi script had decorated sura headings, and after the tenth century illuminated medallions were added in the margins {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 65} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 66}."
  ur: "مصحف میں ایسی آرائشی علامات ہوتی ہیں جو سورتوں کے عنوان نمایاں کرتی، متن کو مرتب کرتی اور قاری کو وقف، سجدے اور گنتی کے مقام کی نشان دہی کرتی ہیں؛ آٹھویں صدی ہی سے حجازی خط کے قرآنوں میں سورتوں کے آراستہ عنوان تھے، اور دسویں صدی کے بعد حاشیوں میں مذہّب تمغے بڑھائے گئے {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 65} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 66}۔"
  es: "Un mushaf lleva elementos ornamentales que resaltan los títulos de las suras, marcan el texto e indican al recitador dónde hacer pausas, postrarse o contar; ya en el siglo VIII, los Coranes en escritura hijazi tenían títulos de suras decorados, y después del siglo X se añadieron medallones iluminados en los márgenes {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 65} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 66}."
  fr: "Un mushaf comporte des éléments ornementaux qui mettent en évidence les titres des sourates, marquent le texte et indiquent au récitant où faire une pause, se prosterner ou compter; dès le VIIIe siècle, les Corans en écriture hijazi avaient des titres de sourates décorés, et après le Xe siècle, des médaillons enluminés ont été ajoutés dans les marges {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 65} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 66}."
  tr: "Kur'an, surelerin başlıklarını vurgulayan, metni belirleyen ve okuyucunun duraklama, secde ve bölüm ayrımı yerini gösteren dekoratif araçlar içerir; sekizinci yüzyıldan itibaren Hicaz yazısıyla yazılmış Kur'anlarda sureler için süslü başlıklar bulunurken, onuncu yüzyıldan sonra kenar boşluklarına dekoratif madalyalar eklendi {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 65} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 66}."
  id: "Al-Qur'an berisi alat dekoratif yang menyoroti judul surah, menetapkan teks, dan menunjukkan tempat pembaca berhenti, sujud, dan pembagian bagian; sejak abad kedelapan, Al-Qur'an aksara Hijazi memuat judul dekoratif untuk surah, dan setelah abad kesepuluh, medali dekoratif ditambahkan di margin {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 65} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 66}."
