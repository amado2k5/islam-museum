id: concept/radd-fiqh
class: concept
kind: legal
label:
  ar: "الرد"
  en: "Radd (return and restitution): of goods to their owner, of a contract, of a witness, and of an oath"
  ur: "رد"
summary:
  ar: "الرد في اللغة الصرف والإرجاع والمنع، ويطلق في الفقه على إرجاع الشيء إلى صاحبه أو مستحقه، وعلى فسخ العقد في حالات مختلفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8698} ويجب رد الشيء المستحق للغير، ويجب رد المال المغصوب أو المسروق فورا، ويجوز الرد في العقود غير اللازمة بالفسخ، وفي العقد الباطل بطلانا، والفاسد عند الحنفية يُفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8699} ويسقط الرد بتصحيح العقد، أو بتجديده، أو بسقوط الخيار، ويختلف الفقهاء في تصحيح العقد الفاسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8700} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8701} ويفرق الحنفية بين الرد بالقضاء والرد بالتراضي، ولا يفرق الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8701} ويجب رد مال المحجور عليه بعد البلوغ والرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} وفي الشهادة الأصل ردها عند الريبة والتهمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} وفي اليمين إذا نكل المدعى عليه يختلف الفقهاء: هل يحكم القاضي بالنكول، أو يرد اليمين على المدعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8703} ومن أخذ مال غيره بغير حق وجب عليه رده، فإن هلك وجب المثل أو القيمة، وعند الحنفية لا يضمن السارق المقطوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8703} وتكون مؤنة الرد على من وجب عليه الرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8704}"
  en: "Radd in the lexicon is turning back, refusal and sending back; in law it means returning a thing to its owner or rightful holder, and in several cases the annulment of a contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8698} The property of another must be returned at once when taken unlawfully; in non-binding contracts a return is by annulment, and a void contract is undone, while the Hanafis annul a defective one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8699} A return is lost by correcting the contract, by renewing it, or by the loss of an option; the jurists differ on correcting a defective contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8700} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8701} The Hanafis distinguish a return by judgment from a return by agreement, while the majority do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8701} The property of a ward is returned at maturity and sound judgment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} A witness's testimony is set aside on suspicion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} When the defendant refuses the oath, the jurists differ on whether the judge decides against him or refers the oath to the claimant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8703} For goods taken unlawfully the return is compulsory; if they are lost, the like or the value is due. The Hanafis hold a thief who has been punished owes no damages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8703} The cost of return falls on the one who must return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8704}"
  ur: "رد لغت میں لوٹانا ہے، اور فقہ میں کسی چیز کو اس کے مالک کی طرف لوٹانا، یا کسی تصرف کو ختم کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8698} ناجائز طور پر لیا گیا مال فوراً واپس کرنا لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8703}"
