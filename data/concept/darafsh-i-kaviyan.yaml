  en: "The leather standard raised against al-Dahhak by Afridun's host — 'darafsh' glossed in Old Persian as the banner, the outspread, the flag {cite:muruj-al-dhahab p. 439-440}."
  es: "El estandarte de cuero alzado contra al-Dahhak por el ejército de Afridun — 'darafsh', traducido en persa antiguo como estandarte, bandera extendida, bandera {cite:muruj-al-dhahab p. 439-440}."
  fr: "L'étendard en cuir levé contre al-Dahhak par l'armée d'Afridun — 'darafsh' glosé en vieux persan comme la bannière, l'étendard déployé, le drapeau {cite:muruj-al-dhahab p. 439-440}."
