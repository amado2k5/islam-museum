summary:
  ar: "دخان جوهر أرضي لطيف، أقواه دخان القطران ثم الزفت الرطب ثم الميعة ثم المرّ ثم الكندر ثم البطم. {cite:canon-ibn-sina-print-v1 p.441}"
  en: "Smoke is a fine earthy substance; the strongest are the smoke of tar, then moist pitch, storax, myrrh, frankincense and terebinth. {cite:canon-ibn-sina-print-v1 p.441}"
  ur: "دھواں ایک باریک زمینی مادہ ہے؛ سب سے طاقتور قطران کا دھواں ہے، پھر تر زفت، میعہ، مر، کندر اور بطم کا۔ {cite:canon-ibn-sina-print-v1 p.441}"
  es: "El humo es una sustancia terrosa y fina; los más fuertes son el humo del alquitrán, seguido del de la brea húmeda, el estoraque, la mirra, el incienso y el terebinto. {cite:canon-ibn-sina-print-v1 p.441}"
  fr: "La fumée est une substance fine et terreuse; les plus fortes sont la fumée du goudron, puis celle du brai humide, du storax, de la myrrhe, de l’encens et du térébinthe. {cite:canon-ibn-sina-print-v1 p.441}"
  tr: "Duman nazik topraksı bir özdür, en güçlüsü katran dumanı, sonra ıslak asfalt, sonra sıvı, sonra mir, sonra kandar, sonra popo. {cite:canon-ibn-sina-print-v1 s.441}"
  id: "Asap adalah esensi tanah yang lembut, yang terkuat adalah asap tar, lalu aspal basah, kemudian cair, kemudian mur, kemudian kandar, kemudian pantat. {cite:canon-ibn-sina-print-v1 hlm.441}"
