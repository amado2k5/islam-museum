label:
  ar: "المخضرم"
  en: "Mukhadram (one who straddled the Jahiliyya and Islam)"
summary:
  ar: "المخضرم في اصطلاح أهل الحديث من أدرك الجاهلية وزمن النبي وأسلم ولم يره ولا صحبة له، فهو من التابعين، وأحاديثهم مرسلة. وفي اصطلاح أهل اللغة من عاش نصف عمره في الجاهلية ونصفه في الإسلام، أدرك الصحبة أم لا، فبين الاصطلاحين عموم وخصوص من وجه. واختُلف في اشتقاقه: من «اللحم المخضرم» الذي لا يُدرى أذكر هو أم أنثى، أو من الخضرمة بمعنى القطع، أو من «الإبل المخضرمة» المنتجة من العراب واليمانية. وعدّ مسلم منهم عشرين نفساً، وهم أكثر {cite:tadrib-rawi-awwama-v5 p. 248-254}."
  en: "In hadith terminology a mukhadram is one who lived through the Jahiliyya and the Prophet's lifetime and accepted Islam without seeing him or having companionship; he is a Successor, and the hadiths of such men are mursal. In the usage of the lexicographers it is one who lived half his life in the Jahiliyya and half in Islam, whether or not he was a Companion, so the two senses overlap only in part. Its derivation is disputed: from 'mukhadram meat' whose sex cannot be told, from khadrama 'cutting', or from 'mukhadram camels' bred from Arabian and Yemeni stock. Muslim counted twenty of them, and there are more."
