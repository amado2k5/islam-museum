id: concept/mukhadram
class: concept
kind: term
label:
  ar: "المخضرم"
  en: "Mukhadram (one who straddled the Jahiliyya and Islam)"
  es: "Mukhadram (aquel que se situó entre la época preislámica y el Islam)"
  fr: "Mukhadram (celui qui se situait à la croisée de la Jahiliyya et de l'Islam)"
  ur: "مخدرم ⁦(وہ جس نے جاہلیت اور اسلام کو گھیر لیا)⁩"
summary:
  ar: "المخضرم في اصطلاح أهل الحديث من أدرك الجاهلية وزمن النبي وأسلم ولم يره ولا صحبة له، فهو من التابعين، وأحاديثهم مرسلة. وفي اصطلاح أهل اللغة من عاش نصف عمره في الجاهلية ونصفه في الإسلام، أدرك الصحبة أم لا، فبين الاصطلاحين عموم وخصوص من وجه. واختُلف في اشتقاقه: من «اللحم المخضرم» الذي لا يُدرى أذكر هو أم أنثى، أو من الخضرمة بمعنى القطع، أو من «الإبل المخضرمة» المنتجة من العراب واليمانية. وعدّ مسلم منهم عشرين نفساً، وهم أكثر {cite:tadrib-rawi-awwama-v5 p. 248-254}."
  en: "In hadith terminology a mukhadram is one who lived through the Jahiliyya and the Prophet's lifetime and accepted Islam without seeing him or having companionship; he is a Successor, and the hadiths of such men are mursal. In the usage of the lexicographers it is one who lived half his life in the Jahiliyya and half in Islam, whether or not he was a Companion, so the two senses overlap only in part. Its derivation is disputed: from 'mukhadram meat' whose sex cannot be told, from khadrama 'cutting', or from 'mukhadram camels' bred from Arabian and Yemeni stock. Muslim counted twenty of them, and there are more."
  es: "En la terminología del hadiz, un mukhadram es aquel que vivió durante la época preislámica (Jahiliyya) y la vida del Profeta, y aceptó el Islam sin haberlo conocido ni haber tenido compañía con él; es un Sucesor, y los hadices de tales hombres son mursal. En el uso de los lexicógrafos, se refiere a aquel que vivió la mitad de su vida en la época preislámica y la otra mitad en el Islam, independientemente de si fue o no Compañero, por lo que ambos significados se superponen solo parcialmente. Su etimología es objeto de debate: de «mukhadram», carne cuyo sexo no se puede determinar; de «khadrama», «corte»; o de «mukhadram», camellos criados a partir de razas árabes y yemeníes. Muslim contabilizó veinte de ellos, y existen más."
  fr: "Dans la terminologie des hadiths, un mukhadram est celui qui a vécu durant la Jahiliyya et le temps du Prophète, et qui s'est converti à l'islam sans l'avoir rencontré ni avoir été son compagnon; il est un Successeur, et les hadiths le concernant sont mursal. Selon l'usage des lexicographes, il désigne celui qui a passé la moitié de sa vie dans la Jahiliyya et l'autre moitié en islam, qu'il ait été ou non un Compagnon; les deux sens ne se recoupent donc que partiellement. Son étymologie est controversée: elle pourrait provenir de « mukhadram meat » (viande de mukhadram dont le sexe est indéterminé), de « khadrama » (découpe), ou encore de « mukhadram camels » (chameaux de race arabe et yéménite). Muslim en a dénombré vingt, et il y en a davantage."
  ur: "حدیث کی اصطلاح میں مخدرم اسے کہتے ہیں جس نے جاہلیت اور رسول اللہ کی زندگی گزاری ہو اور اسے دیکھے بغیر یا صحبت کیے بغیر اسلام قبول کیا ہو۔ وہ جانشین ہے اور ایسے آدمیوں کی احادیث مرسل ہیں۔ لغت نگاروں کے استعمال میں وہ ہے جس نے اپنی آدھی زندگی جاہلیت میں اور آدھی اسلام میں گزاری، خواہ وہ صحابی ہو یا نہ ہو، لہٰذا دونوں حواس ایک دوسرے سے ملتے ہیں۔ اس کا مشتق متنازعہ ہے: 'مخدرم گوشت' سے جس کی جنس نہیں بتائی جا سکتی ہے، خدام 'کاٹنے' سے، یا عربی اور یمنی اسٹاک سے پالے گئے 'مخدرم اونٹ' سے۔ مسلمانوں نے ان میں سے بیس کی گنتی کی، اور زیادہ ہیں۔"
