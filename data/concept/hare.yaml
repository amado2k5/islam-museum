label:
  ar: "الأرنب"
  en: "The hare"
  ur: "خرگوش"
  es: "La liebre"
  fr: "Le lièvre"
  tr: "Tavşan"
  id: "Kelinci"
summary:
  ar: "قضى عمر في الأرنب يقتله المحرم بعناق: صغير البرية له فدية عند أهل العلم، والأرنب صيد مباح مأكول عند جمهورهم."
  en: "Umar ruled a young she-kid in compensation for the hare killed in ihram — the smallest of the wild has a ransom with the scholars, and the hare is lawful game to eat for most of them."
  ur: "عمر نے احرام میں مارے گئے خرگوش کے بدلے بکری کا بچہ مقرر کیا — جنگل کے چھوٹے جانور کا بھی فدیہ ہے، اور اکثر علماء کے نزدیک خرگوش حلال شکار ہے۔"
  es: "Umar gobernó una joven hembra como compensación por la liebre que mató en estado de ihram; el animal salvaje más pequeño tiene un precio para los eruditos, y la liebre es una presa lícita para comer para la mayoría de ellos."
  fr: "Umar a accordé une jeune chevrette en compensation du lièvre tué en état d'ihram — le plus petit des animaux sauvages a droit à une rançon auprès des érudits, et le lièvre est un gibier licite à manger pour la plupart d'entre eux."
  tr: "Umar, hacı tarafından öldürülen tavşanla sarılarak vakit geçirmiştir: küçük yaratık bilginlere göre fidye almıştır ve tavşan çoğunluk tarafından yenilen bir oyundur."
  id: "Umar menghabiskan waktu bersama kelinci yang dibunuh oleh peziarah dengan pelukan: makhluk kecil itu mendapat tebusan menurut para cendekiawan, dan kelinci itu adalah buruan yang diperbolehkan dimakan oleh mayoritas mereka."
