label:
  ar: "العُسَيْلة"
  en: "Consummation required for a return to a divorced wife (usayla)"
  ur: "عسیلہ"
summary:
  ar: "العسيلة في اللغة النطفة أو ماء الرجل أو حلاوة الجماع، وهي كناية عن الجماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. واتفق الفقهاء على أن المطلقة ثلاثاً لا تحل لمطلقها حتى تنكح زوجاً غيره ثم يفارقها، ويشترط الفقهاء في الزواج الثاني الوطء في الفرج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. وأدنى ما يكفي من الوطء عند الفقهاء تغييب الحشفة مع الانتشار، ولم يشترط الحسن البصري الإنزال، وخالفه سائر الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}. وخالف سعيد بن المسيب في اشتراط الوطء، ثم رجع عنه إلى قول الجمهور بحسب ما نقله ابن عابدين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. وتفصيل ذلك في «تحليل» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}."
  en: "In the lexicon, usayla means a drop of semen, a man's water, or the sweetness of intercourse; the term is a euphemism for intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. The jurists agree that a woman divorced three times may not return to her former husband until she has married another man and he has separated from her, and that the second marriage must include consummation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. The least that suffices is the penetration of the glans with an erection; al-Hasan al-Basri also required emission, but the rest of the jurists disagreed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}. Sa'id ibn al-Musayyab dissented on the requirement of consummation and, according to Ibn Abidin, later returned to the majority view {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. Details are treated under «tahlil» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}."
