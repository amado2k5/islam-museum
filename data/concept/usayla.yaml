id: concept/usayla
class: concept
kind: legal
label:
  ar: "العُسَيْلة"
  en: "Consummation required for a return to a divorced wife (usayla)"
  ur: "عسیلہ"
  es: "Se requiere consumación para regresar con una esposa divorciada (usayla)."
  fr: "Consommation requise pour le retour auprès d'une épouse divorcée (usayla)"
  tr: "El-Asilah"
  id: "Al-Asilah"
summary:
  ar: "العسيلة في اللغة النطفة أو ماء الرجل أو حلاوة الجماع، وهي كناية عن الجماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. واتفق الفقهاء على أن المطلقة ثلاثاً لا تحل لمطلقها حتى تنكح زوجاً غيره ثم يفارقها، ويشترط الفقهاء في الزواج الثاني الوطء في الفرج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. وأدنى ما يكفي من الوطء عند الفقهاء تغييب الحشفة مع الانتشار، ولم يشترط الحسن البصري الإنزال، وخالفه سائر الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}. وخالف سعيد بن المسيب في اشتراط الوطء، ثم رجع عنه إلى قول الجمهور بحسب ما نقله ابن عابدين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. وتفصيل ذلك في «تحليل» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}."
  en: "In the lexicon, usayla means a drop of semen, a man's water, or the sweetness of intercourse; the term is a euphemism for intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. The jurists agree that a woman divorced three times may not return to her former husband until she has married another man and he has separated from her, and that the second marriage must include consummation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. The least that suffices is the penetration of the glans with an erection; al-Hasan al-Basri also required emission, but the rest of the jurists disagreed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}. Sa'id ibn al-Musayyab dissented on the requirement of consummation and, according to Ibn Abidin, later returned to the majority view {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. Details are treated under «tahlil» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}."
  es: "En el léxico, usayla significa una gota de semen, el agua de un hombre o la dulzura del coito; el término es un eufemismo para coito {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. Los juristas coinciden en que una mujer divorciada tres veces no puede regresar con su exmarido hasta que se haya casado con otro hombre y este se haya separado de ella, y que el segundo matrimonio debe incluir la consumación {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. Lo mínimo que basta es la penetración del glande con una erección; al-Hasan al-Basri también exigió la emisión, pero el resto de los juristas discreparon {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}. Sa'id ibn al-Musayyab discrepó sobre el requisito de consumación y, según Ibn Abidin, posteriormente volvió a la opinión mayoritaria {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. Los detalles se tratan en el apartado «tahlil» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}."
  fr: "Dans le lexique, « usayla » signifie une goutte de sperme, l'eau de l'homme ou la douceur de l'acte sexuel; ce terme est un euphémisme pour désigner l'acte sexuel lui-même (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11606). Les juristes s'accordent à dire qu'une femme divorcée trois fois ne peut retourner auprès de son ex-mari qu'après s'être remariée et que son ex-mari se soit séparé d'elle, et que ce second mariage doit être consommé (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11606). La pénétration du gland avec érection est le minimum requis; al-Hasan al-Basri exigeait également l'éjaculation, mais les autres juristes étaient d'un avis contraire (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11607). Sa'id ibn al-Musayyab a exprimé une opinion dissidente quant à l'exigence de consommation et, selon Ibn Abidin, est revenu par la suite à l'avis majoritaire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11606}. Les détails sont traités sous le terme « tahlil » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11607}."
  ur: "لغت میں usayla کا مطلب منی کا ایک قطرہ، مرد کا پانی، یا جماع کی مٹھاس ہے۔ یہ اصطلاح جماع کے لیے ایک خوش فہمی ہے۔ فقہاء اس بات پر متفق ہیں کہ تین بار طلاق دینے والی عورت اپنے سابقہ شوہر کے پاس اس وقت تک واپس نہیں جا سکتی جب تک کہ وہ کسی دوسرے مرد سے شادی نہ کر لے اور وہ اس سے علیحدگی اختیار نہ کر لے، اور دوسری شادی میں فقہ معسویہ کویتیہ نور v3 ص 11606 شامل ہونا ضروری ہے۔ کم از کم جو کافی ہے وہ ایک عضو تناسل کے ساتھ ہے؛ الحسن البصری نے بھی اخراج کا تقاضا کیا، لیکن باقی فقہاء نے اختلاف کیا {حوالہ: فقہ معسوۃ کویتیہ-نور-v3 صفحہ 11607}۔ سعید بن المسیب نے تکمیل کے تقاضے پر اختلاف کیا اور ابن عابدین کے مطابق بعد میں جمہور کے قول کی طرف لوٹ آئے۔ تفصیلات کا علاج «تہلیل» کے تحت کیا جاتا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11607}۔"
  tr: "'Asilah' dilinde 'meni' veya 'erkeğin suyu' ya da cinsel ilişkinin tatlılığı anlamına gelir; bu da cinsel ilişkiye bir metafordur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11606}. Hukukçular, üç kez boşanan bir kadının başka bir kocasıyla evlenip o koca ayrılana kadar izin verilmediği konusunda hemfikirdir. Hukukçular, ikinci evliliğin özel bölgelerinde cinsel ilişkiyi şart koşar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11606}. Hukukçular arasında cinsel ilişki için asgari gereklilik, yayılan başlığın olmamasıdır ve Al-Hasan al-Basri boşalma gerektirmezdi; diğer hukukçular buna katılmamıştır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11607}. Sa'id ibn al-Musayyib cinsel ilişki gerekliliği konusunda anlaşmazlık yaşadı, ardından İbn Abidin'in aktardığı şekilde çoğunluk görüşüne geri döndü {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11606}. Bununla ilgili ayrıntılar 'Tahleel'de {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11607}."
  id: "'Asilah' dalam bahasa berarti 'sperma' atau 'air pria itu' atau manisnya hubungan seksual, yang merupakan metafora untuk hubungan seksual {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11606}. Para ahli hukum sepakat bahwa wanita yang bercerai tiga kali tidak diperbolehkan baginya sampai dia menikah dengan suami lain dan kemudian suami itu berpisah darinya. Para ahli hukum mengharuskan hubungan seksual dalam bagian pribadi pernikahan kedua {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11606}. Persyaratan minimum untuk hubungan seksual di antara ahli hukum adalah tidak adanya kepala kepala saat penyebaran, dan Al-Hasan al-Basri tidak memerlukan ejakulasi, yang tidak disetujui oleh ahli hukum lain {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11607}. Sa'id ibn al-Musayyib tidak setuju mengenai persyaratan hubungan seksual, kemudian kembali ke pendapat mayoritas sesuai dengan apa yang disampaikan Ibn Abidin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11606}. Rincian tentang ini ada dalam 'Tahleel' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11607}."
