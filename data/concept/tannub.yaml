summary:
  ar: "تنوب في الكتاب شجرة معروفة، والفوفي ضرب منها، وبزره قضم قريش وقوته قابضة لطيفة الإسخان، ومنه يتخذ الزفت البري، وورقه ضماد للأورام الحارة، وورقه وبزره مع مواد أخرى ينفعان من القروح الظاهرة وجميع القروح الحارة والرطبة، وقشره موافق للجرح ذرورا، وورقه على الجراحات الطرية يمنع فسادها، ويتمضمض به وبطبيخه لوجع الأسنان، ودخانه يقع في أكحال العين، وبزره يعين على النفث وصمغه عظيم النفع من السعال المزمن جدا، وإن شرب عقل وأمسك البول {cite:canon-ibn-sina-print-v1 p.687}"
  en: "Tannub is in the book a well-known tree, of which fufi is a kind; its seed is qadm quraysh and its power is astringent and mildly heating, and wild pitch is made from it; its leaf is a poultice for hot swellings, its leaf and seed with other materials benefit outer ulcers and all hot and moist ulcers, its bark suits wounds as a dusting, its leaf on fresh wounds prevents their corruption, a gargle is made of it and of its decoction for toothache, its smoke enters eye salves, its seed helps bringing up phlegm from the chest, its resin is of great benefit for very chronic cough, and if drunk it binds and holds back urine {cite:canon-ibn-sina-print-v1 p.687}"
  ur: "تنوب کتاب میں ایک معروف درخت ہے، فوفی اس کی ایک قسم ہے؛ اس کا بیج قضم قریش ہے اور اس کی قوت قابض اور ہلکی گرم ہے، اور اس سے جنگلی زفت بنائی جاتی ہے؛ اس کا پتہ گرم ورموں کے لیے لیپ ہے، اس کا پتہ اور بیج دوسری اشیا کے ساتھ ظاہری قرحوں اور تمام گرم اور تر قرحوں میں نافع ہیں، اس کی چھال زخم کے لیے چھڑکنے کی صورت میں موافق ہے، اور اس کا پتہ تازہ زخموں پر ان کے بگاڑ کو روکتا ہے؛ اس سے اور اس کے جوشاندے سے دانتوں کے درد کے لیے غرارہ کیا جاتا ہے، اس کا دھواں آنکھ کے سرموں میں شامل ہوتا ہے، اس کا بیج سینے سے بلغم نکالنے میں مدد دیتا ہے اور اس کی گوند بہت پرانی کھانسی میں بڑا فائدہ دیتی ہے؛ اور پیا جائے تو روکتا ہے اور پیشاب کو بند کرتا ہے {cite:canon-ibn-sina-print-v1 p.687}۔"
  es: "En el libro, Tannub es un árbol muy conocido, del cual Fufi es una especie; su semilla es qadm quraysh y su poder es astringente y ligeramente caliente, y de ella se obtiene brea silvestre; su hoja es una cataplasma para hinchazones calientes, su hoja y semilla con otros materiales benefician las úlceras externas y todas las úlceras calientes y húmedas, su corteza sirve para las heridas como ungüento, su hoja sobre heridas frescas previene su infección, se hace un enjuague bucal con él y con su decocción para el dolor de muelas, su humo se incorpora a los ungüentos oftálmicos, su semilla ayuda a expulsar la flema del pecho, su resina es muy beneficiosa para la tos muy crónica, y si se bebe, aglutina y retiene la orina {cite:canon-ibn-sina-print-v1 p.687}"
  fr: "Le tannub est mentionné dans le livre comme un arbre bien connu, dont le fufi est une variété; sa graine, appelée qadm quraysh, a des propriétés astringentes et légèrement chauffantes, et on en tire de la poix sauvage; sa feuille sert de cataplasme pour les gonflements chauds; ses feuilles et ses graines, associées à d’autres substances, sont bénéfiques pour les ulcères externes et tous les ulcères chauds et humides; son écorce convient aux plaies en application superficielle; sa feuille, appliquée sur des plaies fraîches, prévient leur infection; on prépare un gargarisme à partir de cette feuille et de sa décoction pour soulager les maux de dents; sa fumée entre dans la composition de pommades ophtalmiques; sa graine aide à expectorer les mucosités de la poitrine; sa résine est très bénéfique pour les toux très chroniques; et, si elle est ingérée, elle provoque une diurèse. {cite:canon-ibn-sina-print-v1 p.687}"
  tr: "Kitapta ünlü bir ağaç vardır ve fowfi onun bir türüdür. Tohumu Quraysh kemiricisidir, dayanıklılığı nazik ve sıcaktır, ondan yabani katran yapılır, yaprakları sıcak tümörler için pansuman olarak kullanılır, yaprakları ve tohumları görünür yaralar ve tüm sıcak ve nemli ülserler için faydalı diğer maddelerle karıştırılır. Kabuğu yaralar için bir dereceye uygundur ve yumuşak yaralardaki yaprakları bozulmayı önler. Diş ağrısı için durulanır ve pişirilir. Dumanı göz köğünde bulunur, tohumu üflemeye yardımcı olur ve diş eti çok kronik öksürükler için çok faydalıdır. Eğer kişi bilgelik içip idrar tutarsa {cite:canon-ibn-sina-print-v1 s.687}"
  id: "Dalam buku ini, terdapat pohon yang terkenal, dan fowfi adalah salah satu jenisnya. Benihnya adalah gigitan Quraisy, kekuatannya lembut dan hangat, dan dari pohon ini dibuat tar liar, daunnya digunakan sebagai perban tumor panas, daun dan bijinya dicampur dengan zat lain yang berguna untuk luka yang terlihat dan semua borok panas serta lembap. Kulitnya agak cocok untuk luka, dan daunnya pada luka lunak mencegah pembusukan. Bijinya digunakan untuk membilas dan dimasak untuk sakit gigi. Asapnya ditemukan di kol mata, bijinya membantu meniup, dan gusinya sangat bermanfaat untuk batuk kronis. Jika seseorang minum kebijaksanaan dan menahan urin {cite:canon-ibn-sina-print-v1 hlm.687}"
