id: "concept/al-falij-hasab-mawdi-al-illa"
class: "concept"
kind: "scientific"
label:
  ar: "الفالج بحسب موضع الآفة"
  en: "Palsy by the seat of the lesion"
  fr: "La paralysie selon le siège de la lésion"
  ur: "فالج آفت کے موضع کے لحاظ سے"
  es: "Parálisis en la zona de la lesión"
  tr: "Lezyonun bulunduğu yere bağlı felç"
  id: "Kelumpuhan terkait lokasi lesi"
summary:
  ar: "إذا كانت الآفة والمادة الفاعلة للفالج في شقّ من بطون الدماغ عمّ شقّ البدن كله وشقّ الوجه معه، وإن كانت عند منبت النخاع كان البدن كله مفلوجاً دون أعضاء الوجه، وإن كانت في شقّ من منبت النخاع استرخى الشقّ كله دون الوجه، وإن كانت في عصب استرخى ما يخصّ ذلك العصب {cite:canon-ibn-sina-print-v2 p.138}"
  en: "If the lesion and the matter making the palsy is in one side of the brain's ventricles, the whole half of the body is covered with the half of the face; if at the root of the spinal cord the whole body is palsied without the face's organs; if in one side of the cord's root that whole side relaxes without the face; if in a nerve, what belongs to that nerve relaxes {cite:canon-ibn-sina-print-v2 p.138}"
  fr: "Selon le Canon, si la lésion et la matière qui cause la paralysie siègent d’un côté des ventricules cérébraux, la moitié du corps et du visage est atteinte. À l’origine de la moelle épinière, tout le corps est paralysé sauf les organes du visage ; si un seul côté de cette origine est atteint, tout ce côté se relâche, sans atteinte du visage. Si la lésion siège dans un nerf, les parties qui en dépendent se relâchent {cite:canon-ibn-sina-print-v2 p.138}."
  ur: "اگر آفت اور فالج بنانے والا مادہ دماغ کے بطون کے ایک شق میں ہو تو بدن کا سارا شق چہرے کے شق سمیت محاط ہوتا ہے، اور اگر نخاع کے منبت پر ہو تو سارا بدن چہرے کے اعضا کے بغیر مفلوج ہوتا ہے، اور اگر نخاع کے منبت کے ایک شق میں ہو تو سارا شق چہرے کے بغیر مسترخی ہوتا ہے، اور اگر کسی عصب میں ہو تو اس عصب کا مخصوص حصہ مسترخی ہوتا ہے {cite:canon-ibn-sina-print-v2 p.138}۔"
  es: "Si la lesión y la materia que causa la parálisis se encuentran en un lado de los ventrículos cerebrales, toda la mitad del cuerpo queda cubierta con la mitad de la cara; si en la raíz de la médula espinal, todo el cuerpo queda paralizado sin los órganos de la cara; si en un lado de la raíz de la médula, todo ese lado se relaja sin la cara; si en un nervio, lo que pertenece a ese nervio se relaja {cite:canon-ibn-sina-print-v2 p.138}"
  tr: "Eğer lezyon ve felcin neden maddesi beyin ventrikülünün bir bölümündeyse, tüm vücut kesilir ve yüz kesisi onunla birlikteyse, omurilik bölgesindeyse yüz organları hariç tüm vücut felç olur, omuriliğin bir bölümü varsa, tüm kesi yüzün altında gevşer ve bir sinir varsa, o sinire bağlı sinir gevşemiştir {cite:canon-ibn-sina-print-v2 s.138}"
  id: "Jika penyebab lesi dan kelumpuhan berada di bagian ventrikel otak, seluruh tubuh terputus, dan jika sayatan wajah bersamanya, jika berada di wilayah sumsum tulang belakang, seluruh tubuh kecuali organ wajah menjadi lumpuh; jika ada bagian sumsum tulang belakang, seluruh sayatan di bawah wajah akan rileks, dan jika ada saraf, saraf yang terhubung ke saraf tersebut menjadi rileks. {cite:canon-ibn-sina-print-v2 hlm.138}"
