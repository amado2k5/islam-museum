summary:
  ar: "يذكر الفهرس كواكب الدجاجة في قسمها الخاص، فيبدأ بالكوكب الذي على منقارها، ثم الذي في وسط عنقها، والذي في صدرها، والكوكب المضيء الذي على ذنبها، وتُذكر بعدها كواكب جناحيها ورجليها. {cite:zij-sabi-nallino-byblion pp.249}"
  en: "The catalogue gives the stars of al-Dajaja, the Hen, as a section of its own. It begins with the star on the beak, then the star in the middle of the neck and the star in the breast, and the bright star on the tail. The entries continue through the wings and the legs. {cite:zij-sabi-nallino-byblion pp.249}"
  ur: "فہرست دجاجہ یعنی مرغی کے ستاروں کو اپنے الگ حصے میں دیتی ہے۔ آغاز چونچ والے ستارے سے ہوتا ہے، پھر گردن کے وسط والا، سینے والا اور دم پر والا روشن ستارہ، اور پھر پروں اور ٹانگوں کے ستارے۔ {cite:zij-sabi-nallino-byblion pp.249}"
  es: "El catálogo dedica una sección aparte a las estrellas de al-Dajaja, la Gallina. Comienza con la estrella del pico, seguida de la del cuello, la del pecho y la brillante de la cola. Las entradas continúan con las alas y las patas. {cite:zij-sabi-nallino-byblion pp.249}"
  fr: "Le catalogue consacre une section entière aux étoiles d'al-Dajaja, la Poule. Il commence par l'étoile sur le bec, puis celle au milieu du cou, celle sur la poitrine et enfin l'étoile brillante sur la queue. Les descriptions se poursuivent ensuite avec les étoiles sur les ailes et les pattes. {cite:zij-sabi-nallino-byblion pp.249}"
