label:
  ar: "الدمعة"
  en: "Epiphora (dam'a)"
  ur: "دمعة"
summary:
  ar: "الدمعة أن تكون العين دائماً رطبة برطوبة مائية فربما سالت دمعة، ومنه مولود ومنه عارض، ومن العارض لازم في الصحة ومنه تابع لمرض إن زال زال كما يكون في الحميات؛ والسبب في العارض ضعف الماسكة أو الهاضمة المنضجة أو نقصان من الموق في الطبع أو بسبب استعمال دواء حاد أو عقيب قطع الظفرة، ومبدأ تلك الرطوبات الدماغ يسيل منه إلى العين في أحد الطريقين المتكرر ذكرهما مراراً، والمولود منه عسر ما يقبل العلاج {cite:canon-ibn-sina-print-v2 p.188} {cite:canon-ibn-sina-print-v2 p.189}"
  en: "Epiphora is that the eye is always wet with a watery moisture and a tear may flow; some of it is congenital, some incidental; of the incidental some is necessary in health and some follows a disease and ceases when it ceases, as in the fevers; the cause of the incidental is weakness of the holding or the digesting-concocting power, or a decrease of the canthus in nature, or from using a sharp drug, or after cutting the pterygium; the source of those moistures is the brain, flowing from it to the eye in one of the two paths repeatedly mentioned; the congenital hardly accepts treatment {cite:canon-ibn-sina-print-v2 p.188} {cite:canon-ibn-sina-print-v2 p.189}"
  ur: "دمعة یہ ہے کہ آنکھ ہمیشہ پانی جیسی رطوبت سے تر رہے اور آنسو بہ سکے؛ اس میں سے کچھ پیدائشی اور کچھ عارضی ہے؛ عارضی میں سے کچھ صحت میں لازم ہے اور کچھ کسی مرض کی پیروی کرتا ہے تو جس کے جانے سے جائے جیسا بخاروں میں ہوتا ہے؛ عارضی کا سبب ماسکہ یا ہاضمہ منضجہ قوت کا ضعف ہے یا فطرت میں مآق کا گھٹنا یا تیز دوا کے استعمال سے یا ظفرہ کاٹنے کے بعد؛ اور ان رطوبتوں کا مبدأ دماغ ہے جو ان میں سے کسی ایک راہ سے آنکھ کو بہاتا ہے جس کا ذکر بار بار آیا؛ اور پیدائشی علاج مشکل سے قبول کرتی ہے {cite:canon-ibn-sina-print-v2 p.188} {cite:canon-ibn-sina-print-v2 p.189}"
