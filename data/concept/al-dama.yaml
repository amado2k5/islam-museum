label:
  ar: "الدمعة"
  en: "Epiphora (dam'a)"
  fr: "Épiphora (dam’a)"
  ur: "دمعة"
  es: "Epífora (dam'a)"
  tr: "Yırtık"
  id: "Yırtık"
summary:
  ar: "الدمعة أن تكون العين دائماً رطبة برطوبة مائية فربما سالت دمعة، ومنه مولود ومنه عارض، ومن العارض لازم في الصحة ومنه تابع لمرض إن زال زال كما يكون في الحميات؛ والسبب في العارض ضعف الماسكة أو الهاضمة المنضجة أو نقصان من الموق في الطبع أو بسبب استعمال دواء حاد أو عقيب قطع الظفرة، ومبدأ تلك الرطوبات الدماغ يسيل منه إلى العين في أحد الطريقين المتكرر ذكرهما مراراً، والمولود منه عسر ما يقبل العلاج {cite:canon-ibn-sina-print-v2 p.188} {cite:canon-ibn-sina-print-v2 p.189}"
  en: "Epiphora is that the eye is always wet with a watery moisture and a tear may flow; some of it is congenital, some incidental; of the incidental some is necessary in health and some follows a disease and ceases when it ceases, as in the fevers; the cause of the incidental is weakness of the holding or the digesting-concocting power, or a decrease of the canthus in nature, or from using a sharp drug, or after cutting the pterygium; the source of those moistures is the brain, flowing from it to the eye in one of the two paths repeatedly mentioned; the congenital hardly accepts treatment {cite:canon-ibn-sina-print-v2 p.188} {cite:canon-ibn-sina-print-v2 p.189}"
  fr: "L’épiphora est un état dans lequel l’œil est toujours humide d’une humidité aqueuse et où une larme peut couler ; certaines formes sont congénitales, d’autres occasionnelles ; parmi les occasionnelles, certaines sont nécessaires à la santé et d’autres suivent une maladie et cessent avec elle, comme dans les fièvres ; leur cause est une faiblesse de la faculté de rétention ou de digestion et de coction, une diminution naturelle du canthus, l’emploi d’un médicament âcre ou l’ablation du ptérygion ; ces humidités proviennent du cerveau et s’écoulent vers l’œil par l’une des deux voies mentionnées à plusieurs reprises ; la forme congénitale se prête difficilement au traitement {cite:canon-ibn-sina-print-v2 p.188} {cite:canon-ibn-sina-print-v2 p.189}"
  ur: "دمعة یہ ہے کہ آنکھ ہمیشہ پانی جیسی رطوبت سے تر رہے اور آنسو بہ سکے؛ اس میں سے کچھ پیدائشی اور کچھ عارضی ہے؛ عارضی میں سے کچھ صحت میں لازم ہے اور کچھ کسی مرض کی پیروی کرتا ہے تو جس کے جانے سے جائے جیسا بخاروں میں ہوتا ہے؛ عارضی کا سبب ماسکہ یا ہاضمہ منضجہ قوت کا ضعف ہے یا فطرت میں مآق کا گھٹنا یا تیز دوا کے استعمال سے یا ظفرہ کاٹنے کے بعد؛ اور ان رطوبتوں کا مبدأ دماغ ہے جو ان میں سے کسی ایک راہ سے آنکھ کو بہاتا ہے جس کا ذکر بار بار آیا؛ اور پیدائشی علاج مشکل سے قبول کرتی ہے {cite:canon-ibn-sina-print-v2 p.188} {cite:canon-ibn-sina-print-v2 p.189}"
  es: "La epífora es que el ojo está siempre húmedo con una secreción acuosa y puede derramarse una lágrima; parte de ella es congénita, parte incidental; de la incidental, parte es necesaria para la salud y parte se presenta después de una enfermedad y cesa cuando esta cesa, como en las fiebres; la causa de la incidental es la debilidad de la capacidad de retención o digestión, o una disminución del canto ocular de forma natural, o por el uso de un fármaco fuerte, o después de cortar el pterigión; la fuente de esas secreciones es el cerebro, que fluye desde él hacia el ojo por una de las dos vías mencionadas repetidamente; la congénita difícilmente responde al tratamiento {cite:canon-ibn-sina-print-v2 p.188} {cite:canon-ibn-sina-print-v2 p.189}"
  tr: "Gözyaş, gözün sürekli suyla nemli olup dökülmüş olabileceği, bazılarının doğar, bazıları belirti gösterdiği, bazıları sağlık için gerekli ve bazıları ise diyetlerde olduğu gibi, kaybolursa hastalıkla ilişkili olur. Durumun nedeni zayıflamış doku veya olgun sindirim sistemi, azalmış mizaç ya da akut ilaç kullanımı ya da çöp kesimi sonrası yaşanmasıdır. Bu nemin kaynağı, beynin tekrar tekrar bahsedilen iki yöntemden biriyle göze boşalmasıdır ve yenidoğan tedavi edilemez {cite:canon-ibn-sina-print-v2 s.188} {cite:canon-ibn-sina-print-v2 s.189}"
  id: "Air mata mungkin selalu basah oleh air, beberapa mungkin ada, beberapa menunjukkan gejala, beberapa diperlukan untuk kesehatan, dan beberapa, seperti dalam diet, jika hilang, terkait dengan penyakit. Kondisi ini disebabkan oleh jaringan yang melemah atau sistem pencernaan yang matang, temperamen yang menurun, atau setelah penggunaan obat akut atau luka limbah. Sumber kelembapan ini adalah otak yang mengalir ke mata melalui salah satu dari dua metode yang sering disebutkan, dan bayi baru lahir tidak dapat diobati {cite:canon-ibn-sina-print-v2 hlm.188} {cite:canon-ibn-sina-print-v2 hlm.189}"
