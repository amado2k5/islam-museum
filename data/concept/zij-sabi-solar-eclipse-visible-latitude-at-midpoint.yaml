label: { ar: "عرض القمر المرئي لوسط كسوف الشمس", en: "The visible latitude of the Moon at the middle of a solar eclipse", ur: "سورج گرہن کے وسط میں چاند کا مرئی عرض", es: "La latitud visible de la Luna en el punto medio de un eclipse solar.", fr: "La latitude visible de la Lune au milieu d'une éclipse solaire", tr: "Ayın gözünden güneş tutulmasının merkezinin görüntüsü", id: "Tampilan bulan yang terlihat dari pusat gerhana matahari." }
summary:
  ar: "يُقام الطالع لوسط الكسوف، ثم يُعرف عرض القمر الحقيقي بحركة العرض المقوّمة لوسط الكسوف، ويُعرف اختلاف المنظر في العرض على الرسم نفسه. فإن كان العرض الحقيقي واختلاف منظره في العرض في جهة واحدة جُمعا، وإن اختلفا نُقص الأقل من الأكثر، ويُعرف الباقي وجهته، فيخرج عرض القمر المرئي لوسط الكسوف. {cite:zij-sabi-nallino-byblion pp.164-165}"
  en: "The ascendant is erected for the middle of the eclipse. The Moon's true latitude is found from the latitude motion corrected to that moment, and its parallax in latitude is found on the same figure. If the two lie on the same side they are added; if not, the smaller is subtracted from the larger and the side of the remainder is kept. The result is the visible latitude of the Moon at mid-eclipse. {cite:zij-sabi-nallino-byblion pp.164-165}"
  ur: "گرہن کے وسط کے لیے طالع قائم کیا جاتا ہے، پھر وسط کے لیے تصحیح شدہ عرضی حرکت سے چاند کا حقیقی عرض معلوم ہوتا ہے، اور اسی شکل پر عرض میں اختلافِ منظر۔ اگر دونوں ایک ہی جانب ہوں تو جمع کیے جاتے ہیں؛ ورنہ چھوٹے کو بڑے میں سے گھٹایا جاتا ہے اور باقی کی سمت رکھی جاتی ہے۔ نتیجہ وسط گرہن میں چاند کا مرئی عرض ہے۔ {cite:zij-sabi-nallino-byblion pp.164-165}"
  es: "El ascendente se erige para el punto medio del eclipse. La latitud verdadera de la Luna se obtiene a partir del movimiento latitudinal corregido hasta ese momento, y su paralaje latitudinal se encuentra en la misma figura. Si ambas se encuentran en el mismo lado, se suman; de lo contrario, se resta la menor de la mayor y se conserva el lado del resto. El resultado es la latitud visible de la Luna en el punto medio del eclipse. {cite:zij-sabi-nallino-byblion pp.164-165}"
  fr: "L'ascendant est dressé pour le milieu de l'éclipse. La latitude réelle de la Lune est calculée à partir du mouvement de latitude corrigé à cet instant, et sa parallaxe en latitude est déterminée sur la même figure. Si les deux valeurs se situent du même côté, elles sont additionnées; sinon, la plus petite est soustraite de la plus grande et le côté du reste est conservé. Le résultat obtenu est la latitude visible de la Lune au milieu de l'éclipse. {cite:zij-sabi-nallino-byblion pp.164-165}"
  tr: "Ay tutulmasının merkezinde yükselen burç belirlenir ve ardından ayın gerçek enlemi, enlemin tutulma merkezine göre hareketiyle belirlenir. Aynı diyagram üzerinde enlemdeki paralaks da belirlenir. Gerçek enlem ve paralaks aynı yöndeyse, toplanırlar. Farklıysa, küçük olan büyük olandan çıkarılır ve kalanın yönü belirlenir, böylece tutulmanın merkezindeki ayın görünen enlemi elde edilir. {cite:zij-sabi-nallino-byblion pp.164-165}"
  id: "Ascendant ditetapkan di pusat gerhana, dan kemudian lintang sebenarnya dari bulan ditentukan oleh pergerakan lintang relatif terhadap pusat gerhana. Paralaks pada lintang tersebut juga ditentukan pada diagram yang sama. Jika lintang sebenarnya dan paralaks berada dalam arah yang sama, keduanya dijumlahkan. Jika berbeda, yang lebih kecil dikurangi dari yang lebih besar, dan arah sisanya ditentukan, sehingga menghasilkan lintang tampak bulan di pusat gerhana. {cite:zij-sabi-nallino-byblion pp.164-165}"
