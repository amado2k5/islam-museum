id: concept/shabah-resemblance-analogy
class: concept
kind: legal
label:
  ar: "الشَّبَه"
  en: "Shabah (resemblance, a ground of analogy in usul)"
summary:
  ar: "الشبه في اللغة المثل، ويعرفه الأصوليون بأنه وصف لا يعقل مناسبته للحكم بالنظر إلى ذاته، وتظن فيه المناسبة لالتفات الشارع إليه في بعض المواضع، فهو مسلك من مسالك العلة، وقياسه قياس الشبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} وتتصل به ألفاظ: المناسب، والطرد والعكس، والدوران، وهو منزلة بين المناسب والطرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} ومن الفقهاء من يقبله حجة كالشافعي، ومنهم من يرده كالحنفية وبعض الشافعية. وفي الفقه يثبت نسب اللقيط بالقافة عند الشافعية والحنابلة، ولا يعتبرون الشبه عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911}"
  en: "In language shabah is likeness. The usulis define it as an attribute whose fitness to the ruling is not understood when considered in itself, yet fitness is supposed in it because the lawgiver attended to it in some cases; it is one of the ways of identifying a cause, and analogy by it is analogy of resemblance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} Related terms are the fitting attribute (munasib), concomitance and its converse, and circling (dawaran). Shabah stands between fitness and mere concomitance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} Shafi'i holds it a proof; the Hanafis and some Shafi'is reject it. In law the Shafi'is and Hanbalis trace the lineage of a foundling by the resemblance judged by the physiognomist, while the Hanafis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911}"
