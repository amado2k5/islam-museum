id: concept/shabah-resemblance-analogy
class: concept
kind: legal
label:
  ar: "الشَّبَه"
  en: "Shabah (resemblance, a ground of analogy in usul)"
  es: "Shabah (semejanza, fundamento de analogía en usul)"
  fr: "Shabah (ressemblance, fondement de l'analogie dans l'usul)"
  ur: "شبہ ⁦(مشابہت، اصول میں تشبیہ کی بنیاد)⁩"
summary:
  ar: "الشبه في اللغة المثل، ويعرفه الأصوليون بأنه وصف لا يعقل مناسبته للحكم بالنظر إلى ذاته، وتظن فيه المناسبة لالتفات الشارع إليه في بعض المواضع، فهو مسلك من مسالك العلة، وقياسه قياس الشبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} وتتصل به ألفاظ: المناسب، والطرد والعكس، والدوران، وهو منزلة بين المناسب والطرد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} ومن الفقهاء من يقبله حجة كالشافعي، ومنهم من يرده كالحنفية وبعض الشافعية. وفي الفقه يثبت نسب اللقيط بالقافة عند الشافعية والحنابلة، ولا يعتبرون الشبه عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911}"
  en: "In language shabah is likeness. The usulis define it as an attribute whose fitness to the ruling is not understood when considered in itself, yet fitness is supposed in it because the lawgiver attended to it in some cases; it is one of the ways of identifying a cause, and analogy by it is analogy of resemblance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} Related terms are the fitting attribute (munasib), concomitance and its converse, and circling (dawaran). Shabah stands between fitness and mere concomitance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} Shafi'i holds it a proof; the Hanafis and some Shafi'is reject it. In law the Shafi'is and Hanbalis trace the lineage of a foundling by the resemblance judged by the physiognomist, while the Hanafis do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911}"
  es: "En el lenguaje, shabah es semejanza. Los usulis la definen como un atributo cuya idoneidad para la norma no se entiende cuando se considera en sí mismo, pero se supone que es adecuado porque el legislador lo tuvo en cuenta en algunos casos; es una de las formas de identificar una causa, y la analogía por ella es una analogía de semejanza. Los términos relacionados incluyen el atributo apropiado (munasib), la concomitancia y su recíproco, y el círculo (dawaran). Shabah se sitúa entre la idoneidad y la mera concomitancia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} Shafi'i la considera una prueba; los hanafíes y algunos shafi'ís la rechazan. En derecho, los shafi'ís y los hanbalíes rastrean el linaje de un expósito por la semejanza juzgada por el fisonomista, mientras que los hanafíes no. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9910} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911}"
  fr: "En langage, shabah signifie ressemblance. Les usulis la définissent comme un attribut dont la pertinence par rapport à la décision n'est pas évidente prise isolément, mais qui est supposé pertinent car le législateur l'a pris en compte dans certains cas; c'est l'un des moyens d'identifier une cause, et l'analogie qui en découle est une analogie de ressemblance. Parmi les termes apparentés, on trouve l'attribut approprié (munasib), la concomitance et son contraire, et le cercle (dawaran). Shabah se situe entre la pertinence et la simple concomitance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} L'école shafi'ite la considère comme une preuve; les hanafites et certains shafi'ites la rejettent. En droit, les shafi'ites et les hanbalites retracent la lignée d'un enfant trouvé par la ressemblance jugée par le physiognomoniste, tandis que les hanafites ne le font pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911}"
  ur: "زبان میں شباہ تشبیہ ہے۔ اصول اسے ایک ایسی صفت کے طور پر بیان کرتے ہیں جس کے حکم کی فٹنس اپنے آپ میں سمجھ میں نہیں آتی، پھر بھی اس میں تندرستی فرض کی جاتی ہے کیونکہ بعض صورتوں میں قانون دینے والے نے اس پر عمل کیا ہے۔ یہ ایک وجہ کی شناخت کے طریقوں میں سے ایک ہے، اور اس کی طرف سے تشبیہ مشابہت کی ایک قیاس ہے. متعلقہ اصطلاحات میں موزوں وصف ⁦(مناسب)⁩، ہم آہنگی اور اس کی بات چیت، اور چکر لگانا ⁦(داوران)⁩ شامل ہیں۔ شباہ فٹنس اور محض ہم آہنگی کے درمیان کھڑا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.9908} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9909} شافعی اسے دلیل مانتے ہیں۔ احناف اور بعض شافعی اس کا انکار کرتے ہیں۔ قانون میں شافعی اور حنبلی اس مشابہت کے مطابق نسب کا پتہ لگاتے ہیں جو ماہر طبیعیات کی طرف سے فیصلہ کیا جاتا ہے، جبکہ حنفیہ ایسا نہیں کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9909} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9910}"
