id: concept/zufa-ratb
class: concept
kind: natural
label:
  ar: "زوفا رَطب"
  en: "Moist zufa (grime from sheep wool in Armenia)"
  ur: "تر زوفا ⁦(آرمینیا کی بھیڑوں کے اون کا میل)⁩"
  es: "Zufa húmeda (suciedad procedente de la lana de oveja en Armenia)"
  fr: "Zufa humide (saleté de la laine de mouton en Arménie)"
  tr: "Hyssop ıslak"
  id: "Hyssop basah"
summary:
  ar: "الزوفا الرطب وسخ يجتمع على أصواف أليات الضأن بأرمينية، ويأخذ قوى الحشائش التي ينجرّ عليها، وهو منضج محلّل، ينفع الأورام الصلبة والطحال، ويحلّل ما في ناحية المثانة والرحم من صلابات. {cite:canon-ibn-sina-print-v1 p.456}"
  en: "Moist zufa is grime gathered on the wool of sheep tails in Armenia, taking the strength of the grasses it drips on. It ripens and dissolves; it helps hard swellings and the spleen, and dissolves hardenings near the bladder and the womb. {cite:canon-ibn-sina-print-v1 p.456}"
  ur: "تر زوفا آرمینیا میں بھیڑوں کی دم کے اون پر جمع ہونے والا میل ہے جو اس گھاس کی قوت لیتا ہے جس پر ٹپکتا ہے۔ یہ پکاتا اور تحلیل کرتا ہے؛ سخت سوجن اور تلی میں مفید ہے، اور مثانے اور رحم کے قریب کی سختیوں کو تحلیل کرتا ہے۔ {cite:canon-ibn-sina-print-v1 p.456}"
  es: "El zufa húmedo es la mugre que se acumula en la lana de las colas de las ovejas en Armenia, adquiriendo la fuerza de las hierbas sobre las que gotea. Madura y se disuelve; ayuda a aliviar las hinchazones duras y el bazo, y disuelve los endurecimientos cerca de la vejiga y el útero. {cite:canon-ibn-sina-print-v1 p.456}"
  fr: "La zufa humide est une saleté recueillie sur la laine des queues de moutons en Arménie, qui s'imprègne de la force des herbes sur lesquelles elle s'écoule. Elle mûrit et se dissout; elle soulage les gonflements et les affections de la rate, et dissout les indurations près de la vessie et de l'utérus. {cite:canon-ibn-sina-print-v1 p.456}"
  tr: "Islak hyssop, Ermenistan'da koyunların kalçalarındaki yünlerde biriken kirli bir bitkidir. Üzerine basıldığı otlardan güç alır. Olgunlaştırıcı ve çözücü bir maddedir, sert tümörler ve dalağa faydalıdır ve mesane ve rahimdeki sertliği çözer. {cite:canon-ibn-sina-print-v1 s.456}"
  id: "Hyssop basah adalah tumbuhan kotor yang tumbuh di bulu domba di Armenia. Tumbuhan ini memperoleh kekuatan dari rumput yang diinjaknya. Ia merupakan agen pematangan dan pelarut, bermanfaat untuk tumor keras dan limpa, serta melarutkan kekerasan pada kandung kemih dan rahim. {cite:canon-ibn-sina-print-v1 p.456}"
