id: concept/inkar
class: concept
kind: legal
label: { ar: "الإنكار", en: "Inkar (denial in a claim, its forms and its effects, and denial of religious matters)", es: "Inkar (negación de una reclamación, sus formas y sus efectos, y negación de asuntos religiosos)", fr: "Inkar (déni d'une revendication, ses formes et ses effets, et déni en matière religieuse)", ur: "انکار ⁦(دعوے کا انکار، اس کی شکلیں اور اس کے اثرات، اور مذہبی معاملات کا انکار)⁩", tr: "İnkar", id: "Penolakan" }
summary:
  ar: "الإنكار لغة يأتي للجهل بالشيء، وللنفي، وتغيير المنكر، وعند الفقهاء يرد بمعنى الجحد وبمعنى تغيير المنكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3547} ويتحقق الإنكار بالنطق الصريح، ويقع خلاف في ألفاظ مثل «لا حق لك عندي»، وقد يُعد إنكارا عند بعضهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3549} والبينة على المدعي، واليمين على المنكر، فإن أقام المدعي بينة قضي له، وإن نكل المنكر عن اليمين حكم عليه عند الحنفية والحنابلة، ولا يُقضى عليه عند المالكية والشافعية إلا بعد رد اليمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3554} وسكوت المدعى عليه فيه أقوال: إنكار عند أبي يوسف والشافعية، ونكول عند المالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3550}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3551} ولا يقطع منكر الوديعة أو العارية عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555} وإذا رجع المقر عن إقرار يتعلق بحق الله فللفقهاء اتجاهات، أما حقوق الآدميين فلا يقبل الرجوع فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3556} ولا يُكفّر منكر أمر من الدين إلا إذا كان مجمعا عليه معلوما من الدين بالضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3558}"
  en: "Inkar in lexical use means ignorance of a thing, negation, and changing a wrong; for the jurists it means denial (jahd) and changing what is wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3547} Denial is made in clear speech, and the jurists differ on words such as ‘you have no right over me’, which some count as denial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3549} The proof lies on the claimant and the oath on the one who denies: if the claimant brings proof he wins; if the denier refuses the oath, the Hanafis and Hanbalis judge against him, while the Malikis and Shafi'is do not, unless the oath is returned to the claimant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3554} The defendant's silence is treated in several ways: as denial for Abu Yusuf and the Shafi'is, as refusal (nukul) for the Malikis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3550}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3551} The majority hold that one who denies a deposit or a loan is not cut by the hand for theft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555} Where a person retracts an acknowledgement of a right of God, the jurists differ; a right of people cannot be retracted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3556} A person who denies a matter of religion is not declared an unbeliever unless it is universally known as part of religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3558}"
  es: "Inkar en uso léxico significa ignorancia de algo, negación y cambio de un error; para los juristas significa negación (jahd) y cambio de lo que es incorrecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3547} La negación se hace en un discurso claro, y los juristas difieren en palabras como \"no tienes derecho sobre mí\", que algunos consideran una negación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3549} La prueba recae sobre el reclamante y el juramento sobre el que niega: si el reclamante presenta pruebas, gana; si el negador se niega a prestar juramento, los hanafíes y hanbalíes juzgan en su contra, mientras que los malikíes y shafiíes no lo hacen, a menos que se le devuelva el juramento al reclamante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3554} El silencio del acusado se trata de varias maneras: como negación para Abu Yusuf y los shafi'is, como rechazo (nukul) para los malikíes y hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3550}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3551} La mayoría sostiene que quien niega un depósito o un préstamo no es cortado por la mano por robo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555} Cuando una persona se retracta de un reconocimiento de un derecho de Dios, los juristas difieren; un derecho de las personas no se puede retractar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3556} Una persona que niega una cuestión de religión no es declarada incrédula a menos que sea universalmente conocida como parte de la religión. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3558}"
  fr: "Le terme « inkar », en usage lexical, signifie ignorance d'une chose, négation et correction d'une erreur; pour les juristes, il signifie déni (jahd) et correction de ce qui est injuste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3547} Le déni s'exprime clairement, et les juristes divergent sur des expressions telles que « tu n'as aucun droit sur moi », que certains considèrent comme un déni. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3549} La preuve incombe au demandeur et le serment au défendeur: si le demandeur apporte la preuve, il obtient gain de cause; si le défendeur refuse de prêter serment, les hanafites et les hanbalites statuent contre lui, tandis que les malikites et les chaféites ne le font pas, à moins que le serment ne soit restitué au demandeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3554} Le silence du défendeur est interprété de plusieurs manières: comme un déni pour Abou Yusuf et les Chafi'ites, comme un refus (nukul) pour les Malikites et les Hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3550}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3551} La majorité considère que celui qui nie un dépôt ou un prêt n'est pas coupable de vol. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555} Lorsqu'une personne se rétracte après avoir reconnu un droit divin, les juristes divergent; un droit humain est irrévocable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3556} Une personne qui nie une question de religion n'est pas déclarée incroyante à moins qu'elle ne soit universellement connue comme faisant partie de la religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3558}"
  ur: "لغوی استعمال میں انکار کا مطلب ہے کسی چیز سے ناواقفیت، نفی، اور غلط کو بدلنا۔ فقہاء کے نزدیک اس کا مطلب انکار ⁦(جہد)⁩ اور غلط کو بدلنا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص 3547} انکار صاف لفظوں میں کیا جاتا ہے، اور فقہاء کا اختلاف ہے جیسے کہ 'تمہارا مجھ پر کوئی حق نہیں'، جسے بعض لوگ انکار میں شمار کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3549} دلیل دعویٰ کرنے والے پر ہے اور قسم جھٹلانے والے پر: اگر دعویٰ کرنے والا ثبوت لائے تو وہ جیت جاتا ہے۔ اگر منکر قسم سے انکار کردے تو حنفیہ اور حنبلی اس کے خلاف فیصلہ کرتے ہیں، جب کہ مالکیہ اور شافعی ایسا نہیں کرتے، جب تک کہ قسم مدعی کو واپس نہ کر دی جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3554} مدعا علیہ کی خاموشی کو کئی طریقوں سے سمجھا جاتا ہے: جیسا کہ ابو یوسف اور شافعیہ کے لیے انکار اور حنبلیوں کے لیے انکار کے طور پر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3550}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3551} جمہور کا خیال ہے کہ جو شخص امانت یا قرض کا انکار کرتا ہے اس کا ہاتھ چوری کے جرم میں نہیں کاٹا جاتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3555} جہاں کوئی شخص خدا کے حق کے اقرار سے رجوع کرتا ہے وہاں فقہاء کا اختلاف ہے۔ عوام کا حق واپس نہیں لیا جا سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3556} جو شخص مذہب کے کسی معاملے کا انکار کرتا ہے اسے کافر قرار نہیں دیا جاتا جب تک کہ اسے دنیا میں مذہب کا حصہ نہ کہا جائے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص3558}"
  tr: "Dilbilimsel olarak, inkâr bir şeyi bilmemek, olumsuzlamak veya yanlışı değiştirmek anlamına gelir. Hukukçular arasında ise inkar ve yanlışı değiştirmek olarak adlandırılır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3547} İnkar açıkça telaffuzla sağlanır ve bazıları tarafından inkâr olarak görülen \"Bana hakkın yok\" gibi ifadeler üzerinde anlaşmazlıklar yaşanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3549} Delil iddia sahibine, yemin ise suça aittir. Davacı delil sunarsa, yeminler onun lehine verilir. Eğer suçlu adam yemin etmeyi reddederse, yemin Hanafi ve Hanelilere göre onun hakkına verilir; Maliki ve Şafi'lere göre ise yemin ancak yemin edildikten sonra hüküm verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3554} Sanığın bu konudaki sessizliği, Abu Yusuf ve Şafiilere göre inkâr, Maliki ve Hanbali'ye göre ise anlaşmazlık olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3551} Depozito veya kredi reddi çoğunluk tarafından reddedilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3555} Eğer kabul, Allah'ın hakkıyla ilgili bir kabulü geri çekiyorsa, hukukçuların farklı yaklaşımları vardır, ancak insan hakları geri çekilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3555}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3556} Bir din meselesini inkâr eden, mutlaka dinin onayladığı sürece inançsız sayılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3558}"
  id: "Secara linguistik, penyangkalan merujuk pada ketidaktahuan terhadap sesuatu, penyangkalan, atau mengubah kesalahan. Di kalangan ahli hukum, penyangkalan disebut sebagai penyangkalan dan mengubah kesalahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3547} Penolakan dicapai dengan pengucapan eksplisit, dan ada perbedaan pendapat atas frasa seperti \"Kamu tidak berhak denganku,\" yang dianggap beberapa orang sebagai penyangkalan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3549} Bukti ada pada penggugat, dan sumpah ada pada pelaku kesalahan. Jika penggugat mengajukan bukti, maka keputusan akan diputuskan untuknya. Jika pelaku menolak mengucapkan sumpah, keputusan akan diputuskan sesuai dengan Hanafi dan Hanbali, dan menurut Malikis dan Shafi'i, keputusan baru diputuskan setelah mengembalikan sumpah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3554} Keheningan terdakwa dalam perkara ini dianggap sebagai penolakan menurut Abu Yusuf dan para syafi'i, dan merupakan perselisihan menurut Malikis dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3551} Penolakan deposit atau pinjaman tidak ditolak oleh mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3555} Jika pengakuan mencabut pengakuan yang berkaitan dengan hak Allah, para ahli hukum memiliki pendekatan berbeda, tetapi hak manusia tidak dicabut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3556} Penyangkal suatu masalah agama tidak dianggap sebagai orang kafir kecuali jika itu disepakati secara mutlak oleh agama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3558}"
