label: { ar: "الإنكار", en: "Inkar (denial in a claim, its forms and its effects, and denial of religious matters)" }
summary:
  ar: "الإنكار لغة يأتي للجهل بالشيء، وللنفي، وتغيير المنكر، وعند الفقهاء يرد بمعنى الجحد وبمعنى تغيير المنكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3547} ويتحقق الإنكار بالنطق الصريح، ويقع خلاف في ألفاظ مثل «لا حق لك عندي»، وقد يُعد إنكارا عند بعضهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3549} والبينة على المدعي، واليمين على المنكر، فإن أقام المدعي بينة قضي له، وإن نكل المنكر عن اليمين حكم عليه عند الحنفية والحنابلة، ولا يُقضى عليه عند المالكية والشافعية إلا بعد رد اليمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3554} وسكوت المدعى عليه فيه أقوال: إنكار عند أبي يوسف والشافعية، ونكول عند المالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3550}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3551} ولا يقطع منكر الوديعة أو العارية عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555} وإذا رجع المقر عن إقرار يتعلق بحق الله فللفقهاء اتجاهات، أما حقوق الآدميين فلا يقبل الرجوع فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3556} ولا يُكفّر منكر أمر من الدين إلا إذا كان مجمعا عليه معلوما من الدين بالضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3558}"
  en: "Inkar in lexical use means ignorance of a thing, negation, and changing a wrong; for the jurists it means denial (jahd) and changing what is wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3547} Denial is made in clear speech, and the jurists differ on words such as ‘you have no right over me’, which some count as denial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3549} The proof lies on the claimant and the oath on the one who denies: if the claimant brings proof he wins; if the denier refuses the oath, the Hanafis and Hanbalis judge against him, while the Malikis and Shafi'is do not, unless the oath is returned to the claimant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3554} The defendant's silence is treated in several ways: as denial for Abu Yusuf and the Shafi'is, as refusal (nukul) for the Malikis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3550}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3551} The majority hold that one who denies a deposit or a loan is not cut by the hand for theft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555} Where a person retracts an acknowledgement of a right of God, the jurists differ; a right of people cannot be retracted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3556} A person who denies a matter of religion is not declared an unbeliever unless it is universally known as part of religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3558}"
