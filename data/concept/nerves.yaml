summary:
  ar: "يفتتح ابن سينا الجملة الثالثة من تشريح الأعضاء المفردة، وهي العصب في ستة فصول، بكلام خاص في منفعة العصب ومبدئه، ثم يشرع في الأزواج الدماغية السبعة {cite:canon-ibn-sina-print-v1 pp.77-78}."
  en: "Ibn Sina opens the third group of the anatomy of the simple organs, the nerves, in six chapters, with a special discourse on the use and origin of the nerve, and then begins on the seven cranial pairs {cite:canon-ibn-sina-print-v1 pp.77-78}."
  es: "Ibn Sina abre el tercer grupo de la anatomía de los órganos simples, los nervios, en seis capítulos, con un discurso especial sobre el uso y el origen del nervio, y luego comienza con los siete pares craneales {cite:canon-ibn-sina-print-v1 pp.77-78}."
  fr: "Ibn Sina ouvre le troisième groupe de l'anatomie des organes simples, les nerfs, en six chapitres, avec un discours spécial sur l'utilisation et l'origine du nerf, puis commence sur les sept paires crâniennes {cite:canon-ibn-sina-print-v1 pp.77-78}."
