id: concept/tasbi-al-qiraat-ibn-mujahid
class: concept
kind: term
label:
  ar: تسبيع القراءات عند ابن مجاهد
  en: Ibn Mujahid's limiting of the readings to seven
  ur: ابن مجاہد کا قراءتوں کو سات تک محدود کرنا
  es: "La limitación de las lecturas a siete por parte de Ibn Mujahid"
  fr: "La limitation des lectures à sept par Ibn Mujahid"
  tr: "İbn Mücahit'e göre okumalar"
  id: "Bacaan menurut Ibn Mujahid"
summary:
  ar: "أبو بكر ابن مجاهد ⁦(ت 324هـ)⁩ أول من اقتصر على قراءات سبعة أئمة، فانتشرت السبعة حتى ظنّ بعض العوام أنها المرادة بالأحرف السبعة؛ وأنكر عليه المهدوي وأبو شامة وابن عمار ومكي، وجاء في جواب ابن تيمية أنه جمعها ليوافق عدد الحروف لا لاعتقاد أنها هي {cite:nashr-dahman-damascus-1345-v1 p. 44} {cite:nashr-dahman-damascus-1345-v1 p. 49} {cite:itqan-suyuti p. 525}."
  en: "Abu Bakr Ibn Mujahid (d. 324 AH) was the first to limit himself to the readings of seven imams, and the seven spread until some of the common people thought them the ones meant by the seven ahruf; al-Mahdawi, Abu Shama, Ibn Ammar and Makki objected, and Ibn Taymiyya's reply says he collected them to match the number of ahruf, not out of belief that they are the ahruf {cite:nashr-dahman-damascus-1345-v1 p. 44} {cite:nashr-dahman-damascus-1345-v1 p. 49} {cite:itqan-suyuti p. 525}."
  ur: "ابو بکر ابن مجاہد ⁦(م 324ھ)⁩ پہلے شخص ہیں جنھوں نے سات ائمہ کی قراءتوں پر اکتفا کیا؛ پھر سبعہ ایسی پھیلیں کہ بعض عوام نے انھیں سات احرف سمجھ لیا؛ مہدوی، ابو شامہ، ابن عمار اور مکی نے اس پر اعتراض کیا، اور ابن تیمیہ کے جواب میں ہے کہ انھوں نے انھیں احرف کی تعداد کے موافق جمع کیا نہ اس اعتقاد سے کہ یہی احرف ہیں {cite:nashr-dahman-damascus-1345-v1 p. 44} {cite:nashr-dahman-damascus-1345-v1 p. 49} {cite:itqan-suyuti p. 525}۔"
  es: "Abu Bakr Ibn Mujahid (m. 324 AH) fue el primero en limitarse a las lecturas de siete imanes, y los siete se difundieron hasta que algunas personas comunes pensaron que eran los que se referían con los siete ahruf; al-Mahdawi, Abu Shama, Ibn Ammar y Makki objetaron, y la respuesta de Ibn Taymiyya dice que los recopiló para que coincidieran con el número de ahruf, no por creer que fueran los ahruf {cite:nashr-dahman-damascus-1345-v1 p. 44} {cite:nashr-dahman-damascus-1345-v1 p. 49} {cite:itqan-suyuti p. 525}."
  fr: "Abu Bakr Ibn Mujahid (mort en 324 AH) fut le premier à se limiter aux lectures de sept imams, et ces sept lectures se répandirent jusqu'à ce que certains du peuple les considèrent comme celles désignées par les sept ahruf; al-Mahdawi, Abu Shama, Ibn Ammar et Makki s'y opposèrent, et la réponse d'Ibn Taymiyya indique qu'il les a rassemblées pour correspondre au nombre d'ahruf, et non parce qu'il croyait qu'il s'agissait des ahruf {cite:nashr-dahman-damascus-1345-v1 p. 44} {cite:nashr-dahman-damascus-1345-v1 p. 49} {cite:itqan-suyuti p. 525}."
  tr: "Ebu Bekir bin Mücahid (ö. 324 H) yedi imamın okuntlarıyla ilk kez sınırlanmıştır; o kadar çok imam o kadar yaygındı ki bazı sıradan insanlar bunların yedi harfle kastedildiğini sanmıştır; el-Mehdevi, Ebu Şama, İbn Ammar ve Makki ona itiraz etmiştir. İbn Teymiyye'nin yanıtında, mektup sayısını birleştirdiği belirtilmiştir; bunun nedeni {cite:nashr-dahman-damascus-1345-v1 s. 44} {cite:nashr-dahman-damascus-1345-v1 s. 49} {cite:itqan-suyuti s. 525}"
  id: "Abu Bakr ibn Mujahid (wafat 324 H) adalah yang pertama membatasi dirinya pada pembacaan tujuh imam, begitu banyak yang begitu tersebar luas sehingga beberapa orang biasa mengira itu dimaksud oleh tujuh huruf; al-Mahdawi, Abu Shama, Ibn Ammar, dan Makki menentang keberadaannya. Jawaban Ibn Taymiyyah menyatakan bahwa ia menggabungkan surat-surat tersebut agar sesuai dengan jumlah huruf, bukan karena {cite:nashr-dahman-damascus-1345-v1 hlm. 44} {cite:nashr-dahman-damascus-1345-v1 hlm. 49} {cite:itqan-suyuti hlm. 525}."
