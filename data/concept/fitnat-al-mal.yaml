id: concept/fitnat-al-mal
class: concept
kind: ethical
label:
  ar: فتنة المال
  en: "The trial of wealth (fitnat al-mal)"
  es: "La prueba de la riqueza (fitnat al-mal)"
  fr: "L'épreuve de la richesse (fitnat al-mal)"
  ur: "مال کی آزمائش ⁦(فتنت المال)⁩"
  tr: "Paranın cazibesi"
  id: "Godaan uang"
summary:
  ar: "يرى قعدات أن المال فتنة للإنسان، وهو وسيلة الشيطان الفريدة في الإغواء، والإنسان بطمعه وجشعه هو الذي يقحمه على فعل الشر {cite:qadan-manhaj-iqtisad-quran p. 137}، {cite:qadan-manhaj-iqtisad-quran p. 138}. وتتخذ الفتنة صوراً دينية وأخلاقية، كالانشغال بالمال عن ذكر الله، وحب الإنفاق في غير سبيل الله، وصوراً في التعامل مع الناس كالتطفيف والربا والرشوة {cite:qadan-manhaj-iqtisad-quran p. 138}، {cite:qadan-manhaj-iqtisad-quran p. 139}، {cite:qadan-manhaj-iqtisad-quran p. 140}، {cite:qadan-manhaj-iqtisad-quran p. 141}. وفي المجال الاقتصادي يرى أن المال إذا خرج عن وظيفته الأساسية، وهي التبادل، صار مصدر السوء والعواقب {cite:qadan-manhaj-iqtisad-quran p. 142}، {cite:qadan-manhaj-iqtisad-quran p. 145}."
  tr: "Kaadat, parayı insanlar için bir ayartma olarak görür ve Şeytan'ın kendine özgü bir ayartı aracıdır; açgözlülük ve açgözlülük sayesinde insanı kötülük yapmaya yönlendirir {cite:qadan-manhaj-iqtisad-kuran s. 137}, {cite:qadan-manhaj-iqtisad-kuran s. 138}. Fitne, Allah'ı hatırlamak yerine parayla meşgul olmak ve Allah yolunda harcamayı sevmek gibi dini ve ahlaki biçimler alır; ayrıca rüşvet, tefecilik ve rüşvet gibi insanlarla uğraşma biçimleri {cite:qadan-manhaj-iqtisad-kuran s. 138}, {cite:qadan-manhaj-iqtisad-kuran s. 139}, {cite:qadan-manhaj-iqtisad-kuran s. 140}, {cite:qadan-manhaj-iqtisad-kur'an s. 141} gibi biçimler alır. Ekonomi alanında, paranın birincil işlevi olan değişimden sapması durumunda kötülük ve sonuçların kaynağı haline geldiğine inanır {cite:qadan-manhaj-iqtisad-kur'an s. 142}, {cite:qadan-manhaj-iqtisad-kuran s. 145}."
  id: "Qa'adat melihat uang sebagai godaan bagi manusia, dan itu adalah cara unik Setan untuk mencoba, dan melalui keserakahan dan keserakahan itulah seseorang melakukan kejahatan {cite:qadan-manhaj-iqtisad-quran hlm. 137}, {cite:qadan-manhaj-iqtisad-quran hlm. 138}. Fitnah mengambil bentuk keagamaan dan moral, seperti terlalu sibuk dengan uang daripada mengingat Tuhan dan mencintai pengeluaran di jalan Tuhan, serta bentuk berurusan dengan orang seperti suap, riba, dan suap {cite:qadan-manhaj-iqtisad-quran hlm. 138}, {cite:qadan-manhaj-iqtisad-quran hlm. 139}, {cite:qadan-manhaj-iqtisad-quran hlm. 140}, {cite:qadan-manhaj-iqtisad-quran hlm. 140}, {cite:qadan-manhaj-iqtisad-quran hlm. 141}. Dalam bidang ekonomi, ia percaya bahwa jika uang menyimpang dari fungsi utamanya, yaitu pertukaran, maka uang menjadi sumber kejahatan dan konsekuensi {cite:qadan-manhaj-iqtisad-quran hlm. 142}, {cite:qadan-manhaj-iqtisad-quran hlm. 145}."
