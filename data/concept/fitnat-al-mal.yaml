label:
  ar: فتنة المال
  en: "The trial of wealth (fitnat al-mal)"
summary:
  ar: "يرى قعدات أن المال فتنة للإنسان، وهو وسيلة الشيطان الفريدة في الإغواء، والإنسان بطمعه وجشعه هو الذي يقحمه على فعل الشر {cite:qadan-manhaj-iqtisad-quran p. 137}، {cite:qadan-manhaj-iqtisad-quran p. 138}. وتتخذ الفتنة صوراً دينية وأخلاقية، كالانشغال بالمال عن ذكر الله، وحب الإنفاق في غير سبيل الله، وصوراً في التعامل مع الناس كالتطفيف والربا والرشوة {cite:qadan-manhaj-iqtisad-quran p. 138}، {cite:qadan-manhaj-iqtisad-quran p. 139}، {cite:qadan-manhaj-iqtisad-quran p. 140}، {cite:qadan-manhaj-iqtisad-quran p. 141}. وفي المجال الاقتصادي يرى أن المال إذا خرج عن وظيفته الأساسية، وهي التبادل، صار مصدر السوء والعواقب {cite:qadan-manhaj-iqtisad-quran p. 142}، {cite:qadan-manhaj-iqtisad-quran p. 145}."
