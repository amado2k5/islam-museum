id: concept/jarh-wa-tadil
class: concept
kind: term
label:
  ar: الجرح والتعديل
  en: Criticism and vindication of narrators (jarh wa-ta'dil)
summary:
  ar: "درس الصحابة والتابعون ومن بعدهم أحوال الرواة ليميزوا الصادق من الكاذب، فعرفوا الأحفظ والأضبط والأطول مجالسة لمن فوقه، واستعانوا بالتاريخ حين كثر الكذب، وكان بعضهم يعيّن أياماً للكلام في الرجال {cite:manhaj-tawthiq-al-sunna-azhar p. 43}{cite:manhaj-tawthiq-al-sunna-azhar p. 44}. والراوي المقبول عندهم هو الثقة الضابط الفاهم العاقل البالغ السالم من خوارم المروءة والفسق، فإن اختل شرط منها رُدّت روايته، ومن أصناف من يُتوقف في روايته من اختُلف في توثيقه، أو كثر غلطه، أو ساء حفظه، أو اختلط آخر عمره {cite:manhaj-tawthiq-al-sunna-azhar p. 49}{cite:manhaj-tawthiq-al-sunna-azhar p. 50}. ويذكر المؤلف عن شعبة قاعدة ترك الحديث: كثرة الغلط، والاتهام بالكذب، وانفراده بما يخالف المعروفين {cite:manhaj-tawthiq-al-sunna-azhar p. 45}."
