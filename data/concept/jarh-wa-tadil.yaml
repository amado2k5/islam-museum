id: concept/jarh-wa-tadil
class: concept
kind: term
label:
  ar: الجرح والتعديل
  en: Criticism and vindication of narrators (jarh wa-ta'dil)
  es: "Crítica y reivindicación de los narradores (jarh wa-ta'dil)"
  fr: "Critique et justification des narrateurs (jarh wa-ta'dil)"
  ur: "راویوں کی تنقید اور تصدیق ⁦(جرح و تعدیل)⁩"
  tr: "Yaralanma ve modifikasyon"
  id: "Luka dan modifikasi"
summary:
  ar: "درس الصحابة والتابعون ومن بعدهم أحوال الرواة ليميزوا الصادق من الكاذب، فعرفوا الأحفظ والأضبط والأطول مجالسة لمن فوقه، واستعانوا بالتاريخ حين كثر الكذب، وكان بعضهم يعيّن أياماً للكلام في الرجال {cite:manhaj-tawthiq-al-sunna-azhar p. 43}{cite:manhaj-tawthiq-al-sunna-azhar p. 44}. والراوي المقبول عندهم هو الثقة الضابط الفاهم العاقل البالغ السالم من خوارم المروءة والفسق، فإن اختل شرط منها رُدّت روايته، ومن أصناف من يُتوقف في روايته من اختُلف في توثيقه، أو كثر غلطه، أو ساء حفظه، أو اختلط آخر عمره {cite:manhaj-tawthiq-al-sunna-azhar p. 49}{cite:manhaj-tawthiq-al-sunna-azhar p. 50}. ويذكر المؤلف عن شعبة قاعدة ترك الحديث: كثرة الغلط، والاتهام بالكذب، وانفراده بما يخالف المعروفين {cite:manhaj-tawthiq-al-sunna-azhar p. 45}."
  tr: "Sahabeler, Takipçiler ve onlardan sonra gelenler, anlatıcıların koşullarını inceleyerek doğruyu yalancıdan ayırt ederek, üstlerindekilere en ezberli, kesin ve en uzun yoldaşları ayırt ettiler ve yalan yaygınlaştığında tarihten yararlandılar. Bazıları insanlardan bahsetmek için günler ayırdı {cite:manhaj-tawthiq-al-sunna-azhar s. 43}{cite:manhaj-tawthiq-al-sunna-azhar s. 44}}. Aralarındaki kabul edilen anlatıcı, güvenilir, kesin, anlayışlı, makul, olgun ve şövalyelik ile ahlaksızlık kirlerinden arınmış biridir. Bu koşullardan biri geçersizse, rivayeti reddedilir. Rivayeti kesilenler arasında, doğruluğu farklı, hataları sık, hafızası zayıf olan ya da sonraki yaşamı karışık olan biri vardır {atıf:manhaj-tavsiq-al-sunna-azhar s. 49} {atıf:manhaj-tavsiq-al-sunna-azhar s. 50}. Yazar, hadisten vazgeçme kuralının bir dalından bahseder: sık sık hatalar, yalan suçlamaları ve bilinen konuda ayrıcalıklılık {atıf:manhaj-tavsiq-al-sunna-azhar s. 45}."
  id: "Para Sahabat, Pengikut, dan mereka yang datang setelah mereka mempelajari kondisi narator untuk membedakan yang benar dari yang berbohong, mengenali sahabat yang paling mudah dihafal, tepat, dan terlama bagi mereka yang di atasnya, dan mereka menggunakan sejarah ketika kebohongan menjadi meluas. Beberapa dari mereka menetapkan hari-hari untuk berbicara tentang manusia {cite:manhaj-tawthiq-al-sunna-azhar hlm. 43}{cite:manhaj-tawthiq-al-sunna-azhar hlm. 44}. Narator yang diterima di antara mereka adalah seorang yang dapat dipercaya, tepat, pengertian, masuk akal, dewasa, dan bebas dari kotoran kesatria dan ketidakmoralan. Jika salah satu syarat ini tidak valid, narasinya ditolak. Di antara mereka yang narasinya dihentikan adalah yang autentikasinya berbeda, atau sering kesalahan, atau ingatannya buruk, atau kehidupan selanjutnya campur aduk {cite:manhaj-tawthiq-al-sunna-azhar hlm. 49} {cite:manhaj-tawthiq-al-sunna-azhar hlm. 50}. Penulis menyebutkan cabang aturan meninggalkan hadits: kesalahan yang sering terjadi, tuduhan berbohong, dan eksklusivitas dalam apa yang diketahui {cite:manhaj-tawthiq-al-sunna-azhar hlm. 45}."
