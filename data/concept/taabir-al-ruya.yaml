id: concept/taabir-al-ruya
class: concept
kind: term
label:
  ar: تعبير الرؤيا
  en: Dream interpretation
  ur: خواب کی تعبیر
  es: "Interpretación de los sueños"
  fr: "Interprétation des rêves"
summary:
  ar: "علم يفك رموز الرؤيا إلى مؤولاتها؛ وهبه الله ليوسف فأول رؤيا الملك: سبع بقرات سمان سبع سنين وسبع عجاف سبع سنين — باب من أبواب الغيب لا يملكه إلا من أوتيه."
  en: "The knowledge that unwraps a dream's symbols into their outcomes; God gave it to Yusuf, who read the king's dream — seven fat cows seven years, seven lean seven years. A door of the unseen granted only to whom it is given."
  ur: "وہ علم جو خواب کی علامتوں کو ان کے انجام تک پہنچاتا ہے؛ اللہ نے یوسف کو دیا، اس نے بادشاہ کے خواب کی تعبیر کی — سات موٹی گائیں سات برس، سات دبلی سات برس۔ غیب کا دروازہ صرف اسے ملتا ہے جسے دیا جائے۔"
  es: "El conocimiento que descifra los símbolos de un sueño y revela sus consecuencias; Dios se lo concedió a Yusuf, quien interpretó el sueño del rey: siete vacas gordas durante siete años y siete vacas flacas durante siete años. Una puerta a lo invisible, otorgada solo a quien se le concede."
  fr: "La connaissance qui décrypte les symboles d'un rêve et révèle sa signification; Dieu l'a donnée à Yusuf, qui a interprété le rêve du roi: sept vaches grasses pendant sept ans, sept vaches maigres pendant sept ans. Une porte vers l'invisible, accessible seulement à celui à qui elle est ouverte."
