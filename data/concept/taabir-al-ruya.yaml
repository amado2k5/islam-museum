label:
  ar: تعبير الرؤيا
  en: Dream interpretation
  ur: خواب کی تعبیر
summary:
  ar: "علم يفك رموز الرؤيا إلى مؤولاتها؛ وهبه الله ليوسف فأول رؤيا الملك: سبع بقرات سمان سبع سنين وسبع عجاف سبع سنين — باب من أبواب الغيب لا يملكه إلا من أوتيه."
  en: "The knowledge that unwraps a dream's symbols into their outcomes; God gave it to Yusuf, who read the king's dream — seven fat cows seven years, seven lean seven years. A door of the unseen granted only to whom it is given."
  ur: "وہ علم جو خواب کی علامتوں کو ان کے انجام تک پہنچاتا ہے؛ اللہ نے یوسف کو دیا، اس نے بادشاہ کے خواب کی تعبیر کی — سات موٹی گائیں سات برس، سات دبلی سات برس۔ غیب کا دروازہ صرف اسے ملتا ہے جسے دیا جائے۔"
