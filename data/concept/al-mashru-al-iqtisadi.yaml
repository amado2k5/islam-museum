  ar: المشروع الاقتصادي
  en: "The economic enterprise (al-mashru al-iqtisadi)"
summary:
  ar: "يرى قعدات أن المشروع الإنتاجي هو الذي يباركه الاقتصاد الإسلامي، ويجب أن يبدأ باسم الله، لأن تشكيل أي مشروع يرتب علاقات جديدة بين عناصره، وبمقدار توازن هذه العلاقات يكون الاقتصاد عادلاً وأخلاقياً {cite:qadan-manhaj-iqtisad-quran p. 89}. ويضع ست خصائص للمشروع: الشورى في القرار، ووقف التسلط الفردي ورأس المال، والاستخدام الأمثل للموارد، ومنع الاحتكار، واستبدال الحافز الروحي بالحافز المادي المهيمن {cite:qadan-manhaj-iqtisad-quran p. 90}. ثم يعرض ثلاثة أشكال: المشروع الفردي، والجمعية التعاونية، والمؤسسة الشعبية {cite:qadan-manhaj-iqtisad-quran p. 90}."
