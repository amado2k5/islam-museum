"summary":
  "ar": "من الأمور المشتركة الفصد: أما في الابتداء فمن الجانب المخالف أعجله من الصافن\
    \ المحاذي في الطول وبعده من الباسليق المحاذي في العرض وبعده الأكحل المحاذي في\
    \ العرض فإن لم يظهر فلا يجب أن تترك فصد القيفال وإن كان نفعه أقل وأبطأ، ثم بعد\
    \ أيام فمن الجانب الموافق في العرض، وقد يحجم على الصدر وبالشرط أيضاً حتى يجذب\
    \ المادة إلى خارج ويقللها خصوصاً إذا كان سبق فصد. وأما الأغذية فأشربة هذا الجنس\
    \ الرقيقة الملينة المنقية وما يجري مجرى الأدوية فجميع ما ينقي ويزيل الخشونة ويلين\
    \ في الدرجة الأولى من هذا الجنس وهذا كله قبل الانفجار، وأفضل الجاليات المنقية\
    \ ماء العسل إن لم يكن ورم في سائر الأحشاء فإن كان ورم واستعمل وجب حينئذ أن يصير\
    \ كالماء بكثرة المزاج والجلاب وماء السكر أوفق منه وبعده ماء الشعير، وإذا مزج بالماء\
    \ فإن السكنجبين المتخذ من هذا الجنس يجمع معاني من التطفئة والتنقية فإن حمض جداً\
    \ فإنه إما أن ينفث جداً وإما أن يبرد ويلزج جداً فيصير فيه وبال حتى إن ما يقطعه\
    \ ربما احتاج إلى قوة قوية حتى ينفث فإن كان لا بد من الحامض فيجب أن يسقى مفتراً\
    \ أو ممزوجاً بماء حار قليلاً قليلاً، وأما المعتدل الحموضة فإنه يؤمن هذه الغائلة\
    \ ويكون مانعاً لضرر الحلاوة من التعطيش وإثارة المرة وتوليدها، وماء العسل أبلغ\
    \ في الترطيب وماء الشعير في التقوية، وربما احتيج في تعديل الطبيعة إلى أن يعطى\
    \ الحماض مع دهن من هذا الجنس. وأما ما يسقونه من الماء أما في الشتاء فالماء الحار\
    \ وماء السكر وماء العسل الرقيق وأما في الصيف فالماء المعتدل ويكره لهم الماء البارد\
    \ فإن اشتد العطش سقوا قليلاً أو ممزوجاً بجلاب وسكنجبين مبردين فإن السكنجبين ينفذ\
    \ به بسرعة ويدفع مضرته ويسقون عند الانحطاط ماء مطبوخاً من هذا الجنس، وأما ما يحتاج\
    \ إليه عند الجمع والإنضاج والتفجير وبعده فنحن نفرد له باباً {cite:canon-ibn-sina-print-v2\
    \ p.358}"
  "en": "Among the common matters is venesection: at the beginning, from the opposite\
    \ side — the readiest being the saphenous lying lengthwise, then the basilic lying\
    \ crosswise, then the cephalic lying crosswise; if none appears, the venesection\
    \ of the head vein should not be left, though its benefit is less and slower;\
    \ then after days, from the agreeing side, crosswise; and cupping may be done\
    \ on the chest, and scarification too, so as to draw the matter outward and lessen\
    \ it, especially if a venesection went before. As for the foods: thin, softening,\
    \ cleansing drinks of this kind; and what runs the course of drugs is all that\
    \ cleanses, removes the roughness and softens in the first degree — of this kind\
    \ — and all this is before the bursting. The best of the cleansing detergents\
    \ is honey-water, if there is no tumour in the rest of the inward parts; if there\
    \ is a tumour and it is used, it must then be made like water by much diluting\
    \ — julep and sugar-water are more agreeable than it, then barley-water. When\
    \ mixed with water, the oxymel made of this kind joins the meanings of quenching\
    \ and cleansing: if it turns very sour it either expectorates greatly or else\
    \ cools and thickens greatly so that harm is in it — what cuts it may need a strong\
    \ power to be expectorated — so if the sour is unavoidable it is given warmed\
    \ or mixed with a little hot water, little by little; while the moderately sour\
    \ avoids this peril and wards off the harm of sweetness: provoking thirst and\
    \ stirring and begetting bile. Honey-water goes furthest in moistening, barley-water\
    \ in strengthening; and for settling the nature a sour drink with an oil of this\
    \ kind may be needed. As for the water they are given: in winter, hot water, sugar-water\
    \ and thin honey-water; in summer, the temperate — cold water is disliked for\
    \ them, and if thirst presses they are given a little, or mixed with a cooled\
    \ julep and oxymel, for the oxymel drives it through quickly and pushes its harm\
    \ off; and at the decline they are given a cooked water of this kind. As for what\
    \ is needed at the gathering, the ripening, the bursting and after it — we set\
    \ a chapter apart for that {cite:canon-ibn-sina-print-v2 p.358}"
  "ur": "مشترک امور میں فصد ہے: ابتداء میں مخالف جانب سے سب سے پہلے لمبائی میں قائم\
    \ صافن پھر عرض میں باسليق پھر عرض میں أكحل اور اگر کوئی ظاہر نہ ہو تو سر کی رگ\
    \ کا فصد بھی نہ چھوڑا جائے اگرچہ فائدہ کم اور دیر سے ہو پھر دنوں بعد موافق جانب\
    \ سے عرض میں اور سینے پر پچھنے بھی لگائے جا سکتے ہیں اور شرط بھی تاکہ مادہ باہر\
    \ کھینچا اور کم کیا جائے خاص طور پر اگر پہلے فصد ہو چکا ہو۔ اور غذائیں اسی جنس\
    \ کی باریک نرم کرنے والی صاف کرنے والی جلائیں اور جو ادویہ کے مجرى میں ہیں وہ\
    \ سب جو صاف کریں خرخراہٹ مٹائیں اور پہلی درجہ میں نرم کریں اسی جنس کی اور یہ سب\
    \ انفجار سے پہلے ہے۔ صاف کرنے والوں میں بہترین شہد کا پانی ہے بشرطیکہ باقی احشاء\
    \ میں ورم نہ ہو اور اگر ورم ہو اور استعمال ہو تو بہت ملاکر پانی جیسا کیا جائے\
    \ جلاب اور شکر کا پانی اس سے زیادہ موافق ہے پھر جو کا پانی اور جب پانی ملا جائے\
    \ تو اس جنس کا سكنجبين بجھانے اور صاف کرنے کے معانی جمع کرتا ہے اگر بہت کھٹا ہو\
    \ جائے تو یا تو بہت نفث کراتا ہے یا بہت ٹھنڈا اور گاڑھا کرتا ہے جس میں ضرر ہے\
    \ اور جو اسے کاٹتا ہے اس کے نفث ہونے کو مضبوط قوت چاہیے لہذا اگر کھٹا ناگزیر ہو\
    \ تو ولدا یا گرم پانی میں تھوڑا تھوڑا ملاکر پلائیں اور معتدل کھٹا اس خطرے سے محفوظ\
    \ ہے اور مٹھاس کے ضرر سے بچاتا ہے یعنی پیاس لگانا اور صفراء ابھارنا اور پیدا کرنا۔\
    \ شہد کا پانی تر کرنے میں اور جو کا پانی تقویت میں زیادہ مؤثر ہے اور طبیعت درست\
    \ کرنے کے لیے کھٹا مشروب اسی جنس کے تیل کے ساتھ درکار ہو سکتا ہے۔ اور پانی جو\
    \ انہیں دیا جائے سردی میں گرم پانی شکر کا پانی اور پتلا شہد کا پانی اور گرمی میں\
    \ معتدل اور ٹھنڈا پانی ان کے لیے ناپسند اگر پیاس بڑھ جائے تو تھوڑا دیں یا ٹھنڈے\
    \ جلاب اور سكنجبين میں ملا کر کیونکہ سكنجبين اسے جلد اندر پہنچاتا اور اس کا ضرر\
    \ دور کرتا ہے اور زوال پر پکی ہوئی اسی جنس کی جلائیں پلاتے ہیں اور جو جمع انضاج\
    \ تفجير اور اس کے بعد درکار ہو اس کے لیے ہم الگ باب کریں گے {cite:canon-ibn-sina-print-v2\
    \ p.358}"
  "es": "Entre los asuntos comunes está la venesección: al principio, del lado opuesto, siendo la safena la más accesible en sentido longitudinal, luego la basílica en sentido transversal, luego la cefálica en sentido transversal; si no aparece ninguna, no se debe dejar la venesección de la vena cefálica, aunque su beneficio es menor y más lento; luego, después de unos días, del lado concordante, en sentido transversal; y se puede hacer ventosas en el pecho, y también escarificación, para extraer la materia hacia afuera y disminuirla, especialmente si se hizo una venesección previamente. En cuanto a los alimentos: bebidas ligeras, suavizantes y depurativas de este tipo; y lo que sigue el curso de los medicamentos es todo lo que limpia, elimina la aspereza y suaviza en primer grado —de este tipo— y todo esto antes de la ruptura. El mejor de los detergentes depurativos es el agua con miel, si no hay tumor en el resto de las partes internas; Si hay un tumor y se usa, entonces debe hacerse como agua diluyéndolo mucho; el julepe y el agua azucarada son más agradables que él, luego el agua de cebada. Cuando se mezcla con agua, el oxímel hecho de este tipo une los significados de apagar y limpiar: si se vuelve muy agrio o bien expectora mucho o bien enfría y espesa mucho de modo que es dañino en él; lo que corta puede requerir un poder fuerte para esperarse; por lo tanto, si el agrio es inevitable se da tibio o mezclado con un poco de agua caliente, poco a poco; mientras que el moderadamente agrio evita este peligro y evita el daño del dulzor: provocando sed y agitando y generando bilis. El agua de miel es más efectiva para humedecer, el agua de cebada para fortalecer; y para calmar la naturaleza puede ser necesaria una bebida agria con un aceite de este tipo. En cuanto al agua que se dan: en invierno, agua caliente, agua azucarada y agua de miel diluida; En verano, el agua templada-fría les resulta desagradable, y si tienen mucha sed se les da un poco, o mezclada con un julepe frío y oxímel, pues el oxímel la expulsa rápidamente y aleja su daño; y en la fase de declive se les da agua cocida de este tipo. En cuanto a lo que se necesita durante la reunión, el arrepentimiento, el estallido y después de ello, dedicamos un capítulo a ello {cite:canon-ibn-sina-print-v2 p.358}"
  "fr": "Parmi les traitements courants, on trouve la saignée: au début, du côté opposé – la plus facile étant la veine saphène longitudinale, puis la veine basilique transversale, puis la veine céphalique transversale; si aucune ne se manifeste, il ne faut pas négliger la saignée de la veine céphalique, même si son effet est moindre et plus lent; puis, quelques jours plus tard, du côté opposé, transversalement; on peut aussi pratiquer des ventouses sur la poitrine, ainsi que des scarifications, afin d’extraire la matière et de la réduire, surtout si une saignée a été effectuée auparavant. Quant à l’alimentation: des boissons légères, adoucissantes et purifiantes de ce type; et le traitement médicamenteux consiste en tout ce qui purifie, enlève les rugosités et adoucit au premier degré – de ce type – et tout cela avant l’éclatement. Le meilleur détergent purifiant est l’eau miellée, s’il n’y a pas de tumeur dans les autres parties internes. S'il y a une tumeur et que l'on utilise cette préparation, il faut la diluer fortement pour la rendre aussi liquide que de l'eau; le julep et l'eau sucrée sont plus agréables, puis l'eau d'orge. Mélangé à de l'eau, l'oxymel ainsi préparé a des propriétés désaltérantes et purifiantes: s'il devient très acide, il provoque soit une forte expectoration, soit il refroidit et s'épaissit considérablement, devenant ainsi nocif; les plaies peuvent nécessiter une forte force pour être expectorées. Si l'acidité est inévitable, on l'administre tiède ou mélangé à un peu d'eau chaude, progressivement. L'acidité modérée évite cet inconvénient et prévient les effets néfastes du sucré: provoquer la soif, l'agitation et la production de bile. L'eau miellée est la plus hydratante, l'eau d'orge la plus fortifiante; et pour calmer l'organisme, une boisson acide avec une huile de ce type peut être nécessaire. Quant à l'eau, on les administre: en hiver, eau chaude, eau sucrée et eau miellée diluée. En été, l'eau tempérée — l'eau froide — leur est désagréable, et si la soif les tenaille, on leur en donne un peu, ou mélangée à un julep refroidi et à de l'oxymel, car l'oxymel favorise l'évacuation de la soif et en neutralise les effets néfastes; et au déclin, on leur donne une eau cuite de ce type. Quant à ce qui est nécessaire lors de la récolte, de la maturation, de l'éclosion et après — nous y consacrons un chapitre entier {cite:canon-ibn-sina-print-v2 p.358}"
