label:
  ar: دار الإسلام
  en: Dar al-Islam (the abode of Islam)
  ur: دار الاسلام
summary:
  ar: 'دار الإسلام في اصطلاح الفقهاء هي كل بقعة تكون أحكام الإسلام فيها ظاهرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8047} وإذا استولى الكفار على بقعة منها صار الجهاد فرض عين على أهل تلك الناحية رجالا ونساء ثم على من يليهم حتى يعم المسلمين كافة، ويجب على أهلها إظهار شعائر الإسلام كالجمعة والجماعات والعيدين والأذان فإن امتنعوا قوتلوا، ولا يدخلها حربي إلا بأمان أو إذن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8047}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8048} واختلف الفقهاء في تحول دار الإسلام إلى دار كفر: فذهب الشافعية إلى أنها لا تصير دار كفر بحال ولو استولى عليها الكفار وأظهروا أحكامهم لخبر «الإسلام يعلو ولا يعلى عليه»؛ وذهب المالكية والحنابلة وأبو يوسف ومحمد إلى أنها تصير دار كفر بمجرد ظهور أحكام الكفر فيها؛ وذهب أبو حنيفة إلى أنها لا تصير دار كفر إلا باجتماع ثلاثة شروط: ظهور أحكام الكفر، ومتاخمتها لدار الكفر، وألا يبقى فيها مسلم ولا ذمي آمنا بالأمان الأول، معتبرا مدار الحكم على الأمن والخوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8048}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8049} ويمنع غير المسلم من استيطان جزيرة العرب باتفاق لحديث «أخرجوا المشركين من جزيرة العرب»، وقصرها الشافعية والحنابلة على الحجاز لعدم إخراج الخلفاء لهم من اليمن وتيماء، بينما عممها غيرهم من عدن إلى ريف العراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8050} واللقيط الموجود فيها يحكم بإسلامه تبعا للدار، وليس لغير المسلم إحياء مواتها ولا تملك معادنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8050}'
  en: 'Dar al-Islam in the terminology of jurists is every territory in which the rulings and institutions of Islam are manifest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8047} If non-Muslims seize any part of it, defense becomes an individual obligation (fard ''ayn) upon all inhabitants of that region, men and women alike, extending outward to neighbors until encompassing all Muslims, and its communities are obligated to maintain manifest public rites such as Friday prayers, congregational prayers, Eids, and the adhan; a harbi may not enter without safe-conduct or official permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8047}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8048} Jurists disputed whether Dar al-Islam can transform into an abode of disbelief (Dar al-Kufr): the Shafi''is hold that it never becomes Dar al-Kufr under any circumstance even if occupied and non-Muslim laws are enforced, based on the hadith "Islam prevails and is not prevailed over"; the Malikis, Hanbalis, and Abu Yusuf and Muhammad hold that it becomes Dar al-Kufr solely by the manifestation of the laws of disbelief; whereas Abu Hanifa requires three concurrent conditions: the manifestation of disbelief, contiguity with enemy territory, and that no Muslim or dhimmi remains secure under the original security, making security and fear the core criteria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8048}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8049} Non-Muslims are barred from permanent settlement in the Arabian Peninsula by consensus based on prophetic reports; Shafi''is and Hanbalis restrict this prohibition to the Hijaz because early Caliphs did not expel communities from Yemen and Tayma, whereas other jurists extend it across the peninsula from Aden to the rural borders of Iraq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8050} A foundling discovered in Dar al-Islam is legally deemed Muslim by virtue of the territory, and non-Muslims may not acquire uncultivated land through reclamation or extract its subterranean minerals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8050}'
  ur: 'فقہاء کی اصطلاح میں دار الاسلام وہ تمام خطہ ہے جہاں اسلام کے احکام اور شعائر علانیہ اور غالب ہوں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8047} اگر کفار اس کے کسی حصے پر قابض ہو جائیں تو اس علاقے کے تمام مرد و زن پر دفاع فرض عین ہو جاتا ہے اور ضرورت پڑنے پر تدریجاً تمام مسلمانوں پر محیط ہوتا ہے؛ نیز اس کے مکینوں پر جمعہ، جماعت، عیدین اور اذان جیسے شعائر قائم رکھنا واجب ہے ورنہ ان سے قتال کیا جائے گا، اور کسی حربی کو امان کے بغیر داخلے کی اجازت نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8047}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8048} دار الاسلام کے دار الکفر میں تبدیل ہونے کے بارے میں فقہاء کا اختلاف ہے: شافعیہ کا قول ہے کہ وہ کسی حال میں دار الکفر نہیں بنتا خواہ اس پر قبضہ ہو جائے اور کفر کے احکام نافذ کر دیے جائیں کیونکہ حدیث کے مطابق "الاسلام یعلو ولا یعلی علیہ"؛ جبکہ مالکیہ، حنابلہ اور ابو یوسف و محمد کے نزدیک کفر کے احکام کے غلبے سے ہی وہ دار الکفر بن جاتا ہے؛ اور امام ابو حنیفہ نے تین شروط کا اجتماع لازم قرار دیا: کفر کے احکام کا غلبہ، دار الکفر سے متصل ہونا، اور پہلے والے امان کے تحت کسی مسلم یا ذمی کے امن کا باقی نہ رہنا، کیونکہ ان کے نزدیک اصل مدار امن اور خوف پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8048}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8049} جزیرہ عرب میں غیر مسلموں کی مستقل رہائش بالاتفاق ممنوع ہے؛ شافعیہ اور حنابلہ نے اس سے مراد صرف حجاز لیا کیونکہ خلفاء نے یمن اور تیماء سے غیر مسلموں کو نہیں نکالا تھا، جبکہ دیگر فقہاء نے اسے عدن سے عراق کے دیہی علاقوں تک عام رکھا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8050} دار الاسلام میں پایا جانے والا لاوارث بچہ دار کے تابع ہو کر مسلمان شمار ہوتا ہے، اور غیر مسلم کے لیے اس کی بنجر زمین کو آباد کرنا یا معدنیات نکال کر مالک بننا جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8050}'
