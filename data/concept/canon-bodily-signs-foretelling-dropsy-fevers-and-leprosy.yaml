id: concept/canon-bodily-signs-foretelling-dropsy-fevers-and-leprosy
class: concept
kind: scientific
label:
  ar: "علامات بدنية تنذر بالاستسقاء والحميات والجذام"
  en: "Bodily signs foretelling dropsy, fevers and leprosy in the Canon"
  fr: "Signes annonçant hydropisie, fièvres et lèpre dans le Canon"
  ur: "استسقا، بخاروں اور جذام کی خبر دینے والی بدنی علامات قانون میں"
  es: "Signos corporales que presagian hidropesía, fiebres y lepra en el Canon"
summary:
  ar: "يضيف ابن سينا علامات بدنية أخرى: احمرار الوجه وانتفاخه مع كمودة إذا دام أنذر بالجذام، وثقل البدن مع درور العروق يوجب الفصد، وانتشار التهيج في الوجه والأجفان والأطراف يوجب تدارك الكبد خشية الاستسقاء، وشدة نتن البراز تنذر بالحميات {cite:canon-ibn-sina-print-v1 p.260}."
  en: "Ibn Sina adds further bodily signs: a face reddened and swollen with a dusky tinge, if it persists, foretells leprosy; heaviness of the body with distended vessels calls for venesection; irritation spreading over face, eyelids and limbs calls for care of the liver lest dropsy follow; and a fiercely foul stool foretells fevers {cite:canon-ibn-sina-print-v1 p.260}."
  fr: "Selon Ibn Sina, rougeur et gonflement sombres persistants du visage annonceraient la lèpre ; lourdeur corporelle et vaisseaux distendus appelleraient la saignée ; irritation du visage, des paupières et des membres, soins du foie pour prévenir l’hydropisie ; selles très fétides, fièvres {cite:canon-ibn-sina-print-v1 p.260}."
  es: "Ibn Sina añade más signos corporales: un rostro enrojecido e hinchado con un tono oscuro, si persiste, presagia lepra; pesadez en el cuerpo con vasos distendidos requiere flebotomía; irritación que se extiende por el rostro, los párpados y las extremidades requiere cuidado del hígado para evitar hidropesía; y heces muy fétidas presagian fiebres {cite:canon-ibn-sina-print-v1 p.260}."
  ur: "ابن سینا مزید جسمانی علامات کا اضافہ کرتے ہیں: ایک چہرہ سرخ اور سوجی ہوا دھول دار رنگ کے ساتھ، اگر یہ برقرار رہے تو، جذام کی پیش گوئی کرتا ہے۔ کشیدہ وریدوں کے ساتھ جسم کا بھاری پن وینسییکشن کا مطالبہ کرتا ہے۔ چہرے، پلکوں اور اعضاء پر پھیلنے والی جلن جگر کی دیکھ بھال کا مطالبہ کرتی ہے ایسا نہ ہو کہ ڈراپسی کا پیچھا ہو جائے۔ اور شدید گندا پاخانہ بخار کی پیشین گوئی کرتا ہے {حوالہ:کینن-ابن سینا-پرنٹ-v1 صفحہ 260}۔"
