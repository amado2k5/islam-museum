label: { ar: "علامات بدنية تنذر بالاستسقاء والحميات والجذام", en: "Bodily signs foretelling dropsy, fevers and leprosy in the Canon", ur: "استسقا، بخاروں اور جذام کی خبر دینے والی بدنی علامات قانون میں" }
summary:
  ar: "يضيف ابن سينا علامات بدنية أخرى: احمرار الوجه وانتفاخه مع كمودة إذا دام أنذر بالجذام، وثقل البدن مع درور العروق يوجب الفصد، وانتشار التهيج في الوجه والأجفان والأطراف يوجب تدارك الكبد خشية الاستسقاء، وشدة نتن البراز تنذر بالحميات {cite:canon-ibn-sina-print-v1 p.260}."
  en: "Ibn Sina adds further bodily signs: a face reddened and swollen with a dusky tinge, if it persists, foretells leprosy; heaviness of the body with distended vessels calls for venesection; irritation spreading over face, eyelids and limbs calls for care of the liver lest dropsy follow; and a fiercely foul stool foretells fevers {cite:canon-ibn-sina-print-v1 p.260}."
