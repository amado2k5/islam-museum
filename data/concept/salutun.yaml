summary:
  ar: "سلوثون في الكتاب نبات ينقل عن ديسقوريدوس أن بعض الناس زعم أن أهل الشام يسمونه العنكبوت، وله ورق شبيه بالأبيض من خامالاون، ويؤكل رطباً مع الملح والدهن بعد السلق، وفي الكتاب أن لبنه أو دمعته المستخرجة من أصله يقيئ بإفراط {cite:canon-ibn-sina-print-v1 p.608}"
  en: "Salutun is in the book a plant for which, from Dioscorides, some people claimed that the people of al-Sham call it the spider, with a leaf like the white khamalawn, eaten fresh after boiling with salt and oil; the book says its milk or tear drawn from its root causes violent vomiting {cite:canon-ibn-sina-print-v1 p.608}"
  ur: "سلوثون کتاب میں ایک پودا ہے جس کے بارے میں دیسقوریدوس سے نقل ہے کہ بعض لوگوں کا دعویٰ ہے کہ اہل شام اسے عنکبوت کہتے ہیں، اس کا پتا خاماالاون کے سفید جیسا ہے، اور اسے تر ہونے پر ابال کر نمک اور تیل کے ساتھ کھایا جاتا ہے؛ کتاب میں ہے کہ اس کا دودھ یا اس کی جڑ سے نکلا ہوا آنسو شدید قے لاتا ہے {cite:canon-ibn-sina-print-v1 p.608}۔"
