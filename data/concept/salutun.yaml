summary:
  ar: "سلوثون في الكتاب نبات ينقل عن ديسقوريدوس أن بعض الناس زعم أن أهل الشام يسمونه العنكبوت، وله ورق شبيه بالأبيض من خامالاون، ويؤكل رطباً مع الملح والدهن بعد السلق، وفي الكتاب أن لبنه أو دمعته المستخرجة من أصله يقيئ بإفراط {cite:canon-ibn-sina-print-v1 p.608}"
  en: "Salutun is in the book a plant for which, from Dioscorides, some people claimed that the people of al-Sham call it the spider, with a leaf like the white khamalawn, eaten fresh after boiling with salt and oil; the book says its milk or tear drawn from its root causes violent vomiting {cite:canon-ibn-sina-print-v1 p.608}"
  ur: "سلوثون کتاب میں ایک پودا ہے جس کے بارے میں دیسقوریدوس سے نقل ہے کہ بعض لوگوں کا دعویٰ ہے کہ اہل شام اسے عنکبوت کہتے ہیں، اس کا پتا خاماالاون کے سفید جیسا ہے، اور اسے تر ہونے پر ابال کر نمک اور تیل کے ساتھ کھایا جاتا ہے؛ کتاب میں ہے کہ اس کا دودھ یا اس کی جڑ سے نکلا ہوا آنسو شدید قے لاتا ہے {cite:canon-ibn-sina-print-v1 p.608}۔"
  es: "En el libro, Salutun es una planta que, según Dioscórides, algunos afirman que la gente de al-Sham llama araña, con una hoja parecida al khamalawn blanco, que se come fresca después de hervirla con sal y aceite; el libro dice que su savia o lágrima extraída de su raíz provoca vómitos violentos {cite:canon-ibn-sina-print-v1 p.608}."
  fr: "Salutun est mentionné dans le livre comme une plante que, d'après Dioscoride, certains affirmaient que les habitants du Levant appelaient « araignée », avec une feuille semblable à la khamalawn blanche, consommée fraîche après avoir été bouillie avec du sel et de l'huile; le livre dit que son lait ou sa larme extraite de sa racine provoque de violents vomissements {cite:canon-ibn-sina-print-v1 p.608}"
  tr: "Kitapta tembellik, Dioscorides'ten alıntılanan bir bitkidir; bazı kişiler Levant halkının ona örümcek dediğini iddia eder ve beyaz yaprakları Khamalaon'dan yapılır, haşlandıktan sonra taze tuz ve yağla yenir. Kitap, kökünden çıkarılan süt veya gözyaşının aşırı kusduğunu belirtir {cite:canon-ibn-sina-print-v1 s.608}"
  id: "Slothon dalam buku adalah tanaman yang dikutip dari Dioscorides yang beberapa orang klaim oleh orang-orang Levant menyebutnya laba-laba, dan daunnya putih terbuat dari Khamalaon, dimakan segar dengan garam dan lemak setelah direbus. Buku tersebut menyatakan bahwa susu atau air mata yang diambil dari akarnya memuntahkan secara berlebihan {cite:canon-ibn-sina-print-v1 hlm.608}"
