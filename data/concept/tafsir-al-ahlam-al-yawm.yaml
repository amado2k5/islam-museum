id: concept/tafsir-al-ahlam-al-yawm
class: concept
kind: social
label:
  ar: "تفسير الأحلام اليوم — تعبير للرؤيا أم بيع للأوهام"
  en: "Dream interpretation today — reading the vision or selling illusions"
  ur: "آج کل خوابوں کی تعبیر — رؤیا کی تعبیر یا اوہام کی فروخت"
issue:
  ar: "هل تفسير الأحلام كما يُمارس اليوم في القنوات والمواقع والهواتف علم له أصول شرعية، أم وهم واستغلال، وما الفرق بين الرؤيا والحلم، ومن يحق له أن يعبّر؟"
  en: "Is dream interpretation as practised today on channels, websites and phone lines a discipline with shar'i foundations, or illusion and exploitation; what separates a vision from a dream; and who may interpret?"
  ur: "کیا آج چینلوں، ویب سائٹوں اور فون لائنوں پر کی جانے والی خوابوں کی تعبیر شرعی بنیادوں والا علم ہے یا وہم اور استحصال؛ رؤیا اور خواب میں کیا فرق ہے؛ اور کون تعبیر کر سکتا ہے؟"
summary:
  ar: "حلقة «الوسطية» عن تفسير الأحلام. قال جمهور الاستوديو: 33% لم يلجؤوا إلى مفسر قط، و39% قليلاً، و28% كثيراً؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:09:00} وقال 46% إن المفسرين المشهورين يخطئون في الغالب. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:06:30} وتحاور مفسر أحلام وطبيب نفسي وأستاذ فقه ومستشار شرعي، واتفقوا على أن الأحلام لا يُبنى عليها حكم شرعي؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:14:30} وختم المقدّم بالدعوة إلى بذل الجهد في الواقع وتحويل أحلام الأمة نفسها إلى واقع. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:25:00}"
  en: "The 'Al-Wasatiyya' episode on dream interpretation. The studio audience said 33% had never turned to an interpreter, 39% a little and 28% often; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:09:00} 46% said the famous interpreters are mostly wrong. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:06:30} A dream interpreter, a psychiatrist, a professor of fiqh and a shar'i counsellor debated, and agreed that no shar'i ruling is built on dreams; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:14:30} the presenter closed by calling for effort in the real world and for turning the umma's own dreams into reality. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:25:00}"
  ur: "خوابوں کی تعبیر پر «الوسطیہ» کی قسط۔ اسٹوڈیو حاضرین میں سے 33% نے کہا کہ وہ کبھی کسی معبر کے پاس نہیں گئے، 39% نے تھوڑا اور 28% نے بہت؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:09:00} 46% نے کہا کہ مشہور معبر اکثر غلطی کرتے ہیں۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:06:30} ایک معبر، ایک ماہرِ نفسیات، فقہ کے ایک استاد اور ایک شرعی مشیر نے بحث کی اور اس پر اتفاق کیا کہ خوابوں پر کوئی شرعی حکم نہیں بنتا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:14:30} میزبان نے حقیقی دنیا میں محنت اور امت کے اپنے خوابوں کو حقیقت بنانے کی دعوت پر اختتام کیا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:25:00}"
sensitivity: contested
perspectives:
- tradition: sunni
  id: permitted-not-a-source-of-law
  stance:
    ar: "التعبير جائز في أصله لغير الأنبياء، لكنه ظني لا يُبنى عليه حكم ولا ترجيح"
    en: "Interpretation is permitted in principle for non-prophets, but it is conjecture on which no ruling or preference is built"
    ur: "تعبیر اصلاً غیر انبیاء کے لیے جائز ہے، مگر یہ ظنی ہے جس پر کوئی حکم یا ترجیح نہیں بنتی"
  summary:
    ar: "رأى أستاذ الفقه سامي الماجد أن تعبير الرؤى ليس مرفوضاً شرعاً، وأن رؤيا الأنبياء وحي لا يُقاس عليها، وأن المبشرات لا تُفهم إلا بتعبير؛ لكن التعبير موهبة وفراسة تضبطها القواعد لا علم مكتسب، ولا نص يجعله من مقاصد الشرع، وهو ليس مصدراً للتشريع ولا للترجيح، والمعبّرون يخطئون ويصيبون {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:48:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:13:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:20:30}."
    en: "The fiqh professor Sami al-Majid held that interpreting visions is not rejected by the sharia, that prophets' visions are revelation and admit no analogy, and that glad-tiding visions are understood only through interpretation; but interpretation is a gift and insight disciplined by rules, not an acquired science, no text makes it an aim of the sharia, it is no source of legislation or of preference between views, and interpreters err and hit {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:48:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:13:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:20:30}."
    ur: "فقہ کے استاد سامی الماجد کے نزدیک رؤیا کی تعبیر شرعاً مردود نہیں، انبیاء کی رؤیا وحی ہے جس پر قیاس نہیں، اور بشارت والے خواب تعبیر ہی سے سمجھے جاتے ہیں؛ مگر تعبیر ایک صلاحیت اور فراست ہے جسے قواعد منضبط کرتے ہیں، اکتسابی علم نہیں؛ کوئی نص اسے مقاصدِ شریعت میں نہیں بناتی، یہ نہ تشریع کا ماخذ ہے نہ ترجیح کا، اور معبر غلط بھی ہوتے ہیں اور درست بھی {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:32:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:20:30}."
