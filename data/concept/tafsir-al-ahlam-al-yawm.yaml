- tradition: sunni
  id: gift-with-conditions
  stance:
    ar: "التعبير موهبة لها أصول، يمارسها عالم أو ناصح بلا أجر"
    en: "Interpretation is a gift with foundations, practised by a scholar or sincere adviser without fee"
    ur: "تعبیر بنیادوں والی صلاحیت ہے، جسے کوئی عالم یا خیرخواہ بلا معاوضہ انجام دے"
  summary:
    ar: "قال مفسر الأحلام الأستاذ حامد إن التعبير موهبة في البداية ثم تضبطها أصول مستنبطة من القرآن والحديث واللغة العربية والأمثال، وإن المعبّر ينبغي أن يكون معروفاً بالخلفية الدينية والاستقامة والنصح، وإنه هو لا يأخذ أجراً، ويميّز الرؤيا من غيرها بسياق المنام ووضوح رمزه وترابطه {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:45:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:46:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:46:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:47:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:55:00}."
    en: "The dream interpreter, Mr Hamid, said interpretation begins as a gift and is then disciplined by foundations drawn from the Qur'an, the hadith, the Arabic language and proverbs; that an interpreter should be known for religious grounding, uprightness and good counsel; that he himself takes no fee; and that he tells a true vision from other dreams by the dream's context and the clarity and coherence of its symbol {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:45:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:46:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:46:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:47:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:55:00}."
    ur: "معبر استاد حامد نے کہا کہ تعبیر ابتدا میں ایک صلاحیت ہے جسے پھر قرآن، حدیث، عربی زبان اور ضرب الامثال سے مستنبط بنیادیں منضبط کرتی ہیں؛ معبر دینی پس منظر، استقامت اور خیرخواہی کے لیے معروف ہو؛ وہ خود کوئی معاوضہ نہیں لیتے؛ اور خواب کے سیاق اور اس کی علامت کی وضاحت اور ربط سے رؤیا کو دوسرے خوابوں سے الگ کرتے ہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:46:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:47:30}."
  holders: []
