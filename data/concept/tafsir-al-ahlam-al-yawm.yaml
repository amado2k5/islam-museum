- tradition: sunni
  id: close-the-door
  stance:
    ar: "يُغلق باب التعبير عن بُعد، فمضاره اليوم أكثر من نفعه"
    en: "Close the door to remote interpretation; today its harm exceeds its benefit"
    ur: "دور سے تعبیر کا دروازہ بند کیا جائے؛ آج اس کا نقصان فائدے سے زیادہ ہے"
  summary:
    ar: "قال المستشار الشرعي في موقع إسلام أونلاين الدكتور رجب إن قسم الفتوى في الموقع فوجئ قبل نحو عشر سنوات بأن كثيراً من الأسئلة طلبات تعبير، فأغلقوا هذا الباب لأنه هروب من الواقع ولأن الرؤى ليست مصدراً للتشريع؛ ورأى أن الرؤى الكبرى التي تظهر في الأزمات تجعل الناس ينتظرون النصر من الخارج، وأن التعبير عبر التلفزيون والإنترنت والهاتف شديد الخطورة، ولا ميزان يُعرف به صاحب الموهبة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:35:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:36:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:37:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:37:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:53:30}."
    en: "The shar'i counsellor of the IslamOnline website, Dr Rajab, said that about ten years earlier the site's fatwa section found that many of its questions were requests for interpretation, so they closed that door, since it is an escape from reality and visions are no source of legislation; he held that the grand visions that surface in crises make people wait for victory from outside, that interpretation by television, internet and telephone is very dangerous, and that there is no measure by which a gifted interpreter can be known {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:35:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:36:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:37:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:37:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:53:30}."
    ur: "اسلام آن لائن ویب سائٹ کے شرعی مشیر ڈاکٹر رجب نے کہا کہ تقریباً دس سال پہلے سائٹ کے فتویٰ شعبے کو معلوم ہوا کہ بہت سے سوالات تعبیر کی درخواستیں ہیں، تو انہوں نے یہ دروازہ بند کر دیا کیونکہ یہ حقیقت سے فرار ہے اور رؤیا تشریع کا ماخذ نہیں؛ ان کے نزدیک بحرانوں میں ابھرنے والے بڑے خواب لوگوں کو باہر سے فتح کا منتظر بنا دیتے ہیں، ٹی وی، انٹرنیٹ اور فون پر تعبیر بہت خطرناک ہے، اور کوئی پیمانہ نہیں جس سے صاحبِ صلاحیت پہچانا جائے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:36:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:53:30}."
