- tradition: academic
  id: psychiatry-not-a-science
  stance:
    ar: "منظور الطب النفسي: الحلم ظاهرة فسيولوجية ونفسية، وتفسيره ليس علماً"
    en: "Psychiatric view: dreaming is a physiological and psychological phenomenon, and interpreting it is not a science"
    ur: "نفسیاتی طب کا نقطۂ نظر: خواب جسمانی و نفسیاتی مظہر ہے، اور اس کی تعبیر علم نہیں"
  summary:
    ar: "رأى أستاذ الطب النفسي الدكتور محمد المهدي أنه لا فرق لغوياً ولا اصطلاحياً ولا علمياً بين الحلم والرؤيا، وأن للأحلام ثلاثة مصادر، وأن تفسيرها يقع في أدنى درجات المعرفة بين الانطباع والملاحظة لأن رموزها تختلف باختلاف الثقافة والشخص، وأن الهوس بها هروب من الإنجاز في الواقع، ودعا إلى دراسة الظاهرة علمياً {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:50:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:51:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:23:00}."
    en: "The psychiatry professor Dr Muhammad al-Mahdi held that there is no linguistic, technical or scientific difference between a dream and a vision, that dreams have three sources, that interpreting them sits at the lowest levels of knowledge, between impression and observation, because their symbols vary with culture and person, that obsession with them is an escape from achievement in reality, and he called for studying the phenomenon scientifically {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:50:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:51:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:23:00}."
    ur: "نفسیاتی طب کے استاد ڈاکٹر محمد المہدی کے نزدیک خواب اور رؤیا میں نہ لغوی فرق ہے نہ اصطلاحی نہ علمی؛ خوابوں کے تین ماخذ ہیں؛ ان کی تعبیر علم کے نچلے درجوں، تاثر اور مشاہدے، میں آتی ہے کیونکہ علامتیں ثقافت اور شخص کے ساتھ بدلتی ہیں؛ ان کا جنون حقیقت میں کامیابی سے فرار ہے؛ اور انہوں نے اس مظہر کے علمی مطالعے کی دعوت دی {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:23:00}."
