- tradition: sunni
  id: presenter-recurrence-and-reality
  stance:
    ar: "رأي المقدّم: الرؤيا حلم يتكرر، والجهد يُبذل في الواقع لا في الأحلام"
    en: "The presenter's view: a vision is a dream that recurs, and effort belongs in reality, not in dreams"
    ur: "میزبان کی رائے: رؤیا وہ خواب ہے جو دہرایا جائے، اور محنت حقیقت میں ہو، خوابوں میں نہیں"
  summary:
    ar: "رأي المقدّم (رأي المتحدث): اطمأنّ بعد دراسة وتأمل شرعي وقراءة إلى أن الرؤيا عند غير الأنبياء حلم يتكرر، وما لم يتكرر فلا وزن له عنده؛ وقال إنه لم يلجأ إلى مفسر قط، ودعا إلى ترك هذا الأمر الغيبي الذي لا ينبني عليه عمل، فما كان حقاً سيقع فُسِّر أو لم يُفسَّر {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:23:30}."
    en: "The presenter's view (speaker's opinion): after study, shar'i reflection and reading he settled on the view that for non-prophets a vision is a dream that recurs, and one that does not recur carries no weight for him; he said he has never consulted an interpreter, and called for leaving this unseen matter on which no action is built, since what is true will happen whether interpreted or not {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 00:05:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:23:30}."
    ur: "میزبان کی رائے (مقرر کی رائے): مطالعے، شرعی غور اور پڑھنے کے بعد وہ اس پر مطمئن ہوئے کہ غیر انبیاء کے لیے رؤیا وہ خواب ہے جو دہرایا جائے، اور جو نہ دہرایا جائے ان کے نزدیک بے وزن ہے؛ انہوں نے کہا کہ وہ کبھی کسی معبر کے پاس نہیں گئے، اور اس غیبی معاملے کو چھوڑنے کی دعوت دی جس پر عمل نہیں بنتا، کیونکہ جو حق ہے وہ تعبیر ہو یا نہ ہو واقع ہو گا {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep36 01:23:30}."
