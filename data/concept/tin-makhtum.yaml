label:
  ar: "طين مختوم"
  en: "Tin makhtum (sealed earth)"
  ur: "طین مختوم"
  es: "Tin makhtum (tierra sellada)"
  fr: "Tin makhtum (terre scellée)"
summary:
  ar: "طين أحمر يجلب من تل يسمى بحيرة، يختم ويعرف بالطين الكاهني؛ أجوده الذي له رائحة الشبث؛ يحبس الدم ويقوم مقام قطع الدم، ويستعمل في الأورام والجراحات والقروح والسموم."
  en: "A red earth brought from a hill called Buhayra, sealed in form and called the priestly earth; the best has a smell of dill. It stops blood and is used for swellings, wounds, ulcers and poisons."
  ur: "سرخ مٹی، جو بحیرہ نامی ایک ٹیلے سے لائی جاتی ہے، مہر بند شکل میں ملتی ہے اور اسے کاہنی مٹی کہا جاتا ہے؛ بہترین وہ ہے جس میں شبت کی خوشبو ہو۔ یہ خون روکتی ہے اور سوجن، زخموں، قروح اور زہروں میں استعمال ہوتی ہے۔"
  es: "Una tierra roja traída de una colina llamada Buhayra, sellada y denominada tierra sacerdotal; la mejor tiene aroma a eneldo. Detiene las hemorragias y se usa para hinchazones, heridas, úlceras y venenos."
  fr: "Une terre rouge provenant d'une colline appelée Buhayra, scellée et nommée terre sacerdotale; la meilleure a un parfum d'aneth. Elle est hémostatique et utilisée contre les gonflements, les plaies, les ulcères et les empoisonnements."
