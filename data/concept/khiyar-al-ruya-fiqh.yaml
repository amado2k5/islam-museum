id: concept/khiyar-al-ruya-fiqh
class: concept
kind: legal
label:
  ar: خيار الرؤية
  en: Khiyar al-ru'ya (option of sight)
  ur: خیار الرؤیۃ
summary:
  ar: 'خيار الرؤية حق للمتملك في فسخ العقد أو إمضائه عند رؤية محل العقد المعين الذي لم يره، ويثبت بحكم الشرع عند الحنفية نظرا للعاقد، ولا يحتاج إلى اشتراط عند الجمهور، والمالكية يجعلونه إراديا يشترط في بيع الغائب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} مرتبط ببيع الغائب: المراد بالغيبة عدم الرؤية عند العقد، سواء أكانت الغائبة عن المجلس أو مستورة عن العين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} المشروعية: الحنفية يثبتونه بحكم الشرع، والمالكية يشترطونه في بيع الغائب، والشافعية في الجديد والمشهور عن أحمد ينفونه مطلقا؛ والحنفية احتجوا بقوله «أحل الله البيع» وبحديث «من اشترى شيئا لم يره فهو بالخيار إذا رآه» وبقضاء في نزاع طلحة وعثمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} المعنى المراد بالرؤية: العلم بالمقصود الأصلي من محل العقد، ولو بالحواس الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} الرؤية في المثليات والقيميات: المعينة من المثليات كالأعيان، أما الموصوفة في الذمة فدين لا خيار فيه؛ والقيميات كالدواب والأراضي والثياب المتفاوتة لابد فيها من رؤية كل واحد، لأن رؤية البعض لا تعرف الباقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} صور: الرؤية من وراء زجاج (أبو حنيفة لا يكفي حتى يرى ما فيه دون حائل، ومحمد يكفي)، وما في الماء كالسمك (لا تسقط الخيار)، وبالمرآة (لا تسقط)، ومن وراء ستر رقيق (تعتبر رؤية)، وفي ضوء يستر الألوان (لا تعتبر)، ورؤية الأعمى بحواسه الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} العرف يحدد الرؤية الجزئية الكافية، فتصح رؤية ما يدل على المقصود، والعرف إذا تغير تغير الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} شروط قيام الخيار: أن يكون المحل عينا لا دينا، فلا يتصور في النقد والديون، والأواني والحلي عين؛ وأن يكون في عقد يقبل الفسخ بالرد كالبيع والإجارة والصلح عن الدعوى والقسمة، لا المهر والبدل في الخلع ونحوهما؛ وأن يعلم العاقد وقت العقد أن ما عقد عليه هو المرئي السابق، وأن تكون الرؤية السابقة بقصد الشراء في قول، وأن تكون الرؤية بعد العقد شرط ثبوت الخيار.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916} الاتجاه الأول: يثبت خيار الرؤية للمشتري وحده، وهو ما استقر عليه مذهب الحنفية؛ والثاني يثبت للبائع أيضا، وهو قول أبي حنيفة المرجوع عنه والقديم للشافعي ورواية لأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917} العقود: يثبت في البيع للمشتري، وفي السلم إن كان رأس المال عينا للمسلم إليه، ولا يثبت في المسلم فيه ولا في الصرف، ويثبت في الاستصناع للمستصنع، وفي إجارة الأعيان بعينها، ولا في الموزونات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} وقت الثبوت: وقت الرؤية لا قبلها؛ فلو أمضى العقد قبل الرؤية صراحة ثم رآه كان له الرد، وإسقاطه قبل الرؤية لا يصح عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} الفسخ قبل الرؤية: عند الحنفية ممكن للجهالة المصاحبة للعقد، لا بناء على الخيار؛ والمالكية يرون أن الملك لا ينتقل مع خيار الرؤية بعد الرؤية، لعدم استقرار العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} أمد الخيار: الأصح عند الحنفية أنه على التراخي، وقيل على الفور بإمكان الفسخ بعد الرؤية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} أثره: حكم العقد قبل الرؤية حكم العقد الذي لا خيار فيه للحال، وبعد الرؤية يصبح العقد غير لازم دون أثر في انتقال الملك؛ والمالكية يختلفون فيما لو تصرف المشتري في المبيع قبل الرؤية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920} مسقطات الخيار: التصرف الذي تعلق به حق الغير، وتغير المبيع بغير فعله، وتعيبه في يد المشتري، وإجازة أحد الشريكين، والموت؛ والإسقاط الصريح قبل الرؤية لا يسقطه لأنه حق لله عند الكاساني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921} انتهاؤه: بالإجازة القولية أو الفعلية (كالقبض والقطع والبناء بعد الرؤية)؛ وبالفسخ الاختياري أو الضروري كهلاك المبيع قبل القبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} شرائط الفسخ: قيام الخيار، وعدم تفريق الصفقة على البائع، وعلم البائع بالفسخ عند أبي حنيفة ومحمد خلافا لأبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} انتقاله: لا ينتقل بالموت عند الحنفية لأنه عندهم لمطلق التروي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922}'
  en: 'The option of sight (khiyar al-ru''ya) is a right to annul or confirm when one sees the specific thing contracted that one had not seen; it is set by the law for the Hanafis, required as a stipulation by the Malikis for the sale of an absent thing, and denied by the new Shafii view and the better Hanbali report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} It concerns the sale of the absent: absence means not seen at the contract, whether it is away from the session or hidden from the eye. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} Ruling: the Hanafis rely on "God has made sale lawful" and the report "he who buys what he has not seen has the option when he sees it", and the judgement of Talha and Uthman; the Shafiis and others reject it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} Sight means knowing the principal object of the contract, by any sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} Sight in fungibles and in values: a specific measure is like a specific thing, while a described debt has no option of sight; values such as animals, lands and varied cloths need the sight of each item, since sight of one does not show the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} Cases: through glass (Abu Hanifa requires seeing the thing without barrier; Muhammad allows), in water (fish: no), by mirror (no), through a thin cover (yes), in a light that hides colours (no), the blind by other senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} Custom fixes what partial sight suffices, and changes with custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} Conditions: the subject must be a specific thing, not a debt (so not currency or debts); the contract must be one which can be annulled by return; the buyer must know at the contract that what he contracts is the one seen before; the seeing before must have been with intent to buy in one view; sight after the contract is the condition for the option to arise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916} On the party: the Hanafis hold the option for the buyer alone; some hold it also for the seller, which was Abu Hanifa\''s earlier view and an old Shafii view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917} Contracts: it arises in sale, in salam if the capital is specific (for the supplier), not in the deferred goods nor in exchange of money, in istisna\'' for the buyer, in leasing a specified thing, not in weighed things. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} Time: it arises at the sight, not before; if one allows the contract before sight and then sees it, one may still annul; a waiver before sight is void for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} Annulment before sight: possible for the Hanafis because of the unknown at contract, not by the option itself; the Malikis hold that property does not pass under the option of sight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} Term: the sounder Hanafi view is that it runs without a set limit; another view makes it immediate after sight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} Effect: the contract before sight is as one without option; after sight it becomes non-binding without affecting transfer; the Malikis differ on resale before sight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920} Ways it ends: a transfer that touches another\''s right, change of the thing not by the buyer, defect in his hand, one partner\''s confirmation, death; a plain waiver before sight does not end it, since it is God\''s right according to al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921} Termination: by confirmation, explicit or by act (receipt, cutting, building after sight); by annulment, voluntary or compelled (such as perishing before receipt). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} Conditions of annulment: the option must exist, no split of the deal to the seller, and for Abu Hanifa and Muhammad the seller must know; Abu Yusuf disagrees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} Transmission: the Hanafis hold it does not pass at death, as it is for general deliberation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922}'
  ur: 'خیار الرؤیۃ: اس مالک کا حق کہ جس نے کوئی معین چیز نہ دیکھی ہو اسے دیکھنے کے بعد عقد کو فسخ کرے یا برقرار رکھے؛ حنفیہ شرع سے ثابت مانتے ہیں، مالکیہ غائب کی بیع میں شرط کو ضروری کہتے ہیں، شافعیہ کا جدید قول اور حنابلہ کی راجح روایت اس کی نفی کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} غائب کی بیع سے متعلق: عقد کے وقت نہ دیکھی ہوئی چیز، خواہ مجلس سے غائب ہو یا نظر سے پوشیدہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} دلائل: حنفیہ «أحل الله البيع» اور «من اشترى شيئا لم يره فهو بالخيار إذا رآه» اور طلحہ و عثمان کے فیصلے سے استدلال کرتے ہیں؛ شافعیہ وغیرہ انکار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} رؤیت سے مراد اصل مقصود کا علم ہے، کسی بھی حس سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} مثلیات اور قیمیات میں رؤیت: معین مثلی عین کی طرح، موصوف دین میں خیار نہیں؛ قیمی چیزوں (جانور، زمین، مختلف کپڑے) میں ہر ایک کی رؤیت ضروری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} صورتیں: شیشے کے پیچھے سے (ابو حنیفہ کے نزدیک بغیر رکاوٹ کے دیکھنا لازم، محمد جائز)، پانی میں مچھلی (خیار باقی)، آئینے سے (باقی)، باریک پردے کے پیچھے (رؤیت)، ایسی روشنی میں جو رنگ چھپائے (نہیں)، نابینا کی حواس سے رؤیت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} عرف کے مطابق جزوی رؤیت کافی ہوتی ہے اور عرف بدلنے سے حکم بدلتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} شرائط: محل معین چیز ہو، دین نہیں (نقد اور قرض نہیں)؛ عقد ایسا ہو جو رد سے فسخ ہو سکے (بیع، اجارہ، صلح عن الدعوی، قسمت)، مہر اور خلع کا بدل نہیں؛ عاقد کو عقد کے وقت علم ہو کہ جو معقود علیہ ہے وہی پہلے دیکھی تھی؛ پہلے دیکھنا خریداری کے ارادے سے ہو (ایک قول)؛ عقد کے بعد دیکھنا خیار کے ثبوت کی شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916} پہلا اتجاہ: خیار صرف خریدار کے لیے، حنفیہ کا مذہب؛ دوسرا: بائع کے لیے بھی، جو ابو حنیفہ کا رجوع شدہ اور شافعی کا قدیم قول اور احمد کی ایک روایت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917} عقود: بیع میں خریدار کے لیے؛ سلم میں اگر رأس المال معین ہو تو مسلم الیہ کے لیے؛ مسلم فیہ اور صرف میں نہیں؛ استصناع میں مستصنع کے لیے؛ معین چیز کی اجارہ میں؛ وزنی چیزوں میں نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} ثبوت کا وقت: رؤیت کے وقت، اس سے پہلے نہیں؛ رؤیت سے پہلے عقد کی صریح اجازت کے بعد دیکھنے پر بھی رد کا حق؛ حنفیہ کے نزدیک رؤیت سے پہلے ساقط کرنا باطل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} رؤیت سے پہلے فسخ: حنفیہ کے نزدیک جہالت کے سبب ممکن، خیار کی بنا پر نہیں؛ مالکیہ کے نزدیک خیارِ رؤیت کے باوجود ملکیت منتقل نہیں ہوتی کیونکہ عقد مستقر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} مدت: حنفیہ کا اصح قول یہ کہ بغیر مقررہ حد کے چلتا ہے، ایک قول کے مطابق رؤیت کے فوراً بعد۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} اثر: رؤیت سے پہلے حکم بغیر خیار کے عقد جیسا؛ رؤیت کے بعد عقد غیر لازم ہو جاتا ہے مگر ملکیت کی منتقلی پر اثر نہیں؛ مالکیہ رؤیت سے پہلے دوبارہ فروخت کے بارے میں اختلاف رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920} ساقط ہونے کے اسباب: ایسا تصرف جس سے دوسرے کا حق متعلق ہو، بغیر فعلِ خریدار کے مبیع کا بدلنا، ہاتھ میں عیب، شریک کی اجازت اور موت؛ رؤیت سے پہلے صریح ساقط کرنا بھی نہیں گراتا کیونکہ یہ کاساني کے نزدیک حق اللہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921} انتہا: قولی یا فعلی اجازت سے (قبض، کاٹنا، بنانا رؤیت کے بعد)؛ فسخ اختیاری یا ضروری (قبضے سے پہلے مبیع کا ہلاک ہونا) سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} شرائطِ فسخ: خیار کا موجود ہونا، بائع پر تفریق صفقہ نہ ہونا، ابو حنیفہ اور محمد کے نزدیک بائع کا علم، ابو یوسف اختلاف کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} انتقال: حنفیہ کے نزدیک موت سے منتقل نہیں ہوتا کیونکہ یہ مطلق غور و فکر کے لیے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922}'
