id: concept/khiyar-al-ruya-fiqh
class: concept
kind: legal
label:
  ar: خيار الرؤية
  en: Khiyar al-ru'ya (option of sight)
  ur: خیار الرؤیۃ
  es: "Khiyar al-ru'ya (opción de vista)"
  fr: "Khiyar al-ru'ya (option de vue)"
  tr: "Görüş seçeneği"
  id: "Opsi visi"
summary:
  ar: 'خيار الرؤية حق للمتملك في فسخ العقد أو إمضائه عند رؤية محل العقد المعين الذي لم يره، ويثبت بحكم الشرع عند الحنفية نظرا للعاقد، ولا يحتاج إلى اشتراط عند الجمهور، والمالكية يجعلونه إراديا يشترط في بيع الغائب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} مرتبط ببيع الغائب: المراد بالغيبة عدم الرؤية عند العقد، سواء أكانت الغائبة عن المجلس أو مستورة عن العين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} المشروعية: الحنفية يثبتونه بحكم الشرع، والمالكية يشترطونه في بيع الغائب، والشافعية في الجديد والمشهور عن أحمد ينفونه مطلقا؛ والحنفية احتجوا بقوله «أحل الله البيع» وبحديث «من اشترى شيئا لم يره فهو بالخيار إذا رآه» وبقضاء في نزاع طلحة وعثمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} المعنى المراد بالرؤية: العلم بالمقصود الأصلي من محل العقد، ولو بالحواس الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} الرؤية في المثليات والقيميات: المعينة من المثليات كالأعيان، أما الموصوفة في الذمة فدين لا خيار فيه؛ والقيميات كالدواب والأراضي والثياب المتفاوتة لابد فيها من رؤية كل واحد، لأن رؤية البعض لا تعرف الباقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} صور: الرؤية من وراء زجاج ⁦(أبو حنيفة لا يكفي حتى يرى ما فيه دون حائل، ومحمد يكفي)⁩، وما في الماء كالسمك ⁦(لا تسقط الخيار)⁩، وبالمرآة ⁦(لا تسقط)⁩، ومن وراء ستر رقيق ⁦(تعتبر رؤية)⁩، وفي ضوء يستر الألوان ⁦(لا تعتبر)⁩، ورؤية الأعمى بحواسه الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} العرف يحدد الرؤية الجزئية الكافية، فتصح رؤية ما يدل على المقصود، والعرف إذا تغير تغير الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} شروط قيام الخيار: أن يكون المحل عينا لا دينا، فلا يتصور في النقد والديون، والأواني والحلي عين؛ وأن يكون في عقد يقبل الفسخ بالرد كالبيع والإجارة والصلح عن الدعوى والقسمة، لا المهر والبدل في الخلع ونحوهما؛ وأن يعلم العاقد وقت العقد أن ما عقد عليه هو المرئي السابق، وأن تكون الرؤية السابقة بقصد الشراء في قول، وأن تكون الرؤية بعد العقد شرط ثبوت الخيار.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916} الاتجاه الأول: يثبت خيار الرؤية للمشتري وحده، وهو ما استقر عليه مذهب الحنفية؛ والثاني يثبت للبائع أيضا، وهو قول أبي حنيفة المرجوع عنه والقديم للشافعي ورواية لأحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917} العقود: يثبت في البيع للمشتري، وفي السلم إن كان رأس المال عينا للمسلم إليه، ولا يثبت في المسلم فيه ولا في الصرف، ويثبت في الاستصناع للمستصنع، وفي إجارة الأعيان بعينها، ولا في الموزونات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} وقت الثبوت: وقت الرؤية لا قبلها؛ فلو أمضى العقد قبل الرؤية صراحة ثم رآه كان له الرد، وإسقاطه قبل الرؤية لا يصح عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} الفسخ قبل الرؤية: عند الحنفية ممكن للجهالة المصاحبة للعقد، لا بناء على الخيار؛ والمالكية يرون أن الملك لا ينتقل مع خيار الرؤية بعد الرؤية، لعدم استقرار العقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} أمد الخيار: الأصح عند الحنفية أنه على التراخي، وقيل على الفور بإمكان الفسخ بعد الرؤية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} أثره: حكم العقد قبل الرؤية حكم العقد الذي لا خيار فيه للحال، وبعد الرؤية يصبح العقد غير لازم دون أثر في انتقال الملك؛ والمالكية يختلفون فيما لو تصرف المشتري في المبيع قبل الرؤية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920} مسقطات الخيار: التصرف الذي تعلق به حق الغير، وتغير المبيع بغير فعله، وتعيبه في يد المشتري، وإجازة أحد الشريكين، والموت؛ والإسقاط الصريح قبل الرؤية لا يسقطه لأنه حق لله عند الكاساني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921} انتهاؤه: بالإجازة القولية أو الفعلية ⁦(كالقبض والقطع والبناء بعد الرؤية)⁩؛ وبالفسخ الاختياري أو الضروري كهلاك المبيع قبل القبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} شرائط الفسخ: قيام الخيار، وعدم تفريق الصفقة على البائع، وعلم البائع بالفسخ عند أبي حنيفة ومحمد خلافا لأبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} انتقاله: لا ينتقل بالموت عند الحنفية لأنه عندهم لمطلق التروي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922}'
  en: 'The option of sight (khiyar al-ru''ya) is a right to annul or confirm when one sees the specific thing contracted that one had not seen; it is set by the law for the Hanafis, required as a stipulation by the Malikis for the sale of an absent thing, and denied by the new Shafii view and the better Hanbali report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} It concerns the sale of the absent: absence means not seen at the contract, whether it is away from the session or hidden from the eye. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} Ruling: the Hanafis rely on "God has made sale lawful" and the report "he who buys what he has not seen has the option when he sees it", and the judgement of Talha and Uthman; the Shafiis and others reject it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} Sight means knowing the principal object of the contract, by any sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} Sight in fungibles and in values: a specific measure is like a specific thing, while a described debt has no option of sight; values such as animals, lands and varied cloths need the sight of each item, since sight of one does not show the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} Cases: through glass (Abu Hanifa requires seeing the thing without barrier; Muhammad allows), in water (fish: no), by mirror (no), through a thin cover (yes), in a light that hides colours (no), the blind by other senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} Custom fixes what partial sight suffices, and changes with custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} Conditions: the subject must be a specific thing, not a debt (so not currency or debts); the contract must be one which can be annulled by return; the buyer must know at the contract that what he contracts is the one seen before; the seeing before must have been with intent to buy in one view; sight after the contract is the condition for the option to arise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916} On the party: the Hanafis hold the option for the buyer alone; some hold it also for the seller, which was Abu Hanifa\''s earlier view and an old Shafii view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917} Contracts: it arises in sale, in salam if the capital is specific (for the supplier), not in the deferred goods nor in exchange of money, in istisna\'' for the buyer, in leasing a specified thing, not in weighed things. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} Time: it arises at the sight, not before; if one allows the contract before sight and then sees it, one may still annul; a waiver before sight is void for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} Annulment before sight: possible for the Hanafis because of the unknown at contract, not by the option itself; the Malikis hold that property does not pass under the option of sight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} Term: the sounder Hanafi view is that it runs without a set limit; another view makes it immediate after sight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} Effect: the contract before sight is as one without option; after sight it becomes non-binding without affecting transfer; the Malikis differ on resale before sight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920} Ways it ends: a transfer that touches another\''s right, change of the thing not by the buyer, defect in his hand, one partner\''s confirmation, death; a plain waiver before sight does not end it, since it is God\''s right according to al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921} Termination: by confirmation, explicit or by act (receipt, cutting, building after sight); by annulment, voluntary or compelled (such as perishing before receipt). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} Conditions of annulment: the option must exist, no split of the deal to the seller, and for Abu Hanifa and Muhammad the seller must know; Abu Yusuf disagrees. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} Transmission: the Hanafis hold it does not pass at death, as it is for general deliberation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922}'
  ur: 'خیار الرؤیۃ: اس مالک کا حق کہ جس نے کوئی معین چیز نہ دیکھی ہو اسے دیکھنے کے بعد عقد کو فسخ کرے یا برقرار رکھے؛ حنفیہ شرع سے ثابت مانتے ہیں، مالکیہ غائب کی بیع میں شرط کو ضروری کہتے ہیں، شافعیہ کا جدید قول اور حنابلہ کی راجح روایت اس کی نفی کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} غائب کی بیع سے متعلق: عقد کے وقت نہ دیکھی ہوئی چیز، خواہ مجلس سے غائب ہو یا نظر سے پوشیدہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} دلائل: حنفیہ «أحل الله البيع» اور «من اشترى شيئا لم يره فهو بالخيار إذا رآه» اور طلحہ و عثمان کے فیصلے سے استدلال کرتے ہیں؛ شافعیہ وغیرہ انکار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} رؤیت سے مراد اصل مقصود کا علم ہے، کسی بھی حس سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} مثلیات اور قیمیات میں رؤیت: معین مثلی عین کی طرح، موصوف دین میں خیار نہیں؛ قیمی چیزوں ⁦(جانور، زمین، مختلف کپڑے)⁩ میں ہر ایک کی رؤیت ضروری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} صورتیں: شیشے کے پیچھے سے ⁦(ابو حنیفہ کے نزدیک بغیر رکاوٹ کے دیکھنا لازم، محمد جائز)⁩، پانی میں مچھلی ⁦(خیار باقی)⁩، آئینے سے ⁦(باقی)⁩، باریک پردے کے پیچھے ⁦(رؤیت)⁩، ایسی روشنی میں جو رنگ چھپائے ⁦(نہیں)⁩، نابینا کی حواس سے رؤیت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} عرف کے مطابق جزوی رؤیت کافی ہوتی ہے اور عرف بدلنے سے حکم بدلتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} شرائط: محل معین چیز ہو، دین نہیں ⁦(نقد اور قرض نہیں)⁩؛ عقد ایسا ہو جو رد سے فسخ ہو سکے ⁦(بیع، اجارہ، صلح عن الدعوی، قسمت)⁩، مہر اور خلع کا بدل نہیں؛ عاقد کو عقد کے وقت علم ہو کہ جو معقود علیہ ہے وہی پہلے دیکھی تھی؛ پہلے دیکھنا خریداری کے ارادے سے ہو ⁦(ایک قول)⁩؛ عقد کے بعد دیکھنا خیار کے ثبوت کی شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916} پہلا اتجاہ: خیار صرف خریدار کے لیے، حنفیہ کا مذہب؛ دوسرا: بائع کے لیے بھی، جو ابو حنیفہ کا رجوع شدہ اور شافعی کا قدیم قول اور احمد کی ایک روایت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917} عقود: بیع میں خریدار کے لیے؛ سلم میں اگر رأس المال معین ہو تو مسلم الیہ کے لیے؛ مسلم فیہ اور صرف میں نہیں؛ استصناع میں مستصنع کے لیے؛ معین چیز کی اجارہ میں؛ وزنی چیزوں میں نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} ثبوت کا وقت: رؤیت کے وقت، اس سے پہلے نہیں؛ رؤیت سے پہلے عقد کی صریح اجازت کے بعد دیکھنے پر بھی رد کا حق؛ حنفیہ کے نزدیک رؤیت سے پہلے ساقط کرنا باطل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} رؤیت سے پہلے فسخ: حنفیہ کے نزدیک جہالت کے سبب ممکن، خیار کی بنا پر نہیں؛ مالکیہ کے نزدیک خیارِ رؤیت کے باوجود ملکیت منتقل نہیں ہوتی کیونکہ عقد مستقر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} مدت: حنفیہ کا اصح قول یہ کہ بغیر مقررہ حد کے چلتا ہے، ایک قول کے مطابق رؤیت کے فوراً بعد۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} اثر: رؤیت سے پہلے حکم بغیر خیار کے عقد جیسا؛ رؤیت کے بعد عقد غیر لازم ہو جاتا ہے مگر ملکیت کی منتقلی پر اثر نہیں؛ مالکیہ رؤیت سے پہلے دوبارہ فروخت کے بارے میں اختلاف رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920} ساقط ہونے کے اسباب: ایسا تصرف جس سے دوسرے کا حق متعلق ہو، بغیر فعلِ خریدار کے مبیع کا بدلنا، ہاتھ میں عیب، شریک کی اجازت اور موت؛ رؤیت سے پہلے صریح ساقط کرنا بھی نہیں گراتا کیونکہ یہ کاساني کے نزدیک حق اللہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921} انتہا: قولی یا فعلی اجازت سے ⁦(قبض، کاٹنا، بنانا رؤیت کے بعد)⁩؛ فسخ اختیاری یا ضروری ⁦(قبضے سے پہلے مبیع کا ہلاک ہونا)⁩ سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} شرائطِ فسخ: خیار کا موجود ہونا، بائع پر تفریق صفقہ نہ ہونا، ابو حنیفہ اور محمد کے نزدیک بائع کا علم، ابو یوسف اختلاف کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} انتقال: حنفیہ کے نزدیک موت سے منتقل نہیں ہوتا کیونکہ یہ مطلق غور و فکر کے لیے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922}'
  es: "La opción de la vista (khiyar al-ru'ya) es un derecho a anular o confirmar cuando uno ve la cosa específica contratada que no había visto; está establecida por la ley para los Hanafíes, requerida como estipulación por los Malikis para la venta de una cosa ausente, y negada por la nueva visión Shafií y el mejor informe Hanbalí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} Se refiere a la venta de lo ausente: ausencia significa no visto en el contrato, ya sea que esté lejos de la sesión o oculto a la vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} Dictamen: los Hanafíes se basan en \"Dios ha hecho lícita la venta\" y el informe \"quien compra lo que no ha visto tiene la opción cuando lo ve\", y el juicio de Talha y Uthman; los Shafiíes y otros lo rechazan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} La vista significa conocer el objeto principal del contrato, por cualquier sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} La vista en los fungibles y en los valores: una medida específica es como una cosa específica, mientras que una deuda descrita no tiene opción de vista; valores como animales, tierras y telas variadas necesitan la vista de cada artículo, ya que la vista de uno no muestra el resto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} Casos: a través del vidrio (Abu Hanifa requiere ver la cosa sin barrera; Muhammad lo permite), en el agua (pez: no), por espejo (no), a través de una cubierta delgada (sí), en una luz que oculta los colores (no), los ciegos por otros sentidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} La costumbre fija lo que basta con la visión parcial y cambia con la costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} Condiciones: el sujeto debe ser una cosa específica, no una deuda (por lo tanto, no moneda ni deudas); El contrato debe ser uno que pueda ser anulado por devolución; el comprador debe saber en el contrato que lo que contrata es lo que vio antes; la visión previa debe haber sido con la intención de comprar en una sola mirada; la visión posterior al contrato es la condición para que surja la opción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916} Sobre la parte: los Hanafis sostienen la opción solo para el comprador; algunos la sostienen también para el vendedor, que era la opinión anterior de Abu Hanifa y una antigua opinión Shafii. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917} Contratos: surge en la venta, en salam si el capital es específico (para el proveedor), no en los bienes diferidos ni en el intercambio de dinero, en istisna\\' para el comprador, en el arrendamiento de una cosa específica, no en cosas pesadas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} Tiempo: surge a la vista, no antes; si uno permite el contrato antes de la vista y luego lo ve, aún puede anularlo; una renuncia antes de la vista es nula para los Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} Anulación antes de la vista: posible para los Hanafi debido a lo desconocido en el contrato, no por la opción en sí; los Malikis sostienen que la propiedad no se transfiere bajo la opción de la vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} Plazo: la opinión Hanafi más sólida es que corre sin un límite establecido; otra opinión hace que sea inmediato después de la vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} Efecto: el contrato antes de la vista es como uno sin opción; después de la vista se vuelve no vinculante sin afectar la transferencia; los Malikis difieren en la reventa antes de la vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920} Formas en que termina: una transferencia que afecta el derecho de otro, cambio de la cosa no por el comprador, defecto en su mano, confirmación de uno de los socios, muerte; una renuncia simple antes de la vista no la termina, ya que es el derecho de Dios según al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921} Terminación: por confirmación, explícita o por acto (recepción, corte, construcción después de la vista); por anulación, voluntaria o forzosa (como perecer antes de la recepción). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} Condiciones de anulación: la opción debe existir, no hay división del trato para el vendedor, y para Abu Hanifa y Muhammad el vendedor debe saberlo; Abu Yusuf no está de acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} Transmisión: los Hanafis sostienen que no se transmite al morir, como ocurre con la deliberación general. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922}"
  fr: "L'option de la vue (khiyar al-ru'ya) est un droit permettant d'annuler ou de confirmer un contrat lorsqu'on voit l'objet précis du contrat, même si on ne l'avait pas vu auparavant. Elle est établie par la loi hanafite, exigée par les malikites comme condition de la vente d'un bien absent, et rejetée par la nouvelle école shafi'ite et l'école hanbalite (la plus fiable). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} Elle concerne la vente d'un bien absent: l'absence signifie que le bien n'a pas été vu lors du contrat, qu'il soit hors du lieu de la conclusion du contrat ou caché à la vue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} Décision: les hanafites s'appuient sur le fait que « Dieu a rendu la vente licite », sur le hadith « celui qui achète ce qu'il n'a pas vu a la possibilité de le confirmer lorsqu'il le voit » et sur l'avis de Talha et Uthman; les shafi'ites et d'autres écoles la rejettent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} La notion de « vue » désigne la connaissance de l’objet principal du contrat, quel que soit le sens de cette connaissance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} La notion de « vue » s’applique aux biens fongibles et aux valeurs: une mesure spécifique est comparable à une chose spécifique, tandis qu’une dette définie ne peut faire l’objet d’une telle connaissance; les valeurs telles que les animaux, les terres et les tissus variés nécessitent la connaissance de chaque élément, car la connaissance d’un seul ne permet pas d’appréhender les autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} Cas: à travers une vitre (Abu Hanifa exige de voir la chose sans obstacle; Muhammad l’autorise), dans l’eau (poisson: non), par un miroir (non), à travers un voile fin (oui), dans une lumière qui masque les couleurs (non), les aveugles par d’autres sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} La coutume détermine ce qui constitue une vision partielle suffisante, et cette notion évolue avec elle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} Conditions: le sujet doit être une chose spécifique, et non une dette (donc ni monnaie ni dettes). Le contrat doit être révocable par retour; l’acheteur doit savoir, au moment de la conclusion du contrat, que l’objet de son contrat est celui qu’il a vu auparavant; cette consultation préalable doit avoir été faite avec l’intention d’acheter en une seule fois; la consultation après la conclusion du contrat est la condition de l’exercice de l’option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916} Concernant la partie: les hanafites considèrent que l’option est accordée à l’acheteur uniquement; certains l’accordent également au vendeur, ce qui était l’avis antérieur d’Abu Hanifa et une ancienne opinion shafi’ite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917} Contrats: la renonciation naît lors de la vente, dans le salam si le capital est spécifique (pour le fournisseur), non dans les biens différés ni dans l’échange d’argent, dans l’istisna pour l’acheteur, dans la location d’une chose spécifiée, non dans les biens pesés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7917}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} Délai: la renonciation naît à la vue, non avant; si l’on consent au contrat avant de le voir et qu’on le voit ensuite, on peut encore l’annuler; une renonciation avant la vue est nulle pour les Hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918} Annulation avant la vue: possible pour les Hanafites en raison de l’inconnue au moment du contrat, non par l’option elle-même; Les Malikites estiment que la propriété ne se transfère pas sous l'effet de l'option de vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7918}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} Durée: selon l'avis hanafite le plus solide, la transmission se fait sans limite; un autre avis la fixe à la date de la vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919} Effet: le contrat conclu avant la vente est comme un contrat sans option; après la vente, il devient non contraignant sans affecter la cession; les Malikites divergent sur la question de la revente avant la vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7919}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920} Modes de dissolution: un transfert portant atteinte aux droits d’autrui, une modification de la chose non imputable à l’acheteur, un vice de sa main, la confirmation d’un associé, le décès; une renonciation simple avant la vente ne met pas fin au contrat, car il s’agit d’un droit divin selon al-Kasani. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7920}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921} Dissolution: par confirmation, expresse ou tacite (réception, découpe, construction après vente); par annulation, volontaire ou forcée (par exemple, la disparition avant la réception). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7921}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} Conditions d'annulation: l'option doit exister, pas de partage de la transaction avec le vendeur, et pour Abu Hanifa et Muhammad le vendeur doit connaître; Abou Yusuf n'est pas d'accord. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922} Transmission: les Hanafis soutiennent que cela ne passe pas à la mort, comme c'est le cas pour la délibération générale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7922}"
  tr: "Görme hakkı, mülkün görmediği belirli sözleşme yerini gördüğünde sözleşmeyi feshetme veya imzalama hakkıdır. Hanefi okuluna göre Şeriat'ta yüklenici tarafından belirlenir ve çoğunluktan bir koşul talep etmez. Malikiler bunu gönüllü ve yok olan kişinin satışında bir koşul olarak kabul eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7910} Yokluğun satışıyla ilgili: Yokluğun anlamı, sözleşme sırasında görüşün yokluğudur; ister toplantıda yok olsun ister gözden gizlensin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7910} Meşruiyet: Hanafiler bunu İslam hukuku ile kurar, Malikiler ise Ahmed'in yeni ve bilinen rivayetinde kesinlikle reddeder; Hanefiler bunu \"Allah satışa izin vermiştir\", hadis \"Bir şeyi görmeden alırsa, görürse seçeneği vardır\" ve Talha ile Osman arasındaki anlaşmazlıktaki hükmle desteklemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7912} Görüşün amaçlanan anlamı: sözleşme yerinin orijinal amacının bilinmesi, başka anlamlarla bile olsa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7912} el-Kaymiyat ve Qiyamiyat'ta vizyon: Zimmede tanımlananlar ise seçme hakkı olmayan borç gibi belirli al-Kayyat türleri (tüzel varlıklar), somut şeyler gibi; ve hayvanlar, topraklar ve çeşitli giysiler gibi kayat (değerler) her biri görülmelidir, çünkü bazılarını görmek diğerlerini bilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7913} Görüntüler: Camdan görmek (Ebu Hanife, içindekini engelsiz görmek için yeterli değildir, Muhammed yeterlidir), balık gibi suda olanı (seçenek düşmez), aynadan (düşmez), ince bir örtü arkasında (görme olarak kabul edilir), renkleri gizleyen ışıkta (önemli değildir) ve kör kişi diğer duyularıyla görür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7913} Gelenek, yeterli kısmi görüşü tanımlar, bu yüzden amaçlanan anlamı gösteren şeyi görmek geçerlidir ve kural değişirse gelenek değişir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7914} Opsiyonun kurulması koşulları: Yer borçlu değil, ayni olmalıdır, bu nedenle nakit, borç, mutfak gereçleri veya mücevher olarak kabul edilmemelidir; satış, kiralama, dava ile mutabakat ve bölünme gibi iade yoluyla geri alınabilen bir sözleşmede olmalıdır, khul' ve benzeri konularda çeyiz veya takas değil; yüklenici, sözleşme sırasında sözleşmenin önceden görünürlük olduğunu bilmelidir; satın alma niyetiyle önceden görüş sözlü olmalıdır; ve sözleşmeden sonraki görüş opsiyonun belirlenmesi için koşul olmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7915}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7916} İlk yaklaşım: Hanefi okulunun yerleşik görüşü olan sadece alıcı için görme seçeneğini onaylar; ikincisi ise satıcı için de belirlenir; bu da Ebu Hanifa'nın görüşüdür, bu da Al-Shafi'i'nin geri çekilmiş görüşü ve Ahmad'ın rivayetiyle aynıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7917} Sözleşmeler: Alıcıya yapılan satışlarda ve sermaye alıcıya ayni ise salamda kurulur, Müslüman için veya değişimde değil, üretilen ürün için istisna' durumunda, belirli malların kiralanmasında veya ağırlıklı mallarda belirlenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7918} Onay zamanı: Görülme zamanı, öncesinde değil; eğer kişi sözleşmeyi açıkça görür ve sonra görürse, geri dönme hakkına sahiptir ve gözlemden önce bırakmak Hanefilere göre geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7918} Görülmeden önce iptal: Hanefilere göre, sözleşmeye bağlı bilgisizlik nedeniyle mümkündür, opsiyona dayanmaz; Malikiler, mülkiyetin, sözleşmenin istikrarsızlığı nedeniyle gözlem sonrası gözlem opsiyonuyla devredilmediğini savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7919} Opsiyon süresi: En doğru görüş, gevşetilmesi gerektiği ve gözlem sonrası hemen iptalin mümkün olduğu söylenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7919} Etkisi: Görüş öncesi sözleşme hakkı, durum için seçenek olmayan bir sözleşme üzerindeki karardır. Görüldükten sonra sözleşme, mülkiyet devrini etkilemeden geçersiz hale gelir; Malikiler, alıcının satılan eşyayı görmeden önce elden çıkarıp çıkarmadığı konusunda farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7920} Opsiyonlardan feragat: başkasının hakkına bağlı olan işlem, satılan eşyanın kendi eylemi dışında değişmesi, alıcının elindeki kusur, bir ortağın onayı ve ölüm; Al-Kasani'ye göre Tanrı'ya ait olduğu için görülmeden önce açık feragat onu geçersiz kılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7921} Sona erdirilmesi: sözlü veya fiili izin ile (örneğin bulundurma, kesim ve görüldükten sonra yapım); ve gönüllü veya zorunlu iptal, örneğin satılan eşyanın mülkiyetten önce imha edilmesi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7922} İptal koşulları: opsiyon belirlenmeli, işlem satıcıdan ayrılmamalı ve satıcı, Abu Hanifa ve Muhammed'e göre iptalden haberdar olmalıdır, Abu Yusuf'un aksine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7922} Aktarımı: Hanafilere göre ölüm yoluyla aktarılmaz, çünkü onlara göre mutlak anlatım içindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7922}"
  id: "Hak penglihatan adalah hak pemilik untuk mengakhiri atau menandatangani kontrak setelah melihat lokasi kontrak tertentu yang tidak dilihatnya. Hak ini ditetapkan oleh Syariah sesuai aliran Hanafi yang menjadi hak kontraktor, dan tidak memerlukan syarat dari mayoritas orang. Keluarga Malik menganggapnya sukarela dan merupakan syarat dalam menjual orang yang tidak hadir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7910} Terkait dengan penjualan orang yang tidak hadir: Arti ketidakhadiran adalah ketidakhadiran penglihatan pada saat kontrak dibuat, baik tidak ada di pertemuan maupun tersembunyi dari mata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7910} Legitimasi: Hanafi menetapkan hal ini berdasarkan hukum Islam, Maliki mengharuskan dijual secara in absentia, dan Syafi'i dalam riwayat baru dan terkenal dari Ahmad menolaknya secara mutlak; Hanafi mendukungnya dengan ungkapan \"Allah telah mengizinkan penjualan,\" hadis \"Siapa pun yang membeli sesuatu tanpa melihatnya, dia punya pilihan jika melihatnya,\" dan putusan dalam perselisihan antara Talha dan Uthman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7912} Makna penglihatan yang dimaksudkan: pengetahuan tentang tujuan asli dari tempat kontrak, meskipun dengan indra lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7912} Penglihatan dalam al-Qaymiyat dan Qiyamiyat: Jenis tertentu dari al-Qayyat (entitas hukum), seperti benda-benda nyata, sementara yang dijelaskan dalam dhimma adalah hutang tanpa pilihan; dan qayat (nilai), seperti hewan, tanah, dan pakaian yang beragam, masing-masing harus dilihat, karena melihat beberapa tidak akan mengetahui sisanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7913} Gambar: Melihat melalui kaca (Abu Hanifa tidak cukup untuk melihat apa yang ada di dalam tanpa penghalang, Muhammad sudah cukup), apa yang ada di air seperti ikan (pilihan tidak jatuh), melalui cermin (tidak jatuh), di balik tirai tipis (penglihatan yang dipikirkan), dalam cahaya yang menyembunyikan warna (tidak masalah), dan orang buta melihat dengan indera lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7913} Adat mendefinisikan penglihatan parsial yang cukup, jadi melihat apa yang menunjukkan makna yang dimaksud adalah valid, dan kebiasaan berubah jika aturan berubah. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.7913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7914} Syarat penetapan opsi: Tempat harus dalam bentuk barang, bukan dalam utang, sehingga tidak dianggap sebagai uang tunai, utang, peralatan, atau perhiasan; harus dalam kontrak yang dapat dibatalkan dengan restitusi, seperti penjualan, sewa, penyelesaian dari gugatan, dan pembagian, bukan mas kawin atau pertukaran dalam khul' dan hal-hal serupa; kontraktor harus tahu pada saat kontrak bahwa apa yang dikontrak adalah visibilitas sebelumnya; visi sebelumnya dengan niat membeli harus berupa ucapan; dan pandangan setelah kontrak harus menjadi syarat untuk menetapkan opsi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7915} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7916} Pendekatan pertama: menegaskan opsi penglihatan hanya untuk pembeli, yang merupakan pandangan yang mapan dari mazhab Hanafi; yang kedua juga ditetapkan untuk penjual, yaitu pendapat Abu Hanifa, yang sama dengan pandangan yang ditarik kembali dari Al-Shafi'i, dan sebuah narasi oleh Ahmad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7917} Kontrak: Kontrak ditetapkan dalam penjualan kepada pembeli dan salam jika modal adalah barang kepada penerima, dan tidak ditetapkan untuk Muslim atau dalam pertukaran, dan ditetapkan dalam kasus istisna' untuk barang yang diproduksi, dalam penyewaan barang tertentu, atau dalam barang berbobot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7918} Waktu konfirmasi: Waktu penampakan, bukan sebelum itu; jika dia secara eksplisit menandatangani kontrak sebelum pengamatan dan kemudian melihatnya, dia berhak mengembalikannya, dan membatalkannya sebelum pengamatan tidak sah menurut Hanafi. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7918} pembatalan sebelum penampungan: Menurut Hanafi, hal ini mungkin karena ketidaktahuan yang menyertai kontrak, bukan berdasarkan opsi; dan Malikis berpendapat bahwa kepemilikan tidak berpindah dengan opsi penglihatan setelah pelihatan, karena ketidakstabilan kontrak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7919} Durasi opsi: Pandangan paling benar adalah bahwa opsi harus dilonggarkan, dan dikatakan bahwa pembatalan segera mungkin dilakukan setelah penampakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7919} Efeknya: Putusan atas kontrak sebelum melihat adalah putusan atas kontrak di mana tidak ada opsi untuk situasi tersebut. Setelah terlihat, kontrak menjadi tidak sah tanpa efek pada transfer kepemilikan; keluarga Malik berbeda pendapat apakah pembeli menjual barang yang dijual sebelum terlihat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7920} Pengakuan opsi: tindakan yang menjadi dasar hak orang lain, perubahan barang yang dijual selain tindakannya sendiri, cacat di tangan pembeli, persetujuan salah satu mitra, dan kematian; pengabaian eksplisit sebelum penglihatan tidak membatalkannya karena menurut Al-Kasani, barang itu milik Tuhan. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.7920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7921} Pengakhirannya: dengan izin lisan atau aktual (seperti penguasaan, pemotongan, dan konstruksi setelah terlihat); dan dengan pembatalan sukarela atau perlu, seperti penghancuran barang yang dijual sebelum penguasaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7922} Syarat pembatalan: opsi harus ditetapkan, transaksi tidak boleh dipisahkan dari penjual, dan penjual mengetahui pembatalan menurut Abu Hanifa dan Muhammad, bertentangan dengan Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7922} Transmisinya: Menurut Hanafi tidak disampaikan oleh kematian karena menurut mereka itu untuk narasi mutlak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7922}"
