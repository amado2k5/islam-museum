id: concept/khiyar-al-ruya-fiqh
class: concept
kind: legal
label:
  ar: خيار الرؤية
  en: Khiyar al-ru'ya (option of sight)
  ur: خیار الرؤیۃ
summary:
  ar: 'خيار الرؤية حق للمتملك في فسخ العقد أو إمضائه عند رؤية محل العقد المعين الذي لم يره، ويثبت بحكم الشرع عند الحنفية نظرا للعاقد، ولا يحتاج إلى اشتراط عند الجمهور، والمالكية يجعلونه إراديا يشترط في بيع الغائب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} مرتبط ببيع الغائب: المراد بالغيبة عدم الرؤية عند العقد، سواء أكانت الغائبة عن المجلس أو مستورة عن العين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} المشروعية: الحنفية يثبتونه بحكم الشرع، والمالكية يشترطونه في بيع الغائب، والشافعية في الجديد والمشهور عن أحمد ينفونه مطلقا؛ والحنفية احتجوا بقوله «أحل الله البيع» وبحديث «من اشترى شيئا لم يره فهو بالخيار إذا رآه» وبقضاء في نزاع طلحة وعثمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} المعنى المراد بالرؤية: العلم بالمقصود الأصلي من محل العقد، ولو بالحواس الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} الرؤية في المثليات والقيميات: المعينة من المثليات كالأعيان، أما الموصوفة في الذمة فدين لا خيار فيه؛ والقيميات كالدواب والأراضي والثياب المتفاوتة لابد فيها من رؤية كل واحد، لأن رؤية البعض لا تعرف الباقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} صور: الرؤية من وراء زجاج (أبو حنيفة لا يكفي حتى يرى ما فيه دون حائل، ومحمد يكفي)، وما في الماء كالسمك (لا تسقط الخيار)، وبالمرآة (لا تسقط)، ومن وراء ستر رقيق (تعتبر رؤية)، وفي ضوء يستر الألوان (لا تعتبر)، ورؤية الأعمى بحواسه الأخرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} العرف يحدد الرؤية الجزئية الكافية، فتصح رؤية ما يدل على المقصود، والعرف إذا تغير تغير الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} شروط قيام الخيار: أن يكون المحل عينا لا دينا، فلا يتصور في النقد والديون، والأواني والحلي عين؛ وأن يكون في عقد يقبل الفسخ بالرد كالبيع والإجارة والصلح عن الدعوى والقسمة، لا المهر والبدل في الخلع ونحوهما؛ وأن يعلم العاقد وقت العقد أن ما عقد عليه هو المرئي السابق، وأن تكون الرؤية السابقة بقصد الشراء في قول، وأن تكون الرؤية بعد العقد شرط ثبوت الخيار.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916}'
  en: 'The option of sight (khiyar al-ru''ya) is a right to annul or confirm when one sees the specific thing contracted that one had not seen; it is set by the law for the Hanafis, required as a stipulation by the Malikis for the sale of an absent thing, and denied by the new Shafii view and the better Hanbali report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} It concerns the sale of the absent: absence means not seen at the contract, whether it is away from the session or hidden from the eye. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} Ruling: the Hanafis rely on "God has made sale lawful" and the report "he who buys what he has not seen has the option when he sees it", and the judgement of Talha and Uthman; the Shafiis and others reject it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} Sight means knowing the principal object of the contract, by any sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} Sight in fungibles and in values: a specific measure is like a specific thing, while a described debt has no option of sight; values such as animals, lands and varied cloths need the sight of each item, since sight of one does not show the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} Cases: through glass (Abu Hanifa requires seeing the thing without barrier; Muhammad allows), in water (fish: no), by mirror (no), through a thin cover (yes), in a light that hides colours (no), the blind by other senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} Custom fixes what partial sight suffices, and changes with custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} Conditions: the subject must be a specific thing, not a debt (so not currency or debts); the contract must be one which can be annulled by return; the buyer must know at the contract that what he contracts is the one seen before; the seeing before must have been with intent to buy in one view; sight after the contract is the condition for the option to arise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916}'
  ur: 'خیار الرؤیۃ: اس مالک کا حق کہ جس نے کوئی معین چیز نہ دیکھی ہو اسے دیکھنے کے بعد عقد کو فسخ کرے یا برقرار رکھے؛ حنفیہ شرع سے ثابت مانتے ہیں، مالکیہ غائب کی بیع میں شرط کو ضروری کہتے ہیں، شافعیہ کا جدید قول اور حنابلہ کی راجح روایت اس کی نفی کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} غائب کی بیع سے متعلق: عقد کے وقت نہ دیکھی ہوئی چیز، خواہ مجلس سے غائب ہو یا نظر سے پوشیدہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7910} دلائل: حنفیہ «أحل الله البيع» اور «من اشترى شيئا لم يره فهو بالخيار إذا رآه» اور طلحہ و عثمان کے فیصلے سے استدلال کرتے ہیں؛ شافعیہ وغیرہ انکار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7911}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} رؤیت سے مراد اصل مقصود کا علم ہے، کسی بھی حس سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912} مثلیات اور قیمیات میں رؤیت: معین مثلی عین کی طرح، موصوف دین میں خیار نہیں؛ قیمی چیزوں (جانور، زمین، مختلف کپڑے) میں ہر ایک کی رؤیت ضروری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7912}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} صورتیں: شیشے کے پیچھے سے (ابو حنیفہ کے نزدیک بغیر رکاوٹ کے دیکھنا لازم، محمد جائز)، پانی میں مچھلی (خیار باقی)، آئینے سے (باقی)، باریک پردے کے پیچھے (رؤیت)، ایسی روشنی میں جو رنگ چھپائے (نہیں)، نابینا کی حواس سے رؤیت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913} عرف کے مطابق جزوی رؤیت کافی ہوتی ہے اور عرف بدلنے سے حکم بدلتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7913}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914} شرائط: محل معین چیز ہو، دین نہیں (نقد اور قرض نہیں)؛ عقد ایسا ہو جو رد سے فسخ ہو سکے (بیع، اجارہ، صلح عن الدعوی، قسمت)، مہر اور خلع کا بدل نہیں؛ عاقد کو عقد کے وقت علم ہو کہ جو معقود علیہ ہے وہی پہلے دیکھی تھی؛ پہلے دیکھنا خریداری کے ارادے سے ہو (ایک قول)؛ عقد کے بعد دیکھنا خیار کے ثبوت کی شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7914}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7915}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7916}'
