summary:
  ar: "السمسم في الكتاب أكثر البزور دهنية فيزنخ بسهولة، حار في وسط الأولى رطب في آخرها، مغر مليّن معتدل الإسخان، ينفع الشقاق والخشونة ويسمّن ويطول الشعر، وهو رديء للمعدة مغثّ يسقط الشهوة، وفي الكتاب نقل موسوم في الحيض والجنين والباه {cite:canon-ibn-sina-print-v1 p.604}"
  en: "Simsim is in the book the most oily of the seeds, so it turns rancid easily; hot in the middle of the first degree and moist at its end, emollient and softening with a moderate warming, it helps cracks and roughness, fattens and lengthens the hair, but is bad for the stomach, nauseating and putting down appetite, and the book gives a labelled listing on the menses, the foetus and desire {cite:canon-ibn-sina-print-v1 p.604}"
  ur: "سمسم کتاب میں سب بیجوں سے زیادہ چکنا ہے اس لیے جلد بساند پکڑ لیتا ہے؛ پہلے درجے کے وسط میں گرم اور اس کے آخر میں تر، چپکانے اور نرم کرنے والا، اعتدال سے گرم کرنے والا، پھٹن اور کھردرے پن میں فائدہ دیتا ہے، موٹا کرتا اور بالوں کو لمبا کرتا ہے، مگر معدے کے لیے برا ہے، متلی پیدا کرتا اور بھوک گراتا ہے، اور کتاب میں حیض، جنین اور باہ کے بارے میں ایک موسوم نقل ہے {cite:canon-ibn-sina-print-v1 p.604}۔"
  es: "En el libro, el sésamo es la semilla más aceitosa, por lo que se enrancia fácilmente; caliente en el centro del primer grado y húmedo al final, emoliente y suavizante con un calor moderado, ayuda con las grietas y la aspereza, engrosa y alarga el cabello, pero es malo para el estómago, produce náuseas y disminuye el apetito, y el libro ofrece una lista etiquetada sobre la menstruación, el feto y el deseo {cite:canon-ibn-sina-print-v1 p.604}"
  fr: "Le simsim est décrit dans le livre comme la graine la plus huileuse, ce qui explique sa tendance à rancir. Chaud au milieu du premier degré et humide à la fin, il est émollient et adoucissant, avec une chaleur modérée. Il soulage les crevasses et les rugosités, fortifie et allonge les cheveux, mais est néfaste pour l'estomac, provoquant nausées et perte d'appétit. Le livre donne une liste détaillée de ses bienfaits sur les menstruations, le fœtus et le désir. {cite:canon-ibn-sina-print-v1 p.604}"
