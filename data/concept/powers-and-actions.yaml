id: concept/powers-and-actions
class: concept
kind: scientific
label: { ar: "القوى والأفعال", en: "Powers and actions (al-quwa wal-af'al)", es: "Poderes y acciones (al-quwa wal-af'al)", fr: "Pouvoirs et actions (al-quwa wal-af'al)", ur: "اختیارات اور اعمال ⁦(القوۃ والافضل)⁩" }
summary:
  ar: "يعرض ابن سينا القوى والأفعال معاً في التعليم السادس من الفن الأول، وهو جملة وفصل، وتبدأ الجملة بالقوى وهي ستة فصول {cite:canon-ibn-sina-print-v1 p.94}. ويعرف بعضها من بعض، إذ كل قوة مبدأ فعل، وكل فعل يصدر عن قوة {cite:canon-ibn-sina-print-v1 p.94}. وأجناس القوى عند الأطباء ثلاثة: النفسانية والطبيعية والحيوانية {cite:canon-ibn-sina-print-v1 p.94}. ويرى جالينوس وكثير من الحكماء أن لكل قوة عضواً رئيسياً هو معدنها، بينما يرى أرسطاطاليس أن مبدأ القوى كلها القلب {cite:canon-ibn-sina-print-v1 p.94} {cite:canon-ibn-sina-print-v1 p.95}."
  en: "Ibn Sina treats powers and actions together in the sixth section of Book I, Fann 1, in one part and one chapter; the part on powers has six chapters {cite:canon-ibn-sina-print-v1 p.94}. Each power is known from the action it is the source of, and each action comes from a power {cite:canon-ibn-sina-print-v1 p.94}. Physicians recognise three kinds of power: psychic, natural and vital {cite:canon-ibn-sina-print-v1 p.94}. Galen and most physicians place a principal organ as the seat of each power; Aristotle holds that all of them originate in the heart {cite:canon-ibn-sina-print-v1 p.94} {cite:canon-ibn-sina-print-v1 p.95}."
  es: "Ibn Sina trata los poderes y las acciones conjuntamente en la sexta sección del Libro I, Fann 1, en una parte y un capítulo; la parte sobre los poderes tiene seis capítulos {cite:canon-ibn-sina-print-v1 p.94}. Cada poder se conoce por la acción de la que es fuente, y cada acción proviene de un poder {cite:canon-ibn-sina-print-v1 p.94}. Los médicos reconocen tres tipos de poder: psíquico, natural y vital {cite:canon-ibn-sina-print-v1 p.94}. Galeno y la mayoría de los médicos sitúan un órgano principal como sede de cada poder; Aristóteles sostiene que todos ellos se originan en el corazón {cite:canon-ibn-sina-print-v1 p.94} {cite:canon-ibn-sina-print-v1 p.95}."
  fr: "Ibn Sina traite conjointement les puissances et les actions dans la sixième section du Livre I, Fann 1, en une seule partie et un seul chapitre; la partie consacrée aux puissances comprend six chapitres {cite:canon-ibn-sina-print-v1 p.94}. Chaque puissance est connue par l’action dont elle est la source, et chaque action provient d’une puissance {cite:canon-ibn-sina-print-v1 p.94}. Les médecins distinguent trois types de puissance: psychique, naturelle et vitale {cite:canon-ibn-sina-print-v1 p.94}. Galien et la plupart des médecins situent chaque puissance dans un organe principal; Aristote soutient que toutes ont leur origine dans le cœur {cite:canon-ibn-sina-print-v1 p.94} {cite:canon-ibn-sina-print-v1 p.95}."
  ur: "ابن سینا نے کتاب اول کے چھٹے حصے، فان 1، ایک حصے اور ایک باب میں اختیارات اور اعمال کو ایک ساتھ بیان کیا ہے۔ اختیارات کے حصے میں چھ ابواب ہیں {حوالہ: کینن ابن سینا پرنٹ-v1 صفحہ 94}۔ ہر طاقت اس عمل سے معلوم ہوتی ہے جس کا وہ ماخذ ہے، اور ہر عمل ایک طاقت سے آتا ہے {cite:canon-ibn-sina-print-v1 p.94}۔ طبیب تین قسم کی طاقت کو پہچانتے ہیں: نفسیاتی، قدرتی اور اہم گیلن اور زیادہ تر معالجین ہر طاقت کی نشست کے طور پر ایک اہم عضو رکھتے ہیں۔ ارسطو کا خیال ہے کہ ان سب کی ابتداء دل سے ہوتی ہے {cite:canon-ibn-sina-print-v1 p.94} {cite:canon-ibn-sina-print-v1 p.95}۔"
