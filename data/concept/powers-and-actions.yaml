id: concept/powers-and-actions
class: concept
kind: scientific
label: { ar: "القوى والأفعال", en: "Powers and actions (al-quwa wal-af'al)" }
summary:
  ar: "يعرض ابن سينا القوى والأفعال معاً في التعليم السادس من الفن الأول، وهو جملة وفصل، وتبدأ الجملة بالقوى وهي ستة فصول {cite:canon-ibn-sina-print-v1 p.94}. ويعرف بعضها من بعض، إذ كل قوة مبدأ فعل، وكل فعل يصدر عن قوة {cite:canon-ibn-sina-print-v1 p.94}. وأجناس القوى عند الأطباء ثلاثة: النفسانية والطبيعية والحيوانية {cite:canon-ibn-sina-print-v1 p.94}. ويرى جالينوس وكثير من الحكماء أن لكل قوة عضواً رئيسياً هو معدنها، بينما يرى أرسطاطاليس أن مبدأ القوى كلها القلب {cite:canon-ibn-sina-print-v1 p.94} {cite:canon-ibn-sina-print-v1 p.95}."
  en: "Ibn Sina treats powers and actions together in the sixth section of Book I, Fann 1, in one part and one chapter; the part on powers has six chapters {cite:canon-ibn-sina-print-v1 p.94}. Each power is known from the action it is the source of, and each action comes from a power {cite:canon-ibn-sina-print-v1 p.94}. Physicians recognise three kinds of power: psychic, natural and vital {cite:canon-ibn-sina-print-v1 p.94}. Galen and most physicians place a principal organ as the seat of each power; Aristotle holds that all of them originate in the heart {cite:canon-ibn-sina-print-v1 p.94} {cite:canon-ibn-sina-print-v1 p.95}."
