id: concept/rayba-fiqh
class: concept
kind: legal
label:
  ar: "الريبة"
  en: "Rayba: suspicion, doubt, and their legal effects in Islamic jurisprudence"
  ur: "ریبہ (شک، تہمت اور فقہی احکام)"
summary:
  ar: "الريبة لغة الشك والتهمة، وجمعها ريب، ولا يخرج المعنى الاصطلاحي الفقهي عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9042} يندب شرعا ترك ما يوقع في الريبة والأخذ بما لا شبهة فيه احتياطا وورعا، كما يندب للإمام التغافل عن عورات الرعية واجتناب التفتيش في ريبهم لئلا يفسدهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9042} يحرم سوء الظن بمن ظهر منه الصلاح والستر، بخلاف من جاهر بالسوء وتلبس بمواطن التهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9043} تؤثر الريبة في مسائل استبراء الرحم، حيث تتربص المعتدة والمرتابة في الحمل تسعة أشهر حتى تستبرئ رحمها وتزول الريبة باحتمال الحمل عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9044} وتؤثر الريبة في الشهادة والقضاء، فيستحب للحاكم تفريق الشهود عند الارتياب فيهم واستجواب كل واحد منهم على حدة قبل التزكية للاستيثاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045}"
  en: "Rayba denotes suspicion and doubt, and the juristic meaning aligns with its lexical usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9042} It is recommended to leave matters that induce suspicion and adopt what is clear of doubt out of scrupulous caution, and rulers are advised to overlook private faults and refrain from seeking suspicions among the public so as not to corrupt them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9042} Entertaining groundless suspicion against someone of apparent righteousness is forbidden, while suspicion is not ruled out regarding those who openly display wrongdoing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9043} Suspicion impacts waiting periods and establishing pregnancy, whereby a woman in doubt regarding pregnancy waits out a full gestation period of nine months according to the Malikis until doubt is dispelled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9044} In judicial proceedings, suspicion among witnesses warrants their separation by the judge for individual examination prior to character witness verification in order to ascertain truth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045}"
  ur: "ریبہ کا لغوی معنی شک اور تہمت ہے اور فقہی اصطلاح میں بھی اس کا مفہوم اسی کے مطابق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9042} شبہات اور شک میں ڈالنے والی چیزوں کو چھوڑ کر مطمئن امور اختیار کرنا مستحب ہے، اور حکمرانوں کے لیے رعایا کے پوشیدہ احوال میں تجسس کرنے اور شکوک تلاش کرنے سے بچنا مطلوب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9042} نیک نام اور باحیا شخص کے بارے میں بدگمانی حرام ہے، جبکہ اعلانیہ برائی کرنے والے سے احتراز کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9043} عدت اور استبراء رحم کے معاملات میں ریبہ کا اثر ظاہر ہوتا ہے کہ حمل کا شک ہو تو نو ماہ انتظار کیا جاتا ہے تاکہ شک دور ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9044} عدالت اور شہادت میں جب گواہوں پر ریبہ ہو تو قاضی کے لیے مستحب ہے کہ گواہوں کو الگ الگ کر کے دریافت کرے تاکہ حقیقت واضح ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9045}"
