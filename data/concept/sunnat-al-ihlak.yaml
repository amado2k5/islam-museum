label:
  ar: "سنة الإهلاك وعقوبة الأمم"
  en: "The law of destruction: punishment of nations"
  ur: "ہلاکت کی سنت: قوموں کی سزا"
  es: "La ley de la destrucción: castigo de las naciones"
  fr: "La loi de destruction: châtiment des nations"
  tr: "Yıkım Yılı ve Ulusların Cezalandırılması"
  id: "Tahun Kehancuran dan Hukuman Bangsa-bangsa"
summary:
  ar: "عقوبات الله للأمم المتمردة كما يعرضها الشيخ عمر عبد الكافي: الريح والصيحة والزلازل والبراكين، وتفسير الزلزال بين العلم والتذكير الإلهي، وأن الذنوب الفردية خروج عن الطريق؛ مع رأيه، دون ترجيح من المتحف."
  en: "God's punishment of rebellious nations as Sheikh Omar Abdelkafy presents it: wind, the shout, earthquakes and volcanoes; the earthquake read between science and divine reminder; and individual sins as a departure from the path. The speaker's view is recorded without the museum weighing it."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق سرکش قوموں پر اللہ کی سزا: آندھی، چیخ، زلزلے اور آتش فشاں؛ زلزلے کو سائنس اور الٰہی یاددہانی کے درمیان دیکھنا؛ اور انفرادی گناہوں کو راستے سے انحراف سمجھنا۔ شیخ کی رائے درج ہے، میوزیم اس کا فیصلہ نہیں کرتا۔"
  es: "El castigo divino a las naciones rebeldes, según lo presenta el jeque Omar Abdelkafy: el viento, el grito, los terremotos y los volcanes; el terremoto interpretado como una mezcla entre ciencia y recordatorio divino; y los pecados individuales como una desviación del camino. La opinión del orador se registra sin la consideración del museo."
  fr: "Le châtiment divin des nations rebelles, tel que le présente le cheikh Omar Abdelkafy: le vent, le cri, les tremblements de terre et les volcans; le tremblement de terre interprété entre science et rappel divin; et les péchés individuels comme un égarement du droit chemin. Le point de vue de l’orateur est retranscrit sans que le musée ne le prenne en compte."
  tr: "Şeyh Ömer Abdülkafi tarafından sunulan isyancı uluslara Tanrı'nın cezaları: rüzgar, bağırış, depremler, volkanlar ve depremlerin bilgi ile ilahi hatırlatmalar arasındaki yorumu, bireysel günahların bir çıkış yolu olduğu; onun görüşüne göre, müzeden hiçbir ayrıcalık olmadan."
  id: "Hukuman Tuhan bagi bangsa-bangsa pemberontak seperti yang disampaikan oleh Sheikh Omar Abdel Kafi: angin, teriakan, gempa bumi, gunung berapi, dan penafsiran gempa di antara pengetahuan dan pengingat ilahi, serta bahwa dosa individu adalah jalan keluar; menurutnya, tanpa restu dari museum."
