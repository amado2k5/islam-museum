  en: "God's punishment of rebellious nations as Sheikh Omar Abdelkafy presents it: wind, the shout, earthquakes and volcanoes; the earthquake read between science and divine reminder; and individual sins as a departure from the path. The speaker's view is recorded without the museum weighing it."
