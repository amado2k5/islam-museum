label:
  ar: "المقدّم على الكلب"
  en: "Canis Minor (al-Muqaddam al-Kalb)"
  ur: "مقدم الکلب"
summary:
  ar: "يُسمّي الفهرس الكلب الأصغر المقدّم على الكلب، ويذكر اسمه اليوناني بروكيون، أي الذي يسبق الكلب. في آخر الصورة نجمان مضيئان، والنجم المضيء الذي خلفهما يُسمّى الشعرى الشامية. لا تُنقل المواضع هنا. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  en: "The Lesser Dog is named al-Muqaddam al-Kalb, the one placed before the dog, and its heading gives the Greek prokyon. Two bright stars lie at the end of the figure, and the bright star behind them is called ash-Shi'ra ash-Shamiyya. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.172}"
  ur: "فہرست میں چھوٹا کتا مقدم الکلب کے نام سے آتا ہے، یعنی وہ جو کتے سے پہلے رکھا گیا، اور عنوان میں یونانی نام پروکیون درج ہے۔ صورت کے آخر میں دو روشن ستارے ہیں، اور ان کے پیچھے کا روشن ستارہ الشعری الشامیہ کہلاتا ہے۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.172}"
