id: concept/iktmakt
class: concept
kind: natural
label:
  ar: "إكتمكت"
  en: "Iktmakt (an Indian drug)"
  ur: "اکتمکت ⁦(ہندی دوا)⁩"
  es: "Iktmakt (una droga india)"
  fr: "Iktmakt (une drogue indienne)"
  tr: "Sessiz kaldım"
  id: "Aku diam saja"
summary:
  ar: "دواء هندي يفعل فعل الفاوانيا، ويُطلى به موضع صعود البخار فيمنع الصرع. وفي تعليق الهامش أنه حجر يسهّل الولادة، وهو ما ورد في الهامش لا في متن الكتاب {cite:canon-ibn-sina-print-v1 p.375}."
  en: "An Indian drug that acts like fawaniya. Applied to the place where vapour rises, it is said to prevent epilepsy. The editor's footnote calls it a stone that eases childbirth; that comes from the footnote, not the text {cite:canon-ibn-sina-print-v1 p.375}."
  ur: "ایک ہندی دوا جو فاوانیا جیسا اثر رکھتی ہے۔ جہاں بخار اوپر چڑھتا ہے وہاں لگانے سے مرگی روکتی ہے، ایسا کتاب بتاتی ہے۔ حاشیے میں اسے ایسا پتھر کہا گیا ہے جو ولادت آسان کرتا ہے؛ یہ بات حاشیے میں ہے، متن میں نہیں {cite:canon-ibn-sina-print-v1 p.375}۔"
  es: "Un medicamento indio con efectos similares a la fawaniya. Aplicado en el lugar donde asciende el vapor, se dice que previene la epilepsia. La nota al pie del editor lo describe como una piedra que facilita el parto; esta afirmación proviene de la nota al pie, no del texto {cite:canon-ibn-sina-print-v1 p.375}."
  fr: "Un médicament indien aux propriétés similaires à celles du fawaniya. Appliqué à l'endroit où s'élèvent les vapeurs, il est censé prévenir l'épilepsie. Une note de bas de page de l'éditeur le décrit comme une pierre facilitant l'accouchement; cette information provient de la note et non du texte {cite:canon-ibn-sina-print-v1 p.375}."
  tr: "Şakayık işlevini aktive eden bir Hint ilacıdır ve epilepsiyi önlemek için buharın yükseldiği noktada kaplanır. Dipnotta, doğumu kolaylaştıran bir taştır; dipnotta bahsedilir ancak kitabın metninde yoktur {cite:canon-ibn-sina-print-v1 s.375}."
  id: "Obat India yang mengaktifkan fungsi peony, dan dilapisi di titik di mana uap naik untuk mencegah epilepsi. Dalam catatan kaki, batu ini memudahkan persalinan, yang disebutkan dalam catatan kaki tetapi tidak dalam teks buku {cite:canon-ibn-sina-print-v1 hlm.375}."
