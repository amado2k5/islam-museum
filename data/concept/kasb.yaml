- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: أعمال العباد يخلقها الله والعباد لا يقدرون أن يخلقوا منها شيئاً
    en: The acts of the servants are created by God and the servants cannot create any of them
  summary:
    ar: يذكر الأشعري عن أهل الحديث والسنة أنهم أقروا بأن أعمال العباد يخلقها الله عز وجل وأن العباد لا يقدرون أن يخلقوا منها شيئاً، ولا يستعمل في هذا الموضع لفظ «الكسب».
    en: Al-Ash'ari reports of the hadith scholars and Ahl al-Sunna that they affirm that God creates the acts of the servants and that the servants cannot create any of them; he does not use the word kasb
      in this passage.
