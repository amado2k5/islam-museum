  id: lumat-al-itiqad
  stance:
    ar: للعبد فعل وكسب يُجزى عليه، وهو واقع بقضاء الله وقدره
    en: The servant has an act and an acquisition for which he is recompensed, and it happens by God's decree
  summary:
    ar: 'يستدل ابن قدامة بقوله تعالى: «اليوم تجزى كل نفس بما كسبت» على أن «للعبد فعلاً وكسباً يجزى على حسنه بالثواب، وعلى سيئه بالعقاب، وهو واقع بقضاء الله وقدره»، ولا يذكر تقسيم الاستطاعة الذي يذكره الطحاوي.'
    en: Ibn Qudama argues from the verse that every soul is recompensed for what it earned that the servant has an act and an acquisition rewarded or punished, happening by God's decree; he does not give the division of capacity that al-Tahawi gives.
