label:
  ar: "كَسْب"
  en: "Earning a living (kasb)"
  ur: "کسب (روزی کمانا)"
summary:
  ar: "الكسب في الاصطلاح الفعل المفضي إلى اجتلاب نفع أو دفع ضرر، وهو فرض بقدر الكفاية، ومستحب فيما زاد لمواساة الفقراء وصلة الأقارب، ومباح لزيادة المال والتنعم بشرط سلامة الدين. وتكلم الفقهاء في تفضيل الغنى على الفقر وفي تفضيل الكسب على التفرغ للعبادة، وفي أفضل أنواع الكسب، وفي سؤال القادر على الكسب، وفي إجبار المفلس على الكسب، وفي تكليف الصغير بالكسب، وفي الكسب في المسجد، وفي المال الخبيث وكيفية التخلص منه، وفي ميراث المال المجهول المصدر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13256} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13260} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263}"
  en: "Kasb is, in the terminology, an action that brings a benefit or removes a harm. Earning enough for oneself and one's dependants is an obligation; earning beyond that is recommended to help the poor and kin, and permitted for more wealth and comfort while keeping faith and honour. The jurists discuss whether wealth or poverty is better; whether earning or devoting oneself to worship is better; the best kinds of earning (jihad first, then agriculture, then trade, then craft); begging by one able to earn (forbidden, though if given it may be taken); compelling an indebted man to earn (the Hanbalis allow it, others not); the earning of children; working in a mosque (disliked); and what to do with wealth gained unlawfully, which is returned to its owners or given away. Wealth inherited of unknown source is lawful by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13256} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13260} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263}"
  ur: "فقہی اصطلاح میں کسب وہ عمل ہے جو نفع حاصل کرے یا نقصان دور کرے۔ اپنے اور اہل و عیال کی کفایت کے بقدر کمانا فرض ہے؛ اس سے زیادہ کمانا فقراء اور رشتہ داروں کی مدد کے لیے مستحب ہے، اور مال بڑھانے یا آرام کے لیے مباح ہے، بشرطیکہ دین، عزت اور مروت محفوظ ہوں۔ فقہاء نے غنی و فقیر کی فضیلت، کسب اور عبادت کے تفرغ کی فضیلت، بہترین اقسامِ کسب (جہاد، پھر زراعت، پھر تجارت، پھر صنعت)، قادر کا سوال کرنا، مقروض کو کمائی پر مجبور کرنا، بچوں سے کام لینا، مسجد میں کام، اور حرام مال کی واپسی یا صدقہ پر بحث کی ہے؛ اور جس مال کا ماخذ معلوم نہ ہو وہ وارث کے لیے بالاجماع حلال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13256} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13257} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13258} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13260} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13261} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13262} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263}"
