issue:
  ar: ما نسبة فعل العبد إلى الله وإلى العبد، وما الاستطاعة؟
  en: How is the servant's act attributed to God and to the servant, and what is capacity?
perspectives:
- tradition: sunni-hanafi
  id: aqida-tahawiyya
  stance:
    ar: أفعال العباد بخلق الله وكسب منهم، والاستطاعة نوعان
    en: The acts of servants are by God's creation and their acquisition, and capacity is of two kinds
  summary:
    ar: يقول الطحاوي إن أفعال العباد بخلق الله وكسب من العباد، ويفرّق بين استطاعة مع الفعل واستطاعة من جهة الصحة والوسع قبل الفعل.
