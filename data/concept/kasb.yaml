  en: Kasb (acquisition) and capacity
summary:
  ar: 'قول الطحاوي إن أفعال العباد بخلق الله وكسب من العباد، وبيانه نوعين من الاستطاعة: التي مع الفعل، والتي من جهة الصحة والوسع وهي قبل الفعل.'
  en: 'al-Tahawi''s statement that the acts of servants are by God''s creation and the servants'' acquisition, and his distinction of two kinds of capacity: the one that comes with the act, and capacity in health and means which precedes it.'
