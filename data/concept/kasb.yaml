- tradition: sunni-hanbali
  id: aqida-wasitiyya
  stance:
    ar: العباد فاعلون حقيقة والله خالق أفعالهم وقدرتهم وإرادتهم
    en: The servants truly act, and God is the creator of their acts, power and will
  summary:
    ar: 'لا يستعمل ابن تيمية في العقيدة الواسطية لفظ «الكسب»، ويقول: «والعباد فاعلون حقيقة والله خالق أفعالهم»، وإن للعباد قدرة على أعمالهم وإرادة، والله خالق قدرتهم وإرادتهم.'
    en: Ibn Taymiyya does not use the word kasb in al-Wasitiyya; he says the servants are truly the doers and God is the creator of their acts, that servants have power over their acts and will, and that
      God created their power and will.
  holders:
