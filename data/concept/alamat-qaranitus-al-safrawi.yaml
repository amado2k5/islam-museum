id: concept/alamat-qaranitus-al-safrawi
class: concept
kind: scientific
label:
  ar: "علامات قرانيطس الصفراوي"
  en: "Signs of the bilious qaranitus"
  fr: "Signes du qaranitus bilieux"
  ur: "صفراوی قرانیطس کی علامات"
  es: "Signos del qaranitus bilioso."
summary:
  ar: "يذكر ابن سينا علامات السرسام الحقيقي الكائن عن صفراء صحيحة: كثرة السهر، وجفاف العينين، وخشونة اللسان واصفراره ثم اسوداده، وشدة الحمى، وتخيل الأشياء الصفر، وما يدخل في الأخلاق من الشراسة وحب الخصام {cite:canon-ibn-sina-print-v2 p.79} {cite:canon-ibn-sina-print-v2 p.80}"
  en: "Ibn Sina gives the signs of the true sarsam from pure bile: much wakefulness, dryness of the eyes, roughness and yellowing and then blackening of the tongue, intense fever, the fancying of yellow things, and the fierceness and love of quarrel that enter the temper {cite:canon-ibn-sina-print-v2 p.79} {cite:canon-ibn-sina-print-v2 p.80}"
  fr: "Ibn Sina donne les signes du véritable sarsam dû à la bile pure : veille prolongée, sécheresse des yeux, rugosité de la langue qui jaunit puis noircit, fièvre intense, visions d’objets jaunes, férocité et goût de la querelle qui gagnent le malade. {cite:canon-ibn-sina-print-v2 p.79} {cite:canon-ibn-sina-print-v2 p.80}"
  ur: "ابن سینا خالص صفراء سے ہونے والے حقیقی سرسام کی علامات بتاتا ہے: بہت بے خوابی، آنکھوں کی خشکی، زبان کی کھردراہٹ، پھر زردی اور پھر سیاہی، شدید بخار، زرد چیزوں کا خیال، اور مزاج میں درندگی اور جھگڑے کی حرص کا داخل ہونا {cite:canon-ibn-sina-print-v2 p.79} {cite:canon-ibn-sina-print-v2 p.80}۔"
  es: "Ibn Sina da los signos del verdadero sarsam de bilis pura: mucha vigilia, sequedad en los ojos, aspereza y coloración amarillenta y luego ennegrecimiento de la lengua, fiebre intensa, afición por cosas amarillas y la ferocidad y el gusto por las riñas que se apoderan del temperamento {cite:canon-ibn-sina-print-v2 p.79} {cite:canon-ibn-sina-print-v2 p.80}"
