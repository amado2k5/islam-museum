issue:
  ar: "لماذا وُصفت الفاتحة بأم الكتاب، وهل تصح الصلاة بدونها؟"
  en: "Why is the Fatiha called the Umm al-Kitab, and is prayer valid without it?"
  ur: "فاتحہ کو ام الکتاب کیوں کہا گیا، اور کیا اس کے بغیر نماز درست ہے؟"
