id: concept/al-fatiha-umm-al-kitab
class: concept
kind: term
label:
  ar: "الفاتحة أم الكتاب"
  en: "Al-Fatiha as Umm al-Kitab (the mother of the Book)"
  ur: "سورۂ فاتحہ، ام الکتاب"
summary:
  ar: "وصف الفاتحة بأنها أم الكتاب، ولا تصح الصلاة بدونها. يذكر الشعراوي الحديث في ذلك، وحديث قدسي يقسّم الصلاة بين الله وعبده، ويلاحظ أن الحديث قال «قسمت الصلاة» لا «قسمت الفاتحة»، ويرى أن تكرار أسماء الله في البسملة والفاتحة لا يعني تكراراً في المعنى {cite:tafsir-sharawi-khawatir-scan p.51} {cite:tafsir-sharawi-khawatir-scan p.52}. هذا تفسيره ويُنسب إليه."
  en: "The Fatiha is called the Umm al-Kitab and prayer is not valid without it. Sha'rawi cites the hadith to that effect and a hadith qudsi that divides the prayer between God and His servant, noting that it says 'I divided the prayer', not 'the Fatiha'. He holds that repeated names in the basmala and the Fatiha do not repeat the meaning {cite:tafsir-sharawi-khawatir-scan p.51} {cite:tafsir-sharawi-khawatir-scan p.52}. This is Sha'rawi's reading and is attributed to him."
  ur: "فاتحہ کو ام الکتاب کہا گیا ہے اور اس کے بغیر نماز درست نہیں۔ شعراوی اس بارے میں حدیث اور ایک حدیث قدسی نقل کرتے ہیں جو نماز کو اللہ اور بندے کے درمیان تقسیم کرتی ہے، اور وہ توجہ دلاتے ہیں کہ حدیث میں «قسمت الصلاة» ہے «قسمت الفاتحة» نہیں۔ ان کے نزدیک بسملہ اور فاتحہ میں اللہ کے ناموں کی تکرار سے معنی کی تکرار نہیں ہوتی {cite:tafsir-sharawi-khawatir-scan p.51} {cite:tafsir-sharawi-khawatir-scan p.52}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
