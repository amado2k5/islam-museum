  en: "Wilaya over the person (fiqh)"
  es: "Wilaya sobre la persona (fiqh)"
  fr: "Wilaya sur la personne (fiqh)"
summary:
  ar: "الولاية على النفس: سلطة الإشراف على الشؤون المتعلقة بشخص المولّى عليه ونفسه، وأنواعها ثلاثة: ولاية الحضانة، والكفالة، وولاية التزويج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902}\n\nالحضانة حفظ الولد في مبيته وذهابه ومجيئه والقيام بمصالحه من طعامه ولباسه وتنظيف جسمه وموضعه، وهي واجبة شرعاً لأن المحضون قد يهلك أو يتضرر بترك الحفظ. وإذا استغنى الصغير عن الحاضنة انتقل إلى مرحلة الكفالة، وتنتهي الحضانة عند التمييز في قول، وقيل تسمى حضانة أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902}\n\nفي بداية هذه الولاية: الشافعية والحنابلة يخيّرون الصبي إذا بلغ سبع سنين عاقلاً بين أبويه المؤهلين، والحنفية يجعلون الأب يأخذه بعد السبع مع تفصيل بين الذكر والأنثى، والمالكية تستمر حضانة النساء إلى بلوغ الذكر، وللأنثى حتى تتزوج ويدخل بها زوجها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}\n\nوعند الحنفية يشترط لثبوت الحضانة للرجال: العصوبة، فيتقدم الأقرب فالأقرب، الأب ثم الجد، ثم الإخوة والأعمام على ترتيب مذكور، وللجارية لا تُسلَّم إلى ابن العم لأنه ليس بمحرم منها؛ والأمانة، فإن كان الصغير جارية لا يكون لعصبتها حق إن كانوا غير مأمونين، فيُجعل عند امرأة ثقة؛ واتحاد الدين، فلا حق للعصبة في الصبي إلا أن يكون على دينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904}\n\nكفالة الخنثى المشكل. الشافعية والحنابلة يعاملون الخنثى المشكل بعد البلوغ معاملة البنت البكر، والحنفية يرون أنه كالأنثى في الأحكام إلا في مسائل مستثناة ليست منها الكفالة، والمالكية يرون كفالة الأم لا تسقط ما دام مشكلاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904}\n\nانتهاء ولاية الكفالة ببلوغ الغلام والجارية، لاكتفائهما بأنفسهما، ويختلف الوقت إذا كان المكفول مجنوناً أو غير عاقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904}\n\nومن الحالات التي يبقى فيها الغلام البالغ تحت الكفالة: عند الحنفية إذا لم يكن مأموناً على نفسه فلأبيه ضمه لدفع الفتنة أو العار؛ وعند المالكية للأب ضم ابنه البالغ إذا خاف عليه السفه؛ وعند الشافعية والحنابلة يُمنع الأمرد أو من يخاف عليه الانفراد من مفارقة أبويه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}\n\nولاية التزويج الأصل فيها أنها ولاية نظر، وثبوت النظر للقادر على العاجز أمر معقول مشروع، لأنه من الإعانة على البر والإحسان وإغاثة الضعيف. وتفصيل أنواعها في موضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}"
  en: "Authority over the person is the power to supervise matters that concern the ward's own person. Its kinds are three: custody (hadana), guardianship proper (kafala), and marriage guardianship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902}\n\nCustody is keeping the child in his sleeping and in his going and coming, and caring for his food, clothing, bodily cleanliness and place. It is obligatory, since the child may perish or be harmed without it. When the child no longer needs the custodian, custody passes to a stage the jurists call kafala. Some say custody ends at discernment, and others that it continues to puberty under the name of custody. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902}\n\nOn when custody changes hands: the Shafi'is and Hanbalis let a sane boy of seven choose between his two eligible parents. The Hanafis have the father take him after seven, with a distinction between boy and girl. The Malikis keep custody with women until a boy's puberty and a girl's marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}\n\nThe Hanafis require for men's custody: agnation, so the nearest agnate precedes (the father, then the paternal grandfather, then the full and consanguine brothers and their sons, then the paternal uncles and their sons, in order); for a girl the cousin may not have her, since he is not her mahram; trustworthiness, so that if the agnates are not trustworthy the judge places her with a trustworthy woman; and unity of religion, so that an agnate of another religion has no right, though when the brothers differ in religion the Jewish brother prevails over the Muslim one, as they reported. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904}\n\nGuardianship over a khuntha (a person of doubtful sex). The Shafi'is and Hanbalis treat the doubtful hermaphrodite after puberty like a virgin girl. The Hanafis hold that such a person is like a female in all rulings except specified matters, and custody is not among them. The Malikis hold that the mother's custody does not end while the child remains of doubtful sex. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904}\n\nGuardianship of custody ends when the boy or girl reaches puberty, because they are then self-sufficient; the time differs when the ward is insane or non-discerning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904}\n\nCases in which an adult boy remains under guardianship: for the Hanafis, if he is not trustworthy for himself, his father may take him to prevent sedition or disgrace; for the Malikis, a father may take in his adult son if he fears his squandering; for the Shafi'is and Hanbalis, an adult boy who is beardless or feared to live alone may be kept from leaving his parents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}\n\nMarriage guardianship is in principle a guardianship of supervision (nazar). The capable supervising the incapable is reasonable and lawful, as a help in righteousness, a kindness and a relief to the weak. Its kinds are set out elsewhere. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}"
  es: "La autoridad sobre la persona es el poder de supervisar los asuntos que conciernen a la persona del tutelado. Sus tipos son tres: custodia (hadana), tutela propiamente dicha (kafala) y tutela matrimonial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902} La custodia es mantener al niño en su sueño y en sus idas y venidas, y cuidar de su comida, ropa, higiene corporal y lugar. Es obligatoria, ya que el niño puede perecer o sufrir daños sin ella. Cuando el niño ya no necesita al custodio, la custodia pasa a una etapa que los juristas llaman kafala. Algunos dicen que la custodia termina en el discernimiento, y otros que continúa hasta la pubertad bajo el nombre de custodia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902} Sobre cuándo cambia la custodia de manos: los shafi'is y hanbalis dejan que un niño cuerdo de siete años elija entre sus dos padres elegibles. Los hanafíes tienen al padre a cargo del niño después de los siete años, con una distinción entre niño y niña. Los malikíes mantienen la custodia con mujeres hasta la pubertad del niño y el matrimonio de la niña. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903} Los hanafíes requieren para la custodia de los hombres: agnación, por lo que el agnado más cercano precede (el padre, luego el abuelo paterno, luego los hermanos completos y consanguíneos y sus hijos, luego los tíos paternos y sus hijos, en orden); para una niña el primo no puede tenerla, ya que no es su mahram; confiabilidad, de modo que si los agnados no son confiables el juez la coloca con una mujer confiable; y unidad de religión, de modo que un agnado de otra religión no tiene derecho, aunque cuando los hermanos difieren en religión el hermano judío prevalece sobre el musulmán, como informaron. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904} Tutela sobre un khuntha (una persona de sexo dudoso). Los shafi'is y hanbalis tratan al hermafrodita dudoso después de la pubertad como a una niña virgen. Los hanafis sostienen que tal persona es como una mujer en todas las reglas excepto en asuntos específicos, y la custodia no está entre ellos. Los malikíes sostienen que la custodia de la madre no termina mientras el niño siga siendo de sexo dudoso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904} La tutela de la custodia termina cuando el niño o la niña alcanza la pubertad, porque entonces son autosuficientes; el tiempo difiere cuando el tutelado es demente o no discernido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904} Casos en los que un niño adulto permanece bajo tutela: para los Hanafis, si no es digno de confianza por sí mismo, su padre puede tomarlo para prevenir la sedición o la deshonra; para los Malikis, un padre puede tomar a su hijo adulto si teme que malgaste; para los Shafi'is y Hanbalis, un niño adulto que no tiene barba o se teme que viva solo puede ser retenido para que no se separe de sus padres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905} La tutela matrimonial es en principio una tutela de supervisión (nazar). Que el capaz supervise al incapaz es razonable y lícito, como ayuda en la rectitud, una bondad y un alivio para el débil. Sus tipos se establecen en otra parte. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}"
  fr: "L'autorité sur la personne est le pouvoir de superviser les affaires qui concernent la personne elle-même. Elle se décline en trois formes: la garde (hadana), la tutelle proprement dite (kafala) et la tutelle matrimoniale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902} La garde consiste à veiller sur l'enfant pendant son sommeil, à l'accompagner dans ses déplacements, à subvenir à ses besoins en matière de nourriture, de vêtements, d'hygiène corporelle et de logement. Elle est obligatoire, car l'enfant risque de périr ou de subir des dommages sans elle. Lorsque l'enfant n'a plus besoin de son tuteur, la garde passe à un stade que les juristes appellent kafala. Certains estiment que la garde prend fin à la maturité, tandis que d'autres la maintiennent jusqu'à la puberté sous le même nom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902} Concernant le transfert de la garde: les écoles chaféite et hanbalite permettent à un garçon sain d'esprit de sept ans de choisir entre ses deux parents éligibles. Les Hanafites confient la garde de l'enfant au père après l'âge de sept ans, en faisant une distinction entre garçon et fille. Les Malikites, quant à eux, laissent la garde à une femme jusqu'à la puberté du garçon et le mariage de la fille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903} Pour la garde d'un enfant par un homme, les critères suivants sont requis: la filiation (le plus proche parent ayant la garde en premier: le père, puis le grand-père paternel, puis les frères germains et consanguins et leurs fils, puis les oncles paternels et leurs fils, dans cet ordre); pour une fille, le cousin ne peut en avoir la garde, car il n'est pas son mahram; la fiabilité (si les parents ne sont pas fiables, le juge confie l'enfant à une femme de confiance); et l'unité religieuse (un parent d'une autre religion n'a aucun droit sur l'enfant, même si, en cas de divergence religieuse entre frères, le frère juif prévaut sur le frère musulman, comme rapporté dans la tradition). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904} Tutelle d'un khuntha (personne de sexe indéterminé). Les écoles chaféite et hanbalite traitent l'hermaphrodite indéterminé après la puberté comme une jeune fille vierge. Les hanafites considèrent qu'une telle personne est assimilée à une femme à tous égards, sauf en ce qui concerne la tutelle. Les malikites estiment que la tutelle maternelle se poursuit tant que l'enfant demeure de sexe indéterminé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904} La tutelle prend fin lorsque le garçon ou la fille atteint la puberté, car il ou elle est alors autonome; ce délai peut varier si la personne sous tutelle est atteinte de troubles mentaux ou incapable de discernement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904} Cas où un garçon adulte reste sous tutelle: chez les Hanafites, s’il n’est pas digne de confiance, son père peut le prendre en charge pour prévenir la sédition ou le déshonneur; chez les Malikites, un père peut prendre son fils adulte sous sa tutelle s’il craint qu’il ne dilapide ses ressources; chez les Chafi’ites et les Hanbalites, un garçon adulte imberbe ou dont on craint qu’il vive seul peut être empêché de quitter ses parents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17905} La tutelle matrimoniale est en principe une tutelle de surveillance (nazar). La surveillance de l’incapable par une personne capable est raisonnable et licite, car elle constitue une aide à la droiture, une bienveillance et un soulagement pour le faible. Ses différentes formes sont exposées ailleurs. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.17905}"
