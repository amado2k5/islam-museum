label:
  ar: "ولاية على النفس"
  en: "Wilaya over the person (fiqh)"
summary:
  ar: "الولاية على النفس: سلطة الإشراف على الشؤون المتعلقة بشخص المولّى عليه ونفسه، وأنواعها ثلاثة: ولاية الحضانة، والكفالة، وولاية التزويج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902}\n\nالحضانة حفظ الولد في مبيته وذهابه ومجيئه والقيام بمصالحه من طعامه ولباسه وتنظيف جسمه وموضعه، وهي واجبة شرعاً لأن المحضون قد يهلك أو يتضرر بترك الحفظ. وإذا استغنى الصغير عن الحاضنة انتقل إلى مرحلة الكفالة، وتنتهي الحضانة عند التمييز في قول، وقيل تسمى حضانة أيضاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902}\n\nفي بداية هذه الولاية: الشافعية والحنابلة يخيّرون الصبي إذا بلغ سبع سنين عاقلاً بين أبويه المؤهلين، والحنفية يجعلون الأب يأخذه بعد السبع مع تفصيل بين الذكر والأنثى، والمالكية تستمر حضانة النساء إلى بلوغ الذكر، وللأنثى حتى تتزوج ويدخل بها زوجها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}\n\nوعند الحنفية يشترط لثبوت الحضانة للرجال: العصوبة، فيتقدم الأقرب فالأقرب، الأب ثم الجد، ثم الإخوة والأعمام على ترتيب مذكور، وللجارية لا تُسلَّم إلى ابن العم لأنه ليس بمحرم منها؛ والأمانة، فإن كان الصغير جارية لا يكون لعصبتها حق إن كانوا غير مأمونين، فيُجعل عند امرأة ثقة؛ واتحاد الدين، فلا حق للعصبة في الصبي إلا أن يكون على دينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904}"
  en: "Authority over the person is the power to supervise matters that concern the ward's own person. Its kinds are three: custody (hadana), guardianship proper (kafala), and marriage guardianship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902}\n\nCustody is keeping the child in his sleeping and in his going and coming, and caring for his food, clothing, bodily cleanliness and place. It is obligatory, since the child may perish or be harmed without it. When the child no longer needs the custodian, custody passes to a stage the jurists call kafala. Some say custody ends at discernment, and others that it continues to puberty under the name of custody. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17902}\n\nOn when custody changes hands: the Shafi'is and Hanbalis let a sane boy of seven choose between his two eligible parents. The Hanafis have the father take him after seven, with a distinction between boy and girl. The Malikis keep custody with women until a boy's puberty and a girl's marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}\n\nThe Hanafis require for men's custody: agnation, so the nearest agnate precedes (the father, then the paternal grandfather, then the full and consanguine brothers and their sons, then the paternal uncles and their sons, in order); for a girl the cousin may not have her, since he is not her mahram; trustworthiness, so that if the agnates are not trustworthy the judge places her with a trustworthy woman; and unity of religion, so that an agnate of another religion has no right, though when the brothers differ in religion the Jewish brother prevails over the Muslim one, as they reported. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17903}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17904}"
