id: concept/intiqalat-al-nafs
class: concept
kind: scientific
label:
  ar: "الانتقالات بين أصناف النفس والنفس المحرك للرئة"
  en: "The passages between the breath-kinds and the breath that stirs the lung"
  ur: "سانس کی اقسام کے درمیان انتقالات اور پھیپھڑے کو ہلانے والی سانس"
  es: "Los conductos entre los diferentes tipos de respiración y la respiración que agita el pulmón."
  fr: "Les passages entre les différents types de respiration et la respiration qui anime les poumons"
summary:
  ar: "إذا زادت الحاجة ولم يكن لها حائل عظم النفس فإن زادت أكثر أسرع فإن زادت أكثر تواتر فإذا تراجعت الحاجة نقص أولاً التواتر ثم السرعة ثم العظم وكذلك إذا قل الحائل والمنع وإذا فقد التراجع في المعاني الثلاثة وجد التفاوت أكثر ثم الإبطاء ثم الصغر فيكون الخروج عن الطبيعي إلى الصغر أقل من إلى البطء وإليهما أقل منه إلى التفاوت، ويعتبر هذا في الانبساط والانقباض جميعاً فيختلف زمان السكون قبل كل واحدة بحسب دعاء سببها إلى الزيادة، والنفس المتتابع السريع يتبع ورماً حاراً ضيقاً عن سدة، والنفس المتحرك أي المحرك للرئة يدل على خور من القوة أو ضيق شديد خانق في الذبحة أو جمع مدة وانصبابها أو خلط {cite:canon-ibn-sina-print-v2 p.311}"
  en: "When the need grows and nothing bars it, the breath grows large; if it grows further it quickens; if further still it turns frequent. When the need falls back, the frequency lessens first, then the swiftness, then the largeness; and likewise when the bar and the hindrance shrink. And if the falling-back in the three meanings fails, the unevenness is found the more, then the slowing, then the smallness — so the departure from the natural toward smallness is less than toward slowness, and toward both less than toward unevenness. This is weighed in the expansion and the contraction together, the rest-time before each differing by how much its cause urges the increase; and the following swift breath attends a hot tumour narrowed by a blockage. The stirring breath — the one stirring the lung — points to a flagging of the power, or a severe choking narrowness in the quinsy, or a gathering of pus and its pouring, or a humour {cite:canon-ibn-sina-print-v2 p.311}"
  ur: "جب ضرورت بڑھے اور کوئی حائل نہ ہو تو سانس بڑی ہوتی ہے اگر مزید بڑھے تو تیز اگر مزید تو متواتر؛ جب ضرورت لوٹے تو پہلے تواتر گھٹتا ہے پھر تیزی پھر بڑائی؛ اور ایسے ہی جب حائل اور روک گھٹے؛ اور اگر تینوں معنوں میں لوٹاؤ نہ ہو تو سب سے پہلے تفاوت بڑھتی ہے پھر سستی پھر چھوٹائی — تو فطرت سے نکلنا چھوٹائی کی طرف بطء سے کم ہے اور ان دونوں کی طرف تفاوت سے کم؛ یہ بات پھیلاؤ اور سمٹاؤ دونوں میں ناپی جائے کہ ہر ایک سے پہلے سکون کا زمانہ اس بات کے مطابق بدلتا ہے کہ اس کا سبب اضافے کو کتنا بلاتا ہے؛ اور متواتر تیز سانس گرم تنگ سوجن کے پیچھے چلتی ہے جو سدے سے ہو؛ اور متحرک سانس یعنی پھیپھڑے کو ہلانے والی قوت کے جھکنے پر یا ذبح میں شدید گھٹانے والی تنگی پر یا مدہ کے جمع اور بہنے پر یا خلط پر دلالت کرتی ہے {cite:canon-ibn-sina-print-v2 p.311}"
  es: "Cuando la necesidad crece y nada la frena, la respiración se hace más profunda; si crece aún más, se acelera; si se acelera aún más, se vuelve frecuente. Cuando la necesidad retrocede, la frecuencia disminuye primero, luego la rapidez, luego la profundidad; y lo mismo ocurre cuando la barrera y el obstáculo se reducen. Y si el retroceso en los tres sentidos falla, la irregularidad se encuentra más, luego la lentitud, luego la pequeñez; así que la desviación de lo natural hacia la pequeñez es menor que hacia la lentitud, y hacia ambas es menor que hacia la irregularidad. Esto se pondera en la expansión y la contracción juntas, el tiempo de descanso antes de cada una difiere según cuánto su causa impulsa el aumento; y la respiración rápida que sigue acompaña a un tumor caliente estrechado por un bloqueo. La respiración agitada —la que agita el pulmón— apunta a una disminución de la fuerza, o a una estrechez severa y asfixiante en el amigdalino, o a una acumulación de pus y su vertido, o a un humor {cite:canon-ibn-sina-print-v2 p.311}"
  fr: "Quand le besoin s'accroît et que rien ne s'y oppose, le souffle s'amplifie; s'il s'accroît encore, il s'accélère; s'il s'accroît encore davantage, il devient fréquent. Quand le besoin diminue, la fréquence décroît d'abord, puis l'accélération, puis l'amplitude; et il en va de même lorsque l'obstacle et la contrainte s'estompent. Et si le recul, dans les trois sens du terme, échoue, l'irrégularité s'accentue, puis le ralentissement, puis la diminution – ainsi, l'écart par rapport au naturel vers la diminution est moindre que vers le ralentissement, et vers les deux moindre que vers l'irrégularité. Ceci est pesé dans l'expansion et la contraction combinées, le temps de repos avant chacune différant selon l'intensité avec laquelle sa cause pousse à l'augmentation; et le souffle rapide qui suit accompagne une tumeur brûlante rétrécie par un blocage. La respiration agitée — celle qui agite le poumon — indique un affaiblissement de la force, ou une constriction sévère et suffocante dans l'angine, ou une accumulation de pus et son écoulement, ou une humeur {cite:canon-ibn-sina-print-v2 p.311}"
