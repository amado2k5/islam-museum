summary:
  ar: "يقسم ابن سينا كل ما يرد على البدن ويجري بينه وبينه فعل وانفعال بحسب تغيره عن البدن وتغييره إياه، فالذي يتغير عن البدن ولا يغيره ويتشبه به هو الغذاء على الإطلاق، والذي لا يتشبه به هو الدواء المعتدل {cite:canon-ibn-sina-print-v1 p.133}."
  en: "Ibn Sina sorts everything that comes upon the body, and between which and the body action and being acted upon pass, by how it is changed by the body and how it changes the body. What is changed by the body without changing it appreciably and is assimilated to it is food in the absolute sense; what is not assimilated is the moderate drug {cite:canon-ibn-sina-print-v1 p.133}."
