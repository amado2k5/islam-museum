label: { ar: "تقسيم الغذاء والدواء والسم عند ابن سينا", en: "The classification of food, drug and poison in the Canon", ur: "قانون میں غذا، دوا اور زہر کی تقسیم", es: "La clasificación de alimentos, medicamentos y venenos en el Canon", fr: "La classification des aliments, des médicaments et des poisons dans le Canon" }
summary:
  ar: "يقسم ابن سينا كل ما يرد على البدن ويجري بينه وبينه فعل وانفعال بحسب تغيره عن البدن وتغييره إياه، فالذي يتغير عن البدن ولا يغيره ويتشبه به هو الغذاء على الإطلاق، والذي لا يتشبه به هو الدواء المعتدل {cite:canon-ibn-sina-print-v1 p.133}."
  en: "Ibn Sina sorts everything that comes upon the body, and between which and the body action and being acted upon pass, by how it is changed by the body and how it changes the body. What is changed by the body without changing it appreciably and is assimilated to it is food in the absolute sense; what is not assimilated is the moderate drug {cite:canon-ibn-sina-print-v1 p.133}."
  es: "Ibn Sina clasifica todo lo que llega al cuerpo, y entre lo cual pasa la acción y el ser actuado, según cómo es transformado por el cuerpo y cómo lo transforma. Lo que es transformado por el cuerpo sin alterarlo apreciablemente y es asimilado a él es alimento en sentido absoluto; lo que no es asimilado es la droga moderada {cite:canon-ibn-sina-print-v1 p.133}."
  fr: "Ibn Sina classe tout ce qui entre en contact avec le corps, et entre ce qui et le corps (action et action), selon la manière dont le corps le transforme et dont il le transforme. Ce qui est transformé par le corps sans le modifier sensiblement et qui est assimilé par lui est la nourriture au sens absolu; ce qui n’est pas assimilé est le médicament modéré {cite:canon-ibn-sina-print-v1 p.133}."
  ur: "ابن سینا ہر اس چیز کو ترتیب دیتا ہے جو جسم پر آتی ہے، اور جس کے درمیان اور جسم کے عمل اور عمل پر عمل ہوتا ہے، اس لحاظ سے کہ یہ جسم کس طرح بدلتا ہے اور جسم میں کیسے تبدیلی آتی ہے۔ جو چیز جسم کی طرف سے اس میں قابل قدر تبدیلی کے بغیر تبدیل ہوتی ہے اور اس میں ضم ہو جاتی ہے وہ مطلق معنوں میں خوراک ہے۔ جو چیز جذب نہیں ہوتی وہ ہے معتدل دوا {حوالہ:کینن ابن سینا پرنٹ-v1 صفحہ 133}۔"
