label:
  ar: "قروقومغما"
  en: "Qarwqumghma (said to be saffron-oil dregs)"
  ur: "قروقومغما"
  es: "Qarwqumghma (se dice que son posos de aceite de azafrán)"
  fr: "Qarwqumghma (considéré comme des résidus d'huile de safran)"
  tr: "Qarokumgamma"
  id: "Qarokumgamma"
summary:
  ar: "قروقومغما في الكتاب قيل إنه ثفل دهن الزعفران، أجوده الطيب الرائحة الرزين الأسود الذي لا عيدان فيه، يصبغ الماء بلون الزعفران، مسخن منضج جال للعين مدر للبول {cite:canon-ibn-sina-print-v1 pp.648-649}"
  en: "Qarwqumghma is in the book said to be the dregs of saffron oil, the best fragrant, heavy and black, with no sticks in it, dyeing the water the colour of saffron; heating and ripening, clearing for the eye and inducing urine {cite:canon-ibn-sina-print-v1 pp.648-649}"
  ur: "قروقومغما کتاب میں کہا گیا ہے کہ زعفران کے تیل کی تلچھٹ ہے، بہترین خوشبودار، بھاری اور سیاہ جس میں تنکے نہ ہوں، جو پانی کو زعفران کے رنگ میں رنگ دے؛ گرم کرنے والا، پکانے والا، آنکھ کو جلا دینے والا اور پیشاب لانے والا {cite:canon-ibn-sina-print-v1 pp.648-649}۔"
  es: "En el libro se dice que Qarwqumghma son los posos del aceite de azafrán, el mejor, fragante, denso y negro, sin ramitas, que tiñe el agua del color del azafrán; calentándolo y madurándolo, aclara la vista e induce la micción {cite:canon-ibn-sina-print-v1 pp.648-649}"
  fr: "Le Qarwqumghma est décrit dans le livre comme étant le résidu d'huile de safran, le plus parfumé, lourd et noir, sans particules, colorant l'eau de la couleur du safran; chauffant et mûrissant, éclaircissant pour les yeux et favorisant la diurèse {cite:canon-ibn-sina-print-v1 pp.648-649}"
  tr: "Kitapta bunun safranın yağı olduğu söylenir; en zengin, kokulu, sade olan, çubuksuz siyah, su safran renginde, sıcak, olgun, göz alıcı bir idrar söktürücüdür {cite:canon-ibn-sina-print-v1 s.648-649}"
  id: "Dalam buku tersebut, dikatakan bahwa itu adalah lemak saffron, yang paling kaya, harum, sederhana, hitam tanpa ranting, airnya berwarna saffron, diuretik hangat, matang, dan menarik perhatian {cite:canon-ibn-sina-print-v1 hlm.648-649}"
