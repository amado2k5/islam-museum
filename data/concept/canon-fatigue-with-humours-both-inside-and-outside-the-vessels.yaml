summary:
  ar: "يوجب ابن سينا إذا استوى الأمران أن يقصد الهضم أولاً بالفلافلي، وأن يتدرج إلى الفودنجي الصرف عند انهضام ما في العروق، وأن لا يبادر بقيء ولا إسهال قبل التلطيف والتقطيع والإنضاج، ولا ترياض، ثم يعاد إلى العادة تدريجياً {cite:canon-ibn-sina-print-v1 p.249}."
  en: "When the two are equal Ibn Sina says to aim first at digestion with the pepper preparation, to move on to pure pennyroyal once what is in the vessels is digested, to avoid vomiting and purging before thinning, cutting and ripening, and exercise, and then to return gradually to habit {cite:canon-ibn-sina-print-v1 p.249}."
