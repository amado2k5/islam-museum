"label":
  "ar": "أسباب قروح الرئة"
  "en": "The causes of the lung's ulcers"
  fr: "Les causes des ulcères du poumon"
  "ur": "پھیپھڑے کے زخموں کے اسباب"
  "es": "Las causas de las úlceras pulmonares"
"summary":
  "ar": "وأما أسباب قروح الرئة فإما نزلة لذاعة أكالة أو معفنة لمجاورتها التي لا تسلم\
    \ معها الرئة إلى أن تنضج أو مادة من هذا الجنس تسيل إلى الرئة من عضو آخر أو تقدم\
    \ من ذات الرئة قد قاحت وتقرحت أو تقيح من ذات جنب أولي أو سبب من أسباب نفث الدم\
    \ صدعه كان سبباً من داخل مثل غليان دم أو غير ذلك مما قيل أو من خارج مثل سقطة وضربة،\
    \ وقد يكون من أسبابها عفونة نفسها كما يعرض للأعضاء الأخرى، وقد يكثر السل إذا أعقب\
    \ الصيف الشمالي اليابس خريف جنوبي ممطر {cite:canon-ibn-sina-print-v2 p.355}"
  "en": "The causes of the lung's ulcers: either a biting corrosive catarrh, or a\
    \ putrefying one by the adjacency that does not leave the lung until it ripens;\
    \ or a matter of this kind flowing into the lung from another organ; or a preceding\
    \ peripneumonia that has suppurated and ulcerated; or a suppuration from a first\
    \ pleurisy; or one of the causes of the spitting of blood — a breaking that was\
    \ an inward cause, like a boiling of blood or other things said, or an outward\
    \ one, like a fall or a blow. And among its causes may be its own putrefaction,\
    \ as befalls the other organs. Consumption may abound when a dry northern summer\
    \ is followed by a rainy southern autumn {cite:canon-ibn-sina-print-v2 p.355}"
  fr: "Les causes des ulcères du poumon : soit un catarrhe mordant et corrosif, soit un catarrhe putréfiant par son voisinage, qui ne quitte pas le poumon avant de mûrir ; une matière de ce genre s’écoulant d’un autre organe dans le poumon ; une péripneumonie antérieure qui a suppuré et s’est ulcérée ; une suppuration issue d’une première pleurésie ; ou une cause du crachement de sang — rupture due à une cause intérieure, comme l’ébullition du sang ou d’autres causes évoquées, ou extérieure, comme une chute ou un coup. Sa propre putréfaction peut aussi en être une cause, comme pour les autres organes. La phtisie peut abonder lorsqu’un été septentrional sec est suivi d’un automne méridional pluvieux {cite:canon-ibn-sina-print-v2 p.355}"
  "ur": "پھیپھڑے کے زخموں کے اسباب: یا لذعنے والی کوری نزلة یا اپنی مجاورت سے سڑانے\
    \ والی جو پھیپھڑے کو تب تک نہیں چھوڑتی جب تک پک نہ جائے یا اسی جنس کا مادہ کسی\
    \ اور عضو سے پھیپھڑے میں بہے یا پہلے کی ذات الرئة جو پیپ دار اور زخمی ہو گئی ہو\
    \ یا پہلی ذات الجنب سے تقيح ہو یا نفث الدم کے اسباب میں سے کوئی سبب یعنی ٹوٹ پھوٹ\
    \ جو باطنی سبب ہو جیسے خون کا جوش یا اور جو کہا گیا یا خارجی جیسے گرنا اور مار\
    \ اور اس کے اسباب میں اس کی اپنی سڑان بھی ہو سکتی ہے جیسے دیگر اعضاء کو ہوتی ہے\
    \ اور جب خشک شمالی گرمی کے بعد برساتی جنوبی خزاں آئے تو سل زیادہ ہو سکتا ہے {cite:canon-ibn-sina-print-v2\
    \ p.355}"
  "es": "Las causas de las úlceras pulmonares pueden ser: un catarro corrosivo e irritante, o uno putrefacto por contacto que no abandona el pulmón hasta su recuperación; una sustancia de este tipo que fluye hacia el pulmón desde otro órgano; una perineumonía previa que ha supurado y ulcerado; una supuración derivada de una primera pleuresía; o alguna de las causas de la hemorragia pulmonar: una lesión interna, como un hervor de sangre u otras causas similares, o una externa, como una caída o un golpe. Entre sus causas también puede figurar su propia putrefacción, como ocurre con los demás órganos. La tuberculosis puede proliferar cuando un verano seco en el norte es seguido por un otoño lluvioso en el sur. {cite:canon-ibn-sina-print-v2 p.355}"
