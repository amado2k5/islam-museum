  en: "Ibn Sina explains the flowing of moisture from infants' ears by the moistness of their bodies and brains, names a wool plug dipped in honey and wine and the like, then earache from wind or moisture and its treatment with drugs boiled in oil and dripped in {cite:canon-ibn-sina-print-v1 p.215}."
