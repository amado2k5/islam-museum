id: concept/canon-ear-discharge-and-earache-in-infants
class: concept
kind: scientific
label:
  ar: "سيلان الأذن ووجعها عند الصبيان عند ابن سينا"
  en: "Ear discharge and earache in infants in the Canon"
  fr: "Écoulement et douleur d’oreille du nourrisson dans le Canon"
  ur: "قانون میں بچوں کے کان کا بہنا اور درد"
  es: "Secreción ótica y dolor de oído en bebés en el Canon"
  tr: "İbn Sina'ya göre erkek çocuklarda kulak akıntısı ve ağrısı"
  id: "Keputihan telinga dan nyeri pada anak laki-laki menurut Ibn Sina"
summary:
  ar: "يعلل ابن سينا سيلان الرطوبة من آذان الصبيان برطوبة أبدانهم وأدمغتهم، ويذكر صوفة مغموسة في عسل وخمر ونحوها، ثم وجع الأذن من ريح أو رطوبة وعلاجه بأدوية تغلى في دهن وتقطر {cite:canon-ibn-sina-print-v1 p.215}."
  en: "Ibn Sina explains the flowing of moisture from infants' ears by the moistness of their bodies and brains, names a wool plug dipped in honey and wine and the like, then earache from wind or moisture and its treatment with drugs boiled in oil and dripped in {cite:canon-ibn-sina-print-v1 p.215}."
  fr: "Ibn Sina attribue l’écoulement auriculaire à l’humidité corporelle et cérébrale du nourrisson, mentionne laine imbibée de miel et vin ou semblables, puis douleur due aux vents ou à l’humidité et remèdes bouillis dans l’huile et instillés {cite:canon-ibn-sina-print-v1 p.215}."
  es: "Ibn Sina explica que la humedad que sale de los oídos de los bebés se debe a la humedad de sus cuerpos y cerebros, menciona un tapón de lana empapado en miel y vino y cosas similares, luego el dolor de oído causado por el viento o la humedad y su tratamiento con medicamentos hervidos en aceite y aplicados por goteo {cite:canon-ibn-sina-print-v1 p.215}."
  ur: "ابن سینا بچوں کے کانوں سے ان کے جسم اور دماغ کی رطوبت سے نکلنے والی رطوبت کی وضاحت کرتے ہوئے شہد اور شراب وغیرہ میں ڈوبی ہوئی اون کے پلگ کا نام دیتے ہیں، پھر ہوا یا نمی سے کان میں درد اور تیل میں ابال کر ٹپکنے والی دوائیوں سے اس کا علاج۔"
  tr: "İbn Sina, erkeklerin kulaklarından bedenlerine ve beyinlerine akan nemi açıklar, bal, şarap ve benzeri şeylere batırılmış bir yünden, ardından rüzgar veya nemden kaynaklanan kulak ağrısından bahseder ve bunu yağda haşlanmış ve damlatılmış ilaçlarla tedavi eder {cite:canon-ibn-sina-print-v1 s.215}."
  id: "Ibn Sina menjelaskan kelembapan yang mengalir dari telinga anak laki-laki ke kelembapan tubuh dan otak mereka, menyebutkan wol yang dicelupkan ke madu, anggur, dan sejenisnya, lalu sakit telinga akibat angin atau kelembapan, dan mengobatinya dengan obat yang direbus dalam minyak dan diteteskan {cite:canon-ibn-sina-print-v1 hlm.215}."
