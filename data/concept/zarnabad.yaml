  es: "Zarnabad (raíz de alcanfor)"
summary:
  ar: "الزرنباد أصول نبات يشبه السعد، أعظم منه وأقل عطرية، يُجلب من الصين، حار يابس في الثالثة؛ يحلّل الرياح، ويسمّن، وينفع من لدغ الهوام، ويحبس القيء. {cite:canon-ibn-sina-print-v1 p.457}"
  en: "Zarnabad is the root of a plant resembling sa'd, larger and less fragrant, brought from China; hot and dry in the third degree. It dissolves winds, fattens, helps vermin bites, and stops vomiting. {cite:canon-ibn-sina-print-v1 p.457}"
  ur: "زرنباد ایک پودے کی جڑ ہے جو سعد سے مشابہ ہے، اس سے بڑی اور کم خوشبودار، چین سے لائی جاتی ہے؛ تیسرے درجے میں گرم اور خشک۔ یہ ہوا کو تحلیل کرتا ہے، موٹاپا لاتا ہے، کیڑوں کے کاٹنے میں مفید ہے، اور قے روکتا ہے۔ {cite:canon-ibn-sina-print-v1 p.457}"
  es: "Zarnabad es la raíz de una planta parecida al sa'd, más grande y menos fragante, traída de China; de naturaleza cálida y seca en tercer grado. Disuelve los vientos, engorda, alivia las picaduras de parásitos y detiene el vómito. {cite:canon-ibn-sina-print-v1 p.457}"
