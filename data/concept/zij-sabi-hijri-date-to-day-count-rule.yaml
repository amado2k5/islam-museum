summary:
  ar: "يعطي البتاني قاعدة لتحويل التاريخ الهجري إلى عدد الأيام: تضرب السنين التامة في ثلاثمائة وأربعة وخمسين يوماً وخمسة أسداس يوم، وتُضاف أيام الشهور الماضية، فإن بلغ المجموع المطلوب فهو عدد الأيام منذ أول الهجرة. {cite:zij-sabi-nallino-byblion p.101}."
  en: "Al-Battani gives a rule for turning a Hijri date into a count of days: multiply the completed years by 354 and five-sixths of a day, add the days of the months that have passed, and the sum is the number of days since the start of the Hijra. {cite:zij-sabi-nallino-byblion p.101}."
  ur: "البتانی ہجری تاریخ کو دنوں کی گنتی میں بدلنے کا قاعدہ دیتے ہیں: مکمل سالوں کو 354 دن اور پانچ چھٹے دن سے ضرب دو، گزرے ہوئے مہینوں کے دن جمع کرو، تو حاصل ہجرت کے آغاز سے اب تک کے دنوں کی تعداد ہے۔ {cite:zij-sabi-nallino-byblion p.101}۔"
  es: "Al-Battani ofrece una regla para convertir una fecha Hijri en un recuento de días: multiplicar los años transcurridos por 354 y cinco sextos de día, sumar los días de los meses que han pasado, y la suma es el número de días desde el inicio de la Hijra. {cite:zij-sabi-nallino-byblion p.101}."
