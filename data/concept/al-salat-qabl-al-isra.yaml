id: concept/al-salat-qabl-al-isra
education:
  did_you_know:
    ar: "قبل المعراج كانت الصلاة المفروضة عند مقاتل بن سليمان ركعتين بالغداة وركعتين بالعشي، حتى فُرضت الخمس في الرحلة."
    en: "Before the Ascension, the ordained prayer — per Muqatil ibn Sulayman — was two rak'as at dawn and two at dusk, until the five were laid down on the journey."
    ur: "معراج سے پہلے مقاتل بن سلیمان کے بقول فرض نماز صبح اور شام دو دو رکعتیں تھیں، اس سفر میں پانچ فرض ہوئیں۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
class: concept
kind: legal
label: { ar: "الصلاة في أول الإسلام قبل الإسراء", en: "Prayer in early Islam before the Night Journey" }
summary:
  ar: "ما ينقله الرحيق المختوم في أول ما فُرض من الصلاة: ركعتان بالغداة وركعتان بالعشي عند مقاتل بن سليمان استدلالاً بآية غافر 55، وقول ابن حجر إن النبي وأصحابه كانوا يصلون قطعاً قبل الإسراء مع الخلاف في فرض شيء قبل الخمس، وتعليم جبريل الوضوء في أول ما أوحي، وصلاة المسلمين في الشعاب مستخفين."
  en: "What al-Raheeq al-Makhtum reports on the first prescription of prayer: two rakats morning and evening according to Muqatil ibn Sulayman citing Ghafir 55, Ibn Hajar's statement that the Prophet and his Companions certainly prayed before the Night Journey though whether anything was obligatory before the five prayers is disputed, Jibril's teaching of ablution at the first revelation, and the Muslims praying hidden in the ravines."
