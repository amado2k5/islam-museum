id: concept/al-salat-qabl-al-isra
education:
  did_you_know:
    ar: "قبل المعراج كانت الصلاة المفروضة عند مقاتل بن سليمان ركعتين بالغداة وركعتين بالعشي، حتى فُرضت الخمس في الرحلة."
    en: "Before the Ascension, the ordained prayer — per Muqatil ibn Sulayman — was two rak'as at dawn and two at dusk, until the five were laid down on the journey."
    ur: "معراج سے پہلے مقاتل بن سلیمان کے بقول فرض نماز صبح اور شام دو دو رکعتیں تھیں، اس سفر میں پانچ فرض ہوئیں۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
class: concept
kind: legal
label: { ar: "الصلاة في أول الإسلام قبل الإسراء", en: "Prayer in early Islam before the Night Journey", fr: "La prière au début de l’islam avant le Voyage nocturne", es: "La oración en los inicios del Islam antes del Viaje Nocturno", ur: "ابتدائی اسلام میں رات کے سفر سے پہلے کی دعا", tr: "İslam'ın başlangıcında İsra'dan önce namaz", id: "Shalat di hadapan Isra pada awal Islam" }
summary:
  ar: "ما ينقله الرحيق المختوم في أول ما فُرض من الصلاة: ركعتان بالغداة وركعتان بالعشي عند مقاتل بن سليمان استدلالاً بآية غافر 55، وقول ابن حجر إن النبي وأصحابه كانوا يصلون قطعاً قبل الإسراء مع الخلاف في فرض شيء قبل الخمس، وتعليم جبريل الوضوء في أول ما أوحي، وصلاة المسلمين في الشعاب مستخفين."
  en: "What al-Raheeq al-Makhtum reports on the first prescription of prayer: two rakats morning and evening according to Muqatil ibn Sulayman citing Ghafir 55, Ibn Hajar's statement that the Prophet and his Companions certainly prayed before the Night Journey though whether anything was obligatory before the five prayers is disputed, Jibril's teaching of ablution at the first revelation, and the Muslims praying hidden in the ravines."
  fr: "Ce que rapporte le Nectar cacheté (al-Raheeq al-Makhtum) sur la première prescription de la prière : deux rak'as le matin et le soir selon Muqatil ibn Sulayman, qui cite Ghafir 55 ; l’affirmation d’Ibn Hajar selon laquelle le Prophète et ses Compagnons priaient assurément avant le Voyage nocturne, bien que la question de savoir si quelque chose était obligatoire avant les cinq prières soit débattue ; l’enseignement des ablutions par Jibril lors de la première révélation ; et les musulmans priant cachés dans les ravins."
  es: "Lo que al-Raheeq al-Makhtum informa sobre la primera prescripción de la oración: dos rakats por la mañana y por la tarde según Muqatil ibn Sulayman citando Ghafir 55, la declaración de Ibn Hajar de que el Profeta y sus Compañeros ciertamente oraron antes del Viaje Nocturno aunque se discute si algo era obligatorio antes de las cinco oraciones, la enseñanza de Jibril sobre la ablución en la primera revelación y los musulmanes orando escondidos en los barrancos."
  ur: "الرحیق المختوم نے نماز کے پہلے نسخے کے بارے میں کیا بیان کیا ہے: مقاتل بن سلیمان کے مطابق صبح و شام دو رکعتیں غافر 55، ابن حجر کا بیان ہے کہ نبی اور آپ کے صحابہ نے رات کے سفر سے پہلے ضرور نماز ادا کی تھی، حالانکہ پانچوں نمازوں سے پہلے کوئی چیز واجب تھی یا نہیں، مسلمانوں میں پہلے وضو اور وضو کی تعلیم میں اختلاف ہے۔ گھاٹیوں میں چھپ کر دعا کرنا۔"
  tr: "Mühürlü nektarla nazın başında aktarılan şey: Mukatil ibn Süleyman'a göre sabah iki rekat, akşam iki rekât, 'Ghafir' ayetine dayanan 55 ayetine ve İbn Hacer'in Peygamber ve sahabelerinin İsra önünde kesin olarak namaz kıldığına dair ifadesi, ancak beş gün öncesi zorunluluk konusunda anlaşmazlık vardır, Cebrayıl'ın ilk vahyde abdest alma öğretisi ve vadilerde Müslümanların namazı gizlenmiştir."
  id: "Apa yang disampaikan di awal nektar yang disegel: Menurut Mukatil ibn Sulayman, dua rak'ah di pagi hari, dua rak'ah di malam hari, 55 ayat berdasarkan ayat 'Ghafir', dan pernyataan Ibn Hajar bahwa Nabi dan sahabatnya pasti telah berdoa sebelum Isra, tetapi ada perbedaan pendapat tentang kewajiban lima hari sebelumnya. Wahyu pertama Gabriel mengajarkan wudhu dan doa umat Muslim di lembah disembunyikan."
