summary:
  ar: "القوة الثالثة التي يذكرها الأطباء هي الحافظة والمذكرة، وهي خزانة لما يتأدى إلى الوهم من معان غير صور المحسوسات، وموضعها البطن المؤخر من الدماغ؛ والباقية من المدركة هي الإنسانية الناطقة التي لا ينظر فيها الطبيب {cite:canon-ibn-sina-print-v1 p.101}."
  en: "The third power physicians mention is the retentive and remembering one, a store for the meanings reaching estimation that are not the sensed forms, whose place is the back ventricle of the brain; what remains of the perceptive powers is the human rational one, which the physician does not examine {cite:canon-ibn-sina-print-v1 p.101}."
