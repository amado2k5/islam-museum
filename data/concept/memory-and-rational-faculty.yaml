label: { ar: "القوة الحافظة والمذكرة والقوة الناطقة عند ابن سينا", en: "The retentive and remembering faculty and the rational faculty in the Canon", ur: "قانون میں حافظہ، یاد اور ناطقہ قوت", es: "La facultad de retención y memoria y la facultad racional en el Canon", fr: "La faculté de rétention et de mémoire et la faculté rationnelle dans le Canon", tr: "İbn Sina'ya göre koruyucu güç, hafıza ve konuşma gücü", id: "Kekuatan Perlindungan, Memori, dan Kekuatan Berbicara menurut Ibn Sina" }
summary:
  ar: "القوة الثالثة التي يذكرها الأطباء هي الحافظة والمذكرة، وهي خزانة لما يتأدى إلى الوهم من معان غير صور المحسوسات، وموضعها البطن المؤخر من الدماغ؛ والباقية من المدركة هي الإنسانية الناطقة التي لا ينظر فيها الطبيب {cite:canon-ibn-sina-print-v1 p.101}."
  en: "The third power physicians mention is the retentive and remembering one, a store for the meanings reaching estimation that are not the sensed forms, whose place is the back ventricle of the brain; what remains of the perceptive powers is the human rational one, which the physician does not examine {cite:canon-ibn-sina-print-v1 p.101}."
  es: "La tercera facultad que mencionan los médicos es la de retención y memoria, un depósito para los significados que llegan a la estimación que no son las formas percibidas, cuyo lugar es el ventrículo posterior del cerebro; lo que queda de las facultades perceptivas es la facultad racional humana, que el médico no examina {cite:canon-ibn-sina-print-v1 p.101}."
  fr: "Le troisième pouvoir dont parlent les médecins est celui de la rétention et de la mémoire, un réservoir de significations atteignant une estimation qui ne sont pas les formes perçues, dont le siège est le ventricule postérieur du cerveau; ce qui reste des pouvoirs perceptifs est le pouvoir rationnel humain, que le médecin n'examine pas {cite:canon-ibn-sina-print-v1 p.101}."
  ur: "تیسرا پاور فزیشنز جس کا تذکرہ کرتے ہیں وہ ہے برقرار رکھنے والا اور یاد رکھنے والا، ان معنی تک پہنچنے کا ایک ذخیرہ جو حسی شکلیں نہیں ہیں، جن کی جگہ دماغ کا پچھلا ویںٹرکل ہے۔ جو ادراک کی قوتیں باقی رہ جاتی ہیں وہ انسانی عقلی ہے، جس کا طبیب معائنہ نہیں کرتا۔"
  tr: "Doktorların bahsettiği üçüncü güç ise hafıza ve hafızadır; bunlar, somut görüntüler dışında illüzyonlara yol açan anlamların deposudur. Konumu beynin arkasındaki karındır; kalan algı ise doktorun dikkate almadığı konuşan insanlıktır {cite:canon-ibn-sina-print-v1 s.101}."
  id: "Kekuatan ketiga yang disebutkan oleh dokter adalah memori dan memori, yang merupakan tempat penyimpanan makna yang mengarah pada ilusi selain gambar yang nyata. Lokasinya adalah perut yang terletak di belakang otak; persepsi yang tersisa adalah kemanusiaan yang berbicara yang tidak dianggap dokter {cite:canon-ibn-sina-print-v1 hlm.101}."
