id: concept/hubb
class: concept
kind: ethical
label:
  ar: الحب للأخ
  en: Love for one's brother
  es: "Amor por el hermano"
  fr: "L'amour pour son frère"
  ur: "اپنے بھائی سے محبت"
  tr: "Bir kardeşe olan aşk"
  id: "Cinta untuk saudara"
summary:
  ar: "أن يحب المؤمن لأخيه وللناس ما يحب لنفسه من الخير؛ جاء في حديث أنس بن مالك «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه» ولفظ مسلم «حتى يحب لجاره أو لأخيه»، وعند ابن حبان «لا يبلغ عبد حقيقة الإيمان حتى يحب للناس ما يحب لنفسه من الخير»؛ يبين ابن رجب أن هذه الزيادة توضح أن المراد بنفي الإيمان نفي بلوغ حقيقته ونهايته لا نفي أصله، فإن الإيمان يُنفى كثيراً لانتفاء بعض أركانه وواجباته، ومن ذلك محبة الخير للأخ والجار والناس؛ ويعد أبو عمرو بن الصلاح عن أبي محمد بن أبي زيد حديث «المؤمن يحب لأخيه ما يحب لنفسه» أحد الأحاديث الأربعة التي يتفرع منها جماع آداب الخير. وعند المسعودي سأل يحيى بن خالد أهل الكلام في مجلسه بعدما أكثروا في الكمون والظهور والقدم والحدوث فقولوا في العشق، فتكلم إمامي وخارجي ومعتزلي وهشام بن الحكم والنظام كل على مذهبه، وتنازع الناس في ابتداء وقوع الهوى أمن نظر وسماع أم اختيار واضطرار، فقال بقراط هو امتزاج النفسين، وقال بعض الأطباء إنه طمع يتولد في القلب يستحيل إلى السوداء حتى يموت صاحبه أو يقتل نفسه، وذهب بعضهم إلى أن الله جزأ كل روح أنصافاً فكل جسد لقي نصفه عشق ضرورة، واستشهدوا بالأرواح جنود مجندة وشعر جميل بثينة، وقال جالينوس المحبة تقع بين العاقلين لتشاكلهما في العقل ولا تقع بين الأحمقين {cite:muruj-al-dhahab p. 358-360}"
  en: "That the believer loves for his brother, and for people, what he loves for himself of good; in Anas ibn Malik's hadith 'none of you believes until he loves for his brother what he loves for himself' — Muslim's wording 'for his neighbour or his brother' — and in Ibn Hibban's version 'no servant reaches the reality of iman until he loves for people what he loves for himself of good'; Ibn Rajab explains that this addition clarifies that the negation of iman is a negation of attaining its reality and perfection rather than of its root, iman being often negated for the absence of some of its pillars and duties — loving good for one's brother, neighbour and people among them; Abu Amr ibn al-Salah reports from Abu Muhammad ibn Abi Zayd that 'the believer loves for his brother what he loves for himself' is one of the four hadiths from which all the conduct of goodness branches."
  es: "Que el creyente ama para su hermano y para la gente lo que ama para sí mismo del bien; en el hadiz de Anas ibn Malik 'ninguno de vosotros cree hasta que ama para su hermano lo que ama para sí mismo' —la redacción de Muslim 'para su vecino o su hermano'— y en la versión de Ibn Hibban 'ningún siervo alcanza la realidad del iman hasta que ama para la gente lo que ama para sí mismo del bien'; Ibn Rajab explica que esta adición aclara que la negación del iman es una negación de alcanzar su realidad y perfección más que de su raíz, siendo el iman a menudo negado por la ausencia de algunos de sus pilares y deberes — amar el bien para el hermano, el vecino y la gente entre ellos—; Abu Amr ibn al-Salah informa de Abu Muhammad ibn Abi Zayd que 'el creyente ama para su hermano lo que ama para sí mismo' es uno de los cuatro hadices de los que se ramifica toda la conducta de bondad."
  fr: "Le croyant aime pour son frère et pour les autres ce qu'il aime pour lui-même du bien. Dans le hadith d'Anas ibn Malik: « Nul d'entre vous ne croit tant qu'il n'aime pas pour son frère ce qu'il aime pour lui-même » (la version de Muslim étant « pour son prochain ou son frère »), et dans celle d'Ibn Hibban: « Nul serviteur n'atteint la réalité de la foi tant qu'il n'aime pas pour les autres ce qu'il aime pour lui-même du bien ». Ibn Rajab explique que cet ajout précise que la négation de la foi est une négation de sa réalité et de sa perfection plutôt que de sa racine. La foi est souvent niée en raison de l'absence de certains de ses piliers et devoirs, parmi lesquels aimer le bien pour son frère, son prochain et les autres. Abu Amr ibn al-Salah rapporte d'après Abu Muhammad ibn Abi Zayd que « le croyant aime pour son frère ce qu'il aime pour lui-même » est l'un des quatre hadiths dont découle toute conduite vertueuse."
  ur: "یہ کہ مومن اپنے بھائی کے لیے اور لوگوں کے لیے وہی پسند کرتا ہے جو اپنے لیے پسند کرتا ہے۔ انس بن مالک کی حدیث میں 'تم میں سے کوئی اس وقت تک مومن نہیں ہوسکتا جب تک کہ وہ اپنے بھائی کے لیے وہی پسند نہ کرے جو وہ اپنے لیے پسند کرتا ہے' - مسلم کا قول 'اپنے پڑوسی یا اپنے بھائی کے لیے' - اور ابن حبان کی روایت میں ہے کہ 'کوئی بندہ اس وقت تک ایمان کی حقیقت تک نہیں پہنچ سکتا جب تک کہ وہ لوگوں کے لیے وہی پسند نہ کرے جو اپنے لیے پسند کرتا ہے'۔ ابن رجب نے وضاحت کی ہے کہ یہ اضافہ واضح کرتا ہے کہ ایمان کی نفی اس کی اصلیت اور کمال حاصل کرنے کی نفی ہے نہ کہ اس کی جڑ کی، ایمان کو اکثر اس کے بعض ستونوں اور فرائض کی عدم موجودگی کی وجہ سے نفی کیا جاتا ہے یعنی اپنے بھائی، پڑوسی اور ان میں سے لوگوں کے ساتھ بھلائی کرنا۔ ابو عمرو بن الصلاح، ابو محمد بن ابی زید سے روایت کرتے ہیں کہ مومن اپنے بھائی کے لیے وہی پسند کرتا ہے جو اپنے لیے پسند کرتا ہے، ان چار احادیث میں سے ایک حدیث ہے جن سے تمام حسن سلوک کا شاخسانہ ہے۔"
  tr: "Bir müminin, kendisi için sevdiği iyiliği kardeşi ve halk için sevmelidir; Anas ibn Malik'in hadisinde, 'Hiçbiriniz kardeşi için sevdiği şeyi sevmeden gerçekten inanmazsınız' ve Müslüman'ın ifadesinde: 'Komşusunu ya da kardeşini sevene kadar.' İbn Hibban'a göre, 'Bir hizmetkar, kendisi için sevdiği şeyi başkaları için sevmeden iman gerçeğine ulaşmaz.' İbn Receb bu eklemenin, inancı inkar etmenin anlamının kaynağına değil, gerçeğe ve sonuca ulaşmanın reddi olduğunu netleştirdiğini açıklar. İnanç, kardeşine, komşusuna ve halkına iyi sevgi gibi bazı temel taşları ve görevlerinin olmaması nedeniyle sıklıkla reddedilir. Ebu Amr bin Ebu Epey Zeyd'in hadisini, iyi görgü kuralları koleksiyonunun dört hadisinden biri olarak kabul eder. El-Mes'udi'de, Yahya ibn Halid, konseyindeki ilahiyatçılara hareketsizlik, tezahür, sonsuzluk ve olay üzerine konuştuktan sonra sordu ve sevgiden bahsettiler. İmamiler, Haricitler, Mu'taziller, Hişam ibn el-Hakam ve sistem her biri kendi öğretilerine göre konuştu. İnsanlar arzunun başlangıcının daha güvenli görme ve işitme mi yoksa seçim ve zorunluluk mu olduğunu tartıştı. Hipokrat bunun iki ruhun birleşimi olduğunu söyledi. Bazı doktorlar, kalpte doğan ve sahibi ölene ya da kendini öldürene kadar kararamayan bir açgözlülük olduğunu söyledi. Bazıları Tanrı'nın her ruhu ikiye böldüğünü, böylece her bedenin sevgisinin yarısını zorunluluktan bulduğunu savunur. Ruhları asker olarak şehit ettiler ve Buthaina tarafından güzel şiirler yazdılar. Galen, aşkın bilgeler arasında gerçekleştiğini çünkü akla benzer oldukları ve aptallar arasında gerçekleşmediğini söyledi. {atıf:Muruj-al-Dhahab s. 358-360}"
  id: "Bahwa seorang mukmin harus mencintai saudaranya dan orang lain apa yang dia cintai untuk dirinya sendiri yaitu kebaikan; dalam hadits Anas ibn Malik, 'Tidak ada dari kalian yang benar-benar percaya sampai dia mengasihi saudaranya apa yang dia cintai untuk dirinya sendiri,' dan kata-kata Muslim: 'sampai dia mengasihi sesama atau saudaranya.' Menurut Ibn Hibban, 'Seorang hamba tidak mencapai realitas iman sampai dia mencintai orang lain apa yang dia cintai untuk dirinya sendiri atau kebaikan.' Ibn Rajab menjelaskan bahwa tambahan ini memperjelas bahwa makna yang dimaksudkan dari menyangkal iman adalah penyangkalan mencapai realitas dan akhirnya, bukan asal-usulnya. Iman sering kali ditolak karena tidak adanya beberapa pilar dan tugasnya, termasuk mencintai kebaikan untuk saudara, sesama, dan umatnya. Abu Amr ibn al-Salah menganggap hadis dari Abu Muhammad ibn Abi Zayd sebagai salah satu dari empat hadis yang menjadi cabang kumpulan etiket baik. Di Al-Mas'udi, Yahya ibn Khalid bertanya kepada para teolog dalam dewannya setelah mereka membahas ketidakaktifan, manifestasi, keabadian, dan kejadian, dan mereka berbicara tentang cinta. Imamis, Kharijit, Mu'tazilit, Hisham ibn al-Hakam, dan sistemnya masing-masing berbicara sesuai doktrin mereka sendiri. Orang-orang berdebat apakah awal keinginan adalah penglihatan dan pendengaran yang lebih aman atau pilihan dan kebutuhan. Hippocrates mengatakan itu adalah perpaduan dua jiwa. Beberapa dokter mengatakan bahwa keserakahan yang lahir di hati menjadi mustahil untuk menjadi hitam sampai pemiliknya mati atau membunuh dirinya sendiri. Beberapa berpendapat bahwa Tuhan membagi setiap jiwa menjadi dua, sehingga setiap tubuh bertemu setengah dari cintanya karena kebutuhan. Mereka mengorbankan jiwa sebagai prajurit dan puisi indah oleh Buthaina. Galen mengatakan cinta terjadi di antara orang bijak karena mereka serupa dalam alasan dan tidak terjadi di antara orang bodoh. {cite:muruj-al-dhahab hlm. 358-360}"
