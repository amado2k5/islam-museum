id: concept/hubb
class: concept
kind: ethical
label:
  ar: الحب للأخ
  en: Love for one's brother
summary:
  ar: "أن يحب المؤمن لأخيه وللناس ما يحب لنفسه من الخير؛ جاء في حديث أنس بن مالك «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه» ولفظ مسلم «حتى يحب لجاره أو لأخيه»، وعند ابن حبان «لا يبلغ عبد حقيقة الإيمان حتى يحب للناس ما يحب لنفسه من الخير»؛ يبين ابن رجب أن هذه الزيادة توضح أن المراد بنفي الإيمان نفي بلوغ حقيقته ونهايته لا نفي أصله، فإن الإيمان يُنفى كثيراً لانتفاء بعض أركانه وواجباته، ومن ذلك محبة الخير للأخ والجار والناس؛ ويعد أبو عمرو بن الصلاح عن أبي محمد بن أبي زيد حديث «المؤمن يحب لأخيه ما يحب لنفسه» أحد الأحاديث الأربعة التي يتفرع منها جماع آداب الخير. وعند المسعودي سأل يحيى بن خالد أهل الكلام في مجلسه بعدما أكثروا في الكمون والظهور والقدم والحدوث فقولوا في العشق، فتكلم إمامي وخارجي ومعتزلي وهشام بن الحكم والنظام كل على مذهبه، وتنازع الناس في ابتداء وقوع الهوى أمن نظر وسماع أم اختيار واضطرار، فقال بقراط هو امتزاج النفسين، وقال بعض الأطباء إنه طمع يتولد في القلب يستحيل إلى السوداء حتى يموت صاحبه أو يقتل نفسه، وذهب بعضهم إلى أن الله جزأ كل روح أنصافاً فكل جسد لقي نصفه عشق ضرورة، واستشهدوا بالأرواح جنود مجندة وشعر جميل بثينة، وقال جالينوس المحبة تقع بين العاقلين لتشاكلهما في العقل ولا تقع بين الأحمقين {cite:muruj-al-dhahab p. 358-360}"
  en: "That the believer loves for his brother, and for people, what he loves for himself of good; in Anas ibn Malik's hadith 'none of you believes until he loves for his brother what he loves for himself' — Muslim's wording 'for his neighbour or his brother' — and in Ibn Hibban's version 'no servant reaches the reality of iman until he loves for people what he loves for himself of good'; Ibn Rajab explains that this addition clarifies that the negation of iman is a negation of attaining its reality and perfection rather than of its root, iman being often negated for the absence of some of its pillars and duties — loving good for one's brother, neighbour and people among them; Abu Amr ibn al-Salah reports from Abu Muhammad ibn Abi Zayd that 'the believer loves for his brother what he loves for himself' is one of the four hadiths from which all the conduct of goodness branches."
