label: { ar: "المُلازَمَة", en: "Shadowing a debtor (mulazama)", ur: "مُلازَمہ ⁦(قرض دار کے ساتھ لگے رہنا)⁩", es: "Siguiendo a un deudor (mulazama)", fr: "Suivre un débiteur (mulazama)", tr: "Ek", id: "Lampiran" }
summary:
  ar: "الملازمة في اللغة التعلق بالغريم، وفي الاصطلاح إجراء يتخذه الدائن ليتوصل به إلى أداء حقه، وهي تقارب الحبس. وقد اتفق الجمهور على مشروعيتها، واختلفوا في شروط جوازها، فعند الحنفية للدائن ملازمة المدين ولو ثبت إعساره، وعند الشافعية والحنابلة لا تجوز مع ثبوت الإعسار عند القاضي."
  en: "Mulazama is the lexical sense of clinging to a creditor, and in law a measure a creditor takes to recover his right, close to imprisonment. The majority accept its legality and differ on its conditions: the Hanafis allow the creditor to shadow a debtor even when insolvency is proved, while the Shafi'is and Hanbalis forbid it once the judge has found insolvency."
  ur: "مُلازَمہ کا مطلب قرض دار کے پیچھے لگے رہنا ہے۔ حنفیہ کے نزدیک قرض خواہ دیوالیے مدیون کا بھی پیچھا کر سکتا ہے، جبکہ شافعیہ اور حنابلہ کے نزدیک اعسار ثابت ہو جانے پر اس کی اجازت نہیں۔"
  es: "Mulazama es el término que se usa para referirse a la insistencia en reclamar a un acreedor, y en derecho, una medida que este toma para recuperar su derecho, similar al encarcelamiento. La mayoría acepta su legalidad, aunque discrepa en cuanto a sus condiciones: los hanafíes permiten que el acreedor siga de cerca al deudor incluso cuando se ha demostrado su insolvencia, mientras que los shafiíes y los hanbalíes lo prohíben una vez que el juez ha declarado la insolvencia."
  fr: "Le terme « mulazama » désigne le fait de s'accrocher à un créancier et, en droit, une mesure prise par ce dernier pour recouvrer ses droits, proche de l'emprisonnement. La majorité des écoles juridiques en reconnaissent la légalité, mais divergent quant à ses conditions: les hanafites autorisent le créancier à exercer un contrôle sur le débiteur même en cas d'insolvabilité avérée, tandis que les shafi'ites et les hanbalites l'interdisent dès lors que le juge a prononcé l'insolvabilité."
  tr: "Dilbilimde ayrılmazlık, rakibe bağlanmayı ifade eder ve terminolojide, alacaklının hakkını yerine getirmek için alacaklının aldığı bir prosedürdür ve bu da hapse atılır. Çoğunluk meşruiyeti konusunda hemfikir ve izin verilebilirlik koşulları konusunda farklı düşünmüştür. Hanefilere göre, iflas tespit edilse bile alacaklı borçluya karşı sorumlu olmalıdır; Şafi'ler ve Hanelilere göre, iflas hakim tarafından tespit edilirse bu kabul edilemez."
  id: "Dalam linguistik, ketidakterpisahan merujuk pada keterikatan kepada lawan, dan dalam istilah ini, ini adalah prosedur yang diambil oleh kreditur untuk memenuhi haknya, yang mirip dengan penjara. Mayoritas setuju tentang legitimasinya dan berbeda pendapat mengenai syarat kebolehan kebangkrutan. Menurut Hanafi, kreditur harus bertanggung jawab kepada debitur meskipun kebangkrutan terbukti, sedangkan menurut Shafi'i dan Hanbali, tidak diperbolehkan jika kepailitan dibuktikan oleh hakim."
