label: { ar: "المُلازَمَة", en: "Shadowing a debtor (mulazama)", ur: "مُلازَمہ (قرض دار کے ساتھ لگے رہنا)" }
summary:
  ar: "الملازمة في اللغة التعلق بالغريم، وفي الاصطلاح إجراء يتخذه الدائن ليتوصل به إلى أداء حقه، وهي تقارب الحبس. وقد اتفق الجمهور على مشروعيتها، واختلفوا في شروط جوازها، فعند الحنفية للدائن ملازمة المدين ولو ثبت إعساره، وعند الشافعية والحنابلة لا تجوز مع ثبوت الإعسار عند القاضي."
  en: "Mulazama is the lexical sense of clinging to a creditor, and in law a measure a creditor takes to recover his right, close to imprisonment. The majority accept its legality and differ on its conditions: the Hanafis allow the creditor to shadow a debtor even when insolvency is proved, while the Shafi'is and Hanbalis forbid it once the judge has found insolvency."
  ur: "مُلازَمہ کا مطلب قرض دار کے پیچھے لگے رہنا ہے۔ حنفیہ کے نزدیک قرض خواہ دیوالیے مدیون کا بھی پیچھا کر سکتا ہے، جبکہ شافعیہ اور حنابلہ کے نزدیک اعسار ثابت ہو جانے پر اس کی اجازت نہیں۔"
