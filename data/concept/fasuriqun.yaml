summary:
  fr: "Le texte le dit plus desséchant que le qalqatar, mais moins irritant, donc plus fin {cite:canon-ibn-sina-print-v1 p.627}. Une page ultérieure le décrit comme remède contre la gale à base de litharge et de qalqadis ; sa méthode de préparation n'est pas reproduite ici {cite:canon-ibn-sina-print-v1 p.637}."
  ar: "فسوريقون في الكتاب دواء للجرب يتخذ من المرداسنج والقلقديس، أشد تجفيفا من القلقطار مع أنه أقل لذعا فهو ألطف، ويذهب بالجرب {cite:canon-ibn-sina-print-v1 pp.627, 637}"
  en: "Fasuriqun is in the book a drug for scab, made from litharge and qalqadis, more drying than qalqatar though less stinging, and so finer, and it removes scab {cite:canon-ibn-sina-print-v1 pp.627, 637}"
  ur: "فسوریقون کتاب میں خارش کی ایک دوا ہے جو مرداسنج اور قلقدیس سے بنتی ہے، قلقطار سے زیادہ خشک کرنے والی مگر کم جلن دینے والی، اس لیے زیادہ لطیف، اور جرب کو دور کرتی ہے {cite:canon-ibn-sina-print-v1 pp.627, 637}۔"
