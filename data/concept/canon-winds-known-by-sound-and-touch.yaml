  en: "Ibn Sina completes the ways of knowing winds with sound and touch, and says the difference between a puffing and a wind lies in the manner of motion and not in substance {cite:canon-ibn-sina-print-v1 p.166}."
  es: "Ibn Sina completa las formas de conocer los vientos con el sonido y el tacto, y dice que la diferencia entre un soplo y un viento radica en la forma de movimiento y no en la sustancia {cite:canon-ibn-sina-print-v1 p.166}."
  fr: "Ibn Sina complète les moyens de connaître les vents par le son et le toucher, et dit que la différence entre un souffle et un vent réside dans la manière de se déplacer et non dans la substance {cite:canon-ibn-sina-print-v1 p.166}."
  ur: "ابن سینا آواز اور لمس سے ہواؤں کو جاننے کے طریقوں کو مکمل کرتا ہے، اور کہتا ہے کہ پھونکنے اور ہوا کے درمیان فرق حرکت کے انداز میں ہے نہ کہ مادہ میں۔"
