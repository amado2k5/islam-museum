id: concept/aqsam-al-suda-wa-al-abdan-al-mustaidda-lahu
class: concept
kind: scientific
label:
  ar: "أقسام الصداع والأبدان المستعدة له"
  en: "The kinds of headache and the bodies prone to it"
  fr: "Les catégories de céphalées et les corps qui y sont prédisposés"
  ur: "صداع کی اقسام اور اس کی طرف مائل بدن"
summary:
  ar: "يقسّم ابن سينا الصداع بحسب سببه ومكانه وشدته وما يؤدي إليه، ويذكر الصداع المزمن وأسبابه، والأبدان المستعدة للصداع، وأثر الفصول والمبخرات {cite:canon-ibn-sina-print-v2 pp.45-46}"
  en: "Ibn Sina divides headache by its cause, its place, its strength and what it leads to, and treats chronic headache and its causes, the bodies prone to headache, and the effect of the seasons and of fumigants {cite:canon-ibn-sina-print-v2 pp.45-46}"
  fr: "Ibn Sina classe les céphalées selon leur cause, leur localisation, leur intensité et leurs conséquences, et traite de la céphalée chronique et de ses causes, des corps prédisposés aux céphalées et de l’effet des saisons et des fumigations {cite:canon-ibn-sina-print-v2 pp.45-46}"
  ur: "ابن سینا صداع کو اس کے سبب، مقام، شدت اور نتیجے کے لحاظ سے تقسیم کرتا ہے، اور دائمی صداع اور اس کے اسباب، صداع کی طرف مائل بدن، اور موسموں اور دھونیوں کے اثر کا ذکر کرتا ہے {cite:canon-ibn-sina-print-v2 pp.45-46}۔"
