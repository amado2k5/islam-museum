id: concept/intisab-al-nafs
class: concept
kind: scientific
label:
  ar: "انتصاب النفس"
  en: "The upright breath"
  ur: "کھڑی سانس"
  es: "La respiración erguida"
summary:
  ar: "انتصاب النفس هو النفس الذي لا يتأتى لصاحبه إلا أن ينتصب ويستوي ويمد رقبته مداً إلى فوق فينفتح بسببه المجرى ولا يستطيع أن يحني العنق لأنه يضيق عليه النفس كما يضيق على منجذب الرقبة نحو خلف وكذلك لا يقدر أن يحني الصدر والظهر إلى خلف، وإذا أزال هذه النصبة وخصوصاً إذا استلقى عرض له أن تنطبق منه أجزاء الرئة بعضها مع بعض فتسد المجاري لأنها في الأصل في مثله تكون مسدودة في الأكثر وإنما فيها فتح يسير يبطله ميلان الأجزاء بعضها على بعض، وقد يكون ذلك الانسداد عارضاً في الحميات ونحوها لأبخرة مائية ورطوبات متحلبة وقد تكون بالحقيقة لأخلاط مالئة وسادة وأورام أو لأن العضل مسترخية فإذا لم تتدل إلى ناحية الرجل بل تدلت إلى ناحية الظهر والصدر ضغطت {cite:canon-ibn-sina-print-v2 p.314}"
  en: "The upright breath is the breath its owner can only manage sitting upright and straight, stretching his neck out upward so the passage opens; he cannot bend the neck, for that narrows his breath — as it narrows on one whose neck is drawn backward — nor can he bend chest and back backward. If he leaves this uprightness — above all if he lies flat — the lung's parts close on one another and block the channels, for in his like they are mostly blocked already, with only a slight opening that the parts' leaning on one another voids. That blocking may be incidental in the fevers and their like, from watery vapours and milky moistures; or it may truly be from filling and blocking humours and tumours; or because the muscles are relaxed, so that when they do not hang toward the leg but droop toward back and chest they press {cite:canon-ibn-sina-print-v2 p.314}"
  ur: "کھڑی سانس وہ ہے جو اس کے صاحب کو صرف سیدھا کھڑے یا بیٹھے ہی آ سکتی ہے جب وہ اپنی گردن اوپر کو لمبا کر کے راستہ کھولتا ہے؛ وہ گردن جھکا نہیں سکتا کیونکہ وہ اس کی سانس تنگ کر دیتی ہے جیسے اس شخص پر ہوتی ہے جس کی گردن پیچھے کھنچی ہو اور نہ سینہ اور پیٹھ پیچھے جھکا سکتا ہے؛ اور جب وہ یہ نصبہ چھوڑے خصوصاً جب لیٹے تو اس پر عارض ہوتا ہے کہ پھیپھڑے کے اجزاء ایک دوسرے سے مل جائیں اور راستے بند کر دیں کیونکہ اصل میں ایسے شخص میں وہ اکثر بند ہوتے ہیں اور ان میں ہلکا سا کھلاؤ ہوتا ہے جسے اجزاء کا ایک دوسرے پر جھکنا باطل کر دیتا ہے؛ اور یہ بندش بخاروں وغیرہ میں عارضی بھی ہو سکتی ہے آبی بخارات اور دودھ جیسی رطوبتوں سے؛ اور حقیقتاً بھرنے اور بند کرنے والے اخلاط اور سوجنوں سے بھی؛ یا اس لیے کہ پٹھے ڈھیلے ہوں کہ جب وہ ٹانگ کی طرف نہ لٹکیں بلکہ پیٹھ اور سینے کی طرف لٹکیں تو دبائیں {cite:canon-ibn-sina-print-v2 p.314}"
  es: "La respiración erguida es la que su dueño solo puede lograr sentado erguido y recto, estirando el cuello hacia arriba para que se abran las vías respiratorias; no puede doblar el cuello, pues eso estrecha su respiración —como le sucede a quien echa el cuello hacia atrás— ni puede arquear el pecho y la espalda hacia atrás. Si abandona esta postura erguida —sobre todo si se acuesta— las partes del pulmón se cierran unas sobre otras y bloquean los conductos, pues en su caso ya están casi completamente bloqueados, con solo una ligera abertura que se anula al apoyarse las partes unas sobre otras. Este bloqueo puede ser incidental en las fiebres y afecciones similares, debido a vapores acuosos y humedades lechosas; o puede deberse realmente a la acumulación y el bloqueo de humores y tumores; o a que los músculos están relajados, de modo que cuando no cuelgan hacia la pierna sino que caen hacia la espalda y el pecho, ejercen presión {cite:canon-ibn-sina-print-v2 p.314}"
