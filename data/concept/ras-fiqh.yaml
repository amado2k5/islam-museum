id: concept/ras-fiqh
class: concept
kind: legal
label:
  ar: "الرأس ⁦(في الفقه)⁩"
  en: "The head (ra's) in the rulings"
  ur: "سر ⁦(فقہی احکام)⁩"
  es: "El jefe (ra's) en los dictamen"
  fr: "Le chef (ra) dans les décisions"
summary:
  ar: "الرأس في اللغة أعلى كل شيء، ويطلق مجازا على سيد القوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} يجب مسح الرأس في الوضوء باتفاق، وتحرم تغطية الرأس على المحرم بالحج والعمرة مع الفدية، ويستحب للرجل ستره في الصلاة بعمامة ونحوها، والمرأة يجب عليها ستر رأسها في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} وذهب الجمهور إلى أنه لا يضرب رأس المجلود للحد أو التعزير، وخالف أبو يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  en: "In lexicon ra's is the top of anything, and by metaphor the chief of a people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} Wiping the head in ablution is required by agreement; a man in the state of ihram for hajj or umra may not cover his head and owes a ransom if he does; for prayer a man is recommended to cover his head with a turban or the like, and a woman must cover hers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} The majority hold that the head of a person under the hadd or discretionary punishment is not to be struck, while Abu Yusuf allows it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  ur: "رأس لغت میں ہر چیز کا بالائی حصہ ہے، اور مجازاً قوم کا سردار۔ وضو میں سر کا مسح بالاتفاق واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529}"
  es: "En el léxico, ra's es la cima de cualquier cosa, y por metáfora el jefe de un pueblo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} Limpiarse la cabeza en la ablución es un requisito por acuerdo; un hombre en estado de ihram para el hajj o la umra no puede cubrirse la cabeza y debe un rescate si lo hace; para la oración se recomienda que un hombre se cubra la cabeza con un turbante o similar, y una mujer debe cubrirse la suya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} La mayoría sostiene que la cabeza de una persona bajo el hadd o castigo discrecional no debe ser golpeada, mientras que Abu Yusuf lo permite. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  fr: "Dans le lexique, « ra » désigne le sommet de toute chose, et par métaphore, le chef d'un peuple. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} Il est admis que l'on s'essuie la tête pour les ablutions; un homme en état d'ihram pour le hajj ou la umra ne peut se couvrir la tête et doit payer une amende s'il ne le fait pas; pour la prière, il est recommandé à l'homme de se couvrir la tête d'un turban ou d'un couvre-chef similaire, et la femme doit se couvrir la sienne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} La majorité considère que la tête d'une personne sous le coup du hadd (peine discrétionnaire) ne doit pas être frappée, tandis qu'Abu Yusuf l'autorise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
