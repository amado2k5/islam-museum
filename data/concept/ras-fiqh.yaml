id: concept/ras-fiqh
class: concept
kind: legal
label:
  ar: "الرأس (في الفقه)"
  en: "The head (ra's) in the rulings"
  ur: "سر (فقہی احکام)"
summary:
  ar: "الرأس في اللغة أعلى كل شيء، ويطلق مجازا على سيد القوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} يجب مسح الرأس في الوضوء باتفاق، وتحرم تغطية الرأس على المحرم بالحج والعمرة مع الفدية، ويستحب للرجل ستره في الصلاة بعمامة ونحوها، والمرأة يجب عليها ستر رأسها في الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} وذهب الجمهور إلى أنه لا يضرب رأس المجلود للحد أو التعزير، وخالف أبو يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  en: "In lexicon ra's is the top of anything, and by metaphor the chief of a people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} Wiping the head in ablution is required by agreement; a man in the state of ihram for hajj or umra may not cover his head and owes a ransom if he does; for prayer a man is recommended to cover his head with a turban or the like, and a woman must cover hers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530} The majority hold that the head of a person under the hadd or discretionary punishment is not to be struck, while Abu Yusuf allows it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8530}"
  ur: "رأس لغت میں ہر چیز کا بالائی حصہ ہے، اور مجازاً قوم کا سردار۔ وضو میں سر کا مسح بالاتفاق واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8529}"
