id: concept/al-daruriyyat-al-khams
class: concept
kind: legal
label: { ar: "الضروريات الخمس", en: "The five necessities (al-daruriyyat al-khams)", ur: "پانچ ضروریات" }
summary:
  ar: "المرتبة الأولى من مقاصد الشريعة عند الشاطبي، وهي ما لا بد منه في قيام مصالح الدين والدنيا بحيث إذا فُقد لم تجر مصالح الدنيا على استقامة وفاتت في الآخرة النجاة؛ ومجموعها خمسة: حفظ الدين، والنفس، والنسل، والمال، والعقل، ويُحفظ كلٌّ منها من جانب الوجود بما يقيم أركانه ومن جانب العدم بما يدرأ عنه الاختلال؛ ويليها الحاجيات ثم التحسينات {cite:muwafaqat-draz-ilmiyya p. 221} {cite:muwafaqat-draz-ilmiyya p. 222} {cite:muwafaqat-draz-ilmiyya p. 223}."
  en: "The first tier of the objectives of the law for al-Shatibi: what is indispensable for the welfare of religion and the world, such that if it is lost worldly affairs do not run straight and salvation in the hereafter is lost; they are five - the preservation of religion, life, progeny, property and intellect - each preserved on the side of existence by what establishes it and on the side of non-existence by what wards off its disruption; after them come the needs (hajiyyat) and then the refinements (tahsiniyyat)."
  ur: "شاطبی کے نزدیک مقاصدِ شریعت کا پہلا مرتبہ: وہ چیزیں جن کے بغیر دین و دنیا کی مصلحتیں قائم نہیں رہتیں، کہ اگر وہ نہ رہیں تو دنیا کی مصلحتیں درست نہ چلیں اور آخرت میں نجات فوت ہو؛ یہ پانچ ہیں: دین، جان، نسل، مال اور عقل کی حفاظت، اور ہر ایک کی حفاظت وجود کی جانب سے اسے قائم کرنے والی چیزوں سے اور عدم کی جانب سے اس کے خلل کو دور کرنے والی چیزوں سے ہوتی ہے؛ ان کے بعد حاجیات اور پھر تحسینات ہیں۔"
