label:
  ar: "التنين"
  en: "The Dragon"
  ur: "اژدہا"
  es: "El Dragón"
  fr: "Le Dragon"
  tr: "Ejderha"
  id: "Naga"
summary:
  ar: "تُذكر في الفهرس كواكب صورة التنين بعد كواكب الدب، وأولها الكوكب الذي على طرف ذنبه، وتشمل الكواكب التي فوق رأسه والكوكب الذي فوق عينه. وتُكتب مواضعها في جدول الطول والعرض، ولم تُنقل هنا. {cite:zij-sabi-nallino-byblion pp.246}"
  en: "The entries for the Dragon follow those of the Bears. They begin with the star on the tip of its tail and include the star above its head and the star above its eye. Positions are given in longitude and latitude in a table, which is not transcribed here. {cite:zij-sabi-nallino-byblion pp.246}"
  ur: "اژدہا کے ستارے دب کے بعد آتے ہیں۔ ان میں دم کی نوک والا ستارہ، سر کے اوپر والا ستارہ اور آنکھ کے اوپر والا ستارہ شامل ہیں۔ جدول کے مواضع یہاں نقل نہیں کیے گئے۔ {cite:zij-sabi-nallino-byblion pp.246}"
  es: "Las entradas correspondientes al Dragón siguen las de los Osos. Comienzan con la estrella en la punta de su cola e incluyen la estrella sobre su cabeza y la estrella sobre su ojo. Las posiciones se indican en longitud y latitud en una tabla, que no se transcribe aquí. {cite:zij-sabi-nallino-byblion pp.246}"
  fr: "Les indications concernant le Dragon suivent celles de l'Ours. Elles commencent par l'étoile située au bout de sa queue et comprennent l'étoile au-dessus de sa tête et celle au-dessus de son œil. Les positions sont données en longitude et latitude dans un tableau, non retranscrit ici. {cite:zij-sabi-nallino-byblion pp.246}"
  tr: "Ejderha takımyıldızı, Büyük Ayı takımyıldızından sonra, kuyruğunun ucundaki gezegenden başlayarak, başının üzerindeki ve gözünün üzerindeki gezegenleri de içerecek şekilde dizinde listelenmiştir. Konumları boylam ve enlem tablosunda verilmiştir ve burada tekrar verilmemiştir. {cite:zij-sabi-nallino-byblion pp.246}"
  id: "Konstelasi Draco tercantum dalam indeks setelah konstelasi Ursa Major, dimulai dengan planet di ujung ekornya, dan termasuk planet di atas kepalanya dan planet di atas matanya. Posisi mereka diberikan dalam tabel garis bujur dan garis lintang, dan tidak dicantumkan di sini. {cite:zij-sabi-nallino-byblion pp.246}"
