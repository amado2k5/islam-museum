summary:
  ar: "تُذكر في الفهرس كواكب صورة التنين بعد كواكب الدب، وأولها الكوكب الذي على طرف ذنبه، وتشمل الكواكب التي فوق رأسه والكوكب الذي فوق عينه. وتُكتب مواضعها في جدول الطول والعرض، ولم تُنقل هنا. {cite:zij-sabi-nallino-byblion pp.246}"
  en: "The entries for the Dragon follow those of the Bears. They begin with the star on the tip of its tail and include the star above its head and the star above its eye. Positions are given in longitude and latitude in a table, which is not transcribed here. {cite:zij-sabi-nallino-byblion pp.246}"
  ur: "اژدہا کے ستارے دب کے بعد آتے ہیں۔ ان میں دم کی نوک والا ستارہ، سر کے اوپر والا ستارہ اور آنکھ کے اوپر والا ستارہ شامل ہیں۔ جدول کے مواضع یہاں نقل نہیں کیے گئے۔ {cite:zij-sabi-nallino-byblion pp.246}"
