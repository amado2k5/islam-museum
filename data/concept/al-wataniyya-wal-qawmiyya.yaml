    ar: "رأى خالد القاسم أن العروبة انتماء لا يُفك (جنس وتاريخ وآمال) والوطنية أقرب للقوانين والأحكام؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:23:00} وخلص المقدم إلى أن التمييز المبني على قواعد العدالة مقبول (تفضيل المواطن في وظائف بلده) والتعصب الأعمى مرفوض، وأن الفخر بالعروبة — لغة القرآن وحاضنة الدين — لا يناقض الإسلام ما لم يتحول تعصباً كما فعلت ألمانيا بجنسها {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:13:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:18:30}."
