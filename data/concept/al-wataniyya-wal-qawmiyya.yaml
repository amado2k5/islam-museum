label:
  ar: "الوطنية والقومية والعروبة — الحد الفاصل مع الإسلام"
  en: "Patriotism, nationalism and Arabness — the boundary with Islam"
issue:
  ar: "أين الحد الفاصل بين الانتماء للوطن والعروبة وبين الانتماء للإسلام، ومتى يصبح التعارض؟"
summary:
  ar: "حلقة «الوسطية» عن الوطنية والقومية مقابل الإسلام. صوّت الجمهور: 45% يملكون تعريفاً واضحاً للمفاهيم؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:07:00} و78% يرون الوحدة العربية خطوةً نحو الوحدة الإسلامية؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:30:00} و76% لا يشعرون بتناقض بين انتماءاتهم. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:54:00} وخلُص المقدم إلى أن الانتماء للوطنية والعروبة لا يتناقض مع الإسلام بشرط ألا يكون فيه تعصب أو تمييز أو ظلم — «وهذه هي الوسطية». {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:18:30}"
  en: "The 'Al-Wasatiyya' episode on patriotism and nationalism versus Islam. The audience voted: 45% held a clear definition of the concepts; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:07:00} 78% saw Arab unity as a step toward Islamic unity; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:30:00} and 76% felt no contradiction between their belongings. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:54:00} The host concluded that belonging to homeland and Arabness does not contradict Islam provided it carries no fanaticism, discrimination or injustice — 'and this is the wasatiyya'. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:18:30}"
