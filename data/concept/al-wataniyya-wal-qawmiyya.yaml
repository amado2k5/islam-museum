issue:
  ar: "أين الحد الفاصل بين الانتماء للوطن والعروبة وبين الانتماء للإسلام، ومتى يصبح التعارض؟"
summary:
  ar: "حلقة «الوسطية» عن الوطنية والقومية مقابل الإسلام. صوّت الجمهور: 45% يملكون تعريفاً واضحاً للمفاهيم؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:07:00} و78% يرون الوحدة العربية خطوةً نحو الوحدة الإسلامية؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:30:00} و76% لا يشعرون بتناقض بين انتماءاتهم. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:54:00} وخلُص المقدم إلى أن الانتماء للوطنية والعروبة لا يتناقض مع الإسلام بشرط ألا يكون فيه تعصب أو تمييز أو ظلم — «وهذه هي الوسطية». {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:18:30}"
  en: "The 'Al-Wasatiyya' episode on patriotism and nationalism versus Islam. The audience voted: 45% held a clear definition of the concepts; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:07:00} 78% saw Arab unity as a step toward Islamic unity; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:30:00} and 76% felt no contradiction between their belongings. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:54:00} The host concluded that belonging to homeland and Arabness does not contradict Islam provided it carries no fanaticism, discrimination or injustice — 'and this is the wasatiyya'. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:18:30}"
  fr: "L’épisode d’« Al-Wasatiyya » sur le patriotisme et le nationalisme face à l’islam. Le public a voté : 45 % avaient une définition claire des concepts ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:07:00} 78 % voyaient l’unité arabe comme une étape vers l’unité islamique ; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:30:00} et 76 % ne ressentaient aucune contradiction entre leurs appartenances. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:54:00} L’animateur a conclu que l’appartenance à la patrie et à l’arabité ne contredit pas l’islam pourvu qu’elle ne porte ni fanatisme, ni discrimination, ni injustice, « et c’est cela, la wasatiyya ». {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 01:18:30}"
  es: "El episodio de 'Al-Wasatiyya' sobre patriotismo y nacionalismo versus Islam. La audiencia votó: 45% tenía una definición clara de los conceptos; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:07:00} 78% veía la unidad árabe como un paso hacia la unidad islámica; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:30:00} y 76% no sentía ninguna contradicción entre sus pertenencias. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:54:00} El presentador concluyó que pertenecer a la patria y a la identidad árabe no contradice el Islam siempre que no implique fanatismo, discriminación o injusticia — 'y esta es la wasatiyya'. {cita: assabile-tareq-al-suwaidan al-wassitiya/ep06 01:18:30}"
  ur: "حب الوطنی اور قوم پرستی بمقابلہ اسلام پر 'الوصطیہ' قسط۔ سامعین نے ووٹ دیا: 45% نے تصورات کی واضح تعریف کی۔ {حوالہ:assabile-tareq-alsuaidan al-wasitiya/ep06 00:07:00} 78% نے عرب اتحاد کو اسلامی اتحاد کی طرف ایک قدم کے طور پر دیکھا۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ep06 00:30:00} اور 76% نے اپنے سامان میں کوئی تضاد محسوس نہیں کیا۔ {حوالہ: assabile-tareq-al-suwaidan al-wasitiya/ep06 00:54:00} میزبان نے نتیجہ اخذ کیا کہ وطن اور عربیت سے تعلق اسلام سے متصادم نہیں ہے بشرطیکہ اس میں جنون، امتیاز یا ناانصافی نہ ہو — 'اور یہی وسعتیہ ہے'۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ep06 01:18:30}"
