  summary:
    ar: "حدّد أستاذ العلوم السياسية الوطنية ارتباطاً قانونياً جغرافياً بحقوق وواجبات، والقومية رابطةَ شعور ثقافي ولغوي وتاريخي، والهويةَ ارتباطاً فكرياً أيديولوجياً؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:12:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:13:00} وفرّق وحيد عبد المجيد بين العروبة — انتماء تاريخي حضاري موجود قبل القومية — والقومية العربية مفهوماً حديثاً متأثراً بالغرب صار مذهباً سياسياً يفضّل العرب على غيرهم {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:18:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep06 00:19:00}."
