id: "concept/hifz-sihhat-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "حفظ صحة العين وما يضرها"
  en: "Preserving the eye's health and what harms it"
  ur: "آنکھ کی صحت کی حفاظت اور اس کے مضرات"
  es: "Cómo preservar la salud ocular y qué la perjudica."
  fr: "Préserver la santé des yeux et ce qui la nuit"
summary:
  ar: "حفظ صحة العين بوقايتها الغبار والدخان والأهوية الخارجة عن الاعتدال والرياح المفججة والباردة والسمومية وعدم إدامة التحديق وقلة كثرة البكاء وقلة النظر في الدقيق واعتدال النوم والسهر، وتضرها الأفعال المجففة وطول النظر إلى المضيئات والنوم على الامتلاء وما يعكر الدم والسكر والاستحمام والفصد والحجامة المتوالية والأغذية المالحة الحريفة المبخرة وسوء التصرف فيها {cite:canon-ibn-sina-print-v2 p.166} {cite:canon-ibn-sina-print-v2 p.167}"
  en: "The eye's health is kept by shielding it from dust, smoke, air beyond the mean, blowing cold and pestilential winds, not prolonging the fixed stare, checking much weeping, sparing fine work, and moderation in sleep and waking; it is harmed by drying acts, long gazing at bright things, sleeping on repletion, what clouds the blood, drunkenness, the bath, venesection, repeated cupping, salty acrid vaporous foods and mishandled food {cite:canon-ibn-sina-print-v2 p.166} {cite:canon-ibn-sina-print-v2 p.167}"
  ur: "آنکھ کی صحت اس سے بچتی ہے کہ اسے غبار، دھوئیں، غیر معتدل ہوا، تیز ٹھنڈی اور وبائی ہواؤں سے بچایا جائے، ایک جگہ ٹکٹکی نہ باندھی جائے، زیادہ رونے سے بچا جائے، باریک کام کم کیا جائے اور نیند اور جاگنے میں اعتدال ہو؛ اسے نقصان پہنچاتے ہیں خشک کرنے والے افعال، چمکتی چیزوں کی طرف دیر تک دیکھنا، بھر پیٹ سونا، خون کو گدلا کرنے والی چیزیں، نشہ، حمام، فصد، مسلسل حجامت، نمکین تیز بھاپ اٹھانے والی غذائیں اور ان کا خراب استعمال {cite:canon-ibn-sina-print-v2 p.166} {cite:canon-ibn-sina-print-v2 p.167}"
  es: "La salud ocular se mantiene protegiéndola del polvo, el humo, el aire viciado, los vientos fríos y pestilentes, evitando la mirada fija prolongada, controlando el llanto excesivo, evitando trabajos delicados y con moderación en el sueño y la vigilia; se ve perjudicada por actos que resecan el ojo, la mirada prolongada a objetos brillantes, dormir después de una comida copiosa, lo que enturbia la sangre, la embriaguez, el baño, la flebotomía, la ventosaterapia repetida, los alimentos salados, ácidos y vaporosos, y los alimentos mal preparados. {cite:canon-ibn-sina-print-v2 p.166} {cite:canon-ibn-sina-print-v2 p.167}"
  fr: "On préserve la santé des yeux en les protégeant de la poussière, de la fumée, des courants d'air trop forts, des vents froids et pestilentiels, en évitant de fixer son regard trop longtemps, en limitant les pleurs excessifs, en évitant les travaux de précision et en pratiquant une activité physique modérée (sommeil et veille). Ils sont endommagés par les actes desséchants, la contemplation prolongée de choses brillantes, le fait de dormir après avoir bien mangé, ce qui trouble le sang, l'ivresse, les bains, les saignées, les ventouses répétées, les aliments salés, acides et fumants, ainsi que les aliments mal manipulés. {cite:canon-ibn-sina-print-v2 p.166} {cite:canon-ibn-sina-print-v2 p.167}"
