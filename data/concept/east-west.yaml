label:
  ar: "المشرق والمغرب"
  en: "East and west"
  ur: "مشرق اور مغرب"
  es: "Este y oeste"
  fr: "Est et ouest"
  tr: "Doğu ve Batı"
  id: "Timur dan Barat"
summary:
  ar: "رب المشرقين ورب المغربين، ورب المشارق والمغارب وما بينهما إن كنتم تعقلون، وفلله المشرق والمغرب فأينما تولوا فثم وجه الله."
  en: "Lord of the two easts and the two wests, Lord of the easts and the wests and all between them, if you understand; to God belong the east and the west — wherever you turn, there is the face of God."
  ur: "دو مشرقوں اور دو مغربوں کا رب، مشرقوں اور مغربوں اور ان کے درمیان کا رب اگر تم سمجھتے ہو؛ مشرق اور مغرب اللہ ہی کا ہے — جدھر بھی منہ کرو وہیں اللہ کا رخ ہے۔"
  es: "Señor de los dos orientes y de los dos occios, Señor de los orientes y de los occios y de todo lo que hay entre ellos, si lo entiendes; a Dios pertenecen el oriente y el occidente; dondequiera que te vuelvas, allí está el rostro de Dios."
  fr: "Seigneur des deux Orients et des deux Occidents, Seigneur des Orients et des Occidents et de tout ce qui se trouve entre eux, si vous comprenez; à Dieu appartiennent l'Orient et l'Occident — où que vous vous tourniez, là est le visage de Dieu."
  tr: "Doğuların Efendisi ve Batıların Rabbi, Doğu ve Batı'nın ve aradaki her şeyin Rabbisi, eğer anlıyorsanız, ve Doğu ile Batı O'na aittir, dolayısıyla nereye bakarsanız bakın, Tanrı'nın Yüzü doğrudur."
  id: "Tuhan Timur dan Tuhan Barat, Tuhan Timur dan Barat serta segala sesuatu di antaranya, jika kamu mengerti, dan kepada-Nya milik Timur dan Barat, jadi ke mana pun kamu melihat, maka Wajah Allah adalah benar."
