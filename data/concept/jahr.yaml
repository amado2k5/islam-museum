label: { ar: "الجهر", en: "Jahr (audible recitation and speech in worship)", ur: "جہر", es: "Jahr (recitación y discurso audibles en el culto)", fr: "Jahr (récitation et discours audibles lors du culte)" }
summary:
  ar: "الجهر والإسرار في العبادة هو رفع الصوت أو خفضه، وتختلف المذاهب في حدهما. تبيّن الموسوعة الفقهية الكويتية مواضع الجهر في الصلاة، كقراءة الإمام في الصلوات الجهرية، وجهر الإمام بالتسميع، والإسرار بالتعوذ، والجهر بالقنوت وبالتسليم، وقضاء الصلوات الجهرية، وقراءة البسملة، وجهر الخطيب، والتكبير في الطرق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6642} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6655}"
  en: "Jahr (audible) and sirr (silent) in worship concern how loudly words are spoken, and the schools differ on the limits of each. The Kuwaiti encyclopedia sets out the places where voice is used in prayer: the imam's recitation in audible prayers, the imam's saying of the response to praise aloud, silent seeking of refuge, loud or quiet supplication and salutation, the making up of missed audible prayers, the basmala, the sermon, and the glorification of God on the road to the prayer ground at festivals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6642} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6655}"
  es: "En el culto, el jahr (audible) y el sirr (silencioso) se refieren al volumen con que se pronuncian las palabras, y las escuelas difieren en los límites de cada uno. La enciclopedia kuwaití describe los momentos en que se utiliza la voz en la oración: la recitación del imán en las oraciones audibles, la respuesta del imán a la alabanza en voz alta, la búsqueda silenciosa de refugio, la súplica y el saludo en voz alta o baja, la recuperación de las oraciones audibles omitidas, la basmala, el sermón y la glorificación de Dios en el camino hacia el lugar de oración durante las festividades. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6639} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6640} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6642} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6644} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6647} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6651} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6653} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6655}"
  fr: "Dans le culte, les termes « jahr » (à voix haute) et « sirr » (à voix basse) concernent le volume des paroles prononcées, et les écoles de pensée divergent quant aux limites de chacun. L’encyclopédie koweïtienne recense les moments où la voix est utilisée dans la prière: la récitation de l’imam lors des prières à voix haute, la réponse de l’imam aux louanges prononcées à haute voix, la recherche silencieuse de refuge, les supplications et salutations à voix haute ou basse, la reprise des prières à voix haute manquées, la basmala, le sermon et la glorification de Dieu sur le chemin du lieu de prière lors des fêtes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6642} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6655}"
