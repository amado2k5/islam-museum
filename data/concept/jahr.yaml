label: { ar: "الجهر", en: "Jahr (audible recitation and speech in worship)", ur: "جہر" }
summary:
  ar: "الجهر والإسرار في العبادة هو رفع الصوت أو خفضه، وتختلف المذاهب في حدهما. تبيّن الموسوعة الفقهية الكويتية مواضع الجهر في الصلاة، كقراءة الإمام في الصلوات الجهرية، وجهر الإمام بالتسميع، والإسرار بالتعوذ، والجهر بالقنوت وبالتسليم، وقضاء الصلوات الجهرية، وقراءة البسملة، وجهر الخطيب، والتكبير في الطرق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6642} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6655}"
  en: "Jahr (audible) and sirr (silent) in worship concern how loudly words are spoken, and the schools differ on the limits of each. The Kuwaiti encyclopedia sets out the places where voice is used in prayer: the imam's recitation in audible prayers, the imam's saying of the response to praise aloud, silent seeking of refuge, loud or quiet supplication and salutation, the making up of missed audible prayers, the basmala, the sermon, and the glorification of God on the road to the prayer ground at festivals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6639} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6640} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6642} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6653} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6655}"
