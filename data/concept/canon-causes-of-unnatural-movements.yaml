id: concept/canon-causes-of-unnatural-movements
class: concept
kind: scientific
label:
  ar: "أسباب الحركات غير الطبيعية عند ابن سينا"
  en: "The causes of unnatural movements in the Canon"
  fr: "Causes des mouvements non naturels dans le Canon"
  ur: "غیر فطری حرکات کے اسباب، قانون کے مطابق"
  es: "Las causas de los movimientos antinaturales en el Canon"
summary:
  ar: "في الفصل الثالث عشر يذكر ابن سينا أن الحركات غير الطبيعية سببها يبس مضعف كالرعشة اليابسة، أو يبس مشنج كالفواق، أو سدد تمنع نفوذ القوة، أو فضول مؤذية ببردها كما في النافض أو بلذعها كما في القشعريرة، أو ريح محتبسة في العضلة كما في الاختلاج {cite:canon-ibn-sina-print-v1 p.146}."
  en: "In chapter 13 Ibn Sina says unnatural movements arise from weakening dryness such as dry tremor, convulsing dryness such as hiccup, blockages that stop the power reaching a limb, harmful superfluities that hurt by their cold, as in rigor, or by their sting, as in shivering, or wind trapped in a muscle, as in twitching {cite:canon-ibn-sina-print-v1 p.146}."
  fr: "Au chapitre 13, Ibn Sina cite sécheresse affaiblissante comme le tremblement sec, convulsivante comme le hoquet, obstructions arrêtant la force vers le membre, excédents nuisibles par froid comme le frisson intense ou par irritation comme le frissonnement, et vents musculaires enfermés comme le tressautement {cite:canon-ibn-sina-print-v1 p.146}."
  es: "En el capítulo 13, Ibn Sina dice que los movimientos antinaturales surgen de la sequedad debilitante, como el temblor seco, la sequedad convulsiva, como el hipo, bloqueos que impiden que la fuerza llegue a una extremidad, superfluidades dañinas que duelen por su frío, como en el rigor, o por su picadura, como en los escalofríos, o viento atrapado en un músculo, como en los espasmos {cite:canon-ibn-sina-print-v1 p.146}."
  ur: "باب 13 میں ابن سینا کہتے ہیں کہ غیر فطری حرکات خشکی کو کمزور کرنے سے پیدا ہوتی ہیں جیسے خشک تھرتھراہٹ، ہچکی جیسی خشکی، رکاوٹیں جو طاقت کو کسی اعضاء تک پہنچنے سے روکتی ہیں، نقصان دہ اضافی چیزیں جو ان کی سردی سے تکلیف دیتی ہیں، جیسے سختی، یا ان کے ڈنک سے، جیسے کپکپاہٹ، یا ہوا، پٹھوں میں پھنس جانے سے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 146}۔"
