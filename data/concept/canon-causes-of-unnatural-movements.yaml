summary:
  ar: "في الفصل الثالث عشر يذكر ابن سينا أن الحركات غير الطبيعية سببها يبس مضعف كالرعشة اليابسة، أو يبس مشنج كالفواق، أو سدد تمنع نفوذ القوة، أو فضول مؤذية ببردها كما في النافض أو بلذعها كما في القشعريرة، أو ريح محتبسة في العضلة كما في الاختلاج {cite:canon-ibn-sina-print-v1 p.146}."
  en: "In chapter 13 Ibn Sina says unnatural movements arise from weakening dryness such as dry tremor, convulsing dryness such as hiccup, blockages that stop the power reaching a limb, harmful superfluities that hurt by their cold, as in rigor, or by their sting, as in shivering, or wind trapped in a muscle, as in twitching {cite:canon-ibn-sina-print-v1 p.146}."
