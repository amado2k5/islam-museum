summary:
  ar: "مشروع قانون للغة العربية قيد الإعداد في الإمارات العربية المتحدة حتى 2026، ويُستهدف طرحه نحو 2027، تعدّه وزارة الثقافة بمناقشات في المجلس الوطني الاتحادي ضمن استراتيجية الهوية الوطنية، ولم يُعثر على نص نهائي صادر حتى أواخر 2026، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:khaleej-times-home} {cite:the-national-home}."
  en: "A draft Arabic language law under development in the United Arab Emirates as of 2026, targeted for introduction around 2027, prepared by the Ministry of Culture with discussion in the Federal National Council as part of the National Identity Strategy; no final enacted text was located as of late 2026, as a research file supplied to the museum summarises it {cite:khaleej-times-home} {cite:the-national-home}."
  ur: "متحدہ عرب امارات میں عربی زبان کا ایک مسودۂ قانون 2026 تک زیرِ تیاری ہے اور اسے تقریباً 2027 میں پیش کرنے کا ہدف ہے۔ اسے وزارتِ ثقافت تیار کر رہی ہے اور قومی شناخت کی حکمتِ عملی کے تحت وفاقی قومی کونسل میں اس پر بحث ہوئی ہے۔ 2026 کے اواخر تک کوئی حتمی جاری شدہ متن نہیں ملا، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل اسے خلاصہ کرتی ہے {cite:khaleej-times-home} {cite:the-national-home}۔"
  fr: "Un projet de loi sur la langue arabe en cours d'élaboration aux Émirats arabes unis en 2026, dont la présentation est visée vers 2027, préparé par le ministère de la Culture et discuté au Conseil national fédéral dans le cadre de la Stratégie d'identité nationale ; aucun texte final promulgué n'a été repéré à la fin de 2026, comme le résume un dossier de recherche remis au musée {cite:khaleej-times-home} {cite:the-national-home}."
  es: "Un proyecto de ley de la lengua árabe en elaboración en los Emiratos Árabes Unidos en 2026, con presentación prevista hacia 2027, preparado por el Ministerio de Cultura y debatido en el Consejo Nacional Federal como parte de la Estrategia de Identidad Nacional; no se localizó ningún texto final promulgado a finales de 2026, según lo resume un expediente de investigación entregado al museo {cite:khaleej-times-home} {cite:the-national-home}."
