label:
  ar: "المراقبة"
  en: "Watchfulness before God (muraqaba)"
  ur: "مراقبہ"
  es: "Vigilancia ante Dios (muraqaba)"
  fr: "Vigilance devant Dieu (muraqaba)"
  tr: "İzleme"
  id: "Pemantauan"
summary:
  ar: "المراقبة في درس الشيخ عمر عبد الكافي أن يكون القلب رقيبا على صاحبه، فمن لم يراقب الله في قلبه لم ينفعه أن يراقبه الناس. ويضرب لذلك قصة الأبناء الثلاثة والديوك، وقصة الراعي. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
  en: "In Sheikh Omar Abdelkafy's lessons, watchfulness means that the heart watches over its owner: whoever does not watch himself before God gains nothing from being watched by people. He illustrates it with the story of the three sons and the roosters, and the story of the shepherd. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
  ur: "شیخ عمر عبدالکافی کے درس میں مراقبہ یہ ہے کہ دل اپنے مالک کا نگہبان ہو: جو اللہ کے سامنے اپنے دل کی نگرانی نہ کرے، اسے لوگوں کی نگرانی کا کوئی فائدہ نہیں۔ وہ اس کے لیے تین بیٹوں اور مرغوں کا واقعہ اور چرواہے کا قصہ بیان کرتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
  es: "En las enseñanzas del jeque Omar Abdelkafy, la vigilancia significa que el corazón vela por su dueño: quien no se vigila a sí mismo ante Dios no obtiene ningún beneficio de ser vigilado por los demás. Lo ilustra con la parábola de los tres hijos y los gallos, y con la del pastor. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
  fr: "Dans les enseignements du cheikh Omar Abdelkafy, la vigilance signifie que le cœur veille sur son propriétaire: celui qui ne se surveille pas devant Dieu ne tire aucun profit du regard des autres. Il l’illustre par la parabole des trois fils et des coqs, ainsi que par l’histoire du berger. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
  tr: "Şeyh Ömer Abdulkafi'nin dersindeki gözetim, kalbin sahibine karşı dikkatli olması gerektiğidir; kalbinde Allah'ı izlemeyen başkalarının izlemesinden fayda görmez. Ayrıca üç oğul, horozlar ve çobanın hikayesini de anlatır. {cit:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep02 00:19:00}"
  id: "Pengawasan dalam pelajaran Sheikh Omar Abdul Kafi adalah bahwa hati harus waspada terhadap pemiliknya; siapa pun yang tidak mengamati Tuhan di hatinya tidak akan mendapat manfaat dari pengawasan orang lain. Ia juga menyebutkan kisah tiga putra, ayam jantan, dan kisah gembala. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
