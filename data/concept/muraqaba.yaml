id: concept/muraqaba
class: concept
kind: ethical
label:
  ar: "المراقبة"
  en: "Watchfulness before God (muraqaba)"
  ur: "مراقبہ"
summary:
  ar: "المراقبة في درس الشيخ عمر عبد الكافي أن يكون القلب رقيبا على صاحبه، فمن لم يراقب الله في قلبه لم ينفعه أن يراقبه الناس. ويضرب لذلك قصة الأبناء الثلاثة والديوك، وقصة الراعي. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
  en: "In Sheikh Omar Abdelkafy's lessons, watchfulness means that the heart watches over its owner: whoever does not watch himself before God gains nothing from being watched by people. He illustrates it with the story of the three sons and the roosters, and the story of the shepherd. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
  ur: "شیخ عمر عبدالکافی کے درس میں مراقبہ یہ ہے کہ دل اپنے مالک کا نگہبان ہو: جو اللہ کے سامنے اپنے دل کی نگرانی نہ کرے، اسے لوگوں کی نگرانی کا کوئی فائدہ نہیں۔ وہ اس کے لیے تین بیٹوں اور مرغوں کا واقعہ اور چرواہے کا قصہ بیان کرتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep02 00:19:00}"
