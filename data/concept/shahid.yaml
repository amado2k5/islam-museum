summary:
  ar: "الشهيد عند أهل السنة من قتل دون دينه أو ماله أو دمه، ويلحق به عند الفقهاء المبطون والمطعون ومن مات غرقًا أو تحت الهدم — «من قتل دون ماله فهو شهيد» {cite:sahih-al-bukhari}، و«المبطون شهيد والمطعون شهيد» {cite:sahih-al-bukhari}."
  en: "The shahid in Sunni tradition is one killed defending religion, property or life, joined by jurists' extension to the plague-stricken, the drowned and those killed under collapsed buildings — 'whoever is killed defending his property is a martyr', 'the plague victim and the stabbed are martyrs' {cite:sahih-al-bukhari}."
