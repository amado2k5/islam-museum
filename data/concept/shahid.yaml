id: concept/shahid
education:
  did_you_know:
    ar: "الشهيد عند أهل السنة من قُتل دون دينه أو ماله أو دمه، ويلحق به المبطون والمطعون ومن مات غرقاً أو تحت الهدم — «من قتل دون ماله فهو شهيد»."
    en: "For the Sunnis the martyr is whoever is killed defending religion, property or life — joined, say the jurists, by plague and stomach victims and whoever drowns or dies under a collapse: 'whoever dies defending his wealth is a martyr'."
    ur: "اہلِ سنت کے نزدیک شہید وہ ہے جو دین، مال یا جان کی حفاظت میں مارا جائے — طاعون، ڈوبنے یا ملبے تلے مرنے والے بھی شمار ہیں: «جو مال کی حفاظت میں مارا جائے وہ شہید ہے»۔"
    sources: [source/sahih-al-bukhari, source/sahih-muslim]
