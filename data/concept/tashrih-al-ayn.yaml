id: "concept/tashrih-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "تشريح العين ورطوباتها"
  en: "Anatomy of the eye and its humours"
  ur: "آنکھ کی تشریح اور اس کی رطوبتیں"
  es: "Anatomía del ojo y sus humores"
  fr: "Anatomie de l'œil et de ses humeurs"
  tr: "Gözün anatomisi ve nemi"
  id: "Anatomi mata dan kelembapannya"
summary:
  ar: "قوة الإبصار ومادة الروح الباصر تنفذ إلى العين من طريق العصبتين المجوفيتين، وفي العين ثلاث رطوبات: الجليدية الصافية المستديرة المتفرطحة من قدامها في وسط العين، ووراءها الزجاجية المغذية لها الشبيهة بالزجاج الذائب، وقدامها البيضية الشبيهة ببياض البيض وهي كالفضل عن جوهر الجليدية {cite:canon-ibn-sina-print-v2 p.161}"
  en: "The power of vision and the matter of the seeing spirit reach the eye through the two hollow nerves; in the eye are three moistures: the ice-like (jalidiyya), pure and round, flattened at its front and set in the eye's centre; behind it the glass-like (zujajiyya) that nourishes it, like molten glass; before it the white-of-egg-like (baydiyya), like the superfluity of the ice-like's substance {cite:canon-ibn-sina-print-v2 p.161}"
  ur: "بینائی کی قوت اور باصر روح کا مادہ دو کھوکھلے عصبوں کے راستے آنکھ تک پہنچتا ہے؛ آنکھ میں تین رطوبتیں ہیں: جلیدیہ — صاف اور گول، اگلی طرف سے چپٹی، آنکھ کے وسط میں؛ اس کے پیچھے زجاجیہ جو اسے غذا دیتی ہے، پگھلے شیشے جیسی؛ اور اس کے آگے بيضيہ جو انڈے کی سفیدی جیسی ہے اور جلیدیہ کے جوہر کا فضل جیسی {cite:canon-ibn-sina-print-v2 p.161}"
  es: "El poder de la visión y la materia del espíritu que ve llegan al ojo a través de los dos nervios huecos; en el ojo hay tres humedades: la gélida (jalidiyya), pura y redonda, aplanada en su frente y situada en el centro del ojo; detrás de ella la vítrea (zujajiyya) que la nutre, como vidrio fundido; delante de ella la clara de huevo (baydiyya), como la superfluidad de la sustancia gélida {cite:canon-ibn-sina-print-v2 p.161}"
  fr: "La puissance de la vision et la substance de l'esprit voyant atteignent l'œil par les deux nerfs creux; dans l'œil se trouvent trois fluides: le fluide glacé (jalidiyya), pur et rond, aplati à l'avant et situé au centre de l'œil; derrière lui, le fluide vitreux (zujajiyya) qui le nourrit, comme du verre en fusion; devant lui, le fluide blanc d'œuf (baydiyya), comme le surplus de la substance glacée. {cite:canon-ibn-sina-print-v2 p.161}"
  tr: "Görme gücü ve Gören Ruh'un maddesi göze iki boş sinir aracılığıyla nüfuz eder. Gözde üç nem bulunur: gözün ortasında ön taraftan gevşen, yuvarlak, buzul nemi vardır; arkasında erimiş camı andıran cam beslenen cam; ve oval ön taraf ise buzulların özünü andıran yumurta beyazına benzeyen {cite:canon-ibn-sina-print-v2 s.161}"
  id: "Kekuatan penglihatan dan substansi Roh Penglihatan menembus mata melalui dua saraf kosong. Di mata, terdapat tiga kelembapan: yang jernih, bulat, dan glasial yang mengendur dari depan di tengah mata; di belakangnya, pemberian kaca yang menyerupai kaca cair; dan bagian depan oval yang menyerupai putih telur, yang mirip dengan esensi gletser {cite:canon-ibn-sina-print-v2 hlm.161}"
