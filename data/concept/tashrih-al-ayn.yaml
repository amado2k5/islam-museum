id: "concept/tashrih-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "تشريح العين ورطوباتها"
  en: "Anatomy of the eye and its humours"
  ur: "آنکھ کی تشریح اور اس کی رطوبتیں"
summary:
  ar: "قوة الإبصار ومادة الروح الباصر تنفذ إلى العين من طريق العصبتين المجوفيتين، وفي العين ثلاث رطوبات: الجليدية الصافية المستديرة المتفرطحة من قدامها في وسط العين، ووراءها الزجاجية المغذية لها الشبيهة بالزجاج الذائب، وقدامها البيضية الشبيهة ببياض البيض وهي كالفضل عن جوهر الجليدية {cite:canon-ibn-sina-print-v2 p.161}"
  en: "The power of vision and the matter of the seeing spirit reach the eye through the two hollow nerves; in the eye are three moistures: the ice-like (jalidiyya), pure and round, flattened at its front and set in the eye's centre; behind it the glass-like (zujajiyya) that nourishes it, like molten glass; before it the white-of-egg-like (baydiyya), like the superfluity of the ice-like's substance {cite:canon-ibn-sina-print-v2 p.161}"
  ur: "بینائی کی قوت اور باصر روح کا مادہ دو کھوکھلے عصبوں کے راستے آنکھ تک پہنچتا ہے؛ آنکھ میں تین رطوبتیں ہیں: جلیدیہ — صاف اور گول، اگلی طرف سے چپٹی، آنکھ کے وسط میں؛ اس کے پیچھے زجاجیہ جو اسے غذا دیتی ہے، پگھلے شیشے جیسی؛ اور اس کے آگے بيضيہ جو انڈے کی سفیدی جیسی ہے اور جلیدیہ کے جوہر کا فضل جیسی {cite:canon-ibn-sina-print-v2 p.161}"
