label:
  ar: "الكيفيات الفاعلة والمنفعلة والوجع عند ابن سينا"
  en: "Active and passive qualities and pain in the Canon"
  fr: "Qualités actives et passives et douleur dans le Canon"
  ur: "فاعل اور منفعل کیفیات اور درد، قانون کے مطابق"
  es: "Cualidades activas y pasivas y el dolor en el Canon"
summary:
  ar: "يقول ابن سينا إنه ليس كل سوء مزاج مختلف مؤلماً: فالحار والبارد كيفيتان فاعلتان، واليابس والرطب منفعلتان، واليابس يؤلم بالعرض لأنه قد يتبعه تفرّق الاتصال، والرطب لا يؤلم {cite:canon-ibn-sina-print-v1 p.148}."
  en: "Ibn Sina says that not every bad temperament is of the unequal, painful kind: hot and cold are active qualities, dry and wet are passive ones, dry hurts only by accident because separation of continuity may follow it, and wet does not hurt {cite:canon-ibn-sina-print-v1 p.148}."
  fr: "Ibn Sina précise que tout mauvais tempérament n’est pas inégal et douloureux : chaud et froid sont actifs, sec et humide passifs ; le sec ne fait mal que par accident, par la rupture de continuité qui peut en découler, et l’humide ne fait pas mal {cite:canon-ibn-sina-print-v1 p.148}."
  es: "Ibn Sina dice que no todo mal temperamento es del tipo desigual y doloroso: el calor y el frío son cualidades activas, la sequedad y la humedad son pasivas, la sequedad duele solo por accidente porque puede seguirle una separación de continuidad, y la humedad no duele {cite:canon-ibn-sina-print-v1 p.148}."
