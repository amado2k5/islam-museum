summary:
  ar: "يقول ابن سينا إنه ليس كل سوء مزاج مختلف مؤلماً: فالحار والبارد كيفيتان فاعلتان، واليابس والرطب منفعلتان، واليابس يؤلم بالعرض لأنه قد يتبعه تفرّق الاتصال، والرطب لا يؤلم {cite:canon-ibn-sina-print-v1 p.148}."
  en: "Ibn Sina says that not every bad temperament is of the unequal, painful kind: hot and cold are active qualities, dry and wet are passive ones, dry hurts only by accident because separation of continuity may follow it, and wet does not hurt {cite:canon-ibn-sina-print-v1 p.148}."
