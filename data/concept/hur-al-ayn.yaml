label:
  ar: "الحور العين في درس الشيخ عمر عبد الكافي"
  en: "Hur al-ayn in Sheikh Omar Abdelkafy's lecture"
  ur: "حورِ عین شیخ عمر عبد الکافی کے درس میں"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن الحور العين نساء خلقهن الله بيده وليسوا كزوجات الدنيا. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:31:30} ويرى أن نساء الجنة لا يكبرن وأن الزوجين يرتقيان معا. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:36:00}"
  en: "Sheikh Omar Abdelkafy says that the hur al-ayn are women whom God created with His own hand and are not like the wives of this world. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:31:30} He holds that the women of paradise do not age and that husband and wife rise together. {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:36:00}"
  ur: "شیخ عمر عبد الکافی کہتے ہیں کہ حورِ عین وہ عورتیں ہیں جنہیں اللہ نے اپنے ہاتھ سے پیدا کیا اور وہ دنیا کی بیویوں کی طرح نہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:31:30} ان کی رائے ہے کہ جنت کی عورتیں بوڑھی نہیں ہوتیں اور میاں بیوی ساتھ ساتھ بلند ہوتے ہیں۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep06 00:36:00}"
