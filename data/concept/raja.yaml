label: { ar: "الرجعة", en: "Raj'a (the return to the world)", es: "Raj'a (el regreso al mundo)", fr: "Raj'a (le retour au monde)", ur: "راجع ⁦(دنیا میں واپسی)⁩", tr: "Dönüş", id: "Kembali" }
summary:
  ar: "الرجعة عقيدة تتصل بعقيدة المهدي يعتقدها كثير من الإمامية: أن النبي وعلياً والحسن والحسين وباقي الأئمة وخصومهم كأبي بكر وعمر وعثمان ومعاوية ويزيد يرجعون إلى الدنيا بعد ظهور المهدي فيُعذَّب من اعتدى على الأئمة وغصبهم حقوقهم أو قتلهم، ثم يموتون جميعاً ثم يُحيون يوم القيامة؛ وقال الشريف المرتضى إن أبا بكر وعمر يصلبان على شجرة في زمن المهدي — وهي عقيدة أعرق في الغرابة من عقيدة المهدي {cite:duha-islam p. 876}. وأقدم من قال بالرجعة في العصر الأول عبد الله بن سبأ فقد كان يقول برجوع علي {cite:duha-islam p. 874}."
  en: "Raj'a — the doctrine that after the Mahdi's appearance the imams and their opponents return to this world for retribution, then die and rise on Judgement Day; earliest attributed to Ibn Saba' {cite:duha-islam p. 874, 876}."
  es: "Raj'a: la doctrina según la cual, tras la aparición del Mahdi, los imanes y sus oponentes regresan a este mundo para recibir castigo, mueren y resucitan en el Día del Juicio; atribuida por primera vez a Ibn Saba' {cite:duha-islam p. 874, 876}."
  fr: "Raj'a — la doctrine selon laquelle, après l'apparition du Mahdi, les imams et leurs opposants reviennent dans ce monde pour se venger, puis meurent et ressuscitent le Jour du Jugement; attribuée pour la première fois à Ibn Saba' {cite: duha-islam p. 874, 876}."
  ur: "راجع - یہ نظریہ کہ ظہور مہدی کے بعد ائمہ اور ان کے مخالفین انتقام کے لیے اس دنیا میں واپس آتے ہیں، پھر مرتے ہیں اور قیامت کے دن جی اٹھتے ہیں۔ سب سے قدیم ابن سبا سے منسوب 874، 876}۔"
  tr: "Raj'a, birçok İmamî'nin benimsediği Mehdi inancıyla ilgili bir öğretidir: Peygamber, Ali, Hasan, Hüseyin, diğer imamlar ve rakipleri Ebu Bekir, Ömer, Osman Müaviye ve Yezid gibi rakipleri Mehdi ortaya çıktıktan sonra dünyaya dönecekler, imamlara saldıran, haklarını gasp edenlerin veya öldürenler cezalandırılacak, sonra herkes ölecek ve Kıyamet Günü'nde yaşayacak. El-Şerif el-Murtada, Ebu Bekir ve Ömer'in Mehdi zamanında bir ağaçta çarmıha gerildiğini söylemiştir — bu inanç kökeni olarak Mehdi inancından daha yabancıdır {atıf:Duha-İslam, s. 876}. Erken dönemde dönüşü savunan en erken kişi, Ali'nin dönüşünü talep eden Abdullah ibn Saba'dır {atı:Duha-İslam, s. 874}."
  id: "Raj'a adalah doktrin yang berkaitan dengan kepercayaan Mahdi, yang dianut oleh banyak Imami: bahwa Nabi, Ali, Hasan, Husayn, Imam-imam lain, dan lawan mereka seperti Abu Bakr, Umar, Uthman, Muawiya, dan Yazid akan kembali ke dunia ini setelah kemunculan Mahdi, dan mereka yang menyerang Imam, merebut hak mereka, atau membunuh mereka, akan dihukum, lalu semua akan mati dan hidup pada Hari Kiamat. Al-Sharif al-Murtada mengatakan bahwa Abu Bakr dan Umar disalibkan di atas pohon pada masa Mahdi — sebuah kepercayaan yang berasal dari kepercayaan Mahdi {cite:Duha-Islam, hlm. 876}. Orang pertama yang menganjurkan kembali pada era awal adalah Abdullah ibn Saba, yang biasa menyerukan kembalinya Ali {cite:Duha-Islam, hlm. 874}."
