label: { ar: "الرجعة", en: "Raj'a (the return to the world)" }
summary:
  ar: "الرجعة عقيدة تتصل بعقيدة المهدي يعتقدها كثير من الإمامية: أن النبي وعلياً والحسن والحسين وباقي الأئمة وخصومهم كأبي بكر وعمر وعثمان ومعاوية ويزيد يرجعون إلى الدنيا بعد ظهور المهدي فيُعذَّب من اعتدى على الأئمة وغصبهم حقوقهم أو قتلهم، ثم يموتون جميعاً ثم يُحيون يوم القيامة؛ وقال الشريف المرتضى إن أبا بكر وعمر يصلبان على شجرة في زمن المهدي — وهي عقيدة أعرق في الغرابة من عقيدة المهدي {cite:duha-islam p. 876}. وأقدم من قال بالرجعة في العصر الأول عبد الله بن سبأ فقد كان يقول برجوع علي {cite:duha-islam p. 874}."
  en: "Raj'a — the doctrine that after the Mahdi's appearance the imams and their opponents return to this world for retribution, then die and rise on Judgement Day; earliest attributed to Ibn Saba' {cite:duha-islam p. 874, 876}."
