id: concept/iqta-fiqh
class: concept
kind: legal
label: { ar: "الإقطاع ⁦(في الفقه)⁩", en: "Iqta' in fiqh (the ruler's grant of land)", es: "Iqta' en fiqh (la concesión de tierras por parte del gobernante)", fr: "Iqta' en fiqh (la concession de terre du souverain)" }
summary:
  ar: "{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} الإقطاع في الفقه تمليك الإمام أو إرفاقه بمنفعة أرض أو مال من بيت المال أو من الموات، وهو نوعان: إقطاع إرفاق وإقطاع تمليك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} وهو جائز بشروطه، وفعل النبي في إقطاع الزبير من موات النقيع أصل فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} وللإمام أن يسترجع الإقطاع إذا لم يعمر المقطع أرضه في المدة التي يقدرها الفقهاء، وتختلف أقوالهم في تقديرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3225} وعند جمهور الفقهاء لا يجوز إقطاع المرافق العامة وما لا غنى عنه للمسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3224}"
  en: "In fiqh, iqta' is the ruler's grant of a land or a right to use it, from dead land or from the public treasury. There are two kinds, the grant of use and the grant of ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} It is permitted under conditions, and the Prophet's grant to al-Zubayr of the ground his horse ran over in the dead land of al-Naqi' is its basis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} The ruler may recall a grant if the holder does not cultivate it within the period the jurists set, and they differ on that period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3225} The majority do not allow granting public utilities or what the Muslims cannot do without. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3224}"
  es: "En fiqh, iqta' es la concesión de tierras por parte del gobernante o el derecho a usarlas, ya sea de tierras muertas o del tesoro público. Hay dos tipos: la concesión de uso y la concesión de propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} Está permitida bajo ciertas condiciones, y la concesión del Profeta a al-Zubayr del terreno que su caballo pisó en las tierras muertas de al-Naqi' es su base. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} El gobernante puede revocar una concesión si el poseedor no la cultiva dentro del plazo establecido por los juristas, quienes difieren en cuanto a dicho plazo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3225} La mayoría no permite la concesión de servicios públicos ni de aquello de lo que los musulmanes no pueden prescindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3224}"
  fr: "En matière de fiqh, l'iqta' est la concession par le souverain d'une terre ou d'un droit d'usage, provenant de terres incultes ou du trésor public. Il en existe deux types: la concession d'usage et la concession de propriété. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} Elle est permise sous certaines conditions, et la concession par le Prophète à al-Zubayr du terrain foulé par son cheval dans les terres incultes d'al-Naqi' en constitue le fondement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} Le souverain peut révoquer une concession si le titulaire ne la met pas en culture dans le délai fixé par les juristes, lesquels divergent quant à ce délai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3225} La majorité n'autorise pas l'octroi de services publics ni de biens dont les musulmans ne peuvent se passer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3224}"
