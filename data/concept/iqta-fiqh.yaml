id: concept/iqta-fiqh
class: concept
kind: legal
label: { ar: "الإقطاع (في الفقه)", en: "Iqta' in fiqh (the ruler's grant of land)" }
summary:
  ar: "{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} الإقطاع في الفقه تمليك الإمام أو إرفاقه بمنفعة أرض أو مال من بيت المال أو من الموات، وهو نوعان: إقطاع إرفاق وإقطاع تمليك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} وهو جائز بشروطه، وفعل النبي في إقطاع الزبير من موات النقيع أصل فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} وللإمام أن يسترجع الإقطاع إذا لم يعمر المقطع أرضه في المدة التي يقدرها الفقهاء، وتختلف أقوالهم في تقديرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3225} وعند جمهور الفقهاء لا يجوز إقطاع المرافق العامة وما لا غنى عنه للمسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3224}"
  en: "In fiqh, iqta' is the ruler's grant of a land or a right to use it, from dead land or from the public treasury. There are two kinds, the grant of use and the grant of ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} It is permitted under conditions, and the Prophet's grant to al-Zubayr of the ground his horse ran over in the dead land of al-Naqi' is its basis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3220} The ruler may recall a grant if the holder does not cultivate it within the period the jurists set, and they differ on that period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3225} The majority do not allow granting public utilities or what the Muslims cannot do without. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3224}"
