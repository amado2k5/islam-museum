summary:
  ar: "النخالة في الكتاب حارة يابسة في الأولى، فيها جلاء وتليين وتنقية ولا تبلغ الكرسنة، تحلل الرياح والبلغم، وتضمد بها الأورام الحارة والقروح، وتليّن الصدر والبطن، وتنفع من لسع العقرب والأفعى {cite:canon-ibn-sina-print-v1 p.578}."
  en: "Nukhala, bran, is in the book hot and dry in the first degree, with cleansing, softening and purifying not reaching the bitter vetch, dissolving winds and phlegm; it is used as a poultice on hot swellings and ulcers, softens the chest and the belly, and helps the sting of scorpion and viper {cite:canon-ibn-sina-print-v1 p.578}."
  ur: "نخالہ ⁦(چوکر)⁩ کتاب میں پہلے درجے میں گرم خشک ہے، اس میں جلا، نرمی اور صفائی ہے مگر کرسنہ کے درجے کی نہیں، ہواؤں اور بلغم کو تحلیل کرتی ہے؛ گرم وروں اور قرحوں پر لیپ کی جاتی ہے، سینہ اور پیٹ نرم کرتی ہے، اور بچھو اور افعی کے ڈنک میں مفید ہے {cite:canon-ibn-sina-print-v1 p.578}۔"
  es: "Nukhala, salvado, es en el libro caliente y seco en primer grado, con limpieza, suavización y purificación que no alcanzan la veza amarga, disolviendo vientos y flema; se usa como cataplasma sobre hinchazones y úlceras calientes, suaviza el pecho y el vientre, y ayuda con la picadura de escorpión y víbora {cite:canon-ibn-sina-print-v1 p.578}."
