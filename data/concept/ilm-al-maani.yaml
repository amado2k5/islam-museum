tags: [arabiyya-browser, arabiyya-sciences]
label:
  ar: "علم المعاني"
  en: "The science of ma'ani"
  ur: "علمِ معانی"
  fr: "La science des ma'ani"
  es: "La ciencia de los ma'ani"
  tr: "anlambilim"
  id: "semantik"
summary:
  ar: "تعريف علم المعاني عند القزويني والسكاكي، وأبوابه الثمانية، وأمثلة ابن خلدون في التقديم والتأكيد والتنكير والوصل، وأمثلة السكاكي من القرآن: الخبر في موضع الطلب في البقرة 83 والصف 10 و11، وأسلوب الحكيم في سؤال الأهلة في البقرة 189، مع ما قاله البغوي والقرطبي وابن كثير عند الآيات، وصلة العلم بنظم الجرجاني."
  en: "The definition of ma'ani in al-Qazwini and al-Sakkaki, its eight chapters, Ibn Khaldun's examples of putting first, emphasis, indefiniteness and joining, and al-Sakkaki's examples from the Qur'an, a report in place of a request at al-Baqara 83 and al-Saff 10 and 11 and 'the manner of the wise' in the question about the crescents at al-Baqara 189, with what al-Baghawi, al-Qurtubi and Ibn Kathir say at the verses, and the link of the science to al-Jurjani's nazm."
  ur: "معانی کی تعریف قزوینی اور سکاکی کے ہاں، اس کے آٹھ ابواب، مقدم کرنے، تاکید، نکرہ لانے اور وصل کی ابن خلدون کی مثالیں، اور قرآن سے سکاکی کی مثالیں: البقرہ 83 اور الصف 10 اور 11 میں طلب کی جگہ خبر، اور البقرہ 189 میں ہلالوں کے سوال میں اسلوبِ حکیم، ان آیات پر بغوی، قرطبی اور ابن کثیر کے کہے ہوئے کے ساتھ، اور اس علم کا جرجانی کے نظم سے تعلق۔"
  fr: "La définition des ma'ani chez al-Qazwini et al-Sakkaki, ses huit chapitres, les exemples d'Ibn Khaldun sur la mise en avant, l'insistance, l'indéfini et la jonction, et les exemples coraniques d'al-Sakkaki, un énoncé à la place d'une demande à al-Baqara 83 et al-Saff 10 et 11 et « la manière du sage » dans la question sur les croissants à al-Baqara 189, avec ce que disent al-Baghawi, al-Qurtubi et Ibn Kathir à ces versets, et le lien de la science avec le nazm d'al-Jurjani."
  es: "La definición de los ma'ani en al-Qazwini y al-Sakkaki, sus ocho capítulos, los ejemplos de Ibn Jaldún sobre anteponer, el énfasis, lo indefinido y la unión, y los ejemplos coránicos de al-Sakkaki, un enunciado en lugar de una petición en al-Baqara 83 y al-Saff 10 y 11 y «el modo del sabio» en la pregunta sobre las lunas crecientes en al-Baqara 189, con lo que dicen al-Baghawi, al-Qurtubi e Ibn Kathir en esos versículos, y el vínculo de la ciencia con el nazm de al-Jurjani."
  tr: "El-Kəzvini ve Sakaki'ye göre anlam biliminin tanımı, sekiz bölümü, İbn Haldun'un edat, vurgu, belirsizlik ve bağlantı örnekleri; Kur'an'dan El-Sakkaki örnekleri: Al-Baqarah 83 ve 10 ile 11. satırlarda arama yerine rapor; El-Hakim'in hilalleri sorgulama tarzı 189, El-Baghavi, El-Kurtubi ve İbn Ketir'in ayetler hakkında söyledikleri; ve bilginin El-Jurcani'nin şiiriyle bağlantısı."
  id: "Definisi ilmu makna menurut Al-Qazwini dan Al-Sakaki, delapan babnya, contoh Ibn Khaldun dalam preposisi, penekanan, ketidakpastian, dan keterhubungan; contoh Al-Sakkaki dari Al-Qur'an: laporan menggantikan pencarian dalam Al-Baqarah 83 dan baris 10 dan 11; gaya Al-Hakim dalam mempertanyakan bulan sabit dalam Al-Baqarah 189, bersama dengan apa yang dikatakan Al-Baghawi, Al-Qurtubi, dan Ibn Kathir mengenai ayat-ayat tersebut; dan hubungan pengetahuan dengan puisi Al-Jurjani."
