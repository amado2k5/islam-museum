label: { ar: "الخط الكوفي", en: "Kufic script", ur: "خطِ کوفی" }
summary:
  ar: "فئة من الخطوط العربية الزاوية المحكومة بنسب هندسية، ظهرت أواخر القرن الأول الهجري، ونسبت إلى الكوفة اسمًا لا مكانَ صنع، وكانت الخط المفضل لكتابة المصاحف حتى أواسط القرن الرابع الهجري تقريبًا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 23}."
  en: "A family of angular Arabic scripts governed by geometric proportion that rose in the late seventh to early eighth century; named after Kufa rather than made there, it was the preferred script for copying the Qur'an until about the mid- to late tenth century {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 23}."
  ur: "ہندسی تناسب کے پابند زاویہ دار عربی خطوط کا ایک خاندان جو ساتویں صدی کے آخر اور آٹھویں کے آغاز میں ابھرا؛ کوفہ کے نام سے موسوم مگر وہاں بنا ہوا نہیں، اور دسویں صدی کے وسط و آخر تک قرآن کی کتابت کا پسندیدہ خط رہا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 23}۔"
