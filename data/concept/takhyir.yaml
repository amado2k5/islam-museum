  en: "Takhyir (choice left to the obligated person)"
  ur: "تخییر (اختیار سپرد کرنا)"
summary:
  ar: "التخيير تفويض الأمر إلى اختيار المكلف في انتقاء خصلة من خصال معينة شرعا. وللتخيير أحكام في مواضع: تخيير المصلي في الوقت الموسع، وتخيير الساعي في نوع ما يخرج من الزكاة، والتخيير في فدية الإحرام وكفارة صيد الحرم وكفارة اليمين، وتخيير من أسلم على أكثر من أربع نسوة، وتخيير الطفل في الحضانة، وتخيير الإمام في الأسرى وحد المحارب، وتخيير الملتقط، والتخيير بين القصاص والدية والعفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852}"
  en: "Takhyir is leaving to the obligated person's choice one of several options fixed by the law. It has its own rules in many places: the choice of the time for prayer within its broad window, the collector's choice of zakat type, the choice of ransom for a violation of ihram, the expiation for hunting in the sacred precinct and for an oath, the choice of a husband who converts with more than four wives, a child's choice in custody, the imam's choice over captives and the penalty for brigandage, the finder's choice over a lost item, and the victim's choice among retaliation, blood-money and pardon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852}"
