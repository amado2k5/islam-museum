id: concept/takhyir
class: concept
kind: legal
label:
  ar: "التخيير"
  en: "Takhyir (choice left to the obligated person)"
  ur: "تخییر ⁦(اختیار سپرد کرنا)⁩"
  es: "Takhyir (elección queda a discreción de la persona obligada)"
  fr: "Takhyir (choix laissé à la personne obligée)"
summary:
  ar: "التخيير تفويض الأمر إلى اختيار المكلف في انتقاء خصلة من خصال معينة شرعا. وللتخيير أحكام في مواضع: تخيير المصلي في الوقت الموسع، وتخيير الساعي في نوع ما يخرج من الزكاة، والتخيير في فدية الإحرام وكفارة صيد الحرم وكفارة اليمين، وتخيير من أسلم على أكثر من أربع نسوة، وتخيير الطفل في الحضانة، وتخيير الإمام في الأسرى وحد المحارب، وتخيير الملتقط، والتخيير بين القصاص والدية والعفو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852}"
  en: "Takhyir is leaving to the obligated person's choice one of several options fixed by the law. It has its own rules in many places: the choice of the time for prayer within its broad window, the collector's choice of zakat type, the choice of ransom for a violation of ihram, the expiation for hunting in the sacred precinct and for an oath, the choice of a husband who converts with more than four wives, a child's choice in custody, the imam's choice over captives and the penalty for brigandage, the finder's choice over a lost item, and the victim's choice among retaliation, blood-money and pardon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852}"
  es: "Takhyir consiste en dejar a la persona obligada la elección de una de las varias opciones fijadas por la ley. Tiene sus propias reglas en muchos aspectos: la elección del momento para la oración dentro de su amplio margen, la elección del tipo de zakat por parte del recaudador, la elección del rescate por una violación del ihram, la expiación por cazar en el recinto sagrado y por un juramento, la elección de un esposo que se convierte con más de cuatro esposas, la elección de un niño en cuanto a la custodia, la elección del imán sobre los cautivos y la pena por bandidaje, la elección del que encuentra un objeto perdido y la elección de la víctima entre represalia, compensación económica y perdón. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4839} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852}"
  fr: "Le takhyir laisse à la personne assujettie le choix parmi plusieurs options fixées par la loi. Il comporte ses propres règles en de nombreux points: le choix de l’heure de la prière dans sa large plage horaire, le choix du type de zakat par le collecteur, le choix de la rançon en cas de violation de l’ihram, l’expiation pour la chasse dans l’enceinte sacrée et pour un serment, le choix d’un mari converti ayant plus de quatre épouses, le choix d’un enfant placé sous tutelle, le choix de l’imam concernant les captifs et la peine pour brigandage, le choix de la personne qui retrouve un objet perdu, et le choix de la victime entre la vengeance, le prix du sang et le pardon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4838} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4839} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4852}"
  ur: "تکیر قانون کی طرف سے مقرر کردہ متعدد اختیارات میں سے ایک ذمہ دار شخص کی پسند پر چھوڑ رہا ہے۔ بہت سی جگہوں پر اس کے اپنے اصول ہیں: اپنی وسیع کھڑکی کے اندر نماز کے لیے وقت کا انتخاب، زکوٰۃ کے جمع کرنے والے کا انتخاب، احرام کی خلاف ورزی کے لیے فدیہ کا انتخاب، حرمین شریفین میں شکار کرنے کا کفارہ اور حلف کے لیے، چار سے زیادہ بیویوں کے ساتھ مذہب تبدیل کرنے والے شوہر کا انتخاب، بچوں کا انتخاب، عصمت و عصمت کے مقابلے میں بچے کا انتخاب۔ بریگینڈیج، کھوئی ہوئی چیز پر تلاش کرنے والے کا انتخاب، اور انتقامی کارروائی، خون بہا اور معافی کے درمیان شکار کا انتخاب۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4838} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص4839}"
