# Verification: one source (Arslan's commentary, scan pages 295-299, book pp. 278-282), which quotes and abridges Samuel Zwemer's book on Islam's past, present and future. Zwemer's book and the 1906 Cairo conference (Arslan gives 62 missionaries and 29 societies) must be checked against conference records. The conversion figures for Africa are Zwemer's reported figures and must be checked. The entry describes the missionary movement and does not judge individual missionaries; Arslan's comments on Zwemer's motives are labelled as his.
