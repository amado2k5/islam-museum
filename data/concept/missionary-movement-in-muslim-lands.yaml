label: { ar: "حركة التبشير في بلاد الإسلام", en: "The missionary movement in Muslim lands" }
summary:
  ar: "يعرض شكيب أرسلان في الفصل المعنون «المبشر زويمر ومفترياته» حركة التبشير المسيحي في بلاد المسلمين كما يقرؤها من كتاب للمبشر صموئيل زويمر. يذكر أن مؤتمراً تبشيرياً انعقد في القاهرة سنة 1906 حضره عشرات المبشرين عن جمعيات من أوروبا وأمريكا، وأن الكاتب يعدّ ما جرى بعد الحرب العالمية الأولى فرصة لتوسيع العمل التبشيري. ويعرض أرسلان ما نقله من تقديرات عن النتائج في أفريقيا وآسيا، ويرى أن المبشرين لم يحققوا في البلاد العربية ما حققوه في الهند وجاوة. ثم يرد على الكاتب بأن المسلمين يؤمنون بالإنجيل ورسالة عيسى، وبأن العمل التبشيري إن قصد الوثنيين فهو أولى بهم. هذا العرض يصف ما ذكره المؤلف عن حركة التبشير، وما فيه من الحكم على نيات أصحابه يعود إلى أرسلان لا إلى المؤرخ."
  en: "Arslan's chapter on the missionary writer Samuel Zwemer reports the Christian missionary movement in Muslim lands as he reads it in Zwemer's book. He says a missionary conference in Cairo in 1906 brought together missionaries from dozens of societies in Europe and America, and that Zwemer saw the weakening of Muslim states after the First World War as an opening. Arslan reports the figures Zwemer gave for conversion in Africa and Asia, and notes that the societies had less success in the Arab lands than in India and Java. He replies that Muslims believe in the Gospel and the mission of Jesus, and that if the aim is to reach the unbelieving, the mission should go to pagans first. This describes what Arslan reports of the movement. The judgement about the intentions of its members is Arslan's, not the museum's."
