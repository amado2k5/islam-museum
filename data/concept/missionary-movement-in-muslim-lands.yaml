label: { ar: "حركة التبشير في بلاد الإسلام", en: "The missionary movement in Muslim lands", es: "El movimiento misionero en tierras musulmanas", fr: "Le mouvement missionnaire en terres musulmanes" }
summary:
  ar: "يعرض شكيب أرسلان في الفصل المعنون «المبشر زويمر ومفترياته» حركة التبشير المسيحي في بلاد المسلمين كما يقرؤها من كتاب للمبشر صموئيل زويمر. يذكر أن مؤتمراً تبشيرياً انعقد في القاهرة سنة 1906 حضره عشرات المبشرين عن جمعيات من أوروبا وأمريكا، وأن الكاتب يعدّ ما جرى بعد الحرب العالمية الأولى فرصة لتوسيع العمل التبشيري. ويعرض أرسلان ما نقله من تقديرات عن النتائج في أفريقيا وآسيا، ويرى أن المبشرين لم يحققوا في البلاد العربية ما حققوه في الهند وجاوة. ثم يرد على الكاتب بأن المسلمين يؤمنون بالإنجيل ورسالة عيسى، وبأن العمل التبشيري إن قصد الوثنيين فهو أولى بهم. هذا العرض يصف ما ذكره المؤلف عن حركة التبشير، وما فيه من الحكم على نيات أصحابه يعود إلى أرسلان لا إلى المؤرخ."
  en: "Arslan's chapter on the missionary writer Samuel Zwemer reports the Christian missionary movement in Muslim lands as he reads it in Zwemer's book. He says a missionary conference in Cairo in 1906 brought together missionaries from dozens of societies in Europe and America, and that Zwemer saw the weakening of Muslim states after the First World War as an opening. Arslan reports the figures Zwemer gave for conversion in Africa and Asia, and notes that the societies had less success in the Arab lands than in India and Java. He replies that Muslims believe in the Gospel and the mission of Jesus, and that if the aim is to reach the unbelieving, the mission should go to pagans first. This describes what Arslan reports of the movement. The judgement about the intentions of its members is Arslan's, not the museum's."
  es: "El capítulo de Arslan sobre el escritor misionero Samuel Zwemer describe el movimiento misionero cristiano en tierras musulmanas tal como lo presenta en el libro de Zwemer. Arslan menciona que una conferencia misionera celebrada en El Cairo en 1906 reunió a misioneros de decenas de sociedades de Europa y América, y que Zwemer vio una oportunidad en el debilitamiento de los estados musulmanes tras la Primera Guerra Mundial. Arslan cita las cifras de conversión que Zwemer proporcionó en África y Asia, y señala que las sociedades tuvieron menos éxito en los países árabes que en la India y Java. Arslan responde que los musulmanes creen en el Evangelio y en la misión de Jesús, y que si el objetivo es alcanzar a los no creyentes, la misión debería dirigirse primero a los paganos. Esto describe lo que Arslan relata del movimiento. El juicio sobre las intenciones de sus miembros es de Arslan, no del museo."
  fr: "Le chapitre d'Arslan consacré à l'écrivain missionnaire Samuel Zwemer relate le mouvement missionnaire chrétien en terre musulmane tel qu'il l'interprète dans l'ouvrage de Zwemer. Il relate qu'une conférence missionnaire s'est tenue au Caire en 1906, rassemblant des missionnaires de dizaines de sociétés d'Europe et d'Amérique, et que Zwemer voyait dans l'affaiblissement des États musulmans après la Première Guerre mondiale une opportunité. Arslan rapporte les chiffres de conversion avancés par Zwemer en Afrique et en Asie, et note que les sociétés ont rencontré moins de succès dans les pays arabes qu'en Inde et à Java. Il rétorque que les musulmans croient en l'Évangile et en la mission de Jésus, et que si l'objectif est d'atteindre les non-croyants, la mission doit commencer par les païens. Voilà ce qu'Arslan rapporte du mouvement. Le jugement porté sur les intentions de ses membres est celui d'Arslan, et non celui du musée."
