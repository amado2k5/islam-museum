label: { ar: "قانون الاستكمال عند البيروني", en: "Al-Biruni's law of interpolation (istikmal)", ur: "بیرونی کا قانونِ استکمال" }
term: { ar: "الاستكمال", en: "interpolation" }
summary:
  ar: "طريقة استنبطها البيروني في المقالة الثالثة من القانون المسعودي لاستخراج قيم الجيوب الواقعة بين قيم الجدول، تراعي تغير الفروق نفسها، ويعدها محقق الكتاب صورة مبسطة لقوانين الاستكمال التي نسبت إلى نيوتن وجريجوري بعده بنحو ستمائة سنة {cite:qanun-masudi-jundi-v1 p. 40} {cite:qanun-masudi-jundi-v1 p. 41}."
  en: "A method devised by al-Biruni in Book 3 of the Qanun for finding sine values between tabulated entries by taking account of the change in the differences themselves; the editor regards it as a simple form of the interpolation formulas later credited to Newton and Gregory some six centuries afterwards {cite:qanun-masudi-jundi-v1 p. 40} {cite:qanun-masudi-jundi-v1 p. 41}."
  ur: "بیرونی کا القانون المسعودی کے تیسرے مقالے میں وضع کردہ طریقہ، جس سے جدول کی قیمتوں کے درمیان جیوب کی قیمتیں فرقوں کی تبدیلی کو ملحوظ رکھ کر نکالی جاتی ہیں؛ محقق اسے ان قوانینِ استکمال کی سادہ صورت سمجھتے ہیں جو چھ صدی بعد نیوٹن اور گریگوری سے منسوب ہوئے {cite:qanun-masudi-jundi-v1 p. 41}."
