id: concept/istikmal-interpolation
class: concept
kind: scientific
label: { ar: "قانون الاستكمال عند البيروني", en: "Al-Biruni's law of interpolation (istikmal)", ur: "بیرونی کا قانونِ استکمال", es: "Ley de interpolación de Al-Biruni (istikmal)", fr: "La loi d'interpolation d'Al-Biruni (istikmal)", tr: "Al-Biruni'nin Tamamlama Yasası", id: "Hukum Penyelesaian Al-Biruni" }
term: { ar: "الاستكمال", en: "interpolation" }
summary:
  ar: "طريقة استنبطها البيروني في المقالة الثالثة من القانون المسعودي لاستخراج قيم الجيوب الواقعة بين قيم الجدول، تراعي تغير الفروق نفسها، ويعدها محقق الكتاب صورة مبسطة لقوانين الاستكمال التي نسبت إلى نيوتن وجريجوري بعده بنحو ستمائة سنة {cite:qanun-masudi-jundi-v1 p. 40} {cite:qanun-masudi-jundi-v1 p. 41}."
  en: "A method devised by al-Biruni in Book 3 of the Qanun for finding sine values between tabulated entries by taking account of the change in the differences themselves; the editor regards it as a simple form of the interpolation formulas later credited to Newton and Gregory some six centuries afterwards {cite:qanun-masudi-jundi-v1 p. 40} {cite:qanun-masudi-jundi-v1 p. 41}."
  ur: "بیرونی کا القانون المسعودی کے تیسرے مقالے میں وضع کردہ طریقہ، جس سے جدول کی قیمتوں کے درمیان جیوب کی قیمتیں فرقوں کی تبدیلی کو ملحوظ رکھ کر نکالی جاتی ہیں؛ محقق اسے ان قوانینِ استکمال کی سادہ صورت سمجھتے ہیں جو چھ صدی بعد نیوٹن اور گریگوری سے منسوب ہوئے {cite:qanun-masudi-jundi-v1 p. 41}."
  es: "Un método ideado por al-Biruni en el Libro 3 del Qanun para encontrar valores de seno entre entradas tabuladas teniendo en cuenta el cambio en las diferencias mismas; el editor lo considera una forma simple de las fórmulas de interpolación que más tarde se atribuyeron a Newton y Gregory unos seis siglos después {cite:qanun-masudi-jundi-v1 p. 40} {cite:qanun-masudi-jundi-v1 p. 41}."
  fr: "Une méthode conçue par al-Biruni dans le Livre 3 du Qanun pour trouver les valeurs du sinus entre les entrées tabulées en tenant compte du changement dans les différences elles-mêmes; l'éditeur la considère comme une forme simple des formules d'interpolation attribuées plus tard à Newton et Gregory quelque six siècles après {cite:qanun-masudi-jundi-v1 p. 40} {cite:qanun-masudi-jundi-v1 p. 41}."
  tr: "Al-Masudi Yasası'nın üçüncü maddesinde Al-Biruni'nin tablo değerleri arasındaki sinüslerin değerlerini çıkarmak için türettiği yöntem, aynı farklılıkları dikkate alır ve yaklaşık altı yüz yıl sonra Newton ve Gregory'ye atfedilen tamamlama yasalarının basitleştirilmiş bir versiyonu olarak kabul eder {cite:qanun-masudi-jundi-v1 s. 40} {cite:qanun-masudi-jundi-v1 s. 41}."
  id: "Metode yang diturunkan oleh Al-Biruni dalam pasal ketiga Hukum Al-Masudi untuk mengekstrak nilai sinus yang terletak di antara nilai tabel mempertimbangkan perbedaan yang sama dan menganggapnya sebagai versi sederhana dari hukum penyelesaian yang dikaitkan dengan Newton dan Gregory sekitar enam ratus tahun kemudian {cite:qanun-masudi-jundi-v1 hlm. 40} {cite:qanun-masudi-jundi-v1 hlm. 41}."
