summary:
  ar: "اصطلاح مالي عثماني عام للإيرادات العرضية غير المنتظمة من الغرامات والرسوم ورسوم التسجيل وغيرها من الموارد الطارئة {cite:encyclopaedia-of-islam-2 vol. 1 p. 907}."
  en: "An Ottoman fiscal term for irregular, occasional revenues from fines, fees, registration charges and other casual income — akin to 'windfall' {cite:encyclopaedia-of-islam-2 vol. 1 p. 907}."
  fr: "Terme fiscal ottoman désignant les recettes irrégulières et occasionnelles : amendes, droits, frais d’enregistrement et autres revenus fortuits, comparables à une aubaine {cite:encyclopaedia-of-islam-2 vol. 1 p. 907}."
  es: "Un término fiscal otomano para los ingresos irregulares y ocasionales provenientes de multas, tasas, cargos de registro y otros ingresos ocasionales, similar a una \"ganancia inesperada\" {cite:encyclopaedia-of-islam-2 vol. 1 p. 907}."
  ur: "جرمانے، فیس، رجسٹریشن چارجز اور دیگر آرام دہ آمدنی سے فاسد، کبھی کبھار آمدنی کے لیے عثمانی مالیاتی اصطلاح - 'ونڈ فال' کے مترادف {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 907}۔"
  tr: "Cezalar, ücretler, kayıt ücretleri ve diğer acil durum kaynaklarından elde edilen düzensiz yan gelirler için genel bir Osmanlı mali sözleşmesi {atıf:İslam Ansiklopedisi-2 cilt 1, s. 907}."
  id: "Konvensi keuangan umum Ottoman untuk pendapatan insidental tidak teratur dari denda, biaya, biaya registrasi, dan sumber daya darurat lainnya {sitasi: Encyclopaedia-of-Islam-2 vol. 1, hlm. 907}."
