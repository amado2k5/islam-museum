id: concept/zij-sabi-mean-motion-of-the-sun-and-its-tables
class: concept
kind: scientific
label: { ar: "الحركة الوسطى للشمس وجداولها", en: "The Sun's mean motion and its tables", ur: "سورج کی وسطی حرکت اور اس کے جدول", es: "El movimiento medio del Sol y sus tablas" }
summary:
  ar: "من زمان السنة الموجود يقسم البتاني أجزاء الدائرة ثلاثمائة وستين فتخرج حركة الشمس الوسطى في اليوم، ثم في ثلاثين يوماً هي مقدار الشهر المصري، ثم في ثلاثمائة وخمسة وستين يوماً هي السنة المصرية، وهي ثلاثمائة وتسعة وخمسون جزءاً وخمس وأربعون دقيقة وست وأربعون ثانية وكسور تالية، ويثبت هذه الحركات في الجداول {cite:zij-sabi-nallino-byblion p.68}."
  en: "From the year found, al-Battani divides the three hundred and sixty parts of the circle to obtain the Sun's mean motion in a day, then in thirty days, the Egyptian month, then in three hundred and sixty-five days, the Egyptian year, which is three hundred and fifty-nine parts, forty-five minutes and forty-six seconds with further fractions following, and he enters these motions in tables {cite:zij-sabi-nallino-byblion p.68}."
  ur: "پایا گیا سال لے کر البتانی دائرے کے تین سو ساٹھ اجزا کو تقسیم کرتے ہیں تو ایک دن میں سورج کی وسطی حرکت نکلتی ہے، پھر تیس دنوں میں جو مصری مہینہ ہے، پھر تین سو پینسٹھ دنوں میں جو مصری سال ہے، اور یہ تین سو انسٹھ اجزا، پینتالیس دقیقے اور چھیالیس ثانیے مع بعد کی کسور کے ہے، اور وہ ان حرکات کو جدولوں میں درج کرتے ہیں {cite:zij-sabi-nallino-byblion p.68}۔"
  es: "A partir del año hallado, al-Battani divide las trescientas sesenta partes del círculo para obtener el movimiento medio del Sol en un día, luego en treinta días, el mes egipcio, luego en trescientos sesenta y cinco días, el año egipcio, que es de trescientas cincuenta y nueve partes, cuarenta y cinco minutos y cuarenta y seis segundos con fracciones adicionales a continuación, y registra estos movimientos en tablas {cite:zij-sabi-nallino-byblion p.68}."
