id: "concept/inqilab-al-jafn"
class: "concept"
kind: "scientific"
label:
  ar: "انقلاب الجفن وهو الشترة"
  en: "Eversion of the lid (shatra, lagophthalmos)"
  ur: "پلک کا الٹنا یعنی شترہ"
  es: "Eversión del párpado (shatra, lagophthalmos)"
  fr: "Éversion de la paupière (shatra, lagophthalmos)"
summary:
  ar: "انقلاب الجفن أصنافه ثلاثة: أحدها أن يتقلص الجفن ولا يغطي البياض وذلك إما خلقة وإما لقطع أصاب الجفن وتسمى عين مثله العين الأرنبية، والثاني أن لا يغطي بعض البياض ويسمى قصر الجفن وسببه سبب الأول إلا أنه أقل، والثالث أن لا ينطبق الجفن الأعلى على الأسفل وذلك يكون إما من غدة وإما من نبات لحم زائد وإما من تشنج عرض للجفن من قرحة اندملت عليه أو من تشنج العضل المطبقة للجفن، والذي عن قصر يشق ولا يخاط ويندمل بعد نشء لحم جلدي والذي عن غدة أو لحم زائد أو أثر قرحة يؤخذ بالحديد والذي من تشنج علاجه علاج التشنج بنوعيه {cite:canon-ibn-sina-print-v2 p.195} {cite:canon-ibn-sina-print-v2 p.196}"
  en: "Eversion of the lid has three kinds: first, the lid contracts and does not cover the white — either congenital or from a cut hitting the lid — and an eye like it is called the hare-eye; second, the middle kind, not covering some of the white, called shortness of the lid, with the first's cause but less; third, the upper lid not closing on the lower — from a gland, or from superfluous growing flesh from the start, or from a convulsion occurring to the lid from an ulcer that healed on it, or from convulsion of the lid-closing muscles; the shortness kind is slit, not sutured, and heals after skin flesh grows; the gland, extra-flesh and ulcer-remainder kinds are taken with iron; the convulsion kind is treated as convulsion in its two kinds {cite:canon-ibn-sina-print-v2 p.195} {cite:canon-ibn-sina-print-v2 p.196}"
  ur: "پلک کے الٹنے کی تین اقسام ہیں: پہلی یہ کہ پلک سکڑ جائے اور سفیدی نہ ڈھانپے — یا پیدائشی یا پلک پر لگے کٹاؤ سے — اور ایسی آنکھ خرگوشی آنکھ کہلاتی ہے؛ دوسری درمیانی قسم، سفیدی کا کچھ حصہ نہ ڈھانپنا، جسے پلک کی کمی کہتے ہیں اور سبب پہلا ہی لیکن کم؛ تیسری یہ کہ اوپر والی پلک نیچے والی پر نہ ملے — غدہ سے یا شروع سے اگے ہوئے اضافی گوشت سے یا پلک پر عرض ہوئے تشنج سے کسی قرحہ کے بھر جانے پر یا پلک ملانے والے پٹھوں کے تشنج سے؛ کمی والا چیرا جاتا ہے مگر نہیں سیا جاتا اور جلدی گوشت اگنے پر بھر جاتا ہے؛ غدہ، اضافی گوشت اور قرحہ کے اثر والے لوہے سے لیے جاتے ہیں؛ اور تشنج والا تشنج کے اپنے دونوں طرز پر علاج ہوتا ہے {cite:canon-ibn-sina-print-v2 p.195} {cite:canon-ibn-sina-print-v2 p.196}"
  es: "La eversión del párpado tiene tres tipos: primero, el párpado se contrae y no cubre la esclerótica (ya sea congénita o por un corte que golpea el párpado), y un ojo como este se llama ojo de liebre; segundo, el tipo intermedio, que no cubre parte de la esclerótica, llamado acortamiento del párpado, con la misma causa que el primero pero en menor medida; tercero, el párpado superior que no se cierra sobre el inferior, debido a una glándula, o a un crecimiento excesivo de tejido desde el inicio, o a una convulsión del párpado por una úlcera que cicatrizó en él, o a una convulsión de los músculos palpebrales; el tipo de acortamiento se corta, no se sutura, y cicatriza después de que crece el tejido cutáneo; los tipos de glándula, exceso de tejido y restos de úlcera se tratan con hierro; el tipo de convulsión se trata como convulsión en sus dos tipos {cite:canon-ibn-sina-print-v2 p.195} {cite:canon-ibn-sina-print-v2 p.196}"
  fr: "L'éversion de la paupière présente trois types: premièrement, la paupière se contracte et ne recouvre pas le blanc de l'œil – cela peut être congénital ou dû à une coupure – et l'œil ainsi formé est appelé œil de lièvre; deuxièmement, le type intermédiaire, où une partie du blanc de l'œil n'est pas recouverte, appelé paupière courte, avec la même cause que le premier, mais moins prononcée; troisièmement, la paupière supérieure ne se referme pas sur la paupière inférieure – cela peut être dû à une glande, à un excès de tissu adipeux initial, à une convulsion de la paupière consécutive à la cicatrisation d'un ulcère, ou à une convulsion des muscles plèvres; la paupière courte est incisée, non suturée, et guérit après la repousse des tissus; les types glandulaire, avec excès de tissu adipeux et résidu d'ulcère sont traités avec du fer; le type convulsif est traité comme les deux types de convulsions. {cite:canon-ibn-sina-print-v2 p.195} {cite:canon-ibn-sina-print-v2 p.196}"
