label:
  ar: طاعة ولاة الأمر وترك الخروج (في العقيدة الطحاوية)
  en: Obedience to those in authority and not rebelling (in the Tahawi creed)
summary:
  ar: 'موقف الطحاوي: لا خروج على الأئمة وولاة الأمر وإن جاروا، وطاعتهم من طاعة الله ما لم يأمروا بمعصية، والحج والجهاد ماضيان معهم.'
  en: 'al-Tahawi''s position: no rebelling against the imams and rulers even if they are unjust, obeying them is part of obeying God so long as they do not command disobedience, and the pilgrimage and jihad continue with them.'
