  stance:
    ar: لا خروج على الأئمة وإن جاروا، وطاعتهم ما لم يأمروا بمعصية
    en: No rebelling against the imams even if they are unjust, and obeying them so long as they do not command disobedience
  summary:
    ar: يقول الطحاوي إنه لا يرى الخروج على الأئمة وولاة الأمور وإن جاروا، وإن طاعتهم من طاعة الله فريضة ما لم يأمروا بمعصية، وإن الحج والجهاد ماضيان معهم.
