- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: الصلاة والجمعة والعيد خلف كل إمام برّاً كان أو فاجراً، وألا يُخرج عليهم بالسيف
    en: Prayer, Friday and festival prayers behind every imam, righteous or sinful, and not rebelling against them with the sword
  summary:
    ar: يذكر الأشعري أنهم يرون العيد والجمعة والجماعة خلف كل إمام برّ وفاجر، ويرون الدعاء لأئمة المسلمين بالصلاح، وألا يخرجوا عليهم بالسيف، وألا يقاتلوا في الفتنة.
    en: Al-Ash'ari reports they hold the festival, Friday and congregational prayers behind every imam, righteous or sinful, pray for the imams of the Muslims to be righteous, and that they do not rebel against them with the sword nor fight in civil strife.
