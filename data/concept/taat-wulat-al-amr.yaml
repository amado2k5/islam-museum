id: concept/taat-wulat-al-amr
education:
  did_you_know:
    ar: "موقف الطحاوي: لا خروج على الأئمة وإن جاروا، وطاعتهم من طاعة الله ما لم يأمروا بمعصية، والحج والجهاد ماضيان معهم."
    en: "Al-Tahawi's position: no rebellion against rulers even if they wrong; obeying them is part of obeying God unless they command sin — pilgrimage and striving go on under them."
    ur: "طحاوی کا موقف: حکمرانوں کے خلاف بغاوت نہیں خواہ وہ ظلم کریں؛ ان کی اطاعت اللہ کی اطاعت ہے جب تک معصیت نہ کہیں — حج اور جہاد ان کے ساتھ جاری رہتے ہیں۔"
    sources: [source/aqida-tahawiyya, source/lumat-al-itiqad]
class: concept
kind: doctrine
label:
  ar: طاعة ولاة الأمر وترك الخروج (في العقيدة الطحاوية)
  en: Obedience to those in authority and not rebelling (in the Tahawi creed)
summary:
  ar: 'موقف الطحاوي: لا خروج على الأئمة وولاة الأمر وإن جاروا، وطاعتهم من طاعة الله ما لم يأمروا بمعصية، والحج والجهاد ماضيان معهم.'
  en: 'al-Tahawi''s position: no rebelling against the imams and rulers even if they are unjust, obeying them is part of obeying God so long as they do not command disobedience, and the pilgrimage and jihad continue with them.'
