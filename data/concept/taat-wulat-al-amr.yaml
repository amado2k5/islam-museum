  id: lumat-al-itiqad
  stance:
    ar: السمع والطاعة لأمراء المؤمنين برهم وفاجرهم، وتجب طاعة من غلب بسيفه حتى صار الخليفة
    en: Hearing and obeying the commanders of the believers, righteous or sinful, and obeying whoever seizes the caliphate by his sword
  summary:
    ar: يقول ابن قدامة إن من السنة «السمع والطاعة لأئمة المسلمين وأمراء المؤمنين، برهم وفاجرهم، ما لم يأمروا بمعصية الله»، ويضيف أن من ولي الخلافة واجتمع عليه الناس ورضوا به، «أو غلبهم بسيفه حتى صار الخليفة، وسمي أمير المؤمنين، وجبت طاعته، وحرمت مخالفته، والخروج عليه»، وأن الحج والجهاد ماضيان مع طاعة كل إمام برّاً كان أو فاجراً.
    en: Ibn Qudama says it is of the sunna to hear and obey the imams of the Muslims and commanders of the believers, righteous or sinful, so long as they do not command disobedience to God, adding that whoever takes the caliphate with the people gathered on him and content with him, or overcomes them by his sword until he becomes caliph and is called commander of the believers, must be obeyed, and opposing him and rebelling are forbidden; the pilgrimage and jihad continue with every imam.
  holders:
  - person/ibn-qudama-al-maqdisi
  - work/lumat-al-itiqad
  evidence:
