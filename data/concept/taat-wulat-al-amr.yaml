  id: aqida-wasitiyya
  stance:
    ar: إقامة الحج والجهاد والجمعة والأعياد مع الأمراء أبراراً كانوا أو فجاراً
    en: Holding the pilgrimage, jihad, Friday prayer and festivals with the commanders, righteous or sinful
  summary:
    ar: يقول ابن تيمية إن أهل السنة «يرون إقامة الحج والجهاد والجمع والأعياد مع الأمراء أبراراً كانوا أو فجاراً»، ويأمرون بالمعروف وينهون عن المنكر على ما توجبه الشريعة، ولا يذكر في هذا الموضع حكم الخروج على الحاكم.
    en: Ibn Taymiyya says Ahl al-Sunna hold that the pilgrimage, jihad, Friday prayers and the festivals are held with the commanders, righteous or sinful, and enjoin the right and forbid the wrong as the law requires; he does not state a ruling on rebelling against the ruler in this passage.
  holders:
