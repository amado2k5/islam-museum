label:
  ar: "التعريض"
  en: "Ta'rid (allusion in speech: a veiled proposal in the waiting period, a charge of slander, protection of a Muslim from his pursuer, and a judge's allusion to retraction)"
  ur: "تعریض (اشارے سے بات کرنا: عدت میں رشتہ، قذف، اور رجوع کی طرف اشارہ)"
summary:
  ar: "التعريض ضد التصريح، وهو كلام يحتمل المعنى المقصود وغيره. وجوز الفقهاء التعريض بخطبة المعتدة عن وفاة بالإجماع، وللبائن عند المالكية والشافعية في الأظهر والحنابلة في قول، ومنعه الحنفية. ويحد المعرض بالقذف عند مالك إذا فهم بالقرائن، وعند الحنفية يعزر لا يحد، وعند الشافعية لا يكون قذفا إلا بالنية والاحتمال. ويجوز للمسلم التعريض لقتل من يطلبه ليرده إلى دار الكفر، ويعرض القاضي للمقر بالرجوع عند الشافعية في الصحيح، ويندب عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415}"
  en: "Ta'rid is allusion, the opposite of plain statement: speech that may carry the intended sense or another. A veiled proposal to a widow in her waiting period is lawful by agreement; to one divorced irrevocably the Malikis, the more known Shafii view and one Hanbali view allow it, while the Hanafis forbid it. Allusion to slander is punished by the hadd for the Malikis if the context shows it, by discipline only for the Hanafis, and for the Shafiis is slander only if meant and the words can bear it. One may allude to kill a seeker who would take a Muslim back to unbelief. The judge may allude to a confessor to retract, in the sounder Shafii view, and it is recommended by the Hanafis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415}"
