id: concept/tacrid-allusion
class: concept
kind: legal
label:
  ar: "التعريض"
  en: "Ta'rid (allusion in speech: a veiled proposal in the waiting period, a charge of slander, protection of a Muslim from his pursuer, and a judge's allusion to retraction)"
  ur: "تعریض ⁦(اشارے سے بات کرنا: عدت میں رشتہ، قذف، اور رجوع کی طرف اشارہ)⁩"
  es: "Ta'rid (alusión en el discurso: una propuesta velada durante el período de espera, una acusación de calumnia, la protección de un musulmán frente a su perseguidor y la alusión de un juez a la retractación)."
  fr: "Ta'rid (allusion verbale: proposition voilée pendant la période d'attente, accusation de diffamation, protection d'un musulman contre son poursuivant, et allusion d'un juge à la rétractation)"
summary:
  ar: "التعريض ضد التصريح، وهو كلام يحتمل المعنى المقصود وغيره. وجوز الفقهاء التعريض بخطبة المعتدة عن وفاة بالإجماع، وللبائن عند المالكية والشافعية في الأظهر والحنابلة في قول، ومنعه الحنفية. ويحد المعرض بالقذف عند مالك إذا فهم بالقرائن، وعند الحنفية يعزر لا يحد، وعند الشافعية لا يكون قذفا إلا بالنية والاحتمال. ويجوز للمسلم التعريض لقتل من يطلبه ليرده إلى دار الكفر، ويعرض القاضي للمقر بالرجوع عند الشافعية في الصحيح، ويندب عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415}"
  en: "Ta'rid is allusion, the opposite of plain statement: speech that may carry the intended sense or another. A veiled proposal to a widow in her waiting period is lawful by agreement; to one divorced irrevocably the Malikis, the more known Shafii view and one Hanbali view allow it, while the Hanafis forbid it. Allusion to slander is punished by the hadd for the Malikis if the context shows it, by discipline only for the Hanafis, and for the Shafiis is slander only if meant and the words can bear it. One may allude to kill a seeker who would take a Muslim back to unbelief. The judge may allude to a confessor to retract, in the sounder Shafii view, and it is recommended by the Hanafis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415}"
  es: "Ta'rid es alusión, lo opuesto a la declaración directa: discurso que puede transmitir el sentido intencionado u otro. Una propuesta velada a una viuda en su período de espera es lícita por acuerdo; a una persona divorciada irrevocablemente, los malikíes, la opinión shafií más conocida y una opinión hanbalí la permiten, mientras que los hanafíes la prohíben. La alusión a la calumnia se castiga con el hadd para los malikíes si el contexto lo indica, con la disciplina únicamente para los hanafíes, y para los shafiíes es calumnia solo si se pretende y las palabras pueden expresarla. Se puede insinuar la muerte de un buscador que pretenda llevar a un musulmán de vuelta a la incredulidad. El juez puede insinuar a un confesor que se retracte, según la opinión shafií más sólida, y es recomendado por los hanafíes y los hanbalíes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5412} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5413} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5414} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415}"
  fr: "Le ta'rid est une allusion, l'opposé d'une affirmation directe: un discours qui peut avoir le sens voulu ou un autre. Une demande en mariage voilée à une veuve pendant sa période d'attente est licite par consentement mutuel; à une personne divorcée irrévocablement, les Malikites, l'école shafi'ite (plus répandue) et une école hanbalite l'autorisent, tandis que les Hanafites l'interdisent. L'allusion à la calomnie est punie du hadd chez les Malikites si le contexte le suggère, d'une simple sanction disciplinaire chez les Hanafites, et chez les Shafi'ites, elle n'est considérée comme calomnieuse que si elle est intentionnelle et que les mots peuvent le supporter. On peut faire allusion à la mise à mort d'un chercheur qui ramènerait un musulman à l'incroyance. Le juge peut faire allusion à la rétractation d'un confesseur, selon l'école shafi'ite, plus rigoureuse, et cette pratique est recommandée par les Hanafites et les Hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5412} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5413} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5415}"
