id: concept/combined-deal-safqa
class: concept
kind: legal
label:
  ar: "الصَّفْقَة"
  en: "Safqa (the single deal: combining two things or two contracts in one transaction, and how the lawful and the unlawful within it are treated)"
summary:
  ar: "الصفقة في اللغة المرة من الصفق، وفي الاصطلاح العقد، وتصافق القوم تبايعوا. وإذا جمع في الصفقة بين شيئين يمتنع الجمع بينهما كالأختين بطل العقد فيهما، وإذا جمع بين شيئين قابلين للعقد وزع الثمن عليهما بالقيمة أو الأجزاء، وإذا جمع بين غير القابلين كالخمر والميتة بطل العقد باتفاق. وإذا اشتملت الصفقة على ما يجوز ومالا يجوز صح فيما يجوز بالقسط، وللحنفية والحنابلة والشافعية في الحالات التي لا قيمة لما لا يجوز فيها تفصيل. وإن جمع عقدين مختلفي الحكم كبيع وإجارة صح كل منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406}"
  en: "A safqa is one stroke of clapping and, in law, a contract; people who clap hands on a sale are said to have struck a deal. When a single deal joins two things that cannot be joined, such as two sisters in one marriage, the contract is void for both. When it joins two things each of which may be contracted, the price is shared between them by value or by parts. When it joins two things neither of which may be contracted, such as wine and carrion, the contract is void by agreement. When a deal joins what is lawful with what is not, it stands for the lawful part by its share of the price, and the schools differ where the unlawful part has no value, the Hanafis and Hanbalis in one way and the Shafi'is and Hanbalis in another. When it joins two contracts of different rules, such as sale and hire, each stands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406}"
