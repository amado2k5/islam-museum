label:
  ar: "الصَّفْقَة"
  en: "Safqa (the single deal: combining two things or two contracts in one transaction, and how the lawful and the unlawful within it are treated)"
  es: "Safqa (el acuerdo único: combinar dos cosas o dos contratos en una sola transacción, y cómo se tratan lo lícito y lo ilícito dentro de ella)"
  fr: "Safqa (l'accord unique: combinaison de deux choses ou de deux contrats en une seule transaction, et la manière dont le licite et l'illicite y sont traités)"
  ur: "صفا ⁦(ایک سودا: ایک لین دین میں دو چیزوں یا دو معاہدوں کو ملانا، اور اس میں حلال اور حرام کا کیا سلوک کیا جاتا ہے)⁩"
summary:
  ar: "الصفقة في اللغة المرة من الصفق، وفي الاصطلاح العقد، وتصافق القوم تبايعوا. وإذا جمع في الصفقة بين شيئين يمتنع الجمع بينهما كالأختين بطل العقد فيهما، وإذا جمع بين شيئين قابلين للعقد وزع الثمن عليهما بالقيمة أو الأجزاء، وإذا جمع بين غير القابلين كالخمر والميتة بطل العقد باتفاق. وإذا اشتملت الصفقة على ما يجوز ومالا يجوز صح فيما يجوز بالقسط، وللحنفية والحنابلة والشافعية في الحالات التي لا قيمة لما لا يجوز فيها تفصيل. وإن جمع عقدين مختلفي الحكم كبيع وإجارة صح كل منهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406}"
  en: "A safqa is one stroke of clapping and, in law, a contract; people who clap hands on a sale are said to have struck a deal. When a single deal joins two things that cannot be joined, such as two sisters in one marriage, the contract is void for both. When it joins two things each of which may be contracted, the price is shared between them by value or by parts. When it joins two things neither of which may be contracted, such as wine and carrion, the contract is void by agreement. When a deal joins what is lawful with what is not, it stands for the lawful part by its share of the price, and the schools differ where the unlawful part has no value, the Hanafis and Hanbalis in one way and the Shafi'is and Hanbalis in another. When it joins two contracts of different rules, such as sale and hire, each stands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406}"
  es: "Un safqa es un golpe de palmada y, en derecho, un contrato; se dice que quienes aplauden al cerrar una venta han cerrado un trato. Cuando un solo trato une dos cosas que no pueden unirse, como dos hermanas en un mismo matrimonio, el contrato es nulo para ambas. Cuando une dos cosas que pueden ser objeto de un contrato, el precio se reparte entre ellas por valor o por partes. Cuando une dos cosas que no pueden ser objeto de un contrato, como el vino y la carroña, el contrato es nulo por acuerdo. Cuando un trato une lo lícito con lo ilícito, representa a la parte lícita por su parte del precio, y las escuelas difieren en cuanto a si la parte ilícita tiene valor, los hanafíes y los hanbalíes de una manera y los shafiíes y los hanbalíes de otra. Cuando une dos contratos con reglas diferentes, como la compraventa y el alquiler, cada uno es válido. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10405} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406}"
  fr: "Une safqa est un simple claquement de mains et constitue, en droit, un contrat; les personnes qui claquent des mains lors d'une vente sont considérées comme ayant conclu un accord. Lorsqu'un accord unique unit deux choses incompatibles, comme deux sœurs par le mariage, le contrat est nul pour les deux. Lorsqu'il unit deux choses pouvant faire l'objet d'un contrat, le prix est partagé entre elles, soit en valeur, soit au prorata. Lorsqu'il unit deux choses incompatibles, comme le vin et la charogne, le contrat est nul par convention. Lorsqu'un accord unit ce qui est licite à ce qui ne l'est pas, la partie licite est maintenue à hauteur de sa part du prix. Les écoles juridiques divergent quant à la partie illicite: les hanafites et les hanbalites considèrent que cette partie est sans valeur, d'une part selon eux, et d'autre part selon les shafi'ites et les hanbalites. Lorsqu'il unit deux contrats aux règles différentes, comme la vente et la location, chacun est maintenu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10405} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10406}"
  ur: "صفا تالیاں بجانے کا ایک جھٹکا اور قانون کے مطابق ایک معاہدہ ہے۔ جو لوگ فروخت پر تالیاں بجاتے ہیں ان کے بارے میں کہا جاتا ہے کہ وہ ایک معاہدہ کر چکے ہیں۔ جب ایک سودا دو چیزیں جوڑتا ہے جو جوڑ نہیں سکتا، جیسے کہ ایک نکاح میں دو بہنیں، دونوں کا عقد باطل ہے۔ جب یہ دو چیزوں کو جوڑتا ہے جن میں سے ہر ایک کا معاہدہ کیا جا سکتا ہے، تو قیمت ان کے درمیان قدر یا حصوں کے لحاظ سے مشترک ہوتی ہے۔ جب اس میں دو چیزیں شامل ہو جائیں جن میں سے کوئی بھی معاہدہ نہیں کیا جا سکتا ہے، جیسے شراب اور مردار، تو معاہدہ کے ذریعہ عقد باطل ہے۔ جب کوئی سودا حلال کے ساتھ جوڑتا ہے تو اس کا حلال حصہ اس کی قیمت سے ہوتا ہے اور جہاں حرام کی کوئی قیمت نہیں وہاں مکاتب فکر میں اختلاف ہے، حنفیہ اور حنبلی ایک طرح سے اور شافعیہ اور حنبلی دوسرے میں۔ جب یہ مختلف قواعد کے دو معاہدوں میں شامل ہوتا ہے، جیسے کہ فروخت اور کرایہ پر، ہر ایک کھڑا ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10404} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10405}"
