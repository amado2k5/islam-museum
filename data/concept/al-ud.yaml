label: { ar: "العود", en: "The oud" }
summary:
  ar: "آلة الطرب الأولى في بلاط الخلفاء، وروى ابن خرداذبه للمعتمد أن أول من اتخذها لمك بن متوشلخ بن محويل بن عاد بن قاين بن آدم لمات له ابن يحبه فعلقه بشجرة حتى تقطعت أوصاله فأخذ خشباً فرققه وجعل صدر العود كالفخذ وعنقه كالساق ورأسه كالقدم والملاوي كالأصابع والأوتار كالعروق ثم ضرب به وناح عليه، واتخذ توبل لمك الطبول والدفوف وعملت ضلال بنت لمك المعازف واتخذ قوم لوط الطنابير، وقال الحمدوني وناطق بلسان لا ضمير له كأنه فخذ نيطت إلى قدم {cite:muruj-al-dhahab p. 588}."
  en: "The court's premier instrument — Lamak fashioned it on his dead son's limbs and played his lament, in Ibn Khurradadhbih's account to al-Mu'tamid {cite:muruj-al-dhahab p. 588}."
