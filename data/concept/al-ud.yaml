label: { ar: "العود", en: "The oud", fr: "Le oud", es: "El oud", ur: "عود", tr: "ud", id: "ud" }
summary:
  ar: "آلة الطرب الأولى في بلاط الخلفاء، وروى ابن خرداذبه للمعتمد أن أول من اتخذها لمك بن متوشلخ بن محويل بن عاد بن قاين بن آدم لمات له ابن يحبه فعلقه بشجرة حتى تقطعت أوصاله فأخذ خشباً فرققه وجعل صدر العود كالفخذ وعنقه كالساق ورأسه كالقدم والملاوي كالأصابع والأوتار كالعروق ثم ضرب به وناح عليه، واتخذ توبل لمك الطبول والدفوف وعملت ضلال بنت لمك المعازف واتخذ قوم لوط الطنابير، وقال الحمدوني وناطق بلسان لا ضمير له كأنه فخذ نيطت إلى قدم {cite:muruj-al-dhahab p. 588}."
  en: "The court's premier instrument — Lamak fashioned it on his dead son's limbs and played his lament, in Ibn Khurradadhbih's account to al-Mu'tamid {cite:muruj-al-dhahab p. 588}."
  fr: "Premier instrument de la cour, le oud aurait été façonné par Lamak sur le modèle des membres de son fils mort, puis joué pour accompagner sa plainte, d’après le récit d’Ibn Khurradadhbih à al-Mu‘tamid {cite:muruj-al-dhahab p. 588}."
  es: "El instrumento principal de la corte —Lamak lo fabricó con los miembros de su hijo muerto y tocó su lamento, según el relato de Ibn Khurradadhbih a al-Mu'tamid {cite:muruj-al-dhahab p. 588}."
  ur: "عدالت کا سب سے بڑا آلہ - لامک نے اسے اپنے مردہ بیٹے کے اعضاء پر بنایا اور اس کا نوحہ بجایا، ابن خرد الذہبیح کے بیان میں المتمید کے حوالے سے {حوالہ: مروج الذہب صفحہ 588}۔"
  tr: "Halifelerin sarayındaki ilk müzik aleti. İbn Khordadbeh, Al-Mu'tamid'e ilk benimseyenin Mak ibn Mutushalkh ibn 'Ad ibn 'Ad ibn Qayin ibn Adam için olduğunu, oğlu olduğunda sevdiğini ve onu uzuvları kesilene kadar ağaca astığına kadar olduğunu anlattı. Bir tahta parçası aldı, yardı ve lutun göğsünü uyluk gibi, boynunu buzağı, başını ayak gibi, pençelerini parmak ve telleri damar gibi yaptı. Sonra ona vurdu ve üzerine ağladı. Davulları ve tefleri Mak için aldı, Dul bint Lamk enstrümanları yaptı, Lut halkı davulları aldı. Al-Hamduni, vicdansız bir dille konuşarak, ayağa eğilmiş bir uyluk gibi olduğunu söyledi {cite:muruj-al-dhahab, s. 588}."
  id: "Alat musik pertama di istana khalifah. Ibn Khordadbeh memberitahu Al-Mu'tamid bahwa yang pertama mengadopsinya adalah karena Mak ibn Mutushalkh ibn 'Ad ibn 'Ad ibn Qayin ibn Adam, bahwa ia mencintainya saat memiliki seorang putra dan menggantungnya di pohon hingga anggota tubuhnya terputus. Ia mengambil sepotong kayu, membantunya, dan membuat dada kecapi seperti paha, lehernya seperti anak sapi, kepalanya seperti kaki, cakarnya seperti jari, dan kawatnya seperti pembuluh darah. Kemudian ia memukulnya dan menangis di atasnya. Ia mengambil drum dan tamborin untuk Mak, Dul bint Lamk membuat alat musik itu, dan rakyat Lot mengambil genderang. Al-Hamduni, berbicara dengan nada tanpa hati, mengatakan bahwa itu seperti paha yang ditekuk ke kaki {cite:muruj-al-dhahab, hlm. 588}."
