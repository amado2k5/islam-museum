id: concept/badhruj
class: concept
kind: natural
label:
  ar: "باذروج"
  en: "Badhruj (the book's al-hawk)"
  fr: "Badhruj (l’al-hawk du livre)"
  ur: "باذروج"
  es: "Badhruj (el al-halcón del libro)"
summary:
  ar: "الكتاب يسمّيه الحوك، وهو معروف، ودهنه في قوة دهن المرزنجوش لكنه أضعف، وفيه قوى متضادة: قابض ومسهّل، محلّل ومولّد للسوداء، ينفع الرعاف والضربان في العين، ويقوّي القلب {cite:canon-ibn-sina-print-v1 p.403}، {cite:canon-ibn-sina-print-v1 p.404}."
  en: "The book calls it al-hawk, a well-known herb. Its oil is like marjoram oil but weaker, and it has opposing powers: astringent and laxative, dissolving but producing black bile. It helps nosebleed and throbbing of the eye, and strengthens the heart {cite:canon-ibn-sina-print-v1 p.403}, {cite:canon-ibn-sina-print-v1 p.404}."
  fr: "Le livre le nomme al-hawk, herbe connue. Son huile ressemble à celle de marjolaine, mais plus faible ; ses pouvoirs sont opposés : astringent et laxatif, résolutif mais producteur de bile noire. Il est dit utile aux saignements de nez, aux élancements de l’œil et au renforcement du cœur {cite:canon-ibn-sina-print-v1 p.403}, {cite:canon-ibn-sina-print-v1 p.404}."
  ur: "کتاب اسے الحوک کہتی ہے، جو معروف ہے۔ اس کا تیل مرزنجوش کے تیل جیسا مگر کمزور ہے، اور اس میں متضاد قوتیں ہیں: قابض اور مسہل، تحلیل کرنے والا اور سودا پیدا کرنے والا۔ یہ ناک سے خون بہنے اور آنکھ کی دھڑکن میں مفید ہے، اور دل کو قوت دیتا ہے {cite:canon-ibn-sina-print-v1 p.403}، {cite:canon-ibn-sina-print-v1 p.404}۔"
  es: "El libro la denomina al-hawk, una hierba muy conocida. Su aceite es similar al de mejorana, pero más débil, y posee propiedades opuestas: astringente y laxante, disuelve pero produce bilis negra. Ayuda con las hemorragias nasales y el dolor punzante en los ojos, y fortalece el corazón {cite:canon-ibn-sina-print-v1 p.403}, {cite:canon-ibn-sina-print-v1 p.404}."
