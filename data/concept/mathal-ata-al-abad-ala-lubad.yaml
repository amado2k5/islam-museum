id: concept/mathal-ata-al-abad-ala-lubad
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "مثل «أتى الأبد على لبد»"
  en: "The proverb 'Eternity has overtaken Lubad'"
  ur: "مثل «أتی الابد علی لبد»"
  fr: "Le proverbe « L'éternité a rattrapé Lubad »"
  es: "El proverbio «La eternidad alcanzó a Lubad»"
  tr: "Mesela \"Lebad'ın üzerine sonsuzluk geldi\""
  id: "Seperti \"Keabadian datang kepada Lebad\""
summary:
  ar: "مثل يُضرب في أن لا شيء يبقى أمام الزمن، وقصته أن لبداً آخر نسور لقمان بن عاد مات فانتهى عمر لقمان معه {cite:islamport-5454-58}."
  en: "A proverb for the thought that nothing outlasts time; its tale is that Lubad, the last of Luqman ibn Ad's eagles, died and Luqman's own life ended with it {cite:islamport-5454-58}."
  ur: "وہ مثل جو اس بات کے لیے کہی جاتی ہے کہ وقت کے آگے کچھ نہیں ٹکتا؛ اس کا قصہ یہ ہے کہ لقمان بن عاد کے آخری گدھ لبد کی موت کے ساتھ لقمان کی عمر بھی ختم ہو گئی {cite:islamport-5454-58}۔"
  fr: "Proverbe qui dit que rien ne dure devant le temps ; son histoire est que Lubad, le dernier des aigles de Luqman ibn Ad, mourut et que la vie de Luqman s'acheva avec lui {cite:islamport-5454-58}."
  es: "Proverbio que dice que nada perdura ante el tiempo; su relato es que Lubad, el último de las águilas de Luqman ibn Ad, murió y con él acabó la vida de Luqman {cite:islamport-5454-58}."
  tr: "Bir söz vardır: Zamandan önce hiçbir şey kalmaz ve hikayesi şudur: Luqman ibn 'Ad'ın son kartalı öldüğünde, Luqman'ın hayatı onunla sona ermiştir {cite:islamport-5454-58}."
  id: "Ada pepatah bahwa tidak ada yang tersisa sebelum waktu, dan kisahnya adalah ketika elang terakhir Luqman ibn 'Ad meninggal, hidup Luqman berakhir bersamanya {cite:islamport-5454-58}."
