id: concept/lips-shafa
class: concept
kind: legal
label:
  ar: "الشَّفَة"
  en: "Shafa (the lip: washing it in purification, the blood money for the lips, and the drinking of water)"
summary:
  ar: "الشفة طبقة الفم من الإنسان، وتتعلق بها أحكام غسلها في الوضوء والغسل، فظاهر الشفتين يجب غسله عند الجمهور، وما ينكتم عند انضمامهما تبع للفم فيسن غسله، بينما يوجبه الحنابلة وكذا الحنفية في الغسل. والجناية على الشفتين عمدا فيها القصاص، وخطأ فيها دية كاملة للشفتين، ونصفها لكل شفة، وفي رواية للحنابلة الثلث للعليا والثلثان للسفلى. وشفة بمعنى الشرب: للمياه أحكام الانتفاع المشترك بحسب نوعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10143} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10144}"
  en: "The shafa is the lining of the mouth. Several rulings attach to it. Washing the outer part of the lips is required in purification, while what is hidden when they close is part of the mouth and is recommended, though the Hanbalis and, for the full bath, the Hanafis require it. Deliberate injury to the lips carries retaliation; by mistake it carries full blood money for both lips, half for each, and in one Hanbali report a third for the upper lip and two thirds for the lower. In the sense of drinking, rules for water as shared use depend on its kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10143} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10144}"
