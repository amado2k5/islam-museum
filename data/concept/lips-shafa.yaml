id: concept/lips-shafa
class: concept
kind: legal
label:
  ar: "الشَّفَة"
  en: "Shafa (the lip: washing it in purification, the blood money for the lips, and the drinking of water)"
  es: "Shafa (el labio: lavarlo en purificación, el dinero de sangre para los labios y beber agua)"
  fr: "Shafa (la lèvre: la laver en guise de purification, l'offrande du sang pour les lèvres et la consommation d'eau)"
  ur: "شفاء ⁦(ہونٹ: اسے طہارت میں دھونا، ہونٹوں کا خون اور پانی پینا)⁩"
summary:
  ar: "الشفة طبقة الفم من الإنسان، وتتعلق بها أحكام غسلها في الوضوء والغسل، فظاهر الشفتين يجب غسله عند الجمهور، وما ينكتم عند انضمامهما تبع للفم فيسن غسله، بينما يوجبه الحنابلة وكذا الحنفية في الغسل. والجناية على الشفتين عمدا فيها القصاص، وخطأ فيها دية كاملة للشفتين، ونصفها لكل شفة، وفي رواية للحنابلة الثلث للعليا والثلثان للسفلى. وشفة بمعنى الشرب: للمياه أحكام الانتفاع المشترك بحسب نوعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10143} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10144}"
  en: "The shafa is the lining of the mouth. Several rulings attach to it. Washing the outer part of the lips is required in purification, while what is hidden when they close is part of the mouth and is recommended, though the Hanbalis and, for the full bath, the Hanafis require it. Deliberate injury to the lips carries retaliation; by mistake it carries full blood money for both lips, half for each, and in one Hanbali report a third for the upper lip and two thirds for the lower. In the sense of drinking, rules for water as shared use depend on its kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10143} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10144}"
  es: "El shafa es el revestimiento de la boca. Varias normas se aplican a él. El lavado de la parte externa de los labios es obligatorio en la purificación, mientras que lo que queda oculto al cerrarlos forma parte de la boca y se recomienda, aunque los hanbalíes y, para el baño completo, los hanafíes lo exigen. Una lesión deliberada en los labios conlleva represalias; por error, conlleva una indemnización completa por ambos labios, la mitad para cada uno, y en un informe hanbalí, un tercio para el labio superior y dos tercios para el inferior. En cuanto a beber, las normas para el agua como uso compartido dependen de su tipo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10143} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10144}"
  fr: "Le shafa désigne la muqueuse buccale. Plusieurs règles s'y rattachent. Le lavage de la partie extérieure des lèvres est requis pour la purification, tandis que la partie cachée lorsqu'elles sont fermées fait partie de la bouche et son lavage est recommandé, bien que les Hanbalites et, pour le bain complet, les Hanafites l'exigent. Toute blessure intentionnelle aux lèvres entraîne des représailles; une blessure accidentelle entraîne le paiement de la totalité du prix du sang pour les deux lèvres, la moitié pour chacune, et, selon un hadith hanbalite, un tiers pour la lèvre supérieure et deux tiers pour la lèvre inférieure. En ce qui concerne l'eau, les règles relatives à son usage partagé dépendent de sa nature. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10142} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10143} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10144}"
  ur: "شفاء منہ کی پرت ہے۔ اس کے ساتھ کئی احکام منسلک ہیں۔ ہونٹوں کے بیرونی حصے کا دھونا طہارت میں ضروری ہے، جب کہ بند ہونے پر جو چھپا ہوا ہے وہ منہ کا حصہ ہے اور مستحب ہے، حالانکہ حنبلی اور احناف کے نزدیک مکمل غسل واجب ہے۔ ہونٹوں کو جان بوجھ کر چوٹ لگنے سے انتقامی کارروائی ہوتی ہے۔ غلطی سے اس میں دونوں ہونٹوں کے لیے پورا خون ہوتا ہے، ہر ایک کے لیے آدھا، اور ایک حنبلی میں ایک تہائی اوپری ہونٹ کے لیے اور دو تہائی نچلے کے لیے ہے۔ پینے کے معنی میں، مشترکہ استعمال کے طور پر پانی کے قواعد اس کی نوعیت پر منحصر ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10142} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10143}"
