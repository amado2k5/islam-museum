label: { ar: "وقت الاستفراغ والنضج عند ابن سينا", en: "The timing of evacuation and ripening in the Canon", ur: "استفراغ کا وقت اور نضج قانون میں" }
summary:
  ar: "يبين ابن سينا أن وقت الاستفراغ يراعى فيه النضج: ففي المزمنة ينتظر النضج لا غير ويسقى قبل الاستفراغ من الملطفات، وفي الحادة الأصوب انتظاره خصوصاً إن كانت ساكنة، فإن كانت متحركة فالبدار إلى استفراغها أولى، والمادة الغليظة لا تحرك إلا بعد الترقيق {cite:canon-ibn-sina-print-v1 pp.274-275}."
  en: "Ibn Sina shows that the time of evacuation turns on ripening: in chronic diseases only ripening is awaited and attenuants are given before evacuating; in acute ones waiting is also wiser, especially if the matter is quiet, but if it is moving, quick evacuation is better, and thick matter is not stirred until it has been thinned {cite:canon-ibn-sina-print-v1 pp.274-275}."
