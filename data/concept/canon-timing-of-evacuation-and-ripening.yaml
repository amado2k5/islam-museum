id: concept/canon-timing-of-evacuation-and-ripening
class: concept
kind: scientific
label: { ar: "وقت الاستفراغ والنضج عند ابن سينا", en: "The timing of evacuation and ripening in the Canon", ur: "استفراغ کا وقت اور نضج قانون میں", es: "El momento de la evacuación y la maduración en el Canon", fr: "Le calendrier d'évacuation et de maturation dans le Canon" }
summary:
  ar: "يبين ابن سينا أن وقت الاستفراغ يراعى فيه النضج: ففي المزمنة ينتظر النضج لا غير ويسقى قبل الاستفراغ من الملطفات، وفي الحادة الأصوب انتظاره خصوصاً إن كانت ساكنة، فإن كانت متحركة فالبدار إلى استفراغها أولى، والمادة الغليظة لا تحرك إلا بعد الترقيق {cite:canon-ibn-sina-print-v1 pp.274-275}."
  en: "Ibn Sina shows that the time of evacuation turns on ripening: in chronic diseases only ripening is awaited and attenuants are given before evacuating; in acute ones waiting is also wiser, especially if the matter is quiet, but if it is moving, quick evacuation is better, and thick matter is not stirred until it has been thinned {cite:canon-ibn-sina-print-v1 pp.274-275}."
  es: "Ibn Sina muestra que el momento de la evacuación depende de la maduración: en las enfermedades crónicas solo se espera la maduración y se administran atenuantes antes de evacuar; en las agudas también es más prudente esperar, especialmente si la materia está tranquila, pero si se mueve, es mejor una evacuación rápida y la materia espesa no se remueve hasta que se haya diluido {cite:canon-ibn-sina-print-v1 pp.274-275}."
  fr: "Ibn Sina montre que le moment de l'évacuation dépend de la maturation: dans les maladies chroniques, on attend seulement la maturation et on administre des atténuants avant l'évacuation; dans les maladies aiguës, il est également plus sage d'attendre, surtout si la matière est calme, mais si elle est en mouvement, une évacuation rapide est préférable, et la matière épaisse n'est pas remuée jusqu'à ce qu'elle ait été diluée {cite:canon-ibn-sina-print-v1 pp.274-275}."
  ur: "ابن سینا سے پتہ چلتا ہے کہ انخلاء کا وقت پکنے پر بدل جاتا ہے: دائمی بیماریوں میں صرف پکنے کا انتظار کیا جاتا ہے اور انخلاء سے پہلے توجہ دی جاتی ہے۔ شدید لوگوں میں انتظار کرنا بھی زیادہ دانشمندی ہے، خاص طور پر اگر معاملہ خاموش ہو، لیکن اگر یہ حرکت کر رہا ہو، تو جلدی نکالنا بہتر ہے، اور موٹی چیز کو اس وقت تک ہلایا نہیں جاتا جب تک کہ اسے پتلا نہ کر دیا جائے۔"
