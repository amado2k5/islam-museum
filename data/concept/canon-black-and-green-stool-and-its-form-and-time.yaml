id: concept/canon-black-and-green-stool-and-its-form-and-time
class: concept
kind: scientific
label:
  ar: "البراز الأسود والأخضر وهيئته ووقته عند ابن سينا"
  en: "Black and green stool, and its form and timing, in the Canon"
  fr: "Selles noires et vertes, forme et moment dans le Canon"
  ur: "سیاہ اور سبز فضلہ، اس کی شکل اور وقت قانون میں"
  es: "Taburete negro y verde, y su forma y momento, en el Canon"
summary:
  ar: "يذكر ابن سينا أن البراز الأسود يدل مثل البول الأسود على احتراق شديد أو نضج مرض سوداوي أو تناول صابغ أو مسهل للسوداء، وأن الأخضر يدل على انطفاء الغريزة، ثم هيئة البراز ووقته وصفة أفضله. {cite:canon-ibn-sina-print-v1 p.199}."
  en: "Ibn Sina says black stool shows, like black urine, intense burning, the maturing of a black-bile illness, a dye taken in, or a drink that purges black bile; green shows the quenching of the innate heat; then he turns to its form, timing and the best stool. {cite:canon-ibn-sina-print-v1 p.199}."
  fr: "Ibn Sina attribue aux selles noires, comme à l’urine noire, une combustion intense, la maturation d’une maladie atrabilaire, une teinture ingérée ou un purgatif de bile noire ; aux vertes, l’extinction de la chaleur innée. Il examine ensuite forme, moment et meilleure qualité des selles. {cite:canon-ibn-sina-print-v1 p.199}."
  es: "Ibn Sina afirma que las heces negras indican, al igual que la orina negra, una intensa sensación de ardor, la maduración de una enfermedad biliar negra, la ingesta de un tinte o una bebida que purga la bilis negra; las heces verdes indican la disminución del calor interno; luego se centra en su forma, el momento adecuado para su aparición y las mejores heces. {cite:canon-ibn-sina-print-v1 p.199}."
