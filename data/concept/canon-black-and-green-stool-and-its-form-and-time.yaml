summary:
  ar: "يذكر ابن سينا أن البراز الأسود يدل مثل البول الأسود على احتراق شديد أو نضج مرض سوداوي أو تناول صابغ أو مسهل للسوداء، وأن الأخضر يدل على انطفاء الغريزة، ثم هيئة البراز ووقته وصفة أفضله. {cite:canon-ibn-sina-print-v1 p.199}."
  en: "Ibn Sina says black stool shows, like black urine, intense burning, the maturing of a black-bile illness, a dye taken in, or a drink that purges black bile; green shows the quenching of the innate heat; then he turns to its form, timing and the best stool. {cite:canon-ibn-sina-print-v1 p.199}."
