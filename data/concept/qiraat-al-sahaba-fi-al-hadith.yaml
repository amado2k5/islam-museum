id: concept/qiraat-al-sahaba-fi-al-hadith
class: concept
kind: term
label:
  ar: قراءات الصحابة في الحديث والأثر
  en: The Companions' readings as reported in hadith and reports
  ur: صحابہ کی قراءتیں حدیث اور آثار میں
  es: "Las lecturas de los Compañeros según se recogen en hadices e informes."
summary:
  ar: "تذكر كتب الحديث والقراءات خلافات بين الصحابة في أداء آيات ثم عرضها على النبي، ومنها ما رُوي عن ابن مسعود وأبي بن كعب وابن عباس وعائشة وحفصة؛ وفيها قراءات تفسيرية أو منسوخة لم تدخل المصاحف العثمانية {cite:nashr-dahman-damascus-1345-v1 p. 16} {cite:manahil-irfan-sabt p. 158} {cite:muwatta-maruf-1997 p.200}."
  en: "The books of hadith and of the readings record disagreements among the Companions over how to deliver verses, and how they were put to the Prophet, including what is reported from Ibn Mas'ud, Ubayy ibn Ka'b, Ibn Abbas, A'isha and Hafsa; some are explanatory or abrogated readings that did not enter the Uthmanic codices {cite:nashr-dahman-damascus-1345-v1 p. 16} {cite:manahil-irfan-sabt p. 158} {cite:muwatta-maruf-1997 p.200}."
  ur: "حدیث اور قراءات کی کتابیں صحابہ کے درمیان آیات کی ادا میں اختلافات اور ان کے نبی کے سامنے پیش ہونے کا ذکر کرتی ہیں، ان میں ابن مسعود، ابی بن کعب، ابن عباس، عائشہ اور حفصہ سے مروی باتیں بھی ہیں؛ بعض تفسیری یا منسوخ قراءتیں ہیں جو مصاحفِ عثمانیہ میں داخل نہ ہوئیں {cite:nashr-dahman-damascus-1345-v1 p. 16} {cite:manahil-irfan-sabt p. 158} {cite:muwatta-maruf-1997 p.200}۔"
  es: "Los libros de hadices y de lecturas registran desacuerdos entre los Compañeros sobre cómo transmitir los versículos y cómo se los presentaron al Profeta, incluyendo lo que se reporta de Ibn Mas'ud, Ubayy ibn Ka'b, Ibn Abbas, A'isha y Hafsa; algunas son lecturas explicativas o abrogadas que no se incluyeron en los códices utmánicos {cite:nashr-dahman-damascus-1345-v1 p. 16} {cite:manahil-irfan-sabt p. 158} {cite:muwatta-maruf-1997 p.200}."
