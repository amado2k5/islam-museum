id: concept/buyut-al-kawakib
class: concept
kind: belief
label: { ar: "البيوت المعظمة على أسماء الكواكب", en: "The temples of the seven planets" }
summary:
  ar: "ذهب قوم عند المسعودي إلى أن من البيوت السبعة المعظمة المتخذة على أسماء الكواكب البيت الحرام وقالوا إنه بيت زحل ولذلك طال بقاؤه لأن زحل من شأنه البقاء، وبيت مارس على جبل بأصبهان جعله يستاسف بيست ناره، وبيت مندوسان بالهند وفيه أحجار المغناطيس، والنوبهار ببلخ بناه منوشهر على اسم القمر وسدنته البرامكة سمة لكل من يليها، وبيت غمدان بصنعاء بناه الضحاك على اسم الزهرة، وقد اتخذت هذه الأمم للكواكب أصناماً وتماثيل على صورها وبنوا لكل صنم بيتاً وهيكلاً لما رأوا الكواكب تخفى فأمرهم حكماؤهم بذلك {cite:muruj-al-dhahab p. 537-539}."
  en: "The report that seven great houses were raised to the planets — the Ka'ba named Saturn's for its endurance, Isfahan's Maris, India's magnet-shrine Mandusan, Manushihr's lunar Nawbahar at Balkh whose wardens took the title Barmak, and al-Dahhak's Venus-temple Ghumdan at San'a' — each idol-house built when the stars were seen to hide {cite:muruj-al-dhahab p. 537-539}."
