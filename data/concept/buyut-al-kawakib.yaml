label:
  ar: "البيوت المعظمة على أسماء الكواكب"
  en: "The temples of the seven planets"
  fr: "Les temples des sept planètes"
  es: "Los templos de los siete planetas"
  ur: "سات سیاروں کے مندر"
  tr: "Gezegenlerin İsimleriyle Onurlandırılan Evler"
  id: "Rumah-rumah yang dihormati dengan nama-nama planet"
summary:
  ar: "ذهب قوم عند المسعودي إلى أن من البيوت السبعة المعظمة المتخذة على أسماء الكواكب البيت الحرام وقالوا إنه بيت زحل ولذلك طال بقاؤه لأن زحل من شأنه البقاء، وبيت مارس على جبل بأصبهان جعله يستاسف بيست ناره، وبيت مندوسان بالهند وفيه أحجار المغناطيس، والنوبهار ببلخ بناه منوشهر على اسم القمر وسدنته البرامكة سمة لكل من يليها، وبيت غمدان بصنعاء بناه الضحاك على اسم الزهرة، وقد اتخذت هذه الأمم للكواكب أصناماً وتماثيل على صورها وبنوا لكل صنم بيتاً وهيكلاً لما رأوا الكواكب تخفى فأمرهم حكماؤهم بذلك {cite:muruj-al-dhahab p. 537-539}. وفي عدّ ابن فضل الله العمري عن البكري: بيت إصطخر للمشتري، وبيت مندرسان بالهند للمريخ، وبيت كأوسان بفرغانة للشمس هدمه المعتصم، وبيت تمدان بصنعاء بناه الضحاك للزهرة وخربه عثمان بن عفان فصار مكانه بركة، وبيت بأعلى الصين لعطارد سبعة أبيات في كل بيت سبع كوى تقابل كل كوة صورة كوكب من الخمسة والعشرين، والنوبهار ببلخ للقمر {cite:umari-masalik-1924 p. 222-224}."
  en: "The report that seven great houses were raised to the planets — the Ka'ba named Saturn's for its endurance, Isfahan's Maris, India's magnet-shrine Mandusan, Manushihr's lunar Nawbahar at Balkh whose wardens took the title Barmak, and al-Dahhak's Venus-temple Ghumdan at San'a' — each idol-house built when the stars were seen to hide {cite:muruj-al-dhahab p. 537-539}."
  fr: "Récit de sept grandes maisons élevées aux planètes : Kaaba attribuée à Saturne pour sa durée, Maris d’Ispahan, sanctuaire magnétique Mandusan d’Inde, Nawbahar lunaire de Manushihr à Balkh dont les gardiens portaient le titre Barmak, et Ghumdan de Vénus bâti par al-Dahhak à Sanaa. Les maisons des idoles auraient été construites parce que les astres disparaissaient {cite:muruj-al-dhahab p. 537-539}."
  es: "El informe dice que se erigieron siete grandes casas a los planetas: la Kaaba llamada de Saturno por su resistencia, Maris de Isfahán, el santuario magnético de Mandusan en la India, el Nawbahar lunar de Manushihr en Balkh cuyos guardianes adoptaron el título de Barmak, y el templo de Venus de al-Dahhak, Ghumdan en Saná, cada casa de ídolos construida cuando se veía que las estrellas se ocultaban {cite:muruj-al-dhahab p. 537-539}."
  ur: "یہ رپورٹ کہ سیاروں پر سات عظیم مکانات اٹھائے گئے - کعبہ کو اس کی برداشت کے لیے زحل کا نام دیا گیا، اصفہان کا مارس، ہندوستان کا مقناطیسی مزار مندوسان، بلخ میں منوشہر کا قمری نوبہار جس کے وارڈنز نے برمک کا لقب اختیار کیا، اور الضحاک کا زہرہ کا مندر گھمدان - جب سنید میں ستارے کے گھر بنائے گئے تو ہر ایک کو دیکھا گیا۔ {حوالہ: مروج الذہب ص۱۴۲۔ 537-539}۔"
  tr: "Al-Mas'udi'ye göre bazı kişiler, gezegenlerin adını taşıyan yedi saygın evden Kutsal Ev olduğuna inanıyor ve bunun Satürn'ün evi olduğunu söylüyorlardı; bu yüzden uzun süre varlığını sürdürdü çünkü Satürn kalıcı olmaya mahkumdur. İsfahan Dağı'nda Mars'ın ateşinden en iyi pişmanlık duymasına neden olan bir ev vardır; Hindistan'daki Mandosan evi, manyetik taşlar içerir; Balkh'taki Nubahar, ay sonrası Manuşahr tarafından inşa edilmiş ve koruyucuları, onu takip eden herkes için bir semboldür; ve Sana'a'daki Ghamdan Evi, Venüs'ten sonra Al-Dahhak tarafından inşa edilmiştir. Bu uluslar, yıldızların heykellerini ve heykellerini kendi biçimlerinde alıp her put için bir ev ve tapınak inşa ettiler. Yıldızları gizlediklerinde, bilge adamları onlara bunu yapmalarını emrettiler {cite:muruj-al-dhahab, s. 537-539}. İbn Fadlallah el-Umari'nin el-Bakıri'den sayısında: Adalet için İstahr evi, Mars için Hindistan'da bir Mandarsan evi, güneş için Fergana'daki Awsan gibi bir ev, el-Mu'tasim tarafından yıkılmış güneş için Fergan'daki Awsan gibi bir ev, Venüs için al-Dahhak tarafından inşa edilen ve Uthman ibn Affan tarafından yıkılmış Sana'a'daki Tamdan'daki bir ev, yeri bir nimet haline getirmiş, Merkür'ün üst Çin'inde yedi ayetli bir ev, her evde yedi sokak, her yıldız yirmi beşten bir gezegenin görüntüsüne karşılık gelir ve Balkh'taki ay için el-Nubahar {cite:umari-masalik-1924, s. 222-224}."
  id: "Beberapa orang menurut Al-Mas'udi percaya bahwa di antara tujuh rumah terhormat yang dinamai menurut planet adalah Rumah Suci, dan mereka mengatakan itu adalah rumah Saturnus, itulah sebabnya rumah itu bertahan lama karena Saturnus ditakdirkan untuk bertahan. Ada sebuah rumah Mars di Gunung Isfahan yang membuatnya menyesali api terbaiknya; rumah Mandosan di India, yang mengandung batu magnetik; Nubahar di Balkh, dibangun oleh Manushahr setelah bulan, dan penjaganya menjadi simbol bagi semua yang mengikutinya; dan Rumah Ghamdan di Sana'a, dibangun oleh Al-Dahhak setelah Venus. Bangsa-bangsa ini mengambil patung dan patung bintang dalam bentuknya dan membangun sebuah rumah serta kuil untuk setiap patung. Ketika mereka melihat bintang-bintang tersembunyi, orang bijak mereka memerintahkan mereka untuk melakukannya {cite:muruj-al-dhahab, hlm. 537-539}. Dalam count Ibn Fadlallah al-Umari: sebuah rumah Istakhr untuk Justitor, sebuah rumah Mandarsan di India untuk Mars, sebuah rumah seperti Awsan di Ferghana untuk matahari yang dihancurkan oleh al-Mu'tasim, sebuah rumah di Tamdan di Sana'a yang dibangun oleh al-Dahhak untuk Venus dan dihancurkan oleh Uthman ibn Affan, menjadikan tempatnya sebagai berkat, sebuah rumah di Tiongkok atas Merkurius dengan tujuh bait, setiap rumah dengan tujuh gang, setiap bintang, yang sesuai dengan gambar planet dari dua puluh lima, dan al-Nubahar di Balkh untuk bulan {cite:umari-masalik-1924, hlm. 222-224}."
