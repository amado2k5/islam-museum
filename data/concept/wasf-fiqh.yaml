  id: "deskripsi"
summary:
  ar: "الوصف في اللغة النعت، ويقال وصف الطبيب الدواء إذا عيّنه باسمه ومقداره. وفي الاصطلاح عبارة عمّا دلّ على الذات باعتبار معنى مقصود، أو ما دل على ذات بصفة. وعند الأصوليين تقييد لفظ مشترك المعنى بلفظ آخر مختص غير شرط ولا غاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264} يصح البيع بالوصف عند جمهور الفقهاء كما يصح بالرؤية لأنه يفيد العلم بالمعقود عليه؛ وعند الشافعية في الأظهر لا يصح بيع الغائب الذي لم يره المشتري ولو وُصف، للنهي عن بيع الغرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264} وفي المسلم فيه يشترط أن يكون ديناً موصوفاً في الذمة بما ينضبط به، وصرح الشافعية بوجوب ذكر الأوصاف في صيغة العقد فلا يصح ذكرها بعده ولو في المجلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} وعند الأصوليين إضافة الحكم إلى وصف مناسب تُفهم منه علّية الوصف للحكم، كإضافة القطع إلى السرقة، ويسمّى إيماءً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} ومفهوم الصفة: تعليق الحكم على الذات بأحد أوصافها، فالشافعي ومالك والأكثرون يرون دلالته على نفي الحكم عما عداه، وأبو حنيفة وجماعة من المالكية والشافعية منهم الغزالي يرون أنه لا ينفيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265}"
  en: "Wasf in the lexicon is description, and to describe a thing is to name it; a doctor describes a medicine when he names it and gives its dose. Technically it is a term for what points to an essence by a meaningful attribute; for the usulis it restricts a word of shared meaning by another, specific word that is neither a condition nor an end. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264} Most jurists hold that a sale by description is valid as a sale by sight, since description gives knowledge of the object; in the preferred Shafi'i view the sale of an absent object not seen by the buyer is not valid, even if described at length, because of the prohibition on uncertain sales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264} In a salam contract the goods must be described as a debt in the buyer's favour by attributes that fix them, and the Shafi'is require the attributes to be named in the contract itself, not after it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} In usul, attaching a ruling to a fitting attribute shows that attribute to be its cause, which is called an allusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} The concept of the attribute (mafhum al-sifa) means that a ruling tied to one attribute of a thing is read by Shafi'i, Malik and most as excluding the ruling from what lacks it; Abu Hanifa and a group of Malikis and Shafi'is, including al-Ghazali, deny that. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265}"
  es: "Wasf en el léxico es descripción, y describir algo es nombrarlo; un médico describe un medicamento cuando lo nombra y da su dosis. Técnicamente es un término para lo que apunta a una esencia mediante un atributo significativo; para los usulis restringe una palabra de significado compartido por otra palabra específica que no es ni una condición ni un fin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264} La mayoría de los juristas sostienen que una venta por descripción es válida como una venta por vista, ya que la descripción da conocimiento del objeto; en la opinión preferida de Shafi'i, la venta de un objeto ausente no visto por el comprador no es válida, incluso si se describe extensamente, debido a la prohibición de ventas inciertas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264} En un contrato salam, los bienes deben describirse como una deuda a favor del comprador mediante atributos que los fijan, y los shafi'ís requieren que los atributos se nombren en el contrato mismo, no después de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} En usul, adjuntar una regla a un atributo apropiado muestra que ese atributo es su causa, lo que se llama una alusión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} El concepto de atributo (mafhum al-sifa) significa que una regla ligada a un atributo de una cosa es interpretada por los shafi'ís, los malikíes y la mayoría como excluyente de la regla de lo que carece de ella; Abu Hanifa y un grupo de malikíes y shafiíes, entre ellos al-Ghazali, lo niegan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265}"
  fr: "Dans le lexique, wasf signifie description, et décrire une chose revient à la nommer; un médecin décrit un médicament lorsqu'il le nomme et en précise la posologie. Techniquement, il s'agit d'un terme désignant ce qui renvoie à une essence par un attribut significatif; pour l'usulis, il restreint un mot de sens commun par un autre mot spécifique qui n'est ni une condition ni une fin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264} La plupart des juristes considèrent qu'une vente par description est valable au même titre qu'une vente par vue, puisque la description permet de connaître l'objet; selon l'avis shafi'ite privilégié, la vente d'un objet absent non vu par l'acheteur n'est pas valable, même s'il est longuement décrit, en raison de l'interdiction des ventes incertaines. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264} Dans un contrat salam, les biens doivent être décrits comme une dette en faveur de l'acheteur par des attributs qui les définissent, et les Shafi'ites exigent que ces attributs soient nommés dans le contrat lui-même, et non après. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} En usul, lier une règle à un attribut approprié montre que cet attribut en est la cause, ce qui est appelé une allusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} Le concept d'attribut (mafhum al-sifa) signifie qu'une règle liée à un attribut d'une chose est interprétée par les Shafi'ites, les Maliks et la plupart comme excluant la règle de ce qui en est dépourvu; Abou Hanifa et un groupe de malikites et de chaféites, dont al-Ghazali, le nient. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265}"
  ur: "لغت میں وصف کو بیان کرنا ہے اور کسی چیز کو بیان کرنا اس کا نام رکھنا ہے۔ ایک ڈاکٹر جب کسی دوا کا نام لیتا ہے اور اس کی خوراک دیتا ہے تو اس کی وضاحت کرتا ہے۔ تکنیکی طور پر یہ ایک اصطلاح ہے جو معنی خیز وصف کے ذریعہ کسی جوہر کی طرف اشارہ کرتی ہے۔ usulis کے لیے یہ مشترکہ معنی کے ایک لفظ کو دوسرے، مخصوص لفظ سے محدود کرتا ہے جو نہ تو شرط ہے اور نہ ہی اختتام۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17264} اکثر فقہاء کا خیال ہے کہ تفصیل کے اعتبار سے فروخت نظر کی فروخت کے طور پر جائز ہے، کیونکہ تفصیل سے چیز کا علم ہوتا ہے۔ ترجیحی شافعی کے خیال میں خریدار کی طرف سے نظر نہ آنے والی غیر حاضر چیز کی فروخت جائز نہیں ہے، چاہے طوالت میں بیان کیا گیا ہو، کیونکہ غیر یقینی فروخت کی ممانعت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17264} سلام کے عقد میں سامان کو خریدار کے حق میں قرض کے طور پر ان صفات سے بیان کیا جانا چاہیے جو ان کو درست کرتی ہیں، اور شافعیہ کا تقاضا ہے کہ عقد میں ہی صفات کا نام لیا جائے، نہ کہ اس کے بعد۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17264}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17265} اصول میں کسی مناسب وصف کے ساتھ کسی حکم کو جوڑنے سے اس صفت کو اس کا سبب معلوم ہوتا ہے جسے اشارہ کہتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17265} صفت ⁦(مفہوم الصفا)⁩ کے تصور کا مطلب یہ ہے کہ کسی چیز کی ایک صفت سے جڑے ہوئے حکم کو شافعی، مالک پڑھتے ہیں اور زیادہ تر اس حکم کو چھوڑتے ہیں جس کی کمی ہو۔ ابوحنیفہ اور مالکیوں اور شافعیوں کی ایک جماعت جس میں الغزالی بھی شامل ہے، اس کا انکار کرتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17265}"
  tr: "Arapçada \"açıklama\" ⁦(وصف)⁩ kelimesi nitelik veya tanım anlamına gelir. Bir doktor, ilacı adıyla ve dozajıyla belirttiğinde, ilacı tanımlamış sayılır. Hukuk terminolojisinde ise, belirli bir anlama dayalı olarak bir şeyi gösteren veya belirli bir nitelikle bir şeyi gösteren bir şeye işaret eder. Hukuk kuramcıları için ise, herhangi bir koşul veya sınırlama olmaksızın, ortak bir anlama sahip bir kelimeyi daha spesifik bir kelimeyle sınırlandırmak anlamına gelir. Çoğu hukukçuya göre, açıklamaya dayalı bir satış, tıpkı görmeye dayalı satış gibi geçerlidir, çünkü bu, sözleşmenin konusu hakkında bilgi sağlar. Bununla birlikte, Şafiî mezhebi arasında daha yaygın olan görüşe göre, alıcının görmediği, mevcut olmayan bir eşyanın satışı, spekülatif satış yasağı nedeniyle geçersizdir. Vadeli ödemeli satışta ⁦(مسلم)⁩, borcun kesin olarak tanımlanmasına olanak sağlayacak şekilde tanımlanması şarttır. Şafiî mezhebi, açıklamanın sözleşmenin kendisinde yer alması gerektiğini açıkça belirtir; Aynı oturumda bile olsa, sonradan bundan bahsetmek caiz değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17264}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17265} Fıkıh âlimlerine göre, uygun bir açıklamaya bir hüküm eklemek, açıklamanın hüküm ile açıklama arasında nedensel bir bağ oluşturduğu anlamına gelir; örneğin hırsızlığa uzuv kesme cezası eklemek gibi. Buna ima denir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17265} Nitelik kavramı, bir şeye, niteliklerinden birine dayanarak bir hüküm eklenmesidir. Şafiî, Malik ve âlimlerin çoğunluğu bunun, hükmün başka bir şey için reddedilmesini gösterdiğine inanmaktadır. Ebu Hanife ve aralarında Gazali'nin de bulunduğu bir grup Maliki ve Şafiî, bunun onu geçersiz kılmadığına inanmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265}"
  id: "Dalam bahasa Arab, kata untuk deskripsi ⁦(وصف)⁩ berarti atribut atau deskripsi. Seorang dokter dikatakan telah mendeskripsikan obat ketika ia menyebutkan nama dan dosisnya. Dalam terminologi hukum, ini merujuk pada sesuatu yang menunjukkan suatu hal berdasarkan makna tertentu, atau sesuatu yang menunjukkan suatu hal berdasarkan atribut tertentu. Bagi para ahli teori hukum, ini merujuk pada pembatasan suatu kata dengan makna yang sama oleh kata lain yang lebih spesifik, tanpa syarat atau batasan apa pun. Menurut mayoritas ahli hukum, penjualan berdasarkan deskripsi adalah sah, sama seperti penjualan berdasarkan pengamatan, karena hal ini memberikan pengetahuan tentang objek kontrak. Namun, menurut pendapat yang lebih umum di kalangan mazhab Syafi'i, penjualan barang yang tidak ada dan belum dilihat oleh pembeli, meskipun telah dideskripsikan, tidak sah karena larangan penjualan spekulatif. Dalam penjualan dengan pembayaran tertunda ⁦(مسلم)⁩, syaratnya adalah utang tersebut harus dideskripsikan sedemikian rupa sehingga memungkinkan identifikasi yang tepat. Mazhab Syafi'i secara eksplisit menyatakan bahwa deskripsi harus dicantumkan dalam kontrak itu sendiri; Tidak diperbolehkan menyebutkannya setelahnya, bahkan dalam sesi yang sama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17264}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} Menurut para ulama fiqih, menambahkan hukum pada deskripsi yang sesuai menyiratkan bahwa deskripsi tersebut merupakan hubungan sebab akibat antara hukum dan deskripsi, seperti menambahkan hukuman amputasi pada pencurian. Ini disebut alusi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265} Konsep atribut adalah keterikatan suatu hukum pada suatu hal berdasarkan salah satu atributnya. Al-Shafi'i, Malik, dan mayoritas ulama meyakini bahwa ini menunjukkan negasi hukum untuk hal lain. Abu Hanifa dan sekelompok ulama Maliki dan Syafi'i, termasuk Al-Ghazali, meyakini bahwa hal itu tidak meniadakannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17265}"
