id: concept/milkiyyat-al-dawla
class: concept
kind: legal
label:
  ar: "ملكية الدولة"
  en: "State ownership (milkiyyat al-dawla)"
  ur: "ریاستی ملکیت ⁦(ملکیۃ الدولہ)⁩"
summary:
  ar: "ملكية الدولة في كتابات الاقتصاد الإسلامي المعاصرة ما يكون صاحبه بيت المال بصفته شخصاً معنوياً، يتصرف فيه ولي الأمر بجميع التصرفات الشرعية لتحقيق المصلحة العامة؛ ويستدل لها الطاهر قانة بآيتي الفيء والغنيمة وبأحاديث الموات والإقطاع والحمى، ويعدّ من مجالاتها بيوت مال الزكاة والمصالح والضوائع والأراضي الموات. {cite:dawr-tawzii-milkiyya-qana-2007 p.77} {cite:dawr-tawzii-milkiyya-qana-2007 p.78} {cite:dawr-tawzii-milkiyya-qana-2007 p.79} {cite:dawr-tawzii-milkiyya-qana-2007 p.89} {cite:dawr-tawzii-milkiyya-qana-2007 p.90}"
  en: "In contemporary Islamic-economics writing, state ownership is that whose owner is the public treasury (bayt al-mal) as a legal person, which the ruler may dispose of by every lawful means for the public good; al-Tahir Qana argues for it from the verses on fay' and spoils and the hadiths on dead land, land grants and protected pasture, and counts among its domains the treasuries of zakat, of public interests and of ownerless property, and dead land."
  ur: "معاصر اسلامی معاشیات کی تحریروں میں ریاستی ملکیت وہ ہے جس کا مالک بیت المال بطور قانونی شخص ہو، جس میں حاکم مصلحتِ عامہ کے لیے ہر شرعی تصرف کر سکتا ہے؛ الطاہر قانہ فے اور غنیمت کی آیات اور بنجر زمین، جاگیر اور حمیٰ کی احادیث سے اس پر استدلال کرتے ہیں، اور اس کے دائرے میں زکاۃ، مصالح اور لاوارث اموال کے بیت المال اور بنجر زمینیں شمار کرتے ہیں۔"
