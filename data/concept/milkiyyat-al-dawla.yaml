id: concept/milkiyyat-al-dawla
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "ملكية الدولة"
  en: "State ownership (milkiyyat al-dawla)"
  ur: "ریاستی ملکیت ⁦(ملکیۃ الدولہ)⁩"
  es: "Propiedad estatal (milkiyyat al-dawla)"
  fr: "Propriété de l'État (milkiyyat al-dawla)"
  tr: "devlet mülkiyeti"
  id: "Kepemilikan negara"
summary:
  ar: "ملكية الدولة في كتابات الاقتصاد الإسلامي المعاصرة ما يكون صاحبه بيت المال بصفته شخصاً معنوياً، يتصرف فيه ولي الأمر بجميع التصرفات الشرعية لتحقيق المصلحة العامة؛ ويستدل لها الطاهر قانة بآيتي الفيء والغنيمة وبأحاديث الموات والإقطاع والحمى، ويعدّ من مجالاتها بيوت مال الزكاة والمصالح والضوائع والأراضي الموات. {cite:dawr-tawzii-milkiyya-qana-2007 p.77} {cite:dawr-tawzii-milkiyya-qana-2007 p.78} {cite:dawr-tawzii-milkiyya-qana-2007 p.79} {cite:dawr-tawzii-milkiyya-qana-2007 p.89} {cite:dawr-tawzii-milkiyya-qana-2007 p.90}"
  en: "In contemporary Islamic-economics writing, state ownership is that whose owner is the public treasury (bayt al-mal) as a legal person, which the ruler may dispose of by every lawful means for the public good; al-Tahir Qana argues for it from the verses on fay' and spoils and the hadiths on dead land, land grants and protected pasture, and counts among its domains the treasuries of zakat, of public interests and of ownerless property, and dead land."
  ur: "معاصر اسلامی معاشیات کی تحریروں میں ریاستی ملکیت وہ ہے جس کا مالک بیت المال بطور قانونی شخص ہو، جس میں حاکم مصلحتِ عامہ کے لیے ہر شرعی تصرف کر سکتا ہے؛ الطاہر قانہ فے اور غنیمت کی آیات اور بنجر زمین، جاگیر اور حمیٰ کی احادیث سے اس پر استدلال کرتے ہیں، اور اس کے دائرے میں زکاۃ، مصالح اور لاوارث اموال کے بیت المال اور بنجر زمینیں شمار کرتے ہیں۔"
  es: "En los escritos contemporáneos sobre economía islámica, la propiedad estatal es aquella cuyo propietario es el tesoro público (bayt al-mal) como persona jurídica, del cual el gobernante puede disponer por todos los medios lícitos para el bien público; al-Tahir Qana argumenta a favor de ello a partir de los versículos sobre fay' y botín y los hadices sobre tierras muertas, concesiones de tierras y pastos protegidos, y cuenta entre sus dominios los tesoros del zakat, de los intereses públicos y de la propiedad sin dueño, y las tierras muertas."
  fr: "Dans les écrits contemporains sur l'économie islamique, la propriété d'État est celle dont le propriétaire est le trésor public (bayt al-mal) en tant que personne morale, dont le souverain peut disposer par tous les moyens légaux pour le bien public; al-Tahir Qana argumente en cela à partir des versets sur le fay' et le butin et des hadiths sur les terres mortes, les concessions de terres et les pâturages protégés, et compte parmi ses domaines les trésors de la zakat, des intérêts publics et des biens sans propriétaire, ainsi que les terres mortes."
  tr: "Çağdaş İslami ekonomik yazılarda devlet mülkiyeti, beyt-mal sahibini tüzel bir varlık olarak ifade eder; burada hükümdar, kamu yararını sağlamak için tüm meşru eylemlerde hareket eder; el-Tahir Qana bunu el-Fa'i' ve 'ganimet' ayetlerinden ve çorak toprak, mülk ve ateş hadislerinden kanıt olarak gösterir. Toprakları arasında zekat evleri, çıkarlar, çorak araziler ve verimli topraklar bulunur. {cite:dawr-tawzii-milkiyya-qana-2007 s.77} {cite:dawr-tawzii-milkiyya-qana-2007 s.78} {cite:dawr-tawzii-milkiyya-qana-2007 s.79} {cite:dawr-tawzii-milkiyya-qana-2007 s.89} {cite:DAWR-tawzii-milkiyya-qana-2007 s.90}"
  id: "Kepemilikan negara dalam tulisan ekonomi Islam kontemporer merujuk pada pemegang Bayt al-Mal sebagai entitas hukum, di mana penguasa bertindak dalam semua tindakan sah untuk mencapai kepentingan umum; al-Tahir Qana mengutipnya sebagai bukti dari ayat-ayat al-Fa'i' dan 'rampasan' serta hadis tanah tandus, tanah, dan demam. Di antara wilayahnya adalah rumah kekayaan zakat, kepentingan, tanah tandus, dan tanah subur. {cite:dawr-tawzii-milkiyya-qana-2007 hlm.77} {cite:dawr-tawzii-milkiyya-qana-2007 hlm.78} {cite:dawr-tawzii-milkiyya-qana-2007 hlm.79} {cite:dawr-tawzii-milkiyya-qana-2007 hlm.89} {cite:dawr-tawzii-milkiyya-qana-2007 hlm.90}"
