id: concept/ruqya-fiqh
class: concept
sensitivity: polemical
kind: legal
label:
  ar: "الرقية"
  en: "Ruqya (healing by recitation and charms): when it is lawful, its conditions, and the taking of a fee for it"
  ur: "رقیہ (دم)"
summary:
  ar: "الرقية في اللغة العوذة التي يُرقى بها صاحب الآفة كالحمى والصرع، واسمها الرقيا والجمع رُقى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} وذهب الجمهور إلى جواز الرقية من كل داء بشروط: أن تكون بكلام الله أو أسمائه وصفاته، وباللسان العربي أو بما يُعرف معناه، وأن يعتقد أن الرقية لا تؤثر بذاتها بل بإذن الله، لقوله: لا بأس بالرقي ما لم يكن فيه شرك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} وكره بعض العلماء الرقية لأنها تقدح في التوكل، وأجاز بعضهم الرقية من العين واللدغة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} وأجاز جمهور الفقهاء أخذ الجعل على الرقية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944}"
  en: "Ruqya in the lexicon is the charm recited over a sufferer from fever or fits, and its plural is ruqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} The majority allow healing by recitation under three conditions: that it use the words of God or His names and attributes; that it be in Arabic or in words whose meaning is known; and that the one who recites believe that it works only by God's leave, following the saying that there is no harm in charms when they contain no shirk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} Some scholars disliked it as harming trust in God, and some allowed it only for the evil eye and a sting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} The majority allow a fee for ruqya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944}"
  ur: "رقیہ دم کو کہتے ہیں: قرآن یا اللہ کے اسماء و صفات سے دم کرنا جائز ہے جب شرک نہ ہو اور اللہ کے اذن پر یقین ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944}"
