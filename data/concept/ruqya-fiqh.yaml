id: concept/ruqya-fiqh
class: concept
sensitivity: polemical
kind: legal
label:
  ar: "الرقية"
  en: "Ruqya (healing by recitation and charms): when it is lawful, its conditions, and the taking of a fee for it"
  ur: "رقیہ ⁦(دم)⁩"
  es: "Ruqya (curación mediante recitación y amuletos): cuándo es lícita, sus condiciones y el cobro de una tarifa por ella."
  fr: "La ruqya (guérison par la récitation et les incantations): quand elle est licite, ses conditions et la perception d’une rémunération."
summary:
  ar: "الرقية في اللغة العوذة التي يُرقى بها صاحب الآفة كالحمى والصرع، واسمها الرقيا والجمع رُقى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} وذهب الجمهور إلى جواز الرقية من كل داء بشروط: أن تكون بكلام الله أو أسمائه وصفاته، وباللسان العربي أو بما يُعرف معناه، وأن يعتقد أن الرقية لا تؤثر بذاتها بل بإذن الله، لقوله: لا بأس بالرقي ما لم يكن فيه شرك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} وكره بعض العلماء الرقية لأنها تقدح في التوكل، وأجاز بعضهم الرقية من العين واللدغة فقط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} وأجاز جمهور الفقهاء أخذ الجعل على الرقية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944}"
  en: "Ruqya in the lexicon is the charm recited over a sufferer from fever or fits, and its plural is ruqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} The majority allow healing by recitation under three conditions: that it use the words of God or His names and attributes; that it be in Arabic or in words whose meaning is known; and that the one who recites believe that it works only by God's leave, following the saying that there is no harm in charms when they contain no shirk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} Some scholars disliked it as harming trust in God, and some allowed it only for the evil eye and a sting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} The majority allow a fee for ruqya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944}"
  ur: "رقیہ دم کو کہتے ہیں: قرآن یا اللہ کے اسماء و صفات سے دم کرنا جائز ہے جب شرک نہ ہو اور اللہ کے اذن پر یقین ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944}"
  es: "Ruqya en el léxico es el conjuro recitado sobre un enfermo de fiebre o ataques, y su plural es ruqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} La mayoría permite la curación mediante la recitación bajo tres condiciones: que use las palabras de Dios o Sus nombres y atributos; que sea en árabe o en palabras cuyo significado se conoce; y que quien recita crea que funciona solo con el permiso de Dios, siguiendo el dicho de que no hay daño en los conjuros cuando no contienen shirk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} Algunos eruditos lo desaprobaban por dañar la confianza en Dios, y algunos lo permitían solo para el mal de ojo y una picadura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} La mayoría permite una tarifa por ruqya. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944}"
  fr: "Dans le lexique, la ruqya est l'invocation récitée sur une personne souffrant de fièvre ou de convulsions, et son pluriel est ruqa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} La majorité autorise la guérison par la récitation sous trois conditions: qu'elle utilise les paroles de Dieu ou Ses noms et attributs; qu'elle soit en arabe ou en des termes dont le sens est connu; et que celui qui la récite croie qu'elle n'agit que par la permission de Dieu, conformément au principe selon lequel il n'y a pas de mal à réciter des invocations lorsqu'elles ne contiennent pas de shirk (associationnisme). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} Certains savants la désapprouvent, la considérant comme une atteinte à la confiance en Dieu, et d'autres ne l'autorisent que pour le mauvais œil et les piqûres d'insectes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8943} La majorité autorise des frais pour la ruqya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8944}"
