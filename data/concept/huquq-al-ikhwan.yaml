id: concept/huquq-al-ikhwan
class: concept
kind: social
label:
  ar: "حقوق الإخوة"
  en: "Rights of brothers (and sisters) in faith"
  es: "Derechos de los hermanos (y hermanas) en la fe"
summary:
  ar: "حقوق الإخوة: ما يؤديه المسلم لأخيه المسلم من فروض أخوّة — عيادة المريض، وتشميت العاطس، ونصحه، والذب عن عرضه، وترك ظلمه وخذلانه واحتقاره — نصت عليها أحاديث «المسلم أخو المسلم»."
  en: "Rights of brothers: the duties a Muslim owes a fellow Muslim — visiting the sick, blessing the sneezer, counsel, defending honour, and abstaining from wronging, forsaking or despising — as set out in the 'a Muslim is a Muslim's brother' hadiths."
  es: "Derechos de los hermanos: los deberes que un musulmán tiene para con otro musulmán —visitar a los enfermos, bendecir al que estornuda, aconsejar, defender el honor y abstenerse de hacer daño, abandonar o despreciar— tal como se establece en los hadices que dicen que \"un musulmán es hermano de otro musulmán\"."
