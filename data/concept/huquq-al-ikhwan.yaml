id: concept/huquq-al-ikhwan
class: concept
kind: social
label:
  ar: "حقوق الإخوة"
  en: "Rights of brothers (and sisters) in faith"
  es: "Derechos de los hermanos (y hermanas) en la fe"
  fr: "Droits des frères (et sœurs) dans la foi"
  ur: "ایمان میں بھائیوں ⁦(اور بہنوں)⁩ کے حقوق"
  tr: "Kardeşlerin Hakları"
  id: "Hak-hak Saudara"
summary:
  ar: "حقوق الإخوة: ما يؤديه المسلم لأخيه المسلم من فروض أخوّة — عيادة المريض، وتشميت العاطس، ونصحه، والذب عن عرضه، وترك ظلمه وخذلانه واحتقاره — نصت عليها أحاديث «المسلم أخو المسلم»."
  en: "Rights of brothers: the duties a Muslim owes a fellow Muslim — visiting the sick, blessing the sneezer, counsel, defending honour, and abstaining from wronging, forsaking or despising — as set out in the 'a Muslim is a Muslim's brother' hadiths."
  es: "Derechos de los hermanos: los deberes que un musulmán tiene para con otro musulmán —visitar a los enfermos, bendecir al que estornuda, aconsejar, defender el honor y abstenerse de hacer daño, abandonar o despreciar— tal como se establece en los hadices que dicen que \"un musulmán es hermano de otro musulmán\"."
  fr: "Droits des frères: les devoirs qu’un musulman doit à un autre musulman — visiter le malade, bénir celui qui éternue, conseiller, défendre l’honneur et s’abstenir de faire du tort, d’abandonner ou de mépriser — tels qu’ils sont énoncés dans les hadiths « un musulman est le frère d’un autre musulman »."
  ur: "بھائیوں کے حقوق: ایک مسلمان پر اپنے ساتھی مسلمان کے فرائض - بیمار کی عیادت کرنا، چھینک دینے والے کی عیادت کرنا، نصیحت کرنا، عزت کا دفاع کرنا، اور ظلم سے پرہیز کرنا، ترک کرنا یا حقیر جانا - جیسا کہ 'مسلمان مسلمان کا بھائی ہے' احادیث میں بیان کیا گیا ہے۔"
  tr: "Kardeşlik hakları: Bir Müslümanın, kardeş kardeşi için kardeşlik görevleri açısından ne yaptığı — hastayı ziyaret etmek, hapşırmak, ona öğüt vermek, onurunu savunmak ve adaletsizliği, ihaneti ve küçümsemesinden kaçınmak — hadislerde açıkça belirtilmiştir: \"Müslüman, Müslümanın kardeşidir.\""
  id: "Hak persaudaraan: Apa yang dilakukan seorang Muslim untuk sesama saudara Muslim dalam hal tugas persaudaraan — mengunjungi orang sakit, memanjakan diri dalam bersin, menasihatinya, membela kehormatannya, dan menahan diri dari ketidakadilan, pengkhianatan, dan penghinaan — secara eksplisit dinyatakan dalam hadits \"Muslim adalah saudara dari Muslim.\""
