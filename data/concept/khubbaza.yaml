summary:
  ar: "خبازى في الكتاب نوع من الملوخيا، وقيل الخبازى هو البري والملوخيا هو البستاني، ومن الخبازى نوع يقال له ملوخيا السحرة وهو الخطمي، وبقلة اليهود ليس بعيدا أن تكون من أصنافه وهي حمراء؛ بارد رطب في الأولى، فيه تليين، ينفع من النملة والحمرة وقروح الرأس والقلاع ونواصير العين وخشونة الصدر، ويفتح سدد الكبد، وينفع قروح الكلى والمثانة والأمعاء، وفيه قوة مدرة للبول؛ وفيه نقل موسوم عن اللبن وصلابات الرحم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.712-713}"
  en: "Khubbaza is in the book a kind of mulukhiya, and it is said that khubbaza is the wild and mulukhiya the garden kind, and a kind of khubbaza called the mulukhiya of the sorcerers is al-khitmi, and the Jews' herb is not far from being one of its varieties, and it is red; cold and moist in the first degree with softening in it, it benefits namla, erysipelas, ulcers of the head, thrush, fistulae of the eye and roughness of the chest, opens obstructions of the liver, benefits ulcers of the kidneys, bladder and intestines, and has a power of promoting urine; it has a labelled listing on milk and hardness of the womb in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.712-713}"
  ur: "خبازیٰ کتاب میں ملوخیا کی ایک قسم ہے، اور کہا گیا کہ خبازیٰ جنگلی ہے اور ملوخیا باغی، اور خبازیٰ کی ایک قسم ملوخیا السحرہ کہلاتی ہے جو خطمی ہے، اور بقلۃ الیہود کا اس کی قسموں میں سے ہونا بعید نہیں اور وہ سرخ ہے؛ پہلے درجے میں ٹھنڈا تر جس میں نرمی ہے، نملہ، حمرہ، سر کے زخموں، قلاع، آنکھ کے ناسوروں اور سینے کی کھردراہٹ میں نافع ہے، جگر کی رکاوٹیں کھولتا ہے، گردوں، مثانے اور آنتوں کے زخموں میں نافع ہے اور اس میں پیشاب لانے کی قوت ہے؛ دودھ اور رحم کی سختیوں کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.712-713}۔"
  es: "En el libro, Khubbaza es una especie de mulukhiya, y se dice que khubbaza es la silvestre y mulukhiya la de jardín. Una especie de khubbaza llamada mulukhiya de los hechiceros es al-khitmi, y la hierba de los judíos no está lejos de ser una de sus variedades. Es roja, fría y húmeda en primer grado, con propiedades suavizantes. Beneficia la namla, la erisipela, las úlceras de la cabeza, la candidiasis oral, las fístulas oculares y la aspereza del pecho. Desobstruye las obstrucciones del hígado, beneficia las úlceras de los riñones, la vejiga y los intestinos, y tiene el poder de promover la micción. Se menciona en una sección dedicada a la regla del fundador sobre la leche y la dureza del útero {cite:canon-ibn-sina-print-v1 pp.712-713}."
  fr: "Le khubbaza est mentionné dans le livre comme une sorte de mulukhiya. Il est dit que le khubbaza est sauvage et la mulukhiya cultivée. Une variété de khubbaza appelée « mulukhiya des sorciers » est al-khitmi. L'herbe des Juifs est proche d'en être une variété. Elle est rouge, froide et humide au premier degré, avec des propriétés adoucissantes. Elle est bénéfique pour la namla, l'érysipèle, les ulcères de la tête, le muguet, les fistules oculaires et les irritations de la poitrine. Elle débloque les obstructions du foie, est bénéfique pour les ulcères des reins, de la vessie et des intestins, et a le pouvoir de favoriser la diurèse. Elle est mentionnée dans une section consacrée à la décision du fondateur, concernant la lactation et la fertilité. {cite:canon-ibn-sina-print-v1 pp.712-713}"
  tr: "Kitapta Khabazi bir molokhia türüdür. Khabazi'nin vahşi, molokhia'nın ise bahçıvan olduğu söylenir. Khabazi arasında 'Büyücüler' Molokhia türü vardır, bu marshmallow ve Yahudiler arasında bu türden biri olması muhtemeldir; kırmızı olan bu türden biri olması muhtemeldir; soğuk ve nemli olan Khabazi cildi yumuşatır ve yumuşatır, karınca, kızarıklık, baş ülserleri, ardıçlar, göz ülserleri ve göğüs pürürlülüğünden faydalanır, karaciğer tıkanıklığını açar ve böbrek, mesane ve bağırsak ülserleri için faydalıdır ve idrar söktürücü güce sahiptir; ayrıca kurucunun kararı üzerine bir bölümde 'Rahimin Sütü ve Sertliği' başlıklı bir alıntı içerir {cite:canon-ibn-sina-print-v1 s.712-713}"
  id: "Dalam buku tersebut, Khabazi adalah jenis molokhia. Dikatakan bahwa Khabazi adalah makhluk liar dan molokhia adalah tukang kebun. Di antara Khabazi terdapat tipe yang disebut 'Penyihir', Molokhia, yang merupakan marshmallow dan di kalangan Yahudi, tidak mustahil salah satu jenisnya, yaitu berwarna merah; dingin dan lembap pada yang pertama, ia melunakkan dan melunakkan kulit, mendapat manfaat dari semut, kemerahan, tukak kepala, sariwan, borok mata, dan kekasaran dada, membuka penyumbatan hati, dan bermanfaat untuk tukak ginjal, kandung kemih, dan usus, serta memiliki kekuatan diuretik; juga memuat kutipan berjudul 'Susu dan Kekerasan Rahim' dalam bagian tentang putusan pendiri {cite:canon-ibn-sina-print-v1 hlm.712-713}"
