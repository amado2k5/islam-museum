label:
  ar: "خبازى"
  en: "Khubbaza"
  ur: "خبازیٰ"
summary:
  ar: "خبازى في الكتاب نوع من الملوخيا، وقيل الخبازى هو البري والملوخيا هو البستاني، ومن الخبازى نوع يقال له ملوخيا السحرة وهو الخطمي، وبقلة اليهود ليس بعيدا أن تكون من أصنافه وهي حمراء؛ بارد رطب في الأولى، فيه تليين، ينفع من النملة والحمرة وقروح الرأس والقلاع ونواصير العين وخشونة الصدر، ويفتح سدد الكبد، وينفع قروح الكلى والمثانة والأمعاء، وفيه قوة مدرة للبول؛ وفيه نقل موسوم عن اللبن وصلابات الرحم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.712-713}"
  en: "Khubbaza is in the book a kind of mulukhiya, and it is said that khubbaza is the wild and mulukhiya the garden kind, and a kind of khubbaza called the mulukhiya of the sorcerers is al-khitmi, and the Jews' herb is not far from being one of its varieties, and it is red; cold and moist in the first degree with softening in it, it benefits namla, erysipelas, ulcers of the head, thrush, fistulae of the eye and roughness of the chest, opens obstructions of the liver, benefits ulcers of the kidneys, bladder and intestines, and has a power of promoting urine; it has a labelled listing on milk and hardness of the womb in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.712-713}"
  ur: "خبازیٰ کتاب میں ملوخیا کی ایک قسم ہے، اور کہا گیا کہ خبازیٰ جنگلی ہے اور ملوخیا باغی، اور خبازیٰ کی ایک قسم ملوخیا السحرہ کہلاتی ہے جو خطمی ہے، اور بقلۃ الیہود کا اس کی قسموں میں سے ہونا بعید نہیں اور وہ سرخ ہے؛ پہلے درجے میں ٹھنڈا تر جس میں نرمی ہے، نملہ، حمرہ، سر کے زخموں، قلاع، آنکھ کے ناسوروں اور سینے کی کھردراہٹ میں نافع ہے، جگر کی رکاوٹیں کھولتا ہے، گردوں، مثانے اور آنتوں کے زخموں میں نافع ہے اور اس میں پیشاب لانے کی قوت ہے؛ دودھ اور رحم کی سختیوں کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.712-713}۔"
