label: { ar: "قياس الأرض", en: "Measuring the earth", es: "Midiendo la Tierra", fr: "Mesurer la terre", ur: "زمین کی پیمائش", tr: "arazi ölçümü", id: "pengukuran lahan" }
summary:
  ar: "تقدير محيط الأرض بقياس درجة من خط نصف النهار بالذراع، وقد قُدّرت الدرجة بستة وخمسين ميلاً وثلثي ميل بالميل الذي هو أربعة آلاف ذراع بالذراع السوداء، على ما امتحن في أيام المأمون واجتمع على قياسه جماعة من العلماء. فيكون محيط الأرض عشرين ألفاً وأربعمائة ميل، وقطرها نحو ستة آلاف وخمسمائة ميل. {cite:farghani-elements-astronomy p. 100}{cite:farghani-elements-astronomy p. 99}"
  en: "Estimating the earth's circumference by measuring one degree of a north-south meridian in cubits. al-Farghani gives the degree as 56 2/3 miles, using the mile of 4,000 black cubits, the measurement made in the days of al-Ma'mun with a number of scholars present. That gives a circumference of 20,400 miles and a diameter of about 6,500 miles {cite:farghani-elements-astronomy p. 100}{cite:farghani-elements-astronomy p. 99}."
  es: "Estimando la circunferencia de la Tierra midiendo un grado de un meridiano norte-sur en codos, al-Farghani da como resultado un grado de 56 2/3 millas, utilizando la milla de 4000 codos negros, medida que se realizaba en tiempos de al-Ma'mun con la presencia de varios eruditos. Esto da una circunferencia de 20 400 millas y un diámetro de aproximadamente 6500 millas {cite:farghani-elements-astronomy p. 100}{cite:farghani-elements-astronomy p. 99}."
  fr: "L'estimation de la circonférence terrestre se fait en mesurant un degré d'un méridien nord-sud en coudées. Al-Farghani donne 56 2/3 miles par degré, en utilisant le mile de 4 000 coudées noires, mesure effectuée à l'époque d'al-Ma'mun en présence de plusieurs savants. Cela donne une circonférence de 20 400 miles et un diamètre d'environ 6 500 miles (voir: Farghani, Elements Astronomy, p. 100; Farghani, Elements Astronomy, p. 99)."
  ur: "کیوبٹس میں شمال-جنوبی میریڈیئن کی ایک ڈگری کی پیمائش کرکے زمین کے طواف کا اندازہ لگانا۔ الفرغانی نے 56 2/3 میل کا درجہ دیا ہے، جس میں 4000 سیاہ ہاتھ کا میل استعمال کیا گیا ہے، یہ پیمائش المامون کے زمانے میں متعدد علماء کے ساتھ کی گئی تھی۔ یہ 20,400 میل کا طواف اور تقریباً 6,500 میل کا قطر دیتا ہے 100}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 99}۔"
  tr: "Dünya'nın çevresi, öğle çizgisinden bir derece arşin cinsinden ölçülerek tahmin edilir ve derece, elli altı mil ve mil içinde üçte iki mil olarak tahmin edilir; bu da siyah arşında dört bin arşındır; bu, al-Ma'mun döneminde test edilmiş ve bir grup akademisyen tarafından kabul edilmiştir. Böylece, Dünya'nın çevresi yirmi bin dört yüz mil olacak ve çapı yaklaşık altı bin beş yüz mil olacaktır. {alıntı:farghani-elementler-astronomi s. 100} {alıntı:farghani-elementler-astronomi s. 99}"
  id: "Keliling Bumi diperkirakan dengan mengukur satu derajat dari garis tengah hari dalam hasta, dan derajat diperkirakan lima puluh enam mil dua pertiga mil dalam satu mil, yang setara dengan empat ribu hasta dalam hasta hitam, seperti yang diuji pada masa al-Ma'mun dan disepakati oleh sekelompok ulama. Dengan demikian, keliling Bumi adalah dua puluh ribu empat ratus mil, dengan diameter sekitar enam ribu lima ratus mil. {kutip:Farghani-Elements-astronomy hlm. 100} {cite:Farghani-Elements-astronomy hlm. 99}"
