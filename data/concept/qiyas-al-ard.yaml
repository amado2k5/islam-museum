summary:
  ar: "تقدير محيط الأرض بقياس درجة من خط نصف النهار بالذراع، وقد قُدّرت الدرجة بستة وخمسين ميلاً وثلثي ميل بالميل الذي هو أربعة آلاف ذراع بالذراع السوداء، على ما امتحن في أيام المأمون واجتمع على قياسه جماعة من العلماء. فيكون محيط الأرض عشرين ألفاً وأربعمائة ميل، وقطرها نحو ستة آلاف وخمسمائة ميل. {cite:farghani-elements-astronomy p. 100}{cite:farghani-elements-astronomy p. 99}"
  en: "Estimating the earth's circumference by measuring one degree of a north-south meridian in cubits. al-Farghani gives the degree as 56 2/3 miles, using the mile of 4,000 black cubits, the measurement made in the days of al-Ma'mun with a number of scholars present. That gives a circumference of 20,400 miles and a diameter of about 6,500 miles {cite:farghani-elements-astronomy p. 100}{cite:farghani-elements-astronomy p. 99}."
