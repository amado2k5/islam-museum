label: { ar: "إثم", en: "Sin (ithm)" }
summary:
  ar: "الإثم في اللغة الذنب، وقيل أن يعمل ما لا يحل له. وعند أهل السنة هو استحقاق العقوبة، وعند المعتزلة لزوم العقوبة، والخلاف بينهما يدور على جواز العفو وعدمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} ويتعلق الإثم بترك الفرض، ومنه ترك فرض العين كالصلاة، وفرض الكفاية إذا تركه الجميع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} وفعل الحرام موجب للإثم، ولا يأثم فاعل المكروه تنزيهاً، ولا يلزم من فعل المباح أو تركه إثم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} والحدود عند الحنفية والمالكية والحنابلة لا تذهب الآثام الأخروية، وقال الشافعي إنها مطهرة للمسلم دون الكافر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524}"
  en: "In the lexicon, ithm means sin, or doing what is not lawful for one. For the Sunnis it is the deserving of punishment; for the Mu'tazila it is the necessity of punishment. The difference turns on whether forgiveness is possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} Sin attaches to abandoning an individual obligation, such as prayer, and to abandoning a collective obligation when all leave it, such as the funeral prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} Doing what is forbidden is sinful; doing what is disliked as a matter of preference carries no sin, and doing or leaving what is permitted carries none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} The Hanafis, Malikis and Hanbalis hold that a fixed penalty does not remove the sin in the hereafter; al-Shafi'i holds that it purifies a Muslim but not a non-Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524}"
