label: { ar: "إثم", en: "Sin (ithm)", es: "Seno (ritmo)", fr: "Péché (ithme)", ur: "گناہ (ithm)" }
summary:
  ar: "الإثم في اللغة الذنب، وقيل أن يعمل ما لا يحل له. وعند أهل السنة هو استحقاق العقوبة، وعند المعتزلة لزوم العقوبة، والخلاف بينهما يدور على جواز العفو وعدمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} ويتعلق الإثم بترك الفرض، ومنه ترك فرض العين كالصلاة، وفرض الكفاية إذا تركه الجميع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} وفعل الحرام موجب للإثم، ولا يأثم فاعل المكروه تنزيهاً، ولا يلزم من فعل المباح أو تركه إثم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} والحدود عند الحنفية والمالكية والحنابلة لا تذهب الآثام الأخروية، وقال الشافعي إنها مطهرة للمسلم دون الكافر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524}"
  en: "In the lexicon, ithm means sin, or doing what is not lawful for one. For the Sunnis it is the deserving of punishment; for the Mu'tazila it is the necessity of punishment. The difference turns on whether forgiveness is possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} Sin attaches to abandoning an individual obligation, such as prayer, and to abandoning a collective obligation when all leave it, such as the funeral prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} Doing what is forbidden is sinful; doing what is disliked as a matter of preference carries no sin, and doing or leaving what is permitted carries none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} The Hanafis, Malikis and Hanbalis hold that a fixed penalty does not remove the sin in the hereafter; al-Shafi'i holds that it purifies a Muslim but not a non-Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524}"
  es: "En el léxico, ithm significa pecado, o hacer lo que no es lícito para uno. Para los sunitas es merecer castigo; para los mu'tazila es la necesidad de castigo. La diferencia radica en si el perdón es posible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} El pecado se asocia con abandonar una obligación individual, como la oración, y con abandonar una obligación colectiva cuando todos la abandonan, como la oración fúnebre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} Hacer lo prohibido es pecaminoso; hacer lo que no es agradable por preferencia no conlleva pecado, y hacer o abandonar lo que está permitido no conlleva ninguno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} Los hanafíes, malikíes y hanbalíes sostienen que una pena fija no elimina el pecado en el más allá; Al-Shafi'i sostiene que purifica a un musulmán, pero no a un no musulmán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524}"
  fr: "Dans le lexique, « ithm » signifie péché, ou faire ce qui est illicite. Pour les sunnites, il s'agit du mérite d'une punition; pour les mu'tazilites, il s'agit de la nécessité de la punition. La différence réside dans la possibilité du pardon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} Le péché consiste à abandonner une obligation individuelle, comme la prière, et à abandonner une obligation collective lorsque tous s'en désintéressent, comme la prière funéraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1523} Faire ce qui est interdit est un péché; faire ce qui est déconseillé par préférence n'en est pas un, et faire ou omettre ce qui est permis n'en est pas un non plus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524} Les hanafites, les malikites et les hanbalites estiment qu'une peine fixe n'efface pas le péché dans l'au-delà. Al-Shafi'i soutient que cela purifie le musulman mais pas le non-musulman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1524}"
  ur: "لغت میں، ithm کا مطلب ہے گناہ، یا وہ کام کرنا جو کسی کے لیے جائز نہیں ہے۔ اہل سنت کے نزدیک یہ سزا کا مستحق ہے۔ معتزلہ کے لیے سزا کا تقاضا ہے۔ فرق اس پر بدل جاتا ہے کہ آیا معافی ممکن ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1523} گناہ کسی انفرادی فرض کو ترک کرنے سے منسلک ہوتا ہے، جیسے نماز، اور جب سب چھوڑ دیں تو اجتماعی فرض کو ترک کرنا، جیسے نماز جنازہ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1523} حرام کام کرنا گناہ ہے۔ ناپسندیدہ چیز کو ترجیح دینے میں کوئی گناہ نہیں، اور جو جائز ہے اسے کرنا یا چھوڑنا کوئی گناہ نہیں ہے۔ حنفیہ، مالکیہ اور حنبلی کا خیال ہے کہ ایک مقررہ سزا آخرت میں گناہ کو دور نہیں کرتی۔ الشافعی کا خیال ہے کہ یہ ایک مسلمان کو پاک کرتا ہے لیکن غیر مسلم کو نہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1524}"
