id: concept/dunu-al-shams
class: concept
kind: belief
label:
  ar: "دنو الشمس والعرق يوم القيامة"
  en: "The sun drawn near and the sweat"
  ur: "سورج کا قریب ہونا اور پسینہ"
summary:
  ar: "في الحشر تدنو الشمس من الخلق قدر ميل حتى يكون الناس في عرقهم على قدر أعمالهم: منهم من يبلغ كعبيه ومنهم من يبلغ حلقه {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  en: "At the gathering the sun draws near creation the measure of a mile, until people stand in their sweat according to their deeds — some to their ankles, some to their throats {cite:sahih-muslim} {cite:sahih-al-bukhari}."
  ur: "حشر میں سورج مخلوق سے ایک میل کے فاصلے پر آ جائے گا اور لوگ اپنے اعمال کے مطابق پسینے میں ہوں گے — کسی کو ٹخنوں تک، کسی کو حلق تک {cite:sahih-muslim} {cite:sahih-al-bukhari}۔"
