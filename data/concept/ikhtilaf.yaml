label:
  ar: اختلاف
  en: Ikhtilaf (disagreement among jurists and its kinds)
  es: "Ikhtilaf (desacuerdo entre juristas y sus tipos)"
  fr: "Ikhtilaf (désaccord entre juristes et ses différentes formes)"
summary:
  ar: 'الاختلاف في الأمور الاجتهادية: الخلاف الحقيقي هو التضاد، أما اختلاف العبارة والتنوع فيرجعان إلى الوفاق. وأنواعه في الدين أربعة بحسب ثبوت الأصل بالقطع؛ والاختلاف في الفروع الاجتهادية واقع ويُعذر فيه المخالف، وقد وقع في عهد الصحابة، وجمعه الشاطبي إلى الوفاق في قصد الشارع، وقال بعض العلماء إنه رحمة للأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1944}. وفي أسباب الاختلاف: منه ما يرجع إلى هوى ⁦(مذموم)⁩ ومنه ما يرجع إلى اجتهاد مأذون فيه، وأسبابه في الدليل ⁦(الإجمال، والعموم والخصوص، والنسخ، واختلاف الرواية)⁩ وفي القواعد الأصولية؛ وفي الإنكار والمراعاة: لا ينكر المختلف فيه إلا في صور، ويُستحب الخروج من الخلاف بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1947}. وفي العمل بالخلاف: المقلد لا يتخير عند المحققين بل يرجح، والقاضي يحكم بالراجح عنده، وحكم القاضي في الواقعة يرفع الخلاف فيها، ولا ينقض الاجتهاد بمثله، وتصرف الإمام يرفع الخلاف في الماضي، والصلاة خلف المخالف جائزة، وتختلف الأدلة بالجمع أو الترجيح أو النسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952}.'
  en: 'Ikhtilaf (disagreement): true disagreement is contrariety; differences of expression and variety go back to agreement. Disagreement in religion has four kinds according to whether the principle is proved by decisive evidence; disagreement in ijtihad matters occurs and the dissenter is excused; it occurred in the time of the Companions; al-Shatibi reduced it to agreement in seeking the Lawgiver''s purpose, and some scholars held it a mercy to the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1944}. On the causes of disagreement: some come from desire (blameworthy) and some from permitted ijtihad, with causes in the evidence (ambiguity, generality, abrogation, variant reports) and in the usuli rules; on denunciation and taking account: the disputed is not denounced except in cases, and leaving disagreement is recommended under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1947}. In acting on disagreement: the layman does not choose at will but takes the preponderant view; the judge rules by the view preponderant to him; a judgement ends the dispute for its case and ijtihad is not annulled by its like; the imam''s act ends the dispute for the past; prayer behind a dissenter is lawful; and conflicting evidence is reconciled, preferred, or the later taken as abrogating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952}.'
  es: "Ikhtilaf (desacuerdo): el verdadero desacuerdo es contradicción; las diferencias de expresión y variedad conducen al acuerdo. El desacuerdo en la religión tiene cuatro tipos según si el principio se prueba con evidencia concluyente; el desacuerdo en asuntos de ijtihad ocurre y el disidente es excusado; ocurrió en la época de los Compañeros; al-Shatibi lo redujo a acuerdo en la búsqueda del propósito del Legislador, y algunos eruditos lo consideraron una misericordia para la comunidad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1941} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1942} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1943} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1944}. Sobre las causas del desacuerdo: algunas provienen del deseo (culpable) y otras de la ijtihad permitida, con causas en la evidencia (ambigüedad, generalidad, abrogación, informes variantes) y en las reglas usuli; sobre la denuncia y la toma de cuentas: lo controvertido no se denuncia salvo en los casos, y se recomienda dejar el desacuerdo bajo condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1947}. Al actuar en desacuerdo: el laico no elige a su antojo, sino que toma la opinión predominante; el juez dicta sentencia según la opinión predominante para él; un juicio pone fin a la disputa para su caso y el ijtihad no se anula por otro similar; el acto del imán pone fin a la disputa para el pasado; la oración detrás de un disidente es lícita; y la evidencia contradictoria se concilia, se prefiere o se toma la última como abrogante. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1948} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1949} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1950} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1951} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952}."
  fr: "Ikhtilaf (désaccord): le véritable désaccord est une contradiction; les différences d’expression et de variété tendent vers l’accord. En matière de religion, le désaccord se divise en quatre catégories selon que le principe est prouvé ou non par une preuve décisive; le désaccord en matière d’ijtihad survient et le dissident est excusé; il existait déjà du temps des Compagnons; al-Shatibi l’a assimilé à un accord visant à comprendre la volonté du Législateur, et certains savants l’ont considéré comme une miséricorde pour la communauté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1944}. Sur les causes de désaccord: certaines proviennent du désir (répréhensible) et d'autres de l'ijtihad autorisé, avec des causes dans les preuves (ambiguïté, généralité, abrogation, rapports variables) et dans les règles de l'usuli; sur la dénonciation et la prise en compte: le litigieux n'est dénoncé que dans des cas particuliers, et la sortie du désaccord est recommandée sous conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1947}. En cas de désaccord: le profane ne choisit pas arbitrairement, mais adopte l’avis prépondérant; le juge statue selon l’avis prépondérant à ses yeux; un jugement met fin au différend pour le cas présent et l’ijtihad n’est pas annulé par un jugement similaire; l’acte de l’imam met fin au différend pour le passé; la prière derrière un dissident est licite; et les preuves contradictoires sont conciliées, privilégiées, ou cette dernière option est considérée comme abrogeante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1951} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952}."
