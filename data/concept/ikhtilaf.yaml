label:
  ar: اختلاف
  en: Ikhtilaf (disagreement among jurists and its kinds)
summary:
  ar: 'الاختلاف في الأمور الاجتهادية: الخلاف الحقيقي هو التضاد، أما اختلاف العبارة والتنوع فيرجعان إلى الوفاق. وأنواعه في الدين أربعة بحسب ثبوت الأصل بالقطع؛ والاختلاف في الفروع الاجتهادية واقع ويُعذر فيه المخالف، وقد وقع في عهد الصحابة، وجمعه الشاطبي إلى الوفاق في قصد الشارع، وقال بعض العلماء إنه رحمة للأمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1944}. وفي أسباب الاختلاف: منه ما يرجع إلى هوى (مذموم) ومنه ما يرجع إلى اجتهاد مأذون فيه، وأسبابه في الدليل (الإجمال، والعموم والخصوص، والنسخ، واختلاف الرواية) وفي القواعد الأصولية؛ وفي الإنكار والمراعاة: لا ينكر المختلف فيه إلا في صور، ويُستحب الخروج من الخلاف بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1947}.'
  en: 'Ikhtilaf (disagreement): true disagreement is contrariety; differences of expression and variety go back to agreement. Disagreement in religion has four kinds according to whether the principle is proved by decisive evidence; disagreement in ijtihad matters occurs and the dissenter is excused; it occurred in the time of the Companions; al-Shatibi reduced it to agreement in seeking the Lawgiver''s purpose, and some scholars held it a mercy to the community. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1940} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1941} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1942} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1944}. On the causes of disagreement: some come from desire (blameworthy) and some from permitted ijtihad, with causes in the evidence (ambiguity, generality, abrogation, variant reports) and in the usuli rules; on denunciation and taking account: the disputed is not denounced except in cases, and leaving disagreement is recommended under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1947}.'
