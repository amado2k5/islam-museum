label:
  ar: "أگادير (الحصن الجماعي للحبوب)"
  en: "Agadir (Berber collective granary and citadel)"
summary:
  ar: "اسم بربري لحصن مسوّر يحتوي على حجرات توزّع على عائلات القبيلة لتخزين الحبوب، ويلجأ إليه أهلها وقت الخطر؛ وبقيت هذه المؤسسة القديمة في جبل نفوسة والأوراس والريف ومرتفعات المغرب، وربما يرجع الاسم إلى الفينيقية gadir بمعنى الجدار {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  en: "A Berber name for a fortified enclosure with chambers allotted to the families of a tribe for storing grain, to which the tribe retreated in danger. The institution survives in the Djabal Nafusa, the Awras, the Rif and the Atlas; the name may go back to Phoenician gadir, 'wall' {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
