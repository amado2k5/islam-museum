id: concept/agadir
class: concept
kind: term
label:
  ar: "أگادير ⁦(الحصن الجماعي للحبوب)⁩"
  en: "Agadir (Berber collective granary and citadel)"
  fr: "Agadir (grenier collectif et citadelle berbères)"
  es: "Agadir (granero colectivo bereber y ciudadela)"
  ur: "اگادیر ⁦(بربر اجتماعی غلہ اور قلعہ)⁩"
  tr: "Agadir (Kolektif Tahıl Kalesi)"
  id: "Agadir (Benteng Gandum Kolektif)"
summary:
  ar: "اسم بربري لحصن مسوّر يحتوي على حجرات توزّع على عائلات القبيلة لتخزين الحبوب، ويلجأ إليه أهلها وقت الخطر؛ وبقيت هذه المؤسسة القديمة في جبل نفوسة والأوراس والريف ومرتفعات المغرب، وربما يرجع الاسم إلى الفينيقية gadir بمعنى الجدار {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  en: "A Berber name for a fortified enclosure with chambers allotted to the families of a tribe for storing grain, to which the tribe retreated in danger. The institution survives in the Djabal Nafusa, the Awras, the Rif and the Atlas; the name may go back to Phoenician gadir, 'wall' {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  fr: "Nom berbère d’une enceinte fortifiée dont les chambres sont attribuées aux familles d’une tribu pour entreposer les céréales, et où la tribu se réfugiait en cas de danger. L’institution subsiste dans le Djebel Nefoussa, l’Aurès, le Rif et l’Atlas ; le nom pourrait remonter au phénicien gadir, « mur » {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  es: "Nombre bereber para un recinto fortificado con cámaras asignadas a las familias de una tribu para almacenar grano, al que la tribu se refugiaba en caso de peligro. Esta institución sobrevive en Djabal Nafusa, Awras, Rif y Atlas; el nombre podría remontarse al fenicio gadir, 'muro' {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  ur: "ایک بربر نام ایک قلعہ بند دیوار کے لیے ایک قبیلے کے خاندانوں کو اناج ذخیرہ کرنے کے لیے مختص چیمبروں کے ساتھ، جس سے قبیلہ خطرے میں پیچھے ہٹ گیا۔ یہ ادارہ جبل نفوسہ، عروس، رف اور اطلس میں زندہ ہے۔ یہ نام فونیشین گدیر پر واپس جا سکتا ہے، 'دیوار' {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 266}۔"
  tr: "Kabile aileleri arasında tahıl depolamak için dağıtılan odalar içeren surlarla çevrili bir kale için Berberi bir isimdir; bu eski kurum Nafusa Dağı, Aurès, Rif ve Fas yaylalarında kalmıştır. İsim, Fenike dilindeki gadir kelimesinden türemiş olabilir ve duvar anlamına gelir {cite:encyclopaedia-of-islam-2 cilt 1, s. 266} anlamına gelir."
  id: "Ini adalah nama Berber untuk benteng yang dikelilingi oleh dinding yang berisi ruang-ruang yang tersebar di antara keluarga suku untuk menyimpan gandum; institusi kuno ini tetap berada di dataran tinggi Gunung Nafusa, Aurès, Rif, dan Maroko. Nama ini mungkin berasal dari kata Fenisia gadir dan berarti tembok {cite:encyclopaedia-of-islam-2 vol. 1, hlm. 266}."
