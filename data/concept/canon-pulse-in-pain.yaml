id: concept/canon-pulse-in-pain
class: concept
kind: scientific
label:
  ar: "نبض الأوجاع عند ابن سينا"
  en: "The pulse in pain in the Canon"
  fr: "Pouls dans la douleur dans le Canon"
  ur: "درد کی نبض قانون میں"
  es: "El pulso en el dolor en el Canon"
  tr: "İbn Sina'daki acıların nabzı"
  id: "Denyut rasa sakit dalam Ibn Sina"
summary:
  ar: "في الفصل السادس عشر يبين ابن سينا أن الوجع يغير النبض لشدته أو لكونه في عضو رئيس أو لطول مدته، ويرتب أطواره من التهييج إلى الانهيار {cite:canon-ibn-sina-print-v1 p.181}."
  en: "In the sixteenth chapter Ibn Sina shows that pain changes the pulse through its severity, its seat in a principal organ or its long duration, and sets out its stages from stirring up to collapse {cite:canon-ibn-sina-print-v1 p.181}."
  fr: "Au chapitre 16, Ibn Sina relie les changements à intensité douloureuse, organe principal atteint ou durée, de stimulation initiale à effondrement {cite:canon-ibn-sina-print-v1 p.181}."
  es: "En el capítulo dieciséis, Ibn Sina muestra que el dolor cambia el pulso según su gravedad, su ubicación en un órgano principal o su larga duración, y establece sus etapas desde la agitación hasta el colapso {cite:canon-ibn-sina-print-v1 p.181}."
  ur: "سولہویں باب میں ابن سینا بتاتا ہے کہ درد نبض کو اس کی شدت، اہم عضو میں بیٹھنے یا اس کی طویل مدت کے ذریعے تبدیل کرتا ہے، اور اس کے ٹوٹنے سے لے کر گرنے تک کے مراحل طے کرتا ہے۔"
  tr: "On altıncı bölümde İbn Sina, ağrının nabzı yoğunluğu, ana organdaki varlığı veya süresi nedeniyle değiştirdiğini, tahrişten çöküşe kadar evreleri düzenlediğini açıklar {cite:canon-ibn-sina-print-v1 s.181}."
  id: "Pada bab enam belas, Avicenna menjelaskan bahwa rasa sakit mengubah denyut nadi karena intensitasnya, kehadirannya di organ utama, atau durasinya, mengatur tahap-tahapnya dari iritasi hingga runtuh {cite:canon-ibn-sina-print-v1 hlm.181}."
