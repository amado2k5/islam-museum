  ur: "مشمش"
  es: "Mishmish (albaricoque)"
  fr: "Mishmish (abricot)"
summary:
  ar: "المشمش فاكهة باردة رطبة في الثانية ودهن نواته حار يابس في الثالثة، وأجوده الأرمني الذي لا يسرع إليه الفساد والحموضة، ويذكر الكتاب أن نقيعه يسكن العطش وأنه يولد الحميات لسرعة تعفنه {cite:canon-ibn-sina-print-v1 p.572}."
  en: "Mishmish, the apricot, is cold and moist in the second degree and its kernel oil hot and dry in the third; the Armenian is the best, which does not quickly spoil or sour, and the book says its infusion quenches thirst while the fruit breeds fevers through its quick putrefaction {cite:canon-ibn-sina-print-v1 p.572}."
  ur: "مشمش دوسرے درجے میں سرد تر ہے اور اس کی گٹھلی کا تیل تیسرے درجے میں گرم خشک؛ بہترین ارمنی ہے جو جلد خراب یا کھٹا نہیں ہوتا، اور کتاب کے مطابق اس کا نقیع پیاس بجھاتا ہے جبکہ پھل جلد سڑنے کی وجہ سے بخار پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 p.572}۔"
  es: "El mishmish, el albaricoque, es frío y húmedo en segundo grado y su aceite de semilla caliente y seco en tercero; el armenio es el mejor, que no se estropea ni se agria rápidamente, y el libro dice que su infusión calma la sed mientras que la fruta produce fiebres debido a su rápida putrefacción {cite:canon-ibn-sina-print-v1 p.572}."
  fr: "Mishmish, l'abricot, est froid et humide au deuxième degré et son huile de noyau chaude et sèche au troisième; l'arménien est le meilleur, car il ne se gâte ni ne s'aigrit rapidement, et le livre dit que son infusion étanche la soif tandis que le fruit provoque des fièvres par sa putréfaction rapide {cite:canon-ibn-sina-print-v1 p.572}."
