label: { ar: "حال العلم عند أهل الأندلس", en: "The state of learning among the people of al-Andalus", fr: "L'état du savoir chez les gens d'al-Andalus", es: "El estado del saber entre la gente de al-Ándalus", ur: "اہل اندلس میں تعلیم کی کیفیت", tr: "Endülüs halkı arasındaki bilgi durumu", id: "Situasi informasi di antara masyarakat Andalusia" }
kind: social
summary:
  ar: "وصف ابن سعيد لثقافة العلم بالأندلس: لا مدارس عندهم بل يُقرئون جميع العلوم في المساجد بأجرة فيقرئون ليعلموا لا ليأخذوا جارياً، والعالم معظم من الخاصة والعامة، والجاهل يجهد أن يتميز بصنعة لأن الفراغ عندهم في نهاية القبح، وكل العلوم لها عندهم حظ واعتناء إلا الفلسفة والتنجيم فلهما حظ عظيم عند الخواص ولا يتظاهر بهما خوف العامة إذ كلما قيل فلان يقرأ الفلسفة أطلقت عليه العامة اسم زنديق فإن زل في شبهة رجموه بالحجارة أو حرقوه قبل أن يصل أمره للسلطان، وبذلك تقرب المنصور بن أبي عامر لقلوبهم أول نهوضه بإحراق كتب هذا الشأن، ولا مذهب لهم إلا مذهب مالك، وسيمة الفقيه عندهم جليلة حتى سموا الأمير العظيم الفقيه، والنحو عندهم في نهاية علو الطبقة كأصحاب عصر الخليل وسيبويه {cite:nafh-tib-maqqari p. 256-258}."
  en: "Ibn Sa'id's famous profile of learning in al-Andalus: no madrasas but mosque lessons for wages, teachers who taught to teach not to earn, scholars honoured by elite and commoner alike, every science cherished except philosophy and astrology — cultivated privately by the elite while the crowd branded the practitioner 'zindiq' and might stone or burn him before the sultan intervened; thus al-Mansur opened his rise by burning such books; Maliki law alone, 'faqih' the highest honorific, and grammar at a height likened to the age of Khalil and Sibawayh {cite:nafh-tib-maqqari p. 256-258}."
  fr: "Le célèbre portrait du savoir en al-Andalus par Ibn Sa'id : pas de madrasas mais des leçons rémunérées à la mosquée, des maîtres qui enseignaient pour transmettre et non pour gagner, des savants honorés par l'élite comme par le peuple, toutes les sciences estimées sauf la philosophie et l'astrologie, cultivées en privé par l'élite tandis que la foule taxait leur adepte de « zindiq » et pouvait le lapider ou le brûler avant que le sultan n'intervienne ; c'est ainsi qu'al-Mansur inaugura son ascension en brûlant de tels livres ; le seul droit malikite, « faqih » comme titre honorifique le plus élevé, et une grammaire à une hauteur comparée à l'époque d'al-Khalil et de Sibawayh {cite:nafh-tib-maqqari p. 256-258}."
  es: "El famoso perfil de Ibn Sa'id sobre el saber en al-Ándalus: no había madrasas, sino clases en la mezquita a cambio de un salario; maestros que enseñaban por el placer de enseñar, no por dinero; eruditos honrados tanto por la élite como por el pueblo; todas las ciencias apreciadas, excepto la filosofía y la astrología, cultivadas en privado por la élite, mientras que la multitud tildaba al practicante de \"zindiq\" y podía apedrearlo o quemarlo antes de que interviniera el sultán; así, al-Mansur inició su ascenso quemando tales libros; solo la ley malikí, \"faqih\" el título honorífico más alto, y la gramática en un nivel comparable a la época de Khalil y Sibawayh {cite:nafh-tib-maqqari p. 256-258}."
  ur: "ابن سعید کا الاندلس میں سیکھنے کا مشہور خاکہ: کوئی مدرسہ نہیں بلکہ مسجد میں اجرت کے لیے سبق، اساتذہ جو کمانے کے لیے نہیں سکھاتے، اشرافیہ اور عام لوگوں کی طرف سے یکساں عزت کرنے والے علماء، فلسفہ اور نجوم کے علاوہ ہر سائنس کو پسند کیا جاتا ہے - اشرافیہ کے ذریعہ نجی طور پر کاشت کیا جاتا ہے جبکہ ہجوم نے اسے پریکٹیشنر کے نام سے پکارا اور ان کے سامنے آتش زدگی کا نشانہ بنایا۔ اس طرح المنصور نے ایسی کتابوں کو جلا کر اپنے عروج کا آغاز کیا۔ اکیلے مالکی قانون، 'فقیہ' اعلیٰ ترین اعزاز، اور بلندی پر گرائمر کو خلیل اور سباویہ کے زمانے سے تشبیہ دی گئی ہے۔ 256-258}۔"
  tr: "İbn Sa'id'in Endülüs'teki bilgi kültürünü tanımı: Okulları yoktur; tüm bilimleri camilerde ücret karşılığında öğretirler, bu yüzden öğrenmek için çalışırlar, köle almak için değil. Âlim hem seçkinlerden hem de sıradan insanlardan üstündür. Cahiller, tembellik onlar için en büyük çirkinliktir diye zanaatkârlıkta üstün olmaya çalışır. Tüm bilimlerin payı ve ilgisi vardır, felsefe ve astroloji hariç, bunlar seçkinler arasında büyük paya sahiptir ve halkın korkusuyla gösterilmez. Filosif birinin felsefe okuduğu söylendiğinde, halk ona sapkın der. Şüpheye düşerse, taşlar ya da yakar. İşleri Sultan'a ulaşmadan önce, Al-Mansur bin Ebi Amir, yükselişinin başında bu konuda kitaplar yakarak onların kalbine daha da yaklaştı. Maliki mezhebi dışında bir mezhebleri yoktu ve hukukçu statüsü onlarda saygı görüyordu; öyle ki hukukçuların büyük prensi olarak anılıyorlardı. Dilbilgisi, El-Halil ve Sibevey döneminin yoldaşları gibi sınıfın zirvesindeydi {cite:nafh-tib-maqqari, s. 256-258}."
  id: "Definisi budaya pengetahuan di Andalusia menurut Ibn Sa'id: Mereka tidak memiliki sekolah; mereka mengajarkan semua ilmu pengetahuan di masjid dengan bayaran, jadi mereka bekerja untuk belajar, bukan untuk mengambil budak. Seorang cendekiawan lebih unggul dari elit maupun orang biasa. Orang bodoh berusaha unggul dalam kerajinan karena kemalasan adalah keburukan terbesar bagi mereka. Semua ilmu pengetahuan memiliki bagian dan minat, kecuali filsafat dan astrologi, yang memiliki bagian besar di kalangan elit dan tidak ditunjukkan oleh rasa takut pada rakyat. Ketika seorang filsuf disuruh belajar filsafat, rakyat menyebutnya sesat. Jika dia ragu, dia melempar batu atau membakarnya. Sebelum urusannya sampai ke Sultan, Al-Mansur ibn Abi Amir, pada awal kebangkitannya, membakar buku-buku tentang subjek ini, semakin dekat dengan hati mereka. Mereka tidak memiliki sekte selain aliran Maliki dan dihormati sebagai ahli hukum; sampai-sampai mereka disebut pangeran agung para ahli hukum. Tata bahasa berada di puncak kelas, seperti rekan-rekan pada periode Hebron dan Sibaway {cite:nafh-tib-maqqari, hlm. 256-258}."
