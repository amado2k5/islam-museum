id: concept/al-ilm-fi-l-andalus
class: concept
label: { ar: "حال العلم عند أهل الأندلس" }
kind: social
summary:
  ar: "وصف ابن سعيد لثقافة العلم بالأندلس: لا مدارس عندهم بل يُقرئون جميع العلوم في المساجد بأجرة فيقرئون ليعلموا لا ليأخذوا جارياً، والعالم معظم من الخاصة والعامة، والجاهل يجهد أن يتميز بصنعة لأن الفراغ عندهم في نهاية القبح، وكل العلوم لها عندهم حظ واعتناء إلا الفلسفة والتنجيم فلهما حظ عظيم عند الخواص ولا يتظاهر بهما خوف العامة إذ كلما قيل فلان يقرأ الفلسفة أطلقت عليه العامة اسم زنديق فإن زل في شبهة رجموه بالحجارة أو حرقوه قبل أن يصل أمره للسلطان، وبذلك تقرب المنصور بن أبي عامر لقلوبهم أول نهوضه بإحراق كتب هذا الشأن، ولا مذهب لهم إلا مذهب مالك، وسيمة الفقيه عندهم جليلة حتى سموا الأمير العظيم الفقيه، والنحو عندهم في نهاية علو الطبقة كأصحاب عصر الخليل وسيبويه {cite:nafh-tib-maqqari p. 256-258}."
  en: "Ibn Sa'id's famous profile of learning in al-Andalus: no madrasas but mosque lessons for wages, teachers who taught to teach not to earn, scholars honoured by elite and commoner alike, every science cherished except philosophy and astrology — cultivated privately by the elite while the crowd branded the practitioner 'zindiq' and might stone or burn him before the sultan intervened; thus al-Mansur opened his rise by burning such books; Maliki law alone, 'faqih' the highest honorific, and grammar at a height likened to the age of Khalil and Sibawayh {cite:nafh-tib-maqqari p. 256-258}."
