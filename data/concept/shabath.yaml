summary:
  ar: "الشبث في الكتاب إسخانه بين الثانية والثالثة وتجفيفه بين الأولى والثانية، منضج للأخلاط الباردة مسكن للأوجاع يفش الرياح وكذلك دهنه، وفيه تليين بالغ، ومنضج للأورام، ورماده ينفع من القروح الرهلة، ودهنه من أوجاع الأعصاب، وهو منوم وخصوصا دهنه، وعصارته تنفع من وجع الأذن السوداوي، وإدمان أكله يضعف البصر، وهو وبزره يدر اللبن، وينفع من فواق الامتلاء ومن المغص، وبزره يقطع البواسير النابتة، ويذكر الكتاب نقلا موسوما أثره في المني {cite:canon-ibn-sina-print-v1 p.678}"
  en: "Shabath is in the book between the second and third degree in heating and between the first and second in drying; it ripens cold humours, soothes pains and disperses winds, and so does its oil, with a marked softening; it ripens swellings, its ash benefits flabby ulcers, its oil benefits pains of the nerves, it induces sleep, especially its oil, its juice benefits the dark-humoured earache, constant eating of it weakens sight, it and its seed bring on milk, it benefits the hiccup of fullness and colic, its seed cuts away growing haemorrhoids, and the book lists, as a labelled report, its effect on semen {cite:canon-ibn-sina-print-v1 p.678}"
  ur: "شبث کتاب میں گرمی میں دوسرے اور تیسرے درجے کے درمیان اور خشکی میں پہلے اور دوسرے کے درمیان ہے؛ ٹھنڈے اخلاط کو پکاتا، دردوں کو سکون دیتا اور ہواؤں کو منتشر کرتا ہے، اور اس کا تیل بھی ایسا ہی ہے، اس میں نمایاں نرمی ہے؛ ورموں کو پکاتا ہے، اس کی راکھ پھولے ہوئے قرحوں میں نافع ہے، اس کا تیل اعصاب کے دردوں میں نافع ہے، نیند لاتا ہے خاص طور پر اس کا تیل، اس کا عرق سودائی کان کے درد میں نافع ہے، اسے مسلسل کھانا بینائی کمزور کرتا ہے، یہ اور اس کا بیج دودھ بڑھاتے ہیں، بھرے پن کی ہچکی اور مروڑ میں نافع ہے، اس کا بیج اگنے والی بواسیر کو کاٹتا ہے، اور کتاب منقول فہرست کے طور پر منی پر اس کا اثر درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.678}۔"
  es: "Shabat se encuentra en el libro entre el segundo y el tercer grado de calor y entre el primero y el segundo de secado; madura los humores fríos, alivia los dolores y dispersa los vientos, al igual que su aceite, con un marcado efecto suavizante; madura las hinchazones, su ceniza beneficia las úlceras flácidas, su aceite beneficia los dolores de los nervios, induce el sueño, especialmente su aceite, su jugo beneficia el dolor de oído de humor oscuro, su consumo constante debilita la vista, tanto él como su semilla producen leche, beneficia el hipo de plenitud y el cólico, su semilla elimina las hemorroides en crecimiento, y el libro enumera, como un informe etiquetado, su efecto sobre el semen {cite:canon-ibn-sina-print-v1 p.678}"
  fr: "Le shabbat figure dans le livre entre le deuxième et le troisième degré de chaleur et entre le premier et le deuxième degré d'assèchement; il mûrit les humeurs froides, apaise les douleurs et disperse les vents, de même que son huile, avec un adoucissement marqué; il fait mûrir les gonflements, sa cendre est bénéfique aux ulcères flasques, son huile est bénéfique aux douleurs nerveuses, il induit le sommeil, surtout son huile, son jus est bénéfique aux maux d'oreille d'origine sombre, sa consommation constante affaiblit la vue, lui et sa graine favorisent la lactation, il est bénéfique au hoquet dû à la plénitude et aux coliques, sa graine coupe les hémorroïdes en croissance, et le livre mentionne, sous forme de rapport étiqueté, son effet sur le sperme {cite:canon-ibn-sina-print-v1 p.678}"
