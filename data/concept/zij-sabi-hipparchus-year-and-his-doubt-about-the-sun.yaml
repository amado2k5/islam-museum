label: { ar: "سنة أرخس وشكه في سير الشمس", en: "Hipparchus's year and his doubt about the Sun's motion", ur: "ارخس کا سال اور سورج کی رفتار پر اس کا شک", es: "El año de Hiparco y su duda sobre el movimiento del Sol.", fr: "L'année d'Hipparque et son doute quant au mouvement du Soleil", tr: "Arkhas'ın yılı ve güneşin hareketine dair şüpheleri", id: "Tahun Arkhas dan keraguannya tentang pergerakan matahari" }
summary:
  ar: "ينقل البتاني عن بطليموس أن أرخس ⁦(اسم الرجل كما يقرأ في المخطوط)⁩ عمل أولاً على أن زمان السنة ثلاثمائة وخمسة وستون يوماً وربع، ثم ظهر له أنه أقل من ذلك قليلاً، وقال إنه ثلاثمائة وخمسة وستون يوماً وأقل من ربع يوم بالحقيقة، لأنه وجد الانقلاب الصيفي يتقدم زمان الربع التام، وأدخله ذلك في شك من سير الشمس حتى توهم لها فلكاً خارج المركز {cite:zij-sabi-nallino-byblion p.65}."
  en: "Al-Battani reports from Ptolemy that Hipparchus (the name as the manuscript reads it) first worked with a year of three hundred and sixty-five days and a quarter, then found it to be somewhat less, and said it is three hundred and sixty-five days and in truth less than a quarter day, because he found the solstice arriving before the whole quarter; this put him in doubt about the Sun's motion, so that he imagined for it an eccentric sphere {cite:zij-sabi-nallino-byblion p.65}."
  ur: "البتانی بطلیموس سے نقل کرتے ہیں کہ ارخس ⁦(نام جیسے مخطوطہ میں پڑھا جاتا ہے)⁩ نے پہلے سال کو تین سو پینسٹھ دن اور ایک چوتھائی مانا، پھر اسے اس سے کچھ کم پایا اور کہا کہ حقیقت میں یہ تین سو پینسٹھ دن اور ایک چوتھائی دن سے کم ہے، کیونکہ اس نے انقلابِ صیفی کو پورے چوتھائی سے پہلے آتا پایا؛ اس سے اسے سورج کی رفتار میں شک پیدا ہوا اور اس نے اس کے لیے خارج المرکز فلک کا تصور کیا {cite:zij-sabi-nallino-byblion p.65}۔"
  es: "Al-Battani relata que Ptolomeo afirma que Hiparco (nombre que aparece en el manuscrito) trabajó primero con un año de trescientos sesenta y cinco días y un cuarto, luego descubrió que era algo menor y dijo que eran trescientos sesenta y cinco días y, en realidad, menos de un cuarto de día, porque encontró que el solsticio llegaba antes del cuarto completo; esto le hizo dudar del movimiento del Sol, por lo que imaginó para él una esfera excéntrica {cite:zij-sabi-nallino-byblion p.65}."
  fr: "Al-Battani rapporte de Ptolémée qu'Hipparque (le nom tel qu'il apparaît dans le manuscrit) a d'abord travaillé avec une année de trois cent soixante-cinq jours et un quart, puis a constaté qu'elle était un peu moins longue, et a dit qu'elle était de trois cent soixante-cinq jours et en réalité moins d'un quart de jour, car il a constaté que le solstice arrivait avant le quart de jour; cela l'a mis dans le doute quant au mouvement du Soleil, de sorte qu'il a imaginé pour celui-ci une sphère excentrique {cite:zij-sabi-nallino-byblion p.65}."
  tr: "Al-Battani, Batlamyus'un şöyle dediğini aktarır: Arches (el yazmasında okunduğu şekliyle adamın adı), önce yılın uzunluğunun üç yüz altmış beş buçuk gün olduğu varsayımıyla çalışmış, sonra bunun biraz daha az olduğunu fark etmiş ve gerçekte üç yüz altmış beş gün ve çeyrek günden az olduğunu söylemiştir; çünkü yaz gündönümünün tam çeyrek günün uzunluğundan önce geldiğini görmüş ve bu da onu güneşin hareketinden şüphe duymaya, hatta güneşin merkez dışında bir yörüngeye sahip olduğunu düşünmeye yöneltmiştir. {cite:zij-sabi-nallino-byblion s.65}"
  id: "Al-Battani mengutip Ptolemy yang mengatakan bahwa Arches (nama orang tersebut sebagaimana tertulis dalam manuskrip) awalnya bekerja berdasarkan asumsi bahwa panjang tahun adalah tiga ratus enam puluh lima seperempat hari, kemudian ia menyadari bahwa panjangnya sedikit kurang dari itu, dan ia mengatakan bahwa sebenarnya panjangnya adalah tiga ratus enam puluh lima hari dan kurang dari seperempat hari, karena ia menemukan bahwa titik balik matahari musim panas mendahului panjang seperempat tahun penuh, dan ini membuatnya meragukan pergerakan matahari sampai ia membayangkan bahwa matahari memiliki orbit di luar pusat {cite:zij-sabi-nallino-byblion p.65}."
