label:
  ar: "غلظ الأجفان"
  en: "Thickness of the eyelids"
  ur: "پلکوں کا گاڑھا پن"
  es: "Grosor de los párpados"
summary:
  ar: "غلظ الأجفان مرض يتبع الجرب وربما أورثه الأطلية الباردة على الجفن، وعلاجه الاكتحال بأدوية جالية واستعمال الحمام دائماً واجتناب النبيذ وقد يحك كثيراً بالميل والشياف الأحمر اللين، وأما الحك بالسكر فربما هاج أو جرب به ⁦(أسماء الأدوية لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.194}"
  en: "Thickness of the lids is a disease that follows the itch-scab and cold applications on the lid may bequeath it; its treatment is collyriation with polishing drugs, always using the bath and avoiding wine; it may be much rubbed with the probe and the soft red collyrium, while rubbing with sugar may inflame it or scab over ⁦(drug names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.194}"
  ur: "پلکوں کا گاڑھا پن ایک مرض ہے جو خارش کے پیچھے آتا ہے اور پلک پر ٹھنڈے طلاء اسے چھوڑ بھی سکتے ہیں؛ اس کا علاج جلا دینے والی ادویہ سے سرمہ، ہمیشہ حمام اور نبیذ سے پرہیز ہے؛ اور اسے میل اور نرم سرخ شیاف سے بہت مالا جا سکتا ہے، جبکہ شکر سے مالنا اسے بھڑکا یا خارش دار بھی کر سکتا ہے ⁦(ادویہ کے نام منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.194}"
  es: "El engrosamiento de los párpados es una enfermedad que sigue a la costra pruriginosa y las aplicaciones frías en el párpado pueden provocarla; su tratamiento consiste en la coliriación con medicamentos pulidores, siempre utilizando el baño y evitando el vino; se puede frotar abundantemente con la sonda y el colirio rojo suave, mientras que frotar con azúcar puede inflamarlo o formar una costra (no se incluyen los nombres de los medicamentos) {cite:canon-ibn-sina-print-v2 p.194}"
