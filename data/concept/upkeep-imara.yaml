id: concept/upkeep-imara
class: concept
kind: legal
label:
  ar: "عِمَارَة الأملاك والمساجد"
  en: "Upkeep and building of property and mosques (imara, not the emirate)"
  ur: "عمارت (مرمت اور آبادکاری)"
summary:
  ar: "العمارة في اللغة ما يُعمر به الشيء، وتطلق على البناء. وفي الاصطلاح القيام بما يصلح الأرض أو البناء من إحياء وترميم وتجصيص وما يصلحه عرفاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. وهي أخص من البناء، وأخص من الإحياء بمعنييه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. ويجب على ناظر الوقف عمارته من ريعه أو مما شرطه الواقف، وعلى الولي عمارة عقار موليه، وعلى المحجور عليه عمارة أملاكه، وعلى ناظر المشترك طلب شريكه، ولا تجب على البالغ الرشيد عمارة أملاكه، ويندب عمارة الخراب ويكره تركها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. وعمارة المساجد فرض كفاية، وتكون بالعبادة ودرس العلم وتنظيفها، وقد ورد فيها الترغيب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}."
  en: "In the lexicon, imara is what a thing is made to flourish by, and it also means building. As a term it is the doing of what keeps land or a building in good condition, such as reviving land, repairing and plastering a building {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. It is narrower than building, and than the revival of land in either sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. The supervisor of an endowment must keep it in repair from its income or from what the founder stipulated; a guardian must keep his ward's real estate in repair; a restrained person must keep his own property in repair; a free adult is not obliged to do so, though neglecting a ruin is disliked {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. The upkeep of mosques is a communal duty, kept by worship, teaching and cleaning, and is strongly recommended {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}."
