id: concept/upkeep-imara
class: concept
kind: legal
label:
  ar: "عِمَارَة الأملاك والمساجد"
  en: "Upkeep and building of property and mosques (imara, not the emirate)"
  ur: "عمارت ⁦(مرمت اور آبادکاری)⁩"
  es: "Mantenimiento y construcción de propiedades y mezquitas (imara, no el emirato)."
  fr: "Entretien et construction de propriétés et de mosquées (imara, et non l'émirat)"
  tr: "Emlak ve Cami Mimarisi"
  id: "Arsitektur Properti dan Masjid"
summary:
  ar: "العمارة في اللغة ما يُعمر به الشيء، وتطلق على البناء. وفي الاصطلاح القيام بما يصلح الأرض أو البناء من إحياء وترميم وتجصيص وما يصلحه عرفاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. وهي أخص من البناء، وأخص من الإحياء بمعنييه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. ويجب على ناظر الوقف عمارته من ريعه أو مما شرطه الواقف، وعلى الولي عمارة عقار موليه، وعلى المحجور عليه عمارة أملاكه، وعلى ناظر المشترك طلب شريكه، ولا تجب على البالغ الرشيد عمارة أملاكه، ويندب عمارة الخراب ويكره تركها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. وعمارة المساجد فرض كفاية، وتكون بالعبادة ودرس العلم وتنظيفها، وقد ورد فيها الترغيب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}."
  en: "In the lexicon, imara is what a thing is made to flourish by, and it also means building. As a term it is the doing of what keeps land or a building in good condition, such as reviving land, repairing and plastering a building {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. It is narrower than building, and than the revival of land in either sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. The supervisor of an endowment must keep it in repair from its income or from what the founder stipulated; a guardian must keep his ward's real estate in repair; a restrained person must keep his own property in repair; a free adult is not obliged to do so, though neglecting a ruin is disliked {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. The upkeep of mosques is a communal duty, kept by worship, teaching and cleaning, and is strongly recommended {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}."
  es: "En el léxico, imara es aquello por lo que se hace prosperar una cosa, y también significa construcción. Como término, es la acción de mantener la tierra o un edificio en buenas condiciones, como revivir la tierra, reparar y enlucir un edificio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. Es más restringido que construcción, y que la revitalización de la tierra en cualquiera de los sentidos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. El supervisor de una dotación debe mantenerla en reparación con sus ingresos o con lo que estipuló el fundador; un tutor debe mantener los bienes inmuebles de su pupilo en reparación; una persona restringida debe mantener su propia propiedad en reparación; Un adulto libre no está obligado a hacerlo, aunque descuidar una ruina es reprobable {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. El mantenimiento de las mezquitas es un deber comunitario, que se cumple mediante la oración, la enseñanza y la limpieza, y es altamente recomendable {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}."
  fr: "Dans le lexique, « imara » désigne ce qui permet à une chose de prospérer, et signifie également « construction ». Ce terme désigne l'ensemble des actions visant à maintenir un terrain ou un bâtiment en bon état, telles que la remise en état d'un terrain, la réparation et le crépissage d'un bâtiment {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805}. Son sens est plus restreint que celui de « construction » et que celui de « remise en état d'un terrain », quel que soit le sens donné à ce terme {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. Le gestionnaire d'une fondation doit l'entretenir grâce à ses revenus ou aux dispositions du fondateur; un tuteur doit entretenir les biens immobiliers de son pupille; une personne sous tutelle doit entretenir ses propres biens. Un adulte libre n'y est pas tenu, bien que la négligence d'une ruine soit déconseillée {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}. L'entretien des mosquées est un devoir communautaire, accompli par le culte, l'enseignement et le nettoyage, et est fortement recommandé {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11806}."
  ur: "لغت میں، امارہ وہ ہے جس سے کسی چیز کو پنپنے کے لیے بنایا جاتا ہے، اور اس کا مطلب عمارت بھی ہے۔ ایک اصطلاح کے طور پر یہ وہ کام ہے جو زمین یا عمارت کو اچھی حالت میں رکھتا ہے، جیسے زمین کو زندہ کرنا، عمارت کی مرمت اور پلستر کرنا یہ عمارت سے زیادہ تنگ ہے، اور زمین کے احیاء سے دونوں معنوں میں {حوالہ: فقہ معسوۃ کویتیہ-نور-v3 صفحہ 11805} اوقاف کے سپروائزر کو اپنی آمدنی سے یا بانی کی شرط سے اسے مرمت میں رکھنا چاہیے۔ ایک سرپرست کو اپنے وارڈ کی جائیداد کو مرمت میں رکھنا چاہیے؛ ایک روکے ہوئے شخص کو اپنی جائیداد کو مرمت میں رکھنا چاہیے؛ ایک آزاد بالغ ایسا کرنے کا پابند نہیں ہے، حالانکہ کسی بربادی کو نظر انداز کرنا ناپسندیدہ ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11806}۔ مساجد کی دیکھ بھال ایک اجتماعی فریضہ ہے، جسے عبادت، تعلیم اور صفائی کے ذریعے ادا کیا جاتا ہے، اور اس کی سختی سے سفارش کی جاتی ہے {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 11806}۔"
  tr: "Dilbilimde, mimarlık bir şeyi inşa etmek için kullanılan şeydir ve yapıya atıfta bulunur. Terminoloji olarak, araziyi veya binayı iyileştiren şeyleri gerçekleştirmektir; örneğin canlandırma, restorasyon, sıva ve geleneksel olarak uygun olanı {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11805}. İnşaattan daha spesifiktir ve anlamları bakımından canlandırmadan daha spesifiktir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11806}. Vakıf yöneticisi, mirasından veya mirasçının belirttiği şeylerden inşa etmelidir, vasi vasisinin malını inşa etmelidir, yetersiz kişi mülklerini inşa etmeli ve ortak eşin denetleyicisi ortağından talep etmelidir. Olgun bir yetişkin mülkünü inşa etmek zorunda değildir ve kalıntılar inşa etmeyi önerir, terk edilmesinden hoşlanmaz {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11806}. Cami inşası toplu bir yükümlülüktür (Fard Kifayah) ve ibadet, bilgi inceleme ve temizliği içerir. Teşvikten bahsedilmiştir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11806}."
  id: "Dalam linguistik, arsitektur adalah apa yang digunakan untuk membangun sesuatu, dan merujuk pada pembangunan. Dalam terminologi, arsitektur adalah melakukan apa yang memperbaiki tanah atau bangunan, seperti menghidupkan kembali, memulihkan, melapisi plesteran, dan apa yang biasanya sesuai {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11805}. Arsitektur lebih spesifik daripada konstruksi, dan lebih spesifik daripada revitalisasi dalam maknanya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11805} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.11806}. Pengawas dana abadi harus membangunnya dari pendapatan atau apa yang ditetapkan oleh pemberi wakaf, wali harus membangun properti penjaganya, orang yang cacat harus membangun propertinya, dan pengawas mitra bersama harus meminta pasangannya. Orang dewasa yang sudah dewasa tidak wajib membangun propertinya, dan ia merekomendasikan bangunan reruntuhan serta tidak suka meninggalkannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11806}. Pembangunan masjid adalah kewajiban kolektif (Fard Kifayah), dan melibatkan ibadah, mempelajari pengetahuan, dan membersihkannya. Dorongan telah disebutkan dalam surat ini {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11806}."
