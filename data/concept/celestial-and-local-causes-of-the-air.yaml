label: { ar: "الأسباب السماوية وعروض البلاد وارتفاعها عند ابن سينا", en: "Celestial causes, latitude and height in the air, in the Canon", ur: "ہوا میں آسمانی اسباب، عرض بلد اور بلندی قانون میں", es: "Causas celestes, latitud y altura en el aire, en el Canon", fr: "Causes célestes, latitude et altitude dans l'air, dans le Canon" }
summary:
  ar: "يفتتح ابن سينا الفصل الثامن، في تغيرات الهواء التي ليست مضادة للمجرى الطبيعي جداً، بتقسيمها إلى سماوية وأرضية، ثم يبين أثر الكواكب وعروض البلاد وارتفاع البقعة وانخفاضها {cite:canon-ibn-sina-print-v1 pp.122-123}."
  en: "Chapter 8, on changes of air that are not altogether against the natural course, divides them into celestial and earthly, and then shows the effect of the stars, the latitude of a country and the height or depth of its ground {cite:canon-ibn-sina-print-v1 pp.122-123}."
  es: "El capítulo 8, sobre los cambios atmosféricos que no son del todo contrarios al curso natural, los divide en celestes y terrestres, y luego muestra el efecto de las estrellas, la latitud de un país y la altura o profundidad de su terreno {cite:canon-ibn-sina-print-v1 pp.122-123}."
  fr: "Le chapitre 8, sur les changements de l'air qui ne sont pas tout à fait contraires au cours naturel, les divise en célestes et terrestres, puis montre l'effet des étoiles, de la latitude d'un pays et de la hauteur ou de la profondeur de son sol {cite:canon-ibn-sina-print-v1 pp.122-123}."
  ur: "باب 8، ہوا کی تبدیلیوں کے بارے میں جو بالکل قدرتی روش کے خلاف نہیں ہیں، انہیں آسمانی اور زمینی میں تقسیم کرتا ہے، اور پھر ستاروں کے اثر، کسی ملک کے عرض بلد اور اس کی زمین کی اونچائی یا گہرائی کو ظاہر کرتا ہے۔"
