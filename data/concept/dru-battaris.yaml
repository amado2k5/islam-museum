  en: "A thing that twines round old oak trees, like fern but smaller; it is hot and dry, and some say it helps paralysis and facial palsy. {cite:canon-ibn-sina-print-v1 p.446}"
  ur: "یہ ایک پودا ہے جو پرانے بلوط کے درختوں پر لپٹتا ہے، سرخس جیسا مگر چھوٹا؛ یہ گرم اور خشک ہے، اور کہا گیا ہے کہ فالج اور لقوہ میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.446}"
