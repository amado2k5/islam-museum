label:
  ar: "درو بطارس"
  en: "Dru battaris (oak fern)"
  ur: "درو بطارس ⁦(بلوط کا سرخس)⁩"
  es: "Dru battaris (helecho de roble)"
  fr: "Dru battaris (fougère chêne)"
  tr: "Drew Batars"
  id: "Drew Batars"
summary:
  ar: "شيء يلتفّ على شجر البلوط العتيق يشبه السرخس، أصغر منه، وهو حار يابس، وقيل إنه ينفع من الفالج واللقوة. {cite:canon-ibn-sina-print-v1 p.446}"
  en: "A thing that twines round old oak trees, like fern but smaller; it is hot and dry, and some say it helps paralysis and facial palsy. {cite:canon-ibn-sina-print-v1 p.446}"
  ur: "یہ ایک پودا ہے جو پرانے بلوط کے درختوں پر لپٹتا ہے، سرخس جیسا مگر چھوٹا؛ یہ گرم اور خشک ہے، اور کہا گیا ہے کہ فالج اور لقوہ میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.446}"
  es: "Una planta que se enrosca alrededor de viejos robles, parecida a un helecho pero más pequeña; es cálida y seca, y algunos dicen que ayuda con la parálisis y la parálisis facial. {cite:canon-ibn-sina-print-v1 p.446}"
  fr: "Une plante qui s'enroule autour des vieux chênes, comme une fougère mais plus petite; elle est chaude et sèche, et certains disent qu'elle soulage la paralysie et la paralysie faciale. {cite:canon-ibn-sina-print-v1 p.446}"
  tr: "Antik meşe ağaçlarını saran bir şey, ondan daha küçük, sıcak ve kuru bir eğrelti otuna benzer, felç ve zayıflık için faydalı olduğu söylenir. {cite:canon-ibn-sina-print-v1 s.446}"
  id: "Sesuatu yang melilit pohon ek kuno mirip pakis, lebih kecil darinya, panas dan kering, dan dikatakan bermanfaat untuk kelumpuhan dan kelemahan. {cite:canon-ibn-sina-print-v1 hlm.446}"
