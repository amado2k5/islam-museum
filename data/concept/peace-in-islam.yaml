id: concept/peace-in-islam
class: concept
kind: ethical
label:
  ar: السلام في الإسلام
  en: "Peace in Islam"
  es: "Paz en el Islam"
  fr: "Paix en Islam"
  ur: "اسلام میں امن"
  tr: "İslam'da Barış"
  id: "Perdamaian dalam Islam"
summary:
  ar: "يعرض محمود حمدي زقزوق تصورا إسلاميا للسلام في ثلاث دوائر متداخلة: السلام النفسي، ثم السلام مع الله بالعقيدة، ثم السلام مع الناس والعالم، ويقرر أن الإسلام والسلام من أصل لغوي واحد، وأن تحية المسلمين بالسلام ومقتضى التسليم في الصلاة يعبران عن أمنيتهم بالسلام للعالم {cite:hatha-huwa-al-islam-azhar p. 66} {cite:hatha-huwa-al-islam-azhar p. 67}. ويرى أن اختلاف الألوان والأجناس واللغات مقصود للتعارف لا للنزاع، وأن الأديان مصدرها واحد {cite:hatha-huwa-al-islam-azhar p. 67} {cite:hatha-huwa-al-islam-azhar p. 68}. ويعد العدل أقصر طريق إلى السلام، ويضرب مثلا بمعاناة الشعب الفلسطيني، ويدعو إلى نشر ثقافة السلام عبر الإعلام والمدارس {cite:hatha-huwa-al-islam-azhar p. 69} {cite:hatha-huwa-al-islam-azhar p. 70}. ويذكر المؤلف أن الحروب الأوروبية بين 1914 و1945 أودت بأكثر من ستين مليون إنسان بحسب ما يورده، وهو رقم يحتاج إلى تحقق من مصدر تاريخي {cite:hatha-huwa-al-islam-azhar p. 70}."
  en: "Mahmud Hamdi Zaqzuq presents peace in Islam as three overlapping circles: inner peace, peace with God through faith, and peace with people and the world. He notes the shared root of Islam and salam, argues that difference of peoples is for mutual knowing, not for conflict, and names justice as the shortest road to peace (pp. 66-70). The war-casualty figure he gives for Europe is his own and is flagged for checking."
  es: "Mahmud Hamdi Zaqzuq presenta la paz en el Islam como tres círculos superpuestos: paz interior, paz con Dios a través de la fe y paz con las personas y el mundo. Destaca la raíz común del Islam y del salam (saludo), argumenta que la diferencia entre los pueblos debe propiciar el conocimiento mutuo, no el conflicto, y señala la justicia como el camino más corto hacia la paz (págs. 66-70). La cifra de bajas de guerra que proporciona para Europa es suya y se indica para su verificación."
  fr: "Mahmud Hamdi Zaqzuq présente la paix en islam comme trois cercles interdépendants: la paix intérieure, la paix avec Dieu par la foi et la paix avec les hommes et le monde. Il souligne la racine commune de l’islam et du salam, affirme que la différence entre les peuples est source de connaissance mutuelle et non de conflit, et désigne la justice comme le chemin le plus direct vers la paix (p. 66-70). Le chiffre des victimes de guerre qu’il avance pour l’Europe est une estimation personnelle et mérite d’être vérifié."
  ur: "محمود حمدی زقزوق اسلام میں امن کو تین متواتر دائروں کے طور پر پیش کرتا ہے: اندرونی امن، ایمان کے ذریعے خدا کے ساتھ امن، اور لوگوں اور دنیا کے ساتھ امن۔ وہ اسلام اور سلام کی مشترکہ جڑ کو نوٹ کرتا ہے، دلیل دیتا ہے کہ لوگوں کا اختلاف باہمی جاننے کے لیے ہے، تنازعہ کے لیے نہیں، اور انصاف کو امن کا مختصر ترین راستہ قرار دیتا ہے ⁦(صفحہ 66-70)⁩۔ وہ یورپ کے لیے جو جنگی ہلاکتوں کا اعداد و شمار دیتا ہے وہ اس کا اپنا ہے اور اسے چیک کرنے کے لیے جھنڈا لگایا جاتا ہے۔"
  tr: "Mahmud Hamdi Zaqzouk, İslami bir barış kavramını üç birbirine bağlı çevrede sunar: psikolojik barış, sonra inanç yoluyla Tanrı ile barış, ardından insanlarla ve dünyayla barış. İslam ve barışın tek bir dilsel kökene sahip olduğunu, Müslümanları barış ile selamlamanın ve dua sırasında teslimiyet zorunluluğunun dünyaya barış dileklerini ifade ettiğini belirtir {cite:hatha-huwa-al-islam-azhar s. 66} {cite:hatha-huwa-al-islam-azhar s. 67}. Renk, cinsiyet ve dil farklılıklarının çatışma için değil, tanıdıklık için yapıldığına ve dinlerin aynı kaynağa sahip olduğunu belirtir {cite:hatha-huwa-al-islam-azhar s. 67} {cite:hatha-huwa-al-islam-azhar s. 68}. Adalet, barışa giden en kısa yol olarak kabul edilir, Filistin halkının çektiği acıları örnek gösterir ve medya ile okullar aracılığıyla barış kültürünün yayılmasını çağrıda bulunur {cite:hatha-huwa-al-Islam-azhar s. 69} {cite:hatha-huwa-al-islam-azhar s. 70}. Yazar, kaynaklarına göre 1914-1945 yılları arasındaki Avrupa savaşlarının altmış milyondan fazla can kaybettiğini belirtir; bu rakamın tarihsel bir kaynaktan doğrulanması gerekir {cite:hatha-huwa-al-Islam-azhar s. 70}."
  id: "Mahmoud Hamdi Zaqzouq menyajikan konsep perdamaian Islam dalam tiga lingkaran yang saling terkait: perdamaian psikologis, kemudian damai dengan Tuhan melalui iman, kemudian perdamaian dengan manusia dan dunia. Ia menyatakan bahwa Islam dan perdamaian memiliki satu asal linguistik, dan bahwa menyambut Muslim dengan damai serta tunduk dalam doa mengungkapkan keinginan mereka untuk perdamaian kepada dunia {cite:hatha-huwa-al-islam-azhar hlm. 66} {cite:hatha-huwa-al-islam-azhar hlm. 67}. Ia percaya bahwa perbedaan warna, gender, dan bahasa dimaksudkan untuk saling berkenalan, bukan untuk konflik, dan bahwa agama-agama memiliki sumber yang sama {cite:hatha-huwa-al-islam-azhar hlm. 67} {cite:hatha-huwa-al-islam-azhar hlm. 68}. Keadilan dianggap sebagai jalan terpendek menuju perdamaian, dengan menyoroti penderitaan rakyat Palestina sebagai contoh, dan menyerukan penyebaran budaya perdamaian melalui media dan sekolah {cite:hatha-huwa-al-Islam-azhar hlm. 69} {cite:hatha-huwa-al-islam-azhar hlm. 70}. Penulis menyebutkan bahwa perang Eropa antara tahun 1914 dan 1945 menewaskan lebih dari enam puluh juta nyawa menurut sumbernya, angka yang memerlukan verifikasi dari sumber sejarah {cite:hatha-huwa-al-Islam-azhar hlm. 70}."
