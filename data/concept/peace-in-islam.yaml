label:
  ar: السلام في الإسلام
  en: "Peace in Islam"
summary:
  ar: "يعرض محمود حمدي زقزوق تصورا إسلاميا للسلام في ثلاث دوائر متداخلة: السلام النفسي، ثم السلام مع الله بالعقيدة، ثم السلام مع الناس والعالم، ويقرر أن الإسلام والسلام من أصل لغوي واحد، وأن تحية المسلمين بالسلام ومقتضى التسليم في الصلاة يعبران عن أمنيتهم بالسلام للعالم {cite:hatha-huwa-al-islam-azhar p. 66} {cite:hatha-huwa-al-islam-azhar p. 67}. ويرى أن اختلاف الألوان والأجناس واللغات مقصود للتعارف لا للنزاع، وأن الأديان مصدرها واحد {cite:hatha-huwa-al-islam-azhar p. 67} {cite:hatha-huwa-al-islam-azhar p. 68}. ويعد العدل أقصر طريق إلى السلام، ويضرب مثلا بمعاناة الشعب الفلسطيني، ويدعو إلى نشر ثقافة السلام عبر الإعلام والمدارس {cite:hatha-huwa-al-islam-azhar p. 69} {cite:hatha-huwa-al-islam-azhar p. 70}. ويذكر المؤلف أن الحروب الأوروبية بين 1914 و1945 أودت بأكثر من ستين مليون إنسان بحسب ما يورده، وهو رقم يحتاج إلى تحقق من مصدر تاريخي {cite:hatha-huwa-al-islam-azhar p. 70}."
  en: "Mahmud Hamdi Zaqzuq presents peace in Islam as three overlapping circles: inner peace, peace with God through faith, and peace with people and the world. He notes the shared root of Islam and salam, argues that difference of peoples is for mutual knowing, not for conflict, and names justice as the shortest road to peace (pp. 66-70). The war-casualty figure he gives for Europe is his own and is flagged for checking."
