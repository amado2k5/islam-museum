  ar: "حارس الشمال"
  en: "The Guardian of the North"
  ur: "حارسِ شمال"
  es: "El Guardián del Norte"
summary:
  ar: "تُسمّى هذه الصورة في الفهرس حارس الشمال، وهي عنده البقّارة. وتأتي كواكبها بعد كواكب قيفاوس مباشرة، وتُعرض مواضعها من الطول والعرض في جدول مقابل، ولم تُنقل أرقامه هنا. {cite:zij-sabi-nallino-byblion pp.247}"
  en: "The catalogue calls this figure the Guardian of the North, and the text gives its name as al-Baqqara. Its stars come directly after those of Cepheus, and their positions in longitude and latitude stand in a table that is not transcribed here. {cite:zij-sabi-nallino-byblion pp.247}"
  ur: "فہرست اس صورت کو حارس الشمال کہتی ہے اور متن کے مطابق اس کا نام البقارہ ہے۔ اس کے ستارے قیفاوس کے ستاروں کے فوراً بعد آتے ہیں، اور ان کے طول و عرض جدول میں ہیں جو یہاں نقل نہیں ہوئے۔ {cite:zij-sabi-nallino-byblion pp.247}"
  es: "El catálogo denomina a esta figura el Guardián del Norte, y el texto la nombra como al-Baqqara. Sus estrellas se encuentran justo después de las de Cefeo, y sus posiciones en longitud y latitud figuran en una tabla que no se transcribe aquí. {cite:zij-sabi-nallino-byblion pp.247}"
