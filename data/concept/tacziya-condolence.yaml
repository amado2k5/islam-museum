  ur: "تعزیت (پرسا دینا)"
summary:
  ar: "التعزية لغة مصدر عزّى، أي صبّر المصاب وواساه، وشرعا الأمر بالصبر عليه مع وعد الأجر والتحذير من الوزر والدعاء للميت بالمغفرة وللمصاب بجبر المصيبة، ولا يخرج الاصطلاح عن اللغة. ولا خلاف بين الفقهاء في استحبابها لمن أصابته مصيبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5451} وتعزى أهل المصيبة كبارا وصغارا ذكورا وإناثا، إلا الصغير الذي لا يعقل، والشابة فلا يعزيها إلا النساء ومحارمها خوف الفتنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5452} وجمهور الفقهاء على أن مدتها ثلاثة أيام، والأفضل أن تكون بعد الدفن، ويكره الجلوس لها في المسجد، وعند الشافعية والحنابلة يكره اجتماع أهل الميت لتلقي المعزين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5453} ويسن لجيران أهل الميت أن يصنعوا لهم طعاما، ويكره لأهل الميت أن يصنعوا الطعام للناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} وفي صيغتها يذكر ما روي عن الإمام أحمد من الدعاء بالرحمة والأجر، وأن المسلم يعزى بالكافر عند الشافعية وأبي حنيفة في رواية، ويمنعه مالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5453}"
  en: "Ta'ziya is, in language, the consoling of a mourner, and in law the urging of patience with the promise of reward, the warning against wrongdoing, a prayer for the dead person's forgiveness and for the mourner's relief. The jurists agree it is recommended for anyone stricken by a loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5451} Mourners of every age and sex are consoled, except an infant who does not understand; a young woman is consoled only by women or her unmarriageable kin, for fear of temptation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5452} Most jurists fix its period at three days and prefer it after the burial; the Shafiis and Hanbalis dislike mourners gathering to receive visitors, and sitting for it in a mosque is disliked by all. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5453} Neighbours are recommended to send food to the bereaved family, while the family preparing food for visitors is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} Formulas are not fixed; the book cites a short prayer for mercy and reward reported from Ahmad. Condoling a Muslim with a non-Muslim is allowed by al-Shafii and one view of Abu Hanifa, and forbidden by Malik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5453}"
  ur: "تعزیت لغت میں کسی صدمہ زدہ کو تسلی دینے اور صبر کی تلقین کرنے کو کہتے ہیں، اور شریعت میں اس میں صبر کی تلقین، اجر کا وعدہ، گناہ سے ڈرانا، میت کی مغفرت اور صاحبِ مصیبت کے لیے دعا شامل ہے۔ فقہاء کے نزدیک جو شخص کسی مصیبت میں مبتلا ہو اس کی تعزیت مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5451} تعزیت ہر عمر اور جنس کے سوگواروں کی کی جاتی ہے، سوائے اس بچے کے جو سمجھ نہ رکھتا ہو، اور جوان عورت کی تعزیت صرف عورتیں اور اس کے محرم کریں، فتنے کے خوف سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5452} جمہور کے نزدیک اس کی مدت تین دن ہے اور افضل یہ ہے کہ دفن کے بعد ہو؛ مسجد میں تعزیت کے لیے بیٹھنا مکروہ ہے اور شافعیہ و حنابلہ کے نزدیک اہلِ میت کا تعزیت وصول کرنے کے لیے جمع ہونا مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5453} پڑوسیوں کے لیے مستحب ہے کہ اہلِ میت کے لیے کھانا بنائیں، جبکہ اہلِ میت کا لوگوں کے لیے کھانا بنانا مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5454} الفاظ کی کوئی مقرر صورت نہیں، اور مسلمان کی تعزیت کافر سے کرنے کے بارے میں امام شافعی اور امام ابوحنیفہ کی ایک روایت جواز کی ہے جبکہ امام مالک منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5453}"
