id: concept/diseases-of-composition
class: concept
kind: scientific
label: { ar: "أمراض التركيب عند ابن سينا", en: "Diseases of composition in the Canon", ur: "قانون میں ترکیب کی بیماریاں", es: "Enfermedades de composición en el canon", fr: "Maladies de la composition dans le Canon", tr: "İbn Sina'ya göre yapısal hastalıklar", id: "Penyakit struktural menurut Avicenna" }
summary:
  ar: "في الفصل الثالث يحصر ابن سينا أمراض التركيب في أربعة أجناس: أمراض الخلقة والمقدار والعدد والوضع، ويقسم أمراض الخلقة إلى الشكل والمجاري والأوعية والتجاويف وصفائح الأعضاء {cite:canon-ibn-sina-print-v1 p.105}."
  en: "In the third chapter Ibn Sina limits the diseases of composition to four genera, those of constitution, quantity, number and position, and divides those of constitution into shape, channels, vessels and cavities, and the surfaces of organs {cite:canon-ibn-sina-print-v1 p.105}."
  es: "En el tercer capítulo, Ibn Sina limita las enfermedades de composición a cuatro géneros: las de constitución, cantidad, número y posición, y divide las de constitución en forma, canales, vasos y cavidades, y superficies de órganos {cite:canon-ibn-sina-print-v1 p.105}."
  fr: "Dans le troisième chapitre, Ibn Sina limite les maladies de composition à quatre genres, celles de constitution, de quantité, de nombre et de position, et divise celles de constitution en forme, canaux, vaisseaux et cavités, et les surfaces des organes {cite:canon-ibn-sina-print-v1 p.105}."
  ur: "تیسرے باب میں ابن سینا نے ساخت کی بیماریوں کو چار نسلوں تک محدود کیا ہے، جو کہ آئین، مقدار، تعداد اور مقام کی ہیں، اور آئین کی بیماریوں کو شکل، نالیوں، وریدوں اور گہاوں اور اعضاء کی سطحوں میں تقسیم کیا ہے۔"
  tr: "Üçüncü bölümde İbn Sina, yapısal hastalıkları dört türe ayırır: yaratılış, miktar, sayı ve konum hastalıkları. Yaratılış hastalıklarını biçim, drenaj, damarlar, boşluklar ve organ plakalarına ayırır {atıf:kanon-ibn-sina-print-v1 s.105}."
  id: "Pada bab ketiga, Ibn Sina mengklasifikasikan penyakit struktural menjadi empat jenis: penyakit penciptaan, jumlah, jumlah, dan posisi. Ia membagi penyakit penciptaan menjadi bentuk, drainase, pembuluh darah, rongga, dan lempeng organ {cite:canon-ibn-sina-print-v1 hlm.105}."
