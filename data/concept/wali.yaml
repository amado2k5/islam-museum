id: concept/wali
class: concept
kind: belief
label:
  ar: الولي
  en: The wali (friend of God)
  ur: ولی
  es: "El wali (amigo de Dios)"
  fr: "Le wali (ami de Dieu)"
  tr: "Koruyucu"
  id: "Sang penjaga"
summary:
  ar: "الولي في العقيدة من أولياء الرحمن؛ تقرر الطحاوية «المؤمنون كلهم أولياء الرحمن وأكرمهم عند الله أطوعهم وأتبعهم لشرعه» و«لا نفضل أحدًا من الأولياء على أحد من الأنبياء» {cite:aqida-tahawiyya §§86,127}."
  en: "The wali in the creed is one of the friends of the Merciful; the Tahawiyya affirms 'all the believers are friends of the Merciful, the noblest to God the most obedient' and 'we do not prefer any wali over any prophet' {cite:aqida-tahawiyya §§86,127}."
  es: "El wali en el credo es uno de los amigos del Misericordioso; el Tahawiyya afirma que \"todos los creyentes son amigos del Misericordioso, los más nobles para Dios son los más obedientes\" y \"no preferimos a ningún wali sobre ningún profeta\" {cite:aqida-tahawiyya §§86,127}."
  fr: "Le wali dans le credo est l'un des amis du Miséricordieux; la Tahawiyya affirme « tous les croyants sont amis du Miséricordieux, les plus nobles envers Dieu les plus obéissants » et « nous ne préférons aucun wali à aucun prophète » {cite: aqida-tahawiyya §§86,127}."
  ur: "عقیدہ میں ولی رحمن کے دوستوں میں سے ہے؛ طحاویہ کا اثبات ہے کہ ''تمام مومنین رحمٰن کے دوست ہیں، خدا کے نزدیک سب سے زیادہ فرمانبردار ہیں'' اور ''ہم کسی ولی کو کسی نبی پر ترجیح نہیں دیتے''۔"
  tr: "İnançtaki aziz, Merhametli'nin dostları arasındadır; El-Tahawiyya şöyle buyurdu: \"Tüm müminler En Merhametli'nin dostları, Allah'ın gözünde en saygılı, en itaatkar ve O'nun kanununa uyanlardır.\" {cite:aqida-tahawiyya §§§86,127}."
  id: "Orang suci dalam ajaran ini termasuk di antara sahabat Yang Penyayang; Al-Tahawiyya menetapkan, \"Semua orang beriman adalah sahabat Yang Maha Penyayang, yang paling dihormati di hadapan Allah, yang paling taat dan mengikuti hukum-Nya,\" dan \"Kami tidak memilih seorang orang suci daripada nabi mana pun.\" {cite:aqida-tahawiyya §§86,127}."
