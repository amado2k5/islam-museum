id: concept/isaba
class: concept
kind: legal
label:
  ar: "العِصَابة"
  en: "The bandage or turban and wiping over it (isaba)"
  ur: "عصابہ (پٹی/عمامہ)"
summary:
  ar: "العصابة في اللغة من العصب، وهو الطي الشديد، وتطلق على العمامة وما يعصب به الجرح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. والمسح على العمامة في الوضوء جائز عند الحنابلة والمالكية بتفصيل عندهم، واستدلوا بحديث المغيرة بن شعبة، والحنفية لا يرون المسح عليها بل يرفعونها ويمسحون الرأس، ويكره السجود على كور العمامة عند الحنفية والمالكية والحنابلة إلا لعذر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}. وذهب الفقهاء إلى مشروعية المسح على ما يعصب به الجرح من اللصوق والجبائر في حالة العذر، بدلاً من الغسل أو التيمم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}."
  en: "In the lexicon, isaba comes from 'asb, a tight binding; the word is used for a turban and for what binds a wound {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. The Hanbalis and Malikis allow wiping over the turban in ablution, on the report of al-Mughira ibn Shu'ba, with the Malikis limiting it where removal would harm or be hard; the Hanafis do not allow wiping over it and instead lift it and wipe the head {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. Prostration on the fold of the turban is disliked by the Hanafis, Malikis and Hanbalis unless there is an excuse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}. In cases of need, the jurists permit wiping over a dressing, plaster or splint in place of washing or dry ablution {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}."
