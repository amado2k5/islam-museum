label:
  ar: "العِصَابة"
  en: "The bandage or turban and wiping over it (isaba)"
  ur: "عصابہ ⁦(پٹی/عمامہ)⁩"
  es: "El vendaje o turbante y frotarlo (isaba)"
  fr: "Le bandage ou le turban et le fait de l'essuyer (isaba)"
summary:
  ar: "العصابة في اللغة من العصب، وهو الطي الشديد، وتطلق على العمامة وما يعصب به الجرح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. والمسح على العمامة في الوضوء جائز عند الحنابلة والمالكية بتفصيل عندهم، واستدلوا بحديث المغيرة بن شعبة، والحنفية لا يرون المسح عليها بل يرفعونها ويمسحون الرأس، ويكره السجود على كور العمامة عند الحنفية والمالكية والحنابلة إلا لعذر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}. وذهب الفقهاء إلى مشروعية المسح على ما يعصب به الجرح من اللصوق والجبائر في حالة العذر، بدلاً من الغسل أو التيمم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}."
  en: "In the lexicon, isaba comes from 'asb, a tight binding; the word is used for a turban and for what binds a wound {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. The Hanbalis and Malikis allow wiping over the turban in ablution, on the report of al-Mughira ibn Shu'ba, with the Malikis limiting it where removal would harm or be hard; the Hanafis do not allow wiping over it and instead lift it and wipe the head {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. Prostration on the fold of the turban is disliked by the Hanafis, Malikis and Hanbalis unless there is an excuse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}. In cases of need, the jurists permit wiping over a dressing, plaster or splint in place of washing or dry ablution {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}."
  es: "En el léxico, isaba proviene de 'asb, una atadura apretada; la palabra se usa para un turbante y para lo que venda una herida {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. Los hanbalíes y los malikíes permiten pasar el turbante por encima en la ablución, según el relato de al-Mughira ibn Shu'ba, aunque los malikíes lo limitan a los casos en que quitarlo sería perjudicial o difícil; los hanafíes no permiten pasar el turbante por encima y, en su lugar, lo levantan y se limpian la cabeza {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. La postración sobre el pliegue del turbante es desaconsejada por los hanafíes, malikíes y hanbalíes a menos que exista una excusa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}. En casos de necesidad, los juristas permiten frotar sobre un vendaje, yeso o férula en lugar de lavarse o realizar la ablución seca {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11639}."
  fr: "Dans le lexique, isaba vient de 'asb, un lien serré; le mot est utilisé pour désigner un turban et ce qui panse une plaie {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. Les écoles hanbalite et malikite autorisent le passage du turban lors des ablutions, selon le hadith d'al-Mughira ibn Shu'ba, les malikites limitant cette pratique aux cas où le retrait serait douloureux ou difficile; les hanafites, quant à eux, interdisent ce passage et préconisent de soulever le turban et de s'essuyer la tête {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11638}. Les rites hanafite, malikite et hanbalite désapprouvent la prosternation sur le pli du turban, sauf en cas de nécessité (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11638 et 11639). En cas de besoin, les juristes autorisent le passage d'un pansement, d'un plâtre ou d'une attelle au lieu de se laver ou de faire des ablutions sèches (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.11639)."
