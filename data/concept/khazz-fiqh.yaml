label:
  ar: الخز
  en: Khazz (silk-blend cloth and men's dress)
  ur: خز
summary:
  ar: 'الخز من الثياب ما نُسج من صوف وحرير، أو من إبريسم وحده، وأصله ولد الأرنب لنعومة وبره، وأطلقه الفقهاء على ما سداه حرير ولحمته من غيره أو العكس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} القز أصل الحرير الذي يعمل منه، والخز مركب من الحرير وغيره كالصوف والقطن؛ والديباج ما سداه وقلبه إبريسم، فيحرم لبسه على الرجال من غير ضرورة اتفاقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} الخز الخالص من الحرير حرام على الرجال في غير الحرب من غير ضرورة اتفاقا، ويجوز للنساء؛ لحديث حذيفة «لا تلبسوا الحرير ولا الديباج» وحديث «أحل الذهب والحرير لإناث أمتي وحرم على ذكورها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} المنسوج من الحرير وغيره: الجمهور من الحنفية والشافعية والحنابلة يجيزون لبسه للرجال، وعند المالكية في قول، ونقل أحمد عن أصحاب النبي لبس الخز، وكرهه المالكية احتياطا لأنه من المشتبهات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639} فصل الشافعية في الأصح بين القليل والكثير: إن زاد وزن الحرير حرم، وإن كان الأكثر غيره أو تساويا حل على تفصيل، وقال الحنفية في الصحيح يجوز إذا كانت اللحمة من غير الحرير لأن الثوب بالنسج واللحمة، ويرى ابن عقيل من الحنابلة التحريم إن تساويا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639} تُذكر أحكام الخز في كتب الحظر وباب اللبس، وفي العدة والإحداد، وفي تكفين الميت؛ وتفصيل الحرير في مصطلحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639}'
  en: 'Khazz is cloth woven from wool and silk, or from silk alone; the word is from the fur of the hare, for its softness, and the jurists use it for cloth whose warp is silk and weft is other, or the reverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} Qazz is raw silk, the source of silk; khazz is silk mixed with other fibre such as wool or cotton; dibaj is cloth with silk warp and weft, which men may not wear without necessity by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} Pure silk khazz is forbidden to men outside war without necessity by agreement, and allowed to women, by the report of Hudhayfa "do not wear silk or dibaj" and the report that gold and silk are lawful to the women of my community and forbidden to its men. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} For cloth woven of silk and another fibre, most Hanafis, Shafiis and Hanbalis allow men to wear it, as does one Maliki view; Ahmad reports the Companions wore khazz; the Malikis dislike it, as a precaution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639} The Shafiis, in the sounder view, distinguish by quantity: if silk outweighs, it is forbidden; if the other fibre is more or they are equal, it is allowed; the Hanafis, in the sound view, allow it when the weft is not silk, since cloth is made by weaving; Ibn Aqil of the Hanbalis forbids it when equal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639} The rules on khazz are in the books on prohibitions and dress, and in the sections on the waiting period, mourning and the shroud; see the entry on silk for more. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639}'
  ur: 'خز وہ کپڑا ہے جو اون اور ریشم سے بنا ہو، یا خالص ریشم سے؛ لغوی اصل خرگوش کے بچے سے ہے کیونکہ اس کے بال نرم ہوتے ہیں، اور فقہاء اس کپڑے کے لیے بولتے ہیں جس کا تانا ریشم اور بانا دوسرا ہو یا اس کے برعکس۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} قز ریشم کی اصل ہے، خز ریشم اور دوسری چیز (اون، کپاس) سے ملا ہوتا ہے، اور دیباج وہ ہے جس کا تانا بانا ریشم ہو، جو مردوں کے لیے بغیر ضرورت کے بالاتفاق حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} خالص ریشمی خز مردوں کے لیے جنگ کے سوا بغیر ضرورت حرام اور عورتوں کے لیے جائز ہے، حذیفہ کی روایت «لا تلبسوا الحرير ولا الديباج» اور «أحل الذهب والحرير لإناث أمتي وحرم على ذكورها» کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7638} ریشم اور دوسری چیز سے بنے کپڑے کو جمہور حنفیہ، شافعیہ اور حنابلہ مردوں کے لیے جائز کہتے ہیں، مالکیہ کا ایک قول بھی یہی ہے؛ احمد نے صحابہ کا خز پہننا نقل کیا؛ مالکیہ اسے احتیاطاً مکروہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639} شافعیہ کے اصح قول میں وزن کے لحاظ سے فرق ہے: ریشم زیادہ ہو تو حرام، دوسرا زیادہ ہو یا برابر ہو تو حلال؛ حنفیہ کے صحیح قول میں بانا غیر ریشم ہو تو جائز ہے کیونکہ کپڑا بُنائی سے بنتا ہے؛ ابن عقیل حنبلی برابری پر حرام کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639} خز کے احکام حظر و لباس کے ابواب، عدت و سوگ اور کفن میں مذکور ہیں؛ تفصیل ریشم کے مصطلح میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7639}'
