label: { ar: "رياضة البصر والسمع عند ابن سينا", en: "Exercising the eye and the ear in the Canon", ur: "قانون میں آنکھ اور کان کی ورزش" }
summary:
  ar: "يقول ابن سينا إن أعضاء الغذاء رياضتها تابعة لرياضة سائر البدن، وإن البصر يراض بتأمل الأشياء الدقيقة والنظر إلى المشرفات برفق، وإن السمع يراض بتسمع الأصوات الخفية وفي الندرة بسماع الأصوات العظيمة، ولكل عضو رياضة خاصة سيفصلها في حفظ صحة عضو عضو {cite:canon-ibn-sina-print-v1 pp.223-224}."
  en: "Ibn Sina says the organs of nourishment are exercised along with the rest of the body, that sight is exercised by studying fine things and gently looking at high places, that hearing is exercised by listening for faint sounds and rarely for loud ones, and that each organ has its own exercise which he will give in the account of keeping each organ healthy {cite:canon-ibn-sina-print-v1 pp.223-224}."
