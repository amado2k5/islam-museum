id: concept/exercising-the-eye-and-the-ear
class: concept
kind: scientific
label: { ar: "رياضة البصر والسمع عند ابن سينا", en: "Exercising the eye and the ear in the Canon", ur: "قانون میں آنکھ اور کان کی ورزش", es: "Ejercitar la vista y el oído en el Canon", fr: "Exercer l'œil et l'oreille dans le Canon" }
summary:
  ar: "يقول ابن سينا إن أعضاء الغذاء رياضتها تابعة لرياضة سائر البدن، وإن البصر يراض بتأمل الأشياء الدقيقة والنظر إلى المشرفات برفق، وإن السمع يراض بتسمع الأصوات الخفية وفي الندرة بسماع الأصوات العظيمة، ولكل عضو رياضة خاصة سيفصلها في حفظ صحة عضو عضو {cite:canon-ibn-sina-print-v1 pp.223-224}."
  en: "Ibn Sina says the organs of nourishment are exercised along with the rest of the body, that sight is exercised by studying fine things and gently looking at high places, that hearing is exercised by listening for faint sounds and rarely for loud ones, and that each organ has its own exercise which he will give in the account of keeping each organ healthy {cite:canon-ibn-sina-print-v1 pp.223-224}."
  es: "Ibn Sina dice que los órganos de nutrición se ejercitan junto con el resto del cuerpo, que la vista se ejercita estudiando cosas finas y mirando suavemente a lugares altos, que el oído se ejercita escuchando sonidos débiles y rara vez fuertes, y que cada órgano tiene su propio ejercicio que dará en la descripción de cómo mantener sano cada órgano {cite:canon-ibn-sina-print-v1 pp.223-224}."
  fr: "Ibn Sina dit que les organes de la nourriture sont exercés avec le reste du corps, que la vue est exercée en étudiant les belles choses et en regardant doucement les endroits élevés, que l'ouïe est exercée en écoutant les sons faibles et rarement les sons forts, et que chaque organe a son propre exercice qu'il donnera dans le compte rendu du maintien de la santé de chaque organe {cite:canon-ibn-sina-print-v1 pp.223-224}."
  ur: "ابن سینا کہتا ہے کہ جسم کے باقی اعضاء کے ساتھ غذا کی ورزش کی جاتی ہے، وہ بینائی باریک چیزوں کے مطالعہ کرنے اور اونچی جگہوں کو آہستہ سے دیکھنے سے ہوتی ہے، وہ سماعت کمزور آوازوں کو سننے سے اور شاذ و نادر ہی اونچی آوازوں کو سننے سے ہوتی ہے، اور یہ کہ ہر عضو کی اپنی ورزش ہوتی ہے جسے وہ ہر عضو کو صحت مند رکھنے کے حساب سے دیتا ہے۔ صفحہ 223-224}۔"
