id: concept/zij-sabi-altitude-of-a-star-at-midheaven
class: concept
kind: scientific
label: { ar: "ارتفاع الكوكب في وسط السماء من بعده عن معدل النهار", en: "The altitude of a star at midheaven from its distance from the equator", ur: "ستارے کا وسط السماء میں ارتفاع اس کے معدل النہار سے بعد کے ذریعے", es: "La altitud de una estrella en el centro del cielo a partir de su distancia al ecuador.", fr: "L'altitude d'une étoile au milieu du ciel, calculée à partir de sa distance à l'équateur.", tr: "Gezegenin gökyüzünün ortasındaki yüksekliği, ortalama gündüz süresine olan uzaklığı.", id: "Ketinggian planet di tengah langit, jaraknya dari rata-rata waktu siang hari." }
summary:
  ar: "يبدأ الباب الحادي والعشرون بمعرفة ما مضى من الليل من ساعة قياس أحد الكواكب وبمعرفة الطالع. ومن شروطه معرفة ارتفاع الكوكب في وسط السماء: يؤخذ بعده عن معدل النهار فيُزاد على ارتفاع أول الحمل في ذلك البلد إن كان شمالياً، ويُنقص منه إن كان جنوبياً، والناتج ارتفاعه في وسط السماء. {cite:zij-sabi-nallino-byblion pp.54-55}."
  en: "Chapter 21 begins with finding how much of the night has passed at the time of observing a star, and with finding the ascendant. One of its requirements is the altitude of the star at midheaven: its distance from the equator is added to the altitude of the first of Aries in that place if the distance is northern and taken from it if it is southern, and the result is its altitude at midheaven. {cite:zij-sabi-nallino-byblion pp.54-55}."
  ur: "اکیسواں باب کسی ستارے کی پیمائش کے وقت رات کا گزرا ہوا حصہ اور طالع جاننے سے شروع ہوتا ہے۔ اس کی ایک شرط ستارے کا وسط السماء میں ارتفاع ہے: اس کا معدل النہار سے بعد اس شہر میں حمل کے آغاز کے ارتفاع میں جمع کیا جاتا ہے اگر شمالی ہو اور گھٹایا جاتا ہے اگر جنوبی ہو، اور حاصل وسط السماء میں اس کا ارتفاع ہے۔ {cite:zij-sabi-nallino-byblion pp.54-55}۔"
  es: "El capítulo 21 comienza con el cálculo del tiempo transcurrido de la noche al observar una estrella y con la determinación del ascendente. Uno de los requisitos es la altitud de la estrella en el medio cielo: su distancia al ecuador se suma a la altitud del primero de Aries en esa posición si la distancia es norte, y se resta de esta si es sur; el resultado es su altitud en el medio cielo. {cite:zij-sabi-nallino-byblion pp.54-55}."
  fr: "Le chapitre 21 commence par la détermination de la durée de la nuit au moment de l'observation d'une étoile, et par la recherche de son ascendant. L'une des conditions requises est la hauteur de l'étoile au zénith: sa distance à l'équateur est ajoutée à la hauteur de la première étoile du Bélier à cet endroit si la distance est au nord, et soustraite si elle est au sud; le résultat obtenu correspond à sa hauteur au zénith. {cite:zij-sabi-nallino-byblion pp.54-55}."
  tr: "Yirmi Birinci Bölüm, bir gezegenin ölçümünün yapıldığı saatten itibaren geçen gece süresinin belirlenmesi ve yükselen burcunun tespit edilmesiyle başlar. Bunun ön koşullarından biri, gezegenin meridyendeki yüksekliğini bilmektir: Ortalama güne olan uzaklığı alınır ve eğer kuzeydeyse o konumdaki ilk Koç burcunun yüksekliğine eklenir, eğer güneydeyse çıkarılır ve böylece meridyendeki yüksekliği elde edilir. {cite:zij-sabi-nallino-byblion pp.54-55}."
  id: "Bab Dua Puluh Satu dimulai dengan menentukan waktu malam yang telah berlalu dari jam pengukuran sebuah planet dan menentukan ascendant-nya. Salah satu prasyaratnya adalah mengetahui ketinggian planet di meridian: jaraknya dari rata-rata hari diambil dan ditambahkan ke ketinggian tanda Aries pertama di lokasi tersebut jika berada di utara, dan dikurangi darinya jika berada di selatan, sehingga menghasilkan ketinggiannya di meridian. {cite:zij-sabi-nallino-byblion pp.54-55}."
