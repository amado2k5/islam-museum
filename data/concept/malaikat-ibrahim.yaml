id: concept/malaikat-ibrahim
class: concept
kind: angel
label:
  ar: ملائكة إبراهيم
  en: The Angels of Ibrahim
  ur: ابراہیم کے فرشتے
summary:
  ar: ملائكة بشروا إبراهيم بمولود إسحاق، ثم بعده بمولود يعقوب، وهم الذين نزلوا عليه ضيوفاً في قصته؛ ويروي قصة الضيافة في سورة هود [[passage/quran-11-71|هود 71]] وسورة الحجر [[passage/quran-15-51|الحجر 51]] وسورة الذاريات [[passage/quran-51-24|الذاريات 24]].
  en: Angels who gave Ibrahim glad tidings of the birth of Ishaq and then of Ya'qub, and the ones who visited him as guests in his story; the guest story is told in Hud [[passage/quran-11-71|11:71]], al-Hijr [[passage/quran-15-51|15:51]] and al-Dhariyat [[passage/quran-51-24|51:24]].
  ur: وہ فرشتے جنہوں نے ابراہیم کو اسحاق کی پیدائش کی بشارت دی پھر اس کے بعد یعقوب کی، اور وہی ہیں جو اس کی کہانی میں مہمان بن کر آئے؛ مہمانوں کی کہانی سورۃ ہود [[passage/quran-11-71|هود 71]] اور سورۃ حجر [[passage/quran-15-51|الحجر 51]] اور سورۃ الذاریات [[passage/quran-51-24|الذاریات 24]] میں آئی ہے۔
