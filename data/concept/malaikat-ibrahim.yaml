id: concept/malaikat-ibrahim
class: concept
kind: angel
label:
  ar: ملائكة إبراهيم
  en: The Angels of Ibrahim
  ur: ابراہیم کے فرشتے
  es: "Los ángeles de Ibrahim"
  fr: "Les anges d'Ibrahim"
  tr: "İbrahim'in Melekleri"
  id: "Malaikat Abraham"
summary:
  ar: ملائكة بشروا إبراهيم بمولود إسحاق، ثم بعده بمولود يعقوب، وهم الذين نزلوا عليه ضيوفاً في قصته؛ ويروي قصة الضيافة في سورة هود [[passage/quran-11-71|هود 71]] وسورة الحجر [[passage/quran-15-51|الحجر 51]] وسورة الذاريات [[passage/quran-51-24|الذاريات 24]].
  en: Angels who gave Ibrahim glad tidings of the birth of Ishaq and then of Ya'qub, and the ones who visited him as guests in his story; the guest story is told in Hud [[passage/quran-11-71|11:71]], al-Hijr [[passage/quran-15-51|15:51]] and al-Dhariyat [[passage/quran-51-24|51:24]].
  ur: وہ فرشتے جنہوں نے ابراہیم کو اسحاق کی پیدائش کی بشارت دی پھر اس کے بعد یعقوب کی، اور وہی ہیں جو اس کی کہانی میں مہمان بن کر آئے؛ مہمانوں کی کہانی سورۃ ہود [[passage/quran-11-71|هود 71]] اور سورۃ حجر [[passage/quran-15-51|الحجر 51]] اور سورۃ الذاریات [[passage/quran-51-24|الذاریات 24]] میں آئی ہے۔
  es: "Ángeles que le dieron a Ibrahim la buena nueva del nacimiento de Ishaq y luego de Ya'qub, y aquellos que lo visitaron como huéspedes en su historia; la historia de los huéspedes se cuenta en Hud [[passage/quran-11-71|11:71]], al-Hijr [[passage/quran-15-51|15:51]] y al-Dhariyat [[passage/quran-51-24|51:24]]."
  fr: "Les anges qui ont annoncé à Ibrahim la bonne nouvelle de la naissance d'Ishaq puis de Ya'qub, et ceux qui lui ont rendu visite en tant qu'invités dans son histoire; l'histoire des invités est racontée dans Hud [[passage/quran-11-71|11:71]], al-Hijr [[passage/quran-15-51|15:51]] et al-Dhariyat [[passage/quran-51-24|51:24]]."
  tr: "Melekler, İbrahim'e İshak'ın doğumunun müjdesini verdiler ve ardından Yakup'un doğumunu onlar anlattı; misafirperverlik hikayesi Hud Suresi'nde [[pasaj/kuran-11-71|Hud 71], Hicr Suresi [[pasaj/kuran-15-51|Hicr 51]] ve Adh-Dhariyat Suresi'nde [[pasaj/kuran-51-24|Adh-Dhariyat 24]]'de anlatılır."
  id: "Para malaikat menyampaikan kabar baik kepada Abraham tentang kelahiran Ishak, dan setelahnya kelahiran Yakub, dan merekalah yang turun kepadanya sebagai tamu dalam kisahnya; kisah keramahan ini diceritakan dalam Surah Hud [[ayat/al-Qur'an-11-71|Hud 71], Surah Al-Hijr [[ayat/al-quran-15-51|Al-Hijr 51]] dan Surah Adh-Dhariyat [[ayat/al-Qur'an-51-24|Adh-Dhariyat 24]]."
