summary:
  ar: "الحيوان في القرآن الحياة التي لا يعقبها موت، واصطلاحا الجسم النامي الحساس المتحرك بالإرادة، ويفرق عن الدابة والبهيمة والنعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} وأصل حل الأكل في الحيوان، إلا الخنزير فحرام بالإجماع، واختلف الفقهاء في ذوات الناب من السباع وذوات المخلب من الطير، فجمهورهم يمنعونها، والمالكية في رواية يجيزون جميع الحيوان ما عدا الآدمي والخنزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} وذكاة المأكول الذبح المعتبر، والسمك والجراد لا يحتاجان ذكاة، والزكاة واجبة في النعم وحدها، والإنفاق على الحيوان واجب على مالكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7504}  وتضمن الدابة ما وطئته بيدها أو رجلها على راكبها عند الجمهور، ويضمن الحيوان وما يقع عليه من جناية، وقضى عمر في عين الدابة بربع القيمة؛ وتفصّل مواطن الحيوان في البيع والسلم والشفعة والإجارة واللقطة والصيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
  en: "Hayawan (animal) in the Quran is the life that does not end in death; technically it is a growing, sensing body that moves by will, distinguished from dabba (a creature that crawls), bahima (a beast without discernment) and ni'am (grazing livestock). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} Eating is lawful for animals in general, except pigs by consensus; the majority forbid beasts with fangs and birds with talons, while a Maliki view allows every animal except humans and pigs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} Lawful animals must be slaughtered properly, fish and locusts need no slaughter; zakat is due on camels, cattle and sheep only; and the owner must feed and water his beasts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7504}  Most jurists hold a rider liable for what the beast tramples with its hoof or foot but not for what it kicks with its tail or leg; a beast injured is compensated, and Umar fixed a quarter of its value for an injured eye; other rulings on animals are placed under sale, salam, pre-emption, hire, found property and hunting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
  ur: "حیوان قرآن میں اس زندگی کو کہتا ہے جس کے بعد موت نہ ہو؛ اصطلاح میں وہ بڑھنے والا، حس رکھنے والا اور ارادے سے حرکت کرنے والا جسم ہے، اور یہ دابہ، بہیمہ اور نعم سے ممیز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} حیوان کا کھانا اصل میں حلال ہے، سوائے خنزیر کے جو بالاتفاق حرام ہے؛ جمہور نوکیلے دانت والے درندوں اور پنجے والے پرندوں کو حرام کہتے ہیں، جبکہ مالکیہ کا ایک قول انسان اور خنزیر کے سوا ہر حیوان کو جائز کہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} حلال جانور کو شرعی ذبح سے ذبح کیا جائے گا، مچھلی اور ٹڈی کو ذبح کی ضرورت نہیں؛ زکوٰۃ صرف نعم ⁦(اونٹ، گائے، بکری)⁩ میں واجب ہے، اور مالک پر اپنے جانوروں کو چارہ اور پانی دینا واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7504}  جمہور کے نزدیک سوار جانور کے قدم یا پاؤں سے کچلے ہوئے نقصان کا ضامن ہے، دم یا ٹانگ کی لات کا نہیں؛ زخمی جانور کا تاوان ہوتا ہے، اور عمر رضی نے آنکھ کے ضیاع پر قیمت کا چوتھائی مقرر کیا؛ جانوروں کے دیگر احکام بیع، سلم، شفعہ، اجارہ، لقطہ اور شکار کے ابواب میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
  es: "Hayawan (animal) en el Corán es la vida que no termina en la muerte; técnicamente es un cuerpo que crece, siente y se mueve por voluntad, distinguido de dabba (una criatura que se arrastra), bahima (una bestia sin discernimiento) y ni'am (ganado que pasta). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} Comer es lícito para los animales en general, excepto los cerdos por consenso; la mayoría prohíbe las bestias con colmillos y las aves con garras, mientras que una visión malikí permite todos los animales excepto los humanos y los cerdos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} Los animales lícitos deben ser sacrificados adecuadamente, los peces y las langostas no necesitan ser sacrificados; el zakat se debe solo sobre los camellos, el ganado vacuno y las ovejas; y el dueño debe alimentar y dar de beber a sus bestias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7504} La mayoría de los juristas consideran al jinete responsable de lo que la bestia pisotea con su pezuña o pie, pero no de lo que patea con su cola o pierna; una bestia herida recibe una compensación, y Umar fijó una cuarta parte de su valor por un ojo lesionado; otras normas sobre animales se incluyen en venta, salam, derecho de tanteo, alquiler, bienes encontrados y caza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
  fr: "Dans le Coran, le terme « hayawan » (animal) désigne la vie qui ne s'achève pas avec la mort; il s'agit, en termes de théorie, d'un corps en croissance, sensible et se mouvant de sa propre volonté, à distinguer de « dabba » (une créature rampante), « bahima » (une bête dépourvue de discernement) et « ni'am » (le bétail au pâturage). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} La consommation de viande d'animaux est généralement licite, à l'exception des porcs, selon le consensus. La majorité des juristes interdit la consommation de bêtes à crocs et d'oiseaux à serres, tandis que l'école malikite autorise la consommation de tous les animaux, sauf les humains et les porcs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} Les animaux licites doivent être abattus selon le rite rituel; l'abattage des poissons et des sauterelles n'est pas requis; la zakat est due uniquement sur les chameaux, les bovins et les moutons. Le propriétaire doit nourrir et abreuver ses bêtes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7504} La plupart des juristes tiennent le cavalier responsable des dommages causés par la bête avec son sabot ou son pied, mais non de ceux causés par ses coups de queue ou de patte. Une bête blessée est indemnisée, et Umar a fixé le quart de sa valeur pour un œil blessé. D'autres règles concernant les animaux sont classées dans les sections relatives à la vente, au salam, à la préemption, à la location, aux biens trouvés et à la chasse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
  tr: "Kur'an'da hayvan, ölümün ardından gelmediği yaşamdır ve teknik olarak büyüyen, duyarlı, iradesiyle hareket eden bir bedendir; hayvanlar, hayvanlar ve hayvanlardan ayırt edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7503} Domuzlar dışında hayvan yenmenin orijinal olarak yasaktır, oybirliğiyle yasaktır. Hukukçular, hayvanlar arasında dişleri olanlar ile kuş pençeleri olanlar konusunda farklı görüşlere sahiptir; çoğunlukları bunları yasaklarken, Maliki rivayeti insan ve domuzlar hariç tüm hayvanlara izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7503} Yiyecek üzerindeki zekat, balık ve çekirgeler için zekat gerekmez, zekat sadece bereketler üzerine zorunludur ve hayvan için harcama sahibi tarafından zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7504} Hayvan, biniciğinin üzerine el veya ayağıyla bastığı şeyden sorumludur ve hayvan kendisine karşı işlenen herhangi bir suçtan sorumludur. Bir ömür boyunca hayvanın mülkünde değerinin dörtte biri kadar geçirilir; hayvanın konumları satış, selamlaşma, önlem, kiralama, yakalama ve avlanma bölümlerinde detaylandırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7505}"
  id: "Dalam Al-Qur'an, hewan adalah kehidupan yang tidak diikuti oleh kematian, dan secara teknis adalah tubuh yang tumbuh, sensitif, bergerak dengan kehendak, dibedakan dari binatang, binatang, dan hewan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7503} Izin asli memakan hewan kecuali babi, yang secara bulat dilarang. Para ahli hukum berbeda pendapat mengenai yang memiliki taring di antara hewan dan yang memiliki cakar dari burung; mayoritas mereka melarangnya, sementara narasi Maliki mengizinkan semua hewan kecuali manusia dan babi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7503} Zakat atas makanan dianggap sebagai penyembelihan, ikan dan belalang tidak memerlukan zakat, zakat hanya wajib atas berkat, dan pengeluaran untuk hewan wajib dilakukan oleh pemiliknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7504} Hewan bertanggung jawab atas apa yang telah diinjak penunggangnya dengan tangan atau kaki di depan umum, dan hewan tersebut bertanggung jawab atas kejahatan yang dilakukan terhadapnya. Seumur hidup dihabiskan di properti hewan tersebut dengan seperempat nilai; lokasi hewan dirinci dalam penjualan, salam, preemption, sewa, penangkapan, dan perburuan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
