summary:
  ar: "الحيوان في القرآن الحياة التي لا يعقبها موت، واصطلاحا الجسم النامي الحساس المتحرك بالإرادة، ويفرق عن الدابة والبهيمة والنعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} وأصل حل الأكل في الحيوان، إلا الخنزير فحرام بالإجماع، واختلف الفقهاء في ذوات الناب من السباع وذوات المخلب من الطير، فجمهورهم يمنعونها، والمالكية في رواية يجيزون جميع الحيوان ما عدا الآدمي والخنزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} وذكاة المأكول الذبح المعتبر، والسمك والجراد لا يحتاجان ذكاة، والزكاة واجبة في النعم وحدها، والإنفاق على الحيوان واجب على مالكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7504}  وتضمن الدابة ما وطئته بيدها أو رجلها على راكبها عند الجمهور، ويضمن الحيوان وما يقع عليه من جناية، وقضى عمر في عين الدابة بربع القيمة؛ وتفصّل مواطن الحيوان في البيع والسلم والشفعة والإجارة واللقطة والصيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
  en: "Hayawan (animal) in the Quran is the life that does not end in death; technically it is a growing, sensing body that moves by will, distinguished from dabba (a creature that crawls), bahima (a beast without discernment) and ni'am (grazing livestock). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} Eating is lawful for animals in general, except pigs by consensus; the majority forbid beasts with fangs and birds with talons, while a Maliki view allows every animal except humans and pigs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} Lawful animals must be slaughtered properly, fish and locusts need no slaughter; zakat is due on camels, cattle and sheep only; and the owner must feed and water his beasts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7504}  Most jurists hold a rider liable for what the beast tramples with its hoof or foot but not for what it kicks with its tail or leg; a beast injured is compensated, and Umar fixed a quarter of its value for an injured eye; other rulings on animals are placed under sale, salam, pre-emption, hire, found property and hunting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
  ur: "حیوان قرآن میں اس زندگی کو کہتا ہے جس کے بعد موت نہ ہو؛ اصطلاح میں وہ بڑھنے والا، حس رکھنے والا اور ارادے سے حرکت کرنے والا جسم ہے، اور یہ دابہ، بہیمہ اور نعم سے ممیز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} حیوان کا کھانا اصل میں حلال ہے، سوائے خنزیر کے جو بالاتفاق حرام ہے؛ جمہور نوکیلے دانت والے درندوں اور پنجے والے پرندوں کو حرام کہتے ہیں، جبکہ مالکیہ کا ایک قول انسان اور خنزیر کے سوا ہر حیوان کو جائز کہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} حلال جانور کو شرعی ذبح سے ذبح کیا جائے گا، مچھلی اور ٹڈی کو ذبح کی ضرورت نہیں؛ زکوٰۃ صرف نعم (اونٹ، گائے، بکری) میں واجب ہے، اور مالک پر اپنے جانوروں کو چارہ اور پانی دینا واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7504}  جمہور کے نزدیک سوار جانور کے قدم یا پاؤں سے کچلے ہوئے نقصان کا ضامن ہے، دم یا ٹانگ کی لات کا نہیں؛ زخمی جانور کا تاوان ہوتا ہے، اور عمر رضی نے آنکھ کے ضیاع پر قیمت کا چوتھائی مقرر کیا؛ جانوروں کے دیگر احکام بیع، سلم، شفعہ، اجارہ، لقطہ اور شکار کے ابواب میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7505}"
