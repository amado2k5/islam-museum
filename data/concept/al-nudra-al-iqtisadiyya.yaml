id: concept/al-nudra-al-iqtisadiyya
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: الندرة الاقتصادية
  en: Economic scarcity
  es: "escasez económica"
  fr: "pénurie économique"
  ur: "معاشی قلت"
  tr: "Ekonomik kıtlık"
  id: "Kelaparan ekonomi"
summary:
  ar: "يعرّف قعدات المشكلة الاقتصادية الحديثة بأنها نضوب الموارد ومحدوديتها، أو ما يسمى الندرة السلعية {cite:qadan-manhaj-iqtisad-quran p. 57}. ويعدّد سبعة أسباب لها: تعدد الرغبات، والخلط بين الحاجات الأساسية وغيرها، وسوء توزيع الإنتاج، وسوء استخدام الموارد، والحرص الزائد، والاحتكار واكتناز الأموال، وأخيراً الأرباح الباهظة {cite:qadan-manhaj-iqtisad-quran p. 57}{cite:qadan-manhaj-iqtisad-quran p. 58}. ويرى أن الندرة لا وجود لها في الفكر الإسلامي، وأن الموارد متوافرة وأن الخلل من سلوك الإنسان {cite:qadan-manhaj-iqtisad-quran p. 59}."
  tr: "Modern ekonomik sorunun temel nedenleri, kaynakların tükenmesi ve kısıtlanması ya da meta kıtlığı olarak adlandırılan durum {cite:qadan-manhaj-iqtisad-kur'an s. 57} olarak tanımlanır. Bunun yedi nedenini sıralar: çoklu arzular, temel ihtiyaçların diğerleriyle karıştırılması, üretimin kötü dağılımı, kaynakların kötüye kullanımı, aşırı açgözlülük, tekel ve para biriktirilmesi, ve nihayetinde aşırı kârlar {cite:qadan-manhaj-iqtisad-kuran s. 57}{cite:qadan-manhaj-iqtisad-kuran s. 58}. İslami düşüncede kıtlığın olmadığına, kaynakların mevcut olduğuna ve dengesizliğin insan davranışının bir parçası olduğuna inanır {cite:qadan-manhaj-iqtisad-kuran s. 59}."
  id: "Penyebab mendasar dari masalah ekonomi modern didefinisikan sebagai pengurasan dan pembatasan sumber daya atau situasi yang disebut kelangkaan komoditas {cite:qadan-manhaj-iqtisad-qur'an hlm. 57}. Buku ini mencantumkan tujuh alasan untuk hal ini: keinginan ganda, pencampuran kebutuhan dasar dengan kebutuhan lain, distribusi produksi yang buruk, penyalahgunaan sumber daya, keserakahan berlebihan, monopoli dan akumulasi uang, dan pada akhirnya keuntungan berlebihan {cite:qadan-manhaj-iqtisad-quran hlm. 57}{cite:qadan-manhaj-iqtisad-quran hlm. 58}. Pemikiran Islam percaya bahwa tidak ada kelangkaan, sumber daya ada, dan ketidakseimbangan adalah bagian dari perilaku manusia {cite:qadan-manhaj-iqtisad-quran hlm. 59}."
