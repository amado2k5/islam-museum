  en: Economic scarcity
summary:
  ar: "يعرّف قعدات المشكلة الاقتصادية الحديثة بأنها نضوب الموارد ومحدوديتها، أو ما يسمى الندرة السلعية {cite:qadan-manhaj-iqtisad-quran p. 57}. ويعدّد سبعة أسباب لها: تعدد الرغبات، والخلط بين الحاجات الأساسية وغيرها، وسوء توزيع الإنتاج، وسوء استخدام الموارد، والحرص الزائد، والاحتكار واكتناز الأموال، وأخيراً الأرباح الباهظة {cite:qadan-manhaj-iqtisad-quran p. 57}{cite:qadan-manhaj-iqtisad-quran p. 58}. ويرى أن الندرة لا وجود لها في الفكر الإسلامي، وأن الموارد متوافرة وأن الخلل من سلوك الإنسان {cite:qadan-manhaj-iqtisad-quran p. 59}."
