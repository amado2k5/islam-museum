summary:
  ar: "للرقبة وحدها زوجان من العضل، وعضل الصدر منها باسطة وقابضة ومشتركة، وجملتها عند ابن سينا ثمان وثمانون {cite:canon-ibn-sina-print-v1 pp.67-68}."
  en: "The neck alone has two pairs of muscles, and the chest muscles are expanding, contracting and both, which Ibn Sina counts at eighty-eight in all {cite:canon-ibn-sina-print-v1 pp.67-68}."
  es: "El cuello por sí solo tiene dos pares de músculos, y los músculos del pecho se expanden, se contraen y ambas cosas, que Ibn Sina cuenta en ochenta y ocho en total {cite:canon-ibn-sina-print-v1 pp.67-68}."
  fr: "Le cou à lui seul possède deux paires de muscles, et les muscles de la poitrine se dilatent, se contractent et les deux, ce qu'Ibn Sina compte à quatre-vingt-huit en tout {cite:canon-ibn-sina-print-v1 pp.67-68}."
  ur: "اکیلے گردن میں دو جوڑے پٹھے ہوتے ہیں، اور سینے کے پٹھے پھیلتے، سکڑتے اور دونوں ہوتے ہیں، جن کو ابن سینا نے مجموعی طور پر اٹھاسی شمار کیا ہے۔"
