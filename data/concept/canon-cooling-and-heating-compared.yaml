id: concept/canon-cooling-and-heating-compared
class: concept
kind: scientific
label:
  ar: "المقارنة بين التبريد والتسخين عند ابن سينا"
  en: "Cooling and heating compared in the Canon"
  fr: "Comparaison du refroidissement et du réchauffement dans le Canon"
  ur: "ٹھنڈک اور گرمی کا موازنہ قانون میں"
  es: "Comparación de refrigeración y calefacción en el Canon"
  tr: "İbn Sina'ya göre soğutma ve ısıtma karşılaştırması"
  id: "Perbandingan antara pendinginan dan pemanasan menurut Avicenna"
summary:
  ar: "يقارن ابن سينا بين التبريد والتسخين والترطيب والتيبيس، فيرى أن مدة التبريد والتسخين سواء لكن الخطر في التبريد أكثر لأن الحرارة صديقة الطبيعة، وأن تسخين البارد أسهل في الابتداء وتبريد المسخن أسهل في الانتهاء لأن البرودة البالغة موت من الغريزة أو مساوقة له {cite:canon-ibn-sina-print-v1 p.272}."
  en: "Ibn Sina compares cooling, heating, moistening and drying, holding that cooling and heating last equally long but cooling is the more dangerous because heat is nature's friend, and that heating the cold is easier at the start while cooling the heated is easier at the end, since extreme cold is a death of the innate heat or its companion {cite:canon-ibn-sina-print-v1 p.272}."
  fr: "Ibn Sina compare refroidissement, réchauffement, humidification et dessiccation. Les deux premiers dureraient autant, le froid étant plus dangereux, la chaleur amie de la nature. Réchauffer le froid serait plus facile au début, refroidir le chaud à la fin, le froid extrême étant mort de la chaleur innée ou son compagnon {cite:canon-ibn-sina-print-v1 p.272}."
  es: "Ibn Sina compara el enfriamiento, el calentamiento, la humectación y el secado, sosteniendo que el enfriamiento y el calentamiento duran el mismo tiempo, pero el enfriamiento es más peligroso porque el calor es amigo de la naturaleza, y que calentar lo frío es más fácil al principio, mientras que enfriar lo caliente es más fácil al final, ya que el frío extremo es una muerte del calor innato o de su compañero {cite:canon-ibn-sina-print-v1 p.272}."
  ur: "ابن سینا نے ٹھنڈک، گرم کرنے، نم کرنے اور خشک کرنے کا موازنہ کرتے ہوئے کہا ہے کہ ٹھنڈک اور حرارت یکساں طور پر برقرار رہتی ہے لیکن ٹھنڈک زیادہ خطرناک ہے کیونکہ گرمی فطرت کی دوست ہے، اور یہ کہ سردی کو گرم کرنا شروع میں آسان ہے جبکہ گرم کو ٹھنڈا کرنا آخر میں آسان ہے، کیونکہ شدید سردی پیدائشی حرارت یا اس کے ساتھی کی موت ہے۔"
  tr: "İbn Sina, soğutma, ısıtma, nemlendirme ve sertliği karşılaştırır; soğutma ve ısıtma süresinin aynı olduğunu, ancak soğutmanın tehlikesinin daha büyük olduğunu çünkü ısı doğaya dost olduğunu düşünür. Soğuk ısıtma başlangıcında daha kolaydır ve soğutma ısıtması daha kolaydır çünkü aşırı soğuk içgüdüsel ölüm veya ona eşdeğer bir ölüm {cite:canon-ibn-sina-print-v1 s.272}."
  id: "Ibn Sina membandingkan pendinginan, pemanasan, humidifikasi, dan kekakuan, dengan mempertimbangkan bahwa durasi pendinginan dan pemanasan sama, tetapi bahaya pendinginan lebih besar karena panas bersifat ramah alam. Memanaskan dingin lebih mudah dimulai, dan pemanasan pendinginan lebih mudah diselesaikan karena suhu ekstrem adalah kematian secara naluriah atau setara dengannya {cite:canon-ibn-sina-print-v1 hlm.272}."
