summary:
  ar: "يقارن ابن سينا بين التبريد والتسخين والترطيب والتيبيس، فيرى أن مدة التبريد والتسخين سواء لكن الخطر في التبريد أكثر لأن الحرارة صديقة الطبيعة، وأن تسخين البارد أسهل في الابتداء وتبريد المسخن أسهل في الانتهاء لأن البرودة البالغة موت من الغريزة أو مساوقة له {cite:canon-ibn-sina-print-v1 p.272}."
  en: "Ibn Sina compares cooling, heating, moistening and drying, holding that cooling and heating last equally long but cooling is the more dangerous because heat is nature's friend, and that heating the cold is easier at the start while cooling the heated is easier at the end, since extreme cold is a death of the innate heat or its companion {cite:canon-ibn-sina-print-v1 p.272}."
