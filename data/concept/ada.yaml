label:
  ar: أداء
  en: "Ada' (performance of an obligation within its time)"
summary:
  ar: |-
    الأداء لغةً الإيصال، ويُطلق على الإتيان بالمؤقتات وغيرها، واصطلاحاً عند الجمهور فعل ما دخل وقته قبل خروجه واجباً كان أو مندوباً، وعند الحنفية تسليم عين ما ثبت بالأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1976} ويفرّق عن القضاء بمراعاة الوقت عند الجمهور، وبمراعاة العين عند الحنفية؛ وتختلف الإعادة عنه بعذر أو خلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} والموقت من العبادات مضيق أو موسع، ويجب أداؤه في وقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} وفي الموسع يتعلق الوجوب بالوقت كله عند الجمهور، ويُستحب أول الوقت ويجوز التأخير بالعزم على الفعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} وتُدرك الصلاة بركعة في الوقت عند الجمهور، وبالتكبير أو السجدة عند آخرين، مع استثناء الحنفية لصلاة الصبح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1979}
    وما لم يُوقَّت من الواجبات كالزكاة والكفارات، فوجوب أدائه يتضيق في آخر العمر بغالب الظن، والمندوب يُطلب أداؤه طلباً للثواب، ويجب إتمام ما شُرع فيه عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1980} وشرط الأداء أهلية الأداء مع الإمكان والقدرة، والعاجز يؤدي بالصفة التي يستطيعها، كالصلاة قاعداً أو على جنب، ولا يجب الصوم على الشيخ الفاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1982}
    والنيابة تجوز في العبادات المالية، ولا تجوز في البدنية حال الحياة، واختلف الفقهاء في النيابة عن الميت في الصوم والحج والنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1985}
    وتأخير العبادة عن وقتها بغير عذر يوجب الإثم، ويبقى ما وجب من مال أو حج ديناً في الذمة إن لم يُؤدَّ، وفي تركة الميت تختلف المذاهب على ادائه بغير وصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1986} ويُقضى النفل عند الشافعية والحنابلة على خلاف في الرواتب، وعند الحنفية والمالكية لا يُقضى إلا سنة الفجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1987} ومن امتنع عن الواجب جاحداً عُدّ كافراً يُستتاب، ومن امتنع كسلاً يُعزَّر في البدنيات ويُقاتل في الزكاة، ولا يُقاتل على الحج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988} وأثر الأداء الصحيح براءة الذمة بالاتفاق، وفي الثواب خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988}
  en: |-
    Ada' means, in the lexicon, delivery; it is used both for timed acts and for others. For the majority it is performing, within its time and before the time ends, an act that is obligatory or recommended; for the Hanafis it is handing over the very thing commanded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1976} It is distinguished from qada' (making good after the time): by the time for the majority, by the thing performed for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} Timed acts are narrow or wide, and must be performed in their time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} For a wide time the majority hold the obligation attaches to the whole of it, and early performance is preferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} A unit of prayer within its time secures the prayer for the majority; the Hanafis exempt the dawn prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1979}
    For unrestricted obligations such as zakat and expiations, the duty to perform is fixed at the end of life, when the person thinks he can still perform it. Recommended acts are performed for reward; once begun, they must be completed according to the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1980} Performance requires the ability to perform, and one who cannot perform in the prescribed way does so in the way he can, standing, sitting or lying on his side; an aged person who cannot fast owes no fast. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1982}
    Proxy is allowed for financial acts and not for bodily acts during life; the jurists differ on proxy after death in fasting, pilgrimage and vows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1985}
    Delay past the time of obligation without excuse is a sin: a debt or pilgrimage due but not performed remains in the liability, and the schools differ on payment from the estate without a bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1986} Regular sunnas are made up according to some and not others; the Hanafis and Malikis make up only the dawn sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1987} One who refuses an obligation out of denial is treated as an unbeliever who is asked to repent; one who refuses out of laziness is disciplined in bodily worship and compelled in zakat, but not fought over the pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988} Performance in the lawful form discharges the duty by agreement, and whether it brings reward is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988}
