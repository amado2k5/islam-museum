label:
  ar: أداء
  en: Ada' (performance of an obligation within its time)
summary:
  ar: 'الأداء لغةً الإيصال، ويُطلق على الإتيان بالمؤقتات وغيرها، واصطلاحاً عند الجمهور فعل ما دخل وقته قبل خروجه واجباً كان أو مندوباً، وعند الحنفية تسليم عين ما ثبت بالأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1976} ويفرّق عن القضاء بمراعاة الوقت عند الجمهور، وبمراعاة العين عند الحنفية؛ وتختلف الإعادة عنه بعذر أو خلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} والعبادات المؤقتة وغير المؤقتة تنقسم بحسب وقت أدائها، والموقت منها مضيق أو موسع، ويجب أداؤه في وقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} وفي الموسع يتعلق الوجوب بالوقت كله عند الجمهور، ويستحب أول الوقت ويجوز التأخير بالعزم على الفعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} وتتحقق إدراك الصلاة بركعة في الوقت عند الجمهور، وبالسجدة أو بالتكبير عند آخرين، مع اختلاف الحنفية في صلاة الصبح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1979}'
  en: 'Ada' means, in the lexicon, delivery; it is used for timed acts and for other things. For the majority of jurists it is the performance, within its time and before the time ends, of an act that is obligatory or recommended; for the Hanafis it is the handing over of the very thing commanded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1976} It is distinguished from qada' (making good after the time): the majority by respect for the time, the Hanafis by respect for the thing itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} Acts with a set time are narrow or wide, and must be performed in their time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} For a wide time the majority hold the obligation attaches to the whole of it; early performance is preferred and delay is allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} The majority hold that a unit of the prayer within its time secures the whole prayer, while some hold that a fraction (the bowing alone, or the opening takbir) suffices; the Hanafis exempt the dawn prayer, which must be completed before sunrise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1979}'
