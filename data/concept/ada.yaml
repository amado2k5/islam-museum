id: concept/ada
class: concept
kind: legal
label:
  ar: أداء
  en: "Ada' (performance of an obligation within its time)"
  fr: "Ada' (accomplissement d'une obligation dans le temps imparti)"
  es: "Ada' (cumplimiento de una obligación dentro de su plazo)"
  ur: "عداء ⁦(اپنے وقت کے اندر فرض کی انجام دہی)⁩"
summary:
  ar: |-
    الأداء لغةً الإيصال، ويُطلق على الإتيان بالمؤقتات وغيرها، واصطلاحاً عند الجمهور فعل ما دخل وقته قبل خروجه واجباً كان أو مندوباً، وعند الحنفية تسليم عين ما ثبت بالأمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1976} ويفرّق عن القضاء بمراعاة الوقت عند الجمهور، وبمراعاة العين عند الحنفية؛ وتختلف الإعادة عنه بعذر أو خلل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} والموقت من العبادات مضيق أو موسع، ويجب أداؤه في وقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} وفي الموسع يتعلق الوجوب بالوقت كله عند الجمهور، ويُستحب أول الوقت ويجوز التأخير بالعزم على الفعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} وتُدرك الصلاة بركعة في الوقت عند الجمهور، وبالتكبير أو السجدة عند آخرين، مع استثناء الحنفية لصلاة الصبح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1979}
    وما لم يُوقَّت من الواجبات كالزكاة والكفارات، فوجوب أدائه يتضيق في آخر العمر بغالب الظن، والمندوب يُطلب أداؤه طلباً للثواب، ويجب إتمام ما شُرع فيه عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1980} وشرط الأداء أهلية الأداء مع الإمكان والقدرة، والعاجز يؤدي بالصفة التي يستطيعها، كالصلاة قاعداً أو على جنب، ولا يجب الصوم على الشيخ الفاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1982}
    والنيابة تجوز في العبادات المالية، ولا تجوز في البدنية حال الحياة، واختلف الفقهاء في النيابة عن الميت في الصوم والحج والنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1985}
    وتأخير العبادة عن وقتها بغير عذر يوجب الإثم، ويبقى ما وجب من مال أو حج ديناً في الذمة إن لم يُؤدَّ، وفي تركة الميت تختلف المذاهب على ادائه بغير وصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1986} ويُقضى النفل عند الشافعية والحنابلة على خلاف في الرواتب، وعند الحنفية والمالكية لا يُقضى إلا سنة الفجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1987} ومن امتنع عن الواجب جاحداً عُدّ كافراً يُستتاب، ومن امتنع كسلاً يُعزَّر في البدنيات ويُقاتل في الزكاة، ولا يُقاتل على الحج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988} وأثر الأداء الصحيح براءة الذمة بالاتفاق، وفي الثواب خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988}
  en: |-
    Ada' means, in the lexicon, delivery; it is used both for timed acts and for others. For the majority it is performing, within its time and before the time ends, an act that is obligatory or recommended; for the Hanafis it is handing over the very thing commanded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1976} It is distinguished from qada' (making good after the time): by the time for the majority, by the thing performed for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} Timed acts are narrow or wide, and must be performed in their time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} For a wide time the majority hold the obligation attaches to the whole of it, and early performance is preferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} A unit of prayer within its time secures the prayer for the majority; the Hanafis exempt the dawn prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1979}
    For unrestricted obligations such as zakat and expiations, the duty to perform is fixed at the end of life, when the person thinks he can still perform it. Recommended acts are performed for reward; once begun, they must be completed according to the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1980} Performance requires the ability to perform, and one who cannot perform in the prescribed way does so in the way he can, standing, sitting or lying on his side; an aged person who cannot fast owes no fast. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1982}
    Proxy is allowed for financial acts and not for bodily acts during life; the jurists differ on proxy after death in fasting, pilgrimage and vows. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1985}
    Delay past the time of obligation without excuse is a sin: a debt or pilgrimage due but not performed remains in the liability, and the schools differ on payment from the estate without a bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1986} Regular sunnas are made up according to some and not others; the Hanafis and Malikis make up only the dawn sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1987} One who refuses an obligation out of denial is treated as an unbeliever who is asked to repent; one who refuses out of laziness is disciplined in bodily worship and compelled in zakat, but not fought over the pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988} Performance in the lawful form discharges the duty by agreement, and whether it brings reward is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988}
  fr: "Ada' signifie, dans le lexique, remise ; il s'emploie pour les actes soumis à un temps déterminé comme pour les autres. Pour la majorité, il consiste à accomplir un acte obligatoire ou recommandé dans son temps et avant son expiration ; pour les hanafites, à remettre la chose même qui a été prescrite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1976} Il se distingue du qada' (rattrapage après le temps imparti) par le temps pour la majorité et par la chose accomplie pour les hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} Les actes soumis à un temps déterminé ont une plage étroite ou large et doivent être accomplis dans leur temps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} Pour une plage large, la majorité estime que l'obligation s'attache à tout le temps et que l'accomplissement au début est préférable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} Pour la majorité, une unité de prière dans le temps imparti permet de considérer la prière comme accomplie à temps ; les hanafites font exception pour la prière de l'aube. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1979}\nPour les obligations non limitées comme la zakat et les expiations, le devoir d'accomplissement se fixe à la fin de la vie, lorsque la personne pense pouvoir encore l'accomplir. Les actes recommandés sont accomplis en vue d'une récompense ; une fois commencés, ils doivent être achevés selon les hanafites et les malikites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1980} L'accomplissement exige la capacité d'agir ; celui qui ne peut agir de la manière prescrite agit comme il le peut, debout, assis ou couché sur le côté ; une personne âgée incapable de jeûner n'est pas tenue au jeûne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1982}\nLa procuration est permise pour les actes financiers et non pour les actes corporels du vivant de la personne ; les juristes divergent sur la procuration après le décès pour le jeûne, le pèlerinage et les vœux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1985}\nLe report au-delà du temps de l'obligation sans excuse est un péché : une dette ou un pèlerinage dû mais non accompli demeure à la charge de la personne, et les écoles divergent sur le paiement à partir de la succession en l'absence de legs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1986} Certaines opinions admettent le rattrapage des sunnas régulières, d'autres non ; les hanafites et les malikites ne rattrapent que la sunna de l'aube. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1987} Celui qui refuse une obligation en la niant est traité comme un mécréant à inviter au repentir ; celui qui refuse par paresse fait l'objet d'une mesure disciplinaire pour le culte corporel et de contrainte pour la zakat, mais n'est pas combattu pour le pèlerinage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988} L'accomplissement sous la forme licite acquitte l'obligation selon le consensus ; le fait qu'il apporte une récompense est débattu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988}"
  es: "Ada' significa, en el léxico, entrega; se usa tanto para actos con tiempo determinado como para otros. Para la mayoría es realizar, dentro de su tiempo y antes de que termine el tiempo, un acto que es obligatorio o recomendado; para los Hanafi es entregar exactamente lo que se ordenó. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1976} Se distingue de qada' (reparar después del tiempo): por el tiempo para la mayoría, por lo realizado para los Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} Los actos con tiempo determinado son estrechos o amplios, y deben realizarse en su tiempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1977} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} Durante un amplio período de tiempo, la mayoría sostiene que la obligación se aplica a todo el mismo, y se prefiere su cumplimiento temprano. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1978} Una unidad de oración dentro de su tiempo asegura la oración para la mayoría; los Hanafis eximen la oración del amanecer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1979} Para las obligaciones no restringidas como el zakat y las expiaciones, el deber de cumplir se fija al final de la vida, cuando la persona cree que aún puede cumplirlo. Los actos recomendados se realizan para obtener recompensa; una vez iniciados, deben completarse según los Hanafis y Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1980} El desempeño requiere la capacidad de realizar, y quien no puede realizar de la manera prescrita lo hace de la manera que puede, de pie, sentado o acostado de lado; una persona anciana que no puede ayunar no debe ayunar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1982} El poder está permitido para actos financieros y no para actos corporales durante la vida; los juristas difieren sobre el poder después de la muerte en el ayuno, la peregrinación y los votos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1983} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1984} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1985} El retraso más allá del tiempo de obligación sin excusa es un pecado: una deuda o peregrinación debida pero no realizada permanece en la responsabilidad, y las escuelas difieren en el pago de la herencia sin un legado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1986} Las sunnas regulares se componen según algunos y no otros; los hanafíes y los malikíes componen solo la sunna del amanecer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1987} Quien se niega a cumplir una obligación por negación es tratado como un incrédulo al que se le pide que se arrepienta; Quien se niega por pereza es disciplinado en el culto corporal y obligado al zakat, pero no se le exige que realice la peregrinación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988} El cumplimiento de la forma lícita extingue el deber por acuerdo, y si conlleva recompensa es objeto de debate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1988}"
  ur: "Ada' کا مطلب ہے، لغت میں، ترسیل؛ یہ وقتی کاموں اور دوسروں کے لیے استعمال ہوتا ہے۔ اکثریت کے لیے یہ اپنے وقت کے اندر اور وقت ختم ہونے سے پہلے ایک ایسا عمل انجام دے رہا ہے جو واجب یا مستحب ہے۔ احناف کے نزدیک یہ وہی چیز ہے جس کا حکم ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1976} یہ قضا ⁦(وقت کے بعد نیکی)⁩ سے ممتاز ہے: جمہور کے لیے وقت کی قسم، احناف کے لیے انجام دی گئی چیز سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1977} وقتی اعمال تنگ ہوں یا چوڑے، اور ان کو اپنے وقت میں انجام دینا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1977} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1978} ایک وسیع مدت تک اکثریت اس ذمہ داری کو پوری طرح سے مانتی ہے، اور ابتدائی کارکردگی کو ترجیح دی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1978} نماز کی ایک اکائی اپنے وقت کے اندر اکثریت کے لیے نماز کو محفوظ رکھتی ہے۔ احناف فجر کی نماز سے مستثنیٰ ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1979} زکوٰۃ اور کفارہ جیسے غیر محدود فرائض کے لیے، انجام دینے کا فرض زندگی کے آخر میں مقرر کیا جاتا ہے، جب انسان یہ سمجھتا ہے کہ وہ اب بھی ادا کر سکتا ہے۔ تجویز کردہ اعمال ثواب کے لیے کیے جاتے ہیں۔ ایک بار شروع ہو جائے تو احناف اور مالکیہ کے نزدیک مکمل ہونا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1980} کارکردگی کے لیے کارکردگی کا مظاہرہ کرنے کی صلاحیت کی ضرورت ہوتی ہے، اور جو شخص مقررہ طریقے سے انجام نہیں دے سکتا وہ اس طریقے سے کرتا ہے جس طرح وہ کھڑا، بیٹھا یا لیٹ سکتا ہے۔ جو بوڑھا شخص روزہ نہیں رکھ سکتا اس پر روزہ نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1981} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1982} پراکسی کی اجازت مالی اعمال کے لیے ہے نہ کہ زندگی کے دوران جسمانی اعمال کے لیے۔ روزے، زیارت اور نذر میں موت کے بعد پراکسی کے بارے میں فقہاء کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1983} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1984} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1985} قرض کے عذر یا عذر کے گزر جانے میں تاخیر: واجب الادا لیکن انجام نہ دیا گیا ذمہ داری میں باقی ہے، اور اسکولوں میں وصیت کے بغیر اسٹیٹ سے ادائیگی پر اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1986} باقاعدہ سنتیں بعض کے مطابق بنتی ہیں نہ کہ بعض کے مطابق۔ احناف اور مالکی صرف فجر کی سنت کو قضا کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1987} جو شخص انکار سے کسی فرض سے انکار کرتا ہے اسے کافر سمجھا جاتا ہے جس سے توبہ کرنے کو کہا جاتا ہے۔ جو شخص سستی سے انکار کرتا ہے وہ جسمانی عبادت میں تادیبی اور زکوٰۃ میں مجبور ہے، لیکن حج کے معاملے میں لڑائی نہیں کرتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1988} حلال شکل میں انجام دینے سے معاہدے کے ذریعے فرض ادا ہوتا ہے، اور آیا اس سے ثواب ملتا ہے، اس میں اختلاف ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1988}"
