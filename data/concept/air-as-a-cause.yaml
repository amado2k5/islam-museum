summary:
  ar: "يذكر ابن سينا أن الهواء عنصر لأبداننا وأرواحنا ومدد لأرواحنا، وفاعل معدل لها، ويتعلق تعديله بفعلين هما الترويح والتنقية، وأنه ما دام معتدلاً صافياً حافظ للصحة {cite:canon-ibn-sina-print-v1 pp.113-114}."
  en: "Ibn Sina says air is an element of our bodies and spirits, a supply to our spirits and an acting moderator of them, whose moderating belongs to two acts, ventilation and purification, and that while it is moderate and pure it keeps health {cite:canon-ibn-sina-print-v1 pp.113-114}."
