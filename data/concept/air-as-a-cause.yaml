id: concept/air-as-a-cause
class: concept
kind: scientific
label: { ar: "الهواء المحيط وتأثيره في الأبدان عند ابن سينا", en: "The surrounding air and its effect on bodies in the Canon", fr: "L’air ambiant et son effet sur le corps dans le Canon", ur: "قانون میں گھیرنے والی ہوا اور بدنوں پر اس کا اثر", es: "El aire circundante y su efecto sobre los cuerpos en el Canon" }
summary:
  ar: "يذكر ابن سينا أن الهواء عنصر لأبداننا وأرواحنا ومدد لأرواحنا، وفاعل معدل لها، ويتعلق تعديله بفعلين هما الترويح والتنقية، وأنه ما دام معتدلاً صافياً حافظ للصحة {cite:canon-ibn-sina-print-v1 pp.113-114}."
  en: "Ibn Sina says air is an element of our bodies and spirits, a supply to our spirits and an acting moderator of them, whose moderating belongs to two acts, ventilation and purification, and that while it is moderate and pure it keeps health {cite:canon-ibn-sina-print-v1 pp.113-114}."
  fr: "Selon Ibn Sina, l’air est un élément de nos corps et de nos esprits. Il alimente les esprits et tempère activement leur constitution par deux actions, la ventilation et la purification. Dans cette théorie, tant qu’il est tempéré et pur, l’air préserve la santé {cite:canon-ibn-sina-print-v1 pp.113-114}."
  es: "Ibn Sina dice que el aire es un elemento de nuestros cuerpos y espíritus, un suministro para nuestros espíritus y un moderador activo de los mismos, cuya moderación pertenece a dos actos, ventilación y purificación, y que mientras es moderado y puro mantiene la salud {cite:canon-ibn-sina-print-v1 pp.113-114}."
  ur: "ابن سینا کا کہنا ہے کہ ہوا ہمارے جسموں اور روحوں کا ایک عنصر ہے، ہماری روحوں کو فراہم کرتی ہے اور ان کا ایک قائم مقام ہے، جس کا اعتدال دو کاموں سے تعلق رکھتا ہے، وینٹیلیشن اور طہارت، اور یہ کہ یہ اعتدال اور پاکیزہ ہے، صحت کو برقرار رکھتی ہے۔"
