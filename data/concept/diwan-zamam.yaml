label: { ar: "ديوان الزمام والخاتم", en: "The Zamam Diwan and Seal", ur: "دیوان زمام اور مہر", es: "El Zamam Diwan y el Sello", fr: "Le diwan et le sceau de Zamam", tr: "Diwan Al-Zambar wa Al-Khatim", id: "Diwan Al-Zambar wa Al-Khatim" }
summary:
  ar: "قال ابن المقفع كان ملك الفرس إذا أمر بأمر وقفه صاحب التوقيع بين يديه وله خادم يثبت ذكره في تذكرة تجمع لكل شهر فيختم عليها الملك خاتمه وتخزن ثم ينفذ التوقيع إلى صاحب الزمام وإليه الختم فينفذه إلى صاحب العمل فيكتب به كتاباً من الملك وينسخ في الأصل ثم ينفذ إلى صاحب الزمام فيعرضه على الملك فيقابل به ما في التذكرة ثم يختم بحضرة الملك أو أوثق الناس عنده وكان زياد بن أبي سفيان أول من اتخذ من العرب ديوان زمام وخاتم امتثالاً لما كانت الفرس تفعله وكان لملك الفرس خاتم للسر وخاتم للرسل وخاتم للتخليد يختم به السجلات والإقطاعات وما أشبه ذلك من كتب التشريف وخاتم للخراج فكان صاحب الزمام يليها وربما أفرد بخاتم السر والرسائل رجل من خاصة الملك وكانت الرسائل بحمل المال تقرأ على الملك وهي يومئذ تكتب في صحف بيض وكان صاحب الخراج يأتي الملك كل سنة بصحف موصلة قد أثبت فيها مبلغ ما اجتبي من الخراج وما أنفق في وجوه النفقات وما حصل في بيت المال فيختمها ويجريها فلما كان كسرى بن هرمز أبرويز تأذى بروائح تلك الصحف وأمر أن لا يرفع إليه صاحب ديوان خراجه ما يرفع إلا في صحف مصفرة بالزعفران وماء الورد."
  en: "Ibn al-Muqaffa' described the Persian chancery: a royal command stood before the sahib al-tawqi', his servant entered it in a monthly tadhkira which the king sealed and stored; the tawqi' passed to the sahib al-zimam — keeper of the seal — then to the sahib al-'amal, who wrote it as a royal letter, copied it into the register, returned it through the sahib al-zimam to be read against the tadhkira and sealed before the king or his most trusted. Ziyad ibn Abi Sufyan was the first Arab to take a zamam-diwan and a seal, imitating the Persians. The Persian king kept a seal for secrets, for envoys, for perpetuities — sijillat and iqta's and tashrif-letters — and a seal for the kharaj, all with the sahib al-zimam save the seal of secrets sometimes held by a royal intimate; and Khusraw Aparviz, bothered by the smell of the white sheets of accounts, ordered his kharaj-diwan's returns yellowed with saffron and rosewater."
  ur: "ابن المقفع سے منقول فارسی طریقے میں حکم کا اندراج، ماہانہ تذکرے سے مقابلہ اور مہر شامل ہیں؛ زیاد کی نسبت بھی اسی ماخذ میں ہے۔ یہ پرانا استعمال بعد کے عباسی مرکزی زمام کے ساتھ بلا دلیل ایک ادارہ نہیں سمجھا جاتا {cite:futuh-buldan-maarif-1407} {cite:tdv-divan-duri Abbasid administration}۔"
  es: "Ibn al-Muqaffa' describió la cancillería persa: una orden real se presentaba ante el sahib al-tawqi', su sirviente la registraba en una tadhkira mensual que el rey sellaba y guardaba; la tawqi' pasaba al sahib al-zimam — custodio del sello — luego al sahib al-'amal, quien la escribía como una carta real, la copiaba en el registro, la devolvía a través del sahib al-zimam para ser leída contra la tadhkira y sellada ante el rey o su más cercano. Ziyad ibn Abi Sufyan fue el primer árabe en tomar un zamam-diwan y un sello, imitando a los persas. El rey persa guardaba un sello para secretos, para enviados, para perpetuidades — sijillat e iqta y cartas tashrif — y un sello para el kharaj, todos con el sahib al-zimam excepto el sello de secretos que a veces guardaba un íntimo real; Y Khusraw Aparviz, molesto por el olor de las hojas blancas de contabilidad, ordenó que los informes de su kharaj-diwan se tiñeran de azafrán y agua de rosas."
  fr: "Ibn al-Muqaffa' a décrit la chancellerie perse: un ordre royal était présenté au sahib al-tawqi', son serviteur l'inscrivait dans une tadhikra mensuelle que le roi scella et conservait; la tadhikra passait au sahib al-zimam – gardien du sceau – puis au sahib al-'amal, qui la rédigeait comme une lettre royale, la recopiait dans le registre, la renvoyait par l'intermédiaire du sahib al-zimam pour qu'elle soit lue contre la tadhikra et scellée devant le roi ou son plus proche conseiller. Ziyad ibn Abi Sufyan fut le premier Arabe à se procurer un zamam-diwan et un sceau, imitant ainsi les Perses. Le roi perse conservait un sceau pour les secrets, pour les envoyés, pour les perpétuités – les sijillat, les iqta et les lettres de tashrif – et un sceau pour le kharaj, tous détenus par le sahib al-zimam, à l'exception du sceau des secrets, parfois confié à un proche du roi. et Khusraw Aparviz, gêné par l'odeur des feuilles blanches des comptes, ordonna que les relevés de son kharaj-diwan soient jaunis par le safran et l'eau de rose."
  tr: "İbn el-Muqaffa şöyle derdi: Pers kralı bir emir verdiğinde, imzacının sahibi onun ellerinde dururdu. Bir hizmetçisi vardı ve adı aylık makbuzda kaydedilirdi, kral onu mühürler ve saklardı. Sonra imza dizginlerin sahibine verilir ve mühür işverene teslim edilirdi; işveren, kraldan bir mektup yazar ve orijinal haliyle kopyalardı. Sonra dizginlerin sahibine teslim eder ve krala sunardı; kral biletteki mektuplarla karşılaştırır ve kralın ya da yanında en güvendiği kişinin huzurunda mühürlerdi. Ziyad bin Ebi Sufyan ilk olarak Ziyad bin Ebi Sufyan oldu Araplar arasından kim dizginli diwan ve Perslerin yaptığı gibi bir yüzük alırdı. Pers kralının sır için bir mühür, elçiler için bir yüzük, ölümsüzleştirme yüzüğü, kayıtları, toprakları ve benzeri onur kitaplarını mühürlemek için bir yüzük ve vergiler için bir yüzük vardı. Dizginlerin sahibi onu takip ederdi ve belki kralın yakın çevresinden biri sırrı ve mektupları taşıyan kişi olurdu. Para taşıyan mektuplar krala okunur ve o dönemde beyaz gazetelerde yazılırdı. Vergi sahibi, her yıl krala ilgili gazetelerle gelirdi ve seçilen miktarın kanıtlandığı gazeteler olurdu. Kharaj, masraflara harcanan ve kamu hazinesinde olanları, mühürleyip dağıtacaktı. Khosrow ibn Hurmuz Abruiz, o gazetelerin kokularından zarar gördüğünde, diwanının sahibine sadece safran ve gül suyuyla sararmış sayfalarda yükseltilmiş olanları kendisine teslim etmesini emretti."
  id: "Ibn al-Muqaffa' berkata: Ketika raja Persia memerintahkan sebuah perintah, pemilik penandatangan akan berada di tangannya. Ia memiliki seorang pelayan yang namanya tercatat dalam struk bulanan, yang akan distempel dan disimpan oleh raja. Kemudian tanda tangan tersebut akan ditandatangani kepada pemilik tali kekang, dan segel tersebut diserahkan kepada majikan, yang akan menulis surat dari raja dan menyalinnya dalam bentuk asli. Kemudian ia akan menyerahkannya kepada pemilik tali kekang dan menyerahkannya kepada raja, yang membandingkannya dengan apa yang tertulis di tiket, lalu mencapitkannya di hadapan raja atau orang yang paling dipercaya bersamanya. Ziyad ibn Abi Sufyan adalah yang pertama Siapa pun di antara orang Arab yang mengambil diwan dari tali kekang dan cincin sesuai dengan apa yang biasa dilakukan orang Persia. Raja Persia memiliki segel untuk rahasia, cincin untuk utusan, cincin untuk pengabadikan, untuk menyegel catatan, wilayah, dan buku kehormatan serupa, serta cincin untuk pajak. Pemilik tali kekang akan mengikuti, dan mungkin seorang pria dari rekan dekat raja yang membawa rahasia dan surat-surat itu. Surat-surat yang membawa uang dibacakan kepada raja, dan pada saat itu ditulis di koran putih. Pemilik pajak akan datang kepada raja setiap tahun dengan surat kabar terkait yang membuktikan jumlah yang dipilih. Kharaj, apa yang dihabiskan untuk pengeluaran dan apa yang terjadi di kas negara, akan disegel dan dibagikan. Ketika Khosrow ibn Hurmuz Abruiz terluka oleh bau koran itu, ia memerintahkan pemilik diwannya hanya menyerahkan apa yang terangkat dalam halaman yang dikuning dengan air safron dan mawar."
