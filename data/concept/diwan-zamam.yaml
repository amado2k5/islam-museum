label: { ar: "ديوان الزمام والخاتم", en: "The Zamam Diwan and Seal" }
summary:
  ar: "قال ابن المقفع كان ملك الفرس إذا أمر بأمر وقفه صاحب التوقيع بين يديه وله خادم يثبت ذكره في تذكرة تجمع لكل شهر فيختم عليها الملك خاتمه وتخزن ثم ينفذ التوقيع إلى صاحب الزمام وإليه الختم فينفذه إلى صاحب العمل فيكتب به كتاباً من الملك وينسخ في الأصل ثم ينفذ إلى صاحب الزمام فيعرضه على الملك فيقابل به ما في التذكرة ثم يختم بحضرة الملك أو أوثق الناس عنده وكان زياد بن أبي سفيان أول من اتخذ من العرب ديوان زمام وخاتم امتثالاً لما كانت الفرس تفعله وكان لملك الفرس خاتم للسر وخاتم للرسل وخاتم للتخليد يختم به السجلات والإقطاعات وما أشبه ذلك من كتب التشريف وخاتم للخراج فكان صاحب الزمام يليها وربما أفرد بخاتم السر والرسائل رجل من خاصة الملك وكانت الرسائل بحمل المال تقرأ على الملك وهي يومئذ تكتب في صحف بيض وكان صاحب الخراج يأتي الملك كل سنة بصحف موصلة قد أثبت فيها مبلغ ما اجتبي من الخراج وما أنفق في وجوه النفقات وما حصل في بيت المال فيختمها ويجريها فلما كان كسرى بن هرمز أبرويز تأذى بروائح تلك الصحف وأمر أن لا يرفع إليه صاحب ديوان خراجه ما يرفع إلا في صحف مصفرة بالزعفران وماء الورد."
  en: "Ibn al-Muqaffa' described the Persian chancery: a royal command stood before the sahib al-tawqi', his servant entered it in a monthly tadhkira which the king sealed and stored; the tawqi' passed to the sahib al-zimam — keeper of the seal — then to the sahib al-'amal, who wrote it as a royal letter, copied it into the register, returned it through the sahib al-zimam to be read against the tadhkira and sealed before the king or his most trusted. Ziyad ibn Abi Sufyan was the first Arab to take a zamam-diwan and a seal, imitating the Persians. The Persian king kept a seal for secrets, for envoys, for perpetuities — sijillat and iqta's and tashrif-letters — and a seal for the kharaj, all with the sahib al-zimam save the seal of secrets sometimes held by a royal intimate; and Khusraw Aparviz, bothered by the smell of the white sheets of accounts, ordered his kharaj-diwan's returns yellowed with saffron and rosewater."
