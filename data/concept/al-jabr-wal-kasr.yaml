id: concept/al-jabr-wal-kasr
class: concept
kind: scientific
label: { ar: "جبر الكسور والخلع", en: "Setting fractures and dislocations (al-jabr wal-kasr)", ur: "ٹوٹی ہڈی اور جوڑ اترنے کا علاج" }
summary:
  ar: "يخصّص ابن سينا الفن الخامس من الكتاب الرابع في «القانون» للجبر، في ثلاث مقالات: الخلع وما يتعلق به، وأصول كلية في الكسر، وكسور الأعضاء عضواً عضواً من القحف إلى أصابع الرجل {cite:canon-ibn-sina-print-v3 pp.245-280}. ويعرّف الخلع بأنه خروج العظم عن موضعه الطبيعي، والكسر بأنه تفرّق الاتصال الخاص بالعظم {cite:canon-ibn-sina-print-v3 pp.245, 257}. ويقوم الجبر عنده على المدّ بمقدار، ثم نصب العظمين على الاستقامة، ثم الرفائد والرباطات والجبائر، وتعهّد ذلك حتى يتكوّن الدشبذ، أي الجسر الذي يلحم طرفي العظم {cite:canon-ibn-sina-print-v3 pp.258-263}."
  en: "Ibn Sina devotes the fifth fann of Book IV of the Canon to bone-setting, in three treatises: dislocation and what goes with it, general principles of fracture, and fractures of each part of the body from the skull to the toes {cite:canon-ibn-sina-print-v3 pp.245-280}. He defines dislocation as the departure of a bone from its natural place, and fracture as the break in continuity that is peculiar to bone {cite:canon-ibn-sina-print-v3 pp.245, 257}. For him setting rests on traction in due measure, then aligning the two bone ends, then pads, bandages and splints, with continued attention until the callus forms {cite:canon-ibn-sina-print-v3 pp.258-263}."
  ur: "ابن سینا «قانون» کی چوتھی کتاب کا پانچواں فن جبر، یعنی ہڈی بٹھانے، کے لیے مخصوص کرتے ہیں، اور اسے تین مقالوں میں بانٹتے ہیں: جوڑ اترنا اور اس سے متعلق امور، ٹوٹنے کے عمومی اصول، اور کھوپڑی سے پاؤں کی انگلیوں تک ہر عضو کے ٹوٹنے کا بیان {cite:canon-ibn-sina-print-v3 pp.245-280}۔ وہ خلع کو ہڈی کا اپنی قدرتی جگہ سے نکل جانا اور کسر کو ہڈی سے مخصوص اتصال کا ٹوٹنا قرار دیتے ہیں {cite:canon-ibn-sina-print-v3 pp.245, 257}۔ ان کے نزدیک جبر کی بنیاد مناسب مقدار میں کھینچنا، پھر دونوں ہڈیوں کو سیدھا بٹھانا، پھر گدیاں، پٹیاں اور پھٹیاں لگانا، اور دشبذ یعنی ہڈی کا جوڑ بننے تک نگرانی کرنا ہے {cite:canon-ibn-sina-print-v3 pp.258-263}۔"
