id: concept/al-jabr-wal-kasr
class: concept
kind: scientific
label: { ar: "جبر الكسور والخلع", en: "Setting fractures and dislocations (al-jabr wal-kasr)", fr: "Réduction des fractures et des luxations (al-jabr wal-kasr)", ur: "ٹوٹی ہڈی اور جوڑ اترنے کا علاج", es: "Reducción de fracturas y luxaciones (al-jabr wal-kasr)", tr: "Kırık Onarımı ve Çıkık", id: "Perbaikan dan Dislokasi Patah" }
summary:
  ar: "يخصّص ابن سينا الفن الخامس من الكتاب الرابع في «القانون» للجبر، في ثلاث مقالات: الخلع وما يتعلق به، وأصول كلية في الكسر، وكسور الأعضاء عضواً عضواً من القحف إلى أصابع الرجل {cite:canon-ibn-sina-print-v3 pp.245-280}. ويعرّف الخلع بأنه خروج العظم عن موضعه الطبيعي، والكسر بأنه تفرّق الاتصال الخاص بالعظم {cite:canon-ibn-sina-print-v3 pp.245, 257}. ويقوم الجبر عنده على المدّ بمقدار، ثم نصب العظمين على الاستقامة، ثم الرفائد والرباطات والجبائر، وتعهّد ذلك حتى يتكوّن الدشبذ، أي الجسر الذي يلحم طرفي العظم {cite:canon-ibn-sina-print-v3 pp.258-263}."
  en: "Ibn Sina devotes the fifth fann of Book IV of the Canon to bone-setting, in three treatises: dislocation and what goes with it, general principles of fracture, and fractures of each part of the body from the skull to the toes {cite:canon-ibn-sina-print-v3 pp.245-280}. He defines dislocation as the departure of a bone from its natural place, and fracture as the break in continuity that is peculiar to bone {cite:canon-ibn-sina-print-v3 pp.245, 257}. For him setting rests on traction in due measure, then aligning the two bone ends, then pads, bandages and splints, with continued attention until the callus forms {cite:canon-ibn-sina-print-v3 pp.258-263}."
  fr: "Ibn Sina consacre la cinquième section du livre IV du Canon à la réduction des fractures et des luxations, en trois traités : les luxations et les lésions associées, les principes généraux des fractures, et les fractures des différentes parties du corps, du crâne aux orteils {cite:canon-ibn-sina-print-v3 pp.245-280}. Il définit la luxation comme le déplacement d’un os hors de sa position naturelle, et la fracture comme la rupture de continuité propre à l’os {cite:canon-ibn-sina-print-v3 pp.245, 257}. Pour lui, la réduction repose sur une traction mesurée, suivie de l’alignement des deux extrémités osseuses, puis de la pose de coussinets, de bandages et d’attelles, avec une surveillance continue jusqu’à la formation du cal {cite:canon-ibn-sina-print-v3 pp.258-263}."
  ur: "ابن سینا «قانون» کی چوتھی کتاب کا پانچواں فن جبر، یعنی ہڈی بٹھانے، کے لیے مخصوص کرتے ہیں، اور اسے تین مقالوں میں بانٹتے ہیں: جوڑ اترنا اور اس سے متعلق امور، ٹوٹنے کے عمومی اصول، اور کھوپڑی سے پاؤں کی انگلیوں تک ہر عضو کے ٹوٹنے کا بیان {cite:canon-ibn-sina-print-v3 pp.245-280}۔ وہ خلع کو ہڈی کا اپنی قدرتی جگہ سے نکل جانا اور کسر کو ہڈی سے مخصوص اتصال کا ٹوٹنا قرار دیتے ہیں {cite:canon-ibn-sina-print-v3 pp.245, 257}۔ ان کے نزدیک جبر کی بنیاد مناسب مقدار میں کھینچنا، پھر دونوں ہڈیوں کو سیدھا بٹھانا، پھر گدیاں، پٹیاں اور پھٹیاں لگانا، اور دشبذ یعنی ہڈی کا جوڑ بننے تک نگرانی کرنا ہے {cite:canon-ibn-sina-print-v3 pp.258-263}۔"
  es: "Ibn Sina dedica el quinto fann del Libro IV del Canon a la reducción de fracturas, en tres tratados: la dislocación y sus consecuencias, los principios generales de la fractura y las fracturas de cada parte del cuerpo, desde el cráneo hasta los dedos de los pies {cite:canon-ibn-sina-print-v3 pp.245-280}. Define la dislocación como la separación de un hueso de su lugar natural y la fractura como la ruptura de la continuidad propia del hueso {cite:canon-ibn-sina-print-v3 pp.245, 257}. Para él, la reducción se basa en la tracción adecuada, la alineación de los dos extremos del hueso, y posteriormente en la aplicación de almohadillas, vendajes y férulas, con atención continua hasta la formación del callo {cite:canon-ibn-sina-print-v3 pp.258-263}."
  tr: "İbn Sina, \"Kanon\"un dördüncü kitabının beşinci sanatını cebire üç maddede adamıştır: Khul' ve ilgili konular, kırılmanın genel prensipleri ve kafatasından ayak parmaklarına kadar organ organ uzuv kırıkları {alıntı: kanon-ibn-sina-print-v3 s.245-280}. Çıkık, kemiğin doğal konumundan sapması olarak tanımlanır; kırık ise kemikle bağlantının kesilmesi olarak tanımlanır {cite:canon-ibn-sina-print-v3 s.245, 257}. Onun için cebir, önce iki kemiğin düzlüğe, ardından kaburgalar, bağlara ve atellere dayanır ve bunu dashbdhdh oluşana kadar sürdürür; yani kemiğin uçlarını kaynatan köprü {cite:canon-ibn-sina-print-v3 s.258-263}."
  id: "Ibn Sina mendedikasikan seni kelima dari buku keempat \"Kanon\" untuk aljabar dalam tiga artikel: Khul' dan topik terkait, prinsip umum patah tulang, dan fraktur organ-ke-anggota tubuh dari tengkorak ke jari kaki {kutipan: kanon-ibn-sina-print-v3 hlm.245-280}. Dislokasi didefinisikan sebagai penyimpangan tulang dari posisi alaminya; patah tulang didefinisikan sebagai putusnya sambungan dengan tulang {cite:canon-ibn-sina-print-v3 hlm.245, 257}. Bagi dia, aljabar pertama-tama didasarkan pada kerataan dua tulang, lalu pada tulang rusuk, ligamen, dan bidai, dan melanjutkan ini hingga dashbdhdh terbentuk; yaitu, jembatan yang mengelas ujung tulang {cite:canon-ibn-sina-print-v3 hlm.258-263}."
