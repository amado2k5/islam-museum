summary:
  ar: "شوكة بيضاء تشبه الحسكة، وأشد بياضاً وأطول شوكاً، وبزرها حار لطيف. فيه قوة محللة ومفتّحة، وقبض معتدل للنزف، ويُنتفع به في الأورام البلغمية والتشنج وضعف المعدة والإسهال المزمن والحميات البلغمية الطويلة {cite:canon-ibn-sina-print-v1 p.383}، {cite:canon-ibn-sina-print-v1 p.384}."
  en: "A white thistle that resembles the hasak but is whiter and has longer spines. Its seed is hot and light, and the root is cooling and drying. It has a dissolving and opening power and a moderate astringency that stops bleeding. The book recommends it for phlegmatic swellings, spasm, weak stomach, chronic diarrhoea, and long phlegmatic fevers {cite:canon-ibn-sina-print-v1 p.383}, {cite:canon-ibn-sina-print-v1 p.384}."
  fr: "Chardon blanc ressemblant au hasak, mais plus blanc et aux épines plus longues. Sa graine est chaude et légère, sa racine rafraîchissante et desséchante. Il possède un pouvoir résolutif et désobstruant, avec une astringence modérée arrêtant les saignements. Le livre le recommande pour les gonflements phlegmatiques, les spasmes, la faiblesse gastrique, la diarrhée chronique et les longues fièvres phlegmatiques {cite:canon-ibn-sina-print-v1 p.383}, {cite:canon-ibn-sina-print-v1 p.384}."
  ur: "یہ سفید خار دار پودا ہے جو حسکہ سے ملتا جلتا ہے مگر زیادہ سفید ہوتا ہے اور اس کے کانٹے لمبے ہوتے ہیں۔ اس کا بیج گرم اور لطیف ہے۔ اس میں تحلیل کرنے اور کھولنے کی قوت، اور خون روکنے کے لیے معتدل قبض ہے۔ کتاب اسے بلغمی ورموں، اینٹھن، کمزور معدے، دائمی اسہال اور طویل بلغمی بخاروں کے لیے بتاتی ہے {cite:canon-ibn-sina-print-v1 p.383}، {cite:canon-ibn-sina-print-v1 p.384}۔"
  es: "Un cardo blanco que se asemeja al hasak pero es más blanco y tiene espinas más largas. Su semilla es caliente y ligera, y la raíz es refrescante y secante. Posee propiedades disolventes y descongestionantes, así como una astringencia moderada que detiene el sangrado. El libro lo recomienda para hinchazones flemáticas, espasmos, debilidad estomacal, diarrea crónica y fiebres flemáticas prolongadas {cite:canon-ibn-sina-print-v1 p.383}, {cite:canon-ibn-sina-print-v1 p.384}."
