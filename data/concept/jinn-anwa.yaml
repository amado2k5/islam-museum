kind: jinn
label:
  ar: أنواع الجن
  en: Kinds of jinn
  ur: جنوں کی اقسام
summary:
  ar: "صنّفت المعاجم والفقهاء الجنَّ الأصنام، ومنهم المارد والعفريت والغول والسيّاط والهلّاس، وجعلوا لكل صنف مسكناً ومزاجاً: فالمارد أشدهم، والعفريت يذكر في قصة هدهد سليمان [[passage/quran-27-39|النمل 39]]، والغول يتغول في الخلوات كما في خبر عمر في السير {cite:muruj-al-dhahab} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "Lexica and jurists sorted the jinn into kinds — marid, ifrit, ghul, si'lat, hallas — each with its dwelling and temperament: the marid the strongest, the ifrit of Solomon's hoopoe story [[passage/quran-27-39|al-Naml 39]], and the ghul that haunts lonely places as in Umar's pre-Islamic encounter {cite:muruj-al-dhahab} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "معاجم اور فقہاء نے جنوں کو اقسام میں بانٹا — مارد، عفریت، غول، سیّاط، ہلّاس — ہر صنف کا اپنا مسکن اور مزاج: مارد سب سے سخت، عفریت جو سلیمان کے ہدہد کی کہانی میں آتا ہے [[passage/quran-27-39|النمل 39]]، اور غول جو تنہائیوں میں ڈیرہ کرتا ہے جیسا کہ عمر کے عقبہ اسلام خبر میں آیا {cite:muruj-al-dhahab} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}۔"
