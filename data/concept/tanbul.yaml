summary:
  ar: "تنبول في الكتاب أوراق شجرة تنبت في الهند وفي موضع يقال له النغر، ورقه شبيه بورق الليمون وكذلك أغصانه، وأهل الهند يتناولونه مع النورة والفوفل فيصبغ الأسنان صبغا أحمر وله رائحة طيبة؛ يطيب النكهة ويزيل البخر ويقوي العمور ويشد اللثة ويقوي فم المعدة والهضم ويكسر الرياح ويطيب الجشاء، وقيل إن عصارته تجلو البهق {cite:canon-ibn-sina-print-v1 p.690}"
  en: "Tanbul is in the book the leaves of a tree that grows in India and in a place called al-Nagr, its leaf like the lemon leaf and its branches likewise; the people of India take it with nura and fawfal, and chewing stains the teeth red, with a pleasant scent; it sweetens the breath and removes mouth odour, strengthens the gums and firms them, strengthens the mouth of the stomach and digestion, breaks winds and sweetens belching, and its juice is said to clear bahaq {cite:canon-ibn-sina-print-v1 p.690}"
  ur: "تنبول کتاب میں ایک درخت کے پتے ہیں جو ہندوستان میں اور ایک مقام نغر میں اگتا ہے، اس کا پتا لیموں کے پتے جیسا اور اس کی شاخیں بھی ویسی ہیں؛ ہندوستان کے لوگ اسے نورہ اور فوفل کے ساتھ کھاتے ہیں، چبانے سے دانت سرخ رنگ جاتے ہیں اور اس کی خوشبو اچھی ہے؛ منہ کی بو دور کرتا ہے، مسوڑھوں کو مضبوط اور کسا ہوا رکھتا ہے، معدے کے منہ اور ہضم کو قوت دیتا ہے، ریاح توڑتا ہے اور ڈکار کو خوشگوار کرتا ہے، اور کہا گیا ہے کہ اس کا رس بہق کو صاف کرتا ہے {cite:canon-ibn-sina-print-v1 p.690}۔"
  es: "En el libro, el tanbul son las hojas de un árbol que crece en la India, en un lugar llamado al-Nagr. Sus hojas son parecidas a las del limón, al igual que sus ramas. Los indios lo consumen con nura y fawfal, y al masticarlo tiñe los dientes de rojo, con un aroma agradable. Endulza el aliento y elimina el mal olor bucal, fortalece y reafirma las encías, mejora la digestión, alivia los gases y endulza los eructos, y se dice que su jugo limpia el bahaq. {cite:canon-ibn-sina-print-v1 p.690}"
  fr: "Le Tanbul est décrit dans le livre comme les feuilles d'un arbre qui pousse en Inde, dans un lieu appelé al-Nagr. Ses feuilles ressemblent à celles du citronnier, tout comme ses branches. Les Indiens le consomment avec du nura et du fawfal; sa mastication colore les dents en rouge et dégage un parfum agréable. Il rafraîchit l'haleine et élimine la mauvaise haleine, fortifie les gencives, stimule la digestion et soulage les flatulences. Son jus est réputé purifier le bahaq. {cite:canon-ibn-sina-print-v1 p.690}"
  tr: "Kitapta tanbul, Hindistan'da nagar denilen yerde yetişen bir ağacın yapraklarıdır. Yaprakları limon yapraklarına ve dallarına benzer. Hindistan halkı onu dişleri kırmızıya boyayan ve hoş bir koku veren flora ve kaval ile tüketir; lezzeti tatlandırır, buharı uzaklaştırır, diş etlerini güçlendirir, diş etlerini sıkılaştırır, mideyi ve sindirimi güçlendirir, rüzgarı keser ve çapakları yatıştırır. Suyunun vitiligoyu berraklaştırdığı söylenir. {cite:canon-ibn-sina-print-v1 s.690}"
  id: "Dalam buku ini, tanbool adalah daun pohon yang tumbuh di India di tempat yang disebut nagar. Daunnya menyerupai daun lemon dan juga cabangnya. Orang-orang India mengonsumsinya bersama flora dan kaval, yang mewarnai gigi menjadi merah dan memiliki aroma yang menyenangkan; tanbool memaniskan rasa, menghilangkan uap, menguatkan gusi, mengeratkan gusi, memperkuat perut dan pencernaan, melancarkan angin, dan menenangkan duri. Dikatakan bahwa jusnya membersihkan vitiligo. {cite:canon-ibn-sina-print-v1 hlm.690}"
