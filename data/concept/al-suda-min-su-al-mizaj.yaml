id: concept/al-suda-min-su-al-mizaj
class: concept
kind: scientific
label:
  ar: "الصداع الكائن من سوء المزاج"
  en: "Headache from ill-temperament"
  fr: "Céphalée due à un mauvais tempérament"
  ur: "سوءِ مزاج سے ہونے والا صداع"
  es: "Dolor de cabeza por mal humor"
summary:
  ar: "يفصّل ابن سينا الصداع الكائن من سوء المزاج: أي المزاجين يؤلم بكيفيته وأيهما لا يؤلم إلا بمادة، وأسباب المزاج الحار والبارد واليابس؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.46-47}"
  en: "Ibn Sina details the headache that comes from ill-temperament: which temperaments hurt by their quality and which hurt only through a matter, and the causes of the hot, the cold and the dry temperament; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.46-47}"
  fr: "Ibn Sina détaille la céphalée due à un mauvais tempérament : quels tempéraments causent de la douleur par leur qualité propre, lesquels ne le font que par l’intermédiaire d’une matière, et quelles sont les causes du tempérament chaud, du froid et du sec. La notice comporte une mention signalée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.46-47}"
  ur: "ابن سینا سوءِ مزاج سے ہونے والے صداع کی تفصیل کرتا ہے: کون سے مزاج اپنی کیفیت سے دکھ دیتے ہیں اور کون صرف مادے کے ذریعے، اور گرم، ٹھنڈے اور خشک مزاج کے اسباب؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.46-47}۔"
  es: "Ibn Sina detalla el dolor de cabeza que proviene del mal temperamento: qué temperamentos perjudican por su cualidad y cuáles solo por una cuestión de materia, y las causas del temperamento caliente, frío y seco; el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 pp.46-47}"
