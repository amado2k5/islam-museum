summary:
  ar: "يذكر الفهرس صورة فرساوس بعد ذات الكرسي، ويصفه بأنه الفارس الممسك رأس الغول. ويقول النص إن الكوكب الذي على طرف يد الفارس اليمنى هو الذي يمسك رأس الغول، ثم تُعدّ بعده كواكب الصورة الأخرى. {cite:zij-sabi-nallino-byblion pp.250}"
  en: "The catalogue gives Firsaws, Perseus, after Cassiopeia, describing him as the rider who holds the head of the ghoul. The text says that the star on the tip of the rider's right hand is the one that holds the head of the ghoul. Other stars of the figure follow. {cite:zij-sabi-nallino-byblion pp.250}"
  ur: "فہرست فرساوس کو ذات الکرسی کے بعد رکھتی ہے اور اسے سوار کہتی ہے جو غول کا سر تھامے ہوئے ہے۔ متن کے مطابق سوار کے دائیں ہاتھ کی نوک پر والا ستارہ وہ ہے جو غول کا سر تھامتا ہے۔ باقی ستارے اس کے بعد آتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.250}"
  es: "El catálogo presenta a Firsaws, Perseo, según Casiopea, describiéndolo como el jinete que sostiene la cabeza del ghoul. El texto indica que la estrella en la punta de la mano derecha del jinete es la que sujeta la cabeza del ghoul. Otras estrellas de la figura aparecen a continuación. {cite:zij-sabi-nallino-byblion pp.250}"
