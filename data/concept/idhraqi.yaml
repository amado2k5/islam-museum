summary:
  ar: "إذاراقي زبد البحر الجامد، دواء حادّ يُستعمل طلاءً؛ ينفع من الكلف والبثور اللبنية وعرق النسا {cite:canon-ibn-sina-print-v1 p.363}."
  en: "Idhraqi is hardened sea foam, a sharp drug used as a salve; it helps melasma, milky pustules and sciatica {cite:canon-ibn-sina-print-v1 p.363}."
  ur: "اذاراقی جما ہوا سمندری جھاگ ہے، ایک تیز دوا جو لیپ کے طور پر لگائی جاتی ہے؛ یہ جھائیوں، دودھیا پھنسیوں اور عرق النسا میں مفید ہے {cite:canon-ibn-sina-print-v1 p.363}۔"
  es: "Idhraqi es espuma de mar endurecida, una droga fuerte que se usa como ungüento; ayuda con el melasma, las pústulas lechosas y la ciática {cite:canon-ibn-sina-print-v1 p.363}."
  fr: "L'Idhraqi est de l'écume de mer durcie, un médicament puissant utilisé comme onguent; il aide le mélasma, les pustules laiteuses et la sciatique {cite:canon-ibn-sina-print-v1 p.363}."
  tr: "Sert deniz köpüğü, boya olarak kullanılan akut bir ilaçtır; melazma, laktik sivilceler ve siyatik için etkilidir. {cite:canon-ibn-sina-print-v1 s.363}."
  id: "Busa laut keras adalah obat akut yang digunakan sebagai cat; efektif untuk melasma, jerawat laktat, dan sciatica. {cite:canon-ibn-sina-print-v1 hlm.363}."
