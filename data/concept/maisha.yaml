id: concept/maisha
class: concept
kind: social
label:
  ar: "المعاش والقوت"
  en: "Livelihood and subsistence (ma'isha, qut)"
  ur: "معیشت اور قوت"
summary:
  ar: "المعاش ما يعاش به المرء من مال وقوت وكسوة ونفقة، والرزق في كتاب الله من فضله على عباده. ومن المعاش في بيت المسلم النفقة الواجبة على الزوج لأهله وعلى الوالد للولد، وما شرعه الإسلام من كسب حلال وإنفاق بالمعروف بلا إسراف ولا تقتير."
  en: "Ma'isha is what a person lives on — property, subsistence, clothing and maintenance — and rizq in God's Book is His bounty on His servants. In the Muslim home livelihood means the maintenance due from the husband to his family and from the father to the child, and the lawful earning and measured spending Islam commands, without extravagance or stinginess."
  ur: "معیشت وہ چیز ہے جس پر انسان جیتا ہے — مال، قوت، لباس اور خرچ — اور اللہ کی کتاب میں رزق اس کا بندوں پر فضل ہے۔ مسلمان گھر میں معیشت کا مطلب شوہر پر اہل و عیال کا واجب خرچ اور والد پر اولاد کا خرچ ہے، حلال کسب اور معتدل خرچ کے ساتھ۔"
