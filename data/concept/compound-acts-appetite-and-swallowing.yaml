summary:
  ar: "في الفصل الأخير من جملة القوى يبين ابن سينا أن من الأفاعيل ما يتم بقوة واحدة كالهضم، ومنها ما يتم بقوتين كشهوة الطعام والازدراد وعبور الغذاء، وقد يكون المبدأ قوة وكيفية {cite:canon-ibn-sina-print-v1 pp.101-102}."
  en: "In the last chapter of the part on faculties Ibn Sina shows that some single acts are completed by one power, like digestion, and some by two, like the appetite for food, swallowing and the passage of food, and that the origin of an act may be a power together with a quality {cite:canon-ibn-sina-print-v1 pp.101-102}."
