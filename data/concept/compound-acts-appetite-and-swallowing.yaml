id: concept/compound-acts-appetite-and-swallowing
class: concept
kind: scientific
label: { ar: "الأفعال المركبة من قوتين: شهوة الطعام والازدراد عند ابن سينا", en: "Acts completed by two powers: appetite and swallowing in the Canon", ur: "قانون میں دو قوتوں سے مکمل ہونے والے افعال: بھوک اور نگلنا", es: "Actos realizados por dos facultades: apetito y deglución en el Canon", fr: "Actes accomplis par deux pouvoirs: l'appétit et la déglutition dans le Canon" }
summary:
  ar: "في الفصل الأخير من جملة القوى يبين ابن سينا أن من الأفاعيل ما يتم بقوة واحدة كالهضم، ومنها ما يتم بقوتين كشهوة الطعام والازدراد وعبور الغذاء، وقد يكون المبدأ قوة وكيفية {cite:canon-ibn-sina-print-v1 pp.101-102}."
  en: "In the last chapter of the part on faculties Ibn Sina shows that some single acts are completed by one power, like digestion, and some by two, like the appetite for food, swallowing and the passage of food, and that the origin of an act may be a power together with a quality {cite:canon-ibn-sina-print-v1 pp.101-102}."
  es: "En el último capítulo de la parte sobre las facultades, Ibn Sina muestra que algunos actos individuales se completan mediante una sola facultad, como la digestión, y otros mediante dos, como el apetito por la comida, la deglución y el paso de los alimentos, y que el origen de un acto puede ser una facultad junto con una cualidad {cite:canon-ibn-sina-print-v1 pp.101-102}."
  fr: "Dans le dernier chapitre de la partie sur les facultés, Ibn Sina montre que certains actes uniques sont accomplis par une seule puissance, comme la digestion, et d'autres par deux, comme l'appétit pour la nourriture, la déglutition et le passage des aliments, et que l'origine d'un acte peut être une puissance associée à une qualité {cite:canon-ibn-sina-print-v1 pp.101-102}."
  ur: "فیکلٹیز پر حصہ کے آخری باب میں ابن سینا ظاہر کرتا ہے کہ کچھ ایک عمل ایک طاقت سے مکمل ہوتے ہیں، جیسے ہاضمہ، اور کچھ دو سے، جیسے کھانے کی بھوک، نگلنا اور کھانا گزرنا، اور یہ کہ کسی عمل کی اصل ایک طاقت ہو سکتی ہے جس میں ایک معیار ہو سکتا ہے۔"
