id: concept/ahl-i-waris
class: concept
kind: term
label:
  ar: "وارث ⁦(أهل الوارث)⁩"
  en: "Ahl-i waris (heir, Indonesian usage)"
  fr: "Ahl-i waris (héritier, usage indonésien)"
  ur: "اہلِ وارث"
  es: "Ahl-i waris (heredero, uso indonesio)"
summary:
  ar: "لفظ «أهل وارث» شائع بين مسلمي إندونيسيا بمعنى الوارث في العربية، أخذه الملايويون من الاستعمال الفارسي ووصل إلى أرخبيل الهند الشرقية {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  en: "Ahl-i waris is in general use among the Muslim peoples of Indonesia with the meaning of the Arabic wārith, 'heir'. The word was taken from Persian usage and reached the East Indian archipelago {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  fr: "L’expression ahl-i waris est d’usage courant parmi les populations musulmanes d’Indonésie, au sens de l’arabe wārith, « héritier ». Le terme est passé de l’usage persan à l’archipel des Indes orientales {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  ur: "اہلِ وارث انڈونیشیا کے مسلمانوں میں عام طور پر عربی «وارث» ⁦(وارث، میراث پانے والا)⁩ کے معنی میں مستعمل ہے۔ یہ لفظ فارسی استعمال سے آیا اور جزائرِ ہند شرق تک پہنچا {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}۔"
  es: "Ahl-i waris es un término de uso común entre los musulmanes de Indonesia, con el significado del árabe wārith, 'heredero'. La palabra proviene del persa y llegó al archipiélago de las Indias Orientales {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
