summary:
  ar: "لفظ «أهل وارث» شائع بين مسلمي إندونيسيا بمعنى الوارث في العربية، أخذه الملايويون من الاستعمال الفارسي ووصل إلى أرخبيل الهند الشرقية {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  en: "Ahl-i waris is in general use among the Muslim peoples of Indonesia with the meaning of the Arabic wārith, 'heir'. The word was taken from Persian usage and reached the East Indian archipelago {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  ur: "اہلِ وارث انڈونیشیا کے مسلمانوں میں عام طور پر عربی «وارث» (وارث، میراث پانے والا) کے معنی میں مستعمل ہے۔ یہ لفظ فارسی استعمال سے آیا اور جزائرِ ہند شرق تک پہنچا {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}۔"
