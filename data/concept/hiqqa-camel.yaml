label: { ar: "الحُقّة", en: "Hiqqa (a camel of four years)", ur: "حقہ (اونٹ کی عمر)" }
summary:
  ar: "الحُقّة من الإبل ما طعن في السنة الرابعة، والأنثى حِقّة، وسميت بذلك لأنها استحقت أن تُركب ويُحمل عليها، ولأنها استحقت أن يطرقها الفحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} وتقابلها في الألفاظ ذات الصلة: ابن المخاض وبنت المخاض في السنة الثانية، وابن اللبون وبنت اللبون في الثالثة، والجذع والجذعة في الخامسة، وهو آخر أسنان الإبل في الزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} وأجمع الفقهاء على أنه تجب حقة في ست وأربعين من الإبل إلى ستين، وفي إحدى وتسعين حقتان إلى مائة وعشرين، ويستند المدخل إلى حديث أنس في كتاب صدقات النبي المروي في صحيح البخاري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} وتبحث أحكامها في كتاب الزكاة عند زكاة الإبل، وتبحث في الديات عند تغليظها أو تخفيفها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} "
  en: "A hiqqa is a camel that has entered its fourth year, and the female is called hiqqa; the name is taken from its fitness to be ridden and loaded and to be covered by the stallion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Related terms: ibn makhad and bint makhad (second year), ibn labun and bint labun (third year), and jadha'a and jadhaa (fifth year), the last age of camels counted for zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} The jurists agree that a hiqqa is due for 46 to 60 camels, and two hiqqas for 91 to 120; the mawsu'a grounds this on Anas's narration of the Prophet's charity rulings in Sahih al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} Its rules are treated in the zakat book under camels and in the blood-money articles, where they stiffen or lighten the diya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} "
  ur: "حُقّہ اونٹ کو کہتے ہیں جو چوتھے سال میں داخل ہو، اور مادہ کو حِقّہ کہا جاتا ہے؛ یہ نام اس بنا پر ہے کہ وہ سواری اور بار برداری کے قابل ہو جاتا ہے اور نر اس پر چڑھ سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} متعلقہ الفاظ: دوسرے سال میں ابن مخاض اور بنت مخاض، تیسرے سال میں ابن لبون اور بنت لبون، اور پانچویں سال میں جذع اور جذعہ، جو زکوٰۃ میں اونٹوں کی آخری عمر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} فقہاء کا اجماع ہے کہ چھیالیس سے ساٹھ اونٹوں میں ایک حقہ واجب ہے، اور اکیانوے سے ایک سو بیس میں دو حقے؛ اس کی دلیل انس کی روایت ہے جو صحیح بخاری میں نبی کی صدقات کی تحریر سے منقول ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} ان کے احکام زکوٰۃ کی کتاب میں اونٹوں کی زکوٰۃ کے تحت اور دیت میں اس کے سخت یا ہلکے ہونے کے موقع پر زیرِ بحث آتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} "
