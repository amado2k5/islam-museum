label: { ar: "الحُقّة", en: "Hiqqa (a camel of four years)", ur: "حقہ ⁦(اونٹ کی عمر)⁩", es: "Hiqqa (un camello de cuatro años)", fr: "Hiqqa (un chameau de quatre ans)", tr: "Gerçek", id: "Kebenaran" }
summary:
  ar: "الحُقّة من الإبل ما طعن في السنة الرابعة، والأنثى حِقّة، وسميت بذلك لأنها استحقت أن تُركب ويُحمل عليها، ولأنها استحقت أن يطرقها الفحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} وتقابلها في الألفاظ ذات الصلة: ابن المخاض وبنت المخاض في السنة الثانية، وابن اللبون وبنت اللبون في الثالثة، والجذع والجذعة في الخامسة، وهو آخر أسنان الإبل في الزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} وأجمع الفقهاء على أنه تجب حقة في ست وأربعين من الإبل إلى ستين، وفي إحدى وتسعين حقتان إلى مائة وعشرين، ويستند المدخل إلى حديث أنس في كتاب صدقات النبي المروي في صحيح البخاري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} وتبحث أحكامها في كتاب الزكاة عند زكاة الإبل، وتبحث في الديات عند تغليظها أو تخفيفها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} "
  en: "A hiqqa is a camel that has entered its fourth year, and the female is called hiqqa; the name is taken from its fitness to be ridden and loaded and to be covered by the stallion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Related terms: ibn makhad and bint makhad (second year), ibn labun and bint labun (third year), and jadha'a and jadhaa (fifth year), the last age of camels counted for zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} The jurists agree that a hiqqa is due for 46 to 60 camels, and two hiqqas for 91 to 120; the mawsu'a grounds this on Anas's narration of the Prophet's charity rulings in Sahih al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} Its rules are treated in the zakat book under camels and in the blood-money articles, where they stiffen or lighten the diya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} "
  ur: "حُقّہ اونٹ کو کہتے ہیں جو چوتھے سال میں داخل ہو، اور مادہ کو حِقّہ کہا جاتا ہے؛ یہ نام اس بنا پر ہے کہ وہ سواری اور بار برداری کے قابل ہو جاتا ہے اور نر اس پر چڑھ سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} متعلقہ الفاظ: دوسرے سال میں ابن مخاض اور بنت مخاض، تیسرے سال میں ابن لبون اور بنت لبون، اور پانچویں سال میں جذع اور جذعہ، جو زکوٰۃ میں اونٹوں کی آخری عمر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} فقہاء کا اجماع ہے کہ چھیالیس سے ساٹھ اونٹوں میں ایک حقہ واجب ہے، اور اکیانوے سے ایک سو بیس میں دو حقے؛ اس کی دلیل انس کی روایت ہے جو صحیح بخاری میں نبی کی صدقات کی تحریر سے منقول ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} ان کے احکام زکوٰۃ کی کتاب میں اونٹوں کی زکوٰۃ کے تحت اور دیت میں اس کے سخت یا ہلکے ہونے کے موقع پر زیرِ بحث آتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} "
  es: "Un hiqqa es un camello que ha entrado en su cuarto año, y la hembra se llama hiqqa; el nombre se toma de su aptitud para ser montado y cargado y para ser cubierto por el semental. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Términos relacionados: ibn makhad y bint makhad (segundo año), ibn labun y bint labun (tercer año), y jadha'a y jadhaa (quinto año), la última edad de los camellos que se cuenta para el zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} Los juristas están de acuerdo en que se debe un hiqqa para 46 a 60 camellos, y dos hiqqas para 91 a 120; el mawsu'a basa esto en la narración de Anas de las normas de caridad del Profeta en Sahih al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} Sus reglas se tratan en el libro del zakat bajo los camellos y en los artículos sobre el dinero de sangre, donde endurecen o aligeran la diya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215}"
  fr: "Une hiqqa désigne un chameau ayant atteint sa quatrième année, et la femelle est également appelée hiqqa; ce nom provient de son aptitude à être montée, chargée et saillie par l’étalon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7214} Termes apparentés: ibn makhad et bint makhad (deuxième année), ibn labun et bint labun (troisième année), et jadha'a et jadhaa (cinquième année), dernier âge des chameaux pris en compte pour la zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} Les juristes s’accordent à dire qu’une hiqqa est due pour 46 à 60 chameaux, et deux hiqqas pour 91 à 120. La mawsu'a fonde cela sur le récit d'Anas concernant les règles relatives à la charité du Prophète dans Sahih al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215} Ses règles sont traitées dans le livre sur la zakat, sous les rubriques relatives aux chameaux et au prix du sang, où elles précisent la rigidité ou l'allègement de la diya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7215}"
  tr: "'haka' devesi dördüncü sınıfta bıçaklanan deve, dişi ise 'haqqah'dır., bu isim, üzerinde binilmeyi ve taşınmayı hak ettiği ve bir koç tarafından vurulmayı hak ettiği için verilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7214} Buna karşılık gelen kelimeler şunlardır: ikinci yılda emek oğlu ve işçinin kızı, üçüncü yılda sütün oğlu ve sütün kızı, beşinci yılda ise develerin zekatındaki son dişleri olan gövde ve gövde ile gövde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7215} Hukukçular oybirliğiyle, kırk altı ile altmış deve için, doksan bir deve için ise iki ila yüz yirmi yıl arasında hak hak edildiğini kabul etmektedir. Giriş, Sahih al-Bukhari'de rivayet edilen Peygamber'in Sadakat Kitabı'ndaki Anas hadislerine dayanmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7215} Zekât Kitabı'nda develerle ilgili hükümleri incelenir ve kan parası artırılır veya azaltılırken tartışılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7215}"
  id: "Unta 'haqa' adalah yang ditusuk pada tahun keempat, dan betina disebut 'haqqah,' dinamai demikian karena dia pantas ditunggangi dan digendong, serta karena dia pantas dipukul oleh domba jantan. {kutip:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7214} Kata-kata yang sepadan adalah: anak pekerja dan putri pekerja pada tahun kedua, anak susu dan putri susu pada tahun ketiga, dan batang dan batang pada tahun kelima, yang merupakan gigi terakhir unta dalam zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7215} Para ahli hukum sepakat bahwa hak untuk empat puluh enam hingga enam puluh unta, dan untuk sembilan puluh satu unta untuk dua hingga seratus dua puluh dua puluh. Pendahuluan didasarkan pada hadis Anas dalam Kitab Kasih Nabi yang diceritakan dalam Sahih al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7215} Keputusannya diperiksa dalam Kitab Zakat mengenai unta, dan membahas uang darah saat menambah atau menguranginya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7215}"
