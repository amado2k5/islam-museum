label:
  ar: الصبر
  en: Sabr (patience and steadfast endurance)
summary:
  ar: "حبس النفس على طاعة الله وعن معاصيه وعلى أقداره المؤلمة؛ يذكر ابن رجب في شرح وصية ابن عباس أن الرضا فضل مندوب إليه مستحب والصبر واجب على المؤمن حتم لأن الله أمر به ووعد عليه جزيل الأجر، وأن في الصبر على ما تكره خيراً كثيراً إذ ما أصاب العبد من المصائب المكتوبة عليه إذا صبر عليها كان له في الصبر خير كثير، وفي رواية عمر مولى غفرة «فإن استطعت أن تعمل لله بالرضا في اليقين فافعل وإن لم تستطع فإن في الصبر على ما تكره خيراً كثيراً»؛ والعبد محتاج إلى الاستعانة بالله في فعل المأمورات وترك المحظورات والصبر على المقدورات كلها في الدنيا وعند الموت وأهوال البرزخ ويوم القيامة ولا يقدر على الإعانة عليها إلا الله، ومن حقق الاستعانة عليه في ذلك كله أعانه، ومنه حديث «احرص على ما ينفعك واستعن بالله ولا تعجز»؛ وقوله «إن النصر مع الصبر» يشمل الجهادين: جهاد العدو الظاهر وجهاد العدو الباطن، فمن صبر فيهما نصر وظفر بعدوه ومن جزع قهر وصار أسيراً له أو قتيلاً، وقال ابن المبارك من صبر فما أقل ما يصبر ومن جزع فما أقل ما يتمتع، ويلي ذلك «الفرج مع الكرب» و«مع العسر يسراً». ويورد رياض الصالحين في بابه في الصبر قوله تعالى «واستعينوا بالصبر والصلاة إن الله مع الصابرين» والأمر «اصبروا وصابروا ورابطوا» و«لنبلونكم بشيء من الخوف والجوع ونقص من الأموال والأنفس والثمرات وبشر الصابرين»، وأحاديثه: قول النبي «عجباً لأمر المؤمن إن أمره كله خير... وإن أصابته ضراء صبر فكان خيراً له» رواه مسلم، وقول أبي سعيد «من يتصبّر يصبّره الله وما أُعطي أحد عطاءً خيراً وأوسع من الصبر» المتفق عليه، وقوله لوفاة حمزة «ليس على أبيك كرب بعد اليوم»، وأمره أسماءَ لما احتضر ولدها «فلتصبّر ولتحتسب» {cite:riyad-salihin p.16}{cite:riyad-salihin p.17}{cite:riyad-salihin p.18}"
  en: "Holding the soul to God's obedience, away from disobedience, and through His painful decrees; in the commentary on Ibn Abbas's counsel Ibn Rajab records that contentment is a recommended excellence while patience is binding upon the believer, God having commanded it and promised a vast reward, that in patience over what one dislikes lies much good since the affliction written upon the servant, borne patiently, yields much good — Amr mawla Ghafra's route adding 'if you can work for God with contentment in certainty then do, and if not, then in patience over what you dislike lies much good'; the servant needs God's aid for performing the commands, abandoning the forbidden and bearing all decreed things in the world, at death and through the terrors of the barzakh and resurrection — none can aid that but God, and whoever truly seeks His aid is aided, as in 'strive for what benefits you, seek God's help and do not flag'; 'victory is with patience' covers both jihads, the outward enemy and the inward — the patient triumphs and the fretter is captured or slain — and Ibn al-Mubarak's saying 'whoever is patient, how little he needs to endure, and whoever frets, how little he enjoys', followed by 'relief is with affliction' and 'with hardship is ease'. Riyad al-Salihin's chapter on patience cites «seek help through patience and prayer, for God is with the patient» and «be patient, persevere and stand firm» and «We shall surely test you with some fear and hunger and loss of wealth and lives and fruits, and give glad tidings to the patient», and its hadiths: «wonderful is the affair of the believer — if good befalls him he is grateful and that is good for him, and if harm befalls him he is patient and that is good for him» (Muslim), Abu Sa'id's «whoever is patient, God grants him patience, and no one was given a better or wider gift than patience» (agreed upon), the Prophet's word at Hamza's death «your father feels no grief after this day», and his instruction to Asma's dying son's family «be patient and seek reward» {cite:riyad-salihin p.16}{cite:riyad-salihin p.17}{cite:riyad-salihin p.18}"
