id: concept/sabr
class: concept
kind: ethical
tags: [akhlaq-browser, akhlaq-sabr, arkan-browser, arkan-khisal, ritha-browser, ritha-kind-taziya]
label:
  ar: الصبر
  en: Sabr (patience and steadfast endurance)
  es: "Sabr (paciencia y perseverancia inquebrantable)"
  fr: "Sabr (patience et endurance inébranlable)"
  ur: "صبر ⁦(صبر اور استقامت)⁩"
summary:
  ar: "حبس النفس على طاعة الله وعن معاصيه وعلى أقداره المؤلمة؛ يذكر ابن رجب في شرح وصية ابن عباس أن الرضا فضل مندوب إليه مستحب والصبر واجب على المؤمن حتم لأن الله أمر به ووعد عليه جزيل الأجر، وأن في الصبر على ما تكره خيراً كثيراً إذ ما أصاب العبد من المصائب المكتوبة عليه إذا صبر عليها كان له في الصبر خير كثير، وفي رواية عمر مولى غفرة «فإن استطعت أن تعمل لله بالرضا في اليقين فافعل وإن لم تستطع فإن في الصبر على ما تكره خيراً كثيراً»؛ والعبد محتاج إلى الاستعانة بالله في فعل المأمورات وترك المحظورات والصبر على المقدورات كلها في الدنيا وعند الموت وأهوال البرزخ ويوم القيامة ولا يقدر على الإعانة عليها إلا الله، ومن حقق الاستعانة عليه في ذلك كله أعانه، ومنه حديث «احرص على ما ينفعك واستعن بالله ولا تعجز»؛ وقوله «إن النصر مع الصبر» يشمل الجهادين: جهاد العدو الظاهر وجهاد العدو الباطن، فمن صبر فيهما نصر وظفر بعدوه ومن جزع قهر وصار أسيراً له أو قتيلاً، وقال ابن المبارك من صبر فما أقل ما يصبر ومن جزع فما أقل ما يتمتع، ويلي ذلك «الفرج مع الكرب» و«مع العسر يسراً». ويورد رياض الصالحين في بابه في الصبر قوله تعالى «واستعينوا بالصبر والصلاة إن الله مع الصابرين» والأمر «اصبروا وصابروا ورابطوا» و«لنبلونكم بشيء من الخوف والجوع ونقص من الأموال والأنفس والثمرات وبشر الصابرين»، وأحاديثه: قول النبي «عجباً لأمر المؤمن إن أمره كله خير... وإن أصابته ضراء صبر فكان خيراً له» رواه مسلم، وقول أبي سعيد «من يتصبّر يصبّره الله وما أُعطي أحد عطاءً خيراً وأوسع من الصبر» المتفق عليه، وقوله لوفاة حمزة «ليس على أبيك كرب بعد اليوم»، وأمره أسماءَ لما احتضر ولدها «فلتصبّر ولتحتسب» {cite:riyad-salihin p.16}{cite:riyad-salihin p.17}{cite:riyad-salihin p.18} وتعرض دائرة المعارف الإسلامية، الطبعة الثانية، الصبر بوصفه مفهوماً أوسع من الصبر بمعناه العادي، يرد في القرآن والحديث بمعاني التحمل والتسليم والثبات في الجهاد، ويصير في الأدب الصوفي فضيلة محورية، ويعالجه الغزالي في الإحياء قريناً للشكر. {cite:encyclopaedia-of-islam-2 vol. 8 p. 738}{cite:encyclopaedia-of-islam-2 vol. 8 p. 739}{cite:encyclopaedia-of-islam-2 vol. 8 p. 740}"
  en: "Holding the soul to God's obedience, away from disobedience, and through His painful decrees; in the commentary on Ibn Abbas's counsel Ibn Rajab records that contentment is a recommended excellence while patience is binding upon the believer, God having commanded it and promised a vast reward, that in patience over what one dislikes lies much good since the affliction written upon the servant, borne patiently, yields much good — Amr mawla Ghafra's route adding 'if you can work for God with contentment in certainty then do, and if not, then in patience over what you dislike lies much good'; the servant needs God's aid for performing the commands, abandoning the forbidden and bearing all decreed things in the world, at death and through the terrors of the barzakh and resurrection — none can aid that but God, and whoever truly seeks His aid is aided, as in 'strive for what benefits you, seek God's help and do not flag'; 'victory is with patience' covers both jihads, the outward enemy and the inward — the patient triumphs and the fretter is captured or slain — and Ibn al-Mubarak's saying 'whoever is patient, how little he needs to endure, and whoever frets, how little he enjoys', followed by 'relief is with affliction' and 'with hardship is ease'. Riyad al-Salihin's chapter on patience cites «seek help through patience and prayer, for God is with the patient» and «be patient, persevere and stand firm» and «We shall surely test you with some fear and hunger and loss of wealth and lives and fruits, and give glad tidings to the patient», and its hadiths: «wonderful is the affair of the believer — if good befalls him he is grateful and that is good for him, and if harm befalls him he is patient and that is good for him» (Muslim), Abu Sa'id's «whoever is patient, God grants him patience, and no one was given a better or wider gift than patience» (agreed upon), the Prophet's word at Hamza's death «your father feels no grief after this day», and his instruction to Asma's dying son's family «be patient and seek reward» {cite:riyad-salihin p.16}{cite:riyad-salihin p.17}{cite:riyad-salihin p.18} The Encyclopaedia of Islam, second edition, presents sabr as a notion wider than ordinary patience: in the Qur'an and Hadith it carries the senses of endurance, resignation and steadfastness in holy war, in Sufi writing it becomes a cardinal virtue, and al-Ghazali treats it in the Ihya alongside gratitude. {cite:encyclopaedia-of-islam-2 vol. 8 p. 738}{cite:encyclopaedia-of-islam-2 vol. 8 p. 739}{cite:encyclopaedia-of-islam-2 vol. 8 p. 740}"
  ur: "دائرۃ المعارف اسلامیہ کے دوسرے ایڈیشن کے مطابق صبر عام تحمل سے وسیع تصور ہے: قرآن اور حدیث میں یہ برداشت، تسلیم اور جہاد میں ثابت قدمی کے معنی رکھتا ہے، صوفی ادب میں بنیادی فضیلت بن جاتا ہے، اور غزالی احیاء میں اسے شکر کے ساتھ بیان کرتے ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 8 p. 738}{cite:encyclopaedia-of-islam-2 vol. 8 p. 739}{cite:encyclopaedia-of-islam-2 vol. 8 p. 740}"
  es: "Mantener el alma en la obediencia a Dios, lejos de la desobediencia, y a través de Sus dolorosos decretos; en el comentario sobre el consejo de Ibn Abbas, Ibn Rajab registra que el contentamiento es una excelencia recomendada, mientras que la paciencia es vinculante para el creyente, habiéndola ordenado Dios y prometido una gran recompensa, que en la paciencia sobre lo que a uno le disgusta reside mucho bien, ya que la aflicción escrita sobre el siervo, soportada con paciencia, produce mucho bien; la ruta de Amr mawla Ghafra agrega: \"si puedes trabajar para Dios con contentamiento en la certeza, entonces hazlo, y si no, entonces en la paciencia sobre lo que te disgusta reside mucho bien\"; el siervo necesita la ayuda de Dios para cumplir los mandamientos, abandonar lo prohibido y soportar todas las cosas decretadas en el mundo, en la muerte y a través de los terrores del barzakh y la resurrección; nadie puede ayudar en eso sino Dios, y quien verdaderamente busca Su ayuda es ayudado, como en \"esfuérzate por lo que te beneficia, busca la ayuda de Dios y no desfallezcas\"; La frase «la victoria se consigue con paciencia» abarca ambas yihads, la del enemigo externo y la del interno: el paciente triunfa y el ansioso es capturado o asesinado. También se aplica al dicho de Ibn al-Mubarak: «quien es paciente, ¡qué poco tiene que soportar!, y quien se inquieta, ¡qué poco disfruta!», seguido de «el alivio viene con la aflicción» y «con la dificultad viene la facilidad». El capítulo de Riyad al-Salihin sobre la paciencia cita «buscad ayuda a través de la paciencia y la oración, pues Dios está con el paciente» y «sed pacientes, perseverad y manteneos firmes» y «Ciertamente os pondremos a prueba con algo de temor, hambre, pérdida de riquezas, vidas y frutos, y daremos buenas nuevas al paciente», y sus hadices: «maravilloso es el asunto del creyente: si le acontece algo bueno, es agradecido y eso es bueno para él, y si le acontece algo malo, es paciente y eso es bueno para él» (Muslim), el de Abu Sa'id «quien es paciente, Dios le concede paciencia, y a nadie se le ha dado un don mejor ni más amplio que la paciencia» (acordado), las palabras del Profeta en la muerte de Hamza «vuestro padre no siente pena después de este día», y su instrucción a la familia del hijo moribundo de Asma «sed pacientes y buscad recompensa» {cite:riyad-salihin p.16}{cite:riyad-salihin pág. 17}{cite:riyad-salihin pág. 18} La Enciclopedia del Islam, segunda edición, presenta el sabr como una noción más amplia que la paciencia ordinaria: en el Corán y los Hadices conlleva los sentidos de resistencia, resignación y firmeza en la guerra santa; en los escritos sufíes se convierte en una virtud cardinal; y al-Ghazali la trata en el Ihya junto con la gratitud. {cite:encyclopaedia-of-islam-2 vol. 8 pág. 738}{cite:encyclopaedia-of-islam-2 vol. 8 pág. 739}{cite:encyclopaedia-of-islam-2 vol. 8 pág. 740}"
  fr: "Maintenir son âme dans l'obéissance à Dieu, loin de la désobéissance, et traverser Ses décrets douloureux; dans son commentaire sur les conseils d'Ibn Abbas, Ibn Rajab rapporte que le contentement est une vertu recommandée tandis que la patience est une obligation pour le croyant, Dieu l'ayant ordonnée et lui ayant promis une immense récompense. Il souligne que la patience face à ce qui déplaît recèle un grand bien, car l'affliction infligée au serviteur, supportée avec patience, produit de grands bienfaits. Amr mawla Ghafra ajoute: « Si tu peux œuvrer pour Dieu avec un contentement certain, fais-le; sinon, la patience face à ce qui te déplaît recèle un grand bien. » Le serviteur a besoin de l'aide de Dieu pour accomplir les commandements, abandonner l'interdit et supporter toutes les choses décrétées dans ce monde, à l'heure de la mort et à travers les terreurs du barzakh et de la résurrection. Nul ne peut l'aider si ce n'est Dieu, et quiconque recherche sincèrement Son aide est aidé, comme dans le proverbe: « Efforce-toi d'obtenir ce qui te profite, implore l'aide de Dieu et ne te décourage pas. » « La victoire est avec la patience » englobe les deux djihads, l'ennemi extérieur et l'ennemi intérieur — le patient triomphe et l'irritable est capturé ou tué — ainsi que le dicton d'Ibn al-Mubarak: « Celui qui est patient, combien peu il a à endurer, et celui qui s'irrite, combien peu il jouit », suivi de « le soulagement vient de l'affliction » et « avec la difficulté vient la facilité ». Le chapitre de Riyad al-Salihin sur la patience cite: « Cherchez secours par la patience et la prière, car Dieu est avec les patients », « Soyez patients, persévérez et tenez bon », « Nous vous éprouverons certes par un peu de peur, de faim, de perte de biens, de vies et de récoltes, et Nous annoncerons la bonne nouvelle aux patients », ainsi que les hadiths suivants: « La situation du croyant est merveilleuse: si le bien lui arrive, il est reconnaissant, et cela est un bien pour lui; si le mal le frappe, il est patient, et cela est un bien pour lui » (Muslim), d'Abu Sa'id: « Quiconque est patient, Dieu lui accorde la patience, et nul n'a reçu de don plus grand ni plus précieux que la patience » (unanimement reconnu), les paroles du Prophète à la mort de Hamza: « Ton père ne ressentira plus de chagrin après ce jour », et son instruction à la famille du fils mourant d'Asma: « Soyez patients et attendez-vous à une récompense ». p.17}{cite:riyad-salihin p.18} L'Encyclopédie de l'Islam, deuxième édition, présente le sabr comme une notion plus large que la simple patience: dans le Coran et les hadiths, il revêt les sens d'endurance, de résignation et de constance dans le combat spirituel; dans les écrits soufis, il devient une vertu cardinale; et al-Ghazali le traite dans l'Ihya au même titre que la gratitude. {cite:encyclopaedia-of-islam-2 vol. 8 p. 738}{cite:encyclopaedia-of-islam-2 vol. 8 p. 739}{cite:encyclopaedia-of-islam-2 vol. 8 p. 740}"
