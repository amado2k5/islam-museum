id: concept/sibghat-allah
class: concept
kind: doctrine
label:
  ar: "صبغة الله"
  en: "The dye of God (sibghat Allah)"
summary:
  ar: "يقرأ الشعراوي الصبغة الإلهية في [[passage/quran-2-138|الآية 138 من البقرة]] على أن الإيمان يتخلل الإنسان كما تتخلل الصبغة المصبوغ، لا طلاء يُزال، ويربطها بالفطرة التي وُلد عليها كل مولود، ويرى أن ما يُصنع من تعميد الطفل لا يعطي صبغة. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.612}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.613}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.615}"
  en: "Sha'rawi reads the dye named in [[passage/quran-2-138|2:138]] as faith that penetrates a person as dye penetrates cloth, not a surface coat that can be removed. He ties it to the fitra in which each child is born, and holds that a ritual of baptism gives no such dye {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.612}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.613}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.615}."
wings: [ideas]
themes: [creed, spirituality-and-sufism]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "ما الفرق بين الصبغة والطلاء في معنى الإيمان، وما علاقة الإيمان بالفطرة الأولى؟"
  en: "What is the difference between dye and coating in the meaning of faith, and what is faith's link to the first nature (fitra)?"
perspectives:
  - tradition: sunni
    id: sharawi-dye-fitra
    stance:
      ar: "الإيمان صبغة داخلية تتخلل الإنسان وتوافق الفطرة، لا طلاء خارجي"
      en: "Faith is an inner dye that penetrates the person and accords with the fitra, not an outer coating"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن الحناء صبغة تتخلل المادة الحية، وطلاء الأظافر يُزال، وأن صبغة الله فطرة ركبها الله في القلب، وأن اختلاف ألوان البشر من صبغة الله، وأن الإيمان يهز كل أعضاء الجسد. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.612}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.613}"
      en: "Sha'rawi says henna is a dye that penetrates living matter while nail varnish can be removed, that the dye of God is a fitra set in the heart at creation, that human colours are part of God's dye, and that faith moves the whole body {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.612}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.613}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-other-readings
    stance:
      ar: "أقوال المفسرين الآخرين في الصبغة والفطرة والرأي الأكاديمي لم تُدخل في هذه الدفعة"
      en: "Other exegetes' readings of the dye and the fitra and the academic view are not entered in this batch"
    holders: []
    summary:
      ar: "لم تُدخل هنا أقوال غيره في معنى الفطرة وتفسير الحديث المذكور في الهامش، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.613}"
      en: "Other readings of the fitra and of the hadith cited in the footnote, the academic view and other views are not entered here {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.613}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
