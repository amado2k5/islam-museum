summary:
  ar: "القثاء في الكتاب بارد رطب إلى الثانية، بزره خير من بزر الخيار وأفضله النضيج، يسكن الحرارة والصفراء لكن كيموسه رديء مستعد للعفونة، ويسكن العطش، وفيه إدرار وتليين، وورقه ينفع من عضة الكلب الكلب {cite:canon-ibn-sina-print-v1 pp.656-657}"
  en: "Qittha' is in the book cold and moist up to the second degree; its seed is better than the seed of khiyar and the ripe is the best; it calms heat and bile, but its chyme is bad and prone to putrefaction; it quenches thirst, drives urine and softens, and its leaf benefits the bite of a rabid dog {cite:canon-ibn-sina-print-v1 pp.656-657}"
  ur: "قثاء کتاب میں دوسرے درجے تک ٹھنڈا تر ہے، اس کا بیج خیار کے بیج سے بہتر ہے اور بہترین پکا ہوا ہے؛ گرمی اور صفرا کو تسکین دیتا ہے مگر اس کا کیموس برا اور سڑنے کے قریب ہے؛ پیاس بجھاتا، پیشاب جاری کرتا اور نرم کرتا ہے، اور اس کا پتا باؤلے کتے کے کاٹنے میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.656-657}۔"
  es: "En el libro, Qittha' es fría y húmeda hasta el segundo grado; su semilla es mejor que la de khiyar y la madura es la mejor; calma el calor y la bilis, pero su quimo es malo y propenso a la putrefacción; sacia la sed, estimula la micción y ablanda, y su hoja beneficia la mordedura de un perro rabioso {cite:canon-ibn-sina-print-v1 pp.656-657}"
  fr: "Le Qittha' est décrit dans le livre comme froid et humide jusqu'au deuxième degré; sa graine est meilleure que celle du khiyar et le fruit mûr est le meilleur; il calme la chaleur et la bile, mais son chyme est mauvais et sujet à la putréfaction; il étanche la soif, favorise la diurèse et adoucit, et sa feuille est bénéfique contre la morsure d'un chien enragé {cite:canon-ibn-sina-print-v1 pp.656-657}"
  tr: "Kitaptaki stükum ikinci saniyeye kadar soğuk ve nemlidir; tohumları salatalık tohumlarından daha iyidir ve en iyileri olgunlaşır. Sıcaklığı ve sararmayı yatıştırır, ama chimoları fakir, çürümeye hazır ve susuzluğu giderir. Kayganlaştırıcısı ve yumuşaklığı vardır, yaprakları köpek ısırıklarından faydalıdır {cite:canon-ibn-sina-print-v1 s.656-657}"
  id: "Tukum dalam buku itu dingin dan lembap sampai yang kedua; bijinya lebih baik daripada biji mentimun dan yang terbaik sedang matang. Ia menenangkan panas dan kuning, tetapi chimo-nya lemah, siap membusuk, dan menghilangkan dahaga. Ia memiliki pelumasan dan kelembutan, dan daunnya berguna dari gigitan anjing {cite:canon-ibn-sina-print-v1 hlm.656-657}"
