id: concept/ahlam
class: concept
kind: term
label:
  ar: الأحلام
  en: Dreams (ahlam)
  ur: خواب
summary:
  ar: ما يقع في النوم من صور وأحلام. يجمع المتون بين الرؤيا الصادقة التي هي من الله وبشرى للمؤمن، والحلم الذي هو من الشيطان، وحديث النفس الذي لا يُعبأ به. {cite:sahih-al-bukhari} {cite:sahih-muslim}
  en: What the sleeper sees in sleep. The hadith collections divide it into the true dream (ru'ya), which is from God and a glad tidings for the believer; the bad dream (hulm), which is from Satan; and the soul's idle talk (hadith nafs), which is not acted on. {cite:sahih-al-bukhari} {cite:sahih-muslim}
  ur: 'نیند میں دیکھے گئے مناظر اور خواب۔ حدیث کی کتابیں ان کی تین قسمیں بیان کرتی ہیں: سچا خواب ⁦(رؤیا)⁩ جو اللہ کی طرف سے ہے اور مومن کے لیے بشارت ہے، برا خواب ⁦(حلم)⁩ جو شیطان کی طرف سے ہے، اور نفس کی بکواس جس پر عمل نہیں ہوتا۔ {cite:sahih-al-bukhari} {cite:sahih-muslim}'
