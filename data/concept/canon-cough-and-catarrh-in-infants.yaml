id: concept/canon-cough-and-catarrh-in-infants
class: concept
kind: scientific
label:
  ar: "السعال والزكام عند الصبيان عند ابن سينا"
  en: "Cough and nasal catarrh in infants in the Canon"
  fr: "Toux et catarrhe nasal du nourrisson dans le Canon"
  ur: "قانون میں بچوں کی کھانسی اور زکام"
  es: "Tos y catarro nasal en lactantes en el Canon"
summary:
  ar: "يذكر ابن سينا السعال والزكام عند الصبيان، وما أمر به من صب ماء حار كثير على الرأس وتلطيخ اللسان بالعسل والغمز على أصله ليتقيأ بلغماً، أو لعوق من صمغ وكثيراء {cite:canon-ibn-sina-print-v1 pp.213-214}."
  en: "Ibn Sina mentions cough and nasal catarrh in infants, with the directions to pour much hot water over the head, smear the tongue with honey and press its base so that phlegm is vomited, or a mixture of gum and tragacanth {cite:canon-ibn-sina-print-v1 pp.213-214}."
  fr: "Ibn Sina mentionne toux et catarrhe nasal du nourrisson : eau chaude abondante sur la tête, miel sur la langue puis pression à sa base pour faire vomir le phlegme, ou mélange de gomme et de tragacanthe {cite:canon-ibn-sina-print-v1 pp.213-214}."
  es: "Ibn Sina menciona la tos y el catarro nasal en los bebés, con instrucciones de verter mucha agua caliente sobre la cabeza, untar la lengua con miel y presionar su base para que vomite la flema, o una mezcla de goma y tragacanto {cite:canon-ibn-sina-print-v1 pp.213-214}."
  ur: "ابن سینا نے نوزائیدہ بچوں میں کھانسی اور ناک میں جلن کا ذکر کرتے ہوئے کہا ہے کہ سر پر بہت زیادہ گرم پانی ڈالیں، زبان کو شہد سے مسح کریں اور اس کی بنیاد کو دبائیں تاکہ بلغم کو قے آجائے، یا مسوڑھوں اور ٹریگاکانتھ کا مرکب۔"
