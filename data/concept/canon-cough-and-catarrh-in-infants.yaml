  ar: "يذكر ابن سينا السعال والزكام عند الصبيان، وما أمر به من صب ماء حار كثير على الرأس وتلطيخ اللسان بالعسل والغمز على أصله ليتقيأ بلغماً، أو لعوق من صمغ وكثيراء {cite:canon-ibn-sina-print-v1 pp.213-214}."
  en: "Ibn Sina mentions cough and nasal catarrh in infants, with the directions to pour much hot water over the head, smear the tongue with honey and press its base so that phlegm is vomited, or a mixture of gum and tragacanth {cite:canon-ibn-sina-print-v1 pp.213-214}."
