label:
  ar: "يَوم السبت"
  en: "Yawm al-Sabt (Saturday, fiqh)"
summary:
  ar: "السبت في اللغة الراحة والقطع والدهر ويوم من الأسبوع، وسَبْت اليهود انقطاعهم عن المعيشة والاكتساب، ويستعمله الفقهاء بالمعنى اللغوي. ومن أحكامه كراهة إفراده بالصوم عند الجمهور لحديث النهي عن صومه إلا في المفروض، ومعاملة يهودي في مسائل يومه: فلا يكره عند الحنابلة إكراه المرأة اليهودية على إفساد سبتها مع تأكد حق الزوج، ويسقط حق اليهودي في الشفعة إذا لم يطلبها لسبته، ويكلف بالحضور إلى مجلس القضاء في سبته عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18024}"
  en: "Sabt lexically is rest, ceasing, an age, and a day of the week; the sabbath of the Jews is their ceasing from work and gain, and the jurists use the word in its lexical sense. Among its rules: fasting it alone is disliked on the majority view, on the hadith forbidding its fast except what is obligatory; and it bears on the treatment of Jews — the Hanbalis do not object to a Muslim pressing his Jewish wife to break her sabbath where his right is due, a Jew who fails to claim pre-emption because of his sabbath loses it, and a Jew is summoned to court on his sabbath on the Hanafi and Shafi'i view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18024}"
