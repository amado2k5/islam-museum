id: concept/ashr-awakhir-ramadan
class: concept
kind: legal
label:
  ar: "العشر الأواخر من رمضان"
  en: "The last ten nights of Ramadan"
  fr: "Les dix dernières nuits de Ramadan"
  ur: "رمضان کے آخری عشرے"
  es: "Las últimas diez noches de Ramadán"
  tr: "Ramazan'ın son on günü"
  id: "Sepuluh hari terakhir Ramadan"
summary:
  ar: "العشر الأواخر من رمضان في اصطلاح الفقهاء تبدأ من ليلة الحادي والعشرين من رمضان وتنتهي بخروج الشهر، تاماً كان أو ناقصاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}. واتفق الفقهاء على استحباب مضاعفة الجهد في الطاعات فيها، بقيام الليل والإكثار من الصدقات وتلاوة القرآن وفعل المعروف، تأسياً بالنبي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. ويتأكد فيها استحباب الاعتكاف، ويستحب لمن يعتكف أن يدخل المسجد قبل غروب شمس ليلة الحادي والعشرين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. ويرى جمهور الفقهاء أن ليلة القدر باقية ولم ترفع، وأنها في شهر رمضان وفي العشر الأواخر منه، وأن أرجاها الليالي الوتر من هذه العشر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}."
  en: "In the usage of the jurists, the last ten nights of Ramadan begin on the night of the twenty-first and end when the month ends, whether it has thirty days or twenty-nine {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}. The jurists agree that effort in acts of worship is recommended in them: night prayer, more charity, more recitation of the Qur'an and good works, following the Prophet's practice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. Retreat (i'tikaf) is especially recommended in them, and one who intends it should enter the mosque before sunset on the twenty-first night {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. The majority hold that the Night of Power remains and has not been lifted, that it falls in Ramadan's last ten nights, and that the odd nights of these ten are the most likely {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}."
  fr: "Dans l’usage des juristes, les dix dernières nuits de Ramadan commencent la nuit du vingt-et-un et s’achèvent avec le mois, qu’il compte trente ou vingt-neuf jours {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}. Les juristes s’accordent à y recommander l’effort dans le culte : prière nocturne, davantage d’aumônes, de récitation du Coran et de bonnes œuvres, suivant la pratique du Prophète {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. La retraite (i'tikaf) y est particulièrement recommandée ; il est recommandé à celui qui l’envisage d’entrer dans la mosquée avant le coucher du soleil de la vingt-et-unième nuit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. La majorité estime que la Nuit du Destin subsiste et n’a pas été retirée, qu’elle tombe dans les dix dernières nuits de Ramadan et que les nuits impaires de ces dix sont les plus probables {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}."
  es: "En el uso de los juristas, las últimas diez noches de Ramadán comienzan la noche del veintiuno y terminan cuando termina el mes, ya sea que tenga treinta o veintinueve días {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}. Los juristas coinciden en que se recomienda el esfuerzo en los actos de adoración durante estas noches: oración nocturna, mayor caridad, mayor recitación del Corán y buenas obras, siguiendo la práctica del Profeta {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. El retiro (i'tikaf) es especialmente recomendable durante estas noches, y quien tenga la intención de realizarlo debe entrar en la mezquita antes de la puesta del sol de la noche del veintiuno {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. La mayoría sostiene que la Noche del Poder permanece y no ha sido eliminada, que cae en las últimas diez noches de Ramadán, y que las noches impares de estas diez son las más probables {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}."
  ur: "فقہاء کے استعمال میں رمضان المبارک کی آخری دس راتیں اکیسویں کی رات سے شروع ہوتی ہیں اور مہینہ ختم ہونے پر ختم ہوتی ہیں، چاہے اس میں تیس دن ہوں یا انتیس۔ فقہاء اس بات پر متفق ہیں کہ عبادات میں کوشش ان میں مستحب ہے: رات کی نماز، زیادہ صدقہ، قرآن کی زیادہ تلاوت اور اعمال صالحہ، سنت نبوی کی پیروی ان میں اعتکاف خاص طور پر مستحب ہے اور جو شخص اس کا ارادہ رکھتا ہے وہ اکیسویں رات کو غروب آفتاب سے پہلے مسجد میں داخل ہو جائے۔ جمہور کا خیال ہے کہ شب قدر باقی ہے اور اٹھائی نہیں گئی، کہ یہ رمضان کے آخری عشرہ کی راتوں میں آتی ہے، اور یہ کہ ان عشرہ کی طاق راتوں کا زیادہ امکان ہے"
  tr: "Ramazan'ın son on gecesi, fihih terminolojisiyle Ramazan'ın yirmi birinci gecesinde başlar ve ayın başında, tam ya da eksik olup bitmez {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11623} ile sona erer. Hukukçular, bu dönemde gece namazı etmek, sadakatı artırmak, Kur'an okumak ve iyi işler yapmak gibi ibadet faaliyetlerinde çaba gösterilmesi önerisinde hemfikir oldular; bu, Peygamber'in örneğini takip eder {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11624}} Ayrıca, bu dönemde i'tikaf yapmanın tavsiye edildiği ve i'tikaf yapanın yirmi birinci gece gün batımından önce camiye girmesi tavsiye edilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11624}. Çoğu hukukçu, Laylat al-Kadr'ın kaldığını ve kaldırılmadığını, Ramazan ayında ve son on gecesinde olduğunu ve bu on günden farklı gecelerin ertelendiğini kabul eder {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11624}."
  id: "Sepuluh malam terakhir Ramadan, dalam istilah yurisprudensi, dimulai pada malam tanggal dua puluh satu Ramadan dan berakhir pada awal bulan, baik yang lengkap maupun tidak {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11623}. Para ahli hukum sepakat pada rekomendasi untuk menggandakan usaha dalam ibadah selama waktu ini, seperti shalat malam, meningkatkan amal, membaca Al-Qur'an, dan melakukan perbuatan baik, mengikuti teladan Nabi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11624}. Juga ditekankan bahwa melakukan i'tikaf dianjurkan pada waktu ini, dan disarankan bagi yang melakukan i'tikaf untuk masuk ke masjid sebelum matahari terbenam pada malam kedua puluh satu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11624}. Mayoritas ahli hukum berpendapat bahwa Laylat al-Qadr tetap ada dan tidak dicabut, bahwa itu terjadi pada bulan Ramadan dan sepuluh malam terakhirnya, dan bahwa malam-malam ganjil ditunda dari sepuluh hari tersebut {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11624}."
