label:
  ar: "العشر الأواخر من رمضان"
  en: "The last ten nights of Ramadan"
  ur: "رمضان کے آخری عشرے"
summary:
  ar: "العشر الأواخر من رمضان في اصطلاح الفقهاء تبدأ من ليلة الحادي والعشرين من رمضان وتنتهي بخروج الشهر، تاماً كان أو ناقصاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}. واتفق الفقهاء على استحباب مضاعفة الجهد في الطاعات فيها، بقيام الليل والإكثار من الصدقات وتلاوة القرآن وفعل المعروف، تأسياً بالنبي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. ويتأكد فيها استحباب الاعتكاف، ويستحب لمن يعتكف أن يدخل المسجد قبل غروب شمس ليلة الحادي والعشرين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. ويرى جمهور الفقهاء أن ليلة القدر باقية ولم ترفع، وأنها في شهر رمضان وفي العشر الأواخر منه، وأن أرجاها الليالي الوتر من هذه العشر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}."
  en: "In the usage of the jurists, the last ten nights of Ramadan begin on the night of the twenty-first and end when the month ends, whether it has thirty days or twenty-nine {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623}. The jurists agree that effort in acts of worship is recommended in them: night prayer, more charity, more recitation of the Qur'an and good works, following the Prophet's practice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. Retreat (i'tikaf) is especially recommended in them, and one who intends it should enter the mosque before sunset on the twenty-first night {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}. The majority hold that the Night of Power remains and has not been lifted, that it falls in Ramadan's last ten nights, and that the odd nights of these ten are the most likely {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11624}."
