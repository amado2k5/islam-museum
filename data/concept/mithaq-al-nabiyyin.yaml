issue:
  ar: "هل يلزم كل نبي أن يصدّق من يأتي بعده ويؤيده، وما حدود الشهادة في الآية؟"
  en: "Must each prophet confirm and support whoever comes after him, and what is the scope of the testimony?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-confirm-and-support
  stance:
    ar: "على كل نبي وأتباعه تصديق الرسول القادم المصدق لما معهم ونصرته"
    en: "Each prophet and his followers must confirm and support a later messenger who confirms what they hold"
  summary:
    ar: "يرى الشعراوي أن الرسالات تتفق في العقائد والأخبار والقصص وتختلف في التشريعات بحسب الأزمنة، فلا يجوز أن تتعصب أمة لنبيها على رسول مصدق لما معها، وأن الإسلام جاء مصدقاً لما قبله في العقائد والأخبار والقصص {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1573}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1575}."
    en: "Sha'rawi holds that the messages agree in belief, reports and stories and differ in laws according to their times, so no community may be zealous for its prophet against a messenger who confirms what it holds. He holds that Islam came confirming what came before it in belief, reports and stories {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1573}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1575}."
