id: concept/mithaq-al-nabiyyin
class: concept
kind: doctrine
label:
  ar: ميثاق النبيين (تصديق الرسل ونصرتهم)
  en: The covenant of the prophets (confirming and supporting each messenger)
summary:
  ar: "يرى الشعراوي أن الله أخذ الميثاق على النبيين أن يؤمنوا بالرسول المصدق لما معهم وينصروه، وأن ذلك يمنع التعصب بين أتباع الرسل، ويجعل موكب الرسالات متلاحماً. ويقرر أن الإقرار والشهادة تقتضي شاهداً ومشهوداً عليه ومشهوداً به، ويعدّ التولي بعد ذلك فسقاً عن ركب الإيمان كله {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1572}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1574}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1575}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}."
  en: "Sha'rawi holds that God took a covenant from the prophets to believe in and support any messenger who comes confirming what they have, and that this prevents zealotry among the followers of messengers and keeps the succession of messages united. He holds that acknowledgement and testimony require a witness, a witnessed party and a matter witnessed, and that turning away after this is a departure from the whole community of faith {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1572}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1574}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1575}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}."
