id: concept/mithaq-al-nabiyyin
class: concept
kind: doctrine
tags: [islamic-economy-browser, islamic-economy-sukuk]
label:
  ar: ميثاق النبيين ⁦(تصديق الرسل ونصرتهم)⁩
  en: The covenant of the prophets (confirming and supporting each messenger)
  es: "El pacto de los profetas (que confirma y respalda a cada mensajero)"
  fr: "L'alliance des prophètes (confirmant et soutenant chaque messager)"
summary:
  ar: "يرى الشعراوي أن الله أخذ الميثاق على النبيين أن يؤمنوا بالرسول المصدق لما معهم وينصروه، وأن ذلك يمنع التعصب بين أتباع الرسل، ويجعل موكب الرسالات متلاحماً. ويقرر أن الإقرار والشهادة تقتضي شاهداً ومشهوداً عليه ومشهوداً به، ويعدّ التولي بعد ذلك فسقاً عن ركب الإيمان كله {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1572}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1574}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1575}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}."
  en: "Sha'rawi holds that God took a covenant from the prophets to believe in and support any messenger who comes confirming what they have, and that this prevents zealotry among the followers of messengers and keeps the succession of messages united. He holds that acknowledgement and testimony require a witness, a witnessed party and a matter witnessed, and that turning away after this is a departure from the whole community of faith {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1572}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1574}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1575}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}."
  es: "Sha'rawi sostiene que Dios tomó un pacto de los profetas para creer y apoyar a cualquier mensajero que venga confirmando lo que ellos tienen, y que esto evita el fanatismo entre los seguidores de los mensajeros y mantiene unida la sucesión de mensajes. Él sostiene que el reconocimiento y el testimonio requieren un testigo, una parte atestiguada y un asunto atestiguado, y que apartarse después de esto es una salida de toda la comunidad de fe {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1572}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1574}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1575}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1576}."
  fr: "Sha'rawi soutient que Dieu a conclu une alliance avec les prophètes, les enjoignant de croire en tout messager confirmant leurs enseignements et de le soutenir. Selon lui, cette alliance prévient le fanatisme parmi les disciples des messagers et assure la continuité de la transmission des messages. Il affirme que la reconnaissance et le témoignage requièrent un témoin, une partie et un fait attestés, et que tout reniement ultérieur constitue une rupture avec la communauté de foi."
