id: concept/al-qawl-al-hasan
class: concept
kind: ethical
label:
  ar: "القول الحسن"
  en: "Speaking well to people (al-qawl al-hasan)"
  fr: "Bien parler aux gens (al-qawl al-hasan)"
  ur: "اچھی بات کہنا"
  es: "Hablar bien con la gente (al-qawl al-hasan)"
  tr: "İyi söz"
  id: "Kata bagus"
summary:
  ar: "يرى عمر عبد الكافي أن الأمر بالقول الحسن عامّ للناس جميعًا، مسلمهم وغير مسلمهم، وأن على المرء أن يبحث عن الكلمة الأحسن، لأن القلب إناء واللسان مغرفة تغرف منه."
  en: "Omar Abdelkafy holds that the command to speak well applies to all people, Muslim or not, and that one should seek the better word, since the heart is a vessel and the tongue a ladle that draws from it."
  fr: "Omar Abdelkafy estime que l’ordre de bien parler s’applique à tous, musulmans ou non, et que l’on devrait chercher le meilleur mot : le cœur est un récipient et la langue est la louche qui y puise."
  ur: "عمر عبد الکافی کے نزدیک اچھی بات کہنے کا حکم تمام لوگوں کے لیے ہے، مسلمان ہوں یا نہ ہوں، اور انسان کو بہتر لفظ تلاش کرنا چاہیے، کیونکہ دل برتن ہے اور زبان چمچہ جو اس سے نکالتی ہے۔"
  es: "Omar Abdelkafy sostiene que el mandato de hablar bien se aplica a todas las personas, sean musulmanas o no, y que uno debe buscar la mejor palabra, ya que el corazón es un recipiente y la lengua un cucharón que extrae de él."
  tr: "Omar Abdelkafi, nazik konuşma emrinin tüm insanlar, Müslümanlar ve gayrimüslimler için genel olduğuna ve en iyi kelimeyi araması gerektiğine inanır; çünkü kalp bir kaptır, dil ise bir kepçedir."
  id: "Omar Abdelkafi percaya bahwa perintah untuk berbicara dengan lembut adalah universal bagi semua orang, Muslim maupun non-Muslim, dan bahwa seseorang harus mencari kata terbaik; karena hati adalah wadah, dan lidah adalah sendok sendok."
