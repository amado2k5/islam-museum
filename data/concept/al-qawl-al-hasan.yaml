  en: "Speaking well to people (al-qawl al-hasan)"
  ur: "اچھی بات کہنا"
summary:
  ar: "يرى عمر عبد الكافي أن الأمر بالقول الحسن عامّ للناس جميعًا، مسلمهم وغير مسلمهم، وأن على المرء أن يبحث عن الكلمة الأحسن، لأن القلب إناء واللسان مغرفة تغرف منه."
  en: "Omar Abdelkafy holds that the command to speak well applies to all people, Muslim or not, and that one should seek the better word, since the heart is a vessel and the tongue a ladle that draws from it."
  ur: "عمر عبد الکافی کے نزدیک اچھی بات کہنے کا حکم تمام لوگوں کے لیے ہے، مسلمان ہوں یا نہ ہوں، اور انسان کو بہتر لفظ تلاش کرنا چاہیے، کیونکہ دل برتن ہے اور زبان چمچہ جو اس سے نکالتی ہے۔"
