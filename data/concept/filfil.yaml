summary:
  ar: "الفلفل في الكتاب ثمر يقال إن أول طلوعه دار فلفل ثم ينفصل عنه حب الفلفل، حار يابس إلى الرابعة، فيه جذب وتحليل وجلاء، يقلع البلغم اللزج ويسخن العصب والعضل، والأبيض أصلح للمعدة، ويدخل الأبيض في الأكحال والترياقات، ويذكر الكتاب فيه أفعالا في الجنين والمني والباه {cite:canon-ibn-sina-print-v1 pp.626-627}"
  en: "Filfil is in the book the pepper, whose fruit first comes out as long pepper and then the grain of pepper separates from it; hot and dry to the fourth degree, with drawing, dissolving and cleansing, it removes viscous phlegm and warms nerves and muscles, the white is better for the stomach, the white enters eye salves and theriacs, and the book lists in it actions on the foetus, the semen and desire {cite:canon-ibn-sina-print-v1 pp.626-627}"
  ur: "فلفل کتاب میں کالی مرچ ہے جس کا پھل پہلے دارفلفل بن کر نکلتا ہے پھر اس سے دانۂ فلفل الگ ہو جاتا ہے؛ چوتھے درجے تک گرم خشک ہے، اس میں کھینچنے، تحلیل اور جلاء کی قوت ہے، لیس دار بلغم کو اکھاڑتی اور اعصاب و عضلات کو گرم کرتی ہے، سفید معدے کے لیے بہتر ہے، سفید سرمہ جات اور تریاقوں میں شامل ہوتی ہے، اور کتاب اس میں جنین، منی اور باہ پر اثرات بھی بتاتی ہے {cite:canon-ibn-sina-print-v1 pp.626-627}۔"
  es: "Filfil es en el libro la pimienta, cuyo fruto primero sale como pimienta larga y luego el grano de pimienta se separa de ella; caliente y seca hasta el cuarto grado, con propiedades de extracción, disolución y limpieza, elimina la flema viscosa y calienta los nervios y los músculos, la blanca es mejor para el estómago, la blanca entra en ungüentos para los ojos y teriacas, y el libro enumera en ella acciones sobre el feto, el semen y el deseo {cite:canon-ibn-sina-print-v1 pp.626-627}"
  fr: "Le filfil désigne dans le livre le poivre, dont le fruit se présente d'abord sous forme de longs grains, puis ces derniers s'en détachent. Chaud et sec jusqu'au quatrième degré, il agit en éliminant, en dissolvant et en purifiant les mucosités visqueuses et en réchauffant les nerfs et les muscles. Le blanc est bénéfique pour l'estomac et entre dans la composition de pommades ophtalmiques et de thériaques. Le livre mentionne également ses propriétés sur le fœtus, le sperme et le désir. {cite:canon-ibn-sina-print-v1 pp.626-627}"
  tr: "Kitapta karabiberin önce biber olarak ortaya çıktığı, sonra ondan ayrı biber tohumlarının çıktığı söylenir. Dördüncü mevsime kadar acı ve kurudur. Onu çeker, çözer ve temizler. Yapışkan balgamı dışarı atar ve sinir ile kası ısıtır. Beyaz mide için daha iyidir, beyaz ise sürme ve panzehirlerde kullanılır. Kitapta fetüs, meni ve papillalarla ilgili etkilerden bahsedilir {cite:canon-ibn-sina-print-v1 s.626-627}"
  id: "Dalam buku, lada adalah buah yang dikatakan pertama kali muncul sebagai cabai, lalu biji lada terpisah darinya. Buah ini panas dan kering hingga musim keempat. Ia menarik, melarutkan, dan membersihkannya. Ia mengeluarkan dahak lengket dan memanaskan saraf serta otot. Putih lebih baik untuk perut, dan putih digunakan dalam kohl dan penawar. Buku ini menyebutkan tindakan terkait janin, sperma, dan papila {cite:canon-ibn-sina-print-v1 hlm.626-627}"
