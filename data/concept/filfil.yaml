label:
  fr: "Poivre dans le Canon"
  ar: "فلفل"
  en: "Filfil (pepper)"
  ur: "فلفل"
summary:
  fr: "Selon Galien, le fruit à sa première apparition est le poivre long, puis le grain s'en sépare. Le poivre long serait plus humide, d'où une action corrosive et piquante légèrement retardée après la première saveur. La racine ressemble au costus noir, plus piquante ; le blanc serait moins chaud et humide. Certains disent que le noir a séché jusqu'à perdre son attraction, conservée dans le blanc, moins desséché {cite:canon-ibn-sina-print-v1 p.626}."
  ar: "الفلفل في الكتاب ثمر يقال إن أول طلوعه دار فلفل ثم ينفصل عنه حب الفلفل، حار يابس إلى الرابعة، فيه جذب وتحليل وجلاء، يقلع البلغم اللزج ويسخن العصب والعضل، والأبيض أصلح للمعدة، ويدخل الأبيض في الأكحال والترياقات، ويذكر الكتاب فيه أفعالا في الجنين والمني والباه {cite:canon-ibn-sina-print-v1 pp.626-627}"
  en: "Filfil is in the book the pepper, whose fruit first comes out as long pepper and then the grain of pepper separates from it; hot and dry to the fourth degree, with drawing, dissolving and cleansing, it removes viscous phlegm and warms nerves and muscles, the white is better for the stomach, the white enters eye salves and theriacs, and the book lists in it actions on the foetus, the semen and desire {cite:canon-ibn-sina-print-v1 pp.626-627}"
  ur: "فلفل کتاب میں کالی مرچ ہے جس کا پھل پہلے دارفلفل بن کر نکلتا ہے پھر اس سے دانۂ فلفل الگ ہو جاتا ہے؛ چوتھے درجے تک گرم خشک ہے، اس میں کھینچنے، تحلیل اور جلاء کی قوت ہے، لیس دار بلغم کو اکھاڑتی اور اعصاب و عضلات کو گرم کرتی ہے، سفید معدے کے لیے بہتر ہے، سفید سرمہ جات اور تریاقوں میں شامل ہوتی ہے، اور کتاب اس میں جنین، منی اور باہ پر اثرات بھی بتاتی ہے {cite:canon-ibn-sina-print-v1 pp.626-627}۔"
