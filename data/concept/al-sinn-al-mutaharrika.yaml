id: concept/al-sinn-al-mutaharrika
class: concept
kind: scientific
label:
  ar: السن المتحركة
  en: The loose tooth
  ur: ہلتا ہوا دانت
summary:
  ar: قد تقلق السن بسبب باد من سقطة أو ضربة، وقد تقع من رطوبة ترخي العصب الشاد للسن وتكون السن مع ذلك سمينة لم تقصف، وقد تقع لتأكل يعرض لمنابت الأسنان فيوسعها أو يدقق السن بما ينقص منها أو لانثلام الدردر، وقد تقع لضمور يعرض في الأسنان ليبس غالب كما يعرض للناقهين والمشايخ الذين جاعوا جوعاً متوالياً وقصر عنهم الغذاء، وقد تقع لقصور لحم العمور {cite:canon-ibn-sina-print-v2 p.273}
  en: A tooth may loosen for an outward cause — a fall or a blow; or from a moisture relaxing the nerve that binds the tooth while the tooth stays sound and unworn; or from a corrosion befalling the tooth-seats, widening them or thinning the tooth, or from a chipping of the socket's rim; or from a wasting that befalls the teeth under a prevailing dryness, as befalls convalescents and the aged whom successive hunger and short feeding have reached; or from a shortness of the gums' flesh {cite:canon-ibn-sina-print-v2 p.273}
  ur: دانت یا تو باہر کے سبب سے ہل سکتا ہے — گرنا یا چوٹ؛ یا ایسی رطوبت سے جو دانت باندھنے والے اعصاب کو ڈھیلا کرے حالانکہ دانت بھرا ہوا اور غیر رگڑا ہو؛ یا منبتوں پر عارض ہونے والے کتراؤ سے جو انہیں کشادہ یا دانت کو باریک کر دے یا کنارے کے کھرچ سے؛ یا دانتوں میں غالب خشکی سے ضمور سے جیسا نقاہت پانے والوں اور ان بزرگوں کو ہوتا ہے جن پر مسلسل بھوک گزری اور غذا کم ملی؛ یا مسوڑھوں کے گوشت کی کمی سے {cite:canon-ibn-sina-print-v2 p.273}
