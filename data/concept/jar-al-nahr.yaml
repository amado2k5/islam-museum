summary:
  ar: "نبات زهره يشبه زهر النيلوفر، يغوص في الماء ولا يظهر منه إلا يسير، وقوته قريبة من البطباط. يُقال إنه بارد قابض، وهو صالح للقروح الخبيثة {cite:canon-ibn-sina-print-v1 p.427}."
  en: "A water plant whose flower resembles the water lily. It grows submerged and shows little above the surface, and its strength is close to that of batbat. The book says it is cold and astringent and suits malignant ulcers {cite:canon-ibn-sina-print-v1 p.427}."
  ur: "پانی میں ڈوبا رہنے والا ایک پودا جس کا پھول نیلوفر سے مشابہ ہے اور جو سطح پر بہت کم ظاہر ہوتا ہے۔ اس کی قوت بطباط کے قریب ہے۔ کتاب کے مطابق یہ ٹھنڈا اور قابض ہے اور خبیث زخموں کے لیے مفید ہے {cite:canon-ibn-sina-print-v1 p.427}۔"
  es: "Una planta acuática cuya flor se asemeja al nenúfar. Crece sumergida y apenas sobresale de la superficie; su resistencia es similar a la del batbat. El libro indica que es fría y astringente, y que resulta beneficiosa para las úlceras malignas {cite:canon-ibn-sina-print-v1 p.427}."
  fr: "Plante aquatique dont la fleur ressemble au nénuphar. Elle pousse submergée et ne dépasse guère la surface; sa vigueur est comparable à celle du batbat. Le livre indique qu'elle est froide et astringente et qu'elle convient aux ulcères malins {cite:canon-ibn-sina-print-v1 p.427}."
