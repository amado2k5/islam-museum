id: concept/intisab
class: concept
kind: legal
label: { ar: "الانتساب", en: "Intisab (ascription to parents, clients, crafts and places)" }
summary:
  ar: "الانتساب لغة الإضافة إلى الآباء أو القبائل أو البلاد أو الصنائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434} ويجب الانتساب إلى الأب عند الصدق، ويحرم الانتساب إلى غيره كذبا، والتبني محرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} وللعتيق انتساب بولاء العتاقة، وللأجنبي الانتساب بولاء الموالاة عند الحنفية، ولا بأس بالانتساب إلى الصنعة أو القبيلة أو البلد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} ويلحق ولد الملاعنة بأمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435}"
  en: "Intisab in the lexical sense is ascribing oneself to a father, a tribe, a town or a craft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434} Ascription to one's true father is obligatory when true, and to any other is forbidden; adoption is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} A freed slave is ascribed by clientage, and the Hanafis allow a contract of allegiance by which a convert takes a patron; ascription to a craft, a tribe or a town is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} The child of a lian is attached to his mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435}"
