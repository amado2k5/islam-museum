label: { ar: "الانتساب", en: "Intisab (ascription to parents, clients, crafts and places)", es: "Intisab (descripción de padres, clientes, artesanías y lugares)", fr: "Intisab (attribution aux parents, clients, métiers et lieux)", ur: "Intisab ⁦(والدین، گاہکوں، دستکاری اور جگہوں کے لیے تصنیف)⁩" }
summary:
  ar: "الانتساب لغة الإضافة إلى الآباء أو القبائل أو البلاد أو الصنائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434} ويجب الانتساب إلى الأب عند الصدق، ويحرم الانتساب إلى غيره كذبا، والتبني محرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} وللعتيق انتساب بولاء العتاقة، وللأجنبي الانتساب بولاء الموالاة عند الحنفية، ولا بأس بالانتساب إلى الصنعة أو القبيلة أو البلد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} ويلحق ولد الملاعنة بأمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435}"
  en: "Intisab in the lexical sense is ascribing oneself to a father, a tribe, a town or a craft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434} Ascription to one's true father is obligatory when true, and to any other is forbidden; adoption is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} A freed slave is ascribed by clientage, and the Hanafis allow a contract of allegiance by which a convert takes a patron; ascription to a craft, a tribe or a town is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} The child of a lian is attached to his mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435}"
  es: "Intisab en el sentido léxico es adscribirse a un padre, una tribu, un pueblo o un oficio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434} La adscripción al verdadero padre es obligatoria cuando es verdadera, y a cualquier otro está prohibida; la adopción está prohibida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} Un esclavo liberado es adscrito por clientela, y los Hanafis permiten un contrato de lealtad por el cual un converso toma un patrón; la adscripción a un oficio, una tribu o un pueblo está permitida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} El hijo de un lian está apegado a su madre. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435}"
  fr: "L'intisab, au sens lexical, signifie s'attribuer à un père, une tribu, une ville ou un métier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434} L'attribution à son père biologique est obligatoire lorsqu'elle est avérée, et à tout autre est interdite; l'adoption est interdite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} Un esclave affranchi est attribué par clientèle, et les Hanafites autorisent un contrat d'allégeance par lequel un converti prend un protecteur; l'attribution à un métier, une tribu ou une ville est permise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} L'enfant d'un lian est attaché à sa mère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435}"
  ur: "لغوی معنوں میں اتصاب اپنے آپ کو باپ، قبیلے، شہر یا ہنر سے منسوب کرنا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3434} سچے باپ کی طرف منسوب کرنا صحیح ہونے پر واجب ہے اور کسی دوسرے کے لیے حرام ہے۔ گود لینا حرام ہے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3434}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3435} ایک آزاد کردہ غلام کو مؤکل کے ذریعہ منسوب کیا جاتا ہے، اور احناف بیعت کے معاہدے کی اجازت دیتے ہیں جس کے ذریعے تبدیل کرنے والا سرپرست حاصل کرتا ہے۔ کسی ہنر، قبیلے یا قصبے سے منسوب کرنے کی اجازت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3435} لعان کا بچہ اپنی ماں سے لگا ہوا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3435}"
