id: concept/shahadat-allah-bi-tawhidihi
class: concept
kind: doctrine
label:
  ar: "شهادة الله بوحدانيته"
  en: "God's testimony to His own oneness"
  ur: "اللہ کی اپنی وحدانیت کی گواہی"
summary:
  ar: "يرى الشعراوي أن شهادة الله بأنه لا إله إلا هو سبقت شهادة كل خلق، وأن شهادة الذات للذات أقوى الشهادات، وأن علم الله يحيط بأدق الأشياء {cite:tafsir-sharawi-khawatir-scan p.233} {cite:tafsir-sharawi-khawatir-scan p.234}."
  en: "Sha'rawi holds that God's testimony that there is no god but Him came before the testimony of any creature, that the self's testimony to itself is the strongest, and that God's knowledge encompasses the finest things {cite:tafsir-sharawi-khawatir-scan p.233} {cite:tafsir-sharawi-khawatir-scan p.234}."
  ur: "شعراوی کے نزدیک اللہ کی یہ گواہی کہ اس کے سوا کوئی معبود نہیں، ہر مخلوق کی گواہی سے پہلے ہے، ذات کی اپنی گواہی سب سے مضبوط ہے، اور اللہ کا علم باریک ترین چیزوں کو بھی گھیرے ہوئے ہے {cite:tafsir-sharawi-khawatir-scan p.233} {cite:tafsir-sharawi-khawatir-scan p.234}۔"
