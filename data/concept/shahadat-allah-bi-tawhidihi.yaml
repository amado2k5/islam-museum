id: concept/shahadat-allah-bi-tawhidihi
class: concept
kind: doctrine
label:
  ar: "شهادة الله بوحدانيته"
  en: "God's testimony to His own oneness"
  ur: "اللہ کی اپنی وحدانیت کی گواہی"
  es: "El testimonio de Dios sobre su propia unidad."
  fr: "Le témoignage de Dieu quant à son unité"
  tr: "Tanrı'nın birliğine tanıklığı"
  id: "Kesaksian Allah akan kesatuan-Nya"
summary:
  ar: "يرى الشعراوي أن شهادة الله بأنه لا إله إلا هو سبقت شهادة كل خلق، وأن شهادة الذات للذات أقوى الشهادات، وأن علم الله يحيط بأدق الأشياء {cite:tafsir-sharawi-khawatir-scan p.233} {cite:tafsir-sharawi-khawatir-scan p.234}."
  en: "Sha'rawi holds that God's testimony that there is no god but Him came before the testimony of any creature, that the self's testimony to itself is the strongest, and that God's knowledge encompasses the finest things {cite:tafsir-sharawi-khawatir-scan p.233} {cite:tafsir-sharawi-khawatir-scan p.234}."
  ur: "شعراوی کے نزدیک اللہ کی یہ گواہی کہ اس کے سوا کوئی معبود نہیں، ہر مخلوق کی گواہی سے پہلے ہے، ذات کی اپنی گواہی سب سے مضبوط ہے، اور اللہ کا علم باریک ترین چیزوں کو بھی گھیرے ہوئے ہے {cite:tafsir-sharawi-khawatir-scan p.233} {cite:tafsir-sharawi-khawatir-scan p.234}۔"
  es: "Sha'rawi sostiene que el testimonio de Dios de que no hay más dios que Él precedió al testimonio de cualquier criatura, que el testimonio del yo a sí mismo es el más fuerte, y que el conocimiento de Dios abarca las cosas más sutiles {cite:tafsir-sharawi-khawatir-scan p.233} {cite:tafsir-sharawi-khawatir-scan p.234}."
  fr: "Sha'rawi soutient que le témoignage de Dieu selon lequel il n'y a de dieu que Lui est antérieur au témoignage de toute créature, que le témoignage du soi à lui-même est le plus fort et que la connaissance de Dieu englobe les choses les plus subtiles {cite:tafsir-sharawi-khawatir-scan p.233} {cite:tafsir-sharawi-khawatir-scan p.234}."
  tr: "Al-Shaarawi, Tanrı'nın kendisinden başka tanrı olmadığına dair tanıklığının tüm yaratılışın tanıklığından önce olduğuna, benliğin kendine tanıklığının en güçlü tanıklık olduğuna ve Tanrı'nın bilgisinin en kesin şeyleri kapsadığına inanır {cite:tafsir-sharawi-khawatir-scan s.233} {cite:tafsir-sharawi-khawatir-scan s.234}."
  id: "Al-Shaarawi percaya bahwa kesaksian Allah bahwa tidak ada Tuhan selain Dia mendahului kesaksian seluruh ciptaan, bahwa kesaksian diri kepada diri sendiri adalah kesaksian terkuat, dan bahwa pengetahuan Allah mencakup hal-hal paling tepat {cite:tafsir-sharawi-khawatir-scan hlm.233} {cite:tafsir-sharawi-khawatir-scan hlm.234}."
