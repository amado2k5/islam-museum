label: { ar: "المفاهيم الإدارية عند علي بن أبي طالب", en: "Ali ibn Abi Talib's administrative principles" }
summary:
  ar: "مجموعة المبادئ الإدارية التي يستخلصها الصلابي من عهد علي لمالك الأشتر ومن رسائله إلى عماله: التوازن بين الضبط والعنصر الإنساني، وتقديم الخبرة، والمراقبة الواعية، والتعيين بالاختبار لا بالمحاباة، والمشورة، والضمانات المعيشية للموظفين، ومكافحة الجمود، والعلاقة المباشرة بين الرئيس والمرؤوس، وتنظيم الخراج وبيت المال، وحماية التجار والطبقات الضعيفة، والثواب والعقاب. ويقدّم الكتاب هذه المفاهيم بوصفها قراءة له، لا نصاً إدارياً محدد الشكل {cite:sallabi-ali-vol1 p. 361}{cite:sallabi-ali-vol1 p. 372}{cite:sallabi-ali-vol1 p. 376}."
  en: "The principles the book draws from Ali's letter to Malik al-Ashtar and his letters to governors: balancing order against the human factor, valuing experience, watchful oversight, appointment by test and not favour, consultation, material security for officials, opposing rigidity, direct contact between superior and subordinate, the management of kharaj and the treasury, protection of traders and the weak, and reward and punishment. The book presents these as its own reading of the texts, not as a fixed administrative code {cite:sallabi-ali-vol1 p. 361}{cite:sallabi-ali-vol1 p. 372}{cite:sallabi-ali-vol1 p. 376}."
