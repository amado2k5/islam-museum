id: concept/ali-administrative-thought
class: concept
kind: doctrine
label: { ar: "المفاهيم الإدارية عند علي بن أبي طالب", en: "Ali ibn Abi Talib's administrative principles", es: "Principios administrativos de Ali ibn Abi Talib", fr: "Les principes administratifs d'Ali ibn Abi Talib" }
summary:
  ar: "مجموعة المبادئ الإدارية التي يستخلصها الصلابي من عهد علي لمالك الأشتر ومن رسائله إلى عماله: التوازن بين الضبط والعنصر الإنساني، وتقديم الخبرة، والمراقبة الواعية، والتعيين بالاختبار لا بالمحاباة، والمشورة، والضمانات المعيشية للموظفين، ومكافحة الجمود، والعلاقة المباشرة بين الرئيس والمرؤوس، وتنظيم الخراج وبيت المال، وحماية التجار والطبقات الضعيفة، والثواب والعقاب. ويقدّم الكتاب هذه المفاهيم بوصفها قراءة له، لا نصاً إدارياً محدد الشكل {cite:sallabi-ali-vol1 p. 361}{cite:sallabi-ali-vol1 p. 372}{cite:sallabi-ali-vol1 p. 376}."
  en: "The principles the book draws from Ali's letter to Malik al-Ashtar and his letters to governors: balancing order against the human factor, valuing experience, watchful oversight, appointment by test and not favour, consultation, material security for officials, opposing rigidity, direct contact between superior and subordinate, the management of kharaj and the treasury, protection of traders and the weak, and reward and punishment. The book presents these as its own reading of the texts, not as a fixed administrative code {cite:sallabi-ali-vol1 p. 361}{cite:sallabi-ali-vol1 p. 372}{cite:sallabi-ali-vol1 p. 376}."
  es: "Los principios que el libro extrae de la carta de Ali a Malik al-Ashtar y de sus cartas a los gobernadores son: equilibrar el orden con el factor humano, valorar la experiencia, la supervisión atenta, el nombramiento por mérito y no por favoritismo, la consulta, la seguridad material para los funcionarios, la oposición a la rigidez, el contacto directo entre superior y subordinado, la administración del kharaj y el tesoro, la protección de los comerciantes y los débiles, y la recompensa y el castigo. El libro presenta estos principios como su propia interpretación de los textos, no como un código administrativo fijo {cite:sallabi-ali-vol1 p. 361}{cite:sallabi-ali-vol1 p. 372}{cite:sallabi-ali-vol1 p. 376}."
  fr: "Les principes que cet ouvrage tire de la lettre d'Ali à Malik al-Ashtar et de ses lettres aux gouverneurs sont les suivants: équilibre entre l'ordre et le facteur humain, valorisation de l'expérience, surveillance attentive, nomination au mérite et non par favoritisme, consultation, sécurité matérielle des fonctionnaires, opposition à la rigidité, contact direct entre supérieurs et subordonnés, gestion du kharaj et du trésor, protection des commerçants et des plus vulnérables, et système de récompenses et de sanctions. L'ouvrage les présente comme une interprétation personnelle des textes, et non comme un code administratif figé {cite:sallabi-ali-vol1 p. 361}{cite:sallabi-ali-vol1 p. 372}{cite:sallabi-ali-vol1 p. 376}."
