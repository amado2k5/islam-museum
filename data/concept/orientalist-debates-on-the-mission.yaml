label: { ar: "خلاف المستشرقين في البعثة المحمدية", en: "European scholarly debates on the Prophet's mission" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «البعثة المحمدية» جدلاً بين الباحثين الأوروبيين حول شخصية النبي ومصادر دعوته. يذكر أن كتابات المستشرقين الفرنسيين والإنكليز والألمان والبلجيك والهولنديين تتناقض في الأمر، فيقرر كل باحث ما نقضه غيره، وأن بعضهم رأى أن النبي كان يختلف عن قومه في قوة التصور والتدين. ويذكر أن بعض الكتّاب المسيحيين جعلوا أسطورة بحيرا أصلاً لتعليم القرآن، ويعرض شهادات لكُتّاب أوروبيين منصفين مثل كارلايل، ويرى أن هذه الشهادات تكشف أن الصورة المتداولة في أوروبا كانت تُراجع. هذا عرض لجدل المؤلف مع كتّاب آخرين، ولا يُعدّ حكماً على شخص النبي."
  en: "In his chapter on the mission Arslan surveys disagreements among European scholars about the Prophet and the sources of his preaching. He notes that French, English, German, Belgian and Dutch orientalists contradicted one another, each rejecting what another had established. He cites a Dutch scholar who thought the Prophet had a stronger religious imagination than his people, and mentions the Bahira legend as a Christian explanation. He also quotes European writers such as Carlyle who defended the Prophet's sincerity. The entry describes Arslan's debate with other authors and is not a verdict on the Prophet."
