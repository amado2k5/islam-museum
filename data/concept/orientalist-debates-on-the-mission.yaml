summary:
  ar: "يعرض شكيب أرسلان في فصل «البعثة المحمدية» جدلاً بين الباحثين الأوروبيين حول شخصية النبي ومصادر دعوته. يذكر أن كتابات المستشرقين الفرنسيين والإنكليز والألمان والبلجيك والهولنديين تتناقض في الأمر، فيقرر كل باحث ما نقضه غيره، وأن بعضهم رأى أن النبي كان يختلف عن قومه في قوة التصور والتدين. ويذكر أن بعض الكتّاب المسيحيين جعلوا أسطورة بحيرا أصلاً لتعليم القرآن، ويعرض شهادات لكُتّاب أوروبيين منصفين مثل كارلايل، ويرى أن هذه الشهادات تكشف أن الصورة المتداولة في أوروبا كانت تُراجع. هذا عرض لجدل المؤلف مع كتّاب آخرين، ولا يُعدّ حكماً على شخص النبي."
  en: "In his chapter on the mission Arslan surveys disagreements among European scholars about the Prophet and the sources of his preaching. He notes that French, English, German, Belgian and Dutch orientalists contradicted one another, each rejecting what another had established. He cites a Dutch scholar who thought the Prophet had a stronger religious imagination than his people, and mentions the Bahira legend as a Christian explanation. He also quotes European writers such as Carlyle who defended the Prophet's sincerity. The entry describes Arslan's debate with other authors and is not a verdict on the Prophet."
  es: "En su capítulo sobre la misión, Arslan analiza las discrepancias entre los eruditos europeos acerca del Profeta y las fuentes de su predicación. Señala que orientalistas franceses, ingleses, alemanes, belgas y holandeses se contradecían entre sí, rechazando cada uno lo que otro había establecido. Cita a un erudito holandés que creía que el Profeta poseía una imaginación religiosa más fuerte que la de su pueblo, y menciona la leyenda de Bahira como una explicación cristiana. También cita a autores europeos como Carlyle, quien defendió la sinceridad del Profeta. Esta entrada describe el debate de Arslan con otros autores y no constituye un veredicto sobre el Profeta."
  fr: "Dans son chapitre consacré à la mission, Arslan examine les divergences entre les érudits européens concernant le Prophète et les sources de ses prédications. Il constate que les orientalistes français, anglais, allemands, belges et néerlandais se contredisaient, chacun rejetant les conclusions des autres. Il cite un érudit néerlandais qui pensait que le Prophète possédait une imagination religieuse plus développée que son peuple et mentionne la légende de Bahira comme explication chrétienne. Il cite également des auteurs européens tels que Carlyle, qui défendaient la sincérité du Prophète. Cet article décrit le débat d'Arslan avec d'autres auteurs et ne constitue pas un jugement sur le Prophète."
  ur: "ارسلان مشن پر اپنے باب میں رسول اللہ اور آپ کی تبلیغ کے ذرائع کے بارے میں یورپی علماء کے درمیان اختلاف کا جائزہ لیتے ہیں۔ وہ نوٹ کرتا ہے کہ فرانسیسی، انگریز، جرمن، بیلجیئم اور ڈچ مستشرقین ایک دوسرے سے متصادم تھے، ہر ایک نے دوسرے کی قائم کردہ باتوں کو مسترد کیا۔ انہوں نے ایک ڈچ عالم کا حوالہ دیا جس کا خیال تھا کہ پیغمبر اپنے لوگوں سے زیادہ مضبوط مذہبی تخیل رکھتے ہیں، اور بحیرہ کے افسانے کا ذکر ایک عیسائی وضاحت کے طور پر کرتے ہیں۔ وہ کارلائل جیسے یورپی مصنفین کا بھی حوالہ دیتے ہیں جنہوں نے پیغمبر کے اخلاص کا دفاع کیا۔ اندراج میں ارسلان کے دوسرے مصنفین کے ساتھ ہونے والی بحث کو بیان کیا گیا ہے اور یہ پیغمبر کے بارے میں کوئی فیصلہ نہیں ہے۔"
