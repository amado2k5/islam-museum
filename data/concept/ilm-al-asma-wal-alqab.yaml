id: concept/ilm-al-asma-wal-alqab
class: concept
kind: discipline
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "علم الأسماء والألقاب"
  en: "Onomastics: names and epithets"
  ur: "علم الاسماء: ناموں اور القاب کا علم"
  fr: "L'onomastique : noms et épithètes"
  es: "Onomástica: nombres y epítetos"
  tr: "Otonomastik ve Unvanlar"
  id: "Onomastik dan Judul"
summary:
  ar: "الأسماء العربية الكلاسيكية نظام يسجّل النسب والقرابة والقبيلة والبلد والمهنة والمذهب والصفة والمكانة، لا اسماً أول ولقب عائلة فقط؛ وتتألف من خمسة عناصر هي الاسم والكنية والنسب واللقب والنسبة، ولا يحمل كل شخص الخمسة، كما يعرضها ملف بحثي قُدّم إلى المتحف مع مثال ابن خلكان {cite:jstor-schimmel-islamic-names} {cite:tdv-islam-ansiklopedisi-home} {cite:wafayat-ayan}."
  en: "The classical Arabic naming system records ancestry, kinship, tribe, place, trade, school, quality and standing, not just a first name and a family name; it has five parts, the ism, kunya, nasab, laqab and nisba, and not every person bore all five, as a research file supplied to the museum sets it out with the example of Ibn Khallikan {cite:jstor-schimmel-islamic-names} {cite:tdv-islam-ansiklopedisi-home} {cite:wafayat-ayan}."
  ur: "کلاسیکی عربی نام رکھنے کا نظام نسب، قرابت، قبیلہ، مقام، پیشہ، مکتب، صفت اور مرتبہ درج کرتا ہے، محض پہلا نام اور خاندانی نام نہیں؛ اس کے پانچ اجزا ہیں، اسم، کنیت، نسب، لقب اور نسبت، اور ہر شخص پانچوں نہیں رکھتا تھا، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل ابن خلکان کی مثال کے ساتھ اسے بیان کرتی ہے {cite:jstor-schimmel-islamic-names} {cite:tdv-islam-ansiklopedisi-home} {cite:wafayat-ayan}۔"
  fr: "Le système classique de dénomination arabe consigne l'ascendance, la parenté, la tribu, le lieu, le métier, l'école, la qualité et le rang, et non un simple prénom et un nom de famille ; il comprend cinq éléments, l'ism, la kunya, le nasab, le laqab et la nisba, et toute personne ne portait pas les cinq, tel qu'un dossier de recherche remis au musée l'expose avec l'exemple d'Ibn Khallikan {cite:jstor-schimmel-islamic-names} {cite:tdv-islam-ansiklopedisi-home} {cite:wafayat-ayan}."
  es: "El sistema clásico de nombres árabes registra la ascendencia, el parentesco, la tribu, el lugar, el oficio, la escuela, la cualidad y el rango, y no solo un nombre de pila y un apellido; consta de cinco partes, el ism, la kunya, el nasab, el laqab y la nisba, y no toda persona llevaba las cinco, tal como lo expone un archivo de investigación entregado al museo con el ejemplo de Ibn Khallikan {cite:jstor-schimmel-islamic-names} {cite:tdv-islam-ansiklopedisi-home} {cite:wafayat-ayan}."
  tr: "Klasik Arap isimleri, soy, akrabalık, kabile, ülke, meslek, mezheb, sıfat ve statü kaydeden bir sistemdir; sadece bir isim veya aile soyadı değil; beş unsurdan oluşur: isim, soyadı, soy, soyadı ve soy. Herkes bu beşi taşımaz. Ayrıca müzeye sunulan bir araştırma dosyasında da sunulmaktadır {cite:jstor-schimmel-islamic-names} {cite:tdv-islam-ansiklopedisi-home} {cite:wafayat-ayan} örneği."
  id: "Nama Arab klasik adalah sistem yang mencatat garis keturunan, kekerabatan, suku, negara, profesi, sekte, kata sifat, dan status, bukan hanya nama depan atau nama keluarga; terdiri dari lima elemen: nama, nama keluarga, garis keturunan, nama keluarga, dan garis keturunan. Tidak semua orang membawa lima nama tersebut. Nama ini juga disajikan dalam berkas penelitian yang diserahkan ke museum dengan contoh nama Ibn Khallikan {cite:jstor-schimmel-islamic-names} {cite:tdv-islam-ansiklopedisi-home} {cite:wafayat-ayan}."
