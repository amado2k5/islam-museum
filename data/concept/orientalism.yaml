id: concept/orientalism
class: concept
kind: term
label:
  ar: الاستشراق
  en: Orientalism
summary:
  ar: "يعرّف زقزوق الاستشراق في معناه الخاص بأنه الدراسات الغربية المتعلقة بالشرق الإسلامي في لغاته وآدابه وتاريخه وعقائده وتشريعاته وحضارته، ويرى أن له عناصر إيجابية، كالعناية بالمخطوطات وفهرستها وتحقيق الكتب، وعناصر سلبية في دراسات القرآن والسنة والسيرة. يقرر أن الدافع الديني كان أول أسباب نشأته، ويذكر أن أهدافه تنوعت بين علمية وتجارية وسياسية، وأن فئات المستشرقين تتراوح بين الإنصاف والتحامل. هذا عرض لحكم المؤلف ويُنسب إليه، ولا يُعدّ حكماً من المتحف."
  en: "Zaqzuq defines orientalism in its narrow sense as Western study of the Islamic East in its languages, history, creeds, law and civilisation. He credits it with positive work on manuscripts and editions and criticises its studies of the Qur'an, Sunna and the Prophet's life. He holds the religious motive to be its first cause, names scientific, commercial and political aims, and sorts orientalists into categories. These are the author's judgements, attributed to him."
issue:
  ar: "ما الاستشراق، وما أهدافه وأثره في الصراع الحضاري، وكيف يواجهه المسلمون؟"
  en: "What is orientalism, what are its aims and effect on the civilisational conflict, and how should Muslims respond?"
wings: [ideas]
themes: [history-writing-and-social-thought, polemic-and-apologetic, islam-and-christianity]
periods: [period/modern-era]
sources: [source/al-istishraq-wal-khalfiyya-azhar]
perspectives:
  - tradition: sunni
    id: zaqzuq-critical-reading
    stance:
      ar: "الاستشراق فيه علم نافع وفيه طعن يجب أن يُرد بعلم مقابل، والموقف المطلوب من المسلمين مواجهة فكرية منهجية لا رفض مجمل"
      en: "Orientalism contains useful scholarship and also polemic that must be answered with scholarship, so the Muslim response should be a systematic intellectual answer, not blanket rejection"
    summary:
      ar: "يقول زقزوق إن في دراسات المستشرقين عناصر إيجابية وأخرى سلبية، وإن من حق المسلمين ومن واجبهم التنبيه إلى ما وقعوا فيه من أخطاء، ويدعو إلى حوار مع المعتدلين منهم {cite:al-istishraq-wal-khalfiyya-azhar p. 24} {cite:al-istishraq-wal-khalfiyya-azhar p. 25}. ويصف العلاقة بين الجانبين بأنها حوار طرشان في الأعم الأغلب {cite:al-istishraq-wal-khalfiyya-azhar p. 25}، ويدعو إلى موسوعة علمية للرد على المستشرقين {cite:al-istishraq-wal-khalfiyya-azhar p. 175}."
      en: "Zaqzuq says orientalist work has positive and negative sides, that Muslims have the right and duty to point out its errors, and he calls for dialogue with moderate orientalists. He describes the relation as mostly a dialogue of the deaf and proposes a scholarly encyclopaedia of answers."
    holders: [source/al-istishraq-wal-khalfiyya-azhar]
    evidence:
      - ref: source/al-istishraq-wal-khalfiyya-azhar
        note:
          ar: "ص 24 و25 و175 من PDF"
          en: "PDF pp. 24, 25 and 175"
    sources: [source/al-istishraq-wal-khalfiyya-azhar]
  - tradition: academic
    id: academic-references-as-cited
    stance:
      ar: "الاستشراق خلفية فكرية للصراع الحضاري، ويقرأ بوصفه مؤسسة ذات مصالح، والطابع العلمي فيه برز متأخراً"
      en: "Orientalism is an intellectual background to the civilisational conflict, read as an institution with interests, and its scholarly character appeared late"
    summary:
      ar: "يستشهد الكتاب بإدوارد سعيد الذي يصف الاستشراق بأنه شبكة من المصالح تحضر في كل مناسبة يُكتب فيها عن الشرق {cite:al-istishraq-wal-khalfiyya-azhar p. 22}، ويذكر رودي بارت أن الطابع العلمي برز بقوة من منتصف القرن التاسع عشر {cite:al-istishraq-wal-khalfiyya-azhar p. 30} {cite:al-istishraq-wal-khalfiyya-azhar p. 98}، وينقل عن مونتغمري واط قوله إن آثار الصورة المشوهة لا تزال قائمة {cite:al-istishraq-wal-khalfiyya-azhar p. 100}. هذه آراء منقولة في الكتاب، ولم تُراجع على أصولها بعد."
      en: "The book cites Edward Said, who calls orientalism a network of interests present whenever the East is written about, Rudi Paret on the late rise of scholarly motives, and Watt on lingering distortion. These are views the book reports and have not yet been checked against their originals."
    holders: [source/al-istishraq-wal-khalfiyya-azhar]
    evidence:
