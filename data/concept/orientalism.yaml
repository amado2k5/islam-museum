id: concept/orientalism
class: concept
kind: term
label:
  ar: الاستشراق
  en: Orientalism
  es: "orientalismo"
  fr: "orientalisme"
  ur: "مشرقیت"
  tr: "Oryantalizm"
  id: "orientalisme"
summary:
  ar: "يعرّف زقزوق الاستشراق في معناه الخاص بأنه الدراسات الغربية المتعلقة بالشرق الإسلامي في لغاته وآدابه وتاريخه وعقائده وتشريعاته وحضارته، ويرى أن له عناصر إيجابية، كالعناية بالمخطوطات وفهرستها وتحقيق الكتب، وعناصر سلبية في دراسات القرآن والسنة والسيرة. يقرر أن الدافع الديني كان أول أسباب نشأته، ويذكر أن أهدافه تنوعت بين علمية وتجارية وسياسية، وأن فئات المستشرقين تتراوح بين الإنصاف والتحامل. هذا عرض لحكم المؤلف ويُنسب إليه، ولا يُعدّ حكماً من المتحف."
  en: "Zaqzuq defines orientalism in its narrow sense as Western study of the Islamic East in its languages, history, creeds, law and civilisation. He credits it with positive work on manuscripts and editions and criticises its studies of the Qur'an, Sunna and the Prophet's life. He holds the religious motive to be its first cause, names scientific, commercial and political aims, and sorts orientalists into categories. These are the author's judgements, attributed to him."
  es: "Zaqzuq define el orientalismo en su sentido estricto como el estudio occidental del Oriente islámico en sus lenguas, historia, credos, leyes y civilización. Le reconoce su valiosa labor en el estudio de manuscritos y ediciones, y critica sus estudios sobre el Corán, la Sunna y la vida del Profeta. Considera que el motivo religioso es su principal causa, menciona objetivos científicos, comerciales y políticos, y clasifica a los orientalistas en diferentes categorías. Estas son las conclusiones del autor, que se le atribuyen."
  fr: "Zaqzuq définit l'orientalisme, au sens strict, comme l'étude occidentale de l'Orient islamique, notamment de ses langues, de son histoire, de ses croyances, de son droit et de sa civilisation. Il reconnaît à ce courant un apport positif en matière de manuscrits et d'éditions, mais critique ses études du Coran, de la Sunna et de la vie du Prophète. Il considère que le motif religieux en est la cause première, mentionne des objectifs scientifiques, commerciaux et politiques, et classe les orientalistes en différentes catégories. Tels sont les jugements de l'auteur, qui lui sont attribués."
  ur: "زقوق مشرقیت کو اس کی زبانوں، تاریخ، عقائد، قانون اور تہذیب میں اسلامی مشرق کے مغربی مطالعہ کے طور پر اس کے تنگ معنی میں بیان کرتا ہے۔ وہ اسے مخطوطات اور ایڈیشن پر مثبت کام کا سہرا دیتا ہے اور اس کے قرآن، سنت اور سیرت نبوی کے مطالعہ پر تنقید کرتا ہے۔ وہ مذہبی مقصد کو اس کی پہلی وجہ قرار دیتا ہے، سائنسی، تجارتی اور سیاسی مقاصد کا نام دیتا ہے، اور مستشرقین کو زمروں میں تقسیم کرتا ہے۔ یہ مصنف کے فیصلے ہیں، جو اس سے منسوب ہیں۔"
  tr: "Zaqzouq, Oryantalizmi özgün anlamıyla İslam Doğu'nun dilleri, edebiyatı, tarihi, inançları, yasaları ve uygarlığı ile ilgili Batı çalışmaları olarak tanımlar. El yazmalarına özen göstermek, kataloglamak ve kitapları doğrulamak gibi olumlu unsurlar ile Kur'an, Sünnet ve Peygamber çalışmalarında olumsuz unsurlar barındırdığına inanır. Dini motivasyonun ortaya çıkmasının başlıca nedeni olduğunu belirtir; hedeflerinin bilimsel, ticari ve politik arasında değiştiğini ve Oryantalistlerin kategorilerinin adaletten önyargıya kadar değiştiğini belirtir. Bu, yazarın kendisine atfedilen yargısının bir sunumudur ve müze yargısı olarak kabul edilmez."
  id: "Zaqzouq mendefinisikan Orientalisme dalam arti spesifiknya sebagai studi Barat yang berkaitan dengan Timur Islam dalam bahasa, sastra, sejarah, kepercayaan, legislasi, dan peradabannya. Ia percaya bahwa orientalisme memiliki unsur positif, seperti merawat manuskrip, mengkatalogkannya, dan memverifikasi buku, serta unsur negatif dalam studi Al-Qur'an, Sunnah, dan Nabi. Ia menyatakan bahwa motivasi agama adalah penyebab utama kemunculannya, dengan menyebutkan bahwa tujuannya bervariasi antara ilmiah, komersial, dan politik, dan kategori orientalis berkisar dari keadilan hingga bias. Ini adalah penyajian penilaian penulis yang dikaitkan kepadanya dan tidak dianggap sebagai penilaian museum."
issue:
  ar: "ما الاستشراق، وما أهدافه وأثره في الصراع الحضاري، وكيف يواجهه المسلمون؟"
  en: "What is orientalism, what are its aims and effect on the civilisational conflict, and how should Muslims respond?"
