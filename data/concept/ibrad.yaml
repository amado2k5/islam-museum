label: { ar: "الإبراد", en: "Delaying the noon prayer to the cool (ibrad)", es: "Retrasar la oración del mediodía hasta el fresco (ibrad)", fr: "Retarder la prière de midi jusqu'à ce que ce soit frais (ibrad)", ur: "ظہر کی نماز کو ٹھنڈے تک موخر کرنا ⁦(ابراد)⁩", tr: "Buzdolabı", id: "Kulkas" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبراد لغةً بأنه الدخول في البرد أو في آخر النهار، وعند الفقهاء بأنه تأخير صلاة الظهر إلى وقت البرد، ويطلق أيضاً على إمهال الذبيحة حتى تبرد قبل سلخها. وتذكر أنه رخصة مستحبة في صلاة الظهر في شدة الحر صيفاً في البلاد الحارة لمريد الجماعة في المسجد، باتفاق، استناداً إلى حديث أبي هريرة في شدة الحر من فيح جهنم، وأن استحبابه يختلف إذا تخلف أحد هذه القيود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1444}"
  en: "The Kuwaiti encyclopedia defines ibrad linguistically as entering the cool, or entering the late part of the day. For the jurists it is delaying the noon prayer until the time of cool, and the word is also used of leaving a slaughtered animal to cool before it is skinned. The Encyclopedia states that, in intense summer heat in hot countries, delaying the noon prayer is a permission that is recommended by agreement for one who attends the mosque in congregation, citing the hadith on the heat of Hell. If one of those conditions is missing, the recommendation is disputed and the Encyclopedia refers the detail to the entry on prayer times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1444}"
  es: "La enciclopedia kuwaití define ibrad lingüísticamente como entrar en la parte fresca o entrar en la última parte del día. Para los juristas, se trata de retrasar la oración del mediodía hasta la hora fresca, y la palabra también se usa para referirse a dejar enfriar un animal sacrificado antes de despellejarlo. La enciclopedia afirma que, en el intenso calor del verano en países cálidos, retrasar la oración del mediodía es una práctica permitida y recomendada por consenso para quienes asisten a la mezquita en congregación, citando el hadiz sobre el calor del infierno. Si falta alguna de estas condiciones, la recomendación se cuestiona y la enciclopedia remite el detalle a la entrada sobre los horarios de oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1444}"
  fr: "L'encyclopédie koweïtienne définit linguistiquement « ibrad » comme l'entrée dans la fraîcheur ou le passage à la fin de la journée. Pour les juristes, il s'agit de retarder la prière de midi jusqu'à ce que la fraîcheur revienne. Le terme est également employé pour désigner le fait de laisser refroidir un animal abattu avant de le dépecer. L'encyclopédie précise que, lors des fortes chaleurs estivales dans les pays chauds, le report de la prière de midi est une permission recommandée par consensus pour celui qui fréquente la mosquée en groupe, en se référant au hadith relatif à la chaleur de l'Enfer. Si l'une de ces conditions n'est pas remplie, la recommandation est contestée et l'encyclopédie renvoie à l'article sur les horaires de prière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1444}"
  ur: "کویتی انسائیکلوپیڈیا نے لسانی طور پر ابراد کی تعریف ٹھنڈے وقت میں داخل ہونے یا دن کے آخری حصے میں داخل ہونے کے طور پر کی ہے۔ فقہاء کے نزدیک ظہر کی نماز کو ٹھنڈا ہونے تک مؤخر کرنا ہے اور یہ لفظ ذبح شدہ جانور کی کھال اتارنے سے پہلے ٹھنڈا ہونے کے لیے بھی استعمال ہوتا ہے۔ انسائیکلوپیڈیا کہتا ہے کہ گرم ممالک میں گرمی کی شدید گرمی میں ظہر کی نماز میں تاخیر ایک ایسی اجازت ہے جو جہنم کی گرمی پر حدیث کا حوالہ دیتے ہوئے جماعت کے ساتھ مسجد میں حاضری دینے والے کے لیے معاہدے کے ذریعے تجویز کی گئی ہے۔ اگر ان شرائط میں سے کوئی ایک موجود نہیں ہے تو، سفارش متنازعہ ہے اور انسائیکلوپیڈیا نماز کے اوقات کے اندراج کی تفصیل کا حوالہ دیتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1444}"
  tr: "Kuveyt Fıkıh Ansiklopedisi, 'ibrad'ı dilbilimsel olarak soğuğa veya gün sonunda girmek olarak tanımlarken, hukukçular arasında öğle namazının soğuk zamanına kadar ertelenmesidir. Ayrıca, kurbanın derisi soyulmadan önce soğumasını sağlamak için kullanılır. Sıcak ülkelerde yoğun sıcakta öğle namazı etmenin, cehennemin kavurucu sıcağına dair Abu Huraira'nın hadisine dayanarak, cehennemin kavurucu sıcağına dair hadisine dayanarak oybirliğiyle yapılması tavsiye edilir ve bu kısıtlamalardan biri kaçırılırsa önerisi farklılık gösterir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1444}"
  id: "Ensiklopedia Yurisprudensi Kuwait mendefinisikan 'ibrad' secara linguistik sebagai memasuki cuaca dingin atau di akhir hari, sedangkan di kalangan ahli hukum adalah penundaan shalat siang hingga waktu dingin. Istilah ini juga digunakan untuk memungkinkan kurban mendinginkan sebelum dikuliti. Disebutkan bahwa merupakan konsesi yang direkomendasikan untuk melakukan shalat siang saat panas yang ekstrem di negara panas bagi mereka yang ingin berkumpul di masjid, berdasarkan hadits Abu Huraira tentang panas terik Neraka, dan rekomendasinya berbeda jika salah satu pembatasan ini terlewat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1444}"
