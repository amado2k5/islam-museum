label: { ar: "الإبراد", en: "Delaying the noon prayer to the cool (ibrad)" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبراد لغةً بأنه الدخول في البرد أو في آخر النهار، وعند الفقهاء بأنه تأخير صلاة الظهر إلى وقت البرد، ويطلق أيضاً على إمهال الذبيحة حتى تبرد قبل سلخها. وتذكر أنه رخصة مستحبة في صلاة الظهر في شدة الحر صيفاً في البلاد الحارة لمريد الجماعة في المسجد، باتفاق، استناداً إلى حديث أبي هريرة في شدة الحر من فيح جهنم، وأن استحبابه يختلف إذا تخلف أحد هذه القيود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1444}"
  en: "The Kuwaiti encyclopedia defines ibrad linguistically as entering the cool, or entering the late part of the day. For the jurists it is delaying the noon prayer until the time of cool, and the word is also used of leaving a slaughtered animal to cool before it is skinned. The Encyclopedia states that, in intense summer heat in hot countries, delaying the noon prayer is a permission that is recommended by agreement for one who attends the mosque in congregation, citing the hadith on the heat of Hell. If one of those conditions is missing, the recommendation is disputed and the Encyclopedia refers the detail to the entry on prayer times. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1444}"
