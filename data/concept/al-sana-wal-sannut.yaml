id: concept/al-sana-wal-sannut
class: concept
kind: scientific
label:
  ar: "السنا والسنوت"
  en: "Senna and sannut (al-sana wa-l-sannut)"
  fr: "Séné et sannut (al-sana wa-l-sannut)"
  ur: "سنا اور سنوت ⁦(السنا والسنوت)⁩"
  es: "Sen y sannut (al-sana wa-l-sannut)"
  tr: "Senna ve Snut"
  id: "Senna dan Snut"
summary:
  ar: "السنا نبت حجازي أفضله المكي، وهو دواء مسهل عند ابن قيم الجوزية {cite:zad-al-maad p.616}. وروى الترمذي وابن ماجه عن أسماء بنت عميس أن النبي سألها: بماذا كنت تستمشين؟ فقالت: بالشبرم، فقال: «حار جار»، ثم استمشت بالسنا فقال: «لو أن شيئاً كان فيه شفاء من الموت لكان في السنا» {cite:jami-al-tirmidhi 2081} {cite:sunan-ibn-majah 3461}. وروى ابن ماجه «عليكم بالسنا والسنوت، فإن فيهما شفاء من كل داء إلا السام» {cite:sunan-ibn-majah 3457}. وفي السنوت أقوال كثيرة ذكر ابن القيم منها ثمانية، منها العسل، والعسل الذي في زقاق السمن، والشبت، والتمر {cite:zad-al-maad p.616}."
  en: "Senna (sana) is a Hijazi plant, the best being from Mecca, and a laxative drug according to Ibn Qayyim al-Jawziyya {cite:zad-al-maad p.616}. Al-Tirmidhi and Ibn Majah report from Asma' bint Umays that the Prophet asked her what she used for a purge; she said shubrum and he said 'hot and harsh', then she used senna and he said 'if anything held a cure for death, it would be senna' {cite:jami-al-tirmidhi 2081} {cite:sunan-ibn-majah 3461}. Ibn Majah reports 'hold to senna and sannut, for in them is a cure for every disease except death' {cite:sunan-ibn-majah 3457}. Of sannut Ibn al-Qayyim lists eight meanings, among them honey, the honey found in ghee skins, dill and dates {cite:zad-al-maad p.616}."
  fr: "Le séné (sana) est une plante du Hijaz, la meilleure étant celle de La Mecque, et un remède laxatif selon Ibn Qayyim al-Jawziyya {cite:zad-al-maad p.616}. Al-Tirmidhi et Ibn Majah rapportent d’Asma' bint Umays que le Prophète lui demanda ce qu’elle employait comme purgatif ; elle répondit le shubrum, et il dit « chaud et violent », puis elle employa le séné et il dit « si une chose contenait un remède contre la mort, ce serait le séné » {cite:jami-al-tirmidhi 2081} {cite:sunan-ibn-majah 3461}. Ibn Majah rapporte « tenez-vous au séné et au sannut, car en eux se trouve un remède à toute maladie sauf la mort » {cite:sunan-ibn-majah 3457}. Pour le sannut, Ibn al-Qayyim énumère huit sens, parmi lesquels le miel, le miel qui se trouve dans les outres de beurre clarifié, l’aneth et les dattes {cite:zad-al-maad p.616}."
  ur: "سنا ایک حجازی پودا ہے جس کی بہترین قسم مکی ہے، اور ابن قیم الجوزیہ کے نزدیک یہ مسہل دوا ہے {cite:zad-al-maad p.616}۔ ترمذی اور ابن ماجہ میں اسماء بنت عمیس سے ہے کہ نبی نے ان سے پوچھا کہ تم دست آور کے لیے کیا استعمال کرتی تھیں؟ انھوں نے کہا شبرم، تو فرمایا: «گرم اور تیز»، پھر انھوں نے سنا استعمال کیا تو فرمایا: «اگر کسی چیز میں موت سے شفا ہوتی تو سنا میں ہوتی» {cite:jami-al-tirmidhi 2081} {cite:sunan-ibn-majah 3461}۔ ابن ماجہ میں ہے: «سنا اور سنوت کو لازم پکڑو، ان میں موت کے سوا ہر بیماری کی شفا ہے» {cite:sunan-ibn-majah 3457}۔ سنوت کے بارے میں ابن القیم آٹھ اقوال گنواتے ہیں، جن میں شہد، گھی کی مشکوں کا شہد، سوا اور کھجور شامل ہیں {cite:zad-al-maad p.616}۔"
  es: "La senna (sana) es una planta de Hiyaz, la mejor es la de La Meca, y un laxante según Ibn Qayyim al-Jawziyya {cite:zad-al-maad p.616}. Al-Tirmidhi e Ibn Majah informan de Asma' bint Umays que el Profeta le preguntó qué usaba para purgarse; ella dijo shubrum y él dijo 'caliente y fuerte', luego ella usó senna y él dijo 'si algo tuviera una cura para la muerte, sería la senna' {cite:jami-al-tirmidhi 2081} {cite:sunan-ibn-majah 3461}. Ibn Majah informa 'recurre a la senna y al sannut, pues en ellos hay una cura para todas las enfermedades excepto la muerte' {cite:sunan-ibn-majah 3457}. De sannut, Ibn al-Qayyim enumera ocho significados, entre ellos miel, la miel que se encuentra en las cáscaras de ghee, eneldo y dátiles {cite:zad-al-maad p.616}."
  tr: "Senna, tercihen Mekke bitkisi olan bir Hicazi bitkisidir ve İbn Qayyim al-Jawziyyah'a göre müshil bir ilaçtır {cite:zad-al-maad s.616}. El-Tirmidi ve İbn Majah, Esma bint Umais'ten Peygamber'in ona şöyle sorduğunu anlattılar: \"Dişlerini ne kullanıyordun?\" O şöyle dedi: Bir şerbamla, \"Sıcak ve sıcak,\" sonra bir sna çizdi ve dedi ki: \"Ölümü iyileştiren bir şey olsaydı, o sünnette olurdu\" {atıf:cemi-al-tirmidhi 2081} {atıf:sunan-ibn-majah 3461}. İbn Majah şöyle anlattı: \"Senna ve el-ma'ad kullanmalısın, çünkü onlarda zehirli hastalıklar hariç her hastalık için bir çare vardır.\" {atıf:sunan-ibn-majah 3457}. Sunut'ta, İbn al-Qayyim tarafından bahsedilen birçok görüş vardır; bunlar arasında bal, kare yağlı geçidinde bulunan bal, dereotu ve hurma gibi sekiz görüş vardır {cite:zad-al-maad s.616}."
  id: "Senna adalah tanaman Hijazi yang lebih baik dari Mekah dan, menurut Ibn Qayyim al-Jawziyyah, adalah obat pencahar {cite:zad-al-maad hlm.616}. Al-Tirmidhi dan Ibn Majah bercerita dari Asma bint Umais bahwa Nabi bertanya kepadanya: \"Untuk apa kamu menggunakan gigimu?\" Dia berkata: Dengan sherbet milikku, \"Panas dan panas,\" lalu dia menggambar sna dan berkata: \"Jika ada sesuatu yang menyembuhkan kematian, itu ada dalam Sunnah\" {atribusi: cemi-al-tirmidhi 2081} {atribusi: sunan-ibn-majah 3461}. Ibn Majah menjelaskan: \"Kamu harus menggunakan senna dan al-ma'ad, karena mereka memiliki obat untuk setiap penyakit kecuali yang beracun.\" {Sitasi: Sunan-ibn-Majah 3457}. Di Sunut, terdapat banyak pemandangan yang disebutkan oleh Ibn al-Qayyim; di antaranya terdapat delapan pemandangan seperti madu, madu yang ditemukan di lorong minyak persegi, dill, dan pohon kurma {cite: Zad-al-maad hlm.616}."
