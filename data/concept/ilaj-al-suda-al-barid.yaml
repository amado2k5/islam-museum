  en: "Treatment of cold headache"
  ur: "ٹھنڈے صداع کا علاج"
summary:
  ar: "يبيّن ابن سينا أن علاج الصداع البارد بغير مادة أو بمادة بلغمية أو سوداوية هو التسخين بعد التنقية، وتدبير المصرود، وما يخص كل خلط {cite:canon-ibn-sina-print-v2 pp.57-58}"
  en: "Ibn Sina shows that the treatment of cold headache, without matter or with a phlegmatic or black-bile matter, is warming after cleansing, the management of the chilled, and what is particular to each humour {cite:canon-ibn-sina-print-v2 pp.57-58}"
  ur: "ابن سینا بتاتا ہے کہ ٹھنڈے صداع کا علاج، بغیر مادے کے یا بلغمی یا سوداوی مادے کے ساتھ، صفائی کے بعد گرم کرنا ہے، نیز ٹھنڈے پڑ جانے والے کی تدبیر اور ہر خلط کی خصوصی بات {cite:canon-ibn-sina-print-v2 pp.57-58}۔"
