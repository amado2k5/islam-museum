id: concept/muqaddimat-qaranitus-wa-alamat-mawadi-waramih
class: concept
kind: scientific
label:
  ar: "مقدمات قرانيطس وعلامات مواضع ورمه"
  en: "The forerunners of qaranitus and the signs of the places of its swelling"
  ur: "قرانیطس کے پیش رو اور اس کی سوجن کے مقامات کی علامات"
summary:
  ar: "يذكر ابن سينا ما يتقدّم قرانيطس من علامات، وما يظهر عند قرب الورم من الدماغ، وعلامات وقوعه في المقدّم أو الوسط أو الخلف أو في الجهات كلها {cite:canon-ibn-sina-print-v2 p.78}"
  en: "Ibn Sina names what comes before qaranitus, what appears as the swelling of the brain draws near, and the signs of its falling in the front, the middle, the back or all sides {cite:canon-ibn-sina-print-v2 p.78}"
  ur: "ابن سینا بتاتا ہے کہ قرانیطس سے پہلے کیا علامات آتی ہیں، دماغ کی سوجن کے قریب آنے پر کیا ظاہر ہوتا ہے، اور اس کے اگلے، درمیانی، پچھلے یا تمام اطراف میں پڑنے کی علامات {cite:canon-ibn-sina-print-v2 p.78}۔"
