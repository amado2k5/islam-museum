id: concept/inqida
class: concept
kind: legal
label: { ar: "الانقضاء", en: "Inqida (the ending of a thing by reaching its purpose, its term or a cause, and its rulings)", es: "Inqida (el fin de algo al alcanzar su propósito, su término o una causa, y sus dictámenes)", fr: "Inqida (la fin d'une chose par l'atteinte de son but, de son terme ou de sa cause, et de ses décisions)", ur: "عقیدہ ⁦(کسی چیز کا اس کے مقصد، اس کی مدت یا وجہ اور اس کے احکام تک پہنچ کر خاتمہ)⁩" }
summary:
  ar: "الانقضاء مطاوع القضاء، ومعناه لغة الذهاب والفناء، ويأتي بمعنى تمام الشيء والخروج منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3541} ينقضي العقد بتحقق غايته أو غرضه، كالإجارة المقيدة بمدة، والوكالة بالشراء، والرهن بسداد الدين، والكفالة بالأداء أو الإبراء، وينقضي بالإقالة أو بالفسخ للفساد، وباستحالة التنفيذ كهلاك المبيع القيمي قبل التسليم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3542}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543} وتنقضي العدة بوضع الحمل أو بانتهاء الأشهر أو الأقراء، وتنقضي الحضانة ببلوغ الولد على التفصيل بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} وينقضي الإيلاء بالفيء أو بالتكفير أو بمضي أربعة أشهر، وينقضي المسح على الخفين بالغسل الواجب أو بنزعه أو بمضي المدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} وإذا اختلف الطرفان في الانقضاء فالقول لمنكر الانقضاء في الغالب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}"
  en: "Inqida is the reflexive of qada, meaning passing away and ceasing, and in another use completion and exit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3541} A contract ends when its aim or purpose is achieved, as with a hire for a fixed term, an agency to buy, a pledge when the debt is paid, or a surety when he pays or is released; it also ends by rescission, by dissolution for invalidity, or by impossibility such as the loss of a fungible object before delivery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3542}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543} A waiting period ends by childbirth, by the lapse of months or by the cycles, and custody ends at the child's puberty, with the schools differing in the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} A vow of abstinence (ila') ends by return, expiation or the passing of four months, and the wiping over socks ends with the obligatory washing, removal or the lapse of the period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} Where the parties dispute whether the ending has occurred, the word lies with the one who denies it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}"
  es: "Inqida es el reflexivo de qada, que significa pasar y cesar, y en otro uso finalización y salida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3541} Un contrato termina cuando se logra su objetivo o propósito, como con un alquiler por un plazo fijo, una agencia de compra, una prenda cuando se paga la deuda, o una fianza cuando paga o es liberado; también termina por rescisión, por disolución por invalidez, o por imposibilidad como la pérdida de un objeto fungible antes de la entrega. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3542}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543} Un período de espera termina con el nacimiento, por el transcurso de los meses o por los ciclos, y la custodia termina en la pubertad del niño, con diferencias en los detalles entre las escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} Un voto de abstinencia (ila') termina con el retorno, la expiación o el transcurso de cuatro meses, y la limpieza de los calcetines termina con el lavado obligatorio, la eliminación o el transcurso del período. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} Cuando las partes disputan si el fin se ha producido, la palabra recae sobre quien lo niega. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}"
  fr: "Inqida est le réflexif de qada, signifiant passage et cessation, et dans un autre sens, achèvement et sortie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3541} Un contrat prend fin lorsque son but ou son objectif est atteint, comme dans le cas d'un bail à durée déterminée, d'un mandat d'achat, d'un gage lorsque la dette est payée, ou d'une caution lorsqu'elle paie ou est libérée; il prend également fin par rescision, par dissolution pour cause de nullité, ou par impossibilité telle que la perte d'un objet fongible avant la livraison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3542}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543} Un délai d'attente prend fin à la naissance, à l'écoulement de plusieurs mois ou à la fin des cycles, et la garde prend fin à la puberté de l'enfant, les écoles divergeant sur les modalités. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} Un vœu d'abstinence (ila') prend fin par le retour à l'abstinence, l'expiation ou l'écoulement de quatre mois, et l'essuyage des chaussettes prend fin par le lavage obligatoire, le retrait des chaussettes ou la fin des règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} En cas de désaccord entre les parties quant à la survenance de la fin du vœu, la décision appartient à celui qui la nie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}"
  ur: "عقیدہ قضا کا اضطراری ہے، جس کا مطلب ہے مر جانا اور ختم ہو جانا، اور دوسرے استعمال میں تکمیل اور خارج ہونا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3541} ایک معاہدہ اس وقت ختم ہو جاتا ہے جب اس کا مقصد یا مقصد حاصل ہو جاتا ہے، جیسا کہ ایک مقررہ مدت کے لیے کرایہ، خریدنے کے لیے ایک ایجنسی، قرض کی ادائیگی کے وقت، یا ضمانت کے ساتھ جب وہ ادا کرتا ہے یا رہا ہو جاتا ہے۔ اس کا خاتمہ منسوخی کے ذریعے، باطل ہونے کے لیے تحلیل کے ذریعے، یا ترسیل سے پہلے کسی فنگیبل چیز کے ضائع ہونے جیسی ناممکنات سے بھی ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3542}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.3543} عدت ولادت، مہینوں کے گزر جانے یا چکروں سے ختم ہو جاتی ہے، اور اس کی تحویل میں بچے کے سکولوں میں پڑھائی کے ساتھ ختم ہو جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} پرہیز کی نذر واپسی، کفارہ یا چار مہینے گزر جانے سے ختم ہو جاتی ہے، اور جرابوں پر مسح واجب یا لحاف کے ساتھ ختم ہو جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3544} جہاں فریقین میں اختلاف ہو کہ آیا خاتمہ واقع ہوا ہے، وہاں لفظ انکار کرنے والے کے ساتھ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3545}"
