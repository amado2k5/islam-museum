label: { ar: "الانقضاء", en: "Inqida (the ending of a thing by reaching its purpose, its term or a cause, and its rulings)" }
summary:
  ar: "الانقضاء مطاوع القضاء، ومعناه لغة الذهاب والفناء، ويأتي بمعنى تمام الشيء والخروج منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3541} ينقضي العقد بتحقق غايته أو غرضه، كالإجارة المقيدة بمدة، والوكالة بالشراء، والرهن بسداد الدين، والكفالة بالأداء أو الإبراء، وينقضي بالإقالة أو بالفسخ للفساد، وباستحالة التنفيذ كهلاك المبيع القيمي قبل التسليم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3542}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543} وتنقضي العدة بوضع الحمل أو بانتهاء الأشهر أو الأقراء، وتنقضي الحضانة ببلوغ الولد على التفصيل بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} وينقضي الإيلاء بالفيء أو بالتكفير أو بمضي أربعة أشهر، وينقضي المسح على الخفين بالغسل الواجب أو بنزعه أو بمضي المدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} وإذا اختلف الطرفان في الانقضاء فالقول لمنكر الانقضاء في الغالب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}"
  en: "Inqida is the reflexive of qada, meaning passing away and ceasing, and in another use completion and exit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3541} A contract ends when its aim or purpose is achieved, as with a hire for a fixed term, an agency to buy, a pledge when the debt is paid, or a surety when he pays or is released; it also ends by rescission, by dissolution for invalidity, or by impossibility such as the loss of a fungible object before delivery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3542}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543} A waiting period ends by childbirth, by the lapse of months or by the cycles, and custody ends at the child's puberty, with the schools differing in the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} A vow of abstinence (ila') ends by return, expiation or the passing of four months, and the wiping over socks ends with the obligatory washing, removal or the lapse of the period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3544} Where the parties dispute whether the ending has occurred, the word lies with the one who denies it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3545}"
