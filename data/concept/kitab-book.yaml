  en: "Book, letter and writing (kitab)"
  ur: "کتاب (تحریر و کتب)"
summary:
  ar: "الكتاب في الاصطلاح الفقهي يتناول ثلاثة معان: الرسالة المكتوبة، والوثيقة والعهد، وكتب العلم. وللرسالة أحكام منها طلاق الزوج بالكتابة واختلاف المذاهب في وقوعه، وابتداء الكتاب بالبسملة، ورد جوابه. وللوثيقة الأمر بتوثيق الدين في القرآن. وللكتب أحكام كثيرة: حكم مس غير المتطهر لها، والاستنجاء بها، وتوسدها، وبيعها ورهنها وإعارتها وإجارتها ووقفها وسرقتها وإتلافها، واختلف الفقهاء في النظر في كتب أهل الكتاب وفي بيع المصحف وشرائه، وأجازه الحنفية والمالكية والشافعية، ومنعه الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13210}"
  en: "In jurisprudence kitab has three senses: a written letter, a document or covenant, and a book of learning. The letter carries rules, among them divorce by writing, on which the schools differ as to when it takes effect; the opening with the basmala; and the duty or courtesy of answering. The document sense rests on the Qur'an's command to write down debts. Books carry many rules: touching them without purity, using them for istinja, resting on them, selling, pawning, lending, hiring, endowing, stealing and destroying them. The schools differ on reading the books of the People of the Book and on selling a copy of the Qur'an, which the Hanafis, Malikis and Shafi'is allow and the Hanbalis forbid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13210}"
  ur: "فقہی اصطلاح میں کتاب کے تین معنی ہیں: لکھا ہوا خط، دستاویز یا عہد، اور علم کی کتابیں۔ خط کے احکام میں تحریر سے طلاق ہے، جس میں مذاہب کا اختلاف ہے کہ وہ کب واقع ہوتی ہے، اور خط کا آغاز بسم اللہ سے کرنا اور جواب دینا۔ دستاویز کا مفہوم قرآن کے قرض لکھنے کے حکم سے ماخوذ ہے۔ کتابوں کے احکام میں بغیر طہارت چھونا، استنجا میں استعمال، ان پر سر رکھنا، بیچنا، رہن رکھنا، عاریت پر دینا، اجارہ، وقف، چوری اور تلف کرنا شامل ہیں۔ اہلِ کتاب کی کتابوں کے مطالعے اور قرآن بیچنے کے بارے میں حنفیہ، مالکیہ اور شافعیہ جواز یا گنجائش کے قائل ہیں، جبکہ حنابلہ منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13190} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13207} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13210}"
