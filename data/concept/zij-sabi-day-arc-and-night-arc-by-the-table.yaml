label: { ar: "قوس النهار وقوس الليل بالجدول في الزيج الصابي", en: "The day arc and the night arc by the table", ur: "جدول سے قوس النہار اور قوس اللیل", es: "El arco del día y el arco de la noche junto a la mesa", fr: "L'arc du jour et l'arc de la nuit près de la table" }
summary:
  ar: "قوس النهار عند البتاني مقدار ما يطلع من معدل النهار من وقت طلوع الشمس إلى غروبها، وقوس الليل ما يطلع من غروبها إلى طلوعها من الغد. ويؤخذ الأول بإنقاص مطالع درجة الشمس في الإقليم من مطالع الدرجة المقابلة لها فيه، فيكون الباقي قوس النهار، وإن كانت مطالع الشمس أكثر زيد على المقابلة دور كامل قبل الإنقاص. وينقص قوس النهار من دورة فيبقى قوس الليل. {cite:zij-sabi-nallino-byblion pp.45-46}."
  en: "For al-Battani the day arc is the amount of the day's equator that rises from sunrise to sunset, and the night arc is what rises from sunset to the next sunrise. The first is found by subtracting the risings of the Sun's degree in the clime from the risings of the degree opposite it there, the remainder being the day arc; if the Sun's risings are greater, a full circle is added to the opposite degree's risings before subtracting. Subtracting the day arc from a revolution leaves the night arc. {cite:zij-sabi-nallino-byblion pp.45-46}."
  ur: "البتانی کے نزدیک قوس النہار دن کے معدل کی وہ مقدار ہے جو سورج کے طلوع سے غروب تک طلوع ہوتی ہے، اور قوس اللیل وہ ہے جو غروب سے اگلے طلوع تک طلوع ہوتی ہے۔ پہلی کو اقلیم میں سورج کے درجے کے مطالع کو اسی اقلیم میں اس کے مقابل درجے کے مطالع سے گھٹا کر نکالتے ہیں اور باقی قوس النہار ہے؛ اگر سورج کے مطالع زیادہ ہوں تو گھٹانے سے پہلے مقابل درجے کے مطالع پر ایک پورا دور بڑھایا جاتا ہے۔ قوس النہار کو دور سے گھٹانے پر قوس اللیل بچتی ہے۔ {cite:zij-sabi-nallino-byblion pp.45-46}۔"
  es: "Para al-Battani, el arco diurno es la porción del ecuador que se eleva desde el amanecer hasta el atardecer, y el arco nocturno es la porción que se eleva desde el atardecer hasta el siguiente amanecer. El primero se obtiene restando las elevaciones del grado solar en el clima a las elevaciones del grado opuesto en ese mismo clima; el resto es el arco diurno. Si las elevaciones del Sol son mayores, se añade un círculo completo a las elevaciones del grado opuesto antes de restar. Restando el arco diurno de una revolución se obtiene el arco nocturno. {cite:zij-sabi-nallino-byblion pp.45-46}."
  fr: "Pour al-Battani, l'arc diurne correspond à la portion de l'équateur qui s'élève entre le lever et le coucher du soleil, tandis que l'arc nocturne correspond à la portion qui s'élève entre le coucher et le lever du soleil suivant. Le premier se calcule en soustrayant les levers du Soleil du degré considéré dans le climat de ceux du degré opposé; le reste représente l'arc diurne. Si les levers du Soleil du degré considéré sont plus importants, on ajoute un tour complet aux levers du degré opposé avant de soustraire. La soustraction de l'arc diurne à une révolution donne l'arc nocturne. {cite:zij-sabi-nallino-byblion pp.45-46}."
