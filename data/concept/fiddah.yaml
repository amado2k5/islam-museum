  en: "Fiddah (silver)"
  ur: "فضہ"
  es: "Fiddah (plata)"
  fr: "Fiddah (argent)"
summary:
  ar: "الفضة في الكتاب معدن مشهور مبرد مجفف، خبثها قابض جدا فيه جذب وتجفيف، وسحالتها تنفع مع الأخلاط من الرطوبات اللزجة والخفقان والبخر، وتنفع للجرب والحكة ويزيد الاكتحال بميل منها في البصر {cite:canon-ibn-sina-print-v1 p.624}"
  en: "Fiddah is in the book silver, a well-known metal, cooling and drying; its dross is very astringent with drawing and drying, and its filings, mixed with other drugs, benefit viscous moistures, palpitation and foul breath, are very good for scab and itch, and a silver kohl stick used for the eye increases sight {cite:canon-ibn-sina-print-v1 p.624}"
  ur: "فضہ کتاب میں چاندی ہے، ایک مشہور دھات، ٹھنڈک اور خشکی دینے والی؛ اس کا میل بہت قابض ہے جس میں کھینچنے اور خشک کرنے کی قوت ہے، اور اس کا برادہ دوسری دواؤں کے ساتھ لیس دار رطوبتوں، دھڑکن اور منہ کی بدبو میں نافع ہے، خارش اور کھجلی کے لیے بہت اچھی ہے، اور چاندی کی سلائی سے سرمہ لگانا بینائی بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.624}۔"
  es: "Fiddah es en el libro plata, un metal bien conocido, refrescante y secante; su escoria es muy astringente con efecto de arrastre y secado, y sus limaduras, mezcladas con otros medicamentos, benefician las humedades viscosas, las palpitaciones y el mal aliento, son muy buenas para las costras y el picor, y una barra de kohl de plata usada para el ojo aumenta la vista {cite:canon-ibn-sina-print-v1 p.624}"
  fr: "Le fiddah est mentionné dans le livre: « argent, métal bien connu, rafraîchissant et asséchant; ses scories sont très astringentes et asséchantes, et ses limaille, mélangées à d’autres médicaments, sont bénéfiques contre les écoulements visqueux, les palpitations et la mauvaise haleine, sont très bonnes pour les croûtes et les démangeaisons, et un bâtonnet de khôl en argent utilisé pour les yeux améliore la vue » {cite:canon-ibn-sina-print-v1 p.624}"
