summary:
  ar: "في الفصل السابع عشر يقسم ابن سينا الأورام إلى ما يحدث الحمى فيغير نبض البدن كله وما لا يحدثها فيغير نبض العضو، ثم يفصل تغيير الورم للنبض بنوعه ووقته ومقداره {cite:canon-ibn-sina-print-v1 pp.181-182}."
  en: "In the seventeenth chapter Ibn Sina divides swellings into those that bring on fever and change the pulse of the whole body and those that do not and change the pulse of the organ, then sets out how a swelling changes the pulse by its kind, its time and its size {cite:canon-ibn-sina-print-v1 pp.181-182}."
