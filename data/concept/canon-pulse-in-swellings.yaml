id: concept/canon-pulse-in-swellings
class: concept
kind: scientific
label:
  ar: "نبض الأورام عند ابن سينا"
  en: "The pulse in swellings in the Canon"
  fr: "Pouls des gonflements dans le Canon"
  ur: "سوجنوں کی نبض قانون میں"
  es: "El pulso en hinchazones en el Canon"
summary:
  ar: "في الفصل السابع عشر يقسم ابن سينا الأورام إلى ما يحدث الحمى فيغير نبض البدن كله وما لا يحدثها فيغير نبض العضو، ثم يفصل تغيير الورم للنبض بنوعه ووقته ومقداره {cite:canon-ibn-sina-print-v1 pp.181-182}."
  en: "In the seventeenth chapter Ibn Sina divides swellings into those that bring on fever and change the pulse of the whole body and those that do not and change the pulse of the organ, then sets out how a swelling changes the pulse by its kind, its time and its size {cite:canon-ibn-sina-print-v1 pp.181-182}."
  fr: "Au chapitre 17, Ibn Sina distingue gonflements fébriles modifiant le pouls corporel et non fébriles modifiant celui de l’organe, puis effets du type, du stade et du volume {cite:canon-ibn-sina-print-v1 pp.181-182}."
  es: "En el capítulo diecisiete, Ibn Sina divide las hinchazones en aquellas que provocan fiebre y alteran el pulso de todo el cuerpo y aquellas que no lo hacen y alteran el pulso del órgano, y luego expone cómo una hinchazón altera el pulso según su tipo, su tiempo y su tamaño {cite:canon-ibn-sina-print-v1 pp.181-182}."
