  en: "Ajr al-mithl (customary wage)"
summary:
  ar: "أجر المثل أجر أمثال العامل في السوق، يحدده ولي الأمر بمشورة أهل الخبرة بحسب متوسط أجور السوق {cite:usul-iqtisad-islami-0660 p. 256}. وهو البديل حين يفسد عقد الإجارة أو المضاربة بجهالة الأجر، أو حين يُجبر ولي الأمر أهل الصنائع، أو حين يقع الغبن الفاحش في الأجر {cite:usul-iqtisad-islami-0660 p. 255}. وليس الأصل في كل عقد، فالأصل الأجر المسمى بالتراضي {cite:usul-iqtisad-islami-0660 p. 256}."
