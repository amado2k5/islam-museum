summary:
  ar: "أجر المثل أجر أمثال العامل في السوق، يحدده ولي الأمر بمشورة أهل الخبرة بحسب متوسط أجور السوق {cite:usul-iqtisad-islami-0660 p. 256}. وهو البديل حين يفسد عقد الإجارة أو المضاربة بجهالة الأجر، أو حين يُجبر ولي الأمر أهل الصنائع، أو حين يقع الغبن الفاحش في الأجر {cite:usul-iqtisad-islami-0660 p. 255}. وليس الأصل في كل عقد، فالأصل الأجر المسمى بالتراضي {cite:usul-iqtisad-islami-0660 p. 256}."
  tr: "Eşdeğer ücret, piyasa işçisinin ücretidir ve vasi tarafından uzmanlarla istişare edilerek ortalama piyasa ücretlerine göre belirlenir {cite:usul-iqtisad-islami-0660 s. 256}. Kira veya spekülasyon sözleşmesi ücretin bilinmemesi nedeniyle geçersiz kılındığında, vekili nitelikli tüccarları zorladığında veya ücrette büyük bir adaletsizlik olduğunda alternatiftir {cite:usul-iqtisad-islami-0660 s. 255}. Her sözleşmede varsayılan değildir; varsayılan ücret üzerinde anlaşılan ücrettir {cite:usul-iqtisad-islami-0660 s. 256}."
  id: "Upah setara adalah upah pekerja pasar dan ditentukan oleh wali dengan berkonsultasi dengan para ahli dan berdasarkan upah pasar rata-rata {cite:usul-iqtisad-islami-0660 hlm. 256}. Ini adalah alternatif ketika kontrak sewa atau spekulasi dibatalkan karena upah yang tidak diketahui, ketika proxy memaksa pedagang yang memenuhi syarat, atau ketika terdapat ketidakadilan besar dalam upah {cite:usul-iqtisad-islami-0660 hlm. 255}. Ini tidak diasumsikan dalam setiap kontrak; ini adalah upah yang disepakati berdasarkan biaya gagal bayar {cite:usul-iqtisad-islami-0660 hlm. 256}."
