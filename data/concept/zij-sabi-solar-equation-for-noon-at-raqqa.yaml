label: { ar: "تعديل الشمس لوقت انتصاف النهار بالرقة", en: "The solar equation for noon at Raqqa", ur: "رقہ میں دوپہر کے وقت شمسی تعدیل", es: "La ecuación solar para el mediodía en Raqqa", fr: "L'équation solaire pour midi à Raqqa" }
summary:
  ar: "يبيّن البتاني أن تعديل الشمس الذي يُؤخذ من جدول تعديل الشمس هو لوقت انتصاف النهار بمدينة الرقة، فإذا كانت حاصة الشمس أقل من نصف دورة نقص التعديل من الوسط، وإذا كانت أكثر منه زيد عليه، ليخرج موضع الشمس الحقيقي. {cite:zij-sabi-nallino-byblion p.107}."
  en: "Al-Battani shows that the solar equation taken from the table is for noon at Raqqa. If the Sun's anomaly is below half a circuit the equation is subtracted from the mean, and if above it is added, which gives the Sun's true place. {cite:zij-sabi-nallino-byblion p.107}."
  ur: "البتانی دکھاتے ہیں کہ سورج کا تعدیل جو جدول سے لیا جاتا ہے وہ رقہ میں دوپہر کے وقت کا ہے؛ اگر سورج کا خاصہ آدھے دور سے کم ہو تو تعدیل اوسط سے گھٹایا جاتا ہے، اور زیادہ ہو تو جمع کیا جاتا ہے، تاکہ سورج کا حقیقی مقام نکلے۔ {cite:zij-sabi-nallino-byblion p.107}۔"
  es: "Al-Battani demuestra que la ecuación solar tomada de la tabla corresponde al mediodía en Raqqa. Si la anomalía del Sol es inferior a medio circuito, la ecuación se resta de la media, y si es superior, se suma, lo que da como resultado la posición real del Sol. {cite:zij-sabi-nallino-byblion p.107}."
  fr: "Al-Battani démontre que l'équation solaire tirée du tableau correspond à midi à Raqqa. Si l'anomalie solaire est inférieure à la moitié d'un circuit, on soustrait l'équation de la moyenne; si elle est supérieure, on l'ajoute, ce qui donne la position réelle du Soleil. {cite:zij-sabi-nallino-byblion p.107}."
