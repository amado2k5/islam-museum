tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "حركة الترجمة العباسية وصيرورة العربية لغة العلم والفلسفة"
  en: "The Abbasid translation movement and how Arabic became the language of science"
  ur: "عباسی تحریکِ ترجمہ اور عربی کا علم و فلسفہ کی زبان بننا"
  fr: "Le mouvement de traduction abbasside et l'arabe devenu langue de science"
  es: "El movimiento de traducción abasí y el árabe como lengua de la ciencia"
summary:
  ar: "بيت الحكمة في بغداد في عهد المنصور والرشيد والمأمون، ومترجمان كبيران هما حنين بن إسحاق وثابت بن قرة، وكيف صارت العربية لغة العلم والفلسفة بفضل رعاية الخلفاء والأسر الإدارية، كما يعرض ملخص بحثي قُدّم إلى المتحف {cite:britannica-bayt-al-hikmah} {cite:yale-nelc-dimitri-gutas} {cite:wikipedia-graeco-arabic-translation-movement-en}."
  en: "The House of Wisdom in Baghdad under al-Mansur, al-Rashid and al-Ma'mun, two great translators, Hunayn ibn Ishaq and Thabit ibn Qurra, and how Arabic became the language of science and philosophy through caliphal and administrative patronage, as a research summary supplied to the museum presents it {cite:britannica-bayt-al-hikmah} {cite:yale-nelc-dimitri-gutas} {cite:wikipedia-graeco-arabic-translation-movement-en}."
  ur: "بغداد میں منصور، رشید اور مامون کے عہد میں بیت الحکمت، دو بڑے مترجم حنین بن اسحاق اور ثابت بن قرہ، اور خلفا اور انتظامی خاندانوں کی سرپرستی سے عربی کا علم و فلسفہ کی زبان بننا، جیسا میوزیم کو دیا گیا تحقیقی خلاصہ پیش کرتا ہے {cite:britannica-bayt-al-hikmah} {cite:yale-nelc-dimitri-gutas} {cite:wikipedia-graeco-arabic-translation-movement-en}۔"
  fr: "La Maison de la sagesse à Bagdad sous al-Mansur, al-Rashid et al-Ma'mun, deux grands traducteurs, Hunayn ibn Ishaq et Thabit ibn Qurra, et comment l'arabe devint langue de science et de philosophie par le patronage des califes et des familles administratives, tel que le présente une synthèse de recherche remise au musée {cite:britannica-bayt-al-hikmah} {cite:yale-nelc-dimitri-gutas} {cite:wikipedia-graeco-arabic-translation-movement-en}."
  es: "La Casa de la Sabiduría en Bagdad bajo al-Mansur, al-Rashid y al-Ma'mun, dos grandes traductores, Hunayn ibn Ishaq y Thabit ibn Qurra, y cómo el árabe llegó a ser lengua de ciencia y filosofía por el patronazgo de los califas y de las familias administrativas, tal como lo presenta un resumen de investigación entregado al museo {cite:britannica-bayt-al-hikmah} {cite:yale-nelc-dimitri-gutas} {cite:wikipedia-graeco-arabic-translation-movement-en}."
