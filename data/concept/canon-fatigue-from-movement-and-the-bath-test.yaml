summary:
  ar: "يقول ابن سينا إن ترك الحركة مع ابتداء أثر الإعياء يمنع حدوثه، ثم تستعمل رياضة الاسترداد، ويعرف حال المعيا بالاستحمام فإن أحدث نافضاً أو حمى فالأمر مجاوز الحد ولا يستحم بل يستفرغ {cite:canon-ibn-sina-print-v1 p.245}."
  en: "Ibn Sina says that stopping movement at the first sign of fatigue prevents it, after which restorative exercise is used, and the person's state is known by bathing: if the bath brings on shivering or fever the matter has passed the limit, and he is not bathed but evacuated {cite:canon-ibn-sina-print-v1 p.245}."
