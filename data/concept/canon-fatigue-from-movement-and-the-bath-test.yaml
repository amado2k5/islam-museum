id: concept/canon-fatigue-from-movement-and-the-bath-test
class: concept
kind: scientific
label:
  ar: "الإعياء الحادث عن الحركة واختبار الحمام عند ابن سينا"
  en: "Fatigue from movement and the bath test in the Canon"
  fr: "Fatigue de mouvement et épreuve du bain dans le Canon"
  ur: "حرکت سے ہونے والی تھکن اور غسل کی آزمائش قانون میں"
  es: "Fatiga por movimiento y la prueba de baño en el Canon"
  tr: "İbn Sina'da hareket ve güvercin testi nedeniyle oluşan yorgunluk"
  id: "Kelelahan akibat gerakan dan tes merpati di Ibn Sina"
summary:
  ar: "يقول ابن سينا إن ترك الحركة مع ابتداء أثر الإعياء يمنع حدوثه، ثم تستعمل رياضة الاسترداد، ويعرف حال المعيا بالاستحمام فإن أحدث نافضاً أو حمى فالأمر مجاوز الحد ولا يستحم بل يستفرغ {cite:canon-ibn-sina-print-v1 p.245}."
  en: "Ibn Sina says that stopping movement at the first sign of fatigue prevents it, after which restorative exercise is used, and the person's state is known by bathing: if the bath brings on shivering or fever the matter has passed the limit, and he is not bathed but evacuated {cite:canon-ibn-sina-print-v1 p.245}."
  fr: "Ibn Sina conseille l’arrêt aux premiers signes de fatigue, puis exercice réparateur. Le bain révélerait l’état : frissonnement ou fièvre signaleraient matière excessive, appelant évacuation plutôt que bain {cite:canon-ibn-sina-print-v1 p.245}."
  es: "Ibn Sina dice que detener el movimiento al primer signo de fatiga la previene, después de lo cual se utiliza el ejercicio restaurativo, y el estado de la persona se conoce mediante el baño: si el baño provoca escalofríos o fiebre, la situación ha llegado a un punto crítico, y no se le baña sino que se le evacua {cite:canon-ibn-sina-print-v1 p.245}."
  ur: "ابن سینا کہتے ہیں کہ تھکاوٹ کی پہلی علامت پر حرکت روکنا اس کو روکتا ہے، اس کے بعد آرام کرنے والی ورزش کی جاتی ہے، اور غسل کرنے سے آدمی کی حالت معلوم ہوتی ہے: اگر غسل سے کپکپاہٹ یا بخار آئے تو معاملہ حد سے گزر چکا ہے، اور اسے غسل نہیں دیا گیا بلکہ باہر نکالا گیا ہے۔"
  tr: "İbn Sina, yorgunluğun başladığında hareketin durdurulmasının bunun gerçekleşmesini engellediğini söyler. Sonra iyileşme egzersizleri yapılır. Bağırsak durumu banyo olarak adlandırılır; akıntı veya ateşe neden olursa, madde sınırı aşar; yıkanmak yerine kusmak gerekir {cite:canon-ibn-sina-print-v1 s.245}."
  id: "Ibn Sina mengatakan bahwa menghentikan gerakan pada awal kelelahan mencegah terjadinya kelelahan. Kemudian latihan pemulihan digunakan. Kondisi usus dikenal sebagai mandi; jika menyebabkan cairan atau demam, maka bahan tersebut melebihi batas dan seseorang tidak boleh mandi, melainkan muntah {cite:canon-ibn-sina-print-v1 hlm.245}."
