summary:
  ar: "الملح ما يطيب به الطعام، ويذكر ويؤنث. وللفقهاء أحكام فيه: جواز الوضوء بماء انعقد منه الملح دون الماء الذائب فيه، واختلافهم في الماء المتغير بالملح، وعدم جواز التيمم به عند الجمهور، وكونه من الأعيان الربوية التي نص عليها الحديث."
  en: "Milh is the salt that seasons food; it may be masculine or feminine. The jurists rule on it: ablution is allowed with water in which salt has formed but not with water in which salt has melted; they differ on water changed by salt; tayammum with salt is not allowed by most; and salt is one of the goods on which the hadith forbids riba."
  ur: "نمک وہ چیز ہے جس سے کھانا لذیذ ہوتا ہے۔ فقہاء نے اس کی طہارت، تیمم اور سود کے احکام بیان کیے ہیں۔"
