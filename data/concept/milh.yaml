label: { ar: "المِلْح", en: "Salt (milh) in purity and riba rulings", ur: "نمک ⁦(طہارت اور سود کے احکام)⁩", es: "Sal (milh) en normas sobre pureza y riba", fr: "Le sel (milh) en matière de pureté et de règles relatives au riba", tr: "Tuz", id: "Garam" }
summary:
  ar: "الملح ما يطيب به الطعام، ويذكر ويؤنث. وللفقهاء أحكام فيه: جواز الوضوء بماء انعقد منه الملح دون الماء الذائب فيه، واختلافهم في الماء المتغير بالملح، وعدم جواز التيمم به عند الجمهور، وكونه من الأعيان الربوية التي نص عليها الحديث."
  en: "Milh is the salt that seasons food; it may be masculine or feminine. The jurists rule on it: ablution is allowed with water in which salt has formed but not with water in which salt has melted; they differ on water changed by salt; tayammum with salt is not allowed by most; and salt is one of the goods on which the hadith forbids riba."
  ur: "نمک وہ چیز ہے جس سے کھانا لذیذ ہوتا ہے۔ فقہاء نے اس کی طہارت، تیمم اور سود کے احکام بیان کیے ہیں۔"
  es: "Milh es la sal que sazona los alimentos; puede ser masculina o femenina. Los juristas dictaminan al respecto: la ablución está permitida con agua en la que se ha formado sal, pero no con agua en la que se ha disuelto; difieren en cuanto al agua alterada por la sal; la mayoría no permite el tayammum con sal; y la sal es uno de los bienes sobre los que el hadiz prohíbe la usura (riba)."
  fr: "Le sel (milh) est le sel utilisé pour assaisonner les aliments; il peut être masculin ou féminin. Les juristes se prononcent à ce sujet: les ablutions sont permises avec de l’eau salée, mais pas avec de l’eau salée fondue; les avis divergent quant à l’utilisation d’eau salée; le tayammum avec du sel est généralement déconseillé; et le sel figure parmi les biens sur lesquels le hadith interdit l’usure (riba)."
  tr: "Tuz, yiyeceği ister erkek ister kadın gibi hoş kılan şeydir. Hukukçuların bu konuda kararları vardır: çözünmüş su yerine tuz oluşmuş suyla yapılan suyla abdest alınmasının izinliliği; tuzla değişen su konusundaki farklılıklar; çoğunluk tayammum ile izin vermemektedir; ve hadislerde belirtilen tefecilik maddelerinden biri olarak kabul edilir."
  id: "Garam adalah yang membuat makanan menyenangkan, baik maskulin maupun feminin. Para ahli hukum memiliki keputusan: diperbolehkannya wudhu dengan air yang berasal dari garam, bukan air larut; perbedaan mereka mengenai air yang berubah dengan garam; mayoritas tidak mengizinkan tayammum dengan itu; dan dianggap sebagai salah satu barang riba yang disebutkan dalam hadits."
