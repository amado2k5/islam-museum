label: { ar: "قول بطليموس إن الهلال لا يُرى لأقل من يوم وليلة", en: "Ptolemy's claim that the crescent is not seen in less than a day and night", ur: "بطلیموس کا قول کہ ہلال ایک دن اور رات سے کم میں نظر نہیں آتا" }
summary:
  ar: "يذكر البتاني أن المتقدمين قالوا إنه لا يمكن أن يُرى الهلال لأقل من يوم وليلة، وهو الأصل الذي يُعمل عليه، ويقول إن مقدار الرؤية الموجود بالرصد قريب من هذا الحد، لكنه إذا دُقّق الأمر علم أن إدراكه لا يكون على حقيقته، بل بالتقريب. {cite:zij-sabi-nallino-byblion p.129}."
  en: "Al-Battani says the earlier writers held that the crescent cannot be seen in less than a day and a night, which is the rule they worked by; he says the visibility found by observation is close to this limit, but on closer examination it is not seen exactly and is only approximate. {cite:zij-sabi-nallino-byblion p.129}."
  ur: "البتانی کہتے ہیں کہ متقدمین کا قول تھا کہ ہلال ایک دن اور رات سے کم میں نظر نہیں آ سکتا، اور یہی وہ اصل ہے جس پر عمل ہوتا رہا؛ وہ کہتے ہیں کہ رصد سے ملنے والی رؤیت کی مقدار اس حد کے قریب ہے، مگر باریک جانچ سے معلوم ہوتا ہے کہ اس کا ادراک حقیقت کے مطابق نہیں بلکہ تقریباً ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.129}۔"
