summary:
  ar: "شقورس في الكتاب له قوة حارة تشرب عصارته للأوجاع، ويطلى طريه بالشراب على البهق، ويلزق القروح المزمنة ويذر على اللحم الزائد، ويطلى بالخل على النقرس ويتخذ منه قيروطي لوجع الصلب، ويتخذ منه لعوق للسعال، وينفع من لذع المعدة ومن الدوسنطاريا وعسر البول، ويذكر الكتاب نقلا موسوما أنه إذا احتملته النساء أدر الطمث {cite:canon-ibn-sina-print-v1 p.683}"
  en: "Shaqurus is in the book of a hot power, its juice drunk for pains; its fresh form is applied with the sharab on bahaq; it closes chronic ulcers and is dusted on proud flesh, is applied with vinegar on gout, a cerate is made of it for pain of the back, a linctus for cough is made of it, and it benefits the stinging of the stomach, dysentery and difficulty of urine; the book lists, as a labelled report, that when women use it as a pessary it brings on the menses {cite:canon-ibn-sina-print-v1 p.683}"
  ur: "شقورس کتاب میں گرم قوت والا ہے، اس کا عرق دردوں کے لیے پیا جاتا ہے؛ اس کا تازہ حصہ شراب کے ساتھ بہق پر لگایا جاتا ہے؛ پرانے قرحوں کو بند کرتا ہے اور زائد گوشت پر چھڑکا جاتا ہے، سرکے کے ساتھ نقرس پر لگایا جاتا ہے، اس سے کمر کے درد کے لیے قیروطی بنائی جاتی ہے، کھانسی کے لیے لعوق بنایا جاتا ہے، اور معدے کی چبھن، پیچش اور پیشاب کی دشواری میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر درج کرتی ہے کہ عورتیں اسے فرزجہ کے طور پر لیں تو حیض جاری کرتا ہے {cite:canon-ibn-sina-print-v1 p.683}۔"
  es: "Shaqurus se encuentra en el libro de un poder ardiente, su jugo se bebe para los dolores; su forma fresca se aplica con sharab sobre bahaq; cierra las úlceras crónicas y se espolvorea sobre la carne orgullosa, se aplica con vinagre para la gota, se prepara con él un cerato para el dolor de espalda, se prepara con él un jarabe para la tos, y beneficia el ardor de estómago, la disentería y la dificultad para orinar; el libro enumera, como un informe etiquetado, que cuando las mujeres lo usan como pesario provoca la menstruación {cite:canon-ibn-sina-print-v1 p.683}"
  fr: "Le Shaqurus est mentionné dans le livre comme une plante aux vertus curatives, dont le jus est consommé pour soulager les douleurs; sa forme fraîche est appliquée avec du sharab sur les maux de gorge; elle guérit les ulcères chroniques et est saupoudrée sur les parties érogènes, appliquée avec du vinaigre contre la goutte, un cérate est préparé à partir de cette plante pour les douleurs dorsales, un sirop contre la toux est également préparé, et elle est bénéfique en cas de brûlures d'estomac, de dysenterie et de difficultés à uriner; le livre rapporte, sous forme de mention, que lorsque les femmes l'utilisent comme pessaire, il provoque les menstruations {cite:canon-ibn-sina-print-v1 p.683}"
  tr: "Kitaptaki Shakoras, ağrılar için emilen güçlü bir güce sahiptir. Vitiligo üzerine yumuşak bir şurup ile kaplanır, kronik ülserlere yapışır, fazla ete serpilir, gut için sirke ile kaplanır, skleroz için sklerotik olarak yapılır ve öksürük kovucu olarak kullanılır. Mide yanması, dizanteri ve idrar yapma zorluğu için faydalıdır. Kitapta, kadınlar bunu tolere ederse adet döneminin tedavi haline geldiği şeklinde bir alıntı yer {cite:canon-ibn-sina-print-v1 s.683}"
  id: "Shakoras dalam buku ini memiliki potensi kuat yang jusnya diserap untuk mengatasi rasa sakit. Ia dilapisi sirup lembut pada vitiligo, menempel pada tukak kronis, menaburkan daging berlebih, dilapisi cuka pada asam urat, dibuat sebagai sklerotik untuk sclerosis, dan digunakan sebagai penolak batuk. Ini bermanfaat untuk perih perut, disentri, dan kesulitan buang air kecil. Buku ini menyebutkan kutipan bahwa jika wanita mentolerirnya, menstruasi menjadi obat {cite:canon-ibn-sina-print-v1 hlm.683}"
