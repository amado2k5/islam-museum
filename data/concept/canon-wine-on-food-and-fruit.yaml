summary:
  ar: "يعد ابن سينا تناول الشراب على كل طعام رديئاً ويؤخره إلى بعد انهضام الطعام وانحداره، ويخص الطعام الرديء الكيموس والفواكه وخصوصاً البطيخ، ويرخص في قدحين أو ثلاثة للمعتاد وبعد الفصد للصحيح {cite:canon-ibn-sina-print-v1 p.237}."
  en: "Ibn Sina holds drinking wine on any food to be poor and puts it off until the food is digested and has descended, singling out food of bad chyme and fruit, melon above all, while allowing two or three cups to the accustomed and after bloodletting for the healthy {cite:canon-ibn-sina-print-v1 p.237}."
