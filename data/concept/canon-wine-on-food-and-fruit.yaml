id: concept/canon-wine-on-food-and-fruit
class: concept
kind: scientific
label: { ar: "الشراب على الطعام والفواكه عند ابن سينا", en: "Wine on food and on fruit in the Canon", ur: "کھانے اور پھلوں پر شراب قانون میں", es: "El vino con la comida y con la fruta en el Canon", fr: "Le vin sur les aliments et les fruits dans le Canon", tr: "İbn Sina'ya göre yiyecek ve meyve yerine içmek", id: "Minum di atas makanan dan buah-buahan menurut Ibn Sina" }
summary:
  ar: "يعد ابن سينا تناول الشراب على كل طعام رديئاً ويؤخره إلى بعد انهضام الطعام وانحداره، ويخص الطعام الرديء الكيموس والفواكه وخصوصاً البطيخ، ويرخص في قدحين أو ثلاثة للمعتاد وبعد الفصد للصحيح {cite:canon-ibn-sina-print-v1 p.237}."
  en: "Ibn Sina holds drinking wine on any food to be poor and puts it off until the food is digested and has descended, singling out food of bad chyme and fruit, melon above all, while allowing two or three cups to the accustomed and after bloodletting for the healthy {cite:canon-ibn-sina-print-v1 p.237}."
  es: "Ibn Sina considera que beber vino con cualquier comida es malo y lo pospone hasta que la comida se haya digerido y haya descendido, destacando los alimentos de quimo malo y la fruta, el melón sobre todo, mientras que permite dos o tres copas a los acostumbrados y después de una sangría para los sanos {cite:canon-ibn-sina-print-v1 p.237}."
  fr: "Ibn Sina considère qu'il est mal de boire du vin avec n'importe quel aliment et le retarde jusqu'à ce que l'aliment soit digéré et descendu, citant les aliments de mauvais chyme et les fruits, le melon surtout, tout en autorisant deux ou trois tasses aux habitués et après une saignée pour les personnes en bonne santé {cite:canon-ibn-sina-print-v1 p.237}."
  ur: "ابن سینا کسی بھی کھانے پر شراب کو ناقص سمجھتا ہے اور اسے اس وقت تک روک دیتا ہے جب تک کہ کھانا ہضم نہ ہو جائے اور اس کے نیچے نہ آجائے، سب سے بڑھ کر خربوزے اور خربوزے کے کھانے کو الگ کرتا ہے، جبکہ عادی کو دو یا تین پیالے اور خون بہنے کے بعد صحت مند ہونے کی اجازت دیتا ہے۔"
  tr: "İbn Sina, herhangi bir yiyecekte su içmeyi kötü sayar ve yiyecek sindirilip bozulduktan sonra içmeyi erteler. Kötü yiyecekler, kimya ve özellikle karpuz olmak üzere meyveler için, doğru {cite:canon-ibn-sina-print-v1 s.237} uyarınca normal ve flebitoma sonrası için iki veya üç bardakta içmek izinlidir."
  id: "Ibn Sina menganggap minum air pada makanan apa pun sebagai makanan yang buruk dan menundanya sampai makanan tersebut dicerna dan terurai. Mengenai makanan buruk, kim, dan buah-buahan, terutama semangka, diperbolehkan dalam dua atau tiga cangkir untuk phlebitoma biasa dan setelah phlebitoma sesuai dengan ketentuan yang benar {cite:canon-ibn-sina-print-v1 hlm.237}."
