id: concept/tarjih-usul
class: concept
kind: doctrine
tags: [madhahib-browser, mh-mafahim]
label:
  ar: "الترجيح"
  en: "Tarjih (preponderance): choosing the stronger of two conflicting evidences, between two reports and between two analogies"
  ur: "ترجیح"
  es: "Tarjih (preponderancia): elegir la evidencia más sólida entre dos evidencias contradictorias, entre dos informes y entre dos analogías."
  fr: "Tarjih (prépondérance): choisir la preuve la plus convaincante entre deux preuves contradictoires, entre deux rapports et entre deux analogies."
  tr: "Ağırlıklandırma"
  id: "Pembobotan"
summary:
  ar: "الترجيح في اللغة تقوية أحد المتماثلين على الآخر، وعرّفه الحنفية بأنه إظهار الزيادة لأحد المتماثلين على الآخر بما لا يستقل، وعرّفه الشافعية بأنه اقتران أحد الصالحين للدلالة على المطلوب مع تعارضهما بما يوجب العمل بأحدهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} ويجب العمل بالدليل الراجح وإهمال المرجوح إذا لم يمكن الجمع بينهما، وقد أجمع السلف على تقديم بعض الأخبار على بعض بحسب قوة الظن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8625} ومن قواعد الترجيح بين الخبرين ما يتعلق بالسند، كزيادة الرواة وكبر الصحابي وتقدم الإسلام وتقديم المتواتر على الآحاد، وما يتعلق بالمتن ودلالته، كتقديم الدال على الحظر والدال على الوجوب، وتقديم الحقيقي على المجازي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627} وفي الترجيح بين قياسين يُرجح القياس بقوة دليل حكم الأصل، وبقوة مسلك العلة، وبكون الفرع من جنس الأصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627}"
  en: "Tarjih in the lexicon is strengthening one of two alike things over the other. The Hanafis define it as showing an excess in one of two alike items that is not independent, and the Shafi'is as one of two valid proofs being preferred to its opponent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} When two conflicting proofs cannot be reconciled, the stronger must be acted upon and the weaker set aside, and the Companions and the early scholars did so by the strength of the opinion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8625} Among the rules for two reports are those about the chain, such as more transmitters, a senior Companion, earlier Islam, and mutawatir over single reports; and those about the text, such as a prohibition over a command, and the literal over the figurative. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627} For two analogies, one prefers the analogy whose root ruling is stronger, whose cause is more clearly stated, or whose branch is of the same kind as its root. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627}"
  ur: "ترجیح دو متعارض دلیلوں میں سے قوی کو اختیار کرنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} جب جمع ممکن نہ ہو تو راجح دلیل پر عمل کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624}"
  es: "Tarjih en el léxico significa fortalecer una de dos cosas similares sobre la otra. Los Hanafi lo definen como mostrar un exceso en uno de dos elementos similares que no es independiente, y los Shafi'i como que una de dos pruebas válidas se prefiere a su oponente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} Cuando dos pruebas contradictorias no pueden conciliarse, debe actuarse sobre la más fuerte y dejar de lado la más débil, y los Compañeros y los primeros eruditos lo hicieron por la fuerza de la opinión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8625} Entre las reglas para dos relatos se encuentran las relativas a la cadena, como la de más transmisores, un Compañero de mayor antigüedad, el Islam primitivo y la de mutawatir sobre relatos individuales; y las relativas al texto, como la de una prohibición sobre un mandato y la de lo literal sobre lo figurado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627} Para dos analogías, se prefiere la analogía cuya regla raíz es más fuerte, cuya causa está más claramente establecida o cuya rama es del mismo tipo que su raíz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627}"
  fr: "Dans le lexique, le terme « tarjih » désigne le fait de privilégier l'un de deux éléments similaires par rapport à l'autre. Les hanafites le définissent comme la démonstration d'un excès dans l'un de deux éléments similaires, sans que ces éléments soient indépendants, tandis que les shafi'ites le définissent comme la préférence accordée à l'une des deux preuves valides par rapport à son adversaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} Lorsque deux preuves contradictoires sont inconciliables, il convient de privilégier la plus forte et d'écarter la plus faible. C'est ce que faisaient les Compagnons et les premiers savants, en se basant sur la force de l'opinion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8625} Parmi les règles concernant deux hadiths, on trouve celles relatives à la chaîne de transmission, comme la présomption de pluralité de transmetteurs, d'un Compagnon plus ancien, d'une islam plus ancienne, et la priorité sur les hadiths mutawatir par rapport aux hadiths isolés; et celles relatives au texte, comme la présomption d'interdiction par rapport à un commandement, et la présomption d'interprétation littérale par rapport à l'interprétation figurative. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627} Pour deux analogies, on privilégie celle dont la règle fondamentale est plus forte, dont la cause est plus clairement énoncée, ou dont la branche est de même nature que sa racine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627}"
  tr: "Dilde tercih, bir aynı kişinin diğerine karşı güçlendirilmesidir. Hanafi bunu, bağımsız olmayan bir şekilde bir aynı kişinin diğerine eklenmesi olarak tanımlar. Şafi'ler, iki doğrudan birinin amaçlanan amacı göstermek için birleşimi olarak tanımlar; hatta birbirleriyle çelişseler bile ve bu kişiler birine karşı hareket etmeyi gerektirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8624} Daha güçlü kanıtlara göre hareket etmek ve uzlaştırılamadıkça o kadar olası olanı görmezden gelmek gerekir. İlk nesiller, varsayımın gücüne göre bazı raporları diğerlerinden önceliklendirmeyi oybirliğiyle kabul ettiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8624} {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s. 8625} İki rivayet arasındaki tercih kuralları arasında, aktarım zinciriyle ilgili olanlar arasında, örneğin rivayetçilerin eklenmesi, Sahabe'nin tekbiri, İslam'ın önceliği ve mutavatirin tek raporlara tercih edilmesi ile metin ve onun gösterimiyle ilgili olanlar da vardır; örneğin, yasak ve yükümlülüğü gösteren şeylere öncelik vermek ve gerçek olana mecazi olandan üstün tutulmak gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8627} İki ölçü arasında tercih olarak, benzetme, orijinal hükmün kanıtının gücü, neden yönteminin gücü ve dalın orijinaliyle aynı türden olması ile tercih edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8627}"
  id: "Dalam bahasa, preferensi adalah penguatan satu orang identik atas orang lain. Hanafi mendefinisikannya sebagai indikasi penambahan satu orang identik atas yang lain dengan cara yang tidak independen. Shafi'i mendefinisikannya sebagai perpaduan salah satu dari dua orang benar untuk menunjukkan tujuan yang dimaksudkan, meskipun keduanya saling bertentangan dengan cara yang memerlukan tindakan berdasarkan salah satu dari mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8624} Perlu bertindak berdasarkan bukti yang lebih kuat dan mengabaikan yang lebih mungkin jika tidak mungkin untuk mendamaikannya. Generasi awal sepakat bulat untuk memprioritaskan beberapa laporan di atas yang lain berdasarkan kekuatan dugaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 8625} Di antara aturan preferensi antara kedua laporan tersebut adalah yang berkaitan dengan rantai transmisi, seperti penambahan narator, takbir Sang Sahabat, prioritas Islam, dan preferensi mutawatir dibandingkan laporan tunggal, serta yang berkaitan dengan teks dan indikasinya, seperti memberikan prioritas pada apa yang menunjukkan larangan dan kewajiban, dan memberikan prioritas pada yang nyata dibandingkan metaforis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8627} Dalam preferensi antara dua ukuran, analogi lebih disukai berdasarkan kekuatan bukti putusan asli, kekuatan metode sebab, dan fakta bahwa cabangnya adalah jenis yang sama dengan yang asli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8627}"
