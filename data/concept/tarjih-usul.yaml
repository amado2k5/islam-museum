id: concept/tarjih-usul
class: concept
kind: doctrine
label:
  ar: "الترجيح"
  en: "Tarjih (preponderance): choosing the stronger of two conflicting evidences, between two reports and between two analogies"
  ur: "ترجیح"
summary:
  ar: "الترجيح في اللغة تقوية أحد المتماثلين على الآخر، وعرّفه الحنفية بأنه إظهار الزيادة لأحد المتماثلين على الآخر بما لا يستقل، وعرّفه الشافعية بأنه اقتران أحد الصالحين للدلالة على المطلوب مع تعارضهما بما يوجب العمل بأحدهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} ويجب العمل بالدليل الراجح وإهمال المرجوح إذا لم يمكن الجمع بينهما، وقد أجمع السلف على تقديم بعض الأخبار على بعض بحسب قوة الظن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8625} ومن قواعد الترجيح بين الخبرين ما يتعلق بالسند، كزيادة الرواة وكبر الصحابي وتقدم الإسلام وتقديم المتواتر على الآحاد، وما يتعلق بالمتن ودلالته، كتقديم الدال على الحظر والدال على الوجوب، وتقديم الحقيقي على المجازي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627} وفي الترجيح بين قياسين يُرجح القياس بقوة دليل حكم الأصل، وبقوة مسلك العلة، وبكون الفرع من جنس الأصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627}"
  en: "Tarjih in the lexicon is strengthening one of two alike things over the other. The Hanafis define it as showing an excess in one of two alike items that is not independent, and the Shafi'is as one of two valid proofs being preferred to its opponent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} When two conflicting proofs cannot be reconciled, the stronger must be acted upon and the weaker set aside, and the Companions and the early scholars did so by the strength of the opinion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8625} Among the rules for two reports are those about the chain, such as more transmitters, a senior Companion, earlier Islam, and mutawatir over single reports; and those about the text, such as a prohibition over a command, and the literal over the figurative. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8626} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627} For two analogies, one prefers the analogy whose root ruling is stronger, whose cause is more clearly stated, or whose branch is of the same kind as its root. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8627}"
  ur: "ترجیح دو متعارض دلیلوں میں سے قوی کو اختیار کرنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8623} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624} جب جمع ممکن نہ ہو تو راجح دلیل پر عمل کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8624}"
