summary:
  ar: "الشب في الكتاب ينقل عن ديسقوريدوس أن أصنافه كثيرة والداخل منها في علاج الطب المشقق والرطب والمدحرج، حار يابس في الثانية، فيه منع وتجفيف وينفع نزف كل دم ويمنع سيلان الفضول، ويطلى مع ماء الزفت على الحزاز والقمل وصنان الإبط، وينفع القروح العسرة والمتأكلة، ويتمضمض بطبيخه لوجع الأسنان {cite:canon-ibn-sina-print-v1 p.676}"
  en: "Shabb is in the book, as reported from Dioscorides, of many kinds, those entering the treatment of medicine being the split, the moist and the rolled; it is hot and dry in the second degree, with a power of holding back and of drying, benefits the flow of every blood and holds back the flowing of superfluities; it is smeared with the water of pitch on scurf, lice and the stench of the armpit, benefits difficult and eating ulcers, and its decoction is gargled for toothache {cite:canon-ibn-sina-print-v1 p.676}"
  ur: "شب کتاب میں، دیسقوریدوس سے نقل کے مطابق، بہت قسموں کا ہے، اور طب کے علاج میں داخل قسمیں پھٹی ہوئی، تر اور لڑھکائی ہوئی ہیں؛ دوسرے درجے میں گرم خشک، اس میں روکنے اور خشک کرنے کی قوت ہے، ہر خون کے بہنے میں نافع ہے اور فضلات کے بہاؤ کو روکتا ہے؛ رال کے پانی کے ساتھ خشکی، جوؤں اور بغل کی بو پر لگایا جاتا ہے، دشوار اور کھا جانے والے قرحوں میں نافع ہے، اور اس کے جوشاندے سے دانتوں کے درد کے لیے غرارے کیے جاتے ہیں {cite:canon-ibn-sina-print-v1 p.676}۔"
  es: "En el libro, según Dioscórides, el Shabb se presenta en muchas variedades, siendo las que se utilizan en medicina las partidas, las húmedas y las enrolladas. En segundo lugar, es caliente y seco, con poder para contener y secar, favorece la circulación sanguínea y frena el flujo de superfluidades. Se aplica con agua de brea sobre la caspa, los piojos y el mal olor de las axilas, beneficia las úlceras difíciles y dolorosas, y se hace gárgara con su decocción para el dolor de muelas. {cite:canon-ibn-sina-print-v1 p.676}"
