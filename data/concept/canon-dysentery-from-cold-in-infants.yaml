id: concept/canon-dysentery-from-cold-in-infants
class: concept
kind: scientific
label:
  ar: "الزحير من البرد عند الصبيان عند ابن سينا"
  en: "Dysentery from cold in infants in the Canon"
  fr: "Dysenterie par froid du nourrisson dans le Canon"
  ur: "قانون میں بچوں کی سردی سے پیچش"
  es: "Disentería por frío en lactantes en el Canon"
  tr: "İbn Sina'ya göre El-Zahir soğuktan çocuklarda"
  id: "Al-Zahir dari dingin pada anak laki-laki menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا زحيراً يعرض للصبيان من برد يصيبهم، وعلاجه بدواء يدق وينخل ويعجن بسمن البقر العتيق ويسقى بماء بارد؛ وأسماء أدويته مشوهة في النص الممسوح فلا تذكر {cite:canon-ibn-sina-print-v1 p.219}."
  en: "Ibn Sina mentions dysentery that befalls infants from a cold that strikes them, treated with a drug pounded, sifted, kneaded with old cow's ghee and given in cold water; the names of its drugs are garbled in the scanned text and are not given {cite:canon-ibn-sina-print-v1 p.219}."
  fr: "Ibn Sina mentionne la dysenterie infantile après refroidissement, traitée par remède pilé, tamisé, pétri au beurre clarifié ancien de vache et donné dans l’eau froide ; les noms des ingrédients, corrompus dans la numérisation, sont omis {cite:canon-ibn-sina-print-v1 p.219}."
  es: "Ibn Sina menciona la disentería que afecta a los bebés a causa de un resfriado que los ataca, tratado con un medicamento machacado, tamizado, amasado con ghee de vaca viejo y administrado en agua fría; los nombres de sus medicamentos están ilegibles en el texto escaneado y no se proporcionan {cite:canon-ibn-sina-print-v1 p.219}."
  ur: "ابن سینا نے پیچش کا ذکر کیا ہے جو شیر خوار بچوں کو نزلہ زکام سے لاحق ہوتا ہے، اس کا علاج ایک دوا سے کیا جاتا ہے، چھان لیا جاتا ہے، پرانے گائے کے گھی سے گوندھ کر ٹھنڈے پانی میں پلایا جاتا ہے۔ اسکین شدہ متن میں اس کی دوائیوں کے نام بکھرے ہوئے ہیں اور انہیں نہیں دیا گیا ہے {cite:canon-ibn-sina-print-v1 p.219}۔"
  tr: "İbn Sina, çocukları soğuk algınlığına maruz bırakan ve ezilen, elenen bir ilaçla tedavi eden bir zahiradan bahseder; bu ilaçlar elenir, yaşlı inek sayağıyla yoğurulur ve soğuk su verilir; ilaçlarının isimleri taranan metinde çarpıtılmış ve bahsedilmez {cite:canon-ibn-sina-print-v1 s.219}."
  id: "Ibn Sina menyebutkan sebuah zahira yang membuat anak laki-laki terpapar flu dan mengobatinya dengan obat yang dihancurkan, disaring, diuleni dengan ghee sapi tua, dan diberi air dingin; nama-nama obatnya terdistorsi dalam teks hasil scan dan tidak disebutkan {cite:canon-ibn-sina-print-v1 hlm.219}."
