summary:
  ar: "الموضحة شجة تبلغ العظم فتوضحه، وهي نوع من الشجاج، وتفترق عن الباضعة التي لا تبلغ العظم. وتجب فيها القصاص في العمد، ولا يستوفى بالسيف لعدم الأمن من الزيادة، وأرشها خمس من الإبل في الخطأ. وهي في الرأس والوجه سواء عند جمهور الفقهاء، وفي غيرهما عند الجمهور لا مقدر فيها. وللفقهاء أحكام في تعدي شينها وتعدد الجراح وفي الوكالة بالصلح عليها."
  en: "The muwadiha is a head wound that reaches the bone and lays it bare; it is a kind of wound distinct from the ba'diha, which does not reach the bone. Retaliation is due for it when intended, though it may not be done with a sword for fear of excess; the fixed compensation is five camels when unintended. Most jurists hold that the head and face are alike in it, and that wounds elsewhere on the body carry no fixed sum. The entry covers the spread of its disfigurement, several wounds with a partition between them, and agency for settlement."
  ur: "موضحہ وہ زخم ہے جو ہڈی تک پہنچ کر اسے ظاہر کر دے۔ عمد میں اس کا قصاص ہے، اور خطا میں پانچ اونٹ ارش ہے۔ جمہور کے نزدیک سر اور چہرے کا حکم یکساں ہے، اور اس کے علاوہ بدن کے دوسرے زخموں کی مقرر دیت نہیں۔"
