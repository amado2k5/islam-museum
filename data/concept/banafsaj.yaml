  en: "Banafsaj (violet)"
  fr: "Banafsaj (violette)"
  ur: "بنفشہ"
  es: "Banafsaj (violeta)"
summary:
  ar: "نبات زهري، أصله معروف وقريب من أفعاله؛ ورقه بارد رطب في الأولى، وقيل إنه يولد دماً معتدلاً. يسكن الأورام الحارة ضماداً، ودهنه طلاء جيد للجرب، ويسكن الصداع الدموي شماً وطلاء، وينفع من الرمد الحار والسعال الحار، ويليّن الصدر، وشرابه نافع من ذات الجنب والرئة، وشرابه يدرّ البول ويلين الطبيعة برفق {cite:canon-ibn-sina-print-v1 p.387}."
  en: "A flowering plant whose root is well known and close in its actions to the rest of it. The leaf is cold and moist in the first degree; some say the plant produces a moderate blood. It calms hot swellings as a poultice, its oil is a good liniment for scabies, and it quiets bloody headache by smell and by application. It helps hot inflammation of the eye and hot cough, softens the chest, and its drink helps pleurisy and lung disease and promotes urine {cite:canon-ibn-sina-print-v1 p.387}."
  fr: "Plante à fleurs dont la racine est connue et proche du reste de la plante par ses actions. La feuille est froide et humide au premier degré ; certains disent que la plante produit un sang modéré. Elle apaiserait les gonflements chauds en cataplasme ; son huile serait un bon liniment contre la gale, son odeur et son application calmeraient les céphalées sanguines. Elle aiderait contre l’inflammation chaude de l’œil et la toux chaude, adoucirait la poitrine ; sa boisson aiderait contre la pleurésie et les maladies pulmonaires et favoriserait l’urine {cite:canon-ibn-sina-print-v1 p.387}."
  ur: "یہ ایک پھولدار پودا ہے، جس کی جڑ معروف ہے اور اس کے افعال بھی اسی جیسے ہیں۔ اس کا پتہ پہلے درجے میں ٹھنڈا اور تر ہے، اور کہا گیا ہے کہ یہ معتدل خون پیدا کرتا ہے۔ یہ گرم ورموں کو سینک کے طور پر آرام دیتا ہے، اس کا تیل خارش کے لیے اچھا لیپ ہے، اور خونی سردرد کو سونگھنے اور لیپ کرنے سے سکون دیتا ہے۔ یہ گرم رمد اور گرم کھانسی میں نفع دیتا ہے، سینے کو نرم کرتا ہے، اور اس کا شربت ذات الجنب اور پھیپھڑوں کی بیماری میں نفع دیتا ہے اور پیشاب آور ہے {cite:canon-ibn-sina-print-v1 p.387}۔"
  es: "Una planta con flores cuya raíz es bien conocida y sus efectos son similares a los del resto de la planta. La hoja es fría y húmeda en primer grado; algunos dicen que la planta produce una coagulación moderada. Calma las inflamaciones calientes como cataplasma, su aceite es un buen linimento para la sarna y alivia el dolor de cabeza con sangre por su aroma y aplicación. Ayuda con la inflamación caliente del ojo y la tos caliente, suaviza el pecho y su bebida ayuda con la pleuresía y las enfermedades pulmonares y promueve la micción {cite:canon-ibn-sina-print-v1 p.387}."
