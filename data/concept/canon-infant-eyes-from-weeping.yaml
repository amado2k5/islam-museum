label: { ar: "علل عيون الصبيان من البكاء عند ابن سينا", en: "Infants' eye troubles from weeping in the Canon", ur: "قانون میں رونے سے بچوں کی آنکھوں کی تکلیفیں" }
summary:
  ar: "يذكر ابن سينا أن ماء الرأس عند الصبي مما سبق علاجه في علل الرأس، وانتفاخ العيون وبياض الحدقة من كثرة البكاء وسلاق الجفن، وعلاجها بالحضض واللبن وطبيخ البابونج وعصارة عنب الثعلب {cite:canon-ibn-sina-print-v1 p.216}."
  en: "Ibn Sina says water in a child's head was treated in the chapters on diseases of the head, and mentions swelling of the eyes, whiteness in the pupil from much weeping and sores of the eyelid, treated with hudud and milk, chamomile decoction and nightshade juice {cite:canon-ibn-sina-print-v1 p.216}."
