id: concept/canon-infant-eyes-from-weeping
class: concept
kind: scientific
label:
  ar: "علل عيون الصبيان من البكاء عند ابن سينا"
  en: "Infants' eye troubles from weeping in the Canon"
  fr: "Troubles oculaires infantiles par pleurs dans le Canon"
  ur: "قانون میں رونے سے بچوں کی آنکھوں کی تکلیفیں"
  es: "Problemas oculares en bebés por llorar en el Canon"
  tr: "İbn Sina'nın Erkeklerin Gözlerinin Ağlamasının Nedenleri"
  id: "Penyebab Mata Anak Laki-laki Menangis oleh Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن ماء الرأس عند الصبي مما سبق علاجه في علل الرأس، وانتفاخ العيون وبياض الحدقة من كثرة البكاء وسلاق الجفن، وعلاجها بالحضض واللبن وطبيخ البابونج وعصارة عنب الثعلب {cite:canon-ibn-sina-print-v1 p.216}."
  en: "Ibn Sina says water in a child's head was treated in the chapters on diseases of the head, and mentions swelling of the eyes, whiteness in the pupil from much weeping and sores of the eyelid, treated with hudud and milk, chamomile decoction and nightshade juice {cite:canon-ibn-sina-print-v1 p.216}."
  fr: "Ibn Sina renvoie l’eau dans la tête aux maladies céphaliques et décrit gonflement oculaire, blancheur pupillaire après pleurs et plaies palpébrales, puis hudud au lait, décoction de camomille et suc de morelle {cite:canon-ibn-sina-print-v1 p.216}."
  es: "Ibn Sina dice que el agua en la cabeza de un niño se trataba en los capítulos sobre enfermedades de la cabeza, y menciona la hinchazón de los ojos, la blancura en la pupila por mucho lagrimeo y las llagas del párpado, tratadas con hudud y leche, decocción de manzanilla y jugo de belladona {cite:canon-ibn-sina-print-v1 p.216}."
  ur: "ابن سینا کہتے ہیں کہ سر کی بیماریوں کے ابواب میں بچے کے سر میں پانی کا علاج کیا گیا ہے اور آنکھوں کی سوجن، بہت زیادہ رونے سے پتلی کی سفیدی اور پلکوں کے زخموں کا ذکر ہے، اس کا علاج ہدود اور دودھ، کیمومائل کا کاڑھا اور رات کے جوس سے کیا گیا ہے۔"
  tr: "İbn Sina, erkek çocuklarda baş suyunun daha önce baş rahatsızlıkları, göz şişmesi, sık ağlamadan kaynaklanan gözbebeği beyazlığı ve göz kapağı kaynaması için tedavi edilen yöntemlerden biri olduğunu ve bunun geyik, yoğurt, papatya pişirme ve bektaşi üzümü suyu ile tedavi edildiğini belirtir {cite:canon-ibn-sina-print-v1 s.216}."
  id: "Ibn Sina menyebutkan bahwa air kepala pada anak laki-laki adalah salah satu yang sebelumnya diobati untuk penyakit kepala, pembengkakan mata, pupil putih akibat menangis sering, dan kelopak mata mendidih, dan mengobatinya dengan rusa, yogurt, memasak chamomile, dan jus gooseberry {cite:canon-ibn-sina-print-v1 hlm.216}."
