id: concept/hisab-salat-al-jamaa
class: concept
kind: doctrine
label:
  ar: "صلاة الجماعة: سبع وعشرون درجة"
  en: "Prayer in congregation: twenty-seven ranks"
  ur: "باجماعت نماز: ستائیس درجے"
  es: "Oración en congregación: veintisiete filas"
  fr: "Prière en assemblée: vingt-sept rangs"
  tr: "Cemaat duası: yirmi yedi derece"
  id: "Doa jemaah: dua puluh tujuh derajat"
summary:
  ar: "صلاة الجماعة أفضل من صلاة الفذّ بسبع وعشرين درجة في رواية ابن عمر [[passage/muslim-0650]] [[passage/muwatta-1-341]]، وبخمس وعشرين في رواية أبي سعيد عند البخاري [[passage/bukhari-api-646]]. يعرض هذا السطر الروايتين معا ولا يرجّح بينهما، وتحسب الآلة بالسبع والعشرين وتذكر الخمس والعشرين في النتيجة."
  en: "Prayer in congregation is better than the prayer of a man alone by twenty-seven ranks in Ibn Umar's narration [[passage/muslim-0650]] [[passage/muwatta-1-341]], and by twenty-five in Abu Sa'id's narration in al-Bukhari [[passage/bukhari-api-646]]. This row shows both narrations and does not choose between them; the calculator counts with twenty-seven and names twenty-five in the result."
  ur: "باجماعت نماز اکیلے کی نماز سے ابن عمر کی روایت میں ستائیس درجے افضل ہے [[passage/muslim-0650]] [[passage/muwatta-1-341]]، اور ابو سعید کی روایت میں جو بخاری میں ہے پچیس درجے [[passage/bukhari-api-646]]۔ یہ سطر دونوں روایتیں دکھاتی ہے اور ان میں ترجیح نہیں دیتی؛ کیلکولیٹر ستائیس سے حساب کرتا ہے اور نتیجے میں پچیس کا ذکر کرتا ہے۔"
  es: "La oración en congregación es mejor que la oración individual por veintisiete rangos en la narración de Ibn Umar [[passage/muslim-0650]] [[passage/muwatta-1-341]], y por veinticinco en la narración de Abu Sa'id en al-Bukhari [[passage/bukhari-api-646]]. Esta fila muestra ambas narraciones y no elige entre ellas; la calculadora cuenta veintisiete y muestra veinticinco en el resultado."
  fr: "La prière en groupe est supérieure à la prière individuelle de vingt-sept rangs selon le hadith rapporté par Ibn Umar [[passage/muslim-0650]] [[passage/muwatta-1-341]], et de vingt-cinq selon celui rapporté par Abu Sa'id dans al-Bukhari [[passage/bukhari-api-646]]. Cette ligne présente les deux hadiths sans trancher; le calculateur compte vingt-sept rangs et affiche vingt-cinq dans le résultat."
  tr: "Cemaat namazı, İbn Ömer [[passage/muslim-0650]] [[passage/muwatta-1-341]'nin rivayetine göre tek bir namazdan yirmi yedi derece daha iyidir ve Ebu Sa'id'in rivayetinde yirmi beş derece daha iyidir [[passage/bukhari-api-646]]. Bu satır her iki rivayeti birlikte sunar ve onları desteklemez; araç yirmi yedi, sonuçta yirmi beş olarak hesaplanır."
  id: "Doa jemaat lebih baik daripada doa tunggal dengan selisih dua puluh tujuh derajat menurut riwayat Ibn Umar [[aparit/muslim-0650]] [[alat/muwatta-1-341]], dan dua puluh lima dalam riwayat Abu Sa'id menurut al-Bukhari [[ayat/bukhari-api-646]]. Baris ini menyajikan kedua narasi secara bersamaan dan tidak memihak mereka; instrumen dihitung pada dua puluh tujuh dan dua puluh lima dalam hasilnya."
