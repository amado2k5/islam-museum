id: concept/hisab-salat-al-jamaa
class: concept
kind: doctrine
label:
  ar: "صلاة الجماعة: سبع وعشرون درجة"
  en: "Prayer in congregation: twenty-seven ranks"
  ur: "باجماعت نماز: ستائیس درجے"
summary:
  ar: "صلاة الجماعة أفضل من صلاة الفذّ بسبع وعشرين درجة في رواية ابن عمر [[passage/muslim-0650]] [[passage/muwatta-1-341]]، وبخمس وعشرين في رواية أبي سعيد عند البخاري [[passage/bukhari-api-646]]. يعرض هذا السطر الروايتين معا ولا يرجّح بينهما، وتحسب الآلة بالسبع والعشرين وتذكر الخمس والعشرين في النتيجة."
  en: "Prayer in congregation is better than the prayer of a man alone by twenty-seven ranks in Ibn Umar's narration [[passage/muslim-0650]] [[passage/muwatta-1-341]], and by twenty-five in Abu Sa'id's narration in al-Bukhari [[passage/bukhari-api-646]]. This row shows both narrations and does not choose between them; the calculator counts with twenty-seven and names twenty-five in the result."
  ur: "باجماعت نماز اکیلے کی نماز سے ابن عمر کی روایت میں ستائیس درجے افضل ہے [[passage/muslim-0650]] [[passage/muwatta-1-341]]، اور ابو سعید کی روایت میں جو بخاری میں ہے پچیس درجے [[passage/bukhari-api-646]]۔ یہ سطر دونوں روایتیں دکھاتی ہے اور ان میں ترجیح نہیں دیتی؛ کیلکولیٹر ستائیس سے حساب کرتا ہے اور نتیجے میں پچیس کا ذکر کرتا ہے۔"
