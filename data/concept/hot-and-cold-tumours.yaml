summary:
  ar: "يسمي ابن سينا الأورام الحارة بحسب أخلاطها، ويصف أوقاتها الأربعة ومآلها، ثم يقسم غير الحارة بحسب السوداء والبلغم والماء والريح إلى الصلابة والسرطان والغدد والسلع والاستسقاء والتهيج والنفخة {cite:canon-ibn-sina-print-v1 pp.107-109}."
  en: "Ibn Sina names the hot tumours by their humours and describes their four times and outcomes, then divides the non-hot by black bile, phlegm, water and wind into hardness, cancer, glands, wens, dropsy, puffiness and inflation {cite:canon-ibn-sina-print-v1 pp.107-109}."
