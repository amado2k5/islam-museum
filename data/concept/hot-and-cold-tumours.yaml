label: { ar: "الأورام الحارة والباردة عند ابن سينا", en: "Hot and cold tumours in the Canon", ur: "قانون میں گرم اور سرد ورم", es: "Tumores calientes y fríos en el Canon", fr: "Tumeurs chaudes et froides dans le Canon" }
summary:
  ar: "يسمي ابن سينا الأورام الحارة بحسب أخلاطها، ويصف أوقاتها الأربعة ومآلها، ثم يقسم غير الحارة بحسب السوداء والبلغم والماء والريح إلى الصلابة والسرطان والغدد والسلع والاستسقاء والتهيج والنفخة {cite:canon-ibn-sina-print-v1 pp.107-109}."
  en: "Ibn Sina names the hot tumours by their humours and describes their four times and outcomes, then divides the non-hot by black bile, phlegm, water and wind into hardness, cancer, glands, wens, dropsy, puffiness and inflation {cite:canon-ibn-sina-print-v1 pp.107-109}."
  es: "Ibn Sina nombra los tumores calientes según sus humores y describe sus cuatro tiempos y resultados, luego divide los no calientes por bilis negra, flema, agua y viento en dureza, cáncer, glándulas, wens, hidropesía, hinchazón e inflamación {cite:canon-ibn-sina-print-v1 pp.107-109}."
  fr: "Ibn Sina nomme les tumeurs chaudes selon leurs humeurs et décrit leurs quatre temps et leurs résultats, puis divise les tumeurs non chaudes selon la bile noire, le phlegme, l'eau et le vent en dureté, cancer, glandes, otites, hydropisie, gonflement et inflation {cite:canon-ibn-sina-print-v1 pp.107-109}."
