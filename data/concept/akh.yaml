label:
  ar: أخ
  en: Brother (full, paternal and maternal) in law
summary:
  ar: الأخ من ولده أبوك وأمك أو أحدهما، والشقيق من الأبوين، والأخ لأب، والأخ لأم، والأخ من الرضاع. وفي الفقه تجوز الزكاة للأخ، ويحجب الأخ بالأب والفرع الوارث الذكر، ويحجب الأخ لأم بالجد والفرع الوارث، ويرث الشقيق والأخ لأب مع الجد. ويقدم الشقيق على غيره، وتختلف المذاهب في تقديم الأخ على الجد في الولاية والحضانة والوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1901}.
  en: A brother is one born to the same father and mother or to one of them, with full brothers, paternal and maternal brothers, and milk-brothers. In law, zakat may be given to brothers; the father and a male descendant block all brothers; the grandfather and a descendant block the maternal brother; full and paternal brothers inherit with the grandfather; the full brother precedes the others, and the schools differ on whether the brother precedes the grandfather in guardianship, custody and bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1901}.
