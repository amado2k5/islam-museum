id: concept/akh
class: concept
kind: legal
label:
  ar: أخ
  en: Brother (full, paternal and maternal) in law
  fr: "Le frère en droit (germain, consanguin ou utérin)"
  es: "Cuñado (de padre y de madre)"
summary:
  ar: الأخ من ولده أبوك وأمك أو أحدهما، والشقيق من الأبوين، والأخ لأب، والأخ لأم، والأخ من الرضاع. وفي الفقه تجوز الزكاة للأخ، ويحجب الأخ بالأب والفرع الوارث الذكر، ويحجب الأخ لأم بالجد والفرع الوارث، ويرث الشقيق والأخ لأب مع الجد. ويقدم الشقيق على غيره، وتختلف المذاهب في تقديم الأخ على الجد في الولاية والحضانة والوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1901}.
  en: A brother is one born to the same father and mother or to one of them, with full brothers, paternal and maternal brothers, and milk-brothers. In law, zakat may be given to brothers; the father and a male descendant block all brothers; the grandfather and a descendant block the maternal brother; full and paternal brothers inherit with the grandfather; the full brother precedes the others, and the schools differ on whether the brother precedes the grandfather in guardianship, custody and bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1901}.
  fr: "Un frère est né du même père et de la même mère, ou de l’un des deux. On distingue le frère germain, le frère consanguin, le frère utérin et le frère de lait. En droit, la zakat peut être versée aux frères. Le père et un descendant masculin écartent tous les frères de la succession ; le grand-père et un descendant écartent le frère utérin ; les frères germains et consanguins héritent avec le grand-père. Le frère germain a priorité sur les autres. Les écoles divergent sur la priorité du frère ou du grand-père en matière de tutelle, de garde et de legs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1901}."
  es: "Un hermano es aquel nacido del mismo padre y madre o de uno de ellos, incluyendo hermanos de padre y madre, hermanos paternos y maternos, y hermanos de leche. En derecho, el zakat puede darse a los hermanos; el padre y un descendiente varón excluyen a todos los hermanos; el abuelo y un descendiente excluyen al hermano materno; los hermanos de padre y madre heredan con el abuelo; el hermano de padre y madre precede a los demás, y las escuelas difieren en cuanto a si el hermano precede al abuelo en la tutela, custodia y legado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1901}."
