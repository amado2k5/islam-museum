id: concept/canon-correcting-bad-waters-on-a-journey
class: concept
kind: scientific
label:
  ar: "إصلاح المياه الفاسدة والمختلفة في السفر"
  en: "Correcting bad and changing waters on a journey in the Canon"
  fr: "Correction des eaux mauvaises et changeantes en voyage dans le Canon"
  ur: "سفر میں خراب اور بدلتے پانیوں کی اصلاح قانون میں"
  es: "Corregir problemas y cambios en las aguas durante un viaje por el Cañón"
  tr: "Seyahat Sırasında Hasar Görmüş ve Çeşitli Su Onarımı"
  id: "Memperbaiki Air yang Rusak dan Lainnya selama Perjalanan"
summary:
  ar: "يذكر ابن سينا ما يدفع فساد المياه المختلفة، فالماء مع الشراب يدفع فساده، ويمزج الماء بالخل عند قلته، والماء المالح يشرب بالخل أو السكنجبين ويلقى فيه الخروب وحب الآس والزعرور، والشبي العفص يلين عليه الطبع، والمر تستعمل عليه الدسومات والحلاوات، والغليظ الكدر يتناول عليه الثوم، ويصفيه الشب اليماني، والبصل ترياق للمياه المختلفة {cite:canon-ibn-sina-print-v1 pp.265-266}."
  en: "Ibn Sina lists what wards off the harm of changing waters: water with wine counters its corruption, water is mixed with vinegar when scant, salty water is drunk with vinegar or oxymel with carob, myrtle seed and hawthorn thrown in, alum-like astringent water is followed by what softens the bowels, bitter water by fatty and sweet things, thick turbid water by garlic and cleared by Yemeni alum, and onion is a theriac against the changing waters {cite:canon-ibn-sina-print-v1 pp.265-266}."
  fr: "Ibn Sina décrit vin avec eau contre sa corruption, vinaigre si elle manque, vinaigre ou oxymel avec caroube, graines de myrte et aubépine pour l’eau salée ; après eau alunée astringente, assouplissants intestinaux ; pour amertume, gras et doux ; pour eau épaisse trouble, ail et clarification à l’alun du Yémen ; l’oignon serait une thériaque des eaux changeantes {cite:canon-ibn-sina-print-v1 pp.265-266}."
  es: "Ibn Sina enumera lo que previene el daño de las aguas cambiantes: el agua con vino contrarresta su corrupción, el agua se mezcla con vinagre cuando es escasa, el agua salada se bebe con vinagre u oxímel con algarroba, semillas de mirto y espino blanco añadidos, el agua astringente similar al alumbre se sigue con lo que suaviza los intestinos, el agua amarga con cosas grasas y dulces, el agua espesa y turbia con ajo y se aclara con alumbre yemení, y la cebolla es una teriaca contra las aguas cambiantes {cite:canon-ibn-sina-print-v1 pp.265-266}."
  ur: "ابن سینا بتاتا ہے کہ پانی کے بدلنے سے کیا نقصانات ہوتے ہیں: شراب کے ساتھ پانی اس کی خرابی کا مقابلہ کرتا ہے، پانی کم ہونے پر سرکہ کے ساتھ ملایا جاتا ہے، نمکین پانی کو سرکہ کے ساتھ پیا جاتا ہے یا کیروب کے ساتھ آکسیمل، مرٹل سیڈ اور شہفنی ڈالا جاتا ہے، پھٹکری جیسا کسیلا پانی اس کے بعد جو میٹھا پانی کو نرم کرتا ہے اور چکنائی والی چیزوں کو پانی میں ملاتا ہے۔ لہسن اور یمنی پھٹکڑی کے ذریعے صاف کیا گیا، اور پیاز بدلتے ہوئے پانیوں کے خلاف ایک تھیریاک ہے۔"
  tr: "İbn Sina, çeşitli suların bozulmasını önleyen şeylerden bahseder: içecekle karıştırılan su bozulmayı giderir, kıt olduğunda sirke ile karıştırılır, tuzlu su sirke veya sakkanjabin ile karıştırılır ve keçiboynuz, mersin ve alıç tohumu ile keçiboynuz, mersin, kavun yumuşatılmış temperament, acı yağlar ve tatlılarla kullanılır, koyu bulanıklık sarımsakla tüketilir, Yemen alüminyumu süzüldü ve soğan çeşitli sulara panzehir olarak kullanılır {cite:canon-ibn-sina-print-v1 s.265-266}."
  id: "Ibn Sina menyebutkan apa yang mencegah pembusukan berbagai air: air yang dicampur dengan minuman menghilangkan kerusakannya, mencampur air dengan cuka jika langka, air asin dengan cuka atau sakkanjabin dan mencampur biji karobi, myrtle, dan hawthorn dicampur dengan wortel, kebon merit dan semangka yang melunak temperaménnya, pahit digunakan bersama lemak dan permen, keruh tebal dikonsumsi bersama bawang putih, alum Yaman disaring, dan bawang bombay menjadi penawar untuk berbagai air {cite:canon-ibn-sina-print-v1 hlm.265-266}."
