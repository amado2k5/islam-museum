summary:
  ar: "يذكر ابن سينا ما يدفع فساد المياه المختلفة، فالماء مع الشراب يدفع فساده، ويمزج الماء بالخل عند قلته، والماء المالح يشرب بالخل أو السكنجبين ويلقى فيه الخروب وحب الآس والزعرور، والشبي العفص يلين عليه الطبع، والمر تستعمل عليه الدسومات والحلاوات، والغليظ الكدر يتناول عليه الثوم، ويصفيه الشب اليماني، والبصل ترياق للمياه المختلفة {cite:canon-ibn-sina-print-v1 pp.265-266}."
  en: "Ibn Sina lists what wards off the harm of changing waters: water with wine counters its corruption, water is mixed with vinegar when scant, salty water is drunk with vinegar or oxymel with carob, myrtle seed and hawthorn thrown in, alum-like astringent water is followed by what softens the bowels, bitter water by fatty and sweet things, thick turbid water by garlic and cleared by Yemeni alum, and onion is a theriac against the changing waters {cite:canon-ibn-sina-print-v1 pp.265-266}."
