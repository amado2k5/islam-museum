label:
  ar: "بيض"
  en: "Bayd (eggs)"
  fr: "Bayd (œufs)"
  ur: "انڈا"
  es: "Bayd (huevos)"
summary:
  ar: "معروف، وأفضله الطري من بيض الدجاج، ويليه بيض الطير الذي يجري مجراه. فيه قبض خصوصاً في محه المشوي، وبياضه يسكن الأوجاع اللاذعة، ويُضمد به وفي الحقن للقروح والأورام، ويفيد في جراحات المقعدة، وصفرته مع الزعفران ودهن الورد تنفع من ضربان العين. ويذكر الكتاب له إدرار الطمث في بيض الوز وزيادة الباه، فتُسجَّل كما وردت دون توصية {cite:canon-ibn-sina-print-v1 p.396}، {cite:canon-ibn-sina-print-v1 p.397}."
  en: "An ordinary food. The best is the fresh egg of the hen, followed by the eggs of birds that are like it. There is astringency, especially in the roasted yolk. The white calms sharp pains, is applied as a poultice and in injections for ulcers and swellings, and helps wounds of the anus. The yolk with saffron and rose oil helps throbbing of the eye. The book also lists goose egg oil poured warm into the womb to bring on the menses and eggs in general increasing desire, recorded as its own listing {cite:canon-ibn-sina-print-v1 p.396}, {cite:canon-ibn-sina-print-v1 p.397}."
  fr: "Aliment ordinaire. Le meilleur est l’œuf frais de poule, suivi de ceux d’oiseaux semblables. Il est astringent, surtout le jaune rôti. Le blanc calmerait les douleurs aiguës ; en cataplasme ou injection, il est employé contre ulcères et gonflements et aiderait les plaies anales. Le jaune avec safran et huile de rose aiderait les pulsations de l’œil. Le livre mentionne aussi l’huile d’œuf d’oie versée tiède dans l’utérus pour provoquer les règles et les œufs comme excitants du désir, indications rapportées comme les siennes {cite:canon-ibn-sina-print-v1 p.396}, {cite:canon-ibn-sina-print-v1 p.397}."
  ur: "یہ عام غذا ہے۔ بہترین مرغی کا تازہ انڈا ہے، اور اس کے بعد وہ پرندوں کے انڈے جو اسی جیسے ہیں۔ اس میں قبض ہے، خاص کر بھُنی ہوئی زردی میں۔ سفیدی تیز دردوں کو آرام دیتی ہے، اور ضماد اور انجیکشن کی طرح ورموں اور زخموں پر لگائی جاتی ہے، اور مقعد کے زخموں میں نفع دیتی ہے۔ زردی زعفران اور گلاب کے تیل کے ساتھ آنکھ کی دھڑکن میں نفع دیتی ہے۔ کتاب کہتی ہے کہ ہنس کے انڈے کا تیل گرم کر کے رحم میں ڈالنے سے حیض جاری ہوتا ہے، اور انڈے شہوت بڑھاتے ہیں؛ یہ کتاب کے اپنے اقوال ہیں جو لکھے گئے ہیں {cite:canon-ibn-sina-print-v1 p.396}، {cite:canon-ibn-sina-print-v1 p.397}۔"
  es: "Un alimento común. El mejor es el huevo fresco de gallina, seguido de los huevos de aves similares. Tiene astringencia, especialmente la yema tostada. La clara calma los dolores agudos, se aplica como cataplasma y en inyecciones para úlceras e hinchazones, y ayuda a las heridas del ano. La yema con azafrán y aceite de rosa ayuda a aliviar el dolor punzante en el ojo. El libro también menciona el aceite de huevo de ganso vertido tibio en el útero para provocar la menstruación y los huevos en general para aumentar el deseo, registrado como una entrada aparte {cite:canon-ibn-sina-print-v1 p.396}, {cite:canon-ibn-sina-print-v1 p.397}."
