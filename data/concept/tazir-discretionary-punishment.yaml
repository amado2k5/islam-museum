id: concept/tazir-discretionary-punishment
class: concept
kind: legal
label:
  ar: "التعزير"
  en: "Ta'zir (discretionary punishment)"
  ur: "تعزیر (صوابدیدی سزا)"
summary:
  ar: "التعزير لغة الرد والمنع والنصرة والتوقير والتأديب، وشرعا عقوبة غير مقدرة في الشرع، تجب حقا لله أو للآدمي في كل معصية ليس فيها حد ولا كفارة غالبا. وهو يفترق عن الحد والقصاص والكفارة في أن القاضي يختار عقوبته بحسب الحال، وأن الحد يدرأ بالشبهة والتعزير يثبت بها، وأن الحد لا يجب على الصغير والتعزير يجوز في حقه، وأن الحد قد يسقط بالتقادم عند بعض الفقهاء والتعزير لا يسقط. ويجتمع مع الحد والقصاص والكفارة في صور معروفة، ويقسم إلى حق لله وحق للعبد بحسب الغالب من المصلحة، وهو عند الجمهور مفوض إلى رأي الحاكم. ولا يجوز فيه الإتلاف ولا ضرب الوجه والفرج والبطن والصدر ولا حلق اللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
  en: "Ta'zir is, in language, repelling, preventing, aiding, honouring or disciplining; in law it is a penalty not fixed by the lawgiver, due as a right of God or of a person for every wrong that has no hadd and generally no expiation. It differs from the hadd, retaliation and expiation in that the judge chooses its measure to suit the case; a hadd is averted by doubt while ta'zir is established even by doubt; a child is not liable to a hadd but may be disciplined; and some jurists hold a hadd lapses with time while ta'zir does not. It may combine with a hadd, retaliation or an expiation in known cases, and it is divided into a right of God and a right of a person, according to which interest predominates. Most jurists leave its measure to the ruler's judgement. Harm that may destroy a limb or life is forbidden, so the face, the private parts, the belly and the chest may not be struck, and the beard may not be shaved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
  ur: "تعزیر لغت میں روکنے، دفع کرنے، مدد کرنے، تعظیم کرنے اور تادیب کے معنی میں آتا ہے، اور شریعت میں وہ سزا ہے جو شرع نے مقرر نہیں کی، جو ہر ایسی معصیت پر حق اللہ یا حق بندہ کے طور پر واجب ہوتی ہے جس میں حد اور عموماً کفارہ نہ ہو۔ یہ حد، قصاص اور کفارہ سے اس طرح مختلف ہے کہ قاضی حال کے مطابق اس کی مقدار چنتا ہے، حد شبہ سے ٹل جاتی ہے جبکہ تعزیر شبہ کے ساتھ بھی ثابت ہو جاتی ہے، اور بعض فقہاء کے نزدیک حد زمانہ گزرنے سے ساقط ہو جاتی ہے جبکہ تعزیر ساقط نہیں ہوتی۔ جمہور کے نزدیک اس کی مقدار حاکم کی رائے پر چھوڑی گئی ہے، اور چہرے، شرمگاہ، پیٹ اور سینے پر مارنا اور داڑھی منڈوانا ممنوع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
