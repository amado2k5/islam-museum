summary:
  ar: "التعزير لغة الرد والمنع والنصرة والتوقير والتأديب، وشرعا عقوبة غير مقدرة في الشرع، تجب حقا لله أو للآدمي في كل معصية ليس فيها حد ولا كفارة غالبا. وهو يفترق عن الحد والقصاص والكفارة في أن القاضي يختار عقوبته بحسب الحال، وأن الحد يدرأ بالشبهة والتعزير يثبت بها، وأن الحد لا يجب على الصغير والتعزير يجوز في حقه، وأن الحد قد يسقط بالتقادم عند بعض الفقهاء والتعزير لا يسقط. ويجتمع مع الحد والقصاص والكفارة في صور معروفة، ويقسم إلى حق لله وحق للعبد بحسب الغالب من المصلحة، وهو عند الجمهور مفوض إلى رأي الحاكم. ولا يجوز فيه الإتلاف ولا ضرب الوجه والفرج والبطن والصدر ولا حلق اللحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
  en: "Ta'zir is, in language, repelling, preventing, aiding, honouring or disciplining; in law it is a penalty not fixed by the lawgiver, due as a right of God or of a person for every wrong that has no hadd and generally no expiation. It differs from the hadd, retaliation and expiation in that the judge chooses its measure to suit the case; a hadd is averted by doubt while ta'zir is established even by doubt; a child is not liable to a hadd but may be disciplined; and some jurists hold a hadd lapses with time while ta'zir does not. It may combine with a hadd, retaliation or an expiation in known cases, and it is divided into a right of God and a right of a person, according to which interest predominates. Most jurists leave its measure to the ruler's judgement. Harm that may destroy a limb or life is forbidden, so the face, the private parts, the belly and the chest may not be struck, and the beard may not be shaved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
  ur: "تعزیر لغت میں روکنے، دفع کرنے، مدد کرنے، تعظیم کرنے اور تادیب کے معنی میں آتا ہے، اور شریعت میں وہ سزا ہے جو شرع نے مقرر نہیں کی، جو ہر ایسی معصیت پر حق اللہ یا حق بندہ کے طور پر واجب ہوتی ہے جس میں حد اور عموماً کفارہ نہ ہو۔ یہ حد، قصاص اور کفارہ سے اس طرح مختلف ہے کہ قاضی حال کے مطابق اس کی مقدار چنتا ہے، حد شبہ سے ٹل جاتی ہے جبکہ تعزیر شبہ کے ساتھ بھی ثابت ہو جاتی ہے، اور بعض فقہاء کے نزدیک حد زمانہ گزرنے سے ساقط ہو جاتی ہے جبکہ تعزیر ساقط نہیں ہوتی۔ جمہور کے نزدیک اس کی مقدار حاکم کی رائے پر چھوڑی گئی ہے، اور چہرے، شرمگاہ، پیٹ اور سینے پر مارنا اور داڑھی منڈوانا ممنوع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
  es: "Ta'zir significa, en lenguaje, repeler, prevenir, ayudar, honrar o disciplinar; en derecho, es una pena no fijada por el legislador, debida como derecho divino o personal por todo agravio que no tenga hadd y, generalmente, tampoco expiación. Se diferencia del hadd, la represalia y la expiación en que el juez elige su medida según el caso; el hadd se evita por duda, mientras que el ta'zir se establece incluso en caso de duda; un menor no está sujeto a hadd, pero puede ser disciplinado; y algunos juristas sostienen que el hadd caduca con el tiempo, mientras que el ta'zir no. Puede combinarse con el hadd, la represalia o la expiación en casos conocidos, y se divide en derecho divino y derecho personal, según cuál prevalezca. La mayoría de los juristas dejan su medida al criterio del gobernante. Se prohíbe cualquier daño que pueda destruir una extremidad o la vida, por lo que no se debe golpear la cara, las partes íntimas, el vientre ni el pecho, y no se debe afeitar la barba. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5418} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5422} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5423} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5424} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
  fr: "Le ta'zir, en langage courant, signifie repousser, empêcher, aider, honorer ou discipliner; en droit, c'est une peine non fixée par le législateur, due comme un droit divin ou personnel pour tout tort sans hadd et généralement sans expiation. Il diffère du hadd, de la rétribution et de l'expiation en ce que le juge en choisit la mesure en fonction du cas; le hadd est écarté par le doute tandis que le ta'zir est établi même en cas de doute; un enfant n'est pas passible de hadd mais peut être discipliné; et certains juristes considèrent que le hadd s'éteint avec le temps, contrairement au ta'zir. Il peut se combiner avec un hadd, une rétribution ou une expiation dans certains cas connus, et il est divisé en un droit divin et un droit personnel, selon l'intérêt prédominant. La plupart des juristes laissent son application au jugement du souverain. Tout acte susceptible d'entraîner la mort ou la perte d'un membre est interdit; il est donc interdit de frapper le visage, les parties intimes, le ventre et la poitrine, et de se raser la barbe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
  tr: "Ta'zir, reddetme, önleme, destek, saygı ve disiplin dilidir. Hukuken şeriatta belirtilmemiş, genellikle hadd veya kefaret içermeyen her günahta Allah'a veya bir kişiye verilen bir cezadır. Hudud, qisas ve kafferadan farklıdır; yargıç cezasını duruma göre seçer, hudud şüpheyle önlenir ve ta'zir şüpheyle belirlenir, hudud reşit olmayanlara zorunlu değildir ve ta'zir ona karşı caizdir ve Bazı hukukçulara göre hudud süreklikle sona erebilir, ancak ta'zir kaldırılmaz. Hudud, qisa ve kaffara ile bilinen biçimlerde birleştirilir, geçerli çıkara göre Tanrı hakkı ve hizmetkâr hakkı olarak ikiye ayrılır. Çoğunluğa göre, yargıcın görüşüne bırakılır. Yüzü, özel bölgeleri, karnı, göğsü yok etmek, vurmak veya sakalı tıraş etmek yasaktır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s. 5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5422}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5426}"
  id: "Ta'zir adalah bahasa penolakan, pencegahan, dukungan, penghormatan, dan disiplin. Secara hukum, ini adalah hukuman yang tidak ditetapkan dalam Syariah, yang merupakan hak bagi Tuhan atau seseorang dalam setiap dosa yang biasanya tidak melibatkan hadd atau penebusan. Ini berbeda dengan hudud, qisas, dan kaffara karena hakim memilih hukumannya sesuai kasus, dan hudud dihindari oleh keraguan dan ta'zir ditetapkan olehnya, dan hudud tidak wajib bagi anak di bawah umur, dan ta'zir diperbolehkan terhadapnya, dan hudud tersebut dapat dibatalkan dengan ketentuan menurut beberapa ahli hukum, tetapi ta'zir tidak dicabut. Hudud ini digabungkan dengan hudud, qisas, dan kaffara dalam bentuk yang diketahui, dibagi menjadi hak bagi Tuhan dan hak bagi hamba sesuai dengan kepentingan yang berlaku. Menurut mayoritas, hudud didelegasikan kepada pendapat hakim. Tidak diperbolehkan merusak, atau memukul wajah, bagian pribadi, perut, dada, atau mencukur janggut. {cite:Fiqh-mawsua-Kuwaitiyya-noor-v3 p.5418} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5419} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5420} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5421} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5426}"
