id: concept/hudud-allah-wal-kabair
class: concept
kind: legal
label:
  ar: "حدود الله والكبائر"
  en: "The limits of God and the major sins (hudud Allah wa-l-kaba'ir)"
  ur: "حدودِ الٰہی اور کبائر"
summary:
  ar: "يوحّد هذا السجل موضوعين قرآنيين متلازمين في المتحف: «حدود الله» — الفواصل التي نصبها الله لأحكامه، ومنها العقوبات المقدرة التي سماها الفقهاء الحدود — و«الكبائر»، كبائر الذنوب والموبقات. آياته الأصل: «تلك حدود الله فلا تقربوها» و«ومن يتعد حدود الله فقد ظلم نفسه» وحد الزنا في [[passage/quran-24-2|النور 2]] وحد السرقة في [[passage/quran-5-38|المائدة 38]]، وحديث «اجتنبوا السبع الموبقات». يضمّه متصفح حدود الله والكبائر مع كل ذكر لهما في القرآن والسنة والسيرة والكتب المحصّلة."
  en: "This record unites two joined Qur'anic themes in the museum: the 'limits of God' — the boundaries God set for His rulings, among them the prescribed penalties the jurists call hudud — and the 'kaba'ir', the major sins and the destroyers of the hadith lists. Its foundation verses are «these are the limits of God, so do not approach them» and «whoever transgresses the limits of God has wronged himself», the hadd of fornication in [[passage/quran-24-2|al-Nur 2]] and the hadd of theft in [[passage/quran-5-38|al-Ma'ida 38]], and the hadith «avoid the seven destroyers». The Hudud Allah and Kaba'ir Browser gathers it with every mention across the Qur'an, the Sunnah, the seerah and the harvested books."
  ur: "یہ ریکارڈ میوزیم میں دو متلازم قرآنی موضوعات یکجا کرتا ہے: «حدودِ الٰہی» — وہ حدیں جو اللہ نے اپنے احکام کے لیے قائم کیں، جن میں وہ مقررہ سزائیں بھی ہیں جنہیں فقہاء حدود کہتے ہیں — اور «کبائر»، بڑے گناہ اور روایات کی موبقات۔ اس کی اصل آیات ہیں «یہ اللہ کی حدود ہیں تو انہیں نہ قریب جاؤ» اور «جو اللہ کی حدود سے تجاوز کرے اس نے اپنی جان پر ظلم کیا»، زنا کا حد [[passage/quran-24-2|النور 2]] میں اور سرقے کا حد [[passage/quran-5-38|المائدہ 38]] میں، اور حدیث «سات موبقات سے بچو»۔ حدودِ الٰہی اور کبائر کا براؤزر ان کا ہر ذکر قرآن، سنت، سیرت اور حاصل شدہ کتابوں میں جمع کرتا ہے۔"
