id: concept/hudud-allah-wal-kabair
class: concept
kind: legal
label:
  ar: "حدود الله والكبائر"
  en: "The limits of God and the major sins (hudud Allah wa-l-kaba'ir)"
  ur: "حدودِ الٰہی اور کبائر"
  es: "Los límites de Dios y los pecados mayores (hudud Allah wa-l-kaba'ir)"
  fr: "Les limites de Dieu et les péchés majeurs (hudud Allah wa-l-kaba'ir)"
  tr: "Tanrı'nın sınırları ve büyük günahları"
  id: "Batas dan dosa besar Tuhan"
summary:
  ar: "يوحّد هذا السجل موضوعين قرآنيين متلازمين في المتحف: «حدود الله» — الفواصل التي نصبها الله لأحكامه، ومنها العقوبات المقدرة التي سماها الفقهاء الحدود — و«الكبائر»، كبائر الذنوب والموبقات. آياته الأصل: «تلك حدود الله فلا تقربوها» و«ومن يتعد حدود الله فقد ظلم نفسه» وحد الزنا في [[passage/quran-24-2|النور 2]] وحد السرقة في [[passage/quran-5-38|المائدة 38]]، وحديث «اجتنبوا السبع الموبقات». يضمّه متصفح حدود الله والكبائر مع كل ذكر لهما في القرآن والسنة والسيرة والكتب المحصّلة."
  en: "This record unites two joined Qur'anic themes in the museum: the 'limits of God' — the boundaries God set for His rulings, among them the prescribed penalties the jurists call hudud — and the 'kaba'ir', the major sins and the destroyers of the hadith lists. Its foundation verses are «these are the limits of God, so do not approach them» and «whoever transgresses the limits of God has wronged himself», the hadd of fornication in [[passage/quran-24-2|al-Nur 2]] and the hadd of theft in [[passage/quran-5-38|al-Ma'ida 38]], and the hadith «avoid the seven destroyers». The Hudud Allah and Kaba'ir Browser gathers it with every mention across the Qur'an, the Sunnah, the seerah and the harvested books."
  ur: "یہ ریکارڈ میوزیم میں دو متلازم قرآنی موضوعات یکجا کرتا ہے: «حدودِ الٰہی» — وہ حدیں جو اللہ نے اپنے احکام کے لیے قائم کیں، جن میں وہ مقررہ سزائیں بھی ہیں جنہیں فقہاء حدود کہتے ہیں — اور «کبائر»، بڑے گناہ اور روایات کی موبقات۔ اس کی اصل آیات ہیں «یہ اللہ کی حدود ہیں تو انہیں نہ قریب جاؤ» اور «جو اللہ کی حدود سے تجاوز کرے اس نے اپنی جان پر ظلم کیا»، زنا کا حد [[passage/quran-24-2|النور 2]] میں اور سرقے کا حد [[passage/quran-5-38|المائدہ 38]] میں، اور حدیث «سات موبقات سے بچو»۔ حدودِ الٰہی اور کبائر کا براؤزر ان کا ہر ذکر قرآن، سنت، سیرت اور حاصل شدہ کتابوں میں جمع کرتا ہے۔"
  es: "Este registro unifica dos temas coránicos interrelacionados en el museo: los «límites de Dios» —los límites que Dios estableció para Sus preceptos, entre ellos las penas prescritas que los juristas denominan hudud— y los «kaba'ir», los pecados mayores y los destructores de las listas de hadices. Sus versículos fundamentales son «estos son los límites de Dios, así que no os acerquéis a ellos» y «quien transgrede los límites de Dios se perjudica a sí mismo», el hadd de la fornicación en [[passage/quran-24-2|al-Nur 2]] y el hadd del robo en [[passage/quran-5-38|al-Ma'ida 38]], y el hadiz «evitad los siete destructores». El Navegador Hudud Allah y Kaba'ir lo recopila con cada mención a lo largo del Corán, la Sunnah, la sirah y los libros recopilados."
  fr: "Ce document réunit deux thèmes coraniques indissociables au sein du musée: les « limites de Dieu » – les frontières que Dieu a fixées pour Ses jugements, parmi lesquelles les peines prescrites que les juristes appellent hudud – et le « kaba'ir », les péchés majeurs et les éléments destructeurs mentionnés dans les hadiths. Ses versets fondateurs sont: « Voici les limites de Dieu, ne les approchez pas » et « Quiconque transgresse les limites de Dieu se fait du tort à lui-même », le hadd de la fornication dans [[passage/quran-24-2|al-Nur 2]] et le hadd du vol dans [[passage/quran-5-38|al-Ma'ida 38]], ainsi que le hadith « Évitez les sept éléments destructeurs ». Le Navigateur Hudud Allah et Kaba'ir rassemble toutes les mentions de ce document dans le Coran, la Sunna, la sira et les recueils de hadiths."
  tr: "Bu kayıt, müzedeki iki birbiriyle ilişkili Kur'an konusunu birleştirir: \"Allah'ın Sınırları\" — Allah'ın hükümleri için belirlediği kırılmalar, hukukçuların hudud (ceza) olarak adlandırdığı önceden belirlenmiş cezalar da dahil — ve \"büyük günahlar\", büyük günahlar ve korkunç eylemler. Orijinal ayetleri şunlardır: \"Bunlar Allah'ın koyduğu sınırlardır, bu yüzden onlara yaklaşmayın,\" \"Ve kim Allah'ın koyduğu sınırları aşarsa, kendine haksızlık etmiş olur,\" [[pasaj/kuran-24-2|An-Nur 2]]]'deki zina cezası, [[pasaj/kuran-5-38|El-Medence 38]]]'deki hırsızlık cezası ve \"Yedi yıkıcı eylemden kaçının\" hadisi vardır. Tarayıcı, Kur'an, Sünnet, biyografi ve derlenmiş kitaplarda Allah'ın sınırlarını ve büyük günahlarını her kez anarak içerir."
  id: "Catatan ini menyatukan dua topik Al-Qur'an yang saling terkait di museum: \"Batas Tuhan\" — pelanggaran yang ditetapkan Tuhan untuk keputusan-Nya, termasuk hukuman yang telah ditentukan yang disebut para ahli hukum sebagai hudud (hukuman) — dan \"dosa besar,\" dosa besar dan perbuatan mengerikan. Ayat-ayat aslinya adalah: \"Inilah batasan yang ditetapkan oleh Tuhan, jadi jangan mendekatinya,\" \"Dan siapa pun yang melanggar batas yang ditetapkan Allah telah berbuat salah pada dirinya sendiri,\" hukuman perselingkuhan dalam [[ayat/al-quran-24-2|An-Nur 2]], hukuman pencurian dalam [[ayat/al-quran-5-38|Al-Ma'idah 38]], dan hadis \"Hindari tujuh perbuatan merusak.\" Browser mencantumkan batasan dan dosa besar Tuhan dengan setiap penyebutannya dalam Al-Qur'an, Sunnah, biografi, dan buku-buku yang dikumpulkan."
