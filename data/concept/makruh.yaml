id: concept/makruh
class: concept
kind: legal
label: { ar: "المَكْرُوه", en: "The disliked (makruh)", ur: "مکروہ" }
summary:
  ar: "المكروه في اللغة ضد المحبوب، وما نفرت منه الطباع والشرع. وعرّفه الأصوليون بأنه مطلوب الترك مع عدم الذم على فعله، وهو يضاد الواجب والمندوب، ويفارق الحرام بعدم الذم. وتعددت إطلاقاته عند الأصوليين، وقسمه الحنفية إلى مكروه كراهة تنزيه ومكروه كراهة تحريم، وعند محمد بن الحسن كراهة التحريم حرام ثبت بدليل ظني. والتفصيل في مسائل الحكم في الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14935}"
  en: "The disliked (makruh) is, in the lexicon, the opposite of the beloved, and what the nature and the law reject. The usul scholars define it as what is sought to be left without blame for doing it. It is opposed to the obligatory and to the recommended, and differs from the forbidden in that doing it is not blamed. The word has several senses in usul. The Hanafis split it into disliked as reprehensible (tanzih), which is closer to permitted, and disliked as near prohibition (tahrim), which is closer to forbidden; Muhammad ibn al-Hasan holds that a near-prohibition founded on a probable text is forbidden. The usul appendix has the discussion of its ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14935}"
  ur: "مکروہ وہ عمل ہے جس کا ترک مطلوب ہو مگر کرنے پر ملامت نہ ہو۔ حنفیہ اسے کراہتِ تنزیہی اور کراہتِ تحریمی میں تقسیم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14935}"
