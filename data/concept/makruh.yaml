id: concept/makruh
class: concept
kind: legal
label: { ar: "المَكْرُوه", en: "The disliked (makruh)", ur: "مکروہ", es: "Lo que no gusta (makruh)", fr: "Les détestés (makruh)" }
summary:
  ar: "المكروه في اللغة ضد المحبوب، وما نفرت منه الطباع والشرع. وعرّفه الأصوليون بأنه مطلوب الترك مع عدم الذم على فعله، وهو يضاد الواجب والمندوب، ويفارق الحرام بعدم الذم. وتعددت إطلاقاته عند الأصوليين، وقسمه الحنفية إلى مكروه كراهة تنزيه ومكروه كراهة تحريم، وعند محمد بن الحسن كراهة التحريم حرام ثبت بدليل ظني. والتفصيل في مسائل الحكم في الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14935}"
  en: "The disliked (makruh) is, in the lexicon, the opposite of the beloved, and what the nature and the law reject. The usul scholars define it as what is sought to be left without blame for doing it. It is opposed to the obligatory and to the recommended, and differs from the forbidden in that doing it is not blamed. The word has several senses in usul. The Hanafis split it into disliked as reprehensible (tanzih), which is closer to permitted, and disliked as near prohibition (tahrim), which is closer to forbidden; Muhammad ibn al-Hasan holds that a near-prohibition founded on a probable text is forbidden. The usul appendix has the discussion of its ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14935}"
  ur: "مکروہ وہ عمل ہے جس کا ترک مطلوب ہو مگر کرنے پر ملامت نہ ہو۔ حنفیہ اسے کراہتِ تنزیہی اور کراہتِ تحریمی میں تقسیم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14935}"
  es: "Lo desaconsejable (makruh) es, en el léxico, lo opuesto a lo amado, y lo que la naturaleza y la ley rechazan. Los eruditos del usul lo definen como aquello que se busca evitar la culpa por realizarlo. Se opone a lo obligatorio y a lo recomendado, y se diferencia de lo prohibido en que su realización no conlleva culpa. La palabra tiene varios significados en el usul. Los hanafíes la dividen en desaconsejable como reprobable (tanzih), que se acerca a lo permitido, y desaconsejable como casi prohibido (tahrim), que se acerca a lo prohibido; Muhammad ibn al-Hasan sostiene que una prohibición casi prohibida basada en un texto probable está prohibida. El apéndice del usul contiene la discusión de su dictamen. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14934} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14935}"
  fr: "Le terme « détesté » (makruh) désigne, dans le lexique, l’opposé du « aimé », ce que la nature et la loi rejettent. Les savants de l’usul le définissent comme ce que l’on cherche à accomplir sans blâmer. Il s’oppose à l’obligatoire et au recommandé, et diffère de l’interdit en ce que son accomplissement n’est pas blâmé. Ce mot possède plusieurs sens en usul. Les hanafites le distinguent en deux catégories: le « détesté comme répréhensible » (tanzih), plus proche de la permission, et le « détesté comme quasi-interdit » (tahrim), plus proche de l’interdiction. Muhammad ibn al-Hasan considère qu’une quasi-interdiction fondée sur un texte probable est interdite. L’annexe relative à l’usul traite de cette question. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14935}"
