id: concept/dal-al-lisan
class: concept
kind: scientific
label:
  ar: دلع اللسان
  en: Protrusion of the tongue
  ur: زبان کا باہر لٹکنا
  es: "Protrusión de la lengua"
  fr: "Protrusion de la langue"
  tr: "Dili bozmak"
  id: "Merusak lidah"
summary:
  ar: قد يكون دلع اللسان لأورامه العظيمة وقد يكون عند الخوانيق فتدلع الطبيعة أو الإرادة اللسان ليتسع مجرى التنفس {cite:canon-ibn-sina-print-v2 p.261}
  en: 'The tongue''s protrusion may be from its great tumours, and may be at the suffocations, nature or the will thrusting the tongue out so that the breathing passage may widen {cite:canon-ibn-sina-print-v2 p.261}'
  ur: 'زبان کا باہر لٹکنا اس کے بڑے ورموں کی وجہ سے ہو سکتا ہے اور دم گھٹنے کی حالتوں میں بھی، جب طبیعت یا ارادہ زبان کو باہر دھکیل دیتا ہے تاکہ سانس کی راہ کھل جائے {cite:canon-ibn-sina-print-v2 p.261}'
  es: "La protrusión de la lengua puede deberse a grandes tumores, y puede ser causada por asfixia, por la naturaleza o por la voluntad, que empuja la lengua hacia afuera para ensanchar las vías respiratorias {cite:canon-ibn-sina-print-v2 p.261}"
  fr: "La protrusion de la langue peut être due à de grosses tumeurs, et peut être due à des suffocations, la nature ou la volonté poussant la langue vers l'extérieur afin d'élargir les voies respiratoires {cite:canon-ibn-sina-print-v2 p.261}"
  tr: "Dilin şımartılması, büyük tümörlerinden kaynaklanabilir ya da doğanın dili şımartarak hava yolunu genişlettiği kasık bölgelerinde olabilir {cite:canon-ibn-sina-print-v2 s.261}"
  id: "Perawatan lidah mungkin disebabkan oleh tumor besarnya, atau mungkin di bagian selangkangan, di mana alam atau akan memanjakan lidah untuk melebarkan saluran napas {cite:canon-ibn-sina-print-v2 hlm.261}"
