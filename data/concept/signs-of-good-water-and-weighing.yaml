id: concept/signs-of-good-water-and-weighing
class: concept
kind: scientific
label: { ar: "علامات الماء الجيد ووزن الماء عند ابن سينا", en: "The signs of good water and the weighing of water in the Canon", ur: "قانون میں اچھے پانی کی علامات اور پانی کا وزن", es: "Los signos de agua buena y el pesaje del agua en el Canon", fr: "Les signes d'une eau de bonne qualité et la pesée de l'eau dans le Canon" }
summary:
  ar: "يذكر ابن سينا أن الماء الجيد عذب يخيل أنه حلو، لا يحتمل الخمر إلا قليلاً إذا مزج به، خفيف الوزن سريع التبرد والتسخن لتخلخله، بارد في الشتاء حار في الصيف، لا يغلب عليه طعم ولا رائحة، سريع الانحدار من الشراسيف، سريع نضج ما يطبخ فيه {cite:canon-ibn-sina-print-v1 p.135}."
  en: "Ibn Sina says good water is sweet to the taste so that it seems sugary, takes little wine when mixed with it, is light in weight, cools and warms quickly because of its looseness, is cold in winter and warm in summer, is dominated by no taste or smell, passes quickly down from the lower ribs, and quickly cooks what is cooked in it {cite:canon-ibn-sina-print-v1 p.135}."
  es: "Ibn Sina dice que el agua buena es dulce al gusto, de modo que parece azucarada, necesita poco vino cuando se mezcla con ella, es ligera, se enfría y se calienta rápidamente debido a su fluidez, es fría en invierno y cálida en verano, no tiene sabor ni olor predominantes, pasa rápidamente por las costillas inferiores y cocina rápidamente lo que se cocina en ella {cite:canon-ibn-sina-print-v1 p.135}."
  fr: "Ibn Sina dit que la bonne eau est douce au goût, au point d'être sucrée, qu'elle absorbe peu de vin lorsqu'on la mélange, qu'elle est légère, qu'elle refroidit et se réchauffe rapidement grâce à sa fluidité, qu'elle est froide en hiver et chaude en été, qu'elle n'a ni goût ni odeur prédominants, qu'elle descend rapidement dans les côtes inférieures et qu'elle cuit rapidement ce qui y est cuit {cite:canon-ibn-sina-print-v1 p.135}."
  ur: "ابن سینا کا کہنا ہے کہ اچھا پانی ذائقہ میں میٹھا ہوتا ہے کہ یہ شکر دار معلوم ہوتا ہے، تھوڑی سی شراب پیتی ہے جب اس میں ملایا جائے تو وزن میں ہلکا ہوتا ہے، ڈھیلے پن کی وجہ سے ٹھنڈا اور جلد گرم ہوتا ہے، سردیوں میں ٹھنڈا اور گرمیوں میں گرم ہوتا ہے، اس میں ذائقہ یا بو کا غلبہ نہیں ہوتا، نچلی پسلیوں سے جلدی سے گزر جاتا ہے، اور جو کچھ اس میں پکایا جاتا ہے اسے جلدی پکاتا ہے۔ صفحہ 135}۔"
