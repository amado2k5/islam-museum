summary:
  ar: "يذكر ابن سينا أن الماء الجيد عذب يخيل أنه حلو، لا يحتمل الخمر إلا قليلاً إذا مزج به، خفيف الوزن سريع التبرد والتسخن لتخلخله، بارد في الشتاء حار في الصيف، لا يغلب عليه طعم ولا رائحة، سريع الانحدار من الشراسيف، سريع نضج ما يطبخ فيه {cite:canon-ibn-sina-print-v1 p.135}."
  en: "Ibn Sina says good water is sweet to the taste so that it seems sugary, takes little wine when mixed with it, is light in weight, cools and warms quickly because of its looseness, is cold in winter and warm in summer, is dominated by no taste or smell, passes quickly down from the lower ribs, and quickly cooks what is cooked in it {cite:canon-ibn-sina-print-v1 p.135}."
