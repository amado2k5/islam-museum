id: concept/kitman-al-haqq
class: concept
kind: ethical
label:
  ar: "كتمان الحق وتحريف البيان"
  en: "Concealing the truth for a price"
summary:
  ar: "يرى الشعراوي أن كتمان ما أنزل الله من البينات لأجل ثمن قليل يورث الخسارة، وأن العاقبة نار وحرمان من كلام الله وتزكيته، وأن الكاتم يتحمل وزر من أضلهم، وأن كتمان الحق يحتاج إلى جهد. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.721}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.722}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.723}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.725}"
  en: "Sha'rawi holds that concealing what God sent down in clear signs for a small price is a loss, that its end is the Fire and deprivation of God's speech and purification, that the concealer bears the burden of those he misled, and that concealment of the truth takes effort {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.721}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.722}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.723}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.725}."
wings: [ideas]
themes: [creed, ethics-and-character]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "ما معنى كتمان الحق بثمن، وما معنى أن الله لا يكلم الكاتمين يوم القيامة؟"
  en: "What is it to conceal the truth for a price, and what does it mean that God does not speak to the concealers on the Day of Judgement?"
perspectives:
  - tradition: sunni
    id: sharawi-concealment
    stance:
      ar: "الكتمان بثمن خسارة، وعقوبته من جنس فعله، ونفي كلام الله عنهم نفي للأنس والرحمة"
      en: "Concealing for a price is a loss; its penalty is of the same kind as the act; God's not speaking to them denies intimacy and mercy"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن الثمن القليل قد يكون رشوة أو عطاء من الأتباع، وأن الكاتم يضل غيره فيتحمل أوزاراً فوق أوزار، وأن كلام الله المنفي هو كلام الأنس والرحمة، وأن الكلام في الآية إخبار بأن الله لا يزكيهم، ويذكر حديث الثلاثة الذين لا يكلمهم الله في الهامش إلى مسلم. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.722}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.723}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.725}"
      en: "Sha'rawi says the small price may be a bribe or a gift from followers; the concealer misleads others and bears their burden on top of his own; God's negated speech is the speech of intimacy and mercy; and he cites in a footnote the hadith of three whom God will not address, attributed to Muslim {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.722}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.723}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.725}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-other-readings
    stance:
      ar: "أقوال المفسرين في معنى الكتمان ونوعه لم تُدخل في هذه الدفعة"
      en: "Other exegetes' readings of the kinds of concealment are not entered in this batch"
    holders: []
    summary:
      ar: "لم تُدخل هنا أقوال غيره في كتمان العلم بالنسبة للعلماء، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.722}"
      en: "Other readings of concealment of knowledge by scholars, the academic view and other views are not entered here {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.722}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
