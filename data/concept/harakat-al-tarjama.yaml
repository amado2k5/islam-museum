id: concept/harakat-al-tarjama
class: concept
kind: term
label: { ar: "حركة الترجمة", en: "The Abbasid Translation Movement", es: "El movimiento de traducción abasí", fr: "Le mouvement de traduction abbasside", ur: "عباسی ترجمہ تحریک", tr: "Çeviri Hareketi", id: "Gerakan Terjemahan" }
summary:
  ar: "ساق ابن النديم سبب كثرة كتب الفلسفة والعلوم القديمة في بلاد الإسلام: أن المأمون رأى في منامه رجلا أبيض اللون مشربا حمرة واسع الجبهة مقرون الحاجب أجلح الرأس أشهل العينين جالسا على سريره فسأله ما الحسن فقال أرسطاطاليس ما حسن في العقل ثم ما حسن في الشرع ثم ما حسن عند الجمهور ثم لا ثم، وقال له من نصحك في الذهب فليكن عندك كالذهب وعليك بالتوحيد، فكان هذا المنام من أوكد الأسباب في إخراج الكتب فكتب المأمون إلى ملك الروم يسأله الإذن في إنفاذ ما اختار من العلوم القديمة المخزونة ببلد الروم فأجاب بعد امتناع وأخرج المأمون جماعة منهم الحجاج بن مطر وابن البطريق وسلما صاحب بيت الحكمة فأخذوا ما وجدوا ونقلوه، وعني بنو شاكر المنجم بإخراج الكتب من بلد الروم بجهد وأنفذوا حنين بن إسحاق وغيره فجاؤهم بطرائف الكتب وغرائب المصنفات، وقال أبو سليمان المنطقي إن بني المنجم كانوا يرزقون جماعة من النقلة منهم حنين بن إسحاق وحبيش بن الحسن وثابت بن قرة في الشهر نحو خمسمائة دينار للنقل والملازمة {cite:fihrist-ibn-al-nadim p. 339-340}."
  en: "Ma'mun's dream of Aristotle — what is good: what reason deems good, then law, then the many — and the organized translation effort with 500-dinar monthly translator stipends {cite:fihrist-ibn-al-nadim p. 339-340}."
  es: "El sueño de Ma'mun sobre Aristóteles —qué es bueno: lo que la razón considera bueno, luego la ley, luego la multitud— y el esfuerzo organizado de traducción con estipendios mensuales de 500 dinares para los traductores {cite:fihrist-ibn-al-nadim p. 339-340}."
  fr: "Le rêve de Ma'mun d'Aristote — ce qui est bon: ce que la raison juge bon, puis la loi, puis le plus grand nombre — et l'effort de traduction organisé avec des allocations mensuelles de traducteurs de 500 dinars {cite:fihrist-ibn-al-nadim p. 339-340}."
  ur: "مامون کا ارسطو کا خواب — کیا اچھا ہے: کیا وجہ اچھی لگتی ہے، پھر قانون، پھر بہت سے — اور 500 دینار ماہانہ مترجم کے وظیفے کے ساتھ منظم ترجمہ کی کوشش {حوالہ: فہرست ابن الندیم صفحہ۔ 339-340}۔"
  tr: "İbn el-Nadim, İslam topraklarında felsefe ve eski bilimler üzerine kitapların bolluğunun sebebini gösterdi: El-Me'mun rüyasında, yatağında oturan, geniş kırmızı tenli, geniş alınlı, kaşlı, solgun bir başlı ve en parlak gözlü açık tenli bir adam gördü. Ona neyin iyi olduğunu sordu. Aristoteles şöyle cevap verdi: \"Akılda iyi olan o zaman hukukta iyi, sonra çoğunlukta iyi, sonra çoğunlukta iyi, sonra çoğunlukta iyi, sonra artık yok.\" Ona dedi ki, \"Altın hakkında sana tavsiye veren kimse, onun senin için altın gibi olsun ve tek tanrıcılığa bağlı kalsın.\" Bu hayal, kitap üretmek için en güvenilir nedenlerden biriydi Al-Ma'mun, Bizans Kralı'na yazarak seçtiği eski bilimleri Romalıların topraklarında uygulamak için izin istedi. Kral reddetti ve Al-Ma'mun, bulduklarını alıp aktaran Al-Hacı ibn Matar, İbn Al-Batriq ve Bilgelik Evi'nin sahibi Salma'nın da bulunduğu bir grup gönderdi. Banu Şakir el-Munajm, Bizans topraklarından kitaplar çıkarmak için çok çalıştı ve Hunayn ibn İshaq ile diğerlerini gerçekleştirerek onlara kitap anekdotları ve nadir eserler getirdiler. Ebu Süleyman el-Manqiqi, Banu al-Munajm'ın Hunayn ibn İshaq ve Habish ibn'in de dahil olduğu bir grup Neqla için öngördüğünü söyledi El-Hasan ve Tebit bin Kurra, taşıma ve eşlik için ayda yaklaşık beş yüz dinar alıyordu {atıf:Fihrist-ibn-al-Nadim s. 339-340}."
  id: "Ibn al-Nadim mengutip alasan banyaknya buku filsafat dan ilmu kuno di tanah Islam: Al-Ma'mun melihat dalam mimpinya seorang pria berkulit cerah dengan kulit merah lebar, dahi lebar, alis, kepala pucat, dan mata paling cerah, duduk di tempat tidurnya. Ia bertanya apa yang baik. Aristoteles menjawab, \"Apa yang baik dalam akal, lalu apa yang baik dalam hukum, lalu apa yang baik di mayoritas, lalu apa yang baik di mayoritas, lalu tidak lagi.\" Ia berkata kepadanya, \"Siapa pun yang memberi nasihat tentang emas, biarlah seperti emas bagimu dan berpegang pada monoteisme.\" Mimpi ini adalah salah satu alasan paling dapat diandalkan untuk menghasilkan buku Al-Ma'mun menulis kepada Raja Bizantium, meminta izin untuk menerapkan ilmu kuno yang dipilihnya yang disimpan di tanah Romawi. Ia menolak, dan Al-Ma'mun mengirim sekelompok orang termasuk Al-Hajjaj ibn Matar, Ibn Al-Batriq, dan Salma, pemilik Rumah Kebijaksanaan, yang mengambil apa yang mereka temukan dan meneruskannya. Banu Shakir al-Munajm bekerja keras untuk mengekstrak buku-buku dari tanah Bizantium, dan mereka melaksanakan Hunayn ibn Ishaq dan lainnya, membawa anekdot buku dan karya langka. Abu Sulayman al-Manqiqi mengatakan bahwa Banu al-Munajm menyediakan untuk sekelompok Naqla, termasuk Hunayn ibn Ishaq dan Habish ibn Al-Hasan dan Thabit ibn Qurra menerima sekitar lima ratus dinar per bulan untuk transportasi dan pendampingan {cite:fihrist-ibn-al-nadim hlm. 339-340}."
