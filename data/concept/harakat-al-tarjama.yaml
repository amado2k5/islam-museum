label: { ar: "حركة الترجمة", en: "The Abbasid Translation Movement" }
summary:
  ar: "ساق ابن النديم سبب كثرة كتب الفلسفة والعلوم القديمة في بلاد الإسلام: أن المأمون رأى في منامه رجلا أبيض اللون مشربا حمرة واسع الجبهة مقرون الحاجب أجلح الرأس أشهل العينين جالسا على سريره فسأله ما الحسن فقال أرسطاطاليس ما حسن في العقل ثم ما حسن في الشرع ثم ما حسن عند الجمهور ثم لا ثم، وقال له من نصحك في الذهب فليكن عندك كالذهب وعليك بالتوحيد، فكان هذا المنام من أوكد الأسباب في إخراج الكتب فكتب المأمون إلى ملك الروم يسأله الإذن في إنفاذ ما اختار من العلوم القديمة المخزونة ببلد الروم فأجاب بعد امتناع وأخرج المأمون جماعة منهم الحجاج بن مطر وابن البطريق وسلما صاحب بيت الحكمة فأخذوا ما وجدوا ونقلوه، وعني بنو شاكر المنجم بإخراج الكتب من بلد الروم بجهد وأنفذوا حنين بن إسحاق وغيره فجاؤهم بطرائف الكتب وغرائب المصنفات، وقال أبو سليمان المنطقي إن بني المنجم كانوا يرزقون جماعة من النقلة منهم حنين بن إسحاق وحبيش بن الحسن وثابت بن قرة في الشهر نحو خمسمائة دينار للنقل والملازمة {cite:fihrist-ibn-al-nadim p. 339-340}."
  en: "Ma'mun's dream of Aristotle — what is good: what reason deems good, then law, then the many — and the organized translation effort with 500-dinar monthly translator stipends {cite:fihrist-ibn-al-nadim p. 339-340}."
sources: [source/fihrist-ibn-al-nadim]
