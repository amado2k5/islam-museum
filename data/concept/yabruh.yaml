summary:
  ar: "أصل اللفاح البري الذي يشبه صورة الإنسان، مخدِّر منوِّم خطر يصفه الكتاب بأوصاف الأدوية المسكنة، ويعالج الكتاب تسممه بالعسل والسمن والتقيؤ."
  en: "Mandrake, the root of the wild mandrake plant, shaped like a human figure. The book describes it as narcotic and sleep-inducing and dangerous, and gives honey, ghee and vomiting as its treatment in poisoning."
  ur: "منڈریک، جنگلی پودے کی جڑ جو انسانی صورت جیسی ہوتی ہے۔ کتاب اسے سکون آور، نیند لانے والی اور خطرناک بتاتی ہے، اور زہر کی صورت میں شہد، گھی اور قے کو علاج بتاتی ہے۔"
  es: "La mandrágora, la raíz de la planta silvestre de mandrágora, tiene forma de figura humana. El libro la describe como narcótica, somnífera y peligrosa, y propone miel, ghee y vómitos como tratamiento en caso de intoxicación."
  fr: "La mandragore, racine de la plante sauvage, a une forme qui rappelle celle d'une silhouette humaine. Le livre la décrit comme narcotique, soporifique et dangereuse, et préconise, en cas d'empoisonnement, l'utilisation de miel, de ghee et de vomissements."
  tr: "İnsan suretini andıran yabani adamotu, tehlikeli bir uyuşturucu ve uyku vericidir. Kitapta, ağrı kesici ilaçların açıklamalarıyla birlikte anlatılır ve zehirlenmesinin bal, tereyağı ve kusma ile tedavi edileceği belirtilir."
  id: "Mandrake liar, yang bentuknya menyerupai manusia, adalah narkotika dan obat penenang yang berbahaya. Buku ini menggambarkannya dengan uraian tentang obat-obatan pereda nyeri, dan buku ini mengobati keracunannya dengan madu, ghee, dan muntah."
