id: concept/nafkh
class: concept
kind: legal
label: { ar: "النَّفْخ", en: "Nafkh (blowing)", ur: "نفخ (پھونکنا)" }
summary:
  ar: "النفخ في اللغة إخراج الريح، يقال نفخ في البوق إذا بعث فيه الريح ليحدث صوتاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15852} وجمهور الفقهاء على كراهة النفخ في الطعام والشراب، وأباح أبو يوسف النفخ ما لم يكن له صوت، ويرى المرداوي أنه لا كراهة عند الحاجة إلى الأكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15853} والنفخ عمداً في الصلاة مبطل في الجملة، وفي تفصيل ذلك اختلاف بين الحنفية والمالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15854} والجنين إذا نفخ فيه الروح يعد إنساناً في الإرث والغرة وتحريم الإجهاض، والنفخ في الصور مما يجب الإيمان به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15854} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855}"
  en: "Nafkh, in the lexicon, is sending out air; one blows into a horn to make it sound. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15852} Most jurists dislike blowing into food and drink; Abu Yusuf allows it unless it makes a sound, and al-Mardawi sees no dislike when eating needs it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15853} Blowing on purpose during prayer invalidates it in general, and the schools differ on the details. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15854} From the moment the spirit is breathed into it, the foetus counts as a person for inheritance and for the ghurra compensation, and abortion is forbidden. The blast of the trumpet is a matter of belief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15854} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855}"
  ur: "نفخ لغت میں ہوا نکالنے کو کہتے ہیں، جیسے بوق میں پھونک مار کر آواز پیدا کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15852} جمہور کے نزدیک کھانے اور پینے میں پھونک مارنا مکروہ ہے، جبکہ ابو یوسف کے نزدیک جب تک آواز نہ ہو مکروہ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15852} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15853} نماز میں جان بوجھ کر پھونک مارنا عام طور پر نماز کو باطل کرتا ہے، اور تفصیل میں مذاہب کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15853} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15854} روح پھونکے جانے کے بعد جنین انسان شمار ہوتا ہے، اور صور میں پھونکے جانے پر ایمان واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15854} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15855}"
