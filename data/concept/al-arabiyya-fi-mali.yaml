label:
  ar: "العربية في مالي"
  en: "Arabic in Mali"
  ur: "مالی میں عربی"
  fr: "l'arabe au Mali"
  es: "el árabe en Malí"
  tr: "Mali'de Arapça"
  id: "Bahasa Arab di Mali"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في مالي: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. وفي مالي يظهر الحسانية لغةً وطنية معترفاً بها، ويُقدَّم تعداد 2022 بأرقامه كما وردت. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Mali: its legal status, the varieties spoken and the official figures, each as the summary gives it. In Mali the summary presents Hassaniya as a recognised national language, and the 2022 census counts are given as they appear. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ مالی میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ مالی میں خلاصہ حسانیہ کو تسلیم شدہ قومی زبان کے طور پر پیش کرتا ہے، اور 2022 کی مردم شماری کے اعداد جیسے آئے ویسے دیے گئے ہیں۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe au Mali : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. Au Mali, le résumé présente le hassaniya comme langue nationale reconnue, et les chiffres du recensement de 2022 sont donnés tels qu'ils figurent. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Malí: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. En Malí el resumen presenta el hasaniyya como lengua nacional reconocida, y las cifras del censo de 2022 se dan tal como figuran. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
  tr: "Bu sayfa, müzenin sağladığı bir araştırma özetinin Mali'deki Arapça hakkında söylediklerini sunmaktadır: yasal statüsü, konuşulan çeşitleri ve alınan resmi numaralar. Mali'de Hassaniya tanınan bir ulusal dildir ve 2022 nüfus sayımında alınan numaralar sunulmaktadır. Müze, özet olarak adlandırdığı sayfaları açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi kullanımına izin vermiştir. Özet, resmi bir kaynak veya numara bulunmadığını belirttiği için, sayfa kelimesi kelimesine böyle yazmaktadır ve müze kendi kaynağından bir numara içermemektedir."
  id: "Halaman ini menyajikan apa yang dikatakan ringkasan penelitian yang disediakan museum tentang bahasa Arab di Mali: status hukumnya, variasi yang digunakan, dan angka resmi yang diperoleh. Hassaniya diakui sebagai bahasa nasional di Mali, dan angka yang diperoleh dalam sensus 2022 disajikan. Museum tidak membuka halaman yang disebut ringkasan, dan pendiri mengizinkan penggunaannya seperti yang dinyatakan pada 21 November 2026. Karena ringkasan menyatakan tidak ada sumber atau angka resmi, maka ditulis kata demi kata, dan museum tidak menyertakan nomor dari sumbernya sendiri."
