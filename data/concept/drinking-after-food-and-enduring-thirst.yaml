label: { ar: "الشرب بعد الطعام والصبر على العطش", en: "Drinking after food and enduring thirst", ur: "کھانے کے بعد پینا اور پیاس پر صبر" }
summary:
  ar: "يقول ابن سينا إنه لا يشرب على الطعام ماء كثير يفرق بينه وبين المعدة ويطفئه، بل يتربص المرء بالشرب مدة نزوله عن المعدة ويستدل بخفة أعالي البطن، فإن أحوجه العطش مص ماء بارداً يسيراً، وإن الصبر على العطش والنوم عليه نافع للمبرودين المرطوبين ضار للمحرورين الممرورين، وكذلك الصبر على الجوع {cite:canon-ibn-sina-print-v1 pp.231-232}."
  en: "Ibn Sina says much water should not be drunk over food, since it parts it from the stomach and quenches it; one waits until the food has gone down, judged by lightness in the upper belly, and sips a little cold water if thirst presses; enduring thirst and sleeping on it helps the cold and moist and harms the hot and bilious, and so does enduring hunger {cite:canon-ibn-sina-print-v1 pp.231-232}."
