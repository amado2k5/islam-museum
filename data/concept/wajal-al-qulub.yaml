id: concept/wajal-al-qulub
class: concept
kind: doctrine
label: { ar: "وجل القلوب عند ذكر الله", en: "The heart's trembling at the remembrance of God (wajal)", es: "El corazón tiembla al recordar a Dios (wajal)", fr: "Le cœur tremble au souvenir de Dieu (wajal)" }
issue:
  ar: "هل يكون وجل القلب عند ذكر الله خوفاً من الوعيد وحده، أم يكون أيضاً إجلالاً ومهابة؟"
summary:
  ar: "يشرح رضا قوله تعالى في سورة الأنفال «إنما المؤمنون الذين إذا ذكر الله وجلت قلوبهم» بأن الوجل استشعار الخوف، وأنه قد يكون من العاقبة المجهولة، وقد يكون من الإجلال والمهابة. ويرى أن من خص الذكر بالوعيد غفل عن ذلك، ولا تعارض بين آية الأنفال وآية الرعد عنده، لأن في الوعد والوعيد وصفات الكمال اطمئناناً للقلوب."
  en: "Rida glosses wajal in the Anfal verse as a felt apprehension of the heart, which may come from fear of an unknown end or from awe and majesty. He argues that whoever restricts the remembrance to threat misses this, and sees no contradiction with the Ra'd verse that hearts find rest in remembrance of God, since promise, threat and God's attributes all bring the heart to rest."
  es: "Rida interpreta wajal en el versículo de Anfal como una aprensión sentida en el corazón, que puede provenir del temor a un fin desconocido o de la reverencia y la majestad. Argumenta que quien restringe el recuerdo a la amenaza pasa por alto este significado, y no ve contradicción alguna con el versículo de Ra'd que afirma que los corazones hallan descanso en el recuerdo de Dios, ya que la promesa, la amenaza y los atributos divinos brindan sosiego al corazón."
  fr: "Rida interprète le terme « wajal » du verset d'Anfal comme une appréhension profonde du cœur, pouvant provenir de la crainte d'une fin inconnue ou de l'admiration et de la majesté divines. Il soutient que quiconque réduit ce souvenir à la seule menace passe à côté de cette dimension et ne voit aucune contradiction avec le verset de Ra'd affirmant que le cœur trouve la paix dans le souvenir de Dieu, puisque la promesse, la menace et les attributs divins apaisent tous le cœur."
