id: concept/wajal-al-qulub
class: concept
kind: doctrine
label: { ar: "وجل القلوب عند ذكر الله", en: "The heart's trembling at the remembrance of God (wajal)" }
issue:
  ar: "هل يكون وجل القلب عند ذكر الله خوفاً من الوعيد وحده، أم يكون أيضاً إجلالاً ومهابة؟"
summary:
  ar: "يشرح رضا قوله تعالى في سورة الأنفال «إنما المؤمنون الذين إذا ذكر الله وجلت قلوبهم» بأن الوجل استشعار الخوف، وأنه قد يكون من العاقبة المجهولة، وقد يكون من الإجلال والمهابة. ويرى أن من خص الذكر بالوعيد غفل عن ذلك، ولا تعارض بين آية الأنفال وآية الرعد عنده، لأن في الوعد والوعيد وصفات الكمال اطمئناناً للقلوب."
  en: "Rida glosses wajal in the Anfal verse as a felt apprehension of the heart, which may come from fear of an unknown end or from awe and majesty. He argues that whoever restricts the remembrance to threat misses this, and sees no contradiction with the Ra'd verse that hearts find rest in remembrance of God, since promise, threat and God's attributes all bring the heart to rest."
