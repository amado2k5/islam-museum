tags: [arabiyya-browser, arabiyya-sciences]
label:
  ar: "علوم اللسان العربي عند ابن خلدون"
  en: "The sciences of the Arabic tongue according to Ibn Khaldun"
  ur: "ابن خلدون کے نزدیک عربی زبان کے علوم"
  fr: "Les sciences de la langue arabe selon Ibn Khaldun"
  es: "Las ciencias de la lengua árabe según Ibn Jaldún"
  tr: "İbn Haldun'a Göre Arapça Dil Bilimleri"
  id: "Ilmu Bahasa Arab Menurut Ibn Khaldun"
summary:
  ar: "يحصر ابن خلدون في المقدمة علوم اللسان العربي في أربعة أركان هي اللغة والنحو والبيان والأدب، ويرى معرفتها ضرورية لأهل الشريعة لأن الكتاب والسنة بلغة العرب، ويقدّم النحو لأن به يُعرف الفاعل من المفعول والمبتدأ من الخبر. ثم يروي نشأة النحو لما فسدت مَلَكة العرب بمخالطة الأعاجم، وأول من كتب فيه أبو الأسود الدؤلي، ثم الخليل وسيبويه، ويذكر الكتب المتأخرة."
  en: "In the Muqaddima Ibn Khaldun limits the sciences of the Arabic tongue to four pillars, lexicon, grammar, rhetoric and literature, and holds them necessary for the people of the Shari'a because the Book and the Sunna are in Arabic. He puts grammar first because by it the agent is known from the object. He then tells how grammar arose when the Arabs' faculty was corrupted by mixing with non-Arabs: Abu al-Aswad al-Du'ali first wrote on it, then al-Khalil and Sibawayh."
  ur: "ابن خلدون المقدمہ میں عربی زبان کے علوم کو چار ارکان میں محدود کرتے ہیں، یعنی لغت، نحو، بیان اور ادب، اور انہیں اہل شریعت کے لیے ضروری سمجھتے ہیں کیونکہ کتاب و سنت عربی میں ہیں۔ وہ نحو کو مقدم رکھتے ہیں کیونکہ اس سے فاعل مفعول سے پہچانا جاتا ہے۔ پھر بتاتے ہیں کہ نحو کیسے وجود میں آیا جب عجمیوں سے میل جول سے عربوں کا ملکہ بگڑا: پہلے ابو الاسود دؤلی نے لکھا، پھر خلیل اور سیبویہ نے۔"
  fr: "Dans la Muqaddima, Ibn Khaldun limite les sciences de la langue arabe à quatre piliers, le lexique, la grammaire, la rhétorique et la littérature, et les tient pour nécessaires aux gens de la Loi parce que le Livre et la Sunna sont en arabe. Il place la grammaire en tête parce que par elle on reconnaît l'agent de l'objet. Il raconte ensuite comment elle est née quand la faculté des Arabes fut altérée par le contact des non-Arabes : Abu al-Aswad al-Du'ali écrivit le premier, puis al-Khalil et Sibawayh."
  es: "En la Muqaddima, Ibn Jaldún limita las ciencias de la lengua árabe a cuatro pilares, léxico, gramática, retórica y literatura, y las tiene por necesarias para la gente de la Ley porque el Libro y la Sunna están en árabe. Pone la gramática primero porque por ella se conoce el agente del objeto. Cuenta luego cómo nació cuando la facultad de los árabes se alteró al mezclarse con los no árabes: Abu al-Aswad al-Du'ali escribió primero, luego al-Khalil y Sibawayh."
  tr: "İbn Haldun, önsözde Arapça bilim bilimlerini dört sütunla sınırlar: dil, dilbilgisi, hitabet ve edebiyat. Kur'an ve Sünnet Arapça olduğu için şeriat halkı için bu bilimi önemli bulur ve dilbilgisini önceliklendirir çünkü özneyi nesneden, özneyi ise önlemden ayırır. Daha sonra, Arapların etkisinin Arap olmayanların karışımıyla bozulduğu dilbilgisinin kökenini anlatır. İlk yazanlar Ebu el-Esvad el-Du'ali, ardından el-Halil ve Sibavey'dir ve sonraki kitaplardan bahseder."
  id: "Ibn Khaldun membatasi ilmu bahasa Arab dalam kata pengantar menjadi empat pilar: bahasa, tata bahasa, retorika, dan sastra. Ia menganggap pengetahuan tentang ilmu tersebut sangat penting bagi masyarakat Syariah karena Al-Qur'an dan Sunnah berada dalam bahasa Arab, dan ia memprioritaskan tata bahasa karena membedakan subjek dari objek dan subjek dari predikat. Ia kemudian menceritakan asal-usul tata bahasa ketika pengaruh orang Arab terganggu oleh pencampuran orang non-Arab. Yang pertama menulis tentang hal ini adalah Abu al-Aswad al-Du'ali, kemudian al-Khalil dan Sibawayh, dan ia menyebutkan buku-buku berikutnya."
