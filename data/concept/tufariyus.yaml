label:
  ar: "طوفريوس"
  en: "Tufariyus (the spleen herb)"
  ur: "طوفریوس ⁦(تلی کی جڑی بوٹی)⁩"
  es: "Tufariyus (la hierba del bazo)"
  fr: "Tufariyus (l'herbe de la rate)"
  tr: "Tofreus"
  id: "Tofreus"
summary:
  ar: "عشبة كثيرة القضبان دقيقة الورق، تحلل أورام الطحال تحليلاً شديداً، ويفيد ضمادها بالخل وحده من نهش الهوام."
  en: "A herb with many rod-like stems and thin leaves, which the book says strongly dissolves swellings of the spleen; a vinegar poultice helps venomous bites."
  ur: "ایک جڑی بوٹی جس کے بہت سے سیدھے تنے اور باریک پتے ہیں؛ کتاب کے مطابق یہ تلی کی سوجن کو زور سے تحلیل کرتی ہے، اور سرکے کا ضماد زہریلے کیڑوں کے کاٹنے میں فائدہ دیتا ہے۔"
  es: "Una hierba con muchos tallos en forma de varilla y hojas delgadas, que según el libro disuelve eficazmente las inflamaciones del bazo; una cataplasma de vinagre ayuda a aliviar las picaduras venenosas."
  fr: "Une plante aux nombreuses tiges en forme de bâtonnets et aux feuilles fines, qui, selon le livre, dissout efficacement les gonflements de la rate; un cataplasme de vinaigre soulage les morsures venimeuses."
  tr: "İnce yapraklı, çok çubuklu bir bitki olup dalak tümörlerini ciddi şekilde bozar ve sadece sirkeyle bandajı cüzzam ısırığını önlemeye yardımcı olur."
  id: "Tanaman berdaun halus dengan banyak batang yang sangat menguraikan tumor limpa, dan hanya dengan perban cuka saja membantu mencegah gigitan kusta."
