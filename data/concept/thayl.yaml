summary:
  ar: "ثيل في الكتاب نبات معروف له أغصان ذات عقد تسعى على وجه الأرض وتضرب منها عروق في الأرض، طعمها حلو، وأوراقها عراض حادة الأطراف، تعتلفه البقر والدواب، وينقل عن ديسقوريدوس أنواعا أخرى منه، بارد يابس في الأولى، قابض فيه لذع، عصارته تمنع تحلب المواد، ينفع من الجراحات الرديئة الطرية ويدمل ويمنع النوازل، ويقطع بزره وأصله القيء ويفتت الحصى {cite:canon-ibn-sina-print-v1 p.697}"
  en: "Thayl is in the book a known plant with knotted branches creeping on the ground, from which roots strike into the earth, sweet in taste, with broad leaves sharp at the tips, and cattle and beasts graze it; the book quotes from Dioscorides further kinds of it; cold and dry in the first degree, astringent with a sting, its juice prevents the flowing of matter; it benefits bad fresh wounds and heals them, prevents catarrhs, its seed and root cut vomiting, and break up stones {cite:canon-ibn-sina-print-v1 p.697}"
  ur: "ثیل کتاب میں ایک معروف نبات ہے جس کی گرہ دار شاخیں زمین پر رینگتی ہیں اور ان سے جڑیں زمین میں اترتی ہیں، ذائقہ میٹھا ہے، پتے چوڑے اور نوک دار ہیں، اور گائے اور چوپائے اسے چرتے ہیں؛ کتاب دیسقوریدوس سے اس کی دوسری قسمیں نقل کرتی ہے؛ پہلے درجے میں سرد خشک، قابض اور چبھن والا ہے، اس کا رس مادوں کے رسنے کو روکتا ہے؛ تازہ بُرے زخموں میں نافع ہے اور انہیں بھرتا ہے، نزلات روکتا ہے، اس کا بیج اور جڑ قے کو کاٹتے ہیں اور پتھری توڑتے ہیں {cite:canon-ibn-sina-print-v1 p.697}۔"
  es: "En el libro se menciona que Thayl es una planta conocida, con ramas nudosas que se arrastran por el suelo, de la cual brotan raíces que penetran en la tierra; es de sabor dulce, con hojas anchas y puntiagudas en las puntas, y sirve de alimento para el ganado y las bestias. El libro cita a Dioscórides y menciona otras variedades; es fría y seca en primer grado, astringente y con un ligero picor, y su jugo previene el flujo de materia; beneficia las heridas recientes y las cura, previene los catarros, y su semilla y raíz reducen el vómito y disuelven los cálculos. {cite:canon-ibn-sina-print-v1 p.697}"
  fr: "Le livre décrit le thayl comme une plante connue, aux branches noueuses rampantes, d'où partent des racines profondes, au goût sucré, aux larges feuilles pointues à l'extrémité, et dont le bétail et les bêtes se nourrissent. Le livre cite Dioscoride et donne d'autres descriptions: froid et sec au premier degré, astringent et urticant, son suc empêche l'écoulement des matières; il est bénéfique aux plaies fraîches et infectées et les guérit, prévient les catarrhes, ses graines et ses racines soulagent les vomissements et dissolvent les calculs rénaux. {cite:canon-ibn-sina-print-v1 p.697}"
