  en: "Tasliib (crucifixion as a punishment, and the cross as an object)"
  ur: "تصلیب (صلیب پر لٹکانا، اور صلیب کے احکام)"
summary:
  ar: "التصليب الصلب قتلة معروفة، والصليب الخشبة أو صورتها. الصلب في الأصل منهي عنه لما فيه من التعذيب والمثلة، ويستثنى منه قطاع الطريق بنص الآية، فيُقتلون ثم يُصلبون عند الشافعية والحنابلة، أو يُصلبون أحياء ثم يُقتلون عند أبي حنيفة ومالك والأوزاعي، والمدة ثلاثة أيام عند أبي حنيفة والشافعي. وصناعة الصليب واتخاذه وبيعه وعمله حرام على المسلم، ويكره الصليب في الثوب، ويكره أن يكون في قبلة المصلي، ولا يُقطع في سرقة الصليب عند الحنفية والحنابلة، ولا ضمان في إتلافه على المسلم، ويُمنع أهل الذمة من إظهاره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5250} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5255}"
  en: "Tasliib is the known form of execution by crucifixion, and the cross is the wooden post or its image. Crucifixion as such is forbidden for its torture and mutilation; the exception is highway robbers, by the text of the Qur'an, who are killed and then crucified according to al-Shafii and Ahmad, or crucified alive and then killed according to Abu Hanifa, Malik and al-Awza'i; the period is three days for Abu Hanifa and al-Shafii. For a Muslim, making, owning, selling or working on a cross is forbidden; a cross on a garment is disliked; a cross on the qibla wall of a worshipper is disliked; theft of a cross is not punished by amputation for the Hanafis and Hanbalis; destroying a Muslim's cross carries no liability; and the protected people may not display their crosses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5250} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5255}"
