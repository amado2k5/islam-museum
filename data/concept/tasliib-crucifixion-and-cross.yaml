id: concept/tasliib-crucifixion-and-cross
class: concept
kind: legal
label:
  ar: "التصليب"
  en: "Tasliib (crucifixion as a punishment, and the cross as an object)"
  ur: "تصلیب ⁦(صلیب پر لٹکانا، اور صلیب کے احکام)⁩"
  es: "Tasliib (la crucifixión como castigo y la cruz como objeto)"
  fr: "Tasliib (la crucifixion comme châtiment et la croix comme objet)"
summary:
  ar: "التصليب الصلب قتلة معروفة، والصليب الخشبة أو صورتها. الصلب في الأصل منهي عنه لما فيه من التعذيب والمثلة، ويستثنى منه قطاع الطريق بنص الآية، فيُقتلون ثم يُصلبون عند الشافعية والحنابلة، أو يُصلبون أحياء ثم يُقتلون عند أبي حنيفة ومالك والأوزاعي، والمدة ثلاثة أيام عند أبي حنيفة والشافعي. وصناعة الصليب واتخاذه وبيعه وعمله حرام على المسلم، ويكره الصليب في الثوب، ويكره أن يكون في قبلة المصلي، ولا يُقطع في سرقة الصليب عند الحنفية والحنابلة، ولا ضمان في إتلافه على المسلم، ويُمنع أهل الذمة من إظهاره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5250} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5255}"
  en: "Tasliib is the known form of execution by crucifixion, and the cross is the wooden post or its image. Crucifixion as such is forbidden for its torture and mutilation; the exception is highway robbers, by the text of the Qur'an, who are killed and then crucified according to al-Shafii and Ahmad, or crucified alive and then killed according to Abu Hanifa, Malik and al-Awza'i; the period is three days for Abu Hanifa and al-Shafii. For a Muslim, making, owning, selling or working on a cross is forbidden; a cross on a garment is disliked; a cross on the qibla wall of a worshipper is disliked; theft of a cross is not punished by amputation for the Hanafis and Hanbalis; destroying a Muslim's cross carries no liability; and the protected people may not display their crosses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5250} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5254} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5255}"
  es: "El tasliib es la forma conocida de ejecución por crucifixión, y la cruz es el poste de madera o su imagen. La crucifixión como tal está prohibida por su tortura y mutilación; la excepción son los bandidos de caminos, según el texto del Corán, que son asesinados y luego crucificados según al-Shafii y Ahmad, o crucificados vivos y luego asesinados según Abu Hanifa, Malik y al-Awza'i; el período es de tres días para Abu Hanifa y al-Shafii. Para un musulmán, está prohibido hacer, poseer, vender o trabajar en una cruz; una cruz en una prenda de vestir es desaconsejable; una cruz en el muro de la qibla de un creyente es desaconsejable; el robo de una cruz no se castiga con la amputación para los hanafíes y hanbalíes; destruir la cruz de un musulmán no conlleva responsabilidad; y las personas protegidas no pueden exhibir sus cruces. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5248} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5249} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5250} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5251} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5252} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5253} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5254} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5255}"
  fr: "Le tasliib est la forme connue d'exécution par crucifixion, la croix étant le poteau de bois ou son image. La crucifixion en tant que telle est interdite en raison de la torture et des mutilations qu'elle implique. L'exception concerne les brigands de grand chemin, qui, selon le texte du Coran, sont tués puis crucifiés (selon al-Shafi'i et Ahmad), ou crucifiés vivants puis tués (selon Abu Hanifa, Malik et al-Awza'i). La durée de l'exécution est de trois jours selon Abu Hanifa et al-Shafi'i. Il est interdit à un musulman de fabriquer, posséder, vendre ou travailler sur une croix. Le port d'une croix sur un vêtement est déconseillé, de même que la présence d'une croix sur le mur de la qibla d'un fidèle. Le vol d'une croix n'est pas puni d'amputation chez les hanafites et les hanbalites. La destruction de la croix d'un musulman n'entraîne aucune sanction. Enfin, les personnes protégées ne peuvent pas exhiber leurs croix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5250} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5251} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5252} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5253} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5254} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.5255}"
