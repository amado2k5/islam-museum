label:
  ar: "حربة"
  en: "Hurba (the spear-shaped seed)"
  ur: "حربہ ⁦(نیزے کی شکل کا بیج)⁩"
  es: "Hurba (la semilla con forma de lanza)"
summary:
  ar: "حربة بزر ثلاثيّ الزوايا كالرمح، وورقه ثلاثيّ شبيه بورق نبات آخر. حرارة البستاني قليلة، والبري في الثانية. طريّه يدمل الجراحات، وقشره بالخل ينفع الطحال، ويذكر الكتاب أن ورقه يدرّ، وهذا تقرير مُعلَّم."
  en: "Hurba is a seed with three corners like a spear, and a three-cornered leaf like that of another plant. The garden kind is weakly hot, the wild kind is hot in the second degree. Its fresh herb heals wounds, its husk with vinegar helps the spleen, and the book says its leaf promotes flow, a labelled listing."
  ur: "حربہ کا بیج نیزے کی طرح تین کونوں والا ہوتا ہے، اور اس کا پتا تین کونوں والا ہے جو ایک اور پودے کے پتے جیسا ہے۔ باغی قسم کی گرمی کم ہے اور جنگلی قسم دوسرے درجے میں گرم ہے۔ تازہ جڑی بوٹی زخم بھرتی ہے، اس کا چھلکا سرکے کے ساتھ تلی کو فائدہ دیتا ہے، اور کتاب کہتی ہے کہ اس کا پتا بہاؤ پیدا کرتا ہے؛ یہ نشان زدہ بیان ہے۔"
  es: "La hurba es una semilla triangular con forma de lanza y una hoja triangular similar a la de otra planta. La variedad cultivada es ligeramente picante, mientras que la silvestre es de grado dos. Su hierba fresca cura heridas, su cáscara con vinagre beneficia el bazo y, según el libro, su hoja favorece la circulación, una característica que se menciona en la lista."
