id: concept/istiwa-ala-al-arsh
class: concept
kind: doctrine
sensitivity: contested
label:
  ar: "الاستواء على العرش"
  en: "Istiwa (God's rising over the Throne)"
  ur: "استواء علی العرش"
summary:
  ar: "يرى الشعراوي أن الاستواء المنسوب إلى الله لا يُفهم بالمعنى البشري، لأن صفات الله ليست كصفات المخلوقين، وأن ما يُقال عنه تُنزَّه صفة الله عن المماثلة وتُقر الآية كما هي {cite:tafsir-sharawi-khawatir-scan p.233}."
  en: "Sha'rawi holds that istiwa attributed to God is not to be understood in the human sense, because God's attributes are not like those of creatures. He asks that the verse be affirmed while God is declared free of likeness {cite:tafsir-sharawi-khawatir-scan p.233}."
  ur: "شعراوی کے نزدیک اللہ کی طرف منسوب استواء کو انسانی معنی میں نہیں سمجھنا چاہیے، کیونکہ اللہ کی صفات مخلوق جیسی نہیں۔ آیت کو اس کے حال پر مانا جائے اور اللہ کو مشابہت سے پاک رکھا جائے {cite:tafsir-sharawi-khawatir-scan p.233}۔"
wings: [ideas]
themes: [creed]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "كيف تُفهم صفة الاستواء المنسوبة إلى الله دون تشبيه أو تعطيل؟"
  en: "How is the attribute of istiwa ascribed to God to be understood without likening God to creatures?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "تُفهم الصفة دون المعنى البشري، والله ليس كمثله شيء في صفاته"
      en: "The attribute is not taken in the human sense; God is not like anything in His attributes"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الملوك يستوون على عروشهم والإنسان يستوي على كرسيه، ثم يقرر أن استواء الله ليس كذلك، مستدلا بأن حياته وعلمه وقدرته ليست كحياة الإنسان وعلمه وقدرته، ويدعو إلى ألا يُفهم الاستواء بالمفهوم البشري {cite:tafsir-sharawi-khawatir-scan p.233}."
      en: "Sha'rawi notes that kings sit on their thrones and a person sits on his chair, then holds that God's istiwa is not like that. He argues from God's life, knowledge and power, which are not like human life, knowledge and power, and asks that istiwa not be read in the human sense {cite:tafsir-sharawi-khawatir-scan p.233}."
    sources: [source/tafsir-sharawi-khawatir-scan]
