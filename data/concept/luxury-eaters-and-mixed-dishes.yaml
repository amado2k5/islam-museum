label: { ar: "المترفه والخلط بين الأطعمة المختلفة", en: "Luxury eaters and mixed dishes", ur: "پرتعیش کھانے والے اور ملی جلی غذائیں" }
summary:
  ar: "يقول ابن سينا إن من كان متكثراً من اللحوم مترفهاً فليتعهد الفصد، وإن مال إلى برد المزاج فعليه بالجوارشنات والإطريفلات، وإن شر الأشياء جمع أغذية مختلفة معاً وتطويل مدة الأكل، وإن أوفق الغذاء ألذه إذا كان صالح الجوهر والأعضاء الرئيسية سالمة، ومن مضار اللذيذ جداً الاستكثار منه {cite:canon-ibn-sina-print-v1 p.230}."
  en: "Ibn Sina says one who eats much meat in luxury should look to bloodletting, and if the temperament leans cold, to the digestive compounds called jawarishnat and itrifalat; the worst thing is to gather different foods at once and to prolong the meal; the most suitable food is the most pleasant when its substance is sound and the principal organs are healthy, and a harm of very pleasant food is eating too much of it {cite:canon-ibn-sina-print-v1 p.230}."
