id: concept/luxury-eaters-and-mixed-dishes
class: concept
kind: scientific
label: { ar: "المترفه والخلط بين الأطعمة المختلفة", en: "Luxury eaters and mixed dishes", ur: "پرتعیش کھانے والے اور ملی جلی غذائیں", es: "Comedores de lujo y platos variados", fr: "mangeurs de luxe et plats mixtes" }
summary:
  ar: "يقول ابن سينا إن من كان متكثراً من اللحوم مترفهاً فليتعهد الفصد، وإن مال إلى برد المزاج فعليه بالجوارشنات والإطريفلات، وإن شر الأشياء جمع أغذية مختلفة معاً وتطويل مدة الأكل، وإن أوفق الغذاء ألذه إذا كان صالح الجوهر والأعضاء الرئيسية سالمة، ومن مضار اللذيذ جداً الاستكثار منه {cite:canon-ibn-sina-print-v1 p.230}."
  en: "Ibn Sina says one who eats much meat in luxury should look to bloodletting, and if the temperament leans cold, to the digestive compounds called jawarishnat and itrifalat; the worst thing is to gather different foods at once and to prolong the meal; the most suitable food is the most pleasant when its substance is sound and the principal organs are healthy, and a harm of very pleasant food is eating too much of it {cite:canon-ibn-sina-print-v1 p.230}."
  es: "Ibn Sina dice que quien come mucha carne con abundancia debería recurrir a la sangría, y si el temperamento tiende al frío, a los compuestos digestivos llamados jawarishnat e itrifalat; lo peor es reunir diferentes alimentos a la vez y prolongar la comida; el alimento más adecuado es el más agradable cuando su sustancia es sana y los órganos principales están sanos, y un daño de un alimento muy agradable es comer demasiado de él {cite:canon-ibn-sina-print-v1 p.230}."
  fr: "Ibn Sina dit que celui qui mange beaucoup de viande par luxe devrait se tourner vers la saignée, et si son tempérament est froid, vers les composés digestifs appelés jawarishnat et itrifalat; le pire est de rassembler différents aliments à la fois et de prolonger le repas; la nourriture la plus appropriée est la plus agréable lorsque sa substance est saine et que les principaux organes sont sains, et un inconvénient des aliments très agréables est d'en manger trop {cite:canon-ibn-sina-print-v1 p.230}."
  ur: "ابن سینا کا کہنا ہے کہ جو شخص عیش و عشرت میں زیادہ گوشت کھاتا ہے اسے خون بہنے کی طرف دیکھنا چاہئے اور اگر مزاج سرد ہو تو ہاضمہ کے مرکبات کی طرف دیکھے جنہیں جوارشنات اور اعطرافلات کہتے ہیں۔ سب سے بری چیز مختلف کھانے کو ایک ساتھ جمع کرنا اور کھانے کو طول دینا ہے۔ سب سے موزوں کھانا وہ ہے جب اس کا مادہ درست ہو اور بنیادی اعضاء صحت مند ہوں، اور بہت ہی لذیذ کھانے کا نقصان اس کا بہت زیادہ کھانا ہے۔"
