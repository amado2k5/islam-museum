id: concept/malaikat-munfarij
class: concept
kind: angel
label:
  ar: ملائكة قصة المائة نفس
  en: The Angels of the Hundred-Souls Story
  ur: ساؤ جانوں کی کہانی کے فرشتے
summary:
  ar: 'ملكان نزلا على رجل قتل مئة نفس فسأل أحدهما صاحبه: أتدعه وقد تاب وأقلع؟ فقال الآخر: لا أدعه وقد قتل مئة نفس... وفي رواية إنهما اختلفا حتى نزل الوحي إلى النبي في شأنه؛ والقصة في صحيح البخاري.'
  en: Two angels descended on a man who had killed a hundred souls; one asked the other whether to leave him since he had repented, and the other said he would not leave him for the hundred souls — in one narration God revealed the matter to the Prophet; the story is in Sahih al-Bukhari.
  ur: دو فرشتے اس شخص پر اترے جس نے سو جانیں kill کی تھیں؛ ایک نے دوسرے سے پوچھا کہ کیا اسے چھوڑ دو کہ اس نے توبہ کر لی، دوسرے نے کہا نہیں چھوڑوں گا سو جانوں کے سبب سے — ایک روایت میں اللہ نے اس معاملے کو نبی پر وحی کی؛ یہ کہانی صحیح بخاری میں ہے۔
