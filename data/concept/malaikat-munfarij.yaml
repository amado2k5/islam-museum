id: concept/malaikat-munfarij
class: concept
kind: angel
label:
  ar: ملائكة قصة المائة نفس
  en: The Angels of the Hundred-Souls Story
  ur: ساؤ جانوں کی کہانی کے فرشتے
  es: "La historia de los ángeles de las cien almas"
  fr: "L'histoire des anges aux cent âmes"
  tr: "Melekler, yüz ruhun hikayesi"
  id: "Malaikat, kisah seratus jiwa"
summary:
  ar: 'ملكان نزلا على رجل قتل مئة نفس فسأل أحدهما صاحبه: أتدعه وقد تاب وأقلع؟ فقال الآخر: لا أدعه وقد قتل مئة نفس... وفي رواية إنهما اختلفا حتى نزل الوحي إلى النبي في شأنه؛ والقصة في صحيح البخاري.'
  en: Two angels descended on a man who had killed a hundred souls; one asked the other whether to leave him since he had repented, and the other said he would not leave him for the hundred souls — in one narration God revealed the matter to the Prophet; the story is in Sahih al-Bukhari.
  ur: دو فرشتے اس شخص پر اترے جس نے سو جانیں kill کی تھیں؛ ایک نے دوسرے سے پوچھا کہ کیا اسے چھوڑ دو کہ اس نے توبہ کر لی، دوسرے نے کہا نہیں چھوڑوں گا سو جانوں کے سبب سے — ایک روایت میں اللہ نے اس معاملے کو نبی پر وحی کی؛ یہ کہانی صحیح بخاری میں ہے۔
  es: "Dos ángeles descendieron sobre un hombre que había matado a cien personas; uno le preguntó al otro si debía dejarlo en paz ya que se había arrepentido, y el otro dijo que no lo dejaría por las cien personas. En una narración, Dios le reveló el asunto al Profeta; la historia se encuentra en Sahih al-Bukhari."
  fr: "Deux anges descendirent sur un homme qui avait tué cent personnes; l'un demanda à l'autre s'il devait le laisser partir puisqu'il s'était repenti, et l'autre répondit qu'il ne le laisserait pas à cause des cent âmes — selon un récit, Dieu révéla cette affaire au Prophète; cette histoire se trouve dans Sahih al-Bukhari."
  tr: "İki kral, yüz ruhu öldüren bir adamın üzerine indi. Biri arkadaşına sordu: Tövbe edip gittikten sonra onu bırakacak mısın? Diğeri dedi ki: Yüz ruhu öldürdüğünde onu bırakma... Başka bir rivayette, Peygamber'e onun hakkında vahiy gelene kadar anlaşmazlık yaşadılar; hikaye Sahih al-Buhari'de geçer."
  id: "Dua raja menyerang seorang pria yang membunuh seratus jiwa. Satu bertanya pada sahabatnya: Apakah engkau akan meninggalkannya setelah dia bertobat dan pergi? Yang lain berkata: Jangan tinggalkan dia ketika dia telah membunuh seratus jiwa... Dalam riwayat lain, mereka tidak sepakat sampai wahyu datang kepada Nabi tentang dirinya; ceritanya ada dalam Sahih al-Bukhari."
