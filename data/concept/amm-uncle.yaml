label:
  ar: "العَمّ"
  en: "The paternal uncle ('amm) in inheritance, guardianship and custody"
  ur: "عم (چچا)"
summary:
  ar: "العم في اللغة أخو الأب، والجمع أعمام وعمومة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11841}. وفي الميراث ينفرد العم الشقيق إذا كان أقرب من العم لأب، فإذا انفرد أخذ المال كله بالتعصيب، وإذا كان معه صاحب فرض أخذ الباقي، ويحجبه الأب والجد والأخ وابن الأخ وإن نزل، وأما العم لأم فمن ذوي الأرحام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11842}. وفي الجنازة اختلف الفقهاء في ترتيبه بحسب مذاهبهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11842}. وفي ولاية النكاح يأتي ترتيب العم بعد الأب والجد والأخ وابن الأخ، وذهب جمهور الفقهاء إلى أن له حق إجبار موليته في النكاح، وذهب الحنفية إلى أن إجبار الكبيرة لا يكون للعم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11842} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11843}. وفي الحضانة يلي العم بحسب ترتيب الإرث، ويقدم العم الشقيق على العم لأب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11843}."
  en: "'Amm, the paternal uncle, is the father's brother, and the plural is a'mam or 'umumah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11841}. In inheritance the full-blood paternal uncle takes precedence over the half-blood one; when alone he takes the whole estate as agnate, and when there is a sharer he takes what remains; the father, grandfather, brothers and sons of brothers block him, while the maternal uncle is among the distant kin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11841} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11842}. The jurists differ on the order of the uncle in washing and praying over the dead {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11842}. In marriage guardianship his place follows the father, grandfather, brothers and nephews by school; the majority hold he may compel his ward to marry, while the Hanafis deny compulsion of an adult woman {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11842} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11843}. In custody he is ranked by inheritance, and the full-blood uncle precedes the half-blood one {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11843}."
