id: concept/marahil-al-janin
class: concept
kind: term
label:
  ar: مراحل الجنين
  en: The stages of the embryo
  ur: جنین کے مراحل
  es: "Las etapas del embrión"
  fr: "Les stades de l'embryon"
  tr: "Fetal evreler"
  id: "Tahap janin"
summary:
  ar: "خلق الله الإنسان في الرحم على مراحل: نطفة ثم علقة ثم مضغة مخلقة وغير مخلقة، ثم عظامًا تُكسى لحمًا ثم أنشأه خلقًا آخر — تبارك الله أحسن الخالقين."
  en: "God forms the human in the womb in stages: a drop, then a clinging clot, then a lump shaped and unshaped, then bones clothed in flesh, then brought forth as another creation — blessed is God, the best of creators."
  ur: "اللہ نے انسان کو رحم میں مراحل میں بنایا: قطرہ، لوتھڑا، گوشت کا ٹکڑا ڈھلا اور غیر ڈھلا، پھر ہڈیاں جن پر گوشت چڑھایا، پھر اسے نئی تخلیق بنا دیا — اللہ سب سے اچھا خالق ہے۔"
  es: "Dios forma al ser humano en el vientre materno por etapas: una gota, luego un coágulo adherido, luego un bulto con forma y sin forma, luego huesos revestidos de carne, luego dado a luz como otra creación; bendito sea Dios, el mejor de los creadores."
  fr: "Dieu façonne l'être humain dans le ventre de sa mère par étapes: une goutte, puis un caillot qui s'accroche, puis une masse informe et malléable, puis des os revêtus de chair, puis il naît comme une autre création — béni soit Dieu, le meilleur des créateurs."
  tr: "Tanrı insanı rahminde aşamalı olarak yarattı: önce sperm, sonra bir pıhtı, sonra şekillenmemiş bir embriyo, sonra etle kaplı kemikler, sonra onu başka bir yaratılışa dönüştürdü — kutsanmış olsun, en iyi yaratıcı."
  id: "Tuhan menciptakan manusia dalam kandungan secara bertahap: sperma, lalu gumpalan, kemudian embrio yang terbentuk dan belum terbentuk, kemudian tulang yang dilapisi daging, lalu Dia menciptakannya menjadi ciptaan lain — terpujilah Allah, pencipta terbaik."
