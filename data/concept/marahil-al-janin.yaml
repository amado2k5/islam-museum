label:
  ar: مراحل الجنين
  en: The stages of the embryo
  ur: جنین کے مراحل
summary:
  ar: "خلق الله الإنسان في الرحم على مراحل: نطفة ثم علقة ثم مضغة مخلقة وغير مخلقة، ثم عظامًا تُكسى لحمًا ثم أنشأه خلقًا آخر — تبارك الله أحسن الخالقين."
  en: "God forms the human in the womb in stages: a drop, then a clinging clot, then a lump shaped and unshaped, then bones clothed in flesh, then brought forth as another creation — blessed is God, the best of creators."
  ur: "اللہ نے انسان کو رحم میں مراحل میں بنایا: قطرہ، لوتھڑا، گوشت کا ٹکڑا ڈھلا اور غیر ڈھلا، پھر ہڈیاں جن پر گوشت چڑھایا، پھر اسے نئی تخلیق بنا دیا — اللہ سب سے اچھا خالق ہے۔"
