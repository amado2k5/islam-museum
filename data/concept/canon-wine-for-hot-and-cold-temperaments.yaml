label: { ar: "الشراب للأمزجة الحارة والباردة عند ابن سينا", en: "Wine for hot and cold temperaments in the Canon", ur: "گرم اور سرد مزاجوں کے لیے شراب قانون میں", es: "Vinos para temperamentos cálidos y fríos en el Canon", fr: "Vins pour les tempéraments chauds et froids dans le Canon" }
summary:
  ar: "ينقل ابن سينا في صنف الشراب أن الأبيض الرقيق أوفق للمحرورين، وأن الغليظ الحلو أوفق لمن يريد السمن والقوة مع الحذر من تسديده، وأن العتيق الأحمر أوفق لصاحب المزاج البارد البلغمي {cite:canon-ibn-sina-print-v1 p.237}."
  en: "Ibn Sina sets out which kind of wine suits which temperament: the thin white for the hot-tempered, the thick sweet for one who wants fat and strength, with care over its blocking, and the old red for the cold, phlegmatic temperament {cite:canon-ibn-sina-print-v1 p.237}."
  es: "Ibn Sina expone qué tipo de vino se adapta a cada temperamento: el blanco ligero para el temperamento fogoso, el dulce espeso para quien busca grasa y fuerza, con cuidado en su fermentación, y el tinto añejo para el temperamento frío y flemático {cite:canon-ibn-sina-print-v1 p.237}."
  fr: "Ibn Sina décrit quel type de vin convient à quel tempérament: le blanc léger pour les personnes au tempérament chaud, le vin doux et épais pour celui qui veut du gras et de la force, avec une attention particulière à son obstruction, et le vieux rouge pour le tempérament froid et flegmatique {cite:canon-ibn-sina-print-v1 p.237}."
  ur: "ابن سینا بتاتا ہے کہ کس قسم کی شراب کس مزاج کے لیے موزوں ہے: گرم مزاج کے لیے پتلی سفید، موٹی میٹھی جو چربی اور طاقت کے خواہاں ہے، اس کی روک تھام کا خیال رکھتے ہوئے، اور سرد، بلغمی مزاج کے لیے پرانی سرخ۔"
