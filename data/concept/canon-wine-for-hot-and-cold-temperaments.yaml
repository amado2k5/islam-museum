summary:
  ar: "ينقل ابن سينا في صنف الشراب أن الأبيض الرقيق أوفق للمحرورين، وأن الغليظ الحلو أوفق لمن يريد السمن والقوة مع الحذر من تسديده، وأن العتيق الأحمر أوفق لصاحب المزاج البارد البلغمي {cite:canon-ibn-sina-print-v1 p.237}."
  en: "Ibn Sina sets out which kind of wine suits which temperament: the thin white for the hot-tempered, the thick sweet for one who wants fat and strength, with care over its blocking, and the old red for the cold, phlegmatic temperament {cite:canon-ibn-sina-print-v1 p.237}."
