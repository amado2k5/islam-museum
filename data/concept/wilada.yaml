label:
  ar: "الولادة"
  en: "Childbirth"
  ur: "ولادت"
summary:
  ar: "الولادة في مآخذ الإسلام آية وكلفة معا: تلد الأم فتسجد تحت النخلة كما ولدت مريم، ويحتفى بالمولود بالأذان في أذنه والتحنيك والعقيقة والسمي، وللنفساء عدة ورخص، وتثبت بالولادة أحكام النسب والميراث والعدة."
  en: "Childbirth in Islam's sources is at once a sign and a hardship: the mother delivers as Mary delivered beneath the palm tree, the newborn is welcomed with the adhan in his ear, the tahnik, the aqiqa and the naming, the woman in confinement has her term and her exemptions, and delivery establishes the rulings of lineage, inheritance and the waiting period."
  ur: "اسلام کے مآخذ میں ولادت ایک نشانی اور مشقت دونوں ہے: ماں جنتی ہے جیسے مریم نے کھجور کے درخت تلے جنہا، نوزائیدہ کے کان میں اذان، تحنیک، عقیقہ اور نام رکھنے سے استقبال ہوتا ہے، نفساء کے لیے مدت اور رخصتیں ہیں، اور ولادت سے نسب، میراث اور عدت کے احکام ثابت ہوتے ہیں۔"
