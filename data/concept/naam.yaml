summary:
  ar: "النعام في الكتاب طير يبني بعض الأطباء على لحمه بناء عظيماً، وقد ذكر بعضهم أن لحمه حار دسم يبسط الطعام ويقوي الجسم، لكنه غليظ لا ينهضم، ويذكر له نقلاً موسوماً في الباه {cite:canon-ibn-sina-print-v1 p.583}."
  en: "Naam, the ostrich, is in the book a bird on whose meat some physicians build a great structure; some have said its meat is hot and fatty, spreads the food and strengthens the body, but is coarse and not digested, and the book gives a labelled listing on desire {cite:canon-ibn-sina-print-v1 p.583}."
  ur: "نعام کتاب میں شتر مرغ ہے جس کے گوشت پر بعض اطبا بڑی عمارت اٹھاتے ہیں؛ بعض نے کہا کہ اس کا گوشت گرم اور چکنا ہے، کھانے کو پھیلاتا اور جسم کو قوت دیتا ہے مگر کثیف ہے اور ہضم نہیں ہوتا، اور کتاب باہ کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.583}۔"
