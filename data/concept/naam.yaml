summary:
  ar: "النعام في الكتاب طير يبني بعض الأطباء على لحمه بناء عظيماً، وقد ذكر بعضهم أن لحمه حار دسم يبسط الطعام ويقوي الجسم، لكنه غليظ لا ينهضم، ويذكر له نقلاً موسوماً في الباه {cite:canon-ibn-sina-print-v1 p.583}."
  en: "Naam, the ostrich, is in the book a bird on whose meat some physicians build a great structure; some have said its meat is hot and fatty, spreads the food and strengthens the body, but is coarse and not digested, and the book gives a labelled listing on desire {cite:canon-ibn-sina-print-v1 p.583}."
  ur: "نعام کتاب میں شتر مرغ ہے جس کے گوشت پر بعض اطبا بڑی عمارت اٹھاتے ہیں؛ بعض نے کہا کہ اس کا گوشت گرم اور چکنا ہے، کھانے کو پھیلاتا اور جسم کو قوت دیتا ہے مگر کثیف ہے اور ہضم نہیں ہوتا، اور کتاب باہ کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.583}۔"
  es: "Naam, el avestruz, es en el libro un ave sobre cuya carne algunos médicos construyen una gran estructura; algunos han dicho que su carne es caliente y grasosa, distribuye los alimentos y fortalece el cuerpo, pero es tosca y no se digiere, y el libro da una lista etiquetada sobre el deseo {cite:canon-ibn-sina-print-v1 p.583}."
  fr: "Naam, l'autruche, est dans le livre un oiseau sur la chair duquel certains médecins fondent une grande structure; certains ont dit que sa chair est chaude et grasse, qu'elle répartit la nourriture et fortifie le corps, mais qu'elle est grossière et difficile à digérer, et le livre donne une liste étiquetée sur le désir {cite:canon-ibn-sina-print-v1 p.583}."
  tr: "Kitapta devekuşları, bazı doktorların etinin büyük bir yapıya sahip olduğu kuşlardır. Bazıları etinin sıcak ve yağlı olduğunu, yiyeceği düzleştirdiğini ve vücudu güçlendirdiğini, ancak kalın ve sindirilmemiş olduğunu belirtmiştir. 'Al-Baha' başlıklı bir anlatımda bahsedilir {atıf:kanon-ibn-sina-print-v1 s.583}."
  id: "Dalam buku ini, burung unta adalah burung yang dagingnya beberapa dokter membangun struktur yang besar. Beberapa menyebutkan bahwa dagingnya panas dan berlemak, yang meratakan makanan dan memperkuat tubuh, tetapi ia kental dan tidak tercerna. Burung ini disebutkan dalam narasi berjudul 'Al-Baha' {cite:canon-ibn-sina-print-v1 hlm.583}."
