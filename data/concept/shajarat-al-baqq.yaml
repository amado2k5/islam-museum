  ur: "شجرۃ البق کتاب میں ایک مختصر اندراج ہے جو دال کے باب میں دردار کے ذکر کے موقع پر کہی گئی بات کی طرف لوٹاتا ہے اور کہتا ہے کہ یہ شجرۃ البق ہے، اور محقق کے حاشیے میں ہے کہ شجر البق دردار ہے {cite:canon-ibn-sina-print-v1 p.684}۔"
