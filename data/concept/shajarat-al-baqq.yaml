  ar: "شجرة البق في الكتاب مدخل قصير يحيل على ما قيل في فصل الدال عند ذكر دردار، وهي شجرة البق، وفي حاشية المحقق أن شجر البق هو دردار {cite:canon-ibn-sina-print-v1 p.684}"
