summary:
  ar: "ذئب في الكتاب مدخل قصير يقول فيه إنه قيل زبل الذئب عجيب في القولنج، وبه ينتهي الكلام من حرف الذال وجملة ما ذكر فيه ستة أعداد؛ نقل منسوب إلى الكتاب بلا توصية {cite:canon-ibn-sina-print-v1 p.720}"
  en: "Dhi'b is in the book a short entry that says it was said the dung of the wolf is wondrous for colic, and with it the discussion of the letter dhal ends, the total of what is mentioned in it being six; a report attributed to the book, without recommendation {cite:canon-ibn-sina-print-v1 p.720}"
  ur: "ذئب کتاب میں ایک مختصر اندراج ہے جس میں کہا گیا ہے کہ بھیڑیے کی لید کے بارے میں قول ہے کہ وہ قولنج میں عجیب ہے، اور اسی کے ساتھ حرف ذال کا کلام ختم ہوتا ہے اور اس میں ذکر کی گئی چیزوں کا مجموعہ چھ ہے؛ کتاب سے منسوب نقل، بلا سفارش {cite:canon-ibn-sina-print-v1 p.720}۔"
  es: "Dhi'b es en el libro una breve entrada que dice que se decía que el estiércol del lobo es maravilloso para los cólicos, y con ella termina la discusión de la carta dhal, siendo seis en total lo que se menciona en ella; un informe atribuido al libro, sin recomendación {cite:canon-ibn-sina-print-v1 p.720}"
  fr: "Le livre contient une brève mention de la lettre Dhi'b, qui indique que l'on disait que la bouse de loup était miraculeuse contre les coliques. C'est là que s'achève la discussion sur la lettre Dhal, six lettres étant mentionnées au total. Ce récit est attribué au livre, sans recommandation. {cite:canon-ibn-sina-print-v1 p.720}"
  tr: "Kitaptaki bir kurt, kurtun dışkısının kolikte garip olduğu söylenen kısa bir giriş içerir ve tartışma 'dhāl' harfiyle sona erer ve içinde bahsedilen cümle altı sayıdan oluşur; bu alıntı tavsiye olmaksızın kitaba atfedilmiştir {cite:canon-ibn-sina-print-v1 s.720}"
  id: "Seekor serigala dalam buku ini memuat entri singkat di mana dikatakan bahwa kotoran serigala itu aneh dalam kolik, dan dengan ini diskusi berakhir dengan huruf 'dhāl' dan kalimat yang disebutkan di dalamnya adalah enam angka; kutipan yang dikaitkan dengan buku tanpa rekomendasi {cite:canon-ibn-sina-print-v1 hlm.720}"
