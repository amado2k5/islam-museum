summary:
  ar: "السك في الكتاب الأصلي منه الصيني المتخذ من الأملج، وقد يتخذ الآن من العفص والبلح على نحو عمل الرامك، الساذج منه حار في الأولى يابس في الثانية والمطيب حار يابس في الثالثة، قابض مقو للأحشاء، ويذكر له نقلاً موسوماً في الباه {cite:canon-ibn-sina-print-v1 p.587}."
  en: "Sakk is in the book originally the Chinese kind made from the emblic, but now, since that is rare, made from galls and unripe dates in the manner of the making of ramak; the plain is hot in the first degree and dry in the second, the perfumed hot and dry in the third; it is astringent and strengthens the viscera, and the book gives a labelled listing on desire {cite:canon-ibn-sina-print-v1 p.587}."
  ur: "سک کتاب میں اصل میں چینی ہے جو املج سے بنتا ہے، اب جب وہ نایاب ہو گیا تو مازو اور کچی کھجور سے رامک کی طرح بنایا جاتا ہے؛ سادہ پہلے درجے میں گرم اور دوسرے میں خشک، اور خوشبودار تیسرے درجے میں گرم خشک؛ قابض ہے اور اندرونی اعضا کو قوت دیتا ہے، اور کتاب باہ کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.587}۔"
  es: "En el libro, el sakk es originalmente del tipo chino hecho de emblic, pero ahora, dado que es raro, se hace de agallas y dátiles verdes a la manera de hacer ramak; el simple es caliente en el primer grado y seco en el segundo, el perfumado caliente y seco en el tercero; es astringente y fortalece las vísceras, y el libro da una lista etiquetada sobre el deseo {cite:canon-ibn-sina-print-v1 p.587}."
  fr: "Le sakk est décrit dans le livre à l'origine comme la variété chinoise fabriquée à partir de l'emblic, mais maintenant, comme celle-ci est rare, elle est fabriquée à partir de galles et de dattes non mûres à la manière de la fabrication du ramak; la version nature est chaude au premier degré et sèche au deuxième, la version parfumée est chaude et sèche au troisième; elle est astringente et fortifie les viscères, et le livre donne une liste étiquetée sur le désir {cite:canon-ibn-sina-print-v1 p.587}."
  tr: "Orijinal kitaptaki madeni paralar Çince'dir, amlaj'dan türetilmiş ve artık rezene ile hurmadan ramek tarzında yapılabilir. Saf formu ilk durumda baharatlıdır, ikincisinde kuru, üçüncü durumda ise sıcak kuru, büzücüdür ve iç organları güçlendirir. Bunun için Bah {cite:canon-ibn-sina-print-v1 s.587} adlı eserde bir anlatım belirtilmiştir."
  id: "Koin dalam buku asli berasal dari bahasa Tionghoa, berasal dari amlaj, dan sekarang dapat dibuat dari adas dan kurma dengan gaya ramek. Bentuk naif adalah pedas pada kasus pertama, kering pada kasus kedua, dan manisnya panas kering pada kasus ketiga, sesak dan memperkuat isi perut. Sebuah narasi disebutkan untuk ini dalam Bah {cite:canon-ibn-sina-print-v1 hlm.587}."
