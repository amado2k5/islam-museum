id: concept/rumour-in-islam
class: concept
kind: ethical
tags: [akhlaq-browser, akhlaq-kadhib]
label:
  ar: الإشاعة الكاذبة والتثبت من الخبر
  en: False rumour and verification (tathabbut) in Islam
  es: "Rumor falso y verificación (tathabbut) en el Islam"
  fr: "Rumeurs mensongères et vérification (tathabbut) en Islam"
  ur: "اسلام میں جھوٹی افواہ اور تصدیق ⁦(تہذیب)⁩"
  tr: "Yanlış söylenti ve haberlerin doğrulanması"
  id: "Rumor palsu dan verifikasi berita"
summary:
  ar: "الإشاعة في تعريف الكتاب خبر ينتشر ولا يثبت، والمقصود بها غالباً التأثير السلبي في النفوس وإثارة الاضطراب وعدم الثقة {cite:al-ishaat-al-kadhiba-azhar p. 10}. يرى المؤلف أنها قديمة قدم الإنسانية، يطلقها الخصوم لإضعاف خصومهم أو صرف الناس عن الحق، ويعدّ أولها إبليس حين أغوى آدم {cite:al-ishaat-al-kadhiba-azhar p. 11, 13}. ويعرض الكتاب ما قيل عن الأنبياء من تهم كالضلال والجنون والسفه والإفساد، ويجعل التثبت أنجع وسيلة لإبطالها، وتقوم عليه الآية الكريمة في سورة الحجرات {cite:al-ishaat-al-kadhiba-azhar p. 7–8, 191}. ويرى أن الأمة التي تتثبت من الأخبار أمة رشيدة، والأمة التي تصدق كل ما يقال لها أمة غافلة {cite:al-ishaat-al-kadhiba-azhar p. 10}."
  en: "In the book's definition a rumour is a report that spreads without being verified, and it is usually meant to unsettle souls and destroy trust {cite:al-ishaat-al-kadhiba-azhar p. 10}. The author holds that rumours are as old as humanity, used by adversaries against the prophets and against those they oppose, and counts Iblis as the first to use them, in his whisper to Adam {cite:al-ishaat-al-kadhiba-azhar p. 11, 13}. Verification of reports, in the Qur'anic command of Surat al-Hujurat, is presented as the most effective remedy {cite:al-ishaat-al-kadhiba-azhar p. 189, 191}."
  es: "En la definición del libro, un rumor es un informe que se difunde sin ser verificado, y generalmente tiene como objetivo inquietar las almas y destruir la confianza {cite:al-ishaat-al-kadhiba-azhar p. 10}. El autor sostiene que los rumores son tan antiguos como la humanidad, utilizados por los adversarios contra los profetas y contra aquellos a quienes se oponen, y considera a Iblis como el primero en utilizarlos, en su susurro a Adán {cite:al-ishaat-al-kadhiba-azhar p. 11, 13}. La verificación de los informes, en el mandato coránico de la Sura al-Hujurat, se presenta como el remedio más eficaz {cite:al-ishaat-al-kadhiba-azhar p. 189, 191}."
  fr: "Selon la définition de l'ouvrage, une rumeur est un rapport qui se propage sans être vérifié, et qui vise généralement à semer le trouble et à détruire la confiance (voir: al-ishaat-al-kadhiba-azhar, p. 10). L'auteur soutient que les rumeurs sont aussi anciennes que l'humanité, utilisées par les adversaires contre les prophètes et leurs ennemis, et considère Iblis comme le premier à y avoir eu recours, dans son murmure à Adam (voir: al-ishaat-al-kadhiba-azhar, p. 11, 13). La vérification des rapports, conformément au commandement coranique de la sourate al-Hujurat, est présentée comme le remède le plus efficace (voir: al-ishaat-al-kadhiba-azhar, p. 189, 191)."
  ur: "کتاب کی تعریف میں افواہ ایسی خبر ہے جو بغیر تصدیق کے پھیل جاتی ہے اور اس کا مقصد عموماً روحوں کو پریشان کرنا اور اعتماد کو ختم کرنا ہوتا ہے۔ 10}۔ مصنف کا خیال ہے کہ افواہیں انسانیت کی طرح پرانی ہیں، جنہیں مخالفین انبیاء کے خلاف اور ان کے خلاف استعمال کرتے ہیں، اور آدم سے اپنی سرگوشی میں ابلیس کو سب سے پہلے ان کا استعمال کرنے والا شمار کرتے ہیں۔ 11، 13}۔ سورۃ الحجرات کے قرآنی حکم میں رپورٹوں کی تصدیق کو سب سے مؤثر علاج کے طور پر پیش کیا گیا ہے۔ 189، 191}۔"
  tr: "Kitabın tanımına göre, söylenti yayılan ancak kanıtlanmamış haberdir ve genellikle insanlara olumsuz etkisi, huzursuzluk ve güvensizlik yaratmasına atıfta bulunur. {cite:al-ishaat-al-kadhiba-azhar s. 10}. Yazar, söylentinin insanlık kadar eski olduğunu, rakiplerin rakiplerini zayıflatmak veya insanları gerçekten uzaklaştırmak için serbest bıraktığını düşünür. Bunlardan ilki, İblis'in Adem'i yanlış yola sürüklemesi {cite:al-ishaat-al-kadhiba-azhar s. 11, 13}. Kitap, peygamberler hakkında yanlış yönlendirme, delilik, aptallık ve yozlaşma gibi suçlamaları sunar ve doğrulamayı onları çürütmenin en etkili yolu yapar. Süre'deki yüce ayet buna dayanır (atıf:al-ishaat-al-kadhiba-azhar s. 7–8, 191}). Haberleri doğrulayan bir ulusun sağlam bir ulus olduğuna, her anlatılana inanan bir ulusun ise dikkatsiz bir ulus olduğuna inanıyor {cite:al-ishaat-al-kadhiba-azhar s. 10}."
  id: "Dalam definisi buku, rumor adalah berita yang menyebar tetapi belum terbukti, dan sering merujuk pada dampak negatif pada manusia, menimbulkan kerusuhan dan ketidakpercayaan. {cite:al-ishaat-al-kadhiba-azhar hlm. 10}. Penulis menganggapnya setua umat manusia, dilepaskan oleh lawan untuk melemahkan lawan mereka atau mengalihkan orang dari kebenaran. Yang pertama adalah Iblis ketika ia menyesatkan Adam {cite:al-ishaat-al-kadhiba-azhar hlm. 11, 13}. Buku ini menyajikan tuduhan-tuduhan yang dibuat terhadap para nabi seperti kekeliruan, kegilaan, kebodohan, dan korupsi, menjadikan verifikasi sebagai cara paling efektif untuk membantahnya. Ayat mulia dalam Surah Al-Hujurat didasarkan pada hal ini (sitasi: al-ishaat-al-kadhiba-azhar hlm. 7–8, 191}. Ia percaya bahwa negara yang memverifikasi berita adalah bangsa yang sehat, dan bangsa yang percaya bahwa segala sesuatu yang diceritakan adalah bangsa yang tidak peduli {cite:al-ishaat-al-kadhiba-azhar hlm. 10}."
