id: concept/rumour-in-islam
class: concept
kind: ethical
label:
  ar: الإشاعة الكاذبة والتثبت من الخبر
  en: False rumour and verification (tathabbut) in Islam
summary:
  ar: "الإشاعة في تعريف الكتاب خبر ينتشر ولا يثبت، والمقصود بها غالباً التأثير السلبي في النفوس وإثارة الاضطراب وعدم الثقة {cite:al-ishaat-al-kadhiba-azhar p. 10}. يرى المؤلف أنها قديمة قدم الإنسانية، يطلقها الخصوم لإضعاف خصومهم أو صرف الناس عن الحق، ويعدّ أولها إبليس حين أغوى آدم {cite:al-ishaat-al-kadhiba-azhar p. 11, 13}. ويعرض الكتاب ما قيل عن الأنبياء من تهم كالضلال والجنون والسفه والإفساد، ويجعل التثبت أنجع وسيلة لإبطالها، وتقوم عليه الآية الكريمة في سورة الحجرات {cite:al-ishaat-al-kadhiba-azhar p. 7–8, 191}. ويرى أن الأمة التي تتثبت من الأخبار أمة رشيدة، والأمة التي تصدق كل ما يقال لها أمة غافلة {cite:al-ishaat-al-kadhiba-azhar p. 10}."
  en: "In the book's definition a rumour is a report that spreads without being verified, and it is usually meant to unsettle souls and destroy trust {cite:al-ishaat-al-kadhiba-azhar p. 10}. The author holds that rumours are as old as humanity, used by adversaries against the prophets and against those they oppose, and counts Iblis as the first to use them, in his whisper to Adam {cite:al-ishaat-al-kadhiba-azhar p. 11, 13}. Verification of reports, in the Qur'anic command of Surat al-Hujurat, is presented as the most effective remedy {cite:al-ishaat-al-kadhiba-azhar p. 189, 191}."
