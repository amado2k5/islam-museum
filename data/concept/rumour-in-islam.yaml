    summary:
      ar: "يبدأ الكتاب من القرآن والسنة: التثبت من الخبر واجب قبل الحكم، والآية في سورة الحجرات هي الأصل، وقد ذكر المفسرون لها أسباب نزول تتصل ببعث الوليد بن عقبة إلى بني المصطلق {cite:al-ishaat-al-kadhiba-azhar p. 192}."
      en: "The book begins from the Qur'an and the Sunna: verification before judgement is obligatory, Surat al-Hujurat is the basis, and the exegetes give an occasion of revelation linked to al-Walid ibn Uqba's mission to Banu al-Mustaliq {cite:al-ishaat-al-kadhiba-azhar p. 192}."
