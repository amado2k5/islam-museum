id: concept/makan
class: concept
kind: legal
label: { ar: "المَكَان", en: "Place (makan) in the law", ur: "مکان (فقہی احکام)" }
summary:
  ar: "المكان في اللغة الموضع، والجمع أمكنة. وتتعلق بالمكان أحكام فقهية: صحة الصلاة في المواضع المنهي عنها كالمجزرة والمقبرة والحمام ومعاطن الإبل، والخلاف فيها بين الكراهة والبطلان، ووضع اليدين في الصلاة، ودفن الميت في المقبرة، وتعيين مكان تسليم المبيع، وإمارة الدابة إلى مكان معين، وتفاضل الأماكن وفيها أفضلية مكة والمدينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933}"
  en: "Makan is, in the lexicon, a place, the plural being amakina. Several rulings attach to place: whether prayer is valid in places disliked for prayer, such as a slaughterhouse, a cemetery, a bathhouse and a camel pen, where the schools differ between reprehension and invalidity; the placing of the hands in prayer; burial in a cemetery as best; the place where a sold item must be delivered; the limit on a borrowed mount to a stated place; and the merit of places, where most jurists hold Makka and Madina the best, with a dispute over which is greater. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933}"
  ur: "مکان کے فقہی احکام میں یہ شامل ہے کہ کن جگہوں پر نماز درست ہے، ہاتھ باندھنے کی جگہ، میت کی تدفین کی جگہ، فروخت شدہ چیز کی حوالگی کی جگہ اور مکۂ و مدینہ کی فضیلت کا مسئلہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933}"
