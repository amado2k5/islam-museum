id: concept/makan
class: concept
kind: legal
label: { ar: "المَكَان", en: "Place (makan) in the law", ur: "مکان ⁦(فقہی احکام)⁩", es: "Lugar (makan) en la ley", fr: "Place (makan) dans la loi" }
summary:
  ar: "المكان في اللغة الموضع، والجمع أمكنة. وتتعلق بالمكان أحكام فقهية: صحة الصلاة في المواضع المنهي عنها كالمجزرة والمقبرة والحمام ومعاطن الإبل، والخلاف فيها بين الكراهة والبطلان، ووضع اليدين في الصلاة، ودفن الميت في المقبرة، وتعيين مكان تسليم المبيع، وإمارة الدابة إلى مكان معين، وتفاضل الأماكن وفيها أفضلية مكة والمدينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933}"
  en: "Makan is, in the lexicon, a place, the plural being amakina. Several rulings attach to place: whether prayer is valid in places disliked for prayer, such as a slaughterhouse, a cemetery, a bathhouse and a camel pen, where the schools differ between reprehension and invalidity; the placing of the hands in prayer; burial in a cemetery as best; the place where a sold item must be delivered; the limit on a borrowed mount to a stated place; and the merit of places, where most jurists hold Makka and Madina the best, with a dispute over which is greater. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933}"
  ur: "مکان کے فقہی احکام میں یہ شامل ہے کہ کن جگہوں پر نماز درست ہے، ہاتھ باندھنے کی جگہ، میت کی تدفین کی جگہ، فروخت شدہ چیز کی حوالگی کی جگہ اور مکۂ و مدینہ کی فضیلت کا مسئلہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933}"
  es: "Makan significa, en el léxico, lugar, siendo amakina el plural. Varias normas se relacionan con el lugar: si la oración es válida en lugares desaconsejados para la oración, como un matadero, un cementerio, una casa de baños y un corral de camellos, donde las escuelas difieren entre reprobación e invalidez; la colocación de las manos en la oración; el entierro en un cementerio como el mejor lugar; el lugar donde debe entregarse un artículo vendido; el límite de un caballo prestado a un lugar determinado; y el mérito de los lugares, donde la mayoría de los juristas consideran que La Meca y Medina son los mejores, existiendo una disputa sobre cuál es mayor. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14930} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14931} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14932} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933}"
  fr: "Makan signifie, dans le lexique, lieu, son pluriel étant amakina. Plusieurs règles s'appliquent au lieu: la validité de la prière dans les lieux déconseillés pour la prière, tels qu'un abattoir, un cimetière, un bain public ou un enclos à chameaux (les écoles juridiques divergent entre réprobation et invalidité); la position des mains pendant la prière; l'inhumation au cimetière (considérée comme la meilleure option); le lieu de livraison d'un bien vendu; la limitation du lieu d'emprunt d'une monture; et la valeur des lieux, la plupart des juristes considérant La Mecque et Médine comme les meilleures, un débat persistant sur la question de savoir laquelle est la plus importante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14930} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14933}"
