label: { ar: "النظير وجفت البيوت في الزيج الصابي", en: "The opposite point and the pairing of the houses", ur: "نظیر اور بیوت کے جوڑے" }
summary:
  ar: "يبين البتاني أن البيوت تتقابل في أزواج: أول الحادي عشر نظير أول الحمل، وأول الثاني عشر نظير أول الثور، وأول الثامن نظير أول الثاني، وأول التاسع نظير أول الثالث؛ والنظير هو الجزء المقابل على قطر الفلك الذي يبعد مائة وثمانين درجة. {cite:zij-sabi-nallino-byblion p.111}."
  en: "Al-Battani shows the houses pair off as opposites: the first of the eleventh is the opposite of the first of Aries, the first of the twelfth of Taurus, the first of the eighth of the second, and the first of the ninth of the third. The opposite is the point across the diameter of the circle, one hundred and eighty degrees away. {cite:zij-sabi-nallino-byblion p.111}."
  ur: "البتانی بتاتے ہیں کہ بیوت جوڑوں میں ایک دوسرے کے مقابل ہیں: گیارہویں بیت کا پہلا درجہ حمل کے پہلے درجے کا نظیر ہے، بارہویں کا پہلا درجہ ثور کے پہلے درجے کا، آٹھویں کا دوسرے کا، اور نویں کا تیسرے کا؛ نظیر وہ جزو ہے جو دائرے کے قطر پر ایک سو اسی درجے کے فاصلے پر مقابل ہو۔ {cite:zij-sabi-nallino-byblion p.111}۔"
