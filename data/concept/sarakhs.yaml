summary:
  ar: "السرخس في الكتاب نبات بلا ورق ظاهر ولا زهر ولا ثمر عند ديسقوريدوس، ذكر وأنثى، حار يابس في الثانية، يجفف بلا لذع، يدمل القروح ويقتل الديدان وحب القرع، وقد يؤكل ورقه أول طلوعه مطبوخاً فيليّن البطن، ويذكر له نقلاً موسوماً في الحبل والجنين {cite:canon-ibn-sina-print-v1 p.585}."
  en: "Sarakhs is in the book the fern, which Dioscorides describes as a plant without ordinary leaf, flower or fruit, male and female kinds; hot and dry in the second degree, drying without sting, it heals ulcers and kills worms and tapeworm, and its leaf when it first appears may be eaten cooked and loosens the belly; the book gives a labelled listing on conception and the foetus {cite:canon-ibn-sina-print-v1 p.585}."
  ur: "سرخس کتاب میں فرن ہے جسے دیسقوریدوس بغیر ظاہری پتے، پھول اور پھل کے بتاتا ہے، نر اور مادہ دو قسمیں؛ دوسرے درجے میں گرم خشک، بغیر چبھن کے خشک کرتا ہے، زخم بھرتا اور کیڑے اور کدو دانے مارتا ہے، اور اس کا نکلتا ہوا پتا پکا کر کھایا جائے تو پیٹ نرم کرتا ہے، اور کتاب حمل اور جنین کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.585}۔"
  es: "Sarakhs es el helecho que Dioscórides describe como una planta sin hojas, flores ni frutos comunes, ni especies masculinas ni femeninas; caliente y seca en segundo grado, seca sin picar, cura úlceras y mata gusanos y tenias, y su hoja cuando aparece por primera vez se puede comer cocida y afloja el vientre; el libro da una lista etiquetada sobre la concepción y el feto {cite:canon-ibn-sina-print-v1 p.585}."
