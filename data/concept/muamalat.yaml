label:
  ar: المعاملات
  en: Mu'amalat (dealings and transactions)
  ur: معاملات
summary:
  ar: "المعاملات عند الفقهاء قسم الفقه الذي ينظر في تصرفات الناس بعضهم مع بعض: العقود والأموال والأنكحة وما يتصل بها، في مقابل العبادات التي هي تصرف العبد مع ربه. تضبطها الموسوعة الفقهية الكويتية أبواباً: البيوع وأنواعها، والربا والصرف، والسلم والاستصناع، والدين والقرض والرهن، والإجارة والأجير، والهبة والهدية والعارية والوديعة، والشركة والمضاربة والمزارعة والمساقاة، والحوالة والكفالة والضمان والوكالة، والصلح والإقرار، والوصايا والمواريث، والنكاح ومهره وطلاقه وخلعه وعدته ورضاعه ونفقته وحضانته، والأيمان وكفارتها، والشهادة والبينة، والقضاء، والغصب واللقطة والشفعة وإحياء الموات، والحجر والإكراه — ويدخلها جميعاً أصل العدل والأمانة ورد الحقوق إلى أهلها، فقد قال تعالى «إن الله يأمركم أن تؤدوا الأمانات إلى أهلها وإذا حكمتم بين الناس أن تحكموا بالعدل» {cite:tanzil-quran}. والمتحف يجمع في متصفح الأخلاق والمعاملات كل ذكر لها في القرآن والسنة والسيرة وكل كتاب محصود {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:riyad-al-salihin}."
  en: "Mu'amalat, in the jurists' usage, is the division of fiqh that governs people's transactions with one another — contracts, property and marriage and what attaches to them — as against worship, which is the servant's dealing with his Lord. The Kuwaiti Fiqh Encyclopedia orders its doors: sales and their kinds, riba and exchange, salam and istisna', debt, loan and pledge, hire and the hireling, gifts, loans and deposits, partnership, mudaraba, muzara'a and musaqat, transfer, guarantee, surety and agency, reconciliation and acknowledgment, bequests and inheritance, marriage with its dower, divorce, khul', waiting period, nursing, maintenance and custody, oaths and their expiation, testimony and proof, adjudication, usurpation, found property, pre-emption and the revival of dead land, interdiction and coercion — all of it bound by the root of justice and trustworthiness and returning rights to their owners, as God says: 'God commands you to render the trusts to their owners and, when you judge between people, to judge with justice' {cite:tanzil-quran}. The museum's Akhlaq and Mu'amalat Browser gathers every mention of them in the Qur'an, the Sunnah, the seerah and every harvested book {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:riyad-al-salihin}."
  ur: "معاملات فقہاء کی اصطلاح میں فقہ کا وہ حصہ ہے جو لوگوں کے باہمی تصرفات — معاہدے، مال اور نکاح اور ان سے متعلقہ احکام — دیکھتا ہے، اس کے برعکس عبادات جو بندے کا اپنے رب کے ساتھ معاملہ ہے۔ کویتی فقہ دائرہ المعارف اس کے ابواب ترتیب دیتی ہے: بیوع اور ان کی اقسام، سود اور صرف، سلم اور استصناع، قرض اور رہن، اجارہ اور اجیر، ہبہ، عاریت اور ودیعت، شرکت، مضاربہ، مزارعہ اور مساقاۃ، حوالہ، کفالت، ضمان اور وکالت، صلح اور اقرار، وصایا اور مواریث، نکاح مہر، طلاق، خلع، عدت، رضاعت، نفقہ اور حضانت کے ساتھ، قسمیں اور ان کا کفارہ، گواہی اور ثبوت، قضا، غصب، ملقوتہ، شفعہ اور احیائے موات، حجر اور اکراہ — اور سب کی جڑ عدل، امانت اور حقوق اہل تک پہنچانا ہے، جیسا کہ اللہ فرماتا ہے: «اللہ تمہیں حکم دیتا ہے کہ امانتیں ان کے مالکوں تک پہنچاؤ اور جب لوگوں کے درمیان فیصلہ کرو تو عدل سے فیصلہ کرو» {cite:tanzil-quran}۔ میوزیم کا اخلاق اور معاملات براؤزر قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں ان کا ہر ذکر جمع کرتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:riyad-al-salihin}."
