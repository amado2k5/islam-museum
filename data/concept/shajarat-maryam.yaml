id: concept/shajarat-maryam
class: concept
kind: natural
label:
  ar: "شجرة مريم"
  en: "Shajarat Maryam (the bukhur Maryam, per the book and the editor's note)"
  ur: "شجرۃ مریم"
  es: "Shajarat Maryam (el bukhur Maryam, según el libro y la nota del editor)"
  fr: "Shajarat Maryam (le bukhur Maryam, selon le livre et la note de l'éditeur)"
  tr: "Meryem ağacı"
  id: "Pohon Maria"
summary:
  ar: "شجرة مريم في الكتاب هي بخور مريم، ويحيل الكتاب إلى ما قيل فيها في فصل الميم عند ذكر مقلا مينوس، وهي ثلاثة أنواع، نوع بلا ثمرة ونوعان بثمرة، وتنفع من الزكام البارد، وهي نافعة لنزول الماء في العين {cite:canon-ibn-sina-print-v1 pp.675-676}"
  en: "Shajarat Maryam is in the book the bukhur Maryam, and the book refers back to what was said of it in the chapter of the letter mim at the mention of muqla minus; it is of three kinds, one without fruit and two with fruit; it benefits the cold catarrh, and is beneficial for the descent of water in the eye {cite:canon-ibn-sina-print-v1 pp.675-676}"
  ur: "شجرۃ مریم کتاب میں بخور مریم ہے، اور کتاب اس بات کی طرف لوٹاتی ہے جو میم کے فصل میں مقلا مینوس کے ذکر کے وقت کہی گئی؛ اس کی تین قسمیں ہیں، ایک بے پھل اور دو پھل والی؛ ٹھنڈے زکام میں نافع ہے، اور آنکھ میں پانی اترنے کے لیے نافع ہے {cite:canon-ibn-sina-print-v1 pp.675-676}۔"
  es: "Shajarat Maryam se encuentra en el libro Bukhur Maryam, y el libro remite a lo que se dijo sobre él en el capítulo de la carta Mim, al mencionar Muqla minus; es de tres tipos, uno sin fruto y dos con fruto; beneficia el catarro frío y es beneficioso para el descenso de agua en el ojo {cite:canon-ibn-sina-print-v1 pp.675-676}"
  fr: "Le Shajarat Maryam est mentionné dans le livre Bukhur Maryam, qui fait référence à ce qui en est dit dans le chapitre de la lettre Mim, à propos du muqla minus. Il en existe trois sortes: une sans fruit et deux avec fruit. Il est bénéfique contre le rhume et favorise l’écoulement de larmoiement. {cite:canon-ibn-sina-print-v1 pp.675-676}"
  tr: "Kitaptaki Meryem Ağacı Meryem'in tütsüsüne atıfta bulunur ve kitap, Maqla Minus anılırken meem bölümünde söylenenlere atıfta bulunur. Üç türü vardır: biri meyvesiz tür, diğeri meyveli iki tür. Soğuk algınlıkları için faydalıdırlar ve suyun göze girmesi için faydalıdırlar {atıf:kanon-ibn-sina-print-v1 s.675-676}"
  id: "Pohon Maria dalam buku merujuk pada dupa Maria, dan buku tersebut merujuk pada apa yang dikatakan tentangnya dalam bagian tentang meem saat menyebut Maqla Minus. Ada tiga jenis: satu tipe yang tidak berbuah dan dua jenis yang berbuah. Mereka bermanfaat untuk flu dingin dan bermanfaat untuk air masuk ke mata {cite:canon-ibn-sina-print-v1 hlm.675-676}"
