id: concept/light-and-thick-foods-and-the-exerciser
class: concept
kind: scientific
label: { ar: "الأغذية اللطيفة والغليظة وصاحب الرياضة", en: "Light and thick foods, and the exerciser", ur: "لطیف اور غلیظ غذائیں اور ورزش کرنے والا", es: "Alimentos ligeros y espesos, y el ejercicio", fr: "Des aliments légers et épais, et l'exercice" }
summary:
  ar: "يقول ابن سينا إن الأغذية اللطيفة أحفظ للصحة وأقل معونة للقوة والجلد، والغليظة بالضد، وإن أصحاب الرياضات والتعب الكثير أحمل للأغذية الغليظة ويعينهم نومهم المستغرق، لكن كثرة العرق قد تسلب أكبادهم ما لم ينهضم فيعرضهم لأمراض قتالة في آخر العمر أو أوله {cite:canon-ibn-sina-print-v1 p.233}."
  en: "Ibn Sina says light foods better guard health but give less help to strength and endurance, and thick foods the reverse; those who exercise and labour much bear thick food better, helped by deep sleep, though heavy sweating may strip their livers of food not yet digested and prepare deadly illnesses late or early in life {cite:canon-ibn-sina-print-v1 p.233}."
  es: "Ibn Sina dice que los alimentos ligeros protegen mejor la salud pero ayudan menos a la fuerza y la resistencia, y los alimentos espesos al revés; quienes hacen mucho ejercicio y trabajan toleran mejor los alimentos espesos, ayudados por un sueño profundo, aunque la sudoración excesiva puede despojar a sus hígados de los alimentos aún no digeridos y preparar enfermedades mortales en la vejez o en la juventud {cite:canon-ibn-sina-print-v1 p.233}."
  fr: "Ibn Sina dit que les aliments légers préservent mieux la santé mais aident moins à la force et à l'endurance, et les aliments épais l'inverse; ceux qui font beaucoup d'exercice et travaillent beaucoup supportent mieux les aliments épais, aidés par un sommeil profond, bien qu'une transpiration abondante puisse priver leur foie des aliments non encore digérés et préparer des maladies mortelles tard dans la vie {cite:canon-ibn-sina-print-v1 p.233}."
  ur: "ابن سینا کا کہنا ہے کہ ہلکی غذائیں صحت کی بہتر حفاظت کرتی ہیں لیکن طاقت اور برداشت میں کم مدد دیتی ہیں اور موٹی غذائیں اس کے برعکس ہیں۔ جو لوگ بہت زیادہ ورزش اور مشقت کرتے ہیں وہ گاڑھا کھانا بہتر برداشت کرتے ہیں، گہری نیند سے مدد ملتی ہے، حالانکہ بہت زیادہ پسینہ ان کے جگر سے ہضم نہ ہونے والا کھانا چھین سکتا ہے اور زندگی کے آخر میں یا ابتدائی طور پر مہلک بیماریاں تیار کر سکتا ہے۔"
