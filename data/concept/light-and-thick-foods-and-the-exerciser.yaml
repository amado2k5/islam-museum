summary:
  ar: "يقول ابن سينا إن الأغذية اللطيفة أحفظ للصحة وأقل معونة للقوة والجلد، والغليظة بالضد، وإن أصحاب الرياضات والتعب الكثير أحمل للأغذية الغليظة ويعينهم نومهم المستغرق، لكن كثرة العرق قد تسلب أكبادهم ما لم ينهضم فيعرضهم لأمراض قتالة في آخر العمر أو أوله {cite:canon-ibn-sina-print-v1 p.233}."
  en: "Ibn Sina says light foods better guard health but give less help to strength and endurance, and thick foods the reverse; those who exercise and labour much bear thick food better, helped by deep sleep, though heavy sweating may strip their livers of food not yet digested and prepare deadly illnesses late or early in life {cite:canon-ibn-sina-print-v1 p.233}."
