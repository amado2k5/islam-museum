label: { ar: "المهدية" }
summary:
  ar: "عقيدة المهدي المنتظر من أبرز معالم المذهب عند الإمامية: هو الإمام الثاني عشر الذي يملأ الأرض عدلاً وقسطاً كما ملئت جوراً وظلماً، يُبايَع بمكة بين الركن والمقام، ويتصل بها القول بالرجعة — رجوع الأئمة وخصومهم إلى الدنيا بعد ظهوره. ورأى أحمد أمين أن فكرة المهدي جابهتها أخبار مقابلة: للأمويين «السفياني» الذي خرج به أبو محمد بن عبد الله بن يزيد بن معاوية فجمع أهل قنسرين وحمص وتدمر قبل أن يهزمه المنصور، ووُضعت للعباسيين أحاديث كحديث «منا أهل البيت أربعة: منا السفاح ومنا المنذر ومنا المنصور ومنا المهدي»، وقد سمّى المنصور ابنه المهدي إيهاماً بأنه المهدي المنتظر {cite:duha-islam p. 871-873, 876}."
  en: "The Mahdiyya — the awaited twelfth imam who fills the earth with justice; opposed in the Umayyad claim to a 'Sufyani' and absorbed in the Abbasid coining of a 'Mahdi' of their own {cite:duha-islam p. 871-873}."
