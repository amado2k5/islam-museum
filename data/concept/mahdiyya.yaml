id: concept/mahdiyya
class: concept
kind: doctrine
label:
  ar: المهدية
  en: The doctrine of the awaited Mahdi (al-mahdiyya)
  ur: المهدي
  es: "La doctrina del Mahdi esperado (al-mahdiyya)"
  fr: "La doctrine du Mahdi attendu (al-mahdiyya)"
  tr: "Mahdia"
  id: "Mahdia"
summary:
  ur: آخرِ زمان میں اہلِ بیت کا امام جو زمین کو انصاف سے بھر دے گا جیسا کہ وہ جور
    سے بھری ہو۔
  ar: 'عقيدة المهدي المنتظر من أبرز معالم المذهب عند الإمامية: هو الإمام الثاني عشر
    الذي يملأ الأرض عدلاً وقسطاً كما ملئت جوراً وظلماً، يُبايَع بمكة بين الركن والمقام،
    ويتصل بها القول بالرجعة — رجوع الأئمة وخصومهم إلى الدنيا بعد ظهوره. ورأى أحمد
    أمين أن فكرة المهدي جابهتها أخبار مقابلة: للأمويين «السفياني» الذي خرج به أبو
    محمد بن عبد الله بن يزيد بن معاوية فجمع أهل قنسرين وحمص وتدمر قبل أن يهزمه المنصور،
    ووُضعت للعباسيين أحاديث كحديث «منا أهل البيت أربعة: منا السفاح ومنا المنذر ومنا
    المنصور ومنا المهدي»، وقد سمّى المنصور ابنه المهدي إيهاماً بأنه المهدي المنتظر
    {cite:duha-islam p. 871-873, 876}.'
  en: The Mahdiyya — the awaited twelfth imam who fills the earth with justice; opposed
    in the Umayyad claim to a 'Sufyani' and absorbed in the Abbasid coining of a 'Mahdi'
    of their own {cite:duha-islam p. 871-873}.
  es: "La Mahdiyya — el esperado duodécimo imán que llenará la tierra de justicia; opuesto en la pretensión omeya de un 'Sufyani' y absorbido en la creación abasí de un 'Mahdi' propio {cite:duha-islam p. 871-873}."
  fr: "La Mahdiyya — le douzième imam attendu qui remplit la terre de justice; opposée dans la revendication omeyyade d'un « Sufyani » et absorbée dans la création par les Abbassides d'un « Mahdi » de leur propre création {cite: duha-islam p. 871-873}."
  tr: "Beklenen Mehdi Doktrini, İmam okulunun en belirgin özelliklerinden biridir: o, yeryüzüne adalet ve hakkaniyetle dolduran on ikinci İmamdır; oysa yeryüzü adaletsizlik ve zulümle doludur. Direk ile mevk arasında, karşılığında imamların ve rakiplerinin dünyaya dönüşüne olan inançla Mekke'ye bağlılık yemini etti. Ahmed Amin, Mehdi fikrinin karşıt haberlerle karşı karşıya olduğunu düşünüyordu: Emeviler, 'el-Sufyani', Ebu Muhammed bin Abdullah ibn Yezid ibn Muaviye ile birlikte ortaya çıktı ve el-Mansur onu yenmeden önce Qinnasrin, Homs ve Palmyra halkını topladı. Abbasilerin, 'Aramızda Ehlül-Beyt vardır, dördü vardır: aramızda kasap, aramızda el-Mundhir ve aramızda zafer Mehdi vardır.' gibi hadisler vardır. El-Mansur yanlışlıkla oğlu el-Mehdi'yi beklenen Mehdi olarak adlandırmıştır {atıf:Duha-İslam, s. 871-873, 876}."
  id: "Doktrin Mahdi yang Dinanti adalah salah satu ciri paling menonjol dari mazhab Imami: ia adalah Imam kedua belas yang memenuhi bumi dengan keadilan dan keseimbangan seperti halnya dunia yang dipenuhi ketidakadilan dan penindasan. Ia bersumpah setia kepada Mekah antara pilar dan stasiun, terhubung dengannya melalui kepercayaan sebagai balasan—kembalinya para Imam dan lawan mereka ke dunia setelah kemunculannya. Ahmad Amin percaya bahwa gagasan Mahdi dihadapkan oleh laporan yang berlawanan: dari Umayyah, 'al-Sufyani,' yang bersama Abu Muhammad ibn Abdullah ibn Yazid ibn Muawiya muncul, mengumpulkan rakyat Qinnasrin, Homs, dan Palmyra sebelum al-Mansur mengalahkannya. Bangsa Abbasiyah memiliki hadits seperti 'Di antara kami ada Ahl al-Bayt, empat: di antara kami ada pembantun, di antara kami al-Mundhir, dan di antara kami adalah Mahdi yang menang.' Al-Mansur keliru menyebut putranya al-Mahdi sebagai Mahdi yang dinantikan {cite:Duha-Islam, hlm. 871-873, 876}."
