  id: jumhur-mahdi-established
  stance:
    ar: ظهور المهدي في آخر الزمان ثابت عند جمهور أهل السنة بأحاديث بلغت عندهم حد التواتر
      المعنوي
    en: The Mahdi's appearance is established for most Sunni scholars on reports reaching
      mutawatir ma'nawi
  summary:
    ar: أجمع علماء الحديث عند جمهور الأمة على أن الأخبار في المهدي من أهل البيت وردت
      من طرق كثيرة تفيد اليقين عندهم، وأنه يظهر قبل عيسى ويملأ الأرض عدلًا {cite:sunan-abi-dawud}
      {cite:sunan-ibn-majah}.
    en: Hadith scholars of the community's majority agree that reports of a Mahdi
      from the Prophet's house came through many routes conveying certainty, and that
      he appears before Isa and fills the earth with justice {cite:sunan-abi-dawud}
      {cite:sunan-ibn-majah}.
