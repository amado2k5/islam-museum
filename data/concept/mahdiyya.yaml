  stance:
    ar: ابن خلدون شكك في صحة كثير من أحاديث المهدي وعدّ أشهرها ضعيفًا
    en: Ibn Khaldun doubted the soundness of many Mahdi reports and judged famous
      ones weak
  summary:
    ar: نقّد ابن خلدون في مقدمته إسناد أحاديث المهدي المشهورة وبيّن ضعف كثير منها،
      مع إقراره بشيوع الخبر بين العامة {cite:muqaddimat-ibn-khaldun}.
    en: In the Muqaddima Ibn Khaldun critiqued the isnads of the famous Mahdi reports,
      showing weakness in many, while conceding the report's prevalence among the
      populace {cite:muqaddimat-ibn-khaldun}.
