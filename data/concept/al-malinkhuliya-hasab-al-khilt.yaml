id: concept/al-malinkhuliya-hasab-al-khilt
class: concept
kind: scientific
label:
  ar: "المالنخوليا بحسب الخلط الفاعل لها"
  en: "Melancholia by the humour that makes it"
  fr: "La mélancolie selon l’humeur qui la produit"
  ur: "فاعل خلط کے لحاظ سے مالنخولیا"
summary:
  ar: "يقول ابن سينا إن السوداء الفاعلة للمالنخوليا إن كانت دموية كان معها فرح وضحك، وإن كانت من بلغم كان كسل وسكون، وإن كانت من صفراء كان اضطراب وأدنى جنون، وإن كانت سوداء صرفاً كان الفكر كثيراً {cite:canon-ibn-sina-print-v2 p.107}"
  en: "Ibn Sina says that if the black bile that makes melancholia is bloody it comes with joy and laughter, if from phlegm with laziness and stillness, if from bile with agitation and a touch of madness, and if pure black bile there is much thought {cite:canon-ibn-sina-print-v2 p.107}"
  fr: "Ibn Sina dit que si la bile noire qui produit la mélancolie est sanguine, elle s’accompagne de joie et de rire, si elle vient du phlegme, de paresse et d’immobilité, si elle vient de la bile, d’agitation et d’une pointe de folie, et si c’est de la bile noire pure, la réflexion y est abondante {cite:canon-ibn-sina-print-v2 p.107}"
  ur: "ابن سینا کہتا ہے کہ مالنخولیا بنانے والا سودا اگر دموی ہو تو خوشی اور ہنسی ساتھ ہوتی ہے، بلغم سے ہو تو سستی اور سکون، صفراء سے ہو تو اضطراب اور ہلکا جنون، اور خالص سودا ہو تو فکر بہت ہوتی ہے {cite:canon-ibn-sina-print-v2 p.107}۔"
