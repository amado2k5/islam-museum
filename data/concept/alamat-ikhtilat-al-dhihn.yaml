id: concept/alamat-ikhtilat-al-dhihn
class: concept
kind: scientific
label:
  ar: "علامات اختلاط الذهن بحسب سببه"
  en: "Signs of confusion of the mind by its cause"
  fr: "Signes de la confusion de l’esprit selon sa cause"
  ur: "ذہن کی گڑبڑ کی علامات اس کے سبب کے مطابق"
  es: "Signos de confusión mental por su causa"
  tr: "Zihnin Sebebine Göre Karıştığı Belirtiler"
  id: "Gejala yang membingungkan pikiran berdasarkan penyebabnya"
summary:
  ar: "يذكر ابن سينا علامات اختلاط الذهن بحسب سببه: السوداء، والصفراء، والحمراء، والحر واليبس الساذج، والبلغم العفن، والبخار المتصاعد من عضو {cite:canon-ibn-sina-print-v2 p.97}"
  en: "Ibn Sina gives the signs of confusion of the mind by its cause: black bile, yellow bile, the red, simple heat and dryness, putrefied phlegm, and vapour rising from an organ {cite:canon-ibn-sina-print-v2 p.97}"
  fr: "Ibn Sina donne les signes de la confusion de l’esprit selon sa cause : la bile noire, la bile jaune, le rouge, la chaleur et la sécheresse simples, le phlegme putréfié et la vapeur qui s’élève d’un organe. {cite:canon-ibn-sina-print-v2 p.97}"
  ur: "ابن سینا ذہن کی گڑبڑ کی علامات اس کے سبب کے مطابق بتاتا ہے: سودا، صفراء، سرخ، سادہ گرمی اور خشکی، سڑا ہوا بلغم، اور کسی عضو سے اٹھتا ہوا بخار {cite:canon-ibn-sina-print-v2 p.97}۔"
  es: "Ibn Sina da los signos de confusión mental según su causa: bilis negra, bilis amarilla, la roja, calor y sequedad simples, flema putrefacta y vapor que emana de un órgano {cite:canon-ibn-sina-print-v2 p.97}"
  tr: "İbn Sina, sebebine göre zihinsel karmaşa belirtilerini belirtir: siyah, sarı, kırmızı, sıcaklık, saf kuruluk, çürümüş balgam ve organdan yükselen buhar {atıf:kanon-ibn-sina-print-v2 s.97}"
  id: "Ibn Sina mengidentifikasi gejala kebingungan mental berdasarkan penyebabnya: hitam, kuning, merah, panas, kekeringan murni, dahak busuk, dan uap yang naik dari organ {kutipan: kanon-ibn-sina-print-v2 hlm.97}"
