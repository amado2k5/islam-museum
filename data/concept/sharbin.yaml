summary:
  ar: "الشربين في الكتاب هو شجرة القطران، من جنس شجرة الصنوبر، لها ثمرة كثمرة السرو أصغر منها ولها شوكة وهي نوعان طويل وقصير، وفي قشرها قبض، وقال ديسقوريدوس إن للقطران قوة قابضة مخالفة للعفن تقبض الأجساد الحية وتحفظ الميتة، وثمرتها تنفع من السعال وتنفع الكبد وهي رديئة للمعدة لذاعة لها، ومن أكثر منها صدع، وتنفع من تقطير البول، وتحبس البطن، ويذكر الكتاب نقلا موسوما تبخير قشرها للجنين والمشيمة {cite:canon-ibn-sina-print-v1 pp.681-682}"
  en: "Sharbin is in the book the tree of qatran, of the genus of the pine, with a fruit like the cypress fruit but smaller and a thorn, in two kinds, tall and short; its bark has astringency, and Dioscorides said that qatran has an astringent power that opposes putrefaction, tightening living bodies and preserving dead ones; its fruit benefits cough and the liver but is bad for the stomach, stinging it, and whoever takes much of it gets a headache; it benefits dribbling of urine and binds the belly; and the book lists, as a labelled report, the fumigation of its bark for the foetus and the placenta {cite:canon-ibn-sina-print-v1 pp.681-682}"
  ur: "شربین کتاب میں قطران کا درخت ہے، صنوبر کی جنس سے، اس کا پھل سرو کے پھل جیسا مگر اس سے چھوٹا ہے اور اس میں کانٹا ہے، اور اس کی دو قسمیں ہیں لمبی اور چھوٹی؛ اس کی چھال میں قبض ہے، اور دیسقوریدوس نے کہا کہ قطران میں قابض قوت ہے جو سڑاند کی ضد ہے، زندہ جسموں کو سکیڑتی اور مردہ جسموں کو محفوظ رکھتی ہے؛ اس کا پھل کھانسی اور جگر کے لیے نافع ہے مگر معدے کے لیے برا ہے اور اسے چبھتا ہے، اور جو اسے زیادہ لے اسے سر درد ہوتا ہے؛ قطرہ قطرہ پیشاب آنے میں نافع ہے اور پیٹ کو روکتا ہے؛ اور کتاب منقول فہرست کے طور پر اس کی چھال کی دھونی جنین اور نال کے لیے درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.681-682}۔"
  es: "En el libro, Sharbin es el árbol de qatrán, del género del pino, con un fruto parecido al del ciprés pero más pequeño y una espina, de dos tipos, alta y corta; su corteza es astringente, y Dioscórides dijo que el qatrán tiene un poder astringente que se opone a la putrefacción, tensando los cuerpos vivos y preservando los muertos; su fruto es beneficioso para la tos y el hígado, pero es malo para el estómago, ya que lo irrita, y quien lo ingiere en grandes cantidades sufre dolor de cabeza; es beneficioso para la incontinencia urinaria y tensa el abdomen; y el libro enumera, como un informe detallado, la fumigación de su corteza para el feto y la placenta {cite:canon-ibn-sina-print-v1 pp.681-682}"
  fr: "Le livre mentionne le pin de Srinagar, un arbre du genre Pinacophora, dont le fruit ressemble à celui du cyprès mais est plus petit et épineux. Il existe deux variétés de pins, grands et petits. Son écorce est astringente, et Dioscoride affirmait que le pin de Srinagar possède des propriétés astringentes qui combattent la putréfaction, resserrent les corps vivants et préservent les morts. Son fruit est bénéfique contre la toux et pour le foie, mais irrite l'estomac, et une consommation excessive provoque des maux de tête. Il est également bénéfique en cas d'incontinence urinaire et tonifie l'estomac. Enfin, le livre rapporte, sous forme de note, la fumigation de son écorce pour le fœtus et le placenta. {cite:canon-ibn-sina-print-v1 pp.681-682}"
