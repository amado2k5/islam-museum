label:
  ar: "بنقسة"
  en: "Banqasa (a legume-like seed)"
  fr: "Banqasa (graine proche des légumineuses)"
  ur: "بنقسہ"
  es: "Banqasa (una semilla similar a una leguminosa)"
summary:
  ar: "حبّ في قوة العدس، أعسر منه انهضاماً، قابض ويولّد السوداء، وجيد للمفاصل إذا ضُمّد به القيل والفتوق للصبيان، ويعقل البطن {cite:canon-ibn-sina-print-v1 p.402}."
  en: "A seed of about the power of lentil, harder to digest. It is astringent, produces black bile, is good for the joints when used on swellings and hernias in boys, and binds the bowel {cite:canon-ibn-sina-print-v1 p.402}."
  fr: "Graine dont le pouvoir approche celui de la lentille, plus difficile à digérer. Elle est astringente, produit de la bile noire, serait utile aux articulations appliquée sur gonflements et hernies des garçons, et resserre l’intestin {cite:canon-ibn-sina-print-v1 p.402}."
  ur: "ایک بیج جس کی قوت مسور جیسی ہے مگر ہضم میں اس سے مشکل۔ یہ قابض ہے، سودا پیدا کرتا ہے، جوڑوں کے لیے اچھا ہے، لڑکوں کے ورم اور فتق پر لگایا جاتا ہے، اور پیٹ کو باندھتا ہے {cite:canon-ibn-sina-print-v1 p.402}۔"
  es: "Una semilla con un poder similar al de una lenteja, pero más difícil de digerir. Es astringente, produce bilis negra, es buena para las articulaciones cuando se usa en hinchazones y hernias en niños, y ayuda a regular el tránsito intestinal {cite:canon-ibn-sina-print-v1 p.402}."
