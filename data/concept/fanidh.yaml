summary:
  ar: "الفانيذ في الكتاب عصارة قصب مطبوخة إلى أن تثخن، لا يعمل إلا ببلاد مكران من ناحية كرمان ويحمل منها إلى البلاد، أجوده الأبيض الرقاق الحراني، حار رطب في الأولى، أغلظ من السكر وأحر، جيد للسعال ومليّن للبطن {cite:canon-ibn-sina-print-v1 p.624}"
  en: "Fanidh is in the book the juice of cane cooked until it thickens, made only in the land of Makran in the region of Kirman and carried from there to other lands; the best is the white, thin, Harrani kind, hot and moist in the first degree, thicker than sugar and much hotter, good for cough and softening the bowels {cite:canon-ibn-sina-print-v1 p.624}"
  ur: "فانیذ کتاب میں گنے کا رس ہے جو گاڑھا ہونے تک پکایا جائے، صرف کرمان کے علاقے میں مکران کے ملک میں بنایا جاتا اور وہاں سے دوسرے ملکوں کو لایا جاتا ہے؛ بہترین سفید، پتلا حرانی ہے، پہلے درجے میں گرم تر ہے، شکر سے گاڑھا اور بہت گرم ہے، کھانسی کے لیے اچھا اور پیٹ کو نرم کرنے والا ہے {cite:canon-ibn-sina-print-v1 p.624}۔"
