label: { ar: "المُيَاوَمة", en: "Hiring by the day (muyawama)", ur: "مُیاومہ ⁦(روزانہ کی بنیاد پر اجارہ)⁩", es: "Contratación por día (muyawama)", fr: "Embauche à la journée (muyawama)", tr: "günlük", id: "harian" }
summary:
  ar: "المياومة في اللغة معاملة الشخص بالأيام، وهي تحديد مدة المنفعة بيوم أو أيام، وقد اتفق الفقهاء على جوازها إذا اتفق عليها الطرفان. واليوم محدد شرعاً بالزمان الممتد من طلوع الفجر الثاني إلى غروب الشمس، وقد يحدد بالعرف كما في مجلة الأحكام العدلية. وتفترق المياومة عن الأجل والتأقيت والمشاهرة في أن المياومة تحدد بالأيام، وأن محلها المنفعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15348}"
  en: "Muyawama means dealing with a person by the day: fixing the period of a use to one day or several days. The jurists agree that it is lawful when both parties accept it. The legal day runs from the second dawn to sunset, though custom may fix it differently, as the Majalla does for a worker hired for a day. Muyawama differs from a fixed term (ajal), from a time limit (ta'qit), and from monthly hiring (mushahara), in that its unit is the day and its object is the use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15348}"
  ur: "مُیاومہ کا مطلب ہے کسی سے دنوں کے حساب سے معاملہ کرنا، یعنی منفعت کی مدت ایک دن یا چند دن مقرر کرنا۔ فقہاء کے اتفاق سے، فریقین کی رضامندی سے یہ جائز ہے۔ دن کی حد فجر ثانی سے غروبِ آفتاب تک ہے، اور عرف بھی اس کا تعین کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15348}"
  es: "Muyawama significa tratar con una persona por día: fijar el período de uso a uno o varios días. Los juristas coinciden en que es lícito cuando ambas partes lo aceptan. El día legal abarca desde el segundo amanecer hasta el atardecer, aunque la costumbre puede establecerlo de manera diferente, como lo hace el Majalla para un trabajador contratado por un día. Muyawama se diferencia de un plazo fijo (ajal), de un límite de tiempo (ta'qit) y de la contratación mensual (mushahara), en que su unidad es el día y su objeto es el uso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15348}"
  fr: "Muyawama signifie conclure un contrat journalier: fixer la durée d’une prestation à un ou plusieurs jours. Les juristes s’accordent à dire que cette pratique est licite lorsque les deux parties y consentent. Le jour légal s’étend de la seconde aube au coucher du soleil, bien que la coutume puisse le fixer différemment, comme le fait la Majalla pour un travailleur embauché à la journée. Muyawama se distingue d’un contrat à durée déterminée (ajal), d’une durée limitée (ta’qit) et d’un contrat mensuel (mushahara) par le fait que son unité est le jour et son objet, la prestation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15348}"
  tr: "Dilbilimde 'miyawwum', bir kişinin günlerle muamele edilmesi anlamına gelir; bu, fayda süresini bir veya daha fazla gün olarak belirtmektir. Hukukçular, her iki tarafın da kabul etmesi halinde izin verilebileceği konusunda anlaşmışlardır. Bir gün, dini olarak ikinci şafağın doğuşundan gün batımına kadar olan süreyle tanımlanır ve Yargı Kuralları Günlüğü'nde olduğu gibi gelenekle belirtilebilir. 'Miyyammah', 'majma', 'taqtiyat' ve 'mamsharah'dan farklıdır; çünkü 'miywam' günlerle tanımlanır ve yeri faydadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15348}"
  id: "Dalam linguistik, 'miyawwum' berarti memperlakukan seseorang berdasarkan hari, yaitu menentukan durasi manfaat selama satu atau lebih hari. Para ahli hukum telah menyepakati bahwa manfaat tersebut diperbolehkan jika kedua pihak sepakat. Hari secara religius didefinisikan oleh waktu dari terbit fajar kedua hingga matahari terbenam, dan dapat ditentukan sesuai adat, seperti dalam Jurnal Aturan Yudisial. 'Miyyammah' berbeda dari 'majma', 'taqtiyat', dan 'mamsharah' karena 'miywam' didefinisikan oleh hari, dan tempatnya adalah manfaat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15348}"
