id: concept/muyawama
class: concept
kind: legal
label: { ar: "المُيَاوَمة", en: "Hiring by the day (muyawama)", ur: "مُیاومہ (روزانہ کی بنیاد پر اجارہ)" }
summary:
  ar: "المياومة في اللغة معاملة الشخص بالأيام، وهي تحديد مدة المنفعة بيوم أو أيام، وقد اتفق الفقهاء على جوازها إذا اتفق عليها الطرفان. واليوم محدد شرعاً بالزمان الممتد من طلوع الفجر الثاني إلى غروب الشمس، وقد يحدد بالعرف كما في مجلة الأحكام العدلية. وتفترق المياومة عن الأجل والتأقيت والمشاهرة في أن المياومة تحدد بالأيام، وأن محلها المنفعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15348}"
  en: "Muyawama means dealing with a person by the day: fixing the period of a use to one day or several days. The jurists agree that it is lawful when both parties accept it. The legal day runs from the second dawn to sunset, though custom may fix it differently, as the Majalla does for a worker hired for a day. Muyawama differs from a fixed term (ajal), from a time limit (ta'qit), and from monthly hiring (mushahara), in that its unit is the day and its object is the use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15348}"
  ur: "مُیاومہ کا مطلب ہے کسی سے دنوں کے حساب سے معاملہ کرنا، یعنی منفعت کی مدت ایک دن یا چند دن مقرر کرنا۔ فقہاء کے اتفاق سے، فریقین کی رضامندی سے یہ جائز ہے۔ دن کی حد فجر ثانی سے غروبِ آفتاب تک ہے، اور عرف بھی اس کا تعین کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15348}"
