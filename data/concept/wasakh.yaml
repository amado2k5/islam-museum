label:
  ar: "وَسَخ"
  en: "Grime and soot (wasakh)"
  ur: "میل اور کالک ⁦(وسخ)⁩"
summary:
  ar: "الوسخ هو ما يجتمع من الكور والحمام وأبدان المصارعين وحيطان الصراع، وهو يحلّل وينضج باعتدال، ويجذب السلاء والشوك، وينفع من عرق النسا والقروح والخراجات. {cite:canon-ibn-sina-print-v1 p.454}"
  en: "Wasakh is what gathers from the furnace, the bath, the bodies of wrestlers and the walls of the arena; it resolves and ripens gently, draws out splinters and thorns, and helps sciatica, ulcers and abscesses. {cite:canon-ibn-sina-print-v1 p.454}"
  ur: "وسخ وہ میل ہے جو بھٹی، حمام، پہلوانوں کے بدنوں اور اکھاڑے کی دیواروں پر جمع ہوتا ہے؛ یہ اعتدال سے تحلیل اور پکاتا ہے، کانٹے اور پھانسیں کھینچتا ہے، اور عرق النسا، السر اور پھوڑوں میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.454}"
