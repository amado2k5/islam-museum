id: concept/al-arabiyya-fi-sudan
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في السودان"
  en: "Arabic in Sudan"
  ur: "سوڈان میں عربی"
  fr: "L'arabe au Soudan"
  es: "El árabe en Sudán"
  tr: "Sudan'da Arapça"
  id: "Bahasa Arab di Sudan"
summary:
  ar: "مكانة العربية في السودان كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: العربية والإنجليزية لغتان رسميتان، وللنوبية والبجاوية والفورية ذكر في الكتاب، وتروي الموسوعة سيادة العربية في الشمال وهجرة القبائل العربية جنوباً ونوبة النيل المستعربة ومدارس الفور القرآنية. ولا تقول الصفحتان شيئاً عن اللهجة السودانية ولا عن أعداد المتكلمين. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "The place of Arabic in Sudan as the Encyclopaedia Britannica and The World Factbook state it: Arabic and English are official, the Factbook names Nubian, Ta Bedawie and Fur, and the encyclopedia tells of the ascendancy of Arabic in the north, the southward move of Arab nomads, the Arabized Nubians of the Nile and Qur'anic schools among the Fur. The pages say nothing on the Sudanese dialect or on numbers of speakers. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "سوڈان میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: عربی اور انگریزی سرکاری ہیں، فیکٹ بک نوبی، تا بداوی اور فور کے نام لیتی ہے، اور برٹانیکا شمال میں عربی کے غلبے، عرب بدوؤں کی جنوب کی ہجرت، نیل کے عربی اثر والے نوبیوں اور فور قوم کے قرآنی مدارس کا ذکر کرتی ہے۔ دونوں صفحات سوڈانی لہجے اور بولنے والوں کی تعداد کے بارے میں کچھ نہیں کہتے۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "La place de l'arabe au Soudan selon l'Encyclopaedia Britannica et The World Factbook : l'arabe et l'anglais sont officiels, le Factbook nomme le nubien, le ta bedawie et le four, et l'encyclopédie raconte l'ascendant de l'arabe dans le nord, la migration des nomades arabes vers le sud, les Nubiens arabisés du Nil et les écoles coraniques des Four. Les pages ne disent rien du dialecte soudanais ni du nombre de locuteurs. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "El lugar del árabe en Sudán según la Encyclopaedia Britannica y The World Factbook: el árabe y el inglés son oficiales, el Factbook nombra el nubio, el ta bedawie y el fur, y la enciclopedia cuenta el predominio del árabe en el norte, el desplazamiento de nómadas árabes hacia el sur, los nubios arabizados del Nilo y las escuelas coránicas entre los fur. Las páginas no dicen nada del dialecto sudanés ni del número de hablantes. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
  tr: "Arapçanın Sudan'daki durumu, İngiliz Ansiklopedisi ve Facts of the World kitabı Arapça ile Arapça resmi dillerdir; kitapta Nubice, Bejawi ve Furian dilleri de geçer. Ansiklopedi, kuzeyde Arapça'nın hakimiyetini, Arap kabilelerinin güneye göçünü, Araplaşmış Nil Baskını'nı ve Kur'an Kürk okullarını anlatır. İki sayfa Sudan lehçesi veya konuşulan sayısı hakkında hiçbir şey söylememektedir. Anayasa kararının metni, müzenin sayfada doğrulamadığı bir araştırma özetinde yer aldığı için orijinal dilinde eklenmiştir."
  id: "Status bahasa Arab di Sudan, Ensiklopedia Inggris, dan buku Facts of the World are Arabic dan bahasa Arab adalah bahasa resmi; buku ini juga membahas bahasa Nubia, Bejawi, dan Furian. Ensiklopedia ini menggambarkan dominasi bahasa Arab di utara, migrasi suku Arab ke selatan, Serangan Nil yang diarabadikan, dan sekolah bulu Quranik. Dialek Sudan dua halaman tidak menyebutkan jumlah orang yang digunakan. Teks keputusan konstitusional ditambahkan dalam bahasa aslinya karena disertakan dalam ringkasan penelitian yang tidak diverifikasi oleh museum di halaman tersebut."
