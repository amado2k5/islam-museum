id: concept/pigeon-post
class: concept
kind: political
label: { ar: "الحمام الرسائلي ⁦(البطائق)⁩", en: "The pigeon post", ur: "نامہ بر کبوتر ⁦(بطائق)⁩", es: "El correo de palomas", fr: "Le pigeonnier", tr: "Mesaj Banyosu (kartlar)", id: "Message Bath (kartu)" }
summary:
  ar: "نظام حمل المكاتبات على الحمام الرسائلي، المسمى «الهدي»، يصفه القلقشندي في خاتمة «صبح الأعشى»: اعتنى به خلفاء بني العباس وتنافس فيه أهل البصرة حتى بلغ الطائر سبعمائة دينار، ونُقل إلى مصر والشام من الموصل في عهد نور الدين زنكي سنة 565هـ، وأفرد له الفاطميون ديواناً وجرائد بأنسابه، ونظّمه المماليك في أبراج من قلعة الجبل إلى غزة ودمشق وحلب، ثم يقول القلقشندي: «وقد تعطّل تدريج الحمام الآن» {cite:subh-al-asha-cairo-v14 p.389} {cite:subh-al-asha-cairo-v14 p.390} {cite:subh-al-asha-cairo-v14 p.392} {cite:subh-al-asha-cairo-v14 p.394}."
  en: "The carrying of letters by messenger pigeons, called al-hady, as al-Qalqashandi describes it in the conclusion of Subh al-a'sha: the Abbasid caliphs cared for it and the people of Basra competed over it until a bird fetched seven hundred dinars; it was brought to Egypt and Syria from Mosul under Nur al-Din Zangi in 565 AH; the Fatimids gave it its own office and pedigree registers; the Mamluks organised it in a chain of towers from the Citadel to Gaza, Damascus and Aleppo; and al-Qalqashandi adds: 'the relaying of pigeons has now lapsed'."
  es: "El transporte de cartas mediante palomas mensajeras, llamado al-hady, como lo describe al-Qalqashandi en la conclusión de Subh al-a'sha: los califas abasíes se ocupaban de ello y la gente de Basora competía por él hasta que un ave alcanzó los setecientos dinares; fue llevado a Egipto y Siria desde Mosul bajo el mando de Nur al-Din Zangi en el año 565 de la Hégira; los fatimíes le dieron su propia oficina y registros genealógicos; los mamelucos lo organizaron en una cadena de torres desde la Ciudadela hasta Gaza, Damasco y Alepo; y al-Qalqashandi añade: \"el relevo de palomas ha cesado\"."
  fr: "Le transport des lettres par pigeons voyageurs, appelés al-hady, tel que décrit par al-Qalqashandi dans la conclusion de Subh al-a'sha: les califes abbassides s'en sont occupés et les habitants de Bassora se disputaient ce service jusqu'à ce qu'un pigeon atteigne le prix de sept cents dinars; il fut introduit en Égypte et en Syrie depuis Mossoul sous Nur al-Din Zangi en 565 AH; les Fatimides lui attribuèrent un bureau et des registres généalogiques; les Mamelouks l'organisèrent en une chaîne de tours reliant la Citadelle à Gaza, Damas et Alep; et al-Qalqashandi ajoute: « le relais par pigeons voyageurs a aujourd'hui disparu »."
  ur: "قاصد کبوتروں کے خطوط کو لے جانا، جسے الحدی کہتے ہیں، جیسا کہ القاشندی نے سبھ العشاء کے آخر میں بیان کیا ہے: عباسی خلفاء نے اس کی دیکھ بھال کی اور بصرہ کے لوگوں نے اس پر مقابلہ کیا یہاں تک کہ ایک پرندہ سات سو دینار لے آیا؛ اسے 565 ہجری میں نورالدین زنگی کے ماتحت موصل سے مصر اور شام لایا گیا تھا۔ فاطمیوں نے اسے اپنا دفتر اور نسب کا رجسٹر دیا۔ مملوکوں نے اسے قلعہ سے غزہ، دمشق اور حلب تک میناروں کی ایک زنجیر میں منظم کیا۔ اور القلقاشندی نے مزید کہا: 'کبوتروں کی بازیابی اب ختم ہو گئی ہے'۔"
  tr: "Mektup güvercinleri üzerinde yazışma taşıma sistemi, 'Al-Hadi' olarak adlandırılır ve el-Kalqashandi tarafından 'Subh al-A'sha' eserinin sonunda şöyle anlatılır: Abbasi halifeleri tarafından bakılıyordu ve Basra halkı, kuş yedi yüz dinara ulaşana kadar bu sistemde yarıştı. 565 H. Nüreddin Zengi döneminde Musul'dan Mısır ve Levant'a nakledildi. Fatımiler ona soy ağacı içeren bir koleksiyon ve gazeteler adadı, Memlükler ise Qala'at al-Cabal'dan Gazze, Şam ve Halep'e kadar kuleler halinde organize etti. Sonra el-Kalqashandi şöyle der: \"Banyo gradyanı artık düzensiz\" {cite:subh-al-asha-cairo-v14 s.389} {cite:subh-al-asha-cairo-v14 s.390} {cite:subh-al-asha-cairo-v14 s.392} {cite:subh-al-asha-cairo-v14 s.394}."
  id: "Sistem pengiriman surat-surat pada burung merpati, yang disebut 'Al-Hadi,' dijelaskan oleh al-Qalqashandi dalam kesimpulan 'Subh al-A'sha': Sistem ini dirawat oleh khalifah Abbasiyah, dan masyarakat Basra bersaing di dalamnya hingga burung itu mencapai tujuh ratus dinar. Burung ini dipindahkan ke Mesir dan Levant dari Mosul pada masa pemerintahan Nur al-Din Zangi pada tahun 565 H. Fatimiyah mendedikasikan koleksi dan surat kabar untuk burung ini dengan silsilah, dan Mamluk mengaturnya dalam menara dari Qala'at al-Jabal hingga Gaza, Damaskus, dan Aleppo. Kemudian al-Qalqashandi berkata: \"Gradien kamar mandi sekarang tidak berurutan\" {cite:subh-al-asha-cairo-v14 hlm.389} {cite:subh-al-asha-cairo-v14 hlm.390} {cite:subh-al-asha-cairo-v14 hlm.392} {cite:subh-al-asha-cairo-v14 hlm.394}."
