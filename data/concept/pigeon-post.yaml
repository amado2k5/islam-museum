label: { ar: "الحمام الرسائلي (البطائق)", en: "The pigeon post", ur: "نامہ بر کبوتر (بطائق)" }
summary:
  ar: "نظام حمل المكاتبات على الحمام الرسائلي، المسمى «الهدي»، يصفه القلقشندي في خاتمة «صبح الأعشى»: اعتنى به خلفاء بني العباس وتنافس فيه أهل البصرة حتى بلغ الطائر سبعمائة دينار، ونُقل إلى مصر والشام من الموصل في عهد نور الدين زنكي سنة 565هـ، وأفرد له الفاطميون ديواناً وجرائد بأنسابه، ونظّمه المماليك في أبراج من قلعة الجبل إلى غزة ودمشق وحلب، ثم يقول القلقشندي: «وقد تعطّل تدريج الحمام الآن» {cite:subh-al-asha-cairo-v14 p.389} {cite:subh-al-asha-cairo-v14 p.390} {cite:subh-al-asha-cairo-v14 p.392} {cite:subh-al-asha-cairo-v14 p.394}."
  en: "The carrying of letters by messenger pigeons, called al-hady, as al-Qalqashandi describes it in the conclusion of Subh al-a'sha: the Abbasid caliphs cared for it and the people of Basra competed over it until a bird fetched seven hundred dinars; it was brought to Egypt and Syria from Mosul under Nur al-Din Zangi in 565 AH; the Fatimids gave it its own office and pedigree registers; the Mamluks organised it in a chain of towers from the Citadel to Gaza, Damascus and Aleppo; and al-Qalqashandi adds: 'the relaying of pigeons has now lapsed'."
