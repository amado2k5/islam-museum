id: concept/idlal-al-ghayr
class: concept
kind: doctrine
label:
  ar: إضلال الغير وحمل وزره
  en: Misleading others and bearing their burden
summary:
  ar: "يرى الشعراوي أن الضلال يأتي على معانٍ، منها الذهاب في الشيء والفناء فيه، ومنها عدم الاهتداء إلى وجه الحق، ومنها أن يعرف الإنسان المنهج ثم ينحرف عنه. وأن من يضل ويضل غيره يزداد وزراً بإضلاله، ويجمع بين أوزار الضلال الذاتي وأوزار إضلال غيره، ويفسّر بذلك الفرق بين آية فاطر وآية النحل. ويقرأ الآية التي تذكر طائفة من أهل الكتاب ودّت أن تضل المؤمنين بأنهم لا يضلون إلا أنفسهم، دون أن يتم ذلك {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1532}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1534}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1535}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1536}."
  en: "Sha'rawi holds that misguidance has several senses: going astray and being lost in a thing, failing to reach the truth, and knowing the law and then turning from it. Someone who misleads and also misleads others increases his burden by leading others astray. He uses this to distinguish two verses about bearing burdens. He reads the verse about a group among the People of the Book who wished to lead the believers astray as saying they lead only themselves astray, without success in the wider aim {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1532}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1534}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1535}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1536}."
