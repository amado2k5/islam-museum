id: concept/idlal-al-ghayr
class: concept
kind: doctrine
label:
  ar: إضلال الغير وحمل وزره
  en: Misleading others and bearing their burden
  es: "Engañar a otros y cargar con su peso."
  fr: "Induire les autres en erreur et porter leur fardeau"
  ur: "دوسروں کو گمراہ کرنا اور ان کا بوجھ اٹھانا"
  tr: "Başkalarını kandırmak ve yükü taşımak"
  id: "Menipu orang lain dan memikul beban"
summary:
  ar: "يرى الشعراوي أن الضلال يأتي على معانٍ، منها الذهاب في الشيء والفناء فيه، ومنها عدم الاهتداء إلى وجه الحق، ومنها أن يعرف الإنسان المنهج ثم ينحرف عنه. وأن من يضل ويضل غيره يزداد وزراً بإضلاله، ويجمع بين أوزار الضلال الذاتي وأوزار إضلال غيره، ويفسّر بذلك الفرق بين آية فاطر وآية النحل. ويقرأ الآية التي تذكر طائفة من أهل الكتاب ودّت أن تضل المؤمنين بأنهم لا يضلون إلا أنفسهم، دون أن يتم ذلك {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1532}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1534}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1535}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1536}."
  en: "Sha'rawi holds that misguidance has several senses: going astray and being lost in a thing, failing to reach the truth, and knowing the law and then turning from it. Someone who misleads and also misleads others increases his burden by leading others astray. He uses this to distinguish two verses about bearing burdens. He reads the verse about a group among the People of the Book who wished to lead the believers astray as saying they lead only themselves astray, without success in the wider aim {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1532}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1534}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1535}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1536}."
  es: "Sha'rawi sostiene que el extravío tiene varios sentidos: extraviarse y perderse en algo, no alcanzar la verdad y conocer la ley y luego apartarse de ella. Quien extravía y también extravía a otros aumenta su carga al desviar a otros. Utiliza esto para distinguir dos versículos sobre llevar cargas. Lee el versículo sobre un grupo entre la Gente del Libro que deseaba desviar a los creyentes como si dijera que solo se extravían a sí mismos, sin éxito en el objetivo más amplio {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1532}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1534}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1535}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1536}."
  fr: "Sha'rawi considère que l'égarement revêt plusieurs sens: s'égarer et se perdre dans une chose, ne pas atteindre la vérité, et connaître la loi puis s'en détourner. Celui qui égare et égare autrui alourdit son fardeau en entraînant les autres dans sa chute. Il utilise cette conception pour distinguer deux versets relatifs au fardeau de porter des charges. Il interprète le verset concernant un groupe parmi les Gens du Livre qui souhaitaient égarer les croyants comme signifiant qu'ils ne s'égarent qu'eux-mêmes, sans atteindre leur objectif plus large."
  ur: "شعراوی کا خیال ہے کہ گمراہی کے کئی حواس ہوتے ہیں: گمراہ ہو جانا اور کسی چیز میں گم ہو جانا، حق تک پہنچنے میں ناکام ہو جانا، شریعت کو جاننا اور پھر اس سے منہ موڑنا۔ جو گمراہ کرتا ہے اور دوسروں کو بھی گمراہ کرتا ہے وہ دوسروں کو گمراہ کر کے اپنا بوجھ بڑھاتا ہے۔ وہ اس کا استعمال بوجھ اٹھانے کے بارے میں دو آیات میں فرق کرنے کے لیے کرتا ہے۔ اس نے اہل کتاب میں سے ایک گروہ کے بارے میں آیت پڑھی جو اہلِ ایمان کو گمراہ کرنا چاہتے تھے اور کہتے تھے کہ وہ صرف اپنے آپ کو گمراہ کرتے ہیں، وسیع مقصد میں کامیابی کے بغیر۔ صفحہ 1534}{حوالہ:تفسیر-شراوی-خوااتیر-سکین-جلد-2 صفحہ1535}{حوالہ:تفسیر-شعروی-خواطر-اسکین-جلد-2 صفحہ 1536}۔"
  tr: "Al-Shaarawi, yanlış yönlendirmenin çeşitli anlamlarda geldiğine inanır; bir şeye girip orada yok olmak, gerçeğin yüzüne yönlendirilmemek ve bazen yolu bilip sonra ondan sapmak gibi. Ve başkalarını yanıltan ve yanıltan kişi, yanlış yönlendirme yükünü başkalarını yanıltma yükleriyle birleştirerek Fatir ayeti ile Arı ayeti arasındaki farkı açıklar. Kitap Ahli'nin inananları sadece kendilerini yanılttıklarını söyleyerek yanıltmak isteyen bir grup Kitap Ahli'nden bahseden ayeti okur {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 s.1532}{cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 s.1534}{cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-vol-2 s.1535}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1536}."
  id: "Al-Shaarawi percaya bahwa kekeliruan datang dalam berbagai makna, termasuk masuk ke sesuatu dan binasa di dalamnya, tidak dibimbing ke wajah kebenaran, dan terkadang mengetahui jalannya lalu menyimpang darinya. Dan siapa pun yang menyesatkan dan menyesatkan orang lain menjadi lebih terbebani oleh kesalahan, menggabungkan beban penyesatan diri dengan beban menyesatkan orang lain, sehingga menjelaskan perbedaan antara ayat Fatir dan ayat Lebah. Ia melafalkan ayat yang menyebutkan sekelompok Umat Kitab yang ingin menyesatkan orang beriman dengan mengatakan bahwa mereka hanya menyesatkan diri sendiri, tanpa melakukannya {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1532}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1534}{cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 hlm.1535}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1536}."
