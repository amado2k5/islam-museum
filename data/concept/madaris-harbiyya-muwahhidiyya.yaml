label:
  ar: المدارس الحربية الموحدية
  en: The Almohad war-schools
summary:
  ar: "مدارس حربية أنشأها عبد المؤمن بن علي لتخريج القواد والجند، جمع فيها الشبان من القبائل المغربية ولا سيما مصمودة، وكانت تدرّس إلى جانب الفنون الحربية كتبَ المهدي ابن تومرت ويحفظ الطلبة وصاياه عن ظهر قلب، ومن مناهجها التدريب على الأسلحة وركوب الخيل والسباحة وأساليب الحصار براً وبحراً، وأنشأ الموحدون قرب مراكش بركة وضعت فيها القوارب وسفن التدريب الصغيرة ليتدرب الطلبة على التجذيف وقيادة السفن، وكان التعليم على نفقة الدولة مع منح الطلبة الخيل والأسلحة، وتخرّج فيها كثير من القواد وكبار الضباط وحكام القلاع."
  en: "Abd al-Mu'min's war-schools for cadre and soldier: he gathered the youth of the Maghrebi tribes, Masmuda above all; beside martial arts they taught Ibn Tumart's books and the pupils learnt his counsels by heart — weapons drill, riding, swimming, siegecraft by land and sea; near Marrakesh the Almohads dug a basin holding skiffs and small 'training ships' where the cadets practised rowing and command of vessels. The schooling ran at state expense with horses and arms granted, and out of it graduated many of the commanders, senior officers and castle-governors."
