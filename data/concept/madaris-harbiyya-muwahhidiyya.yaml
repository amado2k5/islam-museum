label:
  ar: المدارس الحربية الموحدية
  en: The Almohad war-schools
  es: "Las escuelas de guerra almohades"
  fr: "Les écoles de guerre almohades"
  ur: "الموحد وار سکولز"
  tr: "Almohad Savaş Okulları"
  id: "Sekolah Perang Almohad"
summary:
  ar: "مدارس حربية أنشأها عبد المؤمن بن علي لتخريج القواد والجند، جمع فيها الشبان من القبائل المغربية ولا سيما مصمودة، وكانت تدرّس إلى جانب الفنون الحربية كتبَ المهدي ابن تومرت ويحفظ الطلبة وصاياه عن ظهر قلب، ومن مناهجها التدريب على الأسلحة وركوب الخيل والسباحة وأساليب الحصار براً وبحراً، وأنشأ الموحدون قرب مراكش بركة وضعت فيها القوارب وسفن التدريب الصغيرة ليتدرب الطلبة على التجذيف وقيادة السفن، وكان التعليم على نفقة الدولة مع منح الطلبة الخيل والأسلحة، وتخرّج فيها كثير من القواد وكبار الضباط وحكام القلاع."
  en: "Abd al-Mu'min's war-schools for cadre and soldier: he gathered the youth of the Maghrebi tribes, Masmuda above all; beside martial arts they taught Ibn Tumart's books and the pupils learnt his counsels by heart — weapons drill, riding, swimming, siegecraft by land and sea; near Marrakesh the Almohads dug a basin holding skiffs and small 'training ships' where the cadets practised rowing and command of vessels. The schooling ran at state expense with horses and arms granted, and out of it graduated many of the commanders, senior officers and castle-governors."
  es: "Las escuelas de guerra de Abd al-Mu'min para cuadros y soldados: reunió a jóvenes de las tribus del Magreb, sobre todo de Masmuda; además de artes marciales, les enseñaban los libros de Ibn Tumart y los alumnos memorizaban sus consejos: instrucción con armas, equitación, natación y técnicas de asedio por tierra y mar. Cerca de Marrakech, los almohades excavaron una dársena con barcas y pequeños barcos escuela donde los cadetes practicaban remo y mando de embarcaciones. La formación corría a cargo del Estado, que les proporcionaba caballos y armas, y de ella se graduaron muchos comandantes, oficiales superiores y gobernadores de castillos."
  fr: "Les écoles de guerre d'Abd al-Mu'min pour cadres et soldats: il rassembla les jeunes des tribus maghrébines, notamment les Masmoudites. Outre les arts martiaux, on y enseignait les livres d'Ibn Tumart et les élèves apprenaient ses conseils par cœur. Au programme également: maniement des armes, équitation, natation, techniques de siège terrestres et maritimes. Près de Marrakech, les Almohades creusèrent un bassin abritant des barques et de petits navires-écoles où les cadets s'exerçaient à l'aviron et au commandement des embarcations. L'enseignement était entièrement financé par l'État, qui fournissait chevaux et armes. De nombreux commandants, officiers supérieurs et gouverneurs de châteaux en sortirent."
  ur: "کیڈر اور سپاہی کے لیے عبد المومن کے جنگی اسکول: اس نے مغربی قبائل کے نوجوانوں کو جمع کیا، سب سے بڑھ کر مسمودہ؛ مارشل آرٹ کے علاوہ انہوں نے ابن تمرٹ کی کتابیں بھی پڑھائیں اور شاگرد دل سے اس کے مشورے سیکھتے تھے — ہتھیاروں کی مشقیں، سواری، تیراکی، زمین اور سمندر کے ذریعے محاصرہ کرنا۔ مراکش کے قریب الموحد نے ایک بیسن کھودا جس میں سکف اور چھوٹے 'تربیتی جہاز' تھے جہاں کیڈٹس قطار چلانے اور جہازوں کی کمانڈ کرنے کی مشق کرتے تھے۔ اسکول کی تعلیم سرکاری خرچ پر گھوڑوں اور ہتھیاروں سے چلتی تھی، اور اس میں سے بہت سے کمانڈر، اعلیٰ افسران اور قلعے کے گورنر فارغ التحصیل ہوئے۔"
  tr: "Abdelmoumen bin Ali tarafından komutanları ve askerleri eğitmek için askeri okullar kuruldu; özellikle Masmuda'dan genç erkekler toplandı. Dövüş sanatlarının yanı sıra, Al-Mahdi ibn Tumart'ın kitaplarını da öğrettiler ve öğrenciler onun talimatlarını ezberlediler. Müfredatları arasında silah, at binme, yüzme ve kara ile deniz kuşatma yöntemleri eğitimi vardı. Marakeş yakınlarındaki Almohadlar, kürek çekme ve gemi yönlendirme eğitimi için tekneler ve küçük eğitim gemilerinin yerleştirildiği bir gölet kurdular. Eğitim devlet tarafından finanse edildi, öğrencilere at ve silah sağlandı. Birçok komutan, üst düzey subay ve kale yöneticisi bu okullardan mezun oldu."
  id: "Sekolah militer didirikan oleh Abdelmoumen bin Ali untuk melatih komandan dan prajurit, mengumpulkan pemuda dari suku Maroko, terutama Masmuda. Selain seni bela diri, mereka mengajarkan buku-buku Al-Mahdi ibn Tumart, dan para siswa menghafal instruksinya. Kurikulum mereka meliputi pelatihan senjata, berkuda, berenang, dan metode pengepungan melalui darat dan laut. Almohad di dekat Marrakech mendirikan sebuah kolam tempat perahu dan kapal pelatihan kecil ditempatkan untuk melatih siswa mendayung dan mengemudi kapal. Pendidikan didanai oleh negara, dengan kuda dan senjata disediakan kepada siswa. Banyak komandan, perwira senior, dan gubernur kastil lulus dari mereka."
