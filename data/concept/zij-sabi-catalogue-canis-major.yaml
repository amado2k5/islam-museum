summary:
  ar: "يذكر الفهرس صورة الكلب، ثم يُدرج تحت عنوان فرعي كواكب يقول النص إنها ليست من صورته، ثم يذكر كواكب مُقدَّم الكلب. {cite:zij-sabi-nallino-byblion pp.270}"
  en: "The catalogue gives the figure of al-Kalb, the Dog, then a sub-list of stars that the text says are not part of its figure, and then the stars of the forepart of the Dog. {cite:zij-sabi-nallino-byblion pp.270}"
  ur: "فہرست کلب یعنی کتے کی صورت کے ستارے دیتی ہے، پھر ایک ذیلی فہرست جن کے بارے میں متن کہتا ہے کہ وہ اس صورت کا حصہ نہیں، اور پھر کتے کے اگلے حصے کے ستارے۔ {cite:zij-sabi-nallino-byblion pp.270}"
  es: "El catálogo presenta la figura de al-Kalb, el Perro, seguida de una sublista de estrellas que, según el texto, no forman parte de su figura, y finalmente las estrellas de la parte delantera del Perro. {cite:zij-sabi-nallino-byblion pp.270}"
  fr: "Le catalogue présente la figure d'al-Kalb, le Chien, puis une sous-liste d'étoiles qui, selon le texte, ne font pas partie de cette figure, et enfin les étoiles de la partie antérieure du Chien. {cite:zij-sabi-nallino-byblion pp.270}"
