class: concept
kind: legal
label: { ar: "النَّذْر", en: "The vow (nadhr) and its rulings", ur: "نذر ⁦(منت)⁩", es: "El voto (nadhr) y sus preceptos", fr: "Le vœu (nadhr) et ses règles" }
summary:
  ar: "النذر في اللغة النحب، وفي الاصطلاح إلزام المكلف المختار نفسه لله تعالى بالقول شيئاً غير لازم عليه بأصل الشرع. واتفق الفقهاء على صحته في الجملة ووجوب الوفاء بما كان طاعة، واستدلوا بالقرآن والسنة والإجماع، واختلفوا في حكمه بين الندب والكراهة. وينعقد عند الجمهور بغير لفظ النذر إذا أفاد الالتزام. ومن أقسامه نذر اللجاج والغضب، وفيه التخيير بين الوفاء والكفارة عند بعضهم، ولزوم الوفاء عند آخرين، ونذر الطاعة وفيه العبادات المقصودة وغيرها، ونذر المعصية ولا وفاء فيه، ونذر المباح وفيه خلاف في انعقاده، ونذر الواجب العيني فلا ينعقد عند الجمهور، ونذر المستحيل فلا ينعقد، والنذر المبهم فيه كفارة يمين عند الجمهور. وفيه مسائل تفصيلية في التصدق بكل المال، ونذر الصلاة والصيام المطلقين، والاعتكاف في المساجد والأزمنة، والمشي إلى الحرم، ونذر الهدي، والعجز عن الطاعة، والموت قبل أدائها من حج وصيام واعتكاف وصلاة وصدقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15645}"
  en: "A vow (nadhr), in the lexicon, is a vow to God; in law, it is a binding commitment that a free, responsible person takes upon himself, by speech, to do something not required of him by the law. The jurists agree that it is valid in general and that a vow of obedience must be fulfilled, citing the Qur'an, the Sunna and consensus, but they differ on whether vowing is recommended or disliked. Most jurists hold that a vow can be made without using the word 'vow' when the words show a commitment. Its kinds include the vow of anger (where some allow a choice between fulfilling it and paying an oath-expiation, and others require fulfilment), the vow of obedience (which covers worship proper and other good acts), the vow of disobedience (which cannot be fulfilled), the vow of permissible acts (whose validity is disputed), the vow of obligations of individual obligation (not valid for most), the vow of impossibility (not valid), and the unspecified vow (oath-expiation for most). The entry also covers the vow of giving all property, the vows of prayer and fasting without number, i'tikaf and its times and places, walking to the Haram, sacrifices outside Mecca, inability to perform the vow, and the death of a person before performing a vowed hajj, fast, i'tikaf, prayer or charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15645}"
  ur: "نذر کا مطلب ہے کہ کوئی مکلف اپنے اوپر اللہ کے لیے ایسا کام لازم کرے جو شرع میں اصلاً لازم نہ ہو۔ جمہور کے نزدیک نذر صحیح ہے اور طاعت کی نذر پوری کرنا واجب ہے۔ نذر کی مختلف اقسام ہیں: نذر لجاج، نذر طاعت، نذر معصیت، نذر مباح، اور نذر مبہم، جن کے احکام میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15645}"
  es: "Un voto (nadhr), en el léxico, es un juramento a Dios; en derecho, es un compromiso vinculante que una persona libre y responsable asume, mediante la palabra, para hacer algo que la ley no le exige. Los juristas coinciden en que es válido en general y que un voto de obediencia debe cumplirse, citando el Corán, la Sunna y el consenso, pero difieren en si se recomienda o no hacer votos. La mayoría de los juristas sostiene que se puede hacer un voto sin usar la palabra «voto» cuando las palabras denotan un compromiso. Entre sus tipos se incluyen el voto de ira (donde algunos permiten elegir entre cumplirlo y pagar una expiación, y otros exigen su cumplimiento), el voto de obediencia (que abarca la adoración propiamente dicha y otros actos buenos), el voto de desobediencia (que no puede cumplirse), el voto de actos permisibles (cuya validez es disputada), el voto de obligaciones individuales (no válido para la mayoría), el voto de imposibilidad (no válido) y el voto no especificado (expiación para la mayoría). La entrada también abarca el voto de entregar todos los bienes, los votos de oración y ayuno sin número, el i'tikaf y sus tiempos y lugares, la caminata al Haram, los sacrificios fuera de La Meca, la incapacidad de cumplir el voto y la muerte de una persona antes de realizar un hajj, ayuno, i'tikaf, oración o caridad prometidos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15558} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15559} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15560} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15645}"
  fr: "Dans le langage courant, un vœu (nadhr) est un vœu fait à Dieu; en droit, il s'agit d'un engagement ferme qu'une personne libre et responsable prend verbalement, à accomplir un acte non prescrit par la loi. Les juristes s'accordent généralement sur sa validité et sur l'obligation de respecter un vœu d'obéissance, se fondant sur le Coran, la Sunna et le consensus, mais divergent quant à son caractère recommandé ou déconseillé. La plupart des juristes estiment qu'un vœu peut être formulé sans employer le terme « vœu » dès lors que les paroles expriment un engagement. Parmi les différents types de vœux figurent le vœu de colère (certains laissent le choix entre l'accomplir et payer une expiation, tandis que d'autres l'imposent), le vœu d'obéissance (qui englobe le culte proprement dit et d'autres bonnes actions), le vœu de désobéissance (qui ne peut être accompli), le vœu d'actes permis (dont la validité est contestée), le vœu d'obligations individuelles (non valable pour la plupart), le vœu d'impossibilité (non valable) et le vœu non spécifié (expiation pour la plupart). L'article traite également du vœu de donation de tous les biens, des vœux de prière et de jeûne illimités, de l'i'tikaf et de ses dates et lieux, du pèlerinage au Haram, des sacrifices hors de La Mecque, de l'impossibilité d'accomplir le vœu et du décès d'une personne avant d'avoir accompli un hajj, un jeûne, un i'tikaf, une prière ou une aumône. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15645}"
