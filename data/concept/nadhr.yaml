label: { ar: "النَّذْر", en: "The vow (nadhr) and its rulings", ur: "نذر (منت)" }
summary:
  ar: "النذر في اللغة النحب، وفي الاصطلاح إلزام المكلف المختار نفسه لله تعالى بالقول شيئاً غير لازم عليه بأصل الشرع. واتفق الفقهاء على صحته في الجملة ووجوب الوفاء بما كان طاعة، واستدلوا بالقرآن والسنة والإجماع، واختلفوا في حكمه بين الندب والكراهة. وينعقد عند الجمهور بغير لفظ النذر إذا أفاد الالتزام. ومن أقسامه نذر اللجاج والغضب، وفيه التخيير بين الوفاء والكفارة عند بعضهم، ولزوم الوفاء عند آخرين، ونذر الطاعة وفيه العبادات المقصودة وغيرها، ونذر المعصية ولا وفاء فيه، ونذر المباح وفيه خلاف في انعقاده، ونذر الواجب العيني فلا ينعقد عند الجمهور، ونذر المستحيل فلا ينعقد، والنذر المبهم فيه كفارة يمين عند الجمهور. وفيه مسائل تفصيلية في التصدق بكل المال، ونذر الصلاة والصيام المطلقين، والاعتكاف في المساجد والأزمنة، والمشي إلى الحرم، ونذر الهدي، والعجز عن الطاعة، والموت قبل أدائها من حج وصيام واعتكاف وصلاة وصدقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15645}"
  en: "A vow (nadhr), in the lexicon, is a vow to God; in law, it is a binding commitment that a free, responsible person takes upon himself, by speech, to do something not required of him by the law. The jurists agree that it is valid in general and that a vow of obedience must be fulfilled, citing the Qur'an, the Sunna and consensus, but they differ on whether vowing is recommended or disliked. Most jurists hold that a vow can be made without using the word 'vow' when the words show a commitment. Its kinds include the vow of anger (where some allow a choice between fulfilling it and paying an oath-expiation, and others require fulfilment), the vow of obedience (which covers worship proper and other good acts), the vow of disobedience (which cannot be fulfilled), the vow of permissible acts (whose validity is disputed), the vow of obligations of individual obligation (not valid for most), the vow of impossibility (not valid), and the unspecified vow (oath-expiation for most). The entry also covers the vow of giving all property, the vows of prayer and fasting without number, i'tikaf and its times and places, walking to the Haram, sacrifices outside Mecca, inability to perform the vow, and the death of a person before performing a vowed hajj, fast, i'tikaf, prayer or charity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15645}"
  ur: "نذر کا مطلب ہے کہ کوئی مکلف اپنے اوپر اللہ کے لیے ایسا کام لازم کرے جو شرع میں اصلاً لازم نہ ہو۔ جمہور کے نزدیک نذر صحیح ہے اور طاعت کی نذر پوری کرنا واجب ہے۔ نذر کی مختلف اقسام ہیں: نذر لجاج، نذر طاعت، نذر معصیت، نذر مباح، اور نذر مبہم، جن کے احکام میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15645}"
