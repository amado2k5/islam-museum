  fr: "Mastaki (mastic)"
summary:
  ar: "المضطكى صمغ منه رومي أبيض ونبطي أسود، حار يابس في الثانية، قابض محلل، يقوي المعدة والكبد وينفع الجراحات والسعال والإسهال والزحير {cite:canon-ibn-sina-print-v1 p.553} {cite:canon-ibn-sina-print-v1 p.554}."
  en: "Mastic is a gum, the Roman white and the Nabataean blackish, hot and dry in the second degree, astringent and dissolving; it strengthens the stomach and liver and is listed for wounds, cough, diarrhoea and dysentery {cite:canon-ibn-sina-print-v1 p.553} {cite:canon-ibn-sina-print-v1 p.554}."
  ur: "مضطکی ایک گوند ہے، رومی سفید اور نبطی سیاہی مائل، دوسرے درجے میں گرم خشک، قابض اور تحلیل کرنے والا؛ معدے اور جگر کو قوت دیتا ہے اور زخموں، کھانسی، اسہال اور پیچش میں مذکور ہے {cite:canon-ibn-sina-print-v1 p.553} {cite:canon-ibn-sina-print-v1 p.554}۔"
  es: "El mástique es una goma, la romana blanca y la nabatea negruzca, caliente y seca en segundo grado, astringente y disolvente; fortalece el estómago y el hígado y se menciona para heridas, tos, diarrea y disentería {cite:canon-ibn-sina-print-v1 p.553} {cite:canon-ibn-sina-print-v1 p.554}."
  fr: "Le mastic est une gomme, blanche chez les Romains et noirâtre chez les Nabatéens, chaude et sèche au deuxième degré, astringente et dissolvante; il fortifie l'estomac et le foie et est indiqué pour les plaies, la toux, la diarrhée et la dysenterie {cite:canon-ibn-sina-print-v1 p.553} {cite:canon-ibn-sina-print-v1 p.554}."
