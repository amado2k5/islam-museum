id: concept/ilaj-al-zukam-wa-al-nazla
class: concept
kind: scientific
label:
  ar: علاج الزكام والنزلة
  en: The treatment of catarrh and the descending catarrh
  ur: زکام اور نزلہ کا علاج
  es: "El tratamiento del catarro y del catarro descendente"
summary:
  ar: علاج النزلة محصور في نقصان المادة ومقابلة السبب الفاعل وقطع السيلان أو تعديله أو تحريكه إلى جهة أخرى والتقدم بمنع ما يتولد منه من خشم وقروح وخشونة، وترك الامتلاء من الطعام والشراب والعطاس ضار في أول حدوث النزلة؛ وأصل العلاج أن لا يبيت ممتلئ البطن ويديم تسخين الرأس ويقيه الشمال خصوصاً عقيب الجنوب ويقل شرب ماء الثلج ولا ينام نهاراً ويعطش ويجوع ويسهر ما أمكن ⁦(أسماء الأدوية والأشربة والبخورات واللعوقات لا تحمل، وسطر مواضع التمريخ المسمى سطر موسوم مطروح لحكم المؤسس)⁩ {cite:canon-ibn-sina-print-v2 p.242} {cite:canon-ibn-sina-print-v2 p.244}
  en: 'The treatment of the nazla is confined to lessening the matter, countering the effective cause, cutting the flow or adjusting it or moving it to another channel, and forestalling what it may breed — chaps on the nose, ulcers on the nostril, harshness in the throat. Food-and-drink fullness is to be left, and sneezing harms at the nazla''s onset. The root of treatment: not sleeping on a full belly, keeping the head warm, shielding it from the north wind especially after the south, lessening iced water, no daytime sleep, and bearing thirst, hunger and wakefulness as far as possible ⁦(the drug, drink, fumigation and linctus names are not carried; the line naming the smearing sites including the male member is kept as a labelled listing for the founder''s ruling)⁩ {cite:canon-ibn-sina-print-v2 p.242} {cite:canon-ibn-sina-print-v2 p.244}'
  ur: 'نزلے کا علاج چار باتوں میں محصور ہے: مادے کی کمی، مؤثر سبب کی مقابلہ، بہاؤ کا کاٹنا یا اس کی تعدیل یا اسے دوسری طرف موڑنا، اور جن چیزوں کا اس سے پیدا ہونا ممکن ہے — ناک پر پھوڑے، نتھنے پر چھالے، حلق میں خرخراہٹ — ان سے پہلے بچنا؛ خوراک و مشروب کا امتلاء چھوڑنا ہے اور نزلے کے آغاز میں چھینک نقصان دہ ہے؛ علاج کی جڑ یہ ہے کہ بھرا پیٹ نہ سوئے، سر کو گرم رکھے، شمالی باد سے بچائے خاص طور پر جنوبی باد کے بعد، برف کا پانی کم پئے، دن میں نہ سوئے اور جہاں تک ہو پیاس، بھوک اور جاگ برداشت کرے ⁦(ادویہ، مشروبات، بخور اور لعوق کے نام نہیں لیے گئے؛ مسح کی جگہوں کے نام جن میں مرد کا عضو بھی ہے والا سطر موسوم فہرست کے طور پر بانی کے فیصلے کے لیے)⁩ {cite:canon-ibn-sina-print-v2 p.242} {cite:canon-ibn-sina-print-v2 p.244}'
  es: "El tratamiento de la nazla se limita a disminuir la materia, contrarrestar la causa efectiva, cortar el flujo o ajustarlo o desviarlo a otro canal, y prevenir lo que pueda producir: grietas en la nariz, úlceras en las fosas nasales, aspereza en la garganta. Se debe evitar la sensación de plenitud por la comida y la bebida, y los estornudos son perjudiciales al inicio de la nazla. La base del tratamiento: no dormir con el estómago lleno, mantener la cabeza caliente, protegerla del viento del norte, especialmente después del viento del sur, reducir el consumo de agua helada, no dormir durante el día y soportar la sed, el hambre y el insomnio en la medida de lo posible (no se incluyen los nombres de los medicamentos, bebidas, fumigaciones ni jarabes; la línea que nombra los sitios de aplicación, incluido el miembro masculino, se mantiene como una lista etiquetada para la regla del fundador) {cite:canon-ibn-sina-print-v2 p.242} {cite:canon-ibn-sina-print-v2 p.244}"
