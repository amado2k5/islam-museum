summary:
  ar: "ويسقون فيها كأساً كان مزاجها زنجبيلاً، فيها عين تسمى سلسبيلاً: نبتة الهند الحارة صارت شراب أهل الجنة البارد."
  en: "'They are given to drink a cup whose mixture is ginger', from a fountain there named Salsabil — the hot root of India made the cool drink of the people of Paradise."
  ur: "'انہیں ایسا پیالہ پلایا جائے گا جس میں ادرک ملی ہوگی'، وہاں سلسبیل نامی چشمہ ہے — ہندوستان کی گرم جڑ جنت والوں کا ٹھنڈا مشروب بنی۔"
  es: "«Se les da a beber una taza cuya mezcla es jengibre», de una fuente llamada Salsabil; la raíz picante de la India era la bebida refrescante de la gente del Paraíso."
  fr: "« On leur donne à boire une coupe dont le mélange est à base de gingembre », provenant d'une fontaine nommée Salsabil — la racine chaude de l'Inde transformée en boisson rafraîchissante pour les habitants du Paradis."
