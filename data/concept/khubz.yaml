summary:
  ar: "خبز في الكتاب يجب أن يكون نقيا مملوحا مملك العجين مخمرا جيد النضج في التنور، ويتلو التنوري الفرني وسائره رديء، والخبز الحار غير مقبول عند الطبيعة، والمغسول مبرد قليل الغذاء صالح للمحرورين؛ السميذ أغذى من غيره وأبطأ نفوذا، والخشكار سريع النفوذ أقل غذاء، وخبز الملة خام الباطن؛ ينفع خبز الحنطة للأورام الحارة ويدلك به القوابي، والخشكار يليّن الطبيعة والحواري والفطير والملة والعتيق اليابس يعقل، وطريقة غسله متروكة {cite:canon-ibn-sina-print-v1 pp.715-716}"
  en: "Khubz is in the book that which should be clean, salted, well kneaded, leavened and well baked in the oven, the tannur bread being followed by the furni and the rest bad, hot bread not being accepted by nature, and washed bread cooling, little in nourishment and fit for the heated; samidh is more nourishing than the rest and slower to pass, khushkar passes quickly and is less nourishing, and the bread of the mulla is raw inside; wheat bread benefits hot swellings and is rubbed on ringworm, khushkar loosens nature while hawari, unleavened bread, mulla bread and old dry bread bind; the way of washing it is left out {cite:canon-ibn-sina-print-v1 pp.715-716}"
  ur: "خبز کتاب میں وہ ہے جو صاف، نمک ملا، اچھی طرح گندھا، خمیر شدہ اور تنور میں خوب پکا ہوا ہو، تنوری کے بعد فرنی ہے اور باقی خراب، اور گرم روٹی طبیعت کو قبول نہیں، اور دھوئی ہوئی روٹی ٹھنڈک دینے والی، کم غذا والی اور گرم مزاج والوں کے لیے موزوں ہے؛ سمید دوسروں سے زیادہ غذا والا اور دیر سے نفوذ کرنے والا ہے، خشکار جلد نفوذ کرتا ہے اور کم غذا دیتا ہے، اور ملہ کی روٹی اندر سے کچی رہتی ہے؛ گندم کی روٹی گرم ورموں میں نافع ہے اور قوباء پر ملی جاتی ہے، خشکار طبیعت نرم کرتا ہے اور حواری، بے خمیر، ملہ اور پرانی خشک روٹی روکتی ہیں؛ اسے دھونے کا طریقہ چھوڑ دیا گیا {cite:canon-ibn-sina-print-v1 pp.715-716}۔"
  es: "Khubz es en el libro lo que debe ser limpio, salado, bien amasado, fermentado y bien horneado en el horno, el pan tannur es seguido por el furni y el resto es malo, el pan caliente no es bien aceptado por la naturaleza, y el pan lavado se enfría, es poco nutritivo y apto para calentar; el samidh es más nutritivo que el resto y más lento de digerir, el khushkar digiere rápidamente y es menos nutritivo, y el pan del mulla está crudo por dentro; el pan de trigo beneficia las hinchazones calientes y se frota sobre la tiña, el khushkar afloja la naturaleza mientras que el hawari, el pan sin levadura, el pan mulla y el pan seco viejo atan; la forma de lavarlo se omite {cite:canon-ibn-sina-print-v1 pp.715-716}"
  fr: "Le khubz, selon le livre, doit être propre, salé, bien pétri, levé et bien cuit au four. Le pain tannur est suivi du furni, les autres étant impropres à la consommation. Le pain chaud est mal toléré, et le pain lavé refroidit, est peu nourrissant et convient aux personnes souffrant de chaleur. Le samidh est plus nourrissant que les autres et son transit est plus lent. Le khushkar est rapidement digéré mais moins nourrissant, et le pain mulla est cru à l'intérieur. Le pain de blé est bénéfique pour les gonflements et est utilisé en application locale sur la teigne. Le khushkar dénoue les tensions tandis que le hawari, le pain azyme, le pain mulla et le vieux pain sec ont des effets néfastes. La méthode de lavage n'est pas décrite. {cite:canon-ibn-sina-print-v1 pp.715-716}"
