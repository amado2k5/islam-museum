label:
  ar: خروج الدجال
  en: The Emergence of the Dajjal
  ur: دجال کا خروج
summary:
  ar: "خروج الدجال قبل قيام الساعة من العلامات الكبرى: يخرج في زمن فتنة، أعور يزعم الربوبية، يفتن الناس بالجنة والنار، يمر في الأرض سبعين سنة، ويظهر له من يصدقه ويريده. ويقتله عيسى ابن مريم عند باب لد."
  en: "The emergence of the Dajjal before the Hour is a major sign: he appears amid trial, one-eyed, claiming lordship, testing people with paradise and fire, traveling the earth for decades; he is killed by Jesus son of Mary at the gate of Ludd."
  ur: "ساعت سے پہلے دجال کا خروج بڑی نشانیوں میں سے ہے: وہ فتنوں کے زمانے میں ایک آنکھ سے ⁦(کنوِل)⁩ نکلتا ہے، ربوبیت کا دعویٰ کرتا ہے، لوگوں کو جنت اور آگ سے آزماتا ہے، سات دہائیوں تک زمین میں گھومتا ہے، اور آخر میں عیسیٰ ابن مریم اسے بابِ لد پر مار دیتے ہیں۔"
