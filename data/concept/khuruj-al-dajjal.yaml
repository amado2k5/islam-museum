id: concept/khuruj-al-dajjal
class: concept
kind: doctrine
label:
  ar: خروج الدجال
  en: The Emergence of the Dajjal
  ur: دجال کا خروج
  es: "El surgimiento del Dajjal"
  fr: "L'émergence du Dajjal"
  tr: "Deccal'in Çıkışı"
  id: "Keluarnya Antikristus"
summary:
  ar: "خروج الدجال قبل قيام الساعة من العلامات الكبرى: يخرج في زمن فتنة، أعور يزعم الربوبية، يفتن الناس بالجنة والنار، يمر في الأرض سبعين سنة، ويظهر له من يصدقه ويريده. ويقتله عيسى ابن مريم عند باب لد."
  en: "The emergence of the Dajjal before the Hour is a major sign: he appears amid trial, one-eyed, claiming lordship, testing people with paradise and fire, traveling the earth for decades; he is killed by Jesus son of Mary at the gate of Ludd."
  ur: "ساعت سے پہلے دجال کا خروج بڑی نشانیوں میں سے ہے: وہ فتنوں کے زمانے میں ایک آنکھ سے ⁦(کنوِل)⁩ نکلتا ہے، ربوبیت کا دعویٰ کرتا ہے، لوگوں کو جنت اور آگ سے آزماتا ہے، سات دہائیوں تک زمین میں گھومتا ہے، اور آخر میں عیسیٰ ابن مریم اسے بابِ لد پر مار دیتے ہیں۔"
  es: "La aparición del Dajjal antes de la Hora es una señal importante: aparece en medio de una prueba, tuerto, reclamando señorío, poniendo a prueba a la gente con el paraíso y el fuego, viajando por la tierra durante décadas; es asesinado por Jesús, hijo de María, en la puerta de Ludd."
  fr: "L'apparition du Dajjal avant l'Heure est un signe majeur: il apparaît au milieu de l'épreuve, borgne, revendiquant la seigneurie, mettant les gens à l'épreuve avec le paradis et le feu, parcourant la terre pendant des décennies; il est tué par Jésus, fils de Marie, à la porte de Ludd."
  tr: "Dajjal'ın Saat öncesi ortaya çıkması başlıca işaretlerden biridir: Bir sınav zamanında ortaya çıkar, tek gözlü bir şekilde efendilik iddiasında bulunur, insanları Cennet ve Cehennemle ayartır, yetmiş yıl boyunca yeryüzünde kalır ve ona kimin inandığını ve kim için dilediğini gösterir. Ve Meryem'in oğlu İsa, onu Lyd kapısında öldürür."
  id: "Kemunculan Dajjal sebelum Jam adalah salah satu tanda utama: Dia muncul di masa ujian, bermata satu mengklaim kekuasaan, menggoda orang dengan Surga dan Neraka, menghabiskan tujuh puluh tahun di bumi, dan menunjukkan siapa yang percaya dan menginginkannya. Dan Yesus, putra Maria, membunuhnya di gerbang Lyd."
