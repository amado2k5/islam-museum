summary:
  ar: "الاستدراج، كما يعرّفه الشيخ عمر عبد الكافي، أن يتابع الله على العبد نعمه وهو مقصّر في طاعته، فيمضي وهو لا يعلم. ويستشهد الشيخ بآية في الإملاء دون أن يسمّيها."
  en: "Istidraj, as Sheikh Omar Abdelkafy defines it, is God continuing His favour to a servant who falls short in His service, so that he is led on without knowing. He quotes a verse about respite without naming it."
  ur: "شیخ عمر عبدالکافی کی تعریف کے مطابق استدراج یہ ہے کہ اللہ اپنے ایسے بندے پر مسلسل نعمتیں جاری رکھے جو اس کی بندگی میں کوتاہی کرتا ہے، اور وہ بے خبری میں آگے بڑھتا چلا جائے۔ وہ مہلت کے بارے میں ایک آیت پڑھتے ہیں جس کا نام نہیں لیتے۔"
