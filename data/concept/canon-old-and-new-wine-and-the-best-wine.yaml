id: concept/canon-old-and-new-wine-and-the-best-wine
class: concept
kind: scientific
label:
  ar: "الشراب العتيق والحديث وخير الشراب عند ابن سينا"
  en: "Old wine, new wine and the best wine in the Canon"
  fr: "Vins vieux, nouveaux et meilleurs selon le Canon"
  ur: "پرانی اور نئی شراب اور بہترین شراب قانون میں"
  es: "Vino añejo, vino nuevo y el mejor vino del Canon"
summary:
  ar: "يفرق ابن سينا بين العتيق الذي في حكم الدواء والحديث الضار بالكبد، ويصف خير الشراب بأنه المعتدل بين العتيق والحديث، الصافي الأبيض إلى الحمرة، الطيب الرائحة، لا حامض ولا حلو، ويذكر المغسول ومعالجة اللذع بعد الشرب {cite:canon-ibn-sina-print-v1 p.238}."
  en: "Ibn Sina distinguishes old wine, which is in the nature of medicine, from new wine, which harms the liver, and describes the best wine as one between old and new, clear, white tending to red, of pleasant scent, neither sour nor sweet; he names the washed wine and the treatment of a sting after drinking {cite:canon-ibn-sina-print-v1 p.238}."
  fr: "Ibn Sina oppose vin vieux médicinal et nouveau nuisible au foie ; il préfère l’intermédiaire, clair, blanc rougeâtre, odorant, ni acide ni doux ; il cite vin lavé et correction de la sensation brûlante après boisson {cite:canon-ibn-sina-print-v1 p.238}."
  es: "Ibn Sina distingue el vino añejo, que tiene propiedades medicinales, del vino nuevo, que daña el hígado, y describe el mejor vino como uno intermedio entre el añejo y el nuevo, claro, blanco con tendencia al rojo, de aroma agradable, ni agrio ni dulce; menciona el vino lavado y el tratamiento de una picadura después de beber {cite:canon-ibn-sina-print-v1 p.238}."
