summary:
  ar: "يفرق ابن سينا بين العتيق الذي في حكم الدواء والحديث الضار بالكبد، ويصف خير الشراب بأنه المعتدل بين العتيق والحديث، الصافي الأبيض إلى الحمرة، الطيب الرائحة، لا حامض ولا حلو، ويذكر المغسول ومعالجة اللذع بعد الشرب {cite:canon-ibn-sina-print-v1 p.238}."
  en: "Ibn Sina distinguishes old wine, which is in the nature of medicine, from new wine, which harms the liver, and describes the best wine as one between old and new, clear, white tending to red, of pleasant scent, neither sour nor sweet; he names the washed wine and the treatment of a sting after drinking {cite:canon-ibn-sina-print-v1 p.238}."
