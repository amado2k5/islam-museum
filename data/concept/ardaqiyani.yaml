label:
  ar: "أردقياني"
  en: "Ardaqiyani (a pungent tree)"
  fr: "Ardaqiyani (arbre à l’odeur forte)"
  ur: "اردقیانی ⁦(تیز بو والا درخت)⁩"
summary:
  ar: "شجرة شبيهة بالكبر، شديدة الرائحة، ثمرها في غُلف. ينسب الكتاب إلى الراهب أنها أقوى طبعاً من عنب الثعلب والكاكنج، وأنها تنفع الأورام الباطنة، وتُطلى على الأورام الحارة الخارجة {cite:canon-ibn-sina-print-v1 p.376}."
  en: "A tree like caper, with a very sharp smell and its fruit in husks. The book attributes to the monk (al-rahib) the view that it is stronger in nature than nightshade berries and kakanj; it helps internal swellings and is applied to hot external swellings {cite:canon-ibn-sina-print-v1 p.376}."
  fr: "Un arbre semblable au câprier, à l’odeur très forte et aux fruits enfermés dans des enveloppes. Le livre attribue au moine (al-rahib) l’avis qu’il est de nature plus forte que les baies de morelle et le kakanj ; il est bénéfique contre les tuméfactions internes et s’applique aux tuméfactions externes chaudes {cite:canon-ibn-sina-print-v1 p.376}."
  ur: "کیپر جیسا ایک درخت، جس کی بو بہت تیز ہے اور جس کا پھل غلافوں میں ہوتا ہے۔ کتاب راہب کے حوالے سے لکھتی ہے کہ اس کی طبیعت عنب الثعلب اور کاکنج سے زیادہ قوی ہے؛ یہ اندرونی سوجنوں میں نفع دیتا ہے اور گرم بیرونی سوجنوں پر لگایا جاتا ہے {cite:canon-ibn-sina-print-v1 p.376}۔"
