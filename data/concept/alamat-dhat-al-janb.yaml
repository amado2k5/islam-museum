  ar: "علامات ذات الجنب"
  en: "The signs of pleurisy"
  ur: "ذات الجنب کی علامتیں"
summary:
  ar: "قد يوقع في ذات الجنب الامتلاء من الأخلاط إذا عرض في ناحية الرأس أو ناحية الصدر وقد يورثه كثيراً من شرب المياه الباردة الحاقنة للمواد والبرد الزائد كما تحدثه الأسباب الشديدة وشرب ما يحرك الأخلاط ويثيرها ⁦(سطر موسوم من الشراب)⁩، وذات الجنب أكثر ما يعرض في الخريف والشتاء وخصوصاً بعد ربيع شتوي ويكثر في الربيع الشتوي وهبوب الشمال ويكثر الفضول أو يحقن الفضول فتكثر معه أوجاع الجنوب ويقل جداً لكنه إذا كان الصيف جنوبياً مطيراً وكذلك الخريف يكثر في آخر الخريف في أصحاب الصفراء ذات الجنب وأما على غير هذه الصورة فذات الجنب يقل في الأهوية والبلدان والرياح الجنوبية ويقل أيضاً في النساء ⁦(سطر موسوم فيهن)⁩ وإذا عرض للحوامل كان مهلكاً ويقل في الشيوخ فإن عرض قتل لضعف قواهم عن النفث والتنقية ⁦(سطر موسوم)⁩، وذات الجنب ربما التبس بذات الكبد فإن المعاليق إذا تمددت لورم الكبد تأدى ذلك إلى الحجاب والغشاء فأحس فيه بوجع وتأدى إلى ضيق النفس فيحتاج إلى أن يعرف الفرق بينهما، وربما كان سبب ذات الجنب وذات الرئة تناول أغذية غليظة مغلظة للدم ⁦(أسماؤها مستثناة)⁩ فيندفع إلى نواحي الثندوة والجنب وعلاجه ترقيق المادة ⁦(بما يذكره)⁩ ويخرج منه إلى ما يشربه ويجتنب التمريخ بالدهن فإنه جذاب وربما استغنى بهذا عن الفصد، ولذات الجنب الخالص علامات خمس وهي حمى لازمة لمجاورة القلب والثانية وجع ناخس تحت الأضلاع لأن العضو غشائي وكثيراً ما لا يظهر إلا عند التنفس وقد يكون مع النخس تمدد وربما كانت أكثر والتمدد يدل على الكثرة والنخس على القوة في النفوذ واللذع والثالثة ضيق نفس لضغط الورم وصغره وتواتر منه والرابعة نبض منشاري مختلف ويزداد اختلافه ويخرج عن النظام عند المنتهى لضعف القوة وكثرة المادة والخامسة السعال فإنه قد يعرض في أول هذه العلة سعال يابس ثم ينفث وربما كان هذا السعال مع النفث من أول الأمر وهو محمود جداً وإنما يعرض السعال لتأذي الرئة بالمجاورة ثم يرشح ما يرشح إليها من مادة المرض فيحتاج إلى نفثه فإن تحلل كله وترشح فقد استنقى ما جمع، والخالص منه لا يكون معه ضربان لأن العضو عادم لكثرة الشرايين، ولما كانت ذات الكبد يشبه ذات الجنب في ضيق النفس ولتمدد المعاليق واندفاع الألم إلى الغشاء المستبطن وجب أن يفرق بينهما وأيضاً يشبه ذات الرئة بسبب ذلك وبسبب النفث فيجب أن يفرق بينهما، فالفرق بين ذات الجنب وذات الكبد أن النبض في ذات الكبد موجي والوجع ثقيل ليس بناخس والوجه مستحيل إلى الصفرة الرديئة والسعال غير نافث بل تكون سعالات يابسة متباطئة وربما اسود اللسان بعد صفرته والبول يكون غليظاً استسقائياً ويكون البراز كبدياً ويحس بثقل في الجانب الأيمن ولا يدركه اللمس فبوجع وربما كان فيه إسهال يشبه غسالة اللحم الطري لضعف القوة وإذا كان الورم في الحدبة أحس به في اللمس كثيراً وإن كان في التقعير كشف عنه التنفس المستعصي إذا دل على شيء ثقيل معلق وضيق النفس في ذات الكبد متشابه في الأوقات غير شديد جداً وأما ذات الجنب فسعاله نافث ووجعه ناخس ونفثه أحسن قواماً ولونه أحسن ما يكون وضيق نفسه أشد وهو ذاهب إلى الازدياد على الاتصال حتى يتبين له في كل ست ساعات تفاوت في الازدياد كثير، والفرق بينه وبين ذات الرئة أيضاً هو أن نبض ذات الرئة موجي ووجعه ثقيل وضيق نفسه أشد ونفسه أسخن وعلامات أخرى، ولما كان ذات الجنب قد تعرض معه أعراض السرسام المنكرة مثل اختلاط الذهن والهذيان وتواتر النفس والخفقان والغشي وشدة الضجر وشدة العطش وتغير السحنة إلى ألوان مختلفة وشدة الحمى وقيء المرارة والسبب في هذه الأعراض مشاركة الصدر للأعضاء الرئيسية ومجاورتها وجب أن نفرق بين الأمرين أعني البرسام والسرسام، فمن الفروق أن اختلاط الذهن يعرض في السرسام أولاً ثم تشتد فيه سائر الأعراض ويكون التنفس فيه أسلم ويتأخر فساد النفس عن الاختلاط وتكون معه أعراضه الخاصة كحمرة العينين وانجذابهما إلى فوق وأما في البرسام فيتأخر اختلاط الذهن وربما لم يكن إلى قرب الموت بل كان عقله سليماً ولكنه يتقدمه فساد النفس وسوؤه ويكون في الأول تمدد في المراق إلى فوق كأنه ينجذب إلى الورم ووجع ناخس، ومن الفروق في ذلك أن النبض في السرسام عظيم إلى التفاوت وفي ذات الجنب صغير إلى التواتر ليتلافى الصغر، وذات الجنب إذا اشتد اشتدت الأعراض المذكورة معه ويبس اللسان وخشن وإذا ازداد عرض احمرار في الوجه والعين والقلق الشديد وفساد النفس واختلاط الذهن والعرق المنقطع وربما أدى إلى اختلاف رديء {cite:canon-ibn-sina-print-v2 p.343}"
  en: "Fullness of the humours brings on pleurisy when it arises in the head's side or the chest's side, and much drinking of the cold waters retaining the matters and the excessive cold may bequeath it, as the severe causes and drinking what stirs and provokes the humours bring it about (a labelled line of the drink). Pleurisy arises most in the autumn and winter, especially after a wintry spring, and abounds in the wintry spring and the north's blowing; the superfluities abound or are retained, and the south's pains abound with it — it is very rare, but if the summer is southerly and rainy, and so the autumn, it abounds at autumn's end in the bilious-natured; otherwise pleurisy is rare in southerly airs, lands and winds. It is rare too in women (a labelled line in them); and when it befalls the pregnant it is deadly (a labelled line), and rare in the old — if it comes it kills for their powers' weakness at expectorating and cleansing. Pleurisy may be confused with hepatitis, for when the suspensories are stretched by the liver's tumour that reaches the diaphragm and the membrane, so a pain is felt in it and it reaches narrowness of breath — the difference between them must be known. And the cause of pleurisy and peripneumonia may be taking thick foods thickening the blood (names excluded), so it is pushed to the regions of the breast-flesh and the side; its treatment is thinning the matter (by what he mentions), then coming off it to what he drinks, and shunning the anointing with oil for it is drawing — and this may spare the venesection. The true pleurisy has five signs: a continuous fever for the heart's neighbourhood; second, a pricking pain under the ribs, the organ being membranous, and often it shows only at breathing, and stretching may come with the pricking or be more — the stretching indicating the abundance, the pricking the strength of the piercing and stinging; third, narrowness of breath from the tumour's pressure and its smallness, with frequency; fourth, a saw-like differing pulse, its difference growing and leaving order at the end for the power's weakness and the matter's abundance; fifth, the cough — for a dry cough may arise at this affliction's beginning then expectoration, and this cough may be with expectoration from the very start and is much praised; the cough arises for the lung's being hurt by neighbourhood, then what seeps to it of the disease's matter must be expectorated, and if it all resolves and seeps, what was gathered is cleansed. The true kind has no pulsation, the organ being free of many arteries. Since hepatitis resembles pleurisy in the breath's narrowness, by the suspensories' stretching and the pain's pushing to the lining membrane, they must be told apart; and it resembles peripneumonia for that and for the expectoration, so they must be told apart. The difference between pleurisy and hepatitis: in hepatitis the pulse is wavy, the pain heavy not pricking, the face turned to a bad yellow, the cough not expectorating — rather dry, sluggish coughs — the tongue may blacken after yellowing, the urine thick dropsical, the stool liver-like, a heaviness felt in the right side not reached by touch without pain; there may be in it a diarrhoea like the wash-water of fresh meat for the power's weakness; if the tumour is in the convexity it is much felt by touch, if in the hollowness the resistant breath uncovers it when it indicates a heavy hanging thing; and the breath's narrowness in hepatitis is alike at the times, not very severe — while pleurisy's cough is expectorating, its pain pricking, its expectoration of best consistency and its colour the best there is, and its breath's narrowness severer, going on increasing continuously until a great difference in the increasing shows every six hours. The difference between it and peripneumonia too is that peripneumonia's pulse is wavy, its pain heavy, its breath's narrowness severer, its breath hotter — and other signs. Since pleurisy may bring the sarsam's ugly symptoms — mind's confusion, delirium, frequency of breath, palpitation, syncope, severe vexation, severe thirst, the complexion changing to different colours, the fever's severity and vomiting of bile — the cause of these symptoms being the chest's participation with and neighbourhood to the principal organs, the two must be told apart: barsam and sarsam. Among the differences: mind's confusion arises in sarsam first, then the other symptoms intensify in it, the breathing in it is safer and the breath's corruption lags behind the confusion, and its own signs come with it like the eyes' redness and their being drawn upward; in barsam the mind's confusion lags and may not come till near death — his mind being sound — but the breath's corruption and badness precede it, and in the beginning there is a stretching in the hypochondrium upward as though drawn to the tumour, and a pricking pain. And among the differences: the pulse in sarsam is great toward disparity, in pleurisy small toward frequency to make up the smallness; and when pleurisy intensifies, the mentioned symptoms intensify with it, the tongue dries and roughens, and when it increases there arise redness in face and eye, severe restlessness, corruption of breath, mind's confusion, interrupted sweat, and it may lead to a bad irregularity {cite:canon-ibn-sina-print-v2 p.343}"
  ur: "اخلاط کا امتلاء ذات الجنب ڈالتا ہے جب سر کی طرف یا سینے کی طرف عرض ہو اور بہت سا ٹھنڈا پانی پینا جو مادوں کو جمع رکھے اور زیادہ ٹھنڈ اسے پیدا کر سکتی ہے جیسے سخت اسباب اور وہ مشروب جو اخلاط کو ابھارے اور ہلاۓ ⁦(مشروب کی موسوم سطر)⁩؛ ذات الجنب خزاں اور سردی میں سب سے زیادہ ہوتی ہے خاص طور پر سرد بہار کے بعد اور سرد بہار اور شمالی ہوا میں کثیر ہوتی ہے فضول مادے بڑھتے یا جمع ہوتے ہیں اور جنوبی درد اس کے ساتھ بڑھتے ہیں یہ بہت کم ہے لیکن اگر گرمی جنوبی برساتی ہو اور خزاں بھی تو خزاں کے آخر میں صفراوی طبیعتوں میں کثیر ہوتی ہے ورنہ جنوبی ہواؤں ملکوں اور ہواؤں میں کم؛ عورتوں میں بھی کم ⁦(ان میں موسوم سطر)⁩ اور حاملوں کو ہو تو ہلاکت بخش ہے ⁦(موسوم سطر)⁩ اور بزرگوں میں کم ہو تو مار ڈالتی ہے نفث اور صفائی کی قوت کی کمزوری سے؛ ذات الجنب ذات الکبد سے ملتبس ہو سکتی ہے کیونکہ معالیق جگر کے ورم سے کھنچیں تو حجاب اور جھلی تک پہنچ کر درد محسوس ہوتا ہے اور سانس کی تنگی ہوتی ہے فرق جاننا ضروری؛ اور ذات الجنب اور ذات الرئة کا سبب گاڑھی خون کو گاڑھا کرنے والی خوراکیں ہو سکتی ہیں ⁦(نام مستثنیٰ)⁩ تو وہ سینے کے گوشت اور پہلو کی طرف دھکیلی جاتی ہیں علاج مادہ پتلا کرنا ہے ⁦(مذکورہ چیزوں سے)⁩ پھر اس سے نکل کر وہ پینا اور روغن ملنا چھوڑنا وہ کھینچنے والا ہے اور اس سے فصد کی بجت ہو سکتی ہے؛ خالص ذات الجنب کی پانچ علامتیں ہیں: مسلسل بخار دل کی قربت سے؛ دوسرا پسلیوں کے نیچے چبھتا درد عضو جھلی دار ہے اکثر صرف سانس پر ظاہر ہوتا ہے اور چبھن کے ساتھ کھنچاؤ ہو سکتا ہے یا زیادہ کھنچاؤ کثرت کی اور چبھن نفوذ اور چبھنے کی قوت کی دلیل؛ تیسرا ورم کے دباؤ اور اس کی چھٹائی سے سانس کی تنگی اور اس سے تواتر؛ چوتھا منشاری مختلف نبض جس کا اختلاف بڑھتا ہے اور انتہا پر قوت کی کمزوری اور مادے کی کثرت سے ترتیب سے باہر ہوتا ہے؛ پانچویں کھانسی شروع میں خشک ہو سکتی ہے پھر نفث آئے اور یہ کھانسی پہلے دن سے نفث کے ساتھ بھی ہو سکتی ہے اور وہ بہت پسندیدہ ہے کھانسی پڑوسی ہونے سے پھیپھڑے کی اذیت سے ہوتی ہے پھر جو مرض کا مادہ اس میں رسے اسے نفث کرنا پڑتا ہے سب تحلیل اور رس جائے تو جمع ہوا صاف ہو گیا؛ خالص میں ضربان نہیں ہوتا عضو شریانوں سے خالی ہے؛ اور چونکہ ذات الکبد سانس کی تنگی میں معالیق کے کھنچنے اور درد کے اندرونی جھلی تک پہنچنے سے ذات الجنب جیسی ہے فرق کرنا ضروری اور وہ نفث کی وجہ سے ذات الرئة سے بھی ملتی ہے؛ ذات الجنب اور ذات الکبد کا فرق: ذات الکبد میں نبض موجی درد بھاری چبھتا نہیں چہرہ بری زردی پر مائل کھانسی نفث نہیں بلکہ خشک سست کھانسیاں زبان زردی کے بعد سیاہ ہو سکتی ہے پیشاب گاڑھا استسقائی براز کبدی دائیں پہلو میں گرانی کا احساس چھونے سے درد کے بغیر نہیں پکڑا جاتا اور اس میں گوشت کے دھونے جیسا اسہال ہو سکتا ہے قوت کی کمزوری سے اگر ورم ابھار میں ہو تو چھونے سے بہت محسوس ہوتا ہے اگر گہرائی میں ہو تو رکا ہوا سانس اسے کھولتا ہے اور ذات الکبد میں سانس کی تنگی اوقات میں یکساں نہ بہت سخت جبکہ ذات الجنب کی کھانسی نفث کرنے والی درد چبھتا نفث بہترین قوام اور رنگ کا اور سانس کی تنگی زیادہ سخت اور مسلسل بڑھتی جاتی ہے یہاں تک کہ ہر چھ گھنٹے میں اضافے کا فرق ظاہر ہو؛ اور ذات الرئة سے فرق یہ کہ اس کی نبض موجی درد بھاری سانس کی تنگی سخت تر اور سانس زیادہ گرم اور دوسری علامتیں؛ اور چونکہ ذات الجنب کے ساتھ سرسام کی بری علامتیں ہو سکتی ہیں ذہن کا الجھنا ہذیان تواتر نفس دھڑکن غشی سخت بے چینی سخت پیاس رنگ بدلنا سخت بخار اور صفرا کی قے ان کا سبب سینے کا اصلی اعضا سے شرکت اور قربت ہے لہٰذا برسام اور سرسام میں فرق کرنا چاہیے؛ فرقوں میں سے: ذہن کا الجھنا سرسام میں پہلے ہوتا ہے پھر باقی علامتیں سخت ہوتی ہیں سانس اس میں محفوظ تر اور فساد نفس الجھنے سے پیچھے رہتا ہے اور اس کی خاص علامتیں ہوتی ہیں جیسے آنکھوں کی سرخی اور اوپر کھنچنا؛ برسام میں الجھنا دیر سے آتا ہے شاید قریب الموت تک نہ ہو عقل سالم رہتی ہے لیکن فساد اور برائی نفس اس سے پہلے آتی ہے اور شروع میں مراق میں اوپر کی طرف کھنچاؤ ہوتا ہے جیسے ورم کی طرف کھنچ رہا ہو اور چبھتا درد؛ اور فرقوں میں سے نبض سرسام میں بڑا تفاوت کی طرف اور ذات الجنب میں چھوٹی تواتر کی طرف تاکہ چھٹائی پوری ہو؛ اور ذات الجنب جب سخت ہو تو مذکورہ علامتیں بھی سخت ہوں زبان خشک اور خشن بڑھنے پر چہرے اور آنکھ میں سرخی سخت بے قراری فساد نفس الجھنا ٹوٹا ہوا پسینہ اور بری اختلاف تک پہنچ سکتی ہے {cite:canon-ibn-sina-print-v2 p.343}"
