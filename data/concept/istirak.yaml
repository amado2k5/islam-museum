id: concept/istirak
class: concept
kind: natural
label:
  ar: "الاصطرك"
  en: "Istirak (a kind of mi'a, or storax, in the book's account)"
  ur: "اصطرک"
  es: "Istirak (una especie de mi'a o estoraque, según el relato del libro)"
  fr: "Istirak (une sorte de mi'a, ou storax, dans le récit du livre)"
  tr: "El-Astrrak"
  id: "Al-Astrrak"
summary:
  ar: "الاصطرك في الكتاب ضرب من الميعة بقول ديسقوريدوس، وعند بعضهم صمغ الزيتون، ودخانه يقوم مقام دخان الكندر، وأجوده الأحدّ رائحة الأشقر الدسم الشبيه بالراتينج؛ حارّ في الثالثة يابس في الأولى، مسخّن منضج مليّن جداً؛ يخلط بأدوية الإعياء، وفيه إسبات وتثقيل للرأس، وينفع من الزكام والنوازل والسعال وبحوحة الصوت؛ ويذكر الكتاب فيه قولاً عن الرحم والطمث في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.355}"
  en: "In the book istirak is, according to Dioscorides, a kind of mi'a (storax), and according to some the gum of the olive, and its smoke takes the place of the smoke of frankincense; the best is the sharper-smelling, the yellow-red, fat and resin-like; hot in the third degree and dry in the first, warming, ripening and very softening; it is mixed into the drugs for fatigue, it induces torpor and heaviness of the head, and it helps the cold in the head, catarrhs, cough and hoarseness of the voice; the book also gives a statement on the womb and the menses in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.355}"
  ur: "اصطرک کتاب میں دیسقوریدوس کے قول سے میعہ کی ایک قسم ہے، اور بعض کے نزدیک زیتون کا گوند، اور اس کا دھواں کندر کے دھوئیں کی جگہ لیتا ہے؛ بہترین وہ ہے جس کی بو تیز ہو، زردی مائل سرخ، چکنا اور راتینج جیسا؛ تیسرے درجے میں گرم اور پہلے میں خشک، گرم کرنے والا، پکانے والا اور بہت نرم کرنے والا؛ تھکن کی دواؤں میں ملایا جاتا ہے، اس میں غنودگی اور سر کا بھاری پن ہے، اور زکام، نزلات، کھانسی اور آواز کے بیٹھ جانے میں مفید ہے؛ کتاب رحم اور حیض کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.355}۔"
  es: "En el libro, el istirak es, según Dioscórides, una especie de mi'a (estorax), y según algunos, la goma de la aceituna, y su humo sustituye al del incienso; el mejor es el de olor más penetrante, amarillo rojizo, graso y resinoso; caliente en tercer grado y seco en primero, reconfortante, madurador y muy suavizante; se mezcla con medicamentos para la fatiga, induce letargo y pesadez de cabeza, y ayuda con el resfriado, los catarros, la tos y la ronquera; el libro también incluye una declaración sobre el útero y la menstruación en una sección etiquetada reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 p.355}"
  fr: "Dans le livre, l'istirak est, selon Dioscoride, une sorte de mi'a (storax), et selon certains, la gomme d'olive, et sa fumée remplace celle de l'encens; la meilleure est celle à l'odeur plus forte, jaune-rouge, grasse et résineuse; chaude au troisième degré et sèche au premier, réchauffante, mûrissante et très adoucissante; elle est mélangée aux remèdes contre la fatigue, elle induit la torpeur et la lourdeur de la tête, et elle soulage le rhume de tête, les catarrhes, la toux et l'enrouement; le livre donne également une déclaration sur l'utérus et les menstruations dans une section intitulée réservée à la décision du fondateur {cite:canon-ibn-sina-print-v1 p.355}"
  tr: "Kitapta 'Astarrak', Dioscoride'e göre bir tür sıvıdır ve bazıları bunun zeytin sakızı olduğunu, dumanı Kandar dumanına benzediğini söyler. Pazar günü en iyisi, kremamsı sarı reçine benzeri aromadır; üçüncüsü sıcak, ilkinde kuru, çok yumuşak ve olgun; yorgunluk için ilaçlarla karıştırılır. Kış uykusuna ve başın ağırlığına neden olur, soğuk algınlığı, hastalıklar, öksürük ve kısıklık için faydalıdır. Kitap, 'Kurucu'nun Kuralı' başlıklı bölümde rahim ve adet hakkında bir ifadeye yer verir {cite:canon-ibn-sina-print-v1 s.355}"
  id: "Dalam buku ini, 'Astarrak' adalah jenis cairan menurut Dioscoride, dan beberapa mengatakan itu adalah permen zaitun, dan asapnya menyerupai asap Kandar. Yang terbaik pada hari Minggu adalah aroma resin pirang yang lembut; panas di gigi ketiga dan kering pada yang pertama, sangat lembut, dan matang; dicampur dengan obat untuk kelelahan. Aroma ini menyebabkan hibernasi dan berat di kepala, serta bermanfaat untuk flu, penyakit, batuk, dan suara serak. Buku ini menyebutkan pernyataan tentang rahim dan menstruasi dalam bagian berjudul 'Aturan Pendiri' {cite:canon-ibn-sina-print-v1 hlm.355}"
