summary:
  ar: "الشارة الخطية للسلطان العثماني، ليست توقيعه بيده بل رمز لسلطته، تتوج الفرامين والوقفيات والنقود، ولها منذ أورخان بنية رباعية: ثلاث حلقات، وثلاث سيقان قائمة، وذراعان أفقيتان، واسم مركب في الأسفل {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}."
  en: "The calligraphic insignia of the Ottoman sultan — not his own signature but an emblem of his authority — crowning firmans, endowment deeds and coins; from Orhan on each sultan had his own, in a four-part form of loops, upright shafts, horizontal arms and an intertwined name {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}."
  ur: "عثمانی سلطان کا خطاطانہ نشان — اس کے اپنے ہاتھ کا دستخط نہیں بلکہ اس کے اقتدار کی علامت — جو فرامین، وقف ناموں اور سکوں کا تاج ہوتا؛ اورخان کے بعد ہر سلطان کا اپنا طغریٰ چار حصوں والا تھا: حلقے، کھڑی شاخیں، افقی بازو اور گتھا ہوا نام {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 45}۔"
