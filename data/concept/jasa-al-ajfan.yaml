id: "concept/jasa-al-ajfan"
class: "concept"
kind: "scientific"
label:
  ar: "جسا الأجفان"
  en: "Dryness of the eyelids (jasa)"
  ur: "پلکوں کا جسا"
  es: "Sequedad de los párpados (jasa)"
  fr: "Sécheresse des paupières (jasa)"
summary:
  ar: "الجسا أن يعرض للأجفان عسر حركة إلى التغميض عن انفتاحه وإلى الانفتاح عن تغميضه مع وجع وحمرة بلا رطوبة في الأكثر ويلزمه كثيراً أن لا يجيب إلى الانفتاح مع الانتباه عن النوم وأكثره لا يخلو عن تفاريق رمص يابس صلب ولا يكون معه سيلان إلا بالعرض لأنه عن يبس أو خلط لزج مائل إلى اليبوسة جداً، وإذا كانت حكة بلا مادة تنصب إليها سميت يبوسة العين، ويدام تكميد العين بإسفنجة مغموسة في ماء فاتر وإدمان الاستحمام بالماء العذب المعتدل {cite:canon-ibn-sina-print-v2 p.194}"
  en: "Jasa is that the lids get difficulty moving toward closing from opening and toward opening from closing, with pain and redness, mostly without moisture; it often does not answer opening on waking from sleep, mostly with separations of dry hard eye-sordes and no flowing except incidentally, for it is from dryness or a very drying viscid humour; if there is itching with no matter flowing to it, it is called dryness of the eye; constant fomentation of the eye with a sponge soaked in tepid water and frequent bathing with moderate fresh water is kept up {cite:canon-ibn-sina-print-v2 p.194}"
  ur: "جسا یہ ہے کہ پلکوں کو کھلی حالت سے بند ہونے اور بند سے کھلنے میں دشواری عرض ہو، درد اور سرخی کے ساتھ، اکثر بغیر رطوبت؛ اور اکثر نیند سے بیدار ہونے پر کھلنے کا جواب نہیں دیتا، اور زیادہ تر خشک سخت رمص کے ٹکڑوں کے بغیر نہیں ہوتا اور ساتھ بہاؤ صرف اتفاقاً ہوتا ہے کیونکہ یہ خشکی یا نہایت خشک چکنا خلط سے ہوتا ہے؛ اور اگر خارش ہو بغیر مادے کے بہنے کے تو اسے آنکھ کی خشکی کہتے ہیں؛ اور آنکھ پر نیم گرم پانی میں بگھوئی اسفنجہ سے تكمید اور معتدل شیریں پانی سے مسلسل غسل جاری رکھا جاتا ہے {cite:canon-ibn-sina-print-v2 p.194}"
  es: "Jasa es que los párpados tienen dificultad para moverse desde la apertura hacia el cierre y viceversa, con dolor y enrojecimiento, generalmente sin secreción; a menudo no responden a la apertura al despertar del sueño, generalmente con separaciones de secreción ocular seca y dura y sin flujo excepto incidentalmente, ya que se debe a la sequedad o a un humor viscoso muy secante; si hay picazón sin secreción, se llama sequedad ocular; se mantiene la fomentación constante del ojo con una esponja empapada en agua tibia y baños frecuentes con agua fresca moderada {cite:canon-ibn-sina-print-v2 p.194}"
  fr: "Le syndrome de Jasa se caractérise par une difficulté à fermer les paupières et à les ouvrir, accompagnée de douleur et de rougeur, généralement sans hydratation. Souvent, les paupières ne s'ouvrent pas au réveil, et présentent généralement des décollements de croûtes sèches et dures, sans écoulement, sauf occasionnel, car cela est dû à la sécheresse ou à un humeur visqueuse très asséchante. En cas de démangeaisons sans écoulement, on parle de sécheresse oculaire. Il est recommandé de pratiquer des compresses chaudes et humides constantes avec une éponge imbibée d'eau tiède et de prendre des bains fréquents d'eau fraîche à température modérée. {cite:canon-ibn-sina-print-v2 p.194}"
