label: { ar: "الإمامة", en: "The Imamate" }
summary:
  ar: "الإمامة في دائرة المعارف الإسلامية هي الزعامة العليا للجماعة المسلمة بعد وفاة النبي، وتعرض المقالة نظريتها الكلامية والفقهية عند أهل السنة والمعتزلة والزيدية والإمامية الاثني عشرية والإسماعيلية والخوارج، كلٌّ بحسب ما يقوله. فأهل السنة يرون نصب الإمام واجباً على الجماعة بالعهد أو الاختيار، ويشترطون النسب القرشي والعلم والعدالة؛ ويرى الإمامية أن الإمام معصوم منصوص عليه بتعيين إلهي، وهم يقيمون الإمامة على النص؛ ويربط الخوارج شرعية الإمام بعدله. وتتبع المقالة تطور الفكر السني حتى المحدثين، وهي تنقل التباين دون حكم."
  en: "In the Encyclopaedia of Islam, the imamate is the supreme leadership of the Muslim community after the Prophet's death, and the article sets out its theological and legal theory among the Sunnis, Mu'tazila, Zaydis, Twelver Imamis, Isma'ilis and Kharijis, each as its own followers state it. Sunni doctrine makes appointing an imam obligatory on the community, by appointment or election, with Qurayshi descent, knowledge and probity as conditions; the Imamis hold the imam to be sinless and designated by God; the Kharijis tie legitimacy to justice. The article follows Sunni thought down to the modernists and gives no verdict between them."
  ur: "دائرۃ المعارف اسلامیہ میں امامت نبی کی وفات کے بعد مسلم جماعت کی اعلیٰ قیادت ہے، اور مقالہ اہل سنت، معتزلہ، زیدیہ، اثنا عشری امامیہ، اسماعیلیہ اور خوارج میں اس کے کلامی اور فقہی نظریے کو ہر ایک کے اپنے بیان کے مطابق پیش کرتا ہے۔ سنی مذہب میں امام کا تقرر جماعت پر واجب ہے، تقرری یا انتخاب سے، قریشی نسب، علم اور عدالت کی شرائط کے ساتھ؛ امامیہ امام کو معصوم اور الٰہی طور پر مقرر مانتے ہیں؛ خوارج جواز کو عدل سے جوڑتے ہیں۔ مقالہ سنی فکر کو جدیدیت پسندوں تک لاتا ہے اور کسی کے حق میں فیصلہ نہیں دیتا۔"
