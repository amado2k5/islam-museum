label: { ar: "الإمامة" }
summary:
  ar: "الإمامة هي أهم مسألة يدور عليها كلام الإمامية — مركز بحوثهم والملوّن لعقيدتهم وإليها ترجع أكثر المسائل الفرعية، وحولها يدور أكثر الخلاف بينهم وبين أهل السنة {cite:duha-islam p. 850}. وفي كتاب الكافي أن الإمام له صلة روحية بالله من جنس التي للأنبياء والرسل، وأنه لا تبقى الأرض بغير إمام حجة الله على عباده، وأن الإيمان بالإمام جزء من الإيمان، ومن مات بلا إمام «مات ميتة كفر ونفاق»، وأن الإمامة «منزلة الأنبياء وإرث الأوصياء، خلافة الله وخلافة الرسول ومقام أمير المؤمنين، زمام الدين ونظام المسلمين وصلاح الدنيا وعز المؤمنين» {cite:duha-islam p. 850-852}."
  en: "The Imamate — the axis of Imami doctrine per al-Kafi: the imam shares the prophets' link to God, the earth is never without a hujja, and 'the imamate is the station of the prophets, God's caliphate, the reins of religion' {cite:duha-islam p. 850-852}."
