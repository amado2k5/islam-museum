summary:
  ar: "فيل أبرهة الذي قاد به جيشه من اليمن لهدم الكعبة فوقف حين قُصدت البيت ثم كان مصير الجيش ما قصّت سورة الفيل، وسمّي ذلك العام عام الفيل وفيه وُلد النبي محمد."
  en: "Abraha's elephant at the head of the army marching from Yemen to destroy the Kaaba; it halted when turned toward the House and the army's fate was what Surah al-Fil recounts. That year was named the Year of the Elephant, the year of the Prophet Muhammad's birth."
  ur: "ابرہہ کا ہاتھی جو اپنے لشکر کے ساتھ یمن سے کعبہ ڈھانے چلا؛ گھر کی طرف موڑا گیا تو رک گیا اور لشکر کا انجام وہ ہوا جو سورۃ الفیل نے بیان کیا۔ اسی برس کو سالِ فیل کہتے ہیں جس میں نبی محمد کی ولادت ہوئی۔"
