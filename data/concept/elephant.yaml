label:
  ar: "الفيل"
  en: "The elephant"
  ur: "ہاتھی"
  es: "El elefante"
  fr: "L'éléphant"
  tr: "Fil"
  id: "Gajah"
summary:
  ar: "فيل أبرهة الذي قاد به جيشه من اليمن لهدم الكعبة فوقف حين قُصدت البيت ثم كان مصير الجيش ما قصّت سورة الفيل، وسمّي ذلك العام عام الفيل وفيه وُلد النبي محمد."
  en: "Abraha's elephant at the head of the army marching from Yemen to destroy the Kaaba; it halted when turned toward the House and the army's fate was what Surah al-Fil recounts. That year was named the Year of the Elephant, the year of the Prophet Muhammad's birth."
  ur: "ابرہہ کا ہاتھی جو اپنے لشکر کے ساتھ یمن سے کعبہ ڈھانے چلا؛ گھر کی طرف موڑا گیا تو رک گیا اور لشکر کا انجام وہ ہوا جو سورۃ الفیل نے بیان کیا۔ اسی برس کو سالِ فیل کہتے ہیں جس میں نبی محمد کی ولادت ہوئی۔"
  es: "El elefante de Abraha, al frente del ejército que marchaba desde Yemen para destruir la Kaaba, se detuvo al girar hacia la Casa, y el destino del ejército fue el que relata la Sura Al-Fil. Ese año fue llamado el Año del Elefante, el año del nacimiento del profeta Mahoma."
  fr: "L'éléphant d'Abraha, à la tête de l'armée marchant du Yémen vers la Kaaba pour la détruire, s'arrêta net en se dirigeant vers le Temple. Le sort de l'armée est relaté dans la sourate Al-Fil. Cette année fut nommée l'Année de l'Éléphant, année de la naissance du Prophète Muhammad."
  tr: "Yemen'den Kabe'yi yıkmak için ordusunu götürdüğü Abraha filini eve giderken durdurdu. O zaman ordunun akıbeti Fil Suresi'ne anlatıldı. O yıl Fil Yılı olarak adlandırıldı ve o yıl Peygamber Muhammed doğdu."
  id: "Gajah Abraha, yang bersamanya ia memimpin pasukannya dari Yaman untuk menghancurkan Ka'bah, ia hentikan saat menuju rumah itu. Kemudian nasib pasukan seperti yang diceritakan kepada Surah Al-Fil. Tahun itu dinamai Tahun Gajah, dan pada tahun itu Nabi Muhammad lahir."
