id: concept/al-ism-wal-kunya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "الاسم والكنية"
  en: "Ism and kunya"
  ur: "اسم اور کنیت"
  fr: "Ism et kunya"
  es: "Ism y kunya"
  tr: "Ad ve soyadı"
  id: "Nama depan dan belakang"
summary:
  ar: "الاسم هو الاسم الشخصي الذي يُعطى عند الميلاد أو بعده، والكنية تسمية بأبي أو أم تحمل غالباً إشارة إلى ولد أو صفة ولا تدل بالضرورة على أبوة حقيقية؛ ومن أمثلتها أبو القاسم لمحمد وأم عبد الله لعائشة وأبو هريرة بسبب هرّة صغيرة، كما يعرضها ملف بحثي قُدّم إلى المتحف مع الحديثين اللذين يستشهد بهما {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-abu-dawud-4970} {cite:sunnah-com-tirmidhi-3839}."
  en: "The ism is the personal name given at or soon after birth, and the kunya a name with Abu or Umm that often refers to a child or a quality and does not necessarily establish real parenthood; examples are Abu al-Qasim for Muhammad, Umm Abd Allah for Aisha and Abu Hurayra from a small kitten, as a research file supplied to the museum sets it out with the two hadith it cites {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-abu-dawud-4970} {cite:sunnah-com-tirmidhi-3839}."
  ur: "اسم وہ ذاتی نام ہے جو پیدائش کے وقت یا اس کے فوراً بعد رکھا جاتا ہے، اور کنیت ابو یا ام والا نام ہے جو اکثر کسی بچے یا صفت کی طرف اشارہ کرتا ہے اور ضروری نہیں کہ حقیقی والدیت ثابت کرے؛ مثالیں محمد کے لیے ابو القاسم، عائشہ کے لیے ام عبد اللہ، اور ابو ہریرہ ایک چھوٹی بلی کے بچے کی وجہ سے ہیں، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل ان دو احادیث کے ساتھ اسے بیان کرتی ہے جن کا وہ حوالہ دیتی ہے {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-abu-dawud-4970} {cite:sunnah-com-tirmidhi-3839}۔"
  fr: "L'ism est le nom personnel donné à la naissance ou peu après, et la kunya un nom en Abu ou Umm qui renvoie souvent à un enfant ou à une qualité et n'établit pas nécessairement une parenté réelle ; des exemples sont Abu al-Qasim pour Muhammad, Umm Abd Allah pour Aïcha et Abu Hurayra d'après un petit chaton, tels qu'un dossier de recherche remis au musée les expose avec les deux hadiths qu'il cite {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-abu-dawud-4970} {cite:sunnah-com-tirmidhi-3839}."
  es: "El ism es el nombre personal dado al nacer o poco después, y la kunya un nombre con Abu o Umm que a menudo remite a un hijo o a una cualidad y no establece necesariamente una paternidad real; ejemplos son Abu al-Qasim para Muhammad, Umm Abd Allah para Aisha y Abu Hurayra por un gatito, tal como los expone un archivo de investigación entregado al museo con los dos hadices que cita {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-abu-dawud-4970} {cite:sunnah-com-tirmidhi-3839}."
  tr: "İsim, doğumda veya doğumdan sonra verilen kişisel isimdir. Kunya, bir baba veya anne tarafından verilen ve genellikle bir çocuğa veya bir tanıma atıfta bulunan ve gerçek babalığı belirtmeyen bir lakaptır. Örnekler arasında Muhammed için Ebu el-Kasim, Aişe için um Abdullah ve küçük bir kedi nedeniyle Ebu Huraira yer alır. Ayrıca, müzeye sunulan bir araştırma dosyasında, {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-abu-dawud-4970} {cite:sunnah-com-tirmidhi-3839} ile birlikte sunulmaktadır."
  id: "Nama adalah nama pribadi yang diberikan saat lahir atau setelah lahir. Kunya adalah julukan yang diberikan oleh ayah atau ibu dan biasanya merujuk pada anak atau pengidentifikasi, bukan menunjukkan ayah sebenarnya. Contohnya termasuk Abu al-Qasim untuk Muhammad, um Abdullah untuk Aisha, dan Abu Huraira karena seekor kucing kecil. Selain itu, dalam berkas penelitian yang diserahkan ke museum, {cite:jstor-schimmel-islamic-names} {cite:sunnah-com-abu-dawud-4970} {cite:sunnah-com-tirmidhi-3839} disajikan."
