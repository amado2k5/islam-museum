id: concept/awram-al-lisan
class: concept
kind: scientific
label:
  ar: أورام اللسان
  en: The tongue's tumours
  ur: زبان کے ورم
summary:
  ar: قد يعرض للسان أورام حارة وأورام بلغمية وأورام ريحية وأورام صلبة وسرطان وعلامات جميع ذلك ظاهرة إذا رجع إلى ما قيل في علامات الأورام، وقد يعظم اللسان لشرب السموم من هذا الجنس، وأما الأورام الحارة فتعالج أولاً بالاستفراغ وذلك خير في أورام اللسان من القيء ثم يمسك في الفم عند ابتدائها العصارات المبردة من هذا الجنس فإن لم يتحلل ولم ينفتح احتيج في آخره إلى المنضجات المحللة وإن تقيح استعمل القوابض في الفم وإن كان صلباً لطف التدبير وجود الغذاء واستعمل الغراغر الملطفة من هذا الجنس ⁦(الأسماء والنسخ مطروحة)⁩ وقال جالينوس ورم لسان إنسان ورماً عظيماً وكان ابن ستين سنة ولم يكن له عهد بالفصد فلم أفصده ورأى في الرؤيا أن يمسك في فمه عصارة من هذا الجنس فبرأ برءاً تاماً ⁦(خبر منسوب إلى جالينوس)⁩ {cite:canon-ibn-sina-print-v2 p.258} {cite:canon-ibn-sina-print-v2 p.259}
  en: 'The tongue may take hot, phlegmy, windy and hard tumours and cancer, the signs of all of them plain on returning to what was said in the signs of tumours; the tongue may also grow great from drinking poisons of this kind. The hot tumours are treated first by evacuation — better in the tongue''s tumours than vomiting — then at their start the cooling juices of this kind are held in the mouth; if it does not dissolve nor open, the ripening dissolvers are needed at the last, and if it suppurates the astringents are used in the mouth; if hard, the regimen is softened, the food made good and the mollifying gargles of this kind used (the names and recipes are left out). Galen said: a man''s tongue swelled greatly, he was sixty and had no custom of venesection, so I did not bleed him; he saw in a dream to hold a juice of this kind in his mouth and was healed completely (a report ascribed to Galen) {cite:canon-ibn-sina-print-v2 p.258} {cite:canon-ibn-sina-print-v2 p.259}'
  ur: 'زبان کو گرم، بلغمی، ہوائی اور سخت ورم اور سرطان ہو سکتے ہیں جن کی علامات ورموں کی علامات کے باب سے ظاہر ہیں؛ اور اس جنس کے زہر پینے سے زبان بڑی بھی ہو سکتی ہے؛ گرم ورموں کا علاج پہلے استفراغ سے ہے — زبان کے ورموں میں قی سے بہتر — پھر شروع میں اسی جنس کے ٹھنڈے عصارے منہ میں رکھے جاتے ہیں؛ اگر نہ گھلے نہ کھلے تو آخر میں پکانے والے محلل درکار ہوتے ہیں اور اگر چول پڑ جائے تو منہ میں قابض استعمال ہوتے ہیں؛ اور اگر سخت ہو تو تدبیر نرم کیا جائے، خوراک اچھی کی جائے اور ملطف غرغرے اسی جنس کے استعمال ہوں ⁦(نام اور نسخے مطروح)⁩؛ جالینوس نے کہا: ایک آدمی کی زبان بہت ورم آئی اور وہ ساٹھ سال کا تھا اور اسے فصد کی عادت نہ تھی تو میں نے اس کی فصد نہ کی؛ اس نے خواب میں دیکھا کہ اسی جنس کا عصارہ منہ میں رکھے تو پورا شفا پا گیا ⁦(جالینوس سے منسوب خبر)⁩ {cite:canon-ibn-sina-print-v2 p.258} {cite:canon-ibn-sina-print-v2 p.259}'
