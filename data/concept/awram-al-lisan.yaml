id: concept/awram-al-lisan
class: concept
kind: scientific
label:
  ar: أورام اللسان
  en: The tongue's tumours
  fr: "Les tumeurs de la langue"
  ur: زبان کے ورم
  es: "Los tumores de la lengua"
  tr: "Dil tümörleri"
  id: "Tumor lidah"
summary:
  ar: قد يعرض للسان أورام حارة وأورام بلغمية وأورام ريحية وأورام صلبة وسرطان وعلامات جميع ذلك ظاهرة إذا رجع إلى ما قيل في علامات الأورام، وقد يعظم اللسان لشرب السموم من هذا الجنس، وأما الأورام الحارة فتعالج أولاً بالاستفراغ وذلك خير في أورام اللسان من القيء ثم يمسك في الفم عند ابتدائها العصارات المبردة من هذا الجنس فإن لم يتحلل ولم ينفتح احتيج في آخره إلى المنضجات المحللة وإن تقيح استعمل القوابض في الفم وإن كان صلباً لطف التدبير وجود الغذاء واستعمل الغراغر الملطفة من هذا الجنس ⁦(الأسماء والنسخ مطروحة)⁩ وقال جالينوس ورم لسان إنسان ورماً عظيماً وكان ابن ستين سنة ولم يكن له عهد بالفصد فلم أفصده ورأى في الرؤيا أن يمسك في فمه عصارة من هذا الجنس فبرأ برءاً تاماً ⁦(خبر منسوب إلى جالينوس)⁩ {cite:canon-ibn-sina-print-v2 p.258} {cite:canon-ibn-sina-print-v2 p.259}
  en: 'The tongue may take hot, phlegmy, windy and hard tumours and cancer, the signs of all of them plain on returning to what was said in the signs of tumours; the tongue may also grow great from drinking poisons of this kind. The hot tumours are treated first by evacuation — better in the tongue''s tumours than vomiting — then at their start the cooling juices of this kind are held in the mouth; if it does not dissolve nor open, the ripening dissolvers are needed at the last, and if it suppurates the astringents are used in the mouth; if hard, the regimen is softened, the food made good and the mollifying gargles of this kind used (the names and recipes are left out). Galen said: a man''s tongue swelled greatly, he was sixty and had no custom of venesection, so I did not bleed him; he saw in a dream to hold a juice of this kind in his mouth and was healed completely (a report ascribed to Galen) {cite:canon-ibn-sina-print-v2 p.258} {cite:canon-ibn-sina-print-v2 p.259}'
  fr: "Selon le livre, la langue peut présenter des tumeurs chaudes, phlegmatiques, venteuses et dures, ainsi qu’un cancer ; leurs signes se comprennent en revenant aux descriptions des signes des tumeurs. Elle peut aussi grossir après l’ingestion de poisons de ce type. Les tumeurs chaudes sont d’abord traitées par évacuation, préférable au vomissement pour celles de la langue, puis, au début, en gardant dans la bouche des sucs rafraîchissants de ce type. Si la tumeur ne se résorbe ni ne s’ouvre, des résolutifs maturatifs sont finalement nécessaires ; si elle suppure, on emploie des astringents dans la bouche ; si elle est dure, on adoucit le régime, améliore la nourriture et emploie des gargarismes émollients de ce type (noms et recettes omis). Galien rapporte qu’un homme de soixante ans eut la langue très enflée ; comme il n’avait pas l’habitude de la saignée, il ne le saigna pas. L’homme vit en rêve qu’il devait garder un suc de ce type dans la bouche et guérit entièrement (récit attribué à Galien) {cite:canon-ibn-sina-print-v2 p.258} {cite:canon-ibn-sina-print-v2 p.259}"
  ur: 'زبان کو گرم، بلغمی، ہوائی اور سخت ورم اور سرطان ہو سکتے ہیں جن کی علامات ورموں کی علامات کے باب سے ظاہر ہیں؛ اور اس جنس کے زہر پینے سے زبان بڑی بھی ہو سکتی ہے؛ گرم ورموں کا علاج پہلے استفراغ سے ہے — زبان کے ورموں میں قی سے بہتر — پھر شروع میں اسی جنس کے ٹھنڈے عصارے منہ میں رکھے جاتے ہیں؛ اگر نہ گھلے نہ کھلے تو آخر میں پکانے والے محلل درکار ہوتے ہیں اور اگر چول پڑ جائے تو منہ میں قابض استعمال ہوتے ہیں؛ اور اگر سخت ہو تو تدبیر نرم کیا جائے، خوراک اچھی کی جائے اور ملطف غرغرے اسی جنس کے استعمال ہوں ⁦(نام اور نسخے مطروح)⁩؛ جالینوس نے کہا: ایک آدمی کی زبان بہت ورم آئی اور وہ ساٹھ سال کا تھا اور اسے فصد کی عادت نہ تھی تو میں نے اس کی فصد نہ کی؛ اس نے خواب میں دیکھا کہ اسی جنس کا عصارہ منہ میں رکھے تو پورا شفا پا گیا ⁦(جالینوس سے منسوب خبر)⁩ {cite:canon-ibn-sina-print-v2 p.258} {cite:canon-ibn-sina-print-v2 p.259}'
  es: "La lengua puede tener tumores calientes, flemáticos, venosos y duros, y cáncer, los signos de todos ellos claros al volver a lo que se dijo en los signos de los tumores; la lengua también puede crecer mucho por beber venenos de este tipo. Los tumores calientes se tratan primero con evacuación —mejor en los tumores de la lengua que el vómito— luego en su inicio los jugos refrescantes de este tipo se mantienen en la boca; si no se disuelve ni se abre, se necesitan los disolventes maduradores al final, y si supura se usan astringentes en la boca; si está duro, el régimen se suaviza, la comida se vuelve buena y se usan los gárgaras suavizantes de este tipo (los nombres y recetas se omiten). Galeno dijo: la lengua de un hombre se hinchó mucho, tenía sesenta años y no tenía costumbre de flebotomía, así que no le sangré; Vio en un sueño que sostenía en su boca un jugo de este tipo y fue sanado completamente (un relato atribuido a Galeno) {cite:canon-ibn-sina-print-v2 p.258} {cite:canon-ibn-sina-print-v2 p.259}"
  tr: "Dilde sıcak tümörler, flegmatik tümörler, trakeal tümörler, solid tümörler ve kanser gelişebilir. Tüm bu belirtiler tümör belirtileri olarak adlandırıldığında belirgindir. Dil, bu tür toksinleri emmek için yoğunlaşabilir. Sıcak tümörlerde ise önce kusma ile tedavi edilir, bu da dil tümörleri için kusmaya göre daha iyidir. Bu tür soğutulmuş sıvılar başlangıçta ağızda tutulur. Eğer çözülmez veya açılmazlarsa, çözünmüş maddeler sonunda gereklidir. Eğer arıtılırsa, ağızda kelepçe kullanılır, hatta Yiyecek varlığının nazik yönetimini kesin bir şekilde kararlaştırdı ve bu cinsin nazik türlerini kullandı (isimler ve kopyalar mevcuttur). Galen şöyle dedi: Bir insanın dil tümörü altmış yaşındayken büyük bir tümördü ve flebit deneyimi yoktu, bu yüzden yok etmedi. Bir vizyonda ağzında böyle bir özsuyu tuttuğunu gördü, böylece tamamen iyileşti (Galen'e atfedilen bir rapor) {cite:canon-ibn-sina-print-v2 s.258} {cite:canon-ibn-sina-print-v2 s.259}"
  id: "Lidah dapat mengembangkan tumor panas, tumor flegmatik, tumor trakea, tumor padat, dan kanker. Semua tanda ini terlihat jika disebut tanda tumor. Lidah dapat menjadi intens untuk menyerap racun jenis ini. Sedangkan tumor panas, mereka diatasi terlebih dahulu dengan muntah, yang lebih baik untuk tumor lidah daripada muntah. Jus dingin jenis ini disimpan di mulut saat awal. Jika tidak larut atau terbuka, zat terlarut diperlukan di akhir. Jika dimurnikan, penjepit digunakan di mulut, meskipun Ia dengan tegas memutuskan pengelolaan makanan yang lembut, dan menggunakan strain lembut dari genus ini (nama dan salinan tersedia). Galen berkata: Tumor lidah manusia adalah tumor besar saat ia berusia enam puluh tahun dan belum mengalami flebitis, jadi ia tidak menghancurkannya. Ia melihat dalam penglihatan bahwa ia akan memegang getah semacam ini di mulutnya, sehingga ia sembuh sepenuhnya (laporan yang dikaitkan dengan Galen) {cite:canon-ibn-sina-print-v2 hlm.258} {cite:canon-ibn-sina-print-v2 hlm.259}"
