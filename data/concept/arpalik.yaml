id: concept/arpalik
class: concept
kind: term
label: { ar: "أربالك ⁦(نقود الشعير)⁩", en: "Arpalik (barley money)", fr: "Arpalik (argent de l’orge)", es: "Arpalik (dinero de cebada)" }
summary:
  ar: "لفظ عثماني معناه «نقود الشعير»، كان يدل على مخصص يُمنح كبار الموظفين المدنيين والعسكريين والدينيين حتى مطلع القرن التاسع عشر، إما زيادة على الراتب أو معاشًا عند التقاعد أو تعويضًا عن البطالة. واختفى مع التنظيمات، وأُنشئ بعدها صندوق لمعاشات التقاعد {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
  en: "An Ottoman term meaning 'barley money', an allowance granted to chief civil, military and religious officers up to the beginning of the nineteenth century, either on top of their salary, as a retirement pension or as an indemnity for unemployment. It disappeared at the Tanzimat, when a retirement fund was created {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
  fr: "Un terme ottoman signifiant « argent de l’orge », une allocation accordée aux principaux fonctionnaires civils, militaires et religieux jusqu’au début du XIXe siècle, soit en supplément de leur traitement, soit comme pension de retraite ou comme indemnité de chômage. Il disparut lors des Tanzimat, lorsqu’une caisse de retraite fut créée {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
  es: "Término otomano que significa \"dinero de cebada\", una asignación otorgada a los altos funcionarios civiles, militares y religiosos hasta principios del siglo XIX, ya sea además de su salario, como pensión de jubilación o como indemnización por desempleo. Desapareció con el Tanzimat, cuando se creó un fondo de jubilación {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
