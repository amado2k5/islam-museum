label: { ar: "أربالك (نقود الشعير)", en: "Arpalik (barley money)" }
summary:
  ar: "لفظ عثماني معناه «نقود الشعير»، كان يدل على مخصص يُمنح كبار الموظفين المدنيين والعسكريين والدينيين حتى مطلع القرن التاسع عشر، إما زيادة على الراتب أو معاشًا عند التقاعد أو تعويضًا عن البطالة. واختفى مع التنظيمات، وأُنشئ بعدها صندوق لمعاشات التقاعد {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
  en: "An Ottoman term meaning 'barley money', an allowance granted to chief civil, military and religious officers up to the beginning of the nineteenth century, either on top of their salary, as a retirement pension or as an indemnity for unemployment. It disappeared at the Tanzimat, when a retirement fund was created {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
