id: concept/al-shiya
class: concept
kind: term
label: { ar: الشِّية, en: "Al-shiya (marking)", es: "Al-shiya (marcado)", fr: "Al-shiya (marquage)", ur: "الشیعہ ⁦(نشان لگانا)⁩" }
summary:
  ar: "الشِّية: كل لون يخالف اللون الغالب على الفرس؛ والفرس الذي لا شية فيه بهيم مصمت. وتقسم الشيات إلى غرر في الوجه، وتحجيل في القوائم، وبقع في الجسد، وتتميز بها خيول سمرقند وهراة عن خيول شيراز في التصاوير التيمورية."
  en: "Al-shiya: any colour that differs from the horse's main colour; a horse with none is called bahim musmat. Markings are grouped as blazes on the face, white on the legs, and spots on the body; Fayed links the markings to horses in Samarkand and Herat, unlike the plain horses of Shiraz."
  es: "Al-shiya: cualquier color que difiera del color principal del caballo; un caballo sin ningún color distintivo se llama bahim musmat. Las marcas se agrupan en manchas blancas en la cara, blanco en las patas y manchas en el cuerpo; Fayed relaciona estas marcas con los caballos de Samarcanda y Herat, a diferencia de los caballos sin marcas de Shiraz."
  fr: "Al-shiya: toute couleur différente de la robe principale du cheval; un cheval sans aucune marque est appelé bahim musmat. Les marques sont regroupées en listes sur la tête, blanches sur les jambes et tachetées sur le corps; Fayed associe ces marques aux chevaux de Samarcande et d’Hérat, contrairement aux chevaux unis de Shiraz."
  ur: "الشیعہ: کوئی بھی رنگ جو گھوڑے کے مرکزی رنگ سے مختلف ہو۔ جس گھوڑے کا کوئی نہ ہو اسے بہیم مسمات کہتے ہیں۔ نشانات کو چہرے پر بلیز، ٹانگوں پر سفید اور جسم پر دھبوں کے طور پر گروپ کیا گیا ہے۔ فائد نے شیراز کے سادہ گھوڑوں کے برعکس سمرقند اور ہرات کے گھوڑوں کے نشانات کو جوڑ دیا ہے۔"
