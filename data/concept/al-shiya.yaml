label: { ar: الشِّية, en: "Al-shiya (marking)" }
summary:
  ar: "الشِّية: كل لون يخالف اللون الغالب على الفرس؛ والفرس الذي لا شية فيه بهيم مصمت. وتقسم الشيات إلى غرر في الوجه، وتحجيل في القوائم، وبقع في الجسد، وتتميز بها خيول سمرقند وهراة عن خيول شيراز في التصاوير التيمورية."
  en: "Al-shiya: any colour that differs from the horse's main colour; a horse with none is called bahim musmat. Markings are grouped as blazes on the face, white on the legs, and spots on the body; Fayed links the markings to horses in Samarkand and Herat, unlike the plain horses of Shiraz."
