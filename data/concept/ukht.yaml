label:
  ar: أخت
  en: Sister (full, paternal and maternal) in law
summary:
  ar: الأخت من ولدتها أمك وأبوك أو أحدهما، وتشمل الشقيقة ولأب ولأم والرضاعية؛ وهي من ذوات الرحم المحرم في الصلة والنكاح والنفقة والدية؛ وفي الإرث تُحجب بما يحجب الأخ، وترث الشقيقة ولأب بالفرض أو التعصيب، والأخت لأم بالفرض فقط؛ وتتقدم على الأخ في الحضانة، وتتأخر عن الأم، وعن الأب عند غير الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1904}.
  en: A sister is one born to the same mother and father or one of them, and includes full, paternal, maternal and milk sisters; she is a prohibited kinswoman for keeping ties, marriage, maintenance and blood-money; in inheritance she is blocked by what blocks a brother; the full and paternal sisters inherit by fixed share or agnation, the maternal sister by fixed share only; in custody she precedes the brother and follows the mother, and follows the father in schools other than the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1904}.
