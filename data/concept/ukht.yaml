label:
  ar: أخت
  en: Sister (full, paternal and maternal) in law
  es: "Cuñada (de padre y de madre)"
  fr: "belle-sœur (par alliance, par le père et par la mère)"
  ur: "بہن ⁦(مکمل، پھوپھی اور ماموں)⁩"
  tr: "kız kardeş"
  id: "saudara perempuan"
summary:
  ar: الأخت من ولدتها أمك وأبوك أو أحدهما، وتشمل الشقيقة ولأب ولأم والرضاعية؛ وهي من ذوات الرحم المحرم في الصلة والنكاح والنفقة والدية؛ وفي الإرث تُحجب بما يحجب الأخ، وترث الشقيقة ولأب بالفرض أو التعصيب، والأخت لأم بالفرض فقط؛ وتتقدم على الأخ في الحضانة، وتتأخر عن الأم، وعن الأب عند غير الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1904}.
  en: A sister is one born to the same mother and father or one of them, and includes full, paternal, maternal and milk sisters; she is a prohibited kinswoman for keeping ties, marriage, maintenance and blood-money; in inheritance she is blocked by what blocks a brother; the full and paternal sisters inherit by fixed share or agnation, the maternal sister by fixed share only; in custody she precedes the brother and follows the mother, and follows the father in schools other than the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1904}.
  es: "Una hermana es aquella nacida de la misma madre y padre o de uno de ellos, e incluye a las hermanas de sangre, paternas, maternas y de leche; es una pariente prohibida para mantener lazos, contraer matrimonio, recibir manutención o compensación económica; en materia de herencia, está sujeta a las mismas restricciones que un hermano; las hermanas de sangre y paternas heredan por cuota fija o agnación, la hermana materna solo por cuota fija; en cuanto a la custodia, precede al hermano y sigue a la madre, y sigue al padre en las escuelas distintas a la Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1904}."
  fr: "Une sœur est une personne née du même père et de la même mère, ou de l'un d'eux. Elle comprend les sœurs germaines, paternelles, maternelles et de lait. Elle est une parente interdite en matière de liens familiaux, de mariage, d'entretien et de compensation financière. En matière d'héritage, elle est soumise aux mêmes restrictions qu'un frère. Les sœurs germaines et paternelles héritent par part fixe ou par filiation, la sœur maternelle uniquement par part fixe. En matière de garde, elle précède le frère et suit la mère, et suit le père dans les écoles autres que l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1904}."
  ur: "بہن وہ ہوتی ہے جو ایک ہی ماں اور باپ یا ان میں سے کسی ایک سے پیدا ہوتی ہے، اور اس میں مکمل، پھوپھی، زچہ اور دودھ کی بہنیں شامل ہوتی ہیں۔ وہ رشتہ داری، شادی، نگہداشت اور خونریزی کے لیے ممنوعہ رشتہ دار ہے۔ وراثت میں وہ اس سے مسدود ہے جو ایک بھائی کو روکتا ہے۔ مکمل اور پھوپھی بہنیں مقررہ حصہ یا اگنیشن کے ذریعہ وراثت میں ملتی ہیں، زچگی بہن صرف مقررہ حصہ کے ذریعہ؛ حراست میں وہ بھائی پر سبقت لے جاتی ہے اور ماں کی پیروی کرتی ہے، اور احناف کے علاوہ دیگر مکاتب میں والد کی پیروی کرتی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1904}۔"
  tr: "Anneniz ve babanızdan ya da onlardan birinden, kız kardeş, baba, anne ve emziren akrabalardan doğan bir kız kardeş; evlilik, nafaka ve kan parası gibi akrabalık bağları yasaklanmış olanlardandır. Mirasta, erkek kardeş gibi alıkoyulur, kız kardeş babadan sabit veya agnation (sabit veya agnation) ile miras alır ve kız kardeş sadece anneden sabit (sabit veya agnation) miras alır. Hanefi olmayan okullara göre kardeşten önce gelir ve anne ve babadan daha geç kalır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1904}."
  id: "Seorang saudara perempuan yang lahir dari ibu dan ayah Anda atau salah satu dari mereka, termasuk saudara perempuan, ayah, ibu, dan kerabat yang menyusui; dia termasuk di antara mereka yang memiliki ikatan kekerabatan terlarang dalam pernikahan, nafkah, dan uang darah. Dalam warisan, dia ditahan seperti saudara laki-laki, saudara perempuan mewarisi dari ayah melalui agnation tetap atau agnation (tetap atau agnation) dan saudari hanya mewarisi secara tetap (tetap atau agnasi) dari ibu. Dia mendahului saudara laki-laki dalam asuhan dan lebih lambat dari ibu dan ayah menurut aliran non-Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1904}."
