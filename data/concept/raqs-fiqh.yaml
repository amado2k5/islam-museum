label:
  ar: "الرقص"
  en: "Raqs (dancing): its ruling, its conditions, the dancer's testimony, and the hire for it"
  ur: "رقص"
summary:
  ar: "الرقص في اللغة الإسراع في الحركة والاضطراب، وفي الاصطلاح التمايل والخفض والرفع بحركات موزونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} واستدل من أباحه بحديث الحبشة الذين كانوا يلعبون بحرابهم في مسجد النبي، وكره الحنفية والمالكية والحنابلة الرقص لأنه دناءة وسفه ومن مسقطات المروءة، وحرّم ابن تيمية اتخاذه عبادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} ويحرم الرقص إذا صاحبه محرم كشرب الخمر أو كشف العورة، وقيد الشافعية إباحته بمن لا يتكسر فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} وترد شهادة الرقاص لسقوط المروءة، وعند الشافعية والحنابلة يعتبر الإكثار والمداومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857} والاستئجار على الرقص يتبع حكمه، فيحرم إذا كان حراما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857}"
  en: "Raqs (dancing) in the lexicon is quick movement and agitation; technically it is swaying, bowing and rising in measured motions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} Those who allow it cite the hadith of the Abyssinians who played with their spears in the Prophet's mosque; the Hanafis, Malikis and Hanbalis dislike it as baseness, folly and a loss of manly dignity, and Ibn Taymiyya forbids making it a worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} It is forbidden when accompanied by something unlawful, such as drinking or exposing the private parts, and the Shafi'is allow it only where it is fitting and free of affectation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} The testimony of a dancer is rejected for loss of manly dignity; the Shafi'is and Hanbalis count habitual and frequent dancing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857} Hiring someone to dance follows its ruling: if the dance is forbidden the hire is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857}"
  ur: "رقص مرد یا عورت کی حرکت کو کہتے ہیں؛ حنفی، مالکی اور حنبلی اسے مکروہ کہتے ہیں، جبکہ اس کے ساتھ حرام امور ہوں تو حرام ہے، اور رقاص کی گواہی مردود ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857}"
