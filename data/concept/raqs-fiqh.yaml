id: concept/raqs-fiqh
class: concept
kind: legal
label:
  ar: "الرقص"
  en: "Raqs (dancing): its ruling, its conditions, the dancer's testimony, and the hire for it"
  ur: "رقص"
  es: "Raqs (danza): su reglamentación, sus condiciones, el testimonio del bailarín y la remuneración por ello."
  fr: "Raqs (danse): son règlement, ses conditions, le témoignage du danseur et sa rémunération."
  tr: "Dans"
  id: "Menari"
summary:
  ar: "الرقص في اللغة الإسراع في الحركة والاضطراب، وفي الاصطلاح التمايل والخفض والرفع بحركات موزونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} واستدل من أباحه بحديث الحبشة الذين كانوا يلعبون بحرابهم في مسجد النبي، وكره الحنفية والمالكية والحنابلة الرقص لأنه دناءة وسفه ومن مسقطات المروءة، وحرّم ابن تيمية اتخاذه عبادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} ويحرم الرقص إذا صاحبه محرم كشرب الخمر أو كشف العورة، وقيد الشافعية إباحته بمن لا يتكسر فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} وترد شهادة الرقاص لسقوط المروءة، وعند الشافعية والحنابلة يعتبر الإكثار والمداومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857} والاستئجار على الرقص يتبع حكمه، فيحرم إذا كان حراما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857}"
  en: "Raqs (dancing) in the lexicon is quick movement and agitation; technically it is swaying, bowing and rising in measured motions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} Those who allow it cite the hadith of the Abyssinians who played with their spears in the Prophet's mosque; the Hanafis, Malikis and Hanbalis dislike it as baseness, folly and a loss of manly dignity, and Ibn Taymiyya forbids making it a worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} It is forbidden when accompanied by something unlawful, such as drinking or exposing the private parts, and the Shafi'is allow it only where it is fitting and free of affectation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} The testimony of a dancer is rejected for loss of manly dignity; the Shafi'is and Hanbalis count habitual and frequent dancing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857} Hiring someone to dance follows its ruling: if the dance is forbidden the hire is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857}"
  ur: "رقص مرد یا عورت کی حرکت کو کہتے ہیں؛ حنفی، مالکی اور حنبلی اسے مکروہ کہتے ہیں، جبکہ اس کے ساتھ حرام امور ہوں تو حرام ہے، اور رقاص کی گواہی مردود ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857}"
  es: "Raqs (danza) en el léxico es movimiento rápido y agitación; técnicamente es balancearse, inclinarse y elevarse en movimientos medidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} Quienes lo permiten citan el hadiz de los abisinios que jugaban con sus lanzas en la mezquita del Profeta; los hanafíes, malikíes y hanbalíes lo desaprueban por considerarlo bajeza, necedad y pérdida de dignidad masculina, e Ibn Taymiyya prohíbe convertirlo en un acto de adoración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} Está prohibido cuando va acompañado de algo ilícito, como beber o exponer las partes íntimas, y los shafiíes lo permiten solo cuando es apropiado y libre de afectación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} Se rechaza el testimonio de un bailarín por pérdida de la dignidad varonil; los Shafi'is y Hanbalis cuentan con bailes habituales y frecuentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857} Contratar a alguien para bailar sigue su regla: si el baile está prohibido, la contratación está prohibida. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857}"
  fr: "Le terme « raqs » (danse) désigne, dans le lexique, des mouvements rapides et de l'agitation; techniquement, il s'agit de se balancer, de s'incliner et de se relever par des mouvements mesurés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} Ceux qui l'autorisent citent le hadith des Abyssins qui jouaient avec leurs lances dans la mosquée du Prophète. Les hanafites, les malikites et les hanbalites le désapprouvent, le considérant comme une forme de bassesse, de folie et une perte de dignité masculine, et Ibn Taymiyya interdit d'en faire un acte de culte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} Il est interdit lorsqu'il est accompagné d'un acte illicite, comme la consommation d'alcool ou l'exhibition des parties intimes, et les chaféites ne l'autorisent que lorsqu'il est approprié et sans affectation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} Le témoignage d'un danseur est rejeté pour perte de dignité virile; les Shafi'is et les Hanbalis comptent des danses habituelles et fréquentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8857} Embaucher quelqu'un pour danser suit sa décision: si la danse est interdite, la location est interdite. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8857}"
  tr: "Dilbilimde dans etmek, harekete geçmeye acele etmek ve huzursuz olmak anlamına gelirken, terminolojide ölçülü hareketlerle sallanma, alçalma ve yukarı kalkma anlamına gelir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8855} Habeşlilerin Peygamber Camii'nde mızraklarıyla oynayan hadislerini aktardı. Hanefiler, Malikiler ve Hanbaliler dansı sevmezlerdi çünkü dans alçaklık, alçaklık ve nezaket işaretiydi ve İbn Teymiyye bunu ibadet olarak yasakladı. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8855} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8856} ve mahram eşliğinde dans etmek yasaktır, örneğin alkol içmek veya özel bölgeleri açmak gibi, Şafi'ler ise mahram eşliğinde dans etmek yasaktır; eğer dans kırılmış değilse izin verirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8856} Dansçının tanıklığı erkekliğin kaybı için verilir ve Şafi'ler ile Hanbali'lere göre aşırı ve ısrarcı kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8857} Dans için kiralama kuralına bağlıdır, bu yüzden yasaksa, yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8857}"
  id: "Dalam linguistik, menari berarti bergerak cepat dan menjadi gelisah, sedangkan dalam terminologi, menari adalah mengayunkan, menurunkan, dan mengangkat dengan gerakan yang terukur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8855} Ia mengutip hadis orang Abyssinia yang biasa bermain tombak di Masjid Nabi. Hanafi, Maliki, dan Hanbal tidak suka menari karena dianggap hina dan dianggap hina serta tanda kesopanan, dan Ibn Taymiyyah melarangnya sebagai ibadah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8855} {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.8856} dan menari dilarang jika disertai dengan mahram, seperti minum alkohol atau membuka bagian pribadi, dan syafi'i membatasi jika tidak dipecahkan di dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8856} Kesaksian penari diberikan atas kehilangan kejantanan, dan menurut Shafi'i dan Hanbali, kesaksian itu dianggap berlebihan dan bertahan lama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8856} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8857} Menyewa untuk menari mengikuti keputusannya, jadi dilarang jika dilarang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8857}"
