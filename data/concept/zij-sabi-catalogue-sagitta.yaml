  fr: "Sagitta (an-nasl)"
  tr: "bıçak"
  id: "bilah"
summary:
  ar: "يذكر فهرس البتاني صورة السهم باسمه اليوناني بِستوس، ويسمّيه بالعربية النصل، أي حدّ السهم. يذكر كوكبًا منفردًا في السهم، وآخر في طرفه، ويرد القسم قبل صورة النسر الطائر. مواضع الكواكب في الجدول لم تُنقل هنا. {cite:nallino-albatenii-opus-astronomicum pp.152}"
  en: "The catalogue gives the arrow the Greek name bistos and the Arabic an-nasl, the point of the arrow. It lists a solitary star in the shaft and one at the tip, and the section comes just before Aquila. The positions in the table are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.152}"
  ur: "فہرست میں تیر کو یونانی نام بسطوس اور عربی نام النصل، یعنی تیر کی نوک، کے ساتھ لیا گیا ہے۔ اس میں تیر کے دستے پر ایک الگ ستارہ اور اس کی نوک پر ایک ستارہ درج ہے۔ یہ حصہ عقاب سے پہلے آتا ہے۔ جدول کے مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.152}"
  es: "El catálogo le da a la flecha el nombre griego bistos y el árabe an-nasl, que significa punta de la flecha. Menciona una estrella solitaria en el asta y otra en la punta, y la sección se encuentra justo antes de Aquila. Las posiciones en la tabla no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.152}"
  fr: "Le catalogue donne à la flèche le nom grec de bistos et le nom arabe d'an-nasl, désignant la pointe de la flèche. Il mentionne une étoile solitaire sur la hampe et une autre à l'extrémité, et cette section précède immédiatement celle consacrée à l'Aigle. Les positions indiquées dans le tableau ne sont pas retranscrites ici. {cite:nallino-albatenii-opus-astronomicum pp.152}"
  tr: "Al-Battani'nin indeksinde ok, Yunanca adı olan Pistos ile anılır ve Arapçada \"bıçak\" yani okun kenarı olarak adlandırılır. Okun içinde tek bir gezegen ve ucunda başka bir gezegenden bahseder ve bu bölüm uçan kartal resminden önce gelir. Tablodaki gezegen konumları burada yer almamaktadır. {cite:nallino-albatenii-opus-astronomicum pp.152}"
  id: "Indeks Al-Battani menyebutkan anak panah dengan nama Yunaninya, Pistos, dan menyebutnya dalam bahasa Arab \"bilah,\" yang berarti ujung anak panah. Ia menyebutkan satu planet di dalam anak panah dan satu lagi di ujungnya, dan bagian ini muncul sebelum gambar elang yang terbang. Posisi planet dalam tabel tidak disertakan di sini. {cite:nallino-albatenii-opus-astronomicum pp.152}"
