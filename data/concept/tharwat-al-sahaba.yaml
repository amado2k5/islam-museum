label: { ar: "ثروات الصحابة في عهد عثمان", en: "The Companions' fortunes under Uthman", es: "La suerte de los Compañeros bajo el mando de Uthman", fr: "Le destin des Compagnons sous Uthman" }
summary:
  ar: "سجّل المسعودي ما اقتناه جماعة من الصحابة في أيام عثمان: عثمان نفسه خلف عند خازنه خمسين ومائة ألف دينار وألف ألف درهم وضياعه بوادي القرى وحنين بمائة ألف دينار، والزبير ابتنى دوراً بالبصرة ومصر والكوفة والإسكندرية وخلف خمسين ألف دينار وألف فرس وألف عبد وأمة، وطلحة كانت غلته من العراق كل يوم ألف دينار وداره بالكوفة الكناسة، وعبد الرحمن بن عوف بلغ ربع ثمن ماله أربعة وثمانين ألفاً وله مائة فرس وألف بعير وعشرة آلاف شاة، وسعد بنى قصر العقيق، وزيد بن ثابت خلف من الذهب والفضة ما كان يكسر بالفؤوس، ويعلى بن منية خلف خمسمائة ألف دينار، وقابل ذلك بعمر الذي أنفق في حجه ستة عشر ديناراً وقال لقد أسرفنا {cite:muruj-al-dhahab p. 628-629}."
  en: "al-Mas'udi's famous wealth-register: Uthman's own millions and estates, al-Zubayr's multi-city houses and thousand horses, Talha's daily thousand-dinar yield and the Kunnasa palace, Ibn 'Awf's 100 horses and 10,000 sheep, Sa'd's 'Aqiq castle, Zayd's axe-split gold, Ya'la's half-million — set against Umar's sixteen-dinar hajj and 'we were extravagant' {cite:muruj-al-dhahab p. 628-629}."
  es: "El famoso registro de riquezas de al-Mas'udi: los millones y propiedades de Uthman, las casas de al-Zubayr en varias ciudades y sus mil caballos, el ingreso diario de mil dinares de Talha y el palacio de Kunnasa, los 100 caballos y 10.000 ovejas de Ibn 'Awf, el castillo de 'Aqiq de Sa'd, el oro partido con hacha de Zayd, el medio millón de Ya'la, en comparación con el hajj de dieciséis dinares de Umar y \"fuimos extravagantes\" {cita:muruj-al-dhahab pág. 628-629}."
  fr: "Le célèbre registre des richesses d'al-Mas'udi: les millions et les domaines d'Uthman, les maisons dans plusieurs villes et les mille chevaux d'al-Zubayr, le rendement quotidien de mille dinars de Talha et le palais de Kunnasa, les 100 chevaux et les 10 000 moutons d'Ibn 'Awf, le château d'Aqiq de Sa'd, l'or fendu à la hache de Zayd, le demi-million de Ya'la — mis en contraste avec le hajj à seize dinars d'Umar et « nous étions extravagants » {cite: muruj-al-dhahab p. 628-629}."
