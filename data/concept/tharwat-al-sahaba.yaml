label: { ar: "ثروات الصحابة في عهد عثمان", en: "The Companions' fortunes under Uthman" }
summary:
  ar: "سجّل المسعودي ما اقتناه جماعة من الصحابة في أيام عثمان: عثمان نفسه خلف عند خازنه خمسين ومائة ألف دينار وألف ألف درهم وضياعه بوادي القرى وحنين بمائة ألف دينار، والزبير ابتنى دوراً بالبصرة ومصر والكوفة والإسكندرية وخلف خمسين ألف دينار وألف فرس وألف عبد وأمة، وطلحة كانت غلته من العراق كل يوم ألف دينار وداره بالكوفة الكناسة، وعبد الرحمن بن عوف بلغ ربع ثمن ماله أربعة وثمانين ألفاً وله مائة فرس وألف بعير وعشرة آلاف شاة، وسعد بنى قصر العقيق، وزيد بن ثابت خلف من الذهب والفضة ما كان يكسر بالفؤوس، ويعلى بن منية خلف خمسمائة ألف دينار، وقابل ذلك بعمر الذي أنفق في حجه ستة عشر ديناراً وقال لقد أسرفنا {cite:muruj-al-dhahab p. 628-629}."
  en: "al-Mas'udi's famous wealth-register: Uthman's own millions and estates, al-Zubayr's multi-city houses and thousand horses, Talha's daily thousand-dinar yield and the Kunnasa palace, Ibn 'Awf's 100 horses and 10,000 sheep, Sa'd's 'Aqiq castle, Zayd's axe-split gold, Ya'la's half-million — set against Umar's sixteen-dinar hajj and 'we were extravagant' {cite:muruj-al-dhahab p. 628-629}."
