label:
  ar: "إسقنقور"
  en: "Isqanqur (skink lizard)"
  ur: "اسقنقور ⁦(سقنقور)⁩"
  es: "Isqanqur (lagarto escamoso)"
  fr: "Isqanqur (lézard scinque)"
summary:
  ar: "إسقنقور ورل مائي يُصاد من نيل مصر؛ ينفع من العلل الباردة في العصب، ويذكر الكتاب أن ملحه مهيّج للباه {cite:canon-ibn-sina-print-v1 p.368} {cite:canon-ibn-sina-print-v1 p.369}."
  en: "Isqanqur is a water lizard caught in the Nile of Egypt. It helps cold ailments of the nerves, and the book says its salt stirs desire {cite:canon-ibn-sina-print-v1 p.368} {cite:canon-ibn-sina-print-v1 p.369}."
  ur: "اسقنقور ایک آبی چھپکلی ہے جو مصر کے نیل سے پکڑی جاتی ہے؛ یہ اعصاب کی سرد بیماریوں میں مفید ہے، اور کتاب کے مطابق اس کا نمک خواہش بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.368} {cite:canon-ibn-sina-print-v1 p.369}۔"
  es: "Isqanqur es un lagarto acuático capturado en el Nilo de Egipto. Ayuda a aliviar dolencias nerviosas causadas por el frío, y el libro dice que su sal despierta el deseo {cite:canon-ibn-sina-print-v1 p.368} {cite:canon-ibn-sina-print-v1 p.369}."
  fr: "L'isqanqur est un lézard d'eau pêché dans le Nil en Égypte. Il soulage les affections nerveuses dues au froid, et le livre dit que son sel éveille le désir {cite:canon-ibn-sina-print-v1 p.368} {cite:canon-ibn-sina-print-v1 p.369}."
