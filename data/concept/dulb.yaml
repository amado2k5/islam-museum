summary:
  ar: "قشره وجوزه شديد اليبس، بارد في الأولى. رماد ورقه يُجعل على التقشر والجراحات الوسخة فتبرأ، وقشره المطبوخ بالخل ينفع من حرق النار، وورقه لأوجاع المفاصل، وقشوره المطبوخة بالخل لوجع الأسنان، وغباره يضر بالسمع والعين والرئة، وثمرته الطرية بالشراب لنهش الهوام {cite:canon-ibn-sina-print-v1 p.437}."
  en: "Its bark and nut are very dry, cold in the first degree. Ash of the leaf put on flaking and dirty wounds heals them; bark boiled in vinegar helps a burn; leaves for joint pain; bark boiled in vinegar for toothache. Its dust harms the hearing, the eye and the lung. The fresh fruit in wine helps the bites of pests {cite:canon-ibn-sina-print-v1 p.437}."
  ur: "اس کا چھلکا اور گری بہت خشک ہے، پہلے درجے میں ٹھنڈی۔ پتے کی راکھ چھلنے والے اور گندے زخموں پر رکھی جائے تو وہ ٹھیک ہو جاتے ہیں؛ سرکے میں ابالا ہوا چھلکا آگ کے جلنے میں مفید ہے؛ پتا جوڑوں کے درد میں؛ سرکے میں ابالے ہوئے چھلکے دانت کے درد میں۔ اس کا غبار سماعت، آنکھ اور پھیپھڑے کو نقصان دیتا ہے؛ تازہ پھل شراب کے ساتھ کیڑوں کے کاٹے کے لیے ہے {cite:canon-ibn-sina-print-v1 p.437}۔"
  es: "Su corteza y su nuez son muy secas, frías en primer grado. La ceniza de la hoja aplicada sobre heridas descamadas y sucias las cura; la corteza hervida en vinagre ayuda con las quemaduras; las hojas para el dolor articular; la corteza hervida en vinagre para el dolor de muelas. Su polvo daña el oído, los ojos y los pulmones. El fruto fresco en vino ayuda con las picaduras de insectos {cite:canon-ibn-sina-print-v1 p.437}."
  fr: "Son écorce et ses noix sont très sèches et froides au premier degré. La cendre de ses feuilles, appliquée sur les plaies squameuses et sales, les guérit; l’écorce bouillie dans du vinaigre soulage les brûlures; les feuilles sont utilisées contre les douleurs articulaires; l’écorce bouillie dans du vinaigre contre les maux de dents. Sa poussière est nocive pour l’ouïe, les yeux et les poumons. Le fruit frais, macéré dans du vin, soulage les piqûres d’insectes."
