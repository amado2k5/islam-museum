label:
  ar: الإلهام
  en: Ilham — inspiration
  ur: الہام
summary:
  ar: "قذف في القلب بلا وحي ولا رؤيا: علم يفتحه الله على قلب من يشاء كما ألهم أم موسى أن أرضعيه، وكرامة الأولياء لا نبوة ولا حجة {cite:tafsir-ibn-kathir} {cite:aqida-tahawiyya}."
  en: "A casting into the heart without revelation or dream: a knowing God opens upon the heart of whom He wills, as He inspired Musa's mother to nurse him — a karama of the saints, not prophethood nor proof {cite:tafsir-ibn-kathir} {cite:aqida-tahawiyya}."
  ur: "دل میں بغیر وحی یا خواب کے بات ڈالنا: وہ علم جو اللہ جس کے دل پر چاہتا ہے کھولتا ہے جیسے اس نے موسیٰ کی ماں کو الہام کیا کہ اسے دودھ پلائے — اولیاء کی کرامت ہے نہ نبوت نہ حجت {cite:tafsir-ibn-kathir} {cite:aqida-tahawiyya}۔"
