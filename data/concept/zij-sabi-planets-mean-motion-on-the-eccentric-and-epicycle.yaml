label: { ar: "حركة الكوكب الوسطى على الفلك الخارج وفلك التدوير", en: "The planet's mean motion on the eccentric and the epicycle", ur: "خارج المرکز اور فلکِ تدویر پر سیارے کی اوسط حرکت", es: "El movimiento medio del planeta en el excéntrico y el epiciclo.", fr: "Le mouvement moyen de la planète sur l'excentrique et l'épicycle", tr: "Dış ve iç döngülerdeki orta gezegen hareketi", id: "Gerakan planet tengah pada bagian luar dan epikikel" }
summary:
  ar: "يجري مركز فلك التدوير على الفلك الخارج من نقطة البعد الأبعد بقدر الحركة الوسطى للكوكب في الطول في اليوم، ويتحرك الكوكب على فلك التدوير من نقطة البعد بقدر حركته الخاصة في كل يوم. {cite:zij-sabi-nallino-byblion p.95}."
  en: "The centre of the epicycle travels on the eccentric from the far point at the planet's mean rate of longitude per day, and the planet moves on its epicycle from the apogee point at its own rate each day. {cite:zij-sabi-nallino-byblion p.95}."
  ur: "فلکِ تدویر کا مرکز خارج المرکز پر بُعدِ اَبعد سے سیارے کی روزانہ اوسط طولی حرکت کے مطابق چلتا ہے، اور سیارہ اپنے فلکِ تدویر پر بُعد کے نقطے سے اپنی خاص روزانہ حرکت کے ساتھ چلتا ہے۔ {cite:zij-sabi-nallino-byblion p.95}۔"
  es: "El centro del epiciclo se desplaza en la excéntrica desde el punto más alejado a la velocidad media de longitud del planeta por día, y el planeta se mueve en su epiciclo desde el punto de apogeo a su propia velocidad cada día. {cite:zij-sabi-nallino-byblion p.95}."
  fr: "Le centre de l'épicycle se déplace sur l'excentrique depuis le point le plus éloigné à la vitesse moyenne de longitude de la planète par jour, et la planète se déplace sur son épicycle depuis l'apogée à sa propre vitesse chaque jour. {cite:zij-sabi-nallino-byblion p.95}."
  tr: "Episiklinin merkezi, gezegenin bir günde ortalama boylam hareketine göre en uzak noktadan itibaren geçici yörünge üzerinde yer alır ve gezegen her gün kendi hareketiyle en uzak noktadan itibaren episikli boyunca hareket eder. {cite:zij-sabi-nallino-byblion s.95}."
  id: "Pusat epikikel terletak pada orbit sementara dari titik terjauh, berdasarkan pergerakan bujur rata-rata planet dalam sehari, dan planet bergerak sepanjang epikikel dari titik terjauh berdasarkan pergerakannya sendiri setiap hari. {cite:zij-sabi-nallino-byblion p.95}."
