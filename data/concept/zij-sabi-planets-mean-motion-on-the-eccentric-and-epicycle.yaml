label: { ar: "حركة الكوكب الوسطى على الفلك الخارج وفلك التدوير", en: "The planet's mean motion on the eccentric and the epicycle", ur: "خارج المرکز اور فلکِ تدویر پر سیارے کی اوسط حرکت", es: "El movimiento medio del planeta en el excéntrico y el epiciclo." }
summary:
  ar: "يجري مركز فلك التدوير على الفلك الخارج من نقطة البعد الأبعد بقدر الحركة الوسطى للكوكب في الطول في اليوم، ويتحرك الكوكب على فلك التدوير من نقطة البعد بقدر حركته الخاصة في كل يوم. {cite:zij-sabi-nallino-byblion p.95}."
  en: "The centre of the epicycle travels on the eccentric from the far point at the planet's mean rate of longitude per day, and the planet moves on its epicycle from the apogee point at its own rate each day. {cite:zij-sabi-nallino-byblion p.95}."
  ur: "فلکِ تدویر کا مرکز خارج المرکز پر بُعدِ اَبعد سے سیارے کی روزانہ اوسط طولی حرکت کے مطابق چلتا ہے، اور سیارہ اپنے فلکِ تدویر پر بُعد کے نقطے سے اپنی خاص روزانہ حرکت کے ساتھ چلتا ہے۔ {cite:zij-sabi-nallino-byblion p.95}۔"
  es: "El centro del epiciclo se desplaza en la excéntrica desde el punto más alejado a la velocidad media de longitud del planeta por día, y el planeta se mueve en su epiciclo desde el punto de apogeo a su propia velocidad cada día. {cite:zij-sabi-nallino-byblion p.95}."
