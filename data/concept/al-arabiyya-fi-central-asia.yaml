label:
  ar: "العربية في آسيا الوسطى"
  en: "Arabic in Central Asia"
  ur: "وسطی ایشیا میں عربی"
  fr: "l'arabe en Asie centrale"
  es: "el árabe en Asia Central"
  tr: "Orta Asya'da Arapça"
  id: "Bahasa Arab di Asia Tengah"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في آسيا الوسطى: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. والعربية في آسيا الوسطى صنفان صغيران معزولان تصنّفهما اليونسكو مهددين بالفعل، ولا يوجد عدد رسمي مستقل لمتكلميهما. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Central Asia: its legal status, the varieties spoken and the official figures, each as the summary gives it. Central Asian Arabic is two small isolated varieties that UNESCO classes as definitely endangered, with no separate official count of speakers. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ وسطی ایشیا میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ وسطی ایشیائی عربی دو چھوٹی الگ تھلگ قسمیں ہیں جنہیں یونیسکو یقینی طور پر خطرے میں درجہ بند کرتا ہے، اور بولنے والوں کی کوئی الگ سرکاری گنتی نہیں۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe en Asie centrale : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. L'arabe d'Asie centrale se compose de deux petites variétés isolées que l'UNESCO classe comme définitivement menacées, sans décompte officiel séparé de locuteurs. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Asia Central: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. El árabe de Asia Central son dos pequeñas variedades aisladas que la UNESCO clasifica como definitivamente amenazadas, sin recuento oficial separado de hablantes. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
  tr: "Bu sayfa, müzenin sağladığı bir araştırma özetinin Orta Asya'daki Arapça hakkında ne söylediğini sunmaktadır: yasal statüsü, konuşulan çeşitleri ve bildirilen resmi sayılar. Orta Asya'da Arapça, UNESCO tarafından zaten tehdit altında olan iki küçük, izole kategoridir ve konuşmacılarının bağımsız resmi numarası yoktur. Müze, özet olarak adlandırdığı sayfaları açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi kullanımına izin vermiştir. Özette resmi bir kaynak veya numara bulunmadığı belirtildiğinden, sayfa bunu sözlü olarak belirtmekte ve müze kendi hesabından bir numara vermemektedir."
  id: "Halaman ini menyajikan apa yang dikatakan ringkasan penelitian yang disediakan museum tentang bahasa Arab di Asia Tengah: status hukumnya, varian yang diucapkan, dan angka resmi yang dilaporkan. Bahasa Arab di Asia Tengah adalah dua kategori kecil dan terisolasi yang sudah terancam oleh UNESCO, dan penuturnya tidak memiliki nomor resmi independen. Museum belum membuka halaman yang disebut ringkasan, dan pendiri telah mengizinkan penggunaannya seperti yang dinyatakan pada 21 November 2026. Karena ringkasan menyatakan tidak ada sumber atau nomor resmi, halaman tersebut secara lisan menyatakannya, dan museum tidak memberikan nomor dari akun sendiri."
