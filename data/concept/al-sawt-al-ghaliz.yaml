id: concept/al-sawt-al-ghaliz
class: concept
kind: scientific
label:
  ar: "الصوت الغليظ"
  en: "The coarse voice"
  fr: "La voix grossière"
  ur: "موٹی آواز"
  es: "La voz áspera"
summary:
  ar: "قد يعرض الصوت الغليظ من أسباب البحة المرخية الموسعة للمجاري ويعرض من كثرة الصياح وعلاجه أصعب، وقد يعرض لمن يزاول النفخ الكثير في المزامير وفي البوقات خاصة لما يعرض من تقطيع نفسهم واحتباسه في الرئة فتتوسع المجاري {cite:canon-ibn-sina-print-v2 p.326}"
  en: "The coarse voice may arise from the huskiness's causes that relax and widen the passages, and it arises from much shouting, and its treatment is harder; and it may befall those who practise much blowing into the reed-pipes, and into the trumpets especially, for the cutting and withholding of their breath that befalls in the lung, so that the passages widen {cite:canon-ibn-sina-print-v2 p.326}"
  fr: "La voix grossière peut naître des causes de l’enrouement qui relâchent et élargissent les conduits, et elle naît des cris fréquents, et son traitement est plus difficile ; elle peut atteindre ceux qui pratiquent beaucoup le souffle dans les flûtes de roseau, et dans les trompettes surtout, à cause de la coupure et de la rétention de leur souffle qui se produisent dans le poumon, de sorte que les conduits s’élargissent {cite:canon-ibn-sina-print-v2 p.326}"
  ur: "موٹی آواز بھاری پن کے ان اسباب سے ہو سکتی ہے جو مجاری کو ڈھیلا اور وسیع کرتے ہیں اور زیادہ چیخنے سے بھی ہوتی ہے اور اس کا علاج مشکل تر ہے؛ اور یہ ان لوگوں کو بھی ہو سکتی ہے جو بانسریوں میں بہت پھونکتے ہیں اور خاص طور پر نرشنگوں میں کیونکہ ان کی سانس کا ٹکڑے ٹکڑے ہونا اور پھیپھڑے میں رک جانا ہوتا ہے جس سے مجاری پھیل جاتی ہیں {cite:canon-ibn-sina-print-v2 p.326}"
  es: "La voz áspera puede surgir de las causas de la ronquera que relajan y ensanchan las vías respiratorias, y surge de mucho grito, y su tratamiento es más difícil; y puede afectar a quienes practican mucho soplar en las flautas de caña, y en las trompetas especialmente, por el corte y la retención de la respiración que ocurre en los pulmones, de modo que las vías respiratorias se ensanchan {cite:canon-ibn-sina-print-v2 p.326}"
