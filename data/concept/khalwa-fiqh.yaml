label:
  ar: الخلوة
  en: Khalwa (seclusion with a woman)
  ur: خلوت
summary:
  ar: 'الخلوة لغة الانفراد بالشيء في مكان خال، وخلا بالزوجة خلوة؛ وتتصل بالانفراد والعزلة والستر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7790} الخلوة بمعنى الانفراد بالنفس مباحة وقد تستحب للذكر والعبادة، وبالغير تكون مباحة بين الرجلين أو المرأتين، وبين الرجل ومحارمه أو زوجته، وبين رجل وامرأة في وجود الناس بحيث لا يسمعون كلامهما؛ وتحرم بالأجنبية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791} الخلوة بالأجنبية محرمة باتفاق الفقهاء، لحديث «لا يخلون رجل بامرأة إلا كان ثالثهما الشيطان»؛ والحنفية يستثنون ملازمة المديونة التي هربت؛ والخلوة بالأجنبية للعلاج محرمة إلا مع محرم أو زوج أو امرأة ثقة على الراجح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792} الخلوة بحضور غيرها: الشافعية يرون تحريم خلوة الرجل بنسوة كالواحدة، والمشهور عندهم جواز خلوة الرجل بامرأتين ثقتين يحتشمهما، أو رجال مع امرأة إن أمن التواطؤ؛ والحنفية تنتفي الحرمة بوجود امرأة ثقة أو محرم؛ والمالكية يكرهون صلاة رجل بين صفوف النساء؛ والحنابلة يحرمون خلوة الرجل بعدد من النساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792} المخطوبة أجنبية من خاطبها فتحرم الخلوة بها باتفاق؛ والخلوة بالأمرد حرام إن كان صبيحا وخيفت الفتنة؛ والخلوة بالمحارم مباحة، ومنها الخلوة بالمطلقة رجعيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7793} الخلوة التي يترتب عليها أثر (الصحيحة عند الحنفية، وخلوة الاهتداء عند المالكية): لا يكون معها مانع من الوطء، حقيقي أو شرعي أو طبعي؛ فالمرض والصغر والرتق والقرن من الحقيقي، والصوم والإحرام والحيض من الشرعي، وحضور ثالث من الطبعي؛ ولا تصح في المسجد والطريق والصحراء والسطح المكشوف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7793}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794} المالكية يقيدون الخلوة بالبالغ غير المجبوب بمطيقة يمكن فيها الوطء عادة، وبإرخاء الستور أو غلق الباب؛ والشافعية في الجديد لا يرتبون الأثر على الخلوة لقوله تعالى «من قبل أن تمسوهن»؛ والحنابلة يرتبون الأثر بالخلوة مع البلوغ وإمكان الوطء ولو مع نوم أو عمى أو مانع شرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7795}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7795}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7796} أثر الخلوة في المهر: جمهور الفقهاء يوجبون المهر كاملا بالخلوة الصحيحة، ويستدلون بحديث «من كشف خمار امرأته...» وبإجماع الصحابة الذي نقله الطحاوي؛ والشافعي في الجديد لا أثر لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7797} أثرها في العدة: الحنفية والمالكية والحنابلة يوجبون العدة بالخلوة الصحيحة في النكاح الصحيح، والشافعية في الجديد لا يوجبونها بالخلوة المجردة من الوطء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7797} أثر الخلوة في الرجعة: الحنفية لا تكون رجعة بالخلوة، والمالكية يشترطون علم الدخول وعدم إنكار الوطء في الرجعة، وابن قدامة يرى الخلوة كالإصابة في إثبات الرجعة في ظاهر قول الخرقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798} أثرها في النسب: الحنفية والشافعية والحنابلة يثبتون النسب بالخلوة، والشافعية يجعلون الزوجة فراشا بمجرد الإمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798} أثرها في انتشار الحرمة: الخلوة الصحيحة تحرم الأخت وأربعا سوى الزوجة في العدة، وفي تحريم بنت الزوجة خلاف: الفتاوى الهندية تقول الخلوة لا تقوم مقام الوطء، ونوادر أبي يوسف لا تحل بنتها إذا خلا بها في الصوم أو الإحرام، والمشهور عند الحنابلة أنها تحرم الربيبة، وعن القاضي وابن عقيل لا تحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7799}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7799}'
  en: 'Seclusion is lexically being alone with a thing in an empty place; it is linked to solitude, withdrawal and concealment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7790} Being alone with oneself is lawful and may be recommended for remembrance and worship; with others it is lawful between two men, two women, a man and his mahram or his wife, and between a man and a woman in public where their talk is not heard; it is forbidden with a non-mahram woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791} Seclusion with a non-mahram woman is forbidden by agreement, on the report "no man is alone with a woman but the devil is the third"; the Hanafis excuse a creditor who sheltered a fleeing debtor; seclusion for treatment is forbidden unless a mahram, a husband or a trustworthy woman is present, on the sounder view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792} Seclusion with others present: the Shafiis forbid a man to be alone with several women as with one, but the usual Shafii view allows a man with two trusted women, or men with a woman if collusion is unlikely; the Hanafis lift the prohibition with a trustworthy woman or a mahram present; the Malikis dislike a man praying among women\''s rows; the Hanbalis forbid a man alone with several women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792} The betrothed is a non-mahram to her suitor, so seclusion with her is forbidden by agreement; seclusion with a beardless youth is forbidden if he is handsome and temptation is feared; seclusion with mahrams is lawful, including with a woman divorced by a revocable divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7793} Seclusion that has effects (the valid seclusion of the Hanafis, the sufficient seclusion of the Malikis): no bar to intercourse, whether physical, legal or natural; physical bars are illness, childhood, closure or horns; legal bars are fasting, pilgrim\''s state and menstruation; natural bar is a third person present; it is not valid in a mosque, the road, the open desert or an uncovered roof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7793}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794} The Malikis require an adult who is not castrated and a woman able to bear intercourse, with a curtain drawn or door closed; the Shafiis in the new view give no effect to seclusion, citing the verse on touching; the Hanbalis give it effect when the man is adult and can have intercourse, even if asleep, blind or under a legal bar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7795}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7795}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7796} Effect on the dower: most jurists require the full dower by a valid seclusion, citing the report of uncovering a wife\''s veil and the agreement of the Companions reported by al-Tahawi; the Shafiis in the new view give it no effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7797} Effect on the waiting period: the Hanafis, Malikis and Hanbalis require the waiting period after valid seclusion in a valid marriage; the Shafiis in the new view do not, without intercourse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7797} Effect on return to the wife: the Hanafis say seclusion is not a return; the Malikis require knowledge of consummation and no denial of intercourse for a return; Ibn Qudama holds seclusion equal to intercourse for a return on the apparent words of al-Kharaqi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798} Effect on descent: the Hanafis, Shafiis and Hanbalis establish paternity by seclusion, and the Shafiis make the wife a bed by mere possibility. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798} Effect on marriage bars: valid seclusion bars the sister and four others during the waiting period; on the daughter of the wife there is dispute: the Hindiyya says seclusion does not equal intercourse; Abu Yusuf does not bar her if he was alone with her while fasting or in ihram, Muhammad does; the Hanbalis\'' best-known view bars the stepdaughter, al-Qadi and Ibn Aqil do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7799}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7799}'
  ur: 'خلوت لغت میں کسی چیز کو خالی جگہ میں اکیلا کرنا ہے؛ اس کا تعلق انفراد، عزلت اور ستر سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7789}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7790} خود کے ساتھ خلوت مباح اور ذکر و عبادت کے لیے مستحب ہو سکتی ہے؛ دوسروں کے ساتھ دو مردوں، دو عورتوں، محرم یا بیوی کے ساتھ جائز ہے، اور مرد عورت کی ایسی خلوت جس میں ان کی بات نہ سنی جائے؛ اجنبی عورت کے ساتھ حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7790}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791} اجنبی عورت کے ساتھ خلوت بالاتفاق حرام ہے، حدیث «لا يخلون رجل بامرأة إلا كان ثالثهما الشيطان» کی بنا پر؛ حنفیہ بھاگی ہوئی مقروضہ کو پناہ دینے والے قرض دار کو مستثنیٰ کرتے ہیں؛ علاج کے لیے خلوت راجح قول کے مطابق محرم، شوہر یا ثقہ عورت کی موجودگی کے بغیر حرام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792} کسی اور کی موجودگی کے ساتھ خلوت: شافعیہ کے نزدیک ایک عورت کی طرح کئی عورتوں کے ساتھ بھی خلوت حرام ہے، مشہور قول میں دو ثقہ عورتوں کے ساتھ جائز ہے؛ حنفیہ ثقہ عورت یا محرم کی موجودگی میں حرمت نہیں سمجھتے؛ مالکیہ عورتوں کی صفوں میں مرد کی نماز کو مکروہ کہتے ہیں؛ حنابلہ کئی عورتوں کے ساتھ خلوت حرام کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7791}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792} منگیتر اجنبی ہے، اس کے ساتھ خلوت بالاتفاق حرام؛ خوبصورت امرد لڑکے کے ساتھ فتنہ کے خوف میں خلوت حرام؛ محارم کے ساتھ خلوت جائز ہے، رجعی طلاق والی عورت بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7792}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7793} اثر والی خلوت (حنفیہ کی صحیح خلوت، مالکیہ کی خلوتِ اہتداء): وطء میں کوئی حقیقی، شرعی یا طبعی مانع نہ ہو؛ حقیقی موانع میں بیماری، بچپن، رتق اور قرن؛ شرعی میں روزہ، احرام اور حیض؛ طبعی میں تیسرے کی موجودگی؛ مسجد، راستے، صحرا اور کھلی چھت پر صحیح نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7793}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794} مالکیہ بالغ غیر مجبوب مرد اور جماع کے قابل عورت کی خلوت، پردہ گرانے یا دروازہ بند کرنے کے ساتھ؛ شافعیہ نئے قول میں خلوت کا اثر نہیں مانتے، «من قبل أن تمسوهن» کی آیت سے؛ حنابلہ بالغ مرد اور جماع کے قابل عورت کی خلوت کا اثر مانتے ہیں، چاہے سونے، اندھے پن یا شرعی مانع کی حالت میں ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7794}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7795}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7795}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7796} مہر پر اثر: جمہور صحیح خلوت سے پورا مہر واجب کہتے ہیں، حدیث «من كشف خمار امرأته» اور طحاوی کے نقل کردہ صحابہ کے اجماع سے؛ شافعیہ نئے قول میں اثر نہیں مانتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7796}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7797} عدت پر اثر: حنفیہ، مالکیہ اور حنابلہ صحیح نکاح میں صحیح خلوت کے بعد عدت واجب کہتے ہیں؛ شافعیہ نئے قول میں جماع کے بغیر خلوت سے عدت واجب نہیں کہتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7797} رجعت پر اثر: حنفیہ کے نزدیک خلوت سے رجعت نہیں ہوتی؛ مالکیہ رجعت کے لیے دخول کا علم اور وطء کا انکار نہ ہونا شرط کہتے ہیں؛ ابن قدامہ خرقی کے ظاہری قول پر خلوت کو رجعت میں وطء کے برابر کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798} نسب پر اثر: حنفیہ، شافعیہ اور حنابلہ خلوت سے نسب ثابت کرتے ہیں، شافعیہ امکانِ خلوت سے بیوی کو فراش مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798} حرمت کے پھیلاؤ پر اثر: صحیح خلوت عدت میں بیوی کی بہن اور چار دیگر عورتوں کو حرام کرتی ہے؛ بیوی کی بیٹی (ربیبہ) کے بارے میں اختلاف ہے: فتاویٰ ہندیہ کے مطابق خلوت وطء کے قائم مقام نہیں، ابو یوسف کے نزدیک روزے یا احرام کی حالت میں خلوت سے بیٹی حرام نہیں، محمد کے نزدیک حرام؛ حنابلہ کا مشہور قول ربیبہ کو حرام کہتا ہے، قاضی اور ابن عقیل کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7798}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7799}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7799}'
