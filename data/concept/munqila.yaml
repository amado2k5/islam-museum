summary:
  ar: "المنقلة شجة تنقل العظم أي تكسره حتى يخرج منها فراش العظام. ولا قصاص فيها بالإجماع لعدم انضباطها، وفي الحديث أن فيها خمسة عشر من الإبل، وحكى ابن المنذر الإجماع عليه. وللفقهاء شروط لوجوب ديتها، وتفصيل في تعددها بحسب اتصال الجراحات أو انفصالها."
  en: "The munaqqila is a head wound that moves the bone, cracking it so that its thin layer comes out. By consensus there is no retaliation for it, since it cannot be measured. A report in the letter to the people of Yemen fixes its blood money at fifteen camels, a consensus Ibn al-Mundhir recorded. The jurists set conditions for the payment, and differ on whether several cuts count as one wound or several."
  ur: "منقلہ وہ زخم ہے جو ہڈی کو توڑ دے اور اس کی باریک تہہ نکل آئے۔ اس میں بالاجماع قصاص نہیں، اور اس میں پندرہ اونٹ دیت ہے۔ زخموں کی تعداد کے اعتبار سے دیت کی تعداد کا فقہاء نے بیان کیا ہے۔"
