summary:
  ar: "القطن في الكتاب معروف، وحبه مسخن مليّن جيد للصدر جدا نافع من السعال ومليّن للبطن، وعصارة ورقه تنفع لإسهال الصبيان {cite:canon-ibn-sina-print-v1 p.653}"
  en: "Qutn is in the book well known; its seed is heating and softening, very good for the chest, benefits cough and softens the belly, and the juice of its leaf benefits the diarrhoea of children {cite:canon-ibn-sina-print-v1 p.653}"
  ur: "قطن کتاب میں معروف ہے؛ اس کا بیج گرم کرنے والا اور نرم کرنے والا، سینے کے لیے بہت اچھا، کھانسی میں نافع اور پیٹ کو نرم کرنے والا ہے، اور اس کے پتے کا رس بچوں کے اسہال میں نافع ہے {cite:canon-ibn-sina-print-v1 p.653}۔"
  es: "El Qutn es bien conocido en el libro; su semilla es caliente y suavizante, muy buena para el pecho, alivia la tos y suaviza el estómago, y el jugo de su hoja beneficia la diarrea de los niños {cite:canon-ibn-sina-print-v1 p.653}"
  fr: "Qutn est bien connu dans le livre; sa graine est chauffante et adoucissante, très bonne pour la poitrine, bénéfique contre la toux et adoucissant l'estomac, et le jus de sa feuille est bénéfique contre la diarrhée des enfants {cite:canon-ibn-sina-print-v1 p.653}"
  tr: "Kitaptaki pamuk iyi bilinir ve tohumu göğüs için çok iyi bir müshildir, öksürük ve karın müshilleri için faydalıdır, ayrıca özü erkek çocukların ishalinde faydalıdır {cite:canon-ibn-sina-print-v1 s.653}"
  id: "Kapas dalam buku ini sudah dikenal luas, dan bijinya sangat baik sebagai pencahar untuk dada, bermanfaat untuk batuk dan pencahar perut, serta ekstraknya bermanfaat untuk diare anak laki-laki {cite:canon-ibn-sina-print-v1 hlm.653}"
