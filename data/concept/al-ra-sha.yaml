label:
  ar: "الرعشة"
  en: "Tremor"
  fr: "Tremblement"
  ur: "رعشہ"
  es: "Temblor"
summary:
  ar: "الرعشة علة آلية تحدث لعجز القوة المحركة عن تحريك العضل على الاتصال مقاومة للنقل المعاوق المداخل بتحريكه لتحريك الإرادة، فتختلط حركات إرادية بحركات غير إرادية أو ثبات إرادي بتحريكات غير إرادية، وهي آفة في القوة المحركة كما أن الخدر آفة في الحساسة {cite:canon-ibn-sina-print-v2 p.157}"
  en: "Tremor is an instrumental disorder arising for the motive power's inability to keep the muscles moving continuously against the obstructing resistance mingled with its motion for the will's motion, so voluntary motions mix with involuntary motions, or voluntary rest with involuntary movings; it is a lesion in the motive power as numbness is a lesion in the sensitive {cite:canon-ibn-sina-print-v2 p.157}"
  fr: "Le tremblement est un trouble instrumental qui survient parce que la faculté motrice est incapable de maintenir les muscles continûment en mouvement contre la résistance qui fait obstacle et se mêle à son mouvement pour le mouvement de la volonté, de sorte que les mouvements volontaires se mêlent aux mouvements involontaires, ou le repos volontaire aux mouvements involontaires ; c’est une lésion de la faculté motrice, comme l’engourdissement est une lésion de la faculté sensitive {cite:canon-ibn-sina-print-v2 p.157}"
  ur: "رعشہ ایک آلی علت ہے جو محرک قوت کی اس عجز سے پیدا ہوتی ہے کہ وہ عضل کو پیوستہ حرکت پر قائم نہ رکھ سکے اس مزاحم نقل کے مقابل جو اس کی حرکت میں ارادی حرکت کے ساتھ داخل ہو جائے، تو ارادی حرکتیں غیر ارادی حرکتوں سے یا ارادی سکون غیر ارادی حرکتوں سے مل جاتی ہیں؛ اور یہ محرک قوت میں آفت ہے جس طرح خدر حساسہ میں آفت ہے {cite:canon-ibn-sina-print-v2 p.157}۔"
  es: "El temblor es un trastorno instrumental que surge de la incapacidad de la fuerza motriz para mantener los músculos en movimiento continuo contra la resistencia obstructiva mezclada con su movimiento para el movimiento de la voluntad, de modo que los movimientos voluntarios se mezclan con los involuntarios, o el reposo voluntario con los movimientos involuntarios; es una lesión en la fuerza motriz como el entumecimiento es una lesión en la sensibilidad {cite:canon-ibn-sina-print-v2 p.157}"
