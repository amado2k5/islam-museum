summary:
  ar: "دواء يُسمّى فاساً لأن له حدّين كالفأس، حار الطبع فيه مرارة وعفوصة، يفتح سدد الأحشاء، وينفع من أوجاع المفاصل {cite:canon-ibn-sina-print-v1 p.379}."
  en: "A drug called the axe, because it has two edges like an axe. Hot in nature, with bitterness and astringency; it opens obstructions of the viscera and helps pains of the joints {cite:canon-ibn-sina-print-v1 p.379}."
  fr: "Une drogue médicinale appelée « la hache », parce qu’elle a deux tranchants comme une hache. De nature chaude, amère et astringente, elle est réputée lever les obstructions des viscères et soulager les douleurs articulaires {cite:canon-ibn-sina-print-v1 p.379}."
  ur: "ایک دوا جسے فاس یعنی کلہاڑی کہا جاتا ہے، کیونکہ اس کی کلہاڑی کی طرح دو دھاریں ہیں۔ طبیعت میں گرم، اس میں تلخی اور کسیلا پن ہے؛ یہ اندرونی اعضاء کی رکاوٹیں کھولتی ہے اور جوڑوں کے درد میں مفید ہے {cite:canon-ibn-sina-print-v1 p.379}۔"
  es: "Un fármaco llamado hacha, porque tiene dos filos como un hacha. De naturaleza caliente, con amargor y astringencia; desbloquea las obstrucciones de las vísceras y alivia los dolores articulares {cite:canon-ibn-sina-print-v1 p.379}."
  tr: "'Vasa' adı verilen bir ilaç çünkü balta gibi iki kenarlıdır, ateşli bir mizaca sahiptir, acı ve acı içerir, iç boşlukları açar ve eklem ağrıları için faydalıdır {cite:canon-ibn-sina-print-v1 s.379}."
  id: "'Vasa' adı verilen bir ilaç çünkü balta gibi iki kenarlıdır, ateşli bir mizaca sahiptir, acı ve acı içerir, iç boşlukları açar ve eklem ağrıları için faydalıdır {cite:canon-ibn-sina-print-v1 s.379}."
