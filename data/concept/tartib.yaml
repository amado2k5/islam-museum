summary:
  ar: "الترتيب جعل الأشياء الكثيرة حيث يطلق عليها اسم الواحد، ولبعض أجزائه تقدم على بعض. وهو في الوضوء فرض عند الشافعية والحنابلة، وسنة عند الحنفية والمالكية. وفي قضاء الفوائت يجب عند الحنفية والمالكية والحنابلة، ويسن عند الشافعية. ويتصل الترتيب بصفوف الصلاة والجنائز والحج والديون والكفارات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4937}"
  en: "Tartib is the arrangement of many things under one name, with some parts before others. In wudu it is obligatory for the Shafi'is and Hanbalis and a sunna for the Hanafis and Malikis. In making up missed prayers it is obligatory for the Hanafis, Malikis and Hanbalis and recommended for the Shafi'is. It also arises in the rows of prayer, funerals, pilgrimage, debts and expiations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4937}"
