label:
  ar: "الترتيب"
  en: "Tartib (order among parts of a duty)"
  ur: "ترتیب ⁦(اعمال کی ترتیب)⁩"
  es: "Tartib (orden entre las partes de un deber)"
  fr: "Tartib (ordre entre les parties d'un devoir)"
summary:
  ar: "الترتيب جعل الأشياء الكثيرة حيث يطلق عليها اسم الواحد، ولبعض أجزائه تقدم على بعض. وهو في الوضوء فرض عند الشافعية والحنابلة، وسنة عند الحنفية والمالكية. وفي قضاء الفوائت يجب عند الحنفية والمالكية والحنابلة، ويسن عند الشافعية. ويتصل الترتيب بصفوف الصلاة والجنائز والحج والديون والكفارات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4937}"
  en: "Tartib is the arrangement of many things under one name, with some parts before others. In wudu it is obligatory for the Shafi'is and Hanbalis and a sunna for the Hanafis and Malikis. In making up missed prayers it is obligatory for the Hanafis, Malikis and Hanbalis and recommended for the Shafi'is. It also arises in the rows of prayer, funerals, pilgrimage, debts and expiations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4937}"
  es: "El orden es la disposición de muchas cosas bajo un mismo nombre, con algunas partes antes que otras. En la ablución, es obligatorio para los shafiíes y hanbalíes, y una sunnah para los hanafíes y malikíes. Para recuperar las oraciones perdidas, es obligatorio para los hanafíes, malikíes y hanbalíes, y recomendable para los shafiíes. También se aplica en las filas de oración, funerales, peregrinaciones, deudas y expiaciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4937}"
  fr: "L'ordre consiste à organiser plusieurs choses sous un même nom, certaines parties précédant d'autres. Lors des ablutions, il est obligatoire pour les shafi'ites et les hanbalites, et recommandé pour les hanafites et les malikites. Pour rattraper les prières manquées, il est obligatoire pour les hanafites, les malikites et les hanbalites, et recommandé pour les shafi'ites. Il se manifeste également dans l'organisation des prières, les funérailles, les pèlerinages, les dettes et les expiations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4937}"
