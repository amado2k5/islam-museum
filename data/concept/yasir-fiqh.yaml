summary:
  ar: "اليسير في اللغة السهل، وفي الفقه القليل الذي لا يؤثر في الحكم: فالحركة اليسيرة لا تبطل الصلاة، والكلام اليسير المتعمد يبطلها، والفاصل اليسير بين الإيجاب والقبول والاستثناء والمستثنى منه لا يضر، وكذلك الإعراض اليسير بين الرضعات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18000}"
  en: "Yasir is easy or slight in lexicon; in fiqh it names the small amount that does not change a ruling. A slight movement does not break prayer, a slight deliberate speech does, a slight gap between offer and acceptance, or between an exception and what it excepts, does no harm, and a slight break between sucklings does not split them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18000}"
