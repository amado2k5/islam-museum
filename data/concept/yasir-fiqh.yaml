label:
  ar: "يَسير"
  en: "Yasir (slight or easy, fiqh)"
  es: "Yasir (leve o fácil, fiqh)"
  fr: "Yasir (léger ou facile, fiqh)"
  ur: "یاسر ⁦(معمولی یا آسان، فقہ)⁩"
  tr: "Kolay"
  id: "Mudah"
summary:
  ar: "اليسير في اللغة السهل، وفي الفقه القليل الذي لا يؤثر في الحكم: فالحركة اليسيرة لا تبطل الصلاة، والكلام اليسير المتعمد يبطلها، والفاصل اليسير بين الإيجاب والقبول والاستثناء والمستثنى منه لا يضر، وكذلك الإعراض اليسير بين الرضعات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18000}"
  en: "Yasir is easy or slight in lexicon; in fiqh it names the small amount that does not change a ruling. A slight movement does not break prayer, a slight deliberate speech does, a slight gap between offer and acceptance, or between an exception and what it excepts, does no harm, and a slight break between sucklings does not split them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18000}"
  es: "Yasir significa fácil o leve en el léxico; en fiqh designa la pequeña cantidad que no altera una norma. Un leve movimiento no interrumpe la oración, un leve discurso deliberado sí, una pequeña pausa entre la ofrenda y la aceptación, o entre una excepción y lo que exceptúa, no causa daño, y una breve pausa entre tomas no las divide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18000}"
  fr: "Yasir signifie « facile » ou « léger » dans le lexique; en fiqh, il désigne la petite quantité qui ne modifie pas une règle. Un léger mouvement n'interrompt pas la prière, contrairement à une petite parole prononcée. Un léger intervalle entre l'offrande et l'acceptation, ou entre une exception et ce qu'elle exclut, est sans conséquence, et une courte pause entre deux nourrissons ne les sépare pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18000}"
  ur: "یاسر لغت میں آسان ہے یا معمولی؛ فقہ میں اس کو اس قلیل رقم کا نام دیا گیا ہے جو حکم کو تبدیل نہیں کرتی ہے۔ ہلکی سی حرکت سے نماز نہیں ٹوٹتی، جان بوجھ کر بولنا، پیش کش اور قبولیت کے درمیان تھوڑا سا فاصلہ یا استثناء اور اس کے علاوہ کچھ نقصان نہیں پہنچاتا، اور دودھ پینے کے درمیان ہلکا سا وقفہ بھی ان کو الگ نہیں کرتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17997}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18000}"
  tr: "Arapçada \"yasir\" kelimesi kolay anlamına gelir ve İslam hukukunda hükmü etkilemeyen küçük bir şeye işaret eder. Örneğin, hafif bir hareket namazı geçersiz kılmazken, hafif ve kasıtlı bir konuşma geçersiz kılar. Teklif ile kabul arasında veya bir istisna ile istisna edilen şey arasında hafif bir duraksama namazı geçersiz kılmaz, emzirme arasında hafif bir yüz çevirme de öyle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18000}"
  id: "Dalam bahasa Arab, kata \"yasir\" berarti mudah, dan dalam yurisprudensi Islam, kata ini merujuk pada sesuatu yang kecil yang tidak memengaruhi hukum. Misalnya, gerakan kecil tidak membatalkan salat, sedangkan ucapan kecil yang disengaja membatalkannya. Jeda kecil antara penawaran dan penerimaan, atau antara pengecualian dan apa yang dikecualikan, tidak membatalkan salat, demikian pula sedikit berpaling di antara menyusui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18000}"
