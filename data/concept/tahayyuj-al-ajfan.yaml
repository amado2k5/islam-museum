label:
  ar: "تهيج الأجفان"
  en: "Irritation of the eyelids"
  ur: "پلکوں کا تهیج"
summary:
  ar: "يقع تهيج الأجفان لمواد رقيقة وبخارات ولضعف الهضم وسوئه كما يكون في السهر والحميات السهرية وقد يكون في أوائل الاستسقاء وسوء القنية ولأورام رطبة مثل ذات الرئة ومثل ليثرغس، وإذا حدث بالناقهين أنذر كثيراً بالنكس خصوصاً إذا أطاف بها من سائر الأعضاء ضمور وبقيت هي متهيجة منتفخة، والعلاج قطع السبب والتكميد {cite:canon-ibn-sina-print-v2 p.194}"
  en: "Irritation of the lids occurs for fine materials and vapours and for weakness and badness of digestion, as in sleeplessness and the sleepless fevers; it may be in the beginnings of dropsy and bad cachexia, and for moist swellings like pneumonia and lethargus; when it occurs in convalescents it warns much of relapse, especially if wasting of the other organs surrounds it while the lids stay irritated and swollen; the treatment is cutting the cause and fomentation {cite:canon-ibn-sina-print-v2 p.194}"
  ur: "پلکوں کا تهیج باریک مادوں اور بخارات اور ہضم کے ضعف و بدی سے ہوتا ہے جیسا بے خوابی اور بے خوابی والے بخاروں میں ہوتا ہے؛ اور استسقاء اور بد قنیہ کی ابتدا میں بھی ہو سکتا ہے اور تر ورموں کے لیے جیسے ذات الریہ اور ليثرغس؛ اور جب ناقہوں میں ہو تو نکس کی سخت دھمکی دیتا ہے بالخصوص جب اردگرد کے اعضا میں ضمور ہو اور پلکیں متهجہ سوجھی رہیں؛ علاج سبب کاٹنا اور تكمید ہے {cite:canon-ibn-sina-print-v2 p.194}"
