summary:
  ar: "زمّارة الراعي نبات حار يابس في أول الثانية، قيل إنه يحلّ التهيّج، وتُذكر له منافع في حصى الكلية وقروح الأمعاء والمغص، وفيه ما يُعرض على الحكم في آلام الرحم."
  en: "Zummarat al-ra'i is hot and dry at the start of the second degree; it is said to dissolve irritation, and the book lists uses for kidney stone, intestinal ulcers and colic, with a labelled listing on womb pains set aside for the founder's ruling."
  ur: "زمّارۃ الراعی گرم اور خشک ہے، دوسرے درجے کے آغاز میں؛ کہا گیا ہے کہ یہ جلن کو تحلیل کرتی ہے، اور کتاب گردے کی پتھری، آنتوں کے زخم اور قولنج کے فوائد درج کرتی ہے، جبکہ رحم کے درد کی مُعلَّم فہرست بانیِ ادارہ کے فیصلے کے لیے رکھی گئی ہے۔"
  es: "Zummarat al-ra'i es caliente y seco al comienzo del segundo grado; se dice que disuelve la irritación, y el libro enumera usos para cálculos renales, úlceras intestinales y cólicos, con una lista etiquetada sobre dolores uterinos reservada para la decisión del fundador."
