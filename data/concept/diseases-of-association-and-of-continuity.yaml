id: concept/diseases-of-association-and-of-continuity
class: concept
kind: scientific
label: { ar: "أمراض المشاركة وتفرق الاتصال عند ابن سينا", en: "Diseases of association and of broken continuity in the Canon", ur: "قانون میں مشارکت اور تفرق اتصال کی بیماریاں", es: "Enfermedades de asociación y de continuidad rota en el Canon", fr: "Maladies d'association et de rupture de continuité dans le Canon", tr: "İbn Sina'ya göre katılım hastalıkları ve dağınık iletişim", id: "Penyakit Partisipasi dan Komunikasi Tersebar menurut Ibn Sina" }
summary:
  ar: "يتمم ابن سينا أمراض التركيب بأمراض المشاركة، ثم يفرد الفصل الرابع لأمراض تفرق الاتصال فيعدد أسماءها بحسب العضو والاتجاه والعمق: الخدش والسحج والجراحة والقرحة وكسر العظم وبتر العصب والانفجار والفتق والخلع {cite:canon-ibn-sina-print-v1 pp.105-107}."
  en: "Ibn Sina completes the diseases of composition with diseases of association, then gives the fourth chapter to diseases of broken continuity and lists their names by organ, direction and depth: scratch, abrasion, wound, ulcer, broken bone, severed nerve, rupture, hernia and dislocation {cite:canon-ibn-sina-print-v1 pp.105-107}."
  es: "Ibn Sina completa las enfermedades de composición con las enfermedades de asociación, luego dedica el cuarto capítulo a las enfermedades de continuidad rota y enumera sus nombres por órgano, dirección y profundidad: rasguño, abrasión, herida, úlcera, hueso roto, nervio seccionado, ruptura, hernia y dislocación {cite:canon-ibn-sina-print-v1 pp.105-107}."
  fr: "Ibn Sina complète les maladies de composition par les maladies d'association, puis consacre le quatrième chapitre aux maladies de rupture de continuité et énumère leurs noms par organe, direction et profondeur: égratignure, abrasion, plaie, ulcère, fracture osseuse, nerf sectionné, rupture, hernie et luxation {cite:canon-ibn-sina-print-v1 pp.105-107}."
  ur: "ابن سینا نے مرکب کی بیماریوں کے ساتھ مرکبات کی بیماریوں کو مکمل کیا، پھر چوتھے باب میں ٹوٹے ہوئے تسلسل کی بیماریوں کا ذکر کیا اور اعضاء، سمت اور گہرائی کے لحاظ سے ان کے نام درج کیے: خراش، رگڑ، زخم، السر، ٹوٹی ہوئی ہڈی، ٹوٹا ہوا اعصاب، ٹوٹنا، ہرنیا اور نقل مکانی صفحہ 105-107}۔"
  tr: "İbn Sina, ortaklık hastalıklarıyla birleşen hastalıkları tamamlar, ardından dördüncü bölümü dağınık iletişim hastalıklarına ayırır; isimlerini organ, yön ve derinliğe göre sıralar: çizilme, aşınma, cerrahi, ülser, kemik kırığı, sinir amputasyonu, patlama, fıtık ve çıkık {cite:canon-ibn-sina-print-v1 s.105-107}."
  id: "Ibn Sina melengkapi penyakit dalam kombinasi dengan penyakit dalam kemitraan, kemudian mendedikasikan bab keempat untuk penyakit komunikasi tersebar, mencantumkan nama-namanya sesuai organ, arah, dan kedalaman: garukan, abrasi, operasi, tukak lambung, patah tulang, amputasi saraf, ledakan, hernia, dan dislokasi {cite:canon-ibn-sina-print-v1 hlm.105-107}."
