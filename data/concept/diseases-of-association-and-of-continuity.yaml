summary:
  ar: "يتمم ابن سينا أمراض التركيب بأمراض المشاركة، ثم يفرد الفصل الرابع لأمراض تفرق الاتصال فيعدد أسماءها بحسب العضو والاتجاه والعمق: الخدش والسحج والجراحة والقرحة وكسر العظم وبتر العصب والانفجار والفتق والخلع {cite:canon-ibn-sina-print-v1 pp.105-107}."
  en: "Ibn Sina completes the diseases of composition with diseases of association, then gives the fourth chapter to diseases of broken continuity and lists their names by organ, direction and depth: scratch, abrasion, wound, ulcer, broken bone, severed nerve, rupture, hernia and dislocation {cite:canon-ibn-sina-print-v1 pp.105-107}."
