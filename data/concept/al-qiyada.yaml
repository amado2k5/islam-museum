id: concept/al-qiyada
class: concept
kind: term
label:
  ar: "القيادة والأدوار الستة للقائد"
  en: "Leadership and the leader's six roles"
  ur: "قیادت اور قائد کے چھ کردار"
summary:
  ar: "القيادة عند طارق السويدان: القدرة على تحريك الناس نحو الهدف؛ والقائد لا يعمل إلا في ستة أدوار — التخطيط والإبداع وبناء العلاقات وحل المشاكل المزمنة وتطوير الذات والآخرين والتقدير — وما عداها إدارة يفوَّضها."
  en: "Leadership in Tareq al-Suwaidan's teaching: the ability to move people toward a goal; the leader works only in six roles — planning, innovation, building key relationships, solving chronic problems, developing himself and others, and appreciation — everything else is management, delegated."
  ur: "طارق السویدان کی تعلیم میں قیادت: لوگوں کو ہدف کی طرف چلانے کی صلاحیت؛ قائد صرف چھ کرداروں میں کام کرتا ہے — منصوبہ بندی، جدت، اہم تعلقات کی تعمیر، دائمی مسائل کا حل، اپنی اور دوسروں کی تربیت، اور قدرشناسی — باقی سب انتظام ہے جو سونپا جاتا ہے۔"
