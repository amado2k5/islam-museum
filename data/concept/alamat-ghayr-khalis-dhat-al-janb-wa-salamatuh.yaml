label:
  ar: "علامات غير الخالص من ذات الجنب وسلامته ورداءته"
  en: "The signs of the non-true pleurisy and of its safety and badness"
  fr: "Signes de la pleurésie non véritable et de son pronostic favorable ou défavorable"
  ur: "غیر خالص ذات الجنب کی علامتیں اور اس کی سلامتی اور بدی"
  es: "Los signos de la pleuresía no verdadera y de su seguridad y gravedad."
  tr: "Aynı taraftan gelen safsızlık belirtileri ve güvenliği ile kötülüğü"
  id: "Tanda-tanda ketidakmurnian datang dari sisi yang sama, serta keselamatan dan kejahatannya."
summary:
  ar: "إذا لم يكن ذات الجنب خالصاً بل كان في الغشاء المجلل للأضلاع أو في العضل الخارجة كان له علامات وكان الوجع فيه والآفة إلى حد فإن الذي يكون في الغشاء الخارج يدركه اللمس وربما شاركه الجلد فيظهر للبصر وربما انفجر خراجاً ولم يوجب نفثاً وهذا الانفجار قد يكون بالطبع وقد يكون بالصناعة، والذي يكون في العضل الخارجة يكون معه ضربان فإن كان الإحساس به مع الاستنشاق كان في العضل الباسطة وإن كان الإحساس به في الرد كان في العضل القابضة وقد علم أنهما جميعاً موجودان في الطبقتين جميعاً الداخلة والخارجة والغمز أيضاً يدرك هذا الضرب من ذات الجنب التي ليست بخالصة وهذا الغير الخالص لا يفعل من الوجع الناخس ومن ضيق النفس والسعال ومن صلابة النبض المنشارية ما يفعل الخالص، وربما كان النبض ليناً وربما كان حمى بسبب ورم في غير المواضع المذكورة أو لسبب آخر مثل نفث مفرط وغيره ولا يكون ذات الجنب إذ ليس هناك وجع ناخس ونبض منشاري وغير ذلك، وفي أكثر غير الحقيقة يكون الوجع أسفل مشط الكتف، وما كان من الخالص في الحجاب الحاجز كان الوجع إلى الشراسيف وكان اختلاط العقل فيه أكثر واشتدت الأعراض والوجع وعسر النفس ولم تكن سرعة شدة الحمى كما في غيره بل ربما تأخر إلى أن يعفن العضل فتقوى الحمى جداً، وإن كان في الغشاء المستبطن للصدر وكان الوجع إلى الترقوة واختلف الوجع لاختلاف مماسة أجزاء الغشاء للترقوة ولاختلاف الأجزاء في الحس ولا يكون معه ضربان البتة، والوجع المائل إلى ناحية الشراسيف قد يكون بسبب الورم في الحجاب الحاجز وقد يكون لحدوث الورم في الأعضاء اللحمية التي في الأضلاع وليس فيه كثير خطر، ويدل على سلامته النفث السهل السريع النضيج وهو الأبيض الأملس المستوي والنبض الذي ليس بشديد الصلابة والمنشارية وقلة الوجع وسائر الأعراض وسلامة النوم والنفس وقبول العلاج واحتمال المريض لما به واستواء الحرارة في البدن مع لين وقلة عطش وكرب وكون البول والبراز على الحالة المحمودة، ونضج البول علامة جيدة فيه كما أن رداءته علامة رديئة جداً ورداءة البراز ونتنه وشدة صفرته علامة رديئة وظهور الرعاف النافعة في ذات الجنب والرديء أن تكون أعراضه ودلائله شديدة قوية والنفث محتبساً أو بطيئاً وهو غير نضيج إما أحمر صرفاً أو أسود ويزداد لزوجة وخنقاً وكمداً وعسراً ويكون على ضد من سائر ما عد للجيد، ومن العلامات الرديئة أن يكون هناك بول عكر غير مستو وهو دموي فإنه رديء يدل على التهاب عظيم ومن العلامات الرديئة أن يكون هناك حرارة في الجانب العليل فإذا حدث به أو بصاحب ذات الرئة اختلاف في آخره دل على أن الكبد قد ضعفت وهو رديء وهو في أوله جيد بل أمر نافع وإما الاختلاف الذي يجيء به ولا يزول به عسر النفس والكرب فربما قتل في الرابع أو قبله، واختلاج ما تحت الشراسيف في ذات الجنب كثيراً ما يدل على اختلاط العقل لمشاركة الحجاب الرأس وتكون هذه حركة من مواد الحجاب وحركتها في الأكثر في مثل هذه العلة حركة صاعدة، ومن العلامات الرديئة أن تغور الخراجات المنحياة عن ذات الجنب من غير سكون الحمى ولا نفث جيد فإن ذلك يدل على الموت لما يكون معه لا محالة من رجوع المادة إلى الغور، وأما العلامات الجيدة والرديئة التي تكون بعد التقيح فنفرد لها باباً، واعلم أن ذات الجنب إذا لم يكن فيه نفث فهو إما ضعيف جداً وإما رديء خبيث جداً فإنه إما أن لا يكون معه كثير مادة يعتد بها وإما أن تكون عاصية عن الانتفاث خبيثة {cite:canon-ibn-sina-print-v2 p.345}"
  en: "If the pleurisy is not the true kind but is in the membrane clothing the ribs or in the outer muscles, it has its signs, the pain in it and the affliction up to a bound: what is in the outer membrane is reached by touch, and the skin may share in it so it shows to sight, and it may burst an abscess without bringing on expectoration — this bursting may be by nature and may be by craft. What is in the outer muscles comes with pulsation: if the feeling of it is with the in-breath it is in the expanding muscles, if with the return it is in the contracting muscles — and it is known that both are present in both layers, the inner and the outer; probing too detects this kind of non-true pleurisy, and this non-true one does not do what the true does of pricking pain, breath's narrowness, cough and the pulse's saw-like hardness. The pulse may be soft, and a fever may be for a tumour in other than the mentioned places or for another cause like an excessive expectoration and the like, and it is not pleurisy since there is no pricking pain and saw-pulse and the rest. In most of the untrue the pain is below the shoulder-blade's edge; what of the true is in the diaphragm has the pain toward the false ribs, and the mind's confusion is more in it, the symptoms, pain and breath's hardness intensify, and the fever's severity does not hasten as in the other — rather it may lag until the muscle putrefies, then the fever grows very strong; and if it is in the chest-lining membrane, the pain is toward the collarbone, and the pain differs with the differing contact of the membrane's parts with the collarbone and the parts' difference in sense, and no pulsation comes with it at all. The pain inclining toward the false ribs may be for the tumour in the diaphragm and may be for a tumour arising in the fleshy organs in the ribs — not much danger in that. Its safety is indicated by the easy, quick, ripe expectoration — the white, smooth, even — and a pulse not too hard and sawy, littleness of pain and the rest of the symptoms, soundness of sleep and breath, acceptance of the treatment and the patient's bearing what is in him, evenness of the body's heat with softness, little thirst and distress, and the urine and stool being in the praised state. The urine's ripeness is a good sign in it as its badness is a very bad sign, and the stool's badness, stench and severe yellowness a bad sign, and the appearing of the nosebleed benefits in pleurisy; the bad is that its symptoms and indications be strong and forceful and the expectoration withheld or slow, unripe — either pure red or black — growing stickier, more choking, heavier and harder, and being contrary to all counted for the good. Among the bad signs: a turbid uneven urine that is bloody — bad, indicating a great inflammation; among the bad signs, a heat in the ailing side: when an irregularity occurs in it or in the owner of peripneumonia at its end, it indicates the liver has weakened — bad — while at its beginning it is good, even a beneficial thing; but an irregularity that comes without the breath's hardness and distress leaving may kill on the fourth or before. The twitching below the false ribs in pleurisy much indicates mind's confusion for the diaphragm's sharing with the head — this is a motion of the diaphragm's matters, and its motion in such an affliction is mostly an upward motion. Among the bad signs: the abscesses turned aside from pleurisy sinking without the fever's settling or a good expectoration — that indicates death, for what is bound to come with it of the matter's returning to the depth. As for the good and bad signs that come after suppuration, a chapter is singled for them. And know that a pleurisy with no expectoration in it is either very weak or very bad and malignant: either there is not much matter to be reckoned with, or it is rebellious against expectoration, malignant {cite:canon-ibn-sina-print-v2 p.345}"
  fr: "Si la pleurésie n’est pas véritable, mais siège dans la membrane qui recouvre les côtes ou dans les muscles externes, elle a ses signes propres, et la douleur et l’atteinte restent limitées. Ce qui siège dans la membrane externe se décèle au toucher ; la peau peut être atteinte à son tour et le mal devient alors visible. Un abcès peut se rompre, naturellement ou par intervention, sans provoquer d’expectoration. L’atteinte des muscles externes s’accompagne de pulsations : perceptibles à l’inspiration, elles siègent dans les muscles qui dilatent la poitrine ; perceptibles à l’expiration, dans ceux qui la contractent. On sait que ces deux groupes de muscles se trouvent dans les deux couches, interne et externe. La palpation permet aussi de déceler cette pleurésie non véritable, qui ne provoque pas au même degré que la véritable douleur piquante, souffle court, toux ni dureté serratique du pouls. Le pouls peut être souple, et une fièvre peut tenir à une tuméfaction située ailleurs que dans les régions mentionnées, ou à une autre cause, comme une expectoration excessive. Il ne s’agit pas de pleurésie en l’absence de douleur piquante, de pouls serratique et des autres signes. Dans la plupart des formes non véritables, la douleur siège sous le bord de l’omoplate. Dans la forme véritable qui siège au diaphragme, la douleur se porte vers les fausses côtes ; la confusion de l’esprit est plus marquée, les symptômes, la douleur et la difficulté à respirer s’intensifient, et la fièvre n’atteint pas aussi vite sa pleine violence que dans l’autre forme : elle peut tarder jusqu’à la putréfaction du muscle, puis devenir très forte. Si l’atteinte siège dans la membrane qui tapisse la poitrine, la douleur se porte vers la clavicule ; elle varie selon le contact des différentes parties de la membrane avec la clavicule et leur sensibilité, et ne s’accompagne d’aucune pulsation. Une douleur vers les fausses côtes peut venir d’une tuméfaction du diaphragme ou d’une tuméfaction apparue dans les parties charnues des côtes ; ce dernier cas présente peu de danger. Une expectoration facile, rapide et mûre, c’est-à-dire blanche, lisse et homogène, annonce une issue favorable, de même qu’un pouls ni trop dur ni trop serratique, une faible douleur et des symptômes peu marqués, un sommeil et une respiration préservés, un traitement bien reçu et un malade qui supporte son mal, une chaleur corporelle uniforme et douce, peu de soif et d’angoisse, ainsi qu’une urine et des selles dans l’état jugé bon. La maturation de l’urine est bon signe, sa mauvaise qualité est très mauvais signe ; des selles de mauvaise qualité, fétides et très jaunes sont mauvais signe. L’apparition d’un saignement de nez est bénéfique dans la pleurésie. L’issue est défavorable lorsque les symptômes et les indices sont prononcés et que l’expectoration est retenue ou lente, non mûre, rouge pur ou noire, toujours plus visqueuse, étouffante, pesante et difficile, à l’opposé de tous les bons signes énumérés. Une urine trouble, non homogène et sanglante est un signe défavorable qui indique une vive inflammation. Une chaleur du côté malade est aussi de mauvais augure. Un dérèglement qui survient à la fin de la pleurésie ou de la péripneumonie indique que le foie s’est affaibli, ce qui est mauvais ; au début, en revanche, c’est un bon signe, voire un bienfait. Mais si le dérèglement survient sans que diminuent la difficulté à respirer et l’angoisse, il peut tuer le quatrième jour ou avant. Dans la pleurésie, le tressaillement sous les fausses côtes indique souvent une confusion de l’esprit, par participation du diaphragme avec la tête. C’est un mouvement des matières du diaphragme, le plus souvent ascendant dans cette affection. Autre signe défavorable : les abcès issus d’une dérivation de la pleurésie s’enfoncent sans que la fièvre s’apaise ni que l’expectoration devienne bonne. Cela annonce la mort, car la matière revient nécessairement en profondeur. Un chapitre est consacré aux bons et mauvais signes après la suppuration. Enfin, selon Ibn Sina, une pleurésie sans expectoration est soit très faible, soit très grave et maligne : ou bien il n’y a guère de matière en quantité notable, ou bien la matière, maligne, résiste à l’expectoration. {cite:canon-ibn-sina-print-v2 p.345}"
  ur: "اگر ذات الجنب خالص نہ ہو بلکہ پسلیوں کو لپیٹنے والی جھلی میں یا بیرونی پٹھوں میں ہو تو اس کی اپنی علامتیں ہیں درد بھی اسی میں اور آفت ایک حد تک: جو بیرونی جھلی میں ہو چھونے سے پکڑی جاتی ہے جلد بھی شریک ہو سکتی ہے تو نظر آئے اور خراج پھٹ سکتا ہے بغیر نفث آئے یہ پھٹنا فطرت سے بھی ہو سکتا ہے اور صنعت سے؛ جو بیرونی پٹھوں میں ہو اس کے ساتھ ضربان ہوتا ہے اگر احساس سانس اندر لینے پر ہو تو پھیلانے والے پٹھوں میں اور اگر واپسی پر ہو تو سکوڑنے والوں میں اور دونوں دونوں تہوں اندرونی اور بیرونی میں موجود ہیں گمزر بھی اس غیر خالص کی اس ضرب کو پکڑتا ہے اور یہ غیر خالص وہ نہیں کرتی جو خالص کرتی ہے چبھتے درد سانس کی تنگی کھانسی اور منشاری نبض کی سختی کا؛ نبض نرم بھی ہو سکتی ہے اور بخار مذکورہ مقامات کے علاوہ ورم یا کسی اور سبب سے ہو جیسے حد سے زیادہ نفث تو وہ ذات الجنب نہیں کیونکہ چبھتا درد اور منشاری نبض نہیں؛ اکثر غیر حقیقی میں درد کندھے کے تختے کے نیچے ہوتا ہے؛ خالص میں جو حجاب حاجر میں ہو درد نازک پسلیوں کی طرف ہوتا ہے الجھنا زیادہ علامتیں درد اور عسر نفس سخت ہوتے ہیں اور بخار کی شدت دوسرے کی طرح جلد نہیں بلکہ شاید دیر سے آئے جب تک پٹھا سڑ جائے تو بخار بہت قوی ہو؛ اور اگر سینے کی اندرونی جھلی میں ہو تو درد ترقوے کی طرف اور درد مختلف ہوتا ہے جھلی کے حصوں کے ترقوے سے لگنے کے فرق اور حس کے فرق سے اور اس کے ساتھ بالکل ضربان نہیں؛ نازک پسلیوں کی طرف جھکا ہوا درد حجاب حاجر کے ورم سے بھی ہو سکتا ہے اور پسلیوں کے گوشتی اعضا کے ورم سے بھی اس میں زیادہ خطرہ نہیں؛ سلامتی کی دلیل آسان جلد پکا ہوا نفث یعنی سفید چکنا ہموار اور نبض جو نہ بہت سخت نہ منشاری ہو درد اور باقی علامتوں کی قلت نیند اور سانس کی سلامت علاج کا قبول اور مریض کا برداشت بدن کی حرارت کا ہموار ہونا نرمی کم پیاس اور بے چینی اور پیشاب اور براز کا پسندیدہ حال پر ہونا؛ پیشاب کا پکنا اچھی علامت اور اس کی بدی بہت بری براز کی بدی بدبو اور سخت زردی بری علامت اور نکسیر کا ظاہر ہونا ذات الجنب میں مفید ہے؛ برا یہ ہے کہ علامتیں اور دلائل سخت قوی ہوں اور نفث محتبس یا دیر سے اور غیر پکا ہو خالص سرخ یا سیاہ اور چپچپاہٹ گھٹن بھاری اور دقت بڑھتی جائے اور جو اچھے کے لیے گنی سب کے خلاف ہو؛ بری علامتوں میں: گدلا غیر ہموار خونی پیشاب بہت بڑے التهاب کی دلیل؛ بری علامتوں میں علیل پہلو میں حرارت: اگر اس میں یا ذات الرئة والے میں آخر میں اختلاف ہو تو جگر کی کمزوری کی دلیل برا ہے جبکہ شروع میں اچھا بلکہ مفید؛ اور وہ اختلاف جو آئے اور سانس کی دقت اور تکلیف نہ جائے تو چوتھے یا اس سے پہلے مار سکتا ہے؛ ذات الجنب میں نازک پسلیوں کے نیچے کی اختلاج اکثر الجھنے کی دلیل ہے حجاب کا سر سے شرکت کی وجہ سے یہ حجاب کے مادوں کی حرکت ہے اور اس جیسی علت میں اکثر اوپر کی حرکت ہوتی ہے؛ بری علامتوں میں ذات الجنب سے ہٹی ہوئی خراجوں کا دھنس جانا بغیر بخار ٹھہرے اور اچھے نفث کے یہ موت کی دلیل ہے کیونکہ اس کے ساتھ مادے کا گہرائی میں لوٹنا لازم ہے؛ اور تقيح کے بعد کی اچھی بری علامتوں کے لیے الگ باب ہے؛ اور جان لو جس ذات الجنب میں نفث نہ ہو وہ یا بہت کمزور ہے یا بہت خبیث یا تو اس میں قابل ذکر مادہ نہیں یا وہ نفث سے سرکش خبیث ہے {cite:canon-ibn-sina-print-v2 p.345}"
  es: "Si la pleuresía no es de tipo verdadero, sino que se encuentra en la membrana que recubre las costillas o en los músculos externos, tiene sus signos, el dolor y la aflicción hasta cierto punto: lo que está en la membrana externa se alcanza al tacto, y la piel puede participar de manera que se muestra a la vista, y puede reventar un absceso sin producir expectoración; esta ruptura puede ser natural o artificial. Lo que está en los músculos externos viene con pulsación: si la sensación es con la inspiración está en los músculos que se expanden, si con la exhalación está en los músculos que se contraen; y se sabe que ambos están presentes en ambas capas, la interna y la externa; la exploración también detecta este tipo de pleuresía no verdadera, y esta no verdadera no hace lo que hace la verdadera de dolor punzante, dificultad para respirar, tos y dureza de la pulsación como una sierra. El pulso puede ser débil, y la fiebre puede deberse a un tumor en lugares distintos a los mencionados o a otra causa como una expectoración excesiva y similares, y no es pleuresía ya que no hay dolor punzante ni pulso de sierra y demás. En la mayoría de los casos falsos, el dolor está debajo del borde del omóplato; en los casos verdaderos, que se encuentran en el diafragma, el dolor se dirige hacia las costillas falsas, y la confusión mental es mayor, los síntomas, el dolor y la dificultad para respirar se intensifican, y la gravedad de la fiebre no se acelera como en los otros casos, sino que puede retrasarse hasta que el músculo se pudra, momento en el que la fiebre se vuelve muy fuerte; y si se encuentra en la membrana de revestimiento del tórax, el dolor se dirige hacia la clavícula, y el dolor difiere según el contacto distinto de las partes de la membrana con la clavícula y la diferencia de sensibilidad de las partes, y no hay pulsación alguna. El dolor que se inclina hacia las costillas falsas puede deberse al tumor en el diafragma y puede deberse a un tumor que se origina en los órganos carnosos de las costillas; no hay mucho peligro en eso. Su seguridad está indicada por la expectoración fácil, rápida y madura (blanca, suave y uniforme), y un pulso no demasiado duro y aserrado, poco dolor y el resto de los síntomas, sueño y respiración profundos, aceptación del tratamiento y el paciente soportando lo que tiene en él, temperatura corporal uniforme con suavidad, poca sed y malestar, y orina y heces en estado favorable. La madurez de la orina es una buena señal, ya que su mal estado es una muy mala señal, y la mal estado, el hedor y el color amarillo intenso de las heces son una mala señal, y la aparición de sangrado nasal es beneficiosa en la pleuresía; Lo malo es que sus síntomas e indicaciones sean fuertes y enérgicos y la expectoración retenida o lenta, inmadura —ya sea de color rojo puro o negro— volviéndose más pegajosa, más asfixiante, más pesada y dura, y siendo contraria a todo lo considerado bueno. Entre los malos signos: una orina turbia e irregular que es sanguinolenta —malo, indica una gran inflamación; entre los malos signos, calor en el lado enfermo: cuando se produce una irregularidad en él o en el dueño de la perineumonía al final de su enfermedad, indica que el hígado se ha debilitado —malo— mientras que al principio es bueno, incluso beneficioso; pero una irregularidad que viene sin que la dificultad para respirar y la angustia desaparezcan puede matar al cuarto día o antes. El espasmo debajo de las costillas falsas en la pleuresía indica mucho confusión de la mente por el diafragma compartiendo con la cabeza — este es un movimiento de las sustancias del diafragma, y su movimiento en tal afección es principalmente un movimiento ascendente. Entre los malos signos: los abscesos que se desvían de la pleuresía y se hunden sin que la fiebre ceda ni haya una buena expectoración, lo cual indica la muerte, pues inevitablemente la materia volverá a su profundidad. En cuanto a los buenos y malos signos que aparecen después de la supuración, se les dedica un capítulo aparte. Y sabed que una pleuresía sin expectoración es o muy leve o muy grave y maligna: o no hay mucha materia que tratar, o es resistente a la expectoración y maligna. {cite:canon-ibn-sina-print-v2 p.345}"
  tr: "Eğer plevris tamamen değil, kaburgaları kaplayan zarda veya ekstrüde kasındaysa, belirtileri varsa ve ağrı ile lezyon bir dereceye kadar devam ediyorsa, dış zardaki ağrı dokunarak algılanır ve cilt ile paylaşılabilir, gözle görülebilir ya da patlama yapmadan apse olarak patlayabilir. Bu patlama elbette mümkün veya endüstriyel olabilir ve çıkan kasın iki darbesi vardır. Eğer his solunumla ise, ekstansör kasında, his ise Tepki kavrama kasında oldu ve bunların her iki katmanda, iç ve dış katmanlarda ve ayrıca wink'te bulunduğu bilinir. Bu tür plevral benlik algılanır, saf değildir ve bu kirli olan, hapşırma ağrısı, nefes darlığı, öksürük veya nabız atmanın sertliğinden kaynaklanan saf benlik gibi şeyleri yapmaz. Nabız yumuşaktır ya da başka bölgelerdeki şişlik ya da aşırı şişlik gibi başka nedenlerden kaynaklanan ateş olabilir. Bu plevral ağrı değildir, çünkü boğucu ağrı veya nabız yoktur. Testere dişi ve diğerleri, çoğu durumda ağrı omuz metatarsalının altındadır. Diyaframda saf olan ağrı, kaburgalara kadar olan ağrıydı; burada zihin daha fazla devreye girmişti ve semptomlar, ağrı ile nefes darlığı şiddetlendi. Ateşin hızı diğerlerine göre daha şiddetli değildi, ancak kas bozulana kadar gecikebilir, bu da ateşi büyük ölçüde artırır; oysa ateş dış göğüs zarındadır ve ağrı köprücük kemiğine kadar uzanır. Ağrı, zarın köprücük kemiğine farklı teğetleri ve duyu farklılıkları nedeniyle farklılık gösterir ve Şiddetli felç ve al-Sharasif tarafına doğru eğilen ağrı, diyaframdaki bir tümörden kaynaklanabilir ya da kaburgaların etli organlarındaki tümörden kaynaklanıyor olabilir ki bu çok tehlikeli değildir. Güvenliği, kolay ve hızlı olgunlaşan şişlik, pürüzsüz ve pürüzsüz beyaz, çok sert ve testere benzeri olmayan nabız, azalmış ağrı ve diğer belirtiler, sağlam uyku ve nefes alma, tedaviye kabul, hasta toleransı, vücut sıcaklığının yumuşaklıkla dengelenmesi, susuzluk ve sıkıntının azalması, idrar ve dışkının takdire şayan durumda olması ve idrarın olgunluğu ile gösterilir. Bu iyi bir işarettir ve kalitesi çok kötü, dışkı kötü, kötü kokulu ve sarı rengin yoğunluğu kötü bir işarettir. Yan tarafta faydalı burun kanamalarının görülmesi de kötüdür. Kötü belirtiler arasında semptomların çok güçlü olması, üflemenin sınırlı veya yavaş olması, olgunlaşmamış, saf kırmızı ya da siyah olgunlaşmamış olması, viskoziteyi artırması, boğulma, boğulma ve sertlik olması ve diğer tüm iyi işaretlerin tersidir. Kötü belirtiler arasında bulanık, düzensiz ve kanlı idrar bulunur; bu kötü ve şiddetli iltihabı gösterir. Kötü belirtiler arasında Hasta tarafta ateş vardır. Eğer tarafta veya zatürreli kişide bir fark varsa, bu sonunda bir farktır ve karaciğerin zayıfladığını gösterir; bu zayıf ve başlangıçta iyi, hatta faydalıdır. Nefes alma zorluğunu ve sıkıntı gidermeyen fark ise dördüncü veya daha erken bir zamanda ölebilir. Plevra alt ayak bileklerinde yapılan kasılmalar genellikle baş başörtüsünün paylaşımı nedeniyle karışık bir zihinsel durumu gösterir ve bu, başörtüsü malzemesinin hareketi ve hareketidir, genellikle Böyle bir hastalık yukarıya doğru bir harekettir. Kötü belirtilerden biri, ateşi yatıştırmadan veya iyi nefes vermeden apselerin saflıktan çıkarılması ölüme işaret eder; çünkü bu kaçınılmaz olarak maddenin uçuruma geri dönmesine yol açar. Arınma sonrası ortaya çıkan iyi ve kötü belirtiler için ise ayrı bir bölümümüz vardır. Bilin, eğer ishal bir puf içermiyorsa, ya çok zayıf ya da çok kötü ve çok kötü niyetlidir; ya çok fazla maddesi yoktur ya da kötü niyetlidir {cite:canon-ibn-sina-print-v2 s.345}"
  id: "Jika pleuris tidak sepenuhnya melainkan di membran yang menutupi tulang rusuk atau otot yang terekstrusi, jika gejala muncul dan nyeri serta lesi masih bertahan sampai batas tertentu, nyeri di membran luar dirasakan dengan sentuhan dan dapat dibagi dengan kulit, terlihat oleh mata, atau pecah sebagai abses tanpa pecah. Pecah ini tentu saja bisa terjadi atau bersifat industri, dan otot yang dihasilkan mengalami dua pukulan. Jika sensasi adalah pernapasan, itu terjadi pada otot ekstensor; jika sensasi ada pada otot genggaman reaksi, dan ini diketahui ditemukan di kedua lapisan, lapisan dalam dan luar, serta pada kedipan mata. Jenis diri pleura ini dirasakan, tidak murni, dan tidak melakukan hal seperti diri murni yang disebabkan oleh nyeri bersin kotor, sesak napas, batuk, atau denyut nadi yang kasar. Denyut nadi lunak atau mungkin demam disebabkan oleh penyebab lain seperti pembengkakan atau pembengkakan berlebihan di area lain. Ini bukan nyeri pleura karena tidak ada rasa sakit atau denyut nadi yang menyesakkan. Dalam banyak kasus, nyeri berada di bawah metatarsal tulang belikat dan lainnya. Nyeri murni di diafragma adalah nyeri hingga tulang rusuk; di sini pikiran lebih terlibat, dan gejala memburuk dengan nyeri dan sesak napas. Laju demam tidak lebih parah dibandingkan yang lain, tetapi dapat menunda sampai otot rusak, yang sangat meningkatkan demam; namun, demam berada di membran dada luar, dan nyeri meluas ke tulang selangka. Nyeri bervariasi karena perbedaan selangka dan perbedaan sensorik, serta kelumpuhan berat dan nyeri yang membengkok ke sisi al-Sharasif dapat disebabkan oleh tumor di diafragma atau tumor di organ daging tulang rusuk, yang tidak terlalu berbahaya. Keamanannya ditunjukkan oleh pembengkakan yang cepat dan mudah matang, putih halus dan halus, denyut nadi yang sangat keras dan tidak seperti gergaji mesin, pengurangan rasa sakit dan gejala lainnya, tidur dan pernapasan yang nyenyak, penerimaan pengobatan, toleransi pasien, keseimbangan suhu tubuh dengan lembut, mengurangi haus dan stres, kondisi urin dan tinja yang baik, serta kematangan urine. Ini adalah tanda baik, dan kualitas tinja sangat buruk, tinja buruk, bau tidak sedap, dan intensitas warna kuning adalah tanda buruk. Melihat mimisan yang bermanfaat di samping juga buruk. Gejala buruk meliputi sangat kuat, hembusan yang terbatas atau lambat, belum matang, merah atau hitam murni belum matang, viskositas meningkat, tersedak, tersedak, dan keras, serta kebalikan dari semua tanda baik lainnya. Gejala buruk meliputi urin yang keruh, tidak teratur, dan berdarah; ini menunjukkan peradangan yang parah dan berat. Gejala buruk termasuk demam di sisi sakit. Jika ada perbedaan di sisi atau pada orang yang mengalami pneumonia, pada akhirnya itu adalah perbedaan dan menunjukkan hati yang melemah; ini lemah dan awalnya baik, bahkan bermanfaat. Perbedaan yang tidak mengurangi kesulitan bernapas dan stres dapat terjadi pada pertempuran keempat atau lebih awal. Kontraksi di pergelangan kaki bagian bawah pleura biasanya menunjukkan kondisi mental campuran akibat berbagi kerudung, yaitu gerakan dan pergerakan bahan kerudung; penyakit seperti ini biasanya berupa gerakan ke atas. Salah satu gejala buruk adalah hilangnya abses dari kemurnian tanpa menenangkan demam atau pernapasan yang benar; karena hal ini pasti menyebabkan zat kembali ke jurang. Kami memiliki bagian terpisah untuk gejala baik dan buruk yang muncul setelah penyucian. Ketahuilah bahwa jika diare tidak mengandung puff, maka itu sangat lemah atau sangat buruk dan sangat berbahaya; entah tidak mengandung banyak zat atau jahat {cite:canon-ibn-sina-print-v2 hlm.345}"
