label:
  ar: "علامات غير الخالص من ذات الجنب وسلامته ورداءته"
  en: "The signs of the non-true pleurisy and of its safety and badness"
  ur: "غیر خالص ذات الجنب کی علامتیں اور اس کی سلامتی اور بدی"
summary:
  ar: "إذا لم يكن ذات الجنب خالصاً بل كان في الغشاء المجلل للأضلاع أو في العضل الخارجة كان له علامات وكان الوجع فيه والآفة إلى حد فإن الذي يكون في الغشاء الخارج يدركه اللمس وربما شاركه الجلد فيظهر للبصر وربما انفجر خراجاً ولم يوجب نفثاً وهذا الانفجار قد يكون بالطبع وقد يكون بالصناعة، والذي يكون في العضل الخارجة يكون معه ضربان فإن كان الإحساس به مع الاستنشاق كان في العضل الباسطة وإن كان الإحساس به في الرد كان في العضل القابضة وقد علم أنهما جميعاً موجودان في الطبقتين جميعاً الداخلة والخارجة والغمز أيضاً يدرك هذا الضرب من ذات الجنب التي ليست بخالصة وهذا الغير الخالص لا يفعل من الوجع الناخس ومن ضيق النفس والسعال ومن صلابة النبض المنشارية ما يفعل الخالص، وربما كان النبض ليناً وربما كان حمى بسبب ورم في غير المواضع المذكورة أو لسبب آخر مثل نفث مفرط وغيره ولا يكون ذات الجنب إذ ليس هناك وجع ناخس ونبض منشاري وغير ذلك، وفي أكثر غير الحقيقة يكون الوجع أسفل مشط الكتف، وما كان من الخالص في الحجاب الحاجز كان الوجع إلى الشراسيف وكان اختلاط العقل فيه أكثر واشتدت الأعراض والوجع وعسر النفس ولم تكن سرعة شدة الحمى كما في غيره بل ربما تأخر إلى أن يعفن العضل فتقوى الحمى جداً، وإن كان في الغشاء المستبطن للصدر وكان الوجع إلى الترقوة واختلف الوجع لاختلاف مماسة أجزاء الغشاء للترقوة ولاختلاف الأجزاء في الحس ولا يكون معه ضربان البتة، والوجع المائل إلى ناحية الشراسيف قد يكون بسبب الورم في الحجاب الحاجز وقد يكون لحدوث الورم في الأعضاء اللحمية التي في الأضلاع وليس فيه كثير خطر، ويدل على سلامته النفث السهل السريع النضيج وهو الأبيض الأملس المستوي والنبض الذي ليس بشديد الصلابة والمنشارية وقلة الوجع وسائر الأعراض وسلامة النوم والنفس وقبول العلاج واحتمال المريض لما به واستواء الحرارة في البدن مع لين وقلة عطش وكرب وكون البول والبراز على الحالة المحمودة، ونضج البول علامة جيدة فيه كما أن رداءته علامة رديئة جداً ورداءة البراز ونتنه وشدة صفرته علامة رديئة وظهور الرعاف النافعة في ذات الجنب والرديء أن تكون أعراضه ودلائله شديدة قوية والنفث محتبساً أو بطيئاً وهو غير نضيج إما أحمر صرفاً أو أسود ويزداد لزوجة وخنقاً وكمداً وعسراً ويكون على ضد من سائر ما عد للجيد، ومن العلامات الرديئة أن يكون هناك بول عكر غير مستو وهو دموي فإنه رديء يدل على التهاب عظيم ومن العلامات الرديئة أن يكون هناك حرارة في الجانب العليل فإذا حدث به أو بصاحب ذات الرئة اختلاف في آخره دل على أن الكبد قد ضعفت وهو رديء وهو في أوله جيد بل أمر نافع وإما الاختلاف الذي يجيء به ولا يزول به عسر النفس والكرب فربما قتل في الرابع أو قبله، واختلاج ما تحت الشراسيف في ذات الجنب كثيراً ما يدل على اختلاط العقل لمشاركة الحجاب الرأس وتكون هذه حركة من مواد الحجاب وحركتها في الأكثر في مثل هذه العلة حركة صاعدة، ومن العلامات الرديئة أن تغور الخراجات المنحياة عن ذات الجنب من غير سكون الحمى ولا نفث جيد فإن ذلك يدل على الموت لما يكون معه لا محالة من رجوع المادة إلى الغور، وأما العلامات الجيدة والرديئة التي تكون بعد التقيح فنفرد لها باباً، واعلم أن ذات الجنب إذا لم يكن فيه نفث فهو إما ضعيف جداً وإما رديء خبيث جداً فإنه إما أن لا يكون معه كثير مادة يعتد بها وإما أن تكون عاصية عن الانتفاث خبيثة {cite:canon-ibn-sina-print-v2 p.345}"
  en: "If the pleurisy is not the true kind but is in the membrane clothing the ribs or in the outer muscles, it has its signs, the pain in it and the affliction up to a bound: what is in the outer membrane is reached by touch, and the skin may share in it so it shows to sight, and it may burst an abscess without bringing on expectoration — this bursting may be by nature and may be by craft. What is in the outer muscles comes with pulsation: if the feeling of it is with the in-breath it is in the expanding muscles, if with the return it is in the contracting muscles — and it is known that both are present in both layers, the inner and the outer; probing too detects this kind of non-true pleurisy, and this non-true one does not do what the true does of pricking pain, breath's narrowness, cough and the pulse's saw-like hardness. The pulse may be soft, and a fever may be for a tumour in other than the mentioned places or for another cause like an excessive expectoration and the like, and it is not pleurisy since there is no pricking pain and saw-pulse and the rest. In most of the untrue the pain is below the shoulder-blade's edge; what of the true is in the diaphragm has the pain toward the false ribs, and the mind's confusion is more in it, the symptoms, pain and breath's hardness intensify, and the fever's severity does not hasten as in the other — rather it may lag until the muscle putrefies, then the fever grows very strong; and if it is in the chest-lining membrane, the pain is toward the collarbone, and the pain differs with the differing contact of the membrane's parts with the collarbone and the parts' difference in sense, and no pulsation comes with it at all. The pain inclining toward the false ribs may be for the tumour in the diaphragm and may be for a tumour arising in the fleshy organs in the ribs — not much danger in that. Its safety is indicated by the easy, quick, ripe expectoration — the white, smooth, even — and a pulse not too hard and sawy, littleness of pain and the rest of the symptoms, soundness of sleep and breath, acceptance of the treatment and the patient's bearing what is in him, evenness of the body's heat with softness, little thirst and distress, and the urine and stool being in the praised state. The urine's ripeness is a good sign in it as its badness is a very bad sign, and the stool's badness, stench and severe yellowness a bad sign, and the appearing of the nosebleed benefits in pleurisy; the bad is that its symptoms and indications be strong and forceful and the expectoration withheld or slow, unripe — either pure red or black — growing stickier, more choking, heavier and harder, and being contrary to all counted for the good. Among the bad signs: a turbid uneven urine that is bloody — bad, indicating a great inflammation; among the bad signs, a heat in the ailing side: when an irregularity occurs in it or in the owner of peripneumonia at its end, it indicates the liver has weakened — bad — while at its beginning it is good, even a beneficial thing; but an irregularity that comes without the breath's hardness and distress leaving may kill on the fourth or before. The twitching below the false ribs in pleurisy much indicates mind's confusion for the diaphragm's sharing with the head — this is a motion of the diaphragm's matters, and its motion in such an affliction is mostly an upward motion. Among the bad signs: the abscesses turned aside from pleurisy sinking without the fever's settling or a good expectoration — that indicates death, for what is bound to come with it of the matter's returning to the depth. As for the good and bad signs that come after suppuration, a chapter is singled for them. And know that a pleurisy with no expectoration in it is either very weak or very bad and malignant: either there is not much matter to be reckoned with, or it is rebellious against expectoration, malignant {cite:canon-ibn-sina-print-v2 p.345}"
  ur: "اگر ذات الجنب خالص نہ ہو بلکہ پسلیوں کو لپیٹنے والی جھلی میں یا بیرونی پٹھوں میں ہو تو اس کی اپنی علامتیں ہیں درد بھی اسی میں اور آفت ایک حد تک: جو بیرونی جھلی میں ہو چھونے سے پکڑی جاتی ہے جلد بھی شریک ہو سکتی ہے تو نظر آئے اور خراج پھٹ سکتا ہے بغیر نفث آئے یہ پھٹنا فطرت سے بھی ہو سکتا ہے اور صنعت سے؛ جو بیرونی پٹھوں میں ہو اس کے ساتھ ضربان ہوتا ہے اگر احساس سانس اندر لینے پر ہو تو پھیلانے والے پٹھوں میں اور اگر واپسی پر ہو تو سکوڑنے والوں میں اور دونوں دونوں تہوں اندرونی اور بیرونی میں موجود ہیں گمزر بھی اس غیر خالص کی اس ضرب کو پکڑتا ہے اور یہ غیر خالص وہ نہیں کرتی جو خالص کرتی ہے چبھتے درد سانس کی تنگی کھانسی اور منشاری نبض کی سختی کا؛ نبض نرم بھی ہو سکتی ہے اور بخار مذکورہ مقامات کے علاوہ ورم یا کسی اور سبب سے ہو جیسے حد سے زیادہ نفث تو وہ ذات الجنب نہیں کیونکہ چبھتا درد اور منشاری نبض نہیں؛ اکثر غیر حقیقی میں درد کندھے کے تختے کے نیچے ہوتا ہے؛ خالص میں جو حجاب حاجر میں ہو درد نازک پسلیوں کی طرف ہوتا ہے الجھنا زیادہ علامتیں درد اور عسر نفس سخت ہوتے ہیں اور بخار کی شدت دوسرے کی طرح جلد نہیں بلکہ شاید دیر سے آئے جب تک پٹھا سڑ جائے تو بخار بہت قوی ہو؛ اور اگر سینے کی اندرونی جھلی میں ہو تو درد ترقوے کی طرف اور درد مختلف ہوتا ہے جھلی کے حصوں کے ترقوے سے لگنے کے فرق اور حس کے فرق سے اور اس کے ساتھ بالکل ضربان نہیں؛ نازک پسلیوں کی طرف جھکا ہوا درد حجاب حاجر کے ورم سے بھی ہو سکتا ہے اور پسلیوں کے گوشتی اعضا کے ورم سے بھی اس میں زیادہ خطرہ نہیں؛ سلامتی کی دلیل آسان جلد پکا ہوا نفث یعنی سفید چکنا ہموار اور نبض جو نہ بہت سخت نہ منشاری ہو درد اور باقی علامتوں کی قلت نیند اور سانس کی سلامت علاج کا قبول اور مریض کا برداشت بدن کی حرارت کا ہموار ہونا نرمی کم پیاس اور بے چینی اور پیشاب اور براز کا پسندیدہ حال پر ہونا؛ پیشاب کا پکنا اچھی علامت اور اس کی بدی بہت بری براز کی بدی بدبو اور سخت زردی بری علامت اور نکسیر کا ظاہر ہونا ذات الجنب میں مفید ہے؛ برا یہ ہے کہ علامتیں اور دلائل سخت قوی ہوں اور نفث محتبس یا دیر سے اور غیر پکا ہو خالص سرخ یا سیاہ اور چپچپاہٹ گھٹن بھاری اور دقت بڑھتی جائے اور جو اچھے کے لیے گنی سب کے خلاف ہو؛ بری علامتوں میں: گدلا غیر ہموار خونی پیشاب بہت بڑے التهاب کی دلیل؛ بری علامتوں میں علیل پہلو میں حرارت: اگر اس میں یا ذات الرئة والے میں آخر میں اختلاف ہو تو جگر کی کمزوری کی دلیل برا ہے جبکہ شروع میں اچھا بلکہ مفید؛ اور وہ اختلاف جو آئے اور سانس کی دقت اور تکلیف نہ جائے تو چوتھے یا اس سے پہلے مار سکتا ہے؛ ذات الجنب میں نازک پسلیوں کے نیچے کی اختلاج اکثر الجھنے کی دلیل ہے حجاب کا سر سے شرکت کی وجہ سے یہ حجاب کے مادوں کی حرکت ہے اور اس جیسی علت میں اکثر اوپر کی حرکت ہوتی ہے؛ بری علامتوں میں ذات الجنب سے ہٹی ہوئی خراجوں کا دھنس جانا بغیر بخار ٹھہرے اور اچھے نفث کے یہ موت کی دلیل ہے کیونکہ اس کے ساتھ مادے کا گہرائی میں لوٹنا لازم ہے؛ اور تقيح کے بعد کی اچھی بری علامتوں کے لیے الگ باب ہے؛ اور جان لو جس ذات الجنب میں نفث نہ ہو وہ یا بہت کمزور ہے یا بہت خبیث یا تو اس میں قابل ذکر مادہ نہیں یا وہ نفث سے سرکش خبیث ہے {cite:canon-ibn-sina-print-v2 p.345}"
