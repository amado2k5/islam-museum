summary:
  ar: "العوسج في الكتاب شجرة شائكة ينقل وصفها عن ديسقوريدوس، وفيه أن قوماً قالوا إنه العليق، وله ثمرة مثل التوت تؤكل ومنبته في البلاد الباردة أكثر، وورق جميع أصنافه نافع من الحمرة والنملة ضماداً، وفيه أن قوماً زعموا أنه يبطل عمل السحرة إذا علق {cite:canon-ibn-sina-print-v1 p.617}"
  en: "Awsaj is in the book a thorny tree whose description is reported from Dioscorides, the book noting that some said it is the ulayq; it has a fruit like the mulberry that is eaten and grows more in cold lands, the leaf of all its kinds is useful as a poultice for erysipelas and herpes, and the book adds that some people claimed that hung up it nullifies the work of sorcerers {cite:canon-ibn-sina-print-v1 p.617}"
  ur: "عوسج کتاب میں ایک کانٹے دار درخت ہے جس کا وصف دیسقوریدوس سے نقل ہے، اور کتاب بتاتی ہے کہ بعض نے کہا کہ یہ علیق ہے؛ اس کا پھل شہتوت جیسا ہے جو کھایا جاتا ہے اور سرد ملکوں میں زیادہ اگتا ہے، اس کی تمام قسموں کا پتا پٹی کے طور پر حمرہ اور نملہ میں مفید ہے، اور کتاب میں ہے کہ بعض لوگوں نے دعویٰ کیا کہ لٹکانے سے یہ جادوگروں کے عمل کو باطل کرتا ہے {cite:canon-ibn-sina-print-v1 p.617}۔"
