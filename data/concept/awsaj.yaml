summary:
  ar: "العوسج في الكتاب شجرة شائكة ينقل وصفها عن ديسقوريدوس، وفيه أن قوماً قالوا إنه العليق، وله ثمرة مثل التوت تؤكل ومنبته في البلاد الباردة أكثر، وورق جميع أصنافه نافع من الحمرة والنملة ضماداً، وفيه أن قوماً زعموا أنه يبطل عمل السحرة إذا علق {cite:canon-ibn-sina-print-v1 p.617}"
  en: "Awsaj is in the book a thorny tree whose description is reported from Dioscorides, the book noting that some said it is the ulayq; it has a fruit like the mulberry that is eaten and grows more in cold lands, the leaf of all its kinds is useful as a poultice for erysipelas and herpes, and the book adds that some people claimed that hung up it nullifies the work of sorcerers {cite:canon-ibn-sina-print-v1 p.617}"
  fr: "Dans le livre, l’awsaj est un arbre épineux décrit d’après Dioscoride ; certains, est-il précisé, l’identifient à l’ulayq. Il porte un fruit comestible semblable à la mûre et pousse surtout dans les pays froids. Les feuilles de toutes ses espèces sont dites utiles en cataplasme contre l’érysipèle et l’herpès ; le livre ajoute que certains lui attribuaient, une fois suspendu, le pouvoir d’annuler les actes des sorciers {cite:canon-ibn-sina-print-v1 p.617}"
  ur: "عوسج کتاب میں ایک کانٹے دار درخت ہے جس کا وصف دیسقوریدوس سے نقل ہے، اور کتاب بتاتی ہے کہ بعض نے کہا کہ یہ علیق ہے؛ اس کا پھل شہتوت جیسا ہے جو کھایا جاتا ہے اور سرد ملکوں میں زیادہ اگتا ہے، اس کی تمام قسموں کا پتا پٹی کے طور پر حمرہ اور نملہ میں مفید ہے، اور کتاب میں ہے کہ بعض لوگوں نے دعویٰ کیا کہ لٹکانے سے یہ جادوگروں کے عمل کو باطل کرتا ہے {cite:canon-ibn-sina-print-v1 p.617}۔"
  es: "En el libro, Awsaj es un árbol espinoso cuya descripción se recoge de Dioscórides. El libro señala que algunos decían que era el ulayq; tiene un fruto parecido a la mora que se come y crece más en tierras frías, la hoja de todas sus variedades es útil como cataplasma para la erisipela y el herpes, y el libro añade que algunas personas afirmaban que colgarlo anulaba la obra de los hechiceros {cite:canon-ibn-sina-print-v1 p.617}."
  tr: "Kitaptaki 'Awsaj', Dioscorides'ten aktarılan dikenli bir ağaçtır; bazı kişiler bunun bir böğürtlen olduğunu söyler; meyvesi dut gibi yenilebilir ve çoğunlukla soğuk topraklarda yetişir. Tüm yaprakları kırmızı ve karınca için kullanışlıdır. Bazıları, askıya alındığında sihirbazların işini geçersiz kıldığını iddia eder {cite:canon-ibn-sina-print-v1 s.617}"
  id: "'Awsaj' dalam buku ini adalah pohon berduri yang deskripsinya berasal dari Dioscorides, di mana beberapa orang mengatakan itu adalah blackberry, dan buahnya seperti murbei yang dapat dimakan dan tumbuh terutama di tanah dingin. Semua daunnya berguna untuk pohon merah dan semut sebagai rabunan. Disebutkan bahwa beberapa orang mengklaim bahwa pohon ini membatalkan pekerjaan penyihir jika ditangguhkan {cite:canon-ibn-sina-print-v1 hlm.617}"
