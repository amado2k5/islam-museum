label: { ar: "الفسخ والرض والشدخ والوثي والضربة عند ابن سينا", en: "Tearing, contusion, crack, sprain, fall and blow in the Canon", ur: "قانون میں پھٹن، کچلنا، دراڑ، موچ، گرنا اور چوٹ", es: "Desgarro, contusión, fisura, esguince, caída y golpe en el Canon", fr: "Déchirure, contusion, fissure, entorse, chute et coup dans le Canon" }
summary:
  ar: "يتناول ابن سينا علاج الفسخ وهو تفرق اتصال غائر وراء الجلد، ثم الرض والشدخ والوثي والسقطة والضربة، ويبين ما يلائم كلاً {cite:canon-ibn-sina-print-v1 pp.308-309}."
  en: "Ibn Sina treats tearing, a break in continuity deep beneath the skin, and then contusion, crack, sprain, fall and blow, and shows what suits each {cite:canon-ibn-sina-print-v1 pp.308-309}."
  es: "Ibn Sina trata el desgarro, una ruptura en la continuidad profunda debajo de la piel, y luego la contusión, la grieta, el esguince, la caída y el golpe, y muestra lo que corresponde a cada uno {cite:canon-ibn-sina-print-v1 pp.308-309}."
  fr: "Ibn Sina traite les déchirures, une rupture de continuité profonde sous la peau, puis les contusions, les fissures, les entorses, les chutes et les coups, et montre ce qui convient à chacun {cite:canon-ibn-sina-print-v1 pp.308-309}."
  ur: "ابن سینا پھاڑنا، جلد کے نیچے تسلسل میں وقفہ، اور پھر جھڑپ، شگاف، موچ، گرنے اور پھونکنے کا علاج کرتا ہے، اور یہ بتاتا ہے کہ ہر ایک کے لیے کیا مناسب ہے۔"
