id: concept/tawallud-al-sawda-wa-anwauha
class: concept
kind: scientific
label:
  ar: "تولّد السوداء وأنواعها في المالنخوليا"
  en: "How black bile arises and its kinds in melancholia"
  ur: "سودا کا پیدا ہونا اور مالنخولیا میں اس کی قسمیں"
  es: "Cómo surge la bilis negra y sus tipos en la melancolía"
  fr: "Comment la bile noire naît et quelles sont ses formes dans la mélancolie"
summary:
  ar: "يعدد ابن سينا مواضع تولّد السوداء ⁦(الكبد والطحال وعضو آخر والأغذية)⁩، وينقل رأي بعض الأطباء في الجن ويقول إن السبب القريب السوداء، ويذكر أنواع السوداء ⁦(طبيعية أو بلغم أو دم متحول)⁩ والصفراء المحترقة المفضية إلى المانيا {cite:canon-ibn-sina-print-v2 p.105}"
  en: "Ibn Sina lists where black bile arises (the liver, the spleen, another organ, foods), reports the view of some physicians about the jinn and says the near cause is black bile, and names the kinds of black bile (natural, turned phlegm, turned blood) and the burnt bile that leads to mania {cite:canon-ibn-sina-print-v2 p.105}"
  ur: "ابن سینا سودا کے پیدا ہونے کے مقامات گنواتا ہے ⁦(جگر، تلی، کوئی اور عضو، غذائیں)⁩، جنوں کے بارے میں بعض اطبا کی رائے نقل کرتا اور کہتا ہے کہ قریبی سبب سودا ہے، اور سودا کی قسمیں ⁦(طبعی، بدلا ہوا بلغم، بدلا ہوا خون)⁩ اور وہ جلی صفراء بتاتا ہے جو مانیا تک پہنچاتی ہے {cite:canon-ibn-sina-print-v2 p.105}۔"
  es: "Ibn Sina enumera los lugares donde se origina la bilis negra (el hígado, el bazo, otro órgano, los alimentos), informa sobre la opinión de algunos médicos acerca de los genios y dice que la causa más cercana es la bilis negra, y nombra los tipos de bilis negra (natural, flema convertida, sangre convertida) y la bilis quemada que conduce a la manía {cite:canon-ibn-sina-print-v2 p.105}"
  fr: "Ibn Sina énumère les sources de la bile noire (le foie, la rate, un autre organe, les aliments), rapporte l'opinion de certains médecins sur les djinns et affirme que la cause immédiate est la bile noire. Il nomme également les différents types de bile noire (naturelle, phlegme transformé, sang transformé) et la bile brûlée qui conduit à la manie {cite:canon-ibn-sina-print-v2 p.105}"
