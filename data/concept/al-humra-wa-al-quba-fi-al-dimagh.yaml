id: concept/al-humra-wa-al-quba-fi-al-dimagh
class: concept
kind: scientific
label:
  ar: "الحمرة والقوباء في الدماغ"
  en: "Erysipelas (al-humra) and al-quba in the brain"
  fr: "L'érysipèle (al-humra) et al-quba dans le cerveau"
  ur: "دماغ میں حمرہ اور قوباء"
summary:
  ar: "يذكر ابن سينا أن الحمرة والقوباء قد تعرضان في الدماغ نفسه بوجع والتهاب شديدين وبرد في الوجه لكمون الحرارة، وما يفارقان به الفلغموني، وأن أكثره قاتل في الثالث، وما يعرض منه للصبيان {cite:canon-ibn-sina-print-v2 p.83}"
  en: "Ibn Sina says erysipelas (al-humra) and al-quba may come in the brain itself with intense pain and inflammation and a coldness of the face from the hiding of the heat, how they differ from the phlegmon, that most of it kills in the third, and what comes of it in children {cite:canon-ibn-sina-print-v2 p.83}"
  fr: "Ibn Sina dit que l'érysipèle (al-humra) et al-quba peuvent survenir dans le cerveau lui-même, avec une douleur et une inflammation intenses et un refroidissement du visage dû au retrait de la chaleur ; il dit en quoi ils diffèrent du phlegmon, que la plupart des cas tuent au troisième jour, et ce qu'il en advient chez les enfants {cite:canon-ibn-sina-print-v2 p.83}"
  ur: "ابن سینا بتاتا ہے کہ حمرہ اور قوباء خود دماغ میں بھی لاحق ہو سکتے ہیں، شدید درد اور جلن اور گرمی کے چھپ جانے سے چہرے میں ٹھنڈک کے ساتھ، وہ فلغمونی سے کیسے الگ ہیں، کہ اس کا بیشتر تیسرے میں مار دیتا ہے، اور بچوں کو اس سے کیا لاحق ہوتا ہے {cite:canon-ibn-sina-print-v2 p.83}۔"
