label:
  ar: "الصداع من المواد الغذائية والرياح والأبخرة"
  en: "Headache from nourishing matters, winds and vapours"
  ur: "غذائی مادوں، ہواؤں اور بخارات سے صداع"
summary:
  ar: "يبيّن ابن سينا كيف تحصل المادة المؤذية في العضو: قديمة محتبسة أو غذائية متولدة من الغذاء، وأن الرياح والأبخرة من جملة المصدّعات، وأصولها وصفاتها بحسب الخلط {cite:canon-ibn-sina-print-v2 p.49}"
  en: "Ibn Sina shows how the harmful matter comes to lodge in the organ, old and held back or nutritive and generated from food, and that winds and vapours are among the things that cause headache, with their sources and their character according to the humour {cite:canon-ibn-sina-print-v2 p.49}"
  ur: "ابن سینا بتاتا ہے کہ ضرر دینے والا مادہ عضو میں کیسے آ ٹھہرتا ہے، پرانا اور رکا ہوا یا غذائی جو غذا سے پیدا ہو، اور یہ کہ ہوائیں اور بخارات سر درد لانے والی چیزوں میں سے ہیں، ان کے منبع اور خلط کے مطابق ان کی صفات {cite:canon-ibn-sina-print-v2 p.49}۔"
