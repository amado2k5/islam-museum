id: concept/al-amthal-al-quraniyya
class: concept
kind: term
label:
  ar: "الأمثال القرآنية"
  en: "Quranic parables (al-amthal al-quraniyya)"
  ur: "قرآنی امثال"
summary:
  ar: "يرى الشعراوي أن الأمثال في القرآن تقرّب الغيب إلى الفهم بالمحسوس، وأن الله ضرب الأمثال في التوحيد والنور والكفر والنفاق والجنة، وأنه يبين عجز المنافقين بالمثل الناري الذي استوقد نارا فذهب الله بنورهم، ومثل المطر الذي فيه ظلمات ورعد وبرق، ومثل النور في المشكاة {cite:tafsir-sharawi-khawatir-scan p.165} {cite:tafsir-sharawi-khawatir-scan p.166} {cite:tafsir-sharawi-khawatir-scan p.168} {cite:tafsir-sharawi-khawatir-scan p.171} {cite:tafsir-sharawi-khawatir-scan p.177}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that Quranic parables bring the unseen closer to understanding through the sensible: God's parables cover monotheism, light, disbelief, hypocrisy and Paradise. He reads the parable of the one who kindled a fire and God took away its light, the rain-cloud with darkness, thunder and lightning, and the niche and lamp of light as near images for hidden states {cite:tafsir-sharawi-khawatir-scan p.165} {cite:tafsir-sharawi-khawatir-scan p.166} {cite:tafsir-sharawi-khawatir-scan p.168} {cite:tafsir-sharawi-khawatir-scan p.171} {cite:tafsir-sharawi-khawatir-scan p.177}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی کے نزدیک قرآن کی امثال غیب کو محسوس کے ذریعے سمجھ کے قریب لاتی ہیں: امثال توحید، نور، کفر، نفاق اور جنت کے بارے میں ہیں۔ وہ اس آگ جلانے والے کی مثال، جس کی روشنی اللہ نے لے لی، بادل کی مثال جس میں اندھیرا، گرج اور بجلی ہے، اور طاقچے اور چراغ کی نورانی مثال کو باطنی حالتوں کے قریبی نقشے کے طور پر پڑھتے ہیں {cite:tafsir-sharawi-khawatir-scan p.165} {cite:tafsir-sharawi-khawatir-scan p.166} {cite:tafsir-sharawi-khawatir-scan p.168} {cite:tafsir-sharawi-khawatir-scan p.171} {cite:tafsir-sharawi-khawatir-scan p.177}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
