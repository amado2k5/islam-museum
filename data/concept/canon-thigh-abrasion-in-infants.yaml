id: concept/canon-thigh-abrasion-in-infants
class: concept
kind: scientific
label: { ar: "سحج الفخذ عند الصبيان عند ابن سينا", en: "Abrasion of the thigh in infants in the Canon", ur: "قانون میں بچوں کی ران کا چھل جانا", es: "Abrasión del muslo en bebés en el Canon", fr: "Abrasion de la cuisse chez les nourrissons dans le Canon", tr: "İbn Sina'ya göre erkeklerde Sâcj al-Fakh", id: "Sajj al-Fakh dalam anak laki-laki menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا سحجاً يعرض في فخذ الصبي، وعلاجه بذر مسحوق الآس أو أصل السوسن أو الورد أو السعد أو دقيق الشعير أو دقيق العدس عليه {cite:canon-ibn-sina-print-v1 p.220}."
  en: "Ibn Sina mentions an abrasion that befalls a child's thigh, treated by dusting it with ground myrtle, iris root, rose, sa'd, barley flour or lentil flour {cite:canon-ibn-sina-print-v1 p.220}."
  es: "Ibn Sina menciona una abrasión que le ocurre al muslo de un niño, tratada espolvoreándola con mirto molido, raíz de iris, rosa, sa'd, harina de cebada o harina de lentejas {cite:canon-ibn-sina-print-v1 p.220}."
  fr: "Ibn Sina mentionne une abrasion qui touche la cuisse d'un enfant, traitée en la saupoudrant de myrte moulu, de racine d'iris, de rose, de sa'd, de farine d'orge ou de farine de lentilles {cite:canon-ibn-sina-print-v1 p.220}."
  ur: "ابن سینا نے بچے کی ران پر ہونے والے رگڑ کا تذکرہ کیا ہے جس کا علاج زمینی مرٹل، ایرس جڑ، گلاب، سعد، جو کے آٹے یا دال کے آٹے سے کیا جاتا ہے۔"
  tr: "İbn Sina, bir çocuğun uyluğunda görülen bir lekeyden bahseder ve bu lekeyin üzerine mersin tozu, iris kökü, gül, saad, arpa unu veya mercimek unu ekildiğini belirtir {cite:canon-ibn-sina-print-v1 s.220}."
  id: "Ibn Sina menyebutkan noda yang muncul di paha anak laki-laki, dan perlakuannya adalah menabur bubuk myrtle, akar iris, mawar, saad, tepung jelai, atau tepung lentil {cite:canon-ibn-sina-print-v1 hlm.220}."
