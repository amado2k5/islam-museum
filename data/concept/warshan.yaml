summary:
  ar: "الورشان طائر يشبه الحمام، دمه نافع لجراحات العين، ولحمه عسير الهضم ويعقل البطن. {cite:canon-ibn-sina-print-v1 p.455}"
  en: "Warshan is a bird resembling the pigeon. Its blood helps wounds of the eye, its flesh is hard to digest, and it binds the belly. {cite:canon-ibn-sina-print-v1 p.455}"
  ur: "ورشان کبوتر سے مشابہ ایک پرندہ ہے۔ اس کا خون آنکھ کے زخموں میں مفید ہے، اس کا گوشت ہضم میں دشوار ہے، اور یہ پیٹ کو باندھتا ہے۔ {cite:canon-ibn-sina-print-v1 p.455}"
  es: "Warshan es un ave parecida a la paloma. Su sangre ayuda a curar las heridas oculares, su carne es difícil de digerir y sirve para tensar el estómago. {cite:canon-ibn-sina-print-v1 p.455}"
  fr: "Le warshan est un oiseau ressemblant au pigeon. Son sang soigne les plaies oculaires, sa chair est difficile à digérer et il réconforte l'estomac. {cite:canon-ibn-sina-print-v1 p.455}"
