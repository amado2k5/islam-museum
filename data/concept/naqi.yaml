label: { ar: "النَّقِيع", en: "Naqi (steeped drink)", ur: "نقیع (بھیگی ہوئی کشمش کا شربت)" }
summary:
  ar: "النقيع في اللغة شراب يتخذ من الزبيب أو التمر أو غيرهما ينقع في الماء دون طبخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16028} والمالكية والشافعية يحرمون النقيع إذا اشتد، والحنفية يكرهونه تحريماً، والحنابلة يحرمونه إذا اشتد وغلى ولو لم يسكر، ويكرهون ما لم يسكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16028}"
  en: "Naqi, in the lexicon, is a drink of raisins, dates or other fruit steeped in water without boiling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16028} The Malikis and Shafi'is forbid it once it has fermented; the Hanafis dislike it as forbidden; the Hanbalis forbid it once it has fermented and boiled, even if it does not intoxicate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16028}"
  ur: "نقیع لغت میں کشمش یا کھجور وغیرہ کا وہ شربت ہے جو پکائے بغیر پانی میں بھگویا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16028} مالکیہ اور شافعیہ اسے جوش آنے کے بعد حرام کہتے ہیں، حنفیہ مکروہ تحریمی کہتے ہیں، اور حنابلہ جوش کے بعد حرام کہتے ہیں اگرچہ نشہ نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16028}"
