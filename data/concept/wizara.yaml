label: { ar: "الوزارة", en: "the vizierate", es: "el visir", fr: "le vizirat", ur: "وزیریٹ", tr: "Bakanlık", id: "Kementerian" }
summary:
  ar: "وقع أول اسم الوزارة في دولة بني العباس على أبي سلمة حفص بن سليمان الخلال الهمذاني وكان يدعى وزير آل محمد كما كان أبو مسلم يدعى أمين آل محمد {cite:muruj-al-dhahab p. 256-257}."
  en: "The title 'wazir' first fell in the Abbasid state on Abu Salama — 'wazir of the House of Muhammad' as Abu Muslim was its 'amin' {cite:muruj-al-dhahab p. 256-257}."
  es: "El título de 'wazir' recayó por primera vez en el estado abasí sobre Abu Salama, 'wazir de la Casa de Muhammad', ya que Abu Muslim era su 'amin' {cite:muruj-al-dhahab p. 256-257}."
  fr: "Le titre de « wazir » est revenu pour la première fois dans l'État abbasside à Abu Salama — « wazir de la Maison de Muhammad » tandis qu'Abu Muslim était son « amin » {cite:muruj-al-dhahab p. 256-257}."
  ur: "'وزیر' کا لقب سب سے پہلے عباسی ریاست میں ابو سلمہ پر پڑا - 'خاندان محمد کا وزیر' کیونکہ ابو مسلم اس کا 'امین' تھا۔ 256-257}۔"
  tr: "Abbasi devletinin ilk bakanı Ebu Seleme Hafs bin Süleyman el-Halal el-Hamadhani idi ve tıpkı Ebu Müslim'in Muhammed ailesinin vekili olarak adlandırılması gibi, o da Muhammed ailesinin bakanı olarak adlandırılıyordu. {kaynak: Muruj-al-Dhahab s. 256-257}"
  id: "Menteri pertama di negara Abbasiyah adalah Abu Salama Hafs bin Sulayman al-Khallal al-Hamadhani, dan dia disebut menteri keluarga Muhammad, sebagaimana Abu Muslim disebut sebagai wali keluarga Muhammad {cite:muruj-al-dhahab hlm. 256-257}."
