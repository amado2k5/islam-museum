summary:
  ar: "فتح الله أبواب السماء بماء منهمر وفجر الأرض عيوناً فالتقى الماء على أمر قد قُدر وحملناه على ذات ألواح ودسر، فغرق من ظلم ونجا من آمن."
  en: "God opened the gates of heaven with pouring rain and split the earth into springs so the waters met at a measured decree; We bore him on planks and nails — the unjust drowned and the believers were saved."
  ur: "اللہ نے آسمان کے دروازے کھول کر بہتا پانی اتارا اور زمین کو چشموں میں پھاڑا پانی مقررہ فیصلے پر جا ملا؛ ہم نے اسے تختوں اور میخوں پر سوار کیا — ظالم ڈوب گئے اور ایمان والے بچ گئے۔"
  es: "Dios abrió las puertas del cielo con lluvia torrencial y dividió la tierra en manantiales, de modo que las aguas se encontraron según un decreto medido; lo llevamos sobre tablones y clavos: los injustos se ahogaron y los creyentes fueron salvados."
  fr: "Dieu ouvrit les portes du ciel et fit jaillir une pluie torrentielle, et il fendit la terre en sources, de sorte que les eaux se rencontrèrent selon un décret mesuré; Nous l'avons porté sur des planches et des clous — les injustes se sont noyés et les croyants ont été sauvés."
  tr: "Tanrı gökyüzünün kapılarını su ile açtı ve yeryüzüne kaynaklar fışkırdı, böylece su kararlaştırılmış bir meselede buluştu ve biz de aynı tabletler ve kayalar üzerinde taşıdık, böylece ezilenleri boğdu ve inananlar kurtuldu."
  id: "Tuhan membuka gerbang surga dengan air yang menumpah dan memancarkan mata air ke bumi, sehingga air bertemu pada sesuatu yang telah ditetapkan, dan Kami membawanya di atas lempengan dan batu yang sama, sehingga ia menenggelamkan mereka yang tertindas dan mereka yang percaya diselamatkan."
