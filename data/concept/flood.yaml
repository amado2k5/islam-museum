summary:
  ar: "فتح الله أبواب السماء بماء منهمر وفجر الأرض عيوناً فالتقى الماء على أمر قد قُدر وحملناه على ذات ألواح ودسر، فغرق من ظلم ونجا من آمن."
  en: "God opened the gates of heaven with pouring rain and split the earth into springs so the waters met at a measured decree; We bore him on planks and nails — the unjust drowned and the believers were saved."
  ur: "اللہ نے آسمان کے دروازے کھول کر بہتا پانی اتارا اور زمین کو چشموں میں پھاڑا پانی مقررہ فیصلے پر جا ملا؛ ہم نے اسے تختوں اور میخوں پر سوار کیا — ظالم ڈوب گئے اور ایمان والے بچ گئے۔"
  es: "Dios abrió las puertas del cielo con lluvia torrencial y dividió la tierra en manantiales, de modo que las aguas se encontraron según un decreto medido; lo llevamos sobre tablones y clavos: los injustos se ahogaron y los creyentes fueron salvados."
