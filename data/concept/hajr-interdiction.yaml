label: { ar: "الحجر على التصرف", en: "Interdiction (hajr)", ur: "حجر (تصرف پر پابندی)" }
summary:
  ar: "الحجر لغة المنع، واصطلاحا تختلف عبارات الفقهاء: فالشافعية والحنابلة يعرفونه بأنه المنع من التصرفات المالية، سواء شُرع لمصلحة الغير كحجر المفلس، أو لمصلحة المحجور عليه كحجر المجنون والسفيه، والحنفية يرونه منعا من نفاذ التصرف القولي، والمالكية يعرفونه بأنه صفة حكمية تمنع الموصوف من نفوذ تصرفه فيما زاد على قوته أو التبرع بأكثر من ثلث ماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} وقد ثبت الحجر بالكتاب في قوله تعالى: «ولا تؤتوا السفهاء أموالكم» و«فإن آنستم منهم رشدا فادفعوا إليهم أموالهم»، وبالسنة في حجر النبي على معاذ ماله في دين كان عليه، وإن كان الحديث مرسلا عند بعض أهل العلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6899} ومن أسبابه: الصغر والجنون والرق، وهي متفق عليها، وعند الجمهور السفه والمرض المتصل بالموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} والصبي المحجور عليه ينتهي حجره ببلوغه رشيدا، والرشد عند جمهور الفقهاء صلاح المال، وعند الشافعية الأصح صلاح الدين والمال، ويقدر أبو حنيفة من تجاوز الخامسة والعشرين بالرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6905} وتصرفات المجنون المغلوب لا تصح عند الحنفية، وعند المالكية لا يلزم المجنون شيء من تصرفاته إلا في إتلافه المال فيضمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6906} وفي السفيه ذهب الجمهور إلى أنه لا بد من حكم القاضي في حجره وفك حجره، وأن المحجور إذا عاد إلى السفه أعيد عليه الحجر، وخالف محمد بن الحسن وابن القاسم فلم يشترطا حكم القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} وذو الغفلة الذي يغبن في البيوع لسلامة قلبه يحجر عليه عند أبي يوسف ومحمد دون أبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} والفاسق لا يحجر عليه عند الجمهور ما لم يكن مبذرا لماله، وذهب الشافعية في مقابل الأصح إلى الحجر عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} وللزوجة الرشيدة عند مالك وفي رواية عن أحمد حجر لصالح زوجها في تبرعها بما زاد على الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} والمريض مرض الموت محجور عليه في تبرعاته فيما زاد على ثلث تركته حيث لا دين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} والراهن محجور عليه في التصرف في العين المرهونة، وعند الحنفية يحجر على المفتي الماجن والطبيب الجاهل والمكاري المفلس منعا حسيا لدفع الضرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914}"
  en: "Interdiction (hajr) means prevention. Jurists define it differently: the Shafi'is and Hanbalis as a bar on financial dealings, whether for the sake of another, such as a bankrupt debtor's creditors, or of the restricted person himself, such as a madman or a wastrel; the Hanafis as a bar on the validity of a spoken transaction; the Malikis as a legal quality that prevents its bearer from carrying out dealings beyond his means or giving away more than a third of his property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} It is established by the Qur'an (”Do not give the foolish your property”, and ”when you perceive maturity in them, hand over their property”) and by a report that the Prophet restricted Mu'adh's property for a debt, which some scholars hold to be a mursal report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6899} The causes are childhood, madness and slavery, agreed upon, and, for the majority, wastefulness and terminal illness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} A minor under restraint is released on reaching puberty and proving sound judgement; the majority take sound judgement to mean sound management of property, the Shafi'is in the sounder view take it to cover religion and property, and Abu Hanifa fixes it at twenty-five years of age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6905} The Hanafis hold that the transactions of an overwhelmed madman are void; the Malikis hold that he is liable for what he destroys. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6906} For the wastrel, the majority require a judge's order both to impose and to lift the restraint, and re-impose it if he returns to waste; Muhammad ibn al-Hasan and Ibn al-Qasim do not require a judge's order. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} The heedless person who is cheated in sales is restrained by Abu Yusuf and Muhammad, not by Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} The dissolute man is not restrained by the majority unless he wastes his property; the Shafi'is in the opposite view restrain him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} For a free adult wife, Malik and a report from Ahmad restrain her in giving more than a third of her property without her husband's consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} One dying of illness is restrained from giving beyond a third of his estate where there is no debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} A pledgor is restrained from dealing in the pledged thing, and Hanafi jurists restrain for public good the reckless mufti, the ignorant physician and the bankrupt muleteer, the restraint being physical rather than legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914}"
