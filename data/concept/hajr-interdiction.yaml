kind: legal
tags: [akhlaq-browser, akhlaq-hajr]
label: { ar: "الحجر على التصرف", en: "Interdiction (hajr)", ur: "حجر ⁦(تصرف پر پابندی)⁩", es: "Prohibición (hajr)", fr: "Interdiction (hajr)", tr: "Bertaraf yasağı", id: "Larangan pembuangan" }
summary:
  ar: "الحجر لغة المنع، واصطلاحا تختلف عبارات الفقهاء: فالشافعية والحنابلة يعرفونه بأنه المنع من التصرفات المالية، سواء شُرع لمصلحة الغير كحجر المفلس، أو لمصلحة المحجور عليه كحجر المجنون والسفيه، والحنفية يرونه منعا من نفاذ التصرف القولي، والمالكية يعرفونه بأنه صفة حكمية تمنع الموصوف من نفوذ تصرفه فيما زاد على قوته أو التبرع بأكثر من ثلث ماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} وقد ثبت الحجر بالكتاب في قوله تعالى: «ولا تؤتوا السفهاء أموالكم» و«فإن آنستم منهم رشدا فادفعوا إليهم أموالهم»، وبالسنة في حجر النبي على معاذ ماله في دين كان عليه، وإن كان الحديث مرسلا عند بعض أهل العلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6899} ومن أسبابه: الصغر والجنون والرق، وهي متفق عليها، وعند الجمهور السفه والمرض المتصل بالموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} والصبي المحجور عليه ينتهي حجره ببلوغه رشيدا، والرشد عند جمهور الفقهاء صلاح المال، وعند الشافعية الأصح صلاح الدين والمال، ويقدر أبو حنيفة من تجاوز الخامسة والعشرين بالرشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6905} وتصرفات المجنون المغلوب لا تصح عند الحنفية، وعند المالكية لا يلزم المجنون شيء من تصرفاته إلا في إتلافه المال فيضمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6906} وفي السفيه ذهب الجمهور إلى أنه لا بد من حكم القاضي في حجره وفك حجره، وأن المحجور إذا عاد إلى السفه أعيد عليه الحجر، وخالف محمد بن الحسن وابن القاسم فلم يشترطا حكم القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} وذو الغفلة الذي يغبن في البيوع لسلامة قلبه يحجر عليه عند أبي يوسف ومحمد دون أبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} والفاسق لا يحجر عليه عند الجمهور ما لم يكن مبذرا لماله، وذهب الشافعية في مقابل الأصح إلى الحجر عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} وللزوجة الرشيدة عند مالك وفي رواية عن أحمد حجر لصالح زوجها في تبرعها بما زاد على الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} والمريض مرض الموت محجور عليه في تبرعاته فيما زاد على ثلث تركته حيث لا دين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} والراهن محجور عليه في التصرف في العين المرهونة، وعند الحنفية يحجر على المفتي الماجن والطبيب الجاهل والمكاري المفلس منعا حسيا لدفع الضرر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} ويقرر ابن قدامة في كتاب الوصايا ما يتصل بالحجر في الوصية: لا وصية للطفل والمجنون عند أكثر أهل العلم، وخالفهم إياس بن معاوية في الصبي والمجنون إذا وافقت وصيتهما الحق، ولا وصية للسكران، وتصحيح وصية المحجور عليه لسفه في قياس قول أحمد وهو قول أكثرهم، ومن يجن أحياناً ويفيق أحياناً لا تصح وصيته في حال جنونه وتصح في حال عقله. {cite:mughni-ibn-qudama p.1432-1433}"
  en: "Interdiction (hajr) means prevention. Jurists define it differently: the Shafi'is and Hanbalis as a bar on financial dealings, whether for the sake of another, such as a bankrupt debtor's creditors, or of the restricted person himself, such as a madman or a wastrel; the Hanafis as a bar on the validity of a spoken transaction; the Malikis as a legal quality that prevents its bearer from carrying out dealings beyond his means or giving away more than a third of his property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} It is established by the Qur'an (”Do not give the foolish your property”, and ”when you perceive maturity in them, hand over their property”) and by a report that the Prophet restricted Mu'adh's property for a debt, which some scholars hold to be a mursal report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6899} The causes are childhood, madness and slavery, agreed upon, and, for the majority, wastefulness and terminal illness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} A minor under restraint is released on reaching puberty and proving sound judgement; the majority take sound judgement to mean sound management of property, the Shafi'is in the sounder view take it to cover religion and property, and Abu Hanifa fixes it at twenty-five years of age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6905} The Hanafis hold that the transactions of an overwhelmed madman are void; the Malikis hold that he is liable for what he destroys. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6906} For the wastrel, the majority require a judge's order both to impose and to lift the restraint, and re-impose it if he returns to waste; Muhammad ibn al-Hasan and Ibn al-Qasim do not require a judge's order. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} The heedless person who is cheated in sales is restrained by Abu Yusuf and Muhammad, not by Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} The dissolute man is not restrained by the majority unless he wastes his property; the Shafi'is in the opposite view restrain him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} For a free adult wife, Malik and a report from Ahmad restrain her in giving more than a third of her property without her husband's consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} One dying of illness is restrained from giving beyond a third of his estate where there is no debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} A pledgor is restrained from dealing in the pledged thing, and Hanafi jurists restrain for public good the reckless mufti, the ignorant physician and the bankrupt muleteer, the restraint being physical rather than legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} In his book of bequests Ibn Qudama sets out the interdiction rulings on testaments: the child and the madman have no bequest at most scholars' view — Iyas ibn Mu'awiya alone held a child's or madman's bequest valid if it accorded with right — the drunkard's bequest does not hold, and the testament of one interdicted for prodigality is valid in the analogy of Ahmad's view, which most hold; one who is mad only at intervals may bequeath in his lucid moments but not in his madness. {cite:mughni-ibn-qudama p.1432-1433}"
  es: "La interdicción (hajr) significa prevención. Los juristas la definen de manera diferente: los shafiíes y los hanbalíes como una prohibición de las transacciones financieras, ya sea en beneficio de otro, como los acreedores de un deudor en quiebra, o de la propia persona restringida, como un loco o un derrochador; los hanafíes como una prohibición de la validez de una transacción verbal; los malikíes como una cualidad legal que impide a quien la porta realizar transacciones que excedan sus posibilidades o regalar más de un tercio de su patrimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} Está establecido por el Corán (\"No des tu propiedad a los necios\" y \"cuando percibas madurez en ellos, entrega su propiedad\") y por un informe de que el Profeta restringió la propiedad de Mu'adh por una deuda, que algunos eruditos sostienen que es un informe mursal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6899} Las causas son la infancia, la locura y la esclavitud, acordadas, y, para la mayoría, el despilfarro y la enfermedad terminal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} Un menor sujeto a restricciones es puesto en libertad al llegar a la pubertad y demostrar buen juicio; la mayoría considera que el buen juicio significa una buena gestión de la propiedad, los Shafi'is, desde el punto de vista más sensato, consideran que abarca la religión y la propiedad, y Abu Hanifa lo fija en los veinticinco años de edad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6901} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6904} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6905} Los Hanafis sostienen que las transacciones de un loco abrumado son nulas; Los malikíes sostienen que es responsable de lo que destruye. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6906} Para el derrochador, la mayoría requiere una orden judicial tanto para imponer como para levantar la restricción, y volver a imponerla si regresa al derroche; Muhammad ibn al-Hasan e Ibn al-Qasim no requieren una orden judicial. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6907} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6908} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6909} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} La persona negligente que es engañada en las ventas es restringida por Abu Yusuf y Muhammad, no por Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} El hombre disoluto no es restringido por la mayoría a menos que desperdicie su propiedad; los Shafi'is, por el contrario, lo frenan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} Para una esposa adulta libre, Malik y un informe de Ahmad le restringen dar más de un tercio de su propiedad sin el consentimiento de su esposo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} A quien muere de enfermedad se le restringe dar más de un tercio de su patrimonio cuando no hay deudas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} Se restringe al deudor prendario de comerciar con la cosa prendada, y los juristas hanafíes restringen por el bien público al muftí imprudente, al médico ignorante y al arriero en bancarrota, siendo la restricción física más que legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} En su libro sobre legados, Ibn Qudama expone las normas de prohibición de los testamentos: el niño y el loco no tienen derecho a legado según la mayoría de los eruditos; solo Iyas ibn Mu'awiya consideraba válido el legado de un niño o un loco si se ajustaba a la ley; el legado del borracho no es válido, y el testamento de quien está prohibido por prodigalidad es válido según la analogía de Ahmad, que es la opinión mayoritaria; quien padece locura solo a intervalos puede legar en sus momentos de lucidez, pero no en su locura. {cite:mughni-ibn-qudama p.1432-1433}"
  fr: "L'interdiction (hajr) signifie interdiction. Les juristes la définissent différemment: les chaféites et les hanbalites la considèrent comme une interdiction des transactions financières, que ce soit pour le compte d'autrui, comme les créanciers d'un débiteur en faillite, ou pour le compte de la personne concernée elle-même, comme un fou ou un prodigue; les hanafites la considèrent comme une interdiction de la validité d'une transaction verbale; les malikites la considèrent comme une qualité juridique qui empêche celui qui la porte d'effectuer des transactions au-delà de ses moyens ou de donner plus d'un tiers de ses biens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} Elle est établie par le Coran (« Ne donnez pas vos biens aux insensés » et « lorsque vous les voyez mûrs, remettez-leur leurs biens ») et par un hadith selon lequel le Prophète a imposé une interdiction sur les biens de Mu'adh pour une dette, hadith que certains savants considèrent comme un hadith mursal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6899} Les causes de la détention sont l'enfance, la folie et l'esclavage, causes qui font consensus, et, pour la majorité, le gaspillage et la maladie en phase terminale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} Un mineur placé sous tutelle est libéré à la puberté et après avoir fait preuve de discernement; la majorité considère que le discernement signifie une bonne gestion des biens, les chaféites, dans leur avis plus équilibré, l'englobent à la fois dans la religion et dans la propriété, et Abou Hanifa le fixe à vingt-cinq ans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6905} Les hanafites considèrent que les actes d'un fou affligé sont nuls; les malikites estiment qu'il est responsable de ce qu'il détruit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6906} Concernant le prodigue, la majorité exige une ordonnance judiciaire pour imposer et lever la restriction, et la rétablir s'il recommence à prodiguer des biens inutiles; Muhammad ibn al-Hasan et Ibn al-Qasim n'exigent pas d'ordonnance judiciaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} La personne insouciante qui est trompée dans les ventes est retenue par Abu Yusuf et Muhammad, et non par Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} L'homme dissolu n'est pas retenu par la majorité à moins qu'il ne gaspille ses biens; les Shafi'is du point de vue opposé le retiennent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} Pour une femme majeure et libre, Malik et un hadith rapporté par Ahmad interdisent à son époux de donner plus d'un tiers de ses biens sans son consentement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} Une personne mourant de maladie ne peut donner plus d'un tiers de ses biens, sauf en cas de dettes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} Un gagiste est empêché de faire affaire avec la chose gagée, et les juristes hanafites empêchent pour le bien public le mufti imprudent, le médecin ignorant et le muletier en faillite, la restriction étant physique plutôt que légale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6914} Dans son ouvrage sur les legs, Ibn Qudama expose les règles d'interdiction des testaments: selon la plupart des savants, l'enfant et le fou ne peuvent faire de legs; seul Iyas ibn Mu'awiya a jugé valide le legs d'un enfant ou d'un fou s'il était conforme à la justice; le legs de l'ivrogne est invalide, et le testament de celui qui est interdit pour prodigalité est valide par analogie avec l'avis d'Ahmad, qui est majoritaire; celui qui n'est atteint de folie que par intermittence peut léguer lors de ses moments de lucidité, mais non pendant ses épisodes de folie. {cite:mughni-ibn-qudama p.1432-1433}"
  ur: "ممانعت ⁦(حجر)⁩ کا مطلب ہے روکنا۔ فقہاء اس کی مختلف تعریف کرتے ہیں: شافعیہ اور حنبلی مالی لین دین پر پابندی کے طور پر، خواہ کسی دوسرے کے لیے ہو، جیسے دیوالیہ قرض دار کے قرض دار، یا خود محدود شخص، جیسے دیوانہ یا برباد؛ حنفیہ بولی ہوئی لین دین کے جواز پر پابندی کے طور پر مالکیوں کو ایک قانونی معیار کے طور پر جو اس کے حاملین کو اس کے وسائل سے زیادہ لین دین کرنے یا اس کی جائیداد کے ایک تہائی سے زیادہ دینے سے روکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6897} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6898} یہ قرآن نے قائم کیا ہے ⁦(\"بے وقوفوں کو اپنی جائیداد نہ دو\"، اور \"جب تم سمجھو کہ ان کی جائیداد ان کے سپرد کر دی گئی ہے\")⁩ معاذ کی جائیداد قرض کے لیے، جسے بعض علماء نے مرسل روایت قرار دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.6898} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6899} اسباب بچپن، جنون اور غلامی ہیں، جن پر اتفاق ہے، اور اکثریت کے لیے فضول خرچی اور مہلک بیماری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6900} ایک نابالغ کو بلوغت تک پہنچنے اور صحیح فیصلہ ثابت کرنے پر رہا کیا جاتا ہے۔ اکثریت صحیح فیصلہ کو جائیداد کے صحیح انتظام کے لیے لیتی ہے، شافعی صحیح نظریہ میں اسے مذہب اور جائیداد کا احاطہ کرنے کے لیے لیتے ہیں، اور ابو حنیفہ پچیس سال کی عمر میں اسے درست کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6900} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6901} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6904} ص6905} احناف کے نزدیک مغلوب دیوانے کا لین دین باطل ہے۔ مالکیوں کا خیال ہے کہ وہ جس چیز کو تباہ کرتا ہے اس کا وہ ذمہ دار ہے۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 6906} فضول خرچی کے لیے، اکثریت کے لیے جج کے حکم کی ضرورت ہوتی ہے کہ وہ پابندی عائد کرے اور اسے اٹھائے، اور اگر وہ ضائع ہو جائے تو اسے دوبارہ نافذ کرے۔ محمد بن الحسن اور ابن القاسم کو جج کے حکم کی ضرورت نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6907} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6908} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6909} ص6910} غافل شخص جس کو فروخت میں دھوکہ دیا جاتا ہے اسے ابو یوسف اور محمد نے روکا ہے نہ کہ ابو حنیفہ نے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6910} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6911} متزلزل آدمی کو اکثریت اس وقت تک روک نہیں سکتی جب تک کہ وہ اپنی جائیداد کو ضائع نہ کرے۔ شافعی مخالف نظریہ میں اسے روکتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6911} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6912} آزاد بالغ بیوی کے لیے، مالک اور احمد کی ایک رپورٹ اسے شوہر کی رضامندی کے بغیر اپنی جائیداد کا ایک تہائی سے زیادہ دینے سے روکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6912} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6913} بیماری سے مرنے والے کو اپنی جائیداد کے ایک تہائی سے زیادہ دینے سے منع کیا گیا ہے جہاں قرض نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6913} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6914} گروی رکھنے والے کو گروی چیز کے لین دین سے روکا جاتا ہے، اور حنفی فقہاء عوام کی بھلائی کے لیے لاپرواہ اور مفسد مفسر کو روکتے ہیں۔ muleteer، پابندی قانونی کے بجائے جسمانی ہونا۔ ابن قدامہ نے اپنی وصیت کی کتاب میں وصیت کے بارے میں حکم امتناعی بیان کیا ہے: اکثر علماء کے نزدیک بچے اور دیوانے کی کوئی وصیت نہیں ہوتی - اکیلے ایاس بن معاویہ نے کسی بچے کی وصیت کی یا دیوانے کی وصیت کے حق میں۔ شرابی کی وصیت پر عمل نہیں ہوتا، اور اس شخص کی وصیت جس پر فضول خرچی پر پابندی لگائی گئی ہو، احمد کے قول کی مشابہت میں درست ہے، جس کا زیادہ تر خیال ہے۔ جو شخص وقفے وقفے سے دیوانہ ہے وہ اپنے روشن لمحات میں وصیت کر سکتا ہے لیکن اپنے جنون میں نہیں۔ {حوالہ: مغنی ابن قدامہ ص1432-1433}"
  tr: "Dilsel olarak 'hajr' bir yasaktır ve teknik olarak hukukçuların ifadeleri farklıdır: Şafi'ler ve Hanbaliler bunu, başkalarının yararına yasalaştırılmış olsun, örneğin iflas etmiş bir kişinin taşı ya da engellilerin yararına olan akıl hastaları ve aptalların taşı gibi yasaklar için yasak olarak tanımlar. Hanafiler bunu sözlü işlemlerin uygulanmasına yönelik bir yasak olarak görürken, Malikiler bunu, tanımlanan kişinin imkanlarını aşan şeyleri kullanmasını veya servetinin üçte birinden fazlasını bağışlamasını engelleyen yasal bir nitelik olarak tanımlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.6897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6898} Hicr, Kitap'ta şu ayetlerde yer almaktadır: \"Ve mal-varlığını aptallara verme\" ve \"Eğer aralarında sağlam bir yargı bulursan, servetini onlara ver.\" Ayrıca, Peygamber'in Muadh üzerindeki hicrine ilişkin Sünnet'te servetinin zorunlu olduğu dinde olduğu belirtilmiştir, ancak bazı alimlere göre hadis bir mursal (mursal) olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6899} Nedenleri arasında azınlık, delilik ve kölelik vardır; hepsi kabul edilir, ancak çoğunluğa göre aptallık ve hastalık ölümle ilişkilidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6900} Vesayet altındaki bir çocuk yetişkinliğe ulaştığında sona erer. Çoğu hukukçuya göre 'mawsua' 'servetin doğruluğu' iken, Şafi'lere göre daha doğru olan 'din ve servetin doğruluğudur.' Ebu Hanifa olgunluğa ulaştıktan sonra reşit sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6904} {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 6905} Hanefilere göre yenilmiş bir akıl hastasının eylemleri geçerli değildir ve Malikilere göre, akıl hastası sadece mülke zarar vermek ve garanti etmek zorundadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6906} Aptal durumunda, çoğunluk hakimin onun yetersizliği ve yetersizliği üzerine karar vermesi gerektiğini, eğer kişi tekrar aptallığa dönerse bu yetersizlik tekrarlanacağını savundu. Muhammed ibn al-Hasan ve İbn al-Kasim bu görüşe katılmadı ve hakimin kararını istemediler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6910} Ve kalbi için satışlarda aldatma yapan dikkatsiz kişi Abu Yusuf ve Muhammed tarafından kısıtlanır, ancak Abu Hanifa'ya değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6911} Günahkar, servetini boşa harcamadıkça çoğunluk önünde karantinaya tabi tutulmaz. Şafi'ler, daha doğru görüşün aksine, karantinaya tabi olduğunu savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6912} Ve Malik'e göre bilge bir eş için ve Ahmad'ın bir rivayetinde, hediyesinde kocasına üçte birden fazla bir taş vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6913} Hasta yasal olarak bağışlar yapamaz durumdadır ve borcu olmadığı için mal varlığının üçte birini aşmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s. 6914} Yükümlü kişi, rehin edilen malını elden çıkarmaktan kısıtlanır ve Hanefilere göre, kısıtlı müftü, zararı önlemek için kısıtlanmış kişi, cahil bir doktor veya iflas etmiş bir aldatıcıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.6914} İbn Qudamah, vasiyetnamede yetersizlikle ilgili olanı 'Vasiyetler' adlı kitabında açıklar: Çoğu alimin çocuk veya akıl hastası için vasiyeti yoktur. İyasas ibn Muaviye, çocuklar ve akıl hastaları konusunda onlarla aynı fikirde değildi, eğer vasiyetleri doğruysa ve sarhoş bir kişi için de bir vasiyet yoktur. Engelli durumda olan bir kişinin vasiyetinin geçerliliği, çoğu insanın görüşü olan Ahmad'ın görüşüyle benzerlik gösteren aptallığıdır. Bazen akıl hastası bazen bilinci yerine gelirse, akıl hastalığında geçerli değildir; akli dengesi doğrudur. {Cite:Mughni-ibn-Qudama s.1432-1433}"
  id: "Secara linguistik, 'hajr' adalah larangan, dan secara teknis, ungkapan para ahli hukum berbeda: Shafi'i dan Hanbalis mendefinisikannya sebagai larangan transaksi keuangan, baik yang diatur untuk kepentingan orang lain, seperti batu orang bangkrut, maupun untuk kepentingan orang yang tidak mampu, seperti batu orang gila dan bodoh. Hanafi menganggapnya sebagai larangan penegakan transaksi verbal, sementara Maliki mendefinisikannya sebagai atribut hukum yang mencegah orang yang digambarkan menggunakan apa yang melebihi kemampuan mereka atau menyumbangkan lebih dari sepertiga kekayaannya. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.6897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6898} Hijrah telah ditetapkan oleh kitab dalam ayat-ayat: \"Dan janganlah memberikan hartamu kepada orang bodoh\" dan \"Jika di antara mereka kamu menemukan penilaian yang bijaksana, maka serahkanlah harta mereka kepada mereka.\" Juga ditetapkan dalam Sunnah mengenai Hijrah Nabi atas Muadh bahwa kekayaannya ada dalam agama yang wajib dia jalani, meskipun hadis dianggap sebagai mursal (mursal) menurut beberapa ulama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6899} Di antara penyebabnya adalah: minoritas, kegilaan, dan perbudakan, semuanya disepakati, tetapi menurut mayoritas, kebodohan dan penyakit yang berkaitan dengan kematian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6900} Seorang anak laki-laki di bawah pengawasan akan berakhir saat mencapai dewasa. Menurut mayoritas ahli hukum, 'mawsua' adalah 'kebenaran kekayaan', sedangkan menurut syafi'i, yang lebih benar adalah 'kebenaran agama dan kekayaan.' Abu Hanifa dianggap cukup umur setelah mencapai kedewasaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6900} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.6901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.. 6905} Tindakan orang gila yang kalah tidak sah menurut Hanafi, dan menurut Maliki, orang gila tidak berkewajiban melakukan apa pun kecuali merusak properti dan menjaminnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6906} Dalam kasus orang bodoh, mayoritas memutuskan bahwa hakim harus memutuskan ketidakmampuannya dan mencabut ketidakmampuannya, dan jika orang yang tidak mampu kembali ke kebodohan, ketidakmampuan itu diulang. Muhammad ibn al-Hasan dan Ibn al-Qasim tidak setuju dan tidak meminta putusan hakim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6910} Dan orang yang ceroboh yang menipu dalam penjualan demi hatinya dibatasi oleh Abu Yusuf dan Muhammad tetapi tidak oleh Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6911} Orang berdosa tidak akan dikarantina di hadapan mayoritas kecuali ia telah membuang hartanya. Syafi'i, berbeda dengan pandangan yang lebih benar, berpendapat bahwa ia tunduk pada karantina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6912} Dan untuk istri bijaksana menurut Malik, serta dalam riwayat dari Ahmad, ada batu untuk suaminya dalam hadiah lebih dari sepertiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6913} Pasien secara hukum tidak mampu memberikan donasi dan melebihi sepertiga hartanya karena tidak ada utang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 6914} Orang yang berkewajiban dibatasi untuk menjual harta yang dijaminkan, dan menurut Hanafi, mufti terbatas adalah orang yang dibatasi, dokter yang tidak tahu, atau penipu bangkrut untuk mencegah bahaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6914} Ibn Qudamah menjelaskan dalam bukunya 'Wills' apa yang berkaitan dengan ketidakmampuan dalam surat wasiat: Sebagian besar ulama tidak memiliki kehendak untuk anak atau orang gila. Iyas ibn Muawiyah tidak setuju dengan mereka mengenai anak-anak dan orang gila jika wasiatnya benar, juga tidak ada kehendak untuk orang mabuk. Keabsahan wasiat seseorang yang tidak mampu bekerja adalah karena kebodohannya yang dianalogikan dengan pendapat Ahmad, yang merupakan pandangan kebanyakan orang. Siapa pun yang kadang-kadang menjadi gila dan terkadang sadar kembali tidak sah dalam keadaan gilanya tetapi sah dalam keadaan pikirannya. {cite:mughni-ibn-qudama hlm.1432-1433}"
