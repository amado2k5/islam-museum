id: concept/al-subat-al-suhari
class: concept
kind: scientific
label:
  ar: "السبات السهري"
  en: "Sleepless coma (al-subat al-suhari)"
  fr: "Coma avec insomnie (al-subat al-suhari)"
  ur: "جاگتی غنودگی ⁦(السبات السہری)⁩"
  es: "Coma sin sueño (al-subat al-suhari)"
  tr: "Uykusuz uyku"
  id: "Tidur tanpa tidur"
summary:
  ar: "يصف ابن سينا السبات السهري بأنه علة سرسامية مركبة من السرسام البارد والحار، ورمها من البلغم والصفراء معاً، وسببها الامتلاء من النهم، ويذكر علامات غلبة كل خلط، وما يفارق به ليثرغس وقرانيطس؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.87} {cite:canon-ibn-sina-print-v2 p.88}"
  en: "Ibn Sina describes the sleepless coma as a sarsam-like illness made of the cold and the hot sarsam, its swelling from phlegm and bile together, its cause fullness from gluttony; he gives the signs of the prevailing of each humour and how it differs from lithargus and qaranitus; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.87} {cite:canon-ibn-sina-print-v2 p.88}"
  fr: "Ibn Sina décrit le coma avec insomnie comme une affection apparentée au sarsam, qui associe le sarsam froid et le sarsam chaud. Le gonflement provient à la fois du flegme et de la bile, et sa cause est une plénitude due à la gloutonnerie. Il décrit les signes de prédominance de chaque humeur et les différences avec le lithargus et le qaranitus. La notice comporte une mention signalée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 p.87} {cite:canon-ibn-sina-print-v2 p.88}"
  ur: "ابن سینا سبات سہری کو سرسامی بیماری بتاتا ہے جو ٹھنڈے اور گرم سرسام سے مرکب ہے، اس کی سوجن بلغم اور صفراء دونوں سے ہے، اور اس کا سبب پیٹ بھرنے کی حرص سے بھراؤ ہے؛ ہر خلط کے غالب ہونے کی علامات بتاتا ہے اور یہ کہ وہ لیثرغس اور قرانیطس سے کیسے مختلف ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.87} {cite:canon-ibn-sina-print-v2 p.88}۔"
  es: "Ibn Sina describe el coma sin sueño como una enfermedad similar al sarsam, compuesta por el sarsam frío y el sarsam caliente, cuya hinchazón se debe a la flema y la bilis juntas, y cuya causa es la plenitud por la glotonería; da los signos del predominio de cada humor y cómo difiere del litargus y el qaranitus; el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 p.87} {cite:canon-ibn-sina-print-v2 p.88}"
  tr: "İbn Sina, uykusuz uykuyu hem soğuk hem sıcak uykudan kaynaklanan, hem balgam hem de safra kaynaklı şişlik, oburluktan kaynaklanan tokluktan kaynaklanan karmaşık bir baş dönmesi olarak tanımlar. Her karışımın baskınlığının belirtilerini ve Thurgus ile Cornitus'tan ayrılmasının nedenlerinden bahseder; ve kurucu kuralı üzerine bir bölümde başlıklı bir satır yer alır {cite:canon-ibn-sina-print-v2 s.87} {cite:canon-ibn-sina-print-v2 s.88}"
  id: "Ibn Sina mendefinisikan insomnia sebagai pusing kompleks yang disebabkan oleh tidur dingin dan panas, pembengkakan akibat dahak dan empedu, serta rasa kenyang akibat kerakusan. Ia membahas tanda-tanda dominasi setiap campuran dan alasan pemisahannya dari Thurgus dan Cornitus; dan dalam bagian tentang aturan pendiri, terdapat baris berjudul {cite:canon-ibn-sina-print-v2 hlm.87} {cite:canon-ibn-sina-print-v2 hlm.88} {cite:canon-ibn-sina-print-v2 hlm.88}"
