label:
  ar: التعليق
  en: Ta'liq (conditional linking of clauses)
  ur: تعلیق (شرطی جملہ بندی)
summary:
  ar: 'التعليق لغة مصدر علّق الشيء بالشيء، وفي الاصطلاح ربط حصول مضمون جملة بحصول مضمون جملة أخرى، ويسمى يمينا مجازا لأنه شرط وجزاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} ويفرق عن الإضافة بأن التعليق يمين يقصد به الحمل على فعل أو ترك، وبأن الشرط فيه على خطر، والإضافة لا خطر فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} ويكون التعليق بأداة شرط كإن وإذا ومتى، أو بغير أداة إذا دل السياق على الربط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} وتعرض المصنف لمعاني الأدوات: فإن (إن) للشرط المحض، وإذا لها معنى الوقت عند البصريين ومعنى المفاجأة، وفي الحكم بين أبي حنيفة وصاحبيه في سقوط معنى الوقت، ومتى تفيد الوقت مع الشرط، ومن وما تعمان العقلاء وغيرهم، وما المصدرية تفيد الإضافة لا التعليق، ومهما لما لا يعقل، وأي تتبع مضافها، وكل وكلما تفيدان الاستغراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5465} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5469}'
  en: 'Ta''liq (conditional linking) is, in language, the verb ''allaqa, to hang one thing on another. In the jurists'' usage it links the occurrence of one clause to the occurrence of another, and is called an oath by metaphor, since it is a condition and a consequence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} It differs from idafa (attribution to a time or person) in that the conditional is an oath that aims to move a person to act or refrain, and its condition is uncertain, while idafa has no uncertainty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} The link is made by a particle such as in, idha or mata, or without one where the context shows the link. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} The book surveys the particles: in is a pure condition; idha has a sense of time for the Basrans and a sense of sudden occurrence, and the dispute between Abu Hanifa and his two disciples over whether time is lost in it affects the effect of a divorce; mata keeps time; man and ma cover persons and things; mahma is for things without reason; ayy follows what it qualifies; kull and kullama express totality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5465} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5469}'
  ur: 'تعلیق لغت میں ایک چیز کو دوسری سے لٹکانے کو کہتے ہیں، اور اصطلاح میں ایک جملے کے مضمون کو دوسرے جملے کے مضمون کے حصول سے جوڑنا۔ اسے مجازاً قسم بھی کہا جاتا ہے، کیونکہ اس میں شرط اور جزا ہوتی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} اضافت (زمانے یا شخص کی طرف نسبت) سے یہ اس طرح مختلف ہے کہ تعلیق قسم ہے جس کا مقصد کسی کو فعل یا ترک پر آمادہ کرنا ہے اور اس کی شرط غیر یقینی ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} ربط کسی شرطی حرف جیسے ان، اذا، متی سے ہوتا ہے، یا سیاق کلام دلالت کرے تو بغیر حرف کے بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} ان حروف کے معانی: ان محض شرط کے لیے ہے، اذا بصریوں کے نزدیک وقت کے لیے ہے، اور حنفیہ کے نزدیک شرط کے معنی میں وقت کا مفہوم ساقط ہو جاتا ہے، جس کا اثر طلاق کے وقوع پر پڑتا ہے۔ متی وقت کے ساتھ شرط دیتا ہے، من اور ما عاقل اور غیر عاقل دونوں کے لیے، مہما غیر عاقل کے لیے، ایّ اپنے مضاف کے تابع، اور کل و کلما استغراق کے لیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5465} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5469}'
