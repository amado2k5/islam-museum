id: concept/tacliq-conditional-clauses
class: concept
kind: legal
label:
  ar: التعليق
  en: Ta'liq (conditional linking of clauses)
  ur: تعلیق (شرطی جملہ بندی)
summary:
  ar: 'التعليق ربط حصول مضمون جملة بحصول مضمون جملة أخرى، ويسمى يمينا مجازا، ويفرق عن الإضافة بأن فيه خطرا، وعن الشرط بأن أداته تدخل على أصل الفعل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} وتعدد الفقهاء أدواته: إن، وإذا، ومتى، ومتى ما، ومن، وأي، ومهما، وكل وكلما، ولو، وكيف، وحيث وأين وأنى، ولا تعد لولا منه. وتفصيل معاني كل أداة وفروقها بين الحنفية والمالكية والشافعية والحنابلة مذكور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5465} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5473} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5474} ومن شروطه أن يكون المعلَّق عليه أمرا معدوما مترددا بين الوجود والعدم، وأن يكون معلوم الوقوف عليه، فلا يصح تعليق الطلاق على مشيئة الله، وأن لا يفصل بين الشرط والجزاء، وأن يكون مستقبلا، وألا يقصد به المجازاة، وأن يوجد رابط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5475} واختلف الحنفية والمالكية مع الشافعية والحنابلة في اشتراط قيام الملك حال التعليق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5476} ويختلف الحنفية والشافعية في أثر التعليق على السبب والحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5477} وتقبل تصرفات كالإيلاء والحج والخلع من الزوج والطلاق والظهار والعتق والكتابة والنذر والولاية، ولا تقبله تصرفات كالإجارة والإقرار والإيمان والبيع والرجعة والنكاح والوقف والوكالة على خلاف بين المذاهب في بعضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5477} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5482}'
  en: Ta'liq links the occurrence of one clause to the occurrence of another, and is called an oath by metaphor. It differs from idafa in carrying uncertainty, and from shart in placing its particle on the act itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} The jurists list its particles (in, idha, mata, mata ma, man, ayy, mahma, kull and kullama, law, kayfa, haythu and ayna, anna), with the four schools differing on several. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5465} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5473} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5474} Its conditions are that the condition be uncertain, that it be something that can be known, that no gap separate condition from consequence, that it refer to the future, that it not be meant as mere retort, and that a link appear. Ta'liq of divorce on God's will is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5475} Hanafis and Malikis require only ownership in some form, while Shafiis and Hanbalis require that the one making the ta'liq have the power of immediate effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5476} Hanafis hold that ta'liq prevents both the cause and the ruling from taking effect; Shafiis hold it prevents only the ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5477} Some acts accept ta'liq (the ila', the hajj, khul' from the husband's side, divorce, zihar, manumission, writing for manumission, vows and appointments to office), while others do not (hire, acknowledgement, faith, sale, return to the wife, marriage, endowment and agency), with a principle that pure transfer of ownership rejects it and pure release accepts it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5477} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5482}
  ur: تعلیق ایک جملے کے مضمون کو دوسرے جملے کے مضمون کے حصول سے جوڑنا ہے، اور اسے مجازاً قسم کہا جاتا ہے۔ یہ اضافت سے اس لیے مختلف ہے کہ اس میں غیر یقینی بات ہوتی ہے، اور شرط سے اس لیے کہ اس کا حرف اصل فعل پر داخل ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5464} فقہاء نے اس کے حروف گنوائے ہیں، جن میں ان، اذا، متی، متی ما، من، ای، مہما، کل اور کلما شامل ہیں، اور بعض حروف کے بارے میں مذاہب میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5465} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5467} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5468} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5471} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5472} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5473} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5474} اس کی شرائط یہ ہیں کہ شرط غیر یقینی ہو، معلوم الوقوع ہو، شرط اور جزا کے درمیان فاصلہ نہ ہو، مستقبل سے متعلق ہو، محض جواب کے طور پر نہ ہو، اور ربط ظاہر ہو۔ اللہ کی مشیئت پر معلق طلاق واقع نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5475} حنفیہ اور مالکیہ کے نزدیک ایک قسم کی ملکیت کافی ہے، جبکہ شافعیہ اور حنابلہ کے نزدیک معلق کرنے والے کا فوراً نافذ کرنے کا اختیار ہونا ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5476} حنفیہ کے نزدیک تعلیق سبب اور حکم دونوں کو روک دیتی ہے، جبکہ شافعیہ کے نزدیک صرف حکم کو روکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5477} ایلاء، حج، خلع (شوہر کی جانب سے)، طلاق، ظہار، عتق، کتابت، نذر اور ولایت تعلیق کو قبول کرتے ہیں، جبکہ اجارہ، اقرار، ایمان، بیع، رجعت، نکاح، وقف اور وکالت اسے قبول نہیں کرتے، اور اصول یہ ہے کہ خالص تملیک تعلیق کو قبول نہیں کرتی اور خالص اسقاط قبول کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5477} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5481} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5482}
