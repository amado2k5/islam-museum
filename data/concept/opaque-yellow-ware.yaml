summary:
  ar: "خزف ذو طلاء أصفر معتم من بطانة صفراء فيها القصدير، مزخرف بالأخضر غالبًا، صُنع في نيسابور في القرنين التاسع والعاشر، ونشأ على الأرجح في العراق تقليدًا للخزف الصيني {cite:wilkinson-nishapur-pottery p. 247}."
  en: "Ware with an opaque yellow glaze produced by a tin-bearing yellow engobe, almost always decorated in green, made at Nishapur in the ninth and tenth centuries; it probably first developed in Iraq in imitation of Chinese pieces {cite:wilkinson-nishapur-pottery p. 247}."
  ur: "قلعی والے زرد انگوب سے بنا غیر شفاف زرد لعاب والے ظروف، تقریباً ہمیشہ سبز آرائش کے ساتھ؛ نویں دسویں صدی میں نیشاپور میں بنے، اور غالباً عراق میں چینی ظروف کی نقل میں شروع ہوئے {cite:wilkinson-nishapur-pottery p. 247}."
