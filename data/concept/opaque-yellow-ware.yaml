id: concept/opaque-yellow-ware
class: concept
kind: art_form
label: { ar: "الخزف الأصفر المعتم", en: "Opaque yellow ware", ur: "غیر شفاف زرد ظروف", es: "Vajilla amarilla opaca", fr: "Céramique jaune opaque", tr: "Koyu sarı porselen", id: "Porselen kuning tua" }
summary:
  ar: "خزف ذو طلاء أصفر معتم من بطانة صفراء فيها القصدير، مزخرف بالأخضر غالبًا، صُنع في نيسابور في القرنين التاسع والعاشر، ونشأ على الأرجح في العراق تقليدًا للخزف الصيني {cite:wilkinson-nishapur-pottery p. 247}."
  en: "Ware with an opaque yellow glaze produced by a tin-bearing yellow engobe, almost always decorated in green, made at Nishapur in the ninth and tenth centuries; it probably first developed in Iraq in imitation of Chinese pieces {cite:wilkinson-nishapur-pottery p. 247}."
  ur: "قلعی والے زرد انگوب سے بنا غیر شفاف زرد لعاب والے ظروف، تقریباً ہمیشہ سبز آرائش کے ساتھ؛ نویں دسویں صدی میں نیشاپور میں بنے، اور غالباً عراق میں چینی ظروف کی نقل میں شروع ہوئے {cite:wilkinson-nishapur-pottery p. 247}."
  es: "Cerámica con un vidriado amarillo opaco producido por un engobe amarillo con estaño, casi siempre decorada en verde, hecha en Nishapur en los siglos IX y X; probablemente se desarrolló por primera vez en Irak imitando piezas chinas {cite:wilkinson-nishapur-pottery p. 247}."
  fr: "Céramique à glaçure jaune opaque produite par un engobe jaune contenant de l'étain, presque toujours décorée en vert, fabriquée à Nishapur aux IXe et Xe siècles; elle s'est probablement développée pour la première fois en Irak à l'imitation de pièces chinoises {cite:wilkinson-nishapur-pottery p. 247}."
  tr: "Koyu sarı kaplamalı, sarı teneke astarlı bir seramik, genellikle yeşil renkte süslenmiş, 9. ve 10. yüzyıllarda Nişapur'da yapılmış ve muhtemelen Irak'ta Çin porseleni geleneği olarak ortaya çıkmıştır {cite:Wilkinson-Nishapur-pottery s. 247}."
  id: "Keramik dengan lapisan kuning tua dan lapisan timah kuning, biasanya dihiasi hijau, dibuat di Nishapur pada abad ke-9 dan ke-10, dan kemungkinan berasal dari Irak sebagai tradisi porselen Cina {cite:Wilkinson-Nishapur-pottery hlm. 247}."
