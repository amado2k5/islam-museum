class: concept
kind: scientific
label: { ar: "جدول مطالع البروج يبدأ من أول الجدي في الزيج الصابي", en: "The table of risings opens at the first of Capricorn", ur: "مطالعِ بروج کا جدول جدی کے آغاز سے شروع ہوتا ہے", es: "La tabla de ascendentes se abre en el primero de Capricornio." }
summary:
  ar: "في خاتمة الباب الخامس يذكر البتاني أن جدول مطالع البروج في الفلك المستقيم يبدأ من أول الجدي، وأن مطالع البروج في وسط السماء تؤخذ منه لكل بلد، وأنه سيشرح كيفية تجديل المطالع عند ذكر مطالع البروج في الأقاليم حتى لا يتكرر القول. {cite:zij-sabi-nallino-byblion p.25}."
  en: "At the end of chapter 5 al-Battani says the table of the risings of the signs in the right sphere begins at the first of Capricorn, that the risings of the signs at midheaven for each country are taken from it, and that he will explain how the risings are tabulated when he reaches the risings in the climes, so that he need not say the same thing twice. {cite:zij-sabi-nallino-byblion p.25}."
  ur: "پانچویں باب کے آخر میں البتانی بتاتے ہیں کہ فلک مستقیم میں بروج کے مطالع کا جدول جدی کے آغاز سے شروع ہوتا ہے، ہر شہر کے لیے وسط السماء پر بروج کے مطالع اسی سے لیے جاتے ہیں، اور وہ مطالع کے جدول بنانے کا طریقہ اقلیموں میں مطالع کے ذکر پر بیان کریں گے تاکہ بات دہرانی نہ پڑے۔ {cite:zij-sabi-nallino-byblion p.25}۔"
  es: "Al final del capítulo 5, al-Battani dice que la tabla de los ascendentes de los signos en la esfera derecha comienza en el primero de Capricornio, que los ascendentes de los signos en el medio cielo para cada país se toman de ahí, y que explicará cómo se tabulan los ascendentes cuando llegue a los ascendentes en los climas, para no tener que decir lo mismo dos veces. {cite:zij-sabi-nallino-byblion p.25}."
