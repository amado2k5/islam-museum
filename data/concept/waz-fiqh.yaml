label:
  ar: "وَعْظ"
  en: "Wa'z (admonition, fiqh)"
summary:
  ar: "الوعظ في اللغة زجر مقترن بتخويف، ومنه النصح والتذكير بالعواقب؛ وفي الاصطلاح التذكير بالخير فيما يرقّ له القلب. والنصيحة الدعاء إلى ما فيه الصلاح والنهي عن الفساد، وبينهما اشتراك في الدعاء إلى الصلاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}\n\nالحكم التكليفي: الأصل فيه الاستحباب، وقال الحصكفي إن التذكير على المنابر والاتعاظ سنة الأنبياء، واستدل الكتاب بقوله تعالى في سورة الذاريات. وقد يكون منهياً عنه إذا هيّج المصيبة فصار من النياحة، أو كان للرئاسة وكسب المال والقبول عند العامة؛ وقال الفتاوى الهندية إنه لا يحل للواعظ أن يسأل الناس شيئاً في مجلسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nأركان الوعظ: الواعظ، والموعوظ، وأسلوب الوعظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nشروط الواعظ: أن يكون مكلفاً عاقلاً بالغاً، عدلاً، محدِّثاً بأن يكون مشتغلاً بكتب الحديث يعرف صحيحها وسقيمها، ومفسِّراً مشتغلاً بغريب القرآن ومشكله، ويُستحب أن يكون فصيحاً لطيفاً يكلم الناس قدر فهمهم، وأن يكون ميسِّراً لا معسِّراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}\n\nآداب الواعظ: أن يجتنب ما ظاهره خلاف الصواب ولو كان محقاً فيه، لما يترتب عليه من مفاسد، كتوهم الناس الجواز المطلق، ووقوعهم فيه بالتنقيص، وسوء الظن به، وسقوط روايته وشهادته وفتواه؛ فإن احتاج إلى ذلك بيّن أنه ليس بحرام، واستدل الكتاب بحديث سهل بن سعد في صنع النبي على المنبر، وبحديث صفية في الاعتكاف، وبشرب علي قائماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nمنع من ليس أهلاً للوعظ: الشافعية والحنابلة يمنعون من تصدى للوعظ وليس من أهله، أو كان يكذب، لأنه لا يؤمن الاغترار به. وأما المبتدع فلا يجوز حضور مجلسه إلا لإظهار الرد عليه، واستدل بقوله تعالى في سورة الأنعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nآداب الموعوظ: الإنصات للواعظ وعدم الكلام، فإن لم ينصتوا طلب الواعظ منهم ذلك، واستدل الكتاب بحديث جرير في أن النبي في حجة الوداع أمر بإنصات الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}"
  en: "Admonition (wa'z), lexically, is a rebuke joined with fear, and includes advice and reminding of consequences; technically it is reminding people of good in a way that softens the heart. Nasiha, sincere counsel, means calling to what is good and forbidding what is corrupt; the two share the call to good. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}\n\nThe ruling: the basis is recommendation. Al-Haskafi says preaching from pulpits and being admonished is the practice of the prophets. It may be forbidden when it stirs up a calamity so that it becomes wailing, or when it aims at leadership, gain or popularity; the Hindiyya says a preacher may not beg from his audience during the sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nThe pillars of admonition: the preacher, the one admonished, and the method. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nConditions of the preacher: sane, adult, just; a man of hadith, who has studied the hadith books and knows the sound from the weak; an exegete, who has studied the strange words and difficulties of the Qur'an; it is recommended that he be eloquent, gentle, speak to people only as far as they can understand, and make things easy rather than hard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}\n\nThe preacher's conduct: he should avoid acts that look wrong even if he is right, because people may take them as general permission, belittle him, think ill of him, reject his narrations, testimony and fatwas. If he must do such a thing, he should say it is not forbidden and explain its basis. The book cites the report of Sahl ibn Sa'd about the Prophet's pulpit, the report of Safiyya about the Prophet escorting her in the mosque, and the report of 'Ali drinking standing to show what he saw the Prophet do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nPreventing the unqualified: the Shafi'is and Hanbalis hold that a person who takes up admonition without being qualified, or who lies, must be prevented, lest people be deceived by him. The heretic may attend only to refute him, as the verse of sura al-An'am (cited by sura and verse) indicates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nConduct of the listeners: they should listen and not talk among themselves; if they do not, the preacher may ask them to be silent, citing the report of Jarir that the Prophet asked the people to be silent at the Farewell Pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}"
