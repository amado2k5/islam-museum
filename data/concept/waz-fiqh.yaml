id: concept/waz-fiqh
class: concept
kind: legal
label:
  ar: "وَعْظ"
  en: "Wa'z (admonition, fiqh)"
summary:
  ar: "الوعظ في اللغة زجر مقترن بتخويف، ومنه النصح والتذكير بالعواقب؛ وفي الاصطلاح التذكير بالخير فيما يرقّ له القلب. والنصيحة الدعاء إلى ما فيه الصلاح والنهي عن الفساد، وبينهما اشتراك في الدعاء إلى الصلاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}\n\nالحكم التكليفي: الأصل فيه الاستحباب، وقال الحصكفي إن التذكير على المنابر والاتعاظ سنة الأنبياء، واستدل الكتاب بقوله تعالى في سورة الذاريات. وقد يكون منهياً عنه إذا هيّج المصيبة فصار من النياحة، أو كان للرئاسة وكسب المال والقبول عند العامة؛ وقال الفتاوى الهندية إنه لا يحل للواعظ أن يسأل الناس شيئاً في مجلسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nأركان الوعظ: الواعظ، والموعوظ، وأسلوب الوعظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nشروط الواعظ: أن يكون مكلفاً عاقلاً بالغاً، عدلاً، محدِّثاً بأن يكون مشتغلاً بكتب الحديث يعرف صحيحها وسقيمها، ومفسِّراً مشتغلاً بغريب القرآن ومشكله، ويُستحب أن يكون فصيحاً لطيفاً يكلم الناس قدر فهمهم، وأن يكون ميسِّراً لا معسِّراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}\n\nآداب الواعظ: أن يجتنب ما ظاهره خلاف الصواب ولو كان محقاً فيه، لما يترتب عليه من مفاسد، كتوهم الناس الجواز المطلق، ووقوعهم فيه بالتنقيص، وسوء الظن به، وسقوط روايته وشهادته وفتواه؛ فإن احتاج إلى ذلك بيّن أنه ليس بحرام، واستدل الكتاب بحديث سهل بن سعد في صنع النبي على المنبر، وبحديث صفية في الاعتكاف، وبشرب علي قائماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nمنع من ليس أهلاً للوعظ: الشافعية والحنابلة يمنعون من تصدى للوعظ وليس من أهله، أو كان يكذب، لأنه لا يؤمن الاغترار به. وأما المبتدع فلا يجوز حضور مجلسه إلا لإظهار الرد عليه، واستدل بقوله تعالى في سورة الأنعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nآداب الموعوظ: الإنصات للواعظ وعدم الكلام، فإن لم ينصتوا طلب الواعظ منهم ذلك، واستدل الكتاب بحديث جرير في أن النبي في حجة الوداع أمر بإنصات الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}\n\nالإنصات للواعظ: قال العلماء إن الإنصات للعلماء لازم للمتعلمين، وإن النبي أمر الناس بالإنصات في خطبة حجة الوداع، وقال سفيان الثوري إن أول العلم الاستماع ثم الإنصات ثم الحفظ ثم العمل ثم النشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} ومن آداب الموعوظين: أن يستقبلوا الواعظ، وألا يلعبوا أو يلغطوا أثناء الوعظ، وألا يكثروا السؤال في كل مسألة، فما تعلق قوياً بالمسألة وكان دقيقاً لا يحتمله فهم العامة سكت عنه السامع في المجلس وسأل في الخلوة أو انتظر انتهاء الكلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}\n\nأسلوب الوعظ ومنهجه: أولاً، استعمال الألفاظ الظاهرة الدالة على المراد واجتناب الغريب، لحديث عائشة في أن كلام النبي كان فصلاً يفهمه كل من سمعه، وذكر ابن علان تفسير السخاوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} ثانياً، تكرار الكلمات إذا لم تُفهم إلا بذلك أو لمزيد الاعتناء أو لكثرة المخاطبين، لحديث أنس في أن النبي كان إذا تكلم بالكلمة أعادها ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} ثالثاً، مراعاة أحوال الناس، فلا يحدَّث الناس بما لا تطيق عقولهم أو بما يُخاف تحريفه، لأثر علي «حدّثوا الناس بما يعرفون»، ولأثر ابن مسعود «ما أنت بمحدّث قوماً حديثاً لا تبلغه عقولهم إلا كان لبعضهم فتنة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} رابعاً، الاقتصاد في الوعظ بين البسط المُملّ والإيجاز المُخلّ، لحديث عمار في أن طول الصلاة وقصر الخطبة من الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} خامساً، استحباب تعهّد الناس بالوعظ في أوقات القبول، وألا يعظ كل يوم حتى لا يسأموا، ويجعل لوعظه وقتاً محدداً كيوم الخميس، لأثر ابن مسعود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nسادساً، معرفة المنكر الذي يُنهى عنه وحال الموعوظ: أهو ارتكبه عن جهل أو عن علم. فيُنهى بالوعظ والنصح والتخويف بالله من يُقدم على المنكر وهو عالم، أو من أصرّ عليه بعد العلم، بشفقة ولطف من غير عنف، والوعظ في السر أفضل من الإعلان كما نُقل عن أم الدرداء الصغرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nأسلوب النهي عن المنكر في الوعظ: على الواعظ أن يعرف المنكر وحال الموعوظ من جهله أو علمه؛ فمن أقدم على المنكر وهو عالم به، أو أصرّ عليه بعد أن عرفه، يُوعظ ويُخوَّف بالله، وتُورد عليه أخبار الوعيد وسيرة السلف، بشفقة لطف من غير عنف؛ والوعظ في السر أفضل، فإن لم ينفع استُعين بأهل الخير، فإن لم ينفع فبأصحاب السلطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} ومن درجات النهي التعنيف بالقول الغليظ عند العجز عن المنع باللطف وظهور الإصرار والاستهزاء، وكان قصد الآمر الرجوع عن المنكر لا الانتصار للنفس، واستدل الكتاب بقول إبراهيم في سورة الأنبياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nما ينبغي استعماله في الوعظ من آيات وأحاديث وقصص، وفيه أربعة أنواع: ذكر الآيات المخوفة، وحكايات الأنبياء والسلف، وأن تعجيل العقوبة في الدنيا متوقع على الذنب، وذكر عقوبات الذنوب المعيّنة كالخمر والزنا والسرقة والقتل والغيبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}\n\nأحكام الوعظ في أبواب أخرى: (أ) وعظ الزوجة إذا نشزت، لآية النساء، وتفصيله في النشوز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559} (ب) وعظ المتلاعنين: يُسن عند المالكية والشافعية تخويفهما قبل اللعان وعند الخامسة، ويُقرأ عليهما آية آل عمران، ويقال لهما ما قاله النبي للمتلاعنين، وعند الحنابلة يستحب أن يعظ الإمام المتلاعنين بعد الرابعة وقبل الخامسة، ويأمر من يضع يده على فم المتلاعن والمتلاعنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (ج) الوعظ قبل صلاة الاستسقاء: جمهور الفقهاء يستحبونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (د) الوعظ بعد صلاة الكسوف: المالكية يندبونه، والحنفية والحنابلة لا خطبة لصلاة الكسوف عندهم، والشافعية يسنون خطبتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561}\n\nوعظ السلطان: لا خلاف في جواز وعظ السلطان وأمره بالمعروف ونهيه عن المنكر إذا كان عادلاً؛ واختلفوا في وعظ الجائر. فالحنفية والشافعية والحنابلة في رواية يجيزون وعظه بالرفق واللين؛ والشافعية وابن الجوزي يمنعون تخشين القول له إن كان يحرّك فتنة يتعدى شرها، ويجيزونه إن لم يعد الشر إلا على الواعظ، واستدلوا بحديث «إن من أعظم الجهاد كلمة عدل عند سلطان جائر». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562} والمالكية يوجبون وعظ السلطان وتخويفه وتحذيره من العاقبة، وقال أبو عمر إن ذلك واجب على من يجالسه ويمكنه النصح، وقال مالك إذا رجا أن يُسمع. وعند الحنابلة في رواية أن ترك الإنكار على السلطان الجائر أفضل، ونقل عن أحمد أنه لا يُتعرض للسلطان فإن سيفه مسلول؛ وإذا قيل بالإنكار فبالتعريف والوعظ اللطيف، لقوله تعالى لموسى وهارون في سورة طه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562}\n\nوعظ البغاة: إذا بعث الإمام من يكشف لهم الصواب فأبوا الرجوع، فالمالكية والحنابلة يوجبون وعظهم وتخويفهم بالقتال، لأن المقصود كفهم لا قتلهم، فإن أمكن بالقول فهو أولى، فإن فاءوا وإلا قُوتلوا، لقوله تعالى في سورة الحجرات. والحنفية يرون أن يدعوهم أهل العدل إلى العدل، واستدلوا بما روي عن علي في بعثه ابن عباس إلى الحرورية؛ والشافعية يستحبون وعظهم ترغيباً وترهيباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}\n\nالتكسّب بالوعظ: لا يحل للواعظ أن يسأل الناس شيئاً لنفسه في مجلس الوعظ، لأنه اكتساب الدنيا بالعلم، وإلى ذلك ذهب الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}\n\nحضور النساء مجالس الوعظ: الحنفية والشافعية يكرهون حضور الشابة لخشية الفتنة، ويجيزون للعجائز، واستدل الكتاب بحديث عائشة في منع نساء بني إسرائيل المسجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}"
  en: "Admonition (wa'z), lexically, is a rebuke joined with fear, and includes advice and reminding of consequences; technically it is reminding people of good in a way that softens the heart. Nasiha, sincere counsel, means calling to what is good and forbidding what is corrupt; the two share the call to good. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}\n\nThe ruling: the basis is recommendation. Al-Haskafi says preaching from pulpits and being admonished is the practice of the prophets. It may be forbidden when it stirs up a calamity so that it becomes wailing, or when it aims at leadership, gain or popularity; the Hindiyya says a preacher may not beg from his audience during the sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nThe pillars of admonition: the preacher, the one admonished, and the method. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nConditions of the preacher: sane, adult, just; a man of hadith, who has studied the hadith books and knows the sound from the weak; an exegete, who has studied the strange words and difficulties of the Qur'an; it is recommended that he be eloquent, gentle, speak to people only as far as they can understand, and make things easy rather than hard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}\n\nThe preacher's conduct: he should avoid acts that look wrong even if he is right, because people may take them as general permission, belittle him, think ill of him, reject his narrations, testimony and fatwas. If he must do such a thing, he should say it is not forbidden and explain its basis. The book cites the report of Sahl ibn Sa'd about the Prophet's pulpit, the report of Safiyya about the Prophet escorting her in the mosque, and the report of 'Ali drinking standing to show what he saw the Prophet do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nPreventing the unqualified: the Shafi'is and Hanbalis hold that a person who takes up admonition without being qualified, or who lies, must be prevented, lest people be deceived by him. The heretic may attend only to refute him, as the verse of sura al-An'am (cited by sura and verse) indicates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nConduct of the listeners: they should listen and not talk among themselves; if they do not, the preacher may ask them to be silent, citing the report of Jarir that the Prophet asked the people to be silent at the Farewell Pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}\n\nListening to the admonisher: the scholars hold that the learners must be silent before the learned, since scholars are the heirs of the prophets. The Prophet asked the people to be silent during his sermon at the Farewell Pilgrimage, and al-Thawri says the beginning of knowledge is listening, then silence, then memorising, then acting, then spreading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} Manners of the listeners: they should face the preacher, not play or talk during the admonition, and not ask too many questions. If a question is strongly connected to the matter but too subtle for common people, the listener keeps silent during the session and asks in private or waits until the talk ends. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}\n\nThe method of admonition. First, using clear words that convey the meaning and avoiding words the audience does not know, on the report of 'A'isha that the Prophet's speech was clear and that everyone who heard it understood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} Second, repeating words when they are not understood without it, to give emphasis, or when the audience is large, on the report of Anas that the Prophet repeated a word three times until it was understood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} Third, taking account of people's condition: not telling them what their minds cannot bear or what may be distorted as they retell it, following the saying of 'Ali, 'speak to people in what they know and leave aside what they would deny', and Ibn Mas'ud's saying that a speech that a group's minds cannot reach becomes a trial for some of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} Fourth, moderation: neither so long as to bore nor so short as to be unclear, on the report of 'Ammar that a long prayer and a short sermon are a sign of understanding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} Fifth, the preacher should choose times when people are receptive, not admonish every day lest they tire, and fix a time such as Thursday, following the practice of Ibn Mas'ud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nSixth, knowing the wrong to be forbidden and the state of the one admonished: whether he committed it in ignorance or knowingly. The one who persists in a wrong known to be wrong, such as drinking, injustice or backbiting, is admonished by warning, fear of God and reports of threat, with kindness and without violence; admonition in private is better than in public, as Umm al-Darda' al-Sughra is reported to have said. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nForbidding wrong by admonition: the admonisher must know the wrong and the state of the one admonished, whether he committed it in ignorance or knowingly. One who commits a wrong while knowing it, or persists after knowing it, is admonished and warned by fear of God, with reports of threat and the example of the pious ancestors, with kindness and without violence; in private is better; if it does not work he seeks the help of the righteous, and then of the authorities. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} A degree of forbidding is harsh speech, when gentleness has failed and persistence and mockery appear; the aim must be the wrongdoer's return, not the admonisher's own victory, citing Abraham's words in sura al-Anbiya' (by sura). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nWhat the admonisher should use from verses, hadith and stories: four kinds, namely the verses that warn sinners, the stories of the prophets and the pious ancestors, the teaching that punishment in this world is expected for a sin, and the particular punishments of particular sins such as wine, adultery, theft, murder and backbiting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}\n\nAdmonition in other chapters of law: (a) admonishing a wife who is disobedient, by the verse of sura al-Nisa', the detail under disobedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559} (b) admonishing parties to a lian: the Malikis and Shafi'is recommend warning them before the oath and at the fifth oath, reading to them the verse of sura Al 'Imran, and saying to them what the Prophet said to those who swore lian; the Hanbalis recommend that the imam admonish them after the fourth oath and before the fifth, with a man's hand on the mouth of the husband and a woman's on the wife's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (c) admonition before the prayer for rain: most jurists recommend it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (d) admonition after the eclipse prayer: the Malikis recommend it; the Hanafis and Hanbalis hold that the eclipse prayer has no sermon, the Shafi'is recommend two sermons. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561}\n\nAdmonishing the ruler: there is no dispute that the ruler may be admonished and enjoined to good and forbidden from wrong when he is just. The jurists differ on a tyrant. The Hanafis, Shafi'is and a Hanbali report permit gentle and mild admonition; the Shafi'is and Ibn al-Jawzi forbid harsh speech to him, such as calling him an oppressor, if it would stir a sedition whose harm would reach others, but permit it if the harm falls on the admonisher alone, on the saying that the greatest struggle is a word of justice before an unjust ruler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562} The Malikis hold it obligatory to admonish and warn the ruler of the consequences in this world and the next; Abu 'Umar says this is most binding on those who associate with him and can advise him, and Malik adds, when there is hope of being heard. A Hanbali report holds that leaving off the denunciation of an unjust ruler is better; Ahmad is reported to have said not to confront the ruler, for his sword is drawn; where denunciation is allowed it must be done gently, citing God's words to Moses and Aaron in sura Ta-Ha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562}\n\nAdmonishing rebels: when the imam sends someone to explain the right course to rebels who refuse to return, the Malikis and Hanbalis hold it obligatory to admonish them and warn them of fighting, since the aim is to restrain them and not to kill them; if they return by words, that is better than fighting, and if not they are fought, on the verse of sura al-Hujurat. The Hanafis hold that the people of justice should call the rebels to justice, citing the report that 'Ali sent Ibn 'Abbas to the Haruriyya to argue with them; the Shafi'is recommend admonishing them with encouragement and warning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}\n\nEarning by admonition: it is not lawful for the admonisher to ask his audience for anything for himself in the session, since this is earning worldly gain by knowledge; the Hanafis and Hanbalis hold so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}\n\nWomen attending admonition sessions: the Hanafis and Shafi'is dislike the attendance of young women for fear of temptation, and allow older women, citing the report of 'A'isha that the women of the Children of Israel were forbidden the mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}"
