id: concept/waz-fiqh
class: concept
kind: legal
label:
  ar: "وَعْظ"
  en: "Wa'z (admonition, fiqh)"
  es: "Wa'z (admonición, fiqh)"
  fr: "Wa'z (admonition, fiqh)"
  ur: "واعظ ⁦(نصیحت، فقہ)⁩"
  tr: "vaaz etmek"
  id: "khotbah"
summary:
  ar: "الوعظ في اللغة زجر مقترن بتخويف، ومنه النصح والتذكير بالعواقب؛ وفي الاصطلاح التذكير بالخير فيما يرقّ له القلب. والنصيحة الدعاء إلى ما فيه الصلاح والنهي عن الفساد، وبينهما اشتراك في الدعاء إلى الصلاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}\n\nالحكم التكليفي: الأصل فيه الاستحباب، وقال الحصكفي إن التذكير على المنابر والاتعاظ سنة الأنبياء، واستدل الكتاب بقوله تعالى في سورة الذاريات. وقد يكون منهياً عنه إذا هيّج المصيبة فصار من النياحة، أو كان للرئاسة وكسب المال والقبول عند العامة؛ وقال الفتاوى الهندية إنه لا يحل للواعظ أن يسأل الناس شيئاً في مجلسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nأركان الوعظ: الواعظ، والموعوظ، وأسلوب الوعظ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nشروط الواعظ: أن يكون مكلفاً عاقلاً بالغاً، عدلاً، محدِّثاً بأن يكون مشتغلاً بكتب الحديث يعرف صحيحها وسقيمها، ومفسِّراً مشتغلاً بغريب القرآن ومشكله، ويُستحب أن يكون فصيحاً لطيفاً يكلم الناس قدر فهمهم، وأن يكون ميسِّراً لا معسِّراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}\n\nآداب الواعظ: أن يجتنب ما ظاهره خلاف الصواب ولو كان محقاً فيه، لما يترتب عليه من مفاسد، كتوهم الناس الجواز المطلق، ووقوعهم فيه بالتنقيص، وسوء الظن به، وسقوط روايته وشهادته وفتواه؛ فإن احتاج إلى ذلك بيّن أنه ليس بحرام، واستدل الكتاب بحديث سهل بن سعد في صنع النبي على المنبر، وبحديث صفية في الاعتكاف، وبشرب علي قائماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nمنع من ليس أهلاً للوعظ: الشافعية والحنابلة يمنعون من تصدى للوعظ وليس من أهله، أو كان يكذب، لأنه لا يؤمن الاغترار به. وأما المبتدع فلا يجوز حضور مجلسه إلا لإظهار الرد عليه، واستدل بقوله تعالى في سورة الأنعام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nآداب الموعوظ: الإنصات للواعظ وعدم الكلام، فإن لم ينصتوا طلب الواعظ منهم ذلك، واستدل الكتاب بحديث جرير في أن النبي في حجة الوداع أمر بإنصات الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}\n\nالإنصات للواعظ: قال العلماء إن الإنصات للعلماء لازم للمتعلمين، وإن النبي أمر الناس بالإنصات في خطبة حجة الوداع، وقال سفيان الثوري إن أول العلم الاستماع ثم الإنصات ثم الحفظ ثم العمل ثم النشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} ومن آداب الموعوظين: أن يستقبلوا الواعظ، وألا يلعبوا أو يلغطوا أثناء الوعظ، وألا يكثروا السؤال في كل مسألة، فما تعلق قوياً بالمسألة وكان دقيقاً لا يحتمله فهم العامة سكت عنه السامع في المجلس وسأل في الخلوة أو انتظر انتهاء الكلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}\n\nأسلوب الوعظ ومنهجه: أولاً، استعمال الألفاظ الظاهرة الدالة على المراد واجتناب الغريب، لحديث عائشة في أن كلام النبي كان فصلاً يفهمه كل من سمعه، وذكر ابن علان تفسير السخاوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} ثانياً، تكرار الكلمات إذا لم تُفهم إلا بذلك أو لمزيد الاعتناء أو لكثرة المخاطبين، لحديث أنس في أن النبي كان إذا تكلم بالكلمة أعادها ثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} ثالثاً، مراعاة أحوال الناس، فلا يحدَّث الناس بما لا تطيق عقولهم أو بما يُخاف تحريفه، لأثر علي «حدّثوا الناس بما يعرفون»، ولأثر ابن مسعود «ما أنت بمحدّث قوماً حديثاً لا تبلغه عقولهم إلا كان لبعضهم فتنة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} رابعاً، الاقتصاد في الوعظ بين البسط المُملّ والإيجاز المُخلّ، لحديث عمار في أن طول الصلاة وقصر الخطبة من الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} خامساً، استحباب تعهّد الناس بالوعظ في أوقات القبول، وألا يعظ كل يوم حتى لا يسأموا، ويجعل لوعظه وقتاً محدداً كيوم الخميس، لأثر ابن مسعود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nسادساً، معرفة المنكر الذي يُنهى عنه وحال الموعوظ: أهو ارتكبه عن جهل أو عن علم. فيُنهى بالوعظ والنصح والتخويف بالله من يُقدم على المنكر وهو عالم، أو من أصرّ عليه بعد العلم، بشفقة ولطف من غير عنف، والوعظ في السر أفضل من الإعلان كما نُقل عن أم الدرداء الصغرى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nأسلوب النهي عن المنكر في الوعظ: على الواعظ أن يعرف المنكر وحال الموعوظ من جهله أو علمه؛ فمن أقدم على المنكر وهو عالم به، أو أصرّ عليه بعد أن عرفه، يُوعظ ويُخوَّف بالله، وتُورد عليه أخبار الوعيد وسيرة السلف، بشفقة لطف من غير عنف؛ والوعظ في السر أفضل، فإن لم ينفع استُعين بأهل الخير، فإن لم ينفع فبأصحاب السلطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} ومن درجات النهي التعنيف بالقول الغليظ عند العجز عن المنع باللطف وظهور الإصرار والاستهزاء، وكان قصد الآمر الرجوع عن المنكر لا الانتصار للنفس، واستدل الكتاب بقول إبراهيم في سورة الأنبياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nما ينبغي استعماله في الوعظ من آيات وأحاديث وقصص، وفيه أربعة أنواع: ذكر الآيات المخوفة، وحكايات الأنبياء والسلف، وأن تعجيل العقوبة في الدنيا متوقع على الذنب، وذكر عقوبات الذنوب المعيّنة كالخمر والزنا والسرقة والقتل والغيبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}\n\nأحكام الوعظ في أبواب أخرى: ⁦(أ)⁩ وعظ الزوجة إذا نشزت، لآية النساء، وتفصيله في النشوز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559} ⁦(ب)⁩ وعظ المتلاعنين: يُسن عند المالكية والشافعية تخويفهما قبل اللعان وعند الخامسة، ويُقرأ عليهما آية آل عمران، ويقال لهما ما قاله النبي للمتلاعنين، وعند الحنابلة يستحب أن يعظ الإمام المتلاعنين بعد الرابعة وقبل الخامسة، ويأمر من يضع يده على فم المتلاعن والمتلاعنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} ⁦(ج)⁩ الوعظ قبل صلاة الاستسقاء: جمهور الفقهاء يستحبونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} ⁦(د)⁩ الوعظ بعد صلاة الكسوف: المالكية يندبونه، والحنفية والحنابلة لا خطبة لصلاة الكسوف عندهم، والشافعية يسنون خطبتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561}\n\nوعظ السلطان: لا خلاف في جواز وعظ السلطان وأمره بالمعروف ونهيه عن المنكر إذا كان عادلاً؛ واختلفوا في وعظ الجائر. فالحنفية والشافعية والحنابلة في رواية يجيزون وعظه بالرفق واللين؛ والشافعية وابن الجوزي يمنعون تخشين القول له إن كان يحرّك فتنة يتعدى شرها، ويجيزونه إن لم يعد الشر إلا على الواعظ، واستدلوا بحديث «إن من أعظم الجهاد كلمة عدل عند سلطان جائر». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562} والمالكية يوجبون وعظ السلطان وتخويفه وتحذيره من العاقبة، وقال أبو عمر إن ذلك واجب على من يجالسه ويمكنه النصح، وقال مالك إذا رجا أن يُسمع. وعند الحنابلة في رواية أن ترك الإنكار على السلطان الجائر أفضل، ونقل عن أحمد أنه لا يُتعرض للسلطان فإن سيفه مسلول؛ وإذا قيل بالإنكار فبالتعريف والوعظ اللطيف، لقوله تعالى لموسى وهارون في سورة طه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562}\n\nوعظ البغاة: إذا بعث الإمام من يكشف لهم الصواب فأبوا الرجوع، فالمالكية والحنابلة يوجبون وعظهم وتخويفهم بالقتال، لأن المقصود كفهم لا قتلهم، فإن أمكن بالقول فهو أولى، فإن فاءوا وإلا قُوتلوا، لقوله تعالى في سورة الحجرات. والحنفية يرون أن يدعوهم أهل العدل إلى العدل، واستدلوا بما روي عن علي في بعثه ابن عباس إلى الحرورية؛ والشافعية يستحبون وعظهم ترغيباً وترهيباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}\n\nالتكسّب بالوعظ: لا يحل للواعظ أن يسأل الناس شيئاً لنفسه في مجلس الوعظ، لأنه اكتساب الدنيا بالعلم، وإلى ذلك ذهب الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}\n\nحضور النساء مجالس الوعظ: الحنفية والشافعية يكرهون حضور الشابة لخشية الفتنة، ويجيزون للعجائز، واستدل الكتاب بحديث عائشة في منع نساء بني إسرائيل المسجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}"
  en: "Admonition (wa'z), lexically, is a rebuke joined with fear, and includes advice and reminding of consequences; technically it is reminding people of good in a way that softens the heart. Nasiha, sincere counsel, means calling to what is good and forbidding what is corrupt; the two share the call to good. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}\n\nThe ruling: the basis is recommendation. Al-Haskafi says preaching from pulpits and being admonished is the practice of the prophets. It may be forbidden when it stirs up a calamity so that it becomes wailing, or when it aims at leadership, gain or popularity; the Hindiyya says a preacher may not beg from his audience during the sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nThe pillars of admonition: the preacher, the one admonished, and the method. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}\n\nConditions of the preacher: sane, adult, just; a man of hadith, who has studied the hadith books and knows the sound from the weak; an exegete, who has studied the strange words and difficulties of the Qur'an; it is recommended that he be eloquent, gentle, speak to people only as far as they can understand, and make things easy rather than hard. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}\n\nThe preacher's conduct: he should avoid acts that look wrong even if he is right, because people may take them as general permission, belittle him, think ill of him, reject his narrations, testimony and fatwas. If he must do such a thing, he should say it is not forbidden and explain its basis. The book cites the report of Sahl ibn Sa'd about the Prophet's pulpit, the report of Safiyya about the Prophet escorting her in the mosque, and the report of 'Ali drinking standing to show what he saw the Prophet do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nPreventing the unqualified: the Shafi'is and Hanbalis hold that a person who takes up admonition without being qualified, or who lies, must be prevented, lest people be deceived by him. The heretic may attend only to refute him, as the verse of sura al-An'am (cited by sura and verse) indicates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}\n\nConduct of the listeners: they should listen and not talk among themselves; if they do not, the preacher may ask them to be silent, citing the report of Jarir that the Prophet asked the people to be silent at the Farewell Pilgrimage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}\n\nListening to the admonisher: the scholars hold that the learners must be silent before the learned, since scholars are the heirs of the prophets. The Prophet asked the people to be silent during his sermon at the Farewell Pilgrimage, and al-Thawri says the beginning of knowledge is listening, then silence, then memorising, then acting, then spreading. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} Manners of the listeners: they should face the preacher, not play or talk during the admonition, and not ask too many questions. If a question is strongly connected to the matter but too subtle for common people, the listener keeps silent during the session and asks in private or waits until the talk ends. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}\n\nThe method of admonition. First, using clear words that convey the meaning and avoiding words the audience does not know, on the report of 'A'isha that the Prophet's speech was clear and that everyone who heard it understood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} Second, repeating words when they are not understood without it, to give emphasis, or when the audience is large, on the report of Anas that the Prophet repeated a word three times until it was understood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} Third, taking account of people's condition: not telling them what their minds cannot bear or what may be distorted as they retell it, following the saying of 'Ali, 'speak to people in what they know and leave aside what they would deny', and Ibn Mas'ud's saying that a speech that a group's minds cannot reach becomes a trial for some of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} Fourth, moderation: neither so long as to bore nor so short as to be unclear, on the report of 'Ammar that a long prayer and a short sermon are a sign of understanding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} Fifth, the preacher should choose times when people are receptive, not admonish every day lest they tire, and fix a time such as Thursday, following the practice of Ibn Mas'ud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nSixth, knowing the wrong to be forbidden and the state of the one admonished: whether he committed it in ignorance or knowingly. The one who persists in a wrong known to be wrong, such as drinking, injustice or backbiting, is admonished by warning, fear of God and reports of threat, with kindness and without violence; admonition in private is better than in public, as Umm al-Darda' al-Sughra is reported to have said. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nForbidding wrong by admonition: the admonisher must know the wrong and the state of the one admonished, whether he committed it in ignorance or knowingly. One who commits a wrong while knowing it, or persists after knowing it, is admonished and warned by fear of God, with reports of threat and the example of the pious ancestors, with kindness and without violence; in private is better; if it does not work he seeks the help of the righteous, and then of the authorities. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} A degree of forbidding is harsh speech, when gentleness has failed and persistence and mockery appear; the aim must be the wrongdoer's return, not the admonisher's own victory, citing Abraham's words in sura al-Anbiya' (by sura). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}\n\nWhat the admonisher should use from verses, hadith and stories: four kinds, namely the verses that warn sinners, the stories of the prophets and the pious ancestors, the teaching that punishment in this world is expected for a sin, and the particular punishments of particular sins such as wine, adultery, theft, murder and backbiting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}\n\nAdmonition in other chapters of law: (a) admonishing a wife who is disobedient, by the verse of sura al-Nisa', the detail under disobedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559} (b) admonishing parties to a lian: the Malikis and Shafi'is recommend warning them before the oath and at the fifth oath, reading to them the verse of sura Al 'Imran, and saying to them what the Prophet said to those who swore lian; the Hanbalis recommend that the imam admonish them after the fourth oath and before the fifth, with a man's hand on the mouth of the husband and a woman's on the wife's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (c) admonition before the prayer for rain: most jurists recommend it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (d) admonition after the eclipse prayer: the Malikis recommend it; the Hanafis and Hanbalis hold that the eclipse prayer has no sermon, the Shafi'is recommend two sermons. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561}\n\nAdmonishing the ruler: there is no dispute that the ruler may be admonished and enjoined to good and forbidden from wrong when he is just. The jurists differ on a tyrant. The Hanafis, Shafi'is and a Hanbali report permit gentle and mild admonition; the Shafi'is and Ibn al-Jawzi forbid harsh speech to him, such as calling him an oppressor, if it would stir a sedition whose harm would reach others, but permit it if the harm falls on the admonisher alone, on the saying that the greatest struggle is a word of justice before an unjust ruler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562} The Malikis hold it obligatory to admonish and warn the ruler of the consequences in this world and the next; Abu 'Umar says this is most binding on those who associate with him and can advise him, and Malik adds, when there is hope of being heard. A Hanbali report holds that leaving off the denunciation of an unjust ruler is better; Ahmad is reported to have said not to confront the ruler, for his sword is drawn; where denunciation is allowed it must be done gently, citing God's words to Moses and Aaron in sura Ta-Ha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562}\n\nAdmonishing rebels: when the imam sends someone to explain the right course to rebels who refuse to return, the Malikis and Hanbalis hold it obligatory to admonish them and warn them of fighting, since the aim is to restrain them and not to kill them; if they return by words, that is better than fighting, and if not they are fought, on the verse of sura al-Hujurat. The Hanafis hold that the people of justice should call the rebels to justice, citing the report that 'Ali sent Ibn 'Abbas to the Haruriyya to argue with them; the Shafi'is recommend admonishing them with encouragement and warning. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}\n\nEarning by admonition: it is not lawful for the admonisher to ask his audience for anything for himself in the session, since this is earning worldly gain by knowledge; the Hanafis and Hanbalis hold so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}\n\nWomen attending admonition sessions: the Hanafis and Shafi'is dislike the attendance of young women for fear of temptation, and allow older women, citing the report of 'A'isha that the women of the Children of Israel were forbidden the mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}"
  es: "La amonestación (wa'z), léxicamente, es una reprimenda acompañada de temor, e incluye consejos y recordatorios de consecuencias; técnicamente es recordar a las personas el bien de una manera que ablande el corazón. Nasiha, consejo sincero, significa llamar a lo que es bueno y prohibir lo que es corrupto; ambos comparten el llamado al bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551} La regla: la base es la recomendación. Al-Haskafi dice que predicar desde los púlpitos y ser amonestado es la práctica de los profetas. Puede estar prohibido cuando provoca una calamidad de tal manera que se convierte en lamento, o cuando apunta al liderazgo, ganancia o popularidad; el Hindiyya dice que un predicador no puede mendigar a su audiencia durante el sermón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552} Los pilares de la amonestación: el predicador, el amonestado y el método. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552} Condiciones del predicador: cuerdo, adulto, justo; un hombre de hadices, que ha estudiado los libros de hadices y sabe distinguir lo sólido de lo débil; un exegeta, que ha estudiado las palabras extrañas y las dificultades del Corán; se recomienda que sea elocuente, amable, que hable con la gente solo hasta donde puedan entender, y que haga las cosas fáciles en lugar de difíciles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553} La conducta del predicador: debe evitar actos que parezcan incorrectos incluso si tiene razón, porque la gente puede tomarlos como permiso general, menospreciarlo, pensar mal de él, rechazar sus narraciones, testimonios y fatwas. Si debe hacer tal cosa, debe decir que no está prohibido y explicar su fundamento. El libro cita el relato de Sahl ibn Sa'd sobre el púlpito del Profeta, el relato de Safiyya sobre el Profeta acompañándola en la mezquita, y el relato de 'Ali bebiendo de pie para mostrar lo que vio hacer al Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554} Prevención de los no calificados: los shafi'ís y hanbalíes sostienen que una persona que toma amonestación sin estar calificada, o que miente, debe ser impedida, para que la gente no sea engañada por él. El hereje puede asistir solo para refutarlo, como indica el versículo de la sura al-An'am (citado por sura y versículo). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554} Conducta de los oyentes: deben escuchar y no hablar entre ellos; si no lo hacen, el predicador puede pedirles que guarden silencio, citando el informe de Jarir de que el Profeta pidió a la gente que guardara silencio en la Peregrinación de Despedida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} Escuchar al amonestador: los eruditos sostienen que los aprendices deben guardar silencio ante el sabio, puesto que los eruditos son los herederos de los profetas. El Profeta pidió a la gente que guardara silencio durante su sermón en la Peregrinación de Despedida, y al-Thawri dice que el comienzo del conocimiento es escuchar, luego el silencio, luego la memorización, luego la acción, luego la difusión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} Modales de los oyentes: deben mirar al predicador, no jugar ni hablar durante la amonestación, y no hacer demasiadas preguntas. Si una pregunta está fuertemente relacionada con el tema pero es demasiado sutil para la gente común, el oyente guarda silencio durante la sesión y pregunta en privado o espera hasta que termine la charla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} El método de amonestación. Primero, usar palabras claras que transmitan el significado y evitar palabras que la audiencia no conozca, en el relato de Aisha de que el discurso del Profeta fue claro y que todos los que lo escucharon lo entendieron. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} Segundo, repetir palabras cuando no se entienden sin ello, para dar énfasis, o cuando la audiencia es grande, en el relato de Anas de que el Profeta repitió una palabra tres veces hasta que se entendió. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} Tercero, tener en cuenta la condición de las personas: no decirles lo que sus mentes no pueden soportar o lo que puede distorsionarse al contarlo, siguiendo el dicho de 'Ali, 'habla a la gente sobre lo que saben y deja de lado lo que negarían', y el dicho de Ibn Mas'ud de que un discurso que las mentes de un grupo no pueden alcanzar se convierte en una prueba para algunos de ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} Cuarto, moderación: ni tan largo como para aburrir ni tan corto como para ser confuso, según el informe de 'Ammar de que una oración larga y un sermón corto son señal de comprensión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} Quinto, el predicador debe elegir momentos en que la gente sea receptiva, no amonestar todos los días para que no se cansen, y fijar un momento como el jueves, siguiendo la práctica de Ibn Mas'ud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Sexto, conocer el mal que está prohibido y el estado de aquel amonestado: si lo cometió por ignorancia o a sabiendas. A aquel que persiste en un mal que sabe que está mal, como beber, la injusticia o la calumnia, se le amonesta con advertencia, temor de Dios e informes de amenaza, con amabilidad y sin violencia; la amonestación en privado es mejor que en público, como se dice que dijo Umm al-Darda' al-Sughra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Prohibir el mal mediante la amonestación: el amonestador debe conocer el mal y el estado del amonestado, ya sea que lo haya cometido por ignorancia o a sabiendas. Quien comete un mal a sabiendas, o persiste después de saberlo, es amonestado y advertido por temor a Dios, con informes de amenazas y el ejemplo de los antepasados piadosos, con amabilidad y sin violencia; en privado es mejor; si no funciona, busca la ayuda de los justos, y luego de las autoridades. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Un grado de prohibición es el habla severa, cuando la gentileza ha fallado y aparecen la persistencia y la burla; el objetivo debe ser el retorno del malhechor, no la propia victoria del amonestador, citando las palabras de Abraham en la sura al-Anbiya' (por sura). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Lo que el amonestador debe usar de versículos, hadices e historias: cuatro tipos, a saber, los versículos que advierten a los pecadores, las historias de los profetas y los antepasados piadosos, la enseñanza de que se espera un castigo en este mundo por un pecado, y los castigos particulares de pecados particulares como el vino, el adulterio, el robo, el asesinato y la calumnia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559} Amonestación en otros capítulos de la ley: (a) amonestar a una esposa que es desobediente, por el versículo de la sura al-Nisa', el detalle bajo la desobediencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559} (b) amonestación a las partes de un lian: los malikíes y shafi'ís recomiendan advertirles antes del juramento y en el quinto juramento, leyéndoles el versículo de la sura Al 'Imran y diciéndoles lo que el Profeta dijo a los que juraron lian; los hanbalíes recomiendan que el imán los amoneste después del cuarto juramento y antes del quinto, con la mano de un hombre en la boca del marido y la de una mujer en la de la esposa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (c) amonestación antes de la oración por la lluvia: la mayoría de los juristas lo recomiendan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (d) amonestación después de la oración del eclipse: los malikíes la recomiendan; los hanafíes y los hanbalíes sostienen que la oración del eclipse no tiene sermón, los shafiíes recomiendan dos sermones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} Amonestar al gobernante: no hay disputa de que el gobernante puede ser amonestado y ordenado al bien y prohibido al mal cuando es justo. Los juristas difieren en un tirano. Los hanafíes, los shafiíes y un informe hanbalí permiten una amonestación suave y moderada; Los shafi'ís e Ibn al-Jawzi prohíben el discurso duro hacia él, como llamarlo opresor, si esto provocara una sedición cuyo daño afectaría a otros, pero lo permiten si el daño recae únicamente sobre quien amonesta, en el sentido de que la mayor lucha es una palabra de justicia ante un gobernante injusto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562} Los malikíes consideran obligatorio amonestar y advertir al gobernante sobre las consecuencias en este mundo y en el más allá; Abu 'Umar dice que esto es más vinculante para aquellos que se asocian con él y pueden aconsejarle, y Malik añade, cuando hay esperanza de ser escuchado. Un relato hanbalí sostiene que es mejor abstenerse de denunciar a un gobernante injusto; se dice que Ahmad dijo que no se debía confrontar al gobernante, pues su espada está desenvainada; cuando se permite la denuncia, debe hacerse con suavidad, citando las palabras de Dios a Moisés y Aarón en la sura Ta-Ha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562} Amonestar a los rebeldes: cuando el imán envía a alguien para explicar el camino correcto a los rebeldes que se niegan a regresar, los malikíes y los hanbalíes consideran obligatorio amonestarlos y advertirles que no luchen, ya que el objetivo es contenerlos y no matarlos; si regresan con palabras, eso es mejor que luchar, y si no, se lucha contra ellos, según el versículo de la sura al-Hujurat. Los hanafíes sostienen que la gente de justicia debe llamar a los rebeldes a la justicia, citando el relato de que Alí envió a Ibn Abbas a los Haruriyya para discutir con ellos; los shafiíes recomiendan amonestarlos con aliento y advertencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563} Ganancia mediante la amonestación: no es lícito que el amonestador pida a su audiencia algo para sí mismo durante la sesión, ya que esto es obtener ganancias mundanas mediante el conocimiento; así lo sostienen los hanafíes y los hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563} Asistencia de mujeres a las sesiones de amonestación: los hanafíes y los shafiíes desaprueban la asistencia de mujeres jóvenes por temor a la tentación, y permiten la asistencia de mujeres mayores, citando el relato de Aisha de que a las mujeres de los Hijos de Israel se les prohibía la entrada a la mezquita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}"
  fr: "L'admonition (wa'z), au sens littéral, est une réprimande mêlée de crainte, incluant conseils et rappel des conséquences; il s'agit, en substance, de rappeler aux gens le bien d'une manière qui adoucit leur cœur. La nasiha, conseil sincère, consiste à appeler au bien et à interdire le mal; les deux partagent l'appel au bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551} La règle: le fondement est la recommandation. Al-Haskafi affirme que prêcher en chaire et recevoir des admonitions est une pratique des prophètes. Cela peut être interdit lorsque cela provoque un malheur au point de se transformer en lamentation, ou lorsque cela vise le pouvoir, le gain ou la popularité; la Hindiyya stipule qu'un prédicateur ne peut mendier auprès de son auditoire pendant le sermon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552} Les piliers de l'exhortation: le prédicateur, celui qui est exhorté et la méthode. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552} Conditions requises pour le prédicateur: sain d'esprit, adulte et juste; homme de hadith, ayant étudié les recueils de hadiths et discernant le vrai du faux; exégète, ayant étudié les termes complexes et les difficultés du Coran; il est recommandé qu'il soit éloquent, doux, qu'il s'adresse à son auditoire dans la mesure de sa compréhension et qu'il simplifie les choses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553} La conduite du prédicateur: il doit éviter les actes qui peuvent paraître répréhensibles, même s’il a raison, car on pourrait les interpréter comme une permission générale, le dénigrer, avoir une mauvaise opinion de lui et rejeter ses récits, son témoignage et ses fatwas. S’il doit accomplir un tel acte, il doit préciser qu’il n’est pas interdit et en expliquer le fondement. L’ouvrage cite le récit de Sahl ibn Sa’d concernant la chaire du Prophète, celui de Safiyya concernant l’escorte du Prophète dans la mosquée, et celui d’Ali buvant debout pour illustrer ce qu’il avait vu faire au Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554} Prévenir les incompétents: les écoles chaféite et hanbalite estiment qu’il faut empêcher quiconque de prêcher sans être qualifié, ou qui ment, de peur que les gens ne soient trompés. L’hérétique ne peut assister à l’enseignement que pour le réfuter, comme l’indique le verset de la sourate al-An’am (cité par sourate et verset). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554} Comportement des auditeurs: ils doivent écouter sans parler entre eux; s’ils ne le font pas, le prédicateur peut leur demander de se taire, en citant le hadith de Jarir selon lequel le Prophète a demandé le silence lors du Pèlerinage d’Adieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} Écouter l'exhortation: les savants estiment que les apprenants doivent garder le silence devant les savants, car ces derniers sont les héritiers des prophètes. Le Prophète a demandé au peuple de se taire lors de son sermon au Pèlerinage d'Adieu, et al-Thawri affirme que le commencement du savoir est l'écoute, puis le silence, puis la mémorisation, puis la mise en pratique, et enfin la diffusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} Comportement des auditeurs: ils doivent se tourner vers le prédicateur, ne pas jouer ni parler pendant l'exhortation, et ne pas poser trop de questions. Si une question est étroitement liée au sujet mais trop subtile pour le commun des mortels, l'auditeur garde le silence pendant la séance et la pose en privé ou attend la fin de l'exposé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} La méthode de l'exhortation. Premièrement, utiliser des mots clairs qui transmettent le sens et éviter les mots inconnus de l'auditoire, selon le récit d'Aïcha selon lequel le discours du Prophète était clair et que tous ceux qui l'entendaient le comprenaient. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} Deuxièmement, répéter les mots qui ne sont pas compris sans répétition, pour les mettre en valeur, ou lorsque l'auditoire est nombreux, selon le récit d'Anas selon lequel le Prophète répétait un mot trois fois jusqu'à ce qu'il soit compris. Troisièmement, tenir compte de la condition humaine: ne pas dire ce que l’esprit ne peut comprendre ou ce qui pourrait être déformé lors de la transmission, conformément à la parole d’Ali: « Parlez aux gens en fonction de ce qu’ils comprennent et laissez de côté ce qu’ils nieraient », et à l’avis d’Ibn Mas’ud selon lequel un discours inaccessible à un groupe devient une épreuve pour certains de ses membres. Quatrièmement, la modération: ni trop long au point d’ennuyer, ni trop court au point d’être obscur, selon le hadith d’Ammar qui affirme qu’une longue prière et un court sermon sont un signe de compréhension. Cinquièmement, le prédicateur doit choisir des moments où les gens sont réceptifs, ne pas exhorter quotidiennement de peur de les lasser, et fixer un jour fixe comme le jeudi, suivant la pratique d'Ibn Mas'ud. Sixièmement, il est important de connaître le caractère interdit du mal et l'état de la personne exhortée: l'a-t-elle commis par ignorance ou en connaissance de cause ? Celui qui persiste dans un mal reconnu comme tel, comme l'alcoolisme, l'injustice ou la médisance, est exhorté par la crainte de Dieu et des menaces, avec bienveillance et sans violence; une exhortation en privé vaut mieux qu'en public, comme l'aurait dit Umm al-Darda' al-Sughra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Interdire le mal par l'exhortation: celui qui exhorte doit connaître le mal commis et l'état de celui qui est exhorté, qu'il l'ait commis par ignorance ou sciemment. Celui qui commet un mal en le sachant, ou qui persiste après l'avoir su, est exhorté et averti par la crainte de Dieu, par des récits de menaces et l'exemple des pieux ancêtres, avec bienveillance et sans violence; il est préférable de le faire en privé; si cela ne fonctionne pas, il recherche l'aide des vertueux, puis celle des autorités. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Une certaine forme d'exhortation consiste en une parole dure, lorsque la douceur a échoué et que la persistance et la moquerie apparaissent; le but doit être le retour du malfaiteur, et non la propre victoire de celui qui exhorte, citant les paroles d'Abraham dans la sourate al-Anbiya' (par la sourate). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Ce que celui qui exhorte doit utiliser parmi les versets, les hadiths et les récits: quatre types, à savoir les versets qui mettent en garde les pécheurs, les récits des prophètes et des pieux ancêtres, l’enseignement selon lequel un châtiment est attendu dans ce monde pour un péché, et les châtiments spécifiques à des péchés particuliers tels que le vin, l’adultère, le vol, le meurtre et la médisance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559} Exhortation dans d’autres chapitres de la loi: (a) exhorter une épouse désobéissante, par le verset de la sourate An-Nisa’, le détail sous la désobéissance. (b) Avertissement aux parties à un serment de lian: les écoles malikite et chaféite recommandent de les avertir avant le serment et au cinquième serment, en leur lisant le verset de la sourate Imran et en leur rapportant les paroles du Prophète à ceux qui prêtaient serment de lian; les écoles hanbalite recommandent que l’imam les avertisse après le quatrième serment et avant le cinquième, la main de l’homme sur la bouche du mari et celle de la femme sur celle de l’épouse. (c) Avertissement avant la prière pour la pluie: la plupart des juristes le recommandent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} (d) Admonition après la prière de l'éclipse: les Malikites la recommandent; les Hanafites et les Hanbalites estiment que la prière de l'éclipse ne comporte pas de sermon, tandis que les Chafi'ites en recommandent deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17561} Admonition du souverain: il est admis que le souverain peut être admonesté, enjoint au bien et interdit au mal lorsqu'il est juste. Les juristes divergent quant au cas d'un tyran. Les Hanafites, les Chafi'ites et un hadith hanbalite autorisent une admonition douce et mesurée. Les chaféites et Ibn al-Jawzi interdisent les propos durs à son égard, comme le traiter d'oppresseur, si cela risque d'inciter à la sédition et de nuire à autrui. Ils l'autorisent cependant si le préjudice ne touche que celui qui admoneste, arguant que le plus grand combat est celui de la justice face à un dirigeant injuste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562} Les malikites considèrent qu'il est obligatoire d'avertir le dirigeant des conséquences de ses actes dans ce monde et dans l'autre. Abou 'Umar précise que cette obligation incombe surtout à ceux qui le côtoient et peuvent le conseiller, et Malik ajoute: « lorsqu'il y a espoir d'être entendu ». Selon un hadith hanbalite, il est préférable de s'abstenir de dénoncer un dirigeant injuste. Ahmad aurait dit de ne pas affronter le dirigeant, car son épée est dégainée. Lorsque la dénonciation est permise, elle doit être faite avec douceur, en citant les paroles de Dieu à Moïse et à Aaron dans la sourate Ta-Ha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17562} Réprimande des rebelles: lorsque l’imam envoie quelqu’un expliquer la voie à suivre aux rebelles qui refusent de se soumettre, les écoles malikite et hanbalite estiment qu’il est obligatoire de les réprimander et de les mettre en garde contre le combat, car le but est de les dissuader et non de les tuer; s’ils se soumettent par la parole, c’est préférable au combat; sinon, ils sont combattus, conformément au verset de la sourate al-Hujurat. Les hanafites estiment que les hommes de justice doivent appeler les rebelles à la justice, citant le récit selon lequel Ali envoya Ibn Abbas auprès des Haruriyya pour discuter avec eux; les chaféites recommandent de les réprimander en les encourageant et en les avertissant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563} Acquisition de richesses par l'exhortation: il n'est pas permis à celui qui exhorte de demander quoi que ce soit à son auditoire pour son propre compte durant la séance, car cela revient à acquérir un gain matériel par la connaissance; c'est l'avis des hanafites et des hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563} Présence des femmes aux séances d'exhortation: les hanafites et les chaféites désapprouvent la présence des jeunes femmes par crainte de la tentation, et autorisent les femmes plus âgées, se référant au hadith d'Aïcha selon lequel l'accès à la mosquée était interdit aux femmes des Enfants d'Israël. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}"
  ur: "نصیحت ⁦(واعز)⁩، لغوی طور پر، خوف کے ساتھ مل کر ایک ملامت ہے، اور اس میں نصیحت اور نتائج کی یاد دہانی شامل ہے۔ تکنیکی طور پر یہ لوگوں کو اچھے کی یاد دلاتا ہے جس سے دل نرم ہوتا ہے۔ نصیحہ، مخلصانہ نصیحت کا مطلب ہے نیکی کی طرف بلانا اور بدی سے منع کرنا۔ دونوں نیکی کی دعوت کا اشتراک کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص17551} حکم: بنیاد سفارش ہے۔ الحسکفی کہتے ہیں کہ منبروں سے تبلیغ کرنا اور نصیحت کرنا انبیاء کا معمول ہے۔ یہ حرام ہو سکتا ہے جب یہ کسی آفت کو بھڑکاتا ہے تاکہ وہ نوحہ بن جائے، یا جب اس کا مقصد قیادت، فائدہ یا مقبولیت ہو۔ ہندیہ کا کہنا ہے کہ ایک مبلغ خطبہ کے دوران اپنے سامعین سے بھیک نہیں مانگ سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17551}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17552} نصیحت کے ستون: مبلغ، نصیحت کرنے والا، اور طریقہ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17552} مبلغ کی شرائط: سمجھدار، بالغ، عادل؛ حدیث کا ایک آدمی، جس نے حدیث کی کتابوں کا مطالعہ کیا ہو اور ضعیف کی آواز کو جانتا ہو۔ ایک مفسر، جس نے قرآن کے عجیب و غریب الفاظ اور مشکلات کا مطالعہ کیا ہے۔ یہ سفارش کی جاتی ہے کہ وہ فصیح، نرم مزاج، لوگوں سے صرف اس حد تک بات کرے جہاں تک وہ سمجھ سکتے ہیں، اور چیزوں کو مشکل کی بجائے آسان بنائیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553} مبلغ کا طرز عمل: اسے ایسے کاموں سے اجتناب کرنا چاہیے جو غلط نظر آئیں خواہ وہ صحیح ہی کیوں نہ ہوں، کیونکہ لوگ اسے عام اجازت کے طور پر لے سکتے ہیں، اس کی توہین، اس کی توہین اور تنقید کا نشانہ بن سکتے ہیں۔ فتوے اگر وہ ایسا کام کرے تو اسے حرام نہیں کہنا چاہیے اور اس کی بنیاد بتانا چاہیے۔ اس کتاب میں منبر نبوی کے بارے میں سہل بن سعد کی روایت، صفیہ کی روایت کا حوالہ دیا گیا ہے کہ وہ نبی کو مسجد میں لے گئے تھے، اور علی کے کھڑے ہو کر شراب پینے کی رپورٹ کا حوالہ دیا گیا ہے کہ انہوں نے نبی کو کیا کرتے دیکھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17553}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17554} نااہلوں سے روکنا: شافعیہ اور حنبلی کا خیال ہے کہ جو شخص بغیر اہلیت کے نصیحت کرتا ہے، اسے لوگوں کے ذریعے روکنا چاہیے، یا جو کہ اسے روکے گا۔ بدعتی صرف اس کی تردید کے لیے حاضر ہو سکتا ہے جیسا کہ سورۃ الانعام کی آیت ⁦(سورہ اور آیت سے نقل ہوئی)⁩ اشارہ کرتی ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17554} سامعین کا طرز عمل: انہیں سننا چاہیے اور آپس میں بات نہیں کرنی چاہیے۔ اگر وہ ایسا نہیں کرتے ہیں تو مبلغ انہیں خاموش رہنے کے لیے کہہ سکتا ہے، جریر کی روایت کا حوالہ دیتے ہوئے کہ نبی نے حجۃ الوداع کے موقع پر لوگوں کو خاموش رہنے کو کہا تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17554}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17555} نصیحت کرنے والے کی بات سننا: علماء کا خیال ہے کہ متعلمین کو عالم کے سامنے خاموش رہنا چاہیے کیونکہ علماء انبیاء کے وارث ہیں۔ نبی نے حجۃ الوداع کے خطبہ میں لوگوں سے خاموش رہنے کو کہا، اور الثوری کہتے ہیں کہ علم کی ابتدا سننا، پھر خاموشی، پھر یاد، پھر عمل، پھر پھیلنا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17555} سامعین کے آداب: وہ مبلغ کا سامنا کریں، نصیحت کے دوران کھیل یا گفتگو نہ کریں اور زیادہ سوالات نہ کریں۔ اگر کوئی سوال معاملے سے مضبوطی سے جڑا ہوا ہے لیکن عام لوگوں کے لیے بہت ہی لطیف ہے تو سامع سیشن کے دوران خاموش رہتا ہے اور تنہائی میں پوچھتا ہے یا بات ختم ہونے تک انتظار کرتا ہے۔ نصیحت کا طریقہ سب سے پہلے ایسے الفاظ کا استعمال جو معنی کو پہنچاتے ہیں اور ایسے الفاظ سے گریز کرتے ہیں جو سامعین کو معلوم نہ ہوں، عائشہ ا کی روایت میں ہے کہ رسول اللہ کی تقریر واضح تھی اور جس نے بھی اسے سنا وہ سمجھ گیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17555}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17556} دوسرا، الفاظ کو دہرانا جب کہ بغیر سمجھ نہ آئے، زور دینے کے لیے، یا جب سامعین کی تعداد زیادہ ہو، تو انس کی روایت پر ایک لفظ تین بار دہرایا گیا یہاں تک کہ نبی نے اسے تین مرتبہ دہرایا۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص17556} تیسرا، لوگوں کے حالات کا خیال رکھنا: ان کو یہ نہ بتانا کہ جو ان کے دماغ برداشت نہیں کرسکتے یا جس چیز کو وہ دوبارہ بیان کرتے ہیں اس میں تحریف ہوسکتی ہے، علی کے اس قول پر عمل کرتے ہوئے کہ 'لوگوں سے وہی بات کرو جو وہ جانتے ہیں اور اس بات کو چھوڑ دو جس سے وہ انکار کریں گے' اور اس بات کو چھوڑ دو کہ میں اس بات کی تردید کر سکتا ہوں، اور یہ کہ وہ اس بات کو ذہن نشین کر سکتے ہیں۔ رسائی ان میں سے کچھ کے لیے آزمائش بن جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17556}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17557} چوتھا، اعتدال: نہ تو لمبا ہونا اور نہ اتنا چھوٹا کہ واضح نہ ہو، 'عمار کی رپورٹ پر لمبی نماز اور عمار کی مختصر علامت ہے جو سمجھے گی۔ پانچویں، مبلغ کو ایسے اوقات کا انتخاب کرنا چاہیے جب لوگ قبول کریں، ہر روز نصیحت نہ کریں کہ وہ تھک جائیں، اور ابن مسعود کی روایت کے مطابق جمعرات جیسا وقت مقرر کریں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17557}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17558} چھٹا، غلط کو حرام جاننا اور نصیحت کرنے والے کی حالت: خواہ اس نے نادانی میں اس کا ارتکاب کیا ہو یا جان بوجھ کر۔ جو غلط جانا جاتا ہے، جیسے کہ شراب پینا، ناانصافی کرنا یا غیبت کرنا، اسے تنبیہ، خوف خدا اور دھمکیوں کی اطلاع، مہربانی اور تشدد کے بغیر نصیحت کی جاتی ہے۔ نجی طور پر نصیحت کرنا عوام سے بہتر ہے جیسا کہ ام الدرداء الصغرا نے کہا ہے۔ نصیحت کے ذریعے غلط سے منع کرنا: نصیحت کرنے والے کو نصیحت کرنے والے کی غلطی اور حالت کا علم ہونا چاہیے، خواہ اس نے نادانی میں یہ کام کیا ہو یا دانستہ۔ جو جانتے ہوئے بھی غلطی کرتا ہے یا جان لینے کے بعد اس پر قائم رہتا ہے، اسے خوف خدا، دھمکیوں اور نیک بزرگوں کی مثال کے ساتھ، مہربانی اور تشدد کے بغیر نصیحت اور تنبیہ کی جاتی ہے۔ ذاتی طور پر بہتر ہے؛ اگر یہ کام نہیں کرتا ہے تو وہ صالحین اور پھر حکام کی مدد چاہتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17558} ایک حد تک منع کرنا سخت کلامی ہے، جب نرمی ناکام ہو جائے اور استقامت اور استہزا ظاہر ہو۔ سورۃ الانبیاء ⁦(بذریعہ سورہ)⁩ میں ابراہیم کے الفاظ کا حوالہ دیتے ہوئے، مقصد ظالم کی واپسی ہونا چاہیے، نصیحت کرنے والے کی اپنی فتح نہیں۔ نصیحت کرنے والے کو آیات، احادیث اور قصوں سے کیا استعمال کرنا چاہیے: چار قسمیں، یعنی وہ آیات جو گنہگاروں کو تنبیہ کرتی ہیں، انبیاء اور نیک بزرگوں کے قصے، وہ تعلیم جو اس دنیا میں سزائے موت کی توقع ہے، خاص طور پر سزاؤں کی توقع ہے۔ شراب، زنا، چوری، قتل اور غیبت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17558}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17559} شریعت کے دوسرے ابواب میں نصیحت: ⁦(الف)⁩ نافرمان بیوی کو نصیحت کرنا، سورہ النبویۃ کی آیت کے تحت۔ ⁦(ب)⁩ لعان کی نصیحت کرنا: مالکیہ اور شافعی قسم سے پہلے اور پانچویں قسم پر انہیں تنبیہ کرنے کا مشورہ دیتے ہیں، انہیں سورہ آل عمران کی آیت پڑھتے ہیں اور ان سے کہتے ہیں کہ رسول اللہ نے لعان والوں سے کیا کہا تھا۔ حنبلی مشورہ دیتے ہیں کہ امام چوتھی قسم کے بعد اور پانچویں سے پہلے مرد کا ہاتھ شوہر کے منہ پر اور عورت بیوی کے منہ پر رکھے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17559}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.17561} (c) بارش کی دعا سے پہلے نصیحت: اکثر فقہاء اس کی سفارش کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17561} (d) نماز گرہن کے بعد کی نصیحت: مالکیہ اس کی سفارش کرتے ہیں۔ احناف اور حنبلی کا خیال ہے کہ سورج گرہن کی نماز کا کوئی خطبہ نہیں ہے، شافعی دو خطبے تجویز کرتے ہیں۔ حاکم کو نصیحت کرنا: اس میں کوئی اختلاف نہیں کہ حاکم کو نیکی کی تلقین کی جائے اور برائی سے منع کیا جائے جب وہ عادل ہو۔ ظالم کے بارے میں فقہاء کا اختلاف ہے۔ حنفیہ، شافعی اور ایک حنبلی روایت نرم اور ہلکی نصیحت کی اجازت دیتی ہے۔ شافعی اور ابن الجوزی نے اس کے لیے سخت کلامی سے منع کیا ہے، جیسے کہ اسے ظالم کہنے سے، اگر اس سے فتنہ پیدا ہو جس کا نقصان دوسروں کو پہنچے، لیکن اس بات کی اجازت دیں کہ اگر نقصان تنہا نصیحت کرنے والے کو پہنچے، اس قول پر کہ سب سے بڑی جدوجہد ظالم حکمران کے سامنے انصاف کی بات ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17562} مالکی حکمران کو دنیا اور آخرت کے انجام سے نصیحت اور تنبیہ کو واجب سمجھتے ہیں۔ ابو عمر کہتے ہیں کہ یہ ان لوگوں پر سب سے زیادہ پابند ہے جو ان کے ساتھ ملتے ہیں اور انہیں نصیحت کر سکتے ہیں، اور مالک کہتے ہیں، جب سننے کی امید ہو۔ حنبلی کی ایک رپورٹ میں کہا گیا ہے کہ ظالم حکمران کی مذمت چھوڑ دینا بہتر ہے۔ احمد کے بارے میں کہا جاتا ہے کہ حاکم کا مقابلہ نہ کرو، کیونکہ اس کی تلوار کھینچی گئی ہے۔ جہاں ملامت کی اجازت ہے اسے نرمی سے کرنا چاہیے، سورہ طہ میں موسیٰ اور ہارون کے لیے خدا کے الفاظ کا حوالہ دیتے ہوئے باغیوں کو نصیحت کرنا: جب امام واپس آنے سے انکار کرنے والے باغیوں کو صحیح طریقہ بتانے کے لیے بھیجتا ہے تو مالکیہ اور حنبلی ان کو نصیحت کرنا اور لڑائی کی تنبیہ کرنا واجب سمجھتے ہیں، کیونکہ ان کا مقصد انہیں قتل کرنا نہیں ہے؛ اگر وہ لفظوں سے واپس آجائیں تو یہ لڑائی سے بہتر ہے اور اگر نہ لڑا جائے تو سورۃ الحجرات کی آیت ہے۔ احناف کا خیال ہے کہ اہل انصاف کو باغیوں کو انصاف کی طرف بلانا چاہیے، اس رپورٹ کا حوالہ دیتے ہوئے کہ علی نے ابن عباس کو حروریہ کے پاس ان سے بحث کرنے کے لیے بھیجا تھا۔ شافعی انہیں حوصلہ افزائی اور تنبیہ کے ساتھ نصیحت کرنے کا مشورہ دیتے ہیں۔ نصیحت سے کمانا: نصیحت کرنے والے کے لیے جائز نہیں ہے کہ وہ اپنے لیے سیشن میں سامعین سے کچھ مانگے، کیونکہ یہ علم سے دنیاوی نفع کمانا ہے۔ احناف اور حنبلی اسی کو مانتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17563} خواتین کا نصیحت کی مجلسوں میں شرکت: احناف اور شافعی فتنہ کے خوف سے جوان عورتوں کی حاضری کو ناپسند کرتے ہیں اور بڑی عمر کی عورتوں کو اجازت دیتے ہیں، عائشہ ا کی روایت ہے کہ بنی اسرائیل کی عورتوں کو مسجد حرام کیا گیا تھا۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17563}"
  id: "Dalam bahasa Arab, dakwah (wa'z) adalah bentuk peringatan yang disertai dengan intimidasi, dan mencakup nasihat serta pengingat akan konsekuensi. Dalam terminologi Islam, hal itu merujuk pada mengingatkan orang-orang tentang kebaikan dengan cara yang melembutkan hati. Nasihat (nasiha) adalah seruan kepada kebaikan dan larangan terhadap keburukan, dan keduanya memiliki tujuan yang sama yaitu menyeru kepada kebaikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17551} Hukumnya: Secara umum, hal itu dianjurkan. Al-Haskafi menyatakan bahwa berdakwah dari mimbar dan memberikan peringatan adalah praktik para nabi, dengan mengutip ayat Al-Quran dalam Surah Adh-Dhariyat sebagai bukti. Hal itu dapat diharamkan jika menimbulkan kesedihan dan menjadi bentuk ratapan, atau jika dilakukan demi kepemimpinan, keuntungan finansial, atau popularitas. Fatawa al-Hindiyya menyatakan bahwa tidak diperbolehkan bagi seorang pendakwah untuk meminta sesuatu kepada orang-orang dalam dakwahnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552} Pilar-pilar dakwah adalah: pendakwah, orang yang didakwahi, dan metode dakwah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552} Syarat-syarat seorang pendakwah: Ia harus bertanggung jawab secara hukum, waras, dewasa, adil, dan berpengetahuan dalam hadits, artinya ia harus mempelajari kitab-kitab hadits dan mengetahui riwayat-riwayatnya yang sahih dan lemah. Ia juga harus menjadi penafsir, mempelajari ayat-ayat Al-Quran yang jarang dan sulit. Dianjurkan agar ia fasih dan lembut, berbicara kepada orang-orang sesuai dengan pemahaman mereka, dan agar ia menyederhanakan, bukan mempersulit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17552}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553} Etika seorang pendakwah: Ia harus menghindari apa yang tampak salah, meskipun ia benar tentang hal itu, karena bahaya yang ditimbulkannya, seperti orang-orang yang keliru meyakini bahwa hal itu benar-benar diperbolehkan, terjerumus ke dalamnya dengan meremehkannya, memiliki pikiran buruk tentangnya, dan pembatalan riwayat, kesaksian, dan fatwanya. Jika perlu, ia harus mengklarifikasi bahwa hal itu tidak dilarang. Buku ini mengutip hadits Sahl ibn Sa'd tentang tindakan Nabi di mimbar, hadits Safiyyah tentang i'tikaf (penyendirian di masjid), dan Ali yang minum sambil berdiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17553}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554} Melarang orang yang tidak memenuhi syarat untuk berdakwah: Mazhab Syafi'i dan Hanbali melarang siapa pun yang berdakwah jika mereka tidak memenuhi syarat atau jika mereka berbohong, karena ada risiko disesatkan oleh mereka. Adapun seorang bid'ah, tidak diperbolehkan menghadiri pertemuan mereka kecuali untuk membantah mereka. Hal ini didukung oleh ayat dalam Surah Al-An'am. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554} Adab seorang pendakwah: Mendengarkan dengan saksama pendakwah dan tidak berbicara. Jika mereka tidak mendengarkan, pendakwah hendaknya meminta mereka untuk mendengarkan. Buku ini mengutip hadits Jarir, di mana Nabi, selama Haji Perpisahan, memerintahkan orang-orang untuk mendengarkan dengan saksama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17554}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17555} Mendengarkan penceramah: Para ulama mengatakan bahwa mendengarkan dengan saksama para ulama sangat penting bagi para pelajar. Nabi memerintahkan orang-orang untuk mendengarkan dengan saksama dalam khutbah Haji Perpisahan beliau. Sufyan al-Thawri mengatakan bahwa langkah pertama dalam memperoleh ilmu adalah mendengarkan, kemudian mendengarkan dengan saksama, kemudian menghafal, kemudian mengamalkannya, kemudian menyebarluaskannya. Di antara adab orang-orang yang mendengarkan khutbah adalah mereka harus menerima penceramah dengan hormat, menahan diri dari bermain atau mengobrol selama khutbah, dan menghindari mengajukan terlalu banyak pertanyaan pada setiap masalah. Jika suatu poin sangat berkaitan dengan topik dan cukup halus sehingga masyarakat umum tidak dapat memahaminya, pendengar hendaknya tetap diam dalam pertemuan dan bertanya secara pribadi atau menunggu sampai khutbah selesai. Gaya dan metodologi khutbah: Pertama, menggunakan bahasa yang jelas dan tidak ambigu yang menyampaikan makna yang dimaksud dan menghindari istilah-istilah yang tidak jelas, berdasarkan hadits Aisyah yang menyatakan bahwa ucapan Nabi jelas dan mudah dipahami oleh semua yang mendengarnya. Ibnu Allan juga menyebutkan tafsiran al-Sakhawi. Kedua, mengulang kata-kata diperbolehkan jika tidak dapat dipahami dengan cara lain, atau untuk penekanan, atau karena banyaknya pendengar, berdasarkan hadits Anas bahwa Nabi (shalawat dan salam kepadanya) akan mengulang sebuah kata tiga kali. Ketiga, perhatikan keadaan orang-orang tersebut, dan jangan berbicara kepada mereka tentang hal-hal yang tidak dapat dipahami oleh pikiran mereka atau hal-hal yang mungkin disalahartikan, berdasarkan perkataan Ali, \"Berbicaralah kepada orang-orang sesuai dengan pemahaman mereka,\" dan perkataan Ibnu Mas'ud, \"Janganlah kamu berbicara kepada orang-orang tentang sesuatu yang tidak dapat dipahami oleh pikiran mereka, agar tidak menimbulkan kebingungan bagi sebagian dari mereka.\" Keempat, moderasi dalam berdakwah, menghindari baik panjang yang membosankan maupun singkat yang kurang memadai, berdasarkan hadits Ammar tentang panjang shalat dan singkatnya khutbah sebagai bagian dari fiqih. Kelima, dianjurkan untuk berdakwah kepada orang-orang pada saat mereka reseptif, dan tidak berdakwah setiap hari agar tidak membuat mereka lelah. Hendaknya seseorang menyisihkan waktu khusus untuk berdakwah, seperti hari Kamis, berdasarkan praktik Ibnu Mas'ud. Keenam, mengetahui perbuatan tercela yang dilarang dan keadaan orang yang dinasihati: apakah ia melakukannya karena ketidaktahuan atau dengan sadar. Ia harus ditegur, dinasihati, dan diingatkan tentang Allah, jika ia melakukan perbuatan tercela dengan sengaja, atau tetap melakukannya setelah mengetahuinya, dengan penuh kasih sayang dan kelembutan, tanpa kekerasan. Menegur secara pribadi lebih baik daripada mempublikasikannya, sebagaimana diriwayatkan dari Umm al-Darda' al-Sughra. Cara melarang perbuatan tercela dalam teguran: pendakwah harus mengetahui perbuatan tercela dan keadaan orang yang ditegur, baik ia tidak tahu maupun dengan sengaja. Siapa pun yang dengan sengaja melakukan kesalahan, atau tetap melakukannya setelah menyadarinya, harus ditegur dan diingatkan tentang hukuman Allah. Riwayat tentang pembalasan ilahi dan contoh para pendahulu yang saleh harus disampaikan kepadanya dengan penuh kasih sayang dan tanpa kekerasan. Teguran secara pribadi lebih baik. Jika ini terbukti tidak efektif, maka harus meminta bantuan orang-orang saleh. Jika itu juga gagal, maka harus menghubungi pihak berwenang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Di antara tingkatan larangan adalah teguran dengan kata-kata keras ketika kelembutan terbukti tidak efektif dan kegigihan serta ejekan menjadi jelas. Tujuan orang yang menasihati adalah untuk membujuknya agar meninggalkan kesalahan, bukan untuk mencari kemenangan pribadi. Al-Quran mengutip perkataan Ibrahim dalam Surah Al-Anbiya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558} Apa yang harus digunakan dalam dakwah dari ayat-ayat, hadits, dan kisah-kisah, dan itu termasuk empat jenis: menyebutkan ayat-ayat yang menakutkan, kisah para nabi dan generasi awal, bahwa hukuman diharapkan di dunia ini untuk dosa, dan menyebutkan hukuman untuk dosa-dosa tertentu seperti minum alkohol, zina, pencurian, pembunuhan, dan ghibah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17558}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17559} Hukum tentang dakwah di bab-bab lain: (a) Menasihati istri jika ia durhaka, berdasarkan ayat dalam Surah An-Nisa, dan detailnya dalam bab tentang kedurhakaan. (b) Menasihati orang-orang yang saling mengutuk: Menurut mazhab Maliki dan Syafi'i, dianjurkan untuk menasihati mereka sebelum kutukan dan pada kali kelima, dengan membacakan ayat dari Surah Al Imran, dan memberitahukan kepada mereka apa yang dikatakan Nabi kepada orang-orang yang saling mengutuk. Menurut mazhab Hanbali, dianjurkan agar imam menasihati orang-orang yang saling mengutuk setelah kali keempat dan sebelum kali kelima, dan memerintahkan seseorang untuk menutup mulut orang yang saling mengutuk. (c) Nasihat sebelum salat memohon hujan: Mayoritas ahli fiqih menganggapnya dianjurkan. (d) Khutbah setelah salat gerhana: Mazhab Maliki menganjurkannya, sedangkan mazhab Hanafi dan Hanbali tidak memiliki khutbah untuk salat gerhana, dan mazhab Syafi'i menganjurkan dua khutbah. Khutbah kepada penguasa: Tidak ada perbedaan pendapat mengenai kebolehan berkhutbah kepada penguasa, menyeru kepada kebaikan dan melarang kejahatan, jika ia adil. Namun, mereka berbeda pendapat mengenai berkhutbah kepada penguasa yang tidak adil. Mazhab Hanafi, Syafi'i, dan Hanbali (menurut satu riwayat) memperbolehkan berkhutbah kepadanya dengan lembut dan ramah. Mazhab Syafi'i dan Ibnu al-Jawzi melarang berbicara kasar kepadanya jika ia menimbulkan perselisihan yang akan menimbulkan kerugian yang meluas, tetapi mereka memperbolehkannya jika kerugian tersebut hanya akan menimpa sang pendakwah. Mereka mengutip hadits, \"Bentuk jihad terbesar adalah mengucapkan kata-kata kebenaran di hadapan penguasa yang zalim.\" Mazhab Maliki menganggap wajib untuk menasihati, memperingatkan, dan mengintimidasi penguasa, serta memperingatkannya tentang konsekuensinya. Abu Umar berkata bahwa ini wajib bagi siapa pun yang duduk bersamanya dan mampu memberikan nasihat. Malik berkata bahwa ini wajib jika ada harapan bahwa ia akan didengarkan. Menurut sebuah riwayat dari mazhab Hanbali, menahan diri dari mengecam penguasa yang zalim lebih baik. Diriwayatkan dari Ahmad bahwa seseorang tidak boleh menghadapi penguasa, karena pedangnya telah terhunus. Jika kecaman diperlukan, maka harus dilakukan melalui penjelasan dan nasihat yang lembut, sebagaimana firman Allah kepada Musa dan Harun dalam Surah Ta-Ha. Mengenai menasihati pemberontak: Jika Imam mengutus seseorang untuk menjelaskan kebenaran kepada mereka, dan mereka menolak untuk kembali, mazhab Maliki dan Hanbali menganggap wajib untuk menasihati dan mengintimidasi mereka dengan ancaman perang, karena tujuannya adalah untuk menahan mereka, bukan membunuh mereka. Jika nasihat lisan memungkinkan, itu lebih baik. Jika mereka kembali, maka semuanya baik-baik saja; jika tidak, mereka harus diperangi, sebagaimana firman Allah dalam Surah Al-Hujurat. Mazhab Hanafi meyakini bahwa orang-orang yang menegakkan keadilan harus menyeru mereka kepada keadilan, dengan mengutip sebagai bukti riwayat tentang Ali yang mengutus Ibnu Abbas kepada kaum Kharijites. Namun, mazhab Syafi'i menganggap lebih baik untuk berdakwah kepada mereka, menggunakan dorongan dan peringatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563} Mendapatkan keuntungan dari dakwah: Tidak diperbolehkan bagi seorang pendakwah untuk meminta sesuatu untuk dirinya sendiri selama dakwah, karena ini merupakan memperoleh keuntungan duniawi melalui ilmu pengetahuan. Ini adalah pandangan mazhab Hanafi dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563} Wanita menghadiri khutbah: Mazhab Hanafi dan Syafi'i tidak menganjurkan wanita muda untuk hadir karena takut tergoda, tetapi memperbolehkan wanita yang lebih tua. Kitab ini mengutip hadits Aisyah sebagai bukti mengenai larangan wanita Bani Israel untuk menghadiri masjid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17563}"
