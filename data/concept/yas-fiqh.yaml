label:
  ar: "يَأس"
  en: "Yas (despair, fiqh)"
  es: "Yas (desesperación, fiqh)"
  fr: "Yas (désespoir, fiqh)"
summary:
  ar: "اليأس لغة القنوط وقطع الأمل، وفي الاصطلاح انقطاع الرجاء. وأحكامه في الفقه: النهي عن اليأس من رحمة الله، وكونه سبباً للتيمم عند فقد الماء، وتوبة اليائس الذي شاهد دلائل الموت، وسن اليأس من الحيض وعدة اليائسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17965}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17967}"
  en: "Yas is despair, the cutting of hope; technically it is the end of hope. Its rulings: despair of God's mercy is forbidden, despair of water is a cause for tayammum, the repentance of one who sees the signs of death is disputed, and the age of despair from menstruation fixes the waiting period of a woman past it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17965}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17967}"
  ur: "یأس کے لغوی معنی قنوط اور امید کا ٹوٹنا ہیں۔ اس کے احکام میں رحمتِ الٰہی سے یأس کی ممانعت، پانی سے یأس کا تیمم کا سبب ہونا، اور توبۂ یائس کا اختلاف شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17965}"
  es: "Yas significa desesperación, la pérdida de la esperanza; técnicamente, es el fin de la esperanza. Sus preceptos son: la desesperación por la misericordia de Dios está prohibida, la desesperación por la falta de agua es causa de tayammum, el arrepentimiento de quien ve los signos de la muerte es cuestionable, y la edad de la desesperación por la menstruación fija el período de espera de una mujer después de la menstruación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17965}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17967}"
  fr: "Yas représente le désespoir, la perte de l'espoir; en d'autres termes, c'est la fin de l'espoir. Ses règles: le désespoir en la miséricorde divine est interdit, le manque d'eau est une cause de tayammum, le repentir de celui qui voit les signes de la mort est contesté, et l'âge du désespoir lié aux menstruations fixe la période d'attente d'une femme après celles-ci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17965}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17967}"
