label:
  ar: "يَأس"
  en: "Yas (despair, fiqh)"
summary:
  ar: "اليأس لغة القنوط وقطع الأمل، وفي الاصطلاح انقطاع الرجاء. وأحكامه في الفقه: النهي عن اليأس من رحمة الله، وكونه سبباً للتيمم عند فقد الماء، وتوبة اليائس الذي شاهد دلائل الموت، وسن اليأس من الحيض وعدة اليائسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17965}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17967}"
  en: "Yas is despair, the cutting of hope; technically it is the end of hope. Its rulings: despair of God's mercy is forbidden, despair of water is a cause for tayammum, the repentance of one who sees the signs of death is disputed, and the age of despair from menstruation fixes the waiting period of a woman past it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17965}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17967}"
  ur: "یأس کے لغوی معنی قنوط اور امید کا ٹوٹنا ہیں۔ اس کے احکام میں رحمتِ الٰہی سے یأس کی ممانعت، پانی سے یأس کا تیمم کا سبب ہونا، اور توبۂ یائس کا اختلاف شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17965}"
