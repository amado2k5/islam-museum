id: concept/shiar-distinctive-sign
class: concept
kind: legal
label:
  ar: "الشِّعار"
  en: "Shi'ar (the distinctive sign: the inner garment, a battle cry, and dress that sets a group apart)"
summary:
  ar: "الشعار لغة الثوب الذي يلي الجسد، والعلامة الظاهرة المميزة، وأيضا نداء الحرب الذي يعرف به الجند بعضهم بعضا. ويحكم جمهور الفقهاء بكفر من تشبه بغير المسلمين في لباس يميزهم إن فعله على الميل إليهم، إلا لضرورة، ويكره لباس الشهرة الذي يخالف العادة، ويحرم عند أكثرهم استعمال آلات الشرب كالعود والمزمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073}"
  en: "Shi'ar in language is the garment that touches the body, under the outer cloak; in the jurists' usage it is the clear distinctive sign. As a war cry it is the call by which fighters know one another. Most jurists hold that imitating non-Muslims in a dress that marks them out is a ground for judging the imitator an unbeliever in outward legal terms, when done in Muslim lands out of inclination to them, unless necessity requires it. Dress that is conspicuously against custom is disliked; most jurists hold that instruments of drinking gatherings, such as the lute and the pipe, are forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073}"
