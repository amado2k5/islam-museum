id: concept/shiar-distinctive-sign
class: concept
kind: legal
label:
  ar: "الشِّعار"
  en: "Shi'ar (the distinctive sign: the inner garment, a battle cry, and dress that sets a group apart)"
  es: "Shi'ar (el signo distintivo: la prenda interior, un grito de guerra y la vestimenta que distingue a un grupo)"
  fr: "Shi'ar (le signe distinctif: le vêtement intérieur, un cri de guerre et une tenue qui distingue un groupe)"
summary:
  ar: "الشعار لغة الثوب الذي يلي الجسد، والعلامة الظاهرة المميزة، وأيضا نداء الحرب الذي يعرف به الجند بعضهم بعضا. ويحكم جمهور الفقهاء بكفر من تشبه بغير المسلمين في لباس يميزهم إن فعله على الميل إليهم، إلا لضرورة، ويكره لباس الشهرة الذي يخالف العادة، ويحرم عند أكثرهم استعمال آلات الشرب كالعود والمزمار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073}"
  en: "Shi'ar in language is the garment that touches the body, under the outer cloak; in the jurists' usage it is the clear distinctive sign. As a war cry it is the call by which fighters know one another. Most jurists hold that imitating non-Muslims in a dress that marks them out is a ground for judging the imitator an unbeliever in outward legal terms, when done in Muslim lands out of inclination to them, unless necessity requires it. Dress that is conspicuously against custom is disliked; most jurists hold that instruments of drinking gatherings, such as the lute and the pipe, are forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073}"
  es: "En el lenguaje, el shi'ar es la prenda que toca el cuerpo, debajo del manto exterior; en el uso de los juristas, es el signo distintivo claro. Como grito de guerra, es la llamada con la que los combatientes se reconocen entre sí. La mayoría de los juristas sostienen que imitar a los no musulmanes con una vestimenta que los identifica es motivo para juzgar al imitador como infiel en términos legales externos, cuando se hace en tierras musulmanas por inclinación hacia ellas, a menos que la necesidad lo exija. La vestimenta que es manifiestamente contraria a la costumbre es mal vista; la mayoría de los juristas sostienen que los instrumentos de reunión para beber, como el laúd y la flauta, están prohibidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10071} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073}"
  fr: "Le terme « shi'ar » désigne, dans le langage courant, le vêtement porté sous le manteau; pour les juristes, il s'agit d'un signe distinctif clair. En tant que cri de guerre, c'est l'appel par lequel les combattants se reconnaissent. La plupart des juristes estiment qu'imiter les non-musulmans en portant un vêtement qui les distingue est un motif de considérer celui qui imite comme un incroyant, selon les critères juridiques extérieurs, lorsque cela se produit en terre musulmane par simple inclination, sauf nécessité absolue. Les vêtements manifestement contraires aux coutumes sont désapprouvés; la plupart des juristes considèrent que les instruments utilisés lors des réunions de beuverie, tels que le luth et la pipe, sont interdits."
