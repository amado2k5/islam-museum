label: { ar: "إجارة", en: "Lease and hire (ijara)", es: "Arrendamiento y alquiler (ijara)", fr: "Location et bail (ijara)", ur: "لیز اور کرایہ ⁦(اجرا)⁩", tr: "kira", id: "sewa" }
summary:
  ar: "الإجارة عقد معاوضة على منافع معلومة بعوض، وتسمى عند الفقهاء في منافع الأراضي والدور والسفن والحيوان كراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} والأصل فيها عند الجمهور اللزوم، ولا تُفسخ إلا بما تنفسخ به العقود اللازمة كظهور العيب أو ذهاب محل المنفعة، وأجاز أبو حنيفة فسخها للعذر الطارئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} وتفترق عن الاستصناع في أن العين في الإجارة من المستأجر والعمل من الأجير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} والإجارة مشروعة بالكتاب والسنة والإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} وتنعقد بأي لفظ يدل عليها، وقد توسع الحنابلة فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1528} ويعتبر في العاقدين العقل والتراضي وولاية إنشاء العقد، ويكون المعقود عليه منفعة العين المؤجرة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1532}"
  en: "Ijara is an exchange contract on known benefits for a consideration. Jurists call the lease of land, houses, ships and animals kira' (hire); ijara is used for the benefit of persons and for things that cannot be transferred apart from ships and animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} The majority hold that the contract is binding and may be dissolved only on grounds that dissolve other binding contracts, such as a discovered defect or the loss of the place of benefit; Abu Hanifa allows the tenant to cancel for a supervening excuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} Unlike istisna' (commissioned manufacture), in a lease the object is provided by the lessee and the labour by the worker. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} The lease is lawful by the Qur'an, the Sunna and consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} It is formed by any wording that expresses it, and the Hanbalis allow a wide range of words. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1528} The parties must have reason, consent and capacity to contract; the object of a lease, for the Hanafis, is the benefit of the thing let. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1532}"
  es: "Ijara es un contrato de intercambio sobre beneficios conocidos a cambio de una contraprestación. Los juristas llaman kira' (alquiler) al arrendamiento de tierras, casas, barcos y animales; ijara se utiliza para el beneficio de personas y para cosas que no pueden transferirse, excepto barcos y animales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} La mayoría sostiene que el contrato es vinculante y puede disolverse solo por causas que disuelvan otros contratos vinculantes, como un defecto descubierto o la pérdida del lugar de beneficio; Abu Hanifa permite al arrendatario rescindir por una causa sobrevenida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} A diferencia de istisna' (fabricación por encargo), en un arrendamiento el objeto es proporcionado por el arrendatario y la mano de obra por el trabajador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} El arrendamiento es lícito según el Corán, la Sunna y el consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} Se forma mediante cualquier redacción que lo exprese, y los Hanbalis permiten una amplia gama de palabras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1528} Las partes deben tener razón, consentimiento y capacidad para contratar; el objeto de un arrendamiento, para los Hanafi, es el beneficio de la cosa arrendada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1532}"
  fr: "L'ijara est un contrat d'échange portant sur des avantages connus, moyennant une contrepartie. Les juristes désignent par le terme « kira' » (location) la location de terres, de maisons, de navires et d'animaux; l'ijara est utilisée au profit des personnes et pour les biens non transférables, à l'exception des navires et des animaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} La majorité considère que le contrat est contraignant et ne peut être résilié que pour les mêmes motifs que ceux qui entraînent la résiliation d'autres contrats contraignants, tels qu'un vice découvert ou la perte du lieu d'obtention du bénéfice; Abu Hanifa autorise le locataire à résilier le contrat pour un motif imprévu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} Contrairement à l'istisna' (fabrication à façon), dans le cadre d'un bail, l'objet est fourni par le preneur et la main-d'œuvre par le travailleur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} Le bail est licite selon le Coran, la Sunna et le consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} Il est formé par toute formulation qui l'exprime, et les Hanbalites admettent une grande variété de termes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1528} Les parties doivent avoir la raison, le consentement et la capacité de contracter; pour les Hanafites, l'objet d'un bail est le bénéfice du bien loué. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1532}"
  ur: "Ijara غور کے لیے معلوم فوائد پر ایک تبادلہ معاہدہ ہے۔ فقہا زمین، مکانات، بحری جہازوں اور جانوروں کے کرایہ کو کرائے کہتے ہیں۔ اجارہ لوگوں کے فائدے کے لیے اور ان چیزوں کے لیے استعمال کیا جاتا ہے جن کو جہازوں اور جانوروں کے علاوہ منتقل نہیں کیا جا سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1526} اکثریت کا خیال ہے کہ معاہدہ پابند ہے اور اسے صرف اس بنیاد پر تحلیل کیا جاسکتا ہے کہ دوسرے پابند معاہدوں کو تحلیل کیا جائے، جیسے دریافت شدہ نقص یا فائدے کی جگہ کا نقصان؛ ابوحنیفہ کرایہ دار کو نگرانی کے عذر کی وجہ سے منسوخ کرنے کی اجازت دیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1526} استسنا ⁦(کمشنڈ مینوفیکچرنگ)⁩ کے برعکس، اجارہ میں چیز لیز پر فراہم کی جاتی ہے اور مزدور مزدور کی طرف سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1527} کرایہ قرآن، سنت اور اجماع سے حلال ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1527} یہ کسی بھی ایسے لفظ سے بنتا ہے جو اس کا اظہار کرتا ہے، اور حنبلی الفاظ کی وسیع رینج کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1528} فریقین کے پاس دلیل، رضامندی اور معاہدہ کرنے کی صلاحیت ہونی چاہیے۔ اجارہ کی چیز، احناف کے نزدیک، اجارہ کا فائدہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1531}"
  tr: "İrajah, karşılığında bilinen faydalar karşılığında yapılan bir takas sözleşmesidir ve hukukçulara göre toprak, ev, gemi ve hayvan haklarıyla ilgili olarak buna kiralama denir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1526} Varsayılan durum, çoğunluk tarafından bağlayıcı olmasıdır ve ancak gerekli sözleşmeleri iptal eden şeylerle, örneğin bir kusurun ortaya çıkması veya fayda yerinin kaybı ile geçersiz sayılır. Abu Hanifa beklenmedik bir bahane nedeniyle iptalini kabul etti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1526} İstisna'dan farklıdır; kira sözleşmesindeki belirli madde kiracıdan, iş ise çalışandan gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1527} İcara Kur'an, Sünnet ve uzlaşma ile yasalaştırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1527} ve bunu belirten herhangi bir ifadeyle sözleşme yapılmıştır, Hanbaliler ise bunu detaylandırmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1528} Taraflar arasında neden, karşılıklı anlaşma ve sözleşmeyi kurma yetkisi dikkate alınır ve sözleşmeli taraf, Hanefilere göre kiralanan mülkün faydası olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1532}"
  id: "Ijarah adalah kontrak pertukaran untuk manfaat yang diketahui sebagai imbalan, dan menurut ahli hukum mengenai manfaat tanah, rumah, kapal, dan hewan, ini disebut sewa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1526} Kekurangan ini adalah bahwa kontrak ini mengikat menurut mayoritas, dan hanya dibatalkan oleh apa yang membatalkan kontrak yang diperlukan, seperti munculnya cacat atau hilangnya tempat manfaat. Abu Hanifa mengizinkan pembatalan karena alasan yang tak terduga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1526} Ini berbeda dari istisna' karena item spesifik dalam sewa berasal dari penyewa dan pekerjaan dari karyawan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1527} Ijarah diatur oleh Al-Qur'an, Sunnah, dan konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1527} dan dikontrak dengan kata-kata apa pun yang menunjukkannya, dan keluarga Hanbal telah menjelaskan lebih lanjut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1528} Di antara para pihak yang berkontrak, alasan, kesepakatan bersama, dan otoritas untuk menetapkan kontrak dipertimbangkan, dan pihak yang dikontrak dianggap sebagai manfaat dari properti sewa menurut Hafi. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1532}"
