id: concept/ijara
class: concept
kind: legal
label: { ar: "إجارة", en: "Lease and hire (ijara)" }
summary:
  ar: "الإجارة عقد معاوضة على منافع معلومة بعوض، وتسمى عند الفقهاء في منافع الأراضي والدور والسفن والحيوان كراء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} والأصل فيها عند الجمهور اللزوم، ولا تُفسخ إلا بما تنفسخ به العقود اللازمة كظهور العيب أو ذهاب محل المنفعة، وأجاز أبو حنيفة فسخها للعذر الطارئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} وتفترق عن الاستصناع في أن العين في الإجارة من المستأجر والعمل من الأجير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} والإجارة مشروعة بالكتاب والسنة والإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} وتنعقد بأي لفظ يدل عليها، وقد توسع الحنابلة فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1528} ويعتبر في العاقدين العقل والتراضي وولاية إنشاء العقد، ويكون المعقود عليه منفعة العين المؤجرة عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1532}"
  en: "Ijara is an exchange contract on known benefits for a consideration. Jurists call the lease of land, houses, ships and animals kira' (hire); ijara is used for the benefit of persons and for things that cannot be transferred apart from ships and animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} The majority hold that the contract is binding and may be dissolved only on grounds that dissolve other binding contracts, such as a discovered defect or the loss of the place of benefit; Abu Hanifa allows the tenant to cancel for a supervening excuse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1526} Unlike istisna' (commissioned manufacture), in a lease the object is provided by the lessee and the labour by the worker. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} The lease is lawful by the Qur'an, the Sunna and consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1527} It is formed by any wording that expresses it, and the Hanbalis allow a wide range of words. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1528} The parties must have reason, consent and capacity to contract; the object of a lease, for the Hanafis, is the benefit of the thing let. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1532}"
