summary:
  ar: "عروق الصباغين في الكتاب دواء معروف حار يابس إلى الثانية، فيه جلاء قوي، ينفع مضغه من وجع الأسنان وعصارته في تحديد البصر وجلاء ما قدام الحدقة، وينفع من اليرقان الكائن من السدد {cite:canon-ibn-sina-print-v1 p.615}"
  en: "Uruq al-sabbaghin is in the book a well-known drug, hot and dry toward the second degree, with a strong cleansing power; chewing it benefits toothache, its juice sharpens the sight and clears what lies before the pupil, and it benefits jaundice arising from obstructions {cite:canon-ibn-sina-print-v1 p.615}"
  ur: "عروق الصباغین کتاب میں ایک معروف دوا ہے، دوسرے درجے تک گرم خشک، اس میں قوی جلا ہے؛ اسے چبانا دانت کے درد میں فائدہ دیتا ہے، اس کا رس نظر کو تیز کرتا اور پتلی کے آگے کی چیز کو صاف کرتا ہے، اور رکاوٹوں سے ہونے والے یرقان میں فائدہ دیتا ہے {cite:canon-ibn-sina-print-v1 p.615}۔"
  es: "En el libro, Uruq al-sabbaghin es una droga bien conocida, caliente y seca hacia el segundo grado, con un fuerte poder depurativo; masticarla alivia el dolor de muelas, su jugo agudiza la vista y aclara lo que se encuentra frente a la pupila, y alivia la ictericia causada por obstrucciones {cite:canon-ibn-sina-print-v1 p.615}."
  fr: "L'Uruq al-sabbaghin est mentionné dans le livre comme une plante médicinale bien connue, chaude et sèche au deuxième degré, dotée d'un puissant pouvoir purifiant; la mâcher soulage les maux de dents, son jus aiguise la vue et clarifie le champ visuel, et elle est bénéfique en cas de jaunisse due à une obstruction {cite:canon-ibn-sina-print-v1 p.615}"
  tr: "Kitaptaki boyacı damarları, ikinci dereceye kadar iyi bilinen sıcak ve kuru bir ilaçtır ve güçlü bir boşluk sunar. Onları çiğnemek, diş ağrısını ve görmeyi belirlemedeki suyunu hafifletmeye ve göz bebeğinin önündekini netleştirmeye yardımcı olur ve boşlukta bulunan sarılık için faydalıdır {cite:canon-ibn-sina-print-v1 s.615}"
  id: "Vena para pewarna dalam buku ini dikenal sebagai obat panas dan kering tingkat dua, dengan jarak yang kuat. Mengunyahnya membantu meredakan sakit gigi dan cairannya dalam menentukan penglihatan dan membersihkan apa yang ada di depan pupil, serta bermanfaat untuk penyakit kuning yang ditemukan di rongga {cite:canon-ibn-sina-print-v1 hlm.615}"
