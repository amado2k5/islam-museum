summary:
  ar: "عروق الصباغين في الكتاب دواء معروف حار يابس إلى الثانية، فيه جلاء قوي، ينفع مضغه من وجع الأسنان وعصارته في تحديد البصر وجلاء ما قدام الحدقة، وينفع من اليرقان الكائن من السدد {cite:canon-ibn-sina-print-v1 p.615}"
  en: "Uruq al-sabbaghin is in the book a well-known drug, hot and dry toward the second degree, with a strong cleansing power; chewing it benefits toothache, its juice sharpens the sight and clears what lies before the pupil, and it benefits jaundice arising from obstructions {cite:canon-ibn-sina-print-v1 p.615}"
  ur: "عروق الصباغین کتاب میں ایک معروف دوا ہے، دوسرے درجے تک گرم خشک، اس میں قوی جلا ہے؛ اسے چبانا دانت کے درد میں فائدہ دیتا ہے، اس کا رس نظر کو تیز کرتا اور پتلی کے آگے کی چیز کو صاف کرتا ہے، اور رکاوٹوں سے ہونے والے یرقان میں فائدہ دیتا ہے {cite:canon-ibn-sina-print-v1 p.615}۔"
