summary:
  ar: "يبين ابن سينا أن لكل إنسان رياضة بحسبه، وأن الرياضات اللينة كالترجيح موافقة لمن أضعفتهم الحميات والناقهين ولمن أضعفهم شرب الخربق ولمن به مرض في الحجاب، وأن الترجيح على السرير أوفق لمن به شطر الغب والحميات المركبة والبلغمية والاستسقاء والنقرس وأمراض الكلى {cite:canon-ibn-sina-print-v1 p.223}."
  en: "Ibn Sina says each person has an exercise to suit him, that the gentle kinds such as swinging suit those weakened by fevers, convalescents, those weakened by hellebore and those with a disease of the diaphragm, and that swinging on a bed suits half-tertian and mixed or phlegmatic fevers, dropsy, gout and kidney diseases {cite:canon-ibn-sina-print-v1 p.223}."
