label: { ar: "الرياضة اللينة للضعفاء والمرضى عند ابن سينا", en: "Gentle exercise for the weak and the sick in the Canon", ur: "قانون میں کمزوروں اور بیماروں کے لیے نرم ورزش", es: "Ejercicio suave para los débiles y los enfermos en el Canon" }
summary:
  ar: "يبين ابن سينا أن لكل إنسان رياضة بحسبه، وأن الرياضات اللينة كالترجيح موافقة لمن أضعفتهم الحميات والناقهين ولمن أضعفهم شرب الخربق ولمن به مرض في الحجاب، وأن الترجيح على السرير أوفق لمن به شطر الغب والحميات المركبة والبلغمية والاستسقاء والنقرس وأمراض الكلى {cite:canon-ibn-sina-print-v1 p.223}."
  en: "Ibn Sina says each person has an exercise to suit him, that the gentle kinds such as swinging suit those weakened by fevers, convalescents, those weakened by hellebore and those with a disease of the diaphragm, and that swinging on a bed suits half-tertian and mixed or phlegmatic fevers, dropsy, gout and kidney diseases {cite:canon-ibn-sina-print-v1 p.223}."
  es: "Ibn Sina dice que cada persona tiene un ejercicio que le conviene, que los tipos suaves como el balanceo son adecuados para los debilitados por la fiebre, los convalecientes, los debilitados por el eléboro y los que tienen una enfermedad del diafragma, y que el balanceo en una cama es adecuado para las fiebres semitercianas y mixtas o flemáticas, la hidropesía, la gota y las enfermedades renales {cite:canon-ibn-sina-print-v1 p.223}."
