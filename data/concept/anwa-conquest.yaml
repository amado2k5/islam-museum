id: concept/anwa-conquest
class: concept
kind: legal
label:
  ar: "العَنْوَة"
  en: "Land taken by force in war ('anwa) and its legal status"
  ur: "عنوہ (طاقت سے فتح شدہ زمین)"
summary:
  ar: "العنوة في اللغة الغلبة والقهر، يقال أخذته عنوة أي قهراً، وفي اصطلاح الفقهاء ما يؤخذ من الأرض في الحرب بالقهر والغلبة، ويقابله ما فتح صلحاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902}. واتفق الفقهاء على أن ما يستولي عليه المسلمون من المنقول يدخل في جملة الغنائم، واختلفوا في الأرض المفتوحة عنوة: فقال الحنفية إن الإمام مخير بين قسمتها أو إقرار أهلها عليها بالخراج، فتصير أرض خراج لا ملك للغانمين فيها، وقال المالكية في المشهور تصير وقفاً على المسلمين، وقال الشافعية يخمس ثم يقسم الباقي على الغانمين إلا أن يطيبوا نفساً بالوقف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}. ولتفصيل ذلك مواطن أخرى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}."
  en: "In the lexicon, 'anwa is overpowering and seizure by force; as a term among the jurists it is what is taken from land in war by force and conquest, as against land taken by treaty {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902}. The jurists agree that movables taken in war are part of the spoils; they differ on land taken by force. The Hanafis hold that the imam chooses between dividing it and leaving its people on it for a land tax (kharaj), so that the army does not own it. The Malikis hold, in the preferred view, that it becomes an endowment for the Muslims. The Shafi'is hold that a fifth goes to the purposes named in the Qur'anic verse on spoils and the rest is divided among the fighters, unless they give it up for the public interest {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}. The details are treated under «ghanima» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}."
