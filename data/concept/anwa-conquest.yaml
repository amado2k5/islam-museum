label:
  ar: "العَنْوَة"
  en: "Land taken by force in war ('anwa) and its legal status"
  fr: "Terres prises de force à la guerre ('anwa) et leur statut juridique"
  ur: "عنوہ ⁦(طاقت سے فتح شدہ زمین)⁩"
  es: "Tierras tomadas por la fuerza en la guerra ('anwa) y su estatus legal"
summary:
  ar: "العنوة في اللغة الغلبة والقهر، يقال أخذته عنوة أي قهراً، وفي اصطلاح الفقهاء ما يؤخذ من الأرض في الحرب بالقهر والغلبة، ويقابله ما فتح صلحاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902}. واتفق الفقهاء على أن ما يستولي عليه المسلمون من المنقول يدخل في جملة الغنائم، واختلفوا في الأرض المفتوحة عنوة: فقال الحنفية إن الإمام مخير بين قسمتها أو إقرار أهلها عليها بالخراج، فتصير أرض خراج لا ملك للغانمين فيها، وقال المالكية في المشهور تصير وقفاً على المسلمين، وقال الشافعية يخمس ثم يقسم الباقي على الغانمين إلا أن يطيبوا نفساً بالوقف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}. ولتفصيل ذلك مواطن أخرى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}."
  en: "In the lexicon, 'anwa is overpowering and seizure by force; as a term among the jurists it is what is taken from land in war by force and conquest, as against land taken by treaty {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902}. The jurists agree that movables taken in war are part of the spoils; they differ on land taken by force. The Hanafis hold that the imam chooses between dividing it and leaving its people on it for a land tax (kharaj), so that the army does not own it. The Malikis hold, in the preferred view, that it becomes an endowment for the Muslims. The Shafi'is hold that a fifth goes to the purposes named in the Qur'anic verse on spoils and the rest is divided among the fighters, unless they give it up for the public interest {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}. The details are treated under «ghanima» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}."
  fr: "Dans le lexique, 'anwa désigne le fait de soumettre et de saisir par la force. Chez les juristes, le terme désigne les terres prises par la force et la conquête pendant la guerre, par opposition aux terres acquises par traité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902}. Les juristes s’accordent à inclure dans le butin les biens meubles pris à la guerre, mais divergent au sujet des terres prises de force. Selon les hanafites, l’imam choisit de les partager ou de les laisser à leurs habitants contre un impôt foncier (kharaj), auquel cas l’armée n’en devient pas propriétaire. Selon l’avis privilégié des malékites, elles deviennent un bien de mainmorte au bénéfice des musulmans. Les chaféites attribuent un cinquième aux usages désignés dans le verset coranique sur le butin et répartissent le reste entre les combattants, sauf si ceux-ci y renoncent dans l’intérêt général {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}. Le détail est traité à l’entrée « ghanima » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}."
  es: "En el léxico, 'anwa significa dominación y apropiación por la fuerza; entre los juristas, se refiere a lo que se toma de la tierra en la guerra mediante la fuerza y la conquista, en contraposición a la tierra tomada por tratado {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902}. Los juristas coinciden en que los bienes muebles tomados en la guerra forman parte del botín; difieren en cuanto a la tierra tomada por la fuerza. Los hanafíes sostienen que el imán elige entre dividirla y dejar a sus habitantes en ella a cambio de un impuesto territorial (kharaj), de modo que el ejército no sea su propietario. Los malikíes, en su opinión preferida, sostienen que se convierte en una herencia para los musulmanes. Los shafi'ís sostienen que una quinta parte se destina a los fines mencionados en el versículo coránico sobre el botín y el resto se divide entre los combatientes, a menos que lo cedan por el interés público {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}. Los detalles se tratan en el apartado «ghanima» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903}."
