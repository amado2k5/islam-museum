id: concept/jumada-months
class: concept
kind: legal
label:
  ar: "شهرا جمادى الأولى وجمادى الآخرة"
  en: "The two Jumada months (Jumada al-Ula and Jumada al-Akhira)"
summary:
  ar: "جمادى الأولى خامس شهور السنة وجمادى الآخرة سادسها، سميا جمادى لوقوعهما في زمن الجمود والبرد حين سميت الشهور. ولم يخص الشرع لهما عبادة، ووقعت فيهما من السيرة غزوات وسرايا. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "Jumada al-Ula is the fifth month and Jumada al-Akhira the sixth, named for the season of freezing cold in which they fell when the months were named. The law prescribes no special worship in them, and the seerah records campaigns and expeditions in them. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  ur: "جمادی الاولیٰ پانچواں اور جمادی الآخرہ چھٹا مہینہ ہے، انہیں اس لیے جمادیٰ کہا گیا کہ جب نام رکھے گئے تو وہ ٹھٹھرنے اور سردی کے زمانے میں آتے تھے۔ شریعت نے ان کے لیے کوئی خاص عبادت مقرر نہیں کی، اور سیرت میں انہی میں بعض غزوات اور سریے درج ہیں۔ {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
