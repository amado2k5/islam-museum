id: concept/jumada-months
class: concept
kind: legal
label:
  ar: "شهرا جمادى الأولى وجمادى الآخرة"
  en: "The two Jumada months (Jumada al-Ula and Jumada al-Akhira)"
  es: "Los dos meses Jumada (Jumada al-Ula y Jumada al-Akhira)"
  fr: "Les deux mois Jumada (Jumada al-Ula et Jumada al-Akhira)"
  ur: "جمعۃ المبارک کے دو مہینے ⁦(جمعہ الاعلیٰ اور جمعۃ الآخرہ)⁩"
  tr: "Cumede el-Avvel ve Cumede el-Akhirah ayları"
  id: "Bulan-bulan Jumada al-Awwal dan Jumada al-Akhirah"
summary:
  ar: "جمادى الأولى خامس شهور السنة وجمادى الآخرة سادسها، سميا جمادى لوقوعهما في زمن الجمود والبرد حين سميت الشهور. ولم يخص الشرع لهما عبادة، ووقعت فيهما من السيرة غزوات وسرايا. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "Jumada al-Ula is the fifth month and Jumada al-Akhira the sixth, named for the season of freezing cold in which they fell when the months were named. The law prescribes no special worship in them, and the seerah records campaigns and expeditions in them. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  ur: "جمادی الاولیٰ پانچواں اور جمادی الآخرہ چھٹا مہینہ ہے، انہیں اس لیے جمادیٰ کہا گیا کہ جب نام رکھے گئے تو وہ ٹھٹھرنے اور سردی کے زمانے میں آتے تھے۔ شریعت نے ان کے لیے کوئی خاص عبادت مقرر نہیں کی، اور سیرت میں انہی میں بعض غزوات اور سریے درج ہیں۔ {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  es: "Jumada al-Ula es el quinto mes y Jumada al-Akhira el sexto, llamados así por la estación de frío intenso en la que coincidieron con la época en que se les dio nombre. La ley no prescribe ningún culto especial en ellos, y la sirah registra campañas y expediciones ocurridas durante estos meses. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  fr: "Jumada al-Ula est le cinquième mois et Jumada al-Akhira le sixième, nommés ainsi en raison de la saison de grand froid durant laquelle ils se situaient au moment où ils ont été désignés. La loi ne prescrit aucun culte particulier durant ces mois, et la Sîra relate des campagnes et des expéditions qui s'y sont déroulées. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  tr: "Jumada al-Awwal yılın beşinci ayıdır, Jumada al-Akhirah ise altıncıdır. Bunlara, isimlendirildiği durgunluk ve soğuk dönemlerde gerçekleştiği için Jumada olarak adlandırılmıştır. Yasa, onlar için ibadet belirtilmemiştir ve biyografileri sırasında savaşlar ve seferler gerçekleşmiştir. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  id: "Jumada al-Awwal adalah bulan kelima dalam setahun, dan Jumada al-Akhirah adalah bulan keenam. Mereka disebut Jumada karena terjadi pada masa stagnasi dan dingin ketika bulan-bulan tersebut ditetapkan. Hukum tidak menetapkan pemujaan untuk mereka, dan pertempuran serta ekspedisi terjadi selama biografi mereka. {cite:athar-baqiya-thaqafa-2008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
