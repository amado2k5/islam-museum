  ur: "قرضوں کی فروخت اور موخر قیمتوں کا تعین"
  tr: "Borçların satışı ve vade"
  id: "Penjualan utang dan jangka waktu"
issue:
  ar: "هل تجوز الزيادة في الثمن للتأجيل أو الحطيطة للتعجيل في البيع المؤجل؟"
summary:
  ar: "ترى قراءة المؤلف أن عمليات البنوك التقليدية تقوم على المتاجرة بالديون، أما في الإسلام فالدين غير ممنوع، والبيع الآجل مسموح، وتجوز الزيادة للتأجيل مرة واحدة عند البيع، ولا تجوز عند العجز عن السداد {cite:usul-iqtisad-islami-0660 p. 354} {cite:usul-iqtisad-islami-0660 p. 355}. وإذا دخل وسيط يمول فدوره دور المقرض، فلا يقرض بفائدة {cite:usul-iqtisad-islami-0660 p. 355}."
  tr: "Yazarın okuması, geleneksel banka işlemlerinin borç ticaretine dayandığını, oysa İslam'da borcun yasaklanmadığını, ertelenmiş satışların izin verildiğini ve satışta bir kez erteleme artışına izin verildiğini, ancak temerrüt durumunda izin verilmediğini {cite:usul-iqtisad-islami-0660 s. 354} {cite:usul-iqtisad-islami-0660 s. 355} Bir aracı finansman için girerse, rolü kredi verenin rolüdür, bu yüzden faizli kredi vermez {cite:usul-iqtisad-islami-0660 s. 355}."
  id: "Pembacaan penulis menunjukkan bahwa operasi bank tradisional didasarkan pada perdagangan utang, sedangkan dalam Islam utang tidak dilarang, penjualan setelah penundaan diperbolehkan, dan kenaikan penundaan diperbolehkan sekali setelah penjualan, tetapi tidak dalam kasus gagal bayar {cite:usul-iqtisad-islami-0660 hlm. 354} {cite:usul-iqtisad-islami-0660 hlm. 355}. Jika seorang broker masuk untuk membiayai, perannya adalah sebagai pemberi pinjaman, sehingga ia tidak meminjamkan dengan bunga {cite:usul-iqtisad-islami-0660 hlm. 355}."
