id: concept/asbab-al-malinkhuliya-min-al-tihal-wa-al-miraq
class: concept
kind: scientific
label:
  ar: "أسباب المالنخوليا من الطحال والمراق"
  en: "Causes of melancholia from the spleen and the hypochondrium"
  ur: "طحال اور مراق سے مالنخولیا کے اسباب"
summary:
  ar: "يذكر ابن سينا أن المالنخوليا قد يكون سببها خارج الدماغ بمشاركة الطحال أو المراق أو الكبد، وينقل رأي جالينوس وروفس وآخرين في سببها المراقي، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.104}"
  en: "Ibn Sina says melancholia may have its cause outside the brain, by sharing with the spleen, the hypochondrium or the liver, and he reports the views of Galen, Rufus and others on its hypochondriac kind; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.104}"
  ur: "ابن سینا کہتا ہے کہ مالنخولیا کا سبب دماغ سے باہر تلی، مراق یا جگر کی شرکت سے ہو سکتا ہے، اور اس کی مراقی قسم کے بارے میں جالینوس، روفس اور دوسروں کی رائے نقل کرتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.104}۔"
