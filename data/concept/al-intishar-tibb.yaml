id: "concept/al-intishar-tibb"
class: "concept"
kind: "scientific"
label:
  ar: "الانتشار"
  en: "Widening of the pupil (al-intishar)"
  fr: "La dilatation de la pupille (al-intishar)"
  ur: "پتلی کا پھیلنا ⁦(انتشار)⁩"
summary:
  ar: "الانتشار أن تصير الثقبة العنبية أوسع مما هي بالطبع، عقيب صداع أو ضربة أو صدمة أو لأسباب في البيضية أو العنبية، وقد يكون طبيعياً فيرى الأشياء أصغر، وقد يبلغ أن لا يرى شيئاً حتى تبلغ السعة الإكليل {cite:canon-ibn-sina-print-v2 p.210}"
  en: "Intishar is the uveal pupil becoming wider than its nature, after a headache or a blow or a shock, or for causes in the egg-white humour or the uvea; it may be natural, so that things are seen smaller, and it may reach total loss when the widening reaches the corona {cite:canon-ibn-sina-print-v2 p.210}"
  fr: "L'intishar est le fait que la pupille de l'uvée devienne plus large que sa nature, après un mal de tête, un coup ou un choc, ou pour des causes situées dans l'humeur semblable au blanc d'œuf ou dans l'uvée ; elle peut être naturelle, de sorte que les choses paraissent plus petites, et elle peut aller jusqu'à la perte totale lorsque la dilatation atteint la couronne {cite:canon-ibn-sina-print-v2 p.210}"
  ur: "انتشار یہ ہے کہ عنبیہ کا ثقبہ فطرت سے زیادہ کھل جائے، سر درد یا ضربت یا دھکے کے بعد، یا بیضیہ یا عنبیہ کے اسباب سے؛ یہ فطری بھی ہو سکتا ہے کہ چیزیں چھوٹی دکھیں، اور یہ اتنا بڑھ سکتا ہے کہ کچھ نہ دکھے یہاں تک کہ وسعت اِکلیل تک پہنچ جائے {cite:canon-ibn-sina-print-v2 p.210}۔"
