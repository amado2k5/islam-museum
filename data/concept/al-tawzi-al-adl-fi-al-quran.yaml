summary:
  ar: "يبدأ قعدات نظرية التوزيع بأن ثمرة الإنتاج تُعطى لكل شريك حقه كاملاً غير منقوص، والشركاء هم الإنسان، والأرض والمواد، والحق العام الإلهي، وحق المشروع {cite:qadan-manhaj-iqtisad-quran p. 99}. ويرى أن الرأسمالية ركزت على حق الفرد ونسيت الشركاء، وأن الشيوعية ركزت على المادة والأرض ونسيت الحق الإلهي والحق الخاص {cite:qadan-manhaj-iqtisad-quran p. 99}، {cite:qadan-manhaj-iqtisad-quran p. 100}. ويقرر أن الأرض لا تُملك ملكاً مطلقاً بل تُعطى للانتفاع، وأن فرص العمل يجب أن تكون مكفولة للجميع {cite:qadan-manhaj-iqtisad-quran p. 100}، {cite:qadan-manhaj-iqtisad-quran p. 101}."
