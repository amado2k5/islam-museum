label:
  ar: التوزيع العادل في القرآن
  en: "Just distribution in the Qur'an"
  es: "Distribución justa en el Corán"
  fr: "La juste répartition dans le Coran"
  ur: "قرآن میں بس تقسیم"
  tr: "Kur'an'da Adil Dağıtım"
  id: "Distribusi yang Adil dalam Al-Qur'an"
summary:
  ar: "يبدأ قعدات نظرية التوزيع بأن ثمرة الإنتاج تُعطى لكل شريك حقه كاملاً غير منقوص، والشركاء هم الإنسان، والأرض والمواد، والحق العام الإلهي، وحق المشروع {cite:qadan-manhaj-iqtisad-quran p. 99}. ويرى أن الرأسمالية ركزت على حق الفرد ونسيت الشركاء، وأن الشيوعية ركزت على المادة والأرض ونسيت الحق الإلهي والحق الخاص {cite:qadan-manhaj-iqtisad-quran p. 99}، {cite:qadan-manhaj-iqtisad-quran p. 100}. ويقرر أن الأرض لا تُملك ملكاً مطلقاً بل تُعطى للانتفاع، وأن فرص العمل يجب أن تكون مكفولة للجميع {cite:qadan-manhaj-iqtisad-quran p. 100}، {cite:qadan-manhaj-iqtisad-quran p. 101}."
  tr: "Dağıtım teorisinin ilkeleriyle başlar; üretim meyvelerinin her ortağa tam ve azalmadan hakkı verildiği, ortakların ise insan, toprak ve malzeme, ilahi kamu hakkı ve projenin hakkı olduğu {cite:qadan-manhaj-iqtisad-kur'an s. 99}} Kapitalizmin bireysel haklara odaklandığına ve ortakları unuttuğuna, komünizmin ise maddi ve toprağa odaklandığını, ilahi ve özel hakları ise unuttuğuna inanır {cite:qadan-manhaj-iqtisad-kuran s. 99}, {cite:qadan-manhaj-iqtisad-kur'an s. 100}. Toprağın mutlak mülkiyete sahip olmadığını, fayda için verildiğini ve iş fırsatlarının herkese garanti edilmesi gerektiğine karar verir {cite:qadan-manhaj-iqtisad-kuran s. 100}, {cite:qadan-manhaj-iqtisad-kur'an s. 101}."
  id: "Teori ini dimulai dengan prinsip teori distribusi; ia percaya bahwa hasil produksi sepenuhnya dan tak tergoyahkan diberikan kepada setiap mitra, sementara mitra adalah hak manusia, tanah, dan material, hak publik ilahi, serta hak proyek {cite:qadan-manhaj-iqtisad-qur'an hlm. 99}} Ia percaya bahwa kapitalisme berfokus pada hak individu dan melupakan mitra, sementara komunisme berfokus pada materi dan tanah, sementara melupakan hak ilahi dan pribadi {cite:qadan-manhaj-iqtisad-quran hlm. 99}, {cite:qadan-manhaj-iqtisad-qur'an hlm. 100}. Ia memutuskan bahwa tanah tidak memiliki kepemilikan mutlak, diberikan untuk manfaat, dan peluang bisnis harus dijamin kepada semua orang {cite:qadan-manhaj-iqtisad-quran hlm. 100}, {cite:qadan-manhaj-iqtisad-qur'an hlm. 101}."
