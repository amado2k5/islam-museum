summary:
  ar: "العفص في الكتاب ثمرة شجرة كبيرة في بعض البلاد، بارد في الأولى يابس في الثانية، قبضه شديد ويمنع الرطوبات من السيلان وجوهره أرضي بارد، ينفع القوابي والقلاع وقروح المعي والإسهال المزمن ويسود الشعر {cite:canon-ibn-sina-print-v1 p.615}"
  en: "Afs is in the book the fruit of a large tree in some lands, cold in the first degree and dry in the second, strongly astringent, preventing moistures from flowing, its substance earthy and cold; it benefits ringworm, thrush, ulcers of the intestine and chronic diarrhoea, and blackens the hair {cite:canon-ibn-sina-print-v1 p.615}"
  fr: "Dans le livre, l’afs est le fruit d’un grand arbre de certaines contrées, froid au premier degré et sec au deuxième, fortement astringent, empêchant les humidités de s’écouler, sa substance étant terreuse et froide ; il soulage la teigne, le muguet, les ulcères de l’intestin et la diarrhée chronique, et noircit les cheveux {cite:canon-ibn-sina-print-v1 p.615}"
  ur: "عفص کتاب میں بعض ملکوں میں ایک بڑے درخت کا پھل ہے، پہلے درجے میں سرد اور دوسرے میں خشک، سخت قابض ہے اور رطوبتوں کو بہنے سے روکتا ہے، اس کا جوہر ارضی سرد ہے؛ دادر، چھالوں، آنت کے زخموں اور پرانے اسہال میں فائدہ دیتا ہے اور بالوں کو سیاہ کرتا ہے {cite:canon-ibn-sina-print-v1 p.615}۔"
  es: "En el libro, Afs es el fruto de un gran árbol en algunas tierras, frío en primer grado y seco en segundo, fuertemente astringente, que impide el flujo de humedades, su sustancia es terrosa y fría; beneficia la tiña, la candidiasis, las úlceras intestinales y la diarrea crónica, y oscurece el cabello {cite:canon-ibn-sina-print-v1 p.615}"
  tr: "Kitapta tanen, bazı ülkelerde büyük bir ağacın meyvesidir; birincisi soğuk, ikincisinde kurudur, çok sıkıdır ve nemi akışkan olarak önler, özü ise topraksı, soğuktur. Kuklalara, kişnişlere, bağırsak ülserlerine, kronik ishale fayda sağlar ve saçları koyulaştırır {cite:canon-ibn-sina-print-v1 s.615}"
  id: "Dalam buku ini, tanin adalah buah dari pohon besar di beberapa negara; yang pertama dingin, yang kedua kering, sangat kencang, dan mencegah kelembapan sebagai cairan, sementara esensinya bersifat tanah dan dingin. Ia bermanfaat bagi boneka, ketumbar, tukak usus, diare kronis, dan menggelapkan rambut {cite:canon-ibn-sina-print-v1 hlm.615}"
