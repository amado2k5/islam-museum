id: concept/nawa-kind-fiqh
class: concept
kind: legal
label: { ar: "نَوْع", en: "Naw' (kind or species, and its effect on zakat and exchange)" }
summary:
  ar: "النوع في اللغة الصنف، يقال تنوّع الشيء أنواعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16665} وفي الاصطلاح قال الجرجاني إنه اسم دالّ على أشياء كثيرة مختلفة بالأشخاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16665} وللنوع أثر في الزكاة: فإن اتحد نوع الماشية أُخرجت الزكاة من نفس النوع، وأجاز الجمهور إخراج الضأن عن المعز والعكس مع رعاية القيمة، وأوجب الحنفية الإخراج من نفس النوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} وإن اختلف النوع فعند الحنابلة والشافعية في الأظهر يخرج المالك ما يشاء مقسطاً بالقيمة، وقال الحنفية يُضم بعضها إلى بعض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} وفي الثمار والزروع يُضم النوع إلى النوع لتكميل النصاب، وفي ضم الذهب إلى الفضة خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} وفي بيع الربويين مختلفي النوع للبحث الفقهي إحالة إلى باب الربا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667}"
  en: "Naw' in the lexical sense is a kind or class; the Jurist al-Jurjani defined it as a term for many different things by their individuals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16665} Kind matters for zakat: if the animals are of one kind, the zakat is taken from that kind; most jurists allow substituting a sheep for a goat and the reverse, taking value into account, while the Hanafis require the same kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} If the kinds differ, the Hanbalis and the sounder Shafi'i view let the owner give what he chooses, proportioned by value, while the Hanafis join the kinds together. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} For crops and fruit, kinds are joined to complete the threshold; joining gold and silver is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} The exchange of ribawi goods of different kinds is referred to the chapter on usury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667}"
