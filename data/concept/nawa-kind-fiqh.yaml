class: concept
kind: legal
label: { ar: "نَوْع", en: "Naw' (kind or species, and its effect on zakat and exchange)", es: "Naw' (tipo o especie, y su efecto en el zakat y el intercambio)", fr: "Naw' (espèce ou genre, et son effet sur la zakat et l'échange)", ur: "نو' ⁦(قسم یا انواع، اور زکوٰۃ اور تبادلے پر اس کا اثر)⁩", tr: "tür", id: "jenis" }
summary:
  ar: "النوع في اللغة الصنف، يقال تنوّع الشيء أنواعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16665} وفي الاصطلاح قال الجرجاني إنه اسم دالّ على أشياء كثيرة مختلفة بالأشخاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16665} وللنوع أثر في الزكاة: فإن اتحد نوع الماشية أُخرجت الزكاة من نفس النوع، وأجاز الجمهور إخراج الضأن عن المعز والعكس مع رعاية القيمة، وأوجب الحنفية الإخراج من نفس النوع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} وإن اختلف النوع فعند الحنابلة والشافعية في الأظهر يخرج المالك ما يشاء مقسطاً بالقيمة، وقال الحنفية يُضم بعضها إلى بعض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} وفي الثمار والزروع يُضم النوع إلى النوع لتكميل النصاب، وفي ضم الذهب إلى الفضة خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} وفي بيع الربويين مختلفي النوع للبحث الفقهي إحالة إلى باب الربا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667}"
  en: "Naw' in the lexical sense is a kind or class; the Jurist al-Jurjani defined it as a term for many different things by their individuals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16665} Kind matters for zakat: if the animals are of one kind, the zakat is taken from that kind; most jurists allow substituting a sheep for a goat and the reverse, taking value into account, while the Hanafis require the same kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} If the kinds differ, the Hanbalis and the sounder Shafi'i view let the owner give what he chooses, proportioned by value, while the Hanafis join the kinds together. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} For crops and fruit, kinds are joined to complete the threshold; joining gold and silver is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} The exchange of ribawi goods of different kinds is referred to the chapter on usury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667}"
  es: "Naw' en el sentido léxico es un tipo o clase; el jurista al-Jurjani lo definió como un término para muchas cosas diferentes por sus individuos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16665} El tipo importa para el zakat: si los animales son de un tipo, el zakat se toma de ese tipo; la mayoría de los juristas permiten sustituir una oveja por una cabra y viceversa, tomando en cuenta el valor, mientras que los hanafíes requieren el mismo tipo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} Si los tipos difieren, los hanbalíes y la visión shafi'í más sólida permiten que el propietario dé lo que elija, proporcional al valor, mientras que los hanafíes unen los tipos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} Para cultivos y frutas, se unen los tipos para completar el umbral; la unión del oro y la plata es objeto de controversia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} El intercambio de bienes ribawi de diferentes tipos se remite al capítulo sobre la usura. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667}"
  fr: "Le terme « naw' », au sens lexical, désigne une espèce ou une catégorie. Le juriste al-Jurjani le définissait comme un terme employé par différents auteurs pour désigner diverses choses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16665} L'espèce est importante pour le calcul de la zakat: si les animaux sont d'une même espèce, la zakat est prélevée sur cette espèce. La plupart des juristes autorisent la substitution d'un mouton par une chèvre et inversement, en tenant compte de la valeur, tandis que les hanafites exigent la même espèce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} Si les espèces diffèrent, les hanbalites et l'avis plus solide des shafi'ites laissent le propriétaire donner ce qu'il choisit, au prorata de la valeur, tandis que les hanafites regroupent les espèces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} Pour les récoltes et les fruits, les espèces sont combinées pour atteindre le seuil; la combinaison de l’or et de l’argent est controversée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667} L’échange de biens ribawi de différentes espèces est traité dans le chapitre sur l’usure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667}"
  ur: "لغوی معنوں میں نو ایک قسم یا طبقہ ہے۔ فقیہ الجرجانی نے اسے اپنے افراد کے ذریعہ بہت سی مختلف چیزوں کے لئے ایک اصطلاح کے طور پر بیان کیا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16665} زکوٰۃ کے قسم کے معاملات: اگر جانور ایک قسم کے ہوں تو اسی قسم سے زکوٰۃ لی جاتی ہے۔ زیادہ تر فقہاء بکری کے بدلے بکری اور الٹ دینے کی اجازت دیتے ہیں، قیمت کو مدنظر رکھتے ہوئے، جبکہ احناف اسی قسم کا تقاضا کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 16666} اگر اقسام میں اختلاف ہو تو حنبلی اور شافعی کا قول مالک کو اجازت دیتا ہے کہ وہ جو چیز منتخب کرے، قیمت کے تناسب سے، جب کہ احناف قسموں کو اکٹھا کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16666} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16667} فصلوں اور پھلوں کے لیے، حد کو مکمل کرنے کے لیے قسمیں جوڑ دی جاتی ہیں۔ سونے اور چاندی میں شامل ہونا متنازع ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16667} مختلف قسم کے رباوی سامان کا تبادلہ سود کے باب میں ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص16667}"
  tr: "Dilde 'tip' 'tip' anlamına gelir; çeşitlilik olduğu söylenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16665} Terminolojide, Al-Jurjani bunun insanlar hakkında birçok farklı şeyi ifade eden bir isim olduğunu söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16665} Tip zekat üzerinde etki yapar: hayvan türü birleştirilirse, zekat aynı türden verilir. Çoğunluk, keçilerden koyun vermeye ve keçilerin de değerine saygı göstererek koyun vermesine izin verirken, Hanefiler aynı türden ödeme yapmak zorundaydı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.166666} Tip farklılık gösterse de, Hanbali ve Şafi'lere göre en açık görüşte, sahibi istediği kadar taksitli ödeme yapabilir ve Hanafiler bazılarını birleştirdiğini söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16667} Meyve ve ürünlerde, nisabı tamamlamak için tipe bir tür eklenir, ancak gümüşe altın eklenmesi konusunda görüş ayrılığı vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16667} Ve farklı türde tefecilerin fıkıh araştırması için satılmasında ise faiz bölümüne atıfta bulunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16667}"
  id: "Dalam bahasa, 'tipe' berarti 'tipe'; dikatakan sebagai variasi hal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16665} Dalam terminologi, Al-Jurjani mengatakan bahwa itu adalah nama yang menunjukkan banyak hal berbeda tentang manusia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16665} Jenis ini berpengaruh pada zakat: jika jenis ternak disatukan, zakat dibayarkan dari jenis yang sama. Mayoritas mengizinkan memberikan domba dari kambing dan sebaliknya dengan menghormati nilai, dan Hanafi wajib membayar dari jenis yang sama. {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16666} Meskipun jenisnya berbeda, menurut Hanbalis dan Shafi'i, dalam pandangan yang paling jelas, pemilik dapat membayar apa pun yang diinginkan secara cicilan sesuai harga, dan para Hahanfi mengatakan menggabungkan beberapa di antaranya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16667} Dalam buah-buahan dan tanaman, satu jenis ditambahkan ke tipe untuk melengkapi nisab, tetapi ada perbedaan pendapat mengenai penambahan emas ke perak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16667} Dan dalam penjualan individu riba dari berbagai jenis untuk penelitian yurisprudensial, disebutkan bab riba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16667}"
