summary:
  ar: "الدينار قطعة من الذهب مضروبة مقدرة بالمثقال، وهو عند الفقهاء مرادف للمثقال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8235} والدينار الشرعي هو الذي ضربه عبد الملك بن مروان على أوزان الجاهلية، وزنه اثنان وعشرون قيراطا إلا حبة، وتعتمد عليه الأحكام المقدرة بالدينار كالزكاة والدية والسرقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} نصاب الذهب في الزكاة عشرون دينارا، وفيه ربع العشر إذا تم، والدية من الذهب ألف دينار على الرجل الحر المسلم، ونصاب القطع في السرقة ربع دينار عند الجمهور ودينار أو عشرة دراهم عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8238}"
  en: "A dinar is a piece of gold coin struck to a set weight, and in the jurists' usage it is the same as the mithqal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8235} The legal dinar is the one struck by Abd al-Malik ibn Marwan on the weights of the Jahiliyya, weighing twenty-two qirats less a grain; rulings measured in dinars, such as zakat, diya and theft, rest on it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} The gold nisab for zakat is twenty dinars, on which a quarter of a tenth is due once it is reached; the gold diya for a free Muslim man is a thousand dinars; the theft threshold is a quarter of a dinar for the majority and a dinar or ten dirhams for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8238}"
  ur: "دینار سونے کا وہ سکہ ہے جو مقرر وزن کے مطابق ڈھالا جائے، اور فقہاء کے نزدیک یہ مثقال کے مترادف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8235} سونے کا نصاب زکوٰۃ بیس دینار ہے، اور دیت سونے میں ایک ہزار دینار مقرر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237}"
  es: "Un dinar es una pieza de moneda de oro acuñada a un peso fijo, y en el uso de los juristas es lo mismo que el mithqal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8235} El dinar legal es el acuñado por Abd al-Malik ibn Marwan sobre los pesos de la Jahiliyya, que pesa veintidós qirats menos un grano; las normas medidas en dinares, como el zakat, la diya y el robo, se basan en él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} El nisab de oro para el zakat es de veinte dinares, sobre los cuales se debe un cuarto de un décimo una vez que se alcanza; la diya de oro para un hombre musulmán libre es de mil dinares; el umbral de robo es de un cuarto de dinar para la mayoría y de un dinar o diez dirhams para los hanafis. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8238}"
  fr: "Un dinar est une pièce d'or frappée à un poids précis, et dans l'usage des juristes, il est synonyme de mithqal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8235} Le dinar légal est celui frappé par Abd al-Malik ibn Marwan selon les poids de la Jahiliyya, pesant vingt-deux qirats moins un grain; les règles exprimées en dinars, telles que la zakat, la diya et le vol, reposent sur ce dinar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} Le nisab d'or pour la zakat est de vingt dinars, sur lequel un quart de dixième est dû une fois atteint; la diya d'or pour un musulman libre est de mille dinars. le seuil de vol est d'un quart de dinar pour la majorité et d'un dinar ou dix dirhams pour les Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8238}"
  tr: "Dinar, mitkalda basılan ve değerlenen bir altın parçasıdır ve hukukçular arasında mitkal ile eşanlamlıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8235} Yasal dinar, Abdülmelik bin Mervan'ın İslam öncesi ağırlıklar üzerinde bastığı, bir tahıl hariç yirmi iki qirat ağırlığında olan dinardır ve zekat, kan parası ve hırsızlık gibi dinar cinsinden tahmin edilen hükümler buna bağlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8237} Zekatta altın nisabı yirmi dinardır, tamamlandığında dörtte bir dinardır. Altın için diyya özgür bir Müslüman için bin dinardır. Hırsızlık için nisab çoğunluğa göre çeyrek dinar, Hanefi okuluna göre bir dinar veya on dirhemdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8238}"
  id: "Dinar adalah sepotong emas yang dicetak dan dinilai dalam mithqal, dan di kalangan ahli hukum, dinar identik dengan mithqal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8235} Dinar legal adalah yang dicetak Abd al-Malik ibn Marwan pada berat pra-Islam, dengan berat dua puluh dua qirat kecuali satu butir, dan keputusan yang diperkirakan dalam dinar seperti zakat, uang darah, dan pencurian bergantung padanya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8237} Nisab untuk emas dalam zakat adalah dua puluh dinar, dan seperempat sepersepuluh jika diselesaikan. Diyya untuk emas adalah seribu dinar untuk orang Muslim merdeka. Nisab untuk pencurian adalah seperempat dinar menurut mayoritas dan satu dinar atau sepuluh dirham menurut mazhab Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8238}"
