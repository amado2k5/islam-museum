label:
  ar: "الدنانير"
  en: "Dinars (gold coins and their legal measure)"
  ur: "دینار (سونے کے سکے اور ان کا شرعی وزن)"
summary:
  ar: "الدينار قطعة من الذهب مضروبة مقدرة بالمثقال، وهو عند الفقهاء مرادف للمثقال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8235} والدينار الشرعي هو الذي ضربه عبد الملك بن مروان على أوزان الجاهلية، وزنه اثنان وعشرون قيراطا إلا حبة، وتعتمد عليه الأحكام المقدرة بالدينار كالزكاة والدية والسرقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} نصاب الذهب في الزكاة عشرون دينارا، وفيه ربع العشر إذا تم، والدية من الذهب ألف دينار على الرجل الحر المسلم، ونصاب القطع في السرقة ربع دينار عند الجمهور ودينار أو عشرة دراهم عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8238}"
  en: "A dinar is a piece of gold coin struck to a set weight, and in the jurists' usage it is the same as the mithqal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8235} The legal dinar is the one struck by Abd al-Malik ibn Marwan on the weights of the Jahiliyya, weighing twenty-two qirats less a grain; rulings measured in dinars, such as zakat, diya and theft, rest on it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} The gold nisab for zakat is twenty dinars, on which a quarter of a tenth is due once it is reached; the gold diya for a free Muslim man is a thousand dinars; the theft threshold is a quarter of a dinar for the majority and a dinar or ten dirhams for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8238}"
  ur: "دینار سونے کا وہ سکہ ہے جو مقرر وزن کے مطابق ڈھالا جائے، اور فقہاء کے نزدیک یہ مثقال کے مترادف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8235} سونے کا نصاب زکوٰۃ بیس دینار ہے، اور دیت سونے میں ایک ہزار دینار مقرر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8237}"
