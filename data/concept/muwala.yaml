id: concept/muwala
class: concept
kind: legal
label: { ar: "المُوَالاة", en: "Continuity (muwala) between the parts of an act of worship or a contract", ur: "موالات (متصل ادا کرنا)" }
summary:
  ar: "الموالاة في اللغة المتابعة، وفي الفقه عدم التفريق الكثير بين أجزاء العبادة أو العقد، ويقال الفورية والتعجيل. وللفقهاء فيها أحكام كثيرة: في الوضوء والغسل والتيمم، وبين ألفاظ الأذان والإقامة، وبين كلمات الفاتحة والتشهد، وبين تكبيرات العيد، وفي جمع التقديم، وبين أشواط الطواف والسعي، وفي رمي الجمرات واللعان والإيجاب والقبول والاستثناء في اليمين ورد السلام."
  en: "Muwala in the lexicon is succession. In law it is the avoidance of long breaks between the parts of an act of worship or of a contract. The jurists give rules for it in ablution, the bath, dry ablution, the call and the iqama, the verses of the Opening, the tashahhud, the festival takbirs, combining prayers, the circuits of circumambulation and of running between the hills, the stoning, the oath of mutual cursing, the offer and acceptance in a contract, the exception in an oath, and the return of a greeting. A break is judged by custom and by its size."
  ur: "موالات لغت میں متابعت کو کہتے ہیں، اور فقہ میں عبادت یا عقد کے اجزاء کے درمیان لمبا وقفہ نہ ہونا ہے۔ وضو، غسل، تیمم، اذان، اقامت، نماز میں قراءت، تشہد، عید کی تکبیرات، طواف و سعی، اور نکاح و بیع کے ایجاب و قبول کے احکام اس میں شامل ہیں۔"
