label: { ar: "المُوَالاة", en: "Continuity (muwala) between the parts of an act of worship or a contract", ur: "موالات ⁦(متصل ادا کرنا)⁩", es: "Continuidad (muwala) entre las partes de un acto de culto o un contrato", fr: "Continuité (muwala) entre les parties d'un acte de culte ou d'un contrat", tr: "Sadakat", id: "Loyalitas" }
summary:
  ar: "الموالاة في اللغة المتابعة، وفي الفقه عدم التفريق الكثير بين أجزاء العبادة أو العقد، ويقال الفورية والتعجيل. وللفقهاء فيها أحكام كثيرة: في الوضوء والغسل والتيمم، وبين ألفاظ الأذان والإقامة، وبين كلمات الفاتحة والتشهد، وبين تكبيرات العيد، وفي جمع التقديم، وبين أشواط الطواف والسعي، وفي رمي الجمرات واللعان والإيجاب والقبول والاستثناء في اليمين ورد السلام."
  en: "Muwala in the lexicon is succession. In law it is the avoidance of long breaks between the parts of an act of worship or of a contract. The jurists give rules for it in ablution, the bath, dry ablution, the call and the iqama, the verses of the Opening, the tashahhud, the festival takbirs, combining prayers, the circuits of circumambulation and of running between the hills, the stoning, the oath of mutual cursing, the offer and acceptance in a contract, the exception in an oath, and the return of a greeting. A break is judged by custom and by its size."
  ur: "موالات لغت میں متابعت کو کہتے ہیں، اور فقہ میں عبادت یا عقد کے اجزاء کے درمیان لمبا وقفہ نہ ہونا ہے۔ وضو، غسل، تیمم، اذان، اقامت، نماز میں قراءت، تشہد، عید کی تکبیرات، طواف و سعی، اور نکاح و بیع کے ایجاب و قبول کے احکام اس میں شامل ہیں۔"
  es: "Muwala, en el léxico, significa sucesión. En derecho, se refiere a evitar pausas prolongadas entre las partes de un acto de culto o de un contrato. Los juristas establecen normas al respecto para la ablución, el baño, la ablución seca, la llamada y la iqama, los versos de la Apertura, el tashahhud, los takbirs festivos, la combinación de oraciones, los circuitos de circunvalación y de carrera entre las colinas, la lapidación, el juramento de maldición mutua, la oferta y la aceptación en un contrato, la excepción en un juramento y la respuesta a un saludo. La duración de una pausa se determina según la costumbre y su duración."
  fr: "Le terme muwala, dans le lexique, désigne la succession. En droit, il s'agit d'éviter les longs intervalle entre les différentes parties d'un acte de culte ou d'un contrat. Les juristes édictent des règles à ce sujet pour les ablutions, le bain rituel, les ablutions sèches, l'appel à la prière et l'iqama, les versets de l'Ouverture, le tashahhud, les takbirs des fêtes, la combinaison des prières, les circuits de circumambulation et de course entre les collines, la lapidation, le serment d'injure mutuelle, l'offre et l'acceptation dans un contrat, l'exception à un serment et la réponse à une salutation. La durée d'un intervalle est appréciée selon la coutume et son importance."
  tr: "Dilde süreklilik, takip anlamına gelirken, fiqh alanında ibadet veya sözleşmeler arasında aşırı ayrım yapmamak anlamına gelir ve buna aciliyet ve acele etme denir. Hukukçuların bu konuda birçok hükmü vardır: abdest, gusl ve kuru abdest kullanımı, azan ve ikama'nın ifadesi, El-Fatiha ve Taşahhud'un sözleri, Bayram tekbirleri, önceliğin birleşimi, Tevaf ve Sa'i turları, Cemerat ve Laan'ın taşlanması, yemin kabulü ve istisnası, selamın geri verilmesi."
  id: "Dalam bahasa, kontinuitas berarti tindak lanjut, dan dalam yurisprudensi, tidak membuat perbedaan berlebihan antara bagian ibadah atau kontrak, dan disebut kelangsungan dan percepatan. Para ahli hukum memiliki banyak keputusan tentang hal ini: mengenai wudhu, ghusl, dan wudhu kering, kata-kata adhan dan iqama, kata-kata Al-Fatiha dan Tashahhud, takbir Idul Fitri, kombinasi prioritas, putaran Tawaf dan Sa'i, rajam Jamarat dan Laan, penerimaan dan pengecualian dalam sumpah, serta pengembalian salam."
