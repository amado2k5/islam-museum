id: concept/hajar-al-labani
class: concept
kind: natural
label:
  ar: "الحجر اللبني"
  en: "Al-hajar al-labani (the milky stone)"
  ur: "حجر اللبنی ⁦(دودھیا پتھر)⁩"
  es: "Al-hajar al-labani (la piedra lechosa)"
summary:
  ar: "الحجر اللبني حجر رمادي حلو الطعم، إذا حُكّ بالماء خرج منه شيء كاللبن، ويُسحق بالماء ويُحفظ ما يتحلّل منه في حُقّة رصاص. معتدل، ينفع من ابتداء الأورام الحارة، ويُكتحل بحكاكته مع الماء فيمنع سيلان الفضول إلى العين."
  en: "The milky stone is grey and sweet. When rubbed with water it gives out a milky substance; it is ground with water, and what dissolves is kept in a lead box. It is moderate, helps the start of hot swellings, and when rubbed with water and used as kohl it stops the flow of humours to the eye."
  ur: "حجر اللبنی ایک خاکستری اور میٹھا پتھر ہے۔ پانی کے ساتھ رگڑنے سے دودھ جیسا مادہ نکلتا ہے؛ اسے پانی کے ساتھ پیسا جاتا ہے اور جو حل ہو جائے اسے سیسے کی ڈبیا میں رکھا جاتا ہے۔ یہ معتدل ہے، گرم سوجن کے آغاز میں مفید ہے، اور پانی کے ساتھ رگڑ کر سرمے کے طور پر آنکھ میں بہنے والی رطوبت روکتا ہے۔"
  es: "La piedra lechosa es gris y dulce. Al frotarla con agua, desprende una sustancia lechosa; se muele con agua y lo que se disuelve se guarda en una caja de plomo. Es suave, ayuda a aliviar la inflamación inicial y, al frotarla con agua y usarla como kohl, detiene el flujo de humores hacia el ojo."
