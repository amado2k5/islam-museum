summary:
  ar: "الكلية غذاء معروف معتدل إلى اليبس، وأحمده كلية الجدي، وخلطه رديء عسر الانهضام بطيء الانحدار {cite:canon-ibn-sina-print-v1 p.530}."
  en: "The kidney is a known food, moderate toward dryness; the best is the kid's kidney. Its humour is poor, it is hard to digest and slow to descend {cite:canon-ibn-sina-print-v1 p.530}."
  ur: "گردہ ایک معروف غذا ہے، خشکی کی طرف معتدل؛ سب سے اچھا بکری کے بچے کا گردہ ہے۔ اس کا خلط خراب ہے، ہضم مشکل اور اترنے میں سست {cite:canon-ibn-sina-print-v1 p.530}۔"
  es: "El riñón es un alimento conocido, de textura moderadamente seca; el mejor es el riñón de cabrito. Su humor es pobre, es difícil de digerir y de paso lento {cite:canon-ibn-sina-print-v1 p.530}."
  fr: "Le rognon est un aliment connu, modérément sec; le meilleur est celui du chevreau. Son humeur est pauvre, il est difficile à digérer et lent à descendre {cite:canon-ibn-sina-print-v1 p.530}."
  tr: "Böbrek, orta ve kuru oranda iyi bilinen bir besindir ve Oğlak böbreği olarak da bilinir. Karışımı zayıf, hazımsızlık ve yavaş çürüyen {cite:canon-ibn-sina-print-v1 s.530}."
  id: "Ginjal adalah makanan yang dikenal luas dengan ukuran sedang hingga kering, dan juga dikenal sebagai ginjal Capricorn. Campurannya buruk, gangguan pencernaan, dan pembusukan yang lambat {cite:canon-ibn-sina-print-v1 hlm.530}."
