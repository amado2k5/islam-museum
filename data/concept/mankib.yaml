label: { ar: "المَنْكِب ⁦(أحكامه في الوضوء والصلاة والجناية)⁩", en: "The shoulder (mankib): its place in ablution, prayer and bodily injury", ur: "منکب ⁦(کندھا: وضو، نماز اور جنایت کے احکام)⁩", es: "El hombro (mankib): su lugar en la ablución, la oración y las lesiones corporales.", fr: "L'épaule (mankib): sa place dans l'ablution, la prière et les blessures corporelles", tr: "Omuz (Abdest, Dua ve Suç Hakkındaki Kararları)", id: "Bahu (Putusan tentang Wud, Doa, dan Kejahatan)" }
summary:
  ar: "المنكب مجتمع رأس العضد والكتف من يد الإنسان. وللفقهاء أحكام تتعلق به: استحباب الزيادة في غسل اليدين في الوضوء إلى المنكبين عند الجمهور، وحكم العضو النابت في المنكب، وسقوط الغسل عند قطع اليد من المرفق، ورفع اليدين حذو المنكبين في تكبيرة الإحرام والانتقال، ووضع اليدين في السجود، ومحاذاة المناكب في الصفوف، والجناية عليه."
  en: "Mankib is the joint where the upper arm meets the shoulder. The jurists have rules about it: in ablution, most hold it recommended to wash the arms up to the shoulders for the glow of the limbs; a limb growing on the shoulder is washed where it lies over the place of ablution; the washing falls away when the hand is cut off at the elbow. In prayer, the hands are raised to the shoulder level at the opening takbir and the transitions, placed beside the shoulders in prostration, and the shoulders are aligned in rows. Injury to the shoulder is also treated."
  ur: "منکب بازو اور کندھے کے جوڑ کو کہتے ہیں۔ وضو میں اس تک ہاتھ دھونا جمہور کے نزدیک مستحب ہے، نماز میں تکبیرِ احرام اور انتقال کے وقت ہاتھ کندھوں تک اٹھائے جاتے ہیں، اور صفوں میں کندھے ملانا مستحب ہے۔"
  es: "Mankib es la articulación donde el brazo se une al hombro. Los juristas tienen normas al respecto: en la ablución, la mayoría recomienda lavar los brazos hasta los hombros para que brillen las extremidades; si una extremidad crece sobre el hombro, se lava donde se apoya sobre el lugar de la ablución; el lavado se interrumpe cuando la mano se corta a la altura del codo. En la oración, las manos se elevan a la altura de los hombros al pronunciar el takbir inicial y durante las transiciones, se colocan junto a los hombros en la postración y estos se alinean en filas. También se tratan las lesiones en el hombro."
  fr: "Le mankib est l'articulation entre le bras et l'épaule. Les juristes ont établi des règles à ce sujet: lors des ablutions, la plupart recommandent de laver les bras jusqu'aux épaules pour la purification des membres; un membre poussant sur l'épaule est lavé à l'endroit où il repose sur le point d'ablution; le lavage cesse lorsque la main est coupée au niveau du coude. Pendant la prière, les mains sont levées à hauteur d'épaule au takbir initial et lors des transitions, placées le long des épaules en prosternation, et les épaules sont alignées. Les blessures à l'épaule sont également prises en compte."
  tr: "Omuz, üst kolun başı ile insan elinin omzunun birleşimidir. Hukukçuların bununla ilgili kararları vardır: çoğunluğa göre omuzlara kadar el yıkama süresinin artırılması önerisi, omuzda büyüyen organ hakkındaki karar, dirsek elinden kesildiğinde hüslün düşürülmesi, İhram'ın açılış tekbirinde ellerin omuzlara kaldırılması ve öne doğru hareket edilmesi, ellerin secdede edilmesi, omuzların sıralara hizalanması ve ona karşı işlenen suç."
  id: "Bahu adalah gabungan antara kepala lengan atas dan bahu dari tangan manusia. Para ahli hukum memiliki aturan terkait bahu tersebut: rekomendasi untuk meningkatkan pencucian tangan saat wudhu ke bahu menurut mayoritas, aturan tentang organ yang tumbuh di bahu, penurunan ghusl saat tangan dipotong dari siku, mengangkat tangan ke bahu dalam takbir pembuka Ihram dan bergerak maju, meletakkan tangan dalam posisi sujud, menyelaraskan bahu dalam baris, dan kejahatan terhadapnya."
