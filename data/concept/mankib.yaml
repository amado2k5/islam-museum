label: { ar: "المَنْكِب (أحكامه في الوضوء والصلاة والجناية)", en: "The shoulder (mankib): its place in ablution, prayer and bodily injury", ur: "منکب (کندھا: وضو، نماز اور جنایت کے احکام)" }
summary:
  ar: "المنكب مجتمع رأس العضد والكتف من يد الإنسان. وللفقهاء أحكام تتعلق به: استحباب الزيادة في غسل اليدين في الوضوء إلى المنكبين عند الجمهور، وحكم العضو النابت في المنكب، وسقوط الغسل عند قطع اليد من المرفق، ورفع اليدين حذو المنكبين في تكبيرة الإحرام والانتقال، ووضع اليدين في السجود، ومحاذاة المناكب في الصفوف، والجناية عليه."
  en: "Mankib is the joint where the upper arm meets the shoulder. The jurists have rules about it: in ablution, most hold it recommended to wash the arms up to the shoulders for the glow of the limbs; a limb growing on the shoulder is washed where it lies over the place of ablution; the washing falls away when the hand is cut off at the elbow. In prayer, the hands are raised to the shoulder level at the opening takbir and the transitions, placed beside the shoulders in prostration, and the shoulders are aligned in rows. Injury to the shoulder is also treated."
  ur: "منکب بازو اور کندھے کے جوڑ کو کہتے ہیں۔ وضو میں اس تک ہاتھ دھونا جمہور کے نزدیک مستحب ہے، نماز میں تکبیرِ احرام اور انتقال کے وقت ہاتھ کندھوں تک اٹھائے جاتے ہیں، اور صفوں میں کندھے ملانا مستحب ہے۔"
