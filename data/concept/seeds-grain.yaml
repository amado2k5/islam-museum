  ar: "الله فالق الحب والنوى يخرج الحي من الميت ومخرج الميت من الحي، ومثل الذين ينفقون أموالهم في سبيل الله كمثل حبة أنبتت سبع سنابل في كل سنبلة مئة حبة، والحب ذو العصف والريحان."
  en: "God is the splitter of the grain and the stone of the fruit, bringing forth the living from the dead and the dead from the living; the likeness of those who spend their wealth in God's way is a grain that grows seven ears, in each ear a hundred grains; and grain in the blade and fragrant herbs."
