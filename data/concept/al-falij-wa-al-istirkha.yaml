id: "concept/al-falij-wa-al-istirkha"
class: "concept"
kind: "scientific"
label:
  ar: "الفالج والاسترخاء"
  en: "Palsy (falij) and relaxation"
  fr: "Paralysie (falij) et relâchement"
  ur: "فالج اور استرخاء"
summary:
  ar: "الفالج قد يقال قولاً مطلقاً وقد يقال قولاً مخصوصاً محقّقاً، والمخصوص هو الاسترخاء العام لأحد شقي البدن طولاً: فمنه ما يكون في الشق المبتدئ من الرقبة والوجه والرأس معه صحيح، ومنه ما يسري في جميع الشق من الرأس إلى القدم {cite:canon-ibn-sina-print-v2 p.136}"
  en: "Falij may be said absolutely or in the specific verified sense; the specific is the relaxation general to one side of the body lengthwise: of it is the kind in the half beginning at the neck with face and head sound, and the kind that runs through the whole side from head to foot {cite:canon-ibn-sina-print-v2 p.136}"
  fr: "Le terme falij s’emploie au sens large ou dans un sens précis : dans ce dernier cas, le relâchement touche un côté du corps dans sa longueur. Il peut commencer au cou, épargnant la tête et le visage, ou atteindre tout un côté de la tête aux pieds {cite:canon-ibn-sina-print-v2 p.136}."
  ur: "فالج مطلق بھی کہا جا سکتا ہے اور مخصوص محقق معنی میں بھی؛ اور مخصوص وہ استرخاء ہے جو بدن کے ایک شق میں طولاً عام ہو: اس میں سے ایک وہ ہے جو گردن سے شروع ہونے والے شق میں ہو اور چہرہ و سر اس کے ساتھ صحیح رہے، اور ایک وہ ہے جو سر سے پاؤں تک سارے شق میں سرایت کرے {cite:canon-ibn-sina-print-v2 p.136}۔"
