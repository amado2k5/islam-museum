label:
  ar: "العِلْم"
  en: "Knowledge (ilm): its kinds and the rulings on learning them"
  ur: "علم (علم کی اقسام اور حکم)"
summary:
  ar: "العلم في اللغة الإدراك والمعرفة والشعور والإتقان واليقين، وفي الاصطلاح حصول صورة الشيء في العقل، أو صفة توجب تمييزاً بين المعاني {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11797}. وينقسم عند المتكلمين إلى قديم، وهو علم الله تعالى، وحادث، وهو علم العباد، وينقسم إلى ضروري واكتسابي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11799}. ويختلف الحكم التكليفي لتعلم العلم بحسب فائدته والحاجة إليه، فيفرض عيناً ما يحتاجه المكلف من علم الدين، كالعقائد والطهارة والصلاة والصوم والزكاة والحج لمن وجبا عليه، وعلم البيع للتجار، ويفرض كفاية ما يقوم به الدين والدنيا كالقرآن والحديث وأصولهما واللغة والحساب والطب والصنائع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11800}. ويندب التوسع في العلوم الشرعية وآلاتها، وتحرم علوم مثل السحر والكهانة والعرافة والرمل وبعض التنجيم، وتكره الإفراط في الشعر، وتباح الأشعار التي ليس فيها سخف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11801}."
  en: "In the lexicon, ilm is perception, cognition, awareness, mastery and certainty. As a term it is the occurrence of the form of a thing in the mind, or an attribute that makes its bearer distinguish between meanings {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11797}. The speculative theologians divide it into eternal knowledge, which is God's, and created knowledge, which is human and is either necessary or acquired {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11798} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11799}. The ruling on learning it varies with its use and need. Each person must learn what he needs of religion, such as the creed, purification, prayer, fasting, zakat if due, pilgrimage if obliged, and the rules of sale for a trader; the sciences needed for the community's religion and worldly life, such as the Qur'an, hadith and their principles, language, arithmetic, medicine and the crafts, are a communal duty {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11799} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11800}. Wide study of the religious sciences and their tools is recommended. Sorcery, soothsaying, divination and some astrology are forbidden; philosophy is judged corrupt in part, and logic is treated as lawful by the writers who weighed it; excessive poetry is disliked, while poetry that is not frivolous or that encourages good is allowed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11801}."
