label:
  ar: طلب العلم
  en: Seeking knowledge
  es: "Buscando conocimiento"
  fr: "En quête de connaissances"
summary:
  ar: "طلب العلم في حديث أبي هريرة — السادس والثلاثون من الأربعين — من أعظم الطرق الموصلة إلى الجنة: «من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة» {cite:sahih-muslim 2699}، ويقرن به مجالس الذكر في بيوت الله حيث يتلى الكتاب ويتدارس فتنزل السكينة وتغشى الرحمة وتحف الملائكة ويذكر الله أهلها فيمن عنده، ويختم الحديث بأن العمل هو المنجي لا الحسب: «ومن بطأ به عمله لم يسرع به نسبه» — فجعل الالتزام بطريق العلم وتدارس القرآن جماعةً من أسباب السكينة والذكر عند الله، ورد اعتماد النسب على الاعتبار بالعمل ⁦(جامع العلوم والحكم ص 731)⁩."
  en: "Seeking knowledge in Abu Hurayra's hadith — the thirty-sixth of the Forty — is among the greatest paths to Paradise: 'whoever treads a path seeking knowledge, God will ease for him by it a path to Paradise', and it is paired with gatherings of remembrance in God's houses, where the Book is recited and studied together, upon whom serenity descends, mercy envelopes and the angels surround while God mentions them among those with Him; the hadith closes by making deeds, not lineage, the rescuer — 'whoever is slowed by his deeds, his descent will not speed him along' — so that treading the path of learning and studying the Qur'an in company are means to serenity and divine mention, while reliance on ancestry is answered by the rule of works (Jami' al-Ulum wal-Hikam p. 731)."
  es: "En el hadiz de Abu Hurayra —el trigésimo sexto de los Cuarenta—, buscar conocimiento es uno de los mejores caminos hacia el Paraíso: «Quien recorre un camino buscando conocimiento, Dios le facilitará con él un camino al Paraíso». Esto se combina con reuniones de recuerdo en las casas de Dios, donde se recita y estudia el Libro juntos, sobre quienes desciende la serenidad, la misericordia los envuelve y los ángeles los rodean mientras Dios los menciona entre los que están con Él. El hadiz concluye haciendo de las obras, no del linaje, el salvador: «Quien se ve retrasado por sus obras, su descenso no lo acelerará». De modo que recorrer el camino del aprendizaje y estudiar el Corán en compañía son medios para alcanzar la serenidad y la mención divina, mientras que la confianza en la ascendencia se ve respondida por la regla de las obras (Jami' al-Ulum wal-Hikam, pág. 731)."
  fr: "La recherche du savoir, dans le hadith d'Abu Hurayra — le trente-sixième des Quarante —, figure parmi les plus grands chemins vers le Paradis: « Quiconque emprunte un chemin de recherche du savoir, Dieu lui facilitera par là le chemin du Paradis ». Ce chemin est associé aux rassemblements de prière dans les maisons de Dieu, où le Livre est récité et étudié ensemble. Sur ces personnes descendent la sérénité, la miséricorde les enveloppe et les anges les entourent, tandis que Dieu les mentionne parmi ceux qui sont auprès de Lui. Le hadith conclut en affirmant que ce sont les actes, et non la lignée, qui sauvent: « Quiconque est ralenti par ses actes, sa descente ne le hâtera pas ». Ainsi, emprunter le chemin de l'apprentissage et étudier le Coran en groupe sont des moyens d'atteindre la sérénité et la mention divine, tandis que la confiance en l'ascendance est compensée par la règle des œuvres (Jami' al-Ulum wal-Hikam, p. 731)."
