label:
  ar: طلب العلم
  en: Seeking knowledge
summary:
  ar: "طلب العلم في حديث أبي هريرة — السادس والثلاثون من الأربعين — من أعظم الطرق الموصلة إلى الجنة: «من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة» {cite:sahih-muslim 2699}، ويقرن به مجالس الذكر في بيوت الله حيث يتلى الكتاب ويتدارس فتنزل السكينة وتغشى الرحمة وتحف الملائكة ويذكر الله أهلها فيمن عنده، ويختم الحديث بأن العمل هو المنجي لا الحسب: «ومن بطأ به عمله لم يسرع به نسبه» — فجعل الالتزام بطريق العلم وتدارس القرآن جماعةً من أسباب السكينة والذكر عند الله، ورد اعتماد النسب على الاعتبار بالعمل (جامع العلوم والحكم ص 731)."
  en: "Seeking knowledge in Abu Hurayra's hadith — the thirty-sixth of the Forty — is among the greatest paths to Paradise: 'whoever treads a path seeking knowledge, God will ease for him by it a path to Paradise', and it is paired with gatherings of remembrance in God's houses, where the Book is recited and studied together, upon whom serenity descends, mercy envelopes and the angels surround while God mentions them among those with Him; the hadith closes by making deeds, not lineage, the rescuer — 'whoever is slowed by his deeds, his descent will not speed him along' — so that treading the path of learning and studying the Qur'an in company are means to serenity and divine mention, while reliance on ancestry is answered by the rule of works (Jami' al-Ulum wal-Hikam p. 731)."
