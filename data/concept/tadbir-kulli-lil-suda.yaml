id: concept/tadbir-kulli-lil-suda
class: concept
kind: scientific
label:
  ar: "تدبير كلي للصداع"
  en: "The general regimen for headache"
  ur: "صداع کی عمومی تدبیر"
  es: "El régimen general para el dolor de cabeza"
summary:
  ar: "يذكر ابن سينا القاعدة العامة في تدبير الصداع: قطع سببه ومقابلته بضده، وما ينفع من قلة الأكل والشراب وكثرة النوم، وجذب المواد إلى أسفل، وتدبير ما يصحب الصداع المزمن، وما ينبغي اجتنابه؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.53-54}"
  en: "Ibn Sina gives the general rule for managing headache: to cut off its cause and meet it with its opposite, what helps of eating and drinking little and sleeping much, drawing the matters downward, the management of what accompanies chronic headache, and what is to be avoided; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.53-54}"
  ur: "ابن سینا صداع کی تدبیر کا عام قاعدہ بتاتا ہے: اس کا سبب کاٹنا اور اس کے ضد سے مقابلہ کرنا، کم کھانے پینے اور زیادہ سونے کا فائدہ، مادوں کو نیچے کھینچنا، دائمی صداع کے ساتھ آنے والی چیزوں کی تدبیر، اور جن سے بچنا چاہیے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.53-54}۔"
  es: "Ibn Sina ofrece la regla general para tratar el dolor de cabeza: eliminar su causa y contrarrestarla con su opuesto; lo que ayuda comer y beber poco y dormir mucho; dirigir los asuntos hacia abajo; el manejo de lo que acompaña al dolor de cabeza crónico y lo que se debe evitar; el registro tiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 pp.53-54}"
