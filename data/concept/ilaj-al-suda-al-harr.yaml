id: concept/ilaj-al-suda-al-harr
class: concept
kind: scientific
label:
  ar: "علاج الصداع الحار"
  en: "Treatment of hot headache"
  ur: "گرم صداع کا علاج"
  es: "Tratamiento del dolor de cabeza por calor"
  fr: "Traitement des céphalées chaudes"
summary:
  ar: "يذكر ابن سينا أن غرض علاج الصداع الحار التبريد، ويفرّق بين الصداع من حرّ الشمس وما كان من مادة دموية أو صفراوية، ويبيّن مبادئ تدبير كل منها؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.55-57}"
  en: "Ibn Sina says that the aim in treating hot headache is cooling, distinguishes headache from the sun's heat from that from a bloody or bilious matter, and gives the principles of managing each; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.55-57}"
  ur: "ابن سینا کہتا ہے کہ گرم صداع کے علاج کا مقصد ٹھنڈک پہنچانا ہے، دھوپ کی گرمی سے ہونے والے صداع کو دموی یا صفراوی مادے سے ہونے والے سے الگ کرتا ہے، اور ہر ایک کی تدبیر کے اصول بتاتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.55-57}۔"
  es: "Ibn Sina afirma que el objetivo al tratar el dolor de cabeza por calor es enfriarlo, distingue el dolor de cabeza causado por el calor del sol del causado por una materia sanguinolenta o biliar, y da los principios para tratar cada uno; el registro tiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 pp.55-57}"
  fr: "Ibn Sina affirme que le but du traitement des céphalées dues à la chaleur est de les rafraîchir, distingue les céphalées causées par la chaleur du soleil de celles dues à une substance sanglante ou bilieuse, et donne les principes de traitement de chacune; le texte comporte une ligne légendée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.55-57}"
