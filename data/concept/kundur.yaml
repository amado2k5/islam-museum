summary:
  ar: "الكندر صمغ شجرة يُجلب من بلاد يذكرها الكتاب على البحر وفي الهند، وأجوده الأبيض الصلب الذي يلتهب بالنار، وهو عند الكتاب حار في الثانية مجفف في الأولى، ليس بقابض قوي، وينفع الجراح والقروح وحبس الدم."
  en: "Kundur is the resin of a tree, brought from a sea port the book calls al-Murbat and from India. The best is the white, hard kind that catches fire. The book classes it as hot in the second degree and dry in the first; it is not strongly astringent, and it is used for wounds, ulcers and to stop bleeding."
  ur: "کندر ایک درخت کا گوند ہے جو کتاب کے بیان کردہ سمندری بندرگاہ المرباط اور ہندوستان سے لایا جاتا ہے۔ سب سے اچھا سفید اور سخت قسم ہے جو آگ پکڑتی ہے۔ کتاب اسے دوسرے درجے میں گرم اور پہلے درجے میں خشک بتاتی ہے؛ یہ زیادہ کسیلا نہیں، اور زخموں، ناسوروں اور خون روکنے کے لیے کام آتا ہے۔"
  es: "El kundur es la resina de un árbol, traída de un puerto marítimo que el libro denomina al-Murbat y de la India. La mejor es la blanca y dura, que se incendia. El libro la clasifica como caliente en segundo grado y seca en primero; no es muy astringente y se usa para heridas, úlceras y para detener hemorragias."
  fr: "Le kundur est la résine d'un arbre, importée d'un port maritime nommé al-Murbat par le livre et d'Inde. La meilleure est la résine blanche et dure qui s'enflamme. Le livre la classe comme chaude au deuxième degré et sèche au premier; elle n'est pas fortement astringente et est utilisée pour soigner les plaies, les ulcères et arrêter les saignements."
