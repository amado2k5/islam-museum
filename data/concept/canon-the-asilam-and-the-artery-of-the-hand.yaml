summary:
  ar: "يذكر ابن سينا كيف يفصد الأسيلم ويجعل اليد في ماء حار ليجري الدم، ويذكر شريان ظهر الكف الذي رأى جالينوس في الرؤيا أن يفصده لوجع كبده {cite:canon-ibn-sina-print-v1 p.295}."
  en: "Ibn Sina says how the asilam is opened and the hand put in hot water so the blood flows, and mentions the artery on the back of the hand that Galen saw in a dream he should open for a pain in his liver {cite:canon-ibn-sina-print-v1 p.295}."
  es: "Ibn Sina dice cómo se abre el asilam y se pone la mano en agua caliente para que fluya la sangre, y menciona la arteria en el dorso de la mano que Galeno vio en un sueño que debía abrir para un dolor en el hígado {cite:canon-ibn-sina-print-v1 p.295}."
