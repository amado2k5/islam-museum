id: concept/wilayat-allah
class: concept
kind: belief
label: { ar: "ولاية الله للمؤمنين", en: "God's guardianship of the believers", ur: "مومنین کے لیے اللہ کی ولایت", es: "La protección divina de los creyentes", fr: "La protection divine des croyants", tr: "Tanrı'nın inananlar üzerindeki koruması", id: "Perlindungan Allah atas orang-orang beriman" }
summary:
  ar: "يرى الشعراوي أن ولاية الله للمؤمنين تبدأ بإقامة الأدلة قبل الإيمان، ثم بالنصر والمعونة مع الإيمان، ثم بالجزاء في الآخرة، وأن الظلمات والنور في الآية يعني الجهل والإيمان، وأن الذين كفروا يُخرجهم الطاغوت من النور إلى الظلمات {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  en: "Sha'rawi holds that God's guardianship of believers begins with setting out the proofs before faith, continues with help and support after it, and ends in reward in the Hereafter. He reads darkness and light as ignorance and faith, and holds that those who disbelieve are brought out from light to darkness by taghut {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  ur: "شعراوی کے نزدیک مومنین کے لیے اللہ کی ولایت ایمان سے پہلے دلائل پیش کرنے سے شروع ہوتی ہے، ایمان کے بعد مدد اور حمایت سے جاری رہتی ہے، اور آخرت میں اجر پر ختم ہوتی ہے۔ وہ اندھیرے اور نور کو جہالت اور ایمان کے معنی میں لیتے ہیں، اور کہتے ہیں کہ طاغوت کفار کو نور سے اندھیروں کی طرف لے جاتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}۔"
  es: "Sha'rawi sostiene que la protección de Dios sobre los creyentes comienza con la presentación de las pruebas antes de la fe, continúa con ayuda y apoyo después de ella, y termina con la recompensa en el Más Allá. Interpreta la oscuridad y la luz como ignorancia y fe, y sostiene que aquellos que no creen son llevados de la luz a la oscuridad por taghut {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  fr: "Sha'rawi soutient que la protection divine des croyants commence par la présentation des preuves avant la foi, se poursuit par l'aide et le soutien après celle-ci, et s'achève par la récompense dans l'au-delà. Il interprète les ténèbres et la lumière comme l'ignorance et la foi, et affirme que ceux qui ne croient pas sont fait passer de la lumière aux ténèbres par le taghut (voir Tafsir Shariwi Khawatir, vol. 2, p. 1118, 1119 et 1120)."
  tr: "El-Şa'ravi, Allah'ın müminler üzerindeki korumasının, imandan önce delillerin ortaya konmasıyla başladığına, ardından imanla birlikte zafer ve yardımla devam ettiğine, daha sonra ahiretteki mükafatla sona erdiğine ve ayetteki karanlık ve ışığın cehalet ve imanı ifade ettiğine, inkâr edenlerin ise zalim tarafından ışıktan karanlığa çıkarıldığına inanır. {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  id: "Al-Sha’rawi meyakini bahwa perlindungan Allah atas orang-orang beriman dimulai dengan menegakkan bukti-bukti sebelum beriman, kemudian dengan kemenangan dan pertolongan dalam beriman, lalu dengan pahala di akhirat, dan bahwa kegelapan dan cahaya dalam ayat tersebut berarti ketidaktahuan dan iman, dan bahwa orang-orang kafir dikeluarkan oleh si tiran dari cahaya ke dalam kegelapan. {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
