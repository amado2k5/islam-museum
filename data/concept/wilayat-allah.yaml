id: concept/wilayat-allah
class: concept
kind: belief
label: { ar: "ولاية الله للمؤمنين", en: "God's guardianship of the believers", ur: "مومنین کے لیے اللہ کی ولایت" }
summary:
  ar: "يرى الشعراوي أن ولاية الله للمؤمنين تبدأ بإقامة الأدلة قبل الإيمان، ثم بالنصر والمعونة مع الإيمان، ثم بالجزاء في الآخرة، وأن الظلمات والنور في الآية يعني الجهل والإيمان، وأن الذين كفروا يُخرجهم الطاغوت من النور إلى الظلمات {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  en: "Sha'rawi holds that God's guardianship of believers begins with setting out the proofs before faith, continues with help and support after it, and ends in reward in the Hereafter. He reads darkness and light as ignorance and faith, and holds that those who disbelieve are brought out from light to darkness by taghut {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}."
  ur: "شعراوی کے نزدیک مومنین کے لیے اللہ کی ولایت ایمان سے پہلے دلائل پیش کرنے سے شروع ہوتی ہے، ایمان کے بعد مدد اور حمایت سے جاری رہتی ہے، اور آخرت میں اجر پر ختم ہوتی ہے۔ وہ اندھیرے اور نور کو جہالت اور ایمان کے معنی میں لیتے ہیں، اور کہتے ہیں کہ طاغوت کفار کو نور سے اندھیروں کی طرف لے جاتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1118} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1119} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1120}۔"
