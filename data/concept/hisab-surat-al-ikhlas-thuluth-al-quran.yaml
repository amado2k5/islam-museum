id: concept/hisab-surat-al-ikhlas-thuluth-al-quran
class: concept
kind: doctrine
label:
  ar: "سورة الإخلاص تعدل ثلث القرآن"
  en: "Surat al-Ikhlas equals a third of the Qur'an"
  ur: "سورۂ اخلاص تہائی قرآن کے برابر"
summary:
  ar: "أخبر النبي أصحابه أنه سيقرأ عليهم ثلث القرآن، ثم قرأ سورة الإخلاص وقال إنها تعدل ثلث القرآن، عند مسلم [[passage/muslim-api-1888]] وفي الموطأ [[passage/muwatta-1-557]]. والنص معادلة لا عدد: يساوي بين عمل قصير وعمل طويل، ولا يذكر حسنات تُجمع، ولذلك تعرضه الآلة الحاسبة نتيجة مكتوبة."
  en: "The Prophet told his Companions that he would recite a third of the Qur'an to them, then recited Surat al-Ikhlas and said that it equals a third of the Qur'an, in Muslim [[passage/muslim-api-1888]] and in the Muwatta [[passage/muwatta-1-557]]. The text is an equation, not a number: it sets a short act equal to a long one and names no good deeds to add up, so the calculator shows it as a written result."
  ur: "نبی نے اپنے صحابہ کو بتایا کہ وہ انہیں تہائی قرآن سنائیں گے، پھر سورۂ اخلاص پڑھی اور فرمایا کہ یہ تہائی قرآن کے برابر ہے، مسلم میں [[passage/muslim-api-1888]] اور مؤطا میں [[passage/muwatta-1-557]]۔ یہ نص ایک مساوات ہے، عدد نہیں: یہ ایک مختصر عمل کو طویل عمل کے برابر قرار دیتی ہے اور جمع ہونے والی نیکیوں کا ذکر نہیں کرتی، اس لیے کیلکولیٹر اسے لکھا ہوا نتیجہ دکھاتا ہے۔"
