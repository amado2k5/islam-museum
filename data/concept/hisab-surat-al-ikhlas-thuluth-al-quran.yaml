id: concept/hisab-surat-al-ikhlas-thuluth-al-quran
class: concept
kind: doctrine
label:
  ar: "سورة الإخلاص تعدل ثلث القرآن"
  en: "Surat al-Ikhlas equals a third of the Qur'an"
  ur: "سورۂ اخلاص تہائی قرآن کے برابر"
  es: "La sura al-Ikhlas equivale a un tercio del Corán."
  fr: "La sourate al-Ikhlas équivaut à un tiers du Coran."
  tr: "İhla suresi, Kur'an'ın üçte birine eşittir"
  id: "Surah Al-Ikhlas setara dengan sepertiga dari Al-Qur'an"
summary:
  ar: "أخبر النبي أصحابه أنه سيقرأ عليهم ثلث القرآن، ثم قرأ سورة الإخلاص وقال إنها تعدل ثلث القرآن، عند مسلم [[passage/muslim-api-1888]] وفي الموطأ [[passage/muwatta-1-557]]. والنص معادلة لا عدد: يساوي بين عمل قصير وعمل طويل، ولا يذكر حسنات تُجمع، ولذلك تعرضه الآلة الحاسبة نتيجة مكتوبة."
  en: "The Prophet told his Companions that he would recite a third of the Qur'an to them, then recited Surat al-Ikhlas and said that it equals a third of the Qur'an, in Muslim [[passage/muslim-api-1888]] and in the Muwatta [[passage/muwatta-1-557]]. The text is an equation, not a number: it sets a short act equal to a long one and names no good deeds to add up, so the calculator shows it as a written result."
  ur: "نبی نے اپنے صحابہ کو بتایا کہ وہ انہیں تہائی قرآن سنائیں گے، پھر سورۂ اخلاص پڑھی اور فرمایا کہ یہ تہائی قرآن کے برابر ہے، مسلم میں [[passage/muslim-api-1888]] اور مؤطا میں [[passage/muwatta-1-557]]۔ یہ نص ایک مساوات ہے، عدد نہیں: یہ ایک مختصر عمل کو طویل عمل کے برابر قرار دیتی ہے اور جمع ہونے والی نیکیوں کا ذکر نہیں کرتی، اس لیے کیلکولیٹر اسے لکھا ہوا نتیجہ دکھاتا ہے۔"
  es: "El Profeta les dijo a sus Compañeros que les recitaría un tercio del Corán, luego recitó la Sura al-Ikhlas y dijo que equivale a un tercio del Corán, en Muslim [[passage/muslim-api-1888]] y en el Muwatta [[passage/muwatta-1-557]]. El texto es una ecuación, no un número: iguala una acción corta a una larga y no menciona buenas acciones para sumar, por lo que la calculadora lo muestra como un resultado escrito."
  fr: "Le Prophète annonça à ses Compagnons qu'il leur réciterait un tiers du Coran, puis récita la sourate Al-Ikhlas et affirma qu'elle équivalait à un tiers du Coran, comme indiqué dans Muslim [[passage/muslim-api-1888]] et dans Muwatta [[passage/muwatta-1-557]]. Ce texte est une équation, non un nombre: il établit l'égalité entre une action courte et une action longue, sans mentionner d'autres bonnes actions à additionner. C'est pourquoi une calculatrice affiche ce résultat sous forme écrite."
  tr: "Peygamber, sahabelerine Kur'an'ın üçte birini okuyacağını bildirdi, ardından İhla Suresi'ni okudu ve bunun Kur'an'ın üçte birine eşdeğer olduğunu söyledi; Müslüman [[passage/muslim-api-1888]] ve Al-Muwatta'da [[passage/muwatta-1-557]]. Metin bir sayı değil, bir denklemdir: kısa bir eylem ile uzun bir eyleme eşittir ve birikmiş iyi amallardan bahsetmez, bu yüzden hesaplayıcı yazılı bir sonucu gösterir."
  id: "Nabi memberitahu para sahabatnya bahwa ia akan membacakan sepertiga Al-Qur'an kepada mereka, lalu membaca Surah Al-Ikhlas dan berkata bahwa itu setara dengan sepertiga Al-Qur'an, menurut Muslim [[ayat/muslim-api-1888]] dan dalam Al-Muwatta [[ayat/muwatta-1-557]]. Teks ini adalah persamaan, bukan angka: sama dengan perbuatan singkat dan perbuatan panjang, dan tidak menyebutkan perbuatan baik yang terkumpul, sehingga kalkulator menampilkan hasil tertulis."
