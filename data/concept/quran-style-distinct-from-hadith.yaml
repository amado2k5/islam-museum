    id: sharawi-style-argument
    stance:
      ar: "اختلاف الأساليب دليل على أن القرآن من عند الله"
      en: "The difference of style is evidence that the Quran is from God"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي إن الشخصية الأسلوبية لكل إنسان واحدة ومميزة، ولا يكتب الإنسان بثلاثة أساليب متباينة {cite:tafsir-sharawi-khawatir-scan p.22}."
      en: "Sha'rawi says each person has one distinct stylistic personality and does not write in three contrasting styles {cite:tafsir-sharawi-khawatir-scan p.22}."
