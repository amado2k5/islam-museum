id: concept/quran-style-distinct-from-hadith
class: concept
kind: doctrine
label: { ar: "تميز أسلوب القرآن عن الحديث القدسي والحديث النبوي", en: "The distinct style of the Quran against the hadith qudsi and the hadith" }
summary:
  ar: "يستدل الشعراوي بأن للقرآن والحديث القدسي والحديث النبوي أساليب متميزة، وأن الإنسان له شخصية أسلوبية واحدة لا يستطيع أن يخرج منها، فلو كان القرآن من النبي لتشابهت أساليبه الثلاثة، وهذا التمايز دليل على أن القرآن من عند الله {cite:tafsir-sharawi-khawatir-scan p.22}. هذا استدلاله ويُنسب إليه، ولم تُعرض بعد آراء أهل الحديث وعلوم القرآن فيه."
  en: "Sha'rawi argues that the Quran, the hadith qudsi and the prophetic hadith each have a distinct style, and that a person has one stylistic personality which he cannot leave for long. If the Quran came from the Prophet, his three forms of speech would resemble each other, so the difference is evidence that the Quran is from God {cite:tafsir-sharawi-khawatir-scan p.22}. This is his argument and is attributed to him; the views of the scholars of hadith and of the sciences of the Quran are not yet presented."
