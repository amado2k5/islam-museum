label:
  ar: "قنقبين"
  en: "Qanqabin (castor oil, reported)"
  ur: "قنقبین"
  es: "Qanqabin (aceite de ricino, según informes)"
  fr: "Qanqabin (huile de ricin, selon les informations)"
  tr: "Gunnail"
  id: "Gunnail"
summary:
  ar: "قنقبين في الكتاب قيل إنه دهن الخروع، يصلح للجرب والقروح التي في الرأس وللأورام الحارة في المقعدة، وإذا شرب أسهل وأخرج الدود الذي في البطن {cite:canon-ibn-sina-print-v1 p.649}"
  en: "Qanqabin is in the book said to be the oil of the castor plant, suited to itch and the ulcers on the head and to hot swellings of the anus; when drunk it loosens and brings out the worms in the belly {cite:canon-ibn-sina-print-v1 p.649}"
  ur: "قنقبین کتاب میں کہا گیا ہے کہ ارنڈی کا تیل ہے، خارش اور سر کے قرحوں اور مقعد کے گرم ورموں کے لیے موزوں ہے، اور پیا جائے تو دست لاتا اور پیٹ کے کیڑے نکالتا ہے {cite:canon-ibn-sina-print-v1 p.649}۔"
  es: "En el libro se dice que el qanqabin es el aceite de la planta de ricino, adecuado para la picazón y las úlceras en la cabeza y para las inflamaciones calientes del ano; cuando se bebe, afloja y expulsa los gusanos del vientre {cite:canon-ibn-sina-print-v1 p.649}."
  fr: "Le Qanqabin est décrit dans le livre comme étant l'huile de ricin, indiquée pour soulager les démangeaisons et les ulcères de la tête ainsi que les gonflements chauds de l'anus; ingérée, elle délipide et expulse les vers intestinaux {cite:canon-ibn-sina-print-v1 p.649}"
  tr: "Kitapta Qanqabin, hint yağı olduğu, uyuz, baştaki yaralar ve anüste sıcak tümörler için uygun olduğu söylenir. İçildiğinde daha kolaydır ve midedeki solucanları dışarı atar {cite:canon-ibn-sina-print-v1 s.649}"
  id: "Qanqabin dalam buku tersebut dikatakan bahwa minyak jarak, cocok untuk kudis, luka di kepala, dan tumor panas di anus. Jika diminum, lebih mudah dan mengeluarkan cacing di lambung {cite:canon-ibn-sina-print-v1 hlm.649}"
