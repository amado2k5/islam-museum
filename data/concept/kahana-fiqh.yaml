id: concept/kahana-fiqh
class: concept
kind: legal
label:
  ar: "الكهانة (فقهياً)"
  en: "Soothsaying (kahana), fiqh rulings"
  ur: "کہانت (فقہی احکام)"
summary:
  ar: "الكهانة في اللغة من كهن: قضى له بالغيب، والكاهن من يتعاطى الخبر عن الكائنات في المستقبل ويدّعي معرفة الأسرار ومطالعة الغيب؛ وتطلقها العرب على من يقوم بأمر الرجل ويسعى في حاجته، كما يسمون كل من يتعاطى علماً دقيقاً كاهناً، وقد يسمى المنجم والطبيب كاهناً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13542}."
  en: "Kahana, in lexicon, is judging the unseen for someone; the kahin reports future events and claims to know secrets and to look into the unseen. The Arabs also used the word for one who manages a man's affairs and for any practitioner of a fine science, so that an astrologer or a physician could be called a kahin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13542}."
  ur: "کہانت لغت میں اس سے ہے کہ کسی کے لیے غیب کا فیصلہ کیا جائے؛ کاہن وہ ہے جو مستقبل کے واقعات کی خبر دیتا ہے اور رازوں اور غیب میں جھانکنے کا دعویٰ کرتا ہے۔ عرب اسے اس شخص کے لیے بھی بولتے تھے جو کسی کا کام سنبھالے، اور کسی بھی باریک علم کے ماہر کو، چنانچہ نجومی اور طبیب کو بھی کاہن کہا جاتا تھا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13542}۔"
