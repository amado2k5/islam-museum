id: concept/infirad
class: concept
kind: term
label: { ar: "الانفراد", en: "Infirad (acting alone, and when a power may be exercised by one of several holders)" }
summary:
  ar: "الانفراد لغة مصدر انفرد بمعنى تفرّد، ولا يخرج استعمال الفقهاء عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} ويقع في أبواب متعددة: فإذا اجتمع أولياء متساوون في الدرجة في تزويج امرأة فعند الشافعية والحنابلة يقرع بينهم، وعند المالكية ينظر الحاكم، وعند الحنفية يزوج كل منهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3517} وللوكيلين الانفراد بالتصرف إذا جعل الموكل ذلك لكل منهما، وعند الحنفية يجوز في ما لا يحتاج إلى رأي كالخصومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3518} وفي شركة العنان يجوز لأحد الشريكين عند الإطلاق أن ينفرد بالتصرف بإجماع الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519} ومنه عند الجمهور أن الموصى لهما معا لا ينفرد أحدهما ما لم ينص الموصي على جوازه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520}"
  en: "Infirad is lexically the reflexive of tafarrud, to stand alone, and the jurists use it in that sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} It arises in several places. Where equal guardians of a woman dispute who shall marry her, the Shafi'is and Hanbalis draw lots, the Malikis leave it to the judge, and the Hanafis allow each to marry her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3517} Two agents may act alone when the principal gives that power to each, and the Hanafis allow one to act alone in matters that need no joint judgement, such as litigation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3518} In a partnership of trade on general terms, each partner may act alone by agreement of the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519} Where a testator names two executors together, the majority hold that neither may act alone unless he allows it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520}"
