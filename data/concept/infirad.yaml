id: concept/infirad
class: concept
kind: term
label: { ar: "الانفراد", en: "Infirad (acting alone, and when a power may be exercised by one of several holders)", es: "Infirad (actuar solo, y cuando un poder puede ser ejercido por uno de varios titulares)", fr: "Infirad (agissant seul, et lorsqu'un pouvoir peut être exercé par l'un des nombreux détenteurs)", ur: "انفراد ⁦(تنہا کام کرنا، اور جب طاقت کا استعمال کئی حاملین میں سے ایک کر سکتا ہے)⁩", tr: "Tekel", id: "Monopoli" }
summary:
  ar: "الانفراد لغة مصدر انفرد بمعنى تفرّد، ولا يخرج استعمال الفقهاء عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} ويقع في أبواب متعددة: فإذا اجتمع أولياء متساوون في الدرجة في تزويج امرأة فعند الشافعية والحنابلة يقرع بينهم، وعند المالكية ينظر الحاكم، وعند الحنفية يزوج كل منهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3517} وللوكيلين الانفراد بالتصرف إذا جعل الموكل ذلك لكل منهما، وعند الحنفية يجوز في ما لا يحتاج إلى رأي كالخصومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3518} وفي شركة العنان يجوز لأحد الشريكين عند الإطلاق أن ينفرد بالتصرف بإجماع الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519} ومنه عند الجمهور أن الموصى لهما معا لا ينفرد أحدهما ما لم ينص الموصي على جوازه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520}"
  en: "Infirad is lexically the reflexive of tafarrud, to stand alone, and the jurists use it in that sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} It arises in several places. Where equal guardians of a woman dispute who shall marry her, the Shafi'is and Hanbalis draw lots, the Malikis leave it to the judge, and the Hanafis allow each to marry her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3517} Two agents may act alone when the principal gives that power to each, and the Hanafis allow one to act alone in matters that need no joint judgement, such as litigation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3518} In a partnership of trade on general terms, each partner may act alone by agreement of the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519} Where a testator names two executors together, the majority hold that neither may act alone unless he allows it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520}"
  es: "Infirad es léxicamente el reflexivo de tafarrud, estar solo, y los juristas lo usan en ese sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} Surge en varios lugares. Cuando los tutores iguales de una mujer disputan quién debe casarse con ella, los shafi'is y hanbalis echan suertes, los malikíes lo dejan en manos del juez, y los hanafis permiten que cada uno se case con ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3517} Dos agentes pueden actuar solos cuando el principal les da ese poder a cada uno, y los hanafis permiten que uno actúe solo en asuntos que no necesitan un juicio conjunto, como los litigios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3518} En una sociedad comercial en términos generales, cada socio puede actuar solo por acuerdo de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519} Cuando un testador nombra a dos albaceas juntos, la mayoría sostiene que ninguno puede actuar solo a menos que él lo autorice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520}"
  fr: "Infirad est le pronom réfléchi de tafarrud, signifiant « se tenir seul », et les juristes l'emploient dans ce sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515} Ce terme apparaît à plusieurs reprises. Lorsque des tuteurs égaux d'une femme se disputent le choix de son époux, les écoles chaféite et hanbalite procèdent par tirage au sort, les malikites s'en remettent au juge, et les hanafites autorisent chacun à l'épouser. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3515}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3517} Deux mandataires peuvent agir seuls lorsque le mandant leur confère ce pouvoir, et les hanafites autorisent l'un d'eux à agir seul dans les affaires ne nécessitant pas de décision conjointe, comme les litiges. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3518} Dans une société commerciale à conditions générales, chaque associé peut agir seul avec l'accord des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519} Lorsqu'un testateur désigne deux exécuteurs testamentaires conjointement, la majorité considère qu'aucun ne peut agir seul sans son autorisation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3519}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520}"
  ur: "انفراد لغوی طور پر تفرید کا اضطراب ہے، تنہا کھڑا ہونا، اور فقہاء اسے اسی معنی میں استعمال کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3515} یہ متعدد مقامات پر پیدا ہوتا ہے۔ جہاں عورت کے مساوی سرپرستوں میں جھگڑا ہو کہ کون اس سے شادی کرے گا، شافعی اور حنبلی قرعہ ڈالتے ہیں، مالکیہ اسے قاضی پر چھوڑ دیتے ہیں، اور حنفیہ ہر ایک کو اس سے شادی کرنے کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3515}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3516}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3517} دو ایجنٹس اکیلے عمل کرنے کی اجازت دے سکتے ہیں جب کہ حنف کو اختیار دیا جائے کہ وہ اکیلے ہی عمل کرے۔ ایسے معاملات میں جن میں مشترکہ فیصلے کی ضرورت نہیں ہے، جیسے قانونی چارہ جوئی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3518} عام شرائط پر تجارت کی شراکت میں، ہر شراکت دار فقہا کے اتفاق سے اکیلے کام کرسکتا ہے۔ {حوالہ:فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 3519} جہاں وصیت کرنے والے نے دو عمل کرنے والوں کے نام اکٹھے کیے ہیں، اکثریت کا خیال ہے کہ جب تک وہ اجازت نہ دے اکیلا کام نہیں کرسکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3519}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3520}"
  tr: "Fiil isimi 'tafarud' (tekillik) olup, benzersizlik anlamına gelir ve hukukçuların kullanımı bundan sapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3515} Çeşitli kategorilere ayrılır: Eşit rütbedeki vasiler bir kadını evlendirmek için buluşursa, Şafiiler ve Hanbali'lere göre kur onların arasında verilir; Malikilere göre yargıç kabul edilir; Hanefilere göre ise her biri evlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3515}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3516} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3517} İki aklimin, müdür bunu her birine verirse hareket etme takdirine sahip ve Hanefi okuluna göre, görüş gerektirmeyen durumlarda, örneğin uyuşmazlıkta bu mümkündür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3518} Al-Anan ortaklığında, ortaklardan biri hukukçuların mutabakatıyla tek başına hareket edebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3519} Çoğunluk tarafından anlaşıldığı üzere, vasiyet sahibi açıkça izin verilmedikçe her iki tarafa da bırakılacak mirasın münhasır değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3520}"
  id: "Kata benda kata adalah 'tafarud' (singularitas) yang berarti keunikan, dan penggunaan kata ahli hukum tidak menyimpang darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3515} Kata benda ini terbagi dalam beberapa kategori: Jika wali dengan pangkat setara bertemu untuk menikahkan seorang wanita, menurut Shafi'i dan Hanbali, undian dipilih di antara mereka; menurut Maliki, hakim dianggap; dan menurut Hanafi, masing-masing menikah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3515} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3516} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3517} Kedua agen memiliki kebebasan penuh untuk bertindak jika prinsipal menyerahkan kepada masing-masing pihak, dan menurut mazhab Hanafi, hal ini diperbolehkan dalam kasus yang tidak memerlukan pendapat, seperti perselisihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3518} Dalam kasus kemitraan Al-Anan, salah satu mitra dapat bertindak sendiri atas konsensus para ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3519} Mayoritas memahami bahwa warisan kepada kedua pihak tidak eksklusif kecuali pewasiat secara eksplisit menyatakan diperbolehkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520}"
