label:
  ar: العرش
  en: The Throne (al-Arsh)
  fr: "Le Trône (al-Arsh)"
  ur: عرش
  es: "El Trono (al-Arsh)"
summary:
  ur: "سب سے عظیم مخلوق اور ساری مخلوقات کی چھت؛ رحمٰن اس پر اسوٰی فرماتا ہے جیسا اس کے لیے لائق ہے، بغیر کیف اور تشبیہ کے۔"
  ar: "العرش في العقيدة أعظم المخلوقات؛ نصّ الطحاوي على أن «العرش والكرسي حقّ، وهو مستغنٍ عن العرش وما دونه» {cite:aqida-tahawiyya}."
  en: "The Throne in creed is the greatest of created things; al-Tahawi states that 'the Throne and the Footstool are real, and He is free of need of the Throne and what is beneath it' {cite:aqida-tahawiyya}."
  fr: "Dans la doctrine islamique, le Trône est la plus grande des choses créées. Al-Tahawi affirme que « le Trône et le Repose-pied sont réels, et Dieu n’a besoin ni du Trône ni de ce qui se trouve en dessous » {cite:aqida-tahawiyya}."
  es: "En el credo, el Trono es la mayor de las cosas creadas; al-Tahawi afirma que \"el Trono y el Escabel son reales, y Él no necesita del Trono ni de lo que hay debajo de él\" {cite:aqida-tahawiyya}."
