  ur: "یاسمین ⁦(چمیلی)⁩"
  es: "Jazmín"
  fr: "Yasmin (jasmin)"
summary:
  ar: "الياسمين، يصفه الكتاب بأنه حار يابس في الثانية، يلطّف الرطوبات، ودهنه نافع للمشايخ، ويذهب الكلف إذا غُسل به الوجه في الحمام."
  en: "Jasmine, which the book describes as hot and dry in the second degree, dissolving the humours; its oil benefits the elderly, and washing the face with it in the bath removes freckles."
  ur: "چمیلی، جسے کتاب دوسرے درجے میں گرم اور خشک بتاتی ہے؛ یہ رطوبتوں کو لطیف کرتی ہے، اس کا تیل بزرگوں کے لیے مفید ہے، اور حمام میں چہرہ دھونے سے جھائیاں دور ہوتی ہیں۔"
  es: "El jazmín, que el libro describe como cálido y seco en segundo grado, disuelve los humores; su aceite beneficia a los ancianos, y lavarse la cara con él en el baño elimina las pecas."
  fr: "Le jasmin, que le livre décrit comme chaud et sec au deuxième degré, dissolvant les humeurs; son huile est bénéfique aux personnes âgées, et se laver le visage avec cette huile dans le bain enlève les taches de rousseur."
