label: { ar: "تقدير مقدار الدواء من طبيعة العضو عند ابن سينا", en: "Reckoning the dose from the nature of the organ in the Canon", ur: "عضو کی طبیعت سے دوا کی مقدار کا اندازہ قانون میں" }
summary:
  ar: "يقرر ابن سينا أن مقدار الدواء يعرف بالحدس الصناعي من طبيعة العضو ومن مقدار المرض ومن الأشياء التي تدل بملاءمتها، وهي الجنس والسن والعادة والفصل والبلد والصناعة والقوة والسحنة، وأن معرفة طبيعة العضو تتضمن أربعة أمور: مزاجه وخلقته ووضعه وقوته {cite:canon-ibn-sina-print-v1 pp.268-269}."
  en: "Ibn Sina states that the amount of a drug is known by artful conjecture from the nature of the organ, the size of the disease and the things that indicate by their fitness, namely sex, age, habit, season, country, craft, strength and complexion, and that knowing the nature of an organ takes in four matters: its temperament, its creation, its position and its strength {cite:canon-ibn-sina-print-v1 pp.268-269}."
