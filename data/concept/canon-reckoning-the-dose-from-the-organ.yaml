id: concept/canon-reckoning-the-dose-from-the-organ
class: concept
kind: scientific
label:
  ar: "تقدير مقدار الدواء من طبيعة العضو عند ابن سينا"
  en: "Reckoning the dose from the nature of the organ in the Canon"
  fr: "Estimer la dose selon la nature de l’organe dans le Canon"
  ur: "عضو کی طبیعت سے دوا کی مقدار کا اندازہ قانون میں"
  es: "Calcular la dosis según la naturaleza del órgano en el Canon"
summary:
  ar: "يقرر ابن سينا أن مقدار الدواء يعرف بالحدس الصناعي من طبيعة العضو ومن مقدار المرض ومن الأشياء التي تدل بملاءمتها، وهي الجنس والسن والعادة والفصل والبلد والصناعة والقوة والسحنة، وأن معرفة طبيعة العضو تتضمن أربعة أمور: مزاجه وخلقته ووضعه وقوته {cite:canon-ibn-sina-print-v1 pp.268-269}."
  en: "Ibn Sina states that the amount of a drug is known by artful conjecture from the nature of the organ, the size of the disease and the things that indicate by their fitness, namely sex, age, habit, season, country, craft, strength and complexion, and that knowing the nature of an organ takes in four matters: its temperament, its creation, its position and its strength {cite:canon-ibn-sina-print-v1 pp.268-269}."
  fr: "Ibn Sina estime la quantité d’un remède par conjecture raisonnée : nature de l’organe, ampleur de la maladie et éléments de convenance — sexe, âge, habitude, saison, pays, métier, forces et teint. La nature de l’organe comprend tempérament, constitution, position et force {cite:canon-ibn-sina-print-v1 pp.268-269}."
  es: "Ibn Sina afirma que la cantidad de un medicamento se conoce mediante una ingeniosa conjetura a partir de la naturaleza del órgano, el tamaño de la enfermedad y las cosas que indican su idoneidad, a saber, sexo, edad, hábito, estación, país, oficio, fuerza y complexión, y que conocer la naturaleza de un órgano abarca cuatro aspectos: su temperamento, su creación, su posición y su fuerza {cite:canon-ibn-sina-print-v1 pp.268-269}."
