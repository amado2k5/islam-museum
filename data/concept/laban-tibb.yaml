label:
  ar: "لبن"
  en: "Laban (milk)"
  ur: "لبن"
  es: "Labán (leche)"
  fr: "Laban (lait)"
  tr: "Süt"
  id: "Susu"
summary:
  ar: "اللبن مركب من جواهر ثلاثة مائية وجبنية ودسومة، وأفضله لبن النساء، يعدل الكيموسات ويغذي ويقوي البدن، ويختلف بحسب الحيوان والفصل والمرعى، وفي الكتاب تفصيل طويل لمنافعه ومضاره بحسب الأعضاء {cite:canon-ibn-sina-print-v1 p.546} {cite:canon-ibn-sina-print-v1 p.550}."
  en: "Milk is composed of three substances, watery, cheesy and fatty; the best is woman's milk, and it balances the humours, nourishes and strengthens the body, varying with the animal, the season and the pasture; the book gives a long account of its benefits and harms by organ {cite:canon-ibn-sina-print-v1 p.546} {cite:canon-ibn-sina-print-v1 p.550}."
  ur: "دودھ تین جوہروں سے مرکب ہے: آبی، پنیری اور چکنائی؛ بہترین عورت کا دودھ ہے، یہ اخلاط کو معتدل کرتا، غذا دیتا اور بدن کو قوت دیتا ہے، اور جانور، موسم اور چراگاہ کے مطابق بدلتا ہے؛ کتاب اعضاء کے لحاظ سے اس کے فوائد اور نقصانات کی طویل تفصیل دیتی ہے {cite:canon-ibn-sina-print-v1 p.546} {cite:canon-ibn-sina-print-v1 p.550}۔"
  es: "La leche se compone de tres sustancias: acuosa, láctea y grasa; la mejor es la leche materna, que equilibra los humores, nutre y fortalece el cuerpo, variando según el animal, la estación y el pasto; el libro ofrece una larga descripción de sus beneficios y perjuicios por órgano {cite:canon-ibn-sina-print-v1 p.546} {cite:canon-ibn-sina-print-v1 p.550}."
  fr: "Le lait est composé de trois substances: aqueuse, fromagère et grasse; le meilleur est le lait de la femme, et il équilibre les humeurs, nourrit et fortifie le corps, variant selon l'animal, la saison et le pâturage; le livre donne un long compte rendu de ses bienfaits et de ses méfaits par organe {cite:canon-ibn-sina-print-v1 p.546} {cite:canon-ibn-sina-print-v1 p.550}."
  tr: "Süt üç maddeden oluşur: su, peynir ve yağ. En iyisi kadın sütüdür. Kimoları dengeler, besler ve vücudu güçlendirir, hayvan, ürün ve otlak türüne göre değişir. Kitap, faydalarını ve zararlarını organlara göre ayrıntılı şekilde açıklar {cite:canon-ibn-sina-print-v1 s.546} {cite:canon-ibn-sina-print-v1 s.550}."
  id: "Susu terdiri dari tiga zat: air, keju, dan lemak. Yang terbaik adalah susu wanita. Susu ini menyeimbangkan chymos, menutrisi, dan memperkuat tubuh, serta bervariasi tergantung pada hewan, tanaman, dan padang rumput. Buku ini memberikan penjelasan rinci tentang manfaat dan kerugian susu tersebut menurut organ {cite:canon-ibn-sina-print-v1 hlm.546} {cite:canon-ibn-sina-print-v1 hlm.550}."
