summary:
  ar: "اللبن مركب من جواهر ثلاثة مائية وجبنية ودسومة، وأفضله لبن النساء، يعدل الكيموسات ويغذي ويقوي البدن، ويختلف بحسب الحيوان والفصل والمرعى، وفي الكتاب تفصيل طويل لمنافعه ومضاره بحسب الأعضاء {cite:canon-ibn-sina-print-v1 p.546} {cite:canon-ibn-sina-print-v1 p.550}."
  en: "Milk is composed of three substances, watery, cheesy and fatty; the best is woman's milk, and it balances the humours, nourishes and strengthens the body, varying with the animal, the season and the pasture; the book gives a long account of its benefits and harms by organ {cite:canon-ibn-sina-print-v1 p.546} {cite:canon-ibn-sina-print-v1 p.550}."
  ur: "دودھ تین جوہروں سے مرکب ہے: آبی، پنیری اور چکنائی؛ بہترین عورت کا دودھ ہے، یہ اخلاط کو معتدل کرتا، غذا دیتا اور بدن کو قوت دیتا ہے، اور جانور، موسم اور چراگاہ کے مطابق بدلتا ہے؛ کتاب اعضاء کے لحاظ سے اس کے فوائد اور نقصانات کی طویل تفصیل دیتی ہے {cite:canon-ibn-sina-print-v1 p.546} {cite:canon-ibn-sina-print-v1 p.550}۔"
