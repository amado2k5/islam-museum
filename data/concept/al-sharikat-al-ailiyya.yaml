summary:
  ar: "الشركات العائلية كما يعرضها طارق السويدان في درس الإدارة العملية: إحصاءات انتشارها في الخليج وانهيارها مع الجيل الثاني، وأسباب الفشل التي يذكرها — بينها رأي متنازع عليه عن تدخل النساء — وتشخيصه للعلاج بالتدريب أو الانسحاب."
  en: "Family businesses as Tareq al-Suwaidan presents them in his Practical Administration lesson: his figures for their spread in the Gulf and their collapse in the second generation, the causes he names — among them a contested claim about women's intervention — and his remedy of training or withdrawal."
  fr: "Les entreprises familiales telles que Tareq al-Suwaidan les présente dans sa leçon d’administration pratique : ses chiffres sur leur présence dans le Golfe et leur effondrement à la deuxième génération, les causes qu’il avance — dont une affirmation contestée sur l’intervention des femmes — et la solution qu’il propose : se former ou se retirer."
  ur: "خاندانی کمپنیاں جیسا کہ طارق السویدان اپنے عملی انتظامیہ کے درس میں پیش کرتے ہیں: خلیج میں ان کے پھیلاؤ اور دوسری نسل میں ان کے خاتمے کے اعداد و شمار، اسبابِ ناکامی — جن میں خواتین کے مداخلت پر ایک متنازع دعویٰ بھی ہے — اور تربیت یا دستبرداری کا علاج۔"
  es: "Las empresas familiares, tal como las presenta Tareq al-Suwaidan en su lección de Administración Práctica: sus cifras sobre su expansión en el Golfo y su colapso en la segunda generación, las causas que menciona —entre ellas una controvertida afirmación sobre la intervención femenina— y su solución de formación o retirada."
  tr: "Tariq Al-Suwaidan tarafından pratik yönetim dersinde sunulan aile işletmeleri: Körfez'deki yayılmalarına dair istatistikler ve ikinci nesille çöküşleri, başarısızlıklarının nedenleri — kadın müdahalesi hakkında tartışmalı görüş de dahil — ve tedavi teşhisi eğitim veya geri çekilme yoluyla."
  id: "Bisnis keluarga yang disajikan dalam pelajaran manajemen praktis oleh Tariq Al-Suwaidan: Statistik tentang penyebaran mereka di Teluk dan kehancurannya dengan generasi kedua, alasan kegagalan mereka — termasuk pandangan kontroversial tentang intervensi perempuan — dan diagnosis pengobatan melalui pendidikan atau penarikan."
