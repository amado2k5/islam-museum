summary:
  ar: "يعرّف البتاني ببحر بنطس الممتد من لاذقة إلى القسطنطينية العظمى، طوله ألف وستون ميلاً وعرضه ثلثمائة ميل، يدخل فيه نهر طنايس من الشمال من بحيرة، ويخرج منه عند القسطنطينية خليج كأنه نهر يصب في بحر مصر وعرضه هناك نحو ثلاثة أميال. ويذكر بحر جرجان وهو بحر الباب، طوله ثمانمائة ميل من الغرب إلى الشرق وعرضه ستمائة. {cite:zij-sabi-nallino-byblion p.31}."
  en: "Al-Battani introduces the sea of Bontos, running from Laziqa to great Constantinople, one thousand and sixty miles long and three hundred wide; into it from the north runs the river Tanais out of a lake, and at Constantinople a gulf leaves it like a river and pours into the sea of Egypt, about three miles wide there. He also names the sea of Jurjan, the sea of al-Bab, eight hundred miles from west to east and six hundred wide. {cite:zij-sabi-nallino-byblion p.31}."
  ur: "البتانی بحر بنطس کا تعارف کراتے ہیں جو لاذقہ سے قسطنطنیہ العظمیٰ تک پھیلا ہے، ایک ہزار ساٹھ میل لمبا اور تین سو میل چوڑا؛ اس میں شمال کی طرف سے نہر طنایس ایک جھیل سے گرتی ہے، اور قسطنطنیہ پر اس سے ایک خلیج نکلتا ہے گویا نہر ہو جو بحر مصر میں گرتا ہے اور وہاں اس کی چوڑائی تقریباً تین میل ہے۔ وہ بحر جرجان یعنی بحر الباب کا بھی ذکر کرتے ہیں جس کا طول مغرب سے مشرق آٹھ سو میل اور عرض چھ سو ہے۔ {cite:zij-sabi-nallino-byblion p.31}۔"
  es: "Al-Battani describe el mar de Bontos, que se extiende desde Laziqa hasta la gran Constantinopla, con una longitud de mil sesenta millas y una anchura de trescientas. En él desemboca el río Tanais desde un lago, y en Constantinopla un golfo lo separa como un río y vierte sus aguas en el mar de Egipto, que allí tiene una anchura de unas tres millas. También menciona el mar de Jurjan, el mar de al-Bab, que se extiende de oeste a este y tiene una anchura de seiscientas millas. {cite:zij-sabi-nallino-byblion p.31}."
  fr: "Al-Battani décrit la mer de Bontos, qui s'étend de Laziqa à Constantinople, longue de mille soixante milles et large de trois cents milles. Le fleuve Tanaïs, qui prend sa source dans un lac au nord, s'y jette. À Constantinople, un golfe la sépare de ce lac, qui se transforme en rivière, pour se déverser dans la mer d'Égypte, large d'environ trois milles à cet endroit. Il nomme également la mer de Jurjan, la mer d'al-Bab, longue de huit cents milles d'ouest en est et large de six cents milles. {cite:zij-sabi-nallino-byblion p.31}."
  tr: "El-Battani, Latakia'dan İstanbul'a uzanan Pontus Denizi'ni 1060 mil uzunluğunda ve 300 mil genişliğinde olarak tanımlar. Tanais Nehri kuzeyden denize girerek bir göl oluşturur ve İstanbul yakınlarında, Akdeniz'e dökülen, nehre benzeyen bir körfez oluşur. Buradaki genişliği yaklaşık üç mildir. Ayrıca, batıdan doğuya 800 mil uzunluğunda ve 600 mil genişliğinde olan, Bab Denizi olarak da bilinen Jurjan Denizi'nden de bahseder. {cite:zij-sabi-nallino-byblion s.31}."
  id: "Al-Battani menggambarkan Laut Pontus, yang membentang dari Latakia hingga Konstantinopel, memiliki panjang 1.060 mil dan lebar 300 mil. Sungai Tanais memasuki laut ini dari utara, membentuk danau, dan sebuah teluk, menyerupai sungai, mengalir keluar darinya di dekat Konstantinopel, bermuara ke Laut Mediterania. Lebarnya di sana sekitar tiga mil. Ia juga menyebutkan Laut Jurjan, juga dikenal sebagai Laut Bab, yang panjangnya 800 mil dari barat ke timur dan lebarnya 600 mil. {cite:zij-sabi-nallino-byblion p.31}."
