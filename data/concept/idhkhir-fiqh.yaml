  en: "Idhkhir (a sweet-scented plant exempted from the ban on cutting in the sanctuary of Mecca)"
  ur: "اذخر (خوشبودار گھاس، جو حرمِ مکہ میں درخت کاٹنے کی ممانعت سے مستثنیٰ ہے)"
summary:
  ar: "الإذخر نبات طيب الرائحة يجوز قطعه من حرم مكة استثناء من تحريم قطع شجره، للحاجة إليه، ويشترط ألا يستعمل في التطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2023}"
  en: "Idhkhir is a sweet-scented plant that may be cut in the sanctuary of Mecca, which otherwise forbids cutting its trees, because of the need for it; it may not be used for perfume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2023}"
  ur: "اذخر خوشبودار گھاس ہے جسے حرمِ مکہ میں درخت کاٹنے کی ممانعت سے استثناء حاصل ہے، ضرورت کی بنا پر کاٹنا جائز ہے، مگر خوشبو لگانے میں استعمال نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2023}"
