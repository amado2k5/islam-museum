  en: "Cassiopeia"
  ur: "ذات الکرسی"
  es: "Casiopea"
  fr: "Cassiopée"
  tr: "Sandalye"
  id: "Kursi"
summary:
  ar: "يذكر الفهرس صورة ذات الكرسي قبل صورة فرساوس، ويبدأ بالكوكب الذي على رأسها، ثم الذي في صدرها، والكوكب الشمالي منها الذي على شقها، والذي على ركبتها. ثم يذكر الكواكب التي في وسط الكرسي وفوق رجله. {cite:zij-sabi-nallino-byblion pp.250}"
  en: "The catalogue gives Dhat al-Kursi, the Lady of the Chair, before Perseus. Its entries begin with the star on her head, then the star on her chest, the northern star on her side, and the star on her knee, followed by the stars in the middle of the chair and above its leg. {cite:zij-sabi-nallino-byblion pp.250}"
  ur: "فہرست ذات الکرسی یعنی کرسی والی کو فرساوس سے پہلے رکھتی ہے۔ اس کے ستارے سر والے سے شروع ہوتے ہیں، پھر سینے والا، اس کے پہلو پر شمالی ستارہ، گھٹنے والا، اور پھر کرسی کے بیچ اور اس کی ٹانگ کے اوپر والے ستارے۔ {cite:zij-sabi-nallino-byblion pp.250}"
  es: "El catálogo presenta a Dhat al-Kursi, la Dama de la Silla, ante Perseo. Sus entradas comienzan con la estrella sobre su cabeza, seguida de la estrella sobre su pecho, la estrella polar sobre su costado y la estrella sobre su rodilla, y finalmente las estrellas en el centro de la silla y sobre su pata. {cite:zij-sabi-nallino-byblion pp.250}"
  fr: "Le catalogue place Dhat al-Kursi, la Dame du Trône, avant Persée. Les entrées commencent par l'étoile sur sa tête, puis celle sur sa poitrine, l'étoile polaire sur son flanc et celle sur son genou, suivies des étoiles au milieu du trône et au-dessus de son pied. {cite:zij-sabi-nallino-byblion pp.250}"
  tr: "Dizin, Perseus'un resminden önce Cassiopeia'nın resmini listeliyor; önce başındaki gezegen, sonra göğsündeki gezegen, yanındaki en kuzeydeki gezegen ve son olarak dizindeki gezegen. Ardından tahtın ortasındaki ve bacağının üzerindeki gezegenleri listeliyor. {cite:zij-sabi-nallino-byblion pp.250}"
  id: "Indeks tersebut mencantumkan gambar Cassiopeia sebelum gambar Perseus, dimulai dengan planet di kepalanya, kemudian planet di dadanya, planet paling utara di sisinya, dan planet di lututnya. Kemudian, indeks tersebut mencantumkan planet-planet di tengah singgasana dan di atas kakinya. {cite:zij-sabi-nallino-byblion pp.250}"
