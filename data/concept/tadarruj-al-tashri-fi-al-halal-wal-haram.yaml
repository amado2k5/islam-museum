id: concept/tadarruj-al-tashri-fi-al-halal-wal-haram
class: concept
kind: legal
label:
  ar: "التدرج في تشريع الحلال والحرام"
  en: "The gradual revelation of the lawful and the unlawful"
  ur: "حلال و حرام کی تشریع میں تدریج"
  es: "La revelación gradual de lo lícito y lo ilícito."
  fr: "La révélation progressive du licite et de l'illicite"
  tr: "Helal ve Haram'ın Kademeli Yasalaştırılması"
  id: "Legislasi Bertahap Halal dan Haram"
summary:
  ar: "تروي عائشة أن أول ما نزل من القرآن سورة من المفصل فيها ذكر الجنة والنار، حتى إذا ثاب الناس إلى الإسلام نزل الحلال والحرام، ولو نزل أولاً النهي عن الخمر لقالوا لا ندعها أبداً [[passage/bukhari-api-4993|صحيح البخاري 4993]] {cite:sahih-al-bukhari 4993}. وتروي الأخبار أن عمر سأل بياناً شافياً في الخمر فنزلت آية البقرة ثم آية النساء [[passage/nasai-api-5540|سنن النسائي 5540]] {cite:sunan-al-nasai 5540}، وأن الناس لما حُرّمت الخمر أراقوا ما عندهم [[passage/bukhari-api-4620|صحيح البخاري 4620]] {cite:sahih-al-bukhari 4620}. ونهى النبي يوم خيبر عن لحوم الحمر الأهلية [[passage/tirmidhi-api-1478|جامع الترمذي 1478]] {cite:jami-al-tirmidhi 1478}، وقال إن الوعاء لا يحل شيئاً ولا يحرمه [[passage/tirmidhi-api-1869|جامع الترمذي 1869]] {cite:jami-al-tirmidhi 1869}. وذكر القرآن أن طيبات كانت حلالاً حُرّمت على اليهود [[passage/quran-4-160|النساء 160]] {cite:tanzil-quran}."
  en: "Aisha reports that the first thing sent down of the Qur'an was a sura of the mufassal that mentions Paradise and the Fire, until, once people had turned to Islam, the lawful and the unlawful came down, and that had the ban on wine come first they would have said they would never give it up [[passage/bukhari-api-4993|Sahih al-Bukhari 4993]] {cite:sahih-al-bukhari 4993}. The reports say that Umar asked for a healing explanation about wine, that the verse of al-Baqara came down and then the verse of al-Nisa' [[passage/nasai-api-5540|Sunan al-Nasa'i 5540]] {cite:sunan-al-nasai 5540}, and that when wine was forbidden people poured out what they had [[passage/bukhari-api-4620|Sahih al-Bukhari 4620]] {cite:sahih-al-bukhari 4620}. The Prophet forbade the flesh of domestic donkeys on the day of Khaybar [[passage/tirmidhi-api-1478|Jami' al-Tirmidhi 1478]] {cite:jami-al-tirmidhi 1478}, and said that a vessel makes nothing lawful or unlawful [[passage/tirmidhi-api-1869|Jami' al-Tirmidhi 1869]] {cite:jami-al-tirmidhi 1869}. The Qur'an says that good things which had been lawful were forbidden to the Jews [[passage/quran-4-160|al-Nisa' 160]] {cite:tanzil-quran}."
  ur: "عائشہ روایت کرتی ہیں کہ قرآن میں سب سے پہلے مفصل کی ایک سورت اتری جس میں جنت اور دوزخ کا ذکر ہے، یہاں تک کہ جب لوگ اسلام کی طرف لوٹ آئے تو حلال و حرام اترا، اور اگر پہلے شراب کی ممانعت اترتی تو وہ کہتے کہ ہم اسے کبھی نہیں چھوڑیں گے [[passage/bukhari-api-4993|صحیح بخاری 4993]] {cite:sahih-al-bukhari 4993}۔ روایات میں ہے کہ عمر نے شراب کے بارے میں شافی بیان مانگا تو سورۂ بقرہ کی آیت اتری، پھر سورۂ نساء کی آیت [[passage/nasai-api-5540|سنن نسائی 5540]] {cite:sunan-al-nasai 5540}، اور جب شراب حرام ہوئی تو لوگوں نے جو ان کے پاس تھی بہا دی [[passage/bukhari-api-4620|صحیح بخاری 4620]] {cite:sahih-al-bukhari 4620}۔ نبی نے خیبر کے دن پالتو گدھوں کے گوشت سے منع کیا [[passage/tirmidhi-api-1478|جامع ترمذی 1478]] {cite:jami-al-tirmidhi 1478}، اور فرمایا کہ برتن نہ کسی چیز کو حلال کرتا ہے نہ حرام [[passage/tirmidhi-api-1869|جامع ترمذی 1869]] {cite:jami-al-tirmidhi 1869}۔ قرآن کہتا ہے کہ پاکیزہ چیزیں جو حلال تھیں یہود پر حرام کی گئیں [[passage/quran-4-160|النساء 160]] {cite:tanzil-quran}۔"
  es: "Aisha relata que lo primero que se reveló del Corán fue una sura del mufassal que menciona el Paraíso y el Fuego, hasta que, una vez que la gente se convirtió al Islam, se revelaron lo lícito y lo ilícito, y que si la prohibición del vino hubiera llegado primero, habrían dicho que nunca lo abandonarían [[passage/bukhari-api-4993|Sahih al-Bukhari 4993]] {cite:sahih-al-bukhari 4993}. Los informes dicen que Umar pidió una explicación curativa sobre el vino, que descendió el versículo de al-Baqara y luego el versículo de al-Nisa' [[passage/nasai-api-5540|Sunan al-Nasa'i 5540]] {cite:sunan-al-nasai 5540}, y que cuando se prohibió el vino la gente derramó lo que tenía [[passage/bukhari-api-4620|Sahih al-Bukhari 4620]] {cite:sahih-al-bukhari 4620}. El Profeta prohibió la carne de asnos domésticos el día de Khaybar [[passage/tirmidhi-api-1478|Jami' al-Tirmidhi 1478]] {cite:jami-al-tirmidhi 1478}, y dijo que un recipiente no hace nada lícito ni ilícito [[passage/tirmidhi-api-1869|Jami' al-Tirmidhi 1869]] {cite:jami-al-tirmidhi 1869}. El Corán dice que las cosas buenas que habían sido lícitas fueron prohibidas para los judíos [[passage/quran-4-160|al-Nisa' 160]] {cite:tanzil-quran}."
  fr: "Aïcha rapporte que la première chose révélée du Coran fut une sourate du mufassal qui mentionne le Paradis et le Feu, jusqu'à ce que, une fois que les gens se furent tournés vers l'Islam, le licite et l'illicite soient révélés, et que si l'interdiction du vin était venue en premier, ils auraient dit qu'ils n'y renonceraient jamais [[passage/bukhari-api-4993|Sahih al-Bukhari 4993]] {cite:sahih-al-bukhari 4993}. Les récits rapportent qu'Umar demanda une explication curative concernant le vin, que le verset d'al-Baqara fut révélé, puis le verset d'al-Nisa' [[passage/nasai-api-5540|Sunan al-Nasa'i 5540]] {cite:sunan-al-nasai 5540}, et que lorsque le vin fut interdit, les gens jetèrent ce qu'ils possédaient [[passage/bukhari-api-4620|Sahih al-Bukhari 4620]] {cite:sahih-al-bukhari 4620}. Le Prophète a interdit la consommation de viande d'âne domestique le jour de Khaybar [[passage/tirmidhi-api-1478|Jami' al-Tirmidhi 1478]] {cite:jami-al-tirmidhi 1478}, et a dit qu'un récipient ne rend rien licite ou illicite [[passage/tirmidhi-api-1869|Jami' al-Tirmidhi 1869]] {cite:jami-al-tirmidhi 1869}. Le Coran rapporte que des choses bonnes qui étaient licites ont été interdites aux Juifs [[passage/quran-4-160|al-Nisa' 160]] {cite:tanzil-quran}."
  tr: "Aişe, Kur'an'ın ilk suresinin Mufassal'da Cennet ve Cehennemden bahsedildiğini anlatır; böylece insanlar İslam'a döndüklerinde yasal ve zalim ortaya çıkmıştır. Eğer alkol yasağı önce vahyedilseydi, 'Asla terk etmeyeceğiz' derlerdi [[passage/bukhari-api-4993|Sahih al-Bukhari 4993]] {atıf:Sahih-al-Buhari 4993}. Raporlar, Umar'ın şarap hakkında açık bir açıklama istediğini, bunun üzerine El-Bekarah ayetinin vahy olduğunu, ardından En-Nisa ayetinin [[pasaj/nasai-api-5540|Sunan an-Nasa'i 5540]] {cite:sunan-al-nasai 5540} ve şarap yasak olduğunda insanların içtiklerini döktüklerini anlatır [[passage/bukhari-api-4620|Sahih al-Bukhari 4620]] {cite:sahih-al-bukhari 4620}. Haybar gününde Peygamber, evcil eşek etini yasakladı [[passage/tirmidhi-api-1478|Jami' at-Tirmidhi 1478]] {cite:jami-al-tirmidhi 1478} ve kabın hiçbir şeyi yasal yapmadığını ve yasakladığını belirtti [[passage/tirmidhi-api-1869|Jami' al-Tirmidhi 1869]] {cite:jami-al-tirmidhi 1869}. Kur'an, lezzetli yiyeceklerin Yahudilere yasal ve yasak olduğunu belirtmiştir [[passage/kuran-4-160|an-Nisa 160]] {cite:tanzil-kur'an}."
  id: "Aisha menceritakan bahwa surah pertama Al-Qur'an diwahyukan dalam Al-Mufassal yang menyebutkan Surga dan Neraka, sehingga ketika orang kembali ke Islam, yang sah dan yang tidak sah terungkap. Jika larangan alkohol diungkapkan terlebih dahulu, mereka akan berkata, 'Kami tidak akan pernah meninggalkannya' [[ayat/bukhari-api-4993|Sahih al-Bukhari 4993]] {cite:sahih-al-bukhari 4993}. Laporan tersebut menceritakan bahwa Umar meminta penjelasan yang jelas tentang anggur, sehingga ayat Al-Baqarah diungkapkan, kemudian ayat An-Nisa [[passage/nasai-api-5540|Sunan an-Nasa'i 5540]] {cite:sunan-al-nasai 5540}, dan ketika anggur dilarang, orang-orang menuangkan apa yang mereka miliki [[passage/bukhari-api-4620|Sahih al-Bukhari 4620]] {cite:sahih-al-bukhari 4620}. Pada hari Khaybar, Nabi melarang daging keledai domestik [[passage/tirmidhi-api-1478|Jami' at-Tirmidhi 1478]] {cite:jami-al-tirmidhi 1478}, dan berkata bahwa wadah itu tidak membuat sesuatu yang sah maupun melarangnya [[perjalanan/tirmidhi-api-1869|Jami' al-Tirmidhi 1869]] {cite:jami-al-tirmidhi 1869}. Al-Qur'an menyebutkan bahwa makanan lezat itu sah dan dilarang bagi orang Yahudi [[passage/quran-4-160|an-Nisa 160]] {cite:tanzil-quran}."
