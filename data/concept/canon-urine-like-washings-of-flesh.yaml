id: concept/canon-urine-like-washings-of-flesh
class: concept
kind: scientific
label: { ar: "البول الشبيه بغسالة اللحم عند ابن سينا", en: "Urine like the washings of fresh meat in the Canon", ur: "تازہ گوشت کے دھوون جیسا پیشاب قانون میں", es: "Orina como los lavados de carne fresca en el Canon", fr: "L'urine comme les lavages de viande fraîche dans le Canon", tr: "İbn Sina'daki et yıkama makinesine benzer idrar", id: "Urine mirip mesin cuci daging di Ibn Sina" }
summary:
  ar: "يصف ابن سينا اللون المركب الشبيه بغسالة اللحم الطري، كأنه دم مزج في الماء، ويرده في الأكثر إلى ضعف الكبد وفي الأقل إلى كثرة الدم {cite:canon-ibn-sina-print-v1 p.188}."
  en: "Ibn Sina describes the compound colour like the washings of fresh meat, as if blood were mixed into water, and traces it mostly to a weak liver and less often to an excess of blood {cite:canon-ibn-sina-print-v1 p.188}."
  es: "Ibn Sina describe el color compuesto como los lavados de carne fresca, como si se mezclara sangre con agua, y lo atribuye principalmente a un hígado débil y con menos frecuencia a un exceso de sangre {cite:canon-ibn-sina-print-v1 p.188}."
  fr: "Ibn Sina décrit la couleur composée comme les lavages de viande fraîche, comme si du sang était mélangé à de l'eau, et l'attribue principalement à un foie faible et moins souvent à un excès de sang {cite:canon-ibn-sina-print-v1 p.188}."
  ur: "ابن سینا مرکب رنگ کو تازہ گوشت کے دھونے کی طرح بیان کرتا ہے، گویا خون پانی میں ملایا جاتا ہے، اور اس کا پتہ زیادہ تر کمزور جگر اور کم کثرت سے خون کی زیادتی سے ہوتا ہے۔"
  tr: "İbn Sina, karmaşık rengi, yumuşak bir et yıkama makinesine benzeyen, sanki su karışımı kan gibi, genellikle karaciğer zayıflığına ve en azından aşırı kana bağlar {cite:canon-ibn-sina-print-v1 s.188}."
  id: "Ibn Sina menggambarkan kompleks warna yang menyerupai mesin cuci daging lunak, seolah-olah darah yang dicampur air, sering dikaitkan dengan kelemahan hati dan setidaknya darah yang berlebihan {cite:canon-ibn-sina-print-v1 hlm.188}."
