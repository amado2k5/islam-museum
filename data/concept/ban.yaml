label:
  ar: "بان"
  en: "Ban (the seed of a tall tree)"
  ur: "بان ⁦(لمبے درخت کا بیج)⁩"
summary:
  ar: "حبّه أكبر من الحمّص، إلى البياض، وله لبّ لين دهني. حار في الثالثة يابس في الثانية؛ لُبّه منقٍّ يقطع المواد الغليظة، ويفتح مع الخل والماء سدد الأحشاء، وينفع من البرش والكلف والبهق، والأورام الصلبة، والجرب، والرعاف، ووجع الأذن، وصلابة الكبد والطحال {cite:canon-ibn-sina-print-v1 p.381}، {cite:canon-ibn-sina-print-v1 p.382}."
  en: "Its seed is larger than a chickpea and whitish, with a soft oily pith. Hot in the third degree and dry in the second. The pith is purgative, cuts thick humours, and with vinegar and water opens obstructions of the viscera. The book lists uses for freckles, patches and white marks on the skin, hard swellings, scabies, nosebleed, earache, and hardness of the liver and spleen {cite:canon-ibn-sina-print-v1 p.381}, {cite:canon-ibn-sina-print-v1 p.382}."
  ur: "اس کا بیج چنے سے بڑا اور سفیدی مائل ہوتا ہے، اور اس کا گودا نرم اور چکنا ہوتا ہے۔ طبیعت میں تیسرے درجے میں گرم اور دوسرے میں خشک؛ گودا اسہال آور ہے، گاڑھی رطوبتوں کو کاٹتا ہے، اور سرکے اور پانی کے ساتھ اعضاء کی رکاوٹیں کھولتا ہے۔ کتاب اس کے فوائد جلد کے داغ، سخت ورم، خارش، نکسیر، کان کے درد، اور جگر و تلی کی سختی میں بتاتی ہے {cite:canon-ibn-sina-print-v1 p.381}، {cite:canon-ibn-sina-print-v1 p.382}۔"
