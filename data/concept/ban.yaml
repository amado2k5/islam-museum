id: concept/ban
class: concept
kind: natural
label:
  ar: "بان"
  en: "Ban (the seed of a tall tree)"
  fr: "Ban (graine d’un grand arbre)"
  ur: "بان ⁦(لمبے درخت کا بیج)⁩"
  es: "Prohibición (la semilla de un árbol alto)"
  tr: "Görün"
  id: "Tampilkan"
summary:
  ar: "حبّه أكبر من الحمّص، إلى البياض، وله لبّ لين دهني. حار في الثالثة يابس في الثانية؛ لُبّه منقٍّ يقطع المواد الغليظة، ويفتح مع الخل والماء سدد الأحشاء، وينفع من البرش والكلف والبهق، والأورام الصلبة، والجرب، والرعاف، ووجع الأذن، وصلابة الكبد والطحال {cite:canon-ibn-sina-print-v1 p.381}، {cite:canon-ibn-sina-print-v1 p.382}."
  en: "Its seed is larger than a chickpea and whitish, with a soft oily pith. Hot in the third degree and dry in the second. The pith is purgative, cuts thick humours, and with vinegar and water opens obstructions of the viscera. The book lists uses for freckles, patches and white marks on the skin, hard swellings, scabies, nosebleed, earache, and hardness of the liver and spleen {cite:canon-ibn-sina-print-v1 p.381}, {cite:canon-ibn-sina-print-v1 p.382}."
  fr: "Sa graine, plus grosse qu’un pois chiche et blanchâtre, renferme une pulpe molle et huileuse. Chaude au troisième degré et sèche au deuxième, cette pulpe est purgative ; elle couperait les humeurs épaisses et, avec vinaigre et eau, lèverait les obstructions des viscères. Le livre énumère des usages contre taches de rousseur, taches et marques blanches de la peau, gonflements durs, gale, saignements de nez, douleurs d’oreille et indurations du foie et de la rate {cite:canon-ibn-sina-print-v1 p.381}, {cite:canon-ibn-sina-print-v1 p.382}."
  ur: "اس کا بیج چنے سے بڑا اور سفیدی مائل ہوتا ہے، اور اس کا گودا نرم اور چکنا ہوتا ہے۔ طبیعت میں تیسرے درجے میں گرم اور دوسرے میں خشک؛ گودا اسہال آور ہے، گاڑھی رطوبتوں کو کاٹتا ہے، اور سرکے اور پانی کے ساتھ اعضاء کی رکاوٹیں کھولتا ہے۔ کتاب اس کے فوائد جلد کے داغ، سخت ورم، خارش، نکسیر، کان کے درد، اور جگر و تلی کی سختی میں بتاتی ہے {cite:canon-ibn-sina-print-v1 p.381}، {cite:canon-ibn-sina-print-v1 p.382}۔"
  es: "Su semilla es más grande que un garbanzo y blanquecina, con una médula suave y aceitosa. Caliente en tercer grado y seca en segundo. La médula es purgante, disuelve los humores espesos y, con vinagre y agua, abre las obstrucciones de las vísceras. El libro enumera usos para pecas, manchas y marcas blancas en la piel, hinchazones duras, sarna, hemorragias nasales, dolor de oído y dureza del hígado y el bazo {cite:canon-ibn-sina-print-v1 p.381}, {cite:canon-ibn-sina-print-v1 p.382}."
  tr: "Tohumları nohuttan daha büyük, beyaza kadar ve yumuşak, yağlı bir posa içerir. Üçüncü kısmında sıcak, ikincisinde kuru; eti saflaştırılmıştır, kaba maddeleri keser, sirke ve su ile açılarak iç organları kapatır ve uyuz, melazma, vitiligo, sert tümörler, uyuz, burun kanaması, kulak ağrısı ve karaciğer ile dalağın sertleşmesi için faydalıdır {cite:canon-ibn-sina-print-v1 s.381}, {cite:canon-ibn-sina-print-v1 s.382}."
  id: "Bijinya lebih besar dari kacang arab, hingga putih, dan memiliki pulpa yang lembut dan berlemak. Panas pada yang ketiga dan kering pada yang kedua; dagingnya dimurnikan, memotong zat kasar, dibuka dengan cuka dan air untuk menutup isi perut tersebut, dan berguna untuk kudis, melasma, vitiligo, tumor keras, kudis, mimisan, sakit telinga, dan pengerasan hati serta limpa {cite:canon-ibn-sina-print-v1 hlm.381}, {cite:canon-ibn-sina-print-v1 hlm.382}."
