id: concept/al-arabiyya-fi-turkey
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في هاتاي وجنوب شرق تركيا"
  en: "Arabic in Hatay and southeastern Turkey"
  ur: "ہاتائے اور جنوب مشرقی ترکی میں عربی"
  fr: "l'arabe dans le Hatay et le sud-est de la Turquie"
  es: "el árabe en Hatay y el sureste de Turquía"
  tr: "Hatay ve Güneydoğu Türkiye'de Arapça"
  id: "Bahasa Arab di Hatay dan Turki Tenggara"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في هاتاي وجنوب شرق تركيا: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. وللعربية في تركيا أصناف ثلاثة في الملخص، ولا وضع لها رسمياً، ولا بيانات لغوية في تعدادات تركيا منذ 1965 بحسب الملخص. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Hatay and southeastern Turkey: its legal status, the varieties spoken and the official figures, each as the summary gives it. The summary names three kinds of Arabic in Turkey, none with official status, and says no Turkish census has published language data since 1965. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ ہاتائے اور جنوب مشرقی ترکی میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ خلاصے میں ترکی میں عربی کی تین قسمیں مذکور ہیں، کسی کی سرکاری حیثیت نہیں، اور وہ کہتا ہے کہ 1965 کے بعد ترکی کی کسی مردم شماری نے زبان کے اعداد شائع نہیں کیے۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe dans le Hatay et le sud-est de la Turquie : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. Le résumé nomme trois sortes d'arabe en Turquie, sans statut officiel, et dit qu'aucun recensement turc n'a publié de données linguistiques depuis 1965. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Hatay y el sureste de Turquía: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. El resumen nombra tres clases de árabe en Turquía, sin estatus oficial, y dice que ningún censo turco ha publicado datos lingüísticos desde 1965. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
  tr: "Bu sayfa, müzenin sağladığı bir araştırma özetinin Hatay ve güneydoğu Türkiye'deki Arapça hakkında söylediklerini sunmaktadır: yasal statüsü, konuşulan çeşitleri ve resmi sayıları, ortaya çıktıkları haliyle. Türkiye'de Arapça'nın özetinde üç çeşidi vardır; özete göre, 1965'ten beri Türkiye nüfus sayımlarında resmi statüsü veya dilsel veri yoktur. Müze, özet olarak adlandırdığı sayfaları açmamış ve kurucu 21 Kasım 2026'da belirtildiği üzere kullanımına izin vermiştir. Özette resmi bir kaynak veya numara bulunmadığı belirtildiğinden, sayfa bunu sözlü olarak belirtmekte ve müze bu sayfadan bir sayı içermemektedir."
  id: "Halaman ini menyajikan apa yang dikatakan ringkasan penelitian yang disediakan museum tentang bahasa Arab di Hatay dan Turki tenggara: status hukumnya, varian lisan, dan nomor resmi yang muncul. Ada tiga varian bahasa Arab dalam ringkasan di Turki; menurut ringkasan tersebut, tidak ada status resmi atau data linguistik dalam sensus Turki sejak tahun 1965. Museum belum membuka halaman yang disebut ringkasan, dan pendiri telah mengizinkan penggunaannya seperti yang dinyatakan pada 21 November 2026. Karena ringkasan menyatakan tidak ada sumber atau nomor resmi, halaman tersebut secara lisan menyatakan hal ini, dan museum tidak menyertakan nomor dari halaman ini."
