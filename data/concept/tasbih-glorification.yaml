label:
  ar: "التسبيح"
  en: "Tasbih (glorifying God, the formula of praise in worship)"
  ur: "تسبیح (اللہ کی پاکی بیان کرنا)"
summary:
  ar: "التسبيح تنزيه الله عن كل نقص، ويستعمل بمعنى الذكر والصلاة والتحميد. والأصل فيه الاستحباب، ويشرع في كل الأوقات. وله مواضع معينة في الركوع والسجود وافتتاح الصلاة والتسبيح عند الرعد، وفيه آداب في رفع الصوت والعدد. ويكره في الأماكن المستقذرة ويحرم في الخطبة عند بعض المذاهب، ويكره رفع الصوت به أمام الجنازة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5062}"
  en: "Tasbih is declaring God free of every defect; the word is also used for remembrance, prayer and praise. Its rule is recommendation, at all times. It has set places in bowing, prostration and the opening of prayer, and rules for voice and number. It is disliked in unclean places, forbidden for one listening to the sermon in some schools, and disliked aloud before a funeral; it is recommended at thunder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5062}"
