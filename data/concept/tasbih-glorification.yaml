id: concept/tasbih-glorification
class: concept
kind: legal
label:
  ar: "التسبيح"
  en: "Tasbih (glorifying God, the formula of praise in worship)"
  ur: "تسبیح ⁦(اللہ کی پاکی بیان کرنا)⁩"
  es: "Tasbih (glorificación de Dios, la fórmula de alabanza en la adoración)"
  fr: "Tasbih (glorification de Dieu, formule de louange dans le culte)"
summary:
  ar: "التسبيح تنزيه الله عن كل نقص، ويستعمل بمعنى الذكر والصلاة والتحميد. والأصل فيه الاستحباب، ويشرع في كل الأوقات. وله مواضع معينة في الركوع والسجود وافتتاح الصلاة والتسبيح عند الرعد، وفيه آداب في رفع الصوت والعدد. ويكره في الأماكن المستقذرة ويحرم في الخطبة عند بعض المذاهب، ويكره رفع الصوت به أمام الجنازة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5062}"
  en: "Tasbih is declaring God free of every defect; the word is also used for remembrance, prayer and praise. Its rule is recommendation, at all times. It has set places in bowing, prostration and the opening of prayer, and rules for voice and number. It is disliked in unclean places, forbidden for one listening to the sermon in some schools, and disliked aloud before a funeral; it is recommended at thunder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5062}"
  es: "El tasbih proclama a Dios libre de todo defecto; también se usa para recordarlo, orar y alabarlo. Se recomienda su uso en todo momento. Tiene momentos específicos para inclinarse, postrarse y comenzar la oración, así como normas sobre el tono y el número de veces que se pronuncia. Se desaconseja su uso en lugares impuros, está prohibido para quien escucha el sermón en algunas escuelas y se desaconseja pronunciarlo en voz alta antes de un funeral; se recomienda durante los truenos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5051} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5052} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5054} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5056} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5057} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5059} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5062}"
  fr: "Le tasbih consiste à proclamer l'absence de défaut de Dieu; ce mot est également employé pour le souvenir, la prière et la louange. Son usage est recommandé en toutes circonstances. Il est régi par des règles précises concernant l'inclinaison, la prosternation et l'ouverture de la prière, ainsi que par le volume et le nombre de syllabes. Il est déconseillé de le réciter dans les lieux impurs, interdit lors de l'écoute d'un sermon dans certaines écoles, et déconseillé de le prononcer à voix haute avant des funérailles; son usage est recommandé lors des orages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5054} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5057} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5059} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5062}"
  ur: "تسبیح خدا کو ہر عیب سے پاک قرار دے رہی ہے۔ یہ لفظ ذکر، دعا اور حمد کے لیے بھی استعمال ہوتا ہے۔ اس کا اصول ہر وقت سفارش ہے۔ اس نے رکوع، سجدہ اور نماز کے آغاز کے مقامات اور آواز اور تعداد کے احکام مقرر کیے ہیں۔ ناپاک جگہوں پر ناپسندیدہ ہے، بعض مکاتب میں خطبہ سننا منع ہے، اور جنازے سے پہلے بلند آواز سے سننا ناپسند ہے۔ گرج کے وقت اس کی سفارش کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5051} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5052} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5054} p.5056} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.5057} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.5059} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5062}"
