id: concept/al-tadamun-al-ijtimai
class: concept
kind: ethical
label:
  ar: التضامن الاجتماعي والأخوة الدينية
  en: Social solidarity and religious brotherhood
  fr: "Solidarité sociale et fraternité religieuse"
  es: "Solidaridad social y fraternidad religiosa"
  ur: "سماجی یکجہتی اور مذہبی بھائی چارہ"
  tr: "Sosyal dayanışma ve dini kardeşlik"
  id: "Solidaritas sosial dan persaudaraan agama"
summary:
  ar: "يقرر الشيخ شلتوت أن الأخوة الدينية رباط قلبي يوحد المسلمين في الاتجاه والهدف، وهي أساس التضامن الاجتماعي الذي يحمل فيه كل امرئ تبعات أخيه {cite:azhar-quran-building-society-shaltut p. 81}{cite:azhar-quran-building-society-shaltut p. 84}. ويرى أن الأخوة الدينية تقدم على الأخوة النسبية حين تتعارض، وأن المسلم يحمي أخاه ولا يظلمه ولا يسلمه {cite:azhar-quran-building-society-shaltut p. 82}{cite:azhar-quran-building-society-shaltut p. 83}. ويقسم التضامن إلى شعبتين: أدبية، تقوم على النصح والإرشاد من جانب والاستماع والامتثال من جانب، ومادية، تقوم على سد حاجة المعوزين وتحقيق المصالح العامة {cite:azhar-quran-building-society-shaltut p. 84}{cite:azhar-quran-building-society-shaltut p. 89}. ويعزو ضعف الدعوة والاستماع في المجتمع إلى الغرور بالنفس وعدم الشعور بالمسؤولية الاجتماعية {cite:azhar-quran-building-society-shaltut p. 88}."
  fr: "Pour le cheikh Shaltout, la fraternité religieuse est un lien qui unit les cœurs des musulmans dans une même direction et un même but. Elle fonde la solidarité sociale, par laquelle chacun porte une part des charges de son frère {cite:azhar-quran-building-society-shaltut p. 81}{cite:azhar-quran-building-society-shaltut p. 84}. Selon lui, elle prime sur les liens du sang lorsqu’ils entrent en conflit, et le musulman protège son frère sans lui faire de tort ni le livrer {cite:azhar-quran-building-society-shaltut p. 82}{cite:azhar-quran-building-society-shaltut p. 83}. Il distingue deux formes de solidarité : l’une, morale, repose sur le conseil et l’orientation d’un côté, l’écoute et la mise en pratique de l’autre ; la seconde, matérielle, consiste à pourvoir aux besoins des plus démunis et à servir l’intérêt commun {cite:azhar-quran-building-society-shaltut p. 84}{cite:azhar-quran-building-society-shaltut p. 89}. Il attribue le manque d’exhortation et d’écoute dans la société à la suffisance et à l’absence de sens des responsabilités sociales {cite:azhar-quran-building-society-shaltut p. 88}."
  tr: "Şeyh Şaltut, dini kardeşliğin Müslümanları yön ve amaç açısından birleştiren içten bir bağ olduğunu ve her bireyin kardeşinin sorumluluklarını üstlendiği sosyal dayanışmanın temeli olduğunu belirtir {cite:azhar-quran-building-society-shaltut s. 81} {cite:azhar-quran-building-society-shaltut s. 84}. Dini kardeşliğin çatışma olduğunda akrabalıktan üstün geldiğine ve bir Müslümanın kardeşini koruduğuna, ona haksızlık etmediğine veya bağışlamadığına inanır {cite:azhar-quran-building-society-shaltut s. 82}{cite:azhar-quran-building-society-shaltut s. 83}. Dayanışma iki dala ayrılır: bir yanda tavsiye ve rehberliğe dayalı edebi, diğer yanda dinleme ve uyum temelinde; maddi olarak, ihtiyaç sahiplerinin ihtiyaçlarını karşılamaya ve kamu çıkarlarını gerçekleştirmeye dayalı {cite:azhar-kuran-inşaat-toplum-şaltut s. 84} {cite:azhar-kuran-inşa toplumu-şaltut s. 89}. Toplumda vaaz verme ve dinlemenin zayıflığı, özgurura ve sosyal sorumluluk duygusunun eksikliğine bağlanır {cite:azhar-kuran-inşaat-toplumu-şaltut s. 88}."
  id: "Sheikh Shaltut menyatakan bahwa persaudaraan agama adalah ikatan erat yang menyatukan Muslim dalam arah dan tujuan, serta merupakan dasar solidaritas sosial di mana setiap individu memikul tanggung jawab saudaranya {cite:azhar-quran-building-society-shaltut hlm. 81} {cite:azhar-quran-building-society-shaltut hlm. 84}. Ia percaya bahwa persaudaraan agama lebih unggul daripada kekerabatan di masa konflik dan bahwa seorang Muslim melindungi saudaranya, tidak menyakiti atau memaafkannya {cite:azhar-quran-building-society-shaltut hlm. 82}{cite:azhar-quran-building-society-shaltut hlm. 83}. Solidaritas terbagi menjadi dua cabang: di satu sisi, sastra berdasarkan nasihat dan bimbingan, dan di sisi lain, berdasarkan mendengarkan dan harmoni; Secara materi, ini didasarkan pada pemenuhan kebutuhan mereka yang membutuhkan dan mewujudkan kepentingan publik {cite:Azhar-Quran-construction-society-şaltut hlm. 84} {cite:Azhar-Quran-inşa society-şaltut hlm. 89}. Kelemahan khotbah dan mendengarkan dalam masyarakat dikaitkan dengan kebebasan dan kurangnya tanggung jawab sosial {cite:azhar-quran-construction-toplumu-şaltut hlm. 88}."
