id: concept/al-tadamun-al-ijtimai
class: concept
kind: ethical
label:
  ar: التضامن الاجتماعي والأخوة الدينية
  en: Social solidarity and religious brotherhood
  fr: "Solidarité sociale et fraternité religieuse"
summary:
  ar: "يقرر الشيخ شلتوت أن الأخوة الدينية رباط قلبي يوحد المسلمين في الاتجاه والهدف، وهي أساس التضامن الاجتماعي الذي يحمل فيه كل امرئ تبعات أخيه {cite:azhar-quran-building-society-shaltut p. 81}{cite:azhar-quran-building-society-shaltut p. 84}. ويرى أن الأخوة الدينية تقدم على الأخوة النسبية حين تتعارض، وأن المسلم يحمي أخاه ولا يظلمه ولا يسلمه {cite:azhar-quran-building-society-shaltut p. 82}{cite:azhar-quran-building-society-shaltut p. 83}. ويقسم التضامن إلى شعبتين: أدبية، تقوم على النصح والإرشاد من جانب والاستماع والامتثال من جانب، ومادية، تقوم على سد حاجة المعوزين وتحقيق المصالح العامة {cite:azhar-quran-building-society-shaltut p. 84}{cite:azhar-quran-building-society-shaltut p. 89}. ويعزو ضعف الدعوة والاستماع في المجتمع إلى الغرور بالنفس وعدم الشعور بالمسؤولية الاجتماعية {cite:azhar-quran-building-society-shaltut p. 88}."
  fr: "Pour le cheikh Shaltout, la fraternité religieuse est un lien qui unit les cœurs des musulmans dans une même direction et un même but. Elle fonde la solidarité sociale, par laquelle chacun porte une part des charges de son frère {cite:azhar-quran-building-society-shaltut p. 81}{cite:azhar-quran-building-society-shaltut p. 84}. Selon lui, elle prime sur les liens du sang lorsqu’ils entrent en conflit, et le musulman protège son frère sans lui faire de tort ni le livrer {cite:azhar-quran-building-society-shaltut p. 82}{cite:azhar-quran-building-society-shaltut p. 83}. Il distingue deux formes de solidarité : l’une, morale, repose sur le conseil et l’orientation d’un côté, l’écoute et la mise en pratique de l’autre ; la seconde, matérielle, consiste à pourvoir aux besoins des plus démunis et à servir l’intérêt commun {cite:azhar-quran-building-society-shaltut p. 84}{cite:azhar-quran-building-society-shaltut p. 89}. Il attribue le manque d’exhortation et d’écoute dans la société à la suffisance et à l’absence de sens des responsabilités sociales {cite:azhar-quran-building-society-shaltut p. 88}."
