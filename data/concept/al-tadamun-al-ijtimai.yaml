label:
  ar: التضامن الاجتماعي والأخوة الدينية
  en: Social solidarity and religious brotherhood
summary:
  ar: "يقرر الشيخ شلتوت أن الأخوة الدينية رباط قلبي يوحد المسلمين في الاتجاه والهدف، وهي أساس التضامن الاجتماعي الذي يحمل فيه كل امرئ تبعات أخيه {cite:azhar-quran-building-society-shaltut p. 81}{cite:azhar-quran-building-society-shaltut p. 84}. ويرى أن الأخوة الدينية تقدم على الأخوة النسبية حين تتعارض، وأن المسلم يحمي أخاه ولا يظلمه ولا يسلمه {cite:azhar-quran-building-society-shaltut p. 82}{cite:azhar-quran-building-society-shaltut p. 83}. ويقسم التضامن إلى شعبتين: أدبية، تقوم على النصح والإرشاد من جانب والاستماع والامتثال من جانب، ومادية، تقوم على سد حاجة المعوزين وتحقيق المصالح العامة {cite:azhar-quran-building-society-shaltut p. 84}{cite:azhar-quran-building-society-shaltut p. 89}. ويعزو ضعف الدعوة والاستماع في المجتمع إلى الغرور بالنفس وعدم الشعور بالمسؤولية الاجتماعية {cite:azhar-quran-building-society-shaltut p. 88}."
