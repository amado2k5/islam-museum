id: concept/sujud-al-malaika-li-adam
class: concept
kind: doctrine
label:
  ar: "سجود الملائكة لآدم"
  en: "The angels' prostration to Adam"
  ur: "فرشتوں کا آدم کو سجدہ"
summary:
  ar: "يرى الشعراوي أن السجود لآدم كان طاعة لأمر الله لا عبادة لآدم، وأن العبادة طاعة الأوامر واجتناب النواهي، وأن الذين سجدوا هم من لهم مهمة مع الإنسان، وأن إبليس رد الأمر على الآمر فكفر {cite:tafsir-sharawi-khawatir-scan p.254} {cite:tafsir-sharawi-khawatir-scan p.256} {cite:tafsir-sharawi-khawatir-scan p.257}."
  en: "Sha'rawi holds that the prostration to Adam was obedience to God's command and not worship of Adam; that worship is obedience to commands and avoidance of prohibitions; that those who prostrated were the ones with a task toward the human; and that Iblis answered the command with a refusal, which was disbelief {cite:tafsir-sharawi-khawatir-scan p.254} {cite:tafsir-sharawi-khawatir-scan p.256} {cite:tafsir-sharawi-khawatir-scan p.257}."
  ur: "شعراوی کے نزدیک آدم کو سجدہ اللہ کے حکم کی اطاعت تھا نہ کہ آدم کی عبادت، عبادت حکموں کی بجا آوری اور منع کردہ چیزوں سے رکنے کا نام ہے، سجدہ کرنے والے وہ فرشتے تھے جن کا انسان سے کام تھا، اور ابلیس نے حکم کو حکم دینے والے کے سامنے رد کیا، جو کفر ہے {cite:tafsir-sharawi-khawatir-scan p.254} {cite:tafsir-sharawi-khawatir-scan p.256} {cite:tafsir-sharawi-khawatir-scan p.257}۔"
wings: [ideas]
themes: [creed]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل يجوز السجود لغير الله، وكيف يُفهم سجود الملائكة لآدم دون عبادة له؟"
  en: "Is prostration to anyone other than God permitted, and how is the angels' prostration to Adam to be understood without worship of him?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi
    stance:
      ar: "السجود طاعة لأمر الله، وليس عبادة لآدم، والذي رد الأمر كفر"
      en: "The prostration obeyed God's command and was not worship of Adam; whoever rejected the command disbelieved"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرد الشعراوي على من قالوا كيف يسجد الملائكة لغير الله، فيقرر أن السجود لأمر الله لا لآدم، ويستدل بأن الكعبة يُقبّل حجرها الحجر ويُرجم حجر إبليس، فالعبادة طاعة الأمر {cite:tafsir-sharawi-khawatir-scan p.254}."
      en: "Sha'rawi answers those who ask how angels could prostrate to other than God. He holds that the prostration was to God's command, not to Adam, and argues from the Black Stone that is kissed and the stone that stands for Iblis that is stoned, so worship is obedience to the command {cite:tafsir-sharawi-khawatir-scan p.254}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: academic
    id: academic
    stance:
      ar: "قراءة تاريخية أو لغوية للسجود لم تُضف بعد"
      en: "A historical or linguistic reading of the prostration is not yet added"
    summary:
      ar: "لم تُعرض في هذه الصفحات دراسة لمعنى السجود في اللغة أو في التفسير التاريخي، وتحتاج إلى مرجع محدد."
      en: "No study of the meaning of prostration in language or in the historical tafsir is set out in these pages; it needs a named source."
    sources: []
  - tradition: other
    id: other
    stance:
      ar: "أقوال المعترضين التي يرد عليها الشعراوي"
      en: "The objections he answers, in his telling"
    summary:
      ar: "يذكر الشعراوي اعتراضات قيلت دون أن يسمي أصحابها، وهي معروضة هنا كما نقلها هو ولم تُراجع في مصادرها."
      en: "Sha'rawi reports objections without naming their holders; they are set out as he reports them and have not been checked at their sources."
    sources: []
