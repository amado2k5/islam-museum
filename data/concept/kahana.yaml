summary:
  ar: 'الكهانة والعرافة وتقليب البيتات: بضاعة الجاهلية لكشف المغيبات بالجن والنجوم
    وحكايا الحدثان؛ الضرب كلها نهى عنها النبي. وعند المسعودي تنازع الناس فيها فذهب
    حكماء اليونانيين والروم إلى التكهن وزعم صنف أن نفوسهم صفت فاطلعت على أسرار الطبيعة
    وصنف أن الأرواح المنفردة وهي الجن تخبرهم، وذهبت الصابئة إلى أن أوريايس الأول والثاني
    وهما هرمس وأغاثيمون كانوا يعلمون الغيب ومنعوا أن تكون الجن أخبرتهم، وقال كثيرون
    إنها من شيطان يكون مع الكاهن يسترق السمع ويلقيه على ألسنة الكهان، وذهب آخرون إلى
    الوحي الفلكي عند ثبوت عطارد على شرفه أو في القرانات الكبار، وقال قوم إنها علل
    نفسانية فالنفس إذا قويت قهرت الطبيعة وأبانت كل سر لطيف، والكهانة لليمن والزجر
    لبني أسد والقيافة لبني مدلج {cite:muruj-al-dhahab p. 483-484}'
  en: 'Kahāna, ‘irāfa and sand-reading: the pagan trade in the unseen through jinn
    and stars — all forbidden by the Prophet.'
  ur: جنوں کے ساتھ دعویٰ کردہ رابطے سے غیب کا دعویٰ — سچے وحی کے مقابل جھوٹا دعویٰ۔
  es: "Kahāna, 'irāfa y lectura de la arena: el comercio pagano de lo invisible a través de los genios y las estrellas, todo ello prohibido por el Profeta."
  fr: "Kahāna, 'irāfa et lecture du sable: le commerce païen de l'invisible à travers les djinns et les étoiles — tout cela interdit par le Prophète."
  tr: "Fal bakmak, falcılık ve ayetleri çevirmek: İslam öncesi dönemin faydaları; görünmeyeni cinler, yıldızlar ve olay hikayeleriyle ortaya çıkarmak; bunların hepsi Peygamber tarafından yasaklanmıştır. al-Mas'udi'ye göre insanlar buna itiraz etti, bu yüzden Yunan ve Romalıların bilge adamları spekülasyonlara başvurdu. Bazıları ruhlarının karakterize edildiğini ve doğanın sırlarını ortaya çıkardığını iddia ederken, diğerleri yalnız ruhların, örneğin cinlerin onları bilgilendirdiğini iddia etti. Sabianlar, Orias I ve II, Hermes ve Agathimon'un görünmeyeni bildiklerine ve cinlerin onlara söylemesini engellediklerine inanıyordu. Birçoğu bunun, kahinin yanında olan ve kahinlerin diline aktardığı bir şeytandan geldiğini söyledi. Diğerleri ise Merkür'ün onurunda veya büyük birleşimlerde doğrulandığında astronomik vahiye atıfta bulundu. Bazıları bunun psikolojik hastalıklar olduğunu söyledi; çünkü ruh güçlendiğinde doğayı alt eder ve her ince sırrı ortaya çıkarırdı. Fal Yemen içindir, azarlama Banu Asad içindir, el-Qayyah ise Banu Mudlej içindir {atıf:muruj-al-dhahab s. 483-484}"
  id: "Ramalan, ramalan, dan pembalikan ayat: barang-barang era pra-Islam untuk mengungkapkan yang tak terlihat dengan jin, bintang, dan kisah peristiwa; semua ini dilarang oleh Nabi. Menurut al-Mas'udi, orang-orang memperdebatkannya, sehingga para bijak Yunani dan Romawi mulai berspekulasi. Beberapa mengklaim bahwa jiwa mereka digambarkan dan mengungkapkan rahasia alam, sementara yang lain mengklaim bahwa roh penyendiri, seperti jin, yang memberi tahu mereka. Orang Sabia percaya bahwa Orias I dan II, Hermes dan Agathimon, mengetahui yang tak terlihat dan mencegah jin menceritakan kepada mereka. Banyak yang mengatakan itu berasal dari iblis yang bersama peramal yang menguping, lalu melemparkannya ke lidah para peramal. Yang lain merujuk pada wahyu astronomi ketika Merkurius dikonfirmasi atas kehormatannya atau dalam konjungsi besar. Beberapa mengatakan itu adalah penyakit psikologis, karena ketika jiwa menjadi kuat, ia mengalahkan alam dan mengungkapkan setiap rahasia halus. Ramalan untuk Yaman, teguran untuk Banu Asad, dan al-Qayyah untuk Banu Mudlej {cite:muruj-al-dhahab hlm. 483-484}"
