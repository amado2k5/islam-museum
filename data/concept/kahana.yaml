summary: { ar: "الكهانة والعرافة وتقليب البيتات: بضاعة الجاهلية لكشف المغيبات بالجن والنجوم وحكايا الحدثان؛ الضرب كلها نهى عنها النبي. وعند المسعودي تنازع الناس فيها فذهب حكماء اليونانيين والروم إلى التكهن وزعم صنف أن نفوسهم صفت فاطلعت على أسرار الطبيعة وصنف أن الأرواح المنفردة وهي الجن تخبرهم، وذهبت الصابئة إلى أن أوريايس الأول والثاني وهما هرمس وأغاثيمون كانوا يعلمون الغيب ومنعوا أن تكون الجن أخبرتهم، وقال كثيرون إنها من شيطان يكون مع الكاهن يسترق السمع ويلقيه على ألسنة الكهان، وذهب آخرون إلى الوحي الفلكي عند ثبوت عطارد على شرفه أو في القرانات الكبار، وقال قوم إنها علل نفسانية فالنفس إذا قويت قهرت الطبيعة وأبانت كل سر لطيف، والكهانة لليمن والزجر لبني أسد والقيافة لبني مدلج {cite:muruj-al-dhahab p. 483-484}", en: "Kahāna, ‘irāfa and sand-reading: the pagan trade in the unseen through jinn and stars — all forbidden by the Prophet." }
