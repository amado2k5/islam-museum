label: { ar: "الحصار", en: "Siege (hisar)", ur: "حصار ⁦(محاصرہ)⁩", es: "Asedio (hisar)", fr: "Siège (hisar)" }
summary:
  ar: "الحصار التضييق على العدو والإحاطة به في بلد أو قلعة أو حصن، ومنع الخروج والدخول حتى يستسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} ويجوز بالإجماع للإمام أو نائبه محاصرة الكفار في بلادهم وحصونهم، وإن كان فيهم النساء والصبيان، وقد حاصر النبي أهل الطائف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} وعلى الإمام إذا حاصر حصنا أن يأخذه بإحدى خصال: أن يسلموا فيعصموا دماءهم وأموالهم وأولادهم الصغار، أو يبذلوا مالا على الموادعة أو الجزية، أو يفتحه، أو يرى المصلحة في الانصراف، أو ينزلوا على حكم حاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} والإسلام أثناء الحصار قبل الاستسلام يعصم الدماء والأموال، وأما بعد الفتح فيعصم الدماء دون الأموال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} وفي حصار البغاة: الشافعية لا يمنعون عنهم الطعام والشراب، والمالكية يجيزون منع الميرة والماء إلا إن كان فيهم صبيان ونساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109} وإذا طلب المحاصرون مالا لفك الحصار لم يجبهم الإمام إلا لخوف هلاك المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109}"
  en: "Siege (hisar) is hemming in an enemy in a town, castle or fortress, and cutting off entry and exit until he surrenders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} The ruler or his deputy may lawfully besiege unbelievers in their lands and fortresses by consensus, even when women and children are among them, and the Prophet besieged the people of Ta'if. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} When the ruler besieges a fortress he may take it in one of five ways: they accept Islam and their blood, property and young children are secured; they offer money for a truce or a poll-tax; he conquers it; he sees fit to withdraw; or they submit to a judge's ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} Islam accepted during a siege before surrender secures life and property; after conquest it secures life only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} On besieging rebels, the Shafi'is forbid denying them food and drink, while the Malikis allow denying supplies and water unless women and children are among them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109} When the besieged offer money to lift the siege, the ruler does not accept unless the Muslims face destruction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109}"
  es: "El asedio (hisar) es cercar a un enemigo en una ciudad, castillo o fortaleza, y cortar la entrada y salida hasta que se rinda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} El gobernante o su lugarteniente pueden legalmente asediar a los no creyentes en sus tierras y fortalezas por consenso, incluso cuando hay mujeres y niños entre ellos, y el Profeta asedió a la gente de Ta'if. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} Cuando el gobernante asedia una fortaleza puede tomarla de una de cinco maneras: aceptan el Islam y su sangre, propiedad y niños pequeños están a salvo; ofrecen dinero por una tregua o un impuesto per cápita; la conquista; considera oportuno retirarse; o se someten al fallo de un juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} El Islam, aceptado durante un asedio antes de la rendición, garantiza la vida y la propiedad; después de la conquista, solo garantiza la vida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} Al sitiar a rebeldes, los shafi'íes prohíben negarles comida y bebida, mientras que los malikíes permiten negarles suministros y agua a menos que haya mujeres y niños entre ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109} Cuando los sitiados ofrecen dinero para levantar el asedio, el gobernante no acepta a menos que los musulmanes se enfrenten a la destrucción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109}"
  fr: "Le siège (hisar) consiste à encercler un ennemi dans une ville, un château ou une forteresse, et à lui couper toute entrée et sortie jusqu'à sa reddition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} Le souverain ou son représentant peut légitimement assiéger les non-croyants sur leurs terres et dans leurs forteresses par consensus, même en présence de femmes et d'enfants. Le Prophète a d'ailleurs assiégé les habitants de Taïf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} Lorsqu'il assiège une forteresse, le souverain peut s'en emparer de cinq manières: les habitants se convertissent à l'islam et leur vie, leurs biens et leurs jeunes enfants sont en sécurité; ils offrent une rançon ou une capitation; il conquiert la forteresse; il se retire; ou ils se soumettent à la décision d'un juge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} L'islam accepté lors d'un siège, avant la reddition, garantit la vie et les biens; après la conquête, il ne garantit que la vie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} Face à des rebelles assiégés, les chaféites interdisent de les priver de nourriture et de boisson, tandis que les malikites autorisent cette privation, sauf en présence de femmes et d'enfants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109} Lorsque les assiégés offrent de l'argent pour lever le siège, le souverain n'accepte que si les musulmans sont menacés d'extermination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109}"
