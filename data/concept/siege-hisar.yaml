label: { ar: "الحصار", en: "Siege (hisar)", ur: "حصار (محاصرہ)" }
summary:
  ar: "الحصار التضييق على العدو والإحاطة به في بلد أو قلعة أو حصن، ومنع الخروج والدخول حتى يستسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} ويجوز بالإجماع للإمام أو نائبه محاصرة الكفار في بلادهم وحصونهم، وإن كان فيهم النساء والصبيان، وقد حاصر النبي أهل الطائف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} وعلى الإمام إذا حاصر حصنا أن يأخذه بإحدى خصال: أن يسلموا فيعصموا دماءهم وأموالهم وأولادهم الصغار، أو يبذلوا مالا على الموادعة أو الجزية، أو يفتحه، أو يرى المصلحة في الانصراف، أو ينزلوا على حكم حاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} والإسلام أثناء الحصار قبل الاستسلام يعصم الدماء والأموال، وأما بعد الفتح فيعصم الدماء دون الأموال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} وفي حصار البغاة: الشافعية لا يمنعون عنهم الطعام والشراب، والمالكية يجيزون منع الميرة والماء إلا إن كان فيهم صبيان ونساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109} وإذا طلب المحاصرون مالا لفك الحصار لم يجبهم الإمام إلا لخوف هلاك المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109}"
  en: "Siege (hisar) is hemming in an enemy in a town, castle or fortress, and cutting off entry and exit until he surrenders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} The ruler or his deputy may lawfully besiege unbelievers in their lands and fortresses by consensus, even when women and children are among them, and the Prophet besieged the people of Ta'if. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} When the ruler besieges a fortress he may take it in one of five ways: they accept Islam and their blood, property and young children are secured; they offer money for a truce or a poll-tax; he conquers it; he sees fit to withdraw; or they submit to a judge's ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} Islam accepted during a siege before surrender secures life and property; after conquest it secures life only. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7108} On besieging rebels, the Shafi'is forbid denying them food and drink, while the Malikis allow denying supplies and water unless women and children are among them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109} When the besieged offer money to lift the siege, the ruler does not accept unless the Muslims face destruction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7109}"
