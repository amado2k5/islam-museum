label: { ar: "الأنموذج", en: "Anmudhaj (a sample shown in place of an absent or heaped good, and its rules in sale)", fr: "Anmudhaj (échantillon présenté pour une marchandise absente ou en tas, et règles de vente)", es: "Anmudhaj (una muestra que se exhibe en lugar de un bien ausente o amontonado, y sus reglas de venta)", ur: "انمودج ⁦(ایک نمونہ غائب یا ڈھیر شدہ سامان کی جگہ دکھایا گیا ہے، اور فروخت میں اس کے قواعد)⁩", tr: "Model", id: "Model" }
summary:
  ar: "الأنموذج لغة ما يدل على صفة الشيء، كأن يُري البائع المشتري صاعا من صبرة قمح ويبيعه الصبرة على أنها من جنس ذلك الصاع، وهو معرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} والبرنامج دفتر أو ورقة فيها صفة ما في الوعاء من الثياب المبيعة، والرقم علامة على الثمن أو مقداره، ومنه البيع بالرقم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} ويشترط الحنفية في البيع معرفة المبيع معرفة نافية للجهالة، فإن كان غائبا وكان مما يعرف بالأنموذج كالكيلي والوزني المتقارب فرؤية الأنموذج كرؤية الجميع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} وقال الشافعية إن رؤية الأنموذج المتماثل الأجزاء تكفي، وإن قال البائع بعتك من هذا النوع كذا دون تعيين فهو باطل، وقال الحنابلة لا يصح البيع بالأنموذج إلا إذا رئي المبيع وقت العقد وكان على مثاله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  en: "Anmudhaj is lexically a sample showing the quality of a thing, such as a seller who shows a buyer a measure of wheat from a heap and sells the heap as of the same kind; it is a loan-word. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} Barnamij is a register setting out the goods in a bale, and raqm is a mark showing a price, whence the sale by marked price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} The Hanafis require that the knowledge of the goods remove uncertainty; for an absent good that is known by measure or weight, a sample is as the whole. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} The Shafi'is hold that a sample of uniform grains suffices, and that a seller who names only the kind without fixing the object or price has made a void sale. The Hanbalis allow a sale by sample only if the goods were seen at the contract and matched it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  fr: "Au sens lexical, anmudhaj est un échantillon qui montre la qualité d’une chose. Ainsi un vendeur peut montrer à un acheteur une mesure de blé prélevée dans un tas et vendre le tas comme étant du même type. C’est un mot d’emprunt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} Le barnamij est un registre qui détaille les marchandises contenues dans un ballot, tandis que le raqm est une marque indiquant un prix, d’où la vente au prix marqué. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} Les hanafites exigent une connaissance de la marchandise suffisante pour lever l’incertitude. Pour une marchandise absente connue par sa mesure ou son poids, un échantillon vaut pour le tout. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} Selon les chaféites, un échantillon de grains uniformes suffit, mais la vente est nulle si le vendeur ne nomme que le type de marchandise, sans fixer l’objet ni le prix. Les hanbalites n’admettent la vente sur échantillon que si la marchandise a été vue au moment du contrat et correspondait à l’échantillon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  es: "Anmudhaj es léxicamente una muestra que muestra la calidad de una cosa, como un vendedor que muestra a un comprador una medida de trigo de un montón y vende el montón como si fuera de la misma clase; es una palabra prestada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} Barnamij es un registro que establece los bienes en un fardo, y raqm es una marca que muestra un precio, de donde proviene la venta por precio marcado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} Los Hanafis requieren que el conocimiento de los bienes elimine la incertidumbre; para un bien ausente que se conoce por medida o peso, una muestra es como el todo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} Los shafi'ís sostienen que una muestra de granos uniformes es suficiente, y que un vendedor que solo menciona el tipo sin fijar el objeto ni el precio realiza una venta nula. Los hanbalíes permiten la venta por muestra únicamente si la mercancía fue vista en el momento del contrato y coincidía con lo acordado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  ur: "انمودج لغوی طور پر ایک نمونہ ہے جو کسی چیز کے معیار کو ظاہر کرتا ہے، جیسے بیچنے والا جو خریدار کو ڈھیر سے گندم کا پیمانہ دکھاتا ہے اور اسی قسم کے ڈھیر کو بیچتا ہے۔ یہ قرض کا لفظ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3566} برنامج ایک رجسٹر ہے جس میں سامان کو گٹھری میں درج کیا جاتا ہے، اور راقم ایک نشان ہے جس میں قیمت ظاہر ہوتی ہے، جہاں سے قیمت کے حساب سے فروخت ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3566} احناف کا تقاضا ہے کہ اشیا کا علم غیر یقینی کو دور کرے۔ ناپ تول یا ناپ تول سے معلوم ہونے والی غیر حاضر چیز کے لیے ایک نمونہ مکمل ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3567} شافعیوں کا خیال ہے کہ یکساں اناج کا نمونہ کافی ہے اور جو بیچنے والے نے چیز یا قیمت مقرر کیے بغیر صرف قسم کا نام رکھا اس نے فروخت باطل کردی۔ حنبلی صرف نمونے کے ذریعہ فروخت کی اجازت دیتے ہیں جب سامان معاہدہ میں دیکھا گیا ہو اور اس سے میل کھاتا ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص3567}"
  tr: "Dilsel form, satıcının alıcıya buğday çuvalı sa' gösterip, onu Araplaştırılmış bir sa' ile aynı türdenmiş gibi satması gibi, ürünün kalitesini gösteren bir şeydir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3566} Program, satılan kıyafetlerin tanımını içeren bir defter veya kağıttır; numarası fiyatı veya miktarını gösterir, dolayısıyla numaraya göre satıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3566} Hanefi okulu, satılan ürünün alıcıya satılan ürünü bildiği bilinmesini gerektirir ki cehalet oluşmasın. Eğer yoksa ve kilometre veya benzer ağırlık gibi modelle biliniyorsa, modeli görmek herkesi görmek gibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3567} Şafi'ler, aynı parçalara sahip bir modeli görmenin yeterli olduğunu ve satıcının 'Size bu türü belirtmeden sattım' derse geçersiz olduğunu söyler. Hanbalılar, satılan ürün sözleşme sırasında görülmedikçe ve tam halindeyken modele göre satışın geçerli olmadığını belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3567}"
  id: "Bentuk linguistik adalah sesuatu yang menunjukkan kualitas barang tersebut, seperti penjual menunjukkan kepada pembeli sebuah sa' karung gandum dan menjualnya seolah-olah itu jenis yang sama dengan sa' tersebut, yang merupakan bentuk Arabisasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3566} Programnya adalah buku catatan atau kertas yang berisi deskripsi pakaian yang terjual, dengan nomor menunjukkan harga atau jumlahnya, sehingga dijual berdasarkan nomor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3566} Aliran Hanafi mengharuskan barang yang terjual diketahui oleh pembeli yang mengetahui barang yang terjual untuk mencegah ketidaktahuan. Jika barang tersebut tidak ada dan diketahui melalui model, seperti kilometer atau berat yang serupa, maka melihat model itu seperti melihat semua orang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3567} Para Shafi'i mengatakan bahwa melihat model dengan bagian yang identik sudah cukup, dan jika penjual berkata, 'Saya menjual tipe ini tanpa menjelaskan,' itu tidak sah. Hanbalis mengatakan bahwa menjual berdasarkan model tidak sah kecuali barang yang terjual sudah terlihat saat kontrak dibuat dan dalam kondisi persis seperti itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3567}"
