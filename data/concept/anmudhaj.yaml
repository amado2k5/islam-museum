id: concept/anmudhaj
class: concept
kind: term
label: { ar: "الأنموذج", en: "Anmudhaj (a sample shown in place of an absent or heaped good, and its rules in sale)" }
summary:
  ar: "الأنموذج لغة ما يدل على صفة الشيء، كأن يُري البائع المشتري صاعا من صبرة قمح ويبيعه الصبرة على أنها من جنس ذلك الصاع، وهو معرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} والبرنامج دفتر أو ورقة فيها صفة ما في الوعاء من الثياب المبيعة، والرقم علامة على الثمن أو مقداره، ومنه البيع بالرقم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} ويشترط الحنفية في البيع معرفة المبيع معرفة نافية للجهالة، فإن كان غائبا وكان مما يعرف بالأنموذج كالكيلي والوزني المتقارب فرؤية الأنموذج كرؤية الجميع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} وقال الشافعية إن رؤية الأنموذج المتماثل الأجزاء تكفي، وإن قال البائع بعتك من هذا النوع كذا دون تعيين فهو باطل، وقال الحنابلة لا يصح البيع بالأنموذج إلا إذا رئي المبيع وقت العقد وكان على مثاله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
  en: "Anmudhaj is lexically a sample showing the quality of a thing, such as a seller who shows a buyer a measure of wheat from a heap and sells the heap as of the same kind; it is a loan-word. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} Barnamij is a register setting out the goods in a bale, and raqm is a mark showing a price, whence the sale by marked price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566} The Hanafis require that the knowledge of the goods remove uncertainty; for an absent good that is known by measure or weight, a sample is as the whole. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567} The Shafi'is hold that a sample of uniform grains suffices, and that a seller who names only the kind without fixing the object or price has made a void sale. The Hanbalis allow a sale by sample only if the goods were seen at the contract and matched it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3567}"
