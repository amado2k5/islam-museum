summary:
  ar: "ينقل ابن سينا تركيباً يبطئ بالسكر من ماء الكرنب الأبيض وماء الرمان الحامض والخل، وحباً من الملح والسذاب والكمون الأسود، ثم يعدد ما يصحي السكران من الماء والخل والمصل والرائب والكافور والصندل والمبردات على الرأس، ويحيل علاج الخمار إلى الجزئيات {cite:canon-ibn-sina-print-v1 p.239}."
  en: "Ibn Sina gives a mixture that slows intoxication, of white cabbage water, sour pomegranate juice and vinegar, and pills of salt, rue and black cumin, then lists what sobers the drunk, water and vinegar, whey and sour curd, camphor and sandalwood and cooling applications on the head, leaving the hangover to the particular books {cite:canon-ibn-sina-print-v1 p.239}."
