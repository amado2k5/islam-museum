label:
  ar: "أهل النظر"
  en: "Ahl al-nazar (those who apply reasoning)"
  fr: "Ahl al-nazar (ceux qui recourent au raisonnement)"
  es: "Ahl al-nazar (aquellos que aplican el razonamiento)"
summary:
  ar: "أهل النظر، أي أصحاب الاستدلال العقلي، لفظ أطلقه المعتزلة على أنفسهم في الأصل، ثم صار يدل على العلماء المتأنين أصحاب الرأي المحكم في المسألة {cite:encyclopaedia-of-islam-2 vol. 1 p. 288}."
  en: "Ahl al-nazar, 'those who apply reasoning', was first the name of the Mu'tazila, who probably coined it themselves. Later it denoted careful scholars who held a sound, well-reasoned opinion on a question {cite:encyclopaedia-of-islam-2 vol. 1 p. 288}."
  fr: "L’expression ahl al-nazar, « ceux qui recourent au raisonnement », a d’abord désigné les mu‘tazilites, qui l’ont probablement forgée eux-mêmes. Elle a ensuite désigné les savants qui examinaient une question avec soin et formulaient à son sujet un avis solide et raisonné {cite:encyclopaedia-of-islam-2 vol. 1 p. 288}."
  es: "Ahl al-nazar, «aquellos que aplican el razonamiento», fue originalmente el nombre de los Mu'tazila, quienes probablemente lo acuñaron ellos mismos. Posteriormente, designaba a los eruditos cuidadosos que sostenían una opinión sólida y bien fundamentada sobre una cuestión {cite:encyclopaedia-of-islam-2 vol. 1 p. 288}."
