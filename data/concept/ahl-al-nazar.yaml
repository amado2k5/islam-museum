summary:
  ar: "أهل النظر، أي أصحاب الاستدلال العقلي، لفظ أطلقه المعتزلة على أنفسهم في الأصل، ثم صار يدل على العلماء المتأنين أصحاب الرأي المحكم في المسألة {cite:encyclopaedia-of-islam-2 vol. 1 p. 288}."
  en: "Ahl al-nazar, 'those who apply reasoning', was first the name of the Mu'tazila, who probably coined it themselves. Later it denoted careful scholars who held a sound, well-reasoned opinion on a question {cite:encyclopaedia-of-islam-2 vol. 1 p. 288}."
