id: "concept/asbab-da-f-al-basar"
class: "concept"
kind: "scientific"
label:
  ar: "أسباب ضعف البصر"
  en: "Causes of weakness of sight"
  fr: "Causes de la faiblesse de la vue"
  ur: "بینائی کے ضعف کے اسباب"
  es: "Causas de debilidad visual"
  tr: "Kötü Görmenin Nedenleri"
  id: "Penyebab Penglihatan yang Buruk"
summary:
  ar: "أسباب ضعف البصر إما من مزاج عام في البدن، أو من مرض في الدماغ كالضربة الضاغطة، أو من شأن الروح الباصر فيرق أو يكثف أو يقل، أو من طبقة أو رطوبة أو ثقبة أو عصبة {cite:canon-ibn-sina-print-v2 p.201} {cite:canon-ibn-sina-print-v2 p.202} {cite:canon-ibn-sina-print-v2 p.203}"
  en: "The causes of weakness of sight are either a general temperament of the body, or a disease of the brain such as a compressing blow, or a state of the visual spirit itself — thinning, thickening or dwindling — or of a layer, a humour, the pupil or the nerve {cite:canon-ibn-sina-print-v2 p.201} {cite:canon-ibn-sina-print-v2 p.202} {cite:canon-ibn-sina-print-v2 p.203}"
  fr: "Les causes de la faiblesse de la vue relèvent soit d’un tempérament général du corps, soit d’une maladie du cerveau comme un coup compressif, soit de l’état de l’esprit visuel lui-même — fluidification, épaississement ou diminution — soit d’une tunique, d’une humeur, de la pupille ou du nerf {cite:canon-ibn-sina-print-v2 p.201} {cite:canon-ibn-sina-print-v2 p.202} {cite:canon-ibn-sina-print-v2 p.203}"
  ur: "بینائی کے ضعف کے اسباب یا تو بدن کے عمومی مزاج سے ہیں، یا دماغ کی بیماری سے جیسے دبانے والی ضربت، یا خود باصر روح کے حال سے — پتلا، گاڑھا یا کم ہو جانا — یا کسی طبقہ، رطوبت، ثقبہ یا عصب سے {cite:canon-ibn-sina-print-v2 p.201} {cite:canon-ibn-sina-print-v2 p.202} {cite:canon-ibn-sina-print-v2 p.203}۔"
  es: "Las causas de la debilidad de la vista son un temperamento general del cuerpo, una enfermedad del cerebro como un golpe compresivo, un estado del espíritu visual mismo —adelgazamiento, engrosamiento o disminución— o de una capa, un humor, la pupila o el nervio {cite:canon-ibn-sina-print-v2 p.201} {cite:canon-ibn-sina-print-v2 p.202} {cite:canon-ibn-sina-print-v2 p.203}"
  tr: "Kötü görme nedenleri ya vücuttaki genel bir ruh halinden, ya da basınç felci gibi bir beyin hastalığından, ya da farklılaşabilen, yoğunlaşabilen veya azalabilen ayırt edici ruhtan ya da bir tabaka, nem, delik veya ganglionlardan kaynaklanabilir {cite:canon-ibn-sina-print-v2 s.201} {cite:canon-ibn-sina-print-v2 s.202} {cite:canon-ibn-sina-print-v2 s.203}"
  id: "Penyebab penglihatan yang buruk bisa berasal dari suasana hati umum dalam tubuh, atau penyakit otak seperti stroke tekanan, atau dari jiwa yang peka yang mungkin berbeda, meningkat, atau menurun, atau dari lapisan, kelembapan, lubang, atau ganglia {cite:canon-ibn-sina-print-v2 hlm.201} {cite:canon-ibn-sina-print-v2 hlm.202} {cite:canon-ibn-sina-print-v2 hlm.203}"
