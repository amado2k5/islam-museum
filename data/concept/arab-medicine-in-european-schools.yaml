id: concept/arab-medicine-in-european-schools
class: concept
kind: scientific
label: { ar: "الطب العربي في المدارس الأوروبية", en: "Arab medicine in European schools", fr: "La médecine arabe dans les écoles européennes", es: "La medicina árabe en las escuelas europeas", ur: "یورپی اسکولوں میں عرب طب" }
summary:
  ar: "يذكر شكيب أرسلان في فصل «المدنية العربية وخدمة العرب لعلم الطب» أن كتب الأطباء العرب كانت المرجع المعتمد في المدارس الأوروبية، ولم تزل كذلك حتى القرن السادس عشر، حين عاد الأوروبيون يترجمون أبقراط من اليونانية مباشرة، ولم تُحذف مؤلفات العرب من برامج التدريس إلا في أواخر ذلك القرن. ينقل عن مؤرخ فرنسي إشادة بوضوح الكتّاب العرب في الموضوعات العلمية. يعرض المؤلف هذا لإبراز فضل العرب في نقل العلم وتطويره، ويعتمد في تفاصيله على نقل من كتب الأوروبيين لم يُتحقق منه هنا."
  en: "Arslan argues that Arab medical books were the standard teaching texts in European schools until the late sixteenth century, when Europeans began translating Hippocrates directly from Greek. He quotes a French historian praising the clarity of Arab writers on scientific subjects. He uses this to show the Arab role in transmitting and developing learning, and relies on European writers he did not check here."
  fr: "Arslan soutient que les livres de médecine arabes furent les textes de référence pour l’enseignement dans les écoles européennes jusqu’à la fin du XVIe siècle, lorsque les Européens commencèrent à traduire Hippocrate directement du grec. Il cite un historien français louant la clarté des auteurs arabes dans les matières scientifiques. Il s’en sert pour montrer le rôle des Arabes dans la transmission et le développement du savoir, et s’appuie sur des auteurs européens qu’il n’a pas vérifiés ici."
  es: "Arslan sostiene que los libros de medicina árabes fueron los textos didácticos estándar en las escuelas europeas hasta finales del siglo XVI, cuando los europeos comenzaron a traducir a Hipócrates directamente del griego. Cita a un historiador francés que elogia la claridad de los autores árabes en temas científicos. Utiliza este ejemplo para demostrar el papel árabe en la transmisión y el desarrollo del conocimiento, y se basa en autores europeos que no ha verificado en este trabajo."
  ur: "ارسلان کا استدلال ہے کہ سولہویں صدی کے اواخر تک جب یورپیوں نے ہپوکریٹس کا براہ راست یونانی سے ترجمہ کرنا شروع کیا تو عرب طبی کتابیں یورپی اسکولوں میں معیاری تدریسی کتابیں تھیں۔ انہوں نے ایک فرانسیسی مورخ کا حوالہ دیا جس میں سائنسی موضوعات پر عرب مصنفین کی وضاحت کی تعریف کی گئی۔ وہ اس کا استعمال سیکھنے کی منتقلی اور ترقی میں عربوں کے کردار کو ظاہر کرنے کے لیے کرتا ہے، اور یورپی مصنفین پر انحصار کرتا ہے جنہیں انھوں نے یہاں نہیں دیکھا۔"
