label: { ar: "الطب العربي في المدارس الأوروبية", en: "Arab medicine in European schools" }
summary:
  ar: "يذكر شكيب أرسلان في فصل «المدنية العربية وخدمة العرب لعلم الطب» أن كتب الأطباء العرب كانت المرجع المعتمد في المدارس الأوروبية، ولم تزل كذلك حتى القرن السادس عشر، حين عاد الأوروبيون يترجمون أبقراط من اليونانية مباشرة، ولم تُحذف مؤلفات العرب من برامج التدريس إلا في أواخر ذلك القرن. ينقل عن مؤرخ فرنسي إشادة بوضوح الكتّاب العرب في الموضوعات العلمية. يعرض المؤلف هذا لإبراز فضل العرب في نقل العلم وتطويره، ويعتمد في تفاصيله على نقل من كتب الأوروبيين لم يُتحقق منه هنا."
  en: "Arslan argues that Arab medical books were the standard teaching texts in European schools until the late sixteenth century, when Europeans began translating Hippocrates directly from Greek. He quotes a French historian praising the clarity of Arab writers on scientific subjects. He uses this to show the Arab role in transmitting and developing learning, and relies on European writers he did not check here."
