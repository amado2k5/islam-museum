id: concept/ahd
class: concept
kind: legal
label:
  ar: "العَهْد"
  en: "Covenant (ahd) and the duty to keep it; oath by the covenant of God"
  ur: "عہد"
summary:
  ar: "العهد في اللغة الوصية والأمان والموثق والذمة واليمين، ومنه ما بين الناس من مواثيق، ويفرق عن العقد بأن العهد قد يكون باستيثاق لا يلزم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. والوعد إخبار عن إنشاء المخبر معروفاً في المستقبل، والبيعة صفة على إيجاب الطاعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. وأوجب الإسلام الوفاء بالعهد، والتزمه النبي في جميع عهوده، ونقض العهد محرم، وقد عدّ النبي من نقض العهد من الغدر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. وحرّم الإسلام ظلم المعاهد، ونهى عن نقض العهد قبل انقضاء أمده {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. واليمين بعهد الله يمين يترتب عليها أحكام اليمين، واشترط الشافعية في اعتبارها أن ينوي الحالف بها اليمين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}."
  en: "In the lexicon, 'ahd is covenant, pledge, safe-conduct, guarantee and oath, and whatever is between people by way of agreement; it differs from the contract ('aqd) in that a covenant may be a binding pledge or a promise without binding force {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. Promise (wa'd) is a notice of something to be made in future, and bay'a is an oath of obedience {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. Islam requires keeping the covenant; the Prophet kept his covenants, breaking one is forbidden, and he counted breaking a covenant as treachery {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. Islam forbids wronging a covenant partner, and breaking a covenant before its term ends {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. An oath by God's covenant is an oath with the consequences of any oath, and the Shafi'is require that the swearer intended an oath by it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}."
