tags: [islamic-economy-browser, islamic-economy-sukuk]
label:
  ar: "العَهْد"
  en: "Covenant (ahd) and the duty to keep it; oath by the covenant of God"
  fr: "L’alliance (ahd) et le devoir de la respecter ; le serment par l’alliance de Dieu"
  ur: "عہد"
  es: "Pacto (ahd) y el deber de cumplirlo; juramento por el pacto de Dios"
summary:
  ar: "العهد في اللغة الوصية والأمان والموثق والذمة واليمين، ومنه ما بين الناس من مواثيق، ويفرق عن العقد بأن العهد قد يكون باستيثاق لا يلزم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. والوعد إخبار عن إنشاء المخبر معروفاً في المستقبل، والبيعة صفة على إيجاب الطاعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. وأوجب الإسلام الوفاء بالعهد، والتزمه النبي في جميع عهوده، ونقض العهد محرم، وقد عدّ النبي من نقض العهد من الغدر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. وحرّم الإسلام ظلم المعاهد، ونهى عن نقض العهد قبل انقضاء أمده {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. واليمين بعهد الله يمين يترتب عليها أحكام اليمين، واشترط الشافعية في اعتبارها أن ينوي الحالف بها اليمين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}."
  en: "In the lexicon, 'ahd is covenant, pledge, safe-conduct, guarantee and oath, and whatever is between people by way of agreement; it differs from the contract ('aqd) in that a covenant may be a binding pledge or a promise without binding force {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. Promise (wa'd) is a notice of something to be made in future, and bay'a is an oath of obedience {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. Islam requires keeping the covenant; the Prophet kept his covenants, breaking one is forbidden, and he counted breaking a covenant as treachery {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. Islam forbids wronging a covenant partner, and breaking a covenant before its term ends {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. An oath by God's covenant is an oath with the consequences of any oath, and the Shafi'is require that the swearer intended an oath by it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}."
  fr: "Dans le lexique, 'ahd désigne l’alliance, l’engagement, le sauf-conduit, la garantie et le serment, ainsi que tout accord entre des personnes ; il diffère du contrat ('aqd) en ce qu’une alliance peut être un engagement contraignant ou une promesse sans force obligatoire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. La promesse (wa'd) est l’annonce d’une chose à accomplir dans l’avenir, et la bay'a est un serment d’obéissance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. L’islam exige le respect de l’alliance ; le Prophète respectait ses engagements, en rompre un est interdit, et il considérait la rupture d’une alliance comme une trahison {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. L’islam interdit de léser un partenaire d’alliance et de rompre une alliance avant son terme {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. Un serment par l’alliance de Dieu est un serment entraînant les conséquences de tout serment, et les chaféites exigent que celui qui le prononce ait eu l’intention de jurer par cette formule {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}."
  es: "En el léxico, 'ahd es pacto, promesa, salvoconducto, garantía y juramento, y todo lo que existe entre personas a modo de acuerdo; difiere del contrato ('aqd) en que un pacto puede ser una promesa vinculante o una promesa sin fuerza vinculante {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. La promesa (wa'd) es un aviso de algo que se hará en el futuro, y bay'a es un juramento de obediencia {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904}. El Islam exige el cumplimiento del pacto; El Profeta cumplió sus pactos, romper uno está prohibido, y consideró la ruptura de un pacto como traición {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. El Islam prohíbe perjudicar a un socio en un pacto y romper un pacto antes de que finalice su plazo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905}. Un juramento por el pacto de Dios es un juramento con las consecuencias de cualquier juramento, y los shafi'ís requieren que el juramentador tuviera la intención de jurar por él {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11906}."
  ur: "لغت میں احد عہد، عہد، حفاظت، ضمانت اور حلف ہے اور جو کچھ بھی لوگوں کے درمیان معاہدہ کے ذریعے ہے۔ یہ عقد ⁦(عقد)⁩ سے اس لحاظ سے مختلف ہے کہ عہد ایک پابند عہد ہو سکتا ہے یا کسی پابند قوت کے بغیر وعدہ ہو سکتا ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11903} وعدہ ⁦(وضع)⁩ مستقبل میں کی جانے والی کسی چیز کا نوٹس ہے، اور بیعت اطاعت کا حلف ہے اسلام عہد کی پاسداری کا تقاضا کرتا ہے۔ نبی نے اپنے عہد کی پاسداری کی، ایک کو توڑنا حرام ہے، اور آپ نے عہد شکنی کو خیانت قرار دیا۔ اسلام کسی عہد کے ساتھی پر ظلم کرنے اور اس کی میعاد ختم ہونے سے پہلے عہد کو توڑنے سے منع کرتا ہے۔ خدا کے عہد کی قسم کسی قسم کے نتائج کے ساتھ ایک قسم ہے، اور شافعیہ کا تقاضا ہے کہ قسم کھانے والا اس سے قسم کا ارادہ کرے۔"
