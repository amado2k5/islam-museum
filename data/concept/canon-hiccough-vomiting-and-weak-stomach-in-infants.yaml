summary:
  ar: "يذكر ابن سينا ثلاثة أحوال عند الصبي: الفواق وعلاجه جوز الهند مع السكر، والقيء المبرح وعلاجه نصف دانق من القرنفل وتضميد المعدة بحوابس القيء الضعيفة، وضعف المعدة وعلاجه تلطيخها بميسوس وسقي ماء السفرجل {cite:canon-ibn-sina-print-v1 p.218}."
  en: "Ibn Sina names three states of a child: hiccough, treated with coconut and sugar; violent vomiting, treated with half a daniq of clove and poulticing the stomach with mild vomit-stoppers; and a weak stomach, treated by smearing it with liquorice water and giving quince water {cite:canon-ibn-sina-print-v1 p.218}."
