summary:
  ar: "المنيحة ما يعطى من النخل والناقة والشاة ليتناول ما يتولد منه كاللبن والثمر، وهي عارية، وقد تكون تمليكا. وتفترق عن العارية والعمرى والهبة. وقد رغب الشارع في إعطائها، ولها صيغة، ويجري عليها حكم العارية في الضمان."
  en: "Manīha is the gift of a palm, camel or ewe to take what it yields, such as milk or dates, and returned afterwards. It is a loan, or a gift when it is worded as one. It is distinct from the loan (ariyya), the life-interest (umra) and the gift (hiba). The lawgiver encouraged it; it has its form of words, and the loan rules govern its liability."
  ur: "منیحہ وہ جانور یا درخت ہے جو کسی کو دیا جائے تاکہ وہ اس کا دودھ یا پھل لے، اور اس کا حکم عاریت کا ہے۔ اسے دینا مستحب ہے، اور اس کا ضمان عاریت کے احکام پر ہوتا ہے۔"
