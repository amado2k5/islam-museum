summary:
  ar: "المنيحة ما يعطى من النخل والناقة والشاة ليتناول ما يتولد منه كاللبن والثمر، وهي عارية، وقد تكون تمليكا. وتفترق عن العارية والعمرى والهبة. وقد رغب الشارع في إعطائها، ولها صيغة، ويجري عليها حكم العارية في الضمان."
  en: "Manīha is the gift of a palm, camel or ewe to take what it yields, such as milk or dates, and returned afterwards. It is a loan, or a gift when it is worded as one. It is distinct from the loan (ariyya), the life-interest (umra) and the gift (hiba). The lawgiver encouraged it; it has its form of words, and the loan rules govern its liability."
  ur: "منیحہ وہ جانور یا درخت ہے جو کسی کو دیا جائے تاکہ وہ اس کا دودھ یا پھل لے، اور اس کا حکم عاریت کا ہے۔ اسے دینا مستحب ہے، اور اس کا ضمان عاریت کے احکام پر ہوتا ہے۔"
  es: "Manīha es la donación de una palmera, camello u oveja para aprovechar sus frutos, como leche o dátiles, y devolverlos posteriormente. Se trata de un préstamo, o una donación cuando se formula como tal. Es distinta del préstamo (ariyya), el usufructo vitalicio (umra) y la donación (hiba). El legislador la fomentó; tiene su propia formulación y las normas de préstamo rigen su responsabilidad."
  fr: "La manīha est le don d'un palmier, d'un chameau ou d'une brebis, dont on perçoit les produits (lait, dattes, etc.) avant de le restituer. Il s'agit d'un prêt, ou d'un don lorsqu'il est formulé comme tel. Elle se distingue du prêt (ariyya), de l'usufruit (umra) et du don (hiba). Le législateur l'a encouragée; elle possède sa propre formulation et les règles relatives aux prêts en régissent les obligations."
  tr: "Cömert bir ürün, palmiye ağaçları, dişi develer veya koyunlardan elde edilen süt ve meyve gibi ürünleri tüketmek için verilen şeydir. Çıplaktır ve mülkiyet olarak kabul edilebilir. 'Ariyah' (l'ariyya), 'umre ve hediyeden farklıdır. Kanun Sahibi bunun verilmesine izin vermiştir, bir formülü vardır ve 'al-'iriyah' hükmü sorumluluk açısından geçerlidir."
  id: "Barang yang murah hati adalah apa yang diberikan dari pohon palem, unta betina, atau domba untuk dikonsumsi hasil darinya, seperti susu dan buah. Barang itu telanjang dan dapat dianggap sebagai kepemilikan. Ia berbeda dari 'ariyah' (l'ariyya), 'umrah, dan hadiah. Sang Pemberi Hukum telah mengizinkan pemberiannya, dan memiliki rumus, dan aturan 'al-'iriyah' berlaku untuknya dalam hal tanggung jawab."
