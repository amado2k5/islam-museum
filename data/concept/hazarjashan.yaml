  es: "Hazarjashan es una fruta parecida a racimos, utilizada por los curtidores; el libro promete una descripción más completa bajo la letra fa, en fashra. {cite:canon-ibn-sina-print-v1 p.448}"
  fr: "L'hazarjashan est un fruit ressemblant à des grappes, utilisé par les tanneurs; le livre promet une description plus complète à la lettre fa, à fashra. {cite:canon-ibn-sina-print-v1 p.448}"
