id: "concept/ilaj-nuzul-al-ma"
class: "concept"
kind: "scientific"
label:
  ar: "معالجة نزول الماء والقدح"
  en: "The treatment of the water and the couching"
  ur: "پانی کے نزول کا علاج اور قدح"
  es: "El tratamiento del agua y el recubrimiento"
summary:
  ar: "إذا تدورك الماء في أوله نفع فيه التدبير، وأما إذا استحكم فليس إلا القدح، فيهجر صاحبه الامتلاء والشرب والحمام ويقتصر على وجبة نصف النهار، والقيء وإن نفع من جهة تنقية المعدة فهو ضار في خصوصية الماء؛ ويجب أن يتقدم القدح تنقية البدن والرأس وأن لا يكون المقدوح مصدوعاً أو مبتلى بسعال أو شديد الضجر سريع الغضب، وأن لا يستعمل القدح إلا بعد أن يقف الماء ويغلظ قوامه قليلاً وهو المسمى الاستكمال، والماء إن كان رقيقاً جداً أو غليظاً جداً لم يطع القدح ⁦⁦(وصف القدح والتضميد والنصبة منقول كوصف الكتاب لما يفعل لا كعملية، وسطر الجماع سطر موسوم مطروح لحكم المؤسس، وأسماء الأدوية والمقادير لا تحمل)⁩⁩ {cite:canon-ibn-sina-print-v2 p.214} {cite:canon-ibn-sina-print-v2 p.215}"
  en: "If the water is caught early, regimen benefits it; once established there is only the couching. Its man must abandon repletion, drink and the bath and keep to one midday meal; vomiting, though it benefits by cleansing the stomach, harms in this disease's particular. Cleansing of body and head must precede the couching, the couched must not be broken-headed, cough-ridden or quick to anger, and the couching is only used after the water stands still and thickens a little — called its completion — for water too thin or too thick does not obey it ⁦(the couching, bandaging and posture are carried as the book's description of what is done, not as a procedure; the coitus line is a labelled listing for the founder's ruling; drug names and measures are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.214} {cite:canon-ibn-sina-print-v2 p.215}"
  ur: "اگر پانی ابتداء میں پکڑا جائے تو تدبیر اس میں سودمند ہوتی ہے، اور جب مستحکم ہو جائے تو قدح کے سوا کچھ نہیں؛ اس کا مریض امتلاء، مشروب اور حمام سے اجتناب کرے اور دوپہر کے ایک وقت کے کھانے پر اکتفا کرے؛ قے اگرچہ معدہ صاف کرنے کے اعتبار سے سودمند ہے لیکن اس مرض کی خصوصیت میں مضر ہے؛ اور قدح سے پہلے بدن اور سر کی تنقیہ ضروری ہے، مقدوح سر درد والا، کھانسی میں مبتلا یا جلد غصے والا نہ ہو، اور قدح صرف تب استعمال ہو جب پانی ٹھہر کر قدرے گاڑھا ہو جائے جسے استکمال کہتے ہیں، کیونکہ نہایت پتلا یا نہایت گاڑھا پانی قدح نہیں مانتا ⁦⁦(قدح، بندھن اور لیٹنے کی صورت کتاب کے بیان کے طور پر منقول ہے، عملی طریقہ نہیں؛ جماع والی سطر بانی کے فیصلے کے لیے موسوم فہرست ہے؛ ادویہ کے نام اور مقدار منقول نہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.214} {cite:canon-ibn-sina-print-v2 p.215}"
  es: "Si el agua se recoge a tiempo, el régimen la beneficia; una vez establecida, solo queda el coitus. El hombre debe abandonar la repleción, beber y bañarse, y limitarse a una sola comida al mediodía; el vómito, aunque beneficia al limpiar el estómago, perjudica en particular en esta enfermedad. La limpieza del cuerpo y la cabeza debe preceder al coitus, el coitus no debe tener la cabeza quebrada, toser o enojarse con facilidad, y el coitus solo se usa después de que el agua se asienta y espesa un poco —llamado su finalización—, ya que el agua demasiado líquida o demasiado espesa no le obedece (el coitus, el vendaje y la postura se llevan como la descripción del libro de lo que se hace, no como un procedimiento; la línea del coitus es una lista etiquetada para la regla del fundador; no se llevan nombres de medicamentos ni medidas) {cite:canon-ibn-sina-print-v2 p.214} {cite:canon-ibn-sina-print-v2 p.215}"
