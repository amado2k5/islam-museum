id: concept/al-mahdi
class: concept
kind: doctrine
label:
  ar: المهدي
  en: The Mahdi
  fr: "Le Mahdi"
  ur: مہدی
  es: "El Mahdi"
  tr: "Mehdi"
  id: "Mehdi"
summary:
  ar: "المهدي عند أهل السنة: المهدي المنتظر الذي يملأ الأرض عدلا كما مُلئت جورا، من آل محمد، يظهر قبل قيام الساعة في زمن فتنة، فيحكم بالإسلام ويهدي إلى سواء السبيل. يذكر كثير من أهل السنة أن المهدي من أهل البيت وأن عيسى ينزل في زمانه أو بعده."
  en: "The Mahdi in Sunni belief: the awaited guide who fills the earth with justice as it was filled with injustice, of the house of Muhammad, appearing before the Hour amid trial. Many Sunnis hold he is of the Prophet's household and that Jesus descends in his time or after him."
  fr: "Le Mahdi dans la croyance sunnite : le guide attendu qui emplit la terre de justice comme elle avait été emplie d’injustice, issu de la maison de Muhammad, apparaissant avant l’Heure au milieu des épreuves. Beaucoup de sunnites estiment qu’il appartient à la famille du Prophète et que Jésus descend de son temps ou après lui."
  ur: "اہل سنت کی رائے میں مہدی: وہ مہدی جس کے ہاتھوں زمین عدل سے بھر جائے گی جیسی ظلم سے بھری ہوئی ہے، آلِ محمد میں سے، قیامت سے پہلے فتنوں کے زمانے میں ظاہر ہوگا اور اسلام کی حکومت کرے گا۔ بہت سے اہل سنت کہتے ہیں کہ وہ نبی کے گھرانوں میں سے ہے اور اس کے زمانے میں یا بعد میں عیسیٰ nazul فرمائے گا۔"
  es: "El Mahdi, según la creencia sunita, es el guía esperado que llenará la tierra de justicia, tal como estaba llena de injusticia; pertenece a la casa de Mahoma y aparecerá antes del Día del Juicio en medio de la prueba. Muchos sunitas creen que es de la familia del Profeta y que Jesús descenderá en su tiempo o después de él."
  tr: "Ehl-sünnet'e göre Mehdi: Adaletle dolu, yeryüzünü adaletle dolduran beklenen Mehdi, Muhammed'in ailesinden gelen, Kıyamet Günü'nden önce sınav zamanında ortaya çıkar, İslam'ı yönetir ve doğru yola yönlendirir. Birçok Ehl-sünnet, Mehdi'nin Ehl-Beyt'ten olduğunu ve İsa'nın kendi zamanında ya da ondan sonra indiğini belirtir."
  id: "Menurut Ahl al-Sunnah, Mahdi: Mahdi, penuh keadilan, memenuhi bumi dengan keadilan, adalah Mahdi yang diharapkan, yang berasal dari keluarga Muhammad, muncul pada masa ujian sebelum Hari Kiamat, mengatur Islam, dan membimbingnya ke jalan yang benar. Banyak Ahl al-Sunnah menyatakan bahwa Mahdi berasal dari Ahl al-Bayt dan bahwa Yesus turun selama atau sesudah zamannya."
