id: concept/al-mahdi
class: concept
kind: doctrine
label:
  ar: المهدي
  en: The Mahdi
  ur: مہدی
summary:
  ar: "المهدي عند أهل السنة: المهدي المنتظر الذي يملأ الأرض عدلا كما مُلئت جورا، من آل محمد، يظهر قبل قيام الساعة في زمن فتنة، فيحكم بالإسلام ويهدي إلى سواء السبيل. يذكر كثير من أهل السنة أن المهدي من أهل البيت وأن عيسى ينزل في زمانه أو بعده."
  en: "The Mahdi in Sunni belief: the awaited guide who fills the earth with justice as it was filled with injustice, of the house of Muhammad, appearing before the Hour amid trial. Many Sunnis hold he is of the Prophet's household and that Jesus descends in his time or after him."
  ur: "اہل سنت کی رائے میں مہدی: وہ مہدی جس کے ہاتھوں زمین عدل سے بھر جائے گی جیسی ظلم سے بھری ہوئی ہے، آلِ محمد میں سے، قیامت سے پہلے فتنوں کے زمانے میں ظاہر ہوگا اور اسلام کی حکومت کرے گا۔ بہت سے اہل سنت کہتے ہیں کہ وہ نبی کے گھرانوں میں سے ہے اور اس کے زمانے میں یا بعد میں عیسیٰ nazul فرمائے گا۔"
