label: { ar: "أثر الروسيا في الشرق", en: "Russia's effect on the East" }
summary:
  ar: "يعرض شكيب أرسلان مقالات ومواقف أوروبية وروسية تعالج أثر روسيا القيصرية في المشرق، ثم أثر الحكومة البلشفية بعدها. يرى أن السياسة القيصرية قامت على قهر الشرق ومحاربة الدولة العثمانية لفائدة الدول الغربية، وأن انهيار الدولة الروسية كان بداية تحرر آسيا في نظره. ويذكر أن الدول الغربية حاولت إثارة قوى مناوئة للبلشفية في روسيا بتسليح قادة وأقوام، وأنها حذرت من أن تقف قوة إسلامية في وجه الحكومة البلشفية. يعرض هذا كله كتقدير المؤلف، وقد نقل بعض الشواهد عن صحف وأقوال أوروبية وروسية لم يتحقق منها هنا."
  en: "Arslan surveys European and Russian writings on how Tsarist Russia affected the Middle East and Asia, then the Bolshevik period. He argues that Tsarist policy mainly oppressed the East and weakened the Ottoman state for Western benefit, and that the fall of the Russian state opened the way for Asia's liberation. He reports that Western powers armed anti-Bolshevik forces and warned against any Muslim force joining against the Soviet government. This is the author's assessment, drawing on newspapers and quotations he did not verify here."
