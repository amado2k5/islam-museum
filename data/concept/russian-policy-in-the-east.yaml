label: { ar: "أثر الروسيا في الشرق", en: "Russia's effect on the East", es: "El efecto de Rusia en Oriente", fr: "L'influence de la Russie sur l'Est", ur: "مشرق پر روس کا اثر" }
summary:
  ar: "يعرض شكيب أرسلان مقالات ومواقف أوروبية وروسية تعالج أثر روسيا القيصرية في المشرق، ثم أثر الحكومة البلشفية بعدها. يرى أن السياسة القيصرية قامت على قهر الشرق ومحاربة الدولة العثمانية لفائدة الدول الغربية، وأن انهيار الدولة الروسية كان بداية تحرر آسيا في نظره. ويذكر أن الدول الغربية حاولت إثارة قوى مناوئة للبلشفية في روسيا بتسليح قادة وأقوام، وأنها حذرت من أن تقف قوة إسلامية في وجه الحكومة البلشفية. يعرض هذا كله كتقدير المؤلف، وقد نقل بعض الشواهد عن صحف وأقوال أوروبية وروسية لم يتحقق منها هنا."
  en: "Arslan surveys European and Russian writings on how Tsarist Russia affected the Middle East and Asia, then the Bolshevik period. He argues that Tsarist policy mainly oppressed the East and weakened the Ottoman state for Western benefit, and that the fall of the Russian state opened the way for Asia's liberation. He reports that Western powers armed anti-Bolshevik forces and warned against any Muslim force joining against the Soviet government. This is the author's assessment, drawing on newspapers and quotations he did not verify here."
  es: "Arslan analiza escritos europeos y rusos sobre cómo la Rusia zarista afectó a Oriente Medio y Asia, y posteriormente al período bolchevique. Sostiene que la política zarista oprimió principalmente a Oriente y debilitó al Estado otomano en beneficio de Occidente, y que la caída del Estado ruso allanó el camino para la liberación de Asia. Informa que las potencias occidentales armaron a las fuerzas antibolcheviques y advirtieron contra cualquier fuerza musulmana que se uniera al gobierno soviético. Esta es la valoración del autor, basada en periódicos y citas que no verificó en este trabajo."
  fr: "Arslan examine les écrits européens et russes sur l'influence de la Russie tsariste sur le Moyen-Orient et l'Asie, puis sur la période bolchevique. Il soutient que la politique tsariste a principalement opprimé l'Orient et affaibli l'État ottoman au profit de l'Occident, et que la chute de la Russie a ouvert la voie à la libération de l'Asie. Il rapporte que les puissances occidentales ont armé les forces antibolcheviques et mis en garde contre toute tentative de ralliement de forces musulmanes contre le gouvernement soviétique. Telle est l'analyse de l'auteur, fondée sur des articles de presse et des citations qu'il n'a pas vérifiés ici."
  ur: "ارسلان نے یورپی اور روسی تحریروں کا سروے کیا کہ کس طرح زارسٹ روس نے مشرق وسطیٰ اور ایشیا، پھر بالشویک دور کو متاثر کیا۔ وہ دلیل دیتے ہیں کہ زار کی پالیسی نے بنیادی طور پر مشرق پر ظلم کیا اور مغربی فائدے کے لیے عثمانی ریاست کو کمزور کیا، اور روسی ریاست کے زوال نے ایشیا کی آزادی کا راستہ کھولا۔ وہ رپورٹ کرتا ہے کہ مغربی طاقتوں نے بالشویک مخالف قوتوں کو مسلح کیا اور سوویت حکومت کے خلاف کسی بھی مسلم قوت کے ساتھ شمولیت کے خلاف خبردار کیا۔ یہ مصنف کا اندازہ ہے، اخبارات اور اقتباسات پر ڈرائنگ جس کی اس نے یہاں تصدیق نہیں کی۔"
