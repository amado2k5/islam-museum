id: "concept/al-barada"
class: "concept"
kind: "scientific"
label:
  ar: "البردة في الجفن"
  en: "The hail-stone in the lid (barada, chalazion)"
  fr: "Le grêlon dans la paupière (barada, chalazion)"
  ur: "پلک میں بردہ"
  es: "El granizo en la tapa (barada, chalazión)"
summary:
  ar: "البردة رطوبة تغلظ وتتحجر في باطن الجفن وتكون إلى البياض تشبه البرد، وتستعمل عليها لطوخ محللة ⁦(أسماء الأطلية لا تحمل، وما بعده من فصول الجفن في الحزمة التالية)⁩ {cite:canon-ibn-sina-print-v2 p.196}"
  en: "The barada is a moisture that thickens and turns to stone inside the lid, whitish, resembling hail; dissolving smears are used on it ⁦(the smear names are not carried; the remaining lid chapters go to the next packet)⁩ {cite:canon-ibn-sina-print-v2 p.196}"
  fr: "Dans le texte d’Ibn Sina, la barada est une humeur blanchâtre qui s’épaissit et se pétrifie à l’intérieur de la paupière, à la manière d’un grêlon. Le texte mentionne l’application de préparations destinées à la résorber (leurs noms ne sont pas reproduits ; les autres chapitres sur la paupière sont traités dans le lot suivant) {cite:canon-ibn-sina-print-v2 p.196}"
  ur: "بردہ ایک رطوبت ہے جو پلک کے اندر گاڑھی ہو کر پتھر جیسی بن جاتی ہے، سفیدی مائل، اولے جیسی معلوم ہوتی ہے؛ اس پر تحلیل کرنے والے طلاء استعمال ہوتے ہیں ⁦(طلاؤں کے نام منقول نہیں؛ پلک کے باقی ابواب اگلی حزم میں)⁩ {cite:canon-ibn-sina-print-v2 p.196}"
  es: "La barada es una humedad que se espesa y se solidifica en el interior de la tapa, de color blanquecino, parecida al granizo; se utilizan ungüentos disolventes sobre ella (no se incluyen los nombres de los ungüentos; los capítulos restantes sobre la tapa se encuentran en el siguiente paquete) {cite:canon-ibn-sina-print-v2 p.196}"
