id: concept/idarat-al-hayat
class: concept
kind: term
label:
  ar: "إدارة الحياة واختيار المجال"
  en: "Life management and choosing one's field"
  ur: "زندگی کا انتظام اور میدان کا انتخاب"
  es: "Gestión de la vida y elección de la propia profesión."
  fr: "Gestion de sa vie et choix de son domaine professionnel"
  tr: "Yaşam Yönetimi ve Alan Seçimi"
  id: "Manajemen Kehidupan dan Pemilihan Domain"
summary:
  ar: "إدارة الحياة عند طارق السويدان — الجيل الرابع لإدارة الوقت: يختار الإنسان مجالاً واحداً لحياته بمعادلة الرغبة والفرصة والقدرة، يضع من ثلاثة إلى عشرة مشاريع كبرى تحتاج خمس عشرة إلى عشرين سنة، ويوزع أهدافه على أدواره الإيمانية والاجتماعية والصحية والمالية والمهارية، بقاعدة الخمسين في المئة."
  en: "Life management in Tareq al-Suwaidan's teaching — the fourth generation of time management: choosing a single field of life by the desire-opportunity-ability equation, setting three to ten major projects needing fifteen to twenty years, and distributing goals over one's faith, social, health, financial and skill roles, by the fifty-per-cent rule."
  ur: "طارق السویدان کی تعلیم میں زندگی کا انتظام — وقت کے انتظام کی چوتھی نسل: رغبت، موقع اور قابلیت کی مساوات سے زندگی کا ایک میدان منتخب کرنا، پندرہ تا بیس سال مانگی جانے والے تین تا دس بڑے منصوبے رکھنا، اور ایمانی، سماجی، صحت، مالی اور مہارتی کرداروں پر اہداف بانٹنا، پچاس فیصد کے اصول کے ساتھ۔"
  es: "La gestión de la vida en las enseñanzas de Tareq al-Suwaidan —la cuarta generación de gestión del tiempo— consiste en elegir un único ámbito de la vida mediante la ecuación deseo-oportunidad-capacidad, establecer de tres a diez proyectos importantes que requieran de quince a veinte años, y distribuir los objetivos entre los roles de fe, sociales, de salud, financieros y de habilidades, según la regla del cincuenta por ciento."
  fr: "La gestion de la vie dans l'enseignement de Tareq al-Suwaidan — la quatrième génération de gestion du temps: choisir un seul domaine de vie selon l'équation désir-opportunité-capacité, définir trois à dix projets majeurs nécessitant quinze à vingt ans, et répartir les objectifs entre ses rôles dans la foi, les relations sociales, la santé, les finances et les compétences, selon la règle des cinquante pour cent."
  tr: "Tariq Al-Suwaidan tarafından Hayat Yönetimi — Zaman Yönetiminin Dördüncü Kuşağı: Bir kişi, arzu, fırsat ve yetenek arasında denge kurarak, on beş ila yirmi yıl gerektiren üç ila on büyük projeyi belirleyerek ve hedeflerini inanç, sosyal, sağlık, finansal ve beceri rollerine yüzde elli prensibe göre dağıtarak bir yaşam alanını seçer."
  id: "Manajemen Kehidupan oleh Tariq Al-Suwaidan — Generasi Keempat Manajemen Waktu: Seseorang memilih satu bidang kehidupan dengan menyeimbangkan keinginan, kesempatan, dan kemampuan, menetapkan dari tiga hingga sepuluh proyek besar yang membutuhkan lima belas hingga dua puluh tahun, serta mendistribusikan tujuan mereka di berbagai peran iman, sosial, kesehatan, keuangan, dan keterampilan, berdasarkan prinsip lima puluh persen."
