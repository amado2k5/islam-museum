id: concept/idarat-al-hayat
class: concept
kind: term
label:
  ar: "إدارة الحياة واختيار المجال"
  en: "Life management and choosing one's field"
  ur: "زندگی کا انتظام اور میدان کا انتخاب"
summary:
  ar: "إدارة الحياة عند طارق السويدان — الجيل الرابع لإدارة الوقت: يختار الإنسان مجالاً واحداً لحياته بمعادلة الرغبة والفرصة والقدرة، يضع من ثلاثة إلى عشرة مشاريع كبرى تحتاج خمس عشرة إلى عشرين سنة، ويوزع أهدافه على أدواره الإيمانية والاجتماعية والصحية والمالية والمهارية، بقاعدة الخمسين في المئة."
  en: "Life management in Tareq al-Suwaidan's teaching — the fourth generation of time management: choosing a single field of life by the desire-opportunity-ability equation, setting three to ten major projects needing fifteen to twenty years, and distributing goals over one's faith, social, health, financial and skill roles, by the fifty-per-cent rule."
  ur: "طارق السویدان کی تعلیم میں زندگی کا انتظام — وقت کے انتظام کی چوتھی نسل: رغبت، موقع اور قابلیت کی مساوات سے زندگی کا ایک میدان منتخب کرنا، پندرہ تا بیس سال مانگی جانے والے تین تا دس بڑے منصوبے رکھنا، اور ایمانی، سماجی، صحت، مالی اور مہارتی کرداروں پر اہداف بانٹنا، پچاس فیصد کے اصول کے ساتھ۔"
