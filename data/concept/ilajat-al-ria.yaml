summary:
  ar: "قيل في باب الربو والتنفس ما يتأمل فيه وينتقل منه إلى ما يشاركه في السبب من الأمراض، وقد تراض الرئة بمثل رفع الصوت والنفس النافخ لتلطف بذلك فضولها، ولاستعمال الأدوية الصدرية هيئة خاصة فإنها تستعمل حبوباً ولعوقات في أكثر الأمر تمسك في الفم ويبلع ما يتحلل منها قليلاً قليلاً لتطول مدة عبورها في جواز القصبة فيتأدى إلى القصبة والرئة وخصوصاً إذا نام مستلقياً وارتخت العضل التي على الرئة وقصبتها، وأقرب وجوه إمالة فضول الرئة الجانب الذي يلي المريء فينتفع بالقيء كثيراً إذا لم يكن مانع ⁦(أما الأدوية نفسها وأشكالها فلا تذكر بحسب قاعدة السجل)⁩ {cite:canon-ibn-sina-print-v2 p.305}"
  en: "What was said in the chapter of asthma and breathing is to be considered here and transferred to whatever shares its cause among the diseases. The lung is exercised by such as raising the voice and the puffing breath, so as to refine its residues; and the chest drugs have a special way of being used: most often they are used as pills and lohochs held in the mouth, what dissolves of them swallowed little by little so that their passage down the windpipe's course lasts long and reaches windpipe and lung — above all when the patient sleeps on his back and all the muscles over lung and windpipe are relaxed. The nearest way to incline the lung's residues is the side next the oesophagus, so vomiting profits it much when nothing forbids (the drugs themselves and their forms are not named, per the register's rule) {cite:canon-ibn-sina-print-v2 p.305}"
  ur: "ربو اور تنفس کے باب میں جو کہا گیا وہ یہاں غور کے لیے اور ان بیماریوں کے لیے ہے جو اسباب میں اس کی شریک ہیں؛ پھیپھڑے کو آواز بلند کرنے اور پھونکنے والے نفس جیسی چیزوں سے ورزش دی جاتی ہے تاکہ اس کے فضول لطیف ہوں؛ اور صدری ادویہ کے استعمال کی خاص صورت یہ ہے کہ وہ اکثر گولیوں اور لعوقوں کی صورت میں استعمال ہوتے ہیں جو منہ میں رکھے جاتے ہیں اور ان کا گھلنے والا حصہ آہستہ آہستہ نگلایا جاتا ہے تاکہ قصبہ کے راستے ان کا گزر دیر تک رہے اور قصبہ اور پھیپھڑے تک پہنچے — خصوصاً جب مریض چت سوئے اور پھیپھڑے اور قصبہ پر کے تمام پٹھے ڈھیلے ہوں؛ پھیپھڑے کے فضول کو جھکانے کا قریب ترین راستہ مریء کی طرف والا پہلو ہے اس لیے قی اسے بہت نفع دیتا ہے جب کوئی مانع نہ ہو ⁦(ادویہ خود اور ان کی صورتیں ضابطۂ خانۂ معلومات کی قاعدہ کے مطابق نہیں بتائی جاتیں)⁩ {cite:canon-ibn-sina-print-v2 p.305}"
  es: "Lo dicho en el capítulo sobre el asma y la respiración debe considerarse aquí y aplicarse a cualquier enfermedad que comparta su causa. El pulmón se ejercita mediante ejercicios como elevar la voz y exhalar aire, para así eliminar sus residuos; y los medicamentos para el pecho se administran de una manera particular: con mayor frecuencia se usan como pastillas y comprimidos que se mantienen en la boca, disolviéndose poco a poco al tragarlos, de modo que su recorrido por la tráquea sea prolongado y llegue a la tráquea y al pulmón, sobre todo cuando el paciente duerme boca arriba y todos los músculos sobre el pulmón y la tráquea están relajados. La vía más cercana para dirigir los residuos pulmonares es el lado adyacente al esófago, por lo que el vómito resulta muy beneficioso cuando no hay contraindicaciones (los medicamentos y sus formas no se mencionan, según la regla del registro) {cite:canon-ibn-sina-print-v2 p.305}"
  fr: "Ce qui a été dit dans le chapitre sur l'asthme et la respiration doit être considéré ici et appliqué à toutes les maladies qui partagent la même cause. Le poumon est exercé par des gestes tels que parler fort et respirer profondément, afin d'éliminer ses sécrétions. Les médicaments pour la poitrine ont un mode d'emploi particulier: le plus souvent, ils sont administrés sous forme de comprimés ou de pastilles à sucer, qui se dissolvent lentement lorsqu'ils sont avalés, de sorte que leur passage dans la trachée soit long et qu'ils atteignent la trachée et les poumons – surtout lorsque le patient dort sur le dos et que tous les muscles recouvrant les poumons et la trachée sont relâchés. Le moyen le plus efficace d'éliminer les sécrétions pulmonaires est le côté œsophagien; les vomissements sont donc très bénéfiques, sauf contre-indication (les médicaments eux-mêmes et leurs formes ne sont pas nommés, conformément aux règles du registre). {cite:canon-ibn-sina-print-v2 p.305}"
  tr: "Astım ve nefes alma hakkında, düşünülen ve hastalıkların nedenini paylaşan şeye aktarılan şeyler söylenir. Akciğerler, meraklarını yumuşatmak için seslerini ve nefeslerini yükseltmeyi kabul edebilir. Göğüs ilaçlarının özel bir formunda kullanımı için çoğunlukla ağızda tutan ve yavaş yavaş çözünen sıvıyı yutan haplar ve rujlar kullanılır; bu da trakea geçişini uzatır, özellikle akciğer ve bronş kasları gevşediğinde trakea ve akciğerlere ulaşır. Akciğerlerin merakını en yakın şekilde yönlendiren yol, yemek borusunun öteki tarafıdır; bu, kontrendikasyon yoksa kusmaya büyük fayda sağlar (ilaçların kendisi ve biçimleri kayıt kuralına göre belirtilmemiştir) {cite:canon-ibn-sina-print-v2 s.305}"
  id: "Telah dikatakan tentang asma dan pernapasan tentang apa yang dipikirkan dan kemudian ditransfer ke penyebab penyakit yang sama. Paru-paru mungkin setuju untuk meninggikan suara dan bernapas untuk melunakkan rasa ingin tahu mereka. Untuk penggunaan obat dada dalam bentuk khusus, mereka biasanya menggunakan pil dan lipstik yang menahan di mulut dan menelan apa yang secara bertahap larut untuk memperpanjang perjalanan melalui trakea, yang mengarah ke trakea dan paru-paru, terutama jika otot paru-paru dan bronkus rileks. Cara terdekat untuk memiringkan rasa ingin tahu paru-paru adalah di sisi di luar esofagus, yang sangat menguntungkan muntah jika tidak ada kontraindikasi (seperti obat dan bentuknya, mereka tidak disebutkan sesuai aturan catatan) {cite:canon-ibn-sina-print-v2 hlm.305}"
