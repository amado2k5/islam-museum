label:
  ar: "مشك طرامشير"
  en: "Mishk taramshir (wild thyme-like pennyroyal)"
  ur: "مشک طرامشیر"
  es: "Mishk taramshir (poleo silvestre parecido al tomillo)"
  fr: "Mishk taramshir (pounnyroyal ressemblant au thym sauvage)"
summary:
  ar: "مشك طرامشير هو الفوتنج البري بحسب الحاشية، قضبان حارة يابسة إلى الثالثة، ينوب عن الفوتنج وأقوى منه، يخرج الرطوبات اللزجة من الصدر {cite:canon-ibn-sina-print-v1 p.560}."
  en: "Mishk taramshir is, by the editor's note, wild pennyroyal: rods hot and dry toward the third degree, standing in for pennyroyal and much stronger, bringing sticky moistures out of the chest {cite:canon-ibn-sina-print-v1 p.560}."
  ur: "مشک طرامشیر، محقق کے حاشیے کے مطابق، جنگلی پودینہ فوتنج ہے: چھڑیاں جو تیسرے درجے تک گرم خشک ہیں، فوتنج کی جگہ لیتی اور اس سے کہیں قوی ہیں، سینے سے لیس دار رطوبتیں نکالتی ہیں {cite:canon-ibn-sina-print-v1 p.560}۔"
  es: "Mishk taramshir es, según la nota del editor, poleo silvestre: varillas calientes y secas hacia el tercer grado, que sustituyen al poleo y son mucho más fuertes, que extraen la humedad pegajosa del pecho {cite:canon-ibn-sina-print-v1 p.560}."
  fr: "Le Mishk taramshir est, selon la note de l'éditeur, de la menthe pouliot sauvage: des tiges chaudes et sèches vers le troisième degré, remplaçant la menthe pouliot et beaucoup plus fortes, faisant sortir les humidités collantes de la poitrine {cite:canon-ibn-sina-print-v1 p.560}."
