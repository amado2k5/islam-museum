id: concept/correcting-a-medicinal-food-eaten-by-mistake
class: concept
kind: scientific
label: { ar: "تدارك الغذاء الدوائي إذا تناوله المرء خطأ", en: "Correcting a medicinal food eaten by mistake", ur: "غلطی سے دوائی غذا کھانے کی اصلاح", es: "Corrección de un alimento medicinal ingerido por error", fr: "Correction d'un aliment médicinal consommé par erreur", tr: "Yanlış alındığında ilaç", id: "Obat-obatan jika dikonsumsi secara salah" }
summary:
  ar: "يذكر ابن سينا أنه إذا وقع الخطأ فتنوول شيء من الأغذية الدوائية وجب تدبير هضمه وإنضاجه والاحتراز من سوء المزاج المتوقع منه باستعمال ضده عقيبه، فالبارد كالقثاء والخيار والقرع يعدل بالثوم والكراث، والحار يعدل بالقثاء وبقلة الحمقاء، والسددي بما يفتح ويستفرغ ثم جوع صالح {cite:canon-ibn-sina-print-v1 pp.228-229}."
  en: "Ibn Sina says that when a medicinal food has been taken by mistake its digestion and ripening must be managed and the expected imbalance guarded against by following it with its opposite: a cold one such as qiththa, cucumber or gourd is corrected with garlic and leek, a hot one with cucumber and purslane, and a blocking one with what opens and evacuates, then a fitting fast {cite:canon-ibn-sina-print-v1 pp.228-229}."
  es: "Ibn Sina dice que cuando se ha tomado por error un alimento medicinal, su digestión y maduración deben ser controladas y el desequilibrio esperado debe evitarse llevándolo después de su opuesto: uno frío como el qiththa, el pepino o la calabaza se corrige con ajo y puerro, uno caliente con pepino y verdolaga, y uno bloqueador con lo que abre y evacua, luego un ayuno apropiado {cite:canon-ibn-sina-print-v1 pp.228-229}."
  fr: "Ibn Sina dit que lorsqu'un aliment médicinal a été pris par erreur, sa digestion et sa maturation doivent être gérées et le déséquilibre attendu prévenu en le faisant suivre de son opposé: un aliment froid comme le qiththa, le concombre ou la courge est corrigé avec de l'ail et du poireau, un aliment chaud avec du concombre et du pourpier, et un aliment bloquant avec ce qui ouvre et évacue, puis un jeûne approprié {cite:canon-ibn-sina-print-v1 pp.228-229}."
  ur: "ابن سینا کہتے ہیں کہ جب کوئی دوا غلطی سے کھا لی جائے تو اس کے ہاضمہ اور پکنے کا انتظام کیا جائے اور اس کے مخالف غذا پر عمل کرنے سے متوقع عدم توازن سے بچا جائے: ٹھنڈا جیسے قطح، ککڑی یا لوکی کو لہسن اور جون سے درست کیا جاتا ہے، گرم کھیرے اور قیمہ کے ساتھ، اور ایک روزہ کھولنے سے، اور پھر روزہ کھولنے سے روکا جاتا ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 228-229}۔"
  tr: "İbn Sina, bir hata olursa ve tıbbi yiyeceklerle karşılaşırsanız, sindirim ve pişmeyi yönetmek ve beklenen kötü ruh halini önlemek için sonrasında buna karşı kullanılmak gerektiğini belirtir. Soğuk tutam, salatalık ve balkabağı sarımsak ve pırasa ile dengelenir; baharatlı ise salatalık ve kuru meyve ile dengelenir; al-sadddi ise açılıp kusan şeydir, ardından iyi bir açlık {cite:canon-ibn-sina-print-v1 s.228-229}."
  id: "Ibn Sina menyebutkan bahwa jika terjadi kesalahan dan Anda mendapatkan makanan obat, perlu mengatur pencernaan dan memasaknya, serta menghindari suasana hati buruk yang diharapkan dengan menggunakannya setelahnya. Dingin seperti jumba, mentimun, dan labu seimbang dengan bawang putih dan daun bawang; pedas seimbang dengan mentimun dan buah kering; dan al-sadddi adalah yang terbuka dan muntah, lalu rasa lapar yang baik {cite:canon-ibn-sina-print-v1 hlm.228-229}."
