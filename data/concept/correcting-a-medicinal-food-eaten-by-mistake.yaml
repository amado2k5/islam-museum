id: concept/correcting-a-medicinal-food-eaten-by-mistake
class: concept
kind: scientific
label: { ar: "تدارك الغذاء الدوائي إذا تناوله المرء خطأ", en: "Correcting a medicinal food eaten by mistake", ur: "غلطی سے دوائی غذا کھانے کی اصلاح" }
summary:
  ar: "يذكر ابن سينا أنه إذا وقع الخطأ فتنوول شيء من الأغذية الدوائية وجب تدبير هضمه وإنضاجه والاحتراز من سوء المزاج المتوقع منه باستعمال ضده عقيبه، فالبارد كالقثاء والخيار والقرع يعدل بالثوم والكراث، والحار يعدل بالقثاء وبقلة الحمقاء، والسددي بما يفتح ويستفرغ ثم جوع صالح {cite:canon-ibn-sina-print-v1 pp.228-229}."
  en: "Ibn Sina says that when a medicinal food has been taken by mistake its digestion and ripening must be managed and the expected imbalance guarded against by following it with its opposite: a cold one such as qiththa, cucumber or gourd is corrected with garlic and leek, a hot one with cucumber and purslane, and a blocking one with what opens and evacuates, then a fitting fast {cite:canon-ibn-sina-print-v1 pp.228-229}."
