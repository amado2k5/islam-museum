id: concept/zij-sabi-true-conjunction-from-the-lead-of-the-moon
class: concept
kind: scientific
label: { ar: "الاجتماع الحقيقي من سبق القمر", en: "The true conjunction from the Moon's lead", ur: "چاند کی سبقت سے حقیقی اجتماع", es: "La verdadera conjunción desde el inicio de la Luna", fr: "La véritable conjonction de tête de la Lune" }
summary:
  ar: "يبيّن البتاني كيف يُعرف الاجتماع الحقيقي من الأوسط: يُنظر في الفضل بين موضعي الشمس والقمر، فإذا استويا في دقيقة واحدة فذلك وقت الاجتماع الحقيقي، وإذا اختلفا أُخذ فضل ما بينهما من الدرج والدقائق، وأُخذ سدسه وثمنه بحسب الأكثر والأقل. {cite:zij-sabi-nallino-byblion p.141}."
  en: "Al-Battani explains how the true conjunction is found from the mean: one looks at the difference between the places of the Sun and the Moon. If they coincide to within one minute, that is the true time of conjunction; if they differ, the difference in degrees and minutes is taken, with its sixth and eighth, depending on which is greater. {cite:zij-sabi-nallino-byblion p.141}."
  ur: "البتانی بتاتے ہیں کہ اوسط اجتماع سے حقیقی اجتماع کیسے معلوم ہو: سورج اور چاند کے مقامات کا فرق دیکھا جاتا ہے، اگر وہ ایک دقیقے کے اندر برابر ہوں تو یہی حقیقی اجتماع کا وقت ہے، اور اگر مختلف ہوں تو درجات اور دقائق کا فرق لیا جاتا ہے، اور کون زیادہ ہے اس کے مطابق اس کا چھٹا اور آٹھواں حصہ لیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.141}۔"
  es: "Al-Battani explica cómo se determina la conjunción verdadera a partir del promedio: se observa la diferencia entre las posiciones del Sol y la Luna. Si coinciden con una precisión de un minuto, ese es el momento exacto de la conjunción; si difieren, se toma la diferencia en grados y minutos, sumando el sexto y el octavo, según cuál sea mayor. {cite:zij-sabi-nallino-byblion p.141}."
  fr: "Al-Battani explique comment déterminer la véritable conjonction à partir de la moyenne: on observe la différence entre les positions du Soleil et de la Lune. Si elles coïncident à une minute près, il s’agit de l’heure véritable de la conjonction; si elles diffèrent, on calcule la différence en degrés et minutes, en prenant la sixième et la huitième valeur selon laquelle elle est la plus grande. {cite:zij-sabi-nallino-byblion p.141}."
