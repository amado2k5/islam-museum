id: concept/al-sawt-al-qasir
class: concept
kind: scientific
label:
  ar: "الصوت القصير"
  en: "The short voice"
  fr: "La voix courte"
  ur: "آواز کی قصرت"
summary:
  ar: "سبب قصر الصوت قصر النفس، ويجب أن يتدرج في تطويل النفس بأن يعتاد حصر النفس ويتدرج في الرياضة والصعود والهبوط في الروابي والدرج والإحصار المحوج إلى التنفس ليتدرج إلى تطويل النفس وكذلك تطويل المكث في الحمام الحار وفي كل ما يستدعي النفس وتعجيله، وليحبس نفسه ويرتاض ويستحم وبعد الخروج من الحمام وبعد الطعام يشرب الشراب فإنه أغذى للروح وليكن كثيراً بنفس واحد، والنوم نافع لهم ⁦(الرياضة والحبس والاستحمام على وصف الكتاب أخبار عما يفعل لا أحكام عمل)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
  en: "The cause of the voice's shortness is the breath's shortness, and one must graduate into lengthening the breath: accustoming oneself to holding the breath, graduating in exercise and in ascending and descending the hills and the stairs, and the confinement that compels to breathing, so as to graduate into lengthening the breath, and likewise lengthening the stay in the hot bath and in everything that calls for the breath and hastens it; let him hold his breath and do all that, exercise and bathe, and after leaving the bath and after food drink the drink, for it is more nourishing to the spirit, in plenty at one breath; and sleep benefits them (the exercise, holding and bathing are on the book's description, reports of what is done, not rulings) {cite:canon-ibn-sina-print-v2 p.326}"
  fr: "La cause de la brièveté de la voix est la brièveté du souffle, et il faut progresser graduellement vers l’allongement du souffle : s’habituer à retenir son souffle, progresser dans l’exercice et dans la montée et la descente des collines et des escaliers, ainsi que dans le confinement qui oblige à respirer, afin de progresser vers l’allongement du souffle, et de même prolonger le séjour au bain chaud et dans tout ce qui sollicite le souffle et le hâte ; qu’il retienne son souffle et fasse tout cela, qu’il s’exerce et se baigne, et après être sorti du bain et après le repas qu’il boive la boisson, car elle nourrit davantage l’esprit, en abondance d’une seule gorgée ; et le sommeil leur est bénéfique (l’exercice, la rétention et le bain selon la description du livre, comptes rendus de ce qui se fait et non prescriptions) {cite:canon-ibn-sina-print-v2 p.326}"
  ur: "آواز کی قصرت کا سبب سانس کی قصرت ہے اور سانس طوالت کی طرف بتدریج بڑھانا چاہیے: سانس روکنے کی عادت ڈالنا اور ورزش اور پہاڑیوں اور سیڑھیوں کے چڑھنے اترنے اور اس قید میں جو سانس پر مجبور کرے بتدریج بڑھنا تاکہ سانس طول پکڑے اور ایسے ہی گرم غسل خانے میں اور ہر اس چیز میں جو سانس طلب کرے اور جلد کرے دیر تک رہنا؛ اور اپنی سانس روکے اور یہ سب کرے ورزش کرے اور غسل کرے اور غسل خانے سے نکلنے کے بعد اور کھانے کے بعد مشروب پیے کیونکہ وہ روح کے لیے زیادہ غذائیت رکھتا ہے ایک ہی سانس میں کثیر مقدار؛ اور نیند ان کے لیے مفید ہے ⁦(ورزش روکنا اور غسل کتاب کی بیان کردہ صورت پر ہیں جو کچھ ہوتا ہے اس کی خبر ہیں عمل کی حکم نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.326}"
