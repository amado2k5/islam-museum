id: concept/zanjabil-al-kilab
class: concept
kind: natural
label:
  ar: "زنجبيل الكلاب"
  en: "Dog's ginger (water pepper)"
  ur: "زنجبیل الکلاب ⁦(پانی کی مرچ)⁩"
  es: "Jengibre de perro (pimienta de agua)"
  fr: "gingembre pour chien (poivre d'eau)"
summary:
  ar: "زنجبيل الكلاب بقلة تُعرف بفلفل الماء، ورقها كورق الخلاف، وطعمها كالزنجبيل، حارة في الثانية يابسة في الأولى؛ تحلّل الأورام الصلبة إذا دُقّت طرية مع بزرها، وتجلو آثار الوجه والكلف والنمش. {cite:canon-ibn-sina-print-v1 p.458}"
  en: "Dog's ginger is a herb known as water pepper, with leaves like those of the willow and a taste like ginger. Hot in the second degree and dry in the first, it dissolves hard swellings when pounded fresh with its seed, and clears marks on the face, kalaf and namash. {cite:canon-ibn-sina-print-v1 p.458}"
  ur: "زنجبیل الکلاب ایک بوٹی ہے جسے پانی کی مرچ کہا جاتا ہے، اس کے پتے خلاف ⁦(بید)⁩ جیسے اور ذائقہ ادرک جیسا ہے؛ دوسرے درجے میں گرم اور پہلے میں خشک۔ تازہ کوٹ کر اس کے بیج کے ساتھ سخت سوجن تحلیل کرتی ہے اور چہرے کے نشان، کلف اور نمش صاف کرتی ہے۔ {cite:canon-ibn-sina-print-v1 p.458}"
  es: "El jengibre de perro es una hierba conocida como pimienta de agua, con hojas parecidas a las del sauce y un sabor similar al del jengibre. Picante en segundo grado y seco en primero, disuelve hinchazones duras cuando se machaca fresco con su semilla y elimina marcas en la cara, kalaf y namash. {cite:canon-ibn-sina-print-v1 p.458}"
  fr: "Le gingembre des chiens est une plante aromatique également appelée poivre d'eau, dont les feuilles ressemblent à celles du saule et dont le goût est proche de celui du gingembre. De nature piquante au deuxième degré et sèche au premier, elle dissout les gonflements lorsqu'on la pile fraîche avec ses graines et atténue les marques sur le visage, le kalaf et le namash. {cite:canon-ibn-sina-print-v1 p.458}"
