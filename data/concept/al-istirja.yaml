id: concept/al-istirja
class: concept
kind: ethical
label:
  ar: "الاسترجاع عند المصيبة"
  en: "Saying 'to God we belong' at a calamity (istirja')"
  ur: "مصیبت پر «انا للہ» کہنا"
summary:
  ar: "يشرح عمر عبد الكافي قول المصاب «إنا لله وإنا إليه راجعون» بأنه إقرار بأن العبد لله، واستسلام يجلب صلوات الله ورحمته، ويضرب مثلًا بطفل يُحقن بالدواء ولا يفهم إلا الألم."
  en: "Omar Abdelkafy explains the words of the afflicted 'to God we belong and to Him we return' as an acknowledgement that the servant belongs to God, a surrender that brings God's blessings and mercy, illustrating it with a child given an injection who understands only the pain."
  ur: "عمر عبد الکافی مصیبت زدہ کے قول «ہم اللہ کے ہیں اور اسی کی طرف لوٹنے والے ہیں» کی وضاحت یوں کرتے ہیں کہ یہ بندے کے اللہ کا ہونے کا اقرار ہے، ایسا تسلیم جو اللہ کی صلوات اور رحمت لاتا ہے، اور اس کی مثال اس بچے سے دیتے ہیں جسے انجکشن لگایا جائے اور وہ صرف درد سمجھے۔"
