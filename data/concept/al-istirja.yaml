id: concept/al-istirja
class: concept
kind: ethical
label:
  ar: "الاسترجاع عند المصيبة"
  en: "Saying 'to God we belong' at a calamity (istirja')"
  fr: "Dire « À Dieu nous appartenons » dans l’épreuve (istirja’)"
  ur: "مصیبت پر «انا للہ» کہنا"
  es: "Decir 'a Dios pertenecemos' en una calamidad (istirja')"
  tr: "Felaket durumunda kurtarma"
  id: "Pemulihan bencana"
summary:
  ar: "يشرح عمر عبد الكافي قول المصاب «إنا لله وإنا إليه راجعون» بأنه إقرار بأن العبد لله، واستسلام يجلب صلوات الله ورحمته، ويضرب مثلًا بطفل يُحقن بالدواء ولا يفهم إلا الألم."
  en: "Omar Abdelkafy explains the words of the afflicted 'to God we belong and to Him we return' as an acknowledgement that the servant belongs to God, a surrender that brings God's blessings and mercy, illustrating it with a child given an injection who understands only the pain."
  fr: "Omar Abdelkafy explique que, lorsqu’une personne éprouvée dit « À Dieu nous appartenons et à Lui nous retournons », elle reconnaît qu’elle appartient à Dieu. Cet abandon lui vaut les bénédictions et la miséricorde divines. Il l’illustre par l’exemple d’un enfant qui reçoit une injection et n’en comprend que la douleur."
  ur: "عمر عبد الکافی مصیبت زدہ کے قول «ہم اللہ کے ہیں اور اسی کی طرف لوٹنے والے ہیں» کی وضاحت یوں کرتے ہیں کہ یہ بندے کے اللہ کا ہونے کا اقرار ہے، ایسا تسلیم جو اللہ کی صلوات اور رحمت لاتا ہے، اور اس کی مثال اس بچے سے دیتے ہیں جسے انجکشن لگایا جائے اور وہ صرف درد سمجھے۔"
  es: "Omar Abdelkafy explica las palabras de los afligidos \"a Dios pertenecemos y a Él volvemos\" como un reconocimiento de que el siervo pertenece a Dios, una entrega que trae consigo las bendiciones y la misericordia divinas, ilustrándolo con el ejemplo de un niño al que se le administra una inyección y que solo comprende el dolor."
  tr: "Omar Abdelkafi, mağdurun \"Gerçekten Tanrı'ya aitiz ve O'na döneceğiz\" demesinin, hizmetçinin Tanrı için olduğunu kabul etmek ve Allah'ın bereketini ve merhametini getiren bir teslimiyet olduğunu, sadece acı anlayan ilaç enjekte edilmiş bir çocuğun örneğini vererek açıklar."
  id: "Omar Abdelkafi menjelaskan bahwa pernyataan korban, \"Kami benar-benar milik Allah dan kepada-Nya kami akan kembali,\" adalah penyerahan yang mengakui bahwa hamba itu untuk Tuhan dan membawa berkat serta belas kasihan Tuhan, memberikan contoh seorang anak yang disuntik obat yang hanya memahami rasa sakit."
