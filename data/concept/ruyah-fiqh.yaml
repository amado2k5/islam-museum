id: concept/ruyah-fiqh
class: concept
kind: legal
label:
  ar: "الرؤية (في الفقه)"
  en: "Sight (ru'ya) in the rulings: seeing as a legal basis"
  ur: "رؤیت (فقہی احکام)"
summary:
  ar: "الرؤية في اللغة إدراك الشيء بحاسة البصر، وقد تكون بالقلب، والغالب في استعمال الفقهاء المعنى الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} وتختلف أحكام طلبها باختلاف ما تُستعمل فيه، فتجب كفاية كرؤية هلال رمضان عند الحنفية، وتُستحب كرؤية المخطوبة، وتحرم كرؤية العورة، وتباح كرؤية الأشياء العادية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8540} ويحرم تعمد النظر إلى العورة إلا لضرورة كالعلاج والشهادة، ويجوز للزوجين النظر إلى كل بدن الآخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} ويحرم النظر بشهوة إلى ما ليس بعورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} ويجوز للخاطب النظر إلى من يريد نكاحها بل يُسن، ويجوز تكرار النظر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} ومن رأى الماء بعد أن تيمم للصلاة وهو قادر على استعماله قبل الدخول فيها بطل تيممه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8542} ويشترط العلم بالمبيع، والرؤية طريق إليه، والرؤية السابقة على العقد بزمن لا يتغير فيه المبيع غالبا تقوم مقام المقارنة له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8543} ويكفي في المثلي رؤية بعضه، ويكفي في المتفاوت رؤية ما يدل على المقصود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8543} ولا يشهد الشاهد إلا بما يعلمه برؤية أو سماع، واشترط الحنفية والشافعية الرؤية مع السماع في الأقوال، وكفى السماع عند المالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8545} وللرؤية أثر في وجوب الصوم برؤية هلال رمضان، وفي وجوب النهي عن المنكر المرئي بحسب مراتبه، وفي ثبوت خيار الرد بالعيب المرئي بعد تمام البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546}"
  en: "In lexicon ru'ya is perceiving a thing with the eye, and it may also be by the heart; jurists mostly use the first sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} The ruling on seeking sight varies with its purpose: sighting the new moon of Ramadan is a collective duty for the Hanafis, seeing a woman one is considering marrying is recommended, seeing a forbidden part of the body is unlawful, and seeing ordinary things is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8540} Deliberately looking at what is awra is forbidden except in necessity, such as treatment or testimony, and spouses may look at each other's bodies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} Looking with desire at what is not awra is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} A suitor may look at the woman he intends to marry, and it is sunna; repeated looks are allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} A person who prayed with tayammum for lack of water and then sees water he can use before entering the prayer has his tayammum voided. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8542} A sale requires knowledge of the goods, and sight is the way to it; sight at the contract removes any option of sight, and earlier sight serves if the goods have not visibly changed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8543} For uniform goods sight of a part suffices; for varied goods sight of what shows the purpose suffices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8543} A witness testifies only to what he knows by sight or hearing; the Hanafis and Shafi'is require sight with hearing for statements, while the Malikis and Hanbalis accept hearing alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8545} Sight has effects: fasting is due on sighting the new moon of Ramadan, a seen wrong must be changed according to its degrees, and a seen defect after a sale gives the buyer a right of return. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8546}"
  ur: "رؤیت لغت میں آنکھ سے کسی چیز کا ادراک ہے، اور فقہاء کے ہاں عام طور پر یہی معنی مراد ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8539} نکاح کے ارادے سے منگیتر کو دیکھنا مستحب ہے، اور شرمگاہ کو شہوت سے دیکھنا حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8541} بیع میں مبیع کا علم شرط ہے اور رؤیت اس کا ذریعہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8542}"
