summary:
  ar: "يذكر ابن سينا علامة كل سبب من أسباب السهر: اليبس الساذج، والحرارة، وبورقية الأخلاط، والضوء والغذاء، والورم السوداوي، والوجع والفكر والحميات {cite:canon-ibn-sina-print-v2 p.94}"
  en: "Ibn Sina gives the sign of each cause of sleeplessness: simple dryness, heat, the nitrous quality of the humours, light and food, the melancholic swelling, pain, thought and fevers {cite:canon-ibn-sina-print-v2 p.94}"
  ur: "ابن سینا بے خوابی کے ہر سبب کی علامت بتاتا ہے: سادہ خشکی، گرمی، اخلاط کی نمکینی، روشنی اور غذا، سوداوی سوجن، درد، فکر اور بخار {cite:canon-ibn-sina-print-v2 p.94}۔"
