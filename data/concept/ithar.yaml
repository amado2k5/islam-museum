summary:
  ar: "الإيثار: تقديم حاجة الأخ على حاجة النفس رغم الخصاصة؛ وصف القرآن به الأنصار {cite:tanzil 59:9} وورد في فضائله حديث أن يود المرء لأخيه ما يود لنفسه."
  en: "Ithar: preferring a brother's need over one's own despite one's own hardship; the Qur'an describes the Ansar by it (59:9), and its foundation appears in the hadith of loving for one's brother what one loves for oneself."
  es: "Ithar: preferir la necesidad de un hermano a la propia a pesar de las propias dificultades; el Corán describe a los Ansar con esto (59:9), y su fundamento aparece en el hadiz de amar para el hermano lo que uno ama para sí mismo."
  fr: "Ithar: préférer le besoin d'un frère au sien malgré ses propres difficultés; le Coran décrit les Ansar par cela (59:9), et son fondement apparaît dans le hadith d'aimer pour son frère ce que l'on aime pour soi-même."
