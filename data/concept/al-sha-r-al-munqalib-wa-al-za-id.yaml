id: "concept/al-sha-r-al-munqalib-wa-al-za-id"
class: "concept"
kind: "scientific"
label:
  ar: "الشعر المنقلب والزائد"
  en: "Inverted and superfluous lashes"
  fr: "Cils retournés et cils surnuméraires"
  ur: "الٹے اور زائد بال"
summary:
  ar: "الشعر المنقلب يعالج بأحد خمسة أوجه رسمها الكتاب: الإلزاق والكي والنظم بالإبرة وتقصير الجفن بالقطع والنتف المانع، والشعر الزائد يتولد من كثرة رطوبة عفنة تجتمع في أجفان العين وعلاجه تنقية البدن والرأس والعين {cite:canon-ibn-sina-print-v2 p.200} {cite:canon-ibn-sina-print-v2 p.201}"
  en: "The inverted lash is treated by one of five means the book lays out — adhesion, cautery, threading with the needle, shortening the lid by cutting, and preventing plucking — while the superfluous lash is generated from much putrid moisture gathering in the lids, and its treatment is cleansing the body, head and eye {cite:canon-ibn-sina-print-v2 p.200} {cite:canon-ibn-sina-print-v2 p.201}"
  fr: "Le cil retourné se traite par l’un des cinq moyens qu’expose le livre — l’adhérence, la cautérisation, le passage d’un fil avec l’aiguille, le raccourcissement de la paupière par incision et l’empêchement de l’épilation —, tandis que le cil surnuméraire naît d’une abondante humidité putride qui s’amasse dans les paupières, et son traitement consiste à purifier le corps, la tête et l’œil {cite:canon-ibn-sina-print-v2 p.200} {cite:canon-ibn-sina-print-v2 p.201}"
  ur: "الٹے ہوئے بال کا علاج کتاب کے بیان کردہ پانچ طریقوں میں سے ایک سے ہوتا ہے — چپکانا، داغنا، سوئی سے سیون کرنا، پلک کاٹ کر چھوٹی کرنا، اور جھڑنے سے روکنا؛ اور زائد بال پلکوں میں جمع ہونے والی بوسیدہ رطوبت کی کثرت سے پیدا ہوتا ہے اور اس کا علاج بدن، سر اور آنکھ کی تنقیہ ہے {cite:canon-ibn-sina-print-v2 p.200} {cite:canon-ibn-sina-print-v2 p.201}۔"
