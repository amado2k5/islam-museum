  ur: "ابن سینا وضاحت کرتے ہیں کہ اندرونی سوجن کا معاملہ ایک عضو سے دوسرے عضو میں منتقل ہو سکتا ہے، یہ حرکت اچھی یا بری ہو سکتی ہے، اور اس کی پہچان کیسے کی جاتی ہے {cite:canon-ibn-sina-print-v1 p.167}۔"
