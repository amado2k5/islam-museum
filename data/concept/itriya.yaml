id: concept/itriya
class: concept
kind: natural
label:
  ar: "إطرية"
  en: "Itriya (a strand noodle of dough)"
  ur: "اطریہ ⁦(آٹے کی دھاگہ نما غذا)⁩"
  es: "Itriya (un fideo de masa en forma de hebra)"
summary:
  ar: "نوع من المطبوخ من العجين يُشبه السيور، يُطبخ في الماء باللحم أو بغيره، حارّة الطبع مفرطة الرطوبة، بطيئة الانهضام والانحدار عن المعدة، وتنفع الرئة والسعال ونفث الدم إذا طُبخت ببقلة الحمقاء {cite:canon-ibn-sina-print-v1 p.380}."
  en: "A cooked food of dough, strand-shaped, boiled in water with or without meat. Hot, with excessive moisture; slow to digest and to leave the stomach. The book says it helps the lung, cough and spitting of blood, especially when cooked with hamqa' greens {cite:canon-ibn-sina-print-v1 p.380}."
  ur: "آٹے سے بنی ہوئی ایک پکی ہوئی غذا، دھاگوں کی شکل کی، جو گوشت کے ساتھ یا بغیر پانی میں پکائی جاتی ہے۔ طبیعت میں گرم اور رطوبت حد سے زیادہ؛ ہضم اور معدے سے اترنے میں سست۔ کتاب کے مطابق یہ پھیپھڑے، کھانسی اور خون تھوکنے میں نفع دیتی ہے، خاص کر بقلۃ الحمقاء کے ساتھ پکائی جائے {cite:canon-ibn-sina-print-v1 p.380}۔"
  es: "Un alimento cocido a base de masa, en forma de hebras, hervido en agua con o sin carne. Caliente, con exceso de humedad; de digestión lenta y difícil de expulsar del estómago. El libro dice que ayuda a los pulmones, la tos y la expectoración de sangre, especialmente cuando se cocina con verduras de hamqa' {cite:canon-ibn-sina-print-v1 p.380}."
