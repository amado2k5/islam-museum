label: { ar: "البروج الاثنا عشر وأسماؤها وزوالها عن مواضع الصور", en: "The twelve signs and their names, and the drift of the figures", ur: "بارہ بروج، ان کے نام اور صورتوں کا اپنی جگہوں سے ہٹنا" }
summary:
  ar: "يقسم البتاني دائرة الفلك اثني عشر قسماً، كل قسم ثلاثون جزءاً، ويسمي كل برج باسم الصورة التي تليه ويسرد أسماءها بالترتيب من الحمل إلى الحوت، وينبه إلى أن هذه الصور قد تزول على طول الزمان عن مواضع الأدراج المسماة بها. {cite:zij-sabi-nallino-byblion p.12}."
  en: "Al-Battani divides the circle of the sphere into twelve parts of thirty degrees each, names each sign after the figure next to it, lists the names in order from Aries to Pisces, and notes that these figures can shift with long time from the divisions named after them. {cite:zij-sabi-nallino-byblion p.12}."
  ur: "البتانی دائرۂ فلک کو بارہ حصوں میں تقسیم کرتے ہیں، ہر ایک تیس درجے کا، اور ہر برج کو اس صورت کے نام پر رکھتے ہیں جو اس کے بعد ہے، حمل سے حوت تک ان کے نام ترتیب سے گنواتے ہیں اور متنبہ کرتے ہیں کہ یہ صورتیں لمبے زمانے میں اپنے نام والے درجوں کی جگہوں سے ہٹ سکتی ہیں۔ {cite:zij-sabi-nallino-byblion p.12}۔"
