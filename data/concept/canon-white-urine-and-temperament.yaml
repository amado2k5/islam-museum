  ar: "ينبه ابن سينا إلى أن البول الأبيض قد يكون مع مزاج حار صفراوي وأن الأحمر قد يكون مع مزاج بارد بلغمي، ويذكر كيف يميز بياض البرد من بياض كمون الصفراء، وأسباب حمرة البول في الأمراض الباردة {cite:canon-ibn-sina-print-v1 pp.187-188}."
  en: "Ibn Sina notes that white urine may accompany a hot bilious temperament and red urine a cold phlegmatic one, shows how to tell the whiteness of cold from the whiteness of hidden bile, and gives causes of red urine in cold diseases {cite:canon-ibn-sina-print-v1 pp.187-188}."
