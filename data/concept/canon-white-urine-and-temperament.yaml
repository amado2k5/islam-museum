id: concept/canon-white-urine-and-temperament
class: concept
kind: scientific
label: { ar: "البول الأبيض والمزاج عند ابن سينا", en: "White urine and the temperament in the Canon", ur: "سفید پیشاب اور مزاج قانون میں", es: "La orina blanca y el temperamento en el Canon", fr: "L'urine blanche et le tempérament dans le Canon", tr: "İbn Sina'ya göre beyaz idrar ve ruh hali", id: "Urine putih dan suasana hati menurut Avicenna" }
summary:
  ar: "ينبه ابن سينا إلى أن البول الأبيض قد يكون مع مزاج حار صفراوي وأن الأحمر قد يكون مع مزاج بارد بلغمي، ويذكر كيف يميز بياض البرد من بياض كمون الصفراء، وأسباب حمرة البول في الأمراض الباردة {cite:canon-ibn-sina-print-v1 pp.187-188}."
  en: "Ibn Sina notes that white urine may accompany a hot bilious temperament and red urine a cold phlegmatic one, shows how to tell the whiteness of cold from the whiteness of hidden bile, and gives causes of red urine in cold diseases {cite:canon-ibn-sina-print-v1 pp.187-188}."
  es: "Ibn Sina señala que la orina blanca puede acompañar a un temperamento biliar caliente y la orina roja a uno flemático frío, muestra cómo distinguir la blancura del frío de la blancura de la bilis oculta y da causas de orina roja en enfermedades frías {cite:canon-ibn-sina-print-v1 pp.187-188}."
  fr: "Ibn Sina note que l'urine blanche peut accompagner un tempérament chaud et bilieux et l'urine rouge un tempérament froid et flegmatique, montre comment distinguer la blancheur du froid de la blancheur de la bile cachée, et donne les causes de l'urine rouge dans les maladies froides {cite:canon-ibn-sina-print-v1 pp.187-188}."
  ur: "ابن سینا نوٹ کرتے ہیں کہ سفید پیشاب گرم بلغمی مزاج کے ساتھ ہو سکتا ہے اور سرخ پیشاب سرد بلغمی کے ساتھ ہو سکتا ہے، یہ بتاتا ہے کہ سردی کی سفیدی کو پوشیدہ پت کی سفیدی سے کیسے بیان کیا جائے، اور سردی کی بیماریوں میں سرخ پیشاب کے اسباب بتائے ہیں۔"
  tr: "İbn Sina, beyaz idrarın sıcak, safra gibi bir ruh haline sahip olabileceğini, kırmızının ise soğuk, flegmatik bir ruh hali ile birlikte olabileceğini belirtir. Soğuk beyazın sarı kimyondan nasıl ayrıldığını ve soğuk hastalıklarında idrar kızarıklığının nedenlerini açıklar {cite:canon-ibn-sina-print-v1 s.187-188}."
  id: "Ibn Sina menunjukkan bahwa urin putih dapat memiliki suasana hati panas dan empedu, dan merah dapat disertai suasana hati dingin dan dadar. Ia menjelaskan bagaimana putih dingin dibedakan dari jinten kuning, serta penyebab kemerahan urin pada penyakit dingin {cite:canon-ibn-sina-print-v1 hlm.187-188}."
