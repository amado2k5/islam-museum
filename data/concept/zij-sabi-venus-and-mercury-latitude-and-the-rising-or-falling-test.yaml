class: concept
kind: scientific
label: { ar: "عرض الزهرة وعطارد وطريقة معرفة الصعود والهبوط", en: "The latitude of Venus and Mercury and the test for rising or falling", ur: "زہرہ اور عطارد کا عرض اور صعود و ہبوط کا امتحان", es: "La latitud de Venus y Mercurio y la prueba para determinar si asciende o desciende.", fr: "La latitude de Vénus et de Mercure et le test pour déterminer si elles montent ou descendent" }
summary:
  ar: "تُجمع أعراض الكواكب الشمالية، أو تُنقص إن اختلفت، ويُعرف عرض الكوكب المطلوب في الجهة التي يقع فيها. وأما الزهرة وعطارد فيُعدل المركز بالجدول الثالث، فيُنظر في النصف الذي يقع فيه، ثم تُعدل حاصة عطارد بعشر من عشرة أجزاء من الانحراف. ويُعرف هل الكوكب صاعد أم هابط بتغير العرض بين عشرة أيام: فإن كان العرض شمالياً وزاد فهو صاعد، وإن نقص فهابط، وإن كان جنوبياً وزاد فهابط، وإن نقص فصاعد. {cite:zij-sabi-nallino-byblion pp.179-180}"
  en: "The latitudes of the northern planets are added, or subtracted if they differ, to give the latitude of the wanted planet on the side where it falls. For Venus and Mercury the centre is corrected by the third table and read in the half where it falls, and for Mercury the anomaly is corrected by one tenth of the deviation. Whether the planet is rising or falling is found by comparing its latitude ten days apart: if north and increasing it is rising, if north and decreasing falling; if south and increasing falling, if south and decreasing rising. {cite:zij-sabi-nallino-byblion pp.179-180}"
  ur: "شمالی سیاروں کے عرض جمع کیے جاتے ہیں، یا مختلف ہوں تو منہا، تاکہ مطلوبہ سیارے کا عرض اس جانب میں ملے جہاں وہ واقع ہو۔ زہرہ اور عطارد کے لیے مرکز تیسرے جدول سے درست ہوتا ہے اور اس نصف میں پڑھا جاتا ہے جہاں وہ آئے، اور عطارد کے خاصہ میں انحراف کا دسواں حصہ درست کیا جاتا ہے۔ سیارہ صاعد ہے یا ہابط، یہ دس دن کے فاصلے سے عرض کے بدلنے سے معلوم ہوتا ہے: شمالی اور بڑھتا ہو تو صاعد، شمالی اور گھٹتا ہو تو ہابط؛ جنوبی اور بڑھتا ہو تو ہابط، جنوبی اور گھٹتا ہو تو صاعد۔ {cite:zij-sabi-nallino-byblion pp.179-180}"
  es: "Las latitudes de los planetas del hemisferio norte se suman, o se restan si difieren, para obtener la latitud del planeta deseado en el lado donde cae. Para Venus y Mercurio, el centro se corrige mediante la tercera tabla y se lee en la mitad donde cae, y para Mercurio la anomalía se corrige en una décima parte de la desviación. Para determinar si el planeta está ascendiendo o descendiendo, se compara su latitud con diez días de diferencia: si es norte y está ascendiendo, está ascendiendo; si es norte y está descendiendo, está descendiendo; si es sur y está ascendiendo, está descendiendo; si es sur y está descendiendo, está ascendiendo. {cite:zij-sabi-nallino-byblion pp.179-180}"
  fr: "On additionne, ou on soustrait si elles diffèrent, les latitudes des planètes de l'hémisphère nord pour obtenir la latitude de la planète recherchée du côté où elle se trouve. Pour Vénus et Mercure, le centre est corrigé à l'aide de la troisième table et lu dans la moitié du disque où elle se trouve. Pour Mercure, l'anomalie est corrigée d'un dixième de l'écart. On détermine si la planète est en phase ascendante ou descendante en comparant sa latitude à dix jours d'intervalle: si elle est au nord et augmente, elle est ascendante; si elle est au nord et diminue, elle est descendante; si elle est au sud et augmente, elle est descendante; si elle est au sud et diminue, elle est ascendante. {cite:zij-sabi-nallino-byblion pp.179-180}"
