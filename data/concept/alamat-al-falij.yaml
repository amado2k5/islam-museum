  en: "Signs of palsy"
  fr: "Les signes de la paralysie"
  ur: "فالج کی علامات"
summary:
  ar: "إن كان الفالج عن التواء أو سقطة أو ضربة أو قطع فالسبب يدل عليه، وإن كان عن ورم حار دلّ عليه التمدد والوجع والحمى، وإن عن ورم صلب دلّ عليه اللمس وتعقد محسوس في العصب، وإن عن ورم رخو فالاستدلال شاق إلا أنه لا يخلو عن وجع يسير وخدر وحمى لينة ولا يكون حدوثه دفعة {cite:canon-ibn-sina-print-v2 p.139}"
  en: "If the palsy is from a twist, fall, blow or cut the cause itself points to it; if from a hot swelling, stretching, pain and fever point to it; if from a hard swelling, touch and a felt knot in the nerve point to it; if from a soft swelling the inference is hard, yet it never lacks slight pain, numbness, a mild fever, and does not come on suddenly {cite:canon-ibn-sina-print-v2 p.139}"
  fr: "Si la paralysie vient d’une torsion, d’une chute, d’un coup ou d’une coupure, la cause elle-même l’indique ; si elle vient d’une tuméfaction chaude, la tension, la douleur et la fièvre l’indiquent ; si elle vient d’une tuméfaction dure, le toucher et un nœud senti dans le nerf l’indiquent ; si elle vient d’une tuméfaction molle, l’inférence est difficile, pourtant elle ne manque jamais d’une légère douleur, d’un engourdissement, d’une fièvre légère, et ne survient pas soudainement {cite:canon-ibn-sina-print-v2 p.139}"
  ur: "اگر فالج موڑ، گرنے، ضربت یا قطع سے ہو تو سبب خود اس پر دلالت کرتا ہے؛ اور اگر گرم ورم سے ہو تو تمدد، درد اور بخار اس پر دلالت کرتے ہیں؛ اور اگر سخت ورم سے ہو تو چھونا اور عصب میں محسوس ہونے والی گانٹھ اس پر دلالت کرتی ہے؛ اور اگر نرم ورم سے ہو تو استدلال مشکل ہے، لیکن وہ ہلکے درد، خدر، نرم بخار کے بغیر نہیں ہوتا اور اس کا وقوع اچانک نہیں ہوتا {cite:canon-ibn-sina-print-v2 p.139}۔"
