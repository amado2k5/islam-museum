id: concept/canon-treating-obstructions
class: concept
kind: scientific
label: { ar: "علاج السدد عند ابن سينا", en: "Treating obstructions in the Canon", ur: "قانون میں سدّوں کا علاج", es: "Tratamiento de obstrucciones en el Canon", fr: "Traitement des obstructions dans le Canon" }
summary:
  ar: "يبين ابن سينا في الفصل الرابع والعشرين أن السدد إما من أخلاط غليظة أو لزجة أو كثيرة، ويفرق في علاج كل منها بين التحليل والتقطيع والاستفراغ، ويحذر من خطأي التحليل الضعيف والشديد {cite:canon-ibn-sina-print-v1 p.303}."
  en: "In chapter 24 Ibn Sina says obstructions come from thick, viscous or abundant humours, distinguishes dissolving, cutting and evacuating in treating each, and warns against the two errors of weak and of violent dissolving {cite:canon-ibn-sina-print-v1 p.303}."
  es: "En el capítulo 24, Ibn Sina dice que las obstrucciones provienen de humores espesos, viscosos o abundantes, distingue entre disolver, cortar y evacuar en el tratamiento de cada uno, y advierte contra los dos errores de la disolución débil y violenta {cite:canon-ibn-sina-print-v1 p.303}."
  fr: "Dans le chapitre 24, Ibn Sina dit que les obstructions proviennent d'humeurs épaisses, visqueuses ou abondantes, distingue la dissolution, la coupe et l'évacuation dans le traitement de chacune, et met en garde contre les deux erreurs de dissolution faible et de dissolution violente {cite:canon-ibn-sina-print-v1 p.303}."
