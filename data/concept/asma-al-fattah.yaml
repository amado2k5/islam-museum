  id: "Al-Fattah: Pembuka Pintu Rahmat dan Penyediaan serta Penguasa di antara hamba-hambanya dengan kebenaran. Nama nomor 18 dalam daftar yang disebutkan dalam hadis Al-Tirmidhi tentang Nama-nama Terindah Allah."
