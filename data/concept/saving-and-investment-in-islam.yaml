label:
  ar: "الادخار والاستثمار"
  en: "Saving and investment"
  es: "Ahorro e inversión"
  fr: "Épargne et investissement"
  ur: "بچت اور سرمایہ کاری"
  tr: "Tasarruf ve Yatırım"
  id: "Tabungan dan Investasi"
summary:
  ar: "يعرض المؤلف دوافع الادخار المتعددة، ويرى أن جذب المدخرات يمكن أن يتم بالقراض بدل القرض الربوي، وأن الاكتناز هو حبس النقود والمال عن الإنفاق الاستهلاكي والاستثماري والخيري، ويعدّ الاستثمار تكوين أصول ثابتة أو متداولة بقصد زيادة الإنتاج {cite:usul-iqtisad-islami-0660 p. 191} {cite:usul-iqtisad-islami-0660 p. 193} {cite:usul-iqtisad-islami-0660 p. 197} {cite:usul-iqtisad-islami-0660 p. 198}."
  tr: "Yazar, tasarrufun çeşitli motivasyonlarını sunar ve tasarruf çekmenin tefeci krediler yerine borçlanarak yapılabileceğine, biriktirmenin ise tüketici, yatırım ve hayır harcamalarından para ve parayı kilitlemek olduğuna inanır. Yatırım, üretimi artırmak amacıyla sabit veya dolaşımda olan varlıkların oluşturulmasıdır {cite:usul-iqtisad-islami-0660 s. 191} {cite:usul-iqtisad-islami-0660 s. 193} {cite:usul-iqtisad-islami-0660 s. 197} {cite:usul-iqtisad-islami-0660 s. 198}."
  id: "Penulis memaparkan berbagai motivasi untuk menabung dan percaya bahwa menarik tabungan dapat dilakukan dengan meminjam alih-alih pinjaman riba, dan bahwa penimbunan adalah mengunci uang dan uang dari pengeluaran konsumen, investasi, dan amal. Investasi adalah pembentukan aset tetap atau yang beredar dengan tujuan meningkatkan produksi {cite:usul-iqtisad-islami-0660 hlm. 191} {cite:usul-iqtisad-islami-0660 hlm. 193} {cite:usul-iqtisad-islami-0660 hlm. 197} {cite:usul-iqtisad-islami-0660 hlm. 198}."
