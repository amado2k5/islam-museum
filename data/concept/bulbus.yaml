id: concept/bulbus
class: concept
kind: natural
label:
  ar: "بُلْبوس"
  en: "Bulbus (a small onion-like bulb)"
  fr: "Bulbus (petit bulbe proche de l’oignon)"
  ur: "بلبوس"
summary:
  ar: "بصل مأكول صغار، يشبه بصل النرجس وورقه يشبه الكراث، ومنه ما يهيّج القيء. طبعه قريب من البصل، منفخ يفرّق ويخشن اللسان. يُطلى على الكلف في الشمس، ويخشن الحنك واللسان، وإذا اتُّخذ منه ضماد مع الخل نفع النقرس وأوجاع المفاصل، ويهيّج الباه {cite:canon-ibn-sina-print-v1 p.392}."
  en: "A small edible bulb like the narcissus bulb, with leaves like the leek. One kind causes vomiting. Its nature is close to the onion's, with wind-producing, dispersing power that roughens the tongue. Applied to freckles in the sun it helps them; with vinegar as a poultice it helps gout and pains of the joints; and the book says it stirs desire {cite:canon-ibn-sina-print-v1 p.392}."
  fr: "Petit bulbe comestible semblable à celui du narcisse, à feuilles de poireau. Une espèce provoque le vomissement. Proche de l’oignon par sa nature, il produit des vents, disperse et râpe la langue. Appliqué au soleil, il aiderait les taches de rousseur ; avec vinaigre en cataplasme, goutte et douleurs articulaires. Le livre lui attribue une excitation du désir {cite:canon-ibn-sina-print-v1 p.392}."
  ur: "یہ ایک چھوٹا کھانے کا پیاز ہے جو نرگس کے پیاز جیسا ہے اور اس کے پتے گندنے جیسے ہیں۔ اس کی ایک قسم قے لاتی ہے۔ اس کی طبیعت پیاز کے قریب ہے، یہ ہوا پیدا کرتا اور منتشر کرتا ہے، اور زبان کو کھردرا کرتا ہے۔ دھوپ میں کلف پر ملنے اور سرکے کے ساتھ ضماد کے طور پر گٹھیا اور جوڑوں کے درد میں نفع دیتا ہے، اور کتاب کے مطابق شہوت بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.392}۔"
