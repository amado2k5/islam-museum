id: concept/awm
class: concept
kind: legal
label:
  ar: "العَوْم"
  en: "Swimming (awm) and the instruction to learn it"
  fr: "La natation (awm) et l’incitation à l’apprendre"
  ur: "تیراکی"
  es: "La natación (awm) y la instrucción para aprenderla"
summary:
  ar: "العوم في اللغة السباحة، والعوام الماهر فيها، ولا يخرج الاصطلاح عن اللغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. والعوم من الأمور التي حث الإسلام على تعلمها مع الخيل والرماية، لتقوية الجسم ودفع الكسل، وورد عن ابن عمر في الأمر بتعليم الأبناء السباحة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  en: "In the lexicon, awm is swimming, and a 'awwam is one skilled in it; the technical sense does not differ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. Swimming is among the skills Islam urged, with horsemanship and archery, to strengthen the body and drive away idleness; a report from Ibn 'Umar urges teaching children to swim {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  fr: "Dans le lexique, awm désigne la natation, et un 'awwam une personne qui y excelle ; le sens technique ne diffère pas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. La natation compte parmi les activités encouragées par l’islam, avec l’équitation et le tir à l’arc, pour fortifier le corps et éloigner l’oisiveté ; un récit d’Ibn 'Umar encourage à apprendre aux enfants à nager {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  es: "En el léxico, awm significa nadar, y un 'awwam es alguien experto en ello; el sentido técnico no difiere {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. La natación se encuentra entre las habilidades que el Islam recomienda, junto con la equitación y el tiro con arco, para fortalecer el cuerpo y alejar la ociosidad; un informe de Ibn 'Umar recomienda enseñar a los niños a nadar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  ur: "لغت میں، awm تیراکی ہے، اور awwm اس میں ماہر ہے۔ تکنیکی معنوں میں کوئی فرق نہیں ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11945}۔ تیراکی ان مہارتوں میں سے ہے جو اسلام نے گھڑ سواری اور تیر اندازی کے ساتھ جسم کو مضبوط کرنے اور سستی کو دور کرنے کے لیے زور دیا ہے۔ ابن عمر کی ایک رپورٹ میں بچوں کو تیراکی سکھانے کی تاکید کی گئی ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11945}۔"
