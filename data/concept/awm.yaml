  ur: "تیراکی"
summary:
  ar: "العوم في اللغة السباحة، والعوام الماهر فيها، ولا يخرج الاصطلاح عن اللغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. والعوم من الأمور التي حث الإسلام على تعلمها مع الخيل والرماية، لتقوية الجسم ودفع الكسل، وورد عن ابن عمر في الأمر بتعليم الأبناء السباحة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
  en: "In the lexicon, awm is swimming, and a 'awwam is one skilled in it; the technical sense does not differ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}. Swimming is among the skills Islam urged, with horsemanship and archery, to strengthen the body and drive away idleness; a report from Ibn 'Umar urges teaching children to swim {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11945}."
