id: concept/ilaj-afat-al-shamm
class: concept
kind: scientific
label:
  ar: علاج آفة الشم
  en: The treatment of the disorder of smell
  ur: شمّ کی آفت کا علاج
  es: "El tratamiento del trastorno del olfato"
  fr: "Le traitement du trouble de l'odorat"
  tr: "Koku lezyonu tedavisi"
  id: "Pengobatan lesi olfaktori"
summary:
  ar: يعالج سبب سوء المزاج بالضد ويقصد مقدم الدماغ بالنطولات والشمومات والنشوقات والأطلية والأضمدة المعروفة في معالجات الرأس، وأكثر ما يعرض مزاج بارد في البطنين أو في الحلمتين فأنفع له سعوطات من جنس الأدهان الحارة، وإن كان خلطاً في بطون الدماغ استفرغ بما يخرجه من الشبيارات والغراغر والسعوطات والنشوقات والشمومات الملطفة، وإن كانت سدة في العظم المشاشي استعملت النطولات المفتحة ويلزم الرأس المحاجم بعدها؛ ومن أحس الطيب ولا يحس المنتن يسعط بما يعرف مراراً ⁦(أسماء الأدوية والمجرّبات والأدهان لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.236}
  en: A bad-temperament cause is treated by its contrary, aiming at the front of the brain with the head-remedies known from that chapter — douches, smellings, inhalations, embrocations and dressings. The commonest is a cold temperament in the ventricles or in the mamillary pair, most helped by snuffs of hot-oil kind; a humour in the brain's ventricles is evacuated by head-clearing gargles, snuffs, inhalations and soothing smellings; an occlusion in the sieve bone calls for opening douches and inhalations, with cupping kept to the head after them. One who perceives the pleasant but not the foul is snuffed repeatedly with the known kind, and the opposite case likewise ⁦(the drug, tried-remedy and oil names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.236}
  ur: بدمزاجی کے سبب کو اس کے ضد سے علاج کیا جاتا ہے اور مقدم دماغ پر سر کے معالجات کے باب کے معروف طریقے — نطول، سونگھنا، نشوق، تیل مساج اور ضماد — مقصود کیے جاتے ہیں؛ سب سے عام صورت بطینوں یا دونوں چوچی نما زائدوں میں سرد مزاج ہے جس کے لیے گرم تیلوں کی جنس کے سعوط سب سے مفید ہیں؛ اگر دماغ کے بطینوں میں خلط ہو تو اسے سر صاف کرنے والے غراروں، سعوط، نشوق اور نرم سونگھنے والی چیزوں سے نکالا جاتا ہے؛ اور اگر چھالنی ہڈی میں سدہ ہو تو کھولنے والے نطول اور نشوق اور پھر سر پر حجامت؛ جو خوشبو محسوس کرے مگر بدبو نہ کرے اسے معروف جنس کا سعوط بار بار دیا جاتا ہے، اور اس کے برعکس صورت بھی اسی طرح ⁦(ادویہ، مجرب نسخوں اور تیلوں کے نام نہیں لیے گئے)⁩ {cite:canon-ibn-sina-print-v2 p.236}
  es: "Una causa de mal temperamento se trata con su opuesto, apuntando a la parte frontal del cerebro con los remedios para la cabeza conocidos en ese capítulo: lavados, inhalaciones, ungüentos y vendajes. El más común es un temperamento frío en los ventrículos o en el par mamilar, que mejora con inhalaciones de aceite caliente; un humor en los ventrículos cerebrales se evacua con gárgaras, inhalaciones y aromas calmantes para despejar la cabeza; una oclusión en el hueso criboso requiere lavados e inhalaciones para abrir la cabeza, seguidos de ventosas. Quien percibe lo agradable pero no lo desagradable se somete repetidamente a inhalaciones con el tipo conocido, y lo contrario también (no se incluyen los nombres de los medicamentos, remedios probados ni aceites). {cite:canon-ibn-sina-print-v2 p.236}"
  fr: "On traite la cause d'un mauvais tempérament par son contraire, en agissant sur le cortex cérébral antérieur à l'aide des remèdes céphaliques décrits dans ce chapitre: douches, inhalations, inhalations, embaumements et pansements. Le cas le plus fréquent est un tempérament froid dans les ventricules ou les muscles mamillaires, soulagé par des prises d'huile chaude. Une humeur stagnante dans les ventricules cérébraux est évacuée par des gargarismes, des prises, des inhalations et des inhalations apaisantes. Une occlusion de l'os criblé nécessite des douches et des inhalations décongestionnantes, suivies de ventouses sur la tête. Celui qui perçoit l'agréable mais pas le mauvais est traité par des prises répétées d'huile chaude, et de même dans le cas contraire (les noms des médicaments, remèdes éprouvés et huiles ne sont pas mentionnés). {cite:canon-ibn-sina-print-v2 p.236}"
  tr: "Kötü ruh halinin nedeni ise tam tersi olarak tedavi edilir; beynin ön kısmında nodüller, hapşırmalar, hapşırmalar, sıçramalar ve baş tedavilerinde bilinen bandajlar bulunur. Karın veya meme uçlarındaki en yaygın soğuk ruh hali, sıcak yağların en faydalı hapşırığıdır. Beynin karnında bir karışım varsa, hapşırma, hapşırık, hapşırma ve yatıştırıcı dışkı çıkardığı şeyleri kusun. Pedeoidal kemikte tıkanıklık varsa, açık hapşırıklar kullanın ve baş damarlara yapışır. İyi hisseden ama kötü hissetmez kişi tekrar tekrar hapşırır (ilaçların isimleri, test edilmiş ve test edilmiş ve merhemler bunları taşımaz) {cite:canon-ibn-sina-print-v2 s.236}"
  id: "Penyebab suasana hati buruk ditangani dengan cara yang sebaliknya, merujuk pada bagian depan otak dengan nodul, bersin, bersin, cipratan, dan perban yang dikenal dalam perawatan kepala. Suasana flu yang paling umum di perut atau puting adalah bersin yang paling bermanfaat dari minyak panas. Jika ada campuran di perut otak, muntah keluar apa yang dihasilkan dari bersin, bersin, bersin, dan tinja yang menenangkan. Jika ada sumbatan pada tulang pedoidal, gunakan bersin terbuka, dan kepala akan menempel pada pembuluh darah setelahnya. Siapa pun yang merasakan enak tetapi tidak merasa tidak sedap akan bersin berulang kali (nama obat, yang sudah diuji, dan salep tidak memilikinya) {cite:canon-ibn-sina-print-v2 hlm.236}"
