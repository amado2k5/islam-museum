id: concept/ilaj-afat-al-shamm
class: concept
kind: scientific
label:
  ar: علاج آفة الشم
  en: The treatment of the disorder of smell
  ur: شمّ کی آفت کا علاج
summary:
  ar: يعالج سبب سوء المزاج بالضد ويقصد مقدم الدماغ بالنطولات والشمومات والنشوقات والأطلية والأضمدة المعروفة في معالجات الرأس، وأكثر ما يعرض مزاج بارد في البطنين أو في الحلمتين فأنفع له سعوطات من جنس الأدهان الحارة، وإن كان خلطاً في بطون الدماغ استفرغ بما يخرجه من الشبيارات والغراغر والسعوطات والنشوقات والشمومات الملطفة، وإن كانت سدة في العظم المشاشي استعملت النطولات المفتحة ويلزم الرأس المحاجم بعدها؛ ومن أحس الطيب ولا يحس المنتن يسعط بما يعرف مراراً ⁦(أسماء الأدوية والمجرّبات والأدهان لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.236}
  en: A bad-temperament cause is treated by its contrary, aiming at the front of the brain with the head-remedies known from that chapter — douches, smellings, inhalations, embrocations and dressings. The commonest is a cold temperament in the ventricles or in the mamillary pair, most helped by snuffs of hot-oil kind; a humour in the brain's ventricles is evacuated by head-clearing gargles, snuffs, inhalations and soothing smellings; an occlusion in the sieve bone calls for opening douches and inhalations, with cupping kept to the head after them. One who perceives the pleasant but not the foul is snuffed repeatedly with the known kind, and the opposite case likewise ⁦(the drug, tried-remedy and oil names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.236}
  ur: بدمزاجی کے سبب کو اس کے ضد سے علاج کیا جاتا ہے اور مقدم دماغ پر سر کے معالجات کے باب کے معروف طریقے — نطول، سونگھنا، نشوق، تیل مساج اور ضماد — مقصود کیے جاتے ہیں؛ سب سے عام صورت بطینوں یا دونوں چوچی نما زائدوں میں سرد مزاج ہے جس کے لیے گرم تیلوں کی جنس کے سعوط سب سے مفید ہیں؛ اگر دماغ کے بطینوں میں خلط ہو تو اسے سر صاف کرنے والے غراروں، سعوط، نشوق اور نرم سونگھنے والی چیزوں سے نکالا جاتا ہے؛ اور اگر چھالنی ہڈی میں سدہ ہو تو کھولنے والے نطول اور نشوق اور پھر سر پر حجامت؛ جو خوشبو محسوس کرے مگر بدبو نہ کرے اسے معروف جنس کا سعوط بار بار دیا جاتا ہے، اور اس کے برعکس صورت بھی اسی طرح ⁦(ادویہ، مجرب نسخوں اور تیلوں کے نام نہیں لیے گئے)⁩ {cite:canon-ibn-sina-print-v2 p.236}
