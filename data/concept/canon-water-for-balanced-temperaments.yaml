id: concept/canon-water-for-balanced-temperaments
class: concept
kind: scientific
label: { ar: "الماء الصالح للأمزجة المعتدلة عند ابن سينا", en: "Water for balanced temperaments in the Canon", ur: "معتدل مزاجوں کے لیے پانی قانون میں", es: "Agua para temperamentos equilibrados en el Canon", fr: "L'eau pour des tempéraments équilibrés dans le Canon", tr: "İbn Sina'ya göre huysuz mizaclara uygun su", id: "Air sesuai untuk temperamen temperamen menurut Avicenna" }
summary:
  ar: "يفتتح ابن سينا الفصل الثامن في تدبير الماء والشراب ببيان أصلح الماء للأمزجة المعتدلة، وضرر الماء المبرد بالجمد، وقول أصحاب التجربة في المزج بين ماء البئر وماء النهر، وإصلاح الرديء بالخل {cite:canon-ibn-sina-print-v1 p.236}."
  en: "Ibn Sina opens the eighth chapter, on the management of water and drink, with the water that suits balanced temperaments, the harm of water cooled with snow, the experienced physicians' saying on mixing well and river water, and the mending of poor water with vinegar {cite:canon-ibn-sina-print-v1 p.236}."
  es: "Ibn Sina abre el octavo capítulo, sobre el manejo del agua y la bebida, con el agua que se adapta a los temperamentos equilibrados, el daño del agua enfriada con nieve, el dicho de los médicos experimentados sobre la mezcla de agua de pozo y de río, y la mejora del agua pobre con vinagre {cite:canon-ibn-sina-print-v1 p.236}."
  fr: "Ibn Sina ouvre le huitième chapitre, sur la gestion de l'eau et des boissons, avec l'eau qui convient aux tempéraments équilibrés, le mal de l'eau refroidie avec de la neige, le conseil des médecins expérimentés sur le mélange de l'eau de puits et de l'eau de rivière, et la réparation de l'eau de mauvaise qualité avec du vinaigre {cite:canon-ibn-sina-print-v1 p.236}."
  ur: "ابن سینا آٹھویں باب کا آغاز پانی اور پینے کے انتظام پر، متوازن مزاج کے مطابق پانی سے، برف سے ٹھنڈے پانی کے نقصانات، کنویں اور دریا کے پانی کو ملانے کے بارے میں تجربہ کار طبیبوں کا قول، اور ناقص پانی کو سرکہ سے درست کرنے پر۔"
  tr: "İbn Sina, su ve içme suyu yönetimiyle ilgili sekizinci bölümü, hangi suyun ılımlı mizaçlara uygun olduğunu, dondurularak soğutulan suyun zararını, kuyu suyunu nehir suyu ile karıştırmayı deneyenlerin görüşlerini ve kötü suyun sirkeyle reformunu açıklayarak açar {cite:canon-ibn-sina-print-v1 s.236}."
  id: "Ibn Sina membuka bab kedelapan tentang pengelolaan air dan air minum dengan menjelaskan air mana yang cocok untuk temperamen sedang, bahaya air yang didinginkan oleh pembekuan, pendapat mereka yang bereksperimen mencampur air sumur dengan air sungai, dan reformasi air buruk dengan cuka {cite:canon-ibn-sina-print-v1 hlm.236}."
