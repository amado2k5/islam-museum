  ar: "يفتتح ابن سينا الفصل الثامن في تدبير الماء والشراب ببيان أصلح الماء للأمزجة المعتدلة، وضرر الماء المبرد بالجمد، وقول أصحاب التجربة في المزج بين ماء البئر وماء النهر، وإصلاح الرديء بالخل {cite:canon-ibn-sina-print-v1 p.236}."
  en: "Ibn Sina opens the eighth chapter, on the management of water and drink, with the water that suits balanced temperaments, the harm of water cooled with snow, the experienced physicians' saying on mixing well and river water, and the mending of poor water with vinegar {cite:canon-ibn-sina-print-v1 p.236}."
