id: concept/taxation-in-islam
class: concept
kind: legal
label:
  ar: الضرائب في الإسلام
  en: Taxation in Islam
summary:
  ar: "يعرّف المراغي الضريبة بأنها فريضة نقدية يلزم بها الفرد الدولة بوصفه عضوًا في المجتمع، تُستكمل بها حاجات الدولة إذا لم تفِ موارد أخرى بها {cite:min-qadaya-al-mal-wal-amal-azhar p. 52}. ويرى أن الإسلام لا يمنع فرضها عند الحاجة، ويستدل بأن عمر، في عام المجاعة، طلب من الولاة المال والطعام {cite:min-qadaya-al-mal-wal-amal-azhar p. 52}، ويذكر قول الغزالي في جواز أن يفرض الإمام على الأغنياء قدر كفاية الجيش عند خلو بيت المال ومخافة العدو {cite:min-qadaya-al-mal-wal-amal-azhar p. 52} {cite:min-qadaya-al-mal-wal-amal-azhar p. 53}. ويعدّد خمسة فروق بين الضريبة والزكاة: الزكاة فريضة دينية مقدرة المصارف والمقدار، والضريبة تتغير بحاجة المجتمع ولا تُحدد مصارفها، والزكاة لا تجب إلا بالنصاب بخلاف الضريبة، والزكاة مقررة في أعيان مخصوصة {cite:min-qadaya-al-mal-wal-amal-azhar p. 53} {cite:min-qadaya-al-mal-wal-amal-azhar p. 54}. وقرر مؤتمر مجمع البحوث الإسلامية أن الضريبة لا تغني عن الزكاة {cite:min-qadaya-al-mal-wal-amal-azhar p. 54}. وتاريخ هذا المؤتمر مضطرب في الكتاب، انظر إدخال الزكاة."
  en: "Al-Maraghi defines a tax as a monetary duty owed to the state by a member of society, used when other revenues fall short (p. 52). He holds Islam does not forbid it in need, citing Umar's appeal to the governors in a famine and al-Ghazali's view that the ruler may levy the rich for the army's upkeep (pp. 52-53). He lists differences from zakat: fixed versus variable, nisab, fixed recipients versus open spending (pp. 53-54). The 1965 conference resolution says taxes do not replace zakat (p. 54)."
