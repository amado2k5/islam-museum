label:
  ar: الضرائب في الإسلام
  en: Taxation in Islam
  es: "La tributación en el Islam"
  fr: "La fiscalité en islam"
  ur: "اسلام میں ٹیکس"
summary:
  ar: "يعرّف المراغي الضريبة بأنها فريضة نقدية يلزم بها الفرد الدولة بوصفه عضوًا في المجتمع، تُستكمل بها حاجات الدولة إذا لم تفِ موارد أخرى بها {cite:min-qadaya-al-mal-wal-amal-azhar p. 52}. ويرى أن الإسلام لا يمنع فرضها عند الحاجة، ويستدل بأن عمر، في عام المجاعة، طلب من الولاة المال والطعام {cite:min-qadaya-al-mal-wal-amal-azhar p. 52}، ويذكر قول الغزالي في جواز أن يفرض الإمام على الأغنياء قدر كفاية الجيش عند خلو بيت المال ومخافة العدو {cite:min-qadaya-al-mal-wal-amal-azhar p. 52} {cite:min-qadaya-al-mal-wal-amal-azhar p. 53}. ويعدّد خمسة فروق بين الضريبة والزكاة: الزكاة فريضة دينية مقدرة المصارف والمقدار، والضريبة تتغير بحاجة المجتمع ولا تُحدد مصارفها، والزكاة لا تجب إلا بالنصاب بخلاف الضريبة، والزكاة مقررة في أعيان مخصوصة {cite:min-qadaya-al-mal-wal-amal-azhar p. 53} {cite:min-qadaya-al-mal-wal-amal-azhar p. 54}. وقرر مؤتمر مجمع البحوث الإسلامية أن الضريبة لا تغني عن الزكاة {cite:min-qadaya-al-mal-wal-amal-azhar p. 54}. وتاريخ هذا المؤتمر مضطرب في الكتاب، انظر إدخال الزكاة."
  en: "Al-Maraghi defines a tax as a monetary duty owed to the state by a member of society, used when other revenues fall short (p. 52). He holds Islam does not forbid it in need, citing Umar's appeal to the governors in a famine and al-Ghazali's view that the ruler may levy the rich for the army's upkeep (pp. 52-53). He lists differences from zakat: fixed versus variable, nisab, fixed recipients versus open spending (pp. 53-54). The 1965 conference resolution says taxes do not replace zakat (p. 54)."
  es: "Al-Maraghi define un impuesto como un deber monetario que un miembro de la sociedad debe al Estado, utilizado cuando otros ingresos resultan insuficientes (p. 52). Sostiene que el Islam no lo prohíbe en casos de necesidad, citando el llamamiento de Umar a los gobernadores durante una hambruna y la opinión de al-Ghazali de que el gobernante puede recaudar impuestos de los ricos para el mantenimiento del ejército (pp. 52-53). Enumera las diferencias con el zakat: fijo frente a variable, nisab, beneficiarios fijos frente a gasto libre (pp. 53-54). La resolución de la conferencia de 1965 afirma que los impuestos no sustituyen al zakat (p. 54)."
  fr: "Al-Maraghi définit l'impôt comme une obligation monétaire due à l'État par un membre de la société, et perçue lorsque les autres recettes sont insuffisantes (p. 52). Il soutient que l'islam ne l'interdit pas en cas de nécessité, citant l'appel d'Omar aux gouverneurs lors d'une famine et l'avis d'al-Ghazali selon lequel le souverain peut lever des impôts auprès des riches pour l'entretien de l'armée (pp. 52-53). Il énumère les différences avec la zakat: montant fixe ou variable, nisab, bénéficiaires désignés ou dépenses libres (pp. 53-54). La résolution de la conférence de 1965 stipule que les impôts ne remplacent pas la zakat (p. 54)."
  ur: "المراثی ٹیکس کی تعریف معاشرے کے ایک رکن کی طرف سے ریاست پر واجب الادا مالیاتی ڈیوٹی کے طور پر کرتا ہے، جب دیگر محصولات کم ہو جائیں ⁦(ص 52)⁩۔ اس کا خیال ہے کہ اسلام اس سے منع نہیں کرتا، عمر کی قحط میں گورنروں سے اپیل اور الغزالی کے خیال کا حوالہ دیتے ہوئے کہ حکمران فوج کی دیکھ بھال کے لیے امیروں پر ٹیکس لگا سکتا ہے ⁦(صفحہ 52-53)⁩۔ وہ زکوٰۃ کے فرق کی فہرست دیتا ہے: مقررہ بمقابلہ متغیر، نصاب، مقررہ وصول کنندگان بمقابلہ کھلے اخراجات ⁦(صفحہ 53-54)⁩۔ 1965 کی کانفرنس کی قرارداد کہتی ہے کہ ٹیکس زکوٰۃ کی جگہ نہیں لیتے ⁦(ص 54)⁩۔"
