label:
  ar: "الدم (في الفقه)"
  en: "Blood (in fiqh)"
  ur: "خون (فقہی اصطلاح)"
summary:
  ar: "الدم في الفقه هو السائل الأحمر الذي يجري في عروق الحيوان، ويطلقه الفقهاء أيضا على القصاص والهدي وعلى دم الحيض والاستحاضة والنفاس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} اتفق الفقهاء على أن الدم حرام نجس لا يؤكل ولا ينتفع به، واختلفوا في يسيره وفي تعريف اليسير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} وتتوزع أحكامه على الوضوء والنجاسات والصلاة والحيض والصوم والإحرام والأطعمة والذكاة والعقيقة والقصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8234}"
  en: "In fiqh blood is the red fluid that runs in the veins of living creatures; jurists also use the word for retaliation, for the sacrificial offering, and for the blood of menstruation, irregular bleeding and postnatal bleeding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} The jurists agree that blood is forbidden, impure and not to be eaten or used; they differ on how little of it is excused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} Its rules are spread across ablution, impurity, prayer, menstruation, fasting, pilgrimage, food, slaughter, the aqiqa sacrifice and retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8234}"
  ur: "فقہ میں خون وہ سرخ سیال ہے جو جانداروں کی رگوں میں دوڑتا ہے۔ فقہاء اس لفظ کو قصاص، ہدی اور حیض و استحاضہ و نفاس کے خون کے لیے بھی بولتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} خون کا حرام اور نجس ہونا متفق علیہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233}"
