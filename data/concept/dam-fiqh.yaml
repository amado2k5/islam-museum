label:
  ar: "الدم ⁦(في الفقه)⁩"
  en: "Blood (in fiqh)"
  ur: "خون ⁦(فقہی اصطلاح)⁩"
  es: "Sangre (en fiqh)"
  fr: "Le sang (en fiqh)"
  tr: "Kan (hukuk alanında)"
  id: "Darah (dalam yurisprudensi)"
summary:
  ar: "الدم في الفقه هو السائل الأحمر الذي يجري في عروق الحيوان، ويطلقه الفقهاء أيضا على القصاص والهدي وعلى دم الحيض والاستحاضة والنفاس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} اتفق الفقهاء على أن الدم حرام نجس لا يؤكل ولا ينتفع به، واختلفوا في يسيره وفي تعريف اليسير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} وتتوزع أحكامه على الوضوء والنجاسات والصلاة والحيض والصوم والإحرام والأطعمة والذكاة والعقيقة والقصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8234}"
  en: "In fiqh blood is the red fluid that runs in the veins of living creatures; jurists also use the word for retaliation, for the sacrificial offering, and for the blood of menstruation, irregular bleeding and postnatal bleeding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} The jurists agree that blood is forbidden, impure and not to be eaten or used; they differ on how little of it is excused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} Its rules are spread across ablution, impurity, prayer, menstruation, fasting, pilgrimage, food, slaughter, the aqiqa sacrifice and retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8234}"
  ur: "فقہ میں خون وہ سرخ سیال ہے جو جانداروں کی رگوں میں دوڑتا ہے۔ فقہاء اس لفظ کو قصاص، ہدی اور حیض و استحاضہ و نفاس کے خون کے لیے بھی بولتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} خون کا حرام اور نجس ہونا متفق علیہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233}"
  es: "En el fiqh, la sangre es el fluido rojo que corre por las venas de los seres vivos; los juristas también usan la palabra para referirse a la represalia, al sacrificio y a la sangre de la menstruación, el sangrado irregular y el sangrado posparto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} Los juristas coinciden en que la sangre está prohibida, es impura y no debe comerse ni usarse; difieren en la cantidad que se justifica. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} Sus normas abarcan la ablución, la impureza, la oración, la menstruación, el ayuno, la peregrinación, la comida, el sacrificio, el sacrificio de aqiqa y la represalia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8234}"
  fr: "En droit islamique (fiqh), le sang désigne le liquide rouge qui circule dans les veines des êtres vivants. Les juristes utilisent également ce terme pour désigner la vengeance, l'offrande sacrificielle, ainsi que le sang des menstruations, les saignements irréguliers et les saignements post-partum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} Les juristes s'accordent à dire que le sang est interdit, impur et ne doit être ni consommé ni utilisé; ils divergent cependant quant à la quantité minimale excusée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8233} Ses règles s'appliquent aux ablutions, à l'impureté, à la prière, aux menstruations, au jeûne, au pèlerinage, à l'alimentation, à l'abattage, au sacrifice d'aqiqa et à la vengeance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8234}"
  tr: "Hukukta kan, hayvanların damarlarında akan kırmızı sıvıdır ve hukukçular intikam, kurban hayvanları, adet kanaması, istihida ve doğum sonrası kanama için de bahsederler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8233} Hukukçular, kanın yasak ve saf olmadığı, yenmemesi veya faydalı olmadığı konusunda hemfikir olmuş, hafifliği ve tanımı konusunda farklı görüşteydiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8233} Hükümleri abdest al, kirlenmişlik, dua, adet görme, oruç, ihram ve yiyecek, zekat, akiqah ve intikam arasında dağıtılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8234}"
  id: "Dalam hukum, darah adalah cairan merah yang mengalir melalui pembuluh darah hewan, dan para ahli hukum juga merujuk pada darah pembalasan, hewan kurban, pendarahan menstruasi, istihida, dan perdarahan pasca melahirkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8233} Para ahli hukum sepakat bahwa darah itu dilarang dan tidak suci, tidak boleh dimakan atau bermanfaat, dan mereka berbeda pendapat mengenai sifat ringan dan definisinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8233} Keputusannya dibagi antara wudhu, kotoran, doa, menstruasi, puasa, Ihram dan makanan, zakat, aqiqah, dan pembalasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8234}"
