tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في عُمان"
  en: "Arabic in Oman"
  ur: "عمان میں عربی"
  fr: "L'arabe à Oman"
  es: "El árabe en Omán"
  tr: "Amman'da Arapça"
  id: "Bahasa Arab di Amman"
summary:
  ar: "ما وُجد عن العربية في عُمان: نص المادة 3 من النظام الأساسي كما يعرضه Constitute، وأسماء اللهجتين العمانية والظفارية في شجرة Glottolog، وملاحظة جامعة مانشستر عن النبر في جنوب عُمان، مع بيان ما لم يُعثر عليه. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on Arabic in Oman: the text of Article 3 of the Basic Statute as the Constitute Project shows it, the names of the Omani and Dhofari varieties in Glottolog's tree, and the University of Manchester's remark on stress in southern Oman, with a statement of what was not found. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "عمان میں عربی کے بارے میں جو ملا: نظامِ اساسی کی دفعہ 3 کا متن جیسا Constitute دکھاتا ہے، Glottolog کے شجرے میں عمانی اور ظفاری اقسام کے نام، اور مانچسٹر یونیورسٹی کا جنوبی عمان میں زور کے بارے میں اشارہ، اور جو نہیں ملا اس کا بیان۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur l'arabe à Oman : le texte de l'article 3 de la Loi fondamentale tel que le montre le Constitute Project, les noms des variétés omanaise et dhofarie dans l'arbre de Glottolog, et la remarque de l'université de Manchester sur l'accent dans le sud d'Oman, avec l'énoncé de ce qui n'a pas été trouvé. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el árabe en Omán: el texto del artículo 3 de la Ley Fundamental tal como lo muestra el Constitute Project, los nombres de las variedades omaní y dhofarí en el árbol de Glottolog, y la observación de la Universidad de Manchester sobre el acento en el sur de Omán, con el enunciado de lo que no se halló. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
  tr: "Umman'da Arapça hakkında bulunanlar: Constitution tarafından sunulan statünün 3. maddesinin metni, Glottolog ağacındaki Umman ve Dhofari lehçelerinin isimleri ve Manchester Üniversitesi'nin güney Umman'daki telaffuz notu ile birlikte bulunamayanlara dair bir açıklama. Anayasa kararının metni, müzenin sayfada doğrulamadığı bir araştırma özetinde bulunduğu şekilde orijinal dilinde eklendi."
  id: "Tentang bahasa Arab di Oman: Teks Pasal 3 dari statuta yang disajikan oleh Konstitusi, nama-nama dialek Oman dan Dhofari dalam pohon Glottolog, serta pernyataan tentang dialek yang tidak ditemukan bersama dengan catatan pengucapan Universitas Manchester di Oman selatan. Teks resolusi Konstitusi ditambahkan dalam bahasa aslinya seperti yang tercantum dalam ringkasan penelitian yang tidak diverifikasi oleh museum di halaman tersebut."
