label:
  ar: "العربية في عُمان"
  en: "Arabic in Oman"
  ur: "عمان میں عربی"
  fr: "L'arabe à Oman"
  es: "El árabe en Omán"
summary:
  ar: "ما وُجد عن العربية في عُمان: نص المادة 3 من النظام الأساسي كما يعرضه Constitute، وأسماء اللهجتين العمانية والظفارية في شجرة Glottolog، وملاحظة جامعة مانشستر عن النبر في جنوب عُمان، مع بيان ما لم يُعثر عليه."
  en: "What was found on Arabic in Oman: the text of Article 3 of the Basic Statute as the Constitute Project shows it, the names of the Omani and Dhofari varieties in Glottolog's tree, and the University of Manchester's remark on stress in southern Oman, with a statement of what was not found."
  ur: "عمان میں عربی کے بارے میں جو ملا: نظامِ اساسی کی دفعہ 3 کا متن جیسا Constitute دکھاتا ہے، Glottolog کے شجرے میں عمانی اور ظفاری اقسام کے نام، اور مانچسٹر یونیورسٹی کا جنوبی عمان میں زور کے بارے میں اشارہ، اور جو نہیں ملا اس کا بیان۔"
  fr: "Ce qui a été trouvé sur l'arabe à Oman : le texte de l'article 3 de la Loi fondamentale tel que le montre le Constitute Project, les noms des variétés omanaise et dhofarie dans l'arbre de Glottolog, et la remarque de l'université de Manchester sur l'accent dans le sud d'Oman, avec l'énoncé de ce qui n'a pas été trouvé."
  es: "Lo que se encontró sobre el árabe en Omán: el texto del artículo 3 de la Ley Fundamental tal como lo muestra el Constitute Project, los nombres de las variedades omaní y dhofarí en el árbol de Glottolog, y la observación de la Universidad de Manchester sobre el acento en el sur de Omán, con el enunciado de lo que no se halló."
