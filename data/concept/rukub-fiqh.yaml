label:
  ar: "الركوب"
  en: "Rukub (riding): prayer on the mount, prayer of the warrior and the pilgrim on a mount, tawaf on a mount, liability for a beast's damage, and the supplications of the rider"
  ur: "سواری (رکوب)"
summary:
  ar: "الركوب في اللغة مصدر ركب، أي علا على الدابة، وقيل خاص بالإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} ولا خلاف في جواز صلاة التطوع على الراحلة في السفر، وأجاز الجمهور ذلك في السفر القصير أيضا، وشرط المالكية السفر الذي يقصر فيه، ويشترط ألا تكثر الأفعال، وأن يدوم السفر إلى انتهاء الصلاة، واستقبال القبلة عند التكبير عند الحنفية والحنابلة إن أمكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8968} ويجوز للمجاهد الصلاة راكبا عند التحام القتال، ويفضل الحج راكبا، ويجوز الطواف راكبا لعذر، ويوجب الحنفية والمالكية والحنابلة دما على الطواف راكبا بلا عذر، ويضمن الراكب ما تتلفه دابته بيدها عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} ويسن للراكب أن يكبر ويحمد الله ويسبح ويدعو بما ورد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8971}"
  en: "Rukub (riding) in the lexicon is mounting a beast, and some say it is peculiar to camels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} All agree that voluntary prayer on the mount is permitted on a journey; the majority allow it on a short journey too; the Malikis require a journey that shortens the prayer, that the movements be few, and that the journey last to the end of the prayer, and the Hanafis and Hanbalis require facing the qibla at the opening takbir where possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8968} A warrior may pray on a mount when fighting is joined; riding the hajj is better than walking; tawaf on a mount is valid with an excuse, and without one the Hanafis, Malikis and Hanbalis require a sacrifice; the rider is liable for damage done by his beast's hand according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} The rider says the takbir, praise and the recorded supplications on mounting and on setting out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8971}"
  ur: "سواری پر نفل نماز سفر میں جائز ہے اور قبلہ کی طرف رخ جہاں ممکن ہو ضروری ہے؛ عذر کے بغیر سوار ہو کر طواف کرنا دم لازم کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970}"
