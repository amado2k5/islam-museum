label:
  ar: "الركوب"
  en: "Rukub (riding): prayer on the mount, prayer of the warrior and the pilgrim on a mount, tawaf on a mount, liability for a beast's damage, and the supplications of the rider"
  ur: "سواری ⁦(رکوب)⁩"
  es: "Rukub (a caballo): oración en la montaña, oración del guerrero y del peregrino en una montaña, tawaf en una montaña, responsabilidad por los daños causados a un animal y las súplicas del jinete."
  fr: "Rukub (équitation): prière à cheval, prière du guerrier et du pèlerin à cheval, tawaf à cheval, responsabilité en cas de dommages causés à une bête et supplications du cavalier"
summary:
  ar: "الركوب في اللغة مصدر ركب، أي علا على الدابة، وقيل خاص بالإبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} ولا خلاف في جواز صلاة التطوع على الراحلة في السفر، وأجاز الجمهور ذلك في السفر القصير أيضا، وشرط المالكية السفر الذي يقصر فيه، ويشترط ألا تكثر الأفعال، وأن يدوم السفر إلى انتهاء الصلاة، واستقبال القبلة عند التكبير عند الحنفية والحنابلة إن أمكن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8968} ويجوز للمجاهد الصلاة راكبا عند التحام القتال، ويفضل الحج راكبا، ويجوز الطواف راكبا لعذر، ويوجب الحنفية والمالكية والحنابلة دما على الطواف راكبا بلا عذر، ويضمن الراكب ما تتلفه دابته بيدها عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} ويسن للراكب أن يكبر ويحمد الله ويسبح ويدعو بما ورد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8971}"
  en: "Rukub (riding) in the lexicon is mounting a beast, and some say it is peculiar to camels. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} All agree that voluntary prayer on the mount is permitted on a journey; the majority allow it on a short journey too; the Malikis require a journey that shortens the prayer, that the movements be few, and that the journey last to the end of the prayer, and the Hanafis and Hanbalis require facing the qibla at the opening takbir where possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8968} A warrior may pray on a mount when fighting is joined; riding the hajj is better than walking; tawaf on a mount is valid with an excuse, and without one the Hanafis, Malikis and Hanbalis require a sacrifice; the rider is liable for damage done by his beast's hand according to the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} The rider says the takbir, praise and the recorded supplications on mounting and on setting out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8971}"
  ur: "سواری پر نفل نماز سفر میں جائز ہے اور قبلہ کی طرف رخ جہاں ممکن ہو ضروری ہے؛ عذر کے بغیر سوار ہو کر طواف کرنا دم لازم کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970}"
  es: "Rukub (montar) en el léxico es montar una bestia, y algunos dicen que es peculiar de los camellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} Todos están de acuerdo en que la oración voluntaria en la montaña está permitida en un viaje; la mayoría la permite también en un viaje corto; los malikíes requieren un viaje que acorte la oración, que los movimientos sean pocos y que el viaje dure hasta el final de la oración, y los hanafíes y hanbalíes requieren mirar hacia la qibla en el takbir de apertura cuando sea posible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8968} Un guerrero puede orar en una montaña cuando se une al combate; Montar a caballo en el Hajj es mejor que caminar; el Tawaf a caballo es válido con una excusa, y sin ella, los Hanafi, Maliki y Hanbali exigen un sacrificio; el jinete es responsable de los daños causados por la mano de su bestia según la mayoría. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} El jinete recita el takbir, las alabanzas y las súplicas registradas al montar y al partir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8971}"
  fr: "Le terme « rukub » (monter) désigne, dans le lexique, l’action de monter à dos d’animal, et certains affirment qu’elle est propre aux chameaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} Tous s’accordent à dire que la prière surérogatoire à dos d’animal est permise en voyage; la majorité l’autorise également pour un court trajet. Les Malikites exigent un trajet qui raccourcit la prière, des mouvements peu nombreux et que le trajet dure jusqu’à la fin de la prière. Les Hanafites et les Hanbalites, quant à eux, exigent que le guerrier se tourne vers la qibla au moment du takbir initial, lorsque cela est possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8968} Un guerrier peut prier à dos d’animal lorsqu’il est engagé dans un combat. Accomplir le hajj à cheval est préférable à la marche; le tawaf à cheval est valide avec une excuse valable, et sans excuse valable, les écoles hanafite, malikite et hanbalite exigent un sacrifice; le cavalier est responsable des dommages causés par sa monture selon l'avis majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} Le cavalier prononce le takbir, les louanges et les invocations prescrites en montant sur la monture et en partant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8971}"
