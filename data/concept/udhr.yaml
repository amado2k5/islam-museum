label:
  ar: "العُذْر"
  en: "Excuse (udhr)"
  ur: "عذر"
summary:
  ar: "العذر في اللغة الحجة التي يعتذر بها، ويعني رفع اللوم، ولا يخرج الاصطلاح عن هذا المعنى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. وتتصل به الرخصة، وهي ما شُرع من الأحكام لعذر مع قيام السبب المحرم، والعفو وهو التجاوز عن الذنب وإسقاط اللوم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527}. والأعذار عامة وخاصة، فمنها ما يلازم الإنسان كالاستحاضة وسلس البول، وأثرها في الطهارة والصلاة مبسوط عند الفقهاء في الوضوء لكل صلاة وبطلانه بخروج الوقت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11530}. ومنها الأعذار الطارئة كالمطر والبرد والخوف، ومنها أعذار تبيح الرخص كالسفر والمرض والإكراه والجهل والنسيان والجنون والاضطرار والحاجة والصغر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11535}. وفي العقود تتعلق الأعذار بالإعسار بالنفقة وتأخير رد المبيع المعيب وتأخير طلب الشفعة، وينحل العقد اللازم إذا عرض عذر يمنع الوفاء به إلا بضرر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}. ومن كان لا قدرة له فهو معذور من الجهاد، والحرج مرفوع عمن أعذره الشرع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}."
  en: "Linguistically, udhr is the reason a person offers in his defence; it means lifting blame, and the technical sense does not depart from it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. Related are rukhsa, a rule enacted for an excuse while the forbidding cause remains, and afw, the pardoning of a fault and dropping of blame {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527}. Excuses are general or specific. Some stay with a person, such as irregular bleeding and the involuntary flow of urine, and their effect on purity and prayer is set out in the rules on repeated ablution for each prayer and on its nullification at the end of the time {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11530}. Others are passing, such as rain, cold and fear. Others permit concessions: travel, illness, coercion, ignorance, forgetting, madness, necessity, need and minority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11535}. In contracts, the excuses concern inability to pay maintenance, the delay in returning a defective sale, and the delay in claiming pre-emption; a binding contract is dissolved when an excuse arises that makes its performance possible only with harm {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}. A person without the means is excused from fighting in jihad, and hardship is lifted from those whom the law excuses {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}."
