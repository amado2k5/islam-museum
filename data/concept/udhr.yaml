label:
  ar: "العُذْر"
  en: "Excuse (udhr)"
  ur: "عذر"
  es: "Disculpa (udhr)"
  fr: "Excusez-moi (udhr)"
summary:
  ar: "العذر في اللغة الحجة التي يعتذر بها، ويعني رفع اللوم، ولا يخرج الاصطلاح عن هذا المعنى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. وتتصل به الرخصة، وهي ما شُرع من الأحكام لعذر مع قيام السبب المحرم، والعفو وهو التجاوز عن الذنب وإسقاط اللوم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527}. والأعذار عامة وخاصة، فمنها ما يلازم الإنسان كالاستحاضة وسلس البول، وأثرها في الطهارة والصلاة مبسوط عند الفقهاء في الوضوء لكل صلاة وبطلانه بخروج الوقت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11530}. ومنها الأعذار الطارئة كالمطر والبرد والخوف، ومنها أعذار تبيح الرخص كالسفر والمرض والإكراه والجهل والنسيان والجنون والاضطرار والحاجة والصغر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11535}. وفي العقود تتعلق الأعذار بالإعسار بالنفقة وتأخير رد المبيع المعيب وتأخير طلب الشفعة، وينحل العقد اللازم إذا عرض عذر يمنع الوفاء به إلا بضرر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}. ومن كان لا قدرة له فهو معذور من الجهاد، والحرج مرفوع عمن أعذره الشرع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}."
  en: "Linguistically, udhr is the reason a person offers in his defence; it means lifting blame, and the technical sense does not depart from it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. Related are rukhsa, a rule enacted for an excuse while the forbidding cause remains, and afw, the pardoning of a fault and dropping of blame {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527}. Excuses are general or specific. Some stay with a person, such as irregular bleeding and the involuntary flow of urine, and their effect on purity and prayer is set out in the rules on repeated ablution for each prayer and on its nullification at the end of the time {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11530}. Others are passing, such as rain, cold and fear. Others permit concessions: travel, illness, coercion, ignorance, forgetting, madness, necessity, need and minority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11535}. In contracts, the excuses concern inability to pay maintenance, the delay in returning a defective sale, and the delay in claiming pre-emption; a binding contract is dissolved when an excuse arises that makes its performance possible only with harm {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}. A person without the means is excused from fighting in jihad, and hardship is lifted from those whom the law excuses {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}."
  es: "Lingüísticamente, udhr es la razón que una persona ofrece en su defensa; significa eliminar la culpa, y el sentido técnico no se aparta de él {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. Relacionadas están rukhsa, una regla promulgada para una excusa mientras la causa que prohíbe subsiste, y afw, el perdón de una falta y la eliminación de la culpa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527}. Las excusas pueden ser generales o específicas. Algunos permanecen con una persona, como el sangrado irregular y el flujo involuntario de orina, y su efecto en la pureza y la oración se establece en las reglas sobre la ablución repetida para cada oración y sobre su anulación al final del tiempo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11530}. Otros son pasajeros, como la lluvia, el frío y el miedo. Otros permiten concesiones: viaje, enfermedad, coacción, ignorancia, olvido, locura, necesidad, necesidad y minoría {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11535}. En los contratos, las excusas se refieren a la incapacidad de pagar el mantenimiento, la demora en devolver una venta defectuosa y la demora en reclamar el derecho de tanteo; Un contrato vinculante se disuelve cuando surge una excusa que hace posible su cumplimiento solo con daño {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}. Una persona sin medios está exenta de luchar en la yihad, y se alivia la dificultad de aquellos a quienes la ley exime {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}."
  fr: "Linguistiquement, udhr désigne la raison invoquée pour sa défense; cela signifie se dégager de toute responsabilité, et le sens technique reste le même {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526}. On retrouve des termes apparentés dans rukhsa, une règle édictée pour justifier une faute alors que la cause d’interdiction demeure, et dans afw, le pardon d’une faute et l’abandon de la responsabilité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527}. Les excuses peuvent être générales ou spécifiques. Certaines choses demeurent, comme les saignements irréguliers et les incontinences urinaires, et leur incidence sur la pureté et la prière est précisée dans les règles relatives aux ablutions répétées pour chaque prière et à leur annulation à la fin du temps imparti {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11530}. D'autres sont passagères, comme la pluie, le froid et la peur. D'autres permettent des concessions: voyage, maladie, contrainte, ignorance, oubli, folie, nécessité, besoin et minorité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11532} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11535}. Dans les contrats, les excuses concernent l'incapacité de payer la pension alimentaire, le retard dans le retour d'une vente défectueuse et le retard dans la revendication du droit de préemption; Un contrat contraignant est dissous lorsqu'une excuse survient qui rend son exécution possible uniquement au détriment du bien-être de son auteur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11537} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}. Une personne sans ressources est dispensée de participer au jihad, et les difficultés sont allégées pour ceux que la loi dispense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11538}."
