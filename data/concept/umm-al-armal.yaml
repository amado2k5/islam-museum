  ar: "أم الأرامل مسألة من المسائل الملقبات في الفرائض، وفيها جدتان وثلاث زوجات وأربع أخوات لأم وثماني أخوات لأبوين أو لأب، وتسمى السبعة عشرية لأن أسهمها سبعة عشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401} وأصلها اثنا عشر ثم تعول إلى سبعة عشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}"
  en: "Umm al-armal is one of the named cases in inheritance: two grandmothers, three wives, four uterine sisters, and eight full or consanguine sisters. It is called the seventeen case because its shares total seventeen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401} It starts at twelve and rises to seventeen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}"
