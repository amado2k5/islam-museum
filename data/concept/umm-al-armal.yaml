label: { ar: "أم الأرامل", en: "Umm al-armal (a named inheritance case)", es: "Umm al-armal (un caso de herencia con nombre)", fr: "Umm al-armal (un cas d'héritage nommé)", ur: "ام الارمل ⁦(ایک نامزد وراثت کا مقدمہ)⁩" }
summary:
  ar: "أم الأرامل مسألة من المسائل الملقبات في الفرائض، وفيها جدتان وثلاث زوجات وأربع أخوات لأم وثماني أخوات لأبوين أو لأب، وتسمى السبعة عشرية لأن أسهمها سبعة عشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401} وأصلها اثنا عشر ثم تعول إلى سبعة عشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}"
  en: "Umm al-armal is one of the named cases in inheritance: two grandmothers, three wives, four uterine sisters, and eight full or consanguine sisters. It is called the seventeen case because its shares total seventeen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401} It starts at twelve and rises to seventeen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}"
  es: "Umm al-armal es uno de los casos mencionados en la herencia: dos abuelas, tres esposas, cuatro hermanas uterinas y ocho hermanas de padre y madre o hermanas consanguíneas. Se le llama el caso de los diecisiete porque sus partes suman diecisiete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401} Comienza en doce y llega hasta diecisiete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}"
  fr: "Umm al-armal est l'un des cas de succession mentionnés: deux grands-mères, trois épouses, quatre sœurs utérines et huit sœurs germaines ou consanguines. On l'appelle le cas des dix-sept car le total de ses parts est de dix-sept. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401} Il commence à douze et atteint dix-sept. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}"
  ur: "ام الارمل وراثت میں نامزد مقدمات میں سے ایک ہے: دو دادی، تین بیویاں، چار بچہ دانی بہنیں، اور آٹھ مکمل یا کنجوس بہنیں۔ اسے سترہ کیس کہا جاتا ہے کیونکہ اس کے کل سترہ حصص ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3401} یہ بارہ بجے شروع ہوتا ہے اور سترہ تک بڑھتا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3401}"
