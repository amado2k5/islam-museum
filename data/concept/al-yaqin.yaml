id: concept/al-yaqin
class: concept
kind: doctrine
label: { ar: "اليقين ودرجاته", en: "Certainty and its degrees (yaqin)" }
summary:
  ar: "يعرض الشعراوي اليقين درجات ثلاثاً: علم اليقين إذا جاء الخبر عمّن يُوثق به، وعين اليقين إذا شوهد الأمر، وحق اليقين إذا دخل الإنسان في حقيقة الشيء. ويستدل بقوله تعالى في سورة التكاثر، ويذكر أن أبا بكر صدّق بالإسراء لأنه خبر من يثق به. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.556}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.557}"
  en: "Sha'rawi sets out certainty in three degrees: knowledge of certainty when the report comes from someone one trusts, sight of certainty when the matter has been seen, and truth of certainty when one enters into the reality of the thing. He cites the Surat al-Takathur, and says Abu Bakr accepted the night journey because it came from one he trusted {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.556}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.557}."
wings: [ideas]
themes: [creed, spirituality-and-sufism]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "ما اليقين، وهل يقوم على الخبر الموثوق أم على المشاهدة أم على الحقيقة؟"
  en: "What is certainty: does it rest on a trusted report, on sight, or on the reality itself?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-three-degrees
    stance:
      ar: "اليقين ثلاث درجات: علم، وعين، وحق، ينتهي إلى استقرار القضية في القلب"
      en: "Certainty has three degrees, knowledge, sight and truth, and ends in the matter settling in the heart"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن اليقين استقرار القضية في القلب بحيث لا يحتمل شكاً، وأن الإيمان يقوم على خبر من يوثق به، ومن ذلك تصديق أبي بكر بالإسراء. ثم يرتقي اليقين إلى عين اليقين بالمشاهدة، وإلى حق اليقين بدخول الإنسان في الحقيقة، ويستدل على ذلك بوعيد الجحيم في سورة التكاثر. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.556}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.557}"
      en: "Sha'rawi holds that certainty is the settling of a matter in the heart so that it admits no doubt, that faith rests on the report of one who is trusted, and that Abu Bakr's acceptance of the night journey is an example. Certainty then rises to sight of certainty by seeing, and to truth of certainty by entering into the reality, and he takes the warning of the Fire in al-Takathur as the illustration {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.556}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.557}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "ما زالت أقوال العلماء في درجات اليقين ومراتبه دون مصدر في هذه الدفعة"
      en: "Scholars' statements on the degrees of certainty are not yet entered from a source"
