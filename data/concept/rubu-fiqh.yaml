tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "الرباع"
  en: "Rubu' (houses and walled dwellings): their sale and rent in Mecca, pre-emption, division and endowment"
  ur: "رباع ⁦(مکانات)⁩"
  es: "Rubu' (casas y viviendas amuralladas): su venta y alquiler en La Meca, derecho de tanteo, división y dotación."
  fr: "Rubu' (maisons et habitations fortifiées): leur vente et leur location à La Mecque, préemption, division et dotation"
summary:
  ar: "الرِّباع جمع ربع، وهو المنزل والدار، وأطلق الفقهاء الربع على البناء وحائط النخل الذي يحوطه جدار أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604} ولا يصح عند الحنفية والحنابلة بيع رباع مكة وإجارتها، وأجازه الشافعية، وفي المالكية أربع روايات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} وتجب الشفعة في الرباع قبل قسمتها بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} ويتبع البناء والشجر الأرض في القسمة عند الجمهور، وخالف المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} ويصح وقف العقار من أرض ودور وحوانيت وبساتين بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606}"
  en: "Rubu' is the plural of rab', a house or dwelling; the jurists also use it for a building and a walled palm garden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604} The Hanafis and Hanbalis forbid the sale and rent of houses in Mecca, while the Shafi'is allow them; the Malikis hold four views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} Pre-emption in houses is due before division by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} In division, most jurists have buildings and trees follow the land, while the Malikis have each follow the other in sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} Real property, including land, houses, shops and orchards, may be endowed by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606}"
  ur: "رباع جمع ربع ہے، یعنی گھر اور مکان۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604} مکہ کے مکانات کی بیع و اجارہ میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605}"
  es: "Rubu' es el plural de rab', una casa o vivienda; los juristas también lo usan para un edificio y un jardín de palmeras amurallado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604} Los hanafíes y hanbalíes prohíben la venta y el alquiler de casas en La Meca, mientras que los shafi'ís los permiten; los malikíes tienen cuatro puntos de vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} El derecho de preferencia sobre las casas se debe antes de la división por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} En la división, la mayoría de los juristas tienen edificios y árboles que siguen al terreno, mientras que los malikíes tienen cada uno que sigue al otro en la venta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} Los bienes inmuebles, incluidos terrenos, casas, tiendas y huertos, pueden ser dotados mediante acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606}"
  fr: "Rubu' est le pluriel de rab', qui signifie maison ou habitation; les juristes l'emploient également pour désigner un bâtiment et une palmeraie entourée de murs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604} Les hanafites et les hanbalites interdisent la vente et la location de maisons à La Mecque, tandis que les chaféites les autorisent; les malikites présentent quatre avis différents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} Le droit de préemption sur les maisons est acquis avant tout partage par accord. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} Lors du partage, la plupart des juristes considèrent que les bâtiments et les arbres suivent le terrain, tandis que les malikites prévoient que l'un suive l'autre en cas de vente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} Les biens immobiliers, y compris les terrains, les maisons, les commerces et les vergers, peuvent faire l'objet d'une donation par convention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606}"
