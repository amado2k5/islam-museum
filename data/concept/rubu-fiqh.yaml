id: concept/rubu-fiqh
class: concept
kind: legal
label:
  ar: "الرباع"
  en: "Rubu' (houses and walled dwellings): their sale and rent in Mecca, pre-emption, division and endowment"
  ur: "رباع (مکانات)"
summary:
  ar: "الرِّباع جمع ربع، وهو المنزل والدار، وأطلق الفقهاء الربع على البناء وحائط النخل الذي يحوطه جدار أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604} ولا يصح عند الحنفية والحنابلة بيع رباع مكة وإجارتها، وأجازه الشافعية، وفي المالكية أربع روايات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} وتجب الشفعة في الرباع قبل قسمتها بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} ويتبع البناء والشجر الأرض في القسمة عند الجمهور، وخالف المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} ويصح وقف العقار من أرض ودور وحوانيت وبساتين بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606}"
  en: "Rubu' is the plural of rab', a house or dwelling; the jurists also use it for a building and a walled palm garden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604} The Hanafis and Hanbalis forbid the sale and rent of houses in Mecca, while the Shafi'is allow them; the Malikis hold four views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} Pre-emption in houses is due before division by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} In division, most jurists have buildings and trees follow the land, while the Malikis have each follow the other in sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606} Real property, including land, houses, shops and orchards, may be endowed by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8606}"
  ur: "رباع جمع ربع ہے، یعنی گھر اور مکان۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8604} مکہ کے مکانات کی بیع و اجارہ میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8605}"
