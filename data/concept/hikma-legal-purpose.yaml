label: { ar: "الحكمة (في أصول الفقه)", en: "Hikma (purpose of a ruling in usul)", ur: "حکمت (اصولِ فقہ)" }
summary:
  ar: "الحكمة في اللغة العلم بحقائق الأشياء والعمل بمقتضاها، وقد جاءت في القرآن بمعنى النبوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} وعند الأصوليين الحكمة ما يترتب على ربط الحكم بعلته أو سببه من جلب مصلحة أو دفع مفسدة أو تقليلها، وتطلق أيضا على الوصف المناسب لشرع الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} والسبب وصف ظاهر منضبط معرّف للحكم، والمانع ما يلزم من وجوده عدم السبب أو الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} والفرق بين الحكمة والعلة أن العلة وصف جعله الشارع مناطا للحكم وجودا وعدما، أما الحكمة فهي المصلحة نفسها وقد تخفى أو تتفاوت في الانضباط، ولذلك اختلف الأصوليون في جواز ربط الحكم بالحكمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} "
  en: "In lexical use hikma is the knowledge of things as they are and acting on it; in the Quran it is applied to prophethood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} For the usulis hikma is the benefit that follows from tying a ruling to its cause or occasion (securing a good or removing or reducing a harm), and it also names the fitting quality that suits the ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} A cause (sabab) is an apparent, regular attribute that defines a ruling; an impediment (mani') is what, when present, excludes the cause or ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} The illa is the attribute the lawgiver made the criterion of a ruling; the hikma is the benefit itself, which may be hard to measure or hidden, so the usulis dispute whether a ruling may be tied to the hikma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} "
  ur: "لغت میں حکمت کسی چیز کی حقیقت کا علم اور اس کے تقاضے پر عمل ہے؛ قرآن میں یہ لفظ نبوت کے معنی میں بھی آیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} اصولیین کے نزدیک حکمت وہ فائدہ ہے جو حکم کو اس کی علت یا سبب سے جوڑنے پر حاصل ہوتا ہے، یعنی مصلحت حاصل کرنا یا مفسدہ دور یا کم کرنا، اور یہ اس مناسب وصف کو بھی کہا جاتا ہے جو حکم کے موافق ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} سبب ایک ظاہر اور منضبط وصف ہے جو حکم کی تعریف کرتا ہے، اور مانع وہ ہے جس کے ہونے سے سبب یا حکم کا عدم لازم آئے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7234} علت وہ وصف ہے جسے شارع نے حکم کا مدار بنایا، جبکہ حکمت خود مصلحت ہے جو کبھی پوشیدہ یا غیر منضبط ہوتی ہے، اس لیے اصولیین میں اختلاف ہے کہ حکم کو حکمت کے ساتھ جوڑنا جائز ہے یا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7235} "
