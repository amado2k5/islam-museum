summary:
  ar: "يأمر ابن سينا إذا كان في عروق المعي أخلاط جامدة أو خامة بتدبير الإعياء أولاً ثم الإنضاج، وبالسكون وترك الرياضة وترك الفصد قبل النضج، ويذكر الفلفل والكبر والزنجبيل وأخلالاً في الأغذية، ثم الشراب الرقيق بعد ظهور الرسوب في البول {cite:canon-ibn-sina-print-v1 pp.245-246}."
  en: "When hardened or raw humours lie in the vessels of the intestine Ibn Sina orders the fatigue treated first and then ripening, with rest, leaving off exercise and holding back venesection before ripening, names pepper, caper, ginger and vinegars for the food, and then thin wine once sediment shows in the urine {cite:canon-ibn-sina-print-v1 pp.245-246}."
