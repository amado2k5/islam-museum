id: concept/canon-raw-humours-in-the-intestinal-vessels-and-ripening
class: concept
kind: scientific
label:
  ar: "الأخلاط الخام في عروق المعي وإنضاجها عند ابن سينا"
  en: "Raw humours in the intestinal vessels and their ripening in the Canon"
  fr: "Humeurs crues dans les vaisseaux intestinaux et maturation dans le Canon"
  ur: "آنتوں کی رگوں میں کچے اخلاط اور ان کا پکنا قانون میں"
  es: "Humores crudos en los vasos intestinales y su maduración en el Canon"
summary:
  ar: "يأمر ابن سينا إذا كان في عروق المعي أخلاط جامدة أو خامة بتدبير الإعياء أولاً ثم الإنضاج، وبالسكون وترك الرياضة وترك الفصد قبل النضج، ويذكر الفلفل والكبر والزنجبيل وأخلالاً في الأغذية، ثم الشراب الرقيق بعد ظهور الرسوب في البول {cite:canon-ibn-sina-print-v1 pp.245-246}."
  en: "When hardened or raw humours lie in the vessels of the intestine Ibn Sina orders the fatigue treated first and then ripening, with rest, leaving off exercise and holding back venesection before ripening, names pepper, caper, ginger and vinegars for the food, and then thin wine once sediment shows in the urine {cite:canon-ibn-sina-print-v1 pp.245-246}."
  fr: "Pour les humeurs durcies ou crues dans les vaisseaux intestinaux, Ibn Sina décrit d’abord le traitement de la fatigue, puis la maturation : repos, arrêt de l’exercice et de la saignée avant maturation ; poivre, câpre, gingembre et vinaigres dans l’alimentation, puis vin léger lorsqu’apparaît un sédiment urinaire {cite:canon-ibn-sina-print-v1 pp.245-246}."
  es: "Cuando los humores endurecidos o crudos se encuentran en los vasos del intestino, Ibn Sina ordena tratar primero la fatiga y luego la maduración, con reposo, evitando el ejercicio y posponiendo la venopunción antes de la maduración, menciona pimienta, alcaparras, jengibre y vinagres para la alimentación, y luego vino diluido una vez que se observa sedimento en la orina {cite:canon-ibn-sina-print-v1 pp.245-246}."
