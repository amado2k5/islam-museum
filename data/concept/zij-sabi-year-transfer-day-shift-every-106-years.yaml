label: { ar: "تقدم يوم التحويل كل مائة وست سنين", en: "The shift of a transfer day by one day every hundred and six years", ur: "ہر ایک سو چھ سال میں تحویل کے دن کا ایک دن آگے کھسکنا", es: "El cambio de un día de transferencia en un día cada ciento seis años.", fr: "Le décalage d'un jour de transfert tous les cent six ans", tr: "Din değiştirme günü her yüz altı yılda bir öne alınır.", id: "Hari pertobatan dimajukan setiap seratus enam tahun sekali." }
summary:
  ar: "كلما انقضت مائة وست سنين تقدّم اليوم الذي كانت فيه السنة في الأصل من الشهر بيوم واحد. وإذا أردت أن تخفف الحساب تبدأ بعدد السنين فتقسمه على أربعة، ثم تُلقي ما يحصل من السنين أربعة أربعة، فما بقي تحسب له جزءاً من ستين، وتزيد ساعات التقويم بحسب ذلك. {cite:zij-sabi-nallino-byblion pp.197}"
  en: "Every hundred and six years the day of the month on which the year stood at the start shifts earlier by one day. To shorten the work, the years are divided into groups of four, and the remainder is reckoned as a fraction and added to the calendar hours. {cite:zij-sabi-nallino-byblion p.197}"
  ur: "ہر ایک سو چھ سال گزرنے پر وہ دن جو مہینے میں اصل میں تھا ایک دن پیچھے ہو جاتا ہے۔ حساب مختصر کرنے کے لیے سالوں کو چار چار کے گروہوں میں تقسیم کیا جاتا ہے اور باقی کو اسی حساب سے تقویمی گھنٹوں میں جمع کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.197}"
  es: "Cada ciento seis años, el día del mes en que comenzaba el año se adelanta un día. Para agilizar el cálculo, los años se dividen en grupos de cuatro, y el resto se considera una fracción que se suma a las horas del calendario. {cite:zij-sabi-nallino-byblion p.197}"
  fr: "Tous les cent six ans, le jour du mois où débutait l'année avance d'un jour. Pour simplifier le calcul, les années sont divisées en groupes de quatre, et le reste est calculé comme une fraction et ajouté aux heures du calendrier. {cite:zij-sabi-nallino-byblion p.197}"
  tr: "Her yıl, yüz altı yıl geçtikçe, yılın başlangıçta ay içinde denk geldiği gün bir gün ilerler. Hesaplamayı basitleştirmek için, önce yıl sayısını dörde bölün, ardından elde edilen dört sayısını dört ile çarpın. Kalan daha sonra altmışta bir olarak hesaplanır ve takvim saatleri buna göre artırılır. {cite:zij-sabi-nallino-byblion pp.197}"
  id: "Setiap tahun, setelah seratus enam tahun berlalu, hari di mana tahun tersebut awalnya jatuh dalam bulan tersebut akan maju satu hari. Untuk menyederhanakan perhitungan, mulailah dengan membagi jumlah tahun dengan empat, lalu kurangi hasil empat kali tersebut dengan empat. Sisanya kemudian dihitung sebagai seperenam puluh, dan jam kalender ditingkatkan sesuai dengan itu. {cite:zij-sabi-nallino-byblion pp.197}"
