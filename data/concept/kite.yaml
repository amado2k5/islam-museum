summary:
  ar: "إحدى الخمس الفواسق التي أباح النبي قتلها في الحل والحرم مع الغراب والعقرب والفأرة والكلب العقور، ويُفدى ما عداهن من الطير إن قتله المحرم."
  en: "One of the five vermin the Prophet permitted to be killed in and out of ihram, with the crow, the scorpion, the mouse and the rabid dog — any other bird killed in ihram is ransomed."
  ur: "ان پانچ فاسق جانوروں میں سے ایک جن کا قتل نبی نے حلال و احرام دونوں حالتوں میں جائز قرار دیا، کاوا، بچھو، چوہا اور آکرت کتے کے ساتھ — احرام میں کوئی اور پرندہ مارا جائے تو اس کا فدیہ ہوتا ہے۔"
  es: "Uno de los cinco animales que el Profeta permitió matar dentro y fuera del estado de ihram, junto con el cuervo, el escorpión, el ratón y el perro rabioso; cualquier otra ave que se mate durante el ihram es rescatada."
  fr: "Parmi les cinq vermines que le Prophète a permis de tuer, en état d'ihram ou non, avec le corbeau, le scorpion, la souris et le chien enragé — tout autre oiseau tué en état d'ihram est racheté."
  tr: "Peygamber'in yasak bir kişi tarafından öldürülmesi halinde yasak bir kişi tarafından öldürülürse yasak bir kişi tarafından öldürülen beş ahlaksız günahtan biri, yasal ve kutsal yerlerde öldürülmesine izin vermiştir."
  id: "Salah satu dari lima dosa tidak bermoral yang diizinkan Nabi untuk dibunuh di tempat yang sah dan suci bersama dengan gagak, kalajengking, tikus, dan anjing yang lapar, serta burung-burung lainnya harus diberi kompensasi jika dibunuh oleh orang yang dilarang."
