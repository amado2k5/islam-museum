id: concept/zij-sabi-horizontal-shadow-and-altitude
class: concept
kind: scientific
label: { ar: "الظل المبسوط والارتفاع في الزيج الصابي", en: "The horizontal shadow and the altitude", ur: "افقی سایہ اور ارتفاع", es: "La sombra horizontal y la altitud", fr: "L'ombre horizontale et l'altitude", tr: "Sabi'i zij'deki geniş gölge ve yükseklik", id: "Bayangan yang memanjang dan tinggi badan pada Sabi'i zij" }
summary:
  ar: "يبيّن البتاني في الباب العاشر كيف يُعرف الظل من الارتفاع بالحساب، فيُضرب وتر تمام الارتفاع في أجزاء المقياس ويُقسم على وتر الارتفاع. ويقول إن أصحاب الحساب، وعليهم عمل في الزيج، جعلوا المقياس اثني عشر جزءاً، وإن الأجزاء تنسب إلى المقياس. وبالعكس يُعرف الارتفاع من الظل المبسوط بجذر مجموع مربع الظل ومربع المقياس، ثم قسمة نصف القطر مضروباً في المقياس على الناتج. {cite:zij-sabi-nallino-byblion pp.35-36}."
  en: "In chapter 10 al-Battani shows how to find the shadow from the altitude by calculation: the chord of the altitude's complement is multiplied by the gnomon's parts and divided by the chord of the altitude. He says the calculators, whom the zij follows, made the gnomon twelve parts, shadow parts being reckoned against the gnomon's. Conversely, the altitude comes from the horizontal shadow through the root of the sum of the shadow's square and the gnomon's square, then by dividing the radius times the gnomon by the result. {cite:zij-sabi-nallino-byblion pp.35-36}."
  ur: "دسویں باب میں البتانی بتاتے ہیں کہ ارتفاع سے سایہ حساب کے ذریعے کیسے معلوم ہو: ارتفاع کے تتمے کے وتر کو مقیاس کے اجزا سے ضرب دیا جاتا ہے اور ارتفاع کے وتر پر تقسیم کیا جاتا ہے۔ وہ کہتے ہیں کہ اصحاب الحساب، جن پر زیج نے عمل کیا، نے مقیاس کو بارہ جز رکھا، اور سائے کے اجزا مقیاس کے اجزا سے نسبت کیے جاتے ہیں۔ اس کے برعکس ارتفاع افقی سائے سے سایے کے مربع اور مقیاس کے مربع کے مجموعے کے جذر سے معلوم ہوتا ہے، پھر نصف قطر کو مقیاس سے ضرب دے کر حاصل پر تقسیم کیا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.35-36}۔"
  es: "En el capítulo 10, al-Battani muestra cómo hallar la sombra a partir de la altura mediante un cálculo: la cuerda del complemento de la altura se multiplica por las partes del gnomon y se divide por la cuerda de la altura. Afirma que los calculadores, a quienes sigue el zij, hicieron del gnomon doce partes, calculando las partes de la sombra en relación con las del gnomon. A la inversa, la altura se obtiene a partir de la sombra horizontal mediante la raíz cuadrada de la suma del cuadrado de la sombra y el cuadrado del gnomon, dividiendo luego el radio multiplicado por el gnomon entre el resultado. {cite:zij-sabi-nallino-byblion pp.35-36}."
  fr: "Au chapitre 10, al-Battani explique comment calculer l'ombre à partir de la hauteur: on multiplie la corde du complément de la hauteur par les parties du gnomon et on divise le résultat par la corde de la hauteur. Il précise que les calculateurs, dont s'inspire le zij, ont divisé le gnomon en douze parties, les parties de l'ombre étant calculées par rapport à celles du gnomon. Inversement, la hauteur s'obtient à partir de l'ombre horizontale en prenant la racine carrée de la somme du carré de l'ombre et du carré du gnomon, puis en divisant le produit du rayon par le gnomon par le résultat. {cite:zij-sabi-nallino-byblion pp.35-36}."
  tr: "Onuncu bölümde, el-Battani, yüksekliğin kirişini ölçeğin parçalarıyla çarparak ve yüksekliğin kirişine bölerek, yükseklikten teğetin nasıl hesaplanacağını açıklıyor. Astronomik tablolarla (zijs) çalışanların ölçeği on iki parçaya böldüğünü ve bu parçaların ölçekle ilişkili olduğunu belirtiyor. Tersine, yükseklik, teğetin karesi ile ölçeğin karesinin toplamının karekökünü alarak ve ardından yarıçapı ölçekle çarpıp sonucu elde edilen değere bölerek teğetten hesaplanır. {cite:zij-sabi-nallino-byblion pp.35-36}."
  id: "Dalam bab kesepuluh, al-Battani menjelaskan cara menghitung garis singgung dari tinggi dengan mengalikan tali busur tinggi dengan bagian-bagian skala dan membaginya dengan tali busur tinggi. Ia menyatakan bahwa mereka yang bekerja dengan tabel astronomi (zijs) telah membagi skala menjadi dua belas bagian, dan bagian-bagian ini berhubungan dengan skala. Sebaliknya, tinggi dihitung dari garis singgung dengan mengambil akar kuadrat dari jumlah kuadrat garis singgung dan kuadrat skala, kemudian membagi jari-jari yang dikalikan dengan skala dengan hasilnya. {cite:zij-sabi-nallino-byblion pp.35-36}."
