id: concept/canon-mixing-a-drug-with-its-opposite
class: concept
kind: scientific
label:
  ar: "خلط الدواء بما يضاده عند ابن سينا"
  en: "Mixing a drug with its opposite in the Canon"
  fr: "Mélanger un remède à son contraire dans le Canon"
  ur: "دوا میں اس کی ضد ملانا قانون میں"
  es: "Mezclar una droga con su opuesto en el canon"
summary:
  ar: "يبين ابن سينا أنه كثيراً ما يحتاج في تبديل مزاج ما إلى استعمال ما يقوي ذلك المزاج مخلوطاً بما يضاده، كالخل مع الأدوية المسخنة لعضو، والزعفران في الأدوية المبردة للقلب، والشمع مع دهن البلسان ليحبسه على العضو {cite:canon-ibn-sina-print-v1 pp.272-273}."
  en: "Ibn Sina shows that in changing a temperament one often has to use what strengthens that temperament mixed with its opposite: vinegar with the warming drugs for an organ, saffron in the cooling drugs for the heart, and wax with balsam oil to hold it on the organ {cite:canon-ibn-sina-print-v1 pp.272-273}."
  fr: "Ibn Sina décrit, pour modifier un tempérament, l’ajout d’un agent renforçant ce même tempérament à son contraire : vinaigre aux chauffants d’un organe, safran aux refroidissants du cœur, cire à l’huile de baume pour la retenir {cite:canon-ibn-sina-print-v1 pp.272-273}."
  es: "Ibn Sina muestra que para cambiar un temperamento a menudo hay que usar lo que fortalece ese temperamento mezclado con su opuesto: vinagre con medicamentos que calientan para un órgano, azafrán en medicamentos que enfrían para el corazón y cera con aceite de bálsamo para fijarlo al órgano {cite:canon-ibn-sina-print-v1 pp.272-273}."
