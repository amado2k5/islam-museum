label: { ar: "خلط الدواء بما يضاده عند ابن سينا", en: "Mixing a drug with its opposite in the Canon", ur: "دوا میں اس کی ضد ملانا قانون میں" }
summary:
  ar: "يبين ابن سينا أنه كثيراً ما يحتاج في تبديل مزاج ما إلى استعمال ما يقوي ذلك المزاج مخلوطاً بما يضاده، كالخل مع الأدوية المسخنة لعضو، والزعفران في الأدوية المبردة للقلب، والشمع مع دهن البلسان ليحبسه على العضو {cite:canon-ibn-sina-print-v1 pp.272-273}."
  en: "Ibn Sina shows that in changing a temperament one often has to use what strengthens that temperament mixed with its opposite: vinegar with the warming drugs for an organ, saffron in the cooling drugs for the heart, and wax with balsam oil to hold it on the organ {cite:canon-ibn-sina-print-v1 pp.272-273}."
