label:
  ar: "كَلأ"
  en: "Herbage and pasture (kala')"
  ur: "کلأ (گھاس اور چراگاہ)"
summary:
  ar: "الكلأ في اللغة العشب رطباً كان أو يابساً، وفي الاصطلاح ما ينبت من غير صنع العبد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13477}. وقد اتفق الفقهاء على أن الكلأ النابت في الأماكن المباحة كالأودية والجبال والأراضي التي لا مالك لها مشترك بين الناس، لا يمنع أحد من أخذه ولا من رعي ماشيته فيه، لحديث: المسلمون شركاء في ثلاث: الماء والنار والكلأ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13477} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13478}. أما النابت في أرض مملوكة فإن صاحب الأرض يمنع الداخل إليها، ولا يُمنع أحد من أخذه إن لم يكن له غيره، والمالكية يجيزون رعي ما لم يُزرع ولا يُمنع ما نبت في أرض لا تقبل الزرع، إلا إن كان حوله زرع يخشى فساده {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13479}. ويجوز للإمام حمى بقعة موات لنعم الجزية والصدقة والضعيف عن الرعي عند جمهور الحنفية والمالكية والحنابلة والأظهر عند الشافعية، ويجوز عند جمهور الفقهاء رعي حشيش الحرم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13480}."
  en: "Kala' means herbage, dry or green; in law it is grass that grows without human work {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13477}. The jurists agree that grass growing on open land such as valleys, mountains and unowned ground is shared, and no one may forbid another to take it or to graze his animals there, on the hadith that Muslims share three things: water, fire and herbage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13477} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13478}. Grass on owned land belongs to its owner, who may bar entry, though no one may be stopped from taking grass he cannot find elsewhere; the Malikis allow grazing on unplanted ground and do not allow grass in unplanted land to be stopped unless a field nearby is at risk {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13479}. The imam may reserve unowned land for the herds of the poor-tax and the sadaqa and for the weak, according to the Hanafis, Malikis, Hanbalis and the sounder Shafi'i view, and most jurists allow grazing in the sanctuary of Mecca {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13480}."
  ur: "کلأ لغت میں خشک یا تر گھاس کو کہتے ہیں، اور اصطلاح میں وہ گھاس جو انسان کے عمل کے بغیر اگتی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13477}۔ فقہاء کا اتفاق ہے کہ کھلی زمین جیسے وادیوں، پہاڑوں اور لاوارث زمینوں کی گھاس سب لوگوں میں مشترک ہے، اور کسی کو اس میں گھاس لینے یا جانور چرانے سے نہیں روکا جا سکتا، اس حدیث کی بنا پر کہ مسلمان تین چیزوں میں شریک ہیں: پانی، آگ اور گھاس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13477} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13478}۔ مملوکہ زمین کی گھاس اس کے مالک کی ہے، جو داخلے سے روک سکتا ہے، البتہ جس کو گھاس کہیں اور نہ ملتی ہو اسے لینے سے نہیں روکا جائے گا؛ مالکیہ غیر کاشت زمین پر چرانے کی اجازت دیتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13478} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13479}۔ امام جمہور حنفیہ، مالکیہ، حنابلہ اور شافعیہ کے اظہر قول کے مطابق جزیہ اور صدقے کے مویشیوں اور کمزوروں کے لیے کسی غیر آباد زمین کو محفوظ کر سکتا ہے، اور حرم کی گھاس چرانا جمہور کے نزدیک جائز ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13480}۔"
