id: concept/al-sidq-truthfulness
class: concept
kind: ethical
label: { ar: "الصدق في الحديث", en: "Truthfulness (sidq)" }
summary:
  ar: "ما جعله كعب بن مالك محور قصته: أنه صدق النبي فلم يعتذر بعذر كاذب، ثم نذر ألا يحدث إلا صدقاً ما حيي. ويضم باب الصدق في رياض الصالحين أصول الحديث فيه: قول ابن مسعود «إن الصدق يهدي إلى البر وإن البر يهدي إلى الجنة وإن الرجل ليصدق حتى يكتب عند الله صديقاً وإن الكذب يهدي إلى الفجور وإن الفجور يهدي إلى النار» متفق عليه {cite:riyad-salihin p.24}، وقول الحسن بن علي «دع ما يريبك فإن الصدق طمأنينة والكذب ريبة» رواه الترمذي {cite:riyad-salihin p.25}، وفضل من سأل الله الشهادة بصدق فبلغ منازل الشهداء وإن مات على فراشه رواه مسلم {cite:riyad-salihin p.25}"
  en: "The theme Ka'b ibn Malik made the axis of his story: he told the Prophet the truth rather than offer a false excuse, then vowed to speak nothing but truth for the rest of his life. The chapter on truthfulness in Riyad al-Salihin gathers its foundations: Ibn Mas'ud's hadith agreed upon by the two Sahihs — 'truthfulness guides to righteousness and righteousness guides to paradise; a man may speak truth until he is written with God as a truthful one, and lying guides to wickedness and wickedness to the Fire' {cite:riyad-salihin p.24}; al-Hasan ibn Ali's counsel 'leave what makes you doubt, for truthfulness is reassurance and lying is doubt' as related by al-Tirmidhi {cite:riyad-salihin p.25}; and the merit of one who asks God for martyrdom in truth and is granted the stations of the martyrs even if he dies on his bed, related by Muslim {cite:riyad-salihin p.25}"
