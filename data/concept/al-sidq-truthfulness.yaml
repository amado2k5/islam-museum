id: concept/al-sidq-truthfulness
class: concept
kind: ethical
tags: [akhlaq-browser, akhlaq-sidq]
label: { ar: "الصدق في الحديث", en: "Truthfulness (sidq)", fr: "Véracité (sidq)", es: "Veracidad (sidq)", ur: "صداقت ⁦(صدق)⁩" }
summary:
  ar: "ما جعله كعب بن مالك محور قصته: أنه صدق النبي فلم يعتذر بعذر كاذب، ثم نذر ألا يحدث إلا صدقاً ما حيي. ويضم باب الصدق في رياض الصالحين أصول الحديث فيه: قول ابن مسعود «إن الصدق يهدي إلى البر وإن البر يهدي إلى الجنة وإن الرجل ليصدق حتى يكتب عند الله صديقاً وإن الكذب يهدي إلى الفجور وإن الفجور يهدي إلى النار» متفق عليه {cite:riyad-salihin p.24}، وقول الحسن بن علي «دع ما يريبك فإن الصدق طمأنينة والكذب ريبة» رواه الترمذي {cite:riyad-salihin p.25}، وفضل من سأل الله الشهادة بصدق فبلغ منازل الشهداء وإن مات على فراشه رواه مسلم {cite:riyad-salihin p.25}"
  en: "The theme Ka'b ibn Malik made the axis of his story: he told the Prophet the truth rather than offer a false excuse, then vowed to speak nothing but truth for the rest of his life. The chapter on truthfulness in Riyad al-Salihin gathers its foundations: Ibn Mas'ud's hadith agreed upon by the two Sahihs — 'truthfulness guides to righteousness and righteousness guides to paradise; a man may speak truth until he is written with God as a truthful one, and lying guides to wickedness and wickedness to the Fire' {cite:riyad-salihin p.24}; al-Hasan ibn Ali's counsel 'leave what makes you doubt, for truthfulness is reassurance and lying is doubt' as related by al-Tirmidhi {cite:riyad-salihin p.25}; and the merit of one who asks God for martyrdom in truth and is granted the stations of the martyrs even if he dies on his bed, related by Muslim {cite:riyad-salihin p.25}"
  fr: "C’est le thème que Ka’b ibn Malik place au cœur de son récit : il dit la vérité au Prophète plutôt que de donner un faux prétexte, puis fait le vœu de ne dire que la vérité jusqu’à la fin de sa vie. Le chapitre sur la véracité du Riyad al-Salihin en rassemble les fondements : le hadith d’Ibn Mas’ud rapporté dans les deux Sahihs — « La véracité mène à la droiture et la droiture mène au Paradis. Un homme peut dire la vérité jusqu’à être inscrit auprès de Dieu comme véridique. Le mensonge mène à la perversité et la perversité mène au Feu » {cite:riyad-salihin p.24} ; le conseil d’al-Hasan ibn Ali, « Laisse ce qui te fait douter, car la véracité est assurance et le mensonge est doute », rapporté par al-Tirmidhi {cite:riyad-salihin p.25} ; et le mérite de celui qui demande sincèrement à Dieu le martyre et à qui les rangs des martyrs sont accordés même s’il meurt dans son lit, selon un récit rapporté par Muslim {cite:riyad-salihin p.25}"
  es: "El tema que Ka'b ibn Malik convirtió en el eje de su historia: le dijo la verdad al Profeta en lugar de ofrecer una falsa excusa, y luego juró no decir nada más que la verdad por el resto de su vida. El capítulo sobre la veracidad en Riyad al-Salihin reúne sus fundamentos: el hadiz de Ibn Mas'ud acordado por los dos Sahihs: «la veracidad guía a la rectitud y la rectitud guía al paraíso; un hombre puede decir la verdad hasta que sea escrito con Dios como uno veraz, y la mentira guía a la maldad y la maldad al Fuego» {cite:riyad-salihin p.24}; el consejo de al-Hasan ibn Ali: «deja lo que te hace dudar, pues la veracidad es seguridad y la mentira es duda», según lo relata al-Tirmidhi {cite:riyad-salihin p.25}; y el mérito de aquel que pide a Dios el martirio con sinceridad y se le conceden las posiciones de los mártires aunque muera en su cama, relatado por Muslim {cite:riyad-salihin p.25}"
  ur: "کعب بن مالک نے اپنی کہانی کا محور بنایا: اس نے جھوٹا عذر پیش کرنے کے بجائے نبی کو سچ کہا، پھر زندگی بھر سچ کے سوا کچھ نہ کہنے کا عہد کیا۔ ریاض الصالحین میں سچائی کا باب اپنی بنیادیں جمع کرتا ہے: ابن مسعود کی حدیث جس پر دونوں صحیحین متفق ہیں - 'سچائی راستی کی طرف رہنمائی کرتی ہے اور راستبازی جنت کی طرف رہنمائی کرتی ہے۔ ایک آدمی سچ بول سکتا ہے جب تک کہ وہ خدا کے نزدیک سچا لکھا نہ جائے، اور جھوٹ بدی اور بدی کو آگ کی طرف رہنمائی کرتا ہے۔ حسن بن علی کی نصیحت 'جو چیز تمہیں شک میں ڈالتی ہے اسے چھوڑ دو کیونکہ سچائی یقین دہانی ہے اور جھوٹ شک ہے' جیسا کہ ترمذی نے نقل کیا ہے {حوالہ: ریاض صالحین صفحہ 25}؛ اور اس شخص کی فضیلت جو خدا سے حق کے ساتھ شہادت مانگتا ہے اور اسے شہداء کے درجات ملتے ہیں خواہ وہ اپنے بستر پر ہی مر جائے، اس کو مسلم نے نقل کیا ہے: ریاض الصالحین ص25۔"
