id: concept/manqul
class: concept
kind: legal
label: { ar: "المَنْقُول", en: "Movable property (manqul) as against immovable (aqar)", ur: "منقول (قابلِ انتقال مال)" }
summary:
  ar: "المنقول في اللغة ما يمكن تحويله من موضع إلى موضع، وهو عند جمهور الفقهاء ما يمكن نقله من محل إلى آخر، ومقابله العقار. وعند المالكية ما يمكن نقله مع بقائه على هيئته. ولأحكامه صلة ببيع المنقول قبل قبضه، والشفعة، وبيع الوصي، والغصب، ووقفه، وكيفية قبضه."
  en: "Manqul in the lexicon is what can be shifted from one place to another. For most jurists it is what can be moved from one place to another, whether or not its form changes, including money, goods, animals, and things measured or weighed; its counterpart is the immovable, aqar. The Malikis hold it is what can be moved while keeping its form. Its rules cover sale before taking possession, pre-emption, the guardian's sale, usurpation, endowment, and how possession is taken."
  ur: "منقول وہ مال ہے جسے ایک جگہ سے دوسری جگہ منتقل کیا جا سکے، جبکہ غیر منقول عقار ہے۔ جمہور کے نزدیک اس میں نقدی، سامان، جانور اور ناپ تول کی چیزیں شامل ہیں۔ اس کے احکام قبضہ سے پہلے بیع، شفعہ، وصی کی بیع، غصب اور وقف سے متعلق ہیں۔"
