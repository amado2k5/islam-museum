label: { ar: "المَنْقُول", en: "Movable property (manqul) as against immovable (aqar)", ur: "منقول ⁦(قابلِ انتقال مال)⁩", es: "Bienes muebles (manqul) en contraposición a bienes inmuebles (aqar)", fr: "Biens meubles (manqul) par opposition aux biens immeubles (aqar)", tr: "Transfer edildi", id: "Dipindahkan" }
summary:
  ar: "المنقول في اللغة ما يمكن تحويله من موضع إلى موضع، وهو عند جمهور الفقهاء ما يمكن نقله من محل إلى آخر، ومقابله العقار. وعند المالكية ما يمكن نقله مع بقائه على هيئته. ولأحكامه صلة ببيع المنقول قبل قبضه، والشفعة، وبيع الوصي، والغصب، ووقفه، وكيفية قبضه."
  en: "Manqul in the lexicon is what can be shifted from one place to another. For most jurists it is what can be moved from one place to another, whether or not its form changes, including money, goods, animals, and things measured or weighed; its counterpart is the immovable, aqar. The Malikis hold it is what can be moved while keeping its form. Its rules cover sale before taking possession, pre-emption, the guardian's sale, usurpation, endowment, and how possession is taken."
  ur: "منقول وہ مال ہے جسے ایک جگہ سے دوسری جگہ منتقل کیا جا سکے، جبکہ غیر منقول عقار ہے۔ جمہور کے نزدیک اس میں نقدی، سامان، جانور اور ناپ تول کی چیزیں شامل ہیں۔ اس کے احکام قبضہ سے پہلے بیع، شفعہ، وصی کی بیع، غصب اور وقف سے متعلق ہیں۔"
  es: "En el léxico, manqul se refiere a aquello que puede trasladarse de un lugar a otro. Para la mayoría de los juristas, es lo que puede moverse de un lugar a otro, independientemente de si cambia su forma, incluyendo dinero, bienes, animales y objetos medidos o pesados; su contraparte es el inmueble, aqar. Los malikíes sostienen que es aquello que puede trasladarse conservando su forma. Sus reglas abarcan la venta antes de tomar posesión, el derecho de tanteo, la venta por parte del tutor, la usurpación, la dotación y la forma en que se toma posesión."
  fr: "Dans le lexique, le terme « manqul » désigne ce qui peut être déplacé d'un lieu à un autre. Pour la plupart des juristes, il s'agit de ce qui peut être déplacé, que sa forme change ou non, y compris l'argent, les biens, les animaux et les objets mesurés ou pesés; son pendant est l'« aqar », qui désigne l'incontournable. Les Malikites considèrent qu'il s'agit de ce qui peut être déplacé tout en conservant sa forme. Ses règles couvrent la vente avant prise de possession, la préemption, la vente par le tuteur, l'usurpation, la dotation et les modalités de prise de possession."
  tr: "Dilbilimde, devredilen mülk, bir yerden başka bir yere aktarılabilen maldır; hukukçuların çoğunluğuna göre, bir yerden başka bir yere aktarılabilen ve karşılığı gayrimenkuldür. Malikilere göre, devredilebilecek ve korunan mülk. Kararları, devredilen mülkün mülkiyetinden önce satışı, önceliklendirilmesi, vasiyetçinin satışı, gasp edilmesi, vakıf ve mülkiyet şekliyle ilgilidir."
  id: "Dalam linguistik, properti yang dipindahkan adalah apa yang dapat dipindahkan dari satu tempat ke tempat lain, dan menurut mayoritas ahli hukum, itulah yang dapat dipindahkan dari satu tempat ke tempat lain, dan padanannya adalah properti. Menurut Malikis, apa yang dapat dipindahkan sambil tetap utuh. Putusannya berkaitan dengan penjualan properti yang dialihkan sebelum kepemilikan, preemption, penjualan oleh pelaksana, pengambilalihan, pemberian wakaf, dan cara kepemilikannya."
