summary:
  ar: 'القهار: الغالب لكل شيء القاهر لجميع خلقه بقدرته. الاسم رقم 15 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Qahhar — The Subduer. Name 15 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Qahhar — Le Dominateur. Nom 15 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'القهار: قہّار — جو ہر شے پر غالب اور تمام مخلوق کا قاہر ہے۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 15۔'
  es: "al-Qahhar — El Sometedor. Nombre número 15 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Kahar: Her şeyin egemen, yarattığına gücüyle boyun eğdiren. El-Tirmidi'nin Allah'ın En Güzel İsimleri hakkındaki hadislerinde adı 15."
  id: "Al-Qahhar: Yang dominan dari segala sesuatu, yang Tunduk pada seluruh ciptaan-Nya dengan kuasa-Nya. Nama nomor 15 dalam daftar yang disebutkan dalam hadits al-Tirmidhi tentang Nama-nama Allah, Yang Maha Indah."
