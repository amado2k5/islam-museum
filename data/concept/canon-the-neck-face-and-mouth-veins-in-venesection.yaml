summary:
  ar: "يذكر ابن سينا الوداجين اللذين يفصدان في ابتداء الجذام والخناق والبهق وعلل الطحال، ثم عرق الأرنبة الذي رأى ضرره أكبر من نفعه، وعروق ما خلف الأذن وعروق الشفة والفم واللسان والذقن واللثة ومنافعها {cite:canon-ibn-sina-print-v1 p.298}."
  en: "Ibn Sina names the two jugular veins opened at the start of leprosy, quinsy, vitiligo and spleen ailments, then the vein of the tip of the nose, whose harm he finds greater than its benefit, and the veins behind the ear, of the lips and mouth, tongue, chin and gums, with their uses {cite:canon-ibn-sina-print-v1 p.298}."
