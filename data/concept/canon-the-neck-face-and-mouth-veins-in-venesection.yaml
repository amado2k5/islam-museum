class: concept
kind: scientific
label: { ar: "عروق العنق والوجه والفم المفصودة عند ابن سينا", en: "The veins of the neck, face and mouth in venesection in the Canon", ur: "قانون میں گردن، چہرے اور منہ کی کھولی جانے والی رگیں", es: "Las venas del cuello, la cara y la boca en la venesección según el Canon", fr: "Les veines du cou, du visage et de la bouche lors de la saignée dans le Canon", tr: "İbn Sina'ya göre boyun, yüz ve ağız eklembacaklıları", id: "Arthropoda leher, wajah, dan mulut menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا الوداجين اللذين يفصدان في ابتداء الجذام والخناق والبهق وعلل الطحال، ثم عرق الأرنبة الذي رأى ضرره أكبر من نفعه، وعروق ما خلف الأذن وعروق الشفة والفم واللسان والذقن واللثة ومنافعها {cite:canon-ibn-sina-print-v1 p.298}."
  en: "Ibn Sina names the two jugular veins opened at the start of leprosy, quinsy, vitiligo and spleen ailments, then the vein of the tip of the nose, whose harm he finds greater than its benefit, and the veins behind the ear, of the lips and mouth, tongue, chin and gums, with their uses {cite:canon-ibn-sina-print-v1 p.298}."
  es: "Ibn Sina nombra las dos venas yugulares que se abren al comienzo de la lepra, el amigdalitis, el vitíligo y las dolencias del bazo, luego la vena de la punta de la nariz, cuyo daño encuentra mayor que su beneficio, y las venas detrás de la oreja, de los labios y la boca, la lengua, el mentón y las encías, con sus usos {cite:canon-ibn-sina-print-v1 p.298}."
  fr: "Ibn Sina cite les deux veines jugulaires ouvertes au début de la lèpre, de l'angine, du vitiligo et des affections de la rate, puis la veine du bout du nez, dont il juge le mal supérieur au bienfait, et les veines derrière l'oreille, des lèvres et de la bouche, de la langue, du menton et des gencives, avec leurs usages {cite:canon-ibn-sina-print-v1 p.298}."
  ur: "ابن سینا نے جذام کے شروع میں کھلنے والی دو رگوں کا نام بتایا ہے، کوڑھ، وٹیلیگو اور تلی کی بیماریاں، پھر ناک کے سرے کی رگ، جس کا نقصان وہ اپنے فائدے سے زیادہ سمجھتا ہے، اور کان کے پیچھے والی رگیں، ہونٹوں اور منہ کی، زبان، ٹھوڑی اور مسوڑھوں کا استعمال کرتا ہے۔ صفحہ 298}۔"
  tr: "İbn Sina, cüzzam, difteri, vitiligo ve dalak hastalıklarının başında çıkarılan juguler damarlardan, ardından zararlı olmaktan çok zararlı gördüğü tavşan damarından ve kulak arkasındaki damarlardan, dudak, ağız, dil, çene, diş etleri damarlarından ve bunların faydalarından bahseder {cite:canon-ibn-sina-print-v1 s.298}."
  id: "Ibn Sina menyebutkan vena jugularis yang diangkat pada awal penyakit kusta, difteri, vitiligo, dan limpa, kemudian pembuluh darah kelinci, yang ia anggap lebih berbahaya daripada bermanfaat, serta pembuluh darah di belakang telinga, pembuluh darah bibir, mulut, lidah, dagu, gusi, dan manfaatnya {cite:canon-ibn-sina-print-v1 hlm.298}."
