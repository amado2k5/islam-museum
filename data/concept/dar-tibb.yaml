summary:
  ar: "ضرع في الكتاب بارد يابس بسبب العصب الكبير الذي فيه، وغذاء الضرع الممتلئ لبنا إذا استمرئ قريب من غذاء اللحم، وأحمده ما يكون فيه لبن، وبالأفاويه فإنها تعجل بانحداره، وهو من الحيوان الجيد اللحم جدا جيد الخلط غليظه قويه {cite:canon-ibn-sina-print-v1 p.721}"
  en: "Dar' is in the book cold and dry because of the large nerve in it; the nourishment of the udder filled with milk, when digested, is near the nourishment of meat, and the most praiseworthy is the one with milk in it, with spices, for they hasten its descent; it is from the animals of very good flesh, good in humour, thick and strong {cite:canon-ibn-sina-print-v1 p.721}"
  ur: "ضرع کتاب میں بڑی عصب کی وجہ سے ٹھنڈا اور خشک ہے، اور دودھ سے بھرے ضرع کی غذا، جب ہضم ہو جائے، گوشت کی غذا کے قریب ہے، اور سب سے قابل تعریف وہ ہے جس میں دودھ ہو، مسالوں کے ساتھ کیونکہ وہ اس کے اترنے کو تیز کرتے ہیں، یہ بہت اچھے گوشت والے جانوروں میں سے ہے، اچھی خلط والا، گاڑھا اور قوی {cite:canon-ibn-sina-print-v1 p.721}۔"
  es: "Dar' es en el libro frío y seco debido al gran nervio que contiene; el alimento de la ubre llena de leche, una vez digerido, es similar al alimento de la carne, y el más loable es el que contiene leche y especias, pues aceleran su digestión; proviene de animales de carne muy buena, de buen carácter, grueso y fuerte {cite:canon-ibn-sina-print-v1 p.721}"
  fr: "Dans le livre, Dar' est décrit comme froid et sec en raison de son nerf important; la nourriture de la mamelle pleine de lait, une fois digérée, est proche de celle de la viande, et la plus louable est celle qui contient du lait et des épices, car elles accélèrent sa descente; elle provient d'animaux à la chair excellente, de bonne humeur, épaisse et forte {cite:canon-ibn-sina-print-v1 p.721}"
  tr: "Kitaptaki meme, içinde bulunan büyük sinir nedeniyle soğuk ve kurudur, devam ederse sütle dolu olan meme yemeği ise et yiyeceğine yakındır. Süt içeren en övgüye değer olanıdır ve sürüntülerle azalma hızlanır. Çok iyi etli, karıştırılması kolay, kalın ve güçlü bir hayvandır {cite:canon-ibn-sina-print-v1 s.721}"
  id: "Ambing dalam buku itu dingin dan kering karena saraf besar yang dimilikinya, dan makanan ambing yang penuh susu jika terus berisi hampir seperti makanan daging. Ini adalah yang paling patut dipuji dari yang mengandung susu, dan dengan usapan mereka mempercepat penurunan susu. Ini adalah hewan dengan daging yang sangat baik, baik untuk dicampur, kental, dan kuat {cite:canon-ibn-sina-print-v1 hlm.721}"
