id: concept/zij-sabi-the-altitude-with-no-azimuth-deviation
class: concept
kind: scientific
label: { ar: "الارتفاع الذي لا ميل لسمته عن مطلع الاعتدال في الزيج الصابي", en: "The altitude whose azimuth does not deviate from the equinoctial rising", ur: "وہ ارتفاع جس کے سمت کا مطلع اعتدال سے میل نہیں", es: "La altitud cuyo acimut no se desvía de la salida equinoccial.", fr: "L'altitude dont l'azimut ne dévie pas de la direction de montée équinoxiale" }
summary:
  ar: "يعرض البتاني طريقة ثانية لخط المشرق والمغرب، ثم لخط الشمال والجنوب منه، بمعرفة ارتفاع لا ميل لسمته عن مطلع الاعتدال أو مغربه، فإذا بلغت الشمس ذلك الارتفاع كان وسط ظل العود على نقطة المشرق أو المغرب. ولا تتهيأ الطريقة إلا والشمس في البروج الشمالية، من أول الحمل إلى آخر السنبلة. {cite:zij-sabi-nallino-byblion pp.40-41}."
  en: "Al-Battani offers a second way to the east-west line, and from it the north-south line, by knowing an altitude whose azimuth does not depart from the equinoctial rising or setting; when the Sun reaches that altitude the middle of the rod's shadow lies on the east or west point. The method works only while the Sun is in the northern signs, from the first of Aries to the end of Virgo. {cite:zij-sabi-nallino-byblion pp.40-41}."
  ur: "البتانی خط مشرق و مغرب اور اسی سے خط شمال و جنوب کا دوسرا طریقہ پیش کرتے ہیں، ایسے ارتفاع کے ذریعے جس کے سمت کا مطلع اعتدال یا مغرب اعتدال سے میل نہ ہو؛ جب سورج اس ارتفاع پر پہنچے تو سلاخ کے سائے کا وسط مشرق یا مغرب کے نقطے پر ہوتا ہے۔ یہ طریقہ صرف اس وقت ممکن ہے جب سورج شمالی بروج میں ہو یعنی حمل کے آغاز سے سنبلہ کے آخر تک۔ {cite:zij-sabi-nallino-byblion pp.40-41}۔"
  es: "Al-Battani propone una segunda vía para obtener la línea este-oeste y, a partir de ella, la línea norte-sur, conociendo una altitud cuyo acimut no se desvíe de la salida o puesta equinoccial; cuando el Sol alcanza dicha altitud, el centro de la sombra de la vara se sitúa sobre el punto este u oeste. Este método solo funciona mientras el Sol se encuentra en los signos del norte, desde el primer día de Aries hasta el final de Virgo. {cite:zij-sabi-nallino-byblion pp.40-41}."
  fr: "Al-Battani propose une seconde méthode pour déterminer l'axe est-ouest, et à partir de là l'axe nord-sud, en connaissant une altitude dont l'azimut ne s'écarte pas du point de lever ou de coucher équinoxial; lorsque le Soleil atteint cette altitude, le milieu de l'ombre de la baguette se situe à l'est ou à l'ouest. Cette méthode n'est valable que lorsque le Soleil se trouve dans les signes du nord, du début du Bélier à la fin de la Vierge. {cite:zij-sabi-nallino-byblion pp.40-41}."
