id: concept/hammam-bath-house
class: concept
kind: legal
label: { ar: "الحمام", en: "Hammam (bath-house)", ur: "حمام", es: "Hammam (casa de baños)", fr: "Hammam (bain public)", tr: "Banyo", id: "Kamar mandi" }
summary:
  ar: "الحمام في الأصل موضع الاستحمام بالماء الحار، ثم قيل للاغتسال بأي ماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} ويرى الحنفية في الصحيح والمالكية والشافعية جواز بناء الحمام وبيعه وإجارته إذا لم يكن فيه كشف للعورة، ويكره الحنابلة إجارته وشراءه، ويكره كسب الحمامي، وحمام النساء أشد كراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} ولا تثبت الشفعة في الحمام الذي لا يقبل القسمة عند الجمهور، وتثبت عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} ويجوز دخول الحمام للرجال والنساء بشرط أمن المحرم ستر العورة، ويجب عند بعض الفقهاء التستر، وتدخل المرأة لعذر، ويمنع الذمية من دخوله مع المسلمات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7325} وفيه آداب في الدخول والخروج، وطهارة ماؤه معتبرة عند الحنفية والحنابلة، ويكره عندهم قراءة القرآن فيه بصوت، ولا يُستحب فيه السلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} وتصح الصلاة فيه عند الجمهور، وفي المعتمد عند الحنابلة لا تصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} ويختلف الفقهاء في قطع السارق منه، فيفرق الحنفية بين الليل والنهار، والمالكية والشافعية والحنابلة لهم تفاصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} ويختم المدخل بالعنوان التالي «حمو» على ص 7329. "
  en: "Hammam is lexically a bath-house with hot water, and later any bathing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} The Hanafis (sound view), Malikis and Shafiis allow building, selling and renting bath-houses without uncovering the awrah; the Hanbalis dislike renting or buying them, and the earnings of a bath-keeper are disliked, the women's bath more so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} Pre-emption does not apply to an indivisible bath according to the majority, and the Hanafis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} Men and women may enter a bath if they are sure of avoiding what is forbidden, covering the awrah; some jurists require full cover, a woman may enter for an excuse, and a dhimmi woman is barred from entering with Muslim women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7325} There are rules of entry and exit, the purity of its water is accepted by the Hanafis and Hanbalis, Quranic recitation aloud there is disliked, and greeting in it is not recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} Prayer in a bath-house is valid for the majority; in the preferred Hanbali view it is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} The schools differ on whether a thief from a bath-house is hand-cut, the Hanafis distinguishing night and day. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} The entry closes at the next headword, hamw ⁦(حمو)⁩, on p.7329. "
  ur: "حمام اصل میں غسل کی گرم پانی والی جگہ ہے، پھر ہر پانی سے نہانے کے لیے بھی بولا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} حنفیہ کے صحیح قول، مالکیہ اور شافعیہ کے نزدیک حمام بنانا، بیچنا اور کرائے پر دینا جائز ہے جب کھلی ہوئی شرمگاہ نہ ہو؛ حنابلہ اس کا کرایہ اور خرید مکروہ کہتے ہیں، حمامی کی کمائی مکروہ ہے، اور عورتوں کے حمام پر کراہت زیادہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} جمہور کے نزدیک جو حمام تقسیم قبول نہ کرے اس میں شفعہ ثابت نہیں، جبکہ حنفیہ کے نزدیک ثابت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} مرد اور عورتیں حمام میں جا سکتے ہیں جب ستر کا خیال ہو؛ بعض فقہاء مکمل ڈھانپنا ضروری کہتے ہیں، عورت عذر سے داخل ہو سکتی ہے، اور ذمی عورت کو مسلمان عورتوں کے ساتھ داخل ہونے سے روکا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7325} داخل اور خارج ہونے کے آداب ہیں، حنفیہ اور حنابلہ کے نزدیک اس کا پانی طاہر ہے، وہاں بلند آواز سے قرآن پڑھنا مکروہ ہے، اور وہاں سلام مستحب نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} جمہور کے نزدیک حمام میں نماز صحیح ہے، جبکہ حنابلہ کے معتمد قول میں صحیح نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} حمام سے چوری پر ہاتھ کاٹنے میں اختلاف ہے، حنفیہ رات اور دن میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} یہ مدخل p.7329 پر «حمو» کے عنوان پر ختم ہوتا ہے۔ "
  es: "Hammam es léxicamente una casa de baños con agua caliente, y más tarde cualquier baño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} Los hanafíes (visión sólida), malikíes y shafiíes permiten construir, vender y alquilar casas de baños sin descubrir la awrah; a los hanbalíes no les gusta alquilarlas ni comprarlas, y las ganancias de un encargado de baños son desaprobables, especialmente el baño de mujeres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} La prelación no se aplica a un baño indivisible según la mayoría, y los hanafíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} Los hombres y las mujeres pueden entrar a un baño si están seguros de evitar lo que está prohibido, cubriendo la awrah; algunos juristas requieren una cobertura completa, una mujer puede entrar con una excusa, y una mujer dhimmi tiene prohibido entrar con mujeres musulmanas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7325} Hay reglas de entrada y salida, la pureza de su agua es aceptada por los hanafíes y hanbalíes, la recitación coránica en voz alta allí es desaconsejable y el saludo en ella no es recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} La oración en una casa de baños es válida para la mayoría; en la opinión preferida de los hanbalíes no lo es. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} Las escuelas difieren en si un ladrón de una casa de baños es cortado a mano, los Hanafi distinguen entre el día y la noche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} La entrada se cierra en la siguiente palabra clave, hamw ⁦(حمو)⁩, en la pág. 7329."
  fr: "Le terme « hammam » désigne, lexicalement, un bain d'eau chaude, puis, plus tard, tout type de bain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} Les écoles hanafite (avis sain), malikite et chaféite autorisent la construction, la vente et la location de bains publics sans que l'espace sacré (awrah) ne soit découvert; les hanbalites désapprouvent la location et l'achat de ces établissements, ainsi que les revenus du tenancier de bain, en particulier ceux du bain des femmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} Selon l'avis majoritaire, le droit de préemption ne s'applique pas à un bain indivisible, et les hanafites l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} Les hommes et les femmes peuvent entrer dans un bain s'ils sont sûrs d'éviter ce qui est interdit, en couvrant l'awrah; certains juristes exigent une couverture complète, une femme peut entrer pour une excuse, et une femme dhimmi est interdite d'entrer avec des femmes musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7325} Il existe des règles d'entrée et de sortie; la pureté de son eau est reconnue par les hanafites et les hanbalites; la récitation du Coran à haute voix y est déconseillée et les salutations y sont déconseillées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} La prière dans un bain public est valable pour la majorité; elle ne l'est pas selon l'avis hanbalite prédominant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} Les écoles divergent quant à savoir si un voleur d'un bain public est condamné à la flagellation, les hanafites faisant la distinction entre le jour et la nuit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} L'article se termine au mot-clé suivant, hamw ⁦(حمو)⁩, à la page 7329."
  tr: "Hamam başlangıçta sıcak suyla yıkanmayı ifade eder, daha sonra ise her türlü suyla yıkanmak için olduğu söylenirdi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7321} Sahih, Maliki ve Şafi'lerdeki Hanafiler, özel bölgeleri açığa çıkarmayan bir hamam inşa etmeyi, satmayı veya kiralamayı kabul ederler. Hanbalılar hamamı kiralamaktan ve satın almaktan, hamamcının kazancından hoşlanmazlar ve kadınların banyoları daha da sevilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7322} Öncelik, çoğunluğa göre bölünemez bir banyoda kurulmaz, ancak Hanefilere göre kurulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7322}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7323} Mahram güvenli ve özel bölgeleri kapattığı sürece erkeklerin ve kadınların banyoya girmesi izinlidir. Bazı hukukçulara göre, kendini örtmek zorunludur, kadınlar bahane ile girebilir ve zimmi kadının Müslüman kadınlarla birlikte girmesi yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7325} Giriş ve çıkış için görgü kuralları içerir ve suyunun saflığı Hanafi ve Hanbali tarafından geçerli kabul edilir. Kur'an'ı yüksek sesle okumayı sevmezler ve orada selamlaşma önerilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7327} ve dua cemaatin çoğunluğu için geçerlidir, ancak Hanbali geleneğine göre geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7328} Hukukçular hırsızın ondan çalınması konusunda farklı görüşlere sahiptir; Hanafiler gece ile gündüzü ayırırken, Malikiler, Şafiiler ve Hanbaliler ayrıntılı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7329} ve giriş şu başlıkla sona erer: \"Hamo\" s. 7329'da."
  id: "Pemandian awalnya merujuk pada mandi dengan air panas, kemudian dikatakan untuk mandi dengan air apa pun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7321} Kaum Hanafi di Sahih, Maliki, dan Shafi'i menganggap diperbolehkan membangun, menjual, atau menyewa pemandian jika tidak memperlihatkan bagian pribadinya. Hanbal tidak suka menyewa dan membelinya, dan tidak menyukai penghasilan tukang mandi, dan mandi wanita bahkan lebih tidak disukai. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7322} Preemption tidak ditetapkan di kamar mandi yang tidak dapat dibagi menurut mayoritas, tetapi ditetapkan menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7323} Pria dan wanita diperbolehkan masuk ke kamar mandi asalkan mahram aman dan menutupi bagian pribadi. Menurut beberapa ahli hukum, wajib menutupi diri, dan wanita boleh masuk dengan alasan, dan wanita dhimmi dilarang masuk bersama wanita Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7325} Ada etiket untuk masuk dan keluar, dan kemurnian airnya dianggap sah oleh Hanafi dan Hanbali. Mereka tidak suka membaca Al-Qur'an dengan lantang di sana, dan salam tidak dianjurkan di sana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7327} dan doa berlaku untuk mayoritas jemaat, tetapi menurut tradisi Hanbali tidak sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7328} Para ahli hukum berbeda pendapat mengenai pencurian pencuri darinya; Hanafi membedakan antara malam dan siang, sementara Maliki, Shafi'i, dan Hanbalis memiliki pendapat rinci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7329} dan entri ini diakhiri dengan judul berikut: \"Hamo\" pada hlm. 7329."
