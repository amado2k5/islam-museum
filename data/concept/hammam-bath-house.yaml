summary:
  ar: "الحمام في الأصل موضع الاستحمام بالماء الحار، ثم قيل للاغتسال بأي ماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} ويرى الحنفية في الصحيح والمالكية والشافعية جواز بناء الحمام وبيعه وإجارته إذا لم يكن فيه كشف للعورة، ويكره الحنابلة إجارته وشراءه، ويكره كسب الحمامي، وحمام النساء أشد كراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} ولا تثبت الشفعة في الحمام الذي لا يقبل القسمة عند الجمهور، وتثبت عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} ويجوز دخول الحمام للرجال والنساء بشرط أمن المحرم ستر العورة، ويجب عند بعض الفقهاء التستر، وتدخل المرأة لعذر، ويمنع الذمية من دخوله مع المسلمات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7325} وفيه آداب في الدخول والخروج، وطهارة ماؤه معتبرة عند الحنفية والحنابلة، ويكره عندهم قراءة القرآن فيه بصوت، ولا يُستحب فيه السلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} وتصح الصلاة فيه عند الجمهور، وفي المعتمد عند الحنابلة لا تصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} ويختلف الفقهاء في قطع السارق منه، فيفرق الحنفية بين الليل والنهار، والمالكية والشافعية والحنابلة لهم تفاصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} ويختم المدخل بالعنوان التالي «حمو» على ص 7329. "
  en: "Hammam is lexically a bath-house with hot water, and later any bathing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} The Hanafis (sound view), Malikis and Shafiis allow building, selling and renting bath-houses without uncovering the awrah; the Hanbalis dislike renting or buying them, and the earnings of a bath-keeper are disliked, the women's bath more so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} Pre-emption does not apply to an indivisible bath according to the majority, and the Hanafis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} Men and women may enter a bath if they are sure of avoiding what is forbidden, covering the awrah; some jurists require full cover, a woman may enter for an excuse, and a dhimmi woman is barred from entering with Muslim women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7325} There are rules of entry and exit, the purity of its water is accepted by the Hanafis and Hanbalis, Quranic recitation aloud there is disliked, and greeting in it is not recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} Prayer in a bath-house is valid for the majority; in the preferred Hanbali view it is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} The schools differ on whether a thief from a bath-house is hand-cut, the Hanafis distinguishing night and day. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} The entry closes at the next headword, hamw (حمو), on p.7329. "
  ur: "حمام اصل میں غسل کی گرم پانی والی جگہ ہے، پھر ہر پانی سے نہانے کے لیے بھی بولا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} حنفیہ کے صحیح قول، مالکیہ اور شافعیہ کے نزدیک حمام بنانا، بیچنا اور کرائے پر دینا جائز ہے جب کھلی ہوئی شرمگاہ نہ ہو؛ حنابلہ اس کا کرایہ اور خرید مکروہ کہتے ہیں، حمامی کی کمائی مکروہ ہے، اور عورتوں کے حمام پر کراہت زیادہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7321} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} جمہور کے نزدیک جو حمام تقسیم قبول نہ کرے اس میں شفعہ ثابت نہیں، جبکہ حنفیہ کے نزدیک ثابت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7322} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} مرد اور عورتیں حمام میں جا سکتے ہیں جب ستر کا خیال ہو؛ بعض فقہاء مکمل ڈھانپنا ضروری کہتے ہیں، عورت عذر سے داخل ہو سکتی ہے، اور ذمی عورت کو مسلمان عورتوں کے ساتھ داخل ہونے سے روکا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7323} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7324} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7325} داخل اور خارج ہونے کے آداب ہیں، حنفیہ اور حنابلہ کے نزدیک اس کا پانی طاہر ہے، وہاں بلند آواز سے قرآن پڑھنا مکروہ ہے، اور وہاں سلام مستحب نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7326} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} جمہور کے نزدیک حمام میں نماز صحیح ہے، جبکہ حنابلہ کے معتمد قول میں صحیح نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7327} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} حمام سے چوری پر ہاتھ کاٹنے میں اختلاف ہے، حنفیہ رات اور دن میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7328} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7329} یہ مدخل p.7329 پر «حمو» کے عنوان پر ختم ہوتا ہے۔ "
