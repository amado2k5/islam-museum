label:
  ar: "الشَّهيد"
  en: "Shahid (martyr: the rank of martyrs, the kinds of martyr, washing and prayer over the dead, the shroud and burial)"
  es: "Shahid (mártir: el rango de los mártires, los tipos de mártires, el lavado y la oración por los muertos, la mortaja y el entierro)"
  fr: "Shahid (martyr: le rang des martyrs, les types de martyrs, la toilette mortuaire et la prière sur les morts, le linceul et l'enterrement)"
  ur: "شاہد ⁦(شہید: شہداء کا درجہ، شہداء کی قسمیں، میت کو غسل دینا اور نماز ادا کرنا، کفن اور تدفین)⁩"
summary:
  ar: "الشهيد في اصطلاح الفقهاء من مات من المسلمين في قتال الكفار وبسببه، ويلحق به في أمور الآخرة أنواع. وله منزلة عالية عند الله ورد فيها القرآن والسنة. وقسمه الفقهاء إلى شهيد الدنيا والآخرة وهو من قتل في قتال مقبلا لتكون كلمة الله هي العليا، وشهيد الآخرة وهو من مات بداء البطن أو الطاعون أو الغرق أو غيرها. ويختلف الفقهاء في غسل شهيد المعركة والصلاة عليه، فيحرم الشافعية والمالكية غسله والصلاة عليه، ويرى الحنفية غسله، والحنابلة يحرمون الغسل، ويدفن في ثيابه بعد نزع آلة الحرب. ويجوز دفن الرجلين في القبر الواحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10250}"
  en: "In the jurists' usage a martyr is a Muslim who dies in fighting the unbelievers or because of it, and some other people are counted with him in matters of the hereafter. His rank with God is high, as the Qur'an and the sunna show. The jurists divide martyrs into the martyr of this world and the next, who dies advancing in battle so that God's word is highest, and the martyr of the next world only, who dies of a bowel disease, plague, drowning or the like. The jurists differ on washing and praying over the martyr of the battlefield: the Shafi'is and Malikis forbid both, the Hanafis require washing, the Hanbalis forbid washing; he is buried in his clothes after the weapons are removed. Two or three may be buried in one grave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10250}"
  es: "En la tradición jurista, un mártir es un musulmán que muere luchando contra los infieles o a causa de ello, y otras personas se cuentan con él en asuntos del más allá. Su rango ante Dios es elevado, como lo demuestran el Corán y la Sunna. Los juristas dividen a los mártires en el mártir de este mundo y del más allá, que muere avanzando en la batalla para que la palabra de Dios sea la más alta, y el mártir del más allá solamente, que muere de una enfermedad intestinal, peste, ahogamiento o similar. Los juristas difieren en cuanto a lavar y rezar por el mártir del campo de batalla: los shafiíes y los malikíes prohíben ambos, los hanafíes exigen el lavado, los hanbalíes lo prohíben; se le entierra con sus ropas después de que se le retiran las armas. Dos o tres pueden ser enterrados en una misma tumba. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10244} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10245} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10246} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10248} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10249} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10250}"
  fr: "Selon les juristes, un martyr est un musulman mort au combat contre les mécréants ou à cause de celui-ci, et dont le sort est lié au sien par celui d'autres personnes dans l'au-delà. Son rang auprès de Dieu est élevé, comme l'attestent le Coran et la Sunna. Les juristes distinguent deux catégories de martyrs: le martyr de ce monde et de l'autre, mort au combat pour que la parole de Dieu triomphe, et le martyr de l'autre monde seulement, mort d'une maladie intestinale, de la peste, de noyade ou d'une autre cause similaire. Les juristes divergent quant aux ablutions et aux prières pour le martyr du champ de bataille: les chaféites et les malikites les interdisent, les hanafites les exigent, les hanbalites les interdisent. Le martyr est enterré vêtu après que ses armes ont été retirées. Deux ou trois martyrs peuvent être inhumés dans une même tombe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10250}"
  ur: "فقہاء کے نزدیک شہید وہ مسلمان ہے جو کافروں سے لڑتے ہوئے یا اس کی وجہ سے مر جائے اور کچھ اور لوگ آخرت کے معاملات میں اس کے ساتھ شمار ہوتے ہیں۔ خدا کے نزدیک اس کا درجہ بلند ہے جیسا کہ قرآن و سنت سے ظاہر ہے۔ فقہاء شہداء کو دنیا اور آخرت کے شہداء میں تقسیم کرتے ہیں، جو جنگ میں آگے بڑھتے ہوئے مرتا ہے تاکہ خدا کا کلام سب سے بلند ہو، اور آخرت کا شہید صرف وہ ہے جو آنتوں کی بیماری، طاعون، ڈوبنے یا اس جیسی بیماری سے مرے۔ فقہا کا میدان جنگ کے شہید پر غسل کرنے اور نماز پڑھنے میں اختلاف ہے: شافعی اور مالکیہ دونوں سے منع کرتے ہیں، حنفیہ غسل واجب کرتے ہیں، حنبلی دھونے سے منع کرتے ہیں۔ ہتھیاروں کو ہٹانے کے بعد اسے اپنے کپڑوں میں دفن کیا جاتا ہے۔ ایک قبر میں دو یا تین دفن ہوسکتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10244} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10245} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10246} p.10248} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10249} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10250}"
