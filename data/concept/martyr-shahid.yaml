id: concept/martyr-shahid
class: concept
kind: legal
label:
  ar: "الشَّهيد"
  en: "Shahid (martyr: the rank of martyrs, the kinds of martyr, washing and prayer over the dead, the shroud and burial)"
summary:
  ar: "الشهيد في اصطلاح الفقهاء من مات من المسلمين في قتال الكفار وبسببه، ويلحق به في أمور الآخرة أنواع. وله منزلة عالية عند الله ورد فيها القرآن والسنة. وقسمه الفقهاء إلى شهيد الدنيا والآخرة وهو من قتل في قتال مقبلا لتكون كلمة الله هي العليا، وشهيد الآخرة وهو من مات بداء البطن أو الطاعون أو الغرق أو غيرها. ويختلف الفقهاء في غسل شهيد المعركة والصلاة عليه، فيحرم الشافعية والمالكية غسله والصلاة عليه، ويرى الحنفية غسله، والحنابلة يحرمون الغسل، ويدفن في ثيابه بعد نزع آلة الحرب. ويجوز دفن الرجلين في القبر الواحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10250}"
  en: "In the jurists' usage a martyr is a Muslim who dies in fighting the unbelievers or because of it, and some other people are counted with him in matters of the hereafter. His rank with God is high, as the Qur'an and the sunna show. The jurists divide martyrs into the martyr of this world and the next, who dies advancing in battle so that God's word is highest, and the martyr of the next world only, who dies of a bowel disease, plague, drowning or the like. The jurists differ on washing and praying over the martyr of the battlefield: the Shafi'is and Malikis forbid both, the Hanafis require washing, the Hanbalis forbid washing; he is buried in his clothes after the weapons are removed. Two or three may be buried in one grave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10244} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10250}"
