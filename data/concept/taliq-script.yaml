id: concept/taliq-script
class: concept
kind: art_form
label: { ar: "خط التعليق", en: "Ta'liq script", ur: "خطِ تعلیق", es: "Escritura Ta'liq", fr: "Écriture Ta'liq" }
summary:
  ar: "خط ديواني معناه «المعلّق»، تطور في إيران منذ أواخر القرن السابع الهجري وانتقل إلى العثمانيين والهند، يتميز بانحدار الحروف النازلة وصعود الكلمات في آخر السطر، واستعمل للمراسيم والوثائق لا للشعر والنصوص الدينية {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  en: "A chancery script whose name means \"hanging\", developed in Iran from the late thirteenth century and spread to Ottoman Turkey and India; marked by exaggerated descenders and words sloping up at line end, it served decrees and documents rather than poetry or religious texts {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  ur: "ایک دفتری خط جس کے معنی «لٹکا ہوا» ہیں، تیرہویں صدی کے آخر سے ایران میں ارتقا پایا اور عثمانیوں اور ہند تک گیا؛ لمبے اترتے حروف اور سطر کے آخر میں چڑھتے الفاظ اس کی پہچان ہیں، اور یہ شاعری یا دینی متون کے بجائے فرامین اور دستاویزات کے لیے تھا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}۔"
  es: "Una escritura cancilleresca cuyo nombre significa \"colgante\", se desarrolló en Irán desde finales del siglo XIII y se extendió a la Turquía otomana y la India; caracterizada por descendentes exagerados y palabras que se inclinan hacia arriba al final de la línea, servía para decretos y documentos más que para poesía o textos religiosos {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  fr: "Une écriture de chancellerie dont le nom signifie « pendaison », développée en Iran à partir de la fin du XIIIe siècle et répandue dans la Turquie ottomane et en Inde; caractérisée par des descendants exagérés et des mots s’inclinant vers le haut à la fin de la ligne, elle servait aux décrets et aux documents plutôt qu’à la poésie ou aux textes religieux {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
