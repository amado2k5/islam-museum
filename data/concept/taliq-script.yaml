summary:
  ar: "خط ديواني معناه «المعلّق»، تطور في إيران منذ أواخر القرن السابع الهجري وانتقل إلى العثمانيين والهند، يتميز بانحدار الحروف النازلة وصعود الكلمات في آخر السطر، واستعمل للمراسيم والوثائق لا للشعر والنصوص الدينية {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  en: "A chancery script whose name means \"hanging\", developed in Iran from the late thirteenth century and spread to Ottoman Turkey and India; marked by exaggerated descenders and words sloping up at line end, it served decrees and documents rather than poetry or religious texts {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  ur: "ایک دفتری خط جس کے معنی «لٹکا ہوا» ہیں، تیرہویں صدی کے آخر سے ایران میں ارتقا پایا اور عثمانیوں اور ہند تک گیا؛ لمبے اترتے حروف اور سطر کے آخر میں چڑھتے الفاظ اس کی پہچان ہیں، اور یہ شاعری یا دینی متون کے بجائے فرامین اور دستاویزات کے لیے تھا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}۔"
