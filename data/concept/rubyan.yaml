summary:
  ar: "الروبيان في الكتاب قال جالينوس إن حاله كحال السرطان، وقال ماسرجويه إنه حار رطب باعتدال قبل أن يملح، وإذا ملح وعتق ولد سوداء وحكة رديئة، وهو يحلل الأورام الصلبة ويغذو غذاء صالحا ويلين البطن ويستفرغ حب القرع، ويذكر الكتاب نقلا موسوما أثره في المني والباه {cite:canon-ibn-sina-print-v1 p.669}"
  en: "Rubyan is in the book, Galen said, in the same state as the crab, and Masarjawayh said it is hot and moist in moderation before it is salted, while salted and aged it engenders black bile and a bad itch; it dissolves hard swellings, nourishes well, softens the belly and drives out the tapeworm; and the book lists, as a labelled report, its effect on semen and desire {cite:canon-ibn-sina-print-v1 p.669}"
  ur: "روبیان کتاب میں ہے؛ جالینوس نے کہا کہ اس کا حال کیکڑے کے حال جیسا ہے، اور ماسرجویہ نے کہا کہ نمک لگانے سے پہلے یہ اعتدال کے ساتھ گرم تر ہے، اور نمک لگا کر پرانا کر دیا جائے تو سودا اور بری کھجلی پیدا کرتا ہے؛ یہ سخت ورموں کو تحلیل کرتا ہے، اچھی غذا دیتا ہے، پیٹ کو نرم کرتا ہے اور کدو دانے کو نکالتا ہے؛ اور کتاب منقول فہرست کے طور پر اس کا اثر منی اور باہ پر درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.669}۔"
