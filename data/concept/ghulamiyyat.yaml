summary:
  ar: "الجواري المقدودات اللواتي اتخذتهن أم جعفر زبيدة لما رأت شغف ولدها الأمين بالخدم فعممت رؤوسهن وجعلت لهن الطرر والأصداغ والأقفية وألبستهن الأقبية والقراطق والمناطق حتى اشتبهن بالغلمان، فاتخذ الناس مثلهن وسموهن الغلاميات كما عند المسعودي {cite:muruj-al-dhahab p. 671-672}."
  en: "The boy-lookalike maids — cropped, turbaned and belted like lads — whom Zubayda dressed for al-Amin, a court fashion that spread to high and low and took the name ghulamiyyat {cite:muruj-al-dhahab p. 671-672}."
