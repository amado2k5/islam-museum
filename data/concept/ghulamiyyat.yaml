label: { ar: "الغلاميات", en: "The ghulamiyyat fashion", es: "La moda ghulamiyyat", fr: "La mode ghulamiyyat", ur: "غلامی کا فیشن", tr: "köleler", id: "budak" }
summary:
  ar: "الجواري المقدودات اللواتي اتخذتهن أم جعفر زبيدة لما رأت شغف ولدها الأمين بالخدم فعممت رؤوسهن وجعلت لهن الطرر والأصداغ والأقفية وألبستهن الأقبية والقراطق والمناطق حتى اشتبهن بالغلمان، فاتخذ الناس مثلهن وسموهن الغلاميات كما عند المسعودي {cite:muruj-al-dhahab p. 671-672}."
  en: "The boy-lookalike maids — cropped, turbaned and belted like lads — whom Zubayda dressed for al-Amin, a court fashion that spread to high and low and took the name ghulamiyyat {cite:muruj-al-dhahab p. 671-672}."
  es: "Las criadas con aspecto de muchachos —con el pelo corto, turbantes y cinturones como los jóvenes— a quienes Zubayda vestía para al-Amin, una moda cortesana que se extendió a las clases altas y bajas y tomó el nombre de ghulamiyyat {cite:muruj-al-dhahab p. 671-672}."
  fr: "Les servantes à l'allure de garçons — les cheveux coupés courts, coiffées d'un turban et ceinturées comme des garçons — que Zubayda habillait pour al-Amin, une mode de cour qui s'est répandue dans les hautes et basses sphères et a pris le nom de ghulamiyyat {cite:muruj-al-dhahab p. 671-672}."
  ur: "لڑکوں جیسی نظر آنے والی نوکرانیاں — کٹے ہوئے، پگڑیوں والے اور لڑکوں کی طرح پٹی باندھے ہوئے — جنہیں زبیدہ نے الامین کے لیے لباس پہنایا، یہ ایک عدالتی فیشن ہے جو اونچ نیچ تک پھیل گیا اور غلامی کا نام لیا {حوالہ: مروج الذہب ص۔ 671-672}۔"
  tr: "Um Ca'far Zubaida'nın güvenilir oğlunun hizmetçilere olan tutkusunu görünce aldığı makdud köle kızları, başlarını bağladı ve tarar, eyer ve kelepçe giydirdi, bodrumlarda, qarataqlarda ve alanlarda giydirdi, ta ki hizmetçilerle karışana kadar. İnsanlar onların hoşuna gidip onları köle olarak adlandırdı, el-Mas'udi de yazdı {cite:muruj-al-dhahab, s. 671-672}."
  id: "Para gadis budak maqdood yang diambil um Ja'far Zubaida ketika melihat kecintaan putranya yang dapat dipercaya terhadap pelayan, maka dia mengikat kepala mereka dan mengenakan tayar, pelana, dan borgol, memakaikan mereka di ruang bawah tanah, qarataq, dan area sampai mereka bingung dengan pelayan. Orang-orang mengambil suka mereka dan menyebut mereka budak seperti yang ditulis al-Mas'udi {cite:muruj-al-dhahab, hlm. 671-672}."
