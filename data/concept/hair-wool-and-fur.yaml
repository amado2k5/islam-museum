id: concept/hair-wool-and-fur
class: concept
kind: legal
label:
  ar: "الشَّعْر والصُّوف والوَبَر"
  en: "Hair, wool and fur (their purity, the rules for the dead, washing, adornment and sale)"
summary:
  ar: "الشعر والصوف والوبر أجزاء تنبت على الإنسان والحيوان، وتتعلق بها أحكام الطهارة والنجاسة، فشعر الإنسان طاهر حيا وميتا، ولا يجوز الانتفاع به بيعا أو استعمالا لكرامة الآدمي، وشعر الحيوان المأكول المجزوز حال حياته طاهر بالإجماع. ومن أحكام الحي غسل الشعر في الجنابة، ونقض ضفائر المرأة عند الجمهور بالوصول إلى الأصول، وحرم وصل الشعر بشعر نجس أو آدمي. ويكره عقص الشعر في الصلاة، ويستحب ترجيله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10081} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10083}"
  en: "Hair, wool and fur are parts that grow on people and animals, and the rules of purity and impurity apply to them. A person's hair is pure, living or dead, and may not be sold or used, because the human being is honoured. The hair of a permitted animal, shorn while it lives, is pure by consensus. Among the rules for the living: the hair must be washed in the major ritual bath, and most jurists require a woman to unbraid her plaits only if the water cannot reach the roots otherwise; joining hair with impure or human hair is forbidden. Tying the hair up in prayer is disliked, and combing it is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10081} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10083}"
