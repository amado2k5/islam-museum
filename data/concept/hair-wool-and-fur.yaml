id: concept/hair-wool-and-fur
class: concept
kind: legal
label:
  ar: "الشَّعْر والصُّوف والوَبَر"
  en: "Hair, wool and fur (their purity, the rules for the dead, washing, adornment and sale)"
  es: "Cabello, lana y pieles (su pureza, las normas para los muertos, el lavado, el adorno y la venta)"
  fr: "Cheveux, laine et fourrure (leur pureté, les règles pour les morts, le lavage, la parure et la vente)"
summary:
  ar: "الشعر والصوف والوبر أجزاء تنبت على الإنسان والحيوان، وتتعلق بها أحكام الطهارة والنجاسة، فشعر الإنسان طاهر حيا وميتا، ولا يجوز الانتفاع به بيعا أو استعمالا لكرامة الآدمي، وشعر الحيوان المأكول المجزوز حال حياته طاهر بالإجماع. ومن أحكام الحي غسل الشعر في الجنابة، ونقض ضفائر المرأة عند الجمهور بالوصول إلى الأصول، وحرم وصل الشعر بشعر نجس أو آدمي. ويكره عقص الشعر في الصلاة، ويستحب ترجيله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10081} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10083}"
  en: "Hair, wool and fur are parts that grow on people and animals, and the rules of purity and impurity apply to them. A person's hair is pure, living or dead, and may not be sold or used, because the human being is honoured. The hair of a permitted animal, shorn while it lives, is pure by consensus. Among the rules for the living: the hair must be washed in the major ritual bath, and most jurists require a woman to unbraid her plaits only if the water cannot reach the roots otherwise; joining hair with impure or human hair is forbidden. Tying the hair up in prayer is disliked, and combing it is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10081} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10083}"
  es: "El cabello, la lana y el pelaje son partes que crecen en personas y animales, y se rigen por las normas de pureza e impureza. El cabello de una persona es puro, viva o muerta, y no puede venderse ni utilizarse, pues se honra al ser humano. El pelo de un animal permitido, esquilado en vida, se considera puro por consenso. Entre las normas para los vivos: el cabello debe lavarse en el baño ritual principal, y la mayoría de los juristas exigen que una mujer se deshaga las trenzas solo si el agua no puede llegar a las raíces de otra manera; está prohibido unir el cabello con cabello impuro o humano. Se desaconseja recoger el cabello durante la oración, y se recomienda peinarlo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10074} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10081} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10083}"
  fr: "Cheveux, laine et fourrure sont des parties du corps des humains et des animaux, et les règles de pureté et d'impureté s'appliquent à eux. Les cheveux d'une personne sont purs, qu'elle soit vivante ou morte, et ne peuvent être ni vendus ni utilisés, car l'être humain est honoré. Les poils d'un animal autorisé, tondus de son vivant, sont considérés comme purs. Parmi les règles concernant les vivants: les cheveux doivent être lavés lors du grand bain rituel, et la plupart des juristes exigent qu'une femme ne défasse ses tresses que si l'eau ne peut atteindre les racines autrement; il est interdit de mêler ses cheveux à des cheveux impurs ou humains. Il est déconseillé d'attacher ses cheveux pour prier, et il est recommandé de les peigner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10081} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10083}"
