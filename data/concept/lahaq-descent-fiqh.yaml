id: concept/lahaq-descent-fiqh
class: concept
kind: legal
label:
  ar: "اللَّحاق"
  en: "Attachment of descent (lahaq), fiqh rulings"
  ur: "لحاق (نسب کا ملحق ہونا)"
summary:
  ar: "اللحاق في اللغة الإدراك؛ يقال لحِقه أي أدركه، وألحق القائف الولد بأبيه: أخبر بأنه ابنه لشبه يظهر له؛ واستلحقه: ادّعاه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}. والاستلحاق اصطلاحاً ادعاء رجل أنه أب لهذا الولد، وهو أخص من اللحاق الذي يكون في النسب وغيره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}."
  en: "Lahaq, in lexicon, is reaching or attaining; a physiognomist attaches a child to its father by saying it is his son from a resemblance he sees; istilhaq is claiming a child, a narrower term {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}. In law, istilhaq is a man's claim that he is the father of this child {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}."
  ur: "لحاق لغت میں ادراک کو کہتے ہیں؛ کہا جاتا ہے لحقہ یعنی اس کو پا لیا۔ قائف نے بچے کو باپ کے ساتھ ملایا یعنی اس نے ایسی مشابہت کی بنا پر بتایا کہ یہ اس کا بیٹا ہے؛ اور استلحاق کا مطلب دعویٰ کرنا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}۔ اصطلاح میں استلحاق یہ ہے کہ آدمی دعویٰ کرے کہ یہ بچہ اس کا باپ ہے، اور یہ لحاق سے خاص ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}۔"
