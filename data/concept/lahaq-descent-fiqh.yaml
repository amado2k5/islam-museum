id: concept/lahaq-descent-fiqh
class: concept
kind: legal
label:
  ar: "اللَّحاق"
  en: "Attachment of descent (lahaq), fiqh rulings"
  ur: "لحاق ⁦(نسب کا ملحق ہونا)⁩"
  es: "Adjunto de ascendencia (lahaq), sentencias fiqh"
  fr: "Attachement de descendance (lahaq), décisions du fiqh"
  tr: "yetişmek"
  id: "mengejar ketertinggalan"
summary:
  ar: "اللحاق في اللغة الإدراك؛ يقال لحِقه أي أدركه، وألحق القائف الولد بأبيه: أخبر بأنه ابنه لشبه يظهر له؛ واستلحقه: ادّعاه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}. والاستلحاق اصطلاحاً ادعاء رجل أنه أب لهذا الولد، وهو أخص من اللحاق الذي يكون في النسب وغيره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}."
  en: "Lahaq, in lexicon, is reaching or attaining; a physiognomist attaches a child to its father by saying it is his son from a resemblance he sees; istilhaq is claiming a child, a narrower term {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}. In law, istilhaq is a man's claim that he is the father of this child {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}."
  ur: "لحاق لغت میں ادراک کو کہتے ہیں؛ کہا جاتا ہے لحقہ یعنی اس کو پا لیا۔ قائف نے بچے کو باپ کے ساتھ ملایا یعنی اس نے ایسی مشابہت کی بنا پر بتایا کہ یہ اس کا بیٹا ہے؛ اور استلحاق کا مطلب دعویٰ کرنا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}۔ اصطلاح میں استلحاق یہ ہے کہ آدمی دعویٰ کرے کہ یہ بچہ اس کا باپ ہے، اور یہ لحاق سے خاص ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}۔"
  es: "Lahaq, en léxico, es alcanzar o lograr; un fisonomista vincula a un niño con su padre diciendo que es su hijo por un parecido que ve; istilhaq es reclamar a un niño, un término más restringido {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}. En derecho, istilhaq es la afirmación de un hombre de que es el padre de este niño {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}."
  fr: "Le terme « lahaq », dans le vocabulaire, signifie atteindre ou obtenir; un physiognomoniste rattache un enfant à son père en affirmant qu'il est son fils d'après une ressemblance qu'il perçoit; « istilhaq » désigne la revendication d'un enfant, un terme plus précis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}. En droit, « istilhaq » est la revendication par un homme d'être le père de cet enfant {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13575}."
  tr: "Dilde 'al-laḥāq' algı anlamına gelir; 'laqqāh' denir, yani onu algılamıştır. 'al-al-lad' kafiyesi, babasının çocuğu tarafından doğduğu çocuğa atıfta bulunur: kendisine benzerlik gösterdiği için oğlu olduğunu bildirmiştir; ve 'istlaḥāh' onun iddiasını ifade eder {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13575}. Teknik olarak, 'al-istihāq', bir erkeğin bu çocuğun babası olduğunu iddia etmesidir; bu, soy ve diğer konularda geçen 'al-haqāq'dan daha özgüldür {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13575}."
  id: "Dalam bahasa, 'al-laḥāq' berarti persepsi; dikatakan 'laqqāh,' yang berarti dia melihatnya. Rima 'al-al-lad' merujuk pada anak dari ayahnya: dia memberitahu bahwa dia adalah anaknya karena kemiripan yang muncul baginya; dan 'istlaḥāh' berarti klaimnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13575}. Secara teknis, 'al-istihāq' adalah klaim seorang pria sebagai ayah dari anak ini, yang lebih spesifik daripada 'al-haqāq' yang muncul dalam garis keturunan dan hal-hal lain {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13575}."
