id: concept/canon-abnormal-sediment-kinds
class: concept
kind: scientific
label:
  ar: "أنواع الرسوب غير الطبيعي عند ابن سينا"
  en: "The kinds of unnatural sediment in the Canon"
  fr: "Types de sédiments non naturels dans le Canon"
  ur: "غیر فطری تلچھٹ کی قسمیں قانون میں"
  es: "Los tipos de sedimentos artificiales en el Cañón"
  tr: "İbn Sina'ya göre Anormal Birikinti Türleri"
  id: "Jenis-jenis deposisi abnormal menurut Avicenna"
summary:
  ar: "يعدد ابن سينا أنواع الرسوب غير الطبيعي: الخراطي النخالي والكرسني والدشيشي، واللحمي والدسمي والمدي والمخاطي، وما يشبه قطع الخمير، والدموي العلقي والشعري والرملي الحصوي والرمادي. {cite:canon-ibn-sina-print-v1 pp.193-194}."
  en: "Ibn Sina lists the kinds of unnatural sediment: the scraped, bran-like, vetch-like and gruel-like; the fleshy, greasy, pus-like and mucous; that like bits of soaked leaven; and the clotted, hairlike, sandy-gravelly and ashen. {cite:canon-ibn-sina-print-v1 pp.193-194}."
  fr: "Ibn Sina énumère les sédiments non naturels : raclés, semblables au son, à la vesce ou à la bouillie ; charnus, graisseux, purulents ou muqueux ; semblables à des fragments de levain trempé ; coagulés, capillaires, sableux et graveleux, ou cendreux. {cite:canon-ibn-sina-print-v1 pp.193-194}."
  es: "Ibn Sina enumera los tipos de sedimentos artificiales: raspados, parecidos al salvado, a la veza y a las gachas; carnosos, grasientos, purulentos y mucosos; semejantes a trozos de levadura remojada; y coagulados, parecidos a cabellos, arenosos y cenicientos. {cite:canon-ibn-sina-print-v1 pp.193-194}."
  ur: "ابن سینا نے غیر فطری تلچھٹ کی اقسام کی فہرست دی ہے: کھرچنے والے، چوکر نما، ویچ نما اور دانے کی طرح؛ مانسل، چکنائی، پیپ کی طرح اور چپچپا؛ جو بھیگے ہوئے خمیر کے ٹکڑوں کی طرح۔ اور جما ہوا، بالوں جیسا، ریتیلی بجری اور راکھ۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 193-194}۔"
  tr: "İbn Sina, anormal birikinti türlerini listeler: palmiye tornası, karsni, dashishi, etli, al-dasami, madi, mukoz, maya parçalarına benzeyen, kan-leopar, tüylü, çakıllı kumlu ve gri. {cite:canon-ibn-sina-print-v1 s.193-194}."
  id: "Ibn Sina mencantumkan jenis endapan abnormal: mesin bubut palem, karsni, dashishi, daging, al-dasami, madi, lendir, yang mirip potongan ragi, macan tutul darah, berbulu, berpasir kerikil, dan abu-abu. {cite:canon-ibn-sina-print-v1 hlm.193-194}."
