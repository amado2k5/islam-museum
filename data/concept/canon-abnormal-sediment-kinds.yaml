summary:
  ar: "يعدد ابن سينا أنواع الرسوب غير الطبيعي: الخراطي النخالي والكرسني والدشيشي، واللحمي والدسمي والمدي والمخاطي، وما يشبه قطع الخمير، والدموي العلقي والشعري والرملي الحصوي والرمادي. {cite:canon-ibn-sina-print-v1 pp.193-194}."
  en: "Ibn Sina lists the kinds of unnatural sediment: the scraped, bran-like, vetch-like and gruel-like; the fleshy, greasy, pus-like and mucous; that like bits of soaked leaven; and the clotted, hairlike, sandy-gravelly and ashen. {cite:canon-ibn-sina-print-v1 pp.193-194}."
