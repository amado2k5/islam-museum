id: concept/aqiqa
class: concept
kind: ritual
label:
  ar: "العَقِيقَة"
  en: "The sacrifice for a newborn (aqiqa): its ruling, age, animals and manner"
  ur: "عقیقہ (نومولود کی طرف سے ذبیحہ)"
summary:
  ar: "العقيقة في اللغة الشعر الذي يولد به المولود، وتطلق على الذبيحة التي تذبح عن المولود، وفي الاصطلاح ما يذكى عن المولود شكراً لله تعالى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783}. وهي مختلفة عن الأضحية في وقتها ومكانها وغايتها، فالعقيقة تذبح بولادة المولود في أي وقت، والأضحية في أيام النحر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. وهي سنة مؤكدة عند الشافعية والحنابلة، ومستحبة عند المالكية، وأباحها الحنفية تطوعاً بنية الشكر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. وتطلب من الأب الموسر عند الشافعية، وتشرع عن الأنثى كما تشرع عن الذكر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. ووقتها اليوم السابع عند الحنفية والمالكية، ويبدأ عند الشافعية والحنابلة من تمام انفصال المولود، وتجزئ عند الشافعية والحنابلة من الأنعام، ويعق عن الذكر شاتان وعن الأنثى شاة عند الشافعية والحنابلة، وعند الحنفية والمالكية شاة عن كل منهما {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}. ويستحب أن تطبخ ولا يكسر منها عظم، ويؤكل منها ويهدى ويتصدق، وتذبح مع التسمية والدعاء المأثور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}."
  en: "In the lexicon, aqiqa is the hair a child is born with, and it names the animal sacrificed for a newborn; as a term it is what is slaughtered for a newborn in thanks to God {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783}. It differs from the festival sacrifice in its time and place: it is slaughtered when the child is born, at any time of the year, whereas the sacrifice is made on the days of sacrifice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. The Shafi'is and Hanbalis hold it a confirmed sunna and the Malikis recommended; the Hanafis allow it as a voluntary act in thanks {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. The Shafi'is ask it from a father who can afford it, and the majority hold it for a girl as well as a boy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. The Hanafis and Malikis fix the time at the seventh day, while the Shafi'is and Hanbalis count from the child's complete birth; the Shafi'is and Hanbalis require livestock, two sheep for a boy and one for a girl, while the Hanafis and Malikis give one for each {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}. It is recommended to cook it without breaking its bones, eat from it, give it as gifts and charity, and to pronounce the reported formula at slaughter {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}."
