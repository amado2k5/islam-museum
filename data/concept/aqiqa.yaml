id: concept/aqiqa
class: concept
kind: legal
label:
  ar: "العَقِيقَة"
  en: "The sacrifice for a newborn (aqiqa): its ruling, age, animals and manner"
  fr: "Le sacrifice pour un nouveau-né (aqiqa) : statut, âge, animaux et modalités"
  ur: "عقیقہ ⁦(نومولود کی طرف سے ذبیحہ)⁩"
  es: "El sacrificio para un recién nacido (aqiqa): su regla, edad, animales y forma"
summary:
  ar: "العقيقة في اللغة الشعر الذي يولد به المولود، وتطلق على الذبيحة التي تذبح عن المولود، وفي الاصطلاح ما يذكى عن المولود شكراً لله تعالى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783}. وهي مختلفة عن الأضحية في وقتها ومكانها وغايتها، فالعقيقة تذبح بولادة المولود في أي وقت، والأضحية في أيام النحر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. وهي سنة مؤكدة عند الشافعية والحنابلة، ومستحبة عند المالكية، وأباحها الحنفية تطوعاً بنية الشكر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. وتطلب من الأب الموسر عند الشافعية، وتشرع عن الأنثى كما تشرع عن الذكر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. ووقتها اليوم السابع عند الحنفية والمالكية، ويبدأ عند الشافعية والحنابلة من تمام انفصال المولود، وتجزئ عند الشافعية والحنابلة من الأنعام، ويعق عن الذكر شاتان وعن الأنثى شاة عند الشافعية والحنابلة، وعند الحنفية والمالكية شاة عن كل منهما {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}. ويستحب أن تطبخ ولا يكسر منها عظم، ويؤكل منها ويهدى ويتصدق، وتذبح مع التسمية والدعاء المأثور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}."
  en: "In the lexicon, aqiqa is the hair a child is born with, and it names the animal sacrificed for a newborn; as a term it is what is slaughtered for a newborn in thanks to God {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783}. It differs from the festival sacrifice in its time and place: it is slaughtered when the child is born, at any time of the year, whereas the sacrifice is made on the days of sacrifice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. The Shafi'is and Hanbalis hold it a confirmed sunna and the Malikis recommended; the Hanafis allow it as a voluntary act in thanks {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. The Shafi'is ask it from a father who can afford it, and the majority hold it for a girl as well as a boy {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. The Hanafis and Malikis fix the time at the seventh day, while the Shafi'is and Hanbalis count from the child's complete birth; the Shafi'is and Hanbalis require livestock, two sheep for a boy and one for a girl, while the Hanafis and Malikis give one for each {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}. It is recommended to cook it without breaking its bones, eat from it, give it as gifts and charity, and to pronounce the reported formula at slaughter {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}."
  fr: "Dans le lexique, aqiqa désigne les cheveux avec lesquels un enfant naît, ainsi que l’animal sacrifié pour un nouveau-né ; au sens technique, c’est ce qui est immolé pour un nouveau-né en remerciement à Dieu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783}. Elle diffère du sacrifice de la fête par son moment et son lieu : elle est immolée à la naissance de l’enfant, à tout moment de l’année, tandis que le sacrifice est accompli pendant les jours du sacrifice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. Les shafiites et les hanbalites la tiennent pour une sunna confirmée et les malikites pour recommandée ; les hanafites l’autorisent comme acte volontaire de remerciement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. Les shafiites la demandent au père qui en a les moyens, et la majorité la retient pour une fille comme pour un garçon {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. Les hanafites et les malikites la fixent au septième jour, tandis que les shafiites et les hanbalites comptent à partir de la naissance complète de l’enfant ; les shafiites et les hanbalites exigent du bétail, deux moutons pour un garçon et un pour une fille, tandis que les hanafites et les malikites en prévoient un pour chacun {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}. Il est recommandé de la cuire sans en briser les os, d’en manger, d’en distribuer en cadeaux et en aumône, et de prononcer la formule rapportée lors de l’abattage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}."
  es: "En el léxico, aqiqa es el cabello con el que nace un niño, y nombra al animal sacrificado para un recién nacido; como término es lo que se sacrifica para un recién nacido en agradecimiento a Dios {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783}. Se diferencia del sacrificio festivo en su tiempo y lugar: se sacrifica cuando nace el niño, en cualquier época del año, mientras que el sacrificio se realiza en los días del sacrificio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. Los shafi'is y hanbalis lo consideran una sunna confirmada y los malikíes lo recomiendan; Los hanafíes lo permiten como un acto voluntario de agradecimiento {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. Los shafi'ís lo piden a un padre que pueda costearlo, y la mayoría lo mantiene tanto para una niña como para un niño {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11784}. Los hanafíes y malikíes fijan el tiempo en el séptimo día, mientras que los shafi'ís y hanbalíes cuentan desde el nacimiento completo del niño; Los shafiíes y hanbalíes requieren ganado, dos ovejas para un niño y una para una niña, mientras que los hanafíes y malikíes dan una para cada uno {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}. Se recomienda cocinarlo sin romperle los huesos, comer de él, darlo como regalo y caridad, y pronunciar la fórmula reportada en el sacrificio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11787}."
