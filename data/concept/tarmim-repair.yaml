label:
  ar: "الترميم"
  en: "Tarmim (repair of endowed property, rented property and pledged property)"
  ur: "ترمیم (وقف، کرایہ اور رہن کی مرمت)"
summary:
  ar: "الترميم الإصلاح، ويرد في الوقف والإجارة والرهن: فالوقف يُرمم من غلته عند الحنفية والمالكية والشافعية، وعند الحنابلة يرجع إلى شرط الواقف. وفي الإجارة تكون عمارة الدار على المؤجر عند الحنفية والشافعية والحنابلة. وفي الرهن تكون النفقة على الراهن لبقاء الرهن، وما لحفظه على المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5002}"
  en: "Tarmim is repair. It arises for endowed property, rented property and pledged property. For an endowment the Hanafis, Malikis and Shafi'is repair from its income; the Hanbalis follow the founder's stipulation. In a lease the landlord repairs the building according to the Hanafis, Shafi'is and Hanbalis. In a pledge the pledgor pays for keeping the pledge, and the pledgee pays for guarding it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5002}"
