id: concept/tarmim-repair
class: concept
kind: legal
label:
  ar: "الترميم"
  en: "Tarmim (repair of endowed property, rented property and pledged property)"
  ur: "ترمیم ⁦(وقف، کرایہ اور رہن کی مرمت)⁩"
  es: "Tarmim (reparación de bienes legados, bienes arrendados y bienes pignorados)"
  fr: "Tarmim (réparation des biens en dot, des biens loués et des biens mis en gage)"
  tr: "Restorasyon"
  id: "Restorasi"
summary:
  ar: "الترميم الإصلاح، ويرد في الوقف والإجارة والرهن: فالوقف يُرمم من غلته عند الحنفية والمالكية والشافعية، وعند الحنابلة يرجع إلى شرط الواقف. وفي الإجارة تكون عمارة الدار على المؤجر عند الحنفية والشافعية والحنابلة. وفي الرهن تكون النفقة على الراهن لبقاء الرهن، وما لحفظه على المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5002}"
  en: "Tarmim is repair. It arises for endowed property, rented property and pledged property. For an endowment the Hanafis, Malikis and Shafi'is repair from its income; the Hanbalis follow the founder's stipulation. In a lease the landlord repairs the building according to the Hanafis, Shafi'is and Hanbalis. In a pledge the pledgor pays for keeping the pledge, and the pledgee pays for guarding it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5002}"
  es: "Tarmim significa reparación. Surge para bienes donados, arrendados y pignorados. En el caso de una donación, los hanafíes, malikíes y shafiíes realizan las reparaciones con sus ingresos; los hanbalíes siguen la estipulación del fundador. En un arrendamiento, el arrendador repara el edificio según los hanafíes, shafiíes y hanbalíes. En una prenda, el deudor paga por la custodia de la prenda y el acreedor paga por su protección. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4998} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4999} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5000} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5001} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5002}"
  fr: "Tarmim signifie réparation. Ce terme s'applique aux biens en dot, aux biens loués et aux biens mis en gage. Pour une dot, les écoles hanafite, malikite et chaféite financent les réparations sur les revenus qui en découlent; l'école hanbalite suit les stipulations du fondateur. Dans le cadre d'un bail, le bailleur effectue les réparations du bâtiment selon les écoles hanafite, chaféite et hanbalite. Dans le cadre d'un gage, le constituant paie pour la garde du bien et le créancier gagiste paie pour sa surveillance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5002}"
  ur: "ترمیم مرمت کر رہی ہے۔ یہ وقف شدہ جائیداد، کرائے کی جائیداد اور گروی رکھی ہوئی جائیداد کے لیے پیدا ہوتا ہے۔ اوقاف کے لیے حنفیہ، مالکی اور شافعی اس کی آمدنی سے مرمت کرتے ہیں۔ حنبلی بانی کے حکم پر عمل کرتے ہیں۔ کرایہ پر مالک مکان احناف، شافعیہ اور حنبلیوں کے مطابق عمارت کی مرمت کرتا ہے۔ ایک عہد میں گروی رکھنے والا عہد رکھنے کے لیے ادائیگی کرتا ہے، اور گروی رکھنے والا اس کی حفاظت کے لیے ادائیگی کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4998} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4999} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5000} صفحہ 5001} {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 5002}"
  tr: "Yenileme onarımdır. Vakıf, kira ve ipotek sistemlerinde görünür: vakıf, Hanefi, Maliki ve Şafii mezhebine göre gelirinden geri kazanılırken, Hanbali'lere göre hediyenin durumuna bağlıdır. Kira sözleşmesinde, evin inşası Hanefi, Şafii ve Hanelilere göre kiracıya aittir. İpotekte ise ipotek için ipotek sorumlusuna ve ipotek sahibi üzerinde kalan ipotek sorumlusuna aittir. {atıf:) fiqh-mawsua-kuwaitiyya-noor-v3 s.4998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5002}"
  id: "Renovasi adalah perbaikan. Dana ini tercantum dalam endowment, sewa, dan hipotek: endowment dipulihkan dari hasil berdasarkan aliran Hanafi, Maliki, dan Shafi'i, sedangkan menurut Hanbalis tergantung pada kondisi pemberi wakaf. Dalam hak sewa, pembangunan rumah dilakukan oleh penyewa sesuai dengan Hanafi, Shafi'i, dan Hanbali. Dalam hipotek, pemeliharaan ada pada penagih hipotek yang tersisa dan apa yang harus dipertahankan pada pemegang hipotek. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5000} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5002}"
