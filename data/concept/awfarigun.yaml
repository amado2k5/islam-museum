label:
  ar: "أوفاريقون"
  en: "Awfariqun (called the Roman dadi)"
  fr: "Awfariqun (appelé le dadi romain)"
  ur: "اوفاریقون ⁦(رومی دادی)⁩"
  es: "Awfariqun (llamado el dadi romano)"
  tr: "Ofarikon"
  id: "Ofarikon"
summary:
  ar: "تفسيره الدادي الرومي {cite:canon-ibn-sina-print-v1 p.380}. يدرّ البول، ويدرّ الطمث احتمالاً؛ وتذكر الكتب أن شربه في مدة أربعين يوماً يبرئ عرق النسا، وأن بزره يذهب حمى الربع {cite:canon-ibn-sina-print-v1 p.381}."
  en: "The book explains its name as the Roman dadi {cite:canon-ibn-sina-print-v1 p.380}. The book says it moves urine and, moderately, the menses; that drinking it over forty days cures sciatica; and that its seed removes quartan fever {cite:canon-ibn-sina-print-v1 p.381}. The menses report is kept as the book's listing and logged for the founder's ruling."
  fr: "Le livre explique son nom comme le dadi romain {cite:canon-ibn-sina-print-v1 p.380}. Il dit qu’il fait couler l’urine et, modérément, les règles ; que le boire pendant quarante jours guérit la sciatique ; et que sa graine fait disparaître la fièvre quarte {cite:canon-ibn-sina-print-v1 p.381}. Le propos sur les règles est conservé comme une énumération du livre, consignée en attente de la décision du fondateur."
  ur: "کتاب اس کی تفسیر رومی دادی بتاتی ہے {cite:canon-ibn-sina-print-v1 p.380}۔ کتاب کے مطابق یہ پیشاب لاتی ہے اور حد اعتدال میں حیض بھی لاتی ہے؛ چالیس دن پینے سے عرق النسا ٹھیک ہوتا ہے، اور اس کا بیج ربع کے بخار کو دور کرتا ہے {cite:canon-ibn-sina-print-v1 p.381}۔ حیض والی بات کتاب کی فہرست کے طور پر درج ہے اور فیصلے کے لیے لاگ میں ہے۔"
  es: "El libro explica su nombre como dadi romano {cite:canon-ibn-sina-print-v1 p.380}. El libro dice que regula la micción y, moderadamente, la menstruación; que beberlo durante cuarenta días cura la ciática; y que su semilla elimina la fiebre cuartana {cite:canon-ibn-sina-print-v1 p.381}. El informe sobre la menstruación se conserva como una lista del libro y se registra para la decisión del fundador."
  tr: "Onun yorumu Roma Dadaist'i {cite:canon-ibn-sina-print-v1 s.380}. Diüreziye neden olur ve muhtemelen adet dönemine neden olur; kitaplar, kırk gün içinde içilmenin siyatikleri iyileştirdiğini, tohumunun ise çeyrek ateşi iyileştirdiğini belirtir {cite:canon-ibn-sina-print-v1 s.381}."
  id: "Interpretasinya adalah Dadais Romawi {cite:canon-ibn-sina-print-v1 hlm.380}. Ia menyebabkan diuresis dan mungkin menyebabkan menstruasi; buku-buku menyebutkan bahwa meminumnya dalam waktu empat puluh hari dapat menyembuhkan sciatica, dan benihnya menyembuhkan demam di kawasan {cite:canon-ibn-sina-print-v1 hlm.381}."
