id: concept/al-ghass-bi-al-taam
class: concept
kind: scientific
label:
  ar: "الغصّ بالطعام"
  en: "Choking on food"
  fr: "L’étouffement par des aliments"
  ur: "خوراک میں گھٹن"
  es: "Atragantarse con la comida"
  tr: "yiyecek ıslatma"
  id: "merendam makanan"
summary:
  ar: "الغصّ بالطعام وما يجري مجراه إذا نشب شيء له حجم يجب أن يبدأ فيلكم العنق وما بين الكتفين ضرباً بعد ضرب فإن لم يغن أعين بالقيء وربما كان في ذلك خطر ⁦(محمول على أنه وصف الكتاب لا عملية)⁩ {cite:canon-ibn-sina-print-v2 p.285}"
  en: "Choking on food and what runs its course: if a body of some bulk sticks fast, one must begin by cuffing the neck and what is between the shoulders, strike after strike; if that does not avail, he is helped by vomiting — and there may be danger in that (carried as the book's description, not a procedure) {cite:canon-ibn-sina-print-v2 p.285}"
  fr: "L’étouffement par des aliments et les cas analogues : lorsqu’un corps assez volumineux reste coincé, le Canon décrit des coups répétés au cou et entre les épaules puis, si cela reste sans effet, le recours au vomissement, dont il signale le danger possible. Il s’agit d’un récit du livre, non d’une marche à suivre {cite:canon-ibn-sina-print-v2 p.285}."
  ur: "خوراک میں گھٹن اور اس جنس کی چیز: اگر حجم والی کوئی چیز پھنس جائے تو آغاز گردن اور دونوں کندھوں کے درمیان تھپکیاں دینے سے ہونا چاہیے، ایک کے بعد ایک؛ اگر وہ نہ سودا کرے تو قے سے مدد لی جاتی ہے اور اس میں خطر بھی ہو سکتا ہے ⁦(کتاب کے وصف پر محمول، طریقہ نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.285}"
  es: "Atragantarse con la comida y lo que sigue su curso: si un cuerpo de cierta corpulencia se atasca, hay que empezar por golpear el cuello y lo que hay entre los hombros, golpe tras golpe; si eso no funciona, se le puede ayudar vomitando —y puede haber peligro en ello— (se incluye como descripción del libro, no como procedimiento) {cite:canon-ibn-sina-print-v2 p.285}"
  tr: "Yiyecek doldurma ve akan su: Büyük bir şey patlarsa, boyun ve omuzlar birer birer yumruklanmalıdır. Gözler kusmaya neden olmazsa ve bu tehlikeli olabilir (kitabın tanımı olarak alınır, bir süreç olarak değil) {cite:canon-ibn-sina-print-v2 s.285}"
  id: "Isian makanan dan air mengalir: Jika sesuatu yang besar meledak, leher dan bahu harus dipukul satu per satu. Jika mata tidak menyebabkan muntah, yang bisa berbahaya (diambil sebagai definisi buku, bukan sebagai proses) {cite:canon-ibn-sina-print-v2 hlm.285}"
