  ar: "الغصّ بالطعام"
  en: "Choking on food"
  ur: "خوراک میں گھٹن"
summary:
  ar: "الغصّ بالطعام وما يجري مجراه إذا نشب شيء له حجم يجب أن يبدأ فيلكم العنق وما بين الكتفين ضرباً بعد ضرب فإن لم يغن أعين بالقيء وربما كان في ذلك خطر ⁦(محمول على أنه وصف الكتاب لا عملية)⁩ {cite:canon-ibn-sina-print-v2 p.285}"
  en: "Choking on food and what runs its course: if a body of some bulk sticks fast, one must begin by cuffing the neck and what is between the shoulders, strike after strike; if that does not avail, he is helped by vomiting — and there may be danger in that (carried as the book's description, not a procedure) {cite:canon-ibn-sina-print-v2 p.285}"
  ur: "خوراک میں گھٹن اور اس جنس کی چیز: اگر حجم والی کوئی چیز پھنس جائے تو آغاز گردن اور دونوں کندھوں کے درمیان تھپکیاں دینے سے ہونا چاہیے، ایک کے بعد ایک؛ اگر وہ نہ سودا کرے تو قے سے مدد لی جاتی ہے اور اس میں خطر بھی ہو سکتا ہے ⁦(کتاب کے وصف پر محمول، طریقہ نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.285}"
