id: concept/voluntary-charity
class: concept
kind: legal
label:
  ar: "صَدَقة التطوع"
  en: "Voluntary charity (sadaqa al-tatawwu': its kinds, who gives and who receives, the property given, intention, secrecy, and withdrawal)"
summary:
  ar: "الصدقة في الفقه تمليك بلا عوض لثواب الآخرة، وتستعمل في الزكاة وصدقة التطوع، والغالب عند الفقهاء إطلاقها على التطوع. والصدقة مندوبة بنصوص القرآن والسنة، وتفضل في رمضان والأيام الفاضلة والأماكن الشريفة وأوقات الحاجة. ولا يصح التصدق إلا من أهل التبرع المالك للمال، ولا تصح من الصغير غير المميز، وتصح على الصغير والمحجور والأغنياء والكفار في تفصيل المذاهب. ويستحب أن تكون من الطيب الحلال الجيد، وأن تكون من الفاضل عن الكفاية، ومنع المن والأذى، والإسرار أفضل، ولا رجوع فيها بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10315}"
  en: "In the law, charity (sadaqa) is a transfer of ownership without return, sought for the reward of the Hereafter. The word covers zakat and voluntary charity, and jurists usually mean the voluntary kind when it is used alone. Charity is recommended by texts of the Qur'an and the Sunna, and it is more meritorious in Ramadan, the excellent days, the holy places and times of need. Only a person with capacity to give and owning the property may give; a young child who cannot discern cannot give, and gifts may be made to a child, a person under restraint, the rich, and, by the varying views of the schools, non-Muslims. The property should be lawful, good and of high quality, and should exceed the giver's own needs and those he supports; giving with reproach or hurt is forbidden, secret giving is better, and there is no withdrawal once given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10315}"
