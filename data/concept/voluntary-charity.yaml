id: concept/voluntary-charity
class: concept
kind: legal
label:
  ar: "صَدَقة التطوع"
  en: "Voluntary charity (sadaqa al-tatawwu': its kinds, who gives and who receives, the property given, intention, secrecy, and withdrawal)"
  es: "Caridad voluntaria (sadaqa al-tatawwu': sus tipos, quién da y quién recibe, la propiedad donada, la intención, el secreto y el retiro)"
  fr: "La charité volontaire (sadaqa al-tatawwu': ses types, qui donne et qui reçoit, le bien donné, l'intention, le secret et le retrait)"
summary:
  ar: "الصدقة في الفقه تمليك بلا عوض لثواب الآخرة، وتستعمل في الزكاة وصدقة التطوع، والغالب عند الفقهاء إطلاقها على التطوع. والصدقة مندوبة بنصوص القرآن والسنة، وتفضل في رمضان والأيام الفاضلة والأماكن الشريفة وأوقات الحاجة. ولا يصح التصدق إلا من أهل التبرع المالك للمال، ولا تصح من الصغير غير المميز، وتصح على الصغير والمحجور والأغنياء والكفار في تفصيل المذاهب. ويستحب أن تكون من الطيب الحلال الجيد، وأن تكون من الفاضل عن الكفاية، ومنع المن والأذى، والإسرار أفضل، ولا رجوع فيها بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10315}"
  en: "In the law, charity (sadaqa) is a transfer of ownership without return, sought for the reward of the Hereafter. The word covers zakat and voluntary charity, and jurists usually mean the voluntary kind when it is used alone. Charity is recommended by texts of the Qur'an and the Sunna, and it is more meritorious in Ramadan, the excellent days, the holy places and times of need. Only a person with capacity to give and owning the property may give; a young child who cannot discern cannot give, and gifts may be made to a child, a person under restraint, the rich, and, by the varying views of the schools, non-Muslims. The property should be lawful, good and of high quality, and should exceed the giver's own needs and those he supports; giving with reproach or hurt is forbidden, secret giving is better, and there is no withdrawal once given. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10315}"
  es: "En la ley, la caridad (sadaqa) es una transferencia de propiedad sin contraprestación, solicitada para la recompensa en el Más Allá. El término abarca el zakat y la caridad voluntaria, y los juristas suelen referirse a la caridad voluntaria cuando se usa sola. La caridad es recomendada por textos del Corán y la Sunna, y es más meritoria durante el Ramadán, los días excelentes, los lugares sagrados y en tiempos de necesidad. Solo puede dar quien tenga capacidad para dar y sea propietario del bien; un niño pequeño que no pueda discernir no puede dar, y se pueden hacer donaciones a un niño, a una persona bajo custodia, a los ricos y, según las diferentes escuelas de pensamiento, a los no musulmanes. El bien debe ser lícito, bueno y de alta calidad, y debe exceder las necesidades del donante y de quienes mantiene; está prohibido dar con reproche o resentimiento, es mejor dar en secreto, y una vez entregado, no hay posibilidad de retractarse. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10295} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10296} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10297} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10298} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10299} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10300} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10301} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.10302} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10303} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10304} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10305} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10306} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10307} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10308} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10309} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10310} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10311} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10312} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10313} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10314} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10315}"
  fr: "En droit musulman, la charité (sadaqa) est un don sans contrepartie, effectué dans l'espoir d'une récompense dans l'au-delà. Ce terme englobe la zakat et l'aumône volontaire, et les juristes se réfèrent généralement à cette dernière lorsqu'il est employé seul. La charité est recommandée par le Coran et la Sunna, et elle est plus méritoire durant le Ramadan, les jours fastes, dans les lieux saints et en période de besoin. Seule une personne capable de donner et propriétaire du bien peut le faire; un jeune enfant incapable de discernement ne peut donner. Les dons sont autorisés aux enfants, aux personnes sous contrainte, aux riches et, selon les différentes écoles de pensée, aux non-musulmans. Le bien donné doit être licite, de bonne qualité et de grande valeur, et doit excéder les besoins du donateur et de ceux de ses proches. Donner avec reproche ou malveillance est interdit; donner en secret est préférable, et une fois donné, le don est irrévocable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10295} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10296} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10297} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10298} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10301} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.10302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10305} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10306} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10307} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10308} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10309} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10315}"
