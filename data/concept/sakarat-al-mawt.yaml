label:
  ar: "سكرات الموت"
  en: "The agonies of death (sakarat al-mawt)"
  ur: "سکراتِ موت"
  es: "Las agonías de la muerte (sakarat al-mawt)"
  fr: "Les agonies de la mort (sakarat al-mawt)"
  tr: "Ölüm Sancıları"
