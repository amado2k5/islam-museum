summary:
  ar: "يعرض الشيخ عمر عبد الكافي في الحلقة الثامنة من تفسيره صورة خروج الروح عند الموت، فيقول إن النازعات هي الملائكة التي تنزع أرواح الكفار بشدة وإن الناشطات تنشط روح المؤمن برفق {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}. ويذكر أن النبي قال لعائشة إن للموت سكرات {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}. ويقول إن ملك الموت لا ينزل وحده بل معه فريقان من الملائكة، ملائكة رحمة وملائكة عذاب {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}."
  en: "In episode 8 of his Tafsir, Sheikh Omar Abdelkafy sets out a picture of the soul's departure at death, saying that the Nazi'at are the angels who tear out the souls of disbelievers with force and that the Nashitat draw out the believer's soul gently {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}. He notes that the Prophet told Aisha that death has agonies {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}. He says the angel of death does not come alone but with two groups of angels, angels of mercy and angels of punishment {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}."
  ur: "شیخ عمر عبد الکافی اپنی تفسیر کی آٹھویں قسط میں موت کے وقت روح کے نکلنے کی تصویر پیش کرتے ہیں، اور کہتے ہیں کہ النازعات وہ فرشتے ہیں جو کافروں کی روحیں سختی سے نکالتے ہیں اور الناشطات مومن کی روح کو نرمی سے نکالتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}۔ وہ ذکر کرتے ہیں کہ نبی نے عائشہ سے فرمایا کہ موت کی سکرات ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}۔ وہ کہتے ہیں کہ ملک الموت اکیلا نہیں آتا بلکہ اس کے ساتھ فرشتوں کی دو جماعتیں ہوتی ہیں، رحمت کے فرشتے اور عذاب کے فرشتے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}۔"
  es: "En el episodio 8 de su Tafsir, el Sheikh Omar Abdelkafy presenta una imagen de la partida del alma al morir, diciendo que los Nazi'at son los ángeles que arrancan con fuerza las almas de los incrédulos y que los Nashitat extraen suavemente el alma del creyente {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}. Señala que el Profeta le dijo a Aisha que la muerte tiene agonías {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}. Dice que el ángel de la muerte no viene solo, sino con dos grupos de ángeles, ángeles de misericordia y ángeles de castigo {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}."
  fr: "Dans le huitième épisode de son Tafsir, le cheikh Omar Abdelkafy décrit le départ de l'âme lors de la mort, expliquant que les Nazi'at sont les anges qui arrachent violemment l'âme des mécréants, tandis que les Nashitat retirent doucement celle du croyant {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}. Il rappelle que le Prophète a dit à Aïcha que la mort est une épreuve douloureuse {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}. Il dit que l'ange de la mort ne vient pas seul mais avec deux groupes d'anges, les anges de la miséricorde et les anges du châtiment {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}."
  tr: "Şeyh Ömer Abdulkafi, tefsirinin sekizinci bölümünde ruhun ölümde ayrılışını sunar ve Nazi'atların, kâfirlerin ruhlarını şiddetle alan melekler olduğunu, aktivistlerin ise müminlerin ruhunu nazikçe harekete geçirdiğini söyler {cite:assabile-omar-abdelkafy tafsir-al-quran-al-kareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-kareem/ep08 00:38:00}. Peygamber'in Aişe'ye ölümün sarhoş edici etkileri olduğunu söylediği belirtilir {cite:assabile-omar-abdelkafy tafsir-al-quran-al-kareem/ep08 00:39:00}. Ölüm Meleği'nin yalnız inmediğini, onunla birlikte iki melek grubunun olduğunu söyler: merhamet melekleri ve ceza melekleri {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-qareem/ep08 00:40:00}."
  id: "Sheikh Omar Abdulkafi menyajikan dalam episode kedelapan tafsirnya gambaran jiwa yang pergi saat kematian, mengatakan bahwa Nazi'at adalah malaikat yang dengan serius mengambil jiwa orang kafir, dan para aktivis dengan lembut mengaktifkan jiwa orang mukmin {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}. Disebutkan bahwa Nabi beritahu Aisha bahwa kematian memiliki efek memabukkan {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}. Ia mengatakan bahwa Malaikat Maut tidak turun sendirian, tetapi bersamanya ada dua kelompok malaikat: malaikat belas kasih dan malaikat hukuman {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}."
