label:
  ar: "سكرات الموت"
  en: "The agonies of death (sakarat al-mawt)"
  ur: "سکراتِ موت"
summary:
  ar: "يعرض الشيخ عمر عبد الكافي في الحلقة الثامنة من تفسيره صورة خروج الروح عند الموت، فيقول إن النازعات هي الملائكة التي تنزع أرواح الكفار بشدة وإن الناشطات تنشط روح المؤمن برفق {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}. ويذكر أن النبي قال لعائشة إن للموت سكرات {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}. ويقول إن ملك الموت لا ينزل وحده بل معه فريقان من الملائكة، ملائكة رحمة وملائكة عذاب {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}."
  en: "In episode 8 of his Tafsir, Sheikh Omar Abdelkafy sets out a picture of the soul's departure at death, saying that the Nazi'at are the angels who tear out the souls of disbelievers with force and that the Nashitat draw out the believer's soul gently {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}. He notes that the Prophet told Aisha that death has agonies {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}. He says the angel of death does not come alone but with two groups of angels, angels of mercy and angels of punishment {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}."
  ur: "شیخ عمر عبد الکافی اپنی تفسیر کی آٹھویں قسط میں موت کے وقت روح کے نکلنے کی تصویر پیش کرتے ہیں، اور کہتے ہیں کہ النازعات وہ فرشتے ہیں جو کافروں کی روحیں سختی سے نکالتے ہیں اور الناشطات مومن کی روح کو نرمی سے نکالتے ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:36:30} {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:38:00}۔ وہ ذکر کرتے ہیں کہ نبی نے عائشہ سے فرمایا کہ موت کی سکرات ہیں {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:39:00}۔ وہ کہتے ہیں کہ ملک الموت اکیلا نہیں آتا بلکہ اس کے ساتھ فرشتوں کی دو جماعتیں ہوتی ہیں، رحمت کے فرشتے اور عذاب کے فرشتے {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep08 00:40:00}۔"
