summary:
  ar: "في الفصل الثامن عشر يرد ابن سينا أسباب الورم إلى جهة المادة، وهي الامتلاء من الأشياء الستة المذكورة، وجهة هيئة العضو من قوة العضو الدافع وضعف العضو القابل وتهيئه لقبول الفضل، ويذكر أن الكسر والعظم والسن قد يرم {cite:canon-ibn-sina-print-v1 p.147}."
  en: "In chapter 18 Ibn Sina traces the causes of swelling to the side of the matter, which is fullness from the six things already named, and to the condition of the organ, namely the force of the expelling organ and the weakness of the receiving one and its readiness to take the superfluity, and notes that a fracture, bone and even a tooth may swell {cite:canon-ibn-sina-print-v1 p.147}."
