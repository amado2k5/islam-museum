id: "concept/al-sharnaq"
class: "concept"
kind: "scientific"
label:
  ar: "الشرناق"
  en: "The sharnaq (a fatty growth of the upper lid)"
  fr: "Le sharnaq (excroissance graisseuse de la paupière supérieure)"
  ur: "شرناق"
  es: "El sharnaq (un crecimiento graso del párpado superior)"
summary:
  ar: "الشرناق زيادة من مادة شحمية تحدث في الجفن الأعلى فتثقله عن الانفتاح وتجعله كالمسترخي، وهو ملتحج لا يتحرك تحرك السلعة، وأكثر ما يعرض للصبيان والمرطوبين ومن تكثر بهم الدمعة والرمد {cite:canon-ibn-sina-print-v2 p.196}"
  en: "Sharnaq is an excess of fatty matter arising in the upper eyelid, weighing the lid down from opening and leaving it as though relaxed; it is a firm mass that does not move as a fatty wart does, and it mostly befalls boys, the moist-tempered, and those with much tearing and ophthalmia {cite:canon-ibn-sina-print-v2 p.196}"
  fr: "Le sharnaq est un excès de matière graisseuse qui se forme dans la paupière supérieure, l’alourdit au point de gêner son ouverture et la laisse comme relâchée. C’est une masse ferme qui n’a pas la mobilité d’une verrue graisseuse. Il touche surtout les garçons, les personnes de tempérament humide et celles sujettes à des larmoiements abondants et à l’ophtalmie {cite:canon-ibn-sina-print-v2 p.196}"
  ur: "شرناق چربی کے مادہ کی ایک زیادتی ہے جو اوپر والی پلک میں پیدا ہوتی ہے اور پلک کو کھولنے سے بھاری کر کے بے جان سا کر دیتی ہے؛ یہ ایک سخت ماسہ ہے جو سلعہ کی طرح حرکت نہیں کرتا، اور یہ زیادہ تر بچوں، تر مزاجوں اور جن میں آنسو اور رمد زیادہ ہو، پر عرض کرتا ہے {cite:canon-ibn-sina-print-v2 p.196}۔"
  es: "El sharnaq es un exceso de materia grasa que se origina en el párpado superior, impidiendo que se abra y dejándolo como si estuviera relajado; es una masa firme que no se mueve como una verruga grasa, y afecta principalmente a niños, personas de temperamento húmedo y a quienes tienen mucho lagrimeo y oftalmía {cite:canon-ibn-sina-print-v2 p.196}"
