summary:
  fr: "Herbe à feuille proche du blé mais plus souple, fruit à deux ou trois enveloppes et duvet pileux ; le suc est meilleur. Chaude au premier degré, sèche au deuxième, desséchante et dissolvante, elle ramollirait les indurations et aiderait l'affection oculaire nommée al-gharb {cite:canon-ibn-sina-print-v1 p.439}."
  ar: "حشيشة يشبه ورقها ورق الحنطة لكنه ألين، وثمرتها ذات حجابين أو ثلاثة عليها شبه الشعر، وعصارتها أفضل من حشيشها. حار في الأولى يابس في الثانية، مجفف محلّل، ويليّن الأورام التي أخذت تصلباً، وينفع العين من حالة يسميها الكتاب «الغرب» {cite:canon-ibn-sina-print-v1 p.439}."
  en: "A herb whose leaf resembles wheat leaf but is softer; its fruit has two or three husks with a hair-like down, and its juice is better than the herb. Hot in the first degree, dry in the second; drying and dissolving; it softens swellings that have hardened, and helps an eye condition the book calls al-gharb {cite:canon-ibn-sina-print-v1 p.439}."
  ur: "ایک بوٹی جس کا پتا گندم کے پتے جیسا مگر نرم ہے؛ اس کا پھل دو یا تین خول رکھتا ہے جن پر بال جیسا رواں ہے، اور اس کا رس بوٹی سے بہتر ہے۔ پہلے درجے میں گرم اور دوسرے میں خشک؛ خشک کرتا اور تحلیل کرتا ہے، سخت ہو جانے والی سوجن کو نرم کرتا ہے، اور آنکھ کی اس حالت میں مفید ہے جسے کتاب «غرب» کہتی ہے {cite:canon-ibn-sina-print-v1 p.439}۔"
