id: concept/waiver-of-dower
class: concept
kind: legal
label:
  ar: "عفو المهر"
  en: "Waiver of the dower"
  ur: "مہر کی معافی"
summary:
  ar: "يبيّن الشعراوي في تفسير قوله تعالى «أو يعفو الذي بيده عقدة النكاح» أن المهر حق للمرأة، وأن الذي بيده عقدة النكاح هو الزوج لا ولي المرأة، وأنه يرد على من قال بالولي، كما ينقل ذلك عن بعض المفسرين دون أن يسمّيهم في هذا الموضع {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1019} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1020}."
  en: "On the phrase 'or the one in whose hand is the marriage knot,' Sha'rawi holds that the dower is the woman's right and that the one meant is the husband, not her guardian. He answers those who took it to be the guardian, whom he reports without naming them on this page {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1019} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1020}."
  ur: "آیت «أو يعفو الذي بيده عقدة النكاح» پر شعراوی کہتے ہیں کہ مہر عورت کا حق ہے اور جس کے ہاتھ میں نکاح کی گرہ ہے وہ شوہر ہے، سرپرست نہیں۔ وہ ان لوگوں کا جواب دیتے ہیں جنہوں نے سرپرست مراد لیا، جنہیں اس صفحے پر وہ نام لیے بغیر نقل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1019} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1020}."
issue:
  ar: "من يملك العفو عن نصف المهر بعد الطلاق قبل الدخول: الزوج، أم ولي المرأة؟"
  en: "Who may waive half the dower after divorce before consummation: the husband, or the wife's guardian?"
  ur: "رخصتی سے پہلے طلاق کے بعد آدھے مہر کی معافی کا اختیار کس کے پاس ہے: شوہر کے، یا عورت کے سرپرست کے؟"
wings: [ideas]
themes: [family-marriage-kinship, law-and-courts]
periods: [period/prophetic-era]
regions: [global]
relations:
  - { type: part_of, target: concept/divorce-before-consummation }
perspectives:
  - tradition: sunni
    id: sunni-sharawi-husband-waives
    stance: { ar: "الذي بيده عقدة النكاح هو الزوج، والمهر حق للمرأة لا يملك الولي إسقاطه", en: "The one in whose hand is the knot is the husband; the dower is the woman's right and a guardian cannot waive it", ur: "جس کے ہاتھ میں گرہ ہے وہ شوہر ہے؛ مہر عورت کا حق ہے اور سرپرست اسے معاف نہیں کر سکتا" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن الآية تقابل بين عفو المرأة وعفو الزوج، فكما تعفو المرأة عن نصفها يعفو الزوج عن نصفه، وأن المهر أصل مال ورزق لها تدّخره لحاجاتها {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1020}."
      en: "Sha'rawi reads the verse as a matching of two waivers: as the woman may waive her half, the husband may waive his. He calls the dower capital and livelihood that is hers, which she may keep for her needs {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1020}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-reported-guardian-waives
    stance: { ar: "الذي بيده عقدة النكاح هو ولي المرأة، كما ينقله الشعراوي عن بعض المفسرين", en: "The one in whose hand is the knot is the wife's guardian, as Sha'rawi reports some exegetes held", ur: "جس کے ہاتھ میں گرہ ہے وہ عورت کا سرپرست ہے، جیسا کہ شعراوی بعض مفسرین سے نقل کرتے ہیں" }
    holders: []
    summary:
      ar: "ينقل الشعراوي أن بعض المفسرين قالوا إن المقصود وليّ المرأة، ولم يذكر أسماءهم في هذا الموضع، فيُعرض القول كما نقله الشعراوي ولم يُراجع بعد في كتبهم {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1020}."
      en: "Sha'rawi reports that some exegetes held the phrase means the wife's guardian. He does not name them on this page, and their works have not yet been checked, so the view is recorded as he reports it {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1020}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
