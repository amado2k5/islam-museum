class: concept
kind: art_form
label: { ar: "قلم الطومار", en: "Tumar script (qalam al-tumar)", ur: "قلمِ طومار", es: "Escritura Tumar (qalam al-tumar)", fr: "Écriture Tumar (qalam al-tumar)" }
summary:
  ar: "أجلّ الأقلام وأوسعها عرضًا، ويقدّر الكتّاب عرضه بأربع وعشرين شعرة من شعر البرذون؛ نُسب إلى الطومار وهو الكامل من قطع الورق، وكتب به الخلفاء علاماتهم منذ العهد الأموي، وكتب به ملوك مصر من الناصر محمد بن قلاوون إلى عهد القلقشندي {cite:subh-al-asha-cairo-v3 p. 53}."
  en: "The grandest of the pens and the broadest, its width reckoned by the scribes at twenty-four hairs of a pack-horse; named for the tumar, the full-size sheet of paper, it was the hand in which caliphs wrote their signs from Umayyad times and in which the rulers of Egypt wrote from al-Nasir Muhammad ibn Qalawun to al-Qalqashandi's day {cite:subh-al-asha-cairo-v3 p. 53}."
  ur: "اقلام میں سب سے جلیل اور سب سے چوڑا قلم، جس کی چوڑائی کاتب بھاری گھوڑے کے چوبیس بالوں کے برابر مانتے ہیں؛ اس کا نام طومار یعنی کاغذ کے پورے ورق سے ہے، خلفاء اموی دور سے اپنی علامتیں اسی میں لکھتے تھے اور مصر کے حکمران الناصر محمد بن قلاوون سے قلقشندی کے زمانے تک اسی میں لکھتے رہے {cite:subh-al-asha-cairo-v3 p. 53}۔"
  es: "La más grandiosa de las plumas y la más ancha, su anchura calculada por los escribas en veinticuatro pelos de un caballo de carga; llamada así por el tumar, la hoja de papel de tamaño completo, era la letra con la que los califas escribían sus signos desde la época omeya y con la que escribían los gobernantes de Egipto desde al-Nasir Muhammad ibn Qalawun hasta la época de al-Qalqashandi {cite:subh-al-asha-cairo-v3 p. 53}."
  fr: "La plus grande et la plus large des plumes, sa largeur étant estimée par les scribes à vingt-quatre crins d'un cheval de bât; nommée d'après le tumar, la feuille de papier de taille normale, c'était la main dans laquelle les califes écrivaient leurs signes depuis l'époque omeyyade et dans laquelle les dirigeants d'Égypte écrivaient depuis al-Nasir Muhammad ibn Qalawun jusqu'à l'époque d'al-Qalqashandi {cite:subh-al-asha-cairo-v3 p. 53}."
