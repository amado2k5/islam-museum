label:
  ar: "سكر"
  en: "Sukkar (sugar)"
  ur: "سکر"
  es: "Sukkar (azúcar)"
summary:
  ar: "السكر في الكتاب قصب السكر في طبع السكر وأشد تليينا منه، أبرده الطبرزد وهو ألطف، وهو حار في آخر الأولى رطب فيها والعتيق يميل إلى اليبس، مليّن جلاء غسال، جيد للمعدة إلا التي تتولد فيها الصفراء، مفتح للسدد، ويسهل ولا سيما الذي يوجد على قصبه، وهو مع دهن اللوز نافع للقولنج {cite:canon-ibn-sina-print-v1 p.601}."
  en: "Sukkar is in the book the sugar cane, in the nature of sugar and more softening; the coldest is the tabarzad, which is subtler, and it is hot at the end of the first degree and moist in it, the aged kind tending to dryness; softening, cleansing and washing, good for the stomach except where bile arises, opening blockages, loosening the bowels, above all the kind found on the cane, and with almond oil useful for colic {cite:canon-ibn-sina-print-v1 p.601}."
  ur: "سکر کتاب میں گنے کا رس ہے جو شکر کی طبیعت پر ہے اور اس سے زیادہ نرم کرنے والا؛ سب سے ٹھنڈی طبرزد ہے جو زیادہ لطیف ہے، اور یہ پہلے درجے کے آخر میں گرم اور اس میں تر ہے، پرانی خشکی کی طرف مائل؛ نرم کرنے والی، جلا دینے والی اور دھونے والی، معدے کے لیے اچھی سوائے اس معدے کے جہاں صفرا پیدا ہوتا ہو، رکاوٹیں کھولتی ہے، پیٹ کو چلاتی ہے خاص طور پر وہ جو گنے پر ملتی ہے، اور بادام کے تیل کے ساتھ قولنج میں مفید ہے {cite:canon-ibn-sina-print-v1 p.601}۔"
  es: "Sukkar es en el libro la caña de azúcar, en la naturaleza del azúcar y más suavizante; la más fría es la tabarzad, que es más sutil, y es caliente al final del primer grado y húmeda en ella, la variedad añeja tiende a la sequedad; suavizante, limpiadora y desinfectante, buena para el estómago excepto donde surge la bilis, desbloquea obstrucciones, afloja los intestinos, sobre todo la variedad que se encuentra en la caña, y con aceite de almendras útil para el cólico {cite:canon-ibn-sina-print-v1 p.601}."
