label:
  ar: "القرعة في التوزيع"
  en: "Lots in distribution (qur'a)"
summary:
  ar: "القرعة عند المؤلف تُستعمل عند تساوي الحقوق أو المؤهلات من كل وجه، لتوزيع الحقوق أو اختيار الوظائف بدل التخيّر {cite:usul-iqtisad-islami-0660 p. 342}، ويستشهد بحديث الأذان والصف الأول ويذكر قول العز بن عبد السلام إنها شُرعت لدفع الضغائن والأحقاد {cite:usul-iqtisad-islami-0660 p. 342}. وفي الهامش أن العز لا يرى الإقراع عند تعارض البينتين أو الخبرين {cite:usul-iqtisad-islami-0660 p. 342}."
