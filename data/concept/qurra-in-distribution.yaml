tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "القرعة في التوزيع"
  en: "Lots in distribution (qur'a)"
  es: "Lotes en distribución (qur'a)"
  fr: "Lots en distribution (qur'a)"
  ur: "تقسیم میں بہت کچھ ⁦(قرہ)⁩"
  tr: "Dağıtım Çekilişi"
  id: "Undian Distribusi"
summary:
  ar: "القرعة عند المؤلف تُستعمل عند تساوي الحقوق أو المؤهلات من كل وجه، لتوزيع الحقوق أو اختيار الوظائف بدل التخيّر {cite:usul-iqtisad-islami-0660 p. 342}، ويستشهد بحديث الأذان والصف الأول ويذكر قول العز بن عبد السلام إنها شُرعت لدفع الضغائن والأحقاد {cite:usul-iqtisad-islami-0660 p. 342}. وفي الهامش أن العز لا يرى الإقراع عند تعارض البينتين أو الخبرين {cite:usul-iqtisad-islami-0660 p. 342}."
  tr: "Yazarın görüşü, haklar veya nitelikler her açıdan eşit olduğunda, hakları dağıtmak veya seçim yerine iş seçmek için kullanılır {cite:usul-iqtisad-islami-0660 s. 342}. Ezan hadisi ve birinci sırayı alıntılarak, el-İzz bin Abdül-Selam'ın kin ve kinleri önlemek için yasalaştırıldığına dair ifadesini anmaktadır {cite:usul-iqtisad-islami-0660, s. 342}. Kenarda, al-Izz, iki kanıt veya rapor çeliştiğinde kura çekilmesini dikkate almaz {cite:usul-iqtisad-islami-0660, s. 342}."
  id: "Pendapat penulis digunakan ketika hak atau kualifikasi setara dalam segala hal, untuk mendistribusikan hak atau memilih pekerjaan sebagai pengganti pilihan {cite:usul-iqtisad-islami-0660 hlm. 342}. Ia mengutip hadits panggilan salat dan baris pertama, menyebutkan pernyataan al-Izz ibn Abd al-Salam bahwa hal itu dibuat untuk mengusir dendam dan dendam {cite:usul-iqtisad-islami-0660, hlm. 342}. Di pinggir, al-Izz tidak mempertimbangkan undian ketika kedua bukti atau laporan tersebut bertentangan {cite:usul-iqtisad-islami-0660, hlm. 342}."
