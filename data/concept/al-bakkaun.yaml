label: { ar: "البكاؤون", en: "The Weepers (al-bakka'un)", fr: "Les Pleureurs (al-bakka'un)", es: "Los Llorones (al-bakka'un)", ur: "رونے والے ⁦(البکاون)⁩", tr: "ağlayan", id: "Ağlayan" }
summary:
  ar: "سبعة رجال من الأنصار وغيرهم أتوا النبي يطلبون ما يحملهم إلى تبوك فلم يجد ما يحملهم عليه فتولوا وأعينهم تفيض من الدمع حزناً."
  en: Seven men of the Ansar and others who came to the Prophet asking for mounts to join the Tabuk campaign; when he had nothing to carry them, they turned back with tears streaming down their faces.
  fr: "Sept hommes, parmi les Ansar et d’autres, vinrent demander au Prophète des montures pour prendre part à l’expédition de Tabuk. Lorsqu’il n’eut rien pour les transporter, ils s’en retournèrent, les larmes coulant sur leur visage."
  es: "Siete hombres de los Ansar y otros que acudieron al Profeta pidiéndole monturas para unirse a la campaña de Tabuk; cuando él no tuvo nada para transportarlos, regresaron con lágrimas corriendo por sus rostros."
  ur: "انصار کے سات آدمی اور دوسرے لوگ جو نبی کے پاس تبوک مہم میں شامل ہونے کے لیے سواریاں مانگنے آئے تھے۔ جب اُس کے پاس اُن کو اُٹھانے کے لیے کچھ نہ تھا تو وہ آنسوؤں کے ساتھ اپنے چہروں پر بہہ کر واپس لوٹ گئے۔"
  tr: "Ensar'dan yedi adam ve diğerleri, Peygamber'e Tabuk'a ne götüreceğini aramak için geldiler, ancak onları taşıyacak bir şey bulamadı, bu yüzden gözleri üzüntü yaşlarıyla dolup döndü."
  id: "Tujuh orang dari Ansar dan lainnya datang kepada Nabi untuk mencari apa yang akan dibawa ke Tabuk, tetapi mereka tidak menemukan apa pun untuk membawa mereka, sehingga mata mereka dipenuhi air mata kesedihan."
