label:
  ar: الجمعية التعاونية
  en: "The cooperative society (al-jamiyya al-taawuniyya)"
  es: "La sociedad cooperativa (al-jamiyya al-taawuniyya)"
  fr: "La société coopérative (al-jamiyya al-taawuniyya)"
  ur: "کوآپریٹو سوسائٹی ⁦(الجامعہ الطاعونیہ)⁩"
  tr: "Kooperatif Topluluğu"
