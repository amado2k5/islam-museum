summary:
  ar: "يعرض قعدات الجمعية التعاونية بوصفها فكرة إسلامية إصلاحية، الغرض منها الحد من هيمنة أصحاب رؤوس الأموال والوسطاء {cite:qadan-manhaj-iqtisad-quran p. 91}. ويرى أنها تدخل في الاستهلاك والإنتاج معاً، وأن هدفها ديمقراطية الإدارة واتخاذ القرار، ووقف هيمنة الوسطاء الذين لا عمل لهم إلا التوصيل والابتزاز {cite:qadan-manhaj-iqtisad-quran p. 92}. ويذكر أن رجل الأعمال الإنجليزي روبرت أوين دعا إلى إلغاء الأرباح وسُمي أبا التعاون، ويقرر أن الإسلام سبقه إلى الفكرة {cite:qadan-manhaj-iqtisad-quran p. 91}، {cite:qadan-manhaj-iqtisad-quran p. 92}."
  tr: "Kooperatif toplum oturumlarını, sermaye sahiplerinin ve aracıların hakimiyetini sınırlamayı amaçlayan reformist bir İslami fikir olarak sunar {cite:qadan-manhaj-iqtisad-kuran s. 91}. Bunların hem tüketim hem üretimi içerdiğine, amaçlarının demokratik yönetim ve karar alma ile tek işi teslimat ve gasp olan aracıların egemenliğini durdurmak olduğuna inanır {cite:qadan-manhaj-iqtisad-kuran s. 92}. İngiliz iş insanı Robert Owen'ın kârın kaldırılmasını talep ettiği ve işbirliğinin babası olarak anıldığı, İslam'ın kendisinden önce şu fikirleri ortaya çıkardığını belirtir {cite:qadan-manhaj-iqtisad-kuran s. 91}, {cite:qadan-manhaj-iqtisad-kuran s. 92}."
  id: "Ia menyajikan sesi sosial koperasi sebagai gagasan Islam reformis yang bertujuan membatasi dominasi pemilik modal dan perantara {cite:qadan-manhaj-iqtisad-quran hlm. 91}. Ia percaya bahwa ini mencakup konsumsi dan produksi, dan tujuannya adalah menghentikan dominasi perantara yang satu-satunya bisnisnya adalah pengiriman dan pemerasan, serta tata kelola demokratis dan pengambilan keputusan {cite:qadan-manhaj-iqtisad-quran hlm. 92}. Ia menyatakan bahwa pengusaha Inggris Robert Owen menuntut penghapusan keuntungan dan disebut sebagai bapak kerja sama, dan bahwa Islam sudah ada sebelum itu dengan gagasan-gagasan berikut {cite:qadan-manhaj-iqtisad-quran hlm. 91}, {cite:qadan-manhaj-iqtisad-quran hlm. 92}."
