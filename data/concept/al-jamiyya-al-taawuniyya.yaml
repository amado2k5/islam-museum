summary:
  ar: "يعرض قعدات الجمعية التعاونية بوصفها فكرة إسلامية إصلاحية، الغرض منها الحد من هيمنة أصحاب رؤوس الأموال والوسطاء {cite:qadan-manhaj-iqtisad-quran p. 91}. ويرى أنها تدخل في الاستهلاك والإنتاج معاً، وأن هدفها ديمقراطية الإدارة واتخاذ القرار، ووقف هيمنة الوسطاء الذين لا عمل لهم إلا التوصيل والابتزاز {cite:qadan-manhaj-iqtisad-quran p. 92}. ويذكر أن رجل الأعمال الإنجليزي روبرت أوين دعا إلى إلغاء الأرباح وسُمي أبا التعاون، ويقرر أن الإسلام سبقه إلى الفكرة {cite:qadan-manhaj-iqtisad-quran p. 91}، {cite:qadan-manhaj-iqtisad-quran p. 92}."
