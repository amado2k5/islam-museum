id: concept/haraj-hardship
class: concept
kind: legal
label: { ar: "الحرج", en: "Hardship (haraj)", ur: "حرج ⁦(تنگی)⁩", es: "Dificultades (haraj)", fr: "Épreuve (haraj)", tr: "Utanç", id: "Rasa malu" }
summary:
  ar: "الحرج في اللغة الضيق، ويطلق الفقهاء الحرج على كل ما تسبب في الضيق على البدن أو النفس أو عليهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} وهو عند الأصوليين كلي مشكك، لا يعتبر منه إلا ما اعتبره الشارع حرجا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} وتفترق عنه الرخصة، وهي ما وسع للمكلف في فعله لعذر مع قيام السبب المحرم، والعزيمة وهي ما لزم العباد بإيجاب الله، والمشقة وهي الجهد والعناء، والضرورة وهي بلوغ الإنسان حدا لو لم يتناول الممنوع هلك أو قارب، والحاجة وهي الافتقار إلى ما يرفع الضيق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983} والحرج مرفوع شرعا بقوله تعالى: «يريد الله بكم اليسر ولا يريد بكم العسر»، و«وما جعل عليكم في الدين من حرج»، ومن قواعد الفقهاء أن المشقة تجلب التيسير، وأن الضرورات تبيح المحظورات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983}"
  en: "Hardship (haraj) means narrowness in the lexicon; jurists use it for whatever causes narrowness to the body, the soul, or both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} For the usulis it is a graded notion, and only what the lawgiver has counted as hardship is taken into account. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} It is distinguished from the concession (rukhsa), a permission granted for an excuse while the forbidding cause remains; from the strict rule (azima), what God imposes on the servants; from toil (mashaqqa); from necessity (darura), a state in which one would die or nearly die without what is forbidden; and from need (haja), a lack that, if unmet, produces great corruption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983} Hardship is removed by the law, on the basis of the verses ”God desires ease for you and not hardship” and ”He has laid no hardship on you in religion”; the maxims ”hardship brings ease” and ”necessities permit forbidden things” are drawn from this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983}"
  es: "Dificultad (haraj) significa estrechez en el léxico; los juristas la usan para todo lo que causa estrechez al cuerpo, al alma o a ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} Para los usulis es una noción gradual, y solo se toma en cuenta lo que el legislador ha contado como dificultad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} Se distingue de la concesión (rukhsa), un permiso otorgado como excusa mientras la causa que lo prohíbe permanece; de la regla estricta (azima), lo que Dios impone a los siervos; del trabajo (mashaqqa); de la necesidad (darura), un estado en el que uno moriría o casi moriría sin lo que está prohibido; y de la necesidad (haja), una carencia que, si no se satisface, produce gran corrupción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983} La dificultad se elimina mediante la ley, sobre la base de los versículos «Dios desea para vosotros facilidad y no dificultad» y «No os ha impuesto ninguna dificultad en la religión»; de esto se derivan las máximas «la dificultad trae facilidad» y «las necesidades permiten lo prohibido». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983}"
  fr: "Dans le lexique, la difficulté (haraj) signifie étroitesse; les juristes l'emploient pour tout ce qui cause une étroitesse au corps, à l'âme, ou aux deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} Pour les usulis, il s'agit d'une notion graduée, et seul ce que le législateur a considéré comme une difficulté est pris en compte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} Elle se distingue de la concession (rukhsa), une permission accordée comme excuse alors que la cause interdite demeure; de la règle stricte (azima), ce que Dieu impose aux serviteurs; de la peine (mashaqqa); et de la nécessité (darura), un état dans lequel on mourrait ou serait sur le point de mourir sans ce qui est interdit. et du besoin (haja), un manque qui, s'il n'est pas comblé, engendre une grande corruption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983} La difficulté est levée par la loi, conformément aux versets « Dieu veut pour vous la facilité et non la difficulté » et « Il ne vous a imposé aucune difficulté en matière de religion »; les maximes « la difficulté apporte la facilité » et « la nécessité permet les choses interdites » en découlent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983}"
  ur: "سختی ⁦(حراج)⁩ کا مطلب لغت میں تنگی ہے۔ فقہاء اس کو کسی بھی چیز کے لیے استعمال کرتے ہیں جو جسم، روح یا دونوں میں تنگی کا باعث بنتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 6981} اصولوں کے لیے یہ ایک درجہ بندی کا تصور ہے، اور صرف وہی چیز مدنظر رکھی جاتی ہے جسے قانون دینے والے نے مشقت میں شمار کیا ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.6981} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6982} یہ رعایت ⁦(رخصہ)⁩ سے ممتاز ہے، ایک عذر کے لیے دی گئی اجازت جب کہ ممانعت کا سبب باقی رہتا ہے۔ سخت قاعدہ ⁦(عزیمہ)⁩ سے، جو خدا بندوں پر مسلط کرتا ہے۔ محنت سے ⁦(مشق)⁩ ضرورت سے ⁦(درورا)⁩، ایک ایسی حالت جس میں کوئی مر جائے یا تقریباً مر جائے بغیر حرام کے۔ اور حاجت ⁦(حجا)⁩ سے، ایک ایسی کمی جو اگر پوری نہ ہو تو بڑی بدعنوانی پیدا کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6982} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6983} آیات ”خدا تمہارے لئے آسانی چاہتا ہے تنگی نہیں“ اور ”تم پر دین میں کوئی سختی نہیں ہے“ کی بنیاد پر سختی کو قانون کے ذریعے دور کیا جاتا ہے۔ \"مشکل آسانی لاتی ہے\" اور \"ضروریات حرام چیزوں کی اجازت دیتی ہیں\" کے الفاظ اسی سے اخذ کیے گئے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص6983}"
  tr: "Dilde zorluk ifadesi sıkıntı anlamına gelir ve hukukçular bedene, ruha veya her ikisine sıkıntı veren her şey için 'haraj' terimini kullanırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6981} Usul bilginlerine göre bu tamamen şüpheli kabul edilir ve yalnızca Kanun Uygulayanın itiraz edilemez bulduğu şeyler dikkate alınır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6982} Ve taviz ayrıdır, yasak sebep varken zorunlu kişinin mazeret için yapmasına izin verilen şeydir; kararlılık, hizmetkarları Allah'a itaat etmeye zorlayan şeydir; zorluk çaba ve zorluktur; zorunluluk, yasak şeye müdahale etmezse veya yakınsa sınıra ulaşmaktır; zorunluluk, sıkıntıyı kaldıran şeyin eksikliğidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6983} ve İslam hukukunda zorluk şu ayetlerle gündeme getirilir: \"Allah sizin için rahatlık ister, size zorluk istemez,\" ve \"Ve dinde size hiçbir zorluk yüklememiştir.\" Hukukçuların ilkelerinden biri, zorlukların kolaylık getirdiği, gerekliliklerin ise yasaklara izin verdiği vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6983}"
  id: "Kesusahan dalam bahasa ini berarti penderitaan, dan para ahli hukum menggunakan istilah 'haraj' untuk segala sesuatu yang menyebabkan penderitaan pada tubuh, jiwa, atau keduanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6981} Menurut para ahli usul, hal ini dianggap sepenuhnya meragukan, dan hanya apa yang dianggap oleh Pemberi Hukum sebagai sesuatu yang dipermasalahkan yang dipertimbangkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6982} Dan konsesi itu terpisah, yaitu apa yang diizinkan oleh orang yang berkewajiban lakukan sebagai alasan selama sebab terlarang masih ada; tekad adalah yang mewajibkan hamba untuk taat kepada Allah; kesulitan adalah usaha dan kesulitan; kebutuhan mencapai batas jika dia tidak menangani hal terlarang atau berada di dekat; dan kebutuhan adalah ketiadaan apa yang menghilangkan kesedihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6983} dan kesulitan diungkapkan dalam hukum Islam oleh ayat: \"Allah menghendaki kemudahanmu dan tidak bermaksud menderita untukmu,\" dan \"Dan Dia tidak menimbunmu dalam agama kesulitan.\" Di antara prinsip para ahli hukum adalah bahwa kesulitan membawa kemudahan, dan kebutuhan memungkinkan larangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6983}"
