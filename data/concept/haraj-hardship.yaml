id: concept/haraj-hardship
class: concept
kind: legal
label: { ar: "الحرج", en: "Hardship (haraj)", ur: "حرج (تنگی)" }
summary:
  ar: "الحرج في اللغة الضيق، ويطلق الفقهاء الحرج على كل ما تسبب في الضيق على البدن أو النفس أو عليهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} وهو عند الأصوليين كلي مشكك، لا يعتبر منه إلا ما اعتبره الشارع حرجا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} وتفترق عنه الرخصة، وهي ما وسع للمكلف في فعله لعذر مع قيام السبب المحرم، والعزيمة وهي ما لزم العباد بإيجاب الله، والمشقة وهي الجهد والعناء، والضرورة وهي بلوغ الإنسان حدا لو لم يتناول الممنوع هلك أو قارب، والحاجة وهي الافتقار إلى ما يرفع الضيق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983} والحرج مرفوع شرعا بقوله تعالى: «يريد الله بكم اليسر ولا يريد بكم العسر»، و«وما جعل عليكم في الدين من حرج»، ومن قواعد الفقهاء أن المشقة تجلب التيسير، وأن الضرورات تبيح المحظورات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983}"
  en: "Hardship (haraj) means narrowness in the lexicon; jurists use it for whatever causes narrowness to the body, the soul, or both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} For the usulis it is a graded notion, and only what the lawgiver has counted as hardship is taken into account. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6981} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} It is distinguished from the concession (rukhsa), a permission granted for an excuse while the forbidding cause remains; from the strict rule (azima), what God imposes on the servants; from toil (mashaqqa); from necessity (darura), a state in which one would die or nearly die without what is forbidden; and from need (haja), a lack that, if unmet, produces great corruption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983} Hardship is removed by the law, on the basis of the verses ”God desires ease for you and not hardship” and ”He has laid no hardship on you in religion”; the maxims ”hardship brings ease” and ”necessities permit forbidden things” are drawn from this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6983}"
