summary:
  ar: "السطرونيون في الكتاب يسميه بعضهم طريفالي أي ذو ثلاث ورقات، نبات له أصل شبيه بالبصل بحجم تفاحة، أحمر الظاهر أبيض الباطن حلو الطعم، وينبت في أماكن جبلية مشمسة، ويذكر له نقلاً موسوماً في الجماع {cite:canon-ibn-sina-print-v1 p.589}."
  en: "Satrunyun is in the book called by some trifali, that is three-leaved, a plant with a root like an onion the size of an apple, red outside, white within, sweet in taste, growing in sunny mountain places, and the book gives a labelled listing on desire {cite:canon-ibn-sina-print-v1 p.589}."
  ur: "سطرونیون کتاب میں بعض اسے طریفالی کہتے ہیں یعنی تین پتوں والا، ایک پودا جس کی جڑ پیاز جیسی، سیب کے برابر، باہر سے سرخ، اندر سے سفید اور میٹھے ذائقے کی ہے، اور دھوپ والی پہاڑی جگہوں میں اگتا ہے، اور کتاب جماع کے بارے میں اس کی ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.589}۔"
  es: "Satrunyun es llamado en el libro por algunos trifali, es decir, de tres hojas, una planta con una raíz como una cebolla del tamaño de una manzana, roja por fuera, blanca por dentro, de sabor dulce, que crece en lugares soleados de montaña, y el libro da una lista etiquetada sobre el deseo {cite:canon-ibn-sina-print-v1 p.589}."
