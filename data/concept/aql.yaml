id: concept/aql
class: concept
kind: legal
label:
  ar: "العَقْل"
  en: "Reason as the basis of legal capacity and of the blood-money (aql)"
  fr: "La raison comme fondement de la capacité juridique et du prix du sang (aql)"
  ur: "عقل ⁦(عقل اور اہلیت)⁩"
  es: "La razón como fundamento de la capacidad jurídica y de la indemnización por derramamiento de sangre (aql)"
summary:
  ar: "العقل في اللغة الحجر والنهي، وضد الحمق، ويطلق على الدية، وفي الاصطلاح القوة المتهيئة لقبول العلم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771}. وأجمع الفقهاء على أن العقل مناط التكليف، فلا تجب العبادات على المجنون ولا على غيره ممن لا عقل له، لحديث رفع القلم عن ثلاثة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. ولا تصح تصرفات من لا عقل له في المال أو العقود أو الفسوخ، ولا تعتبر أقواله فيما تؤخذ عليه أو له، وتسلب منه الولايات، واستثنى الفقهاء بعض التصرفات المعتبرة لفاقد العقل كالإتلاف وإرضاع الصبي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. وزوال العقل بالجنون أو الإغماء أو السكر ينقض الوضوء عند الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. ولا قصاص في إزالة العقل بالجناية، وتجب الدية في ذهابه بالجناية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773}. ويطلق العقل على الدية كذلك، وتفصيلها في «ديات» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773}."
  en: "In the lexicon, aql is restraint and reason, the opposite of folly; it is also used for blood-money. As a term it is the power prepared to receive knowledge {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771}. The jurists agree that reason is the basis of legal obligation: acts of worship are not owed by the insane or anyone without reason, on the prophetic instruction that the pen is lifted from three {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. Those without reason cannot validly make property transactions, contracts or dissolutions of marriage, and their statements do not bind them or others; they lose their guardianship, though some acts with them are taken into account, such as destruction of property and nursing a child {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. Loss of reason by madness, fainting or intoxication breaks ablution {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. No retaliation is due for a blow that removes reason, but blood-money is due for its loss through injury {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773}."
  fr: "Dans le lexique, aql signifie retenue et raison, à l’opposé de la sottise ; le terme s’emploie aussi pour le prix du sang. Au sens technique, c’est la faculté disposée à recevoir la connaissance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771}. Les juristes s’accordent à faire de la raison le fondement de l’obligation juridique : les actes cultuels n’incombent pas à l’aliéné ni à quiconque est privé de raison, selon l’enseignement prophétique suivant lequel la plume est levée pour trois catégories de personnes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. Ceux qui sont privés de raison ne peuvent valablement effectuer des transactions patrimoniales, des contrats ou des dissolutions de mariage, et leurs déclarations ne les engagent ni n’engagent autrui ; ils perdent leur pouvoir de tutelle, bien que certains de leurs actes soient pris en compte, comme la destruction de biens et l’allaitement d’un enfant {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. La perte de la raison par folie, évanouissement ou ivresse rompt les ablutions {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. Aucun talion n’est dû pour un coup qui fait perdre la raison, mais le prix du sang est dû pour sa perte par blessure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773}."
  es: "En el léxico, aql es moderación y razón, lo opuesto a la locura; también se usa para el dinero de sangre. Como término es el poder preparado para recibir conocimiento {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771}. Los juristas concuerdan en que la razón es la base de la obligación legal: los actos de culto no son debidos por los dementes o por cualquiera que carezca de razón, según la instrucción profética de que la pluma se levanta de tres {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. Aquellos que carecen de razón no pueden realizar válidamente transacciones de propiedad, contratos o disoluciones de matrimonio, y sus declaraciones no los obligan a ellos ni a otros; Pierden su tutela, aunque algunos actos realizados con ellos se toman en cuenta, como la destrucción de propiedad y el cuidado de un niño {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. La pérdida de la razón por locura, desmayo o intoxicación rompe la ablución {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. No se debe represalia por un golpe que elimina la razón, pero se debe pagar una indemnización por su pérdida a través de una lesión {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773}."
