label:
  ar: "العَقْل"
  en: "Reason as the basis of legal capacity and of the blood-money (aql)"
  ur: "عقل (عقل اور اہلیت)"
summary:
  ar: "العقل في اللغة الحجر والنهي، وضد الحمق، ويطلق على الدية، وفي الاصطلاح القوة المتهيئة لقبول العلم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771}. وأجمع الفقهاء على أن العقل مناط التكليف، فلا تجب العبادات على المجنون ولا على غيره ممن لا عقل له، لحديث رفع القلم عن ثلاثة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. ولا تصح تصرفات من لا عقل له في المال أو العقود أو الفسوخ، ولا تعتبر أقواله فيما تؤخذ عليه أو له، وتسلب منه الولايات، واستثنى الفقهاء بعض التصرفات المعتبرة لفاقد العقل كالإتلاف وإرضاع الصبي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. وزوال العقل بالجنون أو الإغماء أو السكر ينقض الوضوء عند الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. ولا قصاص في إزالة العقل بالجناية، وتجب الدية في ذهابه بالجناية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773}. ويطلق العقل على الدية كذلك، وتفصيلها في «ديات» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773}."
  en: "In the lexicon, aql is restraint and reason, the opposite of folly; it is also used for blood-money. As a term it is the power prepared to receive knowledge {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771}. The jurists agree that reason is the basis of legal obligation: acts of worship are not owed by the insane or anyone without reason, on the prophetic instruction that the pen is lifted from three {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11771} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. Those without reason cannot validly make property transactions, contracts or dissolutions of marriage, and their statements do not bind them or others; they lose their guardianship, though some acts with them are taken into account, such as destruction of property and nursing a child {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. Loss of reason by madness, fainting or intoxication breaks ablution {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772}. No retaliation is due for a blow that removes reason, but blood-money is due for its loss through injury {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11772} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11773}."
