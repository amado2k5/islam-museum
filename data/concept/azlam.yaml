summary:
  ar: "الأزلام: قداح يستشيرون بها الأمر قبل العزم عليه؛ نهى القرآن عنها مع الأنصاب ضمن أعمال الشيطان."
  en: "Azlam: divining arrows consulted before undertakings — forbidden in the Qurʾan among Satan’s works."
  fr: "Azlam : flèches divinatoires consultées avant une entreprise, interdites par le Coran parmi les œuvres de Satan."
  es: "Azlam: consultar flechas adivinatorias antes de emprender empresas; prohibido en el Corán entre las obras de Satanás."
  ur: "ازلام: کام کرنے سے پہلے طلسماتی تیروں سے مشورہ کیا جاتا ہے - قرآن میں شیطان کے کاموں میں سے منع کیا گیا ہے۔"
  tr: "El-Ezlem: Bir meseleye karar vermeden önce danışılan bir lamba; Kur'an, Şeytan'ın eylemlerinin bir parçası olarak Aksan ile birlikte bunu yasaklamıştır."
  id: "Al-Azlam: sebuah lampu yang digunakan untuk membahas suatu masalah sebelum memutuskan; Al-Quran melarangnya bersama Al-Aqsan sebagai bagian dari tindakan Setan."
