label:
  ar: "لمّة الملك ولمّة الشيطان"
  en: "The angelic and the satanic inspiration (lamma)"
  ur: "فرشتے اور شیطان کا القاء"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن للملك لمة وللشيطان لمة، أي خاطر أو إلهام يقع في القلب من كل منهما. ويصف لمة الملك بأنها وعد بالخير وتصديق للحق."
  en: "Sheikh Omar Abdelkafy says that the angel and the devil each have an inspiration, a lamma, that comes to the heart. He describes the angel's inspiration as a promise of good that affirms the truth."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ فرشتے اور شیطان دونوں کا دل پر ایک القاء ہوتا ہے، جسے لمّہ کہا جاتا ہے۔ وہ فرشتے کے القاء کو بھلائی کا وعدہ اور حق کی تصدیق بتاتے ہیں۔"
