label:
  ar: "التوزيع في الإسلام"
  en: "Distribution in Islam"
  es: "Distribución en el Islam"
  fr: "La distribution en islam"
  ur: "اسلام میں تقسیم"
  tr: "İslam'da Dağılım"
  id: "Distribusi dalam Islam"
issue:
  ar: "ما الصلة بين أشكال الإنتاج وعلاقات التوزيع في الإسلام؟"
summary:
  ar: "يقسم المؤلف التوزيع في الإسلام إلى ثلاثة أنواع: توزيع الثروات المبني على الكفاءة الواقعة أو المتوقعة، كالجهاد والمسابقة والإحياء، وتوزيع الدخول على عناصر الإنتاج المبني على المعاوضة، وإعادة التوزيع المبنية على الحاجة والصلة والدعوة {cite:usul-iqtisad-islami-0660 p. 210}. ويجعل المعيار العدل والإحسان، ويصوغ مبدأ الإنتاج والتوزيع «من كل حسب طاقته، ولكل حسب منفعته أو حاجته» {cite:usul-iqtisad-islami-0660 p. 211}. ويرى أن الصلة بين أشكال الإنتاج وعلاقات التوزيع قائمة، لكنها أدنى مما قال به الماركسيون {cite:usul-iqtisad-islami-0660 p. 211}."
  tr: "Yazar, İslam'da dağıtımı üç türe ayırır: cihad, rekabet ve canlanma gibi gerçek veya beklenen verimlilik temelinde servet dağılımı; değişime dayalı üretim unsurları arasında gelir dağılımı; ve ihtiyaç, bağlantı ve çağrıya dayalı yeniden dağıtım {cite:usul-iqtisad-islami-0660 s. 210}. Adalet ve iyilik standardını belirler; üretim ve dağıtım ilkesini \"her biri kapasitesine göre, her biri kendi faydası veya ihtiyacına göre\" formüle eder {cite:usul-iqtisad-islami-0660 s. 211}. Üretim biçimleri ile dağıtım ilişkileri arasındaki bağlantının var olduğuna inanır, ancak Marksistlerin söylediklerinden daha düşük {cite:usul-iqtisad-islami-0660 s. 211}."
  id: "Penulis membagi distribusi dalam Islam menjadi tiga jenis: distribusi kekayaan berdasarkan efisiensi aktual atau yang diharapkan, seperti jihad, persaingan, dan kebangkitan; distribusi pendapatan di antara elemen produksi berdasarkan pertukaran; dan redistribusi berdasarkan kebutuhan, koneksi, dan panggilan {cite:usul-iqtisad-islami-0660 hlm. 210}. Ia menetapkan standar keadilan dan kebaikan, merumuskan prinsip produksi dan distribusi \"dari masing-masing sesuai dengan kemampuannya, dan masing-masing sesuai dengan manfaat atau kebutuhannya\" {cite:usul-iqtisad-islami-0660 hlm. 211}. Ia percaya bahwa hubungan antara bentuk produksi dan hubungan distribusi memang ada, tetapi hubungan itu lebih rendah daripada yang dikatakan Marxis {cite:usul-iqtisad-islami-0660 hlm. 211}."
