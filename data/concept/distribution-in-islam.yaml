label:
  ar: "التوزيع في الإسلام"
  en: "Distribution in Islam"
issue:
  ar: "ما الصلة بين أشكال الإنتاج وعلاقات التوزيع في الإسلام؟"
summary:
  ar: "يقسم المؤلف التوزيع في الإسلام إلى ثلاثة أنواع: توزيع الثروات المبني على الكفاءة الواقعة أو المتوقعة، كالجهاد والمسابقة والإحياء، وتوزيع الدخول على عناصر الإنتاج المبني على المعاوضة، وإعادة التوزيع المبنية على الحاجة والصلة والدعوة {cite:usul-iqtisad-islami-0660 p. 210}. ويجعل المعيار العدل والإحسان، ويصوغ مبدأ الإنتاج والتوزيع «من كل حسب طاقته، ولكل حسب منفعته أو حاجته» {cite:usul-iqtisad-islami-0660 p. 211}. ويرى أن الصلة بين أشكال الإنتاج وعلاقات التوزيع قائمة، لكنها أدنى مما قال به الماركسيون {cite:usul-iqtisad-islami-0660 p. 211}."
