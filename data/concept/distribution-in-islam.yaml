perspectives:
  - tradition: sunni
    id: majority-lottery
    summary:
      ar: "يرى جمهور الفقهاء أن القرعة معيار للتوزيع عند وجوب القرار وتساوي المستحقين وتعذر التوزيع عليهم جميعاً {cite:usul-iqtisad-islami-0660 p. 211}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: shia-twelver
    id: sadr-no-link
    summary:
      ar: "يرى محمد باقر الصدر أن التوزيع في الإسلام لا يتبع أشكال الإنتاج، وأن علاقات التوزيع منصوصة لا تتغير بتغير الزمان، ثم قال في موضع آخر إن الصلة قد تُحقَّق بالسياسة الشرعية {cite:usul-iqtisad-islami-0660 p. 212}. ويعرض المؤلف هذا القول عنه نقلاً عن كتابه «اقتصادنا»، ولا يأخذ بظاهره المطلق {cite:usul-iqtisad-islami-0660 p. 211}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: other
    id: author-partial-link
    summary:
      ar: "يرى المؤلف، خلافاً للصدر، أن بين أشكال الإنتاج وعلاقات التوزيع صلة ما، لكنها لا تبلغ حد ما زعمه الماركسيون، لأن جانب الفقه البشري في التوزيع يتغير بتغير الزمان والمكان {cite:usul-iqtisad-islami-0660 p. 211} {cite:usul-iqtisad-islami-0660 p. 212}. وهذا رأيه هو، لا حكم قطعي فيه {cite:usul-iqtisad-islami-0660 p. 212}."
    sources: [source/usul-iqtisad-islami-0660]
