id: concept/imarat-al-ard
class: concept
kind: belief
label: { ar: "عمارة الأرض والعمل عبادة", en: "Building the earth and work as worship", ur: "زمین کی آبادکاری اور عمل بطور عبادت" }
summary:
  ar: "يرى الشعراوي أن الإسلام ليس الشعائر وحدها، بل كل حركة في الحياة تناسب خلافة الإنسان في الأرض وعمارتها، وأن الصلاة والزكاة والصوم والحج أركان يُبنى عليها هذا العمل، ويرد على من يقصر الدين على العبادات الطقسية {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1089} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1090}."
  en: "Sha'rawi holds that Islam is not only rites. Every activity in life that serves the human vice-regency on earth and its building is part of it, and prayer, zakat, fasting and the pilgrimage are pillars on which this work rests. He answers those who confine religion to ritual worship {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1089} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1090}."
  ur: "شعراوی کے نزدیک اسلام صرف شعائر نہیں، بلکہ زمین میں انسان کی خلافت اور آبادکاری کے مطابق زندگی کی ہر حرکت اس کا حصہ ہے، اور نماز، زکوٰۃ، روزہ اور حج وہ ستون ہیں جن پر یہ عمل قائم ہوتا ہے۔ وہ ان لوگوں کا جواب دیتے ہیں جو دین کو صرف عبادات تک محدود کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1089} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1090}۔"
