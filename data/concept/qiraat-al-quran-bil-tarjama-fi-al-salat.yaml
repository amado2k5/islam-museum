issue:
  ar: "هل تصح الصلاة بقراءة ترجمة القرآن بدل لفظه العربي؟"
  en: "Is prayer valid when a translation is recited instead of the Arabic wording of the Qur'an?"
  ur: "کیا نماز میں قرآن کے عربی الفاظ کی جگہ ترجمہ پڑھنے سے نماز صحیح ہوتی ہے؟"
  fr: "La prière est-elle valide quand on récite une traduction à la place des mots arabes du Coran ?"
  es: "¿Es válida la oración si se recita una traducción en lugar de las palabras árabes del Corán?"
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-abu-hanifa-and-his-companions
    stance:
      ar: "جاز عند أبي حنيفة أولاً ولو لمن يحسن العربية، ثم رجع إلى تقييده بالعاجز كصاحبيه."
      en: "Valid for Abu Hanifa at first even for one who knows Arabic; he then returned to limiting it to the one unable, as his companions held."
      ur: "ابو حنیفہ کے نزدیک ابتدا میں عربی جاننے والے کے لیے بھی جائز، پھر انہوں نے صاحبین کی طرح اسے عاجز تک محدود کیا۔"
      fr: "Valide d'abord pour Abu Hanifa même pour qui sait l'arabe ; il revint ensuite à la limiter à qui en est incapable, comme ses compagnons."
      es: "Válida al principio para Abu Hanifa incluso para quien sabe árabe; luego volvió a limitarla a quien no puede, como sus compañeros."
    holders: [person/abu-hanifa, person/abu-yusuf-al-qadi, person/muhammad-ibn-al-hasan-al-shaybani, person/ala-al-din-al-kasani, person/ibn-abidin]
    summary:
      ar: "ينقل الكاساني في بدائع الصنائع أن أبا حنيفة رأى صحة قراءة الترجمة الفارسية في الصلاة ولو لمن يقدر على العربية، وأن أبا يوسف ومحمد بن الحسن الشيباني قيداها بالعاجز {cite:ablibrary-badai-sanai-kasani-p113 p.113}. وينقل ابن عابدين في رد المحتار رجوع أبي حنيفة إلى قولهما، ويذكر أن قراءة العربية ثم ترجمتها داخل الصلاة تبطلها {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}."
      en: "Al-Kasani in Bada'i al-Sana'i reports that Abu Hanifa held reciting the Persian translation in prayer valid even for one able to recite Arabic, while Abu Yusuf and Muhammad ibn al-Hasan al-Shaybani limited it to the one unable {cite:ablibrary-badai-sanai-kasani-p113 p.113}. Ibn Abidin in Radd al-Muhtar reports Abu Hanifa's return to their view, and that reciting Arabic and then its translation inside prayer invalidates it {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}."
      ur: "کاسانی بدائع الصنائع میں نقل کرتے ہیں کہ ابو حنیفہ نماز میں فارسی ترجمہ پڑھنے کو عربی پر قادر کے لیے بھی صحیح سمجھتے تھے، اور ابو یوسف اور محمد بن الحسن شیبانی نے اسے عاجز تک محدود کیا {cite:ablibrary-badai-sanai-kasani-p113 p.113}۔ ابن عابدین رد المحتار میں ابو حنیفہ کا ان کے قول کی طرف رجوع نقل کرتے ہیں اور بتاتے ہیں کہ نماز میں عربی پڑھ کر پھر اس کا ترجمہ پڑھنا نماز کو باطل کر دیتا ہے {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}۔"
      fr: "Al-Kasani, dans Bada'i al-Sana'i, rapporte qu'Abu Hanifa tenait pour valide la récitation de la traduction persane dans la prière même pour qui peut réciter en arabe, alors qu'Abu Yusuf et Muhammad ibn al-Hasan al-Shaybani la limitaient à qui en est incapable {cite:ablibrary-badai-sanai-kasani-p113 p.113}. Ibn Abidin, dans Radd al-Muhtar, rapporte le retour d'Abu Hanifa à leur avis et précise que réciter l'arabe puis sa traduction dans la prière l'invalide {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}."
      es: "Al-Kasani, en Bada'i al-Sana'i, transmite que Abu Hanifa consideraba válida la recitación de la traducción persa en la oración incluso para quien puede recitar en árabe, mientras Abu Yusuf y Muhammad ibn al-Hasan al-Shaybani la limitaban a quien no puede {cite:ablibrary-badai-sanai-kasani-p113 p.113}. Ibn Abidin, en Radd al-Muhtar, transmite la vuelta de Abu Hanifa a su opinión y que recitar el árabe y luego su traducción dentro de la oración la invalida {cite:islamweb-fatwa-111542 on Radd al-Muhtar 1/484}."
    sources: [source/ablibrary-badai-sanai-kasani-p113, source/islamweb-fatwa-111542, source/dar-alifta-fatwa-3106]
  - tradition: sunni-maliki
    id: maliki-no-translation-in-prayer
    stance:
      ar: "لا تصح قراءة الترجمة في الصلاة بحال، ويتبع العاجز إماماً يقرأ بالعربية."
      en: "A translation is not valid in prayer in any case; one unable follows an imam who recites in Arabic."
      ur: "نماز میں ترجمہ کسی حال میں صحیح نہیں؛ عاجز عربی پڑھنے والے امام کی اقتدا کرے۔"
      fr: "La traduction n'est valide dans la prière en aucun cas ; l'incapable suit un imam qui récite en arabe."
      es: "La traducción no es válida en la oración en ningún caso; quien no puede sigue a un imán que recita en árabe."
    summary:
      ar: "ينقل المقال المنشور في مجلة IIUCS وفتوى إسلام ويب رقم 35811 عن حاشية الدسوقي على الشرح الكبير أن قراءة الترجمة لا تصح في الصلاة قادراً كان المصلي أو عاجزاً، وأن العاجز يأتم بإمام يقرأ بالعربية، فإن لم يجد سقطت عنه الفاتحة واشتغل بالذكر والتسبيح بالعربية {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi} {cite:islamweb-fatwa-35811 on al-Dasuqi}."
      en: "The IIUCS Journal article and IslamWeb Fatwa 35811 quote al-Dasuqi's Hashiya on the Sharh al-Kabir: reciting a translation is not valid in prayer whether the worshipper is able or unable; the one unable follows an imam reciting in Arabic or, if none is available, al-Fatiha is waived and he occupies himself with Arabic dhikr and tasbih {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi} {cite:islamweb-fatwa-35811 on al-Dasuqi}."
      ur: "IIUCS جرنل کا مقالہ اور اسلام ویب فتویٰ 35811 دسوقی کے حاشیہ علی الشرح الکبیر سے نقل کرتے ہیں کہ نماز میں ترجمہ پڑھنا قادر اور عاجز دونوں کے لیے صحیح نہیں؛ عاجز عربی پڑھنے والے امام کی اقتدا کرے، اور اگر نہ ملے تو اس سے فاتحہ ساقط ہو جاتی ہے اور وہ عربی میں ذکر اور تسبیح میں مشغول رہے {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi} {cite:islamweb-fatwa-35811 on al-Dasuqi}۔"
      fr: "L'article de l'IIUCS Journal et la fatwa 35811 d'IslamWeb citent la Hashiya d'al-Dasuqi sur le Sharh al-Kabir : réciter une traduction n'est pas valide dans la prière, que le fidèle soit capable ou incapable ; l'incapable suit un imam qui récite en arabe ou, à défaut, al-Fatiha est levée et il s'occupe de dhikr et de tasbih en arabe {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi} {cite:islamweb-fatwa-35811 on al-Dasuqi}."
      es: "El artículo del IIUCS Journal y la fatwa 35811 de IslamWeb citan la Hashiya de al-Dasuqi sobre el Sharh al-Kabir: recitar una traducción no es válido en la oración, sea el orante capaz o incapaz; quien no puede sigue a un imán que recita en árabe o, si no lo hay, se le dispensa al-Fatiha y se ocupa en dhikr y tasbih en árabe {cite:banglajol-iiucs-arabic-prayer-article-2681 on al-Dasuqi} {cite:islamweb-fatwa-35811 on al-Dasuqi}."
    sources: [source/banglajol-iiucs-arabic-prayer-article-2681, source/islamweb-fatwa-35811]
  - tradition: sunni-shafii
    id: shafii-no-recitation-in-other-than-arabic
    stance:
      ar: "لا تصح القراءة بغير العربية في الصلاة ولا خارجها، ويبطل إبدال الترجمة الصلاة."
      en: "Reciting in other than Arabic is not valid in prayer or outside it; substituting a translation invalidates the prayer."
      ur: "غیر عربی میں قراءت نماز میں اور نماز کے باہر صحیح نہیں؛ ترجمہ بدلنے سے نماز باطل ہوتی ہے۔"
      fr: "Réciter dans une autre langue que l'arabe n'est pas valide, dans la prière comme en dehors ; substituer une traduction invalide la prière."
      es: "Recitar en otra lengua que el árabe no es válido, dentro ni fuera de la oración; sustituir por una traducción invalida la oración."
    holders: [person/al-nawawi]
    summary:
      ar: "يقرر النووي في المجموع شرح المهذب، الجزء الثالث، أن القراءة بغير العربية لا تصح في الصلاة ولا في غيرها، قادراً كان القارئ على العربية أو عاجزاً، وأن إبدال الترجمة يبطل الصلاة {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.326-327, 342-343}."
      en: "Al-Nawawi in al-Majmu' Sharh al-Muhadhdhab, vol. 3, states that reciting in other than Arabic is not valid in prayer or elsewhere, whether the reciter is able in Arabic or unable, and that substituting a translation invalidates the prayer {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.326-327, 342-343}."
      ur: "نووی المجموع شرح المہذب کی تیسری جلد میں بیان کرتے ہیں کہ غیر عربی میں قراءت نہ نماز میں صحیح ہے نہ اس کے باہر، خواہ پڑھنے والا عربی پر قادر ہو یا عاجز، اور ترجمہ بدلنے سے نماز باطل ہو جاتی ہے {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.326-327, 342-343}۔"
      fr: "Al-Nawawi, dans al-Majmu' Sharh al-Muhadhdhab, vol. 3, établit que réciter dans une autre langue que l'arabe n'est valide ni dans la prière ni ailleurs, que le récitant soit capable en arabe ou non, et que substituer une traduction invalide la prière {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.326-327, 342-343}."
      es: "Al-Nawawi, en al-Majmu' Sharh al-Muhadhdhab, vol. 3, establece que recitar en otra lengua que el árabe no es válido en la oración ni fuera de ella, sea el recitador capaz en árabe o incapaz, y que sustituir por una traducción invalida la oración {cite:islamweb-majmu-nawawi-v3-quran-non-arabic p.326-327, 342-343}."
    sources: [source/islamweb-majmu-nawawi-v3-quran-non-arabic]
  - tradition: sunni-hanbali
    id: hanbali-translation-does-not-suffice
    stance:
      ar: "لا تجزئ الترجمة في الصلاة بحال، ولا يجوز إبدال لفظ عربي بمرادفه العربي."
      en: "A translation does not suffice in prayer in any case, and an Arabic synonym may not be substituted either."
      ur: "نماز میں ترجمہ کسی حال میں کافی نہیں، اور عربی مترادف بھی بدلنا جائز نہیں۔"
      fr: "La traduction ne suffit en aucun cas dans la prière, et un synonyme arabe ne peut pas non plus être substitué."
      es: "La traducción no basta en ningún caso en la oración, y tampoco puede sustituirse por un sinónimo árabe."
    holders: [person/ibn-qudama-al-maqdisi]
    summary:
      ar: "يذكر ابن قدامة في المغني، الجزء الأول، أن القراءة بالترجمة لا تكفي في الصلاة سواء أحسن المصلي العربية أم لم يحسنها، ولا يقوم مرادف عربي مقام اللفظ {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:islamweb-fatwa-111542 on the Hanbali position}."
      en: "Ibn Qudama in al-Mughni, vol. 1, states that recitation in translation does not suffice in prayer whether the worshipper recites Arabic well or not, and an Arabic synonym does not stand in for the wording {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:islamweb-fatwa-111542 on the Hanbali position}."
      ur: "ابن قدامہ المغنی کی پہلی جلد میں بتاتے ہیں کہ نماز میں ترجمے کی قراءت کافی نہیں، خواہ نمازی عربی اچھی پڑھتا ہو یا نہیں، اور عربی مترادف لفظ کی جگہ نہیں لے سکتا {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:islamweb-fatwa-111542 on the Hanbali position}۔"
      fr: "Ibn Qudama, dans al-Mughni, vol. 1, indique que la récitation en traduction ne suffit pas dans la prière, que le fidèle récite bien l'arabe ou non, et qu'un synonyme arabe ne remplace pas le texte {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:islamweb-fatwa-111542 on the Hanbali position}."
      es: "Ibn Qudama, en al-Mughni, vol. 1, indica que la recitación en traducción no basta en la oración, recite el orante bien el árabe o no, y que un sinónimo árabe no sustituye al texto {cite:ketabonline-mughni-ibn-qudama-v1-p352 p.352} {cite:islamweb-fatwa-111542 on the Hanbali position}."
    sources: [source/ketabonline-mughni-ibn-qudama-v1-p352, source/islamweb-fatwa-111542]
