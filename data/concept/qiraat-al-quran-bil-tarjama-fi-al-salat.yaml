id: concept/qiraat-al-quran-bil-tarjama-fi-al-salat
class: concept
kind: doctrine
tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "قراءة القرآن بالترجمة في الصلاة عند المذاهب الأربعة"
  en: "Reciting the Qur'an in translation in prayer: the four Sunni schools"
  ur: "نماز میں ترجمۂ قرآن پڑھنا: چاروں سنی مذاہب"
  fr: "Réciter le Coran en traduction dans la prière : les quatre écoles sunnites"
  es: "Recitar el Corán en traducción en la oración: las cuatro escuelas sunníes"
summary:
  ar: "اختلفت المذاهب السنية في صحة الصلاة بقراءة ترجمة القرآن: نقل الحنفية قول أبي حنيفة بالجواز ثم رجوعه إلى قول صاحبيه بتقييده بالعاجز، ومنع المالكية والشافعية والحنابلة قراءة الترجمة في الصلاة قادراً كان المصلي أو عاجزاً. وتنقل الصفحة كل قول عن أصحابه من كتبهم وفتاوى دور الإفتاء ولا تحكم بينها."
  en: "The Sunni schools differed on whether prayer is valid when a translation is recited instead of the Qur'an: the Hanafis report Abu Hanifa's first permission and his later return to his two companions' view limiting it to the one unable to recite Arabic, while the Malikis, Shafi'is and Hanbalis do not accept a translation in prayer whether the worshipper is able or unable. The page gives each view under its holders, from their books and the fatwa houses, and does not judge between them."
  ur: "نماز میں قرآن کا ترجمہ پڑھنے کی صحت میں سنی مذاہب کا اختلاف ہے: حنفیہ ابو حنیفہ کا ابتدائی جواز اور پھر صاحبین کے قول کی طرف ان کا رجوع نقل کرتے ہیں جو عاجز تک محدود ہے، جبکہ مالکیہ، شافعیہ اور حنابلہ نماز میں ترجمہ کو قادر اور عاجز دونوں کے لیے ناکافی قرار دیتے ہیں۔ صفحہ ہر قول کو اس کے قائلین کی کتابوں اور دارالافتاؤں کے فتاویٰ سے نقل کرتا ہے اور ان کے درمیان فیصلہ نہیں کرتا۔"
  fr: "Les écoles sunnites ont divergé sur la validité de la prière quand une traduction est récitée à la place du Coran : les hanafites rapportent la permission première d'Abu Hanifa puis son retour à l'avis de ses deux compagnons, qui la limite à qui ne sait pas l'arabe, tandis que malikites, chaféites et hanbalites n'admettent pas la traduction dans la prière, que le fidèle soit capable ou non. La page donne chaque avis sous ses tenants, d'après leurs livres et les maisons de fatwa, sans trancher."
  es: "Las escuelas suníes discreparon sobre la validez de la oración cuando se recita una traducción en lugar del Corán: los hanafíes transmiten la primera licencia de Abu Hanifa y su vuelta a la opinión de sus dos compañeros, que la limita a quien no puede recitar en árabe, mientras malikíes, shafi'íes y hanbalíes no admiten la traducción en la oración, sea el orante capaz o incapaz. La página da cada opinión bajo quienes la sostienen, desde sus libros y las casas de fatwa, sin juzgar entre ellas."
