label: { ar: "تدبير من أفرط عليه القيء عند ابن سينا", en: "Managing a patient who has vomited too much in the Canon", ur: "قانون میں حد سے زیادہ قے کرنے والے کی تدبیر" }
summary:
  ar: "يأمر ابن سينا فيمن أفرط عليه القيء بتنويمه بكل حيلة وربط أطرافه وعلاج معدته بالأضمدة المقوية والقابضة، وإن استفرغ دماً فبسقي اللبن ممزوجاً بالخمر، ثم السكنجبين المبرد بالثلج وعصارة بقلة الحمقاء مع الطين الأرمني {cite:canon-ibn-sina-print-v1 pp.288-289}."
  en: "For one who has vomited too much Ibn Sina orders sleep by every means, binding the limbs and strengthening, astringent poultices on the stomach, and, if he brings up blood, milk mixed with wine, then oxymel cooled with snow and purslane juice with Armenian bole {cite:canon-ibn-sina-print-v1 pp.288-289}."
