id: concept/minor-sins-saghair
class: concept
kind: ethical
label:
  ar: "الصَّغَائِر"
  en: "Minor sins (saghair: the meaning, the distinction from grave sins, examples, and the view that all sins are grave)"
  es: "Pecados menores (saghair: significado, distinción de los pecados graves, ejemplos y la opinión de que todos los pecados son graves)"
  fr: "Péchés mineurs (saghair: la signification, la distinction avec les péchés graves, des exemples et l’idée que tous les péchés sont graves)"
summary:
  ar: "الصغائر من الذنوب ما لم يختم بلعنة أو غضب أو نار، أو ما دون الحدين حد الدنيا وحد الآخرة، أو ما ليس فيه حد في الدنيا ولا وعيد في الآخرة، أو ما كره كراهة تحريم. والكبيرة ما كان حراما محضا شرعت عليه عقوبة محضة بنص قاطع، وقيل ما يترتب عليه حد أو يتوعد عليه بالنار أو اللعنة أو الغضب، وهو أمثل الأقوال، واللمم مقاربة المعصية. وجمهور الفقهاء على انقسام الذنوب إلى كبائر وصغائر، وأن الصغائر تغفر باجتناب الكبائر، وقال آخرون إن الذنوب كلها كبائر، وإنما يقال لبعضها صغيرة بالإضافة إلى ما هو أكبر منها. وتعظم الصغيرة بالإصرار والاستصغار والسرور بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10381}"
  en: "Minor sins are, in the various definitions, those not ended by a curse, anger or fire; those lying between the earthly and the other-worldly limit; those with neither a penalty in this world nor a threat in the next; or those forbidden with a lesser prohibition. A grave sin is what is purely unlawful and carries a pure penalty by a decisive text; the better view is that it is what carries a legal penalty or is threatened with the Fire, a curse or anger. Lamam is near approach to sin. Most early scholars and jurists hold that sins divide into grave and minor, and that minor sins are forgiven when grave ones are avoided; others say all sins are grave, and only some are called minor in comparison. A minor sin becomes grave through persistence, treating it lightly, or delight in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10381}"
  es: "Los pecados menores son, según las distintas definiciones, aquellos que no terminan con una maldición, ira o fuego; aquellos que se encuentran entre el límite terrenal y el más allá; aquellos que no conllevan castigo en este mundo ni amenaza en el otro; o aquellos prohibidos con una prohibición menor. Un pecado grave es aquel que es puramente ilícito y conlleva un castigo puro según un texto decisivo; la opinión más acertada es que es aquel que conlleva un castigo legal o que está amenazado con el Fuego, una maldición o ira. Lamam es la aproximación cercana al pecado. La mayoría de los eruditos y juristas antiguos sostienen que los pecados se dividen en graves y menores, y que los pecados menores se perdonan cuando se evitan los graves; otros dicen que todos los pecados son graves, y que solo algunos se llaman menores en comparación. Un pecado menor se convierte en grave por la persistencia, por tomarlo a la ligera o por deleitarse en él. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10379} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10380} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10381}"
  fr: "Les péchés mineurs sont, selon diverses définitions, ceux qui ne sont pas sanctionnés par une malédiction, la colère ou le feu; ceux qui se situent entre la limite terrestre et la limite de l'au-delà; ceux qui n'entraînent ni peine dans ce monde ni menace dans l'autre; ou ceux qui sont interdits par une interdiction moindre. Un péché grave est celui qui est purement illicite et qui entraîne une peine absolue selon un texte clair; l'interprétation la plus juste est qu'il s'agit de celui qui entraîne une peine légale ou qui est menacé par le Feu, une malédiction ou la colère divine. Le lamam est la proximité du péché. La plupart des anciens érudits et juristes soutiennent que les péchés se divisent en graves et mineurs, et que les péchés mineurs sont pardonnés lorsque les graves sont évités; d'autres affirment que tous les péchés sont graves et que seuls certains sont qualifiés de mineurs par comparaison. Un péché mineur devient grave par la persistance, la légèreté ou le plaisir qu'on y trouve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10381}"
