id: concept/minor-sins-saghair
class: concept
kind: ethical
label:
  ar: "الصَّغَائِر"
  en: "Minor sins (saghair: the meaning, the distinction from grave sins, examples, and the view that all sins are grave)"
summary:
  ar: "الصغائر من الذنوب ما لم يختم بلعنة أو غضب أو نار، أو ما دون الحدين حد الدنيا وحد الآخرة، أو ما ليس فيه حد في الدنيا ولا وعيد في الآخرة، أو ما كره كراهة تحريم. والكبيرة ما كان حراما محضا شرعت عليه عقوبة محضة بنص قاطع، وقيل ما يترتب عليه حد أو يتوعد عليه بالنار أو اللعنة أو الغضب، وهو أمثل الأقوال، واللمم مقاربة المعصية. وجمهور الفقهاء على انقسام الذنوب إلى كبائر وصغائر، وأن الصغائر تغفر باجتناب الكبائر، وقال آخرون إن الذنوب كلها كبائر، وإنما يقال لبعضها صغيرة بالإضافة إلى ما هو أكبر منها. وتعظم الصغيرة بالإصرار والاستصغار والسرور بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10381}"
  en: "Minor sins are, in the various definitions, those not ended by a curse, anger or fire; those lying between the earthly and the other-worldly limit; those with neither a penalty in this world nor a threat in the next; or those forbidden with a lesser prohibition. A grave sin is what is purely unlawful and carries a pure penalty by a decisive text; the better view is that it is what carries a legal penalty or is threatened with the Fire, a curse or anger. Lamam is near approach to sin. Most early scholars and jurists hold that sins divide into grave and minor, and that minor sins are forgiven when grave ones are avoided; others say all sins are grave, and only some are called minor in comparison. A minor sin becomes grave through persistence, treating it lightly, or delight in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10381}"
