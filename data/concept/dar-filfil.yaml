id: concept/dar-filfil
class: concept
kind: natural
label:
  ar: "دار فلفل"
  en: "Dar filfil (first fruit of the pepper)"
  ur: "دار فلفل"
  es: "Dar filfil (primer fruto de la pimienta)"
  fr: "Dar filfil (premier fruit du poivre)"
  tr: "biber evi"
  id: "rumah lada"
summary:
  ar: "أشياء صغار كالأنامل، وهي أول ثمرة الفلفل، صلبة ملززة، حدّتها قريبة من حدة الفلفل. حار في الثالثة يابس في الثانية، محلّل يزيل الأمراض الباردة، ومع كبد الماعز المشوي ينفع الغشاء في العين، ويهضم المعدة ويقويها، ويزيد في الباه {cite:canon-ibn-sina-print-v1 p.438}."
  en: "Small things like fingertips, the first fruit of pepper; firm and compact; its sharpness is close to pepper's. Hot in the third degree, dry in the second; dissolves and removes cold disorders. With grilled goat liver it helps the film over the eye; it aids and strengthens digestion, and the book says it increases desire {cite:canon-ibn-sina-print-v1 p.438}."
  ur: "چھوٹی چیزیں جو انگلیوں کے سروں جیسی ہیں، یہ کالی مرچ کا پہلا پھل ہے؛ سخت اور ٹھوس؛ اس کی تیزی کالی مرچ کی تیزی کے قریب ہے۔ تیسرے درجے میں گرم اور دوسرے میں خشک؛ تحلیل کرتا ہے اور ٹھنڈے امراض کو دور کرتا ہے۔ بھنے ہوئے بکری کے جگر کے ساتھ آنکھ کی جھلی میں مفید ہے؛ ہاضم اور معدے کو مضبوط کرتا ہے، اور کتاب کے مطابق شہوت بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.438}۔"
  es: "Cosas pequeñas como las yemas de los dedos, el primer fruto de la pimienta; firme y compacta; su picor es similar al de la pimienta. Picante en tercer grado, seca en segundo; disuelve y elimina los trastornos causados por el frío. Con hígado de cabra a la parrilla ayuda a aliviar la película que cubre el ojo; favorece y fortalece la digestión, y el libro dice que aumenta el deseo {cite:canon-ibn-sina-print-v1 p.438}."
  fr: "De petites choses comme le bout des doigts, le premier fruit du poivre; ferme et compact; son piquant est proche de celui du poivre. Chaud au troisième degré, sec au deuxième; il dissout et élimine les troubles liés au rhume. Avec du foie de chèvre grillé, il aide à décongestionner l’œil; il facilite et renforce la digestion, et le livre dit qu’il augmente le désir {cite:canon-ibn-sina-print-v1 p.438}."
  tr: "Parmaklar gibi küçük şeyler, ilk biber meyvesi olan parmaklar, sert ve yapışkandır, keskinlikleri bibere yakındır. Üçüncü meyvede acı, ikincisinde kuru olan bu meyveler, soğuk hastalıklarını gidermek için tükenirler ve kızarmış keçi karaciğeriyle göz zarına fayda sağlar, mideyi sindirir ve güçlendirir, pH'ı artırır {cite:canon-ibn-sina-print-v1 s.438}."
  id: "Benda kecil seperti jari, yang merupakan buah lada pertama, keras dan lengket, ketajamannya hampir setara dengan lada. Panas di bagian ketiga dan kering di bagian kedua, dikurangi untuk menghilangkan penyakit flu, dan pada hati kambing panggang, bermanfaat bagi membran mata, mencerna dan memperkuat lambung, serta meningkatkan pH {cite:canon-ibn-sina-print-v1 hlm.438}."
