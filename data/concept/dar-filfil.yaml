label:
  ar: "دار فلفل"
  en: "Dar filfil (first fruit of the pepper)"
  ur: "دار فلفل"
summary:
  ar: "أشياء صغار كالأنامل، وهي أول ثمرة الفلفل، صلبة ملززة، حدّتها قريبة من حدة الفلفل. حار في الثالثة يابس في الثانية، محلّل يزيل الأمراض الباردة، ومع كبد الماعز المشوي ينفع الغشاء في العين، ويهضم المعدة ويقويها، ويزيد في الباه {cite:canon-ibn-sina-print-v1 p.438}."
  en: "Small things like fingertips, the first fruit of pepper; firm and compact; its sharpness is close to pepper's. Hot in the third degree, dry in the second; dissolves and removes cold disorders. With grilled goat liver it helps the film over the eye; it aids and strengthens digestion, and the book says it increases desire {cite:canon-ibn-sina-print-v1 p.438}."
  ur: "چھوٹی چیزیں جو انگلیوں کے سروں جیسی ہیں، یہ کالی مرچ کا پہلا پھل ہے؛ سخت اور ٹھوس؛ اس کی تیزی کالی مرچ کی تیزی کے قریب ہے۔ تیسرے درجے میں گرم اور دوسرے میں خشک؛ تحلیل کرتا ہے اور ٹھنڈے امراض کو دور کرتا ہے۔ بھنے ہوئے بکری کے جگر کے ساتھ آنکھ کی جھلی میں مفید ہے؛ ہاضم اور معدے کو مضبوط کرتا ہے، اور کتاب کے مطابق شہوت بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.438}۔"
