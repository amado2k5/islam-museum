  es: "El catálogo enumera las estrellas de la Corona Austral en la misma página que el Incensario, en orden. {cite:zij-sabi-nallino-byblion pp.273}"
  fr: "Le catalogue répertorie les étoiles de la Couronne du Sud sur la même page que l'encensoir, dans l'ordre. {cite:zij-sabi-nallino-byblion pp.273}"
  tr: "Dizin, buhurdanlıkla aynı sayfada Güney Tacı'nın bir görüntüsünü içeriyor ve gezegenlerini sırayla listeliyor. {cite:zij-sabi-nallino-byblion pp.273}"
  id: "Indeks tersebut menyertakan gambar Mahkota Selatan pada halaman yang sama dengan pedupaan, dan mencantumkan planet-planetnya secara berurutan. {cite:zij-sabi-nallino-byblion pp.273}"
