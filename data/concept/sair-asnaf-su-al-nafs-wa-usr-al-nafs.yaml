summary:
  ar: "إن كان السبب في سوء التنفس حرارة القلب استعملت الأدوية المبردة مشروبة وطلاء، وإن كان كثرة البخارات من نفسه أو التي تأتي الرئة فالاستفراغ واستعمل دلك اليدين والرجلين، وإن كان رطوبة معتدلة إلا أنها سادة استعمل ما يجلو، وإن كان رطوبة غليظة استعمل المنقيات القوية الجلاء، وإن كانت الأبخرة والرطوبات تأتي من مواضع أخرى عولج الدماغ منها بعلاج النزلة وتنقية الرأس إلا أن تكون النزلة من ضعف جوهر الدماغ فلا علاج له وعولج ما يأتي من مواضع أخرى بعد الفصد والاستفراغ وتقبل على تقوية الصدر، وإن كان بسبب الأعصاب استعمل ما يقویها ويقوي الروح وإن كان لورم في المريء أو سوء مزاج عولج ذلك بما قيل في بابه وإن كان بمشاركة المعدة نقيت المعدة وقويت بما يذكر في بابه وإن كان من برد فالمسخنات وإن كان من يبس فالمرطبات وإن كان من رياح استعملت الكمادات والضمادات المذكورة في باب الربو ⁦(الأسماء مستثناة بحسب القاعدة)⁩، وفي عسر النفس إن كان من رطوبة فإن جالينوس يأمر بدواء يتناول في كل شهر مرتين وأن لا يتكلم ولا يتحرك قبل يومه بيومين ⁦(قول منسوب إلى جالينوس على لفظ الكتاب وصورة الدواء وتدبير اليوم والغد مستثناة)⁩ وإن كان السبب من الرأس استعمل غسل الرأس والمعطسات والغرغرة ورياضة التمريخ على الظهر وربط الساق مبتدئاً من فوق إلى أسفل وإن كان من حرارة فالأدوية المبردة وإن كان بسبب ضعف منابت العصب عولج بما يقوي الروح الذي في العصب والأدهان الحارة العطرة وإن كان السبب ضربة أصابت منابت تلك الأعصاب عولج بما ينبغي من موانع الورم {cite:canon-ibn-sina-print-v2 p.321}"
  en: "If the cause of the bad breathing is the heart's heat, the cooling drugs are used, drunk and as a coating; if the many vapours of itself or coming to the lung, evacuation, with rubbing of hands and feet used; if a moderate moisture but a blocking one, what cleanses is used; if a thick moisture, the strong-cleansing purifiers. If the vapours and moistures come from other places, the brain is treated for them by the catarrh's treatment and the head's cleansing — unless the catarrh is from a weakness in the brain's own substance, then it has no treatment — and what comes from other places is treated after venesection and evacuation, then the chest is strengthened. If from the nerves, what strengthens them and strengthens the spirit is used; if from a tumour in the oesophagus or a bad temperament, it is treated by what was said in its chapter; if by the stomach's sharing, the stomach is cleansed and strengthened by what is said in its chapter; if from cold, the warmers; if from dryness, the moisteners; if from winds, the fomentations and dressings named in the asthma chapter (the names excluded per the rule). In the hard breath, if from moisture, Galen orders a drug taken twice a month with the man not speaking nor moving for the two days before its day (a saying ascribed to Galen on the book's wording; the drug's form and the regimen of the day and the morrow are excluded); if the cause is from the head, washing the head is used with the sneezers, the gargle, the rubbing-exercise on the back, and the binding of the shank beginning from above downward; if from heat, the cooling drugs; if from a weakness of the nerves' roots, treated by what strengthens the spirit in the nerve and the hot fragrant oils; and if the cause is a blow striking those nerves' roots, treated by what befits of tumour-repellers {cite:canon-ibn-sina-print-v2 p.321}"
  ur: "اگر بد تنفس کا سبب دل کی گرمی ہو تو ٹھنڈی ادویہ استعمال ہوتی ہیں پینے اور لینے میں؛ اگر خود اس کے یا پھیپھڑے تک آنے والے بخارات کی کثرت ہو تو استفراغ اور ہاتھوں اور پاؤں کی مالش؛ اگر معتدل رطوبت ہو مگر بند کرنے والی ہو تو صاف کرنے والا؛ اگر گاڑھی رطوبت ہو تو مضبوط صاف کرنے والے منقیات؛ اگر بخارات اور رطوبتیں دوسری جگہوں سے آ رہی ہوں تو دماغ کا علاج نزلے کے علاج اور سر کی صفائی سے ہو مگر اگر نزلہ خود دماغ کے جوہر کی کمزوری سے ہو تو اس کا علاج نہیں — اور دوسری جگہوں سے آنے والی کا علاج فصد اور استفراغ کے بعد ہو پھر سینے کی تقویت؛ اگر اعصاب سے ہو تو وہ چیز جو انہیں اور روح کو مضبوط کرے؛ اگر مریء میں سوجن یا بد مزاج ہو تو اس کے باب میں کہے گئے سے علاج؛ اگر معدے کی مشارکت سے ہو تو معدہ صاف اور مضبوط کیا جائے اس کے باب میں کہے گئے سے؛ اگر ٹھنڈ سے ہو تو گرمانے والے؛ اگر خشکی سے ہو تو تر کرنے والے؛ اگر ہواؤں سے ہو تو ربو کے باب میں بتائی گئیں کمادیں اور ضمادیں ⁦(نام اصول کے مطابق مستثنیٰ)⁩؛ اور عسر النفس میں اگر رطوبت سے ہو تو جالینوس ایک دوا کا حکم دیتا ہے جو ہر مہینے میں دو بار لی جائے اور اس کے دن سے دو دن پہلے نہ بولے نہ ہلے ⁦(جالینوس سے منسوب قول کتاب کے لفظ پر؛ دوا کی صورت اور اس دن اور اگلے دن کی تدبیر مستثنیٰ)⁩؛ اگر سبب سر سے ہو تو سر کا دھونا چھینکنے والے غرارہ پیٹھ پر تمریخ کی ورزش اور ٹانگ کا باندھنا اوپر سے نیچے شروع کر کے؛ اگر گرمی سے ہو تو ٹھنڈی ادویہ؛ اگر اعصاب کی جڑوں کی کمزوری سے ہو تو اس سے علاج جو عصب میں روح کو مضبوط کرے اور گرم معطر تیل؛ اور اگر سبب ان اعصاب کی جڑوں پر لگی ضرب ہو تو جو سوجن کے روکنے والوں سے مناسب ہو اس سے علاج {cite:canon-ibn-sina-print-v2 p.321}"
  es: "Si la causa de la mala respiración es el calor del corazón, se usan medicamentos refrescantes, bebidos y como recubrimiento; si son muchos vapores de sí mismo o que llegan al pulmón, se usa la evacuación, con frotamiento de manos y pies; si es una humedad moderada pero que bloquea, se usa lo que limpia; si es una humedad espesa, los purificadores de limpieza fuerte. Si los vapores y humedades vienen de otros lugares, el cerebro es tratado para ellos con el tratamiento del catarro y la limpieza de la cabeza —a menos que el catarro sea por una debilidad en la propia sustancia del cerebro, entonces no tiene tratamiento— y lo que viene de otros lugares se trata después de la venesección y evacuación, luego el pecho se fortalece. Si de los nervios, se usa lo que los fortalece y fortalece el espíritu; si de un tumor en el esófago o un mal temperamento, se trata con lo que se dijo en su capítulo; si por compartir el estómago, el estómago se limpia y fortalece con lo que se dijo en su capítulo; si por frío, los calentadores; Si la causa es la sequedad, los humectantes; si es el viento, las fomentaciones y los apósitos mencionados en el capítulo sobre el asma (se excluyen los nombres según la regla). En caso de dificultad para respirar, si es por humedad, Galeno ordena tomar un medicamento dos veces al mes, con el hombre sin hablar ni moverse durante los dos días previos a su administración (un dicho atribuido a Galeno en la redacción del libro; se excluyen la forma del medicamento y el régimen del día y del día siguiente); si la causa es de la cabeza, se utiliza el lavado de la cabeza con los estornudantes, el gárgaras, el ejercicio de frotamiento de la espalda y el vendaje de la pierna comenzando desde arriba hacia abajo; si es por calor, los medicamentos refrescantes; si es por debilidad de las raíces nerviosas, se trata con lo que fortalece el espíritu en el nervio y los aceites calientes y fragantes; y si la causa es un golpe que afecta a esas raíces nerviosas, se trata con lo que corresponde a los repelentes de tumores {cite:canon-ibn-sina-print-v2 p.321}"
  fr: "Si la mauvaise respiration est due à une chaleur excessive du cœur, on utilise des remèdes rafraîchissants, à boire et à appliquer en couche épaisse. Si les vapeurs abondantes atteignent les poumons, on procède à une évacuation, en se frottant les mains et les pieds. En cas d'humidité modérée mais obstructive, on utilise des purificateurs. En cas d'humidité épaisse, on utilise des purificateurs puissants. Si les vapeurs et l'humidité proviennent d'autres endroits, on traite le cerveau par un traitement contre le catarrhe et on nettoie la tête – sauf si le catarrhe est dû à une faiblesse de la substance cérébrale elle-même, auquel cas aucun traitement n'est nécessaire. Ce qui provient d'autres endroits est traité après saignée et évacuation, puis on fortifie la poitrine. Si la cause est d'origine nerveuse, on utilise des remèdes qui fortifient le système nerveux et l'esprit. Si elle provient d'une tumeur de l'œsophage ou d'un mauvais tempérament, on la traite selon les indications du chapitre correspondant. Si elle provient d'un trouble digestif, on nettoie et on fortifie l'estomac selon les indications du chapitre correspondant. Si elle est due au froid, on utilise des remèdes réchauffants. Si la difficulté respiratoire est due à la sécheresse, on utilise des hydratants; si elle est due à des vents, les fomentations et les pansements mentionnés dans le chapitre sur l’asthme (les noms étant exclus conformément à la règle). En cas de difficulté respiratoire due à l’humidité, Galien prescrit un médicament à prendre deux fois par mois, le patient devant rester immobile et ne pas parler les deux jours précédant la prise (une maxime attribuée à Galien dans le texte; la forme du médicament et le régime alimentaire du jour et du lendemain sont omis); si la cause est d’origine céphalique, on lave la tête en utilisant des éternuements, des gargarismes, des frictions du dos et en bandant les jambes en commençant par le haut; si elle est due à la chaleur, on utilise des médicaments rafraîchissants; si elle est due à une faiblesse des racines nerveuses, on traite avec des remèdes fortifiants et des huiles chaudes et parfumées; et si la cause est un coup porté aux racines nerveuses, on traite avec des remèdes antitumoraux. {cite:canon-ibn-sina-print-v2 p.321}"
  tr: "Nefes alma zorluğunun nedeni kalp ısısıydıysa, içecek ve boya gibi soğuk algınlığı ilaçları kullanın. Vücuttan aşırı buhar veya akciğerlerden gelen buhar ise kusun ve el-ayakları masaj yapın. Nem orta ama normalse temizlenmiş olanı kullanın. Eğer koyu ise güçlü temizleyiciler kullanın. Buhar ve nem başka kaynaklardan geliyorsa, soğuk algınlığı ve baş temizliği ile beyni tedavi edin; soğuk algınlığı zayıf beyin çekirdeğinden kaynaklanmıyorsa, o durumda tedavi yoktur. Aşağıdakiler tedavi edilir. Diğer durumlarda, flebiti ve kusmadan sonra göğüs güçlendirmesi aranabilir. Sinirlerden kaynaklanıyorsa, onu güçlendiren ve ruhu güçlendiren şeyler kullanılır. Yemek borusunda tümör veya kötü ruh hali varsa, bölümüne göre tedavi edilmelidir. Mideyi ilgilendiriyorsa, mide bölümünde belirtildiği gibi arındırılır ve güçlendirilir. Soğuksa ısıtıcı olarak kullanılır; kuruysa nemlendirici; ve eğer rüzgar, kompres ve astım bölümünde belirtilen pansumanlar (kurala göre isimler hariç tutulur); nefes darlığı durumunda ise Nemden dolayı Galen, ayda iki kez ilaç almasını ve gündüzden iki gün önce konuşmamasını veya hareket etmemesini emreder (kitabın ifadesi, ilaç şekli ve gün ile yarının yönetimi hakkında Galen'e atfedilen bu ifade istisnalardır). Eğer sebep başsa, başını yıkama, hapşırma, gargara ve sırtı esnetme, bacağı yukarıdan aşağıya bağlama yöntemi uygular. Eğer sıcaklıksa, soğutucu ilaçlar kullanılırdı. Zayıf sinir bağlantılarından kaynaklanıyorsa, siniri güçlendirmek ve sıcak kokulu merhemler için tedavi yapılırdı. Eğer sebep sinir köklerine bir darbe ise, uygun anti-tümör yöntemleriyle tedavi edilirdi {cite:canon-ibn-sina-print-v2 s.321}"
  id: "Jika penyebab kesulitan bernapas adalah panas jantung, gunakan obat dingin seperti minuman dan cat. Jika uap berlebih dari tubuh atau dari paru-paru, maka muntah dan pijat tangan serta kaki. Jika kelembapan sedang tapi normal, gunakan yang sudah dibersihkan. Jika kental, gunakan pembersih yang kuat. Jika uap dan kelembapan berasal dari sumber lain, obati otak dengan perawatan dingin dan pembersihan kepala, kecuali flu disebabkan oleh inti otak yang lemah, dalam hal ini tidak ada obatnya. Berikut ini akan diobati. Dalam kasus lain, setelah flebitis dan muntah, seseorang dapat mencari penguatan dada. Jika disebabkan oleh saraf, gunakan yang memperkuat dan menguatkan semangat. Jika tumor di esofagus atau suasana hati buruk, harus diobati sesuai dengan bagiannya. Jika melibatkan lambung, lambung dibersihkan dan diperkuat seperti yang disebutkan pada bagiannya. Jika dingin, digunakan sebagai penghangat; jika kering, maka pelembap; dan jika angin, kompres dan perban yang disebutkan dalam bagian asma (nama tidak dicantumkan sesuai aturan); dan kesulitan bernapas jika Karena kelembapan, Galen memerintahkan obat diminum dua kali sebulan dan tidak berbicara atau bergerak dua hari sebelum hari kerjanya (pernyataan yang dikaitkan dengan Galen mengenai kata-kata buku, bentuk obat, dan pengelolaan hari serta hari esok adalah pengecualian). Jika penyebabnya adalah kepala, ia menggunakan cuci kepala, bersin, berkumur, dan meregangkan punggung serta mengikat kaki dari atas ke bawah. Jika panas, maka obat pendingin. Jika disebabkan oleh koneksi saraf yang lemah, pengobatan dilakukan untuk memperkuat saraf dan menghangatkan salep harum. Jika penyebabnya adalah pukulan pada akar saraf, maka diobati dengan metode anti-tumor yang sesuai {cite:canon-ibn-sina-print-v2 hlm.321}"
