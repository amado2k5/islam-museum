id: concept/zij-sabi-pole-altitude-and-longest-day-each-from-the-other
class: concept
kind: scientific
label: { ar: "ارتفاع القطب وزيادة النهار الأطول كلٌّ من الآخر في الزيج الصابي", en: "Pole altitude and the longest day, each from the other", ur: "قطب کی بلندی اور سب سے لمبا دن، ایک دوسرے سے", es: "Altitud del polo y el día más largo, cada uno desde el otro", fr: "Altitude du pôle et jour le plus long, l'un par rapport à l'autre" }
summary:
  ar: "يخصص البتاني البابين الثامن والتاسع للتحويل بين زيادة النهار الأطول وارتفاع القطب، أي عرض البلد. فالثامن يعطي الارتفاع من الزيادة بسلسلة أوتار مبنية على نصف قوس النهار، والتاسع يعطي نصف الزيادة من العرض، ثم يضاعفها، وكل خمس عشرة درجة منها ساعة معتدلة، وتُضاف إلى اثنتي عشرة ساعة للنهار الأطول وتُنقص منها للنهار الأقصر. {cite:zij-sabi-nallino-byblion pp.34-35}."
  en: "Al-Battani devotes chapters 8 and 9 to converting between the excess of the longest day and the pole's altitude, which is the place's latitude. Chapter 8 gives the altitude from the excess by a chain of chords built on the half day-arc; chapter 9 gives half the excess from the latitude and doubles it, with every fifteen degrees of it one equal hour, added to twelve hours for the longest day and subtracted from twelve for the shortest. {cite:zij-sabi-nallino-byblion pp.34-35}."
  ur: "البتانی آٹھویں اور نویں باب کو سب سے لمبے دن کی زیادتی اور قطب کی بلندی، یعنی شہر کے عرض، کے درمیان تبدیلی کے لیے مخصوص کرتے ہیں۔ آٹھواں باب زیادتی سے بلندی نصف قوس نہار پر قائم اوتار کی ایک زنجیر سے دیتا ہے، اور نواں باب عرض سے زیادتی کا نصف دیتا ہے پھر اسے دوگنا کیا جاتا ہے، اور اس کے ہر پندرہ درجے ایک معتدل گھنٹہ ہیں جو سب سے لمبے دن کے لیے بارہ گھنٹوں میں جمع اور سب سے چھوٹے دن کے لیے ان میں سے گھٹائے جاتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.34-35}۔"
  es: "Al-Battani dedica los capítulos 8 y 9 a la conversión entre el exceso del día más largo y la altitud del polo, que es la latitud del lugar. El capítulo 8 proporciona la altitud a partir del exceso mediante una cadena de cuerdas construidas sobre el arco de medio día; el capítulo 9 proporciona la mitad del exceso a partir de la latitud y lo duplica, sumando una hora por cada quince grados a doce horas para el día más largo y restándola de doce para el más corto. {cite:zij-sabi-nallino-byblion pp.34-35}."
  fr: "Al-Battani consacre les chapitres 8 et 9 à la conversion entre l'excédent du jour le plus long et l'altitude du pôle, qui correspond à la latitude du lieu. Le chapitre 8 donne l'altitude à partir de cet excédent grâce à une chaîne de cordes construite sur l'arc d'une demi-journée; le chapitre 9 donne la moitié de l'excédent à partir de la latitude et la double, chaque quinzième degré correspondant à une heure, ajoutée aux douze heures du jour le plus long et soustraite à celles du jour le plus court. {cite:zij-sabi-nallino-byblion pp.34-35}."
