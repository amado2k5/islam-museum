id: concept/abar-wal-anak
class: concept
kind: natural
label:
  ar: "الأبار والآنك"
  en: "Abar and anak (black lead)"
  fr: "Abar et anak (plomb noir)"
  ur: "ابار اور آنک ⁦(کالا سیسہ)⁩"
  es: "Abar y anak (plomo negro)"
  tr: "Wells ve şimdi"
  id: "Wells dan sekarang"
summary:
  ar: "الأبار والآنك هما الرصاص الأسود؛ بارد رطب، شديد التبريد للأورام، وينفع من قروح المفاصل والقروح الخبيثة وقروح العين والصدر {cite:canon-ibn-sina-print-v1 p.360} {cite:canon-ibn-sina-print-v1 p.361}."
  en: "Abar and anak are black lead. Cold and moist, they cool swellings strongly and help ulcers of the joints, malignant ulcers, and ulcers of the eye and chest {cite:canon-ibn-sina-print-v1 p.360} {cite:canon-ibn-sina-print-v1 p.361}."
  fr: "Abar et anak désignent le plomb noir. Froids et humides, ils refroidissent fortement les tuméfactions et sont utiles contre les ulcères des articulations, les ulcères malins et les ulcères de l'œil et de la poitrine {cite:canon-ibn-sina-print-v1 p.360} {cite:canon-ibn-sina-print-v1 p.361}."
  ur: "ابار اور آنک کالا سیسہ ہیں؛ ٹھنڈے اور تر، سوجن کو بہت ٹھنڈا کرتے ہیں اور جوڑوں، خبیث زخموں، آنکھ اور سینے کے زخموں میں مفید ہیں {cite:canon-ibn-sina-print-v1 p.360} {cite:canon-ibn-sina-print-v1 p.361}۔"
  es: "Abar y anak son plomo negro. Fríos y húmedos, enfrían fuertemente las hinchazones y ayudan con las úlceras de las articulaciones, las úlceras malignas y las úlceras de los ojos y el pecho {cite:canon-ibn-sina-print-v1 p.360} {cite:canon-ibn-sina-print-v1 p.361}."
  tr: "Kuyular ve şimdi siyah kurşun soğuk, nemli, tümörler için yüksek derecede soğutucu ve eklem ülserleri, kötü huylu ülserler, göz ülserleri ve göğüs ülserleri için faydalıdır {cite:canon-ibn-sina-print-v1 s.360} {cite:canon-ibn-sina-print-v1 s.361}."
  id: "Sumur dan sekarang timbal hitam dingin, lembap, sangat mendinginkan untuk tumor, dan berguna untuk tukak sendi, tukak ganas, tukak mata, dan ulkus dada {cite:canon-ibn-sina-print-v1 hlm.360} {cite:canon-ibn-sina-print-v1 hlm.361}."
