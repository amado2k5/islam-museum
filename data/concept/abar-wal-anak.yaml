summary:
  ar: "الأبار والآنك هما الرصاص الأسود؛ بارد رطب، شديد التبريد للأورام، وينفع من قروح المفاصل والقروح الخبيثة وقروح العين والصدر {cite:canon-ibn-sina-print-v1 p.360} {cite:canon-ibn-sina-print-v1 p.361}."
  en: "Abar and anak are black lead. Cold and moist, they cool swellings strongly and help ulcers of the joints, malignant ulcers, and ulcers of the eye and chest {cite:canon-ibn-sina-print-v1 p.360} {cite:canon-ibn-sina-print-v1 p.361}."
  ur: "ابار اور آنک کالا سیسہ ہیں؛ ٹھنڈے اور تر، سوجن کو بہت ٹھنڈا کرتے ہیں اور جوڑوں، خبیث زخموں، آنکھ اور سینے کے زخموں میں مفید ہیں {cite:canon-ibn-sina-print-v1 p.360} {cite:canon-ibn-sina-print-v1 p.361}۔"
