id: concept/nisyan
class: concept
kind: legal
label: { ar: "النِّسْيَان", en: "Forgetfulness (nisyan) and its legal effects", ur: "نسیان اور اس کے احکام" }
summary:
  ar: "النسيان في اللغة ضد الذكر والحفظ، ويأتي بمعنى الترك والتأخير، واصطلاحاً عدم تذكر الشيء وقت الحاجة إليه، ويفرّق عن الخطأ بأن الخطأ ما لا قصد للإنسان فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} وذهب الشافعية والحنابلة في الصحيح إلى أن الناسي غير مكلف حال نسيانه، وذهب الحنفية إلى أن النسيان لا ينافي الوجوب في حق الله، وقد يصلح عذراً فيه، ولا يُعذر في حقوق العباد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15688} والمالكية يفرّقون بين نسيان العبادات، وهو غير قادح، والجهل وهو قادح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15689} والنسيان يسقط الإثم في الآخرة باتفاق، أما في الدنيا فما ترك من مأمور يجب تداركه، وما أتلف يبقى ضمانه، وما كان فيه عقوبة يكون النسيان شبهة في إسقاطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15690} ومن الفروع: نسيان التسمية في الوضوء والصلاة والنجاسة والتيمم عند نسيان الماء، وفيها أقوال مختلفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15693} وفي الصوم يقطع النسيان التتابع عند بعض المذاهب في النية والوطء في الظهار، ولا يفطر الناسي عند الحنفية والشافعية والمالكية في الأكل والشرب على اختلاف بينهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15702} وفي الصلاة يُبطلها الكلام الكثير والأكل الكثير عند الحنفية ولا يُبطلها اليسير عند غيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} وفي الطلاق والأيمان يقع طلاق الناسي عند الحنفية والشافعية والحنابلة في المذهب، ويقع المعلّق على فعل ناسياً عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15704} ولا أثر للنسيان في ضمان المتلفات والجنايات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15705}"
  en: "Nisyan in the lexicon is the opposite of remembering or retaining, and it also means leaving aside or delaying. As a term it is failing to recall a thing when one needs it, and it is distinguished from error (khata'), which is a thing one did not intend. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} The Shafi'is and Hanbalis hold, in the sound view, that the forgetful person is not accountable while he forgets. The Hanafis hold that forgetting does not cancel the duty owed to God but may be an excuse in God's rights, and is no excuse in the rights of people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15688} The Malikis hold that forgetting in acts of worship does not harm the act, while ignorance does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15689} All agree that forgetting removes sin in the next world. In this world, an omitted command must be made up, harm done in forgetting still requires compensation, and forgetting may be a doubt that lifts a penalty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15690} Among the applications are forgetting the basmala in ablution and prayer, forgetting water when making tayammum, forgetting impurity in prayer, forgetting a prayer, and forgetting the intention in fasting. Opinions differ on each, and the entry gives each school's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15693} In fasting, forgetting the intention or intercourse during a fast of consecutive expiation may break the sequence in some schools. Forgetfully eating or drinking during Ramadan does not break the fast for the Hanafis and the Shafi'is, while the Malikis hold that it does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15702} In prayer, forgetting talk or eating is excused in small amounts by most schools, while the Hanafis void the prayer on any such act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} On divorce and oaths, the Hanafis, Shafi'is and Hanbalis hold that the divorce of a forgetful man takes effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15704} Forgetting gives no excuse in the liability for destroyed property or injury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15705}"
  ur: "نسیان لغت میں یاد رکھنے کی ضد ہے، اور اصطلاح میں ضرورت کے وقت کسی چیز کا یاد نہ آنا ہے۔ خطأ اس کام کو کہتے ہیں جس میں انسان کا قصد نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} شافعیہ اور حنابلہ کے نزدیک صحیح قول میں ناسی نسیان کی حالت میں مکلف نہیں ہوتا، جبکہ حنفیہ کے نزدیک اللہ کے حق میں نسیان عذر بن سکتا ہے اور بندوں کے حق میں نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15688} آخرت میں نسیان گناہ کو ساقط کرتا ہے، لیکن دنیا میں نقصان کا ضمان باقی رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15690} صوم، نماز اور طلاق کے کئی فروع میں مذاہب کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15704}"
