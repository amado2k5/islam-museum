label: { ar: "النِّسْيَان", en: "Forgetfulness (nisyan) and its legal effects", ur: "نسیان اور اس کے احکام", es: "El olvido (nisyan) y sus efectos legales", fr: "L'oubli (nisyan) et ses effets juridiques" }
summary:
  ar: "النسيان في اللغة ضد الذكر والحفظ، ويأتي بمعنى الترك والتأخير، واصطلاحاً عدم تذكر الشيء وقت الحاجة إليه، ويفرّق عن الخطأ بأن الخطأ ما لا قصد للإنسان فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} وذهب الشافعية والحنابلة في الصحيح إلى أن الناسي غير مكلف حال نسيانه، وذهب الحنفية إلى أن النسيان لا ينافي الوجوب في حق الله، وقد يصلح عذراً فيه، ولا يُعذر في حقوق العباد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15688} والمالكية يفرّقون بين نسيان العبادات، وهو غير قادح، والجهل وهو قادح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15689} والنسيان يسقط الإثم في الآخرة باتفاق، أما في الدنيا فما ترك من مأمور يجب تداركه، وما أتلف يبقى ضمانه، وما كان فيه عقوبة يكون النسيان شبهة في إسقاطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15690} ومن الفروع: نسيان التسمية في الوضوء والصلاة والنجاسة والتيمم عند نسيان الماء، وفيها أقوال مختلفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15693} وفي الصوم يقطع النسيان التتابع عند بعض المذاهب في النية والوطء في الظهار، ولا يفطر الناسي عند الحنفية والشافعية والمالكية في الأكل والشرب على اختلاف بينهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15702} وفي الصلاة يُبطلها الكلام الكثير والأكل الكثير عند الحنفية ولا يُبطلها اليسير عند غيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} وفي الطلاق والأيمان يقع طلاق الناسي عند الحنفية والشافعية والحنابلة في المذهب، ويقع المعلّق على فعل ناسياً عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15704} ولا أثر للنسيان في ضمان المتلفات والجنايات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15705}"
  en: "Nisyan in the lexicon is the opposite of remembering or retaining, and it also means leaving aside or delaying. As a term it is failing to recall a thing when one needs it, and it is distinguished from error (khata'), which is a thing one did not intend. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} The Shafi'is and Hanbalis hold, in the sound view, that the forgetful person is not accountable while he forgets. The Hanafis hold that forgetting does not cancel the duty owed to God but may be an excuse in God's rights, and is no excuse in the rights of people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15688} The Malikis hold that forgetting in acts of worship does not harm the act, while ignorance does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15689} All agree that forgetting removes sin in the next world. In this world, an omitted command must be made up, harm done in forgetting still requires compensation, and forgetting may be a doubt that lifts a penalty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15690} Among the applications are forgetting the basmala in ablution and prayer, forgetting water when making tayammum, forgetting impurity in prayer, forgetting a prayer, and forgetting the intention in fasting. Opinions differ on each, and the entry gives each school's view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15693} In fasting, forgetting the intention or intercourse during a fast of consecutive expiation may break the sequence in some schools. Forgetfully eating or drinking during Ramadan does not break the fast for the Hanafis and the Shafi'is, while the Malikis hold that it does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15702} In prayer, forgetting talk or eating is excused in small amounts by most schools, while the Hanafis void the prayer on any such act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} On divorce and oaths, the Hanafis, Shafi'is and Hanbalis hold that the divorce of a forgetful man takes effect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15704} Forgetting gives no excuse in the liability for destroyed property or injury. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15705}"
  ur: "نسیان لغت میں یاد رکھنے کی ضد ہے، اور اصطلاح میں ضرورت کے وقت کسی چیز کا یاد نہ آنا ہے۔ خطأ اس کام کو کہتے ہیں جس میں انسان کا قصد نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} شافعیہ اور حنابلہ کے نزدیک صحیح قول میں ناسی نسیان کی حالت میں مکلف نہیں ہوتا، جبکہ حنفیہ کے نزدیک اللہ کے حق میں نسیان عذر بن سکتا ہے اور بندوں کے حق میں نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15688} آخرت میں نسیان گناہ کو ساقط کرتا ہے، لیکن دنیا میں نقصان کا ضمان باقی رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15690} صوم، نماز اور طلاق کے کئی فروع میں مذاہب کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15704}"
  es: "Nisyan en el léxico es lo opuesto a recordar o retener, y también significa dejar de lado o retrasar. Como término, es no recordar algo cuando se necesita, y se distingue del error (khata'), que es algo que no se pretendía. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} Los shafi'ís y los hanbalíes sostienen, en la opinión correcta, que la persona olvidadiza no es responsable mientras olvida. Los hanafíes sostienen que el olvido no anula el deber para con Dios, pero puede ser una excusa en los derechos de Dios, y no es una excusa en los derechos de las personas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15688} Los malikíes sostienen que el olvido en los actos de adoración no daña el acto, mientras que la ignorancia sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15689} Todos están de acuerdo en que el olvido elimina el pecado en el otro mundo. En este mundo, un mandato omitido debe ser compensado, el daño causado por el olvido aún requiere compensación, y el olvido puede ser una duda que levanta una pena. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15690} Entre las aplicaciones están olvidar la basmala en la ablución y la oración, olvidar el agua al hacer tayammum, olvidar la impureza en la oración, olvidar una oración y olvidar la intención en el ayuno. Las opiniones difieren en cada caso, y la entrada presenta la postura de cada escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15693} En el ayuno, olvidar la intención o el acto sexual durante un ayuno de expiación consecutiva puede romper la secuencia en algunas escuelas. Olvidar comer o beber durante el Ramadán no rompe el ayuno para los Hanafi y los Shafi'i, mientras que los Maliki sostienen que sí. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15697} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15698} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15702} En la oración, la mayoría de las escuelas excusan el olvido de hablar o comer en pequeñas cantidades, mientras que los Hanafis anulan la oración en tal acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} Sobre el divorcio y los juramentos, los Hanafis, Shafi'is y Hanbalis sostienen que el divorcio de un hombre olvidadizo surte efecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15704} El olvido no da excusa en la responsabilidad por daños o propiedad destruida. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15705}"
  fr: "Dans le lexique, « nisyan » est l'antonyme de « se souvenir » ou « retenir », et signifie également « mettre de côté » ou « retarder ». Ce terme désigne l'incapacité à se rappeler quelque chose lorsqu'on en a besoin, et se distingue de l'erreur (« khata' »), qui est une action involontaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} Les écoles chaféite et hanbalite considèrent, de manière équilibrée, que la personne oublieuse n'est pas responsable tant qu'elle oublie. Les hanafites estiment que l'oubli n'annule pas le devoir envers Dieu, mais peut constituer une excuse à l'égard de Dieu, et non une excuse à l'égard des personnes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15688} Les Malikites estiment qu'oublier un acte d'adoration ne le compromet pas, contrairement à l'ignorance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15689} Tous s'accordent à dire qu'oublier efface le péché dans l'au-delà. Dans ce monde, un commandement omis doit être rattrapé, le préjudice causé par l'oubli exige une réparation, et l'oubli peut constituer un doute qui lève une sanction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15690} Parmi les applications, on peut citer l'oubli de la basmala lors des ablutions et de la prière, l'oubli de l'eau lors du tayammum, l'oubli d'une impureté lors de la prière, l'oubli d'une prière et l'oubli de l'intention lors du jeûne. Les avis divergent sur chaque point, et cet article présente le point de vue de chaque école. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15693} Dans le jeûne, oublier son intention ou avoir des relations sexuelles pendant un jeûne d'expiation consécutif peut rompre la séquence selon certaines écoles. Manger ou boire par oubli pendant le Ramadan ne rompt pas le jeûne pour les hanafites et les chaféites, tandis que les malikites considèrent que c'est le cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15697} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15702} Dans la prière, l'oubli de parler ou de manger est excusé en petite quantité par la plupart des écoles, tandis que les Hanafis annulent la prière pour un tel acte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15701} Concernant le divorce et les serments, les Hanafis, Shafi'is et Hanbalis soutiennent que le divorce d'un homme oublieux prend effet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15704} L'oubli ne donne aucune excuse quant à la responsabilité pour les biens détruits ou les blessures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15705}"
