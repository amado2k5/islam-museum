label:
  ar: "لاعية"
  en: "La'iya (a milky spurge-like tree)"
  ur: "لاعیہ"
  es: "La'iya (un árbol parecido a un tártago lechoso)"
  fr: "La'iya (un arbre ressemblant à une euphorbe laiteuse)"
summary:
  ar: "اللاعية شجرة سفحية لها ورد قليل الطيب يرعاه النحل، وهي من اليتوعات، قوتها مناسبة لفراسيون وأضعف، حارة يابسة في الثانية، تقيء بقوة وتسهل الماء {cite:canon-ibn-sina-print-v1 p.539}."
  en: "La'iya is a foothill tree with a faintly fragrant flower grazed by bees, one of the spurges, with a power like that of marrubium but weaker; hot and dry in the second degree, it makes one vomit strongly and loosens water {cite:canon-ibn-sina-print-v1 p.539}."
  ur: "لاعیہ دامنِ کوہ کا درخت ہے جس کا پھول ہلکا خوشبودار ہے اور شہد کی مکھیاں اسے چرتی ہیں، یتوعات میں سے ہے، اس کی قوت فراسیون کے مناسب مگر کمزور؛ دوسرے درجے میں گرم اور خشک، شدت سے قے کراتا اور پانی خارج کرتا ہے {cite:canon-ibn-sina-print-v1 p.539}۔"
  es: "La'iya es un árbol de las estribaciones con una flor ligeramente fragante que es pastoreada por abejas, una de las euforbias, con un poder similar al del marrubio pero más débil; caliente y seco en segundo grado, provoca fuertes vómitos y afloja el agua {cite:canon-ibn-sina-print-v1 p.539}."
  fr: "La'iya est un arbre de piémont à la fleur légèrement parfumée, butinée par les abeilles, une des euphorbes, avec un pouvoir semblable à celui du marrube mais plus faible; chaud et sec au deuxième degré, il provoque de forts vomissements et détache l'eau {cite:canon-ibn-sina-print-v1 p.539}."
