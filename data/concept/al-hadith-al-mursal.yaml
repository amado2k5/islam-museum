    stance: { ar: "يُقبل إن اعتضد", en: "Accepted if supported", ur: "تائید ہو تو مقبول" }
    summary: { ar: "الشافعي: يُقبل إن اعتضد بمجيئه من وجه آخر يباين الطريق الأولى، مسنداً أو مرسلاً، ليرجح احتمال كون المحذوف ثقة.", en: "Al-Shafi'i: it is accepted if supported by its coming through another route distinct from the first, with a full chain or loosely attributed, making it likelier that the omitted narrator was trustworthy.", ur: "شافعی: اگر کسی دوسرے طریق سے، جو پہلے سے مختلف ہو، مسند یا مرسل آ کر اسے تائید ملے تو مقبول ہے، تاکہ محذوف کے ثقہ ہونے کا احتمال راجح ہو۔" }
