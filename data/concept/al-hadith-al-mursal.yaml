id: concept/al-hadith-al-mursal
class: concept
kind: term
label: { ar: "الحديث المرسل", en: "The loosely attributed report (mursal)", ur: "مرسل حدیث" }
summary:
  ar: "المرسل عند ابن حجر ما سقط من آخر إسناده من بعد التابعي، بأن يقول التابعي: قال رسول الله كذا؛ ويُردّ للجهل بحال المحذوف، واختلف في الاحتجاج به إذا عُرف أن التابعي لا يرسل إلا عن ثقة: فتوقف جمهور المحدثين، وقبله المالكيون والكوفيون مطلقاً، وقبله الشافعي إذا اعتضد {cite:nuzhat-al-nazar-itr-bushra-2011 p. 78-79}."
  en: "For Ibn Hajar the loosely attributed report (mursal) is one from whose chain the link after the Successor has dropped, the Successor saying 'The Messenger of God said...'; it is rejected because the omitted narrator is unknown, and scholars differed on using it when the Successor is known to omit only trustworthy narrators: most hadith scholars suspended judgement, the Malikis and Kufans accepted it outright, and al-Shafi'i accepted it when supported {cite:nuzhat-al-nazar-itr-bushra-2011 p. 78-79}."
  ur: "ابن حجر کے نزدیک مرسل وہ ہے جس کی سند کے آخر سے تابعی کے بعد کا راوی ساقط ہو، یعنی تابعی کہے: 'رسول اللہ نے فرمایا...'؛ محذوف کی حالت نامعلوم ہونے سے یہ رد ہوتا ہے، اور جب معلوم ہو کہ تابعی صرف ثقہ سے ارسال کرتا ہے تو اس سے استدلال میں اختلاف ہے: جمہور محدثین نے توقف کیا، مالکیوں اور کوفیوں نے مطلقاً قبول کیا، اور شافعی نے تائید ملنے پر قبول کیا {cite:nuzhat-al-nazar-itr-bushra-2011 p. 78-79}۔"
