    stance: { ar: "التوقف لبقاء الاحتمال", en: "Suspension, since the uncertainty remains", ur: "احتمال باقی رہنے کی وجہ سے توقف" }
    summary: { ar: "جمهور المحدثين، وهو أحد قولي أحمد: إذا عُرف من عادة التابعي أنه لا يرسل إلا عن ثقة، يُتوقف فيه لبقاء الاحتمال.", en: "Most hadith scholars, and one of Ahmad's two views: even when the Successor is known to omit only trustworthy narrators, judgement is suspended because the uncertainty remains.", ur: "جمہور محدثین، اور احمد کے دو اقوال میں سے ایک: اگر تابعی کی عادت معلوم ہو کہ وہ صرف ثقہ سے ارسال کرتا ہے تب بھی احتمال باقی رہنے کی وجہ سے توقف کیا جاتا ہے۔" }
