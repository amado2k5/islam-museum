    stance: { ar: "يُقبل مطلقاً", en: "Accepted outright", ur: "مطلقاً مقبول" }
    summary: { ar: "المالكيون والكوفيون، وهو القول الثاني لأحمد: يُقبل مطلقاً.", en: "The Malikis and the Kufans, and Ahmad's second view: it is accepted outright.", ur: "مالکی اور کوفی، اور احمد کا دوسرا قول: مطلقاً مقبول ہے۔" }
    sources: [source/nuzhat-al-nazar-itr-bushra-2011]
  - tradition: sunni
