id: concept/dhahab-fiqh
class: concept
kind: legal
label:
  ar: "الذهب ⁦(في الفقه)⁩"
  en: "Gold (dhahab) in the rulings"
  ur: "سونا ⁦(فقہی احکام)⁩"
  es: "El oro (dhahab) en las normas"
  fr: "L'or (dhahab) dans les décisions"
  tr: "Altın (hukuk alanında)"
  id: "Emas (dalam yurisprudensi)"
summary:
  ar: "الذهب معدن معروف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487} ويحرم على الرجال لبس الحلي من الذهب والتختم به إلا لضرورة كالأنف والسن، ويحل للنساء التحلي به، ويحرم الأكل والشرب من آنية الذهب والفضة، وتجب فيه الزكاة، ولا يجوز بيع الذهب بالذهب إلا يدا بيد ومثلا بمثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8494} وتقطع اليد في سرقة ربع دينار فصاعدا عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8497}"
  en: "Gold is a known metal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487} Men are forbidden to wear gold ornaments or a gold ring, except from necessity, such as a gold nose or tooth; women may wear gold; eating and drinking from gold vessels is forbidden; zakat is due on it; and gold may be exchanged for gold only hand to hand and weight for weight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8494} The majority set the threshold for the amputation of a thief at a quarter of a dinar of gold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8497}"
  ur: "سونا ایک معروف دھات ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487} مردوں کے لیے سونے کے زیورات حرام ہیں سوائے ضرورت کے، اور عورتوں کے لیے حلال ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8491} سونے کی زکوٰۃ واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8494}"
  es: "El oro es un metal conocido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487} A los hombres les está prohibido usar adornos de oro o un anillo de oro, excepto por necesidad, como una nariz o un diente de oro; las mujeres pueden usar oro; está prohibido comer y beber en recipientes de oro; se debe pagar zakat sobre él; y el oro solo se puede intercambiar por oro de mano en mano y peso por peso. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8488} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8490} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8491} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8494} La mayoría fijó el umbral para la amputación de un ladrón en un cuarto de dinar de oro. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8497}"
  fr: "L'or est un métal connu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487} Il est interdit aux hommes de porter des ornements ou une bague en or, sauf en cas de nécessité, comme un nez ou une dent en or; les femmes peuvent porter de l'or; il est interdit de manger et de boire dans des récipients en or; la zakat est due sur cela; et l'or ne peut être échangé contre de l'or que de main à main et au poids pour poids. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8494} La majorité a fixé le seuil d'amputation d'un voleur à un quart de dinar d'or. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8497}"
  tr: "Altın iyi bilinen bir metaldir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8487} Erkeklerin altın takı takması ve takması sadece burun ve diş gibi zorunluluklarda yasaktır. Kadınların kendilerini bu takıyla süslemeleri izinlidir. Altın ve gümüş kaplardan yemek ve içmek yasaktır, zekat üzerinde zorunludur ve altın sadece el ele veya örneğin satılabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8494} ve el, halkın önünde çeyrek dinar veya daha fazlasını çaldığı için kesilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8497}"
  id: "Emas adalah logam yang terkenal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8487} Dilarang bagi pria mengenakan perhiasan emas dan memakainya kecuali jika perlu seperti hidung dan gigi. Wanita diperbolehkan menghias diri dengan perhiasan itu. Makan dan minum dari wadah emas dan perak dilarang, zakat wajib didapat, dan emas hanya boleh dijual secara langsung atau misalnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8494} dan tangan itu dipotong karena mencuri seperempat dinar atau lebih di depan publik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8497}"
