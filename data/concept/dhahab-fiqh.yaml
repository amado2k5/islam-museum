id: concept/dhahab-fiqh
class: concept
kind: legal
label:
  ar: "الذهب (في الفقه)"
  en: "Gold (dhahab) in the rulings"
  ur: "سونا (فقہی احکام)"
summary:
  ar: "الذهب معدن معروف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487} ويحرم على الرجال لبس الحلي من الذهب والتختم به إلا لضرورة كالأنف والسن، ويحل للنساء التحلي به، ويحرم الأكل والشرب من آنية الذهب والفضة، وتجب فيه الزكاة، ولا يجوز بيع الذهب بالذهب إلا يدا بيد ومثلا بمثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8494} وتقطع اليد في سرقة ربع دينار فصاعدا عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8497}"
  en: "Gold is a known metal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487} Men are forbidden to wear gold ornaments or a gold ring, except from necessity, such as a gold nose or tooth; women may wear gold; eating and drinking from gold vessels is forbidden; zakat is due on it; and gold may be exchanged for gold only hand to hand and weight for weight. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8492} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8494} The majority set the threshold for the amputation of a thief at a quarter of a dinar of gold. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8497}"
  ur: "سونا ایک معروف دھات ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487} مردوں کے لیے سونے کے زیورات حرام ہیں سوائے ضرورت کے، اور عورتوں کے لیے حلال ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8491} سونے کی زکوٰۃ واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8494}"
