summary:
  ar: "غالية في الكتاب دواء معروف، وتعليق المحقق أنه دواء مركب؛ تلين الأورام الصلبة، وشمها ينفع المصروع وينعشه ويسكن الصداع البارد ويفرح القلب؛ وفيها نقل موسوم عن الرحم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.727}"
  en: "Ghaliya is in the book a known drug, and the editor's note says it is a compound drug; it softens hard swellings, and smelling it benefits the epileptic and revives him, calms cold headache and gladdens the heart; it has a labelled listing on the womb in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.727}"
  ur: "غالیہ کتاب میں ایک معروف دوا ہے، اور محقق کا حاشیہ کہتا ہے کہ یہ مرکب دوا ہے؛ یہ سخت ورموں کو نرم کرتی ہے، اور اسے سونگھنا مرگی والے کو فائدہ دیتا اور اسے تازہ دم کرتا ہے، ٹھنڈے سردرد کو سکون دیتا ہے اور دل کو خوش کرتا ہے؛ رحم کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.727}۔"
  es: "En el libro, Ghaliya es un fármaco conocido, y la nota del editor indica que es un fármaco compuesto; suaviza las hinchazones duras, y su aroma beneficia al epiléptico y lo reanima, calma el dolor de cabeza por frío y alegra el corazón; tiene una mención en el útero en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.727}."
  fr: "Le ghaliya est mentionné dans le livre comme un médicament connu, et la note de l'éditeur précise qu'il s'agit d'une préparation composée; il ramollit les gonflements durs, et son inhalation est bénéfique pour l'épileptique, le rajeunit, calme les maux de tête dus au froid et réjouit le cœur; il figure dans une section du livre réservée à la décision du fondateur {cite:canon-ibn-sina-print-v1 p.727}"
