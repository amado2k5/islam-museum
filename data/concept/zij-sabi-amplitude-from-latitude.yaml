id: concept/zij-sabi-amplitude-from-latitude
class: concept
kind: scientific
label: { ar: "سعة المشرق من عرض البلد في الزيج الصابي", en: "The rising amplitude from the latitude", ur: "عرض البلد سے مشرق کی وسعت" }
summary:
  ar: "يعلّم البتاني، في ختام الباب السابع، كيف يُعرف بعد مطلع أي درجة ومغيبها عن مطلع أول الحمل ومغيبه في دائرة الأفق إذا كان عرض البلد مفروضاً: يُنقص العرض من تسعين فيبقى ارتفاع أول الحمل، فيُعرف وتره، ثم يُؤخذ ميل الدرجة المطلوبة ووتره، ويُضرب في نصف القطر، ويُقسم الحاصل على وتر ارتفاع أول الحمل، فيكون قوس الحاصل هو البعد. {cite:zij-sabi-nallino-byblion p.34}."
  en: "At the end of chapter 7 al-Battani teaches how to find the distance of the rising and setting of any degree from the rising and setting of the first of Aries on the horizon circle when the latitude is given: the latitude is taken from ninety, leaving the altitude of the first of Aries, whose chord is found; then the declination of the wanted degree and its chord are taken, multiplied by the radius and divided by the chord of the altitude of the first of Aries, and the arc of the result is the distance. {cite:zij-sabi-nallino-byblion p.34}."
  ur: "ساتویں باب کے آخر میں البتانی سکھاتے ہیں کہ جب شہر کا عرض فرض ہو تو دائرۂ افق پر کسی بھی درجے کے مطلع و مغرب کا رأس الحمل کے مطلع و مغرب سے فاصلہ کیسے معلوم ہو: عرض نوے میں سے گھٹایا جاتا ہے تو رأس الحمل کی بلندی بچتی ہے، اس کا وتر معلوم کیا جاتا ہے؛ پھر مطلوبہ درجے کا میل اور اس کا وتر لے کر نصف قطر سے ضرب دیا جاتا ہے اور حاصل کو رأس الحمل کی بلندی کے وتر پر تقسیم کیا جاتا ہے، اور حاصل کی قوس ہی فاصلہ ہے۔ {cite:zij-sabi-nallino-byblion p.34}۔"
