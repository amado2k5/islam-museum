label:
  ar: "اللِّواط"
  en: "Sodomy (liwat), fiqh rulings"
  ur: "لواطت، فقہی احکام"
summary:
  ar: "اللواط لغة مصدر لاط، ومعناه عمل عمل قوم لوط، واصطلاحاً إيلاج ذكر في دبر ذكر أو أنثى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13710}. واتفق الفقهاء على تحريمه وأنه من أغلظ الفواحش، وذم القرآن فعل قوم لوط في سورتي الأعراف والشعراء، وعدّ الحديث ملعوناً من عمل عمل قوم لوط {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711}. وتختلف المذاهب في عقوبته: الجمهور على حد الزنا، وأبو حنيفة على التعزير، والمالكية على الرجم للفاعل والمفعول به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711-13712}."
  en: "Liwat, in lexicon, is the verbal noun of the root for acting as the people of Lot did; in technical use it is the insertion of a male's member into the anus of a male or a female {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13710}. The jurists agree it is forbidden and one of the gravest abominations; the Qur'an condemns the people of Lot in surat al-A'raf and surat al-Shu'ara, and a hadith curses one who does their deed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711}. The schools differ on its penalty: most apply the penalty of unlawful intercourse, Abu Hanifa applies discretionary punishment, and the Malikis stone both parties {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711-13712}."
  ur: "لواط لغت میں لاط کا مصدر ہے، یعنی قومِ لوط کا عمل کرنا؛ اصطلاح میں یہ مرد کی شرمگاہ کو کسی مرد یا عورت کی دبر میں داخل کرنا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13710}۔ فقہاء کا اتفاق ہے کہ یہ حرام اور بڑی فحاشی ہے؛ قرآن نے سورۂ اعراف اور سورۂ شعراء میں قومِ لوط کے عمل کی مذمت کی ہے، اور حدیث میں اس عمل کے مرتکب پر لعنت آئی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711}۔ سزا میں مذاہب مختلف ہیں: جمہور زنا کی حد لگاتے ہیں، ابو حنیفہ تعزیر کے قائل ہیں، اور مالکیہ فاعل اور مفعول دونوں کو سنگسار کرتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711-13712}۔"
