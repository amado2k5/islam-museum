  tr: "Sodomi"
  id: "Sodomi"
summary:
  ar: "اللواط لغة مصدر لاط، ومعناه عمل عمل قوم لوط، واصطلاحاً إيلاج ذكر في دبر ذكر أو أنثى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13710}. واتفق الفقهاء على تحريمه وأنه من أغلظ الفواحش، وذم القرآن فعل قوم لوط في سورتي الأعراف والشعراء، وعدّ الحديث ملعوناً من عمل عمل قوم لوط {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711}. وتختلف المذاهب في عقوبته: الجمهور على حد الزنا، وأبو حنيفة على التعزير، والمالكية على الرجم للفاعل والمفعول به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711-13712}."
  en: "Liwat, in lexicon, is the verbal noun of the root for acting as the people of Lot did; in technical use it is the insertion of a male's member into the anus of a male or a female {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13710}. The jurists agree it is forbidden and one of the gravest abominations; the Qur'an condemns the people of Lot in surat al-A'raf and surat al-Shu'ara, and a hadith curses one who does their deed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711}. The schools differ on its penalty: most apply the penalty of unlawful intercourse, Abu Hanifa applies discretionary punishment, and the Malikis stone both parties {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711-13712}."
  ur: "لواط لغت میں لاط کا مصدر ہے، یعنی قومِ لوط کا عمل کرنا؛ اصطلاح میں یہ مرد کی شرمگاہ کو کسی مرد یا عورت کی دبر میں داخل کرنا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13710}۔ فقہاء کا اتفاق ہے کہ یہ حرام اور بڑی فحاشی ہے؛ قرآن نے سورۂ اعراف اور سورۂ شعراء میں قومِ لوط کے عمل کی مذمت کی ہے، اور حدیث میں اس عمل کے مرتکب پر لعنت آئی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711}۔ سزا میں مذاہب مختلف ہیں: جمہور زنا کی حد لگاتے ہیں، ابو حنیفہ تعزیر کے قائل ہیں، اور مالکیہ فاعل اور مفعول دونوں کو سنگسار کرتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711-13712}۔"
  es: "Liwat, en léxico, es el sustantivo verbal de la raíz que significa actuar como lo hicieron los habitantes de Lot; en uso técnico, es la inserción del miembro de un hombre en el ano de un hombre o una mujer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13710}. Los juristas coinciden en que está prohibido y es una de las abominaciones más graves; el Corán condena a los habitantes de Lot en la sura Al-A'raf y la sura Al-Shu'ara, y un hadiz maldice a quien realiza su acto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711}. Las escuelas difieren en cuanto a su castigo: la mayoría aplica el castigo de relaciones sexuales ilícitas, Abu Hanifa aplica un castigo discrecional y los Malikis apedrean a ambas partes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711-13712}."
  fr: "Le terme « liwat », dans le lexique, est le nom verbal de la racine désignant l'acte commis par le peuple de Lot; techniquement, il désigne la pénétration anale d'un homme ou d'une femme (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13710). Les juristes s'accordent à dire que cet acte est interdit et considéré comme une abomination parmi les plus graves; le Coran condamne le peuple de Lot dans les sourates al-A'raf et al-Shu'ara, et un hadith maudit celui qui commet leur acte (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13711). Les écoles divergent quant à la peine infligée: la plupart appliquent la peine de relations sexuelles illicites, Abu Hanifa applique une peine discrétionnaire et les Malikites lapident les deux parties {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13711-13712}."
  tr: "Dilsel olarak sodomi 'lat' fiil isimidir,, Lut halkının eylemi anlamına gelir ve teknik olarak bir erkeğin ya da kadının anüsüne nüfuz etmesidir {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.13710}. Hukukçular oybirliğiyle yasakladı ve bunun en ağır ahlaksızlıklardan biri olduğunu belirttiler; Kur'an, Lut halkının eylemini Al-A'raf ve Ash-Shu'ara bölümlerinde kınadı, hadisi Lut halkının eylemi yüzünden lanetli saydı {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13711}. Okullar cezası açısından farklılık gösterir: çoğunluğu zina cezasına, Ebu Hanife takdire bağlı cezaya göre, Malikler ise işleyenin taşlanması ve nesne ile ilgili {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13711-13712}."
  id: "Secara linguistik, sodomi adalah kata benda verbal 'lat,' yang berarti tindakan orang-orang Lot, dan secara teknis adalah penetrasi pria atau wanita di anus {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13710}. Para ahli hukum secara bulat melarangnya, menyatakan bahwa itu termasuk salah satu ketidakmoralan yang paling berat, dan Al-Qur'an mengutuk tindakan umat Lot dalam pasal Al-A'raf dan Ash-Shu'ara, serta menganggap hadis itu dikutuk atas perbuatan umat Lot {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13711}. Mazhab-mazhab berbeda dalam hukumannya: mayoritas berdasarkan hukuman perselingkuhan, Abu Hanifa berdasarkan hukuman diskresi, dan Malikis mengenai rajam untuk pelaku dan tujuan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13711-13712}."
