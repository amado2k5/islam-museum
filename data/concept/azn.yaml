summary:
  ar: "عزن في الكتاب نبات ينقل عن ديسقوريدوس أن ورقه شبيه بورق العدس الصغير وزهره أحمر، ينبت في أماكن بطيئة معطلة، وورقه يدر العرق مع الزيت ويحلل الخراجات والبثور الملتهبة، ويشرب بالشراب لتقطير البول {cite:canon-ibn-sina-print-v1 p.623}"
  en: "Azn is in the book a plant whose leaf, as reported from Dioscorides, is like the leaf of the small lentil and whose flower is red, growing in neglected, idle places; its leaf with oil brings sweat and dissolves abscesses and inflamed pustules, and drunk with wine it is used for dribbling of urine {cite:canon-ibn-sina-print-v1 p.623}"
  ur: "عزن کتاب میں ایک پودا ہے جس کے پتے، دیسقوریدوس سے نقل کے مطابق، چھوٹے عدس کے پتوں جیسے اور پھول سرخ ہے، اور یہ سست اور ویران جگہوں میں اگتا ہے؛ اس کے پتے تیل کے ساتھ پسینہ لاتے اور پھوڑوں اور سوجی ہوئی پھنسیوں کو تحلیل کرتے ہیں، اور شراب کے ساتھ پیشاب کے قطرے قطرے آنے میں پیا جاتا ہے {cite:canon-ibn-sina-print-v1 p.623}۔"
