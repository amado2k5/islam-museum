summary:
  ar: "بقرة سأل موسى قومه عن صفتها حتى ضاقت عليهم صفاتها: لا فارض ولا بكر عوان بين ذلك صفراء فاقع لونها تسر الناظرين، فذبحوها وما كادوا يفعلون وضربوا القتيل ببعضها فنبّأتهم بما كانوا يكتمون."
  en: "The cow Moses' people questioned until its description grew narrow upon them: neither old nor young but middling, bright yellow, pleasing to beholders; they slaughtered it though they nearly did not, struck the dead man with part of it and he named his killer."
  ur: "وہ گائے جس کے بارے میں موسیٰ کی قوم نے اتنے سوال پوچھے کہ صفات ان پر تنگ ہو گئیں: نہ بوڑھی نہ بچھڑی بلکہ درمیانی چمکدار زرد جو دیکھنے والوں کو بھائے؛ انہوں نے قریب تھا نہ ذبح کریں، مقتول کو اس کے ایک ٹکڑے سے مارا اور اس نے قاتل کا نام بتا دیا۔"
