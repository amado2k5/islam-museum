label:
  ar: "بقرة بني إسرائيل"
  en: "The cow of Baqarah"
  ur: "بنی اسرائیل کی گائے"
  es: "La vaca de Baqarah"
  fr: "La vache de Baqarah"
summary:
  ar: "بقرة سأل موسى قومه عن صفتها حتى ضاقت عليهم صفاتها: لا فارض ولا بكر عوان بين ذلك صفراء فاقع لونها تسر الناظرين، فذبحوها وما كادوا يفعلون وضربوا القتيل ببعضها فنبّأتهم بما كانوا يكتمون."
  en: "The cow Moses' people questioned until its description grew narrow upon them: neither old nor young but middling, bright yellow, pleasing to beholders; they slaughtered it though they nearly did not, struck the dead man with part of it and he named his killer."
  ur: "وہ گائے جس کے بارے میں موسیٰ کی قوم نے اتنے سوال پوچھے کہ صفات ان پر تنگ ہو گئیں: نہ بوڑھی نہ بچھڑی بلکہ درمیانی چمکدار زرد جو دیکھنے والوں کو بھائے؛ انہوں نے قریب تھا نہ ذبح کریں، مقتول کو اس کے ایک ٹکڑے سے مارا اور اس نے قاتل کا نام بتا دیا۔"
  es: "La vaca que el pueblo de Moisés interrogó hasta que su descripción se volvió precisa: ni vieja ni joven, sino de tamaño mediano, de un amarillo brillante, agradable a la vista; la sacrificaron aunque casi no lo hicieron, golpearon al muerto con un trozo de ella y este nombró a su asesino."
  fr: "Le peuple de Moïse s'interrogea sur la vache jusqu'à ce que sa description devienne plus précise: ni vieille ni jeune, mais d'âge moyen, d'un jaune éclatant, agréable à regarder; ils l'égorgeèrent, bien qu'ils aient failli ne pas le faire, frappèrent le mort avec une partie de la bête et celui-ci nomma son meurtrier."
