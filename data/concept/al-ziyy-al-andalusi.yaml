label: { ar: "زي أهل الأندلس وتدبيرهم" }
kind: social
summary:
  ar: "صفة ابن سعيد لزي أهل الأندلس وتدبيرهم في المعاش: الغالب عليهم ترك العمائم لا سيما في شرق الأندلس وأهل غربها لا يرى فيهم قاض ولا فقيه إلا بعمامة، وكثيراً ما يترى سلاطينهم وأجنادهم بزي النصارى المجاورين لهم فسلاحهم وأقبيتهم من الإشكرلاط وأعلامهم وسروجهم كأعلامهم، ومحاربتهم بالتراس والرماح الطويلة ولا يعرفون الدبابيس ولا قسي العرب بل يعلون قسي الإفرنج، ولا تجد فيهم من يمشي دون طيلسان ولا يضعه على رأسه إلا الأشياخ المعظمون، وغفائر الصوف يلبسونها حمراً وخضراً والصفر مخصوصة باليهود ولا سبيل إلى يهودي أن يتعمم، والذؤابة لا يرخيها إلا العالم، وهم أشد خلق الله اعتناء بنظافة ما يلبسون ومنهم من يطوي يومه صائماً ويبتاع صابوناً يغسل به ثيابه {cite:nafh-tib-maqqari p. 258-260}."
  en: "Ibn Sa'id's ethnography of Andalusi dress: turbans rare in the east and reserved in the west for qadis and fuqaha', rulers and soldiers dressed and armed like their Christian neighbours — scarlet cloaks, long spears, Frankish crossbows, no maces or Arab bows — the taylasan for everyone but set on the head only by venerable elders, wool caps red and green while yellow was reserved for Jews who might not wear the turban at all, the scholar's sidelocks, and a scrupulous cleanliness for which a poor man would fast to buy soap {cite:nafh-tib-maqqari p. 258-260}."
