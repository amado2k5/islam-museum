summary:
  ar: "صفة ابن سعيد لزي أهل الأندلس وتدبيرهم في المعاش: الغالب عليهم ترك العمائم لا سيما في شرق الأندلس وأهل غربها لا يرى فيهم قاض ولا فقيه إلا بعمامة، وكثيراً ما يترى سلاطينهم وأجنادهم بزي النصارى المجاورين لهم فسلاحهم وأقبيتهم من الإشكرلاط وأعلامهم وسروجهم كأعلامهم، ومحاربتهم بالتراس والرماح الطويلة ولا يعرفون الدبابيس ولا قسي العرب بل يعلون قسي الإفرنج، ولا تجد فيهم من يمشي دون طيلسان ولا يضعه على رأسه إلا الأشياخ المعظمون، وغفائر الصوف يلبسونها حمراً وخضراً والصفر مخصوصة باليهود ولا سبيل إلى يهودي أن يتعمم، والذؤابة لا يرخيها إلا العالم، وهم أشد خلق الله اعتناء بنظافة ما يلبسون ومنهم من يطوي يومه صائماً ويبتاع صابوناً يغسل به ثيابه {cite:nafh-tib-maqqari p. 258-260}."
  en: "Ibn Sa'id's ethnography of Andalusi dress: turbans rare in the east and reserved in the west for qadis and fuqaha', rulers and soldiers dressed and armed like their Christian neighbours — scarlet cloaks, long spears, Frankish crossbows, no maces or Arab bows — the taylasan for everyone but set on the head only by venerable elders, wool caps red and green while yellow was reserved for Jews who might not wear the turban at all, the scholar's sidelocks, and a scrupulous cleanliness for which a poor man would fast to buy soap {cite:nafh-tib-maqqari p. 258-260}."
  fr: "L’ethnographie du vêtement andalou par Ibn Sa’id : turbans rares dans l’est et réservés dans l’ouest aux cadis et aux fuqaha’, souverains et soldats vêtus et armés comme leurs voisins chrétiens (manteaux écarlates, longues lances, arbalètes franques, ni masses ni arcs arabes), le taylasan pour tous mais posé sur la tête seulement par les anciens vénérables, des bonnets de laine rouges et verts tandis que le jaune était réservé aux juifs, qui ne pouvaient porter le turban en aucun cas, les mèches du savant, et une propreté scrupuleuse pour laquelle un pauvre jeûnait afin d’acheter du savon {cite:nafh-tib-maqqari p. 258-260}."
  es: "Etnografía de Ibn Sa'id sobre la vestimenta andalusí: turbantes raros en el este y reservados en el oeste para cadíes y fuqaha', gobernantes y soldados vestidos y armados como sus vecinos cristianos: capas escarlata, lanzas largas, ballestas francas, sin mazas ni arcos árabes; el taylasan para todos, pero colocado en la cabeza solo por ancianos venerables; gorros de lana rojos y verdes, mientras que el amarillo estaba reservado para los judíos que podían no usar turbante en absoluto; las patillas de los eruditos; y una limpieza escrupulosa por la cual un hombre pobre ayunaba para comprar jabón {cite:nafh-tib-maqqari p. 258-260}."
  ur: "ابن سعید کی اندلس کے لباس کی نسلیات: مشرق میں نایاب پگڑیاں اور مغرب میں قادیانیوں اور فقہاء کے لیے مخصوص، حکمران اور سپاہی اپنے عیسائی پڑوسیوں کی طرح ملبوس اور مسلح ہوتے ہیں - سرخ رنگ کے کپڑے، لمبے نیزے، فرینکش کراسبوز، کوئی گدی یا عربی کمانیں نہیں ہوتیں، لیکن صرف بزرگوں کے سروں پر کمانیں ہوتی ہیں۔ اونی ٹوپیاں سرخ اور سبز جبکہ پیلے رنگ ان یہودیوں کے لیے مخصوص تھے جو شاید پگڑی بالکل نہ پہنتے ہوں، عالم کی سائیڈ لاکس، اور ایک بے وقوف صفائی جس کے لیے ایک غریب آدمی صابن خریدنے کے لیے روزہ رکھتا ہے۔ 258-260}۔"
  tr: "İbn Sa'id'in Endülüs halkının giysi ve geçim koşulları hakkındaki tanımı: Çoğunlukla sarıkları terk ettiler, özellikle doğu ve batı el-Endülüs'te; aralarında sadece sarıkla yargıç ya da hukukçu görülürdü. Sultanları ve askerleri genellikle komşu Hristiyanların kıyafetleriyle görülürdü, bu yüzden silahları, aşkarlat ceketleri, sancakları ve eyerleri sancakları gibiydi. Onlarla trans ve uzun mızraklarla savaştılar, iğnelerden ya da Arap rahiplerinden habersiz, Franklar gibi yükseltildiler. Aralarında sarıksız yürüyen ve sadece saygın şeyhlerin başında, yün giysiler giyen kimse yoktur Kırmızı, yeşil ve sarı sadece Yahudilere özgüdür ve bir Yahudi bunu genelleştiremez. Kurt sadece bilgili olanlar tarafından giyer, ve Tanrı'nın yarattığı en dikkatli olanlar giydiklerini temiz tutmaya çalışırlar. Bazıları gündüzlerini oruç tutarak bitirir ve kıyafetlerini yıkamak için sabun alır {cite:nafh-tib-maqqari s. 258-260}."
  id: "Deskripsi Ibn Sa'id tentang pakaian dan kondisi hidup masyarakat Andalusia: Mereka sebagian besar meninggalkan sorban, terutama di al-Andalus timur dan barat; di antara mereka, hanya hakim atau ahli hukum yang mengenakan sorban yang terlihat. Sultan dan tentara sering terlihat mengenakan pakaian orang Kristen tetangga, sehingga senjata mereka, jaket ashkarlat, panji, dan pelana mirip dengan panji mereka. Mereka bertempur dengan trance dan tombak panjang, diangkat seperti orang Franka, tanpa menyadari jarum atau imam Arab. Di antara mereka, tidak ada yang berjalan tanpa sorban dan hanya sheikh yang dihormati yang mengenakan pakaian wol. Merah, hijau, dan kuning adalah unik bagi orang Yahudi, dan seorang Yahudi tidak dapat menggeneralisasi hal ini. Serigala hanya dikenakan oleh yang berpengetahuan, dan yang paling berhati-hati yang diciptakan oleh Tuhan berusaha menjaga kebersihan pakaian mereka. Beberapa mengakhiri hari dengan berpuasa dan membeli sabun untuk mencuci pakaian {cite:nafh-tib-maqqari hlm. 258-260}."
