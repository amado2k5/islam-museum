label: { ar: "زي أهل الأندلس وتدبيرهم", en: "The dress and way of life of the people of al-Andalus", fr: "Le vêtement et le mode de vie des gens d’al-Andalus", es: "La vestimenta y el modo de vida de la gente de al-Ándalus.", ur: "اہل اندلس کا لباس اور طرز زندگی", tr: "Endülüs halkı ve yönetimleri gibi", id: "Seperti masyarakat dan administrasi Andalusia" }
