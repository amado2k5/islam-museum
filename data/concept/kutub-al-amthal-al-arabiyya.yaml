tags: [arabiyya-browser, arabiyya-lisan]
label:
  ar: "كتب الأمثال العربية الكبرى"
  en: "The great Arabic proverb books"
  ur: "عربی امثال کی بڑی کتابیں"
  fr: "Les grands livres de proverbes arabes"
  es: "Los grandes libros de proverbios árabes"
summary:
  ar: "أربعة كتب في الأمثال العربية: كتاب الأمثال لأبي عبيد القاسم بن سلام، وجمهرة الأمثال لأبي هلال العسكري، والمستقصى للزمخشري، ومجمع الأمثال للميداني، بتواريخها وأعداد أمثالها كما ينقلها ملخص بحثي قُدّم إلى المتحف {cite:arabictypinglab-arabic-proverbs} {cite:ketabonline-majma-al-amthal-p16}."
  en: "Four books of Arabic proverbs: Abu Ubayd al-Qasim ibn Sallam's Kitab al-Amthal, Abu Hilal al-Askari's Jamharat al-Amthal, al-Zamakhshari's al-Mustaqsa and al-Maydani's Majma al-Amthal, with their dates and counts as a research summary supplied to the museum reports them {cite:arabictypinglab-arabic-proverbs} {cite:ketabonline-majma-al-amthal-p16}."
  ur: "عربی امثال کی چار کتابیں: ابو عبید قاسم بن سلام کی کتاب الامثال، ابو ہلال عسکری کی جمہرۃ الامثال، زمخشری کی المستقصیٰ اور میدانی کی مجمع الامثال، ان کی تاریخوں اور امثال کی تعداد کے ساتھ جیسا میوزیم کو دیا گیا تحقیقی خلاصہ نقل کرتا ہے {cite:arabictypinglab-arabic-proverbs} {cite:ketabonline-majma-al-amthal-p16}۔"
  fr: "Quatre livres de proverbes arabes : le Kitab al-Amthal d'Abu Ubayd al-Qasim ibn Sallam, la Jamharat al-Amthal d'Abu Hilal al-Askari, al-Mustaqsa d'al-Zamakhshari et Majma al-Amthal d'al-Maydani, avec leurs dates et leurs effectifs tels que les rapporte une synthèse de recherche remise au musée {cite:arabictypinglab-arabic-proverbs} {cite:ketabonline-majma-al-amthal-p16}."
  es: "Cuatro libros de proverbios árabes: el Kitab al-Amthal de Abu Ubayd al-Qasim ibn Sallam, la Jamharat al-Amthal de Abu Hilal al-Askari, al-Mustaqsa de al-Zamakhshari y Majma al-Amthal de al-Maydani, con sus fechas y cantidades tal como los recoge un resumen de investigación entregado al museo {cite:arabictypinglab-arabic-proverbs} {cite:ketabonline-majma-al-amthal-p16}."
