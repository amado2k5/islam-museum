summary:
  ar: "المر صمغ حار يابس في الثانية، مفتح محلل للرياح، فيه قبض وإلزاق وتليين، يمنع التعفن، وللمر في الكتاب منافع في الفم والجراح والصدر والمعدة، وقد يغش بيتوع قتال فيصير قاتلاً {cite:canon-ibn-sina-print-v1 p.565}."
  en: "Murr is a gum, hot and dry in the second degree, opening and dissolving winds, with astringency, sticking and softening, which prevents putrefaction; the book gives it uses for the mouth, wounds, chest and stomach, and warns that it is adulterated with a deadly spurge that makes it deadly {cite:canon-ibn-sina-print-v1 p.565}."
  ur: "مر ایک گوند ہے، دوسرے درجے میں گرم خشک، ہواؤں کو کھولنے اور تحلیل کرنے والا، جس میں قبض، چپکانے اور نرم کرنے کی صفت ہے اور جو سڑاند روکتا ہے؛ کتاب اسے منہ، زخموں، سینے اور معدے کے لیے مفید بتاتی ہے، اور خبردار کرتی ہے کہ اس میں مہلک یتوع کی ملاوٹ ہو جاتی ہے جو اسے مہلک بنا دیتی ہے {cite:canon-ibn-sina-print-v1 p.565}۔"
  es: "Murr es una goma, caliente y seca en segundo grado, que abre y disuelve los vientos, con astringencia, adherencia y suavización, que previene la putrefacción; el libro le da usos para la boca, heridas, pecho y estómago, y advierte que está adulterada con una euforbia mortal que la hace mortal {cite:canon-ibn-sina-print-v1 p.565}."
