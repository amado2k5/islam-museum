id: concept/ihya-bayt-al-haram
class: concept
kind: legal
label:
  ar: إحياء البيت الحرام
  en: Reviving the Sacred House (the hajj as a collective duty)
  es: "Reviviendo la Casa Sagrada (el Hajj como deber colectivo)"
  fr: "Raviver la Maison Sacrée (le hajj comme devoir collectif)"
  ur: "بیت المقدس کو زندہ کرنا ⁦(حج ایک اجتماعی فریضہ کے طور پر)⁩"
  tr: "Kutsal Ev'in Canlandırılması"
  id: "Menghidupkan Kembali Rumah Suci"
summary:
  ar: عمارة البيت الحرام بالحج، وبالعمرة عند بعض الفقهاء؛ والمالكية والشافعية والحنابلة يرون أن إحياءه بالحج فرض كفاية كل عام على المسلمين، فإن لم يحج أحد يحصل بهم الشعار أثم الجميع، والطواف والاعتكاف والصلاة لا تغني عنه، وأوجب المالكية على الإمام إرسال جماعة كل عام لإقامة الموسم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}.
  en: Reviving the Sacred House means keeping it alive through the hajj, and some include the umra; the Malikis, Shafi'is and Hanbalis hold that the hajj is a collective duty each year, so that if none performs it the whole community is at fault, and that circling, retreat and prayer do not replace it; the Malikis require the ruler to send a group every year to hold the season. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}.
  es: "Revivir la Casa Sagrada significa mantenerla viva a través del Hajj, y algunos incluyen la Umrah; los Malikis, Shafi'is y Hanbalis sostienen que el Hajj es un deber colectivo cada año, de modo que si nadie lo realiza, toda la comunidad es culpable, y que la circunvalación, el retiro y la oración no lo reemplazan; los Malikis exigen que el gobernante envíe un grupo cada año para celebrar la temporada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}."
  fr: "Raviver la mémoire de la Maison sacrée signifie la maintenir vivante à travers le hajj, et certains y incluent la umra; les écoles malikite, chaféite et hanbalite considèrent le hajj comme un devoir collectif annuel, de sorte que si personne ne l’accomplit, toute la communauté est en faute, et que les circumambulations, la retraite et la prière ne sauraient le remplacer; les malikites exigent que le souverain envoie chaque année un groupe pour célébrer le pèlerinage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}."
  ur: "بیت المقدس کو زندہ کرنے کا مطلب ہے اسے حج کے ذریعے زندہ رکھنا، اور بعض میں عمرہ بھی شامل ہے۔ مالکیوں، شافعیوں اور حنبلیوں کا خیال ہے کہ ہر سال حج ایک اجتماعی فریضہ ہے، اس لیے اگر کوئی اسے ادا نہ کرے تو پوری امت قصوروار ہے، اور یہ کہ چکر لگانا، اعتکاف اور نماز اس کی جگہ نہیں لے سکتی۔ مالکیوں نے حکمراں سے مطالبہ کیا کہ وہ موسم کے انعقاد کے لیے ہر سال ایک گروہ بھیجے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1879} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1880}"
  tr: "Bazı hukukçulara göre kutsal evin Hac ve Umre ile inşası; Malikiler, Şafiiler ve Hanbaliler, Hac sırasında evin canlandırılmasının her yıl Müslümanlar için ortak bir yükümlülük olduğunu düşünürler. Kimse Hac yapmazsa, bu herkes için günahtır ve Tevaf, İtikif ve namaz yeterli değildir. Malikiler, imamı her yıl mevsimi icra etmek üzere bir grup göndermeye zorlamıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1881}."
  id: "Pembangunan Rumah Suci oleh Haji dan Umrah menurut beberapa ahli hukum; Maliki, Shafi'i, dan Hanbal menganggap bahwa menghidupkannya kembali selama Haji adalah kewajiban kolektif setiap tahun bagi umat Islam. Jika tidak ada yang melakukan Haji, itu adalah dosa bagi semua orang, dan Tawaf, I'tikaf, dan shalat tidak cukup. Para Malik mewajibkan imam untuk mengirim sekelompok orang setiap tahun untuk melaksanakan musim tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1881}."
