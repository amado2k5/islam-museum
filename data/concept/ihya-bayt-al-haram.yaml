id: concept/ihya-bayt-al-haram
class: concept
kind: legal
label:
  ar: إحياء البيت الحرام
  en: Reviving the Sacred House (the hajj as a collective duty)
summary:
  ar: عمارة البيت الحرام بالحج، وبالعمرة عند بعض الفقهاء؛ والمالكية والشافعية والحنابلة يرون أن إحياءه بالحج فرض كفاية كل عام على المسلمين، فإن لم يحج أحد يحصل بهم الشعار أثم الجميع، والطواف والاعتكاف والصلاة لا تغني عنه، وأوجب المالكية على الإمام إرسال جماعة كل عام لإقامة الموسم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}.
  en: Reviving the Sacred House means keeping it alive through the hajj, and some include the umra; the Malikis, Shafi'is and Hanbalis hold that the hajj is a collective duty each year, so that if none performs it the whole community is at fault, and that circling, retreat and prayer do not replace it; the Malikis require the ruler to send a group every year to hold the season. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}.
