label: { ar: "الأكل", en: "Akl (eating: lawful food and manners)" }
summary:
  ar: "الأكل من مهمات الدين، فالحرام من الطعام متوعد عليه، والمحرمات بالنص والسنة معروفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252} وللأكل أحكام تتفاوت بحسب الحاجة، فيكون فرضا بقدر ما يدفع الهلاك، وواجبا بقدر ما يقوم به المكلف من الصلاة والصوم، ومندوبا لتحصيل الرزق والعلم، ومباحا إلى حد الشبع، وحراما فوقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3253} ويستحب للمضحي أن يأكل من أضحيته، ويختلف الفقهاء في المنذورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3255} وفي الكفارات يشترط الفقهاء التمليك عند الشافعية والحنابلة، ويكفي الإطعام عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3256} ومن آداب الأكل التسمية، والأكل باليمين، والأكل مما يليه، وعدم ذم الطعام، وعدم الاتكاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3258}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3262} ويجوز للمضطر أن يأكل المحرم بقدر سد الرمق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3263}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3264} ولا يجوز الأكل من ثمار الغير وزرعه بغير إذن إلا على شروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3264}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3265}"
  en: "Eating is part of the faith: forbidden food is warned against, and the forbidden foods are known from the text and the Sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3252} Eating has rulings that vary by need: obligatory up to what keeps life, required for prayer and fasting, recommended for earning and learning, permitted up to satiety, and forbidden beyond it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3253} It is recommended for the one who sacrifices to eat from his sacrifice; the jurists differ on a sacrifice that was vowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3255} For expiations the Shafi'is and Hanbalis require transfer of ownership, while the Hanafis accept enabling the needy to eat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3256} Manners include saying the basmala, eating with the right hand and from what is nearest, not blaming food, and not reclining while eating. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3258}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3262} A person in necessity may eat the forbidden only enough to keep alive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3263}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3264} Eating from another's orchard or field without leave is allowed only under conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3264}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3265}"
