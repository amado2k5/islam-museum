id: concept/tawatur-al-qiraat
class: concept
kind: doctrine
label:
  ar: تواتر القراءات
  en: Mass transmission (tawatur) of the readings
  ur: قراءات کا تواتر
  es: "Transmisión masiva (tawatur) de las lecturas"
  fr: "transmission en masse (tawatur) des relevés"
summary:
  ar: "تُنقل القراءات العشر بالإسناد، وقد قيل بتواتر السبع كلها وقيل بتواتر ما اجتمعت عليه الطرق منها؛ ويقول ابن الحاجب بتواتر السبع فيما ليس من قبيل الأداء كالمد والإمالة، ويرد ابن الجزري أن تواتر اللفظ يستلزم تواتر هيئة أدائه {cite:nashr-dahman-damascus-1345-v1 p. 23} {cite:nashr-dahman-damascus-1345-v1 p. 40} {cite:itqan-suyuti p. 524}."
  en: "The readings are carried by chains of transmission; some hold all seven mass-transmitted, others only what all the paths agree on; Ibn al-Hajib says the seven are mass-transmitted except in matters of delivery such as lengthening and imala, and Ibn al-Jazari replies that mass transmission of the wording carries that of its manner of delivery {cite:nashr-dahman-damascus-1345-v1 p. 23} {cite:nashr-dahman-damascus-1345-v1 p. 40} {cite:itqan-suyuti p. 524}."
  ur: "قراءتیں اسناد سے نقل ہوتی ہیں؛ کسی نے سب سات کو متواتر کہا، کسی نے صرف اسے جس پر تمام طرق متفق ہوں؛ ابن حاجب کہتے ہیں کہ سبعہ متواتر ہیں سوائے ان باتوں کے جو ادا سے تعلق رکھتی ہیں جیسے مد اور امالہ، اور ابن الجزری جواب دیتے ہیں کہ لفظ کا تواتر اس کی ادا کی ہیئت کے تواتر کو لازم کرتا ہے {cite:nashr-dahman-damascus-1345-v1 p. 23} {cite:nashr-dahman-damascus-1345-v1 p. 40} {cite:itqan-suyuti p. 524}۔"
  es: "Las lecturas se transmiten mediante cadenas de transmisión; algunos sostienen que las siete se transmiten masivamente, otros solo lo que coinciden en todas las vías; Ibn al-Hajib dice que las siete se transmiten masivamente excepto en cuestiones de transmisión como el alargamiento y la imala, e Ibn al-Jazari responde que la transmisión masiva de la redacción conlleva la de su modo de transmisión {cite:nashr-dahman-damascus-1345-v1 p. 23} {cite:nashr-dahman-damascus-1345-v1 p. 40} {cite:itqan-suyuti p. 524}."
  fr: "Les lectures sont transmises par chaînes de transmission; certaines chaînes conservent les sept lectures transmises de manière systématique, d'autres seulement celles sur lesquelles toutes les chaînes s'accordent; Ibn al-Hajib dit que les sept lectures sont transmises de manière systématique, sauf en ce qui concerne la prononciation, comme l'allongement et l'imala, et Ibn al-Jazari répond que la transmission systématique du texte emporte celle de sa manière de prononciation {cite:nashr-dahman-damascus-1345-v1 p. 23} {cite:nashr-dahman-damascus-1345-v1 p. 40} {cite:itqan-suyuti p. 524}."
