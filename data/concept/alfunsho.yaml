label:
  ar: "ألفونش"
  en: "Alfunsho (the Arabic transcription of Alfonso)"
summary:
  ar: "ألفونش، الصيغة التي اعتمدها أكثر المؤرخين العرب في الأندلس لاسم ألفونسو، وهو اسم عدة ملوك للمسيحيين في إسبانيا في القرون الوسطى. وأما صيغتا «إدفنشو» و«الإدفنشو»، المقابلتان للصيغة اللاتينية القوطية «إلدفونسو»، فتردان أحيانًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 386}."
  en: "Alfunsho is the form of the name Alfonso adopted by most Arab chroniclers of al-Andalus, a name borne by several monarchs of Christian Spain in the Middle Ages. The forms Idhfunsho and al-Idhfunsho, which correspond to the old Latin-Gothic Ildefonso, also occur occasionally {cite:encyclopaedia-of-islam-2 vol. 1 p. 386}."
