id: concept/alfunsho
class: concept
kind: term
label:
  ar: "ألفونش"
  en: "Alfunsho (the Arabic transcription of Alfonso)"
  fr: "Alfunsho (transcription arabe d’Alfonso)"
  es: "Alfunsho (la transcripción árabe de Alfonso)"
  ur: "الفونشو ⁦(الفونسو کی عربی نقل)⁩"
summary:
  ar: "ألفونش، الصيغة التي اعتمدها أكثر المؤرخين العرب في الأندلس لاسم ألفونسو، وهو اسم عدة ملوك للمسيحيين في إسبانيا في القرون الوسطى. وأما صيغتا «إدفنشو» و«الإدفنشو»، المقابلتان للصيغة اللاتينية القوطية «إلدفونسو»، فتردان أحيانًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 386}."
  en: "Alfunsho is the form of the name Alfonso adopted by most Arab chroniclers of al-Andalus, a name borne by several monarchs of Christian Spain in the Middle Ages. The forms Idhfunsho and al-Idhfunsho, which correspond to the old Latin-Gothic Ildefonso, also occur occasionally {cite:encyclopaedia-of-islam-2 vol. 1 p. 386}."
  fr: "Alfunsho est la forme du nom Alfonso adoptée par la plupart des chroniqueurs arabes d’al-Andalus. Plusieurs monarques de l’Espagne chrétienne du Moyen Âge ont porté ce nom. Les formes Idhfunsho et al-Idhfunsho, qui correspondent à l’ancienne forme latino-gothique Ildefonso, apparaissent aussi à l’occasion {cite:encyclopaedia-of-islam-2 vol. 1 p. 386}."
  es: "Alfunsho es la forma del nombre Alfonso adoptada por la mayoría de los cronistas árabes de al-Ándalus, nombre que llevaron varios monarcas de la España cristiana en la Edad Media. Las formas Idhfunsho y al-Idhfunsho, que corresponden al antiguo latín-gótico Ildefonso, también aparecen ocasionalmente {cite:encyclopaedia-of-islam-2 vol. 1 p. 386}."
  ur: "الفونشو نام کی شکل ہے الفانسو جسے الاندلس کے بیشتر عرب تاریخ نگاروں نے اپنایا تھا، یہ نام قرون وسطیٰ میں عیسائی اسپین کے کئی بادشاہوں نے پیدا کیا تھا۔ Idhfunsho اور al-Idhfunsho کی شکلیں، جو پرانی لاطینی گوتھک Ildefonso سے مطابقت رکھتی ہیں، بھی کبھی کبھار واقع ہوتی ہیں 1 ص۔ 386}۔"
