label: { ar: "صور البول الكدر عند ابن سينا", en: "Forms of turbid urine in the Canon", ur: "گدلے پیشاب کی صورتیں قانون میں", es: "Formas de orina turbia en el Canon", fr: "Formes d'urine trouble dans le Canon", tr: "İbn Sina'ya göre bulanık idrar görüntüleri", id: "Gambar urin keruh menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا صوراً من البول الكدر ودلالاتها: الكدر يدل على سقوط القوة، والشبيه بالشراب الرديء أو ماء الحمص للحبالى وأصحاب الأورام الحارة المزمنة، والشبيه ببول الحمير يدل على فساد الأخلاط {cite:canon-ibn-sina-print-v1 p.191}."
  en: "Ibn Sina lists forms of turbid urine and what they show: turbid urine shows collapse of strength, wine-like or chickpea-water urine belongs to pregnant women and those with long hot swellings, and urine like that of asses shows corruption of the humours {cite:canon-ibn-sina-print-v1 p.191}."
  es: "Ibn Sina enumera las formas de orina turbia y lo que muestran: la orina turbia muestra un colapso de la fuerza, la orina parecida al vino o al agua de garbanzos pertenece a las mujeres embarazadas y a aquellas con hinchazones calientes prolongadas, y la orina parecida a la de los asnos muestra corrupción de los humores {cite:canon-ibn-sina-print-v1 p.191}."
  fr: "Ibn Sina énumère les formes d'urine trouble et ce qu'elles montrent: l'urine trouble indique un effondrement de la force, l'urine ressemblant à du vin ou à de l'eau de pois chiche appartient aux femmes enceintes et à celles qui ont de longs gonflements chauds, et l'urine comme celle des ânes indique une corruption des humeurs {cite:canon-ibn-sina-print-v1 p.191}."
  ur: "ابن سینا نے turbid پیشاب کی شکلیں اور وہ کیا دکھاتے ہیں: turbid پیشاب طاقت کے خاتمے کو ظاہر کرتا ہے، شراب کی طرح یا چنے کے پانی کا پیشاب حاملہ خواتین اور طویل گرم سوجن والی خواتین کا ہے، اور گدھے کی طرح پیشاب مزاح کی خرابی کو ظاہر کرتا ہے۔"
  tr: "İbn Sina, bulanık idrar görüntülerini ve anlamlarını belirtir: bulanıklık, hamile kadınlar ve kronik sıcak tümörleri olanlar için kötü içecek veya nohut suyuna benzer güç kaybını gösterir; eşek idrarına benzer şekilde ise humorların bozulmasını gösterir {cite:canon-ibn-sina-print-v1 s.191}."
  id: "Ibn Sina menyebutkan gambar urin keruh dan maknanya: keruh menunjukkan kehilangan kekuatan, mirip dengan minuman buruk atau air kacang chickpea untuk wanita hamil dan mereka yang memiliki tumor panas kronis, dan mirip dengan urin keledai menunjukkan kerusakan humor {cite:canon-ibn-sina-print-v1 hlm.191}."
