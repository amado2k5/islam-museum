summary:
  ar: "يذكر ابن سينا صوراً من البول الكدر ودلالاتها: الكدر يدل على سقوط القوة، والشبيه بالشراب الرديء أو ماء الحمص للحبالى وأصحاب الأورام الحارة المزمنة، والشبيه ببول الحمير يدل على فساد الأخلاط {cite:canon-ibn-sina-print-v1 p.191}."
  en: "Ibn Sina lists forms of turbid urine and what they show: turbid urine shows collapse of strength, wine-like or chickpea-water urine belongs to pregnant women and those with long hot swellings, and urine like that of asses shows corruption of the humours {cite:canon-ibn-sina-print-v1 p.191}."
