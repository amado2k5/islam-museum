id: concept/qafr-al-yahud
class: concept
kind: natural
label:
  ar: "قفر اليهود"
  en: "Qafr al-yahud (bitumen)"
  ur: "قفر الیہود"
summary:
  ar: "قفر اليهود في الكتاب قطع سود خفيفة يقال إنها تنبع من بعض الجبال أو تطفو على مياه العيون ويستعملها الناس في السراج بدل الزيت، حار في الثالثة يابس إليها، قوته قريبة من قوة الزفت، ينفع من بياض الأظفار والقوابي والنقرس وعرق النسا والسعال وقروح الرئة وأورام اللوزتين والخناق ودوسنطاريا {cite:canon-ibn-sina-print-v1 p.650}"
  en: "Qafr al-yahud is in the book light black pieces said to well out of some mountains or float on the waters of springs, which people use in the lamp instead of oil; hot in the third degree and dry up to it, its power near that of pitch; it benefits whiteness of the nails, ringworm, gout, sciatica, cough, ulcers of the lung, swellings of the tonsils, quinsy and dysentery {cite:canon-ibn-sina-print-v1 p.650}"
  ur: "قفر الیہود کتاب میں ہلکے سیاہ ٹکڑے ہیں جن کے بارے میں کہا جاتا ہے کہ بعض پہاڑوں سے پھوٹتے یا چشموں کے پانی پر تیرتے ہیں اور لوگ انہیں چراغ میں تیل کی جگہ استعمال کرتے ہیں؛ تیسرے درجے میں گرم اور اس تک خشک، اس کی قوت زفت کے قریب ہے؛ ناخنوں کی سفیدی، قوباء، نقرس، عرق النسا، کھانسی، پھیپھڑوں کے زخموں، لوزتین کے ورم، خناق اور پیچش میں نافع ہے {cite:canon-ibn-sina-print-v1 p.650}۔"
