  en: "Jarjir (rocket)"
  ur: "جرجیر"
  es: "Jarjir (cohete)"
summary:
  ar: "معروف، منه برّي ومنه بستاني، وبزره الذي يُستعمل في الطبيخ بدل الخردل. طبعه حار في الثالثة يابس في الأولى. مدرّ للبول وهاضم، وماؤه مع مرارة البقر لآثار القروح، وتُذكر فيه منافع للرأس والصدر، وإذا أُكل مع شراب ريحاني فهو ترياق لسم ابن عرس {cite:canon-ibn-sina-print-v1 p.430}."
  en: "Known; there is a wild and a garden kind. Its seed, used in cooking in place of mustard. Hot in the third degree and dry in the first. It is a diuretic and aids digestion; its water with ox gall is used for marks of ulcers. The book lists it for the head and chest, and says that eaten with a rayhani wine it is a remedy against the weasel's poison {cite:canon-ibn-sina-print-v1 p.430}."
  ur: "معروف ہے، اس کی جنگلی اور باغی دونوں قسمیں ہیں۔ اس کا بیج کھانے میں سرسوں کی جگہ استعمال ہوتا ہے۔ طبع تیسرے درجے میں گرم اور پہلے میں خشک۔ یہ مدرِّ بول اور ہاضم ہے؛ اس کا پانی گائے کے پت کے ساتھ زخموں کے نشانات کے لیے ہے۔ کتاب اسے سر اور سینے کے لیے بیان کرتی ہے، اور کہتی ہے کہ ریحانی شراب کے ساتھ کھانے سے یہ نیولے کے زہر کا تریاق ہے {cite:canon-ibn-sina-print-v1 p.430}۔"
  es: "Se sabe que existe una variedad silvestre y otra cultivada. Su semilla se usa en la cocina en lugar de mostaza. Es picante en tercer grado y seca en primero. Es diurética y ayuda a la digestión; su agua con bilis de buey se usa para tratar úlceras. El libro la menciona para la cabeza y el pecho, y dice que, consumida con vino de Rayhani, es un remedio contra el veneno de la comadreja {cite:canon-ibn-sina-print-v1 p.430}."
