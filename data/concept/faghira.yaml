summary:
  ar: "الفاغرة في الكتاب حب يشبه الحمص وفي جوفه حب أسود كالشهدانج يحمل من السفالة، حارة يابسة في الثالثة، فيها تحليل وقبض، تدخل في الأدوية المصلحة للمعدة والكبد الباردتين، وتنفع من الإسهال البارد وتعقل البطن {cite:canon-ibn-sina-print-v1 p.626}"
  en: "Faghira is in the book a grain like the chickpea with a black grain inside it like hemp seed, brought from Safala; hot and dry in the third degree, with dissolving and astringency, it enters the remedies that put right the cold stomach and liver and benefits cold diarrhoea and restrains the bowels {cite:canon-ibn-sina-print-v1 p.626}"
  ur: "فاغرہ کتاب میں ایک دانہ ہے جو چنے جیسا ہے اور اس کے اندر بھنگ کے بیج جیسا سیاہ دانہ ہے، سفالہ سے لایا جاتا ہے؛ تیسرے درجے میں گرم خشک ہے اور اس میں تحلیل اور قبض ہے، ٹھنڈے معدے اور جگر کو درست کرنے والی دواؤں میں شامل ہوتا ہے اور ٹھنڈے اسہال میں نافع ہے اور پیٹ کو روکتا ہے {cite:canon-ibn-sina-print-v1 p.626}۔"
  es: "En el libro, la faghira es un grano parecido al garbanzo con un grano negro en su interior, similar a la semilla de cáñamo, traído de Safala; caliente y seco en tercer grado, con propiedades disolventes y astringentes, forma parte de los remedios que alivian el frío del estómago y el hígado, benefician la diarrea fría y restringen el tránsito intestinal {cite:canon-ibn-sina-print-v1 p.626}"
  fr: "Le faghira est décrit dans le livre comme une graine ressemblant au pois chiche, contenant un grain noir semblable à une graine de chanvre, provenant de Safala; chaude et sèche au troisième degré, avec des propriétés dissolvantes et astringentes, elle figure parmi les remèdes qui rétablissent l’équilibre de l’estomac et du foie, soulagent la diarrhée froide et régularisent le transit intestinal {cite:canon-ibn-sina-print-v1 p.626}"
  tr: "Kitaptaki 'al-faghra', nohutlara benzeyen bir tahıldır; içinde bir şamanj gibi kara tohum bulunur, üçüncüsünde ise kuru bir sıcaklık, akıntı ve kasılma içerir. Soğuk mide ve karaciğer için faydalı ilaçlarda bulunur, soğuk ishal ve mideye yardımcı olur (atıf:kanon-ibn-sina-print-v1 s.626}"
  id: "'Al-faghra' dalam buku ini adalah biji yang menyerupai kacang arab, dengan biji hitam di dalamnya seperti shamanj yang berasal dari kotoran, panas kering di bagian ketiga, mengandung cairan dan kontraksi. Biji ini termasuk dalam obat-obatan yang bermanfaat untuk perut dan hati yang dingin, serta membantu diare dingin dan membantu lambung (kutip: canon-ibn-sina-print-v1 hlm.626}"
