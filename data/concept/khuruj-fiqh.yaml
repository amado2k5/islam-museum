label:
  ar: الخروج
  en: Khuruj (going out; departure rulings)
  ur: خروج
summary:
  ar: 'الخروج لغة نقيض الدخول، ويستعمله الفقهاء بمعناه، ويطلقونه أيضا على البغي أي الخروج على الأئمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} الخارج من السبيلين: المني والحيض والنفاس يوجب الغسل، والمعتاد غير المني كالبول والغائط والريح ينقض الوضوء، وغير المعتاد ينقضه عند الحنفية والشافعية والحنابلة وابن عبد الحكم، ولا ينقضه عند جمهور المالكية كالدود والحصى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} خروج القدم أو أكثرها إلى ساق الخف يثبت به حكم نزع الخف؛ والشافعية لا يرون ذلك إلا في الخف الطويل الخارج عن العادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} يكره الخروج من المسجد بعد الأذان بلا عذر عند الجمهور، ويحرم عند الحنابلة استدلالا بأثر أبي هريرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} الكلام حين يخطب الإمام محرم عند جمهور الفقهاء، والكلام قبل أن يبدأ الخطبة مباح عند الجمهور، وأبو حنيفة يحرمه بمجرد خروجه؛ والتطوع ممنوع بعد خروجه عند الحنفية والمالكية، وينقطع بجلوسه على المنبر عند الشافعية والحنابلة، استنادا إلى حديث «اجلس فقد آذيت وآنيت». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} المعتكف لا يخرج إلا لحاجة الإنسان أو الجمعة، والشافعية يوجبون الخروج للجمعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630}'
  en: Khuruj is lexically going out, the opposite of entering; jurists use it also for rebellion against the rulers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} Among what leaves the two passages, semen, menses and postnatal blood require a full wash; usual discharges such as urine, faeces and wind break wudu; unusual discharges break it for the Hanafis, Shafiis, Hanbalis and Ibn Abd al-Hakam, but not by most Malikis, who count worms and pebbles as harmless. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} The heel or most of the foot coming out into the leg of the sock brings the rule of taking off the sock; the Shafiis count this only for a long sock beyond custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Leaving the mosque after the call to prayer without excuse is disliked by most jurists and forbidden by the Hanbalis, citing a report of Abu Hurayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Speaking while the Imam preaches is forbidden by most jurists; speech before the sermon begins is permitted by most; Abu Hanifa forbids it from the moment he comes out; voluntary prayer is barred after he comes out for the Hanafis and Malikis, and ends when he sits on the pulpit for the Shafiis and Hanbalis, citing the report "sit, you have troubled and delayed". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} The one in retreat (mu'takif) leaves only for a human need or the Friday prayer; the Shafiis require him to go out for Friday. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630}
  ur: خروج لغت میں دخول کی ضد ہے، فقہاء اسے اسی معنی میں لیتے ہیں اور باغی ہونے یعنی ائمہ کے خلاف نکلنے کے معنی میں بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} سبیلین سے نکلنے والی چیزوں میں منی، حیض اور نفاس غسل واجب کرتے ہیں، اور معتاد چیزیں جیسے پیشاب، پاخانہ اور ہوا وضو توڑتی ہیں؛ غیر معتاد چیز حنفیہ، شافعیہ، حنابلہ اور ابن عبد الحکم کے نزدیک وضو توڑتی ہے، جمہور مالکیہ کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} پاؤں یا اس کے بیشتر حصے کا موزے کی ساق میں نکل آنا نزعِ خف کا حکم ثابت کرتا ہے؛ شافعیہ اسے صرف لمبے موزے میں معتبر کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} اذان کے بعد بلا عذر مسجد سے نکلنا جمہور کے نزدیک مکروہ ہے، حنابلہ کے نزدیک حرام، ابو ہریرہ کے اثر سے استدلال کیا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} خطبہ کے دوران بات کرنا جمہور کے نزدیک حرام ہے، امام کے نکلنے کے بعد خطبہ شروع ہونے سے پہلے بات جائز ہے، ابو حنیفہ اس کو نکلنے سے ہی حرام کہتے ہیں؛ حنفیہ اور مالکیہ کے نزدیک امام کے نکلنے کے بعد نفل ممنوع ہے، شافعیہ اور حنابلہ کے نزدیک منبر پر بیٹھنے سے نفل ختم ہو جاتا ہے، «اجلس فقد آذيت وآنيت» سے استدلال کیا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} معتکف صرف حاجتِ انسانی یا جمعہ کے لیے نکلتا ہے، شافعیہ جمعہ کے لیے نکلنا واجب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630}
