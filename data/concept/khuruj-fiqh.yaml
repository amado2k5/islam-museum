label:
  ar: الخروج
  en: Khuruj (going out; departure rulings)
  ur: خروج
summary:
  ar: 'الخروج لغة نقيض الدخول، ويستعمله الفقهاء بمعناه، ويطلقونه أيضا على البغي أي الخروج على الأئمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} الخارج من السبيلين: المني والحيض والنفاس يوجب الغسل، والمعتاد غير المني كالبول والغائط والريح ينقض الوضوء، وغير المعتاد ينقضه عند الحنفية والشافعية والحنابلة وابن عبد الحكم، ولا ينقضه عند جمهور المالكية كالدود والحصى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} خروج القدم أو أكثرها إلى ساق الخف يثبت به حكم نزع الخف؛ والشافعية لا يرون ذلك إلا في الخف الطويل الخارج عن العادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} يكره الخروج من المسجد بعد الأذان بلا عذر عند الجمهور، ويحرم عند الحنابلة استدلالا بأثر أبي هريرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} الكلام حين يخطب الإمام محرم عند جمهور الفقهاء، والكلام قبل أن يبدأ الخطبة مباح عند الجمهور، وأبو حنيفة يحرمه بمجرد خروجه؛ والتطوع ممنوع بعد خروجه عند الحنفية والمالكية، وينقطع بجلوسه على المنبر عند الشافعية والحنابلة، استنادا إلى حديث «اجلس فقد آذيت وآنيت». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} المعتكف لا يخرج إلا لحاجة الإنسان أو الجمعة، والشافعية يوجبون الخروج للجمعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} الخروج للاستسقاء يخرج فيه الشباب والشيوخ والضعفاء والعجزة وغير ذوات الهيئة من النساء، مشاة بتواضع وخشوع، بعد التوبة وتقديم الصدقة؛ واختلفوا في خروج أهل الذمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631} الأصل أن المرأة مأمورة بلزوم البيت، ويذكر الكاساني أن من ملك الاحتباس منعها من الخروج، واستدل بآيات السكنى وقرن في بيوتكن، وبحديث «المرأة عورة فإذا خرجت استشرفها الشيطان». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632} وتخرج عند الحاجة كزيارة الآباء والأمهات وذوي المحارم وشهود الجنازة والعرس وقضاء حاجة لا غنى عنها، بقيود: ألا تخشى الفتنة بها، وأن يكون الطريق مأمونا، وأن يكون في زمن أمن الرجال، وألا يفضي إلى اختلاطها بالرجال، وأن يكون بهيئة غير متبرجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633} ولا تخرج إلا بإذن زوجها عند الجمهور، وللزوج منعها إذا كان لها بد عن الخروج لزيارة والديها، وينبغي له ألا يمنعها من عيادتهما؛ والمفتى به عند الحنفية أنها تخرج للوالدين كل جمعة وللمحارم في كل سنة بإذنه أو بدونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} وتخرج بغير إذنه لما لا غنى لها عنه: كالذهاب إلى القاضي لطلب حقها، وكسب النفقة إذا أعسر الزوج، والاستفتاء إذا لم يكن زوجها فقيها، وإذا كان المنزل مشرفا على الانهدام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} خروج المرأة إلى المسجد: كرهه الشافعية وصاحبا أبي حنيفة للشابة أو من تشتهى، وأجازوه للعجوز في الصلوات؛ والمالكية يقسمون النساء أربعة أقسام؛ والحنابلة يبيحون حضور الجماعة مع الرجال، استنادا إلى قول النبي «لا تمنعوا إماء الله مساجد الله». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} اتفق العلماء على أن المرأة لا تسافر في غير الحج والعمرة إلا مع ذي محرم، إلا الهجرة من دار الحرب إلى دار الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} يستحب عند الخروج من المسجد تقديم الرجل اليسرى والدعاء، وعند الخروج من البيت قول «بسم الله توكلت على الله» كما في حديث أم سلمة وأنس، وعند الخروج من الخلاء تقديم اليمنى والدعاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} جمهور الفقهاء يوجبون على المعتدة لزوم البيت، وتفصيل ذلك في مصطلح العدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636}'
  en: 'Khuruj is lexically going out, the opposite of entering; jurists use it also for rebellion against the rulers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} Among what leaves the two passages, semen, menses and postnatal blood require a full wash; usual discharges such as urine, faeces and wind break wudu; unusual discharges break it for the Hanafis, Shafiis, Hanbalis and Ibn Abd al-Hakam, but not by most Malikis, who count worms and pebbles as harmless. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} The heel or most of the foot coming out into the leg of the sock brings the rule of taking off the sock; the Shafiis count this only for a long sock beyond custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Leaving the mosque after the call to prayer without excuse is disliked by most jurists and forbidden by the Hanbalis, citing a report of Abu Hurayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Speaking while the Imam preaches is forbidden by most jurists; speech before the sermon begins is permitted by most; Abu Hanifa forbids it from the moment he comes out; voluntary prayer is barred after he comes out for the Hanafis and Malikis, and ends when he sits on the pulpit for the Shafiis and Hanbalis, citing the report "sit, you have troubled and delayed". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} The one in retreat (mu''takif) leaves only for a human need or the Friday prayer; the Shafiis require him to go out for Friday. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} Going out to pray for rain (istisqa'') is allowed to the young, the old, the weak and the infirm, and women who are not in the public eye, on foot in humility and after repentance and almsgiving; the jurists differ on non-Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631} The rule is that a woman is ordered to stay at home; al-Kasani, among the rights of confinement, holds that she is kept from going out, citing the verses on dwelling and ''stay in your houses'' and the report that a woman is nakedness and the devil looks at her when she goes out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632} She goes out for need, such as visiting parents and close kin, attending a funeral or wedding, or meeting an unavoidable need, on conditions: that she is not feared as a temptation, the road is safe, it is a time when men are not about, it does not lead to mixing with men, and she is dressed modestly, without display. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633} By majority she goes out only with her husband''s leave; he may prevent a visit to her parents when she has another option, though he should not stop her from visiting them when ill; the Hanafi fatwa is that she may visit parents each Friday and close kin yearly, with or without leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} She may go out without leave for what she cannot do without: to the judge to claim her right, to earn maintenance when the husband is poor, to ask a fatwa if he is not learned, and if the house is about to collapse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} On women going to the mosque: the Shafiis and the two companions of Abu Hanifa dislike it for a young or desirable woman and allow it to an old woman for the prayers; the Malikis divide women into four classes; the Hanbalis allow attending the congregation with men, citing ''do not forbid God''s maidservants the mosques of God''. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} Scholars agree that a woman may not travel except for Hajj or Umra without a mahram, except to migrate from the abode of war to the abode of Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} Leaving the mosque, it is recommended to step out with the left foot and to say a prayer; leaving the house, to say ''In the name of God, I rely on God'', as in the reports of Umm Salama and Anas; leaving the privy, to step out with the right foot and say the words of thanks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} Most jurists require a woman in the waiting period to remain at home; details are under ''iddah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636}'
  ur: 'خروج لغت میں دخول کی ضد ہے، فقہاء اسے اسی معنی میں لیتے ہیں اور باغی ہونے یعنی ائمہ کے خلاف نکلنے کے معنی میں بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} سبیلین سے نکلنے والی چیزوں میں منی، حیض اور نفاس غسل واجب کرتے ہیں، اور معتاد چیزیں جیسے پیشاب، پاخانہ اور ہوا وضو توڑتی ہیں؛ غیر معتاد چیز حنفیہ، شافعیہ، حنابلہ اور ابن عبد الحکم کے نزدیک وضو توڑتی ہے، جمہور مالکیہ کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} پاؤں یا اس کے بیشتر حصے کا موزے کی ساق میں نکل آنا نزعِ خف کا حکم ثابت کرتا ہے؛ شافعیہ اسے صرف لمبے موزے میں معتبر کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} اذان کے بعد بلا عذر مسجد سے نکلنا جمہور کے نزدیک مکروہ ہے، حنابلہ کے نزدیک حرام، ابو ہریرہ کے اثر سے استدلال کیا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} خطبہ کے دوران بات کرنا جمہور کے نزدیک حرام ہے، امام کے نکلنے کے بعد خطبہ شروع ہونے سے پہلے بات جائز ہے، ابو حنیفہ اس کو نکلنے سے ہی حرام کہتے ہیں؛ حنفیہ اور مالکیہ کے نزدیک امام کے نکلنے کے بعد نفل ممنوع ہے، شافعیہ اور حنابلہ کے نزدیک منبر پر بیٹھنے سے نفل ختم ہو جاتا ہے، «اجلس فقد آذيت وآنيت» سے استدلال کیا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} معتکف صرف حاجتِ انسانی یا جمعہ کے لیے نکلتا ہے، شافعیہ جمعہ کے لیے نکلنا واجب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} استسقاء کے لیے نکلنے میں جوان، بوڑھے، کمزور، معذور اور غیر خوش شکل عورتیں شامل ہیں، پیدل عاجزی اور توبہ اور صدقہ کے ساتھ؛ کفار کے نکلنے میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631} اصل یہ ہے کہ عورت کو گھر میں رہنے کا حکم ہے؛ کاسانی کے نزدیک حقِ احتباس میں عورت کو نکلنے سے روکنا شامل ہے، اور «أسكنوهن» اور «وقرن في بيوتكن» اور حدیث «المرأة عورة فإذا خرجت استشرفها الشيطان» سے استدلال کیا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632} ضرورت کے وقت جیسے والدین اور محارم کی زیارت، جنازہ اور شادی میں شرکت، یا ناگزیر حاجت، نکلنے کی اجازت ہے، بشرطیکہ فتنے کا خطرہ نہ ہو، راستہ محفوظ ہو، مردوں کے آنے جانے کا وقت نہ ہو، اختلاط کا سبب نہ بنے، اور لباس باوقار اور بے نمائش ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633} جمہور کے نزدیک شوہر کی اجازت کے بغیر نہیں نکلتی؛ شوہر اسے والدین کی زیارت سے روک سکتا ہے جب اس کے پاس اور چارہ ہو، مگر بیماری میں عیادت سے نہ روکے؛ حنفیہ کا فتویٰ ہے کہ والدین کے لیے ہر جمعہ اور محارم کے لیے سال میں ایک بار اجازت کے ساتھ یا بغیر نکل سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} بغیر اجازت بھی ایسی ضرورت کے لیے نکل سکتی ہے جس کے بغیر چارہ نہ ہو: قاضی کے پاس حق کے لیے جانا، شوہر تنگدست ہو تو نفقہ کمانا، شوہر عالم نہ ہو تو فتویٰ پوچھنا، اور گھر گرنے کا خطرہ ہو تو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} عورت کا مسجد جانا: شافعیہ اور ابو حنیفہ کے دو شاگرد جوان یا پرکشش عورت کے لیے مکروہ کہتے ہیں اور بوڑھی عورت کو نمازوں کے لیے جائز؛ مالکیہ عورتوں کو چار قسموں میں بانٹتے ہیں؛ حنابلہ مردوں کے ساتھ جماعت میں حاضری مباح کہتے ہیں، «لا تمنعوا إماء الله مساجد الله» سے استدلال کرتے ہوئے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} علماء کا اتفاق ہے کہ حج اور عمرہ کے سوا عورت محرم کے بغیر سفر نہیں کرتی، سوائے دار الحرب سے دار الاسلام کی ہجرت کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} مسجد سے نکلتے ہوئے بایاں پاؤں نکالنا اور دعا کرنا، گھر سے نکلتے ہوئے «بسم الله توكلت على الله» کہنا (ام سلمہ اور انس کی روایت)، اور بیت الخلاء سے نکلتے ہوئے دایاں پاؤں نکالنا اور شکر کے کلمات کہنا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} جمہور کے نزدیک عدت والی عورت پر گھر میں رہنا لازم ہے؛ تفصیل عدت کے مصطلح میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636}'
