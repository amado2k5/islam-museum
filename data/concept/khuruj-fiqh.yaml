id: concept/khuruj-fiqh
class: concept
kind: legal
label:
  ar: الخروج
  en: Khuruj (going out; departure rulings)
  ur: خروج
  es: "Khuruj (salida; normas de salida)"
  fr: "Khuruj (sortie; règles de départ)"
  tr: "Çıkış"
  id: "Keluar"
summary:
  ar: 'الخروج لغة نقيض الدخول، ويستعمله الفقهاء بمعناه، ويطلقونه أيضا على البغي أي الخروج على الأئمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} الخارج من السبيلين: المني والحيض والنفاس يوجب الغسل، والمعتاد غير المني كالبول والغائط والريح ينقض الوضوء، وغير المعتاد ينقضه عند الحنفية والشافعية والحنابلة وابن عبد الحكم، ولا ينقضه عند جمهور المالكية كالدود والحصى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} خروج القدم أو أكثرها إلى ساق الخف يثبت به حكم نزع الخف؛ والشافعية لا يرون ذلك إلا في الخف الطويل الخارج عن العادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} يكره الخروج من المسجد بعد الأذان بلا عذر عند الجمهور، ويحرم عند الحنابلة استدلالا بأثر أبي هريرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} الكلام حين يخطب الإمام محرم عند جمهور الفقهاء، والكلام قبل أن يبدأ الخطبة مباح عند الجمهور، وأبو حنيفة يحرمه بمجرد خروجه؛ والتطوع ممنوع بعد خروجه عند الحنفية والمالكية، وينقطع بجلوسه على المنبر عند الشافعية والحنابلة، استنادا إلى حديث «اجلس فقد آذيت وآنيت». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} المعتكف لا يخرج إلا لحاجة الإنسان أو الجمعة، والشافعية يوجبون الخروج للجمعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} الخروج للاستسقاء يخرج فيه الشباب والشيوخ والضعفاء والعجزة وغير ذوات الهيئة من النساء، مشاة بتواضع وخشوع، بعد التوبة وتقديم الصدقة؛ واختلفوا في خروج أهل الذمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631} الأصل أن المرأة مأمورة بلزوم البيت، ويذكر الكاساني أن من ملك الاحتباس منعها من الخروج، واستدل بآيات السكنى وقرن في بيوتكن، وبحديث «المرأة عورة فإذا خرجت استشرفها الشيطان». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632} وتخرج عند الحاجة كزيارة الآباء والأمهات وذوي المحارم وشهود الجنازة والعرس وقضاء حاجة لا غنى عنها، بقيود: ألا تخشى الفتنة بها، وأن يكون الطريق مأمونا، وأن يكون في زمن أمن الرجال، وألا يفضي إلى اختلاطها بالرجال، وأن يكون بهيئة غير متبرجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633} ولا تخرج إلا بإذن زوجها عند الجمهور، وللزوج منعها إذا كان لها بد عن الخروج لزيارة والديها، وينبغي له ألا يمنعها من عيادتهما؛ والمفتى به عند الحنفية أنها تخرج للوالدين كل جمعة وللمحارم في كل سنة بإذنه أو بدونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} وتخرج بغير إذنه لما لا غنى لها عنه: كالذهاب إلى القاضي لطلب حقها، وكسب النفقة إذا أعسر الزوج، والاستفتاء إذا لم يكن زوجها فقيها، وإذا كان المنزل مشرفا على الانهدام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} خروج المرأة إلى المسجد: كرهه الشافعية وصاحبا أبي حنيفة للشابة أو من تشتهى، وأجازوه للعجوز في الصلوات؛ والمالكية يقسمون النساء أربعة أقسام؛ والحنابلة يبيحون حضور الجماعة مع الرجال، استنادا إلى قول النبي «لا تمنعوا إماء الله مساجد الله». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} اتفق العلماء على أن المرأة لا تسافر في غير الحج والعمرة إلا مع ذي محرم، إلا الهجرة من دار الحرب إلى دار الإسلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} يستحب عند الخروج من المسجد تقديم الرجل اليسرى والدعاء، وعند الخروج من البيت قول «بسم الله توكلت على الله» كما في حديث أم سلمة وأنس، وعند الخروج من الخلاء تقديم اليمنى والدعاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} جمهور الفقهاء يوجبون على المعتدة لزوم البيت، وتفصيل ذلك في مصطلح العدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} وتبقى المعتدة ملازمة السكن ولا تخرج إلا لحاجة أو عذر، فإن خرجت أثمت، وللزوج منعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} ولا يصحب أمير الجيش معه مخذلا ولا مرجفا ولا جاسوسا، ومن خرج معهم فلا يسهم له ولا يرضخ وإن أظهر عون المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} أجمع العلماء على وجوب طاعة الإمام العدل وتحريم الخروج عليه، واختلفوا في الخروج على الجائر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} والمحبوس لأجل الدين يمنع من الخروج إلى أشغاله ومهماته وعيادة المرضى وتشييع الجنازة؛ لأن الحبس طريق إلى قضاء الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637}'
  en: 'Khuruj is lexically going out, the opposite of entering; jurists use it also for rebellion against the rulers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} Among what leaves the two passages, semen, menses and postnatal blood require a full wash; usual discharges such as urine, faeces and wind break wudu; unusual discharges break it for the Hanafis, Shafiis, Hanbalis and Ibn Abd al-Hakam, but not by most Malikis, who count worms and pebbles as harmless. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} The heel or most of the foot coming out into the leg of the sock brings the rule of taking off the sock; the Shafiis count this only for a long sock beyond custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Leaving the mosque after the call to prayer without excuse is disliked by most jurists and forbidden by the Hanbalis, citing a report of Abu Hurayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Speaking while the Imam preaches is forbidden by most jurists; speech before the sermon begins is permitted by most; Abu Hanifa forbids it from the moment he comes out; voluntary prayer is barred after he comes out for the Hanafis and Malikis, and ends when he sits on the pulpit for the Shafiis and Hanbalis, citing the report "sit, you have troubled and delayed". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} The one in retreat (mu''takif) leaves only for a human need or the Friday prayer; the Shafiis require him to go out for Friday. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} Going out to pray for rain (istisqa'') is allowed to the young, the old, the weak and the infirm, and women who are not in the public eye, on foot in humility and after repentance and almsgiving; the jurists differ on non-Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631} The rule is that a woman is ordered to stay at home; al-Kasani, among the rights of confinement, holds that she is kept from going out, citing the verses on dwelling and ''stay in your houses'' and the report that a woman is nakedness and the devil looks at her when she goes out. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632} She goes out for need, such as visiting parents and close kin, attending a funeral or wedding, or meeting an unavoidable need, on conditions: that she is not feared as a temptation, the road is safe, it is a time when men are not about, it does not lead to mixing with men, and she is dressed modestly, without display. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633} By majority she goes out only with her husband''s leave; he may prevent a visit to her parents when she has another option, though he should not stop her from visiting them when ill; the Hanafi fatwa is that she may visit parents each Friday and close kin yearly, with or without leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} She may go out without leave for what she cannot do without: to the judge to claim her right, to earn maintenance when the husband is poor, to ask a fatwa if he is not learned, and if the house is about to collapse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} On women going to the mosque: the Shafiis and the two companions of Abu Hanifa dislike it for a young or desirable woman and allow it to an old woman for the prayers; the Malikis divide women into four classes; the Hanbalis allow attending the congregation with men, citing ''do not forbid God''s maidservants the mosques of God''. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} Scholars agree that a woman may not travel except for Hajj or Umra without a mahram, except to migrate from the abode of war to the abode of Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} Leaving the mosque, it is recommended to step out with the left foot and to say a prayer; leaving the house, to say ''In the name of God, I rely on God'', as in the reports of Umm Salama and Anas; leaving the privy, to step out with the right foot and say the words of thanks. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} Most jurists require a woman in the waiting period to remain at home; details are under ''iddah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} A woman in the waiting period must remain at home and goes out only for need or excuse; if she goes out she sins, and her husband may stop her, as may his heirs at his death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} A commander may not take with him a disheartening man, a spreader of alarm, a spy or one who sows enmity; those who go anyway get no share or reward, even if they show help to Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} Scholars agree that a just Imam must be obeyed and rising against him is forbidden; they differ on rising against an unjust one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} A man held for debt is kept from his business, funerals, visits and sick calls, since the detention is a way to force payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637}'
  ur: 'خروج لغت میں دخول کی ضد ہے، فقہاء اسے اسی معنی میں لیتے ہیں اور باغی ہونے یعنی ائمہ کے خلاف نکلنے کے معنی میں بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} سبیلین سے نکلنے والی چیزوں میں منی، حیض اور نفاس غسل واجب کرتے ہیں، اور معتاد چیزیں جیسے پیشاب، پاخانہ اور ہوا وضو توڑتی ہیں؛ غیر معتاد چیز حنفیہ، شافعیہ، حنابلہ اور ابن عبد الحکم کے نزدیک وضو توڑتی ہے، جمہور مالکیہ کے نزدیک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} پاؤں یا اس کے بیشتر حصے کا موزے کی ساق میں نکل آنا نزعِ خف کا حکم ثابت کرتا ہے؛ شافعیہ اسے صرف لمبے موزے میں معتبر کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} اذان کے بعد بلا عذر مسجد سے نکلنا جمہور کے نزدیک مکروہ ہے، حنابلہ کے نزدیک حرام، ابو ہریرہ کے اثر سے استدلال کیا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} خطبہ کے دوران بات کرنا جمہور کے نزدیک حرام ہے، امام کے نکلنے کے بعد خطبہ شروع ہونے سے پہلے بات جائز ہے، ابو حنیفہ اس کو نکلنے سے ہی حرام کہتے ہیں؛ حنفیہ اور مالکیہ کے نزدیک امام کے نکلنے کے بعد نفل ممنوع ہے، شافعیہ اور حنابلہ کے نزدیک منبر پر بیٹھنے سے نفل ختم ہو جاتا ہے، «اجلس فقد آذيت وآنيت» سے استدلال کیا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} معتکف صرف حاجتِ انسانی یا جمعہ کے لیے نکلتا ہے، شافعیہ جمعہ کے لیے نکلنا واجب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} استسقاء کے لیے نکلنے میں جوان، بوڑھے، کمزور، معذور اور غیر خوش شکل عورتیں شامل ہیں، پیدل عاجزی اور توبہ اور صدقہ کے ساتھ؛ کفار کے نکلنے میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631} اصل یہ ہے کہ عورت کو گھر میں رہنے کا حکم ہے؛ کاسانی کے نزدیک حقِ احتباس میں عورت کو نکلنے سے روکنا شامل ہے، اور «أسكنوهن» اور «وقرن في بيوتكن» اور حدیث «المرأة عورة فإذا خرجت استشرفها الشيطان» سے استدلال کیا گیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632} ضرورت کے وقت جیسے والدین اور محارم کی زیارت، جنازہ اور شادی میں شرکت، یا ناگزیر حاجت، نکلنے کی اجازت ہے، بشرطیکہ فتنے کا خطرہ نہ ہو، راستہ محفوظ ہو، مردوں کے آنے جانے کا وقت نہ ہو، اختلاط کا سبب نہ بنے، اور لباس باوقار اور بے نمائش ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633} جمہور کے نزدیک شوہر کی اجازت کے بغیر نہیں نکلتی؛ شوہر اسے والدین کی زیارت سے روک سکتا ہے جب اس کے پاس اور چارہ ہو، مگر بیماری میں عیادت سے نہ روکے؛ حنفیہ کا فتویٰ ہے کہ والدین کے لیے ہر جمعہ اور محارم کے لیے سال میں ایک بار اجازت کے ساتھ یا بغیر نکل سکتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} بغیر اجازت بھی ایسی ضرورت کے لیے نکل سکتی ہے جس کے بغیر چارہ نہ ہو: قاضی کے پاس حق کے لیے جانا، شوہر تنگدست ہو تو نفقہ کمانا، شوہر عالم نہ ہو تو فتویٰ پوچھنا، اور گھر گرنے کا خطرہ ہو تو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} عورت کا مسجد جانا: شافعیہ اور ابو حنیفہ کے دو شاگرد جوان یا پرکشش عورت کے لیے مکروہ کہتے ہیں اور بوڑھی عورت کو نمازوں کے لیے جائز؛ مالکیہ عورتوں کو چار قسموں میں بانٹتے ہیں؛ حنابلہ مردوں کے ساتھ جماعت میں حاضری مباح کہتے ہیں، «لا تمنعوا إماء الله مساجد الله» سے استدلال کرتے ہوئے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} علماء کا اتفاق ہے کہ حج اور عمرہ کے سوا عورت محرم کے بغیر سفر نہیں کرتی، سوائے دار الحرب سے دار الاسلام کی ہجرت کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} مسجد سے نکلتے ہوئے بایاں پاؤں نکالنا اور دعا کرنا، گھر سے نکلتے ہوئے «بسم الله توكلت على الله» کہنا ⁦(ام سلمہ اور انس کی روایت)⁩، اور بیت الخلاء سے نکلتے ہوئے دایاں پاؤں نکالنا اور شکر کے کلمات کہنا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} جمہور کے نزدیک عدت والی عورت پر گھر میں رہنا لازم ہے؛ تفصیل عدت کے مصطلح میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} معتدہ عورت گھر میں رہنے کی پابند ہے، صرف ضرورت یا عذر کے لیے نکلے؛ نکلی تو گنہگار ہوگی، اور شوہر ⁦(اور اس کے مرنے پر وارث)⁩ اسے روک سکتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} لشکر کا امیر کسی بزدل دلانے والے، افواہیں پھیلانے والے، جاسوس یا دشمنی ڈالنے والے کو ساتھ نہ لے؛ ایسے لوگ نکلیں تو ان کا حصہ اور انعام نہیں، خواہ مسلمانوں کی مدد کا اظہار کریں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} علماء کا اتفاق ہے کہ عادل امام کی اطاعت واجب اور اس کے خلاف خروج حرام ہے؛ ظالم امام کے خلاف خروج میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} قرض کے سبب قید شخص کو اپنے کاموں، جنازے، عیادت اور ملاقات سے روکا جاتا ہے، کیونکہ قید قرض ادا کرنے کا ذریعہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637}'
  es: "Khuruj es léxicamente salir, lo opuesto a entrar; los juristas también lo usan para rebelarse contra los gobernantes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} Entre lo que sale de los dos pasajes, el semen, la menstruación y la sangre posparto requieren un lavado completo; las secreciones habituales como la orina, las heces y los gases rompen el wudu; las secreciones inusuales lo rompen para los Hanafis, Shafiis, Hanbalis e Ibn Abd al-Hakam, pero no para la mayoría de los Malikis, que consideran los gusanos y las piedrecitas como inofensivos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} El talón o la mayor parte del pie que sale hacia la pierna del calcetín trae la regla de quitarse el calcetín; Los shafiíes cuentan esto solo para un calcetín largo más allá de la costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Abandonar la mezquita después de la llamada a la oración sin excusa es desaprobado por la mayoría de los juristas y prohibido por los hanbalíes, citando un informe de Abu Hurayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Hablar mientras el imán predica está prohibido por la mayoría de los juristas; hablar antes de que comience el sermón está permitido por la mayoría; Abu Hanifa lo prohíbe desde el momento en que sale; la oración voluntaria está prohibida después de que sale para los hanafíes y malikíes, y termina cuando se sienta en el púlpito para los shafiíes y hanbalíes, citando el informe \"siéntate, has perturbado y demorado\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} El que está en retiro (mu'takif) sale solo por una necesidad humana o la oración del viernes; los shafiíes le exigen que salga para el viernes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} Salir a orar por la lluvia (istisqa') está permitido a los jóvenes, los ancianos, los débiles y los enfermos, y las mujeres que no están en el ojo público, a pie con humildad y después del arrepentimiento y la limosna; los juristas difieren en cuanto a los no musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631} La regla es que a una mujer se le ordena quedarse en casa; Al-Kasani, entre los derechos de confinamiento, sostiene que se le impide salir, citando los versículos sobre morada y 'permanecer en sus casas' y el informe de que una mujer está desnuda y el diablo la mira cuando sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632} Sale por necesidad, como visitar a los padres y parientes cercanos, asistir a un funeral o boda, o satisfacer una necesidad inevitable, bajo las condiciones: que no se la tema como una tentación, que el camino sea seguro, que sea un momento en que no haya hombres alrededor, que no conduzca a mezclarse con hombres, y que esté vestida modestamente, sin ostentación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633} Por mayoría, ella sale solo con el permiso de su marido; él puede impedir una visita a sus padres cuando ella tiene otra opción, aunque no debe impedirle visitarlos cuando está enferma; la fatwa Hanafi es que puede visitar a sus padres todos los viernes y a los parientes cercanos anualmente, con o sin permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} Ella puede salir sin permiso para lo que no puede hacer sin: al juez para reclamar su derecho, para ganar manutención cuando el marido es pobre, para pedir una fatwa si no es instruido, y si la casa está a punto de derrumbarse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} Sobre las mujeres que van a la mezquita: los shafiíes y los dos compañeros de Abu Hanifa lo desaprueban para una mujer joven o deseable y lo permiten para una mujer mayor para las oraciones; los malikíes dividen a las mujeres en cuatro clases; los hanbalíes permiten asistir a la congregación con los hombres, citando 'no prohibáis a las siervas de Dios las mezquitas de Dios'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} Los eruditos están de acuerdo en que una mujer no puede viajar excepto para el Hajj o la Umrah sin un mahram, excepto para migrar de la morada de la guerra a la morada del Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} Al salir de la mezquita, se recomienda salir con el pie izquierdo y decir una oración; al salir de la casa, decir 'En el nombre de Dios, confío en Dios', como en los informes de Umm Salama y Anas; al salir del retrete, salir con el pie derecho y decir palabras de agradecimiento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} La mayoría de los juristas requieren que una mujer en el período de espera permanezca en casa; los detalles están en 'iddah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} Una mujer en el período de espera debe permanecer en casa y salir solo por necesidad o excusa; si sale peca, y su esposo puede impedírselo, al igual que sus herederos a su muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} Un comandante no puede llevar consigo a un hombre desmoralizador, a un sembrador de alarma, a un espía o a quien siembra la enemistad; quienes van de todos modos no reciben parte ni recompensa, incluso si ayudan a los musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} Los eruditos concuerdan en que se debe obedecer a un imán justo y que está prohibido rebelarse contra él; difieren en cuanto a rebelarse contra uno injusto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} A un hombre detenido por deudas se le impide realizar sus negocios, funerales, visitas y consultas médicas, ya que la detención es una forma de obligarlo al pago. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637}"
  fr: "Khuruj signifie littéralement « sortir », l'opposé d'« entrer »; les juristes l'emploient également pour désigner la rébellion contre les dirigeants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628} Parmi ce qui s'écoule des deux voies, le sperme, les menstruations et le sang post-partum requièrent un ablution complète; les sécrétions habituelles telles que l'urine, les matières fécales et les gaz annulent les ablutions; les sécrétions inhabituelles les annulent pour les hanafites, les chaféites, les hanbalites et Ibn Abd al-Hakam, mais pas pour la plupart des malikites, qui considèrent les vers et les cailloux comme inoffensifs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7628}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Lorsque le talon ou la majeure partie du pied dépasse dans la jambe de la chaussette, il faut retirer celle-ci. Les chaféites ne considèrent cela que comme une chaussette longue portée au-delà de la coutume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Quitter la mosquée après l'appel à la prière sans excuse est désapprouvé par la plupart des juristes et interdit par les hanbalites, selon un hadith rapporté par Abou Hourayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7629} Parler pendant le sermon de l'imam est interdit par la plupart des juristes; parler avant le début du sermon est permis par la plupart; Abou Hanifa l'interdit dès que l'imam sort de l'estrade; la prière surérogatoire est interdite après sa sortie pour les hanafites et les malikites, et se termine lorsqu'il s'assoit en chaire pour les chaféites et les hanbalites, selon le hadith: « Assieds-toi, tu t'es dérangé et tu as tardé. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} Celui qui est en retraite spirituelle (mu'takif) ne sort que pour un besoin humain ou pour la prière du vendredi; les chaféites exigent qu'il sorte pour le vendredi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7630} Sortir pour prier pour la pluie (istisqa') est permis aux jeunes, aux personnes âgées, aux faibles et aux infirmes, ainsi qu'aux femmes qui ne sont pas en public, à condition qu'elles le fassent à pied, humblement, après s'être repenties et avoir fait l'aumône; les juristes divergent quant au cas des non-musulmans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631} La règle est qu'une femme doit rester à la maison; Al-Kasani, parmi les droits liés au confinement, soutient qu'il est interdit à la femme de sortir, citant les versets sur l'obligation d'habiter et de « rester dans vos maisons », ainsi que le hadith selon lequel la nudité d'une femme et le regard du diable lorsqu'elle sort. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7631}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632} Elle ne sort que pour des raisons essentielles, comme rendre visite à ses parents et à ses proches, assister à des funérailles ou à un mariage, ou satisfaire un besoin impérieux, à condition qu'elle ne représente pas une tentation, que la route soit sûre, que ce soit à un moment où les hommes ne sont pas présents, que cela n'entraîne pas de fréquentation masculine, et qu'elle soit vêtue modestement, sans ostentation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7632}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633} À la majorité, elle ne sort qu'avec la permission de son mari; celui-ci peut s'opposer à une visite chez ses parents si elle a une autre possibilité, mais il ne doit pas l'empêcher de leur rendre visite lorsqu'elle est malade; la fatwa hanafite autorise la visite aux parents chaque vendredi et aux proches parents une fois par an, avec ou sans permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7633}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} Elle peut sortir sans permission pour les raisons essentielles: se rendre chez le juge pour faire valoir ses droits, obtenir une pension alimentaire si son mari est pauvre, demander une fatwa s'il n'est pas instruit, et si le foyer est au bord de l'effondrement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634} Concernant la présence des femmes à la mosquée: les chaféites et les deux compagnons d’Abu Hanifa la déconseillent aux jeunes femmes ou aux femmes de bonne famille, mais l’autorisent aux femmes âgées pour la prière; les malikites divisent les femmes en quatre catégories; les hanbalites autorisent la participation des femmes à la prière en congrégation avec les hommes, citant: « Nul n’interdit aux servantes de Dieu l’accès aux mosquées de Dieu. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7634}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} Les savants s’accordent à dire qu’une femme ne peut voyager, sauf pour le Hajj ou la Omra, sans un mahram, sauf pour émigrer d’une zone de guerre vers une zone d’islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7635} En quittant la mosquée, il est recommandé de poser le pied gauche et de réciter une prière; en quittant la maison, de dire « Au nom de Dieu, je m’en remets à Dieu », comme le rapportent Umm Salama et Anas; en sortant des toilettes, de poser le pied droit et de prononcer des paroles de remerciement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} La plupart des juristes exigent qu’une femme durant la période de viduité (iddah) reste à la maison; les détails sont précisés dans la section consacrée à ce sujet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7636} Une femme durant la période de viduité doit rester à la maison et ne sortir qu’en cas de nécessité ou pour un motif valable; si elle sort, elle commet un péché, et son mari peut l’en empêcher, de même que ses héritiers à son décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} Un commandant ne peut emmener avec lui un homme décourageant, un semeur de troubles, un espion ou un instigateur d'inimitié; ceux qui partent malgré tout ne reçoivent ni part ni récompense, même s'ils apportent leur aide aux musulmans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} Les savants s'accordent sur le fait qu'il faut obéir à un imam juste et qu'il est interdit de se rebeller contre lui; ils divergent quant à la rébellion contre un imam injuste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637} Un homme détenu pour dettes est privé de ses affaires, des funérailles, des visites et des visites aux malades, car la détention est un moyen de contraindre au paiement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7637}"
  tr: "Dilsel olarak, 'khud' 'khul'un tam tersidir ve hukukçular bunu anlamında kullanır, ayrıca imamlara karşı isyan etmek anlamına gelen 'al-bagh'a da uygularlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7628} İki yolun dışında olanlar: meni, adet ve doğum sonrası kanama ghusl gerektirir; idrar, dışkı ve rüzgar gibi olağan tohumsuz eylemler destmemeyi geçersiz kılar; Hanefi'ler, Şafi'ler, Hanbaliler ve İbn Abdül-Hakam'a göre alışılmadık olan, ancak Maliki görüşlerinin çoğuna göre, örneğin solucanlar ve çakıllar bunu geçersiz kılmaz. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7629} Ayak veya çoğu çorabın bacağına kadar uzanıyorsa, çorapların çıkarılmasına ilişkin kural belirlenir; Şafi'ler bunu sadece alışılmış alışkanlık dışı uzun çoraplar için geçerli sayırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7629} Çoğunluğa göre ezandan sonra mazeretsiz camiden ayrılmak hoş karşılanmaz ve Hanbali'ye göre, Abu Huraira'nın rivayetine göre bu yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7629} İmam vaaz ederken konuşmak, çoğu hukukçuya göre yasaktır ve vaaz başlamadan önce konuşmak çoğunluk için izinlidir. Ebu Hanife, ayrılır ayrılmaz bunu yasak ilan eder; Hanafi ve Maliki'ye göre ayrıldıktan sonra gönüllü faaliyet yasaktır ve Şafi'ler ile Hanbali'lere göre vaaz kürsüsüne oturarak durdurulur; bu hadise göre \"Oturun, çünkü zarar gördünüz ve gözaltına alındınız.\" {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7630} İtikaf yapan kişi yalnızca bir kişinin ihtiyacı veya Cuma namazı için izin verilir ve Şafiiler Cuma günü dışarı çıkmasını zorunlu kılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7630} Yağmur için dışarı çıkmak (istisqa), gençlerin, yaşlıların, zayıfların, zayıfların, engellilerin ve kadınların tövbe edip sadaka verdikten sonra alçakgönüllülük ve saygıyla yürümesini içerir; zimmi halkının dışarı çıkması konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7631} Asıl ilke, kadınların evde kalmaları emredilir. Al-Kasani, evi yöneten kişinin onun dışarı çıkmasını yasakladığını, evde yaşamak ve orada kalma ayetlerini ve \"Bir kadın 'awrah'dır, dışarı çıktığında Şeytan ona bakar\" hadisini belirtir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7631} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7632} ve gerektiğinde dışarı çıkar; örneğin babaları, anneleri, akrabaları ziyaret etmek, cenaze ve düğünlere katılmak ve vazgeçilmez ihtiyaçları yerine getirmek için, şu şartlarla: ayartmadan korkmamak, yol güvenli olmalı, insanların güvenli olduğu bir zamanda olmalı, insanlarla karışmaya yol açmamalı ve mütevazı olmayan bir görünümde olmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7633} Sadece kocasının izniyle dışarı çıkabilir, ancak çoğunluk öncesinde kocasının izniyle çıkabilir. Koca, anne babasını ziyaret etmek zorunda kalırsa onu engelleyebilir ve onları ziyaret etmesini engellememelidir. Hanefi okuluna göre yasal hüküm, her yıl ailesinin yanına ve her yıl mahram için dışarı çıkması gerektiğidir; ister izni olsun ister izninin izni olsun ya da olmasın. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7633} ve onun izni olmadan vazgeçilmez şeyler için dışarı çıkar: haklarını talep etmek için hakime gitmek, koca zor durumdaysa nafaka kazanmak, kocası hukukçu değilse fetva istemek ve ev çöküşün eşiğindeyse ev. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7634} Şafiiler genç kadınlar veya arzulayanlar için Ebu Hanifa'nın sahabelerinden hoşlanmaz, yaşlı kadınlar için namazda izin verir; Malikiler kadınları dört kategoriye ayırır; Hanbalılar ise Peygamber'in \"Allah'ın kullarını Allah'ın camilerinden alıkoymayın\" sözüne dayanarak erkeklerle birlikte cemaat namazı etmesine izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7635} Alimler, bir kadının hac ve umre dışında bir ihramda olan kişiyle seyahat etmemesi gerektiği konusunda hemfikirdir; ancak savaş diyarından İslam diyarına göç ederken hareket eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7635} Camiden çıkarken sol ayağını öne koyup dua etmek, evden çıkarken \"Allah'ın adıyla Allah'a güvendim\" demek, Um Salama ve Anas'ın hadislerinde belirtildiği gibi, tuvaletten çıkarken sağ ayağını öne atıp dua etmek tavsiye edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7636} Çoğu hukukçu, bekleyen kadının (i'idah) evde kalmasını zorunlu kılar ve bu bekleme süresi terminolojisinde ayrıntılı olarak belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7636} Bekleme süresi sürekli bir ikametgah olarak kalır ve sadece ihtiyaç ya da bahane olursa ayrılmaz; eğer çıkarsa günahkardır ve kocanın onu engelleme hakkı vardır. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 7637} Ordu komutanı, hain, casus veya casus olarak ona eşlik etmemelidir ve onlarla dışarı çıkan kişi, açıkça Müslümanları desteklese bile ona ne katkıda bulunmalı ne de boyun eğmelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7637} Âlimler, adil İmama itaat etme ve ona karşı isyanı yasaklama yükümlülüğünde oybirliğiyle hemfikirdirler, ancak zalimlere karşı isyan konusunda farklı görüştedirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7637} Mahkumun görevlerine, görevlerine gitmesi, hastaları ziyaret etmesi ve cenazelere katılması yasaktır, çünkü hapis borcun ödenme yoludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7637}"
  id: "Secara linguistik, 'khud' adalah kebalikan dari 'khul', dan para ahli hukum menggunakannya dalam maknanya, serta mereka juga menerapkannya pada 'al-bagh', yang berarti memberontak terhadap para imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7628} Apa yang berada di luar dua cara: air mani, menstruasi, dan perdarahan pasca melahirkan membutuhkan ghusl; tindakan non-seminal seperti urin, kotoran, dan angin membatalkan wudhu; yang tidak biasa, menurut Hanafi, Shafi'i, Hanbali, dan Ibn Abd al-Hakam, tetapi menurut mayoritas pandangan Maliki, seperti cacing dan kerikil, tidak membatalkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7628} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7629} Jika kaki atau sebagian besar kaki memanjang ke kaki kaus kaki, maka aturan melepas kaus kaki ditetapkan; para syafi'i hanya menganggap ini berlaku untuk kaus kaki panjang yang di luar kebiasaan biasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7629} Menurut mayoritas, tidak disukai meninggalkan masjid setelah panggilan salat tanpa alasan dan dilarang menurut Hanbali, berdasarkan riwayat Abu Huraira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7629} Berbicara saat imam berkhotbah dilarang menurut mayoritas ahli hukum, dan berbicara sebelum khotbah dimulai diperbolehkan oleh mayoritas. Abu Hanifa menyatakan hal itu dilarang segera setelah ia pergi; kegiatan sukarela setelah pergi dilarang menurut Hanafi dan Maliki, dan dihentikan dengan duduk di mimbar menurut Shafi'i dan Hanbali, berdasarkan hadits \"Duduklah, karena kamu telah menyakiti dan ditahan.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7630} Orang yang menjalankan i'tikaf hanya diperbolehkan untuk kebutuhan seseorang atau untuk salat Jumat, dan para Shafi'i mewajibkan keluar pada hari Jumat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7630} Keluar untuk hujan (istisqa) melibatkan anak muda, orang tua, yang lemah, yang lemah, yang cacat, dan perempuan yang berjalan dengan rendah hati dan hormat, setelah bertobat dan memberi amal; ada perbedaan pendapat tentang orang-orang dhimmi yang keluar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7631} Prinsip aslinya adalah perempuan diperintahkan untuk tinggal di rumah. Al-Kasani menyebutkan bahwa orang yang memegang rumah melarangnya keluar, mengutip ayat-ayat tentang tinggal dan tinggal di rumah, dan hadits \"Seorang wanita adalah 'awrah, jadi ketika dia keluar, Setan menjaganya.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7631} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7632} dan keluar saat diperlukan, seperti mengunjungi ayah, ibu, kerabat, menghadiri pemakaman dan pernikahan, serta memenuhi kebutuhan yang tak terpisahkan, dengan syarat: tanpa takut godaan, jalan harus aman, harus di saat keselamatan manusia, tidak boleh bercampur dengan manusia, dan harus dalam penampilan yang tidak sopan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7632} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7633} Dia hanya boleh keluar dengan izin suaminya sebelum usia dewasa. Suami boleh mencegahnya jika dia harus pergi mengunjungi orang tuanya, dan dia tidak boleh melarangnya mengunjungi mereka. Aturan hukum menurut mazhab Hanafi adalah dia harus pergi ke rumah orang tuanya setiap Jumat dan untuk makan mahram setiap tahun, dengan atau tanpa izin suaminya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7633} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7634} dan dia keluar tanpa izin untuk hal-hal yang sangat penting: seperti pergi ke hakim untuk menuntut haknya, mencari nafkah jika suami dalam kesulitan, mencari fatwa jika suaminya bukan ahli hukum, dan jika rumah hampir runtuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7634} Para Syafi'i tidak menyukainya dan sahabat Abu Hanifa untuk wanita muda atau mereka yang menginginkannya, dan mengizinkannya untuk wanita tua dalam shalat; Malikis membagi wanita menjadi empat kategori; dan Hanbal mengizinkan menghadiri shalat berjamaah bersama pria, berdasarkan kata Nabi: \"Jangan halangi hamba Allah masuk ke masjid-masjid Allah.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7634} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7635} Para ulama sepakat bahwa seorang wanita tidak boleh bepergian kecuali untuk Haji dan Umrah bersama orang dalam ihar, kecuali ketika bermigrasi dari tanah perang ke tanah Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7635} Disarankan saat meninggalkan masjid untuk memajukan kaki kiri dan memohon, dan saat keluar rumah, mengucapkan \"Atas nama Allah, aku telah bersandar kepada Allah\" seperti yang tercantum dalam hadis um Salama dan Anas, dan saat keluar dari kamar mandi, untuk melangkah kaki kanan ke depan dan memohon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7636} Mayoritas ahli hukum mewajibkan wanita yang menunggu (i'idah) untuk tinggal di rumah, dan hal ini dijelaskan dalam istilah masa tunggu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7636} Masa tunggu tetap menjadi tempat tinggal yang tetap dan tidak pergi kecuali karena kebutuhan atau alasan; jika dia pergi, dia berdosa, dan suami berhak menghalanginya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.. 7637} Komandan tentara tidak boleh menemaninya sebagai pengkhianat, mata-mata, atau mata-mata, dan siapa pun yang pergi bersama mereka tidak boleh menyumbang kepadanya atau tunduk meskipun secara terbuka mendukung Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7637} Para ulama sepakat sepakat tentang kewajiban untuk mematuhi Imam yang adil dan melarang pemberontakan terhadapnya, tetapi mereka berbeda pendapat mengenai pemberontakan terhadap penindas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7637} Seorang tahanan dilarang keluar untuk menjalankan tugas, tugas, mengunjungi orang sakit, dan menghadiri pemakaman, karena penahanan adalah cara untuk melunasi hutang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7637}"
