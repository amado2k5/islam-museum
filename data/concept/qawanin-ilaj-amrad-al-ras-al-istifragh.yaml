label:
  ar: "قوانين علاج أمراض الرأس: الاستفراغ"
  en: "The laws of treating diseases of the head: evacuation"
  ur: "سر کی بیماریوں کے علاج کے قوانین: استفراغ"
summary:
  ar: "يذكر ابن سينا ترتيب الاستفراغ في مادة الرأس: الفصد إذا كان الدم وافراً، واستفراغ البدن كله قبل الرأس، وإنضاج المادة قبل تنقية الرأس، والجذب إلى الخلاف، ومعالجة سوء المزاج الحادث بالضد {cite:canon-ibn-sina-print-v2 pp.26-28}"
  en: "Ibn Sina gives the order of evacuation for matter in the head: venesection if blood is plentiful, evacuating the whole body before the head, ripening the matter before cleansing the head, drawing to the opposite side, and treating a resulting ill-temperament by its opposite {cite:canon-ibn-sina-print-v2 pp.26-28}"
  ur: "ابن سینا سر کے مادے میں استفراغ کی ترتیب بتاتا ہے: خون وافر ہو تو فصد، سر سے پہلے پورے بدن کا استفراغ، سر کی صفائی سے پہلے مادے کو پکانا، مخالف سمت کی طرف کھینچنا، اور پیدا ہونے والے سوءِ مزاج کا علاج ضد سے {cite:canon-ibn-sina-print-v2 pp.26-28}۔"
