perspectives:
  - tradition: sunni-maliki
    id: maliki-no-annul
    summary:
      ar: "المشهور من المذهب المالكي أنه لا قيام بالغبن في بيع المساومة، وهو قول أبي حنيفة والشافعي {cite:usul-iqtisad-islami-0660 p. 293}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: istirsal-annul
    summary:
      ar: "الغبن في بيع الأمانة أو الاسترسال حيث يأتمن المشتري البائع ولا يماكسه، يُعد ظلماً وربا ويُفسخ {cite:usul-iqtisad-islami-0660 p. 293}، والحديث فيه منسوب إلى البيهقي ولا يذكر الكتاب درجته {cite:usul-iqtisad-islami-0660 p. 294}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: academic
    id: sanhuri-modern
    summary:
      ar: "يقرر السنهوري أن أكثر المذاهب الإسلامية لا تعتد بالغبن ولو فاحشاً إلا إذا صحبه تغرير أو تدليس، وهو شأن أكثر الشرائع الغربية {cite:usul-iqtisad-islami-0660 p. 294}."
    sources: [source/usul-iqtisad-islami-0660]
