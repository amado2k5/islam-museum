label:
  ar: "الغبن في البيع"
  en: "Ghabn (undervaluation) in sale"
issue:
  ar: "هل يفسخ البيع بالغبن الفاحش؟"
summary:
  ar: "الغبن في البيع فرق في الثمن بين القيمة والثمن المدفوع، ويذكر المؤلف أن أكثر المذاهب لا تفسخ البيع بالغبن الفاحش في بيع المساومة، وأن الغبن في بيع الأمانة والاسترسال يُعد ربا ويقتضي الفسخ، بحديث «غبن المسترسل ربا» {cite:usul-iqtisad-islami-0660 p. 293} {cite:usul-iqtisad-islami-0660 p. 294}."
wings: [ideas]
