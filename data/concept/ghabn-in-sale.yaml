id: concept/ghabn-in-sale
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "الغبن في البيع"
  en: "Ghabn (undervaluation) in sale"
  es: "Ghabn (infravaloración) en venta"
  fr: "Ghabn (sous-évaluation) en vente"
  ur: "غبن ⁦(کم قیمت)⁩ فروخت میں"
  tr: "Satışta Adaletsizlik"
  id: "Ketidakadilan dalam Penjualan"
issue:
  ar: "هل يفسخ البيع بالغبن الفاحش؟"
summary:
  ar: "الغبن في البيع فرق في الثمن بين القيمة والثمن المدفوع، ويذكر المؤلف أن أكثر المذاهب لا تفسخ البيع بالغبن الفاحش في بيع المساومة، وأن الغبن في بيع الأمانة والاسترسال يُعد ربا ويقتضي الفسخ، بحديث «غبن المسترسل ربا» {cite:usul-iqtisad-islami-0660 p. 293} {cite:usul-iqtisad-islami-0660 p. 294}."
  tr: "Satışta haksızlık, değer ile ödenen fiyat arasındaki fiyat farkıdır. Yazar, çoğu okulun satışta yapılan ağır adaletsizlik nedeniyle satışı iptal etmediğini, güven ve süreklilik satışındaki haksızlıkların tefecilik olarak kabul edildiğini ve iptal edilmesi gerektiğini belirtir; bu hadiste \"ödenmemişin haksız suistimali tefeciliktir\" {cite:usul-iqtisad-islami-0660 s. 293} {cite:usul-iqtisad-islami-0660 s. 294} belirtir."
  id: "Ketidakadilan dalam penjualan adalah perbedaan harga antara nilai dan harga yang dibayar. Penulis menyebutkan bahwa sebagian besar sekolah tidak membatalkan penjualan karena ketidakadilan besar dalam penjualan tawar-menawar, dan ketidakadilan dalam penjualan trust dan kontinuitas dianggap riba dan memerlukan pembatalan, menurut hadits \"pelanggaran tidak adil dari yang tidak dibayar adalah riba\" {cite:usul-iqtisad-islami-0660 hlm. 293} {cite:usul-iqtisad-islami-0660 hlm. 294}."
