  ar: يوم الحوض
  en: The Day of the Basin
  ur: یوم حوض
summary:
  ar: "يوم الحوض في القرآن والسنة: اليوم الذي يُعرض فيه الناس على حوض النبي، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يسقيهم من حوضه."
  en: "The Day of the Basin in Qur'an and Sunnah: the day people are presented at the Prophet's Basin — a sign of the Hour, a day of indescribable terror, when God gives them drink from His Basin."
  ur: "یوم حوض قرآن و سنت میں: وہ دن جب لوگ نبی کے حوض پر لائے جاتے ہیں — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ انہیں اپنے حوض سے پلاتا ہے۔"
