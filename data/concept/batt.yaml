label:
  ar: "بطّ"
  en: "Batt (the duck, a domestic waterfowl)"
  fr: "Batt (canard, oiseau aquatique domestique)"
  ur: "بط ⁦(مرغابی)⁩"
  es: "Murciélago (el pato, un ave acuática doméstica)"
summary:
  ar: "نوع من الطيور، حارّة أسخن من جميع الطيور الأهلية، شحمها من أفضل شحوم الطير في تسكين الوجع، ولحمها بطيء الهضم ثقيل في المعدة، وأخفّه الأجنحة {cite:canon-ibn-sina-print-v1 p.402}."
  en: "A kind of bird, hotter than all domestic birds. Its fat is among the best for easing pain, its meat is slow and heavy in the stomach, and the wings are the lightest part {cite:canon-ibn-sina-print-v1 p.402}."
  fr: "Oiseau plus chaud que tous les oiseaux domestiques. Sa graisse compte parmi les meilleures pour calmer la douleur ; sa chair est lente et lourde dans l’estomac, les ailes étant la partie la plus légère {cite:canon-ibn-sina-print-v1 p.402}."
  ur: "پرندے کی ایک قسم، جو تمام گھریلو پرندوں سے زیادہ گرم ہے۔ اس کی چربی درد کم کرنے میں سب سے بہتر چربیوں میں ہے، گوشت ہضم میں دیر لیتا اور معدے پر بھاری ہے، اور اس کے پر سب سے ہلکا حصہ ہیں {cite:canon-ibn-sina-print-v1 p.402}۔"
  es: "Un tipo de ave, más picante que todas las aves domésticas. Su grasa es una de las mejores para aliviar el dolor, su carne es lenta y pesada para el estómago, y las alas son la parte más ligera {cite:canon-ibn-sina-print-v1 p.402}."
