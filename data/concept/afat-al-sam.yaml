label:
  ar: "آفات السمع"
  en: "The disorders of hearing"
  fr: "Les troubles de l’ouïe"
  ur: "سماعت کی آفتیں"
  es: "Los trastornos de la audición"
  tr: "İşitme lezyonları"
  id: "Lesi pendengaran"
summary:
  ar: "آفات السمع كآفات سائر الأفعال: إما أن يبطل الفعل فيكون بطلان السمع، أو ينقص فلا يستقصى ولا يسمع من بعيد، أو يتغير فيسمع ما ليس مثل الدوي والطنين والصفير؛ وآفة السمع إما أصلية فيكون صمماً أو طرشاً أو وقراً ولادياً وإما عارضة، والصمم أن يكون الصماخ قد خلق باطنه أصمم ليس فيه التجويف الباطن، والطرش والوقر أن لا تبلغ الآفة عدم الحس، وقد يكون السبب مشاركة عضو كمشاركة الدماغ أو آفة خاصة في العصبة أو الثقبة {cite:canon-ibn-sina-print-v2 p.218}"
  en: "Disorders of hearing are like the disorders of all functions: either the function is annulled — loss of hearing; or lessened — hearing is not exhaustive and not from afar; or altered — hearing what is not, like the ringing, buzzing and whistling that occur in the ear. A disorder of hearing is either original — congenital deafness, hardness or dullness of hearing — or adventitious; deafness is the meatus created solid within, lacking the inner cavity, while hardness and dullness are the lesion not reaching loss of sensation; the cause may be an organ's sharing, as the brain's, or a lesion special to the nerve or the meatus {cite:canon-ibn-sina-print-v2 p.218}"
  fr: "Les troubles de l’ouïe sont semblables à ceux de toutes les fonctions : soit la fonction est abolie — perte de l’ouïe ; soit elle est diminuée — l’ouïe ne perçoit pas tout et n’entend pas de loin ; soit elle est altérée — on entend ce qui n’existe pas, comme les tintements, bourdonnements et sifflements qui se produisent dans l’oreille. Un trouble de l’ouïe est soit originel — surdité, dureté ou affaiblissement congénitaux de l’ouïe — soit acquis ; dans la surdité, le conduit a été créé plein à l’intérieur, sans cavité interne, tandis que la dureté et l’affaiblissement sont une lésion qui ne va pas jusqu’à la perte de la sensation ; la cause peut être la participation d’un organe, comme le cerveau, ou une lésion propre au nerf ou au conduit {cite:canon-ibn-sina-print-v2 p.218}"
  ur: "سماعت کی آفتیں تمام افعال کی آفتوں جیسی ہیں: یا فعل باطل ہو — سماعت کا بطلان؛ یا کم ہو — نہ پوری سنے نہ دور سے؛ یا بدل جائے — وہ سنے جو نہیں، جیسے کان میں گونج، بھنبھناہٹ اور سیٹی؛ اور سماعت کی آفت یا اصلی ہے — پیدائشی بہرہ پن، سماعت کی سختی یا بھاری پن — یا عارضی؛ بہرا پن یہ ہے کہ صماخ اندر سے ٹھوس پیدا ہوا ہو، اس میں اندرونی جوف نہ ہو؛ اور سختی اور بھاری پن یہ ہے کہ آفت حس کے زوال تک نہ پہنچے؛ اور سبب کسی عضو کی شرکت ہو سکتا ہے جیسے دماغ کی، یا عصبے یا ثقبے کی خاص آفت {cite:canon-ibn-sina-print-v2 p.218}"
  es: "Los trastornos de la audición son como los trastornos de todas las funciones: o bien la función se anula (pérdida de audición); o bien se reduce (la audición no es completa ni de lejos); o bien se altera (se oye lo que no existe, como los zumbidos, pitidos y silbidos que se producen en el oído). Un trastorno de la audición puede ser de origen original (sordera congénita, dureza o sordera) o adquirido; la sordera se produce cuando el conducto auditivo externo se forma de manera sólida, careciendo de la cavidad interna, mientras que la dureza y la sordera son lesiones que no llegan a causar pérdida de sensibilidad; la causa puede ser la afectación de un órgano, como el cerebro, o una lesión específica del nervio o del conducto auditivo externo. {cite:canon-ibn-sina-print-v2 p.218}"
  tr: "İşitme bozuklukları diğer fiiller gibi: ya eylem geçersiz olur ve işitme geçersiz kalır, ya azalır ve uzaktan algılanamaz veya duyulamaz, ya da değişerek yankı, çınlama veya ıslık gibi olmayan bir şey duymaya başlar. İşitme lezyonu ya orijinaldir, örneğin sağırlık, sağırlık, doğuştan işitme engellilik veya kazara işitme kaybı. Sağırlık, meatus'un iç boşluk olmadan içsel olarak sağır olarak oluşmasıdır. Sağırlık ve sağırlık, lezyonun uyuşmaya ulaşmamasıdır. Neden beynin tutulumu gibi bir organın etkisi veya sinir ya da foramen'deki belirli bir lezyon olabilir {cite:canon-ibn-sina-print-v2 s.218}"
  id: "Gangguan pendengaran seperti kata kerja lain: baik tindakan menjadi tidak valid dan pendengaran menjadi tidak valid, atau menurun dan tidak dapat dirasakan atau didengar dari kejauhan, atau berubah dan mulai mendengar sesuatu yang tidak seperti gema, dering, atau siulan. Lesi pendengaran bisa menjadi asli, misalnya, tuli, tuli, gangguan pendengaran bawaan, atau kehilangan pendengaran secara tidak sengaja. Tuli adalah ketika meatus tuli secara internal tanpa rongga internal. Tuli dan tuli adalah ketika lesi tidak mencapai mati rasa. Mengapa bisa menjadi efek dari organ, seperti keterlibatan otak, atau lesi spesifik pada saraf atau foramen {cite:canon-ibn-sina-print-v2 hlm.218}"
