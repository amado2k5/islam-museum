label:
  ar: "آفات السمع"
  en: "The disorders of hearing"
  ur: "سماعت کی آفتیں"
summary:
  ar: "آفات السمع كآفات سائر الأفعال: إما أن يبطل الفعل فيكون بطلان السمع، أو ينقص فلا يستقصى ولا يسمع من بعيد، أو يتغير فيسمع ما ليس مثل الدوي والطنين والصفير؛ وآفة السمع إما أصلية فيكون صمماً أو طرشاً أو وقراً ولادياً وإما عارضة، والصمم أن يكون الصماخ قد خلق باطنه أصمم ليس فيه التجويف الباطن، والطرش والوقر أن لا تبلغ الآفة عدم الحس، وقد يكون السبب مشاركة عضو كمشاركة الدماغ أو آفة خاصة في العصبة أو الثقبة {cite:canon-ibn-sina-print-v2 p.218}"
  en: "Disorders of hearing are like the disorders of all functions: either the function is annulled — loss of hearing; or lessened — hearing is not exhaustive and not from afar; or altered — hearing what is not, like the ringing, buzzing and whistling that occur in the ear. A disorder of hearing is either original — congenital deafness, hardness or dullness of hearing — or adventitious; deafness is the meatus created solid within, lacking the inner cavity, while hardness and dullness are the lesion not reaching loss of sensation; the cause may be an organ's sharing, as the brain's, or a lesion special to the nerve or the meatus {cite:canon-ibn-sina-print-v2 p.218}"
  ur: "سماعت کی آفتیں تمام افعال کی آفتوں جیسی ہیں: یا فعل باطل ہو — سماعت کا بطلان؛ یا کم ہو — نہ پوری سنے نہ دور سے؛ یا بدل جائے — وہ سنے جو نہیں، جیسے کان میں گونج، بھنبھناہٹ اور سیٹی؛ اور سماعت کی آفت یا اصلی ہے — پیدائشی بہرہ پن، سماعت کی سختی یا بھاری پن — یا عارضی؛ بہرا پن یہ ہے کہ صماخ اندر سے ٹھوس پیدا ہوا ہو، اس میں اندرونی جوف نہ ہو؛ اور سختی اور بھاری پن یہ ہے کہ آفت حس کے زوال تک نہ پہنچے؛ اور سبب کسی عضو کی شرکت ہو سکتا ہے جیسے دماغ کی، یا عصبے یا ثقبے کی خاص آفت {cite:canon-ibn-sina-print-v2 p.218}"
