label: { ar: "الساعات الممتدلة في زيج البتاني", en: "Equated hours in al-Battani's reckoning", ur: "البتانی کے حساب میں معتدل گھنٹے", es: "Horas equivalentes en el cálculo de al-Battani", fr: "Des heures équivalentes selon le calcul d'al-Battani", tr: "Al-Battani'nin Zij'inde uzun çalışma saatleri", id: "Perpanjangan jam di Zij Al-Battani" }
summary:
  ar: "الساعات الممتدلة، وتسمى الساعات الوسطى، هي ساعات تتساوى فيها أجزاء النهار والليل بحسب الاعتدال، ويرى البتاني أن ساعات التقويم في كل بلد هي هذه الساعات بعينها، التي تُعدّ من وقت انتصاف النهار. {cite:zij-sabi-nallino-byblion p.108}."
  en: "Equated hours, also called mean hours, are hours in which the parts of the day and night are equal by the equinox. Al-Battani holds that the reckoning hours of each place are these very hours, counted from noon. {cite:zij-sabi-nallino-byblion p.108}."
  ur: "معتدل گھنٹے، جنہیں اوسط گھنٹے بھی کہا جاتا ہے، ایسے گھنٹے ہیں جن میں دن اور رات کے حصے اعتدال کے لحاظ سے برابر ہوتے ہیں۔ البتانی کے مطابق ہر شہر کے تقویمی گھنٹے یہی گھنٹے ہیں جو دوپہر سے شمار ہوتے ہیں۔ {cite:zij-sabi-nallino-byblion p.108}۔"
  es: "Las horas iguales, también llamadas horas medias, son aquellas en las que la duración del día y de la noche es igual en el equinoccio. Al-Battani sostiene que las horas de cálculo de cada lugar son precisamente estas horas, contadas desde el mediodía. {cite:zij-sabi-nallino-byblion p.108}."
  fr: "Les heures équivalentes, également appelées heures moyennes, sont les heures où les parties du jour et de la nuit sont égales à l'équinoxe. Al-Battani soutient que les heures de calcul de chaque lieu sont précisément ces heures, comptées à partir de midi. {cite:zij-sabi-nallino-byblion p.108}."
  tr: "Uzun saatler, aynı zamanda orta saatler olarak da adlandırılır ve ekinoksa göre gün ve gecenin eşit olduğu zaman dilimleridir. El-Battani, her ülkedeki takvim saatlerinin, öğle vaktinden itibaren sayılan bu saatler olduğuna inanmaktadır. {cite:zij-sabi-nallino-byblion s.108}."
  id: "Jam-jam yang diperpanjang, juga disebut jam tengah, adalah jam-jam di mana bagian siang dan malam sama menurut ekuinoks. Al-Battani percaya bahwa jam kalender di setiap negara adalah jam-jam ini, yang dihitung dari tengah hari. {cite:zij-sabi-nallino-byblion p.108}."
