label: { ar: "الساعات الممتدلة في زيج البتاني", en: "Equated hours in al-Battani's reckoning", ur: "البتانی کے حساب میں معتدل گھنٹے" }
summary:
  ar: "الساعات الممتدلة، وتسمى الساعات الوسطى، هي ساعات تتساوى فيها أجزاء النهار والليل بحسب الاعتدال، ويرى البتاني أن ساعات التقويم في كل بلد هي هذه الساعات بعينها، التي تُعدّ من وقت انتصاف النهار. {cite:zij-sabi-nallino-byblion p.108}."
  en: "Equated hours, also called mean hours, are hours in which the parts of the day and night are equal by the equinox. Al-Battani holds that the reckoning hours of each place are these very hours, counted from noon. {cite:zij-sabi-nallino-byblion p.108}."
  ur: "معتدل گھنٹے، جنہیں اوسط گھنٹے بھی کہا جاتا ہے، ایسے گھنٹے ہیں جن میں دن اور رات کے حصے اعتدال کے لحاظ سے برابر ہوتے ہیں۔ البتانی کے مطابق ہر شہر کے تقویمی گھنٹے یہی گھنٹے ہیں جو دوپہر سے شمار ہوتے ہیں۔ {cite:zij-sabi-nallino-byblion p.108}۔"
