id: concept/al-mizan
class: concept
kind: belief
label: { ar: "الميزان", en: "The balance (al-mizan)", ur: "میزان" }
summary:
  ar: "يرى الشعراوي أن الكون يسير بميزان محكم لا دخل للإنسان فيه، وأن الإنسان مطالب بإقامة الميزان في الأمور التي له فيها اختيار، فلا يطغى فيها، وأن الفساد يجيء من حيث تدخل يد الإنسان بغير منهج الله {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1064} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1065}."
  en: "Sha'rawi holds that the cosmos runs by an exact balance in which humans have no hand, and that humans are bound to keep the balance in matters where they have choice, so as not to transgress. Corruption comes where human hands act without God's method {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1064} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1065}."
  ur: "شعراوی کے نزدیک کائنات ایک محکم میزان پر چل رہی ہے جس میں انسان کا کوئی دخل نہیں، اور انسان پر لازم ہے کہ جن امور میں اسے اختیار ہے ان میں میزان قائم رکھے اور سرکشی نہ کرے۔ فساد وہاں آتا ہے جہاں انسانی ہاتھ اللہ کے طریقے کے بغیر کام کرے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1064} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1065}۔"
