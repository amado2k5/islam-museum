label:
  ar: اختضاب
  en: Dyeing the hair (ikhtidab)
summary:
  ar: الاختضاب استعمال الخضاب لتغيير لون الشعر بالحناء والكتم والورس والزعفران أو السواد؛ والمختار عند الجمهور استحباب تغيير الشيب، ويُكره السواد في غير الحرب عند الحنابلة والمالكية والحنفية، ويحرم عند الشافعية لغير المجاهدين؛ وللمرأة استحباب خضب الكفين والقدمين بالحناء في غير الإحرام بإذن زوجها أو سيدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1930}.
  en: 'Ikhtidab (dyeing the hair): the use of dye to change the colour of hair with henna, katam, waras, saffron or black; the majority hold that changing the grey is recommended; black is disliked outside war by the Hanbalis, Malikis and Hanafis and forbidden by the Shafi''is except to holy warriors; a woman is recommended to dye her hands and feet with henna outside ihram with her husband''s or master''s leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1930}.'
