label:
  ar: اختضاب
  en: Dyeing the hair (ikhtidab)
summary:
  ar: الاختضاب استعمال الخضاب لتغيير لون الشعر بالحناء والكتم والورس والزعفران أو السواد؛ والمختار عند الجمهور استحباب تغيير الشيب، ويُكره السواد في غير الحرب عند الحنابلة والمالكية والحنفية، ويحرم عند الشافعية لغير المجاهدين؛ وللمرأة استحباب خضب الكفين والقدمين بالحناء في غير الإحرام بإذن زوجها أو سيدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1930}. والمرأة غير المزوجة يكره لها الخضب في الكفين والقدمين عند الثلاثة، وللأيم عند الحنابلة الجواز، والوشم حرام مطلقاً، وتُكره خضب اللحية السوداء بالبياض، والخضاب للحائض والتداوي جائز، والمحدة يحرم عليها، ويكره تلطيخ رأس المولود بالدم، والرجل يخضب رأسه ولحيته ويحرم عليه تخصيص اليدين والقدمين، والمحرم لا يخضب بالحناء عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1934}.
  en: 'Ikhtidab (dyeing the hair): the use of dye to change the colour of hair with henna, katam, waras, saffron or black; the majority hold that changing the grey is recommended; black is disliked outside war by the Hanbalis, Malikis and Hanafis and forbidden by the Shafi''is except to holy warriors; a woman is recommended to dye her hands and feet with henna outside ihram with her husband''s or master''s leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1930}. The unmarried woman is disliked dyeing hands and feet by three schools, a widow may dye according to the Hanbalis, tattooing is absolutely forbidden, dyeing a black beard white is disliked, dyeing for a menstruating woman and for treatment is lawful, a widow in mourning may not dye, the head of a newborn is not to be smeared with blood, a man dyes his head and beard and may not dye hands and feet, and one in ihram may not use henna according to the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1934}.'
