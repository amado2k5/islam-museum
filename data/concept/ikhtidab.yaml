label:
  ar: اختضاب
  en: Dyeing the hair (ikhtidab)
  es: "Teñir el cabello (ikhtidab)"
  fr: "Teindre les cheveux (ikhtidab)"
  ur: "بالوں کو رنگنا ⁦(اختیاب)⁩"
  tr: "Boyama"
  id: "Pewarnaan"
summary:
  ar: الاختضاب استعمال الخضاب لتغيير لون الشعر بالحناء والكتم والورس والزعفران أو السواد؛ والمختار عند الجمهور استحباب تغيير الشيب، ويُكره السواد في غير الحرب عند الحنابلة والمالكية والحنفية، ويحرم عند الشافعية لغير المجاهدين؛ وللمرأة استحباب خضب الكفين والقدمين بالحناء في غير الإحرام بإذن زوجها أو سيدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1930}. والمرأة غير المزوجة يكره لها الخضب في الكفين والقدمين عند الثلاثة، وللأيم عند الحنابلة الجواز، والوشم حرام مطلقاً، وتُكره خضب اللحية السوداء بالبياض، والخضاب للحائض والتداوي جائز، والمحدة يحرم عليها، ويكره تلطيخ رأس المولود بالدم، والرجل يخضب رأسه ولحيته ويحرم عليه تخصيص اليدين والقدمين، والمحرم لا يخضب بالحناء عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1934}.
  en: 'Ikhtidab (dyeing the hair): the use of dye to change the colour of hair with henna, katam, waras, saffron or black; the majority hold that changing the grey is recommended; black is disliked outside war by the Hanbalis, Malikis and Hanafis and forbidden by the Shafi''is except to holy warriors; a woman is recommended to dye her hands and feet with henna outside ihram with her husband''s or master''s leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1930}. The unmarried woman is disliked dyeing hands and feet by three schools, a widow may dye according to the Hanbalis, tattooing is absolutely forbidden, dyeing a black beard white is disliked, dyeing for a menstruating woman and for treatment is lawful, a widow in mourning may not dye, the head of a newborn is not to be smeared with blood, a man dyes his head and beard and may not dye hands and feet, and one in ihram may not use henna according to the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1934}.'
  es: "Ikhtidab (teñido del cabello): el uso de tinte para cambiar el color del cabello con henna, katam, waras, azafrán o negro; la mayoría considera que teñir las canas es recomendable; el negro es desaconsejado fuera de la guerra por los hanbalíes, malikíes y hanafíes, y está prohibido por los shafiíes, excepto para los guerreros santos; se recomienda a una mujer teñirse las manos y los pies con henna fuera del ihram con el permiso de su esposo o amo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1927} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1928} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1929} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1930}. Según tres escuelas de pensamiento, a las mujeres solteras no les gusta que se tiñan las manos y los pies; según los hanbalíes, una viuda puede teñirse; el tatuaje está absolutamente prohibido; teñirse la barba negra de blanco es desaconsejable; teñirse para una mujer menstruante y con fines terapéuticos es lícito; una viuda en duelo no puede teñirse; no se debe untar la cabeza de un recién nacido con sangre; un hombre se tiñe la cabeza y la barba, pero no las manos ni los pies; y quien está en estado de ihram no puede usar henna según los hanafíes y los malikíes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1931} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1932} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1933} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1934}."
  fr: "Ikhtidab (teinture des cheveux): utilisation de teinture pour changer la couleur des cheveux avec du henné, du katam, du waras, du safran ou du noir; la majorité considère qu’il est recommandé de changer les cheveux gris; le noir est désapprouvé en dehors de la guerre par les Hanbalites, les Malikites et les Hanafites et interdit par les Shafi’ites, sauf pour les guerriers saints; il est recommandé à une femme de se teindre les mains et les pieds au henné en dehors de l’ihram avec la permission de son mari ou de son maître. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1930}. Selon trois écoles de pensée, il est déconseillé à une femme célibataire de se teindre les mains et les pieds; selon les Hanbalites, une veuve peut se teindre les mains et les pieds; le tatouage est absolument interdit; il est déconseillé de teindre une barbe noire en blanc; la teinture est licite pour une femme menstruée et à des fins thérapeutiques; une veuve en deuil ne peut se teindre les mains et les pieds; il ne faut pas tacher la tête d’un nouveau-né de sang; un homme peut se teindre la tête et la barbe, mais pas les mains ni les pieds; et selon les Hanafites et les Malikites, une personne en état d’ihram ne peut utiliser de henné. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1934}."
  ur: "اختیدب ⁦(بالوں کو رنگنا)⁩: مہندی، کتم، وارس، زعفران یا سیاہ سے بالوں کا رنگ تبدیل کرنے کے لیے رنگنے کا استعمال؛ اکثریت کا خیال ہے کہ سرمئی کو تبدیل کرنے کی سفارش کی جاتی ہے۔ حنبلیوں، مالکیوں اور حنفیوں کے نزدیک جنگ سے باہر سیاہ رنگ کو ناپسند ہے اور شافعیوں کے ہاں حرام ہے سوائے مقدس جنگجوؤں کے۔ عورت کو مستحب ہے کہ وہ اپنے شوہر یا آقا کی رخصت کے ساتھ احرام کے باہر مہندی سے ہاتھ پاؤں رنگے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1926} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1927} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1928} صفحہ 1929} {حوالہ: فقہ معسوہ کویتیہ نور v3 صفحہ 1930}۔ غیر شادی شدہ عورت کا تین مکاتب سے ہاتھ پاؤں رنگنا ناپسند ہے، حنبلی عقیدہ کے مطابق بیوہ خضاب لگا سکتی ہے، گودنا قطعی حرام ہے، کالی داڑھی کو سفید رنگنا ناپسندیدہ ہے، حائضہ عورت کے لیے خضاب لگانا اور علاج کے لیے حلال ہے، ماتم میں بیوہ عورت کے خون سے خضاب نہیں ہو سکتا، مرد کے سر پر خضاب لگانا بالکل حرام ہے۔ اپنے سر اور داڑھی کو رنگے اور ہاتھ پاؤں نہ رنگے اور احرام والا احناف اور مالکیہ کے نزدیک مہندی نہ لگائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1931} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1932} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1933} صفحہ 1934}۔"
  tr: "Boyama, saç rengini kına, katam, ras, safran veya siyah ile değiştirmek için boyanın kullanılmasıdır; çoğunluk arasında tercih edilen görüş gri rengin değiştirilmesini önerirken, savaş dışında karartma Hanbaliler, Malikiler ve Hanefiler tarafından sevilmez ve Şafiilere göre Mücahit olmayanlar için yasaktır. Kadınlar için, kocalarının veya ustalarının izniyle el ve ayakların ihram dışında kına ile boyanması önerilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1928} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.1929}} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1930}. Evlenmemiş bir kadın, üçünün de ellerini ve ayaklarını boyamaktan hoşlanmazdı; Hanbali'ye göre bekar bir anne için bu izinlidir; dövme yaptırmak kesinlikle yasaktır; siyah sakalı beyaza boyamak hoş karşılanmaz; adet gören bir kadını boyamak ve tedavi yapmak caizdir; ihram (yasak) olmayan ve yeni doğanın başını kan ile lekeleyen bir kadın; bir erkek başını ve sakalını boyamalı ve ellerini, ayaklarını özel olarak boyaması yasaktır; ve bir mahram Hanafi ve Maliki'ye göre kına ile boyanmaz. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1934}."
  id: "Pewarnaan adalah penggunaan pewarna untuk mengubah warna rambut dengan henna, katam, ras, saffron, atau hitam; pandangan yang disukai oleh mayoritas adalah merekomendasikan perubahan abu-abu, sedangkan menghitamkan di luar perang tidak disukai oleh Hanbali, Maliki, dan Hanafi, serta dilarang menurut Shafi'i bagi non-Mujahidin. Untuk wanita, disarankan mewarnai tangan dan kaki dengan henna di luar ihram dengan izin suami atau tuannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1928} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1930}. Seorang wanita yang belum menikah tidak suka mewarnai tangan dan kaki untuk ketiganya; untuk ibu tunggal menurut Hanbali, diperbolehkan; tato sangat dilarang; tidak suka mewarnai janggut hitam menjadi putih; mewarnai wanita yang sedang menstruasi dan perlakuan diperbolehkan; wanita yang tidak dalam keadaan ihram (terlarang) dan tidak suka menodai kepala bayi dengan darah; seorang pria harus mewarnai kepala dan janggutnya serta dilarang memiliki tangan dan kakinya khusus; dan mahram tidak diwarnai dengan henna menurut Hanafi dan Maliki. {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 hlm.1931} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1934}."
