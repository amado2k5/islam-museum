summary:
  ar: "الآبنوس خشب أسود محض يُجلب من الزنج، يُحكّ في الماء كالحجر، وهو ملطّف جلاء؛ ينفع من الغشاوة والبياض في العين، ويذكر أنه يفتّت حصاة الكلى {cite:canon-ibn-sina-print-v1 p.370} {cite:canon-ibn-sina-print-v1 p.371}."
  en: "Abnus is pure black wood brought from the land of the Zanj; it is rubbed in water like a stone, and is thinning and clearing. It helps films and whiteness of the eye, and the book says it breaks kidney stone {cite:canon-ibn-sina-print-v1 p.370} {cite:canon-ibn-sina-print-v1 p.371}."
  fr: "L'abnus est un bois d'un noir pur apporté du pays des Zanj ; on le frotte dans l'eau comme une pierre, et il est atténuant et détersif. Il est utile contre les voiles et les taches blanches de l'œil, et le livre dit qu'il brise les calculs rénaux {cite:canon-ibn-sina-print-v1 p.370} {cite:canon-ibn-sina-print-v1 p.371}."
  ur: "آبنوس خالص سیاہ لکڑی ہے جو زنج سے لائی جاتی ہے؛ یہ پانی میں پتھر کی طرح گھستی ہے، لطیف اور جلا دینے والی ہے؛ یہ آنکھ کے جالے اور سفیدی میں مفید ہے، اور کتاب کے مطابق گردے کی پتھری توڑتی ہے {cite:canon-ibn-sina-print-v1 p.370} {cite:canon-ibn-sina-print-v1 p.371}۔"
