id: concept/al-bukhl
class: concept
kind: ethical
label:
  ar: "البخل"
  en: "Stinginess (bukhl)"
  ur: "بخل"
summary:
  ar: "البخل عند الشعراوي منع ما وهبه الله للإنسان عمّن يحتاجه، ولا يقتصر على المال، بل يشمل القدرة على معونة العاجز والعلم والحلم وكل موهبة يفتقر إليها غيره. ويرى أن البخيل يكره أن يرى الناس أجواداً، وأن المال المكنوز يضيع على صاحبه لأنه لا يثمر {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2226}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2233}."
  en: "For al-Sha'rawi, stinginess is withholding from someone in need what God has given you. It is not limited to money: it covers strength to help the weak, knowledge, forbearance and every gift others lack. He holds that the miser dislikes seeing others generous, and that hoarded wealth is lost to its owner because it does not bear fruit {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2226}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2233}."
  ur: "شعراوی کے نزدیک بخل یہ ہے کہ اللہ کی عطا کردہ چیز ضرورت مند سے روک لی جائے۔ یہ صرف مال تک محدود نہیں بلکہ کمزور کی مدد کی قدرت، علم، حلم اور ہر وہ صلاحیت جس کی دوسروں کو ضرورت ہو، اس میں شامل ہے۔ ان کے مطابق بخیل کو دوسروں کی سخاوت بری لگتی ہے، اور روکا ہوا مال بار آور نہ ہونے کی وجہ سے اپنے مالک کے ہاتھ سے جاتا رہتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2226}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2233}۔"
