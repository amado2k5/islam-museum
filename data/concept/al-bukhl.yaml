issue:
  ar: "هل يقتصر البخل على المال، وما الذي يفسده في صاحبه؟"
  en: "Is stinginess limited to money, and what does it do to the one who practises it?"
  ur: "کیا بخل صرف مال تک محدود ہے، اور یہ اپنے صاحب کو کیا نقصان دیتا ہے؟"
