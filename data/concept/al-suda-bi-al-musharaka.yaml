id: concept/al-suda-bi-al-musharaka
class: concept
kind: scientific
label:
  ar: "الصداع الكائن بالمشاركة"
  en: "Headache by sharing"
  fr: "Céphalée par participation"
  ur: "مشارکت سے ہونے والا صداع"
  es: "Dolor de cabeza por compartir"
  tr: "HTP'nin neden olduğu baş ağrısı"
  id: "Sakit kepala yang disebabkan oleh HTP"
summary:
  ar: "يقسّم ابن سينا الصداع بالمشاركة إلى مطلقة وغير مطلقة، ويذكر ما يتأدى إلى الدماغ من العضو المشارك وكيف يصير سبباً لمادة مؤذية، والمشاركة مع البدن كله، والأعضاء المشاركة للرأس وأولها المعدة؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.49-50}"
  en: "Ibn Sina divides headache by sharing into absolute and not absolute, tells what passes to the brain from the sharing organ and how it becomes the cause of a harmful matter, treats sharing with the whole body, and lists the organs that share with the head, the stomach first; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.49-50}"
  fr: "Ibn Sina distingue la céphalée par participation absolue de celle par participation non absolue. Il décrit ce qui passe de l’organe participant au cerveau et comment cela peut engendrer une matière nuisible. Il traite de la participation du corps entier et énumère les organes qui participent avec la tête, l’estomac en premier. La notice comporte une mention signalée dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 pp.49-50}"
  ur: "ابن سینا مشارکت سے ہونے والے صداع کو مطلق اور غیر مطلق میں بانٹتا ہے، بتاتا ہے کہ شریک عضو سے دماغ تک کیا پہنچتا ہے اور وہ ضرر دینے والے مادے کا سبب کیسے بنتا ہے، پورے بدن کی مشارکت کا ذکر کرتا ہے، اور سر کے شریک اعضا گنتا ہے جن میں معدہ پہلا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.49-50}۔"
  es: "Ibn Sina divide el dolor de cabeza por compartición en absoluto y no absoluto, explica qué se transmite al cerebro desde el órgano compartido y cómo se convierte en la causa de un problema perjudicial, trata la compartición con todo el cuerpo y enumera los órganos que comparten con la cabeza, comenzando por el estómago; el registro tiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 pp.49-50}"
  tr: "İbn Sina, baş ağrılarını katılıma göre mutlak ve mutlak olanlara ayırır; katılımcı organdan beyne neyin geldiğini ve bunun zararlı bir maddenin neden haline geldiğini, tüm vücutla ve başın eklem organlarıyla, özellikle mideyle paylaştığını belirtir; ve kurucunun kararı üzerine bir bölümde başlıklı bir satır vardır {cite:canon-ibn-sina-print-v2 s.49-50}"
  id: "Ibn Sina membagi sakit kepala menjadi absolut dan absolut menurut partisipasi; ia menyatakan apa yang berasal dari organ yang berpartisipasi ke otak dan mengapa organ tersebut menjadi zat berbahaya, yang dibagikan ke seluruh tubuh dan organ sendi kepala, terutama lambung; dan atas keputusan pendiri, terdapat bagian berjudul dengan baris {cite:canon-ibn-sina-print-v2 hlm.49-50}"
