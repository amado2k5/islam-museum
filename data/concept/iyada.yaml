id: concept/iyada
class: concept
kind: legal
label:
  ar: "عِيادة المريض"
  en: "Visiting the sick (iyada)"
  ur: "عیادت (مریض کی تیمار داری)"
summary:
  ar: "العيادة في اللغة الزيارة مطلقاً، واشتهر استعمالها في زيارة المريض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946}. واختلف الفقهاء في حكمها: فجمهورهم على أنها سنة أو مندوبة، وقد تصل إلى الوجوب في حق بعض الأفراد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946}، وقال ابن علان من الشافعية إنها سنة كفاية، وقيل فرض كفاية، وذهب آخرون إلى الوجوب، ونقل النووي الإجماع على أنها ليست واجبة على الأعيان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946}. وعند المالكية هي مندوبة إذا قام بها غيره، وإلا وجبت كفاية، وتجب عيناً على من تلزمه نفقته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}. وتكره عيادة صاحب البدعة الدينية، وتحرم على العالم إن ترتبت عليها مفاسد كإغراء العامة باتباعه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}. وتجوز عيادة الفاسق في الأصح، وعيادة الكافر إن رجي إسلامه، وعيادة الذمي، وفي عيادة المجوس قولان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}. وقد وردت في فضلها أحاديث، منها أن الله يعاتب العبد يوم القيامة بأنه لم يعد مريضه، وأن المسلم إذا عاد أخاه لم يزل في خُرفة الجنة حتى يرجع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948}. ومن آدابها ألا يطيل الجلوس إلا إذا علم أنه لا يشق على المريض، وأن يدنو منه ويضع يده على جسمه ويسأله عن حاله، ويبشره بما يسره، ويوصيه بالصبر، ويطلب منه الدعاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948}. ومن آدابها أن يحمل إليه ما يستروح به كالريحان أو الفاكهة، وأن يتصدق عليه إن كان محتاجاً، وأن يرغبه في التوبة والوصية إن لم يتأذ بذلك، وأن يزيل خوفه إن غلب عليه بذكر محاسن عمله {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}. وتسن العيادة في كل وقت يصلح لها ولأي مرض كان، ولا تتقيد بمدة من ابتداء المرض، وتكون عقب العلم بالمرض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}. وتشرع للمسلمين كافة، والقريب ومن يعرفه آكد وأفضل، والجار من قرب محله بحيث تقضي العادة بوده وتفقده، أما العدو فتحرم عيادته أو تكره إن علم أو ظن كراهة المريض لدخوله وأن رؤيته تضره ضرراً لا يحتمل عادة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}. وكان النبي إذا عاد مريضاً دعا له بالشفاء والعافية، ومن ذلك أن يقول العائد سبع مرات: أسأل الله العظيم رب العرش العظيم أن يشفيك، فإن كان في أجله تأخير عوفي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}. وإذا اشتهى المريض طعاماً أطعمه العائد إياه ما لم يضره، فإن ضره صرفه عنه برفق، وليس له أن يكرهه على شيء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}."
  en: "In the lexicon, iyada means visiting in general, but the word became fixed for visiting the sick {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946}. The jurists differ on its ruling. The majority hold it a sunna or recommended act, which may rise to an obligation for some persons {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946}. Ibn Alan of the Shafiis calls it a communal sunna, and others a communal obligation; al-Nawawi reports a consensus that it is not an individual obligation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946}. For the Malikis it is recommended if others perform it, and otherwise a communal obligation; it is an individual obligation on the one whose maintenance the sick person is owed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}. Visiting a man of religious innovation is disliked, and forbidden to a scholar when it leads to harm such as encouraging the public to follow him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}. Visiting a sinner is allowed in the sounder view; visiting a non-Muslim is allowed if his conversion is hoped for, and visiting a protected non-Muslim is allowed; on visiting a Magian there are two opinions {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}. Many reports praise it: on the Day of Judgment God reproaches the servant who did not visit a sick person, and one who visits a Muslim brother stays in the fruit-gathering of Paradise until he returns {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948}. Etiquette: do not stay long unless the patient is not burdened and at ease; come near, lay a hand on the body, ask about his condition, speak words that gladden him, counsel patience, and ask for his prayer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948}. The visitor may bring something refreshing such as basil or fruit, give charity if the patient is needy, encourage repentance and a will if this does not distress him, and if the patient fears death, remove the fear by recalling his good deeds {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}. Visiting is recommended at any suitable time, for any illness, without a set interval from its onset, and right after the news of the illness {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}. It is for all Muslims; kin and acquaintances have the stronger claim, and a neighbour is one near enough that custom expects affection and enquiry. An enemy who knows or suspects the patient dislikes his entry, and whose sight would harm him beyond what is usual, should not visit or it is disliked {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}. If the patient craves food the visitor should give it, unless it harms him; he may not compel him to eat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}."
  ur: "عیادت لغت میں عام زیارت کو کہتے ہیں، مگر مریض کی زیارت کے لیے مشہور ہو گیا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946}۔ فقہاء کا حکم میں اختلاف ہے: جمہور کے نزدیک یہ سنت یا مستحب ہے اور بعض افراد کے حق میں واجب ہو سکتی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946}۔ مالکیہ کے نزدیک دوسرے کے ادا کرنے پر مستحب، ورنہ فرضِ کفایہ، اور جس پر مریض کا نفقہ واجب ہو اس پر فرضِ عین ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11946} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}۔ بدعتِ دینیہ والے کی عیادت مکروہ ہے اور عالم کے لیے حرام ہے اگر اس سے فساد پیدا ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}۔ فاسق کی عیادت اصح قول میں جائز ہے، کافر کی جائز ہے جب اس کے اسلام کی امید ہو، ذمی کی جائز ہے، اور مجوسی کے بارے میں دو قول ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11947}۔ اس کی فضیلت میں احادیث وارد ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948}۔ آداب میں مختصر بیٹھنا، قریب ہونا، حال پوچھنا، خوش کرنے والی بات کہنا، صبر کی وصیت کرنا اور دعا کی درخواست کرنا شامل ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948}۔ اگر مریض مستحق ہو تو صدقہ، اور اگر تکلیف نہ ہو تو توبہ اور وصیت کی ترغیب دی جائے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}۔ عیادت ہر مناسب وقت میں مسنون ہے، کسی بھی بیماری میں، بیماری کی ابتدا کی مدت سے مقید نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}۔ یہ تمام مسلمانوں کے لیے مشروع ہے، اور رشتہ دار اور جاننے والے زیادہ مؤکد ہیں؛ دشمن کی عیادت اس صورت میں حرام یا مکروہ ہے جب مریض اس کے آنے کو ناپسند کرے اور اس کا دیکھنا اسے ضرر پہنچائے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11949}۔ مریض کو کھانے کی خواہش ہو تو عیادت کرنے والا وہ کھلائے جب تک نقصان نہ ہو، اور اس پر زبردستی نہ کرے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11950}۔"
