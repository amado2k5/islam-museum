  ar: "المشتقات المالية"
  en: "Financial derivatives"
summary:
  ar: "المشتقات (derivatives) عند المؤلف هي العقود المستقبلية في البورصة، وسميت كذلك لأن قيمتها مشتقة من غيرها، ويستخدم معظمها في المضاربة على الأسعار {cite:usul-iqtisad-islami-0660 p. 353}. وتفصل الخطر عن أصله، فتصير المخاطرة سلعة يُتاجر بها {cite:usul-iqtisad-islami-0660 p. 353}. والمخاطرة التابعة لمال أو عمل جائزة وتزيد العائد، والمستقلة لا يجوز أن يكون لها عائد {cite:usul-iqtisad-islami-0660 p. 353}."
