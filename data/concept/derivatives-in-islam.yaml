  tr: "Finansal türevler"
  id: "Derivatif keuangan"
summary:
  ar: "المشتقات (derivatives) عند المؤلف هي العقود المستقبلية في البورصة، وسميت كذلك لأن قيمتها مشتقة من غيرها، ويستخدم معظمها في المضاربة على الأسعار {cite:usul-iqtisad-islami-0660 p. 353}. وتفصل الخطر عن أصله، فتصير المخاطرة سلعة يُتاجر بها {cite:usul-iqtisad-islami-0660 p. 353}. والمخاطرة التابعة لمال أو عمل جائزة وتزيد العائد، والمستقلة لا يجوز أن يكون لها عائد {cite:usul-iqtisad-islami-0660 p. 353}."
  tr: "Yazara göre türevler, değerlerinin başkalarından türetildiği için bu isimle adlandırılan borsa vadeli işlem sözleşmeleridir {cite:usul-iqtisad-islami-0660 s. 353}. Riski kaynağından ayırırlar, böylece risk işlem gören bir emtia haline gelir {cite:usul-iqtisad-islami-0660 s. 353}. Para veya ödül işiyle ilgili risk getiriyi artırırken, bağımsız risklerin getiri sağlamaması gerekir {cite:usul-iqtisad-islami-0660 s. 353}."
  id: "Derivatif menurut penulis adalah kontrak berjangka di bursa, dinamai demikian karena nilainya berasal dari yang lain, dan sebagian besar digunakan untuk spekulasi harga {cite:usul-iqtisad-islami-0660 hlm. 353}. Derivatif memisahkan risiko dari asalnya, sehingga risiko menjadi komoditas yang diperdagangkan {cite:usul-iqtisad-islami-0660 hlm. 353}. Risiko terkait uang atau bisnis hadiah meningkatkan pengembalian, sementara risiko independen tidak boleh memiliki imbal hasil {cite:usul-iqtisad-islami-0660 hlm. 353}."
