label:
  ar: "المعلّق (التعليق)"
  en: "Mu'allaq (suspended chain)"
summary:
  ar: "التعليق عند ابن الصلاح ما حُذف من مبتدأ إسناده واحد فأكثر، حتى استعمله بعضهم في حذف الإسناد كله، كقول البخاري: قال رسول الله، أو قال ابن عباس، أو قال الزهري عن أبي سلمة. ويرى أن ما أورده البخاري في صحيحه معلقاً بصيغة الجزم صورته صورة الانقطاع وليس حكمه حكمه، ولا يخرج من قبيل الصحيح، ورد على ابن حزم في جعله حديث المعازف منقطعاً. وأخذه من تعليق الجدار والطلاق لما فيه من قطع الاتصال {cite:muqaddima-ibn-salah-itr p. 67-70}."
  en: "For Ibn al-Salah ta'liq is the omission of one or more narrators from the beginning of a chain, some using it even for dropping the whole chain, as when al-Bukhari writes 'the Messenger of God said', 'Ibn Abbas said' or 'al-Zuhri from Abu Salama'. He holds that what al-Bukhari gives in his Sahih suspended in a decisive form looks broken but does not take the ruling of a broken chain and does not leave the category of sound, and he rejects Ibn Hazm's treatment of the hadith on musical instruments as broken. He derives the term from 'suspending' a wall or a divorce, since all share a cut in continuity."
