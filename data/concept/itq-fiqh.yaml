label:
  ar: "العتق"
  en: "Itq (manumission)"
  ur: "عتق ⁦(غلام کی آزادی)⁩"
term: { ar: "عِتْق", en: "itq" }
summary:
  ar: "العتق في الفقه إسقاط المولى ملكه عن مملوكه على وجه مخصوص يصير به المملوك من الأحرار. يجعله ابن عابدين في رد المحتار من «الإسقاطات» مع العفو والإبراء والطلاق، ويذكر أن ركنه اللفظ الدال عليه، وأنه يكون واجباً في الكفارات ومباحاً ومندوباً، وأنه ليس عبادة في وضعه وإنما يصير قربة بالنية. {cite:radd-al-muhtar-scan-v3 p.21} {cite:radd-al-muhtar-scan-v3 p.22}"
  en: "In fiqh, itq is the master's release of his ownership of a slave in a specified way by which the slave joins the free. Ibn Abidin in Radd al-Muhtar counts it among the 'releases' with pardon, acquittal and divorce, says its pillar is the wording that expresses it, and that it is obligatory in expiations, otherwise permitted or recommended, and is not worship by nature but becomes an act of devotion through intention."
  ur: "فقہ میں عتق یہ ہے کہ مالک ایک خاص طریقے سے اپنے غلام سے اپنی ملکیت ساقط کر دے جس سے غلام آزادوں میں شامل ہو جائے۔ ابن عابدین رد المحتار میں اسے عفو، ابراء اور طلاق کے ساتھ «اسقاطات» میں شمار کرتے ہیں، اس کا رکن اس پر دلالت کرنے والا لفظ بتاتے ہیں، اور کہتے ہیں کہ یہ کفارات میں واجب، ورنہ مباح یا مستحب ہے، اور اپنی وضع میں عبادت نہیں بلکہ نیت سے قربت بنتا ہے۔"
