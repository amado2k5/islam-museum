term: { ar: "عِتْق", en: "itq" }
summary:
  ar: "العتق في الفقه إسقاط المولى ملكه عن مملوكه على وجه مخصوص يصير به المملوك من الأحرار. يجعله ابن عابدين في رد المحتار من «الإسقاطات» مع العفو والإبراء والطلاق، ويذكر أن ركنه اللفظ الدال عليه، وأنه يكون واجباً في الكفارات ومباحاً ومندوباً، وأنه ليس عبادة في وضعه وإنما يصير قربة بالنية. {cite:radd-al-muhtar-scan-v3 p.21} {cite:radd-al-muhtar-scan-v3 p.22}"
  en: "In fiqh, itq is the master's release of his ownership of a slave in a specified way by which the slave joins the free. Ibn Abidin in Radd al-Muhtar counts it among the 'releases' with pardon, acquittal and divorce, says its pillar is the wording that expresses it, and that it is obligatory in expiations, otherwise permitted or recommended, and is not worship by nature but becomes an act of devotion through intention."
  ur: "فقہ میں عتق یہ ہے کہ مالک ایک خاص طریقے سے اپنے غلام سے اپنی ملکیت ساقط کر دے جس سے غلام آزادوں میں شامل ہو جائے۔ ابن عابدین رد المحتار میں اسے عفو، ابراء اور طلاق کے ساتھ «اسقاطات» میں شمار کرتے ہیں، اس کا رکن اس پر دلالت کرنے والا لفظ بتاتے ہیں، اور کہتے ہیں کہ یہ کفارات میں واجب، ورنہ مباح یا مستحب ہے، اور اپنی وضع میں عبادت نہیں بلکہ نیت سے قربت بنتا ہے۔"
  es: "En fiqh, itq es la renuncia del amo a la propiedad de un esclavo de una manera específica, mediante la cual el esclavo pasa a ser libre. Ibn Abidin, en Radd al-Muhtar, la incluye entre las \"liberaciones\" junto con el perdón, la absolución y el divorcio, afirma que su pilar es la formulación que la expresa, y que es obligatoria en las expiaciones, permitida o recomendada en otros casos, y que no es un acto de adoración por naturaleza, sino que se convierte en un acto de devoción a través de la intención."
  fr: "En jurisprudence islamique (fiqh), l'itq désigne l'affranchissement par le maître de son esclavage selon des modalités précises, permettant ainsi à l'esclave de rejoindre la liberté. Ibn Abidin, dans son ouvrage Radd al-Muhtar, le classe parmi les « affranchissements » au même titre que le pardon, l'acquittement et le divorce. Il précise que son fondement réside dans la formulation même de l'acte, qu'il est obligatoire dans les expiations, par ailleurs permis ou recommandé, et qu'il ne constitue pas un acte d'adoration en soi, mais devient une dévotion par l'intention."
  tr: "Hukukta özgürleşme, efendinin mülkünden belirli bir şekilde alınmasıdır; böylece mülkiyeti sahiplenen kişi özgür olur. İbn Abidin Radd al-Muhtar'da bunu aff, beraat ve boşanma ile 'feragatler' olarak görür; bunun unsurunun bunu belirten ifade, kefaret olarak zorunlu, izin verilen ve tavsiye edilen bir şey olduğunu, kuruluşunda ibadet değil, kasıtlı bir yakınlık biçimi haline geldiğini belirtir. {cite:radd-al-muhtar-scan-v3 s.21} {cite:radd-al-muhtar-scan-v3 s.22}"
  id: "Dalam hukum, emansipasi adalah penghapusan kepemilikan tuan dari hartanya dengan cara tertentu, sehingga menjadikan yang dimiliki sebagai milik bebas. Ibn Abidin dalam Radd al-Muhtar menganggapnya sebagai salah satu 'pengabaian' dengan pengampunan, pembebasan, dan perceraian, dengan menyebutkan bahwa elemennya adalah kata-kata yang menunjukkannya, bahwa itu wajib dalam penebusan, diperbolehkan, dan direkomendasikan, dan bahwa itu bukan disembah dalam pendiriannya melainkan menjadi bentuk kedekatan dengan niat. {cite:radd-al-muhtar-scan-v3 hlm.21} {cite:radd-al-muhtar-scan-v3 hlm.22}"
