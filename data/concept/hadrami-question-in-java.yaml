summary:
  ar: "يعرض شكيب أرسلان مسألة هجرة الحضارمة إلى جزائر الهند الشرقية الهولندية، ويذكر أن الحكومة الهولندية ضايقتهم في الإقامة والتنقل وحدّت من دخولهم، مع أن كثيراً منهم استقر هناك وصار من أهلها. وينقل عن المستشرق سنوك هورغرونيه قوله إن منع الحضارمة لم يكن عدلاً، ولكنه يعرض أيضاً سياسة الإدارة الهولندية في تحجيم النفوذ الديني والقانوني الإسلامي، ومنها عدم سنّ قوانين مأخوذة من الشريعة وإبقاء الأحوال الشخصية وحدها للمسلمين. ويرى أرسلان أن هذه السياسة تقصد إضعاف الروابط بين مسلمي جاوى والعالم الإسلامي. هذا عرض لرأي المؤلف ومصادره، وقد يخالف فيه غيره."
  en: "Arslan describes how the Dutch restricted Hadrami Arab migrants in the Dutch East Indies, limiting their movement and residence although many had settled and become local. He quotes the orientalist Christiaan Snouck Hurgronje, who called the exclusion unjust but favoured limiting Islamic influence, including avoiding Sharia-based legislation and leaving only family law to Muslims. Arslan reads the policy as an attempt to weaken links between Javanese Muslims and the wider Islamic world. This is his reading of Dutch sources, which others may dispute."
