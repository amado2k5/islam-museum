summary:
  ar: "يعرض شكيب أرسلان مسألة هجرة الحضارمة إلى جزائر الهند الشرقية الهولندية، ويذكر أن الحكومة الهولندية ضايقتهم في الإقامة والتنقل وحدّت من دخولهم، مع أن كثيراً منهم استقر هناك وصار من أهلها. وينقل عن المستشرق سنوك هورغرونيه قوله إن منع الحضارمة لم يكن عدلاً، ولكنه يعرض أيضاً سياسة الإدارة الهولندية في تحجيم النفوذ الديني والقانوني الإسلامي، ومنها عدم سنّ قوانين مأخوذة من الشريعة وإبقاء الأحوال الشخصية وحدها للمسلمين. ويرى أرسلان أن هذه السياسة تقصد إضعاف الروابط بين مسلمي جاوى والعالم الإسلامي. هذا عرض لرأي المؤلف ومصادره، وقد يخالف فيه غيره."
  en: "Arslan describes how the Dutch restricted Hadrami Arab migrants in the Dutch East Indies, limiting their movement and residence although many had settled and become local. He quotes the orientalist Christiaan Snouck Hurgronje, who called the exclusion unjust but favoured limiting Islamic influence, including avoiding Sharia-based legislation and leaving only family law to Muslims. Arslan reads the policy as an attempt to weaken links between Javanese Muslims and the wider Islamic world. This is his reading of Dutch sources, which others may dispute."
  es: "Arslan describe cómo los neerlandeses restringieron la inmigración árabe hadrami en las Indias Orientales Neerlandesas, limitando su movimiento y residencia, a pesar de que muchos se habían asentado y se habían integrado a la comunidad. Cita al orientalista Christiaan Snouck Hurgronje, quien calificó la exclusión de injusta, pero se mostró a favor de limitar la influencia islámica, evitando la legislación basada en la sharia y dejando únicamente el derecho de familia a los musulmanes. Arslan interpreta esta política como un intento de debilitar los vínculos entre los musulmanes javaneses y el resto del mundo islámico. Esta es su interpretación de las fuentes neerlandesas, que otros podrían cuestionar."
  fr: "Arslan décrit comment les Néerlandais ont restreint la liberté de mouvement et le droit de séjour des migrants arabes hadramis dans les Indes orientales néerlandaises, malgré l'intégration de nombreux d'entre eux. Il cite l'orientaliste Christiaan Snouck Hurgronje, qui qualifiait cette exclusion d'injuste, mais préconisait de limiter l'influence islamique, notamment en évitant toute législation fondée sur la charia et en ne réservant aux musulmans que le droit de la famille. Arslan interprète cette politique comme une tentative d'affaiblir les liens entre les musulmans javanais et le monde islamique en général. Cette interprétation des sources néerlandaises peut être contestée."
  ur: "ارسلان بیان کرتا ہے کہ ڈچوں نے ڈچ ایسٹ انڈیز میں ہدرامی عرب تارکین وطن کو کس طرح محدود کیا، ان کی نقل و حرکت اور رہائش کو محدود کیا حالانکہ بہت سے لوگ آباد اور مقامی بن چکے تھے۔ انہوں نے مستشرقین کرسٹیان سنوک ہرگرونجے کا حوالہ دیا، جنہوں نے اخراج کو غیر منصفانہ قرار دیا لیکن اسلامی اثر و رسوخ کو محدود کرنے کے حامی تھے، بشمول شریعت پر مبنی قانون سازی سے گریز اور صرف عائلی قانون کو مسلمانوں کے لیے چھوڑنا۔ ارسلان اس پالیسی کو جاوانی مسلمانوں اور وسیع تر اسلامی دنیا کے درمیان روابط کو کمزور کرنے کی کوشش کے طور پر پڑھتے ہیں۔ یہ ڈچ ذرائع کے بارے میں اس کا پڑھنا ہے، جس پر دوسرے لوگ اختلاف کر سکتے ہیں۔"
  tr: "Shakib Arslan, Hollanda Doğu Hint adalarına Hadramiyye göçü meselesini sunarak, Hollanda hükümetinin onları ikamet ederken ve hareketlerinde taciz ettiğini ve girişlerini kısıtladığını belirtir; oysa birçoğu oraya yerleşmiş ve halkı olmuştur. Oryantalist Snook Hörgerenje'nin Hadramiyye'nin yasaklanmasının adil olmadığını söylediğini aktarır; aynı zamanda Hollanda yönetiminin İslami dini ve hukuki etkileri sınırlama politikasını, Şeriat'tan türetilmiş yasaların çıkarılmaması ve kişisel statüyü yalnızca Müslümanların korunması dahil olmak üzere ele alır. Arslan, bu politikanın Cava Müslümanları ile İslam dünyası arasındaki bağları zayıflatmayı amaçladığını düşünür. Bu, yazarın görüş ve kaynaklarının bir sunumudur ve diğerleri diğerlerinden farklı olabilir."
  id: "Shakib Arslan membahas isu migrasi Hadramiyyah ke pulau-pulau Hindia Belanda, menyebutkan bahwa pemerintah Belanda mengganggu mereka dalam tinggal dan pergerakan serta membatasi masuknya, meskipun banyak dari mereka menetap di sana dan menjadi penduduknya. Ia mengutip orientalis Snook Hörgerenje yang mengatakan bahwa melarang Hadramiyyah bukanlah hal yang adil, tetapi ia juga menyajikan kebijakan pemerintahan Belanda yang membatasi pengaruh agama dan hukum Islam, termasuk tidak memberlakukan undang-undang yang berasal dari Syariah dan menjaga status pribadi hanya untuk Muslim. Arslan percaya kebijakan ini bertujuan untuk melemahkan hubungan antara Muslim Jawa dan dunia Islam. Ini adalah penyajian pendapat dan sumber penulis, dan mungkin ada yang berbeda pendapat dengan yang lain."
