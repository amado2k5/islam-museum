label:
  ar: "جوز الطرفاء"
  en: "Jawz al-tarfa (the book's kazmarik)"
  ur: "جوز الطرفاء ⁦(کزمارک)⁩"
summary:
  ar: "هو الكزمارِك عند الكتاب؛ حرارته قريبة من المعتدل، وجيّد يقطع النزف، ويُتمضمض بالخل لوجع الأسنان، وطبيخه بالماء والخل نافع جداً لصلابة الطحال {cite:canon-ibn-sina-print-v1 p.422} {cite:canon-ibn-sina-print-v1 p.423}."
  en: "The book names it kazmarik. Its heat is near the balanced mean; it is good for stopping bleeding; a vinegar gargle helps toothache, and its decoction in water and vinegar is very good for a hard spleen {cite:canon-ibn-sina-print-v1 p.422} {cite:canon-ibn-sina-print-v1 p.423}."
  ur: "کتاب اسے کزمارک کہتی ہے۔ اس کی حرارت اعتدال کے قریب ہے؛ یہ خون بہنا روکتا ہے، سرکے کی کلی دانت کے درد میں مفید ہے، اور پانی اور سرکے میں پکایا ہوا اس کا جوشاندہ تلی کی سختی میں بہت نافع ہے {cite:canon-ibn-sina-print-v1 p.422} {cite:canon-ibn-sina-print-v1 p.423}۔"
