id: concept/hijra-fiqh
class: concept
kind: legal
label: { ar: "الهجرة", en: "Hijra (migration for the sake of religion)", es: "Hijra (migración por motivos religiosos)", fr: "Hijra (migration pour des raisons religieuses)", ur: "ہجرت ⁦(دین کی خاطر ہجرت)⁩", tr: "Göç", id: "Migrasi" }
summary:
  ar: "الهجرة في الاصطلاح الانتقال من دار الكفر إلى دار الإسلام، وهي قربة إلى الله، وتنقسم عند الفقهاء إلى أنواع أشهرها الهجرة من مكة إلى المدينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16432} وقد وجبت بعد أن أُذن بها ثم فُرضت، ثم اختلف الفقهاء في بقاء وجوبها بعد فتح مكة، فرأى الشافعية والحنابلة أنها مستحبة لمن قدر على إظهار دينه، ورأى الحنفية والخطابي أنها مندوبة، ورأى المالكية أنها فريضة من أرض الظلم والفتنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16445}"
  en: "In the technical sense, hijra is leaving the abode of unbelief for the abode of Islam, an act done for God's sake. The jurists divide it into kinds, the best known being the move from Mecca to Medina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16432} It was first permitted, then made obligatory before the conquest of Mecca. The jurists then differed on whether it stayed obligatory afterwards: the Shafi'is and Hanbalis held it recommended for one who could practise his religion where he was, the Hanafis and al-Khattabi held it recommended in general, and the Malikis held leaving a land of wrong and temptation to be obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16445}"
  es: "En sentido técnico, la hégira es abandonar la morada de la incredulidad para ir a la morada del Islam, un acto realizado por amor a Dios. Los juristas la dividen en tipos, siendo el más conocido el traslado de La Meca a Medina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16432} Inicialmente estaba permitida y luego se hizo obligatoria antes de la conquista de La Meca. Posteriormente, los juristas discreparon sobre si seguía siendo obligatoria: los shafiíes y los hanbalíes la consideraban recomendable para quien podía practicar su religión donde se encontraba, los hanafíes y al-Khattabi la consideraban recomendable en general, y los malikíes consideraban obligatorio abandonar una tierra de pecado y tentación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16434} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16438} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16440} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16445}"
  fr: "Au sens technique, l'hijra consiste à quitter le pays de l'incroyance pour celui de l'islam, un acte accompli pour la cause de Dieu. Les juristes la distinguent en plusieurs cas, le plus connu étant le départ de La Mecque vers Médine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16432} Elle fut d'abord permise, puis rendue obligatoire avant la conquête de La Mecque. Les juristes ont ensuite divergé quant à son caractère obligatoire: les chaféites et les hanbalites la recommandaient à celui qui pouvait pratiquer sa religion sur place; les hanafites et al-Khattabites la recommandaient de manière générale; et les malikites estimaient qu'il était obligatoire de quitter un pays d'erreur et de tentation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16445}"
  ur: "تکنیکی لحاظ سے، ہجرہ اسلام کے گھر کے لیے کفر کا ٹھکانہ چھوڑنا ہے، ایک ایسا عمل جو خدا کے لیے کیا جاتا ہے۔ فقہاء نے اسے اقسام میں تقسیم کیا ہے، جس میں سب سے زیادہ مشہور مکہ سے مدینہ منتقل ہونا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16432} پہلے اس کی اجازت دی گئی، پھر فتح مکہ سے پہلے فرض کر دی گئی۔ اس کے بعد فقہاء کا اس میں اختلاف ہے کہ آیا اس کے بعد واجب ٹھہرا: شافعیہ اور حنبلیوں نے اسے اس شخص کے لیے مستحب قرار دیا جو اپنے مذہب پر عمل کر سکتا ہے جہاں وہ ہے، حنفیہ اور الخطابی اسے عمومی طور پر مستحب سمجھتے ہیں، اور مالکیوں نے غلط اور فتنہ کی سرزمین کو واجب قرار دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16434} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16438} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16440} صفحہ 16445}"
  tr: "Terminolojide, göç, inançsızlık diyarından İslam diyarına taşınmak anlamına gelir; bu da Allah'a yaklaşmanın bir yoludur. Hukukçular arasında ise türlere ayrılır; en ünlüsü Mekke'den Medine'ye göçtür. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.16432} Zorunlu hale geldikten sonra zorunlu hale geldi ve ardından zorunlu hale geldi. Daha sonraki hukukçular, Mekke'nin fethinden sonra yükümlülüğünün devam edip etmediği konusunda farklı görüşlere vardı. Şafiiler ve Hanbaliler, dinlerini gerçekleştirebilenlere tavsiye edilirken, Hanafileri ve el-Hattabiler bunu tavsiye edilen bir şey olarak kabul etti; Malikiler ise baskı ve isyan ülkesinden bir zorunluluk olarak kabul etti. {atı:fiqh-mawsua-kuveytiyya-noor-v3 s.16434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16445}"
  id: "Dalam istilah tertentu, migrasi berarti pindah dari tanah kafir ke tanah Islam, yang merupakan cara untuk mendekatkan diri kepada Allah. Di kalangan ahli hukum, migrasi dibagi menjadi beberapa jenis, yang paling terkenal adalah migrasi dari Mekah ke Madinah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16432} Migrasi menjadi wajib setelah diizinkan dan kemudian menjadi wajib. Para ahli hukum kemudian berbeda pendapat apakah kewajibannya tetap ada setelah penaklukan Mekah. Syafi'i dan Hanbal menganggap ini direkomendasikan bagi mereka yang mampu mewujudkan agamanya, Hanafi dan al-Khattabi menganggapnya sebagai kewajiban dari tanah penindasan dan pemberontakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16445}"
