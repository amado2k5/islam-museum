id: concept/hijra-fiqh
class: concept
kind: legal
label: { ar: "الهجرة", en: "Hijra (migration for the sake of religion)" }
summary:
  ar: "الهجرة في الاصطلاح الانتقال من دار الكفر إلى دار الإسلام، وهي قربة إلى الله، وتنقسم عند الفقهاء إلى أنواع أشهرها الهجرة من مكة إلى المدينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16432} وقد وجبت بعد أن أُذن بها ثم فُرضت، ثم اختلف الفقهاء في بقاء وجوبها بعد فتح مكة، فرأى الشافعية والحنابلة أنها مستحبة لمن قدر على إظهار دينه، ورأى الحنفية والخطابي أنها مندوبة، ورأى المالكية أنها فريضة من أرض الظلم والفتنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16445}"
  en: "In the technical sense, hijra is leaving the abode of unbelief for the abode of Islam, an act done for God's sake. The jurists divide it into kinds, the best known being the move from Mecca to Medina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16432} It was first permitted, then made obligatory before the conquest of Mecca. The jurists then differed on whether it stayed obligatory afterwards: the Shafi'is and Hanbalis held it recommended for one who could practise his religion where he was, the Hanafis and al-Khattabi held it recommended in general, and the Malikis held leaving a land of wrong and temptation to be obligatory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16434} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16438} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16445}"
