id: concept/ram-of-sacrifice
class: concept
kind: natural
label:
  ar: "ذبح إسماعيل"
  en: "The ram of the sacrifice"
  ur: "اسماعیل کا مینڈھا"
  es: "El carnero del sacrificio"
  fr: "Le bélier du sacrifice"
  tr: "İsmail'in Katledilmesi"
  id: "Pembantaian Ismail"
summary:
  ar: "فدى الله إسماعيل بذبح عظيم حين أسلم أبوه للأمر وقال الابن يا أبت افعل ما تؤمر ستجدني إن شاء الله من الصابرين."
  en: "God ransomed Ishmael with a great sacrifice when his father submitted to the command and the son said: 'O my father, do as you are commanded; you will find me, God willing, of the patient.'"
  ur: "اللہ نے اسماعیل کو عظیم قربانی کے بدلے چھڑایا جب ان کے والد نے حکم کے آگے سر جھکایا اور بیٹے نے کہا 'اے والد جو حکم دیا گیا ہے کیجیے، ان شاء اللہ آپ مجھے صابر پائیں گے۔'"
  es: "Dios redimió a Ismael con un gran sacrificio cuando su padre obedeció la orden y el hijo dijo: «Oh, padre mío, haz lo que se te ordena; me encontrarás, si Dios quiere, paciente»."
  fr: "Dieu racheta Ismaël par un grand sacrifice lorsque son père se soumit à l'ordre et que le fils dit: « Ô mon père, fais ce qui t'est commandé; tu me trouveras, si Dieu le veut, parmi les patients. »"
  tr: "Allah İsmail'i büyük bir fedakarlıkla sunsun; babası emre teslim olduğunda ve oğlu, 'Ey baba, emrettiğini yap, inşallah beni sabırlılar arasında bulacaksın.' dedi."
  id: "Semoga Allah mengorbankan Ismael dengan korban besar ketika ayahnya menyerah pada perintah itu dan anaknya berkata, 'Wahai Bapa, lakukan seperti yang Engkau perintahkan, Engkau akan menemukan aku, insya Allah, di antara yang sabar.'"
