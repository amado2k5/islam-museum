label: { ar: "الأحد عشر جزءاً المجهولة والقياس في الزيج الصابي", en: "The unknown eleven twelfths and reasoning by analogy", ur: "نامعلوم گیارہ بارہویں حصے اور قیاس", es: "Los once doceavos desconocidos y el razonamiento por analogía" }
summary:
  ar: "يقول البتاني إن ما لا يُعرف عمرانه وخرابه أحد عشر جزءاً من اثني عشر، وإن الجزء الذي فيه العمران المعروف من موضع خط الاستواء ففيه البحور والمفاوز. وإذا سُئل هل في هذه الأجزاء نبات وحيوان وعمران كان القول فيه من جهة القياس والرأي لا المشاهدة، فإن الشمس والقمر والكواكب تجري عندنا فتكون بحركتها صيف وشتاء ونبات وحيوان، فيمكن أن يكون في الباقي مثل ذلك ويليق أن يكون. {cite:zij-sabi-nallino-byblion p.32}."
  en: "Al-Battani says what is not known to be settled or ruined is eleven parts of twelve, and that the part holding the known settlement from the equator contains seas and deserts. If asked whether these parts hold plants, animals and settlement, the answer is a matter of reasoning and opinion rather than sight: the Sun, Moon and stars run for us and by their motion bring summer, winter, plants and animals, so the same may be there and it is fitting that it should be. {cite:zij-sabi-nallino-byblion p.32}."
  ur: "البتانی کہتے ہیں کہ جس کی آبادی اور ویرانی معلوم نہیں وہ بارہ میں سے گیارہ حصے ہیں، اور جس حصے میں خط استوا سے معلوم آبادی ہے اس میں سمندر اور بیابان ہیں۔ اگر پوچھا جائے کہ ان حصوں میں نباتات، حیوان اور آبادی ہے یا نہیں تو اس کا جواب مشاہدے سے نہیں بلکہ قیاس اور رائے سے ہے، کیونکہ سورج، چاند اور ستارے ہمارے ہاں چلتے ہیں اور اپنی حرکت سے گرمی، سردی، نباتات اور حیوان پیدا کرتے ہیں، اس لیے باقی میں بھی ایسا ہو سکتا ہے اور اس کا ہونا مناسب ہے۔ {cite:zij-sabi-nallino-byblion p.32}۔"
  es: "Al-Battani afirma que once de las doce partes del ecuador, que aún no se conocen asentamientos ni ruinas, contienen mares y desiertos. Si se le pregunta si estas partes albergan plantas, animales y asentamientos, la respuesta es más una cuestión de razonamiento y opinión que de observación: el Sol, la Luna y las estrellas se mueven para nosotros y, con su movimiento, traen el verano, el invierno, las plantas y los animales; por lo tanto, es posible que existan allí, y es lógico que así sea. {cite:zij-sabi-nallino-byblion p.32}."
