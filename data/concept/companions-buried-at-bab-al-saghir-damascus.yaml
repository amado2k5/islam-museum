label:
  ar: من دُفن من الصحابة بمقبرة الباب الصغير بدمشق
  en: Companions buried in the Bab al-Saghir cemetery, Damascus
  ur: دمشق کے قبرستان باب الصغیر میں دفن صحابہ
  es: "Compañeros enterrados en el cementerio de Bab al-Saghir, Damasco."
summary:
  ar: 'تذكر الكتب بالاسم من دُفن من الصحابة في مقبرة الباب الصغير بدمشق: بلال بن رباح، ويختلف في قبره بين الباب الصغير وباب كيسان وداريا {cite:siyar-alam-nubala scan vol. 1 p. 352}، ومعاوية بن أبي سفيان ويختلف بين الباب الصغير ودار الإمارة {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}، وفضالة بن عبيد {cite:siyar-alam-nubala scan vol. 1 p. 3025}، وقبر منسوب بالظن إلى أسماء بنت يزيد {cite:siyar-alam-nubala scan vol. 1 p. 1090}. وتُعرف فيها «قبور الصحابة» {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 3 p. 70}.'
  en: 'The books name Companions buried in the Bab al-Saghir cemetery in Damascus: Bilal ibn Rabah, whose grave is disputed among Bab al-Saghir, Bab Kaysan and Daraya {cite:siyar-alam-nubala scan vol. 1 p. 352}; Mu''awiya ibn Abi Sufyan, disputed between Bab al-Saghir and the governor''s residence {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}; Fadala ibn Ubayd {cite:siyar-alam-nubala scan vol. 1 p. 3025}; and a grave conjecturally assigned to Asma'' bint Yazid {cite:siyar-alam-nubala scan vol. 1 p. 1090}. A place there is known as the ''graves of the Companions'' {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 3 p. 70}.'
  ur: 'کتابیں دمشق کے قبرستان باب الصغیر میں دفن صحابہ کے نام بتاتی ہیں: بلال بن رباح، جن کی قبر میں باب الصغیر، باب کیسان اور داریا کا اختلاف ہے {cite:siyar-alam-nubala scan vol. 1 p. 352}؛ معاویہ بن ابی سفیان، جن کے بارے میں باب الصغیر اور دار الامارہ کا اختلاف ہے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 512}؛ فضالہ بن عبید {cite:siyar-alam-nubala scan vol. 1 p. 3025}؛ اور ایک قبر جو قیاساً اسماء بنت یزید سے منسوب ہے {cite:siyar-alam-nubala scan vol. 1 p. 1090}۔ وہاں ایک مقام «قبورِ صحابہ» کے نام سے معروف ہے {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 3 p. 70}۔'
  es: "Los libros nombran a los Compañeros enterrados en el cementerio de Bab al-Saghir en Damasco: Bilal ibn Rabah, cuya tumba se disputa entre Bab al-Saghir, Bab Kaysan y Daraya {citar:siyar-alam-nubala scan vol. 1 pág. 352}; Mu'awiya ibn Abi Sufyan, disputada entre Bab al-Saghir y la residencia del gobernador {citar:al-bidaya-wal-nihaya scan vol. 4p. 512}; Fadala ibn Ubayd {cita: siyar-alam-nubala scan vol. 1 pág. 3025}; y una tumba asignada conjeturalmente a Asma' bint Yazid {cita:siyar-alam-nubala scan vol. 1 pág. 1090}. Un lugar allí es conocido como las 'tumbas de los Compañeros' {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 3 p. 70}."
