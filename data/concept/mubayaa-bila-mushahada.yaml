summary:
  ar: "أرض الذهب التي حذاء سجلماسة من أرض المغرب ومن هنالك من وراء النهر العظيم، يبايعون من غير مشاهدتهم ولا مخاطبتهم: يتركون المتاع ويغدو الناس إلى أمتعتهم فيجدون أعمدة الذهب قد تركت إلى جنب كل متاع، فإن شاء مالك المتاع اختار الذهب وترك المتاع وإن شاء أخذ متاعه وترك الذهب وإن أحب الزيادة ترك الذهب والمتاع، وهذا مشهور بأرض المغرب يحمل التجار الأمتعة إلى ساحل هذا النهر، وكذلك بأقاصي خراسان مما يلي بلاد الترك أمة تتبايع على مثل هذا الوصف على نهر عظيم أيضاً {cite:muruj-al-dhahab p. 556}."
  en: "The dumb-barter of the gold land opposite Sijilmasa beyond the great river: goods left ashore are found flanked by columns of gold — take the gold and leave the goods, take back your goods, or leave both asking more — a custom famous in the Maghrib and matched, al-Mas'udi notes, by a nation of farthest Khurasan on a great river {cite:muruj-al-dhahab p. 556}."
  es: "El trueque mudo de la tierra del oro frente a Sijilmasa, más allá del gran río: los bienes dejados en la orilla se encuentran flanqueados por columnas de oro; llévate el oro y deja los bienes, recupera tus bienes o deja ambos pidiendo más; una costumbre famosa en el Magreb y que, según señala al-Mas'udi, se repite en una nación del más lejano Jorasán, en un gran río {cita:muruj-al-dhahab p. 556}."
  fr: "Le troc muet du pays de l'or en face de Sijilmassa au-delà du grand fleuve: les biens laissés sur le rivage sont retrouvés flanqués de colonnes d'or — prenez l'or et laissez les biens, reprenez vos biens, ou laissez les deux en demandant plus — une coutume célèbre au Maghreb et égalée, note al-Mas'udi, par une nation du Khorasan le plus éloigné sur un grand fleuve {cite:muruj-al-dhahab p. 556}."
  ur: "عظیم دریا سے آگے سجلماسا کے سامنے سونے کی زمین کا گونگا بارٹر: ساحل پر چھوڑا ہوا سامان سونے کے کالموں سے جڑا ہوا پایا جاتا ہے - سونا لے لو اور سامان چھوڑ دو، اپنا سامان واپس لو، یا دونوں مزید پوچھنا چھوڑ دو - ایک رواج مغرب میں مشہور اور مماثل، المسعودی نوٹ، دور دراز دریا پر ایک قوم کی طرف سے۔ 556}۔"
  tr: "Altın topraklar, Fas topraklarından Sijilmasa'nın ayağı ve oradan büyük nehrin ötesinde, görünmeden ya da hitap edilmeden bağlılık yemini ederler: malları bırakırlar, insanlar eşyalarına döner ve her eşyanın yanında altın sütunlar bulunur. Sahibi isterse, altını seçer ve malları bırakır; isterse mallarını alır ve altını bırakır; daha fazlasını tercih ederse altını ve malları bırakır. Bu, tüccarların malları bu nehrin kıyısına götürdüğü Fas topraklarında ve Türklerin topraklarının ötesindeki Horasan'ın uzak kesimlerinde iyi bilinir; bu ulus büyük bir nehirde benzer şekilde bağlılık yemini eder {cite:muruj-al-dhahab, s. 556}."
  id: "Tanah emas, yang merupakan kaki Sijilmasa dari tanah Maroko dan dari sana melewati sungai besar, mereka bersumpah setia tanpa terlihat atau diajak bicara: mereka meninggalkan barang-barang itu, dan orang-orang kembali ke barang-barang mereka dan menemukan tiang emas yang tersisa di samping setiap barang. Jika pemilik menginginkannya, ia memilih emas dan meninggalkan barang-barang itu; jika ia mau, ia mengambil barangnya dan meninggalkan emas; dan jika ia lebih suka, ia meninggalkan emas dan barang-barang tersebut. Hal ini sudah dikenal luas di tanah Maroko, di mana para pedagang membawa barang ke tepi sungai ini, serta di ujung jauh Khorasan di luar tanah Turki, sebuah bangsa yang bersumpah setia dengan cara serupa di sebuah sungai besar {cite:muruj-al-dhahab, hlm. 556}."
