label: { ar: "المبايعة من غير مشاهدة", en: "The silent trade" }
summary:
  ar: "أرض الذهب التي حذاء سجلماسة من أرض المغرب ومن هنالك من وراء النهر العظيم، يبايعون من غير مشاهدتهم ولا مخاطبتهم: يتركون المتاع ويغدو الناس إلى أمتعتهم فيجدون أعمدة الذهب قد تركت إلى جنب كل متاع، فإن شاء مالك المتاع اختار الذهب وترك المتاع وإن شاء أخذ متاعه وترك الذهب وإن أحب الزيادة ترك الذهب والمتاع، وهذا مشهور بأرض المغرب يحمل التجار الأمتعة إلى ساحل هذا النهر، وكذلك بأقاصي خراسان مما يلي بلاد الترك أمة تتبايع على مثل هذا الوصف على نهر عظيم أيضاً {cite:muruj-al-dhahab p. 556}."
  en: "The dumb-barter of the gold land opposite Sijilmasa beyond the great river: goods left ashore are found flanked by columns of gold — take the gold and leave the goods, take back your goods, or leave both asking more — a custom famous in the Maghrib and matched, al-Mas'udi notes, by a nation of farthest Khurasan on a great river {cite:muruj-al-dhahab p. 556}."
