id: concept/al-istiadha-before-quran
class: concept
kind: doctrine
label: { ar: "الاستعاذة قبل تلاوة القرآن", en: "Seeking refuge before reciting the Quran" }
summary:
  ar: "يقف الشعراوي عند أمر الله بالاستعاذة من الشيطان الرجيم قبل قراءة القرآن في قوله تعالى «فإذا قرأت القرآن فاستعذ بالله من الشيطان الرجيم» {cite:tafsir-sharawi-khawatir-scan p.27}. ويرى أن المؤمن إذا لجأ إلى الله صار أقوى من ضعفه، وأن الاستعاذة تصفّي جهاز الاستقبال لدى القارئ، وأن الشيطان يأتي المؤمن من الباب الذي يراه أضعف فيه، فإن كان متشدداً في الصلاة وسوس له بالمال، وإن كان متشدداً في المال وسوس له بالمرأة، وهكذا {cite:tafsir-sharawi-khawatir-scan p.27} {cite:tafsir-sharawi-khawatir-scan p.28}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi comments on God's command to seek refuge from the accursed Satan before reading the Quran, 'When you recite the Quran, seek refuge in God from the accursed Satan' {cite:tafsir-sharawi-khawatir-scan p.27}. He holds that a believer who turns to God becomes stronger than his weakness, that the refuge clears the reader's receiving faculty, and that Satan approaches a believer through the door where he sees the weakest point: a man strict in prayer is tempted through money, and one strict about money through women, and so on {cite:tafsir-sharawi-khawatir-scan p.27} {cite:tafsir-sharawi-khawatir-scan p.28}. This is his reading and is attributed to him."
