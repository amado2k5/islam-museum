      en: "The refuge prepares the heart to receive the Quran and repels Satan's whispering"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن معوقات تلقي المنهج عند المؤمن من عمل الشيطان، فلا يُدفع إلا بالاستعانة بقدرة الله {cite:tafsir-sharawi-khawatir-scan p.27} {cite:tafsir-sharawi-khawatir-scan p.29}."
      en: "Sha'rawi holds that the obstacles a believer meets in receiving the method come from Satan's work, and can be repelled only by seeking God's power {cite:tafsir-sharawi-khawatir-scan p.27} {cite:tafsir-sharawi-khawatir-scan p.29}."
