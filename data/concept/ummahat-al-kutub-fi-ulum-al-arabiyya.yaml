id: concept/ummahat-al-kutub-fi-ulum-al-arabiyya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-books]
label:
  ar: "أمهات الكتب في علوم العربية"
  en: "The mother books of the Arabic sciences (sixty works)"
  ur: "علوم عربیہ کی بنیادی کتابیں"
  fr: "Les livres fondateurs des sciences de l'arabe (soixante ouvrages)"
  es: "Los libros fundamentales de las ciencias del árabe (sesenta obras)"
  tr: "Arap Bilimlerinde Kitapların Temelleri"
  id: "Dasar-dasar Buku dalam Ilmu Arab"
summary:
  ar: "جدول جامع لستين كتاباً من أكثر الكتب ذكراً في علوم العربية، اثني عشر في كل علم من المعاجم والنحو والصرف والعروض والبلاغة، مع مؤلف كل كتاب وتاريخه وما قاله ملخص بحثي قُدّم إلى المتحف عن وجوده في المكتبة الشاملة، وروابط إلى سجل كل كتاب {cite:wikipedia-ar-al-bayan-wa-al-tabyin}."
  en: "A single table of sixty of the most-cited books in the sciences of Arabic, twelve each for dictionaries, grammar, morphology, prosody and rhetoric, with each book's author, date and what a research summary supplied to the museum says of its presence in the Shamela library, linking to the record of each book {cite:wikipedia-ar-al-bayan-wa-al-tabyin}."
  ur: "عربی کے علوم میں سب سے زیادہ مذکور ساٹھ کتابوں کا ایک جدول، لغات، نحو، صرف، عروض اور بلاغت کی بارہ بارہ، ہر کتاب کے مصنف، تاریخ اور شاملہ میں موجودگی کے بارے میں میوزیم کو دیے گئے تحقیقی خلاصے کے بیان کے ساتھ، اور ہر کتاب کے اندراج کے روابط {cite:wikipedia-ar-al-bayan-wa-al-tabyin}۔"
  fr: "Un tableau unique de soixante des livres les plus cités dans les sciences de l'arabe, douze pour chacune : dictionnaires, grammaire, morphologie, prosodie, rhétorique, avec l'auteur, la date de chaque livre et ce que dit de sa présence dans la bibliothèque Shamela une synthèse de recherche remise au musée, avec des liens vers la fiche de chaque livre {cite:wikipedia-ar-al-bayan-wa-al-tabyin}."
  es: "Una tabla única de sesenta de los libros más citados en las ciencias del árabe, doce para cada una: diccionarios, gramática, morfología, prosodia y retórica, con el autor y la fecha de cada libro y lo que dice de su presencia en la biblioteca Shamela un resumen de investigación entregado al museo, con enlaces al registro de cada libro {cite:wikipedia-ar-al-bayan-wa-al-tabyin}."
  tr: "Arap bilimlerinde en çok atıf alan altmış kitabın kapsamlı bir tablosu, sözlükler, dilbilgisi, morfoloji, prozodi ve retorik alanlarında on iki kitap, her kitabın yazarı, tarihi ve söyledikleri, müzeye sunulan ve Kapsamlı Kütüphane'deki varlığı hakkında yapılan araştırma özeti ve her kitabın kayıtlarına bağlantılar {cite:wikipedia-ar-al-bayan-wa-al-tabyin}."
  id: "Tabel komprehensif berisi enam puluh buku yang paling banyak dikutip dalam ilmu pengetahuan Arab, dua belas di masing-masing ilmu kamus, tata bahasa, morfologi, prosodi, dan retorika, bersama dengan penulis setiap buku, sejarahnya, dan apa yang ia katakan, ringkasan penelitian yang dikirimkan ke museum tentang keberadaannya di Perpustakaan Komprehensif, serta tautan ke catatan setiap buku {cite:wikipedia-ar-al-bayan-wa-al-tabyin}."
