id: concept/zij-sabi-battani-raqqa-autumn-equinox-observation
class: concept
kind: scientific
label: { ar: "رصد البتاني للاعتدال الخريفي بالرقة", en: "Al-Battani's autumn equinox observation at al-Raqqa", ur: "رقہ میں البتانی کی خریفی اعتدال کی رصد", es: "Observación del equinoccio de otoño de Al-Battani en al-Raqqa", fr: "Observation de l'équinoxe d'automne par Al-Battani à al-Raqqa", tr: "El-Battani'nin Rakka'da sonbahar ekinoksunu gözlemlemesi", id: "Pengamatan Al-Battani terhadap ekuinoks musim gugur di Raqqa." }
summary:
  ar: "يقول البتاني إنه رصد بمدينة الرقة، وإن أحد أرصاده الخريفية التي يعتمد عليها ويثق بصحتها بالآلة، وجد فيه الشمس تعبر نقطة الاعتدال الخريفي في سنة ألف ومائة وأربع وتسعين من سني ذي القرنين، في التاسع عشر من أيلول من شهور الروم، وهو الثامن من باخون من شهور القبط، قبل طلوع الشمس بأربع ساعات ونصف وربع ساعة بالتقريب {cite:zij-sabi-nallino-byblion p.67}."
  en: "Al-Battani says he observed in the city of al-Raqqa, and that one of his autumn observations, the one he relies on and trusts for its soundness since it was made with the instrument, found the Sun crossing the autumn equinox point in the year one thousand one hundred and ninety-four of the years of Dhu'l-Qarnayn, on the nineteenth of Aylul in the Roman months, which is the eighth of Bakhun in the Coptic, about four hours and a half and a quarter hour before sunrise {cite:zij-sabi-nallino-byblion p.67}."
  ur: "البتانی کہتے ہیں کہ انہوں نے شہر رقہ میں رصد کی، اور ان کی خریفی رصدوں میں سے ایک، جس پر وہ اعتماد کرتے ہیں اور جس کی صحت پر انہیں آلے کی وجہ سے بھروسا ہے، اس میں انہوں نے سورج کو ذوالقرنین کے سالوں کے ایک ہزار ایک سو چورانویں سال میں رومی مہینوں کے انیس ایلول کو، جو قبطی مہینوں کے آٹھ باخون ہے، طلوعِ آفتاب سے تقریباً ساڑھے چار گھنٹے اور ایک چوتھائی گھنٹے پہلے خریفی اعتدال کے نقطے سے گزرتے پایا {cite:zij-sabi-nallino-byblion p.67}۔"
  es: "Al-Battani dice que observó en la ciudad de al-Raqqa, y que una de sus observaciones de otoño, en la que se basa y confía por su solidez ya que fue realizada con el instrumento, encontró al Sol cruzando el punto del equinoccio de otoño en el año mil ciento noventa y cuatro de los años de Dhu'l-Qarnayn, el diecinueve de Aylul en los meses romanos, que es el octavo de Bakhun en el copto, aproximadamente cuatro horas y media y cuarto de hora antes del amanecer {cite:zij-sabi-nallino-byblion p.67}."
  fr: "Al-Battani dit avoir observé dans la ville d'al-Raqqa, et que l'une de ses observations d'automne, celle sur laquelle il s'appuie et dont il est sûr de la fiabilité puisqu'elle a été réalisée avec l'instrument, a constaté que le Soleil traversait le point de l'équinoxe d'automne en l'an mille cent quatre-vingt-quatorze des années de Dhu'l-Qarnayn, le dix-neuvième jour d'Aylul dans les mois romains, qui est le huitième de Bakhun dans le copte, environ quatre heures et demie et quart avant le lever du soleil {cite:zij-sabi-nallino-byblion p.67}."
  tr: "El-Battani, Rakka şehrinde yaptığı gözlemlerden birinde, bir alet kullanarak doğru olduğuna güvendiği sonbahar gözlemlerinden birinde, güneşin Zilhicce-Karnayn ayının bin yüz doksan dördüncü yılında, Roma takvimine göre 19 Eylül'de, yani Kıpti takvimine göre 8 Paçon'da, güneş doğmadan yaklaşık dört buçuk saat on beş dakika önce sonbahar ekinoksunu geçtiğini tespit ettiğini söylüyor. {cite:zij-sabi-nallino-byblion s.67}"
  id: "Al-Battani mengatakan bahwa ia mengamati di kota Raqqa, dan salah satu pengamatannya di musim gugur, yang ia andalkan dan percayai kebenarannya menggunakan sebuah instrumen, menemukan bahwa matahari melintasi titik ekuinoks musim gugur pada tahun seribu seratus sembilan puluh empat tahun Dzul-Qarnayn, pada tanggal sembilan belas September bulan Romawi, yang merupakan tanggal delapan Pachon bulan Koptik, kira-kira empat setengah jam dan seperempat jam sebelum matahari terbit {cite:zij-sabi-nallino-byblion p.67}."
