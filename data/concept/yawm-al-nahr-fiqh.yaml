label:
  ar: "يَوم النحر"
  en: "Yawm al-nahr (the day of sacrifice, fiqh)"
summary:
  ar: "يوم النحر هو العاشر من ذي الحجة، سمي بذلك لكثرة ما ينحر فيه من الأضاحي والهدي، وأيام النحر ثلاثة عند الحنفية والمالكية والحنابلة والثوري وأربعة عند الشافعية، وأطلق عليه جمع من الفقهاء يوم الحج الأكبر لحديث ابن عمر عند أبي داود، واختلف الفقهاء في أفضليته على يوم عرفة ويوم الجمعة. وفيه يجب رمي جمرة العقبة عند الجمهور، ويحرم صومه عند الجمهور ويكره كراهة تحريم عند الحنفية، ويسن للمضحي الإمساك عن الأكل حتى يفطر على كبد أضحيته، وتشرع فيه صلاة العيد والتكبير والأضحية والتهنئة لغير الحاج، واختلفوا في خطبته بمنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18059}"
  en: "Yawm al-nahr is the tenth of Dhu al-Hijja, so named for the abundance of sacrifices and offerings slaughtered in it; the days of sacrifice are three on the Hanafi, Maliki, Hanbali and Thawri view and four on the Shafi'i. Many jurists call it the day of the greater hajj on Ibn Umar's hadith in Abu Dawud, and they dispute whether it, the day of Arafa, or Friday is the best of days. In it the stoning of the Aqaba pillar is obligatory on the majority view; fasting it is forbidden on the majority view and disliked to the degree of prohibition on the Hanafi; it is sunna for the sacrificer to hold back from food until he breaks his fast on his sacrifice's liver; and for the non-pilgrim the eid prayer, takbir, the udhiya and congratulation are prescribed, while they dispute its sermon at Mina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18059}"
