label:
  ar: "يَوم النحر"
  en: "Yawm al-nahr (the day of sacrifice, fiqh)"
  es: "Yawm al-nahr (el día del sacrificio, fiqh)"
  fr: "Yawm al-nahr (le jour du sacrifice, fiqh)"
summary:
  ar: "يوم النحر هو العاشر من ذي الحجة، سمي بذلك لكثرة ما ينحر فيه من الأضاحي والهدي، وأيام النحر ثلاثة عند الحنفية والمالكية والحنابلة والثوري وأربعة عند الشافعية، وأطلق عليه جمع من الفقهاء يوم الحج الأكبر لحديث ابن عمر عند أبي داود، واختلف الفقهاء في أفضليته على يوم عرفة ويوم الجمعة. وفيه يجب رمي جمرة العقبة عند الجمهور، ويحرم صومه عند الجمهور ويكره كراهة تحريم عند الحنفية، ويسن للمضحي الإمساك عن الأكل حتى يفطر على كبد أضحيته، وتشرع فيه صلاة العيد والتكبير والأضحية والتهنئة لغير الحاج، واختلفوا في خطبته بمنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18059}"
  en: "Yawm al-nahr is the tenth of Dhu al-Hijja, so named for the abundance of sacrifices and offerings slaughtered in it; the days of sacrifice are three on the Hanafi, Maliki, Hanbali and Thawri view and four on the Shafi'i. Many jurists call it the day of the greater hajj on Ibn Umar's hadith in Abu Dawud, and they dispute whether it, the day of Arafa, or Friday is the best of days. In it the stoning of the Aqaba pillar is obligatory on the majority view; fasting it is forbidden on the majority view and disliked to the degree of prohibition on the Hanafi; it is sunna for the sacrificer to hold back from food until he breaks his fast on his sacrifice's liver; and for the non-pilgrim the eid prayer, takbir, the udhiya and congratulation are prescribed, while they dispute its sermon at Mina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18059}"
  es: "Yawm al-nahr es el décimo día de Dhu al-Hijja, llamado así por la abundancia de sacrificios y ofrendas que se realizan en él; los días de sacrificio son tres según las escuelas Hanafi, Maliki, Hanbali y Thawri, y cuatro según la Shafi'i. Muchos juristas lo llaman el día del Hajj mayor, basándose en el hadiz de Ibn Umar en Abu Dawud, y discrepan sobre si este, el día de Arafa o el viernes es el mejor de los días. En él, la lapidación del pilar de Aqaba es obligatoria según la opinión mayoritaria; el ayuno está prohibido según la opinión mayoritaria y es desaconsejado hasta el punto de la prohibición según la escuela Hanafi; es sunna que el sacrificador se abstenga de comer hasta romper el ayuno con el hígado del animal sacrificado; y para el no peregrino se prescriben la oración del Eid, el takbir, la udhiya y la felicitación, mientras que discrepan sobre su sermón en Mina. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.18051} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.18052} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.18056} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.18059}"
  fr: "Yawm al-Nahr est le dixième jour de Dhu al-Hijja, ainsi nommé en raison de l'abondance des sacrifices et offrandes qui y sont accomplis. Les écoles hanafite, malikite, hanbalite et thawrite comptent trois jours de sacrifice, tandis que l'école shafi'ite en compte quatre. De nombreux juristes le considèrent comme le jour du grand pèlerinage (Hajj), se référant au hadith d'Ibn Umar rapporté par Abu Dawud. Ils débattent encore pour savoir si ce jour, le jour d'Arafat ou le vendredi est le meilleur des jours. La lapidation de la stèle d'Aqaba est obligatoire ce jour-là, selon l'avis majoritaire. Le jeûne y est interdit par la majorité des juristes et fortement déconseillé, voire proscrit, par l'école hanafite. Il est sunna pour celui qui accoste de s'abstenir de manger jusqu'à la rupture du jeûne avec le foie de son sacrifice. Pour les non-pèlerins, la prière de l'Aïd, le takbir, l'udhiya et les félicitations sont prescrits, bien que le sermon prononcé à Mina fasse l'objet de controverses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18051} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18052} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18059}"
