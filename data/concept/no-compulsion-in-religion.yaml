    id: sunni-sharawi-no-compulsion-in-belief
    stance: { ar: "لا إكراه على الاعتقاد، ومن دخل الإسلام لزمه أداء أحكامه", en: "No compulsion into belief, but one who enters Islam is bound to its rulings", ur: "عقیدے پر جبر نہیں، مگر جو اسلام میں داخل ہو اس پر اس کے احکام لازم ہیں" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن الإكراه ممتنع في الاعتقاد، وأن من دخل الإسلام صار مطالباً بأحكامه، ويستدل بأن الجزية بقيت لمن بقي على دينه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1112} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1113} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1114}."
      en: "Sha'rawi holds that compulsion has no place in belief, and that one who has entered Islam is bound by its rulings. He takes the jizya as evidence that those who kept their religion remained {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1112} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1113} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1114}."
      ur: "شعراوی کے نزدیک عقیدے میں جبر ممنوع ہے، اور جو اسلام میں داخل ہو وہ اس کے احکام کا پابند ہے۔ وہ جزیہ کو اس کی دلیل مانتے ہیں کہ جو اپنے دین پر رہا وہ باقی رہا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1112} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1113} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1114}۔"
