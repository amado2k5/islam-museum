id: concept/no-compulsion-in-religion
class: concept
kind: belief
label: { ar: "حرية الاعتقاد والإكراه في الدين", en: "Freedom of belief and compulsion in religion", ur: "اعتقاد کی آزادی اور دین میں جبر" }
summary:
  ar: "يرى الشعراوي أن الله لم يكره أحداً على الإيمان، لأن القهر يخضع القوالب ولا يخضع القلوب، وأن المسلم بعد دخوله الإسلام ملزم بأداء مطلوبه، وأن ضعف المسلمين في أول الإسلام مقصود، وأن الجزية تدل على بقاء من بقي على دينه {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1111} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1112} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1113} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1114}."
  en: "Sha'rawi holds that God did not compel anyone into belief, since force governs bodies, not hearts. A person who has entered Islam is bound to observe its duties. He reads the early weakness of Muslims as intended, and the jizya as evidence that those who kept their religion remained {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1111} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1112} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1113} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1114}."
  ur: "شعراوی کے نزدیک اللہ نے کسی کو ایمان پر مجبور نہیں کیا، کیونکہ جبر جسموں پر ہوتا ہے دلوں پر نہیں۔ اسلام میں داخل ہونے والا اس کے فرائض ادا کرنے کا پابند ہے، اور مسلمانوں کی ابتدائی کمزوری مقصود تھی، اور جزیہ اس بات کی دلیل ہے کہ جو اپنے دین پر رہا وہ باقی رہا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1111} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1112} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1113} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1114}۔"
