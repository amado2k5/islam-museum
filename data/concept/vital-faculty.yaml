summary:
  ar: "القوة الحيوانية عند ابن سينا هي التي إذا حصلت في الأعضاء هيأتها لقبول قوة الحس والحركة وأفعال الحياة، وروحها متولد من بخارية الأخلاط ولطافتها، ومعدنها القلب {cite:canon-ibn-sina-print-v1 pp.98-99}."
  en: "The vital faculty in Ibn Sina is that which, once present in the organs, prepares them to receive the power of sensation and movement and the acts of life; its spirit is generated from the vapour and fineness of the humours, and its seat is the heart {cite:canon-ibn-sina-print-v1 pp.98-99}."
