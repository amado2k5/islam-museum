id: concept/vital-faculty
class: concept
kind: scientific
label: { ar: "القوة الحيوانية عند ابن سينا", en: "The vital faculty in the Canon", ur: "قانون میں حیوانی قوت", es: "La facultad vital en el Canon", fr: "La faculté essentielle du canon" }
summary:
  ar: "القوة الحيوانية عند ابن سينا هي التي إذا حصلت في الأعضاء هيأتها لقبول قوة الحس والحركة وأفعال الحياة، وروحها متولد من بخارية الأخلاط ولطافتها، ومعدنها القلب {cite:canon-ibn-sina-print-v1 pp.98-99}."
  en: "The vital faculty in Ibn Sina is that which, once present in the organs, prepares them to receive the power of sensation and movement and the acts of life; its spirit is generated from the vapour and fineness of the humours, and its seat is the heart {cite:canon-ibn-sina-print-v1 pp.98-99}."
  es: "La facultad vital en Ibn Sina es aquella que, una vez presente en los órganos, los prepara para recibir el poder de la sensación y el movimiento y los actos de la vida; su espíritu se genera a partir del vapor y la finura de los humores, y su sede es el corazón {cite:canon-ibn-sina-print-v1 pp.98-99}."
  fr: "La faculté vitale chez Ibn Sina est celle qui, une fois présente dans les organes, les prépare à recevoir la puissance de la sensation et du mouvement et les actes de la vie; son esprit est généré par la vapeur et la finesse des humeurs, et son siège est le cœur {cite:canon-ibn-sina-print-v1 pp.98-99}."
  ur: "ابن سینا میں اہم فیکلٹی وہ ہے جو اعضاء میں ایک بار موجود ہونے کے بعد انہیں حس اور حرکت اور زندگی کے اعمال کی طاقت حاصل کرنے کے لیے تیار کرتی ہے۔ اس کی روح مزاح کے بخارات اور باریکیوں سے پیدا ہوتی ہے، اور اس کی نشست قلب ہے"
