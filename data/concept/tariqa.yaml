summary:
  ar: "الطريقة في اصطلاح المتأخرين الطريق الصوفي المنظم إلى شيخ وسلكُه؛ توسع تريمنغهام في تشعب خطوطها الرئيسة {cite:trimingham-sufi-orders-1998 pp. 31+}، وتنسبها كتب الببليوغرافيا إلى أربابها كالنقشبندية والقادرية والمولوية {cite:kashf-zunun-furqan}."
  en: "The tariqa in later usage is the organized Sufi path attached to a shaykh and his way; Trimingham surveys the ramification of its main lines {cite:trimingham-sufi-orders-1998 pp. 31+}, and bibliographical works like Kashf al-Zunun attribute orders to their eponyms — Naqshbandiyya, Qadiriyya, Mawlawiyya {cite:kashf-zunun-furqan}."
