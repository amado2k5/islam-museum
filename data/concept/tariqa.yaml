label:
  ar: الطريقة ⁦(التصوف)⁩
  en: Tariqa (Sufi order)
  ur: طریقہ
  es: "Tariqa (orden sufí)"
  fr: "Tariqa (ordre soufi)"
  tr: "Sufizm"
  id: "Sufisme"
summary:
  ar: "الطريقة في اصطلاح المتأخرين الطريق الصوفي المنظم إلى شيخ وسلكُه؛ توسع تريمنغهام في تشعب خطوطها الرئيسة {cite:trimingham-sufi-orders-1998 pp. 31+}، وتنسبها كتب الببليوغرافيا إلى أربابها كالنقشبندية والقادرية والمولوية {cite:kashf-zunun-furqan}."
  en: "The tariqa in later usage is the organized Sufi path attached to a shaykh and his way; Trimingham surveys the ramification of its main lines {cite:trimingham-sufi-orders-1998 pp. 31+}, and bibliographical works like Kashf al-Zunun attribute orders to their eponyms — Naqshbandiyya, Qadiriyya, Mawlawiyya {cite:kashf-zunun-furqan}."
  es: "La tariqa en uso posterior es el camino sufí organizado adjunto a un shaykh y su camino; Trimingham examina la ramificación de sus líneas principales {citar:trimingham-sufi-orders-1998 págs. 31+}, y obras bibliográficas como Kashf al-Zunun atribuyen órdenes a sus epónimos: Naqshbandiyya, Qadiriyya, Mawlawiyya {citar:kashf-zunun-furqan}."
  fr: "La tariqa, dans un usage ultérieur, est la voie soufie organisée attachée à un cheikh et à sa voie; Trimingham examine les ramifications de ses lignes principales {cite:trimingham-sufi-orders-1998 pp. 31+}, et des ouvrages bibliographiques tels que Kashf al-Zunun attribuent des ordres à leurs éponymes – Naqshbandiyya, Qadiriyya, Mawlawiyya {cite:kashf-zunun-furqan}."
  ur: "بعد کے استعمال میں طریقہ ایک منظم صوفی راستہ ہے جو شیخ اور اس کے طریقے سے منسلک ہے۔ ٹرمنگھم نے اپنی اہم سطروں کی تشکیل کا سروے کیا ہے {حوالہ:ٹرمنگھم-صوفی-آرڈرز-1998 صفحہ 31+}، اور کتابیات کے کام جیسے کہ کشف الزنون نے اپنے ناموں سے ترتیب کو منسوب کیا ہے — نقشبندیہ، قادریہ، مولوییہ- {حوالہ: تصنیف۔"
  tr: "Daha sonraki âlimlerin terminolojisindeki Tarika, bir şeyh ve onun yoluna göre düzenlenen Sufi yoludur; Trimingham ana yazılarının dallanmasını genişletmiştir {cite:Trimingham-Sufi-orders-1998 s. 31+} ve bibliyografyalar bunu Nakşibendi, Kadiri ve Mevlavi gibi ustalarına atfeder."
  id: "Tariqa dalam terminologi para ulama kemudian adalah jalan Sufi yang diorganisasikan untuk seorang sheikh dan jalannya; Trimingham memperluas percabangan aksara utamanya {cite:Trimingham-Sufi-orders-1998 hlm. 31+}, dan bibliografi mengatributkan Tariqa kepada para gurunya seperti Naqshbandi, Qadiri, dan Mawlawi {cite:kashf-zunun-furqan}."
