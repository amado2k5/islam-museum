id: concept/shurut-qabul-al-salah
class: concept
kind: ethical
label:
  ar: "شروط قبول الصلاة"
  en: "The conditions for the acceptance of prayer (shurut qabul al-salah)"
  ur: "نماز کی قبولیت کی شرطیں"
summary:
  ar: "شروط قبول الصلاة كما يعرضها عبد الحميد كشك من حديث قدسي: أن يتواضع المصلي بصلاته لعظمة الله، وألا يستطيل على خلقه، وألا يبيت مصرًّا على معصية، وأن يقطع نهاره في ذكر الله، وأن يرحم المسكين وابن السبيل والأرملة والمصاب. وهي عنده شروط قبول تتجاوز شروط الصحة المعروفة في الفقه."
  en: "The conditions for the acceptance of prayer as Abdul Hamid Kishk presents them from a hadith qudsi: that the one who prays humbles himself through it before God's greatness, does not lord it over His creation, does not pass the night persisting in sin, spends his day in remembrance of God, and shows mercy to the poor, the wayfarer, the widow and the afflicted. For him they are conditions of acceptance, beyond the conditions of validity set out in fiqh."
  ur: "نماز کی قبولیت کی شرطیں جیسا کہ عبد الحمید کشک ایک حدیث قدسی سے بیان کرتے ہیں: نمازی اپنی نماز کے ذریعے اللہ کی عظمت کے سامنے تواضع کرے، اس کی مخلوق پر دست درازی نہ کرے، گناہ پر اصرار کرتے ہوئے رات نہ گزارے، اپنا دن اللہ کے ذکر میں گزارے، اور مسکین، مسافر، بیوہ اور مصیبت زدہ پر رحم کرے۔ ان کے نزدیک یہ قبولیت کی شرطیں ہیں جو فقہ کی معروف صحت کی شرطوں سے آگے ہیں۔"
