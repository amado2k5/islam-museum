summary:
  ar: "خبث في الكتاب أقوى الخبث تجفيفا خبث الحديد وهو يابس في الثالثة وخبث النحاس قريب منه وسائر الخبث أقل حرارة، وكلها تجفف؛ يحلل خبث الحديد الأورام الحارة وينفع من خشونة الجفن ويقوي المعدة ويمنع نزف البواسير، وخبث الفضة ينفع من الجرب والسعفة ويدمل القروح، وخبث الرصاص نافع من قروح العين بدل المرداسنج؛ وفيه نقل موسوم عن الحبل والحيض في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.716}"
  en: "Khabath is in the book of which the strongest in drying is the khabath of iron, dry in the third degree, that of copper being near it and the rest of the khabath less hot, all of them drying; the khabath of iron dissolves hot swellings, benefits roughness of the eyelid, strengthens the stomach and checks bleeding of haemorrhoids, the khabath of silver benefits mange and ringworm of the scalp and heals ulcers, and the khabath of lead is of benefit for ulcers of the eye in place of litharge; with a labelled listing on conception and menstrual flow in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.716}"
  ur: "خبث کتاب میں خبث کی سب سے قوی خشک کرنے والی قسم خبث الحدید ہے جو تیسرے درجے میں خشک ہے، تانبے کا خبث اس کے قریب ہے اور باقی خبث کم گرم ہیں، اور سب خشک کرتے ہیں؛ خبث الحدید گرم ورموں کو تحلیل کرتا ہے، پپوٹے کی کھردراہٹ میں نافع ہے، معدے کو قوت دیتا ہے اور بواسیر کے خون کو روکتا ہے، چاندی کا خبث خارش اور سعفہ میں نافع ہے اور زخم بھرتا ہے، اور سیسے کا خبث آنکھ کے زخموں میں مرداسنج کی جگہ نافع ہے؛ حمل اور حیض کے بہاؤ کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.716}۔"
