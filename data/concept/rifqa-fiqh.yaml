label:
  ar: "الرفقة"
  en: "Rifqa (the travelling company): its recommendation, the duties of companions, the pilgrimage and the rules for women"
  ur: "رفقہ (سفر کے ساتھی)"
summary:
  ar: "الرفقة في اللغة الصحبة، والرفقة جماعة ترافق الرجل في السفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8822} يستحب للمسافر أن يسافر مع رفقة، ويكره أن يسافر منفردا، وقد نهى النبي عن الانفراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8823} ويستحب أن تكون الرفقة من أهل الصلاح، وأن يؤمروا عليهم أفضلهم رأيا، ويستحب ألا يشتركوا في الزاد والنفقة إلا بقدر ما يحسن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8823} ويشترط في وجوب الحج وجود رفقة إذا كان الطريق مخوفا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8824} ولا تسافر المرأة إلا مع زوج أو ذي محرم عند الجمهور، وأجاز المالكية سفرها للواجب مع رفقة مأمونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8825} وعلى الرفقة في السفر دفن من مات منهم وتجهيزه، ويجب على المسافر أن يسأل رفقته عن الماء للوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8825}"
  en: "Rifqa in the lexicon is companionship; a rifqa is the company that travels with a man. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8822} It is recommended to travel with a company and disliked to travel alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8823} The company should be of righteous people and should appoint the best of them as leader; sharing one's food and money is advised only as far as it suits all. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8823} The duty of pilgrimage requires a company where the road is dangerous. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8823} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8824} For women the majority require a husband or a mahram to travel with them, while the Malikis allow a trusted company for a duty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8824} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8825} The company must bury and prepare any dead companion, and a traveller must ask his companions for water for ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8825}"
  ur: "رفقہ سفر کے ساتھی ہیں؛ اکیلے سفر سے بچنا مستحب ہے، اور عورت کو محرم یا شوہر کے بغیر سفر نہ کرنا چاہیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8822} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8824}"
