label: { ar: "ما يوجبه الوجع عند ابن سينا", en: "What pain brings about in the Canon", ur: "درد جو کچھ پیدا کرتا ہے، قانون کے مطابق" }
summary:
  ar: "في الفصل الثاني والعشرين يقول ابن سينا إن الوجع يحل القوة ويمنع الأعضاء عن خواص أفعالها، وقد يسخن العضو أولاً ثم يبرده بما يحلل وبما يهزم من الروح والحياة {cite:canon-ibn-sina-print-v1 p.151}."
  en: "In chapter 22 Ibn Sina says pain loosens the power and keeps organs from their proper acts, and may first heat an organ and finally cool it, through what it dissolves and what it defeats of spirit and life {cite:canon-ibn-sina-print-v1 p.151}."
