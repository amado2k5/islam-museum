label:
  ar: الظلم
  en: Injustice (zulm)
summary:
  ar: "الظلم عند كثير من العلماء وضع الأشياء في غير موضعها، وفسّره آخرون بالتصرف في ملك الغير بغير إذنه — ونقل نحوه عن إياس بن معاوية — فيكون على هذا مستحيلاً على الله إذ كل ما يفعله تصرف في ملكه، وبنحو ذلك أجاب أبو الأسود الدؤلي عمران بن حصين حين سأله عن القدر؛ وفي شرح ابن رجب لقوله في الحديث القدسي «إني حرمت الظلم على نفسي» {cite:sahih-muslim 2577} أن معناه منعه عن عباده، وعلى تعريف الوضع في غير الموضع يدل على أن الله قادر على الظلم لكنه لا يفعله فضلاً وجوداً وكرماً وإحساناً، وأن خلقه أفعال العباد وفيها الظلم لا يقتضي وصفه بالظلم إذ لا يوصف إلا بأفعاله؛ وأخرج موقوفاً عن أبي بن كعب ونحوه عن ابن مسعود وزيد بن ثابت «لو أن الله عذب أهل سماواته وأهل أرضه لعذبهم وهو غير ظالم لهم» وفي إسناده نظر عنده؛ والظلم المحرم بين العباد نوعان: ظلم النفس وأعظمه الشرك لقوله تعالى «إن الشرك لظلم عظيم» [لقمان 13] ثم المعاصي كبائرها وصغائرها، وظلم العبد لغيره وهو المذكور في قوله «وجعلته بينكم محرماً فلا تظالموا»، وشهد له خطبة حجة الوداع بتحريم الدماء والأموال والأعراض وحديث ابن عمر «الظلم ظلمات يوم القيامة» وحديث أبي موسى «إن الله ليملي للظالم حتى إذا أخذه لم يفلته». وجعله ابن خلدون مؤذناً بخراب العمران لأن العدوان على الأموال يذهب بآمال الكسب فتنقبض الأيدي عن السعي وتكسد الأسواق، وهو أعم من أخذ المال فكل إيثاق بعمل أو مطالبة بغير حق ظلم، وعلة تحريمه أنه مؤذن بانقطاع النوع وهو الحكمة المرعية في مقاصد الشريعة الضرورية الخمسة {cite:muqaddima-ibn-khaldun p. 276-278}"
  en: "Injustice (zulm) for many scholars is placing things outside their place; others defined it as disposing of another's property without permission — a sense transmitted from Iyas ibn Mu'awiya — which makes it impossible for God since all He does is disposal within His own dominion, in the manner of Abu al-Aswad al-Du'ali's answer to Imran ibn al-Husayn on the divine decree; commenting on 'I have forbidden injustice to Myself' in the sacred hadith, Ibn Rajab explains it as His restraining injustice from His servants, noting that on the first definition the hadith shows God is able to commit injustice but does not, out of grace, bounty, generosity and beneficence, and that His creating His servants' deeds — injustice among them — does not attribute injustice to Him, since He is described only by His own acts; he transmits a report halted at Ubayy ibn Ka'b and similarly from Ibn Masud and Zayd ibn Thabit — 'were God to punish the people of His heavens and His earth He would do so without injustice to them' — while flagging its chain; the injustice forbidden between servants is of two kinds: injustice to one's own soul, whose greatest form is association — 'association is indeed a tremendous injustice' (Luqman 13) — then sins great and small, and injustice to others, the subject of 'I have made it forbidden among you', witnessed by the Farewell Pilgrimage sermon declaring blood, property and honour sacred, by Ibn Umar's 'injustice will be darknesses on the Day of Resurrection' and by Abu Musa's 'God grants respite to the wrongdoer until, when He seizes him, He does not let him escape'."
