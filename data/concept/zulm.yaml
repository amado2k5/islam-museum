label:
  ar: الظلم
  en: Injustice (zulm)
  es: "Injusticia (zulm)"
  fr: "Injustice (zulm)"
  ur: "ظلم ⁦(زلم)⁩"
  tr: "Adaletsizlik"
  id: "Ketidakadilan"
summary:
  ar: "الظلم عند كثير من العلماء وضع الأشياء في غير موضعها، وفسّره آخرون بالتصرف في ملك الغير بغير إذنه — ونقل نحوه عن إياس بن معاوية — فيكون على هذا مستحيلاً على الله إذ كل ما يفعله تصرف في ملكه، وبنحو ذلك أجاب أبو الأسود الدؤلي عمران بن حصين حين سأله عن القدر؛ وفي شرح ابن رجب لقوله في الحديث القدسي «إني حرمت الظلم على نفسي» {cite:sahih-muslim 2577} أن معناه منعه عن عباده، وعلى تعريف الوضع في غير الموضع يدل على أن الله قادر على الظلم لكنه لا يفعله فضلاً وجوداً وكرماً وإحساناً، وأن خلقه أفعال العباد وفيها الظلم لا يقتضي وصفه بالظلم إذ لا يوصف إلا بأفعاله؛ وأخرج موقوفاً عن أبي بن كعب ونحوه عن ابن مسعود وزيد بن ثابت «لو أن الله عذب أهل سماواته وأهل أرضه لعذبهم وهو غير ظالم لهم» وفي إسناده نظر عنده؛ والظلم المحرم بين العباد نوعان: ظلم النفس وأعظمه الشرك لقوله تعالى «إن الشرك لظلم عظيم» [لقمان 13] ثم المعاصي كبائرها وصغائرها، وظلم العبد لغيره وهو المذكور في قوله «وجعلته بينكم محرماً فلا تظالموا»، وشهد له خطبة حجة الوداع بتحريم الدماء والأموال والأعراض وحديث ابن عمر «الظلم ظلمات يوم القيامة» وحديث أبي موسى «إن الله ليملي للظالم حتى إذا أخذه لم يفلته». وجعله ابن خلدون مؤذناً بخراب العمران لأن العدوان على الأموال يذهب بآمال الكسب فتنقبض الأيدي عن السعي وتكسد الأسواق، وهو أعم من أخذ المال فكل إيثاق بعمل أو مطالبة بغير حق ظلم، وعلة تحريمه أنه مؤذن بانقطاع النوع وهو الحكمة المرعية في مقاصد الشريعة الضرورية الخمسة {cite:muqaddima-ibn-khaldun p. 276-278}"
  en: "Injustice (zulm) for many scholars is placing things outside their place; others defined it as disposing of another's property without permission — a sense transmitted from Iyas ibn Mu'awiya — which makes it impossible for God since all He does is disposal within His own dominion, in the manner of Abu al-Aswad al-Du'ali's answer to Imran ibn al-Husayn on the divine decree; commenting on 'I have forbidden injustice to Myself' in the sacred hadith, Ibn Rajab explains it as His restraining injustice from His servants, noting that on the first definition the hadith shows God is able to commit injustice but does not, out of grace, bounty, generosity and beneficence, and that His creating His servants' deeds — injustice among them — does not attribute injustice to Him, since He is described only by His own acts; he transmits a report halted at Ubayy ibn Ka'b and similarly from Ibn Masud and Zayd ibn Thabit — 'were God to punish the people of His heavens and His earth He would do so without injustice to them' — while flagging its chain; the injustice forbidden between servants is of two kinds: injustice to one's own soul, whose greatest form is association — 'association is indeed a tremendous injustice' (Luqman 13) — then sins great and small, and injustice to others, the subject of 'I have made it forbidden among you', witnessed by the Farewell Pilgrimage sermon declaring blood, property and honour sacred, by Ibn Umar's 'injustice will be darknesses on the Day of Resurrection' and by Abu Musa's 'God grants respite to the wrongdoer until, when He seizes him, He does not let him escape'."
  es: "La injusticia (zulm) para muchos eruditos es poner las cosas fuera de su lugar; otros la definieron como disponer de la propiedad de otro sin permiso —un sentido transmitido por Iyas ibn Mu'awiya— lo cual hace imposible para Dios ya que todo lo que Él hace es disponer dentro de Su propio dominio, a la manera de la respuesta de Abu al-Aswad al-Du'ali a Imran ibn al-Husayn sobre el decreto divino; comentando sobre 'He prohibido la injusticia contra Mí mismo' en el hadiz sagrado, Ibn Rajab lo explica como Su restricción de la injusticia a Sus siervos, señalando que en la primera definición el hadiz muestra que Dios es capaz de cometer injusticia pero no lo hace, por gracia, bondad, generosidad y beneficencia, y que Su creación de las acciones de Sus siervos —injusticia entre ellos— no le atribuye injusticia a Él, ya que Él es descrito solo por Sus propios actos; Transmite un informe detenido en Ubayy ibn Ka'b y de manera similar de Ibn Masud y Zayd ibn Thabit — 'si Dios castigara a la gente de Sus cielos y Su tierra, lo haría sin injusticia para ellos' — mientras señala su cadena; la injusticia prohibida entre siervos es de dos tipos: la injusticia a la propia alma, cuya forma más grande es la asociación — 'la asociación es en verdad una tremenda injusticia' (Luqman 13) — luego los pecados grandes y pequeños, y la injusticia a los demás, el tema de 'Lo he prohibido entre vosotros', atestiguado por el sermón de la Peregrinación de Despedida que declara sagrados la sangre, la propiedad y el honor, por el 'la injusticia será oscuridad en el Día de la Resurrección' de Ibn Umar y por el 'Dios concede un respiro al malhechor hasta que, cuando lo agarra, no lo deja escapar' de Abu Musa."
  fr: "Pour de nombreux savants, l'injustice (zulm) consiste à placer les choses hors de leur place; d'autres la définissent comme le fait de disposer du bien d'autrui sans permission — une interprétation transmise par Iyas ibn Mu'awiya — ce qui la rend impossible pour Dieu, car Il ne fait que disposer au sein de Son propre domaine, à l'instar de la réponse d'Abu al-Aswad al-Du'ali à Imran ibn al-Husayn sur le décret divin; commentant le hadith sacré « Je me suis interdit l'injustice », Ibn Rajab l'explique comme Sa retenue de l'injustice envers Ses serviteurs, notant que, selon la première définition, le hadith montre que Dieu est capable de commettre l'injustice mais ne le fait pas, par grâce, générosité et bienveillance, et que le fait qu'Il crée les actes de Ses serviteurs — l'injustice parmi eux — ne Lui attribue pas l'injustice, puisqu'Il est décrit uniquement par Ses propres actes; Il transmet un rapport interrompu à Ubayy ibn Ka'b, et de même d'Ibn Masud et Zayd ibn Thabit: « Si Dieu devait punir les habitants de Ses cieux et de Sa terre, Il le ferait sans injustice envers eux », tout en signalant sa chaîne de transmission. L'injustice interdite entre serviteurs est de deux sortes: l'injustice envers sa propre âme, dont la forme la plus grave est l'association – « l'association est en vérité une terrible injustice » (Luqman 13) – puis les péchés, grands et petits, et l'injustice envers autrui, sujet du « Je l'ai rendue interdite parmi vous », comme en témoignent le sermon du Pèlerinage d'Adieu déclarant le sang, les biens et l'honneur sacrés, l'affirmation d'Ibn Umar selon laquelle « l'injustice sera ténèbres au Jour de la Résurrection » et celle d'Abu Musa selon laquelle « Dieu accorde un répit au malfaiteur jusqu'à ce que, lorsqu'Il le saisit, Il ne le laisse pas s'échapper »."
  ur: "بہت سے علماء کے لیے ناانصافی چیزوں کو اپنی جگہ سے باہر رکھنا ہے۔ دوسروں نے اس کی تعریف بغیر اجازت کے کسی دوسرے کی جائیداد میں تصرف کرنے کے طور پر کی ہے - ایاس بن معاویہ سے منتقل ہونے والا ایک احساس - جو خدا کے لئے ناممکن بنا دیتا ہے کیونکہ وہ جو کچھ بھی کرتا ہے وہ اس کے اپنے اقتدار کے اندر تصرف کرتا ہے، جیسا کہ ابو الاسود الدولی کے جواب میں عمران ابن الحسین کو خدائی حکم پر۔ حدیث مقدس میں 'میں نے اپنے اوپر ظلم کو حرام کیا ہے' پر تبصرہ کرتے ہوئے ابن رجب نے اسے اپنے بندوں سے ظلم کو روکنے کے طور پر بیان کیا ہے، اور یہ بتاتے ہوئے کہ پہلی تعریف میں حدیث سے معلوم ہوتا ہے کہ خدا ظلم کرنے پر قادر ہے لیکن فضل، فضل، سخاوت اور احسان کی بناء پر - اپنے بندوں کو پیدا کرنے میں، اور یہ کہ ان کے درمیان انصاف نہیں کرتا۔ ناانصافی کو اس کی طرف منسوب کرنا، کیونکہ وہ صرف اس کے اپنے اعمال سے بیان ہوا ہے۔ وہ ابی بن کعب اور اسی طرح ابن مسعود اور زید بن ثابت کی طرف سے رکی ہوئی ایک رپورٹ کو منتقل کرتا ہے - 'اگر خدا اپنے آسمانوں اور زمین کے لوگوں کو سزا دینے والا ہوتا تو وہ ان کے ساتھ ناانصافی کیے بغیر ایسا کرتا' - اس کے سلسلہ کو جھنڈا لگاتے ہوئے؛ بندوں کے درمیان ناانصافی دو قسم کی ہے: اپنی جان پر ظلم جس کی سب سے بڑی شکل وابستگی ہے - 'مجمبت درحقیقت بہت بڑا ظلم ہے' ⁦(لقمان 13)⁩ - پھر چھوٹے بڑے گناہ اور دوسروں کے ساتھ ناانصافی، موضوع 'میں نے تمہارے درمیان اسے حرام کر دیا' کا مضمون فضیلت سے منع کیا گیا۔ خطبہ خون، مال اور عزت کو مقدس قرار دیتے ہوئے، ابن عمر کے ذریعہ ''ظلم قیامت کے دن اندھیرے ہوں گے'' اور ابو موسیٰ کے ذریعہ ''خدا ظالم کو اس وقت تک مہلت دیتا ہے جب تک کہ وہ اسے پکڑ لے تو اسے بھاگنے نہیں دیتا''۔"
  tr: "Birçok âlime göre adaletsizlik, şeyleri yanlış yere koymaktır. Diğerleri ise bunu, başkasının malına izinsiz el koymak olarak yorumlamışlardır – İyas ibn Muaviye'den de benzer bir rivayet gelmiştir – bu nedenle, Allah'ın her yaptığı kendi malına el koymak olduğu için, O'nun için bu imkansızdır. Ebu el-Esved el-Du'ali, İmran ibn Hüseyin'in kader hakkında sorduğu soruya benzer şekilde cevap vermiştir. İbn Receb, hadis-i kudsi'deki \"Ben kendim için adaletsizliği yasakladım\" ifadesinin açıklamasında (sahih-müslim 2577), bunun anlamının, bunu kullarından uzak tutmak olduğunu söylemiştir. Ve şeyleri yanlış yere koyma tanımına göre, bu, Allah'ın adaletsizliğe kadir olduğunu, ancak bunu lütuf, cömertlik ve iyilikten dolayı yapmadığını gösterir. Ve Allah'ın kullarının eylemlerini yaratmasının, içinde adaletsizlik bulunan durumlarda bile, O'nu adaletsiz olarak nitelendirmeyi gerektirmediğini, çünkü O'nun ancak eylemleriyle nitelendirildiğini belirtmiştir. Ubeyy ibn Ka'b'a atfedilen ve İbn Mes'ud ile Zeyd ibn Sabit'ten de benzer bir hadis rivayet etmiştir: \"Allah göklerin ve yerin sakinlerini cezalandıracak olsaydı, onlara adaletsiz davranmadan cezalandırırdı.\" Bu hadisin isnadını şüpheli bulmuştur. İnsanlar arasında iki tür haram haksızlık vardır: Birincisi, kişinin kendisine karşı işlediği haksızlıktır ki bunun en büyüğü Allah'a ortak koşmaktır (şirk), Yüce Allah şöyle buyurmuştur: \"Şüphesiz Allah'a ortak koşmak büyük bir haksızlıktır\" [Lokman 13], ardından büyük ve küçük günahlar gelir. İkincisi ise bir kişinin diğerine karşı işlediği haksızlıktır ki bu da şu ayette belirtilmiştir: \"Ve bunu aranızda haram kıldım, birbirinize zulmetmeyin.\" Bu, kan dökülmesini, mal alınmasını ve şerefe hakaret edilmesini yasaklayan Veda Hutbesi ile İbn Ömer'in \"Haksızlık, Kıyamet Günü'nde karanlık olacaktır\" hadisi ve Ebu Musa'nın \"Allah zalime mühlet verir, ta ki onu yakalayana kadar, onu bırakmaz\" hadisi ile de desteklenmektedir. İbn Haldun, haksızlığı medeniyetin yıkımının habercisi olarak görmüştür; çünkü servete yönelik saldırganlık, geçim sağlama umutlarını yok eder, insanların çalışmaktan kaçınmasına ve piyasaların durgunlaşmasına neden olur. Bu, sadece para almakla sınırlı değildir; haksız yere yapılan her türlü zorlama veya hak olmadan bir şey talep etmek haksızlıktır. Yasaklanmasının sebebi, türün yok oluşunun habercisi olmasıdır ki bu da İslam hukukunun beş temel amacının ardındaki hikmettir. {cite:muqaddima-ibn-khaldun s. 276-278}"
  id: "Ketidakadilan, menurut banyak ulama, adalah menempatkan sesuatu di tempat yang salah. Yang lain menafsirkannya sebagai bertindak atas harta orang lain tanpa izin mereka—sesuatu yang serupa dilaporkan dari Iyas ibn Muawiyah—jadi menurut ini, hal itu tidak mungkin bagi Allah, karena segala sesuatu yang Dia lakukan adalah bertindak atas harta-Nya. Abu al-Aswad al-Du’ali menjawab Imran ibn Husayn dengan cara yang serupa ketika ia bertanya kepadanya tentang takdir. Dalam penjelasan Ibn Rajab tentang pernyataannya dalam hadits qudsi, “Aku telah melarang ketidakadilan bagi Diri-Ku” {kutip: sahih-muslim 2577}, beliau mengatakan bahwa artinya adalah mencegahnya dari hamba-hamba-Nya. Dan menurut definisi menempatkan sesuatu di tempat yang salah, itu menunjukkan bahwa Allah mampu berbuat tidak adil, tetapi Dia tidak melakukannya karena rahmat, kemurahan hati, dan kebaikan. Dan bahwa penciptaan tindakan hamba-hamba-Nya, di mana terdapat ketidakadilan, tidak mengharuskan untuk menggambarkan-Nya sebagai tidak adil, karena Dia hanya digambarkan melalui tindakan-Nya. Ia meriwayatkan sebuah pernyataan yang dinisbahkan kepada Ubayy ibn Ka’b dan sesuatu yang serupa dari Ibn Mas’ud dan Zayd ibn Thabit: “Jika Allah hendak menghukum penghuni langit dan penghuni bumi-Nya, Dia akan menghukum mereka tanpa berbuat zalim kepada mereka.” Ia menganggap sanadnya diragukan. Ada dua jenis kezaliman yang dilarang di antara manusia: kezaliman terhadap diri sendiri, yang terbesar adalah menyekutukan Allah (syirik), sebagaimana firman Allah SWT, “Sesungguhnya menyekutukan Allah adalah kezaliman yang besar” [Luqman 13], diikuti oleh dosa-dosa, baik besar maupun kecil. Jenis kedua adalah kezaliman seseorang terhadap orang lain, yang disebutkan dalam ayat, “Dan Aku telah mengharamkan hal itu di antara kamu, maka janganlah kamu berbuat zalim kepada sesamamu.” Hal ini semakin diperkuat oleh Khutbah Perpisahan, yang melarang penumpahan darah, pengambilan harta benda, dan pelanggaran kehormatan, serta hadits Ibnu Umar, “Ketidakadilan akan menjadi kegelapan pada Hari Kiamat,” dan hadits Abu Musa, “Allah memberi kesempatan kepada orang yang zalim hingga ketika Dia menangkapnya, Dia tidak akan melepaskannya.” Ibnu Khaldun menganggap ketidakadilan sebagai pertanda kehancuran peradaban karena agresi terhadap harta benda menghancurkan harapan untuk mencari nafkah, menyebabkan orang-orang berhenti bekerja dan pasar menjadi stagnan. Hal ini lebih luas daripada sekadar mengambil uang; setiap paksaan atau tuntutan yang tidak adil terhadap sesuatu tanpa hak adalah ketidakadilan. Alasan pelarangannya adalah karena hal itu menandakan kepunahan spesies, yang merupakan hikmah di balik lima tujuan utama hukum Islam. {cite:muqaddima-ibn-khaldun p. 276-278}"
