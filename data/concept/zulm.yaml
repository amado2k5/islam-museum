label:
  ar: الظلم
  en: Injustice (zulm)
  es: "Injusticia (zulm)"
  fr: "Injustice (zulm)"
summary:
  ar: "الظلم عند كثير من العلماء وضع الأشياء في غير موضعها، وفسّره آخرون بالتصرف في ملك الغير بغير إذنه — ونقل نحوه عن إياس بن معاوية — فيكون على هذا مستحيلاً على الله إذ كل ما يفعله تصرف في ملكه، وبنحو ذلك أجاب أبو الأسود الدؤلي عمران بن حصين حين سأله عن القدر؛ وفي شرح ابن رجب لقوله في الحديث القدسي «إني حرمت الظلم على نفسي» {cite:sahih-muslim 2577} أن معناه منعه عن عباده، وعلى تعريف الوضع في غير الموضع يدل على أن الله قادر على الظلم لكنه لا يفعله فضلاً وجوداً وكرماً وإحساناً، وأن خلقه أفعال العباد وفيها الظلم لا يقتضي وصفه بالظلم إذ لا يوصف إلا بأفعاله؛ وأخرج موقوفاً عن أبي بن كعب ونحوه عن ابن مسعود وزيد بن ثابت «لو أن الله عذب أهل سماواته وأهل أرضه لعذبهم وهو غير ظالم لهم» وفي إسناده نظر عنده؛ والظلم المحرم بين العباد نوعان: ظلم النفس وأعظمه الشرك لقوله تعالى «إن الشرك لظلم عظيم» [لقمان 13] ثم المعاصي كبائرها وصغائرها، وظلم العبد لغيره وهو المذكور في قوله «وجعلته بينكم محرماً فلا تظالموا»، وشهد له خطبة حجة الوداع بتحريم الدماء والأموال والأعراض وحديث ابن عمر «الظلم ظلمات يوم القيامة» وحديث أبي موسى «إن الله ليملي للظالم حتى إذا أخذه لم يفلته». وجعله ابن خلدون مؤذناً بخراب العمران لأن العدوان على الأموال يذهب بآمال الكسب فتنقبض الأيدي عن السعي وتكسد الأسواق، وهو أعم من أخذ المال فكل إيثاق بعمل أو مطالبة بغير حق ظلم، وعلة تحريمه أنه مؤذن بانقطاع النوع وهو الحكمة المرعية في مقاصد الشريعة الضرورية الخمسة {cite:muqaddima-ibn-khaldun p. 276-278}"
  en: "Injustice (zulm) for many scholars is placing things outside their place; others defined it as disposing of another's property without permission — a sense transmitted from Iyas ibn Mu'awiya — which makes it impossible for God since all He does is disposal within His own dominion, in the manner of Abu al-Aswad al-Du'ali's answer to Imran ibn al-Husayn on the divine decree; commenting on 'I have forbidden injustice to Myself' in the sacred hadith, Ibn Rajab explains it as His restraining injustice from His servants, noting that on the first definition the hadith shows God is able to commit injustice but does not, out of grace, bounty, generosity and beneficence, and that His creating His servants' deeds — injustice among them — does not attribute injustice to Him, since He is described only by His own acts; he transmits a report halted at Ubayy ibn Ka'b and similarly from Ibn Masud and Zayd ibn Thabit — 'were God to punish the people of His heavens and His earth He would do so without injustice to them' — while flagging its chain; the injustice forbidden between servants is of two kinds: injustice to one's own soul, whose greatest form is association — 'association is indeed a tremendous injustice' (Luqman 13) — then sins great and small, and injustice to others, the subject of 'I have made it forbidden among you', witnessed by the Farewell Pilgrimage sermon declaring blood, property and honour sacred, by Ibn Umar's 'injustice will be darknesses on the Day of Resurrection' and by Abu Musa's 'God grants respite to the wrongdoer until, when He seizes him, He does not let him escape'."
  es: "La injusticia (zulm) para muchos eruditos es poner las cosas fuera de su lugar; otros la definieron como disponer de la propiedad de otro sin permiso —un sentido transmitido por Iyas ibn Mu'awiya— lo cual hace imposible para Dios ya que todo lo que Él hace es disponer dentro de Su propio dominio, a la manera de la respuesta de Abu al-Aswad al-Du'ali a Imran ibn al-Husayn sobre el decreto divino; comentando sobre 'He prohibido la injusticia contra Mí mismo' en el hadiz sagrado, Ibn Rajab lo explica como Su restricción de la injusticia a Sus siervos, señalando que en la primera definición el hadiz muestra que Dios es capaz de cometer injusticia pero no lo hace, por gracia, bondad, generosidad y beneficencia, y que Su creación de las acciones de Sus siervos —injusticia entre ellos— no le atribuye injusticia a Él, ya que Él es descrito solo por Sus propios actos; Transmite un informe detenido en Ubayy ibn Ka'b y de manera similar de Ibn Masud y Zayd ibn Thabit — 'si Dios castigara a la gente de Sus cielos y Su tierra, lo haría sin injusticia para ellos' — mientras señala su cadena; la injusticia prohibida entre siervos es de dos tipos: la injusticia a la propia alma, cuya forma más grande es la asociación — 'la asociación es en verdad una tremenda injusticia' (Luqman 13) — luego los pecados grandes y pequeños, y la injusticia a los demás, el tema de 'Lo he prohibido entre vosotros', atestiguado por el sermón de la Peregrinación de Despedida que declara sagrados la sangre, la propiedad y el honor, por el 'la injusticia será oscuridad en el Día de la Resurrección' de Ibn Umar y por el 'Dios concede un respiro al malhechor hasta que, cuando lo agarra, no lo deja escapar' de Abu Musa."
  fr: "Pour de nombreux savants, l'injustice (zulm) consiste à placer les choses hors de leur place; d'autres la définissent comme le fait de disposer du bien d'autrui sans permission — une interprétation transmise par Iyas ibn Mu'awiya — ce qui la rend impossible pour Dieu, car Il ne fait que disposer au sein de Son propre domaine, à l'instar de la réponse d'Abu al-Aswad al-Du'ali à Imran ibn al-Husayn sur le décret divin; commentant le hadith sacré « Je me suis interdit l'injustice », Ibn Rajab l'explique comme Sa retenue de l'injustice envers Ses serviteurs, notant que, selon la première définition, le hadith montre que Dieu est capable de commettre l'injustice mais ne le fait pas, par grâce, générosité et bienveillance, et que le fait qu'Il crée les actes de Ses serviteurs — l'injustice parmi eux — ne Lui attribue pas l'injustice, puisqu'Il est décrit uniquement par Ses propres actes; Il transmet un rapport interrompu à Ubayy ibn Ka'b, et de même d'Ibn Masud et Zayd ibn Thabit: « Si Dieu devait punir les habitants de Ses cieux et de Sa terre, Il le ferait sans injustice envers eux », tout en signalant sa chaîne de transmission. L'injustice interdite entre serviteurs est de deux sortes: l'injustice envers sa propre âme, dont la forme la plus grave est l'association – « l'association est en vérité une terrible injustice » (Luqman 13) – puis les péchés, grands et petits, et l'injustice envers autrui, sujet du « Je l'ai rendue interdite parmi vous », comme en témoignent le sermon du Pèlerinage d'Adieu déclarant le sang, les biens et l'honneur sacrés, l'affirmation d'Ibn Umar selon laquelle « l'injustice sera ténèbres au Jour de la Résurrection » et celle d'Abu Musa selon laquelle « Dieu accorde un répit au malfaiteur jusqu'à ce que, lorsqu'Il le saisit, Il ne le laisse pas s'échapper »."
