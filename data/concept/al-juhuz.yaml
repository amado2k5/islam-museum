label:
  ar: "الجحوظ"
  en: "Protrusion of the eye (juhuz)"
  ur: "جحوظ"
summary:
  ar: "قد يقع الجحوظ إما لشدة انتفاخ المقلة لثقل بها وامتلائها وإما لشدة انضغاطها إلى خارج وإما لشدة استرخاء علاقتها والعضلات الحافظة لعلاقتها، والمادة إما في نفس العين ريحية أو خلطية رطبة وربما كان الامتلاء بمشاركة الدماغ أو البدن، ويحس فيه بتمدد دافع من خلف ويعرف من سببه، والخفيف يكفيه عصب دافع إلى باطن ونوم على استلقاء وتخفيف غذاء وقلة حركة وإدامة تغميض ⁦(سطور الطمث والنفاس والجنين محفوظة كسطور موسومة مطروحة للمؤسس)⁩ {cite:canon-ibn-sina-print-v2 p.190} {cite:canon-ibn-sina-print-v2 p.191}"
  en: "Protrusion may occur either from severe swelling of the eyeball by its heaviness and repletion, or from severe pressing outward, or from severe relaxation of its suspensory and of the muscles preserving that relation; the matter is either in the eye itself — windy or moist-humoral — and the repletion may be with the brain's or the body's sharing; in it a pushing distension is felt from behind and it is known from its cause; the light kind is sufficed by an inward-pressing bandage, sleeping on the back, lightening food, little motion and constant closing ⁦(the menses, lochia and foetus lines are kept as labelled listings for the founder's ruling)⁩ {cite:canon-ibn-sina-print-v2 p.190} {cite:canon-ibn-sina-print-v2 p.191}"
  ur: "جحوظ یا تو مقلہ کے شدید ورم سے ہو سکتا ہے اس کی گرانی اور امتلاء سے، یا باہر کی طرف سخت دباؤ سے، یا اس کی معلق کرنے والی اور اس ربط کی حفاظت کرنے والی پٹھوں کے شدید استرخاء سے؛ اور مادہ یا خود آنکھ میں ہوتا ہے — ریحی یا خلطی تر — اور امتلاء دماغ یا بدن کی شرکت سے بھی ہو سکتا ہے؛ اور اس میں پیچھے سے دھکیلتا ہوا تاؤ محسوس ہوتا ہے اور اپنے سبب سے پہچانا جاتا ہے؛ اور ہلکے کے لیے اندر دبانے والی پٹی، پیٹھ کے بل سونا، خوراک ہلکی، حرکت کم اور مسلسل پلکیں بند رکھنا کافی ہے ⁦(حیض، نفاس اور جنین کے سطریں موسوم فہرستوں کے طور پر محفوظ، بانی کے فیصلے کے لیے)⁩ {cite:canon-ibn-sina-print-v2 p.190} {cite:canon-ibn-sina-print-v2 p.191}"
