id: "concept/al-juhuz"
class: "concept"
kind: "scientific"
label:
  ar: "الجحوظ"
  en: "Protrusion of the eye (juhuz)"
  fr: "Protrusion de l’œil (juhuz)"
  ur: "جحوظ"
  es: "Protrusión del ojo (juhuz)"
  tr: "piroz"
  id: "Piroz"
summary:
  ar: "قد يقع الجحوظ إما لشدة انتفاخ المقلة لثقل بها وامتلائها وإما لشدة انضغاطها إلى خارج وإما لشدة استرخاء علاقتها والعضلات الحافظة لعلاقتها، والمادة إما في نفس العين ريحية أو خلطية رطبة وربما كان الامتلاء بمشاركة الدماغ أو البدن، ويحس فيه بتمدد دافع من خلف ويعرف من سببه، والخفيف يكفيه عصب دافع إلى باطن ونوم على استلقاء وتخفيف غذاء وقلة حركة وإدامة تغميض ⁦(سطور الطمث والنفاس والجنين محفوظة كسطور موسومة مطروحة للمؤسس)⁩ {cite:canon-ibn-sina-print-v2 p.190} {cite:canon-ibn-sina-print-v2 p.191}"
  en: "Protrusion may occur either from severe swelling of the eyeball by its heaviness and repletion, or from severe pressing outward, or from severe relaxation of its suspensory and of the muscles preserving that relation; the matter is either in the eye itself — windy or moist-humoral — and the repletion may be with the brain's or the body's sharing; in it a pushing distension is felt from behind and it is known from its cause; the light kind is sufficed by an inward-pressing bandage, sleeping on the back, lightening food, little motion and constant closing ⁦(the menses, lochia and foetus lines are kept as labelled listings for the founder's ruling)⁩ {cite:canon-ibn-sina-print-v2 p.190} {cite:canon-ibn-sina-print-v2 p.191}"
  fr: "La protrusion peut, selon le traité, résulter d’un fort gonflement du globe oculaire dû à sa lourdeur et à sa réplétion, d’une forte poussée vers l’extérieur ou d’un relâchement marqué de son appareil suspenseur et des muscles qui le maintiennent en place. La matière peut se trouver dans l’œil lui-même, sous forme de vent ou d’humeur humide ; la réplétion peut aussi toucher le cerveau ou le corps. Une distension qui pousse de l’arrière se fait sentir, et la cause permet de reconnaître cette forme. Pour la forme légère, le traité jugeait suffisants un bandage exerçant une pression vers l’intérieur, le sommeil sur le dos, une alimentation plus légère, peu de mouvements et la fermeture constante de l’œil (les lignes sur les règles, les lochies et le fœtus restent consignées sous des intitulés en attendant la décision du fondateur) {cite:canon-ibn-sina-print-v2 p.190} {cite:canon-ibn-sina-print-v2 p.191}"
  ur: "جحوظ یا تو مقلہ کے شدید ورم سے ہو سکتا ہے اس کی گرانی اور امتلاء سے، یا باہر کی طرف سخت دباؤ سے، یا اس کی معلق کرنے والی اور اس ربط کی حفاظت کرنے والی پٹھوں کے شدید استرخاء سے؛ اور مادہ یا خود آنکھ میں ہوتا ہے — ریحی یا خلطی تر — اور امتلاء دماغ یا بدن کی شرکت سے بھی ہو سکتا ہے؛ اور اس میں پیچھے سے دھکیلتا ہوا تاؤ محسوس ہوتا ہے اور اپنے سبب سے پہچانا جاتا ہے؛ اور ہلکے کے لیے اندر دبانے والی پٹی، پیٹھ کے بل سونا، خوراک ہلکی، حرکت کم اور مسلسل پلکیں بند رکھنا کافی ہے ⁦(حیض، نفاس اور جنین کے سطریں موسوم فہرستوں کے طور پر محفوظ، بانی کے فیصلے کے لیے)⁩ {cite:canon-ibn-sina-print-v2 p.190} {cite:canon-ibn-sina-print-v2 p.191}"
  es: "La protrusión puede ocurrir por una hinchazón severa del globo ocular debido a su pesadez y plenitud, o por una fuerte presión hacia afuera, o por una fuerte relajación de su ligamento suspensorio y de los músculos que mantienen esa relación; la materia está en el ojo mismo —ventosa o humoral húmeda— y la plenitud puede ser compartida por el cerebro o el cuerpo; en ella se siente una distensión que empuja desde atrás y se conoce su causa; la leve se trata con un vendaje que presiona hacia adentro, dormir boca arriba, comer ligero, poco movimiento y cierre constante (las líneas de menstruación, loquios y feto se mantienen como listados etiquetados para la regla del fundador) {cite:canon-ibn-sina-print-v2 p.190} {cite:canon-ibn-sina-print-v2 p.191}"
  tr: "Çıkıntı, mesanenin ağırlığı ve dolgunluğu nedeniyle şişmesi, dışa doğru sıkışmasının şiddeti ya da ilişkisinin ve onu koruyan kasların yoğun gevşemesi nedeniyle meydana gelebilir. Gözdeki madde aromatik veya humoleh, nemli ya da belki beyin ya da vücut katılımıyla doludur ve kişi arkadan bir uyarıcı hisseder ve nedenini bilir. Hafif bir sinirin içe doğru itmesi ve uyuması yatmak, beslenmeyi, hareket eksikliğini azaltmak ve kapanmayı sürdürmek için yeterlidir (adet çizgileri, puerperum ve fetus çizgileri kurucu tarafından etiketlenen çizgiler olarak korunur) {cite:canon-ibn-sina-print-v2 s.190} {cite:canon-ibn-sina-print-v2 s.191}"
  id: "Protrusi dapat terjadi akibat pembengkakan akibat berat dan penuh kandung kemih, tingkat keparahan kompresi luar, atau relaksasi intens hubungan dan otot yang melindunginya. Zat di mata bersifat aromatik atau humoleh, lembap, atau mungkin dipenuhi keterlibatan otak atau tubuh, dan orang merasakan rangsangan dari belakang dan tahu alasannya. Saraf yang sedikit mendorong ke dalam dan tidur sudah cukup untuk berbaring, mengurangi nutrisi, mengurangi kurangnya gerakan, dan mempertahankan penutupan (garis menstruasi, puerperum, dan janin tetap terjaga sebagai garis yang diberi label oleh pendiri) {cite:canon-ibn-sina-print-v2 hlm.190} {cite:canon-ibn-sina-print-v2 hlm.191}"
