summary:
  ar: "في الفصل السابع يبدأ ابن سينا بعلامات غلبة الدم، وهي قريبة من علامات الامتلاء بحسب الأوعية {cite:canon-ibn-sina-print-v1 pp.164-165}."
  en: "In the seventh chapter Ibn Sina begins the signs of a dominant humour with blood, whose signs are close to those of fullness of the vessels {cite:canon-ibn-sina-print-v1 pp.164-165}."
  fr: "Au chapitre 7, Ibn Sina commence les signes d’humeur dominante par le sang, proches de ceux de la pléthore vasculaire {cite:canon-ibn-sina-print-v1 pp.164-165}."
  es: "En el séptimo capítulo, Ibn Sina comienza a describir los signos de un humor dominante con la sangre, cuyos signos se asemejan a los de la plenitud de los vasos {cite:canon-ibn-sina-print-v1 pp.164-165}."
  ur: "ساتویں باب میں ابن سینا نے ایک غالب مزاح کی علامات کو خون سے شروع کیا ہے، جس کی علامات برتنوں کی مکمل ہونے کے قریب ہیں۔"
  tr: "Yedinci bölümde, İbn Sina kan baskınlığı belirtileriyle başlar; bunlar damarlara göre doluluk işaretlerine yakındır {cite:canon-ibn-sina-print-v1 s.164-165}."
  id: "Pada bab tujuh, Ibn Sina memulai dengan tanda-tanda dominasi darah, yang mendekati tanda-tanda kepenuhan menurut pembuluh {cite:canon-ibn-sina-print-v1 hlm.164-165}."
