  ar: "علامات غلبة الدم عند ابن سينا"
  en: "Signs of an excess of blood in the Canon"
  fr: "Signes d’excès de sang dans le Canon"
  ur: "خون کے غلبے کی علامات قانون میں"
  es: "Signos de exceso de sangre en el Canon"
  tr: "İbn Sina'ya göre kanın baskınlığının işaretleri"
