label:
  ar: الخنق
  en: Khanq (strangling in fiqh)
  ur: خنق
summary:
  ar: 'الخنق لغة عصر الحلق حتى الموت، ويستعمل عند الفقهاء بأي وسيلة كان الخنق، بحبل أو باليدين أو بسد الفم والأنف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7884} في الصيد والذبائح: لا يحل بالخنق ما يذبح بالإجماع، لقوله تعالى في المائدة «والمنخنقة»، ولا يحل الصيد الذي مات بالخناق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885} في القتل: جمهور الفقهاء (المالكية والشافعية والحنابلة والصاحبان) يوجبون القود بالخنق عمدا لأنه يتلف غالبا، وأبو حنيفة لا قصاص بالخنق لأنه شبه عمد؛ وإذا تكرر الخنق قتل به سياسة عند أبي حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885} في الأيمان: الحنفية والحنابلة يحنثون من حلف لا يضرب امرأته فخنقها، والشافعية لا يرون الخنق ضربا عرفا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7886}'
  en: 'Khanq is lexically squeezing the throat until death; the jurists use it for any means: a cord, the hands, or stopping the mouth and nose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7884} Hunting and slaughter: by agreement an animal that is to be slaughtered is not lawful when strangled; the verse on the strangled animal in al-Ma''ida is cited; game dead from strangling is not lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885} Homicide: the majority (Malikis, Shafiis, Hanbalis and the two companions) impose retaliation for an intentional strangling, since it usually kills; Abu Hanifa imposes no retaliation for strangling as it is semi-intentional, and holds that one who strangles repeatedly may be killed by discretion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885} Oaths: the Hanafis and Hanbalis count striking a wife as including strangling, so an oath not to strike her is broken by strangling; the Shafiis do not count it as striking by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7886}'
  ur: 'خنق لغت میں گلا گھونٹ کر مار دینا ہے، اور فقہاء کے نزدیک جو بھی ذریعہ ہو: رسّی، ہاتھ یا منہ اور ناک بند کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7884} شکار اور ذبیحہ: جو جانور ذبح کیا جاتا ہے وہ گلا گھونٹنے سے حلال نہیں، بالاتفاق، سورۂ مائدہ کی آیت «والمنخنقة» کی بنا پر؛ گلا گھٹ کر مرا ہوا شکار حلال نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7884}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885} قتل: جمہور (مالکیہ، شافعیہ، حنابلہ اور صاحبین) عمداً گلا گھونٹنے پر قصاص لازم کرتے ہیں کیونکہ یہ عموماً مہلک ہے؛ ابو حنیفہ شبہِ عمد کہہ کر قصاص نہیں دیتے، اور بار بار گلا گھونٹنے والے کو سیاست کے طور پر قتل کرنا ان کے نزدیک جائز۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885} قسم: حنفیہ اور حنابلہ مارنے کی قسم میں گلا گھونٹنا شامل کرتے ہیں، شافعیہ عرف میں اسے مارنا نہیں کہتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7885}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7886}'
