label: { ar: "نقود الممالك العربية قبل الإسلام", en: "Coinage of the pre-Islamic Arabian kingdoms", ur: "قبل از اسلام عرب سلطنتوں کے سکے", es: "Acuñación de monedas de los reinos árabes preislámicos", fr: "Monnaie des royaumes arabes préislamiques", tr: "İslam öncesi Arap Krallıklarının paraları", id: "Koin Kerajaan Arab sebelum Islam" }
summary:
  ar: "النقود التي ضربتها ممالك الجزيرة العربية قبل الإسلام، كمملكة سبأ منذ القرن الرابع قبل الميلاد على الطراز الإغريقي، ومملكة الأنباط ⁦(169 ق.م–106م)⁩، كما يعرضها فرج الله أحمد يوسف {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 17} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 18}."
  en: "Coins struck by the Arabian kingdoms before Islam, such as Saba from the fourth century BCE on Greek models and the Nabataean kingdom (169 BCE–106 CE), as Farajallah Ahmad Yusuf presents them {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 17} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 18}."
  ur: "قبل از اسلام جزیرہ نمائے عرب کی سلطنتوں کے سکے، جیسے سبا کے چوتھی صدی قبل مسیح سے یونانی طرز پر اور نبطی سلطنت ⁦(169 ق م–106ء)⁩ کے {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 17}."
  es: "Monedas acuñadas por los reinos árabes antes del Islam, como Saba del siglo IV a. C. sobre modelos griegos y el reino nabateo (169 a. C.–106 d. C.), como las presenta Farajallah Ahmad Yusuf {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 17} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 18}."
  fr: "Les pièces de monnaie frappées par les royaumes arabes avant l'Islam, comme Saba du IVe siècle avant notre ère sur des modèles grecs et le royaume nabatéen (169 avant notre ère – 106 de notre ère), telles que Farajallah Ahmad Yusuf les présente {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 17} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 18}."
  tr: "İslam öncesi Arap Yarımadası krallıkları tarafından basılan madeni paralar; örneğin MÖ 4. yüzyıldan itibaren Yunan tarzında Saba Krallığı ve Faraj Allah Ahmed Yusuf tarafından sunulan Nabatean Krallığı (MÖ 169–MS 106) {cite:yusuf-ayat-quraniyya-maskukat-2003 s. 17} {cite:yusuf-ayat-quraniyya-maskukat-2003 s. 18}."
  id: "Koin yang dicetak oleh kerajaan-kerajaan Semenanjung Arab sebelum Islam, seperti Kerajaan Saba dari abad ke-4 SM dengan gaya Yunani, dan Kerajaan Nabatean (169 SM–106 M), sebagaimana disajikan oleh Faraj Allah Ahmed Yusuf {cite:yusuf-ayat-quraniyya-maskukat-2003 hlm. 17} {cite:yusuf-ayat-quraniyya-maskukat-2003 hlm. 18}."
