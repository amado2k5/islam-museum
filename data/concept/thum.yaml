summary:
  ar: "ثوم في الكتاب منه البستاني المعروف والكرائي والبري، وفي البري مرارة وقبض ويسمى ثوم الحية، والكرائي مركب القوة من الثوم والكراث؛ مسخن مجفف في الثالثة إلى الرابعة والبري أكثر، مليّن يحل النفخ جدا ومقرح للجلد، يقتل القمل والصئبان، ويفتح الدبيلات، وينفع من عرق النسا ومن وجع الأسنان والسعال المزمن، ويضعف البصر ويصدع، ويدر البول، ويخرج الدود، وينفع من لسع الهوام ونهش الحيات، ويورد الكتاب أقوالا عن الطمث والمشيمة والباه في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.695-696}"
  en: "Thum is in the book garden garlic, known, the karrai kind and the wild; in the wild there is bitterness and astringency and it is called snake garlic, and the karrai is a compound in power of garlic and leek; heating and drying from the third degree to the fourth, the wild more, it softens, dissolves wind greatly and ulcerates the skin; it kills lice and nits, opens internal abscesses, benefits sciatica, toothache and chronic cough, weakens sight and gives headache, promotes urine, expels worms, and benefits stings of vermin and bites of snakes; the book gives statements on menses, the afterbirth and desire in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.695-696}"
  ur: "ثوم کتاب میں معروف باغی، کرائی اور جنگلی تین قسم کا ہے؛ جنگلی میں کڑواہٹ اور قبض ہے اور اسے ثوم الحیۃ کہتے ہیں، اور کرائی قوت میں لہسن اور گندنا سے مرکب ہے؛ تیسرے سے چوتھے درجے تک گرم خشک ہے، جنگلی زیادہ، نرم کرتا ہے، ریاح کو بہت تحلیل کرتا ہے اور جلد پر چھالے ڈالتا ہے؛ جوؤں اور لیکھوں کو مارتا ہے، اندرونی پھوڑوں کو کھولتا ہے، عرق النسا، دانت کے درد اور پرانی کھانسی میں نافع ہے، نظر کو کمزور کرتا اور سر درد دیتا ہے، پیشاب لاتا ہے، کیڑے نکالتا ہے، اور موذی جانوروں کے ڈنک اور سانپوں کے کاٹے میں نافع ہے؛ کتاب حیض، آنول اور باہ کے بارے میں باتیں موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.695-696}۔"
  es: "Thum es en el libro ajo de jardín, conocido, tipo karrai y silvestre; en el silvestre hay amargor y astringencia y se llama ajo serpiente, y el karrai es un compuesto en potencia de ajo y puerro; calentado y secado del tercer al cuarto grado, más silvestre, ablanda, disuelve mucho el viento y ulcera la piel; mata piojos y liendres, abre abscesos internos, beneficia la ciática, el dolor de muelas y la tos crónica, debilita la vista y da dolor de cabeza, promueve la micción, expulsa gusanos y beneficia las picaduras de alimañas y mordeduras de serpientes; el libro da declaraciones sobre la menstruación, la placenta y el deseo en una sección etiquetada reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 pp.695-696}"
  fr: "Le livre mentionne l'ail des jardins, connu sous le nom d'ail de Karrai et d'ail sauvage. L'ail sauvage, amer et astringent, est appelé ail serpent. L'ail de Karrai est un composé aux propriétés de l'ail et du poireau. Chauffé et séché du troisième au quatrième degré, l'ail sauvage est plus efficace. Il adoucit, dissout les gaz et ulcère la peau. Il tue les poux et les lentes, ouvre les abcès internes, soulage la sciatique, les maux de dents et la toux chronique, affaiblit la vue et provoque des maux de tête, favorise la diurèse, expulse les vers et soulage les piqûres de vermine et les morsures de serpent. Le livre contient des indications sur les menstruations, le placenta et le désir dans une section réservée à la décision du fondateur. {cite:canon-ibn-sina-print-v1 pp.695-696}"
