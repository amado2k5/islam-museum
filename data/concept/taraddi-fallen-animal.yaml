summary:
  ar: "التردي السقوط من علو إلى سفل، والمتردية الحيوان الواقع في بئر أو من جبل. وقد حرم القرآن المتردية إلا إذا ذكيت ذكاة شرعية، والذكاة الاضطرارية بالعقر في غير المقدور عليه. وفي الصيد الذي يقع في الماء أو يتردى إلى الأرض خلاف بين المذاهب، فيحرم عند الحنفية إن وقع في ماء، ويحرم عند الحنابلة إن كان الماء يقتل مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4960}"
  en: "Taraddi is falling from a height to a lower place; the mutaraddiya is an animal that has fallen into a well or from a mountain. The Qur'an forbids such an animal unless it is slaughtered in the lawful way, and the emergency slaughter is by wounding one that cannot be reached. For game that falls into water or from a height, the schools differ: the Hanafis forbid it if it fell into water, and the Hanbalis forbid it when the water would kill its kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4960}"
  es: "Taraddi es la caída desde una altura a un lugar más bajo; mutaraddiya es un animal que ha caído en un pozo o desde una montaña. El Corán prohíbe tal animal a menos que sea sacrificado de forma lícita, y el sacrificio de emergencia se realiza hiriendo a uno que no se puede alcanzar. Respecto a la caza que cae al agua o desde una altura, las escuelas difieren: los hanafíes la prohíben si cae al agua, y los hanbalíes la prohíben cuando el agua mataría a su especie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4960}"
  fr: "Taraddi désigne une chute d'une hauteur vers un lieu plus bas; mutaraddiya désigne un animal tombé dans un puits ou d'une montagne. Le Coran interdit la consommation d'un tel animal, sauf s'il est abattu selon les rites licites, et l'abattage d'urgence consiste à blesser un animal hors d'atteinte. Concernant le gibier tombé à l'eau ou d'une hauteur, les écoles juridiques divergent: les Hanafites l'interdisent s'il est tombé à l'eau, et les Hanbalites l'interdisent lorsque l'eau risque de tuer ses congénères. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4960}"
  ur: "تارڈی اونچائی سے نیچے کی طرف گر رہی ہے۔ مُترادیہ وہ جانور ہے جو کنویں یا پہاڑ سے گرا ہو۔ قرآن نے ایسے جانور کو حرام قرار دیا ہے جب تک کہ اسے حلال طریقے سے ذبح نہ کیا جائے، اور ہنگامی طور پر ذبح کرنے والے جانور کو زخمی کرنا ہے جس تک پہنچنا ممکن نہ ہو۔ وہ کھیل جو پانی میں گرے یا اونچائی سے، مکاتب میں اختلاف ہے: اگر پانی میں گرے تو حنفیہ اسے منع کرتے ہیں، اور حنبلی اس سے منع کرتے ہیں جب پانی اس کی قسم کو مار ڈالے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4958} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4959}"
  tr: "Tardiyye, yükseklikten alçaklara düşmek, mudariyyah ise bir kuyuya ya da dağdan düşen hayvandır. Kur'an, mudariyiyi ancak meşru zekatla yapılırsa yasaklar; zorunlu zekat ise mümkün değilse sterilizasyonla yapılır. Suya düşen veya yere düşen avcılık konusunda okullar arasında anlaşmazlık vardır: Hanafilere göre suya düşmesi yasaktır, Hanbalilere göre ise su onu öldürürse yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4960}"
  id: "Tardiyya adalah jatuh dari ketinggian ke bawah, dan mudariyyah adalah hewan yang jatuh ke dalam sumur atau gunung. Al-Qur'an melarang mudariyyah kecuali dilakukan dengan zakat yang sah, dan zakat paksa dilakukan dengan sterilisasi jika tidak memungkinkan. Mengenai perburuan yang jatuh ke air atau jatuh ke tanah, ada perbedaan pendapat antar aliran: menurut Hanafi dilarang jika jatuh ke air, dan menurut Hanbalis dilarang jika air membunuh orang yang sama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4960}"
