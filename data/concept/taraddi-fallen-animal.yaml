summary:
  ar: "التردي السقوط من علو إلى سفل، والمتردية الحيوان الواقع في بئر أو من جبل. وقد حرم القرآن المتردية إلا إذا ذكيت ذكاة شرعية، والذكاة الاضطرارية بالعقر في غير المقدور عليه. وفي الصيد الذي يقع في الماء أو يتردى إلى الأرض خلاف بين المذاهب، فيحرم عند الحنفية إن وقع في ماء، ويحرم عند الحنابلة إن كان الماء يقتل مثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4960}"
  en: "Taraddi is falling from a height to a lower place; the mutaraddiya is an animal that has fallen into a well or from a mountain. The Qur'an forbids such an animal unless it is slaughtered in the lawful way, and the emergency slaughter is by wounding one that cannot be reached. For game that falls into water or from a height, the schools differ: the Hanafis forbid it if it fell into water, and the Hanbalis forbid it when the water would kill its kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4960}"
