summary:
  ar: "العقرب في الكتاب حيوان يستعمل منه زيته لأوجاع الأذن، ويفتت المحرق منه حصاة المثانة والكلى عند الكتاب {cite:canon-ibn-sina-print-v1 p.620}"
  en: "Aqrab is in the book the scorpion, whose oil is used for pains of the ear and whose burnt body, according to the book, breaks up stone in the bladder and kidneys {cite:canon-ibn-sina-print-v1 p.620}"
  fr: "L’aqrab est dans le livre le scorpion, dont l’huile s’emploie contre les douleurs de l’oreille et dont le corps brûlé, selon le livre, brise la pierre dans la vessie et les reins {cite:canon-ibn-sina-print-v1 p.620}"
  ur: "عقرب کتاب میں بچھو ہے جس کا تیل کان کے دردوں میں استعمال ہوتا ہے، اور کتاب کے مطابق اس کا جلایا ہوا جسم مثانے اور گردے کی پتھری توڑتا ہے {cite:canon-ibn-sina-print-v1 p.620}۔"
  es: "Aqrab es el escorpión del libro, cuyo aceite se usa para los dolores de oído y cuyo cuerpo quemado, según el libro, disuelve los cálculos de la vejiga y los riñones {cite:canon-ibn-sina-print-v1 p.620}"
