summary:
  ar: "المجتهد من يبلغ رتبة استنباط الأحكام من أدلتها؛ تعرض الموسوعة الفقهية الكويتية طور الاجتهاد وطبقات المجتهدين والفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "The mujtahid is one who reaches the rank of deriving rulings from their proofs; the Kuwaiti Fiqh Encyclopedia presents the age of ijtihad and the ranks of mujtahids and jurists {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "El mujtahid es aquel que alcanza el rango de derivar dictámenes a partir de sus pruebas; la Enciclopedia de Fiqh de Kuwait presenta la era del ijtihad y los rangos de los mujtahids y juristas {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Le mujtahid est celui qui atteint le rang de celui qui tire des décisions de ses preuves; l'Encyclopédie Fiqh koweïtienne présente l'âge de l'ijtihad et les rangs des mujtahids et des juristes {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "مجتہد وہ ہے جو اپنے دلائل سے احکام اخذ کرنے کے درجے پر پہنچے۔ کویتی فقہ انسائیکلو پیڈیا اجتہاد کا زمانہ اور مجتہدوں اور فقہاء کی صفوں کو پیش کرتا ہے {حوالہ: فقہ معاویہ کویتیہ نور-v3}۔"
