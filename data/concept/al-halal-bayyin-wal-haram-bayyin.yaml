id: concept/al-halal-bayyin-wal-haram-bayyin
class: concept
kind: legal
label:
  ar: "حديث «الحلال بيّن والحرام بيّن»"
  en: "The hadith \"the lawful is clear and the unlawful is clear\""
  ur: "حدیث «حلال واضح ہے اور حرام واضح ہے»"
summary:
  ar: "يروي النعمان بن بشير عن النبي أن الحلال بين وأن الحرام بين وبينهما أمور مشتبهات لا يعلمها كثير من الناس {cite:sunan-abi-dawud 3330}. ويرد في [[passage/bukhari-api-52|صحيح البخاري 52]] أن من اتقى المشبهات استبرأ لدينه وعرضه، ومن وقع فيها كراع يرعى حول الحمى يوشك أن يواقعه، وأن في الجسد مضغة هي القلب {cite:sahih-al-bukhari 52}. ويعد ابن رجب أن الدين كله يرجع إلى فعل المأمورات وترك المحظورات والتوقف عن الشبهات، وأن حديث النعمان تضمن ذلك {cite:ibn-rajab-jami-ulum-hikam p.42}. ويروى في الباب أيضاً «دع ما يريبك إلى ما لا يريبك» {cite:jami-al-tirmidhi 2518}."
  en: "Al-Nu'man ibn Bashir reports from the Prophet that the lawful is clear, the unlawful is clear, and between them lie doubtful matters that many people do not know {cite:sunan-abi-dawud 3330}. [[passage/bukhari-api-52|Sahih al-Bukhari 52]] adds that whoever guards against the doubtful clears his religion and honour, that whoever falls into it is like a herdsman grazing around a protected pasture who is close to entering it, and that in the body there is a morsel of flesh, the heart {cite:sahih-al-bukhari 52}. Ibn Rajab holds that the whole of religion returns to doing what is commanded, leaving what is prohibited and pausing before doubtful matters, and that the report of al-Nu'man contains all of this {cite:ibn-rajab-jami-ulum-hikam p.42}. The same chapter also carries the saying to leave what makes you doubt for what does not {cite:jami-al-tirmidhi 2518}."
  ur: "نعمان بن بشیر نبی سے روایت کرتے ہیں کہ حلال واضح ہے، حرام واضح ہے، اور ان کے درمیان مشتبہ امور ہیں جنہیں بہت سے لوگ نہیں جانتے {cite:sunan-abi-dawud 3330}۔ [[passage/bukhari-api-52|صحیح بخاری 52]] میں اضافہ ہے کہ جو مشتبہ باتوں سے بچا اس نے اپنے دین اور آبرو کو بچا لیا، اور جو ان میں پڑ گیا وہ اس چرواہے کی طرح ہے جو چراگاہ کی حدود کے گرد چراتا ہے اور اس میں داخل ہونے کے قریب ہوتا ہے، اور یہ کہ جسم میں گوشت کا ایک ٹکڑا ہے، یعنی دل {cite:sahih-al-bukhari 52}۔ ابن رجب کے نزدیک پورا دین مامورات پر عمل، ممنوعات کے ترک اور مشتبہ امور سے رکنے کی طرف لوٹتا ہے، اور نعمان کی حدیث میں یہ سب کچھ شامل ہے {cite:ibn-rajab-jami-ulum-hikam p.42}۔ اسی باب میں یہ قول بھی آتا ہے کہ جو چیز تمہیں شک میں ڈالے اسے چھوڑ کر وہ اختیار کرو جو شک میں نہ ڈالے {cite:jami-al-tirmidhi 2518}۔"
