id: concept/al-halal-bayyin-wal-haram-bayyin
class: concept
kind: legal
label:
  ar: "حديث «الحلال بيّن والحرام بيّن»"
  en: "The hadith \"the lawful is clear and the unlawful is clear\""
  fr: "Le hadith « le licite est clair et l’illicite est clair »"
  ur: "حدیث «حلال واضح ہے اور حرام واضح ہے»"
  es: "El hadiz dice: \"Lo lícito es claro y lo ilícito es claro\"."
  tr: "Hadis 'Yasal olan açıktır, yasadışı olan açıktır'"
  id: "Hadis: 'Apa yang legal itu jelas, apa yang ilegal itu jelas'"
summary:
  ar: "يروي النعمان بن بشير عن النبي أن الحلال بين وأن الحرام بين وبينهما مشبهات لا يعلمها كثير من الناس {cite:sunan-abi-dawud 3330}. ويرد في [[passage/bukhari-api-52|صحيح البخاري 52]] أن من اتقى المشبهات استبرأ لدينه وعرضه، ومن وقع فيها كراع يرعى حول الحمى يوشك أن يواقعه، وأن في الجسد مضغة هي القلب {cite:sahih-al-bukhari 52}. ويعد ابن رجب أن الدين كله يرجع إلى فعل المأمورات وترك المحظورات والتوقف عن الشبهات، وأن حديث النعمان تضمن ذلك {cite:ibn-rajab-jami-ulum-hikam p.42}. ويروى في الباب أيضاً «دع ما يريبك إلى ما لا يريبك» {cite:jami-al-tirmidhi 2518}."
  en: "Al-Nu'man ibn Bashir reports from the Prophet that the lawful is clear, the unlawful is clear, and between them lie doubtful matters that many people do not know {cite:sunan-abi-dawud 3330}. [[passage/bukhari-api-52|Sahih al-Bukhari 52]] adds that whoever guards against the doubtful clears his religion and honour, that whoever falls into it is like a herdsman grazing around a protected pasture who is close to entering it, and that in the body there is a morsel of flesh, the heart {cite:sahih-al-bukhari 52}. Ibn Rajab holds that the whole of religion returns to doing what is commanded, leaving what is prohibited and pausing before doubtful matters, and that the report of al-Nu'man contains all of this {cite:ibn-rajab-jami-ulum-hikam p.42}. The same chapter also carries the saying to leave what makes you doubt for what does not {cite:jami-al-tirmidhi 2518}."
  fr: "Al-Nu’man ibn Bashir rapporte du Prophète que le licite est clair, que l’illicite est clair et qu’entre les deux se trouvent des choses douteuses que beaucoup ne connaissent pas {cite:sunan-abi-dawud 3330}. Le [[passage/bukhari-api-52|Sahih d’al-Bukhari, no 52]] ajoute que qui se garde du douteux préserve sa religion et son honneur ; qui y tombe ressemble à un berger qui fait paître son troupeau près d’un pâturage réservé et risque d’y entrer. Il y a aussi dans le corps un morceau de chair : le cœur {cite:sahih-al-bukhari 52}. Pour Ibn Rajab, toute la religion revient à faire ce qui est ordonné, à délaisser ce qui est interdit et à s’arrêter devant le douteux : le récit d’al-Nu’man contient ces trois éléments {cite:ibn-rajab-jami-ulum-hikam p.42}. Le même chapitre rapporte la parole qui invite à délaisser ce qui fait douter pour ce qui ne fait pas douter {cite:jami-al-tirmidhi 2518}."
  ur: "نعمان بن بشیر نبی سے روایت کرتے ہیں کہ حلال واضح ہے، حرام واضح ہے، اور ان کے درمیان مشتبہ امور ہیں جنہیں بہت سے لوگ نہیں جانتے {cite:sunan-abi-dawud 3330}۔ [[passage/bukhari-api-52|صحیح بخاری 52]] میں اضافہ ہے کہ جو مشتبہ باتوں سے بچا اس نے اپنے دین اور آبرو کو بچا لیا، اور جو ان میں پڑ گیا وہ اس چرواہے کی طرح ہے جو چراگاہ کی حدود کے گرد چراتا ہے اور اس میں داخل ہونے کے قریب ہوتا ہے، اور یہ کہ جسم میں گوشت کا ایک ٹکڑا ہے، یعنی دل {cite:sahih-al-bukhari 52}۔ ابن رجب کے نزدیک پورا دین مامورات پر عمل، ممنوعات کے ترک اور مشتبہ امور سے رکنے کی طرف لوٹتا ہے، اور نعمان کی حدیث میں یہ سب کچھ شامل ہے {cite:ibn-rajab-jami-ulum-hikam p.42}۔ اسی باب میں یہ قول بھی آتا ہے کہ جو چیز تمہیں شک میں ڈالے اسے چھوڑ کر وہ اختیار کرو جو شک میں نہ ڈالے {cite:jami-al-tirmidhi 2518}۔"
  es: "Al-Nu'man ibn Bashir relata del Profeta que lo lícito es claro, lo ilícito es claro, y entre ellos se encuentran asuntos dudosos que muchas personas desconocen {cite:sunan-abi-dawud 3330}. [[passage/bukhari-api-52|Sahih al-Bukhari 52]] añade que quien se protege de lo dudoso purifica su religión y su honor, que quien cae en ello es como un pastor que pastorea alrededor de un prado protegido y está a punto de entrar en él, y que en el cuerpo hay un bocado de carne, el corazón {cite:sahih-al-bukhari 52}. Ibn Rajab sostiene que toda la religión se reduce a hacer lo que está ordenado, dejando lo prohibido y deteniéndose ante asuntos dudosos, y que el relato de al-Nu'man contiene todo esto {cite:ibn-rajab-jami-ulum-hikam p.42}. El mismo capítulo también contiene el dicho de dejar lo que te hace dudar por lo que no {cite:jami-al-tirmidhi 2518}."
  tr: "El-Nu'man bin Beşîr, Peygamber'den şöyle der: Yasal olanın açıktır, yasa dışı da açıktır ve aralarında birçok kişinin bilmediği benzer şeyler vardır {alıntı: Sunan-Abi-Dawud 3330}. [[Passage/Buhari-api-52|Sahih al-Buhari 52]]'de belirtilir ki, benzer şeylerden kaçınan dininden ve onurundan arınır, ateşin etrafında otlayan bir çoban gibi onlara düşenin onunla ilişkiye gireceği ve bedende kalbin çiğnediği bir şey vardır {atıf:sahih-al-bukhari 52}. İbn Receb, tüm dinlerin emredilen eylemleri yerine getirmek, yasaklamaktan kaçınmak ve şüpheli şeylerden kaçınmak üzerine kurulu olduğunu düşünür ve el-Nu'man hadisinde de bu {atıf:ibn-rajab-jami-ulum-hikam s.42} yer alır. Ayrıca şu bölümde de anlatılır: \"Şüphe duyanı sana şüphe duymayanlara bırak\" {cite:jami-al-tirmidhi 2518}."
  id: "Al-Nu'man ibn Bashir berkata tentang Nabi: Apa yang sah itu jelas, yang ilegal itu jelas, dan di antaranya ada hal-hal serupa yang banyak orang tidak ketahui {kutipan: Sunan-Abi-Dawud 3330}. [[Bacaan/Bukhari-api-52| Sahih al-Bukhari 52]] menyatakan bahwa siapa pun yang menghindari hal serupa membersihkan diri dari agama dan kehormatannya, dan seperti gembala yang merumput di sekitar api, ada sesuatu dalam tubuh yang akan diajak bicara oleh hati dan dikunyah oleh hati [atribusi: sahih al-bukhari 52}. Ibn Rajab percaya bahwa semua agama didasarkan pada melakukan perbuatan yang diperintahkan, menghindari larangan, dan menghindari hal-hal yang meragukan, dan ini juga ditemukan dalam hadis al-Nu'man {atribusi: ibn-rajab-jami-ulum-hikam hlm.42}. Bagian ini juga dijelaskan: \"Serahkan orang yang meragukan kepada mereka yang meragukanmu\" {cite:jami-al-tirmidhi 2518}."
