label:
  ar: "شهر شعبان"
  en: "Sha'ban (the eighth month and the fast before Ramadan)"
  es: "Sha'ban (el octavo mes y el ayuno previo al Ramadán)"
  fr: "Sha'ban (le huitième mois et le jeûne avant le Ramadan)"
  ur: "شعبان ⁦(آٹھواں مہینہ اور رمضان سے پہلے کے روزے)⁩"
  tr: "Şaban ayı"
  id: "Bulan Sha'ban"
summary:
  ar: "شعبان ثامن شهور السنة، وهو شهر يغفل الناس عنه بين رجب ورمضان، وكانت أعمال العباد ترفع فيه فأحب النبي أن يرفع عمله وهو صائم. وفيه ليلة النصف التي روي في فضلها أخبار، ويصام ما استطاع منه قبل رمضان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "Sha'ban is the eighth month, a month people neglect between Rajab and Ramadan, in which deeds are raised and the Prophet liked to be fasting when his deeds were raised. Its middle night has reports about its merit, and as much of it as one can is fasted before Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  ur: "شعبان آٹھواں مہینہ ہے، رجب اور رمضان کے درمیان وہ مہینہ جس سے لوگ غافل رہتے ہیں؛ اس میں اعمال اوپر اٹھائے جاتے ہیں اور نبی کریم پسند کرتے تھے کہ جب ان کے اعمال اٹھائے جائیں تو وہ روزے سے ہوں۔ اس کی پندرہویں رات کے فضل کی روایات ہیں، اور رمضان سے پہلے اس میں جتنا ممکن ہو روزے رکھے جاتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  es: "Sha'ban es el octavo mes, un mes que la gente suele descuidar entre Rajab y Ramadán, en el que se elevan las buenas obras y al Profeta le gustaba estar ayunando cuando sus buenas obras eran elevadas. Se dice que su noche central tiene méritos, y se ayuna tanto como sea posible antes de Ramadán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  fr: "Sha'ban est le huitième mois, souvent négligé entre Rajab et Ramadan. C'est un mois propice à l'élévation des bonnes actions, et le Prophète aimait jeûner lorsque ses actions étaient particulièrement valorisées. La nuit du milieu du mois est réputée pour ses mérites, et il est conseillé de jeûner autant que possible avant Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  tr: "Şaban, yılın sekizinci ayıdır; Rajab ile Ramazan arasında insanların ihmal ettiği bir aydır. Bu dönemde hizmetkârların işleri yüceltildiği için Peygamber oruç tutarken işlerini yüceltmeyi severdi. Aynı zamanda gece yarısı gecesidir; bu gecede erdemleri anlatılır ve kişi Ramazan öncesinde mümkün olduğunca oruç tutar. {Kaynak:fiqh-mawsua-Kuwaitiyya-Noor-v3}"
  id: "Sha'ban adalah bulan kedelapan dalam setahun, bulan yang diabaikan oleh orang antara Rajab dan Ramadan. Pada masa itu, perbuatan hamba ditinggikan, sehingga Nabi suka memuliakan amalnya saat berpuasa. Ini juga malam tengah malam, di mana laporan tentang kebaikannya diceritakan, dan seseorang berpuasa sebanyak mungkin sebelum Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
