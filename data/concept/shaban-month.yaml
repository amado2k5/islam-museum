id: concept/shaban-month
class: concept
kind: legal
label:
  ar: "شهر شعبان"
  en: "Sha'ban (the eighth month and the fast before Ramadan)"
summary:
  ar: "شعبان ثامن شهور السنة، وهو شهر يغفل الناس عنه بين رجب ورمضان، وكانت أعمال العباد ترفع فيه فأحب النبي أن يرفع عمله وهو صائم. وفيه ليلة النصف التي روي في فضلها أخبار، ويصام ما استطاع منه قبل رمضان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "Sha'ban is the eighth month, a month people neglect between Rajab and Ramadan, in which deeds are raised and the Prophet liked to be fasting when his deeds were raised. Its middle night has reports about its merit, and as much of it as one can is fasted before Ramadan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  ur: "شعبان آٹھواں مہینہ ہے، رجب اور رمضان کے درمیان وہ مہینہ جس سے لوگ غافل رہتے ہیں؛ اس میں اعمال اوپر اٹھائے جاتے ہیں اور نبی کریم پسند کرتے تھے کہ جب ان کے اعمال اٹھائے جائیں تو وہ روزے سے ہوں۔ اس کی پندرہویں رات کے فضل کی روایات ہیں، اور رمضان سے پہلے اس میں جتنا ممکن ہو روزے رکھے جاتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
