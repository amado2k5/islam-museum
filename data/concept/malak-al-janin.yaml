id: concept/malak-al-janin
class: concept
kind: angel
label:
  ar: ملك الجنين
  en: The Angel of the Fetus
  ur: جنین کا فرشتہ
summary:
  ar: 'ملك موكل بتكوين الجنين في بطن أمه، يذكره الحديث في حديث النطفة في الصحيحين: إذا مضت أربعون يوماً بعث الله إليه ملكاً فيصيّره ويخلق سمعه
    وبصره وجلده ولحمه وعظامه، ثم يقول: يا شقي يا سعيد، فيكتب عمله.'
  en: 'An angel charged with fashioning the fetus in its mother''s womb, described in the hadith of the nutfa in the Two Sahihs: after forty days
    God sends an angel who shapes him and creates his hearing, sight, skin, flesh and bones, then says ''wretched or happy'' and writes down his
    deeds.'
  ur: 'وہ فرشتہ جو ماں کے پیٹ میں جنین کی تخلیق کا مکلف ہے، جس کا ذکر صحیحین کی نطفہ والی حدیث میں ہے: چالیس دن گزرنے پر خدا اس کے پاس فرشتہ بھیجتا
    ہے جو اسے صورت دے کر اس کا کان، آنکھ، جلد، گوشت اور ہڈی بناتا ہے پھر کہتا ہے: بدبخت یا نیک، اور اس کا عمل لکھتا ہے۔'
