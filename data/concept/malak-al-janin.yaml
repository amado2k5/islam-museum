id: concept/malak-al-janin
class: concept
kind: angel
label:
  ar: ملك الجنين
  en: The Angel of the Fetus
  ur: جنین کا فرشتہ
  es: "El ángel del feto"
  fr: "L'ange du fœtus"
  tr: "Fetal King"
  id: "Raja Janin"
summary:
  ar: 'ملك موكل بتكوين الجنين في بطن أمه، يذكره الحديث في حديث النطفة في الصحيحين: إذا مضت أربعون يوماً بعث الله إليه ملكاً فيصيّره ويخلق سمعه
    وبصره وجلده ولحمه وعظامه، ثم يقول: يا شقي يا سعيد، فيكتب عمله.'
  en: 'An angel charged with fashioning the fetus in its mother''s womb, described in the hadith of the nutfa in the Two Sahihs: after forty days
    God sends an angel who shapes him and creates his hearing, sight, skin, flesh and bones, then says ''wretched or happy'' and writes down his
    deeds.'
  ur: 'وہ فرشتہ جو ماں کے پیٹ میں جنین کی تخلیق کا مکلف ہے، جس کا ذکر صحیحین کی نطفہ والی حدیث میں ہے: چالیس دن گزرنے پر خدا اس کے پاس فرشتہ بھیجتا
    ہے جو اسے صورت دے کر اس کا کان، آنکھ، جلد، گوشت اور ہڈی بناتا ہے پھر کہتا ہے: بدبخت یا نیک، اور اس کا عمل لکھتا ہے۔'
  es: "Un ángel encargado de dar forma al feto en el vientre de su madre, descrito en el hadiz de la nutfa en los Dos Sahihs: después de cuarenta días, Dios envía un ángel que lo moldea y crea su oído, vista, piel, carne y huesos, luego dice 'desdichado o feliz' y escribe sus obras."
  fr: "Un ange chargé de façonner le fœtus dans le ventre de sa mère, décrit dans le hadith de la nutfa dans les deux Sahihs: après quarante jours, Dieu envoie un ange qui le façonne et crée son ouïe, sa vue, sa peau, sa chair et ses os, puis dit « malheureux ou heureux » et écrit ses actes."
  tr: "Bir kral, fetüsü annesinin rahminde şekillendirmekle görevlendirilmiştir. Hadis, iki Sahih'teki sperm hadisinde ondan bahseder: Kırk gün geçtikten sonra Tanrı ona bir melek gönderir, işitmesini, görüşünü, derisini, etini ve kemiklerini yaratır, sonra der ki: Ey zavallı, ey Sa'id, ve yaptıklarını kaydeder."
  id: "Seorang raja yang dipercayakan untuk membentuk janin di dalam rahim ibunya. Hadits menyebutkannya dalam hadis sperma di dua Sahih: Ketika empat puluh hari berlalu, Allah mengukirnya seorang malaikat untuk membentuk dirinya, menciptakan pendengaran, penglihatan, kulit, daging, dan tulangnya, lalu Dia berkata: Wahai yang malang, wahai Sa'id, dan dia mencatat perbuatannya."
