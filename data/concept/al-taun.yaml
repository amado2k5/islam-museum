id: concept/al-taun
class: concept
kind: belief
label:
  ar: الطاعون
  en: The plague (ta'un)
  ur: طاعون
summary:
  ar: "يروي البخاري ومسلم وصف الطاعون بأنه رجز وعذاب أرسله الله على من شاء من عباده، وجعله رحمة للمؤمنين: فمن سمع به بأرض فلا يدخلها ومن كان بها فلا يخرج منها هربًا، ومن مات به صبرًا محتسبًا فله أجر الشهيد {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "Sahih al-Bukhari and Sahih Muslim report the plague described as a torment God sent upon whom He willed and made a mercy for believers: who hears of it in a land does not enter, who is in it does not flee, and who dies of it patient and hoping for reward has a martyr's wage {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "بخاری اور مسلم طاعون کے بارے میں روایت کرتے ہیں کہ وہ رجز اور عذاب ہے جسے اللہ اپنے بندوں میں سے جس پر چاہتا ہے بھیجتا ہے، اور اس نے اسے مومنوں کے لیے رحمت بنایا: جو کسی سرزمین میں اس کی خبر سنے وہ وہاں داخل نہ ہو، اور جو وہاں ہو وہ بھاگ کر وہاں سے نہ نکلے، اور جو اس سے صبر اور ثواب کی نیت سے مرے اس کے لیے شہید کا اجر ہے {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
