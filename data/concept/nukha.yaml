id: concept/nukha
class: concept
kind: legal
label: { ar: "النُّخَاع", en: "The spinal marrow (nukha')", ur: "نخاع ⁦(ریڑھ کی ہڈی کا گودا)⁩", es: "La médula espinal (nukha')", fr: "La moelle épinière (nukha')", tr: "Kemik iliği", id: "Sumsum tulang" }
summary:
  ar: "النخاع في اللغة عرق أبيض داخل العنق ينقاد في فقار الصلب حتى عجب الذنب، والمخ يطلق على الدماغ وعلى ما في العظم، والنخاع أخص من المخ، والفقرة وعاؤه. ورد النهي عن نخع الشاة عند الذبح، وهو بلوغ السكين في الذبح النخاع، واختلف الفقهاء في حكمه، وتفصيله في الذبائح. وذكر الفقهاء في الشجاج ما يصل إلى النخاع كالهاشمة والمنقلة، وبينوا حكمه في الديات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15546}"
  en: "Nukha', in the lexicon, is the white vein inside the neck running along the spine to the coccyx; mukh is the brain or marrow, and nukha' is narrower; faqra is the vertebra that holds it. A prohibition on nakh' (cutting the spinal cord) in slaughter is related on the authority of Ibn Abbas, which al-Bayhaqi judged weak, and the jurists differ on its ruling; the detail is under slaughter. The jurists also treat head wounds that reach the spinal cord, such as the hashima and the munaqqila, and give their rulings under diyya (blood money). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15546}"
  ur: "نخاع گردن کے اندر کی سفید رگ ہے جو ریڑھ کی ہڈی کے ساتھ دم تک جاتی ہے۔ ذبح کے وقت نخع ⁦(ریڑھ کی ہڈی کو کاٹنا)⁩ کی ممانعت آئی ہے۔ سر کے زخموں میں ہاشمہ اور منقلہ کے احکام دیت کے ضمن میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15546}"
  es: "Nukha', en el léxico, es la vena blanca dentro del cuello que recorre la columna vertebral hasta el coxis; mukh es el cerebro o médula, y nukha' es más estrecha; faqra es la vértebra que lo sostiene. La prohibición de nakh' (cortar la médula espinal) en el sacrificio se relata según la autoridad de Ibn Abbas, que al-Bayhaqi consideró débil, y los juristas difieren en su dictamen; los detalles se encuentran en el apartado de sacrificio. Los juristas también tratan las heridas en la cabeza que alcanzan la médula espinal, como la hashima y la munaqqila, y emiten sus dictámenes en el apartado de diyya (indemnización por derramamiento de sangre). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15546}"
  fr: "Dans le lexique, « nukha' » désigne la veine blanche située à l'intérieur du cou, longeant la colonne vertébrale jusqu'au coccyx; « mukh » désigne le cerveau ou la moelle épinière, et « nukha' » est plus étroit; « faqra » désigne la vertèbre qui le soutient. L'interdiction de « nakh' » (sectionner la moelle épinière) lors de l'abattage est rapportée d'après Ibn Abbas, une autorité jugée faible par al-Bayhaqi, et les juristes divergent quant à son application; le détail est exposé dans la section consacrée à l'abattage. Les juristes traitent également des blessures à la tête atteignant la moelle épinière, telles que la « hashima » et la « munaqqila », et donnent leurs avis dans la section consacrée à la « diyya » (prix du sang). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15546}"
  tr: "Dilbilimde ilik, boynun içinde yer alan ve omurilik boyunca akan beyaz bir damardır ve kuyruğu şişer. Beyin beyne ve kemikteki şeylere atıfta bulunur, ancak ilik beyinden daha özgüldür ve omurga onun damarıdır. Kesim sırasında koyun iliğine getirilen yasak, bıçağın kesim sırasında iliğe ulaşmasıdır. Hukukçular, kesim sırasında iliğin kararı ve ayrıntıları konusunda farklı görüşlere sahiptir. Hukukçular, şajajda iliğe ulaşan şeyleri, örneğin haşima ve muqalahı, belirtmiş ve kan parasıyla ilgili kararını açıklamışlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15546}"
  id: "Dalam linguistik, sumsum adalah pembuluh darah putih di dalam leher yang mengalir melalui sumsum tulang belakang hingga ekornya bengkak. Otak merujuk pada otak dan apa yang ada di dalam tulang, tetapi sumsum lebih spesifik daripada otak, dan tulang belakang adalah pembuluh darahnya. Larangan terhadap sumsum domba pada saat penyembelihan adalah pisau mencapai sumsum selama penyembelihan. Para ahli hukum berbeda pendapat mengenai keputusannya dan rincian mengenai hewan yang disembelih. Para ahli hukum menyebutkan apa yang sampai ke sumsum dalam shajaj, seperti hashimah dan muqalah, serta menjelaskan keputusannya mengenai uang darah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15546}"
