id: concept/nukha
class: concept
kind: legal
label: { ar: "النُّخَاع", en: "The spinal marrow (nukha')", ur: "نخاع (ریڑھ کی ہڈی کا گودا)" }
summary:
  ar: "النخاع في اللغة عرق أبيض داخل العنق ينقاد في فقار الصلب حتى عجب الذنب، والمخ يطلق على الدماغ وعلى ما في العظم، والنخاع أخص من المخ، والفقرة وعاؤه. ورد النهي عن نخع الشاة عند الذبح، وهو بلوغ السكين في الذبح النخاع، واختلف الفقهاء في حكمه، وتفصيله في الذبائح. وذكر الفقهاء في الشجاج ما يصل إلى النخاع كالهاشمة والمنقلة، وبينوا حكمه في الديات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15546}"
  en: "Nukha', in the lexicon, is the white vein inside the neck running along the spine to the coccyx; mukh is the brain or marrow, and nukha' is narrower; faqra is the vertebra that holds it. A prohibition on nakh' (cutting the spinal cord) in slaughter is related on the authority of Ibn Abbas, which al-Bayhaqi judged weak, and the jurists differ on its ruling; the detail is under slaughter. The jurists also treat head wounds that reach the spinal cord, such as the hashima and the munaqqila, and give their rulings under diyya (blood money). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15546}"
  ur: "نخاع گردن کے اندر کی سفید رگ ہے جو ریڑھ کی ہڈی کے ساتھ دم تک جاتی ہے۔ ذبح کے وقت نخع (ریڑھ کی ہڈی کو کاٹنا) کی ممانعت آئی ہے۔ سر کے زخموں میں ہاشمہ اور منقلہ کے احکام دیت کے ضمن میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15546}"
