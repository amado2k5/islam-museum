label:
  ar: "من"
  en: "Mann (manna, the sweet dew)"
  ur: "منّ"
  es: "Maná (el dulce rocío)"
  fr: "Mann (manne, la douce rosée)"
summary:
  ar: "المن طل يقع على حجر أو شجر فيحلو وينعقد عسلاً ويجف جفاف المصموغ، مثل الترنجبين والشيرخشك والعسل المجلوب من جبال قصران بالري، ويأخذ من طبيعة ما يسقط عليه قوة {cite:canon-ibn-sina-print-v1 p.570}."
  en: "Mann is a dew that falls on stone or tree, turns sweet and sets as honey and dries like a gum, like taranjabin, shir khishk and the honey brought from the mountains of Qasran at Rayy, and takes a force from the nature of what it falls on {cite:canon-ibn-sina-print-v1 p.570}."
  ur: "منّ ایک شبنم ہے جو پتھر یا درخت پر گرتی ہے، میٹھی ہو کر شہد کی طرح جم جاتی ہے اور گوند کی طرح سوکھتی ہے، جیسے ترنجبین، شیر خشک اور رَے میں قصران کے پہاڑوں سے لایا جانے والا شہد، اور جس چیز پر گرے اس کی طبیعت سے ایک قوت لیتی ہے {cite:canon-ibn-sina-print-v1 p.570}۔"
  es: "El maná es un rocío que cae sobre una piedra o un árbol, se vuelve dulce y se solidifica como la miel y se seca como una goma, como el taranjabin, el shir khishk y la miel traída de las montañas de Qasran en Rayy, y toma una fuerza de la naturaleza de aquello sobre lo que cae {cite:canon-ibn-sina-print-v1 p.570}."
  fr: "Mann est une rosée qui tombe sur la pierre ou l'arbre, devient sucrée et se transforme en miel et sèche comme une gomme, comme le taranjabin, le shir khishk et le miel apporté des montagnes de Qasran à Rayy, et tire une force de la nature de ce sur quoi elle tombe {cite:canon-ibn-sina-print-v1 p.570}."
