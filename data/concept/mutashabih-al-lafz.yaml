id: concept/mutashabih-al-lafz
class: concept
kind: discipline
label:
  ar: "المتشابه اللفظي في القرآن"
  en: "Verbal similarity in the Qur'an (al-mutashabih al-lafzi)"
  ur: "قرآن میں لفظی متشابہ"
summary:
  ar: "علم يتناول إيراد القصة الواحدة في صور شتى وفواصل مختلفة، وهو النوع الخامس عند الزركشي باسم «علم المتشابه»، غير المتشابه المقابل للمحكم؛ صنف فيه السخاوي نظمًا، والكرماني، والرازي في «درة التأويل»، وأبو جعفر بن الزبير في «ملاك التأويل»."
  en: "The study of how one story is given in different forms and with different verse-endings; al-Zarkashi's fifth type, which he calls 'the science of the mutashabih', distinct from the ambiguous as opposed to the clear. Al-Sakhawi versified it; al-Kirmani, al-Razi in Durrat al-Ta'wil and Abu Ja'far ibn al-Zubayr in Milak al-Ta'wil wrote on its explanation."
  ur: "وہ علم جو ایک ہی قصے کو مختلف صورتوں اور مختلف فواصل میں لانے سے بحث کرتا ہے؛ زرکشی کی پانچویں نوع جسے وہ «علم المتشابہ» کہتے ہیں، جو محکم کے مقابل متشابہ سے الگ ہے۔ سخاوی نے اسے نظم کیا؛ کرمانی، «درۃ التاویل» میں رازی، اور «ملاک التاویل» میں ابو جعفر بن الزبیر نے اس کی توجیہ پر لکھا۔"
