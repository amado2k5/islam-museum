id: concept/canon-smell-of-urine
class: concept
kind: scientific
label: { ar: "رائحة البول عند ابن سينا", en: "The smell of urine in the Canon", ur: "پیشاب کی بو قانون میں", es: "El olor a orina en el cañón", fr: "L'odeur d'urine dans le Canon" }
summary:
  ar: "في الفصل الرابع يبين ابن سينا أن البول الذي لا رائحة له يدل على برد وفجاجة وربما موت الغريزة، وأن النتن يدل بحسب سياقه على قروح أو عفونة، والحلاوة على الدم، والنتن الشديد على الصفراء، والنتن الحامض على السوداء {cite:canon-ibn-sina-print-v1 p.192}."
  en: "In the fourth chapter Ibn Sina says urine with no smell shows cold and rawness, perhaps the death of the innate heat, that stench shows sores or putrefaction by its setting, sweetness shows blood, strong stench bile and sour stench black bile {cite:canon-ibn-sina-print-v1 p.192}."
  es: "En el cuarto capítulo, Ibn Sina dice que la orina sin olor muestra frío y crudeza, tal vez la muerte del calor innato, que el hedor muestra llagas o putrefacción por su entorno, la dulzura muestra sangre, el hedor fuerte bilis y el hedor agrio bilis negra {cite:canon-ibn-sina-print-v1 p.192}."
  fr: "Dans le quatrième chapitre, Ibn Sina dit que l'urine sans odeur indique le froid et la crudité, peut-être la mort de la chaleur innée, que la puanteur indique des plaies ou la putréfaction selon son état, la douceur indique le sang, la forte puanteur la bile et la puanteur aigre la bile noire {cite:canon-ibn-sina-print-v1 p.192}."
  ur: "چوتھے باب میں ابن سینا کہتے ہیں کہ بغیر بو کے پیشاب ٹھنڈا اور کچا پن ظاہر کرتا ہے، شاید پیدائشی گرمی کی موت، کہ بدبو اپنی ترتیب سے زخم یا پھٹنے کو ظاہر کرتی ہے، مٹھاس خون، تیز بدبودار پت اور کھٹی بدبو سیاہ پت کو ظاہر کرتی ہے۔"
