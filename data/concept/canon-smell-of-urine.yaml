label: { ar: "رائحة البول عند ابن سينا", en: "The smell of urine in the Canon", ur: "پیشاب کی بو قانون میں" }
summary:
  ar: "في الفصل الرابع يبين ابن سينا أن البول الذي لا رائحة له يدل على برد وفجاجة وربما موت الغريزة، وأن النتن يدل بحسب سياقه على قروح أو عفونة، والحلاوة على الدم، والنتن الشديد على الصفراء، والنتن الحامض على السوداء {cite:canon-ibn-sina-print-v1 p.192}."
  en: "In the fourth chapter Ibn Sina says urine with no smell shows cold and rawness, perhaps the death of the innate heat, that stench shows sores or putrefaction by its setting, sweetness shows blood, strong stench bile and sour stench black bile {cite:canon-ibn-sina-print-v1 p.192}."
