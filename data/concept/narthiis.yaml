  fr: "Narthiis (un médicament non identifié)"
summary:
  ar: "نرثيعس في الكتاب دواء حار في جوفه شحم أخضر قباض، ومع الزيت يدر العرق، ينفخ منه في المنخرين فيقطع الرعاف، ولبه الرطب ينفث الدم المجتمع في الصدر، ولبه يمنع الإسهال المزمن، وهو نافع لنهش الأفعى. والاسم كما يقرأ في صورة الصفحة غير محدد النبات."
  en: "Narthiis is in the book a hot drug with a green, astringent fat in its interior, which with oil provokes sweat; blown into the nostrils it cuts nosebleed, its fresh pith brings up the blood gathered in the chest and its pith stops long-standing diarrhoea, and it helps the bite of the viper. The name is as read from the page image and the plant is not identified."
  ur: "نرثیعس کتاب میں ایک گرم دوا ہے جس کے اندر سبز قابض چربی ہے اور تیل کے ساتھ پسینہ لاتی ہے؛ ناک میں پھونکنے سے نکسیر روکتی ہے، اس کا تازہ گودا سینے میں جمع خون کو تھوکوا دیتا ہے اور پرانا اسہال روکتا ہے، اور سانپ کے ڈسنے میں مفید ہے۔ نام صفحے کی تصویر سے پڑھا گیا ہے اور پودا متعین نہیں۔"
  es: "En el libro, la narcisa es una droga potente con una grasa verde y astringente en su interior que, mezclada con aceite, provoca sudoración; soplada en las fosas nasales detiene las hemorragias nasales, su médula fresca ayuda a expulsar la sangre acumulada en el pecho y detiene la diarrea crónica, además de aliviar la picadura de víbora. El nombre aparece tal como se lee en la imagen de la página y la planta no está identificada."
  fr: "Le narthis est décrit dans le livre comme une plante médicinale aux propriétés astringentes, contenant une graisse verte qui, mélangée à de l'huile, provoque la transpiration; insufflée dans les narines, elle arrête les saignements de nez, sa moelle fraîche favorise la remontée du sang accumulé dans la poitrine et stoppe les diarrhées chroniques, et elle soulage la morsure de la vipère. Le nom est tel qu'il figure sur l'image de la page, et la plante n'est pas identifiée."
