id: concept/al-litha-al-damiya
class: concept
kind: scientific
label:
  ar: اللثة الدامية
  en: The bleeding gum
  ur: خونی مسوڑھا
summary:
  ar: للثة الدامية ينفع ما وصف من المحرق المطفأ بالخل مضروباً بالملح وما ينثر عليه من هذا الجنس وأيضاً ما يحرق من طريخ مملوح ⁦(وهو عند المحقق نوع من الأسماك، محمول كما سماه الكتاب)⁩ إلى أن يصير كالجمر ويؤخذ من رماده مع ما وصف ويخلط ويستعمل ⁦(الأسماء والمقادير مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.281}
  en: For the bleeding gum, what he described of the vinegar-quenched burnt thing beaten with salt helps, and what is sprinkled on it of this kind; also the ash of a burnt salted tariikh (the editor glosses it a kind of fish, carried as the book names it) burnt to ember and taken with what he described, mixed and used (the names and measures left out) {cite:canon-ibn-sina-print-v2 p.281}
  ur: 'خونی مسوڑھے میں اس کی بیان کردہ سرکے میں بجھائی جلائی چیز نمک کے ساتھ کٹی ہوئی سودا کرتی ہے اور اسی جنس کی چھڑکی جانے والی چیز؛ اور بھی ایک نمکین طریخ ⁦(محقق: ایک قسم کی مچھلی، کتاب کے نام پر محمول)⁩ جلائی جاتی ہے یہاں تک کہ انگارہ ہو اور اس کی رخ اس کے بیان کردہ کے ساتھ لی جائے اور ملا کر استعمال ہو ⁦(نام اور مقداریں مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.281}'
