id: concept/ism-al-ab-fi-al-quran
class: concept
kind: doctrine
label:
  ar: "إطلاق «الأب» على الجد والعم"
  en: "The word 'father' for grandfather and uncle"
summary:
  ar: "يرى الشعراوي أن لفظ «الأب» في القرآن يُطلق على الجد وعلى العم، ويستدل بعدّ إبراهيم وإسماعيل وإسحاق آباءً ليعقوب وبنيه، ويقرأ الآية التي فيها اسم آزر على أن المراد العم، [[passage/quran-6-74|الآية 74 من الأنعام]]. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.597}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.598}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.599}"
  en: "Sha'rawi holds that the Qur'an uses the word 'father' for a grandfather and for an uncle. He cites Abraham, Isma'il and Isaac, all named as fathers of Jacob's sons, and reads the verse that names Azar (6:74) as meaning Abraham's uncle {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.597}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.598}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.599}."
wings: [ideas]
themes: [creed, prophets]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "هل يُطلق لفظ «الأب» في القرآن على الجد والعم، وكيف يؤثر ذلك في فهم نسب إبراهيم ومكانة آزر؟"
  en: "Does the Qur'an use the word 'father' for grandfather and uncle, and how does that bear on Abraham's descent and Azar's place?"
perspectives:
  - tradition: sunni
    id: sharawi-father-uncle
    stance:
      ar: "لفظ الأب يتسع للجد والعم، وآزر في النص عم إبراهيم"
      en: "The word 'father' extends to grandfather and uncle, and Azar in the text is Abraham's uncle"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن إطلاق الأب على الجد والعم ظاهر في عطف الآباء على إبراهيم وإسماعيل وإسحاق في قول أبناء يعقوب، وأن الآية التي فيها اسم آزر يُفهم منها العم. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.598}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.599}"
      en: "Sha'rawi says the use of 'father' for grandfather and uncle is clear in the way Jacob's sons name Abraham, Isma'il and Isaac together as their fathers, and that the verse naming Azar is to be read as meaning the uncle {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.598}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.599}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-other-readings
    stance:
      ar: "أقوال غير الشعراوي في نسب آزر لم تُدخل من مصدر مراجَع في هذه الدفعة"
      en: "Other exegetes' readings of Azar's relation to Abraham are not entered from a checked source in this batch"
    holders: []
    summary:
      ar: "لم يُدخل هنا ما يذكره غيره من المفسرين والمؤرخين في نسب آزر، ولا الرأي الأكاديمي، ولا الآراء الأخرى، لأن الصفحات لا تنقلها. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.599}"
      en: "What other exegetes and historians say about Azar's relation to Abraham, the academic view and other views are not entered, since these pages do not report them {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.599}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
