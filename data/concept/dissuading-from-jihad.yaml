label:
  ar: "التخذيل"
  en: "Dissuading others from fighting"
  ur: "جہاد سے روکنا (تخذیل)"
summary:
  ar: "التخذيل لغة حمل الرجل على خذلان صاحبه وتثبيطه عن نصرته، واصطلاحا صد الناس عن الغزو وتزهيدهم في الخروج إليه. ويحرم تخذيل المجاهدين بكل وسيلة من قول أو فعل، ويمنع الأمير من أن يصحب معه مخذِّلا أو مرجفا، ولا يُسهم لمن يخرج معه من هؤلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4810}"
  en: "In language, takhdhil means to make someone let down a companion and hold back from helping him; as a term it means turning people away from raiding and making them indifferent to going out. Dissuading the fighters is forbidden by any means, speech or act. A commander should not take a dissuader or a rumour-spreader with him, and such a person gets no share of the spoils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4810}"
