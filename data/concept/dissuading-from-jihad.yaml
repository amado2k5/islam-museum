id: concept/dissuading-from-jihad
class: concept
kind: legal
label:
  ar: "التخذيل"
  en: "Dissuading others from fighting"
  ur: "جہاد سے روکنا ⁦(تخذیل)⁩"
  es: "Disuadir a otros de luchar"
  fr: "Dissuader les autres de se battre"
summary:
  ar: "التخذيل لغة حمل الرجل على خذلان صاحبه وتثبيطه عن نصرته، واصطلاحا صد الناس عن الغزو وتزهيدهم في الخروج إليه. ويحرم تخذيل المجاهدين بكل وسيلة من قول أو فعل، ويمنع الأمير من أن يصحب معه مخذِّلا أو مرجفا، ولا يُسهم لمن يخرج معه من هؤلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4810}"
  en: "In language, takhdhil means to make someone let down a companion and hold back from helping him; as a term it means turning people away from raiding and making them indifferent to going out. Dissuading the fighters is forbidden by any means, speech or act. A commander should not take a dissuader or a rumour-spreader with him, and such a person gets no share of the spoils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4810}"
  es: "En lenguaje, takhdhil significa hacer que alguien abandone a un compañero y se abstenga de ayudarlo; como término, significa alejar a la gente de las incursiones y hacerla indiferente a salir. Disuadir a los combatientes está prohibido por cualquier medio, palabra o acto. Un comandante no debe llevar consigo a un disuasor o a un propagador de rumores, y dicha persona no recibe parte del botín. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4810}"
  fr: "En langage, « takhdhil » signifie dissuader quelqu'un de soutenir un compagnon et de l'aider; en tant que terme, il désigne le fait de détourner les gens des raids et de les rendre indifférents à l'idée de partir en expédition. Il est interdit de dissuader les combattants par quelque moyen que ce soit, parole ou acte. Un commandant ne doit pas emmener avec lui un dissuasif ou un colporteur de rumeurs, et une telle personne ne reçoit aucune part du butin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4810}"
  ur: "زبان میں تقدیل کا مطلب ہے کسی کو ساتھی بنانا اور اس کی مدد سے باز رکھنا۔ ایک اصطلاح کے طور پر اس کا مطلب ہے لوگوں کو چھاپہ مارنے سے روکنا اور انہیں باہر جانے سے لاتعلق کرنا۔ جنگجوؤں کو منتشر کرنا کسی بھی طرح، تقریر یا عمل سے منع ہے۔ کسی کمانڈر کو اپنے ساتھ افواہ پھیلانے والے یا افواہ پھیلانے والے کو ساتھ نہیں لینا چاہیے اور ایسے شخص کو مال غنیمت میں سے کوئی حصہ نہیں ملتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4809}"
