id: concept/al-arabiyya-fi-al-andalus-wa-siqilliyya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-origins]
label:
  ar: "العربية في الأندلس وصقلية"
  en: "Arabic in al-Andalus and Sicily"
  ur: "اندلس اور صقلیہ میں عربی"
  fr: "L'arabe en al-Andalus et en Sicile"
  es: "El árabe en al-Ándalus y Sicilia"
summary:
  ar: "ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في أقصى غربي العالم الإسلامي المتوسطي: الأندلس منذ سنة 711، وصقلية منذ سنة 827، ومالطة التي بقيت وحدها تحمل سليلة العربية الصقلية في المالطية. وتتبع الصفحة نهاية العربية في إسبانيا بعد 1492 ثم بالبراغماتيكا سانسيون سنة 1567 ثم بطرد الموريسكيين بين 1609 و1614، وقرارات ملوك صقلية الذين أسقطوا العربية من الحكم سنة 1198. ولم يفتح المتحف الصفحات المسمّاة، وقد أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026."
  en: "What a research summary supplied to the museum says about Arabic at the western edge of the Mediterranean Islamic world: al-Andalus from 711, Sicily from 827, and Malta, which alone carries a descendant of Siculo-Arabic in Maltese. The page follows the end of Arabic in Spain after 1492, then with the Pragmática Sanción of 1567, then with the expulsion of the Moriscos between 1609 and 1614, and the decisions of the rulers of Sicily who dropped Arabic from government in 1198. The museum did not open the pages named, and the founder approved using the summary on 21 November 2026."
  ur: "ایک تحقیقی خلاصہ، جو متحف کو فراہم کیا گیا، بحیرۂ روم کی اسلامی دنیا کے مغربی کنارے پر عربی کے بارے میں کیا کہتا ہے: 711 سے اندلس، 827 سے صقلیہ، اور مالٹا جو اکیلا صقلی عربی کی ایک اولاد مالٹی میں اٹھائے ہوئے ہے۔ صفحہ 1492 کے بعد ہسپانیہ میں عربی کے خاتمے کا سراغ لگاتا ہے، پھر 1567 کے پراگمیٹیکا سانسیون سے، پھر 1609 اور 1614 کے درمیان موریسکوں کے اخراج سے، اور ان صقلی حکمرانوں کے فیصلوں سے جنہوں نے 1198 میں حکومت سے عربی ہٹا دی۔ متحف نے نامزد صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کے استعمال کی منظوری دی۔"
  fr: "Ce que dit un résumé de recherche remis au musée sur l'arabe à l'extrémité occidentale du monde islamique méditerranéen : al-Andalus dès 711, la Sicile dès 827, et Malte, qui seule porte dans le maltais un descendant de l'arabo-sicilien. La page suit la fin de l'arabe en Espagne après 1492, puis avec la Pragmática Sanción de 1567, puis avec l'expulsion des Morisques entre 1609 et 1614, et les décisions des souverains de Sicile qui ont retiré l'arabe du gouvernement en 1198. Le musée n'a pas ouvert les pages nommées, et le fondateur a approuvé l'usage du résumé le 21 novembre 2026."
  es: "Lo que dice un resumen de investigación entregado al museo sobre el árabe en el extremo occidental del mundo islámico mediterráneo: al-Ándalus desde 711, Sicilia desde 827, y Malta, que sola lleva en el maltés un descendiente del sículo-árabe. La página sigue el fin del árabe en España tras 1492, luego con la Pragmática Sanción de 1567, luego con la expulsión de los moriscos entre 1609 y 1614, y las decisiones de los gobernantes de Sicilia que retiraron el árabe del gobierno en 1198. El museo no abrió las páginas nombradas, y el fundador aprobó usar el resumen el 21 de noviembre de 2026."
