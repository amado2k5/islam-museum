id: concept/adl
class: concept
kind: legal
label:
  ar: "العَدْل"
  en: "Justice and uprightness (adl)"
  fr: "Justice et probité (adl)"
  ur: "عدل"
  es: "Justicia y rectitud (adl)"
  tr: "Adalet"
  id: "Adalet"
summary:
  ar: "العدل في اللغة خلاف الجور، وهو القصد في الأمور والمتوسط بين طرفي الإفراط والتفريط، والعدالة صفة توجب الاحتراز عما يخل بالمروءة. والعدل في اصطلاح الفقهاء من تكون حسناته غالبة على سيئاته، وهو ذو المروءة غير المتهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11512}. وتتعلق بالعدالة شروط في أبواب كثيرة: إمامة الصلاة، وعامل الزكاة، ورؤية هلال رمضان، والقبلة، وطهارة الماء ونجاسته، وولاية النكاح، والوصاية، ونظارة الوقف، وولاية الصغير، والإمامة العظمى، والقضاء والشهادة ورواية الحديث، فضلاً عن العدل في الحكم وبين الزوجات والأولاد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}."
  en: "Linguistically, adl is the opposite of injustice: it means aiming at what is right and standing between excess and deficiency, and adala is the quality that keeps a person away from what damages manliness. In the jurists' usage, an adl is one whose good deeds outweigh his bad ones, a person of good standing who is not open to suspicion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11512}. Uprightness is a condition in many chapters: leading the prayer, the zakat collector, sighting the crescent of Ramadan, the qibla, the purity or impurity of water, the marriage guardian, the executor, the trustee of an endowment, the guardian of a minor, the supreme imamate, judgeship and testimony and the transmission of hadith, besides justice in judgement and between wives and children {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}."
  fr: "Dans la langue, adl est le contraire de l’injustice : il s’agit de tendre vers ce qui est juste, à égale distance de l’excès et du défaut. L’adala est la qualité qui détourne une personne de ce qui porte atteinte à sa dignité. Dans l’usage des juristes, un adl est une personne dont les bonnes actions l’emportent sur les mauvaises, qui jouit d’une bonne réputation et n’est pas sujette à suspicion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11512}. La probité est une condition dans de nombreux chapitres : la direction de la prière, le collecteur de la zakat, l’observation du croissant du ramadan, la qibla, la pureté ou l’impureté de l’eau, le tuteur matrimonial, l’exécuteur testamentaire, l’administrateur d’une fondation pieuse, le tuteur d’un mineur, l’imamat suprême, la fonction de juge, le témoignage et la transmission du hadith. S’y ajoutent la justice dans les jugements et l’équité entre épouses et entre enfants {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}."
  es: "Lingüísticamente, adl es lo opuesto a injusticia: significa aspirar a lo correcto y situarse entre el exceso y la deficiencia, y adala es la cualidad que aleja a una persona de lo que daña la virilidad. En el uso de los juristas, un adl es aquel cuyas buenas acciones superan a las malas, una persona de buena reputación que no despierta sospechas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11512}. La rectitud es una condición en muchos capítulos: dirigir la oración, el recaudador de zakat, la observación de la luna creciente de Ramadán, la qibla, la pureza o impureza del agua, el tutor del matrimonio, el albacea, el fideicomisario de una dotación, el tutor de un menor, el imamato supremo, el poder judicial y el testimonio y la transmisión de hadices, además de la justicia en el juicio y entre esposas e hijos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}."
  ur: "لسانی اعتبار سے عدل ناانصافی کے متضاد ہے: اس کا مطلب ہے حق کو نشانہ بنانا اور زیادتی اور کمی کے درمیان کھڑا ہونا، اور عدل وہ خوبی ہے جو انسان کو اس چیز سے دور رکھتی ہے جو مردانگی کو نقصان پہنچاتی ہے۔ فقہاء کے استعمال میں، عادل وہ ہے جس کی نیکیاں اس کی برائیوں سے زیادہ ہوں، وہ شخص جس کے بارے میں کوئی شبہ نہ ہو۔ صراط مستقیم کئی ابواب میں شرط ہے: نماز کی امامت، زکوٰۃ جمع کرنے والا، رمضان کا چاند دیکھنا، قبلہ رخ، پانی کی پاکیزگی یا نجاست، نکاح کرنے والا، عمل کرنے والا، اوقاف کا امانت دار، نابالغ کا ولی، اعلیٰ امامت، عدل و انصاف اور عدل و انصاف کے درمیان عدل و انصاف کا حکم۔ بیویاں اور بچے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11513}"
  tr: "Dilde adalet, adaletsizliğin tam tersidir; konularda niyettir ve aşırılık ile ihmal arasında orta yoldur. Adalet, şövalyeliği baltalayan şeylere karşı dikkatli olunmasını gerektiren bir niteliktir. Fıkıh terminolojisinde, adalet, iyi davranışları kötü davranışlarından ağır basan ve şövalyelik suçlamasıydı {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11512}. Adalet birçok koşulu içerir: namazları yönetmek, zekat etmek, Ramazan hilalini görmek, kıble, suyun saflığı ve kirliliği, evliliğin vesayeti, vesayet, bağışların gözetilmesi, küçüklerin vesayeti, küçüklerin üstünlüğü, büyük imatimlik, yargı, tanıklık ve hadislerin rivayeti, ayrıca yargıda ve eşler ile çocuklar arasında adalet {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11521}."
  id: "Dalam bahasa, keadilan adalah kebalikan dari ketidakadilan; keadilan adalah niat dalam urusan dan jalan tengah antara kelebihan dan pengabaian. Keadilan adalah kualitas yang membutuhkan kehati-hatian terhadap hal-hal yang merusak kesatria. Dalam terminologi kehakiman, keadilan adalah tuduhan kesatria, di mana perilaku baik lebih penting daripada perilaku buruk {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11512}. Keadilan mencakup banyak syarat: memimpin shalat, memberikan zakat, melihat bulan sabit Ramadan, qibla, kemurnian dan kemurnian air, perwalian pernikahan, perwalian, pengawasan sumbangan, pengawasan anak-anak, keunggulan anak-anak, impatim besar, peradilan, kesaksian dan riwayat hadis, serta keadilan dalam peradilan dan antara pasangan dan anak {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11521}."
