id: concept/adl
class: concept
kind: legal
label:
  ar: "العَدْل"
  en: "Justice and uprightness (adl)"
  ur: "عدل"
summary:
  ar: "العدل في اللغة خلاف الجور، وهو القصد في الأمور والمتوسط بين طرفي الإفراط والتفريط، والعدالة صفة توجب الاحتراز عما يخل بالمروءة. والعدل في اصطلاح الفقهاء من تكون حسناته غالبة على سيئاته، وهو ذو المروءة غير المتهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11512}. وتتعلق بالعدالة شروط في أبواب كثيرة: إمامة الصلاة، وعامل الزكاة، ورؤية هلال رمضان، والقبلة، وطهارة الماء ونجاسته، وولاية النكاح، والوصاية، ونظارة الوقف، وولاية الصغير، والإمامة العظمى، والقضاء والشهادة ورواية الحديث، فضلاً عن العدل في الحكم وبين الزوجات والأولاد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}."
  en: "Linguistically, adl is the opposite of injustice: it means aiming at what is right and standing between excess and deficiency, and adala is the quality that keeps a person away from what damages manliness. In the jurists' usage, an adl is one whose good deeds outweigh his bad ones, a person of good standing who is not open to suspicion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11512}. Uprightness is a condition in many chapters: leading the prayer, the zakat collector, sighting the crescent of Ramadan, the qibla, the purity or impurity of water, the marriage guardian, the executor, the trustee of an endowment, the guardian of a minor, the supreme imamate, judgeship and testimony and the transmission of hadith, besides justice in judgement and between wives and children {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11513} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11521}."
