id: concept/ihtiqan
class: concept
kind: legal
label: { ar: "احتقان", en: "Retention and enema (ihtiqan)", es: "Retención y enema (ihtiqan)", fr: "Rétention et lavement (ihtiqan)", ur: "برقراری اور انیما ⁦(احتیاق)⁩", tr: "Tıkanıklık", id: "Kemacetan" }
summary:
  ar: "الاحتقان لغة احتباس البول، وحقنت المريض أوصلت الدواء إلى باطنه بالمحقن، وهو في الشرع احتباس البول وتعاطي الدواء بالحقنة في الدبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732} ولم يبطل الوضوء عند الحنفية والشافعية والحنابلة باحتقان البول، والحاقن يكره له أن يصلي وهو يدافع الأخبثين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1733} وقضاء الحاقن نافذ عند الجمهور قياساً على قضاء الغضبان، وخالف الحنابلة في رأي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1735} وفي الصيام يفطر الاحتقان في الدبر عند الجمهور، ومنهم من فرق في القبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1737}"
  en: "Ihtiqan in the lexicon is holding back urine; in law it is both holding back urine and taking medicine by enema through the rear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732} The Hanafis, Shafi'is and Hanbalis hold that holding back urine does not break ablution, although one who holds back is discouraged from praying. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1733} The judgement of a judge who is holding back is valid according to the majority, on the analogy of a judge who is angry; one Hanbali view invalidates it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1735} In fasting, enema through the rear breaks the fast according to the majority, while the view on the front passage differs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1737}"
  es: "Ihtiqan en el léxico significa retener la orina; en la ley, significa tanto retener la orina como tomar medicamentos por vía rectal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732} Los hanafíes, shafi'ís y hanbalíes sostienen que retener la orina no invalida la ablución, aunque quien la retiene se ve desaconsejado de rezar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1733} El juicio de un juez que retiene la orina es válido según la mayoría, por analogía con un juez enojado; una opinión hanbalí lo invalida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1735} En el ayuno, el enema por vía rectal invalida el ayuno según la mayoría, mientras que la opinión sobre la vía rectal difiere. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1736} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1737}"
  fr: "Le terme « ihtiqan » dans le lexique désigne la rétention d'urine; en droit, il englobe à la fois la rétention d'urine et l'administration de médicaments par lavement par voie rectale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732} Les écoles hanafite, chaféite et hanbalite considèrent que la rétention d'urine n'invalide pas les ablutions, bien que celui qui se retient soit dissuadé de prier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1733} Selon la majorité, le jugement d'un juge qui se retient est valide, par analogie avec un juge en colère; une opinion hanbalite l'invalide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1735} Pendant le jeûne, l'administration d'un lavement par voie rectale rompt le jeûne selon la majorité, tandis que l'avis diverge concernant l'administration par voie antérieure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1737}"
  ur: "لغت میں احتقان پیشاب کو روکنا؛ قانون میں یہ پیشاب کو روکنا اور انیما کے ذریعے عقب میں دوائی لینا دونوں ہے۔ حنفیہ، شافعی اور حنابلہ کا موقف ہے کہ پیشاب کو روکے رکھنے سے وضو نہیں ٹوٹتا، حالانکہ روکنے والا نماز پڑھنے سے منع کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1733} جو جج روکے ہوئے ہے اس کا فیصلہ جمہور کے مطابق جائز ہے، غصہ کرنے والے جج کی تشبیہ پر۔ حنبلی کا ایک قول اسے باطل کرتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1735} روزے میں عقبی حصے میں انیما لگانے سے روزہ ٹوٹ جاتا ہے جبکہ سامنے والے حصے کا منظر مختلف ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1736}"
  tr: "İdrar tutulması, idrar tutma dilidir ve hastaya enjeksiyon yapıldığında, ilaç enjektör aracılığıyla penisin içine ulaşır. İslam hukukunda idrar tutma ve ilacın anüse enjeksiyon yoluyla yapılması anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1732} Hanefiler, Şafiiler ve Hanbalilere göre wudu, idrar tıkanıklığı nedeniyle geçersiz sayılmaz; enjekte eden kötü insanlara karşı savunma yaparken namaz kılmaktan hoşlanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1733} Enjekte edenin yapısı, öfkeli kişinin orucuna kıyasla çoğunluğa göre geçerlidir ve Hanbalılar görüş ayrılığı gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1735} Oruçta, anüsteki tıkanıklık çoğunluk tarafından kırılır ve bazıları kıblede farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1737}"
  id: "Retensi urin adalah bahasa retensi urin, di mana suntikan pasien mengantarkan obat ke dalam penis melalui injektor. Dalam hukum Islam, ini berarti penahanan urin dan penggunaan obat dengan suntikan di anus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1732} Wudu tidak dibatalkan menurut Hanafi, Shafi'i, dan Hanbal karena kemacetan saluran kemih, dan penyuntir tidak suka berdoa saat membela diri dari orang jahat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1733} Komposisi penyuntik berlaku menurut mayoritas dibandingkan dengan puasa orang yang marah, dan Hanbalis berbeda pendapat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1735} Dalam puasa, kemacetan di anus dipecahkan oleh mayoritas, dan beberapa berbeda dalam qibla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1737}"
