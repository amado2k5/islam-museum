id: concept/ihtiqan
class: concept
kind: legal
label: { ar: "احتقان", en: "Retention and enema (ihtiqan)" }
summary:
  ar: "الاحتقان لغة احتباس البول، وحقنت المريض أوصلت الدواء إلى باطنه بالمحقن، وهو في الشرع احتباس البول وتعاطي الدواء بالحقنة في الدبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732} ولم يبطل الوضوء عند الحنفية والشافعية والحنابلة باحتقان البول، والحاقن يكره له أن يصلي وهو يدافع الأخبثين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1733} وقضاء الحاقن نافذ عند الجمهور قياساً على قضاء الغضبان، وخالف الحنابلة في رأي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1735} وفي الصيام يفطر الاحتقان في الدبر عند الجمهور، ومنهم من فرق في القبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1737}"
  en: "Ihtiqan in the lexicon is holding back urine; in law it is both holding back urine and taking medicine by enema through the rear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732} The Hanafis, Shafi'is and Hanbalis hold that holding back urine does not break ablution, although one who holds back is discouraged from praying. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1733} The judgement of a judge who is holding back is valid according to the majority, on the analogy of a judge who is angry; one Hanbali view invalidates it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1735} In fasting, enema through the rear breaks the fast according to the majority, while the view on the front passage differs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1736} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1737}"
