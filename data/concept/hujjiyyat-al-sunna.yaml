id: concept/hujjiyyat-al-sunna
class: concept
kind: term
label:
  ar: حجية السنة
  en: The authority of the Sunna (hujjiyyat al-sunna)
  es: "La autoridad de la Sunna (hujjiyyat al-sunna)"
  fr: "L'autorité de la Sunna (hujjiyyat al-sunna)"
  ur: "سنت کا اختیار ⁦( حجیت السنہ )⁩"
  tr: "Sünnetin otoritesi"
  id: "Otoritas Sunnah"
summary:
  ar: "السنة عند الأصوليين الأصل الثاني للأحكام بعد الكتاب، وطاعة النبي واجبة فيما أمر به ونهى عنه، والآيات في ذلك كثيرة، والعمل بها واجب، وعدّ المؤلف هذا مما اتفق عليه المسلمون في عهد النبي وبعده {cite:makanat-al-sunna-azhar p. 40}{cite:makanat-al-sunna-azhar p. 41}. ويفرّق بين ما يُقطع بصحته من السنة، كالمتواتر، وما يُعمل به بالظن الراجح من أخبار الآحاد، فلا يُقطع بنسبة حديث معين إلى النبي إلا إذا كان متواترًا، ويجب العمل بما ترجّح نسبته بالبحث في السند والمتن {cite:makanat-al-sunna-azhar p. 41}{cite:makanat-al-sunna-azhar p. 42}. ويرى أن الشبهات التي تقول إن السنة لا تُحتج بها لاختلافها وزيادتها ونقصها، أو لعدم كتابتها في عهد النبي، دعاوى مجملة لا تستند إلى واقعة مفصلة، وأن ما فيها من خلاف إنما يوجد في أحاديث ضعيفة، وأن العلماء ألّفوا في تمييز الموضوع منها {cite:makanat-al-sunna-azhar p. 58}{cite:makanat-al-sunna-azhar p. 59}{cite:makanat-al-sunna-azhar p. 60}. وذكر أن من أنكر حجية السنة ممن وُجد في الهند جماعة سمّت نفسها جماعة القرآن {cite:makanat-al-sunna-azhar p. 58}، وأن أول من أحسن الرد على إنكار خبر الآحاد هو الشافعي في رسالته، فيحيل إليها {cite:makanat-al-sunna-azhar p. 85}."
  tr: "Usul alimlerine göre sünnet, Kitap'tan sonraki ikinci hüküm ilkesidir. Peygamber'e itaat emrettiği ve yasakladığı şeylerde zorunludur ve bu konuda birçok ayet vardır, bunlara göre hareket etmek zorunludur. Yazar, bunu Peygamber'in zamanında ve sonrasında Müslümanların uzlaşısı olarak kabul etmiştir {cite:makanat-al-sunna-azhar s. 40}. Sünnetten doğrulanmış mutevatire, yalnızca yalnızca raporlara dayanan haberlere dayanan şeyleri ayırt eder. Belirli bir hadisi kesin olarak Peygamber'e atfedilmemelidir; ancak bu mutvetir (yaygın olarak aktarılmış) değilse ve en muhtemel olanı inceleyerek zinciri ve metni inceleyerek hareket etmek gerekir {cite:makanat-al-sunna-azhar s. 41}{cite:makanat-al-sunna-azhar s. 42}}. Sünnet'in kanıt olarak kullanılmadığına dair şüphelerin farklılıkları, eklemeleri, eksiklikleri nedeniyle ya da Peygamber'in zamanında yazılmadıkları için ayrıntılı bir gerçeğe dayanmayan belirsiz iddialar olduğunu, herhangi bir anlaşmazlığın sadece zayıf hadislerde var olduğunu ve alimlerin konuyu onlardan ayırmaya aşina olduklarını düşünüyor {atıf: Makanat-al-sunna-Azhar s. 58}{cite:makanat-al-sunna-azhar s. 59}{cite:makanat-al-sunna-azhar s. 60}. Sünnetin otoritesini reddedenlerin, Hindistan'da kendilerini Kur'an grubu olarak adlandıran bir grup bulanlar olduğunu belirtti {cite:makanat-al-sunna-azhar s. 58}} ve tek raporların reddine ilk iyi yanıt veren kişinin mektubunda Al-Shafi'i olduğunu ve buna atıfta bulunduğunu {cite:makanat-al-sunna-azhar s. 85} belirtti."
  id: "Sunnah menurut para ulama usul adalah prinsip kedua dari aturan setelah Kitab. Ketaatan kepada Nabi adalah kewajiban dalam apa yang diperintahkan dan dilarang, dan ada banyak ayat mengenai hal ini, dan bertindak berdasarkan itu wajib. Penulis menganggap ini sebagai salah satu konsensus Muslim pada masa Nabi dan setelahnya {cite:makanat-al-sunna-azhar hlm. 40}. Ia membedakan antara apa yang dikonfirmasi sebagai otentik dari Sunnah, seperti mutawatir, dan apa yang ditindaklanjuti berdasarkan banyaknya laporan tunggal. Seseorang tidak boleh secara pasti mengaitkan hadits tertentu kepada Nabi kecuali itu mutawatir (disebarluaskan), dan perlu bertindak berdasarkan apa yang paling mungkin dikaitkan dengan meneliti rantai dan teks {cite:makanat-al-sunna-azhar hlm. 41}{cite:makanat-al-sunna-azhar hlm. 42}. Ia percaya bahwa keraguan yang menyatakan bahwa Sunnah tidak digunakan sebagai bukti karena perbedaan, penambahan, atau kehilangannya, atau karena tidak ditulis pada masa Nabi, adalah klaim samar yang tidak didasarkan pada fakta rinci, dan bahwa perbedaan pendapat hanya ada dalam hadits yang lemah, dan para ulama telah terbiasa membedakan subjek tersebut dari hadits tersebut {cite:makanat-al-sunna-azhar hlm. 58}{cite:makanat-al-sunna-azhar hlm. 59}{cite:makanat-al-sunna-azhar hlm. 60}. Ia menyebutkan bahwa mereka yang menyangkal otoritas Sunnah adalah mereka yang menemukan kelompok di India yang menyebut diri mereka kelompok Al-Qur'an {cite:makanat-al-sunna-azhar hlm. 58}, dan bahwa yang pertama merespons dengan baik penolakan laporan tunggal adalah Al-Shafi'i dalam suratnya, merujuk pada hal itu {cite:makanat-al-sunna-azhar hlm. 85}."
