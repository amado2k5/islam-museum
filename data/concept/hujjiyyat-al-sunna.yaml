label:
  ar: حجية السنة
  en: The authority of the Sunna (hujjiyyat al-sunna)
summary:
  ar: "السنة عند الأصوليين الأصل الثاني للأحكام بعد الكتاب، وطاعة النبي واجبة فيما أمر به ونهى عنه، والآيات في ذلك كثيرة، والعمل بها واجب، وعدّ المؤلف هذا مما اتفق عليه المسلمون في عهد النبي وبعده {cite:makanat-al-sunna-azhar p. 40}{cite:makanat-al-sunna-azhar p. 41}. ويفرّق بين ما يُقطع بصحته من السنة، كالمتواتر، وما يُعمل به بالظن الراجح من أخبار الآحاد، فلا يُقطع بنسبة حديث معين إلى النبي إلا إذا كان متواترًا، ويجب العمل بما ترجّح نسبته بالبحث في السند والمتن {cite:makanat-al-sunna-azhar p. 41}{cite:makanat-al-sunna-azhar p. 42}. ويرى أن الشبهات التي تقول إن السنة لا تُحتج بها لاختلافها وزيادتها ونقصها، أو لعدم كتابتها في عهد النبي، دعاوى مجملة لا تستند إلى واقعة مفصلة، وأن ما فيها من خلاف إنما يوجد في أحاديث ضعيفة، وأن العلماء ألّفوا في تمييز الموضوع منها {cite:makanat-al-sunna-azhar p. 58}{cite:makanat-al-sunna-azhar p. 59}{cite:makanat-al-sunna-azhar p. 60}. وذكر أن من أنكر حجية السنة ممن وُجد في الهند جماعة سمّت نفسها جماعة القرآن {cite:makanat-al-sunna-azhar p. 58}، وأن أول من أحسن الرد على إنكار خبر الآحاد هو الشافعي في رسالته، فيحيل إليها {cite:makanat-al-sunna-azhar p. 85}."
