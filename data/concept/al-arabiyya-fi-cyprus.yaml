tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في قبرص"
  en: "Arabic in Cyprus"
  ur: "قبرص میں عربی"
  fr: "l'arabe à Chypre"
  es: "el árabe en Chipre"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في قبرص: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. ولقبرص هنا خصوصية: صنف عربي معزول، هو العربية المارونية القبرصية، اعترفت به الدولة لغة أقلية وتصنّفه اليونسكو مهدداً بشدة. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Cyprus: its legal status, the varieties spoken and the official figures, each as the summary gives it. Cyprus has a particular case here: an isolated variety, Cypriot Maronite Arabic, recognised by the state as a minority language and classed by UNESCO as severely endangered. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ قبرص میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ قبرص کی یہاں ایک خاص صورت ہے: ایک الگ تھلگ قسم، قبرصی مارونی عربی، جسے ریاست نے اقلیتی زبان تسلیم کیا اور یونیسکو شدید خطرے میں درجہ بند کرتا ہے۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe à Chypre : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. Chypre offre ici un cas particulier : une variété isolée, l'arabe maronite chypriote, reconnue par l'État comme langue minoritaire et classée par l'UNESCO comme gravement menacée. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Chipre: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. Chipre ofrece aquí un caso particular: una variedad aislada, el árabe maronita chipriota, reconocida por el Estado como lengua minoritaria y clasificada por la UNESCO como gravemente amenazada. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
