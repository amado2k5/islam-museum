label:
  ar: "طين الأرضين المزروعة"
  en: "Tin al-aradin al-mazrua (earth of cultivated land)"
  ur: "طین الارضین المزروعہ ⁦(کاشت شدہ زمین کی مٹی)⁩"
  es: "Tin al-aradin al-mazrua (tierra de tierra cultivada)"
  fr: "Tin al-aradin al-mazrua (terre de terres cultivées)"
  tr: "İki ekili arazinin kili"
  id: "Tanah liat dari dua lahan yang dibudidayakan"
summary:
  ar: "أطيان من الأرض المزروعة، بيضاء أو رمادية والرمادية أجود، قابضة مبردة مليّنة، تملأ القروح لحماً وتلزق الجراح في أولها."
  en: "Earths from cultivated land, white or grey with the grey the better; astringent, cooling and softening, they fill ulcers with flesh and bind fresh wounds."
  ur: "کاشت شدہ زمین کی مٹیاں، سفید یا خاکستری؛ خاکستری بہتر ہے۔ یہ قابض، ٹھنڈی اور نرم کرنے والی ہیں، زخموں کو گوشت سے بھرتی ہیں اور نئے زخم باندھتی ہیں۔"
  es: "Tierras de cultivo, blancas o grises, siendo las grises mejor; astringentes, refrescantes y suavizantes, rellenan las úlceras con tejido y vendan las heridas recientes."
  fr: "Terres de terres cultivées, blanches ou grises, les grises étant préférables; astringentes, rafraîchissantes et adoucissantes, elles comblent les ulcères de chair et pansent les plaies fraîches."
  tr: "Ekili topraktan elde edilen killer, beyaz veya gri ve gri, en kaliteli kalitededir; büzücü, soğutucu ve yumuşayan, yaraları etle doldurur ve başlangıçta yaralara yapışır."
  id: "Lempung dari tanah budidaya, putih atau abu-abu, dan abu-abu memiliki kualitas terbaik, astringen, didinginkan, dan melunak, mengisi luka dengan daging dan menempel pada luka di awal."
