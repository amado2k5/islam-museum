label: { ar: "هِمْيان", en: "Himyan (money belt: pilgrim's wearing, spoils and theft)" }
summary:
  ar: "الهميان في اللغة كيس يُجعل فيه النفقة ويُشد على الوسط، وهو معرب، ويُستعمل بالمعنى نفسه في الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} وأجاز الحنفية والمالكية والشافعية للمحرم شد الهميان على وسطه، واستدلوا بأثر ابن عباس، وقيّد المالكية الجواز بأن تكون النفقة للمحرم وأهله لا للتجارة، وبأن يكون الشد على جلده لا على إزاره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} وكره أبو يوسف المنطقة المتخذة من الإبريسم للمحرم، وكره ابن عمر في أصح الروايتين شد الهميان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} واشترط الحنابلة أن تكون فيه النفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} ويدخل الهميان في السلب عند جمهور الفقهاء، ولا يدخل عند المالكية والشافعية في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} ومن طرّ الهميان وأخذ المال قُطع عند الجمهور، وفصّل الحنفية فلم يقطعوا من طرّ هميانا خارجاً من الكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565}"
  en: "Himyan in the lexical sense is a purse in which provision is kept and tied at the waist; it is a loan word, used in the same sense in the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} The Hanafis, Malikis and Shafi'is permit a pilgrim in the state of ihram to tie the himyan at his waist, relying on a report of Ibn Abbas; the Malikis allow it only for the pilgrim's own and his family's provision, not for trade, and only when tied on the skin, not on the waist-wrapper. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} Abu Yusuf disliked a silk girdle for the pilgrim, and Ibn Umar disliked tying the himyan in the sounder of his two reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} The Hanbalis permit it only when it holds provision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} Most jurists count the himyan within the spoils a fighter may take; the Malikis and in one Shafi'i view do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} Most jurists hold that a thief who cuts a himyan and takes its money is liable to amputation; the Hanafis distinguish a purse hanging outside the sleeve, which is not cut for, from one reached through the sleeve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565}"
