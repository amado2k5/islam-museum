label: { ar: "هِمْيان", en: "Himyan (money belt: pilgrim's wearing, spoils and theft)", es: "Himyan (cinturón de dinero: que usan los peregrinos, para guardar el botín y evitar robos)", fr: "Himyan (ceinture d'argent: vêtement du pèlerin, butin et vol)" }
summary:
  ar: "الهميان في اللغة كيس يُجعل فيه النفقة ويُشد على الوسط، وهو معرب، ويُستعمل بالمعنى نفسه في الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} وأجاز الحنفية والمالكية والشافعية للمحرم شد الهميان على وسطه، واستدلوا بأثر ابن عباس، وقيّد المالكية الجواز بأن تكون النفقة للمحرم وأهله لا للتجارة، وبأن يكون الشد على جلده لا على إزاره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} وكره أبو يوسف المنطقة المتخذة من الإبريسم للمحرم، وكره ابن عمر في أصح الروايتين شد الهميان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} واشترط الحنابلة أن تكون فيه النفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} ويدخل الهميان في السلب عند جمهور الفقهاء، ولا يدخل عند المالكية والشافعية في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} ومن طرّ الهميان وأخذ المال قُطع عند الجمهور، وفصّل الحنفية فلم يقطعوا من طرّ هميانا خارجاً من الكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565}"
  en: "Himyan in the lexical sense is a purse in which provision is kept and tied at the waist; it is a loan word, used in the same sense in the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} The Hanafis, Malikis and Shafi'is permit a pilgrim in the state of ihram to tie the himyan at his waist, relying on a report of Ibn Abbas; the Malikis allow it only for the pilgrim's own and his family's provision, not for trade, and only when tied on the skin, not on the waist-wrapper. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} Abu Yusuf disliked a silk girdle for the pilgrim, and Ibn Umar disliked tying the himyan in the sounder of his two reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} The Hanbalis permit it only when it holds provision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} Most jurists count the himyan within the spoils a fighter may take; the Malikis and in one Shafi'i view do not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} Most jurists hold that a thief who cuts a himyan and takes its money is liable to amputation; the Hanafis distinguish a purse hanging outside the sleeve, which is not cut for, from one reached through the sleeve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565}"
  es: "Himyan, en sentido léxico, es una bolsa en la que se guardan provisiones y que se ata a la cintura; es un préstamo lingüístico, usado con el mismo sentido en la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} Los hanafíes, malikíes y shafiíes permiten que un peregrino en estado de ihram se ate el himyan a la cintura, basándose en un relato de Ibn Abbas; los malikíes lo permiten solo para las provisiones del peregrino y su familia, no para el comercio, y solo cuando se ata a la piel, no a la faja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} Abu Yusuf desaprobaba un cinturón de seda para el peregrino, e Ibn Umar desaprobaba atar el himyan en el más sonoro de sus dos informes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} Los hanbalíes lo permiten solo cuando contiene provisiones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} La mayoría de los juristas cuentan el himyan dentro del botín que un guerrero puede tomar; los malikíes y en una opinión shafi'í no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} La mayoría de los juristas sostienen que un ladrón que corta un himyan y toma su dinero es susceptible de amputación; los hanafíes distinguen entre una bolsa que cuelga fuera de la manga, para la cual no se corta, y una que se alcanza a través de la manga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565}"
  fr: "Le terme « himyan », au sens littéral, désigne une bourse dans laquelle on conserve des provisions et que l'on attache à la taille; il s'agit d'un emprunt, employé dans le même sens en droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16563} Les écoles hanafite, malikite et chaféite autorisent le pèlerin en état d'ihram à porter le himyan à la taille, se fondant sur un hadith rapporté par Ibn Abbas; les malikites l'autorisent uniquement pour les provisions du pèlerin et de sa famille, non pour le commerce, et seulement s'il est attaché directement sur la peau, et non à la ceinture. Abu Yusuf désapprouvait la ceinture de soie pour le pèlerin, et Ibn Umar, dans son hadith le plus fiable, désapprouvait le fait d'attacher le himyan. Les Hanbalites l'autorisent uniquement s'il contient des provisions. La plupart des juristes considèrent le himyan comme faisant partie du butin qu'un combattant peut emporter; les Malikites et, selon une opinion shafi'ite, ne le font pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16564} La plupart des juristes estiment qu'un voleur qui coupe une manche et s'empare de son argent est passible d'amputation; les hanafites font la distinction entre une bourse qui dépasse de la manche, et qui n'est pas coupée, et celle à laquelle on accède en passant la main par la manche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16565}"
