label:
  ar: "نبض المستحمين عند ابن سينا"
  en: "The pulse of those who bathe in the Canon"
  fr: "Pouls des baigneurs dans le Canon"
  ur: "غسل کرنے والوں کی نبض قانون میں"
  es: "El pulso de aquellos que se bañan en el Canon"
summary:
  ar: "في الفصل الرابع عشر يفرق ابن سينا بين نبض المستحم بالماء الحار ونبض المستحم بالماء البارد، ويذكر أثر مياه الحمامات المجففة والمسخنة {cite:canon-ibn-sina-print-v1 pp.180-181}."
  en: "In the fourteenth chapter Ibn Sina distinguishes the pulse of one bathing in hot water from that of one bathing in cold, and notes the effect of drying and heating bath waters {cite:canon-ibn-sina-print-v1 pp.180-181}."
  fr: "Au chapitre 14, Ibn Sina compare bains chauds et froids, puis eaux desséchantes et chauffantes {cite:canon-ibn-sina-print-v1 pp.180-181}."
  es: "En el capítulo catorce, Ibn Sina distingue el pulso de quien se baña en agua caliente del de quien se baña en agua fría, y señala el efecto de secar y calentar el agua del baño {cite:canon-ibn-sina-print-v1 pp.180-181}."
  ur: "چودھویں باب میں ابن سینا نے گرم پانی میں نہانے کی نبض کو سردی میں نہانے سے الگ کیا ہے اور غسل کے پانی کو خشک کرنے اور گرم کرنے کے اثرات کو نوٹ کیا ہے۔"
