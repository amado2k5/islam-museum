id: concept/dhukura-fiqh
class: concept
kind: legal
label:
  ar: "الذكورة (في الفقه)"
  en: "Maleness (dhukura) as a condition in the rulings"
  ur: "مرد ہونا (فقہی احکام میں شرط)"
summary:
  ar: "الذكورة خلاف الأنوثة، وتعتبر شرطا في أحكام عدة: فالمالكية يشترطونها في إمامة الصلاة، وجمهور الفقهاء يمنعون إمامة المرأة للرجال، وتشترط في وجوب الجمعة وفي الجهاد وفي إمامة الدولة العظمى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8477} واختلف الفقهاء في النكاح والقضاء، فالجمهور يشترطون الذكورة في الولي والقاضي، والحنفية يجيزون للمرأة الرشيدة أن تزوج نفسها وأن تتولى القضاء فيما لا حدود فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8477}"
  en: "Maleness is the opposite of femaleness, and the jurists treat it as a condition in several rulings: the Malikis require it for leading prayer, and most jurists bar a woman from leading men; it is required for the obligation of Friday prayer, of holy war and for the supreme imamate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8477} On marriage and judgeship the schools differ: the majority require a male guardian and a male judge, while the Hanafis allow a mature woman to contract her own marriage and to judge in cases without hadd penalties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8475} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8477}"
  ur: "ذکورت عورت کی ضد ہے، اور فقہاء اسے کئی احکام میں شرط مانتے ہیں: نماز کی امامت، جمعہ کا وجوب، جہاد، اور امامت عظمیٰ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8474} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8476} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8477}"
