label: { ar: "الحِلّ", en: "Hill (the lawful zone outside the sanctuary)", ur: "حِلّ" }
summary:
  ar: "الحِلّ لغة ما خارج الحرم، ويقابل الحرام، ويطلق على الرجل الخارج من إحرامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} والحلال عند الفقهاء ما أطلق الشرع فعله، وما سكت عنه الشرع فهو عفو، والأصل في الأشياء الإباحة قبل ورود الشرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} وأعلام الحرم هي المنار التي ضربها إبراهيم، وما كان دونها فهو حرم، وما وراءها حل يجوز صيده لغير المحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} ويفضل الجمهور الحنابلة والحنفية التنعيم للإحرام بالعمرة، ويفضل المالكية والشافعية الجعرانة ثم التنعيم ثم الحديبية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7271} وصيد الحرم محرّم، والجمهور يعتبرون مكان الصيد لا مكان الصائد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7272} وفي المدينة خلاف: فالجمهور يحرمون صيدها ويرون في صيدها الاستغفار دون جزاء، والشافعي في القديم يوجب الجزاء بسلب الصائد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} والأشهر الحرم أربعة، وكان القتال فيها محرما في الجاهلية، وأبطل الإسلام النسيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} والحل مقابل الإحرام، إذ يخرج المحرم بفعله ما كان محظورا عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} "
  en: "Hill lexically is what lies outside the sacred precinct, the counterpart of haram, and names a man who has left the state of ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} In the jurists' use the lawful is what the lawgiver permits; what the law leaves silent is pardoned, and things are presumed permitted before revelation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} The markers of the sanctuary (a'lam) set by Abraham mark the limit: inside them is haram, outside them is hill, where hunting is lawful for one not in ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} For taking ihram for umra, the Hanafis and Hanbalis prefer al-Tan'im, while the Malikis and Shafiis prefer al-Ji'rana, then al-Tan'im, then al-Hudaybiya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7271} Hunting in the sanctuary is forbidden, and the majority look to the place of the game rather than the hunter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7272} On Medina the majority forbid hunting there and require only seeking forgiveness, while the Shafiis in an old view require compensation through the hunter's spoils. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} The four sacred months were times of forbidden fighting before Islam; the postponement practice was abolished. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} Hill is also the state after leaving ihram, when what ihram forbade becomes lawful again. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} "
  ur: "حِل لغت میں حرم کے باہر کی زمین ہے، جو حرام کی ضد ہے، اور اس شخص کے لیے بھی بولا جاتا ہے جو احرام سے نکل چکا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} فقہاء کے نزدیک حلال وہ ہے جسے شرع نے جائز کیا، اور جس پر شریعت خاموش ہو وہ معافی ہے، اور نزولِ شرع سے پہلے اشیاء میں اصل اباحت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} حرم کی حدود کے نشانات (اعلامِ حرم) جو ابراہیم نے قائم کیے، ان کے اندر حرم ہے اور باہر حل ہے، جہاں محرم کے علاوہ کو شکار جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7270} عمرے کے احرام کے لیے حنفیہ اور حنابلہ تنعیم کو افضل کہتے ہیں، جبکہ مالکیہ اور شافعیہ جعرانہ، پھر تنعیم، پھر حدیبیہ کو ترجیح دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7271} حرم میں شکار حرام ہے، اور جمہور شکار کی جگہ کا اعتبار کرتے ہیں نہ کہ شکاری کی جگہ کا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7272} مدینہ کے بارے میں جمہور اس کا شکار حرام کہتے ہیں اور صرف استغفار لازم سمجھتے ہیں، جبکہ امام شافعی کے قدیم قول میں شکاری کا سامان لینے کا جزاء ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7272} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} اشہرِ حرم چار ہیں، جن میں جاہلیت میں جنگ حرام تھی، اور اسلام نے نسیء کو باطل کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} حل احرام کے مقابل بھی ہے، کیونکہ احرام سے نکلنے سے وہ چیزیں جائز ہو جاتی ہیں جو احرام میں ممنوع تھیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7273} "
