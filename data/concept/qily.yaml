summary:
  ar: "القلي في الكتاب حار محرق جلاء أكال أقوى من الملح، وينفع من البهق والجرب ويأكل اللحم الزائد {cite:canon-ibn-sina-print-v1 p.654}"
  en: "Qily is in the book hot, burning, cleansing and corrosive, stronger than salt; it benefits vitiligo and itch and eats away excess flesh {cite:canon-ibn-sina-print-v1 p.654}"
  ur: "قلی کتاب میں گرم، جلانے والا، جلا دینے والا اور کھانے والا ہے، نمک سے زیادہ قوی؛ برص اور خارش میں نافع ہے اور زائد گوشت کو کھا جاتا ہے {cite:canon-ibn-sina-print-v1 p.654}۔"
  es: "En el libro, el Qily es caliente, ardiente, purificador y corrosivo, más fuerte que la sal; beneficia el vitíligo y el picor y elimina el exceso de carne {cite:canon-ibn-sina-print-v1 p.654}"
  fr: "Le qily est décrit dans le livre comme chaud, brûlant, purifiant et corrosif, plus puissant que le sel; il est bénéfique pour le vitiligo et les démangeaisons et élimine l'excès de chair {cite:canon-ibn-sina-print-v1 p.654}"
  tr: "Kitapta kızartma sıcak ve yakıcıdır, tuzdan daha güçlü yiyecekleri temizler, vitiligo ve uyuz gibi şeylere ve fazla et yemeye fayda sağlar {cite:canon-ibn-sina-print-v1 s.654}"
  id: "Menggoreng dalam buku itu panas dan membakar, membersihkan makanan yang lebih kuat dari garam, dan bermanfaat bagi vitiligo dan kudis, serta makan daging berlebih {cite:canon-ibn-sina-print-v1 hlm.654}"
