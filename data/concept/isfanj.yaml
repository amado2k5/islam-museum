summary:
  ar: "الإسفنج جسم بحري رخو؛ يجفّف بقوة، وإذا أُحرق بالزيت كوى وحبس النزف، ويعين على التئام الجراح والقروح العميقة {cite:canon-ibn-sina-print-v1 p.360}."
  en: "Sponge, a soft marine body. It dries strongly; burned with oil it cauterises and stops bleeding, and it helps close wounds and deep ulcers {cite:canon-ibn-sina-print-v1 p.360}."
  ur: "اسفنج سمندر کا نرم جسم ہے؛ یہ بہت خشک کرتا ہے، تیل کے ساتھ جلانے سے داغتا اور خون روکتا ہے، اور گہرے زخم بھرنے میں مدد دیتا ہے {cite:canon-ibn-sina-print-v1 p.360}۔"
  es: "Esponja, un cuerpo marino blando. Se seca con facilidad; quemada con aceite cauteriza y detiene el sangrado, y ayuda a cerrar heridas y úlceras profundas {cite:canon-ibn-sina-print-v1 p.360}."
