label: { ar: "الدول المستعمرة والإسلام", en: "Colonial powers and Islam", es: "Las potencias coloniales y el Islam", fr: "Les puissances coloniales et l'islam", ur: "استعماری طاقتیں اور اسلام", tr: "Sömürge Devletleri ve İslam", id: "Negara Kolonial dan Islam" }
summary:
  ar: "يعرض شكيب أرسلان في فصل قصير ما يراه سياسة الدول الأوروبية الكبرى في الحرب العالمية الأولى تجاه المسلمين. يذكر أن بريطانيا وفرنسا لم تقبلا عروض التحالف من إيران ومن مصر، ولا من الشريف حسين إلا بعد تردد، وأن الحلفاء لم يقبلوا التحالف مع دول إسلامية لأنهم لا يريدون أن يلتزموا بعدها بشيء لها. ويخلص إلى أن الدول المستعمرة لا تقبل من الإسلام حتى الصداقة، وأن المسلمين يبذلون أرواحهم وأموالهم في جانبها بلا مقابل. هذا عرض لتفسير المؤلف لحوادث الحرب، ولا يُعدّ وثيقة قاطعة في نيات الدول."
  en: "A short chapter in which Arslan argues that the Allied powers in the First World War refused alliances with Muslim states such as Persia, Egypt and the Hijaz (the Sharif Husayn's alliance came only in 1915). In his reading they would not bind themselves to reward Muslim governments after victory. He concludes that colonial powers would accept no friendship from Islam and that Muslims paid in lives and money for their cause without return. This is his interpretation of wartime events, not a settled account of the powers' intentions."
  es: "En un breve capítulo, Arslan argumenta que las potencias aliadas en la Primera Guerra Mundial rechazaron alianzas con estados musulmanes como Persia, Egipto y el Hiyaz (la alianza del jerife Husayn se concretó recién en 1915). Según su interpretación, no se comprometían a recompensar a los gobiernos musulmanes tras la victoria. Concluye que las potencias coloniales no aceptarían la amistad del islam y que los musulmanes pagaron con vidas y dinero por su causa sin recibir nada a cambio. Esta es su interpretación de los acontecimientos bélicos, no una versión definitiva de las intenciones de las potencias."
  fr: "Dans un court chapitre, Arslan soutient que les puissances alliées, durant la Première Guerre mondiale, refusèrent toute alliance avec des États musulmans tels que la Perse, l'Égypte et le Hedjaz (l'alliance avec le chérif Hussein ne fut conclue qu'en 1915). Selon lui, elles ne s'engageraient pas à récompenser les gouvernements musulmans après la victoire. Il en conclut que les puissances coloniales n'accepteraient aucune amitié de l'islam et que les musulmans payèrent leur combat en vies humaines et en argent, sans contrepartie. Il s'agit là de son interprétation des événements de guerre, et non d'une analyse définitive des intentions des puissances."
  ur: "ایک مختصر باب جس میں ارسلان نے دلیل دی کہ پہلی جنگ عظیم میں اتحادی طاقتوں نے مسلم ریاستوں جیسے فارس، مصر اور حجاز کے ساتھ اتحاد سے انکار کر دیا تھا ⁦(شریف حسین کا اتحاد صرف 1915 میں ہوا تھا)⁩۔ اس کے پڑھنے میں وہ فتح کے بعد مسلم حکومتوں کو انعام دینے کے پابند نہیں ہوں گے۔ وہ یہ نتیجہ اخذ کرتا ہے کہ نوآبادیاتی طاقتیں اسلام سے کوئی دوستی قبول نہیں کریں گی اور مسلمانوں نے اپنے مقصد کے لیے جانوں اور پیسوں کی ادائیگی کے بغیر واپسی کی۔ یہ جنگ کے وقت کے واقعات کی اس کی تشریح ہے، طاقتوں کے ارادوں کا کوئی طے شدہ اکاؤنٹ نہیں۔"
  tr: "Shakib Arslan, kısa bir bölümde, I. Dünya Savaşı'nda büyük Avrupa ülkelerinin Müslümanlara yönelik politikalarını sunuyor. Britanya ve Fransa'nın İran ve Mısır'dan, Şerif Hüseyin'den ise sadece tereddüt sonrası ittifak tekliflerini kabul ettiğini, Müttefiklerin ise İslam ülkeleriyle ittifakları kabul etmediğini çünkü sonrasında hiçbir şey yapmak istemediklerini belirtmekte fayda var. Sonuç olarak, sömürge ülkeleri İslam'dan bile dostluk kabul etmedi ve Müslümanlar hayatlarını ve servetlerini karşılıksız kendi taraflarında feda ettiklerini belirtti. Bu, yazarın savaşın olaylarına dair yorumunun bir sunumudur ve devletlerin niyetlerine dair kesin bir belge olarak kabul edilmez."
  id: "Shakib Arslan memaparkan dalam bab singkat apa yang ia lihat sebagai kebijakan negara-negara Eropa utama dalam Perang Dunia I terhadap Muslim. Perlu disebutkan bahwa Inggris dan Prancis tidak menerima tawaran aliansi dari Iran dan Mesir, maupun dari Sharif Hussein kecuali setelah ragu-ragu, dan bahwa Sekutu tidak menerima aliansi dengan negara-negara Islam karena mereka tidak ingin berkomitmen pada apa pun setelah itu. Ia menyimpulkan bahwa negara-negara kolonial bahkan tidak menerima persahabatan dari Islam, dan bahwa Muslim mengorbankan nyawa dan kekayaan mereka di pihak mereka tanpa kompensasi. Ini adalah penyajian interpretasi penulis tentang peristiwa perang dan tidak dianggap sebagai dokumen definitif mengenai niat negara."
