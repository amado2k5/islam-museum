label: { ar: "الدول المستعمرة والإسلام", en: "Colonial powers and Islam" }
summary:
  ar: "يعرض شكيب أرسلان في فصل قصير ما يراه سياسة الدول الأوروبية الكبرى في الحرب العالمية الأولى تجاه المسلمين. يذكر أن بريطانيا وفرنسا لم تقبلا عروض التحالف من إيران ومن مصر، ولا من الشريف حسين إلا بعد تردد، وأن الحلفاء لم يقبلوا التحالف مع دول إسلامية لأنهم لا يريدون أن يلتزموا بعدها بشيء لها. ويخلص إلى أن الدول المستعمرة لا تقبل من الإسلام حتى الصداقة، وأن المسلمين يبذلون أرواحهم وأموالهم في جانبها بلا مقابل. هذا عرض لتفسير المؤلف لحوادث الحرب، ولا يُعدّ وثيقة قاطعة في نيات الدول."
  en: "A short chapter in which Arslan argues that the Allied powers in the First World War refused alliances with Muslim states such as Persia, Egypt and the Hijaz (the Sharif Husayn's alliance came only in 1915). In his reading they would not bind themselves to reward Muslim governments after victory. He concludes that colonial powers would accept no friendship from Islam and that Muslims paid in lives and money for their cause without return. This is his interpretation of wartime events, not a settled account of the powers' intentions."
