summary:
  ar: "يصف الفرغاني أشهر السريان والروم والقبط والفرس، وعدد أيام السنة عند كل منهم: السريان والروم ثلاثمائة وخمسة وستون يوماً وربع يوم، وتُزاد في كل أربع سنين يوم، والفرس ثلاثمائة وخمسة وستون يوماً بخمسة أيام تُلحق بين آبان وآذر، والقبط ثلاثون يوماً لكل شهر وخمسة أيام زائدة في آخر السنة {cite:farghani-elements-astronomy p. 127}{cite:farghani-elements-astronomy p. 128}{cite:farghani-elements-astronomy p. 129}{cite:farghani-elements-astronomy p. 135}{cite:farghani-elements-astronomy p. 137}."
  en: "al-Farghani gives the months of the Syriac, Roman, Coptic and Persian calendars. The Syriac and Roman years have 365 1/4 days with a day added every four years; the Persian year has 365 days with five days inserted between Aban and Adhar; the Coptic year has twelve months of thirty days and five extra days at the end {cite:farghani-elements-astronomy p. 127}{cite:farghani-elements-astronomy p. 128}{cite:farghani-elements-astronomy p. 129}{cite:farghani-elements-astronomy p. 135}{cite:farghani-elements-astronomy p. 137}."
