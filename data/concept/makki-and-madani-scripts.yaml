id: concept/makki-and-madani-scripts
class: concept
kind: art_form
label: { ar: "الخط المكي والخط المدني", en: "Meccan and Medinan scripts", ur: "خطِ مکی اور خطِ مدنی", es: "Escrituras de La Meca y Medina" }
summary:
  ar: "أقدم الخطوط العربية في ترتيب ابن النديم، يليهما البصري ثم الكوفي، وهو يصف ألفات المكي والمدني بالتفاتة إلى جهة اليمين وارتفاع في القوائم وميل يسير في الشكل؛ وتبحث الدراسات الحديثة هل يخص وصفه المصاحف أم أقدم الكتابة العربية عمومًا {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 20} {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
  en: "The earliest Arabic scripts in Ibn al-Nadim's order, followed by the Basran and the Kufan; he describes the alifs of the Meccan and Medinan hands by a turn toward the right and raised ascenders, with a slight slant in the form. Modern scholarship asks whether his description concerns Qur'an manuscripts at all or the earliest Arabic writing in general {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 20} {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
  ur: "ابن الندیم کی ترتیب میں قدیم ترین عربی خطوط، جن کے بعد بصری اور پھر کوفی آتا ہے؛ وہ مکی اور مدنی کے الفوں کو دائیں طرف جھکاؤ اور اونچی کھڑی لکیروں اور شکل میں ہلکے میلان سے بیان کرتے ہیں۔ جدید تحقیق پوچھتی ہے کہ ان کا بیان مصاحف کے بارے میں ہے یا عمومًا قدیم ترین عربی تحریر کے بارے میں {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 20} {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}۔"
  es: "Las primeras escrituras árabes en el orden de Ibn al-Nadim, seguidas por las de Basora y Kufán; él describe las alifs de las escrituras de La Meca y Medina por un giro hacia la derecha y ascendentes elevados, con una ligera inclinación en la forma. La erudición moderna se pregunta si su descripción se refiere a los manuscritos del Corán en absoluto o a la escritura árabe más antigua en general {cite:fihrist-ibn-al-nadim-rahmaniyya-cairo p. 20} {cite:blair-islamic-calligraphy-2006 p. 147} {cite:blair-islamic-calligraphy-2006 p. 148}."
