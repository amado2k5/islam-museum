label:
  ar: "الحمل"
  en: "Pregnancy"
  ur: "حمل"
  es: "Embarazo"
summary:
  ar: "الحمل في القرآن وهن على وهن وكلفة تحملها الأم، وأحاطه الفقه بأحكام: يثبت به النسب، وتجب به النفقة، وتراعى فيه الحامل في الصوم والحدود والعدة، ومدته عند الجمهور بين ستة أشهر وأربع سنين."
  en: "Pregnancy in the Qur'an is weakness upon weakness, a burden the mother bears; fiqh surrounds it with rulings: lineage is established by it, maintenance is due for it, the pregnant woman is regarded in fasting, in the hudud and in the waiting period, and its term runs between six months and four years for most jurists."
  ur: "قرآن میں حمل مشقت پر مشقت ہے، ایک بوجھ جو ماں اٹھاتی ہے؛ فقہ اسے احکام سے گھیرے رکھتا ہے: اس سے نسب ثابت ہوتا ہے، نفقہ واجب ہوتا ہے، حاملہ کی روزے، حدود اور عدت میں رعایت ہوتی ہے، اور اس کی مدت جمهور کے نزدیک چھ ماہ سے چار برس تک ہے۔"
  es: "En el Corán, el embarazo es una debilidad tras otra, una carga que soporta la madre; el fiqh lo rodea de normas: se establece el linaje con él, se debe mantener a la mujer embarazada, se la considera en el ayuno, en el hudud y en el período de espera, y su duración oscila entre seis meses y cuatro años para la mayoría de los juristas."
