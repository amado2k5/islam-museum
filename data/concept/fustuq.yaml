  fr: "Fustuq (la pistache)"
  tr: "antep fıstığı"
  id: "pistachio"
summary:
  ar: "الفستق في الكتاب شجرة معروفة موجودة في بعض البلاد، حار في آخر الثانية وفيه رطوبة، يفتح سدد الكبد لمرارته وعطريته وفيه عفوصة وغذاؤه يسير جدا، جيد للمعدة، ودهنه ينفع من وجع الكبد، ولا يليّن البطن ولا يعقله، وينفع من نهش الهوام {cite:canon-ibn-sina-print-v1 pp.634-635}"
  en: "Fustuq is in the book a well-known tree found in some lands, hot at the end of the second degree with some moisture; it opens obstructions of the liver by its bitterness and its fragrance, has some astringency, and its nourishment is very little; it is good for the stomach, its oil benefits pain of the liver, it neither softens nor binds the bowels, and it benefits the bites of vermin {cite:canon-ibn-sina-print-v1 pp.634-635}"
  ur: "فستق کتاب میں مشہور درخت ہے جو بعض ملکوں میں پایا جاتا ہے، دوسرے درجے کے آخر میں گرم اور کچھ نمی والا؛ اپنی تلخی اور خوشبو سے جگر کی رکاوٹیں کھولتا ہے، اس میں کچھ قبض ہے اور غذائیت بہت تھوڑی؛ معدے کے لیے اچھا ہے، اس کا تیل جگر کے درد میں نافع ہے، پیٹ کو نہ نرم کرتا ہے نہ روکتا ہے، اور زہریلے جانوروں کے ڈنک میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.634-635}۔"
  es: "En el libro, Fustuq es un árbol muy conocido que se encuentra en algunas tierras, cálido al final del segundo grado con algo de humedad; abre las obstrucciones del hígado por su amargor y su fragancia, tiene cierta astringencia y su valor nutritivo es muy bajo; es bueno para el estómago, su aceite alivia el dolor de hígado, no ablanda ni estrecha los intestinos y alivia las picaduras de parásitos {cite:canon-ibn-sina-print-v1 pp.634-635}"
  fr: "Le fustuq est décrit dans le livre comme un arbre bien connu, présent dans certaines régions, chaud à la fin du deuxième degré et légèrement humide; son amertume et son parfum débloquent le foie, il possède une certaine astringence et est peu nutritif; il est bon pour l’estomac, son huile soulage les douleurs du foie, il n’alourdit ni ne constipe les intestins, et il est bénéfique en cas de piqûres de vermine {cite:canon-ibn-sina-print-v1 pp.634-635}"
  tr: "Kitaptaki antep fıstığı bazı ülkelerde bulunan iyi bilinen ağaçlardır. İkinci bölüm sonunda sıcak ve nemlidirler, acılığı ve aroması nedeniyle karaciğerin pelerinini açarlar, tazedirler ve besinleri çok hafiftir. Mideye iyidirler, yağları karaciğer ağrısını hafifletir, mideyi yumuşatmaz veya mantık yaratmaz, ayrıca ısıran zararlılara karşı da yardımcı olur {cite:canon-ibn-sina-print-v1 s.634-635}"
  id: "Pistachio dalam buku ini adalah pohon yang dikenal luas dan ditemukan di beberapa negara. Kacang ini panas di akhir musim kedua dan lembap, membuka lapisan hati karena rasa pahit dan aromanya, segar, dan nutrisinya sangat ringan. Pistachio baik untuk lambung, dan lemaknya membantu meredakan nyeri hati, tidak melunakkan perut atau menyebabkan penasaran, dan membantu mencegah hama yang menggigit {cite:canon-ibn-sina-print-v1 hlm.634-635}"
