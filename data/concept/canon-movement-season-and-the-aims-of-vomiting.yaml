summary:
  ar: "يقرر ابن سينا أن الحركة تكثّر القيء والسكون يقلّله، وأن الصيف أولى زمان به لمن لا يواتيه القيء، وأن القيء إذا كان تنقية أولى فهو من المعدة وحدها، وإذا كان تنقية ثانية فمن الرأس وسائر البدن، أما الجذب والقلع فمن الأسافل {cite:canon-ibn-sina-print-v1 p.286}."
  en: "Ibn Sina states that movement increases vomiting and rest lessens it, that summer is the best season for those who do not vomit easily, and that vomiting as a first cleansing comes from the stomach alone, as a second cleansing from the head and body, while drawing and uprooting come from below {cite:canon-ibn-sina-print-v1 p.286}."
