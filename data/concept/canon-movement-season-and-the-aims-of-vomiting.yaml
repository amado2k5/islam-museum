id: concept/canon-movement-season-and-the-aims-of-vomiting
class: concept
kind: scientific
label:
  ar: "الحركة والفصل ومقاصد القيء عند ابن سينا"
  en: "Movement, season and the aims of vomiting in the Canon"
  fr: "Mouvement, saison et buts du vomissement dans le Canon"
  ur: "قانون میں حرکت، موسم اور قے کے مقاصد"
  es: "Movimiento, estación y propósitos del vómito en el Canon"
summary:
  ar: "يقرر ابن سينا أن الحركة تكثّر القيء والسكون يقلّله، وأن الصيف أولى زمان به لمن لا يواتيه القيء، وأن القيء إذا كان تنقية أولى فهو من المعدة وحدها، وإذا كان تنقية ثانية فمن الرأس وسائر البدن، أما الجذب والقلع فمن الأسافل {cite:canon-ibn-sina-print-v1 p.286}."
  en: "Ibn Sina states that movement increases vomiting and rest lessens it, that summer is the best season for those who do not vomit easily, and that vomiting as a first cleansing comes from the stomach alone, as a second cleansing from the head and body, while drawing and uprooting come from below {cite:canon-ibn-sina-print-v1 p.286}."
  fr: "Ibn Sina attribue au mouvement l’augmentation et au repos la diminution du vomissement ; il préfère l’été pour les sujets peu enclins et distingue premier nettoyage gastrique, second céphalique et corporel, attraction et déracinement depuis le bas {cite:canon-ibn-sina-print-v1 p.286}."
  es: "Ibn Sina afirma que el movimiento aumenta el vómito y el descanso lo disminuye, que el verano es la mejor estación para quienes no vomitan fácilmente, y que el vómito como primera limpieza proviene solo del estómago, como segunda limpieza de la cabeza y el cuerpo, mientras que la extracción y el desarraigo provienen de abajo {cite:canon-ibn-sina-print-v1 p.286}."
  ur: "ابن سینا کہتے ہیں کہ حرکت قے کو بڑھاتی ہے اور آرام کم کرتی ہے، گرمی کا موسم ان لوگوں کے لیے بہترین موسم ہے جو آسانی سے قے نہیں کرتے، اور یہ کہ پہلی قے صرف پیٹ سے ہوتی ہے، دوسری صفائی کے طور پر سر اور جسم کی، جب کہ کھینچنا اور اکھاڑنا نیچے سے آتا ہے۔"
