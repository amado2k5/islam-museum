id: concept/tahrim-as-chastisement
class: concept
kind: doctrine
label:
  ar: التحريم عقوبةً وتأديباً
  en: Prohibition as chastisement and correction
summary:
  ar: "يرى الشعراوي أن بعض التحريم قد يكون عقوبة وتأديباً لا لضرر في الشيء المحرم، وأن طلب الضرر فيما حرّمه الله رغبة في الانفلات من حكمه. ويستدل بتحريم بعض الطيبات على اليهود بسبب ظلمهم، ويعرض أن أهل الكتاب قالوا إن الإبل كانت محرمة من عهد إبراهيم ونوح، فبيّن الرسول أنها ليست محرمة، ويرى أنه لما أحل الله الطعام لبني إسرائيل إلا ما حرّم إسرائيل على نفسه، لم يكن لهم حجة {cite:tafsir-sharawi-khawatir-scan p.1617}{cite:tafsir-sharawi-khawatir-scan p.1618}{cite:tafsir-sharawi-khawatir-scan p.1619}."
  en: "Sha'rawi holds that some prohibitions are chastisement and correction, not a sign of harm in the thing forbidden, and that seeking a harm in what God forbade is a wish to escape his rule. He cites the prohibition of certain good things on the Jews as a punishment for their wrongdoing. He records that the People of the Book claimed camels had been forbidden since the time of Abraham and Noah, and that the Prophet made clear they were not forbidden, since all food had been lawful for the children of Israel except what Israel had forbidden himself {cite:tafsir-sharawi-khawatir-scan p.1617}{cite:tafsir-sharawi-khawatir-scan p.1618}{cite:tafsir-sharawi-khawatir-scan p.1619}."
