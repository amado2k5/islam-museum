issue:
  ar: "هل يُفهم تحريم بعض الطيبات على أهل الكتاب على أنه عقوبة لا لضرر في الشيء؟"
  en: "Should the prohibition of certain good things on the People of the Book be read as punishment rather than as harm in the thing itself?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-chastisement
  stance:
    ar: "بعض التحريم عقوبة وتأديب، ولا يُطلب فيه ضرر ظاهر"
    en: "Some prohibitions are punishment and correction, and need not show an apparent harm"
  summary:
    ar: "يقرر الشعراوي أن التحريم قد يأتي أدباً وتأديباً، كما يمنع الأب ابنه المصروف تأديباً، وأن البحث عن الضرر فيما حرّمه الله رغبة في الانفلات من حكمه {cite:tafsir-sharawi-khawatir-scan p.1619}."
    en: "Sha'rawi holds that prohibition can come as discipline and correction, as a father withholds pocket money from a son, and that searching for harm in what God forbade is a wish to escape his rule {cite:tafsir-sharawi-khawatir-scan p.1619}."
