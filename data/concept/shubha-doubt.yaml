id: concept/shubha-doubt
class: concept
kind: legal
label:
  ar: "الشُّبْهة"
  en: "Shubha (doubt that averts a penalty, and avoiding doubtful matters)"
summary:
  ar: "الشبهة لغة المماثلة، واصطلاحا ما لم يتيقن كونه حراما أو حلالا، أو ما يشبه الثابت وليس بثابت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911} وقسم الحنفية والشافعية الشبهة إلى شبهة المحل وشبهة الفعل، وانفرد الحنفية بشبهة العقد، والشافعية بشبهة الطريق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9913} وحث الشرع على اجتناب المشتبهات، والفقهاء يرتبون اجتنابها على مراتب، من الواجب إلى المكروه ترك اجتنابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916}"
  en: "In language shubha is likeness. In the technical sense it is what is not certainly known to be lawful or unlawful, or what resembles the established without being established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911} The Hanafis and Shafi'is divide shubha into shubhat al-mahall (in the object, ownership) and shubhat al-fi'l (in the act, a mistaken belief); the Hanafis add shubhat al-'aqd (in the contract's form) and the Shafi'is shubhat al-tariq (a disagreement of jurists). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9913} The law urges avoiding doubtful matters, and the jurists grade the avoidance from obligatory to disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916}"
