id: concept/shubha-doubt
class: concept
kind: legal
label:
  ar: "الشُّبْهة"
  en: "Shubha (doubt that averts a penalty, and avoiding doubtful matters)"
  es: "Shubha (duda que evita una pena y evita asuntos dudosos)"
  fr: "Shubha (le doute qui évite une sanction, et le fait d'éviter les choses douteuses)"
summary:
  ar: "الشبهة لغة المماثلة، واصطلاحا ما لم يتيقن كونه حراما أو حلالا، أو ما يشبه الثابت وليس بثابت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911} وقسم الحنفية والشافعية الشبهة إلى شبهة المحل وشبهة الفعل، وانفرد الحنفية بشبهة العقد، والشافعية بشبهة الطريق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9913} وحث الشرع على اجتناب المشتبهات، والفقهاء يرتبون اجتنابها على مراتب، من الواجب إلى المكروه ترك اجتنابه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916}"
  en: "In language shubha is likeness. In the technical sense it is what is not certainly known to be lawful or unlawful, or what resembles the established without being established. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911} The Hanafis and Shafi'is divide shubha into shubhat al-mahall (in the object, ownership) and shubhat al-fi'l (in the act, a mistaken belief); the Hanafis add shubhat al-'aqd (in the contract's form) and the Shafi'is shubhat al-tariq (a disagreement of jurists). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9913} The law urges avoiding doubtful matters, and the jurists grade the avoidance from obligatory to disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916}"
  es: "En el lenguaje, shubha significa semejanza. En el sentido técnico, es aquello que no se sabe con certeza si es lícito o ilícito, o aquello que se asemeja a lo establecido sin estar establecido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911} Los hanafíes y los shafiíes dividen shubha en shubhat al-mahall (en el objeto, propiedad) y shubhat al-fi'l (en el acto, creencia errónea); los hanafíes añaden shubhat al-'aqd (en la forma del contrato) y los shafiíes shubhat al-tariq (desacuerdo entre juristas). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9913} La ley insta a evitar asuntos dudosos, y los juristas clasifican la evitación desde obligatoria hasta desaconsejable. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9914} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9915} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916}"
  fr: "En langage courant, shubha signifie ressemblance. Au sens technique, il s'agit de ce qui n'est pas formellement établi comme licite ou illicite, ou de ce qui ressemble à ce qui est établi sans l'être. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9911} Les hanafites et les shafi'ites distinguent shubha en shubhat al-mahall (concernant l'objet, la propriété) et shubhat al-fi'l (concernant l'acte, une croyance erronée); les hanafites ajoutent shubhat al-'aqd (concernant la forme du contrat) et les shafi'ites shubhat al-tariq (un désaccord entre juristes). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9913} La loi recommande d'éviter les choses douteuses, et les juristes hiérarchisent cette recommandation, allant de l'obligation à la déconseillation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9916}"
