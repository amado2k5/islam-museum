id: concept/ihtisab
class: concept
kind: legal
label: { ar: "احتساب", en: "Counting for reward (ihtisab)", es: "Contar para obtener recompensa (ihtisab)", fr: "Compter pour la récompense (ihtisab)", ur: "ثواب کے لیے شمار کرنا ⁦(احتساب)⁩" }
summary:
  ar: "الاحتساب في الاصطلاح الفقهي أن يُعتد بالعمل ويُعتبر صحيحاً مقبولاً شرعاً، كأن يحتسب للمسبوق ركعة إن أدرك الركوع مع الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724} ويكون الاحتساب طلباً للثواب من الله، كالتنازل عن الحق طلباً لثوابه، كعتق الرقيق، والعفو عن القصاص دون مقابل، وإرضاع الصغير دون أجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724}"
  en: "In jurisprudence ihtisab means that an act is counted and accepted as valid by the law; for example, a latecomer is credited with a rak'a if he reaches the bowing with the imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724} It also means seeking reward from God, such as waiving one's right to earn God's reward, as in freeing a slave, pardoning retaliation without compensation, or suckling an infant without payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724}"
  es: "En jurisprudencia, ihtisab significa que un acto es contado y aceptado como válido por la ley; por ejemplo, a quien llega tarde se le acredita un rak'a si alcanza la reverencia con el imán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724} También significa buscar la recompensa de Dios, como renunciar al derecho a obtenerla, por ejemplo, al liberar a un esclavo, perdonar una represalia sin compensación o amamantar a un bebé sin recibir pago alguno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724}"
  fr: "En jurisprudence, l'ihtisab signifie qu'un acte est comptabilisé et reconnu comme valide par la loi; par exemple, une rak'a est créditée à celui qui arrive en retard s'il rejoint l'imam pour la prosternation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724} Cela signifie également rechercher la récompense divine, comme renoncer à son droit à cette récompense, par exemple en affranchissant un esclave, en pardonnant une vengeance sans compensation, ou en allaitant un nourrisson gratuitement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724}"
  ur: "فقہ میں احتصاب کا مطلب یہ ہے کہ کسی عمل کو قانون میں شمار کیا جاتا ہے اور اسے جائز تسلیم کیا جاتا ہے۔ مثال کے طور پر، دیر سے آنے والے کو ایک رکعت کا سہرا دیا جاتا ہے اگر وہ امام کے ساتھ رکوع تک پہنچے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1724} اس کا مطلب یہ بھی ہے کہ خدا سے اجر طلب کرنا، جیسے خدا کے اجر کمانے کے حق سے دستبردار ہونا، جیسے غلام آزاد کرنا، بدلہ معاف کرنا، بغیر معاوضہ کے معاف کرنا، یا بغیر معاوضہ کے بچے کو دودھ پلانا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1724}"
