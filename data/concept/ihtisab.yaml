label: { ar: "احتساب", en: "Counting for reward (ihtisab)" }
summary:
  ar: "الاحتساب في الاصطلاح الفقهي أن يُعتد بالعمل ويُعتبر صحيحاً مقبولاً شرعاً، كأن يحتسب للمسبوق ركعة إن أدرك الركوع مع الإمام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724} ويكون الاحتساب طلباً للثواب من الله، كالتنازل عن الحق طلباً لثوابه، كعتق الرقيق، والعفو عن القصاص دون مقابل، وإرضاع الصغير دون أجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724}"
  en: "In jurisprudence ihtisab means that an act is counted and accepted as valid by the law; for example, a latecomer is credited with a rak'a if he reaches the bowing with the imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724} It also means seeking reward from God, such as waiving one's right to earn God's reward, as in freeing a slave, pardoning retaliation without compensation, or suckling an infant without payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1724}"
