label: { ar: "الأمر", en: "Amr (command: forms, force and meaning in usul)" }
summary:
  ar: "الأمر في اللغة يأتي بمعنى الشأن والحال، وبمعنى طلب الفعل وهو نقيض النهي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3381} وصيغ الأمر الصريحة ثلاث: فعل الأمر، واسم فعل الأمر، والمضارع المقترن بلام الأمر، وله صيغ غير صريحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382} وصيغة افعل عند الجمهور حقيقة في الوجوب، وعند غيرهم في الندب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3383} ويقتضي الأمر الإجزاء عند امتثاله، ويرجح النهي على الأمر عند التعارض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3384}"
  en: "Amr in the lexical sense means a matter or a state of affairs, and a request to act, the opposite of a prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3381} Explicit forms of the command are three: the imperative verb, the imperative noun-form, and the present verb with the command-prefix; there are also implicit forms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382} The form do is, for the majority, a command to obligation, and for others to recommendation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3383} Carrying out a command validates it, and a prohibition takes precedence over a command in conflict. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3384}"
