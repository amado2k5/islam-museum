label: { ar: "الأمر", en: "Amr (command: forms, force and meaning in usul)", fr: "Amr (l’ordre : formes, portée et sens dans les usul)", es: "Amr (comando: formas, fuerza y significado en usul)" }
summary:
  ar: "الأمر في اللغة يأتي بمعنى الشأن والحال، وبمعنى طلب الفعل وهو نقيض النهي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3381} وصيغ الأمر الصريحة ثلاث: فعل الأمر، واسم فعل الأمر، والمضارع المقترن بلام الأمر، وله صيغ غير صريحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382} وصيغة افعل عند الجمهور حقيقة في الوجوب، وعند غيرهم في الندب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3383} ويقتضي الأمر الإجزاء عند امتثاله، ويرجح النهي على الأمر عند التعارض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3384}"
  en: "Amr in the lexical sense means a matter or a state of affairs, and a request to act, the opposite of a prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3381} Explicit forms of the command are three: the imperative verb, the imperative noun-form, and the present verb with the command-prefix; there are also implicit forms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382} The form do is, for the majority, a command to obligation, and for others to recommendation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3383} Carrying out a command validates it, and a prohibition takes precedence over a command in conflict. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3384}"
  fr: "Amr, au sens lexical, signifie une affaire ou un état de choses, et la demande d’agir, le contraire d’une interdiction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3381} Les formes explicites de l’ordre sont au nombre de trois : le verbe à l’impératif, le nom verbal d’impératif, et le verbe à l’inaccompli précédé du préfixe d’ordre ; il existe aussi des formes implicites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382} La forme « fais » est, pour la majorité, un ordre d’obligation, et pour d’autres de recommandation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3383} L’exécution d’un ordre le rend valide, et l’interdiction l’emporte sur l’ordre en cas de conflit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3384}"
  es: "Amr en el sentido léxico significa un asunto o un estado de cosas, y una solicitud de actuar, lo opuesto a una prohibición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3381} Las formas explícitas del mandato son tres: el verbo imperativo, la forma nominal imperativa y el verbo presente con el prefijo de mandato; también hay formas implícitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382} La forma do es, para la mayoría, un mandato de obligación, y para otros de recomendación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3382}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3383} Ejecutar un mandato lo valida, y una prohibición tiene precedencia sobre un mandato en conflicto. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3384}"
