summary:
  ar: "سمّاها مالك في الطير المعلّمة مع البازي والعقاب: ما صادت معلّمةً حلّ أكله، وإن أفلت الصيد من مخالبها ثم مات بعد التربص فلا يحل."
  en: "Malik named it with the goshawk and the eagle among trained birds: what it catches trained is lawful, but if the game escapes its talons and then dies while one could still have slaughtered it, it is not."
  ur: "امام مالک نے اسے سِکھائے پرندوں میں باز اور عقاب کے ساتھ گنا: سِکھلا ہوا اس کا شکار حلال ہے، لیکن اگر شکار اس کے پنجوں سے نکل کر مر جائے تو نہیں۔"
  es: "Malik la bautizó junto con el azor y el águila entre las aves entrenadas: lo que atrapa entrenada es lícito, pero si la presa escapa de sus garras y luego muere cuando aún se podría haberla sacrificado, no lo es."
  fr: "Malik l'a comparé à l'autour et à l'aigle parmi les oiseaux dressés: ce qu'il attrape dressé est licite, mais si le gibier échappe à ses serres et meurt alors qu'on aurait encore pu l'abattre, cela ne l'est pas."
  tr: "Malik, 'Al-Mu'allimah' kuşunda akbaba ve kartal ile birlikte şöyle demiştir: 'Ne yakalarsa marmela olur, yiyeceği yasaldır ve eğer av pençelerinden kaçıp pusuya düştüğünü kaybederse, bu yasaktır.'"
  id: "Malik menyebutnya dalam burung 'Al-Mu'allimah' bersama burung bangkai dan elang: 'Apa pun yang ditangkapnya adalah marmala, makanannya sah, dan jika buruan itu lolos dari cakarnya dan mati setelah disergap, maka tidak diperbolehkan.'"
