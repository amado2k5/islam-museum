label:
  ar: الخُلطة
  en: Khulta (joint and neighbourly mixing of property)
  ur: خُلطہ
summary:
  ar: 'الخُلطة لغة من الخلط، والخليط المخالط، والخلطة الشركة والعشرة. والخلطة في الفقه نوعان: خلطة الأعيان (وتسمى خلطة الاشتراك أو الشيوع) وهي أن يكون المال لاثنين أو أكثر على الشيوع فيبقى بحاله غير متميز، وخلطة الأوصاف (وتسمى خلطة الجوار) وهي أن يعرف مال كل منهما ويخلطاه في المرافق دون أن يتميز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} الحكم التكليفي: الخلطة في الأصل مباحة، وقد يحصل بها الرفق بأصحاب الأموال، كجمع الغنم عند راع واحد أو المزارعة باتحاد الماء والحراث. وقد نهي عن إظهار صورة الخلطة لتقليل الزكاة الواجبة، وعن إظهار صورة الانفراد لذلك، بحديث «لا يجمع بين متفرق ولا يفرق بين مجتمع خشية الصدقة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} أحكام الخلطة في الزكاة: الجمهور يرون لها تأثيرا في الزكاة، ويستدلون بحديث أنس «وما كان من خليطين فإنهما يتراجعان بينهما بالسوية»، مع خلاف في بعض الشروط وفي الأموال التي تؤثر فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} الخلطة في الزكاة: فسر الأزهري والشافعي حديث «لا يجمع بين متفرق خشية الصدقة» بمنع خلط المالين للتهرب من الواجب، وقال الحنفية لا أثر للخلطة مطلقا لأن الجمع والتفريق في الملك لا في الأمكنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7750}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7751} أوجه تأثير الخلطة: تكميل النصاب (الشافعية والحنابلة)، والقدر (زيادة أو نقصان)، والسن، والصنف، وقد لا تؤثر؛ ويجوز عند الشافعية والحنابلة أن يخرج أحد الخليطين عن خليطه بإذن أو بغير إذن على خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7751}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7752} الأموال التي تؤثر فيها الخلطة عند غير الحنفية: السائمة باتفاق؛ والزروع والثمار والعروض والنقود: الأظهر عند الشافعية تأثيرها، ومالك وأحمد في رواية وأكثر أهل العلم يرون أنها لا تؤثر إلا في الماشية، وخلطة الجوار في الزروع عند الأوزاعي وإسحاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7752}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7753} شروط التأثير: أن يكون لكل خليط نصاب تام عند المالكية، أو مجموع المالين نصابا عند الشافعية، والحنابلة لا يشترطون نصاب كل منهما؛ وأن يكونا من أهل الزكاة مسلمين أحرارا؛ ونية الخلطة شرط عند المالكية، والشافعية والحنابلة يرون أنها لا تؤثر؛ والاشتراك في المرافق: في الأنعام المشرع والمراح والمبيت والحلب والمسرح والمرعى والراعي والفحل، وتعدد الشروط عند كل مذهب؛ وفي الزروع والثمار: الناطور والجرين والماء والحراث والعامل ونحوها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7754}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7754}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7755} شرط الحول: الشافعية في الجديد والحنابلة يعتبرون الاختلاط طول الحول، والمالكية يعتبرون الاختلاط آخر الحول، وفي الزروع والثمار إلى زهو الثمار واشتداد الحب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7756} كيفية الإخراج: يعامل مال الخلطاء معاملة مال واحد، فللساعي أن يأخذ الفرض من أي المالين، ومن الصغار أو الكبار حسب الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7757} الترادّ فيما يأخذه الساعي: في خلطة الاشتراك لا إشكال، وفي خلطة الجوار يتراجع الخليطان بالنسبة العددية وبقيمة المأخوذ، ويعتبر ابن القاسم قيمة يوم الأخذ وأشهب يوم التراجع؛ وإن أخذ الساعي بغير حق متأولا تأويلا سائغا فحكمه كالأخذ بحق، وإن لم يكن متأولا فلا تراجع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7757} إذا أخذ الساعي بغير حق وغير متأول فلا يرجع المأخوذ منه على خليطه، لأن الأخذ مظلمة لا يرجع بها على غيره، وإذا أخذ سنا أكبر من الواجب رجع المأخوذ منه على خليطه بقيمة حصته من الفرق، لأن الزيادة ظلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}'
  en: 'Khulta is lexically mixing, and the partner is the mixer; in fiqh there are two kinds: mixing of things, called joint or common mixing, where property belongs to two or more in common and remains undivided, and mixing of attributes, called neighbourly mixing, where each owner\''s property is known and they use the same facilities without separation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} The ruling: mixing is lawful in itself and may ease the owners, as when the herds of a village go to one shepherd, or joint farming shares water and labour. The Prophet forbade showing a mixture to reduce zakat, or showing separation for that end, in the report that one does not join what is separate nor separate what is joined for fear of zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} On the effect of mixing on zakat: the majority hold it has an effect, citing the report of Anas that two mixing partners settle between them equally; the schools differ on some conditions and on which property is affected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} On the effect of mixing on zakat: al-Azhari and al-Shafii read the report "do not join the separate nor separate the joined for fear of zakat" as a ban on mixing to escape duty; the Hanafis hold that mixing has no effect, since joining or separating concerns ownership, not places. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7750}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7751} Ways mixing affects zakat: the completion of the minimum (Shafiis and Hanbalis), the number (more or less), the age, and the kind; the Shafiis and Hanbalis allow one partner to pay for the other with or without consent, on dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7751}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7752} Property affected outside the Hanafi school: livestock by agreement; for crops, fruit, trade goods and money the preferred Shafii view says mixing counts, while Malik, one report of Ahmad and most scholars say it counts only for livestock; al-Awza\''i and Ishaq allow neighbourly mixing for crops. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7752}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7753} Conditions: each partner must hold a full minimum (Malikis), or the joint property must reach it (Shafiis), while the Hanbalis do not require each to hold it; both must be Muslim free owners liable to zakat; intention is a condition for the Malikis and not for the Shafiis and Hanbalis; sharing of facilities: in livestock the watering place, the pen, the night shelter, the milking, the pasture, the herd and the stallion, with each school counting the required number; for crops the guard, the threshing floor, the water and the labour. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7754}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7754}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7755} Duration: the Shafiis in the new view and the Hanbalis require the mixing through the whole year; the Malikis require it at the end of the year; for crops, until the fruit ripens or the grain hardens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7756} Collection: partners are treated as one owner, so the collector may take the due from either property, and from the young or the old as the case requires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7757} Refunds between partners: in joint ownership there is no problem; in neighbourly mixing partners settle by number and by value of what was taken; Ibn al-Qasim takes the value on the day of taking, Ashhab on the day of settlement; if the collector wrongly took by a plausible interpretation, it is treated as rightful; if not, there is no refund. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7757} If the collector took without right and without a plausible interpretation, the one charged cannot recover from his partner, since the taking is a wrong the victim cannot pass on; if he took an older animal than due, the one charged recovers from his partner the value of his share of the difference, since the excess is wrong. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}'
  ur: 'خلطہ لغت میں ملانے کو کہتے ہیں اور خلیط ساتھ ملنے والے کو؛ فقہ میں دو قسمیں ہیں: خلطۃ الاعیان (شرکت یا شیوع) جس میں مال دو یا زیادہ کا مشترک ہو اور الگ نہ ہو، اور خلطۃ الاوصاف (جوار) جس میں ہر ایک کا مال معلوم ہو اور وہ بغیر تمیز کے چراگاہ، پانی یا دیگر سہولیات میں مشترک ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} حکم: خلطہ اصلاً مباح ہے اور اس سے مالکوں کو آسانی ہوتی ہے، جیسے گاؤں کی بکریاں ایک چرواہے کے پاس؛ زکوٰۃ کم کرنے کے لیے خلطہ ظاہر کرنا یا الگ ظاہر کرنا منع ہے، حدیث «لا يجمع بين متفرق ولا يفرق بين مجتمع خشية الصدقة» کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} زکوٰۃ پر خلطہ کا اثر: جمہور کے نزدیک اثر ہے، انس کی حدیث «وما كان من خليطين فإنهما يتراجعان بينهما بالسوية» سے استدلال؛ بعض شروط اور ان اموال میں جن پر اثر ہوتا ہے اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} زکوٰۃ پر خلطہ کا اثر: ابن الازہری اور شافعی حدیث «لا يجمع بين متفرق خشية الصدقة» کو زکوٰۃ سے بچنے کے لیے ملانے کی ممانعت پر محمول کرتے ہیں؛ حنفیہ خلطہ کا کوئی اثر نہیں مانتے کیونکہ جمع اور تفریق ملکیت میں ہوتی ہے، جگہ میں نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7750}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7751} اثر کی صورتیں: نصاب کی تکمیل (شافعیہ اور حنابلہ)، تعداد میں کمی یا زیادتی، عمر اور نوع؛ شافعیہ اور حنابلہ کے نزدیک ایک خلیط دوسرے کی طرف سے نکال سکتا ہے، اختلاف کے ساتھ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7751}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7752} حنفیہ کے علاوہ کن اموال پر اثر: مویشی باتفاق؛ کھیتی، پھل، سامانِ تجارت اور نقدی میں شافعیہ کا اظہر قول اثر کا ہے، جبکہ مالک، احمد کی ایک روایت اور اکثر علماء کے نزدیک صرف مویشی میں؛ اوزاعی اور اسحاق کھیتی میں جوار کی خلطہ کو مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7752}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7753} شرائط: مالکیہ کے نزدیک ہر خلیط کا مکمل نصاب ہو، شافعیہ کے نزدیک دونوں کا مجموعہ نصاب کو پہنچے، حنابلہ ہر ایک کا نصاب شرط نہیں کہتے؛ دونوں مسلمان، آزاد، زکوٰۃ کے اہل ہوں؛ نیت مالکیہ کے نزدیک شرط ہے، شافعیہ اور حنابلہ کے نزدیک نہیں؛ مشترک سہولیات: مویشی میں پانی کی جگہ، باڑا، رات کا ٹھکانہ، دودھ دوہنے کی جگہ، چراگاہ، چرواہا اور نر؛ کھیتی میں چوکیدار، کھلیان، پانی اور مزدوری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7753}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7754}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7754}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7755} مدت: شافعیہ کے جدید قول اور حنابلہ کے نزدیک پورے سال کی خلطہ شرط ہے، مالکیہ کے نزدیک سال کے آخر میں؛ کھیتی اور پھل میں پکنے اور دانے سخت ہونے تک۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7756} وصولی: خلیطین کو ایک مالک کی طرح سمجھا جاتا ہے، ساعی دونوں میں سے کسی کے مال سے فرض لے سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7756}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7757} ساعی کی وصولی کا تراجع: اشتراک میں کوئی مسئلہ نہیں؛ جوار میں عدد اور مالیت کی نسبت سے تراجع ہوتا ہے، ابن القاسم وصولی کے دن کی قیمت اور اشہب تراجع کے دن کی قیمت لیتے ہیں؛ ساعی نے غلط مگر سائغ تاویل سے لیا تو حق کی طرح، ورنہ تراجع نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7757} اگر ساعی نے بغیر حق اور بغیر سائغ تاویل کے لیا تو مأخوذ منہ اپنے خلیط سے واپس نہیں لے سکتا، کیونکہ یہ ظلم ہے جس کا بوجھ دوسرے پر نہیں ڈالا جا سکتا؛ اور اگر بڑا جانور لیا گیا تو مأخوذ منہ اپنے خلیط سے اپنے حصے کے فرق کی قیمت واپس لے گا، کیونکہ زیادتی ظلم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}'
