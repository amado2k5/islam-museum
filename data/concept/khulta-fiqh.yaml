label:
  ar: الخُلطة
  en: Khulta (joint and neighbourly mixing of property)
  ur: خُلطہ
summary:
  ar: 'الخُلطة لغة من الخلط، والخليط المخالط، والخلطة الشركة والعشرة. والخلطة في الفقه نوعان: خلطة الأعيان (وتسمى خلطة الاشتراك أو الشيوع) وهي أن يكون المال لاثنين أو أكثر على الشيوع فيبقى بحاله غير متميز، وخلطة الأوصاف (وتسمى خلطة الجوار) وهي أن يعرف مال كل منهما ويخلطاه في المرافق دون أن يتميز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} الحكم التكليفي: الخلطة في الأصل مباحة، وقد يحصل بها الرفق بأصحاب الأموال، كجمع الغنم عند راع واحد أو المزارعة باتحاد الماء والحراث. وقد نهي عن إظهار صورة الخلطة لتقليل الزكاة الواجبة، وعن إظهار صورة الانفراد لذلك، بحديث «لا يجمع بين متفرق ولا يفرق بين مجتمع خشية الصدقة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} أحكام الخلطة في الزكاة: الجمهور يرون لها تأثيرا في الزكاة، ويستدلون بحديث أنس «وما كان من خليطين فإنهما يتراجعان بينهما بالسوية»، مع خلاف في بعض الشروط وفي الأموال التي تؤثر فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749}'
  en: 'Khulta is lexically mixing, and the partner is the mixer; in fiqh there are two kinds: mixing of things, called joint or common mixing, where property belongs to two or more in common and remains undivided, and mixing of attributes, called neighbourly mixing, where each owner\''s property is known and they use the same facilities without separation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} The ruling: mixing is lawful in itself and may ease the owners, as when the herds of a village go to one shepherd, or joint farming shares water and labour. The Prophet forbade showing a mixture to reduce zakat, or showing separation for that end, in the report that one does not join what is separate nor separate what is joined for fear of zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} On the effect of mixing on zakat: the majority hold it has an effect, citing the report of Anas that two mixing partners settle between them equally; the schools differ on some conditions and on which property is affected. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749}'
  ur: 'خلطہ لغت میں ملانے کو کہتے ہیں اور خلیط ساتھ ملنے والے کو؛ فقہ میں دو قسمیں ہیں: خلطۃ الاعیان (شرکت یا شیوع) جس میں مال دو یا زیادہ کا مشترک ہو اور الگ نہ ہو، اور خلطۃ الاوصاف (جوار) جس میں ہر ایک کا مال معلوم ہو اور وہ بغیر تمیز کے چراگاہ، پانی یا دیگر سہولیات میں مشترک ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748} حکم: خلطہ اصلاً مباح ہے اور اس سے مالکوں کو آسانی ہوتی ہے، جیسے گاؤں کی بکریاں ایک چرواہے کے پاس؛ زکوٰۃ کم کرنے کے لیے خلطہ ظاہر کرنا یا الگ ظاہر کرنا منع ہے، حدیث «لا يجمع بين متفرق ولا يفرق بين مجتمع خشية الصدقة» کی بنا پر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7748}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749} زکوٰۃ پر خلطہ کا اثر: جمہور کے نزدیک اثر ہے، انس کی حدیث «وما كان من خليطين فإنهما يتراجعان بينهما بالسوية» سے استدلال؛ بعض شروط اور ان اموال میں جن پر اثر ہوتا ہے اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7749}'
