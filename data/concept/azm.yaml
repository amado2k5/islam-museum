label:
  ar: "العَزْم"
  en: "Resolve and its legal effect (azm)"
  ur: "عزم"
summary:
  ar: "العزم في اللغة عقد الضمير على الفعل، ويأتي بمعنى الصبر والمواظبة، وفي الاصطلاح ميل إلى الشيء وتصميم على فعله {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11595}. ويفرق بينه وبين الهمّ، فالهم أول العزم والعزم منتهى الهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596}. واتفق الفقهاء على أن الإنسان لا يعاقب على ما توسوس به نفسه من المعاصي ما لم يعمله أو يتكلم به، وعلى أن من هم بسيئة فلم يفعلها فلا عقاب عليه، وأن العزم على الحسنة يكتب حسنة قبل العمل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. واختلفوا في العزم المصمم على المعصية هل يؤاخذ به، فذهب بعضهم إلى عدم المؤاخذة، وذهب كثير من العلماء إلى المؤاخذة به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. ويشترط في صحة التوبة العزم الجازم على ألا يعود إلى المعصية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}. وتُذكر في الأصول مسائل العزم على أداء الواجب الموسع وعلى ترك المنهي عنه، وتفصيلها في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}."
  en: "In the lexicon, azm is the resolve of the heart to act, and it also means patience and perseverance. As a technical term it is an inclination to a thing with a settled intention to do it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11595}. Hamm is the first stage of azm, and azm is the end point of hamm {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596}. The jurists agree that a person is not punished for evil thoughts that he neither acts on nor speaks, and that one who resolves on an evil and does not do it incurs no penalty, while a resolve on a good act is recorded as a good deed before it is done {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. They differ on whether a firm resolve to commit a sin is itself punished: some say not, many scholars say yes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. A firm resolve never to return to the sin is a condition of repentance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}. Related questions on resolving to perform a wide-time obligation or to abstain from what is forbidden are treated in the legal theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}."
