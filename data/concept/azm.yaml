label:
  ar: "العَزْم"
  en: "Resolve and its legal effect (azm)"
  fr: "La résolution et ses effets juridiques (azm)"
  ur: "عزم"
  es: "Resolución y sus efectos jurídicos (azm)"
  tr: "Tork"
  id: "Torsi"
summary:
  ar: "العزم في اللغة عقد الضمير على الفعل، ويأتي بمعنى الصبر والمواظبة، وفي الاصطلاح ميل إلى الشيء وتصميم على فعله {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11595}. ويفرق بينه وبين الهمّ، فالهم أول العزم والعزم منتهى الهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596}. واتفق الفقهاء على أن الإنسان لا يعاقب على ما توسوس به نفسه من المعاصي ما لم يعمله أو يتكلم به، وعلى أن من هم بسيئة فلم يفعلها فلا عقاب عليه، وأن العزم على الحسنة يكتب حسنة قبل العمل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. واختلفوا في العزم المصمم على المعصية هل يؤاخذ به، فذهب بعضهم إلى عدم المؤاخذة، وذهب كثير من العلماء إلى المؤاخذة به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. ويشترط في صحة التوبة العزم الجازم على ألا يعود إلى المعصية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}. وتُذكر في الأصول مسائل العزم على أداء الواجب الموسع وعلى ترك المنهي عنه، وتفصيلها في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}."
  en: "In the lexicon, azm is the resolve of the heart to act, and it also means patience and perseverance. As a technical term it is an inclination to a thing with a settled intention to do it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11595}. Hamm is the first stage of azm, and azm is the end point of hamm {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596}. The jurists agree that a person is not punished for evil thoughts that he neither acts on nor speaks, and that one who resolves on an evil and does not do it incurs no penalty, while a resolve on a good act is recorded as a good deed before it is done {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. They differ on whether a firm resolve to commit a sin is itself punished: some say not, many scholars say yes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. A firm resolve never to return to the sin is a condition of repentance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}. Related questions on resolving to perform a wide-time obligation or to abstain from what is forbidden are treated in the legal theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}."
  fr: "Dans le lexique, azm est la résolution du cœur à agir ; il signifie aussi patience et persévérance. Techniquement, c’est une inclination accompagnée d’une intention arrêtée d’agir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11595}. Le hamm est le premier stade de l’azm, et l’azm l’aboutissement du hamm {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596}. Les juristes s’accordent à dire qu’une personne n’est pas punie pour de mauvaises pensées qu’elle ne met ni en actes ni en paroles ; celui qui se résout à un mal sans l’accomplir n’encourt aucune peine, tandis que la résolution d’une bonne action est inscrite comme telle avant son accomplissement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. Ils divergent sur le châtiment de la résolution ferme de pécher : certains le nient, de nombreux savants l’affirment {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. La ferme résolution de ne jamais revenir au péché est une condition du repentir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}. Les questions connexes de résolution d’accomplir une obligation au temps large ou de s’abstenir de l’interdit sont traitées dans l’annexe sur les fondements du droit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}."
  es: "En el léxico, azm es la resolución del corazón para actuar, y también significa paciencia y perseverancia. Como término técnico, es una inclinación hacia algo con la firme intención de hacerlo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11595}. Hamm es la primera etapa de azm, y azm es el punto final de hamm {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596}. Los juristas coinciden en que una persona no es castigada por malos pensamientos que ni lleva a cabo ni expresa, y que quien decide hacer algo malo pero no lo hace no incurre en castigo alguno, mientras que la decisión de hacer algo bueno se registra como una buena acción antes de que se realice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. Sin embargo, difieren en cuanto a si la firme decisión de cometer un pecado es castigada en sí misma: algunos afirman que no, muchos eruditos dicen que sí {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597}. La firme decisión de no volver jamás al pecado es condición para el arrepentimiento {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}. Las cuestiones relacionadas con la decisión de cumplir una obligación de amplio plazo o de abstenerse de lo prohibido se tratan en el apéndice de teoría jurídica {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598}."
  ur: "لغت میں عجم سے مراد عمل کرنے کا دل کا عزم ہے اور اس کے معنی صبر اور استقامت کے بھی ہیں۔ ایک تکنیکی اصطلاح کے طور پر یہ کسی چیز کی طرف مائل ہونا ہے جس کے کرنے کا ارادہ طے کیا گیا ہے حمام عجم کا پہلا مرحلہ ہے، اور عزم حمام کا آخری نقطہ ہے فقہاء اس بات پر متفق ہیں کہ کسی شخص کو برے خیالات کی سزا نہیں دی جاتی جس پر وہ نہ عمل کرتا ہے اور نہ بولتا ہے، اور جس نے برائی کا ارادہ کیا اور اس پر عمل نہیں کیا اس پر کوئی جرمانہ نہیں ہے، جب کہ کسی اچھے کام کا عزم اس کے انجام پانے سے پہلے ہی نیکی کے طور پر لکھا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 11597}۔ ان میں اس بات پر اختلاف ہے کہ کیا گناہ کرنے کا پختہ عزم خود ہی سزا دیتا ہے: کچھ کہتے ہیں نہیں، بہت سے علماء ہاں کہتے ہیں {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 11597}۔ گناہ کی طرف کبھی نہ لوٹنے کا پختہ عزم، توبہ کی شرط ہے ایک وسیع مدت کے فرض کو انجام دینے یا حرام چیزوں سے پرہیز کرنے کے حل سے متعلق سوالات کو قانونی نظریہ ضمیمہ میں بیان کیا گیا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11597}"
  tr: "Dilde 'Azm', fiile bağlı bir zamir olup sabır ve ısrar anlamına gelir. Teknik terminolojide, bir şeye eğilim ve onu yapma kararlılığı anlamına gelir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11595}. Bu, endişeyi endişeden ayırır; çünkü endişe kararlılığın başlangıcıdır ve kararlılık nihai kaygıdır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11596}. Hukukçular, bir kişinin işlemediği veya bahsetmediği günahlar için cezalandırılmadığını, kötü bir iş yapıp yapmayan kişinin cezalandırılmadığını, iyi bir eylem yapma niyetinin ise eylemden önce iyi bir eylem olarak kaydedildiğini kabul ettiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11597}. Günah işleme kararının hesap verip vermemesi konusunda farklı görüşler yaşadılar; bazıları bunun hesap vermediğini savunurken, birçok âlim bunu sorumlu tuttu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11597}. Tövbenin geçerliliği için, günaha geri dönmeme konusunda kesin kararlılık gereklidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11598}. İlkeler, genişletilmiş görevi yerine getirme ve yasaklı olanı terk etme kararlılığı konularından bahseder; bu konu Usuli ekinde {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11598} yer alır."
  id: "Dalam bahasa, 'Azm' adalah kata ganti yang melekat pada kata kerja, yang berarti kesabaran dan ketekunan. Dalam terminologi teknis, kata ini berarti kecenderungan terhadap sesuatu dan tekad untuk melakukannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11595}. Kata ini membedakannya dari kekhawatiran, karena kekhawatiran adalah awal dari penentuan, dan penentuan adalah kepedulian utama {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11596}. Para ahli hukum sepakat bahwa seseorang tidak dihukum atas dosa yang tidak dilakukan atau dibicarakan, dan bahwa siapa pun yang melakukan perbuatan buruk dan tidak melakukannya tidak dihukum, dan bahwa niat untuk berbuat baik dicatat sebagai perbuatan baik sebelum perbuatan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11596} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11597}. Mereka berbeda pendapat apakah tekad untuk melakukan dosa harus dimintai pertanggungjawaban; beberapa berpendapat bahwa keputusan itu tidak dimintai pertanggungjawaban, sementara banyak ulama menganggapnya bertanggung jawab {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11597}. Untuk keabsahan pertobatan, diperlukan tekad teguh untuk tidak kembali ke dosa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11598}. Prinsip-prinsip tersebut menyebutkan masalah tekad untuk memenuhi kewajiban yang diperluas dan meninggalkan apa yang dilarang, yang dijelaskan dalam lampiran Usuli {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11597} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11598}."
