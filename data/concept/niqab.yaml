label: { ar: "النِّقَاب", en: "Niqab (face veil)", ur: "نقاب (چہرہ چھپانا)" }
summary:
  ar: "النقاب في اللغة قناع تجعله المرأة على أنفها تستر به وجهها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15962} وهو مرتبط بعورة المرأة، وجمهور الفقهاء على أن الوجه ليس بعورة، فيجوز سترُه وكشفه، والمالكية يكرهون الانتقاب مطلقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15963} والمحرمة ممنوعة من النقاب بحديث ابن عمر، والنقاب في الصلاة مكروه عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15964} ولا ينعقد عند الحنفية نكاح المتنقبة إلا بمعرفة الشهود لها أو إشارتها، وفي الشهادة على المتنقبة تفصيل عند المالكية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15966}"
  en: "Niqab, in the lexicon, is a cover the woman puts over her nose to hide her face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15962} It is tied to the question of the woman's 'awra. Most jurists hold that the face is not 'awra, so covering or uncovering it is allowed, while the Malikis dislike the veil in all cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15963} A woman in ihram may not veil her face, on the hadith of Ibn Umar, and most jurists dislike the veil in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15964} For the Hanafis a marriage with a veiled woman is valid only if the witnesses know her or she is pointed out, and the Malikis and Shafi'is set conditions for testimony about a veiled woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15966}"
  ur: "نقاب لغت میں وہ پردہ ہے جو عورت ناک پر ڈال کر چہرہ چھپاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15962} جمہور کے نزدیک چہرہ عورت کی شرمگاہ نہیں، اس لیے اسے چھپانا اور کھولنا دونوں جائز ہیں، جبکہ مالکیہ نقاب کو ہر حال میں مکروہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15963} حالت احرام میں عورت کے لیے نقاب حرام ہے، اور نماز میں جمہور کے نزدیک مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15964} حنفیہ کے نزدیک نقاب والی عورت کا نکاح گواہوں کی شناخت یا اشارے سے درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15965}"
