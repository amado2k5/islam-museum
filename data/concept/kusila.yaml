  es: "Kusila (corteza de casia)"
summary:
  ar: "الكسيلا قشر عيدان كالفوة يعلوه سواد، وهو عند الكتاب حار رطب في حدود الأولى، مغر يكسر قوة الأدوية الحارة كالصمغ، ويُقال إنه مسمن يحسن اللون والبشرة."
  en: "Kusila is the bark of sticks, like fuwa, with a dark overlay. The book classes it as warm and moist at about the first degree; it is a softening agent that breaks down the force of hot medicines such as gum, and it is said to fatten and improve the complexion."
  ur: "کسیلا لکڑی کی چھال ہے جو فوہ جیسی ہے اور اس پر سیاہی ہوتی ہے۔ کتاب اسے پہلے درجے کے قریب گرم اور تر بتاتی ہے؛ یہ ایسی نرم کرنے والی دوا ہے جو صمغ جیسی گرم دواؤں کی قوت توڑتی ہے، اور کہا جاتا ہے کہ یہ جسم بھرتی اور رنگت بہتر کرتی ہے۔"
  es: "Kusila es la corteza de las ramas, como el fuwa, con una capa oscura. El libro la clasifica como cálida y húmeda, de grado aproximadamente 1; es un agente suavizante que atenúa la fuerza de las medicinas calientes como la goma, y se dice que engorda y mejora la tez."
