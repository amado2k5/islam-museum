  ar: "يذكر ابن سينا عرقين على البطن أحدهما على الكبد والآخر على الطحال، ثم يقسم أوقات الفصد وقتين، وقت اختيار وقت ضرورة {cite:canon-ibn-sina-print-v1 pp.298-299}."
  en: "Ibn Sina names two vessels on the belly, one over the liver and the other over the spleen, then divides the times of venesection into two, a time of choice and a time of necessity {cite:canon-ibn-sina-print-v1 pp.298-299}."
  fr: "Ibn Sina nomme deux vaisseaux abdominaux, l’un au-dessus du foie et l’autre de la rate, puis distingue le moment choisi de la saignée de celui de nécessité {cite:canon-ibn-sina-print-v1 pp.298-299}."
