id: concept/canon-abdominal-veins-and-the-times-of-venesection
class: concept
kind: scientific
label:
  ar: "عروق البطن وأوقات الفصد عند ابن سينا"
  en: "The abdominal veins and the times of venesection in the Canon"
  fr: "Veines abdominales et moments de la saignée dans le Canon"
  ur: "قانون میں پیٹ کی رگیں اور فصد کے اوقات"
  es: "Las venas abdominales y los momentos de la flebotomía en el Canon"
  tr: "İbn Sina'ya göre Karın Venleri ve Flebit Süreleri"
  id: "Pembuluh darah abdomen dan waktu flebitis menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا عرقين على البطن أحدهما على الكبد والآخر على الطحال، ثم يقسم أوقات الفصد وقتين، وقت اختيار وقت ضرورة {cite:canon-ibn-sina-print-v1 pp.298-299}."
  en: "Ibn Sina names two vessels on the belly, one over the liver and the other over the spleen, then divides the times of venesection into two, a time of choice and a time of necessity {cite:canon-ibn-sina-print-v1 pp.298-299}."
  fr: "Ibn Sina nomme deux vaisseaux abdominaux, l’un au-dessus du foie et l’autre de la rate, puis distingue le moment choisi de la saignée de celui de nécessité {cite:canon-ibn-sina-print-v1 pp.298-299}."
  es: "Ibn Sina nombra dos vasos en el vientre, uno sobre el hígado y el otro sobre el bazo, y luego divide los momentos de la venesección en dos, un momento de elección y un momento de necesidad {cite:canon-ibn-sina-print-v1 pp.298-299}."
  ur: "ابن سینا نے پیٹ پر دو برتنوں کا نام لیا ہے، ایک جگر پر اور دوسرا تلی پر، پھر نس بندی کے اوقات کو دو حصوں میں تقسیم کرتا ہے، ایک انتخاب کا وقت اور ایک وقت کا۔"
  tr: "İbn Sina, karın bölgesinde iki damardan bahseder; biri karaciğerde, diğeri dalakta, ardından flebizizm dönemlerini iki zamana ayırır: zorunluluk zamanı seçme zamanı {cite:canon-ibn-sina-print-v1 s.298-299}."
  id: "Ibn Sina menyebutkan dua vena di perut, satu di hati dan satu lagi di limpa, lalu membagi periode flebitisme menjadi dua kali: waktu memilih waktu kebutuhan {cite:canon-ibn-sina-print-v1 hlm.298-299}."
