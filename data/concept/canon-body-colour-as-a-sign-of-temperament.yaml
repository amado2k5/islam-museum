label:
  ar: "لون البدن دليلاً على المزاج عند ابن سينا"
  en: "Body colour as a sign of temperament in the Canon"
  fr: "Couleur corporelle et tempérament dans le Canon"
  ur: "بدن کا رنگ بطور علامتِ مزاج، قانون کے مطابق"
  es: "El color del cuerpo como signo de temperamento en el Canon"
summary:
  ar: "يعدد ابن سينا دلالات ألوان البدن على المزاج: البياض، والحمرة، والصفرة والشقرة، والكمودة، والباذنجاني، والجصي، والرصاصي، والعاجي، ثم دلالة لوني اللسان والعين {cite:canon-ibn-sina-print-v1 p.160}."
  en: "Ibn Sina lists what the colours of the body show about temperament: white, red, yellow and fair, dusky, aubergine, lime-white, leaden and ivory, then the colour of the tongue and of the eye {cite:canon-ibn-sina-print-v1 p.160}."
  fr: "Ibn Sina interprète les couleurs corporelles : blanc, rouge, jaune et clair, sombre, aubergine, blanc de chaux, plombé, ivoire, puis couleurs de la langue et de l’œil {cite:canon-ibn-sina-print-v1 p.160}."
  es: "Ibn Sina enumera lo que los colores del cuerpo muestran sobre el temperamento: blanco, rojo, amarillo y claro, moreno, berenjena, blanco lima, plomizo y marfil, luego el color de la lengua y del ojo {cite:canon-ibn-sina-print-v1 p.160}."
