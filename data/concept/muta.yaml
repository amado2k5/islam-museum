label: { ar: "نكاح المتعة" }
summary:
  ar: "نكاح المتعة زواج إلى أجل بأجر؛ يجمع أحمد أمين طرفاً من الأحاديث الواردة فيها: رخصة ابن مسعود في الغزو بلا نساء، وإذن النبي عام أوطاس ثلاثة أيام ثم النهي، ورخصة فتح مكة ثم التحريم — فالظاهر أن النبي أجازها في بعض الأوقات وعند الحاجة ثم حرمت، وأكد عمر بن الخطاب تحريمها في خلافته وانقطع الخلاف بإجماع الأئمة الأربعة وفقهاء الأمصار ما عدا فقهاء الشيعة؛ فقد حُكي عن علي والباقر والصادق حلها، وفي الكافي أن الباقر قال أحلّها الله في كتابه وسنة نبيه فهي حلال إلى يوم القيامة، والشيعة يستعملونها إلى الآن وأكثر ما يستعملونها في الأسفار {cite:duha-islam p. 883-886}."
  en: "Mut'a — fixed-term marriage for a fee; Ahmad Amin surveys the hadiths (licensed in travel and need, then forbidden, with Umar's emphatic prohibition and the four imams' ijma') against the Shi'i retention via al-Baqir and al-Sadiq {cite:duha-islam p. 883-886}."
