id: concept/al-matn-al-ilmi
class: concept
kind: term
label:
  ar: المتن العلمي
  en: Scientific matn (condensed school text)
  es: "Materia científica (texto escolar condensado)"
  fr: "Manuel scientifique (texte scolaire condensé)"
  ur: "سائنٹیفک میٹ ⁦(کنڈینسڈ اسکول ٹیکسٹ)⁩"
  tr: "Bilimsel Metin"
  id: "Teks Ilmiah"
summary:
  ar: "مختصر في فن من فنون العلم يُضبط مسائله في عبارة موجزة تُحفظ ثم تُشرح على يد شيخ؛ نشأ عند المتأخرين لضبط الموضوعات وتسهيل الحفظ، وأثار جدلاً حول أثره في التعليم {cite:al-mutun-al-ilmiyya-azhar p. 62}."
  en: "A condensed text in a branch of knowledge, its matters fixed in a short wording to be memorised and explained by a teacher; it arose among later scholars to order subjects and ease memorising, and it has been debated for its effect on teaching."
  es: "Un texto condensado de una rama del conocimiento, cuyo contenido está expuesto de forma breve para ser memorizado y explicado por un profesor; surgió entre los estudiosos posteriores para ordenar las materias y facilitar la memorización, y se ha debatido sobre su efecto en la enseñanza."
  fr: "Un texte condensé dans une branche du savoir, dont les sujets sont présentés de manière concise pour être mémorisés et expliqués par un enseignant; il est apparu plus tard parmi les érudits pour organiser les matières et faciliter la mémorisation, et son effet sur l'enseignement a fait l'objet de débats."
  ur: "علم کی ایک شاخ میں ایک گاڑھا متن، اس کے معاملات کو ایک مختصر الفاظ میں طے کیا جاتا ہے جس کو ایک استاد کے ذریعہ حفظ اور بیان کیا جائے؛ یہ بعد کے علماء کے درمیان مضامین کو ترتیب دینے اور حفظ کرنے میں آسانی پیدا کرنے کے لیے پیدا ہوا، اور اس پر تدریس پر اس کے اثرات کے لیے بحث کی گئی ہے۔"
  tr: "Bilgi dallarından birinde, konularını ezberleyip bir şeyh tarafından açıklanan kısa bir ifadeyle açıklayan bir kısa özet; bu özet, sonraki alimler arasında konuları netleştirmek ve ezberlemeyi kolaylaştırmak için ortaya çıkmış ve eğitim üzerindeki etkisi hakkında tartışmalara yol açmıştır {cite:al-mutun-al-ilmiyya-azhar s. 62}."
  id: "Dalam salah satu bidang pengetahuan, ringkasan singkat yang menjelaskan topik dengan menghafal dan menjelaskannya dengan pernyataan singkat dari seorang sheikh; ringkasan ini muncul di kalangan sarjana berikutnya untuk memperjelas topik dan memudahkan hafalan, memicu perdebatan tentang dampaknya terhadap pendidikan {cite:al-mutun-al-ilmiyya-azhar hlm. 62}."
