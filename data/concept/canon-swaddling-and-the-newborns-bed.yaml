id: concept/canon-swaddling-and-the-newborns-bed
class: concept
kind: scientific
label: { ar: "القماط وبيت المولود ومرقده", en: "Swaddling and the newborn's room and bed", ur: "لپیٹنا، نومولود کا کمرہ اور بستر", es: "El arrullo y la habitación y cama del recién nacido", fr: "L'emmaillotage, la chambre et le lit du nouveau-né", tr: "Kundak, yenidoğanın evi ve yatağı", id: "Pembungkus, rumah bayi yang baru lahir, dan tempat tidurnya" }
summary:
  ar: "يصف ابن سينا قماط المولود: تبدأ القابلة فتمس أعضاءه بالرفق وتشكلها، ثم يقمط وينوم في بيت معتدل الهواء مائل إلى الظل، ورأسه أعلى من جسده، مع الحذر من لي العنق والأطراف والصلب {cite:canon-ibn-sina-print-v1 p.204}."
  en: "Ibn Sina describes swaddling the newborn: the midwife first handles its limbs gently and shapes them, then swaddles it and lays it in a room of balanced air leaning to shade, with the head higher than the body, taking care that the bed does not twist the neck, limbs or spine {cite:canon-ibn-sina-print-v1 p.204}."
  es: "Ibn Sina describe cómo envolver al recién nacido: la partera primero manipula sus extremidades con delicadeza y les da forma, luego lo envuelve y lo acuesta en una habitación con aire equilibrado, inclinada hacia la sombra, con la cabeza más alta que el cuerpo, teniendo cuidado de que la cama no le tuerza el cuello, las extremidades o la columna vertebral {cite:canon-ibn-sina-print-v1 p.204}."
  fr: "Ibn Sina décrit l'emmaillotage du nouveau-né: la sage-femme manipule d'abord ses membres avec douceur et les façonne, puis l'emmaillote et le couche dans une pièce à l'air équilibré penchée vers l'ombre, la tête plus haute que le corps, en veillant à ce que le lit ne torde pas le cou, les membres ou la colonne vertébrale {cite:canon-ibn-sina-print-v1 p.204}."
  ur: "ابن سینا نے نوزائیدہ کو لپیٹنے کے بارے میں کہا ہے: دایہ پہلے اپنے اعضاء کو نرمی سے سنبھالتی ہے اور ان کی شکلیں بناتی ہے، پھر اسے لپیٹ کر متوازن ہوا کے کمرے میں سایہ کی طرف جھکتی ہے، جس کا سر جسم سے اونچا ہوتا ہے، اس بات کا خیال رکھتے ہوئے کہ بستر گردن، اعضاء یا ریڑھ کی ہڈی کو نہ مروڑے۔ صفحہ 204}۔"
  tr: "İbn Sina, yenidoğanın kundaklamasını şöyle anlatır: ebe nazikçe organlarına dokunmaya ve şekillendirmeye başlar, ardından sütten kesilir ve başı vücudunun üzerinde kalkmış, boyun ve uzuv burkulması ile sertliğe karşı temkinli bir şekilde gölgeye eğilen orta havalı bir evde uyuyur {cite:canon-ibn-sina-print-v1 s.204}."
  id: "Ibn Sina menggambarkan bedong bayi baru lahir: bidan mulai menyentuh dan membentuk organ-organ bayi dengan lembut, lalu ia disapih dan tidur di rumah yang cukup lapang, condong ke arah teduh, dengan kepala terangkat di atas tubuh, dengan hati-hati terhadap putaran leher dan anggota tubuh serta kekakuan {cite:canon-ibn-sina-print-v1 hlm.204}."
