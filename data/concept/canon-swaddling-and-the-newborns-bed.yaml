summary:
  ar: "يصف ابن سينا قماط المولود: تبدأ القابلة فتمس أعضاءه بالرفق وتشكلها، ثم يقمط وينوم في بيت معتدل الهواء مائل إلى الظل، ورأسه أعلى من جسده، مع الحذر من لي العنق والأطراف والصلب {cite:canon-ibn-sina-print-v1 p.204}."
  en: "Ibn Sina describes swaddling the newborn: the midwife first handles its limbs gently and shapes them, then swaddles it and lays it in a room of balanced air leaning to shade, with the head higher than the body, taking care that the bed does not twist the neck, limbs or spine {cite:canon-ibn-sina-print-v1 p.204}."
