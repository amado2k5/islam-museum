id: concept/snow-ice-and-mineral-waters
class: concept
kind: scientific
label: { ar: "مياه الثلج والجمد والمعادن عند ابن سينا", en: "Snow, ice and mineral waters in the Canon", ur: "قانون میں برف، جمد اور معدنی پانی", es: "Nieve, hielo y aguas minerales en el Cañón", fr: "Neige, glace et eaux minérales dans le Canon", tr: "İbn Sina'ya göre buz, don ve mineraller", id: "Es, Pembekuan, dan Mineral menurut Ibn Sina" }
summary:
  ar: "يقول ابن سينا إن المياه التي يخالطها جوهر معدني، والمياه العلقية، كلها أردأ، لكن في بعضها منافع. وإن الجمد والثلج إذا كان نقياً غير مخالط لقوة رديئة فهو صالح، سواء حلل ماء أو برد به الماء من خارج أو ألقي فيه، إلا أنه أكثف من سائر المياه ويتضرر به صاحب وجع العصب، وإذا طبخ عاد إلى الصلاح {cite:canon-ibn-sina-print-v1 p.137}."
  en: "Ibn Sina says waters mixed with a mineral substance, and leech waters, are all poorer, though some have benefits. Snow and ice, when pure and not mixed with a bad power, are fit, whether melted into water, used to cool water from outside, or dropped into it; but they are coarser than other waters and harm one with nerve pain, and when boiled they return to being fit {cite:canon-ibn-sina-print-v1 p.137}."
  es: "Ibn Sina afirma que las aguas mezcladas con sustancias minerales y las aguas de sanguijuelas son todas de menor calidad, aunque algunas tienen beneficios. La nieve y el hielo, cuando son puros y no están mezclados con ninguna fuerza negativa, son aptos, ya sea derretidos en agua, usados para enfriar agua desde el exterior o arrojados a ella; pero son más ásperos que otras aguas y causan dolor nervioso, y al hervirlos recuperan su potabilidad {cite:canon-ibn-sina-print-v1 p.137}."
  fr: "Ibn Sina affirme que les eaux mélangées à une substance minérale et les eaux de sangsues sont toutes de moindre qualité, bien que certaines présentent des bienfaits. La neige et la glace, lorsqu'elles sont pures et non mêlées à une force néfaste, sont bonnes, qu'elles soient fondues dans l'eau, utilisées pour refroidir l'eau extérieure ou jetées dedans; mais elles sont plus grossières que les autres eaux et peuvent causer des douleurs nerveuses. Une fois bouillies, elles retrouvent leurs propriétés bénéfiques {cite:canon-ibn-sina-print-v1 p.137}."
  ur: "ابن سینا کا کہنا ہے کہ معدنی مادے کے ساتھ ملا ہوا پانی اور جونک کا پانی، سب غریب تر ہوتے ہیں، حالانکہ کچھ کے فائدے ہوتے ہیں۔ برف اور برف، جب خالص اور بری طاقت کے ساتھ نہ ملی ہو، فٹ ہوتی ہے، چاہے پانی میں پگھلائی جائے، باہر سے پانی کو ٹھنڈا کرنے کے لیے استعمال کیا جائے، یا اس میں گرایا جائے۔ لیکن یہ دوسرے پانیوں سے زیادہ موٹے ہوتے ہیں اور اعصابی درد سے نقصان پہنچاتے ہیں، اور جب ابالتے ہیں تو وہ فٹ ہو جاتے ہیں"
  tr: "İbn Sina, mineral maddeyle karıştırılmış su ile askıda suyun hepsinin daha kötü olduğunu, ancak bazılarının faydaları olduğunu söyler. Eğer inert ve buz saf ve zayıf güçle karıştırılmamışsa, ister çözünsünler, ister dışarıdan suyu soğutmak için kullanılsınlar, ister içine atılsınlar, ancak diğer sulardan daha yoğundurlar ve sinir ağrısı çeken kişiye zarar verirler. Pişirildiğinde, iyiliğe geri döner {cite:canon-ibn-sina-print-v1 s.137}."
  id: "Ibn Sina mengatakan bahwa air yang dicampur dengan zat mineral dan air tersuspensi semuanya lebih buruk, tetapi beberapa memiliki manfaat. Jika inert dan es murni dan tidak bercampur dengan kekuatan yang buruk, mereka baik, baik dilarutkan atau digunakan untuk mendinginkan air dari luar atau dibuang ke dalamnya, tetapi mereka lebih kental daripada air lain dan membahayakan orang yang mengalami nyeri saraf. Jika dimasak, air itu kembali menjadi baik {cite:canon-ibn-sina-print-v1 hlm.137}."
