tags: [madhahib-browser, mh-mafahim]
label:
  ar: "الدليل ⁦(في أصول الفقه)⁩"
  en: "Dalil (evidence in the principles of jurisprudence)"
  ur: "دلیل ⁦(اصولِ فقہ میں)⁩"
  es: "Dalil (prueba en los principios de la jurisprudencia)"
  fr: "Dalil (preuve dans les principes de la jurisprudence)"
summary:
  ar: "الدليل في اللغة المرشد والكاشف، وفي الاصطلاح ما يُتوصل بصحيح النظر فيه إلى العلم بمطلوب خبري ولو ظنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8230} الأدلة المتفق عليها في إثبات الأحكام أربعة هي الكتاب والسنة والإجماع والقياس، والمختلف فيها كثيرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8231} وتنقسم الأدلة السمعية من حيث الثبوت والدلالة إلى أربعة أقسام، ويرتب الحنفية على ذلك ثبوت الفرض والواجب والمستحب بقدر قوة الدليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8232}"
  en: "In lexicon a dalil is a guide or a revealer; as a term it is what, through sound reasoning, leads to knowledge of a factual aim, even if only probable, though some restrict it to the certain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8230} The four sources agreed for establishing rulings are the Qur'an, the Sunna, consensus and analogy; the disputed sources are many. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8231} Scriptural evidence divides into four classes by certainty of transmission and of meaning, and the Hanafi jurists tie the strength of a ruling to the strength of its evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8232}"
  ur: "لغت میں دلیل رہنما اور ظاہر کرنے والی چیز ہے، اصطلاح میں وہ چیز جس کے صحیح غور و فکر سے کسی خبری مطلوب کا علم حاصل ہو، خواہ وہ گمان ہی کیوں نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8230} احکام ثابت کرنے کے متفق علیہ دلائل چار ہیں: کتاب، سنت، اجماع اور قیاس۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8231}"
  es: "En léxico, un dalil es un guía o un revelador; como término, es aquello que, mediante un razonamiento sólido, conduce al conocimiento de un objetivo fáctico, aunque solo sea probable, si bien algunos lo restringen a lo cierto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8230} Las cuatro fuentes consensuadas para establecer dictámenes son el Corán, la Sunna, el consenso y la analogía; las fuentes controvertidas son numerosas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8231} La evidencia escritural se divide en cuatro clases según la certeza de su transmisión y de su significado, y los juristas hanafíes vinculan la fuerza de un dictamen a la fuerza de su evidencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8232}"
  fr: "En langage courant, un dalil est un guide ou un révélateur; en tant que terme, il désigne ce qui, par un raisonnement rigoureux, permet d’atteindre la connaissance d’un but factuel, même probable, bien que certains la limitent à la certitude. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8230} Les quatre sources reconnues pour établir les décisions sont le Coran, la Sunna, le consensus et l’analogie; les sources contestées sont nombreuses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8231} Les preuves scripturaires se répartissent en quatre catégories selon la certitude de leur transmission et de leur signification, et les juristes hanafites lient la force d’une décision à la force de ses preuves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8232}"
