id: concept/dalil-usul
class: concept
kind: doctrine
label:
  ar: "الدليل (في أصول الفقه)"
  en: "Dalil (evidence in the principles of jurisprudence)"
  ur: "دلیل (اصولِ فقہ میں)"
summary:
  ar: "الدليل في اللغة المرشد والكاشف، وفي الاصطلاح ما يُتوصل بصحيح النظر فيه إلى العلم بمطلوب خبري ولو ظنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8230} الأدلة المتفق عليها في إثبات الأحكام أربعة هي الكتاب والسنة والإجماع والقياس، والمختلف فيها كثيرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8231} وتنقسم الأدلة السمعية من حيث الثبوت والدلالة إلى أربعة أقسام، ويرتب الحنفية على ذلك ثبوت الفرض والواجب والمستحب بقدر قوة الدليل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8232}"
  en: "In lexicon a dalil is a guide or a revealer; as a term it is what, through sound reasoning, leads to knowledge of a factual aim, even if only probable, though some restrict it to the certain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8230} The four sources agreed for establishing rulings are the Qur'an, the Sunna, consensus and analogy; the disputed sources are many. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8231} Scriptural evidence divides into four classes by certainty of transmission and of meaning, and the Hanafi jurists tie the strength of a ruling to the strength of its evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8232}"
  ur: "لغت میں دلیل رہنما اور ظاہر کرنے والی چیز ہے، اصطلاح میں وہ چیز جس کے صحیح غور و فکر سے کسی خبری مطلوب کا علم حاصل ہو، خواہ وہ گمان ہی کیوں نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8230} احکام ثابت کرنے کے متفق علیہ دلائل چار ہیں: کتاب، سنت، اجماع اور قیاس۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8231}"
