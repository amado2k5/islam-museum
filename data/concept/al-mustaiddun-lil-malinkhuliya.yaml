id: concept/al-mustaiddun-lil-malinkhuliya
class: concept
kind: scientific
label:
  ar: "المستعدون للمالنخوليا"
  en: "Those prone to melancholia"
  fr: "Ceux qui sont enclins à la mélancolie"
  ur: "مالنخولیا کے مستعد لوگ"
summary:
  ar: "يذكر ابن سينا من يستعد للمالنخوليا بمزاجه وهيئته وسنه وفصله، ومن يقل عنده، وأن المستعد يصير إليها بسرعة إذا أصابه خوف أو غم أو سهر، مع ألفاظ مطبوعة تُنقل كما طُبعت ولا تُفسَّر {cite:canon-ibn-sina-print-v2 p.105}"
  en: "Ibn Sina lists who is prone to melancholia by temperament, build, age and season, and who is less so, and says the prone person turns to it quickly when fear, grief or sleeplessness strikes him; some printed words are carried as printed and not interpreted {cite:canon-ibn-sina-print-v2 p.105}"
  fr: "Ibn Sina énumère qui est enclin à la mélancolie par le tempérament, la constitution, l'âge et la saison, et qui l'est moins, et dit que la personne encline y tombe rapidement lorsque la frayeur, le chagrin ou l'insomnie la frappe ; certains mots imprimés sont repris tels qu'imprimés et ne sont pas interprétés {cite:canon-ibn-sina-print-v2 p.105}"
  ur: "ابن سینا بتاتا ہے کہ مزاج، ہیئت، عمر اور موسم کے لحاظ سے کون مالنخولیا کا مستعد ہے اور کس میں کم ہوتا ہے، اور یہ کہ مستعد شخص خوف، غم یا بے خوابی پہنچنے پر جلد اس کی طرف جاتا ہے؛ کچھ الفاظ جیسے چھپے ہیں ویسے نقل کیے گئے ہیں اور ان کی تفسیر نہیں کی گئی {cite:canon-ibn-sina-print-v2 p.105}۔"
