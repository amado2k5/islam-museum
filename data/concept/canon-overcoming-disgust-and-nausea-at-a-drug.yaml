summary:
  ar: "يذكر ابن سينا حيلاً لمن يعاف الدواء أو يخاف الغثيان: تشمم النعناع والسذاب والكرفس والسفرجل، وسد المنخرين، ومضغ الطرخون، وتلويث الحب بالعسل أو السكر، ومسحه بالقيروطي، أو بلعه بعد ملء الفم ماء {cite:canon-ibn-sina-print-v1 p.280}."
  en: "Ibn Sina gives devices for someone who loathes a drug or fears nausea: smelling mint, rue, celery and quince, stopping the nostrils, chewing tarragon, coating pills in honey or sugar, smearing them with cerate, or swallowing them after filling the mouth with water {cite:canon-ibn-sina-print-v1 p.280}."
