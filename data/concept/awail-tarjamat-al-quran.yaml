label:
  ar: "أوائل ترجمات القرآن: سلمان الفارسي وروبرت الكيتوني وألكسندر روس"
  en: "The first translations of the Qur'an: Salman al-Farisi, Robert of Ketton and Alexander Ross"
  ur: "قرآن کے اولین تراجم: سلمان فارسی، رابرٹ آف کیٹن اور الیگزینڈر راس"
  fr: "Les premières traductions du Coran : Salman al-Farisi, Robert de Ketton et Alexander Ross"
  es: "Las primeras traducciones del Corán: Salman al-Farisi, Roberto de Ketton y Alexander Ross"
  tr: "Kur'an'ın en erken çevirileri: Salman al-Farsi, Robert al-Kittouni ve Alexander Ross"
  id: "Terjemahan awal Al-Qur'an: Salman al-Farsi, Robert al-Kittouni, dan Alexander Ross"
summary:
  ar: "تذكر كتب الحنفية أن سلمان الفارسي ترجم الفاتحة بالفارسية في القرن السابع الميلادي لمن أسلم من الفرس، وتُعد ترجمة روبرت الكيتوني اللاتينية، التي أنجزها سنة 1143م برعاية بطرس المبجّل رئيس دير كلوني وطُبعت أول مرة في بازل سنة 1543م على يد ثيودور بيبلياندر، أول ترجمة إلى لغة أوروبية غربية. وأول ترجمة إنجليزية كاملة هي ترجمة ألكسندر روس سنة 1649م، وقد أُخذت من الترجمة الفرنسية لأندريه دو ريير سنة 1647م لا من العربية."
  en: "Hanafi sources report that Salman al-Farisi translated al-Fatiha into Persian in the seventh century CE for Persians who had become Muslim; Robert of Ketton's Latin translation, completed in 1143 under the patronage of Peter the Venerable, Abbot of Cluny, and first printed in Basel in 1543 by Theodor Bibliander, is described as the first into a Western European language; and the first complete English version, Alexander Ross's of 1649, was made not from Arabic but from André Du Ryer's French of 1647."
  ur: "حنفی مصادر بتاتے ہیں کہ سلمان فارسی نے ساتویں صدی عیسوی میں اسلام لانے والے فارسیوں کے لیے فاتحہ کا فارسی ترجمہ کیا؛ رابرٹ آف کیٹن کا لاطینی ترجمہ، جو 1143ء میں کلونی کے ابٹ پیٹر ایلندہ کی سرپرستی میں مکمل ہوا اور پہلی بار 1543ء میں بازل میں تھیوڈور بیبلیاندر کے ہاتھوں چھپا، مغربی یورپی زبان میں پہلا ترجمہ بتایا جاتا ہے؛ اور پہلا مکمل انگریزی ترجمہ الیگزینڈر راس کا 1649ء کا ہے جو عربی سے نہیں بلکہ آندرے دو ریر کے 1647ء کے فرانسیسی ترجمے سے کیا گیا۔"
  fr: "Les sources hanafites rapportent que Salman al-Farisi traduisit al-Fatiha en persan au VIIe siècle pour des Persans devenus musulmans ; la traduction latine de Robert de Ketton, achevée en 1143 sous le patronage de Pierre le Vénérable, abbé de Cluny, et imprimée pour la première fois à Bâle en 1543 par Theodor Bibliander, est décrite comme la première dans une langue d'Europe occidentale ; et la première version anglaise complète, celle d'Alexander Ross en 1649, ne fut pas faite d'après l'arabe mais d'après le français d'André Du Ryer de 1647."
  es: "Las fuentes hanafíes cuentan que Salman al-Farisi tradujo al-Fatiha al persa en el siglo VII para persas que se habían hecho musulmanes; la traducción latina de Roberto de Ketton, terminada en 1143 bajo el patrocinio de Pedro el Venerable, abad de Cluny, e impresa por primera vez en Basilea en 1543 por Theodor Bibliander, se describe como la primera a una lengua de Europa occidental; y la primera versión inglesa completa, la de Alexander Ross en 1649, no se hizo del árabe sino del francés de André Du Ryer de 1647."
  tr: "Hanefi kitapları, Salman el-Farsi'nin 7. yüzyılda Safe'yi Farsçaya çevirdiğini belirtir; bu çeviri Perslerden İslam'a geçenler için M.S. 7. yüzyılda gerçekleşmiştir. Robert of the Catoni'nin Latince çevirisi, 1143 yılında Cluny Manastırı Başrahibi Peter the Venerable'ın himayesiyle tamamlanmış ve ilk olarak 1543 yılında Basel'de Theodor Pebliander tarafından basılmıştır; bu çeviri Batı Avrupa diline ilk çeviri olarak kabul edilir. İlk tam İngilizce çeviri 1649'da Alexander Ross tarafından yapılmıştır; 1647'de André de Rière'in Fransızca çevirisinden alınmıştır, Arapçadan değil."
  id: "Buku-buku Hanafi menyebutkan bahwa Salman al-Farsi menerjemahkan Al-Fatiha ke dalam bahasa Persia pada abad ke-7 M untuk mereka yang berpindah agama ke Islam dari bangsa Persia. Terjemahan Latin Robert dari Catoni, yang selesai pada tahun 1143 M di bawah naungan Peter the Venerable, Abas Biara Cluny, dan pertama kali dicetak di Basel pada tahun 1543 M oleh Theodor Pebliander, dianggap sebagai terjemahan pertama ke dalam bahasa Eropa Barat. Terjemahan bahasa Inggris lengkap pertama dilakukan oleh Alexander Ross pada tahun 1649, diambil dari terjemahan Prancis oleh André de Rière pada tahun 1647, bukan dari bahasa Arab."
