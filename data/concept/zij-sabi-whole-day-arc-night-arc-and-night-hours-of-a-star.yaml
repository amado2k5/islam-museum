label: { ar: "قوس النهار الكاملة وقوس الليل وساعات الليل للكوكب", en: "The whole day arc, the night arc and the night hours of a star", ur: "ستارے کی پوری قوسِ نہار، قوسِ شب اور ساعاتِ شب", es: "Todo el arco diurno, el arco nocturno y las horas nocturnas de una estrella.", fr: "L'arc du jour, l'arc de la nuit et les heures nocturnes d'une étoile", tr: "Gezegenin tam gün ve gece döngüleri ve gece saatleri.", id: "Siklus siang dan malam lengkap serta jam-jam malam di planet ini." }
summary:
  ar: "تُضعَّف نصف قوس النهار فتصير قوس نهار الكوكب كله فوق الأرض، وتُنقص من ثلاثمائة وستين فتبقى قوس ليله كله تحت الأرض. وتُنقص أزمان ساعاته النهارية من ثلاثين فتبقى أزمان ساعاته الليلية التي تحت الأرض. ومن لا عرض له فقوس نهاره هي قوس نهار درجته نفسها. {cite:zij-sabi-nallino-byblion p.53}."
  en: "The half arc is doubled to give the whole day arc of the star above the earth, and this is taken from three hundred and sixty to leave its whole night arc below the earth. The times of its day hours are taken from thirty, leaving the times of its night hours below the earth. A star that has no latitude has the day arc of the degree it stands in. {cite:zij-sabi-nallino-byblion p.53}."
  ur: "نصف قوس کو دوگنا کیا جائے تو زمین کے اوپر ستارے کی پوری قوسِ نہار بنتی ہے، اسے تین سو ساٹھ میں سے گھٹائیں تو زمین کے نیچے اس کی پوری قوسِ شب باقی رہتی ہے۔ اس کی دن کی ساعتوں کے ازمان کو تیس میں سے گھٹائیں تو زمین کے نیچے اس کی رات کی ساعتوں کے ازمان رہ جاتے ہیں۔ جس ستارے کا عرض نہ ہو اس کی قوسِ نہار اسی درجے کی قوسِ نہار ہے جس میں وہ ہے۔ {cite:zij-sabi-nallino-byblion p.53}۔"
  es: "El medio arco se duplica para obtener el arco diurno completo de la estrella sobre la Tierra, y este se toma de trescientos sesenta para obtener su arco nocturno completo bajo la Tierra. Las horas de su día se toman de treinta, dejando las horas de su noche bajo la Tierra. Una estrella que no tiene latitud tiene un arco diurno del grado en el que se encuentra. {cite:zij-sabi-nallino-byblion p.53}."
  fr: "On double la moitié de l'arc pour obtenir l'arc diurne complet de l'étoile au-dessus de la Terre, et on soustrait cette valeur de 360 pour obtenir l'arc nocturne complet sous la Terre. Les durées de ses heures diurnes sont soustraites de 30, ce qui donne les durées de ses heures nocturnes sous la Terre. Une étoile sans latitude a un arc diurne correspondant au degré où elle se situe. {cite:zij-sabi-nallino-byblion p.53}."
  tr: "Günün uzunluğu iki katına çıkarılır, böylece gezegenin tüm gündüz yayı Dünya'nın üzerinde kalır ve 360'tan çıkarılır, böylece tüm gece yayı Dünya'nın altında kalır. Gündüz saatlerinin süresi 30'dan çıkarılır, böylece gece saatlerinin süresi Dünya'nın altında kalır. Enlemi olmayan bir gezegen için, gündüz yayı kendi enleminin yayıyla aynı derecededir. {cite:zij-sabi-nallino-byblion s.53}."
  id: "Panjang hari digandakan, sehingga seluruh busur siang hari planet berada di atas Bumi, dan dikurangi dari 360, menyisakan seluruh busur malam hari di bawah Bumi. Durasi jam siang harinya dikurangi dari 30, menyisakan durasi jam malam harinya di bawah Bumi. Untuk planet tanpa garis lintang, busur siang harinya sama derajatnya dengan busur garis lintangnya sendiri. {cite:zij-sabi-nallino-byblion p.53}."
