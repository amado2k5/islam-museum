label: { ar: "الحمل", en: "Hamal (pregnancy and carrying)", ur: "حمل (حمل اور بوجھ)" }
summary:
  ar: "الحمل في الفقه ما تحمله الأنثى في رحمها من جنين، ويطلق أيضا على حمل المتاع ورفعه، وهو أخص من الحبل، وعند الفقهاء يطلق على المعنيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7309} وأقل مدة الحمل ستة أشهر باتفاق الفقهاء، واختلفوا في أكثرها: فالشافعية والحنابلة في الظاهر والمالكية في قول يرون أربع سنين، والحنفية سنتين، والمشهور عند المالكية خمس سنين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} وللحمل أهلية وجوب ناقصة تثبت بها الحقوق التي لا تحتاج إلى قبول كالإرث والوصية والنسب، ولا يجب عليه شيء من الحقوق المالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7315} ويثبت نسب الحمل للفراش إذا جاء في المدة التي يحتملها، ويرث الحمل إن استهل صارخا، وتصح الوصية له عند عامة الفقهاء، ويصح الوقف عليه تبعا والإقرار له، ولا تصح الهبة له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7315} ويختلف الفقهاء في نفي الحمل باللعان وفي استلحاقه: فيرى الحنفية والحنابلة أنه لا ينفى قبل الوضع في الغالب، ويجيز مالك واللعان أثناء الحمل في قول، والاستلحاق إن صح يمنع النفي بعده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} وتنقضي عدة الحامل بوضع الحمل، ويتعلق بالتوأم أحكام في العدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} وإذا ماتت الحامل وفي بطنها جنين حي يجب إخراجه إن أمكن، واختلفوا في شق بطنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} ويحل أكل الجنين الميت بذكاة أمه عند الجمهور، وعند أبي حنيفة لا يحل إلا بذكاته إن خرج حيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} وأجمع الفقهاء على منع بيع الحمل وحده أو استثنائه من بيع أمه لجهالته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} ومن الحمل بمعنى الرفع أحكام حمل المبيع والمأجور وأجرة الحمال وضمانه، وحمل المصحف بغلاف مختلف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7320} ويختم المدخل بالعنوان التالي «حمام» على ص 7321. "
  en: "Hamal in jurisprudence is what a female carries in her womb, and it also means lifting and carrying a load, which is narrower than habal; the jurists use both senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7309} The minimum term of pregnancy is six months by agreement; the maximum is four years for the Shafiis, the Hanbalis on the apparent view and the Malikis in one view, two years for the Hanafis, and five years for the prevailing Maliki view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} The unborn has a deficient capacity to be a holder of rights, so it takes rights that need no acceptance such as inheritance, bequest and descent, and is not liable for any financial obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7315} Descent is attached to the marital bed within the possible term; an unborn child inherits if it cries out at birth, may take a bequest by the majority, may be the object of an endowment by implication and of an acknowledgement, but not of a gift. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7315} The schools differ on negating an unborn child by oath of cursing and on acknowledging it; a later acknowledgement, if valid, prevents later denial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} The waiting period of a pregnant woman ends with delivery, and a twin birth has its own rule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} If a pregnant woman dies with a living child in her womb the child is to be taken out if possible, and the jurists differ on cutting open the body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} The majority allow eating an unborn animal's flesh slaughtered through its mother's slaughter; Abu Hanifa requires its own slaughter if it is born alive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} Selling an unborn young alone, or excluding it from the sale of its mother, is forbidden by agreement for uncertainty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} The sense of lifting includes the transport of goods sold or rented, the carrier's fee and liability, and the carrying of the Quran with or without a cover, disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7320} The entry closes at the next headword, hammam (حمام), on p.7321. "
  ur: "حمل فقہ میں اس جنین کو کہتے ہیں جو عورت کے رحم میں ہو، اور اس کا لغوی معنی بوجھ اٹھانا بھی ہے؛ فقہاء دونوں معنی مراد لیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7309} حمل کی کم از کم مدت چھ ماہ بالاتفاق ہے؛ زیادہ سے زیادہ مدت میں شافعیہ اور حنابلہ کے ظاہر قول اور مالکیہ کے ایک قول کے مطابق چار سال، حنفیہ کے نزدیک دو سال، اور مالکیہ کے مشہور قول کے مطابق پانچ سال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7311} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} حمل کی وجوب کی ناقص اہلیت ہے، جس سے وہ حقوق ثابت ہوتے ہیں جن میں قبول کی ضرورت نہ ہو جیسے وراثت، وصیت اور نسب، اور اس پر مالی ذمہ داری عائد نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7315} بستر کے سبب نسب ثابت ہوتا ہے، حمل وراثت پاتا ہے اگر پیدائش کے وقت آواز نکالے، اس کے لیے وصیت جائز ہے، وقف تبعاً اور اقرار جائز ہے، ہبہ جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7315} لعان کے ذریعے حمل کی نفی اور اس کے استلحاق میں اختلاف ہے؛ بعد میں اقرار صحیح ہو تو بعد کی نفی روک دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} حاملہ کی عدت وضع حمل سے ختم ہوتی ہے، اور جڑواں بچوں کے بارے میں خاص حکم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} اگر حاملہ مر جائے اور رحم میں زندہ بچہ ہو تو ممکن ہو تو اسے نکالا جائے گا، اور پیٹ چاک کرنے میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} جمہور کے نزدیک مرنے والی جانور کے بچے کا کھانا اس کی ماں کے ذبح سے حلال ہے، جبکہ ابوحنیفہ کے نزدیک زندہ نکلنے پر اسے ذبح کرنا ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} حمل کو تنہا بیچنا یا ماں کی بیع سے اسے مستثنیٰ کرنا جہالت کی بنا پر متفقہ طور پر ممنوع ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} بمعنی اٹھانا، مبیع و مأجور کا اٹھانا، حمال کی اجرت اور ضمان، اور قرآن کو غلاف کے ساتھ اٹھانا، یہ مسائل بھی اس مدخل میں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7320} یہ مدخل p.7321 پر «حمام» کے عنوان پر ختم ہوتا ہے۔ "
