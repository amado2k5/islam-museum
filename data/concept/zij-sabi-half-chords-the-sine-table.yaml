id: concept/zij-sabi-half-chords-the-sine-table
class: concept
kind: scientific
label: { ar: "نصف الوتر المنصّف جداول الزيج الصابي", en: "The half-chords of the Zij: the sine table", ur: "زیج کے منصّف اوتار: جیب کا جدول", es: "Las semicordios del Zij: la tabla de senos", fr: "Les demi-accords du Zij: la table des sinus", tr: "Astronomik tabloların ikiye bölen kirişinin yarısı", id: "Setengah dari tali busur pembagi tabel astronomi" }
summary:
  ar: "يعلن البتاني أن ما يحتاج إليه في أقدار القسي المتقاطعة يُعلم بأوتار أنصاف القسي، فيأخذ في جداوله نصف وتر ضعف كل قوس ويثبته تحت حصة تلك القوس في الربع على تفاضل نصف جزء إلى تمام التسعين، فيقع نصف وتر الجزء تحت نصف جزء ونصف وتر المائة والثمانين تحت التسعين وهو ستون جزءاً. ويصرح بأن كل ما يذكره من الأوتار في الكتاب إنما يعني به هذه المنصفة إلا ما سماه وتراً تاماً. {cite:zij-sabi-nallino-byblion p.19}."
  en: "Al-Battani announces that what the computations of intersecting arcs need is known from the chords of half the arcs, so in his tables he takes half the chord of double each arc and writes it under that arc's share in the quarter, at steps of half a degree up to ninety, so that half the chord of a degree stands under half a degree and half the chord of 180 under ninety, which is sixty parts. He states that whenever he mentions chords in the book he means these half-chords, except what he names a full chord. {cite:zij-sabi-nallino-byblion p.19}."
  ur: "البتانی اعلان کرتے ہیں کہ متقاطع قوسوں کے اقدار کے لیے جو چاہیے وہ قوسوں کے نصف کے اوتار سے معلوم ہوتا ہے، چنانچہ وہ اپنے جدولوں میں ہر قوس کے دگنے کے وتر کا نصف لے کر اسے ربع میں اس قوس کے حصے کے نیچے آدھے آدھے درجے کے فرق سے نوے تک رکھتے ہیں، یوں ایک درجے کے وتر کا نصف آدھے درجے کے نیچے اور ۱۸۰ کے وتر کا نصف نوے کے نیچے آتا ہے جو ساٹھ جزء ہے۔ وہ صراحت کرتے ہیں کہ کتاب میں جہاں بھی اوتار کا ذکر کریں گے ان سے یہی منصف اوتار مراد ہیں سوائے ان کے جنہیں وہ وتر تام کہیں۔ {cite:zij-sabi-nallino-byblion p.19}۔"
  es: "Al-Battani afirma que los cálculos necesarios para la intersección de arcos se obtienen a partir de las cuerdas de la mitad de los arcos. Por ello, en sus tablas toma la mitad de la cuerda del doble de cada arco y la escribe debajo de la parte correspondiente a ese arco en el cuarto, en incrementos de medio grado hasta noventa. Así, la mitad de la cuerda de un grado se sitúa debajo de medio grado, y la mitad de la cuerda de 180 grados debajo de noventa, lo que equivale a sesenta partes. Aclara que, siempre que menciona cuerdas en el libro, se refiere a estas semicuerdas, excepto a lo que denomina cuerda completa. {cite:zij-sabi-nallino-byblion p.19}."
  fr: "Al-Battani annonce que les calculs d'arcs sécants se font à partir des cordes de la moitié de chaque arc. Dans ses tables, il prend donc la moitié de la corde du double de chaque arc et l'inscrit sous la partie de cet arc dans le quart, par incréments d'un demi-degré jusqu'à quatre-vingt-dix. Ainsi, la moitié de la corde d'un degré se trouve sous celle d'un demi-degré et la moitié de la corde de 180° sous celle de 90°, soit soixante parties. Il précise que lorsqu'il mentionne des cordes dans son ouvrage, il s'agit de ces demi-cordes, sauf pour ce qu'il appelle une corde entière. {cite:zij-sabi-nallino-byblion p.19}."
  tr: "El-Battani, kesişen yayların ölçüleri için gerekenin, yarım yay bölümlerinin kirişleri tarafından belirlendiğini belirtir. Tablolarında, her bir yayın uzunluğunun iki katının kirişinin yarısını alır ve bunu çeyrekteki yayın payının altına yerleştirir; aradaki fark, doksana kadar yarım kısımdır. Böylece, bir kısmın kirişinin yarısı yarım kısmın altına, yüz seksenin kirişinin yarısı ise doksanın altına, yani altmış kısma düşer. Kitapta bahsettiği tüm kirişlerin, tam kiriş olarak adlandırdığı şey hariç, bu yarım vuruşa atıfta bulunduğunu açıklar. {cite:zij-sabi-nallino-byblion s.19}."
  id: "Al-Battani menyatakan bahwa apa yang dibutuhkan untuk ukuran busur yang berpotongan ditentukan oleh tali busur dari segmen setengah busur. Dalam tabelnya, ia mengambil setengah tali busur dari dua kali panjang setiap busur dan menempatkannya di bawah bagian busur dalam seperempat, dengan selisihnya setengah bagian hingga sembilan puluh bagian penuh. Dengan demikian, setengah tali busur dari satu bagian berada di bawah setengah bagian, dan setengah tali busur dari seratus delapan puluh berada di bawah sembilan puluh, yang merupakan enam puluh bagian. Ia menjelaskan bahwa semua tali busur yang ia sebutkan dalam buku tersebut mengacu pada setengah goresan ini, kecuali untuk apa yang ia sebut tali busur penuh. {cite:zij-sabi-nallino-byblion p.19}."
