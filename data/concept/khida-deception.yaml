label: { ar: "الخديعة", en: "Khida'a (deception; its place in the law)", ur: "خدیعہ" }
summary:
  ar: "الخديعة إظهار الإنسان خلاف ما يخفيه، أو بمعنى الختل وإرادة المكروه، والحرب خدعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7556} وتفرق عن الغدر وهو نقض العهد، والغبن وهو خاص بالبيع، والخيانة وهي التفريط في الأمانة، والغرور والتغرير، والغش وهو إظهار خلاف ما يبطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7557}  وخداع المعاهد ممنوع، وإذا استشعر الإمام الخيانة بأمارات وجب نبذ العهد إليهم قبل القتال، ثم تجوز الخدعة في الحرب لأنها ليست غادرة، والحرب خدعة؛ ويجوز التورية والتعريض عند المصلحة الشرعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7559}"
  en: "Khida'a (deception) lexically is showing the opposite of what one hides, or guile with the intent of harm; war is a deceit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7556} It is distinguished from treachery (ghadr, breaking a covenant), undervaluation (ghabn, which concerns sale), breach of trust (khiyana), delusion and inducement (ghurur, taghrir), and deceitful adulteration (ghish). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7557}  Deceiving a treaty-bound enemy is forbidden; if the imam senses treachery by clear signs he must announce the end of the truce before fighting; after that, deceit in war is lawful, since war is deceit, and equivocation is allowed when a lawful purpose requires it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7559}"
  ur: "خدیعۃ یہ ہے کہ انسان وہ ظاہر کرے جو چھپائے ہوئے ہو، یا فریب سے نقصان کا ارادہ کرے؛ جنگ فریب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7556} یہ غدر (عہد توڑنا)، غبن (بیع میں نقصان، جو خاص بیع سے متعلق ہے)، خیانت، غرور و تغریر اور غش (ملاوٹ) سے ممیز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7557}  معاہد دشمن کو فریب دینا حرام ہے؛ اگر امام واضح نشانیوں سے خیانت محسوس کرے تو لڑائی سے پہلے عہد ختم کرنے کا اعلان کرے، اس کے بعد جنگ میں فریب جائز ہے کیونکہ جنگ فریب ہے، اور شرعی مصلحت ہو تو توریہ اور تعریض جائز ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7559}"
