id: concept/nasa
class: concept
kind: legal
label: { ar: "النَّسَاء (البيع إلى أجل)", en: "Deferred payment and sale on credit (nasa')", ur: "نساء (ادھار بیع)" }
summary:
  ar: "النساء في اللغة التأخير، وهو في الفقه تأجيل الثمن أو المبيع، ويقابله النقد، وهو الحلول. ولا خلاف في تحريم النساء في العقود التي يحرم فيها التفاضل بين البدلين، لقوله عيناً بعين ويداً بيد، وما كان من جنسين فالتفاضل فيه جائز يداً بيد ولا تجوز النسيئة. ومن جنس واحد أو علة ربوية واحدة لا يجوز النساء بلا خلاف، وأجيز السلم رخصة. وفي بيع الشريك والوكيل والمضارب نساء خلاف بين الشافعية والحنابلة والحنفية: لا يجوز إلا بإذن، أو يجوز عند الإطلاق إذا كان الأجل متعارفاً عند الحنفية، وعند الحنابلة روايتان في العامل والشريك وتفصيل في الوكيل والمضارب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15650} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653}"
  en: "Nasi'a, in the lexicon, is delay; in law it is the deferral of the price or of the goods, the opposite of cash payment (naqd). All agree that deferral is forbidden in exchanges where the two sides may not differ in amount, citing the saying 'like for like, hand to hand'; where the goods are of two kinds, the difference is allowed hand to hand but deferral is not; deferral between goods of one kind or one shared ribawi cause is forbidden without dispute; salam is allowed as a concession. For a partner, an agent or a profit-sharing manager selling on credit, the Shafi'is and Hanbalis forbid it without permission, and where permission is general they differ; the Hanafis allow it on a customary term. The entry also gives the Hanbali distinctions between an agent and a profit-sharing partner, and the rule on a sale that stands if the terms are changed for the better. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15650} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15651} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15652} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15653}"
  ur: "نساء کا مطلب ادھار ہے، جو نقد کی ضد ہے۔ ایسی بیع میں جن میں دونوں بدلوں میں کمی بیشی جائز نہیں، ادھار حرام ہے۔ سلم کی رخصت ہے۔ شریک، وکیل یا مضارب کی طرف سے ادھار بیچنے کے لیے اجازت ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15649}"
