id: concept/canon-causes-of-warming
class: concept
kind: scientific
label:
  ar: "أسباب التسخين عند ابن سينا"
  en: "The causes of warming in the Canon"
  fr: "Causes de réchauffement dans le Canon"
  ur: "گرم کرنے کے اسباب، قانون کے مطابق"
  es: "Las causas del calentamiento en el Canon"
summary:
  ar: "يبدأ ابن سينا الجملة الثانية من التعليم الثاني، في تعديد سبب لكل واحد من العوارض البدنية في تسعة وعشرين فصلا، بالفصل الأول في المسخنات، ويحصرها بحسب جالينوس في خمسة أجناس {cite:canon-ibn-sina-print-v1 pp.143-144}."
  en: "Ibn Sina begins the second part of the second lesson, which gives a cause for each of the bodily symptoms in twenty-nine chapters, with the first chapter on warming agents, which, following Galen, he reduces to five genera {cite:canon-ibn-sina-print-v1 pp.143-144}."
  fr: "Ibn Sina ouvre la deuxième partie de la deuxième leçon, vingt-neuf chapitres expliquant chaque symptôme corporel, par les agents réchauffants qu’il ramène à cinq genres suivant Galien {cite:canon-ibn-sina-print-v1 pp.143-144}."
  es: "Ibn Sina comienza la segunda parte de la segunda lección, que da una causa para cada uno de los síntomas corporales en veintinueve capítulos, con el primer capítulo sobre agentes de calentamiento, que, siguiendo a Galeno, reduce a cinco géneros {cite:canon-ibn-sina-print-v1 pp.143-144}."
  ur: "ابن سینا دوسرے سبق کا دوسرا حصہ شروع کرتے ہیں، جو انتیس ابواب میں جسمانی علامات میں سے ہر ایک کی وجہ بتاتا ہے، پہلے باب کے ساتھ گرمی بڑھانے والے ایجنٹوں پر، جسے، گیلن کے بعد، وہ پانچ نسلوں تک گھٹا دیتا ہے۔"
