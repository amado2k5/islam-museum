label:
  ar: إسرافيل
  en: Israfil (the angel of the trumpet)
  ur: اسرافیل
  es: "Israfil (el ángel de la trompeta)"
  fr: "Israfil (l'ange de la trompette)"
  tr: "İsrafil"
  id: "Israfil"
summary:
  ar: إسرافيل هو الملك الموكل بالنفخ في الصور، وفي درس الشيخ عمر عبد الكافي أن النفختين تفصلان بين الحياة الدنيا والبعث. ويذكر الشيخ أن بعض ما يُروى عن ذلك ضعيف السند وإن قوّته آثار أخرى (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:28:30}
  en: Israfil is the angel charged with blowing the trumpet. In Sheikh Omar Abdelkafy's lessons the two blasts separate worldly life from resurrection, and he notes that some reported details have a weak chain of transmission, though other reports support them (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:28:30}
  ur: اسرافیل وہ فرشتہ ہے جو صور پھونکنے پر مامور ہے۔ شیخ عمر عبدالکافی کے درس میں دو پھونکیں دنیاوی زندگی اور قیامت کے درمیان فرق کرتی ہیں، اور وہ بتاتے ہیں کہ کچھ روایات کی سند کمزور ہے اگرچہ دوسری روایات اسے تقویت دیتی ہیں (needs_source)۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:28:30}
  es: "Israfil es el ángel encargado de tocar la trompeta. En las enseñanzas del jeque Omar Abdelkafy, los dos toques de trompeta separan la vida terrenal de la resurrección, y él señala que algunos detalles reportados tienen una cadena de transmisión débil, aunque otros relatos los respaldan (necesita fuente). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:28:30}"
  fr: "Israfil est l'ange chargé de sonner de la trompette. Dans les enseignements du cheikh Omar Abdelkafy, ces deux sonneries marquent la séparation entre la vie terrestre et la résurrection. Il souligne que certains détails rapportés ont une chaîne de transmission fragile, bien que d'autres récits les corroborent (source nécessaire). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:28:30}"
  tr: "İsrafil, borazayı çalmakla görevlendirilen kraldır ve Şeyh Ömer Abdül-Kafi'nin dersinde iki darbe dünyevi yaşamı ve dirilişi birbirine ayırır. Şeyh, bu konuda anlatılanların bazılarının aktarım zincirinde zayıf olduğunu ve güçlerinin diğer (needs_source) olduğunu belirtir. {cite:assabile-omar-abdelkafy tafsir-al-kuran-al-kareem/ep03 00:28:30}"
  id: "Israfil adalah raja yang ditugaskan untuk meniup terompet, dan dalam pelajaran Sheikh Umar Abd al-Kafi, kedua tiupan tersebut memisahkan kehidupan duniawi dan kebangkitan. Sheikh menyebutkan bahwa beberapa cerita tentang hal ini lemah dalam rantai transmisi dan kekuatannya adalah yang lain (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-Quran-al-qareem/ep03 00:28:30}"
