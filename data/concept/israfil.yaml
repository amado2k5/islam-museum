  ar: "إسرافيل"
  en: "Israfil (the angel of the trumpet)"
  ur: "اسرافیل"
summary:
  ar: "إسرافيل هو الملك الموكل بالنفخ في الصور، وفي درس الشيخ عمر عبد الكافي أن النفختين تفصلان بين الحياة الدنيا والبعث. ويذكر الشيخ أن بعض ما يُروى عن ذلك ضعيف السند وإن قوّته آثار أخرى (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:28:30}"
  en: "Israfil is the angel charged with blowing the trumpet. In Sheikh Omar Abdelkafy's lessons the two blasts separate worldly life from resurrection, and he notes that some reported details have a weak chain of transmission, though other reports support them (needs_source). {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:28:30}"
  ur: "اسرافیل وہ فرشتہ ہے جو صور پھونکنے پر مامور ہے۔ شیخ عمر عبدالکافی کے درس میں دو پھونکیں دنیاوی زندگی اور قیامت کے درمیان فرق کرتی ہیں، اور وہ بتاتے ہیں کہ کچھ روایات کی سند کمزور ہے اگرچہ دوسری روایات اسے تقویت دیتی ہیں (needs_source)۔ {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:28:30}"
