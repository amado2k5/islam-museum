id: concept/canon-bran-like-and-vetch-like-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب النخالي والكرسني عند ابن سينا"
  en: "Bran-like and vetch-like sediment in the Canon"
  fr: "Sédiments semblables au son et à la vesce dans le Canon"
  ur: "بھوسی نما اور کرسنی تلچھٹ قانون میں"
  es: "Sedimentos similares al salvado y a la veza en el Cañón"
summary:
  ar: "يفرق ابن سينا بين الكرسني الأحمر وغير الأحمر النخالي، ويذكر مصدرهما من الكبد أو الكلية أو المثانة، وكيف يميز بين الأصول بالحكة والنتن والإلهاب. {cite:canon-ibn-sina-print-v1 p.194}."
  en: "Ibn Sina separates the red vetch-like sediment from the bran-like when it is not red, names their sources in the liver, kidney or bladder, and gives itching, stench and heat as ways of telling them apart. {cite:canon-ibn-sina-print-v1 p.194}."
  fr: "Ibn Sina distingue le sédiment rouge semblable à la vesce du sédiment non rouge semblable au son ; il les fait venir du foie, du rein ou de la vessie et les différencie par démangeaison, puanteur et chaleur. {cite:canon-ibn-sina-print-v1 p.194}."
  es: "Ibn Sina distingue el sedimento rojizo, similar a la veza, del sedimento similar al salvado cuando este no es rojo, indica sus orígenes en el hígado, el riñón o la vejiga, y menciona el picor, el hedor y el calor como formas de diferenciarlos. {cite:canon-ibn-sina-print-v1 p.194}."
  ur: "ابن سینا سرخ نہ ہونے پر چوکر نما تلچھٹ سے الگ کرتا ہے، جگر، گردے یا مثانے میں ان کے ذرائع کا نام دیتا ہے، اور ان کو الگ کرنے کے طریقوں کے طور پر خارش، بدبو اور گرمی دیتا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 194}۔"
