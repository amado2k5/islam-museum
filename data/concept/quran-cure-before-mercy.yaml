    id: sharawi-cure-then-mercy
    stance:
      ar: "الشفاء أولاً ثم الرحمة التي تحفظ من عودة الداء"
      en: "Cure first, then the mercy that keeps the ills from returning"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن الداءات الاجتماعية تعود إذا غفل الناس عن منهج الله، وأن الرجوع إلى القرآن يعيد الشفاء {cite:tafsir-sharawi-khawatir-scan p.26}."
      en: "Sha'rawi holds that social ills return when people neglect God's method, and that returning to the Quran restores the cure {cite:tafsir-sharawi-khawatir-scan p.26}."
