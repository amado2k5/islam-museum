id: concept/quran-cure-before-mercy
class: concept
kind: doctrine
label: { ar: "الشفاء قبل الرحمة في القرآن", en: "Cure before mercy in the Quran" }
summary:
  ar: "يستدل الشعراوي بقوله تعالى «وننزل من القرآن ما هو شفاء ورحمة» على أن الشفاء قُدّم على الرحمة لأن المجتمعات كانت حين نزل القرآن مليئة بالأمراض، كالظلم وأكل حقوق الناس واستعباد الإنسان للإنسان، فيأتي المنهج أولاً ليشفي، ثم تأتي الرحمة فتمنع عودة الداء ما دام الناس على المنهج {cite:tafsir-sharawi-khawatir-scan p.26}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi reads the verse 'We send down of the Quran that which is a cure and a mercy' as putting cure before mercy because, when the Quran came, societies were full of ills such as injustice, the usurping of people's rights and the enslavement of people by people. The method comes first to heal, and mercy follows to keep those ills from returning while people keep to the method {cite:tafsir-sharawi-khawatir-scan p.26}. This is his reading and is attributed to him."
wings: [ideas]
themes: []
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "كيف يكون القرآن شفاءً للمجتمعات، وما معنى تقديم الشفاء على الرحمة؟"
  en: "In what sense is the Quran a cure for societies, and why is cure placed before mercy?"
perspectives:
