label:
  ar: "سمن"
  en: "Saman (clarified butter)"
  ur: "سمن"
summary:
  ar: "السمن في الكتاب معروف يفعل أفعال الزبد وهو أقوى في الإنضاج والإرخاء والتليين، حار في الأولى رطب فيها، منضج محلل يفعل في الأبدان الناعمة والمتوسطة دون الصلبة، ينضج الأورام وخصوصاً في أصل الأذن عند الصبيان والنساء، ويلين الصدر وينضج الفضول فيه، وهو ترياق للسموم المشروبة {cite:canon-ibn-sina-print-v1 p.602}."
  en: "Saman is in the book well known and does the actions of butter, being stronger in ripening, relaxing and softening; hot in the first degree and moist in it, ripening and dissolving, acting in soft and middling bodies and not in hard ones; it ripens swellings, especially at the base of the ear in children and women, softens the chest and ripens the residues in it, and is an antidote to poisons that are drunk {cite:canon-ibn-sina-print-v1 p.602}."
  ur: "سمن کتاب میں معروف ہے اور مکھن کے افعال کرتا ہے مگر پکانے، ڈھیلا کرنے اور نرم کرنے میں اس سے زیادہ قوی ہے؛ پہلے درجے میں گرم اور اس میں تر، پکانے اور گھلانے والا، نرم اور متوسط بدنوں میں اثر کرتا ہے سخت میں نہیں؛ ورموں کو پکاتا ہے خاص طور پر کان کی جڑ میں بچوں اور عورتوں کے، سینے کو نرم کرتا اور اس کے فضلات کو پکاتا ہے، اور پی جانے والے زہروں کا تریاق ہے {cite:canon-ibn-sina-print-v1 p.602}۔"
