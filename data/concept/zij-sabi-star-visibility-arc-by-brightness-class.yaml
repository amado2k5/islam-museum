label: { ar: "قوس ظهور النجوم وخفائها بحسب عظم كل صنف", en: "The arc of visibility of stars by their class of magnitude", ur: "حجم کے درجات کے لحاظ سے ستاروں کے ظہور و خفا کی قوس", es: "El arco de visibilidad de las estrellas según su clase de magnitud", fr: "L'arc de visibilité des étoiles selon leur classe de magnitude", tr: "Her sınıfın büyüklüğüne göre yıldızların görünme ve kaybolma eğrisi", id: "Busur kemunculan dan menghilangnya bintang menurut magnitudo masing-masing kelas." }
summary:
  ar: "يذكر النص أن مقدار القوس التي تظهر وتختفي منها ما كان من الكواكب في العظم الأول، مثل الشعرى اليمانية وقلب الأسد والسماكين والعيوق وما شاكل ذلك، خمسة عشر جزءاً. ويزيد مقدار القوس كلما نزل الكوكب إلى عظم أصغر، إلى أن يُرى ويُختفى على مقدار مخصوص بالقرب. {cite:zij-sabi-nallino-byblion p.185}"
  en: "The text says the arc by which a star of the first magnitude rises into view and disappears is fifteen degrees, for stars such as Sirius, Regulus, the Pleiades and Arcturus. As the magnitude diminishes, the arc grows larger, until the smallest stars appear and disappear by a fixed amount close to the sun. {cite:zij-sabi-nallino-byblion p.185}"
  ur: "متن کہتا ہے کہ پہلے عظم کے ستارے، جیسے یمانی شعریٰ، قلبِ اسد، سماکین اور عیوق، کے ظہور اور خفا کی قوس پندرہ درجے ہے۔ ستارے کا عظم جتنا کم ہوتا ہے قوس اتنی ہی بڑھتی ہے، یہاں تک کہ سب سے چھوٹے ستارے سورج کے قریب ایک مقرر مقدار پر ظاہر اور غائب ہوتے ہیں۔ {cite:zij-sabi-nallino-byblion p.185}"
  es: "El texto indica que el arco por el cual una estrella de primera magnitud aparece y desaparece es de quince grados, para estrellas como Sirio, Régulo, las Pléyades y Arcturus. A medida que la magnitud disminuye, el arco se agranda, hasta que las estrellas más pequeñas aparecen y desaparecen por una distancia fija cerca del Sol. {cite:zij-sabi-nallino-byblion p.185}"
  fr: "Le texte indique que l'arc par lequel une étoile de première magnitude apparaît et disparaît est de quinze degrés, pour des étoiles comme Sirius, Régulus, les Pléiades et Arcturus. À mesure que la magnitude diminue, l'arc s'agrandit, jusqu'à ce que les plus petites étoiles apparaissent et disparaissent selon une distance fixe près du Soleil. {cite:zij-sabi-nallino-byblion p.185}"
  tr: "Metinde, Sirius, Regulus, Arcturus, Capella ve benzeri birinci büyüklükteki gezegenlerin görünüp kaybolduğu yayın on beş parçadan oluştuğu belirtiliyor. Gezegen daha küçük bir büyüklüğe indikçe yay artar ve belirli bir mesafede görünüp kaybolur. {cite:zij-sabi-nallino-byblion s.185}"
  id: "Teks tersebut menyatakan bahwa busur yang dilalui planet-planet bermagnitudo pertama, seperti Sirius, Regulus, Arcturus, Capella, dan sejenisnya, untuk muncul dan menghilang adalah lima belas bagian. Busur tersebut bertambah seiring dengan penurunan magnitudo planet, hingga planet tersebut muncul dan menghilang pada jarak tertentu. {cite:zij-sabi-nallino-byblion p.185}"
