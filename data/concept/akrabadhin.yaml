label:
  ar: "الأقراباذين"
  en: "Akrabadhin (the pharmacopoeia, a treatise on compound drugs)"
  fr: "Akrabadhin (la pharmacopée, traité des remèdes composés)"
  es: "Akrabadhin (la farmacopea, un tratado sobre medicamentos compuestos)"
  ur: "اکرابادین ⁦(فارماکوپیا، مرکب ادویات پر ایک مقالہ)⁩"
  tr: "Aqrabaddin"
  id: "Aqrabaddin"
summary:
  ar: "الأقراباذين، من الكلمة السريانية «غرابادين» التي تنقل كلمة يونانية بمعنى «الرسالة»، وأطلقها العرب على الرسائل في تركيب الأدوية والأدوية المركبة، أي الأقرابادينات، وأول أقرابادين انتشر في الخلافة كلها للطبيب المسيحي سابور بن سهل المتوفى سنة 255هـ/869م، ثم أقرابادين أمين الدولة ابن التلميذ المتوفى سنة 560هـ/1165م {cite:encyclopaedia-of-islam-2 vol. 1 p. 366-367}."
  en: "Akrabadhin, from the Syriac grabadhin, reproducing a Greek word for 'treatise', was used by the Arabs for treatises on compounding drugs, the pharmacopoeias. The first to win universal acceptance in the caliphate was that of the Christian physician Sabur b. Sahl (d. 255/869), followed by the Akrabadhin of Amin al-Dawla Hibat Allah b. Sa'id Ibn al-Tilmidh (d. 560/1165) {cite:encyclopaedia-of-islam-2 vol. 1 p. 366-367}."
  fr: "Akrabadhin, du syriaque grabadhin, qui reproduit un mot grec signifiant « traité », était employé par les Arabes pour les traités sur la composition des remèdes, les pharmacopées. La première à obtenir une reconnaissance universelle dans le califat fut celle du médecin chrétien Sabur b. Sahl (m. 255/869), suivie de l’Akrabadhin d’Amin al-Dawla Hibat Allah b. Sa'id Ibn al-Tilmidh (m. 560/1165) {cite:encyclopaedia-of-islam-2 vol. 1 p. 366-367}."
  es: "Akrabadhin, del siríaco grabadhin, que reproduce una palabra griega para \"tratado\", era utilizado por los árabes para los tratados sobre la preparación de medicamentos, las farmacopeas. El primero en obtener aceptación universal en el califato fue el del médico cristiano Sabur b. Sahl (m. 255/869), seguido por el Akrabadhin de Amin al-Dawla Hibat Allah b. Sa'id Ibn al-Tilmidh (m. 560/1165) {cite:encyclopaedia-of-islam-2 vol. 1 p. 366-367}."
  ur: "اکرابادین، سریانی گرابادین سے، 'ٹریٹائز' کے لیے ایک یونانی لفظ کو دوبارہ پیش کرتا ہے، عربوں نے مرکب ادویات، فارماکوپییاس پر مقالوں کے لیے استعمال کیا تھا۔ خلافت میں عالمی سطح پر قبولیت حاصل کرنے والے سب سے پہلے عیسائی طبیب صابور بن تھے۔ سہل ⁦(متوفی 255/869)⁩، اس کے بعد امین الدولہ ہیبت اللہ بن عکرابدین۔ سعید ابن التلمذ ⁦(متوفی 560/1165)⁩ {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 366-367}۔"
  tr: "'Aqrabadin', Süryanice 'Grabadin' kelimesinden gelir ve Yunanca 'mesaj' anlamına gelir. Araplar, ilaçların ve bileşik ilaçların bileşiminde harfler için kullanmışlardır, yani Akrabadinler. Tüm halifeliğe yayılan ilk Aqrabadin, 255 H/869 yılında ölen Hristiyan hekim Sabor ibn Sahl'dir; ardından öğrencinin oğlu Aqrabadin, Amin al-Dawla, 560 H/1165 yılında vefat etmiştir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 366-367}."
  id: "'Aqrabadin' berasal dari kata Siria 'Grabadin' dan berarti 'pesan' dalam bahasa Yunani. Orang Arab menggunakannya untuk huruf dalam komposisi obat dan obat majemuk, yaitu Akrabadin. Aqrabadin pertama yang menyebar ke seluruh kekhalifahan adalah dokter Kristen Sabor ibn Sahl, yang meninggal pada tahun 255 H/869; kemudian putra murid tersebut, Aqrabadin, Amin al-Dawla, yang meninggal pada tahun 560 H/1165 {cite:Encyclopaedia-of-Islam-2, vol. 1, hlm. 366-367}."
