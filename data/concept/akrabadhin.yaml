label:
  ar: "الأقراباذين"
  en: "Akrabadhin (the pharmacopoeia, a treatise on compound drugs)"
summary:
  ar: "الأقراباذين، من الكلمة السريانية «غرابادين» التي تنقل كلمة يونانية بمعنى «الرسالة»، وأطلقها العرب على الرسائل في تركيب الأدوية والأدوية المركبة، أي الأقرابادينات، وأول أقرابادين انتشر في الخلافة كلها للطبيب المسيحي سابور بن سهل المتوفى سنة 255هـ/869م، ثم أقرابادين أمين الدولة ابن التلميذ المتوفى سنة 560هـ/1165م {cite:encyclopaedia-of-islam-2 vol. 1 p. 366-367}."
  en: "Akrabadhin, from the Syriac grabadhin, reproducing a Greek word for 'treatise', was used by the Arabs for treatises on compounding drugs, the pharmacopoeias. The first to win universal acceptance in the caliphate was that of the Christian physician Sabur b. Sahl (d. 255/869), followed by the Akrabadhin of Amin al-Dawla Hibat Allah b. Sa'id Ibn al-Tilmidh (d. 560/1165) {cite:encyclopaedia-of-islam-2 vol. 1 p. 366-367}."
