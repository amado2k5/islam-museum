label: { ar: الكميت, en: "Al-kumayt (bay horse)", es: "Al-kumayt (caballo castaño)", fr: "Al-kumayt (cheval bai)", ur: "الکومیت ⁦(بے گھوڑا)⁩", tr: "Al-Kumit", id: "Al-Kumit" }
summary:
  ar: "الكميت: جواد أحمر فيه سواد في الشعر والعُرف والذنب؛ وفي عدة صور من المخطوطات التيمورية يُعدّ من الألوان الحمراء المعتادة، ومنه الكميت المدمى الذي اشتدت حمرته في السواد."
  en: "Al-kumayt: a red horse with black in the mane, tail and legs; among the common red colours in Timurid manuscripts, including al-kumayt al-mudmá, whose red deepens into black."
  es: "Al-kumayt: un caballo rojo con crin, cola y patas negras; uno de los colores rojos comunes en los manuscritos timúridas, incluido al-kumayt al-mudmá, cuyo rojo se torna negro."
  fr: "Al-kumayt: un cheval rouge avec du noir dans la crinière, la queue et les jambes; parmi les couleurs rouges courantes dans les manuscrits timourides, y compris al-kumayt al-mudmá, dont le rouge s'intensifie en noir."
  ur: "الکومیت: ایک سرخ گھوڑا جس کی ایال، دم اور ٹانگیں سیاہ ہوتی ہیں۔ تیموری نسخوں میں عام سرخ رنگوں میں، بشمول الکومیت المدما، جس کا سرخ رنگ سیاہ میں گہرا ہوتا ہے۔"
  tr: "Al-Kumit: Şiir, gelenek ve kuyruğu koyu renkte kırmızı bir attır; Timuri el yazmalarından çeşitli biçimlerinde, siyahta daha da belirgin kırmızılığı yoğunlaşan kanlı Kumit dahil olmak üzere yaygın kırmızı renklerden biri olarak kabul edilir."
  id: "Al-Kumit: Puisi, tradisi, dan seekor kuda merah dengan ekor gelap; Dalam berbagai bentuk dari manuskrip Timurid, kuda ini dianggap sebagai salah satu warna merah yang umum, termasuk Kumit berdarah, yang memiliki kemerahan hitam yang lebih mencolok."
