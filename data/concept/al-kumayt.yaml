label: { ar: الكميت, en: "Al-kumayt (bay horse)", es: "Al-kumayt (caballo castaño)", fr: "Al-kumayt (cheval bai)" }
summary:
  ar: "الكميت: جواد أحمر فيه سواد في الشعر والعُرف والذنب؛ وفي عدة صور من المخطوطات التيمورية يُعدّ من الألوان الحمراء المعتادة، ومنه الكميت المدمى الذي اشتدت حمرته في السواد."
  en: "Al-kumayt: a red horse with black in the mane, tail and legs; among the common red colours in Timurid manuscripts, including al-kumayt al-mudmá, whose red deepens into black."
  es: "Al-kumayt: un caballo rojo con crin, cola y patas negras; uno de los colores rojos comunes en los manuscritos timúridas, incluido al-kumayt al-mudmá, cuyo rojo se torna negro."
  fr: "Al-kumayt: un cheval rouge avec du noir dans la crinière, la queue et les jambes; parmi les couleurs rouges courantes dans les manuscrits timourides, y compris al-kumayt al-mudmá, dont le rouge s'intensifie en noir."
