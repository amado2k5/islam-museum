id: concept/khiyar-al-naqd-fiqh
class: concept
kind: legal
label:
  ar: خيار النقد
  en: Khiyar al-naqd (option of payment)
  ur: خیار النقد
summary:
  ar: 'خيار النقد حق يشترطه العاقد للتمكن من الفسخ لعدم النقد، والنقد لغة الإعطاء والقبض يقال نقدت الرجل الدراهم فانتقدها بمعنى أعطيته إياها فقبضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027} وله صورتان: الأولى التعاقد واشتراط أن المشتري إذا لم ينقد الثمن إلى مدة معلومة فلا عقد بينهما، ومستعمل الخيار فيها المشتري وإن كانت فائدته الكبرى للبائع، وهي بمنزلة اشتراط خيار الشرط للمشتري؛ والثانية التعاقد ثم قيام المشتري بالنقد مع الاتفاق على أن البائع إذا رد العوض في مدة معلومة فلا عقد بينهما، ومستعمله البائع وهو وحده المنتفع، وهي ذات شبه تام ببيع الوفاء حتى أدخله بعضهم في خيار النقد، وهي بمنزلة اشتراط خيار الشرط للبائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} أثبته المالكية والحنابلة والحنفية إلا زفر بن الهذيل، وقال به الثوري وإسحاق وأبو ثور وحكي عن عمر وابن عمر، وقال به من الشافعية أبو إسحاق الشيرازي محتجا بأثر عمر، وخالف الشافعية في الصحيح وزفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} استدل المثبتون بالقياس على خيار الشرط لاتحاد العلة وهي التروي، وبآثار الصحابة منها قضاء شريح به حين جاء المشتري بالثمن من الغد فقال أنت أخلفته، وبداعي الحاجة إليه كالحاجة إلى خيار الشرط؛ واستدل النافون بأنه شرط فاسد مفسد للعقد إذ علق الفسخ على غرر، واحتج زفر بأنه اشتراط إقالة فاسدة واشتراط الإقالة الصحيحة مفسد فكيف بالفاسدة، وذكر الكاساني أن ثبوته استحسان على خلاف القياس لمعاناته خيار الشرط بجامع التعليق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} صاحبه المشتري أو البائع بحسب الصورة المشترطة، وفائدة البائع منه أكثر لانتفاعه بالفسخ إذا مطل المشتري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} مدته مختلف فيها كخيار الشرط: التفويض للمتعاقدين ولو فوق ثلاثة أيام وهو مذهب الحنابلة ومحمد بن الحسن وحده من الحنفية وعليه الثوري وإسحاق، والتحديد بثلاثة أيام وهو قول أبي حنيفة وأبي يوسف خلافا لصنيعه في خيار الشرط، ومذهب أبي ثور وحكي عن ابن عمر، وما يقارب الثلاث على ألا يجاوز عشرين يوما عند مالك؛ وإن اشترط ما يزيد على الثلاث عند أبي حنيفة وأبي يوسف فإن نقد في الثلاث جاز وإلا فسد البيع ولم ينفسخ كما حققه ظهير الدين وأقره ابن الهمام وابن عابدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} ويماثل خيار الشرط في أسباب السقوط والأحكام والانتقال فلا يورث عند الحنفية أسوة بأصله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} وجعل ابن نجيم بيع الوفاء من أفراد خيار النقد فأنسب مواضع بحثه تحته، ولم يرتض ابن عابدين ذلك لأنه إنما يكون من أفراده على القول بفساده إن زاد على الثلاث لا على القول بصحته إذ خيار النقد مقيد بثلاثة أيام وبيع الوفاء غير مقيد بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030}'
  en: 'Khiyar al-naqd is a right a contractor stipulates to be able to annul for non-payment; naqd linguistically means giving and taking possession, as in "I paid the man the dirhams and he took them". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027} It has two forms: first, contracting with the stipulation that if the buyer does not pay the price by a known period there is no contract between them, its exerciser being the buyer though its greater benefit is the seller''s, in the position of a stipulated option for the buyer; second, contracting then the buyer paying, on the agreement that if the seller returns the countervalue within a set period there is no contract, its exerciser the seller who alone benefits, a case closely resembling bay'' al-wafa'' so that some include that sale under it, in the position of a stipulated option for the seller. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} It is affirmed by the Malikis, Hanbalis and Hanafis except Zufar ibn al-Hudhayl, held by al-Thawri, Ishaq and Abu Thawr, attributed to Umar and Ibn Umar, and held among the Shafiis by Abu Ishaq al-Shirazi arguing from Umar''s report; the Shafiis on the sound view and Zufar oppose it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} The affirmers argue by analogy with the option of stipulation, the shared cause being deliberation, by Companion reports including Shurayh''s ruling by it when the buyer brought the price the next day and he said "you broke your word", and by the need for it like the need for the stipulated option; the deniers call it a corrupt condition corrupting the contract since it hangs annulment on a gharar, Zufar adding that it stipulates a corrupt rescission while even stipulating a valid rescission corrupts; al-Kasani records that it is established by istihsan against analogy since it shares with the stipulated option the feature of conditionality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} Its holder is the buyer or the seller as the form stipulated, the seller''s benefit being greater since he gains by the annulment if the buyer delays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} Its term is disputed like the stipulated option: left to the parties even beyond three days, the Hanbali school and Muhammad ibn al-Hasan alone among the Hanafis, also al-Thawri and Ishaq; fixed at three days, the view of Abu Hanifa and Abu Yusuf, differing from his own rule on the stipulated option, and of Abu Thawr, attributed to Ibn Umar; and about three days not exceeding twenty at Malik; if more than three is stipulated on Abu Hanifa''s and Abu Yusuf''s view, payment within the three validates, else the sale is corrupt not annulled, as Zahir al-Din determined and Ibn al-Humam and Ibn Abidin approved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} It matches the stipulated option in causes of lapse, rules and transfer, not being inherited at the Hanafis like its origin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} Ibn Nujaym made bay'' al-wafa'' one of its instances and its fittest place of enquiry; Ibn Abidin did not accept this, since it is an instance only on the view voiding bay'' al-wafa'' beyond three days, the payment option being capped at three days while bay'' al-wafa'' is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030}'
  ur: 'خیار النقد وہ حق ہے جو عاقد غیر ادائیگی پر فسخ کی تمکن کے لیے شرط کرتا ہے؛ نقد لغت میں دینے اور قبض کرنے کو کہتے ہیں جیسے نقدت الرجل الدراهم فانتقدها یعنی میں نے اسے دینے پر اس نے قبض کیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027} اس کی دو صورتیں ہیں: پہلی یہ کہ عقد ہو اور شرط ہو کہ اگر مشتری معلوم مدت تک ثمن ادا نہ کرے تو ان کے درمیان کوئی عقد نہیں، اس میں خیار کا مستعمل مشتری ہے اگرچہ بڑا فائدہ بائع کا ہے، اور یہ مشتری کے لیے خیار الشرط کی شرط کی جگہ ہے؛ دوسری یہ کہ عقد کے بعد مشتری ادا کرے اس اتفاق پر کہ اگر بائع معلوم مدت میں عوض لوٹا دے تو ان کے درمیان کوئی عقد نہیں، اس کا مستعمل بائع ہے جو اکیلا منتفع ہے، اور یہ بیع الوفاء سے مکمل مشابہ ہے اس لیے بعض نے اسے خیار النقد میں داخل کیا، اور یہ بائع کے لیے خیار الشرط کی شرط کی جگہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} اسے مالکیہ، حنابلہ اور حنفیہ نے ثابت کیا سوائے زفر بن ہذیل کے؛ ثوری، اسحاق اور ابو ثور نے بھی کہا، عمر اور ابن عمر سے روایت ہے، اور شافعیہ میں ابو اسحاق شیرازی نے عمر کے اثر سے دلیل دے کر کہا؛ مخالف شافعیہ ہیں صحیح قول پر اور زفر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} مثبتین نے خیار الشرط پر قیاس سے استدلال کیا کہ علت مشترک ہے یعنی تروی، صحابہ کے آثار سے جن میں شریح کا فیصلہ ہے جب مشتری دوسرے دن ثمن لایا تو کہا "تم نے وعدہ خلافی کی"، اور ضرورت سے جیسی خیار الشرط کی ضرورت ہے؛ نافین نے کہا یہ شرطِ فاسدہ ہے جو عقد کو مفسد کرتی ہے کیونکہ اس نے فسخ کو غرر پر ٹانگا، اور زفر نے کہا یہ فاسد اقالہ کی شرط ہے حالانکہ صحیح اقالہ کی شرط بھی مفسد ہے؛ اور کاسانی نے کہا اس کا ثبوت قیاس کے خلاف استحسان سے ہے کہ وہ علقت میں خیار الشرط سے شریک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} اس کا صاحب مشتری یا بائع ہے مشروطہ صورت کے مطابق، اور بائع کا فائدہ زیادہ ہے کیونکہ مشتری کے مُل کرنے پر فسخ سے وہ منتفع ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} اس کی مدت خیار الشرط کی طرح مختلف فیہ ہے: متعاقدین پر تفویض خواہ تین دن سے زیادہ ہو، حنبلی مذہب اور حنفیہ میں صرف محمد بن الحسن کا، اور ثوری و اسحاق کا؛ تین دن پر تحدید ابو حنیفہ اور ابو یوسف کا قول اپنے خیار الشرط کے صنع سے خلاف کرتے ہوئے، اور ابو ثور کا، ابن عمر سے روایت؛ اور مالک کے نزدیک تین کے قریب بشرط بیس دن سے نہ بڑھے؛ ابو حنیفہ اور ابو یوسف کے نزدیک تین سے زیادہ شرط ہو تو اگر تین میں ادا ہو جائز ورنہ بیع فاسد ہے مگر منفسخ نہیں جیسا ظہیر الدین نے تحقیق کی اور ابن ہمام اور ابن عابدین نے تائید کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} وہ سقوط کے اسباب، احکام اور انتقال میں خیار الشرط کی مثیل ہے تو حنفیہ کے نزدیک اپنے اصل کی طرح موروث نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} ابن نجیم نے بیع الوفاء کو اس کے افراد میں کیا اور اس کا بحث اسی کے تحت انسب ٹھہرایا؛ ابن عابدین نے یہ تعلیل پسند نہ کیا کیونکہ وہ اسی وقت اس کا فرد ہے جب تین سے بڑھنے پر اس کے فاسد ہونے کا قول ہو، خیار النقد تین دن سے مقید ہے اور بیع الوفاء مقید نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030}'
