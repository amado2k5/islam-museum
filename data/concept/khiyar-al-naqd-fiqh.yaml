id: concept/khiyar-al-naqd-fiqh
class: concept
kind: legal
tags: [akhlaq-browser, akhlaq-bay]
label:
  ar: خيار النقد
  en: Khiyar al-naqd (option of payment)
  ur: خیار النقد
  es: "Khiyar al-naqd (opción de pago)"
  fr: "Khiyar al-naqd (option de paiement)"
  tr: "Nakit opsiyon"
  id: "Opsi tunai"
summary:
  ar: 'خيار النقد حق يشترطه العاقد للتمكن من الفسخ لعدم النقد، والنقد لغة الإعطاء والقبض يقال نقدت الرجل الدراهم فانتقدها بمعنى أعطيته إياها فقبضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027} وله صورتان: الأولى التعاقد واشتراط أن المشتري إذا لم ينقد الثمن إلى مدة معلومة فلا عقد بينهما، ومستعمل الخيار فيها المشتري وإن كانت فائدته الكبرى للبائع، وهي بمنزلة اشتراط خيار الشرط للمشتري؛ والثانية التعاقد ثم قيام المشتري بالنقد مع الاتفاق على أن البائع إذا رد العوض في مدة معلومة فلا عقد بينهما، ومستعمله البائع وهو وحده المنتفع، وهي ذات شبه تام ببيع الوفاء حتى أدخله بعضهم في خيار النقد، وهي بمنزلة اشتراط خيار الشرط للبائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} أثبته المالكية والحنابلة والحنفية إلا زفر بن الهذيل، وقال به الثوري وإسحاق وأبو ثور وحكي عن عمر وابن عمر، وقال به من الشافعية أبو إسحاق الشيرازي محتجا بأثر عمر، وخالف الشافعية في الصحيح وزفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} استدل المثبتون بالقياس على خيار الشرط لاتحاد العلة وهي التروي، وبآثار الصحابة منها قضاء شريح به حين جاء المشتري بالثمن من الغد فقال أنت أخلفته، وبداعي الحاجة إليه كالحاجة إلى خيار الشرط؛ واستدل النافون بأنه شرط فاسد مفسد للعقد إذ علق الفسخ على غرر، واحتج زفر بأنه اشتراط إقالة فاسدة واشتراط الإقالة الصحيحة مفسد فكيف بالفاسدة، وذكر الكاساني أن ثبوته استحسان على خلاف القياس لمعاناته خيار الشرط بجامع التعليق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} صاحبه المشتري أو البائع بحسب الصورة المشترطة، وفائدة البائع منه أكثر لانتفاعه بالفسخ إذا مطل المشتري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} مدته مختلف فيها كخيار الشرط: التفويض للمتعاقدين ولو فوق ثلاثة أيام وهو مذهب الحنابلة ومحمد بن الحسن وحده من الحنفية وعليه الثوري وإسحاق، والتحديد بثلاثة أيام وهو قول أبي حنيفة وأبي يوسف خلافا لصنيعه في خيار الشرط، ومذهب أبي ثور وحكي عن ابن عمر، وما يقارب الثلاث على ألا يجاوز عشرين يوما عند مالك؛ وإن اشترط ما يزيد على الثلاث عند أبي حنيفة وأبي يوسف فإن نقد في الثلاث جاز وإلا فسد البيع ولم ينفسخ كما حققه ظهير الدين وأقره ابن الهمام وابن عابدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} ويماثل خيار الشرط في أسباب السقوط والأحكام والانتقال فلا يورث عند الحنفية أسوة بأصله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} وجعل ابن نجيم بيع الوفاء من أفراد خيار النقد فأنسب مواضع بحثه تحته، ولم يرتض ابن عابدين ذلك لأنه إنما يكون من أفراده على القول بفساده إن زاد على الثلاث لا على القول بصحته إذ خيار النقد مقيد بثلاثة أيام وبيع الوفاء غير مقيد بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030}'
  en: 'Khiyar al-naqd is a right a contractor stipulates to be able to annul for non-payment; naqd linguistically means giving and taking possession, as in "I paid the man the dirhams and he took them". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027} It has two forms: first, contracting with the stipulation that if the buyer does not pay the price by a known period there is no contract between them, its exerciser being the buyer though its greater benefit is the seller''s, in the position of a stipulated option for the buyer; second, contracting then the buyer paying, on the agreement that if the seller returns the countervalue within a set period there is no contract, its exerciser the seller who alone benefits, a case closely resembling bay'' al-wafa'' so that some include that sale under it, in the position of a stipulated option for the seller. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} It is affirmed by the Malikis, Hanbalis and Hanafis except Zufar ibn al-Hudhayl, held by al-Thawri, Ishaq and Abu Thawr, attributed to Umar and Ibn Umar, and held among the Shafiis by Abu Ishaq al-Shirazi arguing from Umar''s report; the Shafiis on the sound view and Zufar oppose it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} The affirmers argue by analogy with the option of stipulation, the shared cause being deliberation, by Companion reports including Shurayh''s ruling by it when the buyer brought the price the next day and he said "you broke your word", and by the need for it like the need for the stipulated option; the deniers call it a corrupt condition corrupting the contract since it hangs annulment on a gharar, Zufar adding that it stipulates a corrupt rescission while even stipulating a valid rescission corrupts; al-Kasani records that it is established by istihsan against analogy since it shares with the stipulated option the feature of conditionality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} Its holder is the buyer or the seller as the form stipulated, the seller''s benefit being greater since he gains by the annulment if the buyer delays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} Its term is disputed like the stipulated option: left to the parties even beyond three days, the Hanbali school and Muhammad ibn al-Hasan alone among the Hanafis, also al-Thawri and Ishaq; fixed at three days, the view of Abu Hanifa and Abu Yusuf, differing from his own rule on the stipulated option, and of Abu Thawr, attributed to Ibn Umar; and about three days not exceeding twenty at Malik; if more than three is stipulated on Abu Hanifa''s and Abu Yusuf''s view, payment within the three validates, else the sale is corrupt not annulled, as Zahir al-Din determined and Ibn al-Humam and Ibn Abidin approved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} It matches the stipulated option in causes of lapse, rules and transfer, not being inherited at the Hanafis like its origin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} Ibn Nujaym made bay'' al-wafa'' one of its instances and its fittest place of enquiry; Ibn Abidin did not accept this, since it is an instance only on the view voiding bay'' al-wafa'' beyond three days, the payment option being capped at three days while bay'' al-wafa'' is not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030}'
  ur: 'خیار النقد وہ حق ہے جو عاقد غیر ادائیگی پر فسخ کی تمکن کے لیے شرط کرتا ہے؛ نقد لغت میں دینے اور قبض کرنے کو کہتے ہیں جیسے نقدت الرجل الدراهم فانتقدها یعنی میں نے اسے دینے پر اس نے قبض کیے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027} اس کی دو صورتیں ہیں: پہلی یہ کہ عقد ہو اور شرط ہو کہ اگر مشتری معلوم مدت تک ثمن ادا نہ کرے تو ان کے درمیان کوئی عقد نہیں، اس میں خیار کا مستعمل مشتری ہے اگرچہ بڑا فائدہ بائع کا ہے، اور یہ مشتری کے لیے خیار الشرط کی شرط کی جگہ ہے؛ دوسری یہ کہ عقد کے بعد مشتری ادا کرے اس اتفاق پر کہ اگر بائع معلوم مدت میں عوض لوٹا دے تو ان کے درمیان کوئی عقد نہیں، اس کا مستعمل بائع ہے جو اکیلا منتفع ہے، اور یہ بیع الوفاء سے مکمل مشابہ ہے اس لیے بعض نے اسے خیار النقد میں داخل کیا، اور یہ بائع کے لیے خیار الشرط کی شرط کی جگہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} اسے مالکیہ، حنابلہ اور حنفیہ نے ثابت کیا سوائے زفر بن ہذیل کے؛ ثوری، اسحاق اور ابو ثور نے بھی کہا، عمر اور ابن عمر سے روایت ہے، اور شافعیہ میں ابو اسحاق شیرازی نے عمر کے اثر سے دلیل دے کر کہا؛ مخالف شافعیہ ہیں صحیح قول پر اور زفر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} مثبتین نے خیار الشرط پر قیاس سے استدلال کیا کہ علت مشترک ہے یعنی تروی، صحابہ کے آثار سے جن میں شریح کا فیصلہ ہے جب مشتری دوسرے دن ثمن لایا تو کہا "تم نے وعدہ خلافی کی"، اور ضرورت سے جیسی خیار الشرط کی ضرورت ہے؛ نافین نے کہا یہ شرطِ فاسدہ ہے جو عقد کو مفسد کرتی ہے کیونکہ اس نے فسخ کو غرر پر ٹانگا، اور زفر نے کہا یہ فاسد اقالہ کی شرط ہے حالانکہ صحیح اقالہ کی شرط بھی مفسد ہے؛ اور کاسانی نے کہا اس کا ثبوت قیاس کے خلاف استحسان سے ہے کہ وہ علقت میں خیار الشرط سے شریک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} اس کا صاحب مشتری یا بائع ہے مشروطہ صورت کے مطابق، اور بائع کا فائدہ زیادہ ہے کیونکہ مشتری کے مُل کرنے پر فسخ سے وہ منتفع ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} اس کی مدت خیار الشرط کی طرح مختلف فیہ ہے: متعاقدین پر تفویض خواہ تین دن سے زیادہ ہو، حنبلی مذہب اور حنفیہ میں صرف محمد بن الحسن کا، اور ثوری و اسحاق کا؛ تین دن پر تحدید ابو حنیفہ اور ابو یوسف کا قول اپنے خیار الشرط کے صنع سے خلاف کرتے ہوئے، اور ابو ثور کا، ابن عمر سے روایت؛ اور مالک کے نزدیک تین کے قریب بشرط بیس دن سے نہ بڑھے؛ ابو حنیفہ اور ابو یوسف کے نزدیک تین سے زیادہ شرط ہو تو اگر تین میں ادا ہو جائز ورنہ بیع فاسد ہے مگر منفسخ نہیں جیسا ظہیر الدین نے تحقیق کی اور ابن ہمام اور ابن عابدین نے تائید کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} وہ سقوط کے اسباب، احکام اور انتقال میں خیار الشرط کی مثیل ہے تو حنفیہ کے نزدیک اپنے اصل کی طرح موروث نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} ابن نجیم نے بیع الوفاء کو اس کے افراد میں کیا اور اس کا بحث اسی کے تحت انسب ٹھہرایا؛ ابن عابدین نے یہ تعلیل پسند نہ کیا کیونکہ وہ اسی وقت اس کا فرد ہے جب تین سے بڑھنے پر اس کے فاسد ہونے کا قول ہو، خیار النقد تین دن سے مقید ہے اور بیع الوفاء مقید نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030}'
  es: "Khiyar al-naqd es un derecho que un contratista estipula poder anular por falta de pago; naqd lingüísticamente significa dar y tomar posesión, como en \"Le pagué al hombre los dirhams y él los tomó\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027} Tiene dos formas: primero, contratar con la estipulación de que si el comprador no paga el precio en un plazo conocido no hay contrato entre ellos, siendo el comprador quien lo ejerce aunque su mayor beneficio es el vendedor, en la posición de una opción estipulada para el comprador; segundo, contratar entonces que el comprador pague, con el acuerdo de que si el vendedor devuelve el contravalor dentro de un plazo establecido no hay contrato, siendo el vendedor quien lo ejerce y es el único beneficiario, un caso muy parecido a bay' al-wafa', por lo que algunos incluyen esa venta dentro de él, en la posición de una opción estipulada para el vendedor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} Es afirmado por los Malikis, Hanbalis y Hanafis excepto Zufar ibn al-Hudhayl, en poder de al-Thawri, Ishaq y Abu Thawr, atribuido a Umar e Ibn Umar, y retenido entre los Shafiis por Abu Ishaq al-Shirazi basándose en el informe de Umar; Los Shafiis en la opinión del sonido y Zufar se oponen a ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} Los afirmadores argumentan por analogía con la opción de estipulación, siendo la causa común la deliberación, por informes de Compañeros, incluyendo el dictamen de Shurayh al respecto cuando el comprador trajo el precio al día siguiente y dijo \"rompiste tu palabra\", y por la necesidad de ello como la necesidad de la opción estipulada; los negadores la llaman una condición corrupta que corrompe el contrato ya que pone la anulación en un gharar, Zufar agrega que estipula una rescisión corrupta mientras que incluso estipular una rescisión válida corrompe; al-Kasani registra que se establece por istihsan contra la analogía ya que comparte con la opción estipulada la característica de condicionalidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} Su titular es el comprador o el vendedor según la forma estipulada, siendo el beneficio del vendedor mayor ya que gana por la anulación si el comprador se demora. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} Su plazo es disputado como la opción estipulada: dejado a las partes incluso más allá de tres días, la escuela Hanbali y Muhammad ibn al-Hasan solos entre los Hanafis, también al-Thawri e Ishaq; fijado en tres días, la opinión de Abu Hanifa y Abu Yusuf, que difiere de su propia regla sobre la opción estipulada, y de Abu Thawr, atribuida a Ibn Umar; y sobre tres días que no excedan los veinte en Malik; Si se estipulan más de tres en la opinión de Abu Hanifa y Abu Yusuf, el pago dentro de los tres es válido, de lo contrario la venta es corrupta y no anulada, como determinó Zahir al-Din y aprobó Ibn al-Humam e Ibn Abidin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} Coincide con la opción estipulada en las causas de caducidad, reglas y transferencia, no siendo heredada en los Hanafis como su origen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} Ibn Nujaym hizo de bay' al-wafa' uno de sus ejemplos y su lugar más apropiado de investigación; Ibn Abidin no aceptó esto, ya que se trata únicamente de una instancia de la opinión que invalida el bay' al-wafa' después de tres días, estando la opción de pago limitada a tres días, mientras que el bay' al-wafa' no lo está. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030}"
  fr: "Khiyar al-naqd est un droit qu'un contractant se réserve le droit d'annuler une transaction en cas de non-paiement. Linguistiquement, naqd signifie donner et reprendre possession, comme dans « J'ai payé les dirhams à l'homme et il les a pris ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027} Ce droit se présente sous deux formes: premièrement, un contrat stipulant que si l'acheteur ne paie pas le prix dans un délai déterminé, il est nul et non avenu. L'acheteur est le bénéficiaire de ce droit, même si le vendeur en tire le plus grand avantage, dans le cadre d'une option stipulée pour l'acheteur; deuxièmement, un contrat prévoyant le paiement par l'acheteur, avec l'accord que si le vendeur restitue la contrepartie dans un délai fixé, il est nul et non avenu. Le vendeur est le seul bénéficiaire de ce droit, ce cas étant très proche du bay' al-wafa', au point que certains y incluent cette vente, dans le cadre d'une option stipulée pour le vendeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8027}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} Il est affirmé par les Malikis, Hanbalis et Hanafis à l'exception de Zufar ibn al-Hudhayl, détenu par al-Thawri, Ishaq et Abu Thawr, attribué à Umar et Ibn Umar, et détenu parmi les Shafiis par Abu Ishaq al-Shirazi s'appuyant sur le rapport d'Umar; les Shafiis sur la vue saine et Zufar s'y opposent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028} Les partisans de cette affirmation s'appuient sur l'analogie avec l'option de stipulation, dont le point commun est la délibération. Ils invoquent également des hadiths, notamment la décision de Shurayh concernant cette option lorsque l'acheteur apporta le prix le lendemain et déclara: « Vous avez manqué à votre parole », ainsi que la nécessité de cette option, similaire à celle de l'option stipulée. Les opposants la qualifient de condition corrompue, car elle subordonne l'annulation à un gharar (contrainte). Zufar ajoute qu'elle stipule une résiliation corrompue, alors même que la stipulation d'une résiliation valable est corrompue. Al-Kasani rapporte qu'elle est établie par istihsan (précision) contre toute analogie, car elle partage avec l'option stipulée la caractéristique de la conditionnalité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8028}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} Son titulaire est l'acheteur ou le vendeur selon la forme stipulée, le vendeur étant avantagé puisqu'il bénéficie de l'annulation en cas de retard de l'acheteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029} Sa durée est sujette à controverse, à l'instar de l'option stipulée: laissée à la discrétion des parties, même au-delà de trois jours, selon l'école hanbalite et Muhammad ibn al-Hasan parmi les hanafites, ainsi que selon al-Thawri et Ishaq; fixée à trois jours, selon l'avis d'Abu Hanifa et d'Abu Yusuf, qui diffère de sa propre règle sur l'option stipulée, et selon celui d'Abu Thawr, attribué à Ibn Umar; et d'environ trois jours ne dépassant pas vingt jours selon Malik. Si, selon l'avis d'Abu Hanifa et d'Abu Yusuf, plus de trois paiements sont stipulés, le paiement effectué dans ce délai est valide; sinon, la vente est considérée comme corrompue et non annulée, comme l'a déterminé Zahir al-Din et comme l'ont approuvé Ibn al-Humam et Ibn Abidin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8029}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} Cela correspond à l'option stipulée concernant les causes de caducité, les règles et le transfert, et n'est pas hérité chez les Hanafites, contrairement à son origine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030} Ibn Nujaym a fait du bay' al-wafa' un de ses cas d'application et le lieu d'étude le plus approprié. Ibn Abidin n'a pas accepté cette interprétation, car elle ne s'applique qu'à l'avis annulant le bay' al-wafa' au-delà de trois jours, l'option de paiement étant limitée à trois jours, contrairement au bay' al-wafa'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8030}"
  tr: "Nakit seçeneği, nakit yokluğu nedeniyle iptal edilmesini mümkün kılmak için yüklenici tarafından belirlenen bir haktır. 'Nakit' terimi 'vermek ve almak' anlamına gelir, yani 'Adama dirhem verdim ve nakde çevirdim', yani ona verdim ve o aldı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8027} İki biçimi vardır: birincisi, alıcı belirli bir süre için fiyatı ödemezse aralarında sözleşme olmaz. Opsiyon, satıcıya daha fazla fayda sağlasa bile, alıcı için koşul seçeneğini belirtmek gibi olsa alıcı tarafından kullanılır; ikincisi ise sözleşmeli sözleşmedir; alıcı nakit ödeme yapar ve satıcı belirli bir süre içinde tazminatı geri verirse aralarında sözleşme olmaz ve satıcı bunu tek lehtar olarak kullanır. Bu, bazıları nakit opsiyonuna dahil ettiği ölçüde bir performansı satmaya çok benzer, satıcı için koşul seçeneğini belirtmek gibidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8027}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8028}, Zafar ibn al-Hudhayl hariç Malikiler, Hanbaliler ve Hanafi tarafından doğrulanmıştır. Al-Thawri, Ishaq, Abu Thawr, Ömer ve İbn Umar'dan rivayet edilmiştir ve Abu Ishaq al-Shirazi bunu Şafii'lerden Ömer rivayetine atıfta bulunarak anlatmıştır ve Sahih ve Zafar'daki Şafiilerle aynı fikirde değildir. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 8028} Yerleşik bilginler, davanın birliği olan anlatı nedeniyle koşul seçeneği için benzetmeyi kanıt olarak kullandılar ve Sahabelerin geleneklerinden, Şuray'ın alıcının yarın fiyatı getirip 'Değiştirdiniz' dediğinde verdiği hükmetten ve gerekliliğinin bir şart seçeneğine olan ihtiyaca benzer olduğunu kanıt olarak kullandılar. Nafus, sözleşmenin iptalinin harara bağlı olması nedeniyle sözleşmenin geçersiz olduğunu kanıt olarak kullandılar. Zafar, geçerli bir feshin ve geçerli bir feshin geçersiz olduğunu, bu yüzden kusurlu bir fesih için daha da geçersiz olduğunu savundu. El-Kasani, kuruluşunun istihsan olduğunu, benzetmenin aksine, kapsamlı yorumda koşul seçeneğinden muzdarip olduğu için belirtti. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.8028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8029}, gerekli forma göre alıcı veya satıcıya aittir ve satıcının bundan elde ettiği fayda daha fazladır çünkü alıcı feragat edebilirse iptal hakkı elde eder. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 8029} Süresi, bir şart seçeneği gibi farklıdır: Hanbali görüşü üç günden fazla olsa bile taraflara yetkilendirme verilir ve yalnızca Muhammed ibn el-Hasan Hanefi'dendir, ardından el-Tevri ve İshaq gelir. Sınırlama üç gündür; bu, Ebu Hanife ve Ebu Yusuf'un görüşüdür, şart seçeneği uygulamasına aykırıdır. Ebu Tevr'in görüşü İbn Ömer'den anlatılır ve Malik'e göre yirmi günü geçmemek koşuluyla üç güne yakındır. Ebu Hanifa ve Ebu Yusuf'a göre üç günden fazla süre şart koşulmuşsa, üçte bir madde kabul edilebilir; aksi takdirde satış geçersiz sayılır ve iptal edilmez, Zahir el-Din tarafından doğrulanmış ve İbn el-Humam ile İbn Edidin tarafından doğrulanmıştır. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.8029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8030} Koşul seçeneği geçersizlik, hüküm ve devretme nedenlerinde benzerdir, bu nedenle Hanefilere göre orijinal biçimine göre miras alınmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8030} İbn Nucaym, ödeme satışını nakit opsiyonunun kategorilerinden biri olarak görmüş ve altındaki konuları tercih etmiştir. İbn Abidin bunu onaylamamıştır çünkü nakit seçeneği üç gün ile sınırlı olduğu ve ödeme satışı kısıtlanmadığı için sadece üçü aşarsa geçersiz sayacaktır, geçerliliği değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8030}"
  id: "Opsi uang tunai adalah hak yang ditetapkan oleh kontraktor untuk memungkinkan pencabutan karena tidak adanya uang tunai. Istilah 'uang tunai' adalah 'memberi dan menerima,' yang berarti 'Saya memberikan dirham kepada pria dan mencairkannya,' artinya saya memberikannya kepadanya dan dia mengambilnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8027} Ada dua bentuk: yang pertama adalah kontrak kontraktual, yang menetapkan bahwa jika pembeli tidak membayar harga untuk jangka waktu tertentu, maka tidak ada kontrak di antara mereka. Opsi ini dijalankan oleh pembeli, meskipun lebih menguntungkan penjual, yang mirip dengan menetapkan opsi syarat bagi pembeli; yang kedua adalah kontrak kontraktual, maka pembeli membayar tunai dengan kesepakatan bahwa jika penjual mengembalikan kompensasi dalam jangka waktu tertentu, tidak ada kontrak di antara mereka, dan penjual menggunakannya sebagai satu-satunya penerima manfaat. Ini sangat mirip dengan menjual suatu pelaksanaan sejauh beberapa orang memasukkannya dalam opsi uang tunai, dan seperti menetapkan opsi syarat bagi penjual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8027} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8028} telah disahkan oleh Maliki, Hanbali, dan Hanafi kecuali Zafar ibn al-Hudhayl. Al-Thawri, Ishaq, Abu Thawr, yang diceritakan dari Umar dan Ibn Umar, dan Abu Ishaq al-Shirazi menceritakannya dari para Syafi'i, mengutip kisah Umar, dan ia tidak setuju dengan para Shafi'i dalam Sahih dan Zafar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8028} Para sarjana mapan menggunakan analogi sebagai bukti opsi kondisi karena kesatuan perkara, yaitu narasi, dan dari tradisi Para Sahabat, termasuk putusan Shurayh ketika pembeli membawa harga besok dan berkata, 'Kamu telah menggantinya,' dan alasan perlunya adalah seperti kebutuhan akan opsi suatu syarat. Nafu menggunakannya sebagai bukti bahwa itu adalah kondisi korup yang membatalkan kontrak, karena pembatalan bersyarat pada gharar. Zafar berargumen bahwa menetapkan pembatalan yang sah dan pembatalan yang sah adalah tidak sah, apalagi jika pembatalan cacat. Al-Kasani menyebutkan bahwa pendiriannya adalah istihsan, bertentangan dengan analogi, karena menderita dari opsi kondisi dalam komentar komprehensif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8029} dimiliki oleh pembeli atau penjual sesuai dengan formulir yang diwajibkan, dan manfaat penjual dari hal itu lebih besar karena ia mendapat manfaat dari pembatalan jika pembeli mampu melepaskannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 8029} Durasinya berbeda seperti opsi syarat: otorisasi bagi pihak-pihak yang mengikat meskipun lebih dari tiga hari, yang merupakan pandangan Hanbali, dan Muhammad ibn al-Hasan saja berasal dari Hanafi, diikuti oleh al-Thawri dan Ishaq. Batas waktunya adalah tiga hari, yang merupakan pendapat Abu Hanifa dan Abu Yusuf, bertentangan dengan praktiknya mengenai opsi kondisi. Pandangan Abu Thawr diceritakan dari Ibn Umar, dan hampir tiga, asalkan tidak melebihi dua puluh hari menurut Malik. Jika lebih dari tiga hari ditetapkan menurut Abu Hanifa dan Abu Yusuf, maka klausul dalam tiga hari diperbolehkan; jika tidak, penjualan dibatalkan dan tidak dibatalkan, sebagaimana diverifikasi oleh Zahir al-Din dan dikonfirmasi oleh Ibn al-Humam dan Ibn Abidin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8029} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8030} Opsi syarat ini serupa dalam hal penyebab pembatalan, keputusan, dan transfer, sehingga menurut Hanafi, kondisi ini tidak diwariskan sesuai bentuk aslinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8030} Ibn Nujaym menganggap penjualan pembayaran sebagai salah satu kategori opsi uang tunai dan lebih memilih topik di bawahnya. Ibn Abidin tidak menyetujui hal ini karena ia termasuk di antara individunya yang hanya akan mengatakan bahwa pembayaran tidak sah jika melebihi tiga hari, bukan masa berlakunya, karena opsi uang tunai dibatasi hanya tiga hari, dan penjualan pembayaran tidak dibatasi olehnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8030}"
