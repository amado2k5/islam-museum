label:
  ar: "كمّون"
  en: "Kammun (cumin)"
  ur: "کمون"
  es: "Kammun (comino)"
  fr: "Kammun (cumin)"
  tr: "kimyon"
  id: "jintan"
summary:
  ar: "الكمون أصناف كثيرة، والكرماني أقواها ثم الفارسي، وهو عند الكتاب حار في الثانية يابس في الثالثة، يطرد الرياح ويحلل، وينفع الأورام والجراح والرعاف، وفي الكتاب ذكر لتفتيت الحصاة والمغص وتقطير البول."
  en: "Cumin, kammun, has many kinds, of which the Kirmani is the strongest and the Persian next. The book classes it as hot in the second degree and dry in the third; it expels wind, resolves swellings and wounds, stops nosebleed, and helps stone, colic and difficult urine."
  ur: "کمون کی کئی اقسام ہیں، جن میں کرمانی سب سے قوی اور اس کے بعد فارسی ہے۔ کتاب اسے دوسرے درجے میں گرم اور تیسرے درجے میں خشک بتاتی ہے؛ یہ ہوا کو خارج کرتا، ورم کو تحلیل کرتا، نکسیر روکتا اور پتھری، مروڑ اور پیشاب کی دشواری میں فائدہ دیتا ہے۔"
  es: "El comino, o kammun, tiene muchas variedades, de las cuales la Kirmani es la más fuerte, seguida de la Persa. El libro la clasifica como caliente en segundo grado y seca en tercero; expulsa los gases, reduce la hinchazón y las heridas, detiene las hemorragias nasales y ayuda con los cálculos, los cólicos y la dificultad para orinar."
  fr: "Le cumin (kammun) se décline en de nombreuses variétés, dont la variété kirmani est la plus puissante, suivie de la variété persane. Le livre le classe comme chaud au deuxième degré et sec au troisième; il chasse les gaz, résorbe les gonflements et les plaies, arrête les saignements de nez et soulage les calculs rénaux, les coliques et les difficultés à uriner."
  tr: "Kimyon birçok çeşide sahiptir; en güçlüsü el-Kermani, ardından Fars çeşidi gelir. Kitaba göre, ikinci çeşitte sıcak, üçüncüsünde kurudur, rüzgarı dışarı atar, çözünür ve tümörlere, yaralara ve burun kanamasına fayda sağlar. Kitapta ayrıca taşları, kolikleri parçalamak ve idrar damıtmak için de bahsedilir."
  id: "Jintan memiliki banyak jenis; al-Kermani adalah yang terkuat, diikuti oleh Persia. Menurut buku, jintan panas pada gigi kedua, kering pada jintan ketiga, mengeluarkan angin, melarutkan, dan bermanfaat bagi tumor, luka, serta mimisan. Buku ini juga menyebutkannya untuk memecah batu, kolik, dan menyuling urin."
