label:
  ar: "الرعاف"
  en: "Ru'af (nosebleed): whether it breaks ablution, how a bleeding worshipper continues or rebuilds his prayer, and its effect on fasting"
  ur: "نکسیر"
summary:
  ar: "الرعاف في اللغة خروج الدم من الأنف، وهو موضوع يتعلق بالوضوء والصلاة والصوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} وذهب المالكية والشافعية وجمهور الصحابة إلى أن الرعاف لا ينقض الوضوء، وقال الحنابلة إنه لا ينقضه إلا إذا كان فاحشا كثيرا، وذهب الحنفية إلى أنه ينقض لسيلان الدم عن موضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8788} وإذا رعف المصلي فللحنفية والمالكية أن يبني على صلاته بعد غسل الدم، وللمالكية شروط في البناء كعدم تلطخ الثوب بأكثر من درهم، وعدم استدبار القبلة من غير عذر، وعدم الكلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} وإذا رعف الإمام استخلف، وإذا دخل دم الرعاف حلق الصائم فسد صومه عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8791}"
  en: "Ru'af is bleeding from the nose; it bears on ablution, prayer and fasting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} The Malikis, Shafi'is and most Companions hold that it does not break ablution; the Hanbalis hold that only a heavy flow breaks it; the Hanafis hold that any flow from its place breaks it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8788} A worshipper who bleeds in prayer may, for the Hanafis and Malikis, wash the blood and go back to finish the prayer; the Malikis set conditions: the cloth must not be soiled beyond a dirham, the qibla must not be turned away without excuse, and he must not speak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} An imam who bleeds appoints a successor. For the Hanafis and Malikis, blood that reaches the throat of a fasting person breaks the fast. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8791}"
  ur: "نکسیر سے وضو ٹوٹنے میں فقہاء کا اختلاف ہے؛ مالکی اور شافعی اسے ناقض نہیں مانتے، جبکہ حنفی سیلان کو ناقض کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8787}"
