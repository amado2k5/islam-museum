label:
  ar: "الرعاف"
  en: "Ru'af (nosebleed): whether it breaks ablution, how a bleeding worshipper continues or rebuilds his prayer, and its effect on fasting"
  ur: "نکسیر"
  es: "Ru'af (hemorragia nasal): si interrumpe la ablución, cómo un fiel que sangra continúa o retoma su oración y su efecto en el ayuno."
  fr: "Ru'af (saignement de nez): s'il interrompt les ablutions, comment un fidèle souffrant de saignement poursuit ou reprend sa prière, et son effet sur le jeûne."
  tr: "Burun kanaması"
  id: "Mimisan"
summary:
  ar: "الرعاف في اللغة خروج الدم من الأنف، وهو موضوع يتعلق بالوضوء والصلاة والصوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} وذهب المالكية والشافعية وجمهور الصحابة إلى أن الرعاف لا ينقض الوضوء، وقال الحنابلة إنه لا ينقضه إلا إذا كان فاحشا كثيرا، وذهب الحنفية إلى أنه ينقض لسيلان الدم عن موضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8788} وإذا رعف المصلي فللحنفية والمالكية أن يبني على صلاته بعد غسل الدم، وللمالكية شروط في البناء كعدم تلطخ الثوب بأكثر من درهم، وعدم استدبار القبلة من غير عذر، وعدم الكلام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} وإذا رعف الإمام استخلف، وإذا دخل دم الرعاف حلق الصائم فسد صومه عند الحنفية والمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8791}"
  en: "Ru'af is bleeding from the nose; it bears on ablution, prayer and fasting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} The Malikis, Shafi'is and most Companions hold that it does not break ablution; the Hanbalis hold that only a heavy flow breaks it; the Hanafis hold that any flow from its place breaks it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8788} A worshipper who bleeds in prayer may, for the Hanafis and Malikis, wash the blood and go back to finish the prayer; the Malikis set conditions: the cloth must not be soiled beyond a dirham, the qibla must not be turned away without excuse, and he must not speak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} An imam who bleeds appoints a successor. For the Hanafis and Malikis, blood that reaches the throat of a fasting person breaks the fast. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8791}"
  ur: "نکسیر سے وضو ٹوٹنے میں فقہاء کا اختلاف ہے؛ مالکی اور شافعی اسے ناقض نہیں مانتے، جبکہ حنفی سیلان کو ناقض کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8787}"
  es: "Ru'af es sangrado nasal; afecta la ablución, la oración y el ayuno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} Los malikíes, shafiíes y la mayoría de los Compañeros sostienen que no invalida la ablución; los hanbalíes sostienen que solo un flujo abundante la invalida; los hanafíes sostienen que cualquier flujo de su lugar la invalida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8788} Un adorador que sangra en la oración puede, para los hanafíes y malikíes, lavar la sangre y volver para terminar la oración; Los malikíes establecieron condiciones: la tela no debe mancharse más allá de un dirham, la qibla no debe desviarse sin excusa y él no debe hablar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} Un imán que sangra designa a un sucesor. Para los hanafíes y los malikíes, la sangre que llega a la garganta de una persona en ayuno rompe el ayuno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8791}"
  fr: "Le ru'af est un saignement de nez; il a une incidence sur les ablutions, la prière et le jeûne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} Les Malikites, les Shafi'ites et la plupart des Compagnons estiment qu'il n'invalide pas les ablutions; les Hanbalites considèrent que seul un écoulement abondant les invalide; les Hanafites considèrent que tout écoulement provenant du nez les invalide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8788} Un fidèle qui saigne pendant la prière peut, selon les Hanafites et les Malikites, se laver le sang et reprendre la prière. Les Malikites ont établi des conditions: le tissu ne doit pas être souillé au-delà d’un dirham, la qibla ne doit pas être détournée sans excuse valable, et l’imam ne doit pas parler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} Un imam qui saigne désigne un successeur. Pour les Hanafites et les Malikites, le sang qui atteint la gorge d’une personne qui jeûne rompt le jeûne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8791}"
  tr: "Dilde burun kanaması, burundan kan akmasını ifade eder ve abdest al, namaz ve oruçla ilgili bir konudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8786} Malikiler, Şafiiler ve çoğu sahabe, burun kanamasının abdest almayı geçersiz kılmadığını savunmuştur. Hanbaliler, ancak çok müstehcen ise bunu geçersiz kıldığını söylerken, Hanafiler yerinden kanamayı geçersiz kıldığını savunmuştur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8788} Eğer ibadet eden kişi titriyorsa, Hanafi ve Malikiler kanı yıkadıktan sonra dualarını inşa etmelidir. Malikilerin yapımında bir dirhemden fazla dirhem ile boyanmama, sebepsiz yere kıble çevirmemek ve düzgün konuşmamak gibi şartlar vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8790} İmam solgunlaşırsa, vekil gibi davranır ve burundan kan boğaza girerse, oruç tutan kişinin orucu Hanafi ve Malikilere göre geçersiz sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8791}"
  id: "Mimisan dalam bahasa merujuk pada keluarnya darah dari hidung, dan ini adalah topik yang berkaitan dengan wudhu, doa, dan puasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8786} Para Maliki, syafi'i, dan mayoritas Sahabat berpendapat bahwa mimisan tidak membatalkan wudhu. Hanbalis mengatakan bahwa mimisan hanya membatalkan jika sangat cabul, sementara Hanafi berpendapat bahwa itu membatalkan pendarahan dari tempatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8788} Jika penyembah gemetar, para Hanafi dan Malik harus mendoakan setelah mencuci darah. Para Malik memiliki syarat dalam pembangunan, seperti tidak boleh menodai pakaian dengan lebih dari satu dirham, tidak membalik Qibla tanpa alasan, dan tidak berbicara dengan benar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8790} Jika imam menjadi pucat, ia bertindak sebagai wakil, dan jika darah dari hidung masuk ke tenggorokan, puasa orang yang berpuasa dibatalkan menurut Hanafi dan Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8791}"
