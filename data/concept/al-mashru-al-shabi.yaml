label:
  ar: المشروع الشعبي
  en: "Popular enterprise (al-mashru al-shabi)"
  es: "Empresa popular (al-mashru al-shabi)"
  fr: "Entreprise populaire (al-mashru al-shabi)"
  ur: "پاپولر انٹرپرائز ⁦(المشرو الشعبی)⁩"
  tr: "Popüler Proje"
  id: "Proyek Populer"
summary:
  ar: "المؤسسات الشعبية عند قعدات منشآت تشارك فيها أكبر أعداد من الجمهور، فيعمل كل قادر بحسب طاقته: الجهد العضلي، أو العقلي، أو المهارة، أو المال {cite:qadan-manhaj-iqtisad-quran p. 93}، {cite:qadan-manhaj-iqtisad-quran p. 94}. ومن مزاياها عنده الشورى في القرار، ورفض هيمنة رأس المال، ورجوع الفائدة على الجميع، والمراقبة الذاتية للعمل {cite:qadan-manhaj-iqtisad-quran p. 95}. ويقترح أن تقوم حول معاهد فنية مدن أو قرى إنتاجية متخصصة تُدعم بمعاهد نظرية {cite:qadan-manhaj-iqtisad-quran p. 95}، {cite:qadan-manhaj-iqtisad-quran p. 96}."
  tr: "Halk kurumları, en fazla halkı kapsayan kurumlarda bulunur, bu nedenle her yetenekli kişi kendi yeteneğine göre çalışır: kas çabası, zihinsel çaba, beceri veya para {cite:qadan-manhaj-iqtisad-kur'an s. 93}, {cite:qadan-manhaj-iqtisad-kuran s. 94}. Onun için avantajları arasında karar alma sürecinde danışma, sermaye hakimiyetinin reddi, herkese faiz geri getirme ve işin kendi kendini denetlemesi yer alır {cite:qadan-manhaj-iqtisad-kur'an s. 95}. Teorik enstitüler tarafından desteklenen teknik enstitüler etrafında uzmanlaşmış üretim şehirleri veya köyleri kurulması önerilmektedir {cite:qadan-manhaj-iqtisad-qur'an s. 95}, {cite:qadan-manhaj-iqtisad-kuran, s. 96}."
  id: "Institusi publik ditemukan di institusi yang mencakup populasi terbesar, sehingga setiap orang yang mampu bekerja sesuai kemampuannya: usaha fisik, usaha mental, keterampilan, atau uang {cite:qadan-manhaj-iqtisad-qur'an hlm. 93}, {cite:qadan-manhaj-iqtisad-quran hlm. 94}. Keuntungannya meliputi konsultasi dalam pengambilan keputusan, penolakan dominasi modal, pengembalian minat kepada semua orang, dan pengaturan diri atas pekerjaan {cite:qadan-manhaj-iqtisad-qur'an hlm. 95}. Disarankan untuk mendirikan kota atau desa produksi khusus di sekitar institut teknis yang didukung oleh institut teoretis {cite:qadan-manhaj-iqtisad-qur'an hlm. 95}, {cite:qadan-manhaj-iqtisad-qur'an, hlm. 96}."
