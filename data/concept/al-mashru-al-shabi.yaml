summary:
  ar: "المؤسسات الشعبية عند قعدات منشآت تشارك فيها أكبر أعداد من الجمهور، فيعمل كل قادر بحسب طاقته: الجهد العضلي، أو العقلي، أو المهارة، أو المال {cite:qadan-manhaj-iqtisad-quran p. 93}، {cite:qadan-manhaj-iqtisad-quran p. 94}. ومن مزاياها عنده الشورى في القرار، ورفض هيمنة رأس المال، ورجوع الفائدة على الجميع، والمراقبة الذاتية للعمل {cite:qadan-manhaj-iqtisad-quran p. 95}. ويقترح أن تقوم حول معاهد فنية مدن أو قرى إنتاجية متخصصة تُدعم بمعاهد نظرية {cite:qadan-manhaj-iqtisad-quran p. 95}، {cite:qadan-manhaj-iqtisad-quran p. 96}."
