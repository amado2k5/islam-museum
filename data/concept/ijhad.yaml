label: { ar: "إجهاض", en: "Abortion (ijhad)" }
summary:
  ar: "الإجهاض في اللغة إلقاء الولد قبل تمامه، وفي الاصطلاح إلقاء الجنين قبل وقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705} وإجهاض الجنين بعد نفخ الروح، وهو بعد مائة وعشرين يوماً، محرم بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1706} وقبل نفخ الروح اختلف الفقهاء: فمنهم من أباحه بعذر فقط، كالحنفية، ومنهم من أباحه في أول الحمل كالحنابلة في رواية، ومنع الشافعية الإجهاض بعد استقرار النطفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1708}"
  en: "Ijhad in the lexicon is the early delivery of a child, and as a term it is the expulsion of a foetus before its time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705} After ensoulment, at about a hundred and twenty days, abortion is forbidden by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1706} Before ensoulment the jurists differ: some allow it only for an excuse, as the Hanafis do; some allow it at the earliest stage, as one Hanbali view does; and the Shafi'is forbid it once the drop has settled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1708}"
