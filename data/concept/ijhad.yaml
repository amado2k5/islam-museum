id: concept/ijhad
class: concept
kind: legal
label: { ar: "إجهاض", en: "Abortion (ijhad)", es: "Aborto (ijhad)", fr: "Avortement (ijhad)", ur: "اسقاط حمل ⁦(جہاد)⁩" }
summary:
  ar: "الإجهاض في اللغة إلقاء الولد قبل تمامه، وفي الاصطلاح إلقاء الجنين قبل وقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705} وإجهاض الجنين بعد نفخ الروح، وهو بعد مائة وعشرين يوماً، محرم بالإجماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1706} وقبل نفخ الروح اختلف الفقهاء: فمنهم من أباحه بعذر فقط، كالحنفية، ومنهم من أباحه في أول الحمل كالحنابلة في رواية، ومنع الشافعية الإجهاض بعد استقرار النطفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1708}"
  en: "Ijhad in the lexicon is the early delivery of a child, and as a term it is the expulsion of a foetus before its time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705} After ensoulment, at about a hundred and twenty days, abortion is forbidden by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1706} Before ensoulment the jurists differ: some allow it only for an excuse, as the Hanafis do; some allow it at the earliest stage, as one Hanbali view does; and the Shafi'is forbid it once the drop has settled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1708}"
  es: "Ijhad en el léxico es el parto prematuro de un niño, y como término es la expulsión de un feto antes de tiempo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705} Después de la infusión del alma, alrededor de los ciento veinte días, el aborto está prohibido por consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1706} Antes de la infusión del alma, los juristas difieren: algunos lo permiten solo como excusa, como los Hanafi; algunos lo permiten en la etapa más temprana, como una opinión Hanbali; y los Shafi'i lo prohíben una vez que la gota se ha asentado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1708}"
  fr: "Dans le lexique, l'ijhad désigne l'accouchement prématuré, et plus précisément l'expulsion du fœtus avant terme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1705} Après l'animation, soit environ cent vingt jours après la conception, l'avortement est interdit par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1706} Avant l'animation, les juristes divergent: certains l'autorisent uniquement comme motif d'exemption, comme les hanafites; d'autres l'autorisent dès le début de la grossesse, comme le fait une opinion hanbalite; et les chaféites l'interdisent une fois que la goutte d'eau est tombée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1707} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1708}"
  ur: "لغت میں اجہاد بچے کی جلد پیدائش ہے، اور اصطلاح کے طور پر یہ جنین کو اس کے وقت سے پہلے نکالنا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1705} وصیت کے بعد تقریباً ایک سو بیس دن تک، اجماع سے اسقاط حمل حرام ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1706} وصیت کرنے سے پہلے فقہاء کا اختلاف ہے: بعض نے صرف عذر کے لیے اجازت دی ہے جیسا کہ احناف کرتے ہیں۔ کچھ ابتدائی مرحلے میں اس کی اجازت دیتے ہیں، جیسا کہ ایک حنبلی کا قول ہے۔ اور شافعی اس سے منع کرتے ہیں جب قطرہ جم جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1707}"
