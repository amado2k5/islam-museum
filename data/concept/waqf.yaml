id: concept/waqf
education:
  did_you_know:
    ar: "الوقف حبس الأصل وتسبيل ثمرته في وجوه البر؛ وبه قامت المساجد والمدارس والمستشفيات، ومولت الأوقاف المراكز العلمية في البصرة والكوفة وبغداد ودمشق."
    en: "A waqf immobilises the principal and devotes its yield to good — the institution that built the Islamic world's mosques, schools and hospitals, funding the learned centres of Basra, Kufa, Baghdad and Damascus."
    ur: "وقف اصل کو محبوس اور اس کی پیداوار کو نیکی میں وقف کرنا ہے — وہ ادارہ جس نے اسلامی دنیا کی مسجدیں، مدرسے اور ہسپتال بنائے اور بصرہ، کوفہ، بغداد اور دمشق کے علمی مراکز چلائے۔"
    sources: [source/nazarat-mawdu-iyya-azhar, source/usul-iqtisad-islami-0660]
