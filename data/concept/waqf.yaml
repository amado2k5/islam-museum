label:
  ar: الوقف
  en: Waqf
summary:
  ar: "حبس الأصل وتسبيل ثمرته في وجوه البر؛ المؤسسة الاقتصادية التي بنيت بها المساجد والمدارس والمستشفيات في التاريخ الإسلامي. ويذكر محيي الدين عفيفي أحمد أن الأوقاف مولت المراكز العلمية في البصرة والكوفة وبغداد ودمشق وحلب والقاهرة والقيروان، وأن المساجد كانت مراكز للعلم وصيانتها وما يُصرف على القائمين عليها من أوقاف {cite:nazarat-mawdu-iyya-azhar p. 81} {cite:nazarat-mawdu-iyya-azhar p. 82}. يبين المؤلف أن الوقف أنواع: ذري، وعام للمسلمين، وخيري لفئة معينة، وأن الفقه عرف الشخصية الاعتبارية للوقف، فالدين الذي على الناظر يكون على الوقف، وأن الذمة تبقى مقدرة بعد الموت حتى تُصفّى الحقوق، وأن القرض والكفالة من عقود الإرفاق."
  en: "Waqf. Muhyi al-Din Afifi Ahmad says endowments funded the learning centres of Basra, Kufa, Baghdad, Damascus, Aleppo, Cairo and Qayrawan, and that mosques were centres of learning whose upkeep and staff were paid from endowed funds (pp. 81-82)."
