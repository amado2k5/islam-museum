label:
  ar: الوقف
  en: Waqf
summary:
  ar: "الوقف في الفقه الإسلامي تأسيس وقف خيري، وهو أيضًا الوقف نفسه، ويسميه المالكية الحبس: يعلن المرء بنية القربة أن جزءًا من ماله لا يُتصرف فيه، ويعين أشخاصًا أو مرافق عامة مستفيدين من غلته. وتعرض دائرة المعارف الإسلامية خلاف المذاهب في ما يوقف ومن يستفيد وإدارة الوقف والاستبدال وانتهائه، ثم تاريخه في مصر منذ العصر العباسي حتى وزارة الأوقاف وفي شمال أفريقيا المرينية. ويذكر محيي الدين عفيفي أحمد أن الأوقاف مولت المراكز العلمية في البصرة والكوفة وبغداد ودمشق وحلب والقاهرة والقيروان {cite:nazarat-mawdu-iyya-azhar p. 81} {cite:nazarat-mawdu-iyya-azhar p. 82}."
  en: "In Islamic law the waqf, called habs by Maliki jurists, is the act of founding a charitable trust and the trust itself: a person, intending a pious deed, declares part of their property unalienable and names persons or public utilities as beneficiaries of its yield. The Encyclopaedia of Islam sets out where the schools differ on what may be endowed, who may benefit, administration, exchange of property and ending, then follows the institution in Egypt from the Abbasid period to the Waqf Ministry and in Marinid North Africa. Muhyi al-Din Afifi Ahmad says endowments funded the learning centres of Basra, Kufa, Baghdad, Damascus, Aleppo, Cairo and Qayrawan (pp. 81-82)."
  ur: "اسلامی فقہ میں وقف، جسے مالکی فقہاء حبس کہتے ہیں، خیراتی ٹرسٹ قائم کرنے کا عمل اور خود وہ ٹرسٹ ہے: کوئی شخص نیکی کی نیت سے اپنی جائیداد کا حصہ ناقابلِ انتقال قرار دیتا ہے اور اس کی پیداوار کے مستفید افراد یا عوامی سہولتیں مقرر کرتا ہے۔ دائرۃ المعارف اسلامیہ بیان کرتا ہے کہ مذاہب کہاں اختلاف کرتے ہیں: کیا وقف ہو سکتا ہے، کون مستفید ہو، انتظام، استبدال اور خاتمہ؛ پھر عباسی دور سے وزارتِ اوقاف تک مصر میں اور مرینی شمالی افریقہ میں اس کی تاریخ۔ محیی الدین عفیفی احمد کے مطابق اوقاف نے بصرہ، کوفہ، بغداد، دمشق، حلب، قاہرہ اور قیروان کے علمی مراکز کو سہارا دیا۔"
