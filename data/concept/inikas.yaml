label: { ar: "الانعكاس", en: "Inikas (reverse concomitance and the reverse analogy in usul)", es: "Inikas (concomitancia inversa y analogía inversa en usul)", fr: "Inikas (concomitance inverse et analogie inverse dans usul)", ur: "انیکاس ⁦(صلح میں معکوس ہم آہنگی اور الٹا تشبیہ)⁩" }
summary:
  ar: "الانعكاس لغة مصدر انعكس، والعكس رد أول الشيء على آخره. وقياس العكس عند الأصوليين إثبات عكس حكم شيء لمثله لتعاكسهما في العلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} والانعكاس عندهم انتفاء الحكم بانتفاء العلة، كانتفاء حرمة الخمر بزوال إسكارها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} وذهب جمهور الأصوليين إلى أن الانعكاس مع الاطراد مسلك من مسالك العلة، ولم يعتبره الحنفية وكثير من الأشعرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512}"
  en: "Inikas is lexically the reflexive of ‘aks, which is turning the beginning of a thing back on its end. Among the usulis, the reverse analogy (qiyas al-‘aks) is the establishment of the reverse of a ruling for a like thing because the two are reversed in their cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} For them inikas is the absence of a ruling through the absence of its cause, as the prohibition of wine ends with the end of its intoxication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} Most usulis hold that inikas together with ittirad is a way of knowing the cause; the Hanafis and many Ash'aris, including al-Ghazali and al-Amidi, do not count it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512}"
  es: "Inikas es léxicamente el reflexivo de 'aks, que es invertir el comienzo de algo hasta su final. Entre los usulis, la analogía inversa (qiyas al-'aks) es el establecimiento de la reversión de una norma para una cosa similar porque ambas están invertidas en su causa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} Para ellos, inikas es la ausencia de una norma por la ausencia de su causa, como la prohibición del vino termina con el fin de su embriaguez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} La mayoría de los usulis sostienen que inikas junto con ittirad es una forma de conocer la causa; los hanafíes y muchos ash'aris, incluidos al-Ghazali y al-Amidi, no la tienen en cuenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512}"
  fr: "Inikas est le réflexif de 'aks, qui signifie inverser le début d'une chose à sa fin. Chez les usulis, l'analogie inverse (qiyas al-'aks) consiste à établir l'inverse d'une règle pour une chose semblable, car les deux sont inversées dans leur cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} Pour eux, inikas est l'absence d'une règle par absence de sa cause, de même que l'interdiction du vin prend fin avec la fin de son ivresse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} La plupart des usulis considèrent qu'inikas, conjointement à ittirad, est un moyen de connaître la cause; les hanafites et de nombreux ash'arites, dont al-Ghazali et al-Amidi, ne la prennent pas en compte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512}"
  ur: "انیکاس لغوی طور پر 'اکس' کا اضطراری ہے، جو کسی چیز کے آغاز کو اس کے اختتام پر موڑ دیتا ہے۔ اصولوں میں، الٹی تشبیہ ⁦(قیاس العکس)⁩ ایک جیسی چیز کے لیے الٹ حکم کا قیام ہے کیونکہ دونوں اپنے اپنے سبب میں الٹ ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص3512} ان کے نزدیک دلیل کی عدم موجودگی میں حکم کی عدم موجودگی ہے کیونکہ شراب کی حرمت اس کے نشہ کے خاتمے کے ساتھ ختم ہوجاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3512} اکثر علماء کا خیال ہے کہ اعتراد کے ساتھ انیکاس وجہ کو جاننے کا ایک طریقہ ہے۔ احناف اور بہت سے اشعری، بشمول الغزالی اور العمیدی، اسے شمار نہیں کرتے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3512}"
