label: { ar: "الانعكاس", en: "Inikas (reverse concomitance and the reverse analogy in usul)" }
summary:
  ar: "الانعكاس لغة مصدر انعكس، والعكس رد أول الشيء على آخره. وقياس العكس عند الأصوليين إثبات عكس حكم شيء لمثله لتعاكسهما في العلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} والانعكاس عندهم انتفاء الحكم بانتفاء العلة، كانتفاء حرمة الخمر بزوال إسكارها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} وذهب جمهور الأصوليين إلى أن الانعكاس مع الاطراد مسلك من مسالك العلة، ولم يعتبره الحنفية وكثير من الأشعرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512}"
  en: "Inikas is lexically the reflexive of ‘aks, which is turning the beginning of a thing back on its end. Among the usulis, the reverse analogy (qiyas al-‘aks) is the establishment of the reverse of a ruling for a like thing because the two are reversed in their cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} For them inikas is the absence of a ruling through the absence of its cause, as the prohibition of wine ends with the end of its intoxication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512} Most usulis hold that inikas together with ittirad is a way of knowing the cause; the Hanafis and many Ash'aris, including al-Ghazali and al-Amidi, do not count it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3512}"
