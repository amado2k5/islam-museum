id: concept/false-testimony-zur
class: concept
kind: legal
label:
  ar: "شَهادة الزُّور"
  en: "Shahadat al-zur (false testimony: its proof, its punishment, the effect of a judgement based on it, and the repentance of the false witness)"
  es: "Shahadat al-zur (el falso testimonio: su prueba, su castigo, el efecto de un juicio basado en él y el arrepentimiento del falso testigo)"
  fr: "Shahadat al-zur (le faux témoignage: sa preuve, sa punition, l’effet d’un jugement fondé sur celui-ci et le repentir du faux témoin)"
summary:
  ar: "شهادة الزور الشهادة بالكذب ليتوصل بها إلى الباطل، وهي من الكبائر ومحرمة شرعا. تثبت بالإقرار أو بقيام البينة عليها أو بأن يشهد الشاهد بما يقطع بكذبه، ويعزر شاهد الزور باتفاق الفقهاء، ويختلفون في كيفية تعزيره، فيشهر به عند الحنفية ويضرب ويحبس عند بعضهم. وقضاء الحاكم بها ينفذ ظاهرا لا باطنا عند الجمهور، ويضمن الشهود ما ترتب عليها، وفي القتل عمدا خلاف بين القصاص والدية، وتقبل شهادة التائب بعد مدة تظهر فيها توبته عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10225} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232}"
  en: "False testimony is the giving of testimony known to be false in order to reach a falsehood. It is a major sin and forbidden by law. It is proved by the witness's own admission, by evidence against him, or by his testifying to what is certainly false. The jurists agree that a false witness is disciplined, though they differ on how: the Hanafis publicise him, and some beat and imprison him. A judgement based on false testimony takes effect outwardly, not inwardly, according to the majority, and the witnesses must make good what it caused; for a deliberate killing the Shafi'is and Hanbalis apply retaliation while the Hanafis and most Malikis owe blood money. A witness who repents, after a period in which his repentance shows, is accepted by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10225} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232}"
  es: "El falso testimonio consiste en dar testimonio a sabiendas de que es falso con el fin de llegar a una falsedad. Es un pecado grave y está prohibido por la ley. Se prueba mediante la propia confesión del testigo, mediante pruebas en su contra o por su testimonio sobre algo que es ciertamente falso. Los juristas coinciden en que un falso testigo es castigado, aunque difieren en el método: los hanafíes lo exponen públicamente, y algunos lo golpean y encarcelan. Según la mayoría, una sentencia basada en falso testimonio tiene efectos externos, no internos, y los testigos deben reparar el daño causado; por un homicidio deliberado, los shafiíes y hanbalíes aplican la represalia, mientras que los hanafíes y la mayoría de los malikíes exigen una indemnización por homicidio. Un testigo que se arrepiente, tras un período en el que se evidencia su arrepentimiento, es aceptado por la mayoría. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10225} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10226} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10227} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10229} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10230} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10231} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232}"
  fr: "Le faux témoignage consiste à faire un témoignage sciemment mensonger dans le but d'établir un mensonge. Il s'agit d'un péché grave, interdit par la loi. Il est prouvé par l'aveu même du témoin, par des preuves à charge, ou par son témoignage manifestement faux. Les juristes s'accordent sur la sanction du faux témoin, mais divergent quant à la manière: les hanafites le rendent public, tandis que d'autres le font battre et emprisonner. Selon la majorité, un jugement fondé sur un faux témoignage a un effet extérieur, non intérieur, et les témoins doivent réparer le préjudice causé; pour un meurtre prémédité, les chaféites et les hanbalites appliquent la vengeance, tandis que les hanafites et la plupart des malikites doivent verser le prix du sang. Un témoin qui se repent, après une période durant laquelle son repentir est manifeste, est accepté par la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10225} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232}"
