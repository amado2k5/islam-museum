id: concept/false-testimony-zur
class: concept
kind: legal
label:
  ar: "شَهادة الزُّور"
  en: "Shahadat al-zur (false testimony: its proof, its punishment, the effect of a judgement based on it, and the repentance of the false witness)"
summary:
  ar: "شهادة الزور الشهادة بالكذب ليتوصل بها إلى الباطل، وهي من الكبائر ومحرمة شرعا. تثبت بالإقرار أو بقيام البينة عليها أو بأن يشهد الشاهد بما يقطع بكذبه، ويعزر شاهد الزور باتفاق الفقهاء، ويختلفون في كيفية تعزيره، فيشهر به عند الحنفية ويضرب ويحبس عند بعضهم. وقضاء الحاكم بها ينفذ ظاهرا لا باطنا عند الجمهور، ويضمن الشهود ما ترتب عليها، وفي القتل عمدا خلاف بين القصاص والدية، وتقبل شهادة التائب بعد مدة تظهر فيها توبته عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10225} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232}"
  en: "False testimony is the giving of testimony known to be false in order to reach a falsehood. It is a major sin and forbidden by law. It is proved by the witness's own admission, by evidence against him, or by his testifying to what is certainly false. The jurists agree that a false witness is disciplined, though they differ on how: the Hanafis publicise him, and some beat and imprison him. A judgement based on false testimony takes effect outwardly, not inwardly, according to the majority, and the witnesses must make good what it caused; for a deliberate killing the Shafi'is and Hanbalis apply retaliation while the Hanafis and most Malikis owe blood money. A witness who repents, after a period in which his repentance shows, is accepted by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10225} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10229} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10231} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10232}"
