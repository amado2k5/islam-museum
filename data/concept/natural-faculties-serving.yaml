label: { ar: "القوى الطبيعية الخادمة عند ابن سينا", en: "The serving natural faculties in the Canon", ur: "قانون میں خادم طبعی قوتیں", es: "Las facultades naturales que sirven en el Canon", fr: "Les facultés naturelles au service du canon", tr: "İbn Sina'da Hizmet Eden Doğal Güçler", id: "Kekuatan Alam yang Melayani di Ibn Sina" }
summary:
  ar: "الخادمة الصرفة من القوى الطبيعية أربع تخدم الغاذية: الجاذبة والماسكة والهاضمة والدافعة، لكل منها عمل في الغذاء وآلة من ليف العضو {cite:canon-ibn-sina-print-v1 p.96}."
  en: "The purely serving natural faculties are four and serve the nutritive: the attractive, retentive, digestive and expulsive, each with its work upon food and its tool in the fibres of the organ {cite:canon-ibn-sina-print-v1 p.96}."
  es: "Las facultades naturales puramente de servicio son cuatro y sirven a la nutrición: la atractiva, la retentiva, la digestiva y la expulsiva, cada una con su trabajo sobre los alimentos y su herramienta en las fibras del órgano {cite:canon-ibn-sina-print-v1 p.96}."
  fr: "Les facultés naturelles purement servantes sont au nombre de quatre et servent la nutrition: l'attraction, la rétention, la digestion et l'expulsion, chacune avec son travail sur les aliments et son outil dans les fibres de l'organe {cite:canon-ibn-sina-print-v1 p.96}."
  ur: "خالص طور پر خدمت کرنے والی قدرتی صلاحیتیں چار ہیں اور غذائیت کی خدمت کرتی ہیں: پرکشش، برقرار رکھنے والی، ہاضمہ اور خارج کرنے والی، ہر ایک اپنے کھانے پر کام کرتا ہے اور عضو کے ریشوں میں اس کے آلے کے ساتھ۔"
  tr: "Doğal güçlerin saf hizmetkârı dört beseğe hizmet eder: çekici, tutucu, sindirici ve dürtü; her biri besin ve organ lifi makinesi {cite:canon-ibn-sina-print-v1 s.96}."
  id: "Pelayan murni dari kekuatan alam melayani empat makanan: penarik (attractor), holding, digestive, dan impulse, masing-masing memiliki fungsi dalam makanan dan mesin serat organ {cite:canon-ibn-sina-print-v1 hlm.96}."
