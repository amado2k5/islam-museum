summary:
  ar: "يأمر ابن سينا المرضع برياضة معتدلة وأغذية حسنة الكيموس، وأن لا تجامع البتة لأنه يحرك دم الطمث فيفسد رائحة اللبن ويقل مقداره، وربما حبلت فيضر الولدين جميعاً {cite:canon-ibn-sina-print-v1 p.209}."
  en: "Ibn Sina bids the nursing woman take moderate exercise and food of good chyme, and not to have intercourse at all, because it stirs the menstrual blood, spoils the smell of the milk and lowers its amount, and she may conceive, which harms both children {cite:canon-ibn-sina-print-v1 p.209}."
