id: concept/canon-the-wet-nurses-regimen-and-abstinence
class: concept
kind: scientific
label: { ar: "تدبير المرضعة والامتناع عن الجماع", en: "The wet nurse's regimen and abstinence from intercourse", ur: "دایہ کی تدبیر اور ہم بستری سے پرہیز", es: "El régimen de la nodriza y la abstinencia sexual.", fr: "Le régime de la nourrice et l'abstinence sexuelle" }
summary:
  ar: "يأمر ابن سينا المرضع برياضة معتدلة وأغذية حسنة الكيموس، وأن لا تجامع البتة لأنه يحرك دم الطمث فيفسد رائحة اللبن ويقل مقداره، وربما حبلت فيضر الولدين جميعاً {cite:canon-ibn-sina-print-v1 p.209}."
  en: "Ibn Sina bids the nursing woman take moderate exercise and food of good chyme, and not to have intercourse at all, because it stirs the menstrual blood, spoils the smell of the milk and lowers its amount, and she may conceive, which harms both children {cite:canon-ibn-sina-print-v1 p.209}."
  es: "Ibn Sina le ordena a la mujer lactante que haga ejercicio moderado y consuma alimentos ricos en quino, y que no tenga relaciones sexuales en absoluto, porque agita la sangre menstrual, estropea el olor de la leche y disminuye su cantidad, y puede concebir, lo cual perjudica a ambos niños {cite:canon-ibn-sina-print-v1 p.209}."
  fr: "Ibn Sina conseille à la femme qui allaite de faire de l'exercice modéré et de manger des aliments de bonne qualité, et de ne pas avoir de rapports sexuels du tout, car cela agite le sang menstruel, gâche l'odeur du lait et en diminue la quantité, et elle peut concevoir, ce qui nuit aux deux enfants {cite:canon-ibn-sina-print-v1 p.209}."
  ur: "ابن سینا نے دودھ پلانے والی عورت کو کہا ہے کہ وہ اعتدال والی ورزش کرے اور اچھی چائیم والی غذا کھائے اور ہمبستری ہر گز نہ کرے کیونکہ یہ ماہواری کے خون کو تیز کرتا ہے، دودھ کی بو کو خراب کرتا ہے اور اس کی مقدار کو کم کرتا ہے اور وہ حاملہ ہو سکتی ہے جس سے دونوں بچوں کو نقصان پہنچتا ہے۔"
