id: concept/tathaqqub-al-asnan-wa-taakkuluha
class: concept
kind: scientific
label:
  ar: تثقب الأسنان وتأكلها
  en: The perforation and corrosion of the teeth
  ur: دانتوں کا سوراخ اور کتراؤ
summary:
  ar: يعرض تثقب الأسنان وتأكلها كله من رطوبة رديئة تعفن فيها، والغرض في علاج التأكل منع الزيادة على ما انأكل وذلك بتنقية الجوهر الفاسد منه وتحليل المادة المؤدية إلى ذلك ويمنع السن أن تقبل تلك المواد وتصرف تلك المواد عنها بالاستفراغات إن احتيج إليها، والأدوية المانعة من التأكل هي المجففة فإن كان قوياً احتاج إلى قوي شديد التجفيف والإسخان وإن كان ضعيفاً كفى ما فيه تجفيف وقبض من هذا الجنس {cite:canon-ibn-sina-print-v2 p.274}
  en: 'The teeth''s perforation and corrosion all arise from a bad moisture putrefying in them. The aim in treating the corrosion is to stop its increasing beyond what is already eaten: cleansing its corrupt substance, dissolving the matter leading to that, barring the tooth from receiving those matters and turning them away by evacuations when needed. The corrosion-repelling drugs are the drying ones — a strong corrosion needs a strong one of hard drying and heating, a weak one is answered by what has drying and astringency of this kind {cite:canon-ibn-sina-print-v2 p.274}'
  ur: دانتوں کا سوراخ اور کتراؤ سب ایک بری رطوبت سے ہوتا ہے جو انہیں میں سڑ جاتی ہے؛ کتراؤ کے علاج کا مقصد اسے اس سے آگے بڑھنے سے روکنا ہے جو کٹ چکا ہے، اور یہ اس کے بگڑے جوہر کی صفائی، اس طرف لے جانے والی مواد کی تحلیل، دانت کو ان مواد قبول کرنے سے روکنے اور ضرورت پڑے تو اخراجوں سے ان کا پھیرنے سے ہوتا ہے؛ کتراؤ روکنے والی ادویہ خشک کرنے والی ہیں — قوی کتراؤ کو سخت خشک اور گرم کرنے والی قوی چیز چاہیے اور کمزور کو اسی جنس کی خشکی اور قبض والی کافی ہے {cite:canon-ibn-sina-print-v2 p.274}
