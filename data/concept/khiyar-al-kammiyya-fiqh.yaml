id: concept/khiyar-al-kammiyya-fiqh
class: concept
kind: legal
label:
  ar: خيار الكمية
  en: Khiyar al-kammiyya (option for the unknown quantity of the price)
  ur: خیار الکمیت
summary:
  ar: 'خيار الكمية في اصطلاح الفقهاء على ما عرفه صاحب الفتاوى السراجية خيار البائع في الثمن، والمراد به حق البائع في الفسخ لخفاء مقدار الثمن عند التعاقد، وسمي بذلك لجهل كمية الثمن لعدم رؤيته رؤية مفيدة بل يرى في وعاء لا يمكن معرفة مقداره، وهو شديد الشبه من حيث الغرض بخيار الرؤية لكنه لم يندرج فيه لأن خيار الرؤية لا يثبت في النقود، والكمية مصدر صناعي من «كم» أداة السؤال عن المقدار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8012} لهذا الخيار تطبيقات على قلتها فهو يقع في المساومات الودية والمصالحة عن الحقوق فيلجأ المبادل إلى تقديم صرة من المال أو ربطة من الأوراق النقدية، وقد يشتري الشخص في المبايعات العادية شيئا بما في جيبه أو حقيبته من النقود دون بيان المقدار، وإثباته للبائع عند معرفة المقدار يحقق تمام التراضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} أثبته الحنفية وأدرجوه في عداد خياراتهم ورأوه مكملا لخيار الرؤية، واستدلوا له بالقياس على خيار العيب فهو خيار نقيصة، وربما كان ثبوته علاجا للجهالة التي ثبت لأجلها خيار الرؤية درءا لها وتخفيفا للغرر، فالحنفية في مقارنتهم بينه وبين خيار الرؤية يدنونه إليه فكأنه هو لولا تخصيص خيار الرؤية بالأعيان وخيار الكمية بالنقود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} من شروط صحة البيع معرفة مقدار الثمن ووصفه إذا كان من الأثمان المطلقة التي تثبت مطلقة عن الإشارة إليها، وذلك لتنتفي الجهالة الفاحشة التي تمنع التسليم والتسلم بخلاف المشار إليه، فالعلم بالمقدار كقوله عشرة دراهم والعلم بالصفة تحديد الدراهم بنسبة مميزة لها عن غيرها إذا اختلفت إذ المشتري يريد دفع الأدون والبائع يطلب الأرفع، والعقد بثمن مجهول غير صحيح كالبيع بقيمته أو بما حل به أو بما يريد المشتري أو يحب أو بجعل الثمن رأس المال أو ما اشتراه به أو بمثل ما اشترى فلان ما لم يعلم بقدر ذلك في مجلس العقد فإن علم جاز، ومنه البيع بمثل ما يبيع الناس إلا أن يكون شيئا لا يتفاوت، ومنه البيع على قدر ما باع به وقد اختلف أو على ما يبيع به في المستقبل فهذا فاسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} وإذا لم يكن الثمن مسمى بالعدد والنوع بل كان مشارا إليه فإما أن تكون الإشارة إلى ذاته أو إلى وعائه، ففي الإشارة المباشرة إليه كما لو كانت الدراهم في يده مرئية له صح العقد ولزم ولا خيار له لأن الباقي جهالة وصف لا تضر إذ لا تمنع التسليم والتسلم، وأما إذا كان في وعاء مانع من معرفة مقداره ولو تقريبا كصندوق أو خابية أو صرة ثم رآه بعدئذ باديا دون وعاء فله الخيار لأنه لم يعرف مقداره من الخارج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014} وفصل صاحب الدر من الحنفية في الصرة فجعل العبرة معرفة ما فيها من خارج فإن كانت تعرف فلا خيار وإلا كانت بمثابة الخابية، والضابط أن الوعاء المشتمل على الثمن إن دل على ما فيه دلالة تقريبية فلا يثبت معه خيار الكمية وإلا ثبت الخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014} وتعرض الشافعية لما إذا كان الثمن غير مسمى ولا محددا بل صرة دراهم تمت المبادلة بها جزافا لا يعلم المتعاقدان قدرها لكنها مشاهدة لهما فصح البيع بلا خلاف، وهل يكره البيع بصرة الدراهم جزافا؟ فيه قولان حكاهما الخراسانيون أصحهما يكره وبه قطع الشيرازي وآخرون لما فيه من الغرر، والثاني لا يكره لأنها مشاهدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014}'
  en: 'Khiyar al-kammiyya in the jurists'' usage, as the author of al-Fatawa al-Sirajiyya defines it, is the seller''s option in the price: the seller''s right to annul for the hidden amount of the price at the contracting; it is so named for the ignorance of the price''s quantity since it is not seen in a way that informs, being seen inside a container whose contents cannot be known; it is very close in purpose to the option of sight but does not fall under it because the option of sight does not stand in currency, and kammiyya is a technical verbal noun of kam, the particle of asking about amount. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8012} It has applications though few: it occurs in friendly bargainings and in settlements of rights, where the exchanger tenders a purse of money or a bundle of banknotes, and sometimes in ordinary sales a person buys a thing for the money in his pocket or bag without stating the amount, and affirming this option for the seller when the amount is learned completes full consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} The Hanafis affirm it, list it among their options and regard it as complementary to the option of sight, arguing for it by analogy with the option of defect so that it is an option of deficiency, its establishment perhaps being a treatment of the ignorance for which the option of sight was established, averting it and reducing gharar; the Hanafi comparison brings it near the option of sight as though it were it, save that the option of sight is confined to specific things and the option of quantity to currency. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} Among the conditions of a valid sale is knowing the amount and description of the price when it is of the absolute prices which are established without pointing, so that the gross ignorance preventing delivery and receipt is removed, unlike what is pointed at; knowledge of the amount is like saying ten dirhams, and knowledge of the description is specifying the dirhams by the mark that distinguishes them from others when kinds differ, since the buyer wants to pay the baser and the seller demands the finer; a contract for an unknown price is invalid, like selling for its value, for what falls due, for what the buyer wants or likes, for the capital or what he bought it for or for the like of what so-and-so bought for, unless that is known in the session in which case it is allowed; and of it is selling for what people sell for unless the thing does not vary, and selling at the price one previously sold for when it varied or at what will be sold for in the future, which is corrupt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} If the price is not named by number and kind but pointed at, the pointing is either to the thing itself or to its container; in direct pointing, as when the dirhams are in his hand visible to him, the contract is valid and binding with no option, because what remains is ignorance of description which does not harm since it does not bar delivery and receipt; but if it is in a container preventing knowledge of its amount even approximately, like a box, a jar or a purse, and he then sees it outside the container, he has the option because he had not known its amount from outside. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014} Ibn Abidin of the Hanafis refined the purse case making the criterion knowledge of its contents from outside: if knowable there is no option, else it takes the rule of the jar; and the standard is that a container holding the price which indicates its contents, even approximately, bars the option of quantity, otherwise the option stands. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014} The Shafiis treat the case where the price is unnamed and undefined, a purse of dirhams exchanged by estimate with neither party knowing its amount but both seeing it, the sale being valid without dispute; whether sale for a purse of dirhams by estimate is disliked is transmitted in two views by the Khurasani scholars, the sounder being dislike, which al-Shirazi and others held decisively for the gharar in it, and the second that it is not disliked because it is seen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014}'
  ur: 'خیار الکمیت فقہاء کی اصطلاح میں فتاوٰی سراجیہ کے مصنف کی تعریف کے مطابق ثمن میں بائع کا خیار ہے یعنی عقد کے وقت ثمن کی مقدار کے مخفی رہنے پر فسخ کا حق؛ اسے یہ نام ثمن کی مقدار کے جہل کی وجہ سے ملا کیونکہ اسے ایسے دیکھا نہیں جاتا کہ مقدار معلوم ہو بلکہ وہ کسی ایسے برتن میں ہوتا ہے جس کا اندازہ نہیں ہو سکتا؛ یہ غرض کے لحاظ سے خیار الرؤیت سے بہت مشابہ ہے مگر اس میں شامل نہیں کیونکہ خیار الرؤیت نقدوں میں ثابت نہیں ہوتا، اور کمیت «کم» سے بنی اصطلاحی مصدر ہے جو مقدار پوچھنے کی ادات ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8012} اس خیار کے اطلاق گو کہ کم ہیں مگر وہ دوستانہ مساومات اور حقوق کی صلح میں واقع ہوتے ہیں جہاں مبادلہ کرنے والا پیسے کی تھیلی یا نوٹوں کی گڈی پیش کرتا ہے، اور بعض اوقات عام بیعوں میں بھی شخص اپنی جیب یا بستہ کے پیسوں سے مقدار بتائے بغیر خریدتا ہے؛ مقدار جاننے پر بائع کے لیے اس خیار کا ثبوت کامل تراضی فراہم کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} حنفیہ نے اسے ثابت کیا اور اپنی خیارات میں شمار کر کے خیار الرؤیت کا مکمل جانا؛ انہوں نے خیار العیب سے قیاس کر کے استدلال کیا تو یہ خیار نقص بنی، اور غالباً اس کا ثبوت اسی جہالت کا علاج ہے جس کے لیے خیار الرؤیت ثابت ہوئی، جہالت دفع اور غرر کم کرنے کے لیے؛ حنفیہ کا اسے خیار الرؤیت سے قریب کرنا ایسا ہے گویا وہی ہے سوائے اس کے کہ خیار الرؤیت اعیان اور خیار الکمیت نقدوں کے لیے مخصوص ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} بیع کی صحت کی شرطوں میں ثمن کی مقدار اور اس کے وصف کا علم ہے جب ثمن ان اثمانِ مطلقہ میں سے ہو جو اشارے کے بغیر مطلقاً ثابت ہوتے ہیں تاکہ تسلیم و تسلم کو روکنے والی فاحش جہالت باقی نہ رہے بعکس اشارہ کی ہوئی چیز کے؛ مقدار کا علم جیسے «دس درہم» کہنا ہے اور وصف کا علم درہموں کی وہ نسبت بتانا جو ان کو دوسروں سے الگ کرے جب ان کی اقسام مختلف ہوں کیونکہ مشتری ادنیٰ دینا چاہتا ہے اور بائع اعلٰی مانگتا ہے؛ مجہول ثمن کا عقد صحیح نہیں جیسے اپنی قیمت پر، واجب الادا رقم پر، مشتری کی مرضی یا چاہت پر، سرمایہ یا اپنی خریداری کی قیمت یا فلاں شخص کی خرید جیسی قیمت پر بیچنا — جب تک مجلسِ عقد میں وہ معلوم نہ ہو ورنہ جائز ہے؛ اور اسی میں لوگوں کی بیع جیسی قیمت پر بیچنا ہے مگر وہ چیز ہو جو متفاوت نہ ہو، اور اس قیمت پر جس پر اس نے پہلے بیچا جب وہ متفاوت ہو یا مستقبل کی بیع قیمت پر جو فاسد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8013} اگر ثمن عدد اور جنس سے مسمی نہ ہو بلکہ اس کی طرف اشارہ کیا گیا ہو تو اشارہ یا تو خود اس کی طرف ہوتا ہے یا اس کے برتن کی طرف؛ براہ راست اشارے میں جیسے درہم اس کے ہاتھ میں اور اسے دکھائی دے رہے ہوں تو عقد صحیح اور لازم ہے اور کوئی خیار نہیں کیونکہ باقی رہ جانے والی جہالت وصف کی ہے جو نقصان نہیں دیتی کہ تسلیم و تسلم سے نہیں روکتی؛ اور اگر وہ کسی ایسے برتن میں ہو جو تقریباً بھی مقدار جاننے سے روکے جیسے صندوق، خابیہ یا پیسے کی تھیلی، پھر وہ اسے بعد میں برتن کے باہر دیکھے تو اسے خیار ہے کیونکہ اس نے پہلے باہر سے اس کی مقدار نہیں جانی تھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014} حنفیہ کے صاحب الدر ابن عابدین نے تھیلی میں تفصیل کی اور معیار باہر سے اس کے اندر کی چیز کا علم بنایا: معلوم ہو جائے تو خیار نہیں ورنہ وہ خابیہ کے حکم میں ہے؛ اور ضابط یہ ہے کہ ثمن رکھنے والا برتن اگر اپنی مندرجات کی طرف تقریبی دلالت بھی کرتا ہو تو اس کے ساتھ خیار الکمیت ثابت نہیں ہوتا ورنہ خیار ثابت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014} شافعیہ نے اس صورت کا ذکر کیا کہ ثمن نہ مسمی ہو نہ محدد بلکہ درہموں کی ایک تھیلی ہو جس سے جزافاً مبادلہ ہو دونوں متعاقدین اس کی مقدار نہ جانتے ہوں مگر دونوں کو دکھائی دے رہی ہو تو بیع بلا خلاف صحیح ہے؛ اور کیا تھیلی درہم جزافاً پر بیع مکروہ ہے؟ اس میں خراسانیوں کے نقل کردہ دو قول ہیں جن میں اصح یہ ہے کہ مکروہ ہے اور یہی شیرازی اور دیگر کا جزم ہے غرر کی وجہ سے، اور دوسرا کہ مکروہ نہیں کیونکہ وہ دکھائی دے رہی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8014}'
