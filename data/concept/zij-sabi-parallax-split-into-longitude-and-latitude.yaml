label: { ar: "تقسيم اختلاف المنظر إلى طول وعرض بالزاوية", en: "Splitting the parallax into longitude and latitude by the angle", ur: "زاویے سے اختلافِ منظر کو طول اور عرض میں تقسیم", es: "Dividir la paralaje en longitud y latitud por el ángulo" }
summary:
  ar: "يقسم البتاني اختلاف المنظر في دائرة الارتفاع إلى زاويتين: زاوية الطول وزاوية العرض، ويعرف كل واحدة بوترها ويضربها في اختلاف المنظر ثم يقسم على ستين، فيخرج اختلاف المنظر في الطول وفي العرض. {cite:zij-sabi-nallino-byblion p.119}."
  en: "Al-Battani divides the parallax in the altitude circle into two angles, the angle of longitude and the angle of latitude. He takes the chord of each, multiplies it by the parallax and divides by sixty, which gives the parallax in longitude and the parallax in latitude. {cite:zij-sabi-nallino-byblion p.119}."
  ur: "البتانی دائرۂ ارتفاع کے اختلافِ منظر کو دو زاویوں میں بانٹتے ہیں: طول کا زاویہ اور عرض کا زاویہ۔ ہر ایک کا وتر لے کر اختلافِ منظر سے ضرب دیتے ہیں اور ساٹھ پر تقسیم کرتے ہیں، تو طول اور عرض میں اختلافِ منظر نکلتا ہے۔ {cite:zij-sabi-nallino-byblion p.119}۔"
  es: "Al-Battani divide la paralaje en el círculo de altitud en dos ángulos: el de longitud y el de latitud. Calcula la cuerda de cada uno, la multiplica por la paralaje y la divide entre sesenta, obteniendo así la paralaje en longitud y la paralaje en latitud. {cite:zij-sabi-nallino-byblion p.119}."
