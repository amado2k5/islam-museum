summary:
  ar: "تاريخ النقود المضروبة في خوارزم ولحكامها من الفتح العربي إلى الغزو المغولي: انتقال من دراهم الملك والفارس بالخط الخوارزمي إلى النقود الإسلامية الكوفية، وفترات منع فيها الضرب، ثم إمبراطورية نقدية أنوشتكينية {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 225}."
