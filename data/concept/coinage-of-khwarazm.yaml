label: { ar: "نقود خوارزم الإسلامية ⁦(القرن 8–13)⁩", en: "Coinage of Islamic Khwarazm (8th–13th century)", ur: "اسلامی خوارزم کے سکے ⁦(آٹھویں تا تیرھویں صدی)⁩", es: "Acuñación de monedas del jurazm islámico (siglos VIII-XIII)", fr: "Monnaie du Khwarezm islamique (VIIIe-XIIIe siècle)", tr: "İslami Harezm Paraları (8.–13. yüzyıllar)", id: "Koin Islam Khwarezmian (abad ke-8–13)" }
summary:
  ar: "تاريخ النقود المضروبة في خوارزم ولحكامها من الفتح العربي إلى الغزو المغولي: انتقال من دراهم الملك والفارس بالخط الخوارزمي إلى النقود الإسلامية الكوفية، وفترات منع فيها الضرب، ثم إمبراطورية نقدية أنوشتكينية {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 225}."
  en: "History of the coins struck in Khwarazm and for its rulers from the Arab conquest to the Mongol invasion: a passage from king-and-horseman drachms in Khwarezmian script to Islamic Kufic coinage, periods in which minting was barred, and then an Anushtegin imperial coinage {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 225}."
  ur: "عرب فتح سے منگول حملے تک خوارزم میں اور اس کے حکمرانوں کے لیے ڈھلے سکوں کی تاریخ: خوارزمی رسم الخط والے بادشاہ اور سوار کے درہموں سے اسلامی کوفی سکوں کی طرف منتقلی، سکہ سازی پر پابندی کے ادوار، اور پھر انوشتگینی شاہی سکے {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 225}۔"
  es: "Historia de las monedas acuñadas en Corasmia y para sus gobernantes desde la conquista árabe hasta la invasión mongola: un paso desde los dracmas del rey y el jinete en escritura corazmita hasta la acuñación cúfica islámica, períodos en los que se prohibió la acuñación y luego una acuñación imperial anushtegina {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 225}."
  fr: "Histoire des pièces de monnaie frappées au Khwarezm et pour ses dirigeants, de la conquête arabe à l'invasion mongole: un passage des drachmes du roi et du cavalier en écriture khwarezmienne à la monnaie islamique coufique, aux périodes où la frappe était interdite, puis à une monnaie impériale anushtegine {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 225}."
  tr: "Arap fethi ve Moğol istilasından Moğol istilasına kadar Harezm'de ve yöneticilerinde basılan paraların tarihi: Horezm alfabesindeki kraliyet ve şövalye dirhemlerinden İslami Kufi paralarına geçiş, darphane basmanın yasaklandığı dönemler, ardından Anuştakian para imparatorluğu {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 225}."
  id: "Sejarah koin yang dicetak di Khwarezm dan para penguasanya dari penaklukan Arab hingga invasi Mongol: transisi dari dirham kerajaan dan ksatria dalam aksara Khwarezmian ke koin Kufi Islam, periode ketika pencetakan diblokir, lalu kekaisaran moneter Anushtakian {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 225}."
