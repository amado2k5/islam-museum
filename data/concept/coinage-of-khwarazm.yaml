  ur: "عرب فتح سے منگول حملے تک خوارزم میں اور اس کے حکمرانوں کے لیے ڈھلے سکوں کی تاریخ: خوارزمی رسم الخط والے بادشاہ اور سوار کے درہموں سے اسلامی کوفی سکوں کی طرف منتقلی، سکہ سازی پر پابندی کے ادوار، اور پھر انوشتگینی شاہی سکے {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 225}۔"
