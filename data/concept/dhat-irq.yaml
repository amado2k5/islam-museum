label:
  ar: "ذات عرق"
  en: "Dhat Irq (the pilgrim's station for the people of Iraq)"
  ur: "ذات عرق ⁦(اہل عراق کا میقات)⁩"
  es: "Dhat Irq (la estación de peregrinación para el pueblo de Irak)"
  fr: "Dhat Irq (la station de pèlerinage pour le peuple d'Irak)"
summary:
  ar: "ذات عرق ميقات أهل العراق ومن يمر بها من أهل الآفاق، وهي على مرحلتين من مكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371} لا خلاف في أن الإحرام منها واجب على من قصد مكة لحج أو عمرة، ولا خلاف في أن المواقيت الأربعة ثابتة بالنص، أما ذات عرق فالحنفية والجمهور يثبتونها بالنص، والمالكية في المدونة والشافعي في الأم يثبتونها بالاجتهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373}"
  en: "Dhat Irq is the pilgrim's station (miqat) for the people of Iraq and for others who pass it, two stages from Mecca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371} All agree that a pilgrim or umra-goer passing it must enter the state of ihram there, and that the four other stations are fixed by the text. Whether Dhat Irq is fixed by the text or by Umar's judgement is disputed: the Hanafis, the majority of the Shafi'is and Hanbalis and Ata' hold it is fixed by the text, while Malik in the Mudawwana and al-Shafi'i in al-Umm hold it is fixed by judgement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373}"
  ur: "ذات عرق اہل عراق اور ان کے راستے سے گزرنے والوں کا میقات ہے، جو مکہ سے دو مرحلے پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371} اس کا نص سے ثابت ہونا یا عمر کے اجتہاد سے ہونا فقہاء کے درمیان مختلف فیہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8372}"
  es: "Dhat Irq es la estación de peregrinación (miqat) para los iraquíes y para quienes la transitan, a dos etapas de La Meca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371} Todos coinciden en que un peregrino o un viajero de la Umrah que la pase debe entrar allí en estado de ihram, y que las otras cuatro estaciones están fijadas por el texto. Se discute si Dhat Irq está fijada por el texto o por el juicio de Umar: los hanafíes, la mayoría de los shafi'íes y hanbalíes, y los ata' sostienen que está fijada por el texto, mientras que Malik en el Mudawwana y al-Shafi'i en al-Umm sostienen que está fijada por el juicio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373}"
  fr: "Dhat Irq est le point de passage (miqat) du pèlerinage pour les Irakiens et pour tous ceux qui le franchissent, à deux étapes de La Mecque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371} Tous s'accordent à dire que le pèlerin ou le fidèle effectuant la umra qui le traverse doit y entrer en état d'ihram, et que les quatre autres points de passage sont fixés par le texte. La question de savoir si Dhat Irq est fixé par le texte ou par l'appréciation d'Umar est controversée: les hanafites, la majorité des chaféites et des hanbalites, ainsi que les Ata', estiment qu'il est fixé par le texte, tandis que Malik dans la Mudawwana et al-Shafi'i dans al-Umm estiment qu'il est fixé par l'appréciation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373}"
