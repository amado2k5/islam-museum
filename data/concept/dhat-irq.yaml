label:
  ar: "ذات عرق"
  en: "Dhat Irq (the pilgrim's station for the people of Iraq)"
  ur: "ذات عرق (اہل عراق کا میقات)"
summary:
  ar: "ذات عرق ميقات أهل العراق ومن يمر بها من أهل الآفاق، وهي على مرحلتين من مكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371} لا خلاف في أن الإحرام منها واجب على من قصد مكة لحج أو عمرة، ولا خلاف في أن المواقيت الأربعة ثابتة بالنص، أما ذات عرق فالحنفية والجمهور يثبتونها بالنص، والمالكية في المدونة والشافعي في الأم يثبتونها بالاجتهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373}"
  en: "Dhat Irq is the pilgrim's station (miqat) for the people of Iraq and for others who pass it, two stages from Mecca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371} All agree that a pilgrim or umra-goer passing it must enter the state of ihram there, and that the four other stations are fixed by the text. Whether Dhat Irq is fixed by the text or by Umar's judgement is disputed: the Hanafis, the majority of the Shafi'is and Hanbalis and Ata' hold it is fixed by the text, while Malik in the Mudawwana and al-Shafi'i in al-Umm hold it is fixed by judgement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8373}"
  ur: "ذات عرق اہل عراق اور ان کے راستے سے گزرنے والوں کا میقات ہے، جو مکہ سے دو مرحلے پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371} اس کا نص سے ثابت ہونا یا عمر کے اجتہاد سے ہونا فقہاء کے درمیان مختلف فیہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8372}"
