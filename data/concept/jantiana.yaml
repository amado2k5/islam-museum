id: concept/jantiana
class: concept
kind: natural
label:
  ar: "جنطيانا"
  en: "Jantiana (gentian, a plant the editor glosses as the snake's medicine)"
  ur: "جنطیانا"
  es: "Jantiana (genciana, una planta que el editor interpreta como la medicina de la serpiente)"
  fr: "Jantiana (gentiane, une plante que l'éditeur décrit comme le remède du serpent)"
summary:
  ar: "نبات يشبه ورقه ورق الجوز، تُتخذ منه عصارة بنقعه أياماً ثم طبخه وتعقيده؛ مفتّح، حار في الثالثة يابس في الثانية، ينفع البهق والجراح والرمد وأوجاع العصب ولسع الهوام، ويدرّ البول والطمث ويُخرج الجنين {cite:canon-ibn-sina-print-v1 p.420} {cite:canon-ibn-sina-print-v1 p.421}."
  en: "A plant whose leaves resemble walnut leaves. Its juice is made by soaking for days, boiling and thickening. It opens obstructions; hot in the third degree and dry in the second. The book lists it for vitiligo, wounds, eye inflammation, nerve pains and bites of vermin, and also lists its use to move the urine and the menses and to expel the foetus {cite:canon-ibn-sina-print-v1 p.420} {cite:canon-ibn-sina-print-v1 p.421}. The editor's footnote gives it as a plant that is the snake's medicine and the wolf's palm {cite:canon-ibn-sina-print-v1 p.421}."
  ur: "ایک پودا جس کے پتے اخروٹ کے پتوں سے ملتے ہیں؛ اس کا عرق کئی دن بھگو کر، پکا کر اور گاڑھا کر کے بنایا جاتا ہے۔ یہ مفتّح ہے، تیسرے درجے میں گرم اور دوسرے میں خشک ہے۔ کتاب اسے برص، زخموں، آنکھ کی سوزش، اعصابی دردوں اور حشرات کے کاٹنے میں مفید بتاتی ہے، اور پیشاب، حیض جاری کرنے اور جنین کے اخراج کے بیانات بھی درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.420} {cite:canon-ibn-sina-print-v1 p.421}۔ حاشیے کے مطابق یہ سانپ کی دوا اور بھیڑیے کی ہتھیلی کا نام ہے {cite:canon-ibn-sina-print-v1 p.421}۔"
  es: "Una planta cuyas hojas se asemejan a las del nogal. Su jugo se obtiene remojándola durante días, hirviéndola y espesándola. Desatasca obstrucciones; caliente en tercer grado y seca en segundo. El libro la menciona para el vitíligo, heridas, inflamación ocular, dolores nerviosos y picaduras de parásitos, y también indica su uso para regular la micción y la menstruación, y para expulsar el feto {cite:canon-ibn-sina-print-v1 p.420} {cite:canon-ibn-sina-print-v1 p.421}. La nota al pie del editor la describe como una planta que es la medicina de la serpiente y la palma del lobo {cite:canon-ibn-sina-print-v1 p.421}."
  fr: "Une plante dont les feuilles ressemblent à celles du noyer. Son jus est obtenu par macération pendant plusieurs jours, suivie d'une ébullition et d'une réduction. Il est réputé débloquer les voies respiratoires; chaud au troisième degré et sec au deuxième. Le livre mentionne son utilisation contre le vitiligo, les plaies, les inflammations oculaires, les douleurs nerveuses et les piqûres d'insectes, ainsi que pour faciliter le transit intestinal, les menstruations et l'expulsion du fœtus {cite:canon-ibn-sina-print-v1 p.420} {cite:canon-ibn-sina-print-v1 p.421}. La note de bas de page de l'éditeur la désigne comme la plante du serpent et le palmier du loup {cite:canon-ibn-sina-print-v1 p.421}."
