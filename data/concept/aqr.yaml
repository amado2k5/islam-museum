class: concept
kind: legal
label:
  ar: "العَقْر"
  en: "Wounding an animal that cannot be taken (aqr) and its effect on lawfulness and liability"
  ur: "عقر (جانور کو زخمی کرنا)"
summary:
  ar: "العقر في اللغة الجرح، ويقال عقر الفرس والبعير بالسيف إذا قطع قوائمه، وأصله ضرب قوائم الدابة، ويستعمله الفقهاء بمعنى الجرح في أي موضع من بدن الحيوان الوحشي غير المقدور عليه، وبمعنى ضرب قوائم الحيوان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11764}. وللعقر أثر في حل أكل لحم الحيوان في الصيد، وفيما ند من الإبل والبقر والغنم فلا يقدر عليها صاحبها، وفي هذا خلاف عند المالكية، وأجاز الحنفية إلحاق الصيال به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766}. وفي حيوانات الغنيمة عند العجز عن نقلها يختلف الفقهاء في عقرها، فمنع الشافعية والحنابلة عقرها إلا للأكل، وأجازه بعض الفقهاء عند الحاجة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11767}. وفي ضمان ما يتلفه الكلب العقور إذا أطلق، خلاف بين الشافعية والحنفية والمالكية، وتفصيل بحسب إذن الدخول ووجه الاتخاذ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769}."
  en: "In the lexicon, aqr is wounding; a horse or camel is hamstrung with a sword by cutting its legs. The jurists use it in two senses: a wound in any part of the body of a wild animal that cannot be caught, and the cutting of an animal's legs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11764}. Wounding has an effect on whether the flesh of an animal may be eaten: a hunted animal that is caught by a wound is lawful when the conditions of the hunt are met, and an animal of domestic kind that runs wild and cannot be caught is lawful by wounding, according to the majority; the Malikis disagree on the wild animals of domestic kind {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766}. The Hanafis apply the same rule to an animal that attacks a man and cannot be restrained. On the spoils of war that cannot be carried away, the Shafi'is and Hanbalis forbid their wounding except to eat them, while some allow it in case of need {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11767}. On the liability for a vicious dog that wounds a person or tears clothes, the Shafi'is and a view of Abu Yusuf hold the owner liable; Abu Hanifa does not, and Muhammad distinguishes whether the owner drove or urged it on; the Malikis divide liability for killing by intent and by the owner's knowledge {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769}."
