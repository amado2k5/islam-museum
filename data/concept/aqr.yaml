label:
  ar: "العَقْر"
  en: "Wounding an animal that cannot be taken (aqr) and its effect on lawfulness and liability"
  fr: "Blesser un animal qu’on ne peut capturer (aqr) : effets sur la licéité et la responsabilité"
  ur: "عقر ⁦(جانور کو زخمی کرنا)⁩"
  es: "Herir a un animal que no puede ser capturado (aqr) y su efecto en la legalidad y la responsabilidad."
summary:
  ar: "العقر في اللغة الجرح، ويقال عقر الفرس والبعير بالسيف إذا قطع قوائمه، وأصله ضرب قوائم الدابة، ويستعمله الفقهاء بمعنى الجرح في أي موضع من بدن الحيوان الوحشي غير المقدور عليه، وبمعنى ضرب قوائم الحيوان {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11764}. وللعقر أثر في حل أكل لحم الحيوان في الصيد، وفيما ند من الإبل والبقر والغنم فلا يقدر عليها صاحبها، وفي هذا خلاف عند المالكية، وأجاز الحنفية إلحاق الصيال به {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766}. وفي حيوانات الغنيمة عند العجز عن نقلها يختلف الفقهاء في عقرها، فمنع الشافعية والحنابلة عقرها إلا للأكل، وأجازه بعض الفقهاء عند الحاجة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11767}. وفي ضمان ما يتلفه الكلب العقور إذا أطلق، خلاف بين الشافعية والحنفية والمالكية، وتفصيل بحسب إذن الدخول ووجه الاتخاذ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769}."
  en: "In the lexicon, aqr is wounding; a horse or camel is hamstrung with a sword by cutting its legs. The jurists use it in two senses: a wound in any part of the body of a wild animal that cannot be caught, and the cutting of an animal's legs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11764}. Wounding has an effect on whether the flesh of an animal may be eaten: a hunted animal that is caught by a wound is lawful when the conditions of the hunt are met, and an animal of domestic kind that runs wild and cannot be caught is lawful by wounding, according to the majority; the Malikis disagree on the wild animals of domestic kind {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766}. The Hanafis apply the same rule to an animal that attacks a man and cannot be restrained. On the spoils of war that cannot be carried away, the Shafi'is and Hanbalis forbid their wounding except to eat them, while some allow it in case of need {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11767}. On the liability for a vicious dog that wounds a person or tears clothes, the Shafi'is and a view of Abu Yusuf hold the owner liable; Abu Hanifa does not, and Muhammad distinguishes whether the owner drove or urged it on; the Malikis divide liability for killing by intent and by the owner's knowledge {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769}."
  fr: "Dans le lexique, aqr signifie blesser ; on coupe les jarrets d’un cheval ou d’un chameau à l’épée en lui sectionnant les pattes. Les juristes l’emploient en deux sens : une blessure en n’importe quelle partie du corps d’un animal sauvage qu’on ne peut capturer, et le sectionnement des pattes d’un animal {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11764}. La blessure a un effet sur la licéité de la consommation de sa chair : un animal chassé qui est pris par une blessure est licite lorsque les conditions de la chasse sont remplies, et un animal d’espèce domestique devenu sauvage et impossible à capturer est licite par blessure, selon la majorité ; les malikites divergent sur les animaux sauvages d’espèce domestique {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766}. Les hanafites appliquent la même règle à un animal qui attaque un homme et qu’on ne peut maîtriser. Pour les animaux du butin de guerre qu’on ne peut emmener, les shafiites et les hanbalites interdisent de les blesser, sauf pour les manger, tandis que certains l’autorisent en cas de besoin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11767}. Quant à la responsabilité pour un chien dangereux qui blesse une personne ou déchire des vêtements, les shafiites et un avis d’Abu Yusuf tiennent le propriétaire pour responsable ; Abu Hanifa ne le tient pas pour responsable, et Muhammad distingue selon que le propriétaire l’a poussé ou excité ; les malikites distinguent la responsabilité en cas de mort selon l’intention et la connaissance du propriétaire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11768} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769}."
  es: "En el léxico, aqr significa herida; un caballo o camello es desgarrado con una espada cortándole las patas. Los juristas lo usan en dos sentidos: una herida en cualquier parte del cuerpo de un animal salvaje que no puede ser capturado, y el corte de las patas de un animal {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11764}. La herida tiene un efecto en si la carne de un animal puede ser consumida: un animal cazado que es capturado por una herida es lícito cuando se cumplen las condiciones de la caza, y un animal doméstico que corre salvaje y no puede ser capturado es lícito por herida, según la mayoría; los malikíes discrepan sobre los animales salvajes domésticos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11765} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766}. Los hanafíes aplican la misma regla a un animal que ataca a un hombre y no puede ser contenido. En cuanto al botín de guerra que no puede ser llevado, los shafi'ís y los hanbalíes prohíben herirlo excepto para comerlo, mientras que algunos lo permiten en caso de necesidad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11766} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11767}. En cuanto a la responsabilidad por un perro feroz que hiere a una persona o desgarra la ropa, los shafi'ís y una opinión de Abu Yusuf hacen responsable al dueño; Abu Hanifa no lo hace, y Muhammad distingue si el dueño lo condujo o lo incitó; los Maliki dividen la responsabilidad por matar por intención y por conocimiento del propietario {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11768} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11769}."
  ur: "لغت میں عقر زخم ہے؛ گھوڑے یا اونٹ کی ٹانگیں کاٹ کر تلوار سے لٹکایا جاتا ہے۔ فقہاء اسے دو معنوں میں استعمال کرتے ہیں: جنگلی جانور کے جسم کے کسی حصے میں ایسا زخم جو پکڑا نہ جا سکے، اور جانور کی ٹانگوں کا کاٹنا۔ زخم کا اثر اس بات پر ہوتا ہے کہ آیا کسی جانور کا گوشت کھایا جا سکتا ہے: شکاری جانور جو زخم سے پکڑا گیا ہو جب شکار کی شرائط پوری ہو جائیں تو حلال ہے، اور گھریلو قسم کا جانور جو جنگلی دوڑتا ہے اور پکڑا نہیں جا سکتا، جمہور کے نزدیک زخم لگا کر حلال ہے۔ مالکیوں کا گھریلو قسم کے جنگلی جانوروں کے بارے میں اختلاف ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11765} احناف یہی حکم اس جانور پر بھی لاگو کرتے ہیں جو انسان پر حملہ کرتا ہے اور اسے روکا نہیں جا سکتا۔ جنگ کے مال غنیمت پر جو لے جایا نہیں جا سکتا، شافعیہ اور حنبلی اپنے زخم کو کھانے سے منع کرتے ہیں، جب کہ بعض ضرورت پڑنے پر اس کی اجازت دیتے ہیں۔ ایک شیطانی کتے کی ذمہ داری جو کسی شخص کو زخمی کردے یا کپڑے پھاڑ دے، شافعی اور ابو یوسف کا قول اس کے مالک کو ذمہ دار ٹھہراتا ہے۔ ابوحنیفہ ایسا نہیں کرتا، اور محمد یہ فرق کرتے ہیں کہ آیا مالک نے گاڑی چلائی یا اس پر زور دیا؛ مالکیوں نے ارادہ اور مالک کے علم سے قتل کی ذمہ داری کو تقسیم کیا ہے {حوالہ: فقہ معاسوہ کویتیہ نور صفحہ 11768}"
