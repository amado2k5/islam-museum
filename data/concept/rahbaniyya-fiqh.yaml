id: concept/rahbaniyya-fiqh
class: concept
kind: legal
label:
  ar: "الرهبانية"
  en: "Rahbaniyya: monasticism, its rejection in Islam, and the preference for mixing with people"
  ur: "رہبانیت ⁦(ترکِ دنیا)⁩"
  es: "Rahbaniyya: el monacato, su rechazo en el Islam y la preferencia por mezclarse con la gente."
  fr: "Rahbaniyya: le monachisme, son rejet en islam et la préférence pour le mélange avec le peuple"
summary:
  ar: "الرهبانية لغة من الرهبة والخوف، والراهب في الأصل المتعبد في صومعة عند النصارى يترك أشغال الدنيا، والمعنى الاصطلاحي لا يخرج عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} وتتصل بها ألفاظ: العزلة، وهي من وسائل الرهبانية وخلاف الأصل، وقد تكون مشروعة عند فساد الزمان، والسياحة بمعنى الذهاب في الأرض للتعبد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} وقد نهت الشريعة عن الرهبانية بمعناها عند رهبان النصارى: الغلو في العبادة، وترك الدنيا، واعتزال النساء، والفرار من الناس، والتعذيب بالمشقات، وعدّ الفقهاء ذلك منهيا عنه، استنادا إلى قوله تعالى في سورة المائدة الآية 77، وإلى حديث الجهاد أنه رهبانية الأمة، وحديث من رغب عن سنتي فليس مني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} واتفق العلماء على أن الأفضل للمسلم أن يخالط الناس ويحضر الجماعات ومجالس العلم ويعود المريض ويشهد الجنازة ويأمر بالمعروف، مع الصبر على أذاهم، واحتج النووي بأن ذلك كان طريقة النبي والأنبياء والخلفاء الراشدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} أما العزلة فتستحب عند وجود فتنة عامة أو فساد لا يستطاع إصلاحه، أو غلب على الظن الوقوع في الحرام بالمخالطة، وفيها أحاديث في فضل من يعتزل الناس في شعب من الجبال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021}"
  en: "Rahbaniyya is derived from fear and awe; a rahib (monk) was in origin a worshipper who lived in a cell among Christians and withdrew from worldly affairs, and the technical sense does not differ from this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} Related terms are isolation (uzla), which is a means to monasticism and contrary to the norm and which may be lawful when society is corrupt, and wandering (siyaha) in the land for worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} The law forbade monasticism in the sense practised by Christian monks: excess in worship, abandoning worldly life, withdrawing from women and people, self-torment through hardship. The jurists rely on a Qur'anic verse from al-Ma'ida (verse 77), on the hadith that jihad is the monasticism of Islam, and on the hadith that whoever turns from my sunna is not of me. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} All scholars agree that it is better for a Muslim to mix with people, attend congregations and lessons, visit the sick, attend funerals, enjoin good and bear their harm patiently; al-Nawawi notes that this was the practice of the Prophet, the prophets, and the rightly guided caliphs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} Isolation is recommended when general corruption (fitna) prevails or when mixing would likely lead to what is forbidden; the traditions praise worship in times of turmoil and a man who keeps his faith by withdrawing to a mountain pass. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021}"
  ur: "رہبانیت کا لفظ خوف اور خشیت سے ہے، اور راہب وہ عابد ہے جو گرجا یا خانقاہ میں دنیا کے کاموں سے الگ ہو کر رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} شریعت نے عبادت میں غلو، ترکِ دنیا، عورتوں سے کنارہ کشی اور لوگوں سے بھاگنے والی رہبانیت سے منع کیا ہے؛ جہاد کو اسلام کی رہبانیت کہا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} لوگوں میں مل جل کر رہنا، جماعت، علم کی مجالس، عیادت اور امر بالمعروف افضل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} فتنے کے وقت عزلت مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021}"
  es: "Rahbaniyya deriva de temor y reverencia; un rahib (monje) era originalmente un adorador que vivía en una celda entre cristianos y se retiraba de los asuntos mundanos, y el sentido técnico no difiere de esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} Los términos relacionados son aislamiento (uzla), que es un medio para el monacato y contrario a la norma y que puede ser lícito cuando la sociedad está corrupta, y vagar (siyaha) por la tierra para adorar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} La ley prohibía el monacato en el sentido practicado por los monjes cristianos: exceso en la adoración, abandono de la vida mundana, retiro de las mujeres y las personas, autotormento a través de dificultades. Los juristas se basan en un versículo coránico de al-Ma'ida (versículo 77), en el hadiz de que la yihad es el monacato del Islam, y en el hadiz de que quien se aparta de mi sunna no es de mí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} Todos los eruditos coinciden en que es mejor para un musulmán mezclarse con la gente, asistir a congregaciones y lecciones, visitar a los enfermos, asistir a funerales, ordenar el bien y soportar su mal con paciencia; al-Nawawi señala que esta era la práctica del Profeta, los profetas y los califas bien guiados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} Se recomienda el aislamiento cuando prevalece la corrupción general (fitna) o cuando la mezcla probablemente conduciría a lo prohibido; las tradiciones alaban la adoración en tiempos de agitación y a un hombre que mantiene su fe retirándose a un paso de montaña. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021}"
  fr: "Le terme « rahbaniyya » est dérivé de la crainte et du respect; un rahib (moine) était à l'origine un dévot vivant en cellule parmi les chrétiens et se retirant des affaires du monde, et le sens technique ne diffère pas de cette définition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} Des termes apparentés sont l'isolement (uzla), qui est un moyen d'accéder au monachisme et est contraire à la norme, mais qui peut être licite lorsque la société est corrompue, et l'errance (siyaha) à travers le pays pour le culte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} La loi interdisait le monachisme tel qu'il était pratiqué par les moines chrétiens: excès dans le culte, abandon de la vie mondaine, retrait des femmes et des gens, auto-torture par les épreuves. Les juristes s'appuient sur un verset coranique de la sourate al-Ma'ida (verset 77), sur le hadith selon lequel le jihad est le monachisme de l'islam, et sur le hadith affirmant que quiconque se détourne de ma sunna n'est pas des miens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} Tous les savants s'accordent à dire qu'il est préférable pour un musulman de fréquenter les gens, d'assister aux prières et aux enseignements, de visiter les malades, d'assister aux funérailles, d'inciter au bien et de supporter patiemment les injustices. Al-Nawawi souligne que telle était la pratique du Prophète, des prophètes et des califes bien guidés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} L'isolement est recommandé lorsque la corruption générale (fitna) prévaut ou lorsque la fréquentation risque d'entraîner des actes interdits. Les traditions font l'éloge de la prière en temps de troubles et de celui qui préserve sa foi en se retirant dans un col de montagne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021}"
