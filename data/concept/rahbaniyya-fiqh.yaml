id: concept/rahbaniyya-fiqh
class: concept
kind: legal
label:
  ar: "الرهبانية"
  en: "Rahbaniyya: monasticism, its rejection in Islam, and the preference for mixing with people"
  ur: "رہبانیت (ترکِ دنیا)"
summary:
  ar: "الرهبانية لغة من الرهبة والخوف، والراهب في الأصل المتعبد في صومعة عند النصارى يترك أشغال الدنيا، والمعنى الاصطلاحي لا يخرج عن ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} وتتصل بها ألفاظ: العزلة، وهي من وسائل الرهبانية وخلاف الأصل، وقد تكون مشروعة عند فساد الزمان، والسياحة بمعنى الذهاب في الأرض للتعبد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} وقد نهت الشريعة عن الرهبانية بمعناها عند رهبان النصارى: الغلو في العبادة، وترك الدنيا، واعتزال النساء، والفرار من الناس، والتعذيب بالمشقات، وعدّ الفقهاء ذلك منهيا عنه، استنادا إلى قوله تعالى في سورة المائدة الآية 77، وإلى حديث الجهاد أنه رهبانية الأمة، وحديث من رغب عن سنتي فليس مني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} واتفق العلماء على أن الأفضل للمسلم أن يخالط الناس ويحضر الجماعات ومجالس العلم ويعود المريض ويشهد الجنازة ويأمر بالمعروف، مع الصبر على أذاهم، واحتج النووي بأن ذلك كان طريقة النبي والأنبياء والخلفاء الراشدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} أما العزلة فتستحب عند وجود فتنة عامة أو فساد لا يستطاع إصلاحه، أو غلب على الظن الوقوع في الحرام بالمخالطة، وفيها أحاديث في فضل من يعتزل الناس في شعب من الجبال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021}"
  en: "Rahbaniyya is derived from fear and awe; a rahib (monk) was in origin a worshipper who lived in a cell among Christians and withdrew from worldly affairs, and the technical sense does not differ from this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} Related terms are isolation (uzla), which is a means to monasticism and contrary to the norm and which may be lawful when society is corrupt, and wandering (siyaha) in the land for worship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} The law forbade monasticism in the sense practised by Christian monks: excess in worship, abandoning worldly life, withdrawing from women and people, self-torment through hardship. The jurists rely on a Qur'anic verse from al-Ma'ida (verse 77), on the hadith that jihad is the monasticism of Islam, and on the hadith that whoever turns from my sunna is not of me. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} All scholars agree that it is better for a Muslim to mix with people, attend congregations and lessons, visit the sick, attend funerals, enjoin good and bear their harm patiently; al-Nawawi notes that this was the practice of the Prophet, the prophets, and the rightly guided caliphs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} Isolation is recommended when general corruption (fitna) prevails or when mixing would likely lead to what is forbidden; the traditions praise worship in times of turmoil and a man who keeps his faith by withdrawing to a mountain pass. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021}"
  ur: "رہبانیت کا لفظ خوف اور خشیت سے ہے، اور راہب وہ عابد ہے جو گرجا یا خانقاہ میں دنیا کے کاموں سے الگ ہو کر رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9019} شریعت نے عبادت میں غلو، ترکِ دنیا، عورتوں سے کنارہ کشی اور لوگوں سے بھاگنے والی رہبانیت سے منع کیا ہے؛ جہاد کو اسلام کی رہبانیت کہا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} لوگوں میں مل جل کر رہنا، جماعت، علم کی مجالس، عیادت اور امر بالمعروف افضل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9020} فتنے کے وقت عزلت مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021}"
