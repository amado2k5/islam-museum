summary:
  ur: "اقامت کے باغ جن کی بنیاد کے نیچے نہریں بہتی ہیں — متقوں کی ثابت مسکن۔"
  ar: "جنات عدن في النص القرآني من أسماء الجنة؛ يروي ابن كثير أن الله خلق جنة عدن بيده {cite:tafsir-ibn-kathir}، وتقرر العقيدة أن الجنة مخلوقة لا تفنى {cite:aqida-tahawiyya §106}."
  en: "The Gardens of Eden (jannat 'adn) in the Qur'anic text are among paradise's names; Ibn Kathir reports that God created the Garden of Eden with His own hand {cite:tafsir-ibn-kathir}, and the creed affirms paradise is created and never perishes {cite:aqida-tahawiyya §106}."
  es: "Los Jardines del Edén (jannat 'adn) en el texto coránico se encuentran entre los nombres del paraíso; Ibn Kathir informa que Dios creó el Jardín del Edén con Su propia mano {cite:tafsir-ibn-kathir}, y el credo afirma que el paraíso es creado y nunca perece {cite:aqida-tahawiyya §106}."
