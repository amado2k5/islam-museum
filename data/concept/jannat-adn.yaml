id: concept/jannat-adn
class: concept
kind: belief
label:
  ar: جنات عدن
  en: Gardens of Eden (jannat 'adn)
  ur: جنتِ عدن
  es: "Jardines del Edén (jannat 'adn)"
  fr: "Jardins d'Éden (jannat 'adn)"
  tr: "Aden'in Cennetleri"
  id: "Surga Aden"
summary:
  ur: "اقامت کے باغ جن کی بنیاد کے نیچے نہریں بہتی ہیں — متقوں کی ثابت مسکن۔"
  ar: "جنات عدن في النص القرآني من أسماء الجنة؛ يروي ابن كثير أن الله خلق جنة عدن بيده {cite:tafsir-ibn-kathir}، وتقرر العقيدة أن الجنة مخلوقة لا تفنى {cite:aqida-tahawiyya §106}."
  en: "The Gardens of Eden (jannat 'adn) in the Qur'anic text are among paradise's names; Ibn Kathir reports that God created the Garden of Eden with His own hand {cite:tafsir-ibn-kathir}, and the creed affirms paradise is created and never perishes {cite:aqida-tahawiyya §106}."
  es: "Los Jardines del Edén (jannat 'adn) en el texto coránico se encuentran entre los nombres del paraíso; Ibn Kathir informa que Dios creó el Jardín del Edén con Su propia mano {cite:tafsir-ibn-kathir}, y el credo afirma que el paraíso es creado y nunca perece {cite:aqida-tahawiyya §106}."
  fr: "Les Jardins d'Éden (jannat 'adn) figurent parmi les noms du paradis dans le texte coranique; Ibn Kathir rapporte que Dieu a créé le Jardin d'Éden de Sa propre main {cite:tafsir-ibn-kathir}, et la croyance affirme que le paradis est créé et ne périt jamais {cite:aqida-tahawiyya §106}."
  tr: "Kur'an metnindeki Aden Bahçeleri cennetin isimleri arasındadır; İbn Kathir, Allah'ın Aden Bahçesi'ni kendi eliyle yarattığını {atıf:tafsir-ibn-kathir} ve inancın Cennet'in yok olmayan bir yaratılış olduğunu belirttiğini anlatır. {cite:aqida-tahawiyya §106}."
  id: "Taman-taman Eden dalam teks Al-Qur'an termasuk di antara nama Surga; Ibn Kathir menceritakan bahwa Allah menciptakan Taman Eden dengan tangan-Nya sendiri {cite:tafsir-ibn-kathir}, dan ajaran tersebut menetapkan bahwa Surga adalah ciptaan yang tidak akan binasa. {cite:aqida-tahawiyya §106}."
