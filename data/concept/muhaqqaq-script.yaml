summary:
  ar: "أحد الأقلام الستة الموزونة، قرين الريحان الجليل، لاءم المصاحف الكبيرة، وبه كتب أحمد بن السهروردي خاتمة «مصحف بغداد المجهول» سنة 707هـ {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 37}."
  en: "One of the six proportional pens, the large partner of rayhan, suited to large Qur'ans; Ahmad ibn al-Suhrawardi wrote the colophon of the \"Anonymous Baghdad Qur'an\" (707 AH) in it {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 37}."
  ur: "اقلامِ ستہ میں سے ایک، ریحان کا جلی جوڑی دار، بڑے مصاحف کے لیے موزوں؛ احمد بن سہروردی نے اسی میں «گمنام بغدادی مصحف» ⁦(707ھ)⁩ کا ترقیمہ لکھا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 37}۔"
  es: "Una de las seis plumas proporcionales, la compañera grande de rayhan, adecuada para Coranes grandes; Ahmad ibn al-Suhrawardi escribió el colofón del \"Corán anónimo de Bagdad\" (707 AH) en ella {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 37}."
  fr: "L'un des six stylos proportionnels, le grand partenaire du rayhan, adapté aux grands Corans; Ahmad ibn al-Suhrawardi a écrit le colophon du « Coran anonyme de Bagdad » (707 AH) avec celui-ci {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 25} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 37}."
