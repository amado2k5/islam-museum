label: { ar: "الألثغ", en: "Alsagh (one with a speech defect, and its rulings)", fr: "Alsagh (défaut d’élocution et avis juridiques)", es: "Alsagh (persona con un defecto del habla y sus normas)" }
summary:
  ar: "الألثغ من به لثغة، وهي حبسة في اللسان تبدل بها الراء لاما أو غينا والسين ثاء، ويلحق بالأرت والثأثاء والفأفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} واللثغة صفة نقص في إمام الصلاة، فيلحق الجمهور الألثغ بالأمي في الإمامة، والمالكية والقاضي من الحنابلة يصححون إمامته مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} وفي الجناية على الألثغ أو منها، يراعى قسط اللثغة في الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}"
  en: "Alsagh is one who has a speech defect in which a letter is changed, such as r to l or g, or s to th; it is related to the stutter and similar defects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} The defect is a fault in a prayer leader; most jurists count the speaker of such a defect with the illiterate in leading prayer, while some Malikis and the Hanbali judge al-Qadi allow him to lead with dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} When a defect is caused by injury, the diya is reckoned in proportion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}"
  fr: "L’alsagh est une personne qui, du fait d’un défaut d’élocution, remplace une lettre par une autre, par exemple le r par le l ou le g, ou le s par le th. Ce défaut s’apparente au bégaiement et à d’autres troubles semblables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} Il est considéré comme un handicap pour diriger la prière : la plupart des juristes assimilent la personne qui en est atteinte à l’illettré en la matière, tandis que certains malikites et le juge hanbalite al-Qadi lui permettent de diriger la prière, tout en le déconseillant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} Lorsque le défaut résulte d’une blessure, la diya est calculée à proportion de l’atteinte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}"
  es: "Alsagh es aquel que tiene un defecto del habla en el que se cambia una letra, como r por l o g, o s por th; está relacionado con la tartamudez y defectos similares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} El defecto es una falta en un líder de la oración; la mayoría de los juristas consideran que quien habla con tal defecto es analfabeto al dirigir la oración, mientras que algunos malikíes y el juez hanbalí al-Qadi le permiten dirigirla con desaprobación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} Cuando un defecto es causado por una lesión, el diya se calcula en proporción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}"
