label: { ar: "الألثغ", en: "Alsagh (one with a speech defect, and its rulings)" }
summary:
  ar: "الألثغ من به لثغة، وهي حبسة في اللسان تبدل بها الراء لاما أو غينا والسين ثاء، ويلحق بالأرت والثأثاء والفأفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} واللثغة صفة نقص في إمام الصلاة، فيلحق الجمهور الألثغ بالأمي في الإمامة، والمالكية والقاضي من الحنابلة يصححون إمامته مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} وفي الجناية على الألثغ أو منها، يراعى قسط اللثغة في الدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}"
  en: "Alsagh is one who has a speech defect in which a letter is changed, such as r to l or g, or s to th; it is related to the stutter and similar defects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} The defect is a fault in a prayer leader; most jurists count the speaker of such a defect with the illiterate in leading prayer, while some Malikis and the Hanbali judge al-Qadi allow him to lead with dislike. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3315} When a defect is caused by injury, the diya is reckoned in proportion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3316}"
