label:
  ar: "التشوف"
  en: "Tashawwuf (the lawgiver's concern for a right; adornment in waiting and courtship)"
  ur: "تشوف (شریعت کا کسی حق کا خیال؛ عدت اور خطبہ میں زینت)"
summary:
  ar: "التشوف في اللغة التطلع، وفي الفقه يذكر على وجوه: تشوف الشارع إلى إثبات النسب فيقبل النادر في إلحاقه، وتشوفه إلى العتق فهو قربة يقع من كل مكلف مسلم. وفي العدة تتزين الرجعية عند الحنفية والمالكية والحنابلة، والشافعية يستحبون لها الإحداد. وتحرم الزينة على المتوفى عنها بالإجماع، وفي المبانة بينونة كبرى خلاف. وفي الخطبة لا يجوز لمن تصلح للخطبة أن تتزين للتعرض للخطاب، ويجوز للخاطب أن ينظر إليها؛ وأكثر الفقهاء على الوجه والكفين، والحنابلة على ما يظهر عند العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5212} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5214}"
  en: "Tashawwuf is longing or looking out, and in jurisprudence it covers several things: the lawgiver's concern to establish descent, so rare cases are admitted to attach a child to a father; his concern for manumission, an act of devotion that any sane Muslim may perform; the revocable divorcee may adorn herself in her waiting period, by the Hanafi, Maliki and Hanbali view, while the Shafiis recommend mourning for her; adornment is forbidden to a widow by consensus, and disputed for a woman divorced irrevocably; a woman fit for marriage may not adorn herself to be seen by suitors, while a suitor may look at her, the majority allowing only the face and hands and the Hanbalis what shows at work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5212} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5214}"
