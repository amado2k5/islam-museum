label:
  ar: "التشوف"
  en: "Tashawwuf (the lawgiver's concern for a right; adornment in waiting and courtship)"
  ur: "تشوف ⁦(شریعت کا کسی حق کا خیال؛ عدت اور خطبہ میں زینت)⁩"
  es: "Tashawwuf (la preocupación del legislador por un derecho; adorno en la espera y el cortejo)"
  fr: "Tashawwuf (le souci du législateur pour un droit; l'ornement dans l'attente et la cour)"
  tr: "Görünürlük"
  id: "Visibilitas"
summary:
  ar: "التشوف في اللغة التطلع، وفي الفقه يذكر على وجوه: تشوف الشارع إلى إثبات النسب فيقبل النادر في إلحاقه، وتشوفه إلى العتق فهو قربة يقع من كل مكلف مسلم. وفي العدة تتزين الرجعية عند الحنفية والمالكية والحنابلة، والشافعية يستحبون لها الإحداد. وتحرم الزينة على المتوفى عنها بالإجماع، وفي المبانة بينونة كبرى خلاف. وفي الخطبة لا يجوز لمن تصلح للخطبة أن تتزين للتعرض للخطاب، ويجوز للخاطب أن ينظر إليها؛ وأكثر الفقهاء على الوجه والكفين، والحنابلة على ما يظهر عند العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5212} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5214}"
  en: "Tashawwuf is longing or looking out, and in jurisprudence it covers several things: the lawgiver's concern to establish descent, so rare cases are admitted to attach a child to a father; his concern for manumission, an act of devotion that any sane Muslim may perform; the revocable divorcee may adorn herself in her waiting period, by the Hanafi, Maliki and Hanbali view, while the Shafiis recommend mourning for her; adornment is forbidden to a widow by consensus, and disputed for a woman divorced irrevocably; a woman fit for marriage may not adorn herself to be seen by suitors, while a suitor may look at her, the majority allowing only the face and hands and the Hanbalis what shows at work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5212} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5214}"
  es: "Tashawwuf significa anhelo o mirada hacia afuera, y en jurisprudencia abarca varias cosas: la preocupación del legislador por establecer la descendencia, por lo que se admiten casos raros para vincular a un niño con un padre; su preocupación por la manumisión, un acto de devoción que cualquier musulmán cuerdo puede realizar; la divorciada revocable puede adornarse durante su período de espera, según la visión Hanafi, Maliki y Hanbali, mientras que los Shafiis recomiendan el luto por ella; el adorno está prohibido a una viuda por consenso, y es discutido para una mujer divorciada irrevocablemente; una mujer apta para el matrimonio no puede adornarse para ser vista por los pretendientes, mientras que un pretendiente puede mirarla, la mayoría permitiendo solo el rostro y las manos y los Hanbalis lo que muestra en el trabajo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5212} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5213} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5214}"
  fr: "Le tashawwuf, qui signifie désir ardent ou recherche, recouvre en jurisprudence plusieurs aspects: le souci du législateur d’établir la filiation, ce qui explique que de rares cas soient admis pour rattacher un enfant à son père; son souci de l’affranchissement, un acte de dévotion que tout musulman sain d’esprit peut accomplir; la possibilité pour la divorcée révocable de se parer pendant sa période d’attente, selon les écoles hanafite, malikite et hanbalite, tandis que les chaféites recommandent le deuil; l’interdiction de la parure pour une veuve, par consensus, et la controverse autour du cas d’une femme divorcée irrévocablement; l’interdiction pour une femme en âge de se marier de se parer pour être vue par des prétendants, tandis que ces derniers peuvent la regarder, la majorité n’autorisant que le visage et les mains, et les hanbalites ce qui est visible au travail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5212} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5214}"
  ur: "تشوّف آرزو یا تلاش کرنا ہے، اور فقہ میں یہ کئی چیزوں کا احاطہ کرتا ہے: قانون دینے والے کا نزول قائم کرنے کی فکر، اس لیے بچے کو باپ کے ساتھ جوڑنے کے شاذ و نادر ہی مقدمات درج کیے جاتے ہیں۔ اس کی آزادی کی فکر، عقیدت کا ایسا عمل جسے کوئی بھی سمجھدار مسلمان انجام دے سکتا ہے۔ رجعی طلاق دینے والی حنفی، مالکی اور حنبلی کے نزدیک عدت میں خود کو سنوار سکتی ہے، جبکہ شافعی اس کے لیے سوگ کا مشورہ دیتے ہیں۔ اجماع سے بیوہ کے لیے زینت حرام ہے، اور اٹل طلاق یافتہ عورت کے لیے اختلاف ہے۔ شادی کے لیے موزوں عورت اپنے آپ کو زیب نہیں دیتی کہ دعویدار اسے دیکھے، جب کہ دعویدار اس کی طرف دیکھ سکتا ہے، اکثریت صرف چہرے اور ہاتھ کی اجازت دیتی ہے اور حنبلی کام پر جو کچھ دکھاتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5212} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5213}"
  tr: "Dilde 't'shawf' arzu anlamına gelir ve fihilde çeşitli şekillerde belirtilir: 't'huwuf' (yasama organını aramak) soy kurmak için, bu da nadir olanı kabul eder ve 'tsawwuf' (özgürleşme) her hesap verebilir Müslümana yakınlık biçimidir. İddede, raj'iyye süslemesi Hanefi, Maliki ve Hanbali'ye göre yapılır ve Şafiiler ihdad (ihudda) önerir. Ölen için süsleme oybirliğiyle yasaktır, ancak açıklama konusunda büyük bir anlaşmazlık vardır. Vaaz söz konusu olduğunda, vaaza uygun birinin kendisini süslemesi ve talip ona bakması kabul edilemez; çoğu hukukçu bunun yüz ve ellerde olduğunu söylerken, Hanbalılar pratikte görüldüğünü söyler. {atıft:atı:alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.5212} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5214}"
  id: "Dalam bahasa, 't'shawf' berarti aspirasi, dan dalam yurisprudensi disebutkan dengan berbagai cara: 't'huwuf' (mencari pembuat undang-undang) untuk menetapkan garis keturunan, yang menerima hal-hal langka yang melekat, dan 'tsawwuf' (emansipasi), yang merupakan bentuk kedekatan dengan setiap Muslim yang bertanggung jawab. Dalam 'iddah, hiasan raj'iyyah dilakukan sesuai dengan Hanafi, Maliki, dan Hanbali, dan Shafi'i merekomendasikan ihdad (ihuddah). Perhiasan dilarang bagi almarhum berdasarkan konsensus, tetapi terdapat perbedaan besar mengenai klarifikasi tersebut. Dalam kasus khotbah, tidak diperbolehkan bagi seseorang yang layak untuk menghias dirinya untuk ditujukan kepada alamat tersebut, dan pelamar boleh memandangnya; sebagian besar ahli hukum mengatakan itu ada di wajah dan tangan, sementara Hanbal mengatakan itu muncul dalam praktik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5212} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5213} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5214}"
