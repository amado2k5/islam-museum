summary:
  en: 'BADJ is the Arabicised form of the Persian bäsh from the Islamic period {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The phrase bazh u säw is not infrequent and the expression bazh-i rüm is used in reference to the tribute and indemnity paid to the victorious Persians by the rulers of the Eastern Roman empire {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The Chaznawid poet Bahråmi uses bash while the 15th-century poet Babā Fighäni uses bădi {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The words bäshbän, bazhkh ah and bäzhdăr are explained as desiring toll or customs-levied {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    In Burhăn-i Kați, the term is stated to have been applied to money and gifts in addition to the meanings of tithe and customs-dues {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The word became a current fiscal technical term among the Turks because several Turkish states were founded in the Persian area starting with the Ghaznawids and Saldjüks and because the Saldiük administration preserved Samänid and Ghaznawid traditions {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Persian was the official language of Asia Minor under the Saldjüks and Ilkhänids {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Documents show that the word was applied to various forms of tax as well as being used for tax in general {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Naşir al-Din Tüsi presented a risăla containing his views on politics and finance to the Ilkhanid Abäkă {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Yaltkaya translates the term as customs-dues in an ambiguous passage {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Minorsky shows that the bådi referred to in context must be the vandari or traveller''s protection tax levied in the Ilkhänid dominions for maintaining peace and security on caravan-routes and lakes {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The word is also used to refer to a tax of one-third when discussing Ghazãn''s agricultural reforms {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Legislative texts are more useful for establishing the sense of such a word, but the oldest relevant ones of the Ak Koyünlü have not come down in their original forms {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    These laws were first discussed by I. H. {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.'
  fr: "BADJ est la forme arabisée du persan bäsh à l’époque islamique {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nL’expression bazh u säw n’est pas rare ; bazh-i rüm désigne le tribut et l’indemnité versés aux Perses victorieux par les souverains de l’Empire romain d’Orient {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nLe poète ghaznévide Bahråmi emploie bash, tandis que Babā Fighäni, au XVe siècle, emploie bădi {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nLes mots bäshbän, bazhkh ah et bäzhdăr sont expliqués par la recherche d’un péage ou le prélèvement de droits de douane {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nLe Burhăn-i Kați indique que le terme désignait l’argent et les présents, outre la dîme et les droits de douane {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nLe mot devint un terme fiscal courant chez les Turcs : plusieurs États turcs furent fondés dans l’espace persan, à commencer par les Ghaznévides et les Seldjoukides, et l’administration seldjoukide conserva les traditions samanides et ghaznévides {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nLe persan était la langue officielle de l’Asie Mineure sous les Seldjoukides et les Ilkhanides {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nLes documents montrent son application à diverses formes d’impôt, ainsi qu’à l’impôt en général {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nNaşir al-Din Tüsi présenta à l’Ilkhanide Abäkă une risăla exposant ses vues politiques et financières {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nYaltkaya traduit le terme par droits de douane dans un passage ambigu {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nMinorsky montre que le bådi en question désigne le vandari, taxe de protection des voyageurs perçue dans les domaines ilkhanides pour maintenir la paix et la sécurité sur les routes caravanières et les lacs {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nLe mot désigne aussi un prélèvement du tiers à propos des réformes agricoles de Ghazãn {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nLes textes législatifs aident davantage à préciser le sens d’un tel mot, mais les plus anciens pertinents, ceux des Ak Koyünlü, ne nous sont pas parvenus sous leur forme originale {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.\nCes lois furent d’abord étudiées par I. H., dont le nom demeure incomplet dans l’extrait {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}."
  ar: 'BADJ هي الصيغة المعربة من الكلمة الفارسية bäsh من العصر الإسلامي {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    إن عبارة bazh u säw ليست نادرة، ويُستخدم التعبير bazh-i rüm للإشارة إلى الجزية والتعويضات التي دفعها حكام الإمبراطورية الرومانية الشرقية للفرس المنتصرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    يستخدم الشاعر الغزنوي Bahråmi كلمة bash بينما يستخدم الشاعر Babā Fighäni من القرن الخامس عشر كلمة bădi {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    تُفسر كلمات bäshbän و bazhkh ah و bäzhdăr بأنها تعني الرغبة في الرسوم أو الجمارك المفروضة {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    في كتاب Burhăn-i Kați، ذُكر أن المصطلح قد طُبق على الأموال والهدايا بالإضافة إلى معاني العشور والرسوم الجمركية {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    أصبحت الكلمة مصطلحاً مالياً شائعاً بين الأتراك لأن العديد من الدول التركية تأسست في المنطقة الفارسية بدءاً من الغزنويين والسلاجقة، ولأن الإدارة السلجوقية حافظت على التقاليد السامانية والغزنوية {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    كانت الفارسية هي اللغة الرسمية في آسيا الصغرى تحت حكم السلاجقة والإيلخانيين {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    تظهر الوثائق أن الكلمة طُبقت على أشكال مختلفة من الضرائب بالإضافة إلى استخدامها للإشارة إلى الضريبة بشكل عام {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    قدم نصير الدين الطوسي رسالة تحتوي على آرائه في السياسة والمال إلى الإيلخاني Abäkă {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    يترجم Yaltkaya المصطلح إلى رسوم جمركية في نص غامض {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    يوضح Minorsky أن الـ bådi المشار إليه في السياق يجب أن يكون الـ vandari أو ضريبة حماية المسافر المفروضة في الأراضي الإيلخانية للحفاظ على السلام والأمن في طرق القوافل والبحيرات {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    تُستخدم الكلمة أيضاً للإشارة إلى ضريبة الثلث عند مناقشة الإصلاحات الزراعية لغazan {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    تعد النصوص التشريعية أكثر فائدة لتحديد معنى مثل هذه الكلمة، لكن أقدم النصوص ذات الصلة الخاصة بـ Ak Koyünlü لم تصل إلينا في أشكالها الأصلية {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    ناقش I. H. هذه القوانين لأول مرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.'
  ur: 'BADJ اسلامی دور کے فارسی لفظ bäsh کی عربی شکل ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    بازہ و ساؤ (bazh u säw) کا فقرہ غیر معمولی نہیں ہے اور بازہِ روم (bazh-i rüm) کی اصطلاح مشرقی رومی سلطنت کے حکمرانوں کی جانب سے فاتح ایرانیوں کو ادا کیے جانے والے خراج اور ہرجانے کے حوالے سے استعمال ہوتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    غزنوی شاعر بہرمی bash کا استعمال کرتا ہے جبکہ پندرہویں صدی کے شاعر بابا فیغانی bădi کا استعمال کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    الفاظ bäshbän، bazhkh ah اور bäzhdăr کی وضاحت ٹول یا وصول کیے گئے کسٹم کے خواہش مند کے طور پر کی گئی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    برہانِ قاطع میں، یہ کہا گیا ہے کہ یہ اصطلاح عشر اور کسٹم ڈیوٹی کے معانی کے علاوہ رقم اور تحائف کے لیے بھی استعمال ہوتی تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    یہ لفظ ترکوں میں ایک عام مالیاتی تکنیکی اصطلاح بن گیا کیونکہ غزنویوں اور سلجوقوں سے شروع ہوتے ہوئے کئی ترک ریاستوں کی بنیاد فارسی علاقے میں رکھی گئی تھی اور اس لیے کہ سلجوقی انتظامیہ نے سامانی اور غزنوی روایات کو برقرار رکھا {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    سلجوقوں اور ایلخانیوں کے دور میں فارسی ایشیا مینر کی سرکاری زبان تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    دستاویزات ظاہر کرتی ہیں کہ یہ لفظ ٹیکس کی مختلف اقسام کے لیے استعمال ہوتا تھا اور ساتھ ہی عام طور پر ٹیکس کے لیے بھی استعمال ہوتا تھا {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    ناصر الدین طوسی نے ایلخانی حکمران اباکا کو سیاست اور مالیات پر اپنے خیالات پر مشتمل ایک رسالہ پیش کیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    یالٹکایا ایک مبہم اقتباس میں اس اصطلاح کا ترجمہ کسٹم ڈیوٹی کے طور پر کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    مینورسکی دکھاتا ہے کہ سیاق و سباق میں جس bådi کا ذکر کیا گیا ہے وہ vandari یا مسافروں کے تحفظ کا ٹیکس ہونا چاہیے جو قافلے کے راستوں اور جھیلوں پر امن و امان برقرار رکھنے کے لیے ایلخانی سلطنت میں عائد کیا جاتا تھا {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    غزن کے زرعی اصلاحات پر بحث کرتے وقت یہ لفظ ایک تہائی ٹیکس کے طور پر بھی استعمال ہوتا ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    قانونی متن ایسے لفظ کے مفہوم کو قائم کرنے کے لیے زیادہ مفید ہوتے ہیں، لیکن آق کوینلو کے قدیم ترین متعلقہ متن اپنی اصل شکل میں نہیں مل سکے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    ان قوانین پر سب سے پہلے I. H. نے بحث کی تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔'
  es: "BADJ es la forma arabizada del persa bäsh del período islámico {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. La frase bazh u säw no es infrecuente y la expresión bazh-i rüm se usa en referencia al tributo e indemnización pagados a los persas victoriosos por los gobernantes del Imperio Romano de Oriente {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. El poeta chaznawida Bahråmi usa bash, mientras que el poeta del siglo XV Babā Fighäni usa bădi {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. Las palabras bäshbän, bazhkh ah y bäzhdăr se explican como deseoso de peaje o impuesto aduanero {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. En Burhăn-i Kați, se afirma que el término se aplicó al dinero y a los regalos, además de los significados de diezmo y derechos aduaneros {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. La palabra se convirtió en un término técnico fiscal común entre los turcos porque se fundaron varios estados turcos en la zona persa, comenzando con los gaznávidas y los salyóvidas, y porque la administración salyóvida conservó las tradiciones samánidas y gaznávidas {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. El persa fue el idioma oficial de Asia Menor bajo los Saljúk y los Iljánidas {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. Los documentos muestran que la palabra se aplicaba a varias formas de impuestos, así como también se usaba para impuestos en general {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. Naşir al-Din Tüsi presentó una risăla que contenía sus puntos de vista sobre política y finanzas al Iljánida Abäkă {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. Yaltkaya traduce el término como derechos de aduana en un pasaje ambiguo {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. Minorsky demuestra que el bådi al que se hace referencia en este contexto debe ser el vandari o impuesto de protección al viajero que se cobraba en los dominios Ilkhänid para mantener la paz y la seguridad en las rutas de caravanas y los lagos {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. La palabra también se usa para referirse a un impuesto de un tercio cuando se discuten las reformas agrícolas de Ghazãn {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. Los textos legislativos son más útiles para establecer el sentido de dicha palabra, pero los más antiguos y relevantes del Ak Koyünlü no se han conservado en sus formas originales {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}. Estas leyes fueron discutidas por primera vez por IH {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}."
  tr: "BADJ, İslam döneminden Farsça bäsh kelimesinin Araplaştırılmış halidir {cite:encyclopaedia-of-Islam-2 cilt 1, s. 917}. Bazh u säw ifadesi nadir değildir ve bazh-i rüm ifadesi, Doğu Roma İmparatorluğu yöneticilerinin zafer kazanan Perslere ödedikleri haraç ve tazminatı ifade etmek için kullanılır {cite:encyclopaedia-of-Islam-2 cilt 1, s. 917}. Gazneli şairi Bahråmi bash kelimesini kullanırken, on beşinci yüzyıl şairi Babā Fighäni bădi kelimesini kullanır {cite:encyclopaedia-of-Islam-2 cilt 1, s. 917}. Bäshbän, bazhkh ah ve bäzhdăr kelimeleri, vergiler veya gümrükler talep edilmesi anlamına gelir {cite:encyclopaedia-of-Islam-2 cilt 1 s. 917}. Burhăn-i Kați kitabında, terimin para ve hediyeler ile ondalık vergiler ve gümrük vergilerinin anlamları için kullanıldığı belirtilir {cite:encyclopaedia-of-Islam-2 cilt 1 s. 917}. Kelime, Gazneliler ve Selçuklularla başlayan birçok Türk devletinin Pers bölgesinde kurulması ve Selçuklu yönetiminin Samani ve Gazneli geleneklerini koruması nedeniyle Türkler arasında yaygın bir finansal terim haline gelmiştir {cite:encyclopaedia-of-Islam-2 cilt 1 s. 917}. Farsça, Selçuklular ve İlhanlılar yönetimi altında Anadolu'da resmi dil olmuştur {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 917}. Belgeler, kelimenin genel olarak vergilendirmeyi ifade etmek için kullanılmasının yanı sıra çeşitli vergi türlerine de uygulandığını göstermektedir {cite:encyclopaedia-of-Islam-2 cilt 1, s. 917}. Nasir al-Din al-Tusi, siyaset ve finans konusundaki görüşlerini içeren bir mektubu İlhanlı Abäkă'ya sunmuştur {cite:encyclopaedia-of-Islam-2 cilt 1, s. 917}. Yaltkaya terimi belirsiz bir metinde gümrük vergileri olarak çevirir {cite:encyclopaedia-of-Islam-2 cilt 1, s. 917}. Minorsky, bağlamda bahsedilen bådi'nin, kervan yolları ve göllerde barış ve güvenliği sağlamak için İlhanlık topraklarında uygulanan vandari veya gezgin koruma vergisi olması gerektiğini açıklar {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 917}. Kelime, Gazan'da tarımsal reformlar tartışılırken üçte bir vergiye de atıfta bulunur {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 917}. Yasal metinler böyle bir kelimenin anlamını tanımlamak için daha faydalıdır, ancak Ak Koyünlü ile ilgili en eski ilgili metinler orijinal halleriyle bize ulaşmamıştır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 917}. I. H. bu yasaları ilk kez tartıştı {atıf:İslam ansiklopedisi-2 cilt 1, s. 917}."
  id: "BADJ adalah bentuk Arabisasi dari kata Persia bäsh dari era Islam {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Frasa bazh u säw tidak langka, dan istilah bazh-i rüm digunakan untuk merujuk pada upeti dan kompensasi yang dibayarkan oleh para penguasa Kekaisaran Romawi Timur kepada orang Persia yang menang {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Penyair Ghaznavid Bahråmi menggunakan kata bash sementara penyair abad kelima belas Babā Fighäni menggunakan kata bădi {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Kata bäshbän, bazhkh ah, dan bäzhdăr diartikan sebagai keinginan atas biaya atau bea cukai yang dikenakan {cite:encyclopaedia-of-Islam-2 vol. 1 hlm. 917}. Dalam buku Burhăn-i Kați, disebutkan bahwa istilah ini digunakan untuk uang dan hadiah serta makna persepuluhan dan bea cukai {cite:encyclopaedia-of-Islam-2 vol. 1 hlm. 917}. Kata ini menjadi istilah keuangan umum di kalangan Turki karena banyak negara Turki didirikan di wilayah Persia dimulai dari Ghaznavid dan Seljuk, dan karena pemerintahan Seljuk melestarikan tradisi Samanid dan Ghaznavid {cite:encyclopaedia-of-Islam-2 vol. 1 hlm. 917}. Bahasa Persia adalah bahasa resmi di Asia Kecil di bawah pemerintahan Seljuk dan Ilkhanates {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Dokumen menunjukkan bahwa kata ini digunakan untuk berbagai bentuk pajak selain penggunaannya untuk merujuk pada perpajakan secara umum {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Nasir al-Din al-Tusi menyerahkan surat yang berisi pandangannya tentang politik dan keuangan kepada Ilkhanid Abäkă {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Yaltkaya menerjemahkan istilah tersebut sebagai bea cukai dalam teks yang samar {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Minorsky menjelaskan bahwa bådi yang dimaksud dalam konteks tersebut seharusnya adalah vandari atau pajak perlindungan pelancong yang dikenakan di tanah Ilkhanate untuk menjaga perdamaian dan keamanan di rute karavan dan danau {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Kata ini juga digunakan untuk merujuk pada pajak sepertiga saat membahas reformasi pertanian dalam Ghazan {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. Teks legislatif lebih berguna untuk mendefinisikan makna kata tersebut, tetapi teks terkait paling awal yang berkaitan dengan Ak Koyünlü belum sampai kepada kita dalam bentuk aslinya {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 917}. I. H. membahas hukum-hukum ini untuk pertama kalinya {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 917}."
