summary:
  en: 'BADJ is the Arabicised form of the Persian bäsh from the Islamic period {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The phrase bazh u säw is not infrequent and the expression bazh-i rüm is used in reference to the tribute and indemnity paid to the victorious Persians by the rulers of the Eastern Roman empire {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The Chaznawid poet Bahråmi uses bash while the 15th-century poet Babā Fighäni uses bădi {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The words bäshbän, bazhkh ah and bäzhdăr are explained as desiring toll or customs-levied {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    In Burhăn-i Kați, the term is stated to have been applied to money and gifts in addition to the meanings of tithe and customs-dues {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The word became a current fiscal technical term among the Turks because several Turkish states were founded in the Persian area starting with the Ghaznawids and Saldjüks and because the Saldiük administration preserved Samänid and Ghaznawid traditions {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Persian was the official language of Asia Minor under the Saldjüks and Ilkhänids {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Documents show that the word was applied to various forms of tax as well as being used for tax in general {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Naşir al-Din Tüsi presented a risăla containing his views on politics and finance to the Ilkhanid Abäkă {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Yaltkaya translates the term as customs-dues in an ambiguous passage {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Minorsky shows that the bådi referred to in context must be the vandari or traveller''s protection tax levied in the Ilkhänid dominions for maintaining peace and security on caravan-routes and lakes {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    The word is also used to refer to a tax of one-third when discussing Ghazãn''s agricultural reforms {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    Legislative texts are more useful for establishing the sense of such a word, but the oldest relevant ones of the Ak Koyünlü have not come down in their original forms {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    These laws were first discussed by I. H. {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.'
  ar: 'BADJ هي الصيغة المعربة من الكلمة الفارسية bäsh من العصر الإسلامي {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    إن عبارة bazh u säw ليست نادرة، ويُستخدم التعبير bazh-i rüm للإشارة إلى الجزية والتعويضات التي دفعها حكام الإمبراطورية الرومانية الشرقية للفرس المنتصرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    يستخدم الشاعر الغزنوي Bahråmi كلمة bash بينما يستخدم الشاعر Babā Fighäni من القرن الخامس عشر كلمة bădi {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    تُفسر كلمات bäshbän و bazhkh ah و bäzhdăr بأنها تعني الرغبة في الرسوم أو الجمارك المفروضة {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    في كتاب Burhăn-i Kați، ذُكر أن المصطلح قد طُبق على الأموال والهدايا بالإضافة إلى معاني العشور والرسوم الجمركية {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    أصبحت الكلمة مصطلحاً مالياً شائعاً بين الأتراك لأن العديد من الدول التركية تأسست في المنطقة الفارسية بدءاً من الغزنويين والسلاجقة، ولأن الإدارة السلجوقية حافظت على التقاليد السامانية والغزنوية {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    كانت الفارسية هي اللغة الرسمية في آسيا الصغرى تحت حكم السلاجقة والإيلخانيين {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    تظهر الوثائق أن الكلمة طُبقت على أشكال مختلفة من الضرائب بالإضافة إلى استخدامها للإشارة إلى الضريبة بشكل عام {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    قدم نصير الدين الطوسي رسالة تحتوي على آرائه في السياسة والمال إلى الإيلخاني Abäkă {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    يترجم Yaltkaya المصطلح إلى رسوم جمركية في نص غامض {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    يوضح Minorsky أن الـ bådi المشار إليه في السياق يجب أن يكون الـ vandari أو ضريبة حماية المسافر المفروضة في الأراضي الإيلخانية للحفاظ على السلام والأمن في طرق القوافل والبحيرات {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    تُستخدم الكلمة أيضاً للإشارة إلى ضريبة الثلث عند مناقشة الإصلاحات الزراعية لغazan {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    تعد النصوص التشريعية أكثر فائدة لتحديد معنى مثل هذه الكلمة، لكن أقدم النصوص ذات الصلة الخاصة بـ Ak Koyünlü لم تصل إلينا في أشكالها الأصلية {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.

    ناقش I. H. هذه القوانين لأول مرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}.'
  ur: 'BADJ اسلامی دور کے فارسی لفظ bäsh کی عربی شکل ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    بازہ و ساؤ (bazh u säw) کا فقرہ غیر معمولی نہیں ہے اور بازہِ روم (bazh-i rüm) کی اصطلاح مشرقی رومی سلطنت کے حکمرانوں کی جانب سے فاتح ایرانیوں کو ادا کیے جانے والے خراج اور ہرجانے کے حوالے سے استعمال ہوتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    غزنوی شاعر بہرمی bash کا استعمال کرتا ہے جبکہ پندرہویں صدی کے شاعر بابا فیغانی bădi کا استعمال کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    الفاظ bäshbän، bazhkh ah اور bäzhdăr کی وضاحت ٹول یا وصول کیے گئے کسٹم کے خواہش مند کے طور پر کی گئی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    برہانِ قاطع میں، یہ کہا گیا ہے کہ یہ اصطلاح عشر اور کسٹم ڈیوٹی کے معانی کے علاوہ رقم اور تحائف کے لیے بھی استعمال ہوتی تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    یہ لفظ ترکوں میں ایک عام مالیاتی تکنیکی اصطلاح بن گیا کیونکہ غزنویوں اور سلجوقوں سے شروع ہوتے ہوئے کئی ترک ریاستوں کی بنیاد فارسی علاقے میں رکھی گئی تھی اور اس لیے کہ سلجوقی انتظامیہ نے سامانی اور غزنوی روایات کو برقرار رکھا {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    سلجوقوں اور ایلخانیوں کے دور میں فارسی ایشیا مینر کی سرکاری زبان تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    دستاویزات ظاہر کرتی ہیں کہ یہ لفظ ٹیکس کی مختلف اقسام کے لیے استعمال ہوتا تھا اور ساتھ ہی عام طور پر ٹیکس کے لیے بھی استعمال ہوتا تھا {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    ناصر الدین طوسی نے ایلخانی حکمران اباکا کو سیاست اور مالیات پر اپنے خیالات پر مشتمل ایک رسالہ پیش کیا {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    یالٹکایا ایک مبہم اقتباس میں اس اصطلاح کا ترجمہ کسٹم ڈیوٹی کے طور پر کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    مینورسکی دکھاتا ہے کہ سیاق و سباق میں جس bådi کا ذکر کیا گیا ہے وہ vandari یا مسافروں کے تحفظ کا ٹیکس ہونا چاہیے جو قافلے کے راستوں اور جھیلوں پر امن و امان برقرار رکھنے کے لیے ایلخانی سلطنت میں عائد کیا جاتا تھا {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    غزن کے زرعی اصلاحات پر بحث کرتے وقت یہ لفظ ایک تہائی ٹیکس کے طور پر بھی استعمال ہوتا ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    قانونی متن ایسے لفظ کے مفہوم کو قائم کرنے کے لیے زیادہ مفید ہوتے ہیں، لیکن آق کوینلو کے قدیم ترین متعلقہ متن اپنی اصل شکل میں نہیں مل سکے {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔

    ان قوانین پر سب سے پہلے I. H. نے بحث کی تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 917}۔'
