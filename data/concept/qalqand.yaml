summary:
  ar: "القلقند في الكتاب حار يابس إلى الرابعة مجفف مصلب مكثف للبدن أكال فيه قبض وإحراق، ينفع من نواصير الأنف ويمنع الرعاف وينقي الرأس والأذن ويقتل ديدان الأذن والديدان وحب القرع ويدفع مضرة الفطر، ويذكر المحقق أنه الزاج الأخضر {cite:canon-ibn-sina-print-v1 p.651}"
  en: "Qalqand is in the book hot and dry to the fourth degree, drying, hardening, condensing the body and corrosive, with astringency and burning in it; it benefits fistulas of the nose, prevents nosebleed, cleanses the head and the ear, kills worms of the ear, worms and tapeworm, and repels the harm of mushrooms; the editor notes that it is green vitriol {cite:canon-ibn-sina-print-v1 p.651}"
  ur: "قلقند کتاب میں چوتھے درجے تک گرم خشک، خشک کرنے والا، سخت کرنے والا، بدن کو گاڑھا کرنے والا اور کاٹنے والا ہے، اس میں قبض اور جلانا ہے؛ ناک کے ناسوروں میں نافع ہے، نکسیر روکتا ہے، سر اور کان کو صاف کرتا ہے، کان کے کیڑوں، کیڑوں اور کدو دانے کو مارتا ہے اور کھمبی کا ضرر دور کرتا ہے؛ محقق بتاتا ہے کہ یہ ہرا زاج ہے {cite:canon-ibn-sina-print-v1 p.651}۔"
  es: "En el libro, Qalqand es caliente y seco hasta el cuarto grado, secante, endurecedor, condensante del cuerpo y corrosivo, con astringencia y ardor; beneficia las fístulas nasales, previene las hemorragias nasales, limpia la cabeza y el oído, mata los gusanos del oído, los gusanos y la tenia, y repele el daño de los hongos; el editor señala que es vitriolo verde {cite:canon-ibn-sina-print-v1 p.651}"
  fr: "Le qalqand est décrit dans le livre comme chaud et sec au quatrième degré, asséchant, durcissant et condensant le corps, et corrosif, avec des propriétés astringentes et brûlantes; il est bénéfique pour les fistules nasales, prévient les saignements de nez, purifie la tête et les oreilles, tue les vers de l'oreille, les vers et les ténias, et repousse les champignons nocifs; l'éditeur note qu'il s'agit de vitriol vert {cite:canon-ibn-sina-print-v1 p.651}"
  tr: "Kitapta Qalqand dördüncü yıla kadar sıcak ve kurudur. Vücut için sert, yoğun kuru bir bitkidir ve kasılma ile yanmaya neden olur. Burun sigortalarına fayda sağlar, burun kanamasını önler, baş ve kulakları arındırır, kulak kurtlarını, solucanları, balkabağı çekirdeği öldürür ve mantar zararını uzaklaştırır. Doğrulayıcı bunun yeşil alüminyum olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.651}"
  id: "Dalam buku, Qalqand adalah panas dan kering, hingga yang keempat. Ini adalah herbal kering yang keras dan intensif untuk tubuh yang menyebabkan kontraksi dan rasa terbakar. Ini bermanfaat bagi sekering hidung, mencegah mimisan, memurnikan kepala dan telinga, membunuh cacing telinga, cacing, biji labu, dan menolak bahaya jamur. Verifier menyebutkan bahwa ini adalah green alum {cite:canon-ibn-sina-print-v1 hlm.651}"
