id: concept/al-khalal-fi-al-kalam
class: concept
kind: scientific
label:
  ar: الخلل في الكلام
  en: The defect in speech
  fr: "Les troubles de la parole"
  ur: کلام کا خلل
summary:
  ar: الخرس وغيره من آفات الكلام قد يكون من آفة في الدماغ نفس الشعبة وقد يكون في العضل أنفسها وذلك الخلل إما تشنج وإما تمدد أو تصلب أو استرخاء أو قصر رباط أو تعقد عن جراحة اندملت أو ورم صلب وقد يكون من رطوبة في الأكثر وقد يكون من يبوسة وقد تكون الآفة في الكلام من جهة أورام وقروح تعرض في اللسان ونواحيه، وقد يعرض بعد السرسام لاندفاع العضل من الدماغ إلى الأعصاب وفي الحميات الحارة لشدة تجفيفها ويكون اللسان مع ذلك ضامراً متشنجاً وهو قليلاً ما يكون، وقد تكون الآفة لسبب في عضل الحنجرة إذا كان فيها تمدد أو استرخاء، فربما كان الإنسان يتعذر عليه التصويت في أول الأمر فإذا يبس في أول الكلام استرسل بعد ذلك ومثل هذا الإنسان يجب أن لا يستعد للكلام بنفس عظيم بل يشرع فيه بالهويني {cite:canon-ibn-sina-print-v2 p.259} {cite:canon-ibn-sina-print-v2 p.260}
  en: 'Muteness and the other speech disorders may come from a disorder in the brain or the nerve-branch itself, or in the muscles themselves; that defect is either convulsion, extension, hardening, relaxation, a short ligament, contraction after a healed wound, or a hard tumour. Mostly it is from moisture, though it may be from dryness; the speech disorder may also come from tumours and ulcers occurring in the tongue and its neighbourhood. It may occur after sirsam by the muscles'' being driven from the brain into the nerves, and in the hot fevers from their intense drying — the tongue then wasted and convulsed, which is rare. The disorder may also be from a cause in the larynx''s muscles when they are extended or relaxed: a man may find utterance hard at first because he strains his chest and larynx muscles beyond bearing until they rebel; if he dries at the speech''s beginning he flows on afterwards — and such a man should not prepare for speech with a great breath and a great moving of the chest but begin gently {cite:canon-ibn-sina-print-v2 p.259} {cite:canon-ibn-sina-print-v2 p.260}'
  fr: "Le mutisme et les autres troubles de la parole peuvent, selon le traité, venir d’une atteinte du cerveau, de la branche nerveuse elle-même ou des muscles. L’atteinte peut prendre la forme d’une convulsion, d’une extension, d’un durcissement, d’un relâchement, d’un ligament trop court, d’une rétraction après cicatrisation ou d’une tumeur dure. Elle a le plus souvent pour cause l’humidité, parfois la sécheresse ; les troubles de la parole peuvent aussi être dus à des tumeurs ou à des ulcères de la langue ou de ses environs. Ils peuvent survenir après un sirsam, par l’effet d’une action exercée par le cerveau sur les muscles par l’intermédiaire des nerfs, ou lors de fièvres chaudes, du fait de leur puissant effet desséchant : la langue est alors atrophiée et convulsée, ce qui est rare. Le trouble peut aussi venir des muscles du larynx s’ils sont en extension ou relâchés : certaines personnes peinent d’abord à parler parce qu’elles sollicitent les muscles de la poitrine et du larynx au-delà de ce qu’ils peuvent supporter, jusqu’à ce que ceux-ci résistent. Si la parole se bloque au début, elle devient ensuite fluide. Pour ces personnes, le traité préconisait de commencer doucement plutôt que de se préparer à parler par une forte inspiration et un mouvement marqué de la poitrine {cite:canon-ibn-sina-print-v2 p.259} {cite:canon-ibn-sina-print-v2 p.260}"
  ur: 'گونگا پن اور باقی کلام کی آفات دماغ یا خود عصب کی شاخ کی آفہ سے بھی ہو سکتی ہیں اور خود پٹھوں میں بھی؛ وہ خلل یا تو کھنچاؤ ہے یا تاؤل، سختی، استرخا، باندھ کی کمی، بھر آئے زخم کے بعد سکڑاؤ یا سخت ورم؛ اکثر رطوبت سے ہوتا ہے مگر خشکی سے بھی ہو سکتا ہے؛ اور کلام کی آفہ زبان اور اس کے اطراف کے ورموں اور زخموں سے بھی ہو سکتی ہے؛ سرسام کے بعد ہو سکتی ہے جب پٹھے دماغ سے اعصاب میں دھکیل دیے جائیں اور گرم بخاروں میں ان کی شدید خشکی سے — تب زبان سوکھا ہوا متشنّج ہوتی ہے جو کم ہوتا ہے؛ اور آفہ حلقوم کے پٹھوں کے کسی سبب سے بھی ہو سکتی ہے جب ان میں تاؤل یا استرخا ہو: کسی شخص کو شروع میں آواز مشکل ہو سکتی ہے کہ وہ سینے اور حلقوم کے پٹھوں کو برداشت سے زیادہ ہلاتا ہے یہاں تک کہ انکار کر دیں؛ اگر وہ کلام کے آغاز میں خشک ہو جائے تو بعد میں رواں ہوتا ہے — اور ایسے شخص کو چاہیے کہ کلام کے لیے بڑا دم اور بڑی حرکت نہ لے بل نرمی سے شروع کرے {cite:canon-ibn-sina-print-v2 p.259} {cite:canon-ibn-sina-print-v2 p.260}'
