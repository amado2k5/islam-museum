label:
  ar: "أخيلوس"
  en: "Akhilus (also called sandristus)"
  ur: "اخیلوس ⁦(سندریسطس)⁩"
summary:
  ar: "يُسمّى أيضاً سندريسطس، وهو أقبض من سندريسطس عند جالينوس؛ وهو نبات أم ألف ورقة {cite:canon-ibn-sina-print-v1 p.380}. تذكر الكتب أنه يقطع انفجار الدم وقروح الأمعاء والنزف العارض للنساء {cite:canon-ibn-sina-print-v1 p.380}."
  en: "Also called sandristus; Galen is quoted as saying it is more astringent than sandristus. The editor identifies it as the milfoil plant {cite:canon-ibn-sina-print-v1 p.380}. The book says it cuts bursting of blood, intestinal ulcers, and the bleeding that befalls women; the last is kept as the book's listing and is logged for the founder's ruling {cite:canon-ibn-sina-print-v1 p.380}."
  ur: "اسے سندریسطس بھی کہا جاتا ہے؛ جالینوس کے نزدیک یہ سندریسطس سے زیادہ قابض ہے۔ مدوّن کے مطابق یہ نبات ام ألف ورقة یعنی ہزار پتوں والی جڑی بوٹی ہے {cite:canon-ibn-sina-print-v1 p.380}۔ کتاب کے مطابق یہ خون کے پھٹنے، آنتوں کے زخم اور عورتوں کو لاحق خون بہنے میں نفع دیتی ہے؛ آخری بات کتاب کی فہرست کے طور پر درج ہے اور فیصلے کے لیے لاگ میں ہے {cite:canon-ibn-sina-print-v1 p.380}۔"
