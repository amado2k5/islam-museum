id: concept/ilaj-al-malinkhuliya-al-madawiyya
class: concept
kind: scientific
label:
  ar: "علاج المالنخوليا من مادة سوداوية متمكنة"
  en: "Treatment of melancholia from a settled black-bile matter"
  ur: "جمی ہوئی سوداوی مادے سے مالنخولیا کا علاج"
  es: "Tratamiento de la melancolía causada por una enfermedad biliar negra coagulada."
summary:
  ar: "يجعل ابن سينا ملاك علاج المالنخوليا من مادة سوداوية متمكنة في الدماغ ثلاثة أمور: استفراغ المادة، والترطيب مع الاستفراغ، وتقوية القلب؛ ويذكر ما ينفع بالذات وما يُشغل به المريض؛ ولا تُنقل الوصفات ولا المقادير ولا طرق الاستعمال، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.107} {cite:canon-ibn-sina-print-v2 p.108} {cite:canon-ibn-sina-print-v2 p.109} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
  en: "Ibn Sina makes the pillar of treating melancholia from a settled black-bile matter in the brain three things: evacuating the matter, moistening along with the evacuation, and strengthening the heart; he says what benefits by itself and how the patient is occupied; recipes, quantities and methods of application are not reproduced; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.107} {cite:canon-ibn-sina-print-v2 p.108} {cite:canon-ibn-sina-print-v2 p.109} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
  ur: "ابن سینا دماغ میں جمی ہوئی سوداوی مادے سے مالنخولیا کے علاج کا مدار تین باتیں بتاتا ہے: مادے کا استفراغ، استفراغ کے ساتھ تر کرنا، اور دل کو قوت دینا؛ وہ بتاتا ہے کہ بالذات کیا نافع ہے اور مریض کو کیسے مشغول رکھا جائے؛ نسخے، مقداریں اور استعمال کے طریقے نقل نہیں کیے گئے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.107} {cite:canon-ibn-sina-print-v2 p.108} {cite:canon-ibn-sina-print-v2 p.109} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}۔"
  es: "Ibn Sina establece tres pilares para el tratamiento de la melancolía causada por una sustancia biliar negra acumulada en el cerebro: evacuar la sustancia, humedecerla junto con la evacuación y fortalecer el corazón; indica qué beneficios aporta y cómo se trata al paciente; no se reproducen recetas, cantidades ni métodos de aplicación; el registro contiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 p.107} {cite:canon-ibn-sina-print-v2 p.108} {cite:canon-ibn-sina-print-v2 p.109} {cite:canon-ibn-sina-print-v2 p.110} {cite:canon-ibn-sina-print-v2 p.111}"
