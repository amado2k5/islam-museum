summary: { ar: "الحُمْس: الاسم الذي تسمّت به قريش وحلفاؤها ⁦(ساموا حماسةً في دينهم)⁩، وابتدعوا به بدعاً في الحج: لا يقفون بعرفة ولا يرمضون إن حلّوا ولا يطوفون عراةً ولا يدخلون بيوتهم إلا من ظهورها في الإحرام.", en: "The Hums: the self-styled ‘rigorous’ fraternity of Quraysh and allies who invented Hajj innovations — shunning ‘Arafa, Rafm clothes, naked tawaf, back-door entry in ihram.", es: "Los Hums: la autodenominada fraternidad \"rigurosa\" de los Quraysh y sus aliados que inventaron innovaciones para el Hajj: evitar Arafa, usar la ropa de Rafm, realizar el tawaf desnudo y entrar por la puerta trasera en estado de ihram.", fr: "Les Hums: la confrérie autoproclamée « rigoureuse » des Quraysh et de leurs alliés qui ont inventé des innovations pour le Hajj — en évitant 'Arafa, les vêtements Rafm, le tawaf nu, l'entrée par la porte arrière en état d'ihram." }
