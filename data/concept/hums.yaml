summary: { ar: "الحُمْس: الاسم الذي تسمّت به قريش وحلفاؤها ⁦(ساموا حماسةً في دينهم)⁩، وابتدعوا به بدعاً في الحج: لا يقفون بعرفة ولا يرمضون إن حلّوا ولا يطوفون عراةً ولا يدخلون بيوتهم إلا من ظهورها في الإحرام.", en: "The Hums: the self-styled ‘rigorous’ fraternity of Quraysh and allies who invented Hajj innovations — shunning ‘Arafa, Rafm clothes, naked tawaf, back-door entry in ihram.", es: "Los Hums: la autodenominada fraternidad \"rigurosa\" de los Quraysh y sus aliados que inventaron innovaciones para el Hajj: evitar Arafa, usar la ropa de Rafm, realizar el tawaf desnudo y entrar por la puerta trasera en estado de ihram.", fr: "Les Hums: la confrérie autoproclamée « rigoureuse » des Quraysh et de leurs alliés qui ont inventé des innovations pour le Hajj — en évitant 'Arafa, les vêtements Rafm, le tawaf nu, l'entrée par la porte arrière en état d'ihram.", ur: "ہمس: قریش اور حلیفوں کا خود ساختہ 'سخت' برادرانہ جنہوں نے حج کی بدعات ایجاد کیں - عرفہ، رفم لباس، ننگے طواف، احرام میں پچھلے دروازے سے داخلہ سے پرہیز۔", tr: "El-Hams: Kureyşleri ve müttefiklerini karakterize eden isimdir (dinlerinde Hamas'a yükselmişlerdir) ve Hac'da bu isimle yenilik yapmışlardır: Arafah'ta durmazlar, oradayken Ramazan'a gitmezler, çıplak dolaşmazlar ve ihram sırasında evlerine sadece sırtından girerler.", id: "Al-Hams: nama yang menjadi ciri khas Quraisy dan sekutunya (mereka naik ke Hamas dalam agama mereka), dan mereka berinovasi dengan nama itu dalam Haji: mereka tidak berdiri di Arafah, tidak pergi ke Ramadan saat mereka hadir, tidak mengelilingi Ramadan dalam keadaan telanjang, dan tidak masuk ke rumah mereka kecuali dari punggung selama Ihram." }
