label: { ar: "وَاجِب", en: "Wajib (the obligatory: kinds, grades and how it is discharged)" }
summary:
  ar: "الواجب في الاصطلاح عند الحنفية ما لزم بدليل فيه شبهة، وعند الجمهور ما يُذم تاركه شرعاً على بعض الوجوه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584} والفرض عند الحنفية ما ثبت بدليل قطعي لا شبهة فيه، والواجب ما ثبت بدليل ظني فيه شبهة، كصدقة الفطر والأضحية، وعند الجمهور هما مترادفان شرعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} وتتفاوت مراتب الواجب عند الشافعية بكثرة اللوم على تركه، وعند الحنفية بقوة دليله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} وينقسم الواجب إلى عيني وكفائي، وإلى معين ومخيّر، وإلى مؤقت وغير مؤقت، والمؤقت إلى مضيّق وموسّع، وإلى ما هو على الفور وما هو على التراخي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} وإذا فات الواجب بالتأخير وجب قضاؤه أو جبره بالكفارة، وقد يسقط القضاء عن الصبي والمجنون والحائض لأسباب ترجع إلى الرفق بالمكلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} وفي الزيادة على الواجب اختلفت المذاهب: فالحنفية يقولون إن الزيادة تُقدّر بما يتفق عليه، والمالكية يكرهونها، والشافعية والحنابلة يفرقون بين ما يتميز منها وما لا يتميز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16596} وقد يجب الشيء ثم يسقط بتعارض المقتضي والمانع، عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16597}"
  en: "The obligatory (wajib) in the technical sense is, for the Hanafis, what is required by evidence that admits doubt, and for the majority what the law blames one for omitting in some respect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584} The Hanafis hold the fard to be what is established by certain evidence and the wajib by probable evidence, such as the alms of the breaking of the fast and the sacrifice; for the majority the two terms are synonymous in the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} The grades of obligation differ, for the Shafi'is by the blame attached to omission, and for the Hanafis by the strength of the evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} An obligation is individual or collective, specific or optional, timed or untimed; a timed one is narrow or broad, and is immediate or may be delayed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} If an obligation is missed through delay it must be made up, or repaired by expiation; the insane, the menstruating and the child are excused the making up for reasons of mercy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} On exceeding an obligation, the schools differ: the Hanafis rule on what the law specifies, the Malikis dislike the excess, and the Shafi'is and Hanbalis distinguish an excess that can be separated from one that cannot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16596} For the Shafi'is an obligation may arise and then fall away when the cause and the bar conflict. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16597}"
