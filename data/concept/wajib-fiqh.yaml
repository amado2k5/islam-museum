id: concept/wajib-fiqh
class: concept
kind: legal
label: { ar: "وَاجِب", en: "Wajib (the obligatory: kinds, grades and how it is discharged)", es: "Wajib (lo obligatorio: tipos, grados y cómo se cumple)", fr: "Wajib (l'obligatoire: types, degrés et modalités d'exécution)", ur: "واجب ⁦(واجب: اقسام، درجات اور اس کا اخراج کیسے ہوتا ہے)⁩", tr: "Görev", id: "Tugas" }
summary:
  ar: "الواجب في الاصطلاح عند الحنفية ما لزم بدليل فيه شبهة، وعند الجمهور ما يُذم تاركه شرعاً على بعض الوجوه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584} والفرض عند الحنفية ما ثبت بدليل قطعي لا شبهة فيه، والواجب ما ثبت بدليل ظني فيه شبهة، كصدقة الفطر والأضحية، وعند الجمهور هما مترادفان شرعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} وتتفاوت مراتب الواجب عند الشافعية بكثرة اللوم على تركه، وعند الحنفية بقوة دليله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} وينقسم الواجب إلى عيني وكفائي، وإلى معين ومخيّر، وإلى مؤقت وغير مؤقت، والمؤقت إلى مضيّق وموسّع، وإلى ما هو على الفور وما هو على التراخي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} وإذا فات الواجب بالتأخير وجب قضاؤه أو جبره بالكفارة، وقد يسقط القضاء عن الصبي والمجنون والحائض لأسباب ترجع إلى الرفق بالمكلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} وفي الزيادة على الواجب اختلفت المذاهب: فالحنفية يقولون إن الزيادة تُقدّر بما يتفق عليه، والمالكية يكرهونها، والشافعية والحنابلة يفرقون بين ما يتميز منها وما لا يتميز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16596} وقد يجب الشيء ثم يسقط بتعارض المقتضي والمانع، عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16597} ويستعرض الغزالي في تمهيد المستصفى حدود الواجب المختلفة — ما تعلق به الإيجاب، وما يثاب على فعله ويعاقب على تركه، وما لا يجوز العزم على تركه — ويرى أن أكثرها عرضة للوازم فيقع النظر في حقيقته بالتقسيم لا بالحد، ثم يقسم أفعال المكلفين بالإضافة إلى خطاب الشرع إلى خمسة: الواجب والمحظور والمندوب والمكروه والمباح، ويشرح الإشعار بأنه ما عرف من خطاب صريح أو قرينة أو معنى مستنبط أو فعل أو إشارة. {cite:mustasfa p.82-85}"
  en: "The obligatory (wajib) in the technical sense is, for the Hanafis, what is required by evidence that admits doubt, and for the majority what the law blames one for omitting in some respect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584} The Hanafis hold the fard to be what is established by certain evidence and the wajib by probable evidence, such as the alms of the breaking of the fast and the sacrifice; for the majority the two terms are synonymous in the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} The grades of obligation differ, for the Shafi'is by the blame attached to omission, and for the Hanafis by the strength of the evidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} An obligation is individual or collective, specific or optional, timed or untimed; a timed one is narrow or broad, and is immediate or may be delayed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} If an obligation is missed through delay it must be made up, or repaired by expiation; the insane, the menstruating and the child are excused the making up for reasons of mercy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} On exceeding an obligation, the schools differ: the Hanafis rule on what the law specifies, the Malikis dislike the excess, and the Shafi'is and Hanbalis distinguish an excess that can be separated from one that cannot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16596} For the Shafi'is an obligation may arise and then fall away when the cause and the bar conflict. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16597} Al-Ghazali's introduction to the Mustasfa surveys the competing definitions of the obligatory — what obligation attaches to, what earns reward for doing and punishment for leaving, what one may not resolve to leave — and holds that most invite consequences, so its reality is reached by division rather than definition; he then divides the acts of the obliged relative to the divine discourse into five: obligatory, forbidden, recommended, disliked and permitted, explaining indication as what is known from an explicit text, a circumstantial clue, an inferred meaning, an act or a gesture. {cite:mustasfa p.82-85}"
  es: "Lo obligatorio (wajib) en sentido técnico es, para los Hanafi, lo que se requiere por evidencia que admite duda, y para la mayoría lo que la ley reprocha que se omita en algún aspecto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584} Los Hanafi sostienen que lo fard es lo que se establece por evidencia cierta y lo wajib por evidencia probable, como la limosna de la ruptura del ayuno y el sacrificio; para la mayoría los dos términos son sinónimos en la ley. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} Los grados de obligación difieren, para los Shafi'is por la culpa adjunta a la omisión, y para los Hanafi por la fuerza de la evidencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} Una obligación es individual o colectiva, específica u opcional, programada o no; uno cronometrado es limitado o amplio, y es inmediato o puede retrasarse. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16587} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16588} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} Si una obligación se incumple por demora, debe compensarse o repararse mediante expiación; Los enfermos mentales, las mujeres menstruantes y los niños están exentos de la obligación de compensar por razones de misericordia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} En cuanto a exceder una obligación, las escuelas difieren: los hanafíes dictaminan sobre lo que especifica la ley, los malikíes desaprueban el exceso, y los shafiíes y hanbalíes distinguen un exceso que puede separarse de uno que no. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16596} Para los shafi'ís, una obligación puede surgir y luego desaparecer cuando la causa y la prohibición entran en conflicto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16597} La introducción de Al-Ghazali al Mustasfa examina las definiciones en competencia de lo obligatorio: a qué se adhiere la obligación, qué obtiene recompensa por hacer y castigo por dejar, qué uno puede no decidir dejar, y sostiene que la mayoría conlleva consecuencias, por lo que su realidad se alcanza mediante la división más que mediante la definición; Luego divide los actos de lo obligado en relación con el discurso divino en cinco: obligatorios, prohibidos, recomendados, desaconsejados y permitidos, explicando la indicación como aquello que se conoce a partir de un texto explícito, una pista circunstancial, un significado inferido, un acto o un gesto. {cite:mustasfa p.82-85}"
  fr: "L'obligation (wajib), au sens technique, est, pour les hanafites, ce qui est requis par une preuve qui admet un doute, et pour la majorité, ce que la loi reproche à celui qui l'a omise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16584} Les hanafites considèrent que le fard est ce qui est établi par une preuve certaine et le wajib par une preuve probable, comme l'aumône de la rupture du jeûne et le sacrifice; pour la majorité, les deux termes sont synonymes en droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} Les degrés d'obligation diffèrent: pour les shafi'ites, selon le blâme attaché à l'omission; pour les hanafites, selon la force de la preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} Une obligation est individuelle ou collective, spécifique ou facultative, temporisée ou non; un délai est étroit ou large, et est immédiat ou peut être retardé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} Si une obligation est manquée par retard, elle doit être rattrapée ou réparée par expiation; Les personnes atteintes de troubles mentaux, celles qui ont leurs menstruations et les enfants sont dispensées de rattraper les retards par mesure de miséricorde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} Concernant le dépassement d'une obligation, les écoles divergent: les hanafites se basent sur ce que prescrit la loi, les malikites désapprouvent le dépassement, et les chaféites et les hanbalites distinguent un dépassement qui peut être dissocié de celui qui ne l'est pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16596} Pour les Shafi'ites, une obligation peut naître puis disparaître lorsque la cause et l'interdiction sont contradictoires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16597} L'introduction d'Al-Ghazali au Mustasfa examine les définitions concurrentes de l'obligatoire — ce à quoi l'obligation s'attache, ce qui mérite une récompense pour son accomplissement et une punition pour son omission, ce qu'on ne peut pas décider d'abandonner — et soutient que la plupart entraînent des conséquences, de sorte que sa réalité est atteinte par la division plutôt que par la définition; Il divise ensuite les actes de l'oblige par rapport au discours divin en cinq catégories: obligatoires, interdits, recommandés, déconseillés et permis, expliquant que l'indication se définit par ce qui est connu d'un texte explicite, un indice circonstanciel, une signification inférée, un acte ou un geste. {cite:mustasfa p.82-85}"
  ur: "تکنیکی لحاظ سے واجب ⁦(واجب)⁩ احناف کے نزدیک وہ چیز ہے جو شک کا اقرار کرنے والے شواہد کی ضرورت ہے، اور جمہور کے لیے وہ چیز ہے جسے قانون کسی نہ کسی حوالے سے ترک کرنے کا ذمہ دار ٹھہراتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16584} احناف اس فرض کو وہ کہتے ہیں جو بعض دلائل سے ثابت ہو اور واجب کو احتمالی دلائل سے، جیسے افطار اور قربانی کا صدقہ۔ اکثریت کے لیے دونوں اصطلاحات قانون میں مترادف ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16585} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16586} شافعیوں کے لیے فرض کے درجات مختلف ہیں، اور احناف کے نزدیک دلیل کے اعتبار سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16586} ایک ذمہ داری انفرادی ہے یا اجتماعی، مخصوص یا اختیاری، وقتی یا غیر وقتی؛ ایک مقررہ وقت تنگ یا وسیع ہے، اور فوری ہے یا اس میں تاخیر ہو سکتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16586} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16587} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16588} صفحہ 16589} {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16590} اگر کوئی فرض تاخیر سے چھوٹ جائے تو اس کی قضا لازم ہے یا کفارہ کے ذریعے اس کی مرمت کرنی چاہیے۔ دیوانے، حیض والے اور بچے کو رحم کی وجہ سے قضاء معاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16590} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16591} فرض سے تجاوز کرنے پر مکاتب میں اختلاف ہے: حنفیہ کا اس بات پر قاعدہ ہے جو شریعت میں بیان کیا گیا ہے، مالکی کو ناپسندیدگی اور حنفی کو ناپسند ہے۔ اضافی جو ایک سے الگ کیا جا سکتا ہے جو نہیں کر سکتا. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16591} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16594} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16596} جب شرف ختم ہو جائے اور اس کے بعد شرعاً واجب ہو جائے تنازعہ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 16597} الغزالی کا مصطفےٰ کا تعارف واجب کی مسابقتی تعریفوں کا جائزہ لیتا ہے — فرض کس چیز سے منسلک ہے، کیا کرنے کا ثواب اور چھوڑنے کی سزا، کس چیز کو چھوڑنے کا فیصلہ نہیں کر سکتا — اور اس کے اعتبار سے اس کے حقیقی تصور کو برقرار رکھا گیا ہے۔ تعریف کے بجائے؛ اس کے بعد وہ الہٰی گفتگو سے متعلق واجبات کے اعمال کو پانچ حصوں میں تقسیم کرتا ہے: واجب، حرام، مستحب، ناپسندیدہ اور اجازت، اس اشارے کی وضاحت کرتا ہے جو کسی صریح متن سے معلوم ہوتا ہے، حالات کا اشارہ، ایک قیاس شدہ معنی، ایک عمل یا اشارہ۔ {حوالہ: مصطفٰی ص 82-85}"
  tr: "Hanefi terminolojisinde yükümlülük, şüphe uyandıran delillerle yükümlülük, çoğunluğa göre ise terk edilmenin yasal olarak kınandığı şeydir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16584} Hanefilere göre, zorunluluk, şüphe duymadan kesin kanıtlarla belirlenen şeydir; zorunlu ise şüphe uyandıran spekülatif kanıtlarla, örneğin el-Fitr sadakası ve kurban gibi. Çoğunluğa göre, İslam hukukunda eşanlamlıdırlar. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16586} Yükümlülük seviyeleri, sık sık ihmal edilmekle suçlandığı ve Hanefilere göre kanıtlarının gücü nedeniyle Şafiiler arasında farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} The duty is divided into 'aynānī' and 'sufficiency', into 'aynāyā' and 'sufficiency', into 'aynāyā' and 'mā'āyā', into 'mu'aṭā'ī' and 'mu'aṭā', into 'aṭāṭā', into 'aṭāṭā', into 'aṣāṭā', into 'aṭānī' (aṭāṭā', 'aṭā'ānā'), into 'aṭāṭā', into 'aṭānī' (meaning and what is 'al-sā'ī' [eos]{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} [eos]{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16587} [eos]{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16588} [eos]{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16590} Bir yükümlülük gecikmeyle eksiklenirse, bu borç telafi edilmeli veya kefaret ile telafi edilmelidir. Kaçırılan görevin telafisi, sorumlu kişiye karşı nazik olma nedenleriyle çocuk, akıl hastası veya adet gören kadın için feragat edilebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16591} Yükümlülüğe ek olarak, okullar farklılık gösterir: Hanafiler artışın uzlaşıyla belirlendiğini, Malikiler hoşlanmaz, Şafi'ler ve Hanbaliler ise neyin ayırt edildiğini s.16591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16596} ve bir şey zorunlu olabilir, sonra gerekli ile engelleyici arasındaki çatışma nedeniyle bırakılabilir, Şafi'lere göre. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16597} Al-Gazali, Al-Mustasfa'nın girişinde yükümlülüğün çeşitli sınırlarını — yükümlülükle ilgili olanı — ne yükümlülükle ilgili olduğunu, eylem için neyin ödüllendirildiğini ve ihmal için neyin cezalandırıldığını ve terk edilmesinin izin verilmediğini — gözden geçirir ve bunların çoğunun sonuçlara tabi olduğunu, bu nedenle gerçekliğin hadd ile değil, bölünme yoluyla değerlendirildiğini düşünür. Sonra sorumlu olanın eylemlerini, dini söylemin yanı sıra beş olarak ayırır: zorunlu, yasak, önerilen, sevilmez ve izinli. Bildirimin açık konuşma, işaret, çıkarımlı anlam, eylem veya işaret olarak tanımlandığını açıklar. {atıf:Mustafa s.82-85}"
  id: "Dalam terminologi Hanafi, kewajiban adalah apa yang diwajibkan oleh bukti yang menimbulkan keraguan, sementara menurut mayoritas adalah apa yang secara hukum dikutuk oleh pengabaian dalam beberapa cara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16584} Menurut Hanafi, kewajiban adalah apa yang ditetapkan oleh bukti pasti tanpa keraguan, sedangkan wajib adalah apa yang dibuktikan oleh bukti spekulatif yang menimbulkan keraguan, seperti amal al-Fitr dan pengorbanan. Menurut mayoritas, keduanya sinonim dalam hukum Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16586} Tingkat kewajiban bervariasi di antara para Shafi'i karena sering disalahkan atas pengabaiannya, dan menurut Hanafi, berdasarkan kekuatan buktinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16586} Kewajiban ini dibagi menjadi 'aynānī' dan 'kecukupan', menjadi 'aynāyā' dan 'kecukupan', menjadi 'aynāyā' dan 'mā'āyā', menjadi 'mu'aṭā'ī' dan 'mu'aṭā', menjadi 'aṭāṭā', menjadi 'aṭāṭā', menjadi 'aṣāṭā', menjadi 'aṭānī' (aṭāṭā', 'aṭā'ā'), menjadi 'aṭāṭā', menjadi 'aṭānī' (yang berarti dan apa itu 'al-sā'ī' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16590} Jika kewajiban terlewat karena keterlambatan, kewajiban tersebut harus diganti atau diganti dengan penebusan. Menutupi kewajiban yang terlewat dapat dihapuskan untuk anak, orang gila, atau wanita yang sedang menstruasi karena alasan yang berkaitan dengan sikap lembut kepada orang yang bertanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16591} Mengenai tambahan kewajiban, aljaran berbeda: Hanafi mengatakan bahwa kenaikan ditentukan oleh konsensus, Maliki tidak menyukainya, dan Shafi'i serta Hanbal membedakan apa yang dibedakan dari yang tidak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16594} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16596} dan sesuatu mungkin wajib lalu ditinggalkan karena konflik antara yang perlu dan yang larang, menurut para syafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16597} Al-Ghazali meninjau dalam pengantar Al-Mustasfa berbagai batasan kewajiban — apa yang berkaitan dengan kewajiban, apa yang diberi ganjaran atas tindakannya dan apa yang dihukum atas kelalaian, dan apa yang tidak boleh ditinggalkan — dan menganggap bahwa sebagian besar dari konsekuensi tersebut tunduk pada konsekuensi, sehingga realitasnya dipertimbangkan melalui pembagian bukan oleh hadd. Kemudian ia membagi tindakan yang bertanggung jawab, selain wacana agama, menjadi lima: wajib, dilarang, direkomendasikan, tidak disukai, dan diperbolehkan. Ia menjelaskan bahwa pemberitahuan didefinisikan sebagai ucapan eksplisit, indikasi, makna yang disimpulkan, tindakan, atau indikasi. {cite:mustasfa hlm.82-85}"
