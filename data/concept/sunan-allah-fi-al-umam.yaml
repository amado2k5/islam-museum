id: concept/sunan-allah-fi-al-umam
class: concept
kind: doctrine
label: { ar: "سنن الله في الأمم", en: "God's sunan among peoples", es: "Sunan de Dios entre los pueblos", fr: "Les sunnas de Dieu parmi les peuples", ur: "لوگوں کے درمیان خدا کا سنان" }
issue:
  ar: "كيف تجري سنة الله في هلاك الأمم وبقائها، ولماذا تقترن العقوبة بالفساد؟"
summary:
  ar: "يقرر رضا أن في كل أمة بقية من الصالحين هي حجة الله على الأقوام، وأنه متى قلّ هؤلاء في أمة غلب عليها الفساد وقرب انتقام الله منها. ويقرر أن أصل الدين يقتضي سعادة الدنيا قبل الآخرة، وأن ما يزعمه البعض من أن الدين سبب للفقر والضعف ترده هذه الآيات، وأن العقوبة تقع بسبب الشرك والمعاصي المفسدة للاجتماع."
  en: "Rida holds that every nation keeps a remnant of the righteous who stand as God's proof; when they become few, corruption prevails and God's requital draws near. He argues that the root of religion brings the good of this world before the next, and that the chastisements in the Qur'an fall because of shirk and of sins that corrupt social order."
  es: "Rida sostiene que toda nación conserva un remanente de justos que son prueba de la existencia de Dios; cuando estos se reducen, la corrupción se impone y el castigo divino se acerca. Argumenta que la esencia de la religión trae consigo el bien de este mundo antes que el del más allá, y que los castigos del Corán se deben a la idolatría y a los pecados que corrompen el orden social."
  fr: "Rida soutient que chaque nation conserve un noyau de justes qui témoignent de la bonté divine; lorsque leur nombre diminue, la corruption s'installe et le châtiment divin approche. Il affirme que la religion, par essence, fait prévaloir le bien de ce monde sur l'autre, et que les châtiments du Coran sont dus au shirk (associationnisme) et aux péchés qui pervertissent l'ordre social."
  ur: "ردا کا خیال ہے کہ ہر قوم صالحین کی باقیات رکھتی ہے جو خدا کے ثبوت کے طور پر کھڑے ہوتے ہیں۔ جب وہ کم ہو جاتے ہیں تو فساد پھیل جاتا ہے اور اللہ کا عذاب قریب آ جاتا ہے۔ وہ دلیل دیتا ہے کہ مذہب کی جڑ دنیا کی بھلائی کو آخرت سے پہلے لاتی ہے، اور یہ کہ قرآن میں سزائیں شرک اور معاشرتی نظام کو خراب کرنے والے گناہوں کی وجہ سے آتی ہیں۔"
