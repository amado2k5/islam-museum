id: concept/sunan-allah-fi-al-umam
class: concept
kind: doctrine
label: { ar: "سنن الله في الأمم", en: "God's sunan among peoples" }
issue:
  ar: "كيف تجري سنة الله في هلاك الأمم وبقائها، ولماذا تقترن العقوبة بالفساد؟"
summary:
  ar: "يقرر رضا أن في كل أمة بقية من الصالحين هي حجة الله على الأقوام، وأنه متى قلّ هؤلاء في أمة غلب عليها الفساد وقرب انتقام الله منها. ويقرر أن أصل الدين يقتضي سعادة الدنيا قبل الآخرة، وأن ما يزعمه البعض من أن الدين سبب للفقر والضعف ترده هذه الآيات، وأن العقوبة تقع بسبب الشرك والمعاصي المفسدة للاجتماع."
  en: "Rida holds that every nation keeps a remnant of the righteous who stand as God's proof; when they become few, corruption prevails and God's requital draws near. He argues that the root of religion brings the good of this world before the next, and that the chastisements in the Qur'an fall because of shirk and of sins that corrupt social order."
