id: concept/zij-sabi-mercury-distance-and-apparent-size
class: concept
kind: scientific
label: { ar: "بُعد عطارد وقطره الظاهر وعظم جرمه", en: "The distance, apparent diameter and size of Mercury", ur: "عطارد کا بُعد، ظاہری قطر اور جرم", es: "La distancia, el diámetro aparente y el tamaño de Mercurio", fr: "La distance, le diamètre apparent et la taille de Mercure", tr: "Merkür'ün uzaklığı, görünen çapı ve büyüklüğü", id: "Jarak, diameter tampak, dan ukuran Merkurius" }
summary:
  ar: "يذكر النص أن بعد عطارد الأبعد يبلغ مائة وستاً وستين مرة مثل نصف قطر الأرض، وأن اختلاف عظم قطره بين البعد الأبعد والأقرب يكون بمقدار الاثنين والثلث والربع عند الواحد، أي أن عظم قطره يتفاوت بنحو الاثنين والثلث والربع. ويُذكر أن قطره الظاهر أربع دقائق ونصف وسدس تقريباً، وأن عظم جرمه جزء من سبعة عشر جزءاً من جرم الأرض بالتقريب. {cite:zij-sabi-nallino-byblion pp.186-187}"
  en: "The text gives Mercury's farthest distance as one hundred and sixty-six times the Earth's radius. The variation of its size between its farthest and nearest positions is given as about two and a third and a quarter to one. Its apparent diameter is about four and a half and a sixth of a minute of arc, and its bulk is about one part in seventeen of the Earth. {cite:zij-sabi-nallino-byblion pp.186-187}"
  ur: "متن عطارد کا سب سے دور کا بُعد زمین کے نصف قطر کے ایک سو چھیاسٹھ گنا بتاتا ہے۔ اس کے قطر کا تفاوت دور اور قریب کے مقامات کے درمیان تقریباً دو اور ایک تہائی اور ایک چوتھائی کے برابر ہے۔ اس کا ظاہری قطر تقریباً چار دقیقے اور نصف اور ایک سدس دقیقہ ہے، اور اس کا جرم زمین کے جرم کا تقریباً سترہواں حصہ ہے۔ {cite:zij-sabi-nallino-byblion pp.186-187}"
  es: "El texto indica que la distancia máxima de Mercurio es ciento sesenta y seis veces el radio de la Tierra. La variación de su tamaño entre sus posiciones más lejana y más cercana se estima en aproximadamente dos veces y un tercio y un cuarto a uno. Su diámetro aparente es de aproximadamente cuatro minutos y medio y un sexto de arco, y su volumen es de aproximadamente una parte diecisiete de la Tierra. {cite:zij-sabi-nallino-byblion pp.186-187}"
  fr: "Le texte indique que la distance maximale de Mercure est de cent soixante-six fois le rayon terrestre. La variation de sa taille entre ses positions la plus éloignée et la plus proche est d'environ deux tiers et un quart pour un. Son diamètre apparent est d'environ quatre minutes et demie et un sixième de minute d'arc, et sa masse représente environ un dix-septième de celle de la Terre. {cite:zij-sabi-nallino-byblion pp.186-187}"
  tr: "Metinde, Merkür'ün en uzak noktasının Dünya'nın yarıçapının 166 katı olduğu ve en uzak ve en yakın noktaları arasındaki çap farkının yaklaşık olarak bir çapın iki buçuk ve çeyrek katı olduğu belirtilmektedir. Ayrıca, görünen çapının yaklaşık dört buçuk ve altıda bir dakika olduğu ve kütlesinin Dünya'nın kütlesinin yaklaşık on yedide biri olduğu ifade edilmektedir. {cite:zij-sabi-nallino-byblion pp.186-187}"
  id: "Teks tersebut menyatakan bahwa titik terjauh Merkurius adalah 166 kali jari-jari Bumi, dan bahwa perbedaan diameternya antara titik terjauh dan terdekatnya kira-kira dua sepertiga seperempat kali diameter satu. Teks tersebut juga menyatakan bahwa diameter tampak Merkurius kira-kira empat setengah seperenam menit, dan bahwa massanya kira-kira sepertujuh belas massa Bumi. {cite:zij-sabi-nallino-byblion pp.186-187}"
