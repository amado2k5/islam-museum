label: { ar: "بُعد عطارد وقطره الظاهر وعظم جرمه", en: "The distance, apparent diameter and size of Mercury", ur: "عطارد کا بُعد، ظاہری قطر اور جرم", es: "La distancia, el diámetro aparente y el tamaño de Mercurio" }
summary:
  ar: "يذكر النص أن بعد عطارد الأبعد يبلغ مائة وستاً وستين مرة مثل نصف قطر الأرض، وأن اختلاف عظم قطره بين البعد الأبعد والأقرب يكون بمقدار الاثنين والثلث والربع عند الواحد، أي أن عظم قطره يتفاوت بنحو الاثنين والثلث والربع. ويُذكر أن قطره الظاهر أربع دقائق ونصف وسدس تقريباً، وأن عظم جرمه جزء من سبعة عشر جزءاً من جرم الأرض بالتقريب. {cite:zij-sabi-nallino-byblion pp.186-187}"
  en: "The text gives Mercury's farthest distance as one hundred and sixty-six times the Earth's radius. The variation of its size between its farthest and nearest positions is given as about two and a third and a quarter to one. Its apparent diameter is about four and a half and a sixth of a minute of arc, and its bulk is about one part in seventeen of the Earth. {cite:zij-sabi-nallino-byblion pp.186-187}"
  ur: "متن عطارد کا سب سے دور کا بُعد زمین کے نصف قطر کے ایک سو چھیاسٹھ گنا بتاتا ہے۔ اس کے قطر کا تفاوت دور اور قریب کے مقامات کے درمیان تقریباً دو اور ایک تہائی اور ایک چوتھائی کے برابر ہے۔ اس کا ظاہری قطر تقریباً چار دقیقے اور نصف اور ایک سدس دقیقہ ہے، اور اس کا جرم زمین کے جرم کا تقریباً سترہواں حصہ ہے۔ {cite:zij-sabi-nallino-byblion pp.186-187}"
  es: "El texto indica que la distancia máxima de Mercurio es ciento sesenta y seis veces el radio de la Tierra. La variación de su tamaño entre sus posiciones más lejana y más cercana se estima en aproximadamente dos veces y un tercio y un cuarto a uno. Su diámetro aparente es de aproximadamente cuatro minutos y medio y un sexto de arco, y su volumen es de aproximadamente una parte diecisiete de la Tierra. {cite:zij-sabi-nallino-byblion pp.186-187}"
