id: concept/hamm
class: concept
kind: ethical
label:
  ar: الهم بالعمل
  en: Resolve for an act (hamm)
summary:
  ar: "الهم في الحديث السابع والثلاثين من الأربعين — وهو عزم القلب على العمل قبل فعله — مقياس كتابة الأعمال عند الله: «فمن هم بحسنة فلم يعملها كتبها الله عنده حسنة كاملة، وإن هم بها فعملها كتبها عنده عشر حسنات إلى سبعمئة ضعف إلى أضعاف كثيرة، وإن هم بسيئة فلم يعملها كتبها عنده حسنة كاملة، وإن هم بها فعملها كتبها الله سيئة واحدة» — فالهم بالحسنة يُثاب عليه وإن لم يقع الفعل، والهم بالسيئة لا يعاقب عليه بل يكتب حسنة إن تركها لله، ولا تكتب السيئة إلا بالعمل، وفضل الهم على مجرد الخاطر أنه قصد مستقر يشبه الإرادة الجازمة (جامع العلوم والحكم ص 754–755)."
  en: "The hamm in the thirty-seventh hadith of the Forty — the heart's resolve upon an act before doing it — is the measure by which deeds are written with God: 'whoever resolves on a good deed and does not do it, God writes it down as a complete good deed; if he resolves and does it, ten good deeds to seven hundred times over and more; if he resolves on an evil deed and does not do it, He writes it down as a complete good deed; and if he resolves and does it, God writes it down as a single evil deed' — so resolve for good is rewarded even without the act, resolve for evil is unpunished and counts as good when left for God's sake, and no evil deed is written except upon doing; resolve outranks a passing thought as a settled purpose approaching firm intention (Jami' al-Ulum wal-Hikam pp. 754–755)."
