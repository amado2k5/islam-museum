id: concept/hamm
class: concept
kind: ethical
label:
  ar: الهم بالعمل
  en: Resolve for an act (hamm)
  es: "Resolución para un acto (hamm)"
  fr: "Résolution pour un acte (hamm)"
  ur: "ایک عمل کے لیے حل کریں (hamm)"
summary:
  ar: "الهم في الحديث السابع والثلاثين من الأربعين — وهو عزم القلب على العمل قبل فعله — مقياس كتابة الأعمال عند الله: «فمن هم بحسنة فلم يعملها كتبها الله عنده حسنة كاملة، وإن هم بها فعملها كتبها عنده عشر حسنات إلى سبعمئة ضعف إلى أضعاف كثيرة، وإن هم بسيئة فلم يعملها كتبها عنده حسنة كاملة، وإن هم بها فعملها كتبها الله سيئة واحدة» — فالهم بالحسنة يُثاب عليه وإن لم يقع الفعل، والهم بالسيئة لا يعاقب عليه بل يكتب حسنة إن تركها لله، ولا تكتب السيئة إلا بالعمل، وفضل الهم على مجرد الخاطر أنه قصد مستقر يشبه الإرادة الجازمة ⁦(جامع العلوم والحكم ص 754–755)⁩."
  en: "The hamm in the thirty-seventh hadith of the Forty — the heart's resolve upon an act before doing it — is the measure by which deeds are written with God: 'whoever resolves on a good deed and does not do it, God writes it down as a complete good deed; if he resolves and does it, ten good deeds to seven hundred times over and more; if he resolves on an evil deed and does not do it, He writes it down as a complete good deed; and if he resolves and does it, God writes it down as a single evil deed' — so resolve for good is rewarded even without the act, resolve for evil is unpunished and counts as good when left for God's sake, and no evil deed is written except upon doing; resolve outranks a passing thought as a settled purpose approaching firm intention (Jami' al-Ulum wal-Hikam pp. 754–755)."
  es: "El hamm en el trigésimo séptimo hadiz de los Cuarenta —la resolución del corazón sobre un acto antes de realizarlo— es la medida por la cual los actos se registran ante Dios: «Quien se propone hacer una buena acción y no la realiza, Dios la registra como una buena acción completa; si se propone y la realiza, diez buenas acciones a setecientas veces o más; si se propone hacer una mala acción y no la realiza, Él la registra como una buena acción completa; y si se propone y la realiza, Dios la registra como una sola mala acción». Así, la resolución para el bien es recompensada incluso sin la acción, la resolución para el mal no es castigada y cuenta como buena cuando se deja por amor a Dios, y ninguna mala acción se registra excepto al realizarla; la resolución supera a un pensamiento pasajero como un propósito establecido que se acerca a la firme intención (Jami' al-Ulum wal-Hikam, págs. 754-755)."
  fr: "Le hamm mentionné dans le trente-septième hadith des Quarante — la résolution du cœur à accomplir un acte — est la mesure par laquelle les actes sont inscrits auprès de Dieu: « Quiconque prend la résolution d'une bonne action et ne l'accomplit pas, Dieu l'inscrit comme une bonne action complète; s'il prend la résolution et l'accomplit, cela équivaut à dix bonnes actions, voire sept cents fois plus; s'il prend la résolution d'une mauvaise action et ne l'accomplit pas, Il l'inscrit comme une bonne action complète; et s'il prend la résolution et l'accomplit, Dieu l'inscrit comme une seule mauvaise action. » Ainsi, la résolution de faire le bien est récompensée même sans l'acte, la résolution de faire le mal n'est pas punie et compte comme une bonne action lorsqu'elle est abandonnée par amour pour Dieu, et aucune mauvaise action n'est inscrite avant d'être accomplie; la résolution surpasse une pensée passagère en tant que but ferme, proche de l'intention déterminée (Jami' al-Ulum wal-Hikam, p. 754-755)."
  ur: "چالیس کی سینتیسویں حدیث میں حمام - کسی عمل کے کرنے سے پہلے دل کا عزم - وہ پیمانہ ہے جس کے ذریعہ خدا کے پاس اعمال لکھے جاتے ہیں: 'جو شخص کسی نیکی کا عزم کرتا ہے اور اسے نہیں کرتا ہے تو خدا اسے مکمل نیکی کے طور پر لکھ دیتا ہے۔ اگر وہ ارادہ کرے اور کرے تو دس نیکیاں سات سو گنا زیادہ۔ اگر وہ کسی برے کام کا ارادہ کرتا ہے اور اسے نہیں کرتا تو وہ اسے مکمل نیکی لکھ دیتا ہے۔ اور اگر وہ ارادہ کرتا ہے اور کرتا ہے تو خدا اسے ایک ہی برائی کے طور پر لکھ دیتا ہے - لہذا نیکی کے لئے عزم عمل کے بغیر بھی بدلہ دیا جاتا ہے، برائی کے لئے عزم ناقابل سزا ہے اور جب خدا کے لئے چھوڑ دیا جائے تو نیکی میں شمار ہوتا ہے، اور کوئی برائی نہیں لکھی جاتی ہے سوائے کرنے کے۔ حل ایک گزرتی ہوئی سوچ کو ایک طے شدہ مقصد تک پہنچنے والے پختہ ارادے کے طور پر آگے بڑھاتا ہے ⁦(جامع العلوم والحکم صفحہ 754-755)⁩۔"
