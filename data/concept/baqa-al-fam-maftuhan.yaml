id: concept/baqa-al-fam-maftuhan
class: concept
kind: scientific
label:
  ar: بقاء الفم مفتوحاً
  en: The mouth staying open
  fr: "Le maintien de la bouche ouverte"
  ur: منہ کا کھلا رہنا
summary:
  ar: الفم يبقى مفتوحاً إما لشدة الحاجة إلى التنفس العظيم أو للالتهاب الملهب أو للضيق والخناق أو لضعف عضل الفم فلا تعمل عملها في النوم وذلك في الأمراض الحادة رديء وأما ألوان اللسان وعند ذكر الأمراض الحادة {cite:canon-ibn-sina-print-v2 p.265}
  en: 'The mouth stays open either from the great need for strong breathing, or for an inflamed inflammation, or for straitness and quinsy, or for weakness of the mouth''s muscles so they do not do their work in sleep — and that in the acute diseases is a bad sign; the tongue''s colours are treated where the acute diseases are told {cite:canon-ibn-sina-print-v2 p.265}'
  fr: "Selon le livre, la bouche reste ouverte par grand besoin de respirer fortement, par inflammation ardente, rétrécissement et angine, ou faiblesse des muscles buccaux, qui ne remplissent pas leur fonction pendant le sommeil ; dans les maladies aiguës, c’est un mauvais signe. Les couleurs de la langue sont traitées dans les chapitres des maladies aiguës {cite:canon-ibn-sina-print-v2 p.265}"
  ur: 'منہ کھلا رہ جاتا ہے یا تو زور دار سانس کی شدید ضرورت سے، یا بھڑکتی ہوئی سوزش سے، یا تنگی اور گھٹن سے، یا منہ کے پٹھوں کی کمزوری سے کہ وہ نیند میں اپنا کام نہیں کرتے — اور یہ حاد امراض میں برا ہے؛ اور زبان کے رنگوں کا ذکر وہاں ہے جہاں حاد امراض بیان ہوتے ہیں {cite:canon-ibn-sina-print-v2 p.265}'
