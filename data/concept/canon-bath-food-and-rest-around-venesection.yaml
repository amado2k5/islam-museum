id: concept/canon-bath-food-and-rest-around-venesection
class: concept
kind: scientific
label:
  ar: "الحمام والغذاء والراحة حول الفصد عند ابن سينا"
  en: "The bath, food and rest around venesection in the Canon"
  fr: "Bain, alimentation et repos autour de la saignée dans le Canon"
  ur: "قانون میں فصد کے گرد حمام، غذا اور آرام"
  es: "El baño, la comida y el descanso en torno a la flebotomía en el Canon"
summary:
  ar: "يوصي ابن سينا بما قبل الفصد وبعده: فالاستحمام قبله يعسر الفصد، وبعده يتدرج المفتصد في الغذاء ولا يرتاض ولا يستحم استحماماً محللاً، ويبين ما يفعل إذا ورمت اليد بعد الفصد {cite:canon-ibn-sina-print-v1 p.293}."
  en: "Ibn Sina advises what comes before and after bleeding: a bath before it makes the bleeding hard, and after it the one bled moves up gradually in food, takes no exercise and no dissolving bath, and he says what is done if the arm swells after the bleeding {cite:canon-ibn-sina-print-v1 p.293}."
  fr: "Ibn Sina décrit les soins autour de la saignée : le bain préalable pourrait la rendre difficile ; ensuite, il conseille progression alimentaire, absence d’exercice et de bain résolutif. Il traite aussi du bras gonflé après saignée {cite:canon-ibn-sina-print-v1 p.293}."
  es: "Ibn Sina aconseja qué hacer antes y después de la hemorragia: un baño antes de la misma dificulta la hemorragia, y después de ella la persona que ha sufrido la hemorragia aumenta gradualmente la ingesta de alimentos, no realiza ejercicio ni baños disolvientes, y dice qué hacer si el brazo se hincha después de la hemorragia {cite:canon-ibn-sina-print-v1 p.293}."
  ur: "ابن سینا نصیحت کرتے ہیں کہ خون آنے سے پہلے اور بعد میں کیا آتا ہے: خون آنے سے پہلے غسل سخت کرتا ہے، اور اس کے بعد خون بہنے والا کھانے میں آہستہ آہستہ بڑھتا ہے، نہ ورزش کرتا ہے اور نہ گھلنے والا غسل کرتا ہے، اور وہ کہتے ہیں کہ خون نکلنے کے بعد اگر بازو سوج جائے تو کیا کیا جائے؟"
