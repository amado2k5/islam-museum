label:
  ar: "العُرْيان"
  en: "The naked person and the rules of bathing, prayer and tawaf (uryan)"
  ur: "عریان"
summary:
  ar: "العريان في اللغة المتجرد من ثيابه، وهو خلاف اللبس، ولا يختلف معناه في الاصطلاح عن اللغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. والاغتسال عرياناً بين الناس محرم عند جميع الفقهاء، فإن خلا فيجوز مع الكراهة، ويستحب التستر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575}. ودخول الحمام مشروع عند جمهور الفقهاء بشرط ألا يكون فيه كشف العورة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576}. وستر العورة شرط لصحة الصلاة عند جمهور الفقهاء، فإن عجز المصلي عن الستر صلى عرياناً، وكيفية صلاته مختلف فيها بين المذاهب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11577}. وفي الإعادة إذا وجد الساتر بعد الصلاة قولان للفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}. وستر العورة واجب في الطواف، فلا يصح الطواف عرياناً مع القدرة على الستر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}."
  en: "In the lexicon, a naked person (uryan) is one stripped of clothing, the opposite of dressing, and the technical sense does not differ from this {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. Bathing naked in front of people is forbidden according to all jurists; when alone it is permitted but disliked, and covering oneself is recommended even then {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575}. Entering a bathhouse is permitted according to the majority, provided no part of the body that must be covered is exposed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576}. Covering the private parts is a condition for a valid prayer according to the majority; one who cannot cover himself prays naked, and the manner of his prayer differs between the schools {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11577}. Whether one who prayed naked must repeat the prayer after finding a covering is disputed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}. Covering is also required for tawaf, so a naked person able to cover himself may not validly circumambulate {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}."
