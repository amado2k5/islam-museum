id: concept/uryan
class: concept
kind: legal
label:
  ar: "العُرْيان"
  en: "The naked person and the rules of bathing, prayer and tawaf (uryan)"
  ur: "عریان"
  es: "La persona desnuda y las reglas del baño, la oración y el tawaf (uryan)."
  fr: "La personne nue et les règles du bain, de la prière et du tawaf (uryan)"
  tr: "Al, Aryan"
  id: "Al, Arya"
summary:
  ar: "العريان في اللغة المتجرد من ثيابه، وهو خلاف اللبس، ولا يختلف معناه في الاصطلاح عن اللغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. والاغتسال عرياناً بين الناس محرم عند جميع الفقهاء، فإن خلا فيجوز مع الكراهة، ويستحب التستر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575}. ودخول الحمام مشروع عند جمهور الفقهاء بشرط ألا يكون فيه كشف العورة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576}. وستر العورة شرط لصحة الصلاة عند جمهور الفقهاء، فإن عجز المصلي عن الستر صلى عرياناً، وكيفية صلاته مختلف فيها بين المذاهب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11577}. وفي الإعادة إذا وجد الساتر بعد الصلاة قولان للفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}. وستر العورة واجب في الطواف، فلا يصح الطواف عرياناً مع القدرة على الستر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}."
  en: "In the lexicon, a naked person (uryan) is one stripped of clothing, the opposite of dressing, and the technical sense does not differ from this {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. Bathing naked in front of people is forbidden according to all jurists; when alone it is permitted but disliked, and covering oneself is recommended even then {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575}. Entering a bathhouse is permitted according to the majority, provided no part of the body that must be covered is exposed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576}. Covering the private parts is a condition for a valid prayer according to the majority; one who cannot cover himself prays naked, and the manner of his prayer differs between the schools {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11577}. Whether one who prayed naked must repeat the prayer after finding a covering is disputed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}. Covering is also required for tawaf, so a naked person able to cover himself may not validly circumambulate {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}."
  es: "En el léxico, una persona desnuda (uryan) es aquella despojada de ropa, lo opuesto a vestirse, y el sentido técnico no difiere de este {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. Bañarse desnudo frente a la gente está prohibido según todos los juristas; cuando está solo está permitido pero no es recomendable, y cubrirse es aconsejable incluso entonces {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575}. Entrar en una casa de baños está permitido según la mayoría, siempre que no se exponga ninguna parte del cuerpo que deba cubrirse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576}. Cubrir las partes íntimas es una condición para una oración válida según la mayoría; Quien no puede cubrirse reza desnudo, y la forma de su oración difiere entre las escuelas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11577}. Si quien rezó desnudo debe repetir la oración después de encontrar una cobertura es un tema controvertido {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}. La cobertura también es necesaria para el tawaf, por lo que una persona desnuda que pueda cubrirse no puede circunvalar válidamente {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}."
  fr: "Dans le lexique, une personne nue (uryan) est une personne dévêtue, l'opposé de celle qui s'habille, et le sens technique ne diffère pas de cette définition {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11574}. Se baigner nu en public est interdit selon tous les juristes; lorsqu'on est seul, cela est permis mais déconseillé, et il est recommandé de se couvrir même dans ce cas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575}. Entrer dans un bain public est permis selon la majorité, à condition qu'aucune partie du corps devant être couverte ne soit exposée {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576}. Couvrir ses parties intimes est une condition de validité de la prière selon la majorité. Celui qui ne peut se couvrir prie nu, et la manière d'accomplir sa prière diffère selon les écoles {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11577}. La question de savoir si celui qui a prié nu doit répéter la prière après avoir trouvé un vêtement est controversée {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}. Le port d'un vêtement est également requis pour le tawaf; par conséquent, une personne nue capable de se couvrir ne peut pas effectuer la circumambulation de manière valide {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11578}."
  ur: "لغت میں، ایک برہنہ شخص ⁦(اوریان)⁩ لباس کا ایک چھینا ہوا ہے، جو لباس پہننے کے برعکس ہے، اور تکنیکی معنوں میں اس سے کوئی فرق نہیں ہے {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 11574}۔ لوگوں کے سامنے برہنہ نہانا تمام فقہاء کے نزدیک حرام ہے۔ جب اکیلے اس کی اجازت ہے لیکن ناپسندیدہ ہے، اور اپنے آپ کو ڈھانپنے کی سفارش کی جاتی ہے تب بھی {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11575}۔ جمہور کے مطابق حمام میں داخل ہونے کی اجازت ہے، بشرطیکہ جسم کا کوئی حصہ جس کو ڈھانپنا ضروری نہ ہو {حوالہ:فقہ الموسوعۃ کویتیہ نور-v3 ص11575} جمہور کے نزدیک صحیح نماز کے لیے شرمگاہ کو چھپانا شرط ہے۔ جو شخص اپنے آپ کو ڈھانپ نہیں سکتا وہ برہنہ حالت میں نماز پڑھتا ہے، اور اس کی نماز کا طریقہ مکاتب فکر کے درمیان مختلف ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص11577}۔ برہنہ حالت میں نماز پڑھنے والے کو چادر ملنے کے بعد نماز دوبارہ پڑھنی چاہیے یا نہیں اس میں اختلاف ہے {حوالہ: فقہ معسوۃ کویتیہ نور-v3 ص11578}۔ طواف کے لیے پردہ کرنا بھی ضروری ہے، لہٰذا ایک برہنہ شخص جو اپنے آپ کو ڈھانپ سکتا ہے وہ صحیح طور پر طواف نہیں کر سکتا۔"
  tr: "Dilde çıplak, kıyafetleri soyulmuş olan kişidir; bu karışıklıktan farklıdır ve terminoloji anlamı dilden farklı değildir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11574}. İnsanlar arasında çıplak yıkanmak tüm hukukçulara göre yasaktır; eğer yıkanırsa, hoşlanmazlıkla kabul edilir ve {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11575} kaplanması önerilir. Çoğu hukukçuya göre tuvalete girmek, özel bölgelerin açılmasını gerektirmediği sürece izin verilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11576}. Çoğu hukukçuya göre 'awrah'ın örtülmesi, duanın geçerliliği için bir koşuldur. Eğer ibadet eden kişi kendini örtemezse, çıplak dua eder. Dua biçimi düşünce okulları arasında farklılık gösterir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11577}. Tekrar konusunda, namazdan sonra örtü bulunursa, hukukçular arasında iki görüş vardır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11578}. Tavaf sırasında özel bölgelerin örtülmesi zorunludur, bu yüzden çıplak tawaf geçerli değildir, eğer kapatılabiliyorsa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11578}."
  id: "Yang telanjang dalam bahasa adalah yang dilucuti pakaiannya, yang berbeda dengan kebingungan, dan maknanya dalam istilah tidak berbeda dari bahasa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11574}. Mandi telanjang di antara orang dilarang menurut semua ahli hukum; jika dibuka, diperbolehkan dengan ketidaksukaan, dan disarankan untuk menutupi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11575}. Masuk ke kamar mandi diperbolehkan menurut mayoritas ahli hukum, asalkan tidak melibatkan membuka bagian pribadi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11575} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11576}. Menutupi 'awrah adalah syarat keabsahan doa menurut mayoritas ahli hukum. Jika penyembah tidak dapat menutupi dirinya, ia berdoa telanjang. Cara berdoa berbeda di antara aliran pemikiran {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11577}. Mengenai pengulangan, jika ditemukan penutup setelah shalat, ada dua pendapat di antara para ahli hukum {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11578}. Menutupi bagian pribadi wajib selama Taaf, jadi tawaf telanjang tidak sah jika seseorang mampu menutupi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11578}."
