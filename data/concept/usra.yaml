label:
  ar: "الأسرة المسلمة"
  en: "The Muslim family"
  ur: "مسلمان خاندان"
summary:
  ar: "الأسرة في الإسلام نواة المجتمع، تبدأ بعقد النكاح وتنمو بالأولاد والذرية، ويجمعها السكنى والمودة والرحمة وحقوق متبادلة بين الزوجين والوالدين والأولاد. جعل الله الزوجة سكنا لزوجها وجعل بينهما مودة ورحمة، وأحاط الولادة والرضاعة والحضانة والنفقة بأحكام تبني البيت وتصونه."
  en: "The family in Islam is the nucleus of society: it begins with the marriage contract and grows with children and descendants, bound together by dwelling together, affection, mercy and mutual rights between spouses, parents and children. God made the wife a repose for her husband and set affection and mercy between them, and surrounded birth, nursing, custody and maintenance with rulings that build and guard the home."
  ur: "اسلام میں خاندان معاشرے کا مرکز ہے: نکاح کے عقد سے شروع ہوکر اولاد اور نسل کے ساتھ بڑھتا ہے، اور سکون، مودت، رحمت اور میاں بیوی، والدین اور اولاد کے باہمی حقوق سے بندھا ہے۔"
