class: concept
kind: social
label:
  ar: "الأسرة المسلمة"
  en: "The Muslim family"
  ur: "مسلمان خاندان"
  es: "La familia musulmana"
  fr: "La famille musulmane"
summary:
  ar: "الأسرة في الإسلام نواة المجتمع، تبدأ بعقد النكاح وتنمو بالأولاد والذرية، ويجمعها السكنى والمودة والرحمة وحقوق متبادلة بين الزوجين والوالدين والأولاد. جعل الله الزوجة سكنا لزوجها وجعل بينهما مودة ورحمة، وأحاط الولادة والرضاعة والحضانة والنفقة بأحكام تبني البيت وتصونه."
  en: "The family in Islam is the nucleus of society: it begins with the marriage contract and grows with children and descendants, bound together by dwelling together, affection, mercy and mutual rights between spouses, parents and children. God made the wife a repose for her husband and set affection and mercy between them, and surrounded birth, nursing, custody and maintenance with rulings that build and guard the home."
  ur: "اسلام میں خاندان معاشرے کا مرکز ہے: نکاح کے عقد سے شروع ہوکر اولاد اور نسل کے ساتھ بڑھتا ہے، اور سکون، مودت، رحمت اور میاں بیوی، والدین اور اولاد کے باہمی حقوق سے بندھا ہے۔"
  es: "En el Islam, la familia es el núcleo de la sociedad: comienza con el contrato matrimonial y crece con los hijos y descendientes, unidos por la convivencia, el afecto, la misericordia y los derechos mutuos entre cónyuges, padres e hijos. Dios hizo de la esposa un refugio para su esposo, estableció entre ellos el afecto y la misericordia, y rodeó el nacimiento, la crianza, la custodia y el sustento con normas que edifican y protegen el hogar."
  fr: "En Islam, la famille est le noyau de la société: elle prend naissance avec le mariage et s’étend à travers les enfants et la descendance, unis par la vie commune, l’affection, la miséricorde et les droits mutuels entre époux, parents et enfants. Dieu a fait de l’épouse un refuge pour son mari et a instauré entre eux affection et miséricorde. Il a également établi des règles concernant la naissance, l’allaitement, la garde et l’entretien des enfants, règles qui contribuent à bâtir et à protéger le foyer."
