label: { ar: "الحياء", en: "Haya (modesty)", ur: "حیاء" }
summary:
  ar: "الحياء لغة تغير وانكسار يعتري الإنسان من خوف ما يعاب به، وشرعا خلق يبعث على اجتناب القبيح من الأفعال والأقوال، ويمنع من التقصير في حق ذي الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} ويفرق المدخل بينه وبين الخجل والبذاءة والوقاحة، فالخجل ظهور في الوجه لغم يلحق القلب، والحياء ارتداع بقوة الحياء، والبذاءة فحش في الكلام، والوقاحة قلة الحياء والجرأة على القبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} ومن الأحاديث: الحياء من الإيمان، وما كان الحياء في شيء إلا زانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} ويتصل المدخل بأحكام الحياء في الشرع، ولم يكتمل في هذه الصفحات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427}  وقد جاء في الحياء أنه من أعظم خصال الإيمان وأن الإيمان بضع وسبعون شعبة والحياء منها، وأنه لا يأتي إلا بخير، وأن الحياء من الله حق الحياء بحفظ الرأس والبطن وتذكر الموت؛ وأن الحياء الذي لا يمنع من تعلم الدين ليس حياء شرعيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} والحياء من مواجهة الظلمة والفساق وترك الأمر بالمعروف عجز ومهانة وليس حياء، وأخذ مال الغير بالحياء كالسؤال في الملأ يجعله كالمغصوب يجب رده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431}"
  en: "Haya (modesty) is lexically a change and recoil that comes upon a person from fear of what would bring blame; in the law it is a quality that moves a person away from ugly acts and words and prevents negligence toward one with a right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} The article separates it from khajal (shame showing in the face), from badhaa (foul speech), and from waqaha (brazenness). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} Among the sayings: modesty is part of faith, and modesty adorns whatever it is in. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} The article goes on to the rulings on modesty and is not complete on these pages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427}  The sayings on modesty make it a branch of faith, a thing that brings only good, a form of duty toward God who must be guarded in head and belly and remembering death; modesty that keeps one from learning religion is not legal modesty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} Modesty before wrongdoers and not commanding right is weakness, not modesty; a sum taken from another only out of modesty is like usurped property and must be returned. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431}"
  ur: "حیاء لغت میں اس تغیر اور انکسار کو کہتے ہیں جو کسی ملامت کے خوف سے انسان پر طاری ہو، اور شرع میں وہ خلق ہے جو برے افعال و اقوال سے بچاتا ہے اور صاحبِ حق کے حق میں کوتاہی سے روکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} مدخل اسے خجل، بذاءت اور وقاحت سے ممیز کرتا ہے: خجل چہرے پر ظاہر ہونے والا غم ہے، حیاء برائی سے رک جانا ہے، بذاءت فحش گوئی، اور وقاحت حیاء کی کمی اور برائی پر جرأت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} ایک حدیث میں ہے کہ حیاء ایمان کا حصہ ہے، اور جو چیز حیاء سے آراستہ ہو وہ اسے زینت دیتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} مدخل حیاء کے احکام پر آگے بڑھتا ہے اور ان صفحات میں مکمل نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427}  حیاء کے بارے میں احادیث میں اسے ایمان کی شاخ بتایا گیا ہے، وہ صرف خیر لاتا ہے، اور اللہ سے حیاء یہ ہے کہ سر اور پیٹ کی حفاظت کی جائے اور موت کو یاد رکھا جائے؛ جو حیاء دین سیکھنے میں رکاوٹ بنے وہ شرعی حیاء نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} ظالموں اور فاسقوں کے سامنے حیاء کی بنا پر امر بالمعروف چھوڑنا عجز ہے نہ کہ حیاء، اور حیاء کی وجہ سے کسی کا مال لینا غصب کی طرح ہے جسے لوٹانا لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431}"
