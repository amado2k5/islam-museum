label: { ar: "الحياء", en: "Haya (modesty)", ur: "حیاء", es: "Alquiler (modestia)", fr: "Loyer (modestie)", tr: "alçakgönüllülük", id: "kesopanan" }
summary:
  ar: "الحياء لغة تغير وانكسار يعتري الإنسان من خوف ما يعاب به، وشرعا خلق يبعث على اجتناب القبيح من الأفعال والأقوال، ويمنع من التقصير في حق ذي الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} ويفرق المدخل بينه وبين الخجل والبذاءة والوقاحة، فالخجل ظهور في الوجه لغم يلحق القلب، والحياء ارتداع بقوة الحياء، والبذاءة فحش في الكلام، والوقاحة قلة الحياء والجرأة على القبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} ومن الأحاديث: الحياء من الإيمان، وما كان الحياء في شيء إلا زانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} ويتصل المدخل بأحكام الحياء في الشرع، ولم يكتمل في هذه الصفحات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427}  وقد جاء في الحياء أنه من أعظم خصال الإيمان وأن الإيمان بضع وسبعون شعبة والحياء منها، وأنه لا يأتي إلا بخير، وأن الحياء من الله حق الحياء بحفظ الرأس والبطن وتذكر الموت؛ وأن الحياء الذي لا يمنع من تعلم الدين ليس حياء شرعيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} والحياء من مواجهة الظلمة والفساق وترك الأمر بالمعروف عجز ومهانة وليس حياء، وأخذ مال الغير بالحياء كالسؤال في الملأ يجعله كالمغصوب يجب رده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431}"
  en: "Haya (modesty) is lexically a change and recoil that comes upon a person from fear of what would bring blame; in the law it is a quality that moves a person away from ugly acts and words and prevents negligence toward one with a right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} The article separates it from khajal (shame showing in the face), from badhaa (foul speech), and from waqaha (brazenness). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} Among the sayings: modesty is part of faith, and modesty adorns whatever it is in. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} The article goes on to the rulings on modesty and is not complete on these pages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427}  The sayings on modesty make it a branch of faith, a thing that brings only good, a form of duty toward God who must be guarded in head and belly and remembering death; modesty that keeps one from learning religion is not legal modesty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} Modesty before wrongdoers and not commanding right is weakness, not modesty; a sum taken from another only out of modesty is like usurped property and must be returned. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431}"
  ur: "حیاء لغت میں اس تغیر اور انکسار کو کہتے ہیں جو کسی ملامت کے خوف سے انسان پر طاری ہو، اور شرع میں وہ خلق ہے جو برے افعال و اقوال سے بچاتا ہے اور صاحبِ حق کے حق میں کوتاہی سے روکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} مدخل اسے خجل، بذاءت اور وقاحت سے ممیز کرتا ہے: خجل چہرے پر ظاہر ہونے والا غم ہے، حیاء برائی سے رک جانا ہے، بذاءت فحش گوئی، اور وقاحت حیاء کی کمی اور برائی پر جرأت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} ایک حدیث میں ہے کہ حیاء ایمان کا حصہ ہے، اور جو چیز حیاء سے آراستہ ہو وہ اسے زینت دیتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} مدخل حیاء کے احکام پر آگے بڑھتا ہے اور ان صفحات میں مکمل نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427}  حیاء کے بارے میں احادیث میں اسے ایمان کی شاخ بتایا گیا ہے، وہ صرف خیر لاتا ہے، اور اللہ سے حیاء یہ ہے کہ سر اور پیٹ کی حفاظت کی جائے اور موت کو یاد رکھا جائے؛ جو حیاء دین سیکھنے میں رکاوٹ بنے وہ شرعی حیاء نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} ظالموں اور فاسقوں کے سامنے حیاء کی بنا پر امر بالمعروف چھوڑنا عجز ہے نہ کہ حیاء، اور حیاء کی وجہ سے کسی کا مال لینا غصب کی طرح ہے جسے لوٹانا لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431}"
  es: "Haya (modestia) es léxicamente un cambio y un retroceso que le sobreviene a una persona por temor a lo que le acarrearía culpa; en la ley es una cualidad que aleja a una persona de actos y palabras desagradables y previene la negligencia hacia quien tiene derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} El artículo la separa de khajal (vergüenza que se muestra en el rostro), de badhaa (lenguaje soez) y de waqaha (descaro). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} Entre los dichos: la modestia es parte de la fe, y la modestia adorna todo lo que contiene. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} El artículo continúa con las normas sobre la modestia y no está completo en estas páginas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} Los dichos sobre la modestia la hacen una rama de la fe, algo que solo trae bien, una forma de deber hacia Dios que debe ser guardado en la cabeza y el estómago y recordando la muerte; la modestia que impide aprender la religión no es modestia legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} La modestia ante los malhechores y no imponer el bien es debilidad, no modestia; una suma tomada a otro sólo por modestia es como propiedad usurpada y debe ser devuelta. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431}"
  fr: "Haya (modestie) désigne le sens littéral de changement et de recul ressentis par une personne par crainte d'être blâmée; en droit, c'est une qualité qui éloigne une personne des actes et des paroles déplaisants et qui prévient la négligence envers autrui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} L'article la distingue de khajal (honte apparente), de badhaa (paroles indécentes) et de waqaha (impudence). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} Parmi les hadiths: la pudeur fait partie de la foi et embellit tout ce qu’elle contient. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} L’article aborde ensuite les règles relatives à la pudeur et n’est pas exhaustif sur ces pages. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7427} Les hadiths sur la pudeur en font une branche de la foi, une chose qui n’apporte que du bien, une forme de devoir envers Dieu, dont il faut se préserver corps et âme, en gardant à l’esprit la mort; la pudeur qui empêche d’apprendre la religion n’est pas une pudeur licite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} La modestie devant les malfaiteurs et le fait de ne pas commander le bien est une faiblesse, pas une modestie; une somme prise à un autre par simple modestie est comme un bien usurpé et doit être restituée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7431}"
  tr: "Alçakgönüllülük, kişiyi suçlanma korkusuyla etkileyen değişim ve kırılmışlık dilidir ve çirkin davranışlardan ve sözlerden kaçınmayı teşvik eden, gerçek sahibine karşı ihmalkarlığı önleyen dini bir özelliktir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7427} Giriş, utangaçlık, müstehcenlik ve kabalıktan ayırır. Utangaçlık, kalbi delen görünür bir yüzdür, alçakgönüllülük alçakgönüllülüğün gücüyle caydırıcıdır, kaba olmak ise konuşmada müstehcenliktir, kabalık ise çirkinlik karşısında alçakgönüllülük ve cesaretsizliktir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7427} Ve hadislerden: Alçakgönüllülük inancın bir parçasıdır ve alçakgönüllülük sadece güzelleştirilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7427} Giriş Şeriat'taki tevazu hükümleriyle ilgilidir, ancak bu sayfalarda tam değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7427} Modesty'de belirtilir ki, inancın en büyük niteliklerinden biri olduğu, inancın yetmişten fazla dalı olduğu, alçakgönüllülüğün sadece iyilikle geldiği, alçakgönüllülüğün Tanrı'nın başı ve midesi koruma ve ölümü hatırlama hakkı olduğu; ve dini öğrenmeyi engellemeyen alçakgönüllülüğün meşru bir tevazu olmadığı belirtilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7430} Karanlık ve ahlaksızlıkla yüzleşmede alçakgönüllülük ve iyiliği emretmeyi ihmal etmek, alçakgönüllülük değil, yetersizlik ve aşağılanmadır. Başkalarının malını alçakgönüllülükle almak, mesela kamuya açık bir şekilde sormak gibi, onu geri alınması gereken gasp edilmiş biri yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7431}"
  id: "Kerendahan hati adalah bahasa perubahan dan kehancuran yang membuat seseorang takut disalahkan, serta sifat religius yang mendorong menghindari tindakan dan kata-kata buruk serta mencegah kelalaian terhadap pemilik yang sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7427} Pendahuluan membedakannya dari rasa malu, kecacatan, dan kasar. Rasa malu adalah wajah yang terlihat yang menusuk hati, kesopanan adalah penghalang oleh kekuatan kesopanan, kekasaran adalah kekotoran dalam ucapan, dan kasar adalah kurangnya kesopanan dan keberanian di hadapan keburukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7426} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7427} Dan dari hadits: Kerendahan hati adalah bagian dari iman, dan kerendahan hati tidak berarti apa-apa kecuali bahwa ia diperindah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7427} Entri ini berkaitan dengan aturan kesopanan dalam Syariah, tetapi tidak lengkap di halaman-halaman ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7427} Disebutkan dalam Modesty bahwa salah satu kualitas terbesar iman, bahwa iman memiliki lebih dari tujuh puluh cabang, dan kerendahan hati di antara mereka hanya datang dengan kebaikan, dan kerendahan hati adalah hak dari Tuhan untuk melindungi kepala dan perut serta mengingat kematian; dan kerendahan hati yang tidak menghalangi belajar agama bukanlah kerendahan hati yang sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7428} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7429} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7430} Kerendahan hati dalam menghadapi kegelapan dan kebejatan, dan mengabaikan kebaikan adalah ketidakmampuan dan penghinaan, bukan kerendahan hati. Mengambil harta orang lain dengan rendah hati, seperti meminta di depan umum, membuatnya seperti orang yang direbut yang harus dikembalikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7430} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7431}"
