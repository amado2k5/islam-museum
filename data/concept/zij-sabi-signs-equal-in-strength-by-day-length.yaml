label: { ar: "البروج المتساوية في القوة بتساوي زيادة النهار", en: "Signs equal in strength by equal growth of the day", ur: "دن کی یکساں زیادتی سے بروج کی مساوی قوت" }
summary:
  ar: "الأجزاء التي بُعدها عن نقطتي الانقلاب بُعد واحد تتاوى في القوة، لأن نهار كل واحد منها مساو لنهار الآخر. فعشرة أجزاء من السرطان تساوي في القوة عشرين جزءاً من الجوزاء، وعشرة من الحمل تساوي عشرين من الحوت، وخمسة من القوس وخمسة وعشرون من الجدي متساويان ايضاً، وكذلك كوكبان يبعدان عن نقطتي الانقلاب بالبعد نفسه. {cite:zij-sabi-nallino-byblion pp.199-200}"
  en: "Parts equidistant from the two solstice points are equal in strength, because the length of the day at each is the same. Ten parts of Cancer equal twenty parts of Gemini; ten of Aries equal twenty of Pisces; five of Sagittarius and twenty-five of Capricorn are likewise equal; and two bodies at the same distance from the solstices are equal. {cite:zij-sabi-nallino-byblion pp.199-200}"
  ur: "جو اجزا انقلاب کے دو نقطوں سے یکساں فاصلے پر ہوں وہ قوت میں مساوی ہیں، کیونکہ ان میں سے ہر ایک کا دن دوسرے کے دن کے برابر ہے۔ سرطان کے دس اجزا جوزا کے بیس اجزا کے برابر ہیں؛ حمل کے دس حوت کے بیس کے برابر؛ قوس کے پانچ اور جدی کے پچیس بھی مساوی ہیں، اور اسی طرح دو ستارے جو انقلاب سے یکساں فاصلے پر ہوں۔ {cite:zij-sabi-nallino-byblion pp.199-200}"
