id: concept/medieval-european-polemic-on-islam
class: concept
kind: term
label: { ar: "الطعون الأوروبية القديمة في الإسلام والنبي", en: "Early European polemic against Islam and the Prophet" }
issue:
  ar: "كيف تعامل الكتّاب الأوروبيون مع الإسلام والنبي في القرون الوسطى والقرون التالية؟"
summary:
  ar: "يعرض غلاب في الفصل الثاني من كتابه نماذج من الكتابات الأوروبية القديمة التي وصفها بالتحامل والجهل، منها قصيدة «رولان» التي تزعم أن المسلمين يعبدون ثالوثاً من محمد وأبولون وتيرفاجان، وقصيدة «أورشليم» التي تصف تمثالاً ذهبياً للنبي على فيل، ورواية تُجيز تعدد الأزواج للمرأة {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 37} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 38} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 39}. ويذكر أن بعض علماء القرون التالية، مثل باسكال ومونتسكيو وفولتير ورينان وكازانوفا ودرمنغهم، وقعوا في أخطاء في حق الإسلام {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}، ويرى أن فولتير اتخذ النبي ستاراً لمهاجمة مؤسسي الأديان جميعاً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 41}. ويقرر غلاب أن الدراسة الجادة لنصوص الإسلام بدأت في القرن التاسع عشر {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 34}. هذه أحكام غلاب ونقله، ويُنسب كل حكم إليه."
perspectives:
  - tradition: sunni
    id: ghallab-on-polemic
    stance:
      ar: "الطعون القديمة قامت على الجهل أو الهوى، والمنهج العلمي الحديث أنصف الإسلام في الجملة"
    summary:
      ar: "هذا موقف غلاب كما يعرضه في كتابه {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 34} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 36}. يمزج الكتاب هذا النقد بعرض أقوال غربية تقرّ بسوء الفهم في القديم، وهي تُنسب إلى أصحابها."
