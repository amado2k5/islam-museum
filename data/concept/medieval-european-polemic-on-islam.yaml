id: concept/medieval-european-polemic-on-islam
class: concept
kind: term
label: { ar: "الطعون الأوروبية القديمة في الإسلام والنبي", en: "Early European polemic against Islam and the Prophet" }
issue:
  ar: "كيف تعامل الكتّاب الأوروبيون مع الإسلام والنبي في القرون الوسطى والقرون التالية؟"
summary:
  ar: "يعرض غلاب في الفصل الثاني من كتابه نماذج من الكتابات الأوروبية القديمة التي وصفها بالتحامل والجهل، منها قصيدة «رولان» التي تزعم أن المسلمين يعبدون ثالوثاً من محمد وأبولون وتيرفاجان، وقصيدة «أورشليم» التي تصف تمثالاً ذهبياً للنبي على فيل، ورواية تُجيز تعدد الأزواج للمرأة {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 37} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 38} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 39}. ويذكر أن بعض علماء القرون التالية، مثل باسكال ومونتسكيو وفولتير ورينان وكازانوفا ودرمنغهم، وقعوا في أخطاء في حق الإسلام {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}، ويرى أن فولتير اتخذ النبي ستاراً لمهاجمة مؤسسي الأديان جميعاً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 41}. ويقرر غلاب أن الدراسة الجادة لنصوص الإسلام بدأت في القرن التاسع عشر {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 34}. هذه أحكام غلاب ونقله، ويُنسب كل حكم إليه."
  en: "In the second chapter of his book, Ghallab presents examples of early European writings that he describes as biased and ignorant: the poem “Roland”, which claims that Muslims worship a trinity of Muhammad, Apollo and Termagant; the poem “Jerusalem”, which describes a golden statue of the Prophet on an elephant; and a narrative that permits a woman to have several husbands {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 37} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 38} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 39}. He notes that some scholars of later centuries, such as Pascal, Montesquieu, Voltaire, Renan, Casanova and Dermenghem, made errors concerning Islam {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}, and he holds that Voltaire used the Prophet as a cover for attacking the founders of all religions {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 41}. Ghallab states that serious study of the texts of Islam began in the nineteenth century {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 34}. These are Ghallab's judgements and his reporting, and each judgement is attributed to him."
