id: concept/medieval-european-polemic-on-islam
class: concept
kind: term
label: { ar: "الطعون الأوروبية القديمة في الإسلام والنبي", en: "Early European polemic against Islam and the Prophet", es: "Polémica europea temprana contra el Islam y el Profeta", fr: "Polémiques européennes des débuts contre l'islam et le Prophète", ur: "اسلام اور پیغمبر اسلام کے خلاف ابتدائی یورپی پولیمک" }
issue:
  ar: "كيف تعامل الكتّاب الأوروبيون مع الإسلام والنبي في القرون الوسطى والقرون التالية؟"
summary:
  ar: "يعرض غلاب في الفصل الثاني من كتابه نماذج من الكتابات الأوروبية القديمة التي وصفها بالتحامل والجهل، منها قصيدة «رولان» التي تزعم أن المسلمين يعبدون ثالوثاً من محمد وأبولون وتيرفاجان، وقصيدة «أورشليم» التي تصف تمثالاً ذهبياً للنبي على فيل، ورواية تُجيز تعدد الأزواج للمرأة {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 37} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 38} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 39}. ويذكر أن بعض علماء القرون التالية، مثل باسكال ومونتسكيو وفولتير ورينان وكازانوفا ودرمنغهم، وقعوا في أخطاء في حق الإسلام {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}، ويرى أن فولتير اتخذ النبي ستاراً لمهاجمة مؤسسي الأديان جميعاً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 41}. ويقرر غلاب أن الدراسة الجادة لنصوص الإسلام بدأت في القرن التاسع عشر {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 34}. هذه أحكام غلاب ونقله، ويُنسب كل حكم إليه."
  en: "In the second chapter of his book, Ghallab presents examples of early European writings that he describes as biased and ignorant: the poem “Roland”, which claims that Muslims worship a trinity of Muhammad, Apollo and Termagant; the poem “Jerusalem”, which describes a golden statue of the Prophet on an elephant; and a narrative that permits a woman to have several husbands {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 37} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 38} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 39}. He notes that some scholars of later centuries, such as Pascal, Montesquieu, Voltaire, Renan, Casanova and Dermenghem, made errors concerning Islam {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40}, and he holds that Voltaire used the Prophet as a cover for attacking the founders of all religions {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 40} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 41}. Ghallab states that serious study of the texts of Islam began in the nineteenth century {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 34}. These are Ghallab's judgements and his reporting, and each judgement is attributed to him."
  es: "En el segundo capítulo de su libro, Ghallab presenta ejemplos de escritos europeos antiguos que describe como parciales e ignorantes: el poema “Roland”, que afirma que los musulmanes adoran una trinidad de Mahoma, Apolo y Termagante; el poema “Jerusalén”, que describe una estatua dorada del Profeta sobre un elefante; y una narración que permite a una mujer tener varios maridos {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 37} {cite: al-islam-kama-yarahu-al-urubiyyun-azhar p. 38} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 39}. Señala que algunos eruditos de siglos posteriores, como Pascal, Montesquieu, Voltaire, Renan, Casanova y Dermenghem, cometieron errores con respecto al Islam. 40}, y sostiene que Voltaire utilizó al Profeta como tapadera para atacar a los fundadores de todas las religiones. 40} {citar: al-islam-kama-yarahu-al-urubiyyun-azhar p. 41}. Ghallab afirma que el estudio serio de los textos del Islam comenzó en el siglo XIX. 34}. Estos son los juicios y los informes de Ghallab, y cada juicio le es atribuido."
  fr: "Dans le deuxième chapitre de son ouvrage, Ghallab présente des exemples d'écrits européens anciens qu'il qualifie de partiaux et d'ignorants: le poème « Roland », qui affirme que les musulmans vénèrent une trinité composée de Mahomet, d'Apollon et de Termagant; le poème « Jérusalem », qui décrit une statue dorée du Prophète sur un éléphant; et un récit autorisant une femme à avoir plusieurs maris (voir: al-islam-kama-yarahu-al-urubiyyun-azhar, p. 37, 38 et 39). Il note que certains érudits des siècles suivants, tels que Pascal, Montesquieu, Voltaire, Renan, Casanova et Dermenghem, ont commis des erreurs concernant l'islam (voir: al-islam-kama-yarahu-al-urubiyyun-azhar, p. 40), et il soutient que Voltaire a instrumentalisé le Prophète pour s'en prendre aux fondateurs de toutes les religions. 40} {cite: al-islam-kama-yarahu-al-urubiyyun-azhar p. 41}. Ghallab affirme qu'une étude sérieuse des textes de l'Islam a commencé au XIXe siècle. 34}. Ce sont les jugements de Ghallab et ses rapports, et chaque jugement lui est attribué."
  ur: "اپنی کتاب کے دوسرے باب میں، غالب نے ابتدائی یورپی تحریروں کی مثالیں پیش کی ہیں جنہیں وہ متعصب اور جاہل قرار دیتے ہیں: نظم \"رولینڈ\"، جس میں یہ دعویٰ کیا گیا ہے کہ مسلمان محمد، اپالو اور ترمگینٹ کی تثلیث کی عبادت کرتے ہیں۔ نظم \"یروشلم\"، جس میں ہاتھی پر نبی کے سونے کے مجسمے کو بیان کیا گیا ہے۔ اور ایک روایت جو ایک عورت کو کئی شوہر رکھنے کی اجازت دیتی ہے {حوالہ: الاسلام کما یارحو العروبیون ازہر ص۔ 37} {حوالہ دیں: الاسلام کما یراحۃ العروبیون اظہر ص۔ 38} {حوالہ دیں: الاسلام کما یراحۃ العروبیون ازہر ص۔ 39}۔ وہ نوٹ کرتا ہے کہ بعد کی صدیوں کے کچھ اسکالرز، جیسے پاسکل، مونٹیسکوئیو، والٹیئر، رینن، کاسانووا اور ڈرمینگھم نے اسلام کے بارے میں غلطیاں کیں۔ 40}، اور اس کا خیال ہے کہ والٹیئر نے پیغمبر کو تمام مذاہب کے بانیوں پر حملہ کرنے کے لیے ایک کور کے طور پر استعمال کیا۔ 40} {حوالہ دیں: الاسلام کما یراحۃ العروبیون اظہر ص۔ 41}۔ غالب فرماتے ہیں کہ اسلام کے نصوص کا سنجیدہ مطالعہ انیسویں صدی میں شروع ہوا۔ 34}۔ یہ غالب کے فیصلے اور اس کی رپورٹنگ ہیں اور ہر فیصلہ اسی کی طرف منسوب ہے۔"
