    summary:
      ar: "هذا موقف غلاب كما يعرضه في كتابه {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 34} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 36}. يمزج الكتاب هذا النقد بعرض أقوال غربية تقرّ بسوء الفهم في القديم، وهي تُنسب إلى أصحابها."
