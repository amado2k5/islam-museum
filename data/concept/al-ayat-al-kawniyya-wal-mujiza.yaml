id: concept/al-ayat-al-kawniyya-wal-mujiza
class: concept
kind: term
label:
  ar: "الآيات الكونية والمعجزة"
  en: "Cosmic signs, miracles and the Qur'an as sign"
  ur: "کونی نشانیاں، معجزہ اور قرآن"
summary:
  ar: "يرى الشعراوي أن الكفر محاولة لستر وجود الله، وأن الستر لا يكون إلا لموجود، وأن الآيات تنقسم إلى آيات كونية خلقها الله لخدمة الإنسان، ومعجزات يخرقها الله على يد رسول ليثبت صدقه، والقرآن نفسه آيات {cite:tafsir-sharawi-khawatir-scan p.281} {cite:tafsir-sharawi-khawatir-scan p.282}."
  en: "Sha'rawi holds that disbelief is an attempt to hide God's existence, and one hides only what exists. He divides the signs into cosmic signs that God made to serve humanity, miracles that God breaks natural order to bring through a messenger to confirm him, and the Qur'an itself as signs {cite:tafsir-sharawi-khawatir-scan p.281} {cite:tafsir-sharawi-khawatir-scan p.282}."
  ur: "شعراوی کے نزدیک کفر اللہ کے وجود کو چھپانے کی کوشش ہے، اور چھپایا وہی جاتا ہے جو موجود ہو۔ وہ نشانیوں کو تین حصوں میں بانٹتے ہیں: کونی نشانیاں جو اللہ نے انسان کی خدمت کے لیے بنائیں، معجزات جو رسول کے ہاتھ پر ظاہر ہوتے ہیں تاکہ اس کی سچائی ثابت ہو، اور خود قرآن {cite:tafsir-sharawi-khawatir-scan p.281} {cite:tafsir-sharawi-khawatir-scan p.282}۔"
