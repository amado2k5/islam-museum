id: concept/al-ayat-al-kawniyya-wal-mujiza
class: concept
kind: term
label:
  ar: "الآيات الكونية والمعجزة"
  en: "Cosmic signs, miracles and the Qur'an as sign"
  fr: "Les signes cosmiques, les miracles et le Coran comme signe"
  ur: "کونی نشانیاں، معجزہ اور قرآن"
  es: "Señales cósmicas, milagros y el Corán como señal"
  tr: "Kozmik İşaretler ve Mucizeler"
  id: "Tanda Kosmik dan Mukjizat"
summary:
  ar: "يرى الشعراوي أن الكفر محاولة لستر وجود الله، وأن الستر لا يكون إلا لموجود، وأن الآيات تنقسم إلى آيات كونية خلقها الله لخدمة الإنسان، ومعجزات يخرقها الله على يد رسول ليثبت صدقه، والقرآن نفسه آيات {cite:tafsir-sharawi-khawatir-scan p.281} {cite:tafsir-sharawi-khawatir-scan p.282}."
  en: "Sha'rawi holds that disbelief is an attempt to hide God's existence, and one hides only what exists. He divides the signs into cosmic signs that God made to serve humanity, miracles that God breaks natural order to bring through a messenger to confirm him, and the Qur'an itself as signs {cite:tafsir-sharawi-khawatir-scan p.281} {cite:tafsir-sharawi-khawatir-scan p.282}."
  fr: "Pour Sha'rawi, l’incroyance est une tentative de dissimuler l’existence de Dieu, et on ne dissimule que ce qui existe. Il distingue les signes cosmiques que Dieu a mis au service de l’humanité, les miracles par lesquels Dieu rompt l’ordre naturel pour confirmer, par l’intermédiaire d’un messager, la mission de celui-ci, et les signes que constitue le Coran lui-même {cite:tafsir-sharawi-khawatir-scan p.281} {cite:tafsir-sharawi-khawatir-scan p.282}."
  ur: "شعراوی کے نزدیک کفر اللہ کے وجود کو چھپانے کی کوشش ہے، اور چھپایا وہی جاتا ہے جو موجود ہو۔ وہ نشانیوں کو تین حصوں میں بانٹتے ہیں: کونی نشانیاں جو اللہ نے انسان کی خدمت کے لیے بنائیں، معجزات جو رسول کے ہاتھ پر ظاہر ہوتے ہیں تاکہ اس کی سچائی ثابت ہو، اور خود قرآن {cite:tafsir-sharawi-khawatir-scan p.281} {cite:tafsir-sharawi-khawatir-scan p.282}۔"
  es: "Sha'rawi sostiene que la incredulidad es un intento de ocultar la existencia de Dios, y uno solo oculta lo que existe. Divide las señales en señales cósmicas que Dios creó para servir a la humanidad, milagros que Dios realiza rompiendo el orden natural a través de un mensajero para confirmarlo, y el Corán mismo como señales {cite:tafsir-sharawi-khawatir-scan p.281} {cite:tafsir-sharawi-khawatir-scan p.282}."
  tr: "Al-Shaarawi, inançsızlığın Allah'ın varlığını gizlemeye yönelik bir girişim olduğuna, gizlemenin sadece varoluş için var olduğuna ve ayetlerin Tanrı tarafından insanlığa hizmet etmek için yaratılan kozmik işaretlere ve Tanrı'nın doğruluğunu kanıtlamak için bir elçi aracılığıyla kırdığı mucizelere ayrıldığına inanır. Kur'an'ın kendisi {atıf:tafsir-sharawi-khawatir-scan s.281} {cite:tafsir-sharawi-khawatir-scan s.282} ayetleri içerir."
  id: "Al-Shaarawi percaya bahwa ketidakpercayaan adalah upaya untuk menyembunyikan keberadaan Tuhan, bahwa penyembunyian hanya ada untuk keberadaan, dan bahwa ayat-ayat tersebut didedikasikan untuk tanda-tanda kosmik yang diciptakan oleh Tuhan untuk melayani umat manusia serta mukjizat yang dipecahkan melalui utusan untuk membuktikan kebenaran Tuhan. Al-Qur'an sendiri memuat ayat-ayat {sitasi:tafsir-sharawi-khawatir-scan hlm.281} {cite:tafsir-sharawi-khawatir-scan hlm.282}."
