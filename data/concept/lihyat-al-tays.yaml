id: concept/lihyat-al-tays
class: concept
kind: natural
label:
  ar: "لحية التيس"
  en: "Lihyat al-tays (goat's beard)"
  ur: "لحیۃ التیس"
  es: "Lihyat al-tays (barba de cabra)"
  fr: "Lihyat al-tays (barbe de chèvre)"
  tr: "keçi sakalı"
  id: "janggut kambing"
summary:
  ar: "لحية التيس فيها قليل حرارة وبرودة، برده في آخر الأولى ويبسه شديد إلى الثالثة، قابض يدمل القروح ويقوي المعدة، وزهره أقوى دواء لقروح الأمعاء {cite:canon-ibn-sina-print-v1 p.539} {cite:canon-ibn-sina-print-v1 p.540}."
  en: "Goat's beard has a little heat and cold, its cold at the end of the first degree and its dryness strong, to the third; astringent, it heals ulcers and strengthens the stomach, and its flower is the strongest remedy for ulcers of the intestines {cite:canon-ibn-sina-print-v1 p.539} {cite:canon-ibn-sina-print-v1 p.540}."
  ur: "لحیۃ التیس میں تھوڑی گرمی اور ٹھنڈک ہے، اس کی ٹھنڈک پہلے درجے کے آخر میں اور خشکی سخت، تیسرے تک؛ قابض ہے، زخم بھرتی ہے اور معدے کو قوت دیتی ہے، اور اس کا پھول آنتوں کے زخموں کی سب سے قوی دوا ہے {cite:canon-ibn-sina-print-v1 p.539} {cite:canon-ibn-sina-print-v1 p.540}۔"
  es: "La barba de cabra tiene un poco de calor y frío, su frío al final del primer grado y su sequedad fuerte, hasta el tercero; astringente, cura úlceras y fortalece el estómago, y su flor es el remedio más fuerte para las úlceras de los intestinos {cite:canon-ibn-sina-print-v1 p.539} {cite:canon-ibn-sina-print-v1 p.540}."
  fr: "La barbe de chèvre a un peu de chaleur et de froid, son froid à la fin du premier degré et sa sécheresse forte, jusqu'au troisième; astringente, elle guérit les ulcères et fortifie l'estomac, et sa fleur est le remède le plus puissant contre les ulcères des intestins {cite:canon-ibn-sina-print-v1 p.539} {cite:canon-ibn-sina-print-v1 p.540}."
  tr: "Keçi sakalı hafif sıcaklık ve soğuktur; birincinin sonunda soğur ve üçüncüye kadar şiddetle sertleştirir. Ülserleri iyileştiren ve mideyi güçlendiren bir büzücü maddedir. Çiçeği bağırsak ülserleri için en güçlü ilaçtır {cite:canon-ibn-sina-print-v1 s.539} {cite:canon-ibn-sina-print-v1 s.540}."
  id: "Jenggot kambing memiliki sedikit panas dan dingin; ia mendingin di akhir yang pertama dan membuatnya sangat kaku hingga yang ketiga. Ini adalah astringen yang menyembuhkan tukak lambung dan memperkuat lambung. Bunganya adalah obat terkuat untuk tukak lambung {cite:canon-ibn-sina-print-v1 hlm.539} {cite:canon-ibn-sina-print-v1 hlm.540}."
