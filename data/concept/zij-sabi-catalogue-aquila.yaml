label:
  ar: "النسر الطائر"
  en: "The Flying Eagle"
  ur: "اڑتا ہوا عقاب"
  es: "El águila voladora"
  fr: "L'Aigle Volant"
  tr: "Uçan kartal"
  id: "Elang yang terbang"
summary:
  ar: "يذكر الفهرس صورة النسر الطائر بعد كواكب الحية، ويعدّ كواكبها بالترتيب، فيبدأ بالكوكب الذي على رأسه، ثم الذي في عنقه، ثم كواكب جسمه الموصوفة بمواضعها منه. ولم تُنقل أرقام المواضع. {cite:zij-sabi-nallino-byblion pp.252}"
  en: "The catalogue gives the Flying Eagle, al-Nasr al-Ta'ir, after the stars of the Serpent. The entries follow the order of the bird's parts: the star on its head, the star in its neck, and then the stars of its body. The figures are not transcribed here. {cite:zij-sabi-nallino-byblion pp.252}"
  ur: "فہرست اڑتے عقاب کو سانپ کے ستاروں کے بعد رکھتی ہے۔ ستاروں کی ترتیب پرندے کے اعضا کے حساب سے ہے: سر کا ستارہ، گردن کا ستارہ، اور پھر جسم کے ستارے۔ عددی قیمتیں یہاں نقل نہیں کی گئیں۔ {cite:zij-sabi-nallino-byblion pp.252}"
  es: "El catálogo presenta al Águila Voladora, al-Nasr al-Ta'ir, según las estrellas de la Serpiente. Las entradas siguen el orden de las partes del ave: la estrella en su cabeza, la estrella en su cuello y luego las estrellas en su cuerpo. Las figuras no se transcriben aquí. {cite:zij-sabi-nallino-byblion pp.252}"
  fr: "Le catalogue désigne l'Aigle volant, al-Nasr al-Ta'ir, d'après les étoiles du Serpent. Les entrées suivent l'ordre des parties de l'oiseau: l'étoile sur sa tête, l'étoile sur son cou, puis les étoiles sur son corps. Les figures ne sont pas transcrites ici. {cite:zij-sabi-nallino-byblion pp.252}"
  tr: "Dizin, Yılan takımyıldızından sonra uçan kartalın görüntüsünden bahseder ve başındaki takımyıldızdan başlayarak, boynundaki takımyıldız ve daha sonra vücudundaki takımyıldızları, üzerindeki konumlarına göre sırayla listeler. Bu konumların numaraları verilmemiştir. {cite:zij-sabi-nallino-byblion pp.252}"
  id: "Indeks tersebut menyebutkan gambar elang terbang setelah rasi bintang Ular, dan mencantumkan rasi bintangnya secara berurutan, dimulai dengan rasi bintang di kepalanya, kemudian yang di lehernya, dan kemudian rasi bintang di tubuhnya, yang dijelaskan berdasarkan posisinya. Nomor posisi ini tidak diberikan. {cite:zij-sabi-nallino-byblion pp.252}"
