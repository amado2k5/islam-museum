label: { ar: "استحقاقات متضادة في مرض واحد عند ابن سينا", en: "Opposed demands within one disease in the Canon", ur: "ایک مرض میں متضاد تقاضے قانون میں" }
summary:
  ar: "يذكر ابن سينا أن من الأمور الدقيقة في العلاج أن يجتمع في مرض واحد استحقاقان متضادان، كحمى تستحق التبريد وسدد هي سببها تستحق التسخين، أو قولنج تستحق مادته التسخين والتقطيع وشدة وجعه التبريد والتخدير، وأن ليس كل امتلاء وسوء مزاج يعالج بالاستفراغ والضد {cite:canon-ibn-sina-print-v1 p.271}."
  en: "Ibn Sina notes that one subtle matter in treatment is when two opposed demands meet in a single disease, as with a fever that calls for cooling and the obstructions that cause it, which call for heating, or a colic whose matter calls for heating and cutting while its severe pain calls for cooling and numbing, and that not every fullness or bad temper is treated by evacuation and the contrary {cite:canon-ibn-sina-print-v1 p.271}."
