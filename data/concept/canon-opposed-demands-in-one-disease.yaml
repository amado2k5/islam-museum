id: concept/canon-opposed-demands-in-one-disease
class: concept
kind: scientific
label:
  ar: "استحقاقات متضادة في مرض واحد عند ابن سينا"
  en: "Opposed demands within one disease in the Canon"
  fr: "Exigences opposées d’une même maladie dans le Canon"
  ur: "ایک مرض میں متضاد تقاضے قانون میں"
  es: "Demandas opuestas dentro de una misma enfermedad en el Canon"
  tr: "İbn Sina'ya göre Bir Hastalıkta Çelişkili Haklar"
  id: "Hak yang Bertentangan dalam Satu Penyakit menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن من الأمور الدقيقة في العلاج أن يجتمع في مرض واحد استحقاقان متضادان، كحمى تستحق التبريد وسدد هي سببها تستحق التسخين، أو قولنج تستحق مادته التسخين والتقطيع وشدة وجعه التبريد والتخدير، وأن ليس كل امتلاء وسوء مزاج يعالج بالاستفراغ والضد {cite:canon-ibn-sina-print-v1 p.271}."
  en: "Ibn Sina notes that one subtle matter in treatment is when two opposed demands meet in a single disease, as with a fever that calls for cooling and the obstructions that cause it, which call for heating, or a colic whose matter calls for heating and cutting while its severe pain calls for cooling and numbing, and that not every fullness or bad temper is treated by evacuation and the contrary {cite:canon-ibn-sina-print-v1 p.271}."
  fr: "Ibn Sina relève fièvre à refroidir mais obstruction causale à chauffer, colique à matière chauffée et incisée mais douleur à refroidir et engourdir ; réplétion et mauvais tempérament ne relèveraient pas toujours d’évacuation et contraires {cite:canon-ibn-sina-print-v1 p.271}."
  es: "Ibn Sina señala que una cuestión sutil en el tratamiento es cuando dos demandas opuestas se encuentran en una sola enfermedad, como con una fiebre que requiere enfriamiento y las obstrucciones que la causan, que requieren calentamiento, o un cólico cuya materia requiere calentamiento y corte mientras que su dolor intenso requiere enfriamiento y adormecimiento, y que no toda plenitud o mal humor se trata con evacuación y lo contrario {cite:canon-ibn-sina-print-v1 p.271}."
  ur: "ابن سینا نے کہا ہے کہ علاج میں ایک لطیف معاملہ یہ ہے کہ جب ایک بیماری میں دو مخالف مطالبات مل جائیں، جیسے بخار جس میں ٹھنڈک اور اس کی وجہ سے رکاوٹیں ہوتی ہیں، جو گرم کرنے کا مطالبہ کرتی ہیں، یا وہ درد جس کا مادہ گرم کرنے اور کاٹنے کا مطالبہ کرتا ہے جبکہ اس کا شدید درد ٹھنڈک اور بے حسی کا مطالبہ کرتا ہے، اور یہ کہ ہر بھر پور یا بد مزاجی کا علاج نہیں کیا جاتا ہے {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 271}۔"
  tr: "İbn Sina, tedavinin kesin yönlerinden birinin, soğumayı hak eden ateş ve ısınma kaynaklı döküntü gibi iki zıt ihtiyacın bir hastalıkta birleşmesi olduğunu belirtir; örneğin soğutmayı hak eden ateş ve ısınmayı gerektiren döküntü ya da kolik, bu da ısıtılması, yırtılması gereken ve ağrısının şiddeti serinletici ve anestezi olan koliktir. Her tokluk ve kötü ruh hali hissi kusma veya doğum kontrol yöntemleriyle tedavi edilmez {cite:canon-ibn-sina-print-v1 s.271}."
  id: "Ibn Sina menyebutkan bahwa salah satu aspek tepat dari pengobatan adalah dua kebutuhan yang berlawanan bertemu dalam satu penyakit, seperti demam yang layak didinginkan dan ruam akibat pemanasan, atau kolik, yang zatnya layak dipanaskan, robek, dan intensitas rasa sakitnya adalah pendinginan dan anestesi. Tidak setiap perasaan kenyang dan suasana hati buruk diatasi dengan muntah atau kontrasepsi {cite:canon-ibn-sina-print-v1 hlm.271}."
