label:
  ar: "دِقْلَى"
  en: "Diqla (wild and river plane)"
  ur: "دقلی"
  es: "Diqla (lluvia salvaje y fluvial)"
summary:
  ar: "صنفان: برّي ونهري. البري ينبسط على الأرض وفيه شوك، والنهري ينبت في شطوط الأنهار ويرتفع، وعصيره يجلو. طبعه حار في الثالثة يابس في الثانية، محلّل جداً، طبيخه يقتل البراغيث والأرضة إذا رُشّ به البيت، وورقه ينفع الأورام الصلبة، والمؤلف يحذّر من أنه سمّ يخطر على المرء {cite:canon-ibn-sina-print-v1 p.437} {cite:canon-ibn-sina-print-v1 p.438}."
  en: "Two kinds, wild and river. The wild one lies flat on the ground and has thorns; the river one grows on river banks and rises. Hot in the third degree and dry in the second; very dissolving; its decoction sprinkled in a house kills fleas and termites. Its leaf helps hard swellings. The author warns that the plant is dangerous and poisonous {cite:canon-ibn-sina-print-v1 p.437} {cite:canon-ibn-sina-print-v1 p.438}."
  ur: "دو قسمیں: جنگلی اور دریائی۔ جنگلی زمین پر پھیلتا ہے اور اس پر کانٹے ہیں؛ دریائی دریاؤں کے کناروں پر اگتا اور اونچا ہوتا ہے۔ تیسرے درجے میں گرم اور دوسرے میں خشک، بہت تحلیل کرنے والا؛ اس کا جوشاندہ گھر میں چھڑکنے سے پسو اور دیمک مرتے ہیں۔ اس کا پتا سخت سوجن میں مفید ہے؛ مصنف خبردار کرتا ہے کہ یہ پودا خطرناک اور زہریلا ہے {cite:canon-ibn-sina-print-v1 p.437} {cite:canon-ibn-sina-print-v1 p.438}۔"
  es: "Dos tipos: silvestre y de río. La silvestre crece plana sobre el suelo y tiene espinas; la de río crece en las riberas y se eleva. Es cálida en tercer grado y seca en segundo; muy disolvente; su decocción, esparcida en una casa, mata pulgas y termitas. Sus hojas ayudan a aliviar hinchazones duras. El autor advierte que la planta es peligrosa y venenosa {cite:canon-ibn-sina-print-v1 p.437} {cite:canon-ibn-sina-print-v1 p.438}."
