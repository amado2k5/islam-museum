label:
  ar: "طين المغرة"
  en: "Tin al-maghra (ochre earth)"
  ur: "طین المغرہ ⁦(گیرو کی مٹی)⁩"
  es: "Tin al-maghra (tierra ocre)"
  fr: "Tin al-maghra (terre ocre)"
  tr: "okra kili"
  id: "tanah liat oker"
summary:
  ar: "طين معروف، أجوده البغدادي النقي الأحمر القاني، يذكر الكتاب أنه أجود من المختوم في القبض والتجفيف، ويدمل الجراح."
  en: "A known earth, the best being the clean Baghdadi red kind; the book says it is better than the sealed earth for astringency and drying and it closes wounds."
  ur: "ایک معروف مٹی، جس کی بہترین قسم بغدادی، صاف اور گہری سرخ ہے؛ کتاب کے مطابق قبض اور خشکی میں یہ مہر بند مٹی سے بہتر ہے اور زخم بھرتی ہے۔"
  es: "Una tierra conocida, siendo la mejor la variedad roja pura de Bagdad; el libro dice que es mejor que la tierra sellada por su astringencia y capacidad de secado, y que cicatriza las heridas."
  fr: "Une terre connue, la meilleure étant la terre rouge pure de Bagdad; le livre dit qu’elle est meilleure que la terre scellée pour ses propriétés astringentes et asséchantes, et qu’elle cicatrise les plaies."
  tr: "Saf kırmızı ve saf El-Bağdadi tarafından yapılan bilinen bir kil olan kitap, mühürlenmiş kilden daha iyi tutunma ve kurutma açısından daha iyi olduğunu ve yaraları iyileştirdiğini belirtir."
  id: "Tanah liat yang terkenal, dibuat oleh Al-Baghdadi yang murni dan merah murni, buku tersebut menyebutkan bahwa tanah liat ini lebih baik daripada tanah liat tersegel dalam hal mencengkeram dan mengeringkan, serta menyembuhkan luka."
