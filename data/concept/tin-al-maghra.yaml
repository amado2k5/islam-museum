summary:
  ar: "طين معروف، أجوده البغدادي النقي الأحمر القاني، يذكر الكتاب أنه أجود من المختوم في القبض والتجفيف، ويدمل الجراح."
  en: "A known earth, the best being the clean Baghdadi red kind; the book says it is better than the sealed earth for astringency and drying and it closes wounds."
  ur: "ایک معروف مٹی، جس کی بہترین قسم بغدادی، صاف اور گہری سرخ ہے؛ کتاب کے مطابق قبض اور خشکی میں یہ مہر بند مٹی سے بہتر ہے اور زخم بھرتی ہے۔"
  es: "Una tierra conocida, siendo la mejor la variedad roja pura de Bagdad; el libro dice que es mejor que la tierra sellada por su astringencia y capacidad de secado, y que cicatriza las heridas."
