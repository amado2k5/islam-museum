      en: "Sha'rawi holds that God's good pleasure and vision are greater than any bliss, citing the verse of al-Qiyama, and reports a saying of Rabi'a al-Adawiyya without its verses {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1326} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1327}."
      ur: "شعراوی کے نزدیک اللہ کی رضا اور دیدار ہر نعمت سے بڑھ کر ہے، وہ سورۃ القیامہ کی آیت کا حوالہ دیتے ہیں اور رابعہ عدویہ کا قول اشعار کے بغیر نقل کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1326} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1327}۔"
