id: concept/vision-of-god-as-supreme-reward
class: concept
kind: belief
label: { ar: "رؤية الله أعلى النعيم", en: "The vision of God as the highest bliss", ur: "اللہ کے دیدار کو اعلیٰ ترین نعمت ماننا" }
summary:
  ar: "يرى الشعراوي أن أعلى نعيم الآخرة رضوان الله ورؤيته، وأن المؤمن يعبد الله لأنه أهل للعبادة لا طمعاً في النعمة وحدها، وأن الجنة درجات بحسب نية العابد، وينقل قولاً لرابعة العدوية دون إيراد شعرها {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1326} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1327} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1328}."
  en: "Sha'rawi holds that the highest bliss of the Hereafter is God's good pleasure and the vision of Him. The believer worships God because He is worthy of worship, not only for blessing, and paradise has degrees according to the intention of the worshipper. He reports a saying of Rabi'a al-Adawiyya, without reproducing its verses {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1326} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1327} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1328}."
  ur: "شعراوی کے نزدیک آخرت کی سب سے اعلیٰ نعمت اللہ کی رضا اور اس کا دیدار ہے، اور مومن اللہ کی عبادت اس لیے کرتا ہے کہ وہ عبادت کا اہل ہے، نہ کہ صرف نعمت کے لیے۔ جنت کے درجات عبادت کرنے والے کی نیت کے مطابق ہیں۔ وہ رابعہ عدویہ کا ایک قول نقل کرتے ہیں، ان کے اشعار درج کیے بغیر {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1326} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1327} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1328}۔"
