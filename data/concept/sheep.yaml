  ar: "غنم يرعاها الراعي في شعب الجبال ومواقع القطر خير مال المسلم عند الفتن، وأخبرت جارية النبي أن الذئب أكل شاة من غنمها فرُفع ذلك بها."
  en: "Sheep grazed by the shepherd in the mountain passes and the places of rain are the Muslim's best wealth when trials come; a shepherd girl told the Prophet a wolf had eaten a ewe of her flock and that raised her standing."
