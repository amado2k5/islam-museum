label:
  ar: "آغاج"
  en: "Aghac (tree, wood, and a measure of distance)"
  fr: "Aghac (arbre, bois et mesure de distance)"
  es: "Aghac (árbol, madera y una medida de distancia)"
  ur: "Aghac ⁦(درخت، لکڑی، اور فاصلے کا ایک پیمانہ)⁩"
summary:
  ar: "آغاج كلمة تركية تعني في العثمانية «الشجرة» و«الخشب»، وفي التركية الشرقية تعني أيضًا وحدة قياس للمسافة، تُقدَّر بالفرسخ أو بنحو ذلك، وهي المسافة التي يُسمع فيها الصوت بين رجلين يقفان بينهما آخر {cite:encyclopaedia-of-islam-2 vol. 1 p. 269}."
  en: "Aghac is a Turkic word meaning 'tree' and 'wood' in Ottoman Turkish. In eastern Turkic it also named a measure of distance, the parasang, which al-Kashgari gives as the distance at which a man standing between two others can be heard; later writers put its value at between about six and seven kilometres {cite:encyclopaedia-of-islam-2 vol. 1 p. 269}."
  fr: "Aghac est un mot turcique signifiant « arbre » et « bois » en turc ottoman. En turcique oriental, il désignait aussi une mesure de distance, la parasange, qu’al-Kashgari donne comme la distance à laquelle un homme placé entre deux autres peut être entendu ; les auteurs ultérieurs en situaient la valeur entre environ six et sept kilomètres {cite:encyclopaedia-of-islam-2 vol. 1 p. 269}."
  es: "Aghac es una palabra turca que significa \"árbol\" y \"madera\" en turco otomano. En turco oriental también designaba una medida de distancia, el parasang, que al-Kashgari define como la distancia a la que se puede oír a un hombre parado entre dos; autores posteriores le atribuyeron un valor de entre seis y siete kilómetros {cite:encyclopaedia-of-islam-2 vol. 1 p. 269}."
  ur: "Aghac ایک ترک زبان کا لفظ ہے جس کے معنی عثمانی ترکی میں 'درخت' اور 'لکڑی' کے ہیں۔ مشرقی ترک زبان میں اس نے فاصلے کے ایک پیمانہ کا نام بھی رکھا ہے، پارسنگ، جسے الکاشگری اس فاصلے کے طور پر بتاتا ہے جس پر دو دوسرے کے درمیان کھڑا آدمی سن سکتا ہے۔ بعد کے مصنفین نے اس کی قیمت تقریباً چھ اور سات کلومیٹر کے درمیان بتائی 1 ص۔ 269}۔"
