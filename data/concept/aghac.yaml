label:
  ar: "آغاج"
  en: "Aghac (tree, wood, and a measure of distance)"
summary:
  ar: "آغاج كلمة تركية تعني في العثمانية «الشجرة» و«الخشب»، وفي التركية الشرقية تعني أيضًا وحدة قياس للمسافة، تُقدَّر بالفرسخ أو بنحو ذلك، وهي المسافة التي يُسمع فيها الصوت بين رجلين يقفان بينهما آخر {cite:encyclopaedia-of-islam-2 vol. 1 p. 269}."
  en: "Aghac is a Turkic word meaning 'tree' and 'wood' in Ottoman Turkish. In eastern Turkic it also named a measure of distance, the parasang, which al-Kashgari gives as the distance at which a man standing between two others can be heard; later writers put its value at between about six and seven kilometres {cite:encyclopaedia-of-islam-2 vol. 1 p. 269}."
