summary:
  ar: "السلق في الكتاب معروف وهو عند ديسقوريدوس صنفان أسود وأبيض، كلاهما رديء الكيموس لما فيهما من النطرونية، فيه بورقية ملطفة وتحليل وتفتيح وتليين، وفي الأسود قبض، قليل الغذاء كسائر البقول، ينفع عصيره وطبيخ ورقه من شقاق البرد وداء الثعلب والكلف والثآليل، ويفتح سدد الكبد والطحال، ويولد النفخ والقراقر ويمغص {cite:canon-ibn-sina-print-v1 p.598}."
  en: "Silq is in the book well known, and in Dioscorides of two kinds, black and white, both bad in chyme because of the natron in them, with a thinning borax-like quality, dissolving, opening and softening, the black with astringency, low in nourishment like all the vegetables; its juice and leaf decoction help chaps from cold, alopecia, freckles and warts, it opens blockages of the liver and spleen, and it breeds wind, rumbling and griping {cite:canon-ibn-sina-print-v1 p.598}."
  ur: "سلق کتاب میں معروف ہے اور دیسقوریدوس کے ہاں اس کی دو قسمیں ہیں: سیاہ اور سفید، دونوں کا کیموس ردی ہے کیونکہ ان میں نطرونیت ہے، اس میں لطیف کرنے والی بورقیت، تحلیل، کھولنے اور نرم کرنے کی قوت ہے، اور سیاہ میں قبض ہے، دوسری سبزیوں کی طرح کم غذا دیتا ہے؛ اس کا رس اور پتوں کا جوشاندہ سردی سے پھٹنے، ثعلب، جھائیوں اور مسوں میں مفید ہے، جگر اور تلی کی رکاوٹیں کھولتا ہے، اور ریاح، گڑگڑاہٹ اور مروڑ پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 p.598}۔"
