summary:
  ar: "السلق في الكتاب معروف وهو عند ديسقوريدوس صنفان أسود وأبيض، كلاهما رديء الكيموس لما فيهما من النطرونية، فيه بورقية ملطفة وتحليل وتفتيح وتليين، وفي الأسود قبض، قليل الغذاء كسائر البقول، ينفع عصيره وطبيخ ورقه من شقاق البرد وداء الثعلب والكلف والثآليل، ويفتح سدد الكبد والطحال، ويولد النفخ والقراقر ويمغص {cite:canon-ibn-sina-print-v1 p.598}."
  en: "Silq is in the book well known, and in Dioscorides of two kinds, black and white, both bad in chyme because of the natron in them, with a thinning borax-like quality, dissolving, opening and softening, the black with astringency, low in nourishment like all the vegetables; its juice and leaf decoction help chaps from cold, alopecia, freckles and warts, it opens blockages of the liver and spleen, and it breeds wind, rumbling and griping {cite:canon-ibn-sina-print-v1 p.598}."
  ur: "سلق کتاب میں معروف ہے اور دیسقوریدوس کے ہاں اس کی دو قسمیں ہیں: سیاہ اور سفید، دونوں کا کیموس ردی ہے کیونکہ ان میں نطرونیت ہے، اس میں لطیف کرنے والی بورقیت، تحلیل، کھولنے اور نرم کرنے کی قوت ہے، اور سیاہ میں قبض ہے، دوسری سبزیوں کی طرح کم غذا دیتا ہے؛ اس کا رس اور پتوں کا جوشاندہ سردی سے پھٹنے، ثعلب، جھائیوں اور مسوں میں مفید ہے، جگر اور تلی کی رکاوٹیں کھولتا ہے، اور ریاح، گڑگڑاہٹ اور مروڑ پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 p.598}۔"
  es: "Silq es bien conocido en el libro, y en Dioscórides de dos tipos, negro y blanco, ambos malos en quimo debido al natrón que contienen, con una cualidad diluyente similar al bórax, disolviendo, abriendo y suavizando, el negro con astringencia, bajo en nutrientes como todas las verduras; su jugo y la decocción de sus hojas ayudan a las grietas del resfriado, la alopecia, las pecas y las verrugas, desbloquea los bloqueos del hígado y el bazo, y produce gases, ruidos y cólicos {cite:canon-ibn-sina-print-v1 p.598}."
  fr: "Le silq est bien connu dans le livre, et chez Dioscoride, il est décrit comme étant de deux sortes, noir et blanc, tous deux mauvais dans le chyme en raison du natron qu'ils contiennent, avec une qualité fluidifiante semblable au borax, dissolvant, ouvrant et adoucissant, le noir étant astringent, pauvre en nutriments comme tous les légumes; son jus et sa décoction de feuilles aident les gerçures dues au rhume, à l'alopécie, aux taches de rousseur et aux verrues, il ouvre les blocages du foie et de la rate, et il provoque des gaz, des gargouillis et des coliques {cite:canon-ibn-sina-print-v1 p.598}."
  tr: "Kitapta kaynatma bilinir ve Dioscorides'e göre iki tür vardır: siyah ve beyaz; ikisi de dikenli özellikleri nedeniyle zayıf kimyalıdır. Yumuşak, çözünmüş, açıcı ve yumuşayan bir yaprağa sahiptir; siyah ise diğer baklagiller gibi sıkı ve hafifçe besleyicidir. Suyu ve yapraklarının pişirilmesi soğuk çatlaklar, tilki hastalığı, melazma ve siğiller için faydalıdır; karaciğer ve dalak kapağını açar, şişkinlik, kirqar ve kramplara neden olur {cite:canon-ibn-sina-print-v1 s.598}."
  id: "Merebus diketahui dalam buku dan menurut Dioscorides ada dua jenis, hitam dan putih, keduanya kurang baik karena sifat berdurinya. Daunnya lembut, larut, mencerahkan, dan melunak, sedangkan dalam hitam daunnya ketat, sedikit bergizi seperti legum lain. Jus dan pemasakan daunnya bermanfaat untuk retak dingin, penyakit rubah, melasma, dan kutil, serta membuka katup hati dan limpa, menyebabkan kembung, qirqar, dan kram {cite:canon-ibn-sina-print-v1 hlm.598}."
