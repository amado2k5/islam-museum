summary:
  ar: "الملتزم ما بين الركن الذي فيه الحجر الأسود وباب الكعبة من جدارها، ويسمى كذلك لأن الناس يعتنقونه. ويستحب الالتزام به بعد طواف الوداع عند الجمهور، وعند الحنفية والمالكية بعد طواف القدوم أيضا. وللفقهاء كيفية في الالتزام، ووقت له بعد ركعتي الطواف."
  en: "Al-Multazam is the stretch of the Kaaba wall from the corner of the Black Stone to the door of the House, so called because people embrace it. Embracing it is recommended after the farewell circumambulation, and for the Hanafis and Malikis also after the arrival circumambulation. The jurists describe how to do it and when, after the two rak'as of the circumambulation."
  ur: "مُلتزَم کعبہ کی دیوار کا وہ حصہ ہے جو حجرِ اسود کے رکن اور کعبہ کے دروازے کے درمیان ہے۔ طواف وداع کے بعد اس سے لپٹنا مستحب ہے۔"
