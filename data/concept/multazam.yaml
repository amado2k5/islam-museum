label: { ar: "المُلْتَزَم", en: "Al-Multazam (the stretch between the Black Stone and the Kaaba door)", ur: "مُلتزَم", es: "Al-Multazam (el tramo entre la Piedra Negra y la puerta de la Kaaba)", fr: "Al-Multazam (la zone entre la Pierre Noire et la porte de la Kaaba)" }
summary:
  ar: "الملتزم ما بين الركن الذي فيه الحجر الأسود وباب الكعبة من جدارها، ويسمى كذلك لأن الناس يعتنقونه. ويستحب الالتزام به بعد طواف الوداع عند الجمهور، وعند الحنفية والمالكية بعد طواف القدوم أيضا. وللفقهاء كيفية في الالتزام، ووقت له بعد ركعتي الطواف."
  en: "Al-Multazam is the stretch of the Kaaba wall from the corner of the Black Stone to the door of the House, so called because people embrace it. Embracing it is recommended after the farewell circumambulation, and for the Hanafis and Malikis also after the arrival circumambulation. The jurists describe how to do it and when, after the two rak'as of the circumambulation."
  ur: "مُلتزَم کعبہ کی دیوار کا وہ حصہ ہے جو حجرِ اسود کے رکن اور کعبہ کے دروازے کے درمیان ہے۔ طواف وداع کے بعد اس سے لپٹنا مستحب ہے۔"
  es: "Al-Multazam es el tramo del muro de la Kaaba que va desde la esquina de la Piedra Negra hasta la puerta de la Casa, llamado así porque la gente lo abraza. Se recomienda abrazarlo después de la circunvalación de despedida, y para los hanafíes y malikíes también después de la circunvalación de llegada. Los juristas describen cómo y cuándo hacerlo, después de las dos rak'as de la circunvalación."
  fr: "Al-Multazam est la portion du mur de la Kaaba qui s'étend de l'angle de la Pierre Noire à la porte de la Maison, ainsi nommée car les fidèles l'enlacent. Il est recommandé de l'enlacer après la circumambulation d'adieu, et pour les hanafites et les malikites également après la circumambulation d'arrivée. Les juristes expliquent comment et quand procéder, après les deux rak'as de la circumambulation."
