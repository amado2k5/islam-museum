summary:
  ar: "شابابك في الكتاب قيل هو شبيه بالقبصوم في القوة، حار يابس في الثانية، ينفع من الصرع ويقطع اللعاب السائل وخصوصا من أفواه الصبيان، وبدله في منفعته من الصرع وغيره مرزنجوش {cite:canon-ibn-sina-print-v1 p.681}"
  en: "Shababak is in the book said to resemble qabsum in strength, hot and dry in the second degree; it benefits epilepsy and cuts off the flowing saliva, especially from the mouths of children, and its substitute in benefit for epilepsy and other ailments is marzanjush {cite:canon-ibn-sina-print-v1 p.681}"
  ur: "شابابک کتاب میں کہا گیا ہے کہ قوت میں قبصوم سے ملتا جلتا ہے، دوسرے درجے میں گرم خشک ہے؛ مرگی میں نافع ہے اور بہنے والے لعاب کو روکتا ہے، خاص طور پر بچوں کے منہ سے، اور مرگی وغیرہ میں فائدے کے لحاظ سے اس کا بدل مرزنجوش ہے {cite:canon-ibn-sina-print-v1 p.681}۔"
  es: "En el libro se dice que Shababak se asemeja a Qabsum en fuerza, caliente y seco en segundo grado; beneficia a la epilepsia y corta el flujo de saliva, especialmente de la boca de los niños, y su sustituto para el beneficio de la epilepsia y otras dolencias es Marzanjush {cite:canon-ibn-sina-print-v1 p.681}"
  fr: "Le Shababak est décrit dans le livre comme ayant une force similaire au qabsum, chaud et sec de deuxième degré; il est bénéfique contre l'épilepsie et diminue la salivation excessive, notamment chez les enfants, et son substitut bénéfique pour l'épilepsie et d'autres affections est le marzanjush {cite:canon-ibn-sina-print-v1 p.681}"
