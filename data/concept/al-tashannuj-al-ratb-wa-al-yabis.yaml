id: "concept/al-tashannuj-al-ratb-wa-al-yabis"
class: "concept"
kind: "scientific"
label:
  ar: "التشنج الرطب واليابس"
  en: "The moist and the dry convulsion"
  fr: "Les convulsions humides et sèches"
  ur: "رطب اور یابس تشنج"
  es: "La convulsión húmeda y la seca"
summary:
  ar: "التشنج الرطب سببه الذاتي الرطوبة والبرد يعينه على إجماده وتغليظه فلا ينبسط، واليابس يعين على مبالغته اليبوسة والحر بتحليل الرطوبة؛ واليابس أردأ، وهو يعرض عقيب الدواء المسهل وكل استفراغ والحميات المحرقة والسرسام، والرطب يعرض للسكارى وللصبيان لرطوبتهم {cite:canon-ibn-sina-print-v2 p.143} {cite:canon-ibn-sina-print-v2 p.144}"
  en: "The moist convulsion's own cause is moisture, cold aiding it by congealing and thickening it so it does not extend; dryness and heat aid the dry one's excess by dissolving the moisture; the dry is the worse, occurring after the purging medicine, every evacuation, the burning fevers and phrenitis, while the moist befalls the drunk and boys for their moisture {cite:canon-ibn-sina-print-v2 p.143} {cite:canon-ibn-sina-print-v2 p.144}"
  fr: "Dans le traité, la cause propre de la convulsion humide est l’humidité, et le froid contribue à la condenser et à l’épaissir, empêchant l’extension. La sécheresse et la chaleur aggravent la convulsion sèche en dissipant l’humidité. La convulsion sèche est la plus grave : elle survient après un purgatif, toute évacuation, les fièvres ardentes et la phrénitis ; la forme humide atteint les personnes ivres et les garçons, ces derniers en raison de leur humidité {cite:canon-ibn-sina-print-v2 p.143} {cite:canon-ibn-sina-print-v2 p.144}"
  ur: "رطب تشنج کا ذاتی سبب رطوبت ہے اور برد اسے جمود اور گاڑھا کرنے میں مدد دیتا ہے تا کہ نہ بسطے، اور یابس کے غلو میں یبوسہ اور حر رطوبت کے تحلیل سے مدد دیتے ہیں؛ اور یابس بدتر ہے، جو مسهل دوا، ہر استفراغ، محرق بخاروں اور سرسام کے بعد ہوتا ہے، اور رطب نشئیوں اور رطوبت کے سبب بچوں کو ہوتا ہے {cite:canon-ibn-sina-print-v2 p.143} {cite:canon-ibn-sina-print-v2 p.144}۔"
  es: "La convulsión húmeda tiene su propia causa: la humedad. El frío la favorece al coagularla y espesarla, impidiendo que se extienda. La sequedad y el calor favorecen el exceso de la convulsión seca al disolver la humedad. La convulsión seca es la peor, presentándose después de la medicina purgante, cada evacuación, las fiebres ardientes y la frenitis, mientras que la convulsión húmeda afecta a los borrachos y a los niños debido a su humedad. {cite:canon-ibn-sina-print-v2 p.143} {cite:canon-ibn-sina-print-v2 p.144}"
