id: concept/alamat-al-subat-min-al-dawa-al-mashrub
class: concept
kind: scientific
label:
  ar: "علامات السبات من دواء مشروب"
  en: "Signs of coma from a drink taken"
  fr: "Signes du coma après ingestion d’un breuvage"
  ur: "پی ہوئی دوا سے غنودگی کی علامات"
  es: "Signos de coma por haber tomado una bebida alcohólica."
summary:
  ar: "يذكر ابن سينا أن السبات قد يكون من شيء مشروب من أدوية يعدّها بأسمائها، ويذكر علامات ذلك في النبض واللون واللسان والرائحة، ويحيل على باب السموم {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}"
  en: "Ibn Sina says coma may come from a drink taken of medicines that he lists by name, gives the signs in the pulse, colour, tongue and smell, and refers to the chapter on poisons {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}"
  fr: "Ibn Sina explique que le coma peut suivre l’ingestion de médicaments qu’il nomme. Il en donne les signes dans le pouls, le teint, la langue et l’odeur, et renvoie au chapitre sur les poisons {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}."
  ur: "ابن سینا کہتا ہے کہ غنودگی پی ہوئی ایسی دواؤں سے بھی ہو سکتی ہے جنہیں وہ نام لے کر گنواتا ہے، نبض، رنگ، زبان اور بو میں علامات بتاتا ہے، اور زہروں کے باب کا حوالہ دیتا ہے {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}۔"
  es: "Ibn Sina afirma que el coma puede ser causado por la ingesta de medicamentos que enumera por nombre, da las señales en el pulso, el color, la lengua y el olor, y se refiere al capítulo sobre venenos {cite:canon-ibn-sina-print-v2 p.91} {cite:canon-ibn-sina-print-v2 p.92}"
