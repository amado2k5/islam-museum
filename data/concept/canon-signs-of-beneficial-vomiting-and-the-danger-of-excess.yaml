label: { ar: "علامات القيء النافع وخطر الإفراط عند ابن سينا", en: "Signs of beneficial vomiting and the danger of excess", ur: "قانون میں نافع قے کی علامات اور حد سے زیادہ قے کا خطرہ" }
summary:
  ar: "يعرف ابن سينا القيء النافع بما يتبعه من الخفة وجودة الشهوة والنبض والتنفس، ويصف مراحل القيء بالخربق من الغثيان إلى سيلان اللعاب ثم قيء البلغم ثم السائل الصافي، ثم يذكر علامات الإفراط من جحوظ العين وعرق كثير وانقطاع الصوت، ويأمر بتدارك ذلك بالحقنة وسقي العسل والماء الفاتر {cite:canon-ibn-sina-print-v1 pp.286-287}."
  en: "Ibn Sina knows beneficial vomiting by the lightness, good appetite, pulse and breathing that follow it, and describes the course of vomiting with hellebore from nausea to a flow of saliva, then much phlegm, then a clear fluid; he then names the signs of excess, bulging and red eyes, heavy sweat and loss of voice, and orders the remedy by enema, honey and lukewarm water {cite:canon-ibn-sina-print-v1 pp.286-287}."
