id: concept/canon-signs-of-beneficial-vomiting-and-the-danger-of-excess
class: concept
kind: scientific
label:
  ar: "علامات القيء النافع وخطر الإفراط عند ابن سينا"
  en: "Signs of beneficial vomiting and the danger of excess"
  fr: "Signes du vomissement bénéfique et danger de l’excès"
  ur: "قانون میں نافع قے کی علامات اور حد سے زیادہ قے کا خطرہ"
  es: "Signos de vómito beneficioso y peligro de exceso"
summary:
  ar: "يعرف ابن سينا القيء النافع بما يتبعه من الخفة وجودة الشهوة والنبض والتنفس، ويصف مراحل القيء بالخربق من الغثيان إلى سيلان اللعاب ثم قيء البلغم ثم السائل الصافي، ثم يذكر علامات الإفراط من جحوظ العين وعرق كثير وانقطاع الصوت، ويأمر بتدارك ذلك بالحقنة وسقي العسل والماء الفاتر {cite:canon-ibn-sina-print-v1 pp.286-287}."
  en: "Ibn Sina knows beneficial vomiting by the lightness, good appetite, pulse and breathing that follow it, and describes the course of vomiting with hellebore from nausea to a flow of saliva, then much phlegm, then a clear fluid; he then names the signs of excess, bulging and red eyes, heavy sweat and loss of voice, and orders the remedy by enema, honey and lukewarm water {cite:canon-ibn-sina-print-v1 pp.286-287}."
  fr: "Ibn Sina juge le vomissement bénéfique par légèreté, bon appétit, pouls et respiration ultérieurs ; avec l’hellébore, il décrit nausée, salivation, phlegme abondant, puis liquide clair. Excès : yeux saillants et rouges, sueur abondante et perte de voix ; le livre décrit lavement, miel et eau tiède {cite:canon-ibn-sina-print-v1 pp.286-287}."
  es: "Ibn Sina reconoce el vómito beneficioso por la ligereza, el buen apetito, el pulso y la respiración que lo siguen, y describe el curso del vómito con eléboro desde náuseas hasta un flujo de saliva, luego mucha flema, luego un líquido claro; luego nombra los signos de exceso, ojos saltones y rojos, sudoración profusa y pérdida de la voz, y ordena el remedio mediante enema, miel y agua tibia {cite:canon-ibn-sina-print-v1 pp.286-287}."
  ur: "ابن سینا فائدہ مند قے کو ہلکا پن، اچھی بھوک، نبض اور اس کے بعد سانس لینے سے جانتا ہے، اور متلی سے لعاب کے بہنے تک، پھر بہت زیادہ بلغم، پھر ایک صاف سیال تک قے کے طریقہ کار کو بیان کرتا ہے۔ اس کے بعد وہ ضرورت سے زیادہ، ابھرنے اور سرخ آنکھوں، بھاری پسینہ اور آواز کی کمی کی علامات کا نام دیتا ہے، اور انیما، شہد اور نیم گرم پانی سے علاج کا حکم دیتا ہے۔"
