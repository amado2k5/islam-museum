id: concept/caliphate-not-kingship
class: concept
kind: political
label: { ar: "الفرق بين الخلافة والملك", en: "The difference between caliphate and kingship" }
summary:
  ar: "يعرض شكيب أرسلان تمييزه بين الخلافة والملك: الخلافة في نظره رعاية عامة للأمة لإقامتها على الشرع، وردّ القوي عن الضعيف في الداخل، وحماية الإسلام من المعتدي في الخارج، ولا تنعقد إلا بإرادة الأمة، فسلطة الخليفة مستمدة منها. ويذكر أن المؤرخ لوثروب ستودارد فهم هذا الباب، وينتقد من يزعم أن فكرة السلطة المستمدة من الأمة من أوضاع الغرب وحده. ويستشهد بسيرة أبي بكر، وقد رجع إلى التجارة والرعي بعد البيعة ثم اقتصر على نفقة من مال المسلمين. هذا عرض لتصور المؤلف، ويُنسب إليه لا إلى الإجماع."
  en: "Arslan separates caliphate from kingship. In his account the caliphate is a general trusteeship of the community to uphold the Sharia, restrain the strong against the weak and defend Islam from outside attack. It exists only by the community's will, so the caliph's authority comes from the community. He credits Lothrop Stoddard with understanding this and rejects the view that popular sovereignty is purely Western. He illustrates the point with Abu Bakr, who after his accession kept working and took only a modest allowance from public funds. This is the author's account of the principle."
wings: [ideas, people]
