id: concept/caliphate-not-kingship
class: concept
kind: political
label:
  ar: "الفرق بين الخلافة والملك"
  en: "The difference between caliphate and kingship"
  fr: "Différence entre califat et royauté"
  es: "La diferencia entre califato y monarquía"
summary:
  ar: "يعرض شكيب أرسلان تمييزه بين الخلافة والملك: الخلافة في نظره رعاية عامة للأمة لإقامتها على الشرع، وردّ القوي عن الضعيف في الداخل، وحماية الإسلام من المعتدي في الخارج، ولا تنعقد إلا بإرادة الأمة، فسلطة الخليفة مستمدة منها. ويذكر أن المؤرخ لوثروب ستودارد فهم هذا الباب، وينتقد من يزعم أن فكرة السلطة المستمدة من الأمة من أوضاع الغرب وحده. ويستشهد بسيرة أبي بكر، وقد رجع إلى التجارة والرعي بعد البيعة ثم اقتصر على نفقة من مال المسلمين. هذا عرض لتصور المؤلف، ويُنسب إليه لا إلى الإجماع."
  en: "Arslan separates caliphate from kingship. In his account the caliphate is a general trusteeship of the community to uphold the Sharia, restrain the strong against the weak and defend Islam from outside attack. It exists only by the community's will, so the caliph's authority comes from the community. He credits Lothrop Stoddard with understanding this and rejects the view that popular sovereignty is purely Western. He illustrates the point with Abu Bakr, who after his accession kept working and took only a modest allowance from public funds. This is the author's account of the principle."
  fr: "Arslan distingue le califat de la royauté. Pour lui, le califat est une charge générale de la communauté visant à maintenir la charia, contenir les forts face aux faibles et défendre l’islam des attaques extérieures. Il n’existe que par la volonté communautaire, source de l’autorité du calife. Il loue Lothrop Stoddard pour cette compréhension et refuse une origine exclusivement occidentale de la souveraineté populaire. Il cite Abu Bakr, qui continua à travailler après son accession et ne reçut qu’une modeste allocation publique. C’est la conception de l’auteur."
  es: "Arslan distingue entre califato y monarquía. Según él, el califato es una tutela general de la comunidad para defender la Sharia, contener a los poderosos frente a los débiles y proteger el islam de ataques externos. Existe únicamente por voluntad de la comunidad, por lo que la autoridad del califa emana de ella. Atribuye a Lothrop Stoddard la comprensión de este principio y rechaza la idea de que la soberanía popular sea un concepto puramente occidental. Ilustra este punto con el ejemplo de Abu Bakr, quien, tras su ascenso al trono, continuó trabajando y solo recibió una modesta asignación de fondos públicos. Esta es la interpretación que el autor hace de este principio."
