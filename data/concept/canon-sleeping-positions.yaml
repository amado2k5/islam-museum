id: concept/canon-sleeping-positions
class: concept
kind: scientific
label: { ar: "هيئات النوم عند ابن سينا", en: "Sleeping positions in the Canon", ur: "سونے کی ہیئتیں قانون میں", es: "Posiciones para dormir en el Canon", fr: "Positions de sommeil dans le Canon", tr: "İbn Sina'ya göre uyku formları", id: "Tidur Terbentuk Menurut Avicenna" }
summary:
  ar: "يبين ابن سينا أن أفضل هيئات النوم أن يبتدئ على اليمين ثم ينقلب على اليسار، وأن الابتداء على البطن يعين على الهضم، وأن الاستلقاء رديء يهيئ للسكتة والفالج والكابوس، وأنه من عادة الضعفى من المرضى لضعف عضلاتهم {cite:canon-ibn-sina-print-v1 p.241}."
  en: "Ibn Sina says the best way to sleep is to begin on the right and then turn to the left, that beginning on the belly helps digestion, and that lying on the back is poor, preparing for apoplexy, paralysis and nightmare, being the habit of the weak among the sick because of the weakness of their muscles {cite:canon-ibn-sina-print-v1 p.241}."
  es: "Ibn Sina dice que la mejor manera de dormir es comenzar sobre la derecha y luego girar hacia la izquierda, que comenzar boca abajo ayuda a la digestión, y que acostarse boca arriba es malo, preparando para la apoplejía, la parálisis y las pesadillas, siendo el hábito de los débiles entre los enfermos debido a la debilidad de sus músculos {cite:canon-ibn-sina-print-v1 p.241}."
  fr: "Ibn Sina dit que la meilleure façon de dormir est de commencer sur le côté droit puis de se tourner sur le côté gauche, que commencer sur le ventre aide à la digestion et que dormir sur le dos est une mauvaise position, préparant à l'apoplexie, à la paralysie et aux cauchemars, étant l'habitude des faibles parmi les malades en raison de la faiblesse de leurs muscles {cite:canon-ibn-sina-print-v1 p.241}."
  ur: "ابن سینا کا کہنا ہے کہ سونے کا بہترین طریقہ یہ ہے کہ دائیں طرف شروع کریں اور پھر بائیں طرف مڑیں، پیٹ کے بل لیٹنے سے ہاضمے میں مدد ملتی ہے، اور یہ کہ پیٹھ کے بل لیٹنا خراب ہے، اپاپلیکسی، فالج اور ڈراؤنے خواب کی تیاری، بیماروں میں کمزوروں کی عادت ان کے عضلات کی کمزوری کی وجہ سے ہوتی ہے۔"
  tr: "İbn Sina, en iyi uyku duruşunun sağdan başlayıp sonra sola dönmek olduğunu, karından başlamanın sindirime yardımcı olduğunu, yatmanın kötü ve felç, felç ve kabuslara yatkın olduğunu, hastaların zayıf kasları nedeniyle zayıf olmasının yaygın olduğunu açıklar {cite:canon-ibn-sina-print-v1 s.241}."
  id: "Ibn Sina menjelaskan bahwa postur tidur terbaik adalah memulai dari kanan lalu berbalik ke kiri, bahwa memulai dari perut membantu pencernaan, bahwa berbaring buruk dan rentan terhadap stroke, stroke, dan mimpi buruk, serta umum bagi pasien untuk lemah karena otot yang lemah {cite:canon-ibn-sina-print-v1 hlm.241}."
