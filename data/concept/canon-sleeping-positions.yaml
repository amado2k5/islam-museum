summary:
  ar: "يبين ابن سينا أن أفضل هيئات النوم أن يبتدئ على اليمين ثم ينقلب على اليسار، وأن الابتداء على البطن يعين على الهضم، وأن الاستلقاء رديء يهيئ للسكتة والفالج والكابوس، وأنه من عادة الضعفى من المرضى لضعف عضلاتهم {cite:canon-ibn-sina-print-v1 p.241}."
  en: "Ibn Sina says the best way to sleep is to begin on the right and then turn to the left, that beginning on the belly helps digestion, and that lying on the back is poor, preparing for apoplexy, paralysis and nightmare, being the habit of the weak among the sick because of the weakness of their muscles {cite:canon-ibn-sina-print-v1 p.241}."
