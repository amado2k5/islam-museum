summary:
  ar: "أزاذدرخت شجرة كبيرة بثمرة تشبه النبق؛ فقّاحه يفتّح السدد، وثمره ضارّ بالصدر والمعدة، وعصارة أطرافه مع العسل تقاوم السموم {cite:canon-ibn-sina-print-v1 p.363} {cite:canon-ibn-sina-print-v1 p.364}."
  en: "The azadaraxt is a large tree with a fruit like the nabq. Its flower opens obstructions; its fruit harms the chest and stomach; the juice of its tips with honey counters poisons {cite:canon-ibn-sina-print-v1 p.363} {cite:canon-ibn-sina-print-v1 p.364}."
  fr: "L’azadaraxt est un grand arbre au fruit semblable au nabq. Sa fleur est décrite comme désobstruante ; son fruit nuit à la poitrine et à l’estomac ; le suc de ses extrémités, avec du miel, est présenté comme un antidote aux poisons {cite:canon-ibn-sina-print-v1 p.363} {cite:canon-ibn-sina-print-v1 p.364}."
  ur: "ازاذدرخت ایک بڑا درخت ہے جس کا پھل نبق جیسا ہوتا ہے؛ اس کا پھول رکاوٹیں کھولتا ہے، اس کا پھل سینے اور معدے کے لیے نقصان دہ ہے، اور اس کی شاخوں کا رس شہد کے ساتھ زہروں کا توڑ ہے {cite:canon-ibn-sina-print-v1 p.363} {cite:canon-ibn-sina-print-v1 p.364}۔"
  es: "El azadaraxt es un árbol grande con un fruto parecido al nabq. Su flor abre obstrucciones; su fruto daña el pecho y el estómago; el jugo de sus puntas con miel contrarresta los venenos {cite:canon-ibn-sina-print-v1 p.363} {cite:canon-ibn-sina-print-v1 p.364}."
  tr: "Azadh, jujube benzeri meyveye sahip büyük bir ağaçtır; olgunlaşması mühürü açar, meyvesi göğüs ve mideye zararlıdır ve bal ile yapılan uzuv suyu toksinlere karşı dirençlidir {cite:canon-ibn-sina-print-v1 s.363} {cite:canon-ibn-sina-print-v1 s.364}."
  id: "Azadh adalah pohon besar dengan buah yang menyerupai jujube; pematangannya membuka segel, buahnya berbahaya bagi dada dan perut, dan jus cabangnya yang mengandung madu tahan racun {cite:canon-ibn-sina-print-v1 hlm.363} {cite:canon-ibn-sina-print-v1 hlm.364}."
