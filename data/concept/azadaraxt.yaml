summary:
  ar: "أزاذدرخت شجرة كبيرة بثمرة تشبه النبق؛ فقّاحه يفتّح السدد، وثمره ضارّ بالصدر والمعدة، وعصارة أطرافه مع العسل تقاوم السموم {cite:canon-ibn-sina-print-v1 p.363} {cite:canon-ibn-sina-print-v1 p.364}."
  en: "The azadaraxt is a large tree with a fruit like the nabq. Its flower opens obstructions; its fruit harms the chest and stomach; the juice of its tips with honey counters poisons {cite:canon-ibn-sina-print-v1 p.363} {cite:canon-ibn-sina-print-v1 p.364}."
  ur: "ازاذدرخت ایک بڑا درخت ہے جس کا پھل نبق جیسا ہوتا ہے؛ اس کا پھول رکاوٹیں کھولتا ہے، اس کا پھل سینے اور معدے کے لیے نقصان دہ ہے، اور اس کی شاخوں کا رس شہد کے ساتھ زہروں کا توڑ ہے {cite:canon-ibn-sina-print-v1 p.363} {cite:canon-ibn-sina-print-v1 p.364}۔"
