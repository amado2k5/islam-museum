id: concept/maafuwwat
class: concept
kind: legal
label:
  ar: المعفوّات
  en: Excused impurities (ma'fuwwat)
  ur: معفوات ⁦(معاف نجاسات)⁩
  es: "Impurezas excusadas (ma'fuwwat)"
  fr: "Impuretés excusées (ma'fuwwat)"
  tr: "muafiyetler"
  id: "Pengecualian"
summary:
  ar: "المعفوات جمع معفوة، وهي النجاسات والأشياء التي يعفى عنها فلا تبطل بها الصلاة ولا يجب غسلها. والأصل عند الفقهاء أن كل مأمور يشق فعله سقط الأمر به، وكل منهي يشق اجتنابه سقط النهي عنه، والمشقة ثلاث مراتب: عليا يُعفى عنها بالإجماع، ودنيا لا يُعفى عنها بالإجماع، ومترددة يختلف الفقهاء في إلحاقها بإحداهما. وللحنفية تقسيم النجاسات إلى مغلظة ومخففة، فيُعفى عن قدر الدرهم من المغلظة ومن المخففة عما دون ربع الثوب، ويُعتبر في المائعات الترجيح. وللمالكية أربعة أقسام، وللشافعية أقسام تُعتبر بالقلة والكثرة وبموضع النجاسة من الماء أو الثوب، وللحنابلة أصل عدم العفو مع استثناءات، منها يسير الدم والقيح والصديد وأثر الاستجمار. وعورة المصلي شرط صحة الصلاة، وتنتقل مسائل العفو في الزكاة إلى أوقاص السائمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14788}"
  en: "Ma'fuwwat is the plural of ma'fuwwa, the things whose impurity is excused, so that prayer is not invalidated by them and they need not be washed away. The principle is that a command whose performance is hard for people drops, and a prohibition whose avoidance is hard drops too. Hardship falls into three grades: the highest, where excuse is agreed; the lowest, where none is allowed; and an intermediate grade on which jurists differ. The Hanafis divide impurities into heavy and light: a heavy impurity is excused up to the size of a dirham, and a light one up to less than a quarter of the garment. The Malikis have four categories, the Shafi'is several, judged by quantity and by whether the impurity touches water or cloth. The Hanbalis begin from no excuse and make exceptions, among them small amounts of blood, pus and matter, and traces left after istijmar. Covering the awrah is a condition of prayer, and on zakat the jurists differ over the excused margin of grazing livestock, which is treated under awqas; Abu Hanifa holds that the surplus of money over the nisab is excused up to a fifth of a nisab, and that each further fifth is excused in the same way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14788}"
  ur: "معفوات معفوۃ کی جمع ہے، یعنی وہ نجاستیں جن سے معافی ہے، اس لیے ان سے نماز باطل نہیں ہوتی اور انہیں دھونا لازم نہیں۔ اصول یہ ہے کہ جس حکم پر عمل مشقت ہو وہ ساقط ہو جاتا ہے۔ حنفیہ نجاست کو مغلظہ اور مخففہ میں بانٹتے ہیں، مالکیہ، شافعیہ اور حنابلہ کے اپنے اپنے ضابطے ہیں۔ ستر پوشی نماز کی شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14788}"
  es: "Ma'fuwwat es el plural de ma'fuwwa, las cosas cuya impureza se excusa, de modo que la oración no se invalida por ellas y no es necesario lavarlas. El principio es que un mandato cuyo cumplimiento es difícil para las personas se elimina, y una prohibición cuya evitación es difícil también se elimina. La dificultad se divide en tres grados: el más alto, donde se acepta la excusa; el más bajo, donde no se permite ninguna; y un grado intermedio sobre el cual los juristas difieren. Los hanafíes dividen las impurezas en graves y leves: una impureza grave se excusa hasta el tamaño de un dirham, y una leve hasta menos de una cuarta parte de la prenda. Los malikíes tienen cuatro categorías, los shafi'íes varias, juzgadas por la cantidad y por si la impureza toca agua o tela. Los hanbalíes parten de la ausencia total de excusa y hacen excepciones, entre ellas pequeñas cantidades de sangre, pus y materia, y rastros que quedan después del istijmar. Cubrir la awrah es una condición para la oración, y en el zakat los juristas difieren sobre el margen excusado del ganado en pastoreo, que se trata bajo awqas; Abu Hanifa sostiene que el excedente de dinero sobre el nisab está excusado hasta una quinta parte de un nisab, y que cada quinta parte adicional está excusada de la misma manera. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14780} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14781} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14782} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14783} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14784} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14786} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14787} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 pág. 14788}"
  fr: "Ma'fuwwat est le pluriel de ma'fuwwa, désignant les choses dont l'impureté est excusée, de sorte que la prière n'en est pas invalidée et qu'il n'est pas nécessaire de les laver. Le principe est qu'un commandement difficile à accomplir est abandonné, et qu'une interdiction difficile à éviter l'est également. La difficulté se divise en trois degrés: le plus élevé, pour lequel une excuse est admise; le plus bas, où aucune n'est admise; et un degré intermédiaire sur lequel les juristes divergent. Les hanafites classent les impuretés en lourdes et légères: une impureté lourde est excusée jusqu'à la taille d'un dirham, et une légère jusqu'à moins d'un quart du vêtement. Les malikites en distinguent quatre catégories, les chaféites plusieurs, jugées selon la quantité et selon que l'impureté entre en contact avec l'eau ou le tissu. Les hanbalites partent du principe qu'aucune excuse n'est admise et font des exceptions, notamment pour de petites quantités de sang, de pus et de matières, ainsi que pour les traces laissées après l'istijmar. Couvrir l'awrah est une condition de la prière, et sur la zakat, les juristes divergent quant à la marge excusée pour le pâturage du bétail, qui est traitée sous l'awqas; Abu Hanifa soutient que le surplus d'argent au-delà du nisab est excusé jusqu'à un cinquième du nisab, et que chaque cinquième supplémentaire est excusé de la même manière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14787} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.14788}"
  tr: "Affedilenler 'ma'afa' kelimesinin çoğuludur; bunlar kirli şeyler ve affedilen şeylerdir; dua geçersiz kılmaz, yıkanmamalıdır. Hukukçular arasında temel ilke, zor olan her emrin kaldırılması ve yasak olan şeyin kaçınılması zor olmasının kaldırılmasıdır. Üç seviye vardır: daha yüksek, oybirliğiyle affedilen ve dünyevi işler, oybirliğiyle affedilen ve atfedilecek konularda farklılık gösterir. Hanafiler kirleri ağır ve hafif olarak sınıflandırır, bu nedenle dirhem miktarı ağır ve hafifletilir, giysinin dörtte birinden az bir miktar için hafifletilir ve sıvılar tercih edilir. Malikilerin dört türü vardır; Şafiilerin kategorileri vardır; bunlar kıtlık, bolluk ve su ya da giysiden kaynaklanan kirlilik yerine göre değerlendirilir. Hanbaliler ise mazeretsizlik ilkesine sahiptir; hafif kanama, irin, irin ve dinlenmenin etkileri gibi istisnalar hariç. Namaz kılanın 'avresi, namazın geçerliliği için bir koşuldur ve zekattaki bağışlama meseleleri boğucu wakalara kadar uzanır. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.14780} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.14781} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14788}"
  id: "Yang dimaafkan adalah jamak dari 'ma'afa', yaitu kotoran dan hal-hal yang dimaafkan dan tidak membatalkan doa maupun harus dicuci. Prinsip dasar di kalangan ahli hukum adalah bahwa setiap perintah yang sulit dilakukan akan dicabut, dan apa pun yang dilarang sulit dihindari, larangan itu dicabut. Ada tiga tingkat: lebih tinggi, yang secara bulat dimaafkan, dan hal-hal duniawi, yang dimaafkan secara bulat, dan berbeda dalam menentukan hak untuk diberikan. Hanafi mengklasifikasikan kotoran menjadi berat dan ringan, sehingga jumlah dirham dibebaskan dari berat dan ringan kurang dari seperempat pakaian, dan preferensi diberikan pada cairan. Malik memiliki empat jenis, Shafi'i memiliki kategori, yang dipertimbangkan berdasarkan kelangkaan, kelimpahan, dan tempat kotoran dari air atau pakaian. Hanbal memiliki prinsip tidak ada alasan, dengan pengecualian, seperti pendarahan ringan, nanah, nanah, dan efek istirahat. 'Awrah orang yang berdoa adalah syarat untuk keabsahan doa, dan masalah pengampunan dalam zakat juga mencakup waqa yang menyesakkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14788}"
