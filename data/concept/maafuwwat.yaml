id: concept/maafuwwat
class: concept
kind: legal
label:
  ar: المعفوّات
  en: Excused impurities (ma'fuwwat)
  ur: معفوات (معاف نجاسات)
summary:
  ar: "المعفوات جمع معفوة، وهي النجاسات والأشياء التي يعفى عنها فلا تبطل بها الصلاة ولا يجب غسلها. والأصل عند الفقهاء أن كل مأمور يشق فعله سقط الأمر به، وكل منهي يشق اجتنابه سقط النهي عنه، والمشقة ثلاث مراتب: عليا يُعفى عنها بالإجماع، ودنيا لا يُعفى عنها بالإجماع، ومترددة يختلف الفقهاء في إلحاقها بإحداهما. وللحنفية تقسيم النجاسات إلى مغلظة ومخففة، فيُعفى عن قدر الدرهم من المغلظة ومن المخففة عما دون ربع الثوب، ويُعتبر في المائعات الترجيح. وللمالكية أربعة أقسام، وللشافعية أقسام تُعتبر بالقلة والكثرة وبموضع النجاسة من الماء أو الثوب، وللحنابلة أصل عدم العفو مع استثناءات، منها يسير الدم والقيح والصديد وأثر الاستجمار. وعورة المصلي شرط صحة الصلاة، وتنتقل مسائل العفو في الزكاة إلى أوقاص السائمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14788}"
  en: "Ma'fuwwat is the plural of ma'fuwwa, the things whose impurity is excused, so that prayer is not invalidated by them and they need not be washed away. The principle is that a command whose performance is hard for people drops, and a prohibition whose avoidance is hard drops too. Hardship falls into three grades: the highest, where excuse is agreed; the lowest, where none is allowed; and an intermediate grade on which jurists differ. The Hanafis divide impurities into heavy and light: a heavy impurity is excused up to the size of a dirham, and a light one up to less than a quarter of the garment. The Malikis have four categories, the Shafi'is several, judged by quantity and by whether the impurity touches water or cloth. The Hanbalis begin from no excuse and make exceptions, among them small amounts of blood, pus and matter, and traces left after istijmar. Covering the awrah is a condition of prayer, and on zakat the jurists differ over the excused margin of grazing livestock, which is treated under awqas; Abu Hanifa holds that the surplus of money over the nisab is excused up to a fifth of a nisab, and that each further fifth is excused in the same way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14782} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14783} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14786} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14787} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14788}"
  ur: "معفوات معفوۃ کی جمع ہے، یعنی وہ نجاستیں جن سے معافی ہے، اس لیے ان سے نماز باطل نہیں ہوتی اور انہیں دھونا لازم نہیں۔ اصول یہ ہے کہ جس حکم پر عمل مشقت ہو وہ ساقط ہو جاتا ہے۔ حنفیہ نجاست کو مغلظہ اور مخففہ میں بانٹتے ہیں، مالکیہ، شافعیہ اور حنابلہ کے اپنے اپنے ضابطے ہیں۔ ستر پوشی نماز کی شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14780} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14781} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14788}"
