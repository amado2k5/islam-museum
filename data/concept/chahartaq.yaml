label: { ar: "الجهارطاق والقبو الخراساني", en: "Chahartaq and the Khurasanian vault", ur: "چہار طاق اور خراسانی قوس", es: "Chahartaq y la bóveda de Khurasanian", fr: "Chahartaq et la voûte khurasanienne", tr: "El-Jahartaq ve Horasani Bodrumu", id: "Al-Jahartaq dan Ruang Bawah Tanah Khorasani" }
summary:
  ar: "غرفة مربعة مقببة تقوم على أربعة عقود متقاطعة، ومنها طوّر المعماريون الإيرانيون القبو الخراساني المضلع، وقد استعمله المغول في الجوامع والقبور والحمامات {cite:rezavi-iranian-influence-indian-architecture-2002 p.133} {cite:rezavi-iranian-influence-indian-architecture-2002 p.134}."
  en: "A square domed chamber on four intersecting arches, from which Iranian builders developed the ribbed Khurasanian vault, used by the Mughals in mosques, tombs and baths {cite:rezavi-iranian-influence-indian-architecture-2002 p.133} {cite:rezavi-iranian-influence-indian-architecture-2002 p.134}."
  es: "Una cámara cuadrada abovedada sobre cuatro arcos que se cruzan, a partir de la cual los constructores iraníes desarrollaron la bóveda nervada de Jorasán, utilizada por los mogoles en mezquitas, tumbas y baños {cite:rezavi-iranian-influence-indian-architecture-2002 p.133} {cite:rezavi-iranian-influence-indian-architecture-2002 p.134}."
  fr: "Une chambre carrée à coupole sur quatre arches entrecroisées, à partir de laquelle les constructeurs iraniens ont développé la voûte khurasanienne nervurée, utilisée par les Moghols dans les mosquées, les tombeaux et les bains {cite:rezavi-iranian-influence-indian-architecture-2002 p.133} {cite:rezavi-iranian-influence-indian-architecture-2002 p.134}."
  ur: "چار ایک دوسرے کو ملاتے ہوئے محرابوں پر ایک مربع گنبد والا حجرہ، جس سے ایرانی معماروں نے پسلیوں والی خراسانی والٹ تیار کی، جسے مغلوں نے مساجد، مقبروں اور حماموں میں استعمال کیا تھا صفحہ 134}۔"
  tr: "İranlı mimarların, Moğolların camilerde, türbelerde ve hamamlarda kullandığı çokgen Horasani tonozunu geliştirdiği, dört kesişen kemerle desteklenen kare tonozlu bir odadır {cite:rezavi-iranian-influence-indian-architecture-2002 s.133} {cite:rezavi-iranian-influence-indian-architecture-2002 s.134}."
  id: "Sebuah ruangan berkubah persegi yang didukung oleh empat lengkungan yang saling berpotongan, dari mana arsitek Iran mengembangkan kubah Khorasani poligonal, yang digunakan Mongol di masjid, makam, dan pemandian {cite:rezavi-iranian-influence-indian-architecture-2002 hlm.133} {cite:rezavi-iranian-influence-indian-architecture-2002 hlm.134}."
