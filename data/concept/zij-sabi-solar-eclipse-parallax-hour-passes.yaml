label: { ar: "تصحيح ساعات الاجتماع باختلاف المنظر في الطول", en: "Correcting the hour of conjunction by the parallax in longitude", ur: "طول میں اختلافِ منظر سے اجتماع کے گھنٹے کی تصحیح", es: "Corrección de la hora de conjunción mediante la paralaje en longitud.", fr: "Correction de l'heure de conjonction par la parallaxe en longitude", tr: "Görüş açısı ve uzunluktaki farklılıklara göre toplantı sürelerinin düzeltilmesi", id: "Mengoreksi waktu pertemuan berdasarkan perbedaan sudut pandang dan panjang." }
summary:
  ar: "تُعرف ساعات الاجتماع المعدلة من بعد نصف النهار، ثم يُعرف اختلاف المنظر في الطول لها على الجهة المعلومة، ويُقام الطالع ووسط السماء، ويُضرب الاختلاف الأول في سير القمر المختلف في الساعة فيخرج ساعات الاختلاف الأول. ثم تُعاد العملية بالساعات المصححة حتى يتطابق الاختلاف الثاني مع الثالث؛ وعندها تكون الساعات هي ساعات وسط الكسوف. {cite:zij-sabi-nallino-byblion pp.161-163}"
  en: "The corrected hours of conjunction are reckoned from midday. The parallax in longitude is then found for that hour on the given side, the ascendant and midheaven are erected, and the first parallax is multiplied by the Moon's hourly motion to give the first hours of parallax. The operation is repeated with the corrected hours until the second and third parallaxes agree; at that point the hours are those of mid-eclipse. {cite:zij-sabi-nallino-byblion pp.161-163}"
  ur: "اجتماع کے تصحیح شدہ گھنٹے دوپہر سے شمار ہوتے ہیں۔ پھر اس گھنٹے کے لیے طول میں اختلافِ منظر معلوم کیا جاتا ہے، طالع اور وسط السماء قائم کیے جاتے ہیں، اور پہلے اختلاف کو چاند کی فی گھنٹہ حرکت سے ضرب دے کر پہلے اختلاف کے گھنٹے ملتے ہیں۔ یہ عمل تصحیح شدہ گھنٹوں سے دہرایا جاتا ہے یہاں تک کہ دوسرا اور تیسرا اختلاف ملیں؛ تب گھنٹے وسط گرہن کے ہوتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.161-163}"
  es: "Las horas corregidas de la conjunción se calculan a partir del mediodía. A continuación, se halla la paralaje en longitud para esa hora en el lado dado, se erigen el ascendente y el medio cielo, y la primera paralaje se multiplica por el movimiento horario de la Luna para obtener las primeras horas de paralaje. La operación se repite con las horas corregidas hasta que la segunda y la tercera paralaje coincidan; en ese momento, las horas corresponden al punto medio del eclipse. {cite:zij-sabi-nallino-byblion pp.161-163}"
  fr: "Les heures corrigées de la conjonction sont calculées à partir de midi. On détermine ensuite la parallaxe en longitude pour cette heure du côté indiqué, on place l'ascendant et le milieu du ciel, et on multiplie la première parallaxe par le mouvement horaire de la Lune pour obtenir les premières heures de parallaxe. L'opération est répétée avec les heures corrigées jusqu'à ce que les deuxième et troisième parallaxes concordent; à ce moment-là, les heures sont celles du milieu de l'éclipse. {cite:zij-sabi-nallino-byblion pp.161-163}"
  tr: "Öğleden sonra, kavuşumun ayarlanmış saatleri belirlenir. Ardından, bilinen tarafta uzunluktaki paralaks farkı belirlenir. Yükselen ve zenit belirlenir ve ilk fark, ayın saat içindeki değişen hareketiyle çarpılarak ilk farkın saatleri elde edilir. Daha sonra, ikinci ve üçüncü farklar çakışana kadar düzeltilmiş saatlerle işlem tekrarlanır; bu noktada, saatler tutulmanın ortasının saatleridir. {cite:zij-sabi-nallino-byblion pp.161-163}"
  id: "Jam konjungsi yang telah disesuaikan ditentukan setelah tengah hari. Kemudian, perbedaan panjang paralaks ditentukan pada sisi yang diketahui. Ascendant dan zenit ditetapkan, dan perbedaan pertama dikalikan dengan pergerakan bulan yang bervariasi selama satu jam untuk mendapatkan jam perbedaan pertama. Proses ini kemudian diulangi dengan jam yang telah dikoreksi hingga perbedaan kedua dan ketiga bertepatan; pada titik ini, jam tersebut adalah jam pertengahan gerhana. {cite:zij-sabi-nallino-byblion pp.161-163}"
