summary:
  ar: "يرى عمر عبد الكافي أن إدخال السرور على المسلمين فرض في رمضان، وأن من يريد أن يفرج الله عنه فليفرّج عن الناس، ويستشهد بقصة الرجل الذي سقى الكلب فغفر الله له."
  en: "Omar Abdelkafy holds that bringing joy to Muslims is a duty in Ramadan, and that whoever wants God to relieve him should relieve people, citing the story of the man who gave water to a dog and was forgiven."
  ur: "عمر عبد الکافی کے نزدیک رمضان میں مسلمانوں کو خوشی پہنچانا فرض ہے، اور جو چاہے کہ اللہ اس کی مشکل دور کرے وہ لوگوں کی مشکل دور کرے؛ وہ اس شخص کے قصے سے استدلال کرتے ہیں جس نے کتے کو پانی پلایا اور بخشا گیا۔"
