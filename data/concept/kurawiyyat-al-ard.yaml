label: { ar: "كروية الأرض عند أهل الهيئة", en: "The earth's sphericity", es: "La esfericidad de la Tierra", fr: "La sphéricité de la Terre", ur: "زمین کا دائرہ", tr: "Dünyanın Otoriteye Göre Küresesi", id: "Lingkaran Bumi Menurut Otoritas" }
summary:
  ar: "يحكي المسعودي عن أهل الهيئة أن السماء على مثال الكرة تدور بكواكبها دورة الكرة، وأن الأرض بجميع أجزائها كرة مثبتة في وسط السماء كالمركز قدرها عند قدر السماء قدر النقطة في الدائرة، موضوعة في جوف الفلك كالمحّة في البيضة، والأرض جاذبة لما في الأبدان من الثقل كما يجذب حجر المغناطيس الحديد، مقسومة صفين بينهما خط الاستواء وهو طول الأرض، وعرضها من القطب الجنوبي إلى الشمالي، واستدارتها في خط الاستواء عندهم تسعة آلاف فرسخ بثلاثمائة وستين درجة كل درجة خمسة وعشرون فرسخاً، وبين خط الاستواء وكل قطب تسعون درجة {cite:muruj-al-dhahab p. 518-519}."
  en: "The astronomers' earth in al-Mas'udi's report: a sphere hung at heaven's centre like a yolk in the egg, a point against the sky's circle, drawing heavy bodies as the magnet draws iron, split by the equator — its circumference 9,000 farsakhs at 25 farsakhs the degree, ninety degrees from equator to each pole {cite:muruj-al-dhahab p. 518-519}."
  es: "La Tierra de los astrónomos en el informe de al-Mas'udi: una esfera suspendida en el centro del cielo como una yema en un huevo, un punto contra el círculo del cielo, atrayendo cuerpos pesados como el imán atrae el hierro, dividida por el ecuador; su circunferencia es de 9000 farsakhs a 25 farsakhs por grado, noventa grados desde el ecuador a cada polo {cite:muruj-al-dhahab p. 518-519}."
  fr: "La Terre des astronomes dans le rapport d'al-Mas'udi: une sphère suspendue au centre du ciel comme un jaune d'œuf, un point contre le cercle du ciel, attirant les corps lourds comme l'aimant attire le fer, divisée par l'équateur — sa circonférence de 9 000 farsakhs à 25 farsakhs par degré, quatre-vingt-dix degrés de l'équateur à chaque pôle {cite: Muruj-al-Dhahab p. 518-519}."
  ur: "المسعودی کی رپورٹ میں فلکیات دانوں کی زمین: ایک کرہ آسمان کے مرکز میں انڈے کی زردی کی طرح لٹکا ہوا ہے، آسمان کے دائرے کے خلاف ایک نقطہ، بھاری اجسام کھینچتا ہے جیسے مقناطیس لوہے کو کھینچتا ہے، خط استوا سے تقسیم ہوتا ہے - اس کا طواف 9,000 فرسخ 25 ڈگری فرسخ، 25 ڈگری فرسخ سے 90 ڈگری تک ہے۔ {حوالہ: مروج الذہب ص۱۴۲۔ 518-519}۔"
  tr: "El-Mes'udi, Konsey üyelerinden, gökyüzünün bir küre gibi gezegenleriyle birlikte bir küre içinde döndüğünü ve Dünya'nın tüm parçalarının gökyüzünün merkezinde, gökyüzünün çemberin noktası olarak ölçülen merkez gibi, gök küresindeki derinliklere yumurtadaki kıvılcım gibi yerleştirildiğini anlatır. Dünya, cisimlerdeki ağırlığı çeker; demir manyetizma da cisimlerdeki ağırlığı çeker; ekvator, Dünya'nın uzunluğu ve güney kutbundan kuzeye genişliği olan ekvatorla iki sıraya bölünmüştür. Ekvatordaki yörüngesi dokuz bin parsakh x üç yüz altmış derece, her derece yirmi beş farsakh, ekvator ile her kutup arasında doksan derece bulunur {cite:muruj-al-dhahab s. 518-519}."
  id: "Al-Mas'udi menceritakan dari orang-orang Konsili bahwa langit, seperti bola, berputar bersama planet-planetnya dalam sebuah bola, dan bahwa Bumi dalam semua bagiannya adalah bola tetap di pusat langit seperti pusatnya, diukur oleh langit sebagai titik dalam lingkaran, ditempatkan di kedalaman bola langit seperti percikan dalam telur. Bumi menarik berat di benda-benda itu begitu juga magnetisme besi, yang dibagi menjadi dua baris di antara mereka oleh khatulistiwa, yang merupakan panjang Bumi, dan lebarnya dari kutub selatan ke utara. Orbitnya di khatulistiwa adalah sembilan ribu parsakh dengan tiga ratus enam puluh derajat, setiap derajat dua puluh lima farsakh, dan antara khatulistiwa dan setiap kutub terdapat sembilan puluh derajat {cite:muruj-al-dhahab hlm. 518-519}."
