label: { ar: "كروية الأرض عند أهل الهيئة", en: "The earth's sphericity" }
summary:
  ar: "يحكي المسعودي عن أهل الهيئة أن السماء على مثال الكرة تدور بكواكبها دورة الكرة، وأن الأرض بجميع أجزائها كرة مثبتة في وسط السماء كالمركز قدرها عند قدر السماء قدر النقطة في الدائرة، موضوعة في جوف الفلك كالمحّة في البيضة، والأرض جاذبة لما في الأبدان من الثقل كما يجذب حجر المغناطيس الحديد، مقسومة صفين بينهما خط الاستواء وهو طول الأرض، وعرضها من القطب الجنوبي إلى الشمالي، واستدارتها في خط الاستواء عندهم تسعة آلاف فرسخ بثلاثمائة وستين درجة كل درجة خمسة وعشرون فرسخاً، وبين خط الاستواء وكل قطب تسعون درجة {cite:muruj-al-dhahab p. 518-519}."
  en: "The astronomers' earth in al-Mas'udi's report: a sphere hung at heaven's centre like a yolk in the egg, a point against the sky's circle, drawing heavy bodies as the magnet draws iron, split by the equator — its circumference 9,000 farsakhs at 25 farsakhs the degree, ninety degrees from equator to each pole {cite:muruj-al-dhahab p. 518-519}."
