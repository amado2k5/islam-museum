id: concept/al-musnad
class: concept
kind: term
label: { ar: "المسند الحميري", en: "The Himyarite musnad", fr: "Le musnad himyarite", es: "El himyarita musnad", ur: "حمیری مسند", tr: "El-Musnad el-Himyari", id: "El-Musnad el-Himyari" }
summary:
  ar: "قلم حمير الذي كانت تكتب به على خلاف أشكال ألف العربية وبائها وتائها، وروى ابن النديم عن ثقة سمع مشايخ من أهل اليمن يقولون ذلك، ورأى بنفسه في جزء من خزانة المأمون ترجمته القلم الحميري فأثبت مثاله على ما كان في النسخة {cite:fihrist-ibn-al-nadim p. 14}."
  en: "The Himyarite script — Ibn al-Nadim saw its exemplar in al-Ma'mun's own khizana {cite:fihrist-ibn-al-nadim p. 14}."
  fr: "L'écriture himyarite : Ibn al-Nadim en vit le modèle dans la propre bibliothèque (khizana) d'al-Ma'mun {cite:fihrist-ibn-al-nadim p. 14}."
  es: "La escritura himyarita: Ibn al-Nadim vio su modelo en la propia khizana de al-Ma'mun {citar:fihrist-ibn-al-nadim p. 14}."
  ur: "حمیری رسم الخط - ابن الندیم نے اس کا نمونہ المامون کے اپنے خزانہ میں دیکھا۔ 14}۔"
  tr: "Yazdığı Himyarit kalemi, Arap alfabesinin kısaltması ve kayıp biçimlerinin aksine, İbn el-Nadim Yemenli şeyhlerin bunu söylediğini duyan güvenilir bir kişiden anlattı ve kendisi de Himyarlı kalemi el-Memun'un kütüphanesinin bir bölümünde gördü ve el yazmasındaki örneğini doğruladı {cite:fihrist-ibn-al-nadim s. 14}."
  id: "Berbeda dengan singkatan dan bentuk alfabet Arab yang hilang yang ia tulis, Ibn al-Nadim menceritakannya dari seseorang yang dapat dipercaya yang pernah mendengar para sheikh Yaman mengatakannya, dan ia sendiri melihat pena Himyarit di bagian perpustakaan al-Mamun dan mengonfirmasi contohnya dalam manuskrip {cite:fihrist-ibn-al-nadim hlm. 14}."
