label: { ar: "المسند الحميري", en: "The Himyarite musnad" }
summary:
  ar: "قلم حمير الذي كانت تكتب به على خلاف أشكال ألف العربية وبائها وتائها، وروى ابن النديم عن ثقة سمع مشايخ من أهل اليمن يقولون ذلك، ورأى بنفسه في جزء من خزانة المأمون ترجمته القلم الحميري فأثبت مثاله على ما كان في النسخة {cite:fihrist-ibn-al-nadim p. 14}."
  en: "The Himyarite script — Ibn al-Nadim saw its exemplar in al-Ma'mun's own khizana {cite:fihrist-ibn-al-nadim p. 14}."
