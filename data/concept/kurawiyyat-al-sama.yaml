label: { ar: "كروية السماء", en: "The sphericity of the heavens" }
summary:
  ar: "يقرر الفرغاني أن السماء على مثال الكرة، تدور بجميع ما فيها من الكواكب دورة الكرة على قطبين ثابتين، أحدهما في الشمال والآخر في الجنوب، ويستدل على ذلك بأن الكواكب تطلع وتعلو وتتوسط السماء ثم تهبط، وبأن الكواكب القريبة من القطب تدور حوله في دوائر متوازية {cite:farghani-elements-astronomy p. 125}{cite:farghani-elements-astronomy p. 139}{cite:farghani-elements-astronomy p. 140}."
  en: "al-Farghani holds that the heavens are spherical and turn with all their stars as a sphere turns, about two fixed poles, north and south. His proof is that the stars rise, climb, pass the meridian and set in the same order, and that the stars near the north pole circle it in parallel paths {cite:farghani-elements-astronomy p. 125}{cite:farghani-elements-astronomy p. 139}{cite:farghani-elements-astronomy p. 140}."
