id: concept/kurawiyyat-al-sama
class: concept
kind: scientific
label: { ar: "كروية السماء", en: "The sphericity of the heavens", es: "La esfericidad de los cielos", fr: "La sphéricité des cieux", ur: "آسمانوں کا دائرہ", tr: "Gökyüzü Topu", id: "Bola langit" }
summary:
  ar: "يقرر الفرغاني أن السماء على مثال الكرة، تدور بجميع ما فيها من الكواكب دورة الكرة على قطبين ثابتين، أحدهما في الشمال والآخر في الجنوب، ويستدل على ذلك بأن الكواكب تطلع وتعلو وتتوسط السماء ثم تهبط، وبأن الكواكب القريبة من القطب تدور حوله في دوائر متوازية {cite:farghani-elements-astronomy p. 125}{cite:farghani-elements-astronomy p. 139}{cite:farghani-elements-astronomy p. 140}."
  en: "al-Farghani holds that the heavens are spherical and turn with all their stars as a sphere turns, about two fixed poles, north and south. His proof is that the stars rise, climb, pass the meridian and set in the same order, and that the stars near the north pole circle it in parallel paths {cite:farghani-elements-astronomy p. 125}{cite:farghani-elements-astronomy p. 139}{cite:farghani-elements-astronomy p. 140}."
  es: "Al-Farghani sostiene que los cielos son esféricos y giran con todas sus estrellas como una esfera, alrededor de dos polos fijos, norte y sur. Su prueba es que las estrellas salen, ascienden, pasan el meridiano y se ponen en el mismo orden, y que las estrellas cercanas al polo norte lo rodean en órbitas paralelas {cite:farghani-elements-astronomy p. 125}{cite:farghani-elements-astronomy p. 139}{cite:farghani-elements-astronomy p. 140}."
  fr: "Al-Farghani soutient que les cieux sont sphériques et que toutes leurs étoiles tournent autour de deux pôles fixes, nord et sud, comme une sphère. Il le prouve en observant que les étoiles se lèvent, montent, passent le méridien et se couchent dans le même ordre, et que les étoiles proches du pôle Nord décrivent des orbites parallèles à celui-ci {cite:farghani-elements-astronomy p. 125}{cite:farghani-elements-astronomy p. 139}{cite:farghani-elements-astronomy p. 140}."
  ur: "الفرغانی کا خیال ہے کہ آسمان کروی ہیں اور اپنے تمام ستاروں کے ساتھ ایک کرہ مڑتے ہیں، تقریباً دو متعین قطب شمالی اور جنوب۔ اس کا ثبوت یہ ہے کہ ستارے طلوع ہوتے ہیں، چڑھتے ہیں، میریڈیئن سے گزرتے ہیں اور اسی ترتیب سے ڈوبتے ہیں، اور قطب شمالی کے قریب ستارے اسے متوازی راستوں میں چکر لگاتے ہیں۔ 125}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 139}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 140}۔"
  tr: "Al-Farghani, gökyüzünün bir küre gibi tüm gezegenleriyle birlikte kuzeyde diğeri güneyde olmak üzere iki sabit kutup etrafında döndüğünü belirtir. Bunu, gezegenlerin gökyüzünde yükselip yükselip merkezlenip sonra alçaldığı, kutba yakın gezegenlerin ise kutup çevresinde paralel daireler çizerek etrafında döndüğünü göz önünde bulundurur {cite:farghani-elements-astronomy s. 125}{cite:farghani-elements-astronomy s. 139}{cite:farghani-elements-astronomy s. 140}."
  id: "Al-Farghani menyatakan bahwa langit, seperti bola, berputar bersama semua planetnya di sekitar dua kutub tetap, satu di utara dan satu lagi di selatan. Ia menyimpulkan hal ini dari fakta bahwa planet-planet tersebut naik, naik, dan berpusat di langit, lalu turun, dan planet-planet di dekat kutub berputar mengelilinginya dalam lingkaran paralel {cite:Farghani-elements-astronomy hlm. 125}{cite:farghani-elements-astronomy hlm. 139}{cite:farghani-elements-astronomy hlm. 140}."
