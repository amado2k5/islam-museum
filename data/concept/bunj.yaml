summary:
  ar: "نبات مخدّر ومسكّن، أردؤه الأسود ثم الأحمر، والأبيض أسلمه وهو المستعمل. يسكّن الأوجاع ويقطع النزف، ويُنبَّه الكتاب إلى أن أكل كمية من ورقه يخلط العقل {cite:canon-ibn-sina-print-v1 p.401}، {cite:canon-ibn-sina-print-v1 p.402}."
  en: "A narcotic, pain-easing plant. The black is the worst, then the red, and the white is the safest and the one used. It eases pain and stops bleeding, and the book warns that a sizeable amount of its leaf confuses the mind {cite:canon-ibn-sina-print-v1 p.401}, {cite:canon-ibn-sina-print-v1 p.402}."
  ur: "ایک نشہ آور اور درد کم کرنے والا پودا۔ کالا سب سے بدتر، پھر سرخ، اور سفید سب سے محفوظ اور استعمال ہونے والا ہے۔ یہ درد کم کرتا اور خون بہنا روکتا ہے، اور کتاب خبردار کرتی ہے کہ اس کے پتے کی زیادہ مقدار عقل کو متاثر کرتی ہے {cite:canon-ibn-sina-print-v1 p.401}، {cite:canon-ibn-sina-print-v1 p.402}۔"
