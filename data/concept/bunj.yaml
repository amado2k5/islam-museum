id: concept/bunj
class: concept
kind: natural
label:
  ar: "بنج"
  en: "Bunj (the editor identifies it as hemlock)"
  fr: "Bunj (identifié à la ciguë par l’éditeur)"
  ur: "بنج ⁦(شوکران)⁩"
  es: "Bunj (el editor lo identifica como cicuta)"
  tr: "anestezi"
  id: "anestesi"
summary:
  ar: "نبات مخدّر ومسكّن، أردؤه الأسود ثم الأحمر، والأبيض أسلمه وهو المستعمل. يسكّن الأوجاع ويقطع النزف، ويُنبَّه الكتاب إلى أن أكل كمية من ورقه يخلط العقل {cite:canon-ibn-sina-print-v1 p.401}، {cite:canon-ibn-sina-print-v1 p.402}."
  en: "A narcotic, pain-easing plant. The black is the worst, then the red, and the white is the safest and the one used. It eases pain and stops bleeding, and the book warns that a sizeable amount of its leaf confuses the mind {cite:canon-ibn-sina-print-v1 p.401}, {cite:canon-ibn-sina-print-v1 p.402}."
  fr: "Plante narcotique et antalgique. La noire est la pire, puis la rouge ; la blanche est la plus sûre et celle employée. Elle calmerait les douleurs et arrêterait les saignements ; le livre avertit qu’une quantité notable de feuilles trouble l’esprit {cite:canon-ibn-sina-print-v1 p.401}, {cite:canon-ibn-sina-print-v1 p.402}."
  ur: "ایک نشہ آور اور درد کم کرنے والا پودا۔ کالا سب سے بدتر، پھر سرخ، اور سفید سب سے محفوظ اور استعمال ہونے والا ہے۔ یہ درد کم کرتا اور خون بہنا روکتا ہے، اور کتاب خبردار کرتی ہے کہ اس کے پتے کی زیادہ مقدار عقل کو متاثر کرتی ہے {cite:canon-ibn-sina-print-v1 p.401}، {cite:canon-ibn-sina-print-v1 p.402}۔"
  es: "Una planta narcótica y analgésica. La negra es la peor, luego la roja, y la blanca es la más segura y la que se usa. Alivia el dolor y detiene el sangrado, y el libro advierte que una cantidad considerable de su hoja confunde la mente {cite:canon-ibn-sina-print-v1 p.401}, {cite:canon-ibn-sina-print-v1 p.402}."
  tr: "Uyuşturucu ve ağrı kesici bir bitki olan en kötüsü siyah, sonra kırmızı, beyaz ise daha güvenlidir ve kullanılır. Ağrıları yatıştırır ve kanamayı durdurur; kitap, yaprağının bir kısmını yenmenin zihni karıştırdığını uyarır {cite:canon-ibn-sina-print-v1 s.401}, {cite:canon-ibn-sina-print-v1 s.402}."
  id: "Tanaman yang membius dan analgesik, yang terburuknya hitam, lalu merah, dan putih lebih aman dan digunakan. Tanaman ini menenangkan rasa sakit dan menghentikan pendarahan, dan buku memperingatkan bahwa memakan sebagian daunnya membingungkan pikiran {cite:canon-ibn-sina-print-v1 hlm.401}, {cite:canon-ibn-sina-print-v1 hlm.402}."
