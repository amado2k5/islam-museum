id: concept/taqsim-al-akhbariyyin
class: concept
kind: term
label: { ar: "قسمة اختصاص الأخباريين", en: "The Scholars' Division of Akhbar Authority", es: "La División de Eruditos de la Autoridad Akhbar", fr: "La Division des érudits de l'Autorité Akhbar", ur: "اخبار اتھارٹی کے علماء کا ڈویژن" }
summary:
  ar: "قرأ ابن النديم بخط أحمد بن الحارث الخراز قول العلماء: أبو مخنف بأمر العراق وأخبارها وفتوحها يزيد على غيره، والمدائني بأمر خراسان والهند وفارس، والواقدي بالحجاز والسيرة، وقد اشتركوا في فتوح الشام {cite:fihrist-ibn-al-nadim p. 293}."
  en: "Abu Mikhnaf for Iraq, al-Mada'ini for Khurasan and Persia, al-Waqidi for the Hijaz and sira — all three shared Syria's conquests {cite:fihrist-ibn-al-nadim p. 293}."
  es: "Abu Mikhnaf por Irak, al-Mada'ini por Khurasan y Persia, al-Waqidi por el Hijaz y Sira: los tres compartieron las conquistas de Siria {citar:fihrist-ibn-al-nadim p. 293}."
  fr: "Abu Mikhnaf pour l'Irak, al-Mada'ini pour le Khurasan et la Perse, al-Waqidi pour le Hijaz et la Sira - tous trois ont partagé les conquêtes de la Syrie {cite:fihrist-ibn-al-nadim p. 293}."
  ur: "عراق کے لیے ابو مخنف، خراسان اور فارس کے لیے المدینی، حجاز اور سیرت کے لیے الواقدی - تینوں نے شام کی فتوحات مشترکہ کی تھیں۔ 293}۔"
