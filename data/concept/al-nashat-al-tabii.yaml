label:
  ar: النشاط الطبيعي وغير الطبيعي
  en: Natural and unnatural economic activity
  es: "Actividad económica natural y no natural"
  fr: "activité économique naturelle et non naturelle"
  ur: "قدرتی اور غیر فطری معاشی سرگرمی"
  tr: "Normal ve anormal aktivite"
  id: "Aktivitas normal dan abnormal"
summary:
  ar: "يقسم قعدات النشاط البشري إلى نشاط طبيعي ونشاط غير طبيعي {cite:qadan-manhaj-iqtisad-quran p. 61}. والنشاط الطبيعي عنده الزراعة وتربية الحيوان والاستثمار البحري، ثم التصنيع الذي يحوّل المنتج ويطوره {cite:qadan-manhaj-iqtisad-quran p. 63}{cite:qadan-manhaj-iqtisad-quran p. 66}{cite:qadan-manhaj-iqtisad-quran p. 71}{cite:qadan-manhaj-iqtisad-quran p. 73}. ويرى أن الغذاء المستورد من وراء البحار يفقد قيمته الغذائية، وأن الأرض المعطاء تحتاج إلى العمل {cite:qadan-manhaj-iqtisad-quran p. 63}. ويعدّ من صور النشاط غير الطبيعي السمسرة والاحتيال والظلم وظهور الوسطاء {cite:qadan-manhaj-iqtisad-quran p. 82}."
  tr: "İnsan faaliyetinin aşamalarını doğal ve doğal olmayan etkinlik olarak ayırır {cite:qadan-manhaj-iqtisad-kur'an s. 61}. Onun için doğal faaliyet tarım, hayvancılık ve denizcilik yatırımı, ardından üretimi içerir; bu da ürünü dönüştürür ve geliştirir {cite:qadan-manhaj-iqtisad-kur'an s. 63}{cite:qadan-manhaj-iqtisad-kuran s. 66}{cite:qadan-manhaj-iqtisad-kuran s. 71}{cite:qadan-manhaj-iqtisad-kur'an s. 73}. Yurtdışından ithal edilen gıdanın besin değerini kaybettiğine ve cömert arazinin işlenmeye ihtiyacı olduğuna inanır {cite:qadan-manhaj-iqtisad-kuran s. 63}. Anormal faaliyet biçimleri arasında aracılık, dolandırıcılık, adaletsizlik ve aracıların ortaya çıkması yer alır {cite:qadan-manhaj-iqtisad-kuran s. 82}."
  id: "Ia memisahkan tahapan aktivitas manusia menjadi aktivitas alami dan tidak alami {cite:qadan-manhaj-iqtisad-qur'an hlm. 61}. Bagi dia, aktivitas alami meliputi investasi di bidang pertanian, peternakan, dan maritim, diikuti oleh produksi; yang mengubah dan meningkatkan produk {cite:qadan-manhaj-iqtisad-qur'an hlm. 63}{cite:qadan-manhaj-iqtisad-quran hlm. 66}{cite:qadan-manhaj-iqtisad-quran hlm. 71}{cite:qadan-manhaj-iqtisad-qur'an hlm. 73}. Ia percaya bahwa makanan yang diimpor dari luar negeri kehilangan nilai gizinya dan tanah yang melimpah perlu dibudidayakan {cite:qadan-manhaj-iqtisad-quran hlm. 63}. Bentuk aktivitas yang abnormal meliputi mediasi, penipuan, ketidakadilan, dan munculnya perantara {cite:qadan-manhaj-iqtisad-quran hlm. 82}."
