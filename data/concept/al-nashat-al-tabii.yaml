summary:
  ar: "يقسم قعدات النشاط البشري إلى نشاط طبيعي ونشاط غير طبيعي {cite:qadan-manhaj-iqtisad-quran p. 61}. والنشاط الطبيعي عنده الزراعة وتربية الحيوان والاستثمار البحري، ثم التصنيع الذي يحوّل المنتج ويطوره {cite:qadan-manhaj-iqtisad-quran p. 63}{cite:qadan-manhaj-iqtisad-quran p. 66}{cite:qadan-manhaj-iqtisad-quran p. 71}{cite:qadan-manhaj-iqtisad-quran p. 73}. ويرى أن الغذاء المستورد من وراء البحار يفقد قيمته الغذائية، وأن الأرض المعطاء تحتاج إلى العمل {cite:qadan-manhaj-iqtisad-quran p. 63}. ويعدّ من صور النشاط غير الطبيعي السمسرة والاحتيال والظلم وظهور الوسطاء {cite:qadan-manhaj-iqtisad-quran p. 82}."
