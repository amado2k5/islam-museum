id: concept/mudtarib
class: concept
kind: term
label:
  ar: "المضطرب"
  en: "Mudtarib (inconsistent report)"
  es: "Mudtarib (informe inconsistente)"
  fr: "Mudtarib (rapport incohérent)"
  ur: "مضطرب ⁦(متضاد رپورٹ)⁩"
  tr: "rahatsız"
  id: "terganggu"
summary:
  ar: "المضطرب عند ابن الصلاح الحديث الذي تختلف الرواية فيه، فيرويه بعضهم على وجه وبعضهم على وجه آخر مخالف له، وإنما يسمى مضطرباً إذا تساوت الروايتان، فإن ترجحت إحداهما بحفظ راويها أو طول صحبته أو غير ذلك فالحكم للراجحة. ويقع الاضطراب في المتن وفي الإسناد، ومن راوٍ واحد أو من جماعة، وهو موجب لضعف الحديث لأنه يشعر بأنه لم يُضبط. ومثاله حديث الخط بين يدي المصلي من طريق إسماعيل بن أمية {cite:muqaddima-ibn-salah-itr p. 93-95}."
  en: "For Ibn al-Salah a mudtarib hadith is one whose narration varies, some transmitting it one way and others another, contradictory way; it is called mudtarib only when the versions are equal in strength — if one prevails through its narrator's better memory, longer companionship or another recognised ground, the ruling goes to it. Inconsistency can affect the text or the chain and can come from one narrator or several; it renders the hadith weak because it shows it was not well preserved. His example is the hadith on drawing a line before a person praying, through Isma'il ibn Umayya."
  es: "Para Ibn al-Salah, un hadiz mudtarib es aquel cuya narración varía, transmitiéndose de una forma u otra, de manera contradictoria. Se denomina mudtarib únicamente cuando las versiones tienen la misma fuerza: si una prevalece por la mejor memoria del narrador, su mayor tiempo de relación con él u otro fundamento reconocido, prevalece sobre la otra. La inconsistencia puede afectar al texto o a la cadena de transmisión y puede provenir de uno o varios narradores; debilita el hadiz porque demuestra que no se conservó bien. Su ejemplo es el hadiz sobre trazar una línea delante de una persona que reza, transmitido por Isma'il ibn Umayya."
  fr: "Pour Ibn al-Salah, un hadith mudtarib est un hadith dont la narration diverge, certains le transmettant d'une manière et d'autres d'une manière contradictoire. Il n'est qualifié de mudtarib que lorsque les versions sont d'égale force probante; si l'une prévaut grâce à une meilleure mémoire de son narrateur, une plus longue fréquentation de celui-ci ou un autre motif reconnu, c'est cette version qui prévaut. L'incohérence peut affecter le texte ou la chaîne de transmission et provenir d'un ou de plusieurs narrateurs; elle affaiblit le hadith car elle indique qu'il n'a pas été bien préservé. Il cite en exemple le hadith relatif au fait de tracer une ligne devant une personne en prière, rapporté par Ismaïl ibn Umayya."
  ur: "ابن الصلاح کے نزدیک مدثر حدیث وہ ہے جس کی روایت مختلف ہوتی ہے، بعض اسے ایک طرح سے نقل کرتے ہیں اور بعض دوسرے، متضاد طریقے سے؛ اسے مدترب صرف اسی صورت میں کہا جاتا ہے جب نسخے طاقت میں برابر ہوں - اگر کوئی اپنے راوی کی بہتر یادداشت، طویل صحبت یا کسی اور تسلیم شدہ بنیاد کے ذریعے غالب آجائے تو حکم اس پر جاتا ہے۔ تضاد متن یا سلسلہ کو متاثر کر سکتا ہے اور ایک راوی یا کئی سے آ سکتا ہے۔ یہ حدیث کو ضعیف قرار دیتا ہے کیونکہ اس سے معلوم ہوتا ہے کہ یہ اچھی طرح سے محفوظ نہیں تھی۔ اس کی مثال اسمٰعیل بن امیہ کے ذریعہ نماز پڑھنے والے کے سامنے لکیر کھینچنے کی حدیث ہے۔"
  tr: "İbn al-Salah'a göre, 'mudarrib', rivayetin farklı olduğu, bazılarının bir şekilde anlattığı, bazılarının ise çelişkili olduğu bir hadisi ifade eder. İki rivayet eşitse 'mudarab' olarak adlandırılır. Eğer biri rivayetçinin ezberlemesi, uzun arkadaşlığı veya başka bir nedenle tercih edilirse, hükmet tercih edilir. Metinde ve aktarım zincirinde, ister tek bir rivayetçiden ister bir gruptan olsun, belirsizlik oluşur ve bu da hadisin doğru doğrulanmadığı düşünülür ve zayıflamasına neden olur. Bir örnek, İsmail ibn Umayyah tarafından namaz sahabesinin önünde yazılan hadis {atı:muqaddima-ibn-salah-itr s. 93-95} verilebilir."
  id: "Menurut Ibn al-Salah, 'mudarrib' merujuk pada hadis di mana riwayatnya berbeda, dengan beberapa menceritakannya dengan satu cara dan yang lain bertentangan. Disebut 'mudarab' jika kedua riwayat itu sama. Jika salah satu disukai karena hafalan narator atau kebersamaannya yang lama, atau sebaliknya, keputusan adalah yang disukai. Ambiguitas terjadi dalam teks dan dalam rantai transmisi, baik dari satu narator maupun kelompok, yang menyebabkan kelemahan hadits karena merasa haditsnya tidak diverifikasi dengan benar. Contohnya adalah hadis yang ditulis di depan sahabat shalat melalui Ismail ibn Umayyah {cite:muqaddima-ibn-salah-itr hlm. 93-95}."
