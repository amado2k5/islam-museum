label:
  ar: "المضطرب"
  en: "Mudtarib (inconsistent report)"
summary:
  ar: "المضطرب عند ابن الصلاح الحديث الذي تختلف الرواية فيه، فيرويه بعضهم على وجه وبعضهم على وجه آخر مخالف له، وإنما يسمى مضطرباً إذا تساوت الروايتان، فإن ترجحت إحداهما بحفظ راويها أو طول صحبته أو غير ذلك فالحكم للراجحة. ويقع الاضطراب في المتن وفي الإسناد، ومن راوٍ واحد أو من جماعة، وهو موجب لضعف الحديث لأنه يشعر بأنه لم يُضبط. ومثاله حديث الخط بين يدي المصلي من طريق إسماعيل بن أمية {cite:muqaddima-ibn-salah-itr p. 93-95}."
  en: "For Ibn al-Salah a mudtarib hadith is one whose narration varies, some transmitting it one way and others another, contradictory way; it is called mudtarib only when the versions are equal in strength — if one prevails through its narrator's better memory, longer companionship or another recognised ground, the ruling goes to it. Inconsistency can affect the text or the chain and can come from one narrator or several; it renders the hadith weak because it shows it was not well preserved. His example is the hadith on drawing a line before a person praying, through Isma'il ibn Umayya."
