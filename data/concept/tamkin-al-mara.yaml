id: concept/tamkin-al-mara
class: concept
kind: social
label:
  ar: "تمكين المرأة — بين التأييد والرفض"
  en: "Women's empowerment — between support and rejection"
  es: "El empoderamiento de las mujeres: entre el apoyo y el rechazo."
  fr: "L'autonomisation des femmes — entre soutien et rejet"
  ur: "خواتین کو بااختیار بنانا - حمایت اور مسترد کرنے کے درمیان"
issue:
  ar: "هل ضعف مشاركة المرأة العربية في الحياة العامة يستدعي تمكيناً حكومياً ⁦(كوتا ومؤسسات)⁩ أم لا، وفي أي المجالات؟"
summary:
  ar: "حلقة «الوسطية» عن تمكين المرأة. صوّت الشباب أن مشاركة المرأة في الحياة العامة تبلغ 53% من الرجل — وفي الريف المصري 67% حسب ضيف {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:16:30}؛ وعلى دعم الحكومات ⁦(كوتا ووزارات ودعم اقتصادي)⁩: 35% يؤيدون و10% لا يؤيدون والباقي يؤيدون في غير السياسة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:55:00}."
  en: "The 'Al-Wasatiyya' episode on women's empowerment. The youth judged women's public-life participation at 53% of men's — and 67% in rural Egypt per a guest {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:16:30}; on government support (quota seats, ministries, economic support): 35% endorsed it, 10% rejected it, the rest endorsed it outside politics {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:55:00}."
  es: "El episodio 'Al-Wasatiyya' sobre el empoderamiento de las mujeres. {citar:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:09:00} {citar:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:16:30}; sobre el apoyo gubernamental (cuotas de escaños, ministerios, apoyo económico): el 35% lo respaldó, el 10% lo rechazó, el resto lo respaldó fuera de la política 00:55:00}."
  fr: "L'épisode « Al-Wasatiyya » sur l'autonomisation des femmes. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:16:30}; sur le soutien du gouvernement (quotas de sièges, ministères, soutien économique): 35 % l'ont soutenu, 10 % l'ont rejeté, le reste l'a soutenu en dehors de la politique 00:55:00}."
  ur: "خواتین کو بااختیار بنانے پر 'الوصطیہ' ایپی سوڈ۔ نوجوانوں نے خواتین کی عوامی زندگی میں مردوں کی 53% حصہ داری کا اندازہ لگایا — اور دیہی مصر میں 67% فی مہمان کے حساب سے۔ حکومت کی حمایت پر ⁦(کوٹہ نشستیں، وزارتیں، اقتصادی مدد)⁩: 35% نے اس کی تائید کی، 10% نے اسے مسترد کر دیا، باقی نے سیاست سے باہر اس کی توثیق کی۔ 00:55:00}۔"
