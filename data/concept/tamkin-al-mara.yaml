label:
  ar: "تمكين المرأة — بين التأييد والرفض"
  en: "Women's empowerment — between support and rejection"
issue:
  ar: "هل ضعف مشاركة المرأة العربية في الحياة العامة يستدعي تمكيناً حكومياً (كوتا ومؤسسات) أم لا، وفي أي المجالات؟"
summary:
  ar: "حلقة «الوسطية» عن تمكين المرأة. صوّت الشباب أن مشاركة المرأة في الحياة العامة تبلغ 53% من الرجل — وفي الريف المصري 67% حسب ضيف {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:16:30}؛ وعلى دعم الحكومات (كوتا ووزارات ودعم اقتصادي): 35% يؤيدون و10% لا يؤيدون والباقي يؤيدون في غير السياسة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:55:00}."
  en: "The 'Al-Wasatiyya' episode on women's empowerment. The youth judged women's public-life participation at 53% of men's — and 67% in rural Egypt per a guest {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:16:30}; on government support (quota seats, ministries, economic support): 35% endorsed it, 10% rejected it, the rest endorsed it outside politics {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:01:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep14 00:55:00}."
