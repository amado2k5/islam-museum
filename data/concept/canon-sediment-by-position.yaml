label: { ar: "دلالة الرسوب من وضعه ومكانه عند ابن سينا", en: "What sediment shows by its smoothness and its place in the flask in the Canon", ur: "ہمواری اور برتن میں جگہ کے لحاظ سے تلچھٹ کی دلالت قانون میں" }
summary:
  ar: "يذكر ابن سينا أن الملاسة والاستواء محمودان في المحمود وأردأ في المذموم، وأن الرسوب طافٍ ويسمى غماماً أو متعلق أو راسب، وأن الراسب أنضج في المحمود وأن الأخف أصلح في المذموم. {cite:canon-ibn-sina-print-v1 p.196}."
  en: "Ibn Sina says smoothness and evenness are praised in good sediment and worse in bad, and that sediment floats, called cloud, hangs, or settles; the settled is more matured in good sediment and the lighter is better in bad. {cite:canon-ibn-sina-print-v1 p.196}."
