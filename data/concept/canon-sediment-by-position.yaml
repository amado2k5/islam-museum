id: concept/canon-sediment-by-position
class: concept
kind: scientific
label:
  ar: "دلالة الرسوب من وضعه ومكانه عند ابن سينا"
  en: "What sediment shows by its smoothness and its place in the flask in the Canon"
  fr: "Sédiment selon sa surface et sa place dans le flacon dans le Canon"
  ur: "ہمواری اور برتن میں جگہ کے لحاظ سے تلچھٹ کی دلالت قانون میں"
  es: "Lo que el sedimento muestra por su suavidad y su lugar en el frasco en el Canon"
  tr: "İbn Sina'ya göre konumundan ve konumundan başarısızlığın anlamı"
  id: "Makna kegagalan dari posisi dan posisinya menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن الملاسة والاستواء محمودان في المحمود وأردأ في المذموم، وأن الرسوب طافٍ ويسمى غماماً أو متعلق أو راسب، وأن الراسب أنضج في المحمود وأن الأخف أصلح في المذموم. {cite:canon-ibn-sina-print-v1 p.196}."
  en: "Ibn Sina says smoothness and evenness are praised in good sediment and worse in bad, and that sediment floats, called cloud, hangs, or settles; the settled is more matured in good sediment and the lighter is better in bad. {cite:canon-ibn-sina-print-v1 p.196}."
  fr: "Ibn Sina juge surface lisse et régularité favorables dans un bon sédiment, défavorables dans un mauvais. Le sédiment flotte, alors nommé nuage, reste suspendu ou se dépose ; le dépôt est le plus mûr des bons, le plus léger le meilleur des mauvais. {cite:canon-ibn-sina-print-v1 p.196}."
  es: "Ibn Sina afirma que la suavidad y la uniformidad se elogian en los sedimentos buenos y se desaniman en los malos, y que los sedimentos flotan (se denominan nubes), se acumulan o se asientan; los sedimentos asentados son más maduros en los buenos y los sedimentos más ligeros son mejores en los malos. {cite:canon-ibn-sina-print-v1 p.196}."
  ur: "ابن سینا کا کہنا ہے کہ ہمواری اور یکسانیت کی تعریف اچھی تلچھٹ میں کی جاتی ہے اور خراب میں بدتر، اور یہ تلچھٹ تیرتی ہے جسے بادل کہتے ہیں، لٹکتی ہے یا جم جاتی ہے۔ آباد اچھی تلچھٹ میں زیادہ پختہ ہوتا ہے اور ہلکا خراب میں بہتر ہوتا ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 196}۔"
  tr: "İbn Sina, al-Mussa ve al-tisawa'nın övgüyle övüldüğünü, suçlu olarak daha kötü olduğunu ve yatakların bulut, asılı veya biriktirilmiş olarak adlandırıldığını, yatakların övgüde daha olgun, suçlu olarak daha hafif olduğunu belirtir. {cite:canon-ibn-sina-print-v1 s.196}."
  id: "Ibn Sina menyebutkan bahwa al-mussa dan al-tisawa dipuji dalam pujian dan lebih buruk lagi dalam pujian yang patut disalahkan, dan bahwa deposit mengapung dan disebut awan, menggantung, atau disimpan, dan bahwa deposit lebih matang dalam pujian dan lebih ringan dalam hal yang patut disalahkan. {cite:canon-ibn-sina-print-v1 hlm.196}."
