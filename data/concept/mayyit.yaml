id: concept/mayyit
class: concept
kind: legal
label: { ar: "المَيِّت ⁦(أحكام الميت)⁩", en: "The dead person (mayyit) and the rules of the funeral", ur: "میت اور اس کے احکام", es: "La persona fallecida (mayyit) y las reglas del funeral", fr: "Le défunt (mayyit) et les règles des funérailles", tr: "Ölüler (Ölüler Üzerine Kararlar)", id: "Orang Mati (Putusan tentang Orang Mati)" }
summary:
  ar: "الميت في اللغة من فارق الحياة، ويُخفف ويُشدد. ومن أحكامه المتفق عليها استحباب تغميض عينيه، وشد لحييه وتليين مفاصله، وتوجيهه إلى القبلة بكيفيات مختلفة، وستر بدنه عند الغسل، وفرضية غسله وتكفينه وحمله ودفنه على الكفاية. ومن المختلف فيه تقبيل وجهه وتلقينه بالشهادة، وغسله بالجنب والحائض، وقراءة القرآن عنده، ونبش قبره ونقله بعد الدفن، وحد قذفه، وطهارة جسده وما أبين منه، والصلاة على ما وجد من بعضه، وتنازع الماء بينه وبين الأحياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15393}"
  en: "The dead (mayyit) is one who has left life; the word is pronounced with or without doubling its y. Its rules agreed by the jurists include closing the eyes, tying the jaw, softening the joints, turning the body towards the qibla in different ways, covering the body while washing, and the duty of washing, shrouding, carrying and burying it as a collective obligation. Differences exist on kissing the face, prompting the testimony of faith, washing by a person in major or menstrual impurity, reading the Qur'an near the body, exhuming or moving the grave, the punishment for slandering the dead, the purity of the body and its parts, the prayer over part of a body, and the competing claims of the dead and the living to water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15393}"
  ur: "میت وہ ہے جو زندگی سے جدا ہو چکا ہو۔ اس کے متفق علیہ احکام میں آنکھیں بند کرنا، ٹھوڑی باندھنا، جوڑ نرم کرنا، قبلہ رخ کرنا، اور غسل کے وقت بدن کو ڈھانپنا شامل ہیں، جبکہ غسل، کفن، جنازہ اور دفن فرضِ کفایہ ہیں۔ میت کو بوسہ دینے، تلقین، جنب و حائض کے غسل، قبر کشائی، حد قذف اور جسم کی طہارت جیسے مسائل میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391}"
  es: "El difunto (mayyit) es aquel que ha dejado la vida; la palabra se pronuncia con o sin doble y. Sus normas, acordadas por los juristas, incluyen cerrar los ojos, atar la mandíbula, ablandar las articulaciones, orientar el cuerpo hacia la qibla de diferentes maneras, cubrir el cuerpo durante el lavado y el deber de lavarlo, amortajarlo, transportarlo y enterrarlo como una obligación colectiva. Existen diferencias en cuanto a besar el rostro, solicitar la profesión de fe, lavar por una persona en estado de impureza mayor o menstrual, leer el Corán cerca del cuerpo, exhumar o trasladar la tumba, el castigo por calumniar al difunto, la pureza del cuerpo y sus partes, la oración sobre una parte del cuerpo y las reclamaciones contrapuestas de los muertos y los vivos sobre el agua. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15380} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15381} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15382} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15383} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15384} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15385} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.15387} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15388} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15389} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15390} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15392} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15393}"
  fr: "Le défunt (mayyit) est celui qui a quitté la vie; ce mot se prononce avec ou sans double « y ». Les règles funéraires, reconnues par les juristes, comprennent la fermeture des yeux, le bandage de la mâchoire, l’assouplissement des articulations, l’orientation du corps vers la qibla selon différentes méthodes, le fait de couvrir le corps pendant la toilette mortuaire, et le devoir collectif de laver, envelopper, transporter et enterrer le défunt. Des divergences existent quant au baiser sur le visage, à l’invitation à la profession de foi, à la toilette mortuaire pour une personne en état d’impureté majeure ou menstruelle, à la récitation du Coran près du corps, à l’exhumation ou au déplacement de la tombe, à la punition pour la calomnie envers le défunt, à la pureté du corps et de ses parties, à la prière sur une partie du corps, et aux droits respectifs des défunts et des vivants à l’eau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.15387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15393}"
  tr: "Dilbilimde, vefat eden kişi vefat eden kişidir ve bu durum hafifletilip sıkılaştırılır. Üzerinde anlaşılan kurallar arasında gözlerin kapatılması, sakalının sıkılması, eklemlerinin yumuşaması, çeşitli şekillerde kıbleye yönlendirilmesi, yıkanırken bedeninin örtülmesi, yıkanması, örtünmesi, taşıması ve toplu koşullarda gömülmesi gibi tavsiyeler yer alır. Tartışmalı görüşler arasında yüzünü öpmek ve ona tanıklığı öğretmek, onu güngel ve regl kadınlarla yıkamak, Kur'an okumak, mezarını kazıp gömüldükten sonra taşımak, atmanın cezası, bedenini ve ondan görünenleri arındırmak, bazı yerlerde bulunanlar için dua etmek ve kendisi ile yaşayanlar arasındaki su anlaşmazlığı yer alır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15382}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15393}"
  id: "Dalam linguistik, almarhum adalah orang yang meninggal, dan ia menjadi lebih ringan dan diperkuat. Di antara aturan yang disepakati adalah rekomendasi untuk menutup mata, mengetatkan jenggot, melunakkan sendi, mengarahkannya ke kibla dengan berbagai cara, menutupi tubuhnya saat mandi, kewajiban mencuci, menutupi, menggendongnya, dan menguburkannya dalam kondisi bersama. Di antara pendapat yang diperdebatkan adalah mencium wajahnya dan mengajarinya kesaksian, membasuhnya dengan janubah dan wanita yang sedang menstruasi, membaca Al-Qur'an bersamanya, menggali kuburnya dan memindahkannya setelah dimakamkan, hukuman untuk melemparkannya, memurnikan tubuhnya dan apa yang terlihat darinya, berdoa untuk apa yang ditemukan di beberapa bagian, serta perselisihan air antara dia dan orang hidup. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15393}"
