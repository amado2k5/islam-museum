id: concept/mayyit
class: concept
kind: legal
label: { ar: "المَيِّت (أحكام الميت)", en: "The dead person (mayyit) and the rules of the funeral", ur: "میت اور اس کے احکام" }
summary:
  ar: "الميت في اللغة من فارق الحياة، ويُخفف ويُشدد. ومن أحكامه المتفق عليها استحباب تغميض عينيه، وشد لحييه وتليين مفاصله، وتوجيهه إلى القبلة بكيفيات مختلفة، وستر بدنه عند الغسل، وفرضية غسله وتكفينه وحمله ودفنه على الكفاية. ومن المختلف فيه تقبيل وجهه وتلقينه بالشهادة، وغسله بالجنب والحائض، وقراءة القرآن عنده، ونبش قبره ونقله بعد الدفن، وحد قذفه، وطهارة جسده وما أبين منه، والصلاة على ما وجد من بعضه، وتنازع الماء بينه وبين الأحياء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15393}"
  en: "The dead (mayyit) is one who has left life; the word is pronounced with or without doubling its y. Its rules agreed by the jurists include closing the eyes, tying the jaw, softening the joints, turning the body towards the qibla in different ways, covering the body while washing, and the duty of washing, shrouding, carrying and burying it as a collective obligation. Differences exist on kissing the face, prompting the testimony of faith, washing by a person in major or menstrual impurity, reading the Qur'an near the body, exhuming or moving the grave, the punishment for slandering the dead, the purity of the body and its parts, the prayer over part of a body, and the competing claims of the dead and the living to water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15393}"
  ur: "میت وہ ہے جو زندگی سے جدا ہو چکا ہو۔ اس کے متفق علیہ احکام میں آنکھیں بند کرنا، ٹھوڑی باندھنا، جوڑ نرم کرنا، قبلہ رخ کرنا، اور غسل کے وقت بدن کو ڈھانپنا شامل ہیں، جبکہ غسل، کفن، جنازہ اور دفن فرضِ کفایہ ہیں۔ میت کو بوسہ دینے، تلقین، جنب و حائض کے غسل، قبر کشائی، حد قذف اور جسم کی طہارت جیسے مسائل میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15391}"
