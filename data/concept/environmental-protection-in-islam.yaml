  en: "Environmental protection in Islam"
  es: "Protección del medio ambiente en el Islam"
  fr: "La protection de l'environnement en islam"
  ur: "اسلام میں ماحولیاتی تحفظ"
summary:
  ar: "يرى محيي الدين عفيفي أحمد أن تلوث الماء والهواء والأرض يهدد سلامة الأفراد والمجتمعات، وأن قرارات المؤتمرات الدولية لم تُنفَّذ {cite:nazarat-mawdu-iyya-azhar p. 119}. ويعرض أن الإسلام حرص على أن يحسن الناس استغلال بيئتهم الطبيعية، وأن يتعايشوا معها بما يحفظ مقوماتها {cite:nazarat-mawdu-iyya-azhar p. 120}، وأن الآيات التي تتناول الكون تدعو إلى التفكر في العلاقة بين الإنسان والكون {cite:nazarat-mawdu-iyya-azhar p. 121}. هذه قراءة الكاتب، وقد يستعين القارئ بمصادر أخرى في تفصيلها."
  en: "Muhyi al-Din Afifi Ahmad holds that pollution of water, air and land threatens people and societies, and that resolutions of international conferences were not carried out (p. 119). He presents Islam as asking people to use their natural environment well and to live with it so as to keep its essentials (p. 120), and reads the Qur'anic passages on the cosmos as calling for reflection on the relation between humans and creation (p. 121). These are the author's readings; further sources are needed for detail."
  es: "Muhyi al-Din Afifi Ahmad sostiene que la contaminación del agua, el aire y la tierra amenaza a las personas y a las sociedades, y que las resoluciones de las conferencias internacionales no se han cumplido (p. 119). Presenta el islam como una exhortación a utilizar el medio ambiente natural de forma responsable y a convivir con él para preservar sus elementos esenciales (p. 120), e interpreta los pasajes coránicos sobre el cosmos como una invitación a reflexionar sobre la relación entre los seres humanos y la creación (p. 121). Estas son las interpretaciones del autor; se necesitan más fuentes para mayor detalle."
  fr: "Muhyi al-Din Afifi Ahmad soutient que la pollution de l'eau, de l'air et des sols menace les populations et les sociétés, et que les résolutions des conférences internationales n'ont pas été appliquées (p. 119). Il présente l'islam comme un appel à bien utiliser l'environnement naturel et à vivre en harmonie avec lui afin d'en préserver les ressources essentielles (p. 120), et interprète les passages coraniques relatifs au cosmos comme une invitation à la réflexion sur la relation entre l'homme et la création (p. 121). Telles sont les interprétations de l'auteur; des sources complémentaires sont nécessaires pour approfondir son propos."
  ur: "محی الدین عفیفی احمد کا خیال ہے کہ پانی، ہوا اور زمین کی آلودگی سے لوگوں اور معاشروں کو خطرہ لاحق ہے اور بین الاقوامی کانفرنسوں کی قراردادوں پر عمل نہیں کیا گیا ⁦(ص 119)⁩۔ وہ اسلام کو لوگوں سے اپنے فطری ماحول کو اچھی طرح سے استعمال کرنے اور اس کے ساتھ زندگی گزارنے کے لیے کہتا ہے تاکہ اس کی ضروریات کو برقرار رکھا جا سکے ⁦(صفحہ 120)⁩، اور کائنات پر قرآنی اقتباسات کو پڑھ کر انسانوں اور مخلوق کے درمیان تعلق پر غور کرنے کی دعوت دیتا ہے ⁦(ص 121)⁩۔ یہ مصنف کے پڑھنے ہیں؛ تفصیل کے لیے مزید ذرائع درکار ہیں۔"
