summary:
  ar: "يرى محيي الدين عفيفي أحمد أن تلوث الماء والهواء والأرض يهدد سلامة الأفراد والمجتمعات، وأن قرارات المؤتمرات الدولية لم تُنفَّذ {cite:nazarat-mawdu-iyya-azhar p. 119}. ويعرض أن الإسلام حرص على أن يحسن الناس استغلال بيئتهم الطبيعية، وأن يتعايشوا معها بما يحفظ مقوماتها {cite:nazarat-mawdu-iyya-azhar p. 120}، وأن الآيات التي تتناول الكون تدعو إلى التفكر في العلاقة بين الإنسان والكون {cite:nazarat-mawdu-iyya-azhar p. 121}. هذه قراءة الكاتب، وقد يستعين القارئ بمصادر أخرى في تفصيلها."
  en: "Muhyi al-Din Afifi Ahmad holds that pollution of water, air and land threatens people and societies, and that resolutions of international conferences were not carried out (p. 119). He presents Islam as asking people to use their natural environment well and to live with it so as to keep its essentials (p. 120), and reads the Qur'anic passages on the cosmos as calling for reflection on the relation between humans and creation (p. 121). These are the author's readings; further sources are needed for detail."
