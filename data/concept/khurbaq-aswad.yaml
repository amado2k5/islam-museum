summary:
  ar: "خربق أسود في الكتاب نبات ينقل الكتاب وصفه عن ديسقوريدوس، ورقه أخضر شبيه بورق الدلب إلا أنه أصغر وأكبر تشريفا، وزهره أبيض فيه لون فرفيري، وعروقه دقاق سود من أصل واحد، وتستعمل عروقه وحدها، وينبت في مواضع خشنة وكهوف وتلول؛ حار يابس إلى الثالثة محلل ملطف قوي الجلاء، يطلى على البهق والجرب والقوابي، وينفع من الفالج وأوجاع المفاصل ومن أمراض الرأس والماليخوليا والصرع، ويقوي البصر في الأكحال، وينفع من السوداء ويسهلها وكل فضل يخالط الدم، ويدر البول، ويذكر الكتاب بدله وتركت المقادير والطرق، ويورد قولا عن الطمث في فقرة موسومة معلقة لحكم المؤسس، وكل ما ورد هنا نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 pp.704-705}"
  en: "Khurbaq aswad is in the book a plant whose description is taken from Dioscorides, its leaf green and like the leaf of the plane but smaller and more deeply cut, its flower white with a purple tint, its roots thin and black from one origin, only the roots being used, and it grows in rough places, caves and hills; hot and dry to the third degree, dissolving, subtilising and strongly cleansing, it is applied on bahaq, mange and ringworm, benefits palsy, joint pains, diseases of the head, melancholia and epilepsy, strengthens sight in kohls, benefits and loosens black bile and every superfluity mixed with the blood, and promotes urine; the book names its substitutes, and the amounts and methods are left out, the book gives a statement on menses in a labelled section held for the founder's ruling, and everything given here is a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 pp.704-705}"
  ur: "خربق اسود کتاب میں ایک نبات ہے جس کا وصف دیسقوریدوس سے نقل ہے، پتا سبز، چنار کے پتے جیسا مگر اس سے چھوٹا اور زیادہ کٹاؤ والا، پھول سفید جس میں ارغوانی رنگت ہے، جڑیں باریک سیاہ ایک ہی اصل سے، اور صرف اس کی جڑیں استعمال ہوتی ہیں، اور کھردری جگہوں، غاروں اور ٹیلوں میں اگتا ہے؛ تیسرے درجے تک گرم خشک، تحلیل کرنے والا، لطیف کرنے والا اور سخت جلا دینے والا، بہق، خارش اور قوباء پر لگایا جاتا ہے، فالج، جوڑوں کے دردوں، سر کی بیماریوں، مالیخولیا اور مرگی میں نافع ہے، سرموں میں نظر کو قوت دیتا ہے، سودا اور خون سے ملی ہر فاضل چیز میں نافع اور اسے دست سے نکالتا ہے، اور پیشاب لاتا ہے؛ کتاب اس کا بدل بتاتی ہے، مقداریں اور طریقے چھوڑ دیے گئے، حیض کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے، اور یہاں جو کچھ آیا وہ کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 pp.704-705}۔"
  es: "Khurbaq aswad es en el libro una planta cuya descripción se toma de Dioscórides, su hoja verde y como la hoja del plátano pero más pequeña y más profundamente lobulada, su flor blanca con un tinte púrpura, sus raíces delgadas y negras de un solo origen, solo se usan las raíces, y crece en lugares ásperos, cuevas y colinas; caliente y seco al tercer grado, disolvente, sutilizante y fuertemente limpiador, se aplica en bahaq, sarna y tiña, beneficia la parálisis, dolores articulares, enfermedades de la cabeza, melancolía y epilepsia, fortalece la vista en kohls, beneficia y fluidifica la bilis negra y toda superfluidad mezclada con la sangre, y promueve la orina; El libro menciona sus sustitutos, pero omite las cantidades y los métodos; el libro ofrece una declaración sobre la menstruación en una sección etiquetada reservada para la decisión del fundador; y todo lo que se presenta aquí es un informe atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 pp.704-705}."
  fr: "Le Khurbaq aswad est décrit dans le livre comme une plante rapportée par Dioscoride. Ses feuilles, vertes comme celles du platane mais plus petites et plus profondément découpées, ont des fleurs blanches teintées de pourpre. Ses racines, fines et noires, proviennent d'une seule origine; seules les racines sont utilisées. Cette plante pousse dans les lieux accidentés, les grottes et les collines. Chaude et sèche au troisième degré, elle dissout, subtilise et purifie intensément. Appliquée sur le bahaq, la gale et la teigne, elle soulage la paralysie, les douleurs articulaires, les affections de la tête, la mélancolie et l'épilepsie. Elle fortifie la vue dans les khôls, favorise la bile noire et élimine tout excès mêlé au sang, et stimule la diurèse. Le livre mentionne ses substituts, mais omet les quantités et les méthodes d'utilisation. Une section, réservée à l'avis du fondateur, contient une déclaration concernant les menstruations. Tout ce qui est rapporté ici est une attribution au livre, et non une recommandation. {cite:canon-ibn-sina-print-v1 pp.704-705}"
  tr: "Kitaptaki siyah karabe, Dioscorides tarafından tanımlanan bir bitkidir. Yaprağı Dalb yaprağına benzer yeşil renktedir ama daha küçük ve daha onurludur. Çiçeği beyazdır ve fefir rengindedir. Damarları siyah ve aynı kökenlidir, damarları tek başına kullanılır. Zorlu yerlerde, mağaralarda ve tepelerde; sıcak ve kuru yetişir. Güçlü bir yatıştırıcı ve rahatlatıcıdır, vitiligo, uyuz ve fırfırları kaplar, felç, eklem ağrısı, baş hastalıkları, miyelya ve epilepsi için faydalıdır. Sürmelerde görüşü güçlendirir, siyahın faydasını sağlar ve kanla karışan tüm erdemleri kolaylaştırır. İdrara çıkmaya neden olur ve kitapta bunun yerine geçen maddeden bahsedilir, miktarlar ve yöntemler ise atlanır ve 'Kurucu Kuralı' başlıklı bölümde adet hakkında bir ifade alıntı yapar. Burada bahsedilen her şey kitaba atfedilir, bir öneri değildir {cite:canon-ibn-sina-print-v1 s.704-705}"
  id: "Cangkang hitam dalam buku ini adalah tanaman yang dideskripsikan oleh Dioscorides. Daunnya berwarna hijau mirip dengan daun Dalb tetapi lebih kecil dan lebih terhormat. Bunganya berwarna putih dengan warna fephyrian. Pembuluh darahnya berwarna hitam dan berasal dari sumber yang sama, dan pembuluh darahnya digunakan sendiri. Tumbuh di tempat yang kasar, gua, dan bukit; panas dan kering. Ini adalah agen penenang yang kuat dan menenangkan, melapisi vitiligo, kudis, dan ruffles, serta bermanfaat untuk kelumpuhan, nyeri sendi, penyakit kepala, mielia, dan epilepsi. Ia memperkuat penglihatan pada kohl, mendapat manfaat dari warna hitam dan memfasilitasinya, serta semua kebajikan yang bercampur dengan darah. Ia menyebabkan buang air kecil, dan buku menyebutkan penggantinya, sementara jumlah dan metode tidak disebutkan, dan mengutip pernyataan tentang menstruasi dalam bagian berjudul 'Aturan Pendiri.' Semua yang disebutkan di sini dikaitkan dengan buku, bukan rekomendasi {cite:canon-ibn-sina-print-v1 hlm.704-705}"
