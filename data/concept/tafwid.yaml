  id: ibn-taymiyya-hamawiyya
  stance:
    ar: السلف نفوا علم الكيفية لا حقيقة الصفة، فالإثبات قائم مع نفي الكيف
    en: The early scholars negated only knowledge of the manner, not the reality of the attribute
  summary:
    ar: يستدل ابن تيمية في الحموية، كما يورده المحقق في الهوامش، بأن قول السلف «الاستواء غير مجهول والكيف غير معقول» يدل على أن المعنى معلوم، وإلا لكان الاستواء مجهولًا كحروف المعجم.
    en: In al-Hamawiyya, as quoted by the editor, Ibn Taymiyya argues that the saying 'istiwa' is not unknown, the manner is not conceived' shows the meaning is known; otherwise istiwa' would be unknown
      like letters of the alphabet.
