issue:
  ar: هل يكفي إثبات ألفاظ الصفات مع تفويض كيفيتها، أم يلزم إثبات معانيها على ما يليق بالله؟
  en: Is it enough to affirm the words of the attributes and delegate their manner, or must their meanings be affirmed as befitting God?
perspectives:
- tradition: sunni-hanbali
  id: lumat-al-itiqad
  stance:
    ar: إثبات الألفاظ وترك التعرض للمعنى والكيفية والرد والتأويل، مع تفويض علم الكيفية إلى الله
    en: Affirm the words, do not inquire into the meaning or manner, reject interpretation, delegate the manner to God
  summary:
    ar: يقول ابن قدامة إن ما أشكل من الصفات يجب إثباته لفظًا وترك التعرض لمعناه، ويُنسب ذلك إلى السلف (الشافعي، وأحمد، ومالك، وسفيان الثوري، والأوزاعي وغيرهم) بعبارة «أمروها كما جاءت بلا كيف»، وينكر طريقة
      المتكلمين في التأويل.
    en: Ibn Qudama holds that what is unclear among the attributes must be affirmed as words, without inquiry into their meaning, and ascribes this to the early scholars, quoting al-Shafi'i, Ahmad, Malik
      and al-Thawri with the formula 'let them pass as they came, without how'; he rejects the theologians' interpretation.
