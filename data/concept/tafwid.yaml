label:
  ar: التفويض في الصفات
  en: Tafwid (delegating the knowledge of the manner of the attributes)
summary:
  ar: 'إثبات ألفاظ الصفات الواردة في القرآن والسنة مع ترك التعرض لكيفيتها وتفويض علمها إلى الله، كما يقرر ابن قدامة في لمعة الاعتقاد؛ وفي الباب خلاف بين أهل السنة في تفسير أقوال السلف: هل نفوا العلم بالمعنى
    أو بالكيفية فقط.'
  en: Affirming the words of the attributes in the Qur'an and the Sunna while not inquiring into their manner, and delegating knowledge of their reality to God, as Ibn Qudama sets out in Lum'at al-i'tiqad;
    Sunni scholars differ on whether the early generations denied knowledge of the meaning or only of the manner.
wings: [ideas]
