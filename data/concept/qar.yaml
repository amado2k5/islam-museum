label:
  ar: "قرع"
  en: "Qar' (gourd, per the editor's note yaqtin)"
  ur: "قرع"
  es: "Qar' (calabaza, según la nota del editor yaqtin)"
  fr: "Qar' (gourde, selon la note de l'éditeur yaqtin)"
  tr: "Kabak"
  id: "Labu"
summary:
  ar: "القرع في الكتاب بارد رطب في الثانية، يغذو غذاء يسيرا سريع الانحدار، ضار لأصحاب السوداء والبلغم جيد للصفراويين، وعصارته تسكن وجع الأذن الحار، وفي الحاشية أنه اليقطين، وهو شديد المضرة بالأمعاء والقولون {cite:canon-ibn-sina-print-v1 p.656}"
  en: "Qar' is in the book cold and moist in the second degree, giving little nourishment and quick to descend, harmful to the black-bilious and the phlegmatic and good for the bilious; its juice calms hot earache; the editor's note says it is yaqtin; it is very harmful to the intestines and the colon {cite:canon-ibn-sina-print-v1 p.656}"
  ur: "قرع کتاب میں دوسرے درجے میں ٹھنڈا تر ہے، تھوڑی غذا دیتا اور جلد نیچے اترتا ہے، سوداوی اور بلغمی مزاج والوں کے لیے مضر اور صفراوی مزاج والوں کے لیے اچھا ہے؛ اس کا رس گرم کان کے درد کو تسکین دیتا ہے؛ حاشیے کے مطابق یہ یقطین ہے؛ اور آنتوں اور قولون کے لیے بہت مضر ہے {cite:canon-ibn-sina-print-v1 p.656}۔"
  es: "En el libro, Qar' es frío y húmedo en segundo grado, aporta poco alimento y desciende rápidamente, es perjudicial para los biliosos negros y los flemáticos, y beneficioso para los biliares; su jugo calma el dolor de oído caliente; la nota del editor dice que es yaqtin; es muy perjudicial para los intestinos y el colon {cite:canon-ibn-sina-print-v1 p.656}"
  fr: "Le Qar' est décrit dans le livre comme froid et humide au deuxième degré, peu nourrissant et à descente rapide, nuisible aux bilieux noirs et aux flegmatiques et bénéfique aux bilieux; son jus calme les maux d'oreille brûlants; la note de l'éditeur indique qu'il s'agit de yaqtin; il est très nocif pour les intestins et le côlon {cite:canon-ibn-sina-print-v1 p.656}"
  tr: "Kitaptaki balkabağı saniyeler içinde soğuk ve nemlenir, hafif ve hızlı bozulan bir yiyeceği besler, siyah ve balgamlı insanlar için zararlıdır, safra için iyidir, suyu sıcak kulak ağrısını hafifletir ve dipnotta kabak vardır, bu da bağırsaklar ve kolon için çok zararlıdır {cite:canon-ibn-sina-print-v1 s.656}"
  id: "Labu dalam buku ini dingin dan lembap dalam hitungan detik, memberi makan makanan ringan dan cepat menguraikan, berbahaya bagi orang yang mengalami hitam dan lendir, baik untuk empedu, jusnya meredakan sakit telinga panas, dan dalam catatan kaki adalah labu, yang sangat berbahaya bagi usus dan usus besar {cite:canon-ibn-sina-print-v1 hlm.656}"
