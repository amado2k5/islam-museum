summary:
  ar: "خولنجان في الكتاب قطع ملتوية حمر وسود حاد المذاق، له رائحة طيبة خفيف الوزن، يؤتى به من بلاد الصين، ويقول ماسرجويه إنه خسرودارو بعينه؛ حار يابس في الثانية، لطيف محلل للرياح، يطيب النكهة، جيد للمعدة هاضم للطعام، وينفع من القولنج ووجع الكلى، وفيه نقل موسوم عن الباه في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.709}"
  en: "Khawlanjan is in the book twisted pieces, red and black, sharp in taste, of a good smell and light in weight, brought from the land of China, and Masarjawayh says that it is khusrudaru itself; hot and dry in the second degree, subtle and dissolving winds, it sweetens the breath, is good for the stomach and digests food, and benefits colic and kidney pain, with a labelled listing on desire in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.709}"
  ur: "خولنجان کتاب میں مڑے ہوئے ٹکڑے ہیں، سرخ اور سیاہ، تیز ذائقے والے، خوشبودار اور ہلکے، چین کے ملک سے لائے جاتے ہیں، اور ماسرجویہ کہتا ہے کہ یہ عین خسرودارو ہے؛ دوسرے درجے میں گرم خشک، لطیف اور ہواؤں کو تحلیل کرنے والا، سانس کو خوشبودار کرتا ہے، معدے کے لیے اچھا اور کھانا ہضم کرنے والا ہے، اور قولنج اور گردوں کے درد میں نافع ہے، اور باہ کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.709}۔"
  es: "Khawlanjan es en el libro piezas retorcidas, rojas y negras, de sabor intenso, de buen olor y peso ligero, traídas de la tierra de China, y Masarjawayh dice que es el mismo khusrudaru; cálido y seco en segundo grado, vientos sutiles y disolventes, endulza el aliento, es bueno para el estómago y digiere los alimentos, y beneficia el cólico y el dolor de riñón, con una lista etiquetada sobre el deseo en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.709}"
