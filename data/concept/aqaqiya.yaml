label:
  ar: "الأقاقيا"
  en: "Aqaqiya (acacia juice)"
  fr: "Aqaqiya (suc d’acacia)"
  ur: "اقاقیا ⁦(ببول کا رس)⁩"
summary:
  ar: "الأقاقيا في الكتاب عصارة القرَظ مجفّفة، فيها لذع يزول بالغسل؛ المغسول منها بارد يجفّف في الثانية وغير المغسول بارد في الأولى ويبسه في حدود الثالثة، وهي قابضة تمنع سيلان الدم؛ تسوّد الشعر وتحسّن اللون وتنفع من الشقاق والداحس والأورام الحارة وحرق النار وقروح الفم والرمد، وتعقل الطبيعة وتنفع من السحج والإسهال الدموي؛ ويذكر الكتاب فيها قولاً عن الرحم في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.346-347}"
  en: "In the book aqaqiya (acacia) is the dried juice of the qaraz tree, with a sting that goes when it is washed; the washed kind is cold and drying in the second degree and the unwashed cold in the first and dry near the third; it is astringent and stops the flow of blood; it darkens the hair, improves the complexion and is listed for cracks from cold, whitlow, hot swellings, burns, sores of the mouth and ophthalmia, and it binds the bowel and helps abrasion and bloody diarrhoea; the book also gives a statement on the womb in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.346-347}"
  fr: "Dans le livre, l’aqaqiya (acacia) est le suc desséché de l’arbre qaraz, dont l’âcreté disparaît au lavage ; la variété lavée est froide et desséchante au deuxième degré, et la non lavée froide au premier et sèche près du troisième ; elle est astringente et arrête l’écoulement du sang ; elle noircit les cheveux, améliore le teint et est mentionnée pour les crevasses dues au froid, le panaris, les tuméfactions chaudes, les brûlures, les ulcérations de la bouche et l’ophtalmie ; elle resserre l’intestin et aide contre les érosions et la diarrhée sanglante ; le livre donne aussi une indication sur la matrice dans une section signalée comme telle, en attente de la décision du fondateur {cite:canon-ibn-sina-print-v1 pp.346-347}"
  ur: "اقاقیا کتاب میں قرظ کا خشک کیا ہوا رس ہے، اس میں ایک جلن ہے جو دھونے سے جاتی رہتی ہے؛ دھویا ہوا دوسرے درجے میں سرد اور خشک کرنے والا ہے اور بن دھویا پہلے درجے میں سرد اور تیسرے کی حد کے قریب خشک ہے؛ یہ قابض ہے اور خون کے بہاؤ کو روکتا ہے؛ بالوں کو کالا کرتا، رنگ نکھارتا، سردی سے پھٹنے، ناخنے کی سوزش، گرم ورم، آگ سے جلنے، منہ کے چھالوں اور آشوب چشم میں مذکور ہے، پیٹ روکتا ہے اور چھلنے اور خونی دست میں مفید ہے؛ کتاب رحم کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.346-347}۔"
