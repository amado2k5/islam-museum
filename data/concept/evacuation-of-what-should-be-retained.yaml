id: concept/evacuation-of-what-should-be-retained
class: concept
kind: scientific
label: { ar: "استفراغ ما يجب أن يحتبس عند ابن سينا", en: "The evacuation of what should be retained in the Canon", ur: "قانون میں اس چیز کا خارج ہو جانا جسے رکنا چاہیے", es: "La evacuación de lo que debe conservarse en el Canon", fr: "L'évacuation de ce qui devrait être conservé dans le Canon", tr: "İbn Sina'ya özgü olması gerekenleri kusmak", id: "Muntah yang seharusnya hanya ada di Avicenna" }
summary:
  ar: "يذكر ابن سينا أن استفراغ ما يجب أن يحتبس يكون إما لقوة الدافعة أو لضعف الماسكة، أو لإيذاء المادة بالثفل لكثرته أو بالتمديد لريحه أو باللذع لحدتها وحرافتها، أو لرقة المادة فتسيل من نفسها، وقد تعينها سعة المجاري {cite:canon-ibn-sina-print-v1 p.139}."
  en: "Ibn Sina says that the evacuation of what should be retained comes either from strength of the expelling power or weakness of the retaining power, or because the matter troubles by its heaviness through quantity, by distension through its wind, by stinging through its sharpness and pungency, or because the matter is thin and flows of itself, helped sometimes by wide passages {cite:canon-ibn-sina-print-v1 p.139}."
  es: "Ibn Sina dice que la evacuación de lo que debe retenerse proviene de la fuerza del poder de expulsión o de la debilidad del poder de retención, o porque la materia molesta por su pesadez debido a la cantidad, por la distensión debido a su viento, por el escozor debido a su agudeza y pungencia, o porque la materia es delgada y fluye por sí misma, ayudada a veces por pasajes amplios {cite:canon-ibn-sina-print-v1 p.139}."
  fr: "Ibn Sina dit que l'évacuation de ce qui devrait être retenu provient soit de la force du pouvoir d'expulsion, soit de la faiblesse du pouvoir de rétention, soit parce que la matière trouble par sa lourdeur due à la quantité, par sa distension due à son vent, par sa piqûre due à son tranchant et à son piquant, soit parce que la matière est mince et coule d'elle-même, parfois aidée par de larges passages {cite:canon-ibn-sina-print-v1 p.139}."
  ur: "ابن سینا کہتے ہیں کہ جس چیز کو برقرار رکھا جائے اس کا انخلا یا تو نکالنے کی طاقت کی طاقت یا برقرار رکھنے کی طاقت کی کمزوری سے ہوتا ہے، یا اس وجہ سے کہ مادہ مقدار کے اعتبار سے اس کے بھاری ہونے سے، اس کی ہوا کے پھیلاؤ سے، اس کی تیز اور تپش سے ڈنکنے سے، یا اس وجہ سے کہ مادہ باریک ہوتا ہے اور کبھی کبھی اپنے آپ کو چوڑا ہو کر بہتا ہے۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 139}۔"
  tr: "İbn Sina, hapsedilmesi gereken bir şeyden kusmanın ya itiş gücünden, tutuşun zayıflığından ya da bolluğundan dolayı maddeye zarar vermekten, ya kokusunu uzatmaktan, ya keskinliğinden kaynaklanan sokma ya da maddenin kendisinden akacak kadar inceliğinden kaynaklandığını belirtir ve kanalizasyonun kapasitesi bunu belirleyebilir {atıf:kanon-ibn-sina-print-v1 s.139}."
  id: "Ibn Sina menyebutkan bahwa muntah keluar dari sesuatu yang harus terperangkap disebabkan oleh gaya dorongan, lemahnya genggaman, atau untuk merusak zat dengan ampas akibat kelimpahannya, atau dengan memperpanjang baunya, atau oleh sengatan karena ketajaman dan ketajamannya, atau karena ketipisan zat sehingga mengalir dari dirinya sendiri, dan kapasitas limbah dapat menentukan ini {cite:canon-ibn-sina-print-v1 hlm.139}."
