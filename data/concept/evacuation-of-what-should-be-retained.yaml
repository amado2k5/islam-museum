label: { ar: "استفراغ ما يجب أن يحتبس عند ابن سينا", en: "The evacuation of what should be retained in the Canon", ur: "قانون میں اس چیز کا خارج ہو جانا جسے رکنا چاہیے" }
summary:
  ar: "يذكر ابن سينا أن استفراغ ما يجب أن يحتبس يكون إما لقوة الدافعة أو لضعف الماسكة، أو لإيذاء المادة بالثفل لكثرته أو بالتمديد لريحه أو باللذع لحدتها وحرافتها، أو لرقة المادة فتسيل من نفسها، وقد تعينها سعة المجاري {cite:canon-ibn-sina-print-v1 p.139}."
  en: "Ibn Sina says that the evacuation of what should be retained comes either from strength of the expelling power or weakness of the retaining power, or because the matter troubles by its heaviness through quantity, by distension through its wind, by stinging through its sharpness and pungency, or because the matter is thin and flows of itself, helped sometimes by wide passages {cite:canon-ibn-sina-print-v1 p.139}."
