id: concept/al-adwiya-al-sinniyya
class: concept
kind: scientific
label:
  ar: الأدوية السنية
  en: The dental drugs
  ur: دانتوں کی ادویہ
summary:
  ar: الأدوية السنية منها حافظة ومنها معالجة، ولما كان جوهر الأسنان يابساً كانت الحافظة لصحتها ولردها إلى الواجب هي المجففة، وأما الحارة أو الباردة فتحتاج إليها عند عارض من إحدى الكيفيتين قد زالت بالسن عن مزاجها الطبيعي زوالاً كبيراً، فأشدها مناسبة المجففة المعتدلة في الكيفيتين الأخريين، وأجودها ما يجمع إلى التجفيف والنشافة جلاء وتحليل فضل معتدلاً ومنع مادة تنجلب إليها، ويذكر أجناسها الباردة والحارة والمعتدلة والمركبة وسنونين مجربين ⁦(الأسماء والمقادير مطروحة، والسنونات عند المحقق أدوية الأسنان، ومن حواشيه برشياوشان نبات على الصخور الكلسية في المغاور الرطبة وميسوسن شراب السوسن وكزمازك ثمر الطرفاء)⁩ {cite:canon-ibn-sina-print-v2 p.268-269}
  en: The dental drugs are of preserving ones and treating ones; since the tooth's substance is dry, the preserving drugs and those restoring it to the due state are the drying ones, while the hot or cold are needed at an occurrence of one of the two qualities that has carried the tooth far from its natural temperament — the most fitting are the drying ones temperate in the other two qualities, and the best gathers with drying and absorptiveness a cleansing and a moderate dissolving of surplus, with repelling matter drawn to it. He lists their cold, hot, temperate and compound kinds and two tried dentifrice (sanun) recipes (names and measures left out; the editor glosses sanunat as tooth-drugs, barshawshan a plant on limestone rocks in wet caves, maysusun the iris syrup, kizmazik the tamarisk fruit) {cite:canon-ibn-sina-print-v2 p.268-269}
  ur: دانتوں کی ادویہ حافظ بھی ہیں اور معالج بھی؛ چونکہ دانت کا جوہر خشک ہے اس لیے صحت کی حافظ اور واجب حال پر لوٹانے والی ادویہ خشک کرنے والی ہیں، اور گرم یا سرد اس وقت چاہیے جب دو کیفیات میں سے کسی ایک کے عارض نے دانت کو اس کے فطری مزاج سے بہت دور کر دیا ہو؛ سب سے موافق وہ خشک کرنے والی ہیں جو باقی دو کیفیات میں معتدل ہوں، اور بہترین وہ ہے جو خشک کرنے اور چوسنے کے ساتھ صفائی اور فضل کی معتدل تحلیل اور اتردی مواد کو روکنے کو جمع کرے؛ وہ ان کی سرد، گرم، معتدل اور مرکب اجناس اور دو آزمائے ہوئے سنون کے نسخے بیان کرتا ہے ⁦(نام اور مقداریں مطروح؛ محقق کے حوالے سے سنونات دانتوں کی ادویہ ہیں، برشاوشان چونے کی چٹانوں پر مرطوب غاروں میں اگنے والا نبات، ميسوسن سوسن کی شراب، کزمازک جھاؤ کا پھل)⁩ {cite:canon-ibn-sina-print-v2 p.268-269}
