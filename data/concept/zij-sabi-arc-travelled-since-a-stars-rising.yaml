id: concept/zij-sabi-arc-travelled-since-a-stars-rising
class: concept
kind: scientific
label: { ar: "القوس الراجعة وما دار من الفلك منذ طلوع الكوكب", en: "The returned arc and the part of the sphere turned since a star's rising", ur: "قوسِ راجعہ اور ستارے کے طلوع کے بعد فلک کا گھوما ہوا حصہ" }
summary:
  ar: "يضرب البتاني الوتر الراجع لنصف قوس نهار الكوكب في وتر ارتفاعه وقت القياس، ويقسم على وتر ارتفاعه في وسط السماء، وينقص الحاصل من الوتر الراجع لقوس نهاره، وقوس الباقي هي القوس الراجعة. فإن كان الكوكب شرقي وسط السماء نُقصت من نصف قوس نهاره، وإن كان غربيه زيدت عليه، فيكون الناتج ما دار من الفلك منذ طلوع الكوكب إلى ساعة القياس. {cite:zij-sabi-nallino-byblion p.55}."
  en: "Al-Battani multiplies the returned chord of half the star's day arc by the chord of its altitude at the time of measurement, divides by the chord of its altitude at midheaven, and takes the result from the returned chord of its day arc; the arc of the remainder is the returned arc. If the star is east of midheaven the arc is taken from its half day arc, and if west it is added, so the result is the part of the sphere that has turned since the star's rising until the time of measurement. {cite:zij-sabi-nallino-byblion p.55}."
  ur: "البتانی ستارے کی نصف قوسِ نہار کے وترِ راجع کو پیمائش کے وقت کے ارتفاع کے وتر سے ضرب دیتے ہیں، وسط السماء کے ارتفاع کے وتر پر تقسیم کرتے ہیں اور حاصل کو اس کی قوسِ نہار کے وترِ راجع میں سے گھٹاتے ہیں؛ باقی کی قوس قوسِ راجعہ ہے۔ اگر ستارہ وسط السماء کے مشرق میں ہو تو یہ قوس اس کی نصف قوسِ نہار میں سے گھٹائی جاتی ہے، مغرب میں ہو تو جمع کی جاتی ہے، اور نتیجہ وہ حصہ ہے جو ستارے کے طلوع سے پیمائش کی ساعت تک فلک گھوم چکا ہے۔ {cite:zij-sabi-nallino-byblion p.55}۔"
