id: concept/zij-sabi-arc-travelled-since-a-stars-rising
class: concept
kind: scientific
label: { ar: "القوس الراجعة وما دار من الفلك منذ طلوع الكوكب", en: "The returned arc and the part of the sphere turned since a star's rising", ur: "قوسِ راجعہ اور ستارے کے طلوع کے بعد فلک کا گھوما ہوا حصہ", es: "El arco de retorno y la parte de la esfera girada desde el nacimiento de una estrella.", fr: "L'arc retourné et la partie de la sphère tournée depuis le lever d'une étoile", tr: "Gerileme yayı ve gezegenin doğuşundan bu yana gök küresinde meydana gelenler", id: "Busur retrograde dan apa yang telah terjadi di bola langit sejak terbitnya planet ini" }
summary:
  ar: "يضرب البتاني الوتر الراجع لنصف قوس نهار الكوكب في وتر ارتفاعه وقت القياس، ويقسم على وتر ارتفاعه في وسط السماء، وينقص الحاصل من الوتر الراجع لقوس نهاره، وقوس الباقي هي القوس الراجعة. فإن كان الكوكب شرقي وسط السماء نُقصت من نصف قوس نهاره، وإن كان غربيه زيدت عليه، فيكون الناتج ما دار من الفلك منذ طلوع الكوكب إلى ساعة القياس. {cite:zij-sabi-nallino-byblion p.55}."
  en: "Al-Battani multiplies the returned chord of half the star's day arc by the chord of its altitude at the time of measurement, divides by the chord of its altitude at midheaven, and takes the result from the returned chord of its day arc; the arc of the remainder is the returned arc. If the star is east of midheaven the arc is taken from its half day arc, and if west it is added, so the result is the part of the sphere that has turned since the star's rising until the time of measurement. {cite:zij-sabi-nallino-byblion p.55}."
  ur: "البتانی ستارے کی نصف قوسِ نہار کے وترِ راجع کو پیمائش کے وقت کے ارتفاع کے وتر سے ضرب دیتے ہیں، وسط السماء کے ارتفاع کے وتر پر تقسیم کرتے ہیں اور حاصل کو اس کی قوسِ نہار کے وترِ راجع میں سے گھٹاتے ہیں؛ باقی کی قوس قوسِ راجعہ ہے۔ اگر ستارہ وسط السماء کے مشرق میں ہو تو یہ قوس اس کی نصف قوسِ نہار میں سے گھٹائی جاتی ہے، مغرب میں ہو تو جمع کی جاتی ہے، اور نتیجہ وہ حصہ ہے جو ستارے کے طلوع سے پیمائش کی ساعت تک فلک گھوم چکا ہے۔ {cite:zij-sabi-nallino-byblion p.55}۔"
  es: "Al-Battani multiplica la cuerda resultante de la mitad del arco diurno de la estrella por la cuerda de su altitud en el momento de la medición, la divide por la cuerda de su altitud en el medio cielo y toma el resultado de la cuerda resultante de su arco diurno; el arco restante es el arco resultante. Si la estrella está al este del medio cielo, el arco se toma de su arco diurno, y si está al oeste, se le suma, de modo que el resultado es la parte de la esfera que ha girado desde la salida de la estrella hasta el momento de la medición. {cite:zij-sabi-nallino-byblion p.55}."
  fr: "Al-Battani multiplie la corde retournée de la moitié de l'arc diurne de l'étoile par la corde de sa hauteur au moment de la mesure, divise par la corde de sa hauteur au milieu du ciel, et soustrait le résultat de la corde retournée de son arc diurne; l'arc restant est l'arc retourné. Si l'étoile est à l'est du milieu du ciel, l'arc est soustrait de son demi-arc diurne, et s'il est à l'ouest, il est ajouté; le résultat correspond ainsi à la portion de la sphère qui a tourné depuis le lever de l'étoile jusqu'au moment de la mesure. {cite:zij-sabi-nallino-byblion p.55}."
  tr: "El-Battani, gezegenin gündüz yayının geriye doğru hareket kirişini, ölçüm anındaki yüksekliğinin kirişiyle çarpar, meridyendeki yüksekliğinin kirişine böler ve sonucu gündüz yayının geriye doğru hareket kirişinden çıkarır. Geriye kalan yay, geriye doğru hareket yayıdır. Eğer gezegen meridyenin doğusundaysa, bu gündüz yayının geriye doğru hareket yayından çıkarılır; batısındaysa, eklenir. Sonuç, gezegenin doğuşundan ölçüm anına kadar gök küresinin yörünge periyodudur. {cite:zij-sabi-nallino-byblion s.55}."
  id: "Al-Battani mengalikan tali busur retrograde dari busur siang hari planet dengan tali busur ketinggiannya pada saat pengukuran, membaginya dengan tali busur ketinggiannya di meridian, dan mengurangi hasilnya dari tali busur retrograde dari busur siang harinya. Busur yang tersisa adalah busur retrograde. Jika planet berada di sebelah timur meridian, ini dikurangi dari busur retrograde dari busur siang harinya; jika berada di sebelah barat, ini ditambahkan. Hasilnya adalah periode orbit bola langit dari saat planet terbit hingga saat pengukuran. {cite:zij-sabi-nallino-byblion p.55}."
