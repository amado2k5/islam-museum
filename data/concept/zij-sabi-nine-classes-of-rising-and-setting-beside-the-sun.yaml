label: { ar: "الأصناف التسعة لتشريق الكواكب وتغريبها عند الشمس", en: "The nine classes of rising and setting of stars beside the sun", ur: "سورج کے پاس ستاروں کے طلوع و غروب کی نو اقسام" }
summary:
  ar: "تتنوع أحوال الكواكب الثابتة والمتحيرة مع الشمس على تسعة أصناف بحسب موضعها من الأفق ومن وسط السماء. الأول تشريق الندوات، إذا كان الكوكب مع الشمس في أفق المشرق، ويكون بوجهين. والثاني وسط سماء التشريق، إذا كان الكوكب عند طلوع الشمس على وسط السماء. والثالث تغريب الصبح، إذا كانت الشمس في المطالع والكوكب قريب من أفق المغرب. والرابع جنوبي التشريق، إذا كانت الشمس على وسط السماء والكوكب في الشرق. والخامس وسط السماء الجنوبي، إذا كانت الشمس والكوكب في وسط السماء. والسادس مغرب جنوبي، إذا كانت الشمس في وسط السماء والكوكب في المغرب. والسابع طلوع المشيات، إذا كانت الشمس في الغرب والكوكب في أفق المشرق. والثامن وسط سماء المغارب، إذا كانت الشمس في أفق الغرب والكوكب في وسط السماء. والتاسع تغريب المشيات، إذا كان الكوكب مع الشمس في أفق المغرب. {cite:zij-sabi-nallino-byblion pp.183-184}"
  en: "The fixed stars and the wandering planets stand in nine relations to the sun, according to their place on the horizon and the meridian. The first is the morning rising, when the star is with the sun on the eastern horizon, in two forms. The second is the meridian of the rising, when the star is on the meridian as the sun rises. The third is the morning setting, when the sun is on the rising part and the star near the western horizon. The fourth is the southern rising, when the sun is on the meridian and the star in the east. The fifth is the southern meridian, when sun and star are both on the meridian. The sixth is the southern setting, when the sun is on the meridian and the star in the west. The seventh is the evening rising, when the sun is in the west and the star on the eastern horizon. The eighth is the western meridian, when the sun is on the western horizon and the star on the meridian. The ninth is the evening setting, when star and sun are together on the western horizon. {cite:zij-sabi-nallino-byblion pp.183-184}"
  ur: "ثابت ستارے اور متحیر سیارے سورج کے ساتھ نو مختلف احوال میں ہوتے ہیں، جو افق اور وسط السماء پر ان کے مقام سے طے ہوتے ہیں۔ پہلا صبحی طلوع ہے، جب ستارہ سورج کے ساتھ مشرقی افق پر ہو، اور یہ دو صورتوں میں ہوتا ہے۔ دوسرا طلوع کا وسط السماء ہے، جب سورج طلوع کے وقت ستارہ وسط السماء پر ہو۔ تیسرا صبحی غروب ہے، جب سورج طالع جزو پر اور ستارہ مغربی افق کے قریب ہو۔ چوتھا جنوبی طلوع ہے، جب سورج وسط السماء پر اور ستارہ مشرق میں ہو۔ پانچواں جنوبی وسط السماء ہے، جب دونوں وسط السماء پر ہوں۔ چھٹا جنوبی غروب ہے، جب سورج وسط السماء پر اور ستارہ مغرب میں ہو۔ ساتواں شامی طلوع ہے، جب سورج مغرب میں اور ستارہ مشرقی افق پر ہو۔ آٹھواں مغربی وسط ہے، جب سورج مغربی افق پر اور ستارہ وسط السماء پر ہو۔ نواں شامی غروب ہے، جب ستارہ اور سورج مغربی افق پر ساتھ ہوں۔ {cite:zij-sabi-nallino-byblion pp.183-184}"
