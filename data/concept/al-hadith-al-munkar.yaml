id: concept/al-hadith-al-munkar
class: concept
kind: term
label: { ar: "الحديث المنكر", en: "The objectionable report (munkar)", fr: "Le hadith réprouvé (munkar)", ur: "منکر حدیث", es: "El informe objetable (munkar)", tr: "Reddedilen Hadis", id: "Hadis yang Ditolak" }
term: { ar: "المعروف والمنكر", en: "al-ma'ruf and al-munkar" }
summary:
  ar: "المنكر عند ابن حجر ما رواه الضعيف مخالفاً للقوي، ومقابله الراجح هو المعروف؛ ويمثّل له بحديث حُبيّب بن حبيب عن أبي إسحاق عن العيزار عن ابن عباس مرفوعاً، وأوله ذكر من أقام الصلاة وآتى الزكاة، قال أبو حاتم: هو منكر لأن غيره من الثقات رواه موقوفاً {cite:nuzhat-al-nazar-itr-bushra-2011 p. 67-68}."
  en: "For Ibn Hajar the objectionable report (munkar) is what a weak narrator transmits in contradiction of a strong one, and its stronger counterpart is the recognised (ma'ruf); his example is Hubayyib ibn Habib's report from Abu Ishaq, from al-'Ayzar, from Ibn 'Abbas, attributed to the Prophet and beginning with a reference to keeping up prayer and giving alms. Abu Hatim called this report objectionable because trustworthy narrators gave it as Ibn 'Abbas's own words {cite:nuzhat-al-nazar-itr-bushra-2011 p. 67-68}."
  fr: "Pour Ibn Hajar, le récit réprouvé (munkar) est celui qu’un transmetteur faible rapporte en contredisant un transmetteur solide ; la version la plus solide est dite reconnue (ma’ruf). Il prend l’exemple du récit sur l’observance de la prière et le versement de l’aumône, que Hubayyib ibn Habib, d’après Abu Ishaq, d’après al-Ayzar, d’après Ibn Abbas, attribue au Prophète. Abu Hatim l’a jugé réprouvé parce que des transmetteurs fiables le donnaient comme une parole d’Ibn Abbas lui-même {cite:nuzhat-al-nazar-itr-bushra-2011 p. 67-68}."
  ur: "ابن حجر کے نزدیک منکر وہ ہے جسے ضعیف راوی قوی کی مخالفت میں روایت کرے، اور اس کا راجح مقابل معروف ہے؛ وہ مثال میں حُبیّب بن حبیب عن ابی اسحاق عن العیزار عن ابن عباس کی مرفوع روایت پیش کرتے ہیں، جس کے شروع میں نماز قائم کرنے اور زکوٰۃ دینے کا ذکر ہے، جسے ابو حاتم نے منکر کہا کیونکہ ثقات نے اسے موقوف روایت کیا {cite:nuzhat-al-nazar-itr-bushra-2011 p. 67-68}۔"
  es: "Para Ibn Hajar, el relato objetable (munkar) es aquel que transmite un narrador débil en contradicción con uno fuerte, y su contraparte más fuerte es el reconocido (ma'ruf); su ejemplo es el relato de Hubayyib ibn Habib, de Abu Ishaq, de al-'Ayzar, de Ibn 'Abbas, atribuido al Profeta y que comienza con una referencia a la práctica de la oración y la limosna. Abu Hatim consideró este relato objetable porque narradores fidedignos lo atribuyeron a las propias palabras de Ibn 'Abbas {cite:nuzhat-al-nazar-itr-bushra-2011 p. 67-68}."
  tr: "İbn Hajar'a göre memur, zayıfın güçlüye karşı anlattığı şeydir; güçlü olanın ise bilinen olanıdır; bu, Habib ibn Habib'in Ebu İshak'tan Ebu Abbas'tan al-Aizar'dan bir marfu' (merfu') olarak anlattığı hadisle örneklenir; ilk olarak namaz kurup zekat verenlerden bahsedilir. Ebu Hatim şöyle demiştir: Diğer güvenilir rivayetçiler bunu mawquf olarak anlattıkları için reddedilmiştir {cite:nuzhat-al-nazar-itr-bushra-2011 s. 67-68}."
  id: "Menurut Ibn Hajar, hamba adalah apa yang digambarkan oleh yang lemah kepada yang kuat; yang kuat adalah apa yang diketahui; hal ini dicontohkan oleh hadits yang diceritakan oleh Habib ibn Habib dari Abu Ishaq dan dari Abu Abbas kepada al-Aizar sebagai marfu' (marfu'); pertama, mereka yang mendirikan shalat dan memberikan zakat disebutkan. Abu Hatim berkata: Narator terpercaya lainnya menolaknya karena mereka menyebutnya sebagai mawquf {cite:nuzhat-al-nazar-itr-bushra-2011 hlm. 67-68}."
