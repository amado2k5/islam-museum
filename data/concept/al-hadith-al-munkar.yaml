id: concept/al-hadith-al-munkar
class: concept
kind: term
label: { ar: "الحديث المنكر", en: "The objectionable report (munkar)", ur: "منکر حدیث" }
term: { ar: "المعروف والمنكر", en: "al-ma'ruf and al-munkar" }
summary:
  ar: "المنكر عند ابن حجر ما رواه الضعيف مخالفاً للقوي، ومقابله الراجح هو المعروف؛ ويمثّل له بحديث حُبيّب بن حبيب عن أبي إسحاق عن العيزار عن ابن عباس مرفوعاً «من أقام الصلاة وآتى الزكاة...»، قال أبو حاتم: هو منكر لأن غيره من الثقات رواه موقوفاً {cite:nuzhat-al-nazar-itr-bushra-2011 p. 67-68}."
  en: "For Ibn Hajar the objectionable report (munkar) is what a weak narrator transmits in contradiction of a strong one, and its stronger counterpart is the recognised (ma'ruf); his example is Hubayyib ibn Habib's report from Abu Ishaq, from al-'Ayzar, from Ibn 'Abbas, attributed to the Prophet, 'Whoever keeps up the prayer, gives the alms...', which Abu Hatim called objectionable because trustworthy narrators gave it as Ibn 'Abbas's own words {cite:nuzhat-al-nazar-itr-bushra-2011 p. 67-68}."
  ur: "ابن حجر کے نزدیک منکر وہ ہے جسے ضعیف راوی قوی کی مخالفت میں روایت کرے، اور اس کا راجح مقابل معروف ہے؛ وہ مثال میں حُبیّب بن حبیب عن ابی اسحاق عن العیزار عن ابن عباس کی مرفوع روایت 'جس نے نماز قائم کی، زکوٰۃ دی...' پیش کرتے ہیں، جسے ابو حاتم نے منکر کہا کیونکہ ثقات نے اسے موقوف روایت کیا {cite:nuzhat-al-nazar-itr-bushra-2011 p. 67-68}۔"
