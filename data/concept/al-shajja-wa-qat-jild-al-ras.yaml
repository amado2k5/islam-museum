id: concept/al-shajja-wa-qat-jild-al-ras
class: concept
kind: scientific
label:
  ar: "الشجة وقطع جلد الرأس وما يجري مجراه"
  en: "Head wounds and cuts of the scalp and the like"
  fr: "Plaies de la tête, coupures du cuir chevelu et lésions semblables"
  ur: "سر کے زخم اور کھال کا کٹنا اور اس جیسی چیزیں"
  es: "Heridas en la cabeza y cortes en el cuero cabelludo y similares"
summary:
  ar: "يذكر ابن سينا أقسام التفرق الواقع في الرأس في الجلد واللحم والعظم، وما يحدث في الجراحات الواصلة إلى غشاء الدماغ، وأيّ بطون الدماغ أقرب إلى السلامة، ومذهبي الأطباء في علاج كسر القحف المنقلع؛ وتُحال التفاصيل إلى مواضعها ولا تُنقل الأدوية {cite:canon-ibn-sina-print-v2 p.89}"
  en: "Ibn Sina names the kinds of break of continuity in the head, in skin and flesh and in bone, what comes in wounds that reach the membrane of the brain, which ventricles of the brain are nearer to safety, and the two schools of physicians on the treatment of the displaced fracture of the skull; the particulars are referred to their places and the remedies are not reproduced {cite:canon-ibn-sina-print-v2 p.89}"
  fr: "Ibn Sina nomme les sortes de rupture de continuité dans la tête, dans la peau et la chair et dans l’os, ce qui survient dans les plaies qui atteignent la membrane du cerveau, quels ventricules du cerveau sont les plus proches de la guérison, et les deux écoles de médecins sur le traitement de la fracture déplacée du crâne ; les détails sont renvoyés à leurs places et les remèdes ne sont pas reproduits {cite:canon-ibn-sina-print-v2 p.89}"
  ur: "ابن سینا سر میں اتصال ٹوٹنے کی قسمیں بتاتا ہے، کھال اور گوشت میں اور ہڈی میں، ان زخموں میں جو دماغ کی جھلی تک پہنچیں کیا ہوتا ہے، دماغ کے کون سے خانے سلامتی کے زیادہ قریب ہیں، اور کھوپڑی کے اکھڑے ہوئے ٹوٹنے کے علاج میں اطبا کے دو مذاہب؛ تفصیلات اپنے مقامات کی طرف لوٹائی گئی ہیں اور دوائیں نقل نہیں کی گئیں {cite:canon-ibn-sina-print-v2 p.89}۔"
  es: "Ibn Sina nombra los tipos de ruptura de la continuidad en la cabeza, en la piel, la carne y el hueso, qué ocurre en las heridas que alcanzan la membrana del cerebro, qué ventrículos cerebrales están más cerca de la seguridad y las dos escuelas de médicos sobre el tratamiento de la fractura desplazada del cráneo; los detalles se remiten a sus lugares y los remedios no se reproducen {cite:canon-ibn-sina-print-v2 p.89}"
