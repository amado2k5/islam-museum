id: concept/jihad
class: concept
kind: legal
label: { ar: "الجهاد", en: "Jihad (fighting in the way of God, in fiqh)", ur: "جہاد", es: "Yihad (lucha en el camino de Dios, en fiqh)", fr: "Jihad (combat dans la voie de Dieu, en fiqh)", tr: "Cihad", id: "Jihad" }
summary:
  ar: "الجهاد في الفقه قتال العدو، وتعرض الموسوعة الفقهية الكويتية حكمه التكليفي، وهو فرض في الجملة، وما يتعين منه، ودعوة الكفار إلى الإسلام قبل القتال، وشروط وجوبه، وأحكام من يخرج فيه، من الأبوين والدائن والمريض والنساء، وأحكام الفرار من الزحف، والغدر والغلول والمثلة، والتحريق والإتلاف، والمهادنة، واستعمال أموال العدو وسلاحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623} ويورد جامع الترمذي في أبواب الجهاد مواضع من السنة: أن السمع والطاعة على المسلم فيما أحب وكره ما لم يؤمر بمعصية فإن أمر بمعصية فلا سمع عليه ولا طاعة {cite:jami-al-tirmidhi p.408}، وأن حد بلوغ الرجل في الجهاد عند ابن عمر خمسة عشر سنة على رواية عمر بن عبد العزيز {cite:jami-al-tirmidhi p.409}، وأن الجهاد في سبيل الله والإيمان بالله من أفضل الأعمال وأن من قتل في سبيل الله وهو صابر محتسب مقبل غير مدبر كفرت خطاياه إلا الدين فإن جبريل أخبره بذلك {cite:jami-al-tirmidhi p.409}، وأن دفن الشهداء كان بأمر التقدمة في القبور بمن أكثر قرآنا {cite:jami-al-tirmidhi p.410}، وأن المشورة من سنن القائد إذ استشار النبي أصحابه يوم بدر {cite:jami-al-tirmidhi p.410}، وأن من حاص في الزحف ودخل المدينة مع من رجع إليه قال لهم النبي بل أنتم العكارون وأنا فيئتكم {cite:jami-al-tirmidhi p.410}، وأن تلقي الغائب من سنته إذ خرج الناس يتلقون النبي عند قدومه من تبوك {cite:jami-al-tirmidhi p.411}؛ ويجمع مشكاة المصابيح كتاب الجهاد أول أبوابه: أن من آمن بالله ورسوله وأقام الصلاة وصام رمضان كان حقا على الله أن يدخله الجنة جاهد في سبيل الله أو جلس في أرضه التي ولد بها وفي الجنة مائة درجة للمجاهدين ما بين كل درجتين كما بين السماء والأرض {cite:mishkat-al-masabih p.1117}، وأن مثل المجاهد في سبيل الله كالصائم القائم القانت بآيات الله لا يفتُر من صيام ولا صلاة حتى يرجع المجاهد {cite:mishkat-al-masabih p.1117}، وأن ربط يوم في سبيل الله خير من الدنيا وما عليها وأن غدوة أو روحة فيه خير من الدنيا وما فيها {cite:mishkat-al-masabih p.1118}، وأن من جهز غازيا في سبيل الله فقد غزا ومن خلف غازيا في أهله فقد غزا وأن حرمة نساء المجاهدين على القاعدين كحرمة أمهاتهم {cite:mishkat-al-masabih p.1119}، وأن لا يكلَّم أحد في سبيل الله إلا جاء يوم القيامة وجرحه يشأب دما اللون لون الدم والريح ريح المسك {cite:mishkat-al-masabih p.1120}، وأن ما من أحد يدخل الجنة يحب الرجوع إلى الدنيا ولهم ما في الأرض من شيء إلا الشهيد يتمنى أن يقتل عشر مرات لما يرى من الكرامة {cite:mishkat-al-masabih p.1120}، وأن أرواح الشهداء في أجواف طير خضر بها قناديل معلقة بالعرش يسرحون من الجنة حيث شاءت {cite:mishkat-al-masabih p.1120}، وأن الجهاد في سبيل الله والإيمان بالله أفضل الأعمال وأن من قتل في سبيل الله صابرا محتسبا مقبلا غير مدبر كفرت خطاياه {cite:mishkat-al-masabih p.1120}"
  en: "In fiqh, jihad is fighting the enemy. The Kuwaiti encyclopedia sets out its ruling (obligatory in general, and personally obligatory in certain cases), the duty to call the unbelievers to Islam before fighting, the conditions for its obligation, the rules for those who join it (parents, creditors, the sick, women), flight from battle, treachery, mutilation and burning, truces and the use of the enemy's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623} Jami' al-Tirmidhi's Book of Jihad records points of the Sunna: that hearing and obeying is incumbent on the Muslim in what he loves and hates provided it is not disobedience, for if he is ordered into disobedience there is no hearing or obedience {cite:jami-al-tirmidhi p.408}; that the age of military obligation for Ibn Umar was fifteen, on the report of Umar ibn Abd al-Aziz {cite:jami-al-tirmidhi p.409}; that jihad in God's way and faith in God are among the best deeds, and that one killed in God's way patient, expecting reward, advancing and not retreating has his sins expiated save the debt, for Jibril told him so {cite:jami-al-tirmidhi p.409}; that the martyrs of Uhud were buried by order to place those with more Qur'an ahead in the graves {cite:jami-al-tirmidhi p.410}; that consultation is a commanderly custom, the Prophet having consulted his companions at Badr {cite:jami-al-tirmidhi p.410}; and that those who withdrew in the campaign and reached Medina with those who came back were told by the Prophet «you are the rearguard, and I am your relief» {cite:jami-al-tirmidhi p.410}; and that going out to meet the absent is his practice, people going out to receive him on his return from Tabuk {cite:jami-al-tirmidhi p.411}; and Mishkat al-Masabih's Book of Jihad gathers its opening chapters: that whoever believes in God and His messenger, performs the prayer and fasts Ramadan is entitled to Paradise, fighting in God's way or sitting in the land where he was born, and that Paradise holds a hundred degrees for those who fight, each two degrees apart as heaven and earth are {cite:mishkat-al-masabih p.1117}; that the fighter in God's way is like the fasting, standing, devout worshipper who never slackens in fast or prayer until the fighter returns {cite:mishkat-al-masabih p.1117}; that one day's guarding in God's way is better than the world and all in it, and a morning or evening raid in it likewise {cite:mishkat-al-masabih p.1118}; that whoever equips a raider or leaves one behind with his family has himself raided, and that the women of the fighters are as inviolable to those who stay behind as their mothers {cite:mishkat-al-masabih p.1119}; that no one is wounded in God's way without coming on the Day of Resurrection with his wound gaping with blood, its colour the colour of blood and its scent the scent of musk {cite:mishkat-al-masabih p.1120}; that no one enters Paradise loving to return to the world, though he had all on earth, except the martyr, who would wish to be killed ten times for the honour he sees {cite:mishkat-al-masabih p.1120}; that the souls of the martyrs are in the crops of green birds carrying golden anklets suspended from the Throne, roaming Paradise where they will {cite:mishkat-al-masabih p.1120}; and that jihad in God's way and belief in Him are the best of deeds, and that whoever is killed in God's way patient, content, facing and not fleeing has his sins expiated {cite:mishkat-al-masabih p.1120}"
  ur: "فقہ میں جہاد دشمن سے قتال ہے۔ انسائیکلوپیڈیا اس کا حکم ⁦(عمومی طور پر فرض، اور بعض صورتوں میں فرضِ عین)⁩، قتال سے پہلے کفار کو اسلام کی دعوت، وجوب کی شرائط، اس میں شامل ہونے والوں کے احکام، میدان سے فرار، غدر، مثلہ، جلانا، صلح اور دشمن کے اموال کا استعمال بیان کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623}"
  es: "En el fiqh, la yihad es la lucha contra el enemigo. La enciclopedia kuwaití establece su normativa (obligatoria en general y personalmente obligatoria en ciertos casos), el deber de invitar a los infieles al Islam antes de combatir, las condiciones para su obligatoriedad, las normas para quienes se unen a ella (padres, acreedores, enfermos, mujeres), la huida del campo de batalla, la traición, la mutilación y la quema, las treguas y el uso de la propiedad del enemigo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6586} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623} El Libro de la Jihad de Jami' al-Tirmidhi registra puntos de la Sunna: que escuchar y obedecer incumbe al musulmán en lo que ama y odia siempre que no sea desobediencia, pues si se le ordena desobedecer no hay obediencia ni escucha {cite:jami-al-tirmidhi p.408}; que la edad de obligación militar para Ibn Umar era quince, según el informe de Umar ibn Abd al-Aziz {cite:jami-al-tirmidhi p.409}; que la yihad en el camino de Dios y la fe en Dios están entre las mejores obras, y que uno que muere en el camino de Dios con paciencia, esperando recompensa, avanzando y no retrocediendo, tiene sus pecados expiados salvo la deuda, pues Jibril se lo dijo {cite:jami-al-tirmidhi p.409}; que los mártires de Uhud fueron enterrados por orden de colocar a aquellos con más Corán delante en las tumbas {cite:jami-al-tirmidhi p.410}; que la consulta es una costumbre de comandante, habiendo el Profeta consultado a sus compañeros en Badr {cite:jami-al-tirmidhi p.410}; y que a aquellos que se retiraron en la campaña y llegaron a Medina con los que regresaron, el Profeta les dijo «ustedes son la retaguardia, y yo soy su relevo» {cite:jami-al-tirmidhi p.410}; y que salir al encuentro de los ausentes es su práctica, la gente sale a recibirlo a su regreso de Tabuk {cite:jami-al-tirmidhi p.411}; y el Libro de la Yihad de Mishkat al-Masabih reúne sus capítulos iniciales: que quien cree en Dios y en Su mensajero, realiza la oración y ayuna Ramadán tiene derecho al Paraíso, luchando en el camino de Dios o sentado en la tierra donde nació, y que el Paraíso tiene cien grados para aquellos que luchan, cada uno separado por dos grados como el cielo y la tierra {cite:mishkat-al-masabih p.1117}; que el guerrero en el camino de Dios es como el adorador devoto, de pie y ayunante que nunca se relaja en el ayuno o la oración hasta que el guerrero regresa {cite:mishkat-al-masabih p.1117}; que un día de guardia en el camino de Dios es mejor que el mundo y todo lo que hay en él, y una incursión matutina o vespertina en él también {cite:mishkat-al-masabih p.1118}; que quien equipa a un asaltante o lo deja atrás con su familia ha sido asaltado, y que las mujeres de los guerreros son tan inviolables para los que se quedan atrás como sus madres {cite:mishkat-al-masabih p.1119}; que nadie es herido en el camino de Dios sin venir el Día de la Resurrección con su herida abierta con sangre, su color el color de la sangre y su aroma el aroma del almizcle {cite:mishkat-al-masabih p.1120}; que nadie entra al Paraíso deseando regresar al mundo, aunque lo tuviera todo en la tierra, excepto el mártir, que desearía morir diez veces por el honor que ve {cite:mishkat-al-masabih p.1120}; que las almas de los mártires están en los cultivos de pájaros verdes que llevan tobilleras de oro suspendidas del Trono, vagando por el Paraíso donde {cite:mishkat-al-masabih p.1120}; y que la yihad en el camino de Dios y la fe en Él son las mejores obras, y que quien muere en el camino de Dios con paciencia, contento, enfrentando y sin huir, ve sus pecados expiados {cite:mishkat-al-masabih p.1120}."
  fr: "En droit islamique (fiqh), le jihad consiste à combattre l'ennemi. L'encyclopédie koweïtienne expose son caractère obligatoire (de manière générale et personnellement obligatoire dans certains cas), le devoir d'appeler les non-musulmans à l'islam avant le combat, les conditions de cette obligation, les règles applicables à ceux qui y participent (parents, créanciers, malades, femmes), la fuite du combat, la trahison, la mutilation et l'incendie, les trêves et l'utilisation des biens de l'ennemi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623} Le Livre du Jihad de Jami' al-Tirmidhi enregistre les points du Sunna: qu'entendre et obéir incombe au musulman en Ce qu'il aime et ce qu'il déteste, pourvu que ce ne soit pas de la désobéissance, car s'il reçoit l'ordre de désobéir, il n'y a ni écoute ni obéissance {cite:jami-al-tirmidhi p.408}; que l'âge de l'obligation militaire pour Ibn Umar était de quinze ans, selon le récit d'Umar ibn Abd al-Aziz {cite:jami-al-tirmidhi p.409}; que le jihad dans la voie de Dieu et la foi en Dieu sont parmi les meilleures actions, et que celui qui est tué dans la voie de Dieu avec patience, espérant une récompense, avançant et ne reculant pas, voit ses péchés expiés, sauf sa dette, car Jibril le lui a dit {cite:jami-al-tirmidhi p.409}; que les martyrs d'Uhud ont été enterrés sur ordre, en plaçant ceux qui avaient le plus de Coran devant eux dans les tombes {cite:jami-al-tirmidhi p.410}. Cette consultation est une coutume de commandement, le Prophète ayant consulté ses compagnons à Badr {cite:jami-al-tirmidhi p.410}; et ceux qui se retirèrent pendant la campagne et atteignirent Médine avec ceux qui revenaient, le Prophète leur dit: « Vous êtes l'arrière-garde, et je suis votre renfort » {cite:jami-al-tirmidhi p.410}; et aller à la rencontre des absents est sa pratique, les gens allant le recevoir à son retour de Tabuk {cite:jami-al-tirmidhi p.411}; et le Livre du Jihad de Mishkat al-Masabih rassemble ses premiers chapitres: que quiconque croit en Dieu et en Son messager, accomplit la prière et jeûne le Ramadan a droit au Paradis, qu'il combatte pour la cause de Dieu ou qu'il demeure sur la terre où il est né, et que le Paradis comporte cent degrés pour ceux qui combattent, chacun étant séparé par deux degrés comme le ciel et la terre {cite:mishkat al-masabih p.1117}; que le combattant sur la voie de Dieu est semblable au fidèle qui jeûne, se tient debout et ne relâche jamais ses efforts dans le jeûne ou la prière jusqu'à son retour {cite:mishkat-al-masabih p.1117}; qu'une seule journée de garde sur la voie de Dieu vaut mieux que le monde et tout ce qu'il contient, et qu'une incursion matinale ou vespérale en vaut également {cite:mishkat-al-masabih p.1118}; que quiconque équipe un pillard ou en laisse un avec sa famille est lui-même pillé, et que les femmes des combattants sont aussi inviolables pour ceux qui restent que leurs mères {cite:mishkat-al-masabih p.1119}; que nul n'est blessé sur la voie de Dieu sans se présenter au Jour de la Résurrection avec sa plaie béante de sang, de la couleur du sang et de l'odeur du musc {cite:mishkat-al-masabih p.1120}. que nul n'entre au Paradis avec le désir de retourner sur terre, même s'il y possédait tout, excepté le martyr, qui souhaiterait mourir dix fois pour l'honneur qu'il y voit {cite:mishkat-al-masabih p.1120}; que les âmes des martyrs sont dans les nids d'oiseaux verdoyants portant des bracelets d'or suspendus au Trône, errant dans le Paradis où elles voudront {cite:mishkat-al-masabih p.1120}; et que le jihad dans la voie de Dieu et la foi en Lui sont les meilleures des actions, et que quiconque est tué dans la voie de Dieu avec patience, sérénité, en affrontant le destin et sans fuir, voit ses péchés expiés {cite:mishkat-al-masabih p.1120}."
  tr: "Fıkıhta cihad, düşmanla savaşmaktır. Kuveyt Fıkıh Ansiklopedisi, genellikle zorunlu ve genel olarak zorunlu olan zorunlu kararını, savaşmadan önce inanmayanları İslam'a davet eden, zorunlu koşulları, dışarı çıkanlara yönelik kararları—ebeveynler, alacaklılar, hastalar, kadınlar, yürüyüşten kaçma kararları, ihanet, hırsızlık, sakatlanma, yakma ve yıkım, ateşkes ve düşmanın mal ve silahlarının kullanımını ele alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6617} {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.6623} Cemi'at-Tirmidi, cihad üzerine bölümlerde Sünnet'in bazı bölümlerinden bahseder: Müslüman'ın sevdiği ve sevmediği şeylerde dinleme ve itaat gereklidir, günah işlemesi emredilmezse, günah işlemesi emredilmezse, o zaman ne duyulmaz ne de itaat edilir {cite:Jami-al-Tirmidhi s.408} ve İbn Umer'e göre bir insanın cihatta ulaşma yaşına ulaşma yaşının on beştir, Ömer bin Abdülaziz'in rivayetine göre (atı:Cami-al-Tirmidhi s.409}}, Allah yolunda cihad ve Allah'a iman en iyi işler arasında yer alır ve Allah yolunda öldürülen kişi Sabırlı, kararlı, yaklaşan ve yönetilmemiş olan günahları, din dışında kefaret edildi; Cebrail ona bunu bildirdi {cite:jami-al-tirmidhi s.409} ve şehitlerin gömülmesinin mezarlara en fazla Kur'an konulması emriyle yapıldığını {cite:jami-al-tirmidhi s.410}} ve Peygamber'in Badr gününde sahabelerine danıştığında liderin geleneklerinden biri olduğunu {cite:jami-al-tirmidhi s.410} ve yürüyüşte olup kendisine dönenlerle birlikte Medine'ye giren herkesin onlara şöyle dediğini söylediğini belirtti {cite: Cami-al-Tirmihi s.410} ve Peygamber'in yokluğunun Sünnetinin bir parçası olduğunu, çünkü insanların Peygamber Tabuk'tan geldiğinde onu karşılamaya gittiklerini belirtir {cite:jami-al-tirmidhi s.411}; Mişket el-Masabih, Cihad Kitabı'nı ilk bölümle derler: Allah'a ve Resuluna inanan, namaz kuran ve Ramazan orucu tutan kimse, Allah'ın onu Allah yolunda mücadele ederek ya da doğduğu toprakta oturarak cennete kabul etmesi gerekir. Cennette mücahitler için yüz derece vardır, her iki sıranın arasında, gökler ile yer arasında olduğu gibi. {alıntı: mişkat-al-masabih s.1117} ve Allah yolunda mücahit örneğinin, Allah'ın ayetlerine bağlı, oruç tutan ve ayakta duran bir kişi gibi, mücahit dönene kadar oruç veya namaz kılmaktan vazgeçmediği {atı:mişkat-al-masabih s.1117}} ve Allah'ın yolunda bir günü bağlamanın bu dünyadan ve üzerindeki her şeyden daha iyidir, bir sabah ya da ruhun dünyadan ve içindekilerden daha iyidir {atıf:mişkat-al-masabih s.1118}, Allah yolunda bir savaşçıyı hazırlayan kişinin zaten savaşmış olduğu, ailesinden bir savaşçıyı takip eden ise bunu yapmış olduğunu ve mücahitlerin eşlerinin oturanlara olan kutsallığının kutsallık gibidir anneleri {atıf:mişkat-al-masabih s.1119} ve Allah yolunda kimsenin konuşmadığını, sadece Diriliş Günü'nün geleceğini, yarasının kan renginde kan ile lekeleneceğini, rüzgarın misk kokusu olacağını {atıf:mişkat-al-masabih s.1120} ve bu dünyaya dönmeyi seven kimsenin cennete girmeyeceğini, dünyada ise gördüğü onur için on kez öldürülmek isteyen şehitten başka hiçbir şeyleri olmadığını belirtir. {alıntı: Mişkat-al-Masabih s.1120} ve şehitlerin ruhlarının yeşil kuşların çukurlarında Taht'tan fenerlerle Cennet'ten nereye giderlerse oraya gittiklerini {atıf:mişkat-al-masabih s.1120} ve Allah yolunda cihad ile Allah'a iman en iyisidir; Allah yolunda sabırla öldürülen, ödül arayan ve geri adım atmadan öne çıkan herkesin günahları kefaret edilir {atıf:mishkat-al-masabih s.1120}"
  id: "Jihad dalam yurisprudensi adalah melawan musuh. Ensiklopedia Yurisprudensi Kuwait membahas keputusan wajibnya, yang umumnya wajib dan wajib secara umum, mengundang kafir ke Islam sebelum berperang, syarat-syarat kewajibannya, putusan bagi mereka yang keluar di dalamnya—termasuk orang tua, kreditur, orang sakit, wanita, putusan tentang melarikan diri dari perjalanan, pengkhianatan, pencurian, mutilasi, pembakaran dan kehancuran, gencatan senjata, serta penggunaan properti dan senjata musuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6623} Jami' at-Tirmidhi menyebutkan dalam bab jihad beberapa bagian dari Sunnah: bahwa mendengarkan dan taat adalah milik Muslim dalam apa yang disukai dan tidak disukai, kecuali diperintahkan untuk berbuat dosa, maka ia diperintahkan untuk berbuat dosa, maka ia tidak didengar maupun ditaati {cite:jami-al-tirmidhi hlm.408}, dan bahwa usia seseorang mencapai usia dalam jihad menurut Ibn Umar adalah lima belas tahun menurut riwayat Umar ibn Abd al-Aziz {cite:jami-al-tirmidhi hlm.409}, dan jihad dalam jalan Allah dan iman kepada Allah adalah salah satu perbuatan terbaik, dan bahwa siapa pun yang terbunuh di jalan Allah adalah Sabar, teguh, mendekat, dan tidak terkendali, dosanya ditebus kecuali agama, karena Jibril memberitahunya tentang hal ini {cite:jami-al-tirmidhi hlm.409}, dan bahwa pemakaman para syuhada dilakukan dengan perintah menempatkan Al-Qur'an terbanyak di dalam kubur {cite:jami-al-tirmidhi hlm.410}, dan bahwa nasihat itu termasuk dalam tradisi pemimpin ketika Nabi berkonsultasi dengan sahabat-sahabatnya pada hari Badr {cite:jami-al-tirmidhi hlm.410}, dan bahwa siapa pun yang berada dalam perjalanan dan masuk ke Madinah bersama mereka yang kembali kepadanya berkata kepada mereka, 'Sebaliknya, kalian adalah penyerang, dan aku di antara kalian' {cite: Jami-al-Tirmidhi hlm.410}, dan bahwa ketidakhadiran Nabi adalah bagian dari Sunnah-nya, karena orang-orang pergi menemui Nabi saat kedatangannya dari Tabuk {cite:jami-al-tirmidhi hlm.411}; Mishkat al-Masabih menyusun Kitab Jihad dengan bab pertamanya: bahwa siapa pun yang percaya kepada Allah dan Rasul-Nya, mendirikan doa, dan berpuasa Ramadan, maka menjadi kewajiban Allah untuk menerimanya ke Surga dengan berjuang demi Allah atau duduk di tanah kelahirannya. Di surga terdapat seratus pangkat untuk mujahidin, di antara setiap dua pangkat, seperti di antara langit dan bumi. {cite: mishkat-al-masabih hlm.1117}, dan bahwa teladan mujahid di jalan Allah adalah seperti orang yang berpuasa dan berdiri yang taat pada ayat-ayat Allah, dan tidak berhenti berpuasa atau berdoa sampai mujahid kembali {cite:mishkat-al-masabih hlm.1117}, dan bahwa menghubungkan satu hari di jalan Allah lebih baik daripada dunia ini dan segala sesuatu di dalamnya, dan bahwa pagi atau jiwa di dalamnya lebih baik daripada dunia dan segala sesuatu di dalamnya {cite:mishkat-al-masabih hlm.1118}, dan bahwa siapa pun yang mempersiapkan prajurit di jalan Allah telah bertempur, dan siapa pun yang mengikuti seorang prajurit di antara keluarganya telah melakukannya, dan bahwa kesucian istri mujahidin bagi mereka yang duduk adalah seperti kesucian ibu-ibu mereka {cite:mishkat-al-masabih hlm.1119}, dan bahwa tidak ada yang berbicara tentang jalan Allah kecuali bahwa Hari Kebangkitan akan datang dan lukanya akan ternoda darah, warna darah, dan angin akan menjadi aroma musk {cite:mishkat-al-masabih hlm.1120}, dan tidak ada seorang pun yang akan masuk ke Surga yang ingin kembali ke dunia ini, dan mereka tidak memiliki apa-apa di bumi kecuali martir yang ingin dibunuh sepuluh kali demi martabat yang dilihatnya. {cite: mishkat-al-masabih hlm.1120}, dan bahwa jiwa-jiwa para syuhada berada di celah burung hijau dengan lentera tergantung di Takhta, meninggalkan Surga ke mana pun mereka mau {cite:mishkat-al-masabih hlm.1120}, dan bahwa jihad di jalan Allah dan iman kepada Allah adalah perbuatan terbaik, dan siapa pun yang dibunuh di jalan Allah dengan sabar, mencari ganjaran, dan maju tanpa mundur, dosanya akan ditebus {cite:mishkat-al-masabih hlm.1120}"
