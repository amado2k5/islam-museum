label: { ar: "الجهاد", en: "Jihad (fighting in the way of God, in fiqh)", ur: "جہاد" }
summary:
  ar: "الجهاد في الفقه قتال العدو، وتعرض الموسوعة الفقهية الكويتية حكمه التكليفي، وهو فرض في الجملة، وما يتعين منه، ودعوة الكفار إلى الإسلام قبل القتال، وشروط وجوبه، وأحكام من يخرج فيه، من الأبوين والدائن والمريض والنساء، وأحكام الفرار من الزحف، والغدر والغلول والمثلة، والتحريق والإتلاف، والمهادنة، واستعمال أموال العدو وسلاحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623}"
  en: "In fiqh, jihad is fighting the enemy. The Kuwaiti encyclopedia sets out its ruling (obligatory in general, and personally obligatory in certain cases), the duty to call the unbelievers to Islam before fighting, the conditions for its obligation, the rules for those who join it (parents, creditors, the sick, women), flight from battle, treachery, mutilation and burning, truces and the use of the enemy's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623}"
  ur: "فقہ میں جہاد دشمن سے قتال ہے۔ انسائیکلوپیڈیا اس کا حکم (عمومی طور پر فرض، اور بعض صورتوں میں فرضِ عین)، قتال سے پہلے کفار کو اسلام کی دعوت، وجوب کی شرائط، اس میں شامل ہونے والوں کے احکام، میدان سے فرار، غدر، مثلہ، جلانا، صلح اور دشمن کے اموال کا استعمال بیان کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623}"
