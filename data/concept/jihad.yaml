label: { ar: "الجهاد", en: "Jihad (fighting in the way of God, in fiqh)", ur: "جہاد" }
summary:
  ar: "الجهاد في الفقه قتال العدو، وتعرض الموسوعة الفقهية الكويتية حكمه التكليفي، وهو فرض في الجملة، وما يتعين منه، ودعوة الكفار إلى الإسلام قبل القتال، وشروط وجوبه، وأحكام من يخرج فيه، من الأبوين والدائن والمريض والنساء، وأحكام الفرار من الزحف، والغدر والغلول والمثلة، والتحريق والإتلاف، والمهادنة، واستعمال أموال العدو وسلاحه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623} ويورد جامع الترمذي في أبواب الجهاد مواضع من السنة: أن السمع والطاعة على المسلم فيما أحب وكره ما لم يؤمر بمعصية فإن أمر بمعصية فلا سمع عليه ولا طاعة {cite:jami-al-tirmidhi p.408}، وأن حد بلوغ الرجل في الجهاد عند ابن عمر خمسة عشر سنة على رواية عمر بن عبد العزيز {cite:jami-al-tirmidhi p.409}، وأن الجهاد في سبيل الله والإيمان بالله من أفضل الأعمال وأن من قتل في سبيل الله وهو صابر محتسب مقبل غير مدبر كفرت خطاياه إلا الدين فإن جبريل أخبره بذلك {cite:jami-al-tirmidhi p.409}، وأن دفن الشهداء كان بأمر التقدمة في القبور بمن أكثر قرآنا {cite:jami-al-tirmidhi p.410}، وأن المشورة من سنن القائد إذ استشار النبي أصحابه يوم بدر {cite:jami-al-tirmidhi p.410}، وأن من حاص في الزحف ودخل المدينة مع من رجع إليه قال لهم النبي بل أنتم العكارون وأنا فيئتكم {cite:jami-al-tirmidhi p.410}، وأن تلقي الغائب من سنته إذ خرج الناس يتلقون النبي عند قدومه من تبوك {cite:jami-al-tirmidhi p.411}؛ ويجمع مشكاة المصابيح كتاب الجهاد أول أبوابه: أن من آمن بالله ورسوله وأقام الصلاة وصام رمضان كان حقا على الله أن يدخله الجنة جاهد في سبيل الله أو جلس في أرضه التي ولد بها وفي الجنة مائة درجة للمجاهدين ما بين كل درجتين كما بين السماء والأرض {cite:mishkat-al-masabih p.1117}، وأن مثل المجاهد في سبيل الله كالصائم القائم القانت بآيات الله لا يفتُر من صيام ولا صلاة حتى يرجع المجاهد {cite:mishkat-al-masabih p.1117}، وأن ربط يوم في سبيل الله خير من الدنيا وما عليها وأن غدوة أو روحة فيه خير من الدنيا وما فيها {cite:mishkat-al-masabih p.1118}، وأن من جهز غازيا في سبيل الله فقد غزا ومن خلف غازيا في أهله فقد غزا وأن حرمة نساء المجاهدين على القاعدين كحرمة أمهاتهم {cite:mishkat-al-masabih p.1119}، وأن لا يكلَّم أحد في سبيل الله إلا جاء يوم القيامة وجرحه يشأب دما اللون لون الدم والريح ريح المسك {cite:mishkat-al-masabih p.1120}، وأن ما من أحد يدخل الجنة يحب الرجوع إلى الدنيا ولهم ما في الأرض من شيء إلا الشهيد يتمنى أن يقتل عشر مرات لما يرى من الكرامة {cite:mishkat-al-masabih p.1120}، وأن أرواح الشهداء في أجواف طير خضر بها قناديل معلقة بالعرش يسرحون من الجنة حيث شاءت {cite:mishkat-al-masabih p.1120}، وأن الجهاد في سبيل الله والإيمان بالله أفضل الأعمال وأن من قتل في سبيل الله صابرا محتسبا مقبلا غير مدبر كفرت خطاياه {cite:mishkat-al-masabih p.1120}"
  en: "In fiqh, jihad is fighting the enemy. The Kuwaiti encyclopedia sets out its ruling (obligatory in general, and personally obligatory in certain cases), the duty to call the unbelievers to Islam before fighting, the conditions for its obligation, the rules for those who join it (parents, creditors, the sick, women), flight from battle, treachery, mutilation and burning, truces and the use of the enemy's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6602} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6612} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6617} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623} Jami' al-Tirmidhi's Book of Jihad records points of the Sunna: that hearing and obeying is incumbent on the Muslim in what he loves and hates provided it is not disobedience, for if he is ordered into disobedience there is no hearing or obedience {cite:jami-al-tirmidhi p.408}; that the age of military obligation for Ibn Umar was fifteen, on the report of Umar ibn Abd al-Aziz {cite:jami-al-tirmidhi p.409}; that jihad in God's way and faith in God are among the best deeds, and that one killed in God's way patient, expecting reward, advancing and not retreating has his sins expiated save the debt, for Jibril told him so {cite:jami-al-tirmidhi p.409}; that the martyrs of Uhud were buried by order to place those with more Qur'an ahead in the graves {cite:jami-al-tirmidhi p.410}; that consultation is a commanderly custom, the Prophet having consulted his companions at Badr {cite:jami-al-tirmidhi p.410}; and that those who withdrew in the campaign and reached Medina with those who came back were told by the Prophet «you are the rearguard, and I am your relief» {cite:jami-al-tirmidhi p.410}; and that going out to meet the absent is his practice, people going out to receive him on his return from Tabuk {cite:jami-al-tirmidhi p.411}; and Mishkat al-Masabih's Book of Jihad gathers its opening chapters: that whoever believes in God and His messenger, performs the prayer and fasts Ramadan is entitled to Paradise, fighting in God's way or sitting in the land where he was born, and that Paradise holds a hundred degrees for those who fight, each two degrees apart as heaven and earth are {cite:mishkat-al-masabih p.1117}; that the fighter in God's way is like the fasting, standing, devout worshipper who never slackens in fast or prayer until the fighter returns {cite:mishkat-al-masabih p.1117}; that one day's guarding in God's way is better than the world and all in it, and a morning or evening raid in it likewise {cite:mishkat-al-masabih p.1118}; that whoever equips a raider or leaves one behind with his family has himself raided, and that the women of the fighters are as inviolable to those who stay behind as their mothers {cite:mishkat-al-masabih p.1119}; that no one is wounded in God's way without coming on the Day of Resurrection with his wound gaping with blood, its colour the colour of blood and its scent the scent of musk {cite:mishkat-al-masabih p.1120}; that no one enters Paradise loving to return to the world, though he had all on earth, except the martyr, who would wish to be killed ten times for the honour he sees {cite:mishkat-al-masabih p.1120}; that the souls of the martyrs are in the crops of green birds carrying golden anklets suspended from the Throne, roaming Paradise where they will {cite:mishkat-al-masabih p.1120}; and that jihad in God's way and belief in Him are the best of deeds, and that whoever is killed in God's way patient, content, facing and not fleeing has his sins expiated {cite:mishkat-al-masabih p.1120}"
  ur: "فقہ میں جہاد دشمن سے قتال ہے۔ انسائیکلوپیڈیا اس کا حکم ⁦(عمومی طور پر فرض، اور بعض صورتوں میں فرضِ عین)⁩، قتال سے پہلے کفار کو اسلام کی دعوت، وجوب کی شرائط، اس میں شامل ہونے والوں کے احکام، میدان سے فرار، غدر، مثلہ، جلانا، صلح اور دشمن کے اموال کا استعمال بیان کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6623}"
