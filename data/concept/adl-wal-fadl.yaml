summary:
  ar: "يميّز الشيخ عمر عبد الكافي بين العدل، وهو واجب، والفضل، وهو مستحب، ويرى أن استرداد الحقوق بالوسائل المشروعة من مقتضى العدل، وأن الفضل لا يكون عن عجز، ويتناول كذلك احتلال الأرض والمقدسات."
  en: "Sheikh Omar Abdelkafy distinguishes justice, a duty, from grace, which is recommended. He holds that recovering rights by lawful means follows from justice, that grace does not come from weakness, and he also takes up the occupation of land and holy places."
  ur: "شیخ عمر عبدالکافی عدل، جو واجب ہے، اور فضل، جو مستحب ہے، میں فرق کرتے ہیں۔ ان کی رائے ہے کہ جائز ذرائع سے حقوق کی واپسی عدل کا تقاضا ہے، اور فضل کمزوری سے نہیں ہوتا، اور وہ زمین اور مقدس مقامات کے قبضے کا ذکر بھی کرتے ہیں۔"
