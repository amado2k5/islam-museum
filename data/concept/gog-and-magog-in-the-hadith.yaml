id: concept/gog-and-magog-in-the-hadith
class: concept
kind: term
label:
  ar: "يأجوج ومأجوج في الحديث النبوي"
  en: "Gog and Magog in the hadith"
  ur: "یاجوج ماجوج احادیثِ نبوی میں"
  es: "Gog y Magog en el hadiz"
summary:
  ar: "تروي الصحاح عن يأجوج ومأجوج حديث زينب بنت جحش في انفتاح قدر حلقة من الردم {cite:sahih-al-bukhari 3346} {cite:sharh-nawawi-minhaj-risala on Muslim 2880}، وحديث أبي سعيد في أن من كل ألف تسعمئة وتسعة وتسعين إلى النار ومنهم من يأجوج ومأجوج ألفاً {cite:sahih-al-bukhari 3348}، وحديث النواس في إيحاء الله إلى عيسى بتحريز عباده إلى الطور وخروجهم من كل حدب وهلاكهم بالنغف {cite:sharh-nawawi-minhaj-risala on Muslim 2937}؛ ويعرض المفسرون بينها ما صحّ وما استُنكر متنه."
  en: "The collections report, on Gog and Magog, Zaynab bint Jahsh's hadith that a gap about the size of a ring has been opened in the rampart {cite:sahih-al-bukhari 3346} {cite:sharh-nawawi-minhaj-risala on Muslim 2880}, Abu Sa'id's hadith that of every thousand nine hundred and ninety-nine go to the fire and a thousand come from Gog and Magog {cite:sahih-al-bukhari 3348}, and al-Nawwas's hadith in which God tells Jesus to shelter His servants at al-Tur, they come from every height and are destroyed by the naghaf worm {cite:sharh-nawawi-minhaj-risala on Muslim 2937}; the exegetes set beside these what is sound and what they found objectionable in the wording."
  ur: "یاجوج ماجوج کے بارے میں صحاح میں زینب بنت جحش کی حدیث ہے کہ بند میں حلقے جتنا شگاف کھل گیا {cite:sahih-al-bukhari 3346} {cite:sharh-nawawi-minhaj-risala on Muslim 2880}، ابو سعید کی حدیث کہ ہر ہزار میں سے نو سو ننانوے آگ کی طرف جاتے ہیں اور ایک ہزار یاجوج ماجوج میں سے ہوتے ہیں {cite:sahih-al-bukhari 3348}، اور نواس کی حدیث کہ اللہ عیسیٰ کو بندوں سمیت طور کی پناہ لینے کا حکم دیتا ہے، وہ ہر بلندی سے نکلتے ہیں اور نغف کے کیڑے سے ہلاک ہوتے ہیں {cite:sharh-nawawi-minhaj-risala on Muslim 2937}؛ مفسرین ان کے ساتھ یہ بھی بتاتے ہیں کہ کیا صحیح ہے اور کس کے الفاظ پر اعتراض ہوا۔"
  es: "Las colecciones informan, sobre Gog y Magog, el hadiz de Zaynab bint Jahsh que dice que se ha abierto una brecha del tamaño de un anillo en la muralla {cite:sahih-al-bukhari 3346} {cite:sharh-nawawi-minhaj-risala on Muslim 2880}, el hadiz de Abu Sa'id que dice que de cada mil novecientos noventa y nueve van al fuego y mil vienen de Gog y Magog {cite:sahih-al-bukhari 3348}, y el hadiz de al-Nawwas en el que Dios le dice a Jesús que dé refugio a Sus siervos en al-Tur, vienen de todas las alturas y son destruidos por el gusano naghaf {cite:sharh-nawawi-minhaj-risala on Muslim 2937}; los exégetas pusieron junto a estos lo que es sólido y lo que encontraron objetable en la redacción."
