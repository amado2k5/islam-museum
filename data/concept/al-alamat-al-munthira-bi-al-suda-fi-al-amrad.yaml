label:
  ar: "العلامات المنذرة بالصداع في الأمراض"
  en: "Signs that foretell headache in diseases"
  fr: "Les signes qui annoncent le mal de tête dans les maladies"
  ur: "بیماریوں میں صداع سے خبردار کرنے والی علامات"
summary:
  ar: "يذكر ابن سينا أن البول الشبيه بأبوال الحمير، وابيضاض البول ورقته في الحمّيات وأوقات البحران، يدل على انتقال المواد إلى الرأس {cite:canon-ibn-sina-print-v2 p.53}"
  en: "Ibn Sina says that urine like the urine of donkeys, and whitening and thinness of the urine in fevers and at the times of crisis, indicate the movement of matters to the head {cite:canon-ibn-sina-print-v2 p.53}"
  fr: "Ibn Sina dit qu’une urine semblable à l’urine des ânes, ainsi que le blanchissement et la ténuité de l’urine dans les fièvres et aux moments de crise, indiquent le mouvement des matières vers la tête {cite:canon-ibn-sina-print-v2 p.53}"
  ur: "ابن سینا کہتا ہے کہ گدھوں کے پیشاب جیسا پیشاب، اور بخاروں اور بحران کے اوقات میں پیشاب کا سفید اور پتلا ہو جانا، مادوں کے سر کی طرف منتقل ہونے پر دلالت کرتا ہے {cite:canon-ibn-sina-print-v2 p.53}۔"
