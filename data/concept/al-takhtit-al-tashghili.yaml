label:
  ar: "التخطيط التشغيلي"
  en: "Operational planning"
  fr: "Planification opérationnelle"
  ur: "آپریشنل منصوبہ بندی"
  es: "Planificación operativa"
  tr: "Operasyonel Planlama"
