summary:
  ar: "التخطيط التشغيلي عند طارق السويدان: خطة سنة للإدارة فما دونها، في ست خطوات على «سوات معدّلة»: التحليل، والأهداف، والأهداف الذكية، والوسائل، والجدول الزمني، والأجندة، ثم المراجعة."
  en: "Operational planning as Tareq al-Suwaidan teaches it: a one-year plan for a department or below, in six steps built on his modified SWOT: analysis, goals, SMART goals, means, timeline and agenda, followed by review."
  fr: "Dans l’enseignement de Tareq al-Suwaidan, la planification opérationnelle est un plan d’un an à l’échelle d’un service ou à un échelon inférieur. Elle comprend six étapes fondées sur sa version du SWOT : analyse, objectifs, objectifs SMART, moyens, calendrier et agenda, puis révision."
  ur: "آپریشنل منصوبہ بندی جیسا طارق السویدان سکھاتے ہیں: شعبے یا اس سے نیچے کے لیے ایک سال کا منصوبہ، ان کی ترمیم شدہ SWOT پر چھ مراحل میں: تجزیہ، اہداف، SMART اہداف، ذرائع، ٹائم لائن اور ایجنڈا، پھر نظرِ ثانی۔"
  es: "La planificación operativa, tal como la enseña Tareq al-Suwaidan, consiste en un plan anual para un departamento o una unidad inferior, dividido en seis pasos basados en su análisis FODA modificado: análisis, objetivos, objetivos SMART, medios, cronograma y agenda, seguido de una revisión."
  tr: "Tariq Al-Suwaidan'da Operasyonel Planlama: Bir yıllık yönetim planı ve altı aşamada, değiştirilmiş SWAT üzerinde altı adım: analiz, hedefler, akıllı hedefler, araçlar, zaman çizelgesi, gündem, ardından gözden geçirme."
  id: "Perencanaan Operasional di Tariq Al-Suwaidan: Rencana manajemen satu tahun dan enam tahap, enam langkah pada SWAT yang dimodifikasi: analisis, tujuan, smart objectives, alat, timeline, agenda, diikuti dengan tinjauan."
