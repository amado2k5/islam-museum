label: { ar: "النَّضْح", en: "Nadh (sprinkling water)", ur: "نضح ⁦(چھینٹا دینا)⁩", es: "Nadh (rociar agua)", fr: "Nadh (aspersion d'eau)", tr: "Drenaj", id: "Drainase" }
summary:
  ar: "النضح في اللغة البل بالماء والرش، ويطلق على الماء الذي يسقى به الزرع وعلى الإبل التي يستقى عليها. وعند الفقهاء غمر الشيء بالماء مكاثرة لا تبلغ حد التقاطر في الغالب، وتختلف هذه الصفة بين المسائل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} ويستحب عند الحنفية والشافعية والحنابلة أن ينضح المتوضئ فرجه وداخل سراويله بالماء بعد الاستنجاء دفعاً للوسواس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} وفي بول الصبي الذي لم يطعم يجزئ عند بعض الفقهاء النضح، ويوجبه غيرهم الغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756} وما سقي بالنضح في الزكاة يجب فيه نصف العشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756}"
  en: "Nadh, in the lexicon, is wetting or sprinkling with water, and it is also the water drawn for crops and the camel used to draw it. Among jurists it means flooding a thing with water in such quantity that it need not drip. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} Hanafis, Shafi'is and Hanbalis recommend that the one performing ablution sprinkle the private parts and the inside of the trousers with water after istinja, to ward off whisperings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} For a boy's urine before he has eaten food, some jurists accept sprinkling, others require washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756} Land watered by nadh pays half a tenth in zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756}"
  ur: "نضح لغت میں پانی سے تر کرنے اور چھینٹا دینے کو کہتے ہیں، اور کھیتی کو سیراب کرنے والے پانی اور اس پر کھینچنے والے اونٹ کو بھی ناضح کہا جاتا ہے۔ فقہاء کی اصطلاح میں کسی چیز کو اتنے پانی سے تر کرنا جس سے پانی ٹپکنا ضروری نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} حنفیہ، شافعیہ اور حنابلہ کے نزدیک استنجا کے بعد شرمگاہ اور شلوار کے اندر پانی کا چھینٹا دینا مستحب ہے تاکہ وسوسہ دور ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} دودھ پیتے لڑکے کے پیشاب میں بعض فقہاء کے نزدیک چھینٹا کافی ہے، جبکہ دوسروں کے نزدیک دھونا ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756} نضح سے سیراب ہونے والی زمین کی زکوٰۃ میں نصف عشر واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756}"
  es: "Nadh, en el léxico, es mojar o rociar con agua, y también es el agua extraída para los cultivos y el camello utilizado para extraerla. Entre los juristas significa inundar algo con agua en tal cantidad que no necesite gotear. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} Los hanafíes, shafi'ís y hanbalíes recomiendan que quien realiza la ablución rocíe las partes íntimas y el interior de los pantalones con agua después del istinja, para alejar los susurros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} Para la orina de un niño antes de haber comido, algunos juristas aceptan rociar, otros requieren lavar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756} La tierra regada con nadh paga la mitad de la décima parte en zakat. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756}"
  fr: "Dans le lexique, « nadh » signifie mouiller ou asperger d'eau. Ce terme désigne également l'eau puisée pour l'irrigation et celle utilisée par le chameau pour la puiser. Pour les juristes, il signifie inonder quelque chose d'eau en telle quantité qu'il n'y ait pas de gouttes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} Les écoles hanafite, shafi'ite et hanbalite recommandent à celui qui accomplit ses ablutions d'asperger d'eau ses parties intimes et l'intérieur de son pantalon après l'istinja, afin de se protéger des chuchotements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} Concernant l'urine d'un garçon avant qu'il n'ait mangé, certains juristes acceptent l'aspersion, d'autres exigent un lavage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756} Les terres irriguées par nadh sont soumises à la zakat à hauteur d'un demi-dixième. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756}"
  tr: "Dilde serpme suyu ifade eder, serpme ise ekinlerin sulamasında kullanılan suyu ve develerin sulanması için kullanılan suyu ifade eder. Hukukçulara göre, genellikle su damlamasına ulaşmayan bol miktarda suya batırılır ve bu tanım vakalara göre değişiklik gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15755} Hanefiler, Şafiiler ve Hanbaliler arasında, abdest alan kişinin kendini temizledikten sonra özel bölgelerine ve pantolonunun iç kısmına su serpmesi önerilir; böylece bu takıntıyı önlemez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15755} Beslenmemiş bir çocuğun idrarında bazı hukukçular kaçakçılık için yeterli olduğunu düşünürken, bazıları yıkanmayı gerektirir. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.15756} Ve zekatta sulanan şey, ondalığın yarısını gerektirir. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.15756}"
  id: "Dalam bahasa ini, taburan merujuk pada air dan taburan, merujuk pada air yang digunakan untuk mengairi tanaman dan unta yang disiram air. Menurut ahli hukum, air ini sering direndam dalam air dalam jumlah yang melimpah sehingga tidak sampai menetes, dan deskripsi ini bervariasi antar kasus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15755} Disarankan oleh para Hanafi, Shafi'i, dan Hanbali agar orang yang melakukan wudhu menyemburkan air pada bagian pribadi dan bagian dalam celananya setelah membersihkan diri untuk mencegah obsesi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15755} Dalam urin anak yang belum diberi makan, beberapa ahli hukum menganggap cukup untuk penyelundupan, sementara yang lain memerlukan pencucian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15756} Dan apa yang diairi dengan penyemprotan zakat membutuhkan setengah dari persepuluhan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15756}"
