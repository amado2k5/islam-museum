label: { ar: "النَّضْح", en: "Nadh (sprinkling water)", ur: "نضح (چھینٹا دینا)" }
summary:
  ar: "النضح في اللغة البل بالماء والرش، ويطلق على الماء الذي يسقى به الزرع وعلى الإبل التي يستقى عليها. وعند الفقهاء غمر الشيء بالماء مكاثرة لا تبلغ حد التقاطر في الغالب، وتختلف هذه الصفة بين المسائل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} ويستحب عند الحنفية والشافعية والحنابلة أن ينضح المتوضئ فرجه وداخل سراويله بالماء بعد الاستنجاء دفعاً للوسواس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} وفي بول الصبي الذي لم يطعم يجزئ عند بعض الفقهاء النضح، ويوجبه غيرهم الغسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756} وما سقي بالنضح في الزكاة يجب فيه نصف العشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756}"
  en: "Nadh, in the lexicon, is wetting or sprinkling with water, and it is also the water drawn for crops and the camel used to draw it. Among jurists it means flooding a thing with water in such quantity that it need not drip. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} Hanafis, Shafi'is and Hanbalis recommend that the one performing ablution sprinkle the private parts and the inside of the trousers with water after istinja, to ward off whisperings. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} For a boy's urine before he has eaten food, some jurists accept sprinkling, others require washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756} Land watered by nadh pays half a tenth in zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756}"
  ur: "نضح لغت میں پانی سے تر کرنے اور چھینٹا دینے کو کہتے ہیں، اور کھیتی کو سیراب کرنے والے پانی اور اس پر کھینچنے والے اونٹ کو بھی ناضح کہا جاتا ہے۔ فقہاء کی اصطلاح میں کسی چیز کو اتنے پانی سے تر کرنا جس سے پانی ٹپکنا ضروری نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} حنفیہ، شافعیہ اور حنابلہ کے نزدیک استنجا کے بعد شرمگاہ اور شلوار کے اندر پانی کا چھینٹا دینا مستحب ہے تاکہ وسوسہ دور ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15755} دودھ پیتے لڑکے کے پیشاب میں بعض فقہاء کے نزدیک چھینٹا کافی ہے، جبکہ دوسروں کے نزدیک دھونا ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756} نضح سے سیراب ہونے والی زمین کی زکوٰۃ میں نصف عشر واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15756}"
