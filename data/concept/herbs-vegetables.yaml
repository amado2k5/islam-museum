summary:
  ar: "قال بنو إسرائيل لموسى لن نصبر على طعام واحد فادع لنا ربك يخرج لنا مما تنبت الأرض من بقلها وقثائها وفومها وعدسها وبصلها فقيل لهم أتستبدلون الذي هو أدنى بالذي هو خير."
  en: "Israel said to Moses: we cannot endure one food — call on your Lord to bring forth for us what the earth grows of herbs, cucumbers, garlic, lentils and onions; 'Would you exchange what is lower for what is better?'"
  ur: "بنی اسرائیل نے موسیٰ سے کہا: ہم ایک ہی کھانے پر صبر نہیں کر سکتے اپنے رب سے کہو زمین کی پیداوار میں سے ہمارے لیے سبزیاں، کھیرے، اناج، دالیں اور پیاز نکالے؛ کہا گیا: کیا تم بہتر کو کمتر کے بدلے لیتے ہو؟"
  es: "Israel le dijo a Moisés: No podemos soportar un solo alimento; pídele a tu Señor que nos dé lo que la tierra produce de hierbas, pepinos, ajos, lentejas y cebollas. ¿Acaso cambiarías lo inferior por lo superior?"
  fr: "Israël dit à Moïse: « Nous ne supportons pas un seul aliment. Invoque ton Seigneur afin qu'il nous fasse pousser ce que la terre produit: herbes, concombres, ail, lentilles et oignons. Voudriez-vous échanger ce qui est inférieur contre ce qui est meilleur ? »"
