# Verification: one source (Arslan's preface, scan pages 26-27, book pp. 9-10). The thesis that the Umayyads turned against the Mu'tazila for political reasons is a standard view in some histories but needs a modern source (for example on the mihna and Umayyad policy). Arslan's claim that the Mu'tazila sought a return to elective rule must be checked in their own writings. The entry is a summary of the preface's argument and is labelled as the author's view.
