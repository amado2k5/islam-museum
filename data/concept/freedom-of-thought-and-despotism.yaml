id: concept/freedom-of-thought-and-despotism
class: concept
kind: political
label: { ar: "حرية الفكر والاستبداد في تاريخ الإسلام", en: "Freedom of thought and despotism in Islamic history" }
summary:
  ar: "يعرض شكيب أرسلان في مقدمة الكتاب تصوراً عاماً لتاريخ الإسلام: عصر أول ساده الاجتهاد والحرية العقلية، ثم تحوّلت الخلافة من الشورى إلى الاستبداد بالحكم، فتبع ذلك انحسار الحرية الفكرية وغلبة النقل والتقليد على العقل. ويرى أن المعتزلة نشأت بحرية فكرية، فلما صار لها أثر سياسي خاف منها بعض الخلفاء الأمويين فحاربوها. ويذكر أن أهل السنة والنقل تغلبوا بعد ذلك، ويعدّ هذا التحول جزءاً من تاريخ الاستبداد في الشرق. هذه أطروحة المؤلف في المقدمة، وتحتاج إلى مقارنة بمراجع تاريخ الكلام والسياسة، ولا تُعدّ حكماً مقبولاً عند كل المؤرخين."
  en: "In his preface Arslan offers an overall thesis: an early age of free reasoning and ijtihad, followed by a shift from consultative caliphate to despotic rule, which narrowed free thought and gave tradition the upper hand over reason. He says the Mu'tazila began as a free-thinking school, and that Umayyad rulers who first favoured them turned against them once they acquired political weight. He treats the later dominance of traditionalists as part of this long decline. This is the preface's thesis, which needs checking against histories of theology and politics and is not accepted by all historians."
wings: [ideas]
periods: [period/abbasid-early]
