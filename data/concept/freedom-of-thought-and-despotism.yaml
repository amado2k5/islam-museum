label: { ar: "حرية الفكر والاستبداد في تاريخ الإسلام", en: "Freedom of thought and despotism in Islamic history", es: "Libertad de pensamiento y despotismo en la historia islámica", fr: "Liberté de pensée et despotisme dans l'histoire islamique", ur: "اسلامی تاریخ میں آزادی فکر اور استبداد" }
summary:
  ar: "يعرض شكيب أرسلان في مقدمة الكتاب تصوراً عاماً لتاريخ الإسلام: عصر أول ساده الاجتهاد والحرية العقلية، ثم تحوّلت الخلافة من الشورى إلى الاستبداد بالحكم، فتبع ذلك انحسار الحرية الفكرية وغلبة النقل والتقليد على العقل. ويرى أن المعتزلة نشأت بحرية فكرية، فلما صار لها أثر سياسي خاف منها بعض الخلفاء الأمويين فحاربوها. ويذكر أن أهل السنة والنقل تغلبوا بعد ذلك، ويعدّ هذا التحول جزءاً من تاريخ الاستبداد في الشرق. هذه أطروحة المؤلف في المقدمة، وتحتاج إلى مقارنة بمراجع تاريخ الكلام والسياسة، ولا تُعدّ حكماً مقبولاً عند كل المؤرخين."
  en: "In his preface Arslan offers an overall thesis: an early age of free reasoning and ijtihad, followed by a shift from consultative caliphate to despotic rule, which narrowed free thought and gave tradition the upper hand over reason. He says the Mu'tazila began as a free-thinking school, and that Umayyad rulers who first favoured them turned against them once they acquired political weight. He treats the later dominance of traditionalists as part of this long decline. This is the preface's thesis, which needs checking against histories of theology and politics and is not accepted by all historians."
  es: "En su prefacio, Arslan presenta una tesis general: una época temprana de libre razonamiento e ijtihad, seguida de una transición del califato consultivo al gobierno despótico, que limitó el libre pensamiento y otorgó a la tradición el predominio sobre la razón. Afirma que la escuela Mu'tazila surgió como una escuela de librepensamiento, y que los gobernantes omeyas, que inicialmente la favorecieron, se volvieron en su contra una vez que adquirió peso político. Considera el posterior predominio de los tradicionalistas como parte de este largo declive. Esta es la tesis del prefacio, que requiere contrastarse con la historia de la teología y la política, y que no es aceptada por todos los historiadores."
  fr: "Dans sa préface, Arslan propose une thèse générale: une période initiale de libre raisonnement et d’ijtihad, suivie d’une transition d’un califat consultatif à un pouvoir despotique, qui restreignit la liberté de pensée et donna l’ascendant à la tradition sur la raison. Il affirme que les Mu’tazilites furent à l’origine une école de pensée libre et que les souverains omeyyades, qui les avaient d’abord soutenus, se retournèrent contre eux une fois qu’ils eurent acquis une influence politique. Il considère la domination ultérieure des traditionalistes comme faisant partie de ce long déclin. Telle est la thèse de la préface, qui mérite d’être confrontée aux histoires de la théologie et de la politique et qui n’est pas partagée par tous les historiens."
  ur: "اپنے دیباچے میں ارسلان ایک مجموعی مقالہ پیش کرتے ہیں: آزاد استدلال اور اجتہاد کی ابتدائی عمر، اس کے بعد مشاورتی خلافت سے مطلق العنان حکمرانی کی طرف تبدیلی، جس نے آزاد فکر کو تنگ کر دیا اور روایت کو عقل پر بالادستی عطا کی۔ وہ کہتے ہیں کہ معتزلہ ایک آزاد سوچ کے مکتب کے طور پر شروع ہوا، اور اموی حکمران جنہوں نے سب سے پہلے ان کی حمایت کی، سیاسی وزن حاصل کرنے کے بعد ان کے خلاف ہو گئے۔ وہ روایت پسندوں کے بعد کے غلبے کو اس طویل زوال کا حصہ سمجھتا ہے۔ یہ دیباچہ کا مقالہ ہے، جسے الہیات اور سیاست کی تاریخوں کے خلاف جانچنے کی ضرورت ہے اور اسے تمام مورخین قبول نہیں کرتے۔"
