label:
  ar: كتابة الحديث
  en: Writing down the hadith
summary:
  ar: "اختلف الصدر الأول في كتابة الحديث: فروي النهي عن ذلك، وروي الإذن فيه، والنصوص الغالبة على الإباحة؛ وقد عرض المؤلف صحيفة عبد الله بن عمرو بن العاص، المسماة الصادقة، بإذن النبي، وأجمع المسلمون بعد ذلك على توسيع الإباحة، ولولا التدوين لدرس العلم في الأعصار المتأخرة {cite:manhaj-tawthiq-al-sunna-azhar p. 28}{cite:manhaj-tawthiq-al-sunna-azhar p. 29}{cite:manhaj-tawthiq-al-sunna-azhar p. 31}. ويوجّه ابن الصلاح الروايات المتعارضة بأن الإذن كان لمن يُخشى عليه النسيان، والنهي لمن يُوثق بحفظه، أو لئلا يختلط الحديث بصحف القرآن {cite:manhaj-tawthiq-al-sunna-azhar p. 30}. ثم تتابع التصنيف على الأبواب والمسانيد ثم الصحاح {cite:manhaj-tawthiq-al-sunna-azhar p. 51}{cite:manhaj-tawthiq-al-sunna-azhar p. 52}. ويذكر الشيخ علي الخفيف أن الأمر بالكتابة في أحاديث الإذن يُحمل على الإباحة والإرشاد لا الوجوب، وأن الوضع في الكتابة لم يكن مستقرًا بين الصحابة {cite:makanat-al-sunna-azhar p. 72}{cite:makanat-al-sunna-azhar p. 74}، وأن بعض الصحابة والتابعين كتبوا السنة بعد وفاة النبي، ومنهم من كتب التشهد والاستخارة {cite:makanat-al-sunna-azhar p. 76}."
