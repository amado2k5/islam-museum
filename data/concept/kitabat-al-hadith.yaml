id: concept/kitabat-al-hadith
class: concept
kind: term
label:
  ar: كتابة الحديث
  en: Writing down the hadith
  es: "Escribir el hadiz"
  fr: "Écrire le hadith"
  ur: "حدیث لکھنا"
  tr: "Hadis Yazısı"
  id: "Penulisan Hadis"
summary:
  ar: "اختلف الصدر الأول في كتابة الحديث: فروي النهي عن ذلك، وروي الإذن فيه، والنصوص الغالبة على الإباحة؛ وقد عرض المؤلف صحيفة عبد الله بن عمرو بن العاص، المسماة الصادقة، بإذن النبي، وأجمع المسلمون بعد ذلك على توسيع الإباحة، ولولا التدوين لدرس العلم في الأعصار المتأخرة {cite:manhaj-tawthiq-al-sunna-azhar p. 28}{cite:manhaj-tawthiq-al-sunna-azhar p. 29}{cite:manhaj-tawthiq-al-sunna-azhar p. 31}. ويوجّه ابن الصلاح الروايات المتعارضة بأن الإذن كان لمن يُخشى عليه النسيان، والنهي لمن يُوثق بحفظه، أو لئلا يختلط الحديث بصحف القرآن {cite:manhaj-tawthiq-al-sunna-azhar p. 30}. ثم تتابع التصنيف على الأبواب والمسانيد ثم الصحاح {cite:manhaj-tawthiq-al-sunna-azhar p. 51}{cite:manhaj-tawthiq-al-sunna-azhar p. 52}. ويذكر الشيخ علي الخفيف أن الأمر بالكتابة في أحاديث الإذن يُحمل على الإباحة والإرشاد لا الوجوب، وأن الوضع في الكتابة لم يكن مستقرًا بين الصحابة {cite:makanat-al-sunna-azhar p. 72}{cite:makanat-al-sunna-azhar p. 74}، وأن بعض الصحابة والتابعين كتبوا السنة بعد وفاة النبي، ومنهم من كتب التشهد والاستخارة {cite:makanat-al-sunna-azhar p. 76}."
  tr: "Erken dönem hadis yazımında farklılık gösteriyordu: bu hadis yasakları anlatıldı, izin rivayet edildi ve izin için baskın metinler sunuldu. Yazar, Abdullah ibn Amr ibn al-As'ın gazetesi olan El-Sadika adlı Peygamber'in iznini sundu ve Müslümanlar daha sonra oybirliğiyle izin verilmesini kabul etti. Belge olmadan, sonraki dönemlerde bilgi çalışması {atıf: Manhaj-Tavtik-al-Sunna-Ezhar, s. 28}{atıf:Manhaj-Tavsiq-el-Sunna-Ezhar, s. 29}{Cite:Manhaj-Tavsiq-al-Sunna-Azhar s. 31}. İbn al-Salah, iznin unutmaktan korkanlar için olduğunu, ezberleyeceklerine veya hadisin Kur'an zincirleriyle karışmaması için izin verildiğini söyleyerek çelişkili rivayetleri yönlendirir {atıf:manhaj-tawthiq-al-sunna-azhar s. 30}. Daha sonra sınıflandırma bölümler ve musnadlar bazında devam etti, ardından özgün derlemeler {atıf:manhaj-tavsiq-al-sunna-azhar s. 51}{cite:manhaj-tavtiq-al-sunna-azhar s. 52}. Şeyh Ali Al-Khafif izin hadislerinin yazılması emrinin zorunluluk değil, caiz ve rehberlik olarak yorumlandığını, Sahabeler arasında yazı durumunun istikrarlı olmadığını {cite:makanat-al-sunna-azhar s. 72}} ve bazı sahabeler ve takipçilerin Peygamber'in ölümünden sonra Sünnet'i yazdığını, bazılarının ise Taşahud ve İstihhara'yı yazdığını {cite:makanat-al-sunna-azhar s. 76} belirtir."
  id: "Periode awal berbeda dalam penulisan hadits: larangan ini diceritakan, izin diceritakan di dalamnya, dan teks dominan untuk kebolehan disajikan. Penulis mempresentasikan surat kabar Abdullah ibn Amr ibn al-As, berjudul Al-Sadiqa, dengan izin Nabi, dan umat Muslim kemudian sepakat untuk memperluas izin. Tanpa dokumentasi, studi pengetahuan di era berikutnya {cite:Manhaj-Tawthiq-al-Sunna-Azhar hlm. 28}{cite:Manhaj-Tawthiq-al-Sunna-Azhar hlm. 29}{cite:Manhaj-Tawthiq-al-Sunna-Azhar hlm. 31}. Ibn al-Salah mengarahkan narasi yang bertentangan dengan mengatakan bahwa izin diberikan kepada mereka yang takut melupakannya, dan melarangnya bagi mereka yang dipercaya untuk menghafalnya, atau agar hadis tidak bercampur dengan rantai Al-Qur'an {cite:manhaj-tawthiq-al-sunna-azhar hlm. 30}. Kemudian klasifikasi dilanjutkan berdasarkan bab dan Musnad, kemudian kumpulan otentik {cite:manhaj-tawthiq-al-sunna-azhar hlm. 51}{cite:manhaj-tawthiq-al-sunna-azhar hlm. 52}. Sheikh Ali Al-Khafif menyebutkan bahwa perintah untuk menuliskan hadis izin diartikan sebagai izin dan bimbingan, bukan kewajiban, dan bahwa situasi penulisan tidak stabil di antara Para Sahabat {cite:makanat-al-sunna-azhar hlm. 72}, dan bahwa beberapa Sahabat dan Pengikut menulis Sunnah setelah wafatnya Nabi, dan beberapa menulis Tashahhud dan Istikhara {cite:makanat-al-sunna-azhar hlm. 76}."
