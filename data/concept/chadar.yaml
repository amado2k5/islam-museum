  ur: "مغل باغ میں ایک ڈھلوان پتھر کا ریمپ جس کے نیچے پانی چھتوں کے درمیان دوڑتا ہے، اس کی سطح لہر کو بڑھانے کے لیے ٹوٹ گئی ہے"
