id: concept/la-ilaha-illa-allah
class: concept
kind: doctrine
label:
  ar: "لا إله إلا الله"
  en: "La ilaha illa Allah"
  ur: "لا إلٰہ إلا اللہ ⁦(کلمۂ توحید)⁩"
  es: "La ilaha illa Allah"
  fr: "La ilaha illa Allah"
  tr: "Allah'tan başka bir tanrı yoktur"
  id: "Tidak ada Tuhan selain Allah"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن «لا إله إلا الله» أعلى شعب الإيمان، وأن الصحابة فهموها فصارت أخلاقًا في حياتهم، وأن الأمة لا تتقدم إلا بفهم مقتضاها. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}"
  en: "Sheikh Omar Abdelkafy holds that 'la ilaha illa Allah' is the highest branch of faith, that the Companions understood it and lived its ethics, and that the nation advances only by understanding what it requires {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک «لا إله إلا الله» ایمان کی سب سے اعلیٰ شاخ ہے، صحابہ نے اسے سمجھا اور اس کے اخلاق کو زندگی میں اپنایا، اور امت اسی وقت آگے بڑھتی ہے جب وہ اس کے تقاضے سمجھے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}۔"
  es: "El jeque Omar Abdelkafy sostiene que 'la ilaha illa Allah' es la rama más elevada de la fe, que los Compañeros la entendieron y vivieron su ética, y que la nación avanza solo al comprender lo que requiere {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}."
  fr: "Le cheikh Omar Abdelkafy soutient que « la ilaha illa Allah » est la plus haute branche de la foi, que les Compagnons l'ont comprise et ont vécu son éthique, et que la nation ne progresse qu'en comprenant ce dont elle a besoin {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}."
  tr: "Şeyh Ömer Abdülkafi, \"Allah'tan başka tanrı yoktur\"ın en yüksek inanç dalı olduğuna inanır ve Sahabelerin bunu anladığını, hayatlarında ahlaki bir ilke haline geldiğini ve ulusun ancak onun gerekliliklerini anlayarak ilerlediğini düşünür. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}"
  id: "Sheikh Omar Abdel Kafi percaya bahwa \"Tidak ada tuhan selain Allah\" adalah cabang tertinggi dari iman, dan para sahabat memahaminya, menjadikannya prinsip moral dalam hidup mereka, dan bahwa bangsa tidak maju kecuali dengan memahami kebutuhannya. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}"
