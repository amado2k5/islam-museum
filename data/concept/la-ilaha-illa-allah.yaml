label:
  ar: "لا إله إلا الله"
  en: "La ilaha illa Allah"
  ur: "لا إلٰہ إلا اللہ (کلمۂ توحید)"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن «لا إله إلا الله» أعلى شعب الإيمان، وأن الصحابة فهموها فصارت أخلاقًا في حياتهم، وأن الأمة لا تتقدم إلا بفهم مقتضاها. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}"
  en: "Sheikh Omar Abdelkafy holds that 'la ilaha illa Allah' is the highest branch of faith, that the Companions understood it and lived its ethics, and that the nation advances only by understanding what it requires {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک «لا إله إلا الله» ایمان کی سب سے اعلیٰ شاخ ہے، صحابہ نے اسے سمجھا اور اس کے اخلاق کو زندگی میں اپنایا، اور امت اسی وقت آگے بڑھتی ہے جب وہ اس کے تقاضے سمجھے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 00:05:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep01 01:11:00}۔"
