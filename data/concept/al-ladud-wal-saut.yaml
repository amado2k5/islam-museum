id: concept/al-ladud-wal-saut
class: concept
kind: scientific
label:
  ar: "اللدود والسعوط"
  en: "Ladud and sa'ut (oral and nasal drops)"
  fr: "Ladud et sa'ut (instillations buccales et nasales)"
  ur: "لدود اور سعوط ⁦(منہ اور ناک میں دوا)⁩"
  es: "Ladud y sa'ut (gotas orales y nasales)"
  tr: "Akrep ve Stoot"
  id: "Scorpio dan Stoot"
summary:
  ar: "اللدود ما يُسقاه الإنسان في أحد جانبي الفم، والسعوط ما يُصبّ في الأنف {cite:zad-al-maad p.619} {cite:zad-al-maad p.624}. وفي الأخبار أن النبي استعط {cite:sahih-al-bukhari 5691}، وأن أهله لدّوه في مرضه فأشار إليهم أن لا يفعلوا، ثم قال: «لا يبقى في البيت أحد إلا لُدّ إلا العباس» {cite:sahih-al-bukhari 5709}، وأن العود الهندي «يُستعط به من العذرة ويُلد به من ذات الجنب» {cite:sahih-al-bukhari 5692}. وفي الترمذي «إن خير ما تداويتم به السعوط واللدود والحجامة والمشي» وفي سنده ضعف عند المحقق {cite:zad-al-maad p.616}."
  en: "Ladud is what a person is given in one side of the mouth, and sa'ut is what is poured into the nose {cite:zad-al-maad p.619} {cite:zad-al-maad p.624}. The reports have the Prophet using a nasal drop {cite:sahih-al-bukhari 5691}, and his household giving him an oral drop in his illness while he signalled them not to, after which he said 'no one will be left in the house without being given a drop, except al-Abbas' {cite:sahih-al-bukhari 5709}; and Indian aloeswood 'is used as a nasal drop for the throat ailment and an oral drop for pleurisy' {cite:sahih-al-bukhari 5692}. In al-Tirmidhi: 'the best of what you treat yourselves with is the nasal drop, the oral drop, cupping and the purge', whose chain the editor calls weak {cite:zad-al-maad p.616}."
  fr: "Le ladud est ce que l’on administre à une personne par l’un des côtés de la bouche, et le sa'ut ce que l’on verse dans le nez {cite:zad-al-maad p.619} {cite:zad-al-maad p.624}. Les récits rapportent que le Prophète utilisait une instillation nasale {cite:sahih-al-bukhari 5691}, et que les gens de sa maison lui administrèrent une instillation buccale pendant sa maladie alors qu’il leur faisait signe de ne pas le faire, après quoi il dit : « Il ne restera personne dans la maison sans recevoir une instillation, sauf al-Abbas » {cite:sahih-al-bukhari 5709} ; et que le bois d’aloès indien « s’emploie en instillation nasale pour le mal de gorge et en instillation buccale pour la pleurésie » {cite:sahih-al-bukhari 5692}. Chez al-Tirmidhi : « Le meilleur de ce par quoi vous vous soignez est l’instillation nasale, l’instillation buccale, la ventouse et le purgatif », dont l’éditeur qualifie la chaîne de faible {cite:zad-al-maad p.616}."
  ur: "لدود وہ دوا ہے جو آدمی کو منہ کے ایک جانب پلائی جائے، اور سعوط وہ ہے جو ناک میں ڈالی جائے {cite:zad-al-maad p.619} {cite:zad-al-maad p.624}۔ روایات میں ہے کہ نبی نے سعوط لیا {cite:sahih-al-bukhari 5691}، اور آپ کے گھر والوں نے آپ کی بیماری میں آپ کو لدود پلایا جب کہ آپ اشارے سے منع کرتے رہے، پھر فرمایا: «گھر میں کوئی نہ رہے مگر اسے لدود دیا جائے، سوائے عباس کے» {cite:sahih-al-bukhari 5709}؛ اور ہندی عود کے بارے میں «اسے ناک میں سعوط کے طور پر عذرہ کے لیے اور منہ میں لدود کے طور پر ذات الجنب کے لیے استعمال کیا جاتا ہے» {cite:sahih-al-bukhari 5692}۔ ترمذی میں ہے: «جن چیزوں سے تم علاج کرتے ہو ان میں بہترین سعوط، لدود، حجامہ اور دست آور دوا ہے»، اور محقق اس کی سند کو ضعیف کہتے ہیں {cite:zad-al-maad p.616}۔"
  es: "Ladud es lo que se le da a una persona en un lado de la boca, y sa'ut es lo que se vierte en la nariz {cite:zad-al-maad p.619} {cite:zad-al-maad p.624}. Los relatos indican que el Profeta usó gotas nasales {cite:sahih-al-bukhari 5691}, y que su familia le dio gotas orales durante su enfermedad mientras él les hacía señas para que no lo hicieran, después de lo cual dijo: \"Nadie quedará en la casa sin que se le dé una gota, excepto al-Abbas\" {cite:sahih-al-bukhari 5709}; y el aloe indio \"se usa como gotas nasales para la afección de la garganta y como gotas orales para la pleuresía\" {cite:sahih-al-bukhari 5692}. En al-Tirmidhi: 'lo mejor de lo que usáis para trataros es la gota nasal, la gota oral, la ventosaterapia y la purga', cuya cadena el editor llama débil {cite:zad-al-maad p.616}."
  tr: "'Liddu', bir kişinin ağzının bir tarafına suya verdiği şeydir ve 's'ut' buruna dökülen şeydir {cite:zad-al-maad s.619} {cite:zad-al-maad s.624}. Rivayetlerde, Peygamber yardım istemiş {cite:sahih-al-bukhari 5691} ve ailesinin kendisinden hasta olduğunu, bu yüzden onlara yardım etmemelerini tavsiye etmiş, ardından şöyle demiştir: \"Evde El-Abbas dışında kimse kalmaz\" {cite:sahih-al-bukhari 5709}} ve Hint udunun \"bakireden ve yan nefesten yardım aramak için kullanıldığını\" {cite:sahih-al-bukhari 5692} demiştir. Ve El-Tirmidi'de: \"Yapabileceğiniz en iyi şey hastaları, sertleri, sert olanları ve yürüyenleri tedavi etmektir,\" ve zinciri doğrulayıcıya göre zayıftır {cite:zad-al-maad s.616}."
  id: "'Liddu' adalah apa yang seseorang tuangkan ke dalam air di satu sisi mulutnya, dan 's'ut' adalah apa yang dituangkan ke hidung {cite:zad-al-maad hlm.619} {cite:zad-al-maad hlm.624}. Dalam riwayat, Nabi meminta bantuan {cite:sahih-al-bukhari 5691} dan menasihati keluarganya agar tidak membantunya karena ia sakit, lalu berkata: \"Tidak ada yang tinggal di rumah kecuali Al-Abbas\" {cite:sahih-al-bukhari 5709}} dan bahwa oud India \"digunakan untuk mencari pertolongan dari perawan dan nafas samping\" {cite:sahih-al-bukhari 5692}. Dan dalam Al-Tirmidhi: \"Hal terbaik yang bisa Anda lakukan adalah merawat yang sakit, yang keras, yang kaku, dan yang berjalan,\" dan menurut verifikat berantai {cite:zad-al-maad hlm.616}, itu lemah."
