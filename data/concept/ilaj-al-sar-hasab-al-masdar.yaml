label:
  ar: "علاج الصرع بحسب خلطه ومبدئه"
  en: "Treatment of epilepsy by humour and source"
  ur: "خلط اور ماخذ کے لحاظ سے صرع کا علاج"
  es: "Tratamiento de la epilepsia mediante el humor y la fuente"
summary:
  ar: "علاج الصرع بحسب مادته ومبدئه: الدماغي باستفراغ مادته وفصده إن وجب؛ البلغمي والسوداوي بما يستفرغ كل منهما؛ الصفراوي بالتبريد والترطيب وخصوصاً بالحقن؛ المعدي بأرفق المستفرغات وتقوية المعدة؛ والمتصاعد من عضو بربط فوق العضو عند النوبة واستفراغ خلطه {cite:canon-ibn-sina-print-v2 p.129} {cite:canon-ibn-sina-print-v2 p.130}"
  en: "Treatment of epilepsy by its matter and source: the cerebral by evacuating its matter and venesection when required; the phlegmatic and melancholic by evacuating each humour; the bilious by cooling and moistening, especially clysters; the gastric by the gentlest evacuants and strengthening the stomach; that rising from an organ by binding above the organ at the fit and evacuating its humour {cite:canon-ibn-sina-print-v2 p.129} {cite:canon-ibn-sina-print-v2 p.130}"
  ur: "اپنے مادے اور ماخذ کے لحاظ سے صرع کا علاج: دماغی کے لیے اس کے مادے کا استفراغ اور ضرورت پر فصد؛ بلغمی اور سوداوی کے لیے ہر خلط کے مستفرغ؛ صفراوی کے لیے تبرید و ترطیب خاص کر حقن؛ معدی کے لیے نرم ترین مستفرغات اور معدے کی تقویت؛ کسی عضو سے صعود کرنے والے کے لیے نوبت پر عضو کے اوپر باندھنا اور اس کے خلط کا استفراغ {cite:canon-ibn-sina-print-v2 p.129} {cite:canon-ibn-sina-print-v2 p.130}۔"
  es: "Tratamiento de la epilepsia según su materia y origen: la cerebral mediante la evacuación de su materia y la flebectomía cuando sea necesario; la flemática y melancólica mediante la evacuación de cada humor; la biliar mediante enfriamiento y humectación, especialmente con enemas; la gástrica mediante los evacuantes más suaves y el fortalecimiento del estómago; la que se origina en un órgano mediante la ligadura por encima del órgano durante la crisis y la evacuación de su humor {cite:canon-ibn-sina-print-v2 p.129} {cite:canon-ibn-sina-print-v2 p.130}"
