label:
  ar: "عرق"
  en: "Araq (sweat), as a drug"
  fr: "Araq (sueur), comme remède"
  ur: "عرق"
  es: "Araq (sudor), como droga"
  tr: "ter"
  id: "Keringat"
summary:
  ar: "العرق في الكتاب مائية الدم خالطها صديد مراري، أنضج من البول، وينقل أن عرق المصارعين يحلل ورم الأربية وأورام الثدي وجمود اللبن مع الدهن {cite:canon-ibn-sina-print-v1 p.622}"
  en: "Araq is in the book sweat, the wateriness of blood mixed with a bilious serum and riper than urine; the sweat of wrestlers is said to dissolve a swelling of the groin, swellings of the breast and the clotting of milk, taken with oil {cite:canon-ibn-sina-print-v1 p.622}"
  fr: "Dans le livre, araq désigne la sueur, partie aqueuse du sang mêlée d’un sérum bilieux et plus mûre que l’urine ; la sueur des lutteurs est dite dissoudre une tuméfaction de l’aine, les tuméfactions du sein et le lait coagulé, lorsqu’elle est employée avec de l’huile {cite:canon-ibn-sina-print-v1 p.622}"
  ur: "عرق کتاب میں پسینہ ہے، خون کی آبیت جس میں صفراوی رطوبت ملی ہو اور پیشاب سے زیادہ پختہ؛ نقل ہے کہ پہلوانوں کا پسینہ تیل کے ساتھ ران کے ورم، پستان کے ورموں اور دودھ کے جمنے کو تحلیل کرتا ہے {cite:canon-ibn-sina-print-v1 p.622}۔"
  es: "Araq es en el libro sudor, la fluidez de la sangre mezclada con un suero biliar y más espesa que la orina; se dice que el sudor de los luchadores disuelve la hinchazón de la ingle, la hinchazón de los senos y la coagulación de la leche, tomado con aceite {cite:canon-ibn-sina-print-v1 p.622}"
  tr: "Kitaptaki ter, kan suyu ile safra irininin karışımıdır, idrar kadar olgundur ve güreşçilerin terinin kasık tümörlerini, meme tümörlerini ve süt kümelerini yağla analiz ettiği bildirilmiştir {cite:canon-ibn-sina-print-v1 s.622}"
  id: "Keringat dalam buku ini adalah air darah yang bercampur dengan nanah empedu, lebih matang daripada urin, dan dilaporkan bahwa keringat pegulat menganalisis tumor inguinal, tumor payudara, dan gumpalan susu dengan lemak {cite:canon-ibn-sina-print-v1 hlm.622}"
