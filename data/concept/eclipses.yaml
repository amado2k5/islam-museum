label: { ar: "الكسوف والخسوف", en: "Solar and lunar eclipses", es: "eclipses solares y lunares", fr: "Éclipses solaires et lunaires", ur: "سورج اور چاند گرہن", tr: "Tutulma ve Tutulma", id: "Gerhana dan Gerhana" }
summary:
  ar: "كسوف الشمس باعتراض القمر بينها وبين الأرض في الاجتماع، وخسوف القمر بدخوله ظل الأرض في المقابلة. يبيّن الفرغاني أن القمر يكسف جرم الشمس كله في الاجتماع عند الرأس والذنب، وأن اختلاف المنظر يغيّر ما يُرى، وأن أقل ما بين الكسوفات ستة أشهر قمرية. {cite:farghani-elements-astronomy p. 23}{cite:farghani-elements-astronomy p. 24}{cite:farghani-elements-astronomy p. 20}"
  en: "A solar eclipse is the moon coming between the sun and the earth at conjunction; a lunar eclipse is the moon entering the earth's shadow at opposition. al-Farghani treats them in chapters 28 to 30: parallax changes what is seen, and the least interval between eclipses of either kind is six lunar months {cite:farghani-elements-astronomy p. 23}{cite:farghani-elements-astronomy p. 24}{cite:farghani-elements-astronomy p. 20}."
  es: "Un eclipse solar es cuando la luna se interpone entre el sol y la tierra en conjunción; un eclipse lunar es cuando la luna entra en la sombra de la tierra en oposición. Al-Farghani los trata en los capítulos 28 a 30: la paralaje cambia lo que se ve, y el intervalo mínimo entre eclipses de cualquier tipo es de seis meses lunares {cite:farghani-elements-astronomy p. 23}{cite:farghani-elements-astronomy p. 24}{cite:farghani-elements-astronomy p. 20}."
  fr: "Une éclipse solaire se produit lorsque la Lune se place entre le Soleil et la Terre lors de la conjonction; une éclipse lunaire se produit lorsque la Lune entre dans l’ombre de la Terre lors de l’opposition. Al-Farghani les traite dans les chapitres 28 à 30: la parallaxe modifie ce que l’on observe, et l’intervalle minimal entre deux éclipses, qu’elles soient solaires ou lunaires, est de six mois lunaires."
  ur: "سورج گرہن وہ چاند ہے جو سورج اور زمین کے درمیان مل کر آتا ہے۔ چاند گرہن وہ چاند ہے جو مخالفت میں زمین کے سائے میں داخل ہوتا ہے۔ الفرغانی نے ابواب 28 تا 30 میں ان کا علاج کیا ہے: پیرالاکس جو کچھ دیکھا جاتا ہے اسے بدل دیتا ہے، اور کسی بھی قسم کے چاند گرہن کے درمیان کم سے کم وقفہ چھ قمری مہینوں کا ہوتا ہے۔ 23}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 24}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 20}۔"
  tr: "Güneş tutulması, Ay'ın Dünya ile Dünya ile kesiştiği ve ay tutulmasının karşısındaki Dünya'nın gölgesine girdiği zaman gerçekleşir. Al-Farghani, ayın baş ve kuyruk kavuşumunda tüm güneş cismini tuttuğunu, görünüm farkının görüleni değiştirdiğini ve tutulmalar arasındaki minimum sürenin altı ay olduğunu açıklar. {cite:farghani-elements-astronomy s. 23} {cite:farghani-elements-astronomy s. 24} {cite:farghani-elements-astronomy s. 20}"
  id: "Gerhana matahari terjadi ketika bulan berpotongan dengan Bumi bersamaan dengan Bumi, dan gerhana bulan ketika memasuki bayangan Bumi yang berlawanan. Al-Farghani menjelaskan bahwa bulan menutupi seluruh tubuh matahari pada konjungsi di kepala dan ekor, bahwa perbedaan penampilan mengubah apa yang terlihat, dan bahwa batas minimum antara gerhana adalah enam bulan lunar. {cite:Farghani-elements-astronomy hlm. 23} {cite:Farghani-elements-astronomy hlm. 24} {cite:Farghani-elements-astronomy hlm. 20}"
