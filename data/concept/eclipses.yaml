summary:
  ar: "كسوف الشمس باعتراض القمر بينها وبين الأرض في الاجتماع، وخسوف القمر بدخوله ظل الأرض في المقابلة. يبيّن الفرغاني أن القمر يكسف جرم الشمس كله في الاجتماع عند الرأس والذنب، وأن اختلاف المنظر يغيّر ما يُرى، وأن أقل ما بين الكسوفات ستة أشهر قمرية. {cite:farghani-elements-astronomy p. 23}{cite:farghani-elements-astronomy p. 24}{cite:farghani-elements-astronomy p. 20}"
  en: "A solar eclipse is the moon coming between the sun and the earth at conjunction; a lunar eclipse is the moon entering the earth's shadow at opposition. al-Farghani treats them in chapters 28 to 30: parallax changes what is seen, and the least interval between eclipses of either kind is six lunar months {cite:farghani-elements-astronomy p. 23}{cite:farghani-elements-astronomy p. 24}{cite:farghani-elements-astronomy p. 20}."
