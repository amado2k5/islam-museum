id: concept/masahif-al-sahaba
class: concept
kind: term
label: {ar: "مصاحف الصحابة", en: "The Companions' codices", es: "Los códices de los Compañeros", fr: "Les codex des Compagnons", ur: "صحابہ کے ضابطے۔", tr: "Sahabelerin Kur'anları", id: "Al-Qur'an Para Sahabat"}
summary:
  ar: "أورد ابن النديم ترتيب السور في مصحف أبي بن كعب رواية عن محمد بن عبد الملك الأنصاري بقرية الأنصار على رأس فرسخين من البصرة فنظر فيه الفضل بن شاذان واستخرج أوائل السور فكانت مائة وست عشرة سورة ومنها سورتا الخلع والحفد وهما قنتا الوتر اللهم إنا نستعينك ونستغفرك واللهم إياك نعبد ولك نصلي ونسجد، وجميع آي القرآن في قول أبي ستة آلاف ومائتان وعشر آيات، وترتيب مصحف علي بن أبي طالب على رواية عبد خير أنه رأى من الناس طيرة عند وفاة النبي فأقسم أن لا يضع عن ظهره رداءه حتى يجمع القرآن فجلس في بيته ثلاثة أيام حتى جمعه فهو أول مصحف جمع فيه القرآن من قلبه وكان المصحف عند آل جعفر، ورأى ابن النديم في زمانه عند أبي يعلى حمزة الحسني مصحفاً سقط منه أوراق بخط علي يتوارثه بنو حسن على مر الزمان، وفي قول عطاء بن يسار سور القرآن مائة وأربع عشرة وآياته ستة آلاف ومائة وسبعون وكلماته سبعة وسبعون ألفاً وأربع مائة وتسعة وثلاثون كلمة وحروفه ثلاث مائة ألف وثلاثة وعشرون ألفاً وخمسة عشر حرفاً، وفي قول عاصم الجحدري مائة وثلاث عشرة سورة، وفي قول يحيى بن الحارث الذماري ستة آلاف ومائتان وست وعشرون آية وثلاث مائة ألف حرف وأحد وعشرون ألفاً وخمس مائة وثلاثون حرفاً {cite:fihrist-ibn-al-nadim p. 67-69}."
  en: "Ubayy's 116-sura codex with the two qunut suras, Ali's three-day compilation, and the verse/letter tallies {cite:fihrist-ibn-al-nadim p. 67-69}."
  es: "El códice de Ubayy de 116 suras con las dos suras qunut, la compilación de Ali de tres días y los recuentos de versículos/letras {cite:fihrist-ibn-al-nadim p. 67-69}."
  fr: "Le codex d'Ubayy de 116 sourates avec les deux sourates de Qunut, la compilation de trois jours d'Ali et les décomptes de versets/lettres {cite:fihrist-ibn-al-nadim p. 67-69}."
  ur: "دو قنوت سورتوں کے ساتھ ابی کی 116 سورت کا ضابطہ، علی کی تین روزہ تالیف، اور آیت/حروف کی لمبائی {حوالہ: فہرست ابن الندیم صفحہ 67-69}۔"
  tr: "İbn el-Nadim, Muhammed bin Abdülmelik el-Ensari'nin Ensar köyündeki Muhammed ibn Abdülmelik el-Ensari'nin başındaki Ebu bin Ka'b'ın Muşafı'ndaki surelerin düzenini inceledi ve Vitr'in kanatı olan Hula ve el-Hafd sureleri de dahil olmak üzere yüz on altı surenin başlangıcını çıkardı: 'Ey Allah, gerçekten yardımını dileiyoruz ve bağışlanmanı dileiyoruz, ey Allah, biz sadece Sana ibadet ederiz, sana dua eder ve secde ederiz.' Babamın sözlerindeki tüm Kur'an ayetleri altı bin iki yüz on ayetten oluşur ve Ali bin Ebi Talib'in Muşafı'nın düzeni Abd Khayr'in rivayetine göre düzenlenmiştir. Peygamber'in ölüm anında bazı insanları gördü ve Kur'an'ı derlemeden pelerinini çıkarmamaya yemin etti. Üç gün evde kaldı ve Kur'an'ı kalbinden derlediği ilk Kur'andı, bu Kur'an, Ja'far'ın ailesiyle birlikteydi. İbn el-Nadim, Ebu Ya'la Hamza el-Hasani ile birlikte olduğu zamanlarda, Ali'nin el yazısıyla yazılmış sayfalardan düşen ve zamanla Banu Hasan'a miras kalan bir Kur'an gördü. Ata ibn Yasar'a göre, Kur'an yüz on dört ve ayetleri altı bin yüz yetmiştir. Sözleri yetmiş yedi bin dört yüz otuz dokuz kelime, harfleri ise üç yüz bin yirmi üç bin on beş harften oluşur. Asim al-Jahdari'ye göre yüz on üç sure, Yahya ibn al-Haris al-Dhamari'nin sözlerinde ise altı bin iki yüz yirmi altı ayet, üç yüz bin harf ve yirmi bir bin beş yüz otuz harf {atıf:Fihrist-ibn-al-nadim s. 67-69} vardır."
  id: "Ibn al-Nadim memasukkan susunan surah dalam Mushaf Abu ibn Ka'b, yang diceritakan dari Muhammad ibn Abd al-Malik al-Ansari di desa al-Ansar, di depan dua farsakh dari Basra. Al-Fadl ibn Shadhan memeriksanya dan mengambil awal surah-surah yang berjumlah seratus enam belas surah, termasuk surah Khula' dan al-Hafd, yang merupakan qanat Witr: 'Ya Allah, sesungguhnya kami memohon pertolongan-Mu dan memohon ampun-Mu, dan ya Allah, hanya Engkau yang kami sembah, dan kami berdoa dan sujud kepada-Mu.' Semua ayat Al-Qur'an dalam kata-kata ayahku adalah enam ribu dua ratus sepuluh ayat, dan susunan Mushaf Ali ibn Abi Talib menurut riwayat Abd Khayr. Ia melihat beberapa orang pada saat kematian Nabi dan bersumpah tidak akan melepas jubahnya sampai ia menyusun Al-Qur'an. Ia tinggal di rumah selama tiga hari sampai ia menyusunnya, yang merupakan Al-Qur'an pertama di mana ia menyusun Al-Qur'an dari hatinya, dan Al-Qur'an itu bersama keluarga Ja'far. Ibn al-Nadim melihat sebuah Al-Qur'an pada masanya bersama Abu Ya'la Hamza al-Hasani yang jatuh dari halaman tulisan tangan Ali, diwariskan oleh Banu Hasan seiring waktu. Menurut Ata ibn Yasar, Al-Qur'an adalah seratus empat belas dan ayatnya enam ribu seratus tujuh puluh. Kata-katanya adalah tujuh puluh tujuh ribu empat ratus tiga puluh sembilan kata, dan huruf-hurufnya tiga ratus ribu dua puluh tiga ribu, lima belas huruf. Menurut Asim al-Jahdari, terdapat seratus tiga belas surah, dan dalam perkataan Yahya ibn al-Harith al-Dhamari, enam ribu dua ratus dua puluh enam ayat, tiga ratus ribu huruf, dan dua puluh satu ribu lima ratus tiga puluh huruf {cite:fihrist-ibn-al-nadim hlm. 67-69}."
