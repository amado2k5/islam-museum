label: { ar: "مصاحف الصحابة", en: "The Companions' codices" }
summary:
  ar: "أورد ابن النديم ترتيب السور في مصحف أبي بن كعب رواية عن محمد بن عبد الملك الأنصاري بقرية الأنصار على رأس فرسخين من البصرة فنظر فيه الفضل بن شاذان واستخرج أوائل السور فكانت مائة وست عشرة سورة ومنها سورتا الخلع والحفد وهما قنتا الوتر اللهم إنا نستعينك ونستغفرك واللهم إياك نعبد ولك نصلي ونسجد، وجميع آي القرآن في قول أبي ستة آلاف ومائتان وعشر آيات، وترتيب مصحف علي بن أبي طالب على رواية عبد خير أنه رأى من الناس طيرة عند وفاة النبي فأقسم أن لا يضع عن ظهره رداءه حتى يجمع القرآن فجلس في بيته ثلاثة أيام حتى جمعه فهو أول مصحف جمع فيه القرآن من قلبه وكان المصحف عند آل جعفر، ورأى ابن النديم في زمانه عند أبي يعلى حمزة الحسني مصحفاً سقط منه أوراق بخط علي يتوارثه بنو حسن على مر الزمان، وفي قول عطاء بن يسار سور القرآن مائة وأربع عشرة وآياته ستة آلاف ومائة وسبعون وكلماته سبعة وسبعون ألفاً وأربع مائة وتسعة وثلاثون كلمة وحروفه ثلاث مائة ألف وثلاثة وعشرون ألفاً وخمسة عشر حرفاً، وفي قول عاصم الجحدري مائة وثلاث عشرة سورة، وفي قول يحيى بن الحارث الذماري ستة آلاف ومائتان وست وعشرون آية وثلاث مائة ألف حرف وأحد وعشرون ألفاً وخمس مائة وثلاثون حرفاً {cite:fihrist-ibn-al-nadim p. 67-69}."
  en: "Ubayy's 116-sura codex with the two qunut suras, Ali's three-day compilation, and the verse/letter tallies {cite:fihrist-ibn-al-nadim p. 67-69}."
