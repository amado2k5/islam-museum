id: concept/tarjia-in-adhan
class: concept
kind: legal
label:
  ar: "الترجيع"
  en: "Tarjia (repeating the testimonies in the call to prayer)"
  ur: "ترجیع ⁦(اذان میں کلمۂ شہادت کی تکرار)⁩"
  es: "Tarjía (repitiendo los testimonios en la llamada a la oración)"
  fr: "Tarjia (répétant les témoignages de l'appel à la prière)"
summary:
  ar: "الترجيع في الأذان أن يخفض المؤذن صوته بالشهادتين مع إسماعه الحاضرين، ثم يعود فيرفع صوته بهما. والحنفية والحنابلة على أنه لا ترجيع في الأذان، والمالكية والشافعية يسنونه، وعند بعض الشافعية ركن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4948}"
  en: "Tarjia in the call to prayer is the muezzin lowering his voice on the two testimonies while letting those present hear, then raising it again on them. The Hanafis and Hanbalis hold there is no tarjia in the call, the Malikis and Shafi'is recommend it, and some Shafi'is hold it a pillar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4948}"
  es: "La tarjá en la llamada a la oración consiste en que el muecín baja la voz al pronunciar los dos testimonios, permitiendo que los presentes los escuchen, para luego volver a elevarla. Los hanafíes y hanbalíes sostienen que no hay tarjá en la llamada, los malikíes y shafiíes la recomiendan, y algunos shafiíes la consideran un pilar fundamental. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4948}"
  fr: "La tarjia dans l'appel à la prière consiste pour le muezzin à baisser la voix sur les deux témoignages, tout en laissant les fidèles les entendre, puis à la relever à leur tour. Les hanafites et les hanbalites considèrent qu'il n'y a pas de tarjia dans l'appel, les malikites et les chaféites la recommandent, et certains chaféites la considèrent comme un pilier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4948}"
  ur: "اذان میں مؤذن اپنی آواز کو دو شہادتوں پر پست کر کے حاضرین کو سننے دیتا ہے، پھر ان پر دوبارہ بلند کرتا ہے۔ احناف اور حنبلی کہتے ہیں کہ اذان میں ترجیہ نہیں ہے، مالکیہ اور شافعی اس کی سفارش کرتے ہیں اور بعض شافعی اسے ستون کہتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4947}"
