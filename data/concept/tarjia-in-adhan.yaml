  en: "Tarjia (repeating the testimonies in the call to prayer)"
  ur: "ترجیع (اذان میں کلمۂ شہادت کی تکرار)"
summary:
  ar: "الترجيع في الأذان أن يخفض المؤذن صوته بالشهادتين مع إسماعه الحاضرين، ثم يعود فيرفع صوته بهما. والحنفية والحنابلة على أنه لا ترجيع في الأذان، والمالكية والشافعية يسنونه، وعند بعض الشافعية ركن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4948}"
  en: "Tarjia in the call to prayer is the muezzin lowering his voice on the two testimonies while letting those present hear, then raising it again on them. The Hanafis and Hanbalis hold there is no tarjia in the call, the Malikis and Shafi'is recommend it, and some Shafi'is hold it a pillar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4948}"
