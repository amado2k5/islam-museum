id: concept/canon-feeding-in-acute-and-chronic-diseases
class: concept
kind: scientific
label:
  ar: "الغذاء في الأمراض الحادة والمزمنة عند ابن سينا"
  en: "Feeding in acute and chronic diseases in the Canon"
  fr: "Alimentation des maladies aiguës et chroniques dans le Canon"
  ur: "حاد اور مزمن بیماریوں میں غذا قانون میں"
  es: "Alimentación en enfermedades agudas y crónicas en el Canon"
  tr: "İbn Sina'ya göre Akut ve Kronik Hastalıklarda Gıda"
  id: "Makanan dalam Penyakit Akut dan Kronis menurut Avicenna"
summary:
  ar: "يقرر ابن سينا أن تقليل الغذاء ومنعه أكثر ما يتكلف في الأمراض الحادة، وأنه في المزمنة أقل لأن العناية بالقوة فيها أكثر، إذ بحرانها بعيد، ثم يبين كيف تتدرج التغذية في مراحل المرض الحاد {cite:canon-ibn-sina-print-v1 pp.267-268}."
  en: "Ibn Sina states that reducing and withholding food is most often undertaken in acute diseases and less so in chronic ones, where more care is given to the strength because the crisis is far off, and then shows how feeding is graded through the stages of an acute disease {cite:canon-ibn-sina-print-v1 pp.267-268}."
  fr: "Ibn Sina réduit ou supprime surtout la nourriture dans l’aigu, moins dans le chronique où la crise lointaine impose de conserver la force ; il gradue ensuite l’alimentation aux stades de l’aigu {cite:canon-ibn-sina-print-v1 pp.267-268}."
  es: "Ibn Sina afirma que la reducción y la suspensión de alimentos se realizan con mayor frecuencia en enfermedades agudas y con menos frecuencia en enfermedades crónicas, donde se presta más atención a la fortaleza porque la crisis está lejos, y luego muestra cómo se gradúa la alimentación a través de las etapas de una enfermedad aguda {cite:canon-ibn-sina-print-v1 pp.267-268}."
  ur: "ابن سینا کا کہنا ہے کہ خوراک کو کم کرنا اور روکنا اکثر شدید بیماریوں میں ہوتا ہے اور دائمی بیماریوں میں کم ہوتا ہے، جہاں طاقت کا زیادہ خیال رکھا جاتا ہے کیونکہ بحران بہت دور ہے، اور پھر یہ ظاہر کرتا ہے کہ خوراک کو کس طرح شدید بیماری کے مراحل میں درجہ بندی کیا جاتا ہے۔"
  tr: "İbn Sina, akut hastalıklarda gıdanın azaltılması ve saklanmasının en maliyetli olduğunu, kronik hastalıklarda ise daha az maliyetli olduğunu, çünkü gücün daha dikkatli olduğunu, çünkü krizinin uzak olduğunu belirtir. Daha sonra akut hastalığın evrelerinde beslenmenin nasıl ilerlediğini açıklar {cite:canon-ibn-sina-print-v1 s.267-268}."
  id: "Ibn Sina menyatakan bahwa mengurangi dan menahan makanan adalah yang paling mahal pada penyakit akut, dan kurang mahal pada penyakit kronis karena kekuatannya lebih berhati-hati, karena krisisnya masih jauh. Ia kemudian menjelaskan bagaimana nutrisi berkembang pada tahap penyakit akut {cite:canon-ibn-sina-print-v1 hlm.267-268}."
