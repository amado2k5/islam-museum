summary:
  ar: "يقرر ابن سينا أن تقليل الغذاء ومنعه أكثر ما يتكلف في الأمراض الحادة، وأنه في المزمنة أقل لأن العناية بالقوة فيها أكثر، إذ بحرانها بعيد، ثم يبين كيف تتدرج التغذية في مراحل المرض الحاد {cite:canon-ibn-sina-print-v1 pp.267-268}."
  en: "Ibn Sina states that reducing and withholding food is most often undertaken in acute diseases and less so in chronic ones, where more care is given to the strength because the crisis is far off, and then shows how feeding is graded through the stages of an acute disease {cite:canon-ibn-sina-print-v1 pp.267-268}."
