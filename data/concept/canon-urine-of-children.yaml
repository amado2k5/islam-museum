label: { ar: "بول الصبيان عند ابن سينا", en: "The urine of children in the Canon", ur: "بچوں کا پیشاب قانون میں", es: "La orina de los niños en el Canon", fr: "L'urine des enfants dans le Canon", tr: "İbn Sina'ya göre erkek çocukların idrarı", id: "Urine anak laki-laki menurut Ibn Sina" }
summary:
  ar: "يرى ابن سينا أن أبوال الصبيان قليلة الدلائل، وخصوصاً أبوال الأطفال، لأسباب يعللها {cite:canon-ibn-sina-print-v1 p.184}."
  en: "Ibn Sina holds that the urine of children gives few signs, above all that of infants, and gives his reasons {cite:canon-ibn-sina-print-v1 p.184}."
  es: "Ibn Sina sostiene que la orina de los niños da pocos indicios, sobre todo la de los bebés, y da sus razones {cite:canon-ibn-sina-print-v1 p.184}."
  fr: "Ibn Sina soutient que l'urine des enfants donne peu de signes, surtout celle des nourrissons, et donne ses raisons {cite:canon-ibn-sina-print-v1 p.184}."
  ur: "ابن سینا کا خیال ہے کہ بچوں کا پیشاب نوزائیدہ بچوں کے پیشاب سے بڑھ کر چند نشانیاں دیتا ہے اور اس کی وجوہات بتاتا ہے {حوالہ: کینون ابن سینا پرنٹ v1 صفحہ 184}۔"
  tr: "İbn Sina, özellikle çocukların idrarının az olduğuna inanır; bunun nedenlerini {cite:canon-ibn-sina-print-v1 s.184} açıklar."
  id: "Ibn Sina percaya bahwa urin anak laki-laki sangat langka, terutama urine anak-anak, karena alasan yang ia jelaskan {cite:canon-ibn-sina-print-v1 hlm.184}."
