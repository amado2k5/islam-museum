label:
  ar: "إدارة الوقت"
  en: "Time management"
  ur: "وقت کا انتظام"
  es: "Gestión del tiempo"
  fr: "Gestion du temps"
summary:
  ar: "إدارة الوقت كما يدرّسها طارق السويدان: أربعة أجيال — قائمة الأعمال غير المتكررة بأعمدة، ثم الجدول الزمني الأسبوعي بالفترات لا بالساعات، ثم ترتيب الأولويات بدوائر ثلاث إلى خمس، ثم ترتيب الحياة كله؛ وقاعدته أن توزيع أعمال الاختيار يوماً بيوم لأن المتوسط يحقق نصف ما يخططه."
  en: "Time management as Tareq al-Suwaidan teaches it: four generations — the to-do list of non-repeated tasks in columns, then the weekly schedule by periods not hours, then priority-ranking with three to five circles, then the ordering of all of life; his rule that discretionary tasks are distributed one day ahead only, since the average person accomplishes half of what he plans."
  ur: "وقت کا انتظام جیسا کہ طارق السویدان سکھاتے ہیں: چار نسلیں — غیر معمولی کاموں کی فہرست خانوں میں، پھر ہفتہ وار جدول اوقات میں نہ کہ گھنٹوں میں، پھر تین تا پانچ دائروں سے ترجیحوں کی ترتیب، پھر پوری زندگی کی ترتیب؛ ان کا اصول ہے کہ اختیاری کام صرف ایک دن آگے بانٹے جائیں کیونکہ عام انسان اپنے منصوبے کا آدھا ہی پورا کرتا ہے۔"
  es: "La gestión del tiempo según la enseña Tareq al-Suwaidan: cuatro generaciones: la lista de tareas pendientes con tareas no repetitivas en columnas, luego el horario semanal por períodos, no por horas, luego la priorización con tres a cinco círculos, y finalmente la organización de toda la vida; su regla de que las tareas discrecionales se distribuyen con solo un día de anticipación, ya que la persona promedio logra la mitad de lo que planea."
  fr: "La gestion du temps selon Tareq al-Suwaidan: quatre générations — la liste des tâches non répétitives en colonnes, puis l'emploi du temps hebdomadaire par périodes et non par heures, puis le classement par priorité avec trois à cinq cercles, puis l'organisation de toute la vie; sa règle selon laquelle les tâches discrétionnaires ne sont réparties qu'un jour à l'avance, car la personne moyenne accomplit la moitié de ce qu'elle prévoit."
