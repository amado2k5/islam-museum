label:
  ar: "إدارة الوقت"
  en: "Time management"
  ur: "وقت کا انتظام"
summary:
  ar: "إدارة الوقت كما يدرّسها طارق السويدان: أربعة أجيال — قائمة الأعمال غير المتكررة بأعمدة، ثم الجدول الزمني الأسبوعي بالفترات لا بالساعات، ثم ترتيب الأولويات بدوائر ثلاث إلى خمس، ثم ترتيب الحياة كله؛ وقاعدته أن توزيع أعمال الاختيار يوماً بيوم لأن المتوسط يحقق نصف ما يخططه."
  en: "Time management as Tareq al-Suwaidan teaches it: four generations — the to-do list of non-repeated tasks in columns, then the weekly schedule by periods not hours, then priority-ranking with three to five circles, then the ordering of all of life; his rule that discretionary tasks are distributed one day ahead only, since the average person accomplishes half of what he plans."
  ur: "وقت کا انتظام جیسا کہ طارق السویدان سکھاتے ہیں: چار نسلیں — غیر معمولی کاموں کی فہرست خانوں میں، پھر ہفتہ وار جدول اوقات میں نہ کہ گھنٹوں میں، پھر تین تا پانچ دائروں سے ترجیحوں کی ترتیب، پھر پوری زندگی کی ترتیب؛ ان کا اصول ہے کہ اختیاری کام صرف ایک دن آگے بانٹے جائیں کیونکہ عام انسان اپنے منصوبے کا آدھا ہی پورا کرتا ہے۔"
