label: { ar: "الأقط", en: "Aqt (dried curd, a food)" }
summary:
  ar: "الأقط شيء يُتخذ من اللبن المخيض يُطبخ ثم يُترك حتى يمصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219} ويجوز إخراجه في زكاة الفطر عند جمهور الفقهاء لأنه من الأقوات، ولا يجزئ عند الحنفية إلا بالقيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219} ويعد من الربويات، فيجوز بيعه ببعضه عند المالكية والحنابلة، ويمنعه الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219}"
  en: "Aqt is a food made from churned milk, cooked and left until its water separates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219} Most jurists allow paying it as the zakat al-fitr, since it is a staple; the Hanafis allow it only by value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219} It is a ribawi item: the Malikis and Hanbalis allow exchanging it for its like, and the Shafi'is forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3219}"
