id: concept/action-by-contact-and-action-by-ingestion
class: concept
kind: scientific
label: { ar: "ما يفعل بالملاقاة وما يفعل بالتناول عند ابن سينا", en: "What acts by contact and what acts by ingestion in the Canon", fr: "Ce qui agit par contact et ce qui agit par ingestion dans le Canon", ur: "قانون میں ملاقات سے اور کھانے سے عمل کرنے والی چیزیں", es: "En el Canon, ¿qué actúa por contacto y qué actúa por ingestión?" }
summary:
  ar: "يذكر ابن سينا أن من الأشياء ما يغير بالملاقاة ولا يغير بالتناول مثل البصل، فإنه إذا ضمد به من خارج قرح ولا يقرح من داخل. ومنها ما هو بالعكس مثل الإسفيداج، فإنه إن شرب غير تغييراً عظيماً وإن طلي لم يفعل شيئاً، ومنها ما يفعل من الوجهين {cite:canon-ibn-sina-print-v1 pp.139-140}."
  en: "Ibn Sina says some things alter by contact and not by ingestion, such as the onion, which when applied outside as a poultice blisters but does not blister from within. Others are the opposite, such as ceruse, which if drunk alters greatly yet if smeared does nothing. Some act both ways {cite:canon-ibn-sina-print-v1 pp.139-140}."
  fr: "Ibn Sina dit que certaines choses provoquent une altération par contact et non par ingestion, comme l'oignon, qui, appliqué à l'extérieur en cataplasme, provoque des cloques, mais n'en provoque pas de l'intérieur. Pour d'autres, c'est l'inverse, comme la céruse, qui, bue, provoque une forte altération, mais ne fait rien si on l'étale sur le corps. Certaines agissent des deux façons {cite:canon-ibn-sina-print-v1 pp.139-140}."
  es: "Ibn Sina afirma que algunas sustancias se alteran por contacto y no por ingestión, como la cebolla, que al aplicarse externamente en forma de cataplasma produce ampollas, pero no internas. Otras son opuestas, como la cerusa, que al beberse se altera considerablemente, pero al untarse no produce ningún efecto. Algunas sustancias actúan de ambas maneras {cite:canon-ibn-sina-print-v1 pp.139-140}."
