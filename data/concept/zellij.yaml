label: { ar: "الزليج", en: "Zellij (Maghrebi tile mosaic)", ur: "زلیج ⁦(مغربی ٹائل موزیک)⁩", es: "Zellij (mosaico de azulejos magrebíes)", fr: "Zellij (mosaïque de carreaux maghrébins)", tr: "Zellige", id: "Zellige" }
summary:
  ar: "فسيفساء خزفية من قطع الفخار المزجج تُقص وتُرصف في أنماط هندسية لكسوة الأرضيات والجدران في المغرب الأقصى، ازدهرت صناعتها في فاس منذ القرن الرابع عشر {cite:newcomb-decorative-tiles-north-africa-1929 p.21} {cite:newcomb-decorative-tiles-north-africa-1929 p.22}."
  en: "Ceramic mosaic of glazed terracotta pieces cut and laid in geometric patterns to pave and wainscot floors and walls in Morocco, an industry that flourished at Fez from the fourteenth century {cite:newcomb-decorative-tiles-north-africa-1929 p.21} {cite:newcomb-decorative-tiles-north-africa-1929 p.22}."
  es: "Mosaico cerámico de piezas de terracota vidriada cortadas y colocadas en patrones geométricos para pavimentar y revestir suelos y paredes en Marruecos, una industria que floreció en Fez desde el siglo XIV {cite:newcomb-decorative-tiles-north-africa-1929 p.21} {cite:newcomb-decorative-tiles-north-africa-1929 p.22}."
  fr: "Mosaïque en céramique de pièces de terre cuite émaillée coupées et posées selon des motifs géométriques pour paver et lambrisser les sols et les murs au Maroc, une industrie qui a prospéré à Fès à partir du XIVe siècle {cite:newcomb-decorative-tiles-north-africa-1929 p.21} {cite:newcomb-decorative-tiles-north-africa-1929 p.22}."
  ur: "چمکدار ٹیراکوٹا کے ٹکڑوں کا سرامک موزیک مراکش میں فرشوں اور دیواروں کو ہموار کرنے اور ہموار کرنے کے لیے ہندسی نمونوں میں کاٹا اور بچھایا گیا، یہ ایک صنعت ہے جو چودھویں صدی سے فیز میں پروان چڑھی تھی۔ {حوالہ: نیوکومب-ڈیکوریٹو-ٹائلز-شمالی-افریقہ-1929 p.22}۔"
  tr: "Fas'ta zemin ve duvar kaplaması için geometrik desenler halinde kesilip düzenlenmiş sırlı seramik parçalarından yapılan seramik mozaikler. Üretimi 14. yüzyıldan beri Fez'de gelişmiştir. {cite:newcomb-decorative-tiles-north-africa-1929 s.21} {cite:newcomb-decorative-tiles-north-africa-1929 s.22}."
  id: "Mosaik keramik yang terbuat dari potongan tembikar berglasir yang dipotong dan disusun dalam pola geometris untuk pelapis lantai dan dinding di Maroko. Pembuatan mosaik ini berkembang pesat di Fez sejak abad keempat belas. {cite:newcomb-decorative-tiles-north-africa-1929 p.21} {cite:newcomb-decorative-tiles-north-africa-1929 p.22}."
