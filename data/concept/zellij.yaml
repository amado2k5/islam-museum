  fr: "Mosaïque en céramique de pièces de terre cuite émaillée coupées et posées selon des motifs géométriques pour paver et lambrisser les sols et les murs au Maroc, une industrie qui a prospéré à Fès à partir du XIVe siècle {cite:newcomb-decorative-tiles-north-africa-1929 p.21} {cite:newcomb-decorative-tiles-north-africa-1929 p.22}."
