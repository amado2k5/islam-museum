label: { ar: "تدبير من يكثر الشراب وإصلاح أذاه عند ابن سينا", en: "Capacity for wine and the correctives of its harms in the Canon", ur: "شراب کی گنجائش اور اس کے ضرر کی اصلاح قانون میں", es: "Capacidad para el vino y los correctivos de sus daños en el Canon", fr: "La capacité à consommer du vin et les remèdes à ses méfaits dans le Canon", tr: "İbn Sina'ya göre aşırı içkiyi yönetmek ve zararını onarmak", id: "Mengelola Kebiasaan Minum Berlebihan dan Memperbaiki Lukanya menurut Ibn Sina" }
summary:
  ar: "يذكر ابن سينا أن من في صدره وهن يضيق نفسه في الشتاء لا يقدر على الكثير من الشراب، وأن من أراد أن يستكثر منه لا يمتلئ من الطعام، وأن من امتلأ منهما يقذف ثم يغسل فمه بخل وعسل، ثم يعدد ما يصلح أذى الشراب في الكبد والرأس والمعدة {cite:canon-ibn-sina-print-v1 pp.237-238}."
  en: "Ibn Sina says one with a weak chest who is short of breath in winter cannot take much wine, that one who wishes to take more should not fill himself with food, and that one filled with both vomits and rinses his mouth with vinegar and honey; he then lists what mends the harm of wine to the liver, the head and the stomach {cite:canon-ibn-sina-print-v1 pp.237-238}."
  es: "Ibn Sina dice que quien tiene el pecho débil y le falta el aire en invierno no puede tomar mucho vino, que quien desea tomar más no debe llenarse de comida, y que quien está lleno de ambas cosas vomita y se enjuaga la boca con vinagre y miel; luego enumera lo que remedia el daño que el vino causa al hígado, la cabeza y el estómago {cite:canon-ibn-sina-print-v1 pp.237-238}."
  fr: "Ibn Sina dit que celui qui a la poitrine fragile et qui a le souffle court en hiver ne peut pas boire beaucoup de vin, que celui qui souhaite en boire davantage ne doit pas se remplir de nourriture, et que celui qui a bu les deux vomit et se rince la bouche avec du vinaigre et du miel; il énumère ensuite ce qui répare les méfaits du vin sur le foie, la tête et l'estomac {cite:canon-ibn-sina-print-v1 pp.237-238}."
  ur: "ابن سینا کہتے ہیں کہ کمزور سینے والا جس کو سردیوں میں سانس کی تکلیف ہو وہ زیادہ شراب نہیں پی سکتا، جو زیادہ پینا چاہے وہ اپنے آپ کو کھانے سے نہ بھرے، اور جو دونوں قے کرے اور سرکہ اور شہد سے منہ دھوئے۔ اس کے بعد وہ ان چیزوں کی فہرست بناتا ہے جو جگر، سر اور معدہ کے لیے شراب کے نقصانات کو ٹھیک کرتی ہیں۔"
  tr: "İbn Sina, zayıf göğüslü ve nefesleri sıkışan kışın çok fazla içemeyeceğini, daha fazla yemek isteyenlerin ise ağızlarını yiyecekle doldurmadığını belirtir. Bunlarla dolu olanlar boşalmalı, sonra ağızlarını sirke ve bal ile yıkamalı, ardından içeceğin karaciğere, başa ve mideye zarar verdiğini saymalıdır {cite:canon-ibn-sina-print-v1 s.237-238}."
  id: "Ibn Sina menyebutkan bahwa mereka yang dada lemah dan napasnya sesak di musim dingin tidak bisa minum banyak, dan mereka yang ingin mengonsumsi lebih banyak tidak mengisi mulut dengan makanan. Mereka yang penuh dengan makanan ini harus ejakulasi, lalu mencuci mulut dengan cuka dan madu, kemudian menghitung apa yang merusak minuman itu pada hati, kepala, dan perut {cite:canon-ibn-sina-print-v1 hlm.237-238}."
