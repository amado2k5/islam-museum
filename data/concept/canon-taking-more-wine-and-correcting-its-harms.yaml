label: { ar: "تدبير من يكثر الشراب وإصلاح أذاه عند ابن سينا", en: "Capacity for wine and the correctives of its harms in the Canon", ur: "شراب کی گنجائش اور اس کے ضرر کی اصلاح قانون میں" }
summary:
  ar: "يذكر ابن سينا أن من في صدره وهن يضيق نفسه في الشتاء لا يقدر على الكثير من الشراب، وأن من أراد أن يستكثر منه لا يمتلئ من الطعام، وأن من امتلأ منهما يقذف ثم يغسل فمه بخل وعسل، ثم يعدد ما يصلح أذى الشراب في الكبد والرأس والمعدة {cite:canon-ibn-sina-print-v1 pp.237-238}."
  en: "Ibn Sina says one with a weak chest who is short of breath in winter cannot take much wine, that one who wishes to take more should not fill himself with food, and that one filled with both vomits and rinses his mouth with vinegar and honey; he then lists what mends the harm of wine to the liver, the head and the stomach {cite:canon-ibn-sina-print-v1 pp.237-238}."
