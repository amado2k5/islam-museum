label: { ar: "وسط الشمس من جدول السنين الرومية", en: "The Sun's mean place from the table of Roman years", ur: "رومی سالوں کے جدول سے سورج کا اوسط مقام" }
summary:
  ar: "يبيّن البتاني طريقة معرفة وسط الشمس من بروج الفلك بتاريخ الروم: تُعد السنين التامة من ذي القرنين، وتُطلب في الجدول المجموع بعشرين عشرين، ثم تُضاف إليها الشهور والأيام، فيخرج موضع الشمس في البروج من أول الحمل. {cite:zij-sabi-nallino-byblion p.106}."
  en: "Al-Battani explains how to find the Sun's mean place on the zodiac from a Roman date: the completed years are counted from the Dhu al-Qarnayn era and looked up in the table of Roman years arranged in steps of twenty; the months and days are then added, and the Sun's place from the first point of Aries comes out. {cite:zij-sabi-nallino-byblion p.106}."
  ur: "البتانی بتاتے ہیں کہ رومی تاریخ سے بروج میں سورج کا اوسط مقام کیسے نکالا جائے: مکمل سال ذو القرنین سے گنے جاتے ہیں اور بیس بیس کے حساب سے رومی سالوں کے جدول میں دیکھے جاتے ہیں، پھر مہینے اور دن جمع کیے جاتے ہیں، تو حمل کے پہلے نقطے سے سورج کا مقام نکلتا ہے۔ {cite:zij-sabi-nallino-byblion p.106}۔"
