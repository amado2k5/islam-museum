label:
  ar: "فساد العضو وقطعه عند ابن سينا"
  en: "A corrupted organ and cutting it away in the Canon"
  fr: "Organe corrompu et ablation dans le Canon"
  ur: "قانون میں عضو کا بگاڑ اور اسے کاٹنا"
  es: "Un órgano corrupto y su eliminación en el Canon"
summary:
  ar: "يعالج ابن سينا في الفصل السابع والعشرين العضو الفاسد بأخذ اللحم الفاسد ثم القطع والكي، ويصف كيف يعرف حد السلامة في العظم وكيف يقطع، ويقرر متى يهرب الطبيب {cite:canon-ibn-sina-print-v1 p.306}."
  en: "In chapter 27 Ibn Sina treats a corrupted organ by removing the corrupt flesh and then cutting and cauterising, describes how the limit of safety is found in the bone and how it is cut, and says when the physician should flee {cite:canon-ibn-sina-print-v1 p.306}."
  fr: "Au chapitre 27, Ibn Sina traite l’organe corrompu par retrait des chairs atteintes, puis section et cautérisation ; il décrit la recherche de la limite saine dans l’os, sa section et les circonstances où le médecin devrait fuir {cite:canon-ibn-sina-print-v1 p.306}."
  es: "En el capítulo 27, Ibn Sina trata un órgano corrupto quitando la carne corrupta y luego cortando y cauterizando, describe cómo se encuentra el límite de seguridad en el hueso y cómo se corta, y dice cuándo el médico debe huir {cite:canon-ibn-sina-print-v1 p.306}."
