label: { ar: "أم الفروخ", en: "Umm al-furukh (a named inheritance case)" }
summary:
  ar: "أم الفروخ لقب لمسألة في الميراث فيها زوج وأم وأختان شقيقتان أو لأب، واثنان فأكثر من أولاد الأم، وسميت لكثرة السهام العائلة فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403} وتسمى البلجاء والشريحية، ويقال إنها لقب لكل مسألة تعول إلى عشرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} وأصلها ستة ثم تعول إلى عشرة على قول الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  en: "Umm al-furukh is a named case in inheritance with a husband, a mother, two full or paternal sisters, and two or more uterine siblings; it is named for the many shares that rise in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403} It is also called al-balja' and al-shuraihiyya; some say the name fits any case that rises to ten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} Its base is six, rising to ten by the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
