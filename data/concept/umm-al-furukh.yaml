label: { ar: "أم الفروخ", en: "Umm al-furukh (a named inheritance case)", es: "Umm al-furukh (un caso de herencia con nombre)", fr: "Umm al-furukh (un cas d'héritage nommé)", ur: "ام الفروخ ⁦(ایک نامزد وراثت کا مقدمہ)⁩" }
summary:
  ar: "أم الفروخ لقب لمسألة في الميراث فيها زوج وأم وأختان شقيقتان أو لأب، واثنان فأكثر من أولاد الأم، وسميت لكثرة السهام العائلة فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403} وتسمى البلجاء والشريحية، ويقال إنها لقب لكل مسألة تعول إلى عشرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} وأصلها ستة ثم تعول إلى عشرة على قول الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  en: "Umm al-furukh is a named case in inheritance with a husband, a mother, two full or paternal sisters, and two or more uterine siblings; it is named for the many shares that rise in it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403} It is also called al-balja' and al-shuraihiyya; some say the name fits any case that rises to ten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} Its base is six, rising to ten by the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  es: "Umm al-furukh es un caso particular en la herencia que involucra a un esposo, una madre, dos hermanas paternas o de padre y dos o más hermanos uterinos; recibe su nombre por las numerosas participaciones que conlleva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403} También se le conoce como al-balja' y al-shuraihiyya; algunos afirman que el nombre se aplica a cualquier caso que llegue a diez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} Su base es seis, llegando a diez según la opinión mayoritaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  fr: "Umm al-furukh est un cas particulier d'héritage comprenant un époux, une mère, deux sœurs germaines ou paternelles et au moins deux frères et sœurs utérins; il est ainsi nommé en raison du nombre important de parts qu'il comporte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403} Il est également appelé al-balja' et al-shuraihiyya; certains estiment que ce nom s'applique à tout cas dont le nombre de parts atteint dix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} Sa base est de six parts, et le nombre de parts atteint dix selon l'avis majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  ur: "ام الفروخ وراثت میں ایک شوہر، ایک ماں، دو بھری یا پھوپھی بہنوں، اور دو یا دو سے زیادہ رحم کے بہن بھائیوں کے ساتھ ایک نامزد مقدمہ ہے۔ اس کا نام اس میں بڑھنے والے بہت سے حصص کے لئے رکھا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3402}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3403} اسے البلجہ اور الشوریہ بھی کہا جاتا ہے۔ کچھ کہتے ہیں کہ نام کسی بھی معاملے میں فٹ بیٹھتا ہے جو دس تک بڑھ جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3402} اس کی بنیاد چھ ہے جو کہ اکثریت کی نظر سے دس تک پہنچ جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3403}"
