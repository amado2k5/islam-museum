summary:
  ar: "البلشون ومالك الحزين عند الدميري من طير الماء الواقف على قدم واحدة كأنه المعتكف، وقالوا في مثل صبره أصبر من بلشون، وهي من الطير التي عبر بها العرب عن السهر والانتظار."
  en: "The heron — 'the melancholy king' — in al-Damiri: a water bird standing on one leg like one in retreat; the Arabs proverb its patience — 'more patient than a heron' — and made it their image of vigil and waiting."
  ur: "دمیری میں بگلا 'غم کا بادشاہ': آبی پرندہ جو ایک ٹانگ پر اسی کھڑا رہتا ہے جیسے اعتکاف میں ہو؛ عرب نے اس کے صبر کی مثال دی — 'بگلے سے زیادہ صبور' — اور اسے بیداری اور انتظار کی صورت بنایا۔"
