summary:
  ar: "البلشون ومالك الحزين عند الدميري من طير الماء الواقف على قدم واحدة كأنه المعتكف، وقالوا في مثل صبره أصبر من بلشون، وهي من الطير التي عبر بها العرب عن السهر والانتظار."
  en: "The heron — 'the melancholy king' — in al-Damiri: a water bird standing on one leg like one in retreat; the Arabs proverb its patience — 'more patient than a heron' — and made it their image of vigil and waiting."
  ur: "دمیری میں بگلا 'غم کا بادشاہ': آبی پرندہ جو ایک ٹانگ پر اسی کھڑا رہتا ہے جیسے اعتکاف میں ہو؛ عرب نے اس کے صبر کی مثال دی — 'بگلے سے زیادہ صبور' — اور اسے بیداری اور انتظار کی صورت بنایا۔"
  es: "La garza —'el rey melancólico'— en al-Damiri: un ave acuática que se mantiene erguida sobre una pata como si estuviera en retirada; los árabes refranean su paciencia —'más paciente que una garza'— y la convirtieron en su imagen de vigilia y espera."
  fr: "Le héron — « le roi mélancolique » chez al-Damiri: un oiseau aquatique se tenant sur une patte comme en retraite; les Arabes proverbialisent sa patience — « plus patient qu'un héron » — et en ont fait leur image de la veille et de l'attente."
  tr: "Al-Damiri'ye göre balıkçıl ve balıkçıl, sanki inzivadaymış gibi tek ayak üzerinde duran su kuşlarıdır. Sabrı hakkında, Arapların uyanık kalıp beklemeyi ifade ettiği bir kartal kuşundan daha sabırlı olduğunu söylerlerdi."
  id: "Burung bangau dan bangau menurut Al-Damiri adalah burung air yang berdiri dengan satu kaki seolah-olah sedang menyendiri. Mereka mengatakan tentang kesabarannya bahwa burung ini lebih sabar daripada elang, yang merupakan salah satu burung yang biasa diungkapkan orang Arab dengan tetap terjaga dan menunggu."
