summary:
  ar: "السكبينج في الكتاب صمغ نبات شبيه بالقثاء ينبت في أرض ذات ماء، أجوده الصافي الأكثف الأحمر ظاهراً الأبيض باطناً، رائحته بين الحلتيت والقنة، حار في الثالثة يابس في الثانية، محلل ملطف، ينفع من الفالج وأوجاع المفاصل الباردة والصداع البارد وظلمة العين والاستسقاء والقولنج والحميات الدائرة ولسع الهوام، وفي الكتاب نقل موسوم في الرحم والطمث والجنين {cite:canon-ibn-sina-print-v1 p.595}."
  en: "Sakbinaj is in the book the gum of a plant like the cucumber in shape, growing in a watered land; the best is the clear and denser kind, red outside and white within, its scent between asafoetida and qanna, hot in the third degree and dry in the second, dissolving and thinning; the book lists it for palsy, cold joint pains, cold headache, darkness of the eye, dropsy, colic, periodic fevers and the stings of vermin, with a labelled listing on the womb, menses and foetus {cite:canon-ibn-sina-print-v1 p.595}."
  ur: "سکبینج کتاب میں ایک پودے کا گوند ہے جو شکل میں ککڑی جیسا ہے اور پانی والی زمین میں اگتا ہے؛ بہترین صاف اور گاڑھا، باہر سے سرخ اور اندر سے سفید، اس کی بو حلتیت اور قنہ کے بیچ کی ہے، تیسرے درجے میں گرم اور دوسرے میں خشک، گھلانے اور لطیف کرنے والا؛ کتاب اسے فالج، ٹھنڈے جوڑوں کے درد، ٹھنڈے سر درد، آنکھ کی تاریکی، استسقا، قولنج، دائر بخاروں اور زہریلے کیڑوں کے ڈنک کے لیے گنواتی ہے، اور رحم، حیض اور جنین کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.595}۔"
  es: "En el libro, Sakbinaj es la goma de una planta con forma de pepino que crece en tierra regada; la mejor es la clara y densa, roja por fuera y blanca por dentro, con un aroma entre asafétida y qanna, caliente en tercer grado y seco en segundo, que se disuelve y se vuelve más fina; el libro la enumera para la parálisis, dolores articulares por frío, dolor de cabeza por frío, ojeras, hidropesía, cólicos, fiebres periódicas y picaduras de parásitos, con una lista etiquetada para el útero, la menstruación y el feto {cite:canon-ibn-sina-print-v1 p.595}."
  fr: "Le sakbinaj est décrit dans le livre comme la gomme d'une plante ressemblant à un concombre, poussant en terre irriguée; la meilleure est la variété claire et dense, rouge à l'extérieur et blanche à l'intérieur, son parfum entre l'asafoetida et le qanna, chaude au troisième degré et sèche au deuxième, se dissolvant et s'éclaircissant; le livre le mentionne pour la paralysie, les douleurs articulaires dues au froid, les maux de tête dus au froid, les occlusions oculaires, l'hydropisie, les coliques, les fièvres périodiques et les piqûres de vermine, avec une liste légendée sur l'utérus, les menstruations et le fœtus {cite:canon-ibn-sina-print-v1 p.595}."
  tr: "Kitaptaki skeping, su dolu bir toprakta yetişen bir bitki reçinesidir. Kalitesi berrak, yoğun, dışarıdan kırmızı, içi beyazdır, kokusu haltait ile qanah arasında, üçüncüde sıcak, ikincisinde kurudur; yatıştırıcı bir etkendir; felç, soğuk eklem ağrıları, soğuk baş ağrıları, koyu gözler, asit, kolik, tekrar dolaşımlı ateşler ve kertenkelelerin sokması için faydalıdır. Kitapta ayrıca 'Rahimde, Adet ve Fetus' başlıklı bir alıntı da yer alır {cite:canon-ibn-sina-print-v1 s.595}."
  id: "Skeping dalam buku ini adalah resin tanaman yang menyerupai tuck yang tumbuh di tanah dengan air. Kualitasnya jernih, padat, merah di luar, putih di dalam, aromanya antara haltait dan qanah, panas di yang ketiga dan kering di bagian kedua, sebagai agen penenang, bermanfaat untuk kelumpuhan, nyeri sendi dingin, sakit kepala dingin, mata gelap, ascites, kolik, demam sirkulasi, dan sengatan kadal. Buku ini juga memuat kutipan berjudul 'In the Womb, Menstruation, and Fetus' {cite:canon-ibn-sina-print-v1 hlm.595}."
