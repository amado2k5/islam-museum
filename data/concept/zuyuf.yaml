label: { ar: "الزيوف وقطع الدراهم", en: "Zuyuf and the Cutting of Dirhams", es: "Zuyuf y el recorte de dirhams", fr: "Zuyuf et la découpe des dirhams", ur: "ضیوف اور درہم کی کٹائی", tr: "Sahte paralar ve madeni paralar", id: "Uang palsu dan koin" }
summary:
  ar: "كانت زيوف ضربها الأعاجم فغشوا فيها وكان ابن مسعود يأمر بكسرها وكانت له بقية في بيت المال فباعها بنقصان فنهاه عمر عن ذلك فكان يدينها بعد ذلك وكان عمر وعثمان إذا وجدا الزيوف في بيت المال جملاها فضة وأتي عمر بن عبد العزيز برجل يضرب على غير سكة السلطان فعاقبه وسجنه وأخذ حديده فطرحه في النار وأخذ عبد الملك رجلاً يضرب على غير سكة المسلمين فأراد قطع يده ثم ترك ذلك وعاقبه وحسن أهل المدينة فعله وكان مروان بن الحكم قد قطع يد رجل أخذه بقطع الدراهم فقال زيد بن ثابت لقد عاقبه وعاقب أبان بن عثمان وهو على المدينة من يقطع الدراهم بضرب ثلاثين وطاف به وذلك فيمن قطعها ودس فيها المفرغة والزيوف واختلف الفقهاء في قطع الدراهم إذا كانت على الوفاء فكرهه مالك وابن أبي ذئب وأصحابهما ونهوا عنه لأنه من الفساد وقال الثوري وأبو حنيفة لا بأس به إذا لم يضر ذلك بالإسلام وأهله وقرأ ابن كعب قول شعيب عن قومه في التصرف في أموالهم ما يشاءون ⁦(سورة هود)⁩ على أنه قطع الدراهم."
  en: "The zuyuf were Ajam-struck dirhams, adulterated — Ibn Mas'ud ordered them broken and sold his own baqiyya at a discount till Umar forbade it and he lent it out; Umar and Uthman melted whatever zuyuf the bayt al-mal held into silver. Umar II jailed a man striking off the sultan's die and threw his iron in the fire; Abd al-Malik took another and meant to cut his hand before punishing otherwise — Medina's elders approved. Marwan ibn al-Hakam had cut a dirham-cutter's hand — Zayd ibn Thabit: 'he punished him' — and Aban ibn Uthman at Medina lashed the cutter thirty and paraded him, that for one who hollowed dirhams and salted them with counterfeits. On cutting full-weight dirhams the jurists split: Malik and Ibn Abi Dhi'b disliked and forbade it as corruption; al-Thawri and Abu Hanifa saw no harm where it did not injure Islam and its people — and Ibn Ka'b read Shu'ayb's people's claim to do as they would in their wealth (Hud) as the cutting of dirhams."
  es: "Los zuyuf eran dirhams acuñados por Ajam, adulterados; Ibn Mas'ud ordenó que se rompieran y vendió su propia baqiyya con descuento hasta que Umar lo prohibió y la prestó; Umar y Uthman fundieron en plata todos los zuyuf que tenía el bayt al-mal. Umar II encarceló a un hombre que golpeaba el dado del sultán y arrojó su hierro al fuego; Abd al-Malik tomó a otro y pretendía cortarle la mano antes de castigarlo de otra manera; los ancianos de Medina lo aprobaron. Marwan ibn al-Hakam le había cortado la mano a un cortador de dirhams —Zayd ibn Thabit: 'lo castigó'— y Aban ibn Uthman en Medina azotó al cortador treinta y lo exhibió, eso por ahuecar dirhams y salarlos con falsificaciones. Sobre la división de dirhams de peso completo, los juristas se dividieron: Malik e Ibn Abi Dhi'b lo desaprobaron y lo prohibieron por considerarlo corrupción; al-Thawri y Abu Hanifa no vieron ningún problema donde no perjudicara al Islam y a su gente, e Ibn Ka'b interpretó la pretensión de la gente de Shu'ayb de hacer lo que quisieran con su riqueza (Hud) como la división de dirhams."
  fr: "Les zuyuf étaient des dirhams frappés à la manière d'Ajam, falsifiés. Ibn Mas'ud ordonna qu'ils soient brisés et vendit sa propre baqiyya à prix réduit jusqu'à ce qu'Umar l'interdise et qu'il la prête. Umar et Uthman fondirent en argent tous les zuyuf que le bayt al-mal détenait. Umar II emprisonna un homme qui avait frappé le coin du sultan et jeta son fer au feu. Abd al-Malik en arrêta un autre et avait l'intention de lui couper la main avant de le punir autrement; les anciens de Médine approuvèrent. Marwan ibn al-Hakam avait coupé la main d'un tailleur de dirhams – Zayd ibn Thabit: « il le punit » – et Aban ibn Uthman, à Médine, fouetta le tailleur trente fois et le fit défiler, pour avoir évidé des dirhams et les avoir falsifiés. Sur la question de la découpe de dirhams de poids normal, les juristes se divisèrent: Malik et Ibn Abi Dhi'b désapprouvaient et l'interdisaient, la considérant comme une corruption. al-Thawri et Abu Hanifa ne voyaient aucun mal là où cela ne nuisait pas à l'Islam et à son peuple — et Ibn Ka'b a interprété la revendication du peuple de Shu'ayb de faire ce qu'ils voulaient de leurs richesses (Hud) comme la réduction des dirhams."
  ur: "ضیوف عجم کے درہم تھے، ملاوٹ شدہ - ابن مسعود نے ان کو توڑنے کا حکم دیا اور اپنا بقیہ رعایت پر بیچ دیا یہاں تک کہ عمر نے منع کیا اور اس نے اسے قرض دے دیا۔ عمر اور عثمان نے بیت المال میں جو کچھ بھی ذیوف کو چاندی میں رکھا تھا پگھلا دیا۔ عمر ثانی نے سلطان کی موت پر حملہ کرنے والے ایک شخص کو جیل میں ڈال دیا اور اس کا لوہا آگ میں پھینک دیا۔ عبد الملک نے دوسرا لیا اور اس کا مطلب تھا کہ سزا دینے سے پہلے اس کا ہاتھ کاٹ دیا جائے - مدینہ کے بزرگوں نے اس کی منظوری دی۔ مروان بن الحکم نے ایک درہم کاٹنے والے کا ہاتھ کاٹا تھا - زید بن ثابت: 'اس نے اسے سزا دی' - اور ابان بن عثمان نے مدینہ میں کاٹنے والے کو تیس کوڑے مارے اور اس کی تعظیم کی کہ جس نے درہم کو کھوکھلا کیا اور اسے جعلی سے نمکین کیا۔ پورے وزنی درہم کو کاٹنے پر فقہاء میں اختلاف ہے: مالک اور ابن ابی ذہب نے اسے ناپسند کیا اور اسے فساد قرار دیا۔ الثوری اور ابو حنیفہ نے کوئی نقصان نہیں دیکھا جہاں اس سے اسلام اور اس کے لوگوں کو نقصان نہ پہنچے - اور ابن کعب نے شعیب کے لوگوں کے دعوے کو پڑھا جیسا کہ وہ اپنے مال ⁦(ہود)⁩ میں درہم کاٹنا چاہتے ہیں۔"
  tr: "Arap olmayanlar tarafından basılan ve kullanımında hile yapılan sahte paralar vardı. İbn Mes'ud bunların imha edilmesini emrederdi. Hazinede bir kısmı kalmıştı, bu yüzden onları zararına sattı. Ömer bunu yapmasını yasakladı, bu yüzden daha sonra onları ödünç vermeye devam etti. Ömer ve Osman hazinede sahte paralar bulduklarında, onları eritip gümüşe çevirdiler. Ömer ibn Abdülaziz, Sultan'ınkinden başka para basan bir adamı yakaladı, onu cezalandırdı, hapse attı ve demirini alıp ateşe attı. Abdülmalik, Müslümanlarınkinden başka para basan bir adamı yakaladı ve elini kesmek istedi, ancak sonra vazgeçti ve onu cezalandırdı ve Medine halkı onun bu hareketini onayladı. Mervan ibn el-Hakam, para keserken yakaladığı bir adamın elini kesti, bu yüzden Zeyd ibn Sabit, \"Onu cezalandırdı\" dedi. Eban ibn Osman, Medine valisi iken, sikke kesenleri otuz kez kırbaçlatıp şehirde dolaştırarak cezalandırmıştır. Bu, sikke kesip içine sahte ve hileli para koyanlar içindi. Fıkıhçılar, ödeme amacıyla kullanılan sikkelerin kesilmesinin caiz olup olmadığı konusunda farklı görüşler belirtmişlerdir. Malik, İbn Abi Dhi'b ve takipçileri bunu bir tür yolsuzluk olduğu için hoş karşılamamış ve yasaklamışlardır. El-Sevri ve Ebu Hanife ise, İslam'a ve halkına zarar vermediği sürece bunda bir sakınca olmadığını söylemişlerdir. İbn Ka'b, Şuayb'ın halkının mallarını diledikleri gibi kullanmalarıyla ilgili sözlerini (Hud Suresi) sanki kendisi dirhem kesmiş gibi okumuştur."
  id: "Terdapat koin palsu yang dicetak oleh orang-orang non-Arab, yang melakukan kecurangan dalam penggunaannya. Ibnu Mas'ud biasa memerintahkan penghancuran koin-koin tersebut. Ia masih memiliki beberapa koin palsu di perbendaharaan, sehingga ia menjualnya dengan kerugian. Umar melarangnya melakukan hal itu, sehingga ia terus meminjamkannya setelahnya. Ketika Umar dan Utsman menemukan koin palsu di perbendaharaan, mereka meleburkannya menjadi perak. Umar bin Abd al-Aziz didatangi seorang pria yang mencetak koin selain koin Sultan, sehingga ia menghukumnya, memenjarakannya, dan mengambil besinya lalu melemparkannya ke dalam api. Abd al-Malik membawa seorang pria yang mencetak koin selain koin Muslim dan ingin memotong tangannya, tetapi kemudian ia menahan diri dan menghukumnya, dan penduduk Madinah menyetujui tindakannya. Marwan bin al-Hakam telah memotong tangan seorang pria yang ia tangkap sedang memalsukan koin, sehingga Zayd bin Thabit berkata, \"Dia telah menghukumnya.\" Aban bin Utsman, ketika menjabat sebagai gubernur Madinah, menghukum orang-orang yang memotong uang logam dengan mencambuk mereka tiga puluh kali dan mengarak mereka melalui kota. Hukuman ini ditujukan bagi mereka yang memotong uang logam dan memasukkan uang palsu atau yang dicampuri ke dalamnya. Para ahli hukum Islam berbeda pendapat tentang kebolehan memotong uang logam jika digunakan untuk pembayaran. Malik, Ibnu Abi Dhi'b, dan pengikut mereka tidak menyukainya dan melarangnya karena merupakan bentuk korupsi. Al-Thawri dan Abu Hanifa mengatakan tidak ada yang salah dengan hal itu jika tidak membahayakan Islam dan umatnya. Ibnu Ka'b membacakan sabda Syu'aib tentang kaumnya mengenai pembuangan harta mereka sesuai keinginan mereka (Surah (Hud)) seolah-olah dialah yang memotong dirham."
