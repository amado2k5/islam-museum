label: { ar: "الزيوف وقطع الدراهم", en: "Zuyuf and the Cutting of Dirhams" }
summary:
  ar: "كانت زيوف ضربها الأعاجم فغشوا فيها وكان ابن مسعود يأمر بكسرها وكانت له بقية في بيت المال فباعها بنقصان فنهاه عمر عن ذلك فكان يدينها بعد ذلك وكان عمر وعثمان إذا وجدا الزيوف في بيت المال جملاها فضة وأتي عمر بن عبد العزيز برجل يضرب على غير سكة السلطان فعاقبه وسجنه وأخذ حديده فطرحه في النار وأخذ عبد الملك رجلاً يضرب على غير سكة المسلمين فأراد قطع يده ثم ترك ذلك وعاقبه وحسن أهل المدينة فعله وكان مروان بن الحكم قد قطع يد رجل أخذه بقطع الدراهم فقال زيد بن ثابت لقد عاقبه وعاقب أبان بن عثمان وهو على المدينة من يقطع الدراهم بضرب ثلاثين وطاف به وذلك فيمن قطعها ودس فيها المفرغة والزيوف واختلف الفقهاء في قطع الدراهم إذا كانت على الوفاء فكرهه مالك وابن أبي ذئب وأصحابهما ونهوا عنه لأنه من الفساد وقال الثوري وأبو حنيفة لا بأس به إذا لم يضر ذلك بالإسلام وأهله وقرأ ابن كعب قول شعيب عن قومه في التصرف في أموالهم ما يشاءون (سورة هود) على أنه قطع الدراهم."
  en: "The zuyuf were Ajam-struck dirhams, adulterated — Ibn Mas'ud ordered them broken and sold his own baqiyya at a discount till Umar forbade it and he lent it out; Umar and Uthman melted whatever zuyuf the bayt al-mal held into silver. Umar II jailed a man striking off the sultan's die and threw his iron in the fire; Abd al-Malik took another and meant to cut his hand before punishing otherwise — Medina's elders approved. Marwan ibn al-Hakam had cut a dirham-cutter's hand — Zayd ibn Thabit: 'he punished him' — and Aban ibn Uthman at Medina lashed the cutter thirty and paraded him, that for one who hollowed dirhams and salted them with counterfeits. On cutting full-weight dirhams the jurists split: Malik and Ibn Abi Dhi'b disliked and forbade it as corruption; al-Thawri and Abu Hanifa saw no harm where it did not injure Islam and its people — and Ibn Ka'b read Shu'ayb's people's claim to do as they would in their wealth (Hud) as the cutting of dirhams."
