label: { ar: "الزيوف وقطع الدراهم", en: "Zuyuf and the Cutting of Dirhams", es: "Zuyuf y el recorte de dirhams", fr: "Zuyuf et la découpe des dirhams" }
summary:
  ar: "كانت زيوف ضربها الأعاجم فغشوا فيها وكان ابن مسعود يأمر بكسرها وكانت له بقية في بيت المال فباعها بنقصان فنهاه عمر عن ذلك فكان يدينها بعد ذلك وكان عمر وعثمان إذا وجدا الزيوف في بيت المال جملاها فضة وأتي عمر بن عبد العزيز برجل يضرب على غير سكة السلطان فعاقبه وسجنه وأخذ حديده فطرحه في النار وأخذ عبد الملك رجلاً يضرب على غير سكة المسلمين فأراد قطع يده ثم ترك ذلك وعاقبه وحسن أهل المدينة فعله وكان مروان بن الحكم قد قطع يد رجل أخذه بقطع الدراهم فقال زيد بن ثابت لقد عاقبه وعاقب أبان بن عثمان وهو على المدينة من يقطع الدراهم بضرب ثلاثين وطاف به وذلك فيمن قطعها ودس فيها المفرغة والزيوف واختلف الفقهاء في قطع الدراهم إذا كانت على الوفاء فكرهه مالك وابن أبي ذئب وأصحابهما ونهوا عنه لأنه من الفساد وقال الثوري وأبو حنيفة لا بأس به إذا لم يضر ذلك بالإسلام وأهله وقرأ ابن كعب قول شعيب عن قومه في التصرف في أموالهم ما يشاءون ⁦(سورة هود)⁩ على أنه قطع الدراهم."
  en: "The zuyuf were Ajam-struck dirhams, adulterated — Ibn Mas'ud ordered them broken and sold his own baqiyya at a discount till Umar forbade it and he lent it out; Umar and Uthman melted whatever zuyuf the bayt al-mal held into silver. Umar II jailed a man striking off the sultan's die and threw his iron in the fire; Abd al-Malik took another and meant to cut his hand before punishing otherwise — Medina's elders approved. Marwan ibn al-Hakam had cut a dirham-cutter's hand — Zayd ibn Thabit: 'he punished him' — and Aban ibn Uthman at Medina lashed the cutter thirty and paraded him, that for one who hollowed dirhams and salted them with counterfeits. On cutting full-weight dirhams the jurists split: Malik and Ibn Abi Dhi'b disliked and forbade it as corruption; al-Thawri and Abu Hanifa saw no harm where it did not injure Islam and its people — and Ibn Ka'b read Shu'ayb's people's claim to do as they would in their wealth (Hud) as the cutting of dirhams."
  es: "Los zuyuf eran dirhams acuñados por Ajam, adulterados; Ibn Mas'ud ordenó que se rompieran y vendió su propia baqiyya con descuento hasta que Umar lo prohibió y la prestó; Umar y Uthman fundieron en plata todos los zuyuf que tenía el bayt al-mal. Umar II encarceló a un hombre que golpeaba el dado del sultán y arrojó su hierro al fuego; Abd al-Malik tomó a otro y pretendía cortarle la mano antes de castigarlo de otra manera; los ancianos de Medina lo aprobaron. Marwan ibn al-Hakam le había cortado la mano a un cortador de dirhams —Zayd ibn Thabit: 'lo castigó'— y Aban ibn Uthman en Medina azotó al cortador treinta y lo exhibió, eso por ahuecar dirhams y salarlos con falsificaciones. Sobre la división de dirhams de peso completo, los juristas se dividieron: Malik e Ibn Abi Dhi'b lo desaprobaron y lo prohibieron por considerarlo corrupción; al-Thawri y Abu Hanifa no vieron ningún problema donde no perjudicara al Islam y a su gente, e Ibn Ka'b interpretó la pretensión de la gente de Shu'ayb de hacer lo que quisieran con su riqueza (Hud) como la división de dirhams."
  fr: "Les zuyuf étaient des dirhams frappés à la manière d'Ajam, falsifiés. Ibn Mas'ud ordonna qu'ils soient brisés et vendit sa propre baqiyya à prix réduit jusqu'à ce qu'Umar l'interdise et qu'il la prête. Umar et Uthman fondirent en argent tous les zuyuf que le bayt al-mal détenait. Umar II emprisonna un homme qui avait frappé le coin du sultan et jeta son fer au feu. Abd al-Malik en arrêta un autre et avait l'intention de lui couper la main avant de le punir autrement; les anciens de Médine approuvèrent. Marwan ibn al-Hakam avait coupé la main d'un tailleur de dirhams – Zayd ibn Thabit: « il le punit » – et Aban ibn Uthman, à Médine, fouetta le tailleur trente fois et le fit défiler, pour avoir évidé des dirhams et les avoir falsifiés. Sur la question de la découpe de dirhams de poids normal, les juristes se divisèrent: Malik et Ibn Abi Dhi'b désapprouvaient et l'interdisaient, la considérant comme une corruption. al-Thawri et Abu Hanifa ne voyaient aucun mal là où cela ne nuisait pas à l'Islam et à son peuple — et Ibn Ka'b a interprété la revendication du peuple de Shu'ayb de faire ce qu'ils voulaient de leurs richesses (Hud) comme la réduction des dirhams."
