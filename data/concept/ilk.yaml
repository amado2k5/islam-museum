summary:
  ar: "العلك في الكتاب ما تقدم ذكره من علك الأنباط والراتينج وعلك السرو في مواضعها، حار محلل، أحره علك الأنباط ثم علك السرو ثم الراتينج {cite:canon-ibn-sina-print-v1 p.610}"
  en: "Ilk is in the book the gums already discussed in their places, the gum of the Anbat, the resin and the gum of the cypress, hot and dissolving, the hottest being the gum of the Anbat, then that of the cypress, then the resin {cite:canon-ibn-sina-print-v1 p.610}"
  ur: "علک کتاب میں وہ گوندیں ہیں جن کا ذکر اپنے مقامات پر ہو چکا، علک الانباط، راتینج اور سرو کی گوند، گرم اور گھلانے والی، سب سے زیادہ گرم علک الانباط ہے، پھر سرو کی گوند، پھر راتینج {cite:canon-ibn-sina-print-v1 p.610}۔"
  es: "En el libro se mencionan las gomas ya tratadas en sus respectivos lugares: la goma del Anbat, la resina y la goma del ciprés, calientes y disolventes, siendo la más caliente la goma del Anbat, seguida de la del ciprés y, finalmente, la resina. {cite:canon-ibn-sina-print-v1 p.610}"
  fr: "Ilk est dans le livre les gommes déjà mentionnées à leur place, la gomme de l'Anbat, la résine et la gomme du cyprès, chaudes et solubles, la plus chaude étant la gomme de l'Anbat, puis celle du cyprès, puis la résine {cite:canon-ibn-sina-print-v1 p.610}"
