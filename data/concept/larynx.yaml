label: { ar: "الحنجرة عند ابن سينا", en: "The larynx in the Canon", ur: "قانون میں حنجرہ", es: "La laringe en el canon", fr: "Le larynx dans le canon", tr: "İbn Sina'ya göre gırtlak", id: "Laring menurut Ibn Sina" }
summary:
  ar: "الحنجرة عضو غضروفي خُلق آلة للصوت، مؤلف من ثلاثة غضاريف، وأمامها عظم لامي يخرج منه ليف عضلها {cite:canon-ibn-sina-print-v1 pp.65-66}."
  en: "The larynx is a cartilaginous organ made as an instrument of the voice, built of three cartilages, with a lam-shaped bone before it from which the fibres of its muscles arise {cite:canon-ibn-sina-print-v1 pp.65-66}."
  es: "La laringe es un órgano cartilaginoso hecho como instrumento de la voz, construido por tres cartílagos, con un hueso en forma de lámina delante de ella del cual surgen las fibras de sus músculos {cite:canon-ibn-sina-print-v1 pp.65-66}."
  fr: "Le larynx est un organe cartilagineux conçu comme instrument de la voix, constitué de trois cartilages, avec un os en forme de lame devant lui d'où proviennent les fibres de ses muscles {cite:canon-ibn-sina-print-v1 pp.65-66}."
  ur: "larynx ایک کارٹیلاجینس عضو ہے جو آواز کے آلہ کے طور پر بنایا جاتا ہے، جو تین کارٹلیجز سے بنا ہوتا ہے، اس کے آگے ایک لام کی شکل کی ہڈی ہوتی ہے جس سے اس کے پٹھوں کے ریشے نکلتے ہیں۔"
  tr: "Gırtlak, üç kıkırdaktan oluşan bir ses makinesi oluşturan kıkırdak bir organdır ve önünde kas lifinin çıktığı bir hyoid kemik bulunur {cite:canon-ibn-sina-print-v1 s.65-66}."
  id: "Laring adalah organ tulang rawan yang membentuk mesin suara, terdiri dari tiga tulang rawan, dan di depannya terdapat tulang hioid dari mana serat ototnya muncul {cite:canon-ibn-sina-print-v1 hlm.65-66}."
