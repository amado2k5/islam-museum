label:
  ar: "قِيمَة"
  en: "Value (qima)"
  ur: "قیمت (قیمہ)"
summary:
  ar: "القيمة في اللغة ثمن الشيء بالتقويم، وفي الاصطلاح ما يُقوَّم به الشيء بمنزلة المعيار من غير زيادة ولا نقصان، فتُفرّق عن الثمن الذي يقع به التراضي، وعن السعر الذي يحدده البائع أو السلطان. وتجب القيمة في الأشياء القيمية إذا وجب ضمانها، وعند تعذر المثل في المثليات، وفي المبيع المفسوخ للاختلاف في الثمن، وفي الصيد المملوك إذا قتله المحرم فيضمن بالقيمة لمالكه وبالمثل لحق الله. واختلف الفقهاء في وقت اعتبار القيمة، فالحنفية والمالكية يعتبرونها يوم القبض أو يوم الغصب، والحنابلة يعتبرونها يوم التلف، والشافعية يعتبرون أقصى القيم من القبض إلى التلف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13149} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13151} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13152} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13153} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13155}"
  en: "In the lexicon qima is the price of a thing as assessed. The jurists define it as what a thing is valued at, serving as a measure with no addition or reduction. It is distinct from thaman (the price agreed by the parties) and si'r (the price set by a seller or ruler). Value is owed for things that have no equivalent in kind (qimi) when they must be made good, when an equivalent cannot be had for a fungible item (mithli), in a sale annulled over a dispute about price, and for a hunting animal killed in the sacred state, where the owner receives its value and God the like. The schools differ on the time at which value is fixed: the Hanafis and Malikis use the day of receipt or of usurpation, the Hanbalis the day of loss, and the Shafi'is the highest value from receipt to loss. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13149} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13151} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13152} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13153} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13155}"
  ur: "لغت میں قیمت کسی چیز کی لگائی ہوئی قدر ہے، اور اصطلاح میں وہ معیار جس سے کوئی چیز بغیر کمی بیشی کے جانچی جائے۔ یہ ثمن (جس پر فریقین راضی ہوں) اور سعر (جو بائع یا حاکم مقرر کرے) سے الگ ہے۔ قیمت ان چیزوں میں واجب ہوتی ہے جن کی مثل نہیں ہوتی (قیمی) جب ان کا ضمان لازم ہو، اور مثلی چیز کی مثل نہ ملنے پر، اور اختلافِ ثمن کی وجہ سے فسخ ہونے والی بیع میں، اور احرام کی حالت میں مملوک شکار قتل کرنے پر، جس میں مالک کو قیمت اور اللہ کے حق میں مثل دیا جاتا ہے۔ قیمت کے تعین کے وقت میں فقہاء کا اختلاف ہے: حنفیہ اور مالکیہ قبضے یا غصب کے دن، حنابلہ تلف ہونے کے دن، اور شافعیہ قبضے سے تلف تک کی سب سے زیادہ قیمت کا اعتبار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13149} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13150} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13151} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13152} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13153} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13154} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13155}"
