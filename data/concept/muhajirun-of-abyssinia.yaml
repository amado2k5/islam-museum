id: concept/muhajirun-of-abyssinia
class: concept
kind: social
label: { ar: "مهاجرة الحبشة", en: "The emigrants to Abyssinia", es: "Los emigrantes a Abisinia", fr: "Les émigrants en Abyssinie", ur: "حبشہ کی طرف ہجرت کرنے والے", tr: "Habeşistanlı göçmen", id: "Imigran Abyssinia" }
summary:
  ar: "تسمية ابن إسحاق لأصحاب النبي الذين هاجروا إلى أرض الحبشة، ويقسمهم في السيرة بحسب عودتهم: من حُمل في السفينتين إلى خيبر، ومن قدم بعد بدر أو بعد ذلك أو هلك بالحبشة، ثم النساء والمولودون هناك."
  en: "Ibn Ishaq's term for the Companions who emigrated to Abyssinia; the sira groups them by how they returned: those carried to Khaybar on the two ships, those who arrived after Badr or later, and those who died in Abyssinia, then the women and those born there."
  es: "El término que Ibn Ishaq utilizaba para referirse a los Compañeros que emigraron a Abisinia; la sira los agrupa según cómo regresaron: los que fueron llevados a Khaybar en los dos barcos, los que llegaron después de Badr o más tarde, y los que murieron en Abisinia, y luego las mujeres y los que nacieron allí."
  fr: "Le terme employé par Ibn Ishaq pour désigner les Compagnons qui ont émigré en Abyssinie; la sira les regroupe selon la manière dont ils sont revenus: ceux qui ont été transportés à Khaybar sur les deux navires, ceux qui sont arrivés après Badr ou plus tard, et ceux qui sont morts en Abyssinie, puis les femmes et ceux qui y sont nés."
  ur: "حبشہ کی طرف ہجرت کرنے والے صحابہ کے لیے ابن اسحاق کی اصطلاح؛ سیرت ان کو اس لحاظ سے گروپ کرتی ہے کہ وہ کیسے لوٹے: وہ لوگ جو دو بحری جہازوں پر خیبر لے گئے، وہ جو بدر کے بعد یا بعد میں پہنچے، اور جو حبشہ میں فوت ہوئے، پھر وہ عورتیں اور وہاں پیدا ہونے والے۔"
  tr: "İbn İshaq'ın, Habeşistan'a göç eden Peygamber'in sahabelerinin isimlerini koyması ve onları dönüşlerine göre ayırması: iki gemiyle Haybar'a taşınanlar, Bedr'den sonra veya sonrasında gelenler, ya da Habeşistan'da ölenler, ardından kadınlar ve orada doğanlar."
  id: "Ibn Ishaq menyebut sahabat Nabi yang bermigrasi ke Abyssinia, dan membagi mereka sesuai dengan kembalinya: mereka yang dibawa oleh dua kapal ke Khaybar, mereka yang tiba setelah Badr atau setelahnya, atau meninggal di Abyssinia, lalu wanita dan mereka yang lahir di sana."
