summary:
  ar: "الحرف، وهو في هامش المحقق حبّ الرشاد؛ أجوده البابلي، وهو حار يابس في الثالثة، يسخّن ويحلّل وينضج، ويُذكر له نفع في الأورام البلغمية والجرب والقوابي وعرق النسا وأوجاع الصدر والربو والكبد والطحال، ومنه مُعلَّمات في الرحم والطمث."
  en: "Harf, which the editor's footnote identifies as hab al-rashad, is best from Babylon. It is hot and dry in the third degree, warming, dissolving and ripening. The book lists uses for phlegmy swellings, scabies, ulcers, sciatica, chest pains, asthma, the liver and the spleen, and some womb and menses claims as labelled listings."
  ur: "حرف، جسے محقق کے حاشیے میں حب الرشاد کہا گیا ہے، بابل کا بہترین ہے؛ یہ تیسرے درجے میں گرم اور خشک ہے، گرم کرتا، تحلیل اور پکاتا ہے۔ کتاب بلغمی سوجن، جرب، قوابی، عرق النسا، سینے کے درد، دمہ، جگر اور تلی کے فوائد درج کرتی ہے، اور رحم و حیض کے کچھ دعوے مُعلَّم فہرست ہیں۔"
  es: "El harf, que la nota al pie del editor identifica como hab al-rashad, es el mejor de Babilonia. Es cálido y seco, de tercer grado, con propiedades calentadoras, disueltas y de maduración. El libro enumera sus usos para inflamaciones con flemas, sarna, úlceras, ciática, dolores de pecho, asma, el hígado y el bazo, y algunos problemas uterinos y menstruales, según se indica en la lista."
