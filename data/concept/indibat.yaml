id: concept/indibat
class: concept
kind: term
label: { ar: "الانضباط", en: "Indibat (the controllability of a feature, as a condition for legal causes)" }
summary:
  ar: "الانضباط لغة من ضبط، والضبط الحفظ بالحزم، والضابطة القاعدة. والانضباط اصطلاحا الاندراج والانتظام تحت ضابط أي حكم كلي، فيكون الشيء معلوما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} ومن شروط العلة عند الأصوليين أن تكون وصفا منضبطا للحكمة، لا حكمة مجردة غير منضبطة، كالمشقة التي ضُبطت بمظنتها وهي السفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} وطرق انضباط الوصف المناسب ثلاثة: بنفسه، أو بالعرف، أو بالشرع بالمظنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3507} ومن أمثلته عند الفقهاء: انضباط المسلم فيه في السلم، وانضباط الجناية في قصاص ما دون النفس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3507}"
  en: "Indibat is not found in the older lexicons; the modern dictionary gives its verb from dabata, to hold firm, and it means in usage falling under a rule, a general judgement, so that a thing becomes known. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} Among the conditions of a cause for the usulis is that it be a controllable feature (wasf mundabit) of the wisdom, and not a bare wisdom that cannot be controlled, as hardship is controlled by its likely cause, travel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} A suitable feature is controlled in three ways: by itself, by custom, or by the law through its likely cause. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3507} Examples in fiqh include the controlled description of the goods in a forward sale (salam) and the controlled injury in retaliation for wounds short of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3507}"
