id: concept/ahd-allah
class: concept
kind: doctrine
label:
  ar: عهد الله والأيمان ومَن يشتري بها ثمناً قليلاً
  en: The covenant of God and oaths, and selling them for a little price
  fr: "L’alliance de Dieu et les serments, et leur vente à vil prix"
  es: "El pacto de Dios y los juramentos, y venderlos por un pequeño precio."
  ur: "خدا کا عہد اور قسمیں، اور انہیں تھوڑی قیمت پر بیچنا"
  tr: "Tanrı'nın antlaşması ve iman yeminleri ve bunu küçük bir bedele satın alan"
  id: "Perjanjian dan sumpah iman Tuhan, dan Dia yang membelinya dengan harga kecil"
summary:
  ar: "يرى الشعراوي أن الآية التي تتوعد من يشتري بعهد الله وأيمانه ثمناً قليلاً تشمل كل من يبيع آية من آيات الله لمنفعة، سواء وقعت في زمن معين أو في أي دين. ويذكر أن واقعة نزولها متعلقة بجماعة من أهل الكتاب أعلنت الإيمان ثم كفرت طمعاً فيما أعطيته من طعام وكسوة، ويقرأ معنى الخُلق بوصفه ملكة ترسخ في النفس {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1552}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1553}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1554}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1555}."
  en: "Sha'rawi holds that the verse threatening those who sell God's covenant and oaths for a small price applies to anyone who sells a sign of God for gain, in any age or religion. He says the occasion of its revelation concerned a group of the People of the Book who professed faith and then denied it for food and clothing. He reads the word khuluq as a settled disposition in the soul {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1552}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1553}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1554}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1555}."
  fr: "Sha'rawi estime que le verset menaçant ceux qui vendent l’alliance de Dieu et les serments à vil prix s’applique à quiconque vend un signe de Dieu pour en tirer profit, à toute époque et dans toute religion. Il dit que la circonstance de sa révélation concernait un groupe des Gens du Livre qui avaient professé la foi puis l’avaient reniée pour de la nourriture et des vêtements. Il lit le mot khuluq comme une disposition établie dans l’âme {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1552}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1553}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1554}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1555}."
  es: "Sha'rawi sostiene que el versículo que amenaza a quienes venden el pacto y los juramentos de Dios por poco dinero se aplica a cualquiera que venda una señal de Dios por lucro, en cualquier época o religión. Afirma que la ocasión de su revelación se refería a un grupo de la Gente del Libro que profesaba la fe y luego la negaba a cambio de comida y ropa. Interpreta la palabra khuluq como una disposición firme en el alma {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1552}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1553}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1554}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1555}."
  ur: "شعراوی کا خیال ہے کہ خدا کے عہد اور قسموں کو معمولی قیمت پر بیچنے والوں کو دھمکی دینے والی آیت کا اطلاق ہر اس شخص پر ہوتا ہے جو کسی بھی زمانے یا مذہب میں فائدہ کے لیے خدا کی نشانی بیچتا ہے۔ وہ کہتے ہیں کہ اس کے نزول کے موقع پر اہل کتاب کے ایک گروہ کا تعلق تھا جس نے ایمان کا اقرار کیا اور پھر کھانے اور لباس کے لیے اس کا انکار کیا۔ اس نے روح میں خلوص کے لفظ کو پڑھا ہے صفحہ 1554 {حوالہ:تفسیر-شعروی-خواطر-سکین-جلد-2 صفحہ 1555}۔"
  tr: "Al-Shaarawi, Tanrı'nın antlaşmasını ve yeminlerini küçük bir bedele satın alanları tehdit eden ayetin, Tanrı'nın herhangi bir işaretini kâr amacıyla satan herkesi kapsadığına, ister belirli bir zamanda ister herhangi bir dinde olsun, inandığını belirtir. Vahiy olayının, iman ilan eden ancak sonra kendilerine verilen yiyecek ve giysi umuduyla inanmayan bir grup Kitap ahliyetiyle ilgili olduğunu belirtir. Yaratılışın anlamını, ruhta kök salan bir yetenek olarak yorumlar {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1552}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1555}{cite:tafsir-sharawi-khawatir-scan-vol-2 s.1555}."
  id: "Al-Shaarawi menyatakan bahwa ia percaya ayat yang mengancam mereka yang membeli perjanjian dan sumpah Allah dengan harga kecil mencakup siapa pun yang menjual tanda Tuhan demi keuntungan, baik pada waktu tertentu maupun dalam agama apa pun. Ia menyatakan bahwa peristiwa wahyu menyangkut sekelompok orang yang mengaku beriman tetapi tidak percaya pada harapan makanan dan pakaian yang diberikan kepada mereka kemudian. Ia menafsirkan makna penciptaan sebagai bakat yang berakar pada jiwa {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1552}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1555}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1555}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1555} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1555}"
