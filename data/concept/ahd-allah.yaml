issue:
  ar: "هل تشمل الآية واقعة بعينها، أم كل من يبيع الحق بعرض من الدنيا؟"
  en: "Does the verse apply only to one occasion, or to everyone who sells the truth for worldly gain?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-general-application
  stance:
    ar: "العبرة بعموم اللفظ لا بخصوص السبب"
    en: "The lesson lies in the general wording, not in the particular occasion"
  summary:
    ar: "يقرر الشعراوي أن العبرة بعموم الموضوع لا بخصوص السبب، فكل من يشتري بآيات الله ثمناً قليلاً تنطبق عليه الآية، وأن من يطمس حكماً من أحكام الله ليبدو عصرياً يدخل فيها {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1553}."
    en: "Sha'rawi holds that the lesson lies in the general subject and not in the particular cause. Anyone who buys a sign of God for a small price falls under the verse, and so does one who erases a ruling of God to appear modern {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1553}."
