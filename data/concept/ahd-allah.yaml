label:
  ar: عهد الله والأيمان ومَن يشتري بها ثمناً قليلاً
  en: The covenant of God and oaths, and selling them for a little price
summary:
  ar: "يرى الشعراوي أن الآية التي تتوعد من يشتري بعهد الله وأيمانه ثمناً قليلاً تشمل كل من يبيع آية من آيات الله لمنفعة، سواء وقعت في زمن معين أو في أي دين. ويذكر أن واقعة نزولها متعلقة بجماعة من أهل الكتاب أعلنت الإيمان ثم كفرت طمعاً فيما أعطيته من طعام وكسوة، ويقرأ معنى الخُلق بوصفه ملكة ترسخ في النفس {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1552}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1553}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1554}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1555}."
  en: "Sha'rawi holds that the verse threatening those who sell God's covenant and oaths for a small price applies to anyone who sells a sign of God for gain, in any age or religion. He says the occasion of its revelation concerned a group of the People of the Book who professed faith and then denied it for food and clothing. He reads the word khuluq as a settled disposition in the soul {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1552}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1553}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1554}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1555}."
