id: concept/small-group-victory-over-many
class: concept
kind: belief
label: { ar: "غلبة القلة على الكثرة بإذن الله", en: "Small groups overcoming large ones by God's leave", ur: "اللہ کے حکم سے قلیل کی کثیر پر فتح", es: "Pequeños grupos venciendo a grandes grupos con el permiso de Dios", fr: "Des petits groupes qui triomphent des grands par la grâce de Dieu", tr: "Tanrı izin vererek azlığın çoğunun üstünlüğü", id: "Dominasi sedikit orang atas banyak, jika Allah mengizinkan" }
summary:
  ar: "يرى الشعراوي أن الغلبة لا تقاس بالعدد بل بالرصيد الإيماني والصبر، وأن الفئة المؤمنة إذا صبرت على المشقة استحقت العون، وأن تقسيم الناس إلى من خاف ومن لم يخف يعود إلى الصلة بالله {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1055} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1056}."
  en: "Sha'rawi holds that victory is measured not by numbers but by faith and patience. A believing group that endures hardship earns help, and the division between those who feared and those who did not returns to their bond with God {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1055} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1056}."
  ur: "شعراوی کے نزدیک فتح تعداد سے نہیں بلکہ ایمانی سرمائے اور صبر سے ناپی جاتی ہے۔ صبر کرنے والا مومن گروہ مدد کا مستحق بنتا ہے، اور خوف اور بے خوفی کا فرق اللہ سے تعلق میں ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1055} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1056}۔"
  es: "Sha'rawi sostiene que la victoria no se mide por números, sino por fe y paciencia. Un grupo creyente que soporta las dificultades obtiene ayuda, y la división entre los que temieron y los que no, regresa a su vínculo con Dios {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1055} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1056}."
  fr: "Sha'rawi soutient que la victoire ne se mesure pas au nombre, mais à la foi et à la patience. Un groupe de croyants qui endure les épreuves obtient de l'aide, et la division entre ceux qui ont craint et ceux qui n'ont pas craint s'estompe, les ramenant à leur relation avec Dieu."
  tr: "El-Şaarawi, zaferin sayıyla değil, inanç ve sabır gücüyle ölçüldüğüne, inanan grubun zorluklara dayanırsa yardımı hak ettiğine, insanları korkanlar ve korkmayanlar olarak ayırmanın Tanrı ile bağlantıya geri döndüğüne inanır {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 s.1044} {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 s.1055} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1056}."
  id: "Al-Shaarawi percaya bahwa kemenangan tidak diukur dengan jumlah, melainkan dengan kekuatan iman dan kesabaran, dan bahwa kelompok yang beriman layak mendapat bantuan jika mereka bertahan dalam kesulitan, dan bahwa membagi orang menjadi yang takut dan yang tidak kembali terhubung dengan Tuhan {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1044} {cite:tafsir-sharawi-khawatir-scan-scan-vol-2 hlm.1055} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1056}."
