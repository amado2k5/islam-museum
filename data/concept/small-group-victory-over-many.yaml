id: concept/small-group-victory-over-many
class: concept
kind: belief
label: { ar: "غلبة القلة على الكثرة بإذن الله", en: "Small groups overcoming large ones by God's leave", ur: "اللہ کے حکم سے قلیل کی کثیر پر فتح" }
summary:
  ar: "يرى الشعراوي أن الغلبة لا تقاس بالعدد بل بالرصيد الإيماني والصبر، وأن الفئة المؤمنة إذا صبرت على المشقة استحقت العون، وأن تقسيم الناس إلى من خاف ومن لم يخف يعود إلى الصلة بالله {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1055} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1056}."
  en: "Sha'rawi holds that victory is measured not by numbers but by faith and patience. A believing group that endures hardship earns help, and the division between those who feared and those who did not returns to their bond with God {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1055} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1056}."
  ur: "شعراوی کے نزدیک فتح تعداد سے نہیں بلکہ ایمانی سرمائے اور صبر سے ناپی جاتی ہے۔ صبر کرنے والا مومن گروہ مدد کا مستحق بنتا ہے، اور خوف اور بے خوفی کا فرق اللہ سے تعلق میں ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1044} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1055} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1056}۔"
