id: concept/kawwa-fiqh
class: concept
kind: legal
label:
  ar: "الكُوّة"
  en: "Niche or opening in a wall (kawwa)"
  ur: "کوۃ (دیوار کا روزن)"
summary:
  ar: "الكوة في اللغة الثقبة في الحائط، وتجمع على كوات وكُوى، ويطلق عليها الروشن؛ وفي الاصطلاح ما يُفتح في حائط البيت لأجل الضوء، أو ما يُخرَق فيه بلا نفاذ لوضع المتاع ونحوه، وفسرها بعض الفقهاء بالطاقة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13547}."
  en: "Kawwa, in lexicon, is a hole in a wall, plural kawat or kuwa, also called rawshan; in law it is an opening made in the wall of a house for light, or a recess cut into it without passing through, for setting goods; some jurists explain it as a niche {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13547}."
  ur: "کوۃ لغت میں دیوار میں سوراخ کو کہتے ہیں، جمع کوات اور کُوی ہے، اور اسے روشن بھی کہا جاتا ہے؛ اصطلاح میں یہ وہ روزن ہے جو روشنی کے لیے گھر کی دیوار میں کھولا جائے، یا وہ طاق جو سامان رکھنے کے لیے دیوار میں بنایا جائے مگر پار نہ ہو؛ بعض فقہاء نے اسے طاقچہ کے معنی میں لیا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13547}۔"
