id: "concept/al-tuta-fi-al-jafn"
class: "concept"
kind: "scientific"
label:
  ar: "التوتة في الجفن"
  en: "The tuta (mulberry-like flesh in the lid)"
  fr: "La tuta (excroissance en forme de mûre à l’intérieur de la paupière)"
  ur: "پلک میں توتہ"
  es: "La tuta (pulpa parecida a la de la mora en la tapa)"
  tr: "Göz kapağında dut"
  id: "Murbei di kelopak mata"
summary:
  ar: "التوتة لحم رخو يحدث في باطن الجفن فلا يزال يسيل منه دم أحمر وأسود وأخضر، وعلاجها التنقية بالمجففات الآكلة ثم الأدوية المنبتة للحم على ما يقال في قروح الأجفان {cite:canon-ibn-sina-print-v2 p.197}"
  en: "The tuta is soft flesh arising inside the eyelid, from which red, black and green blood keeps flowing; its treatment is cleansing with eating desiccants, then the flesh-growing medicines spoken of under the ulcers of the lids {cite:canon-ibn-sina-print-v2 p.197}"
  fr: "La tuta est une chair molle qui se forme à l’intérieur de la paupière et d’où s’écoule continuellement du sang rouge, noir et vert. Le Canon indique comme traitement un nettoyage par des dessiccatifs corrosifs, puis les remèdes destinés à faire repousser la chair, décrits à propos des ulcères des paupières {cite:canon-ibn-sina-print-v2 p.197}"
  ur: "توتہ پلک کے اندر پیدا ہونے والا نرم گوشت ہے جس سے سرخ، سیاہ اور سبز خون مسلسل بہتا رہتا ہے؛ اس کا علاج چبانے والے مجففات سے تنقیہ ہے، پھر وہ ادویہ جو پلک کے قروح کے باب میں گوشت اگانے کے لیے کہی گئی ہیں {cite:canon-ibn-sina-print-v2 p.197}۔"
  es: "La tuta es una carne blanda que surge dentro del párpado, de la cual fluye sangre roja, negra y verde; su tratamiento consiste en la limpieza mediante la ingesta de desecantes, seguida de las medicinas que hacen crecer la carne, mencionadas bajo las úlceras de los párpados {cite:canon-ibn-sina-print-v2 p.197}"
  tr: "Dut, göz kapağı içinde bulunan yumuşak bir ettir ve kırmızı, siyah ve yeşil kanın hâlâ aktığı yerdedir. Tedavisi, kuru gıdalarla arındırma, ardından herbisitler ve ardından et için ilaçların filizlenmesidir; bu, göz kapağı ülserlerinde belirtildiği gibi {cite:canon-ibn-sina-print-v2 s.197}"
  id: "Murbei adalah daging lunak yang ditemukan di dalam kelopak mata dan di sinilah darah merah, hitam, dan hijau masih mengalir. Pengobatannya adalah detoksifikasi dengan makanan kering, diikuti herbisida, dan kemudian tumbuh pestisida untuk daging; ini seperti yang ditunjukkan pada tukak kelopak mata {cite:canon-ibn-sina-print-v2 hlm.197}"
