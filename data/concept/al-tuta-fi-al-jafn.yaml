label:
  ar: "التوتة في الجفن"
  en: "The tuta (mulberry-like flesh in the lid)"
  ur: "پلک میں توتہ"
summary:
  ar: "التوتة لحم رخو يحدث في باطن الجفن فلا يزال يسيل منه دم أحمر وأسود وأخضر، وعلاجها التنقية بالمجففات الآكلة ثم الأدوية المنبتة للحم على ما يقال في قروح الأجفان {cite:canon-ibn-sina-print-v2 p.197}"
  en: "The tuta is soft flesh arising inside the eyelid, from which red, black and green blood keeps flowing; its treatment is cleansing with eating desiccants, then the flesh-growing medicines spoken of under the ulcers of the lids {cite:canon-ibn-sina-print-v2 p.197}"
  ur: "توتہ پلک کے اندر پیدا ہونے والا نرم گوشت ہے جس سے سرخ، سیاہ اور سبز خون مسلسل بہتا رہتا ہے؛ اس کا علاج چبانے والے مجففات سے تنقیہ ہے، پھر وہ ادویہ جو پلک کے قروح کے باب میں گوشت اگانے کے لیے کہی گئی ہیں {cite:canon-ibn-sina-print-v2 p.197}۔"
