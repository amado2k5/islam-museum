label: { ar: "خط التوقيع", en: "Tawqi' script", ur: "خطِ توقیع", es: "Guion de Tawqi", fr: "Écriture Tawqi'", tr: "imza satırı", id: "garis tanda tangan" }
summary:
  ar: "أحد الأقلام الستة الموزونة، قرين الرقاع الجليل، يتميز بوصل حروف لا توصل في غيره كالدال والألف، واستعمل في الوثائق الديوانية والخواتيم {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  en: "One of the six proportional pens, the large partner of riqa', marked by joining letters left unjoined in other scripts, such as dal and alif, and used for chancery documents and colophons {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  ur: "اقلامِ ستہ میں سے ایک، رقاع کا جلی جوڑی دار، جس میں دال اور الف جیسے وہ حروف جڑتے ہیں جو دوسرے خطوں میں نہیں جڑتے؛ دیوانی دستاویزات اور ترقیموں میں برتا گیا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}۔"
  es: "Una de las seis plumas proporcionales, la compañera grande de riqa', marcada por la unión de letras que quedan sin unir en otras escrituras, como dal y alif, y utilizada para documentos de cancillería y colofones {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  fr: "L'une des six plumes proportionnelles, le grand partenaire du riqa', marqué par la liaison de lettres laissées non liées dans d'autres écritures, telles que le dal et l'alif, et utilisé pour les documents de chancellerie et les colophons {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26}."
  tr: "Altı metreli kalemlerden biri, soylu kağıtların eşlikçisi olup, dal ve alif gibi başka yerlerde bağlantısı olmayan harflerle ayırt edilir ve gümrük belgeleri ile mühürlerde kullanılmıştır {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 s. 26}."
  id: "Salah satu dari enam pena berukur, companion of the noble papers, dibedakan dengan menghubungkan huruf-huruf yang tidak terhubung di tempat lain seperti dal dan alif, dan digunakan dalam dokumen bea cukai dan segel {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 hlm. 26}."
