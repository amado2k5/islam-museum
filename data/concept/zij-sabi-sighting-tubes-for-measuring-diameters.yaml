label: { ar: "قياس أقطار الأجرام بالعضادة والشطبتين", en: "Measuring the diameters of bodies with the sighting tubes", ur: "عضادہ اور دو شطبتین سے اجرام کے قطروں کی پیمائش" }
summary:
  ar: "لمن أراد أن يعرف قدر شيء من هذه الأقطار يتخذ عضادة ويركب فيها شطبتين مقورتين متقابلتين، ويجعل الثقب الذي يلي البصر صغيراً، والذي يلي الكوكب بقدر ما يجتمع فيه جرم الكوكب كله. ثم يقيس الشمس بمضادة أخرى على هذا القياس، فيعرف قطر الثقب الذي قاس به الشمس، ويقيسه إلى الثقب الذي قاس به الكوكب، ويكون القياس في موضع واحد من الأفق. {cite:zij-sabi-nallino-byblion pp.189-190}"
  en: "To find the size of one of these diameters a sighting arm is made with two curved tubes set opposite each other. The hole nearest the eye is small, and the hole at the body's end is large enough to take in the whole disc of the body. The Sun is then measured with a second arm in the same way, and the two holes are compared, the measurement being taken at one place on the horizon. {cite:zij-sabi-nallino-byblion pp.189-190}"
  ur: "کسی قطر کا اندازہ معلوم کرنے کے لیے ایک عضادہ بنایا جاتا ہے جس میں دو مڑی ہوئی شطبتیں آمنے سامنے لگی ہوں۔ آنکھ کے قریب والا سوراخ چھوٹا ہو، اور ستارے کی طرف والا اتنا بڑا کہ پورا جرم اس میں سما جائے۔ پھر اسی طرح ایک اور عضادے سے سورج ناپا جاتا ہے، اور دونوں سوراخوں کا موازنہ کیا جاتا ہے، پیمائش افق پر ایک ہی مقام سے کی جاتی ہے۔ {cite:zij-sabi-nallino-byblion pp.189-190}"
